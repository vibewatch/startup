companyProfile:
  summary: >-
    Emergent Cold LatAm is a Miami-linked cold-chain infrastructure platform founded in 2021 by Neal Rider and David
    Palfenier to modernize Latin America's fragmented temperature-controlled logistics market. The company sells
    integrated refrigerated and frozen warehousing, transportation-adjacent logistics, processing, picking,
    cross-docking, customs-linked handling, and other value-added cold-chain services for food, beverage, and
    pharmaceutical workflows. Public evidence supports an unusually rapid scale-up through acquisitions and greenfields:
    110 warehouses across 11 countries, large ongoing expansion activity, and major sponsorship from Stonepeak, Lineage,
    Losa, and a CPP-led lender group. The platform appears strategically important and operationally real, but still
    discloses far more about footprint and funding than about revenue, EBITDA, leverage, concentration, or exact current
    valuation.
