      - number: '4.2'
        title: The business model is asset-heavy and operationally unforgiving
        blocks:
          - type: paragraph
            body: >-
              Even without consolidated financial statements, the cost stack is visible conceptually. Cold storage is
              electricity-intensive, maintenance-heavy, and labor-sensitive; transport adds fuel, fleet, routing, and
              service reliability costs; multi-temperature operations, monitoring, food-safety controls, and
              customs-linked handling add process burden. Market reports and company operating content both reinforce
              that refrigeration energy, infrastructure quality, temperature deviations, and equipment performance are
              core economic variables. This is not a software-margin business; it is a physical network whose economics
              depend on density, asset utilization, route mix, and loss prevention.

              Capex intensity is also unmistakable. The company has completed many acquisitions, continued greenfields,
              and added advanced facilities such as Olivo automation and Chile blast-freezing infrastructure. Funding
              announcements explicitly tie fresh capital to acquisitions, development projects, and infrastructure
              standards. That supports growth ambition but also means the central financial question is return on that
              capital, not merely access to it. Public materials show a credible path to scale, but not yet a
              transparent path to mature returns.
