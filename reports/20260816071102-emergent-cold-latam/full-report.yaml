      - number: '2.3'
        title: Buyer, user, and payer segments are diverse but operationally coherent
        blocks:
          - type: paragraph
            body: >-
              The buyer map is heterogeneous but coherent. Food processors, protein exporters, dairy brands, fruit
              packers, foodservice distributors, modern retail chains, and import-export traders all buy into the same
              operational need: maintaining product integrity while moving goods through storage, transport, and
              fulfillment nodes. Company customer and logistics pages repeatedly emphasize proteins, frozen foods,
              dairy, food retail, and perishable import-export flows; GCCA market coverage likewise highlights exports,
              domestic distribution, and rising consumption as the core workload mix. In practice, the buyer is often a
              supply-chain, procurement, export, or operations lead, while the user is the warehouse, transport, or
              category team that feels spoilage, fill-rate, and compliance failures first.

              Budget ownership also differs by segment. Export-oriented agribusiness buyers care most about port
              connectivity, customs timing, and cold integrity during long transit legs. Foodservice and retail buyers
              focus more on inventory turns, availability, urban distribution reliability, and shrink reduction.
              Pharma-adjacent cold chain adds a higher-compliance segment with stronger willingness to pay but more
              exacting process expectations. These differences make the market segmented, not fragmented: the same core
              infrastructure is being purchased for distinct but related workflow outcomes.
            claimRefs:
