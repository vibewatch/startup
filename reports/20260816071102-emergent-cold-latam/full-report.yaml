            body: >-
              Emergent's public surfaces consistently point to a customer base organized by workflow rather than by
              consumer brand marketing. Retailers, foodservice customers, distributors, import-export flows, and
              large-scale perishable operators all appear repeatedly across the service pages. The customers page,
              foodservice and food-retail explainers, and large-scale-operations content all indicate that the company
