      - number: '2.2'
        title: Sizing lenses show a large market but weak consensus precision
        blocks:
          - type: paragraph
            body: >-
              Multiple external sources confirm that Latin American cold-chain demand is already measured in the
              billions of dollars, but they disagree materially on scale because they use different scopes. Market Data
              Forecast places the regional market at US$20.06 billion in 2025, US$21.66 billion in 2026, and US$39.97
              billion by 2034. Mordor Intelligence, using a narrower “cold chain logistics” framing, estimates US$5.87
              billion in 2025 and US$10.15 billion by 2030. Those figures should not be averaged mechanically; instead,
              they should be treated as different sizing lenses for a sector whose boundary can include infrastructure,
              refrigerated transport, value-added services, or broader cold-chain workflows.

              The better underwriting anchor is that every reviewed source points to real scale and sustained growth.
              Market Data Forecast and Mordor both project high-single- to low-double-digit growth, GCCA trade coverage
              describes regional expansion in both domestic distribution and export-linked demand, and Emergent's own
              disclosures point to a network already large enough to justify regional consolidation. The practical
              conclusion is that TAM is comfortably large for several scaled winners, while methodology differences make
              false precision a bigger risk than overestimating category relevance.
