      - number: '8.3'
        title: Scenario ranges are wide because disclosure uncertainty is still the dominant variable
        blocks:
          - type: paragraph
            body: >-
              The valuation range should be framed around what diligence might reveal about revenue scale, margin
              quality, and concentration after Comfrio. In a bull case, Emergent proves that the combined platform has
              converted physical scale into high utilization, cross-sell, and durable customer economics, justifying a
              premium multiple to public comps. In a base case, the company remains strategically strong but
              economically closer to listed cold-chain operators than to software infrastructure names. In a bear case,
              integration friction, country concentration, debt overhang, or weaker-than-assumed revenue scale push the
              business back toward public-like or even discounted multiples.

              That logic makes entry discipline straightforward. A price in the low-billion to mid-billion range can be
              fair if diligence supports a post-Comfrio revenue base in the high hundreds of millions and at least
              stable mid-single-digit operating economics. A valuation materially above roughly US$2.5 billion would
              require evidence the public corpus does not currently provide—namely unusually strong margins, very rapid
              organic growth, or exceptional retention and concentration quality. Because those proofs are still
              missing, scenario width must remain broad and the downside case must explicitly allow for valuation below
              the market-conventional unicorn narrative.
