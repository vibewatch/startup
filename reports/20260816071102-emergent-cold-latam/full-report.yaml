      - number: '7.4'
        title: Mitigation is visible, but the thesis still needs explicit kill criteria
        blocks:
          - type: paragraph
            body: >-
              Emergent does have real mitigation assets. The company repeatedly emphasizes operational standards,
              technology investment, and customer service; sustainability materials point to a multi-country compliance
              program and EDGE Zero Carbon certifications; automation and CO2-based freezing investments suggest
              management is not ignoring future efficiency and refrigerant pressures. Those signals matter because they
              indicate management is actively trying to standardize a fast-growing network rather than merely assembling
              assets. Competitive peers such as Americold also foreground automation and service breadth, which
              reinforces that Emergent is investing in the right categories.

              Still, a publication-grade diligence view cannot rely on mitigation rhetoric alone. The cleanest kill
              criteria are monitorable: serious facility-safety events, repeated temperature-control failures, customs
              or border delays that impair export lanes, covenant pressure after the 2025 term loan, measurable churn
              after Comfrio integration, or evidence that a few countries or customers dominate economics more than
              expected. Until diligence verifies incident history, country-level profitability, insurance, covenant
              headroom, and management succession depth, the right conclusion is not that the company is unsafe, but
              that the residual risk remains too high for complacent underwriting.
