      - number: '1.2'
        title: Founders, management bench, and governance posture
        blocks:
          - type: paragraph
            body: >-
              Emergent Cold LatAm was founded by Neal Rider and David Palfenier, two executives with deep prior
              cold-storage operating experience. Rider serves as CEO and, according to the company culture page,
              previously co-founded Emergent Cold and AGRO Merchants Group and served as chief operating officer of
              Americold Logistics. Palfenier serves as president and previously led AGRO Merchants Group's Latin
              American operations and ConAgra Frozen Foods. The wider disclosed bench is materially stronger than a
              typical startup's: Pedro Moreira is CFO, Mike Bender is general counsel and chief compliance officer,
              Ricardo Jacob leads operations, Rafa Rocha leads commercial activities, Adam Rushby leads network
              optimization, and regional managing directors oversee Andean, South Cone, and Mexico/Caribbean operations.

              The governance disclosure is still narrower than the scale disclosure. The sustainability page says the
              company has a board of directors, an executive leadership team, solid financial management, and a
              compliance program present in all 11 countries, but it does not publish a detailed board roster or
              committee structure in the reviewed source set. That means diligence comfort comes more from management
              pedigree and the institutional quality of the investor/advisor base than from line-item public governance
              reporting. Key-person exposure is meaningful: Rider is still the central strategic voice, acquisition pace
              remains management dependent, and many differentiating claims—expansion discipline, technology standards,
              and network build quality—are heavily associated with a relatively small senior team.
