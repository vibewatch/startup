            body: >-
              Emergent's moat is believable but conditional. It has real strengths: regional footprint, a broad
              food-cold-chain service stack, acquisition-driven density, and a category-specific narrative around
              integrated temperature-controlled logistics. Those strengths likely make it stronger than fragmented local
              warehouse operators and give it an advantage over single-country rivals when customers need multi-market
              execution. They also improve procurement credibility with food manufacturers, exporters, retailers, and
              foodservice operators that would prefer one regional operator where possible.

              The harder question is whether that moat is durable against capital-rich or globally branded rivals.
              CompaniesMarketCap data imply that listed comparables such as Lineage and Americold operate with much
              larger public-market enterprise visibility than Emergent discloses publicly. NewCold markets automation
              and digital integration aggressively. Americold and Lineage benefit from global specialist recognition.
              Emergent can still win in Latin America, but the burden of proof is on execution density, service quality,
