  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Public valuation support exists, but the correct framework is scenario-based rather than precise
        blocks:
          - type: paragraph
            body: >-
              The public record makes two things clear at once. First, Emergent is not a speculative concept company:
              official, partner, legal, and trade sources all support a large regional platform with 110 warehouses
              across 11 countries, repeated acquisition-led expansion, and more than US$1.2 billion of equity plus a
              2025 term loan. Second, none of those same sources publishes the key variables needed for a clean current
              mark—revenue, EBITDA, free cash flow, leverage, country mix, or a precise current post-money valuation.
              That combination rules out false precision. The right public-only valuation method is therefore a
              scenario-based framework anchored to strategic scale, disclosed financing, and public cold-chain
              comparables rather than a claimed “true” intrinsic value.

              That framework should also distinguish between plausibility and supportability. The capital history and
              physical footprint make unicorn status plausible. But funding raised is not the same as enterprise value,
              and regional leadership is not the same as a validated multiple. Valuation support becomes materially
              stronger only if diligence proves that the enlarged post-Comfrio platform produces a revenue base and
              margin structure deserving at least a modest premium to public peers. Without that confirmation, the
              prudent stance is to keep the recommendation in track or research-more territory rather than promote a buy
              call simply because the company is impressive operationally.
            claimRefs:
              - CV001
