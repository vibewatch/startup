      - number: '8.2'
        title: Public comparables support respect for the business, but not a large undisclosed premium
        blocks:
          - type: paragraph
            body: >-
              The most useful public anchors are cold-chain leaders Americold and Lineage. Americold's August 2026
              market cap is about US$4.26 billion on roughly US$2.60 billion of revenue and a reported P/S ratio of
              1.65x. Lineage's August 2026 market cap is about US$10.38 billion on roughly US$5.36 billion of revenue,
              implying a public sales multiple of roughly 1.9x even before adjusting for debt. Those are not distressed
              levels, but they are far below the kinds of software-like revenue multiples that growth investors might
              instinctively apply to a private “platform” narrative. Public profitability evidence also remains mixed:
              Americold's operating margin is only about 0.42% and Lineage's reported TTM operating margin is negative.
              Both companies also carry negative reported P/E ratios in the reviewed data, reinforcing that scale alone
              does not guarantee clean earnings quality.

              This matters for Emergent because the company is not obviously a software business hiding inside cold
              storage. It is an infrastructure-heavy operator with technology and workflow differentiation. That can
              deserve some premium to mature public comps if growth, density, and integration quality are superior. But
              absent disclosed financials, the public market evidence argues for a moderate premium at most—not an
              aggressive leap to a richly priced growth multiple. Americold's dividend yield also suggests that public
              investors partly value cold-chain leaders for resilient cash characteristics, which again pushes the
              underwriting lens toward disciplined operating economics rather than a pure scarcity narrative.
            claimRefs:
