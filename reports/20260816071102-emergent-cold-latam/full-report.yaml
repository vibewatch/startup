      - number: '3.2'
        title: Capability comparison across network, service breadth, and specialization
        blocks:
          - type: paragraph
            body: >-
              Emergent's service stack compares well against regional specialists. Its published offer spans storage,
              transportation, customs warehousing, blast freezing, cross-docking, processing, and container-loading
              support across 11 countries, which is broader than the simple homepage positioning visible for most local
              specialists in the fetched corpus. Frialsa clearly presents itself as a leading cold-chain logistics
              network; SuperFrio emphasizes expansion in regions lacking refrigerated infrastructure; Polarport centers
              on cold storage and services; and IceStar appears oriented toward port and consumption-market flows in
              Chile and Colombia. Those are serious competitive positions, but they do not obviously match Emergent's
              regional cross-country scope in the reviewed public set.

              Against global incumbents, the comparison flips. NewCold emphasizes automation, ERP integration,
              traceability, and resilience at scale. Americold presents a global facilities network and specialized
              solutions. Lineage pairs a large worldwide operating network with public-company-scale financial
              visibility. Emergent therefore looks strongest where Latin America-specific execution and regional
              footprint matter most, and weakest where the buyer values global specialist branding, automation depth, or
              listed-company transparency above local operating breadth.
