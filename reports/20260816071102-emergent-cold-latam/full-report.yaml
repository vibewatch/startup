      - number: '3.3'
        title: Pricing opacity, multi-vendor buying, and switching cost
        blocks:
          - type: paragraph
            body: >-
              Public pricing remains opaque across the category. None of Emergent, Frialsa, SuperFrio, Polarport,
              IceStar, Americold, or Lineage publish a standardized enterprise cold-chain rate card in the reviewed
              material. Instead, their public surfaces emphasize contact-led sales, facilities, network coverage,
              integrated services, and service quality. That usually means buyers compare providers using lane
              economics, spoilage reduction, handling complexity, network reach, and operational trust rather than
              posted list price. In that sense, the market still behaves more like industrial services than software.

              Switching costs are meaningful but not absolute. Once a customer has integrated storage, transport
              calendars, monitoring expectations, and facility workflows with one provider, moving the entire account is
              operationally painful. But buyers can still multi-home by country, lane, temperature band, or use case. A
              customer could use Emergent regionally while also retaining Frialsa in Mexico, Polarport for Veracruz
              import corridors, or a global player for multinational procurement. The commercial contest is therefore
              not all-or-nothing; it is about winning dense, sticky workflow share without assuming exclusive control of
              all cold-chain spend.
