  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, legal, and environmental exposure rises with multi-country scale
        blocks:
          - type: paragraph
            body: >-
              Emergent now operates a food-sensitive logistics network across 11 Latin American countries, which means
              regulatory exposure is not a side issue but part of the product itself. WHO, PAHO, FDA, and WTO materials
              all reinforce the same point: food trade depends on strong control systems, inspections, documentation,
              and border-clearance discipline. Emergent's own service pages show that its workflows extend beyond simple
              storage into processing, picking, cross-docking, export-adjacent handling, and blast freezing, so a
              compliance failure could affect food integrity, customs timing, or customer trust simultaneously. The
              company does say it maintains a compliance program in all 11 countries, which is an important mitigation,
              but the public record does not enumerate licenses, audits, country-by-country permits, or a detailed
              incident history.

              Legal risk is less visible than operational risk, but that is partly a disclosure issue. The reviewed
              corpus does not surface active material litigation or enforcement actions, yet that absence should not be
              treated as proof that legal exposure is trivial. A network built through eighteen acquisitions,
              greenfields, and multi-country labor-intensive operations naturally creates exposure to environmental,
              labor, food-control, and contract disputes that public marketing pages will not fully describe.
              Environmental pressure is also real: regional market sources stress that energy intensity, refrigerant
              transition, and sustainability requirements can raise compliance costs even when demand remains strong.
            claimRefs:
              - CR001
              - CR002
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
