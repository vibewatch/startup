      - number: '8.4'
        title: The correct call is research-more with explicit price and diligence thresholds
        blocks:
          - type: paragraph
            body: >-
              The investment thesis is strong on market need, network relevance, and sponsor quality. Emergent is
              building in a region where cold-chain undercapacity, food-safety demands, export growth, and
              pharmaceutical requirements all support long-run demand. It also appears to be one of the few operators
              with enough capital and management pedigree to consolidate the market at scale. Those are real positives
              and they explain why the company can plausibly command a private valuation above many smaller regional
              peers.

              Even so, the decisive problem is not market quality but evidence quality. Revenue, EBITDA, leverage,
              cap-table preferences, top-customer mix, country mix, and post-acquisition performance remain too opaque
              for a clean buy recommendation. The best public-only stance is therefore research-more: stay engaged, set
              valuation guardrails, and demand a short list of decisive diligence materials. If those materials confirm
              strong economics, the company could justify a fair-to-attractive low-billion or mid-billion entry. If they
              do not, the same scarcity narrative that makes the company exciting could easily mask a stretched price.
