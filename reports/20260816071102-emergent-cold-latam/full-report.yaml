  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue streams and monetization are visible even if topline is not
        blocks:
          - type: paragraph
            body: >-
              The public service stack makes Emergent's revenue model legible even without a disclosed income statement.
              Warehousing, refrigerated transport, processing, picking, cross-docking, customs warehousing, blast
              freezing, and other value-added services all imply a mix of storage fees, transport charges, handling
              fees, throughput charges, export-support services, and bespoke enterprise contracts. The business does not
              look like a single-rate pallet landlord; it looks like a bundled temperature-controlled logistics operator
              whose monetization depends on utilization, lane mix, product mix, and value-added service attach.

              Public pricing is still opaque. The reviewed sources do not disclose price lists, realized rates, contract
              lengths, discount ladders, or revenue split by service line. That is normal for industrial logistics, but
              it materially weakens outside underwriting precision. The clearest takeaway is that Emergent likely
              monetizes across multiple cold-chain surfaces rather than one storage-only line, which helps the
              revenue-quality story conceptually but leaves the actual revenue mix unverified.
