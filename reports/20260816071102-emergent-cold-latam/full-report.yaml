  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Post-Comfrio underperformance
        - Brazil revenue or margin materially below underwriting plan
        - Breaks scale-premium case
        - Move stance to avoid or deep discount
      - - Debt stress
        - Covenant pressure or lender amendment
        - Raises required return and reduces equity upside
        - Reprice with harsher downside multiple
      - - Revenue disclosure miss
        - Actual run-rate materially below diligence hypothesis
        - Unicorn support weakens
        - Cut valuation range and recommendation
      - - Concentration surprise
        - One country or one customer materially dominates economics
        - Raises downside volatility
        - Demand higher discount and governance controls
      - - Incident / quality deterioration
        - Repeated spoilage, SLA, or safety events
        - Removes premium argument
        - Treat as broken thesis until corrected
    notes: These triggers are designed for deal filtering and post-investment monitoring.
