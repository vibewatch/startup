      - number: '1.4'
        title: Scale today, operational spread, and milestone cadence
        blocks:
          - type: paragraph
            body: >-
              The strongest public scale evidence comes from the company's 2025-2026 operating updates rather than from
              old launch materials. The June 2026 San Antonio blast-freezing release says Emergent operates in 11
              countries with 110 cold-storage facilities and 9.4 million cubic meters of storage capacity, and that GCCA
              ranks it as the largest cold-chain operator in Latin America and the fifth largest globally. The 2025
              infrastructure-investment release adds a dated intermediate checkpoint: as of December 2024 the company
              had nearly 5.1 million cubic meters of cold-storage capacity and, after completing 13 new facilities over
              three years, expected seven more openings by the end of 2025 worth over 260,000 pallet positions. Rather
              than treat those numbers as contradictory, the better reading is rapid asset growth across measurement
              dates.

              Country updates make the footprint concrete. In Chile, Emergent says it runs nine cold-storage facilities
              and the largest automated food cold-storage facility in Latin America, with 33,000 pallet positions at
              Olivo in Maipú. In Colombia, it says it operates seven warehouses with 58,000 pallet positions and 507,000
              cubic meters nationally. In Guatemala, it says three facilities now total 32,000 pallet positions. In
              Mexico, the Guadalajara opening states the company now operates 36 warehouses in the country, after
              earlier opening a greenfield in Monterrey and expanding Villagrán and Apodaca. In Brazil, the Comfrio
              completion release says the combined platform reaches 37 facilities in 12 states, 4 million cubic meters
              of capacity, 610,000 pallet positions, and 3,500 employees within Brazil alone. The milestone pattern is
              therefore unusually dense: Emergent continues to add facilities, expand sites, automate large assets, and
              widen export-linked service capabilities at a speed consistent with an infrastructure platform still in
              active buildout rather than in harvest mode.
