      - number: '7.3'
        title: Financing dependence and Brazil-heavy integration make the downside more path dependent
        blocks:
          - type: paragraph
            body: >-
              Emergent's scale advantage is inseparable from capital availability. Official, partner, and legal sources
              show that the company raised US$1.2 billion of equity by late 2023 and added a term loan facility of up to
              US$250 million in 2025 to keep funding acquisitions, expansions, greenfields, and other strategic
              initiatives. That supports growth, but it also makes the model more exposed to lender expectations, fixed
              obligations, and the risk that future buildout requires continued access to supportive infrastructure
              capital. The company has publicly said it expects to continue capital deployment at current levels for the
              foreseeable future, yet it does not publish leverage, covenant, liquidity, or free-cash-flow data that
              would let investors judge how much room for error currently exists.

              Concentration risk is also more meaningful than the headline 11-country map suggests. Mordor says Brazil
              represents about 59% of the regional cold-chain market, and Emergent's Comfrio combination deepened the
              Brazil footprint to 37 facilities in 12 states and 3,500 employees in-country. That may be strategically
              correct, but it means integration quality and Brazilian economics can matter disproportionately to the
              whole investment case. At the same time, the public record still does not disclose top-customer mix,
              country revenue mix, or post-acquisition churn. The result is a classic infrastructure-platform risk
              pattern: large upside if density and cross-sell work as intended, but medium-high downside if country
              concentration, integration friction, or covenant stress arrives before operating data become more
              transparent.
