  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and direct rival archetypes
        blocks:
          - type: paragraph
            body: >-
              Emergent does not face one canonical benchmark. Its closest operational peers in Latin America are
              regional or national cold-chain specialists such as Frialsa in Mexico, SuperFrio in Brazil, Polarport in
              Mexico and Guatemala, and IceStar in Chile and Colombia. Those companies compete on country density,
              refrigerated warehousing, distribution, and food-sector familiarity rather than on general-freight
              breadth. At the same time, Emergent also competes against a second archetype: global cold-storage and
              cold-logistics platforms such as Lineage, Americold, NewCold, and Burris, which bring stronger
              multinational branding, public-market or large-platform visibility, and in some cases much larger global
              networks.

              The practical implication is that the relevant benchmark changes by buyer job. A Mexico-heavy customer may
              compare Emergent with Frialsa or Polarport on local density and service quality, while a multinational
              food company may compare it with Americold or Lineage on specialist credibility and balance-sheet comfort.
              Emergent's public materials and regional footprint claim argue that its real differentiation is being a
              regional platform rather than a local facility network, but the competitive field remains layered rather
              than winner-take-most.
            claimRefs:
