            body: >-
              Public materials imply that customers are concentrated in cold-sensitive categories where scale accounts
              can matter a lot—food manufacturers, retailers, distributors, and exporters—but they do not show how
              concentrated revenue actually is. That leaves several open questions: whether one country dominates the
              customer base, whether a few large food producers anchor most volume, whether foodservice and retail
              customers balance each other seasonally, and whether multinational accounts are more durable than local
              ones.

              There is also some evidence of channel dependency risk. The company clearly benefits from the expansion of
              export corridors, food retail, and foodservice flows, but those channels can be cyclical or operationally
