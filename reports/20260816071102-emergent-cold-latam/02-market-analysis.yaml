callouts:
  - calloutType: strength
    title: The category is large enough to support scaled regional consolidation
    body: >-
      Even the narrowest reviewed market estimate still implies a multi-billion-dollar sector, while the broader market lens points to a very large infrastructure category shaped by export agriculture, food retail modernization, and food-safety requirements. That is a supportive backdrop for Emergent's acquisition-led strategy.
    claimRefs: [CM009, CM010, CM013, CM014, CM027]
  - calloutType: risk
    title: The main market risk is not lack of demand but false precision and hard execution
    body: >-
      Sizing methodologies vary sharply and the category remains burdened by infrastructure deficits, border friction, and energy-heavy operations. Investors should treat market growth as real but underwriting simplifications as dangerous.
    claimRefs: [CM012, CM015, CM030, CM031, CM037, CM038, CM039]
