companyProfile:
  summary: "Emergent Cold LatAm is a Miami-linked cold-chain infrastructure platform founded in 2021 by Neal Rider and David Palfenier to modernize Latin America's fragmented temperature-controlled logistics market. The company sells integrated refrigerated and frozen warehousing, transportation-adjacent logistics, processing, picking, cross-docking, customs-linked handling, and other value-added cold-chain services for food, beverage, and pharmaceutical workflows. Public evidence supports an unusually rapid scale-up through acquisitions and greenfields: 110 warehouses across 11 countries, large ongoing expansion activity, and major sponsorship from Stonepeak, Lineage, Losa, and a CPP-led lender group. The platform appears strategically important and operationally real, but still discloses far more about footprint and funding than about revenue, EBITDA, leverage, concentration, or exact current valuation."
  foundedDate: "2021-08-01"
  founders:
    - name: "Neal Rider"
      role: "Co-founder and CEO"
      background: "Former co-founder of Emergent Cold and AGRO Merchants Group and former COO of Americold Logistics."
      claimRefs: [CO010, CO050]
    - name: "David Palfenier"
      role: "Co-founder and President"
      background: "Former Latin America leader at AGRO Merchants Group and former president of ConAgra Frozen Foods."
