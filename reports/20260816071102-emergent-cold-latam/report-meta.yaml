  customerFocus: "Food producers, distributors, retailers, foodservice operators, exporters, and temperature-sensitive pharmaceutical supply chains across Latin America."
  businessModel: "Infrastructure-heavy B2B cold-chain operator monetizing warehousing, handling, value-added services, and network density across multi-country food and temperature-sensitive logistics workflows."
