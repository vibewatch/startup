  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与替代方案
        blocks:
          - type: paragraph
            body: >-
              Emergent
              的相关市场不是“全部物流”，也不只是“冷库”。最接近的边界是拉丁美洲温控食品和医药物流栈：冷藏仓储、冷冻和冷藏储存、急冻、冷藏运输、集装箱处理、越库、海关相关仓储，以及从产地到最终交付都让产品保持在温度要求内所需的监控或可追溯层。公司服务页面和物流解释材料一贯这样呈现品类，把仓储、运输、增值处理和运营可见性组合在一起，而不是把它们当作彼此割裂的产品。

              这个边界很重要，因为买方替代方案仍然真实存在。客户可以自营、使用本地专业仓库、依赖货运代理加分散第三方，或者把产品组合转向温度敏感度较低的渠道。但工作流越复杂——多国出口、餐饮服务补货、多温区储存，或医药相邻处理——这些替代方案看起来就越弱。Emergent
              自己的博客和服务材料反复围绕集成温敏工作流定义市场；第三方市场报告也同样把这个品类定义为端到端冷链，而不是纯仓储小众市场。
