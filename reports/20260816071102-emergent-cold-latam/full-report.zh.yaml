      - number: '2.3'
        title: 买方、用户和付款方分散但运营逻辑一致
        blocks:
          - type: paragraph
            body: >-
              买方图谱异质，但逻辑一致。食品加工商、蛋白出口商、乳制品品牌、水果包装商、餐饮服务分销商、现代零售连锁和进出口贸易商，本质上都在购买同一个运营需求：货物在仓储、运输和履约节点之间流动时，保持产品完整性。公司客户和物流页面反复强调蛋白、冷冻食品、乳制品、食品零售和易腐品进出口流程；GCCA
              市场报道同样把出口、国内配送和消费增长列为核心工作负载组合。实践中，买方往往是供应链、采购、出口或运营负责人，而用户是最先感受到损耗、补货率和合规失败的仓库、运输或品类团队。

              预算归属也因细分市场而异。以出口为导向的农业综合企业最在意港口连接、海关时点，以及长距离运输中的冷链完整性。餐饮服务和零售买方更关注库存周转、可得性、城市配送可靠性和损耗下降。医药相邻冷链增加了一个合规要求更高、支付意愿更强但流程预期更严的细分。这些差异让市场呈现分层，而不是碎片化：同一套核心基础设施被采购，用于不同但相关的工作流结果。
