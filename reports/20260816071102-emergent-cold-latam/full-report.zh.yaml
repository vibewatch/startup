      - number: '8.2'
        title: 公开可比公司足以让人尊重这门生意，但不足以支撑大幅未披露溢价
        blocks:
          - type: paragraph
            body: >-
              最有用的公开锚点是冷链龙头 Americold 和 Lineage。Americold 的 August 2026 市值约 US$4.26 billion， 收入约 US$2.60 billion，报告 P/S
              比率为 1.65x。Lineage 的 August 2026 市值约 US$10.38 billion， 收入约 US$5.36 billion，即使还未调整债务，公开销售倍数也大约为
              1.9x。这些不是困境水平，但远低于成长型投资人可能本能套用在私有“平台”叙事上的软件式收入倍数。 公开盈利证据也仍然混杂：Americold 经营利润率只有约 0.42%，Lineage 报告 TTM
              经营利润率为负。已审阅数据中，两家公司报告 P/E 比率也为负，进一步说明规模本身不能保证干净的盈利质量。

              这对 Emergent 很重要，因为公司并不明显是一家藏在冷库里的软件企业。它是一个基础设施很重、带有技术和工作流差异化的运营商。如果增长、密度和整合质量更强，
              它可以相对成熟公开可比公司获得一些溢价。但在未披露财务数据时，公开市场证据最多支持中等溢价，而不是激进跳到高价成长倍数。Americold
              的股息收益率也说明，公开投资人部分看重冷链龙头的韧性现金特征，这再次把承销视角推向有纪律的运营经济性，而不是纯稀缺性叙事。
