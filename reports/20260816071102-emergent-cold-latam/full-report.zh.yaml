chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、覆盖范围与运营模式
        blocks:
          - type: paragraph
            body: >-
              Emergent Cold Latin America 于 2021 年 8 月启动，是一家温控仓储与物流平台，目标是升级区域内分散的食品冷链。启动材料称公司基地在 São Paulo，并在 Miami
              设公司办公室；当前任务背景和管理层足迹则把 Miami
              放在公司重心位置，运营网络覆盖拉丁美洲。官方公司页面一贯把核心服务描述为集成冷链物流，而不是简单出租仓储空间：为食品和农业客户提供冷藏与冷冻仓储、运输、加工、分拣、越库、港口物流、海关仓储、急冻和其他增值服务。

              当前最强的一手覆盖范围证据来自 About Us 页面和 2026 年 6 月运营新闻，两者都称该网络包括分布在 11 个拉丁美洲国家的 110
              座冷库。服务页面还补充，这些资产分布在关键港口和都会中心，目的不是提供点状方案，而是支持端到端产品流转。按工作流理解，Emergent
              把自己定位为服务蛋白、乳制品、冷冻食品、农产品、食品零售、餐饮服务和进出口用户的区域冷链运营平台；这些用户需要在一个体系下完成仓储、处理、运输和合规敏感的执行。IFC
              的项目披露也印证了这一定位：它把公司描述为第三方温控物流平台，围绕冷藏仓储、运输，以及面向加工食品、乳制品、肉类、海鲜、水果和蔬菜的增值服务搭建。
