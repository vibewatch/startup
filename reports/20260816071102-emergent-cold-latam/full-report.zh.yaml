      - number: '7.3'
        title: 融资依赖和巴西偏重的整合让下行更依赖路径
        blocks:
          - type: paragraph
            body: >-
              Emergent 的规模优势离不开资本可得性。官方、合作方和法律来源显示，截至 2023 年底，公司已完成 US$1.2 billion 股权融资，并在 2025 年新增最高 US$250 million
              定期贷款额度，以继续支持收购、扩建、绿地项目和其他战略举措。这支撑增长，
              也让模式更暴露于贷款方预期、固定义务，以及未来建设仍需要持续获得友好基础设施资本的风险。公司公开表示，预计可预见未来会继续按当前水平部署资本，
              但没有公布杠杆、契约、流动性或自由现金流数据，投资人无法判断当前容错空间有多大。

              集中风险也比 11 国地图这个标题数字更有意义。Mordor 称巴西约占区域冷链市场的 59%，而 Emergent 与 Comfrio 合并后，巴西布局加深到 12 个州 37 座设施和 3,500
              名员工。这在战略上可能正确，但也意味着整合质量和巴西经济性会对整个投资案例产生不成比例的影响。
              同时，公开记录仍没有披露大客户结构、国家收入结构或收购后流失。结果是典型的基础设施平台风险形态：如果密度和交叉销售按计划跑通，上行空间很大；
              但如果国家集中、整合摩擦或契约压力先于运营数据透明化出现，下行风险就是中高。
