      - number: '5.2'
        title: 运营架构连接设施、处理、监控与路线执行
        blocks:
          - type: paragraph
            body: >-
              运营架构以实体为先，但有数字化辅助。冷藏间、深冻间、多温区、运输资产、越库节点和加工基础设施构成底层。其上是库存系统、条码、分拣系统、联网传感器、温度监控和运营规划工具，用来协调跨设施和路线的流动。公司反复把这套架构称为集成物流：仓储、加工、订单分拣和配送不是分散供应商，而是作为一个受控流程运转。

              最具体的技术标记偏实操，而非抽象。食品加工内容提到 IQF 技术；分拣页面提到先进库存管理系统和条码；博客内容提到 IoT 传感器、监控平台和可追溯性；Chile 自动化公告还提供了 ASRS
              式自动化和高规格仓储设计证据。结论是，Emergent 的架构是一个冷链运营栈；差异化更多取决于编排和一致性，而不是任何公开披露的自研软件平台。
