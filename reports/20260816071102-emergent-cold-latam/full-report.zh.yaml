      - number: '7.4'
        title: 缓释因素看得见，但投资逻辑仍需要明确否决标准
        blocks:
          - type: paragraph
            body: >-
              Emergent 确实有实在的缓释抓手。公司反复强调运营标准、技术投入和客户服务；可持续发展材料指向多国合规计划和 EDGE Zero Carbon 认证；自动化和 CO2
              冻结投资说明管理层没有忽视未来效率和制冷剂压力。这些信号重要，因为它们表明管理层在主动标准化一个快速扩张的网络， 而不是单纯拼资产。Americold 等竞争对手也突出自动化和服务广度，进一步说明
              Emergent 投在正确类别上。

              但可公开发布级别的尽调观点不能只靠缓释话术。最清晰的否决标准都可以监控：严重设施安全事件、反复温控失败、损害出口通道的海关或边境延误、 2025 年定期贷款后的契约压力、Comfrio
              整合后的可量化流失，或少数国家或客户对经济性支配程度高于预期的证据。在尽调核实事故历史、国家层面盈利能力、 保险、契约余量和管理层继任深度之前，正确结论不是公司不安全，而是剩余风险仍然高到不能松懈承销。
