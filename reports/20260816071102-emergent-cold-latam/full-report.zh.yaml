      - number: '3.3'
        title: 定价不透明、多供应商采购与切换成本
        blocks:
          - type: paragraph
            body: >-
              整个品类的公开定价仍不透明。在已审阅材料中，Emergent、Frialsa、SuperFrio、Polarport、IceStar、Americold 或 Lineage
              都没有发布标准化企业冷链价目表。它们的公开页面反而强调联系式销售、设施、网络覆盖、集成服务和服务质量。这通常意味着买方比较供应商时看的是线路经济性、损耗下降、处理复杂度、网络触达和运营信任，而不是公开挂牌价。从这个意义上说，这个市场仍更像工业服务，而不是软件。

              切换成本有意义，但不是绝对。一旦客户把仓储、运输日历、监控预期和设施工作流与一家供应商整合，迁移整个账户会带来运营痛苦。但买方仍可按国家、线路、温区或用例多栖。一个客户可以区域性使用 Emergent，同时在
              Mexico 保留 Frialsa，在 Veracruz 进口走廊使用 Polarport，或让全球玩家负责跨国采购。因此，商业竞争不是全有全无，而是在不假设独占全部冷链支出的情况下，赢得密集、粘性的工作流份额。
