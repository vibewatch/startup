  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律和环境暴露会随多国规模扩大而上升
        blocks:
          - type: paragraph
            body: >-
              Emergent 现在在 11 个拉丁美洲国家运营食品敏感型物流网络，监管暴露不是边缘问题，而是产品本身的一部分。WHO、PAHO、FDA 和 WTO
              材料都指向同一个结论：食品贸易靠强控制系统、检查、文件记录和边境清关纪律支撑。Emergent 自己的服务页面显示，工作流已不止简单仓储，
              还覆盖加工、拣选、越库、出口相关操作和速冻；一旦合规失效，食品完整性、海关时点和客户信任可能同时受损。公司称在全部 11
              个国家都有合规计划，这是重要缓释，但公开记录没有逐项列出牌照、审计、各国许可或详细事故历史。

              法律风险没有运营风险那么显眼，但部分原因是披露不足。已审阅材料没有显示正在发生的重大诉讼或执法行动，但不能把这种缺席当成法律风险很低的证明。 一个靠 18
              笔收购、绿地项目和多国劳动密集型运营拼出的网络，天然会暴露在环境、劳动、食品控制和合同争议中，公开营销页面不会完整说明。
              环境压力也是真实存在的：区域市场来源强调，即便需求仍强，能源强度、制冷剂转换和可持续性要求也会推高合规成本。
