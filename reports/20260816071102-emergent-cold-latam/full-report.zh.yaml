      - number: '1.5'
        title: 披露缺口、指标漂移与尚未验证的事项
        blocks:
          - type: paragraph
            body: >-
              公开记录在规模上有说服力，但精确度不均衡。公司、投资方、顾问和行业来源一致认为，Emergent
              是区域内最大的温控物流运营商之一，并且已经筹集了巨额资本。但它们在经审计财务质量上弱得多。已审阅的一手来源没有披露整个集团的收入、EBITDA、现金流、客户集中度或清晰的当前员工数。公开估值也不精确：官方公告强调资本募集和基础设施部署，而
              CB Insights 等数据库页面只部分展示融资时间线，隐藏估值字段，并显示相对于官方公告似乎不完整的总额。

              多个运营指标也需要严格看日期和口径。不同来源分别提到超过 60 座仓库、超过 70 座仓库和 110 座仓库；5.1 million、5.4 million 和 9.4 million
              立方米；以及区域整体员工数与 Brazil 单独员工数。这些不是怀疑平台的理由，但足以说明不能只凭标题数字就过度自信地承销。正确的尽调立场是：Emergent
              的身份、投资方基础、收购节奏和实体覆盖范围都有充分证据；但当前估值、收入质量、单位经济和股权结构表细节仍显著不透明。
