      - number: '1.2'
        title: 创始人、管理层阵容与治理姿态
        blocks:
          - type: paragraph
            body: >-
              Emergent Cold LatAm 由 Neal Rider 和 David Palfenier 创立，两人此前都有深厚的冷库运营经验。Rider 担任 CEO；根据公司文化页面，他此前联合创立了
              Emergent Cold 和 AGRO Merchants Group，并曾任 Americold Logistics 首席运营官。Palfenier 担任总裁，曾负责 AGRO Merchants Group
              的拉丁美洲业务，也曾任 ConAgra Frozen Foods 总裁。披露出来的更大管理层阵容明显强于典型创业公司：Pedro Moreira 任 CFO，Mike Bender
              任总法律顾问兼首席合规官，Ricardo Jacob 负责运营，Rafa Rocha 负责商业活动，Adam Rushby 负责网络优化，区域董事总经理分别管理安第斯、南锥体和 Mexico/Caribbean
              业务。

              治理披露仍比规模披露窄。可持续发展页面称公司有董事会、执行领导团队、稳健的财务管理，以及覆盖全部 11
              个国家的合规计划，但在已审阅来源集合中没有发布详细董事名单或委员会结构。这意味着尽调信心更多来自管理层履历和投资人 / 顾问基础的机构质量，而不是逐项公开治理报告。关键人风险有实际意义：Rider
              仍是核心战略声音，收购节奏仍依赖管理层，许多差异化主张——扩张纪律、技术标准和网络建设质量——都与相对小的高管团队高度绑定。
