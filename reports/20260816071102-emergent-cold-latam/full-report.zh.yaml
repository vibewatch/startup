  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 公开估值支撑存在，但正确框架应是场景法而非精确估值
        blocks:
          - type: paragraph
            body: >-
              公开记录同时说明两件事。第一，Emergent 不是投机性概念公司：官方、合作方、法律和行业来源都支持它是一个大型区域平台， 在 11 个国家拥有 110 座仓库，反复靠收购扩张，并完成超过 US$1.2
              billion 股权融资和一笔 2025 年定期贷款。第二， 同一批来源都没有公布干净当前估值所需的关键变量，包括收入、EBITDA、自由现金流、杠杆、国家结构或精确当前投后估值。这种组合排除了虚假精确。
              因此，公开信息下的正确估值方法，应是锚定战略规模、已披露融资和公开冷链可比公司的场景框架，而不是声称存在一个“真实”内在价值。

              这个框架还应区分“合理”与“可支撑”。资本历史和实物足迹让独角兽身份具备合理性。但已融资金额不等于企业价值，区域领先也不等于倍数已经被验证。 只有尽调证明扩大后的后 Comfrio
              平台，能够产出收入基础和利润率结构，且至少配得上相对公开同行的小幅溢价，估值支撑才会显著变强。 如果没有这项确认，审慎立场应把建议留在观察或继续研究区间，而不是因为公司运营上令人印象深刻就直接升级为买入。
