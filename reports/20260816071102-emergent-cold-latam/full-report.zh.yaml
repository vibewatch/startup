      - number: '8.3'
        title: 披露不确定性仍是主导变量，场景区间必须拉宽
        blocks:
          - type: paragraph
            body: >-
              估值区间应围绕 Comfrio 之后尽调可能揭示的收入规模、利润率质量和集中度来设定。乐观情景下，Emergent 证明合并后平台已把实物规模转化为高利用率、
              交叉销售和持久客户经济性，因此能相对公开可比公司享受溢价倍数。基准情景下，公司战略上仍强，但经济性更接近上市冷链运营商，而不是软件基础设施公司。
              悲观情景下，整合摩擦、国家集中、债务包袱或弱于假设的收入规模，会把公司推回接近公开市场、甚至折价的倍数。

              这个逻辑让入场纪律很直接。如果尽调支持后 Comfrio 收入基础达到数亿美元高位，并且至少有稳定的中个位数经营经济性，低十亿美元到中十亿美元区间的价格可以是合理的。 估值若显著高于约 US$2.5
              billion，则需要公开材料目前没有提供的证据，即异常强的利润率、非常快的有机增长，或出色的留存和集中度质量。 由于这些证明仍然缺失，场景宽度必须保持宽，且下行情景必须明确允许估值低于市场惯用的独角兽叙事。
