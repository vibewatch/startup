      - number: '1.4'
        title: 当前规模、运营分布与里程碑节奏
        blocks:
          - type: paragraph
            body: >-
              最强的公开规模证据来自公司 2025-2026 年运营更新，而不是早期启动材料。2026 年 6 月 San Antonio 急冻公告称，Emergent 在 11 个国家运营 110 座冷库，储存容量 9.4
              million 立方米，并且 GCCA 将其列为拉丁美洲最大、全球第五大的冷链运营商。2025 年基础设施投资公告提供了一个带日期的中间节点：截至 2024 年 12 月，公司拥有近 5.1 million
              立方米冷库容量；在三年内完成 13 座新设施后，预计到 2025 年底再开 7 座，对应超过 260,000 个托盘位。更好的解读不是把这些数字视为矛盾，而是理解为不同计量日期之间的快速资产增长。

              国家层面的更新让覆盖范围更具体。在 Chile，Emergent 称其运营 9 座冷库，并拥有拉丁美洲最大的自动化食品冷库设施——位于 Maipú 的 Olivo，拥有 33,000 个托盘位。在
              Colombia，公司称全国运营 7 座仓库，拥有 58,000 个托盘位和 507,000 立方米容量。在 Guatemala，公司称 3 座设施目前合计 32,000 个托盘位。在
              Mexico，Guadalajara 开业公告称公司在该国已运营 36 座仓库，此前还在 Monterrey 开设绿地项目，并扩建 Villagrán 和 Apodaca。在 Brazil，Comfrio
              交割公告称，合并平台仅在 Brazil 就覆盖 12 个州的 37 座设施、4 million 立方米容量、610,000 个托盘位和 3,500 名员工。因此，里程碑节奏异常密集：Emergent
              还在增加设施、扩建站点、自动化大型资产，并拓宽出口相关服务能力，其速度更像仍处于积极建设期的基础设施平台，而不是进入收割期的资产。
