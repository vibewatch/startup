      - number: '1.3'
        title: 融资历史、投资方与并购驱动扩张
        blocks:
          - type: paragraph
            body: >-
              对一家区域冷链运营商来说，Emergent Cold LatAm 的融资历史异常庞大。2021 年启动时，公司宣布完成 US$450M 融资，由 Lineage、Stonepeak 和 D1 Capital
              Partners 锚定。2023 年 12 月，官方公司材料和 Stonepeak 材料宣布进一步获得 US$500M 股权承诺，由 Stonepeak、Lineage 和 Losa Group
              领投。同一批来源称，自 2021 年 7 月以来累计股权融资达到 US$1.2B；截至 2023 年融资时，公司已经完成 18 笔收购、2 个新建项目，并有 9 个额外绿地项目在积极开发。2025 年 9
              月，Emergent 又新增一笔 US$250M 定期贷款，由 CPPIB Credit Investments 牵头、Deutsche Bank 安排，用于收购和开发项目。

              这些资本显然被用来加速“整合收购 + 开发”的策略。2021 年启动公告把融资与最初的 Peru 收购放在一起。当前 About Us 时间线随后显示，公司在
              Peru、Panama、Brazil、Chile、Colombia、Uruguay、Guatemala、Mexico、Paraguay、Ecuador、Dominican Republic
              等地连续收购并启动新项目，之后又通过 Comfrio 加码 Brazil、通过 Frialsa Perú 加码 Peru。Brazil 最重要的已披露战略动作是 Comfrio 交易：公告称 Comfrio
              是一个拥有 24 个站点、约 420,000 个托盘位的平台；交易完成公告和 Aqua Capital 的出售公告则把合并后业务定位为 Brazil
              占主导地位的集成冷链平台。因此，公开来源支持一个清晰结论：Emergent 不是靠一两个标志性资产长大，而是在基础设施级资本支持下，有意推进区域整合收购和绿地建设。
