      - number: '7.2'
        title: 运营风险位于投资逻辑中心，因为冷链故障会快速传导
        blocks:
          - type: paragraph
            body: >-
              冷链物流把实物、时点和质量风险压进同一个运营系统。OSHA 仓储指南显示，冷藏和普通仓储运营都会面对叉车、人机工程、物料搬运、化学品、滑倒坠落和机器人风险。 Emergent
              披露的服务范围比基础仓库业主更复杂：食品加工、拣选、越库、运输协调和速冻都会增加执行节点；停机、温度偏差或搬运错误，都可能引发变质、拒收、索赔或客户流失。
              公开市场来源同样强调，拉丁美洲仍有基础设施缺口、电力质量挑战、高物流成本和货物安全问题，服务质量和利润率都可能被拖累。

              最关键的运营点是，网络规模有双刃剑效应。它带来密度和客户触达，也把站点、国家和被收购平台之间的控制问题放大。仅 Comfrio
              一项就增加了巴西大规模国内配送和最后一公里暴露，同时公司还在墨西哥、哥伦比亚、危地马拉、智利等地继续开设和扩建站点。如果运营标准、维护实践或本地管理质量差异过大，
              单个设施问题就会传导成更广泛的客户不满，并拖慢新产能爬坡。公开缓释信号确实存在，包括技术投入、自动化、认证和对运营标准的明确重视；但仍需要检查事故日志、停机历史、保险覆盖和收购后质量指标。
