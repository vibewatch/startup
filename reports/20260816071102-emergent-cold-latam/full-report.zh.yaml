      - number: '2.2'
        title: 多种测算视角显示市场很大，但共识精度弱
        blocks:
          - type: paragraph
            body: >-
              多个外部来源确认，拉丁美洲冷链需求已经以数十亿美元计量，但由于口径不同，它们对规模的判断差异很大。Market Data Forecast 认为区域市场 2025 年为 US$20.06 billion，2026
              年为 US$21.66 billion，到 2034 年达到 US$39.97 billion。Mordor Intelligence 采用更窄的“冷链物流”框架，估计 2025 年为 US$5.87
              billion，到 2030 年达到 US$10.15 billion。这些数字不应机械平均；更合适的做法是把它们视为不同测算镜头，因为该行业边界可能包括基础设施、冷藏运输、增值服务或更广义的冷链工作流。

              更好的承销锚点是：所有已审阅来源都指向真实规模和持续增长。Market Data Forecast 和 Mordor 都预计增速在高个位数到低双位数之间，GCCA
              行业报道描述了区域在国内配送和出口相关需求上的扩张，Emergent 自身披露也显示其网络已经大到足以支撑区域整合。实际结论是，TAM
              足够大，可容纳数个规模化赢家；同时，方法差异让虚假精确比高估品类相关性更危险。
