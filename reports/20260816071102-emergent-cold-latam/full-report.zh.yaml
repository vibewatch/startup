        - 执行压力仍在，但溢价是赚出来的
        - 有可能，但需要多项新证据
      - - 基准
        - 规模真实，但经济性更像纪律严明的公开冷链运营商，而不是软件公司
        - 只能给适度溢价；估值区间 ~US$1.2B-1.8B
        - 披露有限，置信度被封住
