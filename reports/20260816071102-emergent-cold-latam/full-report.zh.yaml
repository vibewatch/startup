  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局与直接竞争者类型
        blocks:
          - type: paragraph
            body: >-
              Emergent 没有一个标准对标对象。它在拉丁美洲最接近的运营同行，是 Mexico 的 Frialsa、Brazil 的 SuperFrio、Mexico 和 Guatemala 的
              Polarport、Chile 和 Colombia 的 IceStar 等区域或全国冷链专业公司。这些公司竞争的是国家密度、冷藏仓储、配送和食品行业熟悉度，而不是一般货运的广度。同时，Emergent
              也面对第二类竞争者：Lineage、Americold、NewCold 和 Burris 等全球冷库和冷链物流平台，它们拥有更强的跨国品牌、公开市场或大型平台可见性，有些还拥有大得多的全球网络。

              实际含义是，相关基准会随买方任务改变。Mexico 权重高的客户可能会拿 Emergent 与 Frialsa 或 Polarport 比本地密度和服务质量；跨国食品公司则可能拿它与 Americold 或
              Lineage 比专业可信度和资产负债表信心。Emergent 的公开材料和区域覆盖范围主张表明，其真正差异化在于区域平台，而不是本地设施网络；但竞争场仍是多层结构，并非赢家通吃。
