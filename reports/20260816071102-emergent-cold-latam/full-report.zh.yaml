              即便没有合并财务报表，成本栈在概念上也清楚可见。冷库耗电高、维护重、对人工敏感；运输增加燃料、车队、路线和服务可靠性成本；多温区运营、监控、食品安全控制和海关相关处理又增加流程负担。市场报告和公司运营内容都强化了一点：制冷能源、基础设施质量、温度偏差和设备表现是核心经济变量。这不是软件利润率业务，而是一个实体网络，经济性取决于密度、资产利用率、路线组合和损耗防控。

              资本开支强度也很明显。公司已经完成多笔收购，持续推进绿地项目，并增加 Olivo 自动化和 Chile
              急冻基础设施等先进设施。融资公告明确把新资本与收购、开发项目和基础设施标准绑定。它支持增长野心，但也意味着核心财务问题是资本回报，而不仅是资本可得性。公开材料展示了可信的规模化路径，但尚未展示成熟回报的透明路径。
