  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入来源和变现方式可见，尽管顶线收入不披露
        blocks:
          - type: paragraph
            body: >-
              即使没有披露损益表，公开服务栈也让 Emergent
              的收入模型可读。仓储、冷藏运输、加工、分拣、越库、海关仓储、急冻和其他增值服务，都意味着收入混合了仓储费、运输费、处理费、吞吐费、出口支持服务和定制企业合同。这个业务不像单一费率的托盘房东，更像一家打包温控物流运营商；变现取决于利用率、线路组合、产品组合和增值服务附着。

              公开定价仍不透明。已审阅来源没有披露价目表、实现费率、合同期限、折扣阶梯或按服务线拆分的收入。这对工业物流来说正常，但会显著削弱外部承销精度。最清晰的结论是，Emergent
              可能在多个冷链表面变现，而不是只靠一条仓储线；这在概念上有助于收入质量叙事，但实际收入组合仍未验证。
