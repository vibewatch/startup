      - number: '4.4'
        title: 财务结论：融资能力加分，透明度减分
        blocks:
          - type: paragraph
            body: >-
              正向观点很直接：Emergent
              吸引了基础设施级股权和债务，把资本部署到有形的区域网络，并继续投资扩张、自动化和服务能力。这种画像更像严肃增长平台，而不是轻资本化的整合收购载体。对欠发达地区的物流运营商来说，赞助方资本和贷款方支持的可得性本身就是有意义的竞争优势。

              负向观点同样重要。公开证据仍不能说明网络是否在产生有吸引力的利用率调整后回报，仓储与运输之间毛利率如何变化，收购在标准化口径下是否增厚收益，或企业能舒适吸收多少债务服务压力。因此，承销立场应区分融资能力和财务质量：前者信号充分，后者仍显著披露不足。
            claimRefs:
              - CI028
              - CI029
              - CI030
              - CI031
              - CI032
