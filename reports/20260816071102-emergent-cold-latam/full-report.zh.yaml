      - number: '8.4'
        title: 正确结论是继续研究，并设定明确价格和尽调门槛
        blocks:
          - type: paragraph
            body: >-
              这条投资逻辑在市场需求、网络相关性和资方质量上都很强。Emergent 所处区域冷链供给不足，食品安全要求、出口增长和医药需求都支撑长期需求。
              它也似乎是少数拥有足够资本和管理层履历，能在规模上整合市场的运营商之一。这些都是实质性正面因素，也解释了为什么公司有理由获得高于许多小型区域同行的私有估值。

              即便如此，决定性问题不是市场质量，而是证据质量。收入、EBITDA、杠杆、股权结构优先权、大客户结构、国家结构和收购后表现仍过于不透明，无法给出干净的买入建议。
              因此，仅基于公开信息的最佳立场是继续研究：保持接触，设定估值护栏，并要求一小组决定性尽调材料。如果这些材料确认强经济性，公司可以支撑具有合理到吸引力的低十亿美元或中十亿美元入场价。
              如果不能，同一个让公司令人兴奋的稀缺性叙事，也很容易掩盖偏高价格。
