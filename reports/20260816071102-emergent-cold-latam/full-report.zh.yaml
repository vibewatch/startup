companyProfile:
  summary: >-
    Emergent Cold LatAm 是一家与 Miami 关联的冷链基础设施平台，由 Neal Rider 和 David Palfenier 于 2021
    年创立，目标是升级拉丁美洲分散的温控物流市场。公司为食品、饮料和医药流程提供集成的冷藏与冷冻仓储、运输相关物流、加工、分拣、越库、海关相关处理，以及其他增值冷链服务。公开证据支持其通过收购和绿地新建实现异常快速的扩张：11 个国家
    110 座仓库、大量在推进的扩建活动，以及 Stonepeak、Lineage、Losa 和 CPP
    牵头贷款方集团的重要支持。这个平台看起来具有战略重要性，运营也真实存在，但披露的覆盖范围和融资远多于收入、EBITDA、杠杆、客户集中度或精确当前估值。
