      - number: '3.2'
        title: 网络、服务广度与专业化能力对比
        blocks:
          - type: paragraph
            body: >-
              与区域专业公司相比，Emergent 的服务栈表现不错。公开服务覆盖 11 个国家的仓储、运输、海关仓储、急冻、越库、加工和集装箱装载支持，比已抓取语料中多数本地专业公司的简单首页定位更宽。Frialsa
              清晰地把自己定位为领先冷链物流网络；SuperFrio 强调在缺乏冷藏基础设施的区域扩张；Polarport 聚焦冷库和服务；IceStar 看起来面向 Chile 和 Colombia
              的港口及消费市场流。这些都是严肃的竞争位置，但在已审阅公开材料中，它们并不明显匹配 Emergent 的区域跨国覆盖范围。

              面对全球既有公司时，对比会反过来。NewCold 强调自动化、ERP 集成、可追溯性和规模化韧性。Americold 展示全球设施网络和专业解决方案。Lineage
              将大型全球运营网络与上市公司级财务可见性结合在一起。因此，当买方最看重拉丁美洲本地执行和区域覆盖时，Emergent 最强；当买方把全球专业品牌、自动化深度或上市公司透明度置于本地运营广度之上时，Emergent
              最弱。
