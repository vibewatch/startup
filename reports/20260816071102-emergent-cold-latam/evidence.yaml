  - type: private-evidence-only
    severity: material
    topic: current-valuation
    missingEvidence: >-
      A current board-approved valuation mark, transaction memo, or secondary pricing reference that discloses Emergent
      Cold LatAm's latest post-money or enterprise valuation.
    whyItMatters: >-
      The company is clearly large and well financed, but public releases do not reveal the current entry price that
      investors would actually be underwriting.
    diligencePath: >-
      Request the latest financing deck, lender presentation, or cap-table summary showing current preferred-equity
      marks and any internal valuation work.
