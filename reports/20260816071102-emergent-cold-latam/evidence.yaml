    whyItMatters: >-
      Scale and financing strength do not answer whether the network is producing durable returns or still depends on
      heavy external capital.
    diligencePath: Obtain audited financial statements, lender materials, or management KPI packs for the full regional business.
    relatedQuestionRefs:
