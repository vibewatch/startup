callouts:
  - calloutType: strength
    title: Financing capacity is itself a competitive asset
    body: >-
      Emergent has repeatedly raised capital at a scale that few regional cold-chain operators could match. That does not prove attractive returns, but it does lower near-term financing risk and helps explain the pace of acquisitions, buildouts, and specialized facility investment.
    claimRefs: [CI018, CI019, CI020, CI021, CI022, CI023]
  - calloutType: risk
    title: Public transparency is far too weak for a full quality-of-earnings view
    body: >-
      Investors still lack consolidated revenue, EBITDA, utilization, leverage, covenant, and cash-flow disclosures. The business may be financially sound, but the public record does not yet allow a strong revenue-quality or debt-capacity conclusion.
    claimRefs: [CI026, CI027, CI031, CI032, CI033, CI034, CI035]
