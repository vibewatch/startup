schemaVersion: "report-v2"
artifact: "market-analysis"
slug: "redo"
runDate: "2026-10-21"
company:
  name: "Redo"
chapter:
  number: 2
  title: "Market Analysis"
  summary: >-
    Redo addresses the Shopify-centered post-purchase operations layer rather than the
    entire DTC commerce market. Broad DTC growth, high apparel return rates, and pressure
    to consolidate fragmented tools support demand, but the assigned evidence does not
    disclose a defensible post-purchase software TAM, Redo revenue, or market share.
sections:
  - id: "market-boundary"
    title: "Market boundary and substitutes"
    body: >-
      Redo's addressable category is narrower than ecommerce or DTC commerce: it begins
      with shopper-facing returns and exchanges, then extends into order tracking,
      package protection, fulfillment support, customer service, marketing, and
      AI-assisted commerce workflows. A third-party comparison draws an important
      boundary between the customer-facing portal and the physical or financial back
      end: authorization, exchange choice, labels, and inbound tracking sit in the
      portal, while receiving, inspection, disposition, inventory state, and accounting
      remain with an ERP, WMS, warehouse, or 3PL. For apparel, the same comparison
      estimates online return rates at roughly 20% to 30% of orders, versus under 10%
      for most other retail, making returns software especially relevant in high-return
      categories. Status-quo substitutes include manual support workflows, native
      commerce-platform features, separate point solutions, and internal ERP or
      warehouse processes; none should be counted automatically as spend available to
      Redo.
    claimRefs: ["CM005", "CM009", "CM010", "CM011"]
    tableRefs: ["TM001"]
  - id: "sizing-lenses"
    title: "Sizing lenses and limits"
    body: >-
      The available market data establishes demand context but not a defensible
      TAM/SAM/SOM. Shopify's 2026 DTC guide cites a third-party projection that the
      global DTC ecommerce market grows from about $163 billion in 2024 to $595 billion
      in 2033, and separately cites an estimate that ecommerce represented about 23.5%
      of retail sales. Those figures are broad commerce-flow measures, not software
      revenue pools, and therefore cannot be applied as Redo's TAM. At the company level,
      a June 2026 company release syndicated by two outlets says more than 4,100 brands
      use Redo and more than 1,750 use multiple offerings. An archived company homepage
      separately states 3,000-plus ecommerce businesses, a compatible but less current
      floor. These adoption counts indicate installed footprint and cross-sell evidence;
      without merchant GMV, contract values, eligible-brand counts, or revenue, they do
      not isolate serviceable market value or market share.
    claimRefs: ["CM001", "CM002", "CM003", "CM004", "CM008"]
    tableRefs: ["TM002"]
    figureRefs: ["FM001"]
  - id: "buyers-and-adoption"
    title: "Buyers, users, payers, and adoption path"
    body: >-
      The economic buyer varies by module. Ecommerce and customer-experience leaders
      own the returns and shopper journey, operations teams care about label expense,
      routing, fraud, and warehouse handoffs, support leaders evaluate ticket
      automation, and finance tests whether retained revenue and labor savings exceed
      usage charges. Redo's published pricing lowers software-entry friction by listing
      the returns portal as free and saying Redo covers return-label costs, while
      charging by usage for modules such as tracking, checkout optimization, and
      support. The shopper may nevertheless become an indirect payer when a merchant
      adopts opt-in return coverage at checkout, so consent, presentation, and brand
      impact belong in procurement. Company-reported outcomes such as a 17% average
      exchange-rate increase and up to 60% automated ticket resolution are adoption
      hypotheses to test in a merchant cohort, not independent market benchmarks.
      Shipping economics remain material: Shopify cites an average 8.7% of annual
      business expenses spent on shipping before storage, packing, returns, or special
      requirements.
    claimRefs: ["CM006", "CM007", "CM012", "CM013", "CM014"]
    tableRefs: ["TM003"]
  - id: "drivers-constraints-and-diligence"
    title: "Drivers, constraints, and valuation relevance"
    body: >-
      Demand is driven by high return intensity in apparel, merchant interest in
      converting refunds into exchanges, pressure to consolidate fragmented apps, and
      the use of shared order and customer data across support and marketing. Adoption
      is constrained by Shopify concentration, integration with the systems that own
      inventory and money, uncertain shopper acceptance of checkout coverage, and the
      need to validate vendor-reported ROI. A Shopify process-management guide identifies
      compatibility, workflow complexity, coding requirements, and user access as core
      software-selection criteria; these translate directly into implementation burden
      for a multi-module post-purchase platform. Fee presentation is another diligence
      issue. Current FTC staff guidance for unfair or deceptive fees is expressly
      scoped to live-event tickets and short-term lodging, so it is not evidence that
      Redo's retail model is covered by that rule. It nevertheless states that optional
      ancillary charges must be clearly disclosed and included in the final amount
      before payment, a useful control principle for shopper-funded coverage. Valuation
      should therefore rely on verified merchant economics, retention, module attach,
      and regulatory review rather than a top-down share of broad DTC GMV.
    claimRefs: ["CM005", "CM009", "CM011", "CM015", "CM016"]
