      - ["Operations and reverse logistics", "COO or operations leader", "Operations, warehouse, 3PL teams", "Operations and shipping budget", "Routing, tracking, handoff to systems of record", "Manual reconciliation or cross-border complexity"]
      - ["Customer support automation", "CX/support leader", "Support agents", "Support software and labor budget", "Ticket triage and resolution", "High ticket volume or slow resolution"]
      - ["Marketing and conversion", "Growth/ecommerce leader", "Lifecycle marketers", "Marketing or conversion budget", "Checkout optimization, email/SMS, recovery", "Rising acquisition cost and vendor consolidation"]
      - ["Implementation and governance", "CIO/IT or ecommerce operations", "Administrators and integration teams", "Implementation and platform budget", "Connect commerce, ERP/WMS, support, and data controls", "Need for compatible workflows and governed customer data"]
    notes: "Buyer roles are analytical mappings from cited product scope, pricing, and workflow evidence; actual budget ownership by merchant is not disclosed."
    claimRefs: ["CM005", "CM006", "CM007", "CM009", "CM011", "CM014", "CM015"]
figures:
  - id: "FM001"
    title: "Evidence-constrained market sizing ladder"
    type: "pyramid"
    summary: "Broad DTC context narrows to Redo's company-reported installed footprint, while dollar SAM and SOM remain undisclosed."
    data:
      nodes:
        - label: "Global DTC ecommerce market, 2024"
          value: "$163B"
          detail: "Third-party estimate cited by Shopify; broad commerce context only."
        - label: "Global DTC ecommerce projection, 2033"
          value: "$595B"
          detail: "Long-range third-party projection cited by Shopify."
        - label: "US ecommerce share of retail, 2025 report"
          value: "23.5%"
          detail: "Channel-share context cited by Shopify, not software spend."
        - label: "Redo platform footprint, June 2026"
          value: ">4,100 brands"
          detail: "Company-reported adoption syndicated in a company release."
        - label: "Redo multi-product footprint, June 2026"
          value: ">1,750 merchants"
          detail: "Company-reported subset using multiple offerings."
        - label: "Redo dollar SAM / SOM"
          value: "Not disclosed"
          detail: "Requires merchant universe, contract value, revenue, and share data."
    approximationNotes: >-
      The values use different units and are not additive, nested, or value-proportional.
      This is an evidence ladder from broad context to company footprint, not a computed
      TAM/SAM/SOM pyramid.
    claimRefs: ["CM001", "CM002", "CM003", "CM004", "CM008"]
callouts:
  - calloutType: "risk"
    title: "Do not capitalize broad DTC GMV as Redo TAM"
    body: >-
      The available $163B-to-$595B estimate measures global DTC ecommerce, while Redo
      sells a narrower software and services layer. A valuation case needs category
      software spend, eligible merchants, ACV, attach rates, and verified revenue.
    claimRefs: ["CM001", "CM003", "CM004"]
  - calloutType: "recommendation"
    title: "Underwrite adoption with merchant-level cohorts"
    body: >-
      Request module-level pricing, exchange lift, support deflection, retention,
      merchant concentration, and implementation data segmented by vertical and order
      volume before using company-reported outcomes in a growth model.
    claimRefs: ["CM007", "CM012", "CM013", "CM015"]
