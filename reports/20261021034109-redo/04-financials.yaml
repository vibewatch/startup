      - [Checkout optimization, "Usage fee on processed orders", "$0.40 per order list price", "Official pricing page", "Realized discounts and eligible-order denominator undisclosed", "Billable orders, realized price, discounts, and gross margin"]
      - [Order tracking, "Usage fee on tracked orders", "$0.08 per tracked order list price", "Official pricing page", "Tracked-order penetration and delivery cost undisclosed", "Tracked volume, realized price, carrier/data cost, and retention"]
      - [Support automation, "Fee per resolved interaction", "$0.20 per resolution list price", "Official pricing page", "Resolution definition and inference/support cost undisclosed", "Resolution denominator, automation rate, model cost, and support gross margin"]
      - [Marketing and recovery, "Per-send fees and revenue share", "$0.002 per send; 10% of recovered revenue", "Official pricing page", "Attribution, channel costs, and refund adjustments undisclosed", "Net attributed revenue, messaging cost, refunds, and take-rate reconciliation"]
      - [International returns and fulfillment, "Software plus physical logistics services", "No public realized price", "Company release and product surface", "Service mix may carry lower margins and working-capital needs", "Contract pricing, hub utilization, carrier pass-throughs, and service contribution margin"]
    notes: "Published prices are list prices from Redo's pricing page; realized rates, revenue mix, discounts, denominators, and contribution margins are unavailable."
    claimRefs: [CI001, CI002, CI003, CI008, CI010, CI012]
  - id: TI002
    title: Published pricing and monetization status
    columns:
      - Product
      - Published price
      - Billing unit
      - List versus realized
      - Key unknown
    rows:
      - [Returns, Free, "Portal access", "List price only", "Economics of shopper coverage and Redo-funded labels"]
      - [Checkout optimization, "$0.40", "Per order", "List price only", "Eligible volume, discounting, and incremental conversion"]
      - [Order tracking, "$0.08", "Per tracked order", "List price only", "Attachment rate and per-order delivery cost"]
      - [Support, "$0.20", "Per resolution", "List price only", "Definition of resolution and human-escalation cost"]
      - ["Email & SMS", "Starting at $0.002", "Per send", "Floor price only", "Channel mix, carrier fees, and volume tiers"]
      - [Returns AI Agents, "Custom pricing", "Not disclosed", "No public list rate", "Contract structure, usage denominator, and model cost"]
    notes: "Source: Redo pricing page reviewed on 2026-10-21; published rates do not establish realized revenue, contract terms, discounts, or margins."
    claimRefs: [CI001, CI002, CI010]
  - id: TI003
    title: Unit economics and capital-adequacy evidence
    columns:
      - Metric
      - Public value or status
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - [Revenue and ARR, "Not disclosed", Medium, "Defines scale and valuation denominator", "Audited monthly revenue by product, recurring classification, and ARR bridge"]
      - [Gross margin, "Not disclosed", Medium, "Tests software versus logistics/service mix", "Gross margin by module including labels, support, AI, and international operations"]
      - [Burn and runway, "Not disclosed", Medium, "Determines financing dependency", "Cash balance, monthly net cash burn, committed spend, and base/downside runway"]
      - [CAC and payback, "Not disclosed", Low, "Tests free-core acquisition efficiency", "CAC by channel, sales cycle, implementation cost, and gross-margin payback"]
      - [Retention and expansion, "1,750+ merchants use multiple offerings; cohort metrics unavailable", Medium, "Tests land-and-expand quality", "Logo and revenue retention, product attach cohorts, and expansion ARR"]
      - [Merchant outcome proxies, "Company reports varied return, exchange, AOV, and retained-revenue improvements", Low, "Supports product value but not Redo revenue", "Customer-level baselines, sample sizes, measurement windows, and independent validation"]
      - [Recent financing, "$81M Series B; current cash and obligations unavailable", High, "Provides growth capital but not measured adequacy", "Cash, debt, preferences, acquisition consideration, uses to date, and next-round trigger"]
    notes: "Nulls mean the assigned public source pool did not disclose the metric; merchant outcomes are company-reported and are not Redo financial results."
    claimRefs: [CI005, CI006, CI009, CI011, CI014, CI016]
figures:
  - id: FI001
    title: Revenue model bridge from merchant activity to unknown gross profit
    type: flow
    summary: Redo can monetize merchant and shopper activity across several usage surfaces, but public evidence stops before realized revenue mix and gross profit.
    data:
      nodes:
        - id: merchant-entry
          label: Merchant adopts free returns portal
          value: "Free list price"
          detail: "Redo says it covers return-label costs."
        - id: shopper-coverage
          label: Shopper selects returns coverage
          value: "Fee not publicly disclosed"
          detail: "A third-party comparison describes the free model as funded by shopper opt-in coverage at checkout."
        - id: merchant-usage
          label: Orders and support interactions generate usage
          value: "Orders, tracked orders, resolutions, sends"
          detail: "Public pricing uses multiple activity denominators."
        - id: paid-modules
          label: Paid modules generate list-price billings
          value: "$0.40/order; $0.08/tracked order; $0.20/resolution"
          detail: "Other modules use per-send, revenue-share, or custom pricing."
        - id: cross-sell
          label: Merchants adopt multiple offerings
          value: "1,750+ merchants"
          detail: "Company-reported multi-product usage is a cross-sell proxy, not ARR."
        - id: realized-revenue
          label: Realized revenue
          value: "Unavailable"
          detail: "Mix, discounts, contract terms, and recurring classification are not public."
        - id: gross-profit
          label: Gross profit after delivery costs
          value: "Unavailable"
          detail: "Label, logistics, support, AI, payment, and carrier costs are not disclosed."
    approximationNotes: "Ordered mechanism only; node order does not imply conversion rates or value-proportional magnitude."
    claimRefs: [CI003, CI005, CI012, CI016]
callouts:
  - calloutType: risk
    title: Financing is not runway
    body: The Series B amount cannot be converted into current cash or months of runway without uses to date, acquisition consideration, burn, debt, and working-capital data.
    claimRefs: [CI006, CI008, CI016]
  - calloutType: recommendation
    title: Underwrite by module and cohort
    body: Request a product-level revenue and gross-margin bridge, plus merchant cohorts showing attach, retention, expansion, and label or logistics loss economics.
    claimRefs: [CI002, CI005, CI009, CI014]
