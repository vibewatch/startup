schemaVersion: "report-v2"
artifact: financials
slug: redo
runDate: 2026-10-21
company:
  name: Redo
chapter:
  number: 4
  title: Financials
  summary: Redo publishes a free returns core and usage-priced adjacent modules, while third-party reporting says the shopper-funded checkout model helps finance return-label costs. The June 2026 Series B supplied $81 million of growth capital, but revenue, ARR, gross margin, burn, cash, runway, retention, CAC/payback, and financing terms remain undisclosed, preventing a conventional quality-of-revenue or capital-adequacy underwriting.
sections:
  - id: revenue-model-and-pricing
    title: Revenue model and pricing
    body: >-
      Redo uses a land-and-expand monetization design rather than a single disclosed subscription.
      Its official pricing surface lists the returns portal as free and says Redo covers return-label
      costs; an adjacent-industry comparison describes the economic mechanism as an optional
      shopper-paid returns-coverage fee at checkout. Around that anchor, Redo publishes usage prices
      for checkout optimization, order tracking, support resolutions, email and SMS, and recovered
      carts, while returns AI remains custom-priced. These are list prices, not realized revenue,
      discounts, contract values, or gross margin. The model may lower initial merchant adoption
      friction, but underwriting requires the revenue mix and unit contribution of each stream,
      especially the shopper-funded coverage pool and label-cost exposure.
    claimRefs: [CI001, CI002, CI003, CI010]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: commercial-traction-and-expansion
    title: Commercial traction and expansion signals
    body: >-
      Public evidence offers scale and cross-sell proxies but no audited financial traction. Redo's
      current homepage says it serves more than 4,500 brands, and the June financing release says
      more than 1,750 merchants use multiple offerings. Those figures support a plausible expansion
      motion from free returns into paid adjacent modules, but they do not reveal paying-customer
      count, average revenue per merchant, cohort retention, sales cycle, CAC, or payback. Redo also
      publishes merchant-reported outcomes such as higher exchange rates and retained revenue, with
      an explicit warning that individual results vary. These outcomes are product-value signals,
      not evidence of Redo's own revenue, margin, or merchant-level profitability.
    claimRefs: [CI004, CI005, CI011]
  - id: costs-and-unit-economics
    title: Cost structure and unit-economics constraints
    body: >-
      Redo's cost base cannot be reconstructed from public disclosures. The operating model likely
      combines software delivery with return-label funding, customer support, AI inference,
      payments, carrier connectivity, and increasingly physical international returns operations.
      Redo says ReturnBear added local inspection, refurbishment, re-fulfillment, and reshipment
      capabilities across more than 100 countries; those activities can introduce service-delivery
      and working-capital complexity beyond a pure software model. Shopify's merchant guidance
      identifies acquisition, pick-and-pack, packaging, parcel shipping, 3PL services, discounts,
      spoilage, and returns as order-level profitability inputs, while an industry comparison notes
      that portals still depend on ERP and warehouse systems for inspection, disposition, inventory,
      and accounting. None of these benchmarks discloses Redo's actual costs.
    claimRefs: [CI008, CI009, CI012, CI013, CI014]
    tableRefs: [TI003]
  - id: capital-adequacy-and-verdict
    title: Capital adequacy and financial verdict
    body: >-
      The $81 million Series B is verified financing, not evidence of cash available today or a
      measured runway. The company said proceeds would support product development, AI initiatives,
      and international expansion, and it had already deployed an unspecified portion to acquire
      ReturnBear. No reviewed source reports cash on hand, monthly burn, debt, project-finance
      obligations, acquisition consideration, preferred terms, liquidation preferences, or a
      next-round trigger. The FTC fee-rule source retained for refresh evidence applies specifically
      to live-event tickets and short-term lodging, so it does not establish that Redo's checkout
      coverage is governed by that rule; product-level and jurisdiction-specific legal analysis is
      still required. The financial verdict is therefore evidence of a credible multi-stream model
      and ample recent financing, but insufficient evidence of revenue quality, margin durability,
      or capital adequacy.
    claimRefs: [CI006, CI007, CI008, CI009, CI015, CI016]
tables:
