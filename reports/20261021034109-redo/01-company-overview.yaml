company:
  name: "Redo"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Redo is a Draper, Utah commerce-software company that has expanded from returns and exchanges into a broader post-purchase platform. A company-issued June 2026 release reports an $81 million Series B at a $1.25 billion valuation, while current public pages indicate more than 4,500 brands but do not disclose audited revenue, ARR, headcount, total capital raised, or governance details."
sections:
  - id: "identity-and-platform"
    title: "Identity and platform scope"
    body: >-
      Redo presents itself as a Draper, Utah technology company serving direct-to-consumer
      brands. Its current platform spans returns and claims, shipping and fulfillment,
      order tracking, support, marketing, payments, and international returns rather than
      remaining a single-purpose returns portal. The product thesis is vendor consolidation:
      post-purchase interactions share customer and order data, allowing Redo to automate
      exchanges, support, recovery, and fulfillment workflows from one operating surface.
      Shopify's discussion of direct commerce supports the strategic value of first-party
      purchase and preference data, but it does not validate Redo's execution or economics.
      The available evidence therefore supports the product category and operating model,
      while founding date and a complete corporate history remain unverified.
    claimRefs: [CO001, CO006, CO016]
    tableRefs: [TO001]
  - id: "capital-scale-and-milestones"
    title: "Capital, scale, and milestones"
    body: >-
      On June 23, 2026, Redo announced an $81 million Series B at a reported $1.25 billion
      valuation, led by Smash Capital with Pelion Venture Partners and Cervin Ventures also
      participating. The same syndicated company release said more than 4,100 brands used
      the platform and more than 1,750 used multiple offerings. Redo's current homepage now
      says it serves more than 4,500 brands, which is directionally consistent with expansion
      but is not an independently audited customer count. The financing release also says
      Redo had acquired ReturnBear to add international return and fulfillment operations
      across more than 100 countries. Total capital raised, revenue, ARR, margins, retention,
      and headcount are not disclosed in the assigned evidence and must remain gaps.
    claimRefs: [CO002, CO003, CO004, CO005, CO010, CO013]
    figureRefs: [FO001]
  - id: "leadership-and-stakeholders"
    title: "Leadership and stakeholder concentration"
    body: >-
      The accessible leadership evidence identifies Sterling Snow as co-founder and chief
      executive and Aaron Evett as chief commerce officer. It does not establish the full
      founder group, board composition, executive tenure, ownership, voting rights, or
      succession planning. That limited disclosure makes key-person and governance analysis
      preliminary. Economically important stakeholders include the Series B lead and existing
      investors, the acquired ReturnBear operation, Shopify as the principal commerce
      ecosystem highlighted by product documentation, and merchants whose adoption sustains
      the usage-led model. None of the public sources specifies investor control rights or
      liquidation preferences, so the financing documents and capitalization table are
      required before drawing control conclusions.
    claimRefs: [CO003, CO009, CO010, CO011, CO012]
    tableRefs: [TO002, TO003]
  - id: "business-model-and-diligence-boundaries"
    title: "Business model and diligence boundaries"
    body: >-
      Redo advertises its returns portal as free and says it covers return-label costs, while
      an independent August 2026 comparison explains that the economics rely on shoppers
      opting into paid returns coverage at checkout and that several adjacent modules are
      usage-priced. This can accelerate adoption and cross-sell, but it shifts diligence
      toward checkout consent, fee disclosure, merchant concentration, and unit economics
      rather than a conventional seat-based SaaS model. The comparison also characterizes
      Redo as Shopify-shaped and notes that portal vendors emit events while warehouse and
      ERP systems retain physical and financial control. The cited FTC fee rule currently
      covers live-event tickets and short-term lodging, not general ecommerce returns;
      therefore it is a disclosure benchmark, not evidence that Redo violates that rule.
      Product-level legal review across relevant jurisdictions remains necessary.
    claimRefs: [CO007, CO008, CO009, CO014, CO015]
