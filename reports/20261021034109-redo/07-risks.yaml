    body: Pause or reject investment if specialist counsel finds unlicensed regulated activity, audited product cohorts show structurally negative contribution margin, a critical platform or logistics dependency lacks workable transition rights, or material privacy, security, or AI-control findings remain unremediated after confirmatory diligence.
