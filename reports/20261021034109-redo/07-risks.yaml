company:
  name: Redo
chapter:
  number: 7
  title: Risks
  summary: Redo's highest-priority exposures are the unverified legal treatment and checkout presentation of package-protection fees, the economics of free or usage-priced products, and dependence on Shopify-linked workflows plus a growing logistics footprint. Public evidence shows broad product and merchant reach, but it does not establish licensing, audited unit economics, security controls, incident history, partner concentration, or mitigation maturity.
sections:
  - id: ranked-risk-view
    title: Ranked risk view
    body: >-
      The central diligence risk is not a documented enforcement action against Redo; none is established by the assigned evidence. It is the combination of shopper-facing protection products, fee-sensitive checkout design, free merchant entry points, and limited public proof about legal classification or unit economics. The FTC fee rule reviewed here directly covers live-event tickets and short-term lodging, not Redo's disclosed ecommerce categories, so it is a disclosure-principles signal rather than proof of applicability. A proposed case concerning competitor Route likewise illustrates a possible fee-presentation theory but is neither a Redo incident nor an independent benchmark of Redo's compliance. The heatmap therefore ranks residual exposure, not proven violations, and assigns lower mitigation maturity where public controls are absent.
    claimRefs: [CR001, CR002, CR003, CR006, CR009, CR015]
    figureRefs: [FR001]
  - id: legal-regulatory
    title: Legal and regulatory exposure
    body: >-
      Redo's public pages describe claims, warranties, payments, checkout optimization, cross-border operations, and package protection, but the assigned evidence does not identify the legal entities, licenses, insurance counterparties, policy wording, jurisdictional exclusions, or consumer-consent controls supporting those products. FTC staff guidance says covered businesses may not misrepresent fee purpose or amount and treats default billing, pre-checked boxes, and opt-out provisions as potentially making a fee mandatory. That rule has a narrow stated sector scope, yet the control lesson is relevant: diligence should reconstruct Redo's checkout flows by jurisdiction and product, test affirmative consent and refund disclosures, and obtain counsel's classification memo. The competitor case heightens the diligence priority without establishing misconduct by Redo.
    claimRefs: [CR001, CR002, CR003, CR007, CR008]
    tableRefs: [TR001]
  - id: operating-model
    title: Operational, quality, AI, and financial-model exposure
    body: >-
      Redo reports labels in more than 100 countries, five in-country return hubs, licensed customs brokers, and three-to-four-day refunds, creating execution dependencies across carriers, brokers, hubs, data flows, and merchant systems. Its pricing page also shows free returns and claims products, return-label funding, revenue-share choices, transaction pricing, per-resolution pricing, and performance fees. That breadth may diversify monetization, but public evidence does not disclose gross margin, fraud losses, subsidy incidence, service-level performance, or working-capital requirements. Company-authored AI results and merchant outcomes are not independent validation; the company's own interview stresses human oversight. Investment approval should require cohort economics, error and fraud rates, incident logs, and product-level profitability.
    claimRefs: [CR005, CR006, CR007, CR008, CR013, CR014]
    tableRefs: [TR002]
  - id: dependencies-triggers
    title: Partner dependencies, monitoring, and thesis-break triggers
    body: >-
      The product narrative is explicitly Shopify-centered, while Redo is simultaneously expanding across commerce software, customer support, payments, shipping, and international returns. Company disclosures of 4,100 brands and 1,750 multi-offering merchants in June 2026, alongside current marketing to 4,500+ brands, indicate reach but do not reveal revenue concentration, retention, or Shopify-channel dependence. The June financing supplies expansion capital, not proof of runway or sustainable economics. Monitor platform-policy changes, merchant churn, broker or carrier service failures, claim-loss ratios, AI escalation rates, regulatory inquiries, and product-level gross profit. Break the thesis if counsel identifies unlicensed regulated activity, audited cohorts show structurally negative contribution margins, a critical platform dependency lacks transition rights, or material security findings remain unremediated.
    claimRefs: [CR004, CR005, CR009, CR010, CR011, CR012, CR016]
    tableRefs: [TR003]
tables:
  - id: TR001
    title: Regulatory / legal risk register
    columns:
      - Risk and jurisdiction
      - Status / evidence
      - Likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure and diligence path
    rows:
      - - Package-protection legal classification; United States and each launch jurisdiction
        - No Redo-specific license, insurance-counterparty, policy-form, or legal-classification evidence appears in the assigned pool.
        - Medium
        - High
        - Unverified
        - High; obtain counsel memo, entity/license schedule, policy forms, loss-bearing counterparty, and regulator correspondence.
      - - Checkout fee disclosure and affirmative consent; United States
        - FTC guidance directly covers tickets and lodging, not the disclosed Redo categories, but bars fee misrepresentation and flags default or pre-checked billing in covered transactions.
        - Medium
        - High
        - Unverified
        - High; replay checkout flows by product and state, preserve screenshots, and test opt-in, refund, and fee-purpose disclosures.
      - - Consumer litigation over shipping-protection presentation; United States
        - ClassAction.org reported a proposed case against Route over an allegedly hidden shipping-protection fee; it is comparator evidence, not a Redo allegation.
        - Medium
        - High
        - Unverified
        - Medium-high; search Redo entities and merchants in court records and review complaints, demand letters, arbitration, and settlement history.
      - - Cross-border customs, data, warranty, and claims compliance; 100+ disclosed label countries
        - Redo says licensed brokers file customs and five in-country hubs handle returns, but public evidence does not map licenses, processors, contracts, or local obligations.
        - Medium
        - High
        - Partial
        - Medium-high; obtain country-by-country legal matrix, broker agreements, data map, warranty terms, and compliance owners.
    notes: Partial public-evidence register as of 2026-10-21; likelihood, severity, mitigation maturity, and residual exposure are analyst assessments, while null public proof is not evidence that a control or incident does not exist.
    enumerationScope:
      coverage: partial
      basis: Highest-severity legal and regulatory exposures identifiable from the eight retained public sources; not an exhaustive jurisdiction or case search.
    claimRefs: [CR001, CR002, CR003, CR005, CR007, CR008]
  - id: TR002
    title: Operational / quality / security risk register
    columns:
      - Failure mode
      - Likelihood
      - Severity
      - Public mitigation evidence
      - Residual exposure
      - Unresolved gap / monitor
    rows:
      - - AI agents make incorrect return, support, fraud, or customer-facing decisions.
        - Medium
        - High
        - Company interview recommends keeping humans in the loop; no control framework or error-rate evidence is disclosed.
        - High
        - Obtain model inventory, escalation thresholds, override logs, accuracy by workflow, and material-error history.
      - - Free return labels, free claims products, revenue share, or per-transaction pricing compress contribution margin.
        - Medium
        - High
        - Multiple monetization mechanisms are disclosed, but no audited product-level economics are public.
        - High
        - Review gross profit by product/cohort, label cost, claim loss, fraud loss, revenue share, and working capital.
      - - Carrier, broker, or return-hub failure disrupts cross-border service and refunds.
        - Medium
        - High
        - Redo discloses licensed brokers, five in-country hubs, and 100+ label countries; redundancy and SLA performance are not public.
        - Medium-high
        - Obtain counterparty list, concentration, service levels, business-continuity tests, insurance, and exception rates.
      - - Rapid suite expansion causes integration, reliability, privacy, or implementation failures.
        - Medium
        - High
        - Broad commerce and post-purchase modules are marketed; no public status history, security certification, incident log, or implementation-quality data was retained.
        - High
        - Review architecture, subprocessor map, penetration tests, certifications, uptime, incidents, implementation times, and support escalations.
    notes: Analyst risk ratings synthesize company product/pricing disclosures and do not represent measured incident probabilities; missing public security or outage evidence is recorded as a gap, not proof of absence.
    claimRefs: [CR005, CR006, CR007, CR008, CR013, CR014]
  - id: TR003
    title: Partner / dependency risk register
    columns:
      - Dependency / counterparty
      - Role and disclosed concentration
      - Failure scenario
      - Severity
      - Public mitigation
      - Residual exposure
    rows:
      - - Shopify ecosystem
        - Core returns and post-purchase positioning is described as built specifically for Shopify; revenue or traffic concentration is undisclosed.
        - Policy, API, app-store, native-feature, or commercial change weakens distribution or functionality.
        - High
        - Product breadth may provide multiple merchant workflows, but no channel-diversification metrics or transition rights are public.
        - High; obtain platform agreements, API dependencies, non-Shopify mix, and contingency roadmap.
      - - Carriers, licensed customs brokers, and five disclosed return hubs
        - Enable labels in 100+ countries and local handling; individual counterparty shares are undisclosed.
        - Capacity, customs, insolvency, quality, or SLA failure delays delivery, inspection, and refunds.
        - High
        - Redo markets one network and local hubs; contractual redundancy and performance history are not public.
        - Medium-high; inspect contracts, concentration, backups, claims, and continuity testing.
      - - External capital and expansion execution
        - A June 2026 company release reported $81 million of Series B funding for product, AI, and international expansion; burn and runway are undisclosed.
        - Expansion spending outpaces product economics, implementation capacity, compliance, or merchant retention.
        - High
        - New capital increases capacity, but funding raised is not cash available and is not evidence of disciplined deployment.
        - High; obtain cash balance, monthly burn, board plan, hiring gates, product P&Ls, and downside runway.
      - - Merchant data, integrations, and low-friction contracts
        - Redo markets no contracts, cancellation at any time, and rapid deployment; retention, switching costs, and integration concentration are undisclosed.
        - Merchant churn or integration breakage reduces usage-based revenue and weakens data needed for AI workflows.
        - Medium
        - Multi-product adoption is company-reported for 1,750 of 4,100 brands in June 2026, but no cohort retention evidence is public.
        - High; obtain GRR, NRR, logo churn, module cohorts, top-merchant concentration, and integration-level revenue.
    notes: Concentration percentages and contract protections are unavailable publicly; residual ratings are diligence priorities rather than quantified probabilities.
    claimRefs: [CR004, CR005, CR009, CR010, CR011, CR012, CR016]
