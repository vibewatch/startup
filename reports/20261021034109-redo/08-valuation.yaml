  evidenceGaps:
    - type: "private-evidence-only"
      severity: "material"
      topic: "capitalization-and-financials"
      missingEvidence: >-
        Audited revenue and ARR, revenue mix, growth, gross margin, cohort GRR
        and NRR, customer concentration, CAC payback, burn, runway, net cash
        and debt, fully diluted ownership, dilution, and liquidation preferences.
      whyItMatters: >-
        These inputs determine normalized enterprise value, sustainable revenue
        quality, downside protection, and whether any entry price can produce
        the required return.
      diligencePath: >-
        Obtain audited financial statements, monthly KPI and cohort exports,
        bank and debt schedules, the capitalization table, financing documents,
        and the liquidation waterfall; reconcile them to management reporting.
      relatedQuestionRefs:
        - "QV009"
        - "QV010"
    - type: "missing-source"
      severity: "material"
      topic: "package-protection-compliance"
      missingEvidence: >-
        State-by-state legal opinions, licenses, carrier or underwriter
        agreements, claims loss data, regulator correspondence, and revenue
        concentration for shopper-paid package or returns protection.
      whyItMatters: >-
        A restriction or restructuring of a material shopper-funded product
        could change adoption economics, margin, growth, and valuation.
      diligencePath: >-
        Have insurance-regulatory counsel review the product and contracts in
        every material state and reconcile the legal structure to revenue and
        claims data.
      relatedQuestionRefs:
        - "QV008"
        - "QV009"
    - type: "missing-source"
      severity: "material"
      topic: "exit-readiness"
      missingEvidence: >-
        Board-approved operating plan, independently verified customer cohorts,
        forecast accuracy history, buyer or IPO readiness analysis, and an exit
        model tied to a stated hold period and investor return threshold.
      whyItMatters: >-
        Public evidence cannot establish a probability-weighted exit value or
        target return without validated operating milestones and timing.
      diligencePath: >-
        Build bear, base, and bull operating models from audited company data,
        test them against denominator-matched transactions, and review the
        resulting exit cases with the board and lead investor.
      relatedQuestionRefs:
        - "QV010"
