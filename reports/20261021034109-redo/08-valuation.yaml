figures:
  - id: "FV001"
    title: "Recommendation logic"
    type: "flow"
    summary: >-
      The reported financing mark must pass operating, benchmark, and
      capitalization tests before it can support an investable return case.
    data:
      nodes:
        - id: "reported-mark"
          label: "$1.25B reported valuation"
          detail: "Third-party financing reports describe an $81M Series B."
        - id: "market-proof"
          label: "Large returns problem"
          detail: "Online returns were estimated at 19.3% of 2025 sales."
        - id: "company-proof"
          label: "Adoption and product proof"
          detail: "Company-reported brand scale and exchange outcomes require independent cohort validation."
        - id: "operating-proof"
          label: "Audited operating proof"
          detail: "Revenue, growth, retention, margin, burn, and concentration are not public."
        - id: "capitalization-proof"
          label: "Capitalization and legal proof"
          detail: "Net debt, cash, preferences, dilution, and protection compliance must be verified."
        - id: "decision"
          label: "Research more / stretched"
          detail: "Price-sensitive recommendation pending evidence and a modeled target return."
      edges:
        - from: "reported-mark"
          to: "market-proof"
          label: "test demand"
        - from: "market-proof"
          to: "company-proof"
          label: "test capture"
        - from: "company-proof"
          to: "operating-proof"
          label: "test economics"
        - from: "operating-proof"
          to: "capitalization-proof"
          label: "normalize value"
        - from: "capitalization-proof"
          to: "decision"
          label: "underwrite return"
    approximationNotes: >-
      The ordered flow is an underwriting sequence, not a causal model or a
      probability-weighted forecast.
    claimRefs:
      - "CV002"
      - "CV005"
      - "CV009"
      - "CV011"
      - "CV016"
callouts:
  - calloutType: "recommendation"
    title: "No price-blind buy"
    body: >-
      The company may be strategically attractive, but public evidence does
      not establish that the reported $1.25 billion price can deliver a target
      return. Require audited economics, capitalization terms, and legal
      support before moving beyond research-more.
    claimRefs:
      - "CV002"
      - "CV005"
      - "CV011"
      - "CV016"
