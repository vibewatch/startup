      - ["Target return / hold / exit", "Not supportable from public evidence", "Set only after entry price, preference stack, revenue quality, and exit multiple are verified."]
    notes: >-
      Assessments use the June 2026 reported financing mark and October 2026
      benchmark context; they are not a transaction opinion or a forecast.
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV003"
      - "CV004"
      - "CV005"
      - "CV011"
      - "CV016"
  - id: "TV002"
    title: "Thesis and anti-thesis"
    columns:
      - "Lens"
      - "Current evidence"
      - "What would change the view"
    rows:
      - ["Thesis: structural demand", "Online returns were estimated at 19.3% of sales in 2025.", "Lower sustained return intensity or reduced merchant willingness to pay would weaken the demand case."]
      - ["Thesis: distribution and breadth", "Redo claims 4,500+ brands; financing coverage attributed 1,750+ multi-product merchants to the company.", "Audited active-customer, cohort, and module revenue data must show durable expansion rather than inactive installs."]
      - ["Thesis: merchant outcomes", "Redo reports a 17% average exchange increase after moves from legacy platforms.", "Independent cohort evidence with denominators and time periods would raise confidence."]
      - ["Anti-thesis: monetization quality", "Free core products and shopper-funded coverage may accelerate adoption while obscuring recurring software economics.", "Revenue mix, contribution margin, opt-in rate, claims loss ratio, and churn would clarify durability."]
      - ["Anti-thesis: regulatory exposure", "Legal commentary says separately paid package protection may be treated as insurance under broad state definitions.", "Licenses, carrier structure, legal opinions, and regulator correspondence could reduce or confirm this risk."]
    notes: >-
      Company adoption and outcome figures are company claims; the competitive
      comparison is directional and is not an independent operating benchmark.
    claimRefs:
      - "CV006"
      - "CV007"
      - "CV008"
      - "CV009"
      - "CV010"
      - "CV011"
      - "CV015"
  - id: "TV003"
    title: "Bull, base, and bear scenario frame"
    columns:
      - "Case"
      - "Explicit assumptions"
      - "Valuation / return logic"
      - "Key risks and probability signal"
    rows:
      - ["Bear", "Weak paid-module conversion; NRR below 101%; gross margin below 75%; protection economics constrained.", "No supported Redo range; test against the 1.7x public e-commerce EV/NTM revenue reference only after normalizing enterprise value.", "Adverse signal if audited metrics miss broad SaaS medians or regulation impairs monetization."]
      - ["Base", "Customer scale converts into multi-product revenue, but growth and margins are near broad SaaS benchmarks.", "No supported Redo range; 1.7x public EV/NTM revenue and 3.8x private SaaS M&A revenue are directional, denominator-mismatched references.", "Mixed signal until audited revenue, retention, cash, debt, and preference terms are disclosed."]
      - ["Bull", "Strong module expansion, independently verified merchant outcomes, NRR above the broad median, and compliant protection structure.", "A premium may be defensible, but no numeric Redo range is supportable without forward revenue, growth, margin, and capitalization data.", "Conditional signal requiring audited evidence rather than company claims."]
      - ["Entry gate", "Round valuation converts to enterprise value and the investor models dilution, preferences, hold period, and exit multiple.", "At 1.7x, $1.25B corresponds to about $735M of revenue before equity-to-EV adjustments; this is a hurdle illustration, not a forecast.", "Do not invest if the required operating scale or target return depends on unsupported assumptions."]
    notes: >-
      Scenario references mix public EV/NTM revenue and private M&A revenue
      benchmarks and therefore are not directly comparable; no probability
      percentages or Redo valuation range are asserted.
    claimRefs:
