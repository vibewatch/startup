schemaVersion: "report-v2"
artifact: "valuation"
slug: "redo"
runDate: 2026-10-21
company:
  name: "Redo"
chapter:
  number: 8
  title: "Valuation"
  summary: >-
    Redo's reported $1.25 billion Series B valuation is supported by a large
    returns market, company-reported customer scale, and a broadening product
    suite, but public evidence does not disclose the revenue, retention,
    margin, burn, or preference terms needed to underwrite that price. The
    appropriate stance is research-more with high risk and a stretched
    valuation view until audited operating and capitalization data establish
    a defensible entry and return case.
sections:
  - id: "decision-and-price-discipline"
    title: "Decision and price discipline"
    body: >-
      The recommendation is research-more, with medium confidence, high risk,
      and a stretched valuation stance. Two third-party reports describe an
      $81 million Series B at a $1.25 billion valuation, while Redo's current
      homepage claims more than 4,500 brands and the June financing coverage
      attributes more than 1,750 multi-product merchants to the company. Those
      adoption signals are useful but cannot replace audited revenue quality:
      the retained financing accounts provide no ARR or revenue, gross margin,
      retention, cash burn, net cash or debt, dilution, or liquidation
      preference data. A target return, hold period, and supported exit value
      therefore cannot be calculated from public evidence. Entry discipline
      should begin with normalized enterprise value and audited forward
      revenue, then test whether Redo earns a premium through growth,
      retention, and margins rather than assuming the reported round price is
      intrinsically fair.
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV005"
      - "CV006"
      - "CV007"
      - "CV016"
    tableRefs:
      - "TV001"
    figureRefs:
      - "FV001"
  - id: "financing-and-benchmark-context"
    title: "Financing and benchmark context"
    body: >-
      The closest retained public-market reference is not a direct comparable:
      Multiples.vc reports a 1.7x next-twelve-month EV/revenue multiple for
      public e-commerce software as of October 21, 2026, while SaaSrise cites a
      3.8x revenue multiple for private SaaS M&A. The first uses enterprise
      value and forward revenue; the second is a broad private transaction
      reference; Redo's $1.25 billion figure is a reported financing valuation
      with undisclosed net debt, cash, and preference terms. Dividing the
      reported mark by 1.7x produces an illustrative revenue hurdle of about
      $735 million, not an estimate of Redo revenue and not a valid equity
      valuation without capitalization adjustments. The exercise shows how
      demanding the public mark could be, while the absence of audited inputs
      prevents a defensible valuation range.
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV003"
      - "CV004"
      - "CV005"
      - "CV012"
  - id: "thesis-antithesis-and-scenarios"
    title: "Thesis, anti-thesis, and scenarios"
    body: >-
      The thesis is that returns are a large, persistent commerce problem and
      Redo can use free entry products, usage-priced modules, and AI-assisted
      exchanges to consolidate post-purchase workflows. Retail TouchPoints,
      citing an NRF and Happy Returns study, reports a 19.3% online return rate
      for 2025, while Redo claims a 17% average exchange increase after
      merchants move from legacy platforms. The anti-thesis is that these
      company-reported outcomes may not translate into durable recurring
      economics, and an independent comparison says the free returns model is
      funded through shopper opt-in coverage. Legal commentary warns that
      separately paid package protection can resemble insurance under broad
      state definitions. Bull, base, and bear cases are therefore framed as
      diligence conditions rather than false valuation precision.
    claimRefs:
      - "CV008"
      - "CV009"
      - "CV010"
      - "CV011"
      - "CV013"
      - "CV014"
      - "CV015"
      - "CV016"
    tableRefs:
      - "TV002"
      - "TV003"
  - id: "exit-readiness-and-final-diligence"
    title: "Exit readiness, diligence asks, and thesis-break triggers"
    body: >-
      Exit readiness is unproven because the public record does not reveal the
      financial durability or preference stack an acquirer or public investor
      would underwrite. Before investment, obtain audited revenue by module,
      geography, and payer; ARR reconciliation; cohort gross and net revenue
      retention; gross margin by software, fulfillment, and protection
      products; customer concentration; CAC payback; burn and runway; net cash
      and debt; and the fully diluted cap table with liquidation preferences.
      Also require state-by-state legal analysis and licensing evidence for
      shopper-paid protection. Thesis-break triggers include audited NRR below
      the cited 101% private-SaaS median, gross margin below the cited 75%
      median without a credible improvement plan, an enterprise-value multiple
      above the public e-commerce reference without superior growth, or a
      material regulatory restriction on a core monetization stream. Evidence
      clearing those tests, paired with an entry price that supports the
      investor's required return, could move the recommendation.
    claimRefs:
      - "CV003"
      - "CV005"
      - "CV010"
      - "CV011"
      - "CV013"
      - "CV014"
      - "CV016"
