schemaVersion: "report-v2"
artifact: product-tech
slug: redo
runDate: "2026-10-21"
company:
  name: Redo
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Redo presents a broad, Shopify-oriented post-purchase operating surface spanning returns,
    claims, tracking, fulfillment, support, marketing, checkout, warranties, and international
    returns. Public evidence establishes the module breadth and shopper-to-operations workflow,
    but not Redo's private technical architecture, service-level performance, security
    certifications, or developer ecosystem.
sections:
  - id: product-surface-and-workflows
    title: Product surface and customer workflow
    body: >-
      Redo's current public surface is broader than a returns portal. Its homepage groups the
      proposition around marketing, payments, shipping, and returns, while the pricing page
      itemizes returns, claims, shipping and fulfillment, warranties, checkout optimization,
      upsell, email and SMS, order tracking, recovery, identity resolution, support, AI agents,
      and chargeback representment. Returns is listed as free and includes a portal, analytics,
      return-label coverage, and return-specific AI agents; several adjacent products use
      transaction or resolution pricing. That structure supports a land-and-expand product
      strategy rather than a single-SKU application. A 2026 third-party article reported that
      more than 1,750 customers used multiple Redo offerings, but the claim is not independently
      audited and should not be treated as retention evidence. For merchants, the practical
      workflow is shopper self-service first, with exchanges, claims, support, and tracking
      sharing order and interaction context.
    claimRefs: [CE001, CE002, CE003, CE005, CE006]
    tableRefs: [TE001, TE002]
  - id: operating-architecture-and-dependencies
    title: Operating architecture and dependencies
    body: >-
      The observable architecture is an operating workflow, not a disclosed software stack.
      Shopper portals and agents initiate requests; policy, recommendation, and fraud logic
      determine the proposed outcome; commerce-system events then pass work to fulfillment,
      warehouses, and finance. An ERP-focused comparison describes portals such as Redo as the
      customer-facing authorization and decision layer, while inspection, disposition,
      returns-in-process inventory, reconciliation, and accounting remain warehouse and ERP
      responsibilities. This boundary makes implementation quality dependent on clean events,
      inventory-location accuracy, and integrations rather than the portal alone. Public
      material is strongly Shopify-shaped, although the comparison reports support for
      BigCommerce and Salesforce Commerce Cloud. Redo also claims international labels in more
      than 100 countries, five in-country hubs, and three-to-four-day refunds; these are
      company-issued operating claims, not verified performance benchmarks.
    claimRefs: [CE007, CE008, CE009, CE011, CE012]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: maturity-differentiation-and-controls
    title: Maturity, differentiation, and control gaps
    body: >-
      Product maturity is clearest in packaging and operating breadth: Redo offers white-glove
      onboarding, publishes granular usage prices, and describes a consolidated data surface for
      order, return, claim, support, and marketing workflows. Its own 2025 article claimed that
      AI agents could resolve up to 60% of support tickets, but no cohort, denominator, evaluation
      method, or independent benchmark was disclosed. A direct competitor's 2026 comparison adds
      a useful caution: Redo's published help materials list order-tracking actions for the agent,
      while the AI product page reportedly names order, return, and claim inputs without naming
      tracking data. That inconsistency requires implementation-level verification, not a
      conclusion that tracking data is absent. Trust diligence remains incomplete: the assigned
      evidence contains no SOC 2 or ISO 27001 report, penetration-test summary, public status
      history, SLA, data-flow map, API documentation, or public repository activity. Shopify's
      own guidance underscores that first-party customer data creates governance and security
      obligations. The FTC fee rule reviewed here directly covers live-event tickets and
      short-term lodging rather than general ecommerce, so it is not proof that Redo's optional
      shopper-paid coverage is compliant; it is a control-design reference for affirmative
      selection, fee purpose, and clear disclosure.
    claimRefs: [CE004, CE010, CE013, CE014, CE015, CE016]
callouts:
  - calloutType: risk
    title: Public assurance evidence is missing
    body: >-
      Treat AI autonomy, tracking-data access, shopper-paid coverage design, security controls,
      and uptime as diligence items until Redo supplies implementation documentation and
      assurance evidence.
    claimRefs: [CE013, CE014, CE015, CE016]
