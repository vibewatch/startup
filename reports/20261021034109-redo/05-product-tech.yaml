      - ["Resolve a post-purchase question", "Agents switch among order, return, claim, and knowledge systems", "Support co-pilot and Support AI Agent", "Redo claims automated responses and cross-product context", "Tracking-data inputs and resolution-quality measurement need verification"]
      - ["Process a cross-border return", "International labels, customs, inspection, and refunds span vendors", "International labels and in-country return hubs", "Redo claims local drop-off and refunds in three to four days", "No lane-level SLA, exception rate, or hub utilization is public"]
      - ["Close the inventory and accounting loop", "A portal request must become inspected, reconciled inventory and a booked refund", "Commerce events and published ERP/3PL connections", "Front-end authorization can feed systems of record", "ERP and warehouse still own inspection, disposition, reconciliation, and finance"]
    notes: >-
      Benefits are company claims or commercially interested comparisons; null benchmark and
      control fields are translated into explicit diligence asks.
    claimRefs: [CE005, CE008, CE009, CE010, CE011, CE013]
  - id: TE003
    title: Technology and operating architecture
    columns:
      - Layer
      - Role
      - Public evidence
      - Dependency
      - Principal risk
    rows:
      - ["Shopper interaction", "Capture return, claim, support, tracking, and recommendation requests", "Company pages describe portals, chat, text, and self-service", "Storefront identity, order data, and channel availability", "Incorrect identity or stale order context can produce wrong actions"]
      - ["Decision and automation", "Apply policy, recommendations, fraud checks, and AI responses", "Redo describes AI agents and configurable human involvement", "Model quality, merchant rules, permissions, and knowledge content", "Public input descriptions are incomplete and outcome benchmarks are unaudited"]
      - ["Commerce event layer", "Write return, exchange, credit, and order changes to the commerce platform", "Third-party comparison describes event handoff to commerce systems", "Shopify-oriented objects and connector fidelity", "Partial writes or mismatched inventory locations can break downstream reconciliation"]
      - ["Fulfillment and reverse logistics", "Route parcels, inspect goods, and determine disposition", "Redo markets shipping, managed returns, hubs, and international labels", "Carriers, warehouses, brokers, 3PLs, and regional rules", "No public lane-level reliability, capacity, or exception-rate data"]
      - ["Governance and assurance", "Protect customer data and constrain automated actions", "Shopify guidance identifies privacy, security, and governance duties", "Data map, access controls, audit logs, certifications, and incident process", "No assigned source establishes Redo's certifications, SLA, or public incident history"]
    notes: >-
      This is an evidence-bounded operating model, not a claim about Redo's undisclosed internal
      software stack or infrastructure.
    claimRefs: [CE009, CE011, CE012, CE013, CE014]
figures:
  - id: FE001
    title: Evidence-bounded product architecture map
    type: stack
    summary: >-
      Six observable operating layers show where Redo acts directly and where merchant,
      platform, and logistics dependencies remain.
    data:
      layers:
        - label: Shopper channels
          detail: Returns portal, website chat, text, email, tracking pages, and self-service claims.
          modules:
            - Returns and exchanges
            - Claims and warranties
            - Support conversations
        - label: Engagement applications
          detail: Marketing, recovery, checkout optimization, upsell, and order tracking.
          modules:
            - Email and SMS
            - Cart recovery
            - Checkout optimization
        - label: Decision automation
          detail: Recommendations, return review, fraud detection, response drafting, and automated actions.
          modules:
            - Exchange recommendations
            - Support AI agents
            - Return analysis
        - label: Commerce and integration
          detail: Shopify-oriented order, inventory, return, exchange, credit, and tracking events.
          modules:
            - Commerce platform
            - ERP and 3PL connectors
            - Inventory locations
        - label: Physical operations
          detail: Carrier labels, local hubs, inspection, fulfillment, reverse logistics, and refund handoff.
          modules:
            - Carrier network
            - In-country hubs
            - Warehouse inspection
        - label: Merchant control plane
          detail: Policies, knowledge content, permissions, analytics, assurance, and human review.
          modules:
            - Merchant rules
            - Human approval
            - Security and governance
    approximationNotes: >-
      Layer order represents the observable workflow, not Redo's undisclosed deployment topology;
      modules are grouped from public product descriptions and third-party workflow analysis.
    claimRefs: [CE001, CE004, CE007, CE009, CE011, CE013, CE014]
