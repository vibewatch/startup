      - [Support and Commerce Agent, "CX teams and shoppers", "Support and agent products are commercially available", "Conversational actions connect support to order workflows", "Verify permissions, human-review controls, tracking inputs, and resolution quality"]
      - [Marketing and recovery, "Growth and retention teams", "Email/SMS and recovery are usage priced", "Post-purchase interaction data is reused for campaigns and cart recovery", "Verify consent, attribution, identity resolution, and incremental lift"]
      - [Checkout and payments tools, "Ecommerce and finance teams", "Checkout optimization and upsell are usage priced", "Segmentation, testing, recommendations, and chargeback evidence share the suite", "Verify experiment governance, payment-data scope, and shopper disclosure"]
    notes: >-
      Current product and price status comes from Redo's public pricing and homepage; maturity
      means publicly offered, not independently verified production quality.
    claimRefs: [CE001, CE002, CE003, CE007, CE008]
