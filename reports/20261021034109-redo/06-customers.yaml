        - Ecommerce merchant
        - Multi-tool consolidation
        - Not disclosed
        - Qualitative cost-savings testimonial
        - No baseline, date, contract scope, or retention metric
      - - Unidentified ShipHero-integrated merchant
        - Ecommerce merchant using a fulfillment integration
        - Returns flows and on-site exchanges
        - Implied production use, not independently verified
        - Qualitative time savings and customer engagement
        - Merchant identity, period, and measured result are absent
      - - Unidentified exchange merchant
        - Ecommerce merchant
        - Exchanges
        - Implied production use, not independently verified
        - Testimonial says exchanges rose 78%
        - No merchant identity, baseline, sample, period, or independent verification
    notes: >-
      Sample of references present in the retained official pages; only Primo Golf is named, and none
      supplies enough detail to establish contract durability or independently verified outcomes.
    enumerationScope:
      coverage: partial
      basis: >-
        References visible in the current-run fetched Redo pages, limited to testimonials with enough
        text to identify a deployment theme or stated outcome.
    claimRefs: [CU001, CU005, CU008, CU010]
figures:
  - id: FU001
    title: Merchant adoption and expansion journey
    type: journey-map
    summary: >-
      Redo's merchant loop moves from returns pressure through a low-cost entry product to exchanges
      and multi-product expansion, with shopper-fee trust and unproven retention as the key breaks.
    data:
      nodes:
        - id: need
          label: Returns pressure
          detail: Merchants face high return volume and material loyalty risk from poor experiences.
          touchpoints:
            - Returns operations
            - Shopper expectations
        - id: evaluate
          label: Evaluate economics
          detail: The free returns portal and covered labels reduce the merchant's initial software hurdle.
          touchpoints:
            - Pricing review
            - Operations review
        - id: consent
          label: Shopper coverage choice
          detail: Optional shopper-paid coverage can fund the model but introduces disclosure and trust friction.
          touchpoints:
            - Checkout
            - Fee disclosure
        - id: transact
          label: Return or exchange
          detail: Self-service flows and exchange recommendations attempt to retain revenue instead of issuing a refund.
          touchpoints:
            - Returns portal
            - Exchange recommendation
        - id: prove
          label: Validate outcomes
          detail: Merchant-reported exchange gains need named cohorts, baselines, and independent verification.
          touchpoints:
            - Analytics
            - Customer reference
        - id: expand
          label: Add products
          detail: Tracking, support, fulfillment, and marketing create a cross-sell loop after initial trust is earned.
          touchpoints:
            - Product expansion
            - Renewal review
    approximationNotes: >-
      The sequence is an analytical journey, not a measured funnel; no conversion rates, stage populations,
      or time-to-expand metrics are disclosed.
    claimRefs: [CU002, CU005, CU006, CU009, CU011, CU012, CU014]
callouts:
  - calloutType: strength
    title: Cross-sell is visible
    body: >-
      More than 1,750 merchants, roughly 40% of the reported base, used multiple Redo products in
      June 2025 reporting, providing a concrete land-and-expand signal.
    claimRefs: [CU002]
  - calloutType: risk
    title: Durability remains unproven
    body: >-
      Public sources do not disclose retention, renewal, contract-duration, or revenue-concentration
      data, so customer breadth cannot yet be translated into durable revenue quality.
    claimRefs: [CU015, CU016]
