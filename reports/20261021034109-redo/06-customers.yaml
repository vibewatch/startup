schemaVersion: "report-v2"
artifact: customers
slug: redo
runDate: 2026-10-21
company:
  name: Redo
chapter:
  number: 6
  title: Customers
  summary: >-
    Redo shows broad merchant adoption and meaningful cross-sell: current company material says
    4,500+ brands are served, while June 2025 reporting cited more than 4,300 brands and roughly
    40% using multiple products. The evidence is still weak on durability and concentration because
    retention, renewal, customer-size distribution, revenue concentration, and independently verified
    named-customer outcomes are not disclosed.
sections:
  - id: customer-segments-and-economic-buyer
    title: Customer segments, users, and payers
    body: >-
      Redo's commercial base is best understood as direct-to-consumer ecommerce merchants rather than
      shoppers, even though shoppers are the end users of return, claim, tracking, and support flows.
      Ecommerce, operations, customer-experience, and finance teams can each own part of the buying
      decision: the free returns portal addresses operating cost, while usage-priced tracking, support,
      checkout, and marketing products create additional merchant-paid expansion paths. A third-party
      comparison says the core returns model can instead be funded by an optional shopper-paid coverage
      charge at checkout, creating a second payer and making disclosure and brand trust part of the
      product decision. Shopify's broader DTC analysis also explains the strategic buyer appeal:
      direct transactions expose purchase-frequency and product-preference signals that can support
      retention workflows. The retained evidence does not segment Redo's 4,500+ brands by revenue,
      order volume, vertical, geography, or plan, so the mix of small Shopify stores versus larger
      enterprise deployments remains unknown.
    claimRefs: [CU006, CU007, CU009, CU013, CU016]
    tableRefs: [TU001]
  - id: adoption-and-expansion
    title: Adoption trajectory and multi-product expansion
    body: >-
      The available snapshots indicate expanding reach, but they are not a cohort series. An archived
      company page said 3,000+ ecommerce businesses trusted Redo; TechBuzz reported more than 4,300
      brands in June 2025; and the current company page says 4,500+ brands. Differences in page date,
      counting methodology, and the meaning of "brand" versus "business" prevent a defensible growth
      rate. The strongest expansion signal is TechBuzz's report that more than 1,750 merchants, roughly
      40% of the base at that time, used multiple Redo products. That supports land-and-expand behavior,
      but it is a company-supplied figure carried by media reporting and lacks product-level attach
      rates, revenue contribution, cohort age, or renewal evidence. Investor diligence should therefore
      treat cross-product adoption as promising commercial proof rather than as a substitute for NRR,
      GRR, or churn.
    claimRefs: [CU001, CU002, CU003, CU004, CU015]
    tableRefs: [TU002]
  - id: customer-proof-and-durability
    title: Customer proof, deployment quality, and durability
    body: >-
      Public proof is much stronger at aggregate scale than at the named-account level. Redo's archived
      page identifies Primo Golf in a testimonial about consolidating point solutions, but it gives no
      deployment date, contract scope, baseline, or quantified retention outcome. The current page adds
      testimonials describing a ShipHero integration and a 78% increase in exchanges, yet the merchants
      are not identified in the fetched text. A company blog separately claims a 17% average increase
      in exchanges after merchants moved from legacy return platforms. These claims show the intended
      value mechanism, but they are company-issued and have unspecified samples and denominators. No
      retained source reports NRR, GRR, churn, renewals, average contract length, referenceable customer
      cohorts, or production-versus-pilot status. Customer calls and cohort exports are therefore
      necessary before assigning durable revenue quality to the adoption figures.
    claimRefs: [CU005, CU008, CU010, CU015]
    tableRefs: [TU003]
  - id: customer-journey-and-friction
    title: Customer journey, value loop, and friction
    body: >-
      The customer loop starts with a merchant facing high returns volume and shopper expectations for
      a low-friction experience. Redo lowers the entry barrier with a free portal and company-funded
      labels, while the shopper-coverage mechanism can shift part of the economics to the checkout.
      Once installed, exchange recommendations and self-service workflows aim to convert refunds into
      retained revenue; successful merchants can then add tracking, support, fulfillment, and marketing
      modules. Industry evidence makes the stakes clear: NRF estimated that 15.8% of annual retail sales
      would be returned in 2025, and 71% of consumers said a poor returns experience would make them
      less likely to shop with a retailer again. The principal friction is trust. A comparison source
      warns that shopper-funded coverage is a brand decision, while the cited FTC fee rule applies only
      to live-event tickets and short-term lodging and therefore does not resolve the legal treatment of
      Redo's general ecommerce checkout model.
    claimRefs: [CU005, CU006, CU009, CU011, CU012, CU014]
    figureRefs: [FU001]
tables:
  - id: TU001
    title: Customer segmentation and economic roles
    columns:
      - Segment or role
      - Buyer / user / payer
      - Primary use case
      - Scale or strategic value
      - Evidence gap
    rows:
      - - DTC ecommerce merchants
        - Ecommerce or operations buyer; merchant pays usage products
        - Returns, exchanges, tracking, claims, and support
        - Company says 4,500+ brands served
        - Brand-size, order-volume, vertical, and revenue mix not disclosed
      - - Multi-product merchants
        - Cross-functional ecommerce, CX, marketing, and operations teams
        - Consolidate post-purchase and growth workflows
        - More than 1,750 merchants, roughly 40%, used multiple products in June 2025 reporting
        - Product attach rates and module-level revenue are not disclosed
      - - International merchants
        - Operations buyer; merchant and shopper economics vary by region
        - Local returns, labels, customs, and refund workflows
        - Company materials describe more than 100 label countries and five in-country hubs
        - Customer count and revenue by geography are not disclosed
      - - End shoppers
        - User and potential payer for optional returns coverage
        - Request a return, exchange, claim, refund, or support action
        - Shopper experience can influence merchant loyalty and repeat purchase
        - Coverage opt-in rate, fee level, complaints, and refund behavior are not disclosed
    notes: >-
      Segmentation combines Redo-issued product and pricing material with Shopify and third-party
      operating-model context; customer mix and revenue bands are unavailable.
    claimRefs: [CU002, CU003, CU006, CU007, CU009, CU013, CU016]
  - id: TU002
    title: Customer adoption and expansion snapshots
    columns:
      - Metric
      - Reported value
      - Period or access basis
      - Source quality
      - Implication and missing denominator
    rows:
      - - Ecommerce businesses
        - 3,000+
        - Archived company page fetched in the current run
        - Company-issued historical snapshot
        - Establishes earlier scale, but the original page date and counting method are not stated
      - - Brands using Redo
        - More than 4,300
        - TechBuzz, 2025-06-25
        - Independent media carrying company and executive statements
        - Indicates broad adoption; active, paying, and production definitions are not supplied
      - - Brands served
        - 4,500+
        - Current company page accessed 2026-10-21
        - Company-issued current snapshot
        - Suggests continued expansion, but no comparable measurement date or cohort basis is stated
      - - Merchants using multiple products
        - More than 1,750, roughly 40%
        - TechBuzz, 2025-06-25
        - Independent media carrying a company-supplied metric
        - Supports cross-sell; revenue contribution, retention, and products per merchant are unknown
    notes: >-
      Values are publisher-reported snapshots with different labels and vintages; they are not a
      normalized time series and should not be used to calculate a growth rate.
    claimRefs: [CU001, CU002, CU003, CU004]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer or reference
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Reported outcome
      - Limitation
    rows:
