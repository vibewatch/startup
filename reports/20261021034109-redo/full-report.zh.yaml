      - number: '1.4'
        title: 商业模式与尽调边界
        blocks:
          - type: paragraph
            body: >-
              Redo 宣传其退货门户免费并承担退货标签成本；2026 年 8
              月的一篇独立比较称，经济模式依赖消费者在结账时选择付费退货保障，多个相邻模块则按使用量计价。这有助于获客和交叉销售，但尽调重点因此转向结账同意、费用披露、商家集中度和单位经济性，而非传统席位制
              SaaS。该比较还称 Redo 以 Shopify 为中心，门户供应商发出事件，而仓库和 ERP 保留实物及财务控制。所引 FTC 费用规则目前覆盖现场活动门票和短期住宿，不覆盖一般电商退货；它是披露基准，不是
              Redo 违规的证据。仍需按相关司法辖区开展产品级法律审查。
            claimRefs:
