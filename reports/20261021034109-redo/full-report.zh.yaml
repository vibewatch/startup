      - CM008
  - id: FP001
    title: 按产品套件广度与运营复杂度划分的竞争定位
    type: quadrant
    summary: 序数证据综合将广泛的企业套件与 Shopify 原生方案或内部组合方案区分开来。
    data:
      points:
        - label: Redo
          x: 5
          'y': 3
          detail: 审阅方案中模块最广；运营模式以 Shopify 为主。
        - label: Loop
          x: 3
          'y': 3
          detail: 退货和换货专家，工作流深度分层。
        - label: Narvar
          x: 4
          'y': 5
          detail: 广泛的企业套件，强调多承运商和反欺诈。
        - label: Shopify 原生
          x: 2
          'y': 2
          detail: 原生自助服务和自动化覆盖基础售后任务。
        - label: 内部构建
          x: 3
          'y': 5
          detail: 自定义范围可能很广，但实施复杂度高。
        - label: 点解决方案堆栈
          x: 3
          'y': 4
          detail: 可组合的覆盖面，同时带来集成和运营负担。
    approximationNotes: >-
      这是分析性的序数评分，不是实测基准。X 轴表示套件广度，从 1（单一工作流）到 5（多模块套件）；Y 轴 表示运营和实施复杂度，从 1（原生 / 自助服务）到 5（企业级或自定义）。评分综合公开范围和交付模式；
      不应将距离理解为量化的性能差距。
    claimRefs:
      - CP006
      - CP007
      - CP010
      - CP011
      - CP013
      - CP014
      - CP016
  - id: FI001
    title: 从商户活动到未知毛利的收入模式桥接
    type: flow
    summary: Redo 可以在多个使用场景中从商户和消费者活动变现，但公开证据尚未触及实际收入结构和毛利。
    data:
      nodes:
        - id: merchant-entry
          label: 商户采用免费退货门户
          value: Free list price
          detail: 据称 Redo 承担退货面单成本。
        - id: shopper-coverage
          label: 消费者选择退货保障
          value: Fee not publicly disclosed
          detail: 第三方比较称，免费模式由结账时消费者选择加入的保障服务出资。
        - id: merchant-usage
          label: 订单和客服互动产生使用量
          value: Orders, tracked orders, resolutions, sends
          detail: 公开定价采用多个活动分母。
        - id: paid-modules
          label: 付费模块按标价计费
          value: $0.40/order; $0.08/tracked order; $0.20/resolution
          detail: 其他模块按每次发送、收入分成或定制方式定价。
        - id: cross-sell
          label: 商户采用多项产品
          value: 1,750+ merchants
          detail: 公司报告的多产品使用量是交叉销售代理指标，不是 ARR。
        - id: realized-revenue
          label: 实际收入
          value: Unavailable
          detail: 收入结构、折扣、合同条款和经常性收入分类均没有公开证据。
        - id: gross-profit
          label: 扣除履约成本后的毛利
          value: Unavailable
          detail: 标签、物流、客服、AI、支付和承运商成本均没有公开证据。
    approximationNotes: 仅展示有序机制；节点顺序不代表转化率或与价值成比例的规模。
    claimRefs:
      - CI003
      - CI005
      - CI012
      - CI016
  - id: FE001
    title: 受证据约束的产品架构图
    type: stack
    summary: 六个可观察的运营层展示了 Redo 直接发挥作用的环节，以及商户、平台和物流依赖仍然存在的环节。
    data:
      layers:
        - label: 消费者渠道
          detail: 退货门户、网站聊天、短信、电子邮件、追踪页面和自助保险理赔主张。
          modules:
            - 退货与换货
            - 索赔与保修
            - 客服对话
        - label: 互动应用
          detail: 营销、挽回、结账优化、追加销售和订单追踪。
          modules:
            - 电子邮件与短信
            - 购物车挽回
            - 结账优化
        - label: 决策自动化
          detail: 推荐、退货审核、欺诈检测、回复起草和自动化操作。
          modules:
            - 换货推荐
            - AI 客服代理
            - 退货分析
        - label: 商业与集成
          detail: 面向 Shopify 的订单、库存、退货、换货、额度和追踪事件。
          modules:
            - 商业平台
            - ERP 与 3PL 连接器
            - 库存地点
        - label: 实体运营
          detail: 承运商面单、本地中心、验货、履约、逆向物流和退款交接。
          modules:
            - 承运商网络
            - 境内中心
            - 仓库验货
        - label: 商户控制平面
          detail: 政策、知识内容、权限、分析、保障和人工审核。
          modules:
            - 商户规则
            - 人工审批
            - 安全与治理
    approximationNotes: 层级顺序代表可观察的工作流，不代表 Redo 没有公开部署拓扑；模块依据公开产品描述和第三方工作流分析分组。
    claimRefs:
      - CE001
      - CE004
      - CE007
      - CE009
      - CE011
      - CE013
      - CE014
  - id: FU001
    title: 商户采用与扩张路径
    type: journey-map
    summary: Redo 的商户循环从退货压力出发，经低成本切入产品走向换货和多产品扩张；消费者付费保障的信任问题和未经证实的留存是关键断点。
    data:
      nodes:
        - id: need
          label: 退货压力
          detail: 商户面临大量退货，糟糕体验也会带来显著的忠诚度风险。
          touchpoints:
            - Returns operations
            - Shopper expectations
        - id: evaluate
          label: 评估经济性
          detail: 免费退货门户和已覆盖的面单降低了商户初始软件门槛。
          touchpoints:
            - Pricing review
            - Operations review
        - id: consent
          label: 消费者保障选择
          detail: 可选的消费者付费保障可以为模式提供资金，但会引入披露和信任摩擦。
          touchpoints:
            - Checkout
            - Fee disclosure
        - id: transact
          label: 退货或换货
          detail: 自助流程和换货推荐试图留住收入，而不是直接退款。
          touchpoints:
            - Returns portal
            - Exchange recommendation
        - id: prove
          label: 验证结果
          detail: 商户报告的换货增幅需要有名称的队列、基线和独立核验。
          touchpoints:
            - Analytics
            - Customer reference
        - id: expand
          label: 增加产品
          detail: 在建立初始信任后，追踪、客服、履约和营销形成交叉销售循环。
          touchpoints:
            - Product expansion
            - Renewal review
    approximationNotes: 该顺序是分析性的客户路径，不是实测漏斗；没有披露转化率、阶段客户量或扩张耗时指标。
    claimRefs:
      - CU002
      - CU005
      - CU006
      - CU009
      - CU011
      - CU012
      - CU014
  - id: FR001
    title: 剩余风险热力图
    type: matrix
    summary: 分析师依据定性可能性、影响和公开缓释措施成熟度，对六类风险进行排序。
    data:
      columns:
        - id: likelihood
          label: 可能性
        - id: impact
          label: 影响
        - id: mitigation
          label: 公开缓释成熟度
      rows:
        - label: 包裹保障分类与费用呈现
          values:
            - value: Medium
              tone: warning
            - value: High
              tone: negative
            - value: Unverified
              tone: negative
        - label: 产品层面单位经济性与补贴暴露
          values:
            - value: Medium
              tone: warning
            - value: High
              tone: negative
            - value: Unverified
              tone: negative
        - label: Shopify 平台集中度
          values:
            - value: Medium
              tone: warning
            - value: High
              tone: negative
            - value: Unverified
              tone: negative
        - label: AI 决策质量与客户数据控制
          values:
            - value: Medium
              tone: warning
            - value: High
              tone: negative
            - value: Partial
              tone: warning
        - label: 跨境承运商、报关行与中心执行
          values:
            - value: Medium
              tone: warning
            - value: High
              tone: negative
            - value: Partial
              tone: warning
        - label: 扩张速度相对于资本和管理能力
          values:
            - value: Medium
              tone: warning
            - value: High
              tone: negative
            - value: Unverified
              tone: negative
    approximationNotes: 这是基于保留的公开证据做出的分析师定性综合；单元格不是实测概率，公开控制措施缺失也不等于控制措施不存在。
    claimRefs:
      - CR003
      - CR006
      - CR009
      - CR012
      - CR014
      - CR015
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 报道中的融资估值必须通过经营、基准和资本结构检验，才能支撑可投资的回报逻辑。
    data:
      nodes:
        - id: reported-mark
          label: 报道估值 12.5 亿美元
          detail: 第三方融资报道称完成 8,100 万美元 B 轮融资。
        - id: market-proof
          label: 大规模退货问题
          detail: 2025 年线上退货率估计为销售额的 19.3%。
        - id: company-proof
          label: 采用与产品证据
          detail: 公司报告的品牌规模和换货结果需要独立队列验证。
        - id: operating-proof
          label: 经审计的经营证据
          detail: 收入、增长、留存、利润率、消耗和集中度均没有公开证据。
        - id: capitalization-proof
          label: 资本结构与法律证据
          detail: 必须核实净债务、现金、优先权、稀释和保障业务合规性。
        - id: decision
          label: 继续研究 / 偏高
          detail: 建议取决于价格，等待证据和建模后的目标回报。
      edges:
        - from: reported-mark
          to: market-proof
          label: 检验需求
        - from: market-proof
          to: company-proof
          label: 检验捕获能力
        - from: company-proof
          to: operating-proof
          label: 检验经济性
        - from: operating-proof
          to: capitalization-proof
          label: 标准化价值
        - from: capitalization-proof
          to: decision
          label: 评估回报
    approximationNotes: 有序流程是投资判断步骤，不是因果模型，也不是按概率加权的预测。
    claimRefs:
      - CV002
      - CV005
      - CV009
      - CV011
      - CV016
