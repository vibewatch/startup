        title: 资本、规模与里程碑
        blocks:
          - type: paragraph
            body: >-
              2026 年 6 月 23 日，Redo 宣布完成 $81 million Series B，所报估值为 $1.25 billion；领投方为 Smash Capital，Pelion Venture
              Partners 和 Cervin Ventures 也参与。同期联合发布的公司新闻称，平台有超过 4,100 个品牌使用，超过 1,750 个品牌使用多个产品。Redo 当前官网称服务超过 4,500
              个品牌，方向上与扩张一致，但不是独立审计的客户数。融资公告还称 Redo 已收购 ReturnBear，以增加覆盖 100
              多个国家的国际退货和履约能力。现有证据未披露累计融资、收入、ARR、利润率、留存或员工人数，这些都必须保留为缺口。
