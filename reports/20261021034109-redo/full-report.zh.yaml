      - number: '8.2'
        title: 融资与基准背景
        blocks:
          - type: paragraph
            body: >-
              最接近的留存公开市场参考并非直接可比：Multiples.vc 报告截至 2026 年 10 月 21 日，上市电商软件的未来十二个月 EV/收入倍数为 1.7x；SaaSrise 则引用私有 SaaS 并购的
              3.8x 收入倍数。前者使用企业价值和前瞻收入，后者是宽泛的私有交易参考；Redo 的 $1.25 billion 是所报融资估值，净债务、现金和优先条款均未披露。将所报价格除以 1.7x 得到约 $735
              million 的示意收入门槛，但不是 Redo 收入估计，也不是未作资本化调整的有效股权估值。该演算显示公开价格可能要求很高，而审计输入缺失使可靠估值区间无法建立。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV012
      - number: '8.3'
        title: 论点、反论点与情景
        blocks:
          - type: paragraph
            body: >-
              论点是退货是规模大且持续存在的商业问题，Redo 可用免费入口、按使用量计价模块和 AI 辅助换货整合售后流程。Retail TouchPoints 引用 NRF 与 Happy Returns 研究称 2025
              年线上退货率为 19.3%，Redo 则称商家从旧平台迁移后平均换货提升
              17%。反论点是这些公司披露的效果未必转化为持久的经常性经济性，独立比较称免费退货模式由消费者选择保障提供资金。法律评论警告，单独收费的包裹保障在广泛的州定义下可能类似保险。因此牛市、基准和熊市情景应作为尽调条件，而不是制造虚假的估值精度。
            claimRefs:
              - CV008
