  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与定价
        blocks:
          - type: paragraph
            body: >-
              Redo 采用逐步扩张的变现设计，而非单一且已披露的订阅。官方定价将退货门户列为免费并称承担标签成本；相邻行业比较称其经济机制是在结账时收取消费者可选的退货保障费。围绕这一核心，Redo
