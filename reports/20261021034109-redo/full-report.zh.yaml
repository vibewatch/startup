chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与平台范围
        blocks:
          - type: paragraph
            body: >-
              Redo 将自己定位为一家位于 Draper、犹他州、服务 DTC
              品牌的科技公司。当前平台覆盖退货与理赔、运输和履约、订单追踪、支持、营销、支付及国际退货，不再只是单一功能的退货门户。其产品逻辑是整合供应商：售后互动共享客户和订单数据，Redo
              因而能在一个运营界面上自动处理换货、支持、挽回和履约流程。Shopify 对直接商业的讨论支持第一方购买与偏好数据的战略价值，但不能证明 Redo
              的执行力或经济性。现有证据支持其产品类别和运营模式，但成立日期及完整公司历史仍未验证。
            claimRefs:
              - CO001
              - CO006
              - CO016
