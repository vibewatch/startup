  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 决策与价格纪律
        blocks:
          - type: paragraph
            body: >-
              建议为继续研究，信心中等、风险高，且估值偏高。两份第三方报告描述了 $81 million Series B 和 $1.25 billion 估值；Redo 当前官网称超过 4,500 个品牌，6
              月融资报道把超过 1,750 个多产品商家归于公司。这些采用信号有用，却不能替代经审计的收入质量：留存融资账户没有 ARR
              或收入、毛利率、留存、烧钱、净现金或债务、稀释或清算优先权数据。因此无法从公开证据计算目标回报、持有期或有依据的退出价值。入场纪律应从标准化企业价值和经审计的前瞻收入开始，再检验增长、留存和利润率是否足以取得溢价，而不是假定所报轮次价格天然公平。
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV006
              - CV007
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
