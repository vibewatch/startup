  - id: TV002
    title: 投资论点与反论点
    columns:
      - 视角
      - 当前证据
      - 哪些变化会改变判断
    rows:
      - - 论点：结构性需求
        - 2025 年线上退货率估计为销售额的 19.3%。
        - 如果退货强度持续下降，或商户付费意愿减弱，需求逻辑就会走弱。
      - - 论点：分发与覆盖面
        - 据称 Redo 拥有 4,500 多个品牌；融资报道将 1,750 多个多产品商户归于该公司。
        - 经审计的活跃客户、队列和模块收入数据必须显示出持续扩张，而不是一批未活跃的安装。
      - - 论点：商户结果
        - 据称 Redo 从旧平台迁移后，换货量平均增加 17%。
        - 有分母和时间区间的独立队列证据将提升信心。
      - - 反论点：变现质量
        - 免费核心产品和消费者出资的保障服务可能加速采用，同时掩盖经常性软件收入的经济性。
        - 据称收入结构、贡献利润率、选择加入率、理赔损失率和流失率将帮助判断其持久性。
      - - 反论点：监管暴露
        - 法律评论称，单独收费的包裹保障在宽泛的州级定义下可能被视为保险。
        - 许可证、承保方结构、法律意见和监管机构往来文件可以降低或确认这一风险。
    notes: 公司采用率和结果数据属于公司口径；竞争比较仅为方向性判断，不是独立的经营基准。
    claimRefs:
      - CV006
      - CV007
      - CV008
      - CV009
      - CV010
      - CV011
      - CV015
  - id: TV003
    title: 乐观、基准与悲观情景框架
    columns:
      - 情景
      - 明确假设
      - 估值 / 回报逻辑
      - 关键风险与概率信号
    rows:
      - - 悲观
        - 付费模块转化疲弱；NRR 低于 101%；毛利率低于 75%；保障业务经济性受限。
        - 没有可支持的 Redo 估值区间；只有在标准化企业价值后，才能用公开电商 1.7 倍 EV/NTM 收入参照进行 测试。
        - 如果经审计指标低于广义 SaaS 中位数，或监管损害变现，则是负面信号。
      - - 基准
        - 客户规模转化为多产品收入，但增长和利润率接近广义 SaaS 基准。
        - 没有可支持的 Redo 估值区间；公开 EV/NTM 收入 1.7 倍和私有 SaaS 并购收入 3.8 倍只是方向性参照， 且分母并不匹配。
        - 在披露经审计的收入、留存、现金、债务和优先权条款前，信号仍然混合。
      - - 乐观
        - 模块扩张强劲，商户结果经独立核验，NRR 高于广义中位数，且保障业务结构合规。
        - 溢价可能有依据，但没有前瞻收入、增长、利润率和资本结构数据，就无法支持任何数值化的 Redo 区间。
        - 这是有条件的信号，需要经审计证据，而非公司口径。
      - - 入场门槛
        - 将轮次估值转换为企业价值，并由投资人建模稀释、优先权、持有期和退出倍数。
        - 按 1.7 倍计算，12.5 亿美元对应约 7.35 亿美元收入，尚未考虑股权价值向企业价值的调整；这只是门槛 示例，不是预测。
        - 如果所需经营规模或目标回报依赖未经支持的假设，则不要投资。
    notes: 情景参照混用了公开 EV/NTM 收入和私有并购收入基准，因此不能直接比较；报告没有提出概率百分比或 Redo 估值区间。
    claimRefs:
      - CV002
      - CV003
      - CV004
      - CV005
      - CV011
