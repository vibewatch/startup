  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              Redo 的可服务类别窄于电商或 DTC 商业：从面向消费者的退货和换货开始，延伸到订单追踪、包裹保障、履约支持、客户服务、营销和 AI
              辅助商业流程。第三方比较区分了面向客户的门户与实物、财务后端：授权、换货选择、标签和入库追踪在门户完成，而收货、检查、处置、库存状态和会计仍由 ERP、WMS、仓库或 3PL
              负责。同一比较估计服装网购退货率约为订单的 20%–30%，其他多数零售品类低于 10%，说明退货软件在高退货品类尤其相关。替代方案包括人工支持、本地商业平台功能、独立点产品和内部 ERP
              或仓库流程；不能自动把它们都算作 Redo 可获得的支出。
            claimRefs:
              - CM005
              - CM009
              - CM010
              - CM011
          - type: table
            tableRef: TM001
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM009
              - CM011
      - number: '2.2'
        title: 规模测算视角与限制
        blocks:
          - type: paragraph
            body: >-
              现有市场数据能说明需求背景，却不足以建立可靠的 TAM/SAM/SOM。Shopify 2026 年 DTC 指南引用第三方预测称，全球 DTC 电商市场将从 2024 年约 $163 billion 增至
              2033 年 $595 billion，并另引估计称电商约占零售销售的 23.5%。这些是广义商业流量指标，不是软件收入池，不能直接作为 Redo 的 TAM。公司层面，2026 年 6
              月由两家媒体转载的公司公告称超过 4,100 个品牌使用 Redo，超过 1,750 个使用多个产品；公司旧官网另称有 3,000-plus 家电商企业。它们说明装机基础和交叉销售，但没有商家
              GMV、合同金额、可服务品牌数或收入，就无法分离可服务市场价值或市场份额。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM008
      - number: '2.3'
        title: 买方、用户、付费方与采用路径
        blocks:
          - type: paragraph
            body: >-
              经济买方随模块变化。电商和客户体验负责人负责退货及消费者旅程；运营团队关注标签费用、路由、欺诈和仓库交接；支持负责人评估工单自动化；财务则检验留存收入和节省的人工是否超过使用费。Redo
              以免费退货门户及承担标签成本降低软件进入门槛，同时对追踪、结账优化和支持等模块按使用量收费。商家在结账时采用可选退货保障后，消费者可能成为间接付费方，因此同意、呈现方式和品牌影响都属于采购考量。公司披露的平均换货率提升
              17% 和最高 60% 的工单自动解决率，应在商家队列中验证，不能当作独立市场基准。Shopify 还称运输支出平均占年度经营费用 8.7%，且不含仓储、包装、退货或特殊要求。
            claimRefs:
              - CM006
              - CM007
              - CM012
              - CM013
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM009
              - CM011
              - CM014
              - CM015
      - number: '2.4'
        title: 驱动因素、约束与估值相关性
        blocks:
          - type: paragraph
            body: >-
              需求来自服装品类高退货率、商家把退款转成换货的兴趣、整合碎片化应用的压力，以及在支持和营销中共享订单与客户数据。采用受 Shopify 集中度、库存和资金所属系统的集成、消费者对结账保障的接受度，以及验证供应商
              ROI 的需要限制。Shopify 流程管理指南将兼容性、流程复杂度、编码要求和用户访问列为软件选型标准，这些都会转化为多模块售后平台的实施负担。费用呈现也是尽调问题。FTC
              当前关于不公平或欺骗性费用的指引明确限于现场活动门票和短期住宿，因此不能证明 Redo
              的零售模式受该规则约束；但其要求可选附加费在付款前清晰披露并计入最终金额，对消费者付费保障仍是有用的控制原则。估值应依赖经验证的商家经济性、留存、模块渗透和监管审查，而不是广义 DTC GMV 的自上而下份额。
            claimRefs:
              - CM005
              - CM009
              - CM011
              - CM015
              - CM016
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 不要把广义 DTC GMV 资本化为 Redo 的 TAM
            body: $163B–$595B 估计衡量的是全球 DTC 电商，而 Redo 销售的是更窄的软件和服务层。估值需要品类软件支出、可服务商家、ACV、附加率和经验证收入。
            calloutType: risk
            claimRefs:
              - CM001
              - CM003
              - CM004
          - type: callout
            title: 用商家队列评估采用
            body: 在把公司披露的结果放入增长模型前，应索取按模块拆分的定价、换货提升、支持分流、留存、商家集中度，以及按垂直行业和订单量分组的实施数据。
            calloutType: recommendation
            claimRefs:
              - CM007
              - CM012
              - CM013
              - CM015
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 格局与买方替代方案
        blocks:
          - type: paragraph
            body: >-
              竞争范围包括直接退货门户、企业售后套件、Shopify 原生组件、内部流程，以及多个点产品并存的现状。2026 年供应商比较把 Redo、Loop 和 Narvar
              放在面向消费者的一层，负责退货授权、换货、标签和入库包裹追踪，并明确与仓库检查、处置、库存会计及批发授信流程区分。Redo
              自身资料进一步把竞争扩大到退货、追踪、履约、支持和营销的一体化平台。即使商家不选择其他专用门户，Shopify 也能提供原生客户账户、自动化和支持组件，形成可信的自建或组合替代方案。
            claimRefs:
              - CP001
              - CP007
              - CP011
              - CP013
              - CP014
