        title: 定价与产品包装
        blocks:
          - type: paragraph
            body: >-
              Redo 定价页称退货门户免费且由 Redo 承担退货标签成本，周边付费模块包括每笔追踪订单 $0.08、每单结账优化 $0.40、每次解决支持工单
              $0.20。所审比较称该模式由结账时可选的消费者付费退货保障提供资金；Loop Core 也有消费者出资的免费层，付费方案起价为每月 $155 和 $340，而 Narvar
              不公开价格。这些是挂牌价和包装描述，不是实际合同经济性；折扣、附加率、保障损失和实施成本仍不可得。
            claimRefs:
