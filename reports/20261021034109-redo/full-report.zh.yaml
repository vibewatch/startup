      - number: '8.4'
        title: 退出准备、尽调要求与论点失效触发点
        blocks:
          - type: paragraph
            body: >-
              退出准备尚未验证，因为公开记录没有揭示收购方或公开市场投资者会评估的财务持久性和优先股堆叠。投资前应取得按模块、地域和付费方拆分的审计收入、ARR
              对账、队列毛收入和净收入留存、软件/履约/保障产品毛利率、客户集中度、CAC 回收期、烧钱和
              runway、净现金和债务，以及含清算优先权的完全稀释股权结构表；还要取得逐州法律分析和消费者付费保障的牌照证据。触发点包括审计 NRR 低于所引私有 SaaS 中位数 101%、毛利率低于所引中位数 75%
              且没有可信改善计划、企业价值倍数高于公开电商参考却没有更高增长，或核心变现流受到重大监管限制。若证据通过这些测试，且入场价支持投资者要求的回报，建议才可能上调。
            claimRefs:
              - CV003
              - CV005
              - CV010
              - CV011
              - CV013
              - CV014
              - CV016
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 不做盲目按价买入
            body: 公司可能具有战略吸引力，但公开证据不能证明所报 $1.25 billion 价格能带来目标回报。在超出继续研究之前，必须取得经审计经济性、资本化条款和法律支持。
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV005
              - CV011
              - CV016
