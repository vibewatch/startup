      - number: '3.2'
        title: 能力、分发与运营适配
        blocks:
          - type: paragraph
            body: >-
              Redo 的公开优势是覆盖面和以 Shopify 为中心的分发界面，而不是已被独立证明的独特退货算法。公司描述了 AI 换货推荐、图像和政策审查、支持自动化及统一数据层；Shopify
              商家评价摘要也称用户因此替换多个应用并重视复杂定制流程。比较发布方把 Loop 定位为换货和政策专家，把 Narvar
              定位为适合多品牌、多区域、欺诈密集型企业部署。这些只是供应商的方向性描述，不是独立基准。买方应结合自身订单和退货历史测试政策可配置性、库存位置逻辑、欺诈覆盖、事件回写、实施负担和支持质量。
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP002
            claimRefs:
              - CP007
              - CP010
              - CP011
              - CP012
              - CP013
              - CP014
              - CP016
          - type: figure
            figureRef: FP001
            claimRefs:
