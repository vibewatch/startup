evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: leadership
    missingEvidence: Complete founder history, executive roster, board composition, ownership, voting rights, and succession coverage.
    whyItMatters: The public evidence names only two leaders and cannot support a reliable governance or key-person assessment.
    diligencePath: >-
      Request the capitalization table, board minutes, organizational chart, employment agreements, and founder
      biographies.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: private-metrics
    missingEvidence: >-
      Audited revenue, ARR, growth, gross margin, retention, headcount, cash, debt, cumulative funding, and
      customer-count methodology.
    whyItMatters: >-
      The valuation and company-reported brand scale cannot be translated into operating quality or financing runway
      without these metrics.
    diligencePath: >-
      Obtain audited financials, monthly management accounts, bank and debt statements, payroll roster, cap table, and
      customer-level cohort exports.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: milestone-history
    missingEvidence: >-
      A source-backed founding date and complete pre-2025 product, financing, leadership, partnership, and adverse-event
      chronology.
    whyItMatters: The assigned evidence supports recent expansion but not company age, execution cadence, or earlier setbacks.
    diligencePath: >-
      Request the corporate timeline and verify each material event against dated filings, archived company pages, and
      independent reporting.
    relatedQuestionRefs:
      - QO005
  - type: missing-source
    severity: material
    topic: fee-regulation
    missingEvidence: >-
      Jurisdiction-specific legal analysis of shopper-paid returns coverage, checkout consent, refunds, insurance
      characterization, and fee disclosure.
    whyItMatters: The FTC source in the pool has a narrow sector scope and cannot resolve Redo's broader legal exposure.
    diligencePath: >-
      Commission counsel review for each major jurisdiction and inspect checkout flows, consumer terms, complaint data,
      and regulator correspondence.
    relatedQuestionRefs:
      - QO009
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      A current independent estimate of post-purchase software spend segmented by merchant platform, geography,
      vertical, and merchant scale.
    whyItMatters: >-
      Broad DTC commerce volume cannot be converted into Redo's addressable software revenue without an eligible-spend
      denominator.
    diligencePath: >-
      Commission or obtain a category study with methodology and triangulate it against merchant counts, module pricing,
      and procurement data.
    relatedQuestionRefs:
      - QM003
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: serviceable-market
    missingEvidence: >-
      Redo revenue by module, merchant ACV distribution, eligible merchant universe, gross retention, module attach, and
      independent market-share data.
    whyItMatters: >-
      These inputs determine serviceable market value, realistic penetration, and whether multi-product adoption
      supports the valuation.
    diligencePath: >-
      Request audited revenue and cohort exports, contract-level pricing, merchant GMV bands, module attach, churn, and
      a reconciled customer census in the data room.
    relatedQuestionRefs:
      - QM010
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: competitor scale
    missingEvidence: >-
      Comparable audited revenue, gross retention, merchant cohorts, funding totals, and product-level adoption for
      Redo, Loop, and Narvar.
    whyItMatters: >-
      Vendor-claimed brand counts and activity metrics do not establish competitive share, revenue quality, or customer
      durability.
    diligencePath: >-
      Request audited operating metrics and cohort exports from each finalist, normalized to the same merchant and order
      definitions.
    relatedQuestionRefs:
      - QP002
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: switching costs
    missingEvidence: Win-loss data, migration timelines, integration depth, module attach rates, and retention by customer cohort.
    whyItMatters: >-
      Suite breadth may create lock-in, but public materials do not quantify switching friction or prove that
      multi-product adoption persists.
    diligencePath: >-
      Interview churned and current merchants, inspect integration maps, and obtain retention and module-attach cohorts
      under NDA.
    relatedQuestionRefs:
      - QP010
    relatedTableRefs:
      - TP001
      - TP002
  - type: missing-source
    severity: material
    topic: regulatory scope
    missingEvidence: >-
      Jurisdiction-specific legal analysis of optional shopper-paid return coverage, package protection, disclosures,
      and insurance treatment.
    whyItMatters: >-
      The reviewed FTC rule is narrow and cannot support a conclusion about Redo's broader ecommerce fee or protection
      model.
    diligencePath: Commission US state-by-state and key international counsel memos using current checkout flows and policy terms.
    relatedQuestionRefs:
      - QP007
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Audited revenue and ARR by module, recurring classification, gross margin, retention, CAC, payback, and cohort
      expansion.
    whyItMatters: >-
      Without these metrics, list pricing and merchant adoption cannot establish revenue quality or scalable
      contribution margin.
    diligencePath: >-
      Request audited monthly financials, revenue-recognition policy, product-level gross-margin bridge, and merchant
      cohort schedules.
    relatedQuestionRefs:
      - QI002
      - QI003
      - QI004
      - QI010
    relatedTableRefs:
      - TI001
      - TI002
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Current cash, monthly burn, debt and other obligations, ReturnBear acquisition consideration, uses of proceeds,
      and next-round trigger.
    whyItMatters: Funding raised is not cash available and cannot establish runway or financing independence.
    diligencePath: >-
      Obtain the latest balance sheet, 24-month cash forecast, debt schedule, cap table and preference stack,
      acquisition documents, and board-approved operating plan.
    relatedQuestionRefs:
      - QI006
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: consumer-fee-regulation
    missingEvidence: >-
      Jurisdiction-specific legal analysis of Redo's shopper-paid returns coverage, fee disclosures, refundability, and
      any insurance or service-contract characterization.
    whyItMatters: >-
      The checkout-funded model may concentrate revenue or compliance exposure in a fee whose legal treatment can vary
      by product and jurisdiction.
    diligencePath: >-
      Request outside-counsel memoranda, product terms, coverage attach and refund data, complaints, licenses, and
      regulator correspondence for each major jurisdiction.
    relatedQuestionRefs:
      - QI007
      - QI009
  - type: private-evidence-only
    severity: material
    topic: security-assurance
    missingEvidence: >-
      Current SOC 2 or ISO 27001 evidence, penetration-test summary, data-flow map, subprocessors, retention controls,
      access-control design, and incident-response documentation.
    whyItMatters: >-
      Redo's products process order, customer, returns, claims, identity, and support data and may take actions that
      change orders.
    diligencePath: >-
      Request the trust package under NDA and have security review control scope, exceptions, subprocessors, model-data
      handling, and remediation status.
    relatedQuestionRefs:
      - QE007
  - type: missing-source
    severity: material
    topic: developer-signal
    missingEvidence: >-
      Public API documentation, SDKs, changelog, package registry, repository activity, release cadence, integration
      health, or practitioner-community evidence.
    whyItMatters: >-
      The assigned evidence cannot establish API maturity, ecosystem adoption, backward compatibility, or integration
      maintainability.
    diligencePath: >-
      Request API and webhook documentation, release history, integration error metrics, deprecation policy, and three
      implementation references.
    relatedQuestionRefs:
      - QE010
  - type: missing-source
    severity: material
    topic: reliability
    missingEvidence: >-
      Public SLA, uptime history, incident archive, recovery objectives, latency distribution, exception rates, and
      support-response performance.
    whyItMatters: >-
      Returns, tracking, checkout, and support workflows are operationally time-sensitive, but product availability does
      not establish reliability.
    diligencePath: >-
      Request twelve months of status history, severity-one postmortems, SLA attainment, regional latency, support
      metrics, and disaster-recovery test results.
    relatedQuestionRefs:
      - QE007
  - type: access-blocked
    severity: minor
    topic: acquisition-integration
    missingEvidence: >-
      Usable text from the assigned Indianapolis Business Journal article about Malomo's acquisition; the prefetched
      page returned a subscription prompt and unreadable body text.
    whyItMatters: >-
      The inaccessible article cannot support conclusions about the acquisition, tracking integration, product roadmap,
      or organizational integration.
    diligencePath: >-
      Obtain the original article through an authorized subscription or request Redo's acquisition and integration
      materials directly.
  - type: private-evidence-only
    severity: material
    topic: ai-governance
    missingEvidence: >-
      Model inventory, input lineage, permission boundaries, human-review defaults, evaluation sets, false-action rates,
      rollback controls, and customer-specific outcome cohorts.
    whyItMatters: >-
      Company claims and a competitor comparison describe useful AI actions but do not prove safe autonomy or repeatable
      outcome quality.
    diligencePath: >-
      Run a sandbox evaluation using representative orders and edge cases, inspect audit logs, and require measured
      precision, escalation, and unauthorized-action rates.
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: >-
      Cohort NRR, GRR, logo churn, renewal rate, average contract length, and retention split by product and
      customer-size band.
    whyItMatters: >-
      Customer-count growth and cross-sell do not establish durable recurring revenue without renewal and contraction
      evidence.
    diligencePath: >-
      Obtain monthly customer and ARR cohort exports, reconcile them to billing, and review at least six churned and six
      renewed customer files.
    relatedQuestionRefs:
      - QU009
  - type: private-evidence-only
    severity: material
    topic: concentration
    missingEvidence: >-
      Top-10 and top-20 customer revenue concentration, channel attribution, product revenue mix, and geographic revenue
      distribution.
    whyItMatters: >-
      A broad logo count can coexist with material exposure to a small set of merchants, one platform, one product, or
      one geography.
    diligencePath: >-
      Request customer-level revenue by month for the trailing 24 months and calculate concentration, expansion,
      contraction, and churn by cohort.
    relatedQuestionRefs:
      - QU010
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: >-
      A current named-customer list with deployment status, go-live date, products used, baseline, measured outcome,
      contract status, and permission to reference.
    whyItMatters: >-
      Anonymous or qualitative testimonials cannot verify production depth, repeatability, or outcome attribution across
      the merchant base.
    diligencePath: >-
      Select references across customer-size and product cohorts, then conduct independent calls with at least three
      production customers and one churned customer.
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: package-protection-legal-status
    missingEvidence: >-
      Redo entity and license schedule, legal-classification memo, insurance or risk-bearing counterparties, policy
      forms, consumer consent flows, regulator correspondence, and jurisdictional exclusions.
    whyItMatters: >-
      Legal characterization and checkout presentation could affect product availability, economics, refunds, penalties,
      and the durability of shopper-funded monetization.
    diligencePath: >-
      Have specialist insurance and consumer-protection counsel review every protection and claims flow by jurisdiction,
      supported by contracts, filings, screenshots, and regulator communications.
    relatedQuestionRefs:
      - QR002
    relatedTableRefs:
      - TR001
  - type: missing-source
    severity: material
    topic: incidents-and-controls
    missingEvidence: >-
      Redo-specific court-record search, regulator search, status history, outage and incident log, breach
      notifications, security certifications, penetration tests, recalls, safety events, complaints, and insurance
      claims.
    whyItMatters: >-
      The assigned public pool cannot distinguish a clean record from undisclosed, private, or simply unsearched
      incidents and controls.
    diligencePath: >-
      Run entity-and-founder searches across court and regulator databases, then reconcile results with management's
      five-year legal, security, reliability, and insurance schedules.
    relatedQuestionRefs:
      - QR003
    relatedTableRefs:
      - TR001
      - TR002
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Audited product-level revenue, gross profit, return-label costs, claim losses, fraud losses, revenue shares,
      working-capital needs, customer cohorts, burn, cash balance, and runway.
    whyItMatters: >-
      Funding raised is not cash available, and free or subsidized products may create scale-dependent margin and
      liquidity exposure.
    diligencePath: >-
      Reconcile audited financials to product P&Ls and monthly cash, then stress-test cohort contribution margins under
      higher return, claim, fraud, and carrier-cost scenarios.
