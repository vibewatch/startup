    title: "Competitive positioning by suite breadth and operating complexity"
    type: "quadrant"
    summary: >-
      Ordinal evidence synthesis separates broad enterprise suites from
      Shopify-native or internally composed alternatives.
    data:
      points:
        - label: "Redo"
          x: 5
          y: 3
          detail: "Broadest reviewed module set; Shopify-led operating profile."
        - label: "Loop"
          x: 3
          y: 3
          detail: "Returns and exchange specialist with tiered workflow depth."
        - label: "Narvar"
          x: 4
          y: 5
          detail: "Broad enterprise suite with multi-carrier and fraud emphasis."
        - label: "Shopify-native"
          x: 2
          y: 2
          detail: "Native self-service and automation cover basic post-purchase jobs."
        - label: "Internal build"
          x: 3
          y: 5
          detail: "Potentially broad custom scope with high implementation complexity."
        - label: "Point-solution stack"
          x: 3
          y: 4
          detail: "Composable breadth with integration and operating overhead."
    approximationNotes: >-
      Analytical ordinal scores, not measured benchmarks. X-axis is suite
      breadth from 1 (single workflow) to 5 (multi-module suite); Y-axis is
      operating and implementation complexity from 1 (native/self-service) to
      5 (enterprise or custom). Scores synthesize published scope and delivery
      model; no distance should be read as a quantified performance gap.
    claimRefs: ["CP006", "CP007", "CP010", "CP011", "CP013", "CP014", "CP016"]
