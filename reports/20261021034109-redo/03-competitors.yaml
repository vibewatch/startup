    notes: >-
      Cells summarize the assigned published evidence as of the run date.
      "Unknown" or qualified language is intentional where comparable test data,
      implementation scope, or contract detail was not available.
    claimRefs: ["CP007", "CP010", "CP011", "CP012", "CP013", "CP014", "CP016"]
  - id: "TP003"
    title: "Pricing and packaging comparison"
    columns:
      - "Vendor / offer"
      - "Published price"
      - "Unit or contract model"
      - "Included capability"
      - "Unknowns and implication"
    rows:
      - ["Redo Returns", "Free", "Portal; shopper-funded coverage described by comparison publisher", "Returns portal, analytics, return-label cost coverage", "Coverage attach rate, exclusions, and realized economics are unknown"]
      - ["Redo Order Tracking", "$0.08", "Per tracked order", "Transactional triggers, tracking page, return tracking, analytics", "Volume discounts and minimums were not disclosed"]
      - ["Redo Support", "$0.20", "Per resolution", "Consolidated channels, AI copilot, analytics", "Resolution definition and quality-adjusted cost are unknown"]
      - ["Loop Core / paid tiers", "Core free; Essential from $155/month; Advanced from $340/month", "Shopper-funded Core plus monthly SaaS tiers", "Returns, labels, and progressively deeper policy/exchange tools", "Current contract discounts and implementation fees are unknown"]
      - ["Narvar", "Not published", "Quote and demo", "Enterprise post-purchase suite", "Requires a comparable quote and implementation scope"]
    notes: >-
      Redo figures are current list prices from its pricing page; Loop and
      Narvar figures are reported by the August 2026 supplier comparison.
      None should be treated as realized customer pricing or gross margin.
    claimRefs: ["CP002", "CP003", "CP008", "CP009", "CP010"]
figures:
