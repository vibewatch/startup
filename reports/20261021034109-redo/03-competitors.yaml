schemaVersion: "report-v2"
artifact: "competitors"
slug: "redo"
runDate: "2026-10-21"
company:
  name: "Redo"
chapter:
  number: 3
  title: "Competitors"
  summary: >-
    Redo competes not only with Loop and Narvar but also with Shopify-native
    workflows, internal builds, and fragmented point-solution stacks. Its
    strongest published differentiation is a free returns core paired with a
    broad post-purchase suite, while defensibility remains exposed to platform
    substitution, shopper-funded economics, and largely vendor-authored proof.
sections:
  - id: "landscape-and-buyer-alternatives"
    title: "Landscape and buyer alternatives"
    body: >-
      The competitive set spans direct returns portals, enterprise post-purchase
      suites, Shopify-native components, internal workflows, and the status quo
      of multiple point solutions. A 2026 vendor comparison places Redo, Loop,
      and Narvar at the shopper-facing layer that authorizes returns, offers
      exchanges, creates labels, and tracks inbound parcels; it explicitly
      separates those functions from warehouse inspection, disposition,
      inventory accounting, and wholesale credit workflows. Redo's own
      materials broaden the contest further by positioning one platform across
      returns, tracking, fulfillment, support, and marketing. Shopify can also
      supply native customer-account, automation, and support components,
      giving merchants a credible build-or-compose alternative even when they
      do not select another dedicated portal.
    claimRefs: ["CP001", "CP007", "CP011", "CP013", "CP014"]
    tableRefs: ["TP001"]
  - id: "capability-and-distribution"
    title: "Capability, distribution, and operating fit"
    body: >-
      Redo's published edge is breadth plus a Shopify-centered distribution
      surface rather than a uniquely proven returns algorithm. The company
      describes AI exchange recommendations, image and policy review, support
      automation, and a unified data layer; Shopify's merchant-review summary
      also says users replace multiple applications and value complex custom
      flows. Loop is presented by the comparison publisher as the exchange and
      policy specialist, while Narvar is positioned for multi-brand,
      multi-region, fraud-intensive enterprise deployments. Those are
      directional vendor descriptions, not an independent benchmark. Buyers
      should therefore test policy configurability, inventory-location logic,
      fraud overrides, event write-back, implementation burden, and support
      quality against their own order and return history.
    claimRefs: ["CP005", "CP006", "CP007", "CP010", "CP011", "CP012"]
    tableRefs: ["TP002"]
    figureRefs: ["FP001"]
  - id: "pricing-and-packaging"
    title: "Pricing and packaging"
    body: >-
      Redo's pricing page lists its returns portal as free and says Redo covers
      return-label costs, with paid modules layered around that core: order
      tracking is listed at $0.08 per tracked order, checkout optimization at
      $0.40 per order, and support at $0.20 per resolution. The reviewed
      comparison says the model is funded by optional shopper-paid return
      coverage at checkout. It describes Loop Core as another shopper-funded
      free tier, with paid plans starting at $155 and $340 per month, while
      Narvar does not publish pricing. These are list prices and packaging
      descriptions, not realized contract economics; discounts, attach rates,
      coverage losses, and implementation costs remain unavailable.
    claimRefs: ["CP002", "CP003", "CP008", "CP009", "CP010"]
    tableRefs: ["TP003"]
  - id: "moat-and-displacement-risk"
    title: "Moat durability and displacement risk"
    body: >-
      Redo has credible distribution signals: the Shopify App Store showed 814
      reviews, a 4.9 rating, and 96% five-star ratings when fetched, while a
      June 2026 company release reported 4,100 brands and 1,750 multi-product
      merchants. The same release tied its $81 million Series B to AI,
      international expansion, and the ReturnBear acquisition. Yet this
      evidence is company-issued or platform-hosted rather than an independent
      retention benchmark. Shopify can expand native post-purchase functions,
      direct rivals can copy shopper-funded packaging, and internal builds can
      keep workflow control. The FTC fee rule reviewed here applies to live
      events and short-term lodging, so it does not establish compliance for
      ecommerce return coverage; jurisdiction-specific legal analysis remains
      necessary rather than assuming either safety or prohibition.
    claimRefs: ["CP004", "CP005", "CP006", "CP013", "CP014", "CP015", "CP016"]
callouts:
  - calloutType: "strength"
    title: "Published wedge"
    body: >-
      Redo combines a free returns entry product with paid tracking, support,
      checkout, marketing, and AI modules, creating a consolidation pitch that
      narrower returns specialists must answer.
    claimRefs: ["CP002", "CP003", "CP011"]
  - calloutType: "risk"
    title: "Proof and policy gap"
    body: >-
      Most differentiation evidence is company-issued, platform-hosted, or
      supplied by an adjacent vendor; independent win-rate, retention, total
      cost, and jurisdiction-specific fee analysis are not public.
    claimRefs: ["CP005", "CP007", "CP015"]
