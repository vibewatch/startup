              - CP010
              - CP011
              - CP013
              - CP014
              - CP016
      - number: '3.3'
        title: Pricing and packaging
        blocks:
          - type: paragraph
            body: >-
              Redo's pricing page lists its returns portal as free and says Redo covers return-label costs, with paid
              modules layered around that core: order tracking is listed at $0.08 per tracked order, checkout
              optimization at $0.40 per order, and support at $0.20 per resolution. The reviewed comparison says the
              model is funded by optional shopper-paid return coverage at checkout. It describes Loop Core as another
              shopper-funded free tier, with paid plans starting at $155 and $340 per month, while Narvar does not
              publish pricing. These are list prices and packaging descriptions, not realized contract economics;
              discounts, attach rates, coverage losses, and implementation costs remain unavailable.
            claimRefs:
              - CP002
              - CP003
              - CP008
              - CP009
              - CP010
          - type: table
            tableRef: TP003
            claimRefs:
              - CP002
              - CP003
              - CP008
              - CP009
              - CP010
      - number: '3.4'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Redo has credible distribution signals: the Shopify App Store showed 814 reviews, a 4.9 rating, and 96%
              five-star ratings when fetched, while a June 2026 company release reported 4,100 brands and 1,750
              multi-product merchants. The same release tied its $81 million Series B to AI, international expansion,
              and the ReturnBear acquisition. Yet this evidence is company-issued or platform-hosted rather than an
              independent retention benchmark. Shopify can expand native post-purchase functions, direct rivals can copy
              shopper-funded packaging, and internal builds can keep workflow control. The FTC fee rule reviewed here
              applies to live events and short-term lodging, so it does not establish compliance for ecommerce return
              coverage; jurisdiction-specific legal analysis remains necessary rather than assuming either safety or
              prohibition.
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP013
              - CP014
              - CP015
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Published wedge
            body: >-
              Redo combines a free returns entry product with paid tracking, support, checkout, marketing, and AI
              modules, creating a consolidation pitch that narrower returns specialists must answer.
            calloutType: strength
            claimRefs:
              - CP002
              - CP003
              - CP011
          - type: callout
            title: Proof and policy gap
            body: >-
              Most differentiation evidence is company-issued, platform-hosted, or supplied by an adjacent vendor;
              independent win-rate, retention, total cost, and jurisdiction-specific fee analysis are not public.
            calloutType: risk
            claimRefs:
              - CP005
