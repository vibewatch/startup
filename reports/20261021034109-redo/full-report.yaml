      - number: '5.2'
        title: Operating architecture and dependencies
        blocks:
          - type: paragraph
            body: >-
              The observable architecture is an operating workflow, not a disclosed software stack. Shopper portals and
              agents initiate requests; policy, recommendation, and fraud logic determine the proposed outcome;
              commerce-system events then pass work to fulfillment, warehouses, and finance. An ERP-focused comparison
              describes portals such as Redo as the customer-facing authorization and decision layer, while inspection,
              disposition, returns-in-process inventory, reconciliation, and accounting remain warehouse and ERP
              responsibilities. This boundary makes implementation quality dependent on clean events, inventory-location
              accuracy, and integrations rather than the portal alone. Public material is strongly Shopify-shaped,
              although the comparison reports support for BigCommerce and Salesforce Commerce Cloud. Redo also claims
              international labels in more than 100 countries, five in-country hubs, and three-to-four-day refunds;
              these are company-issued operating claims, not verified performance benchmarks.
