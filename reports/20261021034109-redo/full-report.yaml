        title: Exhibits
        blocks:
          - type: callout
            title: Capital supports platform expansion
            body: >-
              The June 2026 Series B and ReturnBear acquisition give Redo resources and operating infrastructure to
              broaden beyond domestic returns software.
            calloutType: strength
            claimRefs:
              - CO002
              - CO010
          - type: callout
            title: Scale is company-reported and economics are opaque
            body: >-
              Brand counts, valuation, and product outcomes are unaudited public claims; revenue mix, total funding,
