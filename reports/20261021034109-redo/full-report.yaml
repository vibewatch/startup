  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pricing
        blocks:
          - type: paragraph
            body: >-
              Redo uses a land-and-expand monetization design rather than a single disclosed subscription. Its official
              pricing surface lists the returns portal as free and says Redo covers return-label costs; an
              adjacent-industry comparison describes the economic mechanism as an optional shopper-paid returns-coverage
              fee at checkout. Around that anchor, Redo publishes usage prices for checkout optimization, order
              tracking, support resolutions, email and SMS, and recovered carts, while returns AI remains custom-priced.
              These are list prices, not realized revenue, discounts, contract values, or gross margin. The model may
              lower initial merchant adoption friction, but underwriting requires the revenue mix and unit contribution
              of each stream, especially the shopper-funded coverage pool and label-cost exposure.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI010
