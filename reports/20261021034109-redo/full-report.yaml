chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and platform scope
        blocks:
          - type: paragraph
            body: >-
              Redo presents itself as a Draper, Utah technology company serving direct-to-consumer brands. Its current
              platform spans returns and claims, shipping and fulfillment, order tracking, support, marketing, payments,
              and international returns rather than remaining a single-purpose returns portal. The product thesis is
              vendor consolidation: post-purchase interactions share customer and order data, allowing Redo to automate
              exchanges, support, recovery, and fulfillment workflows from one operating surface. Shopify's discussion
              of direct commerce supports the strategic value of first-party purchase and preference data, but it does
              not validate Redo's execution or economics. The available evidence therefore supports the product category
              and operating model, while founding date and a complete corporate history remain unverified.
            claimRefs:
              - CO001
              - CO006
              - CO016
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO004
              - CO005
      - number: '1.2'
        title: Capital, scale, and milestones
        blocks:
          - type: paragraph
            body: >-
              On June 23, 2026, Redo announced an $81 million Series B at a reported $1.25 billion valuation, led by
              Smash Capital with Pelion Venture Partners and Cervin Ventures also participating. The same syndicated
              company release said more than 4,100 brands used the platform and more than 1,750 used multiple offerings.
              Redo's current homepage now says it serves more than 4,500 brands, which is directionally consistent with
              expansion but is not an independently audited customer count. The financing release also says Redo had
              acquired ReturnBear to add international return and fulfillment operations across more than 100 countries.
              Total capital raised, revenue, ARR, margins, retention, and headcount are not disclosed in the assigned
              evidence and must remain gaps.
            claimRefs:
              - CO002
