  - id: FU001
    title: Merchant adoption and expansion journey
    type: journey-map
    summary: >-
      Redo's merchant loop moves from returns pressure through a low-cost entry product to exchanges and multi-product
      expansion, with shopper-fee trust and unproven retention as the key breaks.
    data:
      nodes:
        - id: need
          label: Returns pressure
          detail: Merchants face high return volume and material loyalty risk from poor experiences.
          touchpoints:
            - Returns operations
            - Shopper expectations
        - id: evaluate
          label: Evaluate economics
          detail: The free returns portal and covered labels reduce the merchant's initial software hurdle.
          touchpoints:
            - Pricing review
            - Operations review
        - id: consent
          label: Shopper coverage choice
          detail: Optional shopper-paid coverage can fund the model but introduces disclosure and trust friction.
          touchpoints:
            - Checkout
            - Fee disclosure
        - id: transact
          label: Return or exchange
          detail: Self-service flows and exchange recommendations attempt to retain revenue instead of issuing a refund.
          touchpoints:
            - Returns portal
            - Exchange recommendation
        - id: prove
          label: Validate outcomes
          detail: Merchant-reported exchange gains need named cohorts, baselines, and independent verification.
          touchpoints:
            - Analytics
            - Customer reference
        - id: expand
          label: Add products
          detail: Tracking, support, fulfillment, and marketing create a cross-sell loop after initial trust is earned.
          touchpoints:
            - Product expansion
            - Renewal review
    approximationNotes: >-
      The sequence is an analytical journey, not a measured funnel; no conversion rates, stage populations, or
      time-to-expand metrics are disclosed.
    claimRefs:
      - CU002
      - CU005
      - CU006
      - CU009
      - CU011
      - CU012
      - CU014
