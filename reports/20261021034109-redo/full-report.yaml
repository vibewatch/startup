      - number: '4.2'
        title: Commercial traction and expansion signals
        blocks:
          - type: paragraph
            body: >-
              Public evidence offers scale and cross-sell proxies but no audited financial traction. Redo's current
              homepage says it serves more than 4,500 brands, and the June financing release says more than 1,750
              merchants use multiple offerings. Those figures support a plausible expansion motion from free returns
              into paid adjacent modules, but they do not reveal paying-customer count, average revenue per merchant,
              cohort retention, sales cycle, CAC, or payback. Redo also publishes merchant-reported outcomes such as
              higher exchange rates and retained revenue, with an explicit warning that individual results vary. These
              outcomes are product-value signals, not evidence of Redo's own revenue, margin, or merchant-level
              profitability.
            claimRefs:
              - CI004
              - CI005
              - CI011
      - number: '4.3'
        title: Cost structure and unit-economics constraints
        blocks:
          - type: paragraph
            body: >-
              Redo's cost base cannot be reconstructed from public disclosures. The operating model likely combines
              software delivery with return-label funding, customer support, AI inference, payments, carrier
              connectivity, and increasingly physical international returns operations. Redo says ReturnBear added local
              inspection, refurbishment, re-fulfillment, and reshipment capabilities across more than 100 countries;
              those activities can introduce service-delivery and working-capital complexity beyond a pure software
              model. Shopify's merchant guidance identifies acquisition, pick-and-pack, packaging, parcel shipping, 3PL
              services, discounts, spoilage, and returns as order-level profitability inputs, while an industry
              comparison notes that portals still depend on ERP and warehouse systems for inspection, disposition,
              inventory, and accounting. None of these benchmarks discloses Redo's actual costs.
            claimRefs:
              - CI008
              - CI009
              - CI012
              - CI013
              - CI014
          - type: table
            tableRef: TI003
            claimRefs:
              - CI005
              - CI006
              - CI009
              - CI011
              - CI014
              - CI016
      - number: '4.4'
        title: Capital adequacy and financial verdict
        blocks:
          - type: paragraph
            body: >-
              The $81 million Series B is verified financing, not evidence of cash available today or a measured runway.
              The company said proceeds would support product development, AI initiatives, and international expansion,
              and it had already deployed an unspecified portion to acquire ReturnBear. No reviewed source reports cash
              on hand, monthly burn, debt, project-finance obligations, acquisition consideration, preferred terms,
              liquidation preferences, or a next-round trigger. The FTC fee-rule source retained for refresh evidence
              applies specifically to live-event tickets and short-term lodging, so it does not establish that Redo's
              checkout coverage is governed by that rule; product-level and jurisdiction-specific legal analysis is
              still required. The financial verdict is therefore evidence of a credible multi-stream model and ample
              recent financing, but insufficient evidence of revenue quality, margin durability, or capital adequacy.
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
              - CI015
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Financing is not runway
            body: >-
              The Series B amount cannot be converted into current cash or months of runway without uses to date,
              acquisition consideration, burn, debt, and working-capital data.
            calloutType: risk
            claimRefs:
              - CI006
              - CI008
              - CI016
          - type: callout
            title: Underwrite by module and cohort
            body: >-
              Request a product-level revenue and gross-margin bridge, plus merchant cohorts showing attach, retention,
              expansion, and label or logistics loss economics.
            calloutType: recommendation
            claimRefs:
              - CI002
              - CI005
              - CI009
              - CI014
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Redo's current public surface is broader than a returns portal. Its homepage groups the proposition around
              marketing, payments, shipping, and returns, while the pricing page itemizes returns, claims, shipping and
              fulfillment, warranties, checkout optimization, upsell, email and SMS, order tracking, recovery, identity
              resolution, support, AI agents, and chargeback representment. Returns is listed as free and includes a
              portal, analytics, return-label coverage, and return-specific AI agents; several adjacent products use
              transaction or resolution pricing. That structure supports a land-and-expand product strategy rather than
              a single-SKU application. A 2026 third-party article reported that more than 1,750 customers used multiple
              Redo offerings, but the claim is not independently audited and should not be treated as retention
              evidence. For merchants, the practical workflow is shopper self-service first, with exchanges, claims,
              support, and tracking sharing order and interaction context.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE005
