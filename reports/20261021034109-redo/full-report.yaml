      - number: '1.4'
        title: Business model and diligence boundaries
        blocks:
          - type: paragraph
            body: >-
              Redo advertises its returns portal as free and says it covers return-label costs, while an independent
              August 2026 comparison explains that the economics rely on shoppers opting into paid returns coverage at
              checkout and that several adjacent modules are usage-priced. This can accelerate adoption and cross-sell,
              but it shifts diligence toward checkout consent, fee disclosure, merchant concentration, and unit
              economics rather than a conventional seat-based SaaS model. The comparison also characterizes Redo as
              Shopify-shaped and notes that portal vendors emit events while warehouse and ERP systems retain physical
              and financial control. The cited FTC fee rule currently covers live-event tickets and short-term lodging,
              not general ecommerce returns; therefore it is a disclosure benchmark, not evidence that Redo violates
              that rule. Product-level legal review across relevant jurisdictions remains necessary.
            claimRefs:
              - CO007
              - CO008
              - CO009
              - CO014
              - CO015
