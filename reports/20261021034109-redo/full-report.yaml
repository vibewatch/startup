  - id: FI001
    title: Revenue model bridge from merchant activity to unknown gross profit
    type: flow
    summary: >-
      Redo can monetize merchant and shopper activity across several usage surfaces, but public evidence stops before
      realized revenue mix and gross profit.
    data:
      nodes:
        - id: merchant-entry
          label: Merchant adopts free returns portal
          value: Free list price
          detail: Redo says it covers return-label costs.
        - id: shopper-coverage
          label: Shopper selects returns coverage
          value: Fee not publicly disclosed
          detail: A third-party comparison describes the free model as funded by shopper opt-in coverage at checkout.
        - id: merchant-usage
          label: Orders and support interactions generate usage
          value: Orders, tracked orders, resolutions, sends
          detail: Public pricing uses multiple activity denominators.
        - id: paid-modules
          label: Paid modules generate list-price billings
          value: $0.40/order; $0.08/tracked order; $0.20/resolution
          detail: Other modules use per-send, revenue-share, or custom pricing.
        - id: cross-sell
          label: Merchants adopt multiple offerings
          value: 1,750+ merchants
          detail: Company-reported multi-product usage is a cross-sell proxy, not ARR.
        - id: realized-revenue
          label: Realized revenue
          value: Unavailable
          detail: Mix, discounts, contract terms, and recurring classification are not public.
        - id: gross-profit
          label: Gross profit after delivery costs
          value: Unavailable
          detail: Label, logistics, support, AI, payment, and carrier costs are not disclosed.
    approximationNotes: Ordered mechanism only; node order does not imply conversion rates or value-proportional magnitude.
