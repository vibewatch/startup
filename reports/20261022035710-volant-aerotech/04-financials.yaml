company:
  name: Volant Aerotech
chapter:
  number: 4
  title: Financials
  summary: Volant has raised substantial private capital and reports a large prospective order book, but public evidence still does not establish recurring revenue, realized aircraft pricing, cash runway, or unit economics. The underwriting case therefore depends on converting deposits and certification progress into auditable deliveries while funding a capital-intensive aviation program.
sections:
  - id: revenue-and-monetization
    title: Revenue model and monetization
    body: >-
      Volant's apparent monetization path is aircraft manufacturing and related service
      support, with customer activity beginning as orders, letters of intent, and deposits
      and only becoming revenue after certification, production, acceptance, and delivery.
      The reported order book is therefore a pipeline indicator rather than recognized
      revenue. PanDaily reports more than 1,900 orders valued at $66 billion and a first
      confirmed China Southern Airlines General Aviation order, while The Insight Asia
      distinguishes the broader orders and letters of intent from firm commitments and
      reports nearly RMB100 million of deposits. Those qualifications materially reduce
      the evidentiary value of gross order value for forecasting. EquityZen describes
      Volant as a private passenger-eVTOL R&D, manufacturing, and service company, but
      its public page does not disclose revenue or realized transaction prices. Public
      evidence consequently supports a hardware-plus-service model, not an ARR or current
      revenue estimate.
    claimRefs: [CI001, CI002, CI003, CI004, CI005]
    tableRefs: [TI001, TI002]
  - id: cost-structure-and-unit-economics
    title: Cost structure and operating economics
    body: >-
      The economics are dominated by certification, aircraft development, production
      scale-up, and future operating infrastructure. PanDaily gives a company-reported
      estimate of $8.3 per seat for a 20-kilometre, five-minute flight, but that is an
      operating-cost estimate for a specified flight and not a realized fare, contribution
      margin, or company gross margin. The aircraft's eight electric motors, 2.5-tonne
      maximum takeoff weight, and 200–400 kilometre range imply meaningful engineering
      and maintenance requirements, while the revised Civil Aviation Law source identifies
      type, production, operator, insurance, and passenger-protection obligations before
      commercial service. The law also describes a 20-times difference between public-air
      transport and general-aviation capital thresholds, showing that route and operating
      model selection can change the capital burden. No public source supplies Volant's
      bill of materials, labor content, maintenance reserve, insurance quote, utilization,
      CAC, payback, or gross margin.
    claimRefs: [CI006, CI007, CI008, CI009, CI010]
    tableRefs: [TI003]
    figureRefs: [FI001]
  - id: capital-adequacy-and-verdict
    title: Capital adequacy and underwriting verdict
    body: >-
      Volant has demonstrated financing access but not publicly verified cash adequacy.
      The Insight Asia reports a nearly RMB1 billion C+ round after a $300 million Series
      C and total funding above RMB5 billion across 13 rounds; PanDaily instead describes
      nearly $4.2 billion in C and C+ rounds over two months. These figures are not
      reconciled in the public record and should not be treated as cash available.
      Hurun assigns Volant a $1.5 billion valuation in its 2026 unicorn index, while
      EquityZen withholds current valuation, cap table, financials, and risk factors
      behind investor access. The public record therefore supports a well-capitalized
      fundraising narrative, not a runway calculation. Certification timing is the key
      financing trigger: The Insight Asia says management expects type certification by
      2027, and the regulatory sources indicate substantial compliance and insurance
      obligations. The financial verdict is research-more until cash, burn, capex,
      deposits, binding backlog, and delivery economics are disclosed.
    claimRefs: [CI011, CI012, CI013, CI014, CI015]
    callouts:
      - calloutType: risk
        title: Financing visibility is weaker than financing headline
        body: >-
          The disclosed rounds and reported deposits show access to capital and some
          customer commitment, but no retained source provides cash on hand, monthly burn,
          runway, realized aircraft revenue, or contract-level deposit terms.
        claimRefs: [CI003, CI011, CI012, CI015]
