    notes: "Public reporting mixes orders and letters of intent with confirmed orders; null or undisclosed values mean no retained source established realized revenue."
    claimRefs: [CI001, CI002, CI003, CI004, CI005]
  - id: TI002
    title: Pricing and monetization evidence
    columns: [Metric or term, Public evidence, Status, Underwriting implication]
    rows:
      - [VE25-100 order-book value, "$66 billion for more than 1,900 reported orders", "Company-reported through PanDaily; unit price and binding share unknown", "Cannot convert gross headline into revenue forecast"]
      - [Reported order and LOI value, "More than RMB47.5 billion", "The Insight Asia says firm commitments likely make up a fraction", "Require contract-level backlog aging and conversion probability"]
      - [Deposits, "Nearly RMB100 million", "Reported; customer allocation and refundability unknown", "Potential working-capital support, but not recognized revenue or unrestricted cash"]
      - [Flight operating-cost estimate, "$8.3 per seat for a 20-km, 5-minute flight", "Estimated operating cost; fare and load factor absent", "Needs route-level sensitivity analysis before margin inference"]
    notes: "Values are not comparable accounting measures: order value, deposits, and operating cost have different units, timing, and recognition."
    claimRefs: [CI002, CI003, CI006]
  - id: TI003
    title: Unit economics and capital requirements
    columns: [Metric, Value, Confidence, Why it matters, Diligence ask]
    rows:
      - [Aircraft operating cost per seat, "$8.3 estimate for specified 20-km flight", "Medium", "Tests potential advantage versus helicopters but excludes fare, utilization, and overhead", "Validate with flight-test logs, energy use, maintenance, insurance, pilot, and route data"]
      - [Maximum takeoff weight, "2.5 tonnes", "Medium", "Indicates aircraft scale and production/logistics burden", "Reconcile final certified configuration and payload economics"]
      - [Range, "200–400 km", "Medium", "Determines route coverage and battery/charging requirements", "Provide certified range by payload, reserve, weather, and battery degradation"]
      - [Public-air-transport capital threshold, "RMB600 million", "Medium", "Shows potential operator-side funding requirement", "Confirm applicable operating category and entity-level financing plan"]
      - [General-aviation capital threshold, "RMB30 million", "Medium", "Alternative operating category may reduce threshold but not obligations", "Confirm CAAC classification, insurance, and passenger-protection requirements"]
      - [Cash runway, null, "Unavailable", "Core solvency and certification-funding variable", "Obtain latest cash, monthly burn, committed capex, debt, and next-round trigger"]
    notes: "The first three aircraft metrics are reported specifications or estimates; regulatory thresholds apply to operating categories and are not Volant's cash balance or manufacturing cost."
    claimRefs: [CI006, CI007, CI008, CI009, CI010, CI015]
