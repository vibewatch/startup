callouts:
  - calloutType: recommendation
    title: Underwrite certification conversion, not order headlines
    body: >-
      Proceed only with a diligence package that reconciles funding disclosures and
      verifies binding backlog, deposit terms, cash runway, production capex, certification
      milestones, and route-level unit economics.
    claimRefs: [CI002, CI003, CI011, CI012, CI015]
