figures:
  - id: FU001
    title: Evidence-gated customer journey from interest to expansion
    type: journey-map
    summary: >-
      Public proof is strongest at agreement formation and weakens after certification,
      where delivery, operations, renewal, and expansion evidence are absent.
    data:
      items:
        - label: Use-case interest
          detail: "Operators, lessors, and destination developers identify passenger, tourism, regional transport, and emergency-service missions."
          status: evidenced
          touchpoints: ["Trade reporting", "Named agreement announcements"]
        - label: Commercial agreement
          detail: "Public disclosures distinguish some confirmed orders from a larger pool that includes intention orders and letters of intent."
          status: evidenced-with-qualification
          touchpoints: ["Order announcement", "Counterparty disclosure"]
        - label: Financing and channel setup
          detail: "Lessors and infrastructure partners can place aircraft with operators, but lessees, recourse, and route economics are not public."
          status: partial
          touchpoints: ["Lease structure", "Infrastructure partnership"]
        - label: Certification
          detail: "The VE25-100 type-certificate application remained under review in the 2026 evidence, making certification a prerequisite to delivery."
          status: pending
          touchpoints: ["Type certification", "Operating approval"]
        - label: Delivery and operations
          detail: "No assigned source documents delivered Volant aircraft, active passenger service, utilization, or customer revenue."
          status: evidence-gap
          touchpoints: ["Delivery acceptance", "Route launch", "Utilization"]
        - label: Renewal and expansion
          detail: "Repeat orders, renewals, churn, and fleet expansion by an operating customer are not publicly documented."
          status: evidence-gap
          touchpoints: ["Renewal", "Repeat deployment", "Passenger demand"]
    approximationNotes: >-
      Ordered stages describe evidence maturity rather than a measured conversion
      funnel; no rates, stage populations, or time-to-conversion are inferred.
    claimRefs: [CU011, CU012, CU013, CU014, CU015, CU016]
callouts:
  - calloutType: risk
    title: Order book is not the same as customer adoption
    body: >-
      Treat the CNY47.5 billion potential pipeline as commercial interest until
      management provides customer-level contract type, deposits, cancellation rights,
      certification conditions, delivery schedules, and evidence of active operations.
    claimRefs: [CU009, CU011, CU012]
