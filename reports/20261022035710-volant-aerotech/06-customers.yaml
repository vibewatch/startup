company:
  name: Volant Aerotech
chapter:
  number: 6
  title: Customers
  summary: >-
    Volant has accumulated a broad, named order pipeline across operators, lessors,
    and an overseas infrastructure developer, but public evidence remains
    concentrated on agreements rather than delivered aircraft or recurring use.
    The strongest public challenge is conversion quality: most of the headline
    1,900-aircraft pipeline was assessed as letters of intent, while retention,
    deposits, cancellations, and customer concentration remain undisclosed.
sections:
  - id: demand-is-real-but-pre-delivery
    title: Demand is named, but still pre-delivery
    body: >-
      Public evidence supports real counterparty engagement rather than an anonymous
      order-book claim. Reporting identifies China Southern General Aviation and Asian
      Express as confirmed-order counterparties, while company-originated chronology
      names ABC Finance Leasing, Bank of China Financial Leasing, Pan Pacific, and
      several general-aviation operators. The evidence nevertheless describes orders,
      intended purchases, and memoranda; it does not establish aircraft deliveries,
      passenger operations, utilization, or repeat purchases. Certification remains a
      gating dependency, so this chapter treats the pipeline as pre-revenue demand
      validation rather than active customer adoption. This distinction is material
      because an aircraft buyer can sign before final specifications, financing,
      certification, delivery slots, and operating approvals are settled.
    claimRefs: [CU002, CU004, CU005, CU006, CU007, CU008, CU012]
    tableRefs: [TU003]
  - id: buyer-and-use-case-segmentation
    title: Buyer mix broadens access and execution risk
    body: >-
      The disclosed buyer set spans airlines and general-aviation operators, financial
      lessors, and a property-and-infrastructure developer. That mix gives Volant more
      than one route to market: direct operator sales, leasing-led fleet placement,
      and destination-led deployment. It also means the end user and economic payer
      are often not the same party. Lessors may finance aircraft used by an operator;
      Pan Pacific may sponsor assets whose ultimate operators and passengers are not
      identified; and emergency or tourism use cases may depend on local authorities,
      infrastructure, and route approvals. The public record does not disclose pricing,
      deposits, financing recourse, or who bears utilization risk, preventing a
      revenue-quality comparison across these customer segments.
    claimRefs: [CU002, CU003, CU004, CU005, CU006, CU007]
    tableRefs: [TU001]
  - id: trajectory-and-proof-quality
    title: Order-book growth outpaces proof of adoption
    body: >-
      The announced pipeline rose from more than 700 aircraft worth CNY15 billion in
      2024 to a company-reported 1,900 aircraft worth more than CNY47.5 billion in
      2026. These figures are not a conventional sales funnel: the vintages, contract
      categories, cancellation rights, and inclusion rules are not disclosed, and an
      independent analyst assessed that the vast majority of the later total was
      probably letters of intent without firm commitment. Volant also does not publish
      customer revenue, delivered units, active fleet, or utilization. Consequently,
      the trajectory demonstrates growing commercial interest but cannot support a
      conversion rate, revenue forecast, or retention conclusion. Production
      deployment should be credited only after certification, delivery, and operator
      evidence appear.
    claimRefs: [CU001, CU008, CU009, CU011, CU012]
    tableRefs: [TU002]
  - id: durability-concentration-and-expansion
    title: Durability and concentration remain untested
    body: >-
      Pan Pacific's 500-aircraft intent represents roughly 26% of the separately
      reported 1,900-aircraft potential pipeline if both disclosures use comparable
      inclusion rules. That conditional ratio is a screening indicator, not a verified
      concentration metric. No public source in the assigned evidence discloses NRR,
      GRR, churn, renewals, cancellation rates, backlog aging, customer deposits, or
      top-customer revenue. The appropriate expansion lens is therefore operational:
      certification, financing, route integration, delivery, and repeat deployment.
      Competitor evidence shows that customer access can be strengthened through
      booking-platform integration and extensive flight proof, while industry analysis
      cautions that passenger urban air mobility remains visible but low-volume.
      Volant has not yet published equivalent evidence tying its named agreements to
      recurring passenger demand.
    claimRefs: [CU010, CU013, CU014, CU015, CU016]
    figureRefs: [FU001]
