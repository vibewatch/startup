company:
  name: Volant Aerotech
chapter:
  number: 8
  title: Valuation
  summary: Public evidence supports a substantial financing and commercialization trajectory, but it does not establish a current valuation, cash runway, or the binding quality of the reported order book. The appropriate stance is research-more until price, preference, certification, and customer-conversion evidence are disclosed.
sections:
  - id: investment-thesis
    title: Investment thesis and anti-thesis
    body: >-
      Volant's investable thesis is that repeated institutional financing, a reported
      Series C+ round of nearly RMB 1 billion, and reported domestic and international
      demand provide a credible route to commercial scale. The latest financing account
      says proceeds are intended for flight testing, airworthiness certification, and
      industrial-chain integration, while a separate report describes a target of
      certification and commercial deliveries by 2027. The anti-thesis is that these are
      still capital-intensive pre-commercial milestones: the public record does not show
      realized revenue, customer deposits, contribution margin, cash runway, or the
      contractual status of most reported orders. The comparable distress of Volocopter
      and Lilium shows that financing access and headline order pipelines do not by
      themselves secure continuity.
    claimRefs: [CV001, CV002, CV003, CV004, CV005]
    tableRefs: [TV001, TV002]
    figureRefs: [FV001]
  - id: financing-and-price-discipline
    title: Financing context and entry discipline
    body: >-
      The disclosed financing evidence is meaningful but not a valuation mark. EQS
      reports nearly RMB 1 billion in the C+ round and more than RMB 5 billion across
      13 rounds over five years; Sina separately reports a recent C round of about
      US$300 million and describes the company as having raised more than RMB 5 billion
      cumulatively. These figures are issuer or media accounts of capital raised, not
      cash currently available and not ARR or revenue. No assigned source discloses the
      post-money valuation, share price, liquidation preferences, debt, option pool,
      founder ownership, or investor return hurdle. Entry discipline should therefore
      require a verified cap table and financing documents before accepting a
      unicorn-level price.
    claimRefs: [CV006, CV007, CV008, CV009]
    tableRefs: [TV003]
  - id: scenarios-and-comparables
    title: Scenarios and comparable evidence
    body: >-
      The bull case assumes certification, commercial deliveries, and conversion of a
      portion of the reported order pipeline into binding contracts and deposits. The
      base case assumes certification progress but slower fleet deployment and continued
      external financing. The bear case assumes certification or commercialization
      slippage while the business remains dependent on repeated capital raises. Public
      comparables illustrate the financing and execution risk rather than supplying a
      direct multiple: BETA describes a backlog of more than 800 aircraft and several
      funding sources, while Reuters reports that Volocopter entered insolvency after
      failing to raise funds; Aerotime reports Lilium stopped operations after financing
      failed to materialize. These are not directly comparable valuation benchmarks.
    claimRefs: [CV010, CV011, CV012, CV013]
  - id: recommendation-and-diligence
    title: Recommendation and thesis-break triggers
    body: >-
      The recommendation is research-more with low-to-medium confidence in the
      valuation call: the company has strong financing momentum and a plausible
      certification path, but public evidence is insufficient to distinguish a durable
      order book from conditional intent agreements or to test the current price against
      operating economics. A thesis upgrade requires audited or management-certified
      cash, burn, runway, customer deposits, delivery milestones, and the latest
      financing valuation and preferences. Thesis-break triggers are a missed
      certification milestone, inability to finance the next test phase, material order
      cancellations, or evidence that the reported financing was not available for core
      aircraft development. The monitoring plan should separate signed contracts from
      LOIs, options, and MOUs.
    claimRefs: [CV014, CV015]

tables:
  - id: TV001
    title: Recommendation summary
    columns: [Dimension, Assessment, Evidence basis, Decision implication]
    rows:
      - [Recommendation, research-more, "Financing and certification progress are reported, but valuation and economics are not disclosed.", "Do not underwrite a purchase price yet."]
      - [Confidence, low-to-medium, "The assigned pool contains financing, order, and peer-distress evidence but no cap table or operating statements.", "Require primary financial diligence."]
      - [Risk rating, high, "Certification, capital intensity, and financing continuity remain outcome-critical.", "Size only after runway and milestone verification."]
      - [Valuation stance, unknown, "No assigned source states a current post-money valuation or transaction price.", "Use a price-sensitive diligence gate."]
    notes: Public sources mix company-issued announcements, media reports, and peer evidence; “unknown” reflects missing valuation evidence, not a zero valuation.
    claimRefs: [CV001, CV003, CV005, CV009, CV014]
  - id: TV002
    title: Thesis / anti-thesis
    columns: [Argument, Supporting evidence, What would change the view]
    rows:
      - ["Institutional financing can fund the certification push.", "C+ financing is reported at nearly RMB 1 billion and cumulative financing above RMB 5 billion.", "Verify cash receipt, restrictions, burn, and remaining runway."]
      - ["The product has a plausible commercial pathway.", "The VE25-100 is reported as targeting certification and commercial deliveries by 2027.", "Verify regulator milestones, open findings, and delivery readiness."]
      - ["Reported demand could support scale.", "A 500-aircraft Pan Pacific LOI and 1,900 domestic orders are reported.", "Obtain signed contracts, deposits, cancellation terms, and delivery schedules."]
      - ["The financing narrative may overstate durability.", "Volocopter and Lilium both illustrate funding failure in capital-intensive eVTOL commercialization.", "Demonstrate diversified funding sources and a funded path through certification."]
    notes: Order counts and financing totals are reported claims; the pool does not establish binding status, cash conversion, or comparable valuation multiples.
    claimRefs: [CV002, CV003, CV004, CV005, CV010, CV011, CV012, CV013]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Assumptions, Valuation / return logic, Key risks and probability signal]
    rows:
      - [Bull, "Certification is achieved on the reported timetable; a meaningful share of reported orders becomes binding and generates deposits.", "Potential for a premium growth valuation, but no public multiple or current price is available.", "High execution and financing risk; low probability signal until contracts and cash are verified."]
      - [Base, "Certification progresses with delays; deliveries remain limited and additional financing is required.", "Value should be anchored to funded milestones and dilution-adjusted ownership rather than order headline value.", "Moderate probability signal; runway and preferences are unknown."]
      - [Bear, "Certification or commercialization slips and financing access tightens.", "Downside includes dilution, preference overhang, or impaired continuity; no defensible numeric downside is public.", "Material probability signal given peer funding failures."]
      - [Trigger, "Missed certification milestone, order cancellations, or inability to fund flight testing.", "Re-underwrite at a lower price or pause investment pending verified financing.", "Thesis-break condition requiring immediate review."]
    notes: These are qualitative scenarios, not price targets. No assigned source supports a numeric valuation range, return target, or probability estimate.
    claimRefs: [CV003, CV004, CV005, CV010, CV011, CV012, CV014, CV015]

