callouts:
  - calloutType: recommendation
    title: Price-sensitive conclusion
    body: >-
      Research more: treat financing raised and reported order value as distinct from
      cash available and realized revenue, and require the latest valuation, cap table,
      preferences, runway, customer deposits, and certification evidence before entry.
    claimRefs: [CV006, CV008, CV009, CV014, CV015]

