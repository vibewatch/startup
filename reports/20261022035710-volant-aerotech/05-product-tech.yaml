      - ["Emergency medical transport", "Ground ambulance or conventional rotorcraft response", "Cabin configuration able to accept a two-meter stretcher", "One aircraft platform is intended to support rescue missions", "No medical-equipment fit, loading-time, clinical, or operator-approval evidence"]
      - ["Aviation cargo movement", "Road freight or conventional air cargo", "Cabin configuration for aviation-grade containers", "Company describes switching from passenger to cargo use", "No certified payload-range curve, loading standard, turnaround time, or cargo economics"]
      - ["Sightseeing or private travel", "Helicopter, fixed-wing charter, or ground tourism", "Passenger cabin with large windows and reconfigurable seating", "Company maps the aircraft to sightseeing and private-travel scenarios", "No noise, vertiport, utilization, pricing, or customer-acceptance validation"]
