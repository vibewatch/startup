company:
  name: "Volant Aerotech"
chapter:
  number: 5
  title: "Product & Technology"
  summary: >-
    Volant's disclosed product is the piloted, six-seat VE25-100, a configurable
    passenger eVTOL built around eight electric motors, simplified vehicle
    controls, and a certification-led path to commercial deployment. The public
    evidence supports a credible product concept and reported flight-test
    milestones, but it does not independently validate the aircraft's range,
    reliability, safety case, production readiness, software assurance, or
    certification schedule.
sections:
  - id: "product-and-workflow"
    title: "Product definition and customer workflow"
    body: >-
      Volant presents the VE25-100 as its first product and as the aircraft at
      the center of a broader advanced-air-mobility service. Company-issued
      material describes a cabin for one pilot and five passengers, a maximum
      cruise speed of 235 km/h, and a 200-400 km range; these are design claims,
      not independently demonstrated operating results. The same release says
      the cabin can switch among passenger, emergency-rescue, and cargo
      configurations and maps those configurations to six travel scenarios.
      That breadth creates optionality, but each mission changes payload,
      interior, dispatch, ground-handling, and certification requirements.
      Diligence should therefore treat the current product as one aircraft
      platform with multiple claimed missions, rather than six validated
      products or production-ready services.
    claimRefs: [CE001, CE004, CE005, CE009]
    tableRefs: [TE001, TE002]
  - id: "architecture-and-differentiation"
    title: "Disclosed architecture and differentiation"
    body: >-
      The public architecture is specific at the subsystem-category level but
      shallow below it. Volant says the aircraft uses eight electric motors and
      a multi-redundant propulsion system, while its Simplified Vehicle
      Operations control concept is intended to let a pilot manage the flight
      state through one set of inputs. A company release also lists airframe
      structures, aerodynamics, control laws, redundant systems, electric
      propulsion, and energy-system thermal design among its capabilities.
      Those disclosures indicate the intended engineering scope, but they do
      not reveal battery chemistry, supplier allocation, software-development
      assurance, redundancy segregation, failure probabilities, maintainability
      data, or ownership of critical intellectual property. Sector evidence
      further shows that the delivered system extends beyond the aircraft to
      air-traffic management, communications, operating software, charging,
      landing infrastructure, and maintenance.
    claimRefs: [CE002, CE006, CE007, CE012, CE013]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: "maturity-and-roadmap"
    title: "Maturity, certification, and deployment"
    body: >-
      The evidence places VE25-100 in certification and flight-test development,
      not in certified commercial service. Volant's 2024 release says the type
      certification process began in September 2023 and reached an initial
      review meeting on October 23, 2024. A later third-party account repeats
      the September 2023 acceptance and reports an October 2025 manned test
      flight; it also attributes a 2027 type-certificate expectation to founder
      Dong Ming. That expectation is management guidance relayed by a third
      party, not a regulator commitment. An industry report describes CAAC
      eVTOL certification as a five-phase, multi-year process and warns that
      international mutual recognition is not established. The investable
      milestone is therefore not the date target alone, but closure of
      regulator findings, conformity evidence, production certification,
      operator approvals, and repeatable aircraft support.
    claimRefs: [CE008, CE010, CE011, CE014]
  - id: "safety-reliability-and-trust"
    title: "Safety, reliability, and technical-risk verdict"
    body: >-
      Volant says it has completed single-rotor-failure, emergency-landing,
      piloted-maiden-flight, and piloted-transition-flight scenarios. These are
      useful development signals, but the assigned evidence contains no
      regulator report, test protocol, fleet-hour denominator, incident log,
      reliability distribution, or independent performance benchmark with
      which to validate the company's broader safety and maintainability
      conclusions. A public peer filing illustrates the larger operating
      system that commercial eVTOL service requires: safety management spanning
      design, manufacturing, flight operations, maintenance, and training.
      Volant's fetched official news page exposed only a contact form rather
      than a usable technical archive, and the assigned pool contained no
      developer or practitioner-community signal. The product thesis is
      technically plausible but remains evidence-constrained; certification
      progress, assurance artifacts, supplier qualification, production
      conformity, and in-service support data are the decisive diligence items.
    claimRefs: [CE003, CE015, CE016]
