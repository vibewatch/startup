    rows:
      - ["Airframe, aerodynamics, and cabin", "Carry people or cargo across the claimed mission envelope", "Structural materials, analysis, test articles, and configuration approvals", "Public evidence does not show certified weights, fatigue life, crashworthiness, or payload-range curves"]
      - ["Electric propulsion and energy", "Provide vertical lift, transition, cruise power, and redundancy", "Eight motors, batteries, thermal management, power electronics, and qualified suppliers", "Battery chemistry, isolation, reserve policy, supplier concentration, and degradation data are undisclosed"]
      - ["Flight controls and SVO", "Translate pilot inputs into controlled flight across operating modes", "Control laws, sensors, actuators, computing, communications, and assurance processes", "No public software assurance level, cyber architecture, human-factors results, or fault-tree evidence"]
      - ["Certification and production system", "Demonstrate compliance and reproduce conforming aircraft", "CAAC findings closure, configuration control, quality system, and production approvals", "Schedule may move nonlinearly; current phase and open regulator findings are not public in the assigned evidence"]
      - ["Deployment and support ecosystem", "Enable routes, dispatch, maintenance, training, and passenger service", "Airspace, traffic management, vertiports, charging, maintenance, pilots, and operator approvals", "Aircraft readiness alone cannot establish commercial availability, utilization, or safe scaled operations"]
