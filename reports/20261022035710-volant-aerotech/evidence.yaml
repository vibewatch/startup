evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: certification
    missingEvidence: >-
      Regulator-facing VE25-100 type-certificate status, open findings, production approval path, and operator
      authorization plan.
    whyItMatters: The company's revenue and backlog conversion depend on aviation approvals that public releases do not prove.
    diligencePath: Request current CAAC correspondence, certification program milestones, and an independent airworthiness review.
    relatedQuestionRefs:
      - QO003
      - QO008
  - type: private-evidence-only
    severity: material
    topic: backlog-quality
    missingEvidence: >-
      Customer-by-customer contracts, firm-order definitions, deposits, cancellation rights, delivery schedules, and
      recognized revenue.
    whyItMatters: Headline orders and letters of intent can overstate near-term demand and do not establish revenue timing.
    diligencePath: >-
      Obtain an order ledger and sample executed contracts from the largest customers, including Sichuan Airlines Low
      Altitude.
    relatedQuestionRefs:
      - QO005
  - type: private-evidence-only
    severity: material
    topic: funding
    missingEvidence: Latest cash balance, monthly burn, runway, cap table, financing instruments, and investor preferences.
    whyItMatters: Large financing totals are not equivalent to cash available for certification and manufacturing.
    diligencePath: Request management accounts, financing documents, and a uses-of-proceeds bridge from Series C and C+.
    relatedQuestionRefs:
      - QO004
      - QO009
  - type: enumeration-incomplete
    severity: material
    topic: governance
    missingEvidence: Complete executive and board roster, founder ownership, succession coverage, and safety-accountability structure.
    whyItMatters: >-
      A safety-critical, long-cycle program is exposed to key-person and governance risk if accountability cannot be
      assessed.
    diligencePath: Request the current organization chart, board materials, key-person plan, and design-assurance responsibilities.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholder map
    missingEvidence: Complete legal-entity, financing, operating, and regulatory stakeholder enumeration for Volant Aerotech.
    whyItMatters: >-
      The assigned pool identifies major stakeholders but does not establish a complete population, control map, or
      contractual importance for every named party.
    diligencePath: >-
      Request the current cap table, material-contract register, certification responsibility matrix, and customer
      concentration schedule.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: minor
    topic: valuation
    missingEvidence: A current company-specific valuation or financing price with primary documentation.
    whyItMatters: >-
      Unicorn-list definitions and competitor market caps cannot establish Volant's current valuation or investment
      pricing.
    diligencePath: Obtain the latest priced-round term sheet, cap-table valuation, or audited investor disclosure.
    relatedQuestionRefs:
      - QO009
  - type: missing-source
    severity: material
    topic: market-sizing-gap
    missingEvidence: A primary-source bottom-up SAM/SOM model by route, aircraft, operator, geography, and deployment year.
    whyItMatters: >-
      Top-down low-altitude-economy forecasts do not establish the share available to passenger eVTOL manufacturers or
      Volant.
    diligencePath: >-
      Obtain management's route-level market model and reconcile it to regulator approvals, operator contracts, and
      aircraft production capacity.
    relatedQuestionRefs:
      - QM007
  - type: conflicting-data
    severity: material
    topic: product-capacity
    missingEvidence: A current technical configuration and certification filing that resolves five-seat versus six-seat capacity.
    whyItMatters: Capacity changes revenue-per-flight, payload, certification scope, and fleet economics.
    diligencePath: Reconcile the current VE25-100 type-certificate configuration and dated specification sheet to public reporting.
    relatedQuestionRefs:
      - QM008
  - type: private-evidence-only
    severity: material
    topic: demand-validation
    missingEvidence: Customer-by-customer binding status, deposits, cancellation terms, delivery schedules, and route economics.
    whyItMatters: Orders and letters of intent can materially overstate near-term demand and do not prove monetization.
    diligencePath: >-
      Request redacted contracts, deposit schedules, customer concentration, and delivery milestones under diligence
      NDA.
    relatedQuestionRefs:
      - QM006
      - QM008
  - type: private-evidence-only
    severity: material
    topic: pricing-gap
    missingEvidence: >-
      Customer quotations, realized aircraft prices, deposits, discounts, refundability, cancellation rights, support
      packages, and route-level ticket economics for comparable Volant and competitor offerings.
    whyItMatters: >-
      Public list prices and target prices cannot establish buyer switching costs, revenue quality, gross margin, or
      total cost of ownership.
    diligencePath: >-
      Obtain standardized OEM bids and three customer contracts, then reconcile aircraft, infrastructure, training,
      maintenance, insurance, and financing terms on a per-seat-mile basis.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: conflicting-data
    severity: material
    topic: order-quality
    missingEvidence: >-
      A customer-by-customer schedule separating binding purchase agreements, options, letters of intent, deposits
      received, refundable amounts, milestones, and delivery windows.
    whyItMatters: >-
      Headline order counts may overstate demand, distribution lock-in, production visibility, and the value of Volant's
      commercial position.
    diligencePath: >-
      Inspect executed contracts and bank evidence for deposits; confirm material terms directly with the largest named
      customers.
    relatedQuestionRefs:
      - QP002
      - QP007
      - QP008
    relatedTableRefs:
      - TP001
  - type: missing-source
    severity: material
    topic: certification-risk
    missingEvidence: >-
      Current CAAC certification basis, completed and open compliance items, regulator-agreed test plan, production
      approval path, test-flight hours, and target dates for every remaining approval.
    whyItMatters: >-
      Certification maturity determines launch timing, capital needs, trust, and whether competitor infrastructure or
      operator relationships become locked before Volant can deliver.
    diligencePath: >-
      Review regulator correspondence and the live compliance checklist with Volant's certification lead, then validate
      status with aviation counsel and the relevant CAAC office.
    relatedQuestionRefs:
      - QP003
      - QP006
      - QP007
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: >-
      Latest balance sheet cash, monthly cash burn, committed capex, debt or project-finance obligations, and runway
      under certification and production scenarios.
    whyItMatters: >-
      Funding headlines and cumulative capital raised do not show whether Volant can finance certification, tooling,
      production, and operations without another round.
    diligencePath: >-
      Request management accounts, twelve-month cash forecast, capex commitments, debt schedules, and financing trigger
      assumptions under base and downside cases.
    relatedQuestionRefs:
      - QI007
  - type: private-evidence-only
    severity: blocking
    topic: backlog-quality
    missingEvidence: >-
      Customer-level contracts, deposit terms, cancellation rights, milestones, delivery schedules, and realized
      aircraft prices.
    whyItMatters: >-
      A gross order-book value that includes letters of intent cannot be converted into revenue, working capital, or
      production planning without binding-status evidence.
    diligencePath: >-
      Obtain a redacted backlog aging report and reconcile each customer commitment to deposits, acceptance criteria,
      and delivery timing.
    relatedQuestionRefs:
      - QI002
      - QI003
  - type: missing-source
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Certified route-level economics covering fare, load factor, energy, pilot, maintenance, insurance, vertiport, and
      utilization assumptions.
