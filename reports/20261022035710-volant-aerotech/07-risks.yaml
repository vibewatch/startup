    columns: [Failure mode, Likelihood, Severity, Mitigation maturity, Residual exposure, Unresolved gap]
    rows:
      - ["Certification-to-production transition slips", "High", "High", "Partial; funding is reported for testing and certification", "High", "No public integrated schedule for tooling, quality systems, production certificate, and delivery"]
      - ["Airspace, route, or incident-management integration failure", "Medium", "High", "Developing at sector level", "Medium-high", "No Volant-specific route authorization, dispatch, or incident metrics disclosed"]
      - ["Supply-chain or manufacturing bottleneck", "Medium", "High", "Unknown; strategic investor and partner claims are not an audited supplier map", "High", "Identify sole-source parts, lead times, qualification status, and dual-sourcing plans"]
      - ["Customer concentration or order-book conversion weakness", "Medium", "High", "Partial; media reports orders and deposits but not contract-level terms", "High", "Reconcile each order to signed contract, deposit, cancellation rights, delivery milestone, and payer"]
    notes: "No assigned source provides a Volant-specific security incident or quality audit; absence of such disclosure is recorded as a gap, not as evidence that no incident exists."
    claimRefs: [CR003, CR004, CR008, CR011, CR014]
  - id: TR003
    title: Partner, dependency, and financial risk register
    columns: [Dependency, Counterparty or system, Failure scenario, Severity, Mitigation, Residual exposure]
    rows:
      - ["External capital and follow-on financing", "Investors and capital markets", "Funding cannot bridge certification, tooling, and early production", "Critical", "Recent large rounds are reported; runway and committed capital remain undisclosed", "High"]
      - ["Civil-aviation and low-altitude infrastructure", "CAAC, local authorities, flight-service systems", "Approvals, corridors, or vertiports lag aircraft readiness", "High", "National safety department and digital authorization platform are developing", "Medium-high"]
      - ["Aircraft and component supply chain", "Industrial and manufacturing partners", "Single-source or qualification delay interrupts delivery", "High", "Strategic ecosystem investors may help, but supplier dependencies are not disclosed", "High"]
      - ["Customer and leasing counterparties", "Reported domestic and overseas buyers", "Orders are delayed, cancelled, or not converted into cash receipts", "High", "Reported non-refundable deposits could improve commitment, but terms are not independently verified", "High"]
    notes: "Partner names and dependency terms are incomplete in public evidence; funding raised is not treated as cash available and order value is not treated as revenue."
    claimRefs: [CR003, CR004, CR011, CR012, CR013, CR014]
