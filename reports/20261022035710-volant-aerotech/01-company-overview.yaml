company:
  name: Volant Aerotech
chapter:
  number: 1
  title: Company Overview
  summary: Volant Aerotech is a Shanghai-based passenger-eVTOL developer founded in 2021 and pursuing VE25-100 certification, manufacturing scale-up, and operator partnerships. Current evidence shows unusually large disclosed financing and order claims, but the company remains dependent on certification, production execution, and conversion of stated orders into binding deliveries.
sections:
  - id: identity-and-product
    title: Identity, product, and certification path
    body: >-
      Volant Aerotech is described in the assigned evidence as a Shanghai-based
      developer of electric vertical take-off and landing aircraft, founded in
      2021. Its flagship VE25-100 is described as a passenger aircraft seating
      up to six people, carrying 500 kg, and using eight electric motors over a
      stated 200 km to 400 km range. The company says its aircraft can serve
      passenger transport, sightseeing, emergency rescue, and aerial logistics,
      but those use cases remain a product and commercialization thesis rather
      than demonstrated recurring revenue. The certification path is central:
      the company says its type-certificate application was accepted by the CAAC
      East China Regional Administration in September 2023, while its own
      April 2026 release projected airworthiness certification in the first half
      of 2027. A later company release describes the AC101 development aircraft,
      a 2025 piloted flight, and an AC102 airworthiness-standard aircraft that
      had completed maiden and full-transition flights by August 2026. These
      milestones indicate progress, not a completed type certificate or revenue
      service. The revised Chinese aviation-law explainer says commercial
      manned and unmanned aircraft require design, production, and operator
      approvals, reinforcing that certification and operational permissions are
      gating dependencies.
    claimRefs: [CO001, CO002, CO003, CO004, CO005]
    tableRefs: [TO001]
    figureRefs: [FO001]
  - id: capital-and-commercialization
    title: Capital, investors, and commercial traction
    body: >-
      The financing picture is strong but not fully transparent. Volant's April
      2026 company release announced a $300 million Series C led by Stone, with
      HSG and Fortera Capital participating and Future Capital and Legend Capital
      increasing stakes. The same release says the capital is intended for VE25-
      100 airworthiness certification, scaled delivery, and global expansion.
      Independent coverage in The Insight Asia reported nearly RMB1 billion
      ($148 million) in a C+ round, taking reported cumulative funding past RMB5
      billion across 13 rounds; it also identified China Life Sci-Tech Fund,
      Shanghai Minhang Jintou, Nio Capital, CCT Stone, and CIIF as participants.
      The two accounts are directionally consistent on rapid, substantial
      financing but are not a substitute for audited cash, burn, runway, or
      cap-table evidence. Volant's release claims more than 1,900 aircraft
      orders worth more than RMB47.5 billion and nearly RMB100 million in
      advanced payments, while the independent account cautions that firm
      commitments may be only a fraction of the broader order and letter-of-
      intent figure. The October 2026 Sichuan Airlines Low Altitude agreement
      is more specific: 50 aircraft, of which 20 are described as firm orders,
      alongside joint testing and pilot operations before type certification.
      This is meaningful commercial validation, but delivery timing, customer-
      level deposits, cancellation terms, and revenue recognition remain
      undisclosed.
    claimRefs: [CO006, CO007, CO008, CO009, CO010]
    tableRefs: [TO002, TO003]
  - id: governance-and-diligence
    title: Leadership, governance, and unresolved execution risk
    body: >-
      Public evidence identifies Dong Ming as founder and chief executive and
      describes him as a 20-year aviation veteran who worked on the C919 and at
      GE. The sources do not provide a complete executive roster, board
      composition, founder ownership, liquidation preferences, or documented
      succession plan. That disclosure gap matters because the company is
      attempting a long-cycle, safety-critical transition from prototype and
      flight testing to type certification, production approval, operator
      permissions, and commercial service. Its investor base includes state-
      linked and strategic capital, which may support regional deployment and
      regulatory relationships, but the available evidence does not establish
      control rights or governance depth. The sector context is simultaneously
      supportive and demanding: Global Times reports that CAAC created a
      dedicated low-altitude safety department, while the regulatory explainer
      emphasizes aircraft approvals, insurance, passenger protection, and
      statutory liability. The market research source describes certification
      timelines, airspace reform, commercial-model closure, and capital-market
      risk as core industry risks, and records bankruptcies of Lilium and
      Volocopter as a caution that substantial funding does not guarantee
      commercialization. For Volant, the key diligence asks are a regulator-
      verified certification schedule, customer-by-customer order contracts,
      cash and cap-table disclosure, production readiness, and evidence that
      advanced payments are refundable or otherwise contractually protected.
    claimRefs: [CO011, CO012, CO013, CO014, CO015]
  - id: milestones-and-open-questions
    title: Milestones and evidence boundaries
    body: >-
      The evidence supports a milestone sequence from founding and early
      technical development through financing, flight testing, certification
      preparation, and a more specific airline-linked order. It does not support
      a completed type certificate, serial deliveries, recognized revenue,
      positive unit economics, or a verified valuation for this run. Hurun's
      2026 unicorn index establishes that its universe consists of private
      startups valued at least $1 billion as of a 1 January 2026 cut-off, but
      the assigned excerpt does not identify Volant by name; it therefore cannot
      be used here to assert a current valuation. Similarly, competitor filings
      and market-cap data demonstrate the capital intensity and volatility of
      the eVTOL category, not Volant's own financial performance. The timeline
      below records dated claims and external context without converting
      projections into achievements. The principal open questions are whether
      the VE25-100 receives certification on the stated schedule, whether the
      1,900-aircraft headline backlog converts into binding contracts and
      deliveries, and how much of the recent financing remains available after
      certification and manufacturing expenditure.
    claimRefs: [CO016]

