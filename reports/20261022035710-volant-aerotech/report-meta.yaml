  foundingLocation: Shanghai, China
  headquarters: Shanghai, China
  productSummary: >-
    Six-seat VE25-100 passenger eVTOL aircraft with reported 500 kg payload, eight electric motors, and a stated 200 km
    to 400 km range, supported by certification, manufacturing, and operator-enablement activities.
  customerFocus: >-
