companyProfile:
  summary: >-
    Volant Aerotech is a Shanghai-based passenger-eVTOL developer founded in 2021. Its VE25-100 program combines
    aircraft development with certification, production scale-up, and future operator deployment. Current evidence
    indicates substantial financing access, flight-test progress, and named customer or partner interest, while the
    company remains pre-commercial in the available public record and dependent on certification, manufacturing
    execution, and contract conversion.
  founders:
