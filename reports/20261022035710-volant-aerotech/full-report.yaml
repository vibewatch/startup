  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Volant presents the VE25-100 as its first product and as the aircraft at the center of a broader
              advanced-air-mobility service. Company-issued material describes a cabin for one pilot and five
              passengers, a maximum cruise speed of 235 km/h, and a 200-400 km range; these are design claims, not
              independently demonstrated operating results. The same release says the cabin can switch among passenger,
              emergency-rescue, and cargo configurations and maps those configurations to six travel scenarios. That
              breadth creates optionality, but each mission changes payload, interior, dispatch, ground-handling, and
              certification requirements. Diligence should therefore treat the current product as one aircraft platform
              with multiple claimed missions, rather than six validated products or production-ready services.
            claimRefs:
              - CE001
              - CE004
              - CE005
              - CE009
          - type: table
            tableRef: TE001
            claimRefs:
