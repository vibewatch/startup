      - number: '4.2'
        title: Cost structure and operating economics
        blocks:
          - type: paragraph
            body: >-
              The economics are dominated by certification, aircraft development, production scale-up, and future
              operating infrastructure. PanDaily gives a company-reported estimate of $8.3 per seat for a 20-kilometre,
              five-minute flight, but that is an operating-cost estimate for a specified flight and not a realized fare,
              contribution margin, or company gross margin. The aircraft's eight electric motors, 2.5-tonne maximum
              takeoff weight, and 200–400 kilometre range imply meaningful engineering and maintenance requirements,
              while the revised Civil Aviation Law source identifies type, production, operator, insurance, and
              passenger-protection obligations before commercial service. The law also describes a 20-times difference
              between public-air transport and general-aviation capital thresholds, showing that route and operating
              model selection can change the capital burden. No public source supplies Volant's bill of materials, labor
              content, maintenance reserve, insurance quote, utilization, CAC, payback, or gross margin.
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
              - CI010
          - type: table
