      - number: '3.3'
        title: Pricing, distribution, switching, and partner power
        blocks:
          - type: paragraph
            body: >-
              Comparable list pricing is the largest public-data gap. The retained evidence gives an EHang aircraft
              price and tourist-ticket example, but it does not disclose comparable Volant aircraft pricing, deposits by
              customer, cancellation terms, Joby launch fares, or realized discounts. Distribution therefore matters
              more than nominal specifications: Joby is building direct and affiliate operations plus aircraft sales,
              Volant appears oriented toward B2B aircraft sales and operator partnerships, and EHang has accumulated
              operating credentials for a short-range autonomous product. Buyers can multi-home before certification by
              signing non-exclusive letters of intent with several OEMs; switching costs should rise only after
              deposits, pilot and maintenance training, route approvals, charging infrastructure, spares, and
              fleet-management systems become specific to one platform. Vertiport, regulator, insurer, and operator
              access can consequently hold as much distribution power as the airframe OEM.
            claimRefs:
              - CP002
              - CP007
              - CP009
              - CP013
              - CP014
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP007
              - CP009
              - CP010
              - CP014
              - CP015
      - number: '3.4'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Volant's potential moat is a coordinated certification-and-industrialization system, not a single
              disclosed specification. A six-seat tiltrotor can be valuable if it certifies on schedule, reaches
              repeatable production, and gives operators better route economics than shorter-range aircraft or
              helicopters. The public record does not yet prove those outcomes. Joby's decade of vertically integrated
              development, EHang's operating approvals, AutoFlight's cargo certification, and Aerofugia's reported order
              base each attack a different layer of the stack. The bankruptcies of Lilium and Volocopter are
              disconfirming evidence that large capital commitments do not ensure certification or commercial survival.
              Volant's backlog and funding improve option value, but durability depends on converting non-binding demand
              into deposits, certified deliveries, safe operating history, service support, and repeat route economics
              before incumbents lock up scarce infrastructure and regulatory capacity.
            claimRefs:
              - CP002
              - CP003
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Order volume is not contractual quality
            body: >-
              The retained reporting combines confirmed orders and letters of intent, while explicitly cautioning that
              firm commitments may be only a fraction. Underwriting should require a customer-level schedule of
              deposits, cancellation rights, milestones, delivery slots, and refundability before treating the backlog
              as competitive lock-in.
            calloutType: risk
            claimRefs:
              - CP002
          - type: callout
            title: Certification creates a temporary moat, not a complete one
            body: >-
              A certificate can constrain entry, but commercial advantage also requires production quality, route
              approvals, insurance, infrastructure, service support, and utilization. Competitors can lead on different
              layers, so Volant must prove the full system.
            calloutType: insight
            claimRefs:
              - CP008
              - CP009
              - CP013
              - CP016
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization
        blocks:
          - type: paragraph
            body: >-
              Volant's apparent monetization path is aircraft manufacturing and related service support, with customer
              activity beginning as orders, letters of intent, and deposits and only becoming revenue after
              certification, production, acceptance, and delivery. The reported order book is therefore a pipeline
              indicator rather than recognized revenue. PanDaily reports more than 1,900 orders valued at $66 billion
              and a first confirmed China Southern Airlines General Aviation order, while The Insight Asia distinguishes
              the broader orders and letters of intent from firm commitments and reports nearly RMB100 million of
              deposits. Those qualifications materially reduce the evidentiary value of gross order value for
              forecasting. EquityZen describes Volant as a private passenger-eVTOL R&D, manufacturing, and service
              company, but its public page does not disclose revenue or realized transaction prices. Public evidence
              consequently supports a hardware-plus-service model, not an ARR or current revenue estimate.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
          - type: table
            tableRef: TI001
            claimRefs:
