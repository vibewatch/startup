chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product, and certification path
        blocks:
          - type: paragraph
            body: >-
              Volant Aerotech is described in the assigned evidence as a Shanghai-based developer of electric vertical
              take-off and landing aircraft, founded in 2021. Its flagship VE25-100 is described as a passenger aircraft
              seating up to six people, carrying 500 kg, and using eight electric motors over a stated 200 km to 400 km
              range. The company says its aircraft can serve passenger transport, sightseeing, emergency rescue, and
              aerial logistics, but those use cases remain a product and commercialization thesis rather than
              demonstrated recurring revenue. The certification path is central: the company says its type-certificate
              application was accepted by the CAAC East China Regional Administration in September 2023, while its own
              April 2026 release projected airworthiness certification in the first half of 2027. A later company
              release describes the AC101 development aircraft, a 2025 piloted flight, and an AC102
              airworthiness-standard aircraft that had completed maiden and full-transition flights by August 2026.
              These milestones indicate progress, not a completed type certificate or revenue service. The revised
              Chinese aviation-law explainer says commercial manned and unmanned aircraft require design, production,
              and operator approvals, reinforcing that certification and operational permissions are gating
              dependencies.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
