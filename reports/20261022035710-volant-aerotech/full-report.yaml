  - id: FE001
    title: VE25-100 product and operating stack
    type: stack
    summary: >-
      The disclosed aircraft sits inside a larger certification, infrastructure, and operating system whose interfaces
      remain material diligence gaps.
    data:
      layers:
        - label: Customer missions
          detail: >-
            Passenger, sightseeing, private travel, emergency rescue, and cargo scenarios are company-described use
            cases.
          items:
            - label: Passenger mobility
              detail: One pilot and up to five passengers.
            - label: Rescue and cargo
              detail: Reconfigurable cabin claims require mission-specific validation.
        - label: Cabin and airframe
          detail: The physical platform must reconcile comfort, payload, range, and certified structural limits.
          items:
            - label: Reconfigurable cabin
              detail: Passenger, stretcher, and container layouts.
            - label: Structure and aerodynamics
              detail: Public subsystem categories lack certified performance detail.
        - label: Flight controls
          detail: Simplified Vehicle Operations is the disclosed pilot-interface concept.
          items:
            - label: Control laws
              detail: Development and validation are claimed, but assurance artifacts are not public.
            - label: Sensors and actuation
              detail: Redundancy segregation and failure probabilities remain undisclosed.
        - label: Propulsion and energy
          detail: Eight electric motors and multi-redundant propulsion are company claims.
          items:
            - label: Electric propulsion
              detail: Motor, controller, and propulsor qualification are not independently evidenced.
            - label: Battery and thermal system
              detail: Chemistry, reserve policy, life, and supplier ownership are open.
        - label: Certification and production
          detail: Type certification precedes production conformity and commercial operation.
          items:
            - label: Airworthiness evidence
              detail: Current phase, findings, and conformity status require regulator-facing proof.
            - label: Industrial system
              detail: Quality, supplier, tooling, and repeatability evidence is unavailable.
        - label: Operations and infrastructure
          detail: Commercial service also depends on operators, maintenance, training, airspace, and ground infrastructure.
          items:
            - label: Route operations
              detail: Air traffic management, pilots, approvals, and dispatch processes.
            - label: Ground network
              detail: Vertiports, charging, maintenance, and passenger handling.
    approximationNotes: Conceptual stack only; layer order does not represent technical hierarchy, readiness, ownership, or cost share.
    claimRefs:
      - CE001
      - CE002
      - CE005
      - CE006
      - CE012
      - CE013
      - CE015
  - id: FU001
    title: Evidence-gated customer journey from interest to expansion
    type: journey-map
    summary: >-
      Public proof is strongest at agreement formation and weakens after certification, where delivery, operations,
      renewal, and expansion evidence are absent.
    data:
      items:
        - label: Use-case interest
          detail: >-
            Operators, lessors, and destination developers identify passenger, tourism, regional transport, and
            emergency-service missions.
          status: evidenced
          touchpoints:
            - Trade reporting
            - Named agreement announcements
        - label: Commercial agreement
          detail: >-
            Public disclosures distinguish some confirmed orders from a larger pool that includes intention orders and
            letters of intent.
          status: evidenced-with-qualification
          touchpoints:
            - Order announcement
            - Counterparty disclosure
        - label: Financing and channel setup
          detail: >-
            Lessors and infrastructure partners can place aircraft with operators, but lessees, recourse, and route
            economics are not public.
          status: partial
          touchpoints:
            - Lease structure
            - Infrastructure partnership
        - label: Certification
          detail: >-
            The VE25-100 type-certificate application remained under review in the 2026 evidence, making certification a
            prerequisite to delivery.
          status: pending
          touchpoints:
            - Type certification
            - Operating approval
        - label: Delivery and operations
          detail: >-
            No assigned source documents delivered Volant aircraft, active passenger service, utilization, or customer
            revenue.
          status: evidence-gap
          touchpoints:
            - Delivery acceptance
            - Route launch
            - Utilization
        - label: Renewal and expansion
          detail: Repeat orders, renewals, churn, and fleet expansion by an operating customer are not publicly documented.
          status: evidence-gap
          touchpoints:
            - Renewal
            - Repeat deployment
            - Passenger demand
    approximationNotes: >-
      Ordered stages describe evidence maturity rather than a measured conversion funnel; no rates, stage populations,
