              - CE009
              - CE010
              - CE011
          - type: table
            tableRef: TE002
            claimRefs:
              - CE004
              - CE005
      - number: '5.2'
        title: Disclosed architecture and differentiation
        blocks:
          - type: paragraph
            body: >-
              The public architecture is specific at the subsystem-category level but shallow below it. Volant says the
              aircraft uses eight electric motors and a multi-redundant propulsion system, while its Simplified Vehicle
              Operations control concept is intended to let a pilot manage the flight state through one set of inputs. A
              company release also lists airframe structures, aerodynamics, control laws, redundant systems, electric
              propulsion, and energy-system thermal design among its capabilities. Those disclosures indicate the
              intended engineering scope, but they do not reveal battery chemistry, supplier allocation,
              software-development assurance, redundancy segregation, failure probabilities, maintainability data, or
              ownership of critical intellectual property. Sector evidence further shows that the delivered system
              extends beyond the aircraft to air-traffic management, communications, operating software, charging,
              landing infrastructure, and maintenance.
            claimRefs:
              - CE002
              - CE006
              - CE007
              - CE012
              - CE013
          - type: table
            tableRef: TE003
            claimRefs:
              - CE002
              - CE006
              - CE007
              - CE012
              - CE013
              - CE014
              - CE015
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE002
              - CE005
              - CE006
              - CE012
              - CE013
              - CE015
      - number: '5.3'
        title: Maturity, certification, and deployment
        blocks:
          - type: paragraph
            body: >-
              The evidence places VE25-100 in certification and flight-test development, not in certified commercial
              service. Volant's 2024 release says the type certification process began in September 2023 and reached an
              initial review meeting on October 23, 2024. A later third-party account repeats the September 2023
              acceptance and reports an October 2025 manned test flight; it also attributes a 2027 type-certificate
              expectation to founder Dong Ming. That expectation is management guidance relayed by a third party, not a
              regulator commitment. An industry report describes CAAC eVTOL certification as a five-phase, multi-year
              process and warns that international mutual recognition is not established. The investable milestone is
              therefore not the date target alone, but closure of regulator findings, conformity evidence, production
              certification, operator approvals, and repeatable aircraft support.
            claimRefs:
              - CE008
              - CE010
              - CE011
              - CE014
      - number: '5.4'
        title: Safety, reliability, and technical-risk verdict
        blocks:
          - type: paragraph
            body: >-
              Volant says it has completed single-rotor-failure, emergency-landing, piloted-maiden-flight, and
              piloted-transition-flight scenarios. These are useful development signals, but the assigned evidence
              contains no regulator report, test protocol, fleet-hour denominator, incident log, reliability
              distribution, or independent performance benchmark with which to validate the company's broader safety and
              maintainability conclusions. A public peer filing illustrates the larger operating system that commercial
              eVTOL service requires: safety management spanning design, manufacturing, flight operations, maintenance,
              and training. Volant's fetched official news page exposed only a contact form rather than a usable
              technical archive, and the assigned pool contained no developer or practitioner-community signal. The
              product thesis is technically plausible but remains evidence-constrained; certification progress,
              assurance artifacts, supplier qualification, production conformity, and in-service support data are the
              decisive diligence items.
            claimRefs:
              - CE003
              - CE015
              - CE016
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The evidence does not support a certified-product conclusion
            body: >-
              Flight-test milestones and a certification target are not substitutes for regulator findings closure,
              conforming-aircraft evidence, production approval, reliability denominators, or an operating certificate.
            calloutType: risk
            claimRefs:
              - CE003
              - CE008
              - CE010
              - CE011
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Demand is named, but still pre-delivery
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports real counterparty engagement rather than an anonymous order-book claim. Reporting
              identifies China Southern General Aviation and Asian Express as confirmed-order counterparties, while
              company-originated chronology names ABC Finance Leasing, Bank of China Financial Leasing, Pan Pacific, and
              several general-aviation operators. The evidence nevertheless describes orders, intended purchases, and
              memoranda; it does not establish aircraft deliveries, passenger operations, utilization, or repeat
              purchases. Certification remains a gating dependency, so this chapter treats the pipeline as pre-revenue
              demand validation rather than active customer adoption. This distinction is material because an aircraft
              buyer can sign before final specifications, financing, certification, delivery slots, and operating
              approvals are settled.
            claimRefs:
              - CU002
              - CU004
              - CU005
              - CU006
              - CU007
              - CU008
              - CU012
          - type: table
            tableRef: TU003
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU005
              - CU006
              - CU007
              - CU008
              - CU012
      - number: '6.2'
        title: Buyer mix broadens access and execution risk
        blocks:
          - type: paragraph
            body: >-
              The disclosed buyer set spans airlines and general-aviation operators, financial lessors, and a
              property-and-infrastructure developer. That mix gives Volant more than one route to market: direct
              operator sales, leasing-led fleet placement, and destination-led deployment. It also means the end user
              and economic payer are often not the same party. Lessors may finance aircraft used by an operator; Pan
              Pacific may sponsor assets whose ultimate operators and passengers are not identified; and emergency or
              tourism use cases may depend on local authorities, infrastructure, and route approvals. The public record
              does not disclose pricing, deposits, financing recourse, or who bears utilization risk, preventing a
              revenue-quality comparison across these customer segments.
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU005
              - CU006
              - CU007
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU006
              - CU007
              - CU008
      - number: '6.3'
        title: Order-book growth outpaces proof of adoption
        blocks:
          - type: paragraph
            body: >-
              The announced pipeline rose from more than 700 aircraft worth CNY15 billion in 2024 to a company-reported
              1,900 aircraft worth more than CNY47.5 billion in 2026. These figures are not a conventional sales funnel:
              the vintages, contract categories, cancellation rights, and inclusion rules are not disclosed, and an
              independent analyst assessed that the vast majority of the later total was probably letters of intent
              without firm commitment. Volant also does not publish customer revenue, delivered units, active fleet, or
              utilization. Consequently, the trajectory demonstrates growing commercial interest but cannot support a
              conversion rate, revenue forecast, or retention conclusion. Production deployment should be credited only
              after certification, delivery, and operator evidence appear.
            claimRefs:
              - CU001
              - CU008
              - CU009
              - CU011
              - CU012
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU008
              - CU009
      - number: '6.4'
        title: Durability and concentration remain untested
        blocks:
          - type: paragraph
            body: >-
              Pan Pacific's 500-aircraft intent represents roughly 26% of the separately reported 1,900-aircraft
              potential pipeline if both disclosures use comparable inclusion rules. That conditional ratio is a
              screening indicator, not a verified concentration metric. No public source in the assigned evidence
              discloses NRR, GRR, churn, renewals, cancellation rates, backlog aging, customer deposits, or top-customer
              revenue. The appropriate expansion lens is therefore operational: certification, financing, route
              integration, delivery, and repeat deployment. Competitor evidence shows that customer access can be
              strengthened through booking-platform integration and extensive flight proof, while industry analysis
              cautions that passenger urban air mobility remains visible but low-volume. Volant has not yet published
              equivalent evidence tying its named agreements to recurring passenger demand.
            claimRefs:
              - CU010
              - CU013
              - CU014
              - CU015
              - CU016
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU011
              - CU012
              - CU013
              - CU014
              - CU015
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Order book is not the same as customer adoption
            body: >-
              Treat the CNY47.5 billion potential pipeline as commercial interest until management provides
              customer-level contract type, deposits, cancellation rights, certification conditions, delivery schedules,
              and evidence of active operations.
            calloutType: risk
            claimRefs:
              - CU009
              - CU011
              - CU012
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk assessment
        blocks:
          - type: paragraph
            body: >-
              Volant is pursuing a safety-critical aircraft program in a market moving from prototypes to regulated
              operations. The strongest public evidence is directional rather than company-specific: Xinhua reports that
              the Civil Aviation Administration of China created a low-altitude safety department responsible for
              development planning, safety coordination, and flight-service systems, while a 2026 industry account
              describes a unified authorization platform with interfaces for flight plans, alarms, and incident
              handling. Those developments can reduce process fragmentation, but they also raise the standard for
              traceable compliance. Public reporting describes a target of 2027 certification and delivery and a large
              order book, yet the assigned evidence does not disclose regulator findings, open certification issues,
              aircraft reliability statistics, cash runway, or binding customer deposits in a way that can be
              independently audited. Certification and safety therefore rank above capital intensity, operational
              integration, and order-book conversion. The risk posture is high until the company provides
              regulator-facing milestones, test-hour and incident data, and a financing plan that covers the path to
              certification and production.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR006
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR007
              - CR008
              - CR009
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR006
              - CR008
              - CR014
              - CR015
              - CR016
              - CR017
              - CR018
      - number: '7.2'
        title: Regulatory, safety, and operating exposure
        blocks:
          - type: paragraph
            body: >-
              The regulatory environment is becoming more organized, not simpler. Xinhua says the CAAC department will
              coordinate low-altitude safety and build flight-service dispatch and station systems. The industry source
              reports a September 2025 national-provincial-municipal platform covering airspace management, flight
              plans, alarms, and incident handling, and it describes a transition from local rulebooks toward a digital
              authorization pipeline. For Volant, this creates an opportunity to scale only if its aircraft, operators,
              routes, vertiports, and emergency procedures fit the evolving stack. Cross-border and mixed-jurisdiction
              operations add further uncertainty: the same source identifies separate Shenzhen and Hong Kong air-traffic
              authorities, and says altitude deconfliction, radio coordination, synchronized surveillance data, and
              mutual emergency response would all be required for a cross-border service. These are market-level
              observations, not proof of a Volant failure; they define the integration work and kill criteria that
              diligence should test.
            claimRefs:
              - CR001
              - CR007
              - CR008
              - CR009
          - type: table
            tableRef: TR002
            claimRefs:
              - CR003
              - CR004
              - CR008
              - CR011
              - CR014
      - number: '7.3'
        title: Capital, partner, and commercialization dependencies
        blocks:
          - type: paragraph
            body: >-
              The financing and commercialization model remains exposed to a long conversion cycle. China Business
              Insider describes a nearly US$138.8 million Series C+ shortly after a reported US$300 million Series C,
              and says the capital is intended to fund test flights and airworthiness certification. The same account
              describes an order book of more than 1,900 aircraft and nearly RMB100 million in non-refundable deposits,
              but it is a media account rather than audited financial disclosure; the figures should not be treated as
              revenue, cash available, or proof that every order is binding. Reuters' report on Volocopter provides a
              relevant independent stress case: the competitor filed for insolvency after being unable to raise funds to
              maintain regular operations, and Reuters characterizes the eVTOL industry as facing a financial crunch
              because operations are capital-intensive. Volant therefore needs evidence of monthly burn, committed
              financing, cap-table protections, supplier terms, customer payment schedules, and production economics
              before the public funding narrative can support a lower residual risk.
            claimRefs:
              - CR003
              - CR004
              - CR011
              - CR012
              - CR013
              - CR014
      - number: '7.4'
        title: Monitoring indicators and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The practical monitoring plan should focus on milestones that are observable before a failure becomes
              irreversible. Regulatory indicators include publication of a Volant-specific type-certificate milestone
              plan, closure of regulator findings, and evidence that production and operating approvals follow the
              aircraft certificate. Operating indicators include test hours, abnormal-event and incident rates, dispatch
              reliability, emergency-drill performance, and route-level approvals. Commercial indicators include signed
              contracts distinguished from letters of intent, deposits received and refundable status, customer delivery
              dates, cancellation activity, and the proportion of orders dependent on public subsidy or partner
              financing. Financial indicators include unrestricted cash, monthly burn, committed capital, tooling and
              facility capex, gross-margin assumptions, and supplier concentration. A thesis break would be a missed
              certification milestone without a credible recovery plan, a material safety event or unresolved regulator
              finding, a funding gap that leaves less than the remaining certification-and-production runway, or a sharp
              deterioration in binding orders and deposits. These criteria are intentionally measurable; the assigned
              public sources do not establish that any has already occurred.
            claimRefs:
              - CR015
              - CR016
              - CR017
              - CR018
          - type: table
            tableRef: TR003
            claimRefs:
              - CR003
              - CR004
              - CR011
              - CR012
              - CR013
              - CR014
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Thesis-break trigger
            body: >-
              Treat a missed certification milestone, a material safety event, an unresolved regulator finding, or a
              financing gap that cannot fund the remaining certification-and-production path as a thesis-break event
              until management supplies independently verifiable remediation evidence.
            calloutType: risk
            claimRefs:
              - CR015
              - CR016
              - CR017
              - CR018
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              Volant's investable thesis is that repeated institutional financing, a reported Series C+ round of nearly
              RMB 1 billion, and reported domestic and international demand provide a credible route to commercial
              scale. The latest financing account says proceeds are intended for flight testing, airworthiness
              certification, and industrial-chain integration, while a separate report describes a target of
              certification and commercial deliveries by 2027. The anti-thesis is that these are still capital-intensive
              pre-commercial milestones: the public record does not show realized revenue, customer deposits,
              contribution margin, cash runway, or the contractual status of most reported orders. The comparable
              distress of Volocopter and Lilium shows that financing access and headline order pipelines do not by
              themselves secure continuity.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV009
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
              - CV010
              - CV011
              - CV012
              - CV013
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV004
              - CV005
              - CV008
              - CV009
              - CV015
      - number: '8.2'
        title: Financing context and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The disclosed financing evidence is meaningful but not a valuation mark. EQS reports nearly RMB 1 billion
              in the C+ round and more than RMB 5 billion across 13 rounds over five years; Sina separately reports a
              recent C round of about US$300 million and describes the company as having raised more than RMB 5 billion
              cumulatively. These figures are issuer or media accounts of capital raised, not cash currently available
              and not ARR or revenue. No assigned source discloses the post-money valuation, share price, liquidation
              preferences, debt, option pool, founder ownership, or investor return hurdle. Entry discipline should
              therefore require a verified cap table and financing documents before accepting a unicorn-level price.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV010
              - CV011
              - CV012
              - CV014
              - CV015
      - number: '8.3'
        title: Scenarios and comparable evidence
        blocks:
          - type: paragraph
            body: >-
              The bull case assumes certification, commercial deliveries, and conversion of a portion of the reported
              order pipeline into binding contracts and deposits. The base case assumes certification progress but
              slower fleet deployment and continued external financing. The bear case assumes certification or
              commercialization slippage while the business remains dependent on repeated capital raises. Public
              comparables illustrate the financing and execution risk rather than supplying a direct multiple: BETA
              describes a backlog of more than 800 aircraft and several funding sources, while Reuters reports that
              Volocopter entered insolvency after failing to raise funds; Aerotime reports Lilium stopped operations
              after financing failed to materialize. These are not directly comparable valuation benchmarks.
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV013
      - number: '8.4'
        title: Recommendation and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The recommendation is research-more with low-to-medium confidence in the valuation call: the company has
              strong financing momentum and a plausible certification path, but public evidence is insufficient to
              distinguish a durable order book from conditional intent agreements or to test the current price against
              operating economics. A thesis upgrade requires audited or management-certified cash, burn, runway,
              customer deposits, delivery milestones, and the latest financing valuation and preferences. Thesis-break
              triggers are a missed certification milestone, inability to finance the next test phase, material order
              cancellations, or evidence that the reported financing was not available for core aircraft development.
              The monitoring plan should separate signed contracts from LOIs, options, and MOUs.
            claimRefs:
              - CV014
              - CV015
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price-sensitive conclusion
            body: >-
              Research more: treat financing raised and reported order value as distinct from cash available and
              realized revenue, and require the latest valuation, cap table, preferences, runway, customer deposits, and
              certification evidence before entry.
            calloutType: recommendation
            claimRefs:
              - CV006
              - CV008
              - CV009
              - CV014
              - CV015
