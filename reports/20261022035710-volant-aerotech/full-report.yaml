  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks and probability signal
    rows:
      - - Bull
        - >-
          Certification is achieved on the reported timetable; a meaningful share of reported orders becomes binding and
          generates deposits.
        - Potential for a premium growth valuation, but no public multiple or current price is available.
        - High execution and financing risk; low probability signal until contracts and cash are verified.
      - - Base
        - Certification progresses with delays; deliveries remain limited and additional financing is required.
        - >-
          Value should be anchored to funded milestones and dilution-adjusted ownership rather than order headline
          value.
        - Moderate probability signal; runway and preferences are unknown.
      - - Bear
        - Certification or commercialization slips and financing access tightens.
        - >-
          Downside includes dilution, preference overhang, or impaired continuity; no defensible numeric downside is
          public.
        - Material probability signal given peer funding failures.
      - - Trigger
        - Missed certification milestone, order cancellations, or inability to fund flight testing.
        - Re-underwrite at a lower price or pause investment pending verified financing.
        - Thesis-break condition requiring immediate review.
    notes: >-
      These are qualitative scenarios, not price targets. No assigned source supports a numeric valuation range, return
      target, or probability estimate.
    claimRefs:
      - CV003
      - CV004
      - CV005
      - CV010
      - CV011
      - CV012
      - CV014
      - CV015
