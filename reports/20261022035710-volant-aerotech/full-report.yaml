  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The relevant market is the low-altitude economy, with Volant's addressable slice concentrated in passenger
              eVTOL airframes and the certification, manufacturing, operator, and infrastructure services needed to
              deploy them. The boundary should not be equated with every low-altitude activity: general aviation,
              industrial drones, logistics drones, vertiports, air-traffic management, maintenance, training, insurance,
              and route operations are adjacent layers with different buyers and economics. The Tianxia Gongchang report
              describes the sector as including aircraft manufacturing, flight operations, landing infrastructure,
              air-traffic management, aviation materials, and value-added services; it gives a 2024 low-altitude-economy
              baseline of approximately RMB 670.25 billion, while separately describing China eVTOL at approximately RMB
              3.2 billion in 2024 and more than RMB 9.5 billion projected for 2026. Those figures are not
              interchangeable: the former is a broad ecosystem estimate and the latter a narrower aircraft segment
              estimate. The practical substitutes for a passenger eVTOL trip are helicopters, fixed-wing regional
              aviation, rail or road, and simply retaining the existing ground commute; for cargo or emergency use,
              drones and conventional logistics remain relevant substitutes.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: Sizing lenses and adoption timing
        blocks:
          - type: paragraph
            body: >-
              A defensible sizing view needs multiple lenses. The broadest lens is the China low-altitude economy, where
              public estimates in the assigned research range from approximately RMB 670.25 billion in 2024 to forecasts
              of RMB 800 billion to RMB 1.5 trillion in 2025 and a CAAC-reported forecast above RMB 3.5 trillion by
              2035. These estimates differ in year, scope, and methodology, so they should not be treated as a single
              TAM curve. A narrower eVTOL lens is more relevant to Volant but still does not isolate passenger
              lift-cruise or tiltrotor aircraft from cargo, autonomous aircraft, and services. The company-specific
              bottom-up opportunity is also constrained by certification and operations: eVTOL.news records Volant's
              planned commercial test runs as conditional on successful certification, while Global Times reports that
              industry participants expect many certification and R&D programs to complete in 2026–2027, trial routes in
              2027–2030, and broad regular service after 2030. This timing makes the near-term opportunity more
              dependent on certification capacity, routes, and infrastructure than on headline market size.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM009
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM006
              - CM007
      - number: '2.3'
        title: Buyer map, drivers, and constraints
        blocks:
          - type: paragraph
            body: >-
              The buyer chain is multi-sided. An aircraft buyer or fleet owner is not necessarily the end user:
              airlines, general-aviation operators, leasing companies, tourism operators, emergency agencies, and
              logistics providers can own or operate aircraft, while passengers, cargo shippers, municipalities, and
              public-safety agencies create demand. Volant's public material describes a five-seat demonstrator intended
              for advanced aerial mobility, medevac, and air cargo; the later company-linked reporting describes a
              six-seat VE25-100, a distinction that should be resolved before using capacity in a financial model.
              Drivers include policy-backed airspace development, lower direct emissions, vertical takeoff, and
              potential route-time savings. Constraints include type certification, airspace and route approvals,
              vertiport and charging build-out, pilot and maintenance availability, insurance, battery range, public
              trust, and the economics of utilization. Joby's 2025 annual report, issued by a competitor rather than an
              independent benchmark, warns that the UAM market is not precisely established and that customers may not
              adopt the service or pay projected prices. Public market data for Joby illustrates valuation volatility in
              a comparable eVTOL company, but does not establish Volant's value or operating economics.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM010
              - CM011
              - CM012
      - number: '2.4'
        title: Market diligence implications
        blocks:
          - type: paragraph
            body: >-
              For valuation and adoption analysis, the market evidence supports a scenario framework rather than a
              single top-down number. The broad market is expanding and policy institutions are formalizing supervision,
              but Volant's monetizable serviceable market depends on aircraft certification, production rate, route
              permissions, operator economics, and binding customer commitments. The public pool does not provide a
              verified customer-by-customer schedule, deposits by contract, cancellation terms, route-level utilization,
              or aircraft gross-margin assumptions. It also contains inconsistent capital, valuation, and order
              descriptions: Hurun lists Volant at $1.5 billion, another profile cites a $1 billion valuation, and a
              later report describes nearly RMB 1 billion in a C+ round, more than 1,900 orders or letters of intent,
              and nearly RMB 100 million in deposits. Joby's $4.62 billion public market capitalization is only a
              comparator, not a like-for-like valuation. These statements may cover different dates or publication
              standards and should not be aggregated without primary documentation.
            claimRefs:
              - CM016
              - CM017
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Market conclusion
            body: >-
              The evidence supports a large policy-defined ecosystem with a much smaller and still pre-commercial
              passenger-eVTOL revenue pool; Volant's realized opportunity is therefore certification- and
              route-constrained.
            calloutType: insight
            claimRefs:
              - CM002
              - CM007
              - CM011
          - type: callout
            title: Sizing and conversion risk
            body: >-
              Headline orders, letters of intent, deposits, and valuation signals are not equivalent to delivered
              aircraft, recurring route revenue, or cash available for production.
            calloutType: risk
            claimRefs:
              - CM016
              - CM017
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and relative scale
        blocks:
          - type: paragraph
            body: >-
              The relevant field is broader than six-seat passenger eVTOL manufacturers. Volant competes directly with
              Chinese passenger-aircraft developers, indirectly with short-range autonomous platforms such as EHang, and
              globally with vertically integrated operators such as Joby. Cargo-first manufacturers can transfer
              certification and production learning, while XPeng AeroHT addresses a high-net-worth private-use segment
              rather than the same operator buyer. Conventional helicopters, ground transport, and an operator's
              decision not to launch a route remain status-quo substitutes. Public scale signals are mixed: Multiples
              reports $517 million raised for Volant, Hurun assigns it a $1.5 billion valuation, and The Insight Asia
              reports a backlog that combines confirmed orders with letters of intent. Those measures are not equivalent
              to certified production, binding revenue, or route-level demand.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP009
