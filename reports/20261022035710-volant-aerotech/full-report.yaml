      - number: '3.2'
        title: Product, certification, and trust posture
        blocks:
          - type: paragraph
            body: >-
              Volant's disclosed product proposition is a piloted six-seat tiltrotor with a claimed 200–400 km range,
              which places it above short urban multirotors on payload and mission breadth but also exposes it to
              greater engineering and certification complexity. Joby discloses a pilot-plus-four aircraft, a target
              range of up to 100 miles, and an integrated service model; its filing also makes clear that Type
              Certification, Production Certification, and other operational approvals remain gating items. EHang's
              reported four-certificate stack provides the clearest current trust and operating-status advantage, while
              AutoFlight and Aerofugia add cargo-production learning and order-channel pressure. China's revised
              aviation framework reinforces that design approval alone is insufficient: production, aircraft, operator,
              route, insurance, and airspace obligations can each delay commercial scale.
            claimRefs:
              - CP001
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
