      - number: '4.3'
        title: Capital adequacy and underwriting verdict
        blocks:
          - type: paragraph
            body: >-
              Volant has demonstrated financing access but not publicly verified cash adequacy. The Insight Asia reports
              a nearly RMB1 billion C+ round after a $300 million Series C and total funding above RMB5 billion across
              13 rounds; PanDaily instead describes nearly $4.2 billion in C and C+ rounds over two months. These
              figures are not reconciled in the public record and should not be treated as cash available. Hurun assigns
              Volant a $1.5 billion valuation in its 2026 unicorn index, while EquityZen withholds current valuation,
              cap table, financials, and risk factors behind investor access. The public record therefore supports a
              well-capitalized fundraising narrative, not a runway calculation. Certification timing is the key
              financing trigger: The Insight Asia says management expects type certification by 2027, and the regulatory
              sources indicate substantial compliance and insurance obligations. The financial verdict is research-more
              until cash, burn, capex, deposits, binding backlog, and delivery economics are disclosed.
            claimRefs:
