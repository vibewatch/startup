  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: pricing-gap
      missingEvidence: >-
        Customer quotations, realized aircraft prices, deposits, discounts, refundability,
        cancellation rights, support packages, and route-level ticket economics for comparable
        Volant and competitor offerings.
      whyItMatters: >-
        Public list prices and target prices cannot establish buyer switching costs, revenue
        quality, gross margin, or total cost of ownership.
      diligencePath: >-
        Obtain standardized OEM bids and three customer contracts, then reconcile aircraft,
        infrastructure, training, maintenance, insurance, and financing terms on a per-seat-mile
        basis.
      relatedQuestionRefs: [QP004]
      relatedTableRefs: [TP003]
    - type: conflicting-data
      severity: material
      topic: order-quality
      missingEvidence: >-
        A customer-by-customer schedule separating binding purchase agreements, options, letters
        of intent, deposits received, refundable amounts, milestones, and delivery windows.
      whyItMatters: >-
        Headline order counts may overstate demand, distribution lock-in, production visibility,
        and the value of Volant's commercial position.
      diligencePath: >-
        Inspect executed contracts and bank evidence for deposits; confirm material terms
        directly with the largest named customers.
      relatedQuestionRefs: [QP002, QP007, QP008]
      relatedTableRefs: [TP001]
    - type: missing-source
      severity: material
      topic: certification-risk
      missingEvidence: >-
        Current CAAC certification basis, completed and open compliance items, regulator-agreed
        test plan, production approval path, test-flight hours, and target dates for every
        remaining approval.
      whyItMatters: >-
        Certification maturity determines launch timing, capital needs, trust, and whether
        competitor infrastructure or operator relationships become locked before Volant can
        deliver.
      diligencePath: >-
        Review regulator correspondence and the live compliance checklist with Volant's
        certification lead, then validate status with aviation counsel and the relevant CAAC
        office.
      relatedQuestionRefs: [QP003, QP006, QP007]
      relatedTableRefs: [TP002]
