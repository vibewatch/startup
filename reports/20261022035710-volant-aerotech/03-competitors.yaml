      - Limitation or evidence gap
    rows:
      - [Volant VE25-100, Direct passenger eVTOL, "$517M raised reported by Multiples; $1.5B Hurun valuation", "B2B operators; regional passenger routes", "Six seats; claimed 200–400 km range; tiltrotor", "Certification, binding backlog, pricing, and delivered fleet remain unproven publicly"]
      - [EHang EH216-S, Short-range autonomous passenger eVTOL, "Reported four-certificate stack; 2.39M yuan aircraft price", "Tourism and short urban operations", "Autonomous two-seat operation and current operating credentials", "About 35 km reported range narrows mission set"]
      - [Joby, Global passenger eVTOL and operator, "$4.62B market cap reported for October 2026", "Urban air taxi, affiliate operations, aircraft sales, defense", "Vertically integrated aircraft, operations, software, and infrastructure relationships", "Still requires remaining aircraft and operational approvals"]
      - [AutoFlight, Cargo-first eVTOL with passenger adjacency, "More than 200 cargo-aircraft orders reported", "Cargo logistics first; passenger variant in certification", "Tonne-class cargo certification and production learning", "Passenger certification and comparable operating economics are not established here"]
      - [Aerofugia, Direct Chinese passenger eVTOL, "More than 1,000 orders reported by Global Times", "Integrated air travel, business-jet linkage, and tourism", "Geely-linked industrial base and broad scenario development", "Order terms, certification conversion, and pricing are undisclosed"]
      - [XPeng AeroHT, Adjacent personal flying vehicle, "Under 2M yuan target price reported by industry source", "High-net-worth private users", "Automotive brand, supply chain, and land-air packaging", "Different buyer and use case; mass-delivery target is forward-looking"]
      - [Helicopter / ground transport / no route, Status quo substitute, "Existing fleets and infrastructure; no comparable pooled metric", "Charter, emergency, airport transfer, intercity travel", "Known operating rules and immediate availability", "Noise, cost, congestion, or travel-time disadvantages vary by route"]
    notes: >-
      Public snapshots from the retained sources as of 2026-10-22. Funding, valuation, market
      capitalization, orders, aircraft price, and ticket price are different metrics and must
      not be compared as a single scale measure; unknown terms are stated rather than estimated.
    claimRefs: [CP001, CP002, CP003, CP004, CP005, CP006, CP007, CP008, CP009, CP010, CP011, CP012]
  - id: TP002
    title: Capability and trust matrix
    columns:
      - Buying criterion
      - Volant
      - EHang
      - Joby
      - AutoFlight / Aerofugia / XPeng
      - Underwriting implication
    rows:
      - [Passenger mission, "Six seats; claimed 200–400 km", "Two seats; about 35 km reported", "Pilot plus four; up to 100-mile target", "Mixed cargo, five-seat passenger, and private-use products", "Mission fit is not a single ranking; route distance and payload drive selection"]
      - [Certification posture, "Type-certification outcome not established by retained evidence", "Reported TC + AC + PC + OC", "FAA certification in process; remaining approvals acknowledged in filing", "Cargo certification or passenger applications vary by company", "Certificate scope and operating authority must be checked product by product"]
      - [Production proof, "No delivered-fleet evidence retained", "Commercial trial operations reported", "Facilities and low-rate production preparation disclosed", "AutoFlight cargo production; XPeng target remains forward-looking", "Factory announcements are not delivered passenger fleets"]
      - [Operating model, "B2B product sales and operator partnerships indicated", "Autonomous short-route operations", "Direct service, affiliates, direct sales, and defense", "Cargo logistics, tourism, business-jet linkage, or private ownership", "Distribution and operator control may outweigh aircraft-level features"]
      - [Trust / safety evidence, "No public operating safety history retained", "Operating credential stack reported", "Part 135 certificate and safety-management disclosures, but aircraft approval incomplete", "Evidence varies and is incomplete in the assigned pool", "Require certificate documents, incidents, test hours, and insurer terms"]
      - [International portability, "International expansion intent reported; validation path unknown", "CAAC pathway with selected overseas activity reported", "Multiple regulator engagements disclosed", "Middle East and Asian demonstrations or plans vary", "No source establishes automatic CAAC/FAA/EASA mutual recognition"]
    notes: >-
      Matrix cells reflect only the assigned prefetched evidence. "Not established" and
      "unknown" mean the evidence pool does not support a conclusion, not that a capability or
      approval does not exist.
    claimRefs: [CP001, CP006, CP007, CP008, CP009, CP010, CP011, CP012, CP013, CP015]
  - id: TP003
    title: Pricing, packaging, and commercial model comparison
    columns:
      - Offering
      - Public price / unit
      - Contract or revenue model
      - Included capability
      - Discount / unknown
      - Competitive implication
    rows:
      - [Volant VE25-100, Unknown, "B2B aircraft sale / operator partnership indicated", "Six-seat regional passenger aircraft", "Customer deposits, cancellation rights, service package, and realized price unknown", "Headline order value cannot establish unit economics or lock-in"]
      - [EHang EH216-S, "2.39M yuan aircraft; 880 yuan ticket example", "Aircraft and short-route operation", "Two-seat autonomous short-range service", "Subsidy and utilization make realized economics route-specific", "Only retained source with explicit aircraft and ticket pricing"]
      - [Joby service / aircraft, Unknown, "Direct service, affiliate service, direct sales, and defense", "Pilot-plus-four aircraft and integrated operating platform", "Launch fare, distributor economics, and realized aircraft price unknown", "Broader monetization surface may support distribution control"]
      - [XPeng AeroHT Land Aircraft Carrier, "Under 2M yuan target", "Private product sale", "Land vehicle plus flight body", "Final delivered price and production volume remain forward-looking", "Targets a different buyer and may not price against operator fleets directly"]
      - [Helicopter or ground substitute, Route-specific, "Charter, owned fleet, scheduled transport, or no purchase", "Existing certified mobility", "Fuel, crew, insurance, congestion, and route costs not quantified in pool", "Buyer can defer eVTOL adoption until total operating cost and access are proven"]
    notes: >-
      Prices are public examples or targets, not realized revenue, margin, or comparable
      delivered-aircraft economics. Unknown fields require customer contracts, OEM quotations,
      deposit schedules, and route-level operating data.
    claimRefs: [CP007, CP009, CP010, CP014, CP015]
figures:
  - id: FP001
    title: Evidence-constrained competitive positioning
    type: quadrant
    summary: >-
      Ordinal map of disclosed commercial maturity (x) versus mission breadth (y), where 1 is
      low and 5 is high; positions are analytical scores, not measured performance benchmarks.
    data:
      points:
        - label: Volant
          x: 2
          y: 5
          detail: "Longer-range six-seat proposition; certification and deliveries not established."
        - label: EHang
          x: 5
          y: 2
          detail: "Reported four-certificate stack and commercial trials; short two-seat mission."
        - label: Joby
          x: 4
          y: 4
          detail: "Advanced integrated platform and manufacturing buildout; approvals still pending."
        - label: AutoFlight
          x: 4
          y: 3
          detail: "Certified cargo learning with passenger adjacency."
        - label: Aerofugia
          x: 3
          y: 4
          detail: "Large reported order base and broad route scenarios; contract quality unknown."
        - label: XPeng AeroHT
          x: 3
          y: 2
          detail: "Private-use land-air product with mass-production target."
    approximationNotes: >-
      Analyst-authored ordinal scores use 1–5 scales. Commercial maturity weighs retained
      certification, production, and operating evidence; mission breadth weighs disclosed
      payload, range, and route applicability. The map does not imply equal intervals, numeric
      performance superiority, or verified order conversion.
    claimRefs: [CP001, CP005, CP006, CP008, CP009, CP010, CP011, CP012, CP016]
callouts:
  - calloutType: risk
    title: Order volume is not contractual quality
    body: >-
      The retained reporting combines confirmed orders and letters of intent, while explicitly
      cautioning that firm commitments may be only a fraction. Underwriting should require a
      customer-level schedule of deposits, cancellation rights, milestones, delivery slots, and
      refundability before treating the backlog as competitive lock-in.
    claimRefs: [CP002]
  - calloutType: insight
    title: Certification creates a temporary moat, not a complete one
    body: >-
      A certificate can constrain entry, but commercial advantage also requires production
      quality, route approvals, insurance, infrastructure, service support, and utilization.
      Competitors can lead on different layers, so Volant must prove the full system.
    claimRefs: [CP008, CP009, CP013, CP016]
