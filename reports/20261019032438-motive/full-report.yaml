  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Argument
      - Evidence-backed view
      - What would change the view
    rows:
      - - Operating scale
        - Motive says ARR crossed $600 million and grew 30% year over year.
        - >-
          Audited revenue, gross margin, cash flow, and cohort data would test whether ARR converts into durable equity
          value.
      - - Enterprise expansion
        - Motive says large-account ARR grew nearly 60% year over year with net revenue retention above 120%.
        - >-
          Customer concentration and independently verified retention cohorts could strengthen or weaken the quality
          assessment.
      - - Customer footprint
        - Motive said nearly 100,000 customers and 1.3 million drivers relied on the platform in 2025.
        - >-
          Current paying-customer definitions and customer concentration would clarify the denominator and revenue
          quality.
      - - Product execution
        - Motive says Agents are available and can make decisions up to ten times faster.
        - >-
          Independent adoption, realized savings, and renewal evidence would convert a product claim into valuation
          support.
      - - Capital flexibility
        - More than $1.3 billion of growth financing removes pressure for an immediate IPO.
        - >-
          Repayment caps, covenants, seniority, and preference interactions could make the structure more or less
          equity-friendly.
      - - Affordability and competition
        - >-
          Airpinpoint argues that enterprise vendors face incentives toward higher prices, longer contracts, and bundled
          features.
        - >-
          Segment-level win rates, churn, and realized pricing would show whether this competitor critique affects
          Motive's growth.
    notes: >-
      Company-issued operating claims are separated from competitor commentary; neither is treated as an independently
      verified benchmark.
    claimRefs:
      - CV005
      - CV007
      - CV008
      - CV009
      - CV011
      - CV012
      - CV014
      - CV015
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - >-
          Growth remains near the reported 30% rate, enterprise expansion persists, and Motive restores a credible IPO
          path.
        - >-
          Airpinpoint's competitor-authored projection places a possible IPO outcome at $4 billion to $6 billion; entry
          returns still cannot be calculated without price and terms.
        - Multiple compression, weaker retention, or burdensome financing terms prevent the proposed rerating.
        - Low confidence until independently benchmarked
      - - Base
        - Motive continues growing while remaining private and a new priced transaction is delayed.
        - >-
          Use the $2.1 billion QuantLogix estimate and $2.85 billion last-disclosed valuation as a provisional anchor
          band, not a fair-value conclusion.
        - Stale price discovery and opaque preferences keep the return range indeterminate.
        - Most supportable with current evidence
      - - Bear
        - Growth decelerates or CVF repayment and preference obligations absorb more equity value than expected.
        - >-
          Effective value falls to or below the $2.1 billion third-party estimate; no precise downside return is
          supportable without the entry security.
        - Deferred IPO timing, affordability pressure, and financing seniority compound.
        - Material if diligence reveals restrictive terms
    notes: >-
      Scenario boundaries reproduce cited public anchors and explicitly avoid unsupported return percentages; share
      price, fully diluted ownership, preferences, and repayment terms remain gaps.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV006
      - CV007
      - CV008
      - CV009
      - CV014
      - CV015
      - CV016
