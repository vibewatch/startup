              - CM004
              - CM005
              - CM008
              - CM016
      - number: '2.3'
        title: Buyer segmentation favors multi-stakeholder sales with enterprise expansion upside
        blocks:
          - type: paragraph
            body: >-
              Public evidence points to a buyer map that starts with compliance-heavy trucking fleets but expands into
              construction, energy, utilities, field service, manufacturing, agriculture, and public-sector operations.
              The likely users are drivers, dispatchers, safety managers, and fleet operators, while the payer can sit
              with operations, safety, finance, or a shared enterprise-technology budget depending on whether the
              deployment starts from compliance, safety, spend, or platform-consolidation needs. That multi-stakeholder
              pattern is consistent with Motive's own enterprise expansion claims: the company says ARR from customers
              above $100,000 is growing faster than its overall base, which suggests that once fleets land on one
              workflow, cross-sell into adjacent modules can enlarge the budget envelope.
            claimRefs:
              - CM009
              - CM010
              - CM014
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM010
              - CM012
              - CM015
      - number: '2.4'
        title: Demand drivers are real, but switching friction and evidence gaps still matter
        blocks:
          - type: paragraph
            body: >-
              The strongest demand drivers in the public record are integration, time to value, and rising appetite for
              AI-assisted supply-chain workflows. Those are favorable to Motive's integrated positioning, especially if
              buyers want to replace fragmented tools with one operating layer. The same evidence also surfaces real
              constraints: fragmented OEM data, privacy concerns, implementation complexity, pricing opacity, and a
              crowded competitor set can all slow conversion or limit how much of the broad category becomes reachable
              revenue. For diligence purposes, the biggest remaining gap is that public sources do not provide a
              neutral, segment-by-segment SAM/SOM or a clear budget-owner split across verticals, so any valuation case
              still needs management-level cohort, win-rate, and ACV data to translate category breadth into a concrete
              revenue ceiling.
            claimRefs:
              - CM006
              - CM007
              - CM011
              - CM012
              - CM013
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              The retained comparison evidence frames Motive inside a practical buyer decision set rather than a single
              tidy peer group. StackBriefly compares Motive with Samsara, Geotab, Verizon Connect, and Fleetio, and it
              explicitly notes that fleets often start from spreadsheets and phone calls until routing, compliance,
              safety, maintenance, and fuel workflows become too complex to manage manually. That matters because Motive
              is not just fighting one direct software rival; it is also competing with incumbents that already own
              visibility or maintenance workflows, plus the low-cost status quo of no integrated platform at all. In
              that set, Motive is positioned most clearly around safety and compliance-heavy physical operations.
            claimRefs:
