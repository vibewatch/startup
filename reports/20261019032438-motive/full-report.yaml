      - number: '5.2'
        title: Operating model, deployment pattern, and dependencies
        blocks:
          - type: paragraph
            body: >-
              Motive's product model appears to rely on a hardware-plus-cloud architecture with the driver app and
              in-cab devices feeding a broader back-office workflow layer. The official platform page positions AI
              analytics, document workflows, automations, and the Atlas assistant as first-party surfaces, while
              third-party coverage says the ecosystem includes large numbers of pre-built integrations and partner data
              feeds across fuel, maintenance, insurance, routing, and OEM-connected workflows. Hiring evidence also
              shows active investment in connected devices, security/compliance, and internal AI automation roles. That
              combination implies meaningful deployment depth, but also dependency on device quality, partner-system
              interoperability, and permissioning/governance quality.
            claimRefs:
              - CE001
              - CE005
              - CE006
              - CE010
              - CE014
          - type: table
            tableRef: TE003
            claimRefs:
              - CE001
