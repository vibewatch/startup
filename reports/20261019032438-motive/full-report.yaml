      - number: '3.3'
        title: Pricing, packaging, and switching friction
        blocks:
          - type: paragraph
            body: >-
              The pricing evidence is strong enough to show where buyer friction sits, but not strong enough to support
              an apples-to-apples public price comparison. StackBriefly says Fleetio benefits from published per-vehicle
              pricing, while Verizon Connect requires a written quote that separates devices, software, support,
              installation, and contract terms. The same source says Samsara buyers need to validate hardware cost and
              contract scope, and Geotab buyers need clarity on package, partner, and add-on choices before comparing
              price. For Motive, the assigned pool supports breadth and product claims, but not public list pricing or
              realized discounting. That makes deployment, contract structure, and required hardware a real
              switching-cost diligence area rather than a settled advantage.
            claimRefs:
              - CP006
              - CP008
              - CP014
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP001
              - CP006
              - CP008
              - CP014
              - CP015
      - number: '3.4'
        title: Durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Public scale and financing signals suggest Motive can sustain competitive pressure better than a narrow
              feature vendor, but they do not remove execution risk. Motive says it serves nearly 100,000 customers and
              1.3 million drivers, crossed $600 million of ARR by September 2026, and added both a 2025 $150 million
              round and more than $1.3 billion of 2026 growth financing to fund product and go-to-market expansion.
              Those facts support distribution and product-investment durability. The weaker side of the case is that
              the assigned pool does not include independent side-by-side benchmarks on false positives, realized ROI,
              or contract economics across Motive, Samsara, Geotab, and Verizon Connect. That leaves room for incumbents
              or narrower specialists to blunt Motive's AI-led pitch if field performance or total cost proves less
              differentiated than the marketing surface suggests.
            claimRefs:
              - CP011
              - CP012
              - CP013
              - CP014
              - CP015
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Why Motive still looks hard to displace
            body: >-
              The assigned pool supports a real combination of platform breadth, AI-heavy safety hardware, customer
              scale, and fresh capital, which is stronger than a narrow feature pitch and more credible than an
              early-stage challenger story.
            calloutType: strength
            claimRefs:
              - CP008
              - CP009
              - CP011
              - CP012
              - CP013
          - type: callout
            title: Where the competitive case is still soft
            body: >-
              Public pricing, contract economics, and independent head-to-head benchmarks are weaker than the product
              marketing surface, so buyers still need field pilots and quote-level diligence before treating Motive's
              edge as durable.
            calloutType: risk
            claimRefs:
              - CP014
              - CP015
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and public traction
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports a multi-product, recurring-revenue model built around fleet-safety, compliance,
              telematics, maintenance, and spend-management workflows, but it does not disclose the product-line revenue
              mix or revenue-recognition details needed for full underwriting. Motive's own 2025 and 2026 releases
              consistently frame the business as a unified operating platform spanning safety, operations, and finance,
              while a third-party review is the only source in this pool that exposes list-like public pricing for
              self-serve and hardware entry points. The strongest corroborated traction data are at the topline and
              enterprise-cohort level: Motive said ARR crossed $600 million with 30% year-over-year growth by September
              2026, after reporting in July 2025 that ARR from customers above $100,000 had already more than doubled
              since 2024.
            claimRefs:
