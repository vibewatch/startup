      - number: '1.4'
        title: Milestones and adverse context
        blocks:
          - type: paragraph
            body: >-
              The milestone record shows a company broadening from safety and compliance into a fuller operating system
              for physical operations. The dated path that is sourceable from the assigned pool runs from 2013
              incorporation, through 2017 AI-model development and the 2019 Equipment Monitoring launch, to the 2022
              Spend Management/Motive Card launch, the 2024 AI Vision and Workforce Management expansion, the 2025
              funding and S-1 filing, and the 2026 financing-led withdrawal of that filing. The main adverse context is
              not a public operating stumble but legal and commercial uncertainty. The S-1 details ongoing Samsara
              litigation that is scheduled for trial in 2027, while independent reviews say Motive's breadth comes with
              opaque pricing, multi-year contracts, and a fit that is strongest in compliance-heavy trucking rather than
              every field-fleet segment.
