companyProfile:
  summary: >-
    Motive is a founder-led, San Francisco-based physical-operations software company that has expanded from ELD
    compliance into a broader platform spanning safety, fleet management, equipment monitoring, spend management,
    workforce workflows, and AI-assisted automation. The public evidence in this refresh supports real scale, enterprise
    expansion, and strong product breadth, but still leaves material opacity around the current financing structure,
    valuation, customer concentration, and some unit-economics inputs.
  foundedDate: 2013-03-01T00:00:00.000Z
