      - number: '1.2'
        title: Leadership, governance, and key-person dependence
        blocks:
          - type: paragraph
            body: >-
              The named leadership evidence in the pool is concentrated but directionally clear. Shoaib Makani remains
              the co-founder and CEO, Chirag Shah is the CFO speaking for current financing momentum, Thomas Hansen was
              named first President, Go-to-Market in 2026, and Shu White is listed as Chief Legal Officer in the S-1.
              The governance structure is still founder-centric rather than institutionally balanced: the S-1 says
              Makani's Class B stock would control stockholder votes after an IPO, and the same filing explicitly warns
              that the business is highly dependent on him for technology, products, platform vision, and strategic
              direction. That combination is workable for speed, but it heightens succession, control, and disclosure
              diligence for any new outside capital.
            claimRefs:
              - CO013
              - CO014
          - type: table
            tableRef: TO002
            claimRefs:
              - CO006
              - CO007
              - CO013
              - CO014
      - number: '1.3'
        title: Capital history, scale markers, and stakeholder map
        blocks:
          - type: paragraph
            body: >-
              Motive's recent capital story is a step change rather than a steady continuation of its earlier private
              rounds. In July 2025 the company announced a $150 million round led by Kleiner Perkins with
              AllianceBernstein as a new investor, and in September 2026 it announced more than $1.3 billion of growth
              financing from General Catalyst's Customer Value Fund while adding Pranav Singhvi to the board. The
              current pool supports meaningful but mixed-quality scale markers: company statements repeated nearly
              100,000 customers and 1.3 million drivers, the S-1 disclosed $370.5 million of 2024 revenue and 70% gross
              margin, and the September 2026 financing update said ARR crossed $600 million with 30% year-over-year
              growth. What remains missing is as important as what is present: the instrument design, covenants,
              dilution, and cash-flow implications of the 2026 financing are not public in this pool, so capital
              structure certainty still lags operating-scale certainty.
