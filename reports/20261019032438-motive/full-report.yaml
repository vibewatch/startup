chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating scope
        blocks:
          - type: paragraph
            body: >-
              Motive's durable identity is well supported in the pool: the company was incorporated in Delaware in March
              2013 as Keep Truckin, Inc., and its principal executive offices remain at 1355 Market Street in San
              Francisco. Current product positioning is no longer narrow telematics. Motive now presents itself as an AI
              platform for physical operations, and the most reusable taxonomy in the assigned evidence is the
              six-product grouping from the S-1 and help-center overview: Driver Safety, Fleet Management, Equipment
              Monitoring, Spend Management, Workforce Management, and AI Vision. Independent profiles broadly agree that
              the company has moved beyond compliance-only origins into a multi-workflow operating stack, even if
              external reviewers still describe the brand through a fleet-and-trucking lens.
            claimRefs:
              - CO001
              - CO002
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
