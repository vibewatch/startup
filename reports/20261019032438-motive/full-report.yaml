      - number: '4.2'
        title: Unit economics and cost structure
        blocks:
          - type: paragraph
            body: >-
              The public unit-economics picture is directionally positive on expansion and retention but still
              incomplete on cost efficiency. Official releases show strong enterprise upsell, with ARR from customers
              above $100,000 growing nearly 60% year over year in 2026 after more than doubling since 2024, and net
              revenue retention remaining above 120% to 130% in those company-selected cohorts. Independent commentary
              fills in some margin context: Frost said Motive was near $500 million of annualized ARR and cash-flow
              positive since late 2024, while ValueAddVC's synthesis of the withdrawn S-1 cited $327.3 million of
              revenue for the first nine months of 2025 and 70% gross margin, then argued that hardware and operating
              losses still constrained cash generation. That leaves CAC, payback, gross retention, and current gross
              margin as material diligence asks rather than underwritten facts.
            claimRefs:
              - CI004
              - CI007
              - CI011
              - CI012
              - CI013
          - type: table
            tableRef: TI003
            claimRefs:
              - CI004
              - CI006
              - CI007
              - CI011
              - CI012
              - CI013
      - number: '4.3'
        title: Capital adequacy and financing dependency
        blocks:
          - type: paragraph
            body: >-
              Motive's capital story shifted from a conventional private-to-public path to a better-capitalized but less
              transparent one. In July 2025, Motive raised $150 million to expand AI, geographic reach, and go-to-market
              capacity; in September 2026 it then announced more than $1.3 billion of growth financing from General
              Catalyst's Customer Value Fund and withdrew its S-1. The official message is that the financing funds
              continued product and GTM expansion while preserving the option to list later, but the public record still
              lacks the current valuation, post-close cash balance, debt-like terms, repayment schedule, and dilution
              implications. That means the new financing clearly improves near-term flexibility, yet investors still
              cannot quantify runway or financing cost from public materials alone.
            claimRefs:
              - CI001
              - CI002
              - CI005
              - CI008
              - CI014
              - CI015
      - number: '4.4'
        title: Verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              Financially, Motive looks like a scaled recurring-software business with credible enterprise expansion,
              but not yet a cleanly underwritten one. The public bull case rests on ARR above $600 million, accelerating
              growth, and strong large-account retention, all of which support continued go-to-market and product
              investment. The public bear case is that the 2026 financing avoided immediate IPO price discovery, the
              current valuation is still undisclosed, and the only margin and burn detail in this pool comes through
              third-party synthesis of the withdrawn S-1 rather than current audited disclosure. The next diligence step
              is not more narrative; it is access to a cohort revenue bridge, current cash and debt schedule, customer
              concentration, realized pricing waterfalls, and segment gross-margin data.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI013
              - CI014
              - CI015
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Enterprise retention is the cleanest public quality signal
            body: >-
              The most convincing publicly supported financial signal is not a detailed income statement but the
              enterprise cohort: Motive said customers above $100,000 of ARR more than doubled since 2024, then still
              grew nearly 60% year over year in 2026 with net revenue retention above 120%.
            calloutType: strength
            claimRefs:
              - CI004
              - CI007
          - type: callout
            title: Capital is plentiful, but financing quality is still opaque
            body: >-
              The September 2026 financing removes immediate capital pressure, yet Motive did not disclose a current
              valuation and the public pool still leaves the Customer Value Fund structure only partially understood, so
              investors cannot quantify dilution, repayment burden, or true runway from public evidence alone.
            calloutType: risk
            claimRefs:
              - CI005
              - CI014
              - CI015
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Integrated suite and workflow coverage
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence supports a real multi-surface operating suite rather than a single telematics
              feature set. Motive's own platform page centers analytics, documents, automations, Atlas assistant, and
              privacy/security controls inside one command center, while third-party summaries describe the company as
              combining telematics hardware, cloud software, and AI workflows across safety, dispatch, maintenance,
              compliance, and spend. Independent review evidence also points to concrete hardware modules such as AI
              dashcams and ELD devices, plus workflow automation around GPS tracking, route planning, and driver logs.
              The practical takeaway is that Motive sells an operating layer for physical operations teams, not just a
              compliance point solution.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE015
