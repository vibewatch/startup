  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary: integrated fleet and physical-operations software'
        blocks:
          - type: paragraph
            body: >-
              The relevant market boundary is narrower than generic enterprise software but broader than ELD compliance
              alone. Across official and third-party descriptions, Motive is positioned as an integrated platform for
              physical operations that bundles safety, compliance, telematics, maintenance, dispatch, and
              spend-management workflows for fleets and field-service organizations. That framing matters because it
              changes both the comparable budget pools and the substitute set: the status quo is often a stack of
              disconnected point tools rather than a single incumbent product. For adoption, this means Motive competes
              not only against direct fleet-software vendors, but also against internal process workarounds and buyers'
              reluctance to replace multiple existing systems at once.
            claimRefs:
              - CM001
              - CM002
              - CM010
              - CM011
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM010
      - number: '2.2'
        title: Sizing lenses show a large category, but not a clean public SAM/SOM
        blocks:
          - type: paragraph
            body: >-
              The available market-sizing evidence is directional rather than definitive. Futurum's broad enterprise
              software forecast shows the macro software budget pool expanding quickly, while its survey data shows
              supply-chain and logistics software already has meaningful penetration in enterprise IT stacks. Separate
              lenses point to fleet-specific adoption momentum: 451 Research says AI usage in commercial transportation
              is already widespread, and Hylios cites a North American base of roughly 30 million addressable commercial
              vehicles against Motive's reported 1 million vehicles on platform. Taken together, those sources support a
              large and still-penetrable category, but they mix dollars, survey adoption rates, and installed-base
              counts, so they are useful as boundary conditions rather than a single numerically rigorous TAM/SAM/SOM
              waterfall.
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM007
              - CM008
              - CM014
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
