    notes: >-
      Segmentation reflects what retained sources disclose publicly; null-style gaps are expressed in prose because
      the allocated evidence does not provide a segment-level revenue or customer-count denominator.
    claimRefs: [CU001, CU003, CU004, CU005, CU007]
  - id: TU002
    title: Customer growth / adoption trajectory table
    columns:
      - Metric
      - Value
      - Date
      - Source
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - ["Customers served", "Nearly 100,000", "2025-07-30 to 2026-09-10", "Official Motive releases", high, "Installed base is already large enough that enterprise expansion is occurring on top of scale, not before scale", "No split by active versus historical logos"]
      - ["Drivers on platform", "1.3 million", "2025-07-30 to 2026-07", "Official Motive releases", high, "Usage footprint appears meaningful in day-to-day fleet operations", "No paid-seat, active-user, or vehicle denominator"]
      - ["ARR from >$100k customers", "More than doubled since 2024", "2025-07-30 and 2026-07", "Official Motive releases", high, "Land-and-expand motion is visible in larger accounts", "No baseline ARR value for the cohort"]
      - [">$100k customer ARR growth", "Nearly 60% YoY", "2026-09-10", "Official Motive financing release", high, "Enterprise adoption was still accelerating as of September 2026", "No account count or logo cohort definition"]
      - ["Net revenue retention", "Over 130% in July 2026; above 120% in September 2026", "2026-07 to 2026-09-10", "Official Motive releases", medium, "Durability looks strong even with wording drift between disclosures", "No GRR, churn, renewal cadence, or cohort segmentation"]
    notes: >-
      Values come from company-issued materials and should be treated as directional commercial traction rather than
      independently audited cohort reporting; denominators and cohort definitions are largely undisclosed.
    claimRefs: [CU001, CU002, CU011, CU012, CU013]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome
      - Limitation
    rows:
      - [FedEx Freight, Transportation and logistics, "Official materials name the company as a customer and global leader reference", "Named customer, but production scope is not disclosed", "No quantified public outcome in allocated evidence", "No module, seat count, contract timing, or deployment depth disclosed"]
      - [Cintas, Business services / fleet operations, "Named in Motive customer lists", "Named customer, but production scope is not disclosed", "No quantified public outcome in allocated evidence", "Logo-level proof only in retained sources"]
      - [KONE, Industrial / field service, "Named in Motive customer lists", "Named customer, but production scope is not disclosed", "No quantified public outcome in allocated evidence", "No public detail on geography, use case, or rollout size"]
      - [Davey Tree, Field services, "Named in Motive customer lists", "Named customer, but production scope is not disclosed", "No quantified public outcome in allocated evidence", "No confirmation of platform modules or contract length"]
      - [ABM, Facilities services, "Named in Motive customer lists", "Named customer, but production scope is not disclosed", "No quantified public outcome in allocated evidence", "Allocated evidence does not distinguish pilot from broad deployment"]
      - [CRH, Construction materials, "Named in Motive customer lists", "Named customer, but production scope is not disclosed", "No quantified public outcome in allocated evidence", "No public implementation detail in retained sources"]
    notes: >-
      This is a representative sample of named customers explicitly cited in retained official materials; the public
      proof here is mostly logo-level and should not be over-read as confirmed fleet-wide production deployment.
    enumerationScope:
      coverage: sample
      basis: >-
        Sample limited to customer names explicitly repeated in retained July 2025 and July 2026 Motive releases;
        it is not an exhaustive customer census.
    claimRefs: [CU005, CU016]
figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Motive's public customer story starts with broad fleet pain points, proves value through safety trials, and
      then expands into higher-value enterprise accounts and adjacent workflows.
    data:
      items:
        - label: Broad physical-operations buyer set
          actor: "Safety, operations, and finance leaders"
          stage: Entry surface
          touchpoints:
            - Transportation, logistics, construction, utilities, agriculture, food and beverage, and public sector
            - Customer base spans small businesses to Fortune 500 enterprises
          tone: neutral
        - label: Safety-led evaluation
          actor: "Fleet safety teams"
          stage: Proof step
          touchpoints:
            - Side-by-side trials are a recurring motif in the IDC-backed customer evidence
            - AI detection accuracy is positioned as the primary buying criterion
          tone: neutral
        - label: Production driver-safety rollout
          actor: "Drivers and managers"
          stage: Initial deployment
          touchpoints:
            - Cameras, event capture, and coaching workflows anchor the clearest public outcomes
            - Reported ROI centers on collision reduction, coaching efficiency, and insurance impact
          tone: positive
        - label: Named-logo social proof
          actor: "Enterprise prospects"
          stage: Commercial proof
          touchpoints:
            - FedEx Freight, Cintas, KONE, Davey Tree, ABM, and CRH appear in retained official materials
            - Public evidence rarely discloses module depth or rollout scope for those names
          tone: opportunity
        - label: Enterprise expansion
          actor: "Large accounts spending over $100k"
          stage: Expansion loop
          touchpoints:
            - Official releases say ARR from this cohort more than doubled since 2024
            - September 2026 disclosure adds nearly 60% YoY growth and NRR above 120%
          tone: positive
        - label: Remaining diligence loop
          actor: "Investor and diligence team"
          stage: Open question
          touchpoints:
            - Top-customer concentration, GRR, churn, and channel mix remain undisclosed
            - Independent customer-proof coverage in this source pool is still thinner than the official evidence
          tone: risk
    claimRefs: [CU001, CU003, CU006, CU011, CU012, CU015]
callouts:
  - calloutType: strength
    title: Enterprise upmarket motion is visible in disclosed cohort metrics
    body: >-
      Motive is not relying only on logo accumulation: official 2025 and 2026 materials say ARR from customers
      spending over $100,000 has more than doubled since 2024, and the September 2026 financing release says that
      cohort was still growing nearly 60% year over year.
    claimRefs: [CU011, CU012]
  - calloutType: risk
    title: Durability still depends on data management has not shared publicly
    body: >-
      The retained evidence does not disclose top-customer concentration, GRR, renewal cadence, or channel mix, and
      the named-customer record is still dominated by official logo references instead of independent renewal or
      deployment confirmations.
    claimRefs: [CU008, CU014, CU015, CU016]
