company:
  name: Motive
chapter:
  number: 6
  title: Customers
  summary: >-
    Motive has broad official proof of customer breadth and increasingly enterprise-skewed adoption, with nearly
    100,000 customers, 1.3 million drivers, and accelerating ARR from accounts spending over $100,000. The
    strongest public proof of realized value comes from a company-hosted IDC study and official logo lists rather
    than independent retention or concentration disclosures, so durability looks promising but still needs direct
    renewal and concentration diligence.
sections:
  - id: customer-base-breadth
    title: Customer base breadth is broad, but public segmentation stays high level
    body: >-
      Motive's customer footprint is large and visibly cross-vertical, but the public record still aggregates most
      of that breadth into high-level categories rather than disclosing segment mix. Official 2025 and 2026
      materials say nearly 100,000 customers and 1.3 million drivers use the platform, spanning transportation and
      logistics, construction, oil and gas, utilities, food and beverage, agriculture, and the public sector.
      Those same releases frame the business as serving organizations from small businesses to Fortune 500
      enterprises, which matters because it implies a two-layer customer story: a large installed base plus an
      increasingly important enterprise cohort. What is still missing is the revenue split by vertical, geography,
      or company size, so investors can see breadth but not the exact composition of the customer base.
    claimRefs: [CU001, CU002, CU003, CU004, CU005]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: deployment-proof
    title: Proof of deployment and ROI is strongest for safety use cases, not for named logos
    body: >-
      The most concrete adoption proof in the allocated evidence comes from fleet-safety outcomes rather than from
      detailed named-customer case studies. A company-hosted IDC writeup summarizing interviews across six
      organizations reports a 95% average reduction in at-fault collisions, more than 8x ROI, and $1.8 million in
      annual safety savings per organization, with examples such as FusionSite Services and Ernst Concrete. That is
      useful evidence that at least some deployed customers attribute measurable value to Motive, but it remains a
      sponsored and company-hosted proof point rather than a fully independent benchmark. By contrast, the official
      named-customer proof for FedEx Freight, Cintas, KONE, Davey Tree, ABM, and CRH largely shows logo-level
      association: the allocated sources name these accounts, but they do not disclose module mix, seat counts,
      contract start dates, or whether deployment is fleet-wide production versus a narrower rollout.
    claimRefs: [CU006, CU007, CU008, CU009, CU010, CU011]
    tableRefs: [TU003]
  - id: durability-and-expansion
    title: Enterprise expansion looks real, but concentration and independent proof remain open diligence items
    body: >-
      Motive's expansion motion looks strongest in enterprise accounts. Official 2025 and 2026 releases say ARR
      from customers spending over $100,000 has more than doubled since 2024, and the September 2026 financing
      release adds that this cohort grew nearly 60% year over year while net revenue retention stayed above 120%.
      An independent Frost & Sullivan article reaches a similar directional conclusion by describing large
      enterprises as Motive's fastest-growing segment and warning that the next test is scaling without eroding
      product innovation or customer experience. Even so, the allocated evidence still leaves two material
      durability questions unresolved: none of the retained customer-facing sources discloses top-customer
      concentration or channel concentration, and this pass's independent customer-proof coverage was weakened by
      several unrelated "Motive" namesake results in the assigned search pool. The result is a positive but still
      incomplete durability picture.
    claimRefs: [CU012, CU013, CU014, CU015, CU016]
    tableRefs: [TU002]
