      - [Contracted procurement motion, Fleet operators and finance buyers, "Commercial conversion and retention", "Quote-led pricing, pilots, hardware, and multi-year terms recur across reviews.", "Procurement cycles lengthen or churn is masked until contract renewal windows open.", Medium-high, "Pilot-led selling and integrated ROI narrative can still win when deployment value is clear.", Medium-high]
      - [Capital provider support, Equity and growth-financing backers, "Funds GTM, hiring, and product expansion", "Motive disclosed a 2025 equity raise and 2026 growth financing facility.", "If financing terms are restrictive or later capital is costlier, global rollout slows.", Medium, "Current disclosed capital is substantial and follows accelerating ARR and NRR.", Medium]
