callouts:
  - calloutType: risk
    title: Highest residual risk is still expansion quality, not cash
    body: >-
      The refreshed evidence says Motive now has far more capital than in the prior run, but three
      independent reviews still describe the product's sharpest fit in US trucking. If newer
      geographies or non-trucking cohorts need heavy services support, capital alone will not create
      durable unit economics.
    claimRefs: [CR009, CR010, CR011, CR013]
  - calloutType: assumption
    title: The legal downside is monitorable, but still under-documented
    body: >-
      The retained sources support a marketing-substantiation issue and aggressive competitive
      positioning, but they do not provide current court-file detail on broader IP or trade-secret
      exposure. That keeps the current legal risk at medium-high residual exposure rather than making
      it a thesis break today.
    claimRefs: [CR006, CR014]
