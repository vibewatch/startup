  evidenceGaps:
    - type: missing-source
      severity: material
      topic: comparable-benchmarks
      missingEvidence: >-
        A current independent public-company comparable set with consistent ARR, revenue, growth,
        margin, and enterprise-value definitions, plus relevant private rounds or M&A transactions.
      whyItMatters: >-
        The only explicit IPO range in the assigned pool comes from a competitor and cannot serve
        as an independent valuation benchmark.
      diligencePath: >-
        Build a dated comparable-company and transaction schedule from primary filings and
        independently reported private transactions before selecting a valuation multiple.
      relatedQuestionRefs: [QV007]
    - type: private-evidence-only
      severity: material
      topic: financing-structure
      missingEvidence: >-
        The current security price, fully diluted cap table, liquidation preferences, CVF repayment
        cap, repayment period, covenants, and seniority are not disclosed in the assigned evidence.
      whyItMatters: >-
        These terms determine dilution, effective entry value, downside protection, and whether the
        financing preserves or absorbs future equity upside.
      diligencePath: >-
        Obtain the capitalization table, charter, financing agreements, and a management
        reconciliation of all preference and repayment obligations before setting return targets.
      relatedQuestionRefs: [QV009]
    - type: missing-source
      severity: material
      topic: financial-model
      missingEvidence: >-
        Audited revenue, gross margin, cash flow, customer concentration, and cohort retention data
        needed to translate company-reported ARR into a supportable valuation model.
      whyItMatters: >-
        ARR growth alone cannot establish cash generation, revenue quality, or an exit multiple.
      diligencePath: >-
        Review audited statements, ARR-to-revenue reconciliation, gross-margin bridges, cash-flow
        history, and customer cohorts before calculating target returns.
      relatedQuestionRefs: [QV001, QV004, QV006, QV010]
