        - id: decision
          label: Decision
          value: track / research more
          detail: Verify entry price, cap table, preferences, and repayment economics before a buy call.
          claimRefs: [CV016]
      edges:
        - from: scale
          to: growth
          label: establishes operating relevance
        - from: growth
          to: enterprise
          label: tests revenue quality
        - from: enterprise
          to: product
          label: funds continued expansion
        - from: product
          to: price-gap
          label: product proof does not set price
        - from: price-gap
          to: decision
          label: enforces entry discipline
    approximationNotes: >-
      The flow is qualitative; values reproduce cited metrics and are not normalized or combined
      into a score.
    claimRefs: [CV001, CV002, CV003, CV007, CV008, CV009, CV012, CV014, CV016]
