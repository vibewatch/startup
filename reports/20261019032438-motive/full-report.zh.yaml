  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：一体化车队与实体运营软件
        blocks:
          - type: paragraph
            body: >-
              相关市场比泛企业软件更窄，但又不止 ELD 合规。官方和第三方描述都把 Motive
              定位为实体运营一体化平台，为车队和现场服务组织打包安全、合规、telematics、维护、调度和支出管理工作流。这一定位很重要，因为它同时改变了可比预算池和替代方案：客户面对的现状通常是一组彼此割裂的点工具，而不是一个单一的
              incumbent 产品。因此，Motive 不仅要与直接的车队软件供应商竞争，也要面对内部流程替代方案，以及买方不愿一次性替换多个既有系统的阻力。
            claimRefs:
              - CM001
              - CM002
              - CM010
              - CM011
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM010
      - number: '2.2'
        title: 规模化视角显示品类很大，但公开 SAM/SOM 并不清晰
        blocks:
          - type: paragraph
            body: >-
              现有市场规模证据偏方向性，而非决定性。Futurum 的广义企业软件预测显示宏观软件预算池正在快速扩大；其调查数据则显示供应链和物流软件已在企业 IT 栈中有相当渗透。其他视角指向车队领域的采用动能：451
              Research 称商业运输中的 AI 使用已经广泛；Hylios 则估计北美约有 30 million 辆可服务的商用车，而 Motive 据称已覆盖平台上的 1 million
              辆车。综合来看，这些来源支持一个规模大且仍有渗透空间的品类，但它们混合了金额、调查采用率和装机量，因此更适合作为边界条件，而不是严谨的单一 TAM/SAM/SOM 漏斗。
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM007
              - CM008
              - CM014
              - CM016
