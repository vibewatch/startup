              - CV005
              - CV006
              - CV007
              - CV014
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV007
              - CV008
              - CV009
              - CV012
              - CV014
              - CV016
      - number: '8.2'
        title: 融资背景与入场纪律
        blocks:
          - type: paragraph
            body: >-
              2026 年 9 月的交易代表融资能力，而不是手头现金或新定价股权轮的证据。Motive 称其为 General Catalyst 的 Customer Value Fund 提供的增长融资；WOWTALE
              则将其描述为非稀释性资金，通过已融资 GTM 支出产生的收入中一个有上限的份额偿还。留存来源没有披露上限、偿还期限、契约、优先级或其与现有清算优先权的互动。AI Funding 的 $1.9B
              累计总额也只是汇总融资，不代表可用流动性。因此，在计算稀释、目标回报或下行保护前，入场纪律要求拿到实际证券价格、完全稀释后的资本结构、优先股堆叠及 CVF 偿还经济性。
            claimRefs:
              - CV003
              - CV005
              - CV006
              - CV010
              - CV013
              - CV014
              - CV016
      - number: '8.3'
        title: 论文与反论文
        blocks:
          - type: paragraph
            body: >-
              投资论文建立在规模、企业扩张和持续产品交付上。Motive 称 2025 年有近 100,000 个客户和 1.3M 名司机使用平台；2026 年 9 月，公司报告支出超过 $100,000 的客户 ARR
              同比增长近 60%，净收入留存率高于 120%。公司还将 Agents
              作为可用工作流产品推出，但其所谓十倍更快的决策结果仍是公司口径，没有独立测量。反论文是，私募市场不透明可能掩盖昂贵的融资条款，公开市场价格发现被推迟，而另一家供应商认为企业 telematics
              供应商正面临更高价格和更长合同的压力。公司报告的强劲采用本身并不能解决估值或客户负担能力风险。
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV011
              - CV012
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV005
              - CV007
              - CV008
