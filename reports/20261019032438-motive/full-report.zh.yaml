  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 运营规模和产品活动足以支持继续尽调，但融资与价格不透明，使建议仍停留在跟踪 / 继续研究。
    data:
      nodes:
        - id: scale
          label: 规模证明
          value: $600M+ ARR
          detail: 公司报告的 ARR 已突破 $600 million。
          claimRefs:
            - CV007
        - id: growth
          label: 增长证明
          value: 30% YoY
          detail: 公司报告的 ARR 同比增长加速至 30%。
          claimRefs:
            - CV008
        - id: enterprise
          label: 企业证明
          value: '>120% NRR'
          detail: 大客户 ARR 增长近 60%，净收入留存率超过 120%。
          claimRefs:
            - CV009
        - id: product
          label: 产品活动
          value: Agents available
          detail: Motive 称其工作流 Agents 产品目前已可用。
          claimRefs:
            - CV012
        - id: price-gap
          label: 价格与条款缺口
          value: $2.1B-$2.85B anchors
          detail: 已公布的锚点相互冲突，新融资也未披露估值。
          claimRefs:
            - CV001
            - CV002
            - CV003
            - CV014
        - id: decision
          label: 决策
          value: track / research more
          detail: 在给出买入判断前，核实入场价格、股权结构表、优先权和偿还经济性。
          claimRefs:
            - CV016
      edges:
        - from: scale
          to: growth
          label: 证明运营相关性
        - from: growth
          to: enterprise
          label: 检验收入质量
        - from: enterprise
          to: product
          label: 为持续扩张提供资金
        - from: product
          to: price-gap
          label: 产品验证不决定定价
        - from: price-gap
          to: decision
          label: 严守进入纪律
    approximationNotes: 该流程图为定性描述；数值复现所引来源中的指标，未经标准化，也未合并为单一评分。
