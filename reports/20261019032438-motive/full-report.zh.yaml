  - id: FP001
    title: 竞争定位图
    type: quadrant
    summary: 在保留的来源中，Motive 和 Samsara 占据最广的一体化平台位置；Fleetio 和人工现状在 AI 驱动的安全深度上则更低。
    data:
      xAxis:
        label: 覆盖车队工作流的平台广度（1=窄，5=广）
        min: 1
        max: 5
      yAxis:
        label: 保留来源所描述的 AI / 自动化深度（1=低，5=高）
        min: 1
        max: 5
      points:
        - label: Motive
          x: 5
          'y': 5
          tone: positive
          detail: 集成安全、ELD、支出、维护和运营工作流，并扩展 AI Dashcam Plus、Atlas、Automations 和 AI Vision。
        - label: Samsara
          x: 5
          'y': 4
          tone: neutral
          detail: 集成运营、安全和车联网平台，覆盖 AI 行车摄像头和司机辅导。
        - label: Geotab
          x: 4
          'y': 3
          tone: neutral
          detail: 车联网、合规、分析和市场生态深度较强；保留来源更强调生态灵活性，而不是差异化的边缘 AI 硬件。
        - label: Verizon Connect
          x: 3
          'y': 2
          tone: warning
          detail: 企业可视化和路线规划定位清晰，但保留来源强调报价结构和可视化，而非差异化 AI 深度。
        - label: Fleetio
          x: 2
          'y': 1
          tone: warning
          detail: 以维护为先的产品，公开按车辆定价；车联网、摄像头和 ELD 依赖集成。
        - label: 人工现状
          x: 1
          'y': 1
          tone: risk
          detail: 电子表格和电话沟通前期成本最低，但提供的集成式安全、合规和可视化能力也最少。
    approximationNotes: 坐标是根据保留来源描述综合出的、有证据支撑的序数评分，不是供应商报告的数值基准。
