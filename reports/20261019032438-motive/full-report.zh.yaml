              - CP015
      - number: '3.4'
        title: 持久性与被替代风险
        blocks:
          - type: paragraph
            body: >-
              公开规模和融资信号表明，Motive 比狭窄功能型供应商更能承受竞争压力，但这并没有消除执行风险。Motive 称其服务近 100,000 个客户和 1.3M 名司机，截至 2026 年 9 月 ARR 已突破
              $600M，并通过 2025 年 $150M 轮融资和 2026 年超过 $1.3B 的增长融资为产品及 GTM 扩张提供资金。这些事实支持其分销和产品投入的持久性。本次证据较弱之处在于，没有提供
              Motive、Samsara、Geotab 和 Verizon Connect 针对误报、实际 ROI 和合同经济性的独立并列基准。若现场表现或总成本没有营销表面显示的那么差异化，incumbent
              或更窄的专业供应商仍可能削弱 Motive 的 AI 叙事。
            claimRefs:
              - CP011
              - CP012
              - CP013
              - CP014
              - CP015
      - number: '3.5'
        title: 展示项
        blocks:
          - type: callout
            title: 为什么 Motive 仍然难以被替代
            body: 本次证据支持平台广度、AI 重度安全硬件、客户规模和新资本的真实组合；相比狭窄功能型产品，这一组合更强，也比早期挑战者故事更可信。
            calloutType: strength
            claimRefs:
              - CP008
              - CP009
              - CP011
              - CP012
              - CP013
          - type: callout
            title: 竞争优势仍不够扎实的地方
            body: 公开定价、合同经济性和独立正面对比基准弱于产品营销表面，因此买方在认定 Motive 的优势可持续之前，仍需要现场试点和逐报价尽调。
            calloutType: risk
            claimRefs:
              - CP014
              - CP015
