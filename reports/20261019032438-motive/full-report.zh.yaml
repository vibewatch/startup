  - id: FI001
    title: 公开收入模型桥接
    type: flow
    summary: 公开证据表明，捆绑式经常性订阅和企业加购推动 ARR 增长；但硬件结构和不透明的融资条款，使利润率和资本充足性只能部分纳入投资判断。
    data:
      nodes:
        - id: bundle
          label: 捆绑式平台
          summary: Safety, compliance, tracking, maintenance, and spend workflows are sold inside one operating platform.
          claimRefs:
            - CI009
        - id: pricing
          label: 公开标价
          summary: Only one third-party review in the pool exposes freemium, per-vehicle, and hardware entry prices.
          note: 实际定价和折扣情况仍未披露。
          claimRefs:
            - CI010
        - id: upsell
          label: 企业扩张
          summary: Large-account ARR more than doubled since 2024 and then grew nearly 60% YoY in 2026.
          claimRefs:
            - CI004
            - CI007
        - id: scale
          label: 经常性收入规模
          value: 600
          unit: USDm+ ARR
          summary: Motive said ARR crossed $600 million with 30% YoY growth in September 2026.
          claimRefs:
            - CI006
        - id: margin
          label: 利润率约束
          value: 70
          unit: '% gross margin (2025 S-1 synthesis)'
          summary: Third-party synthesis says hardware mix capped 2025 gross margin at 70% and left operating margins negative.
          claimRefs:
            - CI012
            - CI013
        - id: capital
          label: 资本再循环
          value: 1300
          unit: USDm+ financing
          summary: The 2026 CVF financing funds more AI and GTM investment after the IPO withdrawal.
          note: 当前估值和偿还经济性仍未公开披露。
          claimRefs:
            - CI005
            - CI008
            - CI015
      edges:
        - from: bundle
          to: pricing
          label: 通过订阅和硬件变现
          claimRefs:
            - CI009
            - CI010
        - from: pricing
          to: upsell
          label: 切入更广泛车队采用的入口
          claimRefs:
            - CI010
            - CI004
        - from: upsell
          to: scale
          label: 扩张推动 ARR 增长
          claimRefs:
            - CI004
            - CI006
            - CI007
        - from: scale
          to: margin
          label: 规模尚不能保证软件式利润率
          claimRefs:
            - CI012
            - CI013
        - from: margin
          to: capital
          label: 外部融资支持下一轮投资周期
          claimRefs:
            - CI005
            - CI008
            - CI015
    approximationNotes: 仅使用公开且有来源支撑的检查点，而非完整量化的桥接，因为资料池没有披露收入结构、实际定价或当前成本结构。
    claimRefs:
      - CI004
      - CI005
      - CI006
      - CI007
      - CI010
      - CI012
      - CI013
      - CI015
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 公开证据指向一套硬件加云端的架构：现场采集、统一工作流数据、AI 自动化和企业治理，都封装在一个运营平台中。
    data:
      layers:
        - label: 边缘与现场采集
          detail: 车内和现场数据采集从硬件及移动工作流开始。
          modules:
            - AI 行车摄像头
            - ELD 与合规设备
            - 车辆与设备遥测
            - 司机及现场移动工作流
        - label: 合规与运营状态
          detail: 核心车队状态由日志、路线和司机活动共同构成。
          modules:
            - GPS 跟踪
            - 调度与路线规划数据
            - 工时与合规记录
        - label: 统一工作流数据
          detail: 后台界面整合运营和财务上下文。
          modules:
            - 分析
            - 文档
            - 车队、支出与维护上下文
        - label: 工作流与 AI 自动化
          detail: 平台的自动化层建立在共享数据模型之上。
          modules:
            - Automations
            - Atlas 助手
            - AI 辅导、欺诈检测与预防性维护
        - label: 合作伙伴生态
          detail: 集成将核心架构延伸至邻近运营系统。
          modules:
            - 路线规划与调度合作伙伴
            - 燃料、保险与维护数据流
            - OEM 与市场生态集成
        - label: 安全与治理
          detail: 信任控制被定位为平台层，而不是单独的附加模块。
          modules:
            - 安全与隐私控制
            - 访问治理
            - 合规监督
    approximationNotes: 这是根据公开工作流描述做出的结构性综合，不是官方参考架构或部署图。
    claimRefs:
      - CE001
      - CE002
      - CE005
      - CE007
      - CE008
      - CE014
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: Motive 的公开客户故事从广泛的车队痛点开始，通过安全试点验证价值，随后扩展到更高价值的企业客户和邻近工作流。
    data:
      items:
        - label: 广泛的实体运营买方群
          actor: 安全、运营与财务负责人
          stage: 入口界面
          touchpoints:
            - 交通运输、物流、建筑、公用事业、农业、食品饮料和公共部门
            - 客户覆盖小企业到《财富》500 强企业
          tone: neutral
        - label: 以安全为主导的评估
          actor: 车队安全团队
          stage: 验证步骤
          touchpoints:
            - IDC 支持的客户证据中，横向对比试点反复出现
            - AI 检测准确率被定位为首要购买标准
          tone: neutral
        - label: 生产环境司机安全铺开
          actor: 司机与管理者
          stage: 初始部署
          touchpoints:
            - 摄像头、事件采集和辅导工作流构成最清晰的公开结果基础
            - 报告中的 ROI 主要体现为减少碰撞、提高辅导效率和保险影响
          tone: positive
        - label: 点名客户的社会证明
          actor: 企业潜在客户
          stage: 商业验证
          touchpoints:
            - FedEx Freight、Cintas、KONE、Davey Tree、ABM 和 CRH 出现在保留的官方材料中
            - 公开证据很少披露这些客户的模块深度或铺开范围
          tone: opportunity
        - label: 企业扩张
          actor: 支出超过 $100k 的大客户
          stage: 扩张循环
          touchpoints:
            - 官方公告称该客户群 ARR 自 2024 年以来增长逾一倍
            - 2026 年 9 月披露的信息新增近 60% 的同比增长和高于 120% 的 NRR
          tone: positive
        - label: 剩余尽调循环
          actor: 投资者与尽调团队
          stage: 待解问题
          touchpoints:
            - 头部客户集中度、GRR、流失率和渠道结构仍未披露
            - 该资料池中的独立客户验证覆盖仍薄于官方证据
          tone: risk
    claimRefs:
      - CU001
      - CU003
      - CU006
      - CU011
      - CU012
      - CU015
