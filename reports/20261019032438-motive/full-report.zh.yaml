        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              Motive 的资本故事从传统的私募转 IPO 路径，转向资本更充足但透明度更低的路径。2025 年 7 月，Motive 融资 $150M，用于扩大 AI、地域覆盖和 GTM 能力；2026 年 9
              月，公司又宣布 General Catalyst 的 Customer Value Fund 提供超过 $1.3B 的增长融资，并撤回 S-1。官方说法是，这笔融资将支持持续的产品和 GTM
              扩张，同时保留日后上市的选择，但公开记录仍缺少当前估值、交割后现金余额、类债务条款、偿还时间表及稀释影响。新融资显然改善了近期灵活性，但投资者仍无法仅凭公开材料量化 runway 或融资成本。
