      - number: '4.2'
        title: 单位经济学与成本结构
        blocks:
          - type: paragraph
            body: >-
              公开单位经济学显示扩张和留存趋势积极，但成本效率仍不完整。官方公告显示企业 upsell 强劲：2026 年 ARR 超过 $100,000 的客户同比增长近 60%，此前自 2024
              年以来已翻倍以上；在公司选定的 cohort 中，净收入留存率仍高于 120% 至 130%。独立评论补充了一些利润率背景：Frost 称 Motive 的年化 ARR 接近 $500M，且自 2024
              年末起现金流为正；ValueAddVC 对撤回的 S-1 的综合分析则引用 2025 年前九个月收入 $327.3M、毛利率 70%，并认为硬件和经营亏损仍限制现金生成。因此
              CAC、回收期、总收入留存和当前毛利率仍是重要尽调问题，而不是已经完成投资评估确认的事实。
