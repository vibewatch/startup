      - number: '1.3'
        title: 资本历史、规模指标与利益相关方地图
        blocks:
          - type: paragraph
            body: >-
              Motive 最近的资本故事是一次跃迁，而不是早期私募轮次的平稳延续。2025 年 7 月，公司宣布由 Kleiner Perkins 领投、AllianceBernstein 作为新投资者参与的 $150M
              轮融资；2026 年 9 月，公司宣布 General Catalyst 的 Customer Value Fund 提供超过 $1.3B 的增长融资，并让 Pranav Singhvi
              加入董事会。当前证据支持有意义但质量不一的规模指标：公司多次称客户接近 100,000、司机达 1.3M；S-1 披露 2024 年收入 $370.5M、毛利率 70%；2026 年 9 月融资更新称 ARR
              已突破 $600M，同比增长 30%。缺失的信息同样重要：在本次证据中，2026 年融资的工具设计、契约、稀释和现金流影响均未公开，因此资本结构的确定性仍落后于运营规模的确定性。
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO009
              - CO010
              - CO011
              - CO012
          - type: table
            tableRef: TO003
            claimRefs:
