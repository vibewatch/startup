      - number: '3.2'
        title: 产品范围与购买标准差异化
        blocks:
          - type: paragraph
            body: >-
              本次证据中，Motive 最清晰的差异化不是泛 telematics，而是一体化工作流广度与 AI 重度安全硬件的结合。Motive 及联合发布材料称，AI Dashcam Plus
              将车辆网关与行车记录仪合二为一，安装时间几乎缩短一半，并在 Qualcomm 处理器上运行超过 30 个 AI 模型，AI 处理能力是其他领先行车记录仪的三倍。FleetPoint 还显示 Motive
              已从摄像头扩展到 Atlas、Automations 和更广泛的 AI Vision 工作流。在此背景下，StackBriefly 将 Samsara 定位为另一家广泛的一体化平台，将 Geotab
              定位为灵活的数据和生态系统选项，将 Verizon Connect 定位为企业可视化 incumbent，将 Fleetio 定位为维护优先的替代方案。
