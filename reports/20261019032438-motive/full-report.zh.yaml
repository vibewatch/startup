companyProfile:
  summary: >-
    Motive 是一家由创始人主导、总部位于旧金山的实体运营软件公司，已从 ELD 合规扩展到更广泛的平台，覆盖安全、车队管理、设备监控、支出管理、劳动力流程和 AI
    辅助自动化。公开证据支持其已具备真实规模、企业扩张和较宽的产品覆盖，但当前融资结构、估值、客户集中度及部分单位经济学输入仍存在重大不透明。
  foundedDate: 2013-03-01T00:00:00.000Z
  founders:
    - name: Shoaib Makani
      role: 联合创始人兼 CEO
      background: 主导 Motive 产品、平台和资本战略的创始人兼 CEO。
    - name: Ryan Johns
      role: 联合创始人
      background: 早期创始人之一，与公司最初的 telematics 根基有关。
    - name: Obaid Khan
      role: 联合创始人
      background: 早期创始人之一，与公司最初的 telematics 根基有关。
  foundingLocation: San Francisco, California
  headquarters: San Francisco, California
  productSummary: Motive 销售统一的车队与实体运营平台，把 telematics 硬件、云软件、AI 工作流、安全工具、支出控制、维护和劳动力管理整合在一起。
  customerFocus: 交通运输、物流、建筑、公用事业、现场服务及其他实体运营团队。
  businessModel: 以报价为基础的经常性软件和硬件销售，平台变现集中在车队运营工作流和企业扩张。
  stage: late-stage venture
  fundingStatus: General Catalyst 的 Customer Value Fund 在 2025 年 7 月的 $150M 轮融资之后，又提供了超过 $1.3B 的增长融资；公司随后撤回了 S-1。
  disclosureProfile: private-disclosed
chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与运营范围
        blocks:
          - type: paragraph
            body: >-
              现有证据充分支持 Motive 的稳定身份：公司于 2013 年 3 月在特拉华州注册成立，原名 Keep Truckin, Inc.，主要执行办公室仍位于旧金山 1355 Market
              Street。如今的产品定位已不再局限于 telematics。Motive 现在将自己定位为实体运营 AI 平台，而本次证据中最可复用的分类，是 S-1 和帮助中心概览中的六产品组合：Driver
              Safety、Fleet Management、Equipment Monitoring、Spend Management、Workforce Management 和 AI
              Vision。独立资料大体认同公司已从只做合规起步，走向覆盖多类工作流的运营栈，尽管外部评测仍常从车队和卡车运输角度描述这个品牌。
            claimRefs:
              - CO001
              - CO002
