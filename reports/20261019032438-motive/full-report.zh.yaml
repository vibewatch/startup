      - number: '1.4'
        title: 里程碑与不利背景
        blocks:
          - type: paragraph
            body: >-
              里程碑记录显示，公司正从安全和合规扩展为更完整的实体运营系统。根据本次证据可追溯的路径是：2013 年注册成立；2017 年开发 AI 模型；2019 年推出 Equipment Monitoring；2022
              年推出 Spend Management / Motive Card；2024 年扩展 AI Vision 和 Workforce Management；2025 年完成融资并提交 S-1；2026
              年因融资而撤回该申报。主要不利背景不是公开运营失误，而是法律和商业不确定性。S-1 详述了正在进行的 Samsara 诉讼，该案计划于 2027 年审理；独立评测则称 Motive
              的广度伴随定价不透明、多年期合同，而且最适合重合规的卡车运输，不一定适合所有现场车队细分市场。
