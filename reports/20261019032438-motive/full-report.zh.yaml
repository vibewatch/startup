    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与公开 traction
        blocks:
          - type: paragraph
            body: >-
              公开证据支持一种围绕车队安全、合规、telematics、维护和支出管理工作流建立的多产品经常性收入模式，但没有披露完整投资评估所需的产品线收入结构或收入确认细节。Motive 自己在 2025 年和 2026
              年的公告中始终将公司描述为覆盖安全、运营和财务的一体化运营平台；本次证据中，只有一家第三方评测披露了自助服务和硬件入口的类似公开标价。最强的相互印证增长数据集中在收入顶线和企业 cohort：Motive 称截至
              2026 年 9 月 ARR 已突破 $600M，同比增长 30%；此前公司于 2025 年 7 月披露，ARR 超过 $100,000 的客户自 2024 年以来已翻倍以上。
