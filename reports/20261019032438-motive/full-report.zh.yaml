              - CV014
              - CV015
      - number: '8.4'
        title: 情景、退出准备度与尽调触发器
        blocks:
          - type: paragraph
            body: >-
              情景分析应把已发布锚点当作边界，而不是资本结构模型的替代品。悲观情景是有效价值落在 QuantLogix 的 $2.1B
              估算或以下，原因可能是结构化融资义务、倍数压缩或增长放缓损害股权价值。在可信的定价交易重置区间前，基准情景仍处在 $2.1B 估算和最后披露的 $2.85B 之间。乐观情景是 Airpinpoint 提出的
              $4B 至 $6B IPO 结果，但这只是低置信度的竞争对手预测，而非独立基准。Motive 的运营退出准备度有所改善，但撤回 S-1
              使程序性准备度倒退。重新提交、经审计的经济性数据以及融资条款的一手证据，是上调建议的最低触发条件。
            claimRefs:
              - CV001
