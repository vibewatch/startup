          - type: callout
            title: 法律下行可监测，但仍缺乏充分文档
            body: 留存来源支持一个营销 substantiation 问题和激进的竞争定位，但没有提供更广泛 IP 或商业秘密敞口的当前法院文件细节。因此，当前法律风险仍是中高水平的剩余敞口，而不是今天就会破坏论文的事件。
            calloutType: assumption
            claimRefs:
              - CR006
              - CR014
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与估值立场
        blocks:
          - type: paragraph
            body: >-
              Motive 应继续留在投资观察名单上，但现有证据支持的是跟踪 / 继续研究，而不是买入。公司称 ARR 已突破 $600M、同比增长 30%；独立报道确认，超过 $1.3B 的增长融资使 Motive 能够撤回
              S-1。这些事实改善了运营和融资韧性，却没有揭示新的股权价格。QuantLogix 发布 $2.1B 的模型估算；WOWTALE 指出 2022 年的 $2.85B 是最后一次披露的估值；另一家供应商则猜测
              IPO 结果可能为 $4B 至 $6B。这个区间过宽，且证据质量差异过大，不足以支持不考虑价格的建议。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
