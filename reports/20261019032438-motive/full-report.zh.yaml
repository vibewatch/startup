      - number: '2.3'
        title: 买方分层偏向多利益相关方销售，并具备企业扩张空间
        blocks:
          - type: paragraph
            body: >-
              公开证据显示，买方地图从重合规的卡车车队出发，延伸到建筑、能源、公用事业、现场服务、制造、农业和公共部门运营。潜在用户包括司机、调度员、安全经理和车队运营人员；付款方则可能属于运营、安全、财务或共享企业技术预算，取决于部署起点是合规、安全、支出还是平台整合需求。这种多利益相关方模式与
              Motive 自己的企业扩张口径一致：公司称，ARR 超过 $100,000 的客户增长快于整体客户基础，说明车队一旦落地一个工作流，向相邻模块交叉销售就能扩大预算范围。
            claimRefs:
              - CM009
              - CM010
              - CM014
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM010
              - CM012
              - CM015
      - number: '2.4'
        title: 需求驱动真实存在，但切换摩擦和证据缺口仍然重要
        blocks:
          - type: paragraph
            body: >-
              公开记录中最强的需求驱动因素是整合、价值实现速度以及对 AI 辅助供应链工作流日益增长的需求。这些因素有利于 Motive
              的一体化定位，尤其是在买方希望用一个运营层替换碎片化工具时。但同一批证据也揭示了真实约束：OEM
              数据碎片化、隐私担忧、实施复杂度、定价不透明以及拥挤的竞争格局，都可能拖慢转化，或限制广泛品类中真正可触达的收入。对尽调而言，最大的缺口是公开来源没有提供中立、逐细分市场的
              SAM/SOM，也没有清楚说明各垂直行业的预算归属，因此要把品类广度转化为具体收入上限，仍需要管理层提供 cohort、赢单率和 ACV 数据。
            claimRefs:
              - CM006
              - CM007
              - CM011
              - CM012
              - CM013
              - CM016
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              留存的对比证据把 Motive 放进实际买方决策集合，而不是一个整齐的单一 peer group。StackBriefly 将 Motive 与 Samsara、Geotab、Verizon Connect 和
              Fleetio 比较，并明确指出，车队往往先靠电子表格和电话沟通，直到路线、合规、安全、维护和燃油工作流复杂到无法手工管理。这很关键，因为 Motive
              不只是在对抗一个直接软件对手，还要面对已经掌握可视化或维护流程的 incumbent，以及完全没有一体化平台的低成本现状。在这一集合中，Motive 最清晰的定位是安全和重合规实体运营。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
