      - number: '3.3'
        title: 定价、产品打包与切换摩擦
        blocks:
          - type: paragraph
            body: >-
              定价证据足以显示买方摩擦所在，但不足以支持公开的同口径价格比较。StackBriefly 称 Fleetio 得益于公开的按车定价；Verizon Connect
              则要求书面报价，并拆分设备、软件、支持、安装和合同条款。同一来源称，Samsara 买方需要核实硬件成本和合同范围，Geotab 买方则要先弄清套餐、合作伙伴和附加组件选择，才能比较价格。对于
              Motive，本次证据支持其产品广度和产品口径，却没有公开标价或实际折扣。因而部署、合同结构和所需硬件是真正需要尽调的切换成本领域，而不是已被证明的优势。
            claimRefs:
              - CP006
              - CP008
              - CP014
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
