              - CO012
      - number: '1.2'
        title: 领导层、治理与关键人物依赖
        blocks:
          - type: paragraph
            body: >-
              现有领导层证据集中，但方向清晰。Shoaib Makani 仍是联合创始人兼 CEO；Chirag Shah 以 CFO 身份代表公司谈论当前融资动能；Thomas Hansen 于 2026 年被任命为首任
              Go-to-Market 总裁；S-1 将 Shu White 列为 Chief Legal Officer。治理结构仍以创始人为中心，而非机构化制衡：S-1 表示 IPO 后 Makani 的 B
              类股将控制股东投票权，并明确警告公司高度依赖他掌握技术、产品、平台愿景和战略方向。这种结构有利于速度，但也提高了新外部资本需要核查的继任、控制权和披露风险。
            claimRefs:
              - CO013
              - CO014
