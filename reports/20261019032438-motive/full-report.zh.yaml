          - type: paragraph
            body: >-
              从财务上看，Motive 像一家已经形成规模、具备可信企业扩张的经常性软件公司，但还不是一家可以清晰评估的公司。公开乐观情景建立在 ARR 超过 $600M、增长加速和大客户留存强劲之上，这些都支持继续投入
              GTM 和产品。公开悲观情景则是：2026 年融资避开了即时 IPO 价格发现，当前估值仍未披露，而本次证据中的利润率和烧钱细节来自第三方对撤回 S-1
              的综合分析，而非当前审计披露。下一步尽调不是继续收集叙事，而是获取 cohort 收入桥、当前现金与债务时间表、客户集中度、实际定价瀑布和分部毛利率数据。
