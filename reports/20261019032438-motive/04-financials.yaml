callouts:
  - calloutType: "strength"
    title: "Enterprise retention is the cleanest public quality signal"
    body: >-
      The most convincing publicly supported financial signal is not a detailed income statement but the enterprise cohort: Motive said customers above $100,000 of ARR more than doubled since 2024, then still grew nearly 60% year over year in 2026 with net revenue retention above 120%.
    claimRefs: ["CI004", "CI007"]
  - calloutType: "risk"
    title: "Capital is plentiful, but financing quality is still opaque"
    body: >-
      The September 2026 financing removes immediate capital pressure, yet Motive did not disclose a current valuation and the public pool still leaves the Customer Value Fund structure only partially understood, so investors cannot quantify dilution, repayment burden, or true runway from public evidence alone.
    claimRefs: ["CI005", "CI014", "CI015"]
