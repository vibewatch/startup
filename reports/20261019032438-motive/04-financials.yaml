      - ["ARR growth YoY (Sep 2026)", "30%", "High", "Shows reacceleration into the 2026 financing event.", "Quarterly trend by quarter and by cohort."]
      - ["ARR growth from customers >$100k (Sep 2026)", "Nearly 60% YoY", "High", "Indicates enterprise cohort expansion and likely improving sales efficiency at the top end.", "Large-account logo adds, expansion, and churn."]
      - ["Net revenue retention in large accounts (Sep 2026)", ">120%", "High", "Supports expansion-led growth rather than purely new-logo dependence.", "Gross retention and cohort-level NRR distribution."]
      - ["Large-account NRR (Jul 2025)", ">130%", "High", "Suggests strong pre-2026 enterprise retention before the larger financing round.", "Methodology and cohort definition changes, if any."]
      - ["Annualized ARR (Jul 2025 independent report)", "Nearly $500M", "Medium", "Independent check on scale before the 2026 step-up.", "Underlying source document or audited metric definition."]
      - ["Cash-flow positive since late 2024", "Claimed by Frost", "Medium", "Potentially reduces near-term burn risk if sustained.", "Audited cash from operations and free cash flow by quarter."]
      - ["Gross margin (2025 S-1 synthesis)", "70%", "Low", "Shows hardware / services may still dilute software-like economics.", "Current gross margin by software, hardware, and services."]
      - ["Cash balance / runway", null, "Low", "Capital adequacy cannot be quantified without liquidity detail.", "Post-financing cash, monthly burn, and minimum-cash covenant."]
      - ["CAC / payback", null, "Low", "Sales efficiency cannot be underwritten from public evidence alone.", "Cohort CAC, payback, and fully loaded GTM cost."]
    notes: "Official releases support ARR, growth, and large-account retention; Frost and ValueAddVC add less-verifiable unit-economics context; null means the public assigned pool does not disclose the metric."
    claimRefs: ["CI004", "CI006", "CI007", "CI011", "CI012", "CI013"]
