evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financing-structure
    missingEvidence: >-
      The exact structure of the >$1.3B 2026 General Catalyst financing, including whether it is debt-like,
      revenue-linked, or otherwise senior to common equity.
    whyItMatters: >-
      The instrument design could change dilution, cash obligations, downside protection, and eventual IPO readiness
      more than the headline financing size suggests.
    diligencePath: >-
      Obtain the financing agreement, board materials, and any side letters covering covenants, economics, and board or
      consent rights.
    relatedQuestionRefs:
      - QO004
      - QO008
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: material
    topic: customer-concentration
    missingEvidence: >-
      Current top-customer concentration, renewal exposure, and gross/logo churn data for the largest enterprise
      accounts.
    whyItMatters: >-
      Motive's growth narrative increasingly depends on large accounts, so concentration and retention quality directly
      affect revenue durability and valuation.
    diligencePath: Request top-10 customer revenue share, cohort retention by spend band, and the enterprise pipeline-to-close mix.
    relatedQuestionRefs:
      - QO002
      - QO008
    relatedTableRefs:
      - TO001
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-table TO002 public coverage
    missingEvidence: >-
      A complete public leadership roster with role start dates, operating biographies, and board committee assignments
      beyond the named executives and recent financing-linked directors.
    whyItMatters: >-
      The chapter can evidence current leadership direction, but not a full management bench review or
      committee-by-committee governance map from the assigned pool alone.
    diligencePath: >-
      Request the current executive org chart, board composition summary, committee assignments, and biographies for the
      full leadership team.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
  - type: stale
    severity: minor
    topic: headcount
    missingEvidence: A refreshed 2026 employee count or hiring/severance update after the September 30, 2025 S-1 disclosure.
    whyItMatters: >-
      Headcount is a standard cover metric and can signal whether GTM and AI investment pace is accelerating or being
      rationalized.
    diligencePath: >-
      Request an updated org-level headcount by function and geography or a post-S-1 employee metric in management
      materials.
    relatedQuestionRefs:
      - QO002
      - QO008
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: litigation-record
    missingEvidence: >-
      Direct court docket materials, pleadings, and claim-construction filings for the Samsara dispute rather than
      secondary commentary alone.
    whyItMatters: >-
      Injunction risk, damages exposure, and settlement leverage cannot be sized confidently from company narrative and
      tertiary summaries.
    diligencePath: >-
      Pull the Northern District of California docket, the operative complaints and counterclaims, and any mediation or
      scheduling orders.
    relatedQuestionRefs:
      - QO007
  - type: private-evidence-only
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      Segment-level revenue, vehicle, and win-rate data by geography and vertical that can translate broad category
      demand into a real SAM/SOM.
    whyItMatters: >-
      Without this bridge, the market case supports directionally large opportunity but not a defensible revenue ceiling
      for valuation work.
    diligencePath: >-
      Request management cohort data by vertical and geography, then reconcile it against third-party fleet counts and
      replacement cycles.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
      - TM003
  - type: missing-source
    severity: material
    topic: budget-ownership
    missingEvidence: >-
      Independent procurement or public budget evidence showing who signs and funds integrated safety, compliance, and
      spend bundles across core verticals.
    whyItMatters: >-
      Budget ownership affects sales-cycle length, module attach rates, and exposure to incumbent finance or telematics
      vendors.
    diligencePath: >-
      Review customer procurement records and ask management for ACV mix by buyer persona, payer, and initial land
      module.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: >-
      Customer quotes or contracts showing Motive, Samsara, Geotab, and Verizon Connect list pricing, minimum commits,
      hardware charges, and realized discounting.
    whyItMatters: >-
      Without quote-level economics, the chapter can compare pricing transparency but cannot underwrite total cost of
      ownership or switching cost precisely.
    diligencePath: >-
      Request redacted customer proposals or procurement screenshots for each shortlisted vendor and compare software,
      hardware, installation, and contract-term line items.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: independent-benchmarking
    missingEvidence: >-
      Independent side-by-side benchmark data on detection accuracy, false positives, install time, realized ROI, and
      driver adoption across Motive and the main peer set.
    whyItMatters: >-
      The current evidence supports positioning and product claims, but not a fully independent judgment on whether
      Motive's AI and workflow breadth translate into a durable field-performance edge.
    diligencePath: >-
      Collect third-party trials, customer procurement scorecards, insurer studies, or analyst benchmark reports that
      compare Motive, Samsara, Geotab, and Verizon Connect on the same fleet cohort.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP002
      - TP003
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency
    missingEvidence: Cohort CAC, payback, gross retention, and contribution margin by segment and product.
    whyItMatters: >-
      Public ARR and NRR are strong, but without sales-efficiency and retention detail investors cannot judge whether
      growth is capital efficient or merely well funded.
    diligencePath: >-
      Request cohort-level board metrics or banker materials showing CAC, payback, gross retention, and contribution
      margin for SMB, mid-market, and enterprise segments.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Current cash balance, monthly burn, debt facilities, repayment schedule for the CVF financing, and management
      runway case.
    whyItMatters: >-
      The size of the new financing implies improved flexibility, but investors still cannot quantify solvency,
      financing cost, or next-round dependence from public evidence.
    diligencePath: >-
      Obtain the cap table, debt and structured-capital schedules, cash bridge, and board-approved operating plan after
      the 2026 financing.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: pricing-and-revenue-mix
    missingEvidence: >-
      Official current price book, realized discount bands, contract minimums, and revenue mix across software,
      hardware, card/spend, and services.
    whyItMatters: >-
      The public pool supports only directional monetization because realized pricing and revenue mix determine
      gross-margin durability and the quality of ARR.
    diligencePath: >-
      Request current pricing sheets, enterprise contracts, product-line revenue split, and a bridge from list pricing
      to realized ARR and GAAP revenue.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI001
      - TI002
  - type: missing-source
    severity: material
    topic: trust-controls
    missingEvidence: >-
      Independent status-page history, security certifications, audit attestations, or incident-detail records tied to
      Motive's enterprise-grade control claims.
    whyItMatters: Enterprise underwriting depends on verified control maturity and reliability, not just product-page language.
    diligencePath: >-
      Request a security packet covering certifications, uptime/SLA history, incident reporting, and privacy/compliance
      governance.
