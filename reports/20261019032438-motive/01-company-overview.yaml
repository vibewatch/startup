      - ["Kleiner Perkins", "Lead investor in the Jul. 2025 round", "Returned to lead the $150M round and re-seat Ilya Fushman on the board.", "Confirm current ownership, pro-rata rights, and whether 2026 financing altered investor seniority."]
      - ["AllianceBernstein", "New investor in the Jul. 2025 round", "Adds a crossover/public-markets signaling component to the cap table.", "Request check size, rights package, and any liquidity preferences."]
      - ["General Catalyst CVF", "Provider of >$1.3B 2026 growth financing", "Potentially the most economically important recent capital provider and board entrant via Pranav Singhvi.", "Obtain instrument terms, covenants, repayment mechanics, and downside protections."]
      - ["Enterprise customer base", "Commercial counterparties driving scale", "Company says momentum is strongest in customers above $100K ARR and that ARR crossed $600M in 2026.", "Request concentration, renewal, and churn data for top accounts and large-customer cohorts."]
    notes: This is a stakeholder-weighted map rather than a full cap table; it highlights the highest-importance capital and commercial counterparties visible in the assigned pool.
    enumerationScope:
      coverage: partial
      basis: Highest-importance capital and commercial stakeholders visible in the assigned filing and financing evidence, not a complete ownership register.
    claimRefs: [CO006, CO007, CO008, CO009, CO012, CO013]
