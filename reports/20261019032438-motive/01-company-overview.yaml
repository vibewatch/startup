      - ["Customers and drivers", "Nearly 100,000 customers; 1.3M drivers", "2025-07-30 and 2026-09-10", "high", "Repeated across two company financing announcements."]
      - ["Employee count", "4,508 employees", "2025-09-30", "medium", "No refreshed 2026 headcount was retained in this pool."]
      - ["Capital status", "$150M 2025 round; >$1.3B 2026 growth financing", "2025-07-30 / 2026-09-10", "medium", "2026 structure and economics are not public in the assigned evidence."]
      - ["IPO status", "S-1 filed, then withdrawn after new financing", "2025-12-23 / 2026-09-10", "medium", "Future listing timing remains undisclosed."]
    notes: Latest public operating metrics mix filing-backed 2024/2025 figures with later company-announced 2026 financing updates; null is avoided here by labeling unsupported freshness directly in the gap column.
