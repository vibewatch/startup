company:
  name: Motive
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Motive is a San Francisco-founded, founder-led physical-operations software company that has expanded from ELD roots into a broader safety, fleet, equipment, spend, workforce, and AI platform. The strongest current scale evidence in the assigned pool is company-issued: Motive disclosed $370.5 million of 2024 revenue in its December 2025 S-1, then said in September 2026 that ARR had crossed $600 million after securing more than $1.3 billion of growth financing from General Catalyst's Customer Value Fund. Governance and diligence risk still center on concentrated founder control, limited public detail on the 2026 financing structure, and active Samsara litigation.
sections:
  - id: identity-and-scope
    title: Identity and operating scope
    body: >-
      Motive's durable identity is well supported in the pool: the company was incorporated in Delaware in March 2013 as Keep Truckin, Inc., and its principal executive offices remain at 1355 Market Street in San Francisco. Current product positioning is no longer narrow telematics. Motive now presents itself as an AI platform for physical operations, and the most reusable taxonomy in the assigned evidence is the six-product grouping from the S-1 and help-center overview: Driver Safety, Fleet Management, Equipment Monitoring, Spend Management, Workforce Management, and AI Vision. Independent profiles broadly agree that the company has moved beyond compliance-only origins into a multi-workflow operating stack, even if external reviewers still describe the brand through a fleet-and-trucking lens.
    claimRefs: [CO001, CO002]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership, governance, and key-person dependence
    body: >-
      The named leadership evidence in the pool is concentrated but directionally clear. Shoaib Makani remains the co-founder and CEO, Chirag Shah is the CFO speaking for current financing momentum, Thomas Hansen was named first President, Go-to-Market in 2026, and Shu White is listed as Chief Legal Officer in the S-1. The governance structure is still founder-centric rather than institutionally balanced: the S-1 says Makani's Class B stock would control stockholder votes after an IPO, and the same filing explicitly warns that the business is highly dependent on him for technology, products, platform vision, and strategic direction. That combination is workable for speed, but it heightens succession, control, and disclosure diligence for any new outside capital.
    claimRefs: [CO013, CO014]
    tableRefs: [TO002]
  - id: capital-scale-and-stakeholders
    title: Capital history, scale markers, and stakeholder map
    body: >-
      Motive's recent capital story is a step change rather than a steady continuation of its earlier private rounds. In July 2025 the company announced a $150 million round led by Kleiner Perkins with AllianceBernstein as a new investor, and in September 2026 it announced more than $1.3 billion of growth financing from General Catalyst's Customer Value Fund while adding Pranav Singhvi to the board. The current pool supports meaningful but mixed-quality scale markers: company statements repeated nearly 100,000 customers and 1.3 million drivers, the S-1 disclosed $370.5 million of 2024 revenue and 70% gross margin, and the September 2026 financing update said ARR crossed $600 million with 30% year-over-year growth. What remains missing is as important as what is present: the instrument design, covenants, dilution, and cash-flow implications of the 2026 financing are not public in this pool, so capital structure certainty still lags operating-scale certainty.
    claimRefs: [CO006, CO007, CO008, CO009, CO010, CO011, CO012]
    tableRefs: [TO003]
  - id: milestones-and-adverse-context
    title: Milestones and adverse context
    body: >-
      The milestone record shows a company broadening from safety and compliance into a fuller operating system for physical operations. The dated path that is sourceable from the assigned pool runs from 2013 incorporation, through 2017 AI-model development and the 2019 Equipment Monitoring launch, to the 2022 Spend Management/Motive Card launch, the 2024 AI Vision and Workforce Management expansion, the 2025 funding and S-1 filing, and the 2026 financing-led withdrawal of that filing. The main adverse context is not a public operating stumble but legal and commercial uncertainty. The S-1 details ongoing Samsara litigation that is scheduled for trial in 2027, while independent reviews say Motive's breadth comes with opaque pricing, multi-year contracts, and a fit that is strongest in compliance-heavy trucking rather than every field-fleet segment.
    claimRefs: [CO003, CO004, CO005, CO006, CO012, CO015, CO016]
    figureRefs: [FO001]
