      - ["Chirag Shah", "Chief Financial Officer", "Quoted in the Sep. 2026 financing announcement as CFO.", "Capital formation, investor messaging, and scaling economics.", "High for financing execution and public-markets readiness."]
      - ["Thomas Hansen", "President, Go-to-Market", "Named in 2026 as Motive's first President, Go-to-Market after roles at Amplitude, UiPath, Dropbox, and Microsoft.", "Enterprise GTM coverage as Motive pushes larger global accounts.", "Medium-high because enterprise expansion is a core part of the current thesis."]
      - ["Shu White", "Chief Legal Officer", "Listed on the S-1 cover as Chief Legal Officer.", "Legal, compliance, IPO, and major litigation execution.", "Medium, but elevated while the Samsara dispute and financing disclosures remain live."]
      - ["Pranav Singhvi", "Board member / General Catalyst managing director", "Joined the board as part of the Sep. 2026 General Catalyst financing.", "Structured-growth-capital representation and board-level financing influence.", "Medium; relevance depends on 2026 financing governance rights."]
    notes: Public leadership evidence in the assigned pool is partial rather than exhaustive and is strongest for the founder-CEO, finance, legal, and 2026 GTM/board additions.
