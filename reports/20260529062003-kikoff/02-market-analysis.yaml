figures:
  - id: FM001
    title: Market sizing lens
    type: pyramid
    layout: standard
    summary: >-
      Evidence-constrained market hierarchy for Kikoff's category, ordered from structural need to the
      adjacent debt-workout pool rather than forcing false revenue TAM math.
    data:
      items:
        - label: Structural need pool
          value: "~45M"
          detail: "Combined CFPB benchmark for credit-invisible and unscored adults; lower-bound need pool rather than current annual customers."
        - label: Serviceable bank-connected pool
          value: "19.0M"
          detail: "Underbanked households already using bank and nonbank services, making digital onboarding more plausible than for fully unbanked consumers."
        - label: Current annual friction pool
          value: "34% apply / one-third denied or partial"
          detail: "Federal Reserve's annual lending-flow lens for adults encountering approval friction in 2024."
        - label: Adjacent debt-workout pool
          value: "~1 in 13"
          detail: "Consumers with a credit record touched by debt settlement or credit counseling over 2007-2019, highlighting adjacent repair demand."
    approximationNotes: >-
      Layers use different but source-backed units and therefore should be read as nested demand lenses,
      not additive TAM/SAM/SOM slices. That is intentional because public market data does not isolate a
      single comparable revenue pool for digital credit building.
    claimRefs: [CM011, CM015, CM018, CM025, CM034, CM035, CM036, CM037, CM038, CM046]
  - id: FM002
    title: Need-pool comparison across public sources
    type: bar
    layout: standard
    summary: >-
      Normalized public percentages showing how credit-building need appears across file-depth,
      banking-access, and current credit-friction datasets.
    data:
      items:
        - label: "Limited-file adults (CFPB invisible + unscored)"
          value: 19.3
          unit: "% of adults"
          note: "11.0% credit invisible plus 8.3% unscored in CFPB benchmark data."
        - label: "Underbanked households"
          value: 14.2
          unit: "% of households"
          note: "FDIC 2023 serviceable bank-connected lens."
        - label: "Adults experiencing annual application friction"
          value: 11.3
          unit: "% of adults (derived)"
          note: "34% of adults applied for credit in 2024 and one-third of applicants were denied or partially approved; derived multiplication for comparability."
        - label: "Unbanked adults"
          value: 6
          unit: "% of adults"
          note: "Federal Reserve 2024 banking and credit section."
    approximationNotes: >-
      The third bar is an author-derived comparability metric based on two Federal Reserve percentages,
      while the others are directly reported source figures. Household and adult denominators are close
      but not identical, so the chart is directional rather than precise TAM arithmetic.
    claimRefs: [CM012, CM015, CM017, CM018, CM034, CM037, CM046]
