callouts:
  - calloutType: insight
    title: Need is easier to prove than revenue TAM
    body: >-
      The public record supports a large inclusion problem, but not a clean digital credit-building
      revenue TAM. The strongest chapter evidence therefore uses structural-need, serviceable-pool, and
      annual-friction lenses instead of pretending public data cleanly isolates Kikoff-like revenue.
    claimRefs: [CM034, CM035, CM036, CM037, CM046]
  - calloutType: risk
    title: Bureau fragmentation caps certainty of score lift
    body: >-
      Products can legitimately improve some files without guaranteeing mainstream lender outcomes.
      Separate bureau files, single-bureau add-ons, and FICO seasoning rules mean credit-building value
      is often real but heterogeneous.
    claimRefs: [CM007, CM008, CM026, CM040, CM041, CM045]
  - calloutType: risk
    title: Debt-relief adjacency raises regulatory contamination risk
    body: >-
      The more a provider sounds like debt settlement or credit repair rather than file building, the
      more it inherits FTC fee rules and CFPB skepticism toward marketing promises.
    claimRefs: [CM023, CM024, CM025, CM043]
