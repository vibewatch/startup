  evidenceGaps:
  - type: missing-source
    severity: material
    topic: service-level-transparency
    missingEvidence: A public status page, uptime target, incident archive, or security-certification surface for Kikoff’s consumer products.
    whyItMatters: Without public service-level evidence, reliability and security posture have to be inferred from marketing copy and legal disclosures rather than monitored directly.
    diligencePath: Request internal uptime reports, incident postmortems, vendor-security attestations, and any customer-facing SLA schedules for the core app, reporting connectors, and secured-card stack.
    relatedQuestionRefs:
    - QE024
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: ai-governance
    missingEvidence: The model architecture, collector coverage, human-review workflow, consent controls, and error-handling rules behind AI Debt Negotiator.
    whyItMatters: Debt-negotiation automation touches consumer harm, settlement accuracy, and compliance risk, so product claims without control-plane detail are not enough for underwriting.
    diligencePath: Ask product and compliance leadership for the current AI decision flow, collector integration map, human escalation policy, and measured offer-success and complaint rates.
    relatedQuestionRefs:
    - QE025
    relatedTableRefs:
    - TE003
  - type: conflicting-data
    severity: material
    topic: entitlement-drift
    missingEvidence: A single canonical module-to-plan and bureau-coverage matrix that reconciles all current owned product pages and landers.
    whyItMatters: Conflicting public entitlements make it hard to know what the live product actually does and raise version-control and consumer-disclosure risk.
    diligencePath: Request the internal product source-of-truth table used by lifecycle marketing, product, compliance, and app-store copy owners, then map every live landing page back to that matrix.
    relatedQuestionRefs:
    - QE022
    - QE023
    relatedTableRefs:
    - TE001
    - TE005
  - type: private-evidence-only
    severity: material
    topic: roadmap-visibility
    missingEvidence: A dated forward roadmap for module rollout, secured-card expansion, debt-negotiator scope growth, and public trust-surface improvements.
    whyItMatters: Current release-state evidence proves what is live today but not what Kikoff intends to prioritize next or how quickly limited-access features will broaden.
    diligencePath: Request the current product roadmap, release calendar, and module adoption metrics by tier, including invite funnel metrics for the secured card and take-rate by add-on.
    relatedQuestionRefs:
    - QE026
    relatedTableRefs:
    - TE005
