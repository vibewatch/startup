- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / process / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Subscription and plan engine
    - Maps user tier to tradeline size and module eligibility
    - Current pricing pages and app listings
    - Disclosure drift across owned pages can misstate entitlements
  - - Closed-loop credit ledger
    - Tracks Kikoff-store purchase, balance, repayments, and low-utilization profile
    - Kikoff store checkout plus recurring billing
    - Closed-loop design may not translate cleanly into broader credit access
  - - Bureau-reporting connectors
    - Sends core tradeline and some adjunct-payment data to bureaus
    - Equifax, Experian, and TransUnion plus product-specific feeds
    - Bureau coverage differs by module and some pages lag the current configuration
  - - Verification layer for rent and identity
    - Validates rent-payment bank account, lease, landlord, and user/device identity
    - Linked bank account, landlord data, phone / IMEI / subscriber details
    - Public evidence shows data collection inputs but not verification error rates or override policy
  - - Bank-card stack
    - Issues deposit account and secured card, handles overdraft and ATM access
    - Coastal Community Bank, Mastercard network, direct deposit rails, Allpoint ATM network
    - Invite gating and partner dependence add rollout and service risk
  - - Debt-negotiation automation
    - Collects consent, requests offers, and routes collector communications
    - Collector participation and internal AI tooling
    - No public disclosure of model architecture, human review, or settlement-success controls
  - - Mobile distribution and telemetry surface
    - Delivers the product through iOS and Android apps with frequent updates and broad permissions
    - Apple App Store, Google Play, AppBrain-observed libraries and permissions
    - App-scale maturity is visible, but heavy permissions increase privacy and QA stakes
  notes: >-
    This table is an operating-model abstraction drawn from public product, policy, and app-distribution evidence.
    Kikoff does not publish a full internal system diagram or connector inventory.
