  figureRefs:
  - FE003
- id: trust-privacy-and-quality-controls
  title: Trust, privacy, and quality controls
  body: >-
    Kikoff’s trust posture is observable, but only partially underwritten. On the positive side, owned surfaces promise
    bank-level security, identity-theft insurance in the highest tier, privacy monitoring against data brokers, free
    disputes, and only-positive reporting on some adjunct products such as rent and bill reporting. The legal stack is
    more revealing than the marketing copy. Kikoff’s February 2026 privacy policy covers the website and mobile apps,
    says the company collects identifiers, online activity, geolocation, and inferences, and says data can come from
    public sources and data brokers. The terms also allow Kikoff and service providers to use phone-number, IMEI, and
    subscriber/device information for identity verification and fraud avoidance. For the secured-card/bank layer, Coastal
    Community Bank’s privacy notice adds classic financial-data categories such as SSN, income, balances, payment history,
    and credit scores. What remains missing is operational trust proof: no public status page, no public uptime SLA, and
    no public security-certification surface were found on the reviewed pages.
  claimRefs:
  - CE011
  - CE021
  - CE022
  - CE023
  - CE024
  - CE028
  - CE034
  - CE038
  tableRefs:
  - TE004
- id: differentiation-maturity-and-product-limitations
  title: Differentiation, maturity, and product limitations
  body: >-
    Kikoff’s product differentiation comes from combining multiple credit-improvement levers under one mobile-led,
    subscription-priced experience: a closed-loop tradeline, bureau reporting, rent and bill feeds, a secured card, debt
    negotiation, and privacy/identity tooling. The product looks commercially mature enough to support a real mobile
    surface, active release cadence, and millions of Android downloads, and the company’s own careers page explicitly
    frames technology and AI as core to the proposition. But the limitations are equally clear. The closed-loop tradeline
    still cannot buy gas or groceries, which means it may improve file optics without solving broader credit access.
    Independent reviewers repeatedly call out that constraint, and several still describe older two-bureau or $500-product
    configurations, showing that outside documentation lags current marketing. More importantly, Kikoff’s own pages are
    not perfectly synchronized: rent-reporting entitlements and bureau coverage vary across current owned surfaces. That
    disclosure drift, plus the lack of public AI-governance or reliability evidence, is the central product-tech risk.
  claimRefs:
  - CE020
  - CE025
  - CE026
  - CE027
  - CE028
  - CE031
  - CE032
  - CE033
  - CE035
  - CE036
