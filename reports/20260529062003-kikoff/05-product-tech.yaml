  - FE004
tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user
  - Current status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - Kikoff Credit Account
    - Thin-file or rebuilding consumer
    - GA
    - Closed-loop tradeline with no hard inquiry and low monthly payment entry point
    - Real external-spend usefulness is intentionally limited
  - - Basic / Premium / Ultimate subscription ladder
    - Consumer subscriber
    - GA
    - One subscription controls pricing, reported-line size, and add-on unlocks
    - Owned pages drift on exact module entitlements
  - - Rent Reporting
    - Rent-paying subscriber
    - GA, but entitlement messaging varies by page
    - Converts existing rent into positive bureau-file data and can backfill up to 24 months
    - Bureau coverage and plan inclusion are not perfectly synchronized across owned pages
  - - Bill Reporting
    - Subscriber with utility / phone bills
    - GA on current pricing pages
    - Adds another positive-payment feed without reporting late payments
    - Public evidence only names TransUnion and four bill categories
  - - Kikoff Secured Credit Card + deposit account
    - Higher-tier invited subscriber
    - Limited GA / invite-only
    - Deposit-backed spend product adds open-loop card behavior, overdraft, ATM, and direct deposit features
    - Public rollout scope, invite rules, and adoption are undisclosed
  - - Debt Negotiator
    - Subscriber with collections / charge-offs
    - Live feature, initially one eligible debt at a time
    - Moves beyond score tracking into creditor/collector workflow automation
    - No public AI-control, collector-coverage, or settlement-success methodology
  - - Privacy / identity / disputes bundle
    - Premium / Ultimate subscriber
    - GA bundle surface
    - Couples score building with data-broker removal, monitoring, disputes, and insurance
    - Public docs do not expose detection accuracy or service-level metrics
  notes: >-
    Rows summarize externally visible modules only. Private underwriting logic, bureau-connector implementation,
    collector coverage, and module adoption rates are not publicly disclosed.
