- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Kikoff solution
  - Measurable benefit
  - Limitation
  rows:
  - - Start credit building without hurting inquiry profile
    - Sign up, get instant approval, avoid hard pull
    - Kikoff Credit Account onboarding
    - Faster start for thin-file users
    - Does not create general-purpose spending power
  - - Create recurring positive payment history
    - Buy a small Kikoff-store item and pay monthly
    - Closed-loop tradeline reporting workflow
    - Monthly reporting can improve payment-history depth and utilization optics
    - Line can only finance Kikoff purchases
  - - Turn rent into bureau data
    - Link rent-payment bank account, submit lease and landlord details
    - Rent Reporting
    - Positive rent can be reported monthly and prior history can be backfilled
    - Coverage varies by bureau and owned-page disclosure is inconsistent
  - - Turn household bills into bureau data
    - Match phone or utility payments for reporting
    - Bill Reporting
    - Adds another positive file input without late-payment reporting
    - Publicly named as TransUnion-only today
  - - Use everyday spend to build history
    - Add deposit, spend like debit, optionally receive payroll early
    - Kikoff Secured Card and deposit account
    - Converts daily card usage into monthly bureau reporting
    - Requires invite / higher tier and bank-partner dependency
  - - Resolve derogatory debt
    - Select an eligible collection or charge-off and request an offer
    - AI Debt Negotiator plus collector outreach
    - Could lower outstanding derogatory debt if offers are accepted
    - Public docs do not describe model oversight or collector coverage
  - - Track and protect credit progress
    - Monitor reports, disputes, identity exposure, and data-broker leaks
    - Monitoring + disputes + privacy bundle
    - Keeps score changes visible inside the same product family
    - No public SLA for remediation speed or detection quality
  notes: >-
    Workflow steps combine current product pages, app listings, and card terms. Benefits are operational claims, not a
    guarantee of FICO outcomes or general credit approval.
