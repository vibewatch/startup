- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control / disclosure
  - Current status
  - Scope
  - Remaining gap
  rows:
  - - Bank-level security and encryption language
    - Claimed on homepage and product pages
    - General marketing posture across subscription plans
    - No public certification or independent audit page found
  - - Website / app privacy policy
    - Updated 2026-02-12
    - Covers identifiers, online activity, geolocation, inferences, and data-broker/public-source inputs
    - Does not explain product-module-specific retention or model-training boundaries
  - - Identity verification / fraud avoidance
    - Documented in terms
    - Kikoff and service providers may use phone, IMEI, and subscriber/device data
    - No public false-positive, escalation, or manual-review metrics
  - - Secured-card banking disclosures
    - Documented in 2025-06-05 card terms and Coastal privacy notice
    - Deposit account, FDIC framing, APRs, ATM fees, direct-deposit overdraft
    - Public docs still do not expose card loss rates or dispute-resolution timing
  - - Positive-only adjunct reporting
    - Explicitly claimed for rent and bill reporting
    - Late or missing months are not reported for those modules
    - Scope is module-specific and not a universal no-negative-reporting promise
  - - Privacy monitoring and identity-theft insurance
    - Marketed in upper tiers
    - Data-broker removal, monitoring, and up to $1M eligible ID-theft protection
    - Detection coverage, claim process, and remediation SLA are not public
  - - Public reliability transparency
    - Weak
    - No public status page, uptime target, or incident archive located on reviewed surfaces
    - Reliability must be inferred rather than monitored directly
  notes: >-
    Trust controls are pulled from owned marketing pages, legal documents, and partner-bank disclosures. Missing public
    certifications or uptime reporting are treated as diligence gaps, not proof of failure.
