callouts:
- calloutType: strength
  title: Kikoff’s real moat is module bundling, not the closed-loop tradeline alone
  body: >-
    The product is materially broader than a single ebook-financing tradeline. Kikoff now bundles bureau reporting,
    rent and bill feeds, a deposit-backed card, debt negotiation, score monitoring, disputes, and privacy tooling inside
    one subscription ladder and one mobile surface.
  claimRefs:
  - CE013
  - CE018
  - CE024
  - CE037
- calloutType: risk
  title: Disclosure drift is a real product-tech risk, not just a copy-edit issue
  body: >-
    Current owned pages disagree on rent-reporting entitlements and bureau coverage, while multiple outside reviews still
    describe older two-bureau or $500 configurations. That makes it harder for investors to know which product state is
    canonical without checking multiple surfaces.
  claimRefs:
  - CE010
  - CE031
  - CE032
  - CE040
- calloutType: insight
  title: Kikoff can improve a file without underwriting broad spend, which is both the feature and the limitation
  body: >-
    The no-hard-inquiry, store-only tradeline lets Kikoff influence utilization and payment history without extending
    open-ended consumer purchasing power. That is operationally efficient, but it also supports the critique that the
    product may help scores more than it expands real-world credit access.
  claimRefs:
  - CE004
  - CE033
  - CE039
