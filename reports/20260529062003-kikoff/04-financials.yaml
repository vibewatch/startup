- id: TI003
  title: Unit economics table
  columns:
  - Metric or proxy
  - Public value or status
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - CAC or paid-marketing efficiency
    - Not disclosed publicly
    - Medium
    - The app-led self-serve funnel may lower CAC, but no public channel mix or payback data exists.
    - Request acquisition-channel mix, blended CAC, incremental paid CAC, and payback by plan.
  - - LTV or retention by plan
    - Not disclosed publicly
    - Medium
    - Recurring revenue quality depends on retention more than download volume.
    - Request cohort retention, renewal rate, cancellation rate, and subscriber months by plan.
  - - Adoption proxy
    - 5.1M downloads, 110K downloads in last 30 days, about 120K ratings
    - Medium
    - Broad reach can support low CAC if conversion is healthy, but reach is not revenue.
    - Request funnel from app install to paying plan by month.
  - - Marketing value claim
    - 58+ point average credit-score improvement within three months
    - Low
    - Helpful for demand generation, but it is company marketing rather than audited economics.
    - Request methodology, sample size, and outcome split by starting score bucket.
  - - Charge-off servicing
    - Account charges off after 180+ days without payment and cannot be reopened
    - Medium
    - Even low-dollar recurring products require collections, reporting, and customer-support expense.
    - Request delinquency curve, recovery rates, and servicing cost per delinquent account.
  - - Bill negotiation service intensity
    - Human team negotiates vendor bills for Ultimate users
    - Medium
    - This likely compresses gross margin versus the fully digital layers of the product stack.
    - Request cases per agent, average savings delivered, labor minutes per case, and complaint rate.
  - - Revenue, ARR, GMV, and gross margin
    - No public disclosure found in reviewed sources
    - Medium
    - The core inputs needed to test valuation and margin durability are absent.
    - Request audited P and L, gross margin bridge, and monthly recurring revenue by tier.
  notes: 'Every row here is either a public proxy or a specific missing disclosure. The table is intentionally conservative: it separates what is directly evidenced from what is only inferred from app distribution, support mechanics, or complaint surfaces.'
