- id: TI002
  title: Pricing / monetization table
  columns:
  - Surface
  - Public price or unit
  - What is evidenced
  - Revenue-quality view
  - Diligence ask
  rows:
  - - Basic plan
    - $5 per month for a $750 tradeline
    - Official support and Google Play align on the entry price and three-bureau reporting.
    - Strongest current list-pricing evidence, but still only list price.
    - Need active Basic subscribers, renewal rate, and realized net revenue after refunds.
  - - Premium plan
    - Official sources show $20 per month; NerdWallet shows $25 per month
    - Public sources agree on the feature set but not the monthly fee.
    - Pricing drift weakens confidence in headline ARPU and suggests public merchandising lag.
    - Need current checkout screenshots, billing ledger, and plan-change history.
  - - Ultimate plan
    - $35 per month for a $3,500 tradeline
    - Official support and NerdWallet both show the top-tier monthly fee.
    - Highest visible list price, but attach volume is unknown.
    - Need subscriber count, upgrade rate, and cancellation rate.
  - - Secured card deposit
    - NerdWallet says a $50 minimum security deposit is required
    - Deposit requirement is visible in independent review coverage, not in the support articles reviewed here.
    - Deposit backing may cap risk, but revenue and interchange are not visible.
    - Need card agreement, deposit balances, and revenue share with issuer partners.
  - - Credit Builder Loan
    - No public APR or fee schedule surfaced in reviewed sources
    - Product existence is visible through withdrawal support, but core economics are not.
    - Margin, funding cost, and default behavior cannot be modeled publicly.
    - Need product terms, APR, servicing fees, and balance sheet treatment.
  - - Bill negotiation
    - Bundled into Ultimate; no standalone public fee
    - Feature is clearly offered, but there is no public disclosure of success-fee or referral economics.
    - Standalone unit economics are unobservable and likely service heavy.
    - Need vendor economics, savings-share formula, and per-case labor cost.
  notes: 'Public sources show list prices and bundled features, but they do not show realized pricing after discounts, refunds, delinquency, or plan-mix effects. Premium pricing is internally inconsistent across reviewed 2026 sources.'
