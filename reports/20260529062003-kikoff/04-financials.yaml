- id: TI004
  title: Capital adequacy table
  columns:
  - Item
  - Public evidence
  - Why it matters
  - Confidence
  - Diligence ask
  rows:
  - - 2020 Form D primary capital
    - About $12.5M sold
    - Direct primary-capital evidence from filing rather than an aggregator.
    - High
    - Reconcile Form D proceeds to cap table and bank receipts.
  - - 2021 Form D primary capital
    - About $30.0M sold
    - Direct evidence for the company''s largest disclosed primary round.
    - High
    - Reconcile proceeds, share class, and investor rights.
  - - Lifetime disclosed primary capital
    - About $42.5M across the two Form D filings
    - Establishes the disclosed capital base that later valuation claims should be compared against.
    - High
    - Tie SEC math to full financing chronology and ownership dilution.
  - - Latest public market-data deal signal
    - PitchBook teaser shows latest deal type as secondary private and latest deal amount as $10M
    - Suggests later liquidity may be secondary rather than clearly new operating capital.
    - Medium
    - Obtain deal documents and determine whether proceeds went to company or selling holders.
  - - Reported January 2025 valuation mark
    - SciEuro, citing PitchBook, says Kikoff reached a $1B valuation after an undisclosed raise
    - A very high mark relative to disclosed capital and absent public revenue disclosure.
    - Medium
    - Confirm primary versus secondary nature, instrument terms, and post-money basis.
  - - Current cash, burn, and runway
    - Not publicly disclosed
    - Core capital adequacy remains unverified.
    - Medium
    - Request treasury pack, cash bridge, and 13-week plus 12-month runway model.
  - - Debt obligations and covenants
    - Not publicly disclosed in reviewed sources
    - Balance-sheet risk could be understated if warehouse, partner, or servicing obligations exist.
    - Medium
    - Request debt schedule, covenant package, partner agreements, and contingent liabilities.
  - - Next-round trigger and use of funds
    - Not publicly disclosed; only product expansion and secondary-market signals are visible
    - Hard to judge dilution timing or whether the business is self-funding.
    - Low
    - Request budget, hiring plan, board fundraising plan, and minimum cash threshold.
  notes: 'The direct evidence here is strongest on historical primary capital and weakest on current liquidity. Later valuation and secondary-deal signals are market-data observations, not a substitute for audited cash or debt disclosure.'
  enumerationScope:
