  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: revenue-gap
    missingEvidence: Current and historical revenue, ARR if applicable, GMV if used internally, and paid-subscriber counts by plan.
    whyItMatters: The reported $1 billion 2025 valuation cannot be tested without top-line and customer-scale disclosure.
    diligencePath: Request audited or board-level revenue history, monthly recurring revenue bridge by plan, and active paid subscribers by product.
    relatedQuestionRefs:
    - QI014
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: cohort-economics-gap
    missingEvidence: CAC by channel, sales mix, payback period, churn, renewal rate, and lifetime gross profit by cohort and plan.
    whyItMatters: Public proxies suggest app-led acquisition and recurring billing, but they do not prove attractive unit economics or durable retention.
    diligencePath: Request cohort dashboard, acquisition-channel mix, CAC and payback by cohort, renewal curves, and LTV by plan.
    relatedQuestionRefs:
    - QI015
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: liquidity-gap
    missingEvidence: Current cash balance, monthly burn or generation, debt obligations, covenants, and downside runway model.
    whyItMatters: Historical fundraising does not prove present capital adequacy, especially when later valuation signals may be driven by secondary activity rather than fresh operating capital.
    diligencePath: Request treasury pack, debt schedule, covenant summary, 13-week cash forecast, and management runway scenarios.
    relatedQuestionRefs:
    - QI021
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: debt-negotiation-unit-economics
    missingEvidence: Standalone fee model, labor cost, compliance cost, complaint rate, and savings-share economics for bill negotiation.
    whyItMatters: Bill negotiation may be the lowest-margin and highest-risk feature in the stack, but public sources only show that it exists and is bundled into Ultimate.
    diligencePath: Request case-volume dashboard, staffing model, vendor mix, complaint metrics, and contribution margin for the bill-negotiation workflow.
    relatedQuestionRefs:
    - QI023
    relatedTableRefs:
    - TI002
    - TI003
    - TI005
  - type: enumeration-incomplete
    severity: minor
    topic: public-financial-gaps-table
    missingEvidence: A fuller inventory of missing plan-level metrics, partner economics, charge-off data, and subscriber behavior than the summary table includes.
    whyItMatters: TI005 is intentionally selective and should not be mistaken for a full diligence request list.
    diligencePath: Expand TI005 into a management-information checklist covering subscriber behavior, partner contracts, support workload, and treasury data.
    relatedQuestionRefs:
    - QI015
    - QI021
    - QI023
    relatedTableRefs:
    - TI005
