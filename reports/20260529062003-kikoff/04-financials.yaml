- id: adoption-proxies-unit-economics-and-margin-implications
  title: Adoption proxies, unit economics, and margin implications
  body: 'Kikoff does not publish CAC, payback, gross margin, or LTV, so the public unit-economics view has to be assembled from proxies. The acquisition side looks low touch: app-store distribution, no-credit-check messaging, in-app plan changes, default autopay, and default auto-renew all fit a consumer self-serve funnel rather than a human sales motion. AppBrain estimates about 5.1 million lifetime downloads, 110 thousand downloads in the last 30 days, and roughly 120 thousand ratings, which suggests broad funnel reach even though it does not prove paid conversion. The margin side is mixed. Some features look software-like and potentially attractive: bureau reporting, rent reporting, and recurring subscription billing should scale better than an open-loop lender''s underwriting stack. But Kikoff is not pure software. Public sources show charge-off servicing, back reporting, bill reporting integrations, secured-card access, a credit-builder-loan workflow, and an Ultimate-tier bill-negotiation team that contacts vendors directly. CFPB guidance on debt relief highlights that this category can be risky. The implication is that Kikoff''s gross-margin profile is likely better than a balance-sheet-heavy subprime lender, but lower and more operationally exposed than a clean SaaS subscription.'
