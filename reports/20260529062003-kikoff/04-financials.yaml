- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Impact on underwriting
  - Best public proxy today
  - Exact diligence path
  - Severity
  rows:
  - - Revenue, ARR, or GMV
    - Without top-line disclosure, investors cannot test the reported valuation against revenue or growth.
    - PitchBook teaser leaves current revenue blank.
    - Request audited historical revenue, monthly revenue bridge, and growth by plan and product.
    - Blocking
  - - Paid subscribers and active customers
    - Download reach cannot be translated into paying scale or revenue quality.
    - AppBrain download and rating signals only.
    - Request active paid subscribers, free-to-paid conversion, and active customers by product.
    - Material
  - - CAC, payback, and sales mix
    - The self-serve GTM thesis cannot be underwritten without channel-level acquisition data.
    - App-led distribution and low entry price are only directional proxies.
    - Request channel mix, paid CAC, organic conversion, referral share, and payback by cohort.
    - Material
  - - Churn, renewal, and LTV by plan
    - Recurring revenue quality depends on retention, not just sign-ups.
    - Auto-renew and tiered attach services suggest but do not prove retention.
    - Request cohort retention, renewal, churn, and lifetime gross profit by plan.
    - Material
  - - Gross margin and COGS by product
    - Margin durability cannot be judged while human-service add-ons and reporting costs remain opaque.
    - Product complexity and CFPB risk guidance imply service cost, but not the size of that cost.
    - Request gross margin bridge, vendor costs, support cost, dispute rates, and bill-negotiation labor model.
    - Blocking
  - - Cash, debt, and runway
    - Capital dependence remains unknowable even though historical fundraising is evidenced.
    - Funding history and secondary signals only.
    - Request treasury pack, debt schedule, covenant summary, and downside runway model.
    - Blocking
  notes: 'TI005 is intentionally selective rather than exhaustive. It captures the missing private metrics most likely to change the underwriting view on valuation, revenue quality, and financing dependency.'
  enumerationScope:
    coverage: partial
    basis: Covers the highest-impact missing disclosures surfaced by reviewed sources on 2026-05-29; it is a diligence starter list, not a substitute for a full data-room request set.
