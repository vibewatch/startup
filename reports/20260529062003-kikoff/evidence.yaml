evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: A current board roster committee structure and any investor-specific governance rights.
    whyItMatters: >-
      Without formal governance detail it is hard to assess founder control independent oversight and later-stage
      governance maturity.
    diligencePath: >-
      Request the current board list observer rights committee charter summary and any major protective provisions from
      management.
    relatedQuestionRefs:
      - QO016
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: valuation-support
    missingEvidence: >-
      A current cap table round memo or directly viewable market-data snapshot showing the 2025 or 2026 post-money
      valuation.
    whyItMatters: >-
      The unicorn narrative is repeated publicly but the directly inspectable evidence is weaker than the headline and
      matters for valuation underwriting.
    diligencePath: >-
      Request management's latest fundraising summary cap table excerpt and permissioned database screenshots covering
      post-money valuation and investor ownership.
    relatedQuestionRefs:
      - QO020
      - QO026
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: current-operating-metrics
    missingEvidence: A current headcount figure plus any revenue margin or cash-efficiency metrics.
    whyItMatters: >-
      Public traction and valuation claims are harder to underwrite without current operating scale and financial
      context.
    diligencePath: >-
      Request a current operating dashboard or investor update with headcount revenue trend margin and cash-burn
      information.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: milestones
    missingEvidence: >-
      A complete dated chronology covering all major launches partnership starts governance changes and any legal or
      regulatory events.
    whyItMatters: >-
      The public record is sufficient for a chapter-level timeline but still too partial to treat as an exhaustive
      company history.
    diligencePath: >-
      Ask management for a dated milestone sheet and cross-check it against archived press releases product changelogs
      and investor communications.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO004
  - type: conflicting-data
    severity: minor
    topic: score-outcomes
    missingEvidence: >-
      Cohort definitions and methodology behind the homepage's +86-point claim versus other average score-improvement
      claims.
