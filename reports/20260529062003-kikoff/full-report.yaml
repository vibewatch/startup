    title: Competitor profile table
    columns:
      - Option
      - Category
      - Core promise
      - Entry price / cash requirement
      - Bureau path in retained sources
      - Main limitation versus Kikoff
    rows:
      - - Kikoff
        - Direct subscription credit builder
        - Cheap first tradeline plus bundled rent, bills, secured card, and debt tools
        - $5/mo basic; no core deposit; $50 minimum if secured card is added
        - Plan-level all-three reporting; rent to Equifax/TransUnion; bills to TransUnion
        - Core line is store-limited and public bureau language is not perfectly consistent
      - - Self
        - Direct installment builder + secured card
        - Build credit and savings together, then layer on a secured card and rent/bill reporting
        - $25/mo credit-builder entry; $100 minimum card deposit
        - Loan and card to all three; rent to all three; utilities/phone to TransUnion
        - Higher monthly cost and longer commitment than Kikoff
      - - CreditStrong
        - Direct tradeline optimizer
        - Improve utilization, installment depth, and credit mix with multiple specialized products
        - $15/mo Revolv; $16/mo MAGNUM; $28/mo Instal
        - All retained products report to all three bureaus
        - More complex and generally pricier than Kikoff's entry wedge
      - - Grow Credit
        - Direct subscription-card niche
        - Use recurring subscriptions to build credit through a Mastercard wrapper
        - Free tier available; $2.99, $4.99, and $9.99 paid tiers; $17 secured deposit option
        - App-store listing says all tiers report to Equifax, Experian, and TransUnion
        - Lower spending caps and thinner current public disclosure than Kikoff
      - - Chime Credit Builder
        - Primary-banking substitute
        - Bundle credit building with checking, early pay, overdraft, deposits, and ATM access
        - No monthly fee disclosed in retained sources; value depends on checking/direct-deposit relationship
        - >-
          Retained sources discuss score impact and secured-card structure, but a current official all-three-bureau
          statement was not retained
        - Requires a deeper banking relationship than Kikoff
      - - Experian Boost
        - Score-overlay substitute
        - Raise scores from bills already paid without opening a new tradeline
        - Free
        - Experian-file and Experian-based score effect, not a new cross-bureau tradeline
        - Lower durability and portability than a true tradeline product
      - - Mainstream secured cards
        - Status-quo substitute
        - Use a real card at merchants while building credit through normal card behavior
        - 'Example retained benchmark: Discover starts at a $200 refundable deposit'
        - Discover says activity is reported to the three major bureaus
        - Meaningfully higher upfront cash friction than Kikoff
      - - Debt settlement / debt management
        - Distress adjacency
        - Lower payment pressure or settle balances rather than build a thin file
        - Counseling or settlement economics vary by program
        - May harm or later help credit depending on path; not a primary tradeline strategy
        - Addresses debt burden, not the core credit-building job Kikoff sells
