  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Current public status
      - Gross-margin implication
      - Diligence ask
    rows:
      - - Credit Account subscription
        - Monthly plan fee is charged against a small tradeline and reported to the bureaus over 12 months.
        - Clearly active and central to the product.
        - >-
          Likely higher margin than open-loop lending because the tradeline is not general-purpose credit, but servicing
          and reporting still create cost.
        - Need paid-subscriber count, plan mix, churn, refunds, and monthly revenue by tier.
      - - Rent reporting
        - On-time rent is reported as an additional tradeline and is bundled into current plans.
        - Clearly active as an attach feature.
        - Potentially attractive digital attach if bureau and data-link costs are controlled.
        - Need attach rate, unit vendor cost, and incremental retention lift versus non-users.
      - - Bill reporting
        - Premium and Ultimate plans can report utility and telecom bills to TransUnion.
        - Clearly active in higher tiers.
        - >-
          Likely lower margin than simple rent reporting because bank-linking and bill detection add servicing
          complexity.
        - Need attach rate, coverage limits, per-user data costs, and dispute rate.
      - - Bill negotiation
        - Ultimate plan includes a negotiation team that contacts vendors for discounts.
        - Clearly offered, but no standalone fee is disclosed.
        - Probably the most labor- and compliance-intensive monetization surface in the stack.
        - Need case volume, staffing cost, success rate, vendor mix, and any savings-share or referral economics.
      - - Credit Builder Loan
        - >-
          Public support shows a withdrawal workflow after final payments settle, proving product existence but not
          economics.
        - Product exists; pricing economics remain opaque.
        - Adds cash-timing and servicing complexity beyond a pure tradeline subscription.
        - Need APR, fee table, balance sheet treatment, loss history, and origination volume.
      - - Secured card access
        - Higher tiers advertise access to a Kikoff secured card, and NerdWallet says a $50 deposit is required.
        - Product access is visible, but public monetization is not.
        - Deposit backing may reduce credit risk, but interchange, servicing, and partner economics are undisclosed.
        - Need cardholder count, deposit balances, spend volume, interchange split, and fraud losses.
    notes: >-
      This is a partial enumeration of Kikoff's publicly visible monetization surfaces as of 2026-05-29. Public evidence
      supports recurring subscriptions and multiple attach services, but not a complete audited revenue mix or realized
      ARPU bridge.
    enumerationScope:
