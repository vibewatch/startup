        - $1.1B-$1.8B
        - '~25%: achievable only if the company is already much larger economically than public evidence shows'
        - Cross-sell, complaint control, and cleaner round terms shift the price from stretched to defensible
    notes: >-
      Ranges are deliberate judgment bands because the public record still omits the revenue and margin denominator that
      a tighter model would require.
