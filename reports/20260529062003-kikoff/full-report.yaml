  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and module map
        blocks:
          - type: paragraph
            body: >-
              Kikoff is best understood as a credit-file-management subscription rather than a traditional lender or
              card issuer. The core product is a closed-loop Kikoff Credit Account that finances Kikoff purchases,
              reports recurring payments, and is packaged into Basic, Premium, and Ultimate plans with progressively
              larger reported tradelines and more add-on services. Around that nucleus, Kikoff now layers rent
              reporting, utility bill reporting, an invite-only secured card, debt negotiation, identity-theft and
              privacy services, score tracking, and free disputes. That breadth matters because the company is not
              merely selling a one-off tradeline; it is trying to become the operating system for consumers who need to
              create positive bureau-file events cheaply and with low friction. The tradeoff is that several modules
              remain specialized rather than universal. The credit account is still closed-loop, rent and bill reporting
              do not appear to hit every bureau in the same way, and the secured card is gated behind higher tiers and
              invite mechanics.
