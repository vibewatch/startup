  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: 'Overall risk posture: the downside is trust-and-compliance compression, not just fintech execution noise'
        blocks:
          - type: paragraph
            body: >-
              Kikoff's risk stack is unusually concentrated in a single loop: low-ticket subscriptions buy access to
              reported tradelines, and the perceived value of those subscriptions depends on bureaus, app-store trust,
              clean servicing, and accurate reporting all staying intact at once. The product is not a generic credit
              card or unsecured loan; Kikoff's own materials and third-party reviews show that the core credit account
              is limited to Kikoff purchases and even the app-store disclosures frame the tradeline as financing Kikoff
              products and services. That makes the company far more sensitive to reporting accuracy, pricing
              communication, and customer support than a lender whose credit line is broadly spendable. The complaint
              record shows that these risks are not hypothetical: CFPB data is already large enough to matter, and
              public complaint sites add recurring allegations around charges, refunds, and service access. The
              underwriting implication is medium-high overall risk with a distinctly asymmetric downside if bureau
              treatment, complaint durability, or pricing credibility weakens at the same time.
            claimRefs:
              - CR001
              - CR003
              - CR005
              - CR008
              - CR009
