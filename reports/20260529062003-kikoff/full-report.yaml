    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product scope, and footprint
        blocks:
          - type: paragraph
            body: >-
              Kikoff's present-day identity is clearest on its own surfaces: it presents itself as a consumer finance
              platform built to help people build credit, lower debt, and improve financial security with affordable
              digital tools. That matters because the company is no longer marketed as just one tradeline product. The
              core engine still appears to be the Kikoff Credit Account, which the FAQ calls Kikoff's primary product
              and the credit-account page describes as a revolving line of credit designed to build payment history,
              keep utilization low, and extend account age. Public product pages and blog explainers also make the
              company's pricing logic unusually clear for a private fintech. The homepage says plans start at $5 per
              month, while the supporting explainers describe the free account, the $5 Basic tier, and the higher
              monitoring plans. The same retained sources also establish the most important structural caveat for later
              chapters: Kikoff's flagship account is intentionally closed-loop. It is designed to create
              credit-reporting behavior and monitoring value, not to function like a general-purpose everyday credit
              card. Official and media sources consistently place the company in San Francisco.
