      - number: '1.3'
        title: Funding history, investor base, and valuation support
        blocks:
          - type: paragraph
            body: >-
              Public capital formation is supportable through the 2020-2021 financing sequence, but current valuation
              support is less transparent than the headline suggests. TechCrunch reported in June 2021 that Kikoff
              raised a $30 million Series B after $12.5 million of previously unannounced seed and Series A capital,
              which implies roughly $42.5 million of disclosed funding. That total is directionally corroborated by
              Parsers VC and by Tracxn's two-round database summary. The same TechCrunch report named Portage Ventures
              as Series B lead and Lightspeed, GGV, Coatue, and Core Innovation Capital as participants, while also
              listing Steph Curry among prior backers. Direct portfolio pages from Lightspeed and Female Founders Fund
              provide additional evidence that reputable investors still publicly associate with Kikoff. The valuation
              story is harder to inspect directly. Multiple 2026 articles and company-adjacent writeups describe Kikoff
              as a unicorn or roughly a $1 billion company in 2025, but the directly viewable PitchBook archive we
              retained is older and does not expose a 2025 post-money field. The funding history is therefore better
              grounded than the current valuation headline, even though the unicorn narrative is repeated by several
              retained sources.
