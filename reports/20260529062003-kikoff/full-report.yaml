      - number: '4.4'
        title: Underwriting verdict and key diligence gaps
        blocks:
          - type: paragraph
            body: >-
              A supportable financial verdict on Kikoff is therefore directional rather than underwritten. The positive
              case is real: public evidence supports an active subscription business, a low entry price that can widen
              the addressable funnel, a visible plan ladder that can increase ARPU, meaningful app-store reach, and a
              historically modest disclosed primary fundraising base that was large enough to build a scaled consumer
              product. The negative case is also real: the higher-value features increasingly involve operations and
              compliance, customer complaints surface around cancellation and negative credit effects, public pricing is
              not perfectly synchronized across sources, and the reported $1 billion 2025 valuation sits on top of
              almost no public operating disclosure. The largest blockers are not subtle. Reviewed sources do not
              disclose revenue, ARR, paid subscribers, gross margin, CAC, payback, churn, customer concentration, cash
              balance, burn, runway, debt, or the standalone economics of bill negotiation. For diligence purposes,
              Kikoff currently looks more like a subscription-led credit-building platform with credible monetization
              surfaces than an unproven concept, but public evidence is still too thin to validate valuation, margin
              durability, or financing dependence.
