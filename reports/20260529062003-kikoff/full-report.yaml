      - number: '5.4'
        title: Trust, privacy, and quality controls
        blocks:
          - type: paragraph
            body: >-
              Kikoff’s trust posture is observable, but only partially underwritten. On the positive side, owned
              surfaces promise bank-level security, identity-theft insurance in the highest tier, privacy monitoring
              against data brokers, free disputes, and only-positive reporting on some adjunct products such as rent and
              bill reporting. The legal stack is more revealing than the marketing copy. Kikoff’s February 2026 privacy
              policy covers the website and mobile apps, says the company collects identifiers, online activity,
              geolocation, and inferences, and says data can come from public sources and data brokers. The terms also
              allow Kikoff and service providers to use phone-number, IMEI, and subscriber/device information for
              identity verification and fraud avoidance. For the secured-card/bank layer, Coastal Community Bank’s
              privacy notice adds classic financial-data categories such as SSN, income, balances, payment history, and
              credit scores. What remains missing is operational trust proof: no public status page, no public uptime
              SLA, and no public security-certification surface were found on the reviewed pages.
