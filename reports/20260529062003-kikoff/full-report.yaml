      - number: '3.2'
        title: 'Direct builders: product design, pricing, and bureau reach'
        blocks:
          - type: paragraph
            body: >-
              Among direct builders, Kikoff is the lightest starting commitment. Basic starts at $5 per month, avoids a
              deposit, and bundles a reported tradeline with rent reporting and monitoring tools. Self and CreditStrong
              ask for more monthly spend but give the customer something Kikoff mostly does not: a traditional
              installment structure that returns savings or builds much larger tradelines over time. Self's builder is
              effectively a CD-backed installment loan, its secured card starts with a $100 deposit, and its bills
              product splits rent across all three bureaus versus utilities and cell phone bills on TransUnion.
              CreditStrong goes even further into credit engineering: Revolv targets utilization, MAGNUM targets long
              installment history, and Instal targets new-to-credit users who also want forced savings. Grow Credit is
              the closest product-design cousin to Kikoff in low-friction onboarding, but it is narrower: subscription
              bills are the spend object, limits are smaller, and the free tier is attractive largely because it is easy
              to multi-home rather than because it can replace a broader credit-building stack.
