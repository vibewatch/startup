      - number: '5.3'
        title: Adjacent modules and operating architecture
        blocks:
          - type: paragraph
            body: >-
              Public evidence suggests Kikoff’s architecture is a hub-and-spoke stack built around one subscription
              relationship. The core hub is the credit-account ledger and payment workflow, but the spokes connect to
              outside systems with very different data and compliance needs: three major bureaus for core tradeline
              reporting, landlord and bank-account verification for rent reporting, utility-payment evidence for bill
              reporting, Coastal Community Bank for the secured card and deposit account, app-store distribution for
              mobile acquisition, and collectors for debt negotiation. The secured-card module is the clearest example
              of Kikoff moving beyond a synthetic tradeline. Official marketing and card terms describe a deposit-backed
              Mastercard-style product with direct-deposit-powered overdraft, ATM access, cash back, and monthly bureau
              reporting. Debt Negotiator is different again: it is closer to workflow automation and collections
              resolution than to credit extension, because the user selects an eligible debt, Kikoff requests an offer,
              and the company contacts the collector with permission. The architecture therefore looks modular and
              commercially ambitious, but each module also imports a new dependency chain and failure mode.
