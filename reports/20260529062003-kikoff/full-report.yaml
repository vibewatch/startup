      - number: '2.3'
        title: Buyer Segments, Payers, and Bureau Mechanics
        blocks:
          - type: paragraph
            body: |
              Buyer, user, and payer differ materially across the category. In most credit-building products,
              the consumer is the buyer and user. In rent reporting, however, the payer can shift to the
              property manager or landlord, while in secured cards the issuer can subsidize onboarding through
              low or zero ongoing fees. Those payer differences shape acquisition strategy: consumer-direct
              subscription economics compete with employer or housing-distribution models that make the product
              feel embedded rather than discretionary.

              Product mechanics also fragment the market. Credit-builder loans and secured cards try to build a
              file through repeated on-time payments and tradeline seasoning. Rent-reporting products convert an
              already-required housing payment into bureau data. Single-bureau products such as Experian Boost
              can improve a consumer's Experian-based score path, but they do not eliminate the fact that
              lenders and consumers still manage separate bureau files. FICO's own eligibility rules mean a
              product must season for months before a score may even exist, so closed-loop or synthetic-looking
              experiences can market immediate momentum while still leaving lender pull outcomes heterogeneous.
