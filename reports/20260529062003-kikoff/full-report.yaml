  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Financing context and entry discipline
        blocks:
          - type: paragraph
            body: >-
              Kikoff's valuation case starts with one solid historical anchor and one thin recent anchor. The solid
              anchor is the 2021 launch financing: multiple retained sources converge on $42.5 million total raised,
              with the last disclosed round a $30 million Series B led by Portage. The thin anchor is the reported
              January 2025 unicorn mark. Independent list-based sources and market-data profiles consistently place
              Kikoff at $1 billion, and the company later said it achieved unicorn status in 2025, but the public record
              still does not show how much capital was raised, on what instrument, or with what downside protections.
              That matters because the company is clearly real and scaled—its own 2025 release claims more than 4
              million lifetime users and 240 million-plus cumulative credit points—but the price is not yet backed by a
              disclosed denominator. A $1 billion mark on only $42.5 million of disclosed historical funding can read as
              capital-efficient, yet it can also mean public price discovery is unusually sparse. The right starting
              posture is therefore not disbelief in the company but skepticism toward the underwritten price.
            claimRefs:
              - CV001
              - CV002
              - CV003
