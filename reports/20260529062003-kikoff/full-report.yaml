  - id: TM001
    title: Market definition table
    columns:
      - Segment / category
      - Included spend
      - Excluded spend
      - Buyer / payer
      - Relevance to Kikoff
    rows:
      - - Bureau-reported tradeline or subscription credit-builder account
        - Monthly plan fees, small revolving account access, bureau reporting and monitoring
        - Prime rewards cards, unsecured general-purpose lending
        - Consumer pays directly
        - Closest analogue to Kikoff-style self-serve credit building
      - - Secured credit cards
        - Security deposit-funded card usage, issuer servicing, monthly reporting
        - Prime unsecured card rewards and balance-transfer products
        - Consumer funds deposit; issuer may subsidize ongoing fees
        - Mainstream first-step alternative for rebuilding or establishing credit
      - - Credit-builder installment loans
        - Loan servicing, interest/fees, CD or locked-savings structure, monthly bureau reporting
        - General personal loans with freely spendable proceeds
        - Consumer pays directly
        - Competes on payment-history building and perceived seriousness of commitment
      - - Rent reporting / alternative-payment reporting
        - Rent-reporting fees or landlord-paid program spend, data furnishing, resident engagement
        - Tenant-screening only products and non-credit reporting property software
        - Landlord/property manager or consumer
        - Important adjacent channel because it converts existing spend into file-building data
      - - Adjacent credit counseling / debt settlement / credit repair
        - Counseling fees, settlement fees after resolution, debt-management servicing
        - General bankruptcy legal work and refinancing products
        - Consumer pays directly
        - Overlaps the same low-score funnel but addresses debt workout rather than pure score formation
      - - Status-quo substitutes
        - DIY credit monitoring, waiting for seasoning, authorized-user help, starter cards
        - Enterprise bureau infrastructure and lender underwriting software
        - Consumer or family network
        - Defines the real competitive set and caps willingness to pay
    notes: >-
      Included spend focuses on products whose primary consumer promise is credit-file creation or score improvement.
      Debt settlement is treated as adjacency rather than core TAM because regulators and CFPB consumer guidance frame
      it as a different problem from credit building.
