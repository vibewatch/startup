          high: 400
          note: Revenue below $100M at sub-5x sales
        - label: Base case
          low: 650
          mid: 850
          high: 1050
          note: Revenue around $130M-$170M at 5.0x-6.2x sales
        - label: Bull case
          low: 1100
          mid: 1450
          high: 1800
          note: Revenue around $180M-$240M with broader strategic optionality
    approximationNotes: >-
      Ranges are intentionally wide because public evidence still omits the current revenue denominator and financing
      terms needed for a tighter model.
    claimRefs:
      - CV050
      - CV051
      - CV052
      - CV053
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: >-
      IC-style scoring of Kikoff on accessibility, product breadth, evidence quality, valuation support, strategic
      optionality, and operational risk.
    data:
      items:
        - label: Market need
          value: 4
          note: Credit-access pain is real and the entry product is affordable
        - label: Product accessibility
          value: 4
          note: No hard pull and low entry price lower adoption friction
        - label: User / outcome proof
          value: 3.5
          note: Company claims are meaningful but still mostly company-reported
        - label: Monetization visibility
          value: 1.5
          note: ARR, payer count, churn, and margin are not public
        - label: Comparable support
          value: 2.5
          note: The mark can work, but only at a larger revenue base than public evidence proves
        - label: Strategic optionality
          value: 3.5
          note: Broader product suite creates real but not yet quantified upside
        - label: Operational / regulatory confidence
          value: 2
          note: Complaint and disclosure signals keep the risk rating high
    approximationNotes: >-
      Scores are directional judgment aids, not a mechanical model; the lowest values reflect evidence gaps and
      complaint risk rather than a denial of real user traction.
    claimRefs:
      - CV005
      - CV015
      - CV028
      - CV045
      - CV047
      - CV049
      - CV050
