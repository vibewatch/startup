              Public reach evidence is much stronger than public retention evidence. Kikoff's about page says it has
              empowered 1 million customers, while the homepage markets 150K+ user reviews and 80M+ total points
              increased. On current app-store surfaces, Apple showed 4.9/5 from 247K ratings and Google Play showed
              4.8/5 from 122K reviews plus 5M+ downloads. Those numbers are large enough to support a mass-market
