  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Revenue gap
        - Current ARR or realized revenue is materially below about $100M
        - The unicorn mark would screen rich even against mid-single-digit fintech multiples
        - Treat the price as broken unless structure or entry price changes sharply
      - - Subscriber quality gap
        - Low paid-plan conversion or high churn from Basic to Premium/Ultimate
        - Upsell-led monetization would be weaker than the product ladder implies
        - Downgrade strategic-upside assumptions and compress the scenario range
      - - Margin / loss gap
        - Gross margin or credit-loss behavior shows thin economics after servicing and disputes
        - Subscription revenue would not translate into durable enterprise value
        - Move the comp frame toward lower-end lending or lead-gen multiples
      - - Terms gap
        - January 2025 round includes heavy liquidation preferences or other downside asymmetry
        - Headline valuation would overstate common-equity economics
        - Demand a much lower effective entry price or walk away
      - - Complaint normalization failure
        - CFPB and customer-service issues remain elevated without clear resolution metrics
        - Retention, regulation, and brand trust become valuation discounts
        - Require operational remediation before assigning any strategic premium
    notes: >-
      These triggers are designed to kill the price-based thesis quickly rather than allow a vague optimism narrative to
      survive missing diligence.
    claimRefs:
      - CV021
      - CV026
      - CV027
      - CV047
      - CV048
      - CV049
      - CV050
      - CV054
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - Current revenue and ARR
        - Latest monthly recurring revenue, realized annual revenue, and gross margin by product
        - This is the denominator required to decide whether $1B is fair or stretched
        - Management data room; CFO or finance lead
      - - Active paying users and plan mix
        - Current active subscribers, Basic/Premium/Ultimate mix, upgrade paths, and churn by cohort
        - User counts and lifetime users do not translate directly into enterprise value without payer quality
        - Management metrics pack; growth and retention dashboard
      - - January 2025 round terms
        - Amount raised, security, investor mix, liquidation preferences, and any structured protections
        - Headline valuation can overstate common-equity value when downside protections are heavy
        - Board materials, stock purchase agreement, cap-table counsel review
      - - Unit economics and complaint normalization
        - Servicing cost, dispute cost, loss rates, complaint volume trend, and resolution SLAs
        - Customer-friction signals could compress retention and reduce strategic value
        - Operations, risk, and customer support workstreams
      - - Product contribution
        - Revenue and margin contribution from debt negotiation, marketplace, and other non-core products
        - Strategic-upside claims depend on cross-sell monetization, not feature count alone
        - Product finance review by line of business
      - - Exit readiness
        - Audited statements, governance maturity, and recurring disclosure cadence
        - Public evidence today is more consistent with a strategic or sponsor path than an IPO path
        - Finance, legal, and board diligence package
    notes: >-
      The diligence list is intentionally denominator-first: until these files exist, the valuation debate is mostly
      narrative.
    claimRefs:
      - CV026
      - CV027
      - CV040
      - CV047
      - CV049
