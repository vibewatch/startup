        blocks:
          - type: paragraph
            body: >-
              Kikoff remains strongly founder-identified. Cynthia Chen is the executive who appears most prominently
              across the official about page, 2026 company press coverage, investor profiles, and third-party conference
              materials, and those sources repeatedly frame her personal no-credit experience as the emotional and
              strategic origin of the business. That founder-market-fit story matters because Kikoff sells trust and
              accessibility to consumers who often feel excluded from mainstream finance. Christophe Chong is far less
              visible on consumer-facing pages, but TechCrunch and archived PitchBook materials still anchor him as
              co-founder and CTO, with PitchBook additionally indicating a board role. Investor portfolio pages from
              Lightspeed and Female Founders Fund add direct evidence of institutional sponsorship and founder quality,
              but they do not resolve the larger governance question. Publicly retained sources do not provide a full
              board roster, committee structure, or control-rights map. For diligence, the takeaway is that leadership
              credibility is reasonably well supported, while formal governance transparency still trails the company's
              scale narrative and later-stage valuation claims.
