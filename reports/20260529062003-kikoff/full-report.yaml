              handles and short reviews, which is more useful for diligence because the platform context is not fully
              controlled by Kikoff. That evidence is mixed rather than one-directional: some users say Kikoff was easy,
              cheap, and helpful over a year of usage, while others describe account-access problems,
              cancellation/reporting harm, or operational friction around getting funds out of the product. The result
              is a stronger case that people are genuinely using Kikoff than that they are uniformly delighted by it. It
              is also notable that essentially all retained named customer proof is retail-consumer oriented; the public
              record is thin on named B2B customers, embedded-finance deployments, or enterprise renewals.
