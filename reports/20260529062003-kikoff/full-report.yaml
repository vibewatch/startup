  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Status-Quo Alternatives
        blocks:
          - type: paragraph
            body: |
              The most defensible market boundary for Kikoff is U.S. consumer credit building, not consumer
              credit broadly. Included spend sits in products whose core promise is to establish, thicken, or
              rehabilitate a consumer credit file: bureau-reported subscription tradelines or small revolving
              accounts, secured credit cards, credit-builder installment loans, and rent-reporting or other
              alternative-payment reporting products. Adjacent but not core spend includes nonprofit credit
              counseling and for-profit debt-settlement or credit-repair services, which target financially
              distressed consumers and influence the same funnel of low-score users but solve a more acute debt
              problem than Kikoff-like products do.

              The status quo is not prime rewards cards. It is do-nothing behavior, informal piggybacking,
              mainstream starter cards, secured cards from national issuers, credit-builder loans from fintechs
              or CDFIs, and rent-reporting products that try to turn existing household payments into bureau
              data. That matters for valuation: willingness to pay is constrained by free or fee-light
              alternatives, while product differentiation comes from reporting mechanics, ease of onboarding,
              and whether the consumer sees lift across the bureau files and score versions that lenders
              actually pull.
            claimRefs:
