      - number: '6.4'
        title: Complaints and trust frictions
        blocks:
          - type: paragraph
            body: >-
              Kikoff's trust picture is mixed enough that it deserves its own section. On one hand, app-store ratings
              are strong and BBB's latest visible review snippets are positive. On the other hand, the BBB business
              profile explicitly notes that a review of company complaints was completed in April 2026, Google Play's
              current review feed includes complaints about lockouts, cancellation, and negative reporting, and the CFPB
              complaint database is materially adverse. A CFPB exact- company query for Kikoff Inc. returned 5,982
              complaints as of the run date, with the largest issue buckets centered on incorrect information on credit
              reports, improper use of reports, and failed investigations into existing disputes. The narrative
              complaints are especially important because they point to the same failure modes that can break the Kikoff
              promise: if reporting, identity resolution, or cancellation handling goes wrong, a tool sold as a score
              builder can become a score drag. For underwriting, that means customer acquisition strength cannot be read
              as equivalent to customer trust quality.
