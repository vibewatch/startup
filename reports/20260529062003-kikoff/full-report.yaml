      - number: '6.5'
        title: Expansion motion and concentration risk
        blocks:
          - type: paragraph
            body: >-
              Kikoff's expansion motion is easy to understand publicly. The company starts with a low-price
              credit-building subscription, then expands the relationship through higher tradelines, rent and bill
              reporting, secured-card access, debt negotiation, identity protection, and other utility features. That
              should raise average revenue per user if customers stay. Kikoff also appears to have multiple acquisition
              and expansion channels: direct web/app signup, affiliates, content, and an enterprise/embedded-finance
              motion. The problem is that concentration and durability are still largely undisclosed. Public materials
              do not name enterprise customers, do not quantify active versus signed partners, do not show what share of
              acquisition is partner-led, and do not publish top-customer or top-channel concentration. Likewise, public
              sources do not disclose churn, renewal, NRR, or cohort retention. So the expansion ladder is plausible and
              the channel map is diversified in theory, but the evidence base is still too thin to underwrite channel
              quality or concentration with confidence.
