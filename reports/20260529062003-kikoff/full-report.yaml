      - What it implies
      - Limitation
    rows:
      - - Structural need
        - Credit invisible adults
        - 26M adults (11% of adults)
        - CFPB credit invisibles report, 2010 benchmark
        - Baseline population with no mainstream bureau file visible to common score models
        - Historical benchmark rather than current annual count
      - - Extended thin-file need
        - Unscored adults
        - ~19M adults; ~45M invisible or unscored combined
        - CFPB credit invisibles report, 2010 benchmark
        - Shows the problem is not only zero-file consumers but also stale or too-thin files
        - CFPB later noted a methodological update, but public replacement figure was not isolated in this chapter
      - - Serviceable bank-connected pool
        - Underbanked households
        - 19.0M households (14.2%)
        - FDIC 2023 household survey
        - Consumers already using both banks and alternative services are reachable by digital fintech onboarding
        - Household unit is not directly comparable to adult counts above
      - - Exclusion floor
        - Unbanked households / adults
        - 5.6M households (4.2%) in 2023; 6% of adults in 2024
        - FDIC 2023 survey; Federal Reserve 2024 banking and credit
        - Shows inclusion gains remain incomplete and some consumers still lack basic account infrastructure
        - Mixes household and adult units across sources
      - - Current annual friction
        - Applicants denied or only partially approved
        - 34% of adults applied; one-third of applicants denied or partially approved
        - Federal Reserve 2024 banking and credit
        - Live annual flow of consumers with immediate incentive to seek score-building help
        - Not all denials reflect the thin-file consumer segment
      - - Macro stress / adjacency
        - Household debt and debt-workout activity
        - $18.8T household debt; 4.8% delinquent; nearly 1 in 13 consumers touched settlement/counseling over 2007-2019
        - New York Fed Q1 2026; CFPB quarterly consumer credit trends
        - Supports adjacent demand for debt-fix and credit-repair messaging
        - Debt stress is not synonymous with willingness to buy a credit-building subscription
