      - number: '5.5'
        title: Differentiation, maturity, and product limitations
        blocks:
          - type: paragraph
            body: >-
              Kikoff’s product differentiation comes from combining multiple credit-improvement levers under one
              mobile-led, subscription-priced experience: a closed-loop tradeline, bureau reporting, rent and bill
              feeds, a secured card, debt negotiation, and privacy/identity tooling. The product looks commercially
              mature enough to support a real mobile surface, active release cadence, and millions of Android downloads,
              and the company’s own careers page explicitly frames technology and AI as core to the proposition. But the
              limitations are equally clear. The closed-loop tradeline still cannot buy gas or groceries, which means it
              may improve file optics without solving broader credit access. Independent reviewers repeatedly call out
              that constraint, and several still describe older two-bureau or $500-product configurations, showing that
              outside documentation lags current marketing. More importantly, Kikoff’s own pages are not perfectly
              synchronized: rent-reporting entitlements and bureau coverage vary across current owned surfaces. That
              disclosure drift, plus the lack of public AI-governance or reliability evidence, is the central
              product-tech risk.
