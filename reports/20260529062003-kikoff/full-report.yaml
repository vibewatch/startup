  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segmentation and buyer map
        blocks:
          - type: paragraph
            body: >-
              Kikoff's clearest customer segment is the consumer who either has no file, a very thin file, or a credit
              score below 600 and wants a low-friction starting point. The product surfaces are explicit about this:
              pricing starts at $5 per month, approval is marketed as instant with no hard credit check, and the
              company's own blog and mission copy repeatedly talk about credit- invisible consumers and people left out
              of the credit system. There are also weaker but still relevant persona signals around immigrants,
              students, and young adults: the founder frames the company through an immigrant-access lens, and Kikoff's
              own educational guides specifically call out college students and international students. Buyer, user, and
              payer are usually the same person in the self-serve motion, but Kikoff also has a second buyer layer
              through affiliates and enterprise partners. In those channel cases, the partner is the distribution buyer,
              the end user is the partner's audience or customer, and the economic payer still appears to be the end
              consumer who signs up for a Kikoff subscription.
