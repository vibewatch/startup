  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Recurring subscription model and public pricing
        blocks:
          - type: paragraph
            body: >-
              The strongest financial evidence around Kikoff is not a disclosed revenue figure; it is the existence of a
              clearly tiered recurring subscription model. Kikoff's March 2026 support materials say the company opens a
              small credit-building tradeline, charges a monthly subscription fee, applies that fee toward the next 12
              months of tradeline payments, and reports payment activity to the bureaus. The same support materials show
              a $5 Basic tier, a $20 Premium tier, and a $35 Ultimate tier, with higher tiers bundling bill reporting,
              bill negotiation, secured-card access, and identity-protection features. That is meaningful because it
              shows Kikoff is trying to monetize not just a single $5 entry product but a ladder of higher-ARPU attach
              services. At the same time, public list pricing is not perfectly clean. A 2026 NerdWallet review still
              lists the Premium tier at $25 rather than $20, so even simple plan pricing appears to drift across public
              surfaces. The right read is that recurring subscription revenue is evidenced, official current pricing
              appears to start at $5 per month, and ARPU expansion is a real part of the model, but realized pricing,
              plan mix, discounts, and subscriber counts remain undisclosed.
