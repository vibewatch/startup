companyProfile:
  summary: >
    Kikoff is a San Francisco-based credit-building and consumer-finance platform founded in 2019 by Cynthia Chen and
    Christophe Chong. Its core product is a low-ticket subscription account that helps thin-file consumers build
    bureau-visible history without a hard inquiry, and the company has since layered in rent and bill reporting,
    deposit-backed card access, credit monitoring, disputes, privacy tools, and AI-assisted debt negotiation. Public
    evidence points to meaningful reach and credible investor backing, but underwriting quality is limited by sparse
    financial disclosure, a high complaint burden, and incomplete visibility into the economics behind the reported $1
    billion valuation.
