      - number: '5.2'
        title: Onboarding, reporting, and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Kikoff’s most distinctive workflow choice is that onboarding is designed to feel like subscription signup,
              not a conventional credit underwriting event. The credit-account page says users are instantly approved,
              do not face a credit check, and do not incur a hard pull. After signup, the user gets access to a
              Kikoff-only revolving line, makes a small store purchase, and begins monthly payments that Kikoff markets
              as tradeline-building activity. That same workflow then branches into adjacent reporting rails. Rent
              Reporting asks the user to link the bank account used for rent, provide a lease, and submit landlord
              information; utility-style Bill Reporting is marketed as a TransUnion feed for phone and household bills;
              and the secured card adds an everyday-spend loop for invited higher-tier users. Mobile surfaces reinforce
              the same operating model. The App Store and Google Play listings present Kikoff as a fast, low-friction
              credit builder with AutoPay, score tracking, and plan-based feature unlocks rather than as a general-use
              borrowing product.
