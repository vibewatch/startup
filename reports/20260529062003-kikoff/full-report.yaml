      - number: '7.2'
        title: Regulatory, legal, and privacy exposure rises faster than Kikoff's public disclosures fully close
        blocks:
          - type: paragraph
            body: >-
              The sharpest risk is that Kikoff has expanded from a simple credit-building tradeline into a multi-surface
              consumer-finance bundle without fully simplifying the compliance picture. The company now markets debt
              negotiation inside paid plans, and FTC guidance is explicit that telemarketed debt negotiation, debt
              settlement, and debt-management services are covered by the Telemarketing Sales Rule, which bans upfront
              fees and requires specific disclosures before signup. Kikoff's public licenses page does show a real state
              lending footprint, but the fetched public page did not surface debt-adjuster or debt-settlement labels, so
              the public proof for the Debt Negotiator remains incomplete rather than conclusively reassuring. At the
              same time, Kikoff's terms and card agreement rely on binding arbitration and class-action waivers, and the
              updated 2026 privacy policy is unusually expansive for a credit-builder narrative: it contemplates
              targeted-advertising data sharing, data-broker inputs, and third-party tracking. None of those points
              prove misconduct, but together they create a compliance surface that is materially heavier than the
              $5-entry-price framing suggests.
            claimRefs:
              - CR014
