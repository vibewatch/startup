      - number: '8.3'
        title: Scenario range, strategic upside, and downside
        blocks:
          - type: paragraph
            body: >-
              The scenario work therefore has to start from explicit assumptions rather than false precision. In the
              bear case, Kikoff is a useful but limited credit-builder whose actual revenue base remains below $100
              million and whose customer friction, complaint load, or premium-tier conversion keeps the market near
              sub-5x sales; that yields a value far below the unicorn headline. In the base case, Kikoff has already
              built a real subscription and cross-sell engine closer to a mainstream consumer-finance platform, allowing
              roughly $130 million to $170 million of revenue to justify a valuation around the current mark. In the
              bull case, the company becomes more strategically interesting because the 2025 product suite broadens from
              credit building into debt negotiation, marketplace, and other consumer-finance adjacency. The Credit Karma
              precedent shows why that matters: scaled consumer-credit distribution can be strategically valuable. But
              the precedent does not rescue Kikoff today. Credit Karma had vastly larger membership and broader
              monetization. Kikoff's own downside indicators—reviewer skepticism, recurring complaints, and a large CFPB
              complaint footprint in the queried API response—mean strategic upside must be weighed against genuine
              execution and disclosure risk.
            claimRefs:
