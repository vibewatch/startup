  - id: TM003
    title: Segment / buyer map
    columns:
      - Segment
      - Core user
      - Buyer trigger
      - Typical payer
      - Reporting mechanic sought
      - Why it matters
    rows:
      - - Credit-invisible consumer
        - First-time or no-file adult
        - Need to qualify for apartment, auto, card, or BNPL with no score history
        - Consumer
        - Any tradeline that can create a score after seasoning
        - Most acute structural-need segment but hardest to monetize quickly
      - - Thin-file / rebuilding borrower
        - Consumer with stale or insufficient file
        - Wants score lift before reapplying for mainstream credit
        - Consumer
        - Recurring on-time payment history plus file age
        - Natural target for low-ticket subscription, secured-card, or installment products
      - - Underbanked household
        - Banked consumer still using nonbank credit services
        - Needs safer, lower-cost alternative to high-friction credit options
        - Consumer
        - Simple onboarding and visible reporting cadence
        - Most serviceable digital-fintech segment because payments and bank linkages already exist
      - - Renter seeking score lift
        - Tenant with recurring housing payment
        - Wants existing rent obligation to count toward file building
        - Landlord/property manager or consumer
        - Rent furnishing to one or three bureaus
        - Distribution can come from housing channel instead of direct paid acquisition
      - - Already-indebted distressed borrower
        - Consumer juggling collections or settlement
        - Immediate payment stress or delinquency
        - Consumer
        - Often seeks debt workout before score optimization
        - Important adjacency but poor fit for products that require new payment discipline
      - - Issuer-sponsored starter credit
        - Consumer choosing a secured card
        - Needs broad acceptance and recognizable issuer
        - Issuer subsidizes with low ongoing fees; consumer funds deposit
        - Traditional revolving tradeline to major bureaus
        - Sets a strong pricing and trust benchmark for fintech entrants
    notes: >-
      Buyer, user, and payer are not fixed in this market. Landlords can underwrite acquisition in rent reporting, while
      national issuers can suppress visible fees on secured cards and shift the main consumer cost into refundable
      deposits.
