      - number: '8.4'
        title: Recommendation, kill triggers, and final diligence
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a TRACK recommendation with medium confidence, high risk, and a stretched valuation
              stance. That is not a claim that Kikoff is weak operationally; it is a claim that public evidence does not
              yet support paying the January 2025 unicorn price with conviction. The case for upside is real: the
              company appears capital-efficient, has meaningful user and outcome claims, and has expanded beyond a
              single tradeline product. The case against paying up is stronger than management-friendly summaries admit.
              Public sources still do not disclose current revenue, paying users, plan mix, gross margin, loss behavior,
              or the terms behind the unicorn mark. They do disclose enough friction to worry that customer
              understanding and support quality can affect retention and brand trust. The practical implication is
              simple. A buyer should not underwrite from the headline valuation backward. A buyer should demand current
              ARR and payer counts, margin and complaint normalization, and January 2025 financing terms first. If those
              files clear, the valuation can become reasonable. If they do not, the thesis should be broken quickly
              rather than rationalized.
