      - number: '7.4'
        title: Bureau, bank-partner, and verification dependencies are the thesis-critical concentration
        blocks:
          - type: paragraph
            body: >-
              Kikoff depends on external control points at nearly every stage where a customer expects the service to
              “just work.” Credit-account and secured-card value depends on continued bureau acceptance and correct
              reporting; rent reporting adds bank-linking, lease validation, and landlord verification; and the
              secured-card and banking stack sit on Coastal Community Bank rather than Kikoff itself. The bank partner's
              own privacy notice also confirms that customer information may be disclosed to consumer reporting
              agencies, which means the data perimeter is wider than the app alone. Debt negotiation adds yet another
              dependency layer because Kikoff is effectively positioned between the customer and outside collectors when
              requesting relief offers. The dependency problem is not that any one of these counterparties is unusual in
              consumer fintech; it is that Kikoff bundles many of them into a low-cost subscription offer where one
              broken link can destroy perceived value quickly. A bureau policy shift, bank-partner remediation,
              verification failure, or collector-workflow dispute can all translate into churn, customer complaints, and
              reduced willingness to pay for the bundle.
