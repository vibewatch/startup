      - number: '8.2'
        title: Subscription economics and comparable frame
        blocks:
          - type: paragraph
            body: >-
              Public product evidence says much more about Kikoff's monetization architecture than about its realized
              revenue. The company clearly sells subscriptions: the live ladder is $5, $20, and $35 per month, paired
              with larger reported tradelines and additional features. Just as important, the support materials and
              independent reviews agree that the core tradeline is not open-loop credit. It is primarily a
              credit-building mechanism whose spending is constrained to Kikoff's own ecosystem, and reviewers
              repeatedly argue that premium tiers become harder to justify once the user understands the product limits.
              That puts the valuation burden on demonstrated scale, retention, and cross-sell—not on the headline
              tradeline size alone. The comparable screen is therefore brutal to any optimistic shortcut. Public fintech
              and consumer-finance comps span roughly 0.7x to 13.4x sales, but the mature platforms most analogous to
              consumer-credit distribution cluster far below FICO. Without a public ARR, margin, or churn denominator,
              the $1 billion mark can be defended only by assuming Kikoff already monetizes at a much larger scale than
              the public record reveals.
