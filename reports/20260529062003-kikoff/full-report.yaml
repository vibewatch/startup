  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and buyer-job boundaries
        blocks:
          - type: paragraph
            body: >-
              Kikoff's real competitive set is broader than "credit-builder apps." The direct set includes subscription
              or loan-led builders such as Self, CreditStrong, and Grow Credit that sell a tradeline or bill-reporting
              outcome as the primary job. The substitute set includes Chime Credit Builder and generic secured cards,
              which wrap credit building inside a card or banking relationship; Experian Boost, which tries to raise
              scores without opening a new tradeline; and debt-relief or debt-management paths that attract some of the
              same financially stressed users but solve a different problem. This boundary matters because buyers are
              usually not asking for a "Kikoff-like" product. They are asking for one of three outcomes: get a first
              tradeline cheaply, improve a score quickly, or combine credit repair with everyday money management.
              Kikoff wins the first framing more often than the other two. Once the buyer wants primary-account utility,
              savings accumulation, or creditor negotiation, the field widens fast and Kikoff is no longer the default
              answer.
            claimRefs:
