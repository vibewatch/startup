        - 19.0M 家庭（14.2%）
        - FDIC 2023 年家庭调查
        - 已同时使用银行和替代服务的消费者，可以通过数字金融科技开户注册流程触达
        - 家庭单位不能与上方成年人计数直接比较
      - - 排除下限
        - 无银行账户家庭 / 成年人
        - 2023 年 5.6M 家庭（4.2%）；2024 年 6% 成年人
        - FDIC 2023 年调查；Federal Reserve 2024 年银行与信用
        - 说明普惠进展仍不完整，部分消费者仍缺少基本账户基础设施
        - 不同来源混用了家庭和成年人单位
      - - 当前年度摩擦
        - 申请人被拒或仅部分获批
        - 34% 成年人提出申请；申请者中三分之一被拒或仅部分获批
        - Federal Reserve 2024 年银行与信用
        - 每年仍有一批消费者有即时动力寻求信用建设帮助
        - 并非所有拒绝都反映薄档案消费者群体
      - - 宏观压力 / 相邻需求
        - 家庭债务与债务处置活动
        - $18.8T 家庭债务；4.8% 逾期；2007-2019 年近每 13 名消费者中 1 人接触过和解 / 咨询
        - New York Fed 2026 Q1；CFPB 季度消费者信用趋势
        - 支撑债务修复和信用修复信息的相邻需求
        - 债务压力并不等同于购买信用建设订阅的意愿
