  - id: TP005
    title: 护城河耐久性 / 竞争风险登记表
    columns:
      - 护城河主张
      - 支撑证据
      - 威胁
      - 严重度
      - 对 Kikoff 的含义
    rows:
      - - 付费入门摩擦最低
        - $5 Basic 计划、无硬查询、核心产品无保证金
        - Experian Boost 免费，Grow 有免费层
        - 中
        - 在更完整套餐里 Kikoff 仍胜出，但单看入门价格并不独占
      - - 单一订阅里的宽套餐
        - 信用记录账户、租金、账单、担保信用卡、债务协商、监控
        - 竞品可以把单点拆出来，在某一场景做得更好用，尤其是银行或储蓄场景
        - 中
        - 组合宽度确实有差异化，但买家可以叠加替代品
      - - 三大信用局建信定位
        - 定价页和 App 界面都强调向三大信用局上报
        - Credit Account 文案又单独描述向 Equifax 和 Experian 上报
        - 高
        - 披露含糊会削弱买家对核心判断标准的信任
      - - 低使用率、限 Kikoff 商店的额度
        - 商店购物能把使用率压低，付款节奏也简单
        - 日常用途远弱于真正的担保信用卡或 Chime 账户关系
        - 高
        - Kikoff 上手容易，也容易被用户用到上限
      - - 免押金的核心设计
        - 初始信用记录账户无需预先入金
        - 切换成本低，多平台并用会很常见
        - 中
        - 切入点很好，锁定效应弱
      - - 面向压力用户的信用改善
        - 债务协商和租金 / 账单工具扩大了 Kikoff 能覆盖的问题面
        - 债务和解和非营利债务管理也盯着同一批承压客户，只是切入角度不同
        - 中
        - 用户仍把提分排在付款减免前面时，Kikoff 的竞争力最强
