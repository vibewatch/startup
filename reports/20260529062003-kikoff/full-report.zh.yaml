      - number: '1.4'
        title: 规模、里程碑与风险信号
        blocks:
          - type: paragraph
            body: >-
              规模和动能主张很多，但必须仔细拆开看。独立来源和公司来源现在都指向至少 100 万活跃用户或会员；公司另称到 2025 年底累计用户超过 400
              万。两者不是同一个指标，后续章节不能混用。不过，产品和合作里程碑确实显示公司已扩出最初的闭环信用建设器。AI Credit Disputes 于 2025 年 8 月上线，Equifax 的 Optimal
              Path 规划器集成于 2025 年 11 月跟进，Kikoff 年末发布称累计结果达到 240 million 信用分提升、$21 million 债务节省和 800,000
              个解锁信用产品。主要公开风险信号也在留存来源中可见，而不是被埋起来。CNBC 的评测和 TechCrunch 2021 年最初产品描述都强调，核心 Credit Account 只能在 Kikoff
              自有商店内使用，这会削弱它相对普通卡产品的日常用途。再叠加审计收入、当前员工数和完整治理的公开披露很薄，Kikoff 看起来运营真实、覆盖面越来越宽，但在投资人最需要尖锐承销证据的地方仍部分不透明。
