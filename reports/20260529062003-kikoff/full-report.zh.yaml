            body: >-
              Kikoff 确实有真实用户的具名证明，但主要是消费者证明，不是企业证明。官方层面，Kikoff 发布了 Keshawn、Sammy、Marquita 和 Lila
              这类具名式证言，每个人都描述了使用产品后信用分大幅提升。独立层面，Google Play 和 BBB 露出具名用户用户名和短评；这对尽调更有用，因为平台语境并不完全受 Kikoff
              控制。证据是混合的，而不是单向的：一些用户说 Kikoff 使用一年里简单、便宜、有帮助，另一些用户则描述账户访问问题、取消 / 上报伤害，或把资金从产品中取出时的运营摩擦。结论是，更强的证据能证明人们确实在用
              Kikoff，而不是证明他们都对它满意。也值得注意的是，几乎所有留存的具名客户证明都面向零售消费者；公开记录中，具名 B2B 客户、嵌入式金融部署或企业续约都很薄。
