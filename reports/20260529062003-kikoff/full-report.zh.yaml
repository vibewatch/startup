  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >
              对 Kikoff
              最可辩护的市场边界，是美国消费者信用建设，而不是泛消费者信贷。纳入的支出应是核心承诺为建立、加厚或修复消费者信用档案的产品：向征信机构上报的订阅式信贷账户记录或小额循环账户、担保信用卡、信用建设分期贷款，以及房租上报或其他替代支付上报产品。相邻但非核心支出包括非营利信用咨询，以及营利性债务结清或信用修复服务；它们服务财务压力更大的消费者，也影响同一批低分用户漏斗，但解决的是比
              Kikoff 类产品更急迫的债务问题。


              现状替代方案不是高端返现卡，而是不采取行动、非正式搭便车、主流入门卡、全国性发卡机构的担保卡、金融科技公司或 CDFI
              的信用建设贷款，以及试图把现有家庭付款转成征信数据的房租上报产品。这关系到估值：免费或低费替代品压住了付费意愿，产品差异化则来自上报机制、入门是否容易，以及消费者能否在贷款人实际拉取的征信档案和评分版本上看到提升。
