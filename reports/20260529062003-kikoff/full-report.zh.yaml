        - 索取每名坐席案件数、平均交付节省额、单案人力分钟数和投诉率。
      - - 收入、ARR、GMV 和毛利率
        - 审阅来源未发现公开披露
        - 中
        - 检验估值和毛利韧性所需的核心输入缺失。
        - 索取经审计损益表（P&L）、毛利率桥，以及按层级拆分的月经常性收入。
    notes: 本表每一行要么是公开代理指标，要么是明确缺失的披露。表格刻意保守：它把直接有证据的内容， 与仅从 App 分发、支持机制或投诉界面推断的内容分开。
