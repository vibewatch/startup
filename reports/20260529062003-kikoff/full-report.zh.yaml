            body: Ultimate 档账单协商功能看起来需要人工介入，并触及 CFPB 明确称有风险的消费者金融品类，因此相对纯数字化上报层，它很可能降低毛利率质量。
            calloutType: insight
            claimRefs:
              - CI011
              - CI012
              - CI024
          - type: callout
            title: 优先尽调应聚焦队列、毛利率和流动性
            body: 下一轮尽调应先要订阅者队列、按计划划分的续费和流失、按渠道划分的 CAC 和回本周期、按功能划分的毛利率桥，以及当前现金和债务包，再认真判断任何估值。
            calloutType: recommendation
            claimRefs:
              - CI020
