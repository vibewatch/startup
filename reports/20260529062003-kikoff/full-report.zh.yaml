          - type: paragraph
            body: >-
              公开资本形成记录能支撑到 2020–2021 年融资序列，但当前估值支撑没有标题那么透明。TechCrunch 2021 年 6 月报道称，Kikoff 在此前未公告的 $12.5 million 种子轮和
              Series A 之后完成 $30 million Series B，意味着已披露融资约 $42.5 million。Parsers VC 和 Tracxn 的两轮数据库摘要也在方向上印证这个总额。同一篇
              TechCrunch 报道称 Portage Ventures 领投 Series B，Lightspeed、GGV、Coatue 和 Core Innovation Capital 参投，并把 Steph
              Curry 列为早期投资人。Lightspeed 和 Female Founders Fund 的直接投资组合页面进一步证明，声誉较好的投资人仍公开关联 Kikoff。估值故事更难直接核验。多篇 2026
              年文章和公司相邻稿件把 Kikoff 称为独角兽，或称其在 2025 年大约是一家 $1 billion 公司；但我们留存、可直接查看的 PitchBook 存档更早，并没有露出 2025
              年投后估值字段。因此，融资历史比当前估值标题更扎实，尽管多个留存来源都重复了独角兽叙事。
