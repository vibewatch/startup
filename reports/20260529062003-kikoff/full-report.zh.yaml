      - number: '8.2'
        title: 订阅经济性与可比框架
        blocks:
          - type: paragraph
            body: >-
              公开产品证据更多说明 Kikoff 的变现架构，而不是已实现收入。公司明确卖订阅：实时价格阶梯是每月 $5、$20 和
              $35，并配套更大的报称信用账户记录与更多功能。同样重要的是，支持材料和独立评测一致认为，核心信用账户记录并不是开放式信用。它主要是一个信用建设机制，消费被限制在 Kikoff
              自己的生态里；评测者也反复指出，用户理解产品限制后，高级档更难自证合理。这样一来，估值负担就落在已证明的规模、留存和交叉销售上，而不是标题里的信用账户记录规模。可比公司筛选因此会无情压制任何乐观捷径。公开金融科技和消费者金融可比公司的销售倍数大致在
              0.7x 到 13.4x 销售收入之间，但最接近消费者信用分发的成熟平台明显低于 FICO。没有公开 ARR、利润率或流失分母，只有假设 Kikoff 的变现规模已经远大于公开记录显示的水平，$1B
