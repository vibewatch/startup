chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品范围与业务足迹
        blocks:
          - type: paragraph
            body: >-
              Kikoff 当前的身份在自有界面上最清楚：它把自己定位为消费者金融平台，用低价数字工具帮助人们建立信用、降低债务、提升财务安全。这一点重要，因为公司已不再只按一个信贷账户记录产品来营销。核心引擎看起来仍是
              Kikoff Credit Account；FAQ 称其为 Kikoff
              的主产品，信用账户页面则把它描述为一条循环信用额度，用来建立还款记录、压低使用率，并拉长账户账龄。公开产品页和博客解释也把这家私营金融科技公司的定价逻辑讲得异常清楚。官网称计划起价 $5 /
              月，配套解释则描述了免费账户、$5 Basic 档以及更高的监测计划。同一批留存来源还确立了后续章节最重要的结构性限制：Kikoff
              的旗舰账户刻意做成闭环。它服务的是征信上报行为和监测价值，而不是像通用日常信用卡那样使用。官方和媒体来源一致把公司放在 San Francisco。
