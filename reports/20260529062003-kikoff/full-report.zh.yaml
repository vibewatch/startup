  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: standard
    summary: Kikoff 的核心旅程始于信用记录稀薄或信用分低于 600 的消费者发现低成本产品，随后进入按月循环上报；其中一部分用户会继续走向更深的产品组合，或进入由合作伙伴牵引的关系。
    data:
      items:
        - stage: 信用问题识别
          actors:
            - 信用记录稀薄消费者
            - 低于 600 分的信用修复者
            - 学生 / 新来者画像
          touchpoints:
            - Kikoff 博客
            - SEO 内容
            - 首页社会认同
          emotion: 需要一条低摩擦路径进入信用体系，不用押金，也不用硬查询
          label: 问题识别
        - stage: 方案选择
          actors:
            - 直接访问网站的潜在客户
            - 应用商店浏览者
            - 联盟推荐线索
          touchpoints:
            - 首页
            - 定价页
            - Apple App Store
            - Google Play
          emotion: 评估 $5 入门价和无需信用检查的说法是否足够安全，值得一试
          label: 注册与方案选择
        - stage: 信用账户激活
          actors:
            - 新订阅用户
          touchpoints:
            - Credit Account
            - Kikoff 商店购买
            - 自动扣款设置
          emotion: 希望首次付款和首次征信机构上报都顺利发生
          label: 激活
        - stage: 按月循环使用
          actors:
            - 活跃付费用户
          touchpoints:
            - 月度付款周期
            - 信用分监控
            - 提醒 / 自动扣款
            - 房租或账单上报
          emotion: 持续按时付款很关键，因为产品效果取决于付款行为，既可能帮忙，也可能伤信用
          label: 月度上报循环
        - stage: 扩展或推荐
          actors:
            - Premium / Ultimate 用户
            - 担保卡用户
            - 联盟 / 企业终端用户
          touchpoints:
            - 担保卡
            - 债务谈判
            - 合作伙伴渠道
            - 评论触点
          emotion: 最好路径是采用更多产品；最差路径是投诉或取消时摩擦加大
          label: 扩展 / 推荐
