      - number: '4.2'
        title: 采用代理、单位经济与利润率含义
        blocks:
          - type: paragraph
            body: >-
              Kikoff 不公布 CAC、回本周期、毛利率或
              LTV，因此公开单位经济只能靠代理指标拼出。获客侧看起来低接触：应用商店分发、无信用检查信息、应用内计划变更、默认自动扣款和默认自动续订，都更像消费者自助漏斗，而不是人工销售动作。AppBrain
              估计历史累计下载约 5.1 million、过去 30 天下载 110 thousand、评分约 120
              thousand，说明漏斗触达很宽，尽管这不能证明付费转化。利润率侧则更混合。一些功能看起来有软件属性、潜在吸引力较强：征信机构上报、房租上报和经常性订阅计费，应比开放循环贷款人的承销栈更易扩展。但 Kikoff
              不是纯软件。公开来源显示，公司涉及核销后服务、补报、账单上报集成、担保卡入口、信用建设贷款流程，以及会直接联系供应商的 Ultimate 档账单协商团队。CFPB
              关于债务减免的指引强调，这个品类可能有风险。含义是，Kikoff 的毛利率画像很可能好于资产负债表很重的次级贷款人，但低于、且运营暴露高于干净的 SaaS 订阅。
