    rows:
      - - 征信局报送的信用账户记录或订阅式信用建设账户
        - 月度方案费用、小额循环账户使用权、征信报送和监控
        - 优质奖励信用卡、无担保通用贷款
        - 消费者直接付费
        - 最接近 Kikoff 式自助信用建设
      - - 保证金信用卡
        - 保证金支持的用卡、发卡方服务、月度报送
        - 优质无担保卡奖励和余额转移产品
        - 消费者出资保证金；发卡方可补贴持续费用
        - 重建或建立信用的主流第一步替代方案
      - - 信用建设分期贷款
        - 贷款服务、利息 / 费用、CD 或锁定储蓄结构、月度征信报送
        - 资金可自由使用的普通个人贷款
        - 消费者直接付费
        - 竞争点是还款历史积累和承诺严肃性
      - - 租金报送 / 替代支付报送
        - 租金报送费用或房东付费项目支出、数据报送、住户互动
        - 仅做租客筛查的产品和不做信用报送的物业软件
        - 房东 / 物业经理或消费者
        - 重要相邻渠道，因为它把既有支出转成建档数据
      - - 相邻的信用咨询 / 债务和解 / 信用修复
        - 咨询费、解决后的和解费、债务管理服务
        - 普通破产法律服务和再融资产品
        - 消费者直接付费
        - 与低分人群漏斗重叠，但解决的是债务重组，不只是分数形成
      - - 现状替代品
        - DIY 信用监控、等待信用记录成熟、授权用户帮助、入门卡
        - 企业级征信基础设施和贷款人承销软件
        - 消费者或家庭网络
        - 界定真实竞争集合，并限制付费意愿
    notes: 纳入支出聚焦主要消费承诺是建立信用档案或提升分数的产品。债务和解被视为相邻市场，而不是核心 TAM，因为监管机构和 CFPB 消费者指引把它定义为不同于信用建设的问题。
