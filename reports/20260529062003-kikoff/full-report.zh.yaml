      - number: '5.2'
        title: 入门、上报与客户工作流
        blocks:
          - type: paragraph
            body: >-
              Kikoff 最有辨识度的工作流选择，是把入门设计得像订阅注册，而不是传统信用承销事件。信用账户页面称用户可即时获批，不需要信用检查，也不会产生硬查询。注册后，用户获得一条 Kikoff
              专用循环额度，做一笔小额商店购买，并开始月度付款；Kikoff 把这种付款营销为建立信贷账户记录的活动。同一工作流随后分叉到相邻上报轨道。Rent Reporting
              要求用户连接用于付租的银行账户、提供租约并提交房东信息；水电式 Bill Reporting 被营销为面向 TransUnion
              的手机和家庭账单数据流；担保卡则为受邀高档位用户增加一个日常消费闭环。移动端界面强化了同一运营模型。App Store 和 Google Play 列表把 Kikoff 呈现为快速、低摩擦的信用建设器，带有
              AutoPay、分数跟踪和按计划解锁功能，而不是通用借贷产品。
