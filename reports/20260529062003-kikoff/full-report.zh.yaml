      - number: '1.2'
        title: 创始人、领导层与治理可见度
        blocks:
          - type: paragraph
            body: >-
              Kikoff 仍然高度绑定创始人形象。Cynthia Chen 是官方关于页面、2026
              年公司报道、投资人档案和第三方会议材料中最常出现的高管；这些来源反复把她个人没有信用记录的经历写成业务的情感与战略起点。这个创始人—市场匹配故事重要，因为 Kikoff
              向那些常被主流金融排除在外的消费者销售信任和可及性。Christophe Chong 在面向消费者的页面上可见度低得多，但 TechCrunch 和存档的 PitchBook 材料仍把他锚定为联合创始人兼
              CTO，PitchBook 还显示他担任董事。Lightspeed 和 Female Founders Fund
              的投资组合页面进一步证明了机构背书和创始人质量，但没有解决更大的治理问题。公开留存来源没有给出完整董事会名单、委员会结构或控制权地图。尽调结论是：领导层可信度有相当支撑，但正式治理透明度仍落后于公司的规模叙事和后期估值主张。
