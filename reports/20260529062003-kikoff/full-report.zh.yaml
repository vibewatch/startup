      - number: '6.5'
        title: 扩张动作与集中度风险
        blocks:
          - type: paragraph
            body: >-
              Kikoff
              的扩张动作在公开层面很容易理解。公司从低价信用建设订阅起步，再通过更高信贷账户记录、房租和账单上报、担保卡入口、债务协商、身份保护和其他实用功能扩张关系。如果客户留下来，这应能提高平均每用户收入。Kikoff
              也看起来拥有多条获客和扩张渠道：直接网页 / 应用注册、联盟营销、内容和企业 /
              嵌入式金融动作。问题在于，集中度和耐久性仍基本未披露。公开材料没有列出企业客户名称，没有量化活跃合作伙伴与签约合作伙伴，没有显示合作伙伴驱动获客占比，也没有公布头部客户或头部渠道集中度。同样，公开来源没有披露流失率、续费、NRR
              或队列留存。因此，扩张阶梯是可信的，渠道地图在理论上也多元；但证据基础仍太薄，无法有把握地承销渠道质量或集中度。
