      - number: '8.4'
        title: 建议、终止触发条件与最终尽调
        blocks:
          - type: paragraph
            body: >-
              证据支持继续跟踪建议：中等置信度、高风险、估值偏紧。这不是说 Kikoff 运营弱，而是说公开证据还不足以让投资人有把握支付 2025 年 1
              月的独角兽价格。上行逻辑真实存在：公司看起来资本效率高，拥有可观的用户和结果主张，并且已经超出单一信用账户记录产品。反对高价买入的逻辑比偏管理层友好的摘要承认得更强。公开来源仍未披露当前收入、付费用户、方案结构、毛利率、损失行为，或独角兽标记背后的条款。它们披露的摩擦已经足以让人担心，客户理解和客服质量会影响留存与品牌信任。实际含义很简单。买方不应从标题估值倒推承销。买方应先要求当前
              ARR 和付费用户数、利润率与投诉正常化，以及 2025 年 1 月融资条款。如果这些文件通过，估值可以变得合理；如果不能，投资论证应快速打破，而不是被合理化。
