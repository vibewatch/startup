  - id: TI005
    title: 公开财务缺口表
    columns:
      - 缺失指标
      - 对尽调判断的影响
      - 当前最佳公开代理指标
      - 精确尽调路径
      - 严重程度
    rows:
      - - 收入、ARR 或 GMV
        - 没有收入披露，投资者无法用收入或增长检验据称估值。
        - PitchBook 摘要将当前收入留空。
        - 索取经审计历史收入、月度收入桥，以及按套餐和产品拆分的增长。
        - 阻断性
      - - 付费订阅用户和活跃客户
        - 下载触达不能直接换算为付费规模或收入质量。
        - 仅有 AppBrain 下载和评分信号。
        - 索取活跃付费订阅用户、免费转付费转化，以及按产品拆分的活跃客户。
        - 重大
      - - CAC、回本周期和销售组合
        - 缺少渠道层面获客数据，自助 GTM 逻辑无法验证。
        - App 主导分发和低入门价只能提供方向性代理。
        - 索取渠道组合、付费 CAC、自然转化、转介绍占比和按队列回本周期。
        - 重大
      - - 按套餐划分的流失、续费和 LTV
        - 经常性收入质量取决于留存，而不只是注册量。
        - 自动续费和分层附加服务暗示留存，但不能证明留存。
        - 索取队列留存、续费、流失，以及各套餐生命周期毛利。
        - 重大
      - - 按产品划分的毛利率和 COGS
        - 人工服务附加项和上报成本不透明，毛利韧性无法判断。
        - 产品复杂度和 CFPB 风险指引意味着存在服务成本，但不能说明成本规模。
        - 索取毛利率桥、供应商成本、支持成本、争议率和账单议价人力模型。
        - 阻断性
      - - 现金、债务和现金跑道
        - 尽管历史融资有证据，资本依赖度仍无法判断。
        - 仅有融资历史和二级市场信号。
        - 索取资金包、债务明细、契约摘要和下行情景现金跑道模型。
        - 阻断性
    notes: TI005 刻意选择重点而非穷尽。它抓住最可能改变估值、收入质量和融资依赖判断的缺失私有指标。
