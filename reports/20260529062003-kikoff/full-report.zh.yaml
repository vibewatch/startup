      - number: '3.3'
        title: 替代品：银行打包、评分叠层与担保卡
        blocks:
          - type: paragraph
            body: >-
              替代品重要，因为很多用户根本不想要一个专用信用建设器。Chime 的竞争方式，是把信用建设做成更大银行闭环里的一个功能：支票账户、提前发薪、透支工具、存款、ATM 使用权和担保卡。这带来远多于 Kikoff
              的日常用途；一旦工资直存到位，行为锁定也更强。Discover 等通用担保卡在商户接受度和主流卡行为上更进一步，但也需要实质更高的预先资金和往往更硬的承销步骤。Experian Boost
              处在另一个极端：免费、快速、可移除，但它是 Experian
              档案叠层，而不是广泛可携带的新信贷账户记录。债务结清和债务管理不是真正的建设器，却是相关相邻项，因为压力中的消费者可能先选择付款减免，再选择信用分优化。信用影响正好相反：CFPB 警告债务结清可能拉低分数，而
              NFCC 把非营利债务管理描述为风险更低的重组路径，不是信用建设产品。
