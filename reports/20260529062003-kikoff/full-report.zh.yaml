      - number: '3.2'
        title: 直接建设器：产品设计、定价与征信覆盖
        blocks:
          - type: paragraph
            body: >-
              在直接建设器里，Kikoff 的起步承诺最轻。Basic 起价 $5 / 月，不需要押金，并把上报的信贷账户记录与房租上报、监测工具打包。Self 和 CreditStrong
              要求更多月度支出，但给客户的东西也是 Kikoff 大多不给的：一种传统分期结构，能返还储蓄，或随时间建立大得多的信贷账户记录。Self 的建设器本质上是 CD 支持的分期贷款，担保卡起始押金为
              $100，账单产品把房租上报到三大征信机构，而水电和手机账单只上报 TransUnion。CreditStrong 更深入信用工程：Revolv 针对使用率，MAGNUM 针对长期分期历史，Instal
              针对也想强制储蓄的新信用用户。Grow Credit 在低摩擦入门上是 Kikoff
              最接近的产品设计表亲，但范围更窄：消费对象是订阅账单，额度更小，免费档有吸引力主要是因为容易多平台叠加，而不是它能替代更宽的信用建设组合。
