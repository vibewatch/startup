        - 在催收或债务和解之间周旋的消费者
        - 即时还款压力或逾期
        - 消费者
        - 通常先寻求债务处置，再考虑信用分优化
        - 重要相邻市场，但不适合要求新增付款纪律的产品
      - - 发卡方赞助的入门信用产品
        - 选择担保信用卡的消费者
        - 需要广泛受理和可识别发卡方
        - 发卡方用低持续费用补贴；消费者提供保证金
        - 向主要信用局报送的传统循环信用账户
        - 为金融科技进入者设下很强的价格和信任基准
    notes: 这个市场里，买方、用户和付款方并不固定。租金报送可以由房东承担获客成本；全国性发卡方则能压低担保卡的可见费用，把主要消费者成本转到可退还保证金里。
