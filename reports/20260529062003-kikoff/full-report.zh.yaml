      - number: '2.4'
        title: 增长驱动、约束与债务减免相邻性
        blocks:
          - type: paragraph
            body: >
              需求驱动真实存在。金融普惠仍未完成，低银行服务家庭仍用替代提供方满足信贷需求，每年信贷申请者中也有相当比例遭遇拒批或部分批准。产品侧供给也在扩张：发卡机构和金融科技公司现在提供免年费担保卡、分期式信用建设器，以及承诺征信覆盖的房租上报产品。这些动态支持品类继续增长，也贴合围绕金融普惠的
              ESG 式叙事，尤其是产品能帮助消费者建立有记录、可携带的付款历史时。


              约束同样实质。这个品类缺少干净的公开 SAM/SOM 数据集；征信覆盖被单征信机构和三征信机构产品切碎；FICO 沉淀规则推迟了结果可见的时间；CFPB
              也明确警告，房租数据提供方必须把准确性和争议处理做好。相邻的债务减免市场也足够大，会影响叙事风险。CFPB 区分非营利咨询与营利性结清、修复，FTC 禁止债务减免电话营销预收费，CFPB 季度信用趋势显示结清量自
              2016 年以来上升。任何 Kikoff 类公司一旦从信用建设滑向债务修复承诺，就会继承严苛得多的监管环境。
