companyProfile:
  summary: >
    Kikoff 是一家总部位于 San Francisco 的信用建设和消费者金融平台，由 Cynthia Chen 与 Christophe Chong 于 2019
    年创立。它的核心产品是低客单价订阅账户，帮助信用档案很薄的消费者在不触发硬查询的情况下建立征信可见记录；公司随后叠加了房租和账单上报、押金担保卡入口、信用监测、异议处理、隐私工具，以及 AI 辅助债务协商。公开证据显示 Kikoff
    已有可观触达和可信投资人背书，但财务披露稀疏、投诉负担较高，也看不清据报道 $1 billion 估值背后的经济性，限制了尽调质量。
