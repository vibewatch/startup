  - id: TP003
    title: 定价 / 包装对比
    columns:
      - 选项
      - 留存最低入门价格
      - 高阶层级或额外费用锚点
      - 期限 / 退出
      - 包含的附加项
      - 含义
    rows:
      - - Kikoff
        - $5/mo Basic
        - $20/mo Premium；$35/mo Ultimate；过往租金回溯报送费 $50
        - 营销 12 个月计划；可取消，但价值由订阅驱动
        - 租金报送、监控、担保卡权限、账单报送、债务谈判、身份功能
        - 完整套餐中付费入门价最低
      - - Self
        - $25/mo Credit Builder Account 账户
        - 水电 / 手机报送 $6.95/mo；卡首年年费 $0，之后 $25；担保卡 APR 27.49%
        - 建立产品期限 24 个月；返还储蓄时扣除利息和费用
        - 担保卡、租金和账单、现金预支
        - 更贵，但更传统，也与储蓄挂钩
      - - CreditStrong Revolv
        - $15/mo
        - 高阶层级 $25/mo，或最高 $249/year 的年付计划
        - 可取消；围绕使用率优化设计
        - 更大循环信用账户、FICO 分数、高阶层级信用监控
        - 比 Self 便宜，但仍高于 Kikoff Basic
      - - CreditStrong MAGNUM / Instal
        - $16/mo MAGNUM 与 $28/mo Instal
        - 信用账户规模随产品选择显著上升
        - 长分期弧线；Instal 48 个月积累 $1,010 储蓄
        - 分期历史、储蓄返还、信用组合工程
        - 最适合投入度高的信用重建者，不适合随便试用者
      - - Grow Credit
        - 免费 Build 层
        - $2.99/mo Build Secured、$4.99/mo Grow 与 $9.99/mo Accelerate
        - 12 个月可续计划；易添加或退出
        - 订阅资金流、免费 FICO、低保证金选项
        - 留存来源中唯一免费直接信用建立产品，但额度小
      - - Chime Credit Builder
        - 留存来源定位为 $0 月费
        - 网络外 ATM 费 $2.50；高级价值与直接存款联动功能绑定
        - 开放式银行关系，而不是固定信用建立期限
        - 支票账户、透支、提前发薪、储蓄、担保卡
        - 价格看起来低，真实成本是迁移行为和存款
      - - Experian Boost
        - 免费
        - 本章未留存付费信用建立层级
        - 随时可移除
        - 账单识别、Experian 报告访问、分数监控
        - 对只想要免费分数叠加的用户，Kikoff 的价值承压明显
      - - Discover 担保信用卡
        - 至少 $200 可退还保证金
        - 若滚存余额则适用 APR；担保卡页面未留存年费
        - 开放式卡关系，7 个月后进行升级评估
        - 返现、商户受理、传统用卡行为
        - 现金门槛更高，消费效用好得多
    notes: 本表比较标价和披露保证金，不比较实际生命周期成本。Chime 的经济权衡与会员价格关系较小，更多在于把客户的支票账户行为、直接存款和现金流迁入 Chime 生态。
