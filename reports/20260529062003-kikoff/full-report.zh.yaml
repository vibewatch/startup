  - id: TP001
    title: 竞品画像表
    columns:
      - 选项
      - 类别
      - 核心承诺
      - 入门价格 / 现金要求
      - 留存来源中的信用局路径
      - 相比 Kikoff 的主要限制
    rows:
      - - Kikoff
        - 直接订阅式信用建立产品
        - 低价第一条信用账户，并打包租金、账单、担保卡和债务工具
        - $5/mo 基础版；核心产品无需保证金；若加担保卡最低 $50
        - 计划层面三大信用局报送；租金报送至 Equifax/TransUnion；账单报送至 TransUnion
        - 核心额度限于 Kikoff 商店，公开信用局措辞也并不完全一致
      - - Self
        - 直接分期信用建立产品 + 担保卡
        - 同时建立信用和储蓄，再叠加担保卡和租金 / 账单报送
        - 信用建立入门 $25/mo；卡保证金最低 $100
        - 贷款和卡均报送三大信用局；租金报送三大信用局；水电 / 手机报送 TransUnion
        - 月费高于 Kikoff，承诺期也更长
      - - CreditStrong
        - 直接信用账户优化器
        - 用多款专门产品改善使用率、分期厚度和信用组合
        - $15/mo Revolv、$16/mo MAGNUM 与 $28/mo Instal
        - 留存产品均报送三大信用局
        - 比 Kikoff 的入门楔子更复杂，通常也更贵
      - - Grow Credit
        - 直接订阅卡细分产品
        - 借 Mastercard 外壳，用经常性订阅建立信用
        - 有免费层；付费层 $2.99、$4.99、$9.99；$17 担保保证金选项
        - 应用商店页面称所有层级都报送 Equifax、Experian 和 TransUnion
        - 消费上限更低，当前公开披露也比 Kikoff 更薄
      - - Chime Credit Builder
        - 主账户银行替代品
        - 把信用建立与支票账户、提前发薪、透支、存款和 ATM 使用打包
        - 留存来源未披露月费；价值取决于支票账户 / 直接存款关系
        - 留存来源讨论了分数影响和担保卡结构，但未留存当前官方关于三大信用局报送的表述
        - 比 Kikoff 要求更深的银行关系
      - - Experian Boost
        - 分数叠加替代品
        - 不开新信用账户，靠已支付账单提高分数
        - 免费
        - 作用于 Experian 信用档案和基于 Experian 的分数，而不是新的跨信用局信用账户
        - 持久性和可迁移性弱于真正的信用账户产品
      - - 主流担保信用卡
        - 现状替代品
        - 在商户使用真实信用卡，同时通过正常用卡行为建立信用
        - 留存基准示例：Discover 可退还保证金起点为 $200
        - Discover 称活动会报送三大信用局
        - 前置现金门槛明显高于 Kikoff
      - - 债务和解 / 债务管理
        - 困境相邻市场
        - 降低还款压力或结清余额，而不是建立薄信用档案
        - 咨询或和解经济性因项目而异
        - 可能伤害信用，也可能后续帮到信用，取决于路径；不是主要信用账户策略
        - 解决的是债务负担，不是 Kikoff 销售的核心信用建立任务
    notes: 私人信用建立公司的公开规模披露在留存来源中不均衡，因此本画像表强调产品设计、入门摩擦和披露的信用局行为，而不强行比较某个客户数 KPI。
