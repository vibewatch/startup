      - number: '5.4'
        title: 信任、隐私与质量控制
        blocks:
          - type: paragraph
            body: >-
              Kikoff
              的信任姿态可观察，但只能部分承销。正面看，自有界面承诺银行级安全、最高档位的身份盗用保险、针对数据经纪人的隐私监测、免费异议处理，以及在房租和账单上报等部分附属产品上只做正向上报。法律栈比营销文案更有信息量。Kikoff
              2026 年 2 月隐私政策覆盖网站和移动应用，称公司收集标识符、线上活动、地理位置和推断信息，并称数据可来自公开来源和数据经纪人。条款还允许 Kikoff 及服务提供商使用电话号码、IMEI、订户 /
              设备信息做身份验证和欺诈防范。在担保卡 / 银行层，Coastal Community Bank 的隐私通知又加入
              SSN、收入、余额、付款历史和信用分等典型金融数据类别。缺失的是运营信任证据：审阅页面没有找到公开状态页、公开正常运行时间 SLA 或公开安全认证界面。
