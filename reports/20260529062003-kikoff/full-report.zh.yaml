  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图与买方任务边界
        blocks:
          - type: paragraph
            body: >-
              Kikoff 真正的竞争集比“信用建设应用”更宽。直接竞争包括 Self、CreditStrong、Grow Credit
              等以订阅或贷款驱动的建设器，它们把信贷账户记录或账单上报结果作为核心任务来销售。替代集包括 Chime Credit Builder 和通用担保卡，前者把信用建设包进卡或银行关系；Experian Boost
              试图在不开新信贷账户记录的情况下拉高分数；债务减免或债务管理路径则吸引部分同样有财务压力的用户，但解决的是另一类问题。这个边界重要，因为买方通常不是在寻找一个“像 Kikoff
              的”产品。他们要的是三种结果之一：便宜地拿到第一条信贷账户记录、快速改善信用分，或把信用修复与日常资金管理结合起来。Kikoff
              更常赢下第一种叙事。一旦买方想要主账户用途、储蓄积累或债权人协商，竞争场域会迅速变宽，Kikoff 不再是默认答案。
