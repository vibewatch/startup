  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资背景与入场纪律
        blocks:
          - type: paragraph
            body: >-
              Kikoff 的估值论证始于一个扎实的历史锚点和一个单薄的近期锚点。扎实锚点是 2021 年上线融资：多个留存来源都指向累计融资 $42.5M，最后披露的一轮是 Portage 领投的 $30M Series
              B。单薄锚点是据称 2025 年 1 月达到独角兽估值。独立榜单类来源和市场数据档案持续把 Kikoff 放在 $1B，公司随后也称 2025
              年实现独角兽地位，但公开记录仍没有显示融资金额、工具类型或下行保护。这个缺口重要，因为公司显然真实且有规模——其 2025 年发布稿称累计用户超过 4M、累计信用分增量超过
              240M——但价格还没有披露的分母支撑。只披露历史融资 $42.5M，却打出 $1B 标记，既可以解读为资本效率高，也可能意味着公开价格发现异常稀疏。因此，正确起点不是不相信公司，而是对可承销价格保持怀疑。
