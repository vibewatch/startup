        - 索取获客渠道组合、混合 CAC、增量付费 CAC，以及各套餐回本周期。
      - - LTV 或按套餐留存
        - 未公开披露
        - 中
        - 经常性收入质量更取决于留存，而不是下载量。
        - 索取队列留存、续费率、取消率和各套餐订阅月数。
      - - 采用代理指标
        - 5.1M 次下载、过去 30 天 110K 次下载、约 120K 条评分
        - 中
        - 如果转化健康，广覆盖可支撑低 CAC，但触达不等于收入。
        - 索取按月从 App 安装到付费套餐的漏斗。
      - - 营销价值主张
        - 三个月内信用评分平均提升 58+ 分
        - 低
        - 有助于拉动需求，但这是公司营销口径，不是经审计的经济性。
        - 索取方法、样本量，以及按起始分数段拆分的结果。
      - - 核销账户服务
        - 账户逾期 180+ 天未付款后会核销，且不能重新开通
        - 中
        - 即使是小额经常性产品，也需要催收、上报和客服成本。
