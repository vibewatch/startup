  - id: FI001
    title: 收入模型桥
    type: flow
    layout: standard
    summary: Kikoff 的公开证据指向以经常性订阅为核心，并靠附加服务把 ARPU 拉到 $5 入门套餐之上。
    data:
      nodes:
        - id: r1
          label: App 注册
          detail: 消费者下载 App，并在没有传统销售流程的情况下加入 Kikoff 套餐。
        - id: r2
          label: Credit Account 套餐
          detail: Kikoff 按层级开通 $750 到 $3,500 的信贷记录。
        - id: r3
          label: 月度订阅费
          detail: 消费者按套餐和公开来源，每月支付 $5、$20 或 $35。
        - id: r4
          label: 征信报送价值
          detail: 按时付款和信贷记录活动会报送给征信机构，以支撑客户价值主张。
        - id: r5
          label: 附加服务附着
          detail: 租金报送、账单报送、账单协商和担保卡准入扩大变现面。
        - id: r6
          label: 经常性续订
          detail: 默认 AutoPay 和自动续订支撑持续订阅计费。
        - id: r7
          label: 毛利池
          detail: 毛利取决于数字报送和留存收益在多大程度上超过服务、支持和合规成本。
      edges:
        - from: r1
          to: r2
          label: 注册加入
        - from: r2
          to: r3
          label: 选择层级
        - from: r3
          to: r4
          label: 为报送周期付费
        - from: r4
          to: r5
          label: 支撑增购
        - from: r5
          to: r6
          label: 扩大 ARPU
        - from: r6
          to: r7
          label: 留存很关键
    approximationNotes: 仅作定性判断。已审查来源证明了经常性费用阶梯和功能组合，但没有披露实际 ARPU、附加率或按功能拆分的毛利率。
