            body: >-
              公开触达证据远强于公开留存证据。Kikoff 关于页面称已赋能 1 million 客户，官网营销 150K+ 用户评价和 80M+ 总提升分数。在当前应用商店界面上，Apple 显示 247K
              评分、4.9/5，Google Play 显示 122K 评价、4.8/5，另有 5M+
              下载。这些数字大到足以支撑大众市场消费者金融科技公司的判断，而不是小众试点。分发也不止单一应用下载路径：官网指向直接网页注册，联盟营销页面称 650+ 合作伙伴使用 Impact
              驱动的链接和素材，企业站则向零售商和其他合作伙伴推销嵌入式信用建设。这些公开触达指标没有回答的是：有多少用户是活跃付费订阅者，第一年后有多少留存，获客中有多少来自直接应用商店、多少来自合作伙伴驱动的流程。
