  - id: FI002
    title: 单位经济性桥
    type: flow
    layout: standard
    summary: 公开的单位经济性故事只能搭出一条代理链：App 获客转化为经常性收入，同时受服务和合规成本抵消，而这些成本仍未披露。
    data:
      nodes:
        - id: u1
          label: 应用商店触达
          detail: 下载量和评分意味着广泛的消费者获客触达。
        - id: u2
          label: 自助开通
          detail: 无信用检查、App 内注册，说明获客漏斗偏低接触。
        - id: u3
          label: 默认经常性扣费
          detail: AutoPay 和自动续订默认开启；如果客户保持正常付款，应能支撑连续性。
        - id: u4
          label: 月费收取
          detail: 收入质量取决于多少安装用户转为付费且续订的账户。
        - id: u5
          label: 服务与合规成本
          detail: 坏账核销、争议、报送运营、账单协商和支持都会吃掉利润。
        - id: u6
