      - number: '5.5'
        title: 差异化、成熟度与产品限制
        blocks:
          - type: paragraph
            body: >-
              Kikoff 的产品差异化来自把多个信用改善杠杆放进一个移动优先、订阅定价的体验：闭环信贷账户记录、征信机构上报、房租和账单数据流、担保卡、债务协商，以及隐私 /
              身份工具。产品看起来商业成熟度足以支撑真实移动端、活跃发布节奏和数百万 Android 下载，公司自有招聘页也明确把技术和 AI
              写成价值主张核心。但限制同样清楚。闭环信贷账户记录仍不能买汽油或杂货，意味着它可能改善档案观感，却不能解决更广泛的信用可得性。独立评测反复点出这个约束，几篇评测仍在描述较旧的双征信机构或 $500
              产品配置，说明外部文档落后于当前营销。更重要的是，Kikoff 自有页面并不完全同步：房租上报权益和征信覆盖在当前自有界面之间有所差异。这种披露漂移，再加上缺少公开 AI 治理或可靠性证据，就是核心产品技术风险。
