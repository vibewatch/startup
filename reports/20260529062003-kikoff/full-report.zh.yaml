      - number: '7.6'
        title: 有缓释因素，但只有短清单尽调补齐几个关键缺口，投资判断才会改善
        blocks:
          - type: paragraph
            body: >-
              公开记录里确实有缓释因素。Kikoff 可以指向其放贷活动可见的州级牌照足迹、保证金信用卡协议里的无年费和 0% APR、45 天退款保证，以及 CFPB 投诉数据集中 100%
              的及时回复记录。这些点重要，因为它们说明公司并不是完全在黑箱里运营。但它们没有回答投资最关键的问题。公开证据仍未清楚显示 Debt Negotiator
              具备债务调整或债务和解牌照；公司也没有按方案披露流失或退款率，更没有给出租金报送、债务谈判或保证金信用卡的产品层面损失或费用实现视图。因此，正确的尽调立场是有条件的：Kikoff
              并非明显破裂，但如果投诉强度持续偏高、征信局覆盖收窄、定价沟通漂移，或债务减免合规无法用当前文件和产品经济性清楚证明，投资论证就应快速失败。
