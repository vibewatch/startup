  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 经常性订阅模型与公开定价
        blocks:
          - type: paragraph
            body: >-
              围绕 Kikoff 的最强财务证据，不是已披露收入数字，而是清楚分层的经常性订阅模型。Kikoff 2026 年 3 月支持材料称，公司会开设一个小额信用建设信贷账户记录，收取月度订阅费，把该费用用于未来 12
              个月的信贷账户记录付款，并向征信机构上报付款活动。同一批支持材料显示 $5 Basic、$20 Premium 和 $35 Ultimate
              三个档位，更高档位打包账单上报、账单协商、担保卡入口和身份保护功能。这一点有意义，因为它显示 Kikoff 试图变现的不只是单一 $5 入门产品，而是一组提升 ARPU
              的附加服务阶梯。同时，公开标价并不完全干净。2026 年 NerdWallet 评测仍把 Premium 档列为 $25，而不是
              $20，因此即便是简单计划定价，也会在公开界面之间漂移。正确读法是：经常性订阅收入已有证据，官方当前定价看起来从 $5 / 月开始，ARPU
              扩张是模型的真实组成部分；但实际价格、计划组合、折扣和订阅者数量仍未披露。
