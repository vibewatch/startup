        - 官方支持文档和 NerdWallet 均显示顶层套餐月费。
        - 这是可见最高标价，但附加服务使用量未知。
        - 需要订阅用户数、升级率和取消率。
      - - 担保信用卡押金
        - NerdWallet 称最低需 $50 保证金
        - 押金要求出现在独立评测报道中，并未出现在本文审阅的支持文章里。
        - 押金担保可能限制风险，但收入和交换费不可见。
