      - number: '2.2'
        title: 受证据约束的规模测算与需求信号
        blocks:
          - type: paragraph
            body: >
              Kikoff 所在品类的公开市场规模，最好从多重需求视角切入，而不是套一个打磨过的 TAM 数字。CFPB 的基准征信不可见研究仍是最清楚的结构性需求数据点：26 million 名美国成年人征信不可见，另有约
              19 million 人无法评分，意味着信用档案有限的人群约 45 million 名成年人。该数据集有历史性，CFPB 后来也提示过方法更新，但它仍比分析师融资路演稿里的 TAM 更能锚定市场的基线普惠问题。


              更近期的可服务性和需求视角指向同一方向。FDIC 报告称 2023 年有 19.0 million 户低银行服务家庭，意味着它们已在把银行账户与非银服务结合起来满足交易或信贷需求。Federal Reserve
              随后显示，2024 年 34% 成年人申请过信贷，其中三分之一申请者被拒或获批额度低于所需。New York Fed 的 2026 年一季度家庭信贷报告又加上一层压力：余额维持在 $18.8
              trillion，4.8% 未偿债务逾期。合起来看，这些来源支撑了一个大需求池、一个规模可观且数字化可触达的可服务池，以及每年正在遭遇审批摩擦的活跃队列。
