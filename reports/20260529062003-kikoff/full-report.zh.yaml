      - number: '2.3'
        title: 买方细分、付费方与征信机构机制
        blocks:
          - type: paragraph
            body: >
              这个品类里，买方、用户和付费方差异很大。多数信用建设产品中，消费者既是买方也是用户。但在房租上报里，付费方可能转向物业经理或房东；在担保卡里，发卡机构可以用低费或零持续费用补贴入门。这些付费方差异会塑造获客策略：面向消费者的直销订阅经济性，要和雇主或住房分发模型竞争，后者会让产品感觉像嵌入式服务，而不是可有可无的支出。


              产品机制也把市场切碎。信用建设贷款和担保卡靠反复按时付款与信贷账户记录沉淀来建立档案。房租上报产品把本来就必须支付的住房款转成征信数据。Experian Boost 这类单征信机构产品可以改善消费者基于
              Experian 的评分路径，但不能消除贷款人和消费者仍在管理不同征信档案的事实。FICO
              自身的资格规则意味着，一个产品必须沉淀数月后才可能产生分数，因此闭环或看似合成的体验可以营销即时动能，但贷款人拉取结果仍会不一致。
