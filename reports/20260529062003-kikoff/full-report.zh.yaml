  - id: FM001
    title: 市场规模视角
    type: pyramid
    layout: standard
    summary: Kikoff 类别的受证据约束的市场层级，按结构性需求到相邻债务处理池排序，而不是强行编造收入 TAM 数学。
    data:
      items:
        - label: 结构性需求池
          value: ~45M
          detail: CFPB 对信用不可见和无法评分成年人的综合基准；是需求池下限，而非当前年度客户数。
        - label: 可服务的银行连接人群
          value: 19.0M
          detail: 已经使用银行和非银行服务的银行服务不足家庭，使数字化开户比完全没有银行账户的消费者更可行。
        - label: 当前年度摩擦池
          value: 34% apply / one-third denied or partial
          detail: Federal Reserve 针对 2024 年遇到审批摩擦的成年人的年度信贷流量视角。
        - label: 相邻债务处理池
          value: ~1 in 13
          detail: 2007-2019 年有信用记录且接触过债务清算或信用咨询的消费者，凸显相邻修复需求。
    approximationNotes: 各层使用不同但有来源支持的单位，因此应被理解为嵌套需求视角，而不是可相加的 TAM/SAM/SOM 切片。这是有意为之，因为公开市场数据并未隔离出数字信用建设的单一可比收入池。
