  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 收入假设
      - 倍数逻辑
      - 指示性价值区间
      - 概率信号
      - 主要下行 / 上行触发因素
    rows:
      - - 悲观
        - $60M-$100M 年收入
        - 2.5x-4.0x 收入倍数，将 Kikoff 视为一家受限的信用建设工具，存在客服摩擦且高级层持久性有限
        - $150M-$400M
        - ~30%：与真实产品相符，但变现基数远小于独角兽估值所暗示的水平
        - 弱分层转化、投诉拖累留存，或尽调显示利润率薄弱
      - - 基准
        - $130M-$170M 年收入
        - 5.0x-6.2x 收入倍数，更接近一个有一定交叉销售但披露不完善的稳健消费金融平台
        - $650M-$1.05B
        - ~45%：产品广度与当前证据缺口之间最合理的桥接
        - 需要证明健康的留存、付费用户规模和贡献利润率
      - - 乐观
        - $180M-$240M 年收入
        - 6.0x-7.5x 收入倍数，假设新产品实现变现且战略可选性扩大
        - $1.1B-$1.8B
        - ~25%：只有当公司经济规模已经远大于公开证据所示时才可实现
        - 交叉销售、投诉控制和更干净的轮次条款会让价格从偏高转向可辩护
    notes: 区间是有意设定的判断带，因为公开记录仍缺少更紧密模型所需的收入和利润率分母。
    claimRefs:
