  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 整体风险姿态：下行来自信任与合规压缩，不只是金融科技执行噪音
        blocks:
          - type: paragraph
            body: >-
              Kikoff 的风险栈异常集中在一个单一循环里：低客单价订阅买来被上报的信贷账户记录，而订阅的感知价值取决于征信机构、应用商店信任、干净服务和准确上报同时保持完好。该产品不是通用信用卡或无担保贷款；Kikoff
              自有材料和第三方评测显示，核心信用账户只限于 Kikoff 购买，连应用商店披露也把信贷账户记录描述为为 Kikoff
              产品和服务融资。这使公司对上报准确性、定价沟通和客户支持的敏感度，远高于信用额度可广泛消费的贷款人。投诉记录显示，这些风险并非假设：CFPB
              数据已经大到值得重视，公开投诉网站也反复出现收费、退款和服务访问相关指控。承销含义是总体风险中高；如果征信机构处理、投诉耐久性或定价可信度同时转弱，下行会明显不对称。
