  - id: TV005
    title: 投资逻辑破裂与终止触发表
    columns:
      - 触发因素
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 收入缺口
        - 当前 ARR 或实现收入明显低于约 $100M
        - 即使按中个位数金融科技倍数，独角兽估值也会显得偏贵
        - 除非结构或入场价格大幅变化，否则视该价格为失效
      - - 订阅者质量缺口
        - Basic 到 Premium/Ultimate 的付费计划转化低或流失高
        - 由增购驱动的变现会弱于产品阶梯所暗示的水平
        - 下调战略上行假设并压缩情景区间
      - - 利润率 / 损失缺口
        - 毛利率或信用损失行为显示在服务和争议处理后经济性薄弱
        - 订阅收入无法转化为持久企业价值
        - 将可比框架转向较低端贷款或导流倍数
      - - 条款缺口
        - 2025 年 1 月轮次包含沉重清算优先权或其他下行不对称
        - 名义估值会高估普通股经济性
        - 要求低得多的有效入场价格，或放弃
      - - 投诉正常化失败
        - CFPB 和客户服务问题仍然高企且没有明确解决指标
        - 留存、监管和品牌信任成为估值折扣
        - 在给予任何战略溢价前要求运营整改
    notes: 这些触发因素旨在迅速终止基于价格的投资逻辑，而不是让模糊的乐观叙事在尽调缺失时继续存在。
    claimRefs:
      - CV021
      - CV026
      - CV027
      - CV047
      - CV048
      - CV049
      - CV050
      - CV054
  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 当前收入和 ARR
        - 最新月度经常性收入、实现年收入以及按产品划分的毛利率
        - 这是判断 $1B 是合理还是偏高所需的分母
        - 管理层数据室；CFO 或财务负责人
      - - 活跃付费用户和计划组合
        - 当前活跃订阅者、Basic/Premium/Ultimate 组合、升级路径和按队列划分的流失
        - 用户数和累计用户如果没有付费质量，无法直接转化为企业价值
        - 管理层指标包；增长和留存仪表盘
      - - 2025 年 1 月轮次条款
        - 融资金额、证券、投资者组合、清算优先权和任何结构性保护
        - 当下行保护较重时，名义估值可能高估普通股价值
        - 董事会材料、股票购买协议、股权结构表法律顾问审阅
      - - 单位经济性和投诉正常化
        - 服务成本、争议成本、损失率、投诉量趋势和解决时效服务级别协议（SLA）
        - 客户摩擦信号可能压缩留存并降低战略价值
        - 运营、风险和客户支持工作流
      - - 产品贡献
        - 来自债务谈判、市场和其他非核心产品的收入及利润率贡献
        - 战略上行主张取决于交叉销售变现，而不是功能数量
        - 按业务线进行产品财务审查
      - - 退出准备度
        - 经审计财务报表、治理成熟度和经常性披露节奏
        - 今天的公开证据更符合战略出售或财务赞助方路径，而不是 IPO 路径
        - 财务、法律和董事会尽调包
    notes: 尽调清单有意以分母优先：在这些文件存在之前，估值争论基本上是叙事。
    claimRefs:
      - CV026
      - CV027
      - CV040
      - CV047
      - CV049
      - CV054
