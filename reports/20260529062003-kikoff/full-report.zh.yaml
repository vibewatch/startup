      - number: '4.3'
        title: 资本历史、后续市场信号与估值缺口
        blocks:
          - type: paragraph
            body: >-
              Kikoff 的资本历史比运营披露清楚得多。SEC 申报把 KikOff Inc. 标识为 2020 年 8 月和 2021 年 6 月 Form D 申报背后的发行人。这些申报直接显示，2020 年售出约
              $12.5 million，2021 年售出约 $30.0 million，合计证明新股资本约 $42.5 million。多篇 2021
              年上线和融资文章也与这组数学一致。更难的问题是后续发生了什么。PitchBook 公开预览页称 Kikoff 累计融资 $42.5 million，列出 170
              名员工，并显示最新交易类型为私人老股交易、最新交易金额为 $10 million。同一预览页时间线显示 2025 年 2 月和 2026 年 3 月发生老股交易。另有 SciEuro 2025 年 1
              月独角兽汇总引用 PitchBook，称 Kikoff 在一轮未披露融资后达到 $1 billion
              估值。这个组合制造了本章最大的财务张力：报道中的估值标记很高，但没有公开收入、ARR、现金、烧钱速度或债务披露，让外部投资人无法检验这个标记究竟由基本面表现支撑，还是来自二级市场稀缺性或战略可选性。
