            - label: 弱
              tone: negative
              detail: 核心额度只能在 Kikoff 商店内使用
            - label: 很强
              tone: positive
              detail: 租金、账单、担保信用卡、协商、监测、身份工具
            - label: 弱
              tone: negative
              detail: 容易添加，也容易离开
        - label: Self
          values:
            - label: 中等
              tone: warning
              detail: 无需硬查询，但月度承诺高于 Kikoff
            - label: 强
              tone: positive
              detail: 信用建设贷款和担保卡都披露向三大征信机构报送
            - label: 中等
              tone: warning
              detail: 卡片消费是真实的，但核心建设器仍是分期流程
            - label: 强
              tone: positive
              detail: 储蓄返还、担保卡、租金 / 账单、现金预支
            - label: 强
              tone: positive
              detail: 24 个月贷款结构带来更强持续性
        - label: CreditStrong
          values:
            - label: 中等
              tone: warning
              detail: 无需硬查询，但价格和套餐更复杂
            - label: 很强
              tone: positive
              detail: 留存产品页面均披露向三大征信机构报送
            - label: 弱
              tone: negative
              detail: 产品更像信贷记录工具，不是日常消费工具
            - label: 中等
              tone: warning
              detail: FICO、监测和多种信贷记录形态有用，但覆盖面窄于 Kikoff 的组合包
            - label: 中等
              tone: warning
              detail: 优化型用户可以留下，但产品仍可叠加使用
        - label: Grow Credit
          values:
            - label: 很强
              tone: positive
              detail: 免费层和小额押金选项降低摩擦
            - label: 强
              tone: positive
              detail: 应用商店列表称所有层级都向三大征信机构报送
            - label: 弱
              tone: negative
              detail: 只有订阅和少数账单类别符合其消费模型
            - label: 中等
              tone: warning
              detail: FICO 和套餐阶梯有用，但广度不如 Kikoff
            - label: 很弱
              tone: negative
              detail: 很容易和另一款信用建设工具并用
        - label: Chime Credit Builder
          values:
            - label: 中等
              tone: warning
              detail: 支票账户和工资直存关系才是真正入口
            - label: unknown
