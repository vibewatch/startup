        - 价格页和产品页清楚映射 Basic → Premium → Ultimate 阶梯
        - 扩展路径可在无需新增获客事件的情况下提高单客收入
        - 高阶用户没有公开附加率或留存披露
      - - 联盟 / 社群受众获客
        - 买方=联盟伙伴；用户=终端消费者；付款方=终端消费者
        - 通过效果营销或创作者导流进入 Kikoff 注册
