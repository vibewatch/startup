  - id: TI001
    title: 收入来源表
    columns:
      - 收入来源
      - 机制
      - 当前公开状态
      - 毛利率影响
      - 尽调事项
    rows:
      - - Credit Account 订阅
        - 月度套餐费计入一笔小额信用记录账户，并在 12 个月内上报给信用局。
        - 显然仍在运营，也是产品核心。
        - 毛利率可能高于开放式信贷，因为该信用记录账户不是通用信贷，但服务和上报仍会产生成本。
        - 需要付费订阅用户数、套餐结构、流失、退款，以及各层级月收入。
      - - 租金上报
        - 按时支付的租金会作为额外信用记录账户上报，并打包进当前套餐。
        - 作为附加功能显然仍在运营。
        - 如果信用局和数据连接成本可控，作为数字附加项可能很有吸引力。
        - 需要附加率、单位供应商成本，以及相对非使用者的增量留存提升。
      - - 账单上报
        - Premium 和 Ultimate 套餐可将公用事业和电信账单上报至 TransUnion。
        - 在高层级套餐中显然仍在运营。
        - 毛利率可能低于简单租金上报，因为银行连接和账单识别会增加服务复杂度。
        - 需要附加率、覆盖范围限制、单用户数据成本和争议率。
      - - 账单议价
        - Ultimate 套餐包含一个议价团队，代表用户联系服务商争取折扣。
        - 该功能明确提供，但未披露单独收费。
        - 这可能是整个组合里最吃人力、合规负担最重的变现面。
        - 需要案件量、人员成本、成功率、服务商组合，以及任何节省分成或转介经济性。
      - - 信用建设贷款
        - 公开支持文档显示，最终付款结清后可发起提款流程，证明产品存在，但不能证明经济性。
        - 产品存在；定价经济性仍不透明。
        - 相比纯信用记录订阅，它增加了现金时点和服务复杂度。
        - 需要 APR、费率表、资产负债表处理、损失历史和发放量。
      - - 担保信用卡准入
        - 高层级套餐宣传可使用 Kikoff 担保信用卡，NerdWallet 称需缴纳 $50 押金。
        - 产品准入可见，但公开变现方式不可见。
        - 押金担保可能降低信用风险，但交换费、服务和合作伙伴经济性均未披露。
        - 需要持卡人数、押金余额、消费额、交换费分成和欺诈损失。
    notes: 这是对截至 2026-05-29 Kikoff 公开可见变现面的部分列举。公开证据支持经常性订阅和多个附加服务的存在， 但不支持完整、经审计的收入结构或实际 ARPU 桥。
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the monetization surfaces explicitly described in current support materials, review coverage, and app
        listings reviewed for the 2026-05-29 run; realized pricing and revenue contribution by feature remain private.
