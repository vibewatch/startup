  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 在选定上市可比公司的销售倍数下，Kikoff 要支撑 $1B 估值所需的年收入。
    data:
      items:
        - label: 类 FICO 13.4x
          value: 74.6
          note: $1B 价值只需要约 $75M 收入，但 FICO 的经济性强得多
        - label: 类 SoFi 5.5x
          value: 181.8
          note: $1B 价值需要约 $182M 收入
        - label: 类 TransUnion 2.9x
          value: 344.8
          note: $1B 价值需要约 $345M 收入
        - label: 类 Upstart 2.8x
          value: 357.1
          note: $1B 价值需要约 $357M 收入
        - label: 类 NerdWallet 0.7x
          value: 1428.6
          note: $1B 价值意味着对收入的要求不现实，这个可比公司的质量较低
    approximationNotes: 数值根据 2026 年 5 月观察到的市值和收入页面机械推导，用于框定分母敏感性，而不是主张某个单一正确倍数。
    claimRefs:
      - CV029
      - CV030
      - CV031
      - CV032
      - CV033
      - CV035
      - CV036
      - CV037
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 基于明确收入和倍数假设构建的悲观、基准、乐观指示性估值区间。
    data:
      items:
        - label: 悲观情景
          low: 150
          mid: 250
          high: 400
          note: 收入低于 $100M，销售倍数低于 5x
        - label: 基准情景
          low: 650
          mid: 850
          high: 1050
          note: 收入约 $130M-$170M，销售倍数 5.0x-6.2x
        - label: 乐观情景
          low: 1100
          mid: 1450
          high: 1800
          note: 收入约 $180M-$240M，且战略选择权更广
    approximationNotes: 区间有意设得较宽，因为公开证据仍缺少当前收入分母和融资条款，无法把模型收得更紧。
    claimRefs:
      - CV050
      - CV051
      - CV052
      - CV053
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: IC 风格打分，从可及性、产品宽度、证据质量、估值支撑、战略选择权和运营风险衡量 Kikoff。
    data:
      items:
        - label: 市场需求
          value: 4
          note: 信用可及性痛点真实存在，入门产品价格可负担
        - label: 产品可及性
          value: 4
          note: 无硬查询和低入门价降低了采用摩擦
        - label: 用户 / 结果证据
          value: 3.5
          note: 公司口径有意义，但仍主要来自公司自报
        - label: 变现可见度
          value: 1.5
          note: ARR、付费用户数、流失率和利润率均未公开
        - label: 可比公司支撑
          value: 2.5
          note: 这个估值可以成立，但收入基数需要大于公开证据能证明的水平
        - label: 战略选择权
          value: 3.5
          note: 更宽的产品套件创造了真实但尚未量化的上行空间
        - label: 运营 / 监管信心
          value: 2
          note: 投诉和披露信号让风险评级维持在高位
    approximationNotes: 分数是方向性判断辅助，不是机械模型；最低分反映证据缺口和投诉风险，并非否认真实用户牵引。
    claimRefs:
      - CV005
      - CV015
      - CV028
      - CV045
      - CV047
      - CV049
      - CV050
