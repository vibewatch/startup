              detail: 留存公开证据未能清楚解决征信机构表述
            - label: 很强
              tone: positive
              detail: 担保卡、ATM 访问、存款、提前发薪和透支工具
            - label: 强
              tone: positive
              detail: 信用卡之外还有完整银行服务包
            - label: 强
              tone: positive
              detail: 主账户行为和工资直存具有粘性
        - label: Experian Boost
          values:
            - label: 很强
              tone: positive
              detail: 免费且激活快
            - label: 弱
              tone: negative
              detail: 不新增信贷记录；使用 Experian 档案中的账单数据
            - label: 弱
