      - number: '3.4'
        title: 护城河耐久性、切换成本，以及 Kikoff 赢在哪里、落在哪里
        blocks:
          - type: paragraph
            body: >-
              因此，Kikoff 的护城河不是排他性，而是打包。公司把便宜的第一条信贷账户记录、无硬查询入门、借记卡式担保卡、房租上报、账单上报和债务协商放进一个订阅里。这是真实的 UX
              优势。但它不是硬护城河，因为几个竞争对手可以和它叠加使用：Grow 可以承接订阅账单，Experian Boost 可以叠到账单之上，用户也仍可持有 Chime
              或担保卡作为主要消费工具。最大的具体弱点不是价格；Kikoff 在价格上强。弱点是产品清晰度和日常用途。核心 Credit Account 仍局限于商店，公开 Kikoff
              界面也没有完全统一：核心产品本身究竟上报两个还是三个征信机构，表述不一致。这不会抹掉 Kikoff 的价值主张，但会在买方比较征信覆盖和可携带性的关键时刻削弱信任。净看：Kikoff
              赢在最低入门成本和打包宽度；落后在消费用途、储蓄返还结构和主账户深度。
