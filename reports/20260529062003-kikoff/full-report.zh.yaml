  - id: TV004
    title: 可比估值表
    enumerationScope:
      coverage: partial
      basis: >-
        Covers public consumer-finance platforms and one strategic M&A precedent because direct public credit-builder
        comps and disclosed private-round denominators are sparse.
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 相关性
      - 局限性
    rows:
      - - FICO
        - 2026 年 5 月市值 / TTM 收入
        - ~13.4x 收入
        - 数据丰富、高质量经常性信贷特许经营权的上限倍数
        - FICO 的披露经济性和市场力量远强于 Kikoff
      - - TransUnion
        - 2026 年 5 月市值 / TTM 收入
        - ~2.9x 收入
        - 拥有大量消费金融敞口的公共信用信息平台
        - 比 Kikoff 大得多且成熟得多；增长画像较慢
      - - NerdWallet
        - 2026 年 5 月市值 / TTM 收入
        - ~0.7x 收入
        - 消费金融获客和导流平台
        - 模式不同，变现质量低于真正的信用平台
      - - SoFi
        - 2026 年 5 月市值 / TTM 收入
        - ~5.5x 收入
        - 拥有多款产品的更广泛消费金融平台，是最佳公开参照
        - 银行业资产负债表和贷款组合使其只能方向性可比
      - - Upstart
        - 2026 年 5 月市值 / TTM 收入
        - ~2.8x 收入
        - 具有信用风险和消费贷款敞口的金融科技公司
        - 周期性和贷方伙伴依赖不同于订阅式信用建设模式
      - - Credit Karma / Intuit
        - 已完成 M&A 先例
        - 交割时对价约 $8.1B；110M+ 会员
        - 展示了规模化消费信贷分发的战略价值
        - 相比今天的 Kikoff，规模远大、业务更广且成熟度更高
    notes: 可比集合有意混合公共消费金融平台和一个战略 M&A 先例，因为直接上市信用建设可比公司和披露私募轮分母稀缺。
