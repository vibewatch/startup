  - id: TP002
    title: 功能 / 能力矩阵
    columns:
      - 选项
      - 消费对象 / 工作流
      - 信用机制
      - 留存来源中的信用局覆盖
      - 现金预付或承诺
      - 买方结论
    rows:
      - - Kikoff
        - 从 Kikoff 商店购买；可选加担保卡、租金或账单
        - 循环额度，加可选担保卡和报送附加项
        - 计划层面覆盖三大信用局，但 Kikoff 某页面把核心 Credit Account 单列为 Equifax/Experian
        - $5 月度订阅；核心产品无需保证金；可选担保卡最低 $50
        - 作为低摩擦第一条信用账户最强，作为日常消费产品较弱
      - - Self
        - 支付分期款，可选使用担保 Visa 卡
        - CD 支撑的分期贷款，加担保卡和租金 / 账单报送
        - 建立产品和卡均覆盖三大信用局；租金三大信用局；水电 / 手机 TransUnion
        - 起步计划 $25/mo；24 个月期限；卡保证金 $100
        - 储蓄返还和分期叙事强于 Kikoff
      - - CreditStrong
        - 选择循环、分期或信用组合导向账户
        - 针对使用率、付款历史和信用组合的专门信用账户
        - 留存产品页面均显示三大信用局
        - 视产品每月 $15 至 $28；允许取消
        - 最适合有优化意识的信用重建者，不适合追求极简的用户
      - - Grow Credit
        - 将订阅和部分账单记入 Grow Mastercard
        - 绑定经常性订阅的小额循环额度
        - 应用商店页面称覆盖三大信用局
        - 免费层或低月费；可选 $17 担保保证金
        - 容易叠加的建立工具，但额度低使场景偏窄
      - - Chime Credit Builder
        - 在银行关系内通过担保 Chime 卡消费
        - 担保卡，加支票账户、提前发薪、透支和储蓄闭环
        - 留存来源没有明确解决公开信用局覆盖措辞
        - 未披露月费，但支票账户和直接存款决定完整价值
        - 日常效用高，形成主账户关系的潜力更强
      - - Experian Boost
        - 连接账户并添加符合条件的账单历史
        - 在 Experian 档案上叠加分数，而非新建信用账户
        - Experian 信用档案和基于 Experian 的提分
        - 免费；随时可移除
        - 叠加最快，但护城河和可迁移性最弱
      - - Discover 担保信用卡
        - 在所有接受 Discover 的地方使用标准卡
        - 按月出账的传统担保信用卡
        - 报送三大信用局
        - 至少 $200 可退还保证金和常规发卡审核
        - 日常效用最强，入门现金摩擦最高
      - - 债务和解 / DMP
        - 谈判或重组现有债务义务
        - 减轻付款压力，不创建信用账户
        - 留存来源中不是信用局建设型主张
        - 可能有费用、贷款方谈判和较高流程负担
        - 只有债务压力高于建档需求时才相关
    notes: 各行混合使用官方产品页、应用商店披露和留存评测来源，因为没有单一发布方能干净覆盖每个选项的信用局行为和工作流。本表只陈述事实；评分视角另见 FP002。
