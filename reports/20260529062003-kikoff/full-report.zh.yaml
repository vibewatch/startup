  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户细分与买方地图
        blocks:
          - type: paragraph
            body: >-
              Kikoff 最清楚的客户细分，是没有信用档案、档案很薄，或信用分低于 600、想要低摩擦起点的消费者。产品界面对此说得很明确：定价从 $5 /
              月开始，审批被营销为即时且无硬信用检查，公司自有博客和使命文案也反复谈到征信不可见消费者和被信用体系排除的人群。围绕移民、学生和年轻成年人，也有较弱但仍相关的人群信号：创始人用移民可及性的视角讲述公司，Kikoff
              自有教育指南也专门点名大学生和国际学生。在自助服务动作中，买方、用户和付费方通常是同一个人；但 Kikoff
              也通过联盟营销和企业合作伙伴拥有第二层买方。在这些渠道情形里，合作伙伴是分发买方，终端用户是合作伙伴的受众或客户，经济付费方看起来仍是注册 Kikoff 订阅的终端消费者。
