      - number: '8.3'
        title: 情景区间、战略上行与下行
        blocks:
          - type: paragraph
            body: >-
              因此，情景工作必须从明确假设出发，不能假装精确。熊市情景里，Kikoff 是有用但受限的信用建设工具，实际收入基数仍低于 $100M，客户摩擦、投诉负担或高级档转化把市场定价压在 5x
              销售收入以下；这会得出远低于独角兽标题的价值。基准情景里，Kikoff 已经搭出真实的订阅和交叉销售引擎，更接近主流消费者金融平台，约 $130M 到 $170M
              的收入可以支撑接近当前标记的估值。牛市情景里，公司战略价值更有意思，因为 2025 年产品组合从信用建设扩展到债务谈判、市场平台和其他消费者金融相邻领域。Credit Karma
              的先例说明了为什么这重要：有规模的消费者信用分发可以具备战略价值。但这个先例救不了今天的 Kikoff。Credit Karma 的会员规模和变现宽度都大得多。Kikoff
              自身的下行信号——评测者怀疑、反复投诉，以及查询到的 API 响应中庞大的 CFPB 投诉足迹——意味着战略上行必须和真实的执行与披露风险一起权衡。
