        - 消费者
        - 任一经过成熟期后能生成评分的信用账户记录
        - 结构性需求最尖锐，但最难快速变现
      - - 薄档案 / 重建信用借款人
        - 档案陈旧或不足的消费者
        - 重新申请主流信用前希望提高评分
        - 消费者
        - 持续准时还款历史加档案年龄
        - 低客单价订阅、担保卡或分期产品的自然目标客群
      - - 银行服务不足家庭
        - 已有银行账户但仍使用非银行信贷服务的消费者
        - 需要更安全、成本更低的选择，替代摩擦大的信贷产品
