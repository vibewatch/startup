  - id: TI003
    title: 单位经济性表
    columns:
      - 指标或代理指标
      - 公开数值或状态
      - 置信度
      - 重要性
      - 尽调事项
    rows:
      - - CAC 或付费营销效率
        - 未公开披露
        - 中
