  - id: TM004
    title: 增长驱动因素与约束表
    columns:
      - 驱动因素 / 约束
      - 方向
      - 时点
      - 对 Kikoff 市场的含义
      - 证据
    rows:
      - - 庞大的信用档案不足人群
        - 驱动
        - 结构性、多年期
        - 创造了跨越单一宏观周期的持久普惠需求
        - CFPB 约 4,500 万名信用隐形或无法评分成年人的基准
      - - 银行服务不足家庭已混用银行与非银行服务
        - 驱动
        - 当前
        - 支撑数字渠道可触达的 SAM，因为支付轨道和需求已经并存
        - FDIC 2023 年调查
      - - 每年信贷拒批和部分批准
        - 驱动
        - 当前、周期性
        - 每年都会让消费者在重新申请前急着寻找信用建立工具
        - Federal Reserve 银行与信贷章节
      - - 租金报送和低费担保卡的报送渠道扩展
        - 驱动
        - 当前
        - 让分发不只依赖纯 DTC 订阅经济
        - CFPB 租金指引；Chime、Discover 和 Esusu 产品页
      - - 单一信用局与三大信用局报送碎片化
        - 约束
        - 当前
        - 不同贷款方和拉分场景下，产品效果会不一致
        - AnnualCreditReport、Experian Boost、Chime、Self 与 Esusu
      - - 评分模型养成窗口
        - 约束
        - 当前
        - 拉长见效时间，也提高不耐心用户的流失风险
        - myFICO 评分要求和评分因素文档
      - - 债务压力会把用户导向债务处置产品
        - 约束
        - 当前
        - 部分消费者要先减轻债务，才撑得起新的信用建立付款流
        - New York Fed 2026 年 Q1；CFPB 信用建立贷款评估；CFPB 债务和解趋势
      - - 准确性、争议处理和营销监管
        - 约束
        - 当前且持续
        - 推高合规成本，也限制激进的债务修复话术
        - CFPB 租赁信息公告；FTC TSR；CFPB 消费者指南
    notes: 放大需求的同一批市场力量也抬高执行风险。尤其是，当服务商从记录付款行为走向承诺债务修复或近乎即时的提分结果时，监管压力最大。
