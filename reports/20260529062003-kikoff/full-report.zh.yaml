  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与模块地图
        blocks:
          - type: paragraph
            body: >-
              Kikoff 更适合理解为信用档案管理订阅，而不是传统贷款人或发卡机构。核心产品是闭环 Kikoff Credit Account，为 Kikoff 购买提供融资、上报经常性付款，并被包装进
              Basic、Premium 和 Ultimate 计划，随档位提高而提供更大的上报信贷账户记录和更多附加服务。在这个核心周围，Kikoff
              现在叠加房租上报、水电等账单上报、邀请制担保卡、债务协商、身份盗用和隐私服务、分数跟踪以及免费异议处理。这个宽度重要，因为公司卖的不只是一次性信贷账户记录；它想成为消费者的操作系统，帮助他们低成本、低摩擦地制造正向征信档案事件。取舍在于，多个模块仍是专用而非通用。信用账户仍是闭环，房租和账单上报似乎并不以同样方式命中每家征信机构，担保卡也受更高档位和邀请机制限制。
