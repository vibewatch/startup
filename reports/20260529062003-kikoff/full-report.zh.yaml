      - number: '7.2'
        title: 监管、法律与隐私暴露的上升速度，快于 Kikoff 公开披露补齐的速度
        blocks:
          - type: paragraph
            body: >-
              最尖锐的风险在于，Kikoff 已经从一条简单的信用建设账户记录，扩成了多触点的消费者金融组合，但合规图景并没有同步变简单。公司现在把债务谈判放进付费方案里营销，而 FTC
              指引明确写明，通过电话营销的债务谈判、债务和解和债务管理服务受 Telemarketing Sales Rule 约束；该规则禁止预收费，并要求注册前给出特定披露。Kikoff
              的公开牌照页面确实显示出真实的州级放贷足迹，但抓取到的公开页面没有出现债务调整或债务和解标签，因此 Debt Negotiator 的公开证据仍然不完整，不能得出结论性安心。同时，Kikoff
              的条款和卡协议依赖约束性仲裁与集体诉讼豁免，更新后的 2026
              年隐私政策也比「信用建设」叙事通常需要的范围宽得多：它预设了定向广告数据共享、数据经纪商输入和第三方跟踪。这些点本身都不能证明不当行为，但合在一起，Kikoff 的合规暴露面明显重于 $5 入门价所暗示的程度。
