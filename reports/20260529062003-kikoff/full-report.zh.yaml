  - id: FR001
    title: 风险热力图——按发生可能性和影响衡量 Kikoff 最重要的风险
    type: matrix
    layout: wide
    summary: 风险最高的单元格集中在上报准确性投诉、债务谈判合规，以及依赖征信机构的价值感知。价格漂移和隐私反弹也有意义，但相较这些关乎投资假设的风险，仍属次要。
