  topStrengths:
    - $5/月且不做硬查询，入口摩擦很低；上报范围和相邻产品也把变现空间从单一信用账户拉宽。
    - 面向消费者的公开触达看起来已有规模：自有页面提到 1M+ 客户，应用商店安装量和评分足迹也很大。
    - 投资人支持和产品扩张说明 Kikoff 不只是单功能信用建设工具，可能有实质性交叉销售空间。
  topRisks:
    - 报道中的 $1B 估值缺少已披露 ARR、毛利率、流失率或融资条款支撑，分母风险异常高。
    - CFPB 投诉量、负面评价模式，以及反复出现的取消和账单投诉，都引发信任与服务能力担忧。
    - 如果分数提升不能转化为更广泛的信贷可得性，核心闭环信用账户和较新的债务谈判流程会放大监管、结果质量和声誉风险。
  unresolvedGaps:
    - 按套餐层级拆分的当前 ARR、付费订阅用户数、留存、流失率和队列经济性。
    - 核心订阅业务与债务谈判相邻业务各自的毛利率、服务成本、CAC、LTV 和现金跑道。
    - 2025 年 1 月估值背后的具体条款，包括工具类型、投资人保护，以及该标记来自新股融资还是老股交易。
    - 债务谈判、信用上报准确性和订阅计费的投诉解决率、退款结果，以及面向监管机构的控制措施。
