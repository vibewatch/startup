    {
      "id": "substitutes-and-primary-relationship-rivals",
      "title": "Substitutes: banking bundles, score overlays, and secured cards",
      "body": "Substitutes matter because many users do not want a dedicated credit-builder at all. Chime competes by making credit building one feature inside a broader banking loop: checking, early pay, overdraft tools, deposits, ATM access, and a secured card. That creates far more day-to-day utility and, once direct deposit is in place, more behavioral lock-in than Kikoff. Generic secured cards such as Discover go further on merchant acceptance and mainstream card behavior, but they also require materially more prefunding and often a harder underwriting step. Experian Boost sits at the opposite extreme: it is free, fast, and removable, but it is an Experian-file overlay rather than a broadly portable new tradeline. Debt settlement and debt management are not true builders, yet they are relevant adjacencies because a stressed consumer may choose payment relief before choosing score optimization. The credit implication is reversed: CFPB warns debt settlement can worsen scores, while NFCC frames nonprofit debt management as a lower-risk workout path rather than a credit-building product.",
