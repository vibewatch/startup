- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Revenue assumption
  - Multiple logic
  - Indicative value range
  - Probability signal
  - Main downside / upside trigger
  rows:
  - - Bear
    - $60M-$100M annual revenue
    - 2.5x-4.0x sales, treating Kikoff as a constrained credit-builder with support friction and limited premium durability
    - $150M-$400M
    - '~30%: consistent with a real product but a much smaller monetization base than the unicorn mark implies'
    - Weak tier conversion, complaints drag retention, or diligence reveals thin margins
  - - Base
    - $130M-$170M annual revenue
    - 5.0x-6.2x sales, closer to a solid consumer-finance platform with some cross-sell but imperfect disclosure
    - $650M-$1.05B
    - '~45%: the most reasonable bridge between product breadth and current evidence gaps'
    - Needs proof of healthy retention, payer scale, and contribution margin
  - - Bull
    - $180M-$240M annual revenue
    - 6.0x-7.5x sales, assuming new products monetize and strategic optionality broadens
    - $1.1B-$1.8B
    - '~25%: achievable only if the company is already much larger economically than public evidence shows'
    - Cross-sell, complaint control, and cleaner round terms shift the price from stretched to defensible
  notes: Ranges are deliberate judgment bands because the public record still omits the revenue and margin denominator that a tighter model would require.
