- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Evidence
  - What would change the view
  rows:
  - - 'THESIS: Kikoff has built a broadly accessible entry point into credit building'
    - Pricing starts at $5 per month, no hard credit check is emphasized, and current plans cover credit reporting, rent reporting, and related tools
    - Would improve if management disclosed payer growth and retention by cohort, not just product availability
  - - 'THESIS: The company appears to be broadening into a wider consumer-finance stack'
    - 2025 company materials describe debt negotiation, marketplace offers, earned wage access, and other services beyond the original credit account
    - Would strengthen if management showed revenue contribution from those adjacencies rather than only feature breadth
  - - 'THESIS: The business may have strategic value beyond a standalone credit-builder niche'
    - Credit Karma shows that consumer-credit distribution can be strategically monetized at large scale
    - Would strengthen if Kikoff proved similar cross-sell economics or partner monetization
  - - 'ANTI-THESIS: The core tradeline remains tightly constrained'
    - Official support pages and independent reviews agree that the line cannot be spent outside Kikoff's own ecosystem
    - Would soften if the company disclosed a materially larger share of value from open-loop card, marketplace, or non-tradeline products
  - - 'ANTI-THESIS: Premium-tier willingness to pay may be fragile'
    - Reviewer sources say useful features require paid membership and that not all products report to all bureaus
    - Would soften if the company shared paid-plan mix, upgrade conversion, and churn by tier
  - - 'ANTI-THESIS: The price is under-documented'
    - January 2025 valuation reporting does not disclose round size, instrument, or preference structure, and public sources still do not disclose ARR or margin
    - Would improve immediately if Kikoff opened a current ARR, gross-margin, and round-terms data room
  notes: 'This table separates company quality from price support: the growth story is plausible, but underwriting proof is still missing.'
