  - - Confidence
    - Medium
    - Funding history, pricing, user claims, and comp data are real, but ARR, margin, payer count, and terms remain private
  - - Risk rating
    - High
    - Disclosure gaps, customer-friction signals, and financing opacity make the downside range wide
  - - Valuation stance
    - Stretched on public evidence
    - The mark only looks comfortable if Kikoff is already above roughly $180M of revenue with strong retention
  - - Decision implication
    - Do not advance without a full economics and round-terms diligence package
    - Current evidence supports monitoring or disciplined negotiation, not unconditional underwriting
  notes: Public facts support a serious company and a real product suite, but not enough monetization evidence to endorse the headline price.
