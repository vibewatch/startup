- id: TV004
  title: Comparable valuation table
  enumerationScope:
    coverage: partial
    basis: Covers public consumer-finance platforms and one strategic M&A precedent because direct public credit-builder comps and disclosed private-round denominators are sparse.
  columns:
  - Comparable
  - Metric
  - Multiple / valuation / status
  - Relevance
  - Limitation
  rows:
  - - FICO
    - May 2026 market cap / TTM revenue
    - ~13.4x sales
    - Upper-bound multiple for a data-rich, high-quality recurring credit franchise
    - FICO has far stronger disclosed economics and market power than Kikoff
  - - TransUnion
    - May 2026 market cap / TTM revenue
    - ~2.9x sales
    - Public credit-information platform with large consumer-finance exposure
    - Much larger and more established than Kikoff; slower-growth profile
  - - NerdWallet
    - May 2026 market cap / TTM revenue
    - ~0.7x sales
    - Consumer-finance acquisition and lead-generation platform
    - Different model and lower monetization quality than a true credit platform
  - - SoFi
    - May 2026 market cap / TTM revenue
    - ~5.5x sales
    - Best public frame for a broader consumer-finance platform with multiple products
    - Banking balance-sheet and lending mix make it only directionally comparable
  - - Upstart
    - May 2026 market cap / TTM revenue
    - ~2.8x sales
    - Fintech with credit-risk and consumer-lending exposure
    - Cyclicality and lender-partner dependence differ from a subscription credit-builder model
  - - Credit Karma / Intuit
    - Closed M&A precedent
    - ~$8.1B consideration at close; 110M+ members
    - Shows strategic value of scaled consumer-credit distribution
    - Far larger, broader, and more mature than Kikoff today
  notes: The comparable set intentionally blends public consumer-finance platforms with one strategic M&A precedent because direct public credit-builder comps and disclosed private-round denominators are sparse.
