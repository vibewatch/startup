  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: economics-opacity
    missingEvidence: Current ARR, realized annual revenue, gross margin, contribution margin, and churn by plan.
    whyItMatters: These are the denominator and quality metrics required to know whether $1 billion is fair or stretched.
    diligencePath: Obtain the latest board pack, finance dashboard, and cohort retention analysis from management.
    relatedQuestionRefs:
    - QV009
    - QV028
    - QV029
  - type: missing-source
    severity: material
    topic: valuation-opacity
    missingEvidence: January 2025 financing amount, investor mix, instrument, valuation method, and liquidation preferences.
    whyItMatters: A headline unicorn mark can materially overstate common-equity value when round terms are structured or heavily preferred.
    diligencePath: Review stock purchase documents, cap-table waterfalls, and board materials for the January 2025 round.
    relatedQuestionRefs:
    - QV003
    - QV027
  - type: enumeration-incomplete
    severity: material
    topic: comparable-valuation-table
    missingEvidence: Direct public or well-disclosed private credit-builder comparables with current valuation and revenue denominators.
    whyItMatters: The current comparable set is useful but imperfect because it blends broader consumer-finance businesses and one strategic M&A precedent.
    diligencePath: Extend the comp set with any private credit-builder rounds or strategic transactions disclosed during diligence.
    relatedQuestionRefs:
    - QV010
    relatedTableRefs:
    - TV004
  - type: missing-source
    severity: material
    topic: regulatory-friction
    missingEvidence: Normalized complaint-volume trend, dispute-resolution times, fraud-loss rates, and customer-service SLAs.
    whyItMatters: Complaint and support signals can become a valuation discount if they reflect structural servicing problems rather than normal scale effects.
    diligencePath: Request monthly complaints dashboards, QA metrics, regulator correspondence, and remediation plans from operations and risk leads.
    relatedQuestionRefs:
    - QV021
    - QV030
  - type: private-evidence-only
    severity: material
    topic: exit-path
    missingEvidence: Audited statements, governance readiness, and a recurring disclosure cadence suitable for a public-company path.
    whyItMatters: Without filing-grade readiness, the valuation should be framed around strategic or sponsor outcomes rather than a near-term IPO case.
    diligencePath: Review audit status, internal controls roadmap, board composition, and finance-team buildout.
    relatedQuestionRefs:
    - QV020
    - QV030
