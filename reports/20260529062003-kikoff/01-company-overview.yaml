callouts:
  - calloutType: strength
    title: Affordability plus distribution is the clearest strength
    body: The strongest public company story is not just low price. Kikoff combines a low-cost entry tier, a long-standing core credit-building product, and evidence of scaled distribution through 1M+ active users or members and a bureau-linked Equifax partnership.
    claimRefs: [CO010, CO020, CO030, CO035]
  - calloutType: risk
    title: Closed-loop utility and thin disclosure are the main caution flags
    body: "The public downside is consistent across retained sources: the flagship Credit Account is engineered for credit reporting, not broad everyday utility, and the company still discloses far less than investors would want on current valuation support, revenue, headcount, and formal governance."
    claimRefs: [CO027, CO038, CO039, CO044, CO045]
