  - id: scale-milestones-and-risk-flags
    title: Scale, milestones, and risk flags
    body: >-
      Scale and momentum claims are abundant, but they need careful parsing. Independent and company sources now converge on at least one million active users or members, while the company separately claimed more than four million lifetime users by the end of 2025. Those are not the same measure, and later chapters should not treat them as interchangeable. Product and partnership milestones nevertheless show real expansion beyond the original closed-loop credit builder. AI Credit Disputes launched in August 2025, Equifax's Optimal Path planner integration followed in November 2025, and Kikoff's year-end release said cumulative outcomes reached 240 million credit points, $21 million in debt savings, and 800,000 unlocked credit products. The main public risk flag is also visible in retained sources rather than buried. CNBC's review and TechCrunch's original 2021 product description both highlight that the core Credit Account only works inside Kikoff's own store, which can reduce everyday utility versus a normal card-based product. Combined with thin public disclosure on audited revenue, current headcount, and full governance, that leaves Kikoff looking operationally real and increasingly broad, but still partially opaque where investors would want the sharpest underwriting evidence.
