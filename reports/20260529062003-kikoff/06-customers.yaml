  evidenceGaps:
    - type: missing-source
      severity: material
      topic: immigrant-student-segment-mix
      missingEvidence: Exact paying-user counts or conversion shares for immigrants, international students, college students, and other newcomer personas.
      whyItMatters: Public messaging implies these cohorts matter, but without segment mix data it is impossible to tell whether they are real revenue drivers or only narrative positioning.
      diligencePath: Request signup-mix, activation, and paid-retention cuts by persona segment and acquisition channel.
      relatedQuestionRefs:
        - QU003
      relatedTableRefs:
        - TU001
    - type: private-evidence-only
      severity: material
      topic: retention-cohorts
      missingEvidence: Paid-plan churn, renewal, NRR, GRR, refund rate, and cancellation behavior by cohort and plan tier.
      whyItMatters: The public case for Kikoff is acquisition-heavy; without cohort retention data the durability and LTV side of the customer story cannot be underwritten.
      diligencePath: Request monthly signup-cohort retention tables, cancellation reasons, delinquency cohorts, and plan-tier renewal metrics.
      relatedQuestionRefs:
        - QU022
      relatedTableRefs:
        - TU004
    - type: private-evidence-only
      severity: material
      topic: channel-concentration
      missingEvidence: Active-partner counts, top-partner share, named enterprise customers, and customer acquisition mix across direct app stores, web, affiliates, and embedded channels.
      whyItMatters: Channel diversification is strategically attractive, but concentration risk cannot be scored if public materials only show broad partner counts and generic enterprise positioning.
      diligencePath: Request a channel-mix bridge, top-10 partner shares, and named enterprise references with live-user counts.
      relatedQuestionRefs:
        - QU024
        - QU025
      relatedTableRefs:
        - TU003
        - TU006
    - type: missing-source
      severity: material
      topic: score-claim-verification
      missingEvidence: Independently audited cohort outcomes behind the +86, +25, and +58 score-improvement marketing claims.
      whyItMatters: Score-lift is the core customer-value proposition, but the public claims vary by surface and date window and cannot be treated as a single validated KPI.
      diligencePath: Request a third-party-audited cohort study with starting-score bands, retention filters, delinquency adjustments, and outcome distributions.
      relatedQuestionRefs:
        - QU012
        - QU013
    - type: access-blocked
      severity: minor
      topic: external-android-analytics
      missingEvidence: Independent third-party Android install-history or engagement data from AppBrain or similar surfaces that were blocked during fetch.
      whyItMatters: Current Google Play metrics are strong, but an external market-data cross-check would improve confidence in trend direction and detect sharp ranking or review-volume changes.
      diligencePath: Re-run AppBrain or similar app-analytics sources with maintainer-approved access or a manual browser session and archive the output.
