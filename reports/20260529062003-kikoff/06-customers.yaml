  - id: TU005
    title: Complaint and trust-signal table
    columns:
      - Surface
      - Current signal
      - What it says
      - Severity for diligence
      - Caveat / limitation
    rows:
      - - CFPB exact-company query
        - 5,982 complaints for Kikoff Inc.
        - Material complaint volume exists on a primary U.S. regulatory complaint surface
        - high
        - Count is query-based and not normalized to customer base or time on market
      - - CFPB complaint categories
        - Largest buckets are credit reporting/personal consumer reports and debt collection
        - Adverse pressure is concentrated in reporting accuracy and collections-related experiences
        - high
        - Category mix does not by itself prove fault rates or current remediation success
      - - CFPB issue mix
        - 'Top issues: incorrect information, improper use of report, investigation failures'
        - Core product-risk is that reporting and dispute handling may damage trust
        - high
        - Aggregations summarize complaints, not adjudicated findings
      - - CFPB narrative complaints
        - Examples cite inaccurate reporting, mistaken identity, cancellation harm, unresolved investigations
        - Complaint narratives align with the worst-case downside of a credit-builder product
        - high
        - Narratives are self-reported allegations, though company responses are logged
      - - BBB business profile
        - Complaint review completed April 2026; BBB latest snippets positive; profile A+
        - Trust picture is mixed rather than purely negative or positive
        - medium
        - BBB profile does not replace cohort-level service-quality reporting
      - - Google Play current adverse reviews
        - Current reviews mention account lockouts, fee confusion, difficult withdrawals, and negative reporting after cancellation
        - Live app-store friction still exists on a major consumer acquisition channel
        - medium
        - Anecdotal review evidence is directionally useful but not statistically complete
    notes: >-
      This table intentionally mixes regulatory, platform, and reputation surfaces because Kikoff's
      core promise touches reporting accuracy, billing behavior, and trust. Complaint evidence is an
      important counterweight to the otherwise strong app-store rating story.
    claimRefs:
