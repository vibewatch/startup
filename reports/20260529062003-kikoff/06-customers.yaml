  - id: TU006
    title: Expansion and concentration risk table
    columns:
      - Expansion driver / concentration vector
      - Public evidence
      - Upside
      - Risk
      - Diligence path
    rows:
      - - Basic to Premium / Ultimate plan ladder
        - Pricing and product pages show larger tradelines and more bundled features at higher tiers
        - Higher ARPU without reacquiring the customer
        - No public evidence on upgrade conversion, downgrade rate, or premium-tier retention
        - Request plan-tier cohort conversion and retention tables
      - - Secured card add-on
        - Premium / Ultimate users can access a secured Mastercard-style product with $50 minimum deposit
        - Extends relationship from store-only credit building into everyday spend
        - Availability is gated by higher plan tiers and an extra deposit hurdle
        - Request secured-card attach rate and activity by plan cohort
      - - Rent / bill reporting / debt negotiation cross-sell
        - Kikoff repeatedly markets these as bundle benefits and retention enhancers
        - Deepens utility and broadens reasons to stay subscribed
        - Verification friction, bureau-coverage differences, and service complexity can raise support burden
        - Request attach, success, dispute, and cancellation data by feature
      - - Affiliate partner channel
        - 650+ partners and Impact-powered creative / tracking
        - Potentially cheaper acquisition than pure app-store demand capture
        - No public disclosure of active partners, CAC, fraud controls, or revenue dependence by partner
        - Request active-partner counts, conversion rates, and top-partner revenue share
      - - Enterprise / embedded-finance motion
        - Enterprise site sells embedded credit building to retailers / partners serving credit-invisible users
        - Could unlock B2B2C distribution and new customer segments
        - No named enterprise customers, deployment dates, or renewal outcomes are disclosed publicly
        - Request named accounts, live-program KPIs, and top-customer concentration
    notes: >-
      Public evidence supports a plausible land-and-expand motion, but it does not yet support a hard
      view on concentration, enterprise durability, or which channels are economically dominant.
    claimRefs:
      - CU005
      - CU006
      - CU007
      - CU029
      - CU037
      - CU038
      - CU039
      - CU040
      - CU041
figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: standard
    summary: >-
      Kikoff's core journey starts with a credit-invisible or sub-600 consumer discovering a low-cost
      offer, then moves into recurring monthly reporting and, for a subset, a deeper product bundle
      or partner-led relationship.
    data:
      items:
        - stage: Credit problem recognition
          actors:
            - Thin-file consumer
            - Sub-600 rebuilder
            - Student / newcomer persona
          touchpoints:
            - Kikoff blog
            - SEO content
            - Social proof on homepage
          emotion: Needs a low-friction path into the credit system without a deposit or hard inquiry
          label: Problem recognition
        - stage: Plan selection
          actors:
            - Direct web prospect
            - App-store browser
            - Affiliate referral lead
          touchpoints:
            - Homepage
            - Pricing page
            - Apple App Store
            - Google Play
          emotion: Evaluating whether $5 entry pricing and no-credit-check claims feel safe enough to try
          label: Signup and plan choice
        - stage: Tradeline activation
          actors:
            - New subscriber
          touchpoints:
            - Credit Account
            - Kikoff store purchase
            - Autopay setup
          emotion: Wants the first payment and first bureau reporting event to happen smoothly
          label: Activation
        - stage: Recurring monthly usage
          actors:
            - Active paying user
          touchpoints:
            - Monthly payment cycle
            - Score monitoring
            - Reminders / autopay
            - Rent or bill reporting
          emotion: Staying current matters because the product can help or hurt depending on payment behavior
          label: Monthly reporting loop
        - stage: Expansion or advocacy
          actors:
            - Premium / Ultimate user
            - Secured-card user
            - Affiliate / enterprise end user
          touchpoints:
            - Secured card
            - Debt negotiation
            - Partner channel
            - Review surfaces
          emotion: Best-case path is deeper product adoption; worst-case path is complaint or cancellation friction
          label: Expansion / advocacy
    claimRefs:
      - CU001
      - CU002
      - CU004
      - CU006
      - CU007
      - CU008
      - CU029
      - CU037
  - id: FU002
    title: Public proof funnel — market need to visible user validation
    type: funnel
    layout: standard
    summary: >-
      This is not a literal conversion funnel; it stacks the strongest retained public proxies from
      broad market need into visible user validation to show why Kikoff's reach story is stronger than
      its disclosed retention story.
    data:
      items:
        - label: U.S. credit-invisible consumers (company blog citing market need)
          value: 26000000
        - label: Google Play downloads
          value: 5000000
        - label: Customers empowered (company claim)
          value: 1000000
        - label: Apple App Store ratings
          value: 247000
        - label: Google Play reviews
          value: 122000
    approximationNotes: >-
      The stages use heterogeneous public metrics rather than one audited customer-conversion dataset.
      Read this as a proof ladder from broad need to visible user validation, not as a true funnel with
      denominator-consistent conversion rates.
    claimRefs:
      - CU009
      - CU011
      - CU012
      - CU013
      - CU028
      - CU042
  - id: FU003
    title: Customer proof matrix
    type: matrix
    layout: wide
    summary: >-
      Public customer evidence is strongest on volume and freshness, but much weaker on enterprise
      identity, audited outcomes, and longitudinal retention visibility.
    data:
      columns:
        - Identity transparency
        - Outcome specificity
        - Independence
        - Durability visibility
      rows:
        - label: Official homepage testimonials
          values:
            - Medium (first names / locations only)
            - Medium-high (large score claims, but no bureau documents)
            - Low (company-curated)
            - Low (no renewal or tenure data beyond anecdotes)
        - label: Apple App Store page
          values:
            - Low at reviewer level, high at aggregate level
            - Medium (ratings volume and score-lift footnote)
            - Medium-high (platform-hosted)
            - Low (ratings do not reveal churn)
        - label: Google Play page
          values:
            - Medium (named handles and dated reviews)
            - High on complaint specificity; medium on positive outcomes
            - Medium-high (platform-hosted)
            - Low-medium (isolated year-long anecdote, no cohort data)
        - label: BBB profile
          values:
            - Medium (named review snippets and complaint notice)
            - Low-medium (short snippets, little quantified impact)
            - High (independent business-profile surface)
            - Low (no cohort or renewal metrics)
        - label: CFPB complaint database
          values:
            - Low at consumer identity level, high at exact-company aggregation level
            - High on issue taxonomy and complaint scale
            - High (regulatory complaint database)
            - Low on positive durability; high on trust-risk visibility
    claimRefs:
