  topStrengths:
    - >-
      Very low-friction entry point at $5 per month with no hard inquiry, plus reporting breadth and adjacent products
      that widen monetization beyond one tradeline.
    - >-
      Public consumer reach appears meaningful, with 1M+ customers cited on owned surfaces and large app-store install
      and rating footprints.
    - >-
      Investor sponsorship and product expansion suggest Kikoff is more than a one-feature credit-builder and may have
      meaningful cross-sell optionality.
  topRisks:
    - >-
      The reported $1B valuation is not supported by disclosed ARR, gross margin, churn, or financing terms, making
      denominator risk unusually high.
    - >-
      CFPB complaint volume, negative review patterns, and recurring cancellation and billing grievances raise trust and
      servicing concerns.
    - >-
      The core closed-loop tradeline and newer debt-negotiation workflows increase regulatory, outcome-quality, and
      reputational risk if score lifts do not translate into broader credit access.
  unresolvedGaps:
    - Current ARR, paid-subscriber count, retention, churn, and cohort economics by plan tier.
    - >-
      Gross margin, servicing cost, CAC, LTV, and cash runway for the core subscription business versus debt-negotiation
      adjacencies.
    - >-
      Exact terms behind the January 2025 valuation, including instrument type, investor protections, and whether the
      mark came from primary or secondary activity.
    - >-
      Complaint-resolution rates, refund outcomes, and regulator-facing controls for debt negotiation, furnishing
      accuracy, and subscription billing.
