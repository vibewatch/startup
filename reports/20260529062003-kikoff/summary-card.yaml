summary:
  headline: >
    Kikoff has real customer reach and a differentiated low-friction credit-building bundle, but the public record still
    leaves too much uncertainty around retention, complaint quality, and revenue to underwrite the reported unicorn
    valuation with conviction.
  overallScore: 5.4
  recommendation: research-more
  confidence: medium
  riskRating: high
  valuationStance: stretched
