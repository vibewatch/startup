      - [Customer concentration or adoption shortfall, medium, high, "not publicly evidenced", high, "Request named production deployments and concentration schedule"]
    notes: Risk likelihood and residual exposure are analytical judgments constrained by the cited public evidence; “not publicly evidenced” means an evidence gap, not proof that controls are absent.
    claimRefs: [CR001, CR005, CR009, CR011, CR012, CR014]
  - id: TR002
    title: Regulatory / legal risk register
    columns: [Rule or issue, Jurisdiction, Public status, Likelihood, Severity, Mitigation, Residual exposure, Diligence path]
    enumerationScope:
      coverage: partial
      basis: "Public regulatory and statutory frameworks relevant to a private semiconductor company as of 2026-10-25."
    rows:
      - [Advanced-computing export controls, "United States / cross-border", "BIS rule published 2023-10-25", medium, high, "Classify products and screen end uses and counterparties", "medium-high", "Obtain ECCN analysis, licenses, and compliance-owner evidence"]
      - [CHIPS Act eligibility and incentive conditions, United States, "Program framework described by NIST", low-medium, medium-high, "Map ownership, facilities, security, and incentive conditions", medium, "Confirm applications, awards, and ongoing compliance obligations"]
      - [Trade-secret misappropriation or employee mobility dispute, "United States / foreign commerce", "Statutory remedies available; Celero posture unknown", medium, high, "Review invention assignment, NDAs, access logging, and departures", "medium-high", "Obtain legal diligence and schedule of threatened or pending claims"]
      - [Export-control rule change or interpretation shift, "United States / affected destinations", "Federal Register identifies continuing monitoring need", medium, high, "Quarterly regulatory review and shipment gating", "medium-high", "Test roadmap and partner exposure against current BIS guidance"]
    notes: The public sources establish the regulatory frameworks and remedies, not Celero-specific noncompliance or litigation; company-specific status remains a diligence gap.
    claimRefs: [CR005, CR006, CR007, CR008]
  - id: TR003
    title: Partner / dependency risk register
    columns: [Dependency, Counterparty or role, Failure scenario, Severity, Mitigation, Residual exposure, Monitoring indicator]
    rows:
      - [Advanced-node foundry, "Undisclosed foundry", "Tape-out cannot convert to acceptable yield or capacity", high, "Confirm node, allocation, yield ramp, and second-source plan", high, "Wafer acceptance, yield, lead time, and capacity reservation"]
      - [Packaging and test, "Undisclosed OSAT / test partners", "Package, thermal, or test bottleneck delays shipments", high, "Qualify alternatives and test coverage", medium-high, "Cycle time, failure analysis, and on-time delivery"]
      - [Optical module and systems ecosystem, "Customers / integration partners", "Interoperability or qualification fails at deployment", high, "Use named design wins and acceptance criteria", high, "Pilot-to-production conversion and field returns"]
      - [Capital providers, "CapitalG, Sutter Hill, and other investors", "Burn exceeds financing window or terms dilute holders", high, "Maintain runway case and financing triggers", medium-high, "Cash balance, monthly burn, round terms, and runway"]
    notes: Counterparties are disclosed only where the assigned sources identify investors; operational counterparties and concentration are not publicly identified in this pool.
    claimRefs: [CR009, CR010, CR011, CR012]
figures:
  - id: FR001
    title: Risk heatmap
    summary: Six principal risk exposures plotted by qualitative likelihood and impact, with residual exposure retained as a separate field.
    type: matrix
    data:
      columns: [Likelihood, Impact, Residual exposure, Monitoring trigger, Evidence status]
      rows:
        - label: Commercialization / qualification
          values: ["medium-high", high, high, "Milestone slip or failed qualification", "not independently established"]
        - label: Export-control change
          values: [medium, high, "medium-high", "License or end-use restriction", "framework evidence only"]
        - label: Foundry / packaging dependency
          values: [medium, high, "medium-high", "Yield, capacity, or lead-time miss", "counterparties undisclosed"]
        - label: Financing / dilution
          values: ["medium-high", high, high, "Runway below next silicon milestone", "cash and terms undisclosed"]
        - label: IP / trade-secret dispute
          values: [medium, high, "medium-high", "Claim, departure, or access-control exception", "company posture unknown"]
        - label: Customer adoption / concentration
          values: [medium, high, high, "No named production design win", "customer schedule unavailable"]
    notes: Qualitative ratings summarize the risk register; they do not imply measured probabilities.
    claimRefs: [CR001, CR005, CR009, CR011, CR012, CR014]
callouts:
  - calloutType: risk
    title: Thesis-break trigger
    body: A material slip in qualified silicon, inability to secure compliant cross-border shipments, or financing that arrives before verifiable production traction would break the current scale-up thesis.
    claimRefs: [CR013, CR014]
  - calloutType: assumption
    title: Evidence limitation
    body: Public company, investor, statutory, and government materials establish context but do not independently verify Celero's yield, revenue, customer concentration, legal posture, or operational controls.
    claimRefs: [CR003, CR008, CR012]
