    columns: [Risk, Likelihood, Impact, Mitigation maturity, Residual exposure, Investment implication]
    rows:
      - [Commercialization and qualification failure, "medium-high", "high", "early / not independently evidenced", "high", "Require production and design-win proof before underwriting scale"]
