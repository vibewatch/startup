              - CU010
              - CU011
              - CU012
              - CU016
      - number: '6.3'
        title: Durability, expansion, and concentration remain private
        blocks:
          - type: paragraph
            body: >-
              Demand conditions are favorable but cannot substitute for company-level retention evidence. CoreWeave
              cites a Futurum survey in which 68% of 820 AI decision-makers were past experimentation, while OIF
              convened Microsoft, Google Cloud, Meta, OpenAI, system vendors, semiconductor suppliers, and standards
              bodies around 448Gbps signaling. Those facts indicate sophisticated prospective buyers and a large
              qualification ecosystem. A reasonable customer journey runs from requirements definition to design win,
              silicon and module qualification, paid production, and then repeat platform adoption. Only the early
              stages are visible for Celero. No assigned source supplies GRR, NRR, churn, contract duration, renewal,
              repeat-order, expansion-revenue, or customer-concentration data. These are material underwriting gaps,
              especially because a semiconductor startup may depend on a small number of long-cycle design wins before
              revenue diversifies.
            claimRefs:
              - CU007
              - CU013
              - CU014
              - CU015
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU013
              - CU014
              - CU015
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Public customer proof is below underwriting standard
            body: >-
              No retained source names a paid Celero deployment, and the available materials provide no retention or
              concentration metrics. Technical diligence should not be treated as a proxy for customer reference checks.
            calloutType: risk
            claimRefs:
              - CU010
              - CU013
              - CU014
          - type: callout
            title: Verify the design-win funnel directly
            body: >-
              Request account-level funnel stages, qualification status, paid sampling, production volume, contract
              terms, and customer references before assigning value to adoption or expansion.
            calloutType: recommendation
            claimRefs:
              - CU012
              - CU015
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk view
        blocks:
          - type: paragraph
            body: >-
              The highest-confidence risk is execution through commercialization: Celero publicly describes coherent DSP
              technology and a 2nm tape-out, but the retained evidence does not establish production shipments, customer
              design wins, qualification status, yield, or recurring revenue. That gap makes the downside asymmetric
              because semiconductor programs can consume substantial capital before customer acceptance. The second tier
              is external dependency: the product is an advanced semiconductor subject to export-control interpretation,
              foundry access, packaging, and supply continuity. A third tier is information risk. The company is private
              and its public materials emphasize technology and funding rather than operating metrics, so investors
              cannot independently test burn, margins, customer concentration, or incident history. These are evidence
              gaps, not proof that an incident or failure has occurred.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR005
              - CR009
              - CR011
