              - CU002
              - CU003
              - CU004
              - CU005
              - CU006
              - CU007
      - number: '6.2'
        title: Adoption signals stop before customer deployment
        blocks:
          - type: paragraph
            body: >-
              The strongest public signals are product-readiness and commercialization milestones rather than customer
              outcomes. CapitalG says Celero taped out a 2nm coherent DSP and describes links scaling from 1.6T to 3.2T
              and beyond. The current job posting is more revealing for customer maturity: it asks a new commercial
              leader to build go-to-market plans and secure critical early-stage design wins. Reuters likewise says the
              company is designing its chip and plans to embed new algorithms, language that does not verify volume
              shipment. Celero's November 2025 release and its syndicated copy discuss market need and funding but
              disclose no customer count, shipment volume, production qualification, paid deployment, or design-win
              conversion. The retained corpus therefore supports a credible sales target and technical proposition, not
              proven customer adoption.
            claimRefs:
              - CU008
              - CU009
              - CU010
              - CU011
              - CU012
              - CU016
          - type: table
            tableRef: TU002
            claimRefs:
