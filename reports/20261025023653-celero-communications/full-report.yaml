    title: Coherent DSP product architecture map
    type: stack
    summary: >-
      Celero's disclosed product thesis sits between AI accelerator electrical interfaces and managed coherent optical
      links.
    data:
      layers:
        - label: AI accelerator electrical interface
          detail: Receives high-rate electrical data from GPUs or other AI accelerators.
          items:
            - label: High-rate electrical data
              detail: Electrical signals originate at GPUs or other AI accelerators.
              unit: null
              note: Host interface and signal-integrity measurements are not publicly disclosed.
            - label: Host SerDes and package
              detail: The electrical interface depends on host signal integrity and package design.
              unit: null
              note: Celero-specific host-interface requirements are not publicly disclosed.
        - label: Celero coherent DSP
          detail: Processes electrical data for coherent optical transmission.
          items:
            - label: Signal processing silicon
              detail: Purpose-built coherent DSP is described as the core product for AI infrastructure.
              unit: null
              note: Current SKU, process, package, and independent performance data are unavailable.
            - label: Analog and digital processing
              detail: The disclosed architecture combines proprietary DSP design with advanced analog technology.
              unit: null
              note: The investor description is not an independent benchmark.
        - label: Coherent optical interconnect
          detail: Carries processed data over fiber between racks, campuses, or data centers.
          items:
            - label: Fiber link
              detail: The target spans short/medium-reach links and connections across clusters or data centers.
              unit: null
              note: Reach, BER, power, and cost by deployment are unverified.
            - label: Optical module integration
              detail: The product thesis requires optical components, fiber, and interoperable module integration.
              unit: null
              note: Celero's module reference design and customer qualification are undisclosed.
        - label: Operations and security
          detail: Manages modules, diagnostics, firmware, and security-related controls.
          items:
            - label: Module management
              detail: OIF work indicates evolving requirements for CMIS, coherent management, link training, and security.
              unit: null
              note: Celero implementation and certification status are not disclosed.
            - label: Firmware and diagnostics
              detail: Management interfaces can expose monitoring, updates, link training, and fault handling.
              unit: null
              note: Celero's firmware lifecycle and vulnerability process are not disclosed.
        - label: Foundry and packaging
          detail: Manufacturing, packaging, thermal, and yield execution determine whether the DSP can scale.
          items:
            - label: Silicon manufacturing
              detail: The company depends on foundry and packaging execution for production.
              unit: null
              note: Foundry node, package, yield, and supply commitments are not publicly disclosed.
        - label: Customer deployment
          detail: The commercial endpoint is qualified deployment in hyperscale or other AI infrastructure.
          items:
            - label: Design win or production link
              detail: Public sources do not identify a production customer or deployment.
              unit: null
              note: Request named design wins, pilot status, and production references.
