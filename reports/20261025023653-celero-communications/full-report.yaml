  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              Celero's defensible market boundary is much narrower than "AI data centers." The core category is coherent
              DSP silicon embedded in optical links used to connect accelerators, racks, buildings, and data centers.
              Celero and CapitalG describe data-center-specific coherent DSPs spanning AI accelerator clusters and cloud
              data-center connections; EquityZen similarly identifies data-center networks and AI acceleration clusters.
              Broader optical transport, complete transceivers, switches, fiber, and total AI infrastructure investment
              are demand context rather than Celero TAM. Status-quo and adjacent substitutes include copper for short
              reaches, PAM4 optics at established data rates, legacy telecom coherent for longer links, and emerging
              LPO, LRO, and CPO architectures that can reduce standalone DSP content. This boundary centers the analysis
              on DSP content where coherent performance is actually required.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM010
              - CM013
      - number: '2.2'
        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports several non-equivalent sizing lenses, not a clean TAM/SAM/SOM. A Celero-issued
              release cites nearly $7 trillion of global data-center investment through 2030, including about $5.2
              trillion for AI workloads, but those figures include compute, power, construction, and other spend far
              outside DSPs. Dell'Oro estimates reported by Converge Digest put 2026 optical-transport manufacturer
              revenue above $18 billion after a 16% forecast increase, while an earlier Dell'Oro forecast reported by
              RCR Wireless put the market at $19 billion in 2029 on 5% annual growth. LightCounting provides the closest
              component lens: more than $2 billion of 1.6T chipset sales in 2026 and more than eight million
              coherent-DSP units by 2031. Different periods, products, and units make these contextual bounds, not
              additive layers.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM006
              - CM008
              - CM009
              - CM015
      - number: '2.3'
        title: Buyers, users, and budget path
        blocks:
          - type: paragraph
            body: >-
              The economic chain separates the immediate silicon buyer from the end payer. Optical module and system
              vendors are the likely direct DSP integrators; their product, engineering, and sourcing teams must qualify
              silicon into transceivers or platforms. Hyperscalers, cloud operators, and service providers ultimately
              fund deployments through network and data-center capital budgets, while network architects and cluster
              operators are the users most exposed to reach, power, bandwidth density, and reliability. Cisco reports
              that hyperscalers account for most coherent-pluggable deployments and that about 350 service providers
              also deploy the optics. Public sources do not establish Celero's contracting model, module partners,
              budget ownership at named customers, or whether the company sells silicon directly to end operators.
            claimRefs:
              - CM010
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM014
      - number: '2.4'
        title: Growth drivers and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              Demand is supported by AI clusters spanning more accelerators and facilities, higher link rates, and
              greater data-center-interconnect traffic. Dell'Oro data reported by Converge Digest show direct DCI
              purchases growing an estimated 40% year over year in the first quarter of 2026. Adoption is not
              frictionless: supplier backlogs and longer lead times can cap near-term market growth; LightCounting
              expects linear-drive solutions to weigh on DSP sales in 2027-2031; and Cisco's roadmap discussion
              highlights costly 2nm/3nm development and possible fragmentation among 1600ZR, 1600ZR+, and coherent-lite.
              Celero reports validated 2nm silicon and a 1.6T-to-3.2T path, but its financing is still directed partly
              to production readiness. Without disclosed volume shipments, design wins, ASPs, or qualification
              schedules, adoption timing and obtainable share remain unverified.
            claimRefs:
              - CM006
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Demand evidence is stronger than addressability evidence
            body: >-
              Independent forecasts support expanding AI-related optical and high-speed chipset demand, but no retained
              source isolates Celero's serviceable revenue pool or attainable share.
            calloutType: insight
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
          - type: callout
            title: DSP content is not guaranteed
            body: >-
              Linear optics, co-packaged optics, standards fragmentation, qualification cost, and supply constraints can
              delay adoption or shift value away from a standalone coherent DSP vendor.
            calloutType: risk
            claimRefs:
              - CM012
              - CM013
              - CM014
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              The relevant market is not a single list of DSP vendors. Buyers can select short-reach PAM4 optics,
              longer-reach coherent pluggables, co-packaged optics, optical I/O chiplets, or internal silicon. CapitalG
              describes PAM4 as cost-effective but constrained at 1.6T and 3.2T+ by noise, degradation, and reach, while
              legacy coherent is capable over distance but too costly and power-hungry for broad data-center deployment.
              That framing makes Celero's direct competition a technology choice between incumbent architectures as much
              as a company-versus-company contest. LightCounting's February 2026 report lists Broadcom, Credo, MACOM,
              Marvell, MaxLinear, and Semtech among leading PAM4 suppliers, and separately profiles coherent suppliers
              including Cisco/Acacia, Ciena, Huawei, Nokia, ZTE, and smaller vendors such as Celero and Retym. The
              competitive set therefore includes scaled silicon vendors with qualification and distribution advantages,
              specialist coherent vendors, and adjacent optical-compute platforms. Celestial AI's $515 million
              cumulative funding and Photonic Fabric platform demonstrate that well-capitalized alternatives can attack
              the same AI bandwidth and latency problem from a different layer. UCIe also shows that open chiplet
              standards are a parallel ecosystem route for moving data closer to the package.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP008
              - CP011
      - number: '3.2'
        title: Capability, scale, and positioning
        blocks:
          - type: paragraph
            body: >-
              Celero's differentiation is strongest at the architecture and team level, but the public record does not
              establish product revenue, named production customers, pricing, or design wins. CapitalG's November 2025
              investment note says Celero was building coherent DSP platforms for AI-scale networking and describes a
              100-person team with founders from Broadcom, Inphi, Marvell, and ClariPhy. Its later investor update
              reports an industry's first 2nm coherent DSP tape-out and an architecture intended to carry more data per
              link than traditional PAM4 with lower power than legacy coherent. Those are important technical
              milestones, but they remain investor-issued claims rather than independent deployment evidence. By
              contrast, Futurum reports Broadcom's 3nm Taurus BCM83640 sampling to early access customers and partners,
              with 400G/lane interfaces aimed at 1.6T modules and a roadmap toward 3.2T. Futurum also notes Marvell's
              Electra and Libra coherent portfolio and warns that NVIDIA's reported in-house DSP effort and co-packaged
              optics could compress the addressable market. The comparison is therefore asymmetric: Celero may offer a
              technically attractive middle path, but incumbents currently show stronger evidence of qualification
              readiness and ecosystem reach.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP011
      - number: '3.3'
        title: Switching costs, ecosystem power, and moat durability
        blocks:
          - type: paragraph
            body: >-
              Switching costs in optical interconnects are created by silicon qualification, module interoperability,
              foundry and packaging access, software and standards compatibility, and the risk of redesigning a deployed
              topology. Futurum says transceiver qualification cycles are lengthy and that early DSP design wins can
              persist because module manufacturers are reluctant to re-engineer validated platforms. This favors
              Broadcom and Marvell if their sampling and standards positions translate into volume designs. Celero's
              claimed founder experience and foundry relationships could reduce execution risk, but no public source in
              this pool verifies customer contracts, production volumes, realized pricing, or the durability of those
              relationships. Ayar Labs illustrates another moat pattern: substantial financing is being used to expand
              manufacturing, test capacity, and ecosystem partnerships for co-packaged optics, while Celestial AI's
              large funding base supports an alternative optical fabric. The adverse case is thus not that Celero lacks
              technical differentiation; it is that architecture selection, incumbent distribution, internal silicon, or
              CPO could commoditize or bypass a standalone coherent-DSP layer before Celero reaches scale. A reasonable
              underwriting stance is to credit technical optionality while leaving commercial moat, pricing power, and
              customer lock-in as open questions.
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
      - number: '3.4'
        title: Competitive diligence implications
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a focused diligence agenda rather than a definitive market-share conclusion. Celero
              should be tested against the actual buying criteria of hyperscalers and optical-module partners: bit rate
              and reach at system conditions, watts per bit, module bill of materials, standards interoperability,
              security features, qualification status, and time to volume. Public materials establish the architecture
              narrative and funding backdrop, but not the denominator needed to compare customer adoption or economics.
              The most decision-relevant missing evidence is a customer-backed design-win list, sampling and
              qualification milestones, unit pricing and gross-margin assumptions, and the share of deployments where
              coherent is required rather than merely advantageous. Until those are disclosed or independently
              corroborated, Celero's moat should be treated as conditional on execution and ecosystem conversion.
            claimRefs:
              - CP006
              - CP007
              - CP009
              - CP012
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Technical differentiation is plausible
            body: >-
              Celero's coherent-DSP architecture and founder experience address a real trade-off between PAM4 reach and
              legacy coherent cost or power, but the strongest public support is investor-issued.
            calloutType: strength
            claimRefs:
              - CP001
              - CP005
              - CP006
          - type: callout
            title: Ecosystem conversion is unproven
            body: >-
              Incumbent sampling, long qualification cycles, CPO, optical I/O, and internal silicon create credible
              displacement paths before Celero's customer traction and pricing power are public.
            calloutType: risk
            claimRefs:
              - CP007
              - CP009
              - CP010
              - CP011
              - CP012
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization visibility
        blocks:
          - type: paragraph
            body: >-
              Celero's public materials describe a fabless semiconductor business selling coherent digital signal
              processor technology for optical interconnects in AI infrastructure. The revenue mechanism is therefore
              expected to be chip or platform sales into transceiver, networking, or infrastructure supply chains, but
              public evidence does not disclose contractual pricing, shipment volume, realized revenue, royalty terms,
              or revenue recognition policy. The company says its technology targets 1.6T through 3.2T connectivity and
              production readiness, while external analysis emphasizes that validated silicon is not the same as
              volume-shipped product. List-like technical claims should not be treated as ARR, revenue, or gross margin.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
      - number: '4.2'
        title: Cost structure and unit economics
        blocks:
          - type: paragraph
            body: >-
              The economics are dominated by semiconductor development and commercialization rather than a disclosed
              recurring software subscription. Celero's roadmap requires advanced-node silicon, analog and DSP design,
              foundry access, testing, packaging, qualification, customer integration, and eventual production scale.
              CapitalG describes a 2nm tape-out and a purpose-built architecture, while market evidence shows that
              optical supply chains face upstream laser and capacity bottlenecks. Those facts support a potentially
              high-value component opportunity but do not establish wafer cost, gross margin, yield, inventory turns,
              warranty exposure, customer concentration, or CAC/payback. Every missing unit-economic field remains a
              diligence request rather than an estimate.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
          - type: table
            tableRef: TI003
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI014
      - number: '4.3'
        title: Traction, financing dependency, and capital adequacy
        blocks:
          - type: paragraph
            body: >-
              Celero's disclosed capital base is meaningful relative to a two-year-old chip startup, but financing
              raised is not cash available and does not prove commercial traction. The November 2025 company release
              reported $140 million of total funding, including a $100 million Series B and $40 million of earlier
              rounds. September 2026 coverage reports a $275 million Series C at a valuation above $3 billion and about
              $415 million cumulatively, with the stated uses including roadmap acceleration, research and development,
              and production readiness. No public source in this pool supplies cash on hand, quarterly burn, runway,
              debt, working-capital needs, customer deposits, or design-win revenue. Capital adequacy therefore depends
              on tape-out-to-production execution and the timing of the next financing or commercial cash inflow.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
          - type: table
            tableRef: TI004
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
      - number: '4.4'
        title: Financial verdict and underwriting blockers
        blocks:
          - type: paragraph
            body: >-
              The financial profile is best characterized as well funded but commercially unproven. The capital raise
              and investor participation reduce near-term financing uncertainty, while the absence of disclosed revenue,
              margin, cash, burn, pricing, and customer commitments prevents a conventional earnings or cash-flow
              underwriting. Supply constraints can create urgency and pricing power, but they can also raise input,
              qualification, and delivery risk. Broader semiconductor funding is concentrated in large rounds and
              remains exposed to continued AI infrastructure spending, so follow-on capital cannot be assumed. A
              credible underwriting package should require audited or management financials, current cash and burn, a
              product-level costed bill of materials, yield and capacity assumptions, signed customer or channel
              commitments, and evidence that the latest silicon has moved beyond validation into paid production
              deployments.
            claimRefs:
              - CI014
              - CI015
              - CI016
          - type: figure
            figureRef: FI001
