  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Celero sells a coherent digital signal processor platform rather than a complete data-center network. The
              disclosed workflow is to place signal-processing silicon inside optical interconnect hardware so
              electrical data from AI accelerators can be transported over fiber between racks, clusters, campuses, and
              data centers. The company describes the target problem as the bandwidth, reach, latency, power, and cost
              limits that emerge as AI systems connect increasing numbers of accelerators. SiliconANGLE independently
              reports that Celero is focused on short- and medium-reach optical links, where coherent optics had
              previously been viewed as too costly or power hungry, while the company describes its target as
              high-bandwidth, low-power connectivity. This is a credible problem definition, but the public record does
              not identify a production SKU, named customer deployment, measured power envelope, yield, or realized link
              economics. Those omissions matter because the product's value depends on system-level performance, not
              only on a DSP architecture claim.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE005
              - CE006
              - CE010
              - CE012
          - type: table
            tableRef: TE002
            claimRefs:
              - CE002
              - CE003
              - CE007
              - CE011
              - CE012
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE002
              - CE005
              - CE007
              - CE011
              - CE012
      - number: '5.2'
        title: Architecture, operating model, and maturity
        blocks:
          - type: paragraph
            body: >-
              The architecture disclosed publicly has three functional layers: electrical data from accelerators is
              converted by a DSP, carried through coherent optical modulation over fiber, and managed as part of an
              interoperable optical module or network. CapitalG describes Celero as building coherent DSP platforms
              purpose-built for AI data centers and says the architecture is intended to carry more data per link than
              traditional PAM4 while using less power than legacy coherent approaches. The same investor source says
              Celero taped out 2nm coherent DSP silicon after its Series B, but this is an investor statement rather
              than an independent tape-out report or customer qualification record. OIF materials provide useful market
              context: current work spans 1600ZR, 1600ZR+, 1600CL, coherent module management, security for CMIS, and
              energy-efficient interfaces. That context supports the relevance of Celero's design direction, not
              Celero-specific compliance or interoperability. Public evidence therefore supports an advanced
              silicon-development stage, while production readiness, qualification, software/firmware controls, and
              manufacturing milestones remain unverified.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE003
            claimRefs:
