chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating scope
        blocks:
          - type: paragraph
            body: >-
              Celero Communications is a private semiconductor company founded in 2024 and headquartered in Irvine,
              California, with company-disclosed design centers in Canada and Argentina. It develops coherent digital
              signal processors intended to deliver high-bandwidth, low-power optical connectivity for AI accelerator
              clusters and cloud data centers. That identity is important because web results also contain Celero
              Commerce, an unrelated payment-processing company acquired by Deluxe; evidence about that business must
              not be attributed to Celero Communications. The assigned evidence establishes the product category and
              locations, but does not establish current revenue or ARR, named customers, shipment volumes, production
              design wins, or 2026 headcount. A CapitalG post described a 100-person team in November 2025, which is a
              dated investor statement rather than a current employee count.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO006
              - CO015
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO006
              - CO008
              - CO009
              - CO013
      - number: '1.2'
        title: Leadership and governance
        blocks:
          - type: paragraph
            body: >-
              Co-founders Nariman Yousefi and Oscar Agazzi occupy the central executive and technical roles: Yousefi is
              chief executive and Agazzi is chief technology officer. CapitalG and the company describe both as veterans
              of Marvell, Inphi, Broadcom, and ClariPhy who worked on prior DSP and networking products. Public
              financing materials also identify investor representatives James Luo, Stefan Dyckerhoff, and Gavin Baker
              as board members. This is strong evidence of domain-specific founder-market fit and investor engagement,
              but it also concentrates much of the externally visible operating credibility in two founders. The
              available pool does not provide a complete board roster, committee structure, voting rights, succession
              plan, or broader executive bench, so governance quality and key-person mitigation cannot yet be
              underwritten.
            claimRefs:
              - CO004
              - CO005
              - CO011
              - CO016
          - type: table
            tableRef: TO002
            claimRefs:
              - CO004
              - CO005
              - CO011
              - CO016
      - number: '1.3'
        title: Capitalization and stakeholders
        blocks:
          - type: paragraph
            body: >-
              Celero announced $140 million of total funding in November 2025, comprising a $100 million Series B and
              $40 million from earlier rounds. In October 2026, Orrick reported a $275 million Series C, $415 million of
              total capital raised, and a valuation above $3 billion. CapitalG, Atreides Management, and Valor Equity
              Partners led the Series C, while Sutter Hill Ventures and Maverick Silicon continued as investors. These
              figures describe financing proceeds and a transaction valuation; they do not establish cash currently
              available, revenue, ARR, cash burn, runway, or the economics of any secondary sales or debt. Multiples
              presents a material data-quality conflict: its summary reports $413 million raised, while its own detailed
              Series C narrative says $415 million. The primary-adjacent Orrick and investor accounts support using $415
              million, with the discrepancy retained rather than silently reconciled.
            claimRefs:
              - CO007
              - CO008
              - CO009
              - CO010
              - CO013
          - type: table
            tableRef: TO003
            claimRefs:
              - CO007
              - CO008
              - CO010
              - CO011
      - number: '1.4'
        title: Milestones and diligence boundary
        blocks:
          - type: paragraph
            body: >-
              The disclosed chronology shows unusually fast capitalization and technical progression: founding and seed
              financing in 2024, a Series A later that year, the Series B in November 2025, and the Series C in 2026.
              Orrick and CapitalG report that Celero validated 2nm coherent DSP silicon intended to span 1.6T through
              3.2T connectivity. That milestone narrows one historical concern raised by Tech in Asia, which in November
              2025 highlighted missing process-node and tapeout disclosures. It does not close the remaining diligence
              gaps around baud rate, measured power, production yield, customer qualification, partnerships, and
              commercial shipments. The timeline therefore records disclosed events rather than treating financing or
              silicon validation as proof of market adoption. Investment diligence should require primary operating
              data, customer references, capitalization documents, and a current organization chart before relying on
              the valuation or scale narrative.
            claimRefs:
