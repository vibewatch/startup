              - CE007
              - CE008
              - CE011
              - CE012
              - CE013
      - number: '5.3'
        title: Differentiation, trust, and implementation risk
        blocks:
          - type: paragraph
            body: >-
              Celero's strongest disclosed differentiator is the founders' prior experience shipping multiple
              generations of coherent DSP and networking IC products at Marvell, Inphi, Broadcom, and ClariPhy. The
              company also points to a purpose-built balance between telecom-grade coherent performance and data-center
              power and cost constraints. That combination is strategically relevant, but most detailed performance
              language is company- or investor-issued and is not accompanied by public benchmark methodology,
              independent test data, patents, certifications, security attestations, customer references, or incident
              history. OIF's active work on CMIS management, CMIS security, 1600G coherent interfaces, and
              energy-efficient interfaces shows that interoperability, management, security, and power are live
              engineering dependencies for the category. Celero's product-risk profile is consequently asymmetric: the
              technical thesis is coherent and founder credibility is strong, but the diligence case still depends on
              evidence of silicon bring-up, foundry and packaging execution, interoperability testing, secure module
              management, reliability qualification, and named production deployments.
            claimRefs:
              - CE010
              - CE011
              - CE012
              - CE013
              - CE014
      - number: '5.4'
        title: Product verdict and diligence priorities
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a technically focused coherent-DSP platform aimed at a real AI-networking
              bottleneck, not a fully evidenced commercial product. Celero has disclosed its target workflow, a
              coherent-silicon architecture, a high-experience founding team, and financing sufficient to pursue
              engineering and commercialization. It has not publicly disclosed the metrics needed to underwrite product
              maturity: tape-out or sample dates by product, process and package details, measured link performance,
              power at stated rates, yield, qualification status, customer production status, support model, security
              controls, or failure-rate data. The appropriate product judgment is therefore promising but pre-scale and
              evidence constrained. The next diligence step should request independent lab results, qualification and
              reliability reports, design-win status by SKU, manufacturing and packaging dependencies, and a
              security/compliance evidence pack rather than extrapolating from funding or investor confidence.
            claimRefs:
              - CE015
              - CE016
              - CE017
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Strong technical founding base
            body: >-
              The founders' prior experience shipping coherent DSP and networking IC generations is the clearest public
              evidence supporting execution capability, although it is not a substitute for Celero-specific
              qualification data.
            calloutType: strength
            claimRefs:
              - CE010
          - type: callout
            title: Product maturity is not independently evidenced
            body: >-
              Public sources do not establish a production SKU, named production deployment, measured power or reach,
              yield, reliability qualification, or security certification.
            calloutType: risk
            claimRefs:
              - CE013
              - CE014
              - CE016
          - type: callout
            title: Request silicon and deployment proof
            body: >-
              Underwriting should be conditioned on independent lab results, qualification records, design-win status,
              and manufacturing, firmware, and security evidence.
            calloutType: recommendation
            claimRefs:
              - CE015
              - CE017
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Target buyers, users, and deployment settings
        blocks:
          - type: paragraph
            body: >-
              Celero's stated route to market centers on two direct account types: hyperscalers and optical module
              makers. Its Marketing Director posting describes engineering executives and architects as the audience,
              asks the role to translate hyperscaler networking requirements into DSP specifications, and calls for
              early-stage design wins with both account types. The operating user is therefore likely a network,
              optical, or system engineering team, while the economic buyer and payer remain undisclosed. Celero's own
              release places the product across AI accelerator clusters and cloud data-center connections. Reuters
              narrows the use case to translating optical and electrical signals for links spanning data centers. OIF
              and AWS show a broader ecosystem of cloud operators, model developers, system vendors, and component
              suppliers, but neither establishes a commercial relationship with Celero.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU006
          - type: table
            tableRef: TU001
            claimRefs:
