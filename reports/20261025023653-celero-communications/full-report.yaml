              - CR009
              - CR011
              - CR012
              - CR014
      - number: '7.2'
        title: Regulatory and legal exposure
        blocks:
          - type: paragraph
            body: >-
              Export controls are a material diligence item because Celero develops coherent DSP silicon for AI
              infrastructure and maintains design centers in Irvine, Canada, and Argentina. The Federal Register rule
              retained for this chapter is a Department of Commerce/BIS action covering advanced computing items,
              semiconductor end use, license requirements, and country-scope changes; it also includes a section titled
              “Need To Continuously Monitor the FDP Rules and revise license review Policies as Needed.” That does not
              show that Celero is restricted, but it does show a changing compliance perimeter for semiconductor
              businesses. The CHIPS for America page states that the 2022 law provided Commerce $50 billion, including
              $39 billion for facilities and equipment and $11 billion for research and development. Celero's access to
              incentives, suppliers, and cross-border engineering should therefore be checked against eligibility,
              end-use, ownership, and export-control procedures. Separately, trade-secret protection matters for a
              design-led company: the cited statute permits an owner of a trade secret used in interstate or foreign
              commerce to bring a civil action, but no public source in this pool confirms Celero's assignments,
              controls, or disputes.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
      - number: '7.3'
        title: Operational, partner, and financial dependencies
        blocks:
          - type: paragraph
            body: >-
              Celero's operating model depends on turning a complex DSP design into qualified silicon and then into
              customer deployments. CapitalG describes a 2nm tape-out and says the architecture scales from 1.6T to 3.2T
              and beyond, while Celero's own materials describe high-bandwidth, low-power optical connectivity and a
              distributed design footprint. Those statements support technical ambition, not manufacturing yield, cost,
              warranty performance, or delivery reliability. The partner and supply-chain questions are consequently
              central: which foundry, packaging, test, optical-module, and cloud or systems partners are qualified; how
              many alternatives exist; and what happens if a node, mask, package, or component is delayed? Public
              funding disclosures also do not equal cash available. The company announced $140 million through November
              2025, while the later CapitalG page describes a $275 million Series C; the pool does not provide terms,
              closing evidence, cash balance, burn, or valuation. Those unknowns increase financing and dilution risk.
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
      - number: '7.4'
        title: Mitigations, monitoring, and thesis breaks
        blocks:
          - type: paragraph
            body: >-
              The practical mitigation is a milestone-based underwriting plan rather than reliance on investor or
              company confidence. Before increasing exposure, request independent evidence of tape-out completion, wafer
              acceptance, production qualification, named design wins, shipment volume, gross margin, and
              customer-funded or partner-funded commitments. Monitor export classifications and licenses by destination
              and end use, foundry and packaging lead times, yield and return rates, cash runway, hiring by function,
              and concentration in any one customer or supplier. The thesis should break if the next planned silicon
              milestone slips materially, if qualification fails without a credible re-spin plan, if export approvals or
              customer deployments are blocked, or if financing requires a down round before commercial traction is
              demonstrated. Absence of a public breach, lawsuit, or outage in the assigned sources should remain an
              unresolved diligence question rather than a clean bill of health.
            claimRefs:
              - CR013
              - CR014
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Thesis-break trigger
            body: >-
              A material slip in qualified silicon, inability to secure compliant cross-border shipments, or financing
              that arrives before verifiable production traction would break the current scale-up thesis.
            calloutType: risk
            claimRefs:
              - CR013
              - CR014
          - type: callout
            title: Evidence limitation
            body: >-
              Public company, investor, statutory, and government materials establish context but do not independently
              verify Celero's yield, revenue, customer concentration, legal posture, or operational controls.
            calloutType: assumption
            claimRefs:
              - CR003
              - CR008
              - CR012
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment case and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The positive case is that Celero has moved from a funded technical thesis toward production readiness. The
              September 2026 financing announcement says the company raised $275 million in Series C, brought total
              capital to $415 million, and validated what it calls the industry's first 2nm coherent DSP silicon.
              CapitalG, which led the earlier Series B and co-led the Series C, describes a 1.6T-to-3.2T architecture
              and says the team taped out the silicon. These are credible signals of investor conviction and technical
              progress, but they are not customer revenue, shipment volume, gross margin, or independently verified
              design wins. The anti-thesis is therefore commercialization risk: a large round can fund a long
              tape-out-to-production cycle, while the public evidence does not establish adoption, pricing, yield, or a
              payback period for customers.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV006
              - CV010
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV011
              - CV013
      - number: '8.2'
        title: Financing context and price discipline
        blocks:
          - type: paragraph
            body: >-
              The financing record has strengthened materially since the prior disclosed round. Celero's November 2025
              release described a $100 million Series B and $140 million of cumulative funding; the September 2026
              announcement reports a $275 million Series C, $415 million cumulative capital, and a valuation above $3
              billion. The latter is the only current public valuation mark in the assigned evidence, and it is
              company-reported through a syndicated release rather than a term sheet or audited filing. It is not
              possible to calculate a revenue multiple, ARR multiple, dilution burden, liquidation preference, or
              investor return from the retained public text. Public semiconductor comparables show why scale and margin
              matter: an AInvest article describes Marvell as trading at roughly 31x sales and warns that a high-growth
              optical thesis depends on execution and supply-chain constraints, while a Trefis comparison shows
              Broadcom's much larger revenue and margin base. Those are contextual benchmarks, not direct Celero
              valuation comparables, so the appropriate discipline is to condition entry on verified revenue, margins,
              customer commitments, and financing terms.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
          - type: table
            tableRef: TV003
            claimRefs:
              - CV006
              - CV010
              - CV011
              - CV012
              - CV014
              - CV016
      - number: '8.3'
        title: Scenarios, recommendation, and diligence
        blocks:
          - type: paragraph
            body: >-
              A bull case requires the 2nm platform to convert into production shipments across the stated 1.6T-to-3.2T
              range, with repeatable yields, named or verifiable hyperscale design wins, and enough gross margin to
              justify the company-reported valuation. The base case is continued technical progress and additional
              financing while commercial proof remains private, which supports tracking rather than underwriting a
              return. The bear case is delayed qualification, weak yields, customer concentration, or an optical
              supply-chain bottleneck that shifts value to adjacent component suppliers; the independent AInvest review
              explicitly says the bottleneck may be EML lasers and indium-phosphide substrates rather than DSP design.
              Since no retained source supplies Celero revenue, ARR, margin, customer count, preference stack, or exit
              timing, the recommendation is research-more. The thesis breaks if management cannot provide production
              qualification, unit economics, customer commitments, and a clean capitalization schedule.
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV006
              - CV010
              - CV013
              - CV015
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Underwrite evidence, not the round headline
            body: >-
              The current public record supports technical and financing momentum, but not a revenue-based valuation
              model. Treat the above-$3B figure as a reported financing-context mark and keep the decision at
              research-more until operating and capitalization evidence is available.
            calloutType: recommendation
            claimRefs:
              - CV006
              - CV010
              - CV015
          - type: callout
            title: Semiconductor scale-up is the thesis break
            body: >-
              A delayed qualification, weak yield, constrained optical inputs, or customer concentration could consume
              the financing runway without proving commercial value.
            calloutType: risk
            claimRefs:
              - CV011
              - CV013
              - CV014
