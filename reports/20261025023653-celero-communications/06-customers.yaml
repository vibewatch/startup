      - ["No named account disclosed", "Optical module makers", "Prospective module integration and qualification", "Early-stage target; not verified as pilot or production", "No customer outcome disclosed", "No module partner, qualification status, or shipment evidence"]
      - ["No named account disclosed", "Production deployments", "AI accelerator cluster or cloud data-center connectivity", "No paid deployment verified", "No utilization, reliability, or economic outcome disclosed", "Investor, company, and Reuters sources do not identify a customer"]
    notes: "This is a partial audit of the assigned public corpus, not evidence that no private customers exist; ecosystem names and investor relationships are not counted as Celero customers."
    claimRefs: [CU001, CU004, CU010, CU011, CU012, CU016]
figures:
  - id: FU001
    title: Evidence-gated customer journey
    type: journey-map
    summary: >-
      Public evidence supports target-account definition and technical progress, while qualification,
      paid production, and expansion remain unverified.
    data:
      items:
        - stage: "1. Need definition"
          title: "AI interconnect requirement"
          label: "Bandwidth, reach, power, and cost constraints"
          touchpoints: ["Hyperscaler architects", "Module engineering teams", "Standards ecosystem"]
          detail: "Supported as target-market context; not Celero customer proof."
        - stage: "2. Technical engagement"
          title: "Requirements become DSP specifications"
          label: "Architecture and product evaluation"
          touchpoints: ["Engineering executives", "Network architects", "Celero product marketing"]
          detail: "The job posting explicitly describes this translation step."
        - stage: "3. Design win"
          title: "Anchor account selection"
          label: "Early-stage commercial target"
          touchpoints: ["Hyperscalers", "Optical module makers"]
          detail: "Celero seeks these wins, but no named win is disclosed."
        - stage: "4. Qualification"
          title: "Silicon, module, and system validation"
          label: "Unverified stage"
          touchpoints: ["Sampling", "Interoperability", "Reliability testing"]
          detail: "Tape-out is reported; customer qualification is not."
        - stage: "5. Paid production"
          title: "Volume deployment"
          label: "No public proof"
          touchpoints: ["Purchase orders", "Shipments", "Production utilization"]
          detail: "No named paid deployment, shipment volume, or outcome is disclosed."
        - stage: "6. Expansion"
          title: "Repeat platform adoption"
          label: "No public proof"
          touchpoints: ["Renewal", "Additional modules or sites", "Broader platform rollout"]
          detail: "Retention, repeat-order, expansion, and concentration metrics are absent."
    approximationNotes: "The sequence is an analytical diligence framework, not a reported Celero conversion funnel; no conversion rates are inferred."
    claimRefs: [CU013, CU014, CU015]
