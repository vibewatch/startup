callouts:
  - calloutType: strength
    title: Founder-market fit is unusually direct
    body: >-
      The two co-founders have prior senior operating and architecture experience across multiple
      coherent-DSP companies, reducing basic domain-learning risk.
    claimRefs: [CO004, CO005]
  - calloutType: risk
    title: Financing and validation are not commercial proof
    body: >-
      The assigned evidence does not disclose current revenue, customers, production shipments,
      cash balance, burn, or runway; the $415 million raised figure must not be treated as cash on hand.
    claimRefs: [CO008, CO012, CO014]
