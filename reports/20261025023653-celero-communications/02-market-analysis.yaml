slug: celero-communications
runDate: "2026-10-25"
company:
  name: Celero Communications
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Celero addresses a narrow coherent-DSP opportunity inside the much larger AI
    optical-connectivity stack. Independent market signals show strong demand, but public
    evidence does not isolate Celero's SAM, attainable share, pricing, or production timing,
    while PAM4, linear optics, co-packaged optics, standards choices, and supply constraints
    remain material adoption variables.
sections:
  - id: market-boundary
    title: Market boundary and substitutes
    body: >-
      Celero's defensible market boundary is much narrower than "AI data centers." The core
      category is coherent DSP silicon embedded in optical links used to connect accelerators,
      racks, buildings, and data centers. Celero and CapitalG describe data-center-specific
      coherent DSPs spanning AI accelerator clusters and cloud data-center connections;
      EquityZen similarly identifies data-center networks and AI acceleration clusters.
      Broader optical transport, complete transceivers, switches, fiber, and total AI
      infrastructure investment are demand context rather than Celero TAM. Status-quo and
      adjacent substitutes include copper for short reaches, PAM4 optics at established data
      rates, legacy telecom coherent for longer links, and emerging LPO, LRO, and CPO
      architectures that can reduce standalone DSP content. This boundary centers the analysis
      on DSP content where coherent performance is actually required.
    claimRefs: [CM001, CM002, CM003, CM004]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: Evidence-constrained sizing
    body: >-
      Public evidence supports several non-equivalent sizing lenses, not a clean TAM/SAM/SOM.
      A Celero-issued release cites nearly $7 trillion of global data-center investment through
      2030, including about $5.2 trillion for AI workloads, but those figures include compute,
      power, construction, and other spend far outside DSPs. Dell'Oro estimates reported by
      Converge Digest put 2026 optical-transport manufacturer revenue above $18 billion after a
      16% forecast increase, while an earlier Dell'Oro forecast reported by RCR Wireless put
      the market at $19 billion in 2029 on 5% annual growth. LightCounting provides the closest
      component lens: more than $2 billion of 1.6T chipset sales in 2026 and more than eight
      million coherent-DSP units by 2031. Different periods, products, and units make these
      contextual bounds, not additive layers.
    claimRefs: [CM005, CM006, CM007, CM008, CM009]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyers-and-adoption
    title: Buyers, users, and budget path
    body: >-
      The economic chain separates the immediate silicon buyer from the end payer. Optical
      module and system vendors are the likely direct DSP integrators; their product,
      engineering, and sourcing teams must qualify silicon into transceivers or platforms.
      Hyperscalers, cloud operators, and service providers ultimately fund deployments through
      network and data-center capital budgets, while network architects and cluster operators
      are the users most exposed to reach, power, bandwidth density, and reliability. Cisco
      reports that hyperscalers account for most coherent-pluggable deployments and that about
      350 service providers also deploy the optics. Public sources do not establish Celero's
      contracting model, module partners, budget ownership at named customers, or whether the
      company sells silicon directly to end operators.
    claimRefs: [CM010, CM011]
    tableRefs: [TM003]
  - id: drivers-and-constraints
    title: Growth drivers and adoption constraints
    body: >-
      Demand is supported by AI clusters spanning more accelerators and facilities, higher
      link rates, and greater data-center-interconnect traffic. Dell'Oro data reported by
      Converge Digest show direct DCI purchases growing an estimated 40% year over year in the
      first quarter of 2026. Adoption is not frictionless: supplier backlogs and longer lead
      times can cap near-term market growth; LightCounting expects linear-drive solutions to
      weigh on DSP sales in 2027-2031; and Cisco's roadmap discussion highlights costly
      2nm/3nm development and possible fragmentation among 1600ZR, 1600ZR+, and coherent-lite.
      Celero reports validated 2nm silicon and a 1.6T-to-3.2T path, but its financing is still
      directed partly to production readiness. Without disclosed volume shipments, design wins,
      ASPs, or qualification schedules, adoption timing and obtainable share remain unverified.
    claimRefs: [CM006, CM012, CM013, CM014, CM015, CM016]
tables:
  - id: TM001
    title: Market definition and substitution boundary
    columns:
      - Segment or category
      - Included spend
      - Excluded spend
      - Buyer or payer
      - Relevance to Celero
    rows:
      - - Data-center coherent DSP silicon
        - DSP content embedded in optical interconnects for AI clusters and data-center links
        - Complete transceiver, switch, fiber plant, compute, and facility spend
        - Optical module or system vendor; cloud or hyperscaler as end payer
        - Core served category described by Celero and its investor
      - - ZR/ZR+ and coherent-lite applications
        - Coherent DSP content for pluggable or short-reach coherent links
        - Transport chassis, embedded long-haul modem, and unrelated optical components
        - Hyperscaler, service provider, module vendor, and system vendor
        - Adjacent application set as standards move toward 1.6T
      - - Broader optical transport
        - None treated as direct Celero TAM; used only as a demand proxy
        - WDM systems, line systems, non-DSP modules, installation, and services
        - Cloud provider and telecom operator capital budgets
        - Upper-context market, not addressable semiconductor revenue
      - - Status quo and substitutes
        - No included Celero spend
        - Copper, PAM4, legacy coherent, LPO, LRO, CPO, and internal alternatives
        - Network architect, platform owner, and procurement organization
        - Competes for reach, power, bandwidth, qualification, and cost
    notes: >-
      Boundary is analytical rather than publisher-defined; broader optical and infrastructure
      figures are excluded from direct TAM, and buyer roles are inferred from the component
      supply chain because Celero has not disclosed its contracting model.
    claimRefs: [CM001, CM002, CM003, CM004, CM010, CM013]
