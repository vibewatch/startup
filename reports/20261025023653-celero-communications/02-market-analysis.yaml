    claimRefs: [CM005, CM006, CM008, CM009, CM015]
callouts:
  - calloutType: insight
    title: Demand evidence is stronger than addressability evidence
    body: >-
      Independent forecasts support expanding AI-related optical and high-speed chipset demand,
      but no retained source isolates Celero's serviceable revenue pool or attainable share.
    claimRefs: [CM006, CM007, CM008, CM009]
  - calloutType: risk
    title: DSP content is not guaranteed
    body: >-
      Linear optics, co-packaged optics, standards fragmentation, qualification cost, and supply
      constraints can delay adoption or shift value away from a standalone coherent DSP vendor.
    claimRefs: [CM012, CM013, CM014]
