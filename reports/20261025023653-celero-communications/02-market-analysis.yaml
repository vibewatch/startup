        - Nearly $7T investment
        - Through 2030
        - Secondary citation in a company-issued financing release
        - Low for TAM; includes extensive non-optical and non-DSP spend
      - - McKinsey estimate cited by Celero, 2026 release
        - AI-workload data-center investment
        - Approximately $5.2T
        - Through 2030
        - Secondary citation in a company-issued financing release
        - Low for SAM; does not isolate connectivity or DSP content
      - - Dell'Oro reported by Converge Digest, 2026
        - Optical transport manufacturer revenue
        - More than $18B
        - 2026 forecast; 16% growth
        - Analyst forecast summarized by a trade publication
        - Medium for sector demand; much broader than coherent DSPs
      - - Dell'Oro reported by RCR Wireless, 2025
        - Optical transport market
        - $19B
        - 2029 forecast; 5% annual growth over five years
        - Analyst forecast summarized by a trade publication
        - Medium; different forecast vintage and horizon from the 2026 update
      - - LightCounting, 2026
        - Global 1.6T chipsets
        - More than $2B in sales
        - 2026 forecast; rapid growth through 2029
        - Derived from optical-transceiver and active-cable forecasts
        - Medium; includes chipset categories beyond Celero's disclosed scope
