    notes: >-
      Values preserve each publisher's metric, period, and unit; rows are contextual sizing
      lenses and must not be summed or presented as a nested TAM/SAM/SOM.
    claimRefs: [CM005, CM006, CM007, CM008, CM009]
  - id: TM003
    title: Segment and buyer map
    columns:
      - Segment
      - Buyer
      - User
      - Payer or budget owner
      - Workflow
      - Adoption trigger
    rows:
      - - Hyperscale AI clusters
        - Optical, network, and platform engineering
        - Cluster and network operations
        - Cloud infrastructure capital procurement
        - Qualify high-speed links for scale-up, scale-out, or scale-across fabrics
        - PAM4 reach, power, or fiber-efficiency limits at 1.6T and above
      - - Service-provider DCI
        - Transport architecture and sourcing
        - Network operations
        - Operator network capital budget
        - Deploy ZR/ZR+ pluggables or transport systems between data centers
        - Capacity growth, reach, and transition to 800ZR or 1600ZR
      - - Optical module vendors
        - Product management, silicon engineering, and sourcing
        - Transceiver design and manufacturing teams
        - Module bill of materials and R&D budget
        - Integrate and qualify a DSP within a module road map
        - Competitive power, cost, yield, and standards compliance
      - - Switch and system vendors
        - Platform architecture and optics teams
        - System qualification and support organizations
        - Platform engineering and procurement
        - Co-qualify silicon, optics, switch systems, and software
        - Reliability requirements and platform-level differentiation
    notes: >-
      Segment roles combine publisher-reported deployment patterns with supply-chain inference;
      Celero-specific buyers, payers, pricing authority, and procurement stages remain private.
    claimRefs: [CM010, CM011, CM012, CM014]
