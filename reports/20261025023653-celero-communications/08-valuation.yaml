callouts:
  - calloutType: recommendation
    title: Underwrite evidence, not the round headline
    body: "The current public record supports technical and financing momentum, but not a revenue-based valuation model. Treat the above-$3B figure as a reported financing-context mark and keep the decision at research-more until operating and capitalization evidence is available."
    claimRefs: [CV006, CV010, CV015]
  - calloutType: risk
    title: Semiconductor scale-up is the thesis break
    body: "A delayed qualification, weak yield, constrained optical inputs, or customer concentration could consume the financing runway without proving commercial value."
    claimRefs: [CV011, CV013, CV014]
