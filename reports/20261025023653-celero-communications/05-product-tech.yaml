      - [Optical module and coherent link, "Modulates and transports data over fiber between racks, campuses, or data centers", "Optical components, modulation scheme, fiber plant, and interoperability", "Reach, BER, thermal behavior, and cost may vary by deployment"]
      - [Management and security plane, "Configures modules, diagnostics, firmware, and potentially data-path security", "CMIS/C-CMIS, link-training, MACsec, and operator tooling", "Standards and implementation are evolving; Celero controls are undisclosed"]
    notes: "This is an evidence-bounded functional architecture synthesized from Celero, CapitalG, SiliconANGLE, and OIF descriptions; it does not assert undocumented internal components."
    claimRefs: [CE005, CE007, CE008, CE011, CE012, CE013]

