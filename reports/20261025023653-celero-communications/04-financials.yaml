callouts:
  - calloutType: strength
    title: Capital supports execution runway, not proof of scale
    body: The reported Series C and cumulative financing provide resources for R&D and production readiness, but the absence of cash, burn, and shipment data prevents a liquidity or revenue conclusion.
    claimRefs: [CI009, CI010, CI012]
  - calloutType: risk
    title: The underwriting gap is commercial conversion
    body: Validated silicon and investor conviction do not establish paid design wins, production yield, realized pricing, gross margin, or customer concentration.
    claimRefs: [CI003, CI006, CI014, CI015]
  - calloutType: recommendation
    title: Make the next diligence step financial and contractual
    body: Request management financials, current cash and burn, costed unit economics, signed customer commitments, and qualification-to-volume milestones before underwriting the reported valuation.
    claimRefs: [CI014, CI015, CI016]
