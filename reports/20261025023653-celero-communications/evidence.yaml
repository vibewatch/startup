evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: operating-scale
    missingEvidence: >-
      Current revenue or ARR, named customers, production shipments, 2026 headcount, gross margin, cash balance, burn,
      and runway.
    whyItMatters: >-
      These metrics determine whether technical validation and financing have converted into commercial traction and
      sufficient operating runway.
    diligencePath: >-
      Obtain management accounts, bank statements, monthly burn schedules, payroll roster, backlog, shipment records,
      and direct customer references.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: governance
    missingEvidence: >-
      Complete executive roster, board register, committee structure, voting rights, succession plan, and current
      capitalization documents.
    whyItMatters: >-
      Publicly named investor directors do not establish control, protective provisions, founder dependence, or
      governance effectiveness.
    diligencePath: >-
      Review the charter, bylaws, voting agreements, board minutes, option ledger, cap table, investor rights agreement,
      and succession materials.
    relatedQuestionRefs:
      - QO003
      - QO009
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: minor
    topic: funding
    missingEvidence: Reconciled closing statement confirming whether cumulative financing proceeds are $413 million or $415 million.
    whyItMatters: >-
      The discrepancy is small relative to the round but signals that database summaries should not be used as
      authoritative capitalization records.
    diligencePath: Reconcile wire receipts and closing documents for the seed, Series A, Series B, and Series C rounds.
    relatedQuestionRefs:
      - QO004
      - QO008
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: market-sizing
    missingEvidence: >-
      Celero-specific DSP ASPs, qualified design pipeline, production volumes, customer commitments, share assumptions,
      and a bottom-up SAM/SOM model.
    whyItMatters: >-
      Broad infrastructure and optical-market forecasts cannot establish the revenue pool Celero can actually serve or
      the share it can obtain.
    diligencePath: >-
      Obtain management's customer-by-program pipeline, unit and ASP bridge, qualification milestones, probability
      weights, and board-approved revenue plan; reconcile them to module-vendor and end-customer procurement forecasts.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-segmentation
    missingEvidence: >-
      Named design wins, direct customer references, contracting counterparties, procurement owners, qualification
      gates, and budget timing for Celero deployments.
    whyItMatters: >-
      Industry-level deployment patterns do not prove that Celero has reached the relevant buyers or secured a funded
      route into production.
    diligencePath: >-
      Conduct reference calls with module partners and end operators, review design-win and purchase-order
      documentation, and map each program's technical and commercial approvers.
    relatedQuestionRefs:
      - QM010
    relatedTableRefs:
      - TM003
  - type: access-blocked
    severity: minor
    topic: competitor-market-evidence
    missingEvidence: >-
      Substantive text from Broadcom's assigned OFC 2026 product-release page; the prefetched output contained only
      cookie and privacy controls.
    whyItMatters: >-
      The source could provide a current competitor view of AI optical architectures, but its retrieved text cannot
      support a claim or quotation.
    diligencePath: >-
      In a later authorized research run, retrieve an accessible Broadcom release, transcript, or technical publication
      covering the same OFC 2026 announcements.
  - type: private-evidence-only
    severity: material
    topic: commercial-traction
    missingEvidence: >-
      Customer-backed design wins, production shipments, realized pricing, and gross-margin evidence for Celero's
      coherent DSPs.
    whyItMatters: >-
      Without commercial denominators, technical differentiation cannot be converted into an assessed share,
      pricing-power, or moat conclusion.
    diligencePath: >-
      Request a customer-reference list, qualification milestones, unit economics, and shipment or backlog evidence
      under confidentiality.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP002
      - TP003
  - type: missing-source
    severity: material
    topic: competitor-comparison
    missingEvidence: >-
      Comparable power, reach, bit-error-rate, bill-of-materials, and price data across Celero, PAM4, coherent, and CPO
      alternatives.
    whyItMatters: >-
      Public sources use different architectures and issuer-defined claims, so ordinal positioning may not predict buyer
      selection.
    diligencePath: >-
      Obtain independent lab benchmarks and module-level quotes for the same link distance, bandwidth, and deployment
      configuration.
    relatedQuestionRefs:
      - QP002
      - QP004
    relatedTableRefs:
      - TP002
  - type: enumeration-incomplete
    severity: minor
    topic: landscape
    missingEvidence: >-
      A complete current roster of likely entrants, internal silicon programs, and module vendors committing to each
      1.6T architecture.
    whyItMatters: The assigned pool identifies material alternatives but cannot establish exhaustive coverage or market shares.
    diligencePath: Refresh against module-vendor announcements, hyperscaler procurement evidence, and current analyst databases.
    relatedQuestionRefs:
      - QP001
      - QP003
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: blocking
    topic: pricing-gap
    missingEvidence: Executed customer contracts, price lists, realized ASP, rebates, and licensing terms.
