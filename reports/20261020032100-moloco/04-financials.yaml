      - [Moloco Ads entry budget, "Most campaigns begin with an experiment; minimum $300 daily budget", "A public customer-spend entry point", "Average customer spend, CAC, contract value, or Moloco revenue"]
      - [Moloco Ads commercial framing, "Performance-based campaign pricing", "Commercial alignment to measurable advertiser outcomes", "Guaranteed outcomes, realized price, refund or make-good terms, or margin"]
      - [Moloco Commerce Media, "Structured around each retailer or marketplace", "Enterprise-specific contracting rather than a public list price", "Platform fee, revenue share, minimum commitment, discounting, or implementation economics"]
    notes: "Terms are company-published list or model descriptions, not invoices or realized pricing; no discounts, rebates, or customer-level economics were available."
    claimRefs: [CI002, CI003, CI004, CI005, CI006]
  - id: TI003
    title: Unit-economics and capital-adequacy scorecard
    columns: [Metric, Public value or proxy, Confidence, Why it matters, Diligence ask]
    rows:
      - [Current annual revenue and growth, null, Low, "Required to size the business and test whether public activity proxies convert into recognized revenue", "Audited 2024-2025 statements, 2026 year-to-date results, revenue by product and geography, and constant-currency growth"]
      - [Gross margin and serving cost, null, Low, "A trillion-scale auction and ML workload may create material cloud and data costs", "Gross margin by product; media cost, cloud cost, data cost, support cost, and serving cost per auction or impression"]
      - ["CAC, payback, and sales efficiency", null, Low, "Enterprise expansion selling can support retention but may require expensive coverage", "New-logo and expansion CAC, fully loaded sales expense, sales cycle, quota attainment, and CAC payback by product"]
      - [Commerce-media customer monetization, "4.0% ad-revenue uplift across several partner-reported rollouts", Medium, "Shows potential customer value but not Moloco contract economics", "Customer-level baseline, sample size, duration, attribution method, fee paid to Moloco, and net retention"]
      - [Platform efficiency, "~10x capacity and up to ~25% lower p95 latency in partner-reported migration evidence", Medium, "May improve unit cost and reliability, but dollar savings are undisclosed", "Before-and-after cloud spend, compute utilization, cost per request, and gross-margin bridge"]
      - ["Cash, burn, runway, debt, and working capital", null, Low, "Determines financing dependency and downside resilience", "Current cash and restricted cash, monthly free-cash-flow burn, debt and leases, receivables aging, commitments, and downside runway"]
    notes: "Null means unavailable in the assigned prefetched evidence, not zero; partner and company operating proxies are not substitutes for audited company financials."
    claimRefs: [CI009, CI010, CI011, CI013, CI016]
