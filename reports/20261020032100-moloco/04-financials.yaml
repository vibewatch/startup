chapter:
  number: 4
  title: Financials
  summary: Moloco discloses credible monetization mechanics and several operating proxies, including oCPM pricing, a $300 minimum daily experiment budget, expansion-oriented enterprise selling, and partner-reported retail-media gains. However, the retained evidence does not disclose current audited revenue, gross margin, cash, burn, runway, take rate, or customer concentration, so revenue quality and capital adequacy remain ununderwritable.
sections:
  - id: revenue-architecture
    title: Revenue architecture and price formation
    body: >-
      Moloco presents three commercial product lines: performance user acquisition through Moloco Ads, retailer and marketplace monetization through Moloco Commerce Media, and streaming monetization. For Ads, the clearest public price mechanic is optimized CPM: impression prices vary with expected user quality and auction competition while campaigns optimize toward CPA or ROAS. Moloco says most campaigns start as experiments with at least a $300 daily budget, but that entry budget is customer ad spend, not Moloco revenue. Commerce Media pricing is not standardized publicly; Moloco says it is structured around each retailer or marketplace. The result is a plausible transaction- and contract-linked model, but neither realized take rate nor revenue recognition is disclosed.
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI006]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: traction-and-revenue-quality
    title: Traction and revenue-quality proxies
    body: >-
      Public traction is stronger at the activity and customer-outcome layers than at the company-financial layer. A Moloco-issued study says 88% of mobile app marketing budgets remained concentrated with Google and Meta in 2024 and reports up to 214% higher Day-30 ROAS for diversified marketers; these figures describe market structure and advertiser outcomes, not Moloco revenue. In commerce media, Moloco says a majority of 24 active platforms at least doubled advertising-revenue-to-GMV between their first and latest four-week periods. Google Cloud separately reports a 4.0% ad-revenue uplift across several Vector Search rollouts. These metrics support product utility, but attribution conventions, cohort selection, contract economics, and Moloco's share of customer value remain undisclosed.
    claimRefs: [CI007, CI008, CI009, CI012]
  - id: gtm-and-cost-structure
    title: GTM motion and cost structure
    body: >-
      The public GTM evidence points to land-and-expand enterprise selling rather than a purely self-serve funnel. A Moloco-authored Growth Director posting assigns responsibility for portfolio revenue expansion, upsell, cross-sell, executive relationships, and complex multi-product negotiations. That model can deepen accounts but likely carries material sales and customer-success       cost. Infrastructure is another important cost driver: Google Cloud describes TPU, GPU, CPU,
      and managed Vector Search dependencies. Partner-reported improvements of roughly 10x capacity
      and up to roughly 25% lower p95 latency indicate efficiency progress, but no cloud spend,
      serving cost per auction, CAC, payback, or contribution margin is public.
    claimRefs: [CI010, CI011, CI013]
    tableRefs: [TI003]
  - id: capital-adequacy-and-verdict
    title: Capital adequacy and financial verdict
    body: >-
      Capital adequacy cannot be assessed from the assigned evidence. The newsroom and third-party profile leads do not provide a current cash balance, monthly burn, runway, debt schedule, working-capital profile, or planned use of funds. Funding raised historically must not be treated as cash available today. A low-reputation aggregator reports approximately $300 million of revenue in 2023 and around $200 million in 2024, but the assigned pool contains no primary financial statement corroborating either estimate; the apparent decline is therefore a diligence signal, not an accepted trend. The financial verdict is consequently mixed: monetization mechanics and operating leverage proxies are visible, while revenue quality, gross-margin path, cash generation, and financing dependency remain material blockers.
    claimRefs: [CI016]
