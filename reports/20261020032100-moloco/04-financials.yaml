callouts:
  - calloutType: risk
    title: Public operating scale is not an income statement
    body: Customer budgets, advertiser ROAS, customer ad-revenue uplift, auction volume, and infrastructure throughput all use different denominators. None should be converted into Moloco revenue, ARR, gross margin, cash flow, or cash available without company financial records.
    claimRefs: [CI003, CI008, CI009, CI010, CI011, CI012]
  - calloutType: recommendation
    title: Make financial data-room access a gating item
    body: Require audited statements, product-level revenue and gross margin, cohort retention, customer concentration, cloud cost, working capital, cash, debt, burn, and runway before assigning a high-confidence valuation or financing view.
    claimRefs: [CI006, CI013, CI016]
