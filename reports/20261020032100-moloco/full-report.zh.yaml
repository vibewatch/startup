        - label: 第三年商业变现
          value: '>3% A2G'
          detail: 表现最强的符合条件零售商在三年内超过这一门槛。
    approximationNotes: 各层的单位、样本和时间口径不同，不得将其解读为转化漏斗或 TAM/SAM/SOM。数值均按公司发布的证据复现。
    claimRefs:
      - CM002
      - CM003
      - CM009
      - CM010
      - CM011
      - CM012
  - id: FP001
    title: 买方控制力与实施负担
    type: quadrant
    summary: 分析师用序数定位区分一站式媒体采买与集成式商业媒体基础设施；这不是业绩排名，也不是独立基准。
    data:
      xAxis:
        label: 买方对数据和工作流的控制力
        min: 1
        max: 5
      yAxis:
        label: 实施负担
        min: 1
        max: 5
      points:
        - label: 围墙花园媒体采买
          x: 2
          'y': 1
          detail: 一站式原型；未保留针对具体竞争者的实施证据。
        - label: Moloco Ads
          x: 3
          'y': 2
          detail: 定位为 Google 和 Meta 之外的增量渠道托管效果产品。
        - label: 独立 DSP 类别
          x: 4
          'y': 2
          detail: 仅为原型；没有具名供应商的功能和定价证据可用。
        - label: MCM 独立管理器
          x: 3
          'y': 3
          detail: 可直接使用的活动管理器，接入零售商第一方数据。
        - label: MCM 小组件或 API
          x: 5
          'y': 4
          detail: 嵌入式或定制工作流，可配置竞价机制和活动管理。
        - label: 零售商内部构建
          x: 5
          'y': 5
          detail: 根据平台原本需要自行组装的能力推断出的结构性替代方案。
    approximationNotes: 分数是分析师仅依据可见控制力和部署选择作出的 1–5 序数判断；不衡量供应商质量、价格、市场份额或结果。
    claimRefs:
      - CP006
      - CP016
  - id: FI001
    title: Moloco Ads 收入模型桥接
    type: flow
    summary: 公开证据解释了广告主活动如何进入平台并接受优化，但从广告总支出到 Moloco 净收入和毛利润的转换尚未披露。
    data:
      nodes:
        - id: advertiser-budget
          label: 广告主预算
          value: Most experiments start at a minimum $300 daily budget
          note: 客户广告支出，不是 Moloco 的收入
        - id: campaign-objective
          label: 结果目标
          value: CPA or ROAS
          note: 广告主定义的绩效目标
        - id: auction-price
          label: 竞价价格
          value: Optimized CPM
          note: 动态展示价格
        - id: media-delivery
          label: 媒体交付
          value: Independent-app and CTV inventory
          note: 规模和结算价格未披露
        - id: measured-outcome
          label: 可测量的客户结果
          value: Conversions, attributed revenue, or ROAS
          note: 归因框架不尽相同
        - id: moloco-economics
          label: Moloco 经济模型
          value: Undisclosed
          note: 抽成率、净收入、服务成本和毛利润仍需尽调确认
    approximationNotes: 仅为概念流程，不是量化瀑布图，也不推断收入、抽成率、转化率或毛利润。
    claimRefs:
      - CI002
      - CI003
      - CI005
      - CI006
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 各层均有证据支撑：从客户信号开始，经模型协调、竞价决策和激活接口，最终落到可测量结果。
    data:
      layers:
        - label: 客户信号层
          modules:
            - 第一方用户事件
            - 搜索和商品浏览行为
            - 购买和转化结果
        - label: 数据与训练层
          modules:
            - 实时行为日志接入
            - 数据预处理
            - 持续训练和部署模型
        - label: 复合智能层
          modules:
            - CARA 模型协调
            - 专用广告软件
            - 客户实例训练与推理
        - label: 在线决策层
          modules:
            - 相关性预测
            - CTR 和 CVR 预测
            - 实时竞价和智能出价
        - label: 激活层
          modules:
            - Moloco Ads
            - Commerce Media 广告格式
            - 活动界面、小组件、API 和 SDK 接入
        - label: 客户结果层
          outputs:
            - 用户获取与留存目标
            - 零售媒体广告主表现
            - 出版商与平台变现
    approximationNotes: 这是对保留文档的功能性综合，不代表对未披露的服务边界、确切数据流或物理基础设施作出主张。
    claimRefs:
      - CE005
      - CE009
      - CE013
      - CE014
      - CE016
  - id: FU001
    title: 客户采用与扩张路径
    type: journey-map
    summary: 有证据支撑的路径从切入细分市场、定义结果开始，经过部署、优化和相邻产品扩张，最终由代理商推动规模化。
    data:
      nodes:
        - id: segment-entry
          label: 选择细分市场
          title: Choose segment
          detail: 移动广告主、游戏出版商、零售商或平台，或由代理商主导的企业账户
          touchpoints:
            - Moloco Ads
            - Moloco Commerce Media
        - id: outcome-design
          label: 定义可衡量结果
          title: Define measurable outcome
          detail: ROAS、LTV、再互动、供应商活动表现或零售媒体变现
          touchpoints:
            - Growth team
            - Retail-media leader
        - id: initial-deployment
          label: 试点或上线
          title: Pilot or launch
          detail: 初始 POC、CTV alpha 测试、活动上线或赞助广告部署
          touchpoints:
            - Wayfair POC
            - PMG alpha test
        - id: production-optimization
          label: 在生产环境优化
          title: Optimize in production
          detail: 使用活动数据和第一方信号改善获客、个性化或变现
          touchpoints:
            - Supplier campaigns
            - Publisher inventory
        - id: adjacent-expansion
          label: 增加相邻产品
          title: Add an adjacent product
          detail: 从移动扩展到 CTV，或将用户获取与 Moloco SDK 结合
          touchpoints:
            - Performance CTV
            - SDK monetization
        - id: channel-scaling
          label: 通过合作伙伴扩大规模
          title: Scale through partners
          detail: 代理商联合销售、多产品账户扩张和地域扩张
          touchpoints:
            - Agency partner program
            - Enterprise QBRs
    approximationNotes: 该有序路径综合了已披露的商业动作；不代表每个客户都会走完所有阶段，也不代表各阶段之间的转化率已知。
    claimRefs:
      - CU001
      - CU002
      - CU008
      - CU010
      - CU012
  - id: FR001
    title: 受证据边界约束的剩余风险热力图
    type: matrix
    summary: 高影响风险集中在隐私、测量有效性、运营韧性和未量化依赖上；缺少一级证据时，发生可能性仍只是暂定判断。
    data:
      columns:
        - id: likelihood
          label: 可能性
          detail: 受证据边界限制的概率评估
        - id: impact
          label: 影响
          detail: 对运营或投资论点的潜在影响
        - id: mitigation
          label: 缓释成熟度
          detail: 有公开证据支持的控制措施成熟度
      rows:
        - id: privacy
          label: 隐私与跨境数据治理
          values:
            - 中
            - 高
            - 部分
        - id: measurement
          label: 归因与增量有效性
          values:
            - 中
            - 高
            - 部分
        - id: resilience
          label: 平台与数据管道韧性
          values:
            - 中
            - 高
            - 未验证
        - id: dependencies
          label: 交易所、SDK 与云依赖
          values:
            - Unknown
            - 高
            - 未验证
        - id: concentration
          label: 客户集中度
          values:
            - Unknown
            - 中到高
            - 未验证
        - id: financial
          label: 财务与估值不透明
          values:
            - 中
            - 高
            - 未验证
    approximationNotes: 仅为定性矩阵；没有事件频率、损失分布、客户集中度或经审计的财务分母，因此不得将这些单元格解读为量化概率。
    claimRefs:
      - CR001
      - CR004
      - CR006
      - CR007
      - CR010
      - CR011
      - CR013
      - CR016
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 运营证据支持继续尽调，但财务和交易证据缺失，尚无法作出对价格敏感的投资决策。
    data:
      nodes:
        - id: operating-scale
          label: 运营规模
          detail: 公司报告覆盖 290 万个独立应用
        - id: product-breadth
          label: 产品广度
          detail: 效果广告、商业媒体和出版商变现
        - id: technical-proof
          label: 技术证明
          detail: 合作伙伴报告的容量提升和变现改善
        - id: financial-gap
          label: 财务缺口
          detail: 没有当前经审计的收入、利润率、现金流或留存证据
        - id: transaction-gap
          label: 交易缺口
          detail: 没有当前入场价格、股权结构表、优先股堆叠或一级融资条款
        - id: decision
          label: 继续研究 / 跟踪
          detail: 只有在私有尽调支持价格和目标回报后才推进
    approximationNotes: 有序决策逻辑图，不是按概率加权或按价值比例绘制。
    claimRefs:
      - CV004
      - CV005
      - CV013
      - CV016
