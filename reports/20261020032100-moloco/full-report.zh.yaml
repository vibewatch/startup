            title: 公开运营规模不是利润表
            body: 客户预算、广告主 ROAS、客户广告收入提升、竞价量和基础设施吞吐量使用的分母各不相同。没有公司财务记录，就不能把它们换算成 Moloco 收入、ARR、毛利率、现金流或可用现金。
