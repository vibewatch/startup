        - date: '2021'
          label: 列示 $150 million C 轮融资
          detail: 公司新闻稿列出由 Tiger Global 领投的 C 轮融资；留存的第三方简介提供了 2021 年日期。
          tone: positive
          claimRefs:
            - CO014
        - date: '2023'
          label: 报道称发生二级交易
          detail: 一个低信誉第三方来源称，Fidelity 和 EDBI 以超过 $2.0 billion 的估值买入，未注入新的一级资本。
          tone: warning
          claimRefs:
            - CO015
        - date: '2025-10-17'
          label: Google Cloud 实施案例
          detail: Google Cloud 发布了合作伙伴报告的 Moloco Commerce Media 向量搜索迁移结果，包括容量、延迟和变现指标。
          tone: positive
          claimRefs:
            - CO010
        - date: 2026-02
          label: 测量地理交付范围
          detail: Moloco 报告称，2 月期间在超过 230 个国家和地区交付了展示量。
          tone: positive
          claimRefs:
            - CO008
        - period: 2026-01 to 2026-03
          label: 测量 CARA 机会量
          detail: Moloco 根据抽样基础设施数据估算，平均每天广告机会超过 1 万亿次。
          tone: neutral
          claimRefs:
            - CO009
        - period: 2026-03 to 2026-04
          label: 测量广告触达与库存
          detail: 内部估算显示，潜在日触达人数超过 20 亿，应用包库存超过 2.9 million 个。
          tone: positive
          claimRefs:
            - CO006
            - CO007
