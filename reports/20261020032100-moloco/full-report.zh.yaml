      - number: '8.4'
        title: 情景、退出准备度与论点失效触发条件
        blocks:
          - type: paragraph
            body: >-
              由于估值所需的共同分母缺失，乐观、基准和悲观情景只能停留在定性判断。乐观情景要求独立核验的增长、持久留存、有吸引力的贡献利润率和持续的产品扩张；基准情景假设平台健康，但旧的二级参考无法确定今天的价格；悲观情景则由留存疲弱、利润率压缩、基础设施昂贵、不利监管，或优先股堆叠吞噬普通股价值触发。今天没有任何情景支持数字区间。退出准备度同样未经证明：分配到的证据池没有
              S-1、经审计报表、当前承销商证据或已披露的收购基准。只有在尽调确认财务质量、且要约价格在稀释后仍支持目标回报时，决策才会转向投资；如果客户集中度、现金转化、治理或下行优先权条款无法通过审查，决策就转为放弃。
            claimRefs:
              - CV002
              - CV003
