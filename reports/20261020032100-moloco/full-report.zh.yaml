        title: 资本、利益相关者与里程碑
        blocks:
          - type: paragraph
            body: >-
              资本证据具有历史性且并不完整。Moloco 新闻中心列出由 Tiger Global 领投的 1.5 亿美元 Series C 轮；一份低信誉第三方资料称，2023 年二级交易以超过 20 亿美元的估值让
              Fidelity 和 EDBI 进入股权结构表，但没有新增一级资本。该二级估值不是公司可用现金，也不是当前融资标记。产品与渠道里程碑延续到 2025 和 2026 年，包括 Google Cloud
              实施案例，以及拥有十多家创始合作伙伴的代理商项目。没有任何分配到的来源能确认当前累计融资、债务、现金、经审计收入、IPO 准备度、持股比例、投资人权利或完整董事会名单。
