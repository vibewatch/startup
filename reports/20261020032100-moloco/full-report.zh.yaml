        title: 资本充足性与财务结论
        blocks:
          - type: paragraph
            body: >-
              无法根据分配到的证据评估资本充足性。新闻中心和第三方资料没有提供当前现金余额、月度烧钱、资金可支撑时间、债务计划、营运资金状况或资金用途。历史募资不能视为今天可用的现金。一家低信誉聚合网站报告 2023 年收入约
              3 亿美元、2024 年约 2
              亿美元，但分配到的证据池没有一手财务报表支持任一估计；因此，表面上的下滑只是尽调信号，不是已接受的趋势。财务结论因而是混合的：变现机制和运营杠杆代理指标可见，但收入质量、毛利率路径、现金生成和融资依赖仍是重大阻碍。
            claimRefs:
