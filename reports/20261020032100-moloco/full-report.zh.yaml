chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              Moloco 于 2013 年由机器学习工程师创立，目前仍是一家总部位于 Menlo Park 的私营公司。它的定位比泛泛的广告软件更窄：公司将自己描述为面向开放互联网的 AI
              原生效果广告服务商。商业模式有两条清晰主线：Moloco Ads 在独立 App 库存上销售以结果为导向的获客与再营销；Moloco Commerce Media
              则帮助零售商和平台利用第一方数据搭建赞助广告业务。这让 Moloco 同时接触广告主获客预算和平台变现预算，但公开来源没有披露分部收入或合同经济性。
            claimRefs:
              - CO001
              - CO002
              - CO004
              - CO005
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO006
              - CO007
              - CO008
              - CO016
      - number: '1.2'
        title: 运营规模与证明
        blocks:
          - type: paragraph
            body: >-
              Moloco 当前最有力的规模证据来自运营而非财务。公司页面估算，Moloco Ads 每日潜在触达人数超过 20 亿，库存覆盖超过 2.9 million 个应用包，服务超过 230 个国家和地区，每日评估超过
              1 万亿个广告机会。这些是公司内部估算，并带有明确测量窗口，不是经审计的客户、收入或盈利数据。Google Cloud 的合作伙伴案例补充了外部技术背景：Vector Search 迁移后，容量提升约十倍，p95
              延迟最高降低约 25%，变现提升 4%。但发布方是技术合作伙伴，这些结果可作为实施证据，不能视为公司整体的独立验证。
            claimRefs:
              - CO003
              - CO006
              - CO007
              - CO008
              - CO009
              - CO010
      - number: '1.3'
        title: 领导层与治理
        blocks:
          - type: paragraph
            body: >-
              现有证据支持“创始人主导”的叙事，但不足以还原完整治理图谱。一份低信誉第三方资料将 Ikkjin Ahn、David Sehyuk Park 和 Donghwan Jeon
              列为联合创始人及现任高管；官方公司页面只能确认公司由机器学习工程师创立，无法确认完整的具名名单。Moloco 当前公告称 Sunil Rayan
              为首席商务官，新闻中心还列出多项高管与董事会任命，但底层细节不足以还原任期、委员会职责、股权或继任规划。创始人持续掌舵可能有利于保持技术聚焦，也带来了尚未解决的关键人物与治理尽调要求。
            claimRefs:
              - CO001
              - CO012
              - CO013
              - CO016
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO012
              - CO013
              - CO016
