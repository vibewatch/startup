      - number: '4.2'
        title: 牵引力与收入质量代理指标
        blocks:
          - type: paragraph
            body: >-
              公开牵引力在活动量和客户结果上强于公司财务表现。一项 Moloco 发布的研究称，2024 年移动 App 营销预算中 88% 仍集中在 Google 和 Meta，并报告多元化投放者的 Day-30 ROAS
              最高高出 214%；这些数字描述的是市场结构和广告主结果，不是 Moloco 收入。在商业媒体中，Moloco 称 24 个活跃平台中的多数，其广告收入占 GMV 比例至少从最初四周到最近四周翻倍。Google
              Cloud 另行报告，多次 Vector Search 上线带来 4.0% 的广告收入提升。这些指标支持产品效用，但归因口径、队列选择、合同经济性和 Moloco 分享的客户价值仍未披露。
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI012
      - number: '4.3'
        title: GTM 动作与成本结构
        blocks:
          - type: paragraph
            body: >-
              公开 GTM 证据指向“落地扩张”式企业销售，而不是纯自助式漏斗。一则 Moloco 撰写的增长总监
              招聘信息将组合收入扩张、增购、交叉销售、高管关系和复杂多产品谈判列为职责。这种模式可以加深客户账户，但很可能带来较高的销售和客户成功成本。基础设施是另一项重要成本驱动因素：Google Cloud 描述了对
              TPU、GPU、CPU 和托管 Vector Search 的依赖。合作伙伴报告的容量约提升 10 倍、p95 延迟最高降低约
              25%，说明效率有所改善，但公开资料没有云支出、每次竞价服务成本、CAC、回本期或贡献利润率。
            claimRefs:
