            body: >-
              文档描述的运营模式从平台或零售商的第一方事件数据开始，这些数据用于模型训练，并对每次展示的相关性、点击率和转化进行预测。Moloco
              称，客户实例内的训练和推理保持隔离。服务链路随后把实时竞价引擎、多种定价与出价方式，以及活动管理层组合起来。Google Cloud
              的合作伙伴案例补充了实施细节：实时行为日志接入、持续训练与部署、可扩展广告服务、安全的活动管理器和实时竞价，被描述为周边必需系统。该案例称每日约有 6000 亿个竞价请求，零售媒体产品拥有超过 35,000
              个广告主，并能在毫秒级完成模型到广告的交付。这些是合作伙伴发布、公司提供的规模指标，而非经独立审计的服务水平结果；它们证明了架构雄心和已实现的运行，不代表每个客户都能获得有保证的延迟或可用性。
