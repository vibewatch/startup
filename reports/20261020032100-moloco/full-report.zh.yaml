      - number: '7.3'
        title: 运营、质量与模型风险
        blocks:
          - type: paragraph
            body: >-
              Moloco
              的运营模式依赖高量级决策、数据管道和客户能够信任的测量。公司披露，一项触达指标是根据五个样本工作日和校准因子得出的内部估算；这是方法披露，不是独立验证。公司撰写的工程岗位把可扩展性、可用性、数据治理和合规列为当前职责。这些是合理的缓释措施，但证据池缺乏服务水平历史、恢复目标、渗透测试摘要、模型漂移阈值、欺诈损失数据和公开事故记录。因此，否决标准应可衡量：反复出现重大
              SLA 未达标、未解决的高严重性审计发现，或归因结果与独立测量的增量结果之间出现无法解释的偏差。
