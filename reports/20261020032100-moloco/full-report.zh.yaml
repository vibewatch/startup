  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品组合与客户工作流
        blocks:
          - type: paragraph
            body: >-
              Moloco 的产品覆盖两类主要工作流。Moloco Ads 面向在独立库存上获客并留存 App 用户的效果营销人员；Moloco Commerce Media
              则服务在自有数字资产上搭建赞助广告业务的零售商和平台。Google Cloud 合作伙伴案例还描述了面向媒体和 OTT 提供商的流媒体变现方案，但分配到的证据对该产品的实施成熟度说明较少。Commerce
              Media 是文档最完整的模块：文档列出 Sponsored Product、Search Ads、Sponsored Display 和 Sponsored
              Brands，并同时描述广告主侧的活动配置与平台变现。这种广度给 Moloco
              带来多个激活入口，也要求尽调区分普遍可用的能力与较新或文档较少的扩展，并核验各产品的采用情况，而不是把整个产品组合当作统一的部署基础。
