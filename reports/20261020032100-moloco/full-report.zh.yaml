        title: 依赖、财务不透明与投资论点失效条件
        blocks:
          - type: paragraph
            body: >-
              平台披露的触达范围依赖集成交易所和专有 SDK；一份二手资料称其使用 Google Cloud
              组件，但分配到的证据没有量化供应商集中度、故障切换覆盖或切换成本。公开定价表述无法证明客户集中度或合同韧性。MoneyFM
              的估值证据涉及二级股份交易，而非新增一级融资或可用现金。如果经审计的当前财务无法把增长与现金生成对上，如果头部客户或平台依赖高度集中且没有经过测试的替代方案，或者独立增量研究无法支持公司报告的表现，投资论点就应当失效。
