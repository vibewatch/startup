  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与决策姿态
        blocks:
          - type: paragraph
            body: >-
              当前决策是继续研究 / 跟踪，不是买入。Moloco 自有材料显示其效果广告平台覆盖移动 App
              获客和商业媒体；第三方资料则描述了有意义的历史收入和融资。这些是公司质量的有用指标，但不足以为投资定价。没有留存来源提供经审计的 2026
              年收入、利润率、现金流、净留存、股权、优先权条款或当前一级融资。最有力的价格证据是一份第三方对 2023
              年二级交易的描述，但交易金额未披露。因此，在缺失的私有证据补齐前，对运营论点的信心为中等，对估值的信心为低，整体投资风险为高。入场纪律应明确：不要锚定旧的二级估值，也不要在入场价格、稀释结构和可信退出路径明确前设定目标回报。
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV013
              - CV014
              - CV015
