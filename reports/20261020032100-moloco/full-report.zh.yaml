  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              不应把 Moloco 的可触达市场视为一个没有差别的“数字广告”池。其核心边界包括：独立移动 App 上以效果为导向的获客与再营销；零售商和平台用来变现第一方购物行为的商业媒体基础设施；以及较新的效果 CTV
              邻接市场。开放互联网这一点很关键：公司将 App 产品定位为与 Google 和 Meta
              并行，而不是替代它们；商业媒体则运行在零售商自有资产上。因此，相关替代方案包括围墙花园投放、传统零售媒体平台、内部广告服务器开发、人工关键词或规则系统，以及只做自然陈列而不进一步投放。Tracxn 独立将
              Moloco 归为 AI 驱动的移动 DSP，同时指出其零售媒体功能，印证了多市场边界，但没有证明任何单一分部的规模。
            claimRefs:
              - CM001
              - CM014
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM004
              - CM005
              - CM006
              - CM013
              - CM014
              - CM015
      - number: '2.2'
        title: 受证据约束的市场规模视角
        blocks:
          - type: paragraph
            body: >-
              现有最强的规模证据来自运营而非金额。Moloco 称可触达 2.9 million 个独立 App，口径是截至 2026 年 4 月 3 日前 90 天内至少收到过一次实时竞价请求的 App
              bundle。公司资料还称其解决方案覆盖超过 200 个国家和地区。这些数字说明潜在库存广度和地理覆盖，并不等于广告主支出、收入或可服务市场规模。商业媒体方面，Moloco
              内部客户数据描述了合格客户的变现进阶：一年内 A2G 达到 1%，两年内 2%，三年内超过 3%。A2G 指广告收入占 GMV 的比例，因此这些里程碑说明参与零售商的收入密度潜力，而不是全市场采用率或
              Moloco 收入。
            claimRefs:
              - CM002
              - CM003
              - CM008
              - CM009
              - CM010
              - CM011
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM003
              - CM009
              - CM010
              - CM011
              - CM014
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM002
              - CM003
              - CM009
              - CM010
              - CM011
              - CM012
      - number: '2.3'
        title: 买方、用户、付费方与采用路径
        blocks:
          - type: paragraph
            body: >-
              不同分部的经济链条并不相同。在 App 效果广告中，增长或效果营销团队掌握获客预算，并评估
              ROAS、生命周期价值和再营销效果。在商业媒体中，零售商或平台既是平台买方也是库存所有者；品牌和平台卖家为广告活动出资；购物者则是接触赞助商品、搜索广告、展示广告、品牌广告或视频的终端用户。采用不只需要媒体预算：零售商数据、目录和库存
              数据 feed、购物者事件集成、广告活动工具、归因选择、治理和广告主接入上线都必须跑通。Moloco 称部署最快六周即可上线，但这只是公司的最佳情形说法，不是披露的实施周期分布。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM012
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM012
              - CM013
              - CM015
      - number: '2.4'
        title: 增长驱动、约束与估值相关性
        blocks:
          - type: paragraph
            body: >-
              采用主要由可衡量的效果、自动竞价与优化能力，以及无需内部搭建完整广告技术栈即可变现第一方商业数据的能力驱动。Moloco 称，截至 2026 年 3 月 31 日，其大多数商业媒体零售商的 A2G
              至少达到前四周的两倍；这一方向性信号偏正面，但来自公司且混合了不同商业模式和垂直行业。约束包括集成工作量、零售商特定的归因方式、对充足流量和广告主需求的依赖、数据治理要求，以及从传统或自建基础设施切换的成本。文档称客户数据按实例隔离，解决了一项信任问题，但没有分配到的证据量化采购周期、赢单率、切换成本或全市场预算。定价也按产品、目标、市场和活动定制。因此估值应重视已证明的客户变现和库存广度，同时对缺乏支持的美元市场外推打折。
            claimRefs:
              - CM007
              - CM008
              - CM012
              - CM013
              - CM015
      - number: '2.5'
        title: 展品
        blocks:
          - type: callout
            title: 美元口径的市场规模仍未得到证明
            body: 分配到的来源支持产品边界、触达范围和客户变现基准，但不支持经独立交叉验证的美元 TAM、分部预算池、采购周期分布或站得住脚的 Moloco SOM。
            calloutType: risk
            claimRefs:
              - CM002
              - CM003
              - CM014
              - CM015
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与买方替代方案
        blocks:
          - type: paragraph
            body: >-
              相关竞争集合不只是需求方平台名单。Moloco Ads 面向在独立 App 上购买获客的效果营销人员；Moloco Commerce Media 面向搭建自有赞助广告业务的零售商和平台。Moloco
              自己表示，客户通常把 Ads 与 Google、Meta 一起使用，而不是取代它们，因此围墙花园既是既有玩家，也是互补的预算去向。独立目录将 Moloco 描述为覆盖 Ads、Commerce Media 和
              Streaming
              Monetization，但分配到的证据不足以证明它与具名广告技术同行的直接功能对等。内部自建、零售商原生工具，以及人工或服务驱动的运营仍是现状替代方案，因为买方可以自行拼装竞价、活动和第一方数据能力。
            claimRefs:
              - CP001
              - CP002
              - CP006
              - CP010
              - CP015
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP006
              - CP009
              - CP010
              - CP011
      - number: '3.2'
        title: 能力差异化与信任姿态
        blocks:
          - type: paragraph
            body: >-
              Moloco 最明显的差异化在于商业媒体的实施深度。其文档涵盖赞助商品、搜索广告、赞助展示和赞助品牌；可配置的一价或二价竞价；CPC、CPM 和 CPO 出价；以及三种活动管理路径——独立软件、嵌入式
              widget 和 API。文档还称，机器学习数据、训练和推理均在每个客户实例内隔离。这些说法说明产品广度和偏隐私的架构，但都来自公司，无法证明相对于任何具名竞争对手的优势。Moloco 新闻中心还称获得 IAB
              Europe 零售媒体认证，这是有用的信任信号，但在分配到的证据池内未经过独立审计。因此，对缺乏支持的竞争对手单元格只显示未知，不评为劣势。
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP013
          - type: table
            tableRef: TP002
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP009
              - CP013
      - number: '3.3'
        title: 定价、打包与分销能力
        blocks:
          - type: paragraph
            body: >-
              公开定价透明度有限。Moloco 称，定价随产品、活动目标、市场和广告活动而变，并区分按效果计费的 Ads 定价与面向零售商的 Commerce Media
              结构。某第三方工具目录只确认其为付费模式，并引导买方联系 Moloco；另一目录则将其标为 SaaS 或按用量计费，目标客户为企业和中型市场客户。一份转载的 Moloco
              招聘描述显示，商业动作依赖客户账户扩张、增购、交叉销售以及复杂多产品交易的谈判。新闻中心的代理商合作伙伴计划表明，Moloco 也在通过中间渠道扩大分销。上述来源均未披露目录价、最低消费、take
              rate、折扣区间或合同期限，因此              定价比较仍只是模型观察，而非标准化价格基准。
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP011
      - number: '3.4'
        title: 切换摩擦、护城河韧性与替代风险
        blocks:
          - type: paragraph
            body: >-
              相比普通活动席位，Commerce Media 似乎会带来更高的实施摩擦：平台要接入第一方事件数据、配置竞价机制、支持卖家活动流程，并可通过 widget 或 API
              嵌入。集成后，这种架构可能提高切换成本，但留存来源没有提供迁移周期、数据可携带条款、续约率、合同期限或客户输赢记录。Moloco Ads 面临不同的韧性考验，因为公司把它定位为 Google 和 Meta
              之外的增量渠道。在这种场景下，可防御性取决于持续的增量效果和独立 App 供给，而不是对广告主预算的排他控制。分配到的证据池没有独立的负面基准、经核验的宕机历史、竞争对手反应证据或可比 take rate
              数据。因此，投资判断应把护城河视为合理但尚未验证。
            claimRefs:
              - CP006
              - CP012
              - CP016
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP006
              - CP016
      - number: '3.5'
        title: 展品
        blocks:
          - type: callout
            title: 对比证据是准入门槛问题
            body: 证据池支持 Moloco 的产品梳理，但不足以形成有说服力的具名供应商基准。在判断定价权或持久的替代防御力前，应索取合同级定价、续约与迁移数据，以及近期赢单/丢单记录。
            calloutType: risk
            claimRefs:
              - CP007
              - CP016
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入架构与价格形成
        blocks:
          - type: paragraph
            body: >-
              Moloco 展示了三条商业产品线：通过 Moloco Ads 提供效果获客，通过 Moloco Commerce Media 帮助零售商和平台变现，以及流媒体变现。对 Ads 而言，最清晰的公开定价机制是优化
              CPM：展示价格随预期用户质量和竞价竞争而变，活动则围绕 CPA 或 ROAS 优化。Moloco 称，大多数活动以实验开始，日预算至少为 $300，但这笔起始预算是客户广告支出，不是 Moloco
              收入。Commerce Media 的定价没有公开标准化；Moloco 称其围绕每个零售商或平台设计。结果是一个合理的、与交易和合同挂钩的模型，但实际 take rate 和收入确认方式均未披露。
