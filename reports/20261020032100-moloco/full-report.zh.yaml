            body: >-
              Moloco 的差异化论点是把广泛的开放互联网竞价接入、第一方信号和复合决策系统结合起来。其首页称 CARA
              会在广告领域协调模型、智能体和专用软件；技术文档则具体描述了商业媒体的预测与竞价闭环。主要投资判断限制在于可观测性：一份独立的 2026 年从业者指南指出，Moloco
              没有公开广告库，竞价、受众、支出和回报数据都留在广告主的私有账户中。这种不透明使外部无法验证模型提升，也让客户控制的实验、原始事件对账、增量研究和合同级服务记录变得必不可少。隐私证据同样不完整。客户实例数据隔离和合作伙伴关于区域数据主权支持的说法是有用的控制措施，但留存材料没有提供审计报告、控制范围、事故历史、可用性历史、恢复目标或模型治理文档。
