      - number: '8.2'
        title: 融资背景与入场纪律
        blocks:
          - type: paragraph
            body: >-
              BounceWatch 记录累计融资 1.916 亿美元，以及一笔未披露金额的 2023 年 6 月二级投资；Grokipedia 另称 2023 年二级交易累计募资约 2 亿 美元、估值超过 20
              亿美元。这些是第三方记录，不是当前融资文件；累计融资的小幅差异说明不能把它们当作股权结构表真相。二级估值不是 Moloco
              收到一级现金的证据；未披露交易也无法说明股份类别、优先权、转让限制或新投资人可获得的价格。实际立场是：公开证据无法评估估值。任何入场区间都必须以 term
              sheet（条款清单）、完全稀释资本化表、瀑布表、债务计划和经审计报表为前提。
            claimRefs:
              - CV001
              - CV002
              - CV013
              - CV015
      - number: '8.3'
        title: 运营证据、投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              投资论点是：Moloco 拥有多个变现入口，也积累了足够技术证明，能够支撑一个持久的独立广告技术平台。Moloco 称可接入 290 万个独立 App；当前招聘材料描述了企业收入扩张和多产品交易；Google
              Cloud 则报告零售媒体技术栈带来的容量、延迟和变现改善。反论点是：大多数证明来自公司或合作伙伴，最新分配到的独立财务资料依赖历史估算。竞争参考包括 The Trade Desk、Criteo、AppLovin
              和 InMobi，但分配到的证据没有将增长、利润率或估值倍数按统一口径与这些公司比较。产品势头可以支持更深入的尽调，但不能替代当前单位经济性或可比估值集合。
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV011
              - CV012
              - CV013
          - type: table
