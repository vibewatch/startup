schemaVersion: "report-v2"
artifact: customers
slug: moloco
runDate: 2026-10-20
company:
  name: Moloco
chapter:
  number: 6
  title: Customers
  summary: >-
    Moloco serves performance marketers, mobile-game publishers, retailers, marketplaces, and
    agency-led buyers, with named evidence spanning scaled commerce-media programs, mobile
    acquisition, and early CTV tests. The evidence demonstrates adoption and expansion paths,
    but current retention, contract, concentration, and customer-revenue mix remain undisclosed.
sections:
  - id: customer-segments
    title: Customer segments and buying centers
    body: >-
      Moloco's customer surface is split between performance advertisers using Moloco Ads and
      retailers or marketplaces operating advertising businesses through Moloco Commerce Media.
      Mobile gaming is a particularly visible vertical: Moloco says 46 of the 50 highest-grossing
      mobile games in Sensor Tower's 2025 ranking advertised with it, while its broader site names
      customers including Costco, TikTok, Pinterest, Revolut, and Robinhood. The economic buyer
      varies by segment. Growth and performance-marketing teams buy acquisition outcomes; retail
      media leaders buy monetization infrastructure; game publishers can combine acquisition with
      SDK-based monetization; and agencies increasingly influence planning, certification,
      co-selling, and cross-channel adoption. This breadth expands the addressable customer base,
      but the assigned evidence does not disclose segment revenue, customer counts by product, or
      average contract value.
    claimRefs: [CU001, CU002, CU004, CU006, CU008]
    tableRefs: [TU001]
  - id: adoption-proof
    title: Adoption and named customer proof
    body: >-
      Adoption evidence ranges from platform-scale assertions to customer-specific outcomes.
      Google Cloud's Moloco case study reports that the retail-media platform supported more than
      35,000 advertisers, while Moloco's 2026 mobile-gaming analysis covers a defined cohort of 151
      newly activated in-app-advertising publishers. Named proof is uneven but substantive:
      Wayfair described a 30% display-ad click-through-rate increase during an initial proof of
      concept and subsequent scale across thousands of supplier campaigns; Google Cloud described
      Bucketplace's live retail-media program and reported customer-published exposure and
      conversion-sales figures; and PMG told Digiday that mobile success led it into an alpha CTV
      test. These examples establish real deployments, but different periods, populations, and
      outcome definitions prevent direct comparison or portfolio-wide extrapolation.
    claimRefs: [CU003, CU005, CU007, CU009, CU011, CU014]
    tableRefs: [TU002, TU003]
  - id: durability-expansion
    title: Durability and expansion mechanics
    body: >-
      Available durability evidence is narrow. Moloco states that its ten largest advertisers by
      spend had each remained customers for more than five years as of December 31, 2025, but this
      top-spender subset is not a substitute for net revenue retention, gross revenue retention,
      logo churn, renewal rates, or cohort curves. Expansion appears to be pursued through several
      mechanisms: moving advertisers from mobile into CTV, combining user acquisition with the
      Moloco SDK, adding retailer advertiser participation, and using agencies for co-selling and
      multi-product adoption. A current Japan growth-role description explicitly assigns upsell,
      cross-sell, and geographic expansion across key and enterprise accounts. These signals support
      a land-and-expand motion, while leaving its conversion rate and revenue contribution unknown.
    claimRefs: [CU007, CU008, CU009, CU010, CU012, CU013]
    figureRefs: [FU001]
  - id: concentration-and-diligence
    title: Concentration, channel dependence, and diligence priorities
    body: >-
      The principal customer-risk conclusion is an evidence gap rather than a quantified finding.
      None of the assigned sources provides top-one, top-five, or top-ten revenue concentration,
      product-level customer mix, agency-sourced revenue, renewal terms, or churn. Digiday's account
      of a roughly dozen-member agency program shows a deliberate channel-scaling strategy and also
      notes that Moloco's executive sidestepped a direct competitive question about major CTV
      platforms. The program is therefore evidence of distribution expansion, not proof that CTV is
      already durable or diversified. Investment diligence should reconcile CRM, billing, and
      contract data by product and cohort; quantify direct versus agency-sourced bookings; and
      separate pilots, active production customers, and testimonial logos before assigning value to
      customer quality.
    claimRefs: [CU008, CU009, CU010]
tables:
  - id: TU001
    title: Customer segmentation and buying-center map
    columns:
      - Segment
      - Buyer / user / payer
      - Primary use case
      - Evidence of scale or value
      - Unresolved gap
    rows:
      - - Mobile performance advertisers
        - Growth, user-acquisition, and performance-marketing teams
        - Acquire and re-engage users across independent apps and CTV
        - Moloco names global customers and describes optimization toward ROAS, LTV, and re-engagement
        - Customer count, spend distribution, and contract economics are not disclosed
      - - Mobile-game publishers
        - User-acquisition and monetization leaders
        - Combine campaign acquisition with SDK-based ad monetization
        - Moloco says 46 of the top 50 highest-grossing mobile games in the cited 2025 ranking advertised with it
        - Ranking coverage does not disclose spend, retention, or revenue contribution
      - - Retailers and marketplaces
        - Retail-media, technology, and commercial leaders; sellers fund campaigns
        - Build sponsored-ad businesses using first-party shopper data
        - Google Cloud reports more than 35,000 advertisers supported by Moloco's retail-media platform
        - Metric vintage, retailer count, and active-versus-registered denominator are not stated
      - - Agencies and enterprise account portfolios
        - Agency programmatic teams and client executives
        - Co-sell, integrate planning, and expand accounts across products and geographies
        - Digiday reported about a dozen launch agencies in the 2026 partner program
        - Agency-sourced bookings and channel concentration are not disclosed
    notes: >-
      Segment definitions combine current company materials, supplier case studies, an independent
      trade-publication report, and a company-issued job repost; scale measures are not comparable
      across rows, and null commercial metrics remain diligence gaps.
    claimRefs: [CU001, CU002, CU003, CU004, CU006, CU008, CU012]
  - id: TU002
    title: Customer growth and adoption trajectory
    columns:
      - Metric
      - Value and period
      - Source posture
      - Confidence
      - Implication
      - Missing denominator or limitation
    rows:
      - - Advertisers supported by retail-media platform
        - More than 35,000; source page does not state an as-of date
        - Google Cloud supplier case study
        - Medium
        - Demonstrates advertiser-side platform scale
        - Retailer count, active status, spend, and metric vintage are absent
      - - Highest-grossing mobile games advertising with Moloco
        - 46 of top 50 in Sensor Tower's 2025 ranking, excluding Mainland China
        - Moloco company claim citing Sensor Tower
        - Medium
        - Indicates penetration among large mobile-game publishers
        - Does not disclose spend, campaign duration, or revenue concentration
      - - SDK publisher activation cohort
        - 151 net-new IAA publishers; median Moloco spend +63% and CPM +27% in 30 days after activation versus 30 days before
        - Moloco internal analysis for December 11, 2025 to February 9, 2026 activations
        - Medium
        - Supports a measurable SDK-led expansion mechanism
        - Covers Moloco demand only, not total publisher ad revenue; no control group
      - - Vector-search retail-media rollouts
        - 4.0% ad-revenue monetization uplift across several rollouts
        - Google Cloud partner-authored technical case study
        - Medium
        - Links infrastructure change to a customer monetization outcome
        - Number of customers, baseline, rollout dates, and dispersion are not disclosed
    notes: >-
      Values retain each source's period, denominator, and qualification; they describe different
      populations and must not be combined into a conversion funnel or portfolio growth rate.
    claimRefs: [CU003, CU006, CU007, CU011]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer / partner
      - Segment
      - Deployment or use case
      - Production versus pilot
      - Reported outcome
      - Limitation
    rows:
      - - Wayfair
        - Retail media
        - Real-time catalog personalization and supplier advertising
        - Initial proof of concept followed by scaling across thousands of supplier campaigns
        - 30% increase in display-ad click-through rate during initial POC testing
        - Customer quotation appears on Moloco-controlled pages; no baseline period or independent audit
      - - Bucketplace / Ohouse
        - Retail media
        - ML-based sponsored advertising integrated into the retailer
        - Production deployment described by Google Cloud
        - More than 3 billion product exposures and over KRW 100 billion in advertising-attributed conversion sales over one year
        - Historical customer-published figures; attribution method and current run-rate are not provided
      - - PMG
        - Agency and CTV
        - Mobile programmatic relationship expanded into performance CTV
        - Alpha CTV partner with early tests
        - PMG described exponential mobile growth and significant growth in early CTV tests
        - No numeric outcome, client denominator, or production-scale disclosure
      - - Bravestars
        - Mobile gaming
        - User acquisition and SDK synergy for global audience growth
        - Ongoing partnership described in customer testimonial
        - More efficient high-value-user reach, faster global scaling, and stronger revenue growth
        - Qualitative company-hosted testimonial without quantified baseline or independent verification
    notes: >-
      This is a sample of named proof available in the assigned source pool, not an exhaustive
      customer list; status labels distinguish disclosed pilots from production descriptions, and
      outcomes retain source-specific limitations.
    enumerationScope:
      coverage: sample
      basis: >-
        Named deployments and testimonials visible in the eight assigned prefetched sources as of
        the 2026-10-20 run date.
    claimRefs: [CU005, CU009, CU014, CU004]
figures:
  - id: FU001
    title: Customer adoption and expansion journey
    type: journey-map
    summary: >-
      Evidence-backed paths move from segment entry and outcome definition through deployment,
      optimization, adjacent-product expansion, and agency-led scaling.
    data:
      nodes:
        - id: segment-entry
          label: Choose segment
          title: Choose segment
          detail: Mobile advertiser, game publisher, retailer or marketplace, or agency-led enterprise account
          touchpoints:
            - Moloco Ads
            - Moloco Commerce Media
        - id: outcome-design
          label: Define measurable outcome
          title: Define measurable outcome
          detail: ROAS, LTV, re-engagement, supplier campaign performance, or retail-media monetization
          touchpoints:
            - Growth team
            - Retail-media leader
        - id: initial-deployment
          label: Pilot or launch
          title: Pilot or launch
          detail: Initial POC, alpha CTV test, campaign launch, or sponsored-ad implementation
          touchpoints:
            - Wayfair POC
            - PMG alpha test
        - id: production-optimization
          label: Optimize in production
          title: Optimize in production
          detail: Use campaign and first-party signals to improve acquisition, personalization, or monetization
          touchpoints:
            - Supplier campaigns
            - Publisher inventory
        - id: adjacent-expansion
          label: Add an adjacent product
          title: Add an adjacent product
          detail: Expand from mobile into CTV or combine user acquisition with the Moloco SDK
          touchpoints:
            - Performance CTV
            - SDK monetization
        - id: channel-scaling
          label: Scale through partners
          title: Scale through partners
          detail: Agency co-selling, multi-product account expansion, and geographic growth
          touchpoints:
            - Agency partner program
            - Enterprise QBRs
    approximationNotes: >-
      The ordered journey synthesizes disclosed commercial motions; it does not imply that every
      customer completes every stage or that conversion rates between stages are known.
    claimRefs: [CU001, CU002, CU008, CU010, CU012]
callouts:
  - calloutType: strength
    title: Proof spans multiple customer surfaces
    body: >-
      The assigned evidence includes a scaled retail-media advertiser claim, named retailer
      deployments, a defined mobile-publisher cohort, and agency testimony about expansion into CTV.
    claimRefs: [CU003, CU005, CU007, CU009, CU014]
  - calloutType: risk
    title: Durability and concentration remain private
    body: >-
      A top-ten-advertiser tenure claim is encouraging but does not replace NRR, GRR, churn,
      renewal, contract-length, or customer-revenue concentration data.
    claimRefs: [CU013]
