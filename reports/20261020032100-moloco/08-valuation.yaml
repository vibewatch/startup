company:
  name: Moloco
chapter:
  number: 8
  title: Valuation
  summary: >-
    Moloco shows credible product breadth, operating scale, and continuing commercial investment,
    but the assigned public evidence does not disclose current audited financials, ownership,
    financing terms, or an investable entry price. The recommendation is therefore research-more
    and track, with valuation deferred until private diligence can establish a price-sensitive case.
sections:
  - id: recommendation
    title: Recommendation and decision posture
    body: >-
      The current decision is research-more / track, not buy. Moloco's own materials show a broad
      performance-advertising platform spanning mobile-app acquisition and commerce media, while
      third-party profiles describe meaningful historical revenue and funding. Those are useful
      indicators of company quality, but they are not enough to price an investment. No retained
      source supplies audited 2026 revenue, margins, cash flow, net retention, ownership, preference
      terms, or a current primary financing. The strongest price evidence is a third-party account
      of a 2023 secondary transaction, and its amount was undisclosed. Confidence in the operating
      thesis is therefore medium, confidence in valuation is low, and overall investment risk is
      high until the missing private evidence is produced. Entry discipline should be explicit:
      do not anchor on the old secondary mark, and do not set a target return before the entry price,
      dilution stack, and credible exit path are known.
    claimRefs: [CV001, CV002, CV005, CV013, CV014, CV015]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: financing-and-entry
    title: Financing context and entry discipline
    body: >-
      BounceWatch records $191.6 million of total funding and an undisclosed June 2023 secondary
      investment; Grokipedia separately reports approximately $200 million raised and a valuation
      above $2 billion in 2023 secondary transactions. These are third-party records rather than a
      current financing document, and the small difference in aggregate funding illustrates why the
      evidence should not be treated as cap-table truth. A secondary mark is not evidence of primary
      cash received by Moloco, nor does an undisclosed transaction reveal share class, preference,
      transfer restrictions, or the price available to a new investor. The practical stance is
      valuation not assessable from public evidence. A term sheet, fully diluted capitalization
      table, waterfall, debt schedule, and audited statements are prerequisites to any entry range.
    claimRefs: [CV001, CV002, CV013, CV015]
  - id: thesis-and-antithesis
    title: Operating evidence, thesis, and anti-thesis
    body: >-
      The thesis is that Moloco has multiple monetization surfaces and enough technical proof to
      support a durable independent-adtech platform. Moloco reports access to 2.9 million independent
      apps, current hiring materials describe enterprise revenue expansion and multi-product deals,
      and Google Cloud reports capacity, latency, and monetization improvements from the retail-media
      stack. The anti-thesis is that most proof is company- or partner-issued and the latest assigned
      independent financial profile relies on historical estimates. Competitive references include The
      Trade Desk, Criteo, AppLovin, and InMobi, but the assigned evidence does not normalize growth,
      margins, or valuation multiples against those companies. Product momentum can justify deeper
      diligence; it cannot substitute for current unit economics or a comparable valuation set.
    claimRefs: [CV003, CV004, CV005, CV006, CV007, CV008, CV011, CV012, CV013]
    tableRefs: [TV002]
  - id: scenarios-and-diligence
    title: Scenarios, exit readiness, and thesis-break triggers
    body: >-
      Bull, base, and bear cases must remain qualitative because the common denominator needed for
      valuation is absent. The bull case requires independently verified growth, durable retention,
      attractive contribution margins, and continued product expansion; the base case assumes the
      platform is healthy but the old secondary reference cannot establish today's price; the bear
      case is triggered by weak retention, margin compression, costly infrastructure, adverse
      regulation, or a preference stack that consumes common-equity value. None supports a numeric
      range today. Exit readiness is also unproven: the assigned pool contains no S-1, audited
      statements, current underwriter evidence, or disclosed acquisition benchmark. The call moves
      toward invest only if diligence verifies financial quality and the offered price supports the
      target return after dilution; it moves to pass if customer concentration, cash conversion,
      governance, or downside preference terms fail review.
    claimRefs: [CV002, CV003, CV006, CV007, CV013, CV014, CV015, CV016]
    tableRefs: [TV003]
