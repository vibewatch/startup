          detail: "No current entry price, cap table, preference stack, or primary financing terms"
        - id: decision
          label: Research-more / track
          detail: "Advance only after private diligence supports price and target return"
    approximationNotes: "Ordered decision logic, not a probability-weighted or value-proportional diagram."
    claimRefs: [CV004, CV005, CV013, CV016]
callouts:
  - calloutType: recommendation
    title: Price discipline overrides company-quality enthusiasm
    body: >-
      Treat the 2023 secondary reference as historical context only. Require audited current
      financials, retention and concentration cohorts, the fully diluted cap table, preference
      waterfall, debt, and the actual offered price before calculating a target return.
    claimRefs: [CV013, CV014, CV015]
