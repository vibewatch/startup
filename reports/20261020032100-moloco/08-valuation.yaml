      - [Anti-thesis, "Historical third-party revenue and profitability claims are not current audited results", "Audited 2024-2026 statements and monthly management accounts"]
      - [Anti-thesis, "Assigned sources do not provide normalized public-company or transaction multiples", "Comparable analysis on consistent revenue and margin definitions"]
    notes: "Company and partner claims are identified as such; evidence does not establish current financial performance or valuation."
    claimRefs: [CV003, CV004, CV005, CV006, CV007, CV008, CV011, CV012, CV013]
  - id: TV003
    title: Bull, base, and bear scenarios
    columns: [Case, Explicit assumptions, Valuation or return logic, Probability signal, Downside trigger]
    rows:
      - [Bull, "Verified growth, strong retention, attractive contribution margin, and successful product expansion", "Numeric upper range unavailable until current audited metrics and entry terms are supplied", "Directional only; evidence is supportive but mostly issuer-linked", "Growth or retention misses, or weaker-than-claimed monetization"]
      - [Base, "Healthy platform with continued investment, but no verified current multiple or transaction price", "Defer range; require a reviewed revenue base, dilution model, and exit multiple", "Most defensible public-evidence posture", "Entry price assumes unverified growth or ignores preference overhang"]
      - [Bear, "Margin compression, high infrastructure cost, weak retention, regulatory pressure, or adverse capital terms", "No defensible downside floor without cash, debt, liquidation preferences, and ownership", "Material because essential private inputs are absent", "Failed financial diligence, concentrated customers, or common-equity waterfall impairment"]
    notes: "Scenarios are qualitative because the assigned evidence cannot support numeric valuation ranges or probabilities."
    claimRefs: [CV002, CV003, CV013, CV014, CV015]
