        title: Capital, stakeholders, and milestones
        blocks:
          - type: paragraph
            body: >-
              Capital evidence is historical and uneven. Moloco's newsroom lists a $150 million Series C led by Tiger
              Global, while a low-reputation tertiary profile reports that 2023 secondary transactions brought Fidelity
              and EDBI onto the cap table at a valuation above $2.0 billion without new primary capital. That secondary
              valuation is not cash available to the company and is not a current financing mark. Product and channel
              milestones continued through 2025 and 2026, including a Google Cloud implementation case and an agency
              program with more than a dozen founding partners. No assigned source establishes current total funding,
