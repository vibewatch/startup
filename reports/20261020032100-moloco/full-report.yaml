  - id: FM001
    title: Evidence-constrained market sizing and monetization lens
    type: pyramid
    summary: >-
      Six differently denominated indicators show inventory breadth, geographic reach, implementation timing, and
      retailer monetization progression without implying a dollar TAM.
    data:
      items:
        - label: Independent app inventory
