          detail: Company-profile reach statement; revenue distribution is not disclosed.
        - label: Best-case implementation
          value: As little as 6 weeks
          detail: Company claim for connecting a retailer's existing commerce technology.
        - label: First-year commerce monetization
          value: 1% A2G
          detail: Eligible Moloco Commerce Media retailers reaching the threshold within one year.
        - label: Second-year commerce monetization
          value: 2% A2G
          detail: Eligible Moloco Commerce Media retailers reaching the threshold within two years.
        - label: Third-year commerce monetization
          value: '>3% A2G'
          detail: The strongest eligible retailers passing the threshold within three years.
