chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              Moloco was founded in 2013 by machine-learning engineers and remains a private company headquartered in
              Menlo Park. Its positioning is narrower than a generic advertising-software label: the company describes
              itself as an AI-native performance advertising provider for the open internet. The commercial model has
              two visible motions. Moloco Ads sells outcome-oriented user acquisition and re-engagement across
              independent app inventory, while Moloco Commerce Media supplies retailers and marketplaces with the
              machinery to create sponsored-ad businesses from their first-party data. This structure gives Moloco
              exposure to both advertiser acquisition budgets and platform monetization budgets, but public sources do
              not disclose segment revenue or contract economics.
            claimRefs:
              - CO001
              - CO002
              - CO004
              - CO005
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO006
              - CO007
              - CO008
              - CO016
      - number: '1.2'
        title: Operating scale and proof
        blocks:
          - type: paragraph
            body: >-
              Moloco's strongest current scale evidence is operational rather than financial. Company pages estimate
              potential Moloco Ads reach above two billion people per day, inventory across more than 2.9 million app
              bundles, service in more than 230 countries and territories, and evaluation of more than one trillion ad
              opportunities per day. These are company internal estimates with explicit measurement windows, not audited
              customer, revenue, or profitability figures. A Google Cloud partner case adds external technical context,
              reporting roughly tenfold capacity improvement, up to roughly 25% lower p95 latency, and a 4% monetization
              uplift after a Vector Search migration; because the issuer is a technology partner, those results are
              useful implementation evidence but not independent company-wide validation.
            claimRefs:
              - CO003
              - CO006
              - CO007
              - CO008
              - CO009
              - CO010
      - number: '1.3'
        title: Leadership and governance
        blocks:
          - type: paragraph
            body: >-
              The available pool supports a founder-led narrative but not a complete governance map. A low-reputation
              tertiary profile names Ikkjin Ahn, David Sehyuk Park, and Donghwan Jeon as co-founders and current senior
              executives; official company pages corroborate only that the company was founded by machine-learning
              engineers, not the full named roster. A current Moloco release identifies Sunil Rayan as Chief Business
              Officer, and the newsroom lists several leadership and board appointments without enough underlying detail
              to reconstruct tenure, committee roles, ownership, or succession planning. Founder continuity may preserve
              technical focus, but it also creates an unresolved key-person and governance diligence requirement.
            claimRefs:
              - CO001
              - CO012
              - CO013
              - CO016
