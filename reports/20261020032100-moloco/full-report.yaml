      - CM009
      - CM010
      - CM011
      - CM012
  - id: FP001
    title: Buyer control versus implementation burden
    type: quadrant
    summary: >-
      Analyst ordinal placement separates turnkey media buying from integrated commerce-media infrastructure; it is not
      a performance ranking or independent benchmark.
    data:
      xAxis:
        label: Buyer control over data and workflow
        min: 1
        max: 5
      yAxis:
        label: Implementation burden
        min: 1
        max: 5
      points:
        - label: Walled-garden media buying
          x: 2
          'y': 1
          detail: Turnkey archetype; competitor-specific implementation evidence was not retained.
        - label: Moloco Ads
          x: 3
          'y': 2
          detail: Managed performance product positioned as additive to Google and Meta.
        - label: Independent DSP category
          x: 4
          'y': 2
          detail: Archetype only; named-vendor feature and pricing evidence is unavailable.
        - label: MCM stand-alone manager
          x: 3
          'y': 3
          detail: Ready-to-use campaign manager with retailer first-party-data integration.
        - label: MCM widget or API
          x: 5
          'y': 4
          detail: Embedded or custom workflow with configurable auctions and campaign management.
        - label: Retailer internal build
          x: 5
          'y': 5
          detail: Structural substitute inferred from the capabilities a platform would otherwise assemble.
    approximationNotes: >-
      Scores are 1–5 analyst ordinal judgments based only on visible control and deployment choices; they do not measure
      vendor quality, price, market share, or outcomes.
    claimRefs:
      - CP006
      - CP016
  - id: FI001
    title: Moloco Ads revenue-model bridge
    type: flow
    summary: >-
      The public evidence explains how advertiser activity enters and is optimized by the platform, but the conversion
      from gross ad spend to Moloco net revenue and gross profit is undisclosed.
    data:
      nodes:
        - id: advertiser-budget
          label: Advertiser budget
          value: Most experiments start at a minimum $300 daily budget
          note: Customer ad spend, not Moloco revenue
        - id: campaign-objective
          label: Outcome objective
          value: CPA or ROAS
          note: Advertiser-defined performance target
        - id: auction-price
          label: Auction price
          value: Optimized CPM
          note: Dynamic impression pricing
        - id: media-delivery
          label: Media delivery
          value: Independent-app and CTV inventory
          note: Volume and clearing prices are undisclosed
        - id: measured-outcome
          label: Measured customer outcome
          value: Conversions, attributed revenue, or ROAS
          note: Attribution frameworks vary
        - id: moloco-economics
          label: Moloco economics
          value: Undisclosed
          note: Take rate, net revenue, serving cost, and gross profit require diligence
