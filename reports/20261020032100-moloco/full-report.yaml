  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              Moloco's addressable market should not be treated as a single undifferentiated "digital advertising" pool.
              Its core boundary comprises performance-oriented user acquisition and re-engagement across independent
              mobile apps; commerce-media infrastructure used by retailers and marketplaces to monetize first-party
              shopper behavior; and a newer performance-CTV adjacency. The open-internet distinction matters: the
              company positions its app product alongside, rather than as a replacement for, Google and Meta, while
              commerce media operates on retailer-owned properties. Relevant substitutes therefore include walled-garden
              buying, legacy retail-media platforms, internal ad-server development, manual keyword/rules systems, and
              doing nothing beyond organic merchandising. Tracxn independently classifies Moloco as an AI-enabled mobile
              DSP and also notes its retail-media functionality, corroborating the multi-market boundary without
              establishing the size of any one segment.
            claimRefs:
              - CM001
              - CM014
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM004
              - CM005
              - CM006
              - CM013
              - CM014
              - CM015
      - number: '2.2'
        title: Evidence-constrained sizing lenses
        blocks:
          - type: paragraph
            body: >-
              The strongest available sizing evidence is operational rather than monetary. Moloco reports access to 2.9
              million independent apps, measured as app bundles from which it received at least one real-time bid
              request during the 90 days ending April 3, 2026. Its company profile also states that its solutions reach
              more than 200 countries and territories. Those figures describe potential inventory breadth and geographic
              reach; they are not advertiser spend, revenue, or a serviceable market estimate. For commerce media,
              Moloco's internal customer data describes a monetization progression of 1% A2G within one year, 2% within
              two years, and more than 3% within three years among eligible customers. A2G is ad revenue as a percentage
              of GMV, so these milestones indicate revenue-density potential for participating retailers, not
              market-wide adoption or Moloco revenue.
            claimRefs:
              - CM002
              - CM003
              - CM008
              - CM009
              - CM010
              - CM011
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM003
              - CM009
              - CM010
              - CM011
              - CM014
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM002
              - CM003
              - CM009
              - CM010
              - CM011
              - CM012
      - number: '2.3'
        title: Buyers, users, payers, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The economic chain differs by segment. In app performance advertising, a growth or performance-marketing
              team controls acquisition budget and evaluates ROAS, lifetime value, and re-engagement. In commerce media,
              the retailer or marketplace is the platform buyer and inventory owner; brands and marketplace sellers fund
              campaigns; and shoppers are the end users exposed to sponsored products, search ads, display, brands, or
              video. Adoption requires more than media budget: retailer data, catalog and inventory feeds, shopper-event
              integration, campaign tooling, attribution choices, governance, and advertiser onboarding all have to work
              together. Moloco says deployments can go live in as little as six weeks, but that is a best-case company
              claim rather than a disclosed implementation distribution.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM012
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM012
              - CM013
              - CM015
      - number: '2.4'
        title: Growth drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Adoption is driven by measurable performance, automated bidding and optimization, and the ability to
              monetize first-party commerce data without building a complete ad stack internally. Moloco reports that
              most of its commerce-media retailers at least doubled A2G versus their first four weeks as of March 31,
              2026, which is directionally supportive but remains company-issued and mixes business models and
              verticals. Constraints include integration effort, retailer-specific attribution, dependence on sufficient
              traffic and advertiser demand, data-governance requirements, and switching from legacy or in-house
              infrastructure. The documentation says customer data is siloed by instance, addressing one trust concern,
              but no assigned evidence quantifies procurement cycles, win rates, switching costs, or market-wide
              budgets. Pricing is also bespoke to product, goals, market, and activity. Valuation should therefore
              weight demonstrated customer monetization and inventory breadth, while discounting unsupported
              dollar-market extrapolations.
            claimRefs:
              - CM007
              - CM008
              - CM012
              - CM013
              - CM015
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Dollar market size remains unproven
            body: >-
              The assigned sources support product boundaries, reach, and customer monetization benchmarks, but not an
              independently triangulated dollar TAM, segment budget pool, procurement-cycle distribution, or defensible
              Moloco SOM.
            calloutType: risk
            claimRefs:
              - CM002
              - CM003
              - CM014
              - CM015
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              The relevant competitive set is broader than a list of demand-side platforms. Moloco Ads addresses
              performance marketers buying user acquisition across independent apps, while Moloco Commerce Media
              addresses retailers and marketplaces building their own sponsored-ad businesses.       Moloco itself says
              customers typically run its Ads product alongside Google and Meta rather than instead of them, making
              walled gardens both incumbents and complementary budget destinations. Independent directories describe
              Moloco across Ads, Commerce Media, and Streaming Monetization, but the assigned pool does not establish
              direct feature parity with named adtech peers. Internal build, retailer-native tooling, and manual or
              service-led operation remain status-quo substitutes because buyers can assemble auction, campaign, and
              first-party-data capabilities themselves.
            claimRefs:
              - CP001
              - CP002
              - CP006
              - CP010
              - CP015
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP006
              - CP009
              - CP010
              - CP011
      - number: '3.2'
        title: Capability differentiation and trust posture
        blocks:
          - type: paragraph
            body: >-
              Moloco's strongest visible differentiation sits in commerce-media implementation depth. Its documentation
              covers sponsored products, search ads, sponsored display, and sponsored brands; configurable first- or
              second-price auctions; CPC, CPM, and CPO bidding; and three campaign-management paths spanning stand-alone
              software, embedded widgets, and APIs. The same documentation says machine-learning data, training, and
              inference are siloed within each customer instance. These claims indicate breadth and a privacy-oriented
              architecture, but they are company-issued and do not establish superiority over any named competitor.
              Moloco's newsroom also claims an IAB Europe retail-media certification, which is a useful trust signal but
              was not independently audited within the assigned evidence pool. Unsupported competitor cells are
              therefore shown as unknown rather than scored as inferior.
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP013
          - type: table
            tableRef: TP002
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP009
              - CP013
      - number: '3.3'
        title: Pricing, packaging, and distribution power
        blocks:
          - type: paragraph
            body: >-
              Public pricing transparency is limited. Moloco says pricing varies by product, campaign goals, market, and
              advertising activity, and distinguishes performance-based Ads pricing from retailer-specific Commerce
              Media structures. A third-party tool directory only confirms a paid model and directs buyers to contact
              Moloco, while another directory labels the business SaaS or usage-based and targets enterprise and
              mid-market customers. A syndicated Moloco job description shows the commercial motion depends on account
              expansion, upsell, cross-sell, and negotiation of complex multi-product deals. The newsroom's agency
              partner program suggests Moloco is also widening distribution through intermediaries. None of these
              sources discloses list rates, minimum spend, take rates, discount bands, or contract duration, so the
              pricing comparison remains a model-level view rather than a normalized price benchmark.
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP011
      - number: '3.4'
        title: Switching friction, moat durability, and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Commerce Media appears to create more implementation friction than a generic campaign seat: the platform
              ingests first-party event data, configures auction mechanics, supports seller campaign workflows, and can
              embed through widgets or APIs. That architecture may raise switching effort once it is integrated, but the
              retained sources provide no migration timelines, data-portability terms, renewal rates, contract lengths,
              or customer win/loss records. Moloco Ads faces a different durability test because the company presents it
              as an incremental channel alongside Google and Meta. In that setting, defensibility depends on sustained
              incremental performance and access to independent-app supply rather than exclusive control of advertiser
              budgets. The assigned pool contains no independent adverse benchmark, verified outage history, competitor
              response evidence, or comparative take-rate data. Underwriting should therefore treat the moat as
              plausible but unverified.
            claimRefs:
              - CP006
              - CP012
              - CP016
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP006
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Comparative evidence is the gating issue
            body: >-
              The pool supports Moloco product mapping but not a defensible named-vendor benchmark. Request
              contract-level pricing, renewal and migration data, and recent win/loss records before underwriting
              pricing power or durable displacement resistance.
            calloutType: risk
            claimRefs:
              - CP007
              - CP016
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue architecture and price formation
        blocks:
          - type: paragraph
            body: >-
              Moloco presents three commercial product lines: performance user acquisition through Moloco Ads, retailer
              and marketplace monetization through Moloco Commerce Media, and streaming monetization. For Ads, the
              clearest public price mechanic is optimized CPM: impression prices vary with expected user quality and
              auction competition while campaigns optimize toward CPA or ROAS. Moloco says most campaigns start as
              experiments with at least a $300 daily budget, but that entry budget is customer ad spend, not Moloco
              revenue. Commerce Media pricing is not standardized publicly; Moloco says it is structured around each
              retailer or marketplace. The result is a plausible transaction- and contract-linked model, but neither
              realized take rate nor revenue recognition is disclosed.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
              - CI006
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
              - CI006
              - CI009
              - CI012
          - type: table
            tableRef: TI002
            claimRefs:
              - CI002
              - CI003
              - CI004
              - CI005
              - CI006
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI002
              - CI003
              - CI005
              - CI006
      - number: '4.2'
        title: Traction and revenue-quality proxies
        blocks:
          - type: paragraph
            body: >-
              Public traction is stronger at the activity and customer-outcome layers than at the company-financial
              layer. A Moloco-issued study says 88% of mobile app marketing budgets remained concentrated with Google
              and Meta in 2024 and reports up to 214% higher Day-30 ROAS for diversified marketers; these figures
              describe market structure and advertiser outcomes, not Moloco revenue. In commerce media, Moloco says a
              majority of 24 active platforms at least doubled advertising-revenue-to-GMV between their first and latest
              four-week periods. Google Cloud separately reports a 4.0% ad-revenue uplift across several Vector Search
              rollouts. These metrics support product utility, but attribution conventions, cohort selection, contract
              economics, and Moloco's share of customer value remain undisclosed.
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI012
      - number: '4.3'
        title: GTM motion and cost structure
        blocks:
          - type: paragraph
            body: >-
              The public GTM evidence points to land-and-expand enterprise selling rather than a purely self-serve
              funnel. A Moloco-authored Growth Director posting assigns responsibility for portfolio revenue expansion,
              upsell, cross-sell, executive relationships, and complex multi-product negotiations. That model can deepen
              accounts but likely carries material sales and customer-success       cost. Infrastructure is another
              important cost driver: Google Cloud describes TPU, GPU, CPU, and managed Vector Search dependencies.
              Partner-reported improvements of roughly 10x capacity and up to roughly 25% lower p95 latency indicate
              efficiency progress, but no cloud spend, serving cost per auction, CAC, payback, or contribution margin is
              public.
            claimRefs:
              - CI010
              - CI011
              - CI013
          - type: table
            tableRef: TI003
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI013
              - CI016
      - number: '4.4'
        title: Capital adequacy and financial verdict
        blocks:
          - type: paragraph
            body: >-
              Capital adequacy cannot be assessed from the assigned evidence. The newsroom and third-party profile leads
              do not provide a current cash balance, monthly burn, runway, debt schedule, working-capital profile, or
              planned use of funds. Funding raised historically must not be treated as cash available today. A
              low-reputation aggregator reports approximately $300 million of revenue in 2023 and around $200 million in
              2024, but the assigned pool contains no primary financial statement corroborating either estimate; the
              apparent decline is therefore a diligence signal, not an accepted trend. The financial verdict is
              consequently mixed: monetization mechanics and operating leverage proxies are visible, while revenue
              quality, gross-margin path, cash generation, and financing dependency remain material blockers.
            claimRefs:
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Public operating scale is not an income statement
            body: >-
              Customer budgets, advertiser ROAS, customer ad-revenue uplift, auction volume, and infrastructure
              throughput all use different denominators. None should be converted into Moloco revenue, ARR, gross
              margin, cash flow, or cash available without company financial records.
            calloutType: risk
            claimRefs:
              - CI003
              - CI008
              - CI009
              - CI010
              - CI011
              - CI012
          - type: callout
            title: Make financial data-room access a gating item
            body: >-
              Require audited statements, product-level revenue and gross margin, cohort retention, customer
              concentration, cloud cost, working capital, cash, debt, burn, and runway before assigning a
              high-confidence valuation or financing view.
            calloutType: recommendation
            claimRefs:
              - CI006
              - CI013
              - CI016
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product portfolio and customer workflows
        blocks:
          - type: paragraph
            body: >-
              Moloco's product surface addresses two primary workflows. Moloco Ads is positioned for performance
              marketers acquiring and retaining app users across independent inventory, while Moloco Commerce Media
              serves retailers and marketplaces building sponsored-ad businesses on their own digital properties. A
              Google Cloud partner case study also describes a streaming monetization solution for media and OTT
              providers, but the allocated evidence is less specific about that product's implementation maturity.
              Commerce Media is the best-documented module: its documentation identifies Sponsored Product, Search Ads,
              Sponsored Display, and Sponsored Brands, and describes both advertiser-facing campaign configuration and
              platform monetization. This breadth gives Moloco multiple activation surfaces, but it also creates a
              diligence need to separate generally available capabilities from newer or less documented extensions and
              to verify product-level adoption rather than treating the portfolio as one uniform deployment base.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE008
      - number: '5.2'
        title: Architecture and real-time decisioning
        blocks:
          - type: paragraph
            body: >-
              The documented operating model begins with marketplace or retailer first-party event data, which feeds
              model training and per-impression predictions of relevance, click-through, and conversion. Moloco says
              customer-instance training and inference remain siloed. The serving path then combines a real-time auction
              engine, multiple pricing and bidding methods, and a campaign-management layer. Google Cloud's partner
              account adds implementation detail: real-time behavioral-log ingestion, continuous training and
              deployment, scalable ad serving, a secure campaign manager, and real-time bidding are described as
              required surrounding systems. That account reports approximately 600 billion bid requests per day, more
              than 35,000 advertisers on the retail-media product, and millisecond model-to-ad delivery. These are
              partner-published, company-supplied scale indicators rather than independently audited service-level
              results, so they establish architectural ambition and demonstrated operation, not guaranteed latency or
              availability for every customer.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
              - CE011
              - CE012
              - CE013
          - type: table
            tableRef: TE003
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
              - CE014
              - CE015
              - CE016
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE005
              - CE009
              - CE013
              - CE014
              - CE016
      - number: '5.3'
        title: Deployment, integration, and operating support
        blocks:
          - type: paragraph
            body: >-
              Commerce Media can be exposed through a stand-alone self-serve manager, an embedded widget, or APIs for a
              platform's own campaign manager. That interface range can reduce front-end replacement risk, but each
              option shifts integration, identity, event-quality, and operational responsibilities differently between
              Moloco and the customer. Moloco's newsroom also lists an SDK integration through Google AdMob and Ad
              Manager and an IAB Europe retail media certification announcement, while a 2026 agency-program account
              describes education, certification, dedicated support, and closer product-team access. A current
              company-issued job repost reinforces that the operating model still includes human guidance on bidding,
              budgets, creative direction, root-cause diagnosis, and expansion. The evidence therefore supports a
              product-plus-services deployment model, but does not disclose implementation timelines, support SLAs,
              integration defect rates, or the level of customer engineering effort by interface.
            claimRefs:
              - CE008
              - CE014
              - CE015
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE002
              - CE005
              - CE008
              - CE011
              - CE015
      - number: '5.4'
        title: Maturity, differentiation, and technical risk
        blocks:
          - type: paragraph
            body: >-
              Moloco's differentiation thesis is the combination of broad open-internet auction access, first-party
              signals, and a compound decision system. Its homepage describes CARA as coordinating models, agents, and
              specialized software across advertising domains, while the technical documentation gives concrete detail
              on the commerce-media prediction and auction loop. The principal underwriting limitation is observability:
              an independent 2026 practitioner guide notes that Moloco has no public ad library and that bids,
              audiences, spend, and return data remain inside private advertiser accounts. That opacity prevents outside
              verification of model lift and makes customer-controlled experiments, raw event reconciliation,
              incrementality studies, and contract-level service records essential. Privacy evidence is also incomplete.
              Customer-instance data isolation and a partner account of regional data-sovereignty support are useful
              controls, but the retained materials do not provide audit reports, control scope, incident history, uptime
              history, recovery objectives, or model-governance documentation.
            claimRefs:
              - CE006
              - CE009
              - CE013
              - CE016
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Technical proof remains largely controlled by Moloco and its partners
            body: >-
              Validate production performance with customer event-level reconciliation, controlled incrementality tests,
              security reports, uptime records, and interface-specific implementation references before underwriting
              model lift or enterprise-grade reliability.
            calloutType: risk
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
              - CE016
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and buying centers
        blocks:
          - type: paragraph
            body: >-
              Moloco's customer surface is split between performance advertisers using Moloco Ads and retailers or
              marketplaces operating advertising businesses through Moloco Commerce Media. Mobile gaming is a
              particularly visible vertical: Moloco says 46 of the 50 highest-grossing mobile games in Sensor Tower's
              2025 ranking advertised with it, while its broader site names customers including Costco, TikTok,
              Pinterest, Revolut, and Robinhood. The economic buyer varies by segment. Growth and performance-marketing
              teams buy acquisition outcomes; retail media leaders buy monetization infrastructure; game publishers can
              combine acquisition with SDK-based monetization; and agencies increasingly influence planning,
              certification, co-selling, and cross-channel adoption. This breadth expands the addressable customer base,
              but the assigned evidence does not disclose segment revenue, customer counts by product, or average
              contract value.
            claimRefs:
              - CU001
              - CU002
              - CU004
              - CU006
              - CU008
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU006
              - CU008
              - CU012
      - number: '6.2'
        title: Adoption and named customer proof
        blocks:
          - type: paragraph
            body: >-
              Adoption evidence ranges from platform-scale assertions to customer-specific outcomes. Google Cloud's
              Moloco case study reports that the retail-media platform supported more than 35,000 advertisers, while
              Moloco's 2026 mobile-gaming analysis covers a defined cohort of 151 newly activated in-app-advertising
              publishers. Named proof is uneven but substantive: Wayfair described a 30% display-ad click-through-rate
              increase during an initial proof of concept and subsequent scale across thousands of supplier campaigns;
              Google Cloud described Bucketplace's live retail-media program and reported customer-published exposure
              and conversion-sales figures; and PMG told Digiday that mobile success led it into an alpha CTV test.
              These examples establish real deployments, but different periods, populations, and outcome definitions
              prevent direct comparison or portfolio-wide extrapolation.
            claimRefs:
              - CU003
              - CU005
              - CU007
              - CU009
              - CU011
              - CU014
          - type: table
            tableRef: TU002
            claimRefs:
              - CU003
              - CU006
              - CU007
              - CU011
          - type: table
            tableRef: TU003
            claimRefs:
              - CU005
              - CU009
              - CU014
              - CU004
      - number: '6.3'
        title: Durability and expansion mechanics
        blocks:
          - type: paragraph
            body: >-
              Available durability evidence is narrow. Moloco states that its ten largest advertisers by spend had each
              remained customers for more than five years as of December 31, 2025, but this top-spender subset is not a
              substitute for net revenue retention, gross revenue retention, logo churn, renewal rates, or cohort
              curves. Expansion appears to be pursued through several mechanisms: moving advertisers from mobile into
              CTV, combining user acquisition with the Moloco SDK, adding retailer advertiser participation, and using
              agencies for co-selling and multi-product adoption. A current Japan growth-role description explicitly
              assigns upsell, cross-sell, and geographic expansion across key and enterprise accounts. These signals
              support a land-and-expand motion, while leaving its conversion rate and revenue contribution unknown.
            claimRefs:
              - CU007
              - CU008
              - CU009
              - CU010
              - CU012
              - CU013
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU002
              - CU008
              - CU010
              - CU012
      - number: '6.4'
        title: Concentration, channel dependence, and diligence priorities
        blocks:
          - type: paragraph
            body: >-
              The principal customer-risk conclusion is an evidence gap rather than a quantified finding. None of the
              assigned sources provides top-one, top-five, or top-ten revenue concentration, product-level customer mix,
              agency-sourced revenue, renewal terms, or churn. Digiday's account of a roughly dozen-member agency
              program shows a deliberate channel-scaling strategy and also notes that Moloco's executive sidestepped a
              direct competitive question about major CTV platforms. The program is therefore evidence of distribution
              expansion, not proof that CTV is already durable or diversified. Investment diligence should reconcile
              CRM, billing, and contract data by product and cohort; quantify direct versus agency-sourced bookings; and
              separate pilots, active production customers, and testimonial logos before assigning value to customer
              quality.
            claimRefs:
              - CU008
              - CU009
              - CU010
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Proof spans multiple customer surfaces
            body: >-
              The assigned evidence includes a scaled retail-media advertiser claim, named retailer deployments, a
              defined mobile-publisher cohort, and agency testimony about expansion into CTV.
            calloutType: strength
            claimRefs:
              - CU003
              - CU005
              - CU007
              - CU009
              - CU014
          - type: callout
            title: Durability and concentration remain private
            body: >-
              A top-ten-advertiser tenure claim is encouraging but does not replace NRR, GRR, churn, renewal,
              contract-length, or customer-revenue concentration data.
            calloutType: risk
            claimRefs:
              - CU013
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Residual risk ranking
        blocks:
          - type: paragraph
            body: >-
              The leading residual risk is privacy and measurement governance: Moloco says its products operate across
              more than 200 countries and territories, while a company LinkedIn post says a limited retail-media
              measurement scope was certified after an ABC UK audit. That is a useful mitigation signal, but it is not a
              substitute for the certificate, audit exceptions, jurisdiction-by-jurisdiction data-flow maps, or current
              regulator checks. Operational resilience ranks alongside it because Moloco describes reach across millions
              of apps and internally estimated audience metrics, while its engineering recruitment emphasizes
              scalability, availability, data quality, and compliance. These disclosures show that the control domains
              matter; they do not establish incident-free performance.
            claimRefs:
              - CR002
              - CR004
              - CR006
              - CR007
              - CR010
              - CR011
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR004
              - CR006
              - CR007
              - CR010
              - CR011
              - CR013
              - CR016
      - number: '7.2'
        title: Regulatory and legal exposure
        blocks:
          - type: paragraph
            body: >-
              Moloco's public materials describe global operations, a general-counsel appointment, and retail-media
              certification. A low-reputation secondary source also reports SOC 2, ISO 27001, and GDPR alignment, but
              the assigned pool does not include the underlying reports or certificates. Accordingly, compliance posture
              is best treated as asserted and partially evidenced, not independently verified across all products. No
              conclusion should be drawn about whether litigation, enforcement, intellectual-property disputes, or
              reportable incidents exist outside this bounded source set. Before investment, counsel should obtain
              current regulator and court searches, the certification scope, subprocessor and transfer maps, privacy
              impact assessments, and any open remediation items.
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR012
          - type: table
            tableRef: TR001
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR012
      - number: '7.3'
        title: Operational, quality, and model risk
        blocks:
          - type: paragraph
            body: >-
              Moloco's operating model depends on high-volume decisioning, data pipelines, and measurement that
              customers can trust. The company discloses that one reach metric is an internal estimate derived from five
              sample business days and calibration factors; this is a methodology disclosure, not independent
              validation. Company-authored engineering roles call out scalability, availability, data governance, and
              compliance as active responsibilities. Those are sensible mitigations, but the pool lacks service-level
              histories, recovery objectives, penetration-test summaries, model-drift thresholds, fraud-loss data, and a
              public incident record. Kill criteria should therefore be measurable: repeated material SLA misses,
              unresolved high-severity audit findings, or unexplained divergence between attributed and independently
              measured incremental outcomes.
            claimRefs:
              - CR002
              - CR004
              - CR010
              - CR011
              - CR013
              - CR015
              - CR016
          - type: table
            tableRef: TR002
            claimRefs:
              - CR002
              - CR004
              - CR010
              - CR011
              - CR015
              - CR016
      - number: '7.4'
        title: Dependencies, financial opacity, and thesis breaks
        blocks:
          - type: paragraph
            body: >-
              The platform's disclosed reach depends on integrated exchanges and a proprietary SDK, while a secondary
              source reports use of Google Cloud components; the assigned evidence does not quantify provider
              concentration, failover coverage, or switching cost. Public pricing language does not establish customer
              concentration or contract durability. MoneyFM's valuation evidence concerns secondary share transactions,
              not new primary funding or cash available. The thesis should break if audited current financials cannot
              reconcile growth to cash generation, if top-customer or platform dependencies are materially concentrated
              without tested alternatives, or if independent incrementality work fails to substantiate company-reported
              performance.
            claimRefs:
              - CR001
              - CR003
              - CR013
              - CR014
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR013
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Do not infer a clean incident record
            body: >-
              The assigned pool did not contain a primary regulator docket, court record, or public incident history.
              That is an evidence gap, not proof that no enforcement action, litigation, outage, or breach has occurred.
            calloutType: risk
            claimRefs:
              - CR008
              - CR012
          - type: callout
            title: Investment gating package
            body: >-
              Require current audited financials, customer and infrastructure concentration schedules, product-level
              control reports, incident and SLO histories, and independent incrementality results before relying on
              scale, profitability, or performance claims.
            calloutType: recommendation
            claimRefs:
              - CR001
              - CR004
              - CR007
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and decision posture
        blocks:
          - type: paragraph
            body: >-
              The current decision is research-more / track, not buy. Moloco's own materials show a broad
              performance-advertising platform spanning mobile-app acquisition and commerce media, while third-party
              profiles describe meaningful historical revenue and funding. Those are useful indicators of company
              quality, but they are not enough to price an investment. No retained source supplies audited 2026 revenue,
              margins, cash flow, net retention, ownership, preference terms, or a current primary financing. The
              strongest price evidence is a third-party account of a 2023 secondary transaction, and its amount was
              undisclosed. Confidence in the operating thesis is therefore medium, confidence in valuation is low, and
              overall investment risk is high until the missing private evidence is produced. Entry discipline should be
              explicit: do not anchor on the old secondary mark, and do not set a target return before the entry price,
              dilution stack, and credible exit path are known.
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV001
            claimRefs:
              - CV013
              - CV014
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV004
              - CV005
              - CV013
              - CV016
      - number: '8.2'
        title: Financing context and entry discipline
        blocks:
          - type: paragraph
            body: >-
              BounceWatch records $191.6 million of total funding and an undisclosed June 2023 secondary investment;
              Grokipedia separately reports approximately $200 million raised and a valuation above $2 billion in 2023
              secondary transactions. These are third-party records rather than a current financing document, and the
              small difference in aggregate funding illustrates why the evidence should not be treated as cap-table
              truth. A secondary mark is not evidence of primary cash received by Moloco, nor does an undisclosed
              transaction reveal share class, preference, transfer restrictions, or the price available to a new
              investor. The practical stance is valuation not assessable from public evidence. A term sheet, fully
              diluted capitalization table, waterfall, debt schedule, and audited statements are prerequisites to any
              entry range.
            claimRefs:
              - CV001
              - CV002
              - CV013
              - CV015
      - number: '8.3'
        title: Operating evidence, thesis, and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The thesis is that Moloco has multiple monetization surfaces and enough technical proof to support a
              durable independent-adtech platform. Moloco reports access to 2.9 million independent apps, current hiring
              materials describe enterprise revenue expansion and multi-product deals, and Google Cloud reports
              capacity, latency, and monetization improvements from the retail-media stack. The anti-thesis is that most
              proof is company- or partner-issued and the latest assigned independent financial profile relies on
              historical estimates. Competitive references include The Trade Desk, Criteo, AppLovin, and InMobi, but the
              assigned evidence does not normalize growth, margins, or valuation multiples against those companies.
              Product momentum can justify deeper diligence; it cannot substitute for current unit economics or a
              comparable valuation set.
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV011
              - CV012
              - CV013
      - number: '8.4'
        title: Scenarios, exit readiness, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Bull, base, and bear cases must remain qualitative because the common denominator needed for valuation is
              absent. The bull case requires independently verified growth, durable retention, attractive contribution
              margins, and continued product expansion; the base case assumes the platform is healthy but the old
              secondary reference cannot establish today's price; the bear case is triggered by weak retention, margin
              compression, costly infrastructure, adverse regulation, or a preference stack that consumes common-equity
              value. None supports a numeric range today. Exit readiness is also unproven: the assigned pool contains no
              S-1, audited statements, current underwriter evidence, or disclosed acquisition benchmark. The call moves
              toward invest only if diligence verifies financial quality and the offered price supports the target
              return after dilution; it moves to pass if customer concentration, cash conversion, governance, or
              downside preference terms fail review.
            claimRefs:
              - CV002
              - CV003
              - CV006
              - CV007
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV003
              - CV013
              - CV014
              - CV015
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price discipline overrides company-quality enthusiasm
            body: >-
              Treat the 2023 secondary reference as historical context only. Require audited current financials,
              retention and concentration cohorts, the fully diluted cap table, preference waterfall, debt, and the
              actual offered price before calculating a target return.
            calloutType: recommendation
            claimRefs:
              - CV013
              - CV014
              - CV015
