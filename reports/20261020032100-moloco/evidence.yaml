evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: private-company-disclosure
    missingEvidence: >-
      Current audited revenue, segment mix, gross margin, cash flow, cash balance, debt, ARR, customer count, and
      reconciled total capital raised.
    whyItMatters: Operating-scale claims cannot establish financial quality, funding capacity, customer concentration, or runway.
    diligencePath: >-
      Request audited financial statements, monthly management accounts, debt schedules, bank statements, and a
      financing reconciliation from management.
    relatedQuestionRefs:
      - QO003
      - QO004
      - QO008
    relatedTableRefs:
      - TO001
      - TO003
  - type: enumeration-incomplete
    severity: material
    topic: leadership-and-governance
    missingEvidence: >-
      A primary-source leadership roster, complete board composition, committee assignments, executive tenure,
      succession plan, and key-person retention terms.
    whyItMatters: The current evidence cannot measure founder dependence, governance independence, or leadership continuity.
    diligencePath: >-
      Obtain the board book, charter documents, employment agreements, equity schedules, and management organization
      chart.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: stakeholder-and-investor-map
    missingEvidence: >-
      A fully diluted cap table with current ownership, secondary-transfer terms, liquidation preferences, voting
      agreements, information rights, and board designation rights.
    whyItMatters: >-
      Historical funding headlines and secondary pricing do not reveal control, dilution, or proceeds available to the
      company.
    diligencePath: >-
      Review the stock ledger, financing documents, secondary purchase agreements, investor rights agreement, and latest
      409A or third-party valuation.
    relatedQuestionRefs:
      - QO003
      - QO008
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: adverse-events
    missingEvidence: >-
      Independent regulatory, legal, outage, security, litigation, and workforce-change checks beyond the low-reputation
      tertiary source available in the pool.
    whyItMatters: No recorded incident in the assigned sources would not prove the absence of material adverse events.
    diligencePath: >-
      Run jurisdiction-specific court, regulator, privacy authority, security incident, and employment-change searches
      with primary records.
    relatedQuestionRefs:
      - QO007
  - type: missing-source
    severity: minor
    topic: milestone-completeness
    missingEvidence: >-
      Primary dated records for earlier financing rounds, product launches, certifications, acquisitions, and material
      leadership changes.
    whyItMatters: >-
      The timeline meets the dated-item floor but is weighted toward recent operating metrics and may omit important
      historical turning points.
    diligencePath: >-
      Collect original financing releases, archived product announcements, corporate filings, certification records, and
      board resolutions.
    relatedQuestionRefs:
      - QO005
  - type: missing-source
    severity: material
    topic: dollar-market-sizing
    missingEvidence: >-
      Independent, methodologically comparable dollar estimates for app performance advertising, retail or commerce
      media infrastructure, and performance CTV, together with Moloco's serviceable geographic and customer filters.
    whyItMatters: >-
      Without comparable segment budgets and a disclosed take-rate or revenue model, broad reach metrics cannot be
      converted into a defensible TAM, SAM, SOM, or valuation multiple.
    diligencePath: >-
      Commission or obtain current analyst market datasets, reconcile category definitions, and request management's
      bottom-up customer, spend, win-rate, pricing, and capacity model.
    relatedQuestionRefs:
      - QM007
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: adoption-economics
    missingEvidence: >-
      Contract pricing, procurement-cycle distribution, implementation duration distribution, conversion rates, renewal
      rates, and budget expansion by product and customer cohort.
    whyItMatters: >-
      Company case metrics and best-case launch timing do not reveal sales friction, repeatability, retention, or
      Moloco's share of customer advertising economics.
    diligencePath: >-
      Review anonymized contracts and cohort data, interview reference customers, and test reported implementation and
      budget-expansion ranges against billing records.
    relatedQuestionRefs:
      - QM006
      - QM007
  - type: enumeration-incomplete
    severity: material
    topic: competitor-profiles
    missingEvidence: >-
      Independent profiles for each named competitor covering current scale, funding, target customer, product scope,
      pricing, and strategic direction.
    whyItMatters: >-
      Without comparable profiles, the landscape cannot support vendor-level market-share, capability, or pricing
      conclusions.
    diligencePath: >-
      Obtain current competitor filings, official product and pricing pages, independent market reports, and customer
      procurement records for the named peer set.
    relatedQuestionRefs:
      - QP002
    relatedTableRefs:
      - TP001
  - type: missing-source
    severity: material
    topic: adverse-competition
    missingEvidence: >-
      Independent adverse evidence on Moloco displacement, commoditization, outages, weak outcomes, incumbent response,
      and recent competitive losses.
    whyItMatters: >-
      Company-issued product claims cannot establish durability or rule out deterioration in performance and channel
      access.
    diligencePath: >-
      Review independent mobile-ad benchmarks, customer reference calls, churn and win-loss records, incident logs, and
      competitor disclosures.
    relatedQuestionRefs:
      - QP010
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: >-
      Contract-level list and realized pricing, minimum commitments, take rates, discount bands, renewal terms, and
      directly comparable competitor quotes.
    whyItMatters: Public model descriptions do not establish pricing power, total cost of ownership, or gross-margin resilience.
    diligencePath: >-
      Sample recent customer contracts and competitive RFPs across Moloco Ads and Commerce Media, normalized for spend,
      geography, and included services.
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: switching-cost
    missingEvidence: >-
      Migration timelines, data-portability terms, implementation costs, renewal rates, multi-homing behavior, and
      customer win-loss histories.
    whyItMatters: Integration breadth suggests friction but does not prove durable lock-in or prevent budget reallocation.
    diligencePath: >-
      Interview recent adopters and churned customers, inspect contract termination and export clauses, and review
      implementation statements of work.
    relatedQuestionRefs:
      - QP008
      - QP009
  - type: private-evidence-only
    severity: material
    topic: revenue-quality
    missingEvidence: >-
      Audited revenue, product and geographic mix, gross-versus-net recognition, gross margin, operating expense,
      EBITDA, free cash flow, and customer concentration.
    whyItMatters: >-
      Without these statements, operating activity and customer outcomes cannot be converted into revenue quality,
      profitability, or cash generation.
    diligencePath: >-
      Obtain audited 2024-2025 financial statements, 2026 year-to-date management accounts, segment schedules,
      revenue-recognition policy, and top-customer cohort data.
    relatedQuestionRefs:
      - QI007
      - QI009
    relatedTableRefs:
      - TI001
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Current cash and restricted cash, monthly burn, free-cash-flow forecast, runway, debt and lease obligations,
      working capital, planned use of funds, and next-round triggers.
    whyItMatters: Historical funding raised is not cash available and cannot establish downside resilience or financing dependency.
    diligencePath: >-
      Request the latest balance sheet, 24-month cash forecast, debt and lease schedules, receivables aging,
      board-approved operating plan, and financing scenarios.
    relatedQuestionRefs:
      - QI007
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Realized take rate, net revenue retention, churn, CAC, payback, sales cycle, cloud cost per auction,
      implementation cost, and product-level contribution margin.
    whyItMatters: >-
      Published pricing and outcome metrics do not show whether growth is durable, efficient, or margin-accretive for
      Moloco.
    diligencePath: >-
      Review customer invoices, cohort retention and expansion schedules, sales-efficiency reporting, cloud bills, and
      gross-margin bridges by product.
    relatedQuestionRefs:
      - QI007
      - QI008
    relatedTableRefs:
      - TI002
      - TI003
  - type: conflicting-data
    severity: material
    topic: revenue-estimates
    missingEvidence: >-
      Primary financial statements that confirm or refute the aggregator's approximately $300 million 2023 and
      approximately $200 million 2024 revenue estimates.
    whyItMatters: If comparable, the estimates imply contraction; if not comparable, using them would create false trend precision.
    diligencePath: >-
      Reconcile the estimates to audited revenue, accounting perimeter, currency, gross-versus-net treatment, and fiscal
      periods.
    relatedQuestionRefs:
      - QI006
      - QI007
      - QI009
    relatedTableRefs:
      - TI003
  - type: access-blocked
    severity: minor
    topic: financial-disclosure
    missingEvidence: >-
      Substantive article text from the assigned TrustFinance IPO lead and financial profile detail from the assigned
      PrivCo page.
    whyItMatters: >-
      The successful URL retrievals exposed a JavaScript shell or access restriction rather than usable evidence, so
      neither can substantiate IPO readiness or financial estimates.
    diligencePath: >-
      Seek the original issuer, filing, audited statement, or another already-authorized primary source in a later
      research pass.
    relatedQuestionRefs:
      - QI007
      - QI009
  - type: private-evidence-only
    severity: material
    topic: trust-and-security
    missingEvidence: >-
      Current independent audit reports, control scope, privacy impact documentation, incident history, uptime history,
      recovery objectives, and model-governance controls.
    whyItMatters: >-
      Customer-instance isolation and partner descriptions do not establish the effectiveness, completeness, or
      operating history of enterprise controls.
    diligencePath: >-
      Review security certifications and underlying reports, subprocessors, data-flow diagrams, penetration tests,
      incident logs, status history, disaster-recovery tests, and model-risk governance under NDA.
    relatedQuestionRefs:
      - QE007
  - type: private-evidence-only
    severity: material
    topic: performance-validation
    missingEvidence: >-
      Customer-level incrementality, latency percentiles, availability, error rates, model-lift distributions, and
      reconciliation between source events and billed outcomes.
    whyItMatters: >-
      Aggregate company and partner scale claims cannot establish campaign lift or reliable service for a prospective
      customer's workload.
    diligencePath: >-
      Run a controlled proof of concept with raw event reconciliation, holdouts, agreed success metrics, latency and
      uptime instrumentation, and contractually defined service levels.
  - type: missing-source
    severity: minor
    topic: developer-ecosystem
    missingEvidence: >-
      Public repository activity, release history, package downloads, contributor counts, API forum activity, or another
      direct developer-adoption signal.
    whyItMatters: >-
      The allocated job repost is only a practitioner proxy and does not reveal release cadence, external developer
      adoption, or engineering-community health.
    diligencePath: >-
      Request private API changelogs, SDK release metrics, developer-support volumes, integration reference calls, and
      engineering release-frequency evidence.
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: Current NRR, GRR, logo churn, renewal rates, average contract length, and product-level cohort retention.
    whyItMatters: >-
      A top-ten-advertiser tenure statement cannot show whether the broader customer base is durable or whether
      expansion offsets churn.
    diligencePath: >-
      Obtain customer-level billing and contract cohorts for the trailing 24 months and reconcile NRR, GRR, churn,
      renewals, and contraction to audited revenue.
    relatedQuestionRefs:
      - QU009
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: >-
      Top-one, top-five, and top-ten revenue concentration plus bookings and revenue mix by product, geography, direct
      sales, and agency channel.
    whyItMatters: >-
      Named logos and launch partners do not reveal exposure to a small number of customers or dependence on a channel
      for growth.
    diligencePath: >-
      Review anonymized customer revenue and bookings schedules, channel attribution, and concentration trends by
      quarter for at least eight quarters.
    relatedQuestionRefs:
      - QU010
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-proof
