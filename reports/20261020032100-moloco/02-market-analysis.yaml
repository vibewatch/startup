company:
  name: Moloco
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Moloco participates in three adjacent performance-advertising arenas: open-internet app
    acquisition, retailer-owned commerce media, and performance CTV. The assigned evidence
    supports large reach and a staged retailer-monetization path, but it does not support an
    independently triangulated dollar TAM, SAM, or SOM.
sections:
  - id: market-boundary
    title: Market boundary and substitutes
    body: >-
      Moloco's addressable market should not be treated as a single undifferentiated
      "digital advertising" pool. Its core boundary comprises performance-oriented user
      acquisition and re-engagement across independent mobile apps; commerce-media
      infrastructure used by retailers and marketplaces to monetize first-party shopper
      behavior; and a newer performance-CTV adjacency. The open-internet distinction matters:
      the company positions its app product alongside, rather than as a replacement for,
      Google and Meta, while commerce media operates on retailer-owned properties. Relevant
      substitutes therefore include walled-garden buying, legacy retail-media platforms,
      internal ad-server development, manual keyword/rules systems, and doing nothing beyond
      organic merchandising. Tracxn independently classifies Moloco as an AI-enabled mobile
      DSP and also notes its retail-media functionality, corroborating the multi-market
      boundary without establishing the size of any one segment.
    claimRefs: [CM001, CM014, CM015]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: Evidence-constrained sizing lenses
    body: >-
      The strongest available sizing evidence is operational rather than monetary. Moloco
      reports access to 2.9 million independent apps, measured as app bundles from which it
      received at least one real-time bid request during the 90 days ending April 3, 2026.
      Its company profile also states that its solutions reach more than 200 countries and
      territories. Those figures describe potential inventory breadth and geographic reach;
      they are not advertiser spend, revenue, or a serviceable market estimate. For commerce
      media, Moloco's internal customer data describes a monetization progression of 1% A2G
      within one year, 2% within two years, and more than 3% within three years among eligible
      customers. A2G is ad revenue as a percentage of GMV, so these milestones indicate
      revenue-density potential for participating retailers, not market-wide adoption or
      Moloco revenue.
    claimRefs: [CM002, CM003, CM008, CM009, CM010, CM011]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyers-and-adoption
    title: Buyers, users, payers, and adoption path
    body: >-
      The economic chain differs by segment. In app performance advertising, a growth or
      performance-marketing team controls acquisition budget and evaluates ROAS, lifetime
      value, and re-engagement. In commerce media, the retailer or marketplace is the platform
      buyer and inventory owner; brands and marketplace sellers fund campaigns; and shoppers
      are the end users exposed to sponsored products, search ads, display, brands, or video.
      Adoption requires more than media budget: retailer data, catalog and inventory feeds,
      shopper-event integration, campaign tooling, attribution choices, governance, and
      advertiser onboarding all have to work together. Moloco says deployments can go live in
      as little as six weeks, but that is a best-case company claim rather than a disclosed
      implementation distribution.
    claimRefs: [CM004, CM005, CM006, CM012, CM013]
    tableRefs: [TM003]
  - id: drivers-constraints-and-valuation-relevance
    title: Growth drivers, constraints, and valuation relevance
    body: >-
      Adoption is driven by measurable performance, automated bidding and optimization, and
      the ability to monetize first-party commerce data without building a complete ad stack
      internally. Moloco reports that most of its commerce-media retailers at least doubled
      A2G versus their first four weeks as of March 31, 2026, which is directionally supportive
      but remains company-issued and mixes business models and verticals. Constraints include
      integration effort, retailer-specific attribution, dependence on sufficient traffic and
      advertiser demand, data-governance requirements, and switching from legacy or in-house
      infrastructure. The documentation says customer data is siloed by instance, addressing
      one trust concern, but no assigned evidence quantifies procurement cycles, win rates,
      switching costs, or market-wide budgets. Pricing is also bespoke to product, goals,
      market, and activity. Valuation should therefore weight demonstrated customer
      monetization and inventory breadth, while discounting unsupported dollar-market
      extrapolations.
    claimRefs: [CM007, CM008, CM012, CM013, CM015]
