schemaVersion: "report-v2"
artifact: product-tech
slug: moloco
runDate: 2026-10-20
company:
  name: Moloco
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Moloco exposes a broad advertising stack spanning app user acquisition, commerce-media
    monetization, and streaming, with first-party event ingestion, continuously trained models,
    real-time auctions, and several campaign-management interfaces. The strongest technical proof
    is a detailed partner architecture case study and current product documentation; externally
    auditable uptime, security assurance, model-performance, and private campaign economics remain
    material diligence gaps.
sections:
  - id: product-portfolio
    title: Product portfolio and customer workflows
    body: >-
      Moloco's product surface addresses two primary workflows. Moloco Ads is positioned for
      performance marketers acquiring and retaining app users across independent inventory, while
      Moloco Commerce Media serves retailers and marketplaces building sponsored-ad businesses on
      their own digital properties. A Google Cloud partner case study also describes a streaming
      monetization solution for media and OTT providers, but the allocated evidence is less
      specific about that product's implementation maturity. Commerce Media is the best-documented
      module: its documentation identifies Sponsored Product, Search Ads, Sponsored Display, and
      Sponsored Brands, and describes both advertiser-facing campaign configuration and platform
      monetization. This breadth gives Moloco multiple activation surfaces, but it also creates a
      diligence need to separate generally available capabilities from newer or less documented
      extensions and to verify product-level adoption rather than treating the portfolio as one
      uniform deployment base.
    claimRefs: [CE001, CE002, CE003, CE004]
    tableRefs: [TE001]
  - id: architecture-and-decisioning
    title: Architecture and real-time decisioning
    body: >-
      The documented operating model begins with marketplace or retailer first-party event data,
      which feeds model training and per-impression predictions of relevance, click-through, and
      conversion. Moloco says customer-instance training and inference remain siloed. The serving
      path then combines a real-time auction engine, multiple pricing and bidding methods, and a
      campaign-management layer. Google Cloud's partner account adds implementation detail:
      real-time behavioral-log ingestion, continuous training and deployment, scalable ad serving,
      a secure campaign manager, and real-time bidding are described as required surrounding
      systems. That account reports approximately 600 billion bid requests per day, more than
      35,000 advertisers on the retail-media product, and millisecond model-to-ad delivery. These
      are partner-published, company-supplied scale indicators rather than independently audited
      service-level results, so they establish architectural ambition and demonstrated operation,
      not guaranteed latency or availability for every customer.
    claimRefs: [CE005, CE006, CE007, CE008, CE009, CE010, CE011, CE012, CE013]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: deployment-and-enablement
    title: Deployment, integration, and operating support
    body: >-
      Commerce Media can be exposed through a stand-alone self-serve manager, an embedded widget,
      or APIs for a platform's own campaign manager. That interface range can reduce front-end
      replacement risk, but each option shifts integration, identity, event-quality, and
      operational responsibilities differently between Moloco and the customer. Moloco's newsroom
      also lists an SDK integration through Google AdMob and Ad Manager and an IAB Europe retail
      media certification announcement, while a 2026 agency-program account describes education,
      certification, dedicated support, and closer product-team access. A current company-issued
      job repost reinforces that the operating model still includes human guidance on bidding,
      budgets, creative direction, root-cause diagnosis, and expansion. The evidence therefore
      supports a product-plus-services deployment model, but does not disclose implementation
      timelines, support SLAs, integration defect rates, or the level of customer engineering
      effort by interface.
    claimRefs: [CE008, CE014, CE015]
    tableRefs: [TE002]
  - id: maturity-differentiation-and-risk
    title: Maturity, differentiation, and technical risk
    body: >-
      Moloco's differentiation thesis is the combination of broad open-internet auction access,
      first-party signals, and a compound decision system. Its homepage describes CARA as
      coordinating models, agents, and specialized software across advertising domains, while the
      technical documentation gives concrete detail on the commerce-media prediction and auction
      loop. The principal underwriting limitation is observability: an independent 2026
      practitioner guide notes that Moloco has no public ad library and that bids, audiences,
      spend, and return data remain inside private advertiser accounts. That opacity prevents
      outside verification of model lift and makes customer-controlled experiments, raw event
      reconciliation, incrementality studies, and contract-level service records essential.
      Privacy evidence is also incomplete. Customer-instance data isolation and a partner account
      of regional data-sovereignty support are useful controls, but the retained materials do not
      provide audit reports, control scope, incident history, uptime history, recovery objectives,
      or model-governance documentation.
    claimRefs: [CE006, CE009, CE013, CE016]
callouts:
  - calloutType: risk
    title: Technical proof remains largely controlled by Moloco and its partners
    body: >-
      Validate production performance with customer event-level reconciliation, controlled
      incrementality tests, security reports, uptime records, and interface-specific implementation
      references before underwriting model lift or enterprise-grade reliability.
    claimRefs: [CE009, CE010, CE011, CE012, CE016]
tables:
  - id: TE001
    title: Product module and asset matrix
    columns:
      - Module or product line
      - Primary user
      - Status and maturity evidence
      - Differentiation
      - Diligence gap
    rows:
      - - Moloco Ads
        - App performance marketers
        - Active product on the current official site and company profile
        - AI-directed acquisition and retention across independent app inventory
        - Private campaign lift, latency, and customer-level outcome distribution
      - - Moloco Commerce Media
        - Retailers and marketplaces
        - Active product with current public technical documentation
        - Activates first-party commerce events for sponsored-ad monetization
        - Deployment mix, retailer retention, and realized monetization by cohort
      - - Sponsored Product, Search, Display, and Brands
        - Sellers, brands, and marketplace ad operators
        - Four documented Commerce Media campaign families
        - Multiple native placements and creative formats within one auction stack
        - Format-level availability and adoption vary by customer but are not disclosed
      - - Campaign management interfaces
        - Platform ad-operations and engineering teams
        - Stand-alone manager, embedded widget, and API options are documented
        - Lets customers choose between ready-made and custom operating surfaces
        - Integration effort, API limits, implementation time, and support SLA
      - - Streaming and OTT monetization
        - Streaming publishers and content owners
        - Described in a Google Cloud partner case study; current detail is limited
        - Extends performance-ad infrastructure beyond apps and retail media
        - Current feature scope, production references, and adoption scale
    notes: >-
      Status reflects only the retained official, technical-documentation, company-profile, and
      partner-case-study evidence accessed on 2026-10-20; it is not a complete SKU catalog.
    claimRefs: [CE001, CE002, CE003, CE004, CE008]
  - id: TE002
    title: Workflow and use-case table
    columns:
      - User job
      - Current workflow
      - Moloco solution
      - Measurable benefit in evidence
      - Limitation
    rows:
      - - Acquire and retain app users
        - Performance marketers define outcome and conversion signals
        - Moloco Ads selects and bids across independent app inventory
        - Official product copy states optimization toward ROAS, LTV, and re-engagement
        - No public campaign-level benchmark or external lift distribution
      - - Build a retailer ad business
        - Retailer supplies commerce events and sponsored placements
        - Commerce Media predicts relevance and runs real-time auctions
        - Partner case study reports more than 35,000 advertisers supported
        - Figure is partner-published and not independently audited
      - - Operate seller campaigns
        - Sellers configure products, creatives, budgets, and campaign types
        - Stand-alone manager, embedded widget, or customer-built API interface
        - Interface choice can preserve an existing seller portal
        - Implementation burden and error rates are not disclosed
      - - Run campaigns through an agency
        - Agency combines media strategy, creative, measurement, and optimization
        - Partner program adds education, certification, and dedicated support
        - More than a dozen founding agencies were reported across four regions
        - Program membership does not prove incremental campaign performance
    notes: >-
      Benefits are preserved as company or partner claims with their stated denominators; private
      customer performance and integration effort remain unavailable.
    claimRefs: [CE001, CE002, CE005, CE008, CE011, CE015]
  - id: TE003
    title: Technology and operating architecture
    columns:
      - Layer or component
      - Role
      - Key dependency
      - Principal risk
    rows:
      - - First-party event ingestion
        - Captures behavior, intent, context, searches, product views, and purchases
        - Complete, timely, correctly consented customer events
        - Weak event quality can degrade prediction and measurement
      - - Training and deployment pipelines
        - Continuously preprocess data, train models, and deploy predictions
        - Google Cloud data, compute, orchestration, and regional capacity
        - Cloud concentration, pipeline drift, and undocumented recovery objectives
      - - Online model serving
        - Produces relevance, click-through, and conversion predictions per impression
        - Low-latency feature retrieval and customer-instance isolation
        - Partner-reported speed is not a contractual availability guarantee
      - - Auction and bidding engine
        - Selects ads through first- or second-price auctions and CPC, CPM, or CPO bids
        - Accurate goals, budgets, conversion feedback, and inventory access
        - Automated decisions are difficult to audit from outside advertiser accounts
      - - Campaign and integration surfaces
        - Lets customers create, manage, and scale advertiser campaigns
        - Stand-alone UI, embedded widget, APIs, SDKs, and human enablement
        - Interface-specific limits, defects, implementation effort, and support SLA are unknown
    notes: >-
      Architecture is reconstructed from Moloco documentation and a Google Cloud partner case
      study; unverified internals, service levels, and control effectiveness are explicitly omitted.
    claimRefs: [CE005, CE006, CE007, CE008, CE009, CE014, CE015, CE016]
figures:
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Evidence-backed layers from customer signals through model coordination, auction decisioning,
      activation interfaces, and measured outcomes.
    data:
      layers:
        - label: Customer signal layer
          modules:
            - First-party user events
            - Search and product-view behavior
            - Purchases and conversion outcomes
        - label: Data and training layer
          modules:
            - Real-time behavioral-log ingestion
            - Data preprocessing
            - Continuous model training and deployment
        - label: Compound intelligence layer
          modules:
            - CARA model coordination
            - Specialized advertising software
            - Customer-instance training and inference
        - label: Online decision layer
          modules:
            - Relevance prediction
            - CTR and CVR prediction
            - Real-time auction and smart bidding
        - label: Activation layer
          modules:
            - Moloco Ads
            - Commerce Media ad formats
            - Campaign UI, widget, APIs, and SDK integrations
        - label: Customer outcome layer
          outputs:
            - User acquisition and retention goals
            - Retail-media advertiser performance
            - Publisher and marketplace monetization
    approximationNotes: >-
      This is a functional synthesis of the retained documentation, not a claim about undisclosed
      service boundaries, exact data flows, or physical infrastructure.
    claimRefs: [CE005, CE009, CE013, CE014, CE016]
