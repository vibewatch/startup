artifact: competitors
slug: moloco
runDate: 2026-10-20
company:
  name: Moloco
chapter:
  number: 3
  title: Competitors
  summary: >-
    Moloco competes across mobile performance advertising, commerce media, and streaming
    monetization, but its own positioning frames Google and Meta as complementary channels
    rather than products it replaces. The clearest differentiation is the combination of
    first-party-data activation, configurable auctions, and campaign-management deployment
    options; independent competitor pricing, win/loss, and switching evidence remains absent.
sections:
  - id: landscape-and-substitutes
    title: Landscape and buyer alternatives
    body: >-
      The relevant competitive set is broader than a list of demand-side platforms. Moloco Ads
      addresses performance marketers buying user acquisition across independent apps, while
      Moloco Commerce Media addresses retailers and marketplaces building their own sponsored-ad
      businesses.       Moloco itself says customers typically run its Ads product alongside Google and
      Meta rather than instead of them, making walled gardens both incumbents and complementary
      budget destinations. Independent directories describe Moloco across Ads, Commerce Media,
      and Streaming Monetization, but the assigned pool does not establish direct feature parity
      with named adtech peers. Internal build, retailer-native tooling, and manual or service-led
      operation remain status-quo substitutes because buyers can assemble auction, campaign, and
      first-party-data capabilities themselves.
    claimRefs: [CP001, CP002, CP006, CP010, CP015]
    tableRefs: [TP001]
  - id: capability-and-trust
    title: Capability differentiation and trust posture
    body: >-
      Moloco's strongest visible differentiation sits in commerce-media implementation depth.
      Its documentation covers sponsored products, search ads, sponsored display, and sponsored
      brands; configurable first- or second-price auctions; CPC, CPM, and CPO bidding; and three
      campaign-management paths spanning stand-alone software, embedded widgets, and APIs. The
      same documentation says machine-learning data, training, and inference are siloed within
      each customer instance. These claims indicate breadth and a privacy-oriented architecture,
      but they are company-issued and do not establish superiority over any named competitor.
      Moloco's newsroom also claims an IAB Europe retail-media certification, which is a useful
      trust signal but was not independently audited within the assigned evidence pool. Unsupported
      competitor cells are therefore shown as unknown rather than scored as inferior.
    claimRefs: [CP003, CP004, CP005, CP013]
    tableRefs: [TP002]
  - id: pricing-and-distribution
    title: Pricing, packaging, and distribution power
    body: >-
      Public pricing transparency is limited. Moloco says pricing varies by product, campaign
      goals, market, and advertising activity, and distinguishes performance-based Ads pricing
      from retailer-specific Commerce Media structures. A third-party tool directory only
      confirms a paid model and directs buyers to contact Moloco, while another directory labels
      the business SaaS or usage-based and targets enterprise and mid-market customers. A
      syndicated Moloco job description shows the commercial motion depends on account expansion,
      upsell, cross-sell, and negotiation of complex multi-product deals. The newsroom's agency
      partner program suggests Moloco is also widening distribution through intermediaries.
      None of these sources discloses list rates, minimum spend, take rates, discount bands, or
      contract duration, so the pricing comparison remains a model-level view rather than a
      normalized price benchmark.
    claimRefs: [CP007, CP008, CP009, CP011, CP012]
    tableRefs: [TP003]
  - id: moat-and-displacement
    title: Switching friction, moat durability, and displacement risk
    body: >-
      Commerce Media appears to create more implementation friction than a generic campaign seat:
      the platform ingests first-party event data, configures auction mechanics, supports seller
      campaign workflows, and can embed through widgets or APIs. That architecture may raise
      switching effort once it is integrated, but the retained sources provide no migration
      timelines, data-portability terms, renewal rates, contract lengths, or customer win/loss
      records. Moloco Ads faces a different durability test because the company presents it as an
      incremental channel alongside Google and Meta. In that setting, defensibility depends on
      sustained incremental performance and access to independent-app supply rather than exclusive
      control of advertiser budgets. The assigned pool contains no independent adverse benchmark,
      verified outage history, competitor response evidence, or comparative take-rate data.
      Underwriting should therefore treat the moat as plausible but unverified.
    claimRefs: [CP006, CP012, CP016]
    figureRefs: [FP001]
