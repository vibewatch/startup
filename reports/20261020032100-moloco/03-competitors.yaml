figures:
  - id: FP001
    title: Buyer control versus implementation burden
    type: quadrant
    summary: >-
      Analyst ordinal placement separates turnkey media buying from integrated commerce-media
      infrastructure; it is not a performance ranking or independent benchmark.
    data:
      xAxis:
        label: Buyer control over data and workflow
        min: 1
        max: 5
      yAxis:
        label: Implementation burden
        min: 1
        max: 5
      points:
        - label: Walled-garden media buying
          x: 2
          y: 1
          detail: "Turnkey archetype; competitor-specific implementation evidence was not retained."
        - label: Moloco Ads
          x: 3
          y: 2
          detail: "Managed performance product positioned as additive to Google and Meta."
        - label: Independent DSP category
          x: 4
          y: 2
          detail: "Archetype only; named-vendor feature and pricing evidence is unavailable."
        - label: MCM stand-alone manager
          x: 3
          y: 3
          detail: "Ready-to-use campaign manager with retailer first-party-data integration."
        - label: MCM widget or API
          x: 5
          y: 4
          detail: "Embedded or custom workflow with configurable auctions and campaign management."
        - label: Retailer internal build
          x: 5
          y: 5
          detail: "Structural substitute inferred from the capabilities a platform would otherwise assemble."
    approximationNotes: "Scores are 1–5 analyst ordinal judgments based only on visible control and deployment choices; they do not measure vendor quality, price, market share, or outcomes."
    claimRefs: [CP006, CP016]
callouts:
  - calloutType: risk
    title: Comparative evidence is the gating issue
    body: >-
      The pool supports Moloco product mapping but not a defensible named-vendor benchmark.
      Request contract-level pricing, renewal and migration data, and recent win/loss records
      before underwriting pricing power or durable displacement resistance.
    claimRefs: [CP007, CP016]
