  evidenceGaps:
    - type: enumeration-incomplete
      severity: material
      topic: competitor-profiles
      missingEvidence: Independent profiles for each named competitor covering current scale, funding, target customer, product scope, pricing, and strategic direction.
      whyItMatters: Without comparable profiles, the landscape cannot support vendor-level market-share, capability, or pricing conclusions.
      diligencePath: Obtain current competitor filings, official product and pricing pages, independent market reports, and customer procurement records for the named peer set.
      relatedQuestionRefs: [QP002]
      relatedTableRefs: [TP001]
    - type: missing-source
      severity: material
      topic: adverse-competition
      missingEvidence: Independent adverse evidence on Moloco displacement, commoditization, outages, weak outcomes, incumbent response, and recent competitive losses.
      whyItMatters: Company-issued product claims cannot establish durability or rule out deterioration in performance and channel access.
      diligencePath: Review independent mobile-ad benchmarks, customer reference calls, churn and win-loss records, incident logs, and competitor disclosures.
      relatedQuestionRefs: [QP010]
    - type: private-evidence-only
      severity: material
      topic: pricing
      missingEvidence: Contract-level list and realized pricing, minimum commitments, take rates, discount bands, renewal terms, and directly comparable competitor quotes.
      whyItMatters: Public model descriptions do not establish pricing power, total cost of ownership, or gross-margin resilience.
      diligencePath: Sample recent customer contracts and competitive RFPs across Moloco Ads and Commerce Media, normalized for spend, geography, and included services.
      relatedTableRefs: [TP003]
    - type: private-evidence-only
