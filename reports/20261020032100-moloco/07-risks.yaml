callouts:
  - calloutType: risk
    title: Do not infer a clean incident record
    body: >-
      The assigned pool did not contain a primary regulator docket, court record, or public incident
      history. That is an evidence gap, not proof that no enforcement action, litigation, outage, or
      breach has occurred.
    claimRefs:
      - CR008
      - CR012
  - calloutType: recommendation
    title: Investment gating package
    body: >-
      Require current audited financials, customer and infrastructure concentration schedules,
      product-level control reports, incident and SLO histories, and independent incrementality
      results before relying on scale, profitability, or performance claims.
    claimRefs:
      - CR001
      - CR004
      - CR007
      - CR016
