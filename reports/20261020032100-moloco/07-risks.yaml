schemaVersion: "report-v2"
artifact: risks
slug: moloco
runDate: 2026-10-20
company:
  name: Moloco
chapter:
  number: 7
  title: Risks
  summary: >-
    Moloco's broad geographic footprint and data-intensive advertising products make privacy,
    measurement governance, and service resilience the highest-impact risks visible in the
    assigned evidence. The evidence pool contains company-described controls but no regulator
    docket, court record, incident history, current audited financials, or concentration schedule,
    so the key risks remain diligence gates rather than evidence of a known enforcement action or
    outage.
sections:
  - id: risk-priorities
    title: Residual risk ranking
    body: >-
      The leading residual risk is privacy and measurement governance: Moloco says its products
      operate across more than 200 countries and territories, while a company LinkedIn post says a
      limited retail-media measurement scope was certified after an ABC UK audit. That is a useful
      mitigation signal, but it is not a substitute for the certificate, audit exceptions,
      jurisdiction-by-jurisdiction data-flow maps, or current regulator checks. Operational
      resilience ranks alongside it because Moloco describes reach across millions of apps and
      internally estimated audience metrics, while its engineering recruitment emphasizes
      scalability, availability, data quality, and compliance. These disclosures show that the
      control domains matter; they do not establish incident-free performance.
    claimRefs:
      - CR002
      - CR004
      - CR006
      - CR007
      - CR010
      - CR011
      - CR016
    figureRefs:
      - FR001
  - id: regulatory-and-legal
    title: Regulatory and legal exposure
    body: >-
      Moloco's public materials describe global operations, a general-counsel appointment, and
      retail-media certification. A low-reputation secondary source also reports SOC 2, ISO 27001,
      and GDPR alignment, but the assigned pool does not include the underlying reports or
      certificates. Accordingly, compliance posture is best treated as asserted and partially
      evidenced, not independently verified across all products. No conclusion should be drawn
      about whether litigation, enforcement, intellectual-property disputes, or reportable
      incidents exist outside this bounded source set. Before investment, counsel should obtain
      current regulator and court searches, the certification scope, subprocessor and transfer
      maps, privacy impact assessments, and any open remediation items.
    claimRefs:
      - CR006
      - CR007
      - CR008
      - CR009
      - CR012
    tableRefs:
      - TR001
  - id: operations-quality-and-security
    title: Operational, quality, and model risk
    body: >-
      Moloco's operating model depends on high-volume decisioning, data pipelines, and measurement
      that customers can trust. The company discloses that one reach metric is an internal estimate
      derived from five sample business days and calibration factors; this is a methodology
      disclosure, not independent validation. Company-authored engineering roles call out
      scalability, availability, data governance, and compliance as active responsibilities.
      Those are sensible mitigations, but the pool lacks service-level histories, recovery
      objectives, penetration-test summaries, model-drift thresholds, fraud-loss data, and a
      public incident record. Kill criteria should therefore be measurable: repeated material
      SLA misses, unresolved high-severity audit findings, or unexplained divergence between
      attributed and independently measured incremental outcomes.
    claimRefs:
      - CR002
      - CR004
      - CR010
      - CR011
      - CR013
      - CR015
      - CR016
    tableRefs:
      - TR002
  - id: dependencies-financial-and-thesis-breaks
    title: Dependencies, financial opacity, and thesis breaks
    body: >-
      The platform's disclosed reach depends on integrated exchanges and a proprietary SDK, while
      a secondary source reports use of Google Cloud components; the assigned evidence does not
      quantify provider concentration, failover coverage, or switching cost. Public pricing
      language does not establish customer concentration or contract durability. MoneyFM's
      valuation evidence concerns secondary share transactions, not new
      primary funding or cash available. The thesis should break if audited current financials
      cannot reconcile growth to cash generation, if top-customer or platform dependencies are
      materially concentrated without tested alternatives, or if independent incrementality work
      fails to substantiate company-reported performance.
    claimRefs:
      - CR001
      - CR003
      - CR013
      - CR014
      - CR015
      - CR016
    tableRefs:
      - TR003
tables:
  - id: TR001
    title: Regulatory / legal risk register
    columns:
      - Risk area
      - Jurisdiction or scope
      - Evidence status
      - Likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure
      - Diligence path
    rows:
      - - Privacy, consent, and cross-border data handling
        - More than 200 countries and territories claimed
        - Company profile plus secondary compliance summary; primary control reports absent
        - Medium
        - High
        - Partially evidenced
        - Product-level scope, exceptions, subprocessors, and transfer controls unverified
        - Obtain SOC 2 and ISO reports, data-flow maps, DPIAs, DPA templates, and regulator checks
      - - Retail-media measurement standards
        - On-site display and sponsored products across web, mobile, and in-app
        - Company says ABC UK audited certification against IAB Europe standards
        - Medium
        - High
        - Certification claimed; scope appears bounded
        - Other products, off-site measurement, and audit exceptions remain unverified
        - Review certificate, audit report, exceptions, renewal date, and product coverage
      - - Litigation, enforcement, and intellectual-property disputes
        - All operating jurisdictions
        - No primary docket or regulator record in the assigned pool
        - Unrated
        - Unrated pending primary checks
        - General counsel appointment is an organizational mitigation only
        - Unknown until direct searches and management disclosure are completed
        - Run court, regulator, patent, privacy-authority, sanctions, and enforcement searches
    notes: >-
      Partial enumeration of legal and regulatory risk domains visible in the assigned source
      pool; likelihood and severity are analytical assessments, and "unrated" means the necessary
      primary evidence was unavailable.
    enumerationScope:
      coverage: sample
      basis: >-
        Risk domains evidenced by the eight assigned prefetched sources as of the 2026-10-20 run
        date, not an exhaustive docket search.
    claimRefs:
      - CR006
      - CR007
      - CR008
      - CR009
      - CR012
  - id: TR002
    title: Operational, quality, and security risk register
    columns:
      - Failure mode
      - Evidence basis
      - Likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure
      - Monitor or kill criterion
    rows:
      - - Privacy or data-governance control failure
        - Engineering role explicitly calls for data accuracy, consistency, and compliance
        - Medium
        - High
        - Control responsibility disclosed; effectiveness unverified
        - Audit findings, consent propagation, and deletion performance are unknown
        - Stop if a material control gap remains open past its committed remediation date
      - - Service degradation at auction and pipeline scale
        - Company describes reach across millions of apps; engineering role emphasizes availability
        - Medium
        - High
        - Engineering ownership disclosed; SLO history absent
        - Recovery objectives, capacity headroom, and incident frequency are unknown
        - Stop if repeated material SLA misses or failed disaster-recovery tests appear
      - - Model drift, attribution bias, or overstated incrementality
        - Reach uses internal estimation; marketing materials cite large incremental-ROAS outcomes
        - Medium
        - High
        - Method notes and a bounded certification are disclosed
        - Independent replication across products and customer cohorts is unavailable
        - Stop if holdouts or third-party measurement fail to reproduce material uplift
      - - Product-expansion execution complexity
        - Company materials span apps, retail media, CTV, and international enterprise accounts
        - Medium
        - Medium
        - Specialized commercial and engineering hiring is visible
        - Roadmap load, quality trade-offs, and support burden are not quantified
        - Escalate if roadmap slippage coincides with rising severity-one incidents or churn
    notes: >-
      Risk ratings synthesize company disclosures and reposted company job descriptions; no
      incident log, SLO history, penetration-test report, or independent model validation was in
      the assigned pool.
    claimRefs:
      - CR002
      - CR004
      - CR010
      - CR011
      - CR015
      - CR016
  - id: TR003
    title: Partner, commercial, and financial dependency register
    columns:
      - Dependency
      - Counterparty or role
      - Evidence basis
      - Concentration
      - Failure scenario
      - Severity
      - Mitigation and residual exposure
    rows:
      - - Exchange and SDK distribution
        - Integrated exchange partners and Moloco proprietary SDK
        - Company methodology disclosure ties reach to both surfaces
        - Not disclosed
        - Inventory, signal, or publisher access degrades
        - High
        - Obtain exchange mix, SDK adoption, termination rights, and tested fallback routes
      - - Cloud and data infrastructure
        - Google Cloud services reported by a low-reputation secondary source
        - Secondary description only; architecture contract absent
        - Not disclosed
        - Capacity, regional, or vendor disruption impairs bidding and measurement
        - High
        - Confirm architecture, portability, committed spend, multi-region recovery, and exit plan
      - - Financial and valuation reference point
        - Investors and prospective shareholders
        - MoneyFM reports a US$2 billion secondary-transaction valuation; current audited metrics absent
        - Not applicable
        - Entry price anchors to a stale secondary mark without cash-flow support
        - High
        - Reconcile audited revenue, margin, cash, debt, dilution, preferences, and current secondary terms
    notes: >-
      Concentration is intentionally left as "not disclosed" where the assigned evidence provides
      no denominator; the 2023-era secondary valuation is not funding raised or cash available.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR013
      - CR016
