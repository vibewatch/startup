companyProfile:
  summary: >-
    Moloco is a founder-led private advertising-technology company founded in 2013. It markets AI-native performance
    acquisition through Moloco Ads and sponsored-ad infrastructure through Moloco Commerce Media, with company-reported
    reach across more than 2.9 million app bundles and more than 230 countries and territories. Public operating and
    partner evidence supports product breadth and technical scale, but current financial quality and investable
    transaction terms require private diligence.
