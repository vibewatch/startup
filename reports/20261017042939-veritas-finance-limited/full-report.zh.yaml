      - number: '3.2'
        title: 产品宽度和线下分销是最清晰的差异化
        blocks:
          - type: paragraph
            body: >-
              现有证据中，Veritas 最站得住脚的定位不是最低价放贷，而是为半城市和农村 MSME 借款人提供更宽的打包产品。官网和 media kit
              展示了农村经营、营运资金、房屋建设、商用车和新兴企业贷款的产品菜单；DRHP 同行表则显示，直接 MSME 同行按资产组合看明显更窄。这一范围由庞大的线下网络支撑：官网显示，截至 2026 年 3 月 31
              日，公司拥有 510+ 家分支机构和 231,752 名客户；同行比较显示，Veritas 的单网点 AUM 高于 Five-Star，但仍落后于 SBFC、Aavas 和 Aptus。因此，Veritas
              能在同一网点网络内解决更多借款需求，但尚未把产品宽度转化为行业领先的生产率。
            claimRefs:
              - CP003
              - CP004
              - CP006
              - CP007
              - CP009
              - CP010
              - CP011
              - CP016
