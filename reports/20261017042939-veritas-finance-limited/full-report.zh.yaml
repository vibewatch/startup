        - 只有披露价格、摊薄和申报后早期需求后，信心才会提升。
      - - 风险评级
        - High
        - FY2026 回报和 Stage 3 比率走弱，CARE 仍明确将 NNPA、ROTA 和杠杆率列为降级触发条件。
        - 相比资产质量干净、可比质量高的 IPO，需要更高的价格补偿和更严密的监测。
      - - 估值立场
        - 价格区间公布前未知
        - 申报文件披露了可比公司倍数区间，但没有 Veritas 的发行价或隐含发行人倍数。
        - 高于同业的定价视为偏贵；只有确认信贷稳定后，才评估任何折价。
      - - 决策含义
        - 等待 RHP，并以 P/B 纪律为锚
        - 业务原则上具备融资能力；未决问题是入场价格，而非特许经营基础是否存在。
        - 只有最终价格区间和发行后资本结构仍留有上行空间时才推进。
    notes: 分析师判断表以 IPO 定价缺失、FY2026 运营指标、CARE 触发条件和当前 Five-Star 公开可比数据为锚；表中结论是决策判断，不是公司指引。
    claimRefs:
      - CV004
      - CV006
      - CV008
      - CV014
      - CV015
      - CV016
  - id: TV002
    title: 正论 / 反论表
    columns:
      - 立场
      - 论点
      - 哪些变化会改变判断
    rows:
      - - 正论
        - 截至 2026 年 3 月 31 日，Veritas 已达到公开市场规模，借款人 231,752 名，AUM 约 ₹9,134 crore。
        - 如果借款人增长或 AUM 扩张明显放缓、利润率又没有改善，规模论点就会削弱。
      - - 正论
        - 资本和评级仍提供缓冲：CARE 将公司评级上调至 AA-/Stable，FY2026 申报文件显示 CRAR 为 33.19%。
        - 如果 Veritas 在 FY2027 期间维持这层缓冲，同时让 Stage 3 指标持平或改善，论点会更强。
      - - 反论
        - 盈利能力已不再明显达到公开市场可比公司的质量：FY2026 ROA 为 3.54%，而 Five-Star 为 7.27%、SBFC 为 4.58%。
        - 如果 Veritas 在不重新出现 Stage 3 劣化的情况下将 ROA 恢复到接近 4% 以上，反论会削弱。
      - - 反论
        - 由于 DRHP 留空发行价字段，且发起人持股基础仍大到足以影响减持结构，公开市场投资者仍缺少实时价格锚。
        - 如果 RHP 相对更强的上市同业折价定价，并缓解抛压担忧，反论会削弱。
    notes: 论点是对保留证据的分析综合，而非公司直接引语；每行均列出支撑该判断的事实主张。
    claimRefs:
      - CV004
      - CV005
      - CV007
      - CV009
      - CV010
      - CV014
      - CV015
  - id: TV003
    title: 牛市 / 基准 / 熊市情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 概率信号
      - 下行触发条件
    rows:
      - - 牛市
        - Stage 3 指标稳定、回报恢复，且新发股份所得资金支持有效放贷。
        - 披露的同业组高位 23.63x P/E 和 3.29x P/B 是上行参考上限；在 Veritas 缩小回报差距前，不能视为合理入场倍数。
        - 保守的价格区间、健康的基石需求，以及 FY2027 初期披露显示没有进一步恶化。
        - 尽管 ROA 更弱且盈利没有重新加速，却相对 Five-Star 溢价。
      - - 基准
        - Veritas 将 ROA 维持在 3% 中段附近，避免 Stage 3 再次激增，最终发行在募集新资本与二级流动性之间取得平衡。
        - 披露的同业平均值 18.39x P/E 和 2.62x P/B 是中性的市场参考；在没有 Veritas 价格区间前，不能据此得出公允价值结论。
        - 需求温和、一级与二级发行结构平衡，CRAR 或 Stage 3 门槛没有契约压力。
        - NNPA 趋势恶化并接近 CARE 的降级触发条件，或 OFS 叙事压过一级资本形成。
      - - 熊市
        - Veritas 尚未证明回报恢复，价格区间却寻求溢价；或 FY2027 信贷表现再次恶化。
        - 如果回报和资产质量差距持续，披露的同业低位 14.51x P/E 和 2.16x P/B 可作为下行参考点。
        - 激进营销、过度强调发起人减持，或除草案申报文件外没有新增披露。
        - ROTA 逼近 3% 以下、NNPA 逼近 2% 以上，或杠杆率升向 3x。
    notes: 情景参考采用 2026 年 7 月 DRHP 中上市同业的 P/E 和 P/B 区间，依据为 2026 年 7 月 27 日价格和 FY2026 经审计财务数据； 这些是基准，不是 Veritas 的目标价或回报预测。
    claimRefs:
      - CV004
      - CV006
      - CV008
      - CV009
      - CV014
      - CV015
      - CV016
