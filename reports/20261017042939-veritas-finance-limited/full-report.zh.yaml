      - number: '8.2'
        title: 运营证明真实存在，但盈利能力已经下滑
        blocks:
          - type: paragraph
            body: >-
              公司并非尚未证明业务。截至 2026 年 3 月 31 日，Veritas 报告借款人 231,752 名、AUM 约 ₹9,134 crore；其 2025 年 6 月 media kit
              显示，贷款组合已经超过 ₹7,477 crore，员工 7,854 人。CARE 于 2025 年 6 月将公司评级上调至 AA-/Stable，并称资本化状况健康；这与 FY2026 文件披露的 33.19%
              CRAR 和 2.36x 债务权益契约位置一致。问题不是 Veritas 是否已经做出有意义的有抵押 MSME 平台——它已经做到了。问题是，与一年前相比，当前运营画像以更低的回报和更高的 Stage 3
              比率进入公开市场，因此估值需要补偿这种恶化，而不能默认给予溢价倍数。
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV009
              - CV012
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV005
              - CV007
              - CV009
              - CV010
              - CV014
              - CV015
      - number: '8.3'
        title: 可比公司背景支持采用有纪律的情景区间
        blocks:
          - type: paragraph
            body: >-
              公开可比公司证据足以建立纪律框架，尽管还不足以确定价格。Veritas 自有同行表显示 FY2026 ROA 为 3.54%，低于 Five-Star 的 7.27% 和 SBFC 的
              4.58%；资产质量处于中等水平，而非灾难性水平。同一文件基于 2026 年 7 月 27 日价格和 FY2026 经审计财务数据，报告上市同行 P/E 区间为 14.51x-23.63x，P/B 区间为
              2.16x-3.29x。MoneyWorks4Me 另显示 Five-Star 的市净率为 1.96x，且其 FY2025-26
              经审计报表可通过公司投资者关系网站取得。这些是参照点，而不是目标价：在没有披露价格区间前，公开证据不支持为 Veritas 指定发行人倍数，也不支持把它当作顶级上市 MSME 放贷机构提前溢价买入。
            claimRefs:
              - CV004
              - CV010
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV006
              - CV008
              - CV009
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: 投资判断前的尽调门槛
        blocks:
          - type: paragraph
            body: >-
              下一步尽调不是继续扩大业务发现，而是等待缺失的公开定价信息，并检验 FY2026 的资产质量恶化是否已经稳定。CARE 明确将持续 NNPA 高于 2%、ROTA 低于 3% 和杠杆率高于 3x
              列为评级下调触发条件；文件还显示，发起人持股仍足够集中，减持结构依然重要。因此，投资委员会应在从跟踪转为投资前，要求最终 RHP、发行后股数、价格区间，以及对 FY2027
              逾期情况的最新判断。投资论点无需等到平台崩溃才会失效：激进的价格区间、以发起人套现为主的故事，或回报再次下滑，都足以违反入场纪律。
            claimRefs:
              - CV004
              - CV008
              - CV009
              - CV010
              - CV011
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 等 RHP 给出真实价格后再跟踪
            body: 该平台可信到值得继续列入名单，但还不可信到可以盲目定价。缺失的价格区间，以及相较头部公开同行更弱的 FY2026 回报，足以推迟投资判断。
            calloutType: recommendation
            claimRefs:
              - CV004
              - CV014
              - CV015
          - type: callout
            title: 同时观察 NNPA、ROTA 和杠杆率
            body: CARE 的下行触发条件明确了下一检查点：如果资产质量向 NNPA 高于 2% 恶化、盈利能力向 ROTA 低于 3% 下滑，同时杠杆上升，估值逻辑应收缩，而不是扩张。
            calloutType: risk
            claimRefs:
              - CV008
              - CV009
