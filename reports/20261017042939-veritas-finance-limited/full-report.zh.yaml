  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议：等市场形成出清价格后再跟进
        blocks:
          - type: paragraph
            body: >-
              当前证据支持“跟踪”建议，而不是立即投资。Veritas 已于 2026 年 7 月提交新的 DRHP，但文件仍将发行价、底价、上限价和 OFS
              总收益留空，因此公开市场投资者还无法用实时上市同行估值锚来检验该发行。缺少价格信号很重要，因为 Veritas 是在一次明显的交易重置后进入市场：2025 年 1 月 DRHP 规划了更大的已披露发行，而
              2026 年 7 月草案把新股发行缩小至 ₹9,000 million，并明确 OFS 股数，却没有给出最终现金金额。与此同时，公司从一个有意义的基础继续扩大，但 FY2026 ROA 为 3.54%，仍明显低于
              Five-Star 的 7.27%；因此需要证明的是定价纪律，而不只是业务质量。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV014
              - CV015
          - type: table
            tableRef: TV001
            claimRefs:
              - CV004
              - CV006
              - CV008
              - CV014
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
