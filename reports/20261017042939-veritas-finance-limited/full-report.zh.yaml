  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              Veritas 应被看作重线下运营的有抵押 MSME 放贷机构，而不是泛化的印度消费金融公司或综合金融科技平台。公司材料始终把核心任务定义为向未获充分满足的 MSME
              和自雇借款人提供信贷，产品覆盖农村经营贷款、营运资金贷款、平价住房及房屋建设贷款、二手商用车融资和新兴企业融资。这个边界包括由企业现金流、资产所有权和生计扩张驱动的业主型信贷需求，但不包括大型企业贷款、面向大众的无抵押消费金融，以及伪装成“金融服务
              TAM”的软件支出。实际替代集合很混合：私营银行和公共部门银行仍占据大量企业信贷，其他 NBFC 正在个体业主中提升份额；资料最不完整的借款人，现状可能仍是非正规信贷，甚至完全没有信贷。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: 市场规模视角与当前服务版图
        blocks:
          - type: paragraph
            body: >-
              本组证据中最干净的独立自上而下视角，是 CRIF High Mark-SIDBI 小企业信贷报告：截至 2025 年 9 月，印度小企业信贷敞口合计 ₹46 lakh crore，对应 7.3 crore
              个活跃贷款账户。这个数字可作为外部边界，但远宽于 Veritas 实际服务的市场，因为其中涵盖了公司并不瞄准的贷款机构、用途和借款人群体。Veritas 截至 2026 年 3 月披露的 ₹9,134 crore
              AUM，意味着其在这一宽泛信贷池中的份额仅约 0.20%；即便如此，也只是上限代理值，并非精确的
              SAM/SOM。更有决策价值的视角，是公司自己的资产组合：农村经营贷款仍占主导，平价住房和二手车融资越来越重要，而无抵押营运资金业务已被有意弱化。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
