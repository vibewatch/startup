      - number: '1.2'
        title: 管理层梯队已成形，但执行仍高度集中于创始人兼 CEO
        blocks:
          - type: paragraph
            body: >-
              公司治理比创始人中心化的品牌形象更制度化：2026 年 DRHP 称 Veritas
              由职业经理人管理且没有可识别的发起人；九人董事会由两名执行董事、四名独立董事（包括董事长）和三名投资人提名董事组成。即便如此，文件仍把对创始人兼 CEO D. Arulmany
              及更广泛高级管理团队的依赖列为风险。CARE 以 Arulmany 在金融服务领域超过 25 年的经历作为管理层可信度依据；2026 年 7 月任命 Prakash Rayen
              为全职董事，也说明公司仍在补强高管梯队。实际判断是，Veritas 拥有机构资本和董事会监督，但运营连续性与 IPO 执行仍明显系于创始人兼 CEO 及其身边的领导班子。
            claimRefs:
              - CO003
              - CO008
              - CO009
          - type: table
            tableRef: TO002
            claimRefs:
              - CO003
              - CO008
              - CO009
      - number: '1.3'
        title: 资本基础可信，但估值和最终 IPO 条款尚未确定
        blocks:
          - type: paragraph
            body: >-
              公司的资本故事强于估值故事。CARE 称公司截至 FY25 累计募得 ₹1,835 crore 股权资金，并单独将 FY25 的 ₹240 crore
              内部轮描述为一级和二级资金混合，因此不能把该轮全部计入一级资本。ICRA 2026 年 3 月的持股快照显示，机构股东基础广泛，由 Norwest、Multiples、Kedaara、Lok Capital 和
              British International Investment 领衔。不过，公司面向公开市场的准备仍在推进，并未完成。ET Legal 报道称，SEBI 于 2025 年 5 月就一宗 ₹2,800 crore
              IPO 提出意见，该方案包含 ₹600 crore 新股发行；但 2026 年 7 月重新提交的 DRHP 将结构改为最高 ₹900 crore 新股发行加 OFS，并可选择进行最高 ₹180 crore 的
              pre-IPO 配售。一份低置信度的二手资料仍引用 2024 年 9 月 $1.01 billion / ₹8,500 crore 估值，但保留的一级证据尚未给出有定价的 IPO 或更新后的私募市场估值。
            claimRefs:
              - CO010
              - CO011
              - CO012
              - CO013
              - CO016
          - type: table
            tableRef: TO003
            claimRefs:
              - CO010
              - CO011
              - CO012
              - CO013
      - number: '1.4'
        title: 里程碑路径清晰，当前观察点也很明确
        blocks:
          - type: paragraph
            body: >-
              对一家私人 NBFC 而言，公司的里程碑路径异常连贯：2015 年注册成立并取得 RBI 注册，随后进入新邦并多次完成股权融资；2022 年客户数达到 100,000；2024
              年进入车辆融资并转为公众公司；2026 年重新提交 IPO。这样的运营历史支持一个判断：Veritas 已越过影响早期尽调的身份风险门槛。当前概览层面的剩余风险，转而是信贷风险和集中度风险。ICRA 2026 年
              8 月的报告称，stage-3 资产率升至 2.5%，Tamil Nadu 仍约占 AUM 的 43%；Fortune India 对 RBI 2025 年 6 月《金融稳定报告》的回顾，则指向更严峻的 NBFC
              行业融资和资产质量环境。贯穿本报告的核心判断是：这是一家已规模化、但仍高度集中的 MSME 放贷机构，正处于更不宽松的信贷环境下，等待市场发现价格。
            claimRefs:
