      - number: '1.5'
        title: 展示项
        blocks:
          - type: callout
            title: 规模化机构，而非验证概念的放贷人
            body: 保留证据支持将 Veritas 视为有机构资本支持、能够反复获得资金的后期规模化 NBFC，而不是仍在验证产品市场契合度的新兴细分放贷机构。
            calloutType: insight
