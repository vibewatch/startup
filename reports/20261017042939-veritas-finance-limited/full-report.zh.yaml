              信贷质量是核心经济风险，因为两家评级机构都描述了近期恶化，尽管都还没有走到立即下调评级的程度。CARE 报告 FY2025 GNPA 和 NNPA 恶化；ICRA 称截至 2026 年 3 月，GS3 和 NS3
              在经历 2.9% 的阶段性峰值后仍高于上一年度。数据尚在可管理范围，但下行触发条件很明确：CARE 指出 NNPA 高于 2% 且 ROTA 低于 3% 的情形；ICRA
              则关注资产质量或盈利能力持续走弱并伴随杠杆率显著上升。集中度放大了这一信贷风险。ICRA 仍显示 Tamil Nadu 约占 AUM 的 43%，前三个邦合计约
