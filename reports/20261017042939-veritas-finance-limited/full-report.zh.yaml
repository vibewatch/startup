            body: >-
              主要运营依赖并不是传统制造或供应链问题，而是产品组合、获客渠道、催收基础设施和贷款机构准入。即使管理层因压力缩减了无抵押营运资金组合，Veritas
              仍持有相关敞口，自有材料也继续营销该产品。新增的平价住房和二手商用车业务目前约占 AUM 的 30%，已经足够重要，但还没有经历完整周期。其获客模式又增加了一层依赖：DSA 占 FY2026
              平价住房贷款发放的大多数，也占二手商用车贷款发放的大约一半。运营缓释措施确实存在——CARE 描述了带备份和业务连续性保障的供应商 MIS，DRHP 则指出数字催收率为
              95.31%，并使用技术驱动的早期预警系统——但这些控制仍需在规模上验证，因为渠道、供应商和催收失败，很可能先以经营行为问题或逾期迁徙暴露，而不是表现为一次性宕机。
            claimRefs:
              - CR008
              - CR011
              - CR012
              - CR013
          - type: table
            tableRef: TR003
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
      - number: '7.4'
        title: 缓释措施、监测项与退出标准
        blocks:
          - type: paragraph
            body: >-
              当前缓释措施可信，但不足以把公司归入低风险类别。评级仍处于投资级，流动性目前较强，公司也已收紧无抵押授信、推进数字化催收，并披露截至 DRHP 日最新 RBI
              澄清事项已无未解决意见。即便如此，只要四类监测项中任何一项恶化，投资论点都应迅速失效：第一，任何 RBI 处罚、未解决的检查升级或交易所合规问题；第二，资产质量未能稳定，尤其是将公司推向 CARE 的 NNPA
              和 ROTA 触发区间；第三，再融资压力，包括贷款机构多元化减弱、契约压力，或股权融资延迟导致增长越来越依赖债务；第四，证据显示 DSA
              主导的新产品或催收做法正在制造新的诉讼、误导销售或借款人压力点。因此，尽调应关注 2026 年 3 月后的 vintage 表现、案件级诉讼细节、渠道质量指标和最新合规测试，而不是历史网点增长 headline。
            claimRefs:
              - CR002
