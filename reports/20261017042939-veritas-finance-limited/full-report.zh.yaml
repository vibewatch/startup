      - number: '3.3'
        title: 护城河在执行，且容易受到融资与成熟度压力
        blocks:
          - type: paragraph
            body: >-
              可持续性问题不在于 Veritas
              能否说出同行名称，而在于更大或更专业的贷款机构回应后，其模式是否仍有吸引力。文件称，半城市地区的定价、网点覆盖、客户服务、产品广度和技术驱动的效率是主要战场；这是一条执行护城河，而不是专有产品护城河。CARE 和
              ICRA 都以有竞争力的借款利率和多元化产品支持其正面论据，但也强调了限制：融资仍高度依赖银行，新增的平价住房和车辆融资资产组合尚未成熟。独立行业报道又提出警告：如果银行继续收紧对 NBFC 的支持，而
              Aptus 或 Five-Star 等专业机构继续实现更高盈利，Veritas 的优势就可能收窄为服务质量和本地化授信，而不是结构性受保护的利差。
            claimRefs:
              - CP003
              - CP008
              - CP012
              - CP013
              - CP014
              - CP015
      - number: '3.4'
        title: 展示项
        blocks:
          - type: callout
            title: 产品宽度是 Veritas 的第一道防线
            body: Veritas 可以在一个网点网络内向借款人提供农村 MSME、营运资金、房屋建设和车辆融资产品，而本组证据中的直接 MSME 同行仍按产品组合明显更窄。
            calloutType: strength
            claimRefs:
              - CP002
              - CP006
