chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、法律地位与运营版图
        blocks:
          - type: paragraph
            body: >-
              Veritas Finance 于 2015 年 4 月在 Chennai 注册成立，2015 年 10 月取得 RBI 的 NBFC 注册，并于 2024 年 10 月从 Veritas Finance
              Private Limited 转为 Veritas Finance Limited，随后在 2025 年 2 月取得新的 RBI
              证书。这段沿革很关键：它说明公司已处于后期、但仍未上市的公众公司阶段，而不是刚起步的创业期。运营模式仍围绕未获充分满足的 MSME
              和自雇借款人展开，以有抵押小企业贷款为核心，并延伸至平价住房、无抵押营运资金和二手商用车。独立的 2026 年报道支持其已具备相当规模，但也显示它本质上仍是印度 MSME 信贷平台，而非高度多元化的零售贷款机构。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO006
              - CO007
