      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              买方、用户和付款方通常是同一个经济主体：自雇人士或微型企业业主，决定是否以企业或家庭相关抵押品借款，用于补充营运资金、扩大业务、建房或购买商用车。这一点很重要，因为采用路径并非纯数字自助；Veritas
              当前流程仍依赖电话、应用或网点受理、现场人员核验和较快审批，这更适合缺乏完整正式资料的客户，而不是完全自动化的授信。第三方分类和员工规模证据进一步说明，这是一种分布式运营模式，市场触达依赖本地网点密度、人员产能和催收纪律，而不只是品牌营销或软件转化。
            claimRefs:
              - CM003
              - CM008
              - CM011
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM011
              - CM016
      - number: '2.4'
        title: 增长驱动、采用约束与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              采用顺风确实存在：独立市场数据指向组合持续扩张、借款人正规化、NBFC 在个体业主中的重要性上升，以及 Telangana、Andhra Pradesh、West Bengal 等邦和前 100
              大城市之外地区尤其强劲的信贷动能。但这些顺风并没有消除 Veritas 把 TAM 转成可盈利增长时面临的核心约束。信贷压力集中在无抵押营运资金和无抵押 MSME
              敞口；目标借款人可能是首次借贷且信用档案很薄；网点网络仍高度集中，管理层仍计划在现有邦连续扩张，而不是一步跨入实质性新市场。最大的剩余尽调缺口，是一份符合 Veritas
              有抵押、半城市/农村、业主主导市场定义的公开 SAM/SOM 估算，而不是泛泛的印度 MSME 信贷 headline。
            claimRefs:
              - CM012
              - CM013
              - CM014
              - CM015
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 宽泛 TAM 不等于可投资市场
            body: 印度小企业信贷池很大，但 Veritas 的实际可服务市场是有抵押产品、业主型借款人、线下授信和相邻地理区域的窄交集；如果不作调整，泛化的 MSME 信贷 TAM 会高估近期上行空间。
            calloutType: insight
            claimRefs:
              - CM005
              - CM008
              - CM009
              - CM010
          - type: callout
            title: 采用上限取决于信贷质量，而不只是需求
            body: 需求增长和正规化有助于获客放款，但估值取决于 Veritas 能否持续扩张，同时不重演独立评级机构已提示的无抵押营运资金压力和地域集中。
            calloutType: risk
            claimRefs:
              - CM012
              - CM013
              - CM014
              - CM015
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: Veritas 同时面对直接同行、专业机构和现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Veritas 的公开文件定义的竞争范围，比简单的 MSME-NBFC 同行集合更广。在核心 MSME 和小企业贷款领域，文件将 Five-Star Business Finance 和 SBFC
              列为主要上市竞争者；而新增的平价住房和二手商用车产品，则使 Aavas、Aptus、SK Finance 和 Kogta
              成为更有参考意义的对象。这很关键，因为买方常常是在选择产品匹配度、资料负担和还款设计，而不只是选择品牌。替代方案也真实存在：银行资金成本更低、零售资产质量更好；当授信或 EMI
              结构不适配农村现金流时，非正规放贷仍是兜底。在实际竞争中，Veritas 既面对专注型上市同行，也面对僵化的银行信贷和昂贵的非正规融资这一现状。
            claimRefs:
              - CP001
              - CP002
              - CP010
              - CP014
              - CP015
