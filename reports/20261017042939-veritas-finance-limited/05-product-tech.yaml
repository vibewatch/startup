company:
  name: Veritas Finance Limited
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Veritas Finance delivers a branch-led, field-assisted lending product set for
    underserved MSME and affordable-housing borrowers rather than a software-led
    self-serve platform. Public evidence shows a reasonably mature operating stack
    around origination, servicing, collections, cloud analytics, disaster recovery,
    and ISO 27001 controls, but only thin external disclosure on APIs, uptime,
    vendor concentration, and security-control scope.
sections:
  - id: product-scope
    title: Product scope is broad, but still centered on collateral-backed MSME credit
    body: >-
      The documented product set is broader than a single MSME loan SKU. Veritas'
      current public surfaces show rural business loans, working-capital loans,
      home-construction loans, commercial-vehicle loans, and an emerging-enterprise
      category, while third-party credit documents split the operating book into
      MSME Rural, MSME Urban, and home-loan buckets. The common thread is still
      small-ticket credit for self-employed or semi-urban borrowers, with secured
      lending dominating the disclosed operating model and unsecured working-capital
      lending carved out as a narrower sub-segment. The product architecture is
      therefore best understood as a multi-vertical lending franchise that uses
      product segmentation to widen addressable borrower jobs without abandoning its
      core secured-MSME identity.
    claimRefs: [CE001, CE002, CE003]
    tableRefs: [TE001]
  - id: borrower-workflow
    title: Delivery is phygital and branch-dependent rather than app-only
    body: >-
      Veritas presents customer acquisition as digital-assisted but not digitally
      self-contained. Borrowers can start by phone, app, or branch, yet verification
      still depends on field-officer visits and branch-level appraisal, and the
      service-centre network is explicitly used for loan servicing, collections, and
      customer-service functions. Independent rating commentary reinforces that
      borrower selection, property valuation, KYC, income assessment, and recovery
      are embedded in the branch-and-field model. That makes the customer workflow
      scalable in geographies where formal data is patchy, but it also means product
      quality and speed depend on dense on-ground operations rather than on software
      alone.
    claimRefs: [CE004, CE005, CE006, CE007]
    tableRefs: [TE002]
  - id: operating-stack
    title: The operating stack covers the full loan life cycle, with public disclosure focused on control points
    body: >-
      The strongest technical evidence is operational rather than developer-facing.
      The DRHP says Veritas uses technology across sourcing, credit assessment, loan
      management, risk, customer service, collections, accounting, and analytics,
      with proprietary tools such as a risk score card, cloud-based repositories,
      software-as-a-service products, and mobile applications. CARE separately says
      the company uses third-party MIS software from loan origination through NPA
      management, supported by data-centre infrastructure, business-continuity
      safeguards, and a centralized back office. Taken together, the evidence points
      to a fairly mature internal lending stack, but one where the public record
      reveals process coverage and resilience measures more clearly than named
      vendors, integration patterns, or measurable performance.
    claimRefs: [CE008, CE009, CE010]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: controls-and-risks
    title: Security and compliance controls are disclosed, but technical transparency remains limited
    body: >-
      Veritas discloses meaningful control signals: the homepage advertises ISO
      27001 certification, the DRHP says the company had no known data breaches in
      FY2024-FY2026, and the same filing describes real-time cloud disaster
      recovery, anti-malware protection, and compliance obligations under RBI's IT
      Governance Directions. The risk disclosures are equally important: the company
      says uninterrupted integrated systems are required to run the business, warns
      that internal systems may miss suspicious transactions or non-compliance, and
      notes that future cyber or process failures could trigger operational, legal,
      and reputational damage. Because the assigned evidence pool contains no public
      API/docs surface, uptime reporting, or detailed certification scope, the main
      underwriting issue is not whether controls exist, but how deeply outsiders can
      verify them.
    claimRefs: [CE010, CE011, CE012]
callouts:
  - calloutType: insight
    title: Veritas is a phygital lender, not a software-only originator
    body: >-
      The evidence consistently shows digital intake, mobile tools, and analytics
      wrapped around field visits, branch appraisal, and service-centre servicing,
      which is better described as a branch-enabled operating model than as a pure
      fintech workflow.
    claimRefs: [CE004, CE005, CE008]
  - calloutType: risk
    title: Public tech disclosure is thinner than the operational dependence on the stack
    body: >-
      Veritas discloses meaningful controls and continuity mechanisms, but the
      public record still lacks product-doc, uptime, and vendor-level transparency
      that would let an external diligence team test resilience beyond management
      assertions and rating-agency summaries.
    claimRefs: [CE009, CE011, CE012]
tables:
  - id: TE001
    title: Product module / asset matrix
    columns:
      - Module / product line
      - Primary user / borrower job
      - Status / maturity
      - Differentiation
      - Diligence gap
    rows:
      - [Rural business loans, Rural micro and small businesses seeking working or growth capital, Active core product, High overlap with field-underwritten secured MSME model and long tenure, Public pool does not disclose portfolio share or approval funnel by product]
      - [Working capital loans, Urban MSME borrowers needing short-duration unsecured liquidity, Active but narrower and risk-managed sub-segment, Explicitly separated as MSME Urban and described as unsecured working-capital exposure, Need current yield loss-rate and repeat-borrower data by unsecured cohort]
      - [Home construction loans, Self-employed or informal-income households building homes, Active established vertical, Included in MSME Rural and repeatedly referenced in securitization/rating documents, Need documented average ticket size and turnaround time by geography]
      - [Used or commercial vehicle loans, Small transport operators and agriculture or construction users buying vehicles, Newer vertical scaling since FY2024, Adds collateralized asset-backed exposure outside core small-business loans, Need current branch rollout and asset-quality disclosure for vehicle book]
      - [Emerging enterprises loans, Larger small businesses needing higher-ticket growth capital, Publicly marketed on homepage, Broadens ticket-size range beyond micro-loan positioning, No public underwriting criteria or live-book size in assigned evidence]
    notes: >-
      Mixes company-issued product marketing with third-party categorization; rows
      reflect public product labels, not audited portfolio-share disclosures.
    claimRefs: [CE001, CE002, CE003]
  - id: TE002
    title: Workflow / use-case table
    columns:
      - User job
      - Current workflow
      - Company solution
      - Measurable benefit
      - Limitation
    rows:
      - [Start a loan application, Borrower reaches branch or contacts lender through phone/app, Application can begin by phone app or branch, Company markets 48-hour approval on homepage, No independent SLA evidence for end-to-end disbursal]
      - [Verify borrower identity and business, Informal borrowers often need in-person validation, Field officer visit plus KYC and document collection, Preserves underwriting in low-data environments, Raises cost-to-serve and branch dependency]
      - [Assess collateral and repayment capacity, Branch teams visit premises and review practical business indicators, Branch-level appraisal with credit legal and technical support, Fits secured MSME and housing products with local context, Public evidence does not quantify decision-engine automation rate]
      - [Service and recover live loans, Borrowers need servicing follow-up and collections support after disbursal, Service centres handle servicing feedback and collections with ACH DDM and digital payment support, Broadens reach beyond full branch format, Public pool does not show cure-rate or digital self-service adoption]
    notes: >-
      Benefits and limitations combine explicit company claims with operating-model
      implications drawn from CARE and DRHP process descriptions.
    claimRefs: [CE004, CE005, CE006, CE007]
  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / component
      - Role
      - Dependency
      - Risk
    rows:
      - [Lead and sourcing tools, Capture borrower intake and pipeline, Mobile applications branch staff and borrower-facing intake, Outage or poor UX would slow origination in field-heavy geographies]
      - [Credit and risk tools, Support assessment pricing and decision workflow, Proprietary risk score card credit processes and collateral checks, Public evidence does not reveal model governance false-positive rates or override controls]
      - [Core loan-servicing and MIS layer, Manage origination servicing collections and NPA workflow, Third-party vendor MIS plus centralized back-office operations, Vendor concentration or migration difficulty is not disclosed publicly]
      - [Analytics and data repositories, Reporting analytics and centralized data handling, Cloud-based reporting platform and central repositories, Limited external visibility into data lineage retention and access controls]
      - [Resilience and security controls, Protect continuity recovery and information security, Real-time cloud DR anti-malware protection ISO 27001 and RBI IT governance compliance, No public uptime metrics incident postmortems or control-scope detail in assigned pool]
    notes: >-
      Architecture is reconstructed only from disclosed lifecycle functions and
      control statements; vendor names, interface patterns, and performance metrics
      are not public in the assigned evidence.
    claimRefs: [CE008, CE009, CE010, CE011, CE012]
