callouts:
  - calloutType: "insight"
    title: "Scaled institution, not a proof-of-concept lender"
    body: >-
      Retained evidence supports treating Veritas as a scaled late-stage NBFC
      with institutional sponsorship and repeat access to capital, rather than
      as an emerging niche lender still proving product-market fit.
    claimRefs: ["CO006", "CO007", "CO010", "CO011"]
  - calloutType: "risk"
    title: "IPO timing is ahead of final price discovery"
    body: >-
      The refresh confirms that the listing process is active, but it does not
      yet produce a priced equity reference point or final OFS structure, so
      headline unicorn valuation language should still be handled as
      provisional.
    claimRefs: ["CO012", "CO013", "CO016"]
