company:
  name: "Veritas Finance Limited"
chapter:
  number: 1
  title: "Company Overview"
  summary: >-
    Veritas Finance has scaled from a 2015 Chennai NBFC launch into a
    professionally managed, PE-backed MSME lender preparing for an IPO. By
    March 2026, ICRA said the company had ₹9,134 crore of AUM, 2.32 lakh active
    customers, 8,329 employees, and 511 operating touchpoints (444 branches
    plus 67 service centres) across 11 states and union territories, but the
    same independent coverage also flagged rising stage-3 assets and persistent
    geographic concentration.
sections:
  - id: "identity-and-footprint"
    title: "Identity, legal status, and operating footprint"
    body: >-
      Veritas Finance was incorporated in Chennai in April 2015, received its
      RBI NBFC registration in October 2015, and converted from Veritas Finance
      Private Limited into Veritas Finance Limited in October 2024 with a fresh
      RBI certificate issued in February 2025. That chronology matters because
      it places the current business in a late-stage but still unlisted public
      company posture rather than a fresh venture phase. The operating model is
      still anchored in underserved MSME and self-employed borrowers, with
      secured small-business lending as the core and adjacent products in
      affordable housing, unsecured working capital, and used commercial
      vehicles. Independent 2026 coverage supports meaningful scale, but it
      also shows the company is still fundamentally an Indian MSME credit
      franchise rather than a broadly diversified retail lender.
    claimRefs: ["CO001", "CO002", "CO003", "CO004", "CO005", "CO006", "CO007"]
    tableRefs: ["TO001"]
  - id: "leadership-and-governance"
    title: "Leadership depth exists, but execution still concentrates around the founder-CEO"
    body: >-
      Governance is more institutionalized than founder-centric branding might
      suggest: the 2026 DRHP states that Veritas is professionally managed and
      has no identifiable promoter, and its nine-member board combines two
      executives, four independent directors including the chair, and three
      investor nominees. Even so, the filing itself identifies dependence on
      founder-CEO D. Arulmany and the wider senior team as a risk. CARE anchors
      management credibility to Arulmany's 25-plus years in financial services,
      while the July 2026 appointment of Prakash Rayen as a whole-time director
      shows continuing executive-bench development. The practical read is that
      Veritas has institutional capital and board oversight, but operating
      continuity and IPO execution remain meaningfully tied to the founder-CEO
      and his immediate leadership bench.
    claimRefs: ["CO003", "CO008", "CO009"]
    tableRefs: ["TO002"]
  - id: "capitalisation-ownership-and-ipo"
    title: "Capital base is credible; valuation and final IPO terms are not yet"
    body: >-
      The capital story is stronger than the valuation story. CARE says the
      company had cumulatively raised ₹1,835 crore of equity funding through
      FY25 and separately describes the ₹240 crore FY25 internal round as a mix
      of primary and secondary proceeds; the round therefore cannot be added
      wholesale to primary capital. ICRA's March 2026 ownership snapshot shows
      a broad institutional shareholder base led by Norwest, Multiples, Kedaara,
      Lok Capital, and British International Investment. Public-market
      readiness, however, is still in motion rather than complete. ET Legal
      reported SEBI observations in May 2025 for a ₹2,800 crore IPO built
      around a ₹600 crore fresh issue, but the July 2026 DRHP refile shifted
      the structure to an up-to-₹900 crore fresh issue plus an OFS and an
      optional pre-IPO placement of up to ₹180 crore. A low-confidence
      secondary profile still cites a September 2024 $1.01 billion / ₹8,500
      crore valuation, but retained primary evidence does not yet provide a
      priced IPO or updated private-market mark.
    claimRefs: ["CO010", "CO011", "CO012", "CO013", "CO016"]
    tableRefs: ["TO003"]
  - id: "milestones-and-watchpoints"
    title: "The milestone arc is clear, and so are the current watchpoints"
    body: >-
      The documented milestone path is unusually coherent for a private NBFC:
      incorporation and RBI registration in 2015, expansion into new states and
      repeated equity rounds thereafter, 100,000 customers by 2022, vehicle
      finance and public-company conversion in 2024, and a refiled IPO in 2026.
      That operating history supports the view that Veritas has already crossed
      the identity-risk threshold that affects early-stage diligence. The
      remaining overview risks are instead credit and concentration risks.
      ICRA's August 2026 note says gross stage-3 assets rose to 2.5% and that
      Tamil Nadu still accounted for about 43% of AUM, while Fortune India's
      recap of RBI's June 2025 Financial Stability Report points to a tougher
      sector funding and asset-quality backdrop for NBFCs more broadly. For the
      rest of the report, the reusable ground truth is a scaled but still
      concentrated MSME lender heading toward price discovery under less
      forgiving credit conditions.
    claimRefs: ["CO001", "CO002", "CO004", "CO006", "CO007", "CO010", "CO012", "CO013", "CO014", "CO015"]
    figureRefs: ["FO001"]
