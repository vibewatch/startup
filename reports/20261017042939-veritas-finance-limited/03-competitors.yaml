  evidenceGaps:
    - type: missing-source
      severity: material
      topic: public-pricing
      missingEvidence: Public APR, fee, and collateral schedules for Five-Star, SBFC, Aavas, Aptus, SK, and Kogta at the product level.
      whyItMatters: Without public product-level pricing, the chapter can compare realized yields and packaging but cannot make an apples-to-apples borrower price comparison.
      diligencePath: Collect current product brochures or pricing disclosures for each named peer and rebuild TP003 with true customer-visible pricing.
      relatedQuestionRefs: [QP004]
      relatedTableRefs: [TP003]
    - type: private-evidence-only
      severity: material
      topic: switching-cost
      missingEvidence: Win-loss, refinance, repeat-borrower, and cross-sell retention data showing whether borrowers actually stay with Veritas across product lines.
      whyItMatters: Product breadth only becomes a durable moat if it reduces churn or multi-homing against banks and specialist NBFCs.
      diligencePath: Request cohort retention, refinance-out, and multi-product attachment data by branch vintage and borrower segment.
      relatedQuestionRefs: [QP005, QP009]
    - type: missing-source
      severity: minor
      topic: internal-build-and-status-quo
      missingEvidence: Public evidence on co-lending, direct bank competition win rates, and internal-build substitutes for the same borrower jobs.
      whyItMatters: The chapter can frame banks and informal lenders as substitutes, but it cannot quantify how often they beat Veritas on price or approval speed.
      diligencePath: Gather bank MSME product sheets, channel-partner comparisons, and Veritas branch-level win-loss logs against bank and informal alternatives.
      relatedQuestionRefs: [QP007]
