callouts:
  - calloutType: strength
    title: Breadth is Veritas's first line of defense
    body: >-
      Veritas can present a borrower with rural MSME, working-capital,
      home-construction, and vehicle-finance products inside one branch
      footprint, while the direct MSME peers in the assigned evidence stay much
      narrower by product mix.
    claimRefs: [CP002, CP006, CP010]
  - calloutType: risk
    title: Funding remains the incumbent choke point
    body: >-
      CARE still shows 71.30% of funding coming from banks at December 2025,
      while independent reporting says bank lending growth to NBFCs slowed
      sharply; if that tightens further, cheaper-funded incumbents gain
      leverage.
    claimRefs: [CP012, CP014]
  - calloutType: insight
    title: The moat is localized underwriting, not a proprietary product
    body: >-
      Both Veritas's DRHP and a competitor-authored Moneyboxx commentary point
      to the same battleground: branch reach, local underwriting judgment, and
      repayment design for rural cash flows, which are execution advantages but
      also easier for capable rivals to copy than a unique technology standard.
    claimRefs: [CP003, CP015]
