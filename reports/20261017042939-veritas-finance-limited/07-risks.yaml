    notes: >-
      This register mixes portfolio-quality and operating-control risks because, for a retail
      lender, the first visible sign of an operational miss is often a collections or delinquency
      spike rather than a stand-alone outage disclosure.
    claimRefs: [CR004, CR005, CR006, CR007, CR008, CR009, CR012, CR013]
  - id: TR003
    title: Partner / dependency risk register
    columns:
      - Dependency
      - Counterparty
      - Role
      - Concentration
      - Failure scenario
      - Severity
      - Mitigation
      - Residual exposure
    rows:
      - [Core funding base, Banks and NBFC/FI lenders, Term loans and working funding, Top 5 lenders 38.28% and top 10 lenders 56.55% of borrowings; bank/NBFC-FI loans 76% of mix, Tighter pricing or withdrawn lines raise liquidity and covenant pressure, High, Current liquidity and undrawn lines provide buffer, Medium-High]
      - [Channel partners in newer products, DSAs, Affordable-home-loan and used-CV origination, 72.42% of FY2026 AHL disbursements and 50.72% of FY2026 UCV disbursements, Mis-selling or weak sourced-book quality damages growth and conduct metrics, Medium-High, In-house underwriting and digital KYC remain key checks, Medium]
      - [Operating systems vendors, Third-party MIS providers, Loan origination through NPA management, Single-workflow dependency not numerically disclosed, Vendor outage or control failure disrupts servicing and collections, Medium, "CARE cites backup, disaster recovery, and business continuity safeguards", Medium]
      - [Equity-market access, IPO and public-market investors, Planned capital augmentation, ICRA cites a sizeable IPO plan while debt remains large, Delayed equity raise leaves growth more debt-funded and more rate-sensitive, Medium-High, Current capitalisation is comfortable today, Medium]
    notes: >-
      Counterparty concentration is highest in funding, but the channel and systems dependencies
      matter because they are the most likely route through which conduct, quality, or scaling
      problems would emerge.
    claimRefs: [CR010, CR011, CR012, CR013]
