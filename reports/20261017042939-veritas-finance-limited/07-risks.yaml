  researchQuestions:
    - id: QR001
      question: What publicly evidenced regulatory and legal issues could force supervisory or
        reputation damage before or around listing?
      type: verification
      targets: [contentRequirements/0, contentRequirements/1, contentRequirements/5]
      status: answered
    - id: QR002
      question: Are there already disclosed litigation or collections-conduct issues that could
        escalate into a harder thesis-break event?
      type: adverse
      targets: [contentRequirements/0, contentRequirements/1, contentRequirements/5]
      status: answered
    - id: QR003
      question: How much did asset quality weaken through FY2025 and FY2026, and what rating
        thresholds define a clear downside turn?
      type: quantification
      targets: [contentRequirements/0, contentRequirements/4, contentRequirements/5]
      status: answered
    - id: QR004
      question: Does geographic concentration leave the portfolio exposed to correlated
        state-specific shocks or regulatory friction?
      type: adverse
      targets: [contentRequirements/2, contentRequirements/3, contentRequirements/5]
      status: answered
    - id: QR005
      question: How concentrated is the funding base, and how exposed is the model to tighter bank
        liquidity or covenant pressure?
      type: quantification
      targets: [contentRequirements/0, contentRequirements/3, contentRequirements/4]
      status: answered
    - id: QR006
      question: Do newer products and DSA-heavy origination channels create execution risks that
        are not yet fully seasoned in the book?
      type: adverse
      targets: [contentRequirements/0, contentRequirements/3, contentRequirements/5]
      status: answered
    - id: QR007
      question: Which controls materially mitigate operating, collections, and technology risks,
        and how mature do they look from public evidence?
      type: mechanism
      targets: [contentRequirements/0, contentRequirements/2, contentRequirements/5]
      status: answered
    - id: QR008
      question: What fresh 2026 evidence shows whether the MSME borrower environment is getting
        better or worse for Veritas's served segments?
      type: freshness
      targets: [contentRequirements/2, contentRequirements/4, contentRequirements/5]
      status: answered
