      - [Unsecured working-capital book re-accelerates losses, DRHP still shows 4.93% of AUM in unsecured WCL and CRIF flags working-capital loans as a key monitorable segment, Medium-High, High, Medium, Medium-High, Need current cohort performance and approval-policy changes since March 2026]
      - [Geographic concentration amplifies local shocks, Tamil Nadu and top-three-state concentration remain high with no new-state diversification planned, High, Medium-High, Low-Medium, Medium-High, Need district-level concentration and state-level collections trend data]
