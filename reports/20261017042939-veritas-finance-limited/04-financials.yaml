schemaVersion: report-v2
artifact: financials
slug: veritas-finance-limited
runDate: 2026-10-17
company:
  name: Veritas Finance Limited
chapter:
  number: 4
  title: Financials
  summary: >-
    Veritas remains a profitable spread lender with FY2026 public disclosures showing
    ₹9,134.29 crore of AUM, ₹1,848.60 crore of revenue, ₹330.39 crore of PAT, and
    33.19% CRAR. The public picture is directionally solid on capital and liquidity,
    but profitability is moderating as the book shifts toward lower-yielding housing
    and vehicle products while unsecured stress keeps credit costs elevated. The
    biggest underwriting blockers are missing realized pricing, CAC/payback,
    concentration, and segment-level margin disclosure.
sections:
  - id: revenue-model-and-public-traction
    title: Revenue model and public traction
    body: >-
      Public evidence supports a straightforward NBFC revenue model: Veritas earns
      spread income by originating secured and selectively unsecured small-ticket
      loans, carrying those loans on balance sheet, and converting AUM growth into
      interest income and PAT. The company discloses broad product categories,
      ticket sizes, tenors, and high-level growth metrics, but not the realized
      yields or pricing waterfall by product. That means the chapter can validate
      scale and mix direction, but not whether reported revenue quality is driven by
      sustainable pricing, temporary mix effects, or one-time liability advantages.
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI015]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: unit-economics-and-cost-structure
    title: Unit economics and cost structure
    body: >-
      Public rating-agency coverage is enough to show the direction of Veritas's
      unit economics even though it is not enough to fully underwrite them. The
      loan mix has been rotating toward affordable housing and used commercial
      vehicles, which rating agencies explicitly describe as lower-yielding than the
      legacy secured MSME book. At the same time, unsecured working-capital stress
      increased slippages and write-offs, so the company is carrying both mix-driven
      margin pressure and credit-cost pressure. Operating leverage is improving, but
      the public record still lacks CAC, payback, borrower cohort profitability, and
      realized pricing by channel or product.
    claimRefs: [CI006, CI007, CI008, CI014, CI015, CI016]
    tableRefs: [TI003]
  - id: capital-liquidity-and-funding
    title: Capital, liquidity, and funding dependence
    body: >-
      Veritas is not capital-starved today, but it remains balance-sheet dependent
      and therefore funding-sensitive. ICRA's March 2026 snapshot shows liquidity
      coverage that is nearly sufficient for the next half year's scheduled debt
      repayments even before advance collections, while the DRHP shows CRAR well
      above RBI minimums. The caveat is that growth still consumes regulatory
      capital, and management is using the IPO primarily as fresh lending capacity
      rather than for operating repair. That makes funding conditions, liability
      diversification, and the timing of the equity raise central to the forward
      underwriting case.
    claimRefs: [CI009, CI010, CI011, CI012, CI013]
  - id: verdict-and-diligence-blockers
    title: Financial verdict and diligence blockers
    body: >-
      The financial verdict is mixed but not broken. Veritas has real scale, solid
      profitability, and a large capital cushion for an MSME-focused NBFC, yet the
      business is clearly moving from hyper-growth into a more constrained phase in
      which product-mix choices, liability pricing, and collections discipline will
      determine returns. Public evidence supports the conclusion that margin path and
      capital intensity are still manageable, but not that they are already
      de-risked. Before underwriting an IPO valuation, diligence still needs
      management-level disclosure on realized yields, acquisition efficiency,
      concentration, and how incremental IPO capital will be deployed by product and
      geography.
    claimRefs: [CI007, CI011, CI012, CI013, CI015]
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current value/status
      - Quality
      - Diligence ask
    rows:
      - [Secured MSME / rural business loans, Interest income on balance-sheet loans, Loan principal and spread over cost of funds, "Core historical franchise; secured MSME was 56% of FY2025 AUM", Strongest evidenced stream, Confirm realized yield and loss-rate by vintage and geography]
      - [Working capital loans, Interest income on unsecured working-capital loans, Loan principal and spread over cost of funds, "Unsecured share reduced to ~5% of AUM by March 2026 after stress", Lower-quality stream because slippages pressured credit costs, Request segment yield and collections by cohort]
      - [Home construction / affordable housing loans, Interest income on longer-tenor secured loans, Loan principal and spread over cost of funds, "~21% of AUM by March 2026 per ICRA", Mix-growing but lower yielding than legacy MSME, Request product margin after funding and servicing cost]
      - [Used commercial vehicle loans, Interest income on vehicle-backed loans, Loan principal and spread over cost of funds, "~9% of AUM by March 2026; launched in FY2024", Growth option with limited seasoning, Request delinquencies and realized ROA by product]
      - [Emerging enterprises loans, Interest income on larger-ticket enterprise loans, Loan principal and spread over cost of funds, "Public website lists product and ticket size, but no disclosed contribution to AUM or revenue", Visibility still weak, Request AUM mix and realized yield]
    notes: Public evidence supports the product menu and mix direction, but not product-level realized yield or contribution margin.
    claimRefs: [CI001, CI002, CI005, CI006]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Product / lever
      - Public unit / contract terms
      - Public pricing visibility
      - Realized pricing status
      - Source
      - Implication
    rows:
      - [Rural business loans, "₹1 lakh-₹50 lakh; up to 12 years", Interest rate not publicly disclosed, Unknown, Public website, Ticket and tenor are public but spread quality is not]
      - [Working capital loans, "₹1 lakh-₹5 lakh; 36 months", Interest rate not publicly disclosed, Unknown, Public website, Hardest product to underwrite because unsecured stress is known but yield is not]
      - [Home construction loans, "₹5 lakh-₹50 lakh; up to 20 years", Interest rate not publicly disclosed, Unknown, Public website, Lower-yielding mix shift is visible before exact rate disclosure]
      - [Commercial vehicle loans, "₹1 lakh-₹50 lakh; 12-60 months", Interest rate not publicly disclosed, Unknown, Public website, Newer book can boost growth while compressing yield]
      - [Pricing framework, CARE says Veritas uses risk-based pricing, Product-level rate cards and discounts are not public, Unknown, CARE, Internal pricing discipline exists but cannot yet be audited externally]
    notes: Veritas discloses loan size and tenor examples plus a risk-based-pricing statement, but no public realized lending rates, discounting, or take-rate detail.
    claimRefs: [CI002, CI015, CI016]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value / public status
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - [PAT / AMA (FY2026), 3.4%, High, Best public profitability proxy for the lending book after credit costs, Confirm segment-level ROA and bridge from FY2025]
      - [Credit cost / AMA (FY2026), 2.1%, High, Shows how much unsecured stress and write-offs are absorbing spread income, Request product-wise credit cost and write-off cohorts]
      - [Operating expense / AMA (FY2026), 6.4%, Medium, Indicates branch productivity and operating leverage, Provide acquisition and servicing cost by channel]
      - [ROTA (FY2025), 3.98%, High, Confirms profitability was already moderating before FY2026 closed, Reconcile FY2025 ROTA to FY2026 PAT/AMA and loan-mix changes]
      - [CRAR (March 2026), 33.19%, High, Defines balance-sheet headroom before the IPO, Show internal capital trigger by growth scenario]
      - ["Cash + liquid investments + undrawn lines vs H1 FY2027 debt repayments", "₹1,870 crore vs ₹1,885 crore", Medium, Best public near-term liquidity proxy, Provide monthly ALM ladder and committed collection assumptions]
      - [Debt / equity (Dec. 31 2025), 2.20, Medium, Interim leverage check before FY2026 year-end close, Reconcile to March 2026 managed gearing]
      - [CAC / payback, Not publicly disclosed, Low, Missing sales-efficiency data blocks comparison with other scaling lenders, Provide branch-vintage CAC and payback by product]
    notes: Metrics mix public reported values with explicit disclosure gaps; blank or unavailable economics should not be read as zero.
    claimRefs: [CI007, CI008, CI009, CI012, CI014, CI015]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: Veritas converts balance-sheet funding into product-specific AUM, then into interest income, while credit costs and opex determine retained profitability.
    data:
      nodes:
        - id: funding
          label: Funding stack
          value: "Bank/NBFC/FI loans 76%; NCDs 13%; securitisation 11%"
          note: Liability mix remained funding-dependent as of March 2026.
        - id: capital
          label: Capital base
          value: "CRAR 33.19%; net worth ₹3,126.88 crore"
          note: Regulatory capital creates lending capacity and absorbs losses.
        - id: origination
          label: Origination engine
          value: "510+ branches; officer-assisted application flow"
          note: Physical branch network and field verification remain central to throughput.
        - id: products
          label: Loan products
          value: MSME secured, working capital, home construction, used CV, emerging enterprises
          note: Mix is widening toward lower-yielding housing and vehicle categories.
        - id: aum
          label: Loan book / AUM
          value: "₹9,134.29 crore FY2026"
          note: AUM is the balance-sheet base that generates spread income.
        - id: revenue
          label: Total revenue
          value: "₹1,848.60 crore FY2026"
          note: Public evidence supports revenue scale but not product-level take rates.
        - id: costs
          label: Credit costs and opex
          value: "2.1% credit cost; 6.4% opex / AMA"
          note: Margin pressure comes from mix shift and unsecured slippage.
        - id: profit
          label: PAT and retained capital
          value: "₹330.39 crore FY2026"
          note: Profits replenish capital but the IPO is still framed as growth capital.
      edges:
        - from: funding
          to: origination
          relationship: Funds branch-led lending capacity
        - from: capital
          to: origination
          relationship: Supports RBI capital compliance
        - from: origination
          to: products
          relationship: Converts sourcing into product-specific disbursements
        - from: products
          to: aum
          relationship: Disbursements season into on-book assets
        - from: aum
          to: revenue
          relationship: Interest income and fees arise from the loan portfolio
        - from: revenue
          to: costs
          relationship: Credit losses and operating expenses consume spread income
        - from: costs
          to: profit
          relationship: Residual earnings become PAT
    approximationNotes: Public sources support the directional bridge but not product-level conversion rates or exact realized spreads.
    claimRefs: [CI002, CI003, CI007, CI010, CI012]
callouts:
  - calloutType: strength
    title: Capital buffer is real, not theoretical
    body: The DRHP and ICRA both show capital well above regulatory minimums, so the immediate question is not solvency but how efficiently new capital is deployed.
    claimRefs: [CI009, CI011, CI012]
  - calloutType: risk
    title: Margin compression is coming from both mix and credit
    body: Veritas is shifting into lower-yielding housing and used-CV books at the same time that unsecured stress has lifted credit costs, so profitability can still erode even with continued AUM growth.
    claimRefs: [CI006, CI007, CI008]
  - calloutType: insight
    title: The IPO is a growth-capacity event, not an operational turnaround
    body: Fresh proceeds are earmarked for onward lending, which suggests management sees regulatory capital and balance-sheet capacity as the binding constraint rather than a need to plug current losses.
    claimRefs: [CI011, CI012]
