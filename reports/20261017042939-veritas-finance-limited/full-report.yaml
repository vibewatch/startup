  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              Veritas should be analyzed as a field-heavy secured MSME lender, not as a generic Indian consumer-finance
              or broad fintech platform. Company materials consistently describe the core job as supplying credit to
              underserved MSME and self-employed borrowers, with products spanning rural business loans, working-capital
              loans, affordable/home-construction loans, used commercial vehicle finance, and emerging-enterprise
              finance. That boundary includes proprietor-led credit demand tied to business cash flow, asset ownership,
              and livelihood expansion; it excludes large-corporate lending, unsecured mass consumer finance, and
              software spend masquerading as "financial services TAM." The practical substitute set is mixed: private
              banks and public-sector banks still dominate much enterprise credit, other NBFCs are gaining share among
              sole proprietors, and for the weakest-documented borrowers the status quo can still be informal credit or
              no credit at all.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: Sizing lenses and current served footprint
        blocks:
          - type: paragraph
            body: >-
              The cleanest independent top-down lens in the assigned pool is the CRIF High Mark-SIDBI small-business
              credit report, which places aggregate Indian small-business credit exposure at ₹46 lakh crore with 7.3
              crore active loan accounts as of September 2025. That figure is a useful outer boundary, but it is much
              broader than Veritas's own served market because it spans lenders, use cases, and borrower cohorts that
              the company does not target. Veritas's reported AUM of ₹9,134 crore as of March 2026 therefore implies
              only about a 0.20% share of that broad credit pool, and even that is an upper-bound proxy rather than a
              precise SAM/SOM. The more decision-useful lens is the company's own portfolio mix: rural business loans
              remain dominant, while affordable housing and used-CV lending are increasingly important and unsecured
              working capital has been intentionally de-emphasised.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM008
              - CM009
      - number: '2.3'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The primary buyer, user, and payer is usually the same economic actor: a self-employed or micro-enterprise
              proprietor deciding whether to borrow against business or household-linked collateral to fund working
              capital, business expansion, home construction, or commercial vehicle acquisition. That matters because
              the adoption path is not pure digital self-serve; Veritas's own current journey still depends on
              phone/app/branch intake, field-officer verification, and relatively rapid approval, which is more
              compatible with customers lacking fully formal documentation than with fully automated underwriting.
              Third-party classification and employee-scale evidence reinforce that this is a distributed operating
              model whose market access depends on local branch density, officer productivity, and collection discipline
              rather than only on brand marketing or software conversion.
            claimRefs:
              - CM003
              - CM008
              - CM011
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM011
              - CM016
      - number: '2.4'
        title: Growth drivers, adoption constraints, and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              Adoption tailwinds are real: independent market data points to continued portfolio expansion, borrower
              formalisation, rising NBFC relevance among sole proprietors, and particularly strong credit momentum in
              states such as Telangana, Andhra Pradesh, and West Bengal as well as beyond-top-100 locations. But those
              tailwinds do not remove the core constraints on Veritas's conversion of TAM into profitable growth. Credit
              stress has clustered in unsecured working capital and unsecured MSME exposures, target borrowers can be
              new-to-credit and thin-file, and the branch network remains geographically concentrated with management
              still planning contiguous expansion in existing states rather than a step-function jump into materially
              new markets. The biggest remaining diligence gap is a public SAM/SOM estimate that matches Veritas's
              secured, semi-urban/rural, proprietor-led market definition rather than the much broader Indian
              MSME-credit headline.
            claimRefs:
              - CM012
              - CM013
              - CM014
              - CM015
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Broad TAM is not the investable market
            body: >-
              India's small-business credit pool is large, but Veritas's actual addressable market is the narrower
              intersection of secured products, proprietor-led borrowers, field underwriting, and contiguous geography,
              so generic MSME-credit TAM figures would overstate near-term upside if used without adjustment.
            calloutType: insight
            claimRefs:
              - CM005
              - CM008
              - CM009
              - CM010
          - type: callout
            title: The adoption ceiling is credit quality, not demand alone
            body: >-
              Demand growth and formalisation help origination, but valuation depends on whether Veritas can keep
              expanding without recreating the unsecured-working-capital stress and geographic concentration that
              independent ratings agencies already flag.
            calloutType: risk
            claimRefs:
              - CM012
              - CM013
              - CM014
              - CM015
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Veritas competes across direct peers, specialists, and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              Veritas's public filing defines a broader competitive field than a simple MSME-NBFC peer set. In core MSME
              and small-business lending, it points to Five-Star Business Finance and SBFC as the primary listed
              competitors, while its newer affordable-housing and used-commercial-vehicle products move it into lanes
              where Aavas, Aptus, SK Finance, and Kogta are the more relevant reference points. That matters because the
              buyer is often choosing a product fit, documentation burden, and repayment design rather than a brand
              alone. The substitute set is also real: banks still have cheaper funding and better retail asset quality,
              while informal lenders remain the fallback when underwriting or EMI structures do not fit rural cash-flow
              patterns. In practice, Veritas is competing against both focused listed peers and the status quo of rigid
              bank credit or expensive informal finance.
            claimRefs:
              - CP001
              - CP002
              - CP010
              - CP014
              - CP015
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP005
              - CP014
              - CP015
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP008
              - CP010
              - CP012
              - CP015
      - number: '3.2'
        title: Product breadth and field distribution are the clearest differentiators
        blocks:
          - type: paragraph
            body: >-
              Veritas's most defensible positioning in the assigned evidence is not lowest-price lending but a broader
              packaged offering for semi-urban and rural MSME borrowers. The website and media kit show a public menu
              spanning rural business, working-capital, home-construction, commercial-vehicle, and emerging-enterprise
              loans, while the DRHP peer tables show that direct MSME peers are materially narrower by portfolio mix.
              That scope is supported by a large field footprint: the company website shows 510+ branches and 231,752
              customers as of March 31, 2026, and the peer comparison places Veritas ahead of Five-Star on AUM per
              branch even though it still trails SBFC, Aavas, and Aptus on that efficiency proxy. The implication is
              that Veritas can serve more borrower jobs within the same branch network, but it has not yet turned that
              breadth into best-in-class productivity.
            claimRefs:
              - CP003
              - CP004
              - CP006
              - CP007
              - CP009
              - CP010
              - CP011
              - CP016
          - type: table
            tableRef: TP002
            claimRefs:
              - CP004
              - CP006
              - CP007
              - CP008
              - CP009
              - CP016
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP004
              - CP008
              - CP009
      - number: '3.3'
        title: The moat is executional and vulnerable to funding and seasoning pressure
        blocks:
          - type: paragraph
            body: >-
              The durability question is less about whether Veritas can name its peers and more about whether its model
              stays attractive as larger or more specialized lenders respond. The filing says pricing for semi-urban
              sectors, branch reach, customer service, product breadth, and technology-driven efficiency are the
              relevant battlegrounds; that is an execution moat, not a proprietary product moat. CARE and ICRA both
              support the positive side of that argument by describing competitive borrowing rates and a diversified
              product set, but they also underline the limits: funding remains heavily dependent on banks, and the newer
              affordable-housing and vehicle-finance books are still unseasoned. Independent sector reporting adds
              another warning: if banks keep tightening support to NBFCs while specialists such as Aptus or Five-Star
              continue to post stronger profitability, Veritas's advantage can narrow into service quality and localized
              underwriting rather than a structurally protected spread.
            claimRefs:
              - CP003
              - CP008
              - CP012
              - CP013
              - CP014
              - CP015
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Breadth is Veritas's first line of defense
            body: >-
              Veritas can present a borrower with rural MSME, working-capital, home-construction, and vehicle-finance
              products inside one branch footprint, while the direct MSME peers in the assigned evidence stay much
              narrower by product mix.
            calloutType: strength
            claimRefs:
              - CP002
              - CP006
              - CP010
          - type: callout
            title: Funding remains the incumbent choke point
            body: >-
              CARE still shows 71.30% of funding coming from banks at December 2025, while independent reporting says
              bank lending growth to NBFCs slowed sharply; if that tightens further, cheaper-funded incumbents gain
              leverage.
            calloutType: risk
            claimRefs:
              - CP012
              - CP014
          - type: callout
            title: The moat is localized underwriting, not a proprietary product
            body: >-
              Both Veritas's DRHP and a competitor-authored Moneyboxx commentary point to the same battleground: branch
              reach, local underwriting judgment, and repayment design for rural cash flows, which are execution
              advantages but also easier for capable rivals to copy than a unique technology standard.
            calloutType: insight
            claimRefs:
              - CP003
              - CP015
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and public traction
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports a straightforward NBFC revenue model: Veritas earns spread income by originating
              secured and selectively unsecured small-ticket loans, carrying those loans on balance sheet, and
              converting AUM growth into interest income and PAT. The company discloses broad product categories, ticket
              sizes, tenors, and high-level growth metrics, but not the realized yields or pricing waterfall by product.
              That means the chapter can validate scale and mix direction, but not whether reported revenue quality is
              driven by sustainable pricing, temporary mix effects, or one-time liability advantages.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
              - CI015
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI005
              - CI006
          - type: table
            tableRef: TI002
            claimRefs:
              - CI002
              - CI015
              - CI016
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI002
              - CI003
              - CI007
              - CI010
              - CI012
      - number: '4.2'
        title: Unit economics and cost structure
        blocks:
          - type: paragraph
            body: >-
              Public rating-agency coverage is enough to show the direction of Veritas's unit economics even though it
              is not enough to fully underwrite them. The loan mix has been rotating toward affordable housing and used
              commercial vehicles, which rating agencies explicitly describe as lower-yielding than the legacy secured
              MSME book. At the same time, unsecured working-capital stress increased slippages and write-offs, so the
              company is carrying both mix-driven margin pressure and credit-cost pressure. Operating leverage is
              improving, but the public record still lacks CAC, payback, borrower cohort profitability, and realized
              pricing by channel or product.
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI014
              - CI015
              - CI016
          - type: table
            tableRef: TI003
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI012
              - CI014
              - CI015
      - number: '4.3'
        title: Capital, liquidity, and funding dependence
        blocks:
          - type: paragraph
            body: >-
              Veritas is not capital-starved today, but it remains balance-sheet dependent and therefore
              funding-sensitive. ICRA's March 2026 snapshot shows liquidity coverage that is nearly sufficient for the
              next half year's scheduled debt repayments even before advance collections, while the DRHP shows CRAR well
              above RBI minimums. The caveat is that growth still consumes regulatory capital, and management is using
              the IPO primarily as fresh lending capacity rather than for operating repair. That makes funding
              conditions, liability diversification, and the timing of the equity raise central to the forward
              underwriting case.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The financial verdict is mixed but not broken. Veritas has real scale, solid profitability, and a large
              capital cushion for an MSME-focused NBFC, yet the business is clearly moving from hyper-growth into a more
              constrained phase in which product-mix choices, liability pricing, and collections discipline will
              determine returns. Public evidence supports the conclusion that margin path and capital intensity are
              still manageable, but not that they are already de-risked. Before underwriting an IPO valuation, diligence
              still needs management-level disclosure on realized yields, acquisition efficiency, concentration, and how
              incremental IPO capital will be deployed by product and geography.
            claimRefs:
              - CI007
              - CI011
              - CI012
              - CI013
              - CI015
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Capital buffer is real, not theoretical
            body: >-
              The DRHP and ICRA both show capital well above regulatory minimums, so the immediate question is not
              solvency but how efficiently new capital is deployed.
            calloutType: strength
            claimRefs:
              - CI009
              - CI011
              - CI012
          - type: callout
            title: Margin compression is coming from both mix and credit
            body: >-
              Veritas is shifting into lower-yielding housing and used-CV books at the same time that unsecured stress
              has lifted credit costs, so profitability can still erode even with continued AUM growth.
            calloutType: risk
            claimRefs:
              - CI006
              - CI007
              - CI008
          - type: callout
            title: The IPO is a growth-capacity event, not an operational turnaround
            body: >-
              Fresh proceeds are earmarked for onward lending, which suggests management sees regulatory capital and
              balance-sheet capacity as the binding constraint rather than a need to plug current losses.
            calloutType: insight
            claimRefs:
              - CI011
              - CI012
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product scope is broad, but still centered on collateral-backed MSME credit
        blocks:
          - type: paragraph
            body: >-
              The documented product set is broader than a single MSME loan SKU. Veritas' current public surfaces show
              rural business loans, working-capital loans, home-construction loans, commercial-vehicle loans, and an
              emerging-enterprise category, while third-party credit documents split the operating book into MSME Rural,
              MSME Urban, and home-loan buckets. The common thread is still small-ticket credit for self-employed or
              semi-urban borrowers, with secured lending dominating the disclosed operating model and unsecured
              working-capital lending carved out as a narrower sub-segment. The product architecture is therefore best
              understood as a multi-vertical lending franchise that uses product segmentation to widen addressable
              borrower jobs without abandoning its core secured-MSME identity.
            claimRefs:
              - CE001
              - CE002
              - CE003
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
      - number: '5.2'
        title: Delivery is phygital and branch-dependent rather than app-only
        blocks:
          - type: paragraph
            body: >-
              Veritas presents customer acquisition as digital-assisted but not digitally self-contained. Borrowers can
              start by phone, app, or branch, yet verification still depends on field-officer visits and branch-level
              appraisal, and the service-centre network is explicitly used for loan servicing, collections, and
              customer-service functions. Independent rating commentary reinforces that borrower selection, property
              valuation, KYC, income assessment, and recovery are embedded in the branch-and-field model. That makes the
              customer workflow scalable in geographies where formal data is patchy, but it also means product quality
              and speed depend on dense on-ground operations rather than on software alone.
            claimRefs:
              - CE004
              - CE005
              - CE006
              - CE007
          - type: table
            tableRef: TE002
            claimRefs:
              - CE004
              - CE005
              - CE006
              - CE007
      - number: '5.3'
        title: The operating stack covers the full loan life cycle, with public disclosure focused on control points
        blocks:
          - type: paragraph
            body: >-
              The strongest technical evidence is operational rather than developer-facing. The DRHP says Veritas uses
              technology across sourcing, credit assessment, loan management, risk, customer service, collections,
              accounting, and analytics, with proprietary tools such as a risk score card, cloud-based repositories,
              software-as-a-service products, and mobile applications. CARE separately says the company uses third-party
              MIS software from loan origination through NPA management, supported by data-centre infrastructure,
              business-continuity safeguards, and a centralized back office. Taken together, the evidence points to a
              fairly mature internal lending stack, but one where the public record reveals process coverage and
              resilience measures more clearly than named vendors, integration patterns, or measurable performance.
            claimRefs:
              - CE008
              - CE009
              - CE010
