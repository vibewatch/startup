        - Do not underwrite before the final RHP publishes a real clearing price.
      - - Confidence
        - Medium
        - Scale and capital are visible, but the exact entry multiple is not.
        - Confidence can improve only after price, dilution, and early post-filing demand are disclosed.
      - - Risk rating
        - High
        - >-
          Returns and Stage 3 ratios weakened in FY2026, and CARE keeps explicit downgrade triggers around NNPA, ROTA,
          and gearing.
        - Require price compensation and tighter monitoring than for a clean comp-quality IPO.
      - - Valuation stance
        - Unknown pending the price band
        - The filing discloses peer-multiple ranges, but no Veritas offer price or implied issuer multiple.
        - Treat above-peer pricing as stretched; evaluate any discount only after confirming credit stabilization.
      - - Decision implication
        - Wait for RHP and anchor on P/B discipline
        - The business is fundable in principle; the open issue is entry price, not franchise existence.
        - Advance only if the final price band and post-issue capitalization leave room for upside.
    notes: >-
