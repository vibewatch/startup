  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: 'Recommendation: track until the market-clearing price exists'
        blocks:
          - type: paragraph
            body: >-
              The current evidence supports a track recommendation, not an invest-now call. Veritas has filed a fresh
              July 2026 DRHP, but the document still leaves the offer price, floor price, cap price, and total OFS
              proceeds blank, so public investors cannot yet test the issue against live listed-peer valuation anchors.
              That missing price signal matters because Veritas is coming to market after a visible deal reset: the
              January 2025 DRHP outlined a larger disclosed offer, while the July 2026 draft narrows the fresh issue to
              ₹9,000 million and specifies an OFS share count without a final cash amount. In parallel, the company is
              scaling from a meaningful base, but FY2026 ROA of 3.54% still sits well below Five-Star's 7.27%, so the
              burden of proof is on pricing discipline rather than on business quality alone.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV014
              - CV015
          - type: table
            tableRef: TV001
            claimRefs:
              - CV004
              - CV006
              - CV008
              - CV014
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV009
              - CV014
              - CV015
              - CV016
      - number: '8.2'
        title: Operating proof is real, but profitability has drifted
        blocks:
          - type: paragraph
            body: >-
              The business is not pre-proof. As of March 31, 2026, Veritas reported 231,752 borrowers and roughly ₹9,134
              crore of AUM, and its June 2025 media kit showed a franchise already above ₹7,477 crore of loan book with
              7,854 employees. CARE upgraded the company to AA-/Stable in June 2025 and described a healthy
              capitalization profile, which is consistent with the FY2026 filing's 33.19% CRAR and 2.36x debt-to-equity
              covenant position. The issue is not whether Veritas has built a meaningful secured-MSME platform; it has.
              The issue is that the operating profile is arriving in the public market with weaker returns and higher
              Stage 3 ratios than a year earlier, so valuation needs to compensate for that deterioration rather than
              assume a premium multiple by default.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV009
              - CV012
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV005
              - CV007
              - CV009
              - CV010
              - CV014
              - CV015
      - number: '8.3'
        title: Comparable context argues for disciplined scenario bands
        blocks:
          - type: paragraph
            body: >-
              Public-comp evidence is sufficient to frame discipline, even if it is not yet sufficient to clear the
              price. Veritas' own peer table shows FY2026 ROA at 3.54%, below Five-Star at 7.27% and SBFC at 4.58%,
              while asset quality is middling rather than catastrophic. The same filing reports a listed-peer P/E range
              of 14.51x-23.63x and P/B range of 2.16x-3.29x, using July 27, 2026 prices and FY2026 audited financials.
              Separately, MoneyWorks4Me displayed Five-Star at 1.96x book, with audited FY2025-26 statements available
              through the company's investor-relations site. These are reference points rather than a price target:
              without a disclosed price band, public evidence does not support assigning Veritas an issuer multiple or
              paying up as though it were already a top-tier listed MSME lender.
            claimRefs:
              - CV004
              - CV010
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV006
              - CV008
              - CV009
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: Diligence gates before underwriting
        blocks:
          - type: paragraph
            body: >-
              The next diligence step is not broader business discovery; it is waiting for the missing public pricing
              inputs and testing whether FY2026 asset-quality slippage has stabilized. CARE explicitly flags sustained
              NNPA above 2%, ROTA below 3%, and gearing above 3x as downgrade triggers, and the filing shows sponsor
              ownership remains concentrated enough that selldown structure still matters. That combination means the
              investment committee should demand the final RHP, post-offer share count, price band, and an updated read
              on FY2027 delinquencies before moving from track to invest. A thesis break would not require franchise
              collapse: an aggressive price band, a sponsor-heavy monetization story, or another step down in returns
              would be enough to fail entry discipline.
            claimRefs:
              - CV004
              - CV008
              - CV009
              - CV010
              - CV011
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Track until the RHP publishes a real price
            body: >-
              The franchise is credible enough to keep on the list, but not credible enough to price blind. The missing
              price band and weaker FY2026 returns versus top public peers are enough to defer an underwriting call.
            calloutType: recommendation
            claimRefs:
              - CV004
              - CV014
              - CV015
          - type: callout
            title: Watch NNPA, ROTA, and gearing together
            body: >-
              CARE's downside triggers make the next checkpoint explicit: if asset quality weakens toward NNPA above 2%
              and profitability drifts toward ROTA below 3% while leverage rises, the valuation case should compress
              rather than expand.
            calloutType: risk
            claimRefs:
              - CV008
              - CV009
