  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Veritas converts balance-sheet funding into product-specific AUM, then into interest income, while credit costs
      and opex determine retained profitability.
    data:
      nodes:
        - id: funding
          label: Funding stack
          value: Bank/NBFC/FI loans 76%; NCDs 13%; securitisation 11%
          note: Liability mix remained funding-dependent as of March 2026.
        - id: capital
          label: Capital base
          value: CRAR 33.19%; net worth ₹3,126.88 crore
          note: Regulatory capital creates lending capacity and absorbs losses.
        - id: origination
          label: Origination engine
          value: 510+ branches; officer-assisted application flow
          note: Physical branch network and field verification remain central to throughput.
        - id: products
          label: Loan products
          value: MSME secured, working capital, home construction, used CV, emerging enterprises
          note: Mix is widening toward lower-yielding housing and vehicle categories.
        - id: aum
          label: Loan book / AUM
          value: ₹9,134.29 crore FY2026
          note: AUM is the balance-sheet base that generates spread income.
        - id: revenue
          label: Total revenue
          value: ₹1,848.60 crore FY2026
          note: Public evidence supports revenue scale but not product-level take rates.
        - id: costs
          label: Credit costs and opex
          value: 2.1% credit cost; 6.4% opex / AMA
          note: Margin pressure comes from mix shift and unsecured slippage.
        - id: profit
          label: PAT and retained capital
          value: ₹330.39 crore FY2026
          note: Profits replenish capital but the IPO is still framed as growth capital.
      edges:
        - from: funding
          to: origination
          relationship: Funds branch-led lending capacity
        - from: capital
          to: origination
          relationship: Supports RBI capital compliance
        - from: origination
          to: products
          relationship: Converts sourcing into product-specific disbursements
        - from: products
          to: aum
          relationship: Disbursements season into on-book assets
        - from: aum
          to: revenue
          relationship: Interest income and fees arise from the loan portfolio
        - from: revenue
          to: costs
          relationship: Credit losses and operating expenses consume spread income
        - from: costs
          to: profit
          relationship: Residual earnings become PAT
    approximationNotes: Public sources support the directional bridge but not product-level conversion rates or exact realized spreads.
