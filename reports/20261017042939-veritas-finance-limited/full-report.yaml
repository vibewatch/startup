          - type: figure
            figureRef: FE001
            claimRefs:
              - CE004
              - CE005
              - CE008
              - CE009
              - CE010
              - CE011
      - number: '5.4'
        title: Security and compliance controls are disclosed, but technical transparency remains limited
        blocks:
          - type: paragraph
            body: >-
              Veritas discloses meaningful control signals: the homepage advertises ISO 27001 certification, the DRHP
              says the company had no known data breaches in FY2024-FY2026, and the same filing describes real-time
              cloud disaster recovery, anti-malware protection, and compliance obligations under RBI's IT Governance
              Directions. The risk disclosures are equally important: the company says uninterrupted integrated systems
              are required to run the business, warns that internal systems may miss suspicious transactions or
              non-compliance, and notes that future cyber or process failures could trigger operational, legal, and
              reputational damage. Because the assigned evidence pool contains no public API/docs surface, uptime
              reporting, or detailed certification scope, the main underwriting issue is not whether controls exist, but
              how deeply outsiders can verify them.
            claimRefs:
              - CE010
              - CE011
              - CE012
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Veritas is a phygital lender, not a software-only originator
            body: >-
              The evidence consistently shows digital intake, mobile tools, and analytics wrapped around field visits,
              branch appraisal, and service-centre servicing, which is better described as a branch-enabled operating
              model than as a pure fintech workflow.
            calloutType: insight
            claimRefs:
              - CE004
              - CE005
              - CE008
          - type: callout
            title: Public tech disclosure is thinner than the operational dependence on the stack
            body: >-
              Veritas discloses meaningful controls and continuity mechanisms, but the public record still lacks
              product-doc, uptime, and vendor-level transparency that would let an external diligence team test
              resilience beyond management assertions and rating-agency summaries.
            calloutType: risk
            claimRefs:
              - CE009
              - CE011
              - CE012
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer base is broad by borrower count but still concentrated in MSME and self-employed lending
        blocks:
          - type: paragraph
            body: >-
              Public disclosures consistently position Veritas as a lender to underserved MSME and self-employed
              borrowers in rural and semi-urban India rather than a diversified retail-credit platform. The filing and
              rating-agency record show a base of 231,752 active customers as of March 31, 2026, with rural business
              loans still the dominant franchise even after expansion into affordable housing and used commercial
              vehicles. Customer growth has been real rather than merely narrative: disclosed borrower counts moved from
              176,341 in FY24 to 211,389 in FY25 and then 231,752 in FY26. The mix still skews toward informal and
              self-employed borrowers, which supports Veritas's inclusion thesis but also means customer quality and
              repayment resilience depend heavily on field underwriting rather than salaried-income predictability.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU006
              - CU016
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU003
              - CU004
              - CU006
      - number: '6.2'
        title: Adoption proof exists, but most named customer evidence is company-issued and light on durability
        blocks:
          - type: paragraph
            body: >-
              The clearest adoption proof is operating scale: Veritas runs a large branch-plus-service-centre network,
              discloses a field-assisted onboarding journey, and has continued expanding both loan products and borrower
              count. The servicing model appears deliberately hybrid: the company advertises phone/app/branch intake,
              field-officer verification, SMS/app tracking, and fast disbursement, while rating agencies describe
              business-premises visits, ACH and direct-debit collection rails, and mostly digital collections by FY26.
              That operating design is credible for semi-formal MSME borrowers, but the named customer evidence remains
              weak by diligence standards. The retained pool contains three public testimonials on the beta site, yet no
              independent case study, marketplace review set, procurement record, or third-party deployment reference
              confirming production usage, renewal behaviour, or realized customer economics.
            claimRefs:
              - CU002
              - CU005
              - CU007
              - CU008
              - CU009
              - CU010
          - type: table
            tableRef: TU003
            claimRefs:
              - CU008
              - CU009
              - CU010
              - CU001
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU002
              - CU007
      - number: '6.3'
        title: Durability is under-disclosed, while concentration and borrower-risk signals remain material
        blocks:
          - type: paragraph
            body: >-
              Veritas's customer engine has expanded, but the public record gives much better evidence on acquisition
              and scale than on retention or expansion quality. The filing does not disclose NRR, GRR, churn, renewal
              rate, average contract tenure, or top-customer concentration, so investors cannot yet tell whether
              borrower growth reflects durable repeat behaviour or continued acquisition intensity. The known risk
              signals are instead geographic and credit-profile related. Five states still account for over 91% of AUM
              and disbursements, while first-time borrowers represented 21.17% of the March 2026 book. Complaints are
              non-zero in both the FY25 annual report and the FY26 BRSR, and external sector reporting shows MSME credit
              outstanding still growing while active-loan growth slowed in FY25, underscoring that Veritas's scale-up
              should not be assumed to mean frictionless customer durability.
            claimRefs:
              - CU011
              - CU012
              - CU013
              - CU014
              - CU015
          - type: table
