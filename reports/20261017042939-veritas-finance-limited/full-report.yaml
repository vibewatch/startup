  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Side
      - Argument
      - What would change the view
    rows:
      - - Thesis
        - >-
          Veritas has reached public-market scale with 231,752 borrowers and about ₹9,134 crore of AUM by March 31,
          2026.
        - A material slowdown in borrower growth or AUM expansion without better margins would weaken the scale thesis.
      - - Thesis
        - >-
          Capital and ratings still provide a cushion: CARE upgraded the company to AA-/Stable and the FY2026 filing
          shows CRAR at 33.19%.
        - >-
          The thesis improves if Veritas sustains that cushion while holding Stage 3 metrics flat or better through
          FY2027.
      - - Anti-thesis
        - >-
          Profitability is no longer clearly public-comp quality: FY2026 ROA was 3.54% versus 7.27% at Five-Star and
          4.58% at SBFC.
        - The anti-thesis weakens if Veritas restores ROA toward 4%+ without renewed Stage 3 slippage.
      - - Anti-thesis
        - >-
          Public investors still lack a live price anchor because the DRHP leaves offer price fields blank and the
          sponsor base remains large enough for selldown structure to matter.
        - The anti-thesis weakens if the RHP prices at a discount to stronger listed peers and limits overhang concerns.
    notes: >-
      Arguments are analytical syntheses of the retained evidence rather than direct company quotations; each row cites
      the factual claims that justify the view.
    claimRefs:
      - CV004
      - CV005
      - CV007
      - CV009
      - CV010
      - CV014
      - CV015
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Case
      - Assumptions
      - Valuation / return logic
      - Probability signal
      - Downside trigger
    rows:
      - - Bull
        - Stage 3 metrics stabilize, returns recover, and fresh-issue proceeds support productive onward lending.
        - >-
          The disclosed peer-set highs of 23.63x P/E and 3.29x P/B are upside reference ceilings, not justified entry
          multiples until Veritas closes the return gap.
        - Conservative price band, healthy anchor demand, and early FY2027 disclosures showing no further deterioration.
        - Any premium to Five-Star despite weaker ROA and no profitability re-acceleration.
      - - Base
        - >-
          Veritas keeps ROA around the mid-3% range, avoids a new Stage 3 spike, and the final offer balances primary
          capital with secondary liquidity.
        - >-
          The disclosed peer averages of 18.39x P/E and 2.62x P/B are neutral market references, not fair-value
          conclusions without a Veritas price band.
        - >-
          Moderate demand, balanced primary-versus-secondary mix, and no covenant pressure on CRAR or Stage 3
          thresholds.
        - NNPA trend worsens toward CARE's downgrade trigger or the OFS narrative dominates primary-capital formation.
      - - Bear
        - >-
          The price band seeks a premium before Veritas proves a return recovery, or FY2027 credit performance
          deteriorates again.
        - >-
          The disclosed peer lows of 14.51x P/E and 2.16x P/B frame downside reference points if the return and
          asset-quality gap persists.
        - Aggressive marketing, heavy sponsor selldown emphasis, or no incremental disclosure beyond the draft filing.
        - ROTA trends toward sub-3%, NNPA moves toward 2%+, or gearing rises toward 3x.
    notes: >-
      Scenario references use the July 2026 DRHP's listed-peer P/E and P/B ranges based on July 27, 2026 prices and
      FY2026 audited financials; they are benchmarks, not a Veritas price target or return forecast.
    claimRefs:
      - CV004
      - CV006
      - CV008
      - CV009
      - CV014
      - CV015
      - CV016
