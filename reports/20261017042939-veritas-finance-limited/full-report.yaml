              - CU007
              - CU015
              - CU016
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Scaled borrower reach
            body: >-
              Veritas's borrower base is already large for a non-bank lender focused on underserved MSMEs: 231,752
              active customers as of March 31, 2026, with product expansion broadening beyond the original
              rural-business core.
            calloutType: strength
            claimRefs:
              - CU002
              - CU003
              - CU005
          - type: callout
            title: Concentration remains a customer-quality risk
            body: >-
              Public disclosures show five states still dominate branches, disbursements, and AUM, while first-time
              borrowers remain a sizable slice of the book and unsecured MSME stress drove tighter underwriting.
            calloutType: risk
            claimRefs:
              - CU011
              - CU012
          - type: callout
            title: Ask for cohort retention data before treating customer growth as durable expansion
            body: >-
              The public evidence is strong on scale but weak on durability: there is still no disclosed NRR, GRR,
              churn, average contract tenure, or top-borrower concentration view, and named proof is mostly
              marketing-led.
            calloutType: recommendation
            claimRefs:
              - CU013
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-ranked risk picture
        blocks:
          - type: paragraph
            body: >-
              The highest-severity risks are the ones that can quickly compound across the whole franchise: RBI or
              market-compliance failures, unresolved collection-related litigation, and a renewed credit-cost spike in
              the borrower cohorts that already weakened through FY2025 and FY2026. Management's own filing says
              regulatory and legal risk is "inherent and substantial", and the same filing confirms both past RBI
              observations and ongoing criminal proceedings linked to collections. That matters because Veritas is now a
              scaled middle-layer NBFC preparing for public markets, not a niche lender that can absorb supervisory
              noise quietly. The external environment also looks less forgiving than in the prior report cycle: a sector
              article describes the RBI's April 2026 cancellation sweep across 150 NBFCs, while Rediff's summary of CRIF
              data shows stress re-emerging in micro-borrower and working-capital segments. The practical read-through
              is that governance, fair-practices, KYC, and collections discipline should be treated as thesis-protecting
              controls, not as back-office hygiene.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR014
              - CR015
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR014
              - CR015
      - number: '7.2'
        title: Credit, liquidity, and concentration risks
        blocks:
          - type: paragraph
            body: >-
              Credit quality is the central economic risk because both rating agencies describe recent deterioration,
              even though neither has crossed into an immediate downgrade. CARE reported GNPA and NNPA worsening in
              FY2025, and ICRA said March 2026 GS3 and NS3 remained above the prior year's levels after a 2.9% interim
              peak. Those data points are still manageable, but the downside triggers are explicit: CARE flags NNPA
              above 2% with ROTA below 3%, and ICRA flags prolonged weakening in asset quality or profitability together
              with materially higher gearing. Concentration amplifies that credit risk. ICRA still shows roughly 43% of
              AUM in Tamil Nadu and about 74% across the top three states, while no material new-state entries are
              planned in the next two years. Funding also remains concentrated and bank-led, so any asset-quality wobble
              can feed directly into spread, covenant, or refinance pressure.
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
          - type: table
            tableRef: TR002
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR012
              - CR013
      - number: '7.3'
        title: Operating and partner dependencies
        blocks:
          - type: paragraph
            body: >-
              The main operating dependencies are not classic manufacturing or supply-chain issues; they sit in product
              mix, origination channels, collections infrastructure, and lender access. Veritas still carries unsecured
              working-capital exposure, and its own materials continue to market that product even after management
              reduced the book because of stress. The newer affordable-housing and used-commercial-vehicle lines now
              represent about 30% of AUM, which is enough to matter but not yet seasoned across a full cycle. Their
              sourcing model adds a second dependency layer: DSAs account for most FY2026 affordable-home-loan
              originations and roughly half of used-commercial-vehicle originations. Operational mitigants exist — CARE
              describes vendor MIS with backup and business-continuity safeguards, while the DRHP points to 95.31%
              digital collections and technology-driven early-warning systems — but those controls need validation at
              scale because channel, vendor, and collections failures would likely surface first as conduct issues or
              slippage rather than as a one-time outage.
            claimRefs:
              - CR008
              - CR011
              - CR012
              - CR013
          - type: table
            tableRef: TR003
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
      - number: '7.4'
        title: Mitigations, monitoring, and kill criteria
        blocks:
          - type: paragraph
            body: >-
              The current mitigants are credible but not enough to move the company into a low-risk bucket. Ratings
              remain investment-grade, liquidity is currently strong, and the company has already tightened unsecured
              underwriting, digitized collections, and disclosed that the latest RBI clarifications had no open
              observations left at the DRHP date. Even so, the investment case should break quickly if any of four
              monitorables worsen: first, any RBI penalty, unresolved inspection escalation, or exchange-compliance
              issue; second, asset quality that fails to stabilize, especially if it pushes the company toward CARE's
              NNPA and ROTA trigger band; third, refinancing stress signaled by weaker lender diversity, covenant
              pressure, or a delayed equity raise that leaves growth increasingly debt-funded; and fourth, evidence that
              DSA-led newer products or collections practices are creating fresh litigation, mis-selling, or
              borrower-stress pockets. Diligence should therefore focus on post-March-2026 vintage performance,
              case-level litigation detail, channel-quality metrics, and the most recent compliance testing rather than
              on historical branch-growth headlines.
            claimRefs:
              - CR002
              - CR003
              - CR006
              - CR007
              - CR010
              - CR011
              - CR012
              - CR014
              - CR015
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR003
              - CR006
              - CR007
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
