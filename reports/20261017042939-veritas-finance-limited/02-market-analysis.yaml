      - Budget owner
      - Adoption trigger
    rows:
      - ["Rural business loans", "Self-employed or micro-enterprise proprietor", "Operating business", "Same proprietor / household", "Phone, app, or branch intake with field verification", "Owner-manager", "Need for secured growth capital in underserved local markets"]
      - ["Working capital loans", "Urban enterprise owner", "Operating business", "Same proprietor / household", "Branch-led origination with underwriting discipline", "Owner-manager", "Inventory and short-cycle liquidity needs"]
      - ["Affordable / home-construction loans", "Borrower using self-occupied residential collateral", "Household linked to business livelihood", "Borrower household", "Field-assisted documentation and collateral assessment", "Household economic unit", "Home construction or housing upgrade alongside livelihood stability"]
      - ["Used commercial vehicle loans", "Owner-operator or small fleet entrepreneur", "Income-generating vehicle", "Same proprietor / household", "Branch or officer-led sourcing and verification", "Owner-manager", "Vehicle purchase to expand earning capacity"]
      - ["Emerging enterprises loans", "Graduating small-business borrower", "Growing enterprise", "Same proprietor / household", "Relationship-led branch process", "Owner-manager", "Need for larger ticket once initial scale is proven"]
    notes: >-
