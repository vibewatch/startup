figures:
  - id: FM001
    title: Market sizing lens
    type: pyramid
    summary: >-
      This figure layers the broad Indian small-business credit pool down to Veritas's current served
      footprint; the levels are directional lenses, not a mathematically reconciled TAM-SAM-SOM bridge.
    data:
      nodes:
        - label: India small-business credit exposure
          value: 46
          unit: "₹ lakh crore (Sep'25)"
          detail: Broad CRIF-SIDBI top-down market pool across lenders.
          claimRefs: [CM005]
        - label: Active small-business loan accounts
          value: 7.3
          unit: "crore accounts"
          detail: Same broad market lens showing borrower breadth.
          claimRefs: [CM005]
        - label: Sole proprietors within the broad pool
          value: 80
          unit: "% of credit"
          detail: "~90% of borrowers; fastest-growing formalising cohort has entity presence."
          claimRefs: [CM006]
        - label: NBFC share among sole proprietors
          value: 41
          unit: "%+ share"
          detail: Lender-channel lens showing NBFC relevance inside the broader pool.
          claimRefs: [CM004]
        - label: Veritas current AUM
          value: 9134
          unit: "₹ crore (Mar'26)"
          detail: Current company footprint after diversification into AHL and used-CV lending.
          claimRefs: [CM008]
        - label: Estimated broad-pool share
          value: 0.2
          unit: "% of ₹46 lakh crore"
          detail: Upper-bound proxy only because the denominator is much broader than Veritas's true served market.
          claimRefs: [CM009]
    approximationNotes: >-
      The layers mix rupee values, account counts, and share metrics to show market narrowing logic;
      they are not additive and should not be read as a reconciled cumulative bridge.
    claimRefs: [CM004, CM005, CM006, CM008, CM009]
