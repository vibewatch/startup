companyProfile:
  summary: >-
    Veritas Finance Limited is a Chennai-founded, RBI-registered NBFC focused on underserved MSMEs and self-employed
    borrowers. It has built a scaled secured-credit franchise across rural business loans, affordable housing, unsecured
    working capital, and used commercial vehicle finance, and by March 2026 it was reporting 231,752 active customers,
    8,329 employees, and 511 touchpoints. The company has refiled for an IPO, but the current public record still leaves
    the offer price and implied market capitalization open.
