  topStrengths:
    - Large and still-growing MSME lending franchise with clear product-market fit.
    - Solid capitalization and operating scale relative to earlier-stage private NBFC peers.
    - Public disclosures are sufficiently detailed to support a disciplined pre-IPO diligence process.
  topRisks:
    - The IPO still lacks a final price band, so valuation cannot yet be underwritten.
    - Asset-quality drift and sector funding pressure keep returns and credit costs under scrutiny.
    - Geographic concentration and product-mix execution remain important watchpoints.
  unresolvedGaps:
    - Final RHP price band, offer price, and post-offer market capitalization.
    - Whether FY2027 delinquency and Stage 3 trends have stabilized after FY2026 pressure.
    - Final OFS cash proceeds and whether the optional pre-IPO placement was executed.
    - Product-level yield, acquisition cost, and borrower cohort profitability disclosure.
