      - ["Affordable home loans", "Self-employed or underserved household borrower; borrower is user and payer", "Affordable housing / home construction finance", 20057, "21.38%", "Material diversification vertical, but public sources do not disclose repeat-draw or refinance behaviour."]
      - ["Used commercial vehicle loans", "Commercial vehicle owner-operator; borrower is user and payer", "Purchase of used commercial vehicles for income generation", 16885, "9.02%", "Fast-growing newer vertical; seasoning remains limited in public risk commentary."]
      - ["Working capital loans (unsecured)", "Urban and semi-urban enterprise borrower; borrower is user and payer", "Short-tenor working capital for business operations", 38276, "4.93%", "Smallest active-customer base after FY26 de-risking; risk commentary points to higher delinquencies and tighter underwriting."]
    notes: >-
      Active-customer mix and AUM mix are as of March 31, 2026 from the DRHP; public materials do not disclose
      revenue or lifetime-value by segment, so strategic value is inferred from active-customer and portfolio mix.
    claimRefs: [CU001, CU003, CU004, CU006]
  - id: TU002
    title: Customer growth / adoption trajectory table
    columns:
      - Metric
      - Value
      - Date
      - Source
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - ["Active customers", "176,341", "FY24 / Mar 31 2024", "Annual Report 2024-25", "high", "Borrower base was already scaled before the FY25/FY26 acceleration.", "No split by repeat vs first-time in FY24 disclosure."]
      - ["Active customers", "211,389", "FY25 / Mar 31 2025", "Annual Report 2024-25 and DRHP", "high", "Customer count grew 19.9% y/y into FY25.", "No disclosed renewal or churn rate."]
      - ["Active customers", "231,752", "FY26 / Mar 31 2026", "DRHP and ICRA", "high", "Growth continued into FY26 despite tighter unsecured underwriting.", "No active-borrower cohort retention data."]
      - ["Physical footprint", "444 branches + 67 service centres", "Mar 31 2026", "DRHP", "high", "Distribution remains branch-heavy and field-enabled.", "No branch-level customer productivity disclosed."]
      - ["Disbursements", "₹45,795.33 million", "FY26", "DRHP", "high", "Acquisition volume remained strong in FY26.", "No disclosed repeat-borrow share within annual disbursements."]
      - ["Digital servicing", "~95% of collections collected digitally", "FY26", "ICRA", "high", "Collections operations have meaningfully digitised even for field-originated borrowers.", "No disclosed digital share of origination or self-serve servicing."]
      - ["Independent scale corroboration", ">2.31 lakh active customers and >500 branches", "Latest available in 2025 IPO summary", "Angel One IPO page", "medium", "Third-party summary broadly matches company and rating-agency scale disclosures.", "Summary source does not provide methodology or retention details."]
      - ["Sector context", "MSME credit +20% y/y, but active-loan growth only +1.3% y/y", "Mar 2025 / FY25", "Business Standard citing CRIF High Mark", "medium", "Macro credit demand is still expanding, but account growth has slowed sector-wide.", "Not company-specific; does not reveal Veritas retention or share gains directly."]
    notes: >-
      This table mixes company, filing, rating-agency, and sector-context disclosures; growth rows show adoption
      scale, not retention quality, and missing denominators flag where public materials stop short of borrower-cohort durability.
    claimRefs: [CU002, CU005, CU007, CU015, CU016]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome
      - Limitation
    rows:
      - ["Priya Sharma", "Handicraft artisan / small-business borrower", "Business Expansion Loan", "Presented as in-use customer testimonial", "States she now exports handicrafts to five countries after an ₹8 lakh loan", "Only company-issued testimonial; no independent proof of current export scale, repayment history, or repeat borrowing."]
      - ["Mohan Singh", "Dairy farmer / agri-linked microenterprise borrower", "Agri-linked Business Loan", "Presented as in-use customer testimonial", "States he grew from 5 cows to a 50-cow mini dairy after a ₹20 lakh loan", "Only company-issued testimonial; no independent proof of herd size, business economics, or ongoing account status."]
      - ["Ramesh Kumar", "Kirana store owner / MSME rural borrower", "MSME Rural Loan", "Presented as in-use customer testimonial", "States he expanded from one store to three locations after a ₹5 lakh loan", "Only company-issued testimonial; no independent proof of current footprint, renewal, or loan performance."]
    notes: >-
      Enumeration scope is a sample, not an exhaustive customer roster. All three references come from the beta
      site's public testimonial carousel and demonstrate marketing proof rather than independent deployment validation.
    enumerationScope:
      coverage: sample
      basis: "Three testimonials visible on beta.veritasfin.in as of 2026-10-17; not an exhaustive borrower list or an independently verified customer-reference set."
    claimRefs: [CU008, CU009, CU010, CU001]
