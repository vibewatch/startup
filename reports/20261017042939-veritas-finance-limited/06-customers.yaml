  evidenceGaps:
    - type: missing-source
      severity: material
      topic: retention-gap
      missingEvidence: Public cohort disclosures for NRR, GRR, churn, renewal rate, repeat-borrow rate, and average contract tenure by product line.
      whyItMatters: Without cohort retention data, borrower-count growth could reflect acquisition intensity rather than durable customer expansion or high-quality repeat usage.
      diligencePath: Request quarterly borrower-cohort tables by product and vintage, including renewal, repeat-draw, delinquency, and exit reasons.
      relatedQuestionRefs: [QU003, QU007]
      relatedTableRefs: [TU002]
    - type: missing-source
      severity: material
      topic: customer-concentration
      missingEvidence: Top-borrower, top-channel-partner, and co-lending or sourcing concentration disclosures, including exposure shares and renewal economics.
      whyItMatters: Geographic concentration is disclosed, but borrower or channel concentration could create hidden earnings volatility and procurement dependence.
      diligencePath: Obtain the top-20 borrower and top-10 sourcing-channel exposure schedule, plus DSA and partner contribution by disbursement and AUM.
      relatedQuestionRefs: [QU004, QU007]
    - type: private-evidence-only
      severity: minor
      topic: named-customer-proof
      missingEvidence: Independent customer references, case studies, or review-platform evidence confirming production usage, business outcomes, and renewal behaviour.
      whyItMatters: The current public named proof is mostly company-authored marketing content, which is helpful for segmentation but weak for validating real deployment durability.
      diligencePath: Run reference calls with at least six borrowers across rural business, housing, vehicle, and working-capital products, or obtain independently published case studies.
