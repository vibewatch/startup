    enumerationScope:
      coverage: partial
      basis: Publicly named financing stakeholders in the assigned evidence pool, not a complete cap table.
    notes: Investor roles are source-reported and do not establish current ownership, control, liquidation preferences, or economic value.
    claimRefs: [CO008, CO009, CO010]
