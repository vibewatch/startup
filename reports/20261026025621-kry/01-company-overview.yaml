      - [Total raised, "$703M across seven rounds in Tracxn; $627M across three rounds in GetLatka", "Through July 2022 records", low, "Reconcile currencies, debt, duplicates, and undisclosed rounds."]
      - [Revenue, "$258M Sacra estimate; $232M GetLatka figure with no recorded source", "2024", low, "Obtain audited or management-prepared group revenue bridge."]
      - [Valuation, "$2B historical last-round value; date differs by profile", "April 2021 or July 2022", low, "Confirm priced-round date, current value, and terms."]
      - [Current customers, null, "2026 run date", low, "Cumulative patient and interaction metrics do not establish current unique customers."]
      - [Employees, "919 in Nov 2025; 927–929 in 2026 profiles", "2025–2026", medium, "Reconcile employees, clinicians, contractors, and acquired staff."]
      - [Markets and locations, "Sweden, Norway, France, and UK; no reconciled location count", "Current source descriptions", medium, "Confirm legal entities, brands, clinic definitions, and exits."]
    notes: Values are source-reported or source-estimated and are not interchangeable; revenue is not ARR, valuation is historical unless refreshed, and null or unresolved fields require primary diligence.
