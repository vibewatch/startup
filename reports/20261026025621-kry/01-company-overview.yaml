    enumerationScope:
      coverage: partial
      basis: Public leadership records available in the assigned source pool as of the 2026-10-26 run date.
    notes: This is a partial public enumeration, not a complete board or executive roster; each row is backed by the named local claims and their source records.
    claimRefs: [CO005, CO006, CO007]
