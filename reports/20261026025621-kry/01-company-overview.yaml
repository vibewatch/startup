company:
  name: Kry
chapter:
  number: 1
  title: Company Overview
  summary: Kry is a Stockholm-headquartered European hybrid-care company combining digital consultations with physical clinics and adjacent healthcare software. The evidence supports a scaled, privately held platform, but public sources disagree on founding and funding totals and leave current group-level financial visibility incomplete.
sections:
  - id: identity-and-operating-model
    title: Identity and operating model
    body: >-
      Kry is described across the retained evidence as a private digital-health company that combines online consultations with physical primary and specialist care. Tracxn characterizes it as a provider of “digital and physical primary urgent and secondary care,” while the Index Ventures job-board profile says the business is headquartered in Stockholm and operates as Kry in Sweden and Norway and Livi in the UK and France. Sacra describes three revenue streams—consultation fees, SaaS sales to clinicians and clinics, and referral payments from partners. The operating model is therefore broader than a video-visit application: it spans consumer and payer relationships, clinical operations, clinics, and healthcare workflow software.
    claimRefs: [CO001, CO002, CO003, CO004]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership, governance, and dependencies
    body: >-
      Tracxn and Scalable identify Kalle Conneryd-Lundgren as chief executive, while EquityZen still identifies co-founder Johannes Schildt as CEO and GetLatka uses the name Karl Conneryd-Lundgren. The evidence therefore supports a current operating-leadership hypothesis but not a fully reconciled executive chronology. Scalable names Johannes Schildt, Josefin Landgård, Fredrik Jung Abbou, and Joachim Hedenius as founders and describes Schildt as chairman. None of the retained sources provides a complete current board, voting structure, liquidation preferences, or succession plan. Governance and key-person exposure remain only partially observable and require primary company records.
    claimRefs: [CO005, CO006, CO007]
    tableRefs: [TO002]
  - id: capital-scale-and-metrics
    title: Capital, scale, and KPI visibility
    body: >-
      Kry’s capital history is substantial but inconsistent across databases. Tracxn reports $703 million across seven rounds and a $160 million Series D on 21 July 2022, while GetLatka reports $627 million across three rounds. Public profiles also repeat a $2 billion historical valuation but attach it to different financing dates. The different totals and round counts may reflect scope or database methodology rather than a reconciled financing history. Sacra estimates $258 million of 2024 revenue, while GetLatka lists $232 million for December 2024 without recording its source; neither is an audited group statement in the retained pool. Current customer count and comparable physical-footprint metrics remain gaps.
    claimRefs: [CO008, CO009, CO010, CO011, CO012, CO013, CO014]
    tableRefs: [TO003]
  - id: milestones-and-risk-signals
    title: Milestones and unresolved diligence
    body: >-
      The dated record shows a digital-health launch in 2014, a 2015 founded-year record, a $2 billion financing-era valuation in 2021 or 2022, and continuing scale signals through 2026. A Care Quality Commission report published 29 November 2024 rates Kry UK “Good” across safety, effectiveness, care, responsiveness, and leadership. That is a useful regulated-service signal, not proof of group-wide quality or economics. UpMarket separately highlights capital intensity and dependence on utilization, reimbursement, and cost control. The public evidence still does not establish consolidated profitability, cash, debt, runway, current valuation, or a complete adverse-event register.
    claimRefs: [CO001, CO002, CO008, CO010, CO013, CO015, CO016]
    figureRefs: [FO001]
callouts:
  - calloutType: strength
    title: Hybrid-care breadth
    body: >-
      Kry has evidence of a multi-country model combining digital access, physical care, and healthcare workflow services rather than relying on a single consultation product.
    claimRefs: [CO001, CO003, CO004]
  - calloutType: risk
    title: Financing and KPI reconciliation
    body: >-
      Public sources disagree on total capital raised, round count, valuation timing, and 2024 revenue, while an independent marketplace flags capital intensity and reimbursement exposure.
    claimRefs: [CO008, CO009, CO010, CO011, CO012, CO016]
