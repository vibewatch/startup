      - [Ontario Teachers' Pension Plan, "Series C lead in Scalable and July 2022 participant in Tracxn", "Institutional investor across financing records", "Reconcile round participation, current ownership, and rights."]
      - [Index Ventures, "Seed and later-round investor", "Long-duration venture relationship", "Confirm current ownership and board or information rights."]
      - [Accel, "Series A and later-round investor", "Early and continuing capital provider", "Reconcile participation, ownership, and any secondary sales."]
