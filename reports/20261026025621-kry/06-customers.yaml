  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention-and-concentration
      missingEvidence: >-
        NRR, GRR, churn, repeat-consultation cohorts, contract duration, renewal
        rates, and top-customer or top-payer revenue concentration by market.
      whyItMatters: >-
        Cumulative meetings and marketplace ratings cannot establish durable revenue,
        customer retention, or exposure to a small number of public counterparties.
      diligencePath: >-
        Obtain management's market-by-market cohort workbook and contract register,
        then reconcile it to invoiced revenue and independently sample renewals.
      relatedQuestionRefs: [QU004, QU005]
    - type: enumeration-incomplete
      severity: material
      topic: named-customer-proof
      missingEvidence: >-
        A named roster of NHS, insurer, employer, regional-system, and enterprise
        customers with contract value, deployment status, outcomes, and renewals.
      whyItMatters: >-
        Public cohort and regulatory evidence proves real service delivery but does not
        reveal institutional reference quality or commercial concentration.
      diligencePath: >-
        Request the top-20 account schedule and permissioned customer references, then
        verify production status and renewal outcomes directly with counterparties.
      relatedQuestionRefs: [QU003]
      relatedTableRefs: [TU003]
