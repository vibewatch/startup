schemaVersion: "report-v2"
artifact: customers
slug: kry
runDate: 2026-10-26
company:
  name: Kry
chapter:
  number: 6
  title: Customers
  summary: >-
    Kry shows substantial consumer adoption through 14 million company-reported care
    meetings, a 4.9 App Store rating across 280,000 ratings, and a hybrid Swedish
    footprint of 34 health centres. The evidence is strongest for patient reach and
    regulated service quality, but weak for retention, payer concentration, contract
    durability, and named institutional-customer outcomes.
sections:
  - id: customer-segments
    title: Patient reach spans direct digital access and hybrid care
    body: >-
      Kry's customer surface is broader than a direct-to-consumer telehealth app.
      Historical evidence places the service across five European markets under the Kry
      and Livi brands, while current app listings explicitly cover Sweden and Norway.
      In Sweden, the company now presents a hybrid offer: patients can enter through
      chat or video, visit one of 34 health centres, or move into specialist and
      follow-up care. Public reimbursement has historically made the patient price
      comparable with a physical clinic, and third-party descriptions also position
      public and private healthcare professionals as ecosystem partners. These sources
      identify patients, clinicians, and health systems as users or counterparties, but
      they do not disclose which party bears revenue by market or channel. Segment
      economics therefore remain an underwriting gap rather than an inferred mix.
    claimRefs: [CU004, CU006, CU012, CU013]
    tableRefs: [TU001]
  - id: adoption-trajectory
    title: Cumulative adoption is credible, but period activity is not disclosed
    body: >-
      The available milestones show a large increase in reported use: more than
      100,000 users in 2017, 1.4 million completed patient meetings by January 2020,
      and 14 million cumulative care meetings on the current Swedish site. The 2017
      release also said Kry served more than 1% of Swedish primary care and employed
      more than 200 doctors. Current marketplace signals add 280,000 iOS ratings at
      4.9 out of 5 and a company-reported service level in which 80% of patients
      received help within 23 minutes. These metrics have different denominators and
      periods: cumulative meetings are not active patients, ratings are not visits,
      and web traffic is not paid utilization. Dealroom's 350,000 monthly visits,
      90.5% attributed to Sweden, are best treated as a directional channel-
      concentration proxy rather than a customer count.
    claimRefs: [CU001, CU002, CU003, CU005, CU007, CU008, CU010, CU011]
    tableRefs: [TU002]
  - id: proof-and-durability
    title: Regulatory and marketplace proof exists; retention proof does not
    body: >-
      The strongest external quality evidence is the Care Quality Commission's
      November 2024 report for Kry UK, which rated the service Good for safe,
      effective, caring, responsive, and well-led care. App Store volume and rating
      provide a broad consumer-sentiment signal, while historical investor releases
      document adoption milestones. None of these measures establishes renewal,
      gross or net revenue retention, repeat consultation frequency, or institutional
      contract duration. Nor does the assigned evidence disclose named NHS, insurer,
      employer, or regional-system accounts with contract value and renewal outcomes.
      Public proof therefore supports real patient use and regulated service delivery,
      but not commercial durability. The named-proof exhibit is deliberately a
      partial sample of verifiable cohorts and service evidence, not a customer roster.
    claimRefs: [CU001, CU003, CU007, CU009, CU015]
    tableRefs: [TU003]
  - id: expansion-and-concentration
    title: Hybrid continuity creates expansion paths, with unresolved channel risk
    body: >-
      Kry's disclosed journey can move a patient from app-based booking and triage to
      a clinician consultation, prescription or referral, physical care when needed,
      and follow-up. The SARA electronic medical record job description says the
      platform serves thousands of patients and clinicians daily, indicating that the
      operational surface extends beyond a consumer front end. The hybrid model could
      deepen engagement across primary, specialist, mental-health, and chronic-care
      needs, but the pool offers no cohort evidence that this pathway improves repeat
      use or economics. A historical HBS analysis also cautioned that claimed relief
      of clinician shortages could be contested if professionals move from physical
      clinics to Kry. Management diligence should therefore reconcile channel-level
      revenue, clinician utilization, payer concentration, and repeat-use cohorts
      before treating cumulative meetings as durable expansion.
    claimRefs: [CU011, CU014, CU015, CU016]
    figureRefs: [FU001]
tables:
  - id: TU001
    title: Customer and counterparty segmentation
    columns:
      - Segment
      - Buyer / payer
      - User
      - Primary use case
      - Public scale signal
      - Revenue or strategic value
      - Evidence gap
    rows:
      - - Swedish app patients
        - Region-set patient fee / public reimbursement historically reported
        - Patients and families
        - On-demand primary and specialist care
        - 14 million cumulative care meetings across Kry's disclosed platform
        - High-volume digital entry point
        - Current market-level revenue and active-patient denominator unavailable
      - - Swedish health-centre patients
        - Regional patient fee; payer mix not disclosed
        - Patients needing physical or follow-up care
        - Same-day appointments, diagnostics, chronic and specialist care
        - 34 company-reported health centres
        - Hybrid continuity and cross-channel engagement
        - Clinic-level utilization and contribution margin unavailable
      - - UK regulated-service patients
        - Public/private payer split not disclosed
        - Patients using remote triage and treatment
        - Remote medical advice and treatment
        - CQC rated all five inspection domains Good in November 2024
        - Independent regulatory quality proof
        - Current patient volume and contract renewal data unavailable
      - - Healthcare professionals and systems
        - Public and private healthcare counterparties
        - Clinicians, administrative staff, and patients
        - Care delivery, records, referrals, and booking workflows
        - SARA described as serving thousands of patients and clinicians daily
        - Workflow integration and institutional relevance
        - Named accounts, contract values, and concentration unavailable
    notes: >-
      Segments combine current company disclosures with historical and third-party
      evidence; payer attribution and revenue contribution are not publicly quantified.
    claimRefs: [CU004, CU006, CU011, CU012, CU013]
  - id: TU002
    title: Customer growth and adoption trajectory
    columns:
      - Metric
      - Reported value
      - Period / date
      - Source character
      - Confidence
      - Implication
      - Missing denominator or limitation
    rows:
      - - Registered users
        - More than 100,000
        - June 2017
        - Investor release carrying company figures
        - Medium
        - Early multi-country consumer adoption
        - Registered or cumulative users; active rate not disclosed
      - - Completed patient meetings
        - More than 1.4 million
        - January 2020
        - Investor release carrying company figures
        - Medium
        - Material consultation throughput by 2020
        - Cumulative meetings; unique and repeat patients not split
      - - Care meetings
        - 14 million
        - Accessed October 2026
        - Company website, independently repeated by Scalable
        - Medium
        - Large cumulative care volume
        - Start date, unique patients, and trailing-period run rate unavailable
      - - App Store consumer signal
        - 4.9 out of 5 from 280,000 ratings
        - Accessed October 2026
        - Apple marketplace listing
        - Medium
        - Broad consumer feedback volume
        - Ratings are not active users, visits, or retained patients
      - - Web traffic
        - 350,000 monthly visits; 90.5% Sweden
        - Dealroom current profile accessed October 2026
        - Third-party market-data estimate
        - Low
        - Directional evidence of Swedish digital-channel concentration
        - Methodology, conversion, paid share, and patient identity unavailable
    notes: >-
      Values use each source's original metric and period; cumulative users, meetings,
      ratings, web visits, and active patients are not treated as interchangeable.
    claimRefs: [CU001, CU003, CU005, CU007, CU010]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer or cohort
      - Segment
      - Deployment / use case
      - Production vs. pilot
      - Observable outcome
      - Limitation
    rows:
      - - Swedish, Norwegian, and Spanish users
        - Consumer primary care
        - Mobile video consultations
        - Production by June 2017
        - More than 100,000 users reported
        - Investor release; no retention or unique-active-user measure
      - - Patients across five European markets
        - Consumer digital care
        - Smartphone or tablet consultations
        - Production by January 2020
        - More than 1.4 million completed patient meetings
        - Company figures carried by an investor; no payer or cohort split
      - - Kry iOS rating cohort
        - App users in Sweden and Norway
        - Digital booking and healthcare access
        - Live marketplace listing
        - 4.9 out of 5 across 280,000 ratings
        - Ratings do not establish clinical outcome, paid use, or retention
      - - Kry UK service users
        - UK remote-care patients
        - Remote triage, advice, and treatment
        - Regulated production service
        - CQC rated safe, effective, caring, responsive, and well-led as Good
        - Inspection rating does not disclose patient count or contract economics
    notes: >-
      Partial public sample limited to cohorts and regulated services identifiable in
      the assigned sources; no named institutional-customer roster was available.
    enumerationScope:
      coverage: partial
      basis: >-
        Publicly verifiable patient cohorts and regulated services in the assigned
        prefetched evidence as of 2026-10-26.
    claimRefs: [CU001, CU003, CU007, CU009]
figures:
  - id: FU001
    title: Evidence-backed hybrid customer journey
    type: journey-map
    summary: >-
      The documented pathway links digital access to clinical handling, physical care,
      and follow-up without implying a measured conversion funnel.
    data:
      nodes:
        - id: need
          label: Care need arises
          detail: Patient or parent seeks acute, chronic, mental-health, or family care.
          touchpoints: [Kry app, Swedish health centres]
        - id: book
          label: Book or start in app
          detail: The patient books with BankID or starts a digital care request.
          touchpoints: [App booking, chat, video]
        - id: triage
          label: Clinical intake
          detail: Symptoms, images, and questions inform the consultation pathway.
          touchpoints: [Digital intake, SARA workflows]
        - id: consult
          label: Professional consultation
          detail: A doctor, nurse, psychologist, or other licensed professional provides care.
          touchpoints: [Video, chat, clinician systems]
        - id: route
          label: Treat or route
          detail: The encounter may lead to advice, prescription, tests, referral, or physical care.
          touchpoints: [Prescription, referral, health centre]
        - id: follow-up
          label: Follow-up and continuity
          detail: Follow-up can occur digitally, at a health centre, or through specialist care.
          touchpoints: [App follow-up, physical clinic, specialist service]
    approximationNotes: >-
      Ordered from disclosed workflow descriptions; no conversion rates, durations, or
      retention probabilities are inferred.
    claimRefs: [CU014]
callouts:
  - calloutType: risk
    title: Adoption is not retention
    body: >-
      No assigned source discloses NRR, GRR, churn, repeat-consultation cohorts,
      institutional contract duration, or top-customer revenue concentration.
    claimRefs: [CU015]
  - calloutType: insight
    title: Clinician capacity may shift rather than expand
    body: >-
      A historical HBS analysis noted that reduced clinic shortages could be contested
      if healthcare professionals move from incumbent clinics to Kry.
    claimRefs: [CU016]
