evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: funding
    missingEvidence: >-
      A primary financing ledger reconciling the 2021 and 2022 round records, total capital, currencies, debt,
      investors, and security terms.
    whyItMatters: >-
      The inconsistent public totals and apparent duplicate Series D records affect valuation, dilution, and
      financial-resilience analysis.
    diligencePath: >-
      Obtain the latest cap table, financing documents, shareholder register, and debt schedule from management or lead
      investors.
    relatedQuestionRefs:
      - QO003
      - QO004
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: revenue
    missingEvidence: Audited or management-prepared consolidated financial statements covering 2024 through the current period.
    whyItMatters: Public revenue figures differ and do not establish ARR, cash generation, profitability, or runway.
    diligencePath: Request consolidated P&L, cash-flow statement, balance sheet, KPI definitions, and country-level revenue bridge.
    relatedQuestionRefs:
      - QO004
  - type: missing-source
    severity: minor
    topic: governance
    relatedTableRefs:
      - TO002
    missingEvidence: A current board, executive, ownership, and succession disclosure.
    whyItMatters: The overview cannot assess control, key-person dependence, or governance rights from the partial public roster.
    diligencePath: Request the current board roster, ownership schedule, reserved matters, and executive succession plan.
    relatedQuestionRefs:
      - QO002
  - type: missing-source
    severity: minor
    topic: milestones
    missingEvidence: Primary documentation for current partnerships, product launches, and any post-2025 market or legal changes.
    whyItMatters: The dated public timeline is adequate for historical orientation but not a complete current milestone register.
    diligencePath: Obtain the latest company update, regulatory correspondence, partnership list, and product release chronology.
    relatedQuestionRefs:
      - QO005
      - QO006
  - type: missing-source
    severity: material
    topic: tam-sam-som
    missingEvidence: >-
      Country-level primary-care spend, eligible encounter volumes, reimbursement rates, and contracted channel coverage
      needed to calculate TAM, SAM, and SOM.
    whyItMatters: >-
      A generic digital-health market estimate would overstate the revenue pool and obscure country-specific payer
      access.
    diligencePath: >-
      Obtain current payer datasets and Kry's market-by-market contracted lives, encounter mix, reimbursement schedule,
      and realistic capacity plan.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: payer-economics
    missingEvidence: >-
      Contract values, renewal rates, concentration, covered lives, utilization, and contribution margin by public,
      insurer, employer, and direct channel.
    whyItMatters: Budget ownership is visible, but economic quality and durability cannot be compared across channels.
    diligencePath: Review anonymized contracts, cohort utilization, renewal history, and channel-level contribution-margin schedules.
    relatedQuestionRefs:
      - QM003
      - QM005
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: country-comparability
    missingEvidence: >-
      Comparable current utilization and spending series for Sweden, Norway, the UK, and France using aligned
      definitions and periods.
    whyItMatters: >-
      Unaligned country statistics cannot support a consolidated serviceable-market estimate or a reliable growth
      assumption.
    diligencePath: >-
      Extract official payer data for each market and reconcile encounter types, coverage populations, currencies, and
      reporting periods.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: >-
      Comparable country-level list and realized pricing, packaging, discounts, contract duration, and renewal data for
      Kry and major alternatives.
    whyItMatters: >-
      Without common definitions and executed contract evidence, product breadth cannot be translated into pricing power
      or switching-cost economics.
    diligencePath: >-
      Request executed payer and enterprise contracts plus a country-by-country pricing, renewal, and utilization
      schedule.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: enumeration-incomplete
    severity: minor
    topic: competitor-landscape
    missingEvidence: >-
      A current country-by-country census of direct providers, insurer channels, employer offerings, internal builds,
      and likely entrants.
    whyItMatters: >-
      The retained pool supports a representative landscape but not an exhaustive competitor inventory in each operating
      market.
    diligencePath: >-
      Reconcile public procurement records and buyer interviews against a market-level competitor list for Sweden,
      Norway, France, and the UK.
    relatedQuestionRefs:
      - QP001
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: Current cash balance, monthly cash burn, runway, debt schedule, covenants, and financing milestones.
    whyItMatters: >-
      Funding raised and historical valuations do not establish whether the group can fund operations or avoid a
      dilutive financing.
    diligencePath: >-
      Request the latest board-approved cash forecast, bank statements, debt documents, covenant schedule, and financing
      plan.
    relatedQuestionRefs:
      - QI007
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: unit-economics
    missingEvidence: Market-level contribution margin, clinician utilization, visit economics, CAC, payback, and channel take rates.
    whyItMatters: >-
      Country-level profitability and administrative-efficiency claims cannot be translated into consolidated gross
      margin or durable growth economics.
    diligencePath: >-
      Request a monthly cohort and contribution-margin pack by country, payer type, care setting, and acquisition
      channel.
    relatedQuestionRefs:
      - QI004
      - QI005
      - QI006
    relatedTableRefs:
      - TI003
  - type: conflicting-data
    severity: material
    topic: revenue
    missingEvidence: >-
      A reconciled audited revenue history that explains differences among 2021, 2022, and 2024 third-party figures and
      denominators.
    whyItMatters: >-
      The assigned figures mix estimates, reported revenue, ARR labels, and unrecorded-source data; treating them as one
      series could misstate growth.
    diligencePath: Obtain audited financial statements and a revenue bridge by stream, country, currency, and recognition policy.
    relatedQuestionRefs:
      - QI002
    relatedTableRefs:
      - TI001
  - type: missing-source
    severity: material
    topic: assurance
    missingEvidence: Current independent security, privacy and compliance attestations for the patient and clinician platforms.
    whyItMatters: >-
      Healthcare software handles sensitive data and the public job specification describes required controls without
      proving their operating effectiveness.
    diligencePath: >-
      Request current ISO/SOC or equivalent attestations, penetration-test summary, incident register and
      data-processing architecture under NDA.
    relatedQuestionRefs:
      - QE006
      - QE007
  - type: missing-source
    severity: material
    topic: reliability
    missingEvidence: Market-level uptime, incident, recovery and clinical-quality metrics.
    whyItMatters: A broad hybrid-care footprint is not evidence that integrations and care pathways are reliable under load.
    diligencePath: >-
      Obtain 24-month SLO/SLA reports, major incident postmortems, recovery objectives and referral-completion metrics
      by market.
    relatedQuestionRefs:
      - QE007
      - QE009
  - type: missing-source
    severity: material
    topic: differentiation
    missingEvidence: Patent, proprietary-model, data-moat or independent benchmark evidence.
    whyItMatters: >-
      Workflow breadth and scale may be operationally valuable but do not by themselves establish durable technical
