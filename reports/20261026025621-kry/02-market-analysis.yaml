schemaVersion: "report-v2"
artifact: market-analysis
slug: kry
runDate: 2026-10-26
company:
  name: Kry
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Kry's relevant market is the European hybrid primary-care delivery and workflow
    layer, not the whole digital-health universe. Demand signals are meaningful, but
    the available evidence does not support a defensible company-specific TAM, SAM,
    or SOM; addressability therefore depends on payer access, workflow integration,
    clinical capacity, and phased interoperability obligations.
sections:
  - id: market-boundary-and-sizing
    title: Market boundary and evidence-constrained sizing
    body: >-
      Kry sits inside a narrower market than broad digital health: hybrid primary-care
      delivery, patient navigation, and provider workflow services sold through public
      systems, insurers, employers, and direct-access channels. IQVIA's 337,000-app
      universe and its counts for software-based therapies and diagnostics describe
      adjacent supply, not Kry's addressable revenue pool. Kry's own scale claims and
      Dealroom's workforce signal establish operating reach, but neither supplies a
      payer-spend denominator. The correct investment conclusion is therefore a
      constrained sizing case rather than a top-down TAM. France's public health-data
      portal is a logical diligence path, yet its landing page does not expose a usable
      utilization or spending series. A defensible SAM still requires country-level
      primary-care spend, eligible encounter volumes, reimbursement rates, and the
      share of pathways that can safely move into hybrid care.
    claimRefs: [CM001, CM002, CM006, CM007, CM008, CM009, CM016]
    tableRefs: [TM001, TM002]
  - id: buyers-payers-and-adoption
    title: Buyers, payers, and adoption path
    body: >-
      The user is the patient or clinician, but the economic buyer varies by channel.
      Sacra described national payers paying per service or per enrolled citizen, while
      Kry also reaches patients through GP practices, public apps, insurers, and
      employers. That mix makes distribution and reimbursement as important as consumer
      demand. Company-supplied evidence points to substantial utilization and claims
      that digital consultations can cost less than in-person appointments, but those
      claims are not independently audited market-size evidence. Adoption should be
      modeled as a sequence: secure a payer or practice route, integrate with the
      clinical front door, triage patients into an appropriate channel, prove access
      and cost outcomes, and then expand covered pathways. Each step narrows the
      serviceable opportunity and introduces a different budget owner.
    claimRefs: [CM003, CM004, CM005, CM011, CM014, CM015]
    tableRefs: [TM003]
    figureRefs: [FM001]
  - id: drivers-constraints-and-valuation
    title: Growth drivers, constraints, and valuation relevance
    body: >-
      Structural demand is supported by clinician workload, limited access, chronic
      disease, and payer interest in digital routing, while the expanding digital-care
      product base shows sustained innovation. Commercial conversion is less certain.
      IQVIA records reimbursement losses and bankruptcies among digital therapeutics,
      evidence that approval or availability does not guarantee durable adoption.
      The NHS digital-access framework also requires integration, governance, rapid
      response, urgent-request safeguards, and continued non-digital access, so software
      alone does not remove operating complexity. EHDS can lower cross-border friction
      over time through common data and EHR rules, but its main obligations phase in
      through 2029 and 2031 and impose security and interoperability requirements.
      Valuation should therefore reward contracted payer access and verified unit
      economics, not multiply a generic digital-health TAM by an assumed share.
    claimRefs: [CM007, CM008, CM009, CM010, CM011, CM012, CM013]
