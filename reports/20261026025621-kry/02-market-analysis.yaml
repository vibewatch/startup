      - [GP-practice workflow, "Practice or primary-care network", "GPs, staff, and patients", "Practice or NHS contract", "Online request, one-day response, urgent safeguards, clinical-system integration", "Practice or network leadership", "Contract compliance and lower administrative burden"]
      - [Insurance and employer care, "Insurer or employer", "Members and employees", "Insurer, employer, or benefit program", "App access to digital care with physical escalation", "Benefits, occupational health, or medical-cost owner", "Faster access and measurable utilization or productivity benefit"]
      - [Direct patient access, "Patient or household", "Patient", "Patient or blended payer", "App-based booking, consultation, prescription, and follow-up", "Consumer", "Convenience, availability, trust, and affordable out-of-pocket price"]
    notes: "The map describes observed channel mechanics; contract values, renewal rates, and budget allocations remain private."
    claimRefs: [CM004, CM005, CM011, CM014, CM015]
figures:
  - id: FM001
    title: Serviceable-market qualification stack
    type: pyramid
    summary: >-
      Addressability narrows through geography, clinical scope, payer access,
      integration, delivery capacity, and compliance rather than through an unsupported
      top-down market-share assumption.
    data:
      items:
        - label: Geography
          value: "Four core markets"
          detail: "Sweden, Norway, the UK, and France"
        - label: Clinical scope
          value: "Primary-care pathways"
          detail: "Triage, consultation, navigation, and appropriate escalation"
        - label: Payer access
          value: "Multiple routes"
          detail: "Public systems, insurers, employers, and direct payment"
        - label: Integration
          value: "Front door plus records"
          detail: "Public apps, practice systems, and clinical workflows"
        - label: Delivery capacity
          value: "Digital plus physical"
          detail: "Clinician availability and clinic escalation constrain throughput"
        - label: Compliance
          value: "Phased EU requirements"
          detail: "Security and interoperability obligations expand through 2029 and 2031"
    approximationNotes: "This is a qualitative qualification stack, not a value-proportional TAM/SAM/SOM pyramid; order shows narrowing criteria only."
    claimRefs: [CM001, CM003, CM011, CM012, CM013]
callouts:
  - calloutType: risk
    title: Do not capitalize a generic digital-health TAM
    body: >-
      The retained evidence supports a broad product universe and Kry operating-scale
      proxies, but it does not bridge country-level primary-care spend to eligible
      encounters, reimbursement, channel access, or a realistic obtainable share.
    claimRefs: [CM007, CM008, CM009, CM016]
