  evidenceGaps:
    - type: missing-source
      severity: material
      topic: tam-sam-som
      missingEvidence: Country-level primary-care spend, eligible encounter volumes, reimbursement rates, and contracted channel coverage needed to calculate TAM, SAM, and SOM.
      whyItMatters: A generic digital-health market estimate would overstate the revenue pool and obscure country-specific payer access.
      diligencePath: Obtain current payer datasets and Kry's market-by-market contracted lives, encounter mix, reimbursement schedule, and realistic capacity plan.
      relatedQuestionRefs: [QM002]
      relatedTableRefs: [TM002]
    - type: private-evidence-only
      severity: material
      topic: payer-economics
      missingEvidence: Contract values, renewal rates, concentration, covered lives, utilization, and contribution margin by public, insurer, employer, and direct channel.
      whyItMatters: Budget ownership is visible, but economic quality and durability cannot be compared across channels.
      diligencePath: Review anonymized contracts, cohort utilization, renewal history, and channel-level contribution-margin schedules.
      relatedQuestionRefs: [QM003, QM005]
      relatedTableRefs: [TM003]
    - type: missing-source
      severity: material
      topic: country-comparability
      missingEvidence: Comparable current utilization and spending series for Sweden, Norway, the UK, and France using aligned definitions and periods.
      whyItMatters: Unaligned country statistics cannot support a consolidated serviceable-market estimate or a reliable growth assumption.
      diligencePath: Extract official payer data for each market and reconcile encounter types, coverage populations, currencies, and reporting periods.
      relatedQuestionRefs: [QM008]
      relatedTableRefs: [TM002]
