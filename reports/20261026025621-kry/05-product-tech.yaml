  evidenceGaps:
    - type: missing-source
      severity: material
      topic: assurance
      missingEvidence: "Current independent security, privacy and compliance attestations for the patient and clinician platforms."
      whyItMatters: "Healthcare software handles sensitive data and the public job specification describes required controls without proving their operating effectiveness."
      diligencePath: "Request current ISO/SOC or equivalent attestations, penetration-test summary, incident register and data-processing architecture under NDA."
      relatedQuestionRefs: [QE006, QE007]
    - type: missing-source
      severity: material
      topic: reliability
      missingEvidence: "Market-level uptime, incident, recovery and clinical-quality metrics."
      whyItMatters: "A broad hybrid-care footprint is not evidence that integrations and care pathways are reliable under load."
      diligencePath: "Obtain 24-month SLO/SLA reports, major incident postmortems, recovery objectives and referral-completion metrics by market."
      relatedQuestionRefs: [QE007, QE009]
    - type: missing-source
      severity: material
      topic: differentiation
      missingEvidence: "Patent, proprietary-model, data-moat or independent benchmark evidence."
      whyItMatters: "Workflow breadth and scale may be operationally valuable but do not by themselves establish durable technical defensibility."
      diligencePath: "Request IP schedule, model/data governance documentation, technical benchmark results and evidence separating Kry-owned capability from vendor services."
      relatedQuestionRefs: [QE005, QE010]
    - type: stale
      severity: minor
      topic: clinical-outcomes
      missingEvidence: "Current outcome and utilization data linking the digital workflow to patient and payer value."
      whyItMatters: "Historical case evidence and current product claims do not establish present clinical effectiveness or realized efficiency."
      diligencePath: "Request current cohort-level wait-time, resolution, escalation, repeat-use and patient-safety metrics with denominators."
      relatedQuestionRefs: [QE004, QE008]
