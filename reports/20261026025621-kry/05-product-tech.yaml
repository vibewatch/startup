company:
  name: Kry
chapter:
  number: 5
  title: Product & Technology
  summary: Kry presents a hybrid-care platform combining online consultations, physical care and clinician-facing workflow software. Public evidence supports a mature clinical systems footprint and broad operating model, but detailed architecture, security controls, reliability metrics and product-level outcomes remain largely undisclosed.
sections:
  - id: product-surface
    title: Product surface and workflow
    body: >-
      Kry's customer-facing product is a digital healthcare access layer: its official
      site says patients can see a doctor, nurse or psychologist online within minutes,
      while also describing integration of primary, urgent and secondary care with
      digital and physical care. The earlier HBS case describes video-only appointments,
      drop-in or future sessions, diagnosis, prescriptions where appropriate and
      referrals to laboratories or specialist clinics. These sources establish the
      patient workflow, but do not establish clinical outcomes or realized time savings.
      Kry's public employer material also describes a separate clinician and
      administration workflow through the SARA EMR platform, indicating that the
      product is not merely a video front end. The combination creates a coherent
      access-to-care workflow, while leaving the payer, triage and escalation logic
      to be verified in diligence.
    claimRefs: [CE001, CE002, CE003, CE004, CE005, CE016]
    tableRefs: [TE001, TE002]
  - id: operating-architecture
    title: Operating architecture and maturity
    body: >-
      The strongest technical evidence is the Software Engineer specification for
      Kry's Healthcare Systems Team. It names SARA as a mature enterprise healthcare
      platform serving clinicians and patients across Sweden, with Windows Forms,
      ASP.NET web portals, backend services and SQL Server databases. It also names
      integrations with e-prescription systems, population registries, SMS gateways
      and appointment booking platforms. This is a credible operating-architecture
      signal because it is tied to a concrete engineering role, although it is still
      a company job posting rather than an independent technical audit. The same
      posting calls for code reviews, comprehensive tests, data security, audit trails
      and compliance, which indicates control requirements but does not prove that
      controls are effective. Kry's official page separately claims that digital and
      physical care are integrated across markets; the public record does not expose
      service-level objectives, incident history, penetration-test results or
      integration uptime.
    claimRefs: [CE006, CE007, CE008, CE009, CE010, CE011]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: differentiation-and-gaps
    title: Differentiation, trust and diligence gaps
    body: >-
      Kry's differentiator is an operating model rather than a disclosed proprietary
      algorithm: the company combines patient access, clinician workflows, physical
      clinics and health-system relationships. The HBS case reports that Kry used
      centralized digital documentation and claimed lower state cost per patient,
      but those statements are historical case analysis and are not current audited
      performance evidence. IQVIA's 2024 market review shows that digital care is
      becoming more mature while funding, reimbursement and commercial adoption
      remain difficult across the sector; that context raises the bar for proving
      clinical utility, reimbursement durability and operational efficiency. The
      product thesis is therefore credible at the workflow level, but underwriting
      should not assume that scale, app features or integration breadth equal
      defensible IP, regulatory clearance, security assurance or positive unit
      economics. The highest-value next evidence is a current system architecture
      pack, security and privacy attestations, incident and uptime history, clinical
      quality metrics, and deployment-level outcomes by market.
    claimRefs: [CE012, CE013, CE014, CE015]
tables:
  - id: TE001
    title: Product module and asset matrix
    columns: [Module or asset, Primary user, Public maturity/status, Differentiation signal, Diligence gap]
    rows:
      - [Patient consultation app, Patients, "Live service; online doctor, nurse and psychologist access", "Digital/physical care integration", "Current utilization, triage accuracy and outcomes by market"]
      - [SARA EMR platform, Clinicians and administrative staff, "Mature enterprise platform stated in job specification", "Clinical workflow system rather than video-only surface", "Current architecture, ownership, migration plan and uptime"]
      - [Physical clinics and specialist care, Patients and health-system partners, "Swedish page displays 34 clinics; market-wide site detail is not disclosed", "Hybrid-care continuity", "Site economics, staffing, quality and referral completion"]
      - [Clinician integrations, Clinicians and care operations, "E-prescriptions, registries, SMS and booking integrations described", "Connects care workflow to external services", "Integration contracts, failure handling and data-governance controls"]
    notes: "Public descriptions are uneven: the app and hybrid-care model are official claims, while SARA and its integrations come from a company job specification; no row proves clinical outcomes or reliability."
    claimRefs: [CE001, CE006, CE007, CE008]
  - id: TE002
    title: Workflow and use-case table
    columns: [User job, Current workflow, Kry solution, Measurable benefit, Limitation]
    rows:
      - [Get timely primary care, Seek a doctor or nurse through a clinic or local service, "Online consultation through app, video or chat", "Official site says patients can connect within minutes", "No public denominator for wait-time reduction or clinical appropriateness"]
      - [Obtain mental-health support, Find a psychologist or therapy pathway, "Psychologist access and planned/available therapy features", "Broadens digital access to mental-health workflows", "Current availability, clinical outcomes and reimbursement not disclosed"]
      - [Complete follow-up or referral, Move from consultation to testing or specialist care, "Referral to laboratories or specialist clinics described in HBS case", "Potentially connects first contact to onward care", "Referral completion and leakage rates unavailable"]
      - [Coordinate care operations, "Manage appointments, records and clinical administration", "SARA EMR plus booking, registry, SMS and e-prescription integrations", "Centralizes operational workflow", "Integration performance and error rates unavailable"]
    notes: "The measurable-benefit column records only what the sources explicitly support; unavailable outcomes are retained as gaps rather than inferred."
    claimRefs: [CE002, CE003, CE007, CE008]
  - id: TE003
    title: Technology and operating architecture
    columns: [Layer or process, Role, Dependency, Risk or diligence question]
    rows:
      - [Patient access, App, video/chat and identity/access services, "How are identity, consent, accessibility and clinical escalation controlled?"]
      - [Clinical application, SARA EMR, Windows Forms and ASP.NET portals, "Legacy modernization, release safety and support horizon"]
      - [Data layer, Clinical data model, SQL Server and relational storage, "Data integrity, retention, residency, backup and recovery evidence"]
      - [External connectivity, "Integration layer", "e-prescription, population registries, SMS and appointment booking", "Vendor/API availability, reconciliation and failure-mode controls"]
      - [Care delivery, "Digital plus physical and specialist pathways", "Clinicians, clinics and public/private partners", "Market-level service quality, staffing and referral completion"]
      - [Assurance, "Control processes", "Testing, audit trails, security and compliance processes", "No public independent attestation, incident history or SLO evidence"]
    notes: "This is an evidence-bounded architecture map assembled from official product description, HBS case context and a current job specification; it is not a verified system diagram."
    claimRefs: [CE001, CE006, CE007, CE008, CE009, CE010, CE011]
figures:
  - id: FE001
    title: Kry product architecture map
    type: stack
    summary: The public evidence supports a layered care platform from patient access through clinical systems, integrations and hybrid delivery.
    data:
      layers:
        - label: Online consultations
          modules:
            - label: Patient access
              detail: Doctor, nurse and psychologist access through app, video or chat.
        - label: Care navigation
          modules:
            - label: Referral workflow
              detail: Drop-in or future appointments with referral pathways described in the HBS case.
        - label: SARA EMR
          modules:
            - label: Clinical platform
              detail: Mature enterprise platform for clinicians, administrative staff and patients.
        - label: Clinical data services
          modules:
            - label: Application and database layer
              detail: ASP.NET/web portals, backend services and SQL Server databases are named in the engineering specification.
        - label: External integrations
          modules:
            - label: Connected services
              detail: E-prescription systems, population registries, SMS gateways and appointment booking platforms.
        - label: Hybrid care network
          modules:
            - label: Physical and specialist care
              detail: Digital care combined with physical clinics and specialist care.
    approximationNotes: "Layer membership is an evidence-bounded synthesis, not a disclosed vendor architecture or data-flow diagram."
    claimRefs: [CE001, CE006, CE007, CE008]
callouts:
  - calloutType: insight
    title: Product maturity is clearest in workflow breadth
    body: The evidence is strongest for Kry's breadth of care workflow and enterprise systems; evidence is materially weaker for proprietary technology, measurable reliability and security outcomes.
    claimRefs: [CE001, CE006, CE009, CE015]
  - calloutType: assumption
    title: Do not equate public scale with technical defensibility
    body: Patient-interaction volume and market presence can support operating scale, but they do not by themselves establish product retention, clinical quality, security or IP defensibility.
    claimRefs: [CE012, CE015]
