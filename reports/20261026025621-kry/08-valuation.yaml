callouts:
  - calloutType: recommendation
    title: Track, do not underwrite a current buy
    body: "The public evidence supports a credible operating trajectory but not a current price-sensitive valuation decision."
    claimRefs: [CV001, CV003, CV015]
  - calloutType: risk
    title: The 2021 mark is not a current price
    body: "The retained financing evidence is five years old at the report date and does not disclose current preferences, dilution, or liquidity terms."
    claimRefs: [CV003, CV012, CV013]
  - calloutType: assumption
    title: Consolidated cash economics are the gating assumption
    body: "Country-level profitability and improved EBITDA margin must be reconciled to consolidated cash flow before a valuation multiple can be applied."
    claimRefs: [CV001, CV002, CV008]
