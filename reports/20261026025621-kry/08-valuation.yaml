    title: Recommendation summary
    columns: [Dimension, Evidence, Valuation implication, Decision]
    rows:
      - [Recommendation, "2024 operating improvement is reported by Kry; group profitability remains unresolved.", "Operating proof is positive but not sufficient for a price call.", "Track"]
      - [Confidence, "Current valuation, price, cash, debt, and preference terms are not disclosed in the retained evidence.", "Confidence in any point estimate would be low.", "Medium-low"]
      - [Risk rating, "Independent analysis reports historical losses and a post-COVID telehealth multiple reset.", "Down-round and margin-compression risk remain material.", "High"]
      - [Valuation stance, "The explicit $2bn mark is from the April 2021 financing round.", "Use as historical context only; require a current price and terms.", "Stretched / unproven"]
    notes: "Sources include company-reported 2024 results, CNBC's 2021 financing report, and independent Sacra analysis; null current-price and preference data are unresolved gaps."
    claimRefs: [CV001, CV003, CV004, CV007, CV008]
  - id: TV002
    title: Thesis / anti-thesis
    columns: [Argument, Supporting evidence, What would change the view, Current implication]
    rows:
      - ["Hybrid-care scale can create operating leverage", "More than 14m consultations and around 60 physical facilities are company-reported.", "Audited market-level contribution margins and utilization show repeatable positive unit economics.", "Supports track"]
      - ["Profitability trajectory is improving", "Kry reports EBITDA margin improvement to -4.4% in 2024; TechArena reports country-level profitability.", "Consolidated cash flow and group EBITDA turn positive without one-off support.", "Positive but unproven"]
      - ["Historical financing mark may overstate current value", "CNBC reported $2bn valuation in a 2021 $300m round.", "A current arm's-length financing or secondary transaction confirms price and terms.", "Major uncertainty"]
      - ["Telehealth economics and competition can impair returns", "Sacra cites public-market drawdowns, competitors, and Kry losses of $123m on $164m revenue in its historical analysis.", "Retention, payer concentration, and cash runway demonstrate resilience through a downside case.", "High downside risk"]
    notes: "This table separates operating thesis evidence from the anti-thesis; historical figures are not treated as current financials."
    claimRefs: [CV001, CV003, CV007, CV008, CV010, CV011]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Explicit assumptions, Valuation / return logic, Probability signal, Downside trigger]
    rows:
      - [Bull, "Margin improvement continues; country profitability converts to group profitability; hybrid clinics and digital channels scale.", "Potential upside only if a current price is below diligence-confirmed intrinsic value; no public range is supportable.", "Qualitative positive signal, not quantified.", "Consolidated EBITDA and cash flow fail to improve despite scale."]
      - [Base, "Growth continues but market economics remain uneven; current financing terms and cash position stay undisclosed.", "Track and wait for a price-sensitive entry supported by current terms and normalized margins.", "Most defensible pending evidence.", "New financing is required before group profitability."]
      - [Bear, "Funding need, down-round or preference overhang, multiple compression, and weaker payer or clinic economics.", "Capital impairment risk is material; avoid a buy call without downside protection.", "Qualitative adverse signal from historical sector reset.", "Down-round, covenant stress, or sustained consolidated losses."]
    notes: "No current share price, cap table, debt schedule, or preference data were available; valuation ranges and numeric return targets are intentionally not estimated."
    claimRefs: [CV003, CV004, CV007, CV008, CV013, CV014]
