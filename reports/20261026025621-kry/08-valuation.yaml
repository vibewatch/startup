company:
  name: Kry
chapter:
  number: 8
  title: Valuation
  summary: >-
    Kry has credible scale and materially improved 2024 operating indicators, but the
    available public evidence does not establish a current equity price, financing terms,
    cash runway, or preference stack. The evidence therefore supports a track stance with
    research-more conditions rather than a buy recommendation.
sections:
  - id: operating-proof-and-financing
    title: Operating proof is improving, but the financing anchor is stale
    body: >-
      Kry's 2024 company release reports SEK 2.5bn of group revenue, EBITDA of SEK -505m
      versus SEK -960m in 2023, and an EBITDA margin improvement from -19.5% to -4.4%.
      It also says all markets returned a profit at the end of 2024, while acknowledging
      that the company remains on a path toward group profitability. Independent coverage
      adds an important qualification: country-level profitability does not equal group
      profitability, and the group has continued to invest in technology. This is
      meaningful operating progress, not proof of positive consolidated cash generation.
      The only explicit valuation mark in the retained pool is CNBC's April 2021 report
      of a $300m round at a $2bn valuation; it is a historical financing reference, not
      a current entry price. The public evidence does not disclose a 2025 or 2026 round,
      current share price, liquidation preferences, or governance rights.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV008]
    tableRefs: [TV001]
  - id: scale-and-comparables
    title: Scale and business-model evidence support the upside case, not a multiple
    body: >-
      Kry has a credible hybrid-care scale story. Its current company materials describe
      operations in Sweden, Norway, France, and the UK, around 60 physical facilities,
      and more than 14 million consultations; another company profile reports 72 clinics
      and more than 200,000 consultations per month, showing that even company-reported
      operating snapshots are not perfectly reconciled. Sacra describes three revenue
      mechanisms—video consultations, SaaS sold to doctors, and referral payments—and
      reports a 2022 revenue mix concentrated in Sweden. These disclosures support a
      model with recurring payer exposure and operating leverage potential, but they do
      not supply a comparable-company multiple or a normalized margin base. The retained
      evidence includes telehealth public-market drawdowns and regional competitors, but
      those are context for risk and comparability rather than a defensible mark for Kry.
      A valuation method should therefore wait for a reconciled revenue definition,
      contribution margin by market and channel, and current financing data.
    claimRefs: [CV006, CV007, CV009, CV010, CV011, CV012]
    tableRefs: [TV002]
  - id: scenario-discipline
    title: Scenarios are asymmetric because current price and terms are unavailable
    body: >-
      The bull case is operational rather than multiple-driven: the 2024 margin
      improvement continues, country-level profitability becomes consolidated
      profitability, and the hybrid digital/physical model converts consultation scale
      into durable payer economics. The base case assumes continued growth with
      unresolved group-level losses, uneven market economics, and no evidence that the
      2021 financing mark remains supportable. The bear case combines renewed funding
      needs, a down-round or preference overhang, slower commercialization, and
      multiple compression after the post-COVID telehealth reset described by Sacra.
      Probability signals are qualitative because the pool contains no current cap table,
      cash balance, debt schedule, or observable transaction price. Ranges are therefore
      intentionally withheld. The appropriate decision variable is an entry-price
      discount to a diligence-confirmed intrinsic value, not a stale headline valuation.
    claimRefs: [CV003, CV004, CV007, CV008, CV013, CV014]
    tableRefs: [TV003]
  - id: recommendation-and-diligence
    title: Track pending price, terms, and consolidated economics
    body: >-
      The recommendation is track, with medium-low confidence in the valuation call and
      high risk. The company has substantial operating evidence and a plausible route to
      better economics, but the evidence is insufficient to say whether a buyer would
      be receiving that improvement at a reasonable price. EquityZen confirms that
      secondary liquidity can be offered through existing shareholders and that exits
      depend on an IPO, merger, acquisition, or eligible secondary transaction; this
      describes access mechanics, not a current Kry clearing price. Dealroom also states
      that some cap-table data are hidden and that its percentages are indicative.
      Before upgrading, diligence should obtain the latest financing documents, fully
      diluted capitalization, preference and anti-dilution terms, cash and debt schedule,
      monthly contribution margins, clinician utilization, payer concentration, and
      reconciled consultation and revenue KPIs. Exit readiness is not established by
      marketplace availability alone.
    claimRefs: [CV002, CV008, CV012, CV013, CV015, CV016]
    figureRefs: [FV001]
tables:
