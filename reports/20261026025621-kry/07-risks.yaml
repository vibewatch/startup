    claimRefs: [CR002, CR006, CR009, CR010, CR011, CR015, CR016]
callouts:
  - calloutType: risk
    title: Financing remains the central thesis-break risk
    body: The 2024 accounts show improved margins but negative cash flow, negative operating profitability, and SEK 867.633 million of interest-bearing liabilities; sustained positive EBITDA and current covenant headroom need verification.
    claimRefs: [CR001, CR002, CR003, CR004]
  - calloutType: insight
    title: Reliability evidence is directional, not a rate
    body: App telemetry indicates broad reach and strong average ratings, while dated user reviews document missed calls and booking failures; the missing denominator prevents a conclusion about incident frequency.
    claimRefs: [CR011, CR012, CR013]
  - calloutType: assumption
    title: Stated controls are not tested controls
    body: The annual report and app listings describe monitoring, safety, confidentiality, and compliance, but the assigned evidence does not include independent assurance, incident logs, or regulator findings.
    claimRefs: [CR006, CR007, CR008, CR009]
