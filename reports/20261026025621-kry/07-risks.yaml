artifact: risks
slug: kry
runDate: 2026-10-26
company:
  name: Kry
chapter:
  number: 7
  title: Risks
  summary: Kry's 2024 accounts show materially improved but still negative profitability and cash flow, while two post-year-end regional repayment demands sharpen its regulatory and billing-control exposure. The most decision-relevant residual risks are financing dependence, regulated-system execution, service reliability, data governance, and evidence gaps around current liquidity and legal posture.
sections:
  - id: financial-and-financing
    title: Financial and financing exposure
    body: >-
      Kry's 2024 annual report describes a business still moving toward profitability rather than
      one that has reached self-funding. Consolidated net sales increased to SEK 2,497 million,
      but operating margin remained negative and the Group reported negative cash flow. Management
      links the improvement in cash flow to new convertible and debt financing, so the path to
      positive EBITDA remains dependent on execution and capital structure. The accounts report
      SEK 239 million of Group cash and cash equivalents at year-end and SEK 867.633 million of
      interest-bearing liabilities. This creates a financing and refinancing risk even though the
      board judged the going-concern plan implementable. Secondary-market providers also warn that
      private-company valuation and liquidity are uncertain; those pages are not evidence of a
      current transaction price. Monitoring should therefore focus on cash conversion, debt terms,
      covenant headroom, and whether positive EBITDA is sustained without incremental capital.
    claimRefs: [CR001, CR002, CR003, CR004, CR005]
    tableRefs: []
    figureRefs: [FR001]
  - id: regulatory-legal-and-data
    title: Regulatory, legal, and data exposure
    body: >-
      Kry's annual report discloses two active Swedish reimbursement disputes after year-end.
      Region Skåne terminated a midwife-clinic agreement and sought SEK 18.8 million, while
      Region Stockholm demanded SEK 48 million over consultations it says were compensated twice.
      Kry disputes both demands; no current disposition appears in the assigned evidence. The
      report also lists regulatory healthcare, legal and contract, production, technology, and
      information-security risks, and says policy changes can significantly affect the company
      across publicly funded systems. The UK app listing states that the service is CQC-regulated
      and confidential, while its privacy disclosure lists sensitive identity-linked data. These
      statements describe controls and exposure, not proof that controls are effective. Diligence
      should obtain the regional case files, current registrations, audit results, data-processing
      agreements, incident logs, material complaints, and litigation searches by jurisdiction.
      The absence of a surfaced incident in this pool is not evidence that no incident occurred.
    claimRefs: [CR006, CR007, CR008, CR009, CR010, CR016]
    tableRefs: [TR001]
  - id: operational-and-service
    title: Operational and service reliability
    body: >-
      Kry's operating model spans an app, video and chat consultations, physical clinics, partner
      clinics, clinicians, external healthcare services, and a mature electronic medical-record
      platform. The company's engineering job listing describes integrations with e-prescription
      systems, population registries, SMS gateways, and appointment-booking platforms, and calls
      the platform mission-critical for patient care. That breadth increases the number of failure
      points where outages, booking defects, data-integrity errors, or clinician-availability
      constraints could disrupt care. Independent app telemetry reports 2.6 million installs and
      a 4.57 rating from about 61 thousand ratings, but individual reviews describe missed calls,
      missed appointments, rebooking, and availability failures. The evidence supports a
      monitorable reliability risk, not a measured incident rate. Management should provide
      service-level metrics by market, appointment completion and rebooking rates, severity-one
      incident history, recovery times, and clinician capacity by channel.
    claimRefs: [CR006, CR008, CR009, CR011, CR012, CR013]
    tableRefs: [TR002]
  - id: dependency-and-kill-criteria
    title: Dependencies, residual exposure, and thesis-break triggers
    body: >-
      Kry's own accounts identify exposure to public-health policy, foreign-exchange movements,
      contractual counterparties, technology, and information security. The 2024 report says
      exchange-rate movements against the euro and pound affected earnings, and its revenue policy
      describes partner consultations and payments from regions, insurers, and other customers.
      The available evidence does not disclose customer concentration, renewal rates, supplier
      concentration, or the terms and covenants of the debt and convertible facilities. Those
      omissions matter because a hybrid-care network can appear diversified by geography while
      remaining concentrated by payer, regulator, platform dependency, or key clinical workforce.
      A thesis-break condition is a return to sustained negative EBITDA accompanied by falling
      cash or a new financing need on materially worse terms. Other triggers are a material
      regulatory restriction, a reportable privacy or clinical-safety event, repeated severe
      booking failures, or loss of a major payer or partner without replacement capacity. Until
      those indicators are disclosed and tracked, the residual risk rating should remain high.
    claimRefs: [CR004, CR005, CR011, CR014, CR015]
    tableRefs: [TR003]
