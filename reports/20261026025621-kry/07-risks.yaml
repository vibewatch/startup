  - id: TR002
    title: Operational / quality / security risk register
    columns: [Risk, Evidence, Likelihood, Severity, Mitigation maturity, Residual exposure, Diligence path]
    rows:
      - [Legacy EMR or external integration failure, "SARA spans desktop, web, backend, SQL, and external healthcare services", medium, high, "Code review, testing, data integrity, and incremental modernization appear in the job listing", high, "Review architecture, dependency inventory, change-failure rate, recovery tests, and service levels"]
      - [Clinical process or patient-safety failure, "Annual report identifies production, property-damage, and personal-injury exposure", unknown, high, "Continual risk analysis and safety procedures are stated", high, "Obtain market-level incident, complaint, referral, prescribing, and adverse-event rates"]
      - [Booking or appointment-availability failure, "Independent reviews report missed calls, rebooking, and unavailable slots", medium, medium, "A current app version and booking improvements are visible, but root-cause evidence is not", medium, "Review availability, missed-appointment, cancellation, support-response, and repeat-failure trends"]
      - [Privacy or information-security failure, "Annual report identifies IT risk and the app disclosure lists sensitive identity-linked data", unknown, high, "Security and compliance expectations are stated, but independent assurance is absent", high, "Review audits, penetration tests, subprocessors, breach logs, DPIAs, and remediation closure"]
    notes: "Qualitative judgments combine company disclosures, a company-issued engineering post, app-store disclosures, and AppBrain evidence; individual reviews do not estimate incident frequency."
    claimRefs: [CR006, CR008, CR009, CR011, CR012, CR013]
  - id: TR003
    title: Partner / dependency risk register
    columns: [Failure mode or dependency, Evidence, Likelihood, Severity, Mitigation maturity, Residual exposure, Unresolved gap]
    rows:
      - [Public reimbursement and care-system access, "Regions, county councils, insurers, and other public or private customers", medium, high, "Regulatory monitoring and market adaptation are disclosed", high, "No payer revenue, renewal, or contract concentration disclosure"]
      - [External capital and credit, "Existing investors and debt or convertible providers", medium, high, "2024 financing and ownership restructuring are disclosed", high, "No current cash runway, covenant headroom, maturity schedule, or financing terms"]
      - [Clinical-system integrations, "E-prescription, population registry, SMS, and appointment-booking services", medium, high, "Engineering requirements emphasize testing, data integrity, and system stability", high, "No vendor identity, dependency architecture, failover evidence, or contractual service levels"]
      - [Mobile distribution and patient access, "Apple App Store and Google Play host the patient applications", low, medium, "Current listings and version updates are visible", medium, "No channel-utilization split, release-control evidence, or quantified web fallback"]
    notes: "Public evidence does not disclose payer, vendor, platform, or capital-provider concentration, so concentration is recorded as a gap rather than estimated."
    claimRefs: [CR004, CR005, CR008, CR009, CR011, CR015]
