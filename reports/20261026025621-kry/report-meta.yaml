companyProfile:
  summary: >-
    Kry is a Stockholm-headquartered European hybrid-care company that combines online consultations with physical
    clinics, specialist care and clinician-facing workflow software. It operates under the Kry brand in Sweden and
    Norway and the Livi brand in the United Kingdom and France. The evidence supports a scaled private platform, but
    public sources conflict on founding and funding totals and do not provide a complete current view of group liquidity
    or unit economics.
