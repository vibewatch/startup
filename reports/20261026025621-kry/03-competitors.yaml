    rows:
      - ["Care-delivery breadth", "Digital and physical care, specialist services, and provider tools", "Focused telehealth peers are named, but their current scope is not evidenced", "Kry appears broader; breadth also increases operating complexity"]
      - ["Physical footprint", "About 60 Swedish centers and three French centers were reported in March 2024", "No comparable physical-footprint evidence retained for named peers", "The footprint can support continuity but cannot be scored comparatively"]
      - ["Workflow integration", "SARA EMR integrates prescriptions, registries, messaging, and booking", "eConsult describes NHS App and clinical-system integration requirements", "Integration is a qualification gate, not necessarily a unique moat"]
      - ["Digital distribution", "Dealroom estimates 350,000 monthly visits, 90.5% from Sweden", "Docplanner claims 100 million patients visit its sites each month", "Different definitions and geographies prevent a market-share comparison"]
      - ["Regulatory delivery", "CQC rated Kry UK Good across five inspection dimensions in November 2024", "No equivalent retained inspection record for a named peer", "Positive proof for Kry, but not a comparative outcomes benchmark"]
    notes: "Metrics retain publisher definitions, periods, and denominators; Dealroom and Docplanner figures are not audited or directly comparable."
    claimRefs: [CP003, CP007, CP008, CP009, CP010, CP011, CP012, CP013]
  - id: TP003
    title: Pricing, packaging, and switching-cost evidence
    columns: [Model, Public price or contract evidence, Included capability, Unknown, Strategic implication]
    rows:
      - [Kry, "No comparable public list or realized price retained", "Hybrid digital and physical care plus provider workflow", "Payer rates, discounts, renewal, utilization, and contribution margin", "Breadth may support value, but pricing power is unproven"]
      - [eConsult, "No price retained", "Online consultation and digital-access support for GP practices", "Contract length, discounting, realized price, and retention", "NHS integration requirements can create switching work but also define an open competitive standard"]
      - [Docplanner, "No price retained", "Patient marketplace, booking, reputation, and clinic-management tools", "Country-level packaging, take rate, and retention", "A large workflow network can compete without owning care delivery"]
      - ["Status quo / internal build", "No normalized cost-to-serve retained", "Existing face-to-face, telephone, app, and clinical-system access", "Internal development budget, service levels, and opportunity cost", "The incumbent channel remains a substitute and a required integration surface"]
    notes: "The assigned pool contains no comparable pricing schedule; funding, revenue, traffic, and appointment counts are not used as substitutes for price."
    claimRefs: [CP009, CP012, CP013, CP016]
figures:
  - id: FP001
    title: Competitive positioning by workflow breadth and care-delivery ownership
    type: quadrant
    summary: >-
      Ordinal positions distinguish software-led access from owned care delivery; they are
      analytical classifications rather than market-share or quality scores.
    data:
      xAxis:
        label: "Workflow breadth: focused to integrated"
        min: 1
        max: 3
      yAxis:
        label: "Care-delivery ownership: software-only to operator"
        min: 1
        max: 3
      points:
        - {label: Kry, x: 3, y: 3, summary: "Hybrid operator with EMR and external-service integrations"}
        - {label: eConsult, x: 2, y: 1, summary: "Digital-access software aligned to NHS requirements"}
        - {label: Docplanner, x: 3, y: 1, summary: "Marketplace and practice-management ecosystem"}
        - {label: "Focused telehealth peers", x: 1, y: 2, summary: "Named virtual-care alternatives with limited retained detail"}
        - {label: "Internal digital build", x: 2, y: 1, summary: "Buyer-controlled software integrated with incumbent systems"}
        - {label: "Face-to-face status quo", x: 1, y: 3, summary: "Existing care delivery preserved alongside digital access"}
    approximationNotes: >-
      Coordinates are evidence-backed ordinal classifications on a 1-3 scale, not reported
      quantities, benchmark thresholds, or value-proportional distances; unsupported pricing
      and outcome differences are excluded.
    claimRefs: [CP009, CP010, CP012, CP013, CP014, CP016]
callouts:
  - calloutType: strength
    title: Hybrid operations are harder to replicate than video access
    body: >-
      Kry's physical footprint, clinical workflow, external integrations, and regulated UK
      service provide a more credible moat candidate than the consultation interface alone.
    claimRefs: [CP003, CP009, CP011, CP016]
  - calloutType: risk
    title: Distribution power sits partly with health systems
    body: >-
      NHS access rules require interoperability and preserve multiple channels, so a payer or
      provider can impose standards and multi-home rather than depend on one digital vendor.
    claimRefs: [CP012, CP016]
  - calloutType: recommendation
    title: Test pricing power with contract-level evidence
    body: >-
      Obtain country-level pricing, renewal, utilization, contribution-margin, and outcome data
      before treating Kry's breadth or regulatory record as durable economic differentiation.
    claimRefs: [CP011, CP016]
