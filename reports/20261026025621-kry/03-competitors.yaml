company:
  name: Kry
chapter:
  number: 3
  title: Competitors
  summary: >-
    Kry competes across care delivery, digital access, clinical workflow, and the incumbent
    care system rather than in a single telehealth category. Its strongest differentiation
    appears to be hybrid operations plus workflow integration, while platform scale, public
    procurement requirements, and sector commoditization constrain pricing power.
sections:
  - id: competitive-landscape
    title: The competitive set spans operators, software, and the status quo
    body: >-
      Kry's buyer can choose among a hybrid care operator, a focused telehealth provider, a
      digital-access or practice-management platform, and existing public-system channels.
      Low-reputation aggregators name Babylon Health, Teladoc, Push Doctor, Doktor.se, and
      TeleClinic as alternatives, but those lists are directional rather than an exhaustive
      benchmark. More concrete evidence shows Docplanner selling an ecosystem for patients,
      doctors, and clinics, while eConsult addresses the UK digital front door. Historical
      Swedish evidence also shows that Kry began as a video-only model inside a publicly
      reimbursed system. The landscape is therefore country- and workflow-specific: a platform
      can compete for patient acquisition or provider workflow without assuming Kry's clinical
      delivery obligations.
    claimRefs: [CP001, CP002, CP006, CP012, CP013]
    tableRefs: [TP001]
  - id: scale-and-capability
    title: Kry has meaningful hybrid scale, but comparisons are not normalized
    body: >-
      The retained sources support operational breadth, not a clean market-share ranking.
      TechArena reported approximately 60 physical care centers in Sweden and three in France
      in March 2024. Dealroom's current profile maps 929 employees across 14 countries and
      estimates 350,000 monthly web visits, mostly from Sweden; these are platform estimates,
      not audited company disclosures. A separate profile describes Kry's scope as app, video,
      and chat consultations, physical clinics, specialist care, and provider tools in four
      European markets. Docplanner, by contrast, claims 25 million monthly appointments and
      300,000 active doctors across 13 countries, but those marketplace metrics do not measure
      delivered consultations on a comparable denominator.
    claimRefs: [CP003, CP007, CP008, CP010, CP013]
    tableRefs: [TP002]
  - id: distribution-and-switching
    title: Integration and regulated delivery matter more than a video interface
    body: >-
      Kry's company-issued job description says its mature SARA EMR connects with
      e-prescription systems, population registries, SMS gateways, and appointment-booking
      platforms. That integration depth can create implementation and data-migration friction,
      but it is also a procurement requirement that capable rivals can meet. eConsult's account
      of the October 2025 NHS GP contract says online tools must integrate with the NHS App and
      clinical systems, respond within one working day, and coexist with face-to-face and
      telephone channels. CQC's November 2024 page rates Kry UK's service Good across five
      inspection dimensions. This is credible regulatory proof of delivery, but not evidence
      of superior outcomes, retention, or pricing versus competitors.
    claimRefs: [CP009, CP011, CP012]
    tableRefs: [TP003]
  - id: moat-and-adverse-case
    title: The moat is operational, while the category keeps broadening
    body: >-
      The evidence indicates that Kry's defensible position rests on operating hybrid care,
      embedding clinical workflow, and satisfying regulated-service requirements rather than
      owning a unique virtual-consultation feature. TechArena reported country-level
      profitability milestones alongside continuing group-level losses in 2024, illustrating
      both local operating progress and the cost of the broader platform. IQVIA reports that
      digital-health companies have faced weaker funding, revenue-growth difficulty, and
      bankruptcies, even as vendors combine patient- and physician-facing tools into solutions
      designed for health-system adoption. This broadening product frontier favors Kry's
      integrated model, but it also lets workflow platforms and AI-enabled entrants converge on
      parts of its proposition. Comparable contract economics remain the central diligence gap.
    claimRefs: [CP004, CP005, CP014, CP015, CP016]
    figureRefs: [FP001]
