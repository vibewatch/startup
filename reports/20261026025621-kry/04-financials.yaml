    rows:
      - [Swedish public care, Same patient price as physical clinic visits, "Patient-facing price; not Kry revenue", "Historical independent case study", "Reimbursement and utilization determine economics", "Obtain current reimbursement schedule and net rate"]
      - [National payer fee-for-service, Per service or visit, "Realized rate unknown", "Third-party reported", "Volume can grow without proving contribution margin", "Provide contracted and realized rate by payer"]
      - [National payer subscription, Monthly fee per enrolled citizen, "Contract basis; rate and enrollment unknown", "Third-party reported", "Capitation shifts risk to utilization and retention", "Provide cohort, churn, utilization, and renewal data"]
      - [Professional SaaS and referrals, Provider contract or referral fee, "No public list or realized price", "Mechanism reported only", "Potential diversification, but scale and margin unproven", "Provide ARR/MRR, take rates, and compliance review"]
    notes: "No public source in the assigned pool provides a current price list, discount schedule, CAC, payback, or channel economics; nulls are evidence gaps, not zeros."
    claimRefs: [CI005, CI006]
  - id: TI003
    title: Unit economics and capital adequacy table
    columns: [Metric, Value or null, Confidence, Why it matters, Diligence ask]
    rows:
      - [Revenue growth, "124% in 2020 and 92% in 2021 in Sacra's historical series", medium, "Shows pandemic-era scale-up but not durable growth", "Reconcile audited annual revenue and organic growth"]
      - [Country profitability, "Sweden Oct 2022; France Oct 2023; UK Jan 2024 reported by Techarenan", medium, "Suggests market-level maturation", "Provide contribution margin definition and monthly bridge"]
      - [Group profitability, "Group-level financials remained unprofitable in Techarenan account", medium, "Prevents applying country profitability to consolidated underwriting", "Provide consolidated EBITDA, cash flow, and eliminations"]
      - [Administrative efficiency, "Approximately 30% reduction per patient-doctor interaction reported by Techarenan", medium, "Potential clinician-throughput and cost lever", "Provide baseline, measurement method, and realized savings"]
      - [Group EBITDA, "Minus SEK 505M for 2024 reported by Scalable", medium, "Shows that market-level milestones do not establish group profitability", "Provide audited EBITDA reconciliation and cash conversion"]
      - [Gross margin, null, low, "Margin path cannot be assessed without delivery-cost allocation", "Provide gross margin by stream and geography"]
      - [Funding raised, "$627M listed by GetLatka; $300M Series D described by UpMarket", "Historical and source-dependent", "Shows financing capacity, not current liquidity", "Round documents and cap table"]
      - [Valuation, "$2B Series D valuation; current value not verified", "Historical", "Do not use as current enterprise value", "Latest preferred price, terms, and secondary marks"]
      - [Cash and runway, null, "Unavailable", "Capital adequacy cannot be scored", "Latest cash balance, monthly burn, runway, and board plan"]
      - [Debt and convertibles, null, "Unavailable", "Potential seniority and dilution are unknown", "Debt schedule, covenants, maturities, and conversion terms"]
      - [Next-round trigger, null, "Unavailable", "Financing dependency cannot be stress-tested", "Minimum cash policy, milestones, and contingency plan"]
    notes: "Historical operating signals, company-reported efficiency, and private-company financing records are not a substitute for audited unit economics; null means the assigned sources did not disclose the metric."
    claimRefs: [CI007, CI008, CI009, CI010, CI011, CI012, CI013, CI014, CI015, CI016]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: Patient activity can enter several care and contract pathways, but the pool does not support conversion rates or a gross-profit total.
    data:
      nodes:
        - id: demand
          label: Patient demand
          detail: "Visits or enrolled citizens; public volume metrics are incomplete"
        - id: digital-care
          label: Digital consultations
          detail: "Video, app, or chat clinical service"
        - id: physical-care
          label: Physical and specialist care
          detail: "Hybrid-care delivery adds clinic and service costs"
        - id: payer
          label: Payer revenue
          detail: "Fee-for-service or capitated subscription"
        - id: provider-software
          label: Provider SaaS
          detail: "Telehealth tools sold to doctors"
        - id: partner
          label: Partner referrals
          detail: "Pharmacy and laboratory referral payments"
      edges:
        - [demand, digital-care]
        - [demand, physical-care]
        - [digital-care, payer]
        - [digital-care, provider-software]
        - [digital-care, partner]
    approximationNotes: "The diagram is a sourced mechanism map, not a quantitative bridge; no conversion rates, revenue weights beyond the cited mix, or gross-profit totals are inferred."
    claimRefs: [CI001, CI002, CI005, CI006]
callouts:
  - calloutType: strength
    title: Diversified monetization
    body: Kry has payer, provider-software, and referral mechanisms, reducing dependence on a single customer payment path, although the revenue contribution and margin of each stream remain undisclosed.
    claimRefs: [CI001, CI002]
  - calloutType: risk
    title: Liquidity is the gating issue
    body: Public sources do not disclose current cash, burn, runway, debt, covenants, or financing triggers; funding raised and historical valuation cannot substitute for a liquidity bridge.
    claimRefs: [CI013, CI014, CI015]
  - calloutType: recommendation
    title: Underwrite market by market
    body: Require reconciled revenue, contribution margin, utilization, renewal, and cash data by geography and stream before assigning a current valuation or financing need.
    claimRefs: [CI003, CI009, CI011]
