company:
  name: Kry
chapter:
  number: 4
  title: Financials
  summary: Kry has a diversified care-delivery model, but public evidence does not reconcile reported revenue, country profitability, group EBITDA, cash, or runway. The strongest underwriting signal is improving operating efficiency in selected markets; the principal blocker is the absence of current, audited group-level liquidity and unit-economics disclosure.
sections:
  - id: revenue-architecture
    title: Revenue architecture and traction
    body: >
      Kry monetizes a hybrid care platform rather than a single software SKU. Sacra describes
      three mechanisms: video consultations paid by national payers on fee-for-service or
      subscription terms, a telehealth SaaS product sold to doctors, and referral payments from
      pharmacies and laboratories (SI011). That mechanism mix matters because payer reimbursement
      and clinician utilization drive economics differently from software-seat revenue. Sacra
      reports a 78% Sweden, 12% UK, and 10% France revenue mix, while also describing a 50/50
      split between fee-for-service and capitated subscription models; these are different
      denominators or periods and should not be combined into one waterfall (SI011). The same
      source estimates $215M revenue in 2022 and reports $164M in 2021 revenue, whereas GetLatka
      lists $232M annual revenue for December 2024 but explicitly says its source is not recorded
      (SI009). These figures are useful directional signals, not a reconciled revenue history.
      The operating footprint is also hybrid: Kry's company job material says it combines digital
      and physical care, while the CQC record confirms a UK service offering remote triage and
      medical advice (SI005, SI010). Underwriting should therefore separate reimbursed clinical
      volume, subscription enrollment, SaaS revenue, and referral revenue before applying any
      software multiple.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001]
  - id: pricing-and-gtm
    title: Pricing, GTM, and sales-efficiency proxies
    body: >
      Public pricing is not a consumer list-price story. An early independent case study says KRY
      received public reimbursement and that patient pricing was the same as physical-clinic
      visits in Sweden (SI004). Sacra's later account adds that national payers can pay per
      service or through a monthly subscription for enrolled citizens, while doctors may buy a
      telehealth SaaS product (SI011). This implies at least three commercial motions: public
      reimbursement, contracted or capitated payer access, and professional software. The
      evidence does not disclose realized rates, discounts, payer contract duration, renewal,
      CAC, payback, or channel take rates. A company job repost confirms a mature SARA EMR
      platform with external integrations and a regulated-care workflow, which can support
      retention but does not prove pricing power or margin (SI005). The practical sales-efficiency
      proxy is operational throughput: Techarenan reports that administrative work per
      patient-doctor interaction was streamlined by approximately 30% after AI adoption, but the
      same article says group-level financials remained unprofitable (SI012). This is an
      efficiency signal, not CAC payback or gross-margin evidence. The revenue model bridge below
      therefore shows the causal path from enrolled or visiting patients to payer and provider
      revenue without inventing conversion rates.
    claimRefs: [CI005, CI006, CI007, CI008]
    tableRefs: [TI002]
  - id: cost-and-unit-economics
    title: Cost structure and unit-economics visibility
    body: >
      The cost base is structurally labor- and compliance-heavy. Kry's public job material
      describes clinicians, software engineers, data specialists, regulated data models,
      integrations, testing, security, and audit trails; these are operating requirements rather
      than separately disclosed cost lines (SI005). EUJobs publishes broad, indicative
      compensation bands by seniority, but those ranges are a low-confidence labor-cost proxy,
      not Kry payroll evidence (SI002). Techarenan states that country-level profitability
      coexisted with group-level unprofitability because of technology investment (SI012).
      Sacra's analysis reports $123M of losses against $164M revenue, citing Swedish filings, but
      its 2023 publication date means the figure is historical rather than current (SI011).
      Scalable reports 2024 EBITDA of minus SEK 505M, while a 2026 SWOT assessment still
      characterizes Kry as loss-making with high cash burn and thin margins in publicly funded
      consultations (SI006, SI001).
      These sources point to clinician delivery, clinic overhead, customer acquisition, technology,
      and regulatory costs as the principal drivers, but no public source in this pool supplies
      contribution margin by market, clinician utilization, visit-level gross profit, or a
      reconciled group cash-flow statement. Every missing unit-economics field is therefore an
      explicit diligence request rather than a modeled zero.
    claimRefs: [CI009, CI010, CI011, CI012, CI016]
  - id: capital-adequacy-and-verdict
    title: Capital adequacy and underwriting verdict
    body: >
      Kry has raised substantial private capital, but funding raised is not cash available.
      UpMarket describes the company as private, cites the April 2021 Series D at a $2B
      post-money valuation, and flags capital intensity, utilization, reimbursement dynamics,
      and cost control as risks (SI008). GetLatka lists $627M raised across three rounds and a
      $2B July 2022 valuation, but says its 2024 revenue source is not recorded (SI009).
      EquityZen confirms that secondary-market access comes from existing shareholders rather
      than a company-issued financing (SI007). None of these sources provides
      current cash, debt, covenants, burn, runway, financing terms, or a next-round trigger.
      The financial verdict is therefore conditional: the platform may be approaching
      market-level profitability in selected geographies, yet group underwriting remains blocked
      until management supplies a current cash bridge, debt schedule, market-level contribution
      margins, and reconciled revenue by stream and geography.
    claimRefs: [CI013, CI014, CI015]
    tableRefs: [TI003]
    figureRefs: [FI001]
