chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              Kry is described across the retained evidence as a private digital-health company that combines online
              consultations with physical primary and specialist care. Tracxn characterizes it as a provider of “digital
              and physical primary urgent and secondary care,” while the Index Ventures job-board profile says the
              business is headquartered in Stockholm and operates as Kry in Sweden and Norway and Livi in the UK and
              France. Sacra describes three revenue streams—consultation fees, SaaS sales to clinicians and clinics, and
              referral payments from partners. The operating model is therefore broader than a video-visit application:
              it spans consumer and payer relationships, clinical operations, clinics, and healthcare workflow software.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
