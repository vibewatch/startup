        - >-
          Growth continues but market economics remain uneven; current financing terms and cash position stay
          undisclosed.
        - Track and wait for a price-sensitive entry supported by current terms and normalized margins.
        - Most defensible pending evidence.
        - New financing is required before group profitability.
      - - Bear
        - Funding need, down-round or preference overhang, multiple compression, and weaker payer or clinic economics.
        - Capital impairment risk is material; avoid a buy call without downside protection.
        - Qualitative adverse signal from historical sector reset.
        - Down-round, covenant stress, or sustained consolidated losses.
    notes: >-
      No current share price, cap table, debt schedule, or preference data were available; valuation ranges and numeric
      return targets are intentionally not estimated.
    claimRefs:
      - CV003
      - CV004
      - CV007
      - CV008
      - CV013
      - CV014
