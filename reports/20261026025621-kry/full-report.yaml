  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              Kry sits inside a narrower market than broad digital health: hybrid primary-care delivery, patient
              navigation, and provider workflow services sold through public systems, insurers, employers, and
              direct-access channels. IQVIA's 337,000-app universe and its counts for software-based therapies and
              diagnostics describe adjacent supply, not Kry's addressable revenue pool. Kry's own scale claims and
              Dealroom's workforce signal establish operating reach, but neither supplies a payer-spend denominator. The
              correct investment conclusion is therefore a constrained sizing case rather than a top-down TAM. France's
              public health-data portal is a logical diligence path, yet its landing page does not expose a usable
              utilization or spending series. A defensible SAM still requires country-level primary-care spend, eligible
              encounter volumes, reimbursement rates, and the share of pathways that can safely move into hybrid care.
            claimRefs:
              - CM001
              - CM002
              - CM006
              - CM007
              - CM008
              - CM009
              - CM016
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM005
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM006
              - CM007
              - CM008
      - number: '2.2'
        title: Buyers, payers, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The user is the patient or clinician, but the economic buyer varies by channel. Sacra described national
              payers paying per service or per enrolled citizen, while Kry also reaches patients through GP practices,
              public apps, insurers, and employers. That mix makes distribution and reimbursement as important as
              consumer demand. Company-supplied evidence points to substantial utilization and claims that digital
              consultations can cost less than in-person appointments, but those claims are not independently audited
              market-size evidence. Adoption should be modeled as a sequence: secure a payer or practice route,
              integrate with the clinical front door, triage patients into an appropriate channel, prove access and cost
              outcomes, and then expand covered pathways. Each step narrows the serviceable opportunity and introduces a
              different budget owner.
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM011
              - CM014
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM004
              - CM005
              - CM011
              - CM014
              - CM015
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM003
              - CM011
              - CM012
              - CM013
      - number: '2.3'
        title: Growth drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Structural demand is supported by clinician workload, limited access, chronic disease, and payer interest
              in digital routing, while the expanding digital-care product base shows sustained innovation. Commercial
              conversion is less certain. IQVIA records reimbursement losses and bankruptcies among digital
              therapeutics, evidence that approval or availability does not guarantee durable adoption. The NHS
              digital-access framework also requires integration, governance, rapid response, urgent-request safeguards,
              and continued non-digital access, so software alone does not remove operating complexity. EHDS can lower
              cross-border friction over time through common data and EHR rules, but its main obligations phase in
              through 2029 and 2031 and impose security and interoperability requirements. Valuation should therefore
              reward contracted payer access and verified unit economics, not multiply a generic digital-health TAM by
              an assumed share.
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Do not capitalize a generic digital-health TAM
            body: >-
              The retained evidence supports a broad product universe and Kry operating-scale proxies, but it does not
              bridge country-level primary-care spend to eligible encounters, reimbursement, channel access, or a
              realistic obtainable share.
            calloutType: risk
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: The competitive set spans operators, software, and the status quo
        blocks:
          - type: paragraph
            body: >-
              Kry's buyer can choose among a hybrid care operator, a focused telehealth provider, a digital-access or
              practice-management platform, and existing public-system channels. Low-reputation aggregators name Babylon
              Health, Teladoc, Push Doctor, Doktor.se, and TeleClinic as alternatives, but those lists are directional
              rather than an exhaustive benchmark. More concrete evidence shows Docplanner selling an ecosystem for
              patients, doctors, and clinics, while eConsult addresses the UK digital front door. Historical Swedish
              evidence also shows that Kry began as a video-only model inside a publicly reimbursed system. The
              landscape is therefore country- and workflow-specific: a platform can compete for patient acquisition or
              provider workflow without assuming Kry's clinical delivery obligations.
            claimRefs:
              - CP001
              - CP002
              - CP006
              - CP012
              - CP013
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP006
              - CP012
              - CP013
      - number: '3.2'
        title: Kry has meaningful hybrid scale, but comparisons are not normalized
        blocks:
          - type: paragraph
            body: >-
              The retained sources support operational breadth, not a clean market-share ranking. TechArena reported
              approximately 60 physical care centers in Sweden and three in France in March 2024. Dealroom's current
              profile maps 929 employees across 14 countries and estimates 350,000 monthly web visits, mostly from
              Sweden; these are platform estimates, not audited company disclosures. A separate profile describes Kry's
              scope as app, video, and chat consultations, physical clinics, specialist care, and provider tools in four
              European markets. Docplanner, by contrast, claims 25 million monthly appointments and 300,000 active
              doctors across 13 countries, but those marketplace metrics do not measure delivered consultations on a
              comparable denominator.
            claimRefs:
              - CP003
              - CP007
              - CP008
              - CP010
              - CP013
          - type: table
            tableRef: TP002
            claimRefs:
              - CP003
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
      - number: '3.3'
        title: Integration and regulated delivery matter more than a video interface
        blocks:
          - type: paragraph
            body: >-
              Kry's company-issued job description says its mature SARA EMR connects with e-prescription systems,
              population registries, SMS gateways, and appointment-booking platforms. That integration depth can create
              implementation and data-migration friction, but it is also a procurement requirement that capable rivals
              can meet. eConsult's account of the October 2025 NHS GP contract says online tools must integrate with the
              NHS App and clinical systems, respond within one working day, and coexist with face-to-face and telephone
              channels. CQC's November 2024 page rates Kry UK's service Good across five inspection dimensions. This is
              credible regulatory proof of delivery, but not evidence of superior outcomes, retention, or pricing versus
              competitors.
            claimRefs:
              - CP009
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP009
              - CP012
              - CP013
              - CP016
      - number: '3.4'
        title: The moat is operational, while the category keeps broadening
        blocks:
          - type: paragraph
            body: >-
              The evidence indicates that Kry's defensible position rests on operating hybrid care, embedding clinical
              workflow, and satisfying regulated-service requirements rather than owning a unique virtual-consultation
              feature. TechArena reported country-level profitability milestones alongside continuing group-level losses
              in 2024, illustrating both local operating progress and the cost of the broader platform. IQVIA reports
              that digital-health companies have faced weaker funding, revenue-growth difficulty, and bankruptcies, even
              as vendors combine patient- and physician-facing tools into solutions designed for health-system adoption.
              This broadening product frontier favors Kry's integrated model, but it also lets workflow platforms and
              AI-enabled entrants converge on parts of its proposition. Comparable contract economics remain the central
              diligence gap.
            claimRefs:
              - CP004
              - CP005
              - CP014
              - CP015
              - CP016
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP009
              - CP010
              - CP012
              - CP013
              - CP014
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Hybrid operations are harder to replicate than video access
            body: >-
              Kry's physical footprint, clinical workflow, external integrations, and regulated UK service provide a
              more credible moat candidate than the consultation interface alone.
            calloutType: strength
            claimRefs:
              - CP003
              - CP009
              - CP011
              - CP016
          - type: callout
            title: Distribution power sits partly with health systems
            body: >-
              NHS access rules require interoperability and preserve multiple channels, so a payer or provider can
              impose standards and multi-home rather than depend on one digital vendor.
            calloutType: risk
            claimRefs:
              - CP012
              - CP016
          - type: callout
            title: Test pricing power with contract-level evidence
            body: >-
              Obtain country-level pricing, renewal, utilization, contribution-margin, and outcome data before treating
              Kry's breadth or regulatory record as durable economic differentiation.
            calloutType: recommendation
            claimRefs:
              - CP011
              - CP016
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue architecture and traction
        blocks:
          - type: paragraph
            body: >
              Kry monetizes a hybrid care platform rather than a single software SKU. Sacra describes three mechanisms:
              video consultations paid by national payers on fee-for-service or subscription terms, a telehealth SaaS
              product sold to doctors, and referral payments from pharmacies and laboratories (SI011). That mechanism
              mix matters because payer reimbursement and clinician utilization drive economics differently from
              software-seat revenue. Sacra reports a 78% Sweden, 12% UK, and 10% France revenue mix, while also
              describing a 50/50 split between fee-for-service and capitated subscription models; these are different
              denominators or periods and should not be combined into one waterfall (SI011). The same source estimates
              $215M revenue in 2022 and reports $164M in 2021 revenue, whereas GetLatka lists $232M annual revenue for
              December 2024 but explicitly says its source is not recorded (SI009). These figures are useful directional
              signals, not a reconciled revenue history. The operating footprint is also hybrid: Kry's company job
              material says it combines digital and physical care, while the CQC record confirms a UK service offering
              remote triage and medical advice (SI005, SI010). Underwriting should therefore separate reimbursed
              clinical volume, subscription enrollment, SaaS revenue, and referral revenue before applying any software
              multiple.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
      - number: '4.2'
        title: Pricing, GTM, and sales-efficiency proxies
        blocks:
          - type: paragraph
            body: >
              Public pricing is not a consumer list-price story. An early independent case study says KRY received
              public reimbursement and that patient pricing was the same as physical-clinic visits in Sweden (SI004).
              Sacra's later account adds that national payers can pay per service or through a monthly subscription for
              enrolled citizens, while doctors may buy a telehealth SaaS product (SI011). This implies at least three
              commercial motions: public reimbursement, contracted or capitated payer access, and professional software.
              The evidence does not disclose realized rates, discounts, payer contract duration, renewal, CAC, payback,
              or channel take rates. A company job repost confirms a mature SARA EMR platform with external integrations
              and a regulated-care workflow, which can support retention but does not prove pricing power or margin
              (SI005). The practical sales-efficiency proxy is operational throughput: Techarenan reports that
              administrative work per patient-doctor interaction was streamlined by approximately 30% after AI adoption,
              but the same article says group-level financials remained unprofitable (SI012). This is an efficiency
              signal, not CAC payback or gross-margin evidence. The revenue model bridge below therefore shows the
              causal path from enrolled or visiting patients to payer and provider revenue without inventing conversion
              rates.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
          - type: table
            tableRef: TI002
            claimRefs:
              - CI005
              - CI006
      - number: '4.3'
        title: Cost structure and unit-economics visibility
        blocks:
          - type: paragraph
            body: >
              The cost base is structurally labor- and compliance-heavy. Kry's public job material describes clinicians,
              software engineers, data specialists, regulated data models, integrations, testing, security, and audit
              trails; these are operating requirements rather than separately disclosed cost lines (SI005). EUJobs
              publishes broad, indicative compensation bands by seniority, but those ranges are a low-confidence
              labor-cost proxy, not Kry payroll evidence (SI002). Techarenan states that country-level profitability
              coexisted with group-level unprofitability because of technology investment (SI012). Sacra's analysis
              reports $123M of losses against $164M revenue, citing Swedish filings, but its 2023 publication date means
              the figure is historical rather than current (SI011). Scalable reports 2024 EBITDA of minus SEK 505M,
              while a 2026 SWOT assessment still characterizes Kry as loss-making with high cash burn and thin margins
              in publicly funded consultations (SI006, SI001). These sources point to clinician delivery, clinic
              overhead, customer acquisition, technology, and regulatory costs as the principal drivers, but no public
              source in this pool supplies contribution margin by market, clinician utilization, visit-level gross
              profit, or a reconciled group cash-flow statement. Every missing unit-economics field is therefore an
              explicit diligence request rather than a modeled zero.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
              - CI016
      - number: '4.4'
        title: Capital adequacy and underwriting verdict
        blocks:
          - type: paragraph
            body: >
              Kry has raised substantial private capital, but funding raised is not cash available. UpMarket describes
              the company as private, cites the April 2021 Series D at a $2B post-money valuation, and flags capital
              intensity, utilization, reimbursement dynamics, and cost control as risks (SI008). GetLatka lists $627M
              raised across three rounds and a $2B July 2022 valuation, but says its 2024 revenue source is not recorded
              (SI009). EquityZen confirms that secondary-market access comes from existing shareholders rather than a
              company-issued financing (SI007). None of these sources provides current cash, debt, covenants, burn,
              runway, financing terms, or a next-round trigger. The financial verdict is therefore conditional: the
              platform may be approaching market-level profitability in selected geographies, yet group underwriting
              remains blocked until management supplies a current cash bridge, debt schedule, market-level contribution
              margins, and reconciled revenue by stream and geography.
            claimRefs:
              - CI013
              - CI014
              - CI015
          - type: table
            tableRef: TI003
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
              - CI015
              - CI016
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI002
              - CI005
              - CI006
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Diversified monetization
            body: >-
              Kry has payer, provider-software, and referral mechanisms, reducing dependence on a single customer
              payment path, although the revenue contribution and margin of each stream remain undisclosed.
            calloutType: strength
            claimRefs:
              - CI001
              - CI002
          - type: callout
            title: Liquidity is the gating issue
            body: >-
              Public sources do not disclose current cash, burn, runway, debt, covenants, or financing triggers; funding
              raised and historical valuation cannot substitute for a liquidity bridge.
            calloutType: risk
            claimRefs:
              - CI013
              - CI014
              - CI015
          - type: callout
            title: Underwrite market by market
            body: >-
              Require reconciled revenue, contribution margin, utilization, renewal, and cash data by geography and
              stream before assigning a current valuation or financing need.
            calloutType: recommendation
            claimRefs:
              - CI003
              - CI009
              - CI011
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and workflow
        blocks:
          - type: paragraph
            body: >-
              Kry's customer-facing product is a digital healthcare access layer: its official site says patients can
              see a doctor, nurse or psychologist online within minutes, while also describing integration of primary,
              urgent and secondary care with digital and physical care. The earlier HBS case describes video-only
              appointments, drop-in or future sessions, diagnosis, prescriptions where appropriate and referrals to
              laboratories or specialist clinics. These sources establish the patient workflow, but do not establish
              clinical outcomes or realized time savings. Kry's public employer material also describes a separate
              clinician and administration workflow through the SARA EMR platform, indicating that the product is not
              merely a video front end. The combination creates a coherent access-to-care workflow, while leaving the
              payer, triage and escalation logic to be verified in diligence.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
              - CE016
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE002
            claimRefs:
              - CE002
              - CE003
              - CE007
              - CE008
      - number: '5.2'
        title: Operating architecture and maturity
        blocks:
          - type: paragraph
            body: >-
              The strongest technical evidence is the Software Engineer specification for Kry's Healthcare Systems Team.
              It names SARA as a mature enterprise healthcare platform serving clinicians and patients across Sweden,
              with Windows Forms, ASP.NET web portals, backend services and SQL Server databases. It also names
              integrations with e-prescription systems, population registries, SMS gateways and appointment booking
              platforms. This is a credible operating-architecture signal because it is tied to a concrete engineering
              role, although it is still a company job posting rather than an independent technical audit. The same
              posting calls for code reviews, comprehensive tests, data security, audit trails and compliance, which
              indicates control requirements but does not prove that controls are effective. Kry's official page
              separately claims that digital and physical care are integrated across markets; the public record does not
              expose service-level objectives, incident history, penetration-test results or integration uptime.
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
              - CE011
          - type: table
            tableRef: TE003
            claimRefs:
              - CE001
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
              - CE011
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE006
              - CE007
              - CE008
      - number: '5.3'
        title: Differentiation, trust and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              Kry's differentiator is an operating model rather than a disclosed proprietary algorithm: the company
              combines patient access, clinician workflows, physical clinics and health-system relationships. The HBS
              case reports that Kry used centralized digital documentation and claimed lower state cost per patient, but
              those statements are historical case analysis and are not current audited performance evidence. IQVIA's
              2024 market review shows that digital care is becoming more mature while funding, reimbursement and
              commercial adoption remain difficult across the sector; that context raises the bar for proving clinical
              utility, reimbursement durability and operational efficiency. The product thesis is therefore credible at
              the workflow level, but underwriting should not assume that scale, app features or integration breadth
              equal defensible IP, regulatory clearance, security assurance or positive unit economics. The
              highest-value next evidence is a current system architecture pack, security and privacy attestations,
              incident and uptime history, clinical quality metrics, and deployment-level outcomes by market.
            claimRefs:
              - CE012
              - CE013
              - CE014
              - CE015
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Product maturity is clearest in workflow breadth
            body: >-
              The evidence is strongest for Kry's breadth of care workflow and enterprise systems; evidence is
              materially weaker for proprietary technology, measurable reliability and security outcomes.
            calloutType: insight
            claimRefs:
              - CE001
              - CE006
              - CE009
              - CE015
          - type: callout
            title: Do not equate public scale with technical defensibility
            body: >-
              Patient-interaction volume and market presence can support operating scale, but they do not by themselves
              establish product retention, clinical quality, security or IP defensibility.
            calloutType: assumption
            claimRefs:
              - CE012
              - CE015
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Patient reach spans direct digital access and hybrid care
        blocks:
          - type: paragraph
            body: >-
              Kry's customer surface is broader than a direct-to-consumer telehealth app. Historical evidence places the
              service across five European markets under the Kry and Livi brands, while current app listings explicitly
              cover Sweden and Norway. In Sweden, the company now presents a hybrid offer: patients can enter through
              chat or video, visit one of 34 health centres, or move into specialist and follow-up care. Public
              reimbursement has historically made the patient price comparable with a physical clinic, and third-party
              descriptions also position public and private healthcare professionals as ecosystem partners. These
              sources identify patients, clinicians, and health systems as users or counterparties, but they do not
              disclose which party bears revenue by market or channel. Segment economics therefore remain an
              underwriting gap rather than an inferred mix.
            claimRefs:
              - CU004
              - CU006
              - CU012
              - CU013
          - type: table
            tableRef: TU001
            claimRefs:
              - CU004
              - CU006
              - CU011
              - CU012
              - CU013
      - number: '6.2'
        title: Cumulative adoption is credible, but period activity is not disclosed
        blocks:
          - type: paragraph
            body: >-
              The available milestones show a large increase in reported use: more than 100,000 users in 2017, 1.4
              million completed patient meetings by January 2020, and 14 million cumulative care meetings on the current
              Swedish site. The 2017 release also said Kry served more than 1% of Swedish primary care and employed more
              than 200 doctors. Current marketplace signals add 280,000 iOS ratings at 4.9 out of 5 and a
              company-reported service level in which 80% of patients received help within 23 minutes. These metrics
              have different denominators and periods: cumulative meetings are not active patients, ratings are not
              visits, and web traffic is not paid utilization. Dealroom's 350,000 monthly visits, 90.5% attributed to
              Sweden, are best treated as a directional channel- concentration proxy rather than a customer count.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU005
              - CU007
              - CU008
              - CU010
              - CU011
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU003
              - CU005
              - CU007
              - CU010
      - number: '6.3'
        title: Regulatory and marketplace proof exists; retention proof does not
        blocks:
          - type: paragraph
            body: >-
              The strongest external quality evidence is the Care Quality Commission's November 2024 report for Kry UK,
              which rated the service Good for safe, effective, caring, responsive, and well-led care. App Store volume
              and rating provide a broad consumer-sentiment signal, while historical investor releases document adoption
              milestones. None of these measures establishes renewal, gross or net revenue retention, repeat
              consultation frequency, or institutional contract duration. Nor does the assigned evidence disclose named
              NHS, insurer, employer, or regional-system accounts with contract value and renewal outcomes. Public proof
              therefore supports real patient use and regulated service delivery, but not commercial durability. The
              named-proof exhibit is deliberately a partial sample of verifiable cohorts and service evidence, not a
              customer roster.
            claimRefs:
              - CU001
              - CU003
              - CU007
              - CU009
              - CU015
          - type: table
            tableRef: TU003
            claimRefs:
              - CU001
              - CU003
              - CU007
              - CU009
      - number: '6.4'
        title: Hybrid continuity creates expansion paths, with unresolved channel risk
        blocks:
          - type: paragraph
            body: >-
              Kry's disclosed journey can move a patient from app-based booking and triage to a clinician consultation,
              prescription or referral, physical care when needed, and follow-up. The SARA electronic medical record job
              description says the platform serves thousands of patients and clinicians daily, indicating that the
              operational surface extends beyond a consumer front end. The hybrid model could deepen engagement across
              primary, specialist, mental-health, and chronic-care needs, but the pool offers no cohort evidence that
              this pathway improves repeat use or economics. A historical HBS analysis also cautioned that claimed
              relief of clinician shortages could be contested if professionals move from physical clinics to Kry.
              Management diligence should therefore reconcile channel-level revenue, clinician utilization, payer
              concentration, and repeat-use cohorts before treating cumulative meetings as durable expansion.
            claimRefs:
              - CU011
              - CU014
              - CU015
              - CU016
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU014
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Adoption is not retention
            body: >-
              No assigned source discloses NRR, GRR, churn, repeat-consultation cohorts, institutional contract
              duration, or top-customer revenue concentration.
            calloutType: risk
            claimRefs:
              - CU015
          - type: callout
            title: Clinician capacity may shift rather than expand
            body: >-
              A historical HBS analysis noted that reduced clinic shortages could be contested if healthcare
              professionals move from incumbent clinics to Kry.
            calloutType: insight
            claimRefs:
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Financial and financing exposure
        blocks:
          - type: paragraph
            body: >-
              Kry's 2024 annual report describes a business still moving toward profitability rather than one that has
              reached self-funding. Consolidated net sales increased to SEK 2,497 million, but operating margin remained
              negative and the Group reported negative cash flow. Management links the improvement in cash flow to new
              convertible and debt financing, so the path to positive EBITDA remains dependent on execution and capital
              structure. The accounts report SEK 239 million of Group cash and cash equivalents at year-end and SEK
              867.633 million of interest-bearing liabilities. This creates a financing and refinancing risk even though
              the board judged the going-concern plan implementable. Secondary-market providers also warn that
              private-company valuation and liquidity are uncertain; those pages are not evidence of a current
              transaction price. Monitoring should therefore focus on cash conversion, debt terms, covenant headroom,
              and whether positive EBITDA is sustained without incremental capital.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR002
              - CR006
              - CR009
              - CR010
              - CR011
              - CR015
              - CR016
      - number: '7.2'
        title: Regulatory, legal, and data exposure
        blocks:
          - type: paragraph
            body: >-
              Kry's annual report discloses two active Swedish reimbursement disputes after year-end. Region Skåne
              terminated a midwife-clinic agreement and sought SEK 18.8 million, while Region Stockholm demanded SEK 48
              million over consultations it says were compensated twice. Kry disputes both demands; no current
              disposition appears in the assigned evidence. The report also lists regulatory healthcare, legal and
              contract, production, technology, and information-security risks, and says policy changes can
              significantly affect the company across publicly funded systems. The UK app listing states that the
              service is CQC-regulated and confidential, while its privacy disclosure lists sensitive identity-linked
              data. These statements describe controls and exposure, not proof that controls are effective. Diligence
              should obtain the regional case files, current registrations, audit results, data-processing agreements,
              incident logs, material complaints, and litigation searches by jurisdiction. The absence of a surfaced
              incident in this pool is not evidence that no incident occurred.
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR016
          - type: table
            tableRef: TR001
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR016
      - number: '7.3'
        title: Operational and service reliability
        blocks:
          - type: paragraph
            body: >-
              Kry's operating model spans an app, video and chat consultations, physical clinics, partner clinics,
              clinicians, external healthcare services, and a mature electronic medical-record platform. The company's
              engineering job listing describes integrations with e-prescription systems, population registries, SMS
              gateways, and appointment-booking platforms, and calls the platform mission-critical for patient care.
              That breadth increases the number of failure points where outages, booking defects, data-integrity errors,
              or clinician-availability constraints could disrupt care. Independent app telemetry reports 2.6 million
              installs and a 4.57 rating from about 61 thousand ratings, but individual reviews describe missed calls,
              missed appointments, rebooking, and availability failures. The evidence supports a monitorable reliability
              risk, not a measured incident rate. Management should provide service-level metrics by market, appointment
              completion and rebooking rates, severity-one incident history, recovery times, and clinician capacity by
              channel.
            claimRefs:
              - CR006
              - CR008
              - CR009
              - CR011
              - CR012
              - CR013
          - type: table
            tableRef: TR002
            claimRefs:
              - CR006
              - CR008
              - CR009
              - CR011
              - CR012
              - CR013
      - number: '7.4'
        title: Dependencies, residual exposure, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Kry's own accounts identify exposure to public-health policy, foreign-exchange movements, contractual
              counterparties, technology, and information security. The 2024 report says exchange-rate movements against
              the euro and pound affected earnings, and its revenue policy describes partner consultations and payments
              from regions, insurers, and other customers. The available evidence does not disclose customer
              concentration, renewal rates, supplier concentration, or the terms and covenants of the debt and
              convertible facilities. Those omissions matter because a hybrid-care network can appear diversified by
              geography while remaining concentrated by payer, regulator, platform dependency, or key clinical
              workforce. A thesis-break condition is a return to sustained negative EBITDA accompanied by falling cash
              or a new financing need on materially worse terms. Other triggers are a material regulatory restriction, a
              reportable privacy or clinical-safety event, repeated severe booking failures, or loss of a major payer or
              partner without replacement capacity. Until those indicators are disclosed and tracked, the residual risk
              rating should remain high.
            claimRefs:
              - CR004
              - CR005
              - CR011
              - CR014
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR004
              - CR005
              - CR008
              - CR009
              - CR011
              - CR015
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Financing remains the central thesis-break risk
            body: >-
              The 2024 accounts show improved margins but negative cash flow, negative operating profitability, and SEK
              867.633 million of interest-bearing liabilities; sustained positive EBITDA and current covenant headroom
              need verification.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: callout
            title: Reliability evidence is directional, not a rate
            body: >-
              App telemetry indicates broad reach and strong average ratings, while dated user reviews document missed
              calls and booking failures; the missing denominator prevents a conclusion about incident frequency.
            calloutType: insight
            claimRefs:
              - CR011
              - CR012
              - CR013
          - type: callout
            title: Stated controls are not tested controls
            body: >-
              The annual report and app listings describe monitoring, safety, confidentiality, and compliance, but the
              assigned evidence does not include independent assurance, incident logs, or regulator findings.
            calloutType: assumption
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Operating proof is improving, but the financing anchor is stale
        blocks:
          - type: paragraph
            body: >-
              Kry's 2024 company release reports SEK 2.5bn of group revenue, EBITDA of SEK -505m versus SEK -960m in
              2023, and an EBITDA margin improvement from -19.5% to -4.4%. It also says all markets returned a profit at
              the end of 2024, while acknowledging that the company remains on a path toward group profitability.
              Independent coverage adds an important qualification: country-level profitability does not equal group
              profitability, and the group has continued to invest in technology. This is meaningful operating progress,
              not proof of positive consolidated cash generation. The only explicit valuation mark in the retained pool
              is CNBC's April 2021 report of a $300m round at a $2bn valuation; it is a historical financing reference,
              not a current entry price. The public evidence does not disclose a 2025 or 2026 round, current share
              price, liquidation preferences, or governance rights.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV008
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV007
              - CV008
      - number: '8.2'
        title: Scale and business-model evidence support the upside case, not a multiple
        blocks:
          - type: paragraph
            body: >-
              Kry has a credible hybrid-care scale story. Its current company materials describe operations in Sweden,
              Norway, France, and the UK, around 60 physical facilities, and more than 14 million consultations; another
              company profile reports 72 clinics and more than 200,000 consultations per month, showing that even
              company-reported operating snapshots are not perfectly reconciled. Sacra describes three revenue
              mechanisms—video consultations, SaaS sold to doctors, and referral payments—and reports a 2022 revenue mix
              concentrated in Sweden. These disclosures support a model with recurring payer exposure and operating
              leverage potential, but they do not supply a comparable-company multiple or a normalized margin base. The
              retained evidence includes telehealth public-market drawdowns and regional competitors, but those are
              context for risk and comparability rather than a defensible mark for Kry. A valuation method should
              therefore wait for a reconciled revenue definition, contribution margin by market and channel, and current
              financing data.
            claimRefs:
              - CV006
              - CV007
              - CV009
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV007
              - CV008
              - CV010
              - CV011
      - number: '8.3'
        title: Scenarios are asymmetric because current price and terms are unavailable
        blocks:
          - type: paragraph
            body: >-
              The bull case is operational rather than multiple-driven: the 2024 margin improvement continues,
              country-level profitability becomes consolidated profitability, and the hybrid digital/physical model
              converts consultation scale into durable payer economics. The base case assumes continued growth with
              unresolved group-level losses, uneven market economics, and no evidence that the 2021 financing mark
              remains supportable. The bear case combines renewed funding needs, a down-round or preference overhang,
              slower commercialization, and multiple compression after the post-COVID telehealth reset described by
              Sacra. Probability signals are qualitative because the pool contains no current cap table, cash balance,
              debt schedule, or observable transaction price. Ranges are therefore intentionally withheld. The
              appropriate decision variable is an entry-price discount to a diligence-confirmed intrinsic value, not a
              stale headline valuation.
            claimRefs:
              - CV003
              - CV004
              - CV007
              - CV008
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV004
              - CV007
              - CV008
              - CV013
              - CV014
      - number: '8.4'
        title: Track pending price, terms, and consolidated economics
        blocks:
          - type: paragraph
            body: >-
              The recommendation is track, with medium-low confidence in the valuation call and high risk. The company
              has substantial operating evidence and a plausible route to better economics, but the evidence is
              insufficient to say whether a buyer would be receiving that improvement at a reasonable price. EquityZen
              confirms that secondary liquidity can be offered through existing shareholders and that exits depend on an
              IPO, merger, acquisition, or eligible secondary transaction; this describes access mechanics, not a
              current Kry clearing price. Dealroom also states that some cap-table data are hidden and that its
              percentages are indicative. Before upgrading, diligence should obtain the latest financing documents,
              fully diluted capitalization, preference and anti-dilution terms, cash and debt schedule, monthly
              contribution margins, clinician utilization, payer concentration, and reconciled consultation and revenue
              KPIs. Exit readiness is not established by marketplace availability alone.
            claimRefs:
              - CV002
              - CV008
              - CV012
              - CV013
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV007
              - CV008
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Track, do not underwrite a current buy
            body: >-
              The public evidence supports a credible operating trajectory but not a current price-sensitive valuation
              decision.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV015
          - type: callout
            title: The 2021 mark is not a current price
            body: >-
              The retained financing evidence is five years old at the report date and does not disclose current
              preferences, dilution, or liquidity terms.
            calloutType: risk
            claimRefs:
              - CV003
              - CV012
              - CV013
          - type: callout
            title: Consolidated cash economics are the gating assumption
            body: >-
              Country-level profitability and improved EBITDA margin must be reconciled to consolidated cash flow before
              a valuation multiple can be applied.
            calloutType: assumption
            claimRefs:
              - CV001
              - CV002
              - CV008
