  - id: FV001
    title: Recommendation logic
    summary: >-
      Operating scale and improving margins support continued diligence, while stale pricing evidence and unresolved
      financing terms cap the recommendation at track.
    type: flow
    data:
      nodes:
        - id: scale
          label: Scale
          detail: More than 14m consultations and a multi-market physical footprint are company-reported.
        - id: margin
          label: Operating improvement
          detail: Reported 2024 EBITDA margin improved to -4.4% from -19.5%.
        - id: financing
          label: Historical financing
          detail: CNBC reported a $2bn valuation in the 2021 $300m round.
        - id: opacity
          label: Price opacity
          detail: Current price, cap table, preference terms, cash, and debt are unresolved.
        - id: downside
          label: Downside
          detail: Historical losses and telehealth multiple compression remain relevant adverse signals.
        - id: decision
          label: Decision
