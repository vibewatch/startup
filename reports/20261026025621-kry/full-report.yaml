  - id: FM001
    title: Serviceable-market qualification stack
    type: pyramid
    summary: >-
      Addressability narrows through geography, clinical scope, payer access, integration, delivery capacity, and
      compliance rather than through an unsupported top-down market-share assumption.
    data:
      items:
        - label: Geography
          value: Four core markets
          detail: Sweden, Norway, the UK, and France
        - label: Clinical scope
          value: Primary-care pathways
          detail: Triage, consultation, navigation, and appropriate escalation
        - label: Payer access
          value: Multiple routes
          detail: Public systems, insurers, employers, and direct payment
        - label: Integration
          value: Front door plus records
          detail: Public apps, practice systems, and clinical workflows
        - label: Delivery capacity
          value: Digital plus physical
          detail: Clinician availability and clinic escalation constrain throughput
        - label: Compliance
          value: Phased EU requirements
          detail: Security and interoperability obligations expand through 2029 and 2031
    approximationNotes: >-
      This is a qualitative qualification stack, not a value-proportional TAM/SAM/SOM pyramid; order shows narrowing
      criteria only.
    claimRefs:
      - CM001
      - CM003
      - CM011
      - CM012
      - CM013
