callouts:
  - calloutType: risk
    title: "Platform Allocation Concentration: Flash's Structural Ceiling"
    body: >-
      Flash Express's Lazada partnership provides meaningful volume, but Shopee — Thailand's largest
      e-commerce platform at ~49% GMV — routes through Shopee Xpress rather than open 3PLs. With
      TikTok Shop (21% GMV) increasingly favouring J&T, Flash's platform access covers only the
      Lazada channel (~30% GMV), leaving the majority of platform-generated parcel volume inaccessible
      without a new platform deal or a pivot into off-platform merchant segments. This is the primary
      adverse structural finding from the competitive review.
    claimRefs:
      - CP027
      - CP028
      - CP029
      - CP030

  - calloutType: insight
    title: "Price War Has Reached a Floor — Differentiation Must Shift"
    body: >-
      The coordinated April 2026 fuel surcharge imposed simultaneously by Flash, J&T, and KEX signals
      that the Thai parcel price floor has been hit. All three major private carriers now quote nearly
      identical base rates (25–40+ THB/parcel), making price an ineffective differentiator. Competitive
      advantage will increasingly be decided by platform integration depth, tech stack, fulfillment
      capabilities, and service reliability — areas where J&T's automation investments and SF/KEX's
      AI tools may erode Flash's operational edge if capex is not sustained.
    claimRefs:
      - CP032
      - CP033
      - CP034
      - CP035

  - calloutType: strength
    title: "Flash is One of Only Two Profitable Private Couriers in Thailand"
    body: >-
      Flash Express and J&T Express are the only two major private Thai parcel carriers to have achieved
      profitability as of 2024, with Flash posting 940M THB and J&T 819M THB net income. Kerry Express
      posted a 5.91B THB net loss; Thailand Post's financials are not separately segmented for parcel
      operations. This duopoly of profitability in a market that destroyed the economics of most entrants
      is a genuine strength and reflects Flash's structural cost management and volume scale.
    claimRefs:
      - CP003
