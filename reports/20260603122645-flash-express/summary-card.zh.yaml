  headline: |
    Flash Express 是泰国物流市场真正的规模赢家，2024 年盈利也已验证；但利润率薄、私募市场条款不透明，且 2022 年估值锚点已经陈旧，因此更适合继续研究，而不是按上一轮估值重新承保。
