  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: platform-revenue-concentration
      missingEvidence: >
        Revenue breakdown by platform partner (Shopee, Lazada, TikTok Shop, direct) as a
        percentage of total Flash Express Thailand revenue.
      whyItMatters: >
        Without knowing the exact revenue split, it is impossible to quantify the financial
        impact of losing any single platform relationship — which is the primary kill-criterion
        risk identified in this chapter.
      diligencePath: >
        Request CFO-level disclosure of revenue and volume by platform partner under NDA
        during due diligence; cross-validate against logistics platform market-share data
        from Momentum Works and SHIPPOP.
      relatedQuestionRefs:
        - QR011

    - type: private-evidence-only
      severity: material
      topic: gig-rider-headcount-and-reclassification-cost
      missingEvidence: >
        Exact headcount of gig delivery riders in Thailand, their average monthly earnings,
        and a legal modelling of incremental social security and benefit costs under the
        draft Independent Workers Protection Act.
      whyItMatters: >
        The labor reclassification risk is identified as a "High" residual severity risk
        but cannot be quantified without rider headcount and compensation data; the financial
        model may be significantly understated if rider count exceeds 30,000.
      diligencePath: >
