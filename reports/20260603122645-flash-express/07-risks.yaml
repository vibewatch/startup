  - id: financial-working-capital-risks
    title: Financial and Working-Capital Risks
    body: >
      Flash Express returned to profitability in 2024 (THB 940 million net profit) after
      years of price-war-driven losses, but this fragile recovery rests on cost discipline
      that is now being tested by fuel-cost pressure, platform pricing pressure, and
      regulatory cost increases. Three private courier companies—Flash Express, KEX, and
      J&T—announced a synchronized 3-baht per parcel fuel surcharge effective April 1, 2026.
      While presenting this as a necessary cost-recovery measure, the TCCT is examining
      whether the simultaneous announcement constitutes price-fixing or cartel conduct under
      Section 54 of the Trade Competition Act, which carries criminal liability. Regional
      sector margins have declined 200–400 basis points over 2023–2025 as platform-operated
      delivery has undercut commercial pricing floors—Lazada and Shopee self-operate delivery
      at an estimated 15 baht/parcel, below the cost floor for independent couriers at
      commercial scale. Flash Express has disclosed no capital raise since the $150 million
      Series E in 2021. Debt covenants, credit facilities, and working-capital lines are
      not publicly disclosed, creating opacity around financial resilience.
      COD working-capital risk compounds operational exposure: logistics companies holding
      COD settlements in transit carry credit exposure to riders, franchisees, and
      merchants. Disputes, returns, and refusals extend the settlement cycle and tie up
      cash. Flash Express's estimated COD float—derived from the 2.5% fee structure and
      typical settlement cycles—represents a meaningful fraction of monthly operating
      revenue, though exact figures are not publicly disclosed.
