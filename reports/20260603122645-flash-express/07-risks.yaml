tables:
  - id: TR001
    title: Regulatory / Legal Risk Register
    columns:
      - Rule / Law / Case
      - Jurisdiction
      - Status
      - Likelihood of Impact
      - Severity
      - Mitigation
      - Residual Exposure
      - Diligence Path
    rows:
      - - "TCCT Open-Logistics Mandate (Trade Competition Act 2017, Sections 50/54/57)"
        - Thailand
        - "In force since March 25 2026 (Royal Gazette March 24)"
        - High — directly targets platform-forced logistics
        - High — criminal penalties up to 10% revenue and 2 years imprisonment
        - TCCT mandate creates structural tailwind; Flash Express should monitor compliance and file complaints if platforms violate
        - Medium — enforcement depends on TCCT capacity and political will; platforms may comply formally while informally routing volume
        - Obtain confirmation that Flash Express has filed no cartel-related allegations under Sections 50–57
      - - "Draft Independent Workers Protection Act (Semi-independent worker classification)"
        - Thailand
        - "Draft circulating since 2024; enactment timeline uncertain as of June 2026"
        - Medium — bill is advancing but not enacted
        - High — reclassification of 20,000+ gig riders as employees would impose social security, benefits, and minimum wage obligations
        - No formal contracts issued; Flash Express has not publicly addressed the bill
        - High — if enacted, labor cost structure changes materially; limited mitigants without collective industry lobbying
        - Confirm status of bill through Thai Ministry of Labour; obtain Flash Express management position and legal opinion
      - - "PDPA (Personal Data Protection Act B.E. 2562) — Data breach and security compliance"
        - Thailand
        - "Active enforcement since 2025; PDPC issued THB 21.5M in fines across five cases (August 2025)"
        - Medium-High — logistics companies specifically flagged under heightened PDPC scrutiny
        - Medium — fines up to THB 7M per incident (tech retailer 2025 case); potential criminal liability for intentional misuse
        - Appoint DPO, implement ROPA, conduct breach drills, review third-party data processing agreements
        - Medium — current disclosure gap (no public DPO appointment) is itself a compliance exposure
        - Request DPO appointment confirmation, ROPA documentation, incident response SLA from management
      - - "TCCT Cartel Investigation — Synchronized 3-baht fuel surcharge (April 2026)"
        - Thailand
        - "Under active TCCT review as of April 2026 per official statements"
        - Low-Medium — proving cartel coordination requires evidence beyond simultaneous pricing
        - High — if criminal cartel proven, penalties up to 10% revenue under Section 54
        - Flash Express argues surcharge reflects genuine fuel cost pass-through
        - Low-Medium — fuel cost escalation provides legitimate defense; cartel proof is legally difficult
        - Request legal opinion on TCCT exposure from Flash Express counsel; monitor TCCT statements
      - - "Flash Malaysia Express Sdn Bhd v. Muhammad Firdaus [2025] MLJU 3710 — Employment dismissal (High Court)"
        - Malaysia
        - "Resolved at High Court (Flash Express won appeal); operations ceased Jan 2026"
        - Low — resolved; Malaysia operations wound down
        - Low — precedent-setting on domestic inquiry requirements; no material financial liability
        - Operations in Malaysia closed; case is resolved
        - Low — no ongoing liability in Malaysia
        - Note precedent for employment dispute management in future markets (Philippines, Thailand)
    notes: >
      Severity and likelihood ratings are qualitative assessments based on regulatory text,
      enforcement actions documented in 2025–2026 legal publications (Tilleke, Hogan Lovells,
      PimLegal, BangkokGlobalLaw), and analyst commentary. TCCT fines and PDPA penalty ranges
      are sourced from primary regulatory action announcements. The Malaysia court case
      [2025] MLJU 3710 is a court document sourced via kuekong.com (access attempt returned
      blocked status); case facts verified via web-search summary. Diligence paths require
      direct engagement with Flash Express management and legal counsel.
    enumerationScope:
      coverage: partial
      basis: >
        Enumerated material legal and regulatory risk exposures for Flash Express in Thailand
        and Malaysia (post-exit for precedent) as of June 2026. Philippines, Cambodia, and
        Vietnam regulatory exposure excluded due to limited publicly available primary
        documentation; risks are ordered by severity.
