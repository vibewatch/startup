  - id: partner-platform-risks
    title: Partner and Platform Concentration Risks
    body: >
      The platform dependency risk is Flash Express's single highest-severity exposure:
      Shopee, Lazada, and TikTok Shop collectively control 98.8% of Southeast Asia's
      e-commerce GMV, and each is building or deepening proprietary logistics capabilities.
      TikTok Shop has an exclusive or deeply preferred logistics partnership with J&T Express
      in Thailand, meaning Flash Express must compete with a platform-favoured rival for
      TikTok's rapidly growing parcel volumes. Shopee's own Shopee Xpress subsidiary is
      expanding; Flash Express retains Shopee SSL status but this is terminable without
      notice. Lazada is repositioning toward premium managed fulfillment where Flash
      Fulfillment holds LGF and JIT integrations, but Lazada's own declining Thai market
      share reduces the strategic value of this relationship.
      The Malaysia exit proves what platform exclusion looks like in practice: industry
      insiders attribute the exit to an "unbalanced playing field" created by exclusive
      platform deals that starved independent couriers of order flow. Flash Express Malaysia
      operated from October 2021 to January 2026—four years—before the volume economics
      became unsustainable. Delyva, a major Malaysian logistics aggregator, formally migrated
      its entire merchant base to J&T, SPX Express, Pos Laju, and Ninja Van after the
      Flash Express Malaysia shutdown, demonstrating how platform-partner exits cascade to
      downstream ecosystem partners. The Logistech Association Thailand president has called
      the Malaysia exit "a warning signal" and urged urgent regulatory intervention to
      prevent the same dynamic playing out in Thailand.
      The risk transmission DAG shows how platform self-preferencing transmits through
      volume loss, revenue compression, brand damage, and ultimately to market exit if
      unchecked. The TCCT open-logistics mandate provides partial countervailing force,
      but enforcement remains untested.
