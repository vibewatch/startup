callouts:
  - calloutType: strength
    title: First Profitable Year Validates Cost Discipline
    body: >-
      Flash Express's THB 940M net profit in 2024 — after three loss years — confirms that the
      post-price-war rationalisation is real. Revenue grew 23% to THB 24,728M while the company
      maintained positive margins, suggesting structural cost improvements and favourable platform-mix
      shifts (TikTok, Shopee). This profitability turn is the most important near-term bullish signal.
    claimRefs: [CV009, CV011, CV012]

  - calloutType: risk
    title: Private Mark of $2.1B Embeds a 2.5× Premium to Nearest Public Comparable
    body: >-
      At Flash Express's December 2022 private mark, EV/Revenue is approximately 3.1× versus
      J&T Express's public benchmark of 1.25×. Applying J&T's multiple to Flash Express's 2024
      revenue yields a fair value of ~$840M — a 60% markdown from the private mark. Until Flash
      demonstrates 6%+ EBITDA margins or secures a confirmed public-market exit, investors face
      meaningful downside risk.
    claimRefs: [CV006, CV027, CV028]

  - calloutType: risk
    title: J&T Express's SEA Expansion Is the Single Largest Threat
    body: >-
      J&T Express's adjusted EBITDA in Southeast Asia grew 50.5% to $310M in H1 2025, with
      market share reaching 32.8% (+5.4 pp year-on-year). Its Thailand cost per parcel is falling
      rapidly. Flash Express, competing in the same market, risks margin compression and volume
      attrition unless it can differentiate on service quality or win large non-platform enterprise
      accounts.
    claimRefs: [CV007, CV024, CV035]

  - calloutType: recommendation
    title: Research-More — Price Reset Required Before Commitment
    body: >-
      At the $2.1B private mark, Flash Express does not offer an attractive risk/reward relative
      to public-market logistics alternatives. The base-case fair value is $800M–$1.2B. Investors
      should seek a price reset to this range, full cap-table and preference-stack disclosure,
      2025 audited financials, and a confirmed exit pathway before committing capital. If all
      three conditions are met and price resets to $900M–$1.0B, the risk/reward becomes more
      balanced for patient investors with a 4–6 year horizon.
