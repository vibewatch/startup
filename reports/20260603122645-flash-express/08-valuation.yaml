  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: valuation-context
      missingEvidence: "Full capitalization table and Series F liquidation preference structure, anti-dilution provisions, and investor governance rights."
      whyItMatters: "Without preference-stack details, downside waterfall calculations for common holders are impossible; preference overhang could reduce common equity recovery to near zero at base-case exit valuations."
      diligencePath: "Request formal data room access from Flash Group CFO; review investment agreements with Series F counsel (Pavilion Capital, Jeneration Capital advisors)."
      relatedQuestionRefs: [QV019]

    - type: private-evidence-only
      severity: material
      topic: financials
      missingEvidence: "Audited or management-reviewed financial statements for fiscal year 2025 (full year) and Q1 2026, including EBITDA reconciliation and working capital position."
      whyItMatters: "2024 profitability must be confirmed as a trend rather than a one-year recovery; 2025 margin data is the key swing factor in the bull vs. base case distinction."
      diligencePath: "Request FY2025 audited accounts from management or Thai DBD filing once available; check DBD filing registry (January–March 2026 window for FY2025 accounts)."
      relatedQuestionRefs: [QV030]

    - type: private-evidence-only
      severity: material
      topic: exit-readiness
      missingEvidence: "Confirmed IPO timeline, target exchange, underwriter engagement letter, and target offering valuation range."
      whyItMatters: "Exit timing is the critical variable for IRR modelling; a 3-year vs. 7-year hold at $1.0B exit price implies very different returns for investors who entered at $2.1B."
      diligencePath: "Board-level disclosure or advisor engagement letter review; monitor SET and HKEX filing databases for preliminary prospectus registration."
      relatedQuestionRefs: [QV031]

    - type: missing-source
      severity: minor
      topic: comparable-valuation
      missingEvidence: "M&A transaction multiples for Asian logistics acquisitions of comparable parcel-delivery operators (e.g., control-premium comps from Cainiao, JD Logistics, or DHL Asia acquisitions)."
      whyItMatters: "Transaction comps provide a valuation floor anchored to control premiums; without M&A data, the analysis relies entirely on minority-stake public-market multiples which may understate strategic value."
      diligencePath: "Review M&A transaction databases (Capital IQ, Bloomberg) for logistics deals in SEA and comparable EM markets; search for Lazada/Shopee logistics arm transaction data."
      relatedTableRefs: [TV004]
      relatedQuestionRefs: [QV027]

    - type: missing-source
      severity: minor
      topic: financials
      missingEvidence: "Thailand-specific parcel volume data and market share for Flash Express versus J&T Express in 2025, disaggregated from regional J&T reporting."
      whyItMatters: "J&T's SEA market share data is regional; the Thai-specific competitive dynamic is the most direct proxy for Flash Express's revenue sustainability and pricing power."
      diligencePath: "Request industry reports from Thailand Postal and logistics associations; use CEP market research providers with Thailand-disaggregated data."

    - type: missing-source
      severity: minor
      topic: secondary-market
      missingEvidence: "Secondary market pricing and transaction volumes for Flash Express pre-IPO shares on platforms such as EquityZen or comparable venues."
      whyItMatters: "Secondary pricing would provide an arms-length valuation signal more current than the 2022 private mark, materially informing the base-case fair value range."
      diligencePath: "Check accredited-investor secondary platforms; request transfer agent records from Flash Group or known Series E/F holders."
      relatedQuestionRefs: [QV009]

    - type: enumeration-incomplete
      severity: minor
      topic: exit-readiness
      missingEvidence: "Complete list of diligence requirements including management team KPIs, technology audit, and ESG/regulatory compliance checks, which are standard pre-commitment asks not all publicly derivable."
      whyItMatters: "The diligence ask table (TV006) captures the most material items but is not exhaustive; missing items could surface late in the process and delay commitment."
      diligencePath: "Obtain standard logistics sector diligence checklist from a logistics-specialist PE firm; request management presentation deck and existing investor relations materials."
