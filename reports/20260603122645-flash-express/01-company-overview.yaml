  name: Flash Express

chapter:
  number: 1
  title: Company Overview
  summary: >
    Flash Express (Thailand) Co., Ltd., operating under Flash Group, is Thailand's first
    unicorn startup and the country's second-largest express parcel carrier. Founded in 2017
    by Thai-Chinese CEO Komsan Lee and Chinese COO Di Weijie, the company disrupted the
    domestic logistics market with aggressive pricing, free door-to-door pickup, and
    in-house technology. Flash raised approximately $997 million across six funding rounds
    to reach a $2.1 billion post-money valuation by late 2022. After posting its largest
    net loss in 2022, the company returned to profitability in 2024 with revenue of
    24.7 billion baht and net profit of 940 million baht. As of 2026, Flash Express
    operates in Thailand, the Philippines, Laos, and Vietnam, having exited Malaysia in
    January 2026 under competitive pressure from platform-dominated logistics networks.

sections:
  - id: identity-and-business-overview
    title: Identity and Business Overview
    body: >
      Flash Express (Thailand) Company Limited is incorporated in Bangkok, Thailand, and
      operates as the flagship delivery service of Flash Group—a privately held integrated
      e-commerce logistics conglomerate. The company was legally incorporated in September
      2017 and commenced operations in 2018. Under the concept "In mind, In delivery," Flash
      Express offers door-to-door parcel pickup and delivery, 365 days a year, with no
      minimum parcel volume required. It was the first courier in Thailand to provide
      free door-to-door pickup from the first piece, distinguishing it from incumbent carriers
      that required customers to drop off parcels at service branches.

      Flash Group's product portfolio has expanded well beyond its core express delivery
      service. Flash Fulfillment (FFM) operates warehousing and fulfillment centers totaling
      more than 130,000 square meters across six Southeast Asian countries, including an
      automated AGV-robot facility covering 16,000 square meters—the largest of its kind in
      Southeast Asia. Flash Logistics handles bulky and large-format items. Flash Bulky
      delivers items weighing up to 100 kilograms nationwide. In 2021, Flash entered a joint
      venture with Thailand Post and JWD InfoLogistics to offer cold-chain express delivery
      under the "Fuze Post" brand. The company also provides financial services through
      Flash Money and digital merchant tools for SME sellers.

      Flash Express competes in a Thai express parcel market valued at approximately
      115 billion baht in 2024, with the market growing 12–18 percent year-on-year driven
      by e-commerce expansion. As of early 2026, Thailand Post is the market leader, with
      Flash Express ranked second, followed by J&T Express, Lazada Express, and SPX Express.
      The company's pricing strategy disrupted the market when it launched with a 25-baht
      delivery fee, forcing incumbents to respond to a market where average shipping rates
      subsequently compressed from 39 baht to under 20 baht per parcel.
