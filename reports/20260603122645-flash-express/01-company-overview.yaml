  - id: founders-and-leadership
    title: Founders and Leadership
    body: >
      Flash Group was co-founded by two individuals whose complementary backgrounds proved
      decisive in the company's rapid ascent. Komsan Lee (Komsan Saelee), the CEO, is a
      Thai-Chinese entrepreneur born in the remote village of Doi Wawee in Chiang Rai
      province. He entered business in his first year of university, later working as a
      property sales agent, freight forwarder, and operator of a cross-border logistics
      business serving the US, Japan, and China. In 2018, aged 29, he invested approximately
      400 million baht from personal capital to launch Flash Express. His deep understanding
      of the Thai market and his entrepreneurial tenacity are credited as central to Flash's
      successful local positioning.

      Di Weijie (known as Wei Jie), the COO and co-founder, is a Chinese national who spent
      over eight years at Alibaba, where he played a role in the development of Alipay Wallet
      and its third-party merchant QR code payment solutions. He serves as Flash's
      technological driving force, designing the company's fully in-house software and
      algorithm suite—tailored specifically to Southeast Asia's cultural and operational
      context, given that Chinese logistics software was deemed unsuitable. The result is a
      tech-first management system that allows a single manager to oversee up to 200 people,
      and that eliminated half of the company's HR costs through digitized scheduling,
      recruitment, attendance, and overtime systems.

      Flash maintains a deliberately flat organizational structure. Executives are required to
      be hands-on rather than purely strategic, ensuring ground-level operational awareness.
      This culture was credited with preserving startup agility even as the company scaled
      to 54,000 employees. The firm's core values—customer-centricity, passion, honesty,
      and dedication—have remained unchanged since founding. No additional named executives
      beyond the two co-founders have been publicly disclosed in leadership communications,
      though the management team reportedly includes former Alibaba, Baidu, and SF Express
      alumni. Key-person dependence on Komsan Lee and Di Weijie is therefore a material
      governance consideration for diligence.
