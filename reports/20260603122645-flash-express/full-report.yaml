      - number: '2.3'
        title: Buyer segmentation and platform dynamics
        blocks:
          - type: paragraph
            body: >-
              The largest and most commercially significant buyer segment in Thailand's CEP market is SME online
              merchants selling through e-commerce platforms. These merchants — estimated to account for roughly 55% of
              parcel volume — are characterised by very high price sensitivity, small parcel sizes (typically 1–2 kg),
              and platform-mediated fulfillment workflows. Their logistics decisions are often made at the platform
              level: Shopee, Lazada, and TikTok Shop each have default logistics partnerships that channel significant
              volume toward preferred carriers, including Flash Express.

              Large-brand retailers represent an estimated 15% of volume and are characterised by lower price
              sensitivity, branded packaging requirements, and more stable contracted relationships. B2B corporate
              accounts at approximately 10% of volume are the most SLA-driven segment, requiring palletised or
              time-definite delivery on negotiated annual contracts. C2C social-commerce sellers — primarily operating
              through Facebook Marketplace and LINE — are estimated at roughly 12% of volume and are growing rapidly as
              second-hand goods and direct social selling gain traction. This segment is highly price-sensitive and
              platform-agnostic, making it contested by all major carriers.

              Healthcare and pharmaceutical buyers complete the picture at approximately 8%, representing the segment
              with the lowest price sensitivity and the clearest long-run structural growth case. Nexdigm's industry
              analysis confirms that Thailand's CEP buyer map is increasingly bifurcated between high-volume,
              price-sensitive platform-dependent merchants and lower-volume, SLA-dependent corporate accounts — a split
              that has important implications for Flash Express's product and pricing strategy going forward.
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM013
              - CM024
