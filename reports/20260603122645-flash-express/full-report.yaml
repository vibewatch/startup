            title: First Profitable Year Validates Cost Discipline
            body: >-
              Flash Express's THB 940M net profit in 2024 — after three loss years — confirms that the post-price-war
              rationalisation is real. Revenue grew 23% to THB 24,728M while the company maintained positive margins,
              suggesting structural cost improvements and favourable platform-mix shifts (TikTok, Shopee). This
              profitability turn is the most important near-term bullish signal.
            calloutType: strength
            claimRefs:
