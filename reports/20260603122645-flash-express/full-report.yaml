          - type: callout
            title: Research-More — Price Reset Required Before Commitment
            body: >-
              At the $2.1B private mark, Flash Express does not offer an attractive risk/reward relative to
              public-market logistics alternatives. The base-case fair value is $800M–$1.2B. Investors should seek a
              price reset to this range, full cap-table and preference-stack disclosure, 2025 audited financials, and a
              confirmed exit pathway before committing capital. If all three conditions are met and price resets to
              $900M–$1.0B, the risk/reward becomes more balanced for patient investors with a 4–6 year horizon.
