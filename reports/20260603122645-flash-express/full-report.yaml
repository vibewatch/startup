      - number: '3.4'
        title: Pricing, Distribution, and Switching Dynamics
        blocks:
          - type: paragraph
            body: >-
              Flash Express entered the Thai market with a 25-baht-per-parcel price point at a time when Kerry charged
              approximately 60 baht. The resulting price war compressed the industry-wide average from 39 baht per
              parcel to roughly 19 baht over the 2018–2023 period — a 51% real deflation that destroyed economics for
              weaker players but proved survivable for Flash given its capital from venture rounds. By April 2026,
              Flash, J&T, and KEX all announced a 3-baht-per-parcel temporary fuel surcharge — a co-ordinated
              acknowledgment that the floor has been reached and further erosion is no longer sustainable. Thailand Post
              elected not to impose the surcharge, retaining an edge for cost-sensitive rural shippers. The convergence
              of pricing across the top three private carriers shifts competitive differentiation toward service
              quality, pickup convenience, platform integration, speed, and brand trust rather than headline rate.
              Flash's 365-day operations and free door-to-door pickup (a standard it introduced that competitors
              subsequently adopted) are now table stakes rather than differentiators. Distribution power is the key
              switching variable: e-commerce sellers on Shopee/TikTok are largely directed toward SPX/J&T; sellers on
              Lazada toward Lazada Logistics or Flash (the Lazada preferred partner). Multi-homing is common — large
              merchants use two or three carriers simultaneously — but platform-generated orders leave sellers with
              minimal choice. For off-platform direct-to-consumer merchants, switching costs are low given comparable
              pricing and widespread parcel-drop-off networks; Flash's 10,000+ branches and technology integrations
              (API, tracking, Flash Fulfillment) create moderate stickiness. The Bangkok Post noted that the three-baht
              surcharge — roughly 1% of the 200–300 baht average order value — is likely to be passed on to consumers
              and could decelerate e-commerce growth to below 7% in 2026, further moderating volume growth that all
              carriers depend on.
