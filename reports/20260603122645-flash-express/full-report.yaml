      - number: '6.4'
        title: Satisfaction, Retention, and Durability
        blocks:
          - type: paragraph
            body: >
              Flash Express discloses no NRR, GRR, cohort churn, or formal merchant satisfaction scores. The company
              operates in a transactional parcel model where repeat usage is structurally driven by platform API
              stickiness rather than explicit loyalty programs. Independent consumer and merchant reviews on community
              forums (ASEAN Now) and Trustpilot reveal a persistent pattern of service complaints: delivery delays from
              Bangkok to provincial cities of 3–10 days beyond promised timelines, drivers ringing for as few as 10
              seconds before marking deliveries as missed, rude handling of parcels, and Thai-language-only customer
              support. A Flash Express retrospective disclosed internally that customer quality complaints (delivery
              times and damages) increased by 5% in a recent operating period. The company's own SWOT analysis
              identifies "QUALITY: Service consistency and reliability issues cited in reviews" as a documented
              weakness. Rider churn in metropolitan areas remains above 15% annually, identified as a leading indicator
              of delivery performance. Against these headwinds, structural retention is sustained by platform API
              lock-in: merchants who ship via Shopee or TikTok dashboards have no immediate incentive to switch to a
              different carrier, even if service quality is suboptimal, because the carrier choice is embedded in
              platform seller tools. General logistics-sector benchmarks suggest annual merchant churn of approximately
              40% for price-driven transactional courier relationships, but no Flash-specific data exists to validate or
              refute this benchmark for the company's actual SME cohort.
            claimRefs:
              - CU022
              - CU023
              - CU024
              - CU025
              - CU036
              - CU038
              - CU039
