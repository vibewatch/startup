      - number: '6.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Three-Platform SSL Status Creates Structural Volume Lock-In
            body: >
              Flash Express's simultaneous official integration as Shopee SSL carrier, TikTok Shop Regional Logistics
              Partner, and Lazada Certified Warehouse means that the approximately 3 million Thai e-commerce merchants
              on these platforms encounter Flash Express as a default or preferred carrier option embedded in their
              seller dashboards. This structural position is difficult for a pure-price competitor to displace without a
              platform policy change, providing durable volume as long as the partnerships hold.
            calloutType: strength
            claimRefs:
              - CU009
              - CU013
              - CU016
          - type: callout
            title: Platform Concentration Is the Primary Customer Risk
            body: >
              Shopee, TikTok Shop, and Lazada together account for 98.8% of Southeast Asia's e-commerce GMV. Flash
              Express derives a structurally undisclosed but likely dominant share of its parcel volume through these
              three platforms. Both Shopee (via Shopee Xpress) and Lazada (via Lazada Logistics) are building in-house
              logistics capabilities that could displace Flash Express without prior notice. J&T Express has already
              demonstrated that TikTok parcel volume can shift to a competitor. The absence of any minimum-volume
              commitments or exclusivity clauses in publicly disclosed partnership terms amplifies this risk.
            calloutType: risk
            claimRefs:
              - CU016
              - CU020
              - CU021
          - type: callout
            title: Service Quality Complaints Signal Merchant Churn Exposure
            body: >
              Community forum reviews and Trustpilot summaries document persistent delivery delays, missed delivery
              calls, rude handling, and Thai-language-only support. Customer complaints ticked up 5% in a recent
              operating period, and rider churn above 15% in metro areas is identified internally as a leading indicator
              of poor delivery performance. In a competitive market where J&T Express and Kerry Express offer comparable
              pricing, sustained service quality gaps create material risk that SME merchants will migrate to
              competitors as platform SSL lists allow multi-carrier optionality.
            calloutType: risk
            claimRefs:
              - CU022
              - CU023
              - CU038
              - CU039
          - type: callout
            title: Pre-Investment Diligence Requires Merchant Churn and Platform Revenue Data
            body: >
              Flash Express discloses no NRR, GRR, registered merchant count, or revenue split by platform channel.
              These four data points are prerequisite for forming conviction on customer durability. Investors should
              request cohort-level merchant data stratified by platform-integrated vs. direct COD senders, flash
              fulfillment WMS clients, and cross-border accounts. Platform revenue concentration should be stress-tested
              against a scenario in which one major platform (e.g., Shopee) builds out Shopee Xpress and reduces Flash
              Express SSL allocation by 30–50%.
            calloutType: recommendation
            claimRefs:
              - CU024
              - CU025
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk Overview and Severity Framework
        blocks:
          - type: paragraph
            body: >
              Flash Express's risk profile is unusually concentrated: the company's revenue is nearly entirely dependent
              on three e-commerce platforms—Shopee, Lazada, and TikTok Shop—that together control 98.8% of Southeast
              Asia's e-commerce GMV and are actively building proprietary logistics capabilities that directly compete
              with independent couriers. The January 2026 exit from Malaysia, where Flash Express was forced to wind
              down operations and make over 10,000 employees redundant, provides the clearest available evidence of what
              platform self-preferencing looks like in practice: exclusive deals and algorithmic volume routing starve
              third-party couriers until the unit economics collapse. In Thailand, three near-simultaneous regulatory
              developments in 2025–2026 both increase compliance costs and, paradoxically, create partial mitigation.
              The TCCT enacted guidelines in March 2026 barring platforms from forcing sellers to use a single logistics
              provider, the PDPA enforcement regime imposed THB 21.5 million in fines in August 2025, and a draft
              Independent Workers Protection Act—if enacted—could reclassify Flash Express's entire gig-rider workforce
              as employees with social security and wage entitlements. The risk heatmap below synthesizes seven risk
              clusters by likelihood and impact; the mitigation and kill criteria table defines the thesis-break
              thresholds that should trigger investor re-evaluation.
