  - id: FM001
    title: Thailand CEP Market Sizing Pyramid
    type: pyramid
    layout: standard
    summary: >-
      Thailand's CEP market sits within a far larger logistics economy; Flash Express's revenue footprint represents a
      meaningful slice of the e-commerce-driven CEP sub-market.
    data:
      nodes:
        - label: 'Broad Thailand logistics market: $36.9B (2025)'
          detail: >-
            IMARC Group estimate including road freight, warehousing, customs brokerage, and CEP; this figure is not
            directly comparable to CEP-only sizing and should not be used as the relevant market for Flash Express
            analysis.
          tone: neutral
        - label: 'Thailand CEP consensus: $2.84–2.86B (2025)'
          detail: >-
            Mordor Intelligence and GII Research cross-validated range covering courier, express, and parcel services
            only; domestic and international combined. Research and Markets corroborates ~$2.9B.
          tone: positive
        - label: 'E-commerce-driven CEP sub-market: ~$1.02B (35.71% of CEP)'
          detail: >-
            Mordor segment breakdown assigns 35.71% of CEP revenue to e-commerce parcels — the fastest-growing and most
            competitively contested sub-segment; derived by applying 35.71% to $2.86B consensus.
          tone: positive
        - label: 'Flash Express implied revenue: ~$687M est. (2024)'
          detail: >-
            24,728M THB ÷ 36 THB/USD; represents approximately 24% of the 2025 CEP consensus market, consistent with the
            estimated 20–25% parcel volume share cited by industry analysts.
          tone: positive
    approximationNotes: >-
      Flash Express revenue is converted from THB using an assumed rate of 36 THB/USD as of mid-2025. The e-commerce
      sub-market figure is derived by applying Mordor's 35.71% share to the $2.86B consensus; both inputs carry
      estimation uncertainty. The pyramid is a lens stack, not a strict SAM cascade.
