      - number: '1.5'
        title: Regional Footprint and Adverse Events
        blocks:
          - type: paragraph
            body: >
              Flash Group pursued Southeast Asian expansion as a core strategic pillar from the outset. By 2021, it had
              launched operations in Malaysia and the Philippines and established Flash Fulfillment warehousing in Laos,
              Vietnam, Singapore, and Indonesia. The fulfillment network, covering six countries and 130,000+ square
              meters, integrates with major e-commerce platforms including Shopee, TikTok Shop, Lazada, and Tokopedia,
              providing certified warehouse partnerships and same-day/next-day delivery support.

              However, Flash's regional ambitions encountered structural headwinds from platform self-preferencing—a
              practice where dominant e-commerce platforms algorithmically favor their in-house or affiliated logistics
              services, limiting the parcel volumes available to independent couriers. On January 31, 2026, Flash Group
              formally ceased express delivery operations in Malaysia after more than three years, resulting in over
              10,000 employees being made redundant. The company attributed the exit to difficult market conditions,
              including intense price competition and a playing field skewed by exclusive tie-ups between platforms such
              as TikTok Shop and J&T Express. Industry analysts and media reporting characterized this as a structural
              failure caused by platform market power rather than Flash's operational shortcomings.

              After the Malaysia exit, Flash Express confirmed it would focus on Thailand (primary) and the Philippines,
              while maintaining fulfillment operations in Laos and Vietnam. The exit has intensified regulatory scrutiny
              in Thailand: the Trade Competition Commission Thailand (TCCT) is finalizing guidelines—expected in the
              Royal Gazette in Q1 2026—that would require online sellers to have greater freedom in selecting their
              logistics providers. Observers note that Flash's profitable domestic position in Thailand contrasts
              starkly with its Malaysian retreat, underscoring how market structure and regulatory environment, as much
              as operational capability, determine outcomes in platform-adjacent logistics.
            claimRefs:
