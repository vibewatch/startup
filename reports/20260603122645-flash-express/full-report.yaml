      - number: '1.3'
        title: Funding History and Capital Structure
        blocks:
          - type: paragraph
            body: >
              Flash Express is one of the most heavily funded logistics startups in Southeast Asian history, having
              raised approximately $997 million across six disclosed rounds. Its funding trajectory—Series A through
              Series F—tracks the company's rapid growth from startup to regional unicorn in under four years.

              The company's early rounds—Series A, B, and C (2018–2020)—included backing from Gaorong Capital and Cloud
              Angel Fund, both China-based investors with deep logistics sector experience. These early rounds funded
              the buildout of Flash's initial 77-province coverage and technology stack. The Series D round in October
              2020, raising $200 million and led by PTT Oil and Retail Business (OR), brought the cumulative total to
              $400 million and introduced three of Thailand's largest conglomerates—OR, Durbell (TCP Group), and
              Krungsri Finnovate—as strategic partners. Their involvement opened access to fuel supply chains, TCP's
              distribution expertise, and financial services infrastructure.

              In mid-2021, Flash closed two additional rounds. The Series D+ was led by SCB 10X (the venture arm of Siam
              Commercial Bank) and Chanwanich Security Printing, while the Series E was led by Buer Capital (Singapore),
              with re-participation from SCB 10X, eWTP Capital, PTTOR, Durbell, and Krungsri Finnovate. Together, the D+
              and E raised an additional $150 million, pushing Flash's valuation above $1 billion and formally
              designating it Thailand's first unicorn. Cooley LLP, Flash's legal counsel, confirmed the total reached
              $150 million across D+ and E.

              In December 2022, Flash closed its largest round: a Series F of approximately $447 million that brought
              total capital raised to $997 million and established a post-money valuation of $2.1 billion. No Series G
              or subsequent equity round has been publicly announced as of the June 2026 run date. Flash Express has not
              filed for an initial public offering and remains a private company. Management previously indicated IPO
              ambitions after achieving regional leadership and profitability, but no SET listing is scheduled.
