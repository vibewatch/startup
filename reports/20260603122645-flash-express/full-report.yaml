  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              Flash Express's investment thesis rests on three pillars: Thailand's secular e-commerce growth (Thai CEP
              market ~$3.0B in 2026 and 7.1% CAGR through 2031), the company's structural position as the #2 parcel
              courier with 23% revenue growth in 2024, and its demonstrated pivot back to profitability after a brutal
              price war. The 2024 return to profit — THB 940M net income on THB 24,728M revenue — validated the
              company's cost-discipline thesis after losses in 2020, 2022, and 2023.

              The anti-thesis is equally compelling. J&T Express, now the undisputed #1 in Southeast Asia with 32.8%
              regional market share as of H1 2025 (up 5.4 pp year-on-year), cut its SEA cost per parcel by 14.9% in 2024
              and grew Thailand parcel volumes at hyper-speed. J&T's scale advantages make price-war attrition probable,
              compressing Flash's thin 3.8% net margin. The $2.1B private mark (December 2022 Series F) implies ~3.1×
              EV/Revenue on fiscal 2024 sales, a 2.5× premium to J&T's own public-market EV/Revenue of ~1.25×. Flash
              Express also exited Malaysia in late 2023/2024, limiting its regional growth narrative. Investors entering
              at the private mark face a structural overhang unless Flash achieves sustained margin expansion and
              confirms an exit pathway.
            claimRefs:
