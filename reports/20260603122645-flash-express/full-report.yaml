      - number: '7.7'
        title: Exhibits
        blocks:
          - type: callout
            title: Platform Concentration Is the Primary Kill-Criterion Risk
            body: >
              Flash Express's operating model is structurally dependent on three platforms that each have economic
              incentives to internalise logistics. The Malaysia exit—where 10,000+ jobs were lost in under four
              years—demonstrates that even unicorn-brand operators cannot survive sustained volume exclusion. Until
              Flash Express can quantify its platform revenue concentration and demonstrate contractually protected
              volume floors, this risk remains unmitigated and warrants a "high" residual severity classification.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR038
          - type: callout
            title: Monitor TCCT Enforcement as Key Swing Factor
            body: >
              The TCCT open-logistics mandate (effective March 25 2026) is the single largest external risk mitigant for
              Flash Express in Thailand. If enforced vigorously against platforms that force sellers to use proprietary
              logistics, Flash Express's position as the second-largest independent Thai courier becomes strategically
              durable. Investors should track TCCT enforcement actions, platform compliance disclosures, and merchant
              courier-choice survey data as leading indicators of whether this regulatory protection translates to
              volume protection. Weak enforcement would be a thesis-deterioration signal.
            calloutType: recommendation
            claimRefs:
              - CR006
              - CR007
              - CR032
              - CR039
          - type: callout
            title: Regulatory Cost Stack Is Approaching a Tipping Point
            body: >
              Three regulatory developments—PDPA active enforcement, draft gig-worker reclassification, and TCCT cartel
              scrutiny of the April 2026 fuel surcharge—are converging simultaneously. Individually, each is manageable.
              Together, they represent a regulatory cost stack that could add 10–20% to operating expenses if the labor
              law is enacted, a PDPA fine is issued, and the fuel surcharge is rolled back under TCCT pressure. Flash
              Express's return to profitability in 2024 was thin enough that this combination would be materially
              dilutive.
