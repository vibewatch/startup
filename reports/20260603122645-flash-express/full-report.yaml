      - number: '6.2'
        title: Platform Relationships and Named Customer Proof
        blocks:
          - type: paragraph
            body: >
              Flash Express holds official integration status with all three dominant Thai e-commerce platforms. As a
              Shopee Supported Logistics (SSL) partner, Flash Express is embedded in the Shopee seller dashboard;
              Shopee's own seller education hub (updated December 2025) confirms that Flash Express enables merchants to
              enjoy "fast, smooth, and reliable logistics services." Flash Fulfillment is simultaneously an official
              Shopee Certified Warehouse supporting Next-Day Delivery, Quick Delivery, and three fulfillment models
              (3PF, SIP, PFF), making the integration multilayered at both platform-carrier and warehouse level. Flash
              Express became TikTok Shop's Regional Logistics Partner in September 2022, providing door-to-door delivery
              for all TikTok Shop merchants in Thailand—365 days with free pickup from the first parcel. Flash
              Fulfillment additionally holds TikTok Certified Warehouse status and serves as the TikTok Cross-Border
              Returns Supplier and Overseas Asset Warehousing Provider. On Lazada, Flash Fulfillment manages the LGF
              (fully managed) and JIT (partially managed) fulfillment models for both local and cross-border 3PF stores.
              In Indonesia, Flash Fulfillment operates as certified warehouse and delivery partner for Tokopedia. The
              merchant management platform ZORT has published technical documentation confirming integration of Flash
              Express COD and shipping for its SME seller users, with no minimum order size and a 2.5% service fee.
              These platform partnerships are production deployments, not pilots; however, partnership terms allow
              unilateral termination by the platform and do not guarantee volume exclusivity. Shopee, TikTok Shop, and
              Lazada collectively account for 98.8% of Southeast Asia's e-commerce GMV.
            claimRefs:
