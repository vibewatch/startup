              At Flash Express's December 2022 private mark, EV/Revenue is approximately 3.1× versus J&T Express's
              public benchmark of 1.25×. Applying J&T's multiple to Flash Express's 2024 revenue yields a fair value of
              ~$840M — a 60% markdown from the private mark. Until Flash demonstrates 6%+ EBITDA margins or secures a
              confirmed public-market exit, investors face meaningful downside risk.
            calloutType: risk
