              requirements, prohibited and restricted goods, fresh-fruit rules, claim deadlines, liability caps,
              optional insurance tiers, and COD compliance language. Those controls matter because logistics quality
              failures often arise from ambiguous shipper obligations, weak packaging, or disputed compensation. The
              controls are less complete at the technology-assurance layer. Public sources reviewed here did not reveal
