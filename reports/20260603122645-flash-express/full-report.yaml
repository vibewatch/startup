      - number: '7.3'
        title: Operational, Service Quality, and Technology Risks
        blocks:
          - type: paragraph
            body: >
              Flash Express's aggressive growth model—built on gig-rider labour, wide franchise networks, and
              cost-driven pricing—has created persistent operational weaknesses that manifest in customer complaints and
              execution risk. Trustpilot reviews of flashexpress.co.th are predominantly negative: users document
              delayed deliveries, parcel mishandling, rude delivery personnel, failed delivery attempts without contact,
              and poor customer service response. Flash Express's own rider churn rate exceeds 15% annually in
              metropolitan areas, generating continuous recruitment, training, and quality-consistency costs. The
              aseannow.com community forum carried reports of a staff exodus and warehouse crisis, which Flash Express
              denied in 2023; independent user comments as of 2025 suggest the complaints have not fully resolved. COD
              fraud is an industry-wide operational risk that Flash Express is structurally exposed to: fake order
              placement, courier cash misappropriation, buyer refusal after delivery, and disputed delivery completion
              all create loss and working-capital drag. Flash Express's COD service charges merchants 2.5% and promises
              daily settlement to TTB accounts (3–5 days for other banks), but delays in dispute resolution can extend
              the effective cash cycle substantially beyond these timelines. An estimated COD float representing 10–15%
              of monthly revenue creates ongoing working-capital exposure. On the technology and data security front, no
              cybersecurity certifications, DPO appointment disclosure, or incident response documentation has been
              publicly reported by Flash Express as of June 2026. The PDPC's enforcement record shows fines specifically
              for absence of a DPO, inadequate security measures, and failure to report breaches—all gaps that may apply
              to logistics companies handling large consumer data volumes.
