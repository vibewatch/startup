  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation
        blocks:
          - type: paragraph
            body: >
              Flash Express's customer base divides into three primary payer segments. The dominant tier consists of SME
              e-commerce sellers—merchants operating on Shopee, Lazada, and TikTok Shop who pay shipping and COD fees on
              behalf of their consumer buyers. This group drives the bulk of the company's more than 1 million daily
              parcels, reflecting the Thai platform ecosystem's approximately 3 million sellers across the top three
              marketplaces. A second segment is individual C2C senders who use the Flash Express mobile app or one of
              the 12,000+ physical drop-off points to dispatch personal packages across all 77 Thai provinces. The third
              and most strategically valuable tier is enterprise and brand merchants who use Flash Fulfillment's
              automated warehouse management system, unlocking same-day and next-day delivery with AGV-robot sortation
              across 50,000 sqm of Thailand warehouse space. Flash Express's free pick-up from the first parcel,
              no-minimum policy is the primary SME acquisition mechanism, deliberately lowering the entry barrier for
              home-based sellers and micro-businesses who previously relied on costlier or less convenient couriers.
              Geography skews heavily toward Bangkok, which generates approximately half of national parcel volume,
              while provincial coverage is maintained through a franchised last-mile agent network. The 2025 Thai
              e-commerce GMV surge of 51.8% to $35.5 billion provides structural demand tailwind across all three
              customer segments.
            claimRefs:
              - CU001
              - CU003
              - CU008
              - CU014
              - CU017
              - CU032
