  - id: FM004
    title: Thailand CEP Parcel Demand Flow
    type: flow
    layout: wide
    summary: >-
      Parcel demand originates from e-commerce platform transactions and flows through merchant fulfilment and carrier
      pickup to linehaul sorting and last-mile delivery — with platform in-housing intercepting volume at the
      carrier-selection stage.
    data:
      nodes:
        - id: n1
          label: Consumer purchase on e-commerce platform
          detail: >-
            Shopee, Lazada, TikTok Shop and social-commerce channels initiate the vast majority of Thai CEP volume;
            $35.5B GMV in 2025 (+51.8% YoY) represents the upstream demand pool.
          tone: positive
        - id: n2
          label: Platform merchant fulfillment trigger
          detail: >-
            Order confirmation triggers pick-pack-ship from the merchant; platform logistics partnerships (SPX, LEX) or
            independent carriers (Flash Express) are selected at this stage — the point where in-housing risk
            materialises.
          tone: neutral
        - id: n3
          label: Carrier pickup and first-mile scan
          detail: >-
            Flash Express or competing carrier collects from the merchant; first-mile scan initiates tracking. Platform
            in-house networks (SPX, LEX) intercept volume before this handoff.
          tone: neutral
        - id: n4
          label: Linehaul sorting and hub network
          detail: >-
            Parcels move through regional sorting hubs; Flash Express operates a dense hub network confirmed by
            Geo.sig.ai data, with extensive collection-point coverage across Thailand.
          tone: positive
        - id: n5
          label: Last-mile delivery attempt
          detail: >-
            Final delivery to consumer; rural last-mile is the highest-cost node, particularly in northern and
            northeastern Thailand where population density and road infrastructure make per-parcel economics
            challenging.
          tone: warning
        - id: n6
          label: Successful delivery or return-to-sender
          detail: >-
            Completed delivery closes the cycle; failed deliveries generate return-to-sender flows adding cost and
            operational complexity at scale on a 7–8M daily-parcel base.
          tone: neutral
      edges:
        - from: n1
          to: n2
        - from: n2
          to: n3
        - from: n3
          to: n4
        - from: n4
          to: n5
        - from: n5
          to: n6
    claimRefs:
      - CM013
      - CM020
      - CM031
      - CM032
      - CM041
