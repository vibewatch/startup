      - number: '2.5'
        title: Market growth drivers
        blocks:
          - type: paragraph
            body: >-
              The dominant demand driver for Thailand's CEP market is the extraordinary growth of e-commerce GMV.
              Momentum Works data — corroborated by Bangkok Post — shows Thai e-commerce GMV reaching $35.5 billion in
              2025, a 51.8% year-on-year increase that is among the fastest in Southeast Asia. TikTok Shop's expansion
              has been particularly catalytic: the platform's live-commerce format drives impulse purchases requiring
              rapid, cost-competitive fulfilment, directly adding CEP volume at the platform-merchant interface. Daily
              parcel volumes in Thailand averaged 7–8 million shipments in 2024, with peak days reaching 10–12 million —
              underscoring the scale of demand Flash Express services.

              Secondary drivers include healthcare and pharmaceutical e-commerce growth on the back of Thailand's aging
              population and pharmacy digitisation — projected at 8.48% CAGR by Mordor, the fastest sub-segment. Rising
              per-capita income and mobile internet penetration in secondary cities extend the consumer base and
              stimulate first-time online purchasing, expanding the geographic reach of CEP demand beyond Bangkok. C2C
              social-commerce via Facebook Marketplace and LINE is also emerging as a meaningful and growing parcel
              source beyond traditional retail channels.

              Flash Fulfillment's 130,000+ square metre cross-border infrastructure positions Flash Express to capture
              the international component of e-commerce growth — particularly merchants who need both domestic Thai
              delivery and ASEAN export capability from a single provider. Nexdigm identifies CEP infrastructure
              investment as a structural enabler of Thailand's regional economic connectivity, suggesting demand growth
              extends beyond cyclical e-commerce tides. The 7.1% CAGR consensus forecast through 2030 implies durable,
              compounding demand rather than a one-year demand spike.
