      - number: '8.6'
        title: Recommendation and Confidence
        blocks:
          - type: paragraph
            body: >-
              The overall recommendation for Flash Express is research-more at the current $2.1B private mark.
              Confidence in the recommendation is medium: the 2024 profitability turn is real and supported by DBD-filed
              financials, but the structural overhang — a mark 2.5× above J&T's public EV/Revenue benchmark — cannot be
              justified without evidence of superior margin expansion, secured exit pathway, or confirmed institutional
              demand at higher multiples. Risk rating is high, driven by competitive squeeze from J&T's rapid SEA
              cost-curve descent, the undisclosed preference overhang from Series F, and Thailand-centric concentration
              post-Malaysia exit.

              The valuation stance is stretched. A fair entry would require either (a) a price reset to the $800M–$1.2B
              range (base-case range), or (b) clear evidence of a confirmed IPO at a market-clearing multiple above
              $1.5B. Neither condition is currently met. Thesis-break triggers include: J&T capturing more than 35% Thai
              market share, Flash returning to net losses for two consecutive quarters, or a failed IPO attempt. The
              most actionable path for current investors is to request a special-purpose data room covering cap table,
              Series F preference terms, 2025 financials, and IPO/M&A mandate.
