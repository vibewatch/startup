      - number: '8.2'
        title: Financing and Valuation Context
        blocks:
          - type: paragraph
            body: >-
              Flash Express raised approximately $781M–$997M across multiple rounds (sources vary; Failory and PitchBook
              differ on classification of co-investor bridge tranches). The Series F in December 2022 — $447M, the
              largest single private venture round in Thai startup history — set the current post-money valuation at
              approximately $2.1B (~THB 70B). Major Series F investors included Pavilion Capital, Jeneration Capital,
              SCB 10X, and Alibaba-aligned funds. The Series E in June 2021 ($150M combined D+/E tranche from Buer
              Capital, SCB 10X, eWTP, OR Group, Durbell/TCP, and Krungsri Finnovate) lifted the valuation above $1B,
              making Flash Express Thailand's first unicorn.

              As of June 2026, the $2.1B mark is approximately 3.5 years stale. No new funding round has been announced,
              no SET or HKEX IPO filing appears in official upcoming-IPO registries, and secondary-market platforms
              offer limited public pricing. The cap table, preference-stack structure for Series F preferred
              shareholders, and liquidation waterfall remain undisclosed. Entry discipline at the private mark is
              therefore difficult to validate: at $670M in 2024 revenue, the implied multiple is 3.1× EV/Revenue — a
              level that has historically been reserved for SaaS or high-margin technology businesses rather than
              asset-intensive logistics operators in emerging markets.
