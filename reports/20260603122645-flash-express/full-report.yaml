            title: J&T Express's SEA Expansion Is the Single Largest Threat
            body: >-
              J&T Express's adjusted EBITDA in Southeast Asia grew 50.5% to $310M in H1 2025, with market share reaching
              32.8% (+5.4 pp year-on-year). Its Thailand cost per parcel is falling rapidly. Flash Express, competing in
              the same market, risks margin compression and volume attrition unless it can differentiate on service
              quality or win large non-platform enterprise accounts.
            calloutType: risk
            claimRefs:
