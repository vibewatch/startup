  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: >-
              Thailand's CEP market hosts six meaningful competitor categories that Flash Express must simultaneously
              navigate. The direct private-courier tier is dominated by J&T Express (Thailand's fastest-growing operator
              with 25.4 billion baht revenue in 2024) and Kerry Express (KEX), which is undergoing deep restructuring
              after posting a 5.91 billion baht net loss in 2024. Thailand Post anchors the incumbent tier as overall
              parcel-volume leader, leveraging 138+ years of national network and government backing while avoiding the
              April 2026 fuel surcharges that Flash, J&T, and KEX all imposed. The platform-owned logistics tier —
              Shopee Xpress (SPX) and Lazada Logistics — has become structurally distinct: these arms serve captive
              platform GMV rather than open-market shippers, yet their parcel-allocation power over their seller
              communities directly constrains volume flowing to third-party operators including Flash. Research from
              Momentum Works shows that by 2024, J&T Express, SPX, and Lazada Logistics jointly handled 60% of all
              Southeast Asian parcel volume, accelerating legacy-player squeeze. Adjacent same-day competitors
              (GrabExpress, LINE MAN) address a different urgency segment and are not substitutes for standard next-day
              CEP. Finally, status-quo substitution — sellers self-fulfilling via motorbike-taxi or informal couriers —
              remains meaningful for hyper-local Bangkok commerce but is negligible at scale. Ken Research values the
              Thailand CEP market at approximately USD 2.8 billion at 2024 base, with domestic courier services
              accounting for roughly two-thirds of volume. The competitive environment has shifted from an era of
              growth-at-all-costs price wars (2018–2023) to a profitability-focused consolidation phase, with Flash and
              J&T the two principal survivors that turned profitable in 2024 while Kerry remains in loss territory.
