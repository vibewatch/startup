  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Customer workflow and product surface
        blocks:
          - type: paragraph
            body: >-
              Flash Express should be evaluated as a workflow bundle, not a single courier SKU. The visible sender
              journey begins with a parcel booking or pickup request, then moves through handoff, scan-based tracking,
              delivery, COD settlement where relevant, and post-delivery support such as claims, delivery-time changes,
              or COD refund requests. For occasional senders, the product surface is the website, branch network, app,
              tracking page, and service support. For merchants, the same surface becomes an operating console: pickup
              booking, label printing, shipment statistics, COD, customer-service chat, and exception handling. The
              fulfillment workflow is deeper: inbound goods enter warehouse storage, are inspected, managed in
              inventory, picked, packed, labeled, handed to Flash Express or marketplace logistics, and routed through
              returns or cross-border flows. Public evidence supports this integrated workflow, but the exact commercial
              API scope and service-level terms remain less transparent than the consumer workflow.
