      - number: '7.6'
        title: Execution and People Risks
        blocks:
          - type: paragraph
            body: >
              Flash Express's delivery network is built on approximately 20,000+ gig delivery riders across Thailand
              whose reclassification as employees under the draft Independent Workers Protection Act would structurally
              increase labor costs. Thailand's National Human Rights Commission has already ruled that platform delivery
              riders should be classified as employees under the Labour Protection Act—a position that, while not
              legally binding, signals the direction of regulatory travel. In Singapore, the Platform Workers Act
              (effective September 2024) already mandates CPF contributions for gig workers in an analogous market. If
              Thailand follows suit, Flash Express's unit economics would face a step-change cost increase that it
              cannot easily pass on in a competitive market where platform-operated delivery already sits at 15
              baht/parcel. Rider churn above 15% creates continuous onboarding cost, service-quality inconsistency, and
              coverage gaps in provincial areas where the franchise model depends on individual agent reliability.
              Management execution risk includes post-Malaysia-exit strategic recalibration: CEO Komsan Lee confirmed a
              pivot toward "internal consolidation" over expansion in mid-2025, but the Philippines operation carries
              similar platform and competitive risks to those that drove the Malaysia exit. The absence of any public
              capital raise since 2021 constrains the strategic options available if consolidation requires further
              investment.
