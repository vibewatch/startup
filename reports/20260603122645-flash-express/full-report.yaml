      - number: '8.5'
        title: Exit Readiness and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Flash Express does not appear in the SET's published upcoming-IPO registry as of June 2026. No HKEX
              prospectus filing has been disclosed. The company's most recent strategic communications focus on domestic
              profitability and TikTok partnerships rather than capital-market preparation. Secondary-market platforms
              allow accredited investors limited access to Flash Express shares, but without public pricing or volume
              disclosure. The earliest realistic IPO window, absent a re-acceleration of Thai public-market appetite for
              logistics, is likely 2027–2028 assuming sustained profitability and margin expansion.

              Strategic-acquisition interest from logistics conglomerates (Alibaba/Cainiao, JD Logistics, or Thai
              industrial groups) has not been confirmed publicly. Ninja Van's failure to IPO despite similar SEA
              positioning reinforces execution risk for private exits. Critical pre-commitment diligence asks: (1) full
              cap-table and Series F preference stack terms; (2) 2025 audited financial statements; (3) confirmed IPO
              timeline and underwriter engagement; (4) management accounts showing 2025 EBITDA margin trajectory; (5)
              J&T Express Thailand market-share data for 2025; and (6) clarification of digital-platform (TikTok,
              Shopee) contract terms and exclusivity.
