companyProfile:
  summary: >
    Flash Express is a Bangkok-based logistics platform founded in 2017 by Komsan Lee and Di Weijie. It scaled from a
    low-cost Thai parcel challenger into a broader e-commerce infrastructure group spanning express delivery, COD,
    fulfillment, bulky-goods logistics, and merchant tools. Publicly visible scale is real: the company became
    Thailand's first unicorn in 2021, raised nearly $1 billion through 2022, and returned to profitability in 2024 on
    THB 24.7 billion of revenue. The investment debate now turns on whether that domestic profitability can outweigh
    thin margins, stale private-market pricing, and the regional warning sign from the Malaysia exit.
