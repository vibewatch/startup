      - number: '7.2'
        title: Regulatory and Legal Risk Landscape
        blocks:
          - type: paragraph
            body: >
              Three distinct regulatory vectors converge on Flash Express in 2026, creating cumulative compliance cost
              and legal uncertainty. First, the PDPA enforcement pivot: Thailand's PDPC imposed eight administrative
              fines totalling THB 21.5 million across five cases announced on 1 August 2025, and recorded 2,672
              PDPA-related complaints by January 2026. Logistics companies are specifically flagged under heightened
              sectoral scrutiny. Flash Express processes personal data for millions of consumers—names, addresses, phone
              numbers, COD payment records—across 12,000+ drop-off points, creating material exposure if security
              measures are inadequate or breach notification is delayed. A single data breach incident at a technology
              retailer attracted a THB 7 million fine in 2025; analogous exposure for a company of Flash Express's scale
              and data volume could be materially higher. Second, the TCCT open-logistics mandate: the Trade Competition
              Commission's guidelines, effective March 25 2026 and published in the Royal Gazette on March 24, bar
              platforms from forcing sellers to use a designated courier and expose violators to criminal penalties of
              up to 10% of annual revenue and up to two years imprisonment under Sections 50 and 54 of the Trade
              Competition Act 2017. This regulation is a structural tailwind for Flash Express in Thailand, but its
              enforcement effectiveness depends on the TCCT's willingness to pursue dominant platforms—and the TCCT
              simultaneously scrutinises Flash Express and its peers for the synchronized April 2026 3-baht fuel
              surcharge, which may constitute price-fixing. Third, Thailand's draft Independent Workers Protection Act
              extends formal labour protections—including right to organize, welfare benefits, and dispute mediation—to
              "semi-independent workers" including logistics delivery riders. If enacted and enforced, reclassification
              of Flash Express's gig riders as employees would impose social security contributions, minimum wage
              obligations, and benefit costs that could materially alter unit economics. The ILO notes that over 52% of
              the Thai workforce is independent/gig as of 2021, making reclassification systemic across the sector
              rather than Flash-specific.
