      - number: '3.3'
        title: Platform-Owned Logistics and Substitute Threats
        blocks:
          - type: paragraph
            body: >-
              Shopee Xpress (SPX) and Lazada Logistics represent the most structurally significant threat to independent
              CEP operators — not through direct price competition for open-market shippers, but through their
              platform-level parcel allocation control. Shopee Thailand recorded revenues of 49.964 billion baht with a
              4.630 billion baht profit in 2024, while Lazada generated 28.291 billion baht in revenue with 836 million
              baht in profit. Together, the two platforms pulled in 78.255 billion baht combined revenue and 5.467
              billion baht combined profit in 2024 — outpacing any individual CEP operator. With Shopee holding roughly
              49% of Thai e-commerce GMV and Lazada approximately 30%, their proprietary logistics arms inherently
              capture a large share of parcel volume that third-party couriers would otherwise bid for. The critical
              structural difference between Southeast Asia and China is parcel-allocation power: in China, sellers
              choose their logistics provider; in Southeast Asia, platforms assign logistics partners. This creates a
              self-reinforcing cycle — lower volume means higher costs and poorer service, which leads to even lower
              volume — that disadvantages smaller and mid-tier operators and reinforces J&T, SPX, and Lazada Logistics
              dominance. The Momentum Works "Ecommerce in Southeast Asia 3.0" report found that J&T, SPX, and Lazada
              Logistics together accounted for 60% of all SEA parcel volume by 2024, and that J&T's average revenue per
              parcel declined by more than one-third over four years as platforms extracted pricing concessions. Flash
              Express's Lazada relationship provides partial insulation in that platform allocation channel, but Shopee
              — the larger platform — now partners primarily with SPX (its own arm) rather than Flash, creating a
              material volume-ceiling risk for Flash if Shopee and Lazada's combined GMV share grows. TikTok Shop,
              estimated at ~21% of Thai e-commerce GMV by Momentum Works (2024), is rapidly expanding and favours J&T,
              further tightening Flash's platform access. Adjacent substitutes such as GrabExpress and LINE MAN serve
              the same-day, hyper-local segment and are unlikely to displace next-day mass-market parcel operators.
