      - number: '4.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Operating Leverage Inflection Confirmed
            body: >
              Flash Express became the only major Thai courier to achieve a positive net income in FY2024, reaching THB
              940 million profit on THB 24.7 billion revenue. This confirms the business has crossed its fixed-cost
              operating leverage threshold. Every additional parcel now flows at higher incremental margin than the
              average, and the company's cost structure advantage over money-losing peers (J&T, KEX) creates a durable
              pricing cushion.
            calloutType: strength
            claimRefs:
              - CI017
              - CI018
              - CI019
          - type: callout
            title: IPO Profit Gap Is 5-7× Current Earnings
            body: >
              At the Series F valuation of THB 70 billion and Thailand's listed market P/E of ~15×, Flash Express would
              need ~THB 4.7 billion in annual profit to justify its current valuation at IPO—5× the FY2024 result. The
              CEO's stated 100 billion THB market cap target requires ~THB 6.7 billion in profit. This gap, combined
              with negative book equity of ~-THB 4.9 billion, means early-round investors cannot exit at valuation
              without sustained multi-year earnings growth. Malaysia exit confirms multi-market burn cannot continue at
              current profitability, constraining the near-term growth levers available to close this gap.
            calloutType: risk
            claimRefs:
              - CI031
              - CI032
              - CI033
              - CI034
          - type: callout
            title: Platform Ecosystem Dominance Caps Courier Pricing Power
            body: >
              E-commerce platforms (Shopee, TikTok/J&T, Lazada) are integrating logistics into closed ecosystems,
              directing parcel volume to preferred or in-house couriers and limiting access for independent carriers.
              Thai merchants already pay 22–30% of GMV in combined platform fees and logistics costs. As platforms
              tighten control, the addressable volume available to Flash Express could stagnate or decline, creating a
              structural revenue ceiling risk that operates independently of Flash's operational execution.
            calloutType: risk
            claimRefs:
              - CI026
              - CI037
              - CI038
          - type: callout
            title: Require Full Private Financials Before Underwriting
            body: >
              Flash Express's public filing data covers only the income statement (revenue and net profit). Gross
              margin, cash position, burn rate, debt obligations, segment P&Ls, capex budget, and Philippines P&L are
              all undisclosed. Any capital allocation or investment decision should be conditional on a full data room
              review including audited balance sheet, cash flow statement, segment disclosures, and capitalization
              table.
