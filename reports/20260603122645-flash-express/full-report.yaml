        title: Exhibits
        blocks:
          - type: callout
            title: Thailand's First Unicorn with Profitable Domestic Position
            body: >
              Flash Express achieved unicorn status within three years of launch and returned to profitability in
              2024—posting 940 million baht net profit on 24.7 billion baht revenue—after sustaining losses during the
              price war era. Its 27,000+ branch network covering all 77 Thai provinces, combined with proprietary
              in-house technology, gives it structural cost advantages and service density that are difficult to
              replicate.
            calloutType: strength
            claimRefs:
              - CO011
              - CO016
              - CO017
              - CO021
          - type: callout
            title: Platform Self-Preferencing Threatens Independent Carrier Viability
            body: >
              Flash Express's exit from Malaysia in January 2026 after 10,000+ redundancies illustrates the existential
              risk posed by dominant e-commerce platforms routing parcel volumes through in-house logistics (Lazada,
              Shopee) or exclusive partnerships (TikTok Shop x J&T Express). Thailand faces similar dynamics. Regulatory
              remedies from the TCCT are delayed, and platform power concentrating delivery demand may replicate the
              Malaysia outcome in Flash's core market.
            calloutType: risk
            claimRefs:
              - CO026
              - CO027
              - CO028
              - CO041
          - type: callout
            title: Governance Opacity and Key-Person Concentration
            body: >
              Flash Group's board composition, independent directors, and governance framework are not publicly
              disclosed. The company's trajectory is substantially dependent on the judgment of two co-founders. If
              either Komsan Lee or Di Weijie were to depart, the loss of Thai market knowledge and in-house technology
              ownership, respectively, would represent a material risk with no clear succession path disclosed.
            calloutType: risk
            claimRefs:
              - CO002
              - CO003
              - CO022
          - type: callout
            title: Netflix Visibility and Brand Narrative Amplification
            body: >
              GDH 559's seven-episode Netflix series "Mad Unicorn" (2025), based on Komsan Lee's entrepreneurial story,
              provides Flash Express with organic brand amplification and cultural legitimacy that few logistics
              operators achieve. This narrative capital differentiates Flash in SME merchant acquisition and employee
              recruitment.
            calloutType: insight
