      - number: '8.3'
        title: Comparable Valuation and Market Benchmarks
        blocks:
          - type: paragraph
            body: >-
              The most instructive public comparable is J&T Express (HKEX: 1519). J&T achieved $10.26B in revenue for FY
              2024 (+15.9% YoY), adjusted EBITDA of $780M (7.6% margin), and its first full-year net profit of ~$111M.
              Its enterprise value of ~$12.8B implies EV/Revenue of ~1.25× and EV/Adj.EBITDA of approximately 16× —
              multiples justified by a 15–20% revenue growth trajectory and SEA market leadership. Applying the 1.25×
              EV/Revenue benchmark to Flash Express's 2024 revenue of ~$670M yields a fair value of approximately $840M,
              a 60% discount to the $2.1B private mark.

              Kerry Express Thailand (SET: KEX) is a cautionary distressed comp: revenue of ~$256M in 2024, EBITDA
              negative, market cap only THB 1.82B (~$49M), and EV/Revenue ~0.36×. Kerry's implosion illustrates the
              floor scenario for Thai logistics companies unable to achieve sustainable margins. Private peers like
              Ninja Van (last marked at ~$2.4B in 2021) have also struggled to IPO despite scale, reinforcing that
              logistics unicorn marks from the 2021 peak may be structurally impaired. The sector EV/Revenue range of
              0.36×–1.25× gives a Flash Express fair-value range of ~$240M–$840M using 2024 revenues, underscoring the
              stretch in the current $2.1B mark.
