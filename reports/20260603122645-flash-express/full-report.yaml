  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Pricing Structure
        blocks:
          - type: paragraph
            body: >
              Flash Express generates revenue through a per-parcel delivery fee charged to senders, supplemented by
              ancillary services and value-added lines within the broader Flash Group. The core delivery rate begins at
              THB 22 per parcel for lightweight domestic standard shipments (1-3 day delivery), with pricing indexed to
              the greater of actual weight or volumetric weight. Remote-area surcharges add THB 50 per parcel to
              deliveries in difficult-access postal codes, and special tourist zones carry tiered surcharges from THB
              30–200 depending on parcel weight. Historically, Flash entered the market at an aggressive THB 25 per
              parcel—less than half the prevailing incumbent rate of THB 60—using penetration pricing to rapidly
              accumulate sender volume.


              By 2024, the implied average revenue per parcel was approximately THB 33–34, calculated by dividing the
              THB 24.73 billion annual revenue by roughly 730 million annual parcels (at 2 million parcels/day). This
              "natural blended rate" sits above the base list price because it includes heavier parcels, premium tiers,
              and ancillary fees. Cash-on-delivery (COD) is a key value-added service: Flash charges 2.5% of the
              collected amount with daily settlement, one of the lowest COD rates among Thai couriers. COD increases
              sender stickiness and provides a recurring fee stream on top of transport revenue.


              Beyond express parcel delivery, Flash Group operates complementary revenue lines: Flash Fulfillment
              provides third-party e-commerce warehousing across 130,000+ sqm in six countries (Thailand, Philippines,
              Malaysia, Singapore, Indonesia, Vietnam), with Thailand alone covering 50,000 sqm across five Bangkok-area
              facilities. Flash Logistics handles bulky-item delivery. Flash Money offers fintech-adjacent payment and
              financial services. These adjacencies diversify the revenue base but are not separately disclosed in
              public financial statements.
