      - number: '2.4'
        title: Flash Express market position and financials
        blocks:
          - type: paragraph
            body: >-
              Flash Express occupies the second-largest position in Thailand's CEP sector by volume, behind Thailand
              Post and ahead of J&T Express, Kerry Express, and DHL. Bangkok Post reporting and industry analyst
              consensus estimate Flash's parcel volume share at 20–25% of the national market. That position is
              corroborated by the company's own financial disclosures: 24,728 million THB in revenue for fiscal 2024 and
              940 million THB in net profit — making Flash Express the most profitable large-scale independent courier
              in Thailand by published figures. The revenue figure implies an approximate USD equivalent of $687 million
              at 36 THB/USD, consistent with a ~24% share of the $2.86 billion consensus market.

              Flash Express's exit from Malaysia in January 2026, reported by Bangkok Post, was presented as a strategic
              concentration of capital on the core Thai market. The decision is consistent with a broader regional
              consolidation pattern: the economics of holding a top-two position in Thailand are materially stronger
              than the economics of competing as a sub-scale entrant in Malaysia. Capital repatriated from the closure
              improves Flash's capacity to invest in automation, sorting infrastructure, and product development in its
              home market — a signal of tightening capital discipline that warrants positive interpretation from a
              financial risk standpoint.

              Flash Fulfillment, the group's warehousing arm, operates over 130,000 square metres of fulfillment space
              across six countries, with 50,000 square metres in Bangkok. Geo.sig.ai data confirms Flash Express
              maintains a dense network of sorting hubs and last-mile collection points across Thailand. This
              infrastructure anchors the cross-border component of Flash's CEP proposition and positions the group for
              end-to-end fulfilment solutions across ASEAN beyond pure parcel delivery.
