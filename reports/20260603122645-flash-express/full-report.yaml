      - number: '8.4'
        title: Scenario Analysis
        blocks:
          - type: paragraph
            body: >-
              The bull case requires Flash Express to accelerate revenue growth and expand EBITDA margins materially. If
              the company reaches ~$850M in revenue by 2027 (roughly 12% CAGR from 2024) and achieves a 6–8% EBITDA
              margin (comparable to J&T's trajectory), an IPO at 1.5–2.0× revenue would imply a $1.3–1.7B exit valuation
              — still below the 2022 private mark but closer to fair value. This scenario requires J&T's Thai expansion
              to be contained and TikTok/Shopee platform partners to remain sticky. Probability signal: moderate-low,
              given competitive dynamics and the historical evidence of margin compression during price wars.

              The base case holds Flash Express at a ~3–4% net margin on $800M 2027 revenue, producing a comparable fair
              value of $800M–$1.2B (1.0–1.5× revenue). Investors entering at $2.1B face an immediate mark-to-market loss
              of 40–60%. The bear case assumes J&T's relentless cost reduction and SEA expansion precipitate a renewed
              price war, stalling Flash's revenue or reversing the margin recovery. In this scenario, 0.5–0.7× revenue
              implies $400–$560M — consistent with Kerry Express's implosion trajectory. At any scenario, the company
              needs to raise revenue by approximately 100% from $670M (2024) to justify a 1× exit multiple at the $2.1B
              mark, requiring exceptional execution over 4–6 years.
