      - number: '2.6'
        title: Structural constraints and regulatory environment
        blocks:
          - type: paragraph
            body: >-
              Three structural constraints limit the upside of Thailand's otherwise attractive CEP growth story. The
              first is platform logistics in-housing: Shopee SPX and Lazada LEX networks have progressively taken back
              volume from independent couriers. Nation Thailand has reported that TikTok, Shopee, and Lazada use fee
              structures that squeeze independent courier margins, with per-parcel rates at 15–25 THB — below the
              estimated 30 THB breakeven for most operators. Flash Express, as the second-largest independent operator,
              retains scale advantages that smaller couriers lack but is not immune to structural volume displacement at
              the platform-merchant interface.

              The second constraint is regulatory: Thailand's National Broadcasting and Telecommunications Commission
              (NBTC/TCCT) issued new logistics service guidelines effective March 25, 2026. This represents the first
              structured attempt to govern digital logistics platforms and their fee and pricing conduct toward
              merchants and carriers. The full commercial impact on Flash Express's pricing architecture has not been
              publicly documented, making the TCCT guidelines both a governance milestone and an open evidence gap for
              forward analysis.

              The third constraint is labor regulation risk: the draft Independent Workers Protection Bill in Thailand
              would reclassify gig-economy couriers as employees rather than contractors. BGlobal Law and DLA Piper both
              identify this bill as directly applicable to delivery platform workers. With an estimated 60–70% of
              Flash's delivery workforce currently classified as independent contractors, reclassification could raise
              labor costs by approximately 30%. Combined with a 40–50% annual gig workforce turnover rate that already
              creates continuous recruitment and training costs, the financial exposure is material if the bill passes
              in its current form. DLA Piper notes that the legislative timeline remains uncertain but the regulatory
              direction is clear, and operators should plan for eventual reclassification.
