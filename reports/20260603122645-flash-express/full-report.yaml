      - number: '6.3'
        title: Adoption Trajectory and Volume Evidence
        blocks:
          - type: paragraph
            body: >
              Flash Express processed more than 1 million parcels per day as of 2024, establishing it as Thailand's
              second-largest courier by volume, behind only Thailand Post. Revenue of 24.7 billion baht in 2024
              represents 23% year-on-year growth, and the company returned to a 940 million baht net profit in 2025
              after two years of losses. The national Thai express parcel market handled 10–12 million parcels daily in
              2024, implying Flash Express holds approximately 8–12% of total daily throughput, though no official
              market-share figure is published. Thailand's e-commerce market surged 51.8% to $35.5 billion GMV in 2025,
              driven by TikTok Shop's shoppertainment model and live-commerce adoption, directly benefiting Flash
              Express through rising platform parcel volumes. TikTok Shop Thailand hosts 3 million sellers with daily
              GMV of $38 million as of mid-2025, representing the fastest-growing customer channel for Flash Express.
              Bangkok produces approximately half of national parcel volume, reflecting the geographic concentration of
              Flash Express's active customer base. The Flash Express COD product—2.5% fee, no minimum, 1–5 day
              settlement— serves as the primary merchant onboarding mechanism. The mobile application provides shipment
              scheduling, real-time tracking, live chat with staff, COD registration, and label printing, enabling fully
              self-service digital onboarding for the SME segment.
            claimRefs:
