  - id: TV005
    title: Thesis-Break and Kill Triggers
    columns:
      - Trigger
      - Threshold / Event
      - Transmission to Thesis
      - Action Implication
    rows:
      - - J&T captures dominant Thai market share
        - J&T reaches >35% Thailand parcel volume share (vs. ~28% SEA in 2024)
        - Signals Flash's price-floor vulnerability; margin recovery impossible under sustained volume pressure
        - Review exit options; accelerate IPO timeline or accept discounted strategic sale
      - - Flash returns to net losses
        - Two consecutive quarters of negative net income in 2025–2026
        - Contradicts 2024 profitability thesis; confirms margin fragility under competition
        - Downgrade to avoid; seek secondary exit at distressed price
      - - Failed or withdrawn IPO attempt
        - Filed prospectus withdrawn or IPO priced below $1.0B EV
        - Signals public market rejection of private mark; secondary valuations collapse
        - Exit via secondary market; negotiate negotiated tender at book value
      - - Platform contract loss
        - Shopee or TikTok terminates or significantly reduces logistics mandate to Flash
        - Removes ~30–50% of parcel volume anchor; revenue and utilisation decline materially
        - Material downgrade; requires evidence of non-platform volume replacement
      - - New equity raise below $1.5B valuation
        - Confirmed Series G or strategic secondary at post-money <$1.5B
        - Formal down-round; crystallises valuation impairment for Series F investors
        - Monitor liquidation preference protections; evaluate exit vs. follow-on
    notes: >-
      Triggers are observable market events; thresholds are analytical estimates. Monitoring requires access to
      management reporting not publicly available.
    claimRefs:
      - CV033
      - CV034
      - CV035
      - CV036
      - CV044
  - id: TV006
    title: Final Diligence Asks
    columns:
      - Topic
      - Missing Evidence
      - Why It Matters
      - Owner / Diligence Path
    rows:
      - - Cap table and preference stack
        - 'Series F preferred terms: liquidation preference, anti-dilution provisions, board seats, drag-along rights'
        - Determines effective downside protection and exit waterfall for common vs. preferred shareholders
        - Request from Flash Group CFO or legal counsel in data room
      - - 2025 audited financials
        - Full-year 2025 income statement, balance sheet, cash flow, and EBITDA reconciliation
        - Validates whether 2024 profitability is sustained and margins are improving toward 6%+ threshold
        - Request DBD filing or auditor-certified management accounts
      - - IPO / M&A mandate
        - Confirmed exchange, underwriter engagement, target timeline, and target valuation range
        - Critical for modelling exit timing and proceeds; without it, discount rate must assume 5+ year hold
        - Board-level disclosure or advisor engagement letter review
      - - J&T Express Thai market-share data 2025
        - Thailand-specific parcel volume share for Flash vs. J&T in 2025
        - Key competitive KPI; determines whether Flash is gaining or losing share domestically
        - Review industry reports or request via management interview
      - - Platform contract terms
        - 'TikTok Shop, Shopee, Lazada logistics mandate: volume, duration, exclusivity, pricing floors'
        - High e-commerce platform concentration; contract cliff risk poorly understood from public data
        - Request commercial agreements or redacted summaries in data room
      - - Debt and working capital
        - Total debt, revolving credit facilities, covenant compliance, and working capital cycle
        - Asset-intensive logistics operations can mask liquidity risk; capital structure affects exit mechanics
        - Review latest debt schedules and banking covenants via data room
    notes: >-
      Diligence asks represent standard private-equity information requirements. Access depends on investor status and
      Flash Group's disclosure policy.
