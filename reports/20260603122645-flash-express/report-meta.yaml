companyProfile:
  summary: >
    Flash Express is a Bangkok-based logistics platform founded in 2017 by Komsan Lee
    and Di Weijie. It scaled from a low-cost Thai parcel challenger into a broader
    e-commerce infrastructure group spanning express delivery, COD, fulfillment,
    bulky-goods logistics, and merchant tools. Publicly visible scale is real: the
    company became Thailand's first unicorn in 2021, raised nearly $1 billion through
    2022, and returned to profitability in 2024 on THB 24.7 billion of revenue.
    The investment debate now turns on whether that domestic profitability can outweigh
    thin margins, stale private-market pricing, and the regional warning sign from the
    Malaysia exit.
  foundedDate: "2017-09-01"
  founders:
    - name: "Komsan Lee"
      role: "Co-founder & CEO"
      background: >
        Thai-Chinese entrepreneur who built freight-forwarding and cross-border logistics
        businesses before launching Flash Express.
      claimRefs: [CO002]
    - name: "Di Weijie"
      role: "Co-founder & COO"
      background: >
        Former Alibaba operator who helped build Alipay Wallet and designed Flash's
        in-house logistics and management software stack.
      claimRefs: [CO003]
  foundingLocation: "Bangkok, Thailand"
  headquarters: "Bangkok, Thailand"
  productSummary: >
    Flash sells domestic parcel delivery with free pickup, COD settlement, fulfillment,
    bulky-item logistics, and related merchant services through an in-house technology
    stack and regional warehouse network.
  customerFocus: >
    Thai e-commerce merchants, SMEs, social-commerce sellers, and platform-linked parcel
    flows, with fulfillment support for larger marketplace and cross-border merchants.
  businessModel: >
    Revenue comes primarily from per-parcel delivery fees plus COD fees, fulfillment and
    warehousing services, and adjacent merchant logistics services.
  stage: "Late-stage private"
  fundingStatus: >
    Approximately $997M raised across six disclosed rounds, including a $447M Series F in
    December 2022 at a reported $2.1B post-money valuation; no newer priced round is publicly confirmed.
  disclosureProfile: private-disclosed
  claimRefs: [CO001, CO002, CO003, CO005, CO006, CO014, CO015, CO016, CO017, CO025, CO027]

summary:
  headline: >
    Flash Express is a real Thai logistics scale winner with verified 2024 profitability,
    but thin margins, opaque private-market terms, and a stale 2022 valuation anchor justify
    a research-more stance rather than fresh underwriting at the last mark.
