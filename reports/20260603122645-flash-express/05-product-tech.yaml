    - Official website exposes pickup, branch, tracking, COD, claims, and support surfaces
    - Dense operational workflow tied to Flash brand and branches
    - No public on-time-delivery SLA by lane
  - - Mobile sender app
    - Senders and merchants
    - Google Play and App Store list pickup, tracking, live chat, Radar, COD, labels, packing orders, and claims
    - Self-service workflow reduces branch dependence
    - Low iOS rating and limited public privacy detail
  - - Tracking / widget / APIs
    - Merchants, recipients, developers
    - Flash widget plus AfterShip and TrackingMore integration evidence
    - Third-party developer ecosystem can embed tracking quickly
    - Flash-owned API documentation and uptime are not public
  - - Flash Fulfillment warehouses
    - Marketplace sellers and brands
    - 130,000 sqm disclosed footprint across six countries; five Thailand warehouse types
    - Combines storage, WMS, marketplace programs, and Flash Express handoff
    - Facility-level KPIs and utilization are private
  - - AGV automated warehouse
    - High-volume e-commerce sellers
    - 16,000 sqm AGV warehouse; peak 20,000 orders per shift
    - Automation and Cainiao/Flash R&D support improve speed/error profile
    - Actual error rates and robot uptime are undisclosed
  - - COD, claims, insurance controls
    - Sellers and recipients
    - Terms describe COD obligations, claims, liability caps, and insurance tiers
    - COD workflow and claims are embedded in app/support
    - Claims ratio, payout cycle, and dispute data not disclosed
  notes: Matrix combines official, partner, developer, and third-party sources; maturity is evidence-based, not a performance
    audit.
