    - Flash Fulfillment supports local and cross-border business and returns supplier roles
    - Reduces need to build local operations
    - Customs workflow evidence is limited in public sources
  - - Recipient
    - Needs visibility and support when delivery changes
    - Tracking page/app status updates, delivery modification, support contact
    - More transparent status events and support paths
    - No public satisfaction or complaint-rate series
