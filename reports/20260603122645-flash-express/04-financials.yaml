company:
  name: Flash Express

chapter:
  number: 4
  title: Financials
  summary: >
    Flash Express posted revenue of THB 24.73 billion (+23% YoY) and its first meaningful net profit of THB 940 million
    in FY2024, filed with Thailand's Department of Business Development—a significant turnaround from five consecutive
    loss years. The recovery reflects operating leverage past a fixed-cost break-even rather than margin expansion per se,
    as the net margin of ~3.8% remains thin and the cumulative negative book equity of approximately -THB 4.9 billion
    continues to burden the balance sheet. Backed by ~$781 million in disclosed venture funding (Series F: $445 million,
    valuation $2.1 billion), the company faces a steep gap—needing 5-7× more annual profit—before a credible IPO at its
    current unicorn valuation. The Malaysia exit in January 2026 confirmed that multi-market cash burn is unsustainable
    at the current profit level, and platform e-commerce ecosystems are systematically compressing independent courier
    economics across Southeast Asia.

sections:
  - id: revenue-model-and-pricing
    title: Revenue Model and Pricing Structure
    body: >
      Flash Express generates revenue through a per-parcel delivery fee charged to senders, supplemented by ancillary
      services and value-added lines within the broader Flash Group. The core delivery rate begins at THB 22 per parcel
      for lightweight domestic standard shipments (1-3 day delivery), with pricing indexed to the greater of actual
      weight or volumetric weight. Remote-area surcharges add THB 50 per parcel to deliveries in difficult-access
      postal codes, and special tourist zones carry tiered surcharges from THB 30–200 depending on parcel weight.
      Historically, Flash entered the market at an aggressive THB 25 per parcel—less than half the prevailing incumbent
      rate of THB 60—using penetration pricing to rapidly accumulate sender volume.


      By 2024, the implied average revenue per parcel was approximately THB 33–34, calculated by dividing the THB 24.73
      billion annual revenue by roughly 730 million annual parcels (at 2 million parcels/day). This "natural blended
      rate" sits above the base list price because it includes heavier parcels, premium tiers, and ancillary fees.
      Cash-on-delivery (COD) is a key value-added service: Flash charges 2.5% of the collected amount with daily
      settlement, one of the lowest COD rates among Thai couriers. COD increases sender stickiness and provides a
      recurring fee stream on top of transport revenue.


      Beyond express parcel delivery, Flash Group operates complementary revenue lines: Flash Fulfillment provides
      third-party e-commerce warehousing across 130,000+ sqm in six countries (Thailand, Philippines, Malaysia,
      Singapore, Indonesia, Vietnam), with Thailand alone covering 50,000 sqm across five Bangkok-area facilities.
      Flash Logistics handles bulky-item delivery. Flash Money offers fintech-adjacent payment and financial services.
      These adjacencies diversify the revenue base but are not separately disclosed in public financial statements.
