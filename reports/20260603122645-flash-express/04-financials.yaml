  - id: historical-financials-and-profitability-turnaround
    title: Historical Financials and 2024 Profitability Turnaround
    body: >
      Flash Express filed its FY2024 financial statements with Thailand's Department of Business Development (DBD),
      showing total revenue of THB 24,728 million and net profit of THB 940 million—a 268% swing from the THB -559
      million loss in FY2023. Revenue grew 23.06% year-on-year (FY2023: THB 20,093 million). This marks only the
      second profitable year in the company's seven-year history; the first was FY2021 with a razor-thin profit of
      THB 5.6 million on revenue of THB 17,607 million. The cumulative P&L record from founding through 2024
      illustrates a classic "J-curve" burn trajectory: heavy losses in the scale-up years (FY2019: -THB 1.67 billion,
      FY2022: -THB 2.19 billion, the deepest), followed by loss narrowing and eventual profit in FY2024.


      Despite the profit turnaround, the company's balance sheet carries a negative book equity of approximately
      -THB 4.9 billion as of year-end FY2024—the consequence of cumulative retained losses exceeding paid-in capital.
      Total assets declined 1.23% in FY2024 while total equity improved 19.2% (per EMIS summary), confirming the
      profit is starting to repair the equity base, but recovery to positive book value will require multiple additional
      profitable years.


      The FY2022 revenue dip to THB 14.8 billion from THB 17.6 billion in FY2021 reflects a structural moment: the
      Thai CEP market normalized post-pandemic, several competitors collapsed or restructured, and Flash itself
      absorbed significant pricing-war losses. The rebound from THB 14.8 billion in FY2022 to THB 20.1 billion in
      FY2023 and THB 24.7 billion in FY2024 shows the company capturing consolidation share as weaker players
      exited. Flash Express surpassed Thailand Post's revenue (THB 20.9 billion in FY2023) to become the largest
      express delivery company by revenue in Thailand by FY2024.
    claimRefs:
