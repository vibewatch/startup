  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: gross-margin
      missingEvidence: >
        Gross profit margin, COGS breakdown, and segment-level profitability (express delivery vs. fulfillment
        vs. logistics vs. fintech) are not publicly disclosed.
      whyItMatters: >
        Without gross margin, it is impossible to assess whether the FY2024 net profit reflects genuine operating
        efficiency or is an artifact of one-time cost savings, and whether margin can sustain under pricing pressure.
      diligencePath: >
        Request audited management accounts including income statement by segment, COGS schedule, and gross profit
        reconciliation directly from Flash Express as part of data room disclosure.
      relatedQuestionRefs: [QI005, QI026]

    - type: private-evidence-only
      severity: blocking
      topic: capital-adequacy
      missingEvidence: >
        Cash on hand, monthly burn rate, debt facilities, credit lines, and convertible instruments are all
        undisclosed. The company's liquidity position as of FY2024 or Q1 2026 is unknown. IPO exchange,
        timeline, and pre-IPO structuring have not been formally announced.
      whyItMatters: >
        Negative book equity of ~-THB 4.9 billion combined with unknown cash position means capital adequacy
        cannot be assessed. The company may require near-term external financing if FY2025 profitability
        does not improve. Without an IPO timeline, investor exit horizons remain undefined.
      diligencePath: >
        Review full FY2024 balance sheet (cash and equivalents, payables, receivables) from DBD filing;
        request capitalization table and any outstanding debt instruments from management; monitor SET
        and Nasdaq filings for any IPO prospectus or roadshow registration.
      relatedQuestionRefs: [QI025, QI027, QI016]

    - type: private-evidence-only
      severity: material
      topic: Philippines-PNL
      missingEvidence: >
        Revenue, costs, and net profit/loss for Flash Express's Philippines operations are not disclosed.
        Post-Malaysia exit, Philippines viability is a critical strategic and financial question.
      whyItMatters: >
        If Philippines is also loss-making, Flash Group faces continued international cash drain; failure could
        deepen the earnings gap to IPO threshold and require another equity raise at a difficult time.
      diligencePath: >
        Request Philippines P&L and volume data from management; check if Flash Philippines files financials
        with the Philippine Securities and Exchange Commission (SEC).
      relatedQuestionRefs: [QI012, QI013]

    - type: missing-source
      severity: material
      topic: parcel-volume
      missingEvidence: >
        Confirmed daily parcel volume differs between official company data (1M+/day) and some analyst sources
        (up to 2M/day). The precise volume is critical for per-parcel unit economics calculations.
      whyItMatters: >
        Per-parcel revenue and cost metrics are key inputs to any operating leverage model; a 2× variance in
        volume creates a corresponding variance in per-parcel economics.
      diligencePath: >
        Request verified monthly parcel volume data from company logistics management system; triangulate with
        industry market size data from Mordor Intelligence and SHIPPOP.
      relatedQuestionRefs: [QI002, QI009]
      relatedTableRefs: [TI004]

    - type: stale
      severity: material
      topic: financial-gaps
      missingEvidence: >
        FY2025 financial statements have not been filed or publicly disclosed as of June 2026, leaving a
        one-year lag in verified financial data.
      whyItMatters: >
        FY2024 may not represent a sustainable trend; FY2025 data would confirm or refute whether operating
        leverage is building toward IPO-viable earnings or whether profit was a cyclical recovery.
