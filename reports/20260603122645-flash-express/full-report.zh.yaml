      - number: '1.4'
        title: 运营规模、技术与财务表现
        blocks:
          - type: paragraph
            body: >
              2018 年上线后，Flash Express 快速扩张。到 2020 年 10 月，运营仅两年，公司已从少于 10 名员工和极少配送基础设施，成长为泰国第二大私营承运商，每天通过 5,000
              多个服务网点配送超过 1 million 件包裹。到 2021 年中，单日峰值量达到 2 million 件。截至 2025 年，公司在泰国运营 27,000+ 个服务网点、15,000 辆配送车、23
              个分拣中心，自动化分拣能力为每小时 100,000 件包裹。

              技术是 Flash 的运营核心。所有软件——路线优化、HR 管理、包裹追踪和分拣算法——均完全自研，并按东南亚运营条件校准。公司在履约仓使用 AI 机器人，其 HR/OA
              软件系统消除了冗余招聘、考勤造假和加班滥用，使 HR 运营成本降低约 50 percent。一名经理借助这些工具可管理最多 200 名员工，从而在规模化时仍保持扁平汇报结构。

              财务表现一直波动，反映出激烈价格战和网络基础设施重资本投入。Flash Express 2020 年年收入为 9,738 million baht（净亏损 716 million baht），2021 年增至
              17,607 million baht（净利润 5.6 million baht）。价格竞争加剧后，2022 年收入收缩至 14,805 million baht，同时净亏损达到峰值 2,186 million
              baht。2023 年收入恢复至 20,093 million baht（净亏损 559 million baht），2024 年再次升至 24,728 million baht，净利润 940 million
              baht 创下公司有记录以来最强盈利。恢复盈利靠的是成本纪律、价格战强度下降，以及 TikTok Shop 和 shoppertainment 平台带来的更高电商包裹量。
