      - number: '2.2'
        title: 市场规模与分析师估计
        blocks:
          - type: paragraph
            body: >-
              Mordor Intelligence 和 GII Research 这两家分析机构，提供了内部最一致、方法上最可比的泰国 CEP 市场估计。Mordor 将 2025 年市场规模定为 $2.86
              billion，并预测到 2030 年 CAGR 为 7.16%，意味着 2030 年终值约 $4.04 billion。GII Research 几乎相同：2025 年 $2.82 billion，2026
              年升至 $3.02 billion，2031 年达到 $4.25 billion，CAGR 为 7.07%。Research and Markets 独立印证 2025 年约 $2.9 billion
              的区间。这三类来源之间差距很窄，为 2025 年 $2.84–2.86 billion 的共识视角提供了合理交叉验证。

              MarkWide Research 发布了两个实质冲突的估计，从两侧夹住共识。一个广义口径估计 2026 年达到 $4.8 billion（隐含 11.4% CAGR），而同年狭义口径估计仅为 $1.8
              billion（9.4% CAGR）。最可能的解释是范围差异：广义估计可能纳入相邻物流服务，狭义估计则采用严格的 express-only 定义。两者都不符合 Mordor/GII
              共识，因此应视为外部边界标记，而不是基准情景输入。

              以泰铢计，行业来源显示 2024 年泰国包裹市场总规模超过 100 billion THB；按约 7–8 million 件日均包裹和每件约 30–35 THB 客单价计算，这一数字一致。按 36 THB per
              USD 计算，美元市场规模约为 $2.8–3.0 billion——也与 Mordor/GII 共识一致。因此，泰铢交叉校验独立锚定了 $2.86 billion 基准情景，并降低了共识只是协调模型产物的可能性。
