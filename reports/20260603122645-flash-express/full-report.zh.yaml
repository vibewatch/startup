      - number: '1.5'
        title: 区域覆盖与反向事件
        blocks:
          - type: paragraph
            body: >
              从一开始，Flash Group 就把东南亚扩张作为核心战略支柱。到 2021 年，它已在马来西亚和菲律宾上线运营，并在老挝、越南、新加坡和印度尼西亚建立 Flash Fulfillment
              仓储。履约网络覆盖六个国家、面积 130,000+ square meters，与 Shopee、TikTok Shop、Lazada 和 Tokopedia
              等主要电商平台打通，提供认证仓储合作和当日/次日达支持。

              但 Flash 的区域雄心遭遇平台自我优待这一结构性阻力：主导电商平台通过算法偏向自营或关联物流服务，限制独立快递可获得的包裹量。2026 年 1 月 31 日，Flash Group
              在运营三年多后正式停止马来西亚快递业务，导致超过 10,000 名员工被裁。公司把退出归因于艰难市场环境，包括激烈价格竞争，以及 TikTok Shop 与 J&T Express
              等平台独家绑定造成的倾斜竞争场。行业分析师和媒体报道把这描述为平台市场力量导致的结构性失败，而不是 Flash 的运营短板。

              马来西亚退出后，Flash Express 确认将聚焦泰国（主市场）和菲律宾，同时保留老挝和越南的履约业务。退出也加剧了泰国监管审视：Trade Competition Commission
              Thailand（TCCT）正在敲定指南，预计 2026 年 Q1 刊登于 Royal Gazette，要求线上卖家在选择物流服务商时拥有更大自由度。观察者指出，Flash
              在泰国的盈利性本土地位与马来西亚撤退形成鲜明对比，凸显在平台相邻物流中，市场结构和监管环境与运营能力一样会决定结果。
