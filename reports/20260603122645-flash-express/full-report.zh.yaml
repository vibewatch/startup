  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与定价结构
        blocks:
          - type: paragraph
            body: >
              Flash Express 的收入来自向寄件人收取的单票配送费，并由 Flash Group 体系内的配套服务和增值业务补充。核心运价从每票 THB 22 起，适用于轻量国内标准件（1-3
              天送达），计价按实际重量和体积重量取高者。偏远地区邮编每票加收 THB 50，特殊旅游区按包裹重量分档加收 THB 30–200。Flash 早期以激进的 THB 25 单票价格切入市场，不到当时主流在位者
              THB 60 的一半，靠渗透定价快速堆起寄件量。


              到 2024 年，隐含单票平均收入约为 THB 33–34，计算口径是用 THB 24.73 billion 年收入除以约 730 million 年包裹量（按 2 million 票 /
              天）。这个「自然混合费率」高于基础标价，因为包含更重包裹、高级服务层和附加费用。货到付款（COD）是关键增值服务：Flash 按代收金额收取 2.5%，并提供每日结算，是泰国快递商中最低的 COD
              费率之一。COD 提高寄件人粘性，也在运输收入之上带来经常性费用流。


              除快递包裹外，Flash Group 还运营互补收入线：Flash Fulfillment 在六个国家（泰国、菲律宾、马来西亚、新加坡、印度尼西亚、越南）提供第三方电商仓储，总面积超过 130,000
              sqm，仅泰国就在曼谷周边五个设施覆盖 50,000 sqm。Flash Logistics 处理大件配送。Flash Money
              提供接近金融科技的支付和金融服务。这些邻近业务分散了收入来源，但公开财务报表没有单独披露。
