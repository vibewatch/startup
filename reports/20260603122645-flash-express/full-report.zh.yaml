chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份与业务概览
        blocks:
          - type: paragraph
            body: >
              Flash Express (Thailand) Company Limited 注册于泰国曼谷，是 Flash Group 这家私有综合电商物流集团的旗舰配送服务。公司于 2017 年 9 月依法成立，2018
              年开始运营。在「In mind, In delivery」理念下，Flash Express 提供全年 365
              天的门到门包裹揽收和配送，不设最低包裹量。它是泰国第一家从第一件起就免费上门揽收的快递公司，区别于要求客户把包裹送到服务网点的既有承运商。

              Flash Group 的产品组合已经远超核心快递服务。Flash Fulfillment (FFM) 在六个东南亚国家运营仓储和履约中心，总面积超过 130,000 square meters，其中包括一座
              16,000 square meters 的自动化 AGV 机器人设施，为东南亚同类最大。Flash Logistics 处理笨重和大尺寸物品。Flash Bulky 在全国配送重量最高 100
              kilograms 的物品。2021 年，Flash 与 Thailand Post、JWD InfoLogistics 成立合资公司，以「Fuze Post」品牌提供冷链快递。公司还通过 Flash Money
              提供金融服务，并为中小企业卖家提供数字商户工具。

              2024 年泰国快递包裹市场价值约 115 billion baht，在电商扩张推动下同比增长 12–18 percent。截至 2026 年初，Thailand Post 是市场第一，Flash Express
              排名第二，其后是 J&T Express、Lazada Express 和 SPX Express。Flash 推出 25-baht 配送费时打破了市场定价，迫使既有玩家应对一个平均运费随后从 39 baht
              压缩到每件低于 20 baht 的市场。
