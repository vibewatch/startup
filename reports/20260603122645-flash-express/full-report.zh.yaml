      - number: '7.2'
        title: 监管与法律风险格局
        blocks:
          - type: paragraph
            body: >
              2026 年，三条不同监管向量汇聚到 Flash Express 身上，叠加出合规成本和法律不确定性。第一是 PDPA 执法转向：泰国 PDPC 在 2025 年 8 月 1
              日宣布的五个案件中开出八项行政罚款，总计 THB 21.5 million，并到 2026 年 1 月记录 2,672 起 PDPA 相关投诉。物流公司被明确列入更高行业审查。Flash Express
              为数百万消费者处理个人数据——姓名、地址、电话号码、COD 付款记录——并覆盖 12,000+ 个寄件点；若安全措施不足或漏洞通知延误，就会形成重大敞口。2025 年，一家技术零售商单次数据泄露被罚 THB 7
              million；对 Flash Express 这种规模和数据量的公司，类似敞口可能显著更高。第二是 TCCT 开放物流要求：Trade Competition Commission 指引于 2026 年 3 月
              25 日生效、3 月 24 日刊登 Royal Gazette，禁止平台强迫卖家使用指定快递商，并使违规者面临 Trade Competition Act 2017 第 50 和第 54 条下最高年收入 10%
              罚金和最高两年监禁的刑事处罚。这项监管对 Flash Express 在泰国是结构性顺风，但执法效果取决于 TCCT 是否愿意追击主导平台；与此同时，TCCT 也在审查 Flash Express 及同行
              2026 年 4 月同步加收 3-baht 燃油附加费的行为，该行为可能构成价格操纵。第三，泰国的 Independent Workers Protection Act
              草案把正式劳动保护——包括组织权、福利权益和争议调解——扩展到包括物流配送骑手在内的「半独立工作者」。如果草案通过并执行，Flash Express
              的零工骑手被重新归类为员工，将带来社保缴款、最低工资义务和福利成本，可能实质改变单位经济。ILO 指出，截至 2021 年泰国劳动力中超过 52% 属于独立 / 零工，这使重新归类成为全行业系统性问题，而非
              Flash 专属问题。
