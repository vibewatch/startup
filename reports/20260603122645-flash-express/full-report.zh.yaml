      - number: '6.4'
        title: 满意度、留存与耐久性
        blocks:
          - type: paragraph
            body: >
              Flash Express 不披露 NRR、GRR、队列流失或正式商家满意度分数。公司处在交易型包裹模式，重复使用主要由平台 API 粘性结构性驱动，而不是显性忠诚计划。ASEAN Now 社区论坛和
              Trustpilot 上的独立消费者与商家评论，显示服务投诉持续存在：从曼谷 到省会城市的配送比承诺时效延误 3–10 天、司机响铃短至 10 秒即标记未送达、粗暴处理包裹，以及仅提供泰语客服。Flash
              Express 一份内部回顾披露，最近一个运营期间客户质量投诉（配送时效和损坏）上升 5%。公司自己的 SWOT 分析把「QUALITY：评论提到服务一致性和可靠性问题」列为已记录弱点。都会区骑手年流失率仍高于
              15%，并被内部识别为配送表现的领先指标。面对这些逆风，结构性留存仍由平台 API 锁定效应支撑：通过 Shopee 或 TikTok
              后台发货的商家，即使服务质量不理想，也没有立刻切换承运商的动机，因为承运商选择嵌在平台卖家工具里。一般物流行业基准显示，价格驱动的交易型快递关系年商家流失率约 40%，但没有 Flash
              专属数据能验证或反驳这个基准是否适用于公司实际 SME 队列。
