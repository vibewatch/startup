      - number: '8.6'
        title: 建议与置信度
        blocks:
          - type: paragraph
            body: >-
              对 Flash Express 的总体建议是在当前 $2.1B 私募估值下继续研究。建议置信度为中：2024 年转盈真实存在，并有 DBD 申报财务支持；但结构性压力无法忽视——该估值比 J&T 公开
              EV/Revenue 基准高 2.5×，除非有证据证明 Flash 可以跑出更高利润率、锁定退出路径，或在更高倍数上获得机构需求。风险评级为高，主要来自 J&T 在 SEA
              成本曲线快速下行带来的竞争挤压、Series F 未披露优先权压力，以及退出马来西亚后对泰国的集中。

              估值立场是偏高。合理进入需要满足两种条件之一：(a) 价格重置到 $800M–$1.2B 区间（基准情景区间），或 (b) 有明确证据显示 IPO 已确认，且市场清算倍数对应 $1.5B
              以上估值。目前两者都不满足。投资逻辑破裂触发点包括：J&T 拿下超过 35% 的泰国市场份额、Flash 连续两个季度重回净亏损，或 IPO
              尝试失败。现有投资者最可执行的路径，是要求设立专项数据室，覆盖股权结构表、Series F 优先条款、2025 年财务和 IPO/M&A 授权。
