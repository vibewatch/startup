      - number: '4.2'
        title: 历史财务与 2024 年盈利拐点
        blocks:
          - type: paragraph
            body: >
              Flash Express 向泰国商业发展厅（DBD）提交了 FY2024 财务报表，显示总收入 THB 24,728 million，净利润 THB 940 million，相比 FY2023 的 THB
              -559 million 亏损实现 268% 摆动。收入同比增长 23.06%（FY2023：THB 20,093 million）。这是公司七年历史里第二次盈利；第一次是 FY2021，收入 THB
              17,607 million，利润仅 THB 5.6 million。从创立到 2024 年的累计损益记录呈现典型「J 曲线」烧钱轨迹：规模扩张期大额亏损（FY2019：-THB 1.67
              billion；FY2022：-THB 2.19 billion，为低点），随后亏损收窄，并在 FY2024 转为盈利。


              尽管盈利扭转，公司截至 FY2024 年末的账面权益仍约为 -THB 4.9 billion，原因是累计留存亏损超过实缴资本。FY2024 总资产下降 1.23%，总权益改善 19.2%（据 EMIS
              摘要），说明利润开始修复权益基础，但要恢复正账面价值还需要多个盈利年度。


              FY2022 收入从 FY2021 的 THB 17.6 billion 降至 THB 14.8 billion，反映了一个结构性时点：泰国 CEP 市场在疫情后正常化，多家竞争者倒闭或重组，Flash
              自身也消化了显著的价格战亏损。收入从 FY2022 的 THB 14.8 billion 反弹至 FY2023 的 THB 20.1 billion、FY2024 的 THB 24.7
              billion，说明弱势玩家退出后，公司拿到了整合份额。到 FY2024，Flash Express 收入超过 Thailand Post（FY2023 为 THB 20.9
              billion），成为泰国收入规模最大的快递公司。
