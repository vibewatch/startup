      - number: '7.6'
        title: 执行与人员风险
        blocks:
          - type: paragraph
            body: >
              Flash Express 的配送网络建立在泰国约 20,000+ 名零工配送骑手之上；若 Independent Workers Protection Act
              草案把他们重新归类为员工，劳动力成本会结构性上升。Thailand National Human Rights Commission 已经裁定，平台配送骑手应按 Labour Protection Act
              归类为员工；这一立场虽无法律约束力，却显示监管方向。在新加坡，Platform Workers Act（2024 年 9 月生效）已经在类似市场要求为零工工作者缴纳 CPF。若泰国跟进，Flash Express
              的单位经济将面对台阶式成本上升；在平台自营配送已低至 15 baht / 票的竞争市场里，公司很难把成本转嫁出去。骑手流失率高于
