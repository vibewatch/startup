  - id: FM003
    title: 泰国 CEP 买方细分评估矩阵
    type: matrix
    layout: wide
    summary: 中小平台商户和医疗健康是 Flash 增长最快的细分市场；C2C 社交电商贡献量但利润有限，B2B 企业客户则提供合同稳定性。
    data:
      columns:
        - 量占比
        - 价格敏感度
        - 增长前景
        - 平台物流风险
      rows:
        - label: 中小平台商户
          values:
            - label: 极高（~55%）
              tone: positive
              detail: 按包裹量计的最大细分；由 Shopee、Lazada、TikTok Shop 在 2025 年 GMV 同比增长 51.8% 驱动；直接受益于 Flash Express 的平台关系。
            - label: 极高
              tone: warning
              detail: 买方价格最敏感；只要切换成本低，每件省 1–2 THB 就会换承运商；低于 30 THB 盈亏平衡线的费率补贴很常见。
            - label: 强
              tone: positive
              detail: 电商 GMV 同比 +51.8%，直接拉动下游需求；相对区域同行，平台增长空间仍然显著。
            - label: 高
              tone: warning
              detail: Shopee SPX 与 Lazada LEX 的自营物流直接争夺中小平台商户包裹量；Nation Thailand 报道独立快递仍在被挤压。
        - label: 大型品牌零售商
          values:
            - label: 中（~15%）
              tone: neutral
              detail: 成熟品牌已签约物流服务；单个客户包裹量较低，但关系由 SLA 驱动，可预测性更强。
            - label: 中
              tone: neutral
              detail: 愿意为可靠性、品牌包装合规和专属客户管理付费；不太容易因费率变化而切换。
            - label: 温和
              tone: neutral
              detail: 零售现代化和全渠道策略支撑稳定的 CEP 需求；走势跟随泰国消费者支出增长。
            - label: 低
              tone: positive
              detail: 品牌通常偏好独立快递，而不是平台自有网络，以守住渠道中立性和 SLA 责任边界。
        - label: C2C 社交电商卖家
          values:
            - label: 中（~12%）
              tone: neutral
              detail: Facebook Marketplace 与 LINE 卖家带动包裹量增长；发货节奏不规律，但总量正在快速扩大。
            - label: 极高
              tone: warning
              detail: C2C 卖家属于最价格敏感的群体；1–2 THB 的费率差就能以极低摩擦触发切换。
            - label: 快速增长
              tone: positive
              detail: 二手商品和社交销售平台正在扩大泰国 C2C 包裹市场；费率有竞争力的承运商可以拿到增量。
            - label: 中
              tone: neutral
              detail: 相比平台商户，受平台自营物流影响较小；社交平台尚未大规模运营自有 CEP 网络。
        - label: 医疗健康与制药
          values:
            - label: 小（~8%）
              tone: neutral
              detail: 增长中的利基市场，需要温控和可记录的处理流程；绝对量较低，但利润贡献相对更高。
            - label: 低
              tone: positive
              detail: 客户优先考虑可靠性和全链路可追溯，而非价格；监管要求使质量成为首要选择标准。
            - label: 强
              tone: positive
              detail: 子分部 CAGR 为 8.48%，是泰国 CEP 中最快的细分；老龄化人口、药房电商应用和临床供应链共同驱动。
            - label: 极低
              tone: positive
              detail: 医疗健康物流需要认证和冷链基础设施，通用平台物流部门很难轻易内化。
        - label: B2B 企业客户
          values:
            - label: 小（~10%）
              tone: neutral
              detail: 企业和 FMCG 客户采用年度合同；包裹平均价值高；量基稳定，季节性可预测。
            - label: 低–中
              tone: positive
              detail: 多年合同结构缓和短期价格敏感度；切换成本高于 B2C 或 C2C 细分。
            - label: 稳定
              tone: neutral
              detail: 工业和 FMCG 物流需求跟随泰国 GDP 增长；上行有限，下行风险也有限。
            - label: 低
              tone: positive
              detail: B2B 合同偏向拥有专属客户管理和 SLA 报告能力的成熟承运商；平台物流部门缺少专属管理和 SLA 报告能力。
    claimRefs:
      - CM009
      - CM010
      - CM011
      - CM013
      - CM020
      - CM031
  - id: FM004
    title: 泰国 CEP 包裹需求流
    type: flow
    layout: wide
    summary: 包裹需求来自电商平台交易，经商户履约和承运商揽收，流向干线分拣和最后一公里配送；平台自营物流在承运商选择阶段截流包裹量。
    data:
      nodes:
        - id: n1
          label: 消费者在电商平台下单
          detail: Shopee、Lazada、TikTok Shop 和社交电商渠道发起泰国绝大多数 CEP 包裹量；2025 年 $35.5B GMV（同比 +51.8%）构成上游需求池。
          tone: positive
        - id: n2
          label: 平台商户履约触发
          detail: 订单确认后，商户启动拣货、打包、发货；平台在这一阶段选择平台物流合作方（SPX、LEX）或独立承运商（Flash Express）——自营化风险也在这里落地。
          tone: neutral
        - id: n3
          label: 承运商揽收与首公里扫描
          detail: Flash Express 或竞争承运商从商户处揽收；首公里扫描启动追踪。平台自营网络（SPX、LEX）会在交接前截走包裹量。
          tone: neutral
        - id: n4
          label: 干线分拣和枢纽网络
          detail: 包裹流经区域分拣枢纽；Geo.sig.ai 数据确认 Flash Express 运营密集枢纽网络，并在泰国拥有广泛收件点覆盖。
          tone: positive
        - id: n5
          label: 最后一公里派送尝试
          detail: 最终配送给消费者；农村最后一公里成本最高，尤其在泰国北部和东北部，人口密度和道路基础设施让单件经济性承压。
          tone: warning
        - id: n6
          label: 派送成功或退回寄件人
          detail: 派送完成后流程闭环；派送失败会产生退回寄件人的流向，在 7–8M 件 / 日包裹基数上增加成本和运营复杂度。
          tone: neutral
      edges:
        - from: n1
          to: n2
        - from: n2
          to: n3
        - from: n3
          to: n4
        - from: n4
          to: n5
        - from: n5
          to: n6
    claimRefs:
      - CM013
      - CM020
      - CM031
      - CM032
      - CM041
