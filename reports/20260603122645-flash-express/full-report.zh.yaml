      - number: '8.4'
        title: 情景分析
        blocks:
          - type: paragraph
            body: >-
              乐观情景要求 Flash Express 加快收入增长，并显著扩张 EBITDA 利润率。若公司 2027 年收入达到约 $850M（较 2024 年约 12% CAGR），EBITDA 利润率达到
              6–8%（接近 J&T 轨迹），以 1.5–2.0× 收入 IPO 将对应 $1.3–1.7B 退出估值——仍低于 2022 年私募估值，但更接近公允价值。这个情景要求 J&T
              在泰国扩张受控，TikTok/Shopee 平台伙伴继续黏住。概率信号：中低；竞争格局和价格战中利润率受压的历史证据都不利。

              基准情景假设 Flash Express 2027 年收入 $800M、净利率约 3–4%，可比公允价值为 $800M–$1.2B（1.0–1.5× 收入）。按 $2.1B 进入的投资者，会立即面对 40–60%
              的按市价重估损失。悲观情景假设 J&T 持续降本和 SEA 扩张触发新一轮价格战，Flash 收入停滞或利润率修复反转。在该情景下，0.5–0.7× 收入对应 $400–$560M，与 Kerry Express
              的崩盘轨迹一致。无论哪种情景，公司都需要把收入从 $670M（2024 年）提高约 100%，才足以在 $2.1B 估值下支撑 1× 退出倍数；这要求未来 4–6 年执行极强。
