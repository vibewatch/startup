        - J&T 泰国包裹量份额达到 >35%（相比 2024 年 SEA 约 28%）
        - 显示 Flash 价格底线脆弱；持续包裹量压力下利润率无法恢复
        - 评估退出选项；加快 IPO 时间表，或接受折价战略出售
      - - Flash 重回净亏损
        - 2025–2026 年连续两个季度净利润为负
        - 推翻 2024 年盈利投资逻辑；确认竞争下利润率脆弱
        - 下调至回避；寻求以困境价格进行老股退出
      - - IPO 尝试失败或撤回
        - 已提交招股书撤回，或 IPO 定价低于 $1.0B EV
        - 显示公开市场否定私募估值；老股估值崩塌
        - 通过老股市场退出；协商按账面价值进行要约收购
      - - 平台合同流失
        - Shopee 或 TikTok 终止或显著减少给予 Flash 的物流委托
        - 移除约 30–50% 包裹量锚；收入和利用率大幅下降
        - 重大下调；需要证明非平台包裹量可替代
      - - 新股融资估值低于 $1.5B
        - 确认 Series G 或战略老股交易投后估值 <$1.5B
        - 正式降价轮；Series F 投资人的估值减损落地
        - 监测清算优先权保护；评估退出还是跟投
    notes: 触发项是可观察市场事件；阈值是分析估计。监测需要获取未公开的管理层报告。
