  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与细分定义
        blocks:
          - type: paragraph
            body: >-
              泰国
              courier-express-parcel（CEP）市场涵盖私营物流公司运营的所有国内和跨境配送服务，包括标准陆运包裹、限时快递服务和国际空运包裹。它明确排除公路大宗货运、冷链仓储、报关等更广义物流活动。这个边界区分有商业意义：IMARC
              Group 对 2025 年更广义物流市场给出的 $36.9 billion 估计远大于 CEP 细分，会误读 Flash Express 实际所处的竞争语境。承销分析必须锚定 $2.84–2.86
              billion 的 CEP-only 区间。

              在 CEP 边界内，市场分为四条收入流：面向消费者的电商包裹（主导且增长最快的类别，占 CEP 收入 35.71%）、跨境和国际快递（占收入 35.74%）、企业对企业合同服务，以及下滑中的文件和金融票据细分。自
              2020 年以来，Shopee、Lazada 和 TikTok Shop 共同推动泰国零售线上化，电商驱动的包裹量明显增长。

              医疗健康和医药规模较小，但结构上有吸引力；Mordor Intelligence 预计其 CAGR 为 8.48%，是所有 CEP
              子细分中增速最快的。这反映出泰国人口老龄化、药房电商应用扩张，以及冷链和文件要求为低成本竞争者制造的门槛。国际细分（占收入 35.74%）的 CAGR 为 7.72%，受 Flash Fulfillment
              六国仓储网络和增长中的 ASEAN 跨境贸易流支撑，不过海关不一致会让转化相对 GMV 增长打折。
            claimRefs:
