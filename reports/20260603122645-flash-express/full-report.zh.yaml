      - number: '1.3'
        title: 融资历史与资本结构
        blocks:
          - type: paragraph
            body: >
              Flash Express 是东南亚历史上融资最多的物流创业公司之一，已披露六轮累计融资约 $997 million。其融资轨迹从 Series A 到 Series
              F，反映公司不到四年就从创业公司成长为区域独角兽。

              公司早期轮次 Series A、B、C（2018–2020）包括高榕资本和 Cloud Angel Fund 支持，二者均为有深厚物流行业经验的中国投资者。这些早期轮次支撑了 Flash 最初覆盖泰国 77
              个府和技术栈建设。2020 年 10 月由 PTT Oil and Retail Business (OR) 领投、募资 $200 million 的 Series D，把累计融资推至 $400
              million，并引入 OR、Durbell（TCP Group）和 Krungsri Finnovate 这三家泰国大型集团作为战略伙伴。它们带来了燃料供应链、TCP 的分销能力和金融服务基础设施。

              2021 年中，Flash 又完成两轮融资。Series D+ 由 Siam Commercial Bank 旗下风险投资机构 SCB 10X 和 Chanwanich Security Printing
              领投；Series E 由 Buer Capital（Singapore）领投，SCB 10X、eWTP Capital、PTTOR、Durbell 和 Krungsri Finnovate 继续跟投。D+ 和
              E 合计新增融资 $150 million，将 Flash 估值推至 $1 billion 以上，并正式让它成为泰国第一家独角兽。Flash 法律顾问 Cooley LLP 确认，D+ 和 E 合计融资达到
              $150 million。

              2022 年 12 月，Flash 完成最大一轮融资：约 $447 million 的 Series F，使累计融资达到 $997 million，并确立 $2.1 billion 的投后估值。截至 2026 年
              6 月报告运行日，尚未公开宣布 Series G 或后续股权融资。Flash Express 仍为私营公司，未提交首次公开募股（IPO）申请。管理层此前表示，在实现区域领导地位和盈利后有 IPO 目标，但目前没有
              SET 上市安排。
