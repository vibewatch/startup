              - CM025
      - number: '2.6'
        title: 结构性约束与监管环境
        blocks:
          - type: paragraph
            body: >-
              三个结构性约束限制了泰国 CEP 增长故事的上行空间。第一是平台物流内化：Shopee SPX 和 Lazada LEX 网络逐步从独立快递手中拿回包裹量。Nation Thailand
              曾报道，TikTok、Shopee 和 Lazada 使用挤压独立快递利润率的费率结构，每件价格为 15–25 THB，低于多数运营商估计的 30 THB 盈亏平衡线。作为第二大独立运营商，Flash
              Express 具备小型快递没有的规模优势，但并不能免疫平台-商户界面上的结构性包裹量转移。

              第二个约束是监管：泰国 National Broadcasting and Telecommunications Commission（NBTC/TCCT）发布了新的物流服务指南，自 2026 年 3 月 25
              日起生效。这是首次结构化尝试，旨在规范数字物流平台及其面向商户和承运商的费用与定价行为。对 Flash Express 定价架构的完整商业影响尚未公开记录，因此 TCCT
              指南既是治理里程碑，也是前瞻分析中的开放证据缺口。

              第三个约束是劳动监管风险：泰国 Independent Workers Protection Bill 草案会把 gig-economy 快递员从承包商重新归类为雇员。BGlobal Law 和 DLA
              Piper 均指出，该法案直接适用于配送平台工作者。Flash 目前估计有 60–70% 配送劳动力被归类为独立承包商；若重新归类，劳动力成本可能上升约 30%。再叠加 gig 劳动力每年 40–50%
              的流动率已经持续制造招聘和培训成本，若法案按当前形式通过，财务敞口将很实质。DLA Piper 指出，立法时间表仍不确定，但监管方向明确，运营商应为最终重新归类做计划。
