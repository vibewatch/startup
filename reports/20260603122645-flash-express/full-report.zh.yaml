          low: 1.5
          mid: 1.8
          high: 2.1
          displayValue: $1.8B (2026)
          detail: MarkWide 的保守窄口径估算；可能采用严格仅限快递的定义，排除标准陆运包裹，因此与 CEP 共识口径可比性较弱。
          tone: warning
        - label: Mordor / GII 共识 — 2025
          low: 2.82
          mid: 2.84
          high: 2.86
          displayValue: $2.84B (2025)
          detail: 两家独立分析机构用可比的仅限 CEP 方法得出的交叉验证共识；Research and Markets 也提供佐证；因而是最可辩护的基准情景估计。
          tone: positive
        - label: 预测共识 — 2030
          low: 3.9
          mid: 4.1
          high: 4.25
          displayValue: $4.1B (2030 est.)
          detail: 混合 Mordor（到 2030 年 $4.04B）与 GII（到 2031 年 $4.25B）的前瞻预测；反映由电商和医疗健康需求支撑的 7%+ CAGR 基线。
          tone: positive
        - label: MarkWide 宽口径 — 2026（包含附加服务）
          low: 4.3
          mid: 4.8
          high: 5.2
          displayValue: $4.8B (2026)
          detail: MarkWide 的高端宽口径估算；可能纳入严格 CEP 边界之外的物流服务；属于离群值，不应锚定承销基准情景。
          tone: warning
    approximationNotes: 共识与预测项目的低 / 高边界，是作者围绕已发布中点插值得出。MarkWide 发布物没有给出置信区间，因此其低 / 高边界为作者估算。
