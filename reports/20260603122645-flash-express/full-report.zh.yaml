      - number: '2.5'
        title: 市场增长驱动因素
        blocks:
          - type: paragraph
            body: >-
              泰国 CEP 市场最主要的需求驱动，是电商 GMV 的异常快速增长。Momentum Works 数据经 Bangkok Post 印证，显示泰国电商 GMV 在 2025 年达到 $35.5
              billion，同比增长 51.8%，位居东南亚最快增速之列。TikTok Shop 的扩张尤其具有催化作用：平台的直播电商形态推动冲动购买，需要快速、成本有竞争力的履约，直接在平台-商户界面增加 CEP
              包裹量。2024 年泰国日均包裹量为 7–8 million 件，峰值日达到 10–12 million 件，凸显 Flash Express 所服务需求的规模。

              次级驱动因素包括泰国人口老龄化和药房数字化带来的医疗健康及医药电商增长；Mordor 预计该子细分 CAGR 为
              8.48%，为增速最快的细分。二线城市人均收入提升和移动互联网渗透，把消费者基础向曼谷以外延伸，并刺激首次线上购买，扩大 CEP 需求的地理覆盖。通过 Facebook Marketplace 和 LINE
              进行的 C2C 社交电商，也正成为传统零售渠道之外一个有意义且增长中的包裹来源。

              Flash Fulfillment 的 130,000+ square metre 跨境基础设施，使 Flash Express 有能力捕捉电商增长中的国际部分，尤其是同时需要泰国国内配送和单一服务商提供
              ASEAN 出口能力的商户。Nexdigm 把 CEP 基础设施投资视为泰国区域经济连接的结构性助推器，说明需求增长不只是周期性电商潮水。到 2030 年 7.1% CAGR
              的共识预测意味着需求会耐久复利，而不是一年性的需求尖峰。
            claimRefs:
              - CM013
              - CM014
              - CM020
              - CM021
              - CM022
