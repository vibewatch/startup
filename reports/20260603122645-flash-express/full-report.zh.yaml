      - number: '8.3'
        title: 可比估值与市场基准
        blocks:
          - type: paragraph
            body: >-
              最有参考价值的公开可比公司是 J&T Express (HKEX: 1519)。J&T FY 2024 收入 $10.26B（同比 +15.9%），调整后 EBITDA $780M（7.6%
              利润率），首次实现全年净利润约 $111M。约 $12.8B 企业价值对应约 1.25× EV/Revenue、约 16× EV/Adj.EBITDA；15–20% 收入增长轨迹和 SEA
              市场领导地位支撑这些倍数。把 1.25× EV/Revenue 基准套到 Flash Express 2024 年约 $670M 收入上，公允价值约 $840M，比 $2.1B 私募估值低 60%。

              Kerry Express Thailand (SET: KEX) 是一个警示性的困境可比：2024 年收入约 $256M，EBITDA 为负，市值仅 THB 1.82B（约 $49M），EV/Revenue 约
              0.36×。Kerry 的崩盘说明，泰国物流公司若跑不出可持续利润率，底部情景会很低。Ninja Van 等私募同行（2021 年最后标记约 $2.4B）即便有规模也难以 IPO，进一步说明 2021
              年高峰期物流独角兽估值可能已结构性受损。行业 EV/Revenue 区间 0.36×–1.25×，用 2024 年收入计算，Flash Express 公允价值区间约 $240M–$840M，凸显当前 $2.1B
              估值拉得过高。
