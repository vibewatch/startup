      - number: '6.2'
        title: 平台关系与具名客户证明
        blocks:
          - type: paragraph
            body: >
              Flash Express 与泰国三大主导电商平台均保持官方集成状态。作为 Shopee Supported Logistics（SSL）伙伴，Flash Express 嵌入 Shopee
              卖家后台；Shopee 自有卖家教育中心（2025 年 12 月更新）确认 Flash Express 让商家享受「快速、顺畅、可靠的物流服务」。Flash Fulfillment 同时是官方 Shopee
              Certified Warehouse，支持 Next-Day Delivery、Quick Delivery 和三种履约模式（3PF、SIP、PFF），让集成在平台承运商和仓库两个层级都成立。Flash
              Express 于 2022 年 9 月成为 TikTok Shop 的 Regional Logistics Partner，为泰国所有 TikTok Shop 商家提供门到门配送——全年 365
              天，并从第一票起免费取件。Flash Fulfillment 还拥有 TikTok Certified Warehouse 资质，并担任 TikTok Cross-Border Returns Supplier
              和 Overseas Asset Warehousing Provider。在 Lazada，Flash Fulfillment 为本地和跨境 3PF 店铺管理 LGF（全托管）和
              JIT（半托管）履约模式。在印度尼西亚，Flash Fulfillment 是 Tokopedia 的认证仓库和配送伙伴。商家管理平台 ZORT 发布了技术文档，确认已为其 SME 卖家用户集成 Flash
              Express COD 和发货服务，无最低订单规模，服务费 2.5%。这些平台合作是生产部署，不是试点；不过合作条款允许平台单方面终止，也不保证流量独占。Shopee、TikTok Shop 和 Lazada
              合计占东南亚电商 GMV 的 98.8%。
