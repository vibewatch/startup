            - label: 低 — TCCT 授权已落地，但执法未经验证
              tone: warning
            - label: 致命
              tone: negative
        - label: 零工骑手重新分类（劳动法）
          values:
            - label: 中 — 法案草案推进中；NHRC 裁定提供支持
              tone: warning
            - label: 高 — 劳动力成本台阶式上升；单票经济模型改变
              tone: negative
            - label: 低 — Flash 尚未发放合同；行业游说仍处早期
              tone: negative
            - label: 高
              tone: negative
        - label: 服务质量恶化 / 骑手流失
          values:
            - label: 高 — Trustpilot 负面；已确认年流失率 >15%
              tone: negative
            - label: 中 — 平台 SLA 罚款和商家流失风险
              tone: warning
            - label: 低-中 — 骑手激励存在；质量指标未披露
              tone: warning
            - label: 中
              tone: warning
        - label: PDPA 执法 / 网络安全漏洞
          values:
            - label: 中 — 物流行业被点名；无披露漏洞
              tone: warning
            - label: 高 — 每起事件罚款 7M+ THB；可能被平台下架
              tone: negative
            - label: 低 — 未公开 DPO 任命或安全认证
              tone: negative
            - label: 高
              tone: negative
        - label: TCCT 卡特尔调查（2026 年 4 月附加费）
          values:
            - label: 低-中 — 同步定价已确认；TCCT 审查活跃
              tone: warning
            - label: 高 — 刑事责任最高可达收入 10%
              tone: negative
            - label: 中 — 燃油成本抗辩较强；卡特尔举证困难
              tone: warning
            - label: 中
              tone: warning
        - label: COD 营运资金挤压 / 欺诈
          values:
            - label: 中 — 行业常见；估计占月收入 10-15% 的浮存
              tone: warning
            - label: 中 — 现金拖累和损失敞口
              tone: warning
            - label: 低-中 — 宣传日结；控制措施未披露
              tone: warning
            - label: 中
              tone: warning
        - label: 第二个市场退出（菲律宾）
          values:
            - label: 低-中 — CEO 转向整合；风险驱动因素与马来西亚相同
              tone: warning
            - label: 高 — 品牌进一步受损；投资者信心坍塌
              tone: negative
            - label: 低 — 菲律宾保留；战略注意力重新分配
              tone: warning
            - label: 中
              tone: warning
    approximationNotes: |
      可能性和影响评级是基于本章证据的定性判断。未使用定量概率模型或 Monte Carlo 模拟。剩余严重性反映 TR001–TR006 所述缓释后的风险敞口。
    claimRefs:
      - CR001
      - CR003
      - CR006
      - CR008
      - CR010
      - CR013
      - CR015
      - CR017
      - CR025
  - id: FR002
    title: Flash Express 风险传导图
    type: dag
    layout: wide
    summary: |
      有向无环图展示平台自我优待、劳动重新分类、PDPA 执法和 COD 敞口如何经过中间状态，传导为收入压缩、市场退出和投资逻辑破裂触发器。
    data:
      nodes:
        - id: platform-exclusion
          label: 平台自我优待（Shopee Xpress / J&T-TikTok 独家）
        - id: volume-loss
          label: Flash Express 包裹量流失
        - id: labor-reclass
          label: 零工重新分类（Independent Workers Protection Act 草案）
        - id: labor-cost-rise
          label: 劳动力成本台阶式上升
        - id: pdpa-risk
          label: PDPA 违规或泄露罚款
        - id: brand-damage
          label: 品牌和商家信任受损
        - id: cod-squeeze
          label: COD 浮存累积 / 欺诈损失
        - id: rev-compression
          label: 收入 / 利润率压缩
        - id: market-exit
          label: 市场退出（马来西亚先例）
        - id: thesis-break
          label: 投资逻辑破裂 / 投资者退出触发器
      edges:
        - from: platform-exclusion
          to: volume-loss
          label: 将包裹导向优先承运商
        - from: volume-loss
          to: rev-compression
          label: 在固定成本基础上压低收入
        - from: labor-reclass
          to: labor-cost-rise
          label: 要求缴纳社保并提供福利
        - from: labor-cost-rise
          to: rev-compression
          label: 抬高单票配送成本
        - from: pdpa-risk
          to: brand-damage
          label: 数据泄露触发商家和平台信任流失
        - from: brand-damage
          to: volume-loss
          label: 平台评分处罚和商家迁移
        - from: cod-squeeze
          to: rev-compression
          label: 营运资金拖累和欺诈损失
        - from: rev-compression
          to: market-exit
          label: 单票经济模型低于可持续门槛
        - from: market-exit
          to: thesis-break
          label: 重演马来西亚退出；显示结构性脆弱
        - from: volume-loss
          to: market-exit
          label: 竞争市场包裹量低于可行运营门槛
    claimRefs:
      - CR003
      - CR010
      - CR017
      - CR019
      - CR033
      - CR037
      - CR038
  - id: FV001
    title: 建议逻辑流程
    type: flow
    layout: standard
    summary: 从市场位置、财务验证、竞争风险和估值包袱，串联到继续研究建议的逻辑链。
    data:
      nodes:
        - id: n1
          label: 市场顺风因素
          description: 泰国 CEP 2026 年约 $3B；2026–2031 年 CAGR 7.1%
        - id: n2
          label: 收入验证
          description: 2024 年收入 THB 24,728M；同比 +23%
        - id: n3
          label: 盈利验证
          description: 2024 年净利润 THB 940M；利润率 3.8%
        - id: n4
          label: 竞争风险
          description: J&T：SEA 份额 32.8%，单票成本同比 −14.9%
        - id: n5
          label: 估值包袱
          description: $2.1B 标记 = 3.1× EV/Rev，对比 J&T 1.25×
        - id: n6
          label: 退出不确定性
          description: 未确认 IPO；股权结构表未披露
        - id: n7
          label: 继续研究
          description: 寻求价格重置（$800M–$1.2B）或股权结构表清晰度
    approximationNotes: 流程是定性逻辑的分析性摘要，不是定量决策模型。
    claimRefs:
      - CV044
      - CV045
      - CV006
      - CV007
      - CV015
  - id: FV002
    title: EV/Revenue 倍数估值敏感性
    type: bar
    layout: standard
    summary: 以 2024 年 $670M 收入为基准，套用不同 EV/Revenue 倍数，并锚定同业基准，推算 Flash Express 隐含企业价值。
    data:
      items:
        - label: 困境底部（0.36× — Kerry KEX）
          value: 241
        - label: 行业底部（0.8× — 全球物流平均）
          value: 536
        - label: J&T 可比（1.25×）
          value: 838
        - label: 增长溢价（1.5×）
          value: 1005
        - label: 高增长溢价（2.0×）
          value: 1340
        - label: 当前私募标记（3.1×）
          value: 2077
    approximationNotes: 数值为 USD millions，基于 2024 年收入约 $670M（THB 24,728M / 36.9）。倍数锚点来自公开可比分析。
    claimRefs:
      - CV026
      - CV027
      - CV028
      - CV031
  - id: FV003
    title: 不同情景下的估值 / 回报区间
    type: range
    layout: standard
    summary: 基于 2027 年收入预测和倍数情景，给出 Flash Express 乐观、基准和悲观企业价值估计区间。
    data:
      items:
        - label: 悲观情景
          low: 400
          high: 560
        - label: 基准情景
          low: 800
          high: 1200
        - label: 乐观情景
          low: 1300
          high: 1700
    approximationNotes: 区间为 USD millions 口径的分析性估计，不是管理层指引。基于 2027 年收入预测 $600M–$850M 和 EV/Revenue 倍数 0.5×–2.0×。
    claimRefs:
      - CV030
      - CV031
      - CV032
  - id: FV004
    title: 投资 KPI 评分卡
    type: kpi
    layout: standard
    summary: 截至 2026 年 6 月，面向 IC 的 Flash Express 八个投资维度评分。
    data:
      items:
        - label: 市场机会
          value: 7
          description: 泰国 CEP $3B；SEA CAGR 7%+；电商顺风已确认
        - label: 收入验证
          value: 7
          description: 2024 年收入 $670M；同比 +23%；增长轨迹稳定
        - label: 盈利验证
          value: 5
          description: 净利率 3.8% — 首个真正盈利年度；薄且脆弱
        - label: 竞争护城河
          value: 4
          description: 技术平台、配送网络 — 但 J&T 正以更低成本复刻
        - label: 执行记录
          value: 5
          description: 恢复盈利；但 3 个亏损年度和马来西亚退出削弱信心
        - label: 估值吸引力
          value: 2
          description: 3.1× EV/Revenue，对比同业 1.25×；私募标记明显偏高
        - label: 退出准备度
          value: 3
          description: 未确认 IPO；无 M&A 授权；老股市场流动性差
        - label: 证据质量
          value: 5
          description: 可取得 DBD 备案财务；股权结构表和 2025 年数据未披露
    approximationNotes: 分数 1–10；10 = 最强。评级为分析师截至 2026 年 6 月基于可得公开证据作出的判断。
    claimRefs:
      - CV044
      - CV045
      - CV005
      - CV006
      - CV008
      - CV015
      - CV043
