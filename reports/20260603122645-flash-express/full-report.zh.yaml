      - 缓释措施
      - 尽调问题
    rows:
      - - COD 营运资本挤压
        - 骑手 / 加盟商挪用现金、买家拒收、争议延迟，使结算周期超过所称 1-3 天
        - 估计 COD 浮存占月收入 10-15%；欺诈损失率未披露
        - 中——泰国 COD 占比高的电商生态中普遍存在
        - 每日结算营销；数字 COD 跟踪；欺诈控制未披露
        - 要求管理层提供月末 COD 浮存、争议解决周期和年度欺诈损失率
      - - 平台自营配送导致利润率压缩
        - Shopee Xpress 和平台自建物流以约 15 泰铢/包裹定价，低于独立快递成本底线
        - 2023-2025 年行业毛利率下降 200-400 bps；Flash 具体利润率未披露
        - 高——结构性问题；随着平台扩大自营物流，情况在恶化
        - 2026 年 4 月 3 泰铢附加费部分收回燃油成本；净利率保护有限
        - 要求提供 2022-2025 年按服务类型划分的毛利率（COD vs. 预付、平台 vs. 直营网点）
      - - 资本结构不透明 / 再融资风险
        - 2021 年 $150M Series E 后未披露融资；债务契约和授信额度未知
        - 未知——私营公司没有公开财务报告义务
        - 中——该规模公司五年未披露融资并不寻常
        - 2024 年净利润为正（THB 940M）降低紧迫性；但战略性投资需求（技术、自动化）可能需要资本
        - 要求提供完整股权结构表、债务明细、契约条款和营运资本授信细节
      - - 监管罚款——TCCT 卡特尔与 PDPA
        - 同步燃油附加费可能引发刑事卡特尔调查；PDPA 违规每起可能产生 7M+ THB 罚款
        - 潜在 TCCT 罚款：最高可达年收入 10%（按 2024 年收入约 THB 2.47B）；PDPA 罚款：每起 7M+ THB
        - 中低——已确认主动审查，但泰国物流领域刑事起诉历史上少见
        - 已聘请法律顾问；燃油成本证据可为附加费提供抗辩；PDPA DPO 披露缺口存在
        - 要求管理层提供 TCCT 和 PDPA 暴露的法律评估；确认 DPO 任命
    notes: >
      COD 浮存和 PDPA 罚款的估计量级来自公开来源（Tilleke、Hogan Lovells 执法摘要、TCCT 法案文本）和比例估算。Flash Express 未公开披露毛利率、COD
      损失率、债务契约或监管合规状态。所有估计都应在尽调中用管理层披露进行压力测试。
