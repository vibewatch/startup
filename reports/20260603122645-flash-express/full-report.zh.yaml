            body: >
              平台依赖风险是 Flash Express 单一最高严重性的敞口：Shopee、Lazada 和 TikTok Shop 合计控制东南亚电商 GMV 的
              98.8%，且每个平台都在建设或深化自有物流能力。TikTok Shop 在泰国与 J&T Express 有独家或深度优先的物流合作，意味着 Flash Express 必须与平台偏好的竞争对手争夺
              TikTok 快速增长的包裹量。Shopee 自有的 Shopee Xpress 子公司正在扩张；Flash Express 保留 Shopee SSL 地位，但可无预告终止。Lazada
              正转向高端托管履约，Flash Fulfillment 拥有 LGF 和 JIT 集成，但 Lazada
              在泰国市场份额下滑，削弱了这段关系的战略价值。马来西亚退出证明平台排斥在实践中是什么样子：行业内部人士把退出归因于独家平台协议造成的「不平衡的竞争环境」，独立快递商被饿掉订单流。Flash Express
              Malaysia 自 2021 年 10 月运营至 2026 年 1 月，四年后流量经济性变得不可持续。马来西亚大型物流聚合商 Delyva 在 Flash Express Malaysia
              关闭后，把全部商家基础正式迁移到 J&T、SPX Express、Pos Laju 和 Ninja Van，说明平台伙伴退出会级联到下游生态伙伴。Logistech Association Thailand
              主席称马来西亚退出是「警示信号」，并敦促紧急监管干预，防止同一动态在泰国上演。风险传导 DAG 显示，平台自我优待会如何通过流量流失、收入压缩、品牌受损，最终在失控时传导至退出市场。TCCT
              开放物流要求提供部分反向力量，但执法仍未经检验。
