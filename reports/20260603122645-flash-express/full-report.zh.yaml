        - 向 Flash Group CFO 或法律顾问在数据室索取
      - - 2025 年审计财务
        - 2025 全年利润表、资产负债表、现金流量表和 EBITDA 调节表
        - 验证 2024 年盈利能否延续，利润率是否向 6%+ 阈值改善
        - 索取 DBD 申报文件或审计师认证的管理账
      - - IPO / M&A 授权
        - 已确认交易所、承销商聘用、目标时间表和目标估值区间
        - 对建模退出时间和回款至关重要；若缺失，折现率必须假设持有 5+ 年
        - 董事会层面披露，或审阅顾问聘用函
      - - J&T Express 2025 年泰国市场份额数据
        - 2025 年 Flash 与 J&T 在泰国的包裹量份额
        - 关键竞争 KPI；判断 Flash 在本土市场份额是增加还是流失
        - 审阅行业报告，或通过管理层访谈索取
      - - 平台合同条款
        - TikTok Shop、Shopee、Lazada 物流委托：包裹量、期限、排他性、价格底线
        - 电商平台集中度高；公开数据不足以判断合同悬崖风险
        - 在数据室索取商业协议或脱敏摘要
      - - 债务与营运资本
        - 总债务、循环授信、契约遵守情况和营运资本周期
        - 重资产物流运营可能掩盖流动性风险；资本结构会影响退出机制
        - 在资料室核查最新债务明细和银行契约
    notes: 尽调问题代表私募股权投资的标准信息要求。能否取得资料，取决于投资者身份和 Flash Group 的披露政策。
