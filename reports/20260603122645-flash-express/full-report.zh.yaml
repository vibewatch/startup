      - number: '7.3'
        title: 运营、服务质量与技术风险
        blocks:
          - type: paragraph
            body: >
              Flash Express 激进增长模型建立在零工骑手劳动力、广泛特许网络和成本导向定价之上，已经形成持续运营弱点，并体现在客户投诉和执行风险中。flashexpress.co.th 的 Trustpilot
              评论以负面为主：用户记录了配送延误、包裹处理不当、配送人员粗鲁、未联系即配送失败，以及客服响应差。Flash Express 自身都会区骑手年流失率超过
              15%，带来持续招聘、培训和质量一致性成本。aseannow.com 社区论坛曾刊出员工流失和仓库危机报告，Flash Express 于 2023 年否认；但截至 2025
              年的独立用户评论显示，投诉尚未完全解决。COD 欺诈是行业性运营风险，Flash Express 在结构上有敞口：虚假下单、快递员挪用现金、买家到货拒收和交付完成争议，都会造成损失和营运资本拖累。Flash
              Express 的 COD 服务向商家收取 2.5%，并承诺对 TTB 账户每日结算（其他银行 3–5 天），但争议解决延误会把实际现金周期显著拉长，超过这些时间线。估计相当于月收入 10–15% 的 COD
              浮存带来持续营运资本敞口。在技术和数据安全方面，截至 2026 年 6 月，Flash Express 未公开报告任何网络安全认证、DPO 任命披露或事故响应文档。PDPC 执法记录显示，罚款点具体包括缺少
              DPO、安全措施不足和未报告数据泄露；这些缺口都可能适用于处理大规模消费者数据的物流公司。
