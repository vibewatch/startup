  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >-
              泰国 CEP 市场有六类有意义的竞争者，Flash Express 必须同时应对。直接私营快递层由 J&T Express（泰国增长最快的运营商，2024 年收入 25.4 billion baht）和
              Kerry Express（KEX）主导，后者在 2024 年净亏损 5.91 billion baht 后进入深度重组。Thailand Post 作为包裹量总体第一的既有层锚定市场，依托 138+
              年全国网络和政府支持，同时没有征收 Flash、J&T 和 KEX 均在 2026 年 4 月加收的燃油附加费。平台自有物流层——Shopee Xpress（SPX）和 Lazada
              Logistics——已成为结构上不同的力量：这些部门服务封闭平台 GMV，而不是开放市场发货方，但它们对卖家社区的包裹分配权，直接限制包括 Flash 在内的第三方运营商可获得的包裹量。Momentum
              Works 研究显示，到 2024 年，J&T Express、SPX 和 Lazada Logistics 合计处理了东南亚全部包裹量的
              60%，加速挤压老牌玩家。相邻的当日达竞争者（GrabExpress、LINE MAN）服务不同的紧急配送细分，无法替代标准次日达
              CEP。最后，维持现状的替代方案——卖家通过摩托车出租车或非正式快递自履约——在曼谷超本地商业中仍有意义，但放到规模化场景几乎可以忽略。Ken Research 以 2024 年为基准估算泰国 CEP 市场约
              USD 2.8 billion，其中国内快递服务约占包裹量三分之二。竞争环境已从增长至上的价格战时代（2018–2023）转向聚焦盈利的整合阶段；Flash 和 J&T 是两家主要幸存者，2024 年实现盈利，而
              Kerry 仍处于亏损区间。
