            title: 平台分配集中：Flash 的结构性天花板
            body: >-
              Flash Express 与 Lazada 的合作提供了有意义的包裹量，但 Shopee 作为泰国最大电商平台（GMV 约 49%），走的是 Shopee Xpress，而不是开放 3PL。TikTok
