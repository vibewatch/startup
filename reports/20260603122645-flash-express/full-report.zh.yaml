  - id: FM001
    title: 泰国 CEP 市场规模金字塔
    type: pyramid
    layout: standard
    summary: 泰国 CEP 市场嵌在更大的物流经济里；Flash Express 的营收足迹，已经占据由电商驱动的 CEP 子市场中一个可观切片。
    data:
      nodes:
        - label: 泰国广义物流市场：$36.9B（2025）
          detail: IMARC Group 估算包含公路货运、仓储、报关和 CEP；广义口径不能直接同仅限 CEP 的规模口径比较，也不应作为 Flash Express 分析的可比市场。
          tone: neutral
        - label: 泰国 CEP 共识规模：$2.84–2.86B（2025）
          detail: Mordor Intelligence 与 GII Research 交叉验证后的区间，仅覆盖快递、速递和包裹服务；国内与国际合并。Research and Markets 也佐证约 $2.9B。
          tone: positive
        - label: 电商驱动 CEP 子市场：~$1.02B（占 CEP 35.71%）
          detail: Mordor 的分部拆解将 CEP 收入的 35.71% 归为电商包裹——也是增长最快、竞争最激烈的子分部；估算方法是用 35.71% 乘以 $2.86B 共识规模。
          tone: positive
        - label: Flash Express 隐含营收：~$687M 估算（2024）
          detail: 24,728M THB ÷ 36 THB/USD；约占 2025 年 CEP 共识市场的 24%，与行业分析师引用的 20–25% 包裹量份额估计一致。
          tone: positive
    approximationNotes: >-
      Flash Express 营收按 2025 年中假设汇率 36 THB/USD 从 THB 折算。电商子市场数字由 Mordor 的 35.71% 份额乘以 $2.86B
      共识规模得出；两个输入都带有估计不确定性。金字塔本身是分层视角，不是严格的 SAM 级联。
    claimRefs:
      - CM002
