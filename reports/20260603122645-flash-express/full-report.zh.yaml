      - number: '8.5'
        title: 退出准备度与尽调问题
        blocks:
          - type: paragraph
            body: >-
              截至 June 2026，Flash Express 未出现在 SET 公布的即将 IPO 名单。公司也未披露 HKEX 招股说明书申报。最近战略沟通聚焦国内盈利和 TikTok
              合作，而非资本市场准备。二级市场平台允许合格投资者有限买入 Flash Express 股份，但没有公开定价或成交量披露。若泰国公开市场对物流公司的兴趣没有重新加速，最早现实 IPO 窗口大概率是
              2027–2028 年，前提是盈利和利润率扩张持续。

              来自物流集团（Alibaba/Cainiao、JD Logistics 或泰国产业集团）的战略收购兴趣尚未公开确认。Ninja Van 具备相似 SEA 定位但未能
              IPO，也强化了私募退出的执行风险。投资前关键尽调问题：(1) 完整股权结构表和 Series F 优先股条款；(2) 2025 年经审计财务报表；(3) 已确认 IPO 时间表和承销商接触；(4) 显示
              2025 年 EBITDA 利润率轨迹的管理账；(5) 2025 年 J&T Express 泰国市场份额数据；(6) 数字平台（TikTok、Shopee）合同条款和排他性说明。
