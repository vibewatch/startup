      - number: '4.3'
        title: 单位经济与利润率结构
        blocks:
          - type: paragraph
            body: >
              Flash Express 的盈利路径主要靠经营杠杆，而不是利润率扩张。物流业务固定成本高：分拣中心、自动化仓库（每座建设成本约 THB 300
              million）、技术基础设施、车队和全职员工。当足够包裹量覆盖这套基础成本后，每新增一票都会以高得多的增量利润率流向利润。分析师指出，Flash Express 在 FY2024
              跨过了经营杠杆拐点，成为泰国主要承运商中唯一实现正净利润的公司，而同行（J&T、KEX/Kerry）仍在亏损。


              公司报告员工超过 10,000 人（Flash Express Thailand 实体；管理层披露 Flash Group 全球员工 54,000 人）。提升 HR 成本效率是明确优先事项：管理层披露，投入自建
              HR 管理软件后，劳动力行政成本约降 50%。自创立以来累计超过 THB 5 billion 的技术投入，包括每月约 THB 60 million 的研发支出，支撑单票成本下行。分拣自动化使每个设施每小时处理超过
              40,000 票。随着包裹量向 2 million 票 / 天靠近（部分来源承认）而非公司官方口径的「每天超过 1 million 票」，单票增量成本应会继续下降。


              毛利率和 COGS 拆分仍未公开，Flash Express 不发布分部级损益。净利率约 3.8%（THB 940M / THB
              24,728M），相对定价稳定的物流同行偏薄，但与一个价格战正在正常化市场里的首个规模盈利年度方向一致。SaaS 和市场型物流同行的利润率结构完全不同（SaaS：60–80% 毛利；物流：8–20%
              毛利），SaaS / 平台型指标不适用于这里。平台抽佣压力——电商平台现在通过佣金和物流费合计向商家收取 GMV 的 22–30%——直接限制寄件人能为配送支付的空间，并压低快递商定价权。
