      - number: '2.3'
        title: 买方分层与平台动态
        blocks:
          - type: paragraph
            body: >-
              泰国 CEP 市场最大、商业意义最强的买方细分，是通过电商平台销售的中小在线商户。估计这类商户约占包裹量 55%，特点是价格敏感度很高、包裹小（通常 1–2
              kg），且履约工作流由平台中介。物流决策往往在平台层面作出：Shopee、Lazada 和 TikTok Shop 各自都有默认物流合作关系，把大量包裹导向包括 Flash Express 在内的优先承运商。

              大型品牌零售商估计占包裹量 15%，价格敏感度较低，要求品牌化包装，并有更稳定的合同关系。B2B 企业账户约占包裹量 10%，是最受 SLA 驱动的细分，要求托盘化或限时配送，并签订年度议价合同。C2C
              社交电商卖家主要通过 Facebook Marketplace 和 LINE 运营，估计约占包裹量 12%，随着二手商品和直接社交销售起量而快速增长。该细分价格敏感度高、平台中立，所有主要承运商都在争夺。

              医疗健康和医药买方约占 8%，构成价格敏感度最低、长期结构性增长逻辑最清晰的细分。Nexdigm 的行业分析确认，泰国 CEP 买方地图正越来越分化为高量、价格敏感、依赖平台的商户，以及低量、依赖 SLA
              的企业账户。这个分裂会对 Flash Express 未来产品和定价策略产生重要影响。
