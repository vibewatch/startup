      - number: '4.6'
        title: 附录
        blocks:
          - type: callout
            title: 经营杠杆拐点得到确认
            body: >
              Flash Express 在 FY2024 成为泰国主要快递商中唯一实现正净利润的公司，在 THB 24.7 billion 收入上获得 THB 940 million
              利润。这确认业务已经跨过固定成本经营杠杆门槛。现在每新增一票的增量利润率都高于平均水平，公司相对亏损同行（J&T、KEX）的成本结构优势形成了可持续的定价缓冲。
            calloutType: strength
            claimRefs:
              - CI017
              - CI018
              - CI019
          - type: callout
            title: IPO 利润缺口为当前盈利的 5-7×
            body: >
              按 Series F 估值 THB 70 billion 和泰国上市市场约 15× P/E 计算，Flash Express 需要约 THB 4.7 billion 年利润，才能在 IPO 时支撑当前估值——这是
              FY2024 结果的 5×。CEO 提出的 THB 100 billion 市值目标需要约 THB 6.7 billion 利润。这个缺口叠加约 -THB 4.9 billion
              的负账面权益，意味着如果没有连续多年的盈利增长，早轮投资者无法按估值退出。马来西亚退出确认了当前盈利水平下多市场烧钱无法继续，也限制了短期可用于弥合缺口的增长杠杆。
            calloutType: risk
            claimRefs:
              - CI031
              - CI032
              - CI033
              - CI034
          - type: callout
            title: 平台生态主导限制快递商定价权
            body: >
              电商平台（Shopee、TikTok/J&T、Lazada）正把物流整合进封闭生态，把包裹量导向首选或自营快递商，并限制独立承运商触达。泰国商家已经为平台费和物流成本合计支付 GMV 的
              22–30%。随着平台收紧控制，Flash Express 可触达的包裹量可能停滞或下降，形成一种独立于 Flash 运营执行的结构性收入天花板风险。
            calloutType: risk
            claimRefs:
              - CI026
              - CI037
              - CI038
          - type: callout
            title: 承销前需要完整私有财务数据
            body: >
              Flash Express 公开备案数据只覆盖利润表（收入和净利润）。毛利率、现金头寸、烧钱速度、债务义务、分部损益、capex 预算和
              菲律宾损益都未披露。任何资本配置或投资决定，都应以完整数据室审阅为前提，包括经审计资产负债表、现金流量表、分部披露和股权结构表。
            calloutType: recommendation
            claimRefs:
              - CI036
              - CI039
              - CI040
