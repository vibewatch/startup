      - number: '6.3'
        title: 采用轨迹与包裹量证据
        blocks:
          - type: paragraph
            body: >
              截至 2024 年，Flash Express 每日处理超过 1 million 票包裹，确立了其泰国第二大快递商（按量）的地位，仅次于 Thailand Post。2024 年收入 24.7 billion
              baht，代表同比增长 23%；公司在连续两年亏损后，于 2025 年恢复至 940 million baht 净利润。2024 年泰国全国快递包裹市场每日处理 10–12 million 票，意味着 Flash
              Express 约占总日吞吐量的 8–12%，但官方未公布市场份额。泰国电商市场在 2025 年 GMV 激增 51.8% 至 $35.5 billion，由 TikTok Shop 的
              shoppertainment 模式和直播电商采用推动，平台包裹量上升直接利好 Flash Express。TikTok Shop Thailand 到 2025 年中有 3 million 卖家、每日 GMV
              $38 million，是 Flash Express 增长最快的客户渠道。曼谷 贡献约全国包裹量一半，反映 Flash Express 活跃客户基础的地理集中。Flash Express COD
              产品——2.5% 费率、无最低单量、1–5 天结算——是主要商家入驻机制。移动应用提供发货预约、实时追踪、与员工在线聊天、COD 注册和面单打印，使 SME 分层可以完全自助完成数字化入驻。
