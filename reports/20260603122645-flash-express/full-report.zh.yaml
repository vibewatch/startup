  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户基础分层
        blocks:
          - type: paragraph
            body: >
              Flash Express 的客户基础分为三类主要付款方。主导层是 SME 电商卖家——在 Shopee、Lazada 和 TikTok Shop 上经营，并代表消费者买家支付运费和 COD
              费用的商家。这一群体贡献公司每日超过 1 million 票包裹的大部分，对应泰国平台生态前三大平台 约 3 million 卖家的规模。第二类是个人 C2C 寄件人，他们通过 Flash Express 移动
              app 或 12,000+ 个实体寄件点，把个人包裹发往泰国全部 77 个府。第三类、也是战略价值最高的一层，是使用 Flash Fulfillment 自动化仓库管理系统的企业和品牌商家；他们借助 泰国
              50,000 sqm 仓储空间里的 AGV 机器人分拣，打开当日达和次日达。Flash Express 从第一票起免费上门取件、无最低单量政策，是获取 SME
              的主要机制，刻意降低此前依赖更贵或不便快递商的家庭卖家和微型企业门槛。地域上高度偏向曼谷，约占全国包裹量一半；省际覆盖则靠特许末端代理网络维持。2025 年泰国电商 GMV 激增 51.8% 至 $35.5
              billion，为三类客户都提供结构性需求顺风。
