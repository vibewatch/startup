  - id: TV002
    title: 投资逻辑与反向逻辑
    columns:
      - 立场
      - 论点
      - 什么会改变判断
    rows:
      - - 投资逻辑
        - Flash Express 2024 年恢复盈利，收入增长 23%，验证了成本纪律
        - 如果 2025–2026 年利润率继续侵蚀，这一支柱将失效
      - - 投资逻辑
        - 泰国电商市场到 2031 年 CAGR 为 7.1%，继续支撑包裹量顺风
        - Shopee / TikTok 平台整合或自建物流会压缩外部包裹量
      - - 投资逻辑
        - 先发物流科技平台（路线优化、大数据定价）形成可防守护城河
        - J&T 类似的技术投入和更低单包裹成本会削弱护城河主张
      - - 投资逻辑
        - TikTok Shop 合作和国内第 2 位置提供耐久收入基础
        - 失去 TikTok 或 Shopee 平台合同将造成重大收入冲击
      - - 反向逻辑
        - 私募估值（$2.1B）比 J&T 上市 EV/Revenue 倍数高 2.5×；形成显著包袱
        - 估值重置到 $800M–$1.2B，或确认有更高倍数的战略买方兴趣
      - - 反向逻辑
        - J&T Express 2025 年上半年 SEA 包裹量增长 57.9%，单包裹成本下降 14.9%
        - J&T 退出泰国市场或停止激进定价，Flash 单位经济恢复
      - - 反向逻辑
        - 马来西亚退出显示区域扩张能力有限；泰国集中风险
        - 成功重新进入第二个 SEA 市场，并从第一天起盈利
    notes: 论点来自公开财务数据和行业报告；“什么会改变判断”条目是情景触发项，不是保证。
