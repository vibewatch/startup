      - number: '8.7'
        title: 展品
        blocks:
          - type: callout
            title: 首个盈利年度验证成本纪律
            body: >-
              Flash Express 2024 年 THB 940M 净利润——此前连续三年亏损——确认价格战后的理性化真实发生。收入增长 23% 至 THB
              24,728M，同时公司维持正利润率，说明结构性成本改善和更有利的平台组合变化（TikTok、Shopee）正在发挥作用。这次转盈是近期最重要的乐观信号。
            calloutType: strength
            claimRefs:
              - CV009
              - CV011
              - CV012
          - type: callout
            title: $2.1B 私募估值隐含相对最近公开可比公司 2.5× 溢价
            body: >-
              按 Flash Express December 2022 私募估值计算，EV/Revenue 约 3.1×，而 J&T Express 公开基准为 1.25×。将 J&T 倍数套用于 Flash Express
              2024 年收入，公允价值约 $840M——较私募估值下调 60%。在 Flash 证明 EBITDA 利润率超过 6% 或锁定公开市场退出之前，投资者面临显著下行风险。
            calloutType: risk
            claimRefs:
              - CV006
              - CV027
              - CV028
          - type: callout
            title: J&T Express 的 SEA 扩张是单一最大威胁
            body: >-
              J&T Express 在东南亚调整后 EBITDA 于 H1 2025 增长 50.5% 至 $310M，市场份额达到 32.8%（同比 +5.4 pp）。其泰国单票成本正在快速下降。Flash Express
              在同一市场竞争，除非能在服务质量上差异化，或赢下大型非平台企业客户，否则面临利润率压缩和件量流失风险。
            calloutType: risk
            claimRefs:
              - CV007
              - CV024
              - CV035
          - type: callout
            title: 继续研究——承诺投资前需要价格重置
            body: >-
              在 $2.1B 私募估值下，相比公开市场物流替代标的，Flash Express 的风险回报并不吸引。基准情景公允价值为
              $800M–$1.2B。投资者应在承诺出资前，要求价格重置到该区间、完整披露股权结构表和优先股堆叠、提供 2025 年经审计财务，并确认退出路径。若三项条件均满足，且价格重置到 $900M–$1.0B，风险回报对
              4–6 年期限的耐心投资者会更平衡。
            calloutType: recommendation
            claimRefs:
              - CV044
              - CV045
              - CV043
