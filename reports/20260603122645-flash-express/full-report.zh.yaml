              的平台合作不是独占，流量可以快速转向竞争对手。2026 年初退出马来西亚，是多市场过度扩张风险最清晰的已实现案例。已识别扩张杠杆包括 Flash Money（商家金融服务）、通过 Flash
              Fulfillment 六国仓库网络开展跨境物流，以及 B2B 工业物流。随着泰国移动钱包采用率预计在 2026 年超过 60%，COD 分层面临长期耐久性风险，依赖 COD
