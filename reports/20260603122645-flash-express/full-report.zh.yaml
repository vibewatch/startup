figures:
  - id: FO001
    title: Flash Express — 关键里程碑时间线
    type: timeline
    layout: wide
    summary: |
      按时间梳理从创立到 2026 年退出马来西亚的关键节点，突出融资事件、规模拐点和负面事件。
    data:
      items:
        - label: Sep 2017
          detail: Komsan Lee 与 Di Weijie 注册成立 Flash Express (Thailand) Co., Ltd.
          tone: neutral
        - label: '2018'
          detail: 业务上线：25 泰铢配送费，免费上门取件，投入 400M 泰铢个人资本
          tone: positive
        - label: 2020 年初
          detail: Series C 完成；达到 1M 件包裹 / 日里程碑；覆盖 77 个府；成为泰国第二大私营快递公司
          tone: positive
        - label: Oct 2020
          detail: Series D：OR、Durbell、Krungsri Finnovate 投入 $200M；累计融资 $400M
          tone: positive
        - label: Aug 2021
          detail: Series D+ 与 E 轮合计 $150M；达成独角兽地位（>$1B）；峰值 2M 件包裹 / 日；泰国首家独角兽
          tone: positive
        - label: '2021'
          detail: 与 Thailand Post 成立 Fuze Post 合资公司；扩张到马来西亚、菲律宾、老挝
          tone: positive
        - label: Dec 2022
          detail: Series F：$447M；累计融资 $997M；投后估值 $2.1B
          tone: positive
        - label: FY 2022
          detail: 净亏损 2,186M 泰铢——价格战亏损峰值；营收收缩
          tone: negative
        - label: FY 2024
          detail: 营收 24,728M 泰铢；净利润 940M 泰铢——恢复盈利
          tone: positive
        - label: Jan 31, 2026
          detail: 马来西亚业务停止；裁减 10,000+ 个岗位；重心重新转向泰国和菲律宾
