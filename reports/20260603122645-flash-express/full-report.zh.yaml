      - number: '7.5'
        title: 财务与营运资本风险
        blocks:
          - type: paragraph
            body: >
              Flash Express 在经历多年价格战亏损后，于 2024 年恢复盈利（THB 940 million
              净利润），但这场脆弱复苏依赖成本纪律，而燃油成本压力、平台定价压力和监管成本上升正在考验它。三家民营快递公司——Flash Express、KEX 和 J&T——宣布自 2026 年 4 月 1 日起同步每票加收
              3-baht 燃油附加费。尽管它们把这表述为必要的成本回收措施，TCCT 正在审查同步公告是否构成 Trade Competition Act 第 54
              条下的价格操纵或卡特尔行为，并带来刑事责任。随着平台运营配送压低商业定价底线，区域行业利润率在 2023–2025 年下降 200–400 个基点——Lazada 和 Shopee 自营配送估计为 15 baht
              / 票，低于独立快递商在商业规模下的成本底线。Flash Express 自 2021 年 $150 million Series E
              以来未披露任何融资。债务契约、信贷额度和营运资本额度均未公开，使财务韧性不透明。COD 营运资本风险会放大运营敞口：物流公司持有在途 COD
              结算款，对骑手、加盟商和商家承担信用敞口。争议、退货和拒收会延长结算周期并占用现金。Flash Express 估计 COD 浮存——由 2.5%
              费率结构和典型结算周期推导——占月度运营收入的显著部分，但准确数字未公开披露。
