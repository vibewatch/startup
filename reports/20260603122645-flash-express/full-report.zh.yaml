      - number: '3.2'
        title: 直接竞争者与既有竞争者画像
        blocks:
          - type: paragraph
            body: >-
              按累计网络计，Thailand Post 是包裹量市场领导者：它运营超过 1,500 个邮局，自 1883 年起服务泰国，提供私营运营商直到近年才在广度上匹配的有保障农村覆盖。Flash Express 到
              2020 年已超过 Thailand Post 的网点数量——达到 10,000+ 个服务点，相比邮政体系的足迹更多——但 Thailand Post 仍拥有超比例的农村渗透和受监管使命。Alphabridge
              估计 Thailand Post 2024 年九个月收入约 15.8 billion baht（全年约 21 billion），使 Flash Express（24.7 billion
              baht）在收入上领先，但在总包裹量上落后。J&T Express 自 2019 年以来是最具破坏力的力量。其 2024 年泰国收入达到 25.4 billion baht（同比 +37%），从 2023 年亏损
              7 billion baht 转为 2024 年盈利 819 million baht。到 2026 年 Q1，J&T 东南亚包裹量同比大增 79.9%，达到 2.77 billion 件，日均量达到 30.8
              million。J&T 将 SEA 干线车队扩至 6,200 辆、自动化分拣线扩至 73 条，表明其继续投入产能，可能加速拿下泰国份额。J&T 与 TikTok、Temu、SHEIN 和 AliExpress
              的平台集成，让它直接连接增长最快的社交电商渠道分配。Kerry Express（KEX）曾是泰国占优的私营快递，但在 2024 年以 9.45 billion baht 收入录得 5.91 billion
              baht 净亏损后跌至第四，收入较 2022 年峰值下降 52%。SF Holdings 收购 KEX 约 26.8% 股份（2024 年 1 月宣布），并随后推动应用 AI
              路线优化和高端企业包裹，意在扭转轨迹；但重组仍处早期，KEX 的网络成本基础相对包裹量仍偏高。Ninja Van 是新加坡创立的第三方物流服务商，2015 年进入泰国，覆盖 100% 东南亚，每天在区域内配送超过
              2 million 件包裹。它的技术驱动模式在当日达和次日达细分竞争，但泰国本土足迹小于本土领导者。Best Express Thailand 是二线本土运营商，按收入和包裹量通常排在前四之外，估计市场份额低于
              10%，公开财务披露有限。
