      - CM018
  - id: FM002
    title: 分析师对泰国 CEP 市场规模的估算（2025–2030）
    type: range
    layout: wide
    summary: 分析师估算区间很宽；Mordor/GII 在 $2.84–2.86B 的共识，是交叉验证最充分的 2025 年基准情景，两端由 MarkWide 离群估算包住。
    data:
