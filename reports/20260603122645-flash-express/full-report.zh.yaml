      - number: '3.3'
        title: 平台自有物流与替代威胁
        blocks:
          - type: paragraph
            body: >-
              Shopee Xpress（SPX）和 Lazada Logistics 是独立 CEP 运营商最具结构性意义的威胁。威胁不来自对开放市场发货人的直接价格竞争，而来自平台层面的包裹分配控制。Shopee
              Thailand 2024 年收入 49.964 billion baht、利润 4.630 billion baht；Lazada 收入 28.291 billion baht、利润 836 million
              baht。两大平台 2024 年合计收入 78.255 billion baht、合计利润 5.467 billion baht，超过任何单一 CEP 运营商。Shopee 持有约 49% 泰国电商
              GMV，Lazada 约
              30%；它们的自有物流天然捕获大量原本可由第三方快递竞标的包裹量。东南亚和中国之间的关键结构差异在于包裹分配权：在中国，卖家选择物流服务商；在东南亚，平台分配物流伙伴。它制造了一个自我强化循环——包裹量越低，成本越高、服务越差，又导致包裹量更低——让小型和中型运营商处于劣势，并强化
              J&T、SPX 和 Lazada Logistics 的主导地位。Momentum Works《Ecommerce in Southeast Asia 3.0》报告发现，到 2024 年，J&T、SPX 和
              Lazada Logistics 合计占东南亚全部包裹量的 60%；随着平台压低价格，J&T 单件平均收入四年间下降超过三分之一。Flash Express 与 Lazada
              的关系在该平台分配渠道中提供部分隔离，但更大的平台 Shopee 现在主要与 SPX（自有部门）而非 Flash 合作；如果 Shopee 和 Lazada 的合计 GMV 份额增长，Flash
              将面临实质包裹量天花板风险。Momentum Works（2024）估计 TikTok Shop 约占泰国电商 GMV 21%，且正在快速扩张，并偏向 J&T，这进一步收紧 Flash
              的平台入口。GrabExpress 和 LINE MAN 等相邻替代品服务当日达、超本地细分，不太可能取代次日达大众市场包裹运营商。
