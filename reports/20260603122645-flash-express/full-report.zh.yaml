              Flash、J&T 和 KEX 在 2026 年 4 月同步征收燃油附加费，说明泰国包裹价格底部已经触及。三大私营承运商现在给出的基础费率几乎一致（25–40+
              THB/parcel），价格不再是有效差异点。竞争优势会越来越由平台集成深度、技术栈、履约能力和服务可靠性决定；如果 Flash 不持续投入 capex，J&T 的自动化投资和 SF/KEX 的 AI
