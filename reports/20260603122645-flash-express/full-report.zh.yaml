      - number: '1.2'
        title: 创始人与领导层
        blocks:
          - type: paragraph
            body: >
              Flash Group 由两名背景互补的个人共同创立，这种组合对公司快速崛起至关重要。CEO Komsan Lee（Komsan Saelee）是泰籍华人创业者，出生于清莱府 Doi Wawee
              偏远村庄。他大学一年级就开始经商，后来做过房地产销售代理、货运代理，并经营服务美国、日本和中国的跨境物流业务。2018 年，29 岁的他投入约 400 million baht 自有资金创办 Flash
              Express。外界认为，他对泰国市场的深度理解和创业韧性，是 Flash 成功本土定位的核心。

              COO 兼联合创始人 Di Weijie（又称 Wei Jie）是中国籍，曾在 Alibaba 工作超过八年，参与 Alipay Wallet 及其第三方商户二维码支付方案开发。他是 Flash
              的技术驱动力，设计了公司完全自研的软件和算法套件。由于中国物流软件被认为不适合东南亚文化和运营场景，这套系统专门为当地环境校准。最终形成的技术优先管理系统，让一名经理最多可管理 200
              人，并通过数字化排班、招聘、考勤和加班系统砍掉了公司一半 HR 成本。

              Flash 刻意保持扁平组织结构。公司要求高管亲自下场，而不是只做战略，以确保他们了解一线运营。即使员工数扩至 54,000
              人，外界仍把这种文化视为保住创业敏捷度的原因。公司的核心价值观——以客户为中心、热情、诚信和奉献——自创立以来没有改变。除两名联合创始人外，领导层沟通中没有公开披露其他具名高管，不过据报道管理团队包括前
              Alibaba、Baidu 和 SF Express 人员。因此，对 Komsan Lee 和 Di Weijie 的关键人依赖，是尽调中的实质性治理考量。
