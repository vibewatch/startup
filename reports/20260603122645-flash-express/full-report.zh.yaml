      - number: '3.4'
        title: 定价、分销与切换动态
        blocks:
          - type: paragraph
            body: >-
              Flash Express 进入泰国市场时，每件包裹定价 25 baht，而当时 Kerry 收费约 60 baht。随后的价格战把全行业平均价格从每件 39 baht 压低到 2018–2023 年间约 19
              baht，实际下降 51%；这摧毁了弱势玩家的经济性，但 Flash 靠风险投资轮次资金撑了下来。到 2026 年 4 月，Flash、J&T 和 KEX 均宣布每件临时加收 3-baht
              燃油附加费，这是协调式承认价格底部已到，继续下探已不可持续。Thailand Post
              选择不征收附加费，为成本敏感的农村发货人保留优势。前三大私营承运商价格趋同后，竞争差异转向服务质量、揽收便利性、平台集成、速度和品牌信任，而不是标价。Flash 的 365
              天运营和免费上门揽收（它推出后被竞争者采用的标准）如今已是入场门槛，不再是差异点。分销权是关键切换变量：Shopee/TikTok 上的电商卖家大多被导向 SPX/J&T；Lazada 上的卖家被导向
              Lazada Logistics 或 Flash（Lazada
              优先合作伙伴）。多栖很常见——大商户同时使用两三家承运商——但平台生成订单让卖家几乎没有选择。对平台外直接面向消费者的商户而言，由于价格相近且包裹投递网络广泛，切换成本较低；Flash 的 10,000+
              网点和技术集成（API、追踪、Flash Fulfillment）带来中等粘性。Bangkok Post 指出，3-baht 附加费约占 200–300 baht 平均订单价值的 1%，可能转嫁给消费者，并让
              2026 年电商增长放缓至低于 7%，进一步温和压低所有承运商依赖的包裹量增长。
