            Blended forward projection from Mordor ($4.04B to 2030) and GII ($4.25B to 2031); reflects
            a 7%+ CAGR baseline sustained by e-commerce and healthcare demand.
          tone: positive
        - label: MarkWide broad — 2026 (includes ancillary services)
          low: 4.3
          mid: 4.8
          high: 5.2
          displayValue: $4.8B (2026)
          detail: >-
            MarkWide high-end broad-scope estimate; likely includes logistics services beyond strict CEP
            boundary; outlier that should not anchor underwriting base-case analysis.
