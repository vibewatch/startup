  - id: section-2
    title: Market sizing and analyst estimates
    body: >-
      Two analyst sources — Mordor Intelligence and GII Research — provide the most internally consistent
      and methodologically comparable estimates of the Thailand CEP market. Mordor places the 2025 market
      at $2.86 billion with a 7.16% CAGR through 2030, implying a terminal value of approximately $4.04
      billion by 2030. GII Research is nearly identical: $2.82 billion in 2025, rising to $3.02 billion
      in 2026 and $4.25 billion in 2031 at a 7.07% CAGR. Research and Markets independently corroborates
      the $2.9 billion range for 2025. The narrow gap between these three sources provides reasonable
      cross-validation for a consensus view of $2.84–2.86 billion in 2025.

      MarkWide Research publishes two materially conflicting estimates that bracket the consensus from both
      sides. A broad-definition estimate for 2026 reaches $4.8 billion (implying an 11.4% CAGR), while a
      narrow-definition estimate for the same year stands at just $1.8 billion (9.4% CAGR). The divergence
      is most plausibly explained by scope differences: the broad estimate likely includes ancillary logistics
      services, while the narrow one applies a strict express-only definition. Neither aligns with the
      Mordor/GII consensus, and both should be treated as outer-bound markers rather than base-case inputs.

      In baht terms, industry sources indicate the total Thailand parcel market exceeded 100 billion THB in
      2024, consistent with an average ticket of roughly 30–35 THB per parcel on approximately 7–8 million
      daily shipments. At 36 THB per USD, this implies a USD market of roughly $2.8–3.0 billion — again
      consistent with the Mordor/GII consensus. The in-baht cross-check thus independently anchors the
      $2.86 billion base case and reduces the likelihood that the consensus is a coordinated model artefact.
    claimRefs:
      - CM002
      - CM003
      - CM007
      - CM008
      - CM015
      - CM016
      - CM019
