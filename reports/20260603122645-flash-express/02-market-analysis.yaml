  evidenceGaps:
    - type: conflicting-data
      severity: material
      topic: market-sizing
      missingEvidence: >-
        A methodology note or scope clarification from MarkWide Research explaining the 2.7× divergence
        between their broad ($4.8B) and narrow ($1.8B) 2026 estimates for Thailand CEP.
      whyItMatters: >-
        The unexplained divergence prevents reliable triangulation of market size; underwriting analysis
        must rely on Mordor/GII consensus but cannot fully rule out either bound without understanding
        MarkWide's definitional scope.
      diligencePath: >-
        Contact MarkWide Research for methodology disclosure; cross-reference against primary TCCT or
        postal authority official statistics on parcel volume counts.
      relatedQuestionRefs:
        - QM009
      relatedTableRefs:
        - TM002

    - type: missing-source
      severity: minor
      topic: flash-fulfillment-market
      missingEvidence: >-
        A third-party estimate of the addressable market for Flash Fulfillment's cross-border warehousing
        service in ASEAN, separate from the consolidated CEP-market sizing.
      whyItMatters: >-
        Flash Fulfillment's 130,000+ sqm footprint is a meaningful asset, but without a market-size
        anchor for the warehousing-as-a-service or 4PL segment it addresses, its contribution to
        enterprise valuation cannot be independently verified.
      diligencePath: >-
        Request Flash Fulfillment's commercial pitch deck or investor materials; alternatively, use
        CBRE or JLL ASEAN logistics real estate reports to size warehouse capacity demand.
      relatedQuestionRefs:
        - QM026

    - type: access-blocked
      severity: minor
      topic: regulatory-environment
      missingEvidence: >-
        The full text of the TCCT logistics service guidelines issued March 25, 2026, including specific
        pricing floors, conduct obligations, and enforcement mechanisms.
      whyItMatters: >-
        Without the guideline text, the precise commercial impact on Flash Express's pricing architecture
        and any minimum-rate provisions cannot be assessed; the constraint is acknowledged but unquantified.
      diligencePath: >-
        File a public-records request with NBTC/TCCT or access the Thai Royal Gazette publication;
        alternatively engage a Thai regulatory counsel (e.g., BGlobal Law or DLA Piper) for text review.
      relatedQuestionRefs:
        - QM024

    - type: stale
      severity: minor
      topic: market-constraints
      missingEvidence: >-
        Current-year (2026) data on Thailand CEP operator financial results and capacity utilisation
        rates, which would sharpen the overcapacity and deceleration risk assessment.
      whyItMatters: >-
        The overcapacity signals visible in 2024–2025 price subsidisation data may have intensified or
        moderated in H1 2026; without operator financial filings or fresh analyst surveys, the magnitude
        of margin compression risk going forward is uncertain.
      diligencePath: >-
        Monitor Thai Stock Exchange filings for Kerry Express (listed); request market intelligence from
        Nexdigm or 6W Research for H1 2026 operator financial health surveys.
      relatedQuestionRefs:
        - QM028
