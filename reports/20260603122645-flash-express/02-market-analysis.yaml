  - id: FM004
    title: Thailand CEP Parcel Demand Flow
    type: flow
    layout: wide
    summary: >-
      Parcel demand originates from e-commerce platform transactions and flows through merchant fulfilment
      and carrier pickup to linehaul sorting and last-mile delivery — with platform in-housing intercepting
      volume at the carrier-selection stage.
    data:
      nodes:
        - id: n1
          label: Consumer purchase on e-commerce platform
          detail: >-
            Shopee, Lazada, TikTok Shop and social-commerce channels initiate the vast majority of Thai
            CEP volume; $35.5B GMV in 2025 (+51.8% YoY) represents the upstream demand pool.
          tone: positive
        - id: n2
          label: Platform merchant fulfillment trigger
          detail: >-
            Order confirmation triggers pick-pack-ship from the merchant; platform logistics partnerships
            (SPX, LEX) or independent carriers (Flash Express) are selected at this stage — the point
            where in-housing risk materialises.
          tone: neutral
        - id: n3
          label: Carrier pickup and first-mile scan
          detail: >-
            Flash Express or competing carrier collects from the merchant; first-mile scan initiates
            tracking. Platform in-house networks (SPX, LEX) intercept volume before this handoff.
          tone: neutral
        - id: n4
          label: Linehaul sorting and hub network
          detail: >-
            Parcels move through regional sorting hubs; Flash Express operates a dense hub network
            confirmed by Geo.sig.ai data, with extensive collection-point coverage across Thailand.
          tone: positive
        - id: n5
          label: Last-mile delivery attempt
          detail: >-
            Final delivery to consumer; rural last-mile is the highest-cost node, particularly in
            northern and northeastern Thailand where population density and road infrastructure
            make per-parcel economics challenging.
          tone: warning
        - id: n6
          label: Successful delivery or return-to-sender
          detail: >-
            Completed delivery closes the cycle; failed deliveries generate return-to-sender flows
            adding cost and operational complexity at scale on a 7–8M daily-parcel base.
          tone: neutral
      edges:
        - from: n1
          to: n2
        - from: n2
          to: n3
        - from: n3
          to: n4
        - from: n4
          to: n5
        - from: n5
          to: n6
    claimRefs:
      - CM013
      - CM020
      - CM031
      - CM032
      - CM041

callouts:
  - calloutType: strength
    title: E-commerce tailwind validates Flash Express's core market thesis
    body: >-
      Thailand's e-commerce GMV grew 51.8% year-on-year to $35.5 billion in 2025 — one of the fastest
      expansion rates in Southeast Asia. With CEP volume directly coupled to e-commerce order growth, Flash
      Express's second-largest national market position provides structural leverage to a demand curve that
      is both large and accelerating. The 7.1% CAGR forecast through 2030 implies the favourable demand
      backdrop is durable and not a one-year spike, strengthening the long-term underwriting case.
    claimRefs:
      - CM013
      - CM014
      - CM016
      - CM019

  - calloutType: risk
    title: Platform in-house logistics poses a structural volume displacement risk
    body: >-
      Shopee SPX and Lazada LEX have progressively captured volume from independent couriers at the most
      concentrated buyer segment — SME platform merchants. Nation Thailand's reporting on platform fee
      structures and per-parcel rates below the 30 THB breakeven for independents signals that the
      competitive squeeze is ongoing. Flash Express's scale provides some resilience, but the structural
      direction is unfavourable for pure-play independent CEP operators, and this risk is likely to
      intensify as platform GMV continues to grow.
    claimRefs:
      - CM030
      - CM031
      - CM038
      - CM043

  - calloutType: risk
    title: Draft gig-worker reclassification bill could raise Flash's labor costs by ~30%
    body: >-
      Thailand's draft Independent Workers Protection Bill, if enacted, would reclassify delivery
      contractors as employees. With 60–70% of Flash Express's delivery workforce in contractor status,
      the cost exposure is material. DLA Piper and BGlobal Law both flag the bill as applicable to
      delivery platform workers. A 30% increase in labor costs — on a workforce already experiencing
      40–50% annual turnover — would materially compress margins in a market already characterised by
      price-driven competition at sub-breakeven per-parcel rates.
    claimRefs:
      - CM034
      - CM035
      - CM036
      - CM037
      - CM039
      - CM040

  - calloutType: insight
    title: Analyst estimate divergence requires a consensus anchor for underwriting
    body: >-
      The MarkWide broad estimate ($4.8B for 2026) and MarkWide narrow estimate ($1.8B for 2026) differ
      by a factor of 2.7×, with neither reconcilable to the Mordor/GII consensus of $2.84–2.86B for 2025.
      Underwriting analysis should anchor on the Mordor/GII cross-validated range. The in-baht consistency
      check (~100B THB ÷ 36 THB/USD ≈ $2.8B) further supports the consensus range. MarkWide figures are
      best treated as scope-uncertainty brackets, not competing base cases.
    claimRefs:
      - CM002
      - CM003
      - CM007
      - CM008
      - CM015
      - CM016

