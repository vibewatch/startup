  - id: FU004
    title: Merchant Retention Cohort (Estimated)
    type: cohort
    layout: standard
    summary: >
      Estimated retention rates for three Flash Express merchant segments over 6 months,
      based on logistics-sector benchmarks and structural stickiness factors. No Flash-specific
      cohort data is publicly disclosed.
    data:
      columns:
        - Month 1 Retention (est.)
        - Month 3 Retention (est.)
        - Month 6 Retention (est.)
      rows:
