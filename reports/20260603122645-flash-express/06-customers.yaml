        - Production — live in Shopee seller dashboard (confirmed Dec 2025)
        - Shopee seller education hub (Dec 2025); Flash Fulfillment official page
        - Shopee can terminate SSL status without notice; volume share not disclosed
      - - TikTok Shop Thailand
