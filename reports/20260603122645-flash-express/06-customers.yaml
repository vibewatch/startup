tables:
  - id: TU001
    title: Customer Segmentation Overview
    columns:
      - Segment
      - Buyer / User / Payer
      - Primary Channel
      - Use Case
      - Scale
      - Revenue/Strategic Value
      - Diligence Gap
    rows:
      - - SME Online Sellers
        - Payer = seller; user = seller + consumer recipient
        - Shopee, Lazada, TikTok Shop (platform SSL)
        - Last-mile delivery for e-commerce orders; COD collection
        - Large (millions of SMEs on top 3 platforms)
        - Core volume driver; critical to revenue base
        - No published merchant count or per-segment revenue
      - - Individual C2C Senders
        - Payer = individual; user = individual
        - Flash app; 12,000+ drop-off points; agent network
        - Personal parcels; gifts; peer sales
        - Large; millions of app users nationally
        - Lower per-parcel value; supports free-pickup volume model
        - No public C2C customer count or volume split
      - - Social Commerce Sellers
        - Payer = live-stream seller; user = seller + consumer
        - TikTok Shop; LINE Shopping; Shopee Live
        - Rapid last-mile for impulse/live-stream purchases
        - Growing (3M TikTok sellers in Thailand as of Q1 2025)
        - Fastest-growing segment; Flash is TikTok Regional Logistics Partner
        - No revenue or volume split between social vs. traditional commerce
      - - Enterprise / Brand Merchants
        - Payer = brand; user = brand operations team
        - Flash Fulfillment WMS (AGV robots; API integration)
        - Fulfillment + last-mile; returns; cross-border
        - Medium; Flash Fulfillment undisclosed client count
        - Higher stickiness; WMS lock-in; higher per-order value
        - Flash Fulfillment enterprise client list not publicly disclosed
      - - Cross-Border Exporters / Importers
        - Payer = importer/exporter; user = logistics team
        - Flash Fulfillment (6 countries); Guangzhou front warehouse
        - Cross-border logistics; returns; inventory management
        - Emerging; 130,000+ sqm warehouse network across 6 countries
        - Diversification lever; revenue contribution not disclosed
        - No public cross-border revenue or volume data; Malaysia exit realized risk
    notes: >
      Scale descriptors are qualitative or inferred from public market data (trade.gov, Mordor
      Intelligence). No segment-level revenue or merchant count is publicly disclosed by Flash
      Express. "Large" segments reflect platform-wide seller pools that include all couriers,
      not Flash Express exclusively.
    claimRefs:
      - CU001
      - CU003
      - CU008
      - CU014
      - CU026

