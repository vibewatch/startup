  - id: TU005
    title: Expansion Opportunities and Concentration Risks
    columns:
      - Expansion Driver
      - Concentration Risk
      - Impact Rating
      - Diligence Path
    rows:
      - - TikTok Shop growth (3M sellers; $38M daily GMV Thailand)
        - Single-platform volume risk if TikTok builds in-house logistics or volume shifts to J&T
        - High — TikTok is fastest-growing channel; non-exclusive partnership
        - Request % of Flash revenue from TikTok vs. Shopee vs. Lazada vs. direct merchants
      - - Shopee SSL deep platform integration (Next-Day; Quick Delivery)
        - Shopee Xpress in-house logistics subsidiary expanding; SSL status terminable without notice
        - High — Shopee is likely largest single platform channel
        - Assess Shopee Xpress volume trajectory and any Flash SSL volume replacement
      - - Flash Fulfillment cross-border (6 countries; 130K sqm)
        - Malaysia operations closed in early 2026; multi-market execution risk realized
        - Medium — diversification upside but concentration of profitability unclear
        - Obtain country-level revenue and margin contribution from Flash Fulfillment
      - - Flash Money merchant financial services
        - Adjacent-market dependency; regulatory risk from fintech licensing in Thailand
        - Medium — early stage; no public revenue attribution
        - Request Flash Money revenue contribution and regulatory compliance status
      - - COD service for rural / provincial merchants
        - COD share declining as mobile wallet adoption projected to exceed 60% by 2026 in Thailand
        - Medium — secular headwind; offset by continued rural e-commerce growth
        - Request COD as % of total Flash Express orders YoY and trend projection
    notes: >
      Impact ratings are qualitative assessments based on platform GMV concentration data
