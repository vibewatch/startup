          values: ["~80%", "~70%", "~60%"]
        - label: "Direct COD senders (no platform tie)"
          values: ["~60%", "~45%", "~35%"]
        - label: "Flash Fulfillment WMS clients (enterprise)"
          values: ["~90%", "~85%", "~80%"]
    approximationNotes: >
      All retention estimates are inferred from logistics-sector benchmark data (Focus Digital
