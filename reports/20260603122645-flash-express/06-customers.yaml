  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: retention
      missingEvidence: Merchant NRR, GRR, and cohort-level churn rate disaggregated by SME, enterprise, and C2C segments.
      whyItMatters: Without cohort retention data, it is impossible to assess customer durability or validate that Flash Express's platform-API stickiness actually translates to recurring revenue rather than one-time merchants.
      diligencePath: Request merchant cohort data from management; cross-check with Shopee and TikTok platform data on carrier re-selection rates during annual contract periods.
      relatedQuestionRefs:
        - QU010

    - type: private-evidence-only
      severity: material
      topic: concentration
      missingEvidence: Revenue and parcel volume breakdown by customer platform (Shopee vs. TikTok vs. Lazada vs. direct merchants).
      whyItMatters: Platform revenue concentration drives the severity of the risk that any single platform builds in-house logistics or reallocates volume; without the split, concentration risk cannot be quantified.
      diligencePath: Request management accounts disaggregated by channel; if unavailable, use customer interview methodology to estimate volume mix.
      relatedQuestionRefs:
        - QU011

    - type: private-evidence-only
      severity: material
      topic: segmentation
      missingEvidence: Total registered Flash Express merchant count, year-over-year growth trend, and active vs. lapsed merchant ratio.
      whyItMatters: Merchant count growth is a leading indicator of adoption durability and platform competitiveness; its absence prevents benchmarking against J&T Express and Thailand Post.
      diligencePath: Request merchant onboarding and active-merchant figures from Flash Express management; cross-reference with app download and MAU data from Google Play and App Store.
      relatedQuestionRefs:
        - QU017

    - type: private-evidence-only
      severity: minor
      topic: retention
      missingEvidence: Published CSAT, NPS, or Trustpilot aggregate score for Flash Express's merchant-facing services (distinct from consumer/recipient reviews).
      whyItMatters: Merchant satisfaction is the relevant retention driver; consumer delivery complaints may be structurally distinct from merchant tool satisfaction.
      diligencePath: Request management-provided merchant NPS; commission independent merchant survey if NPS is not available.
      relatedQuestionRefs:
        - QU022

    - type: enumeration-incomplete
      severity: minor
      topic: named-customers
      missingEvidence: Names and deployment details of Flash Fulfillment enterprise warehouse clients beyond the five publicly documented platform integrations.
      whyItMatters: Undisclosed brand/enterprise clients may represent a more durable, WMS-integrated revenue stream; their absence from the enumeration understates the quality of the named customer base.
      diligencePath: Request customer reference list from Flash Fulfillment management; identify any public case studies or press releases naming enterprise warehouse clients.
      relatedQuestionRefs: []
      relatedTableRefs:
        - TU003

