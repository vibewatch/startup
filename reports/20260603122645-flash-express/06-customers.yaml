  - id: TU004
    title: Retention, Repeat Usage, and Satisfaction
    columns:
      - Metric
      - Value / Indicator
      - Segment
      - Confidence
      - Diligence Ask
    rows:
      - - Net Revenue Retention (NRR)
        - Not publicly disclosed
        - All merchants
        - Low — no public source
        - Request merchant cohort NRR from management; distinguish platform-API vs. direct merchants
      - - Gross Revenue Retention (GRR)
        - Not publicly disclosed
        - All merchants
        - Low — no public source
        - Request GRR and annual churn disaggregated by SME vs. enterprise vs. C2C
      - - Consumer satisfaction (review platforms)
        - Low — mostly negative (Trustpilot, ASEAN Now forums)
        - End consumers / recipients
        - Medium — adverse reviews sourced; Trustpilot blocked (broken access)
        - Obtain structured CSAT / NPS split by merchant-facing vs. consumer-facing touchpoints
      - - Internal quality complaints trend
        - +5% increase in delivery times and damage complaints (recent period)
        - All
        - Medium — cited in SWOT retrospective
        - Obtain official complaint resolution rate and trend from management
      - - Rider (last-mile) churn
        - ">15% annually in metropolitan areas"
        - Delivery staff (proxy for service quality)
        - Medium — cited in SWOT analysis
        - Obtain data on correlation between rider churn rate and on-time delivery performance
    notes: >
      Flash Express discloses no formal retention or satisfaction metrics. Consumer review
      signals are drawn from community forums and Trustpilot web-search summaries (Trustpilot
      URL returned broken/404 on direct access). Rider churn and complaint trend figures are
      sourced from the SWOTAnalysis.com retrospective, an AI-assisted synthesis not independently
      verified. All retention estimates should be stress-tested against primary management data.
