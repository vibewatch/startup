- id: monitoring-kill-criteria
  title: Mitigations and thesis-break triggers
  body: 'The most important mitigation is not a single control; it is a live monitoring system that converts ambiguous risks
    into observable decision points. Regulatory risk should be monitored through SEC tokenized-securities statements, SEC-CFTC
    taxonomy and interpretation work, CFTC tokenized-collateral pilots, ESMA MiCA implementation, ESMA DLT-pilot practice,
    and FSB tokenisation reports. Operational risk should be monitored through third-party audits, validator uptime, key-management
    evidence, incident disclosures, and customer security reviews. Partner risk should be monitored through contract conversion,
    revenue contribution, production volume, exclusivity, and whether anchor institutions publicly invest in rival rails.
    Adoption risk needs a special red-team lens because ASX’s CHESS reset remains the canonical adverse precedent for large
    DLT market-infrastructure programs, even though Broadridge and Treasury-financing evidence are positive counterweights.
    The kill criteria below are deliberately concrete: a blocking legal classification, a systemic security or liveness event,
    an anchor-platform defection, founder-CEO disruption without succession, or financial evidence that cannot support the
    2026 valuation would move the recommendation from track or research-more toward avoid.'
