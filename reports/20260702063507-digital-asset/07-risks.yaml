  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: legal-opinions-and-token-classification
    missingEvidence: Outside counsel memos on Canton Coin, tokenized Treasury workflows, securities, commodities, MiCA, payments,
      and settlement-finality treatment by jurisdiction.
    whyItMatters: The largest residual risk is a legal classification surprise that blocks or narrows the most important institutional
      workflows.
    diligencePath: Request U.S., EU, UK, and key APAC counsel opinions plus regulator correspondence and any no-action or
      sandbox materials.
