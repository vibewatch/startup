- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Tokenized securities / crypto classification
    - SEC, CFTC, ESMA, or counsel update
    - Core Canton workflow or Canton Coin incentive deemed non-compliant without practical exemption or registration path.
    - Thesis break; pause or avoid until redesigned.
  - - Tokenized Treasury legal finality
    - Custody, insolvency, settlement, or beneficial-ownership review
    - Counsel cannot support finality or enforceability for DTC-custodied Treasury tokenization.
    - Do not underwrite systemic Treasury use case.
  - - Global Synchronizer liveness
    - Validator uptime and incident reports
    - Material outage, failed upgrade, or governance deadlock affecting production workflows.
    - Reprice risk materially; kill if systemic partners halt usage.
  - - Privacy or key-management failure
    - Audit, incident, or customer security review
    - Confirmed privacy leak, key compromise, or smart-contract exploit in institutional workflow.
    - Thesis break unless contained with customer retention.
  - - Phishing / brand abuse
    - Security reports and takedowns
    - Rising scams using Digital Asset brand that cause customer, candidate, or investor losses.
    - Require remediation plan and controls before investment.
  - - Anchor partner defection
    - Public roadmap or contract update
    - DTCC, Euroclear, Broadridge, Tradeweb, Goldman, or similar anchor shifts core workflow to rival or in-house rail.
    - Reassess network-effects thesis; kill if multiple anchors defect.
  - - Pilots-not-production
    - Milestone slippage and conversion metrics
    - Flagship projects remain MVP, phase-one, or one-off transactions without recurring production economics.
    - Move to watchlist or avoid until usage evidence improves.
  - - ASX-style program failure
    - Independent review or customer announcement
    - Large market-infrastructure program is paused, written down, or reset after architecture review.
    - Treat as thesis break unless isolated and financially immaterial.
  - - Founder / leadership continuity
    - Executive departures and succession disclosure
    - Founder-CEO or critical technical/network leader exits without credible successor during commercialization.
    - Suspend underwriting pending succession diligence.
  - - Financial model and valuation
    - Revenue, burn, concentration, and preference data
    - Audited financials do not support growth, margin, or concentration assumptions implied by the 2026 valuation.
    - Avoid at current price; revisit only with lower entry or stronger proof.
  notes: Kill criteria are designed as monitoring triggers for an investor, not predictions that any event will occur.
