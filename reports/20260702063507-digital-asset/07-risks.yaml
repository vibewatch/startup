chapter:
  number: 7
  title: Risks
  summary: 'Digital Asset’s risk profile is dominated by regulatory classification, operational trust, and institutional dependency
    rather than by generic startup execution. The adverse evidence is meaningful: public regulators are still defining tokenization
    rules, ASX remains a major Daml-based cautionary precedent, and the company’s strongest partners can also become concentration
    points or competing platform sponsors.'
sections:
- id: regulatory-legal-risk
  title: Regulatory and legal risk is the top adverse axis
  body: 'The highest-ranked risk is not that tokenization is illegal; it is that Digital Asset’s value proposition sits exactly
    where securities, commodities, payment, settlement, MiCA, and operational-resilience regimes are still being drawn. SEC
    materials make the core point plainly: tokenized securities remain securities, and third-party tokenization can introduce
    intermediary risks such as bankruptcy exposure. CFTC materials are more constructive, but they also show that tokenized
    collateral in derivatives markets is still being developed through taxonomy, recommendations, initiatives, and pilot programs.
    Europe is not a simple safe harbor because MiCA imposes disclosure, authorization, supervision, and market-integrity requirements,
    while the ESMA DLT Pilot Regime treats tokenised financial instruments as a special market-infrastructure category. Canton
    Coin adds another layer: its own MiCA whitepaper discloses offer, issuer, crypto-asset, project, and technology risks.
    The mitigation is sophisticated counsel, permissioned participant controls, and regulator engagement, but residual exposure
    remains high until Digital Asset can show product-by-product legal finality across the jurisdictions and asset classes
    that matter.'
  claimRefs:
