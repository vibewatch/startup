- id: partner-people-financial-risk
  title: The strongest proof points are also concentration and execution risks
  body: Digital Asset’s partner roster is a strength, but this chapter treats it adversarially. DTCC, Euroclear, Tradeweb,
    Broadridge, Goldman Sachs, and J.P. Morgan are not passive logos; they are market infrastructures, banks, workflow owners,
    and in some cases platform builders. DTCC and Euroclear validate the Canton thesis, yet their projects must convert from
    planned or phase-one programs into durable production economics. Broadridge proves that Daml-linked workflows can carry
    high-volume repo activity, but that success does not guarantee every new market-infrastructure program will scale. Goldman’s
    GS DAP and J.P. Morgan’s Kinexys show that institutions with credibility and distribution can sponsor alternative tokenization
    rails. People and financial risks interact with this dependency risk. Yuval Rooz’s founder-CEO role is a stabilizing asset
    after the Blythe Masters transition, but it is also key-person exposure during commercialization. The 2026 raise and reported
    valuation provide runway and validation, but public sources still do not reveal revenue, burn, margins, customer concentration,
    or contract economics.
