- id: operational-security-risk
  title: Operational trust is a product feature, not a back-office detail
  body: 'Canton is sold on privacy, control, and reliable synchronization for regulated institutions, so operational risk
    has direct revenue consequences. A smart-contract defect, key-management failure, phishing campaign, privacy leak, or
    Global Synchronizer liveness event would not merely create remediation cost; it would undermine the reason buyers choose
    Canton instead of conventional ledgers or simpler private networks. Digital Asset’s own phishing warning confirms current
    impersonation and brand-abuse risk, while Chainalysis evidence shows crypto theft and private-key hygiene remain live
    industry risks. Canton’s technical mitigation is credible: the architecture is purpose-built for privacy, the Global Synchronizer
    coordinates independent subnets, and Super Validators participate in governance. The residual risk is that those mitigations
    must work in multi-party production settings where a single institution cannot unilaterally coordinate upgrades, incident
    response, or legal interpretations. Operational diligence therefore needs independent audit evidence, incident history,
    validator runbooks, key ceremonies, and business-continuity testing rather than marketing-level architecture descriptions.'
  claimRefs:
  - CR013
  - CR014
  - CR015
  - CR016
