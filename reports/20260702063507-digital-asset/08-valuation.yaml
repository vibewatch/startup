- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Thesis evidence
  - Anti-thesis or risk
  - What would change the view
  rows:
  - - Institutional category potential
    - DTCC, Tradeweb, Broadridge-linked and Canton sources show workflows in Treasuries, repo, and collateral.
    - Production economics are not disclosed publicly.
    - Signed revenue, usage, pricing, and renewal data from flagship workflows.
  - - Privacy and interoperability moat
    - Canton is designed for selective transparency and regulated-institution needs.
    - Selective transparency can weaken crypto-native liquidity and decentralization appeal.
    - Evidence that both institutions and token liquidity providers use the same rails at scale.
  - - TradFi investor credibility
    - a16z crypto plus Goldman, BNP, DTCC, Tradeweb-linked and other institutions support the syndicate.
    - Strategic investors can also direct economics into their own platforms.
    - Contractual evidence that Digital Asset captures economics despite partner-owned rails.
  - - RWA-tokenization TAM
    - Tokenized Treasuries, collateral, repo, and settlement are large workflow categories.
    - Tokenization alone may not solve liquidity, DeFi fit, or operational adoption frictions.
    - Volume, take-rate, and retention data from live workflows.
  - - Execution track record
    - Daml, Canton, Global Synchronizer, and partner announcements show long-term technical persistence.
    - ASX CHESS history shows that large DLT market-infrastructure programs can fail or reset.
    - Independent implementation audits and production SLAs for current programs.
  - - Capital base
    - The June 2026 round materially improves runway and ecosystem-building resources.
    - Unknown liquidation preferences and dilution may make headline valuation misleading.
    - Full financing documents and liquidation waterfall.
  notes: This table intentionally pairs each positive underwriting point with the most valuation-relevant reason it could
    fail.
