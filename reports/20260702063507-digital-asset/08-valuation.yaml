  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: audited-revenue-and-arr
    missingEvidence: Audited 2025-2026 revenue, ARR, gross margin, implementation revenue, token or network-fee economics,
      and revenue by customer cohort.
    whyItMatters: The valuation can look reasonable or stretched depending almost entirely on whether flagship institutional
      workflows have converted into recurring, high-quality revenue.
    diligencePath: Request audited financial statements, revenue bridge by product line, ARR waterfall, deferred revenue schedule,
      and customer-level revenue concentration.
    relatedQuestionRefs:
    - QV002
    - QV020
    - QV026
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-preferences
    missingEvidence: Post-money cap table, liquidation preference stack, secondary/tender details, side letters, pro-rata
      rights, and anti-dilution terms from the 2025 and 2026 financings.
    whyItMatters: A $2 billion headline valuation is not equivalent to common-equity value if the round carried structure
      or senior preferences.
    diligencePath: Review financing documents, investor-rights agreements, cap table, and liquidation waterfall under base
      and downside exit values.
    relatedQuestionRefs:
    - QV005
    - QV027
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: partner-to-revenue-conversion
    missingEvidence: Signed contracts, pricing schedules, usage metrics, SLAs, implementation milestones, and renewal rights
      for DTCC, Euroclear, Tradeweb, Broadridge-linked and other flagship workflows.
    whyItMatters: The central thesis depends on converting institutional proof into durable economics rather than one-off
      pilots or partner-owned platforms.
    diligencePath: Hold customer calls and reconcile public announcements to bookings, live usage, revenue recognition, and
      production rollout status.
    relatedQuestionRefs:
    - QV007
    - QV008
    - QV009
    - QV020
    relatedTableRefs:
    - TV006
    - TV005
  - type: enumeration-incomplete
    severity: minor
    topic: comparable-valuation-table-public-sample
    missingEvidence: Private-company revenue multiples, secondary marks, and exact ownership-adjusted enterprise values for
      all private comparable companies.
    whyItMatters: The comparable table intentionally brackets Digital Asset with available public and official data, but private
      marks and revenue multiples are not complete enough for a full valuation comp set.
    diligencePath: Supplement public sources with PitchBook/CapIQ/private secondary data and management-provided revenue multiples
      before investment committee.
    relatedQuestionRefs:
    - QV013
    - QV014
    - QV017
    - QV018
    relatedTableRefs:
    - TV004
