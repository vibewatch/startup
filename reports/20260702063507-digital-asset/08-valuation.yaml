schemaVersion: report-v2
artifact: valuation
slug: digital-asset
runDate: '2026-07-02'
company:
  name: Digital Asset
chapter:
  number: 8
  title: Valuation
  summary: Digital Asset is a credible category-defining institutional blockchain infrastructure candidate, but at a reported
    $2 billion June 2026 valuation the public evidence supports a research-more stance rather than a buy. The recommendation
    is medium-confidence, high-risk, and stretched-to-fair until audited revenue, contract conversion, and cap-table terms
    prove that flagship workflows monetize into durable economics.
sections:
- id: section-1
  title: Recommendation and entry discipline
  body: 'Digital Asset deserves an investment-committee hearing, but the price-sensitive answer at the June 2026 mark is research-more,
    not buy. The company now has rare evidence for an institutional blockchain infrastructure thesis: a fresh $355 million
    financing led by a16z crypto, a reported $2 billion valuation, and public workflows with DTCC, Tradeweb, Broadridge-linked
    repo activity, and other market-infrastructure names. That evidence justifies taking the company seriously as a potential
    category winner. It does not yet justify underwriting the round as obviously cheap because public sources still do not
    disclose revenue, ARR, gross margin, customer concentration, or the economics of Canton Coin and network fees. The entry
    bar should therefore be explicit: keep the company on a priority watch list, require at least 3x net upside before a new
    buy recommendation, and do not treat strategic investors as a substitute for audited monetization evidence.'
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV013
  - CV014
  - CV015
  - CV016
  - CV041
  - CV042
  - CV043
  tableRefs:
  - TV001
  figureRefs:
  - FV001
  - FV004
- id: section-2
  title: Thesis and anti-thesis
  body: 'The core thesis is that Digital Asset may be building the privacy-preserving network layer that lets regulated financial
    institutions move tokenized cash, collateral, and securities without exposing sensitive bilateral activity on a fully
    transparent chain. That thesis is not just conceptual: DTCC, Tradeweb, and Broadridge-related evidence shows workflows
    near the heart of Treasury financing and collateral movement. The anti-thesis is equally material. Public announcements
    still read more like milestone proof than a transparent revenue model, and several backers or partners also sponsor adjacent
    platforms. Canton’s selective-transparency design can be exactly what banks need while still leaving crypto-native liquidity,
    governance, and token economics less certain. The result is an attractive company-quality score but a bounded valuation
    score. An investor should pay for proof of production revenue, not merely for the prestige of the partner list.'
  claimRefs:
  - CV004
  - CV005
  - CV006
  - CV007
  - CV008
  - CV009
  - CV010
  - CV035
