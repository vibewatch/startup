- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Case
  - Assumptions
  - Scenario EV range (USD M)
  - Probability signal
  - Downside trigger
  rows:
  - - Bull
    - Canton becomes a neutral settlement and collateral layer across multiple systemic workflows; Digital Asset captures
      recurring software, services, network, or token economics.
    - 4500-9000
    - Multiple flagship partners convert to paid production, audited recurring revenue emerges, and governance remains neutral.
    - None; upgrade to buy if evidence supports at least 3x net upside.
  - - Base
    - Production relevance is real but revenue conversion is gradual; partners retain some economics and private-company opacity
      persists.
    - 1500-3500
    - Selective paid deployments, strong ecosystem growth, and clean financing terms, but no public-company-ready revenue
      scale yet.
    - Maintain research-more until revenue and cap-table diligence clear.
  - - Bear
    - Pilots stay fragmented, partner platforms capture value, tokenization economics disappoint, or structured financing
      resets common-equity value.
    - 500-1200
    - Down-round risk, preference-heavy inside round, flagship customer delays, or regulatory constraints.
    - Avoid or reprice materially below the headline 2026 valuation.
  notes: Ranges are scenario enterprise-value outcomes, not revenue multiples; public sources do not disclose enough revenue
    or ARR for a defensible multiple model.
