- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Status / value signal
  - Relevance to Digital Asset
  - Limitation
  rows:
  - - Fireblocks
    - 'Private Series E: $550M raise at $8B valuation.'
    - High-value digital-asset infrastructure reference with institutional custody/wallet demand.
    - Custody/security model differs from Canton network and Daml application economics.
  - - Chainalysis
    - 'Private Series F: $170M raise and $8.6B valuation.'
    - Shows crypto-infrastructure data platforms can reach multi-billion values with mature demand.
    - Compliance/data revenue is not the same as market-infrastructure network monetization.
  - - Circle
    - 'Public comparable: about $16.55B July 2026 market cap.'
    - Stablecoin infrastructure and public-market disclosure reference.
    - Public company with disclosed economics and different stablecoin risk profile.
  - - Coinbase
    - 'Public comparable: about $41.95B July 2026 market cap.'
    - Liquid public crypto-market-infrastructure benchmark.
    - Exchange/custody/trading model is much broader and more revenue-transparent.
  - - Ondo
    - 'Token-market reference: roughly $1.6B market cap and $3.3B FDV on CoinGecko.'
    - RWA-tokenization sentiment marker near Digital Asset entry valuation scale.
    - Token FDV is not an equity enterprise value or software revenue multiple.
  - - Fnality
    - 'Strategic infrastructure rounds: £77.7M Series B and $136M Series C.'
    - Bank-backed settlement infrastructure comp with overlapping investors and users.
    - Round size is not a valuation and Fnality’s settlement-asset model differs.
  - - Securitize
    - 'Strategic tokenization comp: $47M BlackRock-led round and BUIDL surpassing $1B AUM.'
    - Shows tokenization platforms can convert flagship asset-manager relationships into visible AUM.
    - AUM and transfer-agent role differ from Canton network economics.
  - - Ripple
    - Private strategic investment at $40B valuation.
    - Upper-bound strategic-liquidity reference for scaled crypto-finance infrastructure.
    - Payments/XRP ecosystem makes it a loose reference, not a direct comp.
