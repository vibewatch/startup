- id: section-3
  title: Scenario valuation and sensitivity
  body: The correct method is scenario underwriting rather than a false revenue multiple. No retained source gives enough
    revenue, ARR, or margin data to calculate a defensible software or network multiple. The bull case assumes Canton becomes
    shared infrastructure for tokenized Treasuries, repo, collateral mobility, settlement, and digital cash, with Digital
    Asset retaining meaningful software, implementation, or network economics across multiple systemic institutions. The base
    case assumes production relevance but slower revenue conversion, where the June 2026 price is fair only if management
    can show recurring monetization. The bear case assumes pilots, strategic branding, and partner-owned rails absorb most
    economics. Sensitivity is therefore dominated by revenue proof, partner concentration, regulatory readiness, and whether
    future capital is clean common-equity-like money or preference-heavy structure.
  claimRefs:
  - CV017
  - CV018
  - CV019
  - CV039
  - CV040
  - CV043
  tableRefs:
  - TV003
  figureRefs:
  - FV003
- id: section-4
  title: Comparable frame and exit readiness
  body: The comparable set supports the possibility of large outcomes but does not prove Digital Asset is underpriced. Fireblocks
    and Chainalysis show that private digital-asset infrastructure companies can achieve multi-billion valuations when the
    market believes infrastructure demand is durable. Circle and Coinbase show that public-market crypto infrastructure can
    support much larger equity values, but those companies have clearer disclosed revenue models and liquid securities. Ondo
    is a useful token-market reference yet should not be treated as an equity comparable. Fnality and Securitize show that
    bank-backed settlement and tokenization infrastructure can raise strategic capital, while Ripple shows that scaled crypto-finance
    platforms can access very large strategic liquidity. For Digital Asset, IPO readiness requires audited scale and governance
    neutrality; strategic M&A is plausible but complicated by market-infrastructure neutrality and partner competition.
  claimRefs:
  - CV020
  - CV021
  - CV022
  - CV023
  - CV024
  - CV025
  - CV026
  - CV027
  - CV028
  - CV029
  - CV030
  tableRefs:
  - TV004
- id: section-5
  title: Diligence asks, thesis-break triggers, and final stance
  body: The final stance is research-more with medium confidence, high risk, and a stretched-to-fair valuation view. That
    is deliberately stricter than a generic track call because the company is important enough to diligence now, but the public
    evidence is not complete enough to buy at the headline price. The diligence package should focus on revenue quality, partner-to-contract
    conversion, cap-table structure, governance neutrality, and regulatory constraints. Thesis-break triggers should be set
    before management meetings, not after. Failure to prove paid production usage from flagship workflows, a preference-heavy
    insider round, or evidence that partners capture economics through their own platforms should force a no-go or material
    repricing. Conversely, audited recurring revenue, clean financing terms, and neutral governance across competing institutions
    would justify revisiting the recommendation.
  claimRefs:
  - CV031
  - CV032
  - CV033
  - CV034
