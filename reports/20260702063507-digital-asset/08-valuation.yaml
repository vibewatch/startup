- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - No paid production conversion
    - Flagship workflows remain pilots or unpaid implementations after diligence period.
    - Invalidates the jump from institutional logos to monetized network economics.
    - Do not invest; revisit only after paid usage proof.
  - - Partner-owned economics
    - Goldman, JPMorgan, banks, or market infrastructures route economics primarily through proprietary platforms.
    - Weakens Digital Asset’s control over value capture.
    - Require lower entry valuation or contractual revenue share.
  - - Preference-heavy financing
    - 2026 or later financing has senior preferences, aggressive anti-dilution, or insider structure.
    - Headline $2B post-money would overstate common-equity value.
    - Reprice using liquidation waterfall; avoid if common upside is capped.
  - - Regulatory or governance constraint
    - Privacy-preserving settlement or collateral workflows cannot pass required governance, compliance, or regulator hurdles.
    - Blocks institutional network scaling.
    - Pause until approvals and governance model are documented.
  - - ASX-style implementation reset
    - Major customer program is cancelled, rebuilt, or materially delayed after implementation review.
    - Signals that market-infrastructure migration risk is underpriced.
    - Move to avoid unless valuation resets.
  - - Tokenization economics disappoint
    - Volumes grow but liquidity, take rate, or fee capture remain negligible.
    - TAM narrative fails to become revenue.
    - Do not underwrite TAM premium; wait for economics.
  notes: Triggers are set as pre-diligence decision rules so the recommendation does not drift with narrative momentum.
