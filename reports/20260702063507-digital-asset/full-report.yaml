      - number: '2.4'
        title: Drivers, constraints, and evidence gaps
        blocks:
          - type: paragraph
            body: >-
              The strongest growth drivers are regulatory legibility, always-on settlement, collateral efficiency,
              reduced reconciliation, programmable compliance, and institutional demand for yield-bearing tokenized
              products. MiCA and ESMA's implementation work matter because they turn parts of the crypto-asset perimeter
              into a supervised, disclosure-based regime. BIS and IMF materials also validate the direction of travel
              toward tokenized money, assets, and settlement infrastructure, but they do not remove the governance and
              safety burden. Constraints remain equally important. Tokenization suffers from cold-start dynamics:
              issuers can create tokens before enough investors, liquidity, cash legs, and intermediaries make the
              market useful. Regulated institutions must also preserve legacy rails while testing new ones, which raises
              switching cost and slows budget conversion. Interoperability is another gating issue because assets, cash,
              identity, custody, and compliance may live on different ledgers. Finally, Finextra's trust critique is a
              reminder that crypto-adjacent vendors must overcome concerns about custody, transparency, security, and
              bad-actor history. The diligence posture should be constructive but evidence-constrained: the market is
              real, yet public sources do not disclose Digital Asset's contract values, conversion rates, or share of
              economics.
