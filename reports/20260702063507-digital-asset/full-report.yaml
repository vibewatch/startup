  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and who really adopts Canton
        blocks:
          - type: paragraph
            body: >-
              Digital Asset does not look like a broad horizontal SaaS vendor with many small customers. The visible
              customer base is concentrated in regulated financial-market infrastructure and adjacent wholesale
              workflows where shared ledgers solve coordination problems among institutions that already trade, settle,
              custody, or finance assets with one another. That means the buyer, user, and beneficiary are often
              different. A market infrastructure such as DTCC or Euroclear can shape standards and governance; banks and
              dealers can use the workflow to finance or mobilize collateral; asset managers and tokenized-fund issuers
