      - number: '8.3'
        title: Scenario valuation and sensitivity
        blocks:
          - type: paragraph
            body: >-
              The correct method is scenario underwriting rather than a false revenue multiple. No retained source gives
              enough revenue, ARR, or margin data to calculate a defensible software or network multiple. The bull case
              assumes Canton becomes shared infrastructure for tokenized Treasuries, repo, collateral mobility,
              settlement, and digital cash, with Digital Asset retaining meaningful software, implementation, or network
              economics across multiple systemic institutions. The base case assumes production relevance but slower
              revenue conversion, where the June 2026 price is fair only if management can show recurring monetization.
              The bear case assumes pilots, strategic branding, and partner-owned rails absorb most economics.
              Sensitivity is therefore dominated by revenue proof, partner concentration, regulatory readiness, and
              whether future capital is clean common-equity-like money or preference-heavy structure.
