            body: >-
              The final stance is research-more with medium confidence, high risk, and a stretched-to-fair valuation
              view. That is deliberately stricter than a generic track call because the company is important enough to
              diligence now, but the public evidence is not complete enough to buy at the headline price. The diligence
              package should focus on revenue quality, partner-to-contract conversion, cap-table structure, governance
              neutrality, and regulatory constraints. Thesis-break triggers should be set before management meetings,
