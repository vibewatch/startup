      - number: '6.3'
        title: Adoption trajectory, repeat usage, and what retention can and cannot prove
        blocks:
          - type: paragraph
            body: >-
              The adoption trajectory is stronger than a single pilot but weaker than a public revenue cohort. Canton
              launched with a small institutional group, moved through 2024 collateral pilots with disclosed node and
              transaction counts, reached nearly 400 ecosystem participants by mid-2025, and then was described in 2026
              coverage as having 700+ ecosystem participants. The important nuance is that 700+ is an
              ecosystem-participant count, not a paying-customer count. More persuasive than the headline count is the
              repeated sequence of working-group milestones: initial on-chain U.S. Treasury financing, five coordinated
              transactions with broader stablecoin liquidity, cross-border intraday repo across assets and currencies,
              tokenized gilt repo, and then a July 2026 real-time Treasury transaction. Those repeated phases suggest
              consortium stickiness and learning velocity. They still do not disclose NRR, churn, renewal terms,
              customer-level usage, or satisfaction. The safest diligence posture is to treat repeat participation as a
              retention proxy while demanding private customer-health evidence before underwriting durable revenue.
