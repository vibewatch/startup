      - number: '3.4'
        title: Switching Costs, Lock-In, Multi-Homing, and Distribution Power
        blocks:
          - type: paragraph
            body: >-
              DAML's Haskell-derived syntax and multi-party workflow model impose a genuine switching cost: migrating
              contracts written for DAML to Solidity or other EVM-based ecosystems requires re-architecting business
              logic rather than simple code translation, and the specialist developer skill set required is scarcer than
              the broad EVM talent pool, which raises both technical lock-in and recruiting costs once an institution
              commits to Canton. Yet the buyer side of the market shows the opposite pattern -- persistent multi-homing
              rather than single-rail lock-in. JPMorgan already settles JPM Coin on both Coinbase's Base network and
              Canton simultaneously, and six specialized tokenization platforms (Securitize, Ondo, Backed Finance,
              Centrifuge, Hashnote, and Plume Network) already split more than $20 billion of tokenized real-world-asset
              volume by distinct role -- issuer-of-record, fund manager, wrapped-equity factory, private-credit
              marketplace, money-market issuer, and RWA-native settlement chain -- rather than institutions
              consolidating their mandates on one vendor. Distribution power is similarly contested rather than settled.
              DTCC, which co-chairs Canton's own governance foundation, is simultaneously building a competing
              tokenization service whose Industry Working Group of more than 50 firms overlaps heavily with Canton's own
              institutional roster, including BlackRock, Goldman Sachs, JPMorgan, and Ondo Finance -- Digital Asset
              itself is even a named participant in that DTCC working group, illustrating how thoroughly buyer and
              governance relationships now crisscross competing rails. On supply and partner access, Digital Asset has
              responded not just by building organically but by taking equity positions in adjacent infrastructure: its
              2026 minority investment in HQLAx, alongside Broadridge, gives Digital Asset board-level visibility into a
              competing collateral-mobility platform rather than leaving that relationship purely at arm's length.
              Whether that investment carries any commercial exclusivity, or is limited to board-observation rights,
              remains undisclosed and is a live diligence question, since the answer determines whether Digital Asset
              can meaningfully constrain HQLAx's own multi-homing with other rails.
