companyProfile:
  summary: >-
    Digital Asset Holdings, LLC ("Digital Asset") is a New York-headquartered financial-infrastructure company founded
    in 2014. It created Daml, an open-source smart-contract language and application platform, and the Canton Network, a
    privacy-enabled public Layer 1 blockchain designed so that regulated institutions can transact on shared
    infrastructure without exposing sensitive data. The company has repositioned from a Daml-centric developer story
    toward operating Canton as core on-chain infrastructure for tokenized assets, collateral mobility, and settlement.
  foundedDate: '2014-01-01'
  founders:
