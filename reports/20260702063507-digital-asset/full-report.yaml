  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary: institutional rails, not generic crypto'
        blocks:
          - type: paragraph
            body: >-
              The diligence market for Digital Asset should be defined around institutional blockchain infrastructure
              for capital markets, not around the full crypto-asset economy. The included work is where Canton can
              plausibly matter: tokenizing regulated assets, synchronizing post-trade records, moving collateral,
              supporting repo or Treasury settlement, connecting tokenized cash legs, and embedding permissioned
              compliance controls for institutions that cannot operate on fully transparent retail-style networks. This
              keeps the market close to the workflows Digital Asset publicly emphasizes through Canton, collateral
              mobility, DTCC Treasury tokenization, and on-chain Treasury financing. The boundary also avoids a common
              TAM error. Stablecoins, CBDCs, speculative exchange volume, mining, NFTs, and consumer wallets may be
              adjacent enablers or cash legs, but they should not be counted as direct Digital Asset market value unless
              they attach to institutional securities, collateral, or settlement workflows. Status-quo substitutes
              remain powerful: legacy CSDs, custodians, internal bank ledgers, reconciliations, tri-party repo
              infrastructure, and existing market-data or operations vendors already solve pieces of the job. The market
              is therefore best understood as a replacement, extension, or synchronization layer for incumbent financial
              infrastructure rather than as a stand-alone crypto platform category.
