        blocks:
          - type: paragraph
            body: >-
              Leadership evidence is especially important here because public memory of Digital Asset still over-weights
              Blythe Masters relative to the current operating bench. The retained sources support a cleaner chronology.
              Digital Asset was founded in 2014, Yuval Rooz is a documented co-founder, and independent coverage says he
              became permanent CEO in March 2019 after Masters stepped down at the end of 2018. That means Masters was a
              major early CEO and credibility catalyst, but not the only founder-level figure that should define the
              current company. The public executive bench visible on the about page also matters. Eric Saraniecki and
              Shaul Kfir remain founder-linked technical or network-strategy figures, while Kelly Mathieson and Emnet
              Rios help signal institutional-market and finance depth. Jonathan Isaac's 2025 appointment as CMO is
              another clue that the company sees itself moving from specialist infrastructure vendor toward broader
              ecosystem scaling. The capital record also shows a sharp shift from the earlier Daml-centric story to a
              Canton-centric one. Publicly reconstructable rounds include an over-$120 million Series D in 2021, a $135
              million strategic round in June 2025, a reported $50 million strategic round in December 2025, and the
              $355 million June 2026 round led by a16z crypto at about a $2 billion valuation. Even before counting
              older Series A, B, and C amounts, those cited rounds alone imply at least $660 million raised since 2021.
              That is a serious capital base for a private infrastructure company, but it does not substitute for
              cap-table transparency or audited economics.
