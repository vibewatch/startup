            body: >-
              Digital Asset’s customer expansion loop is attractive because the same network can move from one asset and
              counterparty set to adjacent use cases: tokenized Treasuries to repo, repo to collateral reuse, collateral
              reuse to tokenized deposits, stablecoins, money-market funds, cross-border settlement, and 24/7 liquidity.
              Partner-led distribution also matters. DTCC, Euroclear, Tradeweb, Broadridge, Circle, LSEG, and large
