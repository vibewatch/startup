  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - No paid production conversion
        - Flagship workflows remain pilots or unpaid implementations after diligence period.
        - Invalidates the jump from institutional logos to monetized network economics.
        - Do not invest; revisit only after paid usage proof.
      - - Partner-owned economics
        - Goldman, JPMorgan, banks, or market infrastructures route economics primarily through proprietary platforms.
        - Weakens Digital Asset’s control over value capture.
        - Require lower entry valuation or contractual revenue share.
      - - Preference-heavy financing
        - 2026 or later financing has senior preferences, aggressive anti-dilution, or insider structure.
        - Headline $2B post-money would overstate common-equity value.
        - Reprice using liquidation waterfall; avoid if common upside is capped.
      - - Regulatory or governance constraint
        - >-
          Privacy-preserving settlement or collateral workflows cannot pass required governance, compliance, or
          regulator hurdles.
        - Blocks institutional network scaling.
        - Pause until approvals and governance model are documented.
      - - ASX-style implementation reset
        - Major customer program is cancelled, rebuilt, or materially delayed after implementation review.
        - Signals that market-infrastructure migration risk is underpriced.
        - Move to avoid unless valuation resets.
      - - Tokenization economics disappoint
        - Volumes grow but liquidity, take rate, or fee capture remain negligible.
        - TAM narrative fails to become revenue.
        - Do not underwrite TAM premium; wait for economics.
    notes: Triggers are set as pre-diligence decision rules so the recommendation does not drift with narrative momentum.
    claimRefs:
      - CV010
      - CV011
      - CV012
      - CV019
      - CV035
      - CV036
      - CV037
      - CV038
      - CV045
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Diligence path / owner
    rows:
      - - Revenue quality
        - Audited revenue, ARR, gross margin, deferred revenue, and product-line split.
        - Determines whether $2B is software-infrastructure fair value or narrative premium.
        - CFO data-room request plus auditor call.
      - - Flagship contracts
        - >-
          Signed contracts, pricing, usage, SLAs, and renewal rights for DTCC, Euroclear, Tradeweb, and
          Broadridge-linked workflows.
        - Separates production revenue from announcements.
        - Customer calls and contract review.
      - - Cap table and preferences
        - >-
          Liquidation preference stack, secondary/tender terms, anti-dilution, side letters, and investor control
          rights.
        - Determines common-equity upside and downside protection.
        - Legal review of financing documents.
      - - Partner concentration
        - Revenue, validator, governance, and implementation dependence by institution.
        - Clarifies whether systemic partners are customers, channels, investors, or competitors.
        - Management KPI pack and partner interviews.
      - - Token and network economics
        - Canton Coin incentives, fees, treasury exposure, compliance controls, and accounting treatment.
        - Crypto-token economics can change valuation and risk.
        - Token model memo and legal/accounting review.
      - - Competitive routing
        - Evidence of GS DAP, Kinexys, Fnality, Securitize, or other platforms winning the same workflows.
        - Prevents over-crediting partner logos that also represent alternatives.
        - Win/loss analysis and competitor reference calls.
      - - Regulatory readiness
        - >-
          Regulator engagement, market-infrastructure approvals, privacy model validation, and operational resilience
          testing.
        - Institutional rails cannot scale without governance and regulatory acceptance.
        - Outside counsel, compliance, and customer risk reviews.
      - - Exit plan
        - IPO readiness roadmap, audit timeline, board/governance maturity, and strategic-acquirer constraints.
        - Exit route determines hold period and return requirements.
        - Board deck review and banker/comparable liquidity analysis.
    notes: >-
      These asks are the minimum package required before upgrading the recommendation at or near the current headline
      valuation.
    claimRefs:
      - CV029
      - CV030
