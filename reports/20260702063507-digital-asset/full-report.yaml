        - label: Off-ledger integration
          detail: Enterprise services integrate through JSON API, TypeScript bindings, and app-specific automation.
          components:
            - HTTP JSON API
            - TypeScript bindings
            - operator services
        - label: Participant and validator nodes
          detail: Institutions host parties, validate views, manage keys, and connect to synchronizers.
          components:
            - participant node
            - validator node
