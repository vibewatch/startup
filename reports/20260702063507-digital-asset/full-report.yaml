  - id: FE001
    title: Product architecture map
    type: stack
    layout: wide
    summary: >-
      Digital Asset’s architecture layers Daml application logic over participant infrastructure and synchronization
      domains, with the Global Synchronizer and Canton Coin forming the public-network layer.
    data:
      layers:
        - label: Institutional applications
          detail: Treasury tokenization, collateral mobility, repo financing, settlement, registry, and wallet workflows.
