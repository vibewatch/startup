  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              Digital Asset deserves an investment-committee hearing, but the price-sensitive answer at the June 2026
              mark is research-more, not buy. The company now has rare evidence for an institutional blockchain
              infrastructure thesis: a fresh $355 million financing led by a16z crypto, a reported $2 billion valuation,
              and public workflows with DTCC, Tradeweb, Broadridge-linked repo activity, and other market-infrastructure
              names. That evidence justifies taking the company seriously as a potential category winner. It does not
              yet justify underwriting the round as obviously cheap because public sources still do not disclose
              revenue, ARR, gross margin, customer concentration, or the economics of Canton Coin and network fees. The
              entry bar should therefore be explicit: keep the company on a priority watch list, require at least 3x net
              upside before a new buy recommendation, and do not treat strategic investors as a substitute for audited
              monetization evidence.
