      - number: '2.3'
        title: Buyer segmentation and adoption path
        blocks:
          - type: paragraph
            body: >-
              The buyer map is multi-stakeholder because the user, payer, and risk approver are rarely the same person.
              Banks and dealers care about intraday liquidity, repo, securities financing, and collateral optimization,
              but spend may sit with markets technology, operations, treasury, or enterprise transformation. CSDs and
              market infrastructures care about preserving custody and settlement relevance as securities
              representations move on-chain. Asset managers and tokenized-fund issuers see distribution and product
              utility, while custodians and transfer agents need safekeeping, permissioning, reporting, and control.
              Crypto-native liquidity providers and stablecoin issuers may be important settlement or liquidity
              partners, but they are not the only budget owners. This segmentation explains why adoption can be slow
              even when the ROI story is attractive: a production rail often requires asset issuance, cash-leg
              integration, custody and compliance integration, market liquidity, and multi-party legal signoff. Canton's
              visible proof points in on-chain U.S. Treasury financing, DTCC-custodied Treasury tokenization plans, and
              collateral mobility fit the buyer segments where coordination is painful but value is clear.
