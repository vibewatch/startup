  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: 'Product definition: Daml applications on a privacy-preserving Canton network'
        blocks:
          - type: paragraph
            body: >-
              The product should be underwritten as a stack for regulated multiparty workflows, not as a generic
              tokenization vendor. At the base is Daml, a smart-contract language and application model that lets
              developers encode parties, rights, obligations, signatories, observers, choices, and authorization into
              shared business processes. The value proposition is strongest where several institutions need a common
              state machine but cannot expose every detail of their transactions to every other network participant.
              Canton supplies the ledger implementation and synchronization architecture around that model. Digital
              Asset’s own platform documentation explicitly combines the Daml language and SDK, enterprise-grade Canton
              nodes and synchronizers, and composable modules for financial use cases. That means a buyer is effectively
              adopting a programming model, a node-operating model, and a network-connectivity model. The useful product
              lens is therefore: Daml defines the workflow, participant or validator infrastructure hosts parties and
              app logic, synchronizers sequence and mediate commits, and the Global Synchronizer plus Canton Coin
              provide public-network coordination and incentives where the workflow needs broader interoperability.
