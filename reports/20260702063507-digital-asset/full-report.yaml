      - number: '8.2'
        title: Thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The core thesis is that Digital Asset may be building the privacy-preserving network layer that lets
              regulated financial institutions move tokenized cash, collateral, and securities without exposing
              sensitive bilateral activity on a fully transparent chain. That thesis is not just conceptual: DTCC,
              Tradeweb, and Broadridge-related evidence shows workflows near the heart of Treasury financing and
              collateral movement. The anti-thesis is equally material. Public announcements still read more like
              milestone proof than a transparent revenue model, and several backers or partners also sponsor adjacent
              platforms. Canton’s selective-transparency design can be exactly what banks need while still leaving
              crypto-native liquidity, governance, and token economics less certain. The result is an attractive
              company-quality score but a bounded valuation score. An investor should pay for proof of production
              revenue, not merely for the prestige of the partner list.
