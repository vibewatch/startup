        title: Comparable frame and exit readiness
        blocks:
          - type: paragraph
            body: >-
              The comparable set supports the possibility of large outcomes but does not prove Digital Asset is
              underpriced. Fireblocks and Chainalysis show that private digital-asset infrastructure companies can
              achieve multi-billion valuations when the market believes infrastructure demand is durable. Circle and
              Coinbase show that public-market crypto infrastructure can support much larger equity values, but those
              companies have clearer disclosed revenue models and liquid securities. Ondo is a useful token-market
              reference yet should not be treated as an equity comparable. Fnality and Securitize show that bank-backed
              settlement and tokenization infrastructure can raise strategic capital, while Ripple shows that scaled
              crypto-finance platforms can access very large strategic liquidity. For Digital Asset, IPO readiness
              requires audited scale and governance neutrality; strategic M&A is plausible but complicated by
              market-infrastructure neutrality and partner competition.
