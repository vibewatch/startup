            body: >-
              Canton 的技术差异化来自它拆解交易的方式。参与方用同一笔 Daml
              交易的不同视图准备确认请求，并且只接收与自身主体有关的子交易。排序器对加密消息排序并交付给目标接收方；调解器在只能看到盲化交易内容的情况下汇总响应；拓扑管理和确认政策定义谁可以连接、谁必须确认。这给网络带来一种隐私和最终性画像，结构上不同于每个验证者都看到完整交易的透明公链。它也制造了运营复杂度。机构必须运营或接入参与方
              / 验证者基础设施，管理密钥，通过 API 集成链下服务，并理解同步器选择。文档异常详细，因此架构可信；但尽调姿态应该清醒：可靠性、密钥管理、跨域运营和生产监控都是核心实施议题，不是事后补丁。
