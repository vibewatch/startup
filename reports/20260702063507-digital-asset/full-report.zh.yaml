      - 威胁
      - 严重性
      - 缓释措施 / 尽调问题
    rows:
      - - 默认隐私的 DAML 子交易模型
        - Hyperledger Fabric 通道和未来 EVM 隐私工具可能逐步缩小技术差距
        - 中
        - 未来 2-3 年，将 DAML 的隐私保证与 Fabric-X 及新出现的隐私保护型 EVM rollup 做基准对比
      - - Global Synchronizer 网络效应（~30 个超级验证者，~600 个生态参与方）
        - DTCC 正在与 50+ 家相同公司建设竞争性代币化服务，可能把生产量拉向第二张网络
        - 高
        - 跟踪 DTCC 2026 年 10 月商业化发布是否会从 Broadridge DLR 等基于 Canton 的应用分走交易量
      - - 实时生产量锚点（Broadridge DLR ~$348B/day）
        - 集中在一个旗舰应用；Broadridge 放缓或转向多轨并行，可能大幅削减 Canton 对外披露的总量
        - 高
        - 在把 Canton 汇总量视为多元化前，先取得按应用拆分的交易量，而不只看全网总量
      - - 监管级治理（Canton Foundation 由 DTCC 和 Euroclear 共同担任联席主席）
        - 治理联席主席同时推进竞争项目，会稀释治理护城河的排他性
        - 中
        - 厘清 Canton Foundation 联席主席与各自竞争平台之间的合同或董事会层面利益冲突条款
      - - 通过战略投资获得多链可选性（例如 2026 年 HQLAx 持股）
        - 持有相邻平台股权会模糊竞争者 / 合作伙伴边界，且未必转化为排他商业条款
        - 低-中
        - 确认 Digital Asset 对 HQLAx 的投资是否包含商业排他权，还是只有董事会观察权
      - - 相对商品化桥接的互操作性定位
