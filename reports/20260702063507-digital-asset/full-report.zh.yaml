  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：机构级轨道，不是泛化 crypto
        blocks:
          - type: paragraph
            body: >-
              对 Digital Asset 做尽调时，市场应界定为资本市场的机构级区块链基础设施，而不是整个加密资产经济。应纳入的工作流，是 Canton
              有可能真正发挥作用的地方：受监管资产代币化、交易后记录同步、抵押品移动、回购或美国国债结算支持、代币化现金腿连接，以及为不能在完全透明散户式网络上运营的机构嵌入许可化合规控制。这样界定，市场就贴近 Digital
              Asset 通过 Canton、抵押品流动、DTCC 美国国债代币化和链上美国国债融资公开强调的工作流。这个边界也避免了常见 TAM 错误。稳定币、CBDC、投机性交易所成交量、挖矿、NFT
              和消费者钱包，可能是相邻赋能项或现金腿，但除非挂接到机构证券、抵押品或结算工作流，否则不应计入 Digital Asset 的直接市场价值。现状替代方案仍然强大：传统
              CSD、托管机构、银行内部账本、对账、三方回购基础设施，以及现有市场数据或运营供应商，已经解决了这项工作的一部分。因此，这个市场最好被理解为既有金融基础设施的替代层、扩展层或同步层，而不是一个独立的加密平台类别。
