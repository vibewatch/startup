  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户细分与真正采纳 Canton 的主体
        blocks:
          - type: paragraph
            body: >-
              Digital Asset 看起来并不是面对大量小客户的宽口径横向 SaaS 厂商。公开可见的客户群集中在受监管的金融市场基础设施，
              以及相邻的批发型工作流：这些场景里，本来就会相互交易、结算、托管或融资资产的机构，需要共享账本来解决协同问题。 也就是说，买方、用户和受益方往往不是同一方。DTCC 或 Euroclear
              这样的市场基础设施可以塑造标准和治理；银行和 交易商可以用工作流融资或调拨抵押品；资产管理人和代币化基金发行人可以供给资产；Circle 或 Hashnote 可以提供 现金腿或带收益的抵押品腿；托管机构或
              CSD 可以把法律所有权接到链上表示。地域分布也沿着同一逻辑展开。美国国债 和 DTCC 工作流支撑美国案例；Euroclear、LSEG、Euronext、Archax 以及英国金边债 /
              欧洲债券显示欧洲和英国； Nomura、Mizuho 与 JSCC 提供 APAC 概念验证证据。若投资假设是机构基础设施，缺少零售或 SMB 证据并非弱点， 但这也意味着任何关于客户数量的表述都必须克制。
