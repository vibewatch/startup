  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义：隐私保护型 Canton 网络上的 Daml 应用
        blocks:
          - type: paragraph
            body: >-
              应把产品承销为面向受监管多方工作流的技术栈，而不是泛化代币化供应商。底层是
              Daml：一门智能合约语言和应用模型，让开发者把参与方、权利、义务、签署方、观察方、选择权和授权编码进共享业务流程。价值主张在这类场景最强：多家机构需要共同状态机，但不能把每笔交易的所有细节暴露给网络中的每个参与方。Canton
              围绕这个模型提供账本实现和同步架构。Digital Asset 自己的平台文档明确把 Daml 语言和 SDK、企业级 Canton
              节点与同步器，以及面向金融用例的可组合模块放在一起。也就是说，买方实际上在采用一个编程模型、一个节点运营模型和一个网络连接模型。更有用的产品视角是：Daml
              定义工作流；参与方或验证者基础设施承载各方和应用逻辑；同步器排序并调解提交；当工作流需要更广泛互操作性时，Global Synchronizer 加 Canton Coin 提供公有网络协调和激励。
