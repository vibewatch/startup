  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图：同类公司、既有方案、相邻玩家与内部自建
        blocks:
          - type: paragraph
            body: >-
              Digital Asset 的 Canton Network 竞争对象分布在七个不同类别，而不是一个单一对手。直接的许可型 DLT 同类包括 R3 的 Corda、Axoni 的 AxCore，以及
              ConsenSys Quorum 与 Kaleido；这些方案都用私有账本建模多方机构工作流。最清晰的既有方案是 Hyperledger Fabric，这是一个免费、由 Linux Foundation
              治理的框架，已经部署在银行、供应链、医疗和政府场景；其较新的 Fabric-X 子项目瞄准的，正是 Canton 追求的高吞吐 CBDC 和代币化用例。相邻基础设施供应商——面向受监管代币化现金结算的
              Fnality、面向抵押品流动的 HQLAx、面向受监管基金发行的 Securitize，以及面向公链代币化美国国债的 Ondo Finance——并不与 Canton
              全栈正面竞争，但占据同一机构代币化价值链的若干环节；在 HQLAx 这个案例里，Digital Asset 本身又在 2026 年成为战略投资者，模糊了竞争者和伙伴的边界。Chainlink 的
              Cross-Chain Interoperability Protocol 已接入 SWIFT 约 11,500
              家银行的消息网络，为机构提供了一条替代路径：不采用完整许可网络，也能实现跨链结算。最重要的现状替代方案是内部自建：JPMorgan 的 Kinexys 平台完全由 JPMorgan
              自有资产负债表出资，累计处理量已超过 $1.5 trillion，并同时把 JPM Coin 结算放在 Coinbase 的 Base 网络和 Canton 上，说明即便 Canton
              自己的机构用户也在跨轨道对冲。结构上最尴尬的新入局者是 DTCC：它共同主持 Digital Asset 自己的 Canton Foundation 治理机构，同时又单独建设一个竞争性的 DTC
              代币化服务，由超过 50 家公司的 Industry Working Group 支持——Digital Asset 本身也被列为参与方——目标是 2026 年 7 月有限上线、2026 年 10
              月商业推出。Hedera Hashgraph 由 35+ 成员理事会治理，提供公有网络和私有 HashSphere 部署，信任模型与 Canton 完全许可化设计不同。合在一起看，Canton
              同时承压于几股力量：转向公链的较小直接同类、免费的开源既有方案、资金充足的相邻专家、借力现有银行消息轨道的互操作性替代方案，以及最显眼的——自己的治理伙伴和旗舰客户也在建设平行基础设施，而不是只押注
              Canton。
