chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品范围与运营足迹
        blocks:
          - type: paragraph
            body: >-
              Digital Asset 目前公开呈现的身份，比泛化的加密基础设施公司更窄，也比单一开发者工具厂商更宽。官网、产品页和 Daml
              材料都指向同一个命题：公司想提供机构级区块链基础设施，让受监管金融机构在共享网络上交易，同时不把敏感数据暴露给所有人。这个表述很关键，因为它把商业故事直接扣到资本市场的真实买方问题：机构之间需要隐私、控制权和互操作性，但又不愿依赖面向散户的开放式区块链。公开材料也说明，公司不再只推一门语言或一个研究项目。Daml
              仍是开源、面向开发者的资产，但运营叙事已经转向 Canton 这个共享网络，以及代币化、抵押品流动、结算和数字现金等打包用例。办公足迹进一步说明，Digital Asset
              是按全球金融基础设施公司来销售，而不是本地开发者创业公司。公司列出的办公室包括纽约、伦敦、苏黎世、布达佩斯、悉尼和香港，2025-2026
              年的重大公告也从纽约及其他金融中心发布。谨慎结论是：公开材料里，纽约是功能性总部；公司同时维持多区域交付和客户互动模式。这个判断足以支撑后续关于市场、客户和风险的章节，同时不夸大公司没有披露的私有指标。
