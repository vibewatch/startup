      - number: '3.3'
        title: 能力、定价、GTM 与信任 / 监管姿态
        blocks:
          - type: paragraph
            body: >-
              按核心购买标准看，Canton 的 DAML 语言提供子交易级、默认隐私的多方权利义务建模；Hyperledger Fabric 较粗的通道式隐私，或基于 Solidity/EVM
              的平台，都无法原生复制这一点。OpenZeppelin 的独立安全研究也佐证，这套架构已经支撑近 600 个生态参与方和超过 $6 trillion 的链上现实世界资产。竞争者的监管参与路径差异很大：DTCC
              的代币化服务和 HQLAx 都在扩张前拿到明确的 SEC 不采取行动函（分别是 2025 年 12 月和 2026 年 5 月），而 Canton 自己的旗舰应用——Goldman Sachs 的 GS DAP
              和 Broadridge 的 DLR——已经跑出大规模实时生产量，却没有针对其具体用例的同等公开不采取行动救济。这说明，如果某个资产类别上竞争方案的监管路径更清楚，机构也可以绕开 Canton。Chainlink
              的 CCIP 已与 SWIFT 约 11,500 家银行的消息网络集成，并覆盖超过 60 条区块链，GTM 动作完全不同：它不是要求机构采用新的基础账本，而是让机构在已使用的基础设施上增加跨链结算能力；2026
              年 1 月与 BNP Paribas、Intesa Sanpaolo 和 Societe Generale 旗下 SG-FORGE 的款券对付试验就是证据。定价方面，整个类别都不透明：Digital
              Asset、R3、Axoni、Fnality 以及 DTCC 即将推出的服务均不公布标价；即便 Hedera 披露的公有网络交易费约 $0.0008，也不能外推到其私有 HashSphere
              部署层，买方在所有案例里都只能在有限公开基准下谈判定制商业条款。分销和信任姿态也有分化：JPMorgan 的 Kinexys 和 DTCC 的代币化服务都依托几十年来积累的存量受控客户关系（分别是
              JPMorgan 自己的机构客户群和 DTCC 超过 $114 trillion 的既有托管关系），无需从零建立信任。这种结构性 GTM 优势，不是 Canton 或较小直接同类只靠治理委员会设计就能完全复制的。
