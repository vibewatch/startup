              最终立场是继续研究，信心中等、风险高，估值观点介于偏贵到公允之间。这个结论刻意比普通的跟踪建议更严格，因为公司重要到现在
              就值得尽调，但公开证据还不完整，无法按头条价格买入。尽调包应聚焦收入质量、伙伴到合同的转化、股权结构、治理中立性和监管约束。
              击穿论点的触发条件应在管理层会议前设好，而不是会后再补。若旗舰工作流无法证明付费生产使用、内部轮偏好权很重，或有证据显示伙伴
              通过自有平台拿走经济性，就应强制否决或大幅重定价。反过来，经审计的经常性收入、干净融资条款，以及跨竞争机构的中立治理，将 足以支持重新审视建议。
