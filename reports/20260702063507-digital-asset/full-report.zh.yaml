      - number: '1.2'
        title: 领导层历史、创始人现实与资本结构
        blocks:
          - type: paragraph
            body: >-
              领导层证据在这里尤其重要，因为公众对 Digital Asset 的记忆仍过度绑定 Blythe Masters，而低估了当前运营班底。保留来源支持一条更清晰的时间线：Digital Asset 成立于 2014
              年，Yuval Rooz 有据可查地是联合创始人；独立报道显示，在 Masters 于 2018 年底离任后，他于 2019 年 3 月成为常任 CEO。这意味着 Masters 是重要的早期 CEO
              和信誉催化剂，但不是唯一应该定义当前公司的创始人级人物。About 页面上可见的公开高管阵容同样重要。Eric Saraniecki 和 Shaul Kfir 仍是带有创始人关联的技术或网络战略人物，Kelly
              Mathieson 和 Emnet Rios 则显示出机构市场和财务深度。Jonathan Isaac 2025 年出任
              CMO，也是一个信号：公司认为自己正从专业基础设施供应商，走向更广泛的生态扩张。资本记录也显示，故事重心已经从早期 Daml 转向 Canton。公开可重建的融资包括 2021 年超过 $120 million
              的 Series D、2025 年 6 月的 $135 million 战略轮、2025 年 12 月报道的 $50 million 战略轮，以及 2026 年 6 月由 a16z crypto 领投、估值约
              $2 billion 的 $355 million 轮。即便不计更早的 Series A、B、C，仅这些披露轮次就意味着 2021 年以来至少融资 $660
              million。这对一家私有基础设施公司是严肃的资本底座，但不能替代股权结构透明度或审计经济性。
