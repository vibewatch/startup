  - id: TV005
    title: 论点失效和终止触发器表
    columns:
      - 触发器
      - 阈值
      - 对论点的传导
      - 行动含义
    rows:
      - - 没有付费生产转化
        - 尽调期后，旗舰工作流仍停留在试点或未付费实施。
        - 从机构背书跳到可变现网络经济性的逻辑失效。
        - 不投资；只有看到付费使用证据后再看。
      - - 伙伴掌握经济性
        - Goldman、JPMorgan、银行或市场基础设施主要通过自有平台导流经济性。
        - 削弱 Digital Asset 对价值捕获的控制。
        - 要求更低入场估值或合同收入分成。
      - - 优先权过重的融资
        - 2026 年或之后融资带有高级优先权、激进反稀释或内部人结构。
        - 账面 $2B 投后估值会高估普通股价值。
        - 按清算分配瀑布重定价；若普通股上行被封顶则回避。
      - - 监管或治理约束
        - 隐私保护型结算或抵押品工作流无法通过必要治理、合规或监管门槛。
        - 阻断机构网络扩张。
        - 暂停，直到批准和治理模型有文件证明。
      - - ASX 式实施重置
        - 主要客户项目在实施审查后被取消、重建或大幅延迟。
        - 表明市场基础设施迁移风险被低估。
        - 转为回避，除非估值重置。
      - - 代币化经济性落空
        - 交易量增长，但流动性、抽佣率或费用捕获仍可忽略。
        - TAM 叙事没有变成收入。
        - 不承销 TAM 溢价；等待经济性证据。
    notes: 触发器被设为尽调前决策规则，避免建议被叙事动量带偏。
    claimRefs:
      - CV010
