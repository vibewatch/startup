      - number: '6.4'
        title: 扩张、集中度、采购摩擦与负面客户证据
        blocks:
          - type: paragraph
            body: >-
              Digital Asset 的客户扩张飞轮有吸引力，因为同一张网络可以从一种资产和一组交易对手，延展到相邻用例：从代币化 美债到回购，从回购到抵押品复用，再到代币化存款、稳定币、货币市场基金、跨境结算和 24/7
              流动性。伙伴主导 分销同样重要。DTCC、Euroclear、Tradeweb、Broadridge、Circle、LSEG 和大型交易商已经掌握 Digital Asset
              需要的买方关系。风险在于，同一结构也会制造集中度和采购摩擦。少数系统性机构贡献了大部分公开证据；任何交易后、 托管、抵押品或受监管现金的实施，都要通过法律终局性、数据隐私、治理、韧性和内控审查。因此，ASX
              的负面历史不是 脚注。基于 DLT 的 CHESS 替代项目曾暂停并重新定界，巨额成本被终止确认，后续还就误导性进度陈述向 ASIC 作出 承认。上述历史并不否定 Canton
              当前势头，但它清楚提醒我们：市场基础设施客户可能推进很慢、曝光很高、成本很贵， 一旦交付失误也非常不宽容。
