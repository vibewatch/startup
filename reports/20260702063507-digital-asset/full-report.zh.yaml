              采用轨迹强于单一试点，但弱于公开收入队列。Canton 从一个小型机构群体起步，经过 2024 年披露节点和交易数量的 抵押品试点，到 2025 年中接近 400 个生态参与者；2026 年报道又称生态参与者超过
              700 个。关键细节是，700+ 是生态参与者数量，不是付费客户数量。比头条数字更有说服力的是工作组里程碑的反复推进：最初的链上美国国债融资、
              五笔引入更广稳定币流动性的协同交易、跨资产和跨币种的跨境日内回购、代币化英国金边债回购，再到 2026 年 7 月实时美债交易。这些连续阶段说明联盟有粘性，也说明学习速度快。它们仍未披露
              NRR、流失率、续约条款、客户级 使用量或满意度。最稳妥的尽调姿态，是把重复参与视为留存代理指标，同时在承销持久收入前要求公司提供非公开客户健康证据。
