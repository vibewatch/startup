  - id: TU005
    title: 扩张与集中风险表
    columns:
      - 扩张驱动因素
      - 集中度 / 摩擦风险
      - 影响
      - 尽调路径
    rows:
      - - 从美债代币化延伸到回购和抵押品复用
        - 可见的美国验证主要由 DTCC、Tradeweb 和少数交易商主导。
        - 若 DTCC 服务带动更广泛 DTC 参与方，上行空间高；一旦推广停滞，下行风险也高。
        - 索取 DTCC 推广计划、参与方储备、目标交易量和 Digital Asset 商业条款。
      - - 抵押品流动性延伸到英国国债、欧洲债券、黄金和代币化存款
        - Euroclear / LSEG / Euronext 阶段重要，但尚未披露是否转化为经常性生产收入。
        - 可把 TAM 扩到欧洲和英国，但会拉长采购和法律审查。
        - 验证生产路线图、法律最终性分析和已签承诺。
      - - 通过 USDC、USYC、代币化存款和 DiSH 接入现金腿
        - 依赖外部发行方，也依赖监管对代币化现金工具的接受度。
        - 提升结算效用，但引入交易对手和监管依赖。
        - 审查发行方协议、储备 / 托管结构、司法辖区限制和费用流。
      - - 交易商和流动性提供方参与
        - 流动性依赖一小撮高交易量做市商，如 Citadel、Virtu、DRW / Cumberland 和 SocGen。
        - 能带来网络流动性，但若激励或市场结构变化，流动性可能走弱。
        - 询问活跃参与方数量、交易集中度和激励安排。
      - - 通过 Broadridge、Tradeweb、DTCC、Euroclear 和 Circle 做伙伴分销
        - Digital Asset 可能被嵌在合作伙伴品牌背后，直接定价权和客户归属受限。
        - 能加速采用，但可能压缩经济收益或数据可见度。
        - 索取伙伴合同、收入分成、数据权利和终端客户归属条款。
      - - 系统重要性基础设施部署
        - ASX 的历史表明，DLT 替换项目可能暂停、重定范围，并触发监管审查。
        - 即便当前客户名单强，采购和交付风险仍决定投资判断。
        - 要求项目实施复盘、独立保证、验收标准和交付治理证据。
    notes: 风险偏战略和采购维度；公开来源未披露大客户收入集中度。
