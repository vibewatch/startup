      - number: '3.2'
        title: 竞争者画像：规模、融资与战略方向
        blocks:
          - type: paragraph
            body: >-
              这一组公司的规模和资本化水平差异极大。Axoni 历史上是 Canton 最接近的直接同类之一，总共八轮只融资 $110 million，最近披露轮次是 2023 年 4 月 $20 million 的
              Series B，2024 年 12 月约 40 名员工——与 Digital Asset 2026 年 6 月由 a16z crypto 领投、估值约 $2 billion 的 $355 million
              轮相比只是零头。R3 走的是根本不同的战略方向：它没有扩张 Canton 式许可网络，而是把 Corda 协议转向 Solana-native、可公开组合的 RWA 收益金库，瞄准私募信贷和贸易融资，计划
              2026 年上半年上线，已有超过 30,000 个机构预注册；与此同时，R3 爱尔兰办公室 2024 年员工数从 54 人降至 40 人，并在 2025 年 11 月启动进一步重组。相比之下，Fnality 在
              2025 年 9 月完成更大的 $136 million Series C，投资方横跨 WisdomTree、Bank of America、Citi、DTCC、Euroclear、Goldman Sachs 和
              UBS，并把受央行监管的 Sterling Fnality Payment System 扩展到新币种——这是深耕一个受监管细分（代币化现金结算），而不是广泛竞争 Canton 的资产代币化范围。HQLAx
              的战略方向现在部分缠绕进 Digital Asset 自己的路径：它作为独立抵押品流动平台多年运营，2025 年 6 月已在 Eurex Clearing 上线，并通过 2026 年 5 月 SEC
              不采取行动函获得有限美国准入；随后它在 2026 年接受 Broadridge 和 Digital Asset 投资，各自董事席位仍待监管批准。JPMorgan 的 Kinexys 和 DTCC
              即将推出的代币化服务代表相反战略姿态——大型既有机构用自有资产负债表建设专有基础设施，而不是向外部 VC 融资；DTCC 明确瞄准 Russell 1000、ETF 和美国国债等资产类别，这些正是
              Broadridge 的 DLR 和 DTCC 自己美国国债试点等 Canton 应用已经触达的范围。Figure Technology Solutions 现已在 Nasdaq 上市，其基于
              Provenance 的消费借贷市场在 2026 年一季度报告 $167 million 净收入和 $45 million 净利润，证明范围更窄的代币化策略，可能比宽泛的资本市场平台打法更快达到上市公司盈利。
