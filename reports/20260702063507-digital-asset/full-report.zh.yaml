  - id: TP003
    title: 定价 / 打包对比
    columns:
      - 厂商 / 平台
      - 价格 / 合同模式
      - 包含能力
      - 折扣 / 未知项
      - 对买方的影响
    rows:
      - - Digital Asset / Canton
        - 企业许可，加 Super Validator / 参与方费用结构；具体标价未披露
        - DAML 工具、隐私账本、Global Synchronizer 接入
        - 费用结构未公开拆项
        - 买方必须谈判定制商业条款；公开价格发现有限
      - - R3 Corda protocol（协议）
        - 预计通过 Solana 金库机制收取协议级费用；尚未发布（上线前）
        - 收益金库基础设施和 RWA 分发工具
        - 上线前完整费率表未知
        - 早期评估者还无法对标总成本
      - - Hyperledger Fabric / Fabric-X
        - 免费、开源核心；仅通过托管厂商（如 IBM、Kaleido）付费
        - 完整许可型账本框架和链码工具
        - 没有许可锁定，但托管 / 支持成本因厂商而异
        - 买方可零许可费采用，再只为托管服务付费
      - - Axoni AxCore
        - 企业许可，按部署谈判；无公开定价
        - 实时数据复制和生命周期自动化工具
        - 定价完全未披露
        - 厂商规模较小，面对超大委托时定价灵活性可能更低
      - - Fnality
        - 基于参与 / 会员资格的结算系统费用；未公开拆项
        - 央行监管的批发结算、DvP 和 PvP
        - 费率表未披露
        - 买方必须先是受监管银行或支付服务提供商，才有资格接入
      - - DTCC 代币化服务
        - 预计沿用 DTCC 现有托管 / 结算费率表；代币化专项费用尚未公布
        - 撬动现有 $114T+ 托管关系
        - 收费标准将在 2026 年 10 月商业化发布前确定
        - 相比真正的新进入客户，现有 DTCC 客户的切换阻力可能更低
      - - Chainlink CCIP + SWIFT
        - 通过 SWIFT 收取网络 / 消息费，另有 CCIP 协议费；企业层级费用未公开逐项拆分
        - 跨链消息传递和互操作性，并兼容 ISO 20022
        - 费用模型未公开披露
        - 机构可能把它视为现有 SWIFT 会员资格上的增量附加项，而不是一笔新平台采购
      - - Hedera Hashgraph / HashSphere
