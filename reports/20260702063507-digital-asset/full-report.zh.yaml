  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 尽调路径 / 负责人
    rows:
      - - 收入质量
        - 经审计收入、ARR、毛利率、递延收入和产品线拆分。
        - 决定 $2B 是软件基础设施公允价值，还是叙事溢价。
        - CFO 数据室资料请求，加审计师访谈。
      - - 旗舰合同
        - DTCC、Euroclear、Tradeweb 和 Broadridge 相关工作流的已签合同、定价、使用量、SLA 和续约权。
        - 把生产收入和公告分开。
        - 客户访谈和合同审阅。
      - - 股权结构和优先权
        - 清算优先权层级、二级 / 要约条款、反稀释、附带协议和投资人控制权。
        - 决定普通股上行空间和下行保护。
        - 融资文件法律审阅。
      - - 伙伴集中度
        - 按机构拆分收入、验证者、治理和实施依赖。
        - 厘清系统性伙伴到底是客户、渠道、投资人，还是竞争者。
        - 管理层 KPI 包和伙伴访谈。
      - - 代币和网络经济性
        - Canton Coin 激励、费用、金库敞口、合规控制和会计处理。
        - 加密代币经济性会改变估值和风险。
        - 代币模型备忘录和法律 / 会计审阅。
      - - 竞争路径分流
        - GS DAP、Kinexys、Fnality、Securitize 或其他平台赢得同类工作流的证据。
        - 防止过度计入那些同时代表替代方案的伙伴背书。
        - 赢 / 输分析和竞争者参考访谈。
      - - 监管准备度
        - 监管沟通、市场基础设施批准、隐私模型验证和运营韧性测试。
        - 没有治理和监管接受，机构底层通道无法扩张。
        - 外部律师、合规和客户风险审查。
      - - 退出计划
        - IPO 准备路线图、审计时间表、董事会 / 治理成熟度和战略收购方约束。
        - 退出路径决定持有期和回报要求。
        - 董事会材料审阅，以及投行 / 可比对象流动性分析。
    notes: 这些问题是以当前或接近当前账面估值上调建议之前，必须拿到的最低证据包。
    claimRefs:
