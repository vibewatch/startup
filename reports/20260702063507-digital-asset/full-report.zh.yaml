      - number: '3.4'
        title: 切换成本、锁定、多栖与分销权力
        blocks:
          - type: paragraph
            body: >-
              DAML 源自 Haskell 的语法和多方工作流模型，确实带来切换成本：把写给 DAML 的合约迁移到 Solidity 或其他 EVM
              生态，需要重构业务逻辑，而不是简单代码翻译；所需的专业开发者技能也比广泛的 EVM 人才池更稀缺。一旦机构押注
              Canton，技术锁定和招聘成本都会上升。但买方市场呈现相反模式——持续多栖，而不是单轨锁定。JPMorgan 已经同时在 Coinbase 的 Base 网络和 Canton 上结算 JPM
              Coin；六家专业代币化平台（Securitize、Ondo、Backed Finance、Centrifuge、Hashnote 和 Plume Network）也按不同角色拆分了超过 $20 billion
              的代币化现实世界资产规模——登记发行人、基金管理人、包装股票工厂、私募信贷市场、货币市场发行方和 RWA-native 结算链——而不是让机构把委托集中到单一供应商。分销权力同样未定，而是在争夺中。共同主持
              Canton 自己治理基金会的 DTCC，正同时建设竞争性代币化服务；其超过 50 家公司的 Industry Working Group 与 Canton 既有机构名单高度重叠，包括
              BlackRock、Goldman Sachs、JPMorgan 和 Ondo Finance——Digital Asset 本身甚至也是这个 DTCC
              工作组的具名参与方，说明买方关系和治理关系已经在竞争轨道之间深度交叉。供给和伙伴准入方面，Digital Asset 的回应不只是有机建设，还包括持有相邻基础设施股权：2026 年它与 Broadridge
              一起少数股权投资 HQLAx，让 Digital Asset
              在一家竞争性抵押品流动平台中获得董事会层面的可见性，而不是让关系停留在纯粹保持距离。该投资是否带有任何商业排他性，或仅限于董事会观察权，仍未披露，也是实时尽调问题；答案决定 Digital Asset
              能在多大程度上约束 HQLAx 自己与其他轨道多栖。
