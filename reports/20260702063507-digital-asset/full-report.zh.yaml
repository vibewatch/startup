  - id: FE001
    title: 产品架构图
    type: stack
    layout: wide
    summary: Digital Asset 的架构把 Daml 应用逻辑叠在参与方基础设施与同步域之上，Global Synchronizer 和 Canton Coin 构成公共网络层。
    data:
      layers:
        - label: 机构应用
          detail: 国债代币化、抵押品流动、回购融资、结算、登记和钱包工作流。
          components:
            - DTCC roadmap
            - Euroclear collateral
            - Tradeweb financing
            - Registry/Settlement/Collateral utilities
        - label: Daml 智能合约与工具 DAR
          detail: 模板、选择、签署方、观察者、授权、代币标准包和应用模型。
          components:
            - Daml language
            - Daml SDK
            - Utility modules
            - Token Standard
        - label: 链下集成
          detail: 企业服务通过 JSON API、TypeScript 绑定和应用专属自动化接入。
          components:
            - HTTP JSON API
            - TypeScript bindings
            - operator services
        - label: 参与方与验证者节点
          detail: 机构托管参与主体、验证视图、管理密钥，并连接同步器。
          components:
            - participant node
            - validator node
            - Kubernetes/Helm
            - backups/KMS
        - label: 同步域
          detail: 定序器为加密消息排序，调解器汇总确认，拓扑管理器治理身份。
          components:
            - sequencer
            - mediator
            - topology manager
            - confirmation policy
        - label: Global Synchronizer
          detail: 连接 Canton 应用与域的公共互操作性骨干。
          components:
            - super validators
            - foundation oversight
            - Scan APIs
        - label: Canton Coin 激励层
          detail: 实用型代币经济学奖励应用构建者、用户和基础设施运营方，并销毁使用费。
          components:
            - Canton Coin
            - rewards
            - burn-mint equilibrium
    approximationNotes: 层级划分是基于公开文档的综合；不同应用和同步器的实现选择会不同。
    claimRefs:
