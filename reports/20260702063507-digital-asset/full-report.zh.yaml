          value: 660
          note: 公开口径的标准最低值
        - label: 市场 / TAM 评分
          value: 9
          note: 机构代币化和抵押品机会大
        - label: 工作流证据评分
          value: 7
          note: 参与方名称有分量，但付费生产证据未公开
        - label: 护城河评分
          value: 8
          note: 隐私和互操作性契合受监管买方
        - label: 变现证据评分
          value: 4
          note: 收入、ARR、利润率和抽成率未披露
        - label: 风险调整后估值评分
          value: 5
          note: 私有尽调厘清前，估值介于偏高到合理
    approximationNotes: 评分为 1-10 的 IC 判断；融资和估值数值是标准口径下精确的百万美元数值。
