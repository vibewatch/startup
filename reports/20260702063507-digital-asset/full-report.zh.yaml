  - id: TV002
    title: 正反论点表
    columns:
      - 论点
      - 正向证据
      - 反向论点或风险
      - 哪些证据会改变判断
    rows:
      - - 机构品类潜力
        - DTCC、Tradeweb、Broadridge 相关来源和 Canton 来源显示，国债、回购和抵押品已有工作流。
        - 生产经济性没有公开披露。
        - 旗舰工作流的已签收入、使用量、定价和续约数据。
      - - 隐私和互操作性护城河
        - Canton 为选择性透明和受监管机构需求而设计。
        - 选择性透明也可能削弱加密原生流动性和去中心化吸引力。
        - 证明机构和代币流动性提供方都在规模化使用同一套轨道。
      - - TradFi 投资人可信度
        - a16z crypto，加上 Goldman、BNP、DTCC、Tradeweb 相关机构等支持该财团。
        - 战略投资人也可能把经济性导向自有平台。
        - 合同证据表明，即使底层通道由伙伴拥有，Digital Asset 仍能捕获经济性。
      - - RWA 代币化 TAM
        - 代币化国债、抵押品、回购和结算都是大型工作流品类。
        - 只靠代币化未必能解决流动性、DeFi 适配或运营采用摩擦。
        - 已上线工作流的交易量、抽佣率和留存数据。
      - - 执行记录
        - Daml、Canton、Global Synchronizer 和伙伴公告显示，团队长期坚持技术路线。
        - ASX CHESS 历史表明，大型 DLT 市场基础设施项目可能失败或重置。
        - 当前项目的独立实施审计和生产 SLA。
      - - 资本基础
        - 2026 年 6 月融资显著改善资金续航和生态建设资源。
        - 未知清算优先权和稀释可能让账面估值失真。
        - 完整融资文件和清算分配瀑布。
    notes: 本表故意把每个正向承销点，和最可能让估值逻辑失效的原因配对。
