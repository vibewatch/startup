  - id: TM004
    title: 增长驱动因素与约束表
    columns:
      - 驱动因素 / 约束
      - 方向
      - 时间
      - 影响
      - 尽调问题
    rows:
      - - MiCA 等监管制度带来清晰度
        - 驱动
        - 当前至中期
        - 降低受监管加密资产服务和机构参与的政策不确定性。
        - 按司法辖区梳理 Canton 工作流分别属于证券、加密资产、存款还是结算服务。
      - - 24/7 结算和抵押品流动
        - 驱动
        - 已有证明点，未来数年扩张
        - 支撑回购、美债融资、日内流动性，并降低结算摩擦。
        - 按工作流量化资本、流动性和运营节省。
      - - 代币化美债和 MMF 起量
        - 驱动
        - 当前
        - 提供已上线资产滩头阵地，也证明机构配置方愿意参与。
        - 验证 AUM 能否持续、持有人质量，以及 Canton 是否能捕捉工作流价值。
      - - 可编程合规和隐私
        - 驱动
        - 当前至中期
        - 缓解机构对在开放透明链上暴露交易数据的顾虑。
        - 到目标买方的合规、法务和风险委员会验证。
      - - 冷启动流动性和网络效应
        - 约束
        - 当前
        - 只有发行不够，还要有投资者、现金腿、做市商和交易对手。
        - 索取实时交易笔数、活跃交易对手和重复使用数据。
      - - 切换和并行运行成本
        - 约束
        - 当前至长期
        - 试点成熟前，买方可能继续保留传统轨道，收入转化因此放慢。
        - 按细分市场估算实施成本、迁移时间线和双轨运行周期。
      - - 互操作碎片化
        - 约束
        - 当前
        - 资产、现金、身份、托管和合规可能分散在不同网络。
        - 评估与现金代币、托管行、CSD 和公链资产的集成。
      - - 信任和安全担忧
        - 约束
        - 当前
        - 加密相关历史会放大托管、透明度和运营风险审查。
        - 审查控制措施、安全态势、治理、保险和事件记录。
      - - 预测分歧
        - 约束
        - 当前
        - TAM 估算分散，若近期变现路径不清，估值叙事容易被抬高。
        - 统一 TAM 假设，并测算 Digital Asset 从 SAM 到 SOM 的转化桥。
      - - 私有定价和经济分成不透明
        - 约束
