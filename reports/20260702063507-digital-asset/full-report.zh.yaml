  - id: TP001
    title: 竞争对手画像表
    columns:
      - 竞争对手
      - 类别
      - 规模 / 融资
      - 目标细分市场
      - 差异化
      - 局限
    rows:
      - - R3 / Corda protocol（同业协议）
        - 直接同业（转向公链 RWA 金库）
        - 历史上由 HSBC、Bank of America、Bank of Italy、MAS 支持；Corda protocol 计划 H1 2026 在 Solana 上线，已有 30,000+ 预注册
        - 寻求 DeFi 可组合收益的贸易融资和私募信贷发行方
        - 十年 Wall Street 关系和受监管资产代币化经验
        - 正在离开 Canton 式许可型架构；重组期间，2024-2025 年爱尔兰员工数从 54 人降至 40 人
      - - Hyperledger Fabric / Fabric-X
        - 既有开源框架
        - 由 Linux Foundation / Hyperledger Foundation 治理；没有单一公司融资额；Fabric-X 知识产权于 2026 年转入 Hedera 治理委员会监督
        - 想要免费许可型框架的银行、供应链、医疗和政府机构
        - 免费、厂商中立、部署广泛；Fabric-X 瞄准 CBDC / 代币化吞吐量
        - Fabric-X 仍处孵化阶段；没有等同于 DAML 的统一默认隐私模型
      - - Axoni / AxCore
        - 直接同业（规模更小）
        - $110M，8 轮融资；最近披露轮次为 $20M B 轮（Apr 2023）；~40 名员工（Dec 2024）
        - 银行掉期 / 衍生品交易后生命周期自动化和数据复制
        - 深耕掉期市场试点；支持方包括 Goldman Sachs、Deutsche Bank、UBS、Citi
        - 资本基数和员工数远小于 Digital Asset；2023 年以来未披露大额融资轮
      - - Fnality
        - 相邻（受监管现金结算腿）
        - $136M C 轮（Sept 2025）；由 WisdomTree、BofA、Citi、DTCC、Euroclear、Goldman Sachs、UBS 支持
        - 资产代币化旁需要受监管代币化现金结算的银行
        - 央行监管的系统性结算终局性（Sterling FnPS）
        - 只覆盖现金腿，不覆盖资产代币化；仍在从 GBP 扩展到新币种
      - - HQLAx
        - 相邻（抵押品流动）和 2026 年被投公司
        - Broadridge 和 Digital Asset 于 2026 年成为战略投资方；整体规模未披露
        - 面向全球银行和 CCP（如 Eurex）的抵押品流动
        - June 2025 起在 Eurex 生产上线；May 2026 获 SEC 不采取行动函，允许有限美国接入
        - 美国参与限于 15 家机构并受成交量限制；Digital Asset 自身也是投资方，竞争 / 伙伴身份变得模糊
      - - JPMorgan Kinexys
        - 既有内部自建
        - 完全由 JPMorgan 资产负债表提供资金；累计交易量 $1.5T+，目标 $10B/day
        - JPMorgan 自有机构和企业司库客户
        - 深厚自有客户基础；JPM Coin 已同时部署在 Base 和 Canton
        - 单一银行平台，有动力把流量留在私有体系，而非开放互操作
      - - Broadridge DLR
        - 相邻（基于 Canton 的应用，不是竞争性基础层）
        - Broadridge 是上市公司；DLR 处理 ~$348B/day，同比 +392%（Mar 2026）
        - 大型银行和经纪交易商的全球回购交易台
        - 直接跑在 Canton 上，证明生态深度而非替代风险
        - 集中度风险：Canton 对外展示的交易量中很大一部分落在一个应用上
      - - ConsenSys Quorum / Kaleido
        - 直接同业（基于 EVM）
        - 私有公司；Quorum 源自 JPMorgan；规模未披露
        - 想要 EVM 兼容许可链和 CBDC 试点的企业（如 Project Agora）
        - Ethereum 工具链 / 开发者兼容性广；通过 Kaleido 托管部署
        - 默认隐私能力不如 DAML 精细；资本市场专门化程度不如 Canton
      - - DTCC 代币化服务
        - 既有机构和治理联席主席（双重角色）
        - DTCC 所有；50+ 家公司行业工作组；目标 July 2026 有限交易、October 2026 商业发布
        - DTC 现有托管客户：托管行、券商、资产管理人
        - $114T+ 既有 DTC 托管关系；已取得 Dec 2025 SEC 不采取行动函
        - 直接重叠 Canton 自身治理联席主席角色和买方名单，带来渠道冲突风险
      - - Provenance Blockchain / Figure Technology Solutions（消费信贷链上平台）
        - 相邻（消费信贷专长）
        - Nasdaq 上市（FIGR）；Q1 2026 净收入 $167M，净利润 $45M，现金 $1.5B
        - 消费和房屋净值贷款机构及贷款投资者
        - 链上最大非银行 HELOC 发起方；上市公司财务透明
        - 焦点限于消费信贷 / 贷款，而非机构资本市场结算
      - - Securitize
        - 相邻（受监管发行 / 过户代理）
        - 支持方 / 伙伴规模未披露；承载约 $3.5B 代币化资产，包括 BlackRock 的 BUIDL
        - 需要受监管美国过户代理的资产管理人
        - BlackRock、Apollo 和 Hamilton Lane 委托的默认入口
        - 定位是发行 / 合规层，不是结算网络；仍需要底层链
      - - Ondo Finance
        - 相邻 / 替代（公链 RWA 发行方）
        - ~$2.77B-$3.77B AUM/TVL；由 Pantera Capital 和 Founders Fund 支持
        - 想要链上美债 / 股票的 DeFi 原生和 TradFi 投资者
        - 占代币化股票交易量约 58-70%；与 BlackRock、JPMorgan、Franklin Templeton 合作
        - 运行在可组合公链上，信任 / 隐私模型不同于 Canton 的许可机制
      - - Chainlink CCIP + SWIFT
        - 替代（互操作层）
        - Chainlink Labs 为私有公司；CCIP 保障 $33.6B 跨链代币，2025 年转账增长 +1,972%
        - 想要跨链互操作、但不采用新基础账本的银行
        - SWIFT 约 11,500 家银行网络已能承载钱包地址消息
        - 没有 DAML 式原生隐私 / 工作流建模；提供互操作，而非结算基础设施
      - - Hedera Hashgraph / Asseto
        - 既有 / 相邻（灵活的公有 + 私有）
        - 35+ 成员治理委员会（Google、IBM、Boeing、Standard Bank）；规模未披露
        - 想在公有 Hedera 和私有 HashSphere 部署之间选择的机构
        - 治理委员会模型分散影响力；Asseto 覆盖股票、债券、基金、贷款、现金
        - 比 Canton 的 Broadridge / DTCC 生产使用更缺少机构资本市场结算量实证
    notes: >-
      规模 / 融资数据混合了公司披露总额、第三方追踪和上市公司文件，日期跨 2023-2026 年；只能作方向性参考，不能视为同一截至日。HQLAx、ConsenSys Quorum/Kaleido、Hedera
      等厂商未披露整体融资规模。
