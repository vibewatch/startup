              可比公司集合说明大结果有可能，但不能证明 Digital Asset 被低估。Fireblocks 和 Chainalysis 显示，只要市场相信基础设施
              需求持久，私人数字资产基础设施公司可以拿到数十亿美元估值。Circle 和 Coinbase 显示，公开市场的加密基础设施可以支撑大得多 的股权价值，但这些公司披露的收入模型更清楚，也有流动证券。Ondo
