companyProfile:
  summary: >-
    Digital Asset Holdings, LLC（“Digital Asset”）是一家总部位于纽约的金融基础设施公司，成立于 2014 年。公司创造了开源智能合约语言和应用平台 Daml，也推出了 Canton
    Network：一个支持隐私的公有 Layer 1 区块链，设计目标是让受监管机构在共享基础设施上交易，同时不暴露敏感数据。公司已经从以 Daml 为中心的开发者叙事，转向把 Canton
    运营成代币化资产、抵押品流动和结算的核心链上基础设施。
