      - number: '2.3'
        title: 买方细分与采纳路径
        blocks:
          - type: paragraph
            body: >-
              买方地图是多利益相关方结构，因为用户、付款方和风险审批人很少是同一个人。银行和交易商关心日内流动性、回购、证券融资和抵押品优化，但预算可能放在市场技术、运营、司库或企业转型部门。CSD
              和市场基础设施关心的是，当证券表征上链后，如何保住托管和结算相关性。资产管理公司和代币化基金发行方看到的是分销和产品效用；托管机构和过户代理则需要保管、许可、报告和控制。加密原生流动性提供商和稳定币发行方可能是重要的结算或流动性伙伴，但不是唯一预算所有者。这个细分解释了为什么即便
              ROI 故事有吸引力，采纳仍会很慢：一条生产级轨道往往需要资产发行、现金腿集成、托管与合规集成、市场流动性，以及多方完成法律签署。Canton 在链上美国国债融资、DTCC
              托管美国国债代币化计划和抵押品流动上的可见证明点，正好落在协调成本很高但价值清晰的买方细分里。
