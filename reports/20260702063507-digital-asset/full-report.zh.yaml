  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 状态 / 价值信号
      - 与 Digital Asset 的相关性
      - 局限
    rows:
      - - Fireblocks
        - 私募 Series E 轮：融资 $550M，估值 $8B。
        - 高价值数字资产基础设施参照，体现机构托管 / 钱包需求。
        - 托管 / 安全模型不同于 Canton 网络和 Daml 应用经济性。
      - - Chainalysis
        - 私募 Series F 轮：融资 $170M，估值 $8.6B。
        - 说明需求成熟后，加密基础设施数据平台也能达到数十亿美元估值。
        - 合规 / 数据收入不同于市场基础设施网络变现。
      - - Circle
        - 公开可比公司：2026 年 7 月市值约 $16.55B。
        - 稳定币基础设施和公开市场披露参照。
        - 公开公司，已披露经济性，且稳定币风险画像不同。
      - - Coinbase
        - 公开可比公司：2026 年 7 月市值约 $41.95B。
        - 流动性充足的公开加密市场基础设施基准。
        - 交易所 / 托管 / 交易模型宽得多，收入也更透明。
      - - Ondo
        - 代币市场参照：CoinGecko 显示市值约 $1.6B，FDV 为 $3.3B。
        - 接近 Digital Asset 入场估值尺度的 RWA 代币化情绪标记。
        - 代币 FDV 不是股权企业价值，也不是软件收入倍数。
      - - Fnality
        - 战略基础设施融资：£77.7M Series B 轮和 $136M Series C 轮。
        - 银行支持的结算基础设施可比对象，投资人和用户有重叠。
        - 融资规模不是估值，且 Fnality 的结算资产模型不同。
      - - Securitize
        - 战略代币化可比对象：BlackRock 领投 $47M，BUIDL AUM 突破 $1B。
        - 显示代币化平台可以把旗舰资产管理人关系转成可见 AUM。
        - AUM 和过户代理角色不同于 Canton 网络经济性。
      - - Ripple
        - 私人战略投资，估值 $40B。
        - 规模化加密金融基础设施的战略流动性上限参照。
        - 支付 / XRP 生态让它只是宽松参照，不是直接可比对象。
    notes: 本表只列举截至生成日可获得的官方、备案和市场数据来源中的部分公开可比样本；私人收入倍数和二级市场估值并不完整。
