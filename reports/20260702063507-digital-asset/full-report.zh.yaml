      - number: '2.2'
        title: 规模三角测算：当前 AUM、预测 TAM 与基础设施 SAM
        blocks:
          - type: paragraph
            body: >-
              用任何公开的长期视角看，这个市场都很大；但来源之间差异太大，给出一个宽泛 TAM 数字会误导判断。McKinsey 的中性情景是，到 2030 年代币化市值约 $2 trillion，情景区间为 $1
              trillion 到 $4 trillion。Citi 较早的 GPS 视角到 2030 年接近 $4 trillion。Ripple 和 BCG 给出更大的 2033 年视角，约 $18.9
              trillion；Standard Chartered 和 Synpulse 把时间拉到 2034 年，在贸易融资假设推动下达到 $30.1
              trillion。这些数字不能互换，因为纳入规则和终点年份不同。可观察基线要小得多。RWA.xyz、DeFiLlama、CoinGecko、Cointelegraph 和 Eco 合起来显示，2026 年当前链上
              RWA 价值为数百亿美元，代币化美国国债和货币市场基金是最可见的滩头阵地。今天数百亿美元与未来数万亿美元之间的落差并不致命；这正是尽调的核心问题。对 Digital Asset 来说，最佳 SAM
              不是代币化资产总价值，而是资本市场功能中、受监管机构需要隐私、结算最终性、抵押品流动和互操作性的工作流基础设施份额。
