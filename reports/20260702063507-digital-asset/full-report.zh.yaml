      - number: '1.3'
        title: 里程碑、机构相关性与仍未消除的限制
        blocks:
          - type: paragraph
            body: >-
              Digital Asset 的里程碑序列如今更像市场基础设施扩张，而不是加密实验。公开时间线显示：Daml 于 2019 年开源；Canton 于 2023 年启动，参与方超过 30 家；Global
              Synchronizer 于 2024 年 7 月上线；Euroclear 于 2025 年初启动抵押品流动项目；2025 年中完成 $135 million 战略轮；2025 年 8 月与 Tradeweb
              等机构跑通链上美国国债融资工作流；2025 年 12 月与 DTCC 围绕 DTC 托管的代币化美国国债建立合作；随后在 2026 年以报道估值 $2 billion 完成 $355 million
              融资。这些节点最有价值的结论，不只是大名字出现了，而是这些名字横跨基础设施运营商、交易所、交易商、资产管理公司和加密原生流动性提供商。DTCC、Euroclear、Tradeweb、Broadridge、Goldman
              Sachs 等机构，分别出现在融资、治理、试点或接近生产的场景里。这比单纯的 logo
              墙更强。即便如此，公开记录仍有明显边界。公司发布生态参与方数量和旗舰用例，但不披露审计收入、客户集中度、员工数、利润率或投标文件。架构上也存在真实的叙事取舍：Canton
              以隐私优先、公有但许可化的设计，正是受监管机构被吸引的原因；但在一些加密原生观察者眼中，选择性披露和大型机构治理不是优点，而是妥协。最后，Digital Asset
              自己的钓鱼风险提示也提醒我们，即便是面向企业的公司，只要带有加密相邻品牌，就会承受运营和声誉攻击面。因此，可发布结论应是机构相关性很强，而不是尽调精度已经完全闭合。
