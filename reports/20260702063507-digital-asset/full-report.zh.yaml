        - 回购交易台、抵押品团队、结算运营
        - 市场技术、运营、司库转型
        - 国债融资、回购、保证金、抵押品优化
        - 日内结算和抵押品流动必须带来明确的资本或流动性效率。
      - - CSD / FMI / 交易所
        - 交易后战略、托管、结算、创新
        - 结算、托管、治理、参与方服务
        - 市场基础设施技术和战略项目
        - 代币化证券托管、同步、治理
        - 资产腿和现金腿开始代币化后，需要继续成为关键基础设施。
      - - 资产管理人 / 基金发行方
        - 数字资产战略、产品、运营
        - 组合运营、过户代理、分销团队
        - 产品创新、过户代理、基金运营预算
        - 代币化货币市场基金、美债、私募基金
        - 分销触达、24/7 功用，以及链上资本需求。
      - - 托管行 / 过户代理
        - 数字托管、基金服务、资产服务
        - 托管运营、合规、报告
        - 托管技术和基金服务预算
        - 资产保管、权限控制、报告、生命周期事件
        - 客户要求代币化资产具备受监管托管与合规能力。
      - - 经纪交易商 / 流动性提供方
        - 电子交易、融资、主经纪业务
        - 执行、抵押品、流动性、风险团队
        - 交易技术和流动性项目
        - 链上抵押融资和结算腿
        - 有能力在传统市场时段之外提供流动性或融资。
      - - 加密原生结算伙伴
        - 稳定币、钱包和结算产品负责人
        - 司库、风险、集成团队
        - 产品和基础设施预算
        - 现金腿、流动性、DeFi 连接
        - 机构资产需要代币化现金和合规连接。
    notes: 买方角色基于公开工作流证据和行业结构推断；Digital Asset 精确买方预算需要做私有账户级尽调。
