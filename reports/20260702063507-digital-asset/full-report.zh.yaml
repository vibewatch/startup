              Digital Asset 的伙伴名单是优势，但本章要逆向审视。DTCC、Euroclear、Tradeweb、Broadridge、Goldman Sachs 和 J.P. Morgan
              不是被动标识；它们是市场基础设施、银行、工作流所有者，有些还是平台建设者。DTCC 和 Euroclear 验证了 Canton 论点，但它们的项目必须从规划或一期项目转成可持续的生产经济性。Broadridge
