  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入证据止步于假设
        blocks:
          - type: paragraph
            body: >-
              今天无法用公开收入披露来承销 Digital Asset
              的财务模型，因为公司不发布收入、ARR、毛利率、合同规模、收入结构或留存。公开记录支持的是假设，不是硬运营指标；这个限制会实质影响估值工作。最站得住脚的收入类别包括 Daml 和 Canton
              的企业授权或支持、实施和专业服务、托管基础设施或网络运营，以及与 Canton Network 活动或 Canton Coin
              绑定的经济性。每个类别的利润率画像不同：软件和支持可能是经常性且质量较高的收入；实施会更偏服务；代币或网络经济性取决于费用捕获、代币持有、验证者角色和会计处理。公开数据库估计更适合作为警示灯，而不是估值输入。Growjo
              和 GetLatka 发布的收入估计彼此冲突；CB Insights 显示融资细节，但公开收入只是占位。分析结论因此刻意保守：Digital Asset 可能有可观收入，但公开证据不足以用投资级精度量化。
