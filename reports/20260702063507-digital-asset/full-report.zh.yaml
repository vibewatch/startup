  - id: TV003
    title: 牛市 / 基准 / 熊市场景表
    columns:
      - 情景
      - 假设
      - 情景 EV 区间（USD M）
      - 概率信号
      - 下行触发器
    rows:
      - - 牛市
        - Canton 成为多个系统性工作流的中立结算和抵押品层；Digital Asset 捕获经常性软件、服务、网络或代币经济性。
        - 4500-9000
        - 多个旗舰伙伴转为付费生产，经审计经常性收入出现，治理保持中立。
        - 无；若证据支持至少 3x 净上行空间，则上调至买入。
      - - 基准
        - 生产相关性真实存在，但收入转化较慢；伙伴保留部分经济性，私有公司不透明度延续。
        - 1500-3500
        - 有选择性的付费部署、强劲生态增长和干净融资条款，但还没有达到公开公司标准的收入规模。
        - 在收入和股权结构尽调清楚前，维持继续研究。
      - - 熊市
        - 试点保持碎片化，伙伴平台捕获价值，代币化经济性落空，或结构化融资重置普通股价值。
        - 500-1200
        - 下轮融资风险、优先权过重的内部轮、旗舰客户延迟或监管约束。
        - 回避，或按显著低于 2026 年账面估值的价格重定价。
    notes: 区间是情景企业价值结果，不是收入倍数；公开来源披露的收入或 ARR 不足以支撑可辩护的倍数模型。
