  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险是首要负面轴线
        blocks:
          - type: paragraph
            body: >-
              最高权重的风险不是代币化违法，而是 Digital Asset 的价值主张正落在证券、大宗商品、支付、结算、MiCA 和运营韧性 制度仍在划线的交界处。SEC
              材料把核心问题说得很直接：代币化证券仍是证券，第三方代币化可能引入破产暴露等中介风险。 CFTC 材料更具建设性，但也说明，衍生品市场中的代币化抵押品仍要靠分类法、建议、倡议和试点项目来发展。欧洲不是简单
              安全港：MiCA 要求披露、授权、监管和市场诚信；ESMA DLT Pilot Regime 则把代币化金融工具视为特殊的市场基础设施 类别。Canton Coin 又叠加一层风险：其 MiCA
              白皮书披露了要约、发行人、加密资产、项目和技术风险。缓释手段包括 成熟法律顾问、许可制参与者控制和监管沟通，但在 Digital Asset 能逐产品证明关键司法辖区和资产类别的法律终局性之前，
              剩余风险仍然很高。
