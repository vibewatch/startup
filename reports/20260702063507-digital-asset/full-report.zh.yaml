      - number: '2.4'
        title: 驱动因素、约束与证据缺口
        blocks:
          - type: paragraph
            body: >-
              最强增长驱动来自监管可读性、全天候结算、抵押品效率、减少对账、可编程合规，以及机构对有收益代币化产品的需求。MiCA 和 ESMA 的实施工作重要，因为它们把部分加密资产边界变成了受监管、基于披露的制度。BIS
              和 IMF
              材料也验证了代币化货币、资产和结算基础设施的发展方向，但并没有拿走治理和安全负担。约束同样重要。代币化有冷启动问题：发行方可以先创造代币，但在足够多投资者、流动性、现金腿和中介出现之前，市场并不好用。受监管机构还必须一边保留传统轨道，一边测试新轨道，这会抬高切换成本、拖慢预算转化。互操作性是另一道门槛，因为资产、现金、身份、托管和合规可能分布在不同账本上。最后，Finextra
              的信任批评提醒我们，加密相邻供应商必须跨过托管、透明度、安全和不良行为历史带来的疑虑。尽调姿态应当建设性但受证据约束：市场真实存在，但公开来源没有披露 Digital Asset 的合同金额、转化率或经济性份额。
