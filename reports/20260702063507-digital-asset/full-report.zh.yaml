      - 可衡量或已引用收益
      - 限制
    rows:
      - - 由 DTC 托管的代币化美国国债
        - 市场基础设施希望推进代币化，同时不离开 DTC 托管和控制体系。
        - DTCC 和 Digital Asset 计划通过 DTCC ComposerX 平台铸造一个基于 Canton 的子集。
        - MVP 公开目标为 2026 年上半年。
        - 路线图价值取决于 DTCC 执行、生产范围和监管接受度。
      - - 跨机构抵押品流动
        - 抵押品被托管方、场所和应用割裂。
        - Euroclear 和 Digital Asset 推出了 Canton Global Collateral Network 计划第一阶段。
        - 公开第一阶段公告验证了抵押品流动性这个旗舰用例。
        - 未披露公开使用量或经常性收入贡献。
      - - 链上美国国债融资 / 回购
        - 融资工作流需要多家机构之间同步现金和抵押品结算。
        - Tradeweb 工作组在 Canton 上使用 USDC 现金腿和链上 UST 抵押品。
        - 引用交易在一个周末完全链上完成。
        - 单笔交易证明必须转化为可重复的生产量。
      - - Broadridge 分布式账本回购
        - 回购处理需要高量抵押品和融资工作流自动化。
        - Digital Asset 称 Broadridge DLR 基于其技术构建。
        - Digital Asset 称 DLR 每月处理超过 $1.5 trillion 回购量。
        - Digital Asset 的准确收入分成和当前 Canton 关联需要私下确认。
      - - 代币标准资产发行与钱包支持
        - 应用和钱包提供方需要通用接口来管理 Utility 持仓。
        - Registry Utility 支持 Canton Network Token Standard，并开放 token-standard 端点。
        - 面向应用提供方、钱包提供方和金融工具管理员的主网文档已经公开。
        - 采用广度没有披露为应用数量或交易群组。
      - - 结算与抵押品应用扩展
        - 定制 DvP 和抵押品工作流反复重建成本很高。
        - Settlement Utility 和 Collateral Utility 的 API 参考提供可复用构件。
        - 公开 API 页面显示，公司不只做定制咨询，也在推进模块化策略。
        - 实施复杂度和客户专属改造仍属私有信息。
