      - - 锚定伙伴流失
        - 公开路线图或合同更新
        - DTCC、Euroclear、Broadridge、Tradeweb、Goldman 或类似锚定方把核心工作流转向竞争对手或内部轨道。
        - 重新评估网络效应假设；若多个锚定方流失，则否决。
      - - 试点未转生产
        - 里程碑滑坡和转化指标
        - 旗舰项目仍停留在 MVP、一期或一次性交易，没有经常性生产经济收益。
        - 转入观察名单，或在使用证据改善前避开。
      - - ASX 式项目失败
        - 独立审查或客户公告
        - 大型市场基础设施项目在架构审查后暂停、减记或重启。
        - 除非事件孤立且财务影响不重大，否则视为投资假设破裂。
      - - 创始人 / 领导层连续性
        - 高管离任和继任披露
        - 商业化期间，创始人 CEO 或关键技术 / 网络负责人离任且没有可信继任者。
        - 暂停投资论证，等待继任尽调。
      - - 财务模型和估值
