      - number: '8.2'
        title: 核心论点与反论点
        blocks:
          - type: paragraph
            body: >-
              核心论点是，Digital Asset 可能正在搭建一层保护隐私的网络，让受监管金融机构能够转移代币化现金、抵押品和证券，而不必 把敏感双边活动暴露在完全透明的链上。这个论点不只是概念：DTCC、Tradeweb
              和 Broadridge 相关证据显示，工作流已经贴近 美债融资和抵押品流转的核心。反论点同样重要。公开公告读起来仍更像里程碑证明，而不是透明收入模型；多家支持者或伙伴也在 支持相邻平台。Canton
              的选择性透明设计可能正是银行需要的东西，但加密原生流动性、治理和代币经济性仍没那么确定。 结果就是公司质量分数有吸引力，但估值分数有上限。投资者应为生产收入证据付钱，而不是只为伙伴名单的声望付钱。
