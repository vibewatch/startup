  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: forecast-range
    missingEvidence: A reconciled forecast methodology that normalizes whether stablecoins, CBDCs, trade finance, equities,
      private assets, and infrastructure value capture are inside the market boundary.
    whyItMatters: Published estimates range from low single-digit trillions by 2030 to more than $30 trillion by 2034, so
      valuation work should not rely on a single TAM headline.
    diligencePath: Build a normalized sizing model by asset class and ask management which revenue pools Canton can actually
      monetize.
    relatedQuestionRefs:
    - QM005
    - QM023
    - QM025
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-budget
    missingEvidence: Digital Asset contract values, implementation fees, network-fee economics, pilot-to-production conversion,
      and budget-owner data by buyer segment.
    whyItMatters: Public sources support market relevance but not Digital Asset's share of market or near-term revenue capture.
    diligencePath: Request customer pipeline, ARR by use case, pricing schedules, and named account expansion histories in
      management diligence.
    relatedQuestionRefs:
    - QM013
    - QM014
    - QM025
    relatedTableRefs:
    - TM003
  - type: missing-source
    severity: material
    topic: adoption-constraints
    missingEvidence: Independent buyer interviews on switching cost, legal sign-off time, interoperability requirements, and
      trust barriers for permissioned institutional DeFi.
    whyItMatters: The market could be large but slow if each production deployment requires multi-institution coordination
      and parallel legacy operations.
    diligencePath: Interview banks, CSDs, custodians, and asset managers that have evaluated tokenized collateral or Treasury
      settlement projects.
    relatedQuestionRefs:
    - QM021
    - QM026
    relatedTableRefs:
    - TM004
