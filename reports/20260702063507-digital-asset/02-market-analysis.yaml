- id: TM002
  title: TAM/SAM/SOM or sizing lens table
  columns:
  - Publisher / lens
  - Year or horizon
  - Geography / scope
  - Value
  - CAGR or growth signal
  - Methodology
  - Confidence
  - Limitation
  rows:
  - - McKinsey tokenized assets
    - '2030'
    - Global, excluding cryptocurrencies and stablecoins
    - ~$2T central; ~$1T-$4T range
    - ~75% average CAGR assumption across asset classes
    - Asset-class wave model across funds, bonds, loans, securitization, and alternatives.
    - Medium
    - Not a direct Digital Asset revenue pool and intentionally below many earlier estimates.
  - - Citi GPS tokenization
    - '2030'
    - Global financial and real-world assets
    - Up to almost $4T
    - 80x growth factor cited
    - Broad disruptive-infrastructure scenario including CBDC context and tokenized assets.
    - Medium
    - Older 2023 lens mixes adoption narrative with adjacent digital-money themes.
  - - Ripple / BCG tokenized RWAs
    - '2033'
    - Global real-world assets
    - ~$18.9T
    - ~30x / 53% CAGR cited
    - Strategic finance-infrastructure projection focused on issuance, trading, and settlement transformation.
    - Medium
    - Partner-published report; inclusion rules differ from McKinsey and Citi.
  - - Standard Chartered / Synpulse
    - '2034'
    - Global tokenized assets including trade finance
    - ~$30.1T; trade finance 16%
    - Not stated in retained extract
    - Sector forecast emphasizing trade finance gap, access, transparency, and institutional collaboration.
    - Medium
    - Longer horizon and broad trade-finance assumptions inflate comparability with 2030 estimates.
  - - RWA.xyz / DeFiLlama current market
    - '2026'
    - On-chain RWA dashboards
    - ~$22B-$28B current RWA range across sources
    - 66% 2026 growth cited by Cointelegraph from DeFiLlama
    - Dashboard aggregation of live tokenized products and protocols.
    - Medium
    - Definitions and live values move daily; stablecoins usually excluded.
  - - Tokenized Treasuries beachhead
    - '2026'
    - On-chain Treasury / MMF products
    - ~$10B-$11B cited by 2026 coverage
    - Treasuries crossed $10B in early 2026
    - Dashboard and media triangulation around RWA.xyz, DeFiLlama, and CoinGecko.
    - Medium
    - Treasury AUM is not equivalent to infrastructure software spend.
  - - SIFMA capital-markets context
    - '2024'
    - Global fixed income and equity markets
    - Fixed income $145.1T; equity market cap $126.7T
    - Fixed income +2.4% Y/Y; equity +8.7% Y/Y
    - Industry fact-book asset-base context.
    - Medium
    - Context only; applying a take-rate directly would overstate addressable revenue.
  - - Digital Asset practical SOM
    - 2026-2030
    - Institutional workflows where Canton can win production mandates
    - Not publicly supportable
    - Unknown
    - Triangulate known Canton proof points against buyer budgets and contract economics.
    - Low
    - Requires private pricing, pipeline, and conversion data.
  notes: Values use USD trillions unless a row explicitly states billions. Rows intentionally preserve incompatible horizons
    and methodologies rather than forcing a false consensus.
