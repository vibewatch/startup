- id: sizing-triangulation
  title: 'Sizing triangulation: current AUM, forecast TAM, and infrastructure SAM'
  body: The market looks large under every published long-run lens, but the sources disagree so materially that one broad
    TAM number would be misleading. McKinsey's central case is about $2 trillion of tokenized market capitalization by 2030,
    with a $1 trillion to $4 trillion scenario range. Citi's older GPS lens reaches almost $4 trillion by 2030. Ripple and
    BCG present a much larger 2033 view of about $18.9 trillion, while Standard Chartered and Synpulse extend the horizon
    to 2034 and reach $30.1 trillion, helped by trade finance assumptions. These are not interchangeable because they use
    different inclusion rules and end years. The observed baseline is far smaller. RWA.xyz, DeFiLlama, CoinGecko, Cointelegraph,
    and Eco collectively show current on-chain RWA value in the tens of billions in 2026, with tokenized Treasuries and money-market
    funds as the most visible beachhead. That gap between tens of billions today and trillions later is not fatal; it is the
    core diligence question. For Digital Asset, the best SAM is not total tokenized asset value but the workflow-infrastructure
    share of capital-markets functions where regulated institutions need privacy, settlement finality, collateral mobility,
    and interoperability.
  claimRefs:
  - CM004
  - CM005
  - CM006
  - CM007
  - CM008
  - CM009
  - CM010
