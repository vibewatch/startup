- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Regulatory clarity from regimes such as MiCA
    - Driver
    - Current to medium term
    - Reduces policy ambiguity for supervised crypto-asset services and institutional participation.
    - Map which Canton workflows are securities, crypto-assets, deposits, or settlement services by jurisdiction.
  - - 24/7 settlement and collateral mobility
    - Driver
    - Current proof points, scaling over years
    - Supports repo, Treasury financing, intraday liquidity, and reduced settlement friction.
    - Quantify capital, liquidity, and operational savings by workflow.
  - - Tokenized Treasury and MMF traction
    - Driver
    - Current
    - Provides a live asset beachhead and institutional allocator proof point.
    - Validate sustained AUM, holder quality, and whether Canton can capture workflow value.
  - - Programmable compliance and privacy
    - Driver
    - Current to medium term
    - Addresses institutional reluctance to expose transaction data on open transparent chains.
    - Test with compliance, legal, and risk committees at target buyers.
  - - Cold-start liquidity and network effects
    - Constraint
    - Current
    - Issuance alone is insufficient without investors, cash legs, market makers, and counterparties.
    - Request live transaction counts, active counterparties, and repeat-use data.
  - - Switching and parallel-run costs
    - Constraint
    - Current to long term
    - Buyers may keep legacy rails while pilots mature, slowing revenue conversion.
    - Estimate implementation cost, migration timeline, and dual-run period by segment.
  - - Interoperability fragmentation
    - Constraint
    - Current
    - Assets, cash, identity, custody, and compliance may sit on separate networks.
    - Assess integrations with cash tokens, custodians, CSDs, and public-chain assets.
  - - Trust and security concerns
    - Constraint
    - Current
    - Crypto-adjacent history raises custody, transparency, and operational-risk scrutiny.
    - Review controls, security posture, governance, insurance, and incident history.
  - - Forecast disagreement
    - Constraint
    - Current
    - Large TAM dispersion can inflate valuation narratives without clear near-term monetization.
    - Normalize TAM assumptions and underwrite a Digital Asset SAM/SOM bridge.
  - - Private pricing and share-of-economics opacity
    - Constraint
    - Current
    - Public sources cannot isolate contract values or Digital Asset economics.
    - Request revenue by use case, network fees, implementation fees, and pipeline conversion.
  notes: Driver and constraint timing reflects public evidence as of the run date; Digital Asset-specific adoption economics
    remain private.
