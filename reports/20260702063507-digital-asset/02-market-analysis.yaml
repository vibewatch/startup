tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance to Digital Asset
  rows:
  - - Tokenized securities and funds
    - Issuance, lifecycle, transfer-agent, custody, compliance, and reporting rails for regulated assets.
    - Speculative token listings without regulated-asset backing.
    - Asset managers, banks, custodians, transfer agents.
    - Core beachhead because tokenized Treasuries and money-market funds are already live.
  - - Collateral mobility and repo
    - Shared-ledger collateral movement, securities financing, margin, valuation, and settlement workflows.
    - Pure collateral analytics that never touch settlement or asset mobility.
    - Dealers, repo desks, treasury, collateral operations.
    - Directly aligned with Canton Treasury financing and collateral-mobility proof points.
  - - Market-infrastructure synchronization
    - CSD, FMI, settlement, custody, governance, and interoperability infrastructure.
    - Single-institution ledgers with no cross-party synchronization requirement.
    - CSDs, exchanges, clearing agencies, market infrastructures.
    - High relevance because privacy-enabled synchronization is Canton's core institutional pitch.
  - - Permissioned institutional DeFi
    - On-chain asset/cash workflows with permissioning, identity, compliance, and institutional controls.
    - Retail DeFi yield farms, memecoins, NFTs, and anonymous liquidity venues.
    - Banks, regulated fintechs, stablecoin issuers, liquidity providers.
    - Relevant as an adoption layer, but not the whole market.
  - - Status-quo substitutes
    - Legacy CSDs, custodians, tri-party repo, internal bank ledgers, reconciliations, and middleware modernization.
    - 'N/A: these are alternatives rather than addressable tokenization spend.'
    - Operations, technology, risk, and treasury budgets.
    - Important because displacement requires ROI greater than switching and coordination costs.
  notes: Boundary table distinguishes direct addressable infrastructure spend from adjacent crypto activity and from incumbent
    substitutes that buyers may keep.
