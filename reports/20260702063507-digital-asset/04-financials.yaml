company:
  name: Digital Asset
chapter:
  number: 4
  title: Financials
  summary: 'Digital Asset’s public financial record is strong on capital adequacy and weak on operating disclosure: the company
    has fresh large-scale funding and multiple plausible monetization paths, but no public revenue, ARR, margin, burn, or
    runway metrics. The honest underwriting stance is to model a well-capitalized, likely burn-funded institutional infrastructure
    company until private financials prove revenue quality and token-fee capture.'
sections:
- id: section-1
  title: Revenue evidence stops at hypotheses
  body: 'Digital Asset’s financial model cannot be underwritten from public revenue disclosure today because the company does
    not publish revenue, ARR, gross margin, contract size, revenue mix, or retention. The public record supports hypotheses,
    not hard operating metrics, and that limitation materially affects valuation work. The most defensible revenue buckets
    are enterprise Daml and Canton licensing or support, implementation and professional services, managed infrastructure
    or network operations, and economics tied to Canton Network activity or Canton Coin. Each bucket has a different margin
    profile: software and support could be recurring and high quality, implementation would be services-heavy, and token or
    network economics would depend on fee capture, token holdings, validator roles, and accounting treatment. Public database
    estimates are more useful as warning flags than valuation inputs. Growjo and GetLatka publish conflicting revenue estimates,
    while CB Insights shows funding detail but public revenue placeholders. The analytical conclusion is therefore deliberately
    conservative: Digital Asset may have meaningful revenue, but public evidence does not let us quantify it with investor-grade
    precision.'
  claimRefs:
  - CI001
  - CI002
  - CI005
  - CI006
  - CI016
  - CI017
  - CI018
  - CI027
  - CI028
  - CI029
