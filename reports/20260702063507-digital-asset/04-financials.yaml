  - FI004
- id: section-4
  title: Financial verdict and diligence blockers
  body: 'The financial verdict is asymmetric: capitalization is strong and current; operating economics remain opaque. That
    is not unusual for a private infrastructure company, but it should control the underwriting stance. Public evidence can
    support a thesis that Digital Asset has credible institutional demand, strategic investor support, and multiple possible
    monetization layers. It cannot support a precise revenue multiple, margin path, CAC payback, or customer-concentration
    view. The adverse evidence is not that Canton has no economic activity; it is that network fee headlines, token price
    behavior, and permissioned-architecture debates do not automatically translate into durable Digital Asset Holdings revenue.
    A diligence process should therefore start with audited financials, customer-level ARR, revenue-recognition policy, token-economics
    accounting, implementation margins, and cash runway. Until those are supplied, the company should be modeled as well-funded
    but burn-dependent, with valuation confidence bounded by the large gap between public narrative proof and private operating
    metrics.'
