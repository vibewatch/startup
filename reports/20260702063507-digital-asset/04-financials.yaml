  - - Gross margin and services margin
    - No disclosed product or delivery margin
    - Blocks software-versus-services quality assessment
    - Request margin by software, support, implementation, managed infrastructure, and token/network line.
  - - Monthly burn and cash balance
    - Financing amounts public; cash and burn private
    - Blocks runway and next-round timing
    - Request pro forma cash after 2026 round, 13-week cash forecast, and board-approved budget.
  - - Customer revenue concentration
    - Named partners visible; revenue contribution unknown
    - Blocks concentration and strategic-investor independence analysis
    - Request top-10 ARR, customer/investor overlap, and signed commercial commitments.
  - - CAC payback and sales cycle
    - Partner-led enterprise motion visible; efficiency metrics private
    - Blocks GTM scalability assessment
    - Request pipeline conversion, sales-cycle length, quota productivity, CAC, and payback.
  - - Token fee capture and treasury
    - Network fee mechanisms and third-party fee headlines visible; company capture private
    - Blocks Canton Coin economics and accounting analysis
    - Request validator economics, token treasury, fee-capture rights, and accounting policy.
  - - Debt, preferences, and obligations
    - No public debt or preference stack disclosed
    - Blocks downside and liquidity analysis
    - Request debt schedule, liquidation preferences, side letters, and token/customer obligations.
  notes: This is the chapter’s diligence backlog; each row is intentionally framed as missing evidence rather than a negative
    finding.
