  - TI003
  figureRefs:
  - FI002
- id: section-3
  title: Capital adequacy is the clearest public strength
  body: 'The capital story is much better evidenced than the operating P&L. Financials needs local claims, so the relevant
    facts are restated here with Financials IDs: Digital Asset announced a $355 million 2026 round led by a16z crypto; independent
    reports put the round near a $2 billion valuation; the company had already raised $135 million in 2025 and more than $120
    million in 2021; and the publicly supportable post-2021 capital base is about $660 million before older rounds. This is
    not the same as disclosed cash on hand, but it is a strong adequacy signal for a private infrastructure company attempting
    to move regulated capital-markets workflows on-chain. The main nuance is deployment. The HQLAX investment shows outward
    ecosystem capital deployment, and the official round language emphasizes Canton adoption across regulated financial markets.
    Runway cannot be computed without burn and opening cash, so the right analysis is scenario capacity, not claimed months
    of runway.'
  claimRefs:
