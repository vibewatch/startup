- id: TI003
  title: Unit economics table
  columns:
  - Input
  - Public value / confidence
  - Why it matters
  - Current underwriting treatment
  - Diligence ask
  rows:
  - - ARR / revenue run-rate
    - Not disclosed; third-party estimates conflict
    - Base for valuation multiples and growth quality
    - Do not use as primary input
    - Request audited revenue bridge and ARR by product.
  - - Gross margin
    - Not disclosed
    - Separates software scalability from services-heavy delivery
    - Assume mixed margin until proven
    - Request product, services, support, and infrastructure gross margin.
  - - CAC payback / sales cycle
    - Not disclosed; GTM appears enterprise and partner-led
    - Determines sales efficiency and cash burn
    - Use long-cycle enterprise proxy only
    - Request pipeline conversion, sales-cycle length, quota capacity, and CAC payback.
  - - Implementation margin
    - Not disclosed; client experience and support teams visible
    - Can dilute software margins during deployments
    - Treat as potential margin drag
    - Request SOW margin, utilization, and partner delivery split.
  - - Cloud / validator / network operating cost
    - Not disclosed; tokenomics and security controls imply infrastructure operations
    - Affects managed infrastructure and network-fee profitability
    - Require direct cost schedule
    - Request cloud spend, validator costs, observability tooling, and security operations budget.
  - - NRR / logo retention
    - Not disclosed
    - Critical for recurring enterprise revenue quality
    - No credit until shown
    - Request cohort retention, gross retention, expansion ARR, and churn reasons.
  - - Revenue concentration
    - Unresolved; visible partners may not equal paying concentration
    - Determines fragility and next-round narrative risk
    - Carry as material gap
    - Request top-10 customer revenue and investor-customer overlap analysis.
  notes: Null values mean the metric is absent from retained public sources, not that the metric is zero.
