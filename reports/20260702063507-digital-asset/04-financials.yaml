  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: audited-financials
    missingEvidence: Audited income statement, balance sheet, cash-flow statement, and revenue-recognition policy for Digital
      Asset Holdings, LLC.
    whyItMatters: Public sources support funding capacity but not revenue quality, profitability, or working-capital needs.
    diligencePath: Request audited 2024-2026 financial statements, management accounts, revenue-recognition memo, and auditor
      correspondence.
    relatedQuestionRefs:
    - QI002
    - QI011
    - QI020
    - QI026
    relatedTableRefs:
    - TI005
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Customer-level ARR, top-10 customer concentration, partner revenue commitments, and contract duration.
    whyItMatters: Visible strategic partners may be commercial anchors, pilots, investors, or governance participants; revenue
      concentration cannot be inferred from logos.
    diligencePath: Request anonymized customer ARR schedule, signed order forms for named partners, renewal history, and pipeline-to-booking
      conversion.
    relatedQuestionRefs:
    - QI013
    - QI024
    relatedTableRefs:
    - TI001
    - TI005
  - type: private-evidence-only
    severity: material
    topic: token-economics-accounting
    missingEvidence: Digital Asset token holdings, validator rewards, fee capture, accounting policy, and any restrictions
      on Canton Coin monetization.
    whyItMatters: Network fee volume may influence enterprise value but cannot be treated as company revenue without capture
      and accounting details.
    diligencePath: Request treasury schedule, token accounting memo, validator economics model, and legal analysis of Canton
      Coin revenue treatment.
    relatedQuestionRefs:
    - QI007
    - QI008
    - QI021
    relatedTableRefs:
    - TI002
    - TI005
  - type: private-evidence-only
    severity: material
    topic: burn-runway
    missingEvidence: Opening cash balance after the 2026 round, monthly net burn, headcount plan, committed investments, and
      minimum liquidity covenants.
    whyItMatters: The latest financing is large, but runway depends on spending velocity and external capital deployment.
    diligencePath: Request board-approved budget, 13-week cash forecast, monthly burn bridge, hiring plan, and investment
      commitments after the June 2026 raise.
    relatedQuestionRefs:
    - QI004
    - QI017
    - QI025
    relatedTableRefs:
    - TI004
