tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Unit or accounting driver
  - Public value / status
  - Revenue quality
  - Diligence ask
  rows:
  - - Enterprise Daml / Canton software
    - License, subscription, or enterprise support around Daml and Canton tooling
    - Contract or seat / platform entitlement
    - Not publicly quantified
    - Potentially recurring but unpriced publicly
    - Request SKU list, ARR by product, renewal rates, and support attach rates.
  - - Professional services / implementation
    - Client design, integration, migration, and deployment support
    - Project, SOW, implementation milestone
    - Plausible from client experience and support teams; value not disclosed
    - Lower-margin and less recurring if services-heavy
    - Request services bookings, utilization, delivery margin, and implementation backlog.
  - - Canton network / Canton Coin economics
    - Traffic fees, holding fees, rewards, validator or application-provider incentives
    - Network usage, traffic credits, activity records, token rewards
    - Mechanism disclosed; Digital Asset capture not disclosed
    - Potentially strategic but accounting and token-price sensitive
    - Request fee-capture map, token treasury, validator economics, and revenue recognition memo.
  - - Managed infrastructure / network operations
    - Hosting, validator operations, monitoring, security, or managed Canton deployments
    - Managed node, environment, or usage tier
    - Not priced publicly
    - Could be recurring but cloud and security costs matter
    - Request managed-service contracts, cloud cost allocation, and uptime/SLA penalties.
  - - Ecosystem / partner-led commercialization
    - Partner implementations with DTCC, Euroclear, Tradeweb, Broadridge, integrators
    - Enterprise agreement, partner program, or revenue share
    - Partner proofs visible; economics private
    - High strategic value but concentration risk unknown
    - Request customer-level ARR, partner economics, and commercial commitments from named institutions.
  notes: The rows are revenue hypotheses supported by product, partner, and technical sources; no row is a disclosed revenue
    line item.
