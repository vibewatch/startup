- id: TI002
  title: Pricing / monetization table
  columns:
  - Monetization layer
  - List price or unit
  - Realized pricing evidence
  - Discount / unknown
  - Source-backed interpretation
  rows:
  - - Daml application platform
    - No public list price found
    - Product pages and Daml open-source page describe capability but not pricing
    - Unknown enterprise discounting and support bundles
    - Treat as negotiated enterprise software until contracts prove otherwise.
  - - Canton enterprise deployment
    - No public package price found
    - Product page frames Canton as regulated-finance infrastructure
    - Unknown minimums, term, usage ramps, and integration fees
    - Likely bespoke institutional contracts rather than simple public SaaS tiers.
  - - Canton Coin traffic / holding fees
    - Traffic fees and holding fees documented
    - Tokenomics docs describe active fee mechanisms and reward cycles
    - Digital Asset capture and accounting treatment undisclosed
    - Do not book network fees as company revenue without treasury and validator evidence.
  - - Implementation / professional services
    - SOW or milestone pricing not public
    - Careers page names client experience and technical support functions
    - Unknown services margin and utilization
    - Model as a margin drag unless management provides delivery gross margin.
  - - Managed security / infrastructure
    - No public managed-service schedule
    - Security posture implies enterprise controls and infrastructure governance
    - Unknown SLA pricing and cloud cost pass-through
    - Potential recurring layer, but cost-to-serve must be diligence-tested.
  notes: No retained source provided official list pricing; every pricing cell is a diligence placeholder rather than a quoted
    price.
