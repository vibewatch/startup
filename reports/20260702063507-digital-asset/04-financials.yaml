  - CI041
  tableRefs:
  - TI001
  - TI002
  figureRefs:
  - FI001
- id: section-2
  title: GTM and cost structure point to enterprise infrastructure economics
  body: The go-to-market motion looks like institutional infrastructure sales rather than consumer crypto or self-serve developer
    SaaS. Digital Asset publicly emphasizes partners and systems integrators, while the highest-value external proofs come
    from market-infrastructure workflows involving DTCC, Euroclear, Tradeweb, and Broadridge. That supports a long-cycle enterprise
    or consortium model in which credibility, integration work, security review, and regulatory comfort matter as much as
    software functionality. It also makes sales efficiency hard to infer. A single market-infrastructure relationship can
    be strategically powerful, but public announcements rarely distinguish paid production revenue from pilot, governance,
    investor, or ecosystem participation. The cost base is likewise more enterprise-infrastructure than lightweight SaaS.
    Public pages point to product engineering, client experience, technical support, enterprise security programs, and a six-city
    footprint. Those signals justify treating the company as R&D- and implementation-heavy, with likely deep operating investment
    while Canton adoption scales.
  claimRefs:
  - CI003
  - CI004
  - CI007
  - CI008
  - CI009
  - CI023
  - CI025
  - CI030
  - CI032
  - CI035
  - CI045
