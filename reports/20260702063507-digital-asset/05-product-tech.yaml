  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: production-reliability
    missingEvidence: Production uptime history, incident logs, throughput benchmarks, latency distributions, and recovery-time
      objectives for Canton participant and synchronizer operations.
    whyItMatters: The architecture is sophisticated, but underwriting production infrastructure requires quantitative reliability
      evidence beyond public deployment guides.
    diligencePath: Request SOC-style operations pack, internal SLOs, incident postmortems, and benchmark results from Digital
      Asset and at least two live application operators.
    relatedQuestionRefs:
    - QE020
    - QE026
    relatedTableRefs:
    - TE004
    - TE005
  - type: missing-source
    severity: material
    topic: third-party-security-assurance
    missingEvidence: Independent security audit summaries, penetration-test attestations, formal verification scope, and customer
      security questionnaires for Daml, Canton, and Splice components.
    whyItMatters: Privacy-by-design claims become much stronger when independently tested against implementation, validator,
      key-management, and upgrade risks.
    diligencePath: Request current third-party audit reports, remediation trackers, and protocol threat model reviews under
      NDA.
    relatedQuestionRefs:
    - QE020
    - QE026
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: developer-adoption-depth
    missingEvidence: Active developer count, package/download telemetry, app-count cohorts, SDK usage, support response metrics,
      and conversion from forum activity into production applications.
    whyItMatters: Open repositories and public docs prove inspectability but not broad developer adoption or repeatable ecosystem
      growth.
    diligencePath: Ask management for developer funnel metrics, GitHub contributor cohort exports, SDK telemetry, and partner
      developer pipeline by application category.
    relatedQuestionRefs:
    - QE007
    - QE027
    relatedTableRefs:
    - TE005
  - type: private-evidence-only
    severity: material
    topic: partner-roadmap-execution
    missingEvidence: Signed deployment schedules, production acceptance criteria, and revenue or usage contribution for DTCC,
      Euroclear, Tradeweb, Broadridge, and other named institutional workflows.
    whyItMatters: The chapter can verify named roadmaps and workflows, but value depends on repeatable production use and
      monetization rather than announcement quality alone.
    diligencePath: Request customer success plans, go-live checklists, post-launch metrics, and reference calls with named
      application owners.
    relatedQuestionRefs:
    - QE011
    - QE024
    relatedTableRefs:
    - TE002
    - TE005
