- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role in stack
  - Key dependency
  - Risk / underwriting question
  rows:
  - - Daml templates and choices
    - Define assets, obligations, authorization, and workflow transitions.
    - Developer skill and model correctness.
    - Are contract models independently reviewed for critical workflows?
  - - Daml-LF / packaging and SDK tooling
    - Compile, package, test, and deploy application logic.
    - Release cadence and backward-compatible upgrade path.
    - How are upgrades tested across live multi-party applications?
  - - Off-ledger services and APIs
    - Connect Daml workflows to enterprise systems, web apps, and automation.
    - HTTP JSON API, TypeScript bindings, auth, and service operations.
    - Can integrations meet bank identity, audit, and resiliency requirements?
  - - Participant / validator nodes
    - Host parties, validate views, manage state, and connect to synchronizers.
    - Node operator competence, keys, backups, monitoring, and infrastructure.
    - Do operators have production SLOs and tested recovery procedures?
  - - Sequencer
    - Orders sync-domain messages and delivers encrypted payloads to recipients.
    - Sync-domain availability and ordering integrity.
    - What are failure modes under overload or Byzantine behavior?
  - - Mediator
    - Aggregates confirmations into verdicts without seeing transaction content.
    - Confirmation policies and honest-participant assumptions.
    - Which policies are used by each live application and who bears fallout?
  - - Topology manager / governance
    - Controls identities, parties, and domain membership.
    - Governance rules and operator trust assumptions.
    - How are governance changes approved, audited, and rolled back?
  - - Global Synchronizer and Canton Coin
    - Public interoperability and incentive layer for cross-application activity.
    - Super validators, token economics, and foundation oversight.
    - Do incentives remain stable under lower-than-expected transaction activity?
  notes: Architecture rows are derived from technical documentation; risk questions identify diligence asks rather than known
    defects.
