- id: architecture-and-operating-model
  title: 'Architecture and operating model: privacy is native, but operations are not trivial'
  body: 'Canton’s technical differentiation comes from how it decomposes a transaction. A participant prepares confirmation
    requests with different views of the same Daml transaction, and participants receive only the subtransactions relevant
    to their parties. Sequencers order encrypted messages and deliver them to intended recipients; mediators aggregate responses
    while seeing blinded transaction content; topology management and confirmation policies define who can connect and who
    must confirm. This gives the network a privacy and finality profile that is structurally different from a transparent
    public chain where every validator sees the whole transaction. It also creates operational complexity. Institutions must
    operate or connect to participant or validator infrastructure, manage keys, integrate off-ledger services through APIs,
    and understand synchronizer choices. The architecture is credible because the docs are unusually detailed, but the diligence
    posture should be sober: reliability, key management, cross-domain operation, and production monitoring are first-class
    implementation topics, not afterthoughts.'
  claimRefs:
