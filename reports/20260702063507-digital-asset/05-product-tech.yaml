- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow pain
  - Digital Asset / Canton solution
  - Measurable or cited benefit
  - Limitation
  rows:
  - - Tokenized DTC-custodied U.S. Treasuries
    - Market infrastructure wants tokenization without leaving DTC custody and controls.
    - DTCC and Digital Asset plan a Canton-based subset minted through DTCC ComposerX platforms.
    - MVP was publicly targeted for H1 2026.
    - Roadmap value depends on DTCC execution, production scope, and regulatory acceptance.
  - - Collateral mobility across institutions
    - Collateral remains siloed by custodian, venue, and application.
    - Euroclear and Digital Asset launched phase one of a Canton Global Collateral Network initiative.
    - Public phase-one announcement validates collateral mobility as a flagship use case.
    - No public usage volumes or recurring-revenue contribution were disclosed.
  - - On-chain U.S. Treasury financing / repo
    - Financing workflows require synchronized cash and collateral settlement across multiple institutions.
    - Tradeweb working group used USDC cash leg and on-chain UST collateral on Canton.
    - The cited transaction was conducted entirely on-chain over a weekend.
    - Single-transaction proof must convert into repeatable production volume.
  - - Distributed ledger repo at Broadridge
    - Repo processing needs high-volume collateral and financing workflow automation.
    - Broadridge DLR is described by Digital Asset as built on its technology.
    - Digital Asset cites more than $1.5 trillion in monthly repo volume handled by DLR.
    - The precise Digital Asset revenue share and current Canton linkage need private confirmation.
  - - Token-standard asset issuance and wallet support
    - App and wallet providers need common interfaces for Utility holdings.
    - Registry Utility supports Canton Network Token Standard and exposes token-standard endpoints.
    - Mainnet documentation exists for app providers, wallet providers, and instrument admins.
    - Adoption breadth is not disclosed as app counts or transaction cohorts.
  - - Settlement and collateral application extensions
    - Custom DvP and collateral workflows are expensive to rebuild repeatedly.
    - Settlement and Collateral Utility API references offer reusable building blocks.
    - Public API pages show a module strategy beyond bespoke consulting.
    - Implementation complexity and customer-specific modifications remain private.
  notes: Use-case rows mix partner-proven workflows and documented utility modules; they should not be read as equal commercial
    maturity.
