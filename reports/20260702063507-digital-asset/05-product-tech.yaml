- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user
  - Status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - Daml smart-contract language and SDK
    - Application developers and financial-market product teams
    - Mature public docs and GitHub surface
    - Encodes rights, obligations, parties, observers, choices, and authorization in multiparty workflows.
    - Quantify active developer adoption and enterprise upgrade cadence.
  - - Daml ledger model and privacy semantics
    - Architects, compliance teams, and application designers
    - Well documented; implementation-specific assurance still needs review
    - Need-to-know subtransaction privacy and explicit visibility roles are native design concepts.
    - Validate privacy guarantees through independent audit and customer threat-model reviews.
  - - Canton participant and validator nodes
    - Banks, market infrastructures, custodians, and app providers
    - Documented deployment paths; production operations vary by operator
    - Lets each institution host parties and preserve data sovereignty while joining shared workflows.
    - Collect SLOs, incident history, key-management approach, and disaster-recovery tests.
  - - Synchronizers / sync domains
    - Network and application operators
    - Core architecture documented; private versus Global Synchronizer choices remain design decisions
    - Sequencer and mediator model separates ordering from transaction-content visibility.
    - Map which live applications use private domains versus the Global Synchronizer.
  - - Global Synchronizer
    - Participants needing cross-application interoperability
    - Live since July 2024 with current operating docs
    - Public interoperability backbone for synchronized finance and network-of-networks design.
    - Verify super-validator diversity, governance rights, and resilience under stress.
  - - Canton Coin and Scan / token APIs
    - Infrastructure operators, app builders, users, and analytics consumers
    - Live utility-token layer with public documentation
    - Tokenomics claim to reward useful activity and burn fees while preserving transaction privacy.
    - Underwrite token-model regulatory risk and economic sustainability under real usage.
  - - 'Mainnet utility modules: registry, settlement, collateral'
    - Issuers, wallet providers, settlement apps, and collateral platforms
    - Documented API reference and token-standard integration
    - Packaged modules reduce custom build burden for tokenized assets and DvP/collateral workflows.
    - Confirm customer-specific extensions, versioning policy, and support obligations.
  notes: Status is assessed from public documentation, GitHub surfaces, and partner announcements; it is not a private product-release
    matrix.
