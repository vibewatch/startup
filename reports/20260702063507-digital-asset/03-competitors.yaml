- id: competitor-profiles-and-strategic-direction
  title: 'Competitor Profiles: Scale, Funding, and Strategic Direction'
  body: 'Scale and capitalization vary enormously across this set. Axoni, historically one of Canton''s closest direct peers, has raised just $110 million across eight rounds with its most recent disclosed round a $20 million Series B in April 2023 and roughly 40 employees as of December 2024 -- a fraction of Digital Asset''s own $355 million June 2026 round led by a16z crypto at an approximately $2 billion valuation. R3 is pursuing a fundamentally different strategic direction: rather than expanding a Canton-style permissioned network, its Corda protocol is pivoting to Solana-native, publicly composable RWA yield vaults targeting private credit and trade finance, launching in the first half of 2026 with more than 30,000 institutional pre-registrations, even as R3''s own Irish office cut headcount from 54 to 40 in 2024 and began a further restructuring in November 2025. Fnality, by contrast, raised a larger $136 million Series C in September 2025 from a syndicate spanning WisdomTree, Bank
    of America, Citi, DTCC, Euroclear, Goldman Sachs, and UBS, and is expanding its central-bank-regulated Sterling Fnality Payment System into new currencies -- a strategy of deepening one regulated niche (tokenized cash settlement) rather than competing broadly with Canton''s asset-tokenization scope. HQLAx''s strategic direction is now partly intertwined with Digital Asset''s own: after years as an independent collateral-mobility platform live at Eurex Clearing since June 2025 and freshly cleared for limited US access via a May 2026 SEC no-action letter, it took a 2026 investment from both Broadridge and Digital Asset, with board seats for each pending regulatory approval. JPMorgan''s Kinexys and DTCC''s forthcoming tokenization service represent the opposite strategic posture -- large incumbents building proprietary infrastructure funded from their own balance sheets rather than raising external venture capital, with DTCC explicitly targeting the same Russell 1000, ETF, and Treasury
    asset classes Canton-based applications like Broadridge''s DLR and DTCC''s own Treasury pilot already touch. Figure Technology Solutions, now Nasdaq-listed, reported $167 million of Q1 2026 net revenue and $45 million of net income from its Provenance-based consumer-lending marketplace, evidence that a narrowly scoped tokenization strategy can reach public-company profitability faster than a broad capital-markets platform play.'
