- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Vendor / platform
  - Price / contract model
  - Included capabilities
  - Discounts / unknowns
  - Implication for buyers
  rows:
  - - Digital Asset / Canton
    - Enterprise licensing plus Super Validator / participant fee structure; exact list price undisclosed
    - DAML tooling, privacy ledger, Global Synchronizer access
    - Fee structure not itemized publicly
    - Buyers must negotiate bespoke commercial terms; limited public price discovery
  - - R3 Corda protocol
    - Protocol-level fees expected via Solana vault mechanics; not yet published (pre-launch)
    - Yield-vault infrastructure and RWA distribution tooling
    - Full fee schedule unknown pre-launch
    - Early evaluators cannot yet benchmark all-in cost
  - - Hyperledger Fabric / Fabric-X
    - Free, open-source core; paid only via managed vendors (e.g., IBM, Kaleido)
    - Full permissioned-ledger framework and chaincode tooling
    - No licensing lock-in, but managed-hosting/support costs vary by vendor
    - Buyers can adopt at zero license cost, then pay only for managed services
  - - Axoni AxCore
    - Enterprise licensing, negotiated per deployment; no public pricing
    - Real-time data replication and lifecycle-automation tooling
    - Pricing entirely undisclosed
    - Smaller vendor scale may mean less pricing flexibility for very large mandates
  - - Fnality
    - Participation/membership-based settlement-system fees; not publicly itemized
    - Central-bank-regulated wholesale settlement, DvP, and PvP
    - Fee schedule undisclosed
    - Buyers must already be a regulated bank or payment-service provider to access it at all
  - - DTCC tokenization service
    - Expected to extend DTCC's existing custody/settlement fee schedules; tokenization-specific fees not yet published
    - Leverages $114T+ of existing custody relationships
    - Fees to be defined ahead of the October 2026 commercial launch
    - Existing DTCC clients may face lower switching friction than genuinely new entrants
  - - Chainlink CCIP + SWIFT
    - Network/message-based fees via SWIFT plus separate CCIP protocol fees; not publicly itemized for the enterprise tier
    - Cross-chain messaging and interoperability with ISO 20022 compatibility
    - Fee model not disclosed publicly
    - Institutions may treat this as an incremental add-on to existing SWIFT membership rather than a new platform purchase
  - - Hedera Hashgraph / HashSphere
    - Public HBAR transaction fees (~$0.0008/tx) disclosed; private HashSphere deployment pricing not public
    - Predictable public-network fees; enterprise-grade SLAs on HashSphere
    - Public-network fee transparency contrasts with undisclosed private-deployment pricing
    - Institutions get at least partial fee benchmarking versus fully opaque, negotiated-only competitors
  notes: Nearly all institutional DLT/tokenization vendors negotiate pricing privately; cells reflect the most specific public information available as of the run date, and 'undisclosed' should not be read as zero cost.
