  claims:
  - id: CP001
    statement: Digital Asset's Canton Network faces a competitive set spanning direct permissioned-DLT peers (R3 Corda, Axoni, ConsenSys Quorum), incumbent open-source frameworks (Hyperledger Fabric), adjacent infrastructure (Fnality, HQLAX, Securitize, Ondo Finance), interoperability substitutes (Chainlink CCIP with SWIFT), status-quo internal builds (JPMorgan Kinexys), and a governance co-chair that is also building a competing service (DTCC's own tokenization platform).
    type: inferred
    topic: landscape-map
    sourceRefs:
    - SP001
    - SP005
    - SP011
    - SP015
    - SP017
    - SP022
    - SP024
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QP001
  - id: CP002
    statement: R3's Corda, historically Canton's closest direct peer in permissioned institutional DLT, is pivoting toward Solana-native public-chain yield vaults ('Corda protocol') rather than expanding a Canton-style permissioned network.
    type: company-claimed
    topic: r3-corda
    sourceRefs:
    - SP001
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QP002
  - id: CP003
    statement: R3's Corda protocol is set to launch on Solana in the first half of 2026 and had received more than 30,000 institutional pre-registrations ahead of launch, targeting tokenization of private credit and trade finance.
