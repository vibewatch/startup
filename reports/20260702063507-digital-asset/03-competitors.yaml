callouts:
- calloutType: strength
  title: Deepest live institutional production volume among permissioned peers
  body: Canton-based applications such as Broadridge's DLR (~$348B/day, +392% YoY) and Goldman Sachs' GS DAP already run at production scale, while R3's Corda protocol, DTCC's own tokenization service, and Hyperledger Fabric-X's higher-throughput variant are all still pre-launch or incubation-stage as of mid-2026.
  claimRefs:
  - CP019
  - CP035
  - CP007
  - CP022
- calloutType: risk
  title: A governance co-chair is building a competing network
  body: DTCC co-chairs Digital Asset's own Canton Foundation while separately building a DTC tokenization service with a 50-plus-firm working group that overlaps heavily with Canton's existing buyer roster -- a structural channel-conflict risk that no contractual disclosure reviewed in this chapter resolves.
  claimRefs:
  - CP021
  - CP023
  - CP043
- calloutType: risk
  title: SWIFT-Chainlink interoperability could commoditize the network-of-networks pitch
  body: Chainlink's CCIP, now reaching roughly 11,500 banks through SWIFT and securing $33.6 billion in cross-chain tokens, gives institutions a path to cross-chain settlement without adopting a full permissioned network, even though it still lacks DAML's native privacy and multi-party workflow modeling.
  claimRefs:
  - CP028
  - CP029
- calloutType: recommendation
  title: Clarify the commercial terms of the 2026 HQLAx investment
  body: Digital Asset's 2026 minority stake in HQLAx, a competing collateral-mobility platform, is disclosed only at a headline level; diligence should confirm whether the investment carries commercial exclusivity or is limited to board-observation rights, since that determines how much it actually constrains HQLAx's own multi-homing with rival rails.
  claimRefs:
  - CP013
  - CP041
- calloutType: insight
  title: Capital scale is becoming a competitive-durability signal
  body: Digital Asset's roughly $2 billion valuation and $355 million June 2026 round dwarf Axoni's $110 million lifetime total and are larger than Fnality's or R3's most recently disclosed individual rounds, suggesting balance-sheet depth is emerging as a differentiator in a category that requires years of institutional trust-building before monetizing.
  claimRefs:
  - CP031
  - CP010
  - CP012
