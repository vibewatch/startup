- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Mitigation / diligence ask
  rows:
  - - Privacy-by-default DAML sub-transaction model
    - Hyperledger Fabric channels and future EVM privacy tooling could narrow the technical gap over time
    - Medium
    - Benchmark DAML's privacy guarantees against Fabric-X and any emerging privacy-preserving EVM rollups over the next 2-3 years
  - - Global Synchronizer network effects (~30 Super Validators, ~600 ecosystem participants)
    - DTCC is building a rival tokenization service with 50+ of the same firms, which could pull production volume to a second network
    - High
    - Track whether DTCC's October 2026 commercial launch draws volume away from Canton-based applications such as Broadridge DLR
  - - Live production volume anchor (Broadridge DLR ~$348B/day)
    - Concentration in one flagship application; a Broadridge slowdown or multi-rail diversification could sharply cut headline Canton volume
    - High
    - Obtain a volume breakdown by application, not just network-wide totals, before treating Canton's aggregate volume as diversified
  - - Regulatory-grade governance (Canton Foundation co-chaired by DTCC and Euroclear)
    - A governance co-chair simultaneously running a competing initiative dilutes the exclusivity of the governance moat
    - Medium
    - Clarify contractual or board-level conflict-of-interest terms between Canton Foundation co-chairs and their own competing platforms
  - - Multi-chain optionality via strategic investments (e.g., the 2026 HQLAx stake)
    - Equity stakes in adjacent platforms blur competitor/partner lines and may not translate into exclusive commercial terms
    - Low-Medium
    - Confirm whether Digital Asset's HQLAx investment includes commercial exclusivity or only board-observation rights
  - - Interoperability positioning versus commoditized bridges
    - Chainlink CCIP's SWIFT integration across roughly 11,500 banks could let institutions bypass a full permissioned network for cross-chain settlement needs
    - High
    - Assess whether SWIFT/CCIP-style interoperability satisfies the same regulatory/privacy bar as DAML-modeled multi-party workflows, or only lighter messaging use cases
  - - Category-wide adoption durability
    - Gartner's 2024-2025 hype-cycle placement of blockchain broadly in the 'trough of disillusionment' suggests continued risk that even well-adopted platforms face budget scrutiny
    - Medium
    - Monitor whether Canton-specific production metrics (DTCC Treasury tokenization, Broadridge DLR) keep growing despite sector-wide skepticism
  notes: Severity ratings are author judgments derived from the cited evidence, not a standardized third-party risk score; treat them as a diligence prioritization aid rather than a quantitative model.
