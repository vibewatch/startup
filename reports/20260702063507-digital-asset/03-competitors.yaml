- id: FP001
  title: Competitive positioning map
  type: quadrant
  layout: wide
  summary: Digital Asset's Canton Network sits in the high-regulatory-readiness, lower-public-interoperability quadrant, while public-chain interoperability specialists and DTCC's own tokenization service cluster differently across the map.
