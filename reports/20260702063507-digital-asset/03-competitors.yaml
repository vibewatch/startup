tables:
- id: TP001
  title: Competitor profile table
  columns:
  - Competitor
  - Category
  - Scale / funding
  - Target segment
  - Differentiation
  - Limitation
  rows:
  - - R3 / Corda protocol
    - Direct peer (pivoting to public-chain RWA vaults)
    - Backed historically by HSBC, Bank of America, Bank of Italy, MAS; Corda protocol targets H1 2026 Solana launch with 30,000+ pre-registrations
    - Trade-finance and private-credit issuers seeking DeFi-composable yield
    - A decade of Wall Street relationships and experience tokenizing regulated assets
    - Pivoting away from Canton-style permissioned architecture; 2024-2025 Irish headcount cut from 54 to 40 amid restructuring
  - - Hyperledger Fabric / Fabric-X
    - Incumbent open-source framework
    - Linux Foundation / Hyperledger Foundation governed; no single-company funding figure; Fabric-X IP moved under Hedera Governing Council oversight in 2026
    - Banks, supply chain, healthcare, government wanting a free permissioned framework
    - Free, vendor-neutral, widely deployed; Fabric-X targets CBDC/tokenization throughput
    - Fabric-X still incubation-stage; no unified privacy-by-default model equivalent to DAML
  - - Axoni / AxCore
    - Direct peer (smaller scale)
    - $110M raised across 8 rounds; last disclosed round a $20M Series B (Apr 2023); ~40 employees (Dec 2024)
    - Swaps/derivatives post-trade lifecycle automation and data replication for banks
    - Deep swaps-market pilot experience; backers include Goldman Sachs, Deutsche Bank, UBS, Citi
    - Far smaller capital base and headcount than Digital Asset; no large funding round disclosed since 2023
  - - Fnality
    - Adjacent (regulated cash-settlement leg)
    - $136M Series C (Sept 2025); backed by WisdomTree, BofA, Citi, DTCC, Euroclear, Goldman Sachs, UBS
    - Banks needing regulated tokenized-cash settlement alongside asset tokenization
    - Central-bank-regulated systemic settlement finality (Sterling FnPS)
    - Covers only the cash leg, not asset tokenization; still expanding beyond GBP to new currencies
  - - HQLAx
    - Adjacent (collateral mobility) and 2026 investee
    - Broadridge and Digital Asset became 2026 strategic investors; overall scale undisclosed
    - Collateral mobility for global banks and CCPs (e.g., Eurex)
    - Live production since June 2025 at Eurex; May 2026 SEC no-action letter for limited US access
    - US participation capped at 15 firms with volume limits; Digital Asset is itself an investor, blurring competitor/partner status
  - - JPMorgan Kinexys
    - Incumbent internal build
    - Funded entirely by JPMorgan's balance sheet; $1.5T+ cumulative volume, targeting $10B/day
    - JPMorgan's own institutional and corporate-treasury clients
    - Deep captive client base; JPM Coin already multi-homed on Base and Canton
    - Single-bank platform with incentive to keep flow proprietary rather than interoperable
  - - Broadridge DLR
    - Adjacent (Canton-based application, not a rival base layer)
    - Broadridge is a public company; DLR processed ~$348B/day, +392% YoY (Mar 2026)
    - Global repo desks at large banks and broker-dealers
    - Runs directly on Canton, showing ecosystem depth rather than substitution risk
    - 'Concentration risk: an outsized share of Canton''s headline volume sits in one application'
  - - ConsenSys Quorum / Kaleido
    - Direct peer (EVM-based)
    - Privately held; Quorum originated at JPMorgan; scale undisclosed
    - Enterprises wanting EVM-compatible permissioned chains and CBDC pilots (e.g., Project Agora)
    - Broad Ethereum tooling/developer compatibility; managed deployment via Kaleido
    - Less privacy-by-default sophistication than DAML; less capital-markets specialization than Canton
  - - DTCC tokenization service
    - Incumbent and governance co-chair (dual role)
    - DTCC-owned; 50+ firm Industry Working Group; targeting July 2026 limited trades, October 2026 commercial launch
    - 'DTC''s existing custody clients: custodians, brokers, asset managers'
    - $114T+ of existing DTC custody relationships; Dec 2025 SEC no-action letter already secured
    - Directly overlaps Canton's own governance co-chair role and buyer roster, raising channel-conflict risk
  - - Provenance Blockchain / Figure Technology Solutions
    - Adjacent (consumer-credit specialist)
    - Nasdaq-listed (FIGR); Q1 2026 net revenue $167M, net income $45M, $1.5B cash
    - Consumer and home-equity lenders and loan investors
    - Largest non-bank HELOC originator on-chain; public-company financial transparency
    - Focus limited to consumer credit/loans, not institutional capital-markets settlement
  - - Securitize
    - Adjacent (regulated issuance / transfer agent)
    - Backer/partner scale undisclosed; routes ~$3.5B in tokenized assets including BlackRock's BUIDL
    - Asset managers needing a regulated U.S. transfer agent
    - Default gateway for BlackRock, Apollo, and Hamilton Lane mandates
    - Positions as an issuance/compliance layer, not a settlement network; still needs an underlying chain
  - - Ondo Finance
    - Adjacent / substitute (public-chain RWA issuer)
    - ~$2.77B-$3.77B AUM/TVL; backed by Pantera Capital and Founders Fund
    - DeFi-native and TradFi investors wanting on-chain Treasuries/equities
    - ~58-70% share of tokenized-equity volume; partnerships with BlackRock, JPMorgan, Franklin Templeton
    - Operates on public composable chains, a different trust/privacy model than Canton's permissioning
  - - Chainlink CCIP + SWIFT
    - Substitute (interoperability layer)
    - Chainlink Labs privately held; CCIP secures $33.6B in cross-chain tokens, +1,972% 2025 transfer growth
    - Banks wanting cross-chain interoperability without adopting a new base ledger
    - SWIFT's ~11,500-bank network already wired for wallet-address messaging
    - No native privacy/workflow modeling like DAML; provides interoperability, not settlement infrastructure
  - - Hedera Hashgraph / Asseto
    - Incumbent / adjacent (flexible public+private)
    - 35+ member Governing Council (Google, IBM, Boeing, Standard Bank); scale undisclosed
    - Institutions wanting a choice between public Hedera or private HashSphere deployment
    - Governing-council model spreads influence; Asseto covers stocks, bonds, funds, loans, cash
    - Less live institutional capital-markets settlement volume evidence than Canton's Broadridge/DTCC production use
  notes: Scale/funding figures mix company-disclosed totals, third-party trackers, and public-company filings from different dates in 2023-2026; treat as directional, not a single as-of date. Several vendors (HQLAx, ConsenSys Quorum/Kaleido, Hedera) do not disclose overall funding scale.
