- id: section-3
  title: Milestones, institutional relevance, and the caveats that remain
  body: 'Digital Asset''s milestone sequence now looks more like market-infrastructure scaling than crypto experimentation.
    The public timeline shows Daml being open sourced in 2019, Canton launching with more than 30 market participants in 2023,
    the Global Synchronizer going live in July 2024, Euroclear beginning a collateral-mobility initiative in early 2025, a
    $135 million strategic round in mid-2025, a live on-chain Treasury financing workflow with Tradeweb and other institutions
    in August 2025, a DTCC partnership around tokenized DTC-custodied Treasuries in December 2025, and then the $355 million
    2026 financing at a reported $2 billion valuation. The most valuable conclusion from these points is not simply that large
    names are present, but that the names span infrastructure operators, exchanges, dealers, asset managers, and crypto-native
    liquidity providers. DTCC, Euroclear, Tradeweb, Broadridge, Goldman Sachs, and other institutions appear across funding,
    governance, pilot, or production-adjacent contexts. That is stronger than a mere logo wall. Still, the public record has
    real limits. The company publishes ecosystem-participant counts and flagship use cases, but not audited revenue, customer
    concentration, headcount, margin, or tender documentation. There is also a genuine narrative trade-off in the architecture:
    Canton''s privacy-first, public-permissioned design is exactly what attracts regulated institutions, but it also invites
    skepticism from crypto-native observers who see selective disclosure and governance by large institutions as a compromise
    rather than a virtue. Finally, Digital Asset''s own phishing warning is a reminder that crypto-adjacent branding creates
    operational and reputational attack surface even for enterprise-focused firms. The publishable takeaway is therefore strong
    institutional relevance, not fully closed underwriting precision.'
