chapter:
  number: 1
  title: Company Overview
  summary: Digital Asset is now a well-capitalized institutional-blockchain infrastructure company centered on Canton and
    Daml, with strong visible ties to major market infrastructures and a fresh 2026 financing, but still with private-company
    opacity around governance, cap table, and audited operating metrics.
sections:
- id: section-1
  title: Identity, product scope, and operating footprint
  body: 'Digital Asset''s current public identity is narrower than a generic crypto-infrastructure company and broader than
    a single developer-tool vendor. The homepage, products pages, and Daml materials all point to the same thesis: the company
    is trying to provide institutional blockchain infrastructure that lets regulated financial institutions transact on shared
    networks without exposing sensitive data to everyone else. That framing matters because it ties the commercial story directly
    to a real buyer problem in capital markets: privacy, control, and interoperability across institutions that do not want
    to rely on open retail-style blockchains. The public materials also show that the company is no longer pitching only a
    language or research project. Daml remains an open-source and developer-facing asset, but the operating story now centers
    on Canton as the shared network and on packaged use cases such as tokenization, collateral mobility, settlement, and digital
    cash. The office footprint reinforces that this is being sold as a global financial-infrastructure company rather than
    a local developer startup. Digital Asset lists New York, London, Zurich, Budapest, Sydney, and Hong Kong offices, and
    its major 2025-2026 announcements are dated from New York alongside other financial centers. The prudent conclusion is
    that New York is the functional headquarters in public materials, while the company maintains a multi-region delivery
    and customer-engagement model. That is enough to ground later chapters on market, customers, and risks without overstating
    private metrics the company does not publish.'
