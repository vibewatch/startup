- id: TU003
  title: Named customer proof table
  columns:
  - Institution
  - Segment
  - Deployment / use case
  - Classification
  - Outcome / proof
  - Limitation
  rows:
  - - Broadridge DLR
    - Post-trade / repo infrastructure
    - Distributed Ledger Repo built on Daml for repo workflows
    - Production
    - More than $1.5T monthly repo volume cited; Broadridge separately describes trillion-dollar monthly DLR activity.
    - Digital Asset revenue share, current contract term, and exact DLR-to-Canton migration details not public.
  - - DTCC
    - CSD / market infrastructure
    - DTC-custodied U.S. Treasury tokenization on Canton; prior collateral pilot
    - Controlled-production MVP / pilot history
    - H1 2026 controlled-production MVP target; 2024 pilot executed 100 transactions across 14 nodes.
    - Future rollout size, paying-client economics, and broad production adoption remain undisclosed.
  - - Tradeweb
    - Electronic marketplace / execution platform
    - On-chain UST financing and tokenized Treasury execution
    - Live transaction / partner workflow
    - 2025 on-chain financing plus July 2026 real-time tokenized Treasury transaction with Franklin Templeton and Virtu.
    - Single-transaction disclosures do not prove recurring production volume.
  - - Euroclear
    - CSD / collateral infrastructure
    - Collateral mobility, tokenized gilts/eurobonds/gold, cross-border intraday repo
    - Pilot / phase participant
    - First project phase in 2025 and repeat 2026 cross-border repo participation.
    - Public materials do not disclose commercial contract value or full production status.
  - - Goldman Sachs
    - Bank / digital-assets platform / investor-participant
    - GS DAP referenced as a standalone Canton network; investor-participant in funding context
    - Investor-participant / standalone application
    - Independent sources identify GS DAP and Goldman participation in the Canton ecosystem.
    - No public source confirms Digital Asset customer revenue or current deployment economics.
  - - BNP Paribas
    - Bank / tokenized bond participant / investor-participant
    - Neobonds and Canton ecosystem investor-participant references
    - Investor-participant / application proof
    - Independent sources name BNP Paribas among pilots/investors and standalone Canton networks.
    - Relationship type blends investor, participant, and application proof.
  - - HSBC
    - Bank / tokenized deposits / Orion
    - Tokenized Deposit Service pilot on Canton; Orion digital-assets platform context
    - Pilot / adjacent platform proof
    - Canton and independent sources describe an HSBC tokenized-deposit pilot; HSBC describes Orion and digital-asset capabilities.
    - No disclosed Digital Asset production contract or revenue contribution.
  - - Circle / Hashnote / USYC
    - Stablecoin and tokenized-money-market collateral
    - Native USDC plan and USYC collateral support on Canton
    - Integration / product participant
    - Circle announced planned native USDC on Canton and USYC/Hashnote collateral strategy.
    - Strategic integration does not disclose Digital Asset monetization.
  - - Nomura / Mizuho / JSCC
    - APAC market infrastructure and banks
    - JGB tokenized-collateral trial on Canton
    - PoC
    - Independent reporting identifies Japanese government bond collateral trial plans.
    - Earlier-stage PoC; legal-change analysis may be needed.
  - - ASX CHESS history
    - Exchange / clearing and settlement infrastructure
    - DLT-based CHESS replacement history
    - Adverse former customer proof
    - ASIC says ASX admitted misleading conduct about project progress; project was paused and costs derecognized.
    - Historical ASX case is not evidence against current Canton deployments but is a severe implementation-risk reminder.
  notes: Classification intentionally separates production, live transaction, pilot/phase, PoC, investor-participant, integration,
