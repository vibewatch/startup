- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Representative proof
  - Strategic value
  - Main gap
  rows:
  - - Market infrastructure / CSDs
    - DTCC, Euroclear, JSCC-type entities; governance and workflow sponsors
    - DTCC tokenized Treasuries, Euroclear collateral mobility, JSCC-related JGB collateral PoC
    - Can set standards and pull banks, dealers, custodians, and asset managers into shared workflows.
    - Commercial terms, implementation cost, and production rollout timing are mostly private.
  - - Banks and dealers
    - Bank of America, Societe Generale, HSBC, LSEG-linked bank money users
    - Treasury financing, tokenized deposits, repo, collateral reuse
    - Provide balance sheet, liquidity, regulated cash, and collateral demand.
    - Pilot versus production boundary and revenue attribution are unclear.
  - - Dealers and liquidity providers
    - Citadel Securities, Virtu Financial, Cumberland DRW, B2C2, FalconX, GSR
    - Market-making, collateral, and bilateral derivatives workflows
    - Create liquidity and make 24/7 settlement commercially useful.
    - Participation does not disclose volumes, economics, or exclusivity.
  - - Asset managers / tokenized-fund issuers
    - Franklin Templeton, Hashnote/USYC, tokenized money-market funds
    - Tokenized Treasuries, USYC collateral, fund-share records
    - Supply high-quality assets and yield-bearing collateral to the network.
    - Unclear whether integrations produce Digital Asset software revenue or network economics.
  - - Stablecoin and cash-leg providers
    - Circle, Brale, LSEG DiSH and related cash providers
    - USDC, USDCx, USYC, tokenized deposits
    - Cash leg is necessary for delivery-versus-payment and collateral mobility.
    - Regulatory, issuer, and settlement-risk dependencies remain outside Digital Asset alone.
  - - Custodians / collateral agents
    - Custodians, collateral agents, prime brokers, and CSD-linked operators
    - DTCC and 2024 pilot roles around digital twins, margin calls, and custody
    - Connect legal ownership, custody records, and on-chain asset movement.
    - Public sources do not give adoption counts or operational SLA evidence.
  notes: Segmentation is public-evidence based and intentionally separates workflow role from paying-customer status.
