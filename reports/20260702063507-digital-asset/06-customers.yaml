- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration / friction risk
  - Impact
  - Diligence path
  rows:
  - - Treasury tokenization to repo and collateral reuse
    - DTCC, Tradeweb, and a few dealers dominate visible U.S. proof.
    - High upside if DTCC services pull broader DTC participants; high downside if rollout stalls.
    - Request DTCC rollout plan, participant pipeline, target volumes, and Digital Asset commercial terms.
  - - Collateral mobility into gilts, Eurobonds, gold, and tokenized deposits
    - Euroclear/LSEG/Euronext phases are important but not yet disclosed as recurring production revenue.
    - Expands TAM across Europe and UK but elongates procurement and legal review.
    - Validate production roadmap, legal-finality analysis, and signed commitments.
  - - Cash-leg integrations through USDC, USYC, tokenized deposits, and DiSH
    - Depends on external issuers and regulatory acceptance of tokenized cash instruments.
    - Improves settlement utility but imports counterparty and regulatory dependencies.
    - Review issuer agreements, reserves/custody structure, jurisdictional limits, and fee flows.
  - - Dealer and liquidity-provider participation
    - Liquidity depends on a concentrated set of high-volume market makers such as Citadel, Virtu, DRW/Cumberland, and SocGen.
    - Creates network liquidity but may weaken if incentives or market structure shift.
    - Ask for active-participant count, transaction concentration, and incentive arrangements.
  - - Partner-led distribution via Broadridge, Tradeweb, DTCC, Euroclear, and Circle
    - Digital Asset may be embedded behind partner brands, limiting direct pricing power and customer ownership.
    - Can accelerate adoption while compressing economics or data visibility.
    - Request partner contracts, revenue share, data rights, and end-customer ownership terms.
  - - Systemically important infrastructure deployments
    - ASX history shows DLT replacement programs can pause, re-scope, and trigger regulatory scrutiny.
    - Procurement and delivery risk remain thesis-critical despite strong current names.
    - Demand implementation postmortems, independent assurance, acceptance criteria, and delivery governance evidence.
  notes: Risks are strategic and procurement-oriented; public sources do not disclose top-customer revenue concentration.
