company:
  name: Digital Asset
chapter:
  number: 6
  title: Customers
  summary: 'Digital Asset has unusually strong named institutional proof for a private infrastructure company, led by Broadridge
    DLR production-scale usage, DTCC controlled-production plans, Tradeweb live transactions, and Euroclear collateral phases.
    The customer story is still evidence-sensitive: most named logos blend pilots, investor-participant roles, and ecosystem
    participation rather than disclosed revenue, retention, or contract terms.'
sections:
- id: customer-segments-and-buyer-map
  title: Customer segments and who really adopts Canton
  body: Digital Asset does not look like a broad horizontal SaaS vendor with many small customers. The visible customer base
    is concentrated in regulated financial-market infrastructure and adjacent wholesale workflows where shared ledgers solve
    coordination problems among institutions that already trade, settle, custody, or finance assets with one another. That
    means the buyer, user, and beneficiary are often different. A market infrastructure such as DTCC or Euroclear can shape
    standards and governance; banks and dealers can use the workflow to finance or mobilize collateral; asset managers and
    tokenized-fund issuers can supply assets; Circle or Hashnote can provide a cash or yield-bearing collateral leg; and custodians
    or CSDs can help connect legal ownership to on-chain representations. Geography follows the same pattern. U.S. Treasury
    and DTCC workflows anchor the U.S. proof; Euroclear, LSEG, Euronext, Archax, and gilts/Eurobonds show Europe and the UK;
    and Nomura, Mizuho, and JSCC create APAC proof-of-concept evidence. The absence of retail or SMB proof is not a weakness
    if the underwriting thesis is institutional infrastructure, but it does mean customer-count language must be disciplined.
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
  - CU035
  - CU036
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: named-proof-and-production-maturity
  title: 'Named proof: production, live transactions, pilots, and investor-participants'
  body: 'The strongest customer evidence is not a logo wall; it is a set of named workflows with different maturity levels.
    Broadridge DLR is the flagship production-scale proof because both Digital Asset and Broadridge describe ongoing repo
    activity at trillion-dollar monthly scale, with named participants around the platform. DTCC is strategically more systemic
    but still more forward-looking: the official material says the Treasury tokenization effort is moving toward a controlled-production
    MVP in the first half of 2026, after earlier collateral pilots. Tradeweb is live-transaction evidence because it appears
    in both the 2025 working-group financing and a July 2026 tokenized Treasury transaction with Franklin Templeton and Virtu.
    Euroclear is highly credible but phase/pilot-led, spanning collateral mobility, tokenized gilts/eurobonds/gold, and cross-border
    repo participation. Goldman Sachs, BNP Paribas, HSBC, Circle, Nomura, and other names are valuable, but they must be classified
    carefully because public sources often mix investor, pilot, standalone-application, integration, and participant roles.'
  claimRefs:
