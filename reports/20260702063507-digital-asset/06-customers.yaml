- id: expansion-concentration-and-adverse-lessons
  title: Expansion, concentration, procurement friction, and adverse customer evidence
  body: 'Digital Asset’s customer expansion loop is attractive because the same network can move from one asset and counterparty
    set to adjacent use cases: tokenized Treasuries to repo, repo to collateral reuse, collateral reuse to tokenized deposits,
    stablecoins, money-market funds, cross-border settlement, and 24/7 liquidity. Partner-led distribution also matters. DTCC,
    Euroclear, Tradeweb, Broadridge, Circle, LSEG, and large dealers already own the buyer relationships Digital Asset needs.
    The risk is that the same structure creates concentration and procurement friction. A few systemic institutions drive
    a large share of public proof, and any implementation in post-trade, custody, collateral, or regulated cash must clear
    legal-finality, data-privacy, governance, resilience, and internal-control reviews. The adverse ASX history is therefore
    not a footnote. A DLT-based CHESS replacement program was paused and re-scoped, with large costs derecognized and later
    ASIC admissions around misleading progress statements. That does not invalidate current Canton traction, but it is a hard
    reminder that market-infrastructure customers can be slow, public, expensive, and unforgiving when delivery misses.'
