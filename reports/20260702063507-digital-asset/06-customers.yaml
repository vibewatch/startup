  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: customer-revenue-and-contracts
    missingEvidence: Named-customer revenue contribution, pricing model, minimum commitments, renewal dates, and contract
      terms for DTCC, Euroclear, Broadridge, Tradeweb, Circle, and major dealers.
    whyItMatters: The public record proves institutional relevance but not whether the strongest logos map to durable, high-margin
      revenue.
    diligencePath: Request anonymized customer ARR bridge, top-10 customer concentration, signed order forms, renewal calendar,
      and product-by-customer usage metrics.
    relatedQuestionRefs:
    - QU023
    - QU026
    relatedTableRefs:
    - TU003
    - TU004
    - TU005
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof-table-public-sample
    missingEvidence: A complete taxonomy that separates paying customers, validators, investors, counterparties, design partners,
      pilots, and production users across all 700+ ecosystem participants.
    whyItMatters: Without the taxonomy, diligence can over-read investor-participant and pilot names as recurring customers.
    diligencePath: Ask management for a customer roster with relationship type, revenue status, deployment status, jurisdiction,
      and go-live date for each named institution.
    relatedQuestionRefs:
    - QU008
    - QU024
    - QU025
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: retention-and-satisfaction
    missingEvidence: NRR, GRR, churn, cohort retention, user satisfaction, incident history, and support escalations for Daml/Canton
      deployments.
    whyItMatters: Repeated phases suggest network stickiness, but cannot replace actual retention economics or customer health
      metrics.
    diligencePath: Review renewal cohorts, support tickets, customer NPS or reference-call transcripts, and production incident
      logs for the past eight quarters.
    relatedQuestionRefs:
    - QU019
    - QU020
    - QU026
    relatedTableRefs:
    - TU004
  - type: conflicting-data
    severity: minor
    topic: broadridge-throughput-vintage
    missingEvidence: A management-confirmed current DLR volume bridge reconciling Broadridge public trillion-dollar monthly
      statements, Digital Asset’s more than $1.5 trillion monthly reference, and later independent mentions of higher throughput.
    whyItMatters: DLR is the flagship production proof point, so the diligence model needs a dated, comparable throughput
      metric rather than mismatched marketing vintages.
    diligencePath: Ask Broadridge or Digital Asset for monthly volume by quarter, counterparty count, external versus intracompany
      mix, and whether Canton migration changes the metric definition.
    relatedQuestionRefs:
    - QU011
    - QU020
    relatedTableRefs:
    - TU002
    - TU004
  - type: private-evidence-only
    severity: material
    topic: asx-lessons-for-current-procurement
    missingEvidence: Postmortem detail from Digital Asset on ASX CHESS lessons incorporated into current Canton implementations,
      delivery governance, and production acceptance criteria.
    whyItMatters: ASX is the clearest adverse customer proof point and is directly relevant to procurement risk for systemically
      important market infrastructure.
    diligencePath: Request customer implementation playbooks, governance changes after ASX, independent assurance reports,
      and references from current infrastructure customers about delivery controls.
    relatedQuestionRefs:
    - QU027
    - QU028
    relatedTableRefs:
    - TU005
