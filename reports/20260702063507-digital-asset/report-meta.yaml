companyProfile:
  summary: >-
    Digital Asset Holdings, LLC ("Digital Asset") is a New York-headquartered financial-infrastructure
    company founded in 2014. It created Daml, an open-source smart-contract language and application
    platform, and the Canton Network, a privacy-enabled public Layer 1 blockchain designed so that
    regulated institutions can transact on shared infrastructure without exposing sensitive data. The
    company has repositioned from a Daml-centric developer story toward operating Canton as core
    on-chain infrastructure for tokenized assets, collateral mobility, and settlement.
  foundedDate: '2014-01-01'
  founders:
    - name: Yuval Rooz
      role: Co-founder & CEO
      background: Former Citadel and DRW trading-technology operator; permanent CEO since March 2019.
      claimRefs: [CO009, CO010]
    - name: Eric Saraniecki
      role: Co-founder & Head of Network Strategy
      background: Co-founder focused on network strategy and institutional relationships.
      claimRefs: [CO011]
    - name: Shaul Kfir
      role: Co-founder
      background: Cryptography-oriented co-founder and early technical architect.
      claimRefs: [CO012]
  foundingLocation: New York, NY, USA
  headquarters: New York, NY, USA
  productSummary: >-
    Daml smart-contract platform (open source) and the Canton Network — a privacy-enabled public
    Layer 1 with a Global Synchronizer and the Canton Coin — packaged into use cases for tokenized
    Treasuries, collateral mobility, repo/financing, and digital-cash settlement.
  customerFocus: >-
    Global systemically important financial institutions — banks, exchanges/CSDs, custodians, asset
    managers, and dealers (e.g. DTCC, Euroclear, Goldman Sachs, BNP Paribas, Broadridge, Tradeweb).
  businessModel: >-
    Enterprise licensing/support for Daml and Canton, professional-services and implementation, and
    network/token economics around the Canton Network; none of these streams are publicly quantified.
  stage: Series G (private, venture-backed)
  fundingStatus: >-
    $355M round announced June 2026 led by a16z crypto at a reported ~$2B valuation; ~$660M+ raised
    since 2021 including a $135M strategic round in June 2025.
  disclosureProfile: private-undisclosed
  claimRefs: [CO008, CO023, CO025, CO027]
summary:
  headline: >-
    A category-leading institutional-blockchain platform with rare TradFi backing and live
    market-infrastructure workflows, but priced ahead of any disclosed revenue — a high-conviction,
    high-uncertainty track candidate.
