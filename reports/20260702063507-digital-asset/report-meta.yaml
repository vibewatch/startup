  topStrengths:
    - >-
      Deep, dual-role backing from systemic institutions (a16z crypto, Goldman Sachs, BNP Paribas,
      DTCC) that are simultaneously investors, partners, and prospective users.
    - >-
      Real production-adjacent workflows on Canton — DTCC tokenized Treasuries, Euroclear collateral
      mobility, Broadridge DLR repo, Tradeweb on-chain UST financing — beyond a logo wall.
    - >-
      Differentiated privacy-plus-interoperability architecture (Daml + Canton Global Synchronizer)
      addressing the exact constraints that block institutional use of public blockchains.
    - >-
      Well-capitalized after the 2026 round, with a large secular RWA-tokenization market tailwind.
  topRisks:
    - >-
      Valuation (~$2B) rests on ecosystem breadth and pilots, not disclosed revenue; monetization
      durability and Canton Coin economics are unproven.
    - >-
      Regulatory uncertainty across securities/commodities treatment of tokenized assets and Canton
      Coin classification (SEC, CFTC, MiCA) could slow or reshape adoption.
    - >-
      Dependence on a few systemic partners (DTCC, Euroclear, Broadridge, Goldman) that also operate
      or could build competing platforms (GS DAP, JPMorgan Kinexys).
    - >-
      Precedent risk: large DLT market-infrastructure programs can fail late (ASX's abandoned
      Daml-based CHESS replacement); institutional sales cycles are long and pilots may not convert.
    - >-
      Private-company opacity — no audited financials, cap table, or preference stack — limits
      underwriting precision and creates preference/dilution overhang risk.
  unresolvedGaps:
    - Audited revenue, ARR, gross margin, burn, and runway for 2025-2026.
    - Full cap table, liquidation-preference stack, and 2026 round terms/side letters.
    - Production-vs-pilot status and per-customer revenue/usage for named institutions.
    - Canton Coin token economics, distribution, and regulatory classification.
    - Board composition, governance rights, and key-person succession beyond Yuval Rooz.
