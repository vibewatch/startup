  topStrengths:
    - a16z crypto、Goldman Sachs、BNP Paribas、DTCC 等系统性机构深度参与，既是投资人，也是合作伙伴和潜在用户。
    - >-
      Canton 上已有接近生产的真实工作流：DTCC tokenized Treasuries、Euroclear collateral mobility、Broadridge DLR repo、Tradeweb on-chain
      UST financing，不只是 logo 墙。
    - Daml + Canton Global Synchronizer 形成差异化的隐私 + 互操作架构，正面解决公共区块链挡住机构采用的约束。
    - 2026 轮后资本充足，又踩在 RWA tokenization 的长期大顺风上。
  topRisks:
    - 约 $2B 估值靠生态广度和试点支撑，不靠已披露收入；变现耐久性和 Canton Coin 经济模型还没验证。
    - tokenized assets 的证券 / 商品属性和 Canton Coin 分类（SEC、CFTC、MiCA）仍有监管不确定性，可能拖慢或重塑采用路径。
    - 公司依赖少数系统性伙伴（DTCC、Euroclear、Broadridge、Goldman）；这些伙伴同时运营或可能自建竞争平台（GS DAP、JPMorgan Kinexys）。
    - 先例风险真实存在：大型 DLT 市场基础设施项目可能在后期失败（ASX 放弃基于 Daml 的 CHESS 替代项目）；机构销售周期长，试点也未必转生产。
    - 私有公司不透明——没有经审计财务、股权结构表或优先股堆叠——限制承销精度，也留下优先权 / 稀释悬置风险。
  unresolvedGaps:
    - 2025-2026 年经审计收入、ARR、毛利率、烧钱和现金跑道。
    - 完整股权结构表、清算优先权堆叠，以及 2026 轮条款 / side letters。
    - 具名机构的生产与试点状态，以及逐客户收入 / 使用量。
    - Canton Coin 代币经济、分发和监管分类。
    - 董事会构成、治理权利，以及 Yuval Rooz 之外的关键人继任。
