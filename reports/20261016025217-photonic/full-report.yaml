      - number: '5.2'
        title: Architecture, integration path, and proof points
        blocks:
          - type: paragraph
            body: >-
              The architecture narrative is unusually concrete for a private quantum company. Photonic says scale comes
              from combining dense qubit integration inside silicon modules with distributed operation across
              telecom-networked modules, while the T-centre modality merges compute, memory, and optical connectivity in
              one silicon structure. Microsoft's partnership statement gives the clearest external operating-model view:
              staged work from point-to-point entanglement over telecom fibre, to a short-lived repeater capability, to
              a fault-tolerant network layer tied into Azure. TELUS provides the most tangible field milestone in the
              assigned pool, with a 30 km commercial-fibre teleportation demonstration that moves beyond purely on-chip
              lab claims but still falls short of customer production proof.
            claimRefs:
