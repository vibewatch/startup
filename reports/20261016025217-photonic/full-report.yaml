      - number: '6.3'
        title: Durability, retention, and land-and-expand remain mostly unproven
        blocks:
          - type: paragraph
            body: >-
              The public record is much thinner on durability than on technical promise. Photonic's January 2026
              financing announcement said the company would deepen customer and partner engagements and expand business
              teams, which implies commercialization work is ongoing, but it did not disclose customer count, booked
              revenue, contracts, or deployment volumes. Independent commentary is also cautious: one analyst profile
              scores the business much lower on commercial readiness than on technology or government positioning, and
              broader photonic-market coverage places public hardware deployment or cloud access with better-known
              peers. The result is a credible top-of-funnel story with limited public proof of renewals, cohort
              retention, or scale economics.
            claimRefs:
