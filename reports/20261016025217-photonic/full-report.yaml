      - number: '2.3'
        title: Buyer map, adoption path, and the constraints that still govern timing
        blocks:
          - type: paragraph
            body: >-
              Early buyer evidence clusters around stakeholders that already own security, network, or quantum-program
              budgets. TELUS is both proof point and archetype: the partnership used installed commercial fibre over 30
              km and explicitly framed follow-on products around quantum data centers and encrypted networks. RBC's
              investment thesis points to financial-sector uses in security, portfolio optimization, and risk modelling,
              while SVIC and PostQuantum show that DARPA/QBI and Canada's Quantum Champions Program are still central
              public-sector payers. Entangled Future adds a cloud/platform route via Azure Quantum. The same evidence
              also explains why adoption timing remains uncertain: PostQuantum says the architecture still must prove
              cryogenic operability, entanglement rates, large-scale synchronization, and customer proof beyond
              governments and investor-partners. That makes Photonic easier to underwrite as a strategically important
              wedge in secure and networked quantum infrastructure than as a broadly commercialized
              enterprise-software-style market today.
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
