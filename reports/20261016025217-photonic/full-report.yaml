  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Public evidence describes Photonic as a layered stack from silicon T-centre qubits up through telecom-fibre
      networking, cloud integration, and end-use workloads.
    data:
      layers:
        - label: Workloads and outcomes
          detail: >-
            Messaging centers on scientific-computing, networking, and secure-communications use cases rather than a
            single packaged application.
          outputs:
            - label: Materials, chemistry, security, and networking workloads
        - label: Cloud and access surface
          detail: >-
            Partner messaging routes future access through Azure rather than a documented public standalone service
            tier.
          outputs:
            - label: Azure Quantum Elements integration
            - label: Hardware exposure "as it becomes available"
        - label: Networking and repeater layer
          detail: >-
            Microsoft describes a three-stage path from telecom-fibre entanglement to a reliable cloud-operational
            quantum repeater.
          modules:
            - label: Stage 1 physical entanglement
            - label: Stage 2 short-time quantum repeater
            - label: Stage 3 fault-tolerant network layer
        - label: Modular compute layer
          detail: >-
            Official architecture claims scale up inside integrated-silicon modules and scale out across chips, racks,
            and data centres.
          modules:
            - label: Integrated-silicon module
            - label: Connectivity across neighbouring qubits, chips, racks, and data centres
        - label: Qubit and memory layer
          detail: T centres combine compute, memory, and telecom-band photon interfaces in silicon.
          modules:
            - label: Up to four spin qubits per T centre
            - label: Native optical interconnect
            - label: Long-coherence nuclear-spin memory
        - label: Error correction and manufacturability
          detail: >-
            The stack depends on QLDPC-style fault tolerance and silicon manufacturing compatibility, but public
            end-to-end logical-qubit metrics are still absent.
          modules:
            - label: QLDPC / SHYPS error-correction path
            - label: Silicon photonic integrated circuit compatibility
            - label: 1K operating-temperature claim for T centres
    approximationNotes: >-
      This is a conceptual stack assembled from public descriptions; it does not imply that every layer is already
      commercially deployed.
    claimRefs:
      - CE002
      - CE003
      - CE005
      - CE006
      - CE007
