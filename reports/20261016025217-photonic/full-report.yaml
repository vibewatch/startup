              partners, and TELUS explicitly describes commercial ambitions that range from quantum data centres to
              encrypted networks. That is enough to outline the future revenue model, but not enough to score current
              revenue quality. Across the retained sources, there is still no public list pricing, realized pricing,
              contract duration, recognized revenue, or ARR disclosure, so the present monetization bridge remains
