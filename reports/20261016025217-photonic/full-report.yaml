  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Delivered platform and buyer-facing product surface
        blocks:
          - type: paragraph
            body: >-
              Photonic presents the product as a unified quantum computing and networking platform built around its
              Entanglement First architecture, with silicon spin qubits and telecom-native connectivity as the core
              design choices rather than a monolithic single-box machine. The official product pages and
              company-authored syndicated materials are specific about the technical ingredients - integrated-silicon
              modules, T-centre qubits, distributed entanglement, and future cloud integration - but they stop short of
              documenting a public SKU, list price, or generally available service tier. That means the chapter's
              product map should be read as a capability stack and commercialization path, not as proof that third-party
              buyers can already procure a production deployment on published commercial terms.
