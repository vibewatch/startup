  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Boundary: distributed quantum hardware plus networking, not the whole photonics stack'
        blocks:
          - type: paragraph
            body: >-
              Public sources place Photonic at the intersection of photonic quantum computing and quantum networking,
              but not across the entire photonics ecosystem. Official architecture pages describe a system that scales
              through integrated-silicon modules and telecom-networked entanglement, while QuantumZeitgeist separately
              classifies Photonic as a photonic-spin-hybrid vendor rather than a pure-photonic QPU vendor or a
              networking-fabric supplier. That boundary matters for valuation work: TAM should include distributed
              quantum-computing hardware, control, and networking infrastructure that this architecture actually needs,
              but should exclude generic classical HPC spend, non-photonic quantum modalities, and supplier categories
              that are enabling inputs rather than Photonic's direct product surface. Status-quo substitutes remain
              classical HPC, secure-network overlays, and rival quantum architectures attacking the same long-term
              chemistry, optimization, and security workloads from different hardware bases.
            claimRefs:
              - CM001
              - CM002
              - CM007
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM006
              - CM007
              - CM008
              - CM014
      - number: '2.2'
        title: 'Sizing lenses: a real modality TAM, but an unproven company-level SAM/SOM'
        blocks:
          - type: paragraph
            body: >-
              Only one clean public market-sizing source in the assigned pool gives hard numbers: the ResearchAndMarkets
              synopsis syndicated by Yahoo says photonic quantum computing was USD 175.7 million in 2025 and could reach
              USD 5.8 billion by 2035 at roughly 40% CAGR, with hardware at 52.7% of 2025 spend. That is useful as a
              modality ceiling, not a direct company SAM. The same source says growth is being driven by
              silicon-photonics manufacturability and secure-communications investment; Photonic's own product
              positioning then narrows the relevant slice further to distributed, telecom-linked hardware and
              networking. In other words, the broad modality TAM is real, but the investable near-term wedge is the
              subset of hardware, control, and network-integration spend that converts into data-center, carrier, and
              public-sector deployments. Public evidence still stops short of revenue, pricing, and deployment counts
              that would turn that wedge into a defensible SOM.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM014
