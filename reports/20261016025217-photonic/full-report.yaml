      - number: '4.3'
        title: Underwriting still depends on private finance-room evidence
        blocks:
          - type: paragraph
            body: >-
              The best public case for Photonic is that it has assembled a large capital base, strategic investors, and
              technically relevant partners at a time when independent sector sources still see material upside in
              photonic quantum computing. The public bear case is that the same independent sources also highlight
              photon loss, manufacturing scale, and cost viability as unresolved barriers, while paid market-outlook
              material cannot substitute for company-specific evidence of demand or margins. The result is a business
              that looks better financed than proven. A serious investment view still requires private evidence on
              booked revenue, customer mix, margin structure, cash use, and the conversion of technical milestones into
              repeatable commercial contracts.
