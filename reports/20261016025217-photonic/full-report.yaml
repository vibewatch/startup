              - CP006
              - CP007
              - CP008
              - CP009
              - CP011
              - CP012
      - number: '3.2'
        title: Architecture and capability tradeoffs define the real buyer choice
        blocks:
          - type: paragraph
            body: >-
              Photonic's differentiation is not generic "photonic quantum computing" but telecom-native distributed
              entanglement. Its official materials stress switched optical networking, module-to- module connectivity,
              and error-correction efficiency from a highly connected architecture; partner materials from Microsoft and
              TELUS reinforce the same point by centering telecom wavelengths, Azure integration, and commercial fibre
              trials. The nearest rivals, however, differentiate on other axes: PsiQuantum on capital-intensive
              deployment and silicon-photonic fault-tolerance, Xanadu on cloud availability plus developer tooling,
              Quandela on single-photon systems delivered through cloud partners, and ORCA on quantum-memory-led hybrid
              deployments. That means buyer switching is less about "best photonic company" in the abstract and more
              about whether the buyer values distributed networking and telecom compatibility more than immediate
              access, installed infrastructure, or software ecosystem reach.
            claimRefs:
              - CP001
              - CP002
