              - CU002
              - CU005
              - CU007
              - CU008
              - CU011
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: TELUS is more than a logo
            body: >-
              The TELUS relationship is the clearest public adoption proof because it combines a live commercial-fibre
              demonstration with an expanded collaboration agreement, not just a customer logo or investor mention.
            calloutType: strength
            claimRefs:
              - CU002
              - CU003
              - CU008
              - CU009
          - type: callout
            title: Customer concentration is visible before revenue concentration is
            body: >-
              Public proof is concentrated in one named telecom relationship, while other named parties mostly validate
              the theme rather than proving paid, repeatable production usage.
            calloutType: risk
            claimRefs:
              - CU007
              - CU011
              - CU012
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-ranked risk stack
        blocks:
          - type: paragraph
            body: |-
              The most severe public risk is technical scale-up risk, because Photonic's thesis still depends
              on proving that distributed entanglement, efficient error correction, and thousands of stable
              qubits can move from architecture narrative to repeatable system performance. Independent
              photonic-market coverage still frames photon loss, deterministic generation, and scalable error
              correction as unresolved barriers, while competitors such as PsiQuantum, Xanadu, and Quandela
              already have hardware deployments or cloud access in market. That combination makes timing
              slippage more damaging for Photonic than for a conventional deep-tech company: if public
              milestones drift while peers keep shipping, the premium "commercial first" narrative weakens
              before outsiders can underwrite customer traction.
            claimRefs:
              - CR003
              - CR006
              - CR007
              - CR014
              - CR015
              - CR016
          - type: table
            tableRef: TR002
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR014
              - CR015
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR003
              - CR006
              - CR007
              - CR012
              - CR014
              - CR016
      - number: '7.2'
        title: Regulatory and strategic dependencies
        blocks:
          - type: paragraph
            body: |-
              The legal and regulatory problem is not a documented public enforcement event; it is that the
              assigned evidence places Photonic directly in sensitive domains without clearing the diligence
              questions that matter most. The company is pitching secure telecom-networked quantum systems,
              is using carrier infrastructure for field validation, and is pairing commercialization with
              strategic capital from financial and telecom institutions. That raises obvious export-control,
              information-security, procurement, and intellectual-property diligence requirements, but the
              public pool does not resolve them with regulator filings, trust artifacts, or litigation
              records. This keeps the risk in "unresolved diligence" territory rather than "known legal
              defect" territory, but it is still high consequence because a negative answer on any of those
              workstreams could slow deployment or narrow the addressable customer set.
            claimRefs:
              - CR002
              - CR012
              - CR013
              - CR015
              - CR016
          - type: table
            tableRef: TR001
            claimRefs:
              - CR002
              - CR012
              - CR013
              - CR015
              - CR016
      - number: '7.3'
        title: Partner, capital, and kill criteria
        blocks:
          - type: paragraph
            body: |-
              Public evidence suggests that Photonic has reduced financing risk in the near term, but not
              eliminated dependency risk. The 2026 round materially expanded capital, yet the same evidence
              ties commercialization to deeper customer and partner engagement rather than to disclosed
              recurring revenue or named production deployments. TELUS is central to the most visible field
              proof, while BCI, Microsoft, RBC, and TELUS all appear as strategically meaningful investors
              or supporters. The right kill criteria are therefore operational and externally observable: a
              missed fault-tolerance or deployment milestone, loss of strategic network access, inability to
              surface credible customer proof, or a financing path that keeps growing faster than public
              commercial evidence.
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR005
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
              - CR016
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Thesis-break trigger
            body: >-
              If Photonic misses public fault-tolerance or customer-access milestones while peer photonic vendors keep
              adding deployments or cloud access, the execution risk becomes thesis-breaking before the company runs out
              of capital.
            calloutType: risk
            claimRefs:
              - CR007
              - CR008
              - CR015
          - type: callout
            title: Highest-value diligence pack
            body: >-
              The shortest path to de-risking this chapter is a combined legal, customer, and operating-data pack:
              export-control and FTO memos, named production references, reliability metrics, and a financing plan tied
              to concrete commercialization milestones.
            calloutType: recommendation
            claimRefs:
              - CR009
              - CR012
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Financing validation improved, but price support is still narrative-heavy
        blocks:
          - type: paragraph
            body: >-
              Photonic's 2026 capital formation is real and independently corroborated: the January first close brought
              in C$180M ($130M) and the May final close pushed the round above $200M and the headline valuation to $2B.
              That matters because the buyer set was not a narrow venture syndicate; it included strategic names such as
              TELUS, RBC, Microsoft, and BCI, followed by BDC, EDC, Bell Ventures, and other public- or strategically
              aligned capital at the final close. Even so, the public evidence supporting the mark is still framed
              around technical promise, milestone execution, and strategic alignment rather than disclosed revenue,
              customer adoption, or margin proof. That makes the financing a meaningful validation event, but not yet a
              sufficient fair-value anchor for an outside investor who has to underwrite downside at entry.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV006
              - CV012
              - CV013
          - type: table
            tableRef: TV001
            claimRefs:
              - CV003
              - CV004
              - CV012
              - CV013
              - CV014
      - number: '8.2'
        title: The upside case is differentiated architecture; the anti-thesis is commercialization proof lag
        blocks:
          - type: paragraph
            body: >-
              The constructive case for Photonic is not just that it raised a large round. It is that the company
              combines a differentiated silicon T-centre architecture with telecom-native connectivity, a demonstrated
              30 km TELUS fibre teleportation milestone, and a capital base that includes cloud, telecom, and
              sovereign-adjacent partners who could matter if the platform reaches commercial relevance. That said,
              public evidence still describes the story as architecture-first. Independent sector sources emphasize
              unresolved photonic barriers in photon loss, deterministic generation, and scalable error correction, and
              separate supply-chain analysis argues the photonic QPU stack remains proprietary and not yet independently
              assemblable. In valuation terms, that means investors are still paying ahead of broadly disclosed
              operating proof while better-known and often better-disclosed peers continue to compete for the same
              future fault-tolerant quantum narrative.
            claimRefs:
              - CV005
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV015
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV006
              - CV007
              - CV009
              - CV010
              - CV011
              - CV012
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV003
              - CV006
              - CV007
              - CV009
              - CV010
              - CV012
              - CV013
              - CV014
      - number: '8.3'
        title: Scenario framing favors disciplined entry over urgency
        blocks:
          - type: paragraph
            body: >-
              The right base case is not that Photonic lacks merit; it is that the current public package still leaves
              too much of the return case dependent on future disclosure and execution. A bull case can work if the 2026
              funding, TELUS/Microsoft-style partnerships, and DARPA/CQCP references translate into paid deployments,
              cloud exposure, and clearer evidence of fault-tolerance progress. The base case is that those milestones
              continue, but the company stays metric-light long enough that the present valuation already discounts much
              of the upside. The bear case is that commercialization timing slips, the photonic field stays crowded, and
              a future round or secondary mark resets lower before public revenue proof catches up. That is why entry
              discipline matters more here than generic admiration for the team or the technology stack.
            claimRefs:
              - CV003
              - CV005
              - CV009
              - CV010
              - CV011
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV009
              - CV010
              - CV011
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: What would move the recommendation
        blocks:
          - type: paragraph
            body: >-
              The recommendation can improve, but the evidence threshold is specific. Photonic needs to show that the
              capital raised is converting into customer proof, commercial milestones, and a cleaner underwriting
              surface on terms. The biggest public gap is not whether investors exist; it is whether outside investors
              can test the same price against revenue quality, deployment depth, concentration, gross margin direction,
              and liquidation preference overhang. If diligence produces that operating evidence and the company is
              still entering at a rational price, the thesis can move toward invest. If diligence instead shows soft
              commercial traction, heavy preference protection, or slower-than-expected path to scalable systems, the
              present mark would look more like peak narrative pricing than a disciplined entry point.
            claimRefs:
              - CV005
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Recommendation
            body: >-
              Keep Photonic at research-more. The financing and technical evidence are strong enough to justify
              continued attention, but not yet strong enough to support price-insensitive conviction at the current
              disclosed mark.
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV012
              - CV013
              - CV014
          - type: callout
            title: Thesis-break trigger
            body: >-
              If deeper diligence shows weak customer conversion, heavy liquidation-preference protection, or slower
              commercialization than the narrative implies, the current valuation would look materially too rich.
            calloutType: risk
            claimRefs:
              - CV010
              - CV014
              - CV016
