              - CP014
      - number: '3.4'
        title: The moat is real in networking, but commercialization timing remains the vulnerable flank
        blocks:
          - type: paragraph
            body: >-
              Photonic's moat looks strongest where telecom-native networking and modular scale-out matter, because
              multiple company, partner, and independent sources consistently return to that same design choice. The
              adverse read is that this moat may not be the buying criterion that closes the next commercial deal if
              better-productized rivals keep advancing cloud access, deployments, and public proof points first.
              PostQuantum's warning that photonic supply chains remain vertically integrated reinforces both sides of
              the case: the architecture is hard to copy quickly, but it also means buyers have limited interoperability
              and may prefer the vendor with the most visible route to production use. For diligence, the key
              competitive question is therefore not whether Photonic has a differentiated architecture, but whether it
              can convert that architecture into a clearer buyer offer before deployment-led or software-led peers
              become the default evaluation shortlist.
            claimRefs:
              - CP010
              - CP011
              - CP014
