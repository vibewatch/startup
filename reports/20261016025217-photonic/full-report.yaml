      - number: '3.3'
        title: Distribution leverage is improving, but commercialization remains less transparent than rivals
        blocks:
          - type: paragraph
            body: >-
              Photonic has meaningful distribution partners, but the retained public evidence still describes a channel
              strategy more than a fully visible product motion. Microsoft frames the relationship around future Azure
              Quantum Elements integration, while TELUS and Photonic frame the telecom partnership around quantum-secure
              networking projects and infrastructure pilots. By contrast, several rivals already advertise clearer
              access points: PostQuantum's survey says PsiQuantum, Xanadu, and Quandela had reached deployment or cloud
              access milestones in 2026, and the retained sector roundups add specific signals such as Borealis cloud
              availability, MosaiQ or OVHcloud access, and purpose-built compute-center deployments. The public
              materials are far weaker on buyer economics: the retained comparator sources describe access models and
              milestones, but they do not disclose list pricing for Photonic or the main peer set, leaving packaging and
              contract structure inferable only in broad terms.
