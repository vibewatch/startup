chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, footprint, and product posture
        blocks:
          - type: paragraph
            body: >-
              Photonic positions itself as a distributed quantum computing and networking company rather than a
              single-box quantum hardware vendor. The company's own materials tie that position to an Entanglement First
              architecture using silicon spin-photon qubits and telecom-compatible optical interconnects, and they frame
              the route to market around cloud access through Microsoft Azure as well as dedicated private systems.
              Public profile evidence is consistent that the company was founded in 2016, moved into commercialization
              in 2021, and operates from British Columbia with activity in the United States and United Kingdom. That
              gives later chapters a stable identity anchor, but it does not convert Photonic's commercialization claims
              into verified revenue or customer traction.
