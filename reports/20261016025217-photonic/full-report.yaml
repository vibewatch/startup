        title: Leadership, founders, and capital base
        blocks:
          - type: paragraph
            body: >-
              The public record points to a founder-led technical origin with a more commercially seasoned executive
              overlay. Independent profiles identify Stephanie Simmons as founder and Chief Quantum Officer, while Don
              Mattrick appears as CEO in 2026. Public funding records also show a multi-step capital story: a Series D
              in late 2023, a large first close in January 2026, and a reported final close in May 2026. The caution is
              that public trackers do not converge on a single number for total capital raised, valuation, or headcount,
              and the public cap-table still lacks enough detail to judge control rights or dilution risk from outside
              the company.
