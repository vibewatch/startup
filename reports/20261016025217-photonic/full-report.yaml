      - number: '5.3'
        title: Maturity, dependencies, and technical-control gaps
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports a credible architecture direction, but not a de-risked operating product.
              Independent sector coverage still frames photonic quantum computing as constrained by photon loss,
              deterministic generation, and scalable error correction, while systems integration analysis argues the
              photonic supply chain remains vertically integrated rather than modular. Those constraints matter because
              Photonic's own positioning depends on eventually connecting modules, repeaters, cloud control, and error
              correction into one working service. The assigned pool also does not surface public security
              certifications, uptime tooling, or external developer-ecosystem evidence, so trust, compliance, and
              practitioner-adoption claims should remain diligence items rather than underwritten strengths.
            claimRefs:
