        title: Who appears to pay, use, and sponsor the product
        blocks:
          - type: paragraph
            body: >-
              The public evidence points to infrastructure-scale buyers rather than broad software users. Photonic's own
              commercial framing ties the product to telecom and data-centre environments, while the TELUS collaboration
              anchors the clearest named operating context in a live communications network. Independent ecosystem
              coverage and investor commentary broaden that picture toward financial-services security, sovereign or
              critical infrastructure, and research or compute-operator use cases, but those adjacencies are still
              demand signals rather than disclosed recurring customers. The public record does not identify a payer or
              procurement budget, so production purchasing authority and operating-budget adoption remain unproven.
