  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      Public evidence concentrates the highest residual risk in scale-up, commercialization proof, and dependency
      replication.
    data:
      columns:
        - label: Likelihood
          detail: Relative probability implied by the assigned public record.
        - label: Impact
          detail: Effect on the investment case if the risk materializes.
        - label: Mitigation maturity
          detail: How concrete the public mitigation evidence is today.
        - label: Residual exposure
          detail: Net risk after the mitigation evidence visible in this chapter.
      rows:
        - label: Fault-tolerance scale-up
          note: Core architecture risk.
          values:
            - label: High
              tone: critical
              detail: Independent coverage still flags error correction and photon-loss barriers.
            - label: High
              tone: critical
              detail: This is the main condition for the commercialization thesis.
            - label: Medium
              tone: warning
              detail: Company materials describe QLDPC and distributed entanglement, but public production proof is limited.
            - label: High
              tone: critical
              detail: Public upside is still tightly coupled to this risk clearing.
        - label: Deployment timeline versus peers
          note: Execution and market-timing risk.
          values:
            - label: Medium-High
              tone: warning
              detail: Peers already show hardware deployments or cloud access in 2026.
            - label: High
              tone: critical
              detail: Delay erodes technical differentiation and financing leverage.
            - label: Medium
              tone: warning
              detail: The company has milestone messaging, but public deployment proof remains thinner than peer availability.
            - label: High
              tone: critical
              detail: Residual exposure stays elevated until customer-facing access becomes visible.
        - label: Partner concentration
          note: Carrier and strategic-capital dependence.
          values:
            - label: Medium
              tone: warning
              detail: TELUS and strategic investors are central in the assigned public record.
            - label: Medium-High
              tone: warning
              detail: Loss of a flagship partner would weaken the field-validation story.
            - label: Medium
              tone: warning
              detail: The latest round broadens the cap table, but not enough to prove partner independence.
            - label: Medium-High
              tone: warning
              detail: Residual dependence remains visible until alternative proofs appear.
        - label: Legal / compliance diligence
          note: No public blocker surfaced, but key answers are missing.
          values:
            - label: Medium
              tone: warning
              detail: Quantum networking and telecom use cases naturally raise export, security, and procurement questions.
            - label: High
              tone: critical
              detail: A negative diligence outcome could narrow customer access materially.
            - label: Low
              tone: neutral
              detail: Assigned public sources do not provide regulator-grade clearance evidence.
            - label: Medium-High
              tone: warning
              detail: Exposure remains elevated until legal and security workstreams are evidenced.
        - label: Commercial proof opacity
          note: Public traction evidence remains thin.
          values:
            - label: High
              tone: critical
              detail: Assigned sources emphasize funding and partner engagement more than named production deployments.
            - label: Medium-High
              tone: warning
              detail: Opaque conversion from technical milestones to revenue makes valuation hard to underwrite.
            - label: Low-Medium
              tone: neutral
              detail: The public mitigation today is mostly narrative rather than customer evidence.
            - label: High
              tone: critical
              detail: Residual exposure stays high until customer references and revenue quality improve.
        - label: Capital intensity visibility
          note: Recent financing helps, but operating transparency is still limited.
          values:
            - label: Medium
              tone: warning
              detail: Public evidence shows capital access, but not burn or runway detail.
            - label: Medium-High
              tone: warning
              detail: If commercialization lags spend, another raise could arrive before demand is externally visible.
            - label: Medium
              tone: warning
              detail: The visible mitigation is a larger round rather than disclosed operating leverage.
            - label: Medium-High
              tone: warning
              detail: Residual exposure remains material until burn and milestone pacing are clearer.
    claimRefs:
      - CR003
      - CR006
      - CR007
      - CR012
      - CR014
      - CR016
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: The recommendation stays constrained by the gap between strategic validation and public operating proof.
    data:
      nodes:
        - id: validation
          label: Validation
          value: 2026 round and strategic backers
          note: C$180M first close; >$200M final close; strategic and public-capital participation.
          tone: positive
        - id: differentiation
          label: Differentiation
          value: Telecom-native distributed architecture
          note: TELUS fibre milestone and T-centre modularity support a real technical wedge.
          tone: positive
        - id: gap
          label: Proof gap
          value: Operating metrics still undisclosed
          note: Public evidence is stronger on milestones than on revenue, customers, or margins.
          tone: warning
        - id: barriers
          label: Sector barriers
          value: Photonic modality still hard
          note: Independent sources highlight photon-loss, error-correction, and proprietary-stack risk.
          tone: risk
        - id: stance
          label: Valuation stance
          value: Stretched
          note: Headline valuation is corroborated but not yet benchmarked to disclosed unit economics.
          tone: warning
        - id: call
          label: Recommendation
          value: research-more / high risk
          note: Wait for operating proof, cleaner terms, or a more attractive price-sensitive entry.
          tone: risk
      edges:
        - from: validation
          to: differentiation
          label: capital backs the technical story
        - from: differentiation
          to: gap
          label: technical proof still needs commercial conversion
        - from: gap
          to: barriers
          label: missing metrics amplify execution risk
        - from: barriers
          to: stance
          label: crowded, difficult sector constrains fair-value confidence
        - from: stance
          to: call
          label: price-sensitive call stays cautious
    approximationNotes: Qualitative decision chain; it summarizes evidence relationships rather than a quantitative model.
    claimRefs:
      - CV003
      - CV006
      - CV007
      - CV009
      - CV010
      - CV012
      - CV013
      - CV014
