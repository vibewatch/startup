          note: Named evidence is strongest in telecom infrastructure.
          tone: positive
        - label: Live-network validation
          actor: TELUS network and Photonic technical teams
          phase: Proof
          touchpoints:
            - 30 km quantum teleportation over installed commercial fibre
            - Real-world transfer into a remote matter-based processing node
          note: Meaningful field proof, but not disclosed recurring usage.
          tone: positive
        - label: Productization thesis
          actor: Infrastructure buyers
          phase: Expansion hypothesis
          touchpoints:
            - Quantum data centres
            - Nationwide encrypted networks
            - Tamper-evident information transfer
          note: These are company-stated commercial targets rather than disclosed accounts.
          tone: neutral
        - label: Sector interest
          actor: Finance, telecom, and security stakeholders
          phase: Adjacent demand signal
          touchpoints:
