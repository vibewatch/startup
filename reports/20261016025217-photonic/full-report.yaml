            - TELUS venture commentary frames infrastructure upside
          note: Strategic endorsements are not equivalent to signed customers.
          tone: neutral
        - label: Commercial scale-up gate
          actor: Photonic go-to-market and product teams
          phase: Execution
          touchpoints:
