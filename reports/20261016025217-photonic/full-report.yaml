        title: Milestones, execution signals, and open diligence asks
        blocks:
          - type: paragraph
            body: >-
              The strongest verified 2024-2026 operating signals are technical and partnership-led rather than
              commercial. Independent coverage says Photonic demonstrated entanglement across separate modules in 2024
              and entered DARPA's Quantum Benchmarking Initiative Stage B in November 2025, while Photonic and TELUS
              later announced a 30 km quantum teleportation result over commercial fibre. Those milestones support
              technical ambition and investor interest, but independent commentary also frames the company as still
              early and not yet in the small set of photonic vendors with deployed hardware or cloud access in 2026.
              Combined with unaudited revenue estimates and absent customer disclosures, that leaves commercialization
              readiness and economic quality as the main unresolved overview risks.
