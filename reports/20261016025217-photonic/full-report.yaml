            body: >-
              The clearest public financial datapoints are capital formation and operating scale. Photonic disclosed a
              CA$180M (US$130M) first close in January 2026 and a US$200M final close in May 2026, while Quantum
              Computing Report says the company can also receive up to $23M from Canada's Quantum Champions Program.
              Public headcount also rose from 150+ experts in February 2026 to more than 160 by May 2026, reinforcing
