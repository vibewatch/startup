              - CU005
              - CU006
              - CU010
              - CU011
      - number: '6.4'
        title: Concentration risk is visible before retention data is
        blocks:
          - type: paragraph
            body: >-
              Because the assigned pool names essentially one operating telecom relationship and otherwise offers
              investor or ecosystem validation, concentration risk is already visible even before the company discloses
              revenue mix. TELUS appears repeatedly as network host, collaborator, and investor, while RBC and
              Microsoft-linked references show thematic demand interest rather than paid deployment proof. That leaves
              open whether land-and-expand is working, whether any single counterparty dominates commercial traction,
              and whether buyer identity differs from technical user identity once systems move beyond demonstrations.
              Those questions are material because the public evidence currently supports strategic relevance more
              clearly than diversified customer durability.
            claimRefs:
              - CU007
              - CU011
              - CU012
