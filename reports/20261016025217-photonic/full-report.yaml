  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape is narrow, but the photonic field is broadening fast
        blocks:
          - type: paragraph
            body: >-
              The direct competitive set is still concentrated in a handful of photonic-computing vendors, not a
              sprawling horizontal software market. Independent landscape roundups repeatedly place Photonic next to
              PsiQuantum, Xanadu, Quandela, and ORCA, while also distinguishing adjacent networking specialists such as
              Nu Quantum and Qunnect from full-stack compute vendors. That distinction matters because a buyer choosing
              Photonic is not simply choosing "a photonic company"; they are choosing a specific spin-photonic
              distributed architecture whose closest substitutes are other full-stack photonic platforms or a
              wait-and-see decision. The status-quo alternative of internal build is also weaker than it appears:
              PostQuantum's guide argues that independent photonic assembly is not yet practical and that the supply
              chain remains proprietary end to end, so most buyers cannot recreate a comparable stack by mixing
              third-party components.
            claimRefs:
              - CP005
              - CP011
              - CP012
          - type: table
            tableRef: TP001
            claimRefs:
