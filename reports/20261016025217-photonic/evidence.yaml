evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Audited or management-confirmed revenue, ARR, gross margin, burn, runway, and customer-count disclosures.
    whyItMatters: >-
      Without supported operating metrics, the overview can establish identity and financing momentum but not business
      quality or scale efficiency.
    diligencePath: >-
      Request a current KPI pack or board deck with metric definitions, monthly trend lines, and customer-count
      methodology.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: >-
      The exact 2026 financing structure, preference stack, ownership concentration, board rights, and dilution terms
      behind the headline valuation.
    whyItMatters: >-
      Public round headlines are not enough to judge whether the apparent valuation transfers cleanly into common-share
      economics or governance control.
    diligencePath: >-
      Request the current cap table, term sheet summary, and board observer or veto-rights schedule for the January and
      May 2026 closes.
    relatedQuestionRefs:
      - QO004
      - QO008
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: minor
    topic: governance
    missingEvidence: A complete current board roster and public evidence on committee structure or formal governance controls.
    whyItMatters: >-
      The chapter can name the founder and CEO, but not the full governance surface or how strategic investors influence
      decisions.
    diligencePath: Request the current board deck cover, charter summary, and post-financing board composition.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: photonic-sam
    missingEvidence: >-
      Company-level revenue, customer-count, deployment-count, and pricing data for distributed computing and networking
      products.
    whyItMatters: >-
      Without those inputs, the public modality TAM cannot be narrowed into a defensible Photonic SAM/SOM or adoption
      curve.
    diligencePath: >-
      Request pipeline by segment, paid pilot count, price-book or deal-size ranges, and revenue split between compute,
      networking, and services.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: budget-owner-proof
    missingEvidence: >-
      Named non-investor enterprise customers or procurement records showing who signs and renews budgets outside
      public-sector programs and strategic investors.
    whyItMatters: >-
      Budget ownership matters for adoption timing and for separating strategic partnership demand from repeatable
      commercial demand.
    diligencePath: >-
      Request named customer references, procurement or PO evidence, and renewal or expansion data by telecom, finance,
      and cloud channels.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: pricing-visibility
    missingEvidence: Public list pricing, standard contract terms, or disclosed pilot economics for Photonic and the main peer set.
    whyItMatters: >-
      Without buyer-economics evidence, the chapter can compare access models but not the real cost of switching or
      trialing each platform.
    diligencePath: >-
      Request current pricing decks, pilot SOW examples, and any public procurement documents from Photonic plus at
      least two direct peers.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: customer-access-maturity
    missingEvidence: >-
      Named production users, conversion funnels, and paid deployment references that show which platform is winning
      real buyer evaluations.
    whyItMatters: >-
      Public cloud or deployment announcements are useful, but they do not prove repeatable commercial adoption or lower
      switching friction.
    diligencePath: >-
      Ask management for current paid deployments, pilot-to-production conversion rates, and referenceable customers by
      segment.
    relatedQuestionRefs:
      - QP005
      - QP007
  - type: missing-source
    severity: minor
    topic: architecture-benchmarking
    missingEvidence: >-
      Consistent third-party benchmarks that compare photonic architectures on logical-qubit efficiency, networking
      performance, and fault-tolerance milestones.
    whyItMatters: >-
      The retained sources establish design differences, but they do not let investors normalize the competitive moat on
      a like-for-like performance basis.
    diligencePath: >-
      Obtain benchmarking studies, customer bake-off materials, or technical diligence memos that compare Photonic with
      PsiQuantum, Xanadu, and Quandela on the same evaluation criteria.
    relatedQuestionRefs:
      - QP003
      - QP006
  - type: private-evidence-only
    severity: material
    topic: revenue-disclosure-gap
    missingEvidence: >-
      Product-level revenue mix, recognized revenue, ARR if applicable, backlog, and pilot-to-production conversion
      data.
    whyItMatters: Public strategic milestones do not show whether technical progress is converting into repeatable paid demand.
    diligencePath: >-
      Request a monthly revenue bridge by product line, customer cohort, and contract stage plus sample customer
      agreements.
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Gross margin, hardware COGS, cloud/service delivery cost, and support burden by offering.
    whyItMatters: >-
      Margin path determines whether a large capital raise is building a durable business or just extending an expensive
      R&D cycle.
    diligencePath: >-
      Review product P&Ls, BOM assumptions, support staffing ratios, and target gross-margin bridge by commercial
      offering.
  - type: private-evidence-only
    severity: material
    topic: runway
    missingEvidence: Current cash balance, monthly net burn, debt obligations, capex plan, and base-case runway.
    whyItMatters: >-
      Capital adequacy cannot be judged from fundraising headlines alone, especially for a hardware- and
      talent-intensive company.
    diligencePath: Request treasury summary, debt schedule, capex plan, and 18-24 month operating model with downside sensitivities.
  - type: private-evidence-only
    severity: material
    topic: commercialization
    missingEvidence: Public SKU, pricing, access model, and buyer onboarding path for Photonic's compute or networking offering.
    whyItMatters: >-
      The chapter can support a credible platform narrative, but not underwrite near-term sellability without product
      packaging evidence.
    diligencePath: Request current product sheets, pilot-to-production conversion data, launch roadmap, and sample commercial terms.
    relatedTableRefs:
      - TE001
  - type: missing-source
    severity: material
    topic: trust-controls
    missingEvidence: Public security certifications, trust-center materials, uptime disclosures, or incident-history documentation.
    whyItMatters: >-
      Quantum-secure networking positioning is stronger if buyers can verify the operational and compliance controls
      around the product surface.
    diligencePath: >-
      Request SOC 2 / ISO status, customer security-review packs, incident logs, and any public status or assurance
      portal.
    relatedQuestionRefs:
      - QE007
  - type: private-evidence-only
    severity: material
    topic: developer-signal
    missingEvidence: Public SDK docs, repositories, package metrics, community forums, or other practitioner-community proxies.
    whyItMatters: >-
      The chapter brief explicitly asks for developer signal; without it, ecosystem readiness and external build
      momentum remain unclear.
    diligencePath: >-
      Request API or SDK documentation, partner enablement materials, and any external telemetry on developer or
      researcher usage.
    relatedQuestionRefs:
      - QE008
  - type: private-evidence-only
    severity: material
    topic: retention-gap
    missingEvidence: NRR, GRR, churn, renewal cadence, contract term, and top-customer revenue share.
    whyItMatters: >-
      Without durability metrics, the chapter cannot tell whether TELUS-like proof expands into sticky recurring revenue
      or remains a narrow strategic pilot set.
    diligencePath: >-
      Request cohort retention tables, renewal history, and top-10 customer concentration from management or the data
      room.
    relatedQuestionRefs:
      - QU005
      - QU006
  - type: missing-source
    severity: material
    topic: named-customer-coverage
    missingEvidence: >-
      Three to five named paying customers with deployment status, annual contract value, and measurable operating
      outcomes.
    whyItMatters: >-
      The current public record shows strategic relevance but not a diversified base of revenue-generating production
      accounts.
    diligencePath: Request customer-reference calls and an anonymized customer list split by pilot versus production.
    relatedQuestionRefs:
      - QU002
      - QU003
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: customer-journey
    missingEvidence: >-
      Pipeline counts, procurement-cycle length, buyer-versus-user identity by segment, and land-and-expand conversion
      data.
    whyItMatters: >-
      These details determine whether the telecom-led proof can generalize into repeatable commercial motion across
      verticals.
    diligencePath: Ask for pipeline funnel metrics, sales-cycle benchmarks, and segment-level payer maps during diligence.
    relatedQuestionRefs:
      - QU001
      - QU008
  - type: missing-source
    severity: material
    topic: legal-regulatory-diligence
    missingEvidence: >-
      Export-control analysis, procurement constraints, security certifications, litigation search results, and any
      regulator or court records touching Photonic's commercialization path.
