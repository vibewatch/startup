      - QR001
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: commercial-proof
    missingEvidence: >-
      Named production deployments, customer references, concentration metrics, renewal evidence, and any SLA or uptime
      reporting.
    whyItMatters: >-
      Without customer-proof, it is hard to determine whether partner demonstrations and technical milestones are
      converting into repeatable demand.
    diligencePath: >-
      Request reference calls, deployment lists, pilot-to-production conversion data, and customer concentration metrics
      segmented by revenue and strategic importance.
    relatedQuestionRefs:
      - QR007
    relatedTableRefs:
      - TR002
      - TR003
  - type: private-evidence-only
    severity: material
    topic: capital-intensity
