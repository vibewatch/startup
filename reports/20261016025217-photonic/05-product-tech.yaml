company:
  name: Photonic
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Photonic's public product story is a distributed quantum computing and networking stack,
    not a clearly packaged generally available compute service. The strongest public evidence is
    architectural specificity around telecom-linked silicon T-centre qubits plus partner
    milestones with Microsoft and TELUS; the public record is materially thinner on customer
    packaging, third-party performance benchmarks, and trust/compliance controls.
sections:
  - id: delivered-platform
    title: Delivered platform and buyer-facing product surface
    body: >-
      Photonic presents the product as a unified quantum computing and networking platform built
      around its Entanglement First architecture, with silicon spin qubits and telecom-native
      connectivity as the core design choices rather than a monolithic single-box machine. The
      official product pages and company-authored syndicated materials are specific about the
      technical ingredients - integrated-silicon modules, T-centre qubits, distributed
      entanglement, and future cloud integration - but they stop short of documenting a public
      SKU, list price, or generally available service tier. That means the chapter's product map
      should be read as a capability stack and commercialization path, not as proof that
      third-party buyers can already procure a production deployment on published commercial
      terms.
    claimRefs:
      - CE001
      - CE003
      - CE008
      - CE009
    tableRefs:
      - TE001
      - TE002
  - id: architecture-and-scaling-path
    title: Architecture, integration path, and proof points
    body: >-
      The architecture narrative is unusually concrete for a private quantum company. Photonic
      says scale comes from combining dense qubit integration inside silicon modules with
      distributed operation across telecom-networked modules, while the T-centre modality merges
      compute, memory, and optical connectivity in one silicon structure. Microsoft's partnership
      statement gives the clearest external operating-model view: staged work from point-to-point
      entanglement over telecom fibre, to a short-lived repeater capability, to a fault-tolerant
      network layer tied into Azure. TELUS provides the most tangible field milestone in the
      assigned pool, with a 30 km commercial-fibre teleportation demonstration that moves beyond
      purely on-chip lab claims but still falls short of customer production proof.
    claimRefs:
      - CE002
      - CE004
      - CE005
      - CE006
      - CE007
    tableRefs:
      - TE003
    figureRefs:
      - FE001
  - id: maturity-dependencies-and-control-gaps
    title: Maturity, dependencies, and technical-control gaps
    body: >-
      Public evidence supports a credible architecture direction, but not a de-risked operating
      product. Independent sector coverage still frames photonic quantum computing as constrained
      by photon loss, deterministic generation, and scalable error correction, while systems
      integration analysis argues the photonic supply chain remains vertically integrated rather
      than modular. Those constraints matter because Photonic's own positioning depends on
      eventually connecting modules, repeaters, cloud control, and error correction into one
      working service. The assigned pool also does not surface public security certifications,
      uptime tooling, or external developer-ecosystem evidence, so trust, compliance, and
      practitioner-adoption claims should remain diligence items rather than underwritten
      strengths.
    claimRefs:
      - CE008
      - CE010
      - CE011
      - CE012
tables:
  - id: TE001
    title: Product module / asset matrix
    columns:
      - Module / product line
      - Buyer / user
      - Status / maturity
      - Differentiation
      - Diligence gap
    rows:
      - - Entanglement First compute platform
        - Quantum-computing researchers, HPC partners, and future enterprise buyers
        - Public architecture and commercialization roadmap; no public GA service package
        - Built around telecom-linked silicon spin qubits and distributed entanglement
        - No published SKU, pricing, or access model
      - - T-centre qubit platform
        - Hardware, architecture, and networking teams inside Photonic's stack
        - Core modality described on official technical pages
        - Compute, memory, and communications integrated in one silicon structure
        - No independent device-level benchmark table in the assigned pool
      - - Quantum networking / repeater path
        - Telecom, cloud, and secure-networking partners
        - Demonstrated milestones plus staged Microsoft roadmap; not public production service
        - Uses standard telecom fibre and native photonic connectivity
        - No public SLA, availability region, or support terms
      - - Azure integration surface
        - Future cloud users and quantum ecosystem developers
        - Planned integration "as it becomes available"
        - Leverages Azure infrastructure rather than requiring a buyer-managed hardware estate
        - No launch date, access workflow, or customer references
    notes: >-
      Public sources describe capabilities and milestones; blank commercial terms reflect
      undisclosed packaging rather than negative evidence.
    claimRefs:
      - CE001
      - CE003
      - CE005
      - CE008
      - CE009
  - id: TE002
    title: Workflow / use-case table
    columns:
      - User job
      - Current workflow
      - Company solution
      - Measurable benefit
      - Limitation
    rows:
      - - Link remote quantum nodes
        - Separate devices and optical links are hard to coordinate at useful scale
        - Spin-photon architecture distributes entanglement over telecom fibre
        - 30 km commercial-fibre teleportation milestone with TELUS
        - Demo evidence is not the same as a customer production network
      - - Scale beyond one module
        - Monolithic systems face harder networking and modularity constraints
        - Entanglement First scales up inside modules and scales out across linked modules
        - Official architecture claims any-to-any connectivity across chips, racks, and data centres
        - No public module-count, throughput, or uptime benchmark
      - - Expose quantum networking through cloud infrastructure
        - Research hardware usually sits in isolated lab environments
        - Microsoft collaboration targets staged Azure integration
        - External partner describes a defined physical/link/network roadmap
        - Hardware availability is future-dated rather than live
      - - Build quantum-secure communications use cases
        - Classical fibre networks do not natively carry quantum information
        - Photonic uses telecom-band photons over existing commercial fibre
        - Partner materials connect the architecture to secure-networking applications
        - Public compliance, assurance, and incident-history evidence is absent
    notes: >-
      Benefits are milestone-level proof points from assigned sources, not contracted customer
      outcome metrics.
    claimRefs:
      - CE002
      - CE005
      - CE006
      - CE008
  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / component
      - Role
      - Dependency
      - Risk
    rows:
      - - T-centre silicon colour-centre qubit
        - Combines qubit operations, memory, and photon interface
        - Silicon material quality, spin control, and optical coupling
        - Public performance claims are still mostly company-authored
      - - Modular QPU / integrated-silicon module
        - Houses many T centres and forms the local compute building block
        - Packaging, cryogenics, and control electronics
        - No public yield, availability, or utilization data
      - - Telecom-fibre networking layer
        - Moves entanglement and quantum information across distance
        - Stable low-loss commercial fibre and repeater/control stack
        - Assigned evidence shows milestone demos, not scaled operations
      - - Error-correction stack
        - Supports fault tolerance and lower overhead logical computation
        - High-fidelity operations plus code/software co-design
        - No public end-to-end logical-qubit performance metrics
    notes: >-
      Risks emphasize what the assigned evidence does not yet verify independently, especially
      around scale, repeatability, and production operations.
    claimRefs:
      - CE002
      - CE003
      - CE004
      - CE010
      - CE011
figures:
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Public evidence describes Photonic as a layered stack from silicon T-centre qubits up
      through telecom-fibre networking, cloud integration, and end-use workloads.
    data:
      layers:
        - label: Workloads and outcomes
          detail: >-
            Messaging centers on scientific-computing, networking, and secure-communications use
            cases rather than a single packaged application.
          outputs:
            - label: Materials, chemistry, security, and networking workloads
        - label: Cloud and access surface
          detail: >-
            Partner messaging routes future access through Azure rather than a documented public
            standalone service tier.
          outputs:
            - label: Azure Quantum Elements integration
            - label: Hardware exposure "as it becomes available"
        - label: Networking and repeater layer
          detail: >-
            Microsoft describes a three-stage path from telecom-fibre entanglement to a reliable
            cloud-operational quantum repeater.
          modules:
            - label: Stage 1 physical entanglement
            - label: Stage 2 short-time quantum repeater
            - label: Stage 3 fault-tolerant network layer
        - label: Modular compute layer
          detail: >-
            Official architecture claims scale up inside integrated-silicon modules and scale out
            across chips, racks, and data centres.
          modules:
            - label: Integrated-silicon module
            - label: Connectivity across neighbouring qubits, chips, racks, and data centres
        - label: Qubit and memory layer
          detail: >-
            T centres combine compute, memory, and telecom-band photon interfaces in silicon.
          modules:
            - label: Up to four spin qubits per T centre
            - label: Native optical interconnect
            - label: Long-coherence nuclear-spin memory
        - label: Error correction and manufacturability
          detail: >-
            The stack depends on QLDPC-style fault tolerance and silicon manufacturing
            compatibility, but public end-to-end logical-qubit metrics are still absent.
          modules:
            - label: QLDPC / SHYPS error-correction path
            - label: Silicon photonic integrated circuit compatibility
            - label: 1K operating-temperature claim for T centres
    approximationNotes: >-
      This is a conceptual stack assembled from public descriptions; it does not imply that every
      layer is already commercially deployed.
    claimRefs:
      - CE002
      - CE003
      - CE005
      - CE006
      - CE007
