company:
  name: "Photonic"
chapter:
  number: 6
  title: "Customers"
  summary: >-
    Public adoption proof is real but narrow: the strongest named operating signal is
    the expanded TELUS relationship and a 30 km quantum-teleportation demonstration
    on installed commercial fibre. Beyond that, the assigned source pool shows sector
    interest and commercialization intent, but not disclosed customer counts,
    retention metrics, or diversified production references.
sections:
  - id: "customer-segments"
    title: "Who appears to pay, use, and sponsor the product"
    body: >-
      The public evidence points to infrastructure-scale buyers rather than
      broad software users. Photonic's own commercial framing ties the product
      to telecom and data-centre environments, while the TELUS collaboration
      anchors the clearest named operating context in a live communications
      network. Independent ecosystem coverage and investor commentary broaden
      that picture toward financial-services security, sovereign or critical
      infrastructure, and research or compute-operator use cases, but those
      adjacencies are still demand signals rather than disclosed recurring
      customers. The public record does not identify a payer or procurement
      budget, so production purchasing authority and operating-budget adoption
      remain unproven.
    claimRefs: ["CU001", "CU003", "CU010", "CU012"]
    tableRefs: ["TU001"]
    figureRefs: ["FU001"]
  - id: "adoption-proof"
    title: "Named adoption proof is meaningful but concentrated"
    body: >-
      TELUS is the only clearly named operating counterparty in the assigned
      pool, and that matters because the proof goes beyond a logo: Photonic
      says it used TELUS's existing PureFibre network to move quantum
      information over 30 km of installed commercial fibre, and independent
      coverage describes the milestone as a step toward practical deployment.
      The same announcement says the relationship broadened from a 2024
      partnership into a wider collaboration spanning quantum-secure networking
      and future quantum-infrastructure products. That is stronger than a bare
      customer list, but it still falls short of disclosed production revenue,
      multi-account usage, or repeated commercial deployments across named
      buyers.
    claimRefs: ["CU002", "CU008", "CU009"]
    tableRefs: ["TU002"]
  - id: "durability-and-expansion"
    title: "Durability, retention, and land-and-expand remain mostly unproven"
    body: >-
      The public record is much thinner on durability than on technical
      promise. Photonic's January 2026 financing announcement said the company
      would deepen customer and partner engagements and expand business teams,
      which implies commercialization work is ongoing, but it did not disclose
      customer count, booked revenue, contracts, or deployment volumes.
      Independent commentary is also cautious: one analyst profile scores the
      business much lower on commercial readiness than on technology or
      government positioning, and broader photonic-market coverage places
      public hardware deployment or cloud access with better-known peers. The
      result is a credible top-of-funnel story with limited public proof of
      renewals, cohort retention, or scale economics.
    claimRefs: ["CU004", "CU005", "CU006", "CU010", "CU011"]
  - id: "concentration-and-gaps"
    title: "Concentration risk is visible before retention data is"
    body: >-
      Because the assigned pool names essentially one operating telecom
      relationship and otherwise offers investor or ecosystem validation,
      concentration risk is already visible even before the company discloses
      revenue mix. TELUS appears repeatedly as network host, collaborator, and
      investor, while RBC and Microsoft-linked references show thematic demand
      interest rather than paid deployment proof. That leaves open whether
      land-and-expand is working, whether any single counterparty dominates
      commercial traction, and whether buyer identity differs from technical
      user identity once systems move beyond demonstrations. Those questions
      are material because the public evidence currently supports strategic
      relevance more clearly than diversified customer durability.
    claimRefs: ["CU007", "CU011", "CU012"]
    tableRefs: ["TU003"]
