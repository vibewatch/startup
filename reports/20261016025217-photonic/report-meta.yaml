companyProfile:
  summary: >-
    Photonic is a late-stage private quantum infrastructure company that pairs telecom-compatible silicon spin-photon
    architecture with distributed quantum networking ambitions. Public evidence shows a clear 2016 founding origin,
    commercialization efforts that began in 2021, and a 2026 financing cycle that strengthened partner validation
    through TELUS, Microsoft, RBC, BCI, and other backers. The public case is therefore credible on technical ambition
    and capital formation, but still thin on revenue, customer, and term-structure disclosure.
  founders:
    - name: Stephanie Simmons
      role: Founder & Chief Quantum Officer
      background: Technical founder associated with the silicon T-centre research line.
    - name: Michael Thewalt
      role: Co-founder
      background: Research-origin co-founder tied to the original silicon T-centre program.
  foundingLocation: Vancouver, British Columbia, Canada
  headquarters: Coquitlam, British Columbia, Canada
  productSummary: >-
    Photonic sells a distributed quantum-computing and quantum-networking platform built around silicon spin-photon
    qubits, modular QPUs, and telecom-compatible connectivity.
  customerFocus: >-
    Telecom operators, network-infrastructure providers, security-sensitive enterprises, and other buyers that would use
    quantum networking or early distributed-quantum access.
