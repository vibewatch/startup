    summary: >-
      Photonic sits at the high end of networking leverage but below the most publicized peers on
      buyer-visible access and commercialization maturity.
    data:
      xAxis:
        label: Networking / distribution leverage
        min: 1
        max: 5
        low: Single-system / limited distribution
        high: Telecom or network-led scale-out
        description: Ordinal score synthesized from retained sources
        scale: ordinal
      yAxis:
        label: Public commercial access maturity
        min: 1
        max: 5
        low: Pilot / roadmap
        high: Public cloud or deployment availability
        description: Ordinal score synthesized from retained sources
        scale: ordinal
      points:
        - label: Photonic
          x: 5
          y: 2
          detail: Telecom-native scale-out and partner leverage are strong, but public access still reads as roadmap-led.
          claimRefs: [CP001, CP003, CP014]
        - label: PsiQuantum
          x: 3
          y: 4
          detail: Deployment sites and capital scale are visible, even if access is not self-serve.
          claimRefs: [CP006, CP007]
        - label: Xanadu
          x: 2
          y: 5
          detail: Cloud access and software distribution are the clearest in the retained set.
          claimRefs: [CP006, CP008]
        - label: Quandela
          x: 2
          y: 4
          detail: Cloud partnerships and delivered systems create earlier evaluation paths than Photonic's roadmap.
          claimRefs: [CP006, CP009]
        - label: ORCA
          x: 2
          y: 3
          detail: Institutional deployment is visible, but networking leverage is less central than for Photonic.
          claimRefs: [CP009, CP014]
        - label: Nu Quantum / Qunnect
          x: 4
          y: 2
          detail: Strong networking relevance, but they are adjacent infrastructure vendors rather than full compute substitutes.
          claimRefs: [CP005]
    approximationNotes: >-
      Ordinal 1-5 coordinates summarize the retained source set's public signals on networking leverage
      and access maturity; they are not benchmark scores or inferred market share.
    claimRefs: [CP005, CP006, CP007, CP008, CP009, CP014]
