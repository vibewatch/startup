callouts:
- calloutType: strength
  title: Telecom-native distribution makes the buyer story legible
  body: Photonic is not selling only abstract future qubit count. The public wedge already maps to budget owners in telecom, security, public-sector programs, and cloud ecosystems that care about networked deployment, secure communications, and early access paths.
  claimRefs:
  - CM008
  - CM009
  - CM010
  - CM013
- calloutType: risk
  title: Broad photonic TAM overstates the current paid market for Photonic
  body: The clean public number is a modality-wide forecast. Until Photonic shows non-investor customer proof, public pricing, and repeatable deployment metrics, the company-specific SAM/SOM remains a diligence question rather than a number that should be modeled with false precision.
  claimRefs:
  - CM011
  - CM012
  - CM014
