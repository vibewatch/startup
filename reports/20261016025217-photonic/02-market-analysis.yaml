company:
  name: Photonic
chapter:
  number: 2
  title: Market Analysis
  summary: 'Photonic sits in a narrower market than generic quantum-computing TAM headlines imply: its public story is distributed, telecom-networked quantum hardware plus secure-networking infrastructure. The photonic modality is growing quickly on paper, but the company-level public evidence still supports a telecom/public-sector/financial-design-partner wedge rather than a quantified Photonic-specific SAM/SOM.'
sections:
- id: market-boundary
  title: 'Boundary: distributed quantum hardware plus networking, not the whole photonics stack'
  body: 'Public sources place Photonic at the intersection of photonic quantum computing and quantum networking, but not across the entire photonics ecosystem. Official architecture pages describe a system that scales through integrated-silicon modules and telecom-networked entanglement, while QuantumZeitgeist separately classifies Photonic as a photonic-spin-hybrid vendor rather than a pure-photonic QPU vendor or a networking-fabric supplier. That boundary matters for valuation work: TAM should include distributed quantum-computing hardware, control, and networking infrastructure that this architecture actually needs, but should exclude generic classical HPC spend, non-photonic quantum modalities, and supplier categories that are enabling inputs rather than Photonic''s direct product surface. Status-quo substitutes remain classical HPC, secure-network overlays, and rival quantum architectures attacking the same long-term chemistry, optimization, and security workloads from different hardware
    bases.'
  claimRefs:
  - CM001
  - CM002
  - CM007
  - CM014
  tableRefs:
  - TM001
- id: sizing-lenses
  title: 'Sizing lenses: a real modality TAM, but an unproven company-level SAM/SOM'
  body: 'Only one clean public market-sizing source in the assigned pool gives hard numbers: the ResearchAndMarkets synopsis syndicated by Yahoo says photonic quantum computing was USD 175.7 million in 2025 and could reach USD 5.8 billion by 2035 at roughly 40% CAGR, with hardware at 52.7% of 2025 spend. That is useful as a modality ceiling, not a direct company SAM. The same source says growth is being driven by silicon-photonics manufacturability and secure-communications investment; Photonic''s own product positioning then narrows the relevant slice further to distributed, telecom-linked hardware and networking. In other words, the broad modality TAM is real, but the investable near-term wedge is the subset of hardware, control, and network-integration spend that converts into data-center, carrier, and public-sector deployments. Public evidence still stops short of revenue, pricing, and deployment counts that would turn that wedge into a defensible SOM.'
  claimRefs:
  - CM004
  - CM005
  - CM006
  - CM014
  tableRefs:
  - TM002
  figureRefs:
  - FM001
- id: buyers-drivers-constraints
  title: Buyer map, adoption path, and the constraints that still govern timing
  body: 'Early buyer evidence clusters around stakeholders that already own security, network, or quantum-program budgets. TELUS is both proof point and archetype: the partnership used installed commercial fibre over 30 km and explicitly framed follow-on products around quantum data centers and encrypted networks. RBC''s investment thesis points to financial-sector uses in security, portfolio optimization, and risk modelling, while SVIC and PostQuantum show that DARPA/QBI and Canada''s Quantum Champions Program are still central public-sector payers. Entangled Future adds a cloud/platform route via Azure Quantum. The same evidence also explains why adoption timing remains uncertain: PostQuantum says the architecture still must prove cryogenic operability, entanglement rates, large-scale synchronization, and customer proof beyond governments and investor-partners. That makes Photonic easier to underwrite as a strategically important wedge in secure and networked quantum infrastructure than
    as a broadly commercialized enterprise-software-style market today.'
  claimRefs:
  - CM008
  - CM009
  - CM010
  - CM011
  - CM012
  - CM013
  tableRefs:
  - TM003
