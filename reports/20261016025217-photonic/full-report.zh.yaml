              法律和监管问题不是已记录的公开执法事件，而是指定证据将 Photonic
              直接置于敏感领域，却没有解决最重要的尽调问题。公司正在推销安全的电信网络化量子系统，利用运营商基础设施进行实地验证，并将商业化与金融及电信机构的战略资本结合。这显然带来出口管制、信息安全、采购和知识产权尽调要求，但公开资料池没有通过监管申报、信任材料或诉讼记录解决这些问题。因此，风险仍属于“未解决的尽调”，而非“已知法律缺陷”；不过后果依然严重，因为任何一项工作流给出负面答案，都可能拖慢部署或缩小可服务客户范围。
