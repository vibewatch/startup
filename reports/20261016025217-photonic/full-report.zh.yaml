  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局仍窄，但光子领域正在快速扩张
        blocks:
          - type: paragraph
            body: >-
              直接竞争者仍集中在少数光子计算厂商，而不是一个庞大的横向软件市场。独立行业综述反复将 Photonic 与 PsiQuantum、Xanadu、Quandela 和 ORCA 放在一起，同时把 Nu
              Quantum、Qunnect 等相邻网络专家与全栈计算厂商区分开来。这个区别很重要：选择 Photonic
              的买家并非只是选择“一家光子公司”，而是在选择特定的自旋-光子分布式架构，其最接近的替代方案是其他全栈光子平台，或暂缓决定。内部自建这一现状替代方案也没有看上去那么强：PostQuantum
              指南认为独立组装光子系统目前尚不实用，供应链端到端仍是专有的，因此多数买家无法靠混合第三方组件重建可比栈。
            claimRefs:
              - CP005
              - CP011
              - CP012
