      - number: '2.3'
        title: 买家地图、采用路径与仍决定时点的约束
        blocks:
          - type: paragraph
            body: >-
              早期买家证据集中在已经掌握安全、网络或量子项目预算的利益相关者。TELUS 既是验证点也是典型买家：合作利用了 30 km 的既有商用光纤，并明确将后续产品定位于量子数据中心和加密网络。RBC
              的投资逻辑指向金融行业的安全、投资组合优化和风险建模用途；SVIC 与 PostQuantum 则显示，DARPA/QBI 和加拿大 Quantum Champions Program
              仍是重要的公共部门付款方。Entangled Future 还通过 Azure Quantum 提供了云/平台路径。同一组证据也解释了采用时点为何不确定：PostQuantum
              称，该架构仍须证明低温可运行性、纠缠速率、大规模同步，以及超出政府和投资者合作伙伴范围的客户验证。因此，与其说 Photonic
              已是广泛商业化的企业软件式市场，不如把它看作安全和网络化量子基础设施中具有战略意义的切入口。
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM008
              - CM009
