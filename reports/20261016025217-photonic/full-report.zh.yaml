          note: 战略背书不等同于已签约客户。
          tone: neutral
        - label: 商业规模化关口
          actor: Photonic 市场进入与产品团队
          phase: 执行
          touchpoints:
            - 2026 年融资，用于深化客户和合作伙伴关系
            - 路线图仍瞄准早期逻辑量子比特里程碑
          note: 商业覆盖面取决于技术和合作伙伴执行。
          tone: neutral
        - label: 持续性缺口
          actor: 投资人和尽调团队
          phase: 未解决
          touchpoints:
            - 没有公开的 NRR、GRR、流失率或头部客户占比
            - 没有多元化的具名付费生产客户清单
          note: 这是判断客户集中度和扩张质量的主要障碍。
          tone: risk
    approximationNotes: 该旅程图按证据排序，而非按转化率缩放。
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU007
      - CU010
      - CU011
      - CU012
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 公开证据显示，最高的剩余风险集中在规模化、商业化验证和依赖复制上。
    data:
      columns:
        - label: 可能性
          detail: 已分配公开记录所暗示的相对概率。
        - label: 影响
          detail: 风险发生后对投资逻辑的影响。
        - label: 缓释成熟度
          detail: 当前公开缓释证据的具体程度。
        - label: 剩余暴露
          detail: 扣除本章可见缓释证据后的净风险。
      rows:
        - label: 容错规模化
          note: 核心架构风险。
          values:
            - label: 高
              tone: critical
              detail: 独立报道仍指出纠错和光子损失障碍。
            - label: 高
              tone: critical
              detail: 这是商业化假设成立的主要条件。
            - label: 中
              tone: warning
              detail: 公司材料描述了 QLDPC 和分布式纠缠，但公开生产验证有限。
            - label: 高
              tone: critical
              detail: 公开上行空间仍与该风险能否消除高度绑定。
        - label: 相对同行的部署时间线
          note: 执行和市场时机风险。
          values:
            - label: 中高
              tone: warning
              detail: 同行在 2026 年已经展示硬件部署或云访问能力。
            - label: 高
              tone: critical
              detail: 延迟会削弱技术差异化和融资杠杆。
            - label: 中
              tone: warning
              detail: 公司有里程碑叙事，但公开部署验证仍弱于同行的可用性。
            - label: 高
              tone: critical
              detail: 在面向客户的访问能力变得可见之前，剩余暴露仍处于高位。
        - label: 合作伙伴集中度
          note: 对运营商和战略资本的依赖。
          values:
            - label: 中
              tone: warning
              detail: TELUS 和战略投资人是已分配公开记录的核心。
            - label: 中高
              tone: warning
              detail: 失去旗舰合作伙伴会削弱现场验证叙事。
            - label: 中
              tone: warning
              detail: 最新一轮融资扩大了股权结构表，但不足以证明合作伙伴独立性。
            - label: 中高
              tone: warning
              detail: 在出现替代性验证之前，剩余依赖仍然可见。
        - label: 法律 / 合规尽调
          note: 尚未发现公开层面的阻碍，但关键答案仍缺失。
          values:
            - label: 中
              tone: warning
              detail: 量子网络和电信用例天然会引出出口、安全和采购问题。
            - label: High
              tone: critical
              detail: 负面的尽调结果可能实质性收窄客户访问范围。
            - label: 低
              tone: neutral
              detail: 已分配的公开来源没有提供监管级别的许可证据。
            - label: 中高
              tone: warning
              detail: 在法律和安全工作流得到证据支持之前，风险暴露仍处于高位。
        - label: 商业验证不透明
          note: 公开牵引力证据仍然薄弱。
          values:
            - label: 高
              tone: critical
              detail: 已分配来源更强调融资和合作伙伴关系，而非具名生产部署。
            - label: 中高
              tone: warning
              detail: 从技术里程碑到收入的转换不透明，使估值难以纳入投资判断。
            - label: 中低
              tone: neutral
              detail: 当前公开的缓释依据主要是叙事，而不是客户证据。
            - label: 高
              tone: critical
              detail: 在客户背书和收入质量改善之前，剩余暴露仍处于高位。
        - label: 资本密集度透明度
          note: 近期融资有所帮助，但运营透明度仍然有限。
          values:
            - label: 中
              tone: warning
              detail: 公开证据显示公司能够获得资本，但没有烧钱速度或资金续航的细节。
            - label: 中高
              tone: warning
              detail: 如果商业化落后于支出，下一轮融资可能在需求对外显现之前就到来。
            - label: 中
              tone: warning
              detail: 可见的缓释手段是更大规模的融资，而非已披露的经营杠杆。
            - label: 中高
              tone: warning
              detail: 在烧钱速度和里程碑推进节奏更加清晰之前，剩余暴露仍然重大。
    claimRefs:
      - CR003
      - CR006
      - CR007
      - CR012
      - CR014
      - CR016
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 战略验证与公开运营证明之间的缺口，仍然限制着最终建议。
    data:
      nodes:
        - id: validation
          label: 验证
          value: 2026 round and strategic backers
          note: C$180M 首轮交割；>$200M 最终交割；战略资本和公众资本参与。
          tone: positive
        - id: differentiation
          label: 差异化
          value: Telecom-native distributed architecture
          note: TELUS 光纤里程碑和 T-centre 模块化支撑真实的技术切入点。
          tone: positive
        - id: gap
          label: 证明缺口
          value: Operating metrics still undisclosed
          note: 公开证据更多集中在里程碑，收入、客户和利润率的证据较少。
          tone: warning
        - id: barriers
          label: 行业壁垒
          value: Photonic modality still hard
          note: 独立来源强调光子损失、纠错和专有技术栈风险。
          tone: risk
        - id: stance
          label: 估值立场
          value: Stretched
          note: 标题估值已得到交叉印证，但尚未与披露的单位经济性进行基准比较。
          tone: warning
        - id: call
          label: 建议
          value: research-more / high risk
          note: 等待运营证明、更清晰的条款，或更具吸引力的价格敏感型入场机会。
          tone: risk
      edges:
        - from: validation
          to: differentiation
          label: 资本为技术叙事提供支撑
        - from: differentiation
          to: gap
          label: 技术验证仍需转化为商业成果
        - from: gap
          to: barriers
          label: 指标缺失放大执行风险
        - from: barriers
          to: stance
          label: 拥挤且艰难的行业限制公允价值判断信心
        - from: stance
          to: call
          label: 价格敏感型判断保持谨慎
    approximationNotes: 定性决策链；它总结证据关系，而非量化模型。
    claimRefs:
      - CV003
      - CV006
      - CV007
      - CV009
      - CV010
      - CV012
      - CV013
      - CV014
