companyProfile:
  summary: >-
    Photonic 是一家后期私有量子基础设施公司，将电信兼容的硅自旋-光子架构与分布式量子网络愿景结合起来。公开证据显示，公司明确创立于 2016 年，2021 年开始商业化，并在 2026 年融资周期中借助
    TELUS、Microsoft、RBC、BCI 及其他支持者强化了合作伙伴验证。因此，公开案例足以支撑其技术抱负和资本形成，但收入、客户和条款结构披露仍很薄弱。
