        title: 资本状况强于收入可见度
        blocks:
          - type: paragraph
            body: >-
              最清晰的公开财务数据点是资本形成和运营规模。Photonic 披露 2026 年 1 月首轮交割 CA$180M（US$130M），并于 2026 年 5 月完成 US$200M 最终交割；Quantum
