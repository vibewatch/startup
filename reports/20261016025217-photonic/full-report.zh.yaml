  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 边界：分布式量子硬件加网络，而非整个光子学栈
        blocks:
          - type: paragraph
            body: >-
              公开来源将 Photonic 放在光子量子计算与量子网络的交汇处，但并未覆盖整个光子学生态。官方架构页面描述了通过集成硅模块和电信网络化纠缠实现扩展的系统，而 QuantumZeitgeist 则将
              Photonic 单独归类为光子-自旋混合厂商，而非纯光子 QPU 厂商或网络织物供应商。这一边界对估值很重要：TAM 应包括该架构确实需要的分布式量子计算硬件、控制和网络基础设施，但应排除通用经典 HPC
              支出、非光子量子技术，以及属于使能投入而非 Photonic 直接产品面的供应商类别。现状替代方案仍包括经典 HPC、安全网络叠加层，以及从不同硬件基础出发攻向相同长期化学、优化和安全工作负载的竞争性量子架构。
            claimRefs:
              - CM001
              - CM002
              - CM007
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM006
              - CM007
              - CM008
              - CM014
      - number: '2.2'
        title: 规模化视角：真实的技术路线 TAM，但公司层面的 SAM/SOM 尚未证实
        blocks:
          - type: paragraph
            body: >-
              指定资料池中只有一个清晰的公开市场规模来源给出了硬数字：Yahoo 转载的 ResearchAndMarkets 摘要称，光子量子计算市场 2025 年为 USD 175.7 million，到 2035
              年可能达到 USD 5.8 billion，约为 40% CAGR，其中硬件占 2025 年支出的 52.7%。这可作为技术路线的上限，但不能直接当作公司
              SAM。同一来源称，增长由硅光子制造能力和安全通信投资推动；Photonic 自己的产品定位又把相关份额进一步收窄到分布式、与电信相连的硬件和网络。换言之，宽泛的技术路线 TAM
              确实存在，但近期可投资的切入口是能够转化为数据中心、运营商和公共部门部署的硬件、控制及网络集成支出。公开证据仍未提供足够的收入、定价和部署数量，无法把这一切入口变成有说服力的 SOM。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM014
