      - number: '3.3'
        title: 分销杠杆正在增强，但商业化仍比竞争者更不透明
        blocks:
          - type: paragraph
            body: >-
              Photonic 拥有有意义的分销合作伙伴，但保留下来的公开证据仍更像渠道策略，而不是完全可见的产品推进。Microsoft 将关系定位为未来与 Azure Quantum Elements 集成；TELUS 和
              Photonic 则将电信合作定位于量子安全网络项目和基础设施试点。相比之下，几家竞争者已经宣传了更清晰的访问点：PostQuantum 调查称，PsiQuantum、Xanadu 和 Quandela 在
              2026 年已经达到部署或云访问里程碑；保留的行业综述还补充了 Borealis 云可用性、MosaiQ 或 OVHcloud
              访问，以及专用计算中心部署等具体信号。公开材料对买家经济性则弱得多：比较来源描述了访问模式和里程碑，却没有披露 Photonic 或主要同行的目录价格，因此只能大致推断产品包装和合同结构。
            claimRefs:
              - CP003
              - CP004
              - CP006
              - CP007
              - CP008
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP003
              - CP004
              - CP006
              - CP007
              - CP008
              - CP009
              - CP013
              - CP014
      - number: '3.4'
        title: 网络护城河真实存在，但商业化时点仍是脆弱一侧
        blocks:
          - type: paragraph
            body: >-
              在原生电信网络和模块化扩展重要的场景中，Photonic
              的护城河最强，因为公司、合作伙伴和独立来源不断回到同一设计选择。反面的解读是，如果产品化更好的竞争者继续先行推进云访问、部署和公开证明，这一护城河可能不是促成下一笔商业交易的购买标准。PostQuantum
              关于光子供应链仍垂直整合的警告同时强化了正反两面：架构难以迅速复制，但也意味着买家互操作性有限，可能偏好最容易走向生产使用的供应商。对尽调而言，关键竞争问题不是 Photonic
              是否拥有差异化架构，而是能否在以部署或软件见长的同行成为默认评估名单之前，把架构转化为更清晰的买家方案。
            claimRefs:
              - CP010
              - CP011
              - CP014
