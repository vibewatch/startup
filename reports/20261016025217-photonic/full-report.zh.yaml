              年融资显著扩大了资本规模，但同一证据将商业化与更深入的客户和合作伙伴参与联系起来，而不是与已披露的经常性收入或具名生产部署相联系。TELUS 是最可见实地证明的核心；BCI、Microsoft、RBC 和
