        - 公开材料更强调技术演示、融资和伙伴参与，而不是点名生产用户或 SLA。
        - 高
        - 中高
        - 指定公开来源无法看清缓释方案。
        - 高
        - 需要参考客户、可靠性指标，以及生产使用与试点使用的证据。
    notes: 缓释成熟度仅根据已披露的公开材料判断；指定证据池中没有私有运营指标、可靠性数据或客户引用。
