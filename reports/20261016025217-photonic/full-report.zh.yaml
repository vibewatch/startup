        - 通过电信光纤连接硅 T 中心自旋量子比特，构建模块化分布式系统
        - 相比已有云端或部署里程碑的同业，其公开商业化路径不够明确
      - - PsiQuantum
        - 直接同业
        - 已融资超过 $2B；布里斯班和芝加哥的部署地点正在建设
        - 大规模公用计算和国家级基础设施买方
        - 以专用计算中心为基础的硅光容错路线图
        - 在电信网络用例上的差异化弱于 Photonic 的分布式纠缠主张
      - - Xanadu
        - 直接同业
        - 2026 年具有公开市场曝光度；PennyLane 生态分布广泛
        - 寻求云接入和软件工具的开发者与研究用户
        - 压缩光光子计算，加上云端可用性和 SDK 覆盖
        - 其连续变量路线不同，因此不太适合电信网络化的分布式处理
      - - Quandela
        - 直接同业
        - 拥有云合作伙伴关系和已交付系统，包括 CEA / OVHcloud 接入
        - 希望使用单光子系统、且重视明确接入路径的研究与机构用户
        - 量子点单光子系统，并提供公开云接入
        - 在保留来源中，其网络化叙事弱于 Photonic 的电信光纤定位
      - - ORCA Computing
        - 直接 / 邻近同业
        - PT-2 已部署于英国 NQCC；PT-3 计划于 2026 年推出
        - 混合量子-经典数据中心和机构部署
        - 以量子存储为核心、按需存取光子的架构
        - 保留来源中，支持电信规模分布式网络的证据少于 Photonic
      - - Nu Quantum / Qunnect
        - 邻近替代方案
        - 网络织构供应商，而非完整计算平台
        - 解决多 QPU 网络或量子互联网链路问题的运营方
        - 可置于其他 QPU 旁边的纠缠分发层
        - 它们无法替代完整计算栈，因此只会挤压 Photonic 价值主张的一部分
      - - 内部搭建 / 定制集成
        - 现状替代方案
        - 面向专业实验室的路径，而非主流企业选项
        - 具备深度量子集成能力的研究机构
        - 对供应商选择和系统设计拥有最大控制权
        - PostQuantum 表示，由于如今的供应链从头到尾都具有专有性，独立组装光子系统目前还不现实
    notes: 仅根据指定的保留来源综合整理。融资和接入信号采用这些来源明确的时间口径；“现状替代方案”反映当前买方行为，并非声称内部搭建如今就能达到 Photonic 的性能。
