  - id: TV001
    title: 建议总结表
    columns:
      - 项目
      - 评估
      - 证据依据
      - 决策含义
    rows:
      - - 建议
        - 深入研究
        - 2026 年的大额融资确实存在，但公开运营证明仍有限。
        - 继续尽调，不要按融资轮表面估值直接承销。
      - - 置信度
        - 中
        - 融资和技术里程碑得到交叉印证；估值支撑仍缺少指标。
        - 将该判断视为依赖证据、而非永久结论。
      - - 风险评级
        - 高
        - 硬件、商业化和行业时机风险仍然重大。
        - 要求里程碑门控和下行保护。
      - - 估值立场
        - 偏高
        - $2B 估值已得到交叉印证，但没有与已披露收入或客户指标交叉验证。
        - 避免基于动量的入场纪律。
      - - 入场纪律
        - 里程碑门控
        - 只有部署、收入和条款结构更清晰，价格支撑才会改善。
        - 深入尽调后或出现更有利入场点时重新评估。
    notes: 面向读者的判断表；评估综合了保留的融资、技术和行业证据。
    claimRefs:
      - CV003
      - CV004
      - CV012
      - CV013
      - CV014
  - id: TV002
    title: 正论 / 反论表
    columns:
      - 视角
      - 当前证据
      - 哪些变化会改变判断
    rows:
      - - 战略资本验证
        - 2026 年融资轮吸引了电信、云、金融和加拿大公共资本参与者。
        - 如果后续投资者停止参与，或战略伙伴没有深化商业参与，这一判断会减弱。
      - - 技术差异化
        - Photonic 拥有电信原生硅 T 中心架构，以及 30 km TELUS 光纤里程碑。
        - 如果该架构带来客户部署、基准测试进展或更清晰的容错里程碑，判断会增强。
      - - 商业证明缺口
        - 公开证据更强调里程碑和投资者支持，而非已披露收入或客户指标。
        - 如果披露 ARR / 收入质量、客户数、留存率和点名生产部署，该缺口会改善。
      - - 竞争与时机风险
        - 独立行业报道显示光子领域拥挤，技术路线障碍尚未解决。
        - 只有 Photonic 将技术潜力转化为比同行更快或更清晰的商业证明，这一风险才会缓解。
    notes: 各行对比当前最强的上行空间，以及降低其风险所需的具体证据。
    claimRefs:
      - CV006
      - CV007
      - CV009
      - CV010
      - CV011
      - CV012
      - CV015
      - CV016
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 乐观
        - 商业里程碑将战略伙伴转化为可见部署，技术进展继续走向可规模化系统。
        - 如果运营证明跟上，未来融资或退出选择权由此累积，$2B 估值便有可能成立。
        - 执行仍须跨过从里程碑信号到客户经济性的鸿沟。
        - 需要披露部署、更强的客户证明和更清晰的定价证据。
      - - 基准
        - 技术进展继续，但公开运营披露仍然稀少，市场仍将 Photonic 视为溢价叙事资产。
        - 当前估值已反映大部分上行空间，因此回报取决于有纪律的入场条款或后续证明。
        - 投资者可能提前为需要更久才能变现的进展买单。
        - 这与今天保留的公开证据最一致。
      - - 悲观
        - 商业化延迟，竞争者在已披露证明上保持领先，或融资条款显示的保护性强于表面估值所暗示的程度。
        - 里程碑叙事无法转化为近期经济性或流动性杠杆，估值因此下调。
        - 估值倍数压缩和更艰难的下一轮融资可能压过技术潜力。
        - 客户转化疲软、技术里程碑放缓或发现不利条款时触发。
    notes: 情景表是定性的，因为保留的公开证据没有披露数值模型所需的收入、利润率或股权表细节。
    claimRefs:
      - CV003
      - CV009
      - CV010
      - CV011
      - CV013
      - CV014
      - CV015
      - CV016
