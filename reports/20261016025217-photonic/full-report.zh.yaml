      - number: '4.3'
        title: 投资判断仍依赖私有财务室证据
        blocks:
          - type: paragraph
            body: >-
              Photonic
              最好的公开案例是：在独立行业来源仍看好光子量子计算上行空间之际，公司已聚集大额资本、战略投资者和技术相关合作伙伴。公开看空案例则是：同一批独立来源也强调光子损耗、制造规模和成本可行性仍是未解障碍，而付费市场展望材料不能替代公司层面的需求或利润率证据。结果是，这家公司看起来资金充足，但尚未被证明。严肃的投资判断仍需要私有证据，涵盖已签收入、客户组合、利润率结构、现金使用，以及技术里程碑转化为可重复商业合同的能力。
