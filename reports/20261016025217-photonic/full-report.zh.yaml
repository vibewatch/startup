    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、版图与产品定位
        blocks:
          - type: paragraph
            body: >-
              Photonic 将自己定位为分布式量子计算与网络公司，而不是单一盒式量子硬件供应商。公司材料把这一定位与采用硅自旋-光子量子比特和电信兼容光互连的 Entanglement First 架构联系起来，并将
              Microsoft Azure 云访问和专用私有系统都列为市场路径。公开资料一致显示，公司成立于 2016 年，2021 年进入商业化阶段，总部在 British
              Columbia，同时在美国和英国开展业务。这为后续章节提供了稳定的身份锚点，但并不能把 Photonic 的商业化说法变成已验证的收入或客户牵引力。
