        title: 已交付平台与面向买家的产品面
        blocks:
          - type: paragraph
            body: >-
              Photonic 将产品呈现为统一的量子计算与网络平台，建立在 Entanglement First
              架构上，以硅自旋量子比特和原生电信连接为核心设计选择，而不是单一盒式机器。官方产品页面和公司撰写的转载材料明确列出集成硅模块、T-centre 量子比特、分布式纠缠和未来云集成等技术要素，但尚未记录公开
              SKU、目录价格或普遍可用的服务层级。因此，本章的产品地图应理解为能力栈和商业化路径，而不是第三方买家已经能够按照公开商业条款采购生产部署的证明。
