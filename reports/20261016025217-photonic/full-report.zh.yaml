        blocks:
          - type: paragraph
            body: >-
              Photonic 2026 年的资本形成真实存在且得到独立佐证：1 月首轮交割带来 C$180M（$130M），5 月最终交割使本轮超过 $200M，对外公布的估值达到
              $2B。这一点重要，因为买家并非狭窄的风险投资联合体，而包括 TELUS、RBC、Microsoft 和 BCI 等战略方，最终交割时又加入 BDC、EDC、Bell Ventures
              及其他公共或战略一致资本。即便如此，支撑这一估值的公开证据仍围绕技术潜力、里程碑执行和战略协同，而非已披露收入、客户采用或利润率证明。因此，融资是有意义的验证事件，但对需要在入场时评估下行空间的外部投资者而言，还不足以成为充分的公允价值锚点。
