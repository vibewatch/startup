      - number: '3.2'
        title: 架构与能力权衡决定真正的买家选择
        blocks:
          - type: paragraph
            body: >-
              Photonic 的差异化不在于泛泛的“光子量子计算”，而在于原生电信的分布式纠缠。官方材料强调交换式光网络、模块间连接，以及高连接架构带来的纠错效率；Microsoft 和 TELUS
              的合作材料也围绕电信波长、Azure 集成和商用光纤试验强化了同一点。然而，最近的竞争者在其他轴线上差异化：PsiQuantum 强调资本密集型部署和硅光子容错，Xanadu
              强调云可用性和开发者工具，Quandela 通过云合作伙伴交付单光子系统，ORCA
              则侧重量子存储驱动的混合部署。因此，买家切换的关键不在抽象意义上的“最佳光子公司”，而在于买家是否更看重分布式网络和电信兼容性，而不是即时访问、既有基础设施或软件生态覆盖。
            claimRefs:
              - CP001
