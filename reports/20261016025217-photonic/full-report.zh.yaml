      - number: '2.4'
        title: 展示项
        blocks:
          - type: callout
            title: 原生电信分销让买家故事清晰可见
            body: Photonic 卖的并不只是抽象的未来量子比特数量。公开切入口已经对应到电信、安全、公共部门项目和云生态中的预算负责人；这些买家关心网络化部署、安全通信和早期访问路径。
            calloutType: strength
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM013
          - type: callout
            title: 宽泛的光子 TAM 高估了 Photonic 当前的付费市场
            body: 清晰的公开数字只是覆盖整个技术路线的预测。在 Photonic 展示非投资者客户验证、公开定价和可重复部署指标之前，公司层面的 SAM/SOM 仍是待尽调问题，而不是应当被虚假精确建模的数字。
            calloutType: risk
            claimRefs:
