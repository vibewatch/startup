  - id: TR003
    title: 合作伙伴 / 依赖风险登记表
    columns:
      - 依赖项
      - 交易对手 / 所在环节
      - 角色
      - 集中度信号
      - 失效情景
      - 严重性
      - 缓释措施
      - 剩余暴露
    rows:
      - - 商用光纤现场验证
        - TELUS
        - 运营商网络访问和公开证明点
        - 一个合作伙伴支撑了指定证据中最醒目的真实网络演示。
        - 如果访问受限或优先事项分歧，Photonic 将失去标志性部署环境和关键商业化叙事。
        - 高
        - 扩大第三方网络证明，展示 TELUS 之外的同等部署。
        - 在其他地方复制前为高
      - - 战略资本基础
        - Planet First / RBC / TELUS / BCI / Microsoft
        - 资金、可信度和渠道支持
        - 指定证据显示 2023 年和 2026 年融资轮由一组集中的战略及机构支持者参与。
        - 下一轮融资走弱或战略支持减少，可能暴露这套叙事仍有多大程度由投资者而非客户驱动。
        - 中高
        - 展示客户拉动，分散投资者组合，并证明非战略性商业需求。
        - 中高
      - - 商业证明路径
        - 未在公开信息中详细点名的客户和合作伙伴
        - 市场拓展验证
        - 2026 年融资表述强调更深的客户和伙伴参与，但该证据池中的公开点名生产证明仍然稀少。
        - 如果试点无法转化为可重复收入，技术进展就无法转化为可融资规模。
        - 高
        - 提供点名部署、采购引用和更清晰的收入质量披露。
        - 高
      - - 光子栈中的供应商替代
        - Photonic 生态 / 专有供应链
        - 制造和集成灵活性
        - 独立分析仍将光子供应链描述为垂直整合且专有。
        - 如果关键子系统表现不佳，替代路径可能比更模块化的计算栈更慢、更定制化。
        - 中高
        - 记录替代供应商、自产还是采购的决策，以及子系统认证计划。
        - 中高
    notes: 集中度标签是定性的，因为指定公开证据未披露收入组合、合同金额或合作伙伴层面的依赖比例。
