        blocks:
          - type: paragraph
            body: >-
              对一家私有量子公司而言，这套架构叙事异常具体。Photonic 称，扩展来自硅模块内的高密度量子比特集成，以及在电信网络化模块之间进行分布式运行；T-centre
              技术则把计算、存储和光连接合并到同一硅结构中。Microsoft 的合作声明给出了最清晰的外部运行模式：从电信光纤上的点对点纠缠，到短暂的中继器能力，再到接入 Azure
              的容错网络层，分阶段推进。指定资料池中最具实地意义的里程碑来自 TELUS：30 km 商用光纤隐形传态演示超越了纯芯片实验室叙事，但仍未达到客户生产验证。
