  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重性排序的风险栈
        blocks:
          - type: paragraph
            body: >-
              公开层面最严重的风险是技术规模化风险，因为 Photonic
              的论点仍依赖于证明：分布式纠缠、高效纠错和数千个稳定量子比特，能够从架构叙事走向可重复的系统性能。独立光子市场报道仍把光子损耗、确定性生成和可扩展纠错视为未解障碍，而 PsiQuantum、Xanadu 和
              Quandela 等竞争者已经在市场上部署硬件或提供云访问。这一组合意味着，时点延误对 Photonic
              的伤害会大于对普通深科技公司的伤害：如果公开里程碑推迟，而同行持续交付，“商业化优先”的溢价叙事会在外部投资者能够评估客户牵引力之前先行减弱。
