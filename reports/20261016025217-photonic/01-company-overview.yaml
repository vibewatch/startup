callouts:
  - calloutType: strength
    title: Capital and partner quality are the clearest positive overview signals
    body: >-
      The company has attracted large 2026 financing rounds and paired them with
      visible partners such as TELUS, Microsoft, RBC, and BCI, which matters more
      at this stage than unsupported revenue estimates.
    claimRefs: [CO005, CO011, CO012, CO013]
  - calloutType: risk
    title: Commercial proof still lags technical ambition
    body: >-
      Public sources disagree on funding, valuation, and headcount, while revenue,
      ARR, profitability, customer count, and production deployment evidence remain
      either unaudited or unavailable.
    claimRefs: [CO014, CO015, CO016]
