company:
  name: Photonic
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Photonic presents a coherent identity stack around distributed quantum computing:
    the company says it was founded in 2016, began commercialization in 2021,
    and is building an Entanglement First architecture around silicon spin-photon
    qubits. Public evidence supports strong partnership and financing momentum
    through 2026, but independent trackers still disagree on cumulative funding,
    valuation, and headcount, while revenue, ARR, profitability, and customer
    counts remain unsupported by audited public disclosures.
sections:
  - id: identity-platform
    title: Identity, footprint, and product posture
    body: >-
      Photonic positions itself as a distributed quantum computing and networking
      company rather than a single-box quantum hardware vendor. The company's
      own materials tie that position to an Entanglement First architecture using
      silicon spin-photon qubits and telecom-compatible optical interconnects,
      and they frame the route to market around cloud access through Microsoft
      Azure as well as dedicated private systems. Public profile evidence is
      consistent that the company was founded in 2016, moved into commercialization
      in 2021, and operates from British Columbia with activity in the United
      States and United Kingdom. That gives later chapters a stable identity
      anchor, but it does not convert Photonic's commercialization claims into
      verified revenue or customer traction.
    claimRefs: [CO001, CO002, CO003, CO004, CO005]
    tableRefs: [TO001]
  - id: leadership-capital
    title: Leadership, founders, and capital base
    body: >-
      The public record points to a founder-led technical origin with a more
      commercially seasoned executive overlay. Independent profiles identify
      Stephanie Simmons as founder and Chief Quantum Officer, while Don Mattrick
      appears as CEO in 2026. Public funding records also show a multi-step
      capital story: a Series D in late 2023, a large first close in January
      2026, and a reported final close in May 2026. The caution is that public
      trackers do not converge on a single number for total capital raised,
      valuation, or headcount, and the public cap-table still lacks enough
      detail to judge control rights or dilution risk from outside the company.
    claimRefs: [CO006, CO007, CO008, CO011, CO013, CO014, CO015]
    tableRefs: [TO002, TO003]
  - id: milestones-risks
    title: Milestones, execution signals, and open diligence asks
    body: >-
      The strongest verified 2024-2026 operating signals are technical and
      partnership-led rather than commercial. Independent coverage says Photonic
      demonstrated entanglement across separate modules in 2024 and entered
      DARPA's Quantum Benchmarking Initiative Stage B in November 2025, while
      Photonic and TELUS later announced a 30 km quantum teleportation result
      over commercial fibre. Those milestones support technical ambition and
      investor interest, but independent commentary also frames the company as
      still early and not yet in the small set of photonic vendors with deployed
      hardware or cloud access in 2026. Combined with unaudited revenue estimates
      and absent customer disclosures, that leaves commercialization readiness
      and economic quality as the main unresolved overview risks.
    claimRefs: [CO009, CO010, CO011, CO012, CO013, CO015, CO016]
    figureRefs: [FO001]
