  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: financial-disclosure
      missingEvidence: Audited or management-confirmed revenue, ARR, gross margin, burn, runway, and customer-count disclosures.
      whyItMatters: Without supported operating metrics, the overview can establish identity and financing momentum but not business quality or scale efficiency.
      diligencePath: Request a current KPI pack or board deck with metric definitions, monthly trend lines, and customer-count methodology.
      relatedQuestionRefs: [QO005]
      relatedTableRefs: [TO001]
    - type: private-evidence-only
      severity: material
      topic: valuation
