    title: Regulatory / legal risk register
    columns:
      - Risk
      - Jurisdiction / exposure
      - Status in assigned evidence
      - Likelihood
      - Severity
      - Mitigation / diligence path
      - Residual exposure
    rows:
      - ["Export-control and national-security review", "Canada / UK / US commercialization and telecom-security use cases", "Assigned public sources show secure-networking positioning and strategic government-linked or regulated counterparties, but no public export-classification or review memo.", "Medium", "High", "Request export-control classification, foreign-ownership review, and any public-sector procurement restrictions before underwriting regulated demand.", "High until cleared by counsel and customer diligence"]
      - ["IP and freedom-to-operate", "Core qubit, networking, and error-correction stack", "The company highlights proprietary architecture and T-centre differentiation, while independent coverage shows a crowded photonic field; no patent map or FTO memo appears in the assigned pool.", "Medium", "High", "Review patent families, inbound university or founder IP, and outside-counsel FTO work before treating differentiation as durable.", "Medium-high"]
      - ["Security / privacy / procurement compliance", "Carrier, data-centre, and security-sensitive deployments", "Assigned evidence shows quantum-secure networking ambitions and a live carrier collaboration, but no public trust center, certification set, or incident process in this pool.", "Medium", "Medium-High", "Request security certifications, customer security questionnaires, incident response process, and procurement blockers from reference accounts.", "Medium"]
    notes: "Severity ordering reflects only the assigned public record as of 2026-10-16; unresolved diligence items are not evidence that a defect exists."
    enumerationScope:
      coverage: partial
      basis: "Partial public legal and regulatory diligence register synthesized from the assigned source pool's architecture, financing, and partner materials as of 2026-10-16."
    claimRefs: [CR002, CR012, CR013, CR015, CR016]
  - id: TR002
    title: Operational / quality / security risk register
    columns:
      - Failure mode
      - Why it matters
      - Likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure
      - Unresolved gap
    rows:
      - ["Fault-tolerance and error-correction scale-up", "Photonic's public thesis still depends on proving distributed error-corrected scale rather than isolated milestones.", "High", "High", "Conceptual mitigation exists in company architecture materials, but public production proof is limited.", "High", "Need milestone-level evidence on logical-qubit performance, reproducibility, and deployment timing."]
      - ["Low-temperature detector and subsystem integration", "Independent photonic-system analysis still describes cryogenic detector infrastructure, while Photonic says its own T centres perform at 1K.", "Medium", "High", "Mitigation is architectural rather than operationally proven in the assigned pool.", "Medium-High", "Need system BOM, cooling architecture, service model, and uptime implications."]
      - ["Timeline credibility versus peers already in market", "Independent sources show competing photonic vendors already deploying hardware or cloud access in 2026, raising the cost of delay.", "Medium-High", "High", "The company has a clear technical story, but assigned public evidence does not yet show equivalent commercial deployment proof.", "High", "Need dated roadmap checkpoints tied to customer-access milestones, not only research milestones."]
      - ["Reliability and customer-proof opacity", "Public materials emphasize technical demonstrations, financing, and partner engagement more than named production users or SLAs.", "High", "Medium-High", "Mitigation is unclear from assigned public sources.", "High", "Need reference customers, reliability metrics, and evidence on production versus pilot usage."]
    notes: "Mitigation maturity is judged from disclosed public artifacts only; no private operating metrics, reliability data, or customer references were available in the assigned pool."
    claimRefs: [CR003, CR004, CR005, CR006, CR007, CR014, CR015, CR016]
  - id: TR003
    title: Partner / dependency risk register
    columns:
      - Dependency
      - Counterparty / locus
      - Role
      - Concentration signal
      - Failure scenario
      - Severity
      - Mitigation
      - Residual exposure
    rows:
      - ["Commercial-fibre field validation", "TELUS", "Carrier network access and public proof point", "One partner anchors the most visible real-world network demonstration in assigned evidence.", "If access narrows or priorities diverge, Photonic loses a marquee deployment environment and a key commercialization narrative.", "High", "Expand third-party network proofs and show equivalent deployments beyond TELUS.", "High until replicated elsewhere"]
      - ["Strategic capital base", "Planet First / RBC / TELUS / BCI / Microsoft", "Funding, credibility, and channel support", "Assigned evidence shows a concentrated set of strategic and institutional backers across 2023 and 2026 rounds.", "A weaker next round or reduced strategic sponsorship could expose how much of the story is still investor-led rather than customer-led.", "Medium-High", "Demonstrate customer pull, diversify investor set, and show non-strategic commercial demand.", "Medium-High"]
      - ["Commercial proof path", "Customers and partners not publicly named in detail", "Go-to-market validation", "2026 funding language highlights deeper customer and partner engagement, but public named production proof remains sparse in this pool.", "If pilots do not convert into repeatable revenue, technical progress will not translate into financeable scale.", "High", "Produce named deployments, procurement references, and clearer revenue-quality disclosures.", "High"]
      - ["Vendor substitution in the photonic stack", "Photonic ecosystem / proprietary supply chain", "Manufacturing and integration flexibility", "Independent analysis still characterizes photonic supply chains as vertically integrated and proprietary.", "If a key subsystem underperforms, replacement paths may be slower and more bespoke than in more modular compute stacks.", "Medium-High", "Document alternate suppliers, make-versus-buy decisions, and subsystem qualification plans.", "Medium-High"]
    notes: "Concentration labels are qualitative because the assigned public evidence does not disclose revenue mix, contract values, or partner-level dependency percentages."
    claimRefs: [CR005, CR008, CR009, CR010, CR011, CR012, CR013, CR016]
figures:
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: "Public evidence concentrates the highest residual risk in scale-up, commercialization proof, and dependency replication."
    data:
      columns:
        - label: Likelihood
          detail: "Relative probability implied by the assigned public record."
        - label: Impact
          detail: "Effect on the investment case if the risk materializes."
        - label: Mitigation maturity
          detail: "How concrete the public mitigation evidence is today."
        - label: Residual exposure
          detail: "Net risk after the mitigation evidence visible in this chapter."
      rows:
        - label: Fault-tolerance scale-up
          note: "Core architecture risk."
          values:
            - { label: High, tone: critical, detail: "Independent coverage still flags error correction and photon-loss barriers." }
            - { label: High, tone: critical, detail: "This is the main condition for the commercialization thesis." }
            - { label: Medium, tone: warning, detail: "Company materials describe QLDPC and distributed entanglement, but public production proof is limited." }
            - { label: High, tone: critical, detail: "Public upside is still tightly coupled to this risk clearing." }
        - label: Deployment timeline versus peers
          note: "Execution and market-timing risk."
          values:
            - { label: Medium-High, tone: warning, detail: "Peers already show hardware deployments or cloud access in 2026." }
            - { label: High, tone: critical, detail: "Delay erodes technical differentiation and financing leverage." }
            - { label: Medium, tone: warning, detail: "The company has milestone messaging, but public deployment proof remains thinner than peer availability." }
            - { label: High, tone: critical, detail: "Residual exposure stays elevated until customer-facing access becomes visible." }
        - label: Partner concentration
          note: "Carrier and strategic-capital dependence."
          values:
            - { label: Medium, tone: warning, detail: "TELUS and strategic investors are central in the assigned public record." }
            - { label: Medium-High, tone: warning, detail: "Loss of a flagship partner would weaken the field-validation story." }
            - { label: Medium, tone: warning, detail: "The latest round broadens the cap table, but not enough to prove partner independence." }
            - { label: Medium-High, tone: warning, detail: "Residual dependence remains visible until alternative proofs appear." }
        - label: Legal / compliance diligence
          note: "No public blocker surfaced, but key answers are missing."
          values:
            - { label: Medium, tone: warning, detail: "Quantum networking and telecom use cases naturally raise export, security, and procurement questions." }
            - { label: High, tone: critical, detail: "A negative diligence outcome could narrow customer access materially." }
            - { label: Low, tone: neutral, detail: "Assigned public sources do not provide regulator-grade clearance evidence." }
            - { label: Medium-High, tone: warning, detail: "Exposure remains elevated until legal and security workstreams are evidenced." }
        - label: Commercial proof opacity
          note: "Public traction evidence remains thin."
          values:
            - { label: High, tone: critical, detail: "Assigned sources emphasize funding and partner engagement more than named production deployments." }
            - { label: Medium-High, tone: warning, detail: "Opaque conversion from technical milestones to revenue makes valuation hard to underwrite." }
            - { label: Low-Medium, tone: neutral, detail: "The public mitigation today is mostly narrative rather than customer evidence." }
            - { label: High, tone: critical, detail: "Residual exposure stays high until customer references and revenue quality improve." }
        - label: Capital intensity visibility
          note: "Recent financing helps, but operating transparency is still limited."
          values:
            - { label: Medium, tone: warning, detail: "Public evidence shows capital access, but not burn or runway detail." }
            - { label: Medium-High, tone: warning, detail: "If commercialization lags spend, another raise could arrive before demand is externally visible." }
            - { label: Medium, tone: warning, detail: "The visible mitigation is a larger round rather than disclosed operating leverage." }
            - { label: Medium-High, tone: warning, detail: "Residual exposure remains material until burn and milestone pacing are clearer." }
    claimRefs: [CR003, CR006, CR007, CR012, CR014, CR016]
callouts:
  - calloutType: risk
    title: Thesis-break trigger
    body: >-
      If Photonic misses public fault-tolerance or customer-access milestones while peer photonic
      vendors keep adding deployments or cloud access, the execution risk becomes thesis-breaking
      before the company runs out of capital.
    claimRefs: [CR007, CR008, CR015]
  - calloutType: recommendation
    title: Highest-value diligence pack
    body: >-
      The shortest path to de-risking this chapter is a combined legal, customer, and operating-data
      pack: export-control and FTO memos, named production references, reliability metrics, and a
      financing plan tied to concrete commercialization milestones.
    claimRefs: [CR009, CR012, CR016]
