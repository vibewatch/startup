  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - ["Bull", "Commercial milestones convert strategic partners into visible deployments, and technical progress continues toward scalable systems.", "A $2B mark can be justified if operating proof catches up and future financing or exit optionality compounds from there.", "Execution still has to bridge from milestone signaling to customer economics.", "Needs disclosed deployments, stronger customer proof, and cleaner pricing evidence."]
      - ["Base", "Technical progress continues, but public operating disclosure remains thin and the market keeps treating Photonic as a premium narrative asset.", "Current valuation already captures much of the upside, so returns depend on disciplined entry terms or later proof.", "Investors can end up paying early for progress that takes longer to monetize.", "Most consistent with today's retained public evidence."]
      - ["Bear", "Commercialization slips, competitors stay ahead on disclosed proof, or financing terms prove more protective than the headline mark suggests.", "The valuation de-rates because milestone narratives fail to convert into near-term economics or liquidity leverage.", "Multiple compression and a tougher next round can overwhelm technical promise.", "Triggered by soft customer conversion, slower technical milestones, or adverse term discovery."]
    notes: "Scenario table is qualitative because the retained public evidence does not disclose revenue, margin, or cap-table detail needed for a numerical model."
    claimRefs: [CV003, CV009, CV010, CV011, CV013, CV014, CV015, CV016]
