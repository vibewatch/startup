callouts:
  - calloutType: recommendation
    title: Recommendation
    body: >-
      Keep Photonic at research-more. The financing and technical evidence are strong enough to justify continued
      attention, but not yet strong enough to support price-insensitive conviction at the current disclosed mark.
    claimRefs: [CV003, CV012, CV013, CV014]
  - calloutType: risk
    title: Thesis-break trigger
    body: >-
      If deeper diligence shows weak customer conversion, heavy liquidation-preference protection, or slower
      commercialization than the narrative implies, the current valuation would look materially too rich.
    claimRefs: [CV010, CV014, CV016]
