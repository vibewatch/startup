company:
  name: Photonic
chapter:
  number: 4
  title: Financials
  summary: >-
    Photonic's public financial story is still a financing-and-commercialization story rather than a revenue-and-margin story. Public sources support the strength of its 2026 fundraising, partner-backed technical milestones, and likely future monetization paths, but they still do not disclose realized pricing, revenue mix, gross margin, burn, runway, or customer concentration.
sections:
  - id: monetization-visibility
    title: Monetization visibility is still narrative-first
    body: >-
      Public materials make Photonic's commercial direction understandable, but they do not make the business underwritable yet. The company positions itself around distributed quantum-computing access and quantum-networking infrastructure, with Microsoft Azure and TELUS featuring as visible route-to-market partners, and TELUS explicitly describes commercial ambitions that range from quantum data centres to encrypted networks. That is enough to outline the future revenue model, but not enough to score current revenue quality. Across the retained sources, there is still no public list pricing, realized pricing, contract duration, recognized revenue, or ARR disclosure, so the present monetization bridge remains strategic rather than financial.
    claimRefs: [CI001, CI002, CI003, CI004, CI010, CI015]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: capital-adequacy-and-cost-base
    title: Capital looks stronger than revenue visibility
    body: >-
      The clearest public financial datapoints are capital formation and operating scale. Photonic disclosed a CA$180M (US$130M) first close in January 2026 and a US$200M final close in May 2026, while Quantum Computing Report says the company can also receive up to $23M from Canada's Quantum Champions Program. Public headcount also rose from 150+ experts in February 2026 to more than 160 by May 2026, reinforcing that this is a labor- and hardware-intensive buildout before any disclosed self-funding profile is visible. The financing clearly reduced near-term solvency risk, but it does not answer burn, runway, or margin questions.
    claimRefs: [CI005, CI006, CI007, CI008, CI009, CI011, CI013]
    tableRefs: [TI003]
  - id: underwriting-verdict
    title: Underwriting still depends on private finance-room evidence
    body: >-
      The best public case for Photonic is that it has assembled a large capital base, strategic investors, and technically relevant partners at a time when independent sector sources still see material upside in photonic quantum computing. The public bear case is that the same independent sources also highlight photon loss, manufacturing scale, and cost viability as unresolved barriers, while paid market-outlook material cannot substitute for company-specific evidence of demand or margins. The result is a business that looks better financed than proven. A serious investment view still requires private evidence on booked revenue, customer mix, margin structure, cash use, and the conversion of technical milestones into repeatable commercial contracts.
    claimRefs: [CI011, CI012, CI013, CI014, CI015]
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current value/status
      - Quality
      - Diligence ask
    rows:
      - - Future quantum-computing access
        - Azure/cloud access plus distributed QPU availability for customers and partners
        - project, reserved capacity, or usage
        - Public access path is described, but no revenue, ARR, or contract disclosures are public
        - Strategic route is visible; monetization is unproven
        - Request booked pilot revenue, contract forms, and usage-to-revenue conversion
      - - Quantum networking infrastructure
        - TELUS-linked secure networking, quantum data-centre, and encrypted-network solutions
        - deployment or contract
        - Technical demo and product intent are public; commercial value is undisclosed
        - Strong proof of capability, weak proof of paid demand
        - Request paid pilot count, ACV, and conversion timing
      - - Government and benchmarking support (non-revenue)
        - CQCP support plus DARPA benchmarking can offset cash needs but do not equal customer revenue
        - grant or programme support
        - Up to $23M of CQCP support is cited publicly; DARPA Stage B is a validation signal
        - Helpful for financing resilience; not recurring operating revenue
        - Separate non-dilutive support from revenue and disclose recognition policy
      - - Strategic co-development
        - Strategic investors and ecosystem partners can create design-in and distribution leverage
        - milestone or partnership agreement
        - Partner list is public; economics and exclusivity are not
        - Commercial optionality exists, but term-sheet visibility is low
        - Request signed commercial terms, milestone triggers, and partner revenue share
    notes: Public sources show strategic monetization paths, but null or qualitative entries reflect undisclosed revenue realization and contract economics.
    claimRefs: [CI001, CI002, CI003, CI007, CI009, CI015]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Offer
      - Price/unit/contract
      - List vs realized pricing
      - Discounts/unknowns
      - Source
    rows:
      - - Quantum-computing access
        - Not publicly disclosed
        - No public list or realized pricing found
        - Contract duration, minimum commit, and recognition policy all remain unknown
        - Public materials reviewed for this chapter
      - - Quantum networking deployment
        - Not publicly disclosed
        - No public contract values or unit prices found
        - Paid pilot status, support scope, and recurring elements are unknown
        - TELUS partnership materials and secondary coverage
      - - Programme support and benchmarking
        - Not a customer price
        - CQCP support and DARPA benchmarking are financing or validation inputs, not product pricing
        - Revenue-recognition treatment and milestone timing are not public
        - Quantum Computing Report and January 2026 funding coverage
    notes: This table distinguishes absence of public pricing disclosure from absence of commercial ambition; public sources reviewed here do not publish list prices or realized ASPs.
    claimRefs: [CI003, CI004, CI007, CI014]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value/null
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - Revenue or ARR
        - null
        - low
        - Revenue quality cannot be underwritten without booked or recurring revenue disclosure
        - Request monthly revenue bridge, backlog, and pilot-to-production conversion
      - - Gross margin
        - null
        - low
        - Hardware, cryogenic subsystems, photonics integration, and service support could move margin materially
        - Request COGS by product line and gross-margin bridge
      - - Burn, cash, and runway
        - null
        - medium
        - Large raises improve flexibility, but runway still depends on monthly net burn and capex
        - Request cash balance, debt obligations, capex plan, and base/upside burn scenarios
      - - Headcount scale proxy
        - "150+ experts (Feb 2026) to 160+ experts (May 2026)"
        - medium
        - Growth in specialist labor indicates a meaningful fixed-cost base before disclosed scale revenue
        - Request org split, loaded personnel cost, and hiring plan by function
    notes: Null means the metric is not publicly disclosed in retained sources, not that the business has zero revenue, margin, or burn.
    claimRefs: [CI006, CI008, CI011, CI013, CI014]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence supports the path from capital and technical validation toward commercialization, but the last step into priced revenue and gross profit is still undisclosed.
    data:
      nodes:
        - id: capital
          label: Financing base
          detail: 2026 first-close and final-close funding plus non-dilutive programme support extend the commercialization window.
        - id: platform
          label: Technical platform
          detail: T-centre QPUs and telecom-band connectivity define the core product architecture.
        - id: validation
          label: Technical validation
          detail: TELUS teleportation and DARPA Stage B are public proof points.
        - id: partners
          label: Route-to-market partners
          detail: Microsoft Azure and TELUS create visible access and deployment channels.
        - id: offerings
          label: Commercial offerings
          detail: Public materials point to quantum-computing access and quantum-networking infrastructure.
        - id: gap
          label: Revenue-quality gap
          detail: Public materials still omit pricing, revenue mix, margin, burn, and runway.
    claimRefs: [CI002, CI003, CI005, CI006, CI007, CI014, CI015]
