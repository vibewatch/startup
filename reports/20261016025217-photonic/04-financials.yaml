  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: revenue-disclosure-gap
      missingEvidence: Product-level revenue mix, recognized revenue, ARR if applicable, backlog, and pilot-to-production conversion data.
      whyItMatters: Public strategic milestones do not show whether technical progress is converting into repeatable paid demand.
      diligencePath: Request a monthly revenue bridge by product line, customer cohort, and contract stage plus sample customer agreements.
    - type: private-evidence-only
      severity: material
      topic: unit-economics
      missingEvidence: Gross margin, hardware COGS, cloud/service delivery cost, and support burden by offering.
      whyItMatters: Margin path determines whether a large capital raise is building a durable business or just extending an expensive R&D cycle.
      diligencePath: Review product P&Ls, BOM assumptions, support staffing ratios, and target gross-margin bridge by commercial offering.
    - type: private-evidence-only
      severity: material
      topic: runway
      missingEvidence: Current cash balance, monthly net burn, debt obligations, capex plan, and base-case runway.
      whyItMatters: Capital adequacy cannot be judged from fundraising headlines alone, especially for a hardware- and talent-intensive company.
      diligencePath: Request treasury summary, debt schedule, capex plan, and 18-24 month operating model with downside sensitivities.
