- id: TI006
  title: Public financial gaps table
  columns:
  - Missing metric
  - Why it matters
  - Current impact
  - Exact diligence path
  rows:
  - - Audited annual revenue and backlog
    - Required to judge scale and demand durability
    - Blocks any serious base-case model
    - Obtain 2024-2025 audited P&L and signed order backlog
  - - Gross margin by product line
    - Needed to separate software economics from hardware drag
    - Prevents margin-path underwriting
    - Request ADAS, delivery vehicle, and service gross margins separately
  - - Cash, restricted cash, and debt
    - Core runway input
    - Solvency cannot be assessed
    - Obtain latest balance sheet and bank statements
  - - Accounts receivable / payable aging
    - Reveals working-capital stress and customer-payment health
    - Could hide frozen cash cycle or distress
    - Request AR/AP aging, disputed invoices, and supplier terms
  - - Top-customer concentration and related-party revenue
    - Determines revenue quality and bargaining power
    - Great Wall dependency remains unresolved
    - Provide customer-by-customer revenue, gross profit, and renewal status
  notes: The lack of basic financial disclosure is itself the main blocker to underwriting.
