- id: cost-structure-and-unit-economics
  title: 'Cost structure and unit economics: Haomo looked capital-heavy even before the halt'
  body: 'The cost picture can only be reconstructed indirectly, but the direction is clear. Haomo’s disclosed uses of funds centered on large models, compute, data, and mass production—not on near-term profitability. Its product mix also implies inherently different margin structures: mainstream ADAS kits may support decent gross margin if sold at scale, while autonomous delivery vehicles, domain controllers, sensor stacks, and fleet support generally drag the business toward hardware-like economics and working-capital needs. Comparable listed AV companies underline the problem. WeRide’s 2025 revenue of about US$97.9 million still sat beneath roughly US$196 million of R&D and a US$264 million operating loss, while Pony’s 2025 and Q1 2026 disclosures show rapid revenue growth coexisting with heavy operating investment, vehicle BOM optimization, and new capex. That does not prove Haomo’s exact burn rate, but it does show the surrounding category economics: even stronger and better-capitalized
    autonomy companies were not close to easy self-funding. Haomo’s combination of Great Wall concentration, logistics hardware, and frontier-model ambition likely meant a negative cash-conversion profile unless an anchor customer or new round kept absorbing the cost of scale-up.'
  claimRefs:
