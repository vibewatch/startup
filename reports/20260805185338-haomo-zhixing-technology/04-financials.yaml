company:
  name: Haomo Zhixing Technology Co., Ltd.
chapter:
  number: 4
  title: Financials
  summary: 'Haomo’s public financial picture is notable less for disclosed numbers than for the gap between commercialization claims and missing underwriting data. The company clearly pursued multiple revenue streams—ADAS kits and full-stack OEM programs, autonomous delivery vehicles, and likely services or cloud support—and it raised at least CNY400 million across its 2024 B1/B2 rounds to fund mass production, large-model R&D, and computing infrastructure. But no audited revenue, gross margin, cash balance, burn, or customer-concentration schedule is publicly visible for Haomo as of August 2026. The best supportable conclusion is therefore cautious and adverse: the business was capital-intensive, likely still financing-dependent, and by late 2025 public evidence pointed to liquidity stress rather than self-funded scale.'
sections:
- id: revenue-model-and-public-traction
  title: 'Revenue model: multiple monetization paths were visible, but real revenue quality was not'
  body: 'Haomo’s public materials show a mixed revenue model rather than a single pure-software business. On the passenger-car side, the company sold ADAS kits and broader smart-driving solutions into OEM programs, with HP170, HP370, and HP570 positioned as price-tiered products for low- to high-end vehicles. On the logistics side, Haomo marketed HDeliver and related low-speed autonomous vehicles, suggesting hardware revenue, deployment revenue, and possibly continuing operations or support fees. Public media and company-linked coverage also describe code, modules, hardware, software, and cloud services, implying that Haomo likely monetized a bundle of product and integration work rather than one recurring SaaS fee. Traction signals existed—20-plus vehicle models, roughly 140 million assisted-driving kilometers by spring 2024, and close to 300,000 Beijing grocery deliveries—but these are activity proxies, not audited revenue. The financial interpretation is therefore mixed: Haomo had real
    commercial surfaces, yet public evidence still does not show how much revenue came from product sales versus support services, nor whether any of those streams carried attractive margins or durable retention.'
  claimRefs:
