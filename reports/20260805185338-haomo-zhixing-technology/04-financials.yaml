- id: capital-adequacy-and-financing-dependency
  title: 'Capital adequacy: the public record implies financing dependency, then liquidity stress'
  body: 'The strongest supportable financial conclusion is that Haomo still depended on external funding or strategic support through 2024 and probably into 2025. Yicai reported that Haomo raised over CNY100 million in B1 and CNY300 million in B2 in early 2024, with proceeds earmarked for mass production, robotics expansion, and continued spending on large models, compute, and data. That use-of-funds language is growth-investment language, not mature free-cash-flow language. Late-2025 reporting then turned sharply adverse: layoffs, salary arrears, halted work, theories of frozen accounts, and no public post-crisis clarification on cash, liabilities, or restart. Great Wall’s 2025 annual report confirms Haomo remained an associate and related party, but it does not give public investors the clean runway disclosure that would let them underwrite ongoing solvency. Relative to public peers, that opacity is severe. Pony and WeRide can disclose cash balances, revenue composition, capex, and losses;
    Haomo cannot. The practical implication is that Haomo’s capital adequacy should be treated as unresolved-to-weak, with the burden of proof on management to show that the business still has operating liquidity, not just historical funding headlines.'
