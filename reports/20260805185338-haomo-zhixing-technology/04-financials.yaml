- id: TI005
  title: Comparable public autonomy-company financial benchmarks
  columns:
  - Company
  - Revenue mix signal
  - R&D / operating cost signal
  - Liquidity signal
  - Readthrough for Haomo
  rows:
  - - Pony.ai
    - 2025 revenue US$90.0m; Q1 2026 revenue US$34.3m
    - 2025 non-GAAP net loss US$174.0m; ongoing Gen-7 investment and capex
    - US$1.515b cash/investments at Dec. 31, 2025; US$1.436b at Mar. 31, 2026
    - Even a scaled, public leader still needs a very large balance sheet to fund growth
  - - WeRide
    - 2025 revenue US$97.9m with product and service mix
    - 2025 R&D US$196.2m; operating loss US$264.1m
    - ~US$1.0b liquidity at Dec. 31, 2025
    - Commercial traction does not eliminate high R&D and deployment burn
  - - Mobileye
    - 2025 revenue US$1.894b
    - Generated US$602m operating cash in 2025
    - US$1.8b cash at year-end 2025
    - True self-funding in ADAS appears only at far larger scale than Haomo ever disclosed
  - - WeRide filing detail
    - Top five customers were 40.5% of 2025 revenue
    - Operating cash outflow persisted despite growth
    - Public filing discloses mix and risk factors
    - Shows the disclosure standard investors need but do not have from Haomo
  - - Pony unit-economics disclosure
    - UE breakeven in Guangzhou and Shenzhen; record net daily revenue per Gen-7 vehicle RMB394
    - Still front-loads investment and BOM reduction efforts
    - Large balance sheet still required
    - Highlights the bar Haomo needed to clear to argue credible profitability path
  notes: These are not direct valuation comps; they are operating-finance benchmarks for the capital intensity of autonomous-driving businesses.
