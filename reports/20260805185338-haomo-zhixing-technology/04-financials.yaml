- id: financial-verdict-and-diligence-blockers
  title: 'Financial verdict: underwriting is blocked by missing basics, not by a lack of category demand'
  body: 'Haomo’s financial verdict is negative because the missing data are the exact inputs needed for underwriting. Investors do not have public revenue, gross margin, receivables aging, cash balance, debt, covenant status, backlog, renewal rates, customer concentration by revenue, or monthly burn. Nor is there evidence that the company converted its impressive commercialization narrative into stable, diversified, high-quality earnings. The public record instead points to a familiar autonomy-company pattern: high R&D intensity, product-plus-service complexity, possible working-capital drag, and constant need for either new funding or powerful strategic sponsorship. That pattern is survivable when a company remains on a scaling path and can show balance-sheet strength, but Haomo’s late-2025 distress reporting means the same pattern becomes dangerous. The consequence for diligence is straightforward. Until management provides current cash, liabilities, active contracts, unit economics, and
    customer-payment data, the only responsible financial stance is that Haomo was a capital-intensive business with low reporting visibility and unresolved solvency risk by the 2026 diligence date.'
