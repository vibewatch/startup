  topStrengths:
    - Haomo 曾跑出真实商业化证据，包括 ADAS 覆盖 20 多款车型，以及在北京形成有意义的配送路线规模。
    - 公司曾吸引强势战略和财务投资人，包括 Great Wall、Meituan、Qualcomm Ventures 及其他后期投资者。
    - 技术栈横跨乘用车 ADAS 和低速自动配送，即便陷入困境，仍留下 IP 残值和赞助方期权。
    - 中国辅助驾驶和自动配送系统的终端需求仍真实存在，因此在救助情景下，Haomo 资产并不自动归零。
  topRisks:
    - 2025 年末公开报道提到运营停摆、欠薪和可能的账户冻结压力，估值问题已经变成偿付能力问题。
    - 已审阅记录中没有公开的 Haomo 2025–2026 年财务报表、现金余额、债务计划或当前估值标记。
    - Great Wall 集中度仍极高：它同时是控制生态、关键历史客户，也是最可能的救助路径。
    - 停摆之前，Great Wall 以外的多元化信号就已偏弱；Hyundai 证据在恶化，当前客户延续性也未解决。
    - 中国 2025–2026 年 OTA、数据和自动驾驶安全规则，会抬高任何重启的成本和复杂度。
  unresolvedGaps:
    - 当前现金、债务、应付款、欠薪和或有负债
    - 哪些 OEM 和配送项目仍在运行且获得支持的签署证明
    - 当前完全稀释股权结构、清算优先权，以及现有股东在救助方案中的经济性
    - Great Wall 或其他赞助方是否提供了有约束力的过桥融资或资产收购支持
    - Haomo 能在更新后的 OTA、事故和汽车数据合规制度下重启的证据
