- id: china-adas-growth-structure
  title: China ADAS is still growing, but the growth is moving up-stack and toward full-stack vendors
  body: 'The broad China intelligent-driving market remains favorable in direction. Research-and-markets syndications and specialist industry outlets describe 2025-2026 as a structural upgrade phase in which non-intelligent and low-level configurations continue to fade while high-level assisted-driving functions become mainstream. The most useful numbers are not generic TAM figures but penetration and architecture changes. Independent OEMs moved from a market dominated by non-intelligent configurations in 2022 to one in which high-level intelligent driving made up 62.7% by 2025, with urban L2.9 NOA penetration rising from 2.1% to 17.2%. Another supplier-side market lens showed L2.5 and L2.9-equipped new models reaching 30.2% and 34.82% respectively by the first four months of 2025. Gasgoo and DVN then show 2026 scale moving into components and industrialization: LiDAR installations exceeded 1.3 million units in the first four months of 2026 and the supplier stack concentrated around a few
    large players. This is positive for category demand, but it is not neutral for startup positioning. Robotics and Automation News summarized IDTechEx research showing that software-only ADAS vendors lost ground as automakers prioritized full-stack and cost-effective partnerships. That shift is strategically bad for Haomo because its commercialization problems arrived exactly as the market rewarded broader ecosystems and tighter chip-software integration.'
