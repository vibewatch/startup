callouts:
- calloutType: insight
  title: The market remained attractive even as Haomo’s feasible share set shrank
  body: Investors should not confuse category growth with company opportunity. China ADAS and autonomous delivery both retained genuine momentum in 2026, but the supplier requirements moved toward scale, integration, and ecosystem control faster than Haomo proved it could keep up.
  claimRefs:
  - CM009
  - CM014
  - CM021
  - CM030
  - CM036
- calloutType: risk
  title: Market growth did not protect startups from being squeezed by full-stack platforms
  body: The same market upgrade that made intelligent driving strategically important also punished vendors that could not offer broad OEM validation, chip alignment, or lower-cost deployment. Haomo’s position worsened precisely because these structural filters tightened while its commercialization stumbled.
