tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Why relevant to Haomo
  rows:
  - - Passenger-vehicle intelligent driving software and domain-control stack
    - ADAS software, sensor fusion, domain control, validation, map-lite and NOA capability inside production cars
    - Robotaxi fleet economics and generic semiconductor TAM
    - Automaker engineering and product teams
    - Direct target market for HPilot, NOH, and low-cost L2+/L2.9 kits
  - - Mass-market ADAS feature penetration in domestic OEMs
    - Feature attach and supplier design wins in RMB100k-RMB300k vehicles
    - Luxury-only showcase programs
    - OEM product P&L and platform owners
    - Relevant because Haomo priced HP170/370/570 for mainstream adoption
  - - Low-speed autonomous last-mile delivery
    - Vehicles, fleet operations, routing, maintenance, and delivery-service automation in controlled zones
    - Long-haul trucking, sidewalk microbots outside China, and generic e-commerce GMV
    - Retailers, food-delivery platforms, campus/community operators, logistics providers
    - Direct target market for HDeliver / Little Camel
  - - Autonomous logistics platform services
    - Fleet management, remote operations, maintenance, and deployment services around delivery vehicles
    - Broad warehouse automation or drone-only infrastructure
    - Platform operators and enterprise logistics managers
    - Important because logistics value comes from utilization, not only vehicle shipment
  - - Embodied / physical AI for intelligent driving
    - Model, data, and simulation layers that improve driving cognition and interaction
    - General foundation-model revenue unrelated to transportation
    - OEMs, AV firms, and enabling partners
    - Relevant because Haomo used DriveGPT and MANA OASIS to differentiate its roadmap
  notes: This table defines the decision-relevant markets narrowly enough to avoid double counting robotaxi, generic AI, and unrelated semiconductor opportunity.
