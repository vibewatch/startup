company:
  name: Haomo Zhixing Technology Co., Ltd.
chapter:
  number: 2
  title: Market Analysis
  summary: 'Haomo operated across two addressable markets that both remain structurally attractive in 2026: China passenger-vehicle intelligent driving, where high-level assisted-driving penetration is still rising quickly, and autonomous last-mile delivery, where logistics automation keeps attracting investment. The problem for underwriting is not market absence; it is competitive fit. China ADAS is shifting toward full-stack, chip-plus-software, mass-production platforms, while autonomous delivery still depends on city-level economics, utilization, and regulatory permission, all of which favor better-capitalized ecosystems. Haomo therefore faced a growing-market / weak-position paradox even before the reported 2025 halt.'
sections:
- id: market-boundary-definition
  title: Defining Haomo’s real market boundary before sizing it
  body: 'Haomo did not sell into one simple “autonomous driving market.” It sat at the intersection of two related but economically distinct demand pools. The first is China passenger-vehicle intelligent driving, especially L2+ to L2.9 assisted-driving systems for domestic OEMs that need a mix of sensors, compute, software, and safety validation at mass-market price points. The second is low-speed autonomous last-mile delivery, where robotics, campus and community routes, grocery delivery, and retail logistics create a different set of buyers, operating metrics, and regulatory constraints. Treating those as a single TAM would inflate the opportunity and obscure the sales reality. Passenger-vehicle ADAS depends on OEM platform wins, SOP timing, chip choices, and feature penetration in vehicle price bands. Low-speed logistics depends on route density, labor substitution, utilization, city permissions, and whether customers treat the vehicle as capex, service, or hybrid infrastructure. Haomo’s
    own product mix reflected that split: HPilot and NOH targeted OEM deployment, while HDeliver or Little Camel targeted logistics operators and retailers. The market chapter therefore uses two parallel lenses rather than one blended headline number.'
