  evidenceGaps:
  - type: missing-source
    severity: material
    topic: current-corporate-status
    missingEvidence: A formal Haomo or Great Wall statement confirming whether the company is restructuring, liquidating, or restarting operations.
    whyItMatters: Without an official status update, investors cannot cleanly underwrite continuity, equity residual value, or governance accountability.
    diligencePath: Request direct management response, labor filings, or current registry records from PRC corporate databases.
    relatedQuestionRefs:
    - QO024
    relatedTableRefs:
    - TO004
  - type: conflicting-data
    severity: material
    topic: total-capital-raised
    missingEvidence: A reconciled capitalization table or investor deck showing all financing rounds, amounts, and ownership percentages.
    whyItMatters: Public databases and media disagree on total raised and latest-round chronology, making valuation and downside-protection analysis unreliable.
    diligencePath: Obtain cap table, round documents, and shareholder register from management or legal counsel.
    relatedQuestionRefs:
    - QO010
    - QO025
    relatedTableRefs:
    - TO003
  - type: private-evidence-only
    severity: material
    topic: live-customer-diversification
    missingEvidence: A current list of paying OEM and logistics customers, program status, and revenue contribution by account.
    whyItMatters: The public record suggests extreme customer concentration, but it does not cleanly quantify whether Haomo ever diversified enough to survive outside Great Wall.
    diligencePath: Request signed customer list, shipment logs, and account-level ARR or project revenue data.
    relatedQuestionRefs:
    - QO019
    relatedTableRefs:
    - TO002
  - type: access-blocked
    severity: minor
    topic: official-corporate-website
    missingEvidence: Current Haomo newsroom or official website pages describing post-2024 products and corporate updates.
    whyItMatters: A directly accessible company site could confirm whether the business still presents itself as operating normally.
    diligencePath: Use corporate contact, PR contact, or alternative mirror sources to obtain current official materials.
