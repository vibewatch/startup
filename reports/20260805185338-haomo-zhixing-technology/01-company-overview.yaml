callouts:
- calloutType: risk
  title: The core overview risk is not technology relevance but continuity of operations
  body: Haomo still has enough historical product and deployment evidence to merit diligence attention, but the late-2025 operations halt, salary arrears, and frozen-account reporting mean investors cannot underwrite the company as a normal going concern without direct management confirmation.
  claimRefs:
  - CO021
  - CO022
  - CO023
  - CO034
- calloutType: insight
  title: Great Wall was both Haomo’s advantage and its trap
  body: Great Wall provided the original customer base, capital credibility, and platform context that helped Haomo reach unicorn status. The same dependence later narrowed external customer formation, made Haomo strategically replaceable once Great Wall scaled Coffee Pilot and partner solutions elsewhere, and now makes any recovery scenario dependent on parent-company choices.
  claimRefs:
  - CO004
  - CO011
  - CO024
  - CO025
  - CO033
