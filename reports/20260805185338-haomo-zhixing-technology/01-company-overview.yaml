- id: leadership-control-and-capital
  title: Leadership, control, and the capital stack behind the company
  body: The capital and governance picture was always central to Haomo’s story because Great Wall was simultaneously founder, strategic customer, and control anchor. Public reporting shows that Haomo reached unicorn status in late 2021 after raising nearly RMB 1 billion in a Series A round from GL Ventures, Meituan, Qualcomm Ventures, Shoucheng Holdings, and JZ Capital. TechCrunch later reported a RMB 100 million first tranche of Series B in February 2024 led by Chengdu Wufa, while CB Insights indexed the business as Series B-II and estimated total disclosed funding at about $245 million. Those numbers are directionally positive but not perfectly reconciled, which is itself an important diligence signal. Later reporting from Yicai said Haomo had completed seven financing rounds and that Great Wall Motor chairman Wei Jianjun remained the actual controller with a 37% stake. Great Wall’s own 2025 annual report does not disclose the startup’s full cap table, but it does confirm Haomo Zhixing
    as an associate and related party and records substantial cumulative loss participation tied to the investment. Leadership stability deteriorated just as funding momentum slowed. Mid-2025 coverage reported the resignation of chairman Zhang Kai and departures by senior product and technology executives, suggesting the company entered its most difficult commercial phase without a settled leadership bench.
