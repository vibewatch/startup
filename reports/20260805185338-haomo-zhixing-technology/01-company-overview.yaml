company:
  name: Haomo Zhixing Technology Co., Ltd.
chapter:
  number: 1
  title: Company Overview
  summary: 'Haomo Zhixing Technology was spun out of Great Wall Motor in 2019 to commercialize passenger-vehicle ADAS and low-speed autonomous logistics vehicles, and it once achieved unicorn status on the back of Great Wall-backed commercialization, Meituan and Qualcomm-linked funding, and a DriveGPT-centered product narrative. By the 2026 diligence date, however, the company looks distressed rather than scaling: public reporting points to management departures in 2025, weak commercialization outside Great Wall, salary arrears, and an abrupt November 2025 operations halt with no official restart statement. The key overview conclusion is that Haomo still matters as a case study in China intelligent-driving commercialization, but the present underwriting problem is not growth acceleration; it is whether the business still exists as an investable standalone entity.'
sections:
- id: identity-and-operating-scope
  title: Identity, origin, and what Haomo was built to sell
  body: 'Haomo should be understood as a Great Wall Motor spinout that tried to serve two adjacent but operationally different markets with one autonomy stack: passenger-car assisted driving and low-speed logistics autonomy. Public company-issued and independent profiles converge on the founding baseline. Haomo became an independent company in November 2019 after Great Wall separated its intelligent-driving unit, and public profiles place the company in Beijing. Its product ambition was broader than one ADAS module. The company repeatedly described a full-stack offering built around HPilot and NOH/NOA-style assisted driving for passenger cars, HPark and memory-driving features, low-speed autonomous delivery vehicles such as Little Camel or HDeliver, and later DriveGPT plus the MANA OASIS compute center as the technical layer intended to bind those products together. That breadth matters for diligence because Haomo was never only a feature vendor. It was trying to become an autonomous-driving
    platform supplier with exportable modules, open code-and-cloud collaboration, and a commercial path spanning both OEM programs and terminal logistics. The same breadth also created execution risk, because the company had to prove product-market fit in two very different buying motions at once.'
