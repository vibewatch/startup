evidenceGaps:
  - type: missing-source
    severity: material
    topic: current-corporate-status
    missingEvidence: >-
      A formal Haomo or Great Wall statement confirming whether the company is restructuring, liquidating, or restarting
      operations.
    whyItMatters: >-
      Without an official status update, investors cannot cleanly underwrite continuity, equity residual value, or
      governance accountability.
    diligencePath: Request direct management response, labor filings, or current registry records from PRC corporate databases.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO004
  - type: conflicting-data
    severity: material
    topic: total-capital-raised
    missingEvidence: >-
      A reconciled capitalization table or investor deck showing all financing rounds, amounts, and ownership
      percentages.
    whyItMatters: >-
      Public databases and media disagree on total raised and latest-round chronology, making valuation and
      downside-protection analysis unreliable.
    diligencePath: Obtain cap table, round documents, and shareholder register from management or legal counsel.
    relatedQuestionRefs:
      - QO010
      - QO025
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: live-customer-diversification
    missingEvidence: A current list of paying OEM and logistics customers, program status, and revenue contribution by account.
    whyItMatters: >-
      The public record suggests extreme customer concentration, but it does not cleanly quantify whether Haomo ever
      diversified enough to survive outside Great Wall.
    diligencePath: Request signed customer list, shipment logs, and account-level ARR or project revenue data.
    relatedQuestionRefs:
      - QO019
    relatedTableRefs:
      - TO002
  - type: access-blocked
    severity: minor
    topic: official-corporate-website
    missingEvidence: Current Haomo newsroom or official website pages describing post-2024 products and corporate updates.
    whyItMatters: A directly accessible company site could confirm whether the business still presents itself as operating normally.
    diligencePath: Use corporate contact, PR contact, or alternative mirror sources to obtain current official materials.
  - type: private-evidence-only
    severity: material
    topic: current Haomo market share in passenger ADAS
    missingEvidence: A current OEM-by-OEM production roster and cumulative active-vehicle count for Haomo software as of 2025-2026.
    whyItMatters: >-
      Without a live share measure, investors cannot translate fast category growth into a realistic company-specific
      SAM or SOM.
    diligencePath: Request active-model roster, SOP counts, and cumulative MAU or engaged-vehicle metrics from management.
    relatedQuestionRefs:
      - QM024
  - type: private-evidence-only
    severity: material
    topic: route-level logistics unit economics
    missingEvidence: Per-route utilization, intervention rate, gross margin, and customer retention data for HDeliver deployments.
    whyItMatters: Autonomous-delivery viability depends on route economics more than on headline market size or named pilot logos.
    diligencePath: >-
      Request operating dashboards for Beijing and any other live cities, including orders per vehicle per day and labor
      substitution economics.
    relatedQuestionRefs:
      - QM016
      - QM021
  - type: missing-source
    severity: material
    topic: competitive win-loss data
    missingEvidence: A current list of OEM programs lost to Huawei, Horizon, Momenta, or in-house solutions.
    whyItMatters: >-
      The market-shift thesis is stronger if specific displaced programs are documented rather than inferred from
      general industry movement.
    diligencePath: Request sales pipeline history, RFP outcomes, and customer churn records.
    relatedQuestionRefs:
      - QM018
      - QM019
  - type: conflicting-data
    severity: minor
    topic: market-size lens comparability
    missingEvidence: A single like-for-like China ADAS revenue forecast that matches Haomo’s exact product scope.
    whyItMatters: Current market lenses mix penetration statistics, supplier trend data, and broader automation market estimates.
    diligencePath: Commission a focused bottom-up market model using target OEMs, price bands, and feature attach rates.
