      - number: '3.4'
        title: Moat durability depended on production lock-in, data loops, and capital staying power
        blocks:
          - type: paragraph
            body: >-
              The strongest competitive lesson is that autonomous-driving moats are now operational rather than
              rhetorical. A supplier that wins a production program gains validation history, software-hardware tuning,
              and recurring road data that make later replacement expensive. The suppliers that appear strongest in
              2026—Horizon, Momenta, Huawei, Mobileye, Pony.ai, and WeRide—each have at least one durable moat layer in
              public view: OEM embed, chip control, data scale, global fleet operation, or financial resilience. Haomo’s
              public evidence base shows something narrower: historical commercialization tied heavily to Great Wall and
              Beijing pilots, a cost-conscious product portfolio, and a technical story that may have been promising but
