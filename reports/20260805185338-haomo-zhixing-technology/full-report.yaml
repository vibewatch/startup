              - CV047
      - number: '8.3'
        title: Public comparables define a ceiling, not a shortcut to value
        blocks:
          - type: paragraph
            body: >-
              Pony.ai, WeRide, and Mobileye are useful, but mainly as proof of what Haomo is missing. In August 2026
              Pony.ai and WeRide still carried multi-billion-dollar market caps despite modest revenue because the
              market could at least see current operations, audited or filing-backed disclosure, large cash balances,
              and ongoing commercialization momentum. Mobileye traded at a much higher absolute value because it
              combined scale, cash generation, and a mature ADAS installed base. Haomo has no comparable disclosure
              stack. There is no public 2025 or 2026 revenue statement, no disclosed cash balance, no visible cap-table
              update, no clear support backstop, and no verified restart announcement. That means public-comp math
              should be used only to cap optimism. If live and capitalized AV peers with real financial disclosure are
              worth roughly $1.9 billion to $6.8 billion in public markets, then a distressed private company with
              unresolved continuity should trade at an extreme discount to them, not at a narrative premium. The fact
              that CompaniesMarketCap and SEC-linked filing directories can point investors directly to peer annual
              reports underscores the contrast: Haomo’s problem is not a lack of industry comparables but a lack of
              current company-level observability.
