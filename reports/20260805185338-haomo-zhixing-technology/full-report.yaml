        blocks:
          - type: paragraph
            body: >-
              Haomo’s product map split across two different customer jobs. In passenger vehicles it offered HPilot and
              related NOH or NOA, memory-driving, parking, and safety-assistance features sold as tiered ADAS kits or
              broader full-stack solutions for OEMs. In logistics it offered HDeliver and the Little Camel family for
              short-route autonomous delivery, aimed at supermarkets, courier-type flows, campuses, airports, and other
              controlled environments. Public company releases stressed that Haomo was not only selling one boxed
              feature. It described a “6P” cooperation model spanning code, module, software, hardware, cloud services,
              and full-stack schemes, which implies a willingness to meet OEMs at multiple integration layers. That
              breadth is strategically relevant because it gave Haomo more ways to participate in customer workflows,
              but it also forced the company to mature two very different delivery models at once: automotive SOP-grade
              ADAS and operations-heavy logistics autonomy. The resulting product story is broader than many startup
              narratives, but the public record still leaves open how much of this surface was fully deployed versus
              still partly aspirational. That ambiguity is especially important for diligence because module breadth
              alone does not reveal whether Haomo could still service, patch, and evolve each workflow in 2026.
