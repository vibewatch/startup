  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - No restart evidence
        - No verified operating restart, funding event, or customer-support statement by the next diligence cycle
        - Breaks the rescue-option framing and pushes the case toward liquidation logic.
        - Move valuation toward the bear case and avoid all historical-mark anchoring.
      - - Liability overhang larger than expected
        - Meaningful wage arrears, litigation, debt, or account-freeze impacts emerge
        - Shrinks residual equity even if IP or customer contracts retain some enterprise value.
        - Assume common equity is deeply subordinated or effectively impaired.
      - - Great Wall provides no rescue economics
        - No binding support, asset purchase, or restructuring framework from the control ecosystem
        - Removes the most plausible strategic bridge to survival.
        - Treat the base case as too optimistic and widen downside probabilities.
      - - Customer continuity fails
        - Great Wall, Dmall/Wumart, Meituan, or other named programs are inactive or unsupported
        - Undercuts the argument that installed-base obligations create a defendable asset floor.
        - Cut base and bull ranges materially.
      - - Compliance stack is not restart-ready
        - No evidence of OTA, incident, or automotive-data compliance under the newer rules
        - Raises the cost and time needed to commercialize again.
        - Lower bull-case probability and retain avoid stance.
    notes: These are decision triggers, not generic watchlist items.
    claimRefs:
      - CV021
      - CV030
      - CV033
      - CV040
      - CV041
      - CV042
      - CV043
      - CV044
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Current solvency
        - Cash, debt, payables, payroll arrears, frozen-account status, and contingent liabilities
        - Determines whether investors are underwriting a rescue, a restructuring, or a near-zero residual equity case.
        - Request current management package and legal / finance diligence memo.
      - - Customer continuity
        - Signed confirmation of live OEM and delivery programs plus current support responsibilities
        - Separates historical traction from current monetizable relationships.
        - Request customer letters, SLA schedules, and current deployment map.
      - - Cap table and preferences
        - Current fully diluted ownership, liquidation preferences, and sponsor rights
        - Residual equity can diverge sharply from asset value in a distressed rescue.
        - Review financing documents and shareholder agreements.
      - - Great Wall economics
        - Whether Great Wall offers bridge funding, asset purchase interest, or other enforceable support
        - Great Wall is the most plausible rescue vector and also the main concentration node.
        - Request board materials, related-party agreements, and sponsor correspondence.
      - - Compliance readiness
        - OTA permit history, incident response process, product-admission records, and data-transfer compliance status
        - A restart under the 2025-2026 regime is not credible without safety and data evidence.
        - Request regulatory workpapers and internal compliance owners.
      - - People retention
        - Status of key engineering, product, and support personnel after the halt
        - IP value falls fast if the execution core has already dispersed.
        - Request org chart, retention plan, and signed employment status list.
    notes: >-
      These asks are ordered by how quickly they could move Haomo from unpriceable distress into a bounded
      strategic-opportunity case.
    claimRefs:
      - CV040
      - CV041
      - CV042
      - CV043
      - CV044
