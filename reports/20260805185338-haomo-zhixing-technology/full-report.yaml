          Haomo had real historical commercialization proof in passenger ADAS and low-speed delivery, plus credible
          institutional investors.
        - thesis
        - >-
          Fresh proof that these historical assets still have an intact team, active customers, and support obligations
          would strengthen the thesis.
      - - >-
          Great Wall remains the most plausible sponsor or rescue vector because it sits at the center of control,
          customer history, and strategic context.
        - thesis
        - >-
          A disclosed funding backstop, asset purchase, or restructuring framework would materially improve
          underwritability.
      - - >-
          Meituan, Wumart/Dmall, and broader last-mile automation demand show that the end market did not disappear even
          if Haomo weakened.
        - thesis
        - Named 2026 live-program confirmation tied directly to Haomo would improve the asset-value floor.
      - - >-
          The late-2025 halt means every historical proof point turns into a continuity question rather than a valuation
          premium.
        - anti-thesis
        - An audited or management-certified restart update would reduce this discount.
      - - >-
          No public 2025-2026 Haomo financials, cash balance, debt schedule, or share-count bridge exist in the reviewed
          materials.
        - anti-thesis
        - Current financial statements and cap-table disclosure would turn the company from opaque to priceable.
      - - >-
          China’s regulatory regime for OTA, CDAS, data, and L3/L4 safety is tougher now than when Haomo originally
          scaled.
        - anti-thesis
        - Evidence of regulator-ready processes and permits would improve the probability of a viable restart.
    notes: >-
