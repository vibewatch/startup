  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: >-
          Regulatory and legal risk: China now expects ADAS and autonomy companies to behave like safety-critical
          manufacturers
        blocks:
          - type: paragraph
            body: >-
              The most important contextual change for Haomo is that China’s regulatory environment for intelligent
              driving became materially stricter just as Haomo’s own operating condition worsened. The February 2025
              MIIT and SAMR notice tightened product admission, recall, incident reporting, and OTA governance for
              intelligent connected vehicles with combined driver-assistance systems. Those rules matter directly to
              Haomo because its historical pitch depended on frequent software iteration, evolving NOA capability, and
              safety-sensitive automation claims. The new framework requires fuller testing and verification, clearer
              system boundaries, record filing, and recall-style handling when OTA changes fix safety defects. Beijing’s
              autonomous-vehicle regulation and the 2026 cross-border automotive-data guide further show that
              public-road and data-governance expectations are rising, not falling. Then the Xiaomi SU7 crash
              accelerated enforcement pressure on marketing language and rollout caution across the sector. For a
              company already in distress, this is dangerous: a restart would not happen in a permissive policy window
              but under a more demanding safety, disclosure, and compliance regime than the one Haomo scaled under in
              2023 and 2024.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
