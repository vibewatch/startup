  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      Historical proof still exists, but today it flows through distress, opacity, and sponsor dependence into an avoid
      call.
    data:
      nodes:
        - id: legacy-proof
          label: Historical proof
          detail: Unicorn status, OEM deployments, and delivery volumes show Haomo once had real traction.
          tone: positive
        - id: distress
          label: Operational distress
          detail: Late-2025 halt, salary arrears, and continuity risk dominate the present-tense story.
          tone: negative
        - id: opacity
          label: Financial opacity
          detail: No public 2025-2026 revenue, cash, debt, or cap-table bridge exists.
          tone: negative
        - id: sponsor
          label: Sponsor dependence
          detail: Great Wall is both the best rescue path and the biggest concentration node.
          tone: warning
        - id: decision
          label: Avoid / distressed only
          detail: Do not pay anywhere near legacy marks without fresh diligence and explicit rescue economics.
          tone: neutral
      edges:
        - from: legacy-proof
          to: decision
        - from: distress
          to: decision
        - from: opacity
          to: decision
        - from: sponsor
          to: decision
    approximationNotes: null
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV018
      - CV033
      - CV034
      - CV037
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: standard
    summary: Value moves much more with proof of restart and liabilities than with sector TAM narratives.
    data:
      items:
        - label: No restart proof / liabilities unclear
          value: 0.03
          detail: Residual common equity drifts toward salvage value only.
          tone: negative
        - label: Restart proof only
          value: 0.12
          detail: The company looks less terminal, but customer and financing gaps remain.
          tone: warning
        - label: Restart + active customers
          value: 0.22
          detail: Operational continuity improves the defendable asset floor materially.
          tone: neutral
        - label: Restart + funding + compliance package
          value: 0.38
          detail: A real rescue case emerges, but still below historical peak pricing.
          tone: positive
    approximationNotes: Values are scenario-based USD billions and illustrate sensitivity to evidence milestones, not management guidance.
    claimRefs:
      - CV022
      - CV023
      - CV029
      - CV030
      - CV031
      - CV043
  - id: FV003
    title: Valuation / return range
    type: range
    layout: wide
    summary: Most defensible current outcomes lie far below the historical unicorn narrative.
    data:
      items:
        - label: Bear case
          low: 0
          mid: 0.025
          high: 0.05
          displayValue: $0M-$50M
          detail: Liquidation or piecemeal asset-sale logic dominates.
          tone: negative
        - label: Base case
          low: 0.08
          mid: 0.14
          high: 0.2
          displayValue: $80M-$200M
          detail: Strategic rescue preserves partial operating and IP value but not the old growth-company mark.
          tone: warning
        - label: Bull case
          low: 0.25
          mid: 0.35
          high: 0.45
          displayValue: $250M-$450M
          detail: Documented restart and fresh capital improve the case, but the continuity break still caps upside.
          tone: positive
    approximationNotes: Ranges are scenario-based USD billions for present-day equity value discussion only.
    claimRefs:
      - CV027
      - CV028
      - CV029
      - CV030
      - CV031
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: Haomo scores better on historical proof than on present-day investability.
    data:
      items:
        - label: Historical commercialization proof
          score: 6
          detail: 20+ vehicle models and real last-mile order volume were meaningful achievements.
          tone: positive
        - label: Current operating continuity
          score: 1
          detail: Public evidence after the 2025 halt does not prove a stable running company.
          tone: negative
        - label: Customer diversification
          score: 2
          detail: Great Wall concentration remained high and Hyundai diversification weakened.
          tone: negative
        - label: Financial transparency
          score: 1
          detail: No current revenue, cash, debt, or share-count bridge is public.
          tone: negative
        - label: Regulatory restart readiness
          score: 2
          detail: The compliance burden is rising and restart readiness is unproven.
          tone: warning
        - label: Strategic sponsor optionality
          score: 5
          detail: Great Wall still creates a plausible rescue path, though not a proven one.
          tone: neutral
        - label: Evidence quality for pricing
          score: 4
          detail: Enough evidence exists to reject old marks, but not to underwrite a tight fair value.
          tone: warning
    approximationNotes: Scores are ordinal 0-10 judgments synthesized from the public evidence set for investment-committee discussion.
    claimRefs:
      - CV018
      - CV020
      - CV021
      - CV033
      - CV035
      - CV043
      - CV048
