          - type: callout
            title: Market growth did not protect startups from being squeezed by full-stack platforms
            body: >-
              The same market upgrade that made intelligent driving strategically important also punished vendors that
              could not offer broad OEM validation, chip alignment, or lower-cost deployment. Haomo’s position worsened
              precisely because these structural filters tightened while its commercialization stumbled.
