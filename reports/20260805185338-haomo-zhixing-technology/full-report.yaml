  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Defining Haomo’s real market boundary before sizing it
        blocks:
          - type: paragraph
            body: >-
              Haomo did not sell into one simple “autonomous driving market.” It sat at the intersection of two related
              but economically distinct demand pools. The first is China passenger-vehicle intelligent driving,
              especially L2+ to L2.9 assisted-driving systems for domestic OEMs that need a mix of sensors, compute,
              software, and safety validation at mass-market price points. The second is low-speed autonomous last-mile
              delivery, where robotics, campus and community routes, grocery delivery, and retail logistics create a
              different set of buyers, operating metrics, and regulatory constraints. Treating those as a single TAM
              would inflate the opportunity and obscure the sales reality. Passenger-vehicle ADAS depends on OEM
              platform wins, SOP timing, chip choices, and feature penetration in vehicle price bands. Low-speed
              logistics depends on route density, labor substitution, utilization, city permissions, and whether
              customers treat the vehicle as capex, service, or hybrid infrastructure. Haomo’s own product mix reflected
              that split: HPilot and NOH targeted OEM deployment, while HDeliver or Little Camel targeted logistics
              operators and retailers. The market chapter therefore uses two parallel lenses rather than one blended
              headline number.
