  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: 'Customer segmentation: the real payer was usually an automaker or platform operator, not the end user'
        blocks:
          - type: paragraph
            body: >-
              Haomo served at least two distinct customer motions. In passenger vehicles, the direct payer was the
              automaker or vehicle-program team buying an ADAS stack, while the driver was only the downstream user. In
              low-speed logistics, the payer was a retailer, supermarket operator, instant-delivery platform, or
              scenario owner deciding whether autonomous delivery could lower labor pressure and maintain service
              levels. That distinction matters because logo count can overstate diversification. Great Wall was not just
              one customer among many; it was the company’s historical parent ecosystem, largest visible production
              channel, and likely core source of commercialization credibility. The logistics roster added important
              proof that Haomo technology reached real operating routes, but those relationships look more like
              programmatic route deployments than like a broad, transparent recurring-revenue base. The diligence
              question is therefore not whether Haomo ever had customers. It did. The harder question is how much of the
              economic value sat inside Great Wall and a small number of Beijing-centered delivery programs rather than
              inside a diversified set of independent contracts.
