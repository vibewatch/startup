companyProfile:
  summary: >-
    Haomo Zhixing Technology was spun out of Great Wall Motor in 2019 to commercialize passenger-vehicle
    assisted-driving systems and autonomous last-mile logistics vehicles. The company built meaningful historical proof
    through HPilot deployments in more than 20 vehicle models, delivery-route activity in Beijing retail ecosystems, and
    a 2021 unicorn funding round, then added further B1 and B2 capital in 2024. By the August 2026 diligence date,
    however, the public record points to a distressed standalone asset rather than a scaling growth company: late-2025
    reporting described halted operations and salary arrears, Great Wall remained the control ecosystem, and no clean
    public bridge from historical traction to current solvency or restart was available.
