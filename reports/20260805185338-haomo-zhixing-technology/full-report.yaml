      - number: '7.4'
        title: 'Financial/model risk and kill criteria: missing restart proof is now as important as strategy'
        blocks:
          - type: paragraph
            body: >-
              The financial risk here is not merely that Haomo was capital intensive. It is that public evidence no
              longer shows a functioning financial bridge from historical traction to current survivability. There are
              no public audited 2025 or 2026 Haomo financial statements, no disclosed cash balance, no debt schedule, no
              customer receivables aging, and no enforceable Great Wall funding backstop in the public record. At the
              same time, Haomo’s model remained structurally demanding: low-cost ADAS, autonomous-delivery vehicles, and
              frontier-model R&D each pull cash and management attention in different ways. ML Vehicle’s reporting that
              Little Camel 2025 sales targets were low and Hyundai-related delivery timing slipped suggests the business
              was already struggling to convert product breadth into scaled, reliable commercial execution before the
              halt. That leaves a clear IC conclusion. Until management can prove restarted operations, current cash,
              active customers, and compliance readiness, the burden of proof sits entirely with the company. In
              practical diligence terms, those missing facts are not ordinary information gaps; they are thesis-break
              triggers.
