        title: 'Revenue model: multiple monetization paths were visible, but real revenue quality was not'
        blocks:
          - type: paragraph
            body: >-
              Haomo’s public materials show a mixed revenue model rather than a single pure-software business. On the
              passenger-car side, the company sold ADAS kits and broader smart-driving solutions into OEM programs, with
              HP170, HP370, and HP570 positioned as price-tiered products for low- to high-end vehicles. On the
              logistics side, Haomo marketed HDeliver and related low-speed autonomous vehicles, suggesting hardware
              revenue, deployment revenue, and possibly continuing operations or support fees. Public media and
              company-linked coverage also describe code, modules, hardware, software, and cloud services, implying that
              Haomo likely monetized a bundle of product and integration work rather than one recurring SaaS fee.
