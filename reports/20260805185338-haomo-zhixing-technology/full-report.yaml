      - number: '2.4'
        title: 'Market implication: Haomo’s timing window narrowed as both markets became scale games'
        blocks:
          - type: paragraph
            body: >-
              The market implication is not that Haomo picked the wrong categories. It picked categories that ultimately
              became harder for a mid-scale, strategically dependent startup to win. In passenger ADAS, the center of
              gravity shifted toward platforms that combine chips, software, safety, and broad OEM coverage, with
              Huawei, Horizon, and similar ecosystems defining the benchmark. In low-speed logistics, demand remained
              real but economics increasingly depended on repeatable route density, lower vehicle cost, and operational
              integration with giant platforms such as Meituan, Alibaba, JD, or specialized robot operators. Haomo had
              pieces of each story—low-cost HPilot kits for mainstream vehicles, named logistics pilots, and a research
              narrative around DriveGPT—but by 2025 it lacked evidence of broad OEM diversification or logistics scale
              strong enough to overcome its dependence on Great Wall. The underlying markets could therefore continue to
              grow even while Haomo’s own feasible SAM and SOM contracted. That divergence matters for valuation:
              investors cannot justify a bullish view by citing category growth alone when the company’s route to share
              capture has already been impaired by commercialization delays and a reported work stoppage.
            claimRefs:
              - CM030
              - CM031
              - CM032
              - CM033
              - CM034
              - CM035
              - CM036
              - CM037
              - CM038
              - CM039
