chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, origin, and what Haomo was built to sell
        blocks:
          - type: paragraph
            body: >-
              Haomo should be understood as a Great Wall Motor spinout that tried to serve two adjacent but
              operationally different markets with one autonomy stack: passenger-car assisted driving and low-speed
              logistics autonomy. Public company-issued and independent profiles converge on the founding baseline.
              Haomo became an independent company in November 2019 after Great Wall separated its intelligent-driving
              unit, and public profiles place the company in Beijing. Its product ambition was broader than one ADAS
              module. The company repeatedly described a full-stack offering built around HPilot and NOH/NOA-style
              assisted driving for passenger cars, HPark and memory-driving features, low-speed autonomous delivery
              vehicles such as Little Camel or HDeliver, and later DriveGPT plus the MANA OASIS compute center as the
              technical layer intended to bind those products together. That breadth matters for diligence because Haomo
              was never only a feature vendor. It was trying to become an autonomous-driving platform supplier with
              exportable modules, open code-and-cloud collaboration, and a commercial path spanning both OEM programs
              and terminal logistics. The same breadth also created execution risk, because the company had to prove
              product-market fit in two very different buying motions at once.
