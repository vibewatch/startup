      - number: '1.3'
        title: Commercial proof, customer footprint, and the real scale achieved before the crisis
        blocks:
          - type: paragraph
            body: >-
              Haomo did achieve non-trivial public commercialization markers before the 2025 crisis. The strongest
              historical proof came from Great Wall vehicle deployment and Beijing logistics operations rather than from
              a broad third-party OEM roster. Company-linked and independent sources said HPilot or NOH products had
              reached more than 20 Great Wall-linked vehicle models, while the official 2023 DriveGPT release said Haomo
              had become a supplier for three automakers after previously selling mainly to Great Wall. On the logistics
              side, TechCrunch said Haomo’s delivery vans had ferried close to 300,000 grocery parcels for supermarkets
              in Beijing, and Logistics Tech Outlook described more than 200,000 cumulative orders by July 2023 across
              collaborations with Meituan, Wumart Dmall, and Dada Nexus. Friendly Auto’s 2025 summary added that Little
              Camel versions 2.0 and 3.0 had entered commercial operation across nine use cases, and that Haomo-powered
              passenger vehicles had logged more than 141 million assisted-driving kilometers by May 2024. These metrics
              show Haomo was more than a lab project. But the pattern is also narrow. Great Wall remained the central
              OEM distribution channel, the logistics proof clustered around Beijing pilot zones, and independent
              evidence of durable multi-customer revenue scale remained thin even before the shutdown reports surfaced.
            claimRefs:
              - CO010
              - CO011
              - CO012
              - CO013
              - CO019
              - CO020
