      - number: '2.3'
        title: Autonomous last-mile delivery is real, but it still behaves like an ROI and operating-model market
        blocks:
          - type: paragraph
            body: >-
              Haomo’s logistics business targeted a market with real structural demand, but one that remains unforgiving
              operationally. Grand View Research estimated the global autonomous last-mile-delivery market at about
              US$1.6 billion in 2024 and projected about US$5.9 billion by 2030, while DataM put the China market alone
              at roughly US$6.05 billion in 2026 and nearly US$26 billion by 2035. Those market numbers should not be
              treated as near-term revenue pools for Haomo; they are adoption ceilings shaped by hardware cost, urban
              density, food and grocery demand, and smart-city investment. The more useful readthrough is the operating
              logic. Ground vehicles dominate because they fit controlled, repetitive routes better than aerial systems,
              and China’s densest use cases remain campuses, business districts, residential compounds, supermarkets,
              and community logistics. DataM explicitly frames the market as entering a critical investment-timing phase
              in which utilization, regulatory approvals, operator ratio, battery economics, and insurance frameworks
              determine whether pilot deployments become scalable businesses. Logistics Tech Outlook’s Haomo profile
              fits that picture well: it showed real parcel movement and named customers, but still in geography- and
              use-case-bounded environments. That means the logistics opportunity stayed open, yet the bar for durable
              advantage was rising toward fleet economics and ecosystem integration rather than prototype novelty.
            claimRefs:
              - CM020
              - CM021
              - CM022
