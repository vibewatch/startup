  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: 'Recommendation: avoid unless entry is explicitly distressed and backed by fresh diligence'
        blocks:
          - type: paragraph
            body: >-
              The right present-tense call is avoid, not because Haomo never built anything real, but because the public
              evidence no longer supports underwriting it like an operating growth company. Haomo did achieve meaningful
              milestones: unicorn status in 2021, additional B1 and B2 funding in 2024, deployment into more than 20
              passenger-vehicle models, and last-mile delivery volume measured in hundreds of thousands of parcels or
              orders. In a different context those facts could support a track recommendation. But by late 2025 the
              story changed from commercialization to continuity. Multiple outlets reported that work stopped, salaries
              were in arrears, and company accounts may have been frozen. Great Wall’s 2025 annual report still shows
              Haomo as an associate with accumulated losses, yet there is no public bridge from that disclosure to a
              restart, recapitalization, or clean residual-equity story. That gap matters more than market size or
              product ambition. Investors are not being asked to price only autonomy software optionality; they are
              being asked to price whether the underlying operating entity still has enough team, liquidity, compliance
              readiness, and customer support capacity to matter. Without new diligence that proves those points, the
              only defensible stance is to assume heavy impairment versus the old unicorn narrative.
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
