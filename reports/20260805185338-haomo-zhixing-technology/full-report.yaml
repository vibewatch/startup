              Haomo’s public customer record supports an obvious land-and-expand theory but offers very little true
              retention disclosure. In ADAS, the natural expansion path is one OEM program growing into more models,
              more trims, and more lifetime vehicle volume. In delivery, the expansion path is one district or route
              growing into more communities, more use cases, and denser order throughput. Those pathways appear in the
              public record, but investors still do not get the underwriting metrics that matter most: NRR, GRR, churn,
              contract length, renewal timing, customer-level revenue, or attach rates by customer. The best proxy for
              durability is Great Wall continuity, because Haomo remained an associate and related-party ecosystem name
