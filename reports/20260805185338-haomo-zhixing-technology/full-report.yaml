  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Competitive landscape: Haomo fought startups, incumbents, and substitutes at the same time'
        blocks:
          - type: paragraph
            body: >-
              Haomo’s competitive set was broader than a simple startup leaderboard. In passenger vehicles, it had to
              win OEM sourcing cycles against Horizon, Momenta, Huawei-linked stacks, and other third-party
              intelligent-driving suppliers. In low-speed autonomy, it also had to prove delivery economics against
              robotaxi or robotruck operators whose technology, data, and capital bases could spill into adjacent
              commercial use cases. Just as important, Haomo faced substitute competition from Great Wall’s internal
              smart-driving roadmap, from incumbent global suppliers such as Mobileye, and from the status quo of human
              delivery plus conventional ADAS. That matters because Haomo tried to bridge two buying motions at once:
              car-program sourcing and logistics-operations automation. Public evidence suggests this multi-front
              competition became harder as the industry consolidated around a smaller number of scaled ecosystems with
              clearer chip, data, or distribution advantages. The most relevant comparison is therefore not “which
              startup had the best demo,” but which companies became hardest for OEMs and platform operators to avoid in
              real procurement decisions.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
