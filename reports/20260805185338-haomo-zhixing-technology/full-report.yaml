      - number: '1.4'
        title: Milestones, distress signals, and the current state of the company
        blocks:
          - type: paragraph
            body: >-
              The milestone record splits cleanly into an ascent phase and a breakdown phase. The ascent runs from the
              2019 spinout through early financing rounds, 2021 unicorn status, the April 2023 DriveGPT launch, and the
              October 2023 release of lower-cost HP170, HP370, and HP570 assisted-driving products. The breakdown phase
              becomes visible in 2025. KrASIA’s mid-2025 translated 36Kr reporting said Haomo had only two Hyundai
              passenger-vehicle projects left, had missed urban-NOA delivery targets, and had reduced its Little Camel
              sales target to around 50 units while focusing on clearing inventory rather than launching new models. The
              crisis sharpened in late 2025 when KrASIA, CarNewsChina, and Yicai all reported that employees were told
              not to report to work, that salaries were already in arrears, and that frozen accounts and possible
              litigation were being discussed internally. Great Wall’s own annual report strengthens the concern
              indirectly by showing that it had moved its public intelligent-driving narrative toward in-house Coffee
              Pilot 3 and 4 plus VLA and world-model systems, while recognizing further Haomo-related investment losses.
              The most important present-tense overview fact is therefore not simply that Haomo once reached unicorn
              status; it is that by August 2026 there is still no public official statement clearly confirming restart,
              restructuring, or liquidation.
