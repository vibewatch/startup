      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The market remained attractive even as Haomo’s feasible share set shrank
            body: >-
              Investors should not confuse category growth with company opportunity. China ADAS and autonomous delivery
              both retained genuine momentum in 2026, but the supplier requirements moved toward scale, integration, and
              ecosystem control faster than Haomo proved it could keep up.
            calloutType: insight
            claimRefs:
              - CM009
              - CM014
