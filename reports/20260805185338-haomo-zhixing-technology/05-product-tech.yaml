- id: architecture-data-and-dependencies
  title: 'Architecture and technical differentiation: DriveGPT, sensor tiers, and research tooling formed the core technical narrative'
  body: 'Haomo’s technical narrative centered on making assisted driving cheaper, more capable, and more explainable at the same time. The 2023 AI Day releases described DriveGPT as a GPT-style autoregressive planning model built on a “Drive Language,” with RLHF-like human-feedback training intended to make decisions safer, smoother, and more interpretable. The HP170, HP370, and HP570 product tiers show that this narrative was grounded in concrete sensor and compute bundles rather than in abstract AI branding alone: the three SKUs used materially different compute budgets, cameras, radars, parking capability, and optional LiDAR. Third-party explanation of DriveGPT emphasizes that a planning model still depends on high-quality perception inputs, which fits Haomo’s own 6P framing and the likely role of infrastructure such as MANA OASIS and upstream compute partners. Meanwhile, Haomo’s GitHub presence suggests real practitioner output around LiDAR-camera fusion, occupancy forecasting, and place
    recognition. The important technical conclusion is that Haomo looked like a company with meaningful research capacity and a plausible architecture thesis—but one still dependent on sensors, chips, data pipelines, compute partners, and vehicle-program execution rather than on model novelty alone.'
