    - HP170 / HP370 / HP570
    - Lower driver workload and NOA-like convenience
    - Current reliability metrics are not publicly updated
  - - Urban assisted driving
    - Driver handles dense urban complexity with support
    - HP570 plus DriveGPT narrative
