- id: maturity-roadmap-and-trust
  title: 'Maturity, roadmap, and trust: shipped enough to matter, but not enough to remove support risk'
  body: 'Haomo’s public roadmap contains both evidence of shipping and evidence of fragility. On the positive side, official releases show that HPilot had reached close to 20 models by April 2023 and more than 20 models by 2024, that DriveGPT was attached to a mass-production vehicle narrative, and that Little Camel 2.0 and 3.0 were said to be in commercial operation across multiple use cases. The company also claimed export progress into the EU, Israel, and later planned regions. But maturity is not the same as continuity. Later reporting said city-NOA targets slipped, Hyundai delivery programs were delayed, and the company’s active commercial surface may have narrowed sharply by 2025. Trust and compliance evidence is similarly uneven. Haomo publicized specific safety or hardware claims—such as five-star AEB for HP170 and HD-map independence—yet retained sources do not show a current public reliability dashboard, support SLA, software-release log, cybersecurity program, or post-crisis quality
    statement. For buyers, that gap matters: automotive and logistics customers need long-lived support and compliance proof, not just technically credible features. The maturity verdict is therefore mixed-to-adverse: historically nontrivial, presently uncertain. Another practical implication is documentation depth: there is enough public material to map the 2023 stack, but not enough current material to verify whether buyers still receive active releases, issue remediation, or long-term maintenance. In a safety-sensitive domain, that missing operational evidence narrows the value of otherwise impressive feature disclosures.'
