company:
  name: Haomo Zhixing Technology Co., Ltd.
chapter:
  number: 5
  title: Product & Technology
  summary: Haomo built a real product surface, not just an autonomy research story. Public sources show two customer-facing product families—HPilot passenger-vehicle ADAS and HDeliver/Little Camel autonomous delivery vehicles—plus a technology layer anchored in DriveGPT, a “6P” full-stack positioning, and MANA OASIS-style compute infrastructure. The challenge is maturity, not imagination. Haomo’s 2023-2024 releases described map-free NOA, tiered ADAS SKUs, explainable large-model planning, and export ambitions, while its GitHub footprint suggests genuine research depth in perception and mapping. By 2026, however, current trust in deployment quality and roadmap continuity is weakened by delayed city-NOA commercialization and the late-2025 operating crisis. The technical verdict is that Haomo looked directionally credible but operationally under-proven at the moment diligence mattered most.
sections:
- id: product-surface-and-customer-jobs
  title: 'Product surface: Haomo sold driver assistance and autonomous delivery into very different workflows'
  body: 'Haomo’s product map split across two different customer jobs. In passenger vehicles it offered HPilot and related NOH or NOA, memory-driving, parking, and safety-assistance features sold as tiered ADAS kits or broader full-stack solutions for OEMs. In logistics it offered HDeliver and the Little Camel family for short-route autonomous delivery, aimed at supermarkets, courier-type flows, campuses, airports, and other controlled environments. Public company releases stressed that Haomo was not only selling one boxed feature. It described a “6P” cooperation model spanning code, module, software, hardware, cloud services, and full-stack schemes, which implies a willingness to meet OEMs at multiple integration layers. That breadth is strategically relevant because it gave Haomo more ways to participate in customer workflows, but it also forced the company to mature two very different delivery models at once: automotive SOP-grade ADAS and operations-heavy logistics autonomy. The resulting
    product story is broader than many startup narratives, but the public record still leaves open how much of this surface was fully deployed versus still partly aspirational. That ambiguity is especially important for diligence because module breadth alone does not reveal whether Haomo could still service, patch, and evolve each workflow in 2026.'
