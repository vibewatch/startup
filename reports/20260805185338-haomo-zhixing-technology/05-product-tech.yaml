    - Edge-case reliability is not publicly quantified
  - - Supermarket last-mile delivery
    - Human couriers or mixed rider flows
    - HDeliver / Little Camel
    - Lower labor intensity on controlled short routes
    - Scale economics remain geography- and route-dependent
  - - Campus / park / airport logistics
    - Manual or cart-based controlled-zone movement
    - Little Camel deployment
    - Fits predictable routes and contained ODDs
    - Requires permits, maintenance, and local ops support
  notes: The same company addressed very different workflows, which raised both product breadth and execution complexity.
