- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Perception sensor stack
    - Feeds object, lane, and scene information into driving system
    - Cameras, radars, optional LiDAR by SKU
    - Performance degrades if upstream sensing or calibration is weak
  - - DriveGPT / planning layer
    - Generates or improves action decisions and reasoning
    - Large-model training data, compute, and human-feedback loops
    - Interpretability narrative does not guarantee production latency or safety
  - - Vehicle compute platform
    - Runs HPilot tiers with 5, 32, 72/100 TOPS class compute depending on SKU
    - Automotive-grade chips and thermal/reliability integration
    - Chip cost, partner access, and deployment optimization matter
  - - Cloud / data / 6P stack
    - Supports code, module, software, hardware, cloud, and full-stack cooperation
    - OEM integrations, data pipelines, compute centers, partners
    - Architecture breadth creates integration and support complexity
  - - Logistics vehicle platform
    - Combines autonomy stack with vehicle, cargo, and route operations
    - Vehicle manufacturing, maintenance, and route ops
    - Hardware and ops burden can overwhelm software-margin hopes
  notes: Architecture evidence is strongest where Haomo disclosed concrete sensor or compute configurations; weakest where only high-level marketing terms survive.
