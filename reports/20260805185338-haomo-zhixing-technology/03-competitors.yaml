- id: china-adas-ecosystem-rivals
  title: China ADAS rivals moved toward integrated ecosystems with stronger OEM embed
  body: 'Horizon, Momenta, and Huawei illuminate why Haomo’s passenger-car position weakened. Horizon’s public materials show a tightly integrated story: Journey 6 silicon, HSD assisted-driving software, reference tools, and segmented packages for RMB100k+, RMB150k+, and RMB200k+ vehicle bands. Momenta’s public partnerships and third-party coverage show another strong model: an end-to-end data flywheel sold through many OEM programs rather than through one anchor customer. Huawei’s Qiankun ADS shows a third path, combining sensor redundancy, local data density, and ecosystem power large enough to influence supplier share at the market level. These rivals differ in technical route, but they converge on the same commercial advantage: they became difficult for automakers to ignore because they offered either chip-plus-stack integration, wide model coverage, or both. Haomo’s low-cost HPilot messaging looked strategically sensible, yet by 2026 it was competing against larger rivals that could
    also segment products by vehicle price tier while bringing more production wins, more capital, and richer data loops.'
