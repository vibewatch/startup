- id: switching-costs-distribution-and-moat
  title: Moat durability depended on production lock-in, data loops, and capital staying power
  body: 'The strongest competitive lesson is that autonomous-driving moats are now operational rather than rhetorical. A supplier that wins a production program gains validation history, software-hardware tuning, and recurring road data that make later replacement expensive. The suppliers that appear strongest in 2026—Horizon, Momenta, Huawei, Mobileye, Pony.ai, and WeRide—each have at least one durable moat layer in public view: OEM embed, chip control, data scale, global fleet operation, or financial resilience. Haomo’s public evidence base shows something narrower: historical commercialization tied heavily to Great Wall and Beijing pilots, a cost-conscious product portfolio, and a technical story that may have been promising but no longer sat inside the leading ecosystem narrative. Once trust deteriorated through management churn, salary-arrears reports, and the operations halt, even a technically credible stack became far harder to underwrite for new vehicle programs. The resulting moat
    assessment is weak: Haomo lacked a clearly durable competitive layer that looked stronger than customer concentration and execution risk.'
