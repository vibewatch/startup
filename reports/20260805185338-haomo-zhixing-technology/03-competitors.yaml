chapter:
  number: 3
  title: Competitors
  summary: 'Haomo’s closest strategic competitors by 2026 were no longer small autonomous-driving startups alone. In passenger-vehicle ADAS, the center of gravity had moved to scaled Chinese ecosystems such as Horizon, Momenta, and Huawei, plus the global benchmark Mobileye. In L4 logistics and robotaxi-adjacent autonomy, Pony.ai, WeRide, and DeepRoute showed broader fleet, OEM, or platform breadth than Haomo. Haomo still had evidence of early commercialization and low-cost product packaging, but its moat eroded as the market shifted toward chip-plus-software integration, production design wins, and capital resilience. The competitive conclusion is therefore bearish: category demand stayed strong, while Haomo’s relative position weakened.'
sections:
- id: competitive-landscape-and-substitutes
  title: 'Competitive landscape: Haomo fought startups, incumbents, and substitutes at the same time'
  body: 'Haomo’s competitive set was broader than a simple startup leaderboard. In passenger vehicles, it had to win OEM sourcing cycles against Horizon, Momenta, Huawei-linked stacks, and other third-party intelligent-driving suppliers. In low-speed autonomy, it also had to prove delivery economics against robotaxi or robotruck operators whose technology, data, and capital bases could spill into adjacent commercial use cases. Just as important, Haomo faced substitute competition from Great Wall’s internal smart-driving roadmap, from incumbent global suppliers such as Mobileye, and from the status quo of human delivery plus conventional ADAS. That matters because Haomo tried to bridge two buying motions at once: car-program sourcing and logistics-operations automation. Public evidence suggests this multi-front competition became harder as the industry consolidated around a smaller number of scaled ecosystems with clearer chip, data, or distribution advantages. The most relevant comparison
    is therefore not “which startup had the best demo,” but which companies became hardest for OEMs and platform operators to avoid in real procurement decisions.'
