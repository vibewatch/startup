- id: from-unicorn-mark-to-distressed-underwriting
  title: The key valuation fact is the break between the historical unicorn mark and the current distress signal
  body: Haomo’s historical price anchors are easy to describe but unsafe to reuse. The 2021 Series A created a unicorn narrative at more than $1 billion valuation, and the company still raised more than CNY400 million across B1 and B2 in 2024. If the company had then shown stable 2025 revenue growth, current customer continuity, and sponsor-backed liquidity, those legacy marks would still matter. Instead, the public record shows the opposite direction. By mid-2025 commercialization problems were already visible in weak Hyundai diversification, reduced low-speed vehicle targets, and organizational turbulence. By November 2025, multiple reports described a halt, salary arrears, and operational paralysis. Great Wall remained the actual controller ecosystem and its annual report still carried Haomo-related losses, but the same filing also emphasized Great Wall’s own Coffee Pilot, VLA, and world-model path rather than a simple Haomo rescue narrative. That combination makes legacy pricing stale. Historical investors were funding a scaling autonomy supplier; current investors would be funding a restructuring, rescue, or asset-preservation story. Those are fundamentally different valuation problems, and the discount between them should be very large.
