- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - No restart evidence
    - No verified operating restart, funding event, or customer-support statement by the next diligence cycle
    - Breaks the rescue-option framing and pushes the case toward liquidation logic.
    - Move valuation toward the bear case and avoid all historical-mark anchoring.
  - - Liability overhang larger than expected
    - Meaningful wage arrears, litigation, debt, or account-freeze impacts emerge
    - Shrinks residual equity even if IP or customer contracts retain some enterprise value.
    - Assume common equity is deeply subordinated or effectively impaired.
  - - Great Wall provides no rescue economics
    - No binding support, asset purchase, or restructuring framework from the control ecosystem
    - Removes the most plausible strategic bridge to survival.
    - Treat the base case as too optimistic and widen downside probabilities.
  - - Customer continuity fails
    - Great Wall, Dmall/Wumart, Meituan, or other named programs are inactive or unsupported
    - Undercuts the argument that installed-base obligations create a defendable asset floor.
    - Cut base and bull ranges materially.
  - - Compliance stack is not restart-ready
    - No evidence of OTA, incident, or automotive-data compliance under the newer rules
    - Raises the cost and time needed to commercialize again.
    - Lower bull-case probability and retain avoid stance.
  notes: These are decision triggers, not generic watchlist items.
