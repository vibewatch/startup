- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Metric
  - Multiple / valuation / status
  - Relevance
  - Limitation
  rows:
  - - Pony.ai
    - Public China autonomy peer
    - ~$3.39B market cap; FY2025 revenue $90.0M; gross margin 15.7%; cash/investments $1.515B
    - Closest evidence that capital markets still fund active China autonomy platforms with functioning disclosure.
    - Still a live, expanding public company with audited-style disclosure and far better funding access than Haomo.
  - - WeRide
    - Public China autonomy peer
    - ~$1.92B market cap; FY2025 revenue $97.9M; gross margin 30.2%; cash/investments about $1.0B
    - Useful lower-end public comp for a still-loss-making but fully operating autonomy company.
    - Robotaxi-heavy mix and public listing status still make it much healthier and more observable than Haomo.
  - - Mobileye
    - Public mature ADAS benchmark
    - ~$6.77B market cap; FY2025 revenue $1.894B; cash $1.8B; operating cash flow $602M
    - Shows what a true scaled ADAS benchmark looks like when revenue, cash generation, and installed-base maturity are visible.
    - Much larger, more mature, and structurally different from Haomo.
  - - Haomo historical private mark
    - Late-2021 unicorn / 2024 funding narrative
    - '>$1B historical valuation signal; >CNY400M raised across B1 and B2 in 2024'
    - Useful only as a stale upper anchor for how far the story has moved.
    - Reflects pre-distress financing conditions and should not be treated as a current fair value.
  - - Haomo inferred 2026 base case
    - Distressed optionality / rescue case
    - $80M-$200M inferred current fair range
    - Matches the evidence set better than normal revenue-multiple methods because continuity, solvency, and rescue economics dominate.
    - Estimated rather than observed, and highly sensitive to liabilities and sponsor terms not public today.
  enumerationScope:
    coverage: partial
