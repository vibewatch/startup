- id: what-would-change-the-call
  title: 'What would move the recommendation: proof of solvency, support continuity, and sponsor economics'
  body: 'This recommendation can change, but only through concrete evidence that closes the biggest underwriting gaps. The first requirement is a current balance-sheet package: cash, debt, payables, payroll arrears, contingent liabilities, and any litigation or account-freeze history. The second is customer continuity: which Great Wall, Wumart/Dmall, Meituan, Dada, or other programs are still active, and who is servicing them today. The third is governance and capital structure: whether Great Wall or another sponsor has enforceable rescue obligations, what preferences sit ahead of common equity, and whether minority investors are already economically out of the money. The fourth is regulatory readiness under the stricter 2025-2026 regime: evidence of OTA controls, incident response, product-admission status, and automotive-data compliance. If those materials show a funded restart with active customers and a clean rescue structure, the fair range can move up sharply from distressed levels. Until then, the chapter’s discipline remains simple: do not confuse historical commercialization proof with current investability.'
