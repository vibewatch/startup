- id: scenario-analysis
  title: Scenario valuation should be framed as distressed optionality, not precision pricing
  body: Because current financials are absent, valuation has to be scenario-based. The bear case is not normal multiple compression; it is liquidation or an asset sale in which wage claims, liabilities, preference rights, and lost customer confidence leave little or no residual for common equity. The base case assumes a controlled rescue, most plausibly through Great Wall or another strategic buyer, in which some engineering assets, customer relationships, and support obligations survive. That scenario can justify a non-zero equity value, but still at a severe haircut to the historical unicorn mark because the company would be restarting from distress under tougher regulation. The bull case is not simply that autonomy sentiment improves. It requires documented restart, fresh capital, proof that core customers are still live and supported, and evidence that the compliance stack for OTA, data, and safety is restart-ready. Only then could Haomo move from distressed optionality toward a late-stage growth valuation again. Even in that better case, the public evidence today supports a value far below the old headline mark because the continuity break has already occurred.
