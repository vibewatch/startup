    - $0M-$50M equity value; effectively a liquidation or salvage outcome with little residual for common.
    - Unknown liabilities, customer attrition, team loss, and no sponsor rescue.
  - - Base
    - 40%
    - Great Wall or another strategic party engineers a controlled restart or asset-preservation deal, keeping a subset of team, code, and support obligations alive.
    - $80M-$200M equity value; severe haircut to the unicorn mark, reflecting strategic optionality but no clean growth-company status.
    - Dilution, hidden liabilities, limited customer continuity, and slow regulatory re-qualification.
  - - Bull
    - 15%
    - Haomo documents active restart, raises fresh capital, proves customer support continuity, and shows compliance readiness under the tighter 2025-2026 rule set.
    - $250M-$450M equity value; still far below the old unicorn mark because the business would be rebuilding from distress.
    - Restart still fails, customers do not return, or rescue economics subordinate legacy equity.
