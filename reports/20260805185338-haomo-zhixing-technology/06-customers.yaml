- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - One OEM program expands to more models
    - Great Wall may dominate strategic value and economics
    - High upside can coexist with extreme customer concentration
    - Map revenue, units, and backlog by OEM and model
  - - One supermarket district expands to more communities
    - Route success may remain geographic rather than national
    - Operational proof improves, but revenue breadth may stay limited
    - Request city-by-city and customer-by-customer deployment data
  - - Platform partnerships with Meituan and Dada
    - Large platforms can demand pricing pressure and service quality
    - Strategic logos may not translate into attractive margin
    - Review commercial terms, exclusivity, and hardware ownership
  - - Diversification into Hyundai or other OEMs
    - Public diversification stories can unravel if partner stack changes
    - Weak diversification leaves Haomo tied to parent ecosystem demand
    - Obtain signed SOP schedules and current integration status
  - - Historical customer wins survive into 2026
    - Operational halt can freeze expansion and renewals simultaneously
    - Customer concentration risk becomes continuity risk
    - Request current active customer list and outstanding support obligations
  summary: Haomo’s expansion logic is real, but every major expansion path also magnifies concentration or continuity risk.
  notes: Concentration is treated as structural to the business model rather than as a purely negative headline.
