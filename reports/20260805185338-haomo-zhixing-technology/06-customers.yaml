- id: customer-verdict-and-freshness-gaps
  title: 'Customer verdict: real pre-crisis proof, weak diversification, and major freshness gaps in 2026'
  body: 'The customer verdict is not that Haomo lacked market adoption. It is that the adoption evidence never graduated into a clean, diversified, continuously verified customer base. Great Wall is the one relationship that clearly reached production depth. Wumart Dmall and adjacent delivery partners provide persuasive evidence that Haomo solved real last-mile problems in Beijing routes. But the public record remains too thin on customer economics, too concentrated around a handful of relationships, and too stale after the 2025 operating crisis to support a strong durability conclusion. The Hyundai thread is especially revealing: a late-2024 article described Haomo integration into a Beijing Hyundai EV, but official Hyundai 2026 materials named Momenta instead. Likewise, current Dmall recognition proves the retail counterparty still scales AI operations, yet it does not prove Haomo still powers those workflows. For diligence purposes, customer traction should be scored as historically proven,
    current continuity as unresolved, and diversification as weaker than Haomo’s headline logo set first suggests.'
