company:
  name: Haomo Zhixing Technology Co., Ltd.
chapter:
  number: 6
  title: Customers
  summary: 'Haomo’s customer story was historically real but narrow. The strongest public proof is Great Wall Motor as anchor OEM for HPilot and a Beijing-centered set of autonomous-delivery relationships involving Wumart Dmall, Meituan, Dada, and other platform partners. Public 2024 sources support more than 20 production vehicle models, more than 120 million assisted-driving kilometers, and roughly 200,000 to 300,000 supermarket-delivery orders or parcels. What they do not support is a diversified, durable, well-disclosed customer base. Great Wall appears to have dominated strategic value, unnamed OEM diversification remained thin, and no public retention, renewal, or customer-level revenue data was found. By August 2026, the customer verdict is mixed-to-adverse: pre-crisis adoption proof existed, but continuity after the late-2025 operating halt remains unclear.'
sections:
- id: customer-segmentation-and-who-pays
  title: 'Customer segmentation: the real payer was usually an automaker or platform operator, not the end user'
  body: Haomo served at least two distinct customer motions. In passenger vehicles, the direct payer was the automaker or vehicle-program team buying an ADAS stack, while the driver was only the downstream user. In low-speed logistics, the payer was a retailer, supermarket operator, instant-delivery platform, or scenario owner deciding whether autonomous delivery could lower labor pressure and maintain service levels. That distinction matters because logo count can overstate diversification. Great Wall was not just one customer among many; it was the company’s historical parent ecosystem, largest visible production channel, and likely core source of commercialization credibility. The logistics roster added important proof that Haomo technology reached real operating routes, but those relationships look more like programmatic route deployments than like a broad, transparent recurring-revenue base. The diligence question is therefore not whether Haomo ever had customers. It did. The harder
    question is how much of the economic value sat inside Great Wall and a small number of Beijing-centered delivery programs rather than inside a diversified set of independent contracts.
