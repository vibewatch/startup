- id: adoption-trajectory-and-named-customer-proof
  title: 'Adoption trajectory and named-customer proof: Great Wall and Beijing delivery programs are the core evidence'
  body: 'The most credible adoption evidence is concentrated in two places. First, multiple 2024 and 2025 sources say HPilot had already been equipped in more than 20 vehicle models and mostly sold through the Great Wall ecosystem, with assisted-driving mileage above 120 million kilometers by February 2024. Second, Haomo’s autonomous-delivery programs produced real order-flow evidence in Beijing. Independent and company-linked sources cite nearly 300,000 grocery parcels by early 2024, more than 200,000 cumulative orders by July 2023, and a Wumart Dmall route base spanning more than 60 communities in Shunyi. Logistics Tech Outlook and EqualOcean also tie those deployments to Meituan, Dada Nexus, Wumart Dmall, and Alibaba. That said, the quality of proof varies by logo. Great Wall is clearly production-grade. Wumart Dmall has specific route and order outcomes. Meituan has strong strategic logic and very large autonomous-delivery scale as a platform, but public sources do not quantify how much
    of Meituan’s live fleet specifically used Haomo vehicles. Dada and Hyundai are weaker still: both are publicly mentioned, but contract economics and current deployment continuity remain under-documented.'
