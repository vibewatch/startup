  rows:
  - - Great Wall passenger-vehicle programs
    - 'Buyer: GWM vehicle program teams; User: driver; Payer: GWM / OEM'
    - HPilot ADAS deployment across mass-production models
    - Highest visibility and strongest production proof
    - Anchor customer relationship and likely core revenue signal
    - No customer-level revenue split or contract value disclosed
  - - Other automaker programs
    - 'Buyer: automaker engineering / procurement team; User: driver; Payer: OEM'
    - Additional ADAS programs outside Great Wall
    - Claimed but mostly unnamed in public sources
    - Potential diversification beyond GWM
    - Named customers, SOP dates, and scale are under-disclosed
  - - Supermarket and retail operators
    - 'Buyer: retailer / local store operator; User: store and household recipient; Payer: retailer / platform'
    - Autonomous grocery and parcel delivery in communities
    - Visible mainly through Wumart Dmall and Beijing routes
    - Best proof that Haomo solved a real low-speed logistics job
    - Current live fleet size and contract terms are not public
  - - Instant-delivery and logistics platforms
    - 'Buyer: platform operator; User: merchant and end recipient; Payer: platform / operator'
    - High-frequency last-mile distribution
    - Meituan, Dada, Alibaba references appear repeatedly
    - Could provide dense-order environments and strong learning loops
    - Public evidence rarely ties live fleet counts directly to Haomo
  - - Strategic investors and partner ecosystems
    - Buyer may also be investor or ecosystem sponsor; User varies; Payer varies
    - Customer access through capital and ecosystem alignment
    - Meituan and Great Wall appear in both capital and customer narratives
    - Can speed trust, pilots, and route access
    - Also increases concentration and related-party risk
  summary: Haomo’s customer base was concentrated around OEM and platform payers rather than direct end users.
