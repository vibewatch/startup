  productSummary: HPilot and related ADAS software for passenger vehicles, HPark / urban-navigation functions, Little Camel / Xiaomotuo autonomous logistics vehicles, the HUANMO self-driving platform, and DriveGPT for intelligent-driving workflows.
  customerFocus: Great Wall passenger vehicles first, with additional logistics / retail deployments tied to Wumart, Dmall, Meituan, Dada, and limited external automaker diversification efforts.
  businessModel: Software and system integration for OEM assisted driving plus autonomous-delivery vehicle deployments and platform commercialization.
  stage: Distressed late-stage private
  fundingStatus: Historical unicorn status in 2021, supportable disclosed funding around $245.3M in public databases, and more than CNY400M of additional B1/B2 funding announced in 2024; current rescue financing status is undisclosed.
