  topStrengths:
  - Haomo achieved real historical commercialization proof, including ADAS deployment across more than 20 vehicle models and meaningful Beijing delivery-route volume.
  - The company once attracted strong strategic and financial backers, including Great Wall, Meituan, Qualcomm Ventures, and other late-stage investors.
  - Its technology stack spans both passenger-vehicle ADAS and low-speed autonomous logistics, creating residual IP and sponsor-optionality value even after distress.
  - End-market demand for Chinese assisted-driving and autonomous-delivery systems remains real, so Haomo’s assets are not automatically worthless in a rescue scenario.
  topRisks:
  - Late-2025 public reporting described halted operations, salary arrears, and possible frozen-account stress, turning valuation into a solvency problem.
  - No public 2025-2026 Haomo financial statements, cash balance, debt schedule, or current valuation mark were available in the reviewed record.
  - 'Great Wall concentration remains extremely high: it is the control ecosystem, key historical customer, and most plausible rescue vector at the same time.'
  - Diversification signals beyond Great Wall were weak even before the halt, with Hyundai evidence deteriorating and current customer continuity unresolved.
  - China’s 2025-2026 OTA, data, and autonomy-safety rules raise the cost and complexity of any restart.
  unresolvedGaps:
  - Current cash, debt, payables, payroll arrears, and contingent liabilities
  - Signed proof of which OEM and delivery programs remain live and supported
  - Current fully diluted cap table, liquidation preferences, and rescue economics for existing shareholders
  - Whether Great Wall or another sponsor has offered binding bridge financing or asset-purchase support
  - Evidence that Haomo can restart under the newer OTA, incident, and automotive-data compliance regime
disclaimer: This report is for informational purposes only and does not constitute investment advice. It is based solely on publicly available materials reviewed as of 2026-08-05. Several decision-critical items—including current solvency, customer continuity, cap-table economics, and restart status—remain undisclosed in the public record and could materially change the assessment if resolved.
