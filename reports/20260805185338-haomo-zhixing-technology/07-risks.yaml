- id: operational-and-customer-continuity-risk
  title: 'Operational and customer-continuity risk: the late-2025 halt turns every historical traction signal into a support question'
  body: 'Haomo’s operational risk is best understood as a continuity problem. Before the crisis, the company had real adoption signals: more than 20 vehicle models, over 120 million assisted-driving kilometers, and large delivery-order counts in Beijing retail routes. But once public reporting says work halted, salaries fell into arrears, and hundreds of employees faced uncertainty, every historical proof point becomes a new risk question. Who is still patching software? Who is answering incident escalations? Which customers still receive support? What happens to warranties, route operations, or ADAS issue remediation if the operating team has been cut back? The customer chapter already showed that Haomo’s base looked concentrated before the halt; concentration makes a disruption more severe because too much of the installed base may sit with a small number of counterparties. Current Dmall recognition and Meituan fleet scale prove the counterparties remain strategically relevant, but they
    do not prove Haomo remains the active provider. In a safety-sensitive category, the absence of current support proof is itself a major risk event.'
