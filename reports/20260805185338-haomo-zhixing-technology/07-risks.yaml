company:
  name: Haomo Zhixing Technology Co., Ltd.
chapter:
  number: 7
  title: Risks
  summary: 'Haomo’s risk profile is no longer the generic risk profile of an ambitious autonomy startup. By August 2026 it is a compounded distress case shaped by four interacting risk clusters: tighter Chinese regulation on CDAS, OTA, and autonomous-driving claims; customer and governance concentration around Great Wall; late-2025 operational disruption with reported layoffs, salary arrears, and halted work; and the capital/compliance burden of trying to sustain both passenger-vehicle ADAS and autonomous-delivery products while also pursuing large-model autonomy. These are not independent risks. Operational disruption makes customer concentration more dangerous, concentration makes financing more fragile, and a tougher regulatory regime makes any restart harder to execute. The risk verdict is therefore critical rather than merely high: investors would need fresh proof of current operations, liquidity, customer support continuity, and compliance readiness before underwriting any survival
    or recovery story.'
sections:
- id: regulatory-legal-and-safety-risk
  title: 'Regulatory and legal risk: China now expects ADAS and autonomy companies to behave like safety-critical manufacturers'
  body: 'The most important contextual change for Haomo is that China’s regulatory environment for intelligent driving became materially stricter just as Haomo’s own operating condition worsened. The February 2025 MIIT and SAMR notice tightened product admission, recall, incident reporting, and OTA governance for intelligent connected vehicles with combined driver-assistance systems. Those rules matter directly to Haomo because its historical pitch depended on frequent software iteration, evolving NOA capability, and safety-sensitive automation claims. The new framework requires fuller testing and verification, clearer system boundaries, record filing, and recall-style handling when OTA changes fix safety defects. Beijing’s autonomous-vehicle regulation and the 2026 cross-border automotive-data guide further show that public-road and data-governance expectations are rising, not falling. Then the Xiaomi SU7 crash accelerated enforcement pressure on marketing language and rollout caution across
    the sector. For a company already in distress, this is dangerous: a restart would not happen in a permissive policy window but under a more demanding safety, disclosure, and compliance regime than the one Haomo scaled under in 2023 and 2024.'
