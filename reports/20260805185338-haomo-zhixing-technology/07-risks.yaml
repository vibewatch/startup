- id: partner-compute-and-people-risk
  title: 'Partner, compute, and people risk: Haomo depends on counterparties it does not fully control'
  body: Haomo’s dependency stack spans customers, regulators, chips, and people. Great Wall is both the anchor customer and the control ecosystem, which gives Haomo historical credibility but also means any change in Great Wall sourcing strategy could damage revenue, data access, and strategic relevance at the same time. The public record already shows Great Wall working with other intelligent-driving suppliers, so Haomo cannot assume exclusivity. On the technology side, Haomo’s large-model narrative around DriveGPT increases exposure to compute availability and cost. Nvidia’s 2025 China export restrictions are not abstract macro noise; they show that advanced AI compute capacity can become constrained, delayed, or materially more expensive. That matters more for a company pitching frontier-model autonomy than for one selling only mature low-cost L2 kits. The people layer is equally serious. Layoffs and halted operations increase attrition risk for senior engineers and product leads, while
    China’s more explicit 2025 non-compete guidance means retaining technical staff through restrictive covenants is not frictionless. A weakened team, contested IP defenses, and an uncertain compute path together create a high execution-risk bundle.
