- id: TR006
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Operational restart risk
    - Company resumes normal operations with named leadership and support coverage
    - No verified restart by diligence close
    - Treat as thesis-breaking and do not underwrite recovery
  - - Liquidity risk
    - Cash and liabilities are disclosed
    - No current cash proof or liabilities schedule
    - Assume unresolved solvency and require rescue-financing evidence
  - - Great Wall dependence
    - Great Wall confirms active commercial support or ongoing sourcing role
    - No current Great Wall support statement or visible program continuity
    - Assume concentration risk remains critical
  - - Customer continuity risk
    - Named customers confirm active deployments and SLAs
    - No customer attestations from Great Wall or logistics partners
    - Discount historical traction heavily
  - - Regulatory readiness
    - Admission, OTA, and incident-reporting artifacts are produced
    - Missing compliance files or open regulator issues
    - Assume restart or rollout will be delayed
  - - People/IP risk
    - Core engineering staff retained or lawfully transitioned with valid protections
    - Key-team departures plus unpaid obligations or disputed non-competes
    - Assume slower recovery and higher IP leakage risk
  summary: Haomo’s risk can only move down with current evidence, not with historical milestones alone.
  notes: The kill criteria are intentionally concrete so the IC can distinguish fixable opacity from true thesis failure.
