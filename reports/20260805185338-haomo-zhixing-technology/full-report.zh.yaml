  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层：真正付费者通常是车企或平台运营商，而不是终端用户
        blocks:
          - type: paragraph
            body: >-
              Haomo 至少服务两种不同客户动作。乘用车里，直接付费者是购买 ADAS
              栈的车企或车型项目团队，驾驶员只是下游用户。低速物流里，付费者是零售商、超市运营商、即时配送平台或场景业主，他们判断自动配送能否降低人力压力并维持服务水平。这个区别很重要，因为
              客户名单数量可能夸大多元化。Great Wall 不是众多客户之一；它是 Haomo 的历史母公司生态、最大可见量产通道，也可能是商业化可信度的核心来源。物流名单提供了重要证据，说明 Haomo
              技术进入过真实运营路线；但这些关系更像项目化路线部署，而不是宽广透明的经常性收入基础。因此，尽调问题不是 Haomo 是否曾经有客户。它确实有。更难的问题是，多少经济价值留在 Great Wall
              和少数北京中心配送项目里，而不是分散在一组独立合同中。
