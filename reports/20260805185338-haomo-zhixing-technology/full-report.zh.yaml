      - number: '5.2'
        title: 架构与技术差异化：DriveGPT、传感器分层和研究工具构成核心技术叙事
        blocks:
          - type: paragraph
            body: >-
              Haomo 的技术叙事集中在同时让辅助驾驶更便宜、更强、也更可解释。2023 年 AI Day 发布把 DriveGPT 描述为基于“Drive Language”的 GPT 式自回归规划模型，并用类似 RLHF
              的人类反馈训练，让决策更安全、更平顺、更可解释。HP170、HP370、HP570 三个产品层级显示，这套叙事不是抽象 AI 品牌包装，而是落在具体传感器和算力组合上：三款 SKU
              在算力预算、摄像头、雷达、泊车能力和可选 LiDAR 上差异明显。第三方对 DriveGPT 的解释强调，规划模型仍依赖高质量感知输入，这与 Haomo 自己的 6P 框架，以及 MANA OASIS
              和上游算力伙伴等基础设施的可能角色一致。与此同时，Haomo 的 GitHub 存在表明，公司在 LiDAR-相机融合、占用预测和地点识别等方向有真实工程产出。重要技术结论是，Haomo
              看起来确有研究能力和可信的架构论点——但它仍依赖传感器、芯片、数据管线、算力伙伴和车型项目执行，而不是只靠模型新鲜感。
