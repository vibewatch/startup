  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议：除非入场价格明确按困境资产定价，并有最新尽调支撑，否则回避
        blocks:
          - type: paragraph
            body: >-
              当前正确判断是回避。不是因为 Haomo 从未做出真实产品，而是因为公开证据已经无法支撑把它按运营中的成长公司承销。Haomo 确实拿过有意义的里程碑：2021 年跻身独角兽，2024 年继续获得 B1 和 B2
              轮融资，落地到 20 多款乘用车车型，末端配送量也达到数十万件包裹或订单。换一个背景，这些事实足以支持观察建议。但到 2025
              年末，故事已经从商业化转向连续性。多家媒体报道称，公司停工、工资欠发，且账户可能被冻结。Great Wall 2025 年年报仍把 Haomo
              列为联营公司并确认累计亏损，但公开披露没有把这一点连接到重启、再资本化，或干净的剩余股权叙事。这个缺口比市场规模或产品野心更重要。投资人要定价的不只是自动驾驶软件的可选性；还要判断底层运营实体是否仍有足够团队、流动性、合规准备和客户支持能力，值得继续讨论。没有新尽调证明这些点，唯一站得住的立场就是：相对旧独角兽叙事，假设大幅减值。
