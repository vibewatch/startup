  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图：Haomo 同时面对创业公司、成熟厂商和替代方案
        blocks:
          - type: paragraph
            body: >-
              Haomo 的竞争集合远不只是一个创业公司排行榜。乘用车里，它必须在 OEM 采购周期中击败 Horizon、Momenta、Huawei
              相关栈和其他第三方智能驾驶供应商。低速自动化里，它还要用配送经济性证明自己，面对 robotaxi 或 robotruck 运营商，这些公司的技术、数据和资本基础可能外溢到相邻商业场景。同样重要的是，Haomo
              还面对 Great Wall 内部智能驾驶路线图、Mobileye 等全球成熟供应商，以及人工配送加传统 ADAS 现状的替代竞争。这很重要，因为 Haomo
              试图同时跨越两种采购动作：整车项目采购和物流运营自动化。公开证据显示，行业向少数规模化生态集中后，多线竞争变得更难；这些生态在芯片、数据或分发上有更清晰优势。因此，最相关的比较不是“哪家创业公司的演示最好”，而是哪家公司在真实采购决策中变得最难被
