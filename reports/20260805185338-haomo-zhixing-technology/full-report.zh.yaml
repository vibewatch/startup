      - CV004
      - CV005
      - CV018
      - CV033
      - CV034
      - CV037
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 估值对重启证明和负债更敏感，行业 TAM 叙事的影响小得多。
    data:
      items:
        - label: 无重启证明 / 负债不清
          value: 0.03
          detail: 剩余普通股权益只会滑向残值。
          tone: negative
        - label: 仅有重启证明
          value: 0.12
          detail: 公司看起来没那么终局，但客户和融资缺口仍在。
          tone: warning
        - label: 重启 + 活跃客户
          value: 0.22
          detail: 运营连续性会明显抬高可守住的资产底线。
          tone: neutral
        - label: 重启 + 融资 + 合规组合
          value: 0.38
          detail: 真正的救援案例开始成立，但仍低于历史峰值定价。
          tone: positive
    approximationNotes: 数值是基于情景的十亿美元估值，用来展示对证据里程碑的敏感性，不是管理层指引。
    claimRefs:
      - CV022
      - CV023
      - CV029
      - CV030
      - CV031
      - CV043
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 当前最站得住脚的结果大多远低于历史独角兽叙事。
    data:
      items:
        - label: 悲观情形
          low: 0
          mid: 0.025
          high: 0.05
          displayValue: $0M-$50M
          detail: 清算或拆分出售资产的逻辑占主导。
          tone: negative
        - label: 基准情形
          low: 0.08
          mid: 0.14
          high: 0.2
          displayValue: $80M-$200M
          detail: 战略救援保住部分运营和 IP 价值，但保不住过去成长公司的估值标记。
          tone: warning
        - label: 乐观情形
          low: 0.25
          mid: 0.35
          high: 0.45
          displayValue: $250M-$450M
          detail: 有文件支撑的重启和新资本会改善情形，但连续性断裂仍压住上行空间。
          tone: positive
    approximationNotes: 区间是基于情景的十亿美元估值，仅用于讨论当下股权价值。
    claimRefs:
      - CV027
      - CV028
      - CV029
      - CV030
      - CV031
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: Haomo 在历史证明上的得分高于当下可投性。
    data:
      items:
        - label: 历史商业化证明
          score: 6
          detail: 20+ 款车型和真实末端配送订单量曾是有意义的成绩。
          tone: positive
        - label: 当前运营连续性
          score: 1
          detail: 2025 年停摆后的公开证据不能证明公司稳定运转。
          tone: negative
        - label: 客户多元化
          score: 2
          detail: Great Wall 集中度仍高，Hyundai 带来的多元化走弱。
          tone: negative
        - label: 财务透明度
          score: 1
          detail: 当前收入、现金、债务或股本数量桥接均未公开。
          tone: negative
        - label: 监管重启准备度
          score: 2
          detail: 合规负担在上升，重启准备度没有得到证明。
          tone: warning
        - label: 战略支持方选择权
          score: 5
          detail: Great Wall 仍提供一条说得通的救援路径，但尚未得到证明。
          tone: neutral
        - label: 定价证据质量
          score: 4
          detail: 证据足以拒绝旧估值，但不足以支撑一个精确的公允价值区间。
          tone: warning
    approximationNotes: 分数是基于公开证据集综合出的 0-10 序数判断，仅供投资委员会讨论。
    claimRefs:
      - CV018
      - CV020
      - CV021
      - CV033
      - CV035
      - CV043
      - CV048
