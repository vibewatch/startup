      - number: '1.3'
        title: 商业验证、客户足迹，以及危机前真正做到的规模
        blocks:
          - type: paragraph
            body: >-
              2025 年危机前，Haomo 的确拿出过不轻的公开商业化标记。最强的历史验证来自 Great Wall 车型部署和北京物流运营，而不是广泛的第三方 OEM 名单。公司关联和独立来源称，HPilot 或 NOH
              产品已覆盖 20 多款 Great Wall 相关车型；官方 2023 年 DriveGPT 发布还称，Haomo 在过去主要销售给 Great Wall
              之后，已成为三家车企的供应商。物流侧，TechCrunch 称 Haomo 配送车在北京为超市配送了接近 300,000 件生鲜杂货包裹；Logistics Tech Outlook 描述，截至 2023 年 7
              月，与 Meituan、Wumart Dmall 和 Dada Nexus 的合作累计超过 200,000 单。Friendly Auto 的 2025 年总结还补充，Little Camel 2.0 和 3.0
              已在九个场景投入商业运营；截至 2024 年 5 月，Haomo 驱动的乘用车累计辅助驾驶里程超过 141 million 公里。这些指标说明 Haomo 不只是实验室项目。但格局也很窄。Great Wall
              仍是核心 OEM 分发通道，物流验证集中在北京试点区域；即便在停摆报道出现前，能证明多客户收入规模持久化的独立证据也仍然薄。
