        title: 情景估值应按困境可选性框定，而不是精确定价
        blocks:
          - type: paragraph
            body: >-
              当前财务缺失，估值只能按情景做。悲观情景不是正常的倍数压缩，而是清算或资产出售：工资债权、负债、优先权和流失的客户信心会让普通股几乎没有或完全没有剩余。基准情景是假设一次受控救援，最可能由 Great Wall
              或另一家战略买方推动，部分工程资产、客户关系和支持义务保留下来。这个情景可以支撑非零股权价值，但相对历史独角兽标记仍要大幅折价，因为公司是在更严监管下从困境中重启。乐观情景不只是自动驾驶情绪改善。它需要有文件证明的重启、新资本、核心客户仍在且得到支持的证据，以及
              OTA、数据和安全合规栈已经准备好重启。只有这样，Haomo 才可能从困境可选性重新走向后期成长估值。即使在这个更好情景下，今天的公开证据也只支持远低于旧的标志性估值的价值，因为连续性断裂已经发生。
