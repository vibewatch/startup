      - number: '2.4'
        title: 市场含义：两个市场都变成规模游戏，Haomo 的时间窗口随之收窄
        blocks:
          - type: paragraph
            body: >-
              市场含义不是 Haomo 选错了品类，而是它选的品类后来都变得更难，尤其不利于一家中等规模、战略上依赖母公司的创业公司。在乘用车 ADAS 里，重心转向能组合芯片、软件、安全和广泛 OEM
              覆盖的平台，Huawei、Horizon 及类似生态在定义标杆。在低速物流里，需求仍然真实，但经济性越来越依赖可复制的路线密度、更低车辆成本，以及与 Meituan、Alibaba、JD
              或专业机器人运营商等巨型平台的运营集成。Haomo 每条故事都有一些组件——面向主流车型的低成本 HPilot 套件、具名物流试点、围绕 DriveGPT 的研究叙事——但到 2025 年，它缺少足够广泛的
              OEM 多元化证据，也没有足够强的物流规模来抵消对 Great Wall 的依赖。因此，底层市场可以继续增长，Haomo 自身可实现的 SAM 和 SOM
              却在收缩。这种背离对估值很关键：当公司的份额获取路径已被商业化延迟和报道中的停工削弱，投资者不能只引用品类增长来支撑乐观判断。
