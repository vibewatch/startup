      - number: '8.3'
        title: 公开可比公司给的是上限，不是估值捷径
        blocks:
          - type: paragraph
            body: >-
              Pony.ai、WeRide 和 Mobileye 有参考价值，但主要证明 Haomo 缺了什么。2026 年 8 月，Pony.ai 和 WeRide
              即便收入不高，仍有数十亿美元市值，因为市场至少看得到持续运营、经审计或申报文件支撑的披露、充足现金余额和仍在推进的商业化动能。Mobileye 的绝对估值高得多，因为它同时具备规模、现金生成能力和成熟的 ADAS
              装车基础。Haomo 没有可比的披露栈。没有公开 2025 或 2026
              年收入报表，没有披露现金余额，没有可见的股权结构更新，没有清晰支持兜底，也没有已验证的重启公告。这意味着公开可比公司测算只能用来压住乐观假设。若有运营、有资本支持且有真实财务披露的 AV 同行在公开市场约值
              $1.9 billion 到 $6.8 billion，那么连续性未解决的困境私营公司应该相对它们极大折价，而不是享受叙事溢价。CompaniesMarketCap 和 SEC
              关联申报目录能让投资人直接找到同行年报，反而凸显了对比：Haomo 的问题不是缺少行业可比公司，而是缺少当前公司层面的可观测性。
