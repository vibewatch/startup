      - number: '2.2'
        title: 中国 ADAS 仍在增长，但增长正向上层能力和全栈供应商迁移
        blocks:
          - type: paragraph
            body: >-
              中国智能驾驶大盘方向仍然有利。Research-and-markets 聚合内容和专业行业媒体把 2025-2026 年描述为结构升级期：非智能和低阶配置继续退场，高阶辅助驾驶功能走向主流。最有用的数字不是泛泛
              TAM，而是渗透率和架构变化。独立 OEM 从 2022 年由非智能配置主导的市场，转向 2025 年高阶智能驾驶占 62.7% 的市场，城市 L2.9 NOA 渗透率从 2.1% 升至
              17.2%。另一个供应商侧视角显示，到 2025 年前四个月，搭载 L2.5 和 L2.9 的新车型占比分别达到 30.2% 和 34.82%。Gasgoo 和 DVN 随后显示，2026
              年规模正进入零部件与产业化：2026 年前四个月 LiDAR 装机超过 1.3 million 台，供应商栈集中到少数大玩家手里。这对品类需求是利好，但对创业公司站位并不中性。Robotics and
              Automation News 总结 IDTechEx 研究称，车企优先选择全栈且有成本效率的合作伙伴，纯软件 ADAS 供应商丢掉阵地。这一变化对 Haomo
              战略不利，因为它的商业化问题恰好出现在市场奖励更宽生态和更紧芯片-软件集成的时候。
