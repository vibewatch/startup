  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 相关性
      - 局限
    rows:
      - - Pony.ai
        - 中国公开市场自动驾驶可比公司
        - ~$3.39B 市值；FY2025 收入 $90.0M；毛利率 15.7%；现金 / 投资 $1.515B
        - 最接近的证据：资本市场仍会给有正常披露、仍在运营的中国自动驾驶平台提供资金。
        - 仍是一家运营中、在扩张的上市公司，有近似审计口径披露，融资通道远好于 Haomo。
      - - WeRide
        - 中国公开市场自动驾驶可比公司
        - ~$1.92B 市值；FY2025 收入 $97.9M；毛利率 30.2%；现金 / 投资约 $1.0B
        - 对仍亏损但完整运营的自动驾驶公司，这是有用的低端公开可比。
        - Robotaxi 占比较高，且已上市；它仍比 Haomo 健康、透明得多。
      - - Mobileye
        - 成熟上市 ADAS 基准
        - ~$6.77B 市值；FY2025 收入 $1.894B；现金 $1.8B；经营现金流 $602M
        - 当收入、现金创造和装车成熟度可见时，真正规模化的 ADAS 基准应是什么样。
        - 规模大得多、成熟得多，结构上也不同于 Haomo。
      - - Haomo 历史私募估值
        - 2021 年底独角兽 / 2024 年融资叙事
        - 历史估值信号 >$1B；2024 年 B1 和 B2 合计融资 >CNY400M
        - 只能作为过时的上限锚，用来衡量故事已经偏移多远。
        - 反映困境前的融资条件，不能当作当前公允价值。
      - - Haomo 推断的 2026 年基准情形
        - 困境可选性 / 救助情形
        - $80M-$200M 推断当前公允区间
        - 比正常收入倍数法更贴合证据组合，因为连续性、偿付能力和救助经济条款才是主导因素。
        - 这是估算值，不是观察到的价格；对当前未公开的负债和出资方条款高度敏感。
    enumerationScope:
      coverage: partial
      basis: >-
        Five selected valuation anchors reviewed through 2026-08-05: three live public autonomy/ADAS peers, Haomo’s last
        known historical private mark, and an inferred 2026 distressed base case. Excludes less-clean private marks
        where direct URLs or comparable business-model data were weaker.
    notes: 可比公司组合刻意偏向天花板：用途是防止买贵，而不是为直接套用正常运营公司倍数到 Haomo 找理由。
