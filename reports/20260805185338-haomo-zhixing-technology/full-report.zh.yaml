      - number: '7.4'
        title: 财务 / 模型风险与否决标准：缺少重启证据现在与战略同样重要
        blocks:
          - type: paragraph
            body: >-
              这里的财务风险不只是 Haomo 曾经资本密集。更关键的是，公开证据已经看不到一座从历史进展通向当前生存能力的财务桥。公开记录里没有 Haomo 2025 或 2026
              年经审计财报，没有披露现金余额、债务清单、客户应收账款账龄，也没有可执行的 Great Wall 资金兜底。与此同时，Haomo 的模式仍然结构性吃资源：低成本
              ADAS、无人配送车、前沿模型研发，各自以不同方式消耗现金和管理层注意力。ML Vehicle 报道 Little Camel 2025 年销售目标偏低、Hyundai
              相关交付时间后移，说明停摆之前，公司已经很难把产品宽度转成规模化、稳定的商业执行。IC
              结论因此很清楚。管理层证明运营已重启、现金仍在、客户活跃且合规准备到位之前，举证责任全部在公司。实际尽调中，这些缺失事实不是普通信息缺口，而是足以打断投资逻辑的触发器。
