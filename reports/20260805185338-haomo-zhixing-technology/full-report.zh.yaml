              成本图景只能间接重构，但方向清楚。Haomo 披露的资金用途集中在大模型、算力、数据和量产，而不是近期盈利。它的产品组合也意味着天然不同的利润结构：主流 ADAS
              套件如果规模化销售，可能支撑不错的毛利；自动配送车、域控制器、传感器栈和车队支持，通常会把业务拖向硬件式经济性和营运资金需求。可比上市自动驾驶公司凸显了问题。WeRide 2025 年约 US$97.9
