        blocks:
          - type: paragraph
            body: >-
              Haomo 公开材料显示，它不是一家单一纯软件公司，而是混合收入模型。乘用车侧，公司向 OEM 项目销售 ADAS 套件和更宽的智能驾驶方案，HP170、HP370、HP570
              被定位为覆盖低端到高端车型的分层产品。物流侧，Haomo 推广 HDeliver
              和相关低速自动驾驶车辆，意味着硬件收入、部署收入，以及可能存在的持续运营或支持费。公开媒体和公司关联报道还提到代码、模块、硬件、软件和云服务，暗示 Haomo 变现的是一组产品与集成工作，而不是单一经常性
              SaaS 费用。牵引力信号确实存在——20 多款车型、到 2024 年春约 140 million 辅助驾驶公里、接近 300,000
              件北京生鲜杂货配送——但这些是活动代理指标，不是经审计收入。因此，财务解读只能是混合的：Haomo
              有真实商业触点，但公开证据仍没有说明，产品销售与支持服务各贡献多少收入，也没有说明这些收入流是否有吸引人的利润率或持久留存。
