companyProfile:
  summary: >-
    Haomo Zhixing Technology 2019 年从 Great Wall Motor 分拆出来，想把乘用车辅助驾驶系统和末端自动配送车商业化。公司曾用 HPilot 在 20
    多款车型上的部署、北京零售生态里的配送路线运营，以及 2021 年独角兽融资，拼出过有分量的历史验证；2024 年又拿到 B1 和 B2 轮后续资金。但到 2026 年 8
    月尽调时，公开记录指向的已不是一家正在放量的成长公司，而是一个承压的独立资产：2025 年末报道提到运营停摆和欠薪，Great Wall 仍是控制性生态，公开材料里也没有一条清晰链路能把过往牵引力接到当前偿付能力或重启状态。
