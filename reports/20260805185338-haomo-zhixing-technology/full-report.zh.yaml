      - number: '6.2'
        title: 采用轨迹与具名客户验证：Great Wall 和北京配送项目是核心证据
        blocks:
          - type: paragraph
            body: >-
              最可信的采用证据集中在两处。第一，多家 2024 和 2025 年来源称，HPilot 已装配在 20 多款车型上，且主要通过 Great Wall 生态销售；截至 2024 年 2 月，辅助驾驶里程超过 120
              million 公里。第二，Haomo 的自动配送项目在北京创造了真实订单流证据。独立和公司关联来源引用了截至 2024 年初接近 300,000 件生鲜杂货包裹、截至 2023 年 7 月超过 200,000
              累计订单，以及 Wumart Dmall 在顺义覆盖 60 多个社区的路线基础。Logistics Tech Outlook 和 EqualOcean 也把这些部署与 Meituan、Dada
              Nexus、Wumart Dmall 和 Alibaba 联系起来。话虽如此，各个具名客户的证明质量不同。Great Wall 显然达到量产级。Wumart Dmall 有具体路线和订单结果。Meituan
              有强战略逻辑，作为平台也有很大自动配送规模，但公开来源没有量化 Meituan 线上车队里具体有多少使用 Haomo 车辆。Dada 和 Hyundai
              更弱：两者均被公开提及，但合同经济性和当前部署连续性仍缺少文档支持。
