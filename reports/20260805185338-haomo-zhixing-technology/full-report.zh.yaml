              Haomo 在北京路线中解决过真实末端问题。但公开记录在客户经济性上仍太薄，关系集中在少数客户上，2025 年运营危机后也太陈旧，无法支撑强耐久性结论。Hyundai 线索尤其说明问题：2024 年末一篇文章称
