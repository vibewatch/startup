              最重要的竞争教训是，自动驾驶护城河如今更多是运营性的，而不是叙事性的。供应商拿下一个量产项目，就获得验证历史、软硬件调校和持续道路数据，后续替换成本随之上升。2026
              年公开视野里最强的供应商——Horizon、Momenta、Huawei、Mobileye、Pony.ai 和 WeRide——各自至少有一层可持续护城河：OEM
              嵌入、芯片控制、数据规模、全球车队运营或财务韧性。Haomo 的公开证据更窄：历史商业化高度绑定 Great Wall
