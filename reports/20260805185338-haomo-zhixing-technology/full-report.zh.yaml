      - number: '5.3'
        title: 成熟度、路线图与信任：交付足以证明重要性，但不足以消除支持风险
        blocks:
          - type: paragraph
            body: >-
              Haomo 的公开路线图既有已交付证据，也有脆弱性证据。正面看，官方发布显示，HPilot 到 2023 年 4 月已覆盖接近 20 款车型，到 2024 年超过 20 款；DriveGPT
              被连接到量产车型叙事；Little Camel 2.0 和 3.0 据称已在多个场景商业运营。公司还声称进入 EU、Israel 并规划后续区域。但成熟度不等于连续性。后续报道称，城市 NOA
              目标滑坡，Hyundai 交付项目延迟，公司的活跃商业表面到 2025 年可能大幅收窄。信任与合规证据同样不均衡。Haomo 公开了若干安全或硬件主张，例如 HP170 的五星 AEB 和不依赖
              HD-map；但保留来源没有显示当前公开可靠性仪表盘、支持
              SLA、软件发布日志、网络安全项目或危机后的质量声明。对买方来说，这个缺口很关键：汽车和物流客户需要长期支持与合规证明，而不只是技术上可信的功能。因此，成熟度判断是混合到偏负面：历史上不轻，当前不确定。另一个实际含义是文档深度：公开材料足以勾勒
              2023 年技术栈，却不足以验证买方是否仍收到活跃版本、问题修复或长期维护。在安全敏感领域，缺失运营证据会压低原本亮眼功能披露的价值。
