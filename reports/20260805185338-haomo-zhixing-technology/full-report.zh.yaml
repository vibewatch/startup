  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险：中国现在要求 ADAS 和自动驾驶公司像安全关键制造商一样运作
        blocks:
          - type: paragraph
            body: >-
              对 Haomo 来说，最重要的背景变化是中国智能驾驶监管环境明显收紧，而这种收紧恰好发生在 Haomo 自身经营状况恶化之时。2025 年 2 月，MIIT 和 SAMR
              通知收紧了搭载组合驾驶辅助系统的智能网联汽车在产品准入、召回、事故报告和 OTA 治理方面的要求。这些规则直接影响 Haomo，因为它的历史叙事依赖频繁软件迭代、不断演进的 NOA
              能力和安全敏感的自动化主张。新框架要求更完整的测试验证、更清晰的系统边界、备案，以及当 OTA 变更修复安全缺陷时采取召回式处理。北京自动驾驶法规和 2026
              年跨境汽车数据指南进一步说明，公路和数据治理预期在上升，不是在下降。随后 Xiaomi SU7
              事故又加速了行业内对营销语言和功能推出谨慎度的执法压力。对一家已经陷入困境的公司，这很危险：重启不会发生在宽松政策窗口里，而是在比 Haomo 2023 和 2024 年扩张期更严格的安全、披露和合规制度下进行。
