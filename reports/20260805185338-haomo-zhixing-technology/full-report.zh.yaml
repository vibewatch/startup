      - number: '8.2'
        title: 关键估值事实，是历史独角兽标记与当前困境信号之间的断裂
        blocks:
          - type: paragraph
            body: >-
              Haomo 的历史价格锚很容易描述，但已经不能安全复用。2021 年 Series A 以超过 $1 billion 估值塑造了独角兽叙事，公司还在 2024 年 B1 和 B2 轮合计融到超过 CNY400
              million。若公司随后证明 2025 年收入稳定增长、客户连续性仍在，且流动性有出资方支撑，这些旧估值仍有意义。公开记录却指向相反方向。到 2025 年中，Hyundai
              多元化不足、低速车目标下调和组织动荡，已经暴露商业化问题。到 2025 年 11 月，多篇报道描述了停摆、欠薪和运营瘫痪。Great Wall 仍是实际控制生态，年报仍记着 Haomo
              相关亏损；但同一份文件也强调 Great Wall 自己的 Coffee Pilot、VLA 和世界模型路径，而不是简单的 Haomo
              救援叙事。合在一起，历史定价已经过期。历史投资人投的是一家正在扩张的自动驾驶供应商；当前投资人投的会是重组、救援或资产保全故事。这是两种根本不同的估值问题，二者之间应有很大的折价。
