chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、起点，以及 Haomo 原本要卖什么
        blocks:
          - type: paragraph
            body: >-
              Haomo 应被看作一家 Great Wall Motor
              分拆公司：它试图用一套自动驾驶栈，同时服务两个相邻却运营逻辑不同的市场——乘用车辅助驾驶和低速物流自动化。公司发布的信息与独立画像在创立基线上基本一致。Great Wall 分离智能驾驶部门后，Haomo 于
              2019 年 11 月成为独立公司，公开资料显示公司位于北京。它的产品野心不止一个 ADAS 模块。公司多次描述一套全栈方案：围绕 HPilot 和 NOH/NOA 式乘用车辅助驾驶、HPark
              与记忆驾驶功能、Little Camel 或 HDeliver 等低速自动配送车，以及后来的 DriveGPT 和 MANA OASIS 计算中心，作为把这些产品连起来的技术层。尽调需要重视这种宽度，因为
              Haomo 从来不只是功能供应商。它想成为自动驾驶平台供应商，模块可外供、代码与云端协作可开放，商业路径横跨 OEM
              项目和终端物流。但同样的宽度也放大了执行风险：公司必须在两种截然不同的采购动作里同时证明产品市场匹配。
