      - number: '7.3'
        title: 合作方、算力与人员风险：Haomo 依赖的关键对手方并不完全可控
        blocks:
          - type: paragraph
            body: >-
              Haomo 的依赖栈横跨客户、监管、芯片和人员。Great Wall 既是锚定客户，也是控制生态，给了 Haomo 历史可信度；但 Great Wall
              的采购策略一旦变化，收入、数据获取和战略相关性可能同时受损。公开记录已经显示，Great Wall 正与其他智能驾驶供应商合作，Haomo 不能假设自己拥有排他地位。技术侧，Haomo 围绕 DriveGPT
              的大模型叙事抬高了它对算力可得性和成本的暴露。Nvidia 2025 年针对中国的出口限制不是抽象的宏观噪音；它说明先进 AI
              算力可能变得受限、延后，或明显变贵。对一家主打前沿模型自动驾驶的公司，这比只卖成熟低成本 L2 套件的公司更关键。人员层面同样严峻。裁员和运营停摆会加大高级工程师和产品负责人流失风险；中国 2025
              年更明确的竞业限制指引也意味着，靠限制性契约留住技术员工并不顺滑。团队削弱、IP 防线可能被争议、算力路径不确定，合在一起就是一组高执行风险。
