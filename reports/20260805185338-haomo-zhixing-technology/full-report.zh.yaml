      - number: '6.3'
        title: 留存、扩张与集中度：扩张逻辑可见，但耐久性大多只能推断
        blocks:
          - type: paragraph
            body: >-
              Haomo 的公开客户记录支持一个显而易见的先落地再扩张逻辑，却几乎没有真正留存披露。ADAS 里，自然扩张路径是一项 OEM
              项目扩到更多车型、更多配置和更长生命周期销量。配送里，扩张路径是一片区域或一条路线扩到更多社区、更多用例和更密订单吞吐。这些路径都出现在公开记录中，但投资者仍拿不到最关键的承销指标：NRR、GRR、流失率、合同期限、续约时点、客户级收入或按客户的附加率。耐久性最好的代理指标是
              Great Wall 连续性，因为 Haomo 在 Great Wall 2025 年年报中仍是联营企业和关联方生态名称。但同一事实也制造集中风险。如果 Great Wall 承载大部分 ADAS
              经济价值，而公开物流名单仍然狭窄，那么客户黏性与客户集中度会一起上升。2025 年末裁员和停工报道让问题更尖锐：即便历史客户验证是真的，如今的连续性和支持质量也不能再默认成立。
