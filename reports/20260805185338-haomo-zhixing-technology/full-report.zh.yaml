              最有支撑的财务结论是，Haomo 到 2024 年仍依赖外部融资或战略支持，而且很可能延续到 2025 年。Yicai 报道称，Haomo 2024 年初完成超过 CNY100 million 的 B1 轮和
              CNY300 million 的 B2 轮，资金用于量产、机器人扩张，以及继续投入大模型、算力和数据。这种资金用途语言是成长投资语言，不是成熟自由现金流语言。2025
              年末报道随后急转负面：裁员、欠薪、停工、冻结账户传闻，以及危机后对现金、负债或重启没有公开澄清。Great Wall 2025 年年报确认 Haomo
              仍是联营企业和关联方，但没有给公共投资者可以承销持续偿付能力的清晰现金续航披露。相对上市同行，这种不透明很严重。Pony 和 WeRide 可以披露现金余额、收入构成、资本开支和亏损；Haomo
