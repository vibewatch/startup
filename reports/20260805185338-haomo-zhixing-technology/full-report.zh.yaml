      - - 股权结构和优先权
        - 当前完全摊薄所有权、清算优先权和出资方权利
        - 困境救助中，剩余股权可能与资产价值大幅背离。
        - 审阅融资文件和股东协议。
      - - Great Wall 经济条款
        - Great Wall 是否提供过桥资金、资产购买意向或其他可执行支持
        - Great Wall 是最可能的救助路径，也是主要集中度节点。
        - 索取董事会材料、关联方协议和出资方往来函件。
      - - 合规准备度
        - OTA 许可历史、事故响应流程、产品准入记录和数据传输合规状态
        - 没有安全和数据证据，2025-2026 年制度下的重启不可信。
        - 索取监管工作底稿和内部合规负责人。
      - - 人员留存
        - 停摆后关键工程、产品和支持人员状态
        - 如果执行核心已经散掉，IP 价值会很快下滑。
        - 索取组织架构、留任计划和已签署的雇佣状态清单。
    notes: 这些问题按推进速度排序：哪些证据最能快速把 Haomo 从无法定价的困境，拉回边界清晰的战略机会案例。
    claimRefs:
      - CV040
      - CV041
      - CV042
      - CV043
      - CV044
      - CV048
