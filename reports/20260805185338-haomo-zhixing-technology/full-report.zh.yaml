      - number: '1.4'
        title: 里程碑、承压信号与公司现状
        blocks:
          - type: paragraph
            body: >-
              里程碑记录清楚分成上升期和崩解期。上升期从 2019 年分拆开始，经过早期融资、2021 年独角兽状态、2023 年 4 月 DriveGPT 发布，以及 2023 年 10 月低成本
              HP170、HP370、HP570 辅助驾驶产品发布。崩解期在 2025 年浮出水面。KrASIA 2025 年中翻译的 36Kr 报道称，Haomo 只剩两个 Hyundai 乘用车项目，城市 NOA
              交付目标落空，Little Camel 销售目标已下调到约 50 台，并把重心放在清库存而不是推出新车型上。2025 年末，危机加深：KrASIA、CarNewsChina 和 Yicai
              均报道，员工被通知不用到岗，工资已经拖欠，冻结账户和可能诉讼在内部被讨论。Great Wall 自己的年报也间接加重担忧：它把公开智能驾驶叙事转向自研 Coffee Pilot 3 和 4、VLA
              与世界模型系统，同时确认更多与 Haomo 相关的投资亏损。因此，当下概览里最重要的事实，不只是 Haomo 曾经达到独角兽状态；而是截至 2026 年 8 月，公开渠道仍没有官方声明清楚确认重启、重组或清算。
