      - number: '8.5'
        title: 什么会改变建议：偿付能力、支持连续性和出资方经济性的证据
        blocks:
          - type: paragraph
            body: >-
              建议可以改变，但只有具体证据补上最大的承销缺口。第一，需要当前资产负债表包：现金、债务、应付款、欠薪、或有负债，以及任何诉讼或账户冻结历史。第二，是客户连续性：Great
              Wall、Wumart/Dmall、Meituan、Dada 或其他项目哪些仍在运行，今天由谁服务。第三，是治理和资本结构：Great Wall
              或其他出资方是否有可执行的救援义务，普通股前面压着哪些优先权，少数股东在经济上是否已经没有价值。第四，是更严格 2025-2026 年制度下的监管准备：OTA
              控制、事件响应、产品准入状态和汽车数据合规的证据。若这些材料证明公司有资金支持的重启、活跃客户和干净救援结构，公允区间可从困境水平大幅上移。在此之前，本章纪律很简单：不要把历史商业化证据和当前可投资性混为一谈。
