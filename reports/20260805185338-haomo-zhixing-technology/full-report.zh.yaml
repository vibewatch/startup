      - number: '1.2'
        title: 公司背后的领导层、控制权与资本结构
        blocks:
          - type: paragraph
            body: >-
              资本与治理一直是 Haomo 故事的核心，因为 Great Wall 同时是创始方、战略客户和控制锚。公开报道显示，Haomo 2021 年末完成近 RMB 1 billion 的 Series A
              融资，投资方包括 GL Ventures、Meituan、Qualcomm Ventures、Shoucheng Holdings 和 JZ Capital，并进入独角兽行列。TechCrunch
              后来报道，2024 年 2 月 Haomo 获得由 Chengdu Wufa 领投的 Series B 首笔 RMB 100 million；CB Insights 则将公司列为 Series
              B-II，并估算披露融资总额约 $245 million。这些数字方向上利好，但无法完全对齐，本身就是重要尽调信号。Yicai 后续报道称，Haomo 已完成七轮融资，Great Wall Motor 董事长
              Wei Jianjun 仍是实际控制人，持股 37%。Great Wall 自己的 2025 年年报没有披露这家创业公司的完整股权结构，但确认 Haomo Zhixing
              是联营企业和关联方，并记录了与该投资有关的大额累计亏损分担。融资动能放慢时，领导层稳定性也恶化。2025 年中报道提到董事长 Zhang Kai
              辞任，以及产品和技术高管离职，说明公司在进入最艰难商业阶段时，并没有稳定的领导梯队。
