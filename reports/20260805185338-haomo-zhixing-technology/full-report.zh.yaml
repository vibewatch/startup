  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 先界定 Haomo 的真实市场边界，再谈规模
        blocks:
          - type: paragraph
            body: >-
              Haomo 并不是卖进一个简单的“自动驾驶市场”。它位于两个相关但经济属性不同的需求池交叉点。第一个是中国乘用车智能驾驶，尤其是面向国内 OEM 的 L2+ 到 L2.9
              辅助驾驶系统，车企需要在大众价格带里组合传感器、算力、软件和安全验证。第二个是低速自动末端配送，机器人、园区和社区路线、生鲜配送、零售物流会带来另一套买方、运营指标和监管约束。把二者当成一个
              TAM，会夸大机会，也会遮住销售现实。乘用车 ADAS 依赖 OEM 平台定点、SOP 节点、芯片选择，以及不同车价带的功能渗透。低速物流依赖路线密度、人工替代、利用率、城市许可，以及客户把车辆视为
              资本开支、服务还是混合基础设施。Haomo 自己的产品组合也反映了这种拆分：HPilot 和 NOH 瞄准 OEM 部署，HDeliver 或 Little Camel
              瞄准物流运营商与零售商。因此，市场章节采用两条平行视角，而不是一个混合的标题数字。
