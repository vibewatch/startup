  - id: FV001
    title: 投资建议逻辑
    type: flow
    layout: wide
    summary: 历史证明仍在，但放到当下，运营困境、不透明和对支持方的依赖把结论推向回避。
    data:
      nodes:
        - id: legacy-proof
          label: 历史证明
          detail: 独角兽身份、OEM 部署和配送量说明 Haomo 曾经有真实牵引力。
          tone: positive
        - id: distress
          label: 运营困境
          detail: 2025 年末停摆、欠薪和连续性风险主导当下叙事。
          tone: negative
        - id: opacity
          label: 财务不透明
          detail: 公开资料没有 2025-2026 年收入、现金、债务或股权结构桥接。
          tone: negative
        - id: sponsor
          label: 支持方依赖
          detail: Great Wall 既是最佳救援路径，也是最大的集中度节点。
          tone: warning
        - id: decision
          label: 回避 / 仅困境投资
          detail: 没有新尽调和明确救援经济账，就不要按接近历史估值的价格买入。
          tone: neutral
      edges:
        - from: legacy-proof
          to: decision
        - from: distress
          to: decision
        - from: opacity
          to: decision
        - from: sponsor
          to: decision
    approximationNotes: null
    claimRefs:
