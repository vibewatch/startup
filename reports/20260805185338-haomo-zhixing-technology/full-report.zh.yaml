        - $0M-$50M 股权价值；实际是清算或残值回收结果，普通股几乎没有剩余。
        - 未知负债、客户流失、团队流失，以及没有出资方救助。
      - - 基准
        - 40%
        - Great Wall 或其他战略方设计受控重启或资产保全交易，保住部分团队、代码和支持义务。
        - $80M-$200M 股权价值；相对独角兽估值大幅折价，反映战略可选性，但不再是干净的成长型公司。
        - 稀释、隐藏负债、客户连续性有限，以及监管重新合格进展慢。
      - - 乐观
        - 15%
        - Haomo 证明已实际重启、融到新资金、客户支持连续，并在更严的 2025-2026 年规则下具备合规准备度。
        - $250M-$450M 股权价值；仍远低于旧独角兽估值，因为业务是从困境中重建。
        - 重启仍失败、客户不回归，或救助经济条款让存量股权居于劣后。
