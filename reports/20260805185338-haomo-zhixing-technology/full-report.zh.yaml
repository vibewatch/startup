      - number: '2.3'
        title: 自动末端配送是真需求，但本质仍是 ROI 和运营模型市场
        blocks:
          - type: paragraph
            body: >-
              Haomo 的物流业务瞄准的是有真实结构性需求、但运营上很苛刻的市场。Grand View Research 估算，全球自动末端配送市场 2024 年约 US$1.6 billion，并预计 2030 年约
              US$5.9 billion；DataM 则把中国市场单独估在 2026 年约 US$6.05 billion、2035 年接近 US$26 billion。这些市场数字不能直接当作 Haomo
              的近期收入池；它们是由硬件成本、城市密度、餐饮和生鲜需求、智慧城市投资共同塑造的采用上限。更有用的是读运营逻辑。地面车辆占主导，因为它们比空中系统更适配受控、重复路线；中国最密集的场景仍是园区、商圈、社区、小区、超市和社区物流。DataM
              明确把市场框定为进入关键投资时点：利用率、监管批准、运营员比例、电池经济性和保险框架，决定试点部署能否变成可规模化业务。Logistics Tech Outlook 对 Haomo
              的画像正好贴合这幅图：有真实包裹流转和具名客户，但仍局限在特定地理和用例环境。因此，物流机会仍在，但持久优势的门槛正在从原型新鲜感升到车队经济性和生态集成。
