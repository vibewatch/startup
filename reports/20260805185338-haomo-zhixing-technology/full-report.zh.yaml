  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品表面：Haomo 把驾驶辅助和自动配送卖进两套完全不同的工作流
        blocks:
          - type: paragraph
            body: >-
              Haomo 的产品图谱横跨两个不同客户任务。乘用车里，它提供 HPilot 及相关 NOH 或 NOA、记忆驾驶、泊车和安全辅助功能，以分层 ADAS 套件或更宽的全栈方案卖给 OEM。物流里，它提供
              HDeliver 和 Little Camel 系列，面向超市、快递类流程、园区、机场和其他受控环境做短路线自动配送。公司公开发布强调，Haomo
              不是只卖一个盒装功能。它描述了横跨代码、模块、软件、硬件、云服务和全栈方案的“6P”合作模式，意味着愿意在多个集成层级承接 OEM 需求。这种宽度有战略意义，因为它给 Haomo
              更多方式进入客户工作流；但它也迫使公司同时成熟两种截然不同的交付模型：达到汽车 SOP 等级的
              ADAS，以及重运营的物流自动化。最终的产品故事比许多创业公司叙事更宽，但公开记录仍没说明其中多少已经充分部署，多少仍带有愿景成分。这个模糊点对尽调尤其重要，因为模块宽度本身无法说明 Haomo 到 2026
              年是否还能服务、修补并迭代每一类工作流。
