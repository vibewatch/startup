      - [Confidence, Medium, "Operating disclosures are substantive but mostly company- or partner-issued."]
      - [Risk rating, High, "Public data cannot quantify dilution, preference, retention, or downside valuation."]
      - [Valuation stance, "Unsupported at a specific price", "Treat the unicorn label as a floor signal, not a defensible valuation range."]
    notes: "Analyst judgment based on the retained financing disclosures; no exact post-money valuation or security terms were public in the reviewed sources."
    claimRefs: [CV001, CV002, CV003, CV005]
  - id: TV002
    title: Thesis and anti-thesis
    columns: [Lens, Current evidence, What would change the view]
    rows:
      - [Thesis, "More than €200 million ARR with a double-digit EBITDA margin was disclosed for 2025.", "Audited ARR, EBITDA, cash flow, and cohort retention at or above the disclosed profile."]
      - [Thesis, "U.S. new-revenue contribution and faster mid-market growth indicate expansion vectors.", "Evidence that investment converts into durable NRR, margin, and customer expansion."]
      - [Anti-thesis, "Low-price positioning includes contact caps, add-ons, and expensive phone-support access.", "Stable net revenue retention and gross margin despite pricing and support trade-offs."]
      - [Anti-thesis, "Competitor reviews identify support, account-control, and pre-engagement data limitations.", "Independent enterprise win/loss evidence and customer-reference validation."]
    notes: "Operating figures are company- or partner-issued; product limitations come from review and competitor sources and are not independent financial benchmarks."
    claimRefs: [CV005, CV008, CV010, CV012, CV013, CV014, CV015, CV016]
  - id: TV003
    title: Bull, base, and bear scenarios
    columns: [Scenario, Assumptions, Valuation / return logic, Probability signal, Downside trigger]
    rows:
      - [Bull, "ARR and double-digit EBITDA margin persist while U.S., mid-market, and AI investment expand monetization.", "A premium may be supportable only after audited metrics and transaction terms establish a return range.", "U.S. new-revenue share and mid-market growth continue without margin erosion.", "Expansion spending fails to produce retention or profitable growth."]
      - [Base, "Brevo remains scaled and profitable, but public evidence stays insufficient for a precise entry multiple.", "Track the company and price against verified ARR, EBITDA, and comparable multiples before investing.", "Disclosed scale is confirmed in diligence with stable cohorts.", "Entry price embeds unverified 2030 ambitions or aggressive multiple expansion."]
      - [Bear, "Concentration, support friction, pricing complexity, and broad execution commitments slow growth or compress margins.", "No defensible public downside floor; require protective terms and a material valuation discount.", "Weak retention, rising support burden, or slower U.S. and mid-market conversion.", "Down round, margin deterioration, or adverse preference stack."]
    notes: "Scenario outputs are qualitative because exact valuation, ownership economics, audited unit metrics, and comparable transaction multiples are unavailable."
    claimRefs: [CV005, CV007, CV008, CV009, CV010, CV011, CV013, CV014, CV016]
