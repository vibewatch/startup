callouts:
  - calloutType: recommendation
    title: Price discipline overrides company quality
    body: >-
      Brevo may be a credible scaled platform, but the public record cannot
      support an absolute valuation range or target return. Require audited
      operating metrics, the fully diluted cap table, security terms, and a
      comparable-based exit model before changing the recommendation.
    claimRefs: [CV001, CV002, CV003, CV004, CV005]
