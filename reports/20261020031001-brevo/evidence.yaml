evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: funding
    missingEvidence: >-
      Exact post-money valuation, security type, investor check sizes, primary-versus-secondary allocation, debt
      participation, and preference terms for the December 2025 financing.
    whyItMatters: >-
      Funding raised is not cash available, and undisclosed secondary proceeds or preferences materially change
      ownership, liquidity, and valuation interpretation.
    diligencePath: >-
      Request the signed financing documents, capitalization table before and after the transaction, funds-flow
      statement, debt schedule, and investor side letters.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: material
    topic: governance
    missingEvidence: >-
      Current executive roster, board composition, observer rights, reserved matters, succession coverage, and
      management ownership percentages.
    whyItMatters: >-
      Founder concentration and sponsor control cannot be assessed from named press-release participants, and investor
      titles do not establish board membership.
    diligencePath: >-
      Obtain the organization chart, board and committee roster, shareholder agreement, delegation matrix, succession
      plan, and management incentive plan.
    relatedQuestionRefs:
      - QO002
      - QO007
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: customer-metrics
    missingEvidence: >-
      Reconciliation of Brevo's 600,000-plus company claim to paid active accounts, product adoption, website-domain
      signals, retention cohorts, and churn.
    whyItMatters: >-
      Customer accounts and detected domains use different denominators; neither alone establishes monetized adoption or
      revenue durability.
    diligencePath: >-
      Request monthly paid-customer counts, active-user definitions, product attach rates, ARR cohorts, logo and revenue
      retention, churn, and a bridge to public customer claims.
    relatedQuestionRefs:
      - QO004
      - QO006
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      Independent category revenue, growth, and forecast data with a consistent customer-engagement software boundary,
      geography, period, and methodology.
    whyItMatters: >-
      Without comparable market data, TAM/SAM/SOM and market-growth assumptions cannot support a valuation multiple or a
      credible penetration calculation.
    diligencePath: >-
      Obtain licensed analyst reports and management's segment revenue by geography, customer size, product line, and
      channel, then reconcile those figures to a clearly defined spend taxonomy.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-economics
    missingEvidence: >-
      Brevo customer and revenue mix by company size, geography, plan, monthly send volume, channel, and product attach
      rate.
    whyItMatters: >-
      Public plan prices reveal buyer incentives but not the distribution of revenue, retention, or expansion across the
      proposed segments.
    diligencePath: >-
      Request cohort-level ARR, gross retention, net retention, expansion, churn reasons, and support cost by segment,
      preserving the same customer and period denominators.
    relatedQuestionRefs:
      - QM003
      - QM004
      - QM006
  - type: private-evidence-only
    severity: material
    topic: switching-costs
    missingEvidence: Cohort retention, product-level attach rates, multi-homing, migration effort, and competitive win-loss data.
    whyItMatters: These metrics determine whether suite breadth creates durable lock-in or only a reversible pricing advantage.
    diligencePath: >-
      Request customer cohorts by product count, churn reasons, migration records, and recent competitive win-loss
      analyses.
    relatedQuestionRefs:
      - QP005
  - type: missing-source
    severity: material
    topic: pricing-comparison
    missingEvidence: >-
      Like-for-like realized contract prices, discounts, add-ons, channel usage, and support terms across Brevo and
      named competitors.
    whyItMatters: Public list prices use different volumes and packaging, preventing a reliable total-cost comparison.
    diligencePath: >-
      Obtain anonymized invoices or quotes for matched customer profiles and normalize them by contacts, sends, seats,
      and channels.
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: independent-benchmark
    missingEvidence: >-
      A controlled independent benchmark of cross-vendor deliverability, automation depth, implementation effort, and
      support outcomes.
    whyItMatters: Most allocated comparisons are reviews or competitor-authored material rather than reproducible benchmarks.
    diligencePath: >-
      Commission matched-list deliverability tests and reference calls with recent switchers from each major
      alternative.
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Gross margin by channel and product, NRR, GRR, logo churn, cohort expansion, CAC, sales cycle, and payback by GTM
      motion.
    whyItMatters: >-
      These metrics determine whether reported recurring scale converts into durable, efficient growth and whether
      multichannel expansion is accretive.
    diligencePath: >-
      Request audited revenue bridges plus monthly cohort, retention, gross margin, and fully loaded
      acquisition-efficiency schedules from management.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Cash on hand, operating cash flow, burn, runway, debt, covenants, acquisition obligations, and the
      primary-versus-secondary financing split.
    whyItMatters: >-
      The announced financing amount cannot establish liquidity, dilution, or capacity after transaction secondaries and
      committed investment uses.
    diligencePath: >-
      Obtain the closing funds-flow statement, current balance sheet, cash-flow forecast, debt documents, covenant
      model, and board-approved uses of funds.
    relatedQuestionRefs:
      - QI010
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: revenue-quality
    missingEvidence: >-
      Revenue mix by plan and channel, realized pricing, discounts, contract duration, concentration, deferred revenue,
      and ARR-to-revenue conversion.
    whyItMatters: >-
      List pricing and ARR cannot establish accounting revenue quality, customer concentration, or the margin
      contribution of each revenue stream.
    diligencePath: >-
      Request audited revenue-recognition policies, billing exports, contract cohorts, discount schedules,
      deferred-revenue roll-forwards, and mix data.
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: reliability-and-compliance
    missingEvidence: >-
      Current audited security-control scope, incident history, uptime by service, recovery objectives, and SLA
      attainment for campaign and transactional workloads.
    whyItMatters: >-
      Public feature and review pages cannot establish whether controls and reliability hold under production load or
      during provider and channel failures.
    diligencePath: >-
      Request the current security package, independent audit reports, status history, architecture review,
      disaster-recovery results, and twelve months of SLA telemetry.
    relatedQuestionRefs:
      - QE007
      - QE010
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: material
    topic: developer-adoption
    missingEvidence: >-
      Public repository activity, package-download history, API adoption, release cadence, developer-forum activity, and
      customer references for production integrations.
    whyItMatters: >-
      API availability does not demonstrate developer adoption, integration quality, or backward-compatible execution
      over time.
    diligencePath: >-
      Obtain API usage by endpoint and customer cohort, changelog and deprecation history, SDK maintenance metrics,
      support-ticket data, and reference calls with integration owners.
    relatedQuestionRefs:
      - QE004
      - QE010
  - type: private-evidence-only
    severity: material
    topic: workflow-performance
    missingEvidence: >-
      Measured workflow execution latency, throughput, failure and retry rates, maximum branching complexity, and
      performance by channel at representative customer scale.
    whyItMatters: >-
      Product breadth is not equivalent to reliable orchestration for high-volume or complex enterprise customer
      journeys.
    diligencePath: >-
      Run a technical proof of concept with representative event volume and branching, inspect workflow telemetry, and
      review production references with comparable scale.
    relatedQuestionRefs:
      - QE010
    relatedTableRefs:
      - TE002
      - TE003
  - type: private-evidence-only
    severity: material
    topic: retention-and-concentration
    missingEvidence: >-
      Current NRR, GRR, logo and revenue churn, renewal rate, contract length, cohort retention, top-customer
      concentration, and channel concentration.
    whyItMatters: >-
      These metrics determine whether broad reported adoption converts into durable, diversified recurring revenue
      rather than a high-volume but fragile customer base.
    diligencePath: >-
      Request board-grade cohort schedules, customer and ARR bridges, renewal reports, contract vintages, and top-20
      customer and channel concentration for 2024 through 2026.
    relatedQuestionRefs:
      - QU008
  - type: enumeration-incomplete
    severity: material
    topic: named-customers
    missingEvidence: >-
      Customer-issued case studies, production status, deployment scope, contract duration, and measured outcomes for
      the five organizations named in the transaction announcement.
    whyItMatters: >-
      A company-issued logo list cannot distinguish active production deployments from limited, historical, pilot, or
      otherwise immaterial relationships.
    diligencePath: >-
      Obtain customer references and contracts, then confirm deployment status, modules used, volumes, tenure, renewal
      history, and attributable outcomes directly with each customer.
    relatedTableRefs:
      - TU003
  - type: conflicting-data
    severity: material
    topic: customer-scale
    missingEvidence: >-
      A dated, definition-consistent active and paying customer count reconciling the December 2025 more-than-600,000
      figure with the April 2026 over-500,000 figure.
    whyItMatters: >-
      Without definitions and a reconciliation, the public figures cannot support a reliable adoption trend or
      distinguish rounding and publication lag from customer-base contraction.
    diligencePath: >-
      Request monthly active, paying, free, and total-account counts with a bridge for additions, churn, reactivations,
      acquisitions, and definitional changes from December 2025 onward.
    relatedQuestionRefs:
      - QU005
  - type: missing-source
    severity: material
    topic: regulatory-legal-risk-register
    missingEvidence: >-
      Primary regulator, court, enforcement, licensing, certification, security-audit, cyber-insurance, and breach
      records.
    whyItMatters: >-
      These records are needed to distinguish designed controls from tested effectiveness and to quantify legal
      exposure.
    diligencePath: >-
      Obtain legal representations, regulator correspondence, proceedings schedules, SOC and ISO reports, pentest
      summaries, cyber policies, and the incident register.
    relatedQuestionRefs:
      - QR002
      - QR008
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: availability
    missingEvidence: >-
      Contractual uptime, incident severity, affected-customer counts, recovery objectives, root-cause analyses, and
      service-credit history.
    whyItMatters: Public incident listings cannot quantify customer harm, SLA performance, or revenue exposure.
    diligencePath: >-
      Review 24 months of incident exports, postmortems, SLA attainment, support tickets, service credits, and board
      reliability metrics.
    relatedQuestionRefs:
      - QR003
      - QR006
      - QR007
      - QR008
    relatedTableRefs:
      - TR002
  - type: private-evidence-only
    severity: material
    topic: concentration-and-unit-economics
    missingEvidence: >-
      Customer concentration, country contribution margin, channel-provider concentration, loss exposure, working
      capital, burn, and risk-adjusted unit economics.
    whyItMatters: Recurring-revenue quality and aggregate country mix do not establish diversified or profitable underlying cohorts.
    diligencePath: >-
      Obtain top-customer and provider schedules, geographic P&Ls, cohort retention, gross margin bridges, cash-flow
      statements, and downside sensitivities.
    relatedQuestionRefs:
      - QR004
      - QR005
      - QR008
    relatedTableRefs:
      - TR003
  - type: missing-source
    severity: material
    topic: deliverability
    missingEvidence: >-
      First-party inbox placement, bounce, complaint, blocklist, suspension, and sender-cohort data with methods and
      denominators.
    whyItMatters: The available 88.3% figure is competitor-reported and cannot establish enterprise-grade deliverability.
    diligencePath: >-
      Commission seeded deliverability tests and reconcile them with monthly ISP, region, sender-tier, and
      account-enforcement cohorts.
    relatedQuestionRefs:
      - QR003
      - QR006
      - QR007
      - QR008
    relatedTableRefs:
      - TR002
  - type: private-evidence-only
    severity: material
    topic: partner-and-m-and-a-dependency
    missingEvidence: >-
      Channel contracts, provider-level volume, failover tests, integration usage, acquired-product retention, synergy
      delivery, and integration costs.
    whyItMatters: >-
      Product breadth and sponsor strategy do not demonstrate portability, redundancy, or successful acquisition
      integration.
    diligencePath: >-
      Review counterparty contracts, concentration schedules, disaster tests, integration telemetry, acquisition
      scorecards, and post-deal cohort retention.
    relatedQuestionRefs:
      - QR004
      - QR005
      - QR008
    relatedTableRefs:
      - TR003
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: >-
      Exact post-money valuation, primary-versus-secondary split, investor check sizes, fully diluted cap table,
      preferences, debt, and dilution.
    whyItMatters: These inputs determine entry ownership, downside protection, and whether a target return is achievable.
    diligencePath: >-
      Obtain the signed financing documents, capitalization table, debt schedule, and investor allocation schedule from
      management.
    relatedQuestionRefs:
      - QV004
  - type: missing-source
    severity: material
    topic: financial-quality
    missingEvidence: Audited ARR bridge, gross margin, NRR, cohort retention, CAC payback, free cash flow, and cash balance.
    whyItMatters: >-
      The disclosed ARR and EBITDA-margin claims cannot establish earnings quality, retention durability, or financing
      runway.
    diligencePath: >-
      Review audited statements, monthly management accounts, cohort exports, billing data, and a quality-of-revenue
      analysis.
    relatedQuestionRefs:
      - QV002
      - QV005
      - QV008
  - type: missing-source
    severity: material
    topic: comparable-valuation
    missingEvidence: >-
      Comparable public-company multiples, relevant private-round marks, precedent M&A multiples, and a normalized exit
      multiple.
    whyItMatters: >-
      Without comparable evidence, the scenarios cannot produce an absolute valuation range or price-sensitive return
      target.
    diligencePath: >-
      Build a dated comparable set using verified ARR growth, margin, retention, scale, and geography, then reconcile it
      to transaction terms.
    relatedQuestionRefs:
