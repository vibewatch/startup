company:
  name: Brevo
chapter:
  number: 7
  title: Risks
  summary: Brevo's broad communications footprint creates material availability, deliverability, privacy, channel-policy, and execution exposure. Independent monitoring shows recurring service incidents, while the assigned evidence does not establish regulator findings, security-control effectiveness, contractual SLAs, customer concentration, or risk-adjusted unit economics.
sections:
  - id: ranked-risk-view
    title: Ranked risk view and investment implications
    body: >-
      Availability and deliverability are the highest-evidence residual risks because Brevo sits in
      customers' marketing and transactional communication paths. StatusGator says it has monitored
      Brevo since January 2024 and reports more than 773 outages or problems affecting users; its
      October 2026 history includes public-API errors and multi-service warnings. The source combines
      official status-page data with independent signals, so it demonstrates incident frequency but
      not contractual downtime, affected-customer share, or revenue impact. The next tier is compliance
      and platform-policy exposure: Brevo processes engagement data and orchestrates email, SMS,
      WhatsApp, push, chat, and AI-driven segmentation. Investment underwriting should therefore
      require service-level history, deliverability cohorts, privacy and AI-control evidence, and
      quantified customer remediation before treating reported recurring revenue as low risk.
    claimRefs: [CR001, CR002, CR003, CR004, CR005, CR006, CR008, CR014]
    figureRefs: [FR001]
  - id: regulatory-legal-and-financial-model
    title: Regulatory, legal, and financial-model exposure
    body: >-
      The regulatory surface is wider than a single email product. Brevo's own product page describes
      per-contact optimization based on engagement history plus AI segmentation and an AI data
      analyst, while its channel set spans media with different consent, sender-identity, content, and
      platform rules. A competitor-authored review says the product includes consent tooling, data
      processing agreements, EU-hosting options, bounce management, and spam controls, but it also
      reports account suspensions under strict policies. Those assertions are useful control leads,
      not independent assurance. No regulator, court, certification, audit, insurance, or breach
      record was allocated to this chapter, so absence of a cited enforcement event cannot be read as
      absence of legal exposure. Oakley's reported 65% revenue share across France, Germany, and the
      United States also makes jurisdiction and country-mix evidence financially relevant.
    claimRefs: [CR005, CR006, CR009, CR012, CR014]
    tableRefs: [TR001]
  - id: operational-and-customer-impact
    title: Operational, quality, and customer-impact risk
    body: >-
      Brevo's operational risk is not hypothetical, but the evidence does not justify a precise loss
      estimate. StatusGator lists a 20-minute public-API warning on October 19, 2026, several
      multi-service warnings on October 14-15, and a 21-minute login/content-loading event on October
      13 that it says was never officially acknowledged. Its page also tracks 35 components in 10
      groups, illustrating a broad failure surface. Separately, Omnisend reports occasional interface
      lag, slow support, an approximately 88.3% deliverability rate, and account-suspension complaints;
      because Omnisend is a competitor and does not publish the deliverability denominator or method,
      these are adverse diligence signals rather than benchmarks. The practical kill criterion is
      repeated material incidents without improving recovery, disclosure, and delivery-cohort data.
    claimRefs: [CR001, CR002, CR003, CR004, CR011, CR012, CR013, CR014]
    tableRefs: [TR002]
  - id: dependencies-mitigation-and-kill-criteria
    title: Dependencies, mitigations, and thesis-break triggers
    body: >-
      Brevo's multi-channel proposition necessarily exposes customers to dependencies beyond the core
      application. The official product page names email, SMS, WhatsApp, push, live chat, and chatbot,
      while Wikipedia reports integrations with platforms including Shopify, Salesforce, WordPress,
      WooCommerce, Zoom, and Meta-owned channels. Dreamlit also reports that customers below the
      Professional tier use shared IP pools whose other senders can affect inbox placement. These
      sources establish dependency breadth, not contract terms, redundancy, portability, or
      concentration. Oakley says France, Germany, and the United States generate 65% of revenue and
      that new funding is intended to intensify M&A, adding geographic and integration-execution risk.
      Mitigation maturity should remain partial until diligence produces channel-provider terms,
      failover architecture, acquisition scorecards, and country/customer concentration. Thesis-break
      triggers include unrecovered critical-channel outages, sustained deliverability deterioration,
      a material privacy or messaging enforcement action, or M&A integration costs that erase
      recurring-revenue quality.
    claimRefs: [CR006, CR007, CR008, CR009, CR010, CR015, CR016]
    tableRefs: [TR003]
