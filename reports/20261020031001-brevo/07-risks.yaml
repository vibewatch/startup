    rows:
      - - Messaging channels
        - Email ecosystem, SMS carriers, WhatsApp and other channel platforms
        - Channel breadth is public; contractual concentration is not
        - Policy, API, pricing, or deliverability change impairs campaigns
        - High
        - Not publicly established
        - Medium-high; inspect contracts, failover, portability, and provider-level volumes
      - - Commerce, CRM, CMS, meeting, and social integrations
        - Shopify, Salesforce, WordPress, WooCommerce, Zoom, and Meta-owned channels
        - Integration breadth is reported; usage mix is not
        - API change or integration failure degrades workflow value
        - Medium-high
        - Partial; breadth suggests alternatives but not redundancy
        - Medium; obtain active-use mix, breakage history, and migration tests
      - - Growth capital and acquisition execution
        - Oakley, General Atlantic, management, and acquisition targets
        - Sponsor source says funding supports an intensified M&A strategy
        - Integration cost, product sprawl, or governance load erodes recurring-revenue quality
        - High
        - Unclear
        - Medium-high; review acquisition scorecards, retention, synergies, and integration ownership
    notes: Dependency breadth is evidenced, but provider-level volume, contract, redundancy, and acquisition-performance data are unavailable in the assigned source pool.
    claimRefs: [CR006, CR007, CR008, CR009, CR010, CR015]
