callouts:
  - calloutType: risk
    title: Evidence-constrained kill criteria
    body: >-
      Pause underwriting if primary diligence shows sustained deliverability deterioration, repeated
      critical-channel outages without improving recovery, a material privacy or messaging
      enforcement action, or acquisition integration costs that undermine recurring-revenue quality.
      The public evidence does not quantify thresholds, so the investment committee should set them
      only after reviewing cohort, SLA, legal, and acquisition data.
    claimRefs: [CR001, CR005, CR008, CR010, CR014]
