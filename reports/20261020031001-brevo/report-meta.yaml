companyProfile:
  summary: >-
    Brevo, formerly Sendinblue, is a Paris-headquartered customer engagement software company founded in 2012 and led by
    founder-CEO Armand Thiberge. It combines multichannel messaging, transactional communications, automation, and CRM
    in a volume-sensitive subscription platform serving a broad SMB and mid-market base.
