  topStrengths:
    - Company-issued disclosure indicates more than €200 million of 2025 ARR with a double-digit EBITDA margin.
    - >-
      The platform spans multiple engagement channels, transactional messaging, automation, and CRM within one product
      family.
    - Reported adoption exceeds 600,000 companies, with an independent external footprint of 155,628 websites.
    - U.S. contribution, faster mid-market growth, and AI-enabled personalization provide plausible expansion vectors.
  topRisks:
    - >-
      Exact valuation, transaction structure, preference stack, dilution, and debt remain undisclosed, preventing
      price-sensitive underwriting.
    - >-
      Gross margin, NRR, GRR, churn, CAC payback, cash flow, cash balance, and customer concentration are not publicly
      available.
    - >-
      Availability, deliverability, privacy, AI-governance, and channel-policy exposure are material for a
      communications platform.
    - >-
      France, Germany, and the United States reportedly account for 65% of revenue, while simultaneous U.S., AI, and M&A
      investment raises execution risk.
  unresolvedGaps:
    - >-
      Obtain the exact post-money valuation, primary-versus-secondary split, investor allocations, fully diluted cap
      table, preferences, and debt schedule for the December 2025 financing.
    - Reconcile ARR to audited revenue and provide gross margin, EBITDA, free-cash-flow, cash, burn, and runway data.
    - >-
      Provide NRR, GRR, logo and revenue churn, cohort retention, CAC payback, customer concentration, and product
      attach rates.
    - >-
      Validate named-customer deployments, contract scope, measured outcomes, renewal history, and enterprise win/loss
      performance.
    - >-
      Review SLA history, incident root causes, deliverability cohorts, privacy and AI controls, regulator
      correspondence, and channel-provider terms.
