  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品覆盖面与成熟度
        blocks:
          - type: paragraph
            body: >-
              Brevo 已不再被定位为单一用途的邮件工具。当前第三方和投资人材料描述了一套覆盖电子邮件、SMS、WhatsApp、聊天、销售工具、事务性消息、CRM、客户数据、推送和自动化的产品；Brevo
              自己的产品页面则突出 Aura AI
              个性化。这样的广度具有商业意义：客户无需先采购多个单点产品，就能统筹外发活动、触发式服务消息和销售跟进。代价是验证难度：公开产品面功能丰富，但不同模块和套餐的成熟度不同，而且若干来源是评测或竞争对手对比，而非原始技术文档。因此，模块矩阵区分了公开证据支持的能力与仍需产品遥测核实的尽调事项。
            claimRefs:
              - CE001
              - CE006
              - CE013
