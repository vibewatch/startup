            title: 受证据约束的否决标准
            body: >-
              如果一手尽调显示送达率持续恶化、关键渠道反复中断且恢复没有改善、发生重大隐私或消息监管执法，或并购整合成本损害经常性收入质量，应暂停投资判断。公开证据没有量化阈值，因此投资委员会只能在审阅队列、SLA、法律和并购数据后设定阈值。
            calloutType: risk
            claimRefs:
              - CR001
              - CR005
              - CR008
              - CR010
              - CR014
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与入场纪律
        blocks:
          - type: paragraph
            body: >-
              投资建议是继续研究 / 观察，而不是买入。Brevo 及其融资伙伴披露了 2025 年 12 月 €500 million 的融资，并称公司成为独角兽；但 ClickZ 的联合转载版本使用了 $500+
              million 的金额。两种说法都没有提供确切投后估值、新股与老股交易拆分、清算优先权、债务或投资人出资额。管理层和员工成为最大股东，从方向上有利于利益一致；Partech
              完全退出则说明交易也提供了流动性。这些事实证明了融资能力和所有权变化，却没有证明目标回报有价格依据。入场仍应以核对币种表述并取得完整资本化和交易模型为前提。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV005
              - CV008
              - CV010
              - CV011
      - number: '8.2'
        title: 运营证明与上行情景
        blocks:
          - type: paragraph
            body: >-
              最有力的公开投资判断证据来自运营，而非估值。交易公告称 Brevo 2025 年 ARR 将超过 €200 million，EBITDA 利润率达到两位数，客户超过 600,000 家，且 65%
              的收入来自法国、德国和美国。公告还称美国贡献了新增收入的 24%，截至 2030 年计划在该市场投资超过 €100 million，中端市场收入增速是整体业务的两倍。Brevo 产品页面还提供了联系人级 AI
              个性化的证据。这些信号支持以盈利的国际化和产品扩张为基础的乐观情景，但它们仍由公司或合作伙伴发布，不能替代经审计的留存、毛利率、队列或现金流数据。
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
          - type: table
            tableRef: TV003
            claimRefs:
              - CV005
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV013
              - CV014
              - CV016
      - number: '8.3'
        title: 反向逻辑与可比信号
        blocks:
          - type: paragraph
            body: >-
              公开对比证据主要用于产品定位，不能用来推导企业价值倍数。Dreamlit 2026 年 9 月的评测确认入门价格较低，但指出联系人上限、增值项不断增加以及电话支持价格高。竞争对手 Omnisend
              称支持有限、账户规则可能令人挫败；Authencio 的评测标题则将定位概括为“高性价比、基础销售工具”。ZoomInfo 的竞争对比认为，Brevo
              管理的是已知联系人，而不是提供获客数据库或买方意向信号。这些来源不是独立财务基准，竞争对手的说法权重应较低，但合在一起揭示了压力点：低价定位可能限制变现，产品广度可能增加复杂度，企业扩张可能需要超出 Brevo
              当前核心能力的功能。
            claimRefs:
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV005
              - CV008
              - CV010
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: 情景逻辑、退出准备度与尽调
        blocks:
          - type: paragraph
            body: >-
              在现有记录下给出数字估值区间会制造虚假的精确度。乐观情景要求已披露的 ARR、盈利能力、美国增长和中端市场动能转化为持久留存与现金创造，同时 AI 和产品广度扩大变现。基准情景把 Brevo
              视为规模化、盈利的客户互动平台，但在交易经济性和可比倍数明确前，不对最新融资背景给予溢价。悲观情景叠加地域集中、支持和账户控制摩擦、定价增值项，以及同时投资美国、AI
              和中端市场带来的执行风险。凭借规模、盈利能力和赞助方参与，退出准备度是可能的；但投资判断所需的持有期、回报目标和退出路径，仍需经审计财务数据、队列留存、股权结构权利和先例交易数据。
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV007
              - CV008
              - CV009
              - CV010
              - CV013
              - CV014
              - CV016
      - number: '8.5'
        title: 展示
        blocks:
          - type: callout
            title: 价格纪律优先于公司质量
            body: Brevo 可能是可信的规模化平台，但公开记录不足以支持绝对估值区间或目标回报。在改变建议前，应要求经审计运营指标、完全摊薄股权结构表、证券条款和基于可比公司的退出模型。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
