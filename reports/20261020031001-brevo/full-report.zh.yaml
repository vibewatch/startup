      - - 核心论点
        - 美国新收入贡献和更快的中端市场增长显示出扩张路径。
        - 证据表明投资转化为持久的 NRR、利润率和客户扩张。
      - - 反论点
        - 低价定位包含联系人上限、附加服务，以及昂贵的电话支持权限。
        - 尽管定价和支持存在取舍，净收入留存和毛利率仍保持稳定。
      - - 反论点
        - 竞品评测指出支持、账户控制和接触前数据存在局限。
        - 独立的企业客户胜负分析证据和客户访谈验证。
