      - number: '5.3'
        title: 运行架构与依赖
        blocks:
          - type: paragraph
            body: >-
              公开证据支持的是功能架构，而非基础设施层架构。客户数据和同意状态进入分群；自动化层评估事件与规则；渠道服务发送营销活动或事务性消息；API、SMTP、SDK、webhook
              和打包集成连接外部系统；分析把互动信号回传给后续工作流。事务性消息与普通营销活动分开描述，并通过 API 和 SMTP
              路径提供。这一设计依赖干净的客户数据、发件人认证、第三方渠道规则和正确的事件埋点。尤其是，WhatsApp 营销模板需要 Meta 审批、合适的 Business 设置和联系人同意，因此渠道触达并非完全由
              Brevo 控制。
