chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份与平台范围
        blocks:
          - type: paragraph
            body: >-
              Brevo 是 Sendinblue 的现名。据 TechnologyChecker 报道，公司由 Armand Thiberge 于 2012 年在印度和法国创立；品牌从 Sendinblue 更名为
              Brevo 于 2023 年 5 月 4
              日生效。公司总部位于巴黎，如今将自己定位为客户互动平台，而非单一渠道的邮件工具。现有证据显示，其套件覆盖电子邮件、SMS、WhatsApp、推送通知、在线聊天、事务性消息、营销自动化和
              CRM。这样的广度支撑了订阅软件定位及与用量挂钩的消息业务模式，但公开页面没有披露产品层面的收入构成、附加率，或使用多个模块的客户数量。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO008
              - CO009
              - CO010
              - CO011
              - CO012
              - CO013
      - number: '1.2'
        title: 融资与所有权重置
        blocks:
          - type: paragraph
            body: >-
              General Atlantic 的交易公告称，Brevo 于 2025 年 12 月 4 日完成 EUR500 million 融资并成为独角兽。同一公告称 General Atlantic 和 Oakley
              Capital 成为新股东，Bpifrance 和 Bridgepoint 继续作为少数股东，Partech
              则完全退出。管理层和员工成为最大股东群体，说明交易后内部持股可能相当可观，但投票权和经济权益比例并未披露。由于证据来自交易参与方，且确切投后估值、投资人出资额、债务成分以及新股与老股交易分配仍未公开，这笔融资不应被视为
              EUR500 million 的新增现金。
            claimRefs:
              - CO005
              - CO006
              - CO007
          - type: table
            tableRef: TO003
            claimRefs:
              - CO001
              - CO005
              - CO006
              - CO007
      - number: '1.3'
        title: 规模声明与外部信号
        blocks:
          - type: paragraph
            body: >-
              2025 年 12 月的投资人公告将几项规模声明归于 Brevo：2025 年 ARR 超过 EUR200 million、客户公司超过 600,000 家、员工超过 1,000 人，并在 180
              个国家运营。ARR 不是会计收入，这些数字也都没有提供留存、队列质量、客户集中度或经审计收入。TechnologyChecker 于 2026 年 10 月独立在 155,628 个网站检测到 Brevo
              信号；在 106,509 家拥有已知员工数的匹配公司中，83.41% 的员工数不超过 50 人。其方法明确提醒，DNS 和页面代码信号不能证明活跃使用或客户数量，因此这只能作为采用证据，不能与 Brevo
              的客户声明相互勾稽。
            claimRefs:
              - CO008
              - CO009
              - CO010
              - CO011
              - CO012
              - CO013
              - CO014
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO001
              - CO002
              - CO005
              - CO006
              - CO007
              - CO008
