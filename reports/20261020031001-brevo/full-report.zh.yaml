              Brevo 的交易公告点名 eBay、H&M、Louis Vuitton、Carrefour 和
              Michelin，但这是公司发布的证明：现有证据无法确立任何一家客户的合同范围、生产状态、部署广度、持续时间或可量化结果。规模证据同样只是方向性信号，尚未完全勾稽。2025 年 12 月公告称客户超过
              600,000 家，而 2026 年 4 月的一份概况称其覆盖 180 个国家、客户超过 500,000 家。OMR 评测的二手摘要又提供了另一项采用信号：截至 2026 年有 430 条评价，评分为
