      - number: '4.4'
        title: 财务结论与投资判断阻碍
        blocks:
          - type: paragraph
            body: >-
              Brevo
              看起来是一家规模化的经常性软件企业，变现面广，且据公司报告实现盈利；但证据不足以评估收入质量或资本持久性。发送量模式适合联系人多但触达不频繁的客户，对高频自动化项目则更难预测；独立渠道额度和功能增值项可以抬高扩张收入，也会带来价格压力和账单复杂度。下一步关键尽调是审阅管理层数据室，覆盖经审计收入确认、ARR
              到收入的转化、按渠道毛利率、队列留存、按获客路径拆分的 CAC 和回本周期、实际定价与折扣、烧钱速度、债务，以及 2025 年融资中新股与老股交易的构成。在这些输入到位前，公开 EBITDA
              声明只是积极信号，不是完整的财务证明。
