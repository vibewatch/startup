      - number: '4.2'
        title: 公开增长表现与收入质量
        blocks:
          - type: paragraph
            body: >-
              最有力的公开规模披露不是监管文件，而是交易方于 2025 年 12 月发布的融资公告。公告称 Brevo 2025 年年度经常性收入将超过 €200 million，EBITDA 利润率达到两位数。ARR
              是经常性运行率指标，不是会计收入；利润率声明也没有提供分子、调整项或经审计勾稽。同一公告称法国、德国和美国合计占总收入的 65%，美国贡献了新增收入的
              24%。这些数字既显示地域集中，也显示美国是重要增长方向，但没有披露按渠道、套餐、客户队列或获客方式拆分的收入。
            claimRefs:
              - CI010
              - CI011
              - CI012
              - CI013
      - number: '4.3'
        title: 成本结构与资本充足性
        blocks:
          - type: paragraph
            body: >-
              2025 年 12 月融资提供了战略能力，但募集资金不等于可用现金。交易方公告称，€500 million 融资将支持 AI 投资、美国扩张和并购，并另行说明截至 2030 年计划在美国投资超过 €100
              million。公告还称，历史上超过一半的员工和人才投入产品开发与研发，说明这是重要成本中心，但未披露费用规模。现有来源没有提供手头现金、经营现金流、烧钱速度、现金跑道、营运资金、资本开支、债务、契约或并购义务数据。因此不能从融资规模推断资本充足性；需要管理层材料来勾稽募集款、老股流动性、承诺用途和剩余流动性。
            claimRefs:
              - CI014
              - CI015
              - CI016
          - type: table
            tableRef: TI003
            claimRefs:
