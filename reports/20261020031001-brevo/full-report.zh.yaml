  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险排序与投资含义
        blocks:
          - type: paragraph
            body: >-
              可用性和送达率是证据最充分的剩余风险，因为 Brevo 位于客户的营销与事务性通信路径中。StatusGator 称其自 2024 年 1 月起监测 Brevo，并报告超过 773 次影响用户的中断或问题；其
              2026 年 10 月历史记录包括公开 API
              错误和多服务警告。该来源结合官方状态页数据与独立信号，因此能说明事故频率，但不能说明合同停机时间、受影响客户占比或收入影响。下一层风险是合规和平台政策暴露：Brevo
              处理互动数据，并编排电子邮件、SMS、WhatsApp、推送、聊天和 AI 驱动的分群。因此，在把报告的经常性收入视为低风险前，投资判断应要求服务水平历史、送达率队列、隐私与 AI
              控制证据，以及量化的客户补救数据。
