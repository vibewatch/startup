        title: 客户基础与分群构成
        blocks:
          - type: paragraph
            body: >-
              公开证据始终将 Brevo 定位于注重成本的中小企业，公司材料则把可触达受众扩展到非营利组织，并强调中端市场增长更快。独立概况把可负担性和易用性视为 SMB
              价值主张的核心；对于联系人名单庞大但发送频率适中的组织，Brevo 按用量定价也可能有吸引力。公司及交易伙伴于 2025 年 12 月报告客户超过 600,000 家，而两份 2026 年二手概况仍使用超过
              500,000 家的数字。这些数字未必可比，可能反映发布时间滞后、四舍五入或定义不同。因此，证据支持全球规模及从 SMB 到中端市场的广泛覆盖，但不支持精确的当前活跃客户分母或按客户规模拆分的收入构成。
