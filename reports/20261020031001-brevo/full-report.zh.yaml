  - id: FU001
    title: 有证据支持的客户采用与扩张旅程
    type: journey-map
    summary: 公开证据显示了一条从易进入产品到多渠道和 CRM 扩张的合理路径，但留存阶段尚未量化。
    data:
      nodes:
        - id: accessible-entry
          label: 易进入
          detail: 按量定价和较低入门层级降低了联系人较多组织的初始投入。
        - id: campaign-activation
          label: 活动启动
          detail: 客户从电子邮件活动、内容创建和基础分析开始。
        - id: channel-expansion
          label: 渠道扩张
          detail: SMS、WhatsApp、推送、实时聊天和聊天机器人增加互动入口。
        - id: automation
          label: 旅程自动化
          detail: 自动化、落地页、分群和分析加深工作流采用。
        - id: crm-expansion
          label: CRM 扩张
          detail: 公司将销售 CRM 描述为增长驱动因素，尤其是在中端市场。
        - id: durability-proof
          label: 持久性证明
          detail: NRR、GRR、流失、续约、附加率和集中度证据均未公开量化。
    approximationNotes: 有序阶段描述的是有依据的采用假设，不是实测转化率或共同客户群；没有推断阶段宽度、时间或客户数。
