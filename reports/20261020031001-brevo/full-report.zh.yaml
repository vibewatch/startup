      - number: '5.2'
        title: 客户工作流与自动化模式
        blocks:
          - type: paragraph
            body: >-
              有证据支持的工作流从联系人属性、同意状态、名单、分群和行为事件开始。页面访问、加入名单、提交表单、点击、购买事件或自定义事件等触发器，可以把联系人带入基于规则的序列；随后可发送消息、等待、分支、调用
              webhook、创建内部通知或发起选定的销售活动。独立评测认为，这套模式对非技术营销人员较易上手，并能覆盖电子邮件、SMS 和
              WhatsApp；但复杂布局和更深层的条件旅程仍有摩擦。因此，价值主张在于工作流整合和易用性，而不是已证明对最复杂企业编排的优势。
            claimRefs:
              - CE002
