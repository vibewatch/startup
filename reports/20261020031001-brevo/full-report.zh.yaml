  - id: TV003
    title: 乐观、基准和悲观情景
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 概率信号
      - 下行触发因素
    rows:
      - - 乐观
        - ARR 和两位数 EBITDA 利润率保持不变，同时美国、中端市场和 AI 投资扩大变现。
        - 只有在经审计指标和交易条款确立回报区间后，溢价才可能站得住。
        - 美国新收入占比和中端市场增长延续，且利润率不受侵蚀。
        - 扩张支出未能带来留存或盈利增长。
      - - 基准
        - Brevo 保持规模化和盈利，但公开证据仍不足以确定精确的入场倍数。
        - 投资前，以经核实的 ARR、EBITDA 和可比公司倍数跟踪公司并评估价格。
        - 尽调确认已披露规模，客户群保持稳定。
        - 入场价格已计入未经验证的 2030 年目标或激进的倍数扩张。
      - - 悲观
        - 集中度、支持摩擦、定价复杂度和广泛的执行承诺拖慢增长或压缩利润率。
        - 没有可辩护的公开下行底线；要求保护性条款和显著估值折扣。
        - 留存疲弱、支持负担上升，或美国及中端市场转化放缓。
        - 下轮融资、利润率恶化或不利的优先股堆叠。
    notes: 由于确切估值、所有权经济、经审计的单位指标和可比交易倍数均不可得，情景结果采用定性描述。
