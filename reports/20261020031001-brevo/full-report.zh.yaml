      - number: '7.4'
        title: 依赖、缓释措施与投资逻辑失效触发条件
        blocks:
          - type: paragraph
            body: >-
              Brevo 的多渠道主张必然让客户暴露于核心应用之外的依赖。官方产品页面列出电子邮件、SMS、WhatsApp、推送、在线聊天和聊天机器人；Wikipedia 则称其与
              Shopify、Salesforce、WordPress、WooCommerce、Zoom 及 Meta 旗下渠道等平台集成。Dreamlit 还报告，Professional 级别以下客户使用共享 IP
              池，其他发件人可能影响进箱。这些来源证明依赖面广，但不能证明合同条款、冗余、可移植性或集中度。Oakley 称法国、德国和美国贡献 65%
              的收入，新融资将用于加大并购，这增加了地域和整合执行风险。在尽调拿到渠道供应商条款、故障切换架构、收购评分卡以及国家/客户集中度前，缓释措施的成熟度应仍视为有限。未恢复的关键渠道中断、送达率持续恶化、重大隐私或消息监管执法，或抹去经常性收入质量的并购整合成本，都可能触发投资逻辑失效。
