  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 公开证据支持运营质量，但不足以给出特定价格的投资建议。
    data:
      nodes:
        - id: financing
          label: 披露 €500m 融资
          detail: 大额资本事件和独角兽地位，但没有确切投后估值。
        - id: scale
          label: “超过 €200m ARR”声明
          detail: 经常性收入规模支持公司质量。
        - id: profitability
          label: 两位数 EBITDA 利润率声明
          detail: 报告的盈利能力相较现金消耗型故事提升了韧性。
        - id: growth
          label: 美国、中端市场和 AI 路径
          detail: 存在多条扩张路径，包括按联系人计费的 AI 优化。
        - id: gap
          label: 价格和条款仍属私密
          detail: 投后估值、优先权、稀释和可比倍数均缺失。
        - id: decision
          label: 继续研究 / 跟踪
          detail: 只有在交易室估值和回报模型完成后才推进。
