figures:
  - id: FM001
    title: Market-sizing evidence ladder
    type: pyramid
    summary: >-
      Available evidence narrows from an unsized broad category to observable company adoption and a
      proprietary benchmark sample without implying that the layers are mathematically nested.
    data:
      items:
        - label: Broad customer-engagement software
          value: Dollar TAM unavailable
          detail: No independent category value with a consistent geography, period, and spend taxonomy.
        - label: Core engagement spend
          value: Messaging plus automation
          detail: Email, SMS, WhatsApp, push, chat, orchestration, and campaign analytics.
        - label: Adjacent workflow spend
          value: Transactional messaging plus lightweight CRM
          detail: Relevant cross-sell categories but not interchangeable with the core spend pool.
        - label: Pricing-qualified demand
          value: Depends on monthly send volume
          detail: Economics differ materially between infrequent and high-frequency senders.
        - label: Company-reported platform adoption
          value: More than 600,000 companies
          detail: Company-issued 2026 statement; this is not an independently verified market population.
        - label: Company benchmark sample
          value: 175,000 businesses
          detail: Proprietary multichannel dataset; sample membership does not establish TAM or SAM.
    approximationNotes: >-
      This is an evidence hierarchy, not a proportional pyramid or conversion funnel; the two numeric
      values have different denominators and must not be divided, summed, or converted into revenue.
    claimRefs: [CM003, CM004, CM009, CM011, CM015]
callouts:
  - calloutType: risk
    title: No defensible public dollar TAM
    body: >-
      The retained evidence lacks an independent market value with consistent category, geography,
      period, and methodology, so a precise TAM/SAM/SOM would be unsupported.
    claimRefs: [CM015]
  - calloutType: recommendation
    title: Underwrite from customer cohorts, not a generic martech multiple
    body: >-
      Request revenue by customer segment, geography, channel, and plan; then model expansion and
      retention against send volume, seat growth, add-ons, support costs, and enterprise-control attach.
    claimRefs: [CM004, CM006, CM007, CM008]
