      - ["Oakley Capital", "Joined as shareholder in 2025", "New pan-European sponsor", "Confirm check size, security, board rights, and preferences"]
      - [Bpifrance, "Remained a minority investor", "Continuing institutional shareholder", "Confirm ownership, information rights, and participation"]
