artifact: company-overview
slug: brevo
runDate: 2026-10-20
company:
  name: Brevo
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Brevo is a Paris-headquartered customer-engagement software company founded in 2012
    and led by founder-CEO Armand Thiberge. A participant-issued December 2025 release
    reported a EUR500 million financing, more than EUR200 million of 2025 ARR, more than
    600,000 customers, and more than 1,000 employees, while independent web evidence
    supports broad adoption but does not validate customer activity, retention, valuation,
    or the round's primary-versus-secondary mix.
sections:
  - id: identity-and-platform
    title: Identity and platform scope
    body: >-
      Brevo is the current name of Sendinblue, a company that TechnologyChecker reports
      was founded in 2012 by Armand Thiberge in India and France; the Sendinblue-to-Brevo
      rebrand took effect on 4 May 2023. The company is headquartered in Paris and now
      positions itself as a customer-engagement platform rather than a single-channel
      email tool. The assigned evidence describes a suite spanning email, SMS, WhatsApp,
      push notifications, live chat, transactional messaging, marketing automation, and
      CRM. That breadth supports a subscription-software identity with usage-linked
      messaging economics, but public pages do not disclose product-level revenue mix,
      attach rates, or how many customers use more than one module.
    claimRefs: [CO001, CO002, CO003, CO004]
    tableRefs: [TO001]
  - id: financing-and-ownership
    title: Financing and ownership reset
    body: >-
      General Atlantic's transaction release says Brevo closed a EUR500 million financing
      on 4 December 2025 and became a unicorn. The same release identifies General Atlantic
      and Oakley Capital as new shareholders, Bpifrance and Bridgepoint as continuing
      minority investors, and Partech as fully exiting. Management and employees became
      the largest shareholder group, which suggests meaningful internal ownership after
      the transaction but does not disclose voting rights or economic percentages.
      Because the evidence is issued by a transaction participant and the exact post-money
      valuation, investor checks, debt component, and primary-versus-secondary allocation
      remain undisclosed, the financing should not be treated as EUR500 million of new cash.
    claimRefs: [CO005, CO006, CO007]
    tableRefs: [TO003]
  - id: scale-and-external-signals
    title: Scale claims and external signals
    body: >-
      The December 2025 investor release attributes several scale claims to Brevo: more
      than EUR200 million of ARR for 2025, more than 600,000 customer companies, more than
      1,000 employees, and operations in 180 countries. ARR is not accounting revenue, and
      none of these figures supplies retention, cohort quality, customer concentration, or
      audited revenue. TechnologyChecker independently detected Brevo signals on 155,628
      websites in October 2026 and found that 83.41% of the 106,509 matched companies with
      known headcount had 50 or fewer employees. Its methodology explicitly cautions that
      DNS and page-code signals do not establish active usage or customer volume, so this
      is adoption evidence rather than a reconciliation to Brevo's customer claim.
    claimRefs: [CO008, CO009, CO010, CO011, CO012, CO013, CO014]
    figureRefs: [FO001]
  - id: leadership-governance-and-diligence
    title: Leadership, governance, and diligence implications
    body: >-
      Armand Thiberge is the only Brevo operating executive identified by name in the
      assigned source set, making founder continuity visible but leaving the wider
      executive team, board composition, succession plan, and investor governance rights
      unverified. Investor representatives are visible as transaction sponsors, not as
      confirmed directors. Product breadth also carries execution limits: an independent
      review says customers below the Professional tier use shared IP pools whose other
      senders can affect inbox placement, while a competitor-authored comparison says
      Brevo lacks a native B2B prospecting database. These critiques do not negate the
      platform's scale, but they frame diligence on deliverability controls, enterprise
      expansion, and whether cross-product breadth creates durable adoption or operational
      complexity.
    claimRefs: [CO001, CO006, CO015, CO016]
    tableRefs: [TO002]
