      Year-only milestones reflect the precision available in the cited source; repeated
      4 December 2025 entries separate financing, investor, ownership, and scale disclosures.
    claimRefs: [CO001, CO002, CO005, CO006, CO007, CO008, CO009, CO012, CO013]
callouts:
  - calloutType: insight
    title: Scale is real, but denominators do not reconcile
    body: >-
      The 600,000-plus company claim counts customer organizations, whereas the 155,628
      external figure counts websites with DNS or page-code signals. Neither proves paid
      active customers, retention, product penetration, or revenue concentration.
    claimRefs: [CO009, CO012, CO013, CO014]
  - calloutType: risk
    title: Founder and governance depth remain private
    body: >-
      Public evidence names the founder-CEO and investor representatives but does not
      establish the broader executive bench, board composition, control rights, or succession.
    claimRefs: [CO001, CO006, CO007]
