              - CO011
              - CO012
              - CO013
      - number: '1.2'
        title: Financing and ownership reset
        blocks:
          - type: paragraph
            body: >-
              General Atlantic's transaction release says Brevo closed a EUR500 million financing on 4 December 2025 and
              became a unicorn. The same release identifies General Atlantic and Oakley Capital as new shareholders,
              Bpifrance and Bridgepoint as continuing minority investors, and Partech as fully exiting. Management and
              employees became the largest shareholder group, which suggests meaningful internal ownership after the
              transaction but does not disclose voting rights or economic percentages. Because the evidence is issued by
              a transaction participant and the exact post-money valuation, investor checks, debt component, and
              primary-versus-secondary allocation remain undisclosed, the financing should not be treated as EUR500
              million of new cash.
            claimRefs:
              - CO005
              - CO006
              - CO007
          - type: table
            tableRef: TO003
            claimRefs:
              - CO001
              - CO005
              - CO006
              - CO007
      - number: '1.3'
        title: Scale claims and external signals
        blocks:
          - type: paragraph
            body: >-
              The December 2025 investor release attributes several scale claims to Brevo: more than EUR200 million of
              ARR for 2025, more than 600,000 customer companies, more than 1,000 employees, and operations in 180
              countries. ARR is not accounting revenue, and none of these figures supplies retention, cohort quality,
              customer concentration, or audited revenue. TechnologyChecker independently detected Brevo signals on
              155,628 websites in October 2026 and found that 83.41% of the 106,509 matched companies with known
              headcount had 50 or fewer employees. Its methodology explicitly cautions that DNS and page-code signals do
              not establish active usage or customer volume, so this is adoption evidence rather than a reconciliation
              to Brevo's customer claim.
            claimRefs:
              - CO008
              - CO009
              - CO010
              - CO011
              - CO012
              - CO013
              - CO014
