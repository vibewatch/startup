        title: Exhibits
        blocks:
          - type: callout
            title: Scale is real, but denominators do not reconcile
            body: >-
              The 600,000-plus company claim counts customer organizations, whereas the 155,628 external figure counts
              websites with DNS or page-code signals. Neither proves paid active customers, retention, product
              penetration, or revenue concentration.
            calloutType: insight
            claimRefs:
              - CO009
              - CO012
              - CO013
              - CO014
          - type: callout
            title: Founder and governance depth remain private
            body: >-
              Public evidence names the founder-CEO and investor representatives but does not establish the broader
              executive bench, board composition, control rights, or succession.
            calloutType: risk
            claimRefs:
