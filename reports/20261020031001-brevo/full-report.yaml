chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and platform scope
        blocks:
          - type: paragraph
            body: >-
              Brevo is the current name of Sendinblue, a company that TechnologyChecker reports was founded in 2012 by
              Armand Thiberge in India and France; the Sendinblue-to-Brevo rebrand took effect on 4 May 2023. The
              company is headquartered in Paris and now positions itself as a customer-engagement platform rather than a
              single-channel email tool. The assigned evidence describes a suite spanning email, SMS, WhatsApp, push
              notifications, live chat, transactional messaging, marketing automation, and CRM. That breadth supports a
              subscription-software identity with usage-linked messaging economics, but public pages do not disclose
              product-level revenue mix, attach rates, or how many customers use more than one module.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
