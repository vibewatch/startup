    title: Company milestone timeline
    type: timeline
    summary: >-
      The evidence shows a founder-led evolution from Sendinblue to a funded, multichannel Brevo platform, with external
      adoption signals that remain non-equivalent to customers.
    data:
      items:
        - date: '2012'
          label: Company founded
          detail: TechnologyChecker reports that Armand Thiberge founded the company in India and France.
          tone: neutral
          claimRefs:
            - CO001
        - date: '2023-05-04'
          label: Sendinblue became Brevo
          detail: The rebrand marked a broader customer-platform identity beyond email sending.
          tone: positive
          claimRefs:
            - CO002
        - date: '2025-12-04'
          label: EUR500 million financing announced
          detail: A transaction-participant release described the round as making Brevo a unicorn.
          tone: positive
          claimRefs:
            - CO005
        - date: '2025-12-04'
          label: New sponsors joined
          detail: General Atlantic and Oakley Capital joined while Bpifrance and Bridgepoint remained minority investors.
          tone: neutral
          claimRefs:
            - CO006
