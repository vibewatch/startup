  - id: FU001
    title: Evidence-backed customer adoption and expansion journey
    type: journey-map
    summary: >-
      Public evidence shows a plausible path from accessible entry to multichannel and CRM expansion, while the
      retention stage remains unmeasured.
    data:
      nodes:
        - id: accessible-entry
          label: Accessible entry
          detail: Volume-based pricing and low entry tiers reduce initial commitment for contact-rich organizations.
        - id: campaign-activation
          label: Campaign activation
          detail: Customers begin with email campaigns, content creation, and basic analytics.
        - id: channel-expansion
          label: Channel expansion
          detail: SMS, WhatsApp, push, live chat, and chatbot add engagement surfaces.
        - id: automation
          label: Journey automation
          detail: Automation, landing pages, segmentation, and analytics deepen workflow adoption.
        - id: crm-expansion
          label: CRM expansion
          detail: Sales CRM is described by the company as a growth driver, especially in the mid-market.
        - id: durability-proof
          label: Durability proof
          detail: NRR, GRR, churn, renewal, attach-rate, and concentration evidence is not publicly quantified.
