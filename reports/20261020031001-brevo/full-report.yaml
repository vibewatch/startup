              - CO006
              - CO007
              - CO008
              - CO009
              - CO012
              - CO013
      - number: '1.4'
        title: Leadership, governance, and diligence implications
        blocks:
          - type: paragraph
            body: >-
              Armand Thiberge is the only Brevo operating executive identified by name in the assigned source set,
              making founder continuity visible but leaving the wider executive team, board composition, succession
              plan, and investor governance rights unverified. Investor representatives are visible as transaction
              sponsors, not as confirmed directors. Product breadth also carries execution limits: an independent review
              says customers below the Professional tier use shared IP pools whose other senders can affect inbox
              placement, while a competitor-authored comparison says Brevo lacks a native B2B prospecting database.
              These critiques do not negate the platform's scale, but they frame diligence on deliverability controls,
              enterprise expansion, and whether cross-product breadth creates durable adoption or operational
              complexity.
            claimRefs:
              - CO001
              - CO006
              - CO015
              - CO016
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO006
