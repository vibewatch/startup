  topStrengths:
    - 公司披露显示，2025 年 ARR 超过 €200 million，EBITDA 利润率达到两位数。
    - 该平台在同一产品家族内覆盖多种互动渠道、事务型消息、自动化和 CRM。
    - 据报道，采用该平台的企业超过 600,000 家；独立外部数据还显示其覆盖 155,628 个网站。
    - 美国业务贡献、中端市场更快的增长，以及 AI 驱动的个性化，都可能成为扩张路径。
  topRisks:
    - 具体估值、交易结构、优先股堆叠、稀释情况和债务仍未披露，因此无法进行价格敏感的投资判断。
    - 毛利率、NRR、GRR、流失率、CAC 回本周期、现金流、现金余额和客户集中度均无公开数据。
    - 对通信平台而言，可用性、送达率、隐私、AI 治理和渠道政策暴露都是重大风险。
    - 据报道，法国、德国和美国合计贡献 65% 的收入；同时押注美国、AI 和并购投资，也抬高了执行风险。
  unresolvedGaps:
    - 获取 2025 年 12 月融资的准确投后估值、新股与老股交易拆分、投资人配额、完全摊薄股权结构表、优先权和债务明细。
    - 将 ARR 与经审计收入勾稽，并提供毛利率、EBITDA、自由现金流、现金、烧钱速度和现金跑道数据。
    - 提供 NRR、GRR、客户数与收入流失率、队列留存、CAC 回本周期、客户集中度和产品附加率。
    - 核实已点名客户的部署、合同范围、量化结果、续约历史，以及企业客户的赢单与丢单表现。
    - 审查 SLA 历史、事故根因、送达率队列、隐私与 AI 控制、监管往来，以及渠道提供商条款。
