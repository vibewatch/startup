        - name: Omnisend
          label: Omnisend
          x: 3
          y: 4
          detail: "Ecommerce automation and store integration are the cited focus."
    approximationNotes: >-
      Analyst-assigned 1-5 ordinal coordinates summarize explicit comparative
      review language; they are not measured market benchmarks, and competitor
      evidence is incomplete.
    claimRefs: [CP005, CP006, CP007, CP008, CP009, CP016]
callouts:
  - calloutType: strength
    title: A pricing architecture suited to contact-heavy lists
    body: >-
      Charging around sends rather than stored contacts can make Brevo structurally
      attractive to buyers with large databases and moderate campaign frequency.
    claimRefs: [CP003, CP016]
  - calloutType: risk
    title: Breadth does not equal category leadership
    body: >-
      Independent reviews consistently frame the suite as broad but less compelling
      where deep CRM, ecommerce automation, editor simplicity, or deliverability
      is the decisive criterion.
    claimRefs: [CP006, CP007, CP008, CP009, CP011]
