schemaVersion: "report-v2"
artifact: financials
slug: brevo
runDate: 2026-10-20
company:
  name: Brevo
chapter:
  number: 4
  title: Financials
  summary: >-
    Brevo monetizes primarily through email-volume subscription tiers, with
    separate credits and add-ons broadening customer spend. A transaction-party
    release says Brevo exceeded €200 million of ARR in 2025 with a double-digit
    EBITDA margin, but gross margin, retention, CAC, cash, burn, runway, and debt
    remain unavailable for underwriting.
sections:
  - id: revenue-model-and-pricing
    title: Revenue model and pricing architecture
    body: >-
      Public pricing evidence points to a usage-sensitive subscription model:
      plans are selected principally by monthly email-send volume rather than
      only by contacts stored. The free tier is capped at 300 emails per day,
      Starter is reported from $9 per month for 5,000 emails, the
      automation-capable Standard tier from $18 per month, and Professional from
      $499 per month; Enterprise remains custom. Revenue can extend beyond the
      base plan through prepaid email credits, separately metered SMS and
      WhatsApp usage, seats, landing pages, branding removal, and dedicated IP
      options. This structure can support land-and-expand behavior, but public
      list prices do not reveal realized discounts, contract duration, channel
      mix, or gross profit by product. The bridge therefore shows billing
      mechanics, not audited revenue recognition or margin conversion.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI005
      - CI006
      - CI007
      - CI008
      - CI009
    tableRefs:
      - TI001
      - TI002
    figureRefs:
      - FI001
  - id: traction-and-revenue-quality
    title: Public traction and revenue quality
    body: >-
      The strongest public scale disclosure is not a filing but a December 2025
      financing release issued by transaction parties. It says Brevo would
      surpass €200 million in 2025 annual recurring revenue and operate at a
      double-digit EBITDA margin. ARR is a recurring run-rate measure rather
      than accounting revenue, and the margin statement supplies no numerator,
      adjustments, or audited reconciliation. The same release says France,
      Germany, and the United States represented 65% of total revenue, while the
      United States generated 24% of new revenue. Those figures suggest both
      geographic concentration and a meaningful US growth vector, but they do
      not disclose revenue mix by channel, plan, customer cohort, or acquisition.
    claimRefs:
      - CI010
      - CI011
      - CI012
      - CI013
  - id: costs-and-capital
    title: Cost structure and capital adequacy
    body: >-
      The December 2025 financing provides strategic capacity, but funding
      raised is not the same as cash available. The transaction-party release
      says the €500 million round would support AI investment, US expansion, and
      M&A, and separately describes more than €100 million of planned US
      investment through 2030. It also says more than half of the workforce and
      talent had historically been dedicated to product development and R&D,
      indicating an important cost center without disclosing its expense level.
      No assigned source provides cash on hand, operating cash flow, burn,
      runway, working capital, capex, debt, covenant, or acquisition-obligation
      data. Capital adequacy therefore cannot be inferred from the round size,
      and management materials are needed to reconcile proceeds, secondary
      liquidity, committed uses, and remaining liquidity.
    claimRefs:
      - CI014
      - CI015
      - CI016
    tableRefs:
      - TI003
  - id: financial-verdict
    title: Financial verdict and underwriting blockers
    body: >-
      Brevo presents as a scaled recurring-software business with a broad
      monetization surface and company-reported profitability, but the evidence
      is insufficient to underwrite revenue quality or capital durability. The
      send-volume model is attractive for large, lightly messaged contact bases
      and less predictable for high-frequency automation programs; separate
      channel credits and feature add-ons can lift expansion revenue while also
      creating price pressure and customer bill complexity. The decisive next
      diligence step is a management data-room review covering audited revenue
      recognition, ARR-to-revenue conversion, gross margin by channel, cohort
      retention, CAC and payback by motion, realized pricing and discounting,
      cash burn, debt, and the primary-versus-secondary composition of the 2025
      round. Until those inputs are supplied, the public EBITDA statement is a
      positive signal rather than a complete financial proof.
    claimRefs:
      - CI001
      - CI007
      - CI008
      - CI010
      - CI011
      - CI014
      - CI015
tables:
  - id: TI001
    title: Revenue streams and monetization mechanisms
    columns:
      - Stream
      - Mechanism and unit
      - Public value or status
      - Evidence quality
      - Diligence ask
    rows:
      - - Marketing subscriptions
        - Monthly plan priced primarily by email-send volume
        - Starter reported from $9/month for 5,000 emails
        - Multiple third-party pricing reviews; realized price unavailable
        - Export ARR and revenue by plan, volume band, geography, and cohort
      - - Automation and advanced features
        - Upgrade to an automation-capable paid tier
        - Standard reported from $18/month
        - Multiple current reviews; tier packaging may change
        - Provide attach rate, upgrade conversion, and realized discount data
      - - High-volume platform
        - Professional subscription or custom Enterprise contract
        - Professional reported from $499/month; Enterprise custom
        - Third-party list pricing only
        - Provide enterprise ACV, term, implementation fees, churn, and concentration
      - - Prepaid email credits
        - Non-expiring pay-as-you-go email credits
        - $35 for 5,000 credits and $105 for 20,000 credits in one review
        - Single third-party review; current realized mix unknown
        - Reconcile credit sales, breakage, usage, and revenue recognition
      - - Messaging and add-ons
        - Separate SMS/WhatsApp credits plus optional seats and features
        - Country- and usage-dependent; add-on prices vary
        - Multiple reviews identify separate metering and add-on charges
        - Provide attach rate, contribution margin, carrier fees, and channel mix
    notes: >-
      Public list pricing and third-party packaging checks as of the cited
      sources; values are not realized revenue, contract price, or gross margin.
    claimRefs:
      - CI001
      - CI003
      - CI004
      - CI005
      - CI006
      - CI007
      - CI008
  - id: TI002
    title: Pricing and packaging snapshot
    columns:
      - Plan
      - List price
      - Included usage or gating
      - Realized pricing status
      - Underwriting implication
    rows:
      - - Free
        - $0
        - 300 emails per day and up to 100,000 stored contacts
        - Not disclosed
        - Acquisition funnel is visible, but free-to-paid conversion is private
      - - Starter
        - From $9/month
        - 5,000 monthly emails at entry; limited automation
        - Discounts and mix not disclosed
        - Low entry price may support self-serve acquisition
      - - Standard
        - From $18/month
        - Automation, A/B testing, landing pages, and advanced reporting
        - Discounts and expansion mix not disclosed
        - Feature gates create an upgrade path beyond send volume
      - - Professional
        - From $499/month
        - High-volume and advanced capabilities
        - Contract terms and support costs not disclosed
        - Large price step requires evidence of retention and service margin
      - - Enterprise
        - Custom
        - Custom volume, support, onboarding, and controls
        - No public ACV or discount schedule
        - Private ACV, implementation cost, and concentration are material gaps
    notes: >-
      Prices are third-party list-price observations, not quotes to a specific
      customer; packaging labels and inclusions should be verified at diligence.
    claimRefs:
      - CI002
      - CI003
      - CI004
      - CI005
      - CI008
  - id: TI003
    title: Unit economics and capital-adequacy evidence
    columns:
      - Metric
      - Public value
      - Confidence
      - Why it matters
      - Diligence request
    rows:
      - - 2025 ARR
        - More than €200 million
        - Medium; company claim in transaction-party release
        - Establishes recurring run-rate scale, not accounting revenue
        - Reconcile ARR to recognized revenue, FX, acquisitions, and churn
      - - EBITDA margin
        - Double-digit in 2025
        - Medium; company claim without reconciliation
        - Signals profitability but not cash generation or gross margin
        - Provide audited EBITDA bridge, stock compensation, and cash conversion
      - - Gross margin by channel
        - null
        - Unavailable
        - Email, SMS, WhatsApp, support, and infrastructure have different costs
        - Provide gross margin by product, channel, plan, and customer segment
      - - NRR, GRR, and churn
        - null
        - Unavailable
        - Determines recurring-revenue durability and expansion quality
        - Provide monthly cohort retention and expansion by segment and geography
      - - CAC and payback
        - null
        - Unavailable
        - Required to compare self-serve, sales-led, and partner GTM efficiency
        - Provide fully loaded CAC, sales cycle, win rate, and payback by motion
      - - Cash, burn, runway, and debt
        - null
        - Unavailable
        - Round size does not establish liquidity after secondaries or commitments
        - Provide cash, cash flow, debt, covenants, primary proceeds, and uses
      - - Product and R&D labor intensity
        - More than 50% of workforce and talent historically dedicated
        - Medium; company claim without expense data
        - Identifies a major cost center but not its absolute or marginal cost
        - Provide R&D headcount, expense, capitalization policy, and AI budget
    notes: >-
      Null means the assigned public evidence did not disclose the metric; each
      null is paired with the management evidence needed to close the gap.
    claimRefs:
      - CI010
      - CI011
      - CI016
figures:
  - id: FI001
    title: Revenue model bridge from customer activity to billings
    type: flow
    summary: >-
      Public packaging supports a billing-mechanism bridge, while delivery costs
      and gross-profit conversion remain undisclosed.
    data:
      nodes:
        - id: customer-activity
          label: Customer activity
          detail: Contacts, campaigns, automations, and transactional events create usage.
          value: Usage origin
        - id: email-volume
          label: Email-send volume
          detail: Monthly email volume is the principal public subscription-pricing unit.
          value: Base billing driver
        - id: plan-tier
          label: Plan and feature tier
          detail: Starter, Standard, Professional, and Enterprise gate capacity and features.
          value: Subscription revenue
        - id: feature-add-ons
          label: Seats and feature add-ons
          detail: Branding removal, extra users, landing pages, and dedicated IP can add spend.
          value: Expansion revenue
        - id: channel-credits
          label: SMS and WhatsApp credits
          detail: Messaging channels are separately metered and country dependent.
          value: Usage revenue
        - id: gross-profit
          label: Revenue less delivery and service costs
          detail: Public evidence does not quantify carrier, infrastructure, support, or onboarding costs.
          value: Gross profit unavailable
    approximationNotes: >-
      Ordered mechanism only; node labels are not proportional values and do not
      quantify recognized revenue, gross margin, or conversion rates.
    claimRefs:
      - CI009
