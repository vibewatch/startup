      - User job
      - Current workflow
      - Brevo solution
      - Measurable public benefit
      - Limitation
    rows:
      - [Create a campaign, Assemble audience content and channel schedule, Segmentation plus campaign builders across supported channels, No independently verified outcome metric in assigned evidence, Results depend on list quality consent and plan]
      - [Respond to behavior, Monitor events and manually select follow-up, Trigger-rule-action automations with waits branches and messages, Reviews confirm multi-step workflow availability but not uplift, Advanced conditional depth is reported as weaker than specialist tools]
      - [Send service messages, Connect application events to a delivery provider, Transactional email and SMS through API or SMTP, Public sources describe real-time event-triggered delivery, Current latency and SLA evidence is not independently available]
      - [Coordinate WhatsApp outreach, Prepare approved templates consent and account setup, WhatsApp campaigns and automation actions, Channel is available inside the same workflow surface, Meta approval Business setup consent and plan eligibility remain dependencies]
      - [Hand engaged contacts to sales, Recreate campaign activity inside a CRM, Shared contact timeline selected sales actions and pipeline tools, Reduces the need for a separate initial connector, Complex forecasting territory and enterprise workflow depth is unproven]
    notes: >-
      Public sources describe functions rather than comparable customer outcomes; unavailable
      benefits are stated as gaps instead of estimated conversion or productivity gains.
    claimRefs: [CE002, CE003, CE004, CE007, CE008, CE010, CE011]
  - id: TE003
    title: Technology and operating architecture
    columns:
      - Layer
      - Role
      - Publicly evidenced component
      - Dependency
      - Principal risk
    rows:
      - [Identity and consent, Define who may receive which interaction, Contact attributes lists segments consent state and custom events, Accurate source data and lawful consent, Bad data propagates through every channel]
      - [Decisioning and automation, Convert events into actions, Triggers conditions waits branches scoring and webhooks, Correct event instrumentation and workflow testing, Complex logic may require workarounds]
      - [Campaign channels, Deliver outbound engagement, Email SMS WhatsApp chat and push surfaces, Carrier browser and Meta channel rules, Third-party approval and delivery constraints]
      - [Transactional delivery, Send order account and security messages, REST API SMTP relay templates and event webhooks, Application integration and sender authentication, Service failure can affect critical user messages]
      - [Sales and conversations, Route human follow-up, CRM pipelines meetings live chat and selected sales actions, Workflow ownership and support staffing, Basic tooling may not fit complex organizations]
      - [Analytics and controls, Measure outcomes and protect sending reputation, Engagement analytics authentication guidance bounce and complaint handling, Complete telemetry role design and current audits, Public evidence does not establish control effectiveness]
    notes: >-
      This is a functional stack reconstructed from public feature descriptions, not a claim
      about Brevo's internal infrastructure, data model, hosting topology, or control design.
    claimRefs: [CE002, CE004, CE005, CE007, CE009, CE012]
figures:
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Publicly evidenced layers show how customer data is converted into automated
      multichannel actions and measured feedback.
    data:
      layers:
        - label: Customer data and consent
          items: [Contacts, Attributes, Lists, Segments, Consent]
          detail: Inputs that define audience eligibility and personalization.
        - label: Events and decisioning
          items: [Behavioral events, Triggers, Conditions, Waits, Branches]
          detail: Logic that determines when a contact moves and what happens next.
        - label: Campaign orchestration
          items: [Email, SMS, WhatsApp, Chat, Push]
          detail: Outbound channels coordinated from a shared workflow surface.
        - label: Transactional services
          items: [REST API, SMTP relay, Templates, Webhooks]
          detail: Application-triggered messages and delivery-event feedback.
        - label: Sales and conversations
          items: [CRM pipeline, Tasks, Meetings, Live chat]
          detail: Human follow-up connected to engagement activity.
        - label: Analytics and optimization
          items: [Engagement metrics, Aura AI, Segmentation, Send-time optimization]
          detail: Signals used to refine audiences, content, and timing.
    approximationNotes: >-
      Functional reconstruction from assigned public sources; layer order does not represent
      Brevo's internal hosting topology or prove component performance.
    claimRefs: [CE002, CE004, CE005, CE006, CE007]
