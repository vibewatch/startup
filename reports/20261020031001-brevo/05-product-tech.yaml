      - [Conversations, Support and sales teams, Live chat chatbot and shared-inbox functions described in reviews, Conversation context tied to customer records, Support staffing quality and enterprise routing performance]
      - [Aura AI and data products, Marketing sales and data teams, AI personalization is live while broader data and loyalty capabilities skew to higher tiers, AI assistance embedded in campaign and sales workflows, Model governance accuracy adoption and measurable uplift]
    notes: >-
      Status reflects public product descriptions and third-party reviews as of 2026-10-20;
