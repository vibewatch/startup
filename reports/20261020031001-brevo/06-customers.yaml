  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention-and-concentration
      missingEvidence: >-
        Current NRR, GRR, logo and revenue churn, renewal rate, contract length, cohort retention,
        top-customer concentration, and channel concentration.
      whyItMatters: >-
        These metrics determine whether broad reported adoption converts into durable, diversified
        recurring revenue rather than a high-volume but fragile customer base.
      diligencePath: >-
        Request board-grade cohort schedules, customer and ARR bridges, renewal reports, contract
        vintages, and top-20 customer and channel concentration for 2024 through 2026.
      relatedQuestionRefs: [QU008]
    - type: enumeration-incomplete
      severity: material
      topic: named-customers
      missingEvidence: >-
        Customer-issued case studies, production status, deployment scope, contract duration, and
        measured outcomes for the five organizations named in the transaction announcement.
      whyItMatters: >-
        A company-issued logo list cannot distinguish active production deployments from limited,
        historical, pilot, or otherwise immaterial relationships.
      diligencePath: >-
        Obtain customer references and contracts, then confirm deployment status, modules used,
        volumes, tenure, renewal history, and attributable outcomes directly with each customer.
      relatedTableRefs: [TU003]
    - type: conflicting-data
      severity: material
      topic: customer-scale
      missingEvidence: >-
        A dated, definition-consistent active and paying customer count reconciling the December
        2025 more-than-600,000 figure with the April 2026 over-500,000 figure.
      whyItMatters: >-
        Without definitions and a reconciliation, the public figures cannot support a reliable
        adoption trend or distinguish rounding and publication lag from customer-base contraction.
      diligencePath: >-
        Request monthly active, paying, free, and total-account counts with a bridge for additions,
        churn, reactivations, acquisitions, and definitional changes from December 2025 onward.
      relatedQuestionRefs: [QU005]
