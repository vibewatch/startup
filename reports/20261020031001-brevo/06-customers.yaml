      - Buyer / payer
      - Primary use
      - Public scale signal
      - Strategic value
      - Evidence gap
    rows:
      - [SMBs, "Owner or marketing lead", "Affordable multichannel campaigns and CRM", "Described as the core audience; exact active count unavailable", "Product-led volume and broad reach", "No segment revenue, retention, or cohort disclosure"]
      - [Mid-market, "Marketing, sales, and operations teams", "Integrated automation, CRM, and customer data", "Company says segment revenue grows 2x the rest of the business", "Faster-growth expansion segment", "No customer count, ARR mix, or attach rate"]
      - [Nonprofits, "Fundraising or communications lead", "Campaigns and stakeholder engagement", "Included in the stated addressable base", "Broadens mission-driven use cases", "No nonprofit count, revenue, or outcome data"]
      - [International customers, "Regional marketing and sales teams", "Localized customer engagement", "Reported reach across 180 countries", "Diversified acquisition footprint", "Three countries still represented 65% of reported revenue"]
    notes: >-
      Segment descriptions combine company-issued positioning and secondary profiles; all missing
      segment counts, revenue shares, retention rates, and cohort metrics are shown as evidence gaps.
    claimRefs: [CU001, CU002, CU004, CU008, CU010, CU012]
  - id: TU002
    title: Customer growth and adoption signals
    columns:
      - Metric
      - Reported value
      - Period
      - Issuer
      - Confidence
      - Implication
      - Missing denominator or qualifier
    rows:
      - ["Customer count", "More than 600,000 clients", "December 2025", "Brevo / transaction partners", Medium, "Large reported installed base", "Definition of client and active/paid mix not disclosed"]
      - ["Customer count", "Over 500,000 customers", "April 2026", "Automation Atlas", Low, "Independent directional scale signal", "Secondary source; conflicts with earlier higher figure"]
      - ["Geographic reach", "180 countries", "April 2026", "Automation Atlas", Medium, "Broad global availability", "Customers and revenue by country not disclosed"]
      - ["OMR review footprint", "4.5/5 from 430 reviews", "As of 2026", "Grokipedia summary of OMR", Low, "Meaningful public review sample", "Not a customer census or retention measure"]
    notes: >-
      Values are reproduced with their original periods and issuers; the two customer-count figures
      are not treated as a time series because definitions, update timing, and denominators differ.
    claimRefs: [CU003, CU004, CU013, CU014]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer
      - Segment
      - Deployment / use case
      - Production vs. pilot
      - Reported outcome
      - Limitation
    rows:
      - [eBay, "Large enterprise / marketplace", "Not disclosed", "Not disclosed", "Listed as trusting Brevo's reliability", "No customer-issued confirmation or measured outcome"]
      - ["H&M", "Large enterprise / retail", "Not disclosed", "Not disclosed", "Listed as trusting Brevo's reliability", "No customer-issued confirmation or measured outcome"]
      - ["Louis Vuitton", "Large enterprise / luxury retail", "Not disclosed", "Not disclosed", "Listed as trusting Brevo's reliability", "No customer-issued confirmation or measured outcome"]
      - [Carrefour, "Large enterprise / grocery retail", "Not disclosed", "Not disclosed", "Listed as trusting Brevo's reliability", "No customer-issued confirmation or measured outcome"]
      - [Michelin, "Large enterprise / manufacturing", "Not disclosed", "Not disclosed", "Listed as trusting Brevo's reliability", "No customer-issued confirmation or measured outcome"]
    notes: >-
      This is a partial enumeration limited to names in a December 2025 company/partner release;
      logo inclusion does not establish active production use, contract value, retention, or outcomes.
    enumerationScope:
      coverage: sample
      basis: "Named organizations in the assigned December 2025 transaction announcement only."
    claimRefs: [CU003, CU005, CU006]
figures:
  - id: FU001
    title: Evidence-backed customer adoption and expansion journey
    type: journey-map
    summary: >-
      Public evidence shows a plausible path from accessible entry to multichannel and CRM
      expansion, while the retention stage remains unmeasured.
    data:
      nodes:
        - id: accessible-entry
          label: Accessible entry
          detail: "Volume-based pricing and low entry tiers reduce initial commitment for contact-rich organizations."
        - id: campaign-activation
          label: Campaign activation
          detail: "Customers begin with email campaigns, content creation, and basic analytics."
        - id: channel-expansion
          label: Channel expansion
          detail: "SMS, WhatsApp, push, live chat, and chatbot add engagement surfaces."
        - id: automation
          label: Journey automation
          detail: "Automation, landing pages, segmentation, and analytics deepen workflow adoption."
        - id: crm-expansion
          label: CRM expansion
          detail: "Sales CRM is described by the company as a growth driver, especially in the mid-market."
        - id: durability-proof
          label: Durability proof
          detail: "NRR, GRR, churn, renewal, attach-rate, and concentration evidence is not publicly quantified."
    approximationNotes: >-
      Ordered stages describe a supported adoption hypothesis, not measured conversion rates or a
      common cohort; no stage widths, timing, or customer counts are inferred.
    claimRefs: [CU007, CU009, CU011, CU012]
callouts:
  - calloutType: risk
    title: Scale is better evidenced than durability
    body: >-
      Broad reported adoption and named logos do not substitute for cohort retention, contract,
      concentration, or customer-verified outcome data. Underwriting should treat expansion as a
      company-reported signal until those operating metrics are provided.
    claimRefs: [CU003, CU006, CU010, CU011, CU013]
