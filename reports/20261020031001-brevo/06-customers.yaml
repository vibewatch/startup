schemaVersion: "report-v2"
artifact: customers
slug: brevo
runDate: 2026-10-20
company:
  name: Brevo
chapter:
  number: 6
  title: Customers
  summary: >-
    Brevo has broad reported adoption across SMB and mid-market customers, but the strongest
    current scale and expansion figures are company-issued. Named logos and secondary review
    signals establish awareness, while retention, concentration, cohort, and customer-verified
    outcome data remain material diligence gaps.
sections:
  - id: customer-base-and-segments
    title: Customer base and segment mix
    body: >-
      Public evidence consistently positions Brevo around cost-conscious small and midsize
      businesses, while company-issued material broadens the addressable audience to nonprofits
      and highlights faster growth in the mid-market. Independent profiles describe affordability
      and ease of use as central to the SMB proposition, and Brevo's volume-based pricing can be
      attractive to organizations with large contact lists but moderate send frequency. The
      company and its transaction partners reported more than 600,000 clients in December 2025,
      while two 2026 secondary profiles still used an over-500,000 figure. These figures are not
      necessarily comparable: they may reflect publication lag, rounding, or different definitions.
      The evidence therefore supports global scale and a broad SMB-to-mid-market range, but not a
      precise current active-customer denominator or revenue mix by customer size.
    claimRefs: [CU001, CU002, CU003, CU004, CU005, CU010, CU012, CU013]
    tableRefs: [TU001]
  - id: adoption-and-customer-proof
    title: Adoption trajectory and named-customer proof
    body: >-
      Brevo's transaction announcement names eBay, H&M, Louis Vuitton, Carrefour, and Michelin,
      but this is company-issued proof: the assigned evidence does not establish contract scope,
      production status, deployment breadth, duration, or measured customer outcomes for any logo.
      Scale evidence is similarly directional rather than fully reconciled. The December 2025
      announcement reported more than 600,000 clients, whereas an April 2026 profile reported over
      500,000 customers across 180 countries. A secondary summary of OMR reviews adds a different
      adoption signal: 430 reviews and a 4.5-of-5 rating as of 2026. That review count indicates a
      meaningful user-feedback footprint, but it is not a customer census and cannot establish
      retention. These distinctions make the broad adoption case credible while keeping the
      evidence quality below customer-verified production proof.
    claimRefs: [CU003, CU004, CU005, CU006, CU013, CU014]
    tableRefs: [TU002, TU003]
  - id: durability-expansion-and-risk
    title: Durability, expansion, and concentration risk
    body: >-
      The public expansion narrative rests on cross-channel activation and movement into Sales CRM
      and the mid-market. Brevo's official product page presents email, SMS, WhatsApp, push, live
      chat, chatbot, automation, and analytics in one marketing surface. The December 2025
      transaction release describes Sales CRM as a growth driver, says mid-market revenue was
      growing twice as fast as the rest of the business, and reports that the United States
      generated 24% of new revenue. Those are useful land-and-expand signals, but they are
      company-issued and lack attach rates, cohort data, or customer-level validation. Independent
      summaries also flag occasional performance, template, free-tier, pricing, and basic-sales-tool
      limitations. Without NRR, GRR, churn, renewal, contract-length, top-customer, or channel
      concentration data, durability and concentration remain unquantified rather than proven.
    claimRefs: [CU007, CU008, CU009, CU010, CU011, CU012, CU014, CU015, CU016]
    figureRefs: [FU001]
tables:
  - id: TU001
    title: Customer segmentation and commercial relevance
    columns:
