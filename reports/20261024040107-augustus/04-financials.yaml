artifact: financials
slug: augustus
runDate: 2026-10-24
company:
  name: Augustus
chapter:
  number: 4
  title: Financials
  summary: Augustus has raised substantial holding-company capital, but public evidence still describes a payments business and a bank in formation rather than an operating US bank with disclosed revenue, margin, deposits, or cash runway. The underwriting case therefore depends on completing conditional charter requirements and converting institutional payment demand into transparent bank economics.
sections:
  - id: revenue-model-and-traction
    title: Revenue model and observable traction
    body: >-
      Augustus is transitioning from Ivy's European account-to-account payments activity toward a proposed US wholesale bank and API-led dollar infrastructure. Public descriptions identify institutional fintechs, digital-asset firms, and international financial institutions as the target users; the proposed product combines dollar accounts, ACH, wires, and stablecoin-related rails. American Banker reports that the company already processes transactions for enterprise customers such as Kraken, while Startup Fortune describes euro payments in Europe and a proposed one-API route to dollar accounts and payment rails. These are evidence of a target market and operating foundation, not proof of current US-bank revenue. Insights4 reports that Augustus says it processes billions of euros annually and grew tenfold in 2025, but also states that precise volume, revenue, customer count, deposits, gross margin, and concentration have not been disclosed. Consequently, revenue quality cannot yet be assessed from public data: payment volume is not revenue, the announced valuation is not ARR, and the proposed bank's future interest, payment, FX, treasury, lending, or account fees remain unreported.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001]
  - id: pricing-costs-and-unit-economics
    title: Pricing, cost structure, and unit-economics visibility
    body: >-
      No public list-price schedule or realized pricing is available in the assigned evidence. The monetization mechanism is inferable only at a high level: transaction and account services for institutional customers, with possible payment, foreign-exchange, treasury, lending, and interest income if the bank opens. Official or independent evidence does not disclose take rates, minimums, discounts, payment costs, sponsor-bank fees, fraud losses, servicing costs, gross margin, CAC, sales cycle, payback, or customer concentration. The cost base is likely to expand materially because the proposed bank must meet capital, governance, systems, cybersecurity, BSA/AML, sanctions, audit, deposit-insurance, and Federal Reserve requirements; however, no public burn or operating-expense schedule quantifies that burden. The correct underwriting posture is to treat all unit-economics cells as unavailable and request customer-level contribution margins, processor and correspondent costs, compliance staffing costs, and cohort retention before modeling payback or margin expansion.
    claimRefs: [CI005, CI006, CI007, CI008]
    tableRefs: [TI002]
  - id: capital-adequacy-and-financial-verdict
    title: Capital adequacy and financial verdict
    body: >-
      Augustus announced a $180 million Series B at a $1 billion valuation on July 21, 2026, and Startup Fortune reports total capital raised of $210 million since the 2022 founding. Those figures describe financing at the holding-company level; they do not establish how much cash is available to the proposed bank, how much is primary versus secondary, or how much has been contributed as regulatory capital. Insights4 reports that the OCC decision requires at least $52.5 million of initial paid-in capital, a minimum 10% Tier 1 leverage ratio during the first three years, independent audit, approved senior executives, tested cybersecurity, working BSA and sanctions systems, FDIC deposit insurance, and Federal Reserve requirements. DWT likewise states that conditional approval does not permit operations until pre-opening requirements, Federal Reserve stock, and FDIC insurance conditions are satisfied. The financing provides capacity to pursue those milestones, but the public record does not disclose monthly burn, runway, debt, working capital, or a next-round trigger. Financially, the strongest current signal is funded regulatory execution; the central blocker is the absence of operating financial statements and bank-opening evidence.
    claimRefs: [CI009, CI010, CI011, CI012, CI013]
    tableRefs: [TI003]
    figureRefs: [FI001]
tables:
  - id: TI001
    title: Revenue streams and evidence quality
    columns: [Stream, Mechanism, Unit or basis, Current public status, Quality, Diligence ask]
    rows:
      - [European payments, "Account-to-account payments and euro settlement through the predecessor/payment-institution activity", "Payment volume; revenue not disclosed", "Operating foundation described; precise revenue unavailable", "Company/press-reported activity, not audited revenue", "Obtain monthly revenue by product, customer, geography, and recognized accounting basis"]
      - [US dollar accounts and clearing, "Proposed institutional accounts, ACH, wires, and continuous clearing through Augustus National Bank", "Account, payment, FX, or treasury fees", "Conditional charter only; bank cannot operate until conditions are met", "Proposed, not current operating revenue", "Confirm opening date, regulated provider, production volumes, and customer contracts"]
      - [Stablecoin-related services, "Planned custody, conversion, payments, or issuance subsidiary", "Reserve-backed stablecoin and settlement fees", "Application and regulatory framework remain incomplete", "Roadmap/business-plan claim", "Obtain filed applications, approvals, economics, and balance-sheet treatment"]
      - [Lending and interest income, "Potential bank lending and balance-sheet activities after opening", "Net interest income and credit losses", "No disclosed lending book or production activity", "Unavailable", "Provide underwriting policy, funding source, yield, losses, and liquidity limits"]
    notes: "Sources describe proposed and existing mechanisms but do not provide audited revenue; null or unavailable values mean no public evidence was found in the assigned sources, not zero activity."
    claimRefs: [CI001, CI002, CI003, CI004]
  - id: TI002
    title: Pricing and monetization visibility
    columns: [Metric, Public value, Status, Why it matters, Diligence ask]
    rows:
      - [Transaction take rate, null, "Not disclosed", "Determines gross revenue per payment dollar", "Provide realized pricing by rail, customer tier, geography, and volume band"]
      - [Account or platform fee, null, "Not disclosed", "Tests recurring versus usage-based revenue quality", "Provide contracts, minimums, implementation fees, and renewal terms"]
      - [FX spread or fee, null, "Not disclosed", "Could be a material monetization stream for cross-border customers", "Provide quoted versus realized spreads and hedging/correspondent costs"]
      - [CAC and sales payback, null, "Not disclosed", "Needed to evaluate whether institutional distribution scales economically", "Provide funnel, sales-cycle, CAC, gross-margin payback, and cohort retention"]
      - [Gross margin, null, "Not disclosed", "Separates payment volume growth from profitable economics", "Provide product-level gross margin including banking, compliance, fraud, and infrastructure costs"]
    notes: "Public sources identify products and target customers but provide no price list, realized take rate, discount schedule, CAC, payback, or margin; null denotes an underwriting gap rather than a measured zero."
    claimRefs: [CI005, CI006, CI007, CI008]
  - id: TI003
    title: Capital adequacy and operating-finance checklist
    columns: [Input, Public evidence, Financial interpretation, Confidence, Diligence ask]
    rows:
      - [Series B, "$180M at $1B valuation on July 21, 2026", "Financing capacity and valuation signal; not revenue, ARR, or cash available", "Medium", "Reconcile primary/secondary proceeds and cash remaining"]
      - [Total capital raised, "$210M since 2022 reported by Startup Fortune", "Holding-company funding history; regulatory capital contribution unknown", "Medium", "Provide cap table, use of proceeds, and bank capitalization plan"]
      - [Initial paid-in capital requirement, "$52.5M reported for the proposed bank", "Minimum regulatory capital condition, not evidence of runway", "Medium", "Confirm amount funded, entity, restrictions, and supervisor acceptance"]
      - [Tier 1 leverage condition, "Minimum 10% during first three years reported by Insights4", "Constrains balance-sheet growth and capital deployment", "Medium", "Provide pro forma balance sheet and stress scenarios"]
      - [FDIC and Federal Reserve conditions, "Required before operations according to DWT", "Opening and revenue realization remain execution-dependent", "High", "Provide filing status, outstanding conditions, and target opening date"]
      - [Burn and runway, null, "Cannot determine capital adequacy beyond disclosed raise and conditions", "Low", "Provide monthly burn, runway, hiring plan, and next-round trigger"]
    notes: "Financing and regulatory figures retain their stated periods and denominators; holding-company funding is not treated as bank capital or cash available, and missing burn/runway data remain explicit gaps."
    claimRefs: [CI009, CI010, CI011, CI012, CI013]
