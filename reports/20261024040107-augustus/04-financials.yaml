    title: From institutional payment activity to potential bank economics
    type: flow
    summary: Public evidence supports a transition path from European payment activity to proposed institutional dollar banking, but the final revenue and gross-profit stages remain unverified.
    data:
      nodes:
        - id: n1
          label: European payment activity
          value: "Operating foundation"
          note: "Precise revenue and volume undisclosed"
        - id: n2
          label: Institutional customers
          value: "Fintechs and digital-asset firms"
          note: "Kraken is reported as an enterprise customer"
        - id: n3
          label: Dollar accounts and clearing
          value: "Proposed"
          note: "Conditional charter; not yet authorized to operate"
        - id: n4
          label: Payment, FX, and treasury fees
          value: "Potential"
          note: "No public pricing or realized revenue"
        - id: n5
          label: Lending and interest income
          value: "Potential"
          note: "No disclosed lending book"
        - id: n6
          label: Gross profit and runway
          value: "Unavailable"
          note: "No public margin, burn, or runway"
      edges:
        - from: n1
          to: n2
        - from: n2
          to: n3
        - from: n3
          to: n4
        - from: n3
          to: n5
        - from: n4
          to: n6
        - from: n5
          to: n6
    approximationNotes: "This is an evidence-backed operating-model bridge, not a forecast or proportional waterfall; proposed and unavailable stages are labeled rather than quantified."
    claimRefs: [CI001, CI002, CI004, CI006, CI013]
callouts:
  - calloutType: strength
    title: Funded path to regulatory execution
    body: >-
      The announced financing and reported regulatory-capital conditions indicate resources to pursue bank formation, but the amount actually available to the bank remains unverified.
    claimRefs: [CI009, CI010, CI011]
  - calloutType: risk
    title: Revenue quality is not yet underwritable
    body: >-
      Public reporting does not disclose recognized revenue, gross margin, customer concentration, pricing, burn, or runway, and the proposed US bank is not yet operating.
    claimRefs: [CI003, CI005, CI007, CI012]
