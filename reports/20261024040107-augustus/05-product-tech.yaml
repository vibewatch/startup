callouts:
  - calloutType: insight
    title: Live foundation, pending US product
    body: The Finnish payment-institution rail is the clearest delivered capability; the proposed US clearing bank should be treated as a regulated build-out until final approval and production evidence exist.
    claimRefs: [CE001, CE003, CE004]
  - calloutType: risk
    title: AI-native remains an unverified performance claim
    body: Public materials describe intended machine-assisted controls, but no independent evidence establishes model accuracy, auditability, resilience, or cost at production volume.
    claimRefs: [CE011, CE012, CE015]
  - calloutType: recommendation
    title: Diligence the control plane
    body: Request the bank's architecture, reconciled ledger controls, uptime and recovery tests, model inventory, override metrics, penetration testing, and evidence that the proposed US workflows operate outside a demo or partner arrangement.
    claimRefs: [CE015, CE016, CE011, CE014]
