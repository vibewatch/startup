artifact: product-tech
slug: augustus
runDate: 2026-10-24
company:
  name: Augustus
chapter:
  number: 5
  title: Product & Technology
  summary: Augustus is moving from a live Finnish payment-institution business toward a regulated US wholesale-clearing platform whose proposed architecture combines operating accounts, traditional payment rails, stablecoin connectivity, and machine-assisted controls. The public record supports the product direction and early European operation, but not production US-bank capabilities, technical performance, or independently verified AI and security maturity.
sections:
  - id: delivered-product
    title: What is delivered today
    body: >-
      Augustus currently has the strongest public product evidence in its European payment-institution operation. The company describes euro clearing for global financial institutions and processing at billion-scale, while independent coverage identifies Kraken as a customer and distinguishes that live activity from the proposed US dollar bank. The planned US product is an institutional, branchless clearing platform rather than a consumer bank: operating and virtual accounts, ACH, wires, stablecoin connectivity, and programmable settlement are the intended workflow. However, conditional approval does not permit the proposed bank to accept deposits, clear dollars, or open for business, so the US workflow remains a pre-launch capability rather than a delivered product.
    claimRefs: [CE001, CE002, CE003, CE004]
    tableRefs: [TE001]
  - id: product-map
    title: Product modules and operating model
    body: >-
      The product map has two maturity layers. The live layer is a regulated Finnish payment institution supporting euro payment and settlement activity; the proposed layer is Augustus Bank, N.A., designed to add US dollar capabilities under a full-service national-bank structure. Public descriptions also identify Marble as an internally built banking platform and describe API surfaces for operating accounts, FBO accounts, named virtual accounts, and digital-asset wallets. Those descriptions establish intended modules, not a verified production architecture. The charter application and public commentary indicate that capital, governance, systems, cybersecurity, BSA/AML, and deposit-insurance or Federal Reserve conditions remain part of the deployment path.
    claimRefs: [CE005, CE006, CE007, CE008, CE009]
    tableRefs: [TE002]
    figureRefs: [FE001]
  - id: differentiation-and-dependencies
    title: Differentiation, controls, and dependencies
    body: >-
      Augustus's differentiation thesis is control of the regulated account and settlement layer, not merely a better payment interface. Its stated design combines traditional rails and stablecoin networks through an API-first, always-on workflow, while its AI-native framing includes machine-assisted alert triage, sanctions research, KYC review, reconciliation, investigations, and reporting with humans retaining final authority. This is strategically coherent but remains an empirical claim: no public uptime, latency, recovery, penetration-test, model-error, unit-cost, or production-volume results were found. The principal dependencies are final OCC approval, FDIC insurance, Federal Reserve requirements, bank-grade controls, stablecoin rules, sponsor or network access, and liquidity and compliance operations.
    claimRefs: [CE010, CE011, CE012, CE013, CE014]
    tableRefs: [TE003]
  - id: maturity-and-risk-verdict
    title: Maturity and diligence verdict
    body: >-
      Product maturity is therefore asymmetric. Augustus has a credible operating base in European payments and a meaningful regulatory milestone, but the proposed US bank and its differentiating control stack are not yet evidenced as a production system. The absence of a public repository, public technical architecture, independent security assessment, reliability history, or agent-performance benchmark limits confidence in scalability and safety. Stripe's current Treasury product demonstrates that multicurrency accounts, stablecoin payouts, APIs, and bounded agent workflows are already available through an established platform, which raises the bar for Augustus to prove that owning a bank creates superior reliability, economics, or access. Diligence should prioritize production evidence rather than product nomenclature.
    claimRefs: [CE015, CE016, CE011, CE014]
    figureRefs: []
tables:
  - id: TE001
    title: Product module / asset matrix
    columns: [Module or asset, Primary user, Status or maturity, Differentiation, Diligence gap]
    rows:
      - ["Finnish payment-institution rail", "Global financial institutions", "Operating", "Regulated euro payment and settlement base", "Exact volumes, revenue, and customer concentration are undisclosed"]
      - ["US national-bank charter", "Institutional fintechs and payment firms", "Conditional approval", "Potential direct US-dollar account and clearing control", "Final approval, FDIC insurance, and Federal Reserve conditions remain open"]
      - ["Operating and virtual accounts", "Institutional API customers", "Proposed / documentation surface", "One API for account and payment workflows", "Production provider, geography, and volume are not publicly established"]
      - ["Marble banking platform", "Bank and API customers", "Company-described internal platform", "Intended ledger, payments, and agentic primitives", "No public architecture, audit, uptime, or recovery evidence"]
      - ["Stablecoin connectivity", "Stablecoin issuers and fintechs", "Proposed / policy-dependent", "Fiat and blockchain settlement in one workflow", "Issuance-versus-infrastructure strategy remains unresolved"]
    notes: >-
      Status separates live European activity from proposed or documented US capabilities. Product descriptions are company or third-party reported; null-like gaps identify diligence requests rather than negative proof.
    claimRefs: [CE001, CE005, CE006, CE007, CE008]
  - id: TE002
    title: Workflow / use-case table
    columns: [User job, Current workflow, Augustus solution, Measurable benefit, Limitation]
    rows:
      - ["Move institutional euros", "European payment-institution processing", "Euro clearing through the Finnish entity", "Billion-scale processing is reported", "Exact denominator and fee economics are unavailable"]
      - ["Access US dollars", "Sponsor or correspondent-bank relationships", "Proposed US bank accounts and clearing rails", "Potential fewer intermediaries and more control", "Bank has not opened and no production dollar volume is established"]
      - ["Reconcile fiat and stablecoins", "Separate banking and blockchain providers", "One API connecting traditional and stablecoin rails", "Intended fewer handoffs and programmable settlement", "Settlement, redemption, and compliance dependencies remain"]
      - ["Automate compliance operations", "Human and rules-based review workflows", "Machine-assisted triage, KYC, sanctions, investigations, and reporting", "Potential lower manual workload", "Error rates, overrides, and audit evidence are not public"]
      - ["Run machine-to-machine payments", "Existing APIs and permissions", "Agent-oriented programmable workflows", "Intended continuous authorization and execution", "Current agent customer traction and production benchmarks are undisclosed"]
    notes: >-
      This table distinguishes current operating evidence from proposed workflows. Benefits are stated as intended or potential where the sources do not provide a measured comparison.
    claimRefs: [CE001, CE002, CE010, CE011, CE012]
  - id: TE003
    title: Technology / operating architecture table
    columns: [Layer or process, Role, Dependency, Risk]
    rows:
      - ["Customer API", "Expose accounts, payments, and programmable instructions", "Bank and payment-network access", "API availability and production scope are not independently verified"]
      - ["Account and ledger layer", "Maintain operating, FBO, and virtual-account balances", "Regulated entity, banking partners, and reconciliation controls", "Double-entry integrity and recovery evidence are unpublished"]
      - ["Payment rails", "Route ACH, wires, SEPA, SWIFT, and stablecoin transfers", "Network permissions and liquidity", "Cut-off, settlement, and exception behavior may vary by rail"]
      - ["AI and rules controls", "Triage alerts and support KYC, sanctions, investigations, and reporting", "Human governance and model-risk controls", "False-positive and false-negative rates are unknown"]
      - ["Bank governance and compliance", "Operate BSA/AML, sanctions, cybersecurity, and audit controls", "OCC, FDIC, Federal Reserve, and applicable stablecoin rules", "Pre-opening conditions and implementation status are incomplete"]
      - ["Liquidity and settlement operations", "Fund and reconcile continuous institutional flows", "Correspondent, central-bank, and stablecoin counterparties", "Concentration, redemption, and off-hours liquidity risks are unquantified"]
    notes: >-
      Architecture is reconstructed from public product and regulatory descriptions, not a supplied technical diagram. Dependencies and risks are explicit because public evidence does not establish production readiness.
    claimRefs: [CE006, CE009, CE010, CE013, CE014]
