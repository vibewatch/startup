  evidenceGaps:
    - type: missing-source
      severity: material
      topic: technical-maturity
      missingEvidence: Independent architecture documentation, reconciled ledger controls, uptime and recovery testing, penetration testing, model inventory, and error or override rates.
      whyItMatters: These measurements determine whether Marble and the AI-native control claims are production-grade rather than design intent.
      diligencePath: Request architecture and control documentation, audit reports, test results, incident history, and production metrics under NDA.
      relatedQuestionRefs: [QE004, QE006, QE008]
    - type: stale
      severity: material
      topic: regulatory-maturity
      missingEvidence: Current status of OCC pre-opening conditions, FDIC deposit insurance, Federal Reserve requirements, and any final charter decision as of the report date.
      whyItMatters: The US product cannot be underwritten as delivered while the bank remains conditional.
      diligencePath: Obtain the latest regulatory correspondence and management certification of each pre-opening milestone.
      relatedQuestionRefs: [QE005, QE009]
    - type: conflicting-data
      severity: material
      topic: stablecoin-strategy
      missingEvidence: A reconciled statement of whether Augustus intends to issue stablecoins, provide infrastructure only, or support both through separate entities.
      whyItMatters: Issuance, reserve management, custody, and conversion create different regulatory, liquidity, and revenue exposures.
      diligencePath: Request the current board-approved product plan and reconcile it to the OCC-approved business plan.
      relatedQuestionRefs: [QE003]
    - type: private-evidence-only
      severity: material
      topic: operating-product
      missingEvidence: Production customer, transaction, revenue, reliability, and settlement data for the US dollar product.
      whyItMatters: Public materials do not establish US-bank adoption, economics, or service quality.
      diligencePath: Request customer references, transaction-level cohorts, revenue by product, and independent service-level reports.
      relatedQuestionRefs: [QE001, QE006, QE009]
