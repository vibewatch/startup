      topic: disclosure
      missingEvidence: Audited or otherwise verifiable revenue, margin, customer concentration, cash runway, and use-of-proceeds data.
      whyItMatters: Without these denominators, the $1 billion financing mark cannot be translated into a risk-adjusted operating valuation.
      diligencePath: Request management financials, cohort and concentration schedules, cash forecast, and financing term sheet under diligence access.
      relatedQuestionRefs: [QV006, QV008]
    - type: missing-source
      severity: material
      topic: regulatory-risk
      missingEvidence: Current FDIC deposit-insurance status, Federal Reserve process, and OCC pre-opening milestone schedule.
      whyItMatters: The principal upside depends on a conditional approval becoming an operating national bank.
      diligencePath: Obtain written regulator-status updates and the complete conditions schedule from management and counsel.
      relatedQuestionRefs: [QV001, QV005, QV008]
    - type: missing-source
      severity: material
      topic: technology
      missingEvidence: Independent security, resilience, compliance-control, and production-performance evidence for Marble and dollar products.
      whyItMatters: Product claims cannot support a premium valuation without proof that controls and economics scale in production.
