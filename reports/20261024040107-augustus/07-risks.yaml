      - ["AI or machine-initiated transaction control failure", "Medium", "High", "Concept and architecture described; independent validation not retained", "High", "No model accuracy, override, audit-log, or exception data"]
      - ["Sanctions, fraud, or reconciliation failure", "Medium", "Critical", "Compliance is positioned as a product feature; operating evidence absent", "High", "Need policies, testing, false-positive rates, and incidents"]
      - ["Availability, cyber, or settlement outage", "Medium", "High", "Always-on target described; historical reliability evidence absent", "High", "Need uptime, incident, recovery, and customer-impact records"]
    notes: "Risk ratings are evidence-bounded judgments from the assigned sources; no retained source supplies incident, uptime, model-validation, or security-audit measurements."
    claimRefs: [CR005, CR006, CR007, CR008]
  - id: TR003
    title: Partner / dependency risk register
    columns: [Dependency, Counterparty, Role, Concentration, Failure scenario, Severity, Mitigation, Residual exposure]
    rows:
      - ["US charter completion", "OCC", "National-bank authorization and supervision", "Single regulator dependency", "Conditions are delayed or not satisfied", "Critical", "Regulatory-experienced leadership and staged organization", "High"]
      - ["Deposit insurance", "FDIC", "Deposit-insurance approval and supervision", "Single regulator dependency", "Insurance is delayed, conditioned, or denied", "Critical", "Formal application process", "High"]
      - ["Payment-system access", "Federal Reserve", "Potential direct access to US payment infrastructure", "Single infrastructure dependency", "Access is delayed or unavailable", "High", "Continue European operations while pursuing US capability", "High"]
      - ["Institutional customer volume", "Kraken and other unnamed institutions", "Production payment and clearing demand", "Concentration unknown", "Customer exits or volumes fail to scale", "High", "Diversify global financial-institution customer base", "High"]
    notes: "Counterparty names and roles are included only where the assigned fetched text names them; concentration, contract terms, and renewal protections are not disclosed."
    claimRefs: [CR009, CR010, CR011, CR012]
