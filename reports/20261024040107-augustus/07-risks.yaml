callouts:
  - calloutType: risk
    title: Conditional approval is not operating readiness
    body: "The OCC milestone is strategically important, but the assigned evidence does not establish completion of pre-opening conditions, FDIC insurance, or Federal Reserve payment access."
    claimRefs: [CR001, CR002, CR003]
  - calloutType: recommendation
    title: Gate investment on documentary controls
    body: "Require regulator-status documents, independent control testing, customer concentration evidence, and a cash-runway model before treating the charter as a de-risked moat."
    claimRefs: [CR006, CR010, CR012]
