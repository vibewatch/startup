schemaVersion: "report-v2"
artifact: risks
slug: augustus
runDate: 2026-10-24
company:
  name: Augustus
chapter:
  number: 7
  title: Risks
  summary: Augustus has a meaningful regulatory and infrastructure opportunity, but its US bank remains conditional and its operating, compliance, financial, and dependency controls are not publicly evidenced at the depth required for a de-risked investment decision.
sections:
  - id: regulatory-legal
    title: Regulatory and legal exposure
    body: >-
      The central risk is not whether Augustus has received regulatory attention; it is whether the
      conditional charter can be converted into a fully operating US bank. Banking Dive reports that
      the OCC granted conditional approval, while the private-law reference describes the bank as
      still in organization and says the full charter has not been finalised. The company-facing
      release says the charter is for a full-service national bank, but it does not enumerate the
      pre-opening conditions, deposit-insurance status, or Federal Reserve access. That creates a
      binary execution dependency: the product's planned USD clearing capability is not equivalent
      to a live, fully licensed service. The FDIC's application page confirms that deposit insurance
      applications involve formal resources, filings, processing, and decisions; it does not confirm
      Augustus's own application status. Until those artifacts are produced, regulatory completion
      should be treated as an unresolved condition rather than a completed asset.
    claimRefs: [CR001, CR002, CR003, CR004]
    tableRefs: [TR001]
  - id: operating-security
    title: Operational, technology, and control risk
    body: >-
      Augustus is proposing to replace correspondent-banking workflows with an AI- and
      stablecoin-native core. The opportunity increases the control surface: durable
      machine-initiated workflows, sanctions screening, reconciliation, fraud controls, cyber
      resilience, and incident response all become bank-grade requirements. Independent research
      found no public technical architecture, ledger audit, availability record, security
      assessment, or reconciliation benchmark and reported that 2026 recruiting materials still
      assigned new hires responsibility for building core financial-crime workflows. The OCC
      handbook is a supervisory reference for examiner work and explicitly says each bank differs,
      so it is a useful governance benchmark rather than proof that Augustus meets it. A failed
      control could stop onboarding, trigger remediation, or undermine the economics of the
      network even if demand is strong.
    claimRefs: [CR005, CR006, CR007, CR008]
    tableRefs: [TR002]
  - id: dependencies-financial
    title: Dependency, partner, and financial-model risk
    body: >-
      Augustus's model depends on a small set of high-consequence approvals, payment access,
      institutional counterparties, and sufficient capital to complete bank formation before the
      commercial model is proven. Secondary coverage names Kraken as an institutional client and
      describes EUR clearing through European entities, but no retained source supplies contract
      duration, volume, concentration, renewal, or exit terms. The financing announcement describes
      a $180 million Series B at a $1 billion valuation, while independent research notes that
      holding-company proceeds do not become bank regulatory capital until contributed in an
      accepted form. Neither funding raised nor valuation establishes cash runway, burn, margin, or
      the amount reserved for regulatory build-out. Capital can fund the process, but cannot
      guarantee approval, customer retention, or operating reliability. Monitoring should focus on
      charter milestones, FDIC and Federal Reserve status, independent control evidence, customer
      concentration, and cash runway.
    claimRefs: [CR009, CR010, CR011, CR012]
    tableRefs: [TR003]
  - id: investment-triggers
    title: Thesis-break triggers and diligence priorities
    body: >-
      The risk thesis changes materially if Augustus receives full operating approval and
      independently demonstrates safe, reliable settlement at production scale. Conversely, a
      prolonged organization phase, a denied or delayed deposit-insurance or payment-access
      application, an unresolved control deficiency, a material outage or security incident, or a
      loss of a critical institutional customer would weaken the investment case. The highest-value
      diligence is therefore documentary rather than promotional: obtain the OCC conditions and
      completion schedule, verify FDIC and Federal Reserve applications, review independent security
      and compliance testing, inspect concentration and renewal data, and reconcile the financing
      proceeds to a 24-month operating plan. These are measurable gates, not assumptions about
      management intent.
    claimRefs: [CR002, CR006, CR010, CR012]
    figureRefs: [FR001]
