    title: Customer journey from institutional need to expansion
    type: journey-map
    summary: The evidence supports a proposed institutional journey from dollar-access pain to multi-rail settlement, while production conversion and retention remain unverified.
    data:
      nodes:
        - id: segment
          label: International fintech or bank
          title: International fintech or bank
          detail: Institutional buyer seeking dollar access and cross-border settlement.
        - id: need
          label: Dollar-access friction
          title: Dollar-access friction
          detail: Correspondent-bank layers, operating windows, and settlement delays are the stated problem.
        - id: adoption
          label: Account and rail integration
          title: Account and rail integration
          detail: Company describes operating and FBO accounts, named virtual accounts, and SWIFT, ACH, SEPA, and stablecoins.
        - id: named-use
          label: Kraken relationship
          title: Kraken relationship
          detail: Company materials say Augustus is processing billions for Kraken today.
        - id: expansion
          label: Multi-rail and regional expansion
          title: Multi-rail and regional expansion
          detail: Stated target regions include Latin America, Southeast Asia, the Middle East, and Africa.
        - id: proof-gap
          label: Retention proof required
          title: Retention proof required
          detail: Contracts, production scope, renewal, concentration, and customer outcomes are not disclosed.
    claimRefs: [CU001, CU003, CU007, CU009, CU010]
