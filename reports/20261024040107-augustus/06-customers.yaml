      - [Global financial institutions, "Institutional payments and clearing teams", "Always-on programmable clearing of major Western currencies", "Company states the platform is designed for this segment", "No independent deployment or throughput evidence"]
      - [Digital-asset businesses, "Exchange or stablecoin operations teams", "Bank funding, euro settlement, dollar access, and stablecoin connectivity", "Kraken is named as a current relationship", "Contract status, duration, volume, and revenue are undisclosed"]
      - [Banks and correspondent users, "Banks requiring direct or intermediary-reduced dollar rails", "Cross-border settlement and named virtual accounts", "Strategic value is access to regulated US infrastructure", "No named bank customer or procurement record in the pool"]
    notes: "Segments and use cases are synthesized from company announcements and independent coverage; they are not a complete customer enumeration and do not imply paying status."
    claimRefs: [CU001, CU002, CU003, CU004]
  - id: TU002
    title: Customer growth and adoption trajectory
    columns: [Metric, Value, Date or period, Source posture, Confidence, Implication, Missing denominator]
    rows:
      - ["Year-over-year growth", "10x", "2025", "Company-reported and reproduced by trade coverage", "medium", "Signals rapid activity expansion", "Base metric and customer/volume denominator not disclosed"]
      - ["Processing volume", "billions", "2025 / current announcement period", "Company-reported", "medium", "Indicates claimed institutional transaction activity", "Currency, exact volume, and whether gross or net are unknown"]
      - ["Additional annual volume expected", "billions", "Within a few months of May 2026 announcement", "Company-reported expectation", "low", "Shows planned near-term expansion", "No signed pipeline, run rate, or conversion denominator"]
      - ["Named institutional relationship", "Kraken", "Current at May-July 2026 coverage", "Company-reported; repeated by independent coverage", "medium", "Provides a concrete customer signal", "Production scope, contract term, volume, and revenue unknown"]
    notes: "The values retain the sources' wording and periods. They are not normalized into ARR, revenue, active customers, or a comparable cohort because denominators and definitions are absent."
    claimRefs: [CU005, CU006, CU007, CU008]
  - id: TU003
    title: Named customer proof table
    columns: [Customer, Segment, Deployment or use case, Production vs pilot, Outcome, Limitation]
    rows:
      - [Kraken, "Digital-asset exchange", "Euro clearing and institutional dollar-access / settlement relationship", "Company describes processing for Kraken today; production scope is not independently verified", "Named relationship supports institutional relevance", "No contract, term, volume, revenue, or renewal evidence"]
      - [Mollie, "Payments company / merchant-payments platform", "Earlier Pay by Bank integration in Augustus predecessor Ivy", "Independent profile describes an integration; current status is unclear", "Shows prior distribution or integration surface", "Not evidence of current Augustus banking adoption"]
      - [Circle, "Stablecoin and payments company", "Independent profile describes increased stablecoin and settlement integration context", "Relationship and production scope are not established in retained text", "Suggests strategic adjacency to stablecoin workflows", "No customer outcome, contract, or usage metric"]
    notes: "Rows require named references but the pool does not provide two independent sources for each customer. The table is therefore a partial proof set, not an exhaustive customer enumeration; named logos are not treated as retention proof."
    enumerationScope:
      coverage: partial
      basis: "Named customer and integration references found in the assigned prefetched evidence for the 2026-10-24 refresh."
    claimRefs: [CU007, CU008]
