schemaVersion: "report-v2"
artifact: customers
slug: augustus
runDate: 2026-10-24
company:
  name: Augustus
chapter:
  number: 6
  title: Customers
  summary: Augustus has identifiable institutional demand signals and at least one named customer, but public evidence describes a target customer set and company-reported processing rather than a disclosed recurring customer base. The strongest diligence conclusion is that customer access is promising while production status, retention, concentration, and unit economics remain unverified.
sections:
  - id: customer-segments
    title: Target buyers and use cases
    body: Augustus is positioning its service for institutional rather than retail users. Its own announcement describes global financial institutions needing programmable clearing, while the financing announcement names international fintechs and banks in Latin America, Southeast Asia, the Middle East, and Africa as the commercial focus. The product description includes operating and FBO accounts, named virtual accounts, and access to SWIFT, ACH, SEPA, and stablecoins. This supports a buyer and workflow hypothesis around cross-border dollar access, settlement, and treasury operations, not a verified count of paying accounts. Independent coverage characterizes the opportunity as international institutions seeking a shorter route through correspondent banking, but it does not provide customer contracts, pricing, or conversion data. The segment therefore appears strategically coherent, while scale and revenue contribution by segment remain open.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: adoption-trajectory
    title: Adoption and named customer proof
    body: >-
      Public materials identify Kraken as a current institutional relationship and repeatedly state that Augustus is processing billions, but those statements are company-originated or reproduce company claims. The independent profile is more cautious: it says Augustus reports billions of euros processed annually and tenfold growth in 2025, while disclosing neither precise volume nor customer count. The evidence supports a distinction between claimed processing activity and independently verified active adoption. Kraken is a named customer signal, but the available texts do not establish whether the relationship is production, its duration, its volume, or the revenue it generates. The customer proof is therefore meaningful enough to validate commercial relevance, but insufficient for a cohort, retention, or concentration analysis.
    claimRefs: [CU005, CU006, CU007, CU008]
    tableRefs: [TU002, TU003]
    figureRefs: [FU001]
  - id: durability-and-risk
    title: Retention, expansion, and concentration gaps
    body: The available evidence does not disclose net revenue retention, gross retention, churn, renewal rates, contract terms, customer concentration, or a denominator for the reported processing figures. The independent profile explicitly notes that customer count and concentration are not disclosed. Augustus says its capital will support service to leading fintechs and banks across several regions, and its product narrative spans account infrastructure, traditional rails, and stablecoin settlement; these are expansion intentions, not evidence of land-and-expand behavior. The conditional bank charter may improve control of dollar infrastructure, but the institution was not yet permitted to conduct banking business in the independent account reviewed. Investors should consequently treat customer durability and expansion as unproven and request customer-level contracts, cohort data, production attestations, and concentration schedules before underwriting recurring economics.
    claimRefs: [CU009, CU010, CU011, CU012]
  - id: diligence-conclusion
    title: Customer evidence conclusion
    body: Customer evidence is strongest on problem relevance and named institutional use, weaker on breadth, and weakest on durability. The company describes a globally distributed institutional target and names Kraken as a current user, while independent reporting confirms the strategic rationale for direct dollar access but highlights missing customer count, revenue, volume, and concentration data. No source in the assigned pool supplies a customer contract, customer quote about outcomes, renewal metric, or failed deployment. The practical conclusion is to credit Augustus with a plausible institutional wedge and a customer relationship signal, but not to convert company-reported processing or geographic ambition into ARR, active-account, retention, or market-share claims. The next diligence gate is customer-level verification tied to production status and economics.
    claimRefs: [CU002, CU007, CU009, CU012]
callouts:
  - calloutType: strength
    title: Institutional use case is legible
    body: The evidence consistently points to cross-border dollar accounts, payment rails, and programmable settlement for fintechs and banks rather than an undefined mass-market proposition.
    claimRefs: [CU001, CU003]
  - calloutType: risk
    title: Durability is not evidenced
    body: No retained source discloses retention, churn, renewal, customer concentration, or contract economics; processing claims therefore cannot be treated as recurring customer revenue.
    claimRefs: [CU009, CU010, CU011]
tables:
  - id: TU001
    title: Customer segmentation and use-case map
    columns: [Segment, Buyer/user/payer, Use case, Scale or strategic value, Evidence gap]
    rows:
