      - [Fintechs and neobanks, "Founder, COO, or product executive", "Product, treasury, compliance, engineering", "Platform infrastructure budget", "Embed dollar access and payment rails", "Faster product launch without building a bank"]
      - [Stablecoin and digital-asset businesses, "Treasury and compliance leadership", "Settlement and risk teams", "Payments / regulated-infrastructure budget", "Stablecoin-linked dollar settlement and reserves", "Regulated access with auditable controls"]
      - [Enterprise payment platforms, "Payments product and partnerships teams", "Operations, finance, and API developers", "Embedded-finance or payments P&L", "Programmable accounts and cross-border payout flows", "API consolidation and reduced handoffs"]
    notes: "Buyer roles and triggers are analytical segmentation grounded in the assigned company descriptions and BaaS evidence; no source discloses Augustus' signed pricing or budget ownership."
    claimRefs: [CM010, CM011, CM012, CM013, CM014]
