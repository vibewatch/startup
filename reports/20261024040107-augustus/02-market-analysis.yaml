callouts:
  - calloutType: insight
    title: Market opportunity is infrastructure-specific
    body: "The strongest evidence supports a regulated distribution and settlement wedge for institutional dollar flows, not a claim to the full global payments market."
    claimRefs: [CM001, CM003, CM005, CM010]
  - calloutType: risk
    title: Regulatory readiness gates the serviceable market
    body: "Augustus' conditional charter creates differentiation, but FDIC insurance, pre-opening conditions, and stablecoin controls determine whether the proposed buyer market is actually serviceable."
    claimRefs: [CM011, CM012, CM013, CM014]
