evidenceGaps:
  - type: missing-source
    severity: blocking
    topic: regulatory-status
    missingEvidence: A final OCC authorization and pre-opening examination record confirming that all conditions were satisfied.
    whyItMatters: The proposed bank cannot operate as a national bank until final approval and opening requirements are complete.
    diligencePath: >-
      Request the OCC final decision, pre-opening examination result, and current condition matrix from management or
      the OCC.
    relatedQuestionRefs:
      - QO002
      - QO003
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: scale
    missingEvidence: Current revenue, ARR, burn, runway, headcount, customer count, deposits, and customer concentration.
    whyItMatters: >-
      Funding and valuation cannot be assessed against operating performance or bank economics without these
      denominators.
    diligencePath: >-
      Obtain monthly management accounts, capitalization and cash schedules, customer cohorts, and audited or reviewed
      financial statements.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Final board roster, senior-officer appointments, control-function reporting lines, and engineering-team depth.
    whyItMatters: A young founder-led parent is attempting to operate a highly regulated bank with broad product scope.
    diligencePath: >-
      Request the approved organization chart, board minutes, key-person plan, succession plan, and OCC no-objection
      correspondence.
    relatedQuestionRefs:
      - QO004
      - QO007
      - QO009
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: business-model
    missingEvidence: >-
      Reconciled description of whether Augustus will issue a stablecoin directly or only provide related services
      through a subsidiary.
    whyItMatters: >-
      The FDIC and OCC descriptions contemplate stablecoin activity, while public coverage characterizes the operating
      model differently; scope affects licensing and risk.
    diligencePath: Obtain the current approved business plan, subsidiary application status, and board-approved product roadmap.
    relatedQuestionRefs:
      - QO001
      - QO003
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: market-sizing
    missingEvidence: >-
      A customer-level bottom-up model for eligible institutions, corridors, payment volume, pricing, and conversion
      into Augustus revenue.
    whyItMatters: >-
      Top-down cross-border-payments and BaaS estimates are not Augustus' SAM or SOM and cannot establish valuation
      capture.
    diligencePath: >-
      Obtain management's segmented pipeline, signed-customer list, corridor volume, pricing schedule, and 24-month
      volume-to-revenue bridge.
    relatedQuestionRefs:
      - QM003
      - QM009
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: regulatory-constraint
    missingEvidence: >-
      Current evidence of FDIC deposit-insurance approval, OCC pre-opening-condition completion, and operational launch
      authorization.
    whyItMatters: >-
      The buyer market is not serviceable if Augustus cannot legally open and provide the proposed dollar-clearing
      services.
    diligencePath: >-
      Verify current FDIC, OCC, and Federal Reserve records and obtain the bank's launch-readiness status from
      management.
    relatedQuestionRefs:
      - QM006
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: >-
      Comparable realized pricing, minimums, reserve economics, and contract terms for Augustus and its closest
      regulated alternatives.
    whyItMatters: >-
      Pricing and switching economics determine whether Augustus can win customers without subsidizing regulated
      infrastructure.
    diligencePath: >-
      Obtain anonymized customer contracts or management pricing schedules and compare API, account, settlement,
      compliance, and reserve fees.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: disclosure-gaps
    missingEvidence: >-
      Audited U.S. operating metrics, customer concentration, uptime, loss experience, and margin contribution by
      product.
    whyItMatters: >-
      A conditional charter and reported processing volume do not demonstrate competitive scale or bank-quality
      economics.
    diligencePath: Request monthly cohort, volume, revenue, uptime, compliance, and capital plans under diligence confidentiality.
    relatedQuestionRefs:
      - QP003
      - QP007
  - type: missing-source
    severity: minor
    topic: capability-matrix
    missingEvidence: Primary product documentation and security/compliance materials for every alternative in the comparison.
    whyItMatters: Public secondary descriptions can identify positioning but cannot verify feature parity or control implementation.
    diligencePath: >-
      Run controlled demos and collect current API, security, service-level, and regulatory documentation from each
      provider.
    relatedQuestionRefs:
      - QP005
    relatedTableRefs:
      - TP002
      - TP003
  - type: private-evidence-only
    severity: blocking
    topic: revenue
    missingEvidence: >-
      Audited or management-certified revenue by product, customer, geography, and accounting period, including
      reconciliation from payment volume to recognized revenue.
    whyItMatters: >-
      Without recognized revenue, the announced valuation cannot be tested against ARR, take rate, growth quality, or
      bank economics.
    diligencePath: >-
      Obtain monthly management accounts, customer concentration, revenue-recognition policy, and a sample of executed
      contracts under NDA.
    relatedQuestionRefs:
      - QI001
      - QI002
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: >-
      Realized pricing, discounts, payment and correspondent costs, fraud losses, and gross-margin contribution by
      product.
    whyItMatters: Payment volume can grow while contribution margins remain weak or negative.
    diligencePath: Request product-level cohort economics and a bridge from gross billings to net revenue and contribution profit.
    relatedQuestionRefs:
      - QI003
      - QI005
    relatedTableRefs:
      - TI002
  - type: missing-source
    severity: blocking
    topic: runway
    missingEvidence: Cash balance, monthly burn, hiring plan, debt, regulatory-capital funding, and runway under delayed bank opening.
    whyItMatters: >-
      Conditional approval and a financing announcement do not prove liquidity through examination, insurance, launch,
      and customer ramp.
    diligencePath: >-
      Obtain a 24-month cash model with downside cases for delayed opening, higher compliance spend, and slower customer
      conversion.
    relatedQuestionRefs:
      - QI007
    relatedTableRefs:
      - TI003
  - type: stale
    severity: material
    topic: bank-opening
    missingEvidence: >-
      Current status of OCC pre-opening examination, FDIC deposit-insurance application, Federal Reserve stock
      application, and outstanding conditions as of the report date.
    whyItMatters: The timing and feasibility of the proposed US revenue model depend on these unresolved gates.
    diligencePath: Obtain written regulatory-status updates and verify each condition with counsel or authorized management.
    relatedQuestionRefs:
      - QI006
  - type: missing-source
    severity: material
    topic: unit-economics
    missingEvidence: Customer-level retention, payment concentration, sales cycle, CAC, payback, and service-level economics.
    whyItMatters: Institutional payments can be concentrated and operationally expensive even when headline volume is large.
    diligencePath: >-
      Request anonymized cohort tables, top-customer concentration, churn, pipeline conversion, and
      implementation/support cost data.
    relatedQuestionRefs:
      - QI002
      - QI004
      - QI005
  - type: missing-source
    severity: material
    topic: technical-maturity
    missingEvidence: >-
      Independent architecture documentation, reconciled ledger controls, uptime and recovery testing, penetration
      testing, model inventory, and error or override rates.
    whyItMatters: >-
      These measurements determine whether Marble and the AI-native control claims are production-grade rather than
      design intent.
    diligencePath: >-
      Request architecture and control documentation, audit reports, test results, incident history, and production
      metrics under NDA.
    relatedQuestionRefs:
      - QE004
      - QE006
      - QE008
  - type: stale
    severity: material
    topic: regulatory-maturity
    missingEvidence: >-
