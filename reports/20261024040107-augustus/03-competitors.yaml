    title: Capability, pricing, and switching comparison
    columns: [Buying criterion, Augustus, Column, Cross River or incumbent alternative, Buyer implication]
    rows:
      - ["Regulatory posture", "Conditional OCC approval; FDIC and Federal Reserve steps outstanding", "National charter and FDIC certificate", "Existing regulated bank and partner oversight", "Augustus has a hard-to-copy entry credential but not completed operating status"]
      - ["API and settlement scope", "API-first accounts and stablecoin-aware programmable clearing proposed", "Direct APIs across Fedwire, ACH, SWIFT, RTP, and FedNow", "API accounts, payments, lending, cards, and USDC settlement", "Functional overlap is high; integration depth and reliability require technical diligence"]
      - ["Pricing model", "Not publicly disclosed in assigned evidence", "Per-use API model described", "Transaction fees, lending economics, and revenue sharing described", "No price winner can be established without quotes and contract terms"]
      - ["Distribution and liquidity", "Kraken and European institutional activity disclosed", "Brex, Mercury, Plaid, and other program relationships", "80+ fintech partnerships and millions of end users through partners", "Incumbent relationships create switching costs and lower customer-acquisition friction"]
      - ["Trust and compliance", "Charter process and bank controls are the thesis", "Direct ledger and partner compliance requirements", "Bank-led KYC, fraud, and lending controls", "Augustus must prove controls in production rather than rely on approval narrative"]
      - ["Switching and multi-homing", "Potentially high once accounts, compliance, and settlement flows are embedded", "API integration and program-level onboarding create operational lock-in", "Partner ecosystems and transaction history create relationship lock-in", "Buyers may multi-home rails but switching core banking relationships is costly"]
    notes: "Unknown pricing and unsupported capability cells remain explicitly unknown; the table compares disclosed models rather than inferring realized customer economics."
    claimRefs: [CP010, CP011, CP012, CP013, CP014]
