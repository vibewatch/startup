        - {label: Column, x: 3, y: 4, note: "Direct API bank model with reported 2025 revenue and established fintech programs.", series: "regulated infrastructure"}
        - {label: Cross River, x: 4, y: 5, note: "Broad API product set, estimated 2025 revenue, and 80+ fintech partnerships.", series: "regulated infrastructure"}
        - {label: Large correspondent banks, x: 5, y: 5, note: "Existing commercial relationships, liquidity, and governance; less focused on niche crypto workflows.", series: "incumbents"}
        - {label: Stablecoin issuers and networks, x: 5, y: 3, note: "Liquidity and network effects; bank-account and redemption dependencies remain.", series: "adjacent"}
        - {label: Internal build or sponsor chain, x: 2, y: 3, note: "May fit existing relationships but retains intermediary and reconciliation trade-offs.", series: "substitutes"}
      xAxis: {label: "Distinctive programmable-clearing proposition", min: 1, max: 5}
      yAxis: {label: "Disclosed operating scale and distribution", min: 1, max: 5}
    approximationNotes: "Ordinal scores are analyst synthesis from the cited public evidence, not market-share measurements or a universal benchmark."
    claimRefs: [CP001, CP005, CP006, CP007, CP010, CP013]
callouts:
  - calloutType: insight
    title: Strongest wedge
    body: Augustus's most credible wedge is regulated, programmable dollar settlement for crypto-native and cross-border fintech customers that value continuous workflows over incumbent breadth.
    claimRefs: [CP002, CP004, CP010]
  - calloutType: risk
    title: Displacement risk
    body: Incumbents can add stablecoin and API capabilities inside existing governance and customer relationships, while Augustus has not publicly demonstrated comparable scale, pricing, or U.S. operating history.
    claimRefs: [CP003, CP009, CP013, CP014]
