slug: augustus
runDate: 2026-10-24
company:
  name: Augustus
chapter:
  number: 1
  title: Company Overview
  summary: Augustus is a Dallas-based fintech founded in 2022 that is attempting to move from European payments into a federally chartered U.S. clearing bank for international fintechs, banks, and digital-asset companies. Its preliminary OCC charter approval and August 2026 FDIC deposit-insurance approval are material milestones, but opening the bank remains conditional on capital, governance, systems, and pre-opening requirements.
sections:
  - id: identity-and-regulatory-status
    title: Identity and regulatory status
    body: >-
      Augustus was founded in 2022 by Ferdinand Dabitz, Joshua Becker, Simon Wimmer, and Peter Lieck, according to the company announcement. Its stated product is a Global Dollar Bank: an API-first platform intended to provide international financial institutions with dollar accounts and payment rails, including SWIFT, ACH, SEPA, and stablecoin connectivity. The OCC’s May 8, 2026 decision gives the proposed Augustus National Bank, N.A. preliminary conditional approval to organize a full-service insured national bank headquartered in Dallas, Texas, with no branches. That is not final authorization to operate. The OCC says final approval and opening require all pre-opening requirements, Federal Reserve stock application, and FDIC deposit insurance. The FDIC subsequently approved the deposit-insurance application on August 4, 2026, subject to conditions, and said its approval expires if the bank is not established within twelve months unless extended.
    claimRefs: [CO001, CO002, CO003, CO004, CO005]
    tableRefs: [TO001]
    figureRefs: [FO001]
  - id: leadership-and-governance
    title: Leadership and governance
    body: >-
      The founder-led parent is paired with a bank operating team recruited for regulatory and functional coverage. Banking Dive identifies Dabitz as the proposed CEO and Greg Quarles as the presumptive president; it reports that Quarles served as CEO of Green Dot Bank, United Texas Bank, and H&R Block Bank and spent more than seventeen years at the OCC. The same report names Joe Schenone as presumptive CFO and Andy Riggs as presumptive chief credit officer. This combination addresses an obvious key-person risk: Dabitz is central to the strategy and public narrative, while the proposed bank must demonstrate independent management, controls, and board readiness to supervisors. Public sources do not establish the full board, finalized reporting lines, CTO succession, or the size and depth of the engineering and control teams.
    claimRefs: [CO006, CO007, CO008]
    tableRefs: [TO002]
  - id: funding-and-scale
    title: Funding, valuation, and operating scale
    body: Augustus announced a $180 million Series B on July 21, 2026 at a $1 billion valuation, led by Tiger Global with participation from Hummingbird, QED, and founders associated with Nubank, Ramp, Circle, and Deel. The announcement states that total capital raised is $210 million. Independent coverage by The Next Web and Startup Fortune repeats those financing figures, while also emphasizing that the charter was still conditional. The capital provides an apparent funding base for bank formation, technology, and regulatory execution, but it is not the same as bank regulatory capital or cash runway. The OCC decision separately requires at least $52.5 million of initial paid-in capital for the proposed bank, net of organizational and pre-opening expenses. Augustus and third-party articles describe existing European euro-clearing activity and Kraken as a customer, but no reliable public source in this pool supplies revenue, ARR, profit, cash burn, headcount, customer count, deposit balances, or customer concentration.
    claimRefs: [CO011, CO012, CO013, CO014, CO015]
    tableRefs: [TO003]
  - id: milestones-and-open-questions
    title: Milestones and unresolved diligence
    body: >-
      The company’s path is a sequence of product expansion and regulatory execution: founding and European payments, the proposed U.S. bank charter, the Series B financing, and FDIC deposit-insurance approval. The OCC decision imposes material operating conditions, including a 10.0 percent Tier 1 leverage ratio during the first three years, prior OCC no-objection for senior executives and directors, and compliance with applicable stablecoin law. The FDIC describes a business model serving digital-asset companies, high-net-worth individuals, AI and technology companies, and international financial institutions, with planned deposits, lending, payment, treasury, and stablecoin-related services. The main diligence gaps are whether the bank has satisfied every OCC pre-opening requirement, when it will open, how holding-company proceeds are contributed as regulatory capital, and whether the proposed product breadth can be governed without overextending the team. The absence of a public incident in this pool is not evidence that no incident occurred.
    claimRefs: [CO003, CO016, CO017, CO018]
    figureRefs: []
