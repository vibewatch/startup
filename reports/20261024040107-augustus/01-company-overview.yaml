callouts:
  - calloutType: strength
    title: Regulatory progress is the central asset
    body: The OCC preliminary conditional approval and FDIC deposit-insurance approval are substantially stronger evidence of execution than a financing announcement alone, although neither establishes that the bank is open.
    claimRefs: [CO002, CO003, CO005, CO016]
  - calloutType: risk
    title: The charter is not yet an operating bank
    body: The OCC expressly reserves final approval until pre-opening requirements are met, while key bank-level capital, governance, systems, and opening-date evidence remains unavailable in the assigned pool.
    claimRefs: [CO003, CO017, CO018]
  - calloutType: assumption
    title: Public scale metrics remain incomplete
    body: Reported funding, valuation, European processing, and a named customer do not establish revenue, ARR, profitability, cash runway, headcount, customer concentration, or bank deposits.
    claimRefs: [CO012, CO013, CO014, CO015]
