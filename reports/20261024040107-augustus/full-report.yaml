        blocks:
          - type: callout
            title: Funded path to regulatory execution
            body: >-
              The announced financing and reported regulatory-capital conditions indicate resources to pursue bank
              formation, but the amount actually available to the bank remains unverified.
            calloutType: strength
            claimRefs:
