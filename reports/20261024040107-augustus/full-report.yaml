      - number: '1.4'
        title: Milestones and unresolved diligence
        blocks:
          - type: paragraph
            body: >-
              The company’s path is a sequence of product expansion and regulatory execution: founding and European
              payments, the proposed U.S. bank charter, the Series B financing, and FDIC deposit-insurance approval. The
              OCC decision imposes material operating conditions, including a 10.0 percent Tier 1 leverage ratio during
              the first three years, prior OCC no-objection for senior executives and directors, and compliance with
              applicable stablecoin law. The FDIC describes a business model serving digital-asset companies,
              high-net-worth individuals, AI and technology companies, and international financial institutions, with
              planned deposits, lending, payment, treasury, and stablecoin-related services. The main diligence gaps are
              whether the bank has satisfied every OCC pre-opening requirement, when it will open, how holding-company
              proceeds are contributed as regulatory capital, and whether the proposed product breadth can be governed
              without overextending the team. The absence of a public incident in this pool is not evidence that no
              incident occurred.
