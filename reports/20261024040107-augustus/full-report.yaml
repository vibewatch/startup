      - number: '5.2'
        title: Product modules and operating model
        blocks:
          - type: paragraph
            body: >-
              The product map has two maturity layers. The live layer is a regulated Finnish payment institution
              supporting euro payment and settlement activity; the proposed layer is Augustus Bank, N.A., designed to
              add US dollar capabilities under a full-service national-bank structure. Public descriptions also identify
              Marble as an internally built banking platform and describe API surfaces for operating accounts, FBO
              accounts, named virtual accounts, and digital-asset wallets. Those descriptions establish intended
              modules, not a verified production architecture. The charter application and public commentary indicate
              that capital, governance, systems, cybersecurity, BSA/AML, and deposit-insurance or Federal Reserve
              conditions remain part of the deployment path.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE002
              - CE010
              - CE011
              - CE012
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE006
              - CE007
              - CE010
              - CE013
              - CE014
      - number: '5.3'
        title: Differentiation, controls, and dependencies
        blocks:
          - type: paragraph
            body: >-
              Augustus's differentiation thesis is control of the regulated account and settlement layer, not merely a
              better payment interface. Its stated design combines traditional rails and stablecoin networks through an
              API-first, always-on workflow, while its AI-native framing includes machine-assisted alert triage,
              sanctions research, KYC review, reconciliation, investigations, and reporting with humans retaining final
              authority. This is strategically coherent but remains an empirical claim: no public uptime, latency,
              recovery, penetration-test, model-error, unit-cost, or production-volume results were found. The principal
              dependencies are final OCC approval, FDIC insurance, Federal Reserve requirements, bank-grade controls,
              stablecoin rules, sponsor or network access, and liquidity and compliance operations.
            claimRefs:
              - CE010
              - CE011
              - CE012
              - CE013
              - CE014
          - type: table
            tableRef: TE003
            claimRefs:
              - CE006
              - CE009
              - CE010
              - CE013
              - CE014
      - number: '5.4'
        title: Maturity and diligence verdict
        blocks:
          - type: paragraph
            body: >-
              Product maturity is therefore asymmetric. Augustus has a credible operating base in European payments and
              a meaningful regulatory milestone, but the proposed US bank and its differentiating control stack are not
              yet evidenced as a production system. The absence of a public repository, public technical architecture,
              independent security assessment, reliability history, or agent-performance benchmark limits confidence in
              scalability and safety. Stripe's current Treasury product demonstrates that multicurrency accounts,
              stablecoin payouts, APIs, and bounded agent workflows are already available through an established
              platform, which raises the bar for Augustus to prove that owning a bank creates superior reliability,
              economics, or access. Diligence should prioritize production evidence rather than product nomenclature.
            claimRefs:
              - CE015
              - CE016
              - CE011
              - CE014
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Live foundation, pending US product
            body: >-
              The Finnish payment-institution rail is the clearest delivered capability; the proposed US clearing bank
              should be treated as a regulated build-out until final approval and production evidence exist.
            calloutType: insight
            claimRefs:
              - CE001
              - CE003
              - CE004
          - type: callout
            title: AI-native remains an unverified performance claim
            body: >-
              Public materials describe intended machine-assisted controls, but no independent evidence establishes
              model accuracy, auditability, resilience, or cost at production volume.
            calloutType: risk
            claimRefs:
              - CE011
              - CE012
              - CE015
          - type: callout
            title: Diligence the control plane
            body: >-
              Request the bank's architecture, reconciled ledger controls, uptime and recovery tests, model inventory,
              override metrics, penetration testing, and evidence that the proposed US workflows operate outside a demo
              or partner arrangement.
            calloutType: recommendation
            claimRefs:
              - CE015
              - CE016
              - CE011
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Target buyers and use cases
        blocks:
          - type: paragraph
            body: >-
              Augustus is positioning its service for institutional rather than retail users. Its own announcement
              describes global financial institutions needing programmable clearing, while the financing announcement
              names international fintechs and banks in Latin America, Southeast Asia, the Middle East, and Africa as
              the commercial focus. The product description includes operating and FBO accounts, named virtual accounts,
              and access to SWIFT, ACH, SEPA, and stablecoins. This supports a buyer and workflow hypothesis around
              cross-border dollar access, settlement, and treasury operations, not a verified count of paying accounts.
              Independent coverage characterizes the opportunity as international institutions seeking a shorter route
              through correspondent banking, but it does not provide customer contracts, pricing, or conversion data.
              The segment therefore appears strategically coherent, while scale and revenue contribution by segment
              remain open.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
      - number: '6.2'
        title: Adoption and named customer proof
        blocks:
          - type: paragraph
            body: >-
              Public materials identify Kraken as a current institutional relationship and repeatedly state that
              Augustus is processing billions, but those statements are company-originated or reproduce company claims.
              The independent profile is more cautious: it says Augustus reports billions of euros processed annually
              and tenfold growth in 2025, while disclosing neither precise volume nor customer count. The evidence
              supports a distinction between claimed processing activity and independently verified active adoption.
              Kraken is a named customer signal, but the available texts do not establish whether the relationship is
              production, its duration, its volume, or the revenue it generates. The customer proof is therefore
              meaningful enough to validate commercial relevance, but insufficient for a cohort, retention, or
              concentration analysis.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
          - type: table
            tableRef: TU003
            claimRefs:
              - CU007
              - CU008
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU003
              - CU007
              - CU009
              - CU010
      - number: '6.3'
        title: Retention, expansion, and concentration gaps
        blocks:
          - type: paragraph
            body: >-
              The available evidence does not disclose net revenue retention, gross retention, churn, renewal rates,
              contract terms, customer concentration, or a denominator for the reported processing figures. The
              independent profile explicitly notes that customer count and concentration are not disclosed. Augustus
              says its capital will support service to leading fintechs and banks across several regions, and its
              product narrative spans account infrastructure, traditional rails, and stablecoin settlement; these are
              expansion intentions, not evidence of land-and-expand behavior. The conditional bank charter may improve
              control of dollar infrastructure, but the institution was not yet permitted to conduct banking business in
              the independent account reviewed. Investors should consequently treat customer durability and expansion as
              unproven and request customer-level contracts, cohort data, production attestations, and concentration
              schedules before underwriting recurring economics.
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
      - number: '6.4'
        title: Customer evidence conclusion
        blocks:
          - type: paragraph
            body: >-
              Customer evidence is strongest on problem relevance and named institutional use, weaker on breadth, and
              weakest on durability. The company describes a globally distributed institutional target and names Kraken
              as a current user, while independent reporting confirms the strategic rationale for direct dollar access
              but highlights missing customer count, revenue, volume, and concentration data. No source in the assigned
              pool supplies a customer contract, customer quote about outcomes, renewal metric, or failed deployment.
              The practical conclusion is to credit Augustus with a plausible institutional wedge and a customer
              relationship signal, but not to convert company-reported processing or geographic ambition into ARR,
              active-account, retention, or market-share claims. The next diligence gate is customer-level verification
              tied to production status and economics.
            claimRefs:
              - CU002
              - CU007
              - CU009
              - CU012
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Institutional use case is legible
            body: >-
              The evidence consistently points to cross-border dollar accounts, payment rails, and programmable
              settlement for fintechs and banks rather than an undefined mass-market proposition.
            calloutType: strength
            claimRefs:
              - CU001
              - CU003
          - type: callout
            title: Durability is not evidenced
            body: >-
              No retained source discloses retention, churn, renewal, customer concentration, or contract economics;
              processing claims therefore cannot be treated as recurring customer revenue.
            calloutType: risk
            claimRefs:
              - CU009
              - CU010
              - CU011
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal exposure
        blocks:
          - type: paragraph
            body: >-
              The central risk is not whether Augustus has received regulatory attention; it is whether the conditional
              charter can be converted into a fully operating US bank. Banking Dive reports that the OCC granted
              conditional approval, while the private-law reference describes the bank as still in organization and says
              the full charter has not been finalised. The company-facing release says the charter is for a full-service
              national bank, but it does not enumerate the pre-opening conditions, deposit-insurance status, or Federal
              Reserve access. That creates a binary execution dependency: the product's planned USD clearing capability
              is not equivalent to a live, fully licensed service. The FDIC's application page confirms that deposit
              insurance applications involve formal resources, filings, processing, and decisions; it does not confirm
              Augustus's own application status. Until those artifacts are produced, regulatory completion should be
              treated as an unresolved condition rather than a completed asset.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
      - number: '7.2'
        title: Operational, technology, and control risk
        blocks:
          - type: paragraph
            body: >-
              Augustus is proposing to replace correspondent-banking workflows with an AI- and stablecoin-native core.
              The opportunity increases the control surface: durable machine-initiated workflows, sanctions screening,
              reconciliation, fraud controls, cyber resilience, and incident response all become bank-grade
              requirements. Independent research found no public technical architecture, ledger audit, availability
              record, security assessment, or reconciliation benchmark and reported that 2026 recruiting materials still
              assigned new hires responsibility for building core financial-crime workflows. The OCC handbook is a
              supervisory reference for examiner work and explicitly says each bank differs, so it is a useful
              governance benchmark rather than proof that Augustus meets it. A failed control could stop onboarding,
              trigger remediation, or undermine the economics of the network even if demand is strong.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
      - number: '7.3'
        title: Dependency, partner, and financial-model risk
        blocks:
          - type: paragraph
            body: >-
              Augustus's model depends on a small set of high-consequence approvals, payment access, institutional
              counterparties, and sufficient capital to complete bank formation before the commercial model is proven.
              Secondary coverage names Kraken as an institutional client and describes EUR clearing through European
              entities, but no retained source supplies contract duration, volume, concentration, renewal, or exit
              terms. The financing announcement describes a $180 million Series B at a $1 billion valuation, while
              independent research notes that holding-company proceeds do not become bank regulatory capital until
              contributed in an accepted form. Neither funding raised nor valuation establishes cash runway, burn,
              margin, or the amount reserved for regulatory build-out. Capital can fund the process, but cannot
              guarantee approval, customer retention, or operating reliability. Monitoring should focus on charter
              milestones, FDIC and Federal Reserve status, independent control evidence, customer concentration, and
              cash runway.
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
      - number: '7.4'
        title: Thesis-break triggers and diligence priorities
        blocks:
          - type: paragraph
            body: >-
              The risk thesis changes materially if Augustus receives full operating approval and independently
              demonstrates safe, reliable settlement at production scale. Conversely, a prolonged organization phase, a
              denied or delayed deposit-insurance or payment-access application, an unresolved control deficiency, a
              material outage or security incident, or a loss of a critical institutional customer would weaken the
              investment case. The highest-value diligence is therefore documentary rather than promotional: obtain the
              OCC conditions and completion schedule, verify FDIC and Federal Reserve applications, review independent
              security and compliance testing, inspect concentration and renewal data, and reconcile the financing
              proceeds to a 24-month operating plan. These are measurable gates, not assumptions about management
              intent.
            claimRefs:
              - CR002
              - CR006
              - CR010
              - CR012
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR002
              - CR006
              - CR010
              - CR012
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Conditional approval is not operating readiness
            body: >-
              The OCC milestone is strategically important, but the assigned evidence does not establish completion of
              pre-opening conditions, FDIC insurance, or Federal Reserve payment access.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
          - type: callout
            title: Gate investment on documentary controls
            body: >-
              Require regulator-status documents, independent control testing, customer concentration evidence, and a
              cash-runway model before treating the charter as a de-risked moat.
            calloutType: recommendation
            claimRefs:
              - CR006
              - CR010
              - CR012
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment case and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The positive case is strategic rather than purely financial. Augustus combines a conditional OCC approval,
              a payments institution operating in Europe, experienced bank and regulatory hires, and a stated product
              aimed at institutions that need programmable dollar access. Independent coverage describes the core
              customer problem as expensive, slow correspondent-bank routing, while the company and its advisers
              position Marble and stablecoin connectivity as a way to control more of the stack. That combination could
              create durable infrastructure value if the bank opens, wins institutional flows, and converts payment
              activity into recurring account, payment, treasury, foreign-exchange, or lending economics.

              The anti-thesis is that investors paid for the option before the option became an operating bank. The
              conditional approval does not itself permit deposit-taking, lending, dollar clearing, or opening for
              business. Public reporting does not provide current revenue, profit, gross margin, customer concentration,
              or a transparent production-dollar volume. The strategic scope also expands execution risk: Augustus must
              combine payments software, bank governance, financial-crime controls, liquidity, treasury, and
              digital-asset infrastructure. The most relevant adverse benchmark is that an OCC charter is not a
              substitute for operating history or proof that the proposed platform earns bank-quality returns. The
              assigned evidence identifies Banking Circle and ClearBank as operating-model analogues and Column as a US
              developer-infrastructure analogue, but it provides no public-company multiple, comparable private-round
              terms, or M&A benchmark sufficiently like-for-like to price Augustus. These are operating references, not
              independent valuation benchmarks.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV005
              - CV007
              - CV008
              - CV012
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV006
              - CV007
              - CV009
              - CV010
              - CV011
      - number: '8.2'
        title: Price discipline and scenarios
        blocks:
          - type: paragraph
            body: >-
              The reported $1 billion valuation followed a $180 million Series B led by Tiger Global. That mark is a
              financing reference, not an independently established fair value, and the public record does not disclose
              whether all proceeds were primary, how much will be contributed to the bank, or what liquidation
              preferences and other terms apply. A disciplined entry therefore requires separating holding-company cash
              from regulatory capital and valuing the business against milestones: deposit insurance, pre-opening
              approval, live dollar products, verified volume, revenue quality, and risk-adjusted margins. The scenarios
              below are directional decision cases, not forecasts; no public evidence supports a precise intrinsic value
              range.

              The bull case requires the bank to open on schedule, demonstrate compliant and reliable dollar settlement,
              and convert institutional demand into repeatable economics. The base case assumes the European payments
              business continues while US bank milestones take longer and economics remain unproven. The bear case
              assumes regulatory or technology delays, higher compliance cost, weak customer conversion, or a financing
              repricing before the charter option is monetized. These cases imply different entry prices, but the
              current evidence is strongest for waiting for milestones rather than underwriting a buy at the headline
              valuation.
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
          - type: table
            tableRef: TV003
            claimRefs:
              - CV005
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV014
              - CV015
      - number: '8.3'
        title: Decision, exit readiness, and diligence
        blocks:
          - type: paragraph
            body: >-
              The appropriate current recommendation is track with medium confidence and a high risk rating. Augustus
              has unusual regulatory progress and a potentially valuable market position, but the valuation is stretched
              relative to the disclosed operating evidence and the company remains exposed to pre-opening, compliance,
              liquidity, and commercialization risks. The investment call should move toward buy only after supervisors
              confirm the bank's operating permissions, management demonstrates production controls, and investors
              receive enough financial detail to test revenue, capital intensity, concentration, and downside liquidity.
              It should move toward avoid if the charter timeline slips materially, the dollar product remains beta or
              partner-dependent, or the next financing is materially below the reported mark.

              Exit readiness is therefore milestone-based rather than calendar-based. A credible future exit or
              secondary mark would require audited or otherwise verifiable operating metrics, a clear regulatory
              perimeter, repeat institutional volume, and evidence that risk controls scale with the business. Final
              diligence should obtain the cap table and preference stack, use of proceeds, bank capitalization plan,
              FDIC and Federal Reserve status, product production logs, customer concentration, revenue by product, and
              independent security and compliance testing. The absence of these items is a material information gap, not
              evidence that the underlying business is failing. A target return, hold period, and exit valuation are not
              supportable from the assigned public evidence; each requires entry terms, dilution and preference data,
              audited operating results, and a defensible comparable multiple.
            claimRefs:
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV007
              - CV009
              - CV012
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Valuation limitation
            body: >-
              Public evidence supports a milestone framework, not a precise intrinsic valuation, because revenue,
              margin, capital allocation, preference terms, and cash runway are not disclosed.
            calloutType: assumption
            claimRefs:
              - CV008
              - CV009
              - CV010
