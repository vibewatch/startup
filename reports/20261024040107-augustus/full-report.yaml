  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and strategic position
        blocks:
          - type: paragraph
            body: >-
              Augustus is not competing with one homogeneous vendor set. Its direct peer set is regulated banking
              infrastructure providers such as Column and Cross River; its incumbent set is large correspondent and
              commercial banks with existing treasury relationships; its adjacent set includes stablecoin issuers,
              networks, and middleware platforms; and its substitutes include sponsor-bank arrangements, existing
              correspondent chains, and internal bank builds. Public evidence places Augustus in a specialized wholesale
              clearing niche rather than as a demonstrated universal replacement. The company's own announcement
              describes a full-service national-bank ambition for global financial institutions, payment firms, crypto
              exchanges, and fintech platforms, while an independent sector analysis argues that governance, trust, and
              commercial relationships remain the main barriers to mainstream adoption. This makes Augustus's
              conditional charter a meaningful entry credential, but not proof of operating scale or durable
              displacement.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP005
              - CP006
              - CP007
              - CP010
              - CP013
      - number: '3.2'
        title: Competitor profiles and buyer trade-offs
        blocks:
          - type: paragraph
            body: >-
              Column demonstrates the direct-bank model Augustus is approaching: it offers programmable accounts,
              payments, lending, and card infrastructure through APIs, with direct Federal Reserve rail connectivity and
              a strictly B2B customer model. Cross River demonstrates a scaled BaaS alternative with more than 80
              fintech partnerships, a broad account, payment, card, lending, and stablecoin product set, and a B2B2C
              monetization model. Large-bank initiatives and stablecoin issuers are different substitutes: they bring
              stronger distribution, liquidity, or existing governance but may be less focused on early-stage or
              crypto-native customers. Augustus's public disclosures name Kraken and European institutional payment
              activity, but do not establish comparable U.S. operating scale, revenue, or customer breadth.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
          - type: table
            tableRef: TP002
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
      - number: '3.3'
        title: Differentiation durability, pricing, and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Augustus's proposed moat has three layers: regulatory access, a proprietary core designed for continuous
              programmable settlement, and a focused customer segment underserved by traditional correspondent banking.
              The regulatory layer is difficult to copy quickly, but conditional approval still leaves pre-opening
              requirements, deposit insurance, and Federal Reserve steps outstanding. The technology layer is credible
              as a product thesis but not yet independently demonstrated through public cost, uptime, or margin data.
              The distribution layer is the weakest disclosed dimension: established banks, Column, Cross River,
              stablecoin issuers, and networks already control relationships or liquidity that are costly to displace.
              Public pricing is not disclosed for Augustus, Column, or Cross River in the assigned evidence; a buyer
              should therefore compare contract economics, API fees, reserve/settlement terms, and compliance
              obligations through diligence rather than infer price leadership.
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
              - CP014
      - number: '3.4'
        title: Competitive implications and diligence priorities
        blocks:
          - type: paragraph
            body: >-
              Augustus can be strategically differentiated without being competitively dominant. The most credible
              initial wedge is regulated dollar access and settlement for crypto-native and cross-border fintech
              customers that need continuous workflows and cannot obtain efficient direct correspondent access. Its main
              displacement risk is that JPMorgan, Visa-linked networks, stablecoin issuers, or incumbent sponsor banks
              add comparable programmable settlement inside existing relationships. The key underwriting questions are
              whether Augustus obtains full operating approvals, converts European processing into durable U.S. dollar
              flows, proves bank-grade controls and economics, and wins distribution beyond a narrow crypto clearing
              niche. Unknown pricing, limited public customer concentration data, and the absence of independently
              verified operating metrics remain material evidence gaps.
            claimRefs:
              - CP002
              - CP004
              - CP010
              - CP013
              - CP014
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Strongest wedge
            body: >-
              Augustus's most credible wedge is regulated, programmable dollar settlement for crypto-native and
              cross-border fintech customers that value continuous workflows over incumbent breadth.
            calloutType: insight
            claimRefs:
              - CP002
              - CP004
              - CP010
          - type: callout
            title: Displacement risk
            body: >-
              Incumbents can add stablecoin and API capabilities inside existing governance and customer relationships,
              while Augustus has not publicly demonstrated comparable scale, pricing, or U.S. operating history.
            calloutType: risk
            claimRefs:
              - CP003
              - CP009
              - CP013
              - CP014
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and observable traction
        blocks:
          - type: paragraph
            body: >-
              Augustus is transitioning from Ivy's European account-to-account payments activity toward a proposed US
              wholesale bank and API-led dollar infrastructure. Public descriptions identify institutional fintechs,
              digital-asset firms, and international financial institutions as the target users; the proposed product
              combines dollar accounts, ACH, wires, and stablecoin-related rails. American Banker reports that the
              company already processes transactions for enterprise customers such as Kraken, while Startup Fortune
              describes euro payments in Europe and a proposed one-API route to dollar accounts and payment rails. These
              are evidence of a target market and operating foundation, not proof of current US-bank revenue. Insights4
              reports that Augustus says it processes billions of euros annually and grew tenfold in 2025, but also
              states that precise volume, revenue, customer count, deposits, gross margin, and concentration have not
              been disclosed. Consequently, revenue quality cannot yet be assessed from public data: payment volume is
              not revenue, the announced valuation is not ARR, and the proposed bank's future interest, payment, FX,
              treasury, lending, or account fees remain unreported.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
      - number: '4.2'
        title: Pricing, cost structure, and unit-economics visibility
        blocks:
          - type: paragraph
            body: >-
              No public list-price schedule or realized pricing is available in the assigned evidence. The monetization
              mechanism is inferable only at a high level: transaction and account services for institutional customers,
              with possible payment, foreign-exchange, treasury, lending, and interest income if the bank opens.
              Official or independent evidence does not disclose take rates, minimums, discounts, payment costs,
              sponsor-bank fees, fraud losses, servicing costs, gross margin, CAC, sales cycle, payback, or customer
              concentration. The cost base is likely to expand materially because the proposed bank must meet capital,
              governance, systems, cybersecurity, BSA/AML, sanctions, audit, deposit-insurance, and Federal Reserve
              requirements; however, no public burn or operating-expense schedule quantifies that burden. The correct
              underwriting posture is to treat all unit-economics cells as unavailable and request customer-level
              contribution margins, processor and correspondent costs, compliance staffing costs, and cohort retention
              before modeling payback or margin expansion.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
          - type: table
            tableRef: TI002
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
      - number: '4.3'
        title: Capital adequacy and financial verdict
        blocks:
          - type: paragraph
            body: >-
              Augustus announced a $180 million Series B at a $1 billion valuation on July 21, 2026, and Startup Fortune
              reports total capital raised of $210 million since the 2022 founding. Those figures describe financing at
              the holding-company level; they do not establish how much cash is available to the proposed bank, how much
              is primary versus secondary, or how much has been contributed as regulatory capital. Insights4 reports
              that the OCC decision requires at least $52.5 million of initial paid-in capital, a minimum 10% Tier 1
              leverage ratio during the first three years, independent audit, approved senior executives, tested
              cybersecurity, working BSA and sanctions systems, FDIC deposit insurance, and Federal Reserve
              requirements. DWT likewise states that conditional approval does not permit operations until pre-opening
              requirements, Federal Reserve stock, and FDIC insurance conditions are satisfied. The financing provides
              capacity to pursue those milestones, but the public record does not disclose monthly burn, runway, debt,
              working capital, or a next-round trigger. Financially, the strongest current signal is funded regulatory
              execution; the central blocker is the absence of operating financial statements and bank-opening evidence.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
          - type: table
            tableRef: TI003
            claimRefs:
              - CI009
              - CI010
