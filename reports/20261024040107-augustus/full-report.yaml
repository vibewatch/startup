chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and regulatory status
        blocks:
          - type: paragraph
            body: >-
              Augustus was founded in 2022 by Ferdinand Dabitz, Joshua Becker, Simon Wimmer, and Peter Lieck, according
              to the company announcement. Its stated product is a Global Dollar Bank: an API-first platform intended to
              provide international financial institutions with dollar accounts and payment rails, including SWIFT, ACH,
              SEPA, and stablecoin connectivity. The OCC’s May 8, 2026 decision gives the proposed Augustus National
              Bank, N.A. preliminary conditional approval to organize a full-service insured national bank headquartered
              in Dallas, Texas, with no branches. That is not final authorization to operate. The OCC says final
              approval and opening require all pre-opening requirements, Federal Reserve stock application, and FDIC
              deposit insurance. The FDIC subsequently approved the deposit-insurance application on August 4, 2026,
              subject to conditions, and said its approval expires if the bank is not established within twelve months
              unless extended.
