  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: What is delivered today
        blocks:
          - type: paragraph
            body: >-
              Augustus currently has the strongest public product evidence in its European payment-institution
              operation. The company describes euro clearing for global financial institutions and processing at
              billion-scale, while independent coverage identifies Kraken as a customer and distinguishes that live
              activity from the proposed US dollar bank. The planned US product is an institutional, branchless clearing
              platform rather than a consumer bank: operating and virtual accounts, ACH, wires, stablecoin connectivity,
              and programmable settlement are the intended workflow. However, conditional approval does not permit the
              proposed bank to accept deposits, clear dollars, or open for business, so the US workflow remains a
              pre-launch capability rather than a delivered product.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
