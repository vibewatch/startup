      - number: '1.3'
        title: Funding, valuation, and operating scale
        blocks:
          - type: paragraph
            body: >-
              Augustus announced a $180 million Series B on July 21, 2026 at a $1 billion valuation, led by Tiger Global
              with participation from Hummingbird, QED, and founders associated with Nubank, Ramp, Circle, and Deel. The
              announcement states that total capital raised is $210 million. Independent coverage by The Next Web and
              Startup Fortune repeats those financing figures, while also emphasizing that the charter was still
              conditional. The capital provides an apparent funding base for bank formation, technology, and regulatory
              execution, but it is not the same as bank regulatory capital or cash runway. The OCC decision separately
              requires at least $52.5 million of initial paid-in capital for the proposed bank, net of organizational
              and pre-opening expenses. Augustus and third-party articles describe existing European euro-clearing
              activity and Kraken as a customer, but no reliable public source in this pool supplies revenue, ARR,
              profit, cash burn, headcount, customer count, deposit balances, or customer concentration.
