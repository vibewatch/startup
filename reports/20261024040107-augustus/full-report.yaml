  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and adoption problem
        blocks:
          - type: paragraph
            body: >-
              Augustus' relevant market is regulated, API-accessible dollar clearing and cross-border settlement for
              banks, fintechs, and other financial institutions outside the United States. It is not the entire payments
              market, consumer remittances, retail banking, or every stablecoin transaction. The product thesis sits at
              the infrastructure layer between a financial institution's customer workflow and US dollar rails:
              accounts, ACH, wires, settlement, and potentially stablecoin connectivity. The status quo includes
              correspondent banks, sponsored banking, SWIFT, ACH, SEPA, and internal treasury operations. The central
              adoption problem is distribution and operating hours, not a proven shortage of dollar demand. TBPN reports
              that existing clearing banks can close after 5PM, on weekends, and settle in one to two days, while
              FinTech Futures describes Augustus' initial target as global financial institutions rather than retail
              users or startups. That boundary matters for valuation because the company must convert a large
              transaction pool into regulated infrastructure revenue without assuming every payment dollar is
              addressable.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM010
      - number: '2.2'
        title: Multiple sizing lenses, not a single TAM
        blocks:
          - type: paragraph
            body: >-
              Two external lenses frame the opportunity but are not interchangeable. Grand View Research estimates a
              2026 global cross-border payments market of $193.5 billion and a 2033 value of $312.1 billion, with B2B
              representing 72.8% of 2025 revenue and bank transfers 42.4%. Global Market Insights estimates a separate
              Banking-as-a-Service market of $28.9 billion in 2026, reaching $126.6 billion by 2035.       These figures
              describe different revenue pools and methodologies; they should not be added, treated as Augustus revenue,
              or converted into a bottom-up SAM without customer eligibility and take-rate evidence. Finro's Q1 2026
              dataset supplies a separate valuation reference for the Payments & Transfers category, but its
              mixed-company preview is not a substitute for Augustus operating data. Augustus' own stated target is a
              subset of global financial institutions in South America, Southeast Asia, and the broader Global South,
              with dollar clearing added to an existing euro-clearing product. A constrained sizing view therefore uses
              the market reports as context, then leaves Augustus' SAM and SOM undisclosed rather than inventing a
              share. The valuation relevance is real market depth, but the capture question remains unproven.
            claimRefs:
              - CM001
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM015
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM015
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM005
              - CM006
              - CM008
              - CM009
      - number: '2.3'
        title: Buyers, drivers, and constraints
        blocks:
          - type: paragraph
            body: >-
              The primary buyer is a regulated or regulated-adjacent financial institution that needs dollar access,
              settlement, or programmable payment infrastructure; the end user may be the institution's treasury,
              payments, compliance, or product team, and the economic payer is likely the institution or its platform
              business. FinTech Futures says Augustus is targeting banks in South America, Southeast Asia, and the
              broader Global South, not retail customers or startups, while Startup Fortune describes a single API
              spanning dollar accounts, ACH, wires, and stablecoin rails. Adoption drivers are always-on settlement,
              reduced correspondent-bank handoffs, faster launch of financial products, and the ability to package
              compliance with APIs. Constraints are equally material: a conditional charter is not an operating bank,
              required FDIC insurance and other pre-opening conditions remain gating items, and stablecoin rules impose
              reserve, reporting, custody, and risk-management obligations. Bilzin's review of bank-fintech disputes
              also shows that outsourced compliance can create shared liability. The buyer map therefore supports a
              focused infrastructure thesis, but not a fast or frictionless adoption curve.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
