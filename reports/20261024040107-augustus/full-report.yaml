            title: Regulatory readiness gates the serviceable market
            body: >-
              Augustus' conditional charter creates differentiation, but FDIC insurance, pre-opening conditions, and
              stablecoin controls determine whether the proposed buyer market is actually serviceable.
            calloutType: risk
            claimRefs:
