      - number: '1.2'
        title: Leadership and governance
        blocks:
          - type: paragraph
            body: >-
              The founder-led parent is paired with a bank operating team recruited for regulatory and functional
              coverage. Banking Dive identifies Dabitz as the proposed CEO and Greg Quarles as the presumptive
              president; it reports that Quarles served as CEO of Green Dot Bank, United Texas Bank, and H&R Block Bank
              and spent more than seventeen years at the OCC. The same report names Joe Schenone as presumptive CFO and
              Andy Riggs as presumptive chief credit officer. This combination addresses an obvious key-person risk:
              Dabitz is central to the strategy and public narrative, while the proposed bank must demonstrate
              independent management, controls, and board readiness to supervisors. Public sources do not establish the
              full board, finalized reporting lines, CTO succession, or the size and depth of the engineering and
              control teams.
