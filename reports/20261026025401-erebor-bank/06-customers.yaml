company:
  name: Erebor Bank
chapter:
  number: 6
  title: Customers
  summary: Erebor is positioning itself as a specialized, branchless national bank for technology, crypto, defense, AI, and advanced-manufacturing clients, with early public evidence centered on target-market demand and deposit formation rather than mature retention or lending outcomes. Reported customer growth and the bank's Sui integration are promising adoption signals, but public sources do not yet establish active-account quality, cohort retention, revenue concentration, or production credit performance.
sections:
  - id: customer-segments
    title: Target customers and buying proposition
    body: >-
      Erebor's customer thesis is deliberately narrow: it targets technology companies,
      virtual-currency participants, defense and advanced-manufacturing businesses, and
      related high-net-worth individuals rather than a mass retail base. The FDIC describes
      the proposed business model as deposit and lending products for businesses and
      individuals in technology, payment systems, investment, and defense, including
      virtual-currency market participants. Banking Dive reports a more operational
      segmentation around startups and high-net-worth individuals in cryptocurrency,
      artificial intelligence, defense, and manufacturing, while the Bit.Fan account
      frames the unmet need as reliable banking for complex, compliance-intensive sectors
      after Silicon Valley Bank's collapse. This specialization can make Erebor's product
      more relevant to founders whose needs include treasury, payments, lending, and
      digital-asset access, but it also concentrates the deposit franchise in correlated
      sectors. The public record identifies intended users and use cases; it does not
      disclose a customer-level segmentation by payer, account type, geography, or
      revenue band.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: adoption-and-proof
    title: Adoption trajectory and named proof
    body: >-
      The strongest adoption evidence is a reported increase from $1.1 billion of deposits
      at the end of March to approximately $4.05 billion three months later, alongside
      nearly 400 new customers, as reported by The Crypto Times. Those figures are
      attributed to people familiar with Erebor's financials and are not accompanied by
      an active-account denominator, customer names, average balances, or independent
      confirmation, so they should be treated as third-party reported rather than audited
      operating KPIs. Banking Dive supplies an earlier launch snapshot: the bank opened
      with $635 million in capital and several potential defense and technology clients
      in waiting. The Sui-related announcement summarized in the Substack source is more
      concrete product adoption proof because it describes stablecoin deposits and
      withdrawals for Erebor customers, but the same source explicitly says it does not
      establish customer scale, transaction volume, or broader commercial adoption.
      Accordingly, the evidence supports early demand and ecosystem integration, not
      durable production usage or customer success outcomes.
    claimRefs: [CU005, CU006, CU007, CU008, CU016]
    tableRefs: [TU002, TU003]
    figureRefs: [FU001]
  - id: durability-and-expansion
    title: Retention, expansion, and concentration diligence
    body: >-
      Public sources do not disclose NRR, GRR, churn, renewal rates, contract lengths,
      cohort behavior, satisfaction scores, or named customer outcomes. The reported
      deposit growth therefore cannot be treated as retention or expansion: it may reflect
      new balances, concentrated relationships, or a changing mix of large accounts. The
      bank's intended product surface—deposits, lending, payments, custody, and
      stablecoin-related treasury services—could support land-and-expand if customers
      adopt several products, but the available evidence does not show cross-sell,
      repeat usage, loan utilization, or fee revenue by customer. AInvest's analysis
      identifies the narrower liability base implied by Erebor's sector specialization
      as a potential source of concentration and higher funding costs. That is an
      analytical risk, not evidence that Erebor has already experienced deposit
      instability. Erebor's customer concentration, uninsured share, and liquidity
      behavior remain undisclosed, making these the central customer-quality and
      durability questions for underwriting.
    claimRefs: [CU009, CU010, CU011, CU012]
    tableRefs: []
  - id: customer-diligence
    title: Investor diligence implications
    body: >-
      The customer case is credible at the market-fit level but incomplete at the
      account-quality level. Regulators approved a model aimed at technology, payment,
      investment, defense, and virtual-currency customers, and independent reporting
      describes a post-SVB gap that can motivate switching. Yet the evidence does not
      separate committed customers from prospects, deposits from revenue-producing
      relationships, or one-time onboarding from recurring activity. Venture-debt market
      evidence also shows that lenders are favoring companies with revenue visibility,
      retention, margins, and contracted cash flows, which raises a practical test for
      Erebor's own customer base: can it demonstrate similarly underwritable customer
      quality while serving earlier-stage and volatile sectors? The next diligence step
      should obtain anonymized cohort tables, top-20 deposit and revenue concentration,
      uninsured balances, product penetration, renewal/churn history, and named
      production references. Until then, the customer thesis merits monitoring rather
      than a conclusion that adoption is durable.
    claimRefs: [CU013, CU014, CU015]
    tableRefs: []
