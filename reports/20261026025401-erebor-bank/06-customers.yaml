    title: Customer journey from sector fit to expansion
    type: journey-map
    summary: "Erebor's public evidence supports a path from specialized-sector need to account onboarding and payments integration, while retention and expansion remain unverified."
    data:
      items:
        - label: Sector need
          title: Sector need
          description: "Technology, crypto, AI, defense, and manufacturing businesses seek banking that understands complex or compliance-intensive workflows."
          touchpoints: ["Post-SVB banking gap", "Sector-specific underwriting need"]
          claimRefs: [CU002, CU003]
        - label: Account acquisition
          title: Account acquisition
          description: "Erebor targets deposits and lending relationships through a branchless national-bank model."
          touchpoints: ["Deposits", "Lending", "Treasury management"]
          claimRefs: [CU001, CU004]
        - label: Initial adoption
          title: Initial adoption
          description: "Public reporting describes rapid deposit growth, nearly 400 new customers, and launch prospects."
          touchpoints: ["Reported deposit growth", "Potential defense and technology clients"]
          claimRefs: [CU005, CU006, CU016]
        - label: Payments integration
          title: Payments integration
          description: "The Sui integration provides a concrete path for stablecoin deposits and withdrawals for Erebor customers."
          touchpoints: ["Stablecoin deposits", "Stablecoin withdrawals"]
          claimRefs: [CU007]
        - label: Multi-product relationship
          title: Multi-product relationship
          description: "Deposits, lending, payments, custody, and treasury could create expansion, but cross-sell and usage are not disclosed."
          touchpoints: ["Lending utilization", "Payments volume", "Custody / treasury use"]
          claimRefs: [CU008, CU009]
        - label: Durability proof
          title: Durability proof
          description: "Retention, renewal, concentration, and customer outcomes are the unresolved proof points before treating growth as durable."
          touchpoints: ["Cohort retention", "Top-account concentration", "Production references"]
          claimRefs: [CU010, CU011, CU012]
    approximationNotes: "The sequence is an analytical representation of disclosed customer surfaces, not a measured conversion funnel; no conversion rates or stage volumes are inferred."
    claimRefs: [CU005, CU007, CU009, CU010]
callouts:
  - calloutType: strength
    title: Specialized market fit is externally legible
    body: "Regulatory approvals and independent reporting consistently identify technology, crypto, defense, AI, manufacturing, and related innovation-economy customers as the intended segment."
    claimRefs: [CU001, CU002, CU003]
  - calloutType: risk
    title: Growth is not yet retention proof
    body: "Reported deposits and customer additions lack active-account, cohort, uninsured-balance, product-penetration, and revenue-concentration denominators."
    claimRefs: [CU005, CU009, CU010, CU011]
  - calloutType: recommendation
    title: Request customer-quality evidence before underwriting durability
    body: "Obtain anonymized cohorts, top-account concentration, uninsured deposits, product usage, churn or renewal history, and named production references."
    claimRefs: [CU012, CU013, CU015]
