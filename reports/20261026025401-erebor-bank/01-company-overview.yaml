  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: funding
      missingEvidence: "A reconciled cap table showing closed rounds, investor ownership, security classes, preferences, and use of proceeds."
      whyItMatters: "Reported funding and valuation markers cannot be converted into ownership, dilution, or available regulatory capital without transaction documents."
      diligencePath: "Request the latest capitalization table, subscription agreements, board approvals, and capital-account reconciliation under confidentiality."
      relatedQuestionRefs: [QO004]
      relatedTableRefs: [TO003]
    - type: private-evidence-only
      severity: material
      topic: governance
      missingEvidence: "Complete current board, committee, senior-management, succession, and related-party disclosures."
      whyItMatters: "Founder influence and regulatory scrutiny make oversight coverage and key-person concentration material to underwriting."
      diligencePath: "Obtain board minutes, committee charters, fit-and-proper materials, executive employment terms, and succession plans."
      relatedQuestionRefs: [QO003, QO009]
      relatedTableRefs: [TO002]
    - type: private-evidence-only
      severity: material
      topic: scale
      missingEvidence: "Deposit composition, insured and uninsured balances, customer concentration, retention, revenue, profitability, and credit performance."
      whyItMatters: "Rapidly reported deposits and customer additions can be volatile and do not establish durable bank economics."
      diligencePath: "Request monthly deposit and customer cohorts, concentration schedules, audited or management financials, loan book detail, and early-loss metrics."
      relatedQuestionRefs: [QO005, QO008, QO009]
      relatedTableRefs: [TO001]
    - type: conflicting-data
      severity: material
      topic: regulatory-process
      missingEvidence: "Documented response to the Senate inquiry and underlying fundraising memo provenance."
      whyItMatters: "The Senate letter raises allegations about political influence while the OCC states that ordinary rigorous standards were applied."
      diligencePath: "Review the memo, correspondence, meeting records, agency conditions, and any formal response or subsequent committee finding."
