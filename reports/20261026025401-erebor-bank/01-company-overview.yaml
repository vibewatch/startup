callouts:
  - calloutType: strength
    title: Verified charter foundation
    body: OCC conditional approval and FDIC deposit-insurance approval are supported by primary government releases.
    claimRefs: [CO009, CO010]
  - calloutType: risk
    title: Reported scale is not audited scale
    body: Deposit, customer, valuation, and funding figures remain third-party reports or preliminary discussions and do not establish revenue, profitability, or cash available.
    claimRefs: [CO012, CO013, CO014, CO015]
  - calloutType: recommendation
    title: Prioritize governance and deposit diligence
    body: Obtain the final cap table, board materials, regulatory conditions, deposit concentration, customer retention, and responses to the Senate inquiry before underwriting reported valuation marks.
    claimRefs: [CO007, CO008, CO013, CO014, CO015, CO016]
