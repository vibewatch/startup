evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: funding
    missingEvidence: >-
      A reconciled cap table showing closed rounds, investor ownership, security classes, preferences, and use of
      proceeds.
    whyItMatters: >-
      Reported funding and valuation markers cannot be converted into ownership, dilution, or available regulatory
      capital without transaction documents.
    diligencePath: >-
      Request the latest capitalization table, subscription agreements, board approvals, and capital-account
      reconciliation under confidentiality.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Complete current board, committee, senior-management, succession, and related-party disclosures.
    whyItMatters: >-
      Founder influence and regulatory scrutiny make oversight coverage and key-person concentration material to
      underwriting.
    diligencePath: >-
      Obtain board minutes, committee charters, fit-and-proper materials, executive employment terms, and succession
      plans.
    relatedQuestionRefs:
      - QO003
      - QO009
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: scale
    missingEvidence: >-
      Deposit composition, insured and uninsured balances, customer concentration, retention, revenue, profitability,
      and credit performance.
    whyItMatters: Rapidly reported deposits and customer additions can be volatile and do not establish durable bank economics.
    diligencePath: >-
      Request monthly deposit and customer cohorts, concentration schedules, audited or management financials, loan book
      detail, and early-loss metrics.
    relatedQuestionRefs:
      - QO005
      - QO008
      - QO009
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: regulatory-process
    missingEvidence: Documented response to the Senate inquiry and underlying fundraising memo provenance.
    whyItMatters: >-
      The Senate letter raises allegations about political influence while the OCC states that ordinary rigorous
      standards were applied.
    diligencePath: >-
      Review the memo, correspondence, meeting records, agency conditions, and any formal response or subsequent
      committee finding.
    relatedQuestionRefs:
      - QO007
  - type: private-evidence-only
    severity: material
    topic: sizing-gaps
    missingEvidence: >-
      A bottom-up account universe, expected deposit balances, lending demand, payment volumes, pricing, and conversion
      funnel for each target segment.
    whyItMatters: Sector-wide stablecoin and venture figures cannot establish Erebor's SAM, SOM, revenue, or valuation support.
    diligencePath: >-
      Obtain management's segmented pipeline, signed or active customer counts, balance assumptions, pricing schedule,
      and cohort conversion data.
    relatedQuestionRefs:
      - QM005
      - QM008
    relatedTableRefs:
      - TM002
      - TM003
  - type: conflicting-data
    severity: material
    topic: stablecoin-sizing
    missingEvidence: >-
      A consistent bridge reconciling stablecoin market forecasts, venture-capital flows, target-company cash balances,
      and Erebor's monetizable products.
    whyItMatters: >-
      The retained lenses span different populations, units, periods, and methodologies, so selecting or summing them as
      TAM would overstate opportunity.
    diligencePath: >-
      Commission an independent bottom-up market-sizing memo that separates stock, flow, geography, customer
      eligibility, wallet share, and forecast horizon.
    relatedQuestionRefs:
      - QM004
      - QM007
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: adoption-constraints
    missingEvidence: Independent customer references, pricing evidence, retention data, and early credit-performance disclosures.
    whyItMatters: >-
      The wedge thesis depends on adoption and underwriting quality, neither of which is demonstrated by regulatory
      authorization alone.
    diligencePath: >-
      Request anonymized customer cohorts, renewal and attrition data, pricing/fee schedules, credit policy,
      delinquencies, and loss reserves.
    relatedQuestionRefs:
      - QM005
      - QM008
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: comparative-economics
    missingEvidence: >-
      Comparable list and realized pricing, minimum balances, discounts, implementation costs, product SLAs, and credit
      terms for Erebor and named peers.
    whyItMatters: >-
      Without common-unit commercial terms, the analysis cannot determine whether specialization creates pricing power
      or merely adds operating cost.
    diligencePath: >-
      Obtain term sheets, fee schedules, procurement records, customer invoices, and structured mystery-shopping results
      for each material option.
    relatedQuestionRefs:
      - QP003
      - QP004
    relatedTableRefs:
      - TP002
      - TP003
  - type: private-evidence-only
    severity: material
    topic: switching-costs
    missingEvidence: >-
      Customer cohort retention, primary-bank share, product attach rates, migration duration, multi-homing, churn
      reasons, and renewal behavior.
    whyItMatters: Early customer and deposit growth does not establish durable lock-in or distribution efficiency.
    diligencePath: >-
      Review cohort tables and customer-level product usage under NDA, then interview won, lost, and multi-banked
      accounts.
    relatedQuestionRefs:
      - QP005
      - QP008
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: partner-dependency
    missingEvidence: >-
      Partner identities, economics, redundancy, service levels, and control boundaries for cards, custody, stablecoin,
      and payments workflows.
    whyItMatters: >-
      Undisclosed dependencies can weaken product differentiation, compress margins, or create operational
      concentration.
    diligencePath: Review material contracts, SLAs, incident records, contingency plans, and customer responsibility matrices.
    relatedQuestionRefs:
      - QP004
      - QP006
      - QP008
    relatedTableRefs:
      - TP002
  - type: missing-source
    severity: material
    topic: competitor-performance
    missingEvidence: >-
      Comparable market share, approval speed, loss performance, uptime, and customer outcomes for the direct and
      adjacent competitor set.
    whyItMatters: Feature presence alone cannot establish that Erebor delivers a better or more durable buyer outcome.
    diligencePath: >-
      Reconcile regulatory filings, customer references, service reports, and lender-level performance data on common
      periods and denominators.
    relatedQuestionRefs:
      - QP002
      - QP007
      - QP008
    relatedTableRefs:
      - TP001
      - TP002
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: >-
      Audited income statements, balance sheets, cash-flow statements, current cash, burn, runway, liquidity stress
      tests, and financing terms.
    whyItMatters: >-
      Without these inputs, reported deposit and revenue growth cannot be translated into solvency, runway, or valuation
      support.
    diligencePath: >-
      Request a current financial package, regulatory capital reports, liquidity profile, board-approved plan, and
      executed financing documents under NDA.
    relatedQuestionRefs:
      - QI006
      - QI009
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Customer cohorts, deposit concentration, realized pricing, servicing cost, CAC, retention, net interest margin,
      and contribution margin.
    whyItMatters: >-
      High revenue per relationship may reflect concentrated balances rather than durable, profitable customer
      economics.
    diligencePath: >-
      Obtain monthly cohort data, top-account concentration, deposit repricing, product-level P&L, and acquisition-cost
      analysis.
    relatedQuestionRefs:
      - QI003
      - QI004
  - type: enumeration-incomplete
    severity: material
    topic: credit
    missingEvidence: >-
      Loan-book composition, collateral haircuts, underwriting policy, delinquencies, charge-offs, provisions, and
      recoveries.
    whyItMatters: Specialized lending can create materially different loss and capital behavior from ordinary deposit banking.
    diligencePath: >-
      Request a loan tape, risk-rating migration, concentration limits, collateral policies, stress tests, and allowance
      methodology.
    relatedQuestionRefs:
      - QI005
      - QI009
  - type: private-evidence-only
    severity: material
    topic: technical-disclosure
    missingEvidence: >-
      A public or diligence-accessible architecture package covering the core banking system, cloud and data topology,
      APIs, vendors, uptime, security testing, recovery objectives, and incident history.
    whyItMatters: >-
      The product surface is broad and regulated, so technical resilience and control effectiveness are central to
      whether the charter can scale safely.
    diligencePath: >-
      Request architecture diagrams, vendor contracts, SOC or equivalent control reports, penetration-test summaries,
      uptime history, recovery tests, and incident postmortems under NDA.
    relatedQuestionRefs:
      - QE005
      - QE007
      - QE009
  - type: private-evidence-only
    severity: material
    topic: developer-signal
    missingEvidence: >-
      A developer or practitioner signal such as public API documentation, release history, package activity,
      integration metrics, or named engineering talks.
    whyItMatters: >-
      No assigned source verifies that the described digital-first and API-oriented operating model exists at production
      depth.
    diligencePath: >-
      Request authenticated API documentation, integration count, release cadence, support metrics, and engineering or
      operations references; if unavailable, treat technical maturity as unverified.
    relatedQuestionRefs:
      - QE008
  - type: missing-source
    severity: material
    topic: stablecoin
    missingEvidence: >-
      Evidence of live stablecoin issuance, reserve management, redemption operations, smart-contract controls, and
      final regulatory permissions.
    whyItMatters: Stablecoin functionality is a central differentiator but remains a roadmap claim in the assigned evidence.
    diligencePath: >-
      Verify launch status, applicable final rules, reserve attestations, custody arrangements, contract audits,
      redemption SLAs, and transaction-monitoring controls.
    relatedQuestionRefs:
      - QE005
      - QE006
  - type: private-evidence-only
    severity: material
    topic: lending
    missingEvidence: >-
      Portfolio-level data on loan approvals, collateral, concentrations, delinquencies, losses, and crypto-backed
      lending demand.
    whyItMatters: The lending product is a core balance-sheet function and a direct source of credit and concentration risk.
    diligencePath: >-
      Request anonymized vintage and risk reports, underwriting policy, collateral haircuts, watchlist data, and
      management's explanation of lower-than-expected crypto-backed demand.
    relatedQuestionRefs:
      - QE006
  - type: private-evidence-only
    severity: material
    topic: retention-gap
    missingEvidence: >-
      Monthly active accounts, cohort retention, churn, renewal, satisfaction, and product-penetration data by customer
      segment.
    whyItMatters: >-
      Reported deposits and customer additions cannot be converted into durable adoption or expansion evidence without
      cohort and usage denominators.
    diligencePath: >-
      Request anonymized monthly cohorts for the last four quarters, including active accounts, balances, products used,
      churn, renewals, and expansion revenue.
    relatedQuestionRefs:
      - QU005
  - type: private-evidence-only
    severity: material
    topic: concentration-gap
    missingEvidence: >-
      Top-20 depositors, top revenue accounts, uninsured deposit share, average balances, and concentration by sector
      and channel.
    whyItMatters: >-
      A specialized technology and crypto deposit base may be correlated and vulnerable to rapid outflows even when
      headline balances grow.
    diligencePath: >-
      Obtain a redacted concentration schedule and liquidity stress tests segmented by customer type, insurance status,
      and counterparty.
    relatedQuestionRefs:
      - QU007
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: >-
      At least three named production customers with account status, use case, tenure, product usage, and independently
      verifiable outcomes.
    whyItMatters: >-
      Potential clients and an integration announcement do not establish production deployment, customer success, or
      reference quality.
    diligencePath: >-
      Secure permissioned customer references and contracts or redacted onboarding records distinguishing pilot, signed,
      and active production relationships.
    relatedQuestionRefs:
      - QU004
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: minor
    topic: customer-outcomes
    missingEvidence: Independent customer reviews, procurement records, or named testimonials with measurable outcomes.
    whyItMatters: >-
      The current pool contains market and regulatory evidence but little arms-length evidence of customer satisfaction
      or realized benefits.
    diligencePath: >-
      Search and review customer-authored announcements, procurement records, marketplace reviews, and conference talks
      in the next refresh.
    relatedQuestionRefs:
      - QU002
      - QU004
  - type: private-evidence-only
    severity: blocking
    topic: compliance
    missingEvidence: Independent BSA/AML, sanctions, cybersecurity, model-risk, and vendor-risk testing plus regulator correspondence.
    whyItMatters: >-
      The business model includes virtual-currency activity and specialized collateral, so control effectiveness is
      central to legal and operating viability.
    diligencePath: >-
      Request the latest independent control reports, examination results, remediation tracker, staffing plan, and board
      risk-committee materials under confidentiality.
    relatedQuestionRefs:
      - QR003
      - QR007
    relatedTableRefs:
      - TR001
      - TR002
  - type: enumeration-incomplete
    severity: material
    topic: concentration
    missingEvidence: >-
      Deposit and asset concentration by sector, counterparty, product, geography, and cohort, including uninsured
      balances.
    whyItMatters: A narrow innovation-economy franchise may create correlated liquidity and credit losses during sector stress.
    diligencePath: >-
      Obtain deposit tapes, top-account concentration, withdrawal history, loan book stratification, and liquidity
      stress tests.
    relatedQuestionRefs:
      - QR005
      - QR006
    relatedTableRefs:
      - TR003
  - type: missing-source
    severity: material
    topic: financial-model
    missingEvidence: Audited financial statements, profitability, asset-quality, loss-rate, and capital-adequacy disclosures.
    whyItMatters: Funding and valuation headlines do not establish cash available, earnings quality, or loss absorption.
    diligencePath: Request audited or regulator-filed financials, capital plan, liquidity plan, and current financing terms.
    relatedQuestionRefs:
      - QR002
      - QR009
    relatedTableRefs:
      - TR003
  - type: access-blocked
    severity: minor
    topic: political-scrutiny
    missingEvidence: >-
      The referenced April 2026 Senate letter in the assigned pool was fetched as a Senate access-error page rather than
      the letter.
    whyItMatters: >-
      Political scrutiny may affect governance and supervisory perception, but the inaccessible document cannot support
      a substantive claim.
    diligencePath: >-
      Obtain the original letter through an accessible official copy or congressional record before relying on its
      details.
    relatedQuestionRefs:
      - QR008
  - type: private-evidence-only
    severity: blocking
    topic: transaction-terms
    missingEvidence: Signed financing documents, cap table, liquidation preferences, anti-dilution provisions, and final close price.
    whyItMatters: >-
      The reported $8 billion pre-money valuation is a negotiation report, not a verified transaction price or an
      investor return basis.
    diligencePath: >-
      Obtain executed financing documents, capitalization table, investor rights agreement, and board-approved round
      materials under confidentiality.
    relatedQuestionRefs:
      - QV001
      - QV008
    relatedTableRefs:
      - TV001
      - TV003
  - type: private-evidence-only
    severity: blocking
    topic: financial-disclosure
    missingEvidence: >-
      Audited revenue, net interest income, fee revenue, operating expenses, credit losses, capital, liquidity, and
      deposit concentration by segment.
    whyItMatters: >-
      Without bank-specific earnings and risk metrics, public comparables cannot support a precise valuation or target
      return.
    diligencePath: >-
      Request audited or management-prepared financial statements, regulatory call reports when available, liquidity
      schedules, and cohort-level deposit and retention data.
    relatedQuestionRefs:
      - QV003
      - QV005
      - QV006
    relatedTableRefs:
      - TV002
      - TV003
  - type: missing-source
    severity: material
    topic: adverse
    missingEvidence: >-
      Current supervisory correspondence, compliance testing, AML/sanctions findings, and any remediation or enforcement
      history.
    whyItMatters: >-
      The model serves virtual-currency and other high-scrutiny sectors, so compliance execution directly affects
      capital, liquidity, and franchise value.
    diligencePath: >-
      Obtain regulator correspondence, independent compliance reports, model-validation results, and a schedule of open
      remediation items.
    relatedQuestionRefs:
      - QV002
      - QV007
    relatedTableRefs:
      - TV002
      - TV003
