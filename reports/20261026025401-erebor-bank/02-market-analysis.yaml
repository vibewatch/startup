    columns: [Segment, Buyer, User, Payer, Workflow, Budget owner, Adoption trigger]
    rows:
      - [AI and advanced-manufacturing companies, "CFO / treasury lead", "Finance and operations teams", "Operating company", "Deposits, treasury, payments, equipment or working-capital credit", "CFO / treasury", "Specialized underwriting or reliable regulated banking access"]
      - [Defense-technology companies, "CFO / finance lead", "Treasury and program operations", "Operating company", "Deposits, contract-linked liquidity, and specialized credit", "CFO / corporate finance", "Bank understands defense assets and contracts"]
      - [Crypto and stablecoin firms, "Founder / treasury lead", "Payments and compliance operations", "Operating company or fund", "Fiat rails, stablecoin settlement, and compliant account access", "Treasury / compliance", "Need for regulated digital-asset banking connectivity"]
      - [Payment service providers, "Product or treasury executive", "Payments operations", "Provider", "Institutional settlement and liquidity management", "Treasury / product", "API or settlement access within a bank charter"]
    notes: "The buyer map is an evidence-constrained operating hypothesis based on named customer categories and described products; customer counts, pricing, and conversion rates are not publicly disclosed."
    claimRefs: [CM001, CM002, CM003, CM011, CM016]

figures:
  - id: FM001
    title: Evidence hierarchy from sector scale to missing company SAM
    type: pyramid
    summary: Broad stablecoin metrics narrow toward an unresolved Erebor-specific serviceable market and revenue pool.
    data:
      items:
        - label: 2025 stablecoin market
          value: 300
          unit: USD billions
          valueNote: "Mordor Intelligence estimate; not Erebor TAM"
        - label: 2026 stablecoin market
          value: 330
          unit: USD billions
          valueNote: "Mordor Intelligence estimate; not Erebor TAM"
        - label: 2031 stablecoin market
          value: 1160
          unit: USD billions
          valueNote: "Mordor Intelligence forecast; not Erebor TAM"
        - label: Fiat-backed share in 2025
          value: 92.3
          unit: percent
          valueNote: "Collateral-type share, not a market-size layer"
        - label: Cross-border payments CAGR
          value: 36.5
          unit: percent through 2031
          valueNote: "Application-segment forecast"
        - label: Financial institutions and payment providers CAGR
          value: 34.2
          unit: percent through 2031
          valueNote: "End-user-segment forecast"
        - label: Erebor-specific SAM and SOM
          value: null
          unit: not publicly disclosed
          valueNote: "Requires a bottom-up customer, balance, pricing, and conversion bridge"
    approximationNotes: "The first three items preserve Mordor Intelligence's market estimates; the next three are separate mix or growth metrics, and the final unavailable item marks the company-specific evidence gap. Items are not additive pyramid layers."
    claimRefs: [CM005, CM006, CM009, CM015, CM016]

callouts:
  - calloutType: insight
    title: A credible wedge, not a quantified TAM
    body: Erebor's strongest market argument is specialized access for innovation-economy companies; the public record does not yet support converting sector-scale stablecoin or venture figures into a bank-specific serviceable market.
    claimRefs: [CM001, CM005, CM007, CM016]
  - calloutType: risk
    title: Concentration and disclosure are the gating risks
    body: Regulatory authorization and sector growth do not establish customer conversion, deposit durability, credit performance, or profitability; a bottom-up customer and balance-sheet bridge remains necessary.
    claimRefs: [CM012, CM013, CM014, CM016]

