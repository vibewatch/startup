artifact: market-analysis
slug: erebor-bank
runDate: 2026-10-26
company:
  name: Erebor Bank
chapter:
  number: 2
  title: Market Analysis
  summary: Erebor addresses a narrow banking-access and underwriting gap for innovation-economy companies rather than a mass-market banking opportunity. Public evidence supports a large and growing surrounding stablecoin and innovation-economy market, but it does not isolate Erebor's serviceable market, customer conversion, or durable revenue pool.
sections:
  - id: market-boundary
    title: Market boundary and status quo
    body: >-
      Erebor's relevant market is specialized commercial banking and payments for
      companies and investors connected to AI, crypto, defense technology, advanced
      manufacturing, and related payment-service businesses. The FDIC describes the
      proposed business model as deposit and lending products for technology, payment
      systems, investment, and defense industries, including virtual-currency
      participants. Reporting on the charter application similarly identifies
      cryptocurrency, artificial intelligence, defense, and manufacturing businesses
      as intended customers. This boundary excludes retail
      banking, general-purpose consumer finance, and every dollar of global crypto
      transaction volume: the relevant spend is deposit custody, treasury, payments,
      working capital, and specialized credit. The status quo is a mix of incumbent
      commercial banks, sponsor-bank fintech platforms, correspondent relationships,
      and private credit. Erebor's owned charter and balance sheet are differentiators,
      but the sources do not show that customers cannot substitute those alternatives.
    claimRefs: [CM001, CM002, CM003, CM004]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: Sizing lenses and market momentum
    body: >-
      The evidence supports multiple market lenses, not a single Erebor TAM. Stablecoin
      market data provides a payments-adjacency lens: Mordor Intelligence estimates
      the market at $0.33 trillion in 2026 and forecasts $1.16 trillion in 2031, with
      a 28.77% CAGR over 2026-2031. It separately projects 36.5% CAGR for cross-border
      payments and remittances and 34.2% CAGR for financial institutions and payment
      service providers. These are publisher estimates for the stablecoin sector, not
      Erebor revenue or addressable deposits. A second lens is innovation-economy
      capital: Crunchbase reports $392 billion invested in U.S. and Canadian startups
      in H1 2026 and says Q2 capital was concentrated in giant rounds. J.P. Morgan says
      89% of H1 venture capital flowed to AI-focused companies, while Crunchbase gives
      an approximately 80% Q2 share. The periods and category definitions differ, so
      these percentages should not be forced into one series. Together, the lenses show
      sector liquidity and payment-rail growth, not a defensible Erebor SAM or SOM.
    claimRefs: [CM005, CM006, CM007, CM008, CM009, CM010]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyers-drivers-constraints
    title: Buyers, adoption path, and constraints
    body: >-
      The buyer is likely a financially sophisticated company, fund, payment provider,
      or high-net-worth participant whose treasury or operating workflow touches a
      target sector; the user is treasury, finance, operations, or payments staff; and
      the payer is the organization funding deposits, payments, and credit. The adoption
      trigger is a concrete gap: difficulty obtaining compliant fiat rails, a need for
      specialized collateral underwriting, or a requirement for regulated stablecoin
      settlement. Regulatory approval reduces one access constraint, but does not remove
      the execution burden. The FDIC requires a 12% Tier 1 leverage ratio for the first
      three years and a capital-call mechanism if the bank falls below required capital
      levels. The charter path began with preliminary conditional OCC approval, and
      prudential requirements remain material even after opening. Concentration is a
      structural adoption and valuation constraint: a narrow customer base can create
      large balances but also correlated deposit and credit exposure. Public materials
      do not disclose the number of customers, conversion rates, pricing, retention,
      or risk-adjusted profitability, so those remain diligence gates.
    claimRefs: [CM011, CM012, CM013, CM014, CM015, CM016]
    tableRefs: [TM003]
  - id: exhibits
    title: Evidence limits
    body: >-
      The market case is strongest as a wedge thesis: Erebor can serve a specialized
      segment where charter ownership, technical underwriting, and stablecoin-native
      payments may matter. It is weaker as a quantified underwriting case because public
      sources do not disclose a clean boundary between total sector activity and
      addressable bank revenue. The sizing table therefore preserves source vintage,
      geography, units, and methodology, while the figure presents separate lenses
      rather than a funnel or additive TAM/SAM/SOM bridge. The principal diligence
      requirement is a bottom-up bridge from target accounts and expected balances to
      deposits, loan demand, fee revenue, loss rates, and capital consumption.
    claimRefs: [CM005, CM007, CM015, CM016]

