    notes: "Values are separate lenses with different populations, units, dates, and methodologies; null means the cited source did not provide a comparable growth rate, and no row is an Erebor TAM/SAM/SOM."
    claimRefs: [CM005, CM006, CM007, CM008, CM009, CM010, CM015]
