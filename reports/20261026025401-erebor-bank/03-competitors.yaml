      - ["Tokenized commercial-bank infrastructure", "Adjacent substitute", "BIS describes a model centered on central-bank reserves and commercial-bank money", "Institutions seeking programmable settlement", "Programmability without relying on stablecoins as the monetary core", "System-level alternative rather than a single purchasable peer"]
