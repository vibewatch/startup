      - ["Frontier-sector target focus", "Supported for crypto, AI, defense, and manufacturing", "Possible but not quantified", "Startup focus reported; sector depth unknown", "Crypto depth plausible; AI and defense breadth unknown", "Internal expertise required"]
      - ["Stablecoin-related services", "Listed in Erebor's CRA plan", "Unknown by named incumbent in this pool", "Unknown", "Likely overlap reported by Royco; exact scope unknown", "Requires separate provider"]
      - ["Fiduciary custody", "Not provided under the disclosed plan", "Unknown", "Unknown", "Potential specialist advantage; provider-specific proof limited", "Requires incumbent or specialist"]
      - ["Lifecycle and distribution breadth", "Not publicly quantified", "JPMorgan reports seed-to-IPO coverage and nearly 12,000 clients", "Digital distribution is competitive; metrics unavailable", "Institutional digital-asset distribution varies", "Multiple existing relationships may reduce migration risk"]
      - ["Public product and pricing detail", "No list pricing in assigned evidence; public site is minimal", "No comparable terms in assigned evidence", "No comparable terms in assigned evidence", "No comparable terms in assigned evidence", "Internal cost not disclosed"]
    notes: "Supported cells reflect only the assigned fetched evidence; unknown means the pool does not establish the capability, not that the provider lacks it."
    claimRefs: [CP002, CP003, CP004, CP005, CP007, CP008, CP009, CP010, CP011, CP016]
  - id: TP003
    title: Pricing and packaging evidence
    columns: [Option, Public price or unit, Disclosed package, Discount or contract evidence, Competitive implication]
    rows:
      - [Erebor, "Not disclosed", "Deposits, credit, treasury, payments, data processing, stablecoin-related services; cards through partners", "No list price, realized rate, minimum balance, or discount schedule in the pool", "Integration may support relationship pricing, but pricing power is unproven"]
      - [JPMorgan startup banking, "Not disclosed", "Core banking plus broader private-bank, investment-bank, and international lifecycle coverage", "No comparable contract terms in the pool", "Breadth can offset a less specialized sector proposition"]
      - ["SVB / First Citizens", "Not disclosed", "Specialized startup and venture banking is the relevant incumbent package", "No current package terms in the pool", "Legacy relationships and category knowledge remain a switching barrier"]
      - ["Mercury, Ramp, and Brex", "Not disclosed", "Digital startup-banking or financial-workflow alternatives", "No comparable contract terms in the pool", "Software experience can compete even without matching every chartered-bank feature"]
      - ["Internal multi-provider stack", "Private and vendor-specific", "Existing bank plus payments, custody, and treasury vendors", "Migration cost and vendor discounts are unknown", "Avoided migration can outweigh integration benefits until Erebor proves service or economic gains"]
    notes: "The assigned pool contains no comparable list or realized pricing; null pricing is treated as an evidence gap rather than estimated, and packages summarize disclosed scope without implying common units."
    claimRefs: [CP003, CP005, CP007, CP008, CP009, CP016]
figures:
  - id: FP001
    title: Competitive positioning by specialization and regulated-bank scope
    type: quadrant
    summary: Erebor occupies a specialized, broad-bank position, while incumbents lead on regulated breadth and specialist or fintech alternatives lead on narrower workflows.
    data:
      xAxis:
        label: "Frontier-sector specialization"
        min: 1
        max: 5
        low: "Broad or customer-managed"
        high: "Frontier-sector specific"
        description: "Analyst ordinal classification from disclosed target focus"
        scale: ordinal
      yAxis:
        label: "Direct regulated-bank scope"
        min: 1
        max: 5
        low: "Modular or non-bank substitute"
        high: "Broad direct-bank relationship"
        description: "Analyst ordinal classification from disclosed charter and package scope"
        scale: ordinal
      points:
        - label: "Erebor Bank"
          x: 5
          y: 4
          detail: "National bank focused on frontier sectors, with custody and some partner dependencies limiting a maximum scope score."
        - label: "JPMorgan"
          x: 2
          y: 5
          detail: "Broad incumbent with reported startup scale and lifecycle coverage, but less narrow sector positioning."
        - label: "SVB / First Citizens"
          x: 3
          y: 5
          detail: "Established innovation-economy banking category with direct bank scope."
        - label: "Startup fintechs"
          x: 3
          y: 2
          detail: "Startup-focused workflows, with direct charter breadth not established by the assigned evidence."
        - label: "Crypto specialists"
          x: 5
          y: 2
          detail: "High digital-asset specialization but narrower full-bank scope in the secondary profile."
        - label: "Internal multi-provider stack"
          x: 2
          y: 1
          detail: "Customer-managed combination of incumbent banking and specialist vendors rather than an integrated direct-bank offer."
    approximationNotes: "Coordinates are evidence-backed ordinal classifications, not market-share, product-quality, or performance scores; incomplete peer disclosure makes the map directional."
    claimRefs: [CP001, CP006, CP008, CP011, CP014, CP015]
callouts:
  - calloutType: strength
    title: A real structural wedge
    body: Erebor can combine insured deposits, credit, treasury, payments, and stablecoin-related services under a national-bank relationship tailored to sectors that often require specialist underwriting.
    claimRefs: [CP001, CP002, CP003]
  - calloutType: risk
    title: Distribution and concentration cut both ways
    body: Early deposit and customer growth shows demand, but a related-sector deposit base can leave together under stress while JPMorgan already has a large installed startup-banking franchise.
    claimRefs: [CP007, CP012, CP013]
  - calloutType: recommendation
    title: Treat the moat as unproven
    body: Underwrite cohort retention, primary-bank share, deposit concentration, realized pricing, approval speed, credit losses, partner redundancy, and service levels before assigning value to durable lock-in.
    claimRefs: [CP013, CP014, CP016]
