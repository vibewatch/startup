      - ["Stablecoin deposits and payments", "Crypto and cross-border users", "Planned or emerging capability; issuance is not established as live", "Potential 24/7 fiat and digital-asset settlement layer", "Final rule status, reserve operations, redemption controls, and launch date are unknown"]
    notes: Public profiles and regulatory releases distinguish described or planned capabilities from verified production deployment; null or unknown fields require management evidence.
    claimRefs: [CE001, CE002, CE003, CE004, CE014]
  - id: TE002
    title: Workflow and use-case table
    columns: [User job, Current workflow, Erebor solution, Measurable benefit, Limitation or open question]
    rows:
      - ["Hold operating cash", "Use a bank willing to onboard frontier-sector businesses", "Deposits at an FDIC-insured national bank focused on those sectors", "Access to regulated accounts and sector-aligned service", "No public cohort retention or uninsured-deposit mix"]
      - ["Move fiat and digital assets", "Coordinate bank accounts and crypto rails across providers", "Planned stablecoin-native deposits and payments alongside banking rails", "Potential faster settlement and fewer provider handoffs", "Stablecoin issuance and redemption are not publicly verified as live"]
      - ["Finance specialized assets", "Seek credit for AI hardware, crypto-related collateral, or hard-tech operations", "Commercial lending with sector-specific focus", "Potential access to underwriting expertise unavailable at generalist banks", "Public data does not show approval rates, loss performance, or collateral policy"]
      - ["Manage treasury and payments", "Use operating accounts, wires, ACH, approvals, and identity checks", "Digital-first treasury and payment workflows", "Potential remote access for distributed technology companies", "No public API documentation, uptime, or integration SLA"]
      - ["Serve regulated cross-border activity", "Navigate sanctions, correspondent banking, and foreign-exchange constraints", "Proposed correspondent relationships and regulated bank infrastructure", "Potentially broader dollar access", "Each corridor remains subject to sanctions, licensing, and supervisory controls"]
    notes: The table separates intended customer jobs from measured outcomes; public sources describe capabilities but do not provide comparable time-to-value, uptime, or customer-benefit metrics.
    claimRefs: [CE001, CE003, CE009, CE010]
  - id: TE003
    title: Technology and operating architecture
    columns: [Layer or process, Role, Dependency, Risk, Evidence status]
    rows:
      - ["Regulatory and capital foundation", "Charter, deposit insurance, capital maintenance, and failure-processing controls", "Supervisory conditions and capital calls constrain launch and growth", "Verified by OCC and FDIC releases", null]
      - ["Core banking and balance sheet", "Hold deposits and originate loans on the bank's own balance sheet", "Core banking vendor, ledger, credit systems, and capital controls", "Vendor concentration and operational resilience cannot be assessed publicly", "Not disclosed"]
      - ["Payments and treasury rails", "Accounts, ACH, wires, approvals, and treasury workflows", "Payment networks, identity verification, and correspondent banks", "Settlement failures, fraud, and integration limits are unquantified", "Product described; implementation unverified"]
      - ["Digital-asset settlement", "Stablecoin deposits, withdrawals, custody, or future issuance/redemption", "Blockchain networks, reserve operations, compliance, and final federal rules", "Smart-contract, sanctions, liquidity, and redemption risk", "Planned or emerging; not fully evidenced"]
      - ["Risk, compliance, and security controls", "AML, sanctions, cybersecurity, and safe-and-sound operation", "Regulators, control tooling, audits, and specialist staff", "Control depth and incident response are not public", "Requirements are evidenced; test results are not"]
    notes: Architecture rows are an analytical decomposition of disclosed operating responsibilities, not a claim that the named components or vendors have been publicly confirmed.
    claimRefs: [CE005, CE006, CE007, CE009, CE010, CE013]
figures:
  - id: FE001
    title: Erebor product architecture map
    type: stack
    summary: Erebor's disclosed model stacks regulated banking infrastructure beneath sector-focused products and a still-developing digital-asset settlement layer.
    data:
      layers:
        - label: Regulated foundation
          detail: Charter, deposit insurance, and capital conditions establish the regulated base.
          items:
            - name: OCC national-bank charter
              detail: Preliminary conditional approval was announced in October 2025; conditions and safe-and-sound requirements remain relevant.
            - name: FDIC deposit insurance
              detail: Deposit insurance approval was announced in December 2025 with capital and failure-processing conditions.
        - label: Banking products
          detail: Deposits, lending, payments, treasury, and custody are described product families.
          items:
            - name: Deposits and treasury
              detail: Accounts and treasury services for technology, crypto, defense, manufacturing, and related clients are described publicly.
            - name: Commercial lending
              detail: Sector-focused lending is described; public sources do not establish portfolio performance or underwriting depth.
            - name: Payments and custody
              detail: Payments and custody are described in independent profiles; API, vendor, and reliability details are not public.
        - label: Digital-asset layer
          detail: Stablecoin and network-dependent services remain planned or incompletely evidenced.
          items:
            - name: Stablecoin deposits and payments
              detail: Planned or emerging capability; public evidence does not establish live issuance and redemption.
            - name: Network and correspondent dependencies
              detail: Digital-asset networks, correspondent banks, sanctions controls, and final rules remain external dependencies.
        - label: Risk and compliance
          detail: AML, sanctions, cybersecurity, and safe-and-sound operation are required controls.
          items:
            - name: AML and sanctions screening
              detail: Required for onboarding, payments, digital-asset activity, and relevant cross-border corridors.
        - label: Reliability and support
          detail: Production resilience, service levels, and incident response are not publicly disclosed.
          items:
            - name: Operations and recovery
              detail: Uptime, recovery objectives, support metrics, and incident history require diligence.
        - label: Evidence and roadmap
          detail: Public disclosure is stronger on chartering and intended products than on implementation.
          items:
            - name: Technical proof package
              detail: API documentation, architecture, control tests, and launch gates remain requested evidence.
    items:
      - name: Regulatory foundation
        value: "2"
        unit: "public approvals/conditions"
      - name: Banking product families
        value: "3"
        unit: "described families"
      - name: Digital-asset dependencies
        value: "2"
        unit: "identified dependencies"
      - name: Control dependencies
        value: "3"
        unit: "identified control areas"
      - name: Disclosure gaps
        value: "4"
        unit: "priority evidence gaps"
      - name: Regulatory conditions
        value: "2"
        unit: "capital and safety conditions"
    claimRefs: [CE005, CE006, CE007, CE009, CE014]
