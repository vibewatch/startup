schemaVersion: "report-v2"
artifact: product-tech
slug: erebor-bank
runDate: 2026-10-26
company:
  name: Erebor Bank
chapter:
  number: 5
  title: Product & Technology
  summary: "Erebor is building a branchless, nationally chartered bank for technology, crypto, defense, and manufacturing clients, combining deposits and lending with payments, custody, and planned stablecoin services. Its regulatory foundation is unusually concrete, but public evidence does not yet verify production-scale technical architecture, reliability metrics, or a live stablecoin issuance product."
sections:
  - id: customer-workflow
    title: Customer workflow and product surface
    body: "Erebor's customer proposition is a specialized banking workflow rather than a mass-market app. The FDIC describes a proposed business model focused on deposit and lending products for businesses and individuals in technology, payment systems, investment, and defense, including virtual-currency participants. Independent profiles add operating accounts, lending, treasury, payments, custody, and virtual-currency-related services, while describing a branchless digital-first model. The useful distinction is ownership of a national-bank charter and balance sheet: Erebor is positioned to provide regulated accounts and credit directly, rather than only routing a fintech customer's activity through a sponsor bank. Public materials describe planned stablecoin settlement and payments, but do not establish that stablecoin issuance is live. The customer workflow therefore runs from onboarding and identity verification to deposits, treasury and payment rails, lending, and—subject to final rules and controls—digital-asset settlement. That breadth is strategically differentiated, but it also creates a large compliance and integration surface for an early-stage bank."
    claimRefs: [CE001, CE002, CE003, CE004]
    tableRefs: [TE001, TE002]
  - id: operating-architecture
    title: Operating architecture and maturity
    body: "The operating model has three observable layers. First, the bank has a regulated foundation: the OCC conditionally approved a de novo national-bank charter, and the FDIC approved deposit insurance subject to capital and failure-processing conditions. Second, the product layer combines deposits, lending, payments, treasury, custody, and virtual-currency services for a narrow innovation-economy segment. Third, the roadmap layer includes stablecoin deposits and payments and a planned issuance or redemption capability. The OCC approval is evidence of regulatory review, not proof that every product component is deployed or scalable. The FDIC's required minimum 12 percent Tier 1 leverage ratio during the first three years and its capital-call condition show that resilience is partly enforced through supervisory and capital controls. Publicly prefetched sources do not disclose the core banking vendor, cloud topology, API documentation, uptime, incident history, penetration-test results, or integration service levels. Those omissions make technical maturity difficult to underwrite even though the regulatory and operating model is legible."
    claimRefs: [CE005, CE006, CE007, CE008]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: differentiation-and-dependencies
    title: Differentiation, dependencies, and execution risk
    body: "Erebor's differentiation is primarily structural and segment-specific: it targets technology, crypto, defense, and manufacturing clients and presents itself as a direct, FDIC-insured national bank rather than a program manager. That can reduce sponsor-bank dependency for accounts, credit, and future digital-asset settlement, but it does not remove dependence on regulators, capital providers, correspondent relationships, sanctions controls, and third-party technology. The OCC explicitly framed permissible digital-asset activities as acceptable only when conducted safely and soundly, while its approval remains conditional. The OFAC source shows that sanctions programs can require licenses and contain detailed restrictions and exceptions, which is material for any bank considering cross-border or politically sensitive flows. A reported non-binding correspondent-banking letter of intent and reports of lower-than-expected crypto-backed-lending demand are signals that product execution and risk appetite may not match the initial ambition. The public record also lacks a developer-facing surface or practitioner metrics such as API documentation, releases, package activity, or uptime data; no architecture conclusion should be drawn from marketing descriptions alone."
    claimRefs: [CE009, CE010, CE011]
  - id: diligence-verdict
    title: Product and technical verdict
    body: "Product strategy is coherent at the positioning level: a regulated bank can combine deposits, lending, payments, and treasury for clients that find general-purpose banks difficult to access. Regulatory approvals and the capital condition provide stronger evidence of institutional readiness than a typical fintech launch announcement. However, the public evidence remains much stronger on chartering and intended products than on implementation. There is no prefetched public evidence of uptime, security certifications, service-level commitments, core-system architecture, production API coverage, stablecoin issuance, or measured customer outcomes. The result is a product with credible strategic differentiation but unproven technical operating depth. Diligence should prioritize the live product inventory, architecture and vendor map, control testing, incident and recovery records, and evidence that deposits, credit, and digital-asset services can scale without weakening compliance or capital discipline."
    claimRefs: [CE013, CE014, CE015, CE016]
callouts:
  - calloutType: strength
    title: Regulatory foundation is real
    body: OCC conditional charter approval and FDIC deposit-insurance approval establish a regulated operating base, but they do not validate every planned product or its production maturity.
    claimRefs: [CE005, CE006]
  - calloutType: risk
    title: Architecture remains opaque
    body: Public sources do not identify the core banking stack, API surface, reliability history, security attestations, or stablecoin issuance status.
    claimRefs: [CE013, CE014]
  - calloutType: recommendation
    title: Require product and control evidence
    body: Before underwriting technical scale, obtain a live product inventory, vendor and integration map, control-test package, service-level data, and documented roadmap gates for digital-asset functionality.
    claimRefs: [CE015, CE016]
