company:
  name: Erebor Bank
chapter:
  number: 7
  title: Risks
  summary: Erebor has obtained the key preliminary charter and deposit-insurance approvals, but its specialized technology and digital-asset focus leaves material execution, compliance, concentration, and capital risks. The public record supports a high-risk, research-more posture because launch conditions and supervisory requirements are documented while operating performance, controls, and loss experience remain largely private.
sections:
  - id: regulatory-gate
    title: Regulatory and legal gate
    body: "Erebor's regulatory path is an approval with conditions rather than an unrestricted operating license. The OCC said its October 15, 2025 action was a conditional preliminary approval of a de novo national-bank charter, and the FDIC later approved deposit insurance subject to statutory review and capital conditions. The practical risk is execution against the pre-opening and ongoing supervisory perimeter: the assigned industry review identifies BSA/AML, vendor risk, liquidity management, model governance, customer disclosures, Federal Reserve membership, and operational readiness as remaining hurdles. The OCC's public statement supports permissible digital-asset activity only when conducted safely and soundly, while the FDIC required a 12% Tier 1 leverage ratio for the first three years and a capital-call mechanism. These are meaningful mitigations, but they also show that a specialized model must clear a higher control burden before its risk appetite is proven."
    claimRefs: [CR001, CR002, CR003, CR004]
    tableRefs: [TR001]
  - id: operating-control
    title: Operating, quality, and security exposure
    body: "The operating model combines ordinary deposit and lending products with virtual-currency operations and intended stablecoin-related activity. Public descriptions mention lending to technology, AI, defense, manufacturing, and digital-asset businesses, including potential nontraditional collateral; that creates model, valuation, liquidity, cyber, fraud, and transaction-monitoring dependencies that cannot be assessed from public outcomes alone. FinCEN's guidance page confirms that BSA obligations and implementing regulations remain an active supervisory framework for depository institutions, but it does not establish Erebor's control effectiveness. No assigned source documents a material outage, breach, loss rate, or failed deployment, so absence of an incident record is not evidence that these risks are absent. Monitoring should therefore focus on control testing, exception rates, suspicious-activity backlogs, collateral haircuts, uptime, vendor incidents, and regulator findings."
    claimRefs: [CR005, CR006, CR007, CR008]
    tableRefs: [TR002]
  - id: dependency-capital
    title: Partner, concentration, and financial-model risks
    body: "Erebor is designed for a narrow innovation-economy customer set rather than a diversified mass-market deposit franchise. The FDIC describes proposed customers across technology, payment systems, investment, defense, and virtual-currency markets, while the OCC and independent coverage describe a similar concentration in specialized sectors. That focus can create correlated deposit outflows, higher funding sensitivity, and credit concentration precisely when crypto or venture markets are stressed. Reported valuation and funding figures vary by source and are not an audited financial bridge; the Paypers fetch retained in the refresh pool contains only general site boilerplate, so it cannot substantiate the reported valuation headline. Capital requirements and a capital-call agreement are explicit mitigations, but they do not prove profitability, asset quality, deposit retention, or the availability of capital under stress."
    claimRefs: [CR009, CR010, CR011, CR012]
    tableRefs: [TR003]
  - id: triggers-and-diligence
    title: Thesis-break triggers and diligence path
    body: "The main thesis-break condition is not merely a delayed launch; it is evidence that Erebor cannot convert its regulated charter into safe, diversified, and repeatable banking operations. A failure to satisfy pre-opening conditions, a capital ratio below the required floor without timely restoration, a material BSA/AML or cybersecurity finding, or a regulator-imposed restriction on the stated business plan would materially impair the thesis. A second break would be concentrated funding or collateral losses that require repeated capital support. The practical diligence path is to obtain the conditional approval letter, business plan, independent control reports, capital and liquidity testing, deposit concentration by cohort and sector, underwriting policy, collateral haircuts, vendor contracts, incident logs, regulatory correspondence, and any litigation or enforcement records before underwriting scale or valuation."
    claimRefs: [CR013, CR014, CR015]
    figureRefs: [FR001]
tables:
  - id: TR001
    title: "Regulatory / legal risk register"
    columns: [Rule or approval, Jurisdiction, Likelihood, Severity, Mitigation maturity, Residual exposure, Diligence path]
    rows:
      - [De novo national-bank charter remains conditional, United States, medium, high, "Documented conditional approval and pre-opening review", "High until all conditions are cleared", "Obtain the OCC conditional approval letter and status of each condition"]
      - [FDIC deposit-insurance conditions and 12% Tier 1 leverage floor, United States, medium, high, "FDIC approval plus capital-call mechanism", "Medium-high under stress", "Review capital plan, stress tests, and capital-call enforceability"]
      - [BSA/AML and transaction-monitoring compliance, United States, medium, critical, "Required control framework; effectiveness not public", "High until independent testing is reviewed", "Request compliance testing, SAR governance, staffing, and regulator correspondence"]
      - [Digital-asset activity must remain safe and sound, United States, medium, high, "OCC supervisory perimeter and stated safe-and-sound standard", "High for novel products", "Map each product to approvals, limits, and board risk appetite"]
    notes: "Rows synthesize assigned regulator, reporting, and guidance sources; likelihood and residual exposure are analytical judgments constrained by the documented conditions, and null public outcomes are not treated as proof of absence."
    enumerationScope:
      coverage: partial
      basis: "Publicly documented charter, deposit-insurance, and BSA/AML conditions available through the 2026-10-26 refresh run"
    claimRefs: [CR001, CR002, CR003, CR005, CR013]
  - id: TR002
    title: Operational, quality, and security risk register
    columns: [Failure mode, Likelihood, Severity, Mitigation maturity, Residual exposure, Unresolved gap]
    rows:
      - [BSA/AML or sanctions-control failure, medium, critical, "Required by the banking perimeter but not independently evidenced", "High", "Control test results, alert backlogs, SAR quality, and examination findings"]
      - [Model error in crypto or specialized-asset collateral, medium, high, "Potential limits and haircuts are discussed but not disclosed", "High", "Collateral policy, valuation sources, margining, and stress results"]
      - [Cybersecurity or third-party vendor incident, medium, high, "Pre-opening operational-readiness review is expected", "Medium-high", "Core, payments, custody, and incident-response vendor map"]
      - [Liquidity or payment-rail interruption, medium, high, "Capital and liquidity oversight are regulatory requirements", "Medium-high", "Intraday liquidity, contingency funding, uptime, and recovery testing"]
    notes: "No assigned source reports an Erebor outage, breach, or realized loss; the register therefore identifies monitorable failure modes and evidence requests rather than asserting incidents."
    enumerationScope:
      coverage: partial
      basis: "Operational risks inferred from the stated banking and digital-asset model and the regulatory control themes in assigned sources"
    claimRefs: [CR005, CR006, CR007, CR008, CR014]
  - id: TR003
    title: Partner, dependency, and concentration risk register
    columns: [Dependency, Counterparty or role, Concentration, Failure scenario, Severity, Mitigation, Residual exposure]
    rows:
      - [Technology and digital-asset client base, "Crypto, AI, defense, and manufacturing customers", "Narrow sector mix is publicly stated", "Correlated deposit outflows or credit stress", high, "Sector-focused underwriting and capital requirements", "High until deposit and asset concentration are disclosed"]
      - [Federal Reserve and FDIC approvals, Federal regulators, "Single regulatory path", "Launch or product sequencing delayed", high, "Conditional approvals and statutory review", "Medium-high"]
      - ["Core, payments, custody, and stablecoin vendors", Unnamed providers, "Not publicly mapped", "Service outage, cyber event, or compliance failure", high, "Vendor-risk review is a stated pre-opening requirement", "High"]
      - [Investor capital and capital-call support, Organizers and investors, "Capital support is contract-dependent", "Capital shortfall during stress", high, "Capital Call Agreement and 12% Tier 1 leverage floor", "Medium-high"]
    notes: "Counterparties are described by role where names are not disclosed; concentration is not quantified, and the table does not convert reported funding into cash available or imply a confirmed stablecoin launch."
    enumerationScope:
      coverage: partial
      basis: "Public descriptions of target sectors, approvals, operating dependencies, and capital conditions in assigned sources"
    claimRefs: [CR002, CR009, CR010, CR011, CR012, CR015]
figures:
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: The highest residual exposures cluster around compliance, novel-asset risk, and concentrated funding or dependencies.
    data:
      columns: [Low likelihood, Medium likelihood, High likelihood]
      rows:
        - label: Critical impact
          values: [null, "BSA/AML failure", null]
        - label: High impact
          values: [null, "Collateral, liquidity, cyber, concentration", "Conditional approval delay"]
        - label: Medium impact
          values: [null, "Vendor or payment interruption", null]
        - label: Critical impact (second scenario)
          values: ["", "Capital or AML remediation failure", null]
        - label: High impact (second scenario)
          values: ["", "Concentrated deposit run", "Regulatory restriction"]
        - label: Medium impact (second scenario)
          values: ["", "Third-party service degradation", null]
      xAxis: "Likelihood"
      yAxis: "Impact"
    approximationNotes: "Likelihood and impact placements are qualitative analytical judgments based on documented conditions and unresolved evidence gaps; the matrix is not a measured probability model."
    claimRefs: [CR003, CR005, CR006, CR009, CR013, CR014]
callouts:
  - calloutType: risk
    title: Conditional approval is not operating proof
    body: "The OCC and FDIC records establish approvals with conditions, not demonstrated launch-scale control performance. Underwriting should remain research-more until independent evidence covers capital, liquidity, compliance, and asset quality."
    claimRefs: [CR001, CR002, CR013]
  - calloutType: assumption
    title: Monitorable kill criteria
    body: "Treat a missed regulatory condition, capital below the required floor without restoration, material control finding, or concentrated loss event requiring emergency capital as a thesis-break trigger."
    claimRefs: [CR003, CR005, CR014, CR015]
