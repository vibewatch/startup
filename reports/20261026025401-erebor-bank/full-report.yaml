      - number: '1.4'
        title: Evidence quality and open diligence
        blocks:
          - type: paragraph
            body: >-
              Identity and regulatory status are well supported by primary government releases, while leadership,
              funding, valuation, deposits, customers, and profitability rely more heavily on third-party profiles or
              reported discussions. The available evidence does not establish a reconciled capital table, final round
              terms, current headcount, customer concentration, deposit stability, audited revenue, credit performance,
              or complete board oversight. The adverse evidence is substantive but bounded: Senator Warren requested
              records and explanations about a fundraising memo and possible political influence, whereas the OCC
              described its review as rigorous and non-discriminatory. Underwriting should therefore treat the charter
              as verified infrastructure, reported scale as provisional, and governance, compliance, funding terms, and
              deposit durability as priority diligence.
