  - id: TV001
    title: Recommendation summary
    columns:
      - Dimension
      - Assessment
      - Evidence basis
      - Decision implication
    rows:
      - - Recommendation
        - research-more
        - Regulatory approvals are public, but operating and transaction economics remain incomplete.
        - Do not underwrite the reported price without primary diligence.
      - - Confidence
        - medium
        - OCC and FDIC records are primary; valuation and deposit figures are reported by secondary sources.
        - Confidence should rise only with audited operating data and signed financing terms.
      - - Risk rating
        - high
        - >-
          Specialized exposure combines digital assets, technology customers, and a concentrated early-stage balance
          sheet.
        - Use venture-style sizing and explicit downside limits.
      - - Valuation stance
        - stretched
        - >-
          Reported $8B pre-money is materially above the reported prior $4.35B valuation and above a public-bank
          market-cap anchor.
        - Require price, preference, dilution, and profitability diligence.
    notes: >-
      Public evidence mixes regulator records, reported financing discussions, and market-data snapshots; no row should
      be read as an audited valuation or return forecast.
    claimRefs:
      - CV001
      - CV003
      - CV005
      - CV008
      - CV012
  - id: TV002
    title: Thesis / anti-thesis
    columns:
      - Argument
      - Supporting evidence
      - What would change the view
      - Current implication
    rows:
      - - Regulated access is a strategic asset
        - OCC conditionally approved the de novo national-bank charter.
        - A failure to satisfy ongoing conditions or a material supervisory restriction.
        - Positive but not sufficient for an investment case.
      - - Target-sector demand may be real
        - Reported deposits rose from roughly $1B to roughly $4B since March.
        - Verified deposit retention, concentration, and profitability by customer cohort.
        - Promising signal with weak public quality disclosure.
      - - The niche can amplify downside
        - Banking Dive quotes concern that the venture could destabilize the banking system.
        - Independent evidence of diversified deposits, conservative underwriting, and tested controls.
        - High-risk exposure requires downside underwriting.
      - - The price may be ahead of proof
        - Reported financing terms imply $8B pre-money while talks could change.
        - Signed documents plus audited revenue, earnings, and capital metrics.
        - Research-more until valuation support improves.
    notes: >-
      The table separates issuer/regulator validation from third-party reports and adverse commentary; it does not treat
      any single source as a complete risk assessment.
    claimRefs:
      - CV006
      - CV007
      - CV008
      - CV009
      - CV010
      - CV011
  - id: TV003
    title: Bull / base / bear scenario
    columns:
      - Scenario
      - Explicit assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - >-
          Deposits continue scaling; a financing closes near reported terms; recurring payments and lending revenue
          become visible; capital remains above requirements.
        - >-
          An $8B pre-money price could be defensible only if audited growth and risk-adjusted profitability support a
          premium to established bank references.
        - Execution, compliance, concentration, and valuation compression.
        - 'Low-to-medium: several required inputs are not public.'
      - - Base
        - >-
          Charter and deposit-insurance approvals stand; franchise develops, but revenue, margins, and final financing
          terms remain unverified.
        - No reliable point valuation; maintain research-more and demand a price/disclosure reset before committing.
        - Slow monetization, high compliance costs, and dilution.
        - 'Medium: consistent with current public evidence.'
      - - Bear
        - >-
          Deposit growth reverses or concentrates; financing is repriced or delayed; capital, compliance, or supervisory
          conditions become binding.
        - Downside is principal impairment and/or a down-round; no public data supports a precise loss estimate.
        - Liquidity flight, credit losses, regulatory intervention, and political scrutiny.
        - 'Material: adverse commentary and early-stage opacity keep it live.'
      - - Trigger case
        - Signed terms, audited metrics, or adverse supervisory findings materially change the information set.
        - >-
          Re-underwrite using bank-specific earnings, capital, liquidity, and preference data rather than fintech
          revenue multiples.
        - False precision from incomparable public-company benchmarks.
        - Required before an investable recommendation.
    notes: >-
      These are qualitative scenarios, not probability-weighted forecasts. Public sources do not provide enough verified
      earnings, capital, or transaction data for a numeric valuation range.
    claimRefs:
      - CV002
      - CV003
      - CV010
      - CV012
      - CV015
      - CV018
