      - number: '5.2'
        title: Operating architecture and maturity
        blocks:
          - type: paragraph
            body: >-
              The operating model has three observable layers. First, the bank has a regulated foundation: the OCC
              conditionally approved a de novo national-bank charter, and the FDIC approved deposit insurance subject to
              capital and failure-processing conditions. Second, the product layer combines deposits, lending, payments,
              treasury, custody, and virtual-currency services for a narrow innovation-economy segment. Third, the
              roadmap layer includes stablecoin deposits and payments and a planned issuance or redemption capability.
              The OCC approval is evidence of regulatory review, not proof that every product component is deployed or
              scalable. The FDIC's required minimum 12 percent Tier 1 leverage ratio during the first three years and
              its capital-call condition show that resilience is partly enforced through supervisory and capital
              controls. Publicly prefetched sources do not disclose the core banking vendor, cloud topology, API
              documentation, uptime, incident history, penetration-test results, or integration service levels. Those
              omissions make technical maturity difficult to underwrite even though the regulatory and operating model
              is legible.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE003
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE009
              - CE010
              - CE013
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE009
              - CE014
      - number: '5.3'
        title: Differentiation, dependencies, and execution risk
        blocks:
          - type: paragraph
            body: >-
              Erebor's differentiation is primarily structural and segment-specific: it targets technology, crypto,
              defense, and manufacturing clients and presents itself as a direct, FDIC-insured national bank rather than
              a program manager. That can reduce sponsor-bank dependency for accounts, credit, and future digital-asset
              settlement, but it does not remove dependence on regulators, capital providers, correspondent
              relationships, sanctions controls, and third-party technology. The OCC explicitly framed permissible
              digital-asset activities as acceptable only when conducted safely and soundly, while its approval remains
              conditional. The OFAC source shows that sanctions programs can require licenses and contain detailed
              restrictions and exceptions, which is material for any bank considering cross-border or politically
              sensitive flows. A reported non-binding correspondent-banking letter of intent and reports of
              lower-than-expected crypto-backed-lending demand are signals that product execution and risk appetite may
              not match the initial ambition. The public record also lacks a developer-facing surface or practitioner
              metrics such as API documentation, releases, package activity, or uptime data; no architecture conclusion
              should be drawn from marketing descriptions alone.
            claimRefs:
              - CE009
              - CE010
              - CE011
      - number: '5.4'
        title: Product and technical verdict
        blocks:
          - type: paragraph
            body: >-
              Product strategy is coherent at the positioning level: a regulated bank can combine deposits, lending,
              payments, and treasury for clients that find general-purpose banks difficult to access. Regulatory
              approvals and the capital condition provide stronger evidence of institutional readiness than a typical
              fintech launch announcement. However, the public evidence remains much stronger on chartering and intended
              products than on implementation. There is no prefetched public evidence of uptime, security
              certifications, service-level commitments, core-system architecture, production API coverage, stablecoin
              issuance, or measured customer outcomes. The result is a product with credible strategic differentiation
              but unproven technical operating depth. Diligence should prioritize the live product inventory,
              architecture and vendor map, control testing, incident and recovery records, and evidence that deposits,
              credit, and digital-asset services can scale without weakening compliance or capital discipline.
            claimRefs:
              - CE013
              - CE014
              - CE015
              - CE016
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Regulatory foundation is real
            body: >-
              OCC conditional charter approval and FDIC deposit-insurance approval establish a regulated operating base,
              but they do not validate every planned product or its production maturity.
            calloutType: strength
            claimRefs:
              - CE005
              - CE006
          - type: callout
            title: Architecture remains opaque
            body: >-
              Public sources do not identify the core banking stack, API surface, reliability history, security
              attestations, or stablecoin issuance status.
            calloutType: risk
            claimRefs:
              - CE013
              - CE014
          - type: callout
            title: Require product and control evidence
            body: >-
              Before underwriting technical scale, obtain a live product inventory, vendor and integration map,
              control-test package, service-level data, and documented roadmap gates for digital-asset functionality.
            calloutType: recommendation
            claimRefs:
              - CE015
              - CE016
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Target customers and buying proposition
        blocks:
          - type: paragraph
            body: >-
              Erebor's customer thesis is deliberately narrow: it targets technology companies, virtual-currency
              participants, defense and advanced-manufacturing businesses, and related high-net-worth individuals rather
              than a mass retail base. The FDIC describes the proposed business model as deposit and lending products
              for businesses and individuals in technology, payment systems, investment, and defense, including
              virtual-currency market participants. Banking Dive reports a more operational segmentation around startups
              and high-net-worth individuals in cryptocurrency, artificial intelligence, defense, and manufacturing,
              while the Bit.Fan account frames the unmet need as reliable banking for complex, compliance-intensive
              sectors after Silicon Valley Bank's collapse. This specialization can make Erebor's product more relevant
              to founders whose needs include treasury, payments, lending, and digital-asset access, but it also
              concentrates the deposit franchise in correlated sectors. The public record identifies intended users and
              use cases; it does not disclose a customer-level segmentation by payer, account type, geography, or
              revenue band.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
      - number: '6.2'
        title: Adoption trajectory and named proof
        blocks:
          - type: paragraph
            body: >-
              The strongest adoption evidence is a reported increase from $1.1 billion of deposits at the end of March
              to approximately $4.05 billion three months later, alongside nearly 400 new customers, as reported by The
              Crypto Times. Those figures are attributed to people familiar with Erebor's financials and are not
              accompanied by an active-account denominator, customer names, average balances, or independent
              confirmation, so they should be treated as third-party reported rather than audited operating KPIs.
              Banking Dive supplies an earlier launch snapshot: the bank opened with $635 million in capital and several
              potential defense and technology clients in waiting. The Sui-related announcement summarized in the
              Substack source is more concrete product adoption proof because it describes stablecoin deposits and
              withdrawals for Erebor customers, but the same source explicitly says it does not establish customer
              scale, transaction volume, or broader commercial adoption. Accordingly, the evidence supports early demand
              and ecosystem integration, not durable production usage or customer success outcomes.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU016
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU016
          - type: table
            tableRef: TU003
            claimRefs:
              - CU008
              - CU016
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU005
              - CU007
              - CU009
              - CU010
      - number: '6.3'
        title: Retention, expansion, and concentration diligence
        blocks:
          - type: paragraph
            body: >-
              Public sources do not disclose NRR, GRR, churn, renewal rates, contract lengths, cohort behavior,
              satisfaction scores, or named customer outcomes. The reported deposit growth therefore cannot be treated
              as retention or expansion: it may reflect new balances, concentrated relationships, or a changing mix of
              large accounts. The bank's intended product surface—deposits, lending, payments, custody, and
              stablecoin-related treasury services—could support land-and-expand if customers adopt several products,
              but the available evidence does not show cross-sell, repeat usage, loan utilization, or fee revenue by
              customer. AInvest's analysis identifies the narrower liability base implied by Erebor's sector
              specialization as a potential source of concentration and higher funding costs. That is an analytical
              risk, not evidence that Erebor has already experienced deposit instability. Erebor's customer
              concentration, uninsured share, and liquidity behavior remain undisclosed, making these the central
              customer-quality and durability questions for underwriting.
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
      - number: '6.4'
        title: Investor diligence implications
        blocks:
          - type: paragraph
            body: >-
              The customer case is credible at the market-fit level but incomplete at the account-quality level.
              Regulators approved a model aimed at technology, payment, investment, defense, and virtual-currency
              customers, and independent reporting describes a post-SVB gap that can motivate switching. Yet the
              evidence does not separate committed customers from prospects, deposits from revenue-producing
              relationships, or one-time onboarding from recurring activity. Venture-debt market evidence also shows
              that lenders are favoring companies with revenue visibility, retention, margins, and contracted cash
              flows, which raises a practical test for Erebor's own customer base: can it demonstrate similarly
              underwritable customer quality while serving earlier-stage and volatile sectors? The next diligence step
              should obtain anonymized cohort tables, top-20 deposit and revenue concentration, uninsured balances,
              product penetration, renewal/churn history, and named production references. Until then, the customer
              thesis merits monitoring rather than a conclusion that adoption is durable.
            claimRefs:
              - CU013
              - CU014
              - CU015
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Specialized market fit is externally legible
            body: >-
              Regulatory approvals and independent reporting consistently identify technology, crypto, defense, AI,
              manufacturing, and related innovation-economy customers as the intended segment.
            calloutType: strength
            claimRefs:
              - CU001
              - CU002
              - CU003
          - type: callout
            title: Growth is not yet retention proof
            body: >-
              Reported deposits and customer additions lack active-account, cohort, uninsured-balance,
              product-penetration, and revenue-concentration denominators.
            calloutType: risk
            claimRefs:
              - CU005
              - CU009
              - CU010
              - CU011
          - type: callout
            title: Request customer-quality evidence before underwriting durability
            body: >-
              Obtain anonymized cohorts, top-account concentration, uninsured deposits, product usage, churn or renewal
              history, and named production references.
            calloutType: recommendation
            claimRefs:
              - CU012
              - CU013
              - CU015
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal gate
        blocks:
          - type: paragraph
            body: >-
              Erebor's regulatory path is an approval with conditions rather than an unrestricted operating license. The
              OCC said its October 15, 2025 action was a conditional preliminary approval of a de novo national-bank
              charter, and the FDIC later approved deposit insurance subject to statutory review and capital conditions.
              The practical risk is execution against the pre-opening and ongoing supervisory perimeter: the assigned
              industry review identifies BSA/AML, vendor risk, liquidity management, model governance, customer
              disclosures, Federal Reserve membership, and operational readiness as remaining hurdles. The OCC's public
              statement supports permissible digital-asset activity only when conducted safely and soundly, while the
              FDIC required a 12% Tier 1 leverage ratio for the first three years and a capital-call mechanism. These
              are meaningful mitigations, but they also show that a specialized model must clear a higher control burden
              before its risk appetite is proven.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR005
              - CR013
      - number: '7.2'
        title: Operating, quality, and security exposure
        blocks:
          - type: paragraph
            body: >-
              The operating model combines ordinary deposit and lending products with virtual-currency operations and
              intended stablecoin-related activity. Public descriptions mention lending to technology, AI, defense,
              manufacturing, and digital-asset businesses, including potential nontraditional collateral; that creates
              model, valuation, liquidity, cyber, fraud, and transaction-monitoring dependencies that cannot be assessed
              from public outcomes alone. FinCEN's guidance page confirms that BSA obligations and implementing
              regulations remain an active supervisory framework for depository institutions, but it does not establish
              Erebor's control effectiveness. No assigned source documents a material outage, breach, loss rate, or
              failed deployment, so absence of an incident record is not evidence that these risks are absent.
              Monitoring should therefore focus on control testing, exception rates, suspicious-activity backlogs,
              collateral haircuts, uptime, vendor incidents, and regulator findings.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR014
      - number: '7.3'
        title: Partner, concentration, and financial-model risks
        blocks:
          - type: paragraph
            body: >-
              Erebor is designed for a narrow innovation-economy customer set rather than a diversified mass-market
              deposit franchise. The FDIC describes proposed customers across technology, payment systems, investment,
              defense, and virtual-currency markets, while the OCC and independent coverage describe a similar
              concentration in specialized sectors. That focus can create correlated deposit outflows, higher funding
              sensitivity, and credit concentration precisely when crypto or venture markets are stressed. Reported
              valuation and funding figures vary by source and are not an audited financial bridge; the Paypers fetch
              retained in the refresh pool contains only general site boilerplate, so it cannot substantiate the
              reported valuation headline. Capital requirements and a capital-call agreement are explicit mitigations,
              but they do not prove profitability, asset quality, deposit retention, or the availability of capital
              under stress.
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR002
              - CR009
              - CR010
              - CR011
              - CR012
              - CR015
      - number: '7.4'
        title: Thesis-break triggers and diligence path
        blocks:
          - type: paragraph
            body: >-
              The main thesis-break condition is not merely a delayed launch; it is evidence that Erebor cannot convert
              its regulated charter into safe, diversified, and repeatable banking operations. A failure to satisfy
              pre-opening conditions, a capital ratio below the required floor without timely restoration, a material
              BSA/AML or cybersecurity finding, or a regulator-imposed restriction on the stated business plan would
              materially impair the thesis. A second break would be concentrated funding or collateral losses that
              require repeated capital support. The practical diligence path is to obtain the conditional approval
              letter, business plan, independent control reports, capital and liquidity testing, deposit concentration
              by cohort and sector, underwriting policy, collateral haircuts, vendor contracts, incident logs,
              regulatory correspondence, and any litigation or enforcement records before underwriting scale or
              valuation.
            claimRefs:
              - CR013
              - CR014
              - CR015
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR003
              - CR005
              - CR006
              - CR009
              - CR013
              - CR014
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Conditional approval is not operating proof
            body: >-
              The OCC and FDIC records establish approvals with conditions, not demonstrated launch-scale control
              performance. Underwriting should remain research-more until independent evidence covers capital,
              liquidity, compliance, and asset quality.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR013
          - type: callout
            title: Monitorable kill criteria
            body: >-
              Treat a missed regulatory condition, capital below the required floor without restoration, material
              control finding, or concentrated loss event requiring emergency capital as a thesis-break trigger.
            calloutType: assumption
            claimRefs:
              - CR003
              - CR005
              - CR014
              - CR015
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              The recommendation is research-more, with high risk and a stretched valuation stance. Erebor has cleared
              important institutional hurdles: the OCC conditionally approved its de novo national-bank charter, while
              the FDIC approved deposit insurance subject to capital and failure-preparation conditions. Those facts
              reduce licensing uncertainty, but they do not prove earnings power or balance-sheet quality. The reported
              financing discussion is also not a closed transaction: TechStartups describes advanced talks for roughly
              $1.5 billion at an $8 billion pre-money valuation, and explicitly says the talks could change. Because
              public sources do not disclose revenue, net income, credit losses, deposit concentration, or the proposed
              round's preferences, a price-sensitive investment decision should wait for primary transaction documents
              and operating data.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV008
              - CV012
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV007
              - CV010
              - CV015
      - number: '8.2'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The thesis is that a federally chartered bank focused on technology, payments, investment, defense, and
              virtual-currency customers could occupy a real service gap after the failures of specialized technology
              lenders. The OCC's approval statement confirms that permissible digital-asset activities can have a place
              in the federal banking system when conducted safely and soundly, while the FDIC describes a business model
              spanning technology, payment systems, investment, and defense. The anti-thesis is that niche exposure can
              amplify liquidity, compliance, and political risk. Banking Dive reports Senator Warren's concern that the
              venture could destabilize the banking system and require a taxpayer-funded bailout. Neither the positive
              regulatory signal nor the adverse warning resolves the central economic question: whether deposits can be
              converted into durable, risk-adjusted earnings.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
          - type: table
            tableRef: TV002
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
      - number: '8.3'
        title: Valuation scenarios and comparable anchors
        blocks:
          - type: paragraph
            body: >-
              A scenario framework is more defensible than a point valuation because the disclosed operating base is
              incomplete. The reported $4 billion deposit balance and nearly fourfold growth since March are third-party
              reports, not audited financial statements; the same reporting says the new financing remains under
              negotiation. Public-market anchors show the scale of the premium being discussed: CompaniesMarketCap
              reports Customers Bancorp at a $2.85 billion market capitalization in October 2026, while the reported
              Erebor financing would imply an $8 billion pre-money value before any new capital. Coinbase's reported
              2025 revenue of $7.181 billion is a business-model reference, not a bank comparable, and cannot be used to
              infer Erebor revenue or a multiple. The base case therefore assumes continued franchise formation but no
              verified earnings multiple; the bear case centers on funding, concentration, and regulatory execution; and
              the bull case requires audited growth, durable margins, and a completed financing at or above the reported
              terms.
            claimRefs:
              - CV004
              - CV010
              - CV011
              - CV012
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV003
              - CV010
              - CV012
              - CV015
              - CV018
      - number: '8.4'
        title: Diligence asks and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The valuation call should change only when the missing operating and transaction evidence is obtained. The
              highest-priority requests are the signed financing documents and cap table, deposit composition and
              concentration, audited revenue and expense data, credit and liquidity policies, and regulatory
              correspondence covering the charter conditions. Investors should monitor the Tier 1 leverage ratio,
              deposit retention and concentration, uninsured deposits, net interest margin, fee revenue, credit losses,
              compliance exceptions, and any delay in meeting launch or capital conditions. A completed round at the
              reported price would be a market signal, not independent proof of intrinsic value. Conversely, a
              down-round, material deposit outflow, failure to maintain required capital, adverse enforcement, or
              evidence that crypto-related demand is not converting into recurring revenue would break the current
              thesis.
            claimRefs:
              - CV015
              - CV016
              - CV017
              - CV018
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price-sensitive conclusion
            body: >-
              Research-more: public evidence supports strategic potential and regulatory progress, but not a fully
              underwritten $8 billion pre-money valuation.
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV005
              - CV018
          - type: callout
            title: Thesis-break trigger
            body: >-
              A down-round, material deposit outflow, capital shortfall, adverse supervisory action, or failure to
              demonstrate recurring revenue would break the current thesis.
            calloutType: risk
            claimRefs:
              - CV015
              - CV016
              - CV017
              - CV018
