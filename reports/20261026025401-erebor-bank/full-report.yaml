chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              Erebor Bank, National Association is a U.S. national bank headquartered in Columbus, Ohio, founded in 2025
              and opened in February 2026. The FDIC describes its proposed model as deposit and lending products for
              businesses and individuals in technology, payment systems, investment, and defense, including
              virtual-currency participants. Third-party profiles consistently describe a narrower innovation-economy
              focus spanning AI, crypto, defense, and advanced manufacturing. The practical distinction is structural:
              Erebor is presented as a bank holding its own charter and balance sheet rather than a fintech operating
              through a sponsor bank. Its stated product direction combines deposits, lending, payments and treasury
              services, with stablecoin-related settlement ambitions that should be separated from products proven live
              by current disclosures.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO011
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO009
              - CO010
              - CO011
              - CO012
              - CO013
              - CO014
              - CO015
              - CO016
      - number: '1.2'
        title: Leadership, founders, and governance
        blocks:
          - type: paragraph
            body: >-
              Palmer Luckey and Joe Lonsdale are repeatedly identified as founding figures, while Founders Fund, 8VC,
              Lux Capital, and Fundrise appear across retained investor disclosures. Public profiles identify Owen
              Rapaport as CEO, Jacob Hirshman as strategy chief, and Michael Hagedorn as president, but the available
              pool does not provide a complete current board roster, ownership schedule, or formal succession plan. A
              public Senate letter describes a fundraising memo that attributed confidence in the charter timeline to
              political and regulatory connectivity. That allegation is not proof of misconduct: the OCC publicly stated
              that it applied the same rigorous review and standards as other charter applications. The unresolved
              combination of concentrated founder influence, incomplete governance disclosure, and political scrutiny
              creates a material key-person and oversight diligence item.
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
          - type: table
            tableRef: TO002
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
      - number: '1.3'
        title: Charter, insurance, and operating milestones
        blocks:
          - type: paragraph
            body: >-
              The strongest verified milestones are regulatory. The OCC announced preliminary conditional approval of
              the de novo national-bank charter on October 15, 2025, and the FDIC approved the deposit-insurance
              application on December 16, 2025. The FDIC approval required a minimum 12 percent Tier 1 leverage ratio
              during the first three years and a capital-call mechanism if the bank fell below required capital levels.
              The Senate letter states that the bank opened on February 8, 2026. Reporting later put deposits at
              approximately $4.05 billion and described preliminary valuation talks at at least $8 billion, but those
              figures are not audited disclosures. Deposit growth, customer additions, funding proceeds, revenue,
              profitability, and cash available to the institution are distinct measures and should not be conflated.
            claimRefs:
              - CO009
              - CO010
              - CO011
              - CO012
              - CO013
              - CO014
              - CO015
              - CO016
