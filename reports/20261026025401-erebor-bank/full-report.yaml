  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status quo
        blocks:
          - type: paragraph
            body: >-
              Erebor's relevant market is specialized commercial banking and payments for companies and investors
              connected to AI, crypto, defense technology, advanced manufacturing, and related payment-service
              businesses. The FDIC describes the proposed business model as deposit and lending products for technology,
              payment systems, investment, and defense industries, including virtual-currency participants. Reporting on
              the charter application similarly identifies cryptocurrency, artificial intelligence, defense, and
              manufacturing businesses as intended customers. This boundary excludes retail banking, general-purpose
              consumer finance, and every dollar of global crypto transaction volume: the relevant spend is deposit
              custody, treasury, payments, working capital, and specialized credit. The status quo is a mix of incumbent
              commercial banks, sponsor-bank fintech platforms, correspondent relationships, and private credit.
              Erebor's owned charter and balance sheet are differentiators, but the sources do not show that customers
              cannot substitute those alternatives.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: Sizing lenses and market momentum
        blocks:
          - type: paragraph
            body: >-
              The evidence supports multiple market lenses, not a single Erebor TAM. Stablecoin market data provides a
              payments-adjacency lens: Mordor Intelligence estimates the market at $0.33 trillion in 2026 and forecasts
              $1.16 trillion in 2031, with a 28.77% CAGR over 2026-2031. It separately projects 36.5% CAGR for
              cross-border payments and remittances and 34.2% CAGR for financial institutions and payment service
              providers. These are publisher estimates for the stablecoin sector, not Erebor revenue or addressable
              deposits. A second lens is innovation-economy capital: Crunchbase reports $392 billion invested in U.S.
              and Canadian startups in H1 2026 and says Q2 capital was concentrated in giant rounds. J.P. Morgan says
              89% of H1 venture capital flowed to AI-focused companies, while Crunchbase gives an approximately 80% Q2
              share. The periods and category definitions differ, so these percentages should not be forced into one
              series. Together, the lenses show sector liquidity and payment-rail growth, not a defensible Erebor SAM or
              SOM.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM015
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM006
              - CM009
              - CM015
              - CM016
      - number: '2.3'
        title: Buyers, adoption path, and constraints
        blocks:
          - type: paragraph
            body: >-
              The buyer is likely a financially sophisticated company, fund, payment provider, or high-net-worth
              participant whose treasury or operating workflow touches a target sector; the user is treasury, finance,
              operations, or payments staff; and the payer is the organization funding deposits, payments, and credit.
              The adoption trigger is a concrete gap: difficulty obtaining compliant fiat rails, a need for specialized
              collateral underwriting, or a requirement for regulated stablecoin settlement. Regulatory approval reduces
              one access constraint, but does not remove the execution burden. The FDIC requires a 12% Tier 1 leverage
              ratio for the first three years and a capital-call mechanism if the bank falls below required capital
              levels. The charter path began with preliminary conditional OCC approval, and prudential requirements
              remain material even after opening. Concentration is a structural adoption and valuation constraint: a
              narrow customer base can create large balances but also correlated deposit and credit exposure. Public
              materials do not disclose the number of customers, conversion rates, pricing, retention, or risk-adjusted
              profitability, so those remain diligence gates.
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM011
              - CM016
      - number: '2.4'
        title: Evidence limits
        blocks:
          - type: paragraph
            body: >-
              The market case is strongest as a wedge thesis: Erebor can serve a specialized segment where charter
              ownership, technical underwriting, and stablecoin-native payments may matter. It is weaker as a quantified
              underwriting case because public sources do not disclose a clean boundary between total sector activity
              and addressable bank revenue. The sizing table therefore preserves source vintage, geography, units, and
              methodology, while the figure presents separate lenses rather than a funnel or additive TAM/SAM/SOM
              bridge. The principal diligence requirement is a bottom-up bridge from target accounts and expected
              balances to deposits, loan demand, fee revenue, loss rates, and capital consumption.
            claimRefs:
              - CM005
              - CM007
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: A credible wedge, not a quantified TAM
            body: >-
              Erebor's strongest market argument is specialized access for innovation-economy companies; the public
              record does not yet support converting sector-scale stablecoin or venture figures into a bank-specific
              serviceable market.
            calloutType: insight
            claimRefs:
              - CM001
              - CM005
              - CM007
              - CM016
          - type: callout
            title: Concentration and disclosure are the gating risks
            body: >-
              Regulatory authorization and sector growth do not establish customer conversion, deposit durability,
              credit performance, or profitability; a bottom-up customer and balance-sheet bridge remains necessary.
            calloutType: risk
            claimRefs:
              - CM012
              - CM013
              - CM014
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: A crowded market around a specialized customer
        blocks:
          - type: paragraph
            body: >-
              Erebor's regulatory materials define the target job as more than deposit custody: the intended
              relationship spans credit, treasury, payments, data processing, stablecoin-related services, and card
              issuance through partners for businesses in virtual currencies, artificial intelligence, defense,
              manufacturing, payments, investment, and trading. This creates a broad competitive set. JPMorgan and the
              SVB division of First Citizens bring balance sheet, institutional relationships, and operating history;
              Mercury, Ramp, and Brex compete for startup workflows; digital banks such as Varo, Green Dot, WebBank, and
              Pathward provide regulatory precedents; and crypto infrastructure providers compete for digital-asset
              activity. A fragmented combination of a conventional bank, a fintech platform, a custodian, and internal
              treasury operations remains a credible status quo substitute. Erebor's differentiation is therefore
              integration around a frontier-sector customer, not the absence of alternatives.
            claimRefs:
              - CP002
              - CP003
              - CP009
              - CP010
              - CP011
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
              - CP014
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP006
              - CP008
              - CP011
              - CP014
              - CP015
      - number: '3.2'
        title: Charter breadth helps, but product proof is uneven
        blocks:
          - type: paragraph
            body: >-
              The strongest documented distinction is structural. Official sources establish a national charter, FDIC
              insurance, and a disclosed product perimeter that includes deposits, credit, payments, treasury, and
              stablecoin-related services. The same plan says Erebor has no physical branches and does not provide
              fiduciary custody, while card issuance uses bank-partnership arrangements. Those boundaries matter: the
              charter can remove a sponsor-bank layer for core banking, but it does not eliminate partner or specialist
              dependencies across every workflow. Erebor's public website currently exposes little beyond sign-in and
              deposit-insurance language, so buyers cannot independently compare implementation detail, integrations,
              service levels, or package terms. The available evidence supports a differentiated scope, not a conclusion
              that every advertised capability is mature or superior to a bank-plus-fintech stack.
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP005
              - CP016
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP005
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
              - CP016
      - number: '3.3'
        title: Incumbent distribution sets a high durability bar
        blocks:
          - type: paragraph
            body: >-
              Distribution is the most important competitive counterweight. CNBC reports that JPMorgan's startup-banking
              operation serves nearly 12,000 clients with 550 bankers and is designed to retain founders from seed stage
              through public-market scale. That installed relationship base, combined with investment-banking,
              private-bank, and international capabilities, gives the incumbent multiple paths to cross-sell and lowers
              the risk that a customer outgrows it. Crypto Briefing reports that Erebor added more than 500 customers
              and more than $3 billion of deposits in a quarter, which is meaningful early traction but not evidence of
              exclusive or durable relationships. Switching costs should emerge only when credit, treasury, payment,
              compliance, and settlement workflows are embedded. The assigned evidence does not disclose cohort
              retention, primary-bank share, multi-homing, migration time, or realized contract terms.
            claimRefs:
              - CP007
              - CP008
              - CP012
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP003
              - CP005
              - CP007
              - CP008
              - CP009
              - CP016
      - number: '3.4'
        title: The moat is regulatory and relational, not yet economic
        blocks:
          - type: paragraph
            body: >-
              Erebor's defensibility currently rests on regulatory permission, sector-specific risk appetite, and access
              to founder and investor networks. Those advantages can accelerate entry, but they are contestable:
              Erebor's own plan identifies several branch-light digital banks as operating peers, and JPMorgan is
              investing directly in the startup segment. The stablecoin thesis also faces a substitute path. The BIS
              argues that tokenized commercial-bank money and central-bank settlement can deliver programmable finance
              while stablecoins remain constrained on singleness, elasticity, and integrity. The adverse case combines
              competition with concentration: Crypto Briefing warns that related-sector deposits may leave together
              under stress, while Senator Elizabeth Warren publicly criticized the approval as risky. FDIC's 12 percent
              tier 1 leverage requirement is a material buffer, but it does not prove pricing power, underwriting
              performance, or customer lock-in.
            claimRefs:
              - CP006
              - CP010
              - CP011
              - CP013
              - CP014
              - CP015
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: A real structural wedge
            body: >-
              Erebor can combine insured deposits, credit, treasury, payments, and stablecoin-related services under a
              national-bank relationship tailored to sectors that often require specialist underwriting.
            calloutType: strength
            claimRefs:
              - CP001
              - CP002
              - CP003
          - type: callout
            title: Distribution and concentration cut both ways
            body: >-
              Early deposit and customer growth shows demand, but a related-sector deposit base can leave together under
              stress while JPMorgan already has a large installed startup-banking franchise.
            calloutType: risk
            claimRefs:
              - CP007
              - CP012
              - CP013
          - type: callout
            title: Treat the moat as unproven
            body: >-
              Underwrite cohort retention, primary-bank share, deposit concentration, realized pricing, approval speed,
              credit losses, partner redundancy, and service levels before assigning value to durable lock-in.
            calloutType: recommendation
            claimRefs:
              - CP013
              - CP014
              - CP016
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization
        blocks:
          - type: paragraph
            body: >-
              Erebor appears to monetize a relationship-banking model rather than a mass-market subscription product.
              Sacra estimates July 2026 annualized revenue of $112 million, up from $31 million in March, and attributes
              68% of revenue to interest income on deposits; the remainder is described as payment fees, account fees,
              and BaaS fees. That mix makes deposit retention, asset yields, funding costs, and credit performance more
              important than list pricing. The retained evidence does not establish realized customer pricing, net
              interest margin, fee take rates, or audited revenue recognition. A high-touch customer base can support
              revenue per relationship, but concentration also makes revenue quality sensitive to a few large balances
              and to the performance of specialized lending. The revenue bridge below is therefore an evidence-backed
              operating hypothesis, not a forecast.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
            tableRef: TI002
            claimRefs:
              - CI003
              - CI004
              - CI012
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI011
      - number: '4.2'
        title: Unit economics and cost structure
        blocks:
          - type: paragraph
            body: >-
              Public estimates suggest a narrow-and-deep economics model: roughly 500–600 customers, approximately $7
              million of average deposits per customer, and about $175,000 of annualized revenue per customer. These are
              Sacra estimates rather than audited disclosures, and the denominator is a customer relationship, not a
              contract cohort or active operating account. Erebor's likely cost drivers include deposit servicing,
              specialized underwriting, compliance, custody or settlement controls, cybersecurity, and the capital
              required to support a national bank. The available evidence does not disclose CAC, payback, operating
              expense, provision expense, gross margin, return on equity, or customer retention. Underwriting should
              therefore treat the apparent revenue density as provisional until management supplies cohort,
              servicing-cost, and credit-loss data. AInvest specifically identifies custody, cybersecurity, and
              regulatory monitoring as recurring costs for crypto-native banking. Mercury provides a useful but
              non-comparable scale check: CNBC and Crunchbase reported $650 million of annualized revenue and four years
              of profitability, while CNBC reported more than 300,000 customers. That evidence does not create an Erebor
              margin benchmark because Mercury's customer mix, maturity, products, and charter status differ; it instead
              shows how much operating-history disclosure is missing for Erebor.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
              - CI015
          - type: table
            tableRef: TI003
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI009
      - number: '4.3'
        title: Capital adequacy and financing dependency
        blocks:
          - type: paragraph
            body: >-
              Regulatory approvals provide the clearest evidence in the retained corpus on minimum capital structure,
              but they do not establish commercial runway.       The FDIC required a minimum 12 percent Tier 1 leverage
              ratio during Erebor's first three years and required a Capital Call Agreement if the bank fell below
              required capital levels. Later reporting said deposits reached $4.6 billion by the end of July 2026 and
              annualized recurring revenue exceeded $100 million. A reported $1.5 billion financing at an $8 billion
              pre-money valuation remained a discussion, not a completed financing in the cited Retail Banker
              International account syndicated by Yahoo Finance. The bank's capital need is consequently tied to
              regulatory buffers, lending growth, liquidity management, and operating investment; the assigned evidence
              does not show cash on hand, burn, runway, debt, asset duration, deposit insurance mix, or the terms of any
              pending round.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The financial case is promising on reported deposit acquisition and early revenue velocity, but weak on
              verification and loss-bearing economics. FDIC materials establish that the institution was evaluated for
              capital, earnings prospects, management, and risk, yet deposit-insurance approval is not a substitute for
              current management accounts. The adverse evidence is also material: Banking Dive quoted Senator Elizabeth
              Warren warning that the venture could cater to the financial interests of Silicon Valley billionaires and
              create taxpayer exposure. That criticism does not prove a loss or supervisory failure, but it reinforces
              the need to test governance, concentration, underwriting, and political-regulatory risk. Mercury's
              independently reported scale and profitability history also make the disclosure gap visible without
              supplying a like-for-like benchmark. Until Erebor provides audited statements or a robust data room, the
              correct financial stance is research-more rather than underwriting the reported valuation.
            claimRefs:
              - CI007
              - CI014
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Early balance-sheet traction
            body: >-
              Independent and third-party reporting describes deposits rising from $1.1B in March to $4.6B by the end of
              July 2026, alongside annualized revenue above $100M; the figures remain unaudited.
            calloutType: strength
            claimRefs:
              - CI011
          - type: callout
            title: Underwriting data gap
            body: >-
              The retained assigned evidence does not disclose current cash, burn, runway, net interest margin, credit
              losses, deposit concentration by account, or realized pricing, so valuation and capital adequacy cannot be
              underwritten from this corpus alone.
            calloutType: risk
            claimRefs:
              - CI013
              - CI016
          - type: callout
            title: Financial diligence stance
            body: >-
              Treat reported growth as a lead, not a verified forecast, and require audited financials, regulatory
              capital reporting, deposit concentration, loan marks, liquidity assumptions, and financing terms before
              underwriting.
            calloutType: recommendation
            claimRefs:
              - CI009
              - CI013
              - CI016
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Customer workflow and product surface
        blocks:
          - type: paragraph
            body: >-
              Erebor's customer proposition is a specialized banking workflow rather than a mass-market app. The FDIC
              describes a proposed business model focused on deposit and lending products for businesses and individuals
              in technology, payment systems, investment, and defense, including virtual-currency participants.
              Independent profiles add operating accounts, lending, treasury, payments, custody, and
              virtual-currency-related services, while describing a branchless digital-first model. The useful
              distinction is ownership of a national-bank charter and balance sheet: Erebor is positioned to provide
              regulated accounts and credit directly, rather than only routing a fintech customer's activity through a
              sponsor bank. Public materials describe planned stablecoin settlement and payments, but do not establish
              that stablecoin issuance is live. The customer workflow therefore runs from onboarding and identity
              verification to deposits, treasury and payment rails, lending, and—subject to final rules and
              controls—digital-asset settlement. That breadth is strategically differentiated, but it also creates a
              large compliance and integration surface for an early-stage bank.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
