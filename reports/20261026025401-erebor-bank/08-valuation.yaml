company:
  name: Erebor Bank
chapter:
  number: 8
  title: Valuation
  summary: Erebor has secured meaningful regulatory and capital-market validation, but the public record still does not establish revenue, profitability, asset quality, or the terms of the reported financing. The evidence supports a research-more stance rather than underwriting the reported $8 billion pre-money valuation as a proven operating value.
sections:
  - id: recommendation
    title: Recommendation and price discipline
    body: >-
      The recommendation is research-more, with high risk and a stretched valuation
      stance. Erebor has cleared important institutional hurdles: the OCC conditionally
      approved its de novo national-bank charter, while the FDIC approved deposit
      insurance subject to capital and failure-preparation conditions. Those facts reduce
      licensing uncertainty, but they do not prove earnings power or balance-sheet quality.
      The reported financing discussion is also not a closed transaction: TechStartups
      describes advanced talks for roughly $1.5 billion at an $8 billion pre-money
      valuation, and explicitly says the talks could change. Because public sources do
      not disclose revenue, net income, credit losses, deposit concentration, or the
      proposed round's preferences, a price-sensitive investment decision should wait
      for primary transaction documents and operating data.
    claimRefs: [CV001, CV002, CV003, CV004, CV005]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: thesis-antithesis
    title: Investment thesis and anti-thesis
    body: >-
      The thesis is that a federally chartered bank focused on technology, payments,
      investment, defense, and virtual-currency customers could occupy a real service
      gap after the failures of specialized technology lenders. The OCC's approval
      statement confirms that permissible digital-asset activities can have a place in
      the federal banking system when conducted safely and soundly, while the FDIC
      describes a business model spanning technology, payment systems, investment, and
      defense. The anti-thesis is that niche exposure can amplify liquidity, compliance,
      and political risk. Banking Dive reports Senator Warren's concern that the venture
      could destabilize the banking system and require a taxpayer-funded bailout. Neither
      the positive regulatory signal nor the adverse warning resolves the central
      economic question: whether deposits can be converted into durable, risk-adjusted
      earnings.
    claimRefs: [CV006, CV007, CV008, CV009]
    tableRefs: [TV002]
  - id: scenarios
    title: Valuation scenarios and comparable anchors
    body: >-
      A scenario framework is more defensible than a point valuation because the
      disclosed operating base is incomplete. The reported $4 billion deposit balance
      and nearly fourfold growth since March are third-party reports, not audited
      financial statements; the same reporting says the new financing remains under
      negotiation. Public-market anchors show the scale of the premium being discussed:
      CompaniesMarketCap reports Customers Bancorp at a $2.85 billion market
      capitalization in October 2026, while the reported Erebor financing would imply
      an $8 billion pre-money value before any new capital. Coinbase's reported 2025
      revenue of $7.181 billion is a business-model reference, not a bank comparable,
      and cannot be used to infer Erebor revenue or a multiple. The base case therefore
      assumes continued franchise formation but no verified earnings multiple; the bear
      case centers on funding, concentration, and regulatory execution; and the bull
      case requires audited growth, durable margins, and a completed financing at or
      above the reported terms.
    claimRefs: [CV004, CV010, CV011, CV012, CV015]
    tableRefs: [TV003]
  - id: diligence-and-triggers
    title: Diligence asks and thesis-break triggers
    body: >-
      The valuation call should change only when the missing operating and transaction
      evidence is obtained. The highest-priority requests are the signed financing
      documents and cap table, deposit composition and concentration, audited revenue
      and expense data, credit and liquidity policies, and regulatory correspondence
      covering the charter conditions. Investors should monitor the Tier 1 leverage
      ratio, deposit retention and concentration, uninsured deposits, net interest
      margin, fee revenue, credit losses, compliance exceptions, and any delay in
      meeting launch or capital conditions. A completed round at the reported price
      would be a market signal, not independent proof of intrinsic value. Conversely,
      a down-round, material deposit outflow, failure to maintain required capital,
      adverse enforcement, or evidence that crypto-related demand is not converting
      into recurring revenue would break the current thesis.
    claimRefs: [CV015, CV016, CV017, CV018]
    tableRefs: []
tables:
  - id: TV001
    title: Recommendation summary
    columns: [Dimension, Assessment, Evidence basis, Decision implication]
    rows:
      - [Recommendation, research-more, "Regulatory approvals are public, but operating and transaction economics remain incomplete.", "Do not underwrite the reported price without primary diligence."]
      - [Confidence, medium, "OCC and FDIC records are primary; valuation and deposit figures are reported by secondary sources.", "Confidence should rise only with audited operating data and signed financing terms."]
      - [Risk rating, high, "Specialized exposure combines digital assets, technology customers, and a concentrated early-stage balance sheet.", "Use venture-style sizing and explicit downside limits."]
      - [Valuation stance, stretched, "Reported $8B pre-money is materially above the reported prior $4.35B valuation and above a public-bank market-cap anchor.", "Require price, preference, dilution, and profitability diligence."]
    notes: "Public evidence mixes regulator records, reported financing discussions, and market-data snapshots; no row should be read as an audited valuation or return forecast."
    claimRefs: [CV001, CV003, CV005, CV008, CV012]
  - id: TV002
    title: Thesis / anti-thesis
    columns: [Argument, Supporting evidence, What would change the view, Current implication]
    rows:
      - [Regulated access is a strategic asset, "OCC conditionally approved the de novo national-bank charter.", "A failure to satisfy ongoing conditions or a material supervisory restriction.", "Positive but not sufficient for an investment case."]
      - [Target-sector demand may be real, "Reported deposits rose from roughly $1B to roughly $4B since March.", "Verified deposit retention, concentration, and profitability by customer cohort.", "Promising signal with weak public quality disclosure."]
      - [The niche can amplify downside, "Banking Dive quotes concern that the venture could destabilize the banking system.", "Independent evidence of diversified deposits, conservative underwriting, and tested controls.", "High-risk exposure requires downside underwriting."]
      - [The price may be ahead of proof, "Reported financing terms imply $8B pre-money while talks could change.", "Signed documents plus audited revenue, earnings, and capital metrics.", "Research-more until valuation support improves."]
    notes: "The table separates issuer/regulator validation from third-party reports and adverse commentary; it does not treat any single source as a complete risk assessment."
    claimRefs: [CV006, CV007, CV008, CV009, CV010, CV011]
  - id: TV003
    title: Bull / base / bear scenario
    columns: [Scenario, Explicit assumptions, Valuation / return logic, Key risks, Probability signal]
    rows:
      - [Bull, "Deposits continue scaling; a financing closes near reported terms; recurring payments and lending revenue become visible; capital remains above requirements.", "An $8B pre-money price could be defensible only if audited growth and risk-adjusted profitability support a premium to established bank references.", "Execution, compliance, concentration, and valuation compression.", "Low-to-medium: several required inputs are not public."]
      - [Base, "Charter and deposit-insurance approvals stand; franchise develops, but revenue, margins, and final financing terms remain unverified.", "No reliable point valuation; maintain research-more and demand a price/disclosure reset before committing.", "Slow monetization, high compliance costs, and dilution.", "Medium: consistent with current public evidence."]
      - [Bear, "Deposit growth reverses or concentrates; financing is repriced or delayed; capital, compliance, or supervisory conditions become binding.", "Downside is principal impairment and/or a down-round; no public data supports a precise loss estimate.", "Liquidity flight, credit losses, regulatory intervention, and political scrutiny.", "Material: adverse commentary and early-stage opacity keep it live."]
      - [Trigger case, "Signed terms, audited metrics, or adverse supervisory findings materially change the information set.", "Re-underwrite using bank-specific earnings, capital, liquidity, and preference data rather than fintech revenue multiples.", "False precision from incomparable public-company benchmarks.", "Required before an investable recommendation."]
    notes: "These are qualitative scenarios, not probability-weighted forecasts. Public sources do not provide enough verified earnings, capital, or transaction data for a numeric valuation range."
    claimRefs: [CV002, CV003, CV010, CV012, CV015, CV018]
