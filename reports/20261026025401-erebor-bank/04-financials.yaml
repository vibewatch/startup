slug: erebor-bank
runDate: 2026-10-26
company:
  name: Erebor Bank
chapter:
  number: 4
  title: Financials
  summary: Erebor's public financial picture is a fast-growing but lightly disclosed deposit-and-lending model. Reported deposits and annualized revenue have scaled quickly, while the evidence base still lacks audited revenue, margin, credit-loss, liquidity, concentration, and runway disclosures needed for underwriting.
sections:
  - id: revenue-model
    title: Revenue model and monetization
    body: >-
      Erebor appears to monetize a relationship-banking model rather than a mass-market subscription product. Sacra estimates July 2026 annualized revenue of $112 million, up from $31 million in March, and attributes 68% of revenue to interest income on deposits; the remainder is described as payment fees, account fees, and BaaS fees. That mix makes deposit retention, asset yields, funding costs, and credit performance more important than list pricing. The retained evidence does not establish realized customer pricing, net interest margin, fee take rates, or audited revenue recognition. A high-touch customer base can support revenue per relationship, but concentration also makes revenue quality sensitive to a few large balances and to the performance of specialized lending. The revenue bridge below is therefore an evidence-backed operating hypothesis, not a forecast.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: unit-economics
    title: Unit economics and cost structure
    body: >-
      Public estimates suggest a narrow-and-deep economics model: roughly 500–600 customers, approximately $7 million of average deposits per customer, and about $175,000 of annualized revenue per customer. These are Sacra estimates rather than audited disclosures, and the denominator is a customer relationship, not a contract cohort or active operating account. Erebor's likely cost drivers include deposit servicing, specialized underwriting, compliance, custody or settlement controls, cybersecurity, and the capital required to support a national bank. The available evidence does not disclose CAC, payback, operating expense, provision expense, gross margin, return on equity, or customer retention. Underwriting should therefore treat the apparent revenue density as provisional until management supplies cohort, servicing-cost, and credit-loss data.
      AInvest specifically identifies custody, cybersecurity, and regulatory monitoring as recurring costs for crypto-native banking. Mercury provides a useful but non-comparable scale check: CNBC and Crunchbase reported $650 million of annualized revenue and four years of profitability, while CNBC reported more than 300,000 customers. That evidence does not create an Erebor margin benchmark because Mercury's customer mix, maturity, products, and charter status differ; it instead shows how much operating-history disclosure is missing for Erebor.
    claimRefs: [CI005, CI006, CI007, CI008, CI015]
    tableRefs: [TI003]
  - id: capital-adequacy
    title: Capital adequacy and financing dependency
    body: >-
      Regulatory approvals provide the clearest evidence in the retained corpus on minimum capital structure, but they do not establish commercial runway.       The FDIC required a minimum 12 percent Tier 1 leverage ratio during Erebor's first three years and required a Capital Call Agreement if the bank fell below required capital levels. Later reporting said deposits reached $4.6 billion by the end of July 2026 and annualized recurring revenue exceeded $100 million. A reported $1.5 billion financing at an $8 billion pre-money valuation remained a discussion, not a completed financing in the cited Retail Banker International account syndicated by Yahoo Finance. The bank's capital need is consequently tied to regulatory buffers, lending growth, liquidity management, and operating investment; the assigned evidence does not show cash on hand, burn, runway, debt, asset duration, deposit insurance mix, or the terms of any pending round.
    claimRefs: [CI009, CI010, CI011, CI012, CI013]
    tableRefs: []
  - id: underwriting-verdict
    title: Financial verdict and diligence blockers
    body: >-
      The financial case is promising on reported deposit acquisition and early revenue velocity, but weak on verification and loss-bearing economics. FDIC materials establish that the institution was evaluated for capital, earnings prospects, management, and risk, yet deposit-insurance approval is not a substitute for current management accounts. The adverse evidence is also material: Banking Dive quoted Senator Elizabeth Warren warning that the venture could cater to the financial interests of Silicon Valley billionaires and create taxpayer exposure. That criticism does not prove a loss or supervisory failure, but it reinforces the need to test governance, concentration, underwriting, and political-regulatory risk. Mercury's independently reported scale and profitability history also make the disclosure gap visible without supplying a like-for-like benchmark. Until Erebor provides audited statements or a robust data room, the correct financial stance is research-more rather than underwriting the reported valuation.
    claimRefs: [CI007, CI014, CI016]
    tableRefs: []
