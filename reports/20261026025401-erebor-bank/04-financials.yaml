      - [Payments, null, "Not disclosed in retained assigned evidence", "Fee revenue is aggregated with account fees", "Obtain ACH, wire, batch, and stablecoin fee schedules"]
      - [BaaS/API, null, "Not disclosed in retained assigned evidence", "API customers are identified but contracts are private", "Obtain minimums, usage tiers, pass-through costs, and termination rights"]
      - [Specialized credit, null, "Not disclosed in retained assigned evidence", "Facility examples do not disclose pricing", "Obtain spreads, fees, collateral haircuts, covenants, and loss assumptions"]
    notes: "Official or public pricing is not available in the assigned evidence; null means unavailable, not free or zero."
    claimRefs: [CI003, CI004, CI012]
  - id: TI003
    title: Unit economics and capital inputs
    columns: [Metric, Value, Confidence, Why it matters, Diligence ask]
    rows:
      - [Annualized revenue, "$112M in July 2026", "Medium; Sacra estimate", "Indicates early revenue velocity", "Reconcile to general ledger and separate interest from fees"]
      - [Annualized revenue per customer, "~$175K", "Low-to-medium; derived from Sacra estimates", "Shows relationship density but not profitability", "Provide cohort revenue, retention, and service cost"]
      - [Average deposits per customer, "~$7M", "Medium; Sacra estimate", "Highlights concentration and liquidity sensitivity", "Provide concentration by top 10/20 accounts and uninsured share"]
      - [Tier 1 leverage ratio, "Minimum 12% for first three years", "High; FDIC condition", "Defines a binding capital floor", "Provide current ratio, risk-weighted assets, and capital plan"]
      - [Mercury annualized revenue, "$650M in Q3 2025", "Medium; CNBC and Crunchbase reports", "Provides a maturity and scale reference, not a direct Erebor benchmark", "Normalize product mix, customer segment, and accounting basis before comparison"]
      - [Mercury operating record, "Four years of reported profitability", "Medium; attributed to Mercury by CNBC and Crunchbase", "Shows the operating-history evidence available for a more mature peer", "Compare audited margins and returns only after Erebor supplies equivalent periods"]
    notes: "Erebor values are estimates or regulatory conditions; Mercury is a non-like-for-like context point, and no comparator value is used to infer Erebor economics."
    claimRefs: [CI005, CI006, CI007, CI009]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: Reported customer deposits feed interest income, while payments, accounts, and BaaS/API activity provide noninterest revenue; specialized lending is a strategic deployment path whose economics remain undisclosed.
    data:
      nodes:
        - id: deposits
          label: "Large customer deposits"
          detail: "Reported deposits reached $4.6B by end-July 2026; customer concentration is estimated."
        - id: interest
          label: "Interest income"
          detail: "Sacra estimates 68% of revenue comes from interest income on deposits."
        - id: payments
          label: "Payments and account fees"
          detail: "Payment and account fees are part of the estimated 32% noninterest share."
        - id: baas
          label: "BaaS/API fees"
          detail: "Sacra describes BaaS fees as a minority revenue contributor."
        - id: lending
          label: "Loans and specialized credit"
          detail: "Retained reporting describes lending against specialized collateral; assigned evidence does not establish portfolio economics."
        - id: revenue
          label: "Reported/estimated revenue"
          detail: "Sacra estimates $112M annualized revenue in July 2026."
      edges:
        - [deposits, interest]
        - [deposits, lending]
        - [payments, revenue]
        - [baas, revenue]
        - [interest, revenue]
        - [lending, revenue]
    approximationNotes: "The diagram describes the reported operating model; it does not calculate revenue, margin, conversion, or profitability."
    claimRefs: [CI001, CI002, CI003, CI004, CI011]
callouts:
  - calloutType: strength
    title: Early balance-sheet traction
    body: "Independent and third-party reporting describes deposits rising from $1.1B in March to $4.6B by the end of July 2026, alongside annualized revenue above $100M; the figures remain unaudited."
    claimRefs: [CI011]
  - calloutType: risk
    title: Underwriting data gap
    body: "The retained assigned evidence does not disclose current cash, burn, runway, net interest margin, credit losses, deposit concentration by account, or realized pricing, so valuation and capital adequacy cannot be underwritten from this corpus alone."
    claimRefs: [CI013, CI016]
  - calloutType: recommendation
    title: Financial diligence stance
    body: "Treat reported growth as a lead, not a verified forecast, and require audited financials, regulatory capital reporting, deposit concentration, loan marks, liquidity assumptions, and financing terms before underwriting."
    claimRefs: [CI009, CI013, CI016]
