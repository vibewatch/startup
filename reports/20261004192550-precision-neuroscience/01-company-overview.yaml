callouts:
  - calloutType: "insight"
    title: "Strategic Positioning of Surface-Conforming Cortical Arrays"
    body: "Precision's choice of an ultra-thin, surface-conforming microelectrode array provides a distinct competitive differentiation against penetrating intracortical technologies like Neuralink. By avoiding the insertion of sharp micro-needles into cortical parenchyma, Precision circumvents long-term glial scarring and parenchymal tissue damage while retaining high temporal and spatial resolution. Crucially, the ability to safely remove the device establishes a regulatory and clinical safety profile tailored for rapid hospital adoption."
    claimRefs:
      - "CO003"
      - "CO004"
      - "CO014"
  - calloutType: "risk"
    title: "Long-Term Commercialization, Cost, and Reimbursement Headwinds"
    body: "While Precision has achieved strong clinical feasibility with over 100 patient cases across 18 medical centers, commercial viability remains unproven. Hardware device costs estimated between $25,000 and $60,000 create substantial reimbursement friction unless robust clinical outcome data demonstrates reduced health system expenditures or restorative functional gains. Furthermore, a severe shortage of neurosurgeons trained in specialized BCI implantation protocols may throttle broad geographic scaling."
    claimRefs:
      - "CO015"
      - "CO016"
