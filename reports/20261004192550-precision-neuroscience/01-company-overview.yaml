chapter:
  number: 1
  title: "Company Overview"
  summary: "Precision Neuroscience is a clinical-stage neural platform developing the Layer 7 Cortical Interface, a minimally invasive, surface-conforming brain-computer interface designed for high-resolution neural recording without brain tissue penetration. Founded in 2021 and based in New York, the company has raised $430 million in total equity capital—capped by an oversubscribed $250 million Series D in September 2026—while scaling human clinical procedures across 18 medical institutions and establishing key strategic partnerships."
sections:
  - id: "corporate-identity-and-mission"
    title: "Corporate Identity, Foundation, and BCI Architecture"
    body: "Precision Neuroscience Corporation is a neural platform and medical device company founded in 2021 by Chief Executive Officer Michael Mager and Chief Science Officer Dr. Benjamin Rapoport. Based in New York City with offices near Union Square and Manhattan, the company was established to develop breakthrough clinical treatments for millions of individuals living with severe neurological disorders, including spinal cord injuries, stroke, and amyotrophic lateral sclerosis (ALS). Rather than utilizing penetrating microelectrode intracortical arrays that insert sharp needles directly into cerebral tissue, Precision engineered the Layer 7 Cortical Interface—a microelectrode array that conforms gently to the surface of the brain through a minimally invasive cranial slit procedure. This architectural approach avoids neural tissue parenchymal damage and ensures the implant is safely removable while retaining high-density signal acquisition capacity. By prioritizing reversibility, biological safety, and streamlined neurosurgical workflows, Precision aims to bridge high-resolution neural decoding with mainstream operative neurosurgery."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
    tableRefs:
      - "TO001"
  - id: "executive-leadership-and-governance"
    title: "Founders, Leadership Structure, and Key Personnel"
    body: "The leadership team at Precision combines specialized neurosurgical engineering with executive experience across high-growth health technology and medical device commercialization. Co-founder and CSO Dr. Benjamin Rapoport, an MD-PhD neurosurgeon who previously co-founded Neuralink and Symbionics, leads technical and scientific development alongside co-founder and CEO Michael Mager. In July 2024, Precision expanded its C-suite by appointing Jayme Strauss, RN, MSN, MBA—formerly Chief Clinical Officer at healthcare AI company Viz.ai—as Chief Clinical and Commercial Officer, and Mike Kaswan—former CFO at Orchestra BioMed who brings over 30 years of healthcare financial leadership—as Chief Financial Officer. The executive technical core is further strengthened by Dr. Craig Mermel, President and Chief Product Officer, who previously led computational engineering teams at Apple and Google. In addition, pioneer neuroscientist Dr. John Donoghue, founder of BrainGate and 2026 Queen Elizabeth Prize for Engineering laureate, serves as Scientific Advisor. Despite this deep bench, the organization carries material key-person dependence on its founding scientific leadership given the proprietary micro-electrocorticography technology and rigorous FDA navigation required."
    claimRefs:
      - "CO005"
      - "CO006"
      - "CO007"
      - "CO008"
    tableRefs:
      - "TO002"
  - id: "capitalization-and-stakeholder-ecosystem"
    title: "Capitalization History, Investor Base, and Commercial Alliances"
    body: "Precision has raised $430 million in cumulative equity financing across four institutional investment rounds since inception. Following an early Series A and a $41 million Series B in 2023 led by Forepont Capital Partners, the company completed a $102 million Series C funding round in late 2024 at an estimated $500 million post-money valuation. In September 2026, Precision closed an oversubscribed $250 million Series D financing co-led by Pershing Square Inc., the Ackman Oxman Institute, and an undisclosed leading life sciences investment fund, with broad participation from institutional investors including B Capital, Duquesne Family Office, ARK Invest, Mubadala Capital, Invus, Mirae Asset Capital, and Alumni Ventures. Beyond financial capital, Precision secured a critical commercial partnership with Medtronic in January 2026 to co-develop an integrated operative solution combining the Layer 7 cortical interface with Medtronic's StealthStation 3D surgical navigation platform. Furthermore, the company established end-to-end supply chain control through a wholly owned MEMS microelectrode manufacturing foundry in Texas."
    claimRefs:
      - "CO009"
      - "CO010"
      - "CO011"
      - "CO012"
    tableRefs:
      - "TO003"
  - id: "clinical-execution-and-milestone-trajectory"
    title: "Clinical Trajectory, Commercial Realities, and Adoption Hurdles"
    body: "Between 2023 and late 2026, Precision advanced from initial intraoperative feasibility studies to a multi-center clinical network encompassing 18 leading academic medical institutions, including Penn Medicine, Mount Sinai Health System, WVU Rockefeller Neuroscience Institute, and University of Chicago Medicine. Cumulative patient procedures exceeded 100 cases, demonstrating real-time motor decoding across high-density configurations scaling up to 4,096 electrodes. In parallel, the company secured FDA clearance for its Layer 7 Cortical Interface. However, significant adoption hurdles persist across the brain-computer interface landscape. Commercial revenue generation remains in early development stages, with industry device unit costs estimated between $25,000 and $60,000 excluding operating room implantation and longitudinal computational analysis fees. Long-term commercial scale is heavily constrained by institutional reimbursement uncertainty, the limited supply of specialized neurosurgeons, and the multi-year timelines required to establish durable ambulatory efficacy in chronic patient cohorts."
    claimRefs:
      - "CO013"
      - "CO014"
      - "CO015"
      - "CO016"
    figureRefs:
      - "FO001"
