    title: "Commercial market size remains unproven"
    body: "Do not capitalize the $400 billion promotional opportunity estimate as if it were Precision revenue potential. Require indication-level eligibility, pricing, payer coverage, addressable centers, procedure capacity, utilization, and company share before underwriting a SAM or SOM."
    claimRefs:
      - "CM001"
      - "CM002"
      - "CM016"
  - calloutType: "insight"
    title: "Integration may matter more than category publicity"
    body: "The Medtronic pathway is strategically relevant because it places the interface in an existing surgical workflow, while LaunchSquad's media count is evidence of communications reach rather than procurement or patient demand."
    claimRefs:
      - "CM004"
      - "CM006"
      - "CM014"
