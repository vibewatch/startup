chapter:
  number: 2
  title: "Market Analysis"
  summary: "Precision's evidenced near-term market is narrower than the broad brain-computer-interface narrative: hospital-based cortical mapping and assistive digital control for people with severe paralysis. A promotional secondary source repeats a $400 billion U.S. opportunity estimate, but the assigned evidence does not establish a company-specific SAM, SOM, price, reimbursement path, or market CAGR."
sections:
  - id: "market-boundary"
    title: "Market boundary: clinical workflows, not all neurological illness"
    body: >-
      The defensible boundary has two clinical use frames. First, Precision and Medtronic say they
      will combine Layer 7 with StealthStation so neurosurgeons can receive structural and
      functional information in the operating room; that places cortical-interface hardware and
      workflow integration inside the boundary. Second, company-issued materials describe a full
      BCI intended to let people with paralysis control computers or smartphones, placing
      assistive digital control inside the longer-term boundary. General neurological care, the
      full population living with neurological illness, consumer wellness, gaming, and unrelated
      neurosurgical spend remain outside company-specific sizing. The only directly described
      status quo is surgeons' use of separate structure and function tools, not a quantified
      substitute market.
    claimRefs:
      - "CM004"
      - "CM005"
      - "CM008"
      - "CM013"
    tableRefs:
      - "TM001"
  - id: "sizing-lenses"
    title: "Sizing lenses: one promotional opportunity estimate, no supportable SAM or SOM"
    body: >-
      StartEngine repeats a Morgan Stanley estimate of nearly 10 million potential U.S. BCI
      candidates and a $400 billion opportunity. That is a broad top-down lens, not Precision
      revenue, and StartEngine expressly says its information has not been independently verified.
      Other assigned sources use much broader denominators: a B Capital job-board profile says one
      billion people worldwide have neurological illness, while Precision releases refer only to
      millions. These populations are not interchangeable with eligible implant candidates.
      Because the pool supplies no indication filter, adoption rate, price, reimbursement,
      procedure capacity, or company share, converting those figures into a company-specific SAM
      or SOM would create false precision. The sizing table therefore preserves the lenses and
      their limitations rather than deriving revenue.
    claimRefs:
      - "CM001"
      - "CM002"
      - "CM003"
      - "CM013"
      - "CM016"
    tableRefs:
      - "TM002"
    figureRefs:
      - "FM001"
  - id: "buyers-and-adoption-path"
    title: "Buyer, user, payer, and channel roles"
    body: >-
      The evidence supports role mapping more strongly than budget sizing. Hospitals and health
      systems are research and adoption counterparties; neurosurgeons are the immediate clinical
      users of the proposed integrated operating-room system; and people with paralysis are the
      intended beneficiaries of assistive control. Precision also hired a commercial leader to
      establish hospital relationships and drive adoption. Medtronic could provide an installed
      navigation workflow and a trusted distribution context, but the announcement contains no
      procurement commitment, sales volume, price, or exclusivity. No assigned source identifies
      the actual hospital budget owner or payer for either temporary mapping or a full chronic
      BCI. Those unknowns prevent a supported conversion from clinical interest to purchasable
      demand.
    claimRefs:
      - "CM004"
      - "CM006"
      - "CM011"
      - "CM012"
      - "CM015"
    tableRefs:
      - "TM003"
  - id: "drivers-constraints-and-valuation-relevance"
    title: "Adoption drivers, constraints, and valuation relevance"
    body: >-
      Three reported milestones improve adoption plausibility without proving commercial demand.
      Alumni Ventures reported 17 implanted patients across three centers in July 2024; a
      company-issued June 2025 release reported testing in more than 40 patients and a first FDA
      clearance; and the January 2026 Medtronic announcement proposed integration into an existing
      surgical platform. These are different vintages and should not be read as customers or
      recurring procedures. Constraints remain material: Precision itself emphasizes safety and
      trust, StartEngine's offering page warns that its company information is not independently
      verified, and LaunchSquad's media-coverage count measures communications output rather than
      buyer demand. Valuation should therefore weight verified purchasing, payer coverage,
      utilization, and retention evidence above broad disease-burden or publicity metrics.
    claimRefs:
      - "CM002"
      - "CM007"
      - "CM009"
      - "CM010"
      - "CM014"
    calloutRefs: []
