      - number: '4.3'
        title: Capital Adequacy, Cash Burn Trajectory, and Underwriting Verdict
        blocks:
          - type: paragraph
            body: >-
              Precision has raised $430M in cumulative private equity across six financing rounds to insulate its
              high-burn development roadmap. In September 2026, the company closed an oversubscribed $250M Series D
              round led by Pershing Square and The Ackman Oxman Institute at a post-money valuation of $1B. SEC Form D
              filings confirm $249,999,984 sold across 460 participating investors, building on a $102M Series C closed
              in December 2024 at a $500M valuation and earlier rounds of $41M in 2023. Secondary market trading on
              platforms such as Hiive reflected indicative pricing of $8.38 per share in mid-2026, indicating sustained
              investor appetite despite pre-commercial operating losses.


              The resulting underwriting verdict requires strict diligence caveats. The newly secured $250M capital
              infusion provides comfortable runway of roughly 36 to 48 months under estimated annual burn rates of $50M
              to $70M. However, macroeconomic projections from healthcare market analysts suggest aggregate industry
              revenues for brain-computer interfaces may not exceed $1B annually until 2041 due to slow clinical trial
              enrollment, neurosurgeon training constraints, and insurer resistance. Precision's long-term enterprise
              valuation depends not on private venture marks, but on demonstrating clinical efficacy and health-economic
              payback to secure third-party reimbursement.
            claimRefs:
              - CI010
              - CI013
              - CI014
              - CI015
              - CI016
