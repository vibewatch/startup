chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Foundation, and BCI Architecture
        blocks:
          - type: paragraph
            body: >-
              Precision Neuroscience Corporation is a neural platform and medical device company founded in 2021 by
              Chief Executive Officer Michael Mager and Chief Science Officer Dr. Benjamin Rapoport. Based in New York
              City with offices near Union Square and Manhattan, the company was established to develop breakthrough
              clinical treatments for millions of individuals living with severe neurological disorders, including
              spinal cord injuries, stroke, and amyotrophic lateral sclerosis (ALS). Rather than utilizing penetrating
              microelectrode intracortical arrays that insert sharp needles directly into cerebral tissue, Precision
              engineered the Layer 7 Cortical Interface—a microelectrode array that conforms gently to the surface of
              the brain through a minimally invasive cranial slit procedure. This architectural approach avoids neural
              tissue parenchymal damage and ensures the implant is safely removable while retaining high-density signal
              acquisition capacity. By prioritizing reversibility, biological safety, and streamlined neurosurgical
              workflows, Precision aims to bridge high-resolution neural decoding with mainstream operative
              neurosurgery.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
