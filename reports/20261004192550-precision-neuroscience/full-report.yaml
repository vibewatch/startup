      - number: '5.4'
        title: Technical risk, controls, and roadmap
        blocks:
          - type: paragraph
            body: >-
              The central underwriting gap is the distance between a disclosed cortical-array architecture and a
              dependable end-to-end clinical product. The retained sources do not provide primary test reports for
              chronic biocompatibility, explant outcomes, wireless security, software validation, sterilization,
              adverse-event rates, uptime, or field support. The company homepage says the platform will expand to more
              brain regions, but it gives no dated release plan, indication sequence, or verification threshold [CE014].
              The available FDA-clearance claim narrows regulatory uncertainty for a stated function, yet the assigned
              evidence does not include the clearance summary needed to verify indications, contraindications, duration,
              or required controls [CE008]. These omissions should be treated as material diligence requests rather than
              inferred product capabilities.
