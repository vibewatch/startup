      - number: '7.4'
        title: Financial opacity requires staged capital and explicit kill criteria
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence does not disclose revenue, gross margin, operating loss, cash, burn, runway,
              manufacturing working capital, or the capital required to reach chronic-use commercialization. Moreover, a
              current company job repost says more than $430 million has been raised since founding, while an
              independently hosted summary reports total funding of $180 million as of January 2026. These are
              funding-raised claims with unclear basis and are not cash available; the discrepancy must be reconciled
              rather than averaged. Capital should be staged behind documentary milestones: confirmed regulatory scope
              and chronic-use path, reproducible safety and performance across larger cohorts, closure of major quality
              or security findings, validated manufacturing yields and dual-source plans, durable hospital and Medtronic
              contracts, and a board-approved cash forecast. A material regulatory setback, serious device-related
              safety signal, unresolved critical software finding, failed manufacturing validation, loss of a key
              platform or trial-site relationship, or runway below the board's next-financing threshold should pause
              deployment and trigger re-underwriting.
            claimRefs:
              - CR015
              - CR016
