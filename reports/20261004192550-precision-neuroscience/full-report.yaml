  - id: TV002
    title: Thesis and Anti-Thesis Table
    columns:
      - Perspective
      - Core Thesis / Anti-Thesis Argument
      - Supporting Evidence & Strategic Context
      - What Would Change the View
    rows:
      - - Investment Thesis
        - Superior surface-conforming BCI safety profile over penetrating arrays.
        - Over 100 patient cases across 18 centers; 4,096-channel recording; FDA 510(k) clearance achieved.
        - Evidence of persistent chronic signal degradation or severe mechanical displacement in ambulatory patients.
      - - Investment Thesis
        - Medtronic commercial distribution accelerates operating room integration.
        - Strategic co-development integrating Layer 7 with StealthStation navigation platform.
        - Dissolution of partnership or failure to convert co-development into global co-marketing distribution.
      - - Investment Thesis
        - Robust capitalization enables multi-year chronic IDE trial execution.
        - $250M Series D closed in September 2026 brings total capital raised to $430M.
        - Excessive cash burn exceeding $80M annually without achieving chronic regulatory IDE milestones.
      - - Anti-Thesis
        - Severe reimbursement hurdles without established CPT codes or payer coverage.
        - Device unit cost estimated between $25,000 and $60,000 creates hospital procurement resistance.
        - Demonstrated health economics showing caregiving cost reductions and successful CMS NTAP award.
      - - Anti-Thesis
        - Specialized neurosurgical labor bottleneck restricts commercial procedural volume.
        - Only specialized cranial slit surgeons at tertiary academic hospitals currently perform procedures.
        - >-
          Standardization of surgical protocol enabling community neurosurgeons to perform routine outpatient
          implantation.
      - - Anti-Thesis
        - High valuation multiple leaves no room for clinical trial execution slippage.
        - $1.03B post-money valuation with negligible commercial revenue implies steep down-round risk.
        - Rapid commercial adoption of temporary monitoring system generating >$50M in high-margin annual revenue.
    notes: Compares structural thesis drivers against commercial and regulatory failure modes.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV007
      - CV011
