            body: >-
              Even with FDA 510(k) clearance for acute monitoring, the lack of dedicated CMS reimbursement codes and
              established insurer coverage poses an acute barrier to hospital procurement. Hardware priced at $25,000 to
              $60,000 cannot achieve broad commercial uptake if neurosurgical departments must absorb device acquisition
              costs within existing DRG bundles without New Technology Add-on Payments.
            calloutType: risk
