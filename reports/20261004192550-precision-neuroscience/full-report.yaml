              $60,000 create substantial reimbursement friction unless robust clinical outcome data demonstrates reduced
              health system expenditures or restorative functional gains. Furthermore, a severe shortage of
              neurosurgeons trained in specialized BCI implantation protocols may throttle broad geographic scaling.
