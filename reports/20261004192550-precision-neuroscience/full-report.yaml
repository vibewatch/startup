      - number: '1.3'
        title: Capitalization History, Investor Base, and Commercial Alliances
        blocks:
          - type: paragraph
            body: >-
              Precision has raised $430 million in cumulative equity financing across four institutional investment
              rounds since inception. Following an early Series A and a $41 million Series B in 2023 led by Forepont
              Capital Partners, the company completed a $102 million Series C funding round in late 2024 at an estimated
              $500 million post-money valuation. In September 2026, Precision closed an oversubscribed $250 million
              Series D financing co-led by Pershing Square Inc., the Ackman Oxman Institute, and an undisclosed leading
              life sciences investment fund, with broad participation from institutional investors including B Capital,
              Duquesne Family Office, ARK Invest, Mubadala Capital, Invus, Mirae Asset Capital, and Alumni Ventures.
              Beyond financial capital, Precision secured a critical commercial partnership with Medtronic in January
              2026 to co-develop an integrated operative solution combining the Layer 7 cortical interface with
              Medtronic's StealthStation 3D surgical navigation platform. Furthermore, the company established
              end-to-end supply chain control through a wholly owned MEMS microelectrode manufacturing foundry in Texas.
