            body: >-
              Precision's own recruiting material shows that its software stack is not a peripheral web product: the
              role would build real-time and offline physiological-data analytics, patient-information infrastructure,
              and a cloud platform inside an IEC 62304-compliant development lifecycle. That creates simultaneous
              software-quality, cybersecurity, privacy, and clinical-operations exposure. Company-issued material also
