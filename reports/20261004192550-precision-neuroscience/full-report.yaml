  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'BCI Landscape: Direct Peers, Incumbents, and Substitute Modalities'
        blocks:
          - type: paragraph
            body: >-
              The neural interface and neurotechnology landscape divides into three competitive tiers: direct
              implantable BCI peers, entrenched neurosurgical equipment incumbents, and non-invasive assistive
              technology substitutes. Among direct peers, Elon Musk's Neuralink represents the primary invasive
              competitor, leveraging over $600 million to $685 million in private funding to advance intracortical
              penetrating microelectrode arrays requiring full craniotomies and robotic inserters. Synchron represents
              the primary endovascular alternative, having secured $75 million in venture backing to place its Stentrode
              vascular electrode array via the jugular vein without open craniotomy, albeit with constrained recording
              bandwidth. Precision occupies a differentiated middle position, utilizing an ultra-thin 400-micron
              micro-slit cranial insertion that places its 1,024-channel Layer 7 array directly onto the cerebral cortex
              without penetrating brain parenchyma. In addition to clinical-stage startups such as Science Corporation,
              which raised $150 million, entrenched medical device conglomerates like Medtronic dominate hospital
              neurosurgical workflows through surgical navigation systems, deep brain stimulation (DBS) consoles, and
              cranial instrumentation. Rather than directly challenging Medtronic's institutional infrastructure,
              Precision has partnered with Medtronic to integrate Layer 7 into the StealthStation surgical navigation
              platform, effectively turning an incumbent into a strategic distribution ally. Status-quo substitutes,
              such as non-invasive eye-tracking systems, external electroencephalography (EEG) caps, and standard
              electrocorticography (ECoG) grids, present minimal surgical risk but suffer from severely limited spatial
              resolution, low decoding bitrates, and mechanical instability.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
      - number: '3.2'
        title: Competitor Profiles, Technical Architecture, and Architectural Trade-Offs
        blocks:
          - type: paragraph
            body: >-
              Evaluating competitive differentiation across the BCI sector requires examining architectural trade-offs
              between signal fidelity, tissue preservation, and procedural reversibility. Neuralink's penetrating
              electrode threads record action potentials from single neurons within cortical parenchyma, delivering
              high-bandwidth motor control decoding; however, penetrating architectures cause localized micro-trauma,
              trigger glial scar encapsulation, and cannot be safely explanted without significant tissue destruction.
              Conversely, Synchron avoids cranial surgery entirely by deploying an endovascular stent within the
              superior sagittal sinus adjacent to the motor cortex, achieving favorable procedural safety at the expense
              of lower signal-to-noise ratios and coarse channel density. Precision's Layer 7 cortical interface targets
              an optimal clinical compromise: an array approximately one-fifth the thickness of a human hair conforming
              to the brain surface across a 1.5-square-centimeter footprint. By recording surface field potentials
              across 1,024 electrodes per unit (and scaling up to 4,096 channels across four arrays in intraoperative
              demonstrations), Precision captures high-resolution neural video without puncturing tissue boundaries.
              This non-damaging profile allows devices to be safely removed or exchanged, transforming clinical
              validation by enabling rapid multi-patient intraoperative studies across more than 40 neurosurgical
              patients and three major academic medical centers. However, while Neuralink has achieved months of
              continuous home-use digital control in quadriplegic human subjects, Precision's commercial clearances to
              date remain restricted to acute intraoperative and temporary monitoring windows of up to 30 days, leaving
              permanent chronic implantation an unproven clinical milestone.
            claimRefs:
              - CP002
              - CP005
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP005
              - CP006
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
          - type: figure
            figureRef: FP001
