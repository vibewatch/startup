        title: Maturity, manufacturing, and deployment signals
        blocks:
          - type: paragraph
            body: >-
              Company-issued surfaces report that Layer 7 received FDA clearance, and a June 2025 release described the
              cleared functions as recording, monitoring, and stimulating electrical activity on the brain's surface
              [CE008]. Deployment indicators show progression but are not directly comparable: an investor post reported
