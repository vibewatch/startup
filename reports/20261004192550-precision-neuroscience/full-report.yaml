      - number: '6.4'
        title: Adoption Headwinds, Economic Barriers, and Customer Concentration Realities
        blocks:
          - type: paragraph
            body: >-
              Despite clinical milestones and strategic distribution alliances, Precision confronts substantial
              commercial headwinds that threaten adoption trajectory, customer retention, and revenue durability.
              Independent market analyses indicate that the estimated hardware cost of Precision's BCI device ranges
              between $25,000 and $60,000, which entirely excludes operating room surgical costs, neurosurgical fees,
              and continuous post-operative computational signal analysis. Without established Current Procedural
              Terminology (CPT) reimbursement codes or favorable Medicare coverage determinations, institutional
              hospitals face severe financial risk if they adopt the device outside of subsidised clinical research
              protocols. Furthermore, the specialized nature of cranial microelectrode placement creates severe channel
              dependence on a scarce national cohort of board-certified neurosurgeons and specialized tertiary surgical
              centers. In the broader neurotechnology landscape, precision neuroscience methodologies also encounter
              substantial interpretability, standardization, and workflow integration hurdles across clinical cohorts.
              Until long-term ambulatory efficacy and cost-effectiveness are rigorously established, hospital adoption
              will remain concentrated among elite research centers, with commercial churn or pilot stall posing an
              ongoing risk.
            claimRefs:
              - CU013
              - CU014
              - CU015
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Medtronic Alliance Circumvents the Hospital Procurement Chasm
            body: >-
              Medical device startups frequently stall when attempting to sell standalone hardware consoles into
              risk-averse hospital operating rooms. Precision's strategic co-development agreement with Medtronic
              transforms its commercial distribution model from direct capital equipment selling into a software- and
              consumable-enabled feature of Medtronic's StealthStation navigation ecosystem. Because Medtronic already
              controls dominant market share across cranial neurosurgical suites, integrating Layer 7 directly into
              existing navigation workflows effectively bypasses traditional hospital procurement friction and provides
              an immediate global footprint.
            calloutType: insight
            claimRefs:
              - CU010
              - CU011
              - CU012
          - type: callout
            title: Economic Viability Throttled by Device Costs and Reimbursement Vacuum
            body: >-
              With hardware device costs estimated between $25,000 and $60,000 per unit excluding operating room
              surgical fees and computational support, Precision's commercial transition faces extreme economic
              headwinds. In the absence of established CPT reimbursement codes, hospital value analysis committees
              cannot justify device procurement outside of subsidised clinical research protocols. Furthermore, a severe
              national shortage of specialized neurosurgeons capable of performing precision cranial implantations
              threatens to limit commercial scalability to a handful of high-volume academic medical centers.
            calloutType: risk
            claimRefs:
              - CU013
              - CU014
              - CU015
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and clinical risk is the primary thesis constraint
        blocks:
          - type: paragraph
            body: >-
              The strongest public milestone is narrower than the ultimate paralysis-use thesis. An independent summary
              reports that the Layer 7 Cortical Interface received 510(k) clearance for commercial use with implantation
              durations of up to 30 days, while the fully implantable wireless version intended for long-term use is
              still described as being developed. The retained literature summary also describes pilot human testing in
              five patients and a later four-patient intraoperative study whose authors noted the small sample. These
              facts make label expansion, chronic-use safety, durability, and pivotal evidence the highest residual
              risks; the current evidence does not justify treating an absence of reported device-related events in one
              small study as proof of broad safety. Investment progression should therefore require the actual FDA
              clearance letter, indication and labeling, complete trial protocols, adverse-event tables, and a dated
              long-term regulatory plan.
            claimRefs:
              - CR001
