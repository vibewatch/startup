  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and operating mechanism
        blocks:
          - type: paragraph
            body: >-
              Layer 7 is a surface cortical interface rather than a penetrating intracortical implant. Precision says
              the thin array is inserted through a micro-slit, conforms to the brain's surface, records and stimulates
              through high-density electrodes, and is designed for removal or replacement [CE001, CE002, CE007]. A 2025
              technical review describes an array with up to 1,024 platinum electrodes and a five-micrometer polyimide
