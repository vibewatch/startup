      - number: '6.2'
        title: Institutional Deployments, Academic Partnerships, and Clinical Trial Network
        blocks:
          - type: paragraph
            body: >-
              Precision has established a high-profile multi-center clinical network spanning premier academic medical
              institutions across the United States. Initial first-in-human intraoperative studies began at West
              Virginia University's Rockefeller Neuroscience Institute (WVU RNI), placing the Layer 7 cortical surface
              microelectrode array temporarily on human brains during planned neurosurgeries. This clinical footprint
              expanded to include the Perelman School of Medicine at the University of Pennsylvania (Penn Medicine) and
              the Mount Sinai Health System in New York, where surgical teams demonstrated record-setting neural
              recording density by placing four 1,024-electrode arrays (4,096 total channels) simultaneously on a
              patient's cortex. As the company progressed from early feasibility to expanded cohort evaluations,
              clinical trial and research partnerships extended to major academic healthcare systems including Johns
              Hopkins Medicine, Mass General Brigham, Beth Israel Deaconess Medical Center, Northwestern Medicine, Emory
              Healthcare, Barrow Neurological Institute, NYU Langone, UChicago Medicine, Michigan Medicine, and Thomas
              Jefferson University. In July 2024, Precision appointed former Viz.ai executive Jayme Strauss as Chief
              Clinical and Commercial Officer to institutionalize these research alliances and prepare hospital networks
              for commercial product rollout.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
