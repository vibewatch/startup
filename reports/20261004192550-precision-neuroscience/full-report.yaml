        title: Founders, Leadership Structure, and Key Personnel
        blocks:
          - type: paragraph
            body: >-
              The leadership team at Precision combines specialized neurosurgical engineering with executive experience
              across high-growth health technology and medical device commercialization. Co-founder and CSO Dr. Benjamin
              Rapoport, an MD-PhD neurosurgeon who previously co-founded Neuralink and Symbionics, leads technical and
              scientific development alongside co-founder and CEO Michael Mager. In July 2024, Precision expanded its
              C-suite by appointing Jayme Strauss, RN, MSN, MBA—formerly Chief Clinical Officer at healthcare AI company
              Viz.ai—as Chief Clinical and Commercial Officer, and Mike Kaswan—former CFO at Orchestra BioMed who brings
              over 30 years of healthcare financial leadership—as Chief Financial Officer. The executive technical core
              is further strengthened by Dr. Craig Mermel, President and Chief Product Officer, who previously led
              computational engineering teams at Apple and Google. In addition, pioneer neuroscientist Dr. John
              Donoghue, founder of BrainGate and 2026 Queen Elizabeth Prize for Engineering laureate, serves as
              Scientific Advisor. Despite this deep bench, the organization carries material key-person dependence on
              its founding scientific leadership given the proprietary micro-electrocorticography technology and
              rigorous FDA navigation required.
