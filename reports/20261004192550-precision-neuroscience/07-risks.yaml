chapter:
  number: 7
  title: "Risks"
  summary: >-
    The central risk is a scope-and-scale gap: public evidence describes a cortical interface cleared
    for implantation lasting up to 30 days, while the long-term, fully implantable wireless system
    remains a development objective. Execution also depends on regulated software, proprietary
    manufacturing, clinical sites, and a new Medtronic integration, while cash runway, security
    assurance, supplier concentration, and long-term safety remain undisclosed in the assigned evidence.
sections:
  - id: "regulatory-clinical"
    title: "Regulatory and clinical risk is the primary thesis constraint"
    body: >-
      The strongest public milestone is narrower than the ultimate paralysis-use thesis. An independent
      summary reports that the Layer 7 Cortical Interface received 510(k) clearance for commercial use
      with implantation durations of up to 30 days, while the fully implantable wireless version intended
      for long-term use is still described as being developed. The retained literature summary also
      describes pilot human testing in five patients and a later four-patient intraoperative study whose
      authors noted the small sample. These facts make label expansion, chronic-use safety, durability,
      and pivotal evidence the highest residual risks; the current evidence does not justify treating an
      absence of reported device-related events in one small study as proof of broad safety. Investment
      progression should therefore require the actual FDA clearance letter, indication and labeling,
      complete trial protocols, adverse-event tables, and a dated long-term regulatory plan.
    claimRefs: ["CR001", "CR002", "CR003", "CR004", "CR009", "CR014"]
    tableRefs: ["TR001"]
    figureRefs: ["FR001"]
  - id: "operational-quality-security"
    title: "Quality, manufacturing, and data-system execution remain tightly coupled"
    body: >-
      Precision's own recruiting material shows that its software stack is not a peripheral web product:
      the role would build real-time and offline physiological-data analytics, patient-information
      infrastructure, and a cloud platform inside an IEC 62304-compliant development lifecycle. That
      creates simultaneous software-quality, cybersecurity, privacy, and clinical-operations exposure.
      Company-issued material also says Precision acquired a proprietary facility for commercial-scale
      manufacturing, which may improve control but concentrates execution in an operation for which the
      assigned evidence provides no yield, validation, redundancy, recall, supplier, or business-continuity
      metrics. Before investment, diligence should inspect design-history and risk-management files,
      penetration-test and access-control evidence, software anomaly closure, process validation, yield
      trends, critical suppliers, disaster recovery, and complaint and corrective-action records.
    claimRefs: ["CR005", "CR006", "CR008", "CR013"]
    tableRefs: ["TR002"]
  - id: "partners-commercialization"
    title: "Commercialization depends on counterparties and company-shaped evidence"
    body: >-
      The January 2026 Medtronic announcement is strategically meaningful but is a company-issued release
      describing a plan to co-develop an integrated Layer 7 and StealthStation solution; it does not
      disclose economics, exclusivity, milestones, termination rights, regulatory responsibilities, or a
      launch commitment. Clinical progress is likewise described through collaborations with a small set
      of named hospital systems. Counterparty concentration is therefore a material execution risk until
      contracts and operating data show otherwise. Evidence quality compounds the issue: Precision's
      communications agency says it deliberately used funding, trial, research, and competitor news to
      secure on-message coverage, and another retained item identifies itself as a paid release. Media
      volume should not be treated as independent validation of adoption, safety, or commercial readiness.
    claimRefs: ["CR007", "CR010", "CR011", "CR012", "CR014"]
    tableRefs: ["TR003"]
  - id: "financial-kill-criteria"
    title: "Financial opacity requires staged capital and explicit kill criteria"
    body: >-
      The assigned evidence does not disclose revenue, gross margin, operating loss, cash, burn, runway,
      manufacturing working capital, or the capital required to reach chronic-use commercialization.
      Moreover, a current company job repost says more than $430 million has been raised since founding,
      while an independently hosted summary reports total funding of $180 million as of January 2026.
      These are funding-raised claims with unclear basis and are not cash available; the discrepancy must
      be reconciled rather than averaged. Capital should be staged behind documentary milestones:
      confirmed regulatory scope and chronic-use path, reproducible safety and performance across larger
      cohorts, closure of major quality or security findings, validated manufacturing yields and dual-source
      plans, durable hospital and Medtronic contracts, and a board-approved cash forecast. A material
      regulatory setback, serious device-related safety signal, unresolved critical software finding,
      failed manufacturing validation, loss of a key platform or trial-site relationship, or runway below
      the board's next-financing threshold should pause deployment and trigger re-underwriting.
    claimRefs: ["CR015", "CR016", "CR001", "CR004", "CR005", "CR007", "CR013", "CR014"]
