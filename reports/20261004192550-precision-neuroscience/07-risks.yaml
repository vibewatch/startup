callouts:
  - calloutType: "risk"
    title: "Decision discipline"
    body: >-
      Treat approval scope, cohort size, quality-system evidence, manufacturing validation, partner contracts,
      and reconciled cash runway as gating documents. Do not substitute fundraising, media volume, a partnership
      announcement, or the absence of a recorded incident in this limited pool for proof that those risks are closed.
    claimRefs: ["CR001", "CR004", "CR005", "CR007", "CR011", "CR012", "CR013", "CR015", "CR016"]
