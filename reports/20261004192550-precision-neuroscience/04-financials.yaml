company:
  name: "Precision Neuroscience"
chapter:
  number: 4
  title: "Financials"
  summary: "Precision Neuroscience operates as a pre-commercial, capital-intensive neurotechnology venture funded by $430M in cumulative private equity, including a $250M Series D closed in September 2026 at a $1B valuation. With commercial-stage device ASPs modeled between $25,000 and $60,000 against substantial cleanroom manufacturing overhead and extended multi-year clinical trial cycles, commercial viability remains contingent upon establishing institutional reimbursement codes and Medtronic-partnered hospital distribution."
sections:
  - id: "revenue-streams-and-pricing"
    title: "Commercialization Pathway, Revenue Architecture, and Pricing Strategy"
    body: "Precision Neuroscience remains pre-commercial, generating no recognized clinical product revenue as of late 2026. The company's future commercial architecture centers on its proprietary Layer 7 Cortical Interface, a thin-film microelectrode array containing 1,024 electrodes designed to record, monitor, and stimulate cortical activity without penetrating brain parenchyma. In April 2025, the U.S. Food and Drug Administration cleared the Layer 7 array for temporary intraoperative recording and monitoring for up to 30 days. This clearance establishes an initial regulatory beachhead, allowing Precision to pursue an acute diagnostic monitoring revenue stream while continuing long-term clinical development toward a permanently implanted brain-computer interface system for permanent motor restoration.\n\nThird-party health technology pricing analyses estimate the initial unit acquisition cost for the Layer 7 device at between $25,000 and $60,000 per unit, excluding surgical implantation charges, operating room facility fees, and ongoing longitudinal software analytics. While medical hardware list pricing can anchor initial hospital procurement discussions, realized net selling prices remain completely unproven in commercial healthcare workflows. Clinical adoption will depend entirely on establishing formal reimbursement frameworks, such as dedicated Centers for Medicare & Medicaid Services New Technology Add-on Payments or procedural CPT codes, to prevent hospital operating margins from absorbing hardware acquisition costs."
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI003"
      - "CI004"
      - "CI005"
      - "CI011"
    tableRefs:
      - "TI001"
      - "TI002"
  - id: "gtm-and-cost-structure"
    title: "Go-to-Market Economics, Hospital Distribution, and Cost Structure Drivers"
    body: "Rather than building a capital-intensive direct surgical salesforce from scratch, Precision has structured its go-to-market distribution via commercial and co-development alliances. In January 2026, Precision entered a strategic partnership with Medtronic to integrate the Layer 7 cortical interface with Medtronic's StealthStation surgical navigation platform. Under this arrangement, Medtronic's Cranial & Spinal Technologies division provides an established hospital channel into neurosurgical operating suites, potentially reducing Precision's customer acquisition costs and shortening institutional procurement cycles across academic medical centers.\n\nPrecision's operating cost structure is dominated by high fixed expenditures across cleanroom microfabrication, regulatory compliance, and specialized neuroengineering payroll. The company acquired a proprietary microfabrication facility to retain tight quality control over thin-film electrode production at commercial scale. Compensation benchmarks for key engineering roles highlight high technical labor intensity; for instance, cloud infrastructure roles command base cash salaries of $200,000 to $210,000 before equity incentives. Across an estimated headcount base of 51 to 200 employees, personnel costs and clinical trial administration constitute the primary drivers of cash burn ahead of commercial volume scaling."
    claimRefs:
      - "CI006"
      - "CI007"
      - "CI008"
      - "CI009"
      - "CI012"
    tableRefs:
      - "TI003"
    figureRefs:
      - "FI001"
  - id: "capital-adequacy-and-verdict"
    title: "Capital Adequacy, Cash Burn Trajectory, and Underwriting Verdict"
    body: "Precision has raised $430M in cumulative private equity across six financing rounds to insulate its high-burn development roadmap. In September 2026, the company closed an oversubscribed $250M Series D round led by Pershing Square and The Ackman Oxman Institute at a post-money valuation of $1B. SEC Form D filings confirm $249,999,984 sold across 460 participating investors, building on a $102M Series C closed in December 2024 at a $500M valuation and earlier rounds of $41M in 2023. Secondary market trading on platforms such as Hiive reflected indicative pricing of $8.38 per share in mid-2026, indicating sustained investor appetite despite pre-commercial operating losses.\n\nThe resulting underwriting verdict requires strict diligence caveats. The newly secured $250M capital infusion provides comfortable runway of roughly 36 to 48 months under estimated annual burn rates of $50M to $70M. However, macroeconomic projections from healthcare market analysts suggest aggregate industry revenues for brain-computer interfaces may not exceed $1B annually until 2041 due to slow clinical trial enrollment, neurosurgeon training constraints, and insurer resistance. Precision's long-term enterprise valuation depends not on private venture marks, but on demonstrating clinical efficacy and health-economic payback to secure third-party reimbursement."
    claimRefs:
      - "CI010"
      - "CI013"
      - "CI014"
      - "CI015"
      - "CI016"
