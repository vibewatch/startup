callouts:
  - calloutType: "risk"
    title: "Reimbursement Framework Uncertainty Threatens Hospital Unit Adoption"
    body: "Even with FDA 510(k) clearance for acute monitoring, the lack of dedicated CMS reimbursement codes and established insurer coverage poses an acute barrier to hospital procurement. Hardware priced at $25,000 to $60,000 cannot achieve broad commercial uptake if neurosurgical departments must absorb device acquisition costs within existing DRG bundles without New Technology Add-on Payments."
    claimRefs:
      - "CI004"
      - "CI005"
  - calloutType: "insight"
    title: "Medtronic Alliance Offsets Commercial Salesforce Capital Requirements"
    body: "Securing an integration partnership with Medtronic's StealthStation platform gives Precision access to ubiquitous neurosurgical operating suites without spending tens of millions on an internal institutional sales infrastructure, transforming commercial go-to-market efficiency."
    claimRefs:
      - "CI006"
