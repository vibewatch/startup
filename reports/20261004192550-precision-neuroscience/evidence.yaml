evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: Official Series D post-money valuation, liquidation preferences, and cap table share breakdown.
    whyItMatters: >-
      Essential for determining the exact dilution, cost of capital, and economic hurdle rate for prospective secondary
      and growth investors.
    diligencePath: Request confidential cap table and Series D preferred share financing agreements directly from company management.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: reimbursement
    missingEvidence: >-
      Dedicated CPT coding, Medicare coverage determination, or established commercial payer reimbursement fee schedules
      for permanent or 30-day Layer 7 placement.
    whyItMatters: >-
      Without formal reimbursement coverage codes, hospital systems cannot broadly adopt the technology outside of
      sponsored clinical trial research budgets.
    diligencePath: >-
      Review CMS coding applications, NTAP submissions, and AMA CPT editorial panel agendas with hospital clinical
      leadership.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: material
    topic: independent-market-sizing
    missingEvidence: >-
      Independent indication-level patient eligibility, pricing, payer coverage, adoption rates, addressable centers,
      procedure capacity, and market-share evidence needed to derive a Precision-specific SAM or SOM.
    whyItMatters: >-
      Without those inputs, the $400 billion promotional opportunity cannot be translated into supportable company
      revenue or valuation.
    diligencePath: >-
      Obtain the underlying Morgan Stanley methodology, independent epidemiology by target indication, FDA labeling,
      management pricing assumptions, payer research, and a center-by-center rollout model.
    relatedQuestionRefs:
      - QM002
      - QM003
      - QM007
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-and-payer-proof
    missingEvidence: >-
      Executed hospital purchase commitments, budget ownership, procurement-cycle data, reimbursement decisions,
      pricing, utilization, retention, and Medtronic commercial terms.
    whyItMatters: >-
      Clinical collaborations and co-development do not establish paid demand, distribution economics, or the speed of
      hospital adoption.
    diligencePath: >-
      Review contracts and pipeline by institution; interview hospital procurement and neurosurgery leaders; verify
      payer coding and coverage; and inspect the Medtronic agreement for economics, exclusivity, milestones, and
      termination rights.
    relatedQuestionRefs:
      - QM004
      - QM007
      - QM008
    relatedTableRefs:
      - TM003
