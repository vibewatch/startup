    topic: chronic-implant-safety-data
    missingEvidence: >-
      Multi-year clinical safety and signal longevity data for permanent chronic implants of the Layer 7 cortical array
      in home environments.
    whyItMatters: >-
      Precision's current human data is derived from acute intraoperative or temporary 30-day procedures; competitive
      viability against Neuralink depends on achieving permanent chronic regulatory clearance.
    diligencePath: >-
      Monitor FDA Investigational Device Exemption (IDE) filings and clinical trial registry updates for Precision's
      planned chronic paralysis restoration studies.
    relatedQuestionRefs:
      - QP008
