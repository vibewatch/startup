chapter:
  number: 5
  title: "Product & Technology"
  summary: "Precision Neuroscience's Layer 7 platform combines a surface-conforming cortical array, micro-slit delivery, neural-signal acquisition, and planned operating-room integration. The assigned evidence supports the product architecture and early deployment footprint, but it does not establish chronic reliability, cybersecurity controls, manufacturing yield, or a current commercial roadmap."
sections:
  - id: "product-and-mechanism"
    title: "Product definition and operating mechanism"
    body: >-
      Layer 7 is a surface cortical interface rather than a penetrating intracortical
      implant. Precision says the thin array is inserted through a micro-slit, conforms
      to the brain's surface, records and stimulates through high-density electrodes,
      and is designed for removal or replacement [CE001, CE002, CE007]. A 2025
      technical review describes an array with up to 1,024 platinum electrodes and a
      five-micrometer polyimide substrate, while the company's product page says neural
      signals are translated into commands for digital devices [CE002, CE003, CE006].
      Those features define the customer workflow: acquire cortical activity without
      tissue penetration, process the signal, and use the decoded output for clinical
      mapping or device control. Public evidence does not, however, establish
      patient-level functional outcomes or comparative complication rates for the
      complete system.
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE006"
      - "CE007"
    tableRefs:
      - "TE001"
    figureRefs:
      - "FE001"
  - id: "deployment-and-integration"
    title: "Deployment, integration, and clinical workflow"
    body: >-
      The available architecture evidence is strongest at the component level. The
      technical review describes a custom headstage, low-noise analog acquisition,
      16-bit digitization, and high-rate sampling, but these specifications come from a
      secondary review rather than a retained primary engineering dossier [CE004].
      Precision and Medtronic announced in January 2026 that they would co-develop an
      integrated solution pairing Layer 7 with the StealthStation surgical-navigation
      system, intended to combine functional and structural information in the
      operating room [CE005, CE015]. The announcement is evidence of an integration
      direction, not proof of a released product, installation count, interoperability
      performance, or support model. An independent MGH practitioner proxy also shows
      that neuroscience workflows span imaging, electrophysiology, modeling, and
      stimulation, increasing the integration burden beyond the electrode array alone
      [CE013].
    claimRefs:
      - "CE004"
      - "CE005"
      - "CE013"
      - "CE015"
    tableRefs:
      - "TE002"
  - id: "maturity-and-scale"
    title: "Maturity, manufacturing, and deployment signals"
    body: >-
      Company-issued surfaces report that Layer 7 received FDA clearance, and a June
      2025 release described the cleared functions as recording, monitoring, and
      stimulating electrical activity on the brain's surface [CE008]. Deployment
      indicators show progression but are not directly comparable: an investor post
      reported 17 implanted patients across three medical centers in July 2024, while
      Precision said in June 2025 that it had tested the device in more than 40
      patients [CE009, CE010]. The homepage also labels a list of institutions as
      active hospital partners without specifying the study stage or patient count by
      site [CE012]. An independent but low-reputation review reports a 22,000-square-foot
      Addison MEMS facility; yield, validated capacity, supplier dependencies, and
      quality-system evidence remain undisclosed in the assigned pool [CE011].
    claimRefs:
      - "CE008"
      - "CE009"
      - "CE010"
      - "CE011"
      - "CE012"
    tableRefs:
      - "TE003"
  - id: "technical-risk-and-roadmap"
    title: "Technical risk, controls, and roadmap"
    body: >-
      The central underwriting gap is the distance between a disclosed cortical-array
      architecture and a dependable end-to-end clinical product. The retained sources
      do not provide primary test reports for chronic biocompatibility, explant
      outcomes, wireless security, software validation, sterilization, adverse-event
      rates, uptime, or field support. The company homepage says the platform will
      expand to more brain regions, but it gives no dated release plan, indication
      sequence, or verification threshold [CE014]. The available FDA-clearance claim
      narrows regulatory uncertainty for a stated function, yet the assigned evidence
      does not include the clearance summary needed to verify indications,
      contraindications, duration, or required controls [CE008]. These omissions should
      be treated as material diligence requests rather than inferred product
      capabilities.
    claimRefs:
      - "CE008"
      - "CE014"
