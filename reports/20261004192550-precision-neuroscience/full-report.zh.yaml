      - CV009
      - CV010
      - CV011
      - CV012
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 按时间梳理 Precision Neuroscience 自 2021 年成立至 2026 年末 Series D 的公司、融资、临床、监管和技术里程碑。
    approximationNotes: 里程碑日期依据公开报道的自然季度和新闻稿公告；商业临床推广仍在进行。
    data:
      items:
        - label: 2021-04
          title: Company Founding
          detail: Michael Mager 与 Benjamin Rapoport 博士在纽约创立公司，开发微创皮层 BCI。
        - label: 2023-01
          title: Series B Financing
          detail: 完成由 Forepont Capital Partners 领投的 $41 million Series B 融资，推进临床开发。
        - label: 2023-06
          title: First-in-Human Clinical Study
          detail: 在合作医院启动首项人体术中临床研究，映射人类皮层脑信号。
        - label: 2023-11
          title: MEMS Foundry Acquisition
          detail: 收购位于德州 Addison 的全资微机电系统（MEMS）制造设施。
        - label: 2024-05
          title: 4,096-Electrode Record
          detail: 在人脑上放置 4,096 个皮层电极，展示高密度神经记录。
        - label: 2024-07
          title: Executive Leadership Expansion
          detail: 聘任 Jayme Strauss 为首席临床与商务官，Mike Kaswan 为首席财务官。
        - label: 2024-12
          title: Series C Financing Round
          detail: 完成 $102 million Series C 融资，估值约 $500 million，用于支持关键试验。
        - label: 2025-06
          title: FDA 510(k) Clearance & Honors
          detail: 获得 Layer 7 Cortical Interface 的 FDA 许可；患者手术超过 40 例；赢得 Fast Company 奖项。
        - label: 2026-01
          title: Medtronic Strategic Alliance
          detail: 与 Medtronic 建立战略合作，将 Layer 7 BCI 集成至 StealthStation 神经外科导航系统。
        - label: 2026-09
          title: $250M Series D Financing
          detail: 完成由 Pershing Square 领投且超额认购的 $250M Series D，累计融资达到 $430M，覆盖 100+ 例患者。
