      - number: '7.2'
        title: 质量、制造与数据系统执行仍高度耦合
        blocks:
          - type: paragraph
            body: >-
              Precision 自己的招聘材料显示，其软件栈不是外围网页产品：岗位将构建实时和离线生理数据分析、患者信息基础设施以及云平台，并纳入符合 IEC 62304
              的开发生命周期。这会同时带来软件质量、网络安全、隐私和临床运营风险。公司材料还称，Precision
              收购了用于商业规模制造的专有设施，虽然这可能改善控制，但也把执行集中到一个指定证据未提供良率、验证、冗余、召回、供应商或业务连续性指标的运营中。投资前，尽调应检查设计历史和风险管理文件、渗透测试与访问控制证据、软件异常关闭情况、工艺验证、良率趋势、关键供应商、灾难恢复以及投诉和纠正措施记录。
            claimRefs:
              - CR005
              - CR006
              - CR008
              - CR013
