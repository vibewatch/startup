      - number: '7.3'
        title: 商业化依赖交易对手与公司塑造的证据
        blocks:
          - type: paragraph
            body: >-
              2026 年 1 月的 Medtronic 公告具有战略意义，但它是公司发布的材料，只描述了共同开发 Layer 7 与 StealthStation
              集成方案的计划；没有披露经济条款、排他性、里程碑、终止权、监管责任或上市承诺。临床进展同样由少数具名医院系统的合作呈现。在合同和运营数据证明相反之前，交易对手集中度因此是重大执行风险。证据质量进一步放大了问题：Precision
              的传播机构称其有意利用融资、试验、研究和竞争者新闻来获得符合公司口径的报道，另一份留存材料则自称为付费发布。媒体数量不应被视为采用、安全或商业准备度的独立验证。
            claimRefs:
              - CR007
