      - number: '7.4'
        title: 财务不透明要求分阶段投入资本并设定明确止损标准
        blocks:
          - type: paragraph
            body: >-
              指定证据没有披露收入、毛利率、经营亏损、现金、烧钱、现金跑道、制造营运资本或实现慢性使用商业化所需资本。此外，公司当前职位转载称自成立以来已筹集超过 $430M，而独立托管摘要称截至 2026 年 1
              月累计融资为
              $180M。这些是依据不明的融资额主张，不等于可用现金；差异必须调和，不能取平均。资本应绑定文件化里程碑分阶段投入：确认监管范围和慢性使用路径、更大队列中可复现的安全性和性能、重大质量或安全问题关闭、经验证的制造良率和双来源计划、持久的医院及
              Medtronic 合同，以及董事会批准的现金预测。重大监管挫折、严重设备相关安全信号、未解决的关键软件问题、制造验证失败、失去关键平台或试验站点关系，或现金跑道
              低于董事会下一轮融资门槛，都应暂停部署并触发重新评估。
            claimRefs:
              - CR015
