            body: >-
              尽管拥有临床里程碑和战略分销联盟，Precision 仍面临威胁采用进程、客户留存和收入持久性的重大商业逆风。独立市场分析显示，Precision BCI 设备硬件成本估计为 $25,000 至
              $60,000，不包括手术室手术费用、神经外科医生费用和持续的术后计算信号分析。              若没有成熟的现行程序术语（CPT）报销编码或有利的 Medicare
              覆盖认定，机构医院在补贴临床研究方案之外采用设备，将面临严重财务风险。此外，颅骨微电极放置的专业性使渠道高度依赖全国范围内稀缺的认证神经外科医生和专业三级手术中心。在更广泛的神经科技市场，precision
              neuroscience 方法还面临临床队列中的可解释性、标准化和工作流集成难题。在长期门诊疗效与成本效益得到严格证明前，医院采用仍将集中于顶尖研究中心，商业流失或试点停滞会持续构成风险。
            claimRefs:
              - CU013
              - CU014
              - CU015
              - CU016
      - number: '6.5'
        title: 展示项
        blocks:
          - type: callout
            title: Medtronic 联盟绕开医院采购鸿沟
            body: >-
              医疗器械初创公司在尝试向风险厌恶的医院手术室销售独立硬件控制台时经常停滞。Precision 与 Medtronic 的战略共同开发协议，把商业分销模式从直接销售资本设备，转变为 Medtronic
              StealthStation 导航生态中的软件和耗材赋能功能。由于 Medtronic 已控制颅脑神经外科手术室的主导市场份额，把 Layer 7
              直接集成进既有导航工作流，实际上绕开了传统医院采购摩擦，并立即获得全球覆盖。
            calloutType: insight
            claimRefs:
              - CU010
              - CU011
              - CU012
          - type: callout
            title: 设备成本与报销真空拖累经济可行性
            body: >-
              硬件设备成本估计为每台 $25,000 至 $60,000，且不含手术室手术费和计算支持，Precision 的商业化转型面临极大经济逆风。没有成熟的 CPT
              报销编码，医院价值分析委员会无法在补贴临床研究方案之外为设备采购提供充分理由。此外，能够进行精准颅骨植入的专业神经外科医生在全国严重短缺，可能把商业规模限制在少数高流量学术医疗中心。
            calloutType: risk
            claimRefs:
              - CU013
              - CU014
              - CU015
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管和临床风险是核心投资论点的首要约束
        blocks:
          - type: paragraph
            body: >-
              最强的公开里程碑比最终的瘫痪应用论点更窄。一份独立摘要称，Layer 7 Cortical Interface 已获得 510(k) 商业使用许可，植入期限最长 30
              天；而面向长期使用的全植入式无线版本仍在开发中。留存的文献摘要还描述了 5 名患者的试点人体测试，以及随后 4
              名患者的术中研究，研究作者指出样本量很小。因此，标签扩展、慢性使用安全性、耐久性和关键性证据是最大的剩余风险；现有证据不足以把一项小型研究中未报告设备相关事件，视为广泛安全性的证明。后续投资应要求提供 FDA
              实际许可函、适应症和标签、完整试验方案、不良事件表以及有日期的长期监管计划。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR009
              - CR014
