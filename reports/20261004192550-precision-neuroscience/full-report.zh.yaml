      - number: '6.2'
        title: 机构部署、学术合作与临床试验网络
        blocks:
          - type: paragraph
            body: >-
              Precision 已建立覆盖美国顶尖学术医疗机构的高知名度多中心临床网络。最初的人体术中研究在 West Virginia University's Rockefeller Neuroscience
              Institute（WVU RNI）开展，把 Layer 7 皮层表面微电极阵列临时放置在计划手术患者的脑表面。随后临床版图扩展至 University of Pennsylvania 的 Perelman
              School of Medicine（Penn Medicine）和纽约 Mount Sinai Health System；在那里，手术团队同时在一名患者的皮层上放置四个 1,024 电极阵列，共 4,096
              个通道，创下神经记录密度纪录。随着公司从早期可行性推进到扩大队列评估，临床试验和研究合作延伸至 Johns Hopkins Medicine、Mass General Brigham、Beth Israel
              Deaconess Medical Center、Northwestern Medicine、Emory Healthcare、Barrow Neurological Institute、NYU
              Langone、UChicago Medicine、Michigan Medicine 和 Thomas Jefferson University 等大型学术医疗系统。2024 年 7 月，Precision
              任命 Viz.ai 前高管 Jayme Strauss 为首席临床与商业官，以将这些研究联盟制度化，并为医院网络的商业产品推出做准备。
