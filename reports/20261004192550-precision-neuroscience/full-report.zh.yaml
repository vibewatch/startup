      - number: '1.2'
        title: 创始人、领导架构与关键人员
        blocks:
          - type: paragraph
            body: >-
              Precision 的管理团队把专业神经外科工程能力与高增长医疗科技和医疗器械商业化经验结合起来。联合创始人兼 CSO Dr. Benjamin Rapoport 是 MD-PhD 神经外科医生，曾联合创办
              Neuralink 和 Symbionics；他与联合创始人兼 CEO Michael Mager 一同负责技术和科学开发。2024 年 7 月，Precision 任命医疗 AI 公司 Viz.ai
              前首席临床官 Jayme Strauss（RN、MSN、MBA）为首席临床与商业官，并任命曾任 Orchestra BioMed CFO、拥有超过 30 年医疗财务管理经验的 Mike Kaswan
              为首席财务官，扩充高管团队。技术管理核心还包括总裁兼首席产品官 Dr. Craig Mermel，他曾在 Apple 和 Google 领导计算工程团队。此外，BrainGate 创始人、2026 年 Queen
              Elizabeth Prize for Engineering 得主、神经科学先驱 Dr. John Donoghue 担任科学顾问。团队阵容虽强，但考虑到专有微型皮层电图技术和复杂的 FDA
              路径，公司仍高度依赖创始科学领导层这一关键人员。
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
