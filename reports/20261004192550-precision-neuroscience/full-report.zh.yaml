      - number: '3.4'
        title: 展示项
        blocks:
          - type: callout
            title: 可逆性是前所未有的临床去风险路径
            body: >-
              在医疗器械商业化中，能够安全移除或替换植入物而不造成不可逆神经损伤，相较穿刺式阵列具有显著优势。Precision 的无损伤 Layer 7
              可在短期窗口内对数十名神经外科患者进行临床试验验证，生成比永久穿刺式植入物提前数年的安全数据集。
            calloutType: insight
            claimRefs:
              - CP009
              - CP011
              - CP012
          - type: callout
            title: 分销护城河对慢性临床疗效
            body: >-
              Precision 与 Medtronic 的商业联盟可立即进入医院手术室，但其竞争持久性最终取决于能否证明慢性解码疗效。如果竞争者在 Precision 超出急性 30
              天许可范围之前，就先建立永久居家运动恢复能力，单靠分销合作无法阻止技术替代。
            calloutType: risk
            claimRefs:
              - CP006
              - CP011
              - CP016
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 商业化路径、收入架构与定价策略
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年末，Precision Neuroscience 仍处于商业化前阶段，没有确认的临床产品收入。公司未来商业架构围绕专有 Layer 7 Cortical Interface 展开：这是一种含
              1,024 个电极的薄膜微电极阵列，用于在不穿透脑实质的情况下记录、监测和刺激皮层活动。2025 年 4 月，美国食品药品监督管理局许可 Layer 7 array 用于最长 30
              天的临时术中记录和监测。这项许可建立了初始监管立足点，让 Precision 可以发展急性诊断监测收入流，同时继续推进永久植入式脑机接口系统和永久运动恢复的长期临床开发。

              第三方医疗科技定价分析估计，Layer 7 设备的初始采购成本为每台 $25,000 至
              $60,000，不包括手术植入费用、手术室设施费和持续的长期软件分析。医疗硬件目录价可以作为医院初步采购讨论的锚点，但在商业医疗工作流中实际实现的净售价仍完全未经证明。临床采用完全取决于能否建立正式报销框架，例如
              CMS 新技术附加支付或专门的 CPT 编码，以免医院运营利润承担硬件采购成本。
