        title: 产品定义与运行机制
        blocks:
          - type: paragraph
            body: >-
              Layer 7 皮层接口是贴合皮层的接口，而不是穿刺式皮层内植入物。Precision 表示，这一薄型阵列通过微切口植入，贴合脑表面，用高密度电极记录和刺激，并支持移除或替换 [CE001, CE002,
              CE007]。一份 2025 年技术评述称，该阵列最多含 1,024 个铂电极和 5 微米聚酰亚胺基底；公司产品页面称，神经信号会被转换为数字设备指令 [CE002, CE003,
              CE006]。这些特征定义了客户工作流：不穿透组织即可采集皮层活动，处理信号，再将解码结果用于临床映射或设备控制。不过，公开证据尚未证明完整系统在患者功能结果或并发症率上的表现对比。
            claimRefs:
