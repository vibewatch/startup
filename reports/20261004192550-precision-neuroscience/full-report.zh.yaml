            body: >-
              即使 FDA 已对急性监测授予 510(k) 许可，缺少专门的 CMS 报销编码和成熟的保险覆盖仍是医院采购的直接障碍。如果神经外科部门必须在现有 DRG 打包支付中承担设备采购成本，而没有新技术附加支付，价格为
