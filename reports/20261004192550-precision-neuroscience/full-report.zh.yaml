            title: 决策纪律
            body: 把许可范围、队列规模、质量体系证据、制造验证、合作伙伴合同和对账后的现金跑道视为闸门文件。不要用融资额、媒体数量、合作公告或这批有限资料中未记录事故，替代这些风险已经关闭的证明。
