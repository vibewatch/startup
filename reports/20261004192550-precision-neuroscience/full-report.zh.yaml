      - number: '1.4'
        title: 临床进展、商业现实与采用障碍
        blocks:
          - type: paragraph
            body: >-
              2023 年至 2026 年末，Precision 从最初的术中可行性研究推进到覆盖 18 家领先学术医疗机构的多中心临床网络，包括 Penn Medicine、Mount Sinai Health
              System、WVU Rockefeller Neuroscience Institute 和 University of Chicago Medicine。累计患者手术超过 100 例，证明了在最高达
              4,096 个电极的高密度配置下进行实时运动解码的可行性。与此同时，公司获得了 Layer 7 Cortical Interface 的 FDA
              许可。不过，脑机接口行业仍存在明显采用障碍。商业收入仍处于早期开发阶段，业内设备单价预估为 $25,000 至
              $60,000，且不包括手术室植入费用和长期计算分析费用。机构报销不确定性、专业神经外科医生供给有限，以及在慢性患者群体中建立持久门诊疗效所需的多年周期，都严重限制了长期商业规模。
            claimRefs:
              - CO013
