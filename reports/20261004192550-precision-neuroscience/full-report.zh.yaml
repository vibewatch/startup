      - number: '1.5'
        title: 展示项
        blocks:
          - type: callout
            title: 贴合皮层阵列的战略定位
            body: >-
              Precision 选择超薄、贴合表面的微电极阵列，相较 Neuralink 等穿刺式皮层内技术形成了鲜明差异。由于不把尖锐微针插入皮层实质，Precision
              避免了长期胶质瘢痕和实质组织损伤，同时保留高时间和空间分辨率。更重要的是，设备可以安全移除，为快速进入医院采用建立了适配的监管和临床安全画像。
            calloutType: insight
            claimRefs:
              - CO003
              - CO004
              - CO014
          - type: callout
            title: 长期商业化、成本与报销逆风
            body: >-
              Precision 已在 18 家医疗中心完成超过 100 例患者手术，临床可行性较强，但商业可行性尚未得到证明。若没有强有力的临床结果证明设备能减少医疗系统支出或恢复患者功能，预估为 $25,000 至
              $60,000 的硬件成本将造成显著报销阻力。此外，接受专业 BCI 植入培训的神经外科医生严重短缺，可能拖慢地理范围的广泛扩张。
            calloutType: risk
            claimRefs:
              - CO015
              - CO016
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：临床工作流，而非所有神经系统疾病
        blocks:
          - type: paragraph
            body: >-
              可辩护的市场边界包含两个临床使用框架。第一，Precision 和 Medtronic 表示将把 Layer 7 与 StealthStation
              结合，让神经外科医生在手术室获得结构和功能信息；因此，皮层接口硬件及工作流集成属于边界之内。第二，公司材料描述了一种完整
              BCI，旨在让瘫痪者控制电脑或智能手机，因此辅助数字控制属于更长期的边界。一般神经科医疗、全部神经系统疾病患者、消费健康、游戏和无关的神经外科支出，都不属于公司的特定市场规模。现状中唯一被直接描述的是医生分别使用结构和功能工具，而不是量化的替代市场。
            claimRefs:
              - CM004
              - CM005
              - CM008
              - CM013
