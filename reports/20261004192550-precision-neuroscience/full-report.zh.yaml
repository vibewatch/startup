      - number: '1.3'
        title: 资本化历程、投资者基础与商业联盟
        blocks:
          - type: paragraph
            body: >-
              自成立以来，Precision 通过四轮机构投资累计筹集 $430 million 股权融资。公司早期完成 A 轮融资，随后于 2023 年完成由 Forepont Capital Partners 领投的
              $41 million B 轮；2024 年末又完成 $102 million C 轮，预估投后估值为 $500 million。2026 年 9 月，Precision 完成超额认购的 $250 million
              D 轮融资，由 Pershing Square Inc.、Ackman Oxman Institute 和一家未披露的领先生命科学投资基金共同领投；B Capital、Duquesne Family
              Office、ARK Invest、Mubadala Capital、Invus、Mirae Asset Capital 和 Alumni Ventures 等机构投资者广泛参与。除金融资本外，Precision
              于 2026 年 1 月与 Medtronic 达成关键商业合作，共同开发集成手术方案，将 Layer 7 皮层接口与 Medtronic 的 StealthStation 3D 手术导航平台结合。公司还通过在
              Texas 全资拥有 MEMS 微电极制造工厂，实现端到端供应链控制。
            claimRefs:
              - CO009
              - CO010
              - CO011
              - CO012
