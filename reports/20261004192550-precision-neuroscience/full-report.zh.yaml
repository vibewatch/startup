        blocks:
          - type: paragraph
            body: >-
              核心投资判断缺口在于：已披露的皮层阵列架构与可靠端到端临床产品之间仍有距离。留存来源没有提供关于慢性生物相容性、取出结果、无线安全、软件验证、灭菌、不良事件率、正常运行时间或现场支持的一手测试报告。公司官网称平台将扩展到更多脑区，但没有给出有日期的发布计划、适应症顺序或验证门槛
              [CE014]。现有 FDA 许可主张缩小了特定功能的监管不确定性，但指定证据没有包含可核实适应症、禁忌症、使用期限或所需控制措施的许可摘要 [CE008]。这些缺失应被视为重要尽调请求，而不是据此推断产品能力。
