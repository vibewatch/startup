      - number: '2.4'
        title: 采用驱动因素、约束与估值意义
        blocks:
          - type: paragraph
            body: >-
              三项已报道里程碑提高了采用的可信度，但没有证明商业需求。Alumni Ventures 报道称，截至 2024 年 7 月，Precision 已在三家中心为 17 名患者植入设备；公司 2025 年 6
              月发布的材料称设备已在超过 40 名患者中测试，并首次获得 FDA 许可；2026 年 1 月的 Medtronic
              公告则提出把产品集成到现有手术平台。这些里程碑来自不同时间点，不应理解为客户或经常性手术。约束依然明显：Precision 自己强调安全和信任，StartEngine
              发售页面警告公司信息未经独立核实，LaunchSquad 的媒体报道数量衡量的是传播产出，而非买方需求。因此，估值应优先参考经核实的采购、支付方覆盖、使用率和留存证据，而不是广泛的疾病负担或宣传指标。
