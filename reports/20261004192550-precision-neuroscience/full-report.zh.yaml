      - number: '4.2'
        title: 进入市场经济学、医院分销与成本结构驱动因素
        blocks:
          - type: paragraph
            body: >-
              Precision 没有从零搭建资本密集型直接手术销售队伍，而是通过商业和共同开发联盟安排进入市场的分销。2026 年 1 月，Precision 与 Medtronic 建立战略合作，把 Layer 7
              皮层接口集成进 Medtronic 的 StealthStation 手术导航平台。在这一安排下，Medtronic 的 Cranial & Spinal Technologies
              部门为神经外科手术室提供成熟的医院渠道，有望降低 Precision 的获客成本，并缩短其在学术医疗中心的机构采购周期。

              Precision
              的运营成本结构由洁净室微制造、监管合规和专业神经工程人员等高固定支出主导。公司收购了专有微制造设施，以在薄膜电极生产达到商业规模时保持严格质量控制。关键工程岗位的薪酬基准显示技术劳动强度很高；例如，云基础设施岗位的基础现金薪资为
              $200,000 至 $210,000，未含股权激励。在估计 51 至 200 名员工的人员规模下，人员成本和临床试验管理是商业规模放量前现金消耗的主要驱动因素。
            claimRefs:
              - CI006
