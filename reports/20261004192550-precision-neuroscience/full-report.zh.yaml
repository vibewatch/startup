  - id: TV002
    title: 论点与反论点表
    columns:
      - 视角
      - 核心论点 / 反论点
      - 支持证据与战略背景
      - 哪些变化会改变判断
    rows:
      - - 投资论点
        - 相比穿透式阵列，贴合表面的 BCI 具备更优安全画像。
        - 18 个中心累计超过 100 例患者；4,096 通道记录；已获得 FDA 510(k) 许可。
        - 流动患者出现持续性慢性信号衰减或严重机械移位的证据。
      - - 投资论点
        - Medtronic 的商业分销加速手术室集成。
        - 战略联合开发，将 Layer 7 与 StealthStation 导航平台集成。
        - 合作解散，或无法将联合开发转化为全球联合营销分销。
      - - 投资论点
        - 充足资本支持多年慢性 IDE 试验执行。
        - 2026 年 9 月完成 $250M Series D，使累计募资达到 $430M。
        - 年度现金消耗超过 $80M，却未实现慢性监管 IDE 里程碑。
      - - 反论点
        - 尚无成熟 CPT 编码或付款方覆盖，报销障碍严重。
        - 设备单价估计为 $25,000 至 $60,000，导致医院采购受阻。
        - 健康经济学证明照护成本下降，并成功获得 CMS NTAP。
      - - 反论点
        - 专业神经外科劳动力瓶颈限制商业手术量。
        - 目前只有三级学术医院的专业颅骨裂隙外科医生执行手术。
        - 手术方案标准化，使社区神经外科医生能够执行常规门诊植入。
      - - 反论点
        - 高估值倍数没有为临床试验执行延误留下空间。
        - $1.03B 投后估值叠加微薄商业收入，意味着大幅下轮融资风险。
        - 临时监测系统快速商业化，每年产生 >$50M 高毛利收入。
    notes: 将结构性论点驱动因素与商业及监管失效模式进行比较。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV007
      - CV011
  - id: TV003
    title: 乐观、基准与悲观情景表
    columns:
      - 情景
      - 核心假设与运营里程碑
      - 隐含估值区间
      - 关键风险与下行触发因素
      - 概率信号
    rows:
      - - 乐观情景
        - 2029 年前获得慢性 PMA 批准；取得 CMS NTAP 和 CPT 覆盖；Medtronic 全球分销；每年 >1,500 个慢性植入。
        - $3.5B - $5.0B
        - 监管机构拒绝慢性 IDE 方案；MEMS 晶圆厂报废率飙升。
        - 20%
      - - 基准情景
        - 到 2028 年，临时术中监测产生 $30M-$60M ARR；慢性试验显示安全；出现二级收购兴趣。
        - $1.2B - $1.8B
        - 医院采购周期缓慢；慢性试验入组延迟；来自 Neuralink 的竞争压力。
        - 55%
      - - 悲观情景
        - 慢性试验因组织包裹而停滞；商业付款方拒付；现金跑道耗尽；需要资本重组。
        - $300M - $500M
        - 失去 Medtronic 合作；低于 Series C 估值（每股 $5.70）进行下轮融资。
        - 25%
    notes: 情景分析评估企业估值对监管许可、商业付款方采用和分销的敏感度。
    claimRefs:
