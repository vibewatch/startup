  - id: TV001
    title: 建议摘要表
    columns:
      - 维度
      - 评估
      - 关键分析驱动因素
      - 决策含义
    rows:
      - - 建议
        - research-more
        - 初步商业收入和多年慢性临床试验周期，被稳健资产负债表部分抵消。
        - 在获得慢性人体临床安全性数据、且报销路径清晰前，不投入新增资本。
      - - 信心度
        - medium
        - 已披露的 Series D 条款和 FDA 510(k) 许可证实了进展，但慢性人体疗效仍未经证实。
        - 对合作学术医疗机构开展专有临床站点尽调。
      - - 风险评级
        - high
        - 资本密集度高、手术采用存在瓶颈，且上市前监管门槛严苛。
        - 要求较高回报门槛，并采用防御性清算优先权结构。
      - - 估值立场
        - stretched
        - 按 $1.03B 投后估值计算，企业价值与近期运营收入基本面脱节。
        - 寻求估值折扣，或以低于每股 $7.20 的价格进行二级市场交易。
      - - 退出期限
        - 4 至 6 年
        - 目标是借助 Medtronic 分销实现商业扩张，并在 2030-2032 年前 IPO 或被战略收购。
        - 让基金 LP 期限匹配医疗器械商业化的长周期。
    notes: 汇总 Precision Neuroscience 的最终投资立场、风险画像和组合决策指引。
