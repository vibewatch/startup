chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、创立背景与 BCI 架构
        blocks:
          - type: paragraph
            body: >-
              Precision Neuroscience Corporation 是一家神经平台和医疗器械公司，由首席执行官 Michael Mager 和首席科学官 Dr. Benjamin Rapoport 于 2021
              年创立。公司总部位于纽约，在 Union Square 和 Manhattan
              附近设有办公室，成立初衷是为数百万患有严重神经系统疾病的人开发突破性临床治疗方案，包括脊髓损伤、中风和肌萎缩性侧索硬化症（ALS）。Precision
              没有采用将尖锐针状电极直接插入脑组织的穿刺式皮层内微电极阵列，而是设计了 Layer 7 Cortical
              Interface：一种可通过微创颅骨切口轻柔贴合脑表面的微电极阵列。这种架构避免损伤神经组织实质，同时保留高密度信号采集能力。Precision
              优先考虑可逆性、生物安全和简化神经外科工作流，目标是把高分辨率神经解码带入主流手术神经外科。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
