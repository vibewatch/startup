      - number: '4.3'
        title: 资本充足性、现金消耗轨迹与投资判断
        blocks:
          - type: paragraph
            body: >-
              Precision 通过六轮融资累计筹集 $430M 私人股权，以支撑高烧钱的开发路线。2026 年 9 月，公司完成由 Pershing Square 和 The Ackman Oxman Institute
              领投的超额认购 $250M D 轮，投后估值为 $1B。SEC Form D 文件确认，460 名参与投资者共售出 $249,999,984；此前公司于 2024 年 12 月完成 $102M C 轮，估值为
              $500M，并在 2023 年完成 $41M 的更早轮次。Hiive 等二级市场平台显示，2026 年中每股指示性价格为 $8.38，说明尽管公司仍处于商业化前亏损阶段，投资者兴趣依然持续。

              由此得出的投资判断必须附带严格的尽调限制。新获得的 $250M 资本注入，按预计每年 $50M 至 $70M 的烧钱速度，可提供约 36 至 48 个月的充足
              现金跑道。然而，医疗市场分析师的宏观预测认为，由于临床试验入组缓慢、神经外科医生培训受限以及保险方抵触，脑机接口行业总收入直到 2041 年可能仍不会超过每年 $1B。Precision
              的长期企业估值不取决于私人市场估值标记，而取决于能否证明临床疗效和健康经济回报，以获得第三方报销。
            claimRefs:
              - CI010
              - CI013
              - CI014
              - CI015
              - CI016
