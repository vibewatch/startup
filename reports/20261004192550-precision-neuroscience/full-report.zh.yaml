  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层与三方医疗利益相关者关系
        blocks:
          - type: paragraph
            body: >-
              Precision Neuroscience 的脑机接口（BCI）技术处于复杂的三方医疗生态中：机构买方（学术医疗中心和医院网络）、临床用户（神经外科团队和术中监测专家）以及最终受益人（严重瘫痪、ALS
              或中风患者）。Layer 7 Cortical Interface 虽已获 FDA
              许可用于临时记录、监测和刺激，但长期直接电脑控制仍是研究性平台，因此当前机构关系呈现为合作临床研究项目，而非商业销售合同。学术医疗中心提供神经外科基础设施、临床试验患者来源和临床验证数据，换取接触前沿神经科技的机会。与此同时，第三方商业支付方和
              Medicare 是最终经济裁决者，其报销政策将决定医疗系统能否从受资助的试点研究转向常规手术室部署。
