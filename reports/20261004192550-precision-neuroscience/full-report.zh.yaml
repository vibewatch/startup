  - id: FU001
    title: 客户旅程与采用生态图
    type: journey-map
    summary: 可视化呈现机构客户从最初参与学术临床试验，到 OEM 手术室集成，再到慢性商业部署的阶段。
    approximationNotes: 进展阶段代表机构商业化里程碑；时间长度取决于 FDA 慢性用途许可和 CMS 编码。
    data:
      nodes:
        - label: 阶段 1：学术临床参与
          title: Academic Clinical Engagement
          detail: 顶尖神经科学机构（WVU、Penn、Mount Sinai）在计划接受颅骨手术的患者中开展经 IRB 批准的术中试验。
        - label: 阶段 2：技术与手术去风险
          title: Technical & Surgical De-Risking
          detail: 验证无损表面置入、4,096 电极记录密度，以及用于急性监测的 FDA 510(k) 许可。
        - label: 阶段 3：商业 OEM 流程集成
          title: Commercial OEM Workflow Integration
          detail: 与 Medtronic 结成战略联盟，将 Layer 7 预先集成至 StealthStation 导航系统，消除独立设备带来的摩擦。
        - label: 阶段 4：价值分析与医院采购
          title: Value Analysis & Hospital Procurement
          detail: 医院采购委员会和价值分析审查评估系统安全性、手术室时间和手术有效性。
        - label: 阶段 5：CPT 编码与报销认定
          title: CPT Coding & Reimbursement Determination
          detail: 建立专门的 CMS NTAP 和 CPT 手术报销，以抵消 $25,000-$60,000 硬件成本和手术费用。
        - label: 阶段 6：慢性院外扩展
          title: Chronic Ambulatory Scaling
          detail: 长期在家部署，使瘫痪患者（ALS、脊髓损伤）能够用意念控制消费电子产品。
    claimRefs:
      - CU001
      - CU005
      - CU006
      - CU008
      - CU010
      - CU013
      - CU014
  - id: FR001
    title: 剩余风险热力图
    type: matrix
    summary: 最高的剩余风险同时具有严重影响，以及早期或未披露的缓释证据。
    data:
      columns:
        - id: likelihood
          label: 可能性
          detail: 分析师根据留存证据和明确缺口作出的判断。
        - id: impact
          label: 影响
          detail: 对临床和投资论点的潜在影响。
        - id: mitigation
          label: 缓释成熟度
          detail: 分配资料池中可见缓释证据的强度。
      rows:
        - label: 长期监管路径
          note: 当前报告的许可仅限于最长 30 天的植入。
          values:
            - value: High
            - value: Critical
            - value: Early
