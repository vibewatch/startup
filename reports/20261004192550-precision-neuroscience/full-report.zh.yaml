  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: BCI 格局：直接同业、既有厂商与替代方式
        blocks:
          - type: paragraph
            body: >-
              神经接口和神经科技市场分为三层：直接植入式 BCI 同业、根深蒂固的神经外科设备厂商，以及非侵入式辅助技术替代品。在直接同业中，Elon Musk 的 Neuralink 是主要侵入式竞争者，依靠 $600
              million 至 $685 million 以上的私人融资推进需要完整开颅和机器人植入器的穿刺式皮层内微电极阵列。Synchron 是主要血管内替代方案，已获得 $75 million 风险投资，通过颈静脉放置
              Stentrode 血管电极阵列，无需开放式开颅，但记录带宽受限。Precision 处于差异化的中间位置，利用 400 微米超薄微切口颅骨植入，将 1,024 通道的 Layer 7 array
              直接放在大脑皮层上，不穿透脑实质。除筹集 $150 million 的 Science Corporation 等临床阶段初创公司外，Medtronic
              等成熟医疗器械集团通过手术导航系统、深部脑刺激（DBS）控制台和颅骨器械主导医院神经外科工作流。Precision 没有直接挑战 Medtronic 的机构基础设施，而是与其合作，把 Layer 7 集成进
              StealthStation
              手术导航平台，实际上把既有厂商变成战略分销盟友。非侵入式眼动追踪系统、外部脑电图（EEG）帽和标准皮层电图（ECoG）网格等现状替代品手术风险最低，但空间分辨率、解码比特率和机械稳定性严重受限。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
      - number: '3.2'
        title: 竞争者画像、技术架构与架构权衡
        blocks:
          - type: paragraph
            body: >-
              评估 BCI 行业的竞争差异，必须权衡信号保真度、组织保护和手术可逆性。Neuralink
              的穿刺电极线从皮层实质内单个神经元记录动作电位，可实现高带宽运动控制解码；但穿刺架构会造成局部微创伤，引发胶质瘢痕包裹，且无法在不显著破坏组织的情况下安全取出。相比之下，Synchron
              完全避免颅骨手术，把血管内支架放入靠近运动皮层的上矢状窦，以较低信噪比和粗糙通道密度换取更好的手术安全性。Precision 的皮层接口瞄准临床折中：阵列厚度约为人类头发的五分之一，在 1.5
              平方厘米范围内贴合脑表面。它通过每个单元的 1,024 个电极记录表面场电位，并在术中演示中通过四个阵列扩展到 4,096
              个通道，在不刺穿组织边界的情况下捕捉高分辨率神经活动。无损伤特性意味着设备可安全移除或更换，从而能在超过 40
              名神经外科患者和三家主要学术医疗中心开展快速多患者术中研究，改变临床验证方式。不过，Neuralink 已在四肢瘫痪患者中实现数月连续居家数字控制，而 Precision 截至目前的商业许可仍限于最长 30
              天的急性术中和临时监测窗口，永久慢性植入仍是未经证明的临床里程碑。
            claimRefs:
