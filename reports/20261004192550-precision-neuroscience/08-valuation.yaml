callouts:
  - calloutType: "insight"
    title: "The Valuation Dilemma of Clinical Medtech Unicorns"
    body: "At a $1.03 billion post-money valuation, Precision Neuroscience commands the valuation of a commercial medtech business despite operating primarily as a clinical development stage entity. The $250 million Series D led by Pershing Square insulates the company against near-term liquidity crunches, but it also raises the bar for future liquidity events, requiring substantial commercial execution before public markets or strategic acquirers can provide a multiple expansion."
    claimRefs:
      - "CV006"
      - "CV007"
      - "CV008"
  - calloutType: "risk"
    title: "Reimbursement as the Ultimate Commercial Kill Switch"
    body: "Even if Precision achieves immaculate chronic clinical safety, healthcare systems will not broadly adopt the Layer 7 Cortical Interface without dedicated reimbursement. An estimated hardware price of $25,000 to $60,000 cannot be absorbed by hospital departmental budgets, making CMS coverage determinations and private insurer medical necessity policies the primary determinant of long-term enterprise solvency."
    claimRefs:
      - "CV004"
      - "CV011"
      - "CV015"
