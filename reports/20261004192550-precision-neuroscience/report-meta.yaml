companyProfile:
  summary: "Precision Neuroscience is a New York-based clinical-stage neurotechnology company founded in 2021 by Michael Mager and Dr. Benjamin Rapoport. It develops the Layer 7 Cortical Interface, a minimally invasive surface-conforming brain-computer interface that has reached FDA-cleared temporary use and has been deployed in human procedures across major medical institutions. The company has also raised substantial venture capital and secured a Medtronic partnership, but it remains pre-commercial with no disclosed revenue or reimbursement path."
