  foundingLocation: El Segundo, California
  headquarters: El Segundo, California
  productSummary: >-
    The W-series reusable orbital capsule performs microgravity manufacturing in low Earth
    orbit—pharmaceutical crystallization, materials processing, and defense payload testing—
    and returns payloads to Earth autonomously. The same platform is sold as a hypersonic
    reentry testbed to defense agencies. A downstream pharmaceutical IP licensing model
    targets novel drug polymorphs derived from orbital crystallization experiments.
  customerFocus: >-
    U.S. government defense and national-security agencies (AFRL primary anchor), biopharmaceutical
    companies seeking orbital crystallization services for novel polymorph discovery, and
    NASA-affiliated research programs.
  businessModel: >-
    Government testbed services billed under firm-fixed-price IDIQ task orders (confirmed
    $48M AFRL contract). Pharmaceutical services structured as a take-rate on the commercial
    API value per mission, analogous to royalty-based reformulation models. Long-term upside
    from IP licensing royalties on space-derived drug patents. Exact take rates and unit
    economics are not publicly disclosed.
  stage: Series D private company
  fundingStatus: >-
    Reported $250 million Series D in February 2026 at a ~$1.58 billion post-money valuation
    per TechCrunch and Tracxn; not yet company-confirmed as of the report date. Prior rounds:
    Seed $9M, Series A $42M, Series B $90M (2024), Series C $187M (July 2025). Total disclosed
    capital approximately $578 million. Lead investors include Founders Fund, Khosla Ventures,
    Lux Capital, and Caffeinated Capital.
