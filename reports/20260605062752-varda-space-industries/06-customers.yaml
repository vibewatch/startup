- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion Driver
  - Concentration Risk
  - Impact
  - Diligence Path
  rows:
  - - AFRL/Prometheus repeat and MACH-TB 2.0 scale-up (targeting 50 tests/year)
    - Government segment is dominant confirmed revenue source; single program (Prometheus) is the anchor customer; budget cuts or shift to alternative providers (e.g., Stratolaunch in MACH-TB 2.0) could reduce Varda's government share
    - High — near-term revenue concentration in government, specifically AFRL; loss of Prometheus follow-ons would require rapid pharma revenue ramp
    - Request proportion of Varda's current backlog from AFRL vs. other agencies; confirm MACH-TB 2.0 task order volume reserved for Varda specifically
  - - ISS retirement demand vacuum (ISS expected decommission ~2030)
    - Pharma and materials companies transitioning from ISS research face limited alternatives; Varda positioned as primary autonomous platform but faces competition from commercial space stations (Axiom, Starlab)
    - Medium-High — structural market driver, but commercial station competitors also targeting this customer base; timing 2028–2032 transition
    - Assess Varda's contracted pipeline vs. Space Tango, Redwire SpaceMD, and commercial station offerings; determine pharma customer switching costs
  - - United Therapeutics multi-mission expansion and potential follow-on pharma customers
    - Single named pharma customer (UT); prior pharma customers undisclosed and not independently verifiable; pharma segment entirely pre-clinical revenue
    - High — if UT partnership does not yield publishable results or FDA pathway, Varda's pharma commercial thesis stalls; no named backup pharma customer
    - Request United Therapeutics mission schedule and planned molecular candidates; ask Varda for number of active pharma prospect discussions and stage in pipeline
  - - SpaceX Transporter rideshare as sole launch provider
    - All W-series missions have used SpaceX Transporter rideshare; no disclosed alternative launch vehicle qualification; schedule tied to SpaceX manifest
    - Medium — rideshare slot allocation affects customer mission scheduling and cadence; SpaceX schedule delays propagate to customer delivery commitments
    - Request Varda's launch diversification plan; assess whether any W-series variant is qualified for non-SpaceX rideshares
  notes: >-
    Concentration risks are qualitative assessments based on public information about
    named customers, disclosed contracts, and competitive positioning. No revenue
    concentration figures (e.g., percentage of revenue from AFRL) have been publicly
    disclosed by Varda. Impact ratings are author assessments, not disclosed metrics.
