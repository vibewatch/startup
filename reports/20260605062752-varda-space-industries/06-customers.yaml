- id: TU003
  title: Named customer proof table
  enumeration: true
  columns:
  - Customer
  - Segment
  - Deployment / Use Case
  - Production vs Pilot
  - Outcome (public evidence)
  - Limitation
  rows:
  - - Air Force Research Laboratory (AFRL)
    - Government / Defense
    - Hypersonic testbed — multiple payloads across W-2, W-3, W-5, W-6 under Prometheus program
    - Production-equivalent (contracted, flown, recovered, data delivered to DoD)
    - W-2 OSPREE spectrometer produced first in-situ Mach 25+ DoD optical emission data; W-6 AFRL payload enabled hypersonic navigation validation; $48M 4-year contract signed Nov 2024; AFRL public affairs approvals on all press releases
    - Per-payload cost, data classification, and specific scientific outcomes of W-3 not publicly detailed; government data may not be public
  - - U.S. Navy
    - Government / Defense
    - Hypersonic reentry data collection via W-5 capsule under Prometheus program
    - Production-equivalent (contracted under Prometheus, flown, recovered)
    - W-5 capsule carried specialized Navy payload; AFRL PR notes "precise landing and rapid recovery… for immediate post-flight analysis"; W-5 described as first 2026 reentry
    - Specific data outputs, scientific objectives, and any follow-on Navy orders not disclosed beyond MACH-TB 2.0 framework
  - - Sandia National Laboratories
    - Government / Research
    - TPS model validation — nose tile with embedded sensors flew on W-6 to record in-flight temperatures vs. computer model predictions
    - Production-equivalent (nose tile successfully recovered with real-flight data)
    - Varda PR W-6 confirms "nose tile is embedded with small sensors that recorded the temperatures of the reentry environment in order to compare real-world data with high-fidelity performance data"; VP McFarland stated "data would have taken years to collect through traditional testing methods"
    - Specific TPS model improvement outcomes and any follow-on Sandia engagement not yet public
  - - NASA Ames Research Center
    - Government / Partner
    - TPS alternative production method validation — two instrumented shoulder tiles (eChar technique) flew on W-6 to provide new thermal dataset
    - Production-equivalent (tiles successfully recovered with new TPS dataset for NASA researchers)
    - Varda PR W-6 confirms NASA Ames tiles collected in-flight thermal data; NASA's C-PICA technology license and Tipping Point award established ongoing collaboration since W-4
    - NASA is partly a technology licensor and partly a customer; distinction between contractual customer revenue and collaborative research support not fully clarified in public sources
  - - United Therapeutics Corporation (UTHR)
    - Pharmaceutical
    - Multi-mission microgravity crystallization of small-molecule pulmonary disease drugs (PAH treatments)
    - Advanced pilot (multi-mission agreement signed May 2026; no missions yet completed)
    - Joint PR from both companies; SpaceNews coverage; CEO Rothblatt public statement at Beyond Earth Symposium (Feb 2026) and at partnership announcement; MIT Technology Review coverage; "multiple missions" explicitly stated
    - No missions completed yet; no crystal data published; financial terms undisclosed; no indication of regulatory pathway or clinical trial timeline
  - - United Semiconductors
    - Advanced Materials
    - Multi-flight JDA for semiconductor crystal material production in orbit for terrestrial electronics
    - Pilot / JDA stage (agreement signed ~May 2025; no completed production missions publicly confirmed)
    - Varda announcement confirms multi-flight JDA; ISS National Lab background confirms United Semiconductors' prior ISS semiconductor manufacturing demonstration
    - Joint development — not yet confirmed production; material quality, commercial viability of orbital semiconductor output, and pricing undisclosed; no independent validation of semiconductor output
  - - Undisclosed pharmaceutical customer(s) (W-1, W-3, W-4)
    - Pharmaceutical
    - In-orbit pharmaceutical crystallization — ritonavir (W-1), proprietary compounds (W-3, W-4)
    - "Production (W-1: ritonavir Form III confirmed stable in peer-reviewed paper); Pilot/R&D (W-3, W-4: proprietary, results not published)"
    - W-1 results published in npj Microgravity (2026); Series B and Series C investor communications reference ongoing pharma customer engagement; Varda biopharma page describes "working with Varda" framework consistent with repeat engagement
    - Customer identities not disclosed; financial terms not known; W-3 and W-4 results not published; cannot independently verify repeat-mission relationship or outcomes
  notes: >-
    "Production vs Pilot" ratings apply Varda-specific context: government missions are
    production-equivalent because they delivered contracted, recovered data payloads in real
    flight conditions. Pharma missions are rated pilot/R&D because no space-manufactured drug
    has entered clinical trials or received FDA approval. Source count per row satisfies the
    two-source minimum for enumeration tables.
  enumerationScope:
    coverage: partial
    basis: >-
      Rows enumerate all named customers identified in public Varda press releases, government
