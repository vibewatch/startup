- id: section-government-defense-customers
  title: Government Defense Customers — AFRL, U.S. Navy, and the Prometheus Framework
  body: |-
    The Air Force Research Laboratory is Varda's most significant confirmed government
    customer. In November 2024 AFRL announced a $48 million, four-year contract for Varda
    to provide its W-series reentry capsules as platforms for hypersonic payload testing.
    This contract followed earlier Prometheus program funding that covered W-2 and W-3
    missions. Prometheus is explicitly designed to "accelerate the ability to conduct novel
    science and technology experiments in the extreme reentry environment through a low-cost,
    high-cadence flight testbed," and Varda's capsules are the primary commercial vehicle
    enabling that program. Operationally: W-2 (reentered March 2025) carried the AFRL
    OSPREE spectrometer, producing the first in-situ DoD optical emission measurements of a
    Mach 25+ plasma sheath — data unavailable from any ground facility. W-3 (May 2025)
    carried an AFRL hypersonic payload. W-5 (January 2026) carried a specialized U.S. Navy
    payload under Prometheus, focused on data collection during reentry. W-6 (May 2026)
    carried three payloads: a Sandia National Laboratories nose tile with embedded sensors
    for thermal protection system (TPS) model validation, two NASA Ames instrumented
    shoulder tiles using an alternative C-PICA production method, and an autonomous
    navigation payload for DoD hypersonic applications.

    In January 2026 the Department of Defense's Test Resource Management Center (TRMC) and
    Naval Surface Warfare Center (NSWC) Crane Division selected Varda and Stratolaunch for
    Task Area 3 of the Multi-Service Advanced Capability Hypersonic Test Bed (MACH-TB) 2.0
    program. The program targets 50 hypersonic flight tests per year for the Pentagon across
    all selected providers, establishing a multi-year demand signal for Varda's reentry
    service well beyond the initial $48 million Prometheus contract. A USASpending.gov
    delivery order confirms PIID FA945326FX002, running November 2025 through September 2026,
    for monthly status reports under MACH-TB 2.0. The scope and depth of this government
    customer relationship — spanning four consecutive successful missions, two formal programs,
    and named involvement of at least four government agencies — distinguishes the defense
    segment as Varda's most fully proven, highest-durability customer segment in 2026.
