  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: Undisclosed pharmaceutical customer identities (W-1, W-3, W-4)
    missingEvidence: The identities and contractual terms of pharmaceutical customers for W-1, W-3, and W-4 missions have not been publicly disclosed. Results from W-3 and W-4 proprietary payloads have not been published.
    whyItMatters: Without knowing who the pharma customers are, it is impossible to independently assess their creditworthiness, repeat-purchase intent, strategic fit, or the probability of follow-on commercial engagements beyond the disclosed United Therapeutics relationship.
    diligencePath: Request NDA-protected customer list with segment, payload type, and mission cadence commitments; ask whether W-3/W-4 results triggered any IP filings.
    relatedQuestionRefs:
    - QU007
    - QU019
    relatedTableRefs:
    - TU003

  - type: missing-source
    severity: material
    topic: Revenue concentration and per-mission economics
    missingEvidence: No publicly available data on Varda's revenue per mission, segment revenue split, or the proportion of total revenue attributable to AFRL/DoD contracts versus commercial pharma and materials customers.
    whyItMatters: Concentration risk cannot be quantified without revenue breakdown; if government defense is greater than 80% of revenue, Varda's near-term financials are more sensitive to defense budget changes than the dual-segment framing implies.
    diligencePath: Request revenue breakdown by segment from data room; obtain per-mission pricing structure for government testbed versus pharmaceutical processing services.
    relatedQuestionRefs:
    - QU002
    - QU018
    - QU020

  - type: missing-source
    severity: material
    topic: Formal retention metrics (NRR, GRR, churn)
    missingEvidence: No NRR, GRR, customer count, cohort retention, or churn data have been disclosed for any customer segment. The mission-based business model makes standard SaaS retention metrics an imperfect analogy, but equivalent mission-rebooking rates have not been published.
    whyItMatters: Without retention metrics, customer durability is assessed only through the observable proxy of government mission recurrence; pharmaceutical segment durability is entirely unverified.
    diligencePath: Request any internal retention or re-booking rate data from Varda; ask what percentage of completed government mission customers have placed follow-on mission orders; determine contract structure (multi-mission upfront vs. per-mission order).
    relatedQuestionRefs:
    - QU016
    - QU017

  - type: conflicting-data
    severity: moderate
    topic: Pharmaceutical customer commercial scalability and crystallization reproducibility
    missingEvidence: Independent scientific assessment of whether Varda's orbital crystallization protocols achieve sufficient process reproducibility and yield for pharmaceutical commercial standards. Expert commentary (Scientific American) flags unpredictable crystallization timing; Varda's own data on polymorph hit-rate per mission is not publicly available.
    whyItMatters: The pharmaceutical revenue thesis depends on reliable delivery of novel crystal forms with commercial-grade reproducibility. Without published data on success rate per mission, customers have limited ability to predict ROI from an orbital campaign, potentially slowing pipeline conversion.
    diligencePath: Request internal process variability data and polymorph hit rates per mission; engage independent pharmaceutical crystallography experts to assess W-1 npj paper data and W-4 proprietary compound outcomes.
    relatedQuestionRefs:
    - QU024
    - QU025

  - type: missing-source
    severity: moderate
    topic: MACH-TB 2.0 mission allocation between Varda and Stratolaunch
    missingEvidence: The MACH-TB 2.0 program selected both Varda and Stratolaunch for Task Area 3, but the allocation of the targeted 50 annual tests between the two providers has not been publicly disclosed.
    whyItMatters: If Stratolaunch receives a larger share of MACH-TB 2.0 missions, Varda's expected government customer volume and revenue growth from this program would be lower than the headline selection announcement implies.
    diligencePath: Request task order details from MACH-TB 2.0 contracting office or Varda; confirm minimum guaranteed flight count per year for Varda specifically under the program.
    relatedQuestionRefs:
    - QU012
    - QU013
    - QU026
