company:
  name: Varda Space Industries
chapter:
  number: 6
  title: Customers
  summary: |-
    Varda Space Industries serves two distinct customer segments in 2026: (1) U.S. government
    defense agencies seeking hypersonic reentry testbed services, primarily through the Air Force
    Research Laboratory's Prometheus program and the DoD's MACH-TB 2.0 selection; and (2)
    pharmaceutical and advanced-materials companies seeking microgravity processing for novel
    drug formulations and semiconductor crystal growth. The government segment provides the
    confirmed revenue base — anchored by a $48 million AFRL contract and multi-year MACH-TB
    2.0 framework — with named customers including AFRL, U.S. Navy, Sandia National
    Laboratories, and NASA. The pharmaceutical segment is in a late-R&D/early-commercial
    phase: the first named pharma customer, United Therapeutics (announced May 2026), has
    committed to multiple missions for pulmonary disease drug formulations, while United
    Semiconductors has signed a multi-flight joint development agreement for in-orbit
    semiconductor crystal growth. Earlier missions (W-1, W-3, W-4) carried proprietary
    pharmaceutical payloads for undisclosed customers. No NRR, GRR, or churn data has been
    publicly disclosed. Government repeat engagement is confirmed across four consecutive
    Prometheus missions. The CEO expects the first microgravity-enabled drugs to reach
    patients before the end of the decade, placing commercial pharma revenue firmly in a
    post-2030 timeline horizon. Concentration in the government segment and the unproven
    commercial scalability of pharmaceutical manufacturing are the primary customer risks.

sections:
- id: section-segmentation-overview
  title: Customer Segmentation Overview
  body: |-
    Varda Space Industries' customer base organizes into two structurally distinct segments
    separated by revenue timing, use case, and regulatory exposure. The first segment is
    government and defense: agencies that procure reentry capsule flight time to test
    hypersonic vehicle technologies, thermal protection materials, sensors, and navigation
    systems under real flight conditions that cannot be replicated on the ground. This segment
    has delivered confirmed contracted revenue from 2023 onward and includes the Air Force
    Research Laboratory, U.S. Navy, Sandia National Laboratories, and NASA's Ames Research
    Center. The second segment is pharmaceutical research and development: biotechnology and
    pharmaceutical companies that pay for microgravity access to crystallize drug compounds,
    generate novel polymorphs, improve bioavailability, or characterize biologics with the
    aim of patenting superior formulations. This segment has moved from undisclosed
    single-mission engagements to a named multi-mission collaboration with United
    Therapeutics (announced May 2026) and a joint development agreement with United
    Semiconductors for semiconductor crystal growth in orbit. A third nascent segment —
    advanced materials beyond pharmaceuticals — is represented by United Semiconductors
    and the theoretical extension to other gravity-sensitive industrial materials, though
    no additional named customers in this category have been publicly disclosed as of the
    report date. The commercial pharmaceutical segment is pre-revenue from a licensed-drug
    standpoint; the government segment is Varda's current operating revenue foundation.
    All public statements treat the two segments as complementary, with government cadence
    funding the vehicle production and operations that enable pharmaceutical missions.
