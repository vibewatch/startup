- id: FI004
  title: Capital intensity and cash-flow map
  type: flow
  summary: Maps Varda's capital sources and major cash-consuming activities as of mid-2026. Shows why this business has high capital intensity relative to software or services companies — hardware manufacturing, launch procurement, multi-location facility buildout, and dual (pharma + defense) R&D investments all draw from the equity pool simultaneously. Government contract revenue provides partial offset but does not cover full burn.
  approximationNotes: Dollar magnitudes are undisclosed except where derived from confirmed contracts ($48M AFRL, $250M Series D, $187M Series C) or published market prices (SpaceX rideshare). Cash-flow directionality is inferred from observable activities.
  claimRefs:
  - CI002
  - CI004
  - CI005
  - CI006
  - CI013
  - CI016
  - CI021
  - CI022
  - CI029
  - CI036
  data:
    nodes:
    - id: cf1
      label: Equity Capital Pool (~$578M total raised; Series D $250M Feb 2026)
      detail: Primary funding source; no debt or project finance publicly disclosed; venture-backed with Founders Fund, Caffeinated Capital, Natural Capital, Shrug Capital as lead investors
    - id: cf2
      label: Government Contract Revenue — AFRL IDIQ ($48M/4yr) + SpaceWERX STRATFI ($60M 2023)
      detail: Partial offset to burn; represents anchored government demand; confirms addressable market for defense hypersonic testing services
    - id: cf3
      label: Pharma Service Revenue — Early Commercial (United Therapeutics and others; undisclosed)
      detail: Currently small or zero; United Therapeutics deal terms not disclosed; represents a nascent revenue stream not yet material
    - id: cf4
      label: Hardware Manufacturing and Capex (W-series spacecraft, C-PICA heatshields, production tooling)
      detail: Major ongoing capex; in-house spacecraft manufacturing at El Segundo since W-4; Mattel campus fit-out estimated 4-8 months; one of the largest capital sinks
    - id: cf5
      label: Launch Procurement — SpaceX Falcon 9 Rideshare (~$2-4M/mission; 10+ missions through 2028)
      detail: Contracted launch schedule limits cost flexibility; prices have increased to ~$7,000/kg in 2026; each mission requires rideshare booking months in advance
    - id: cf6
      label: Facility Expansion — Mattel Campus (205K sq ft) + Pharma Lab (10K sq ft) + Beyond Meat Sublease
      detail: Fixed costs supporting scale-up; pharma lab is IP-generation investment; Mattel campus is spacecraft manufacturing capacity
    - id: cf7
      label: R&D and Personnel (~200 employees; aerospace engineers + pharma scientists)
      detail: Dual talent stack is expensive and unusual; salary burn estimated at $40-60M/year based on 200 headcount in Los Angeles aerospace market (estimated, not disclosed)
    - id: cf8
      label: Net Cash Position (undisclosed; estimated positive with 2-3 year runway post Series D)
      detail: Residual after all outflows; actual balance not publicly disclosed; estimated 24-36 months runway from Feb 2026 based on observable scale signals

callouts:
- id: KI001
  type: risk
  title: Revenue entirely private — all financial underwriting is deferred
  body: Varda has not publicly disclosed revenue, gross margin, burn rate, or cash position. Every financial estimate in this chapter is modeled from indirect signals. No investment decision can be underwritten from public information alone; a data-room process is a prerequisite for any material commitment.
  claimRefs:
  - CI022
  - CI025

- id: KI002
  type: strength
  title: AFRL IDIQ and USASpending.gov confirmation is the anchor
  body: The $48 million AFRL IDIQ (FA9453-25-F-X010) is verifiable on USASpending.gov and provides the most credible external indicator of Varda's revenue. It confirms government willingness to pay for commercial reentry testbed services and reduces the single-customer concentration risk of the pharma stream.
  claimRefs:
  - CI002
  - CI003
  - CI032

- id: KI003
  type: risk
  title: Pharma royalty thesis is a long-dated, science-dependent bet
  body: The IP licensing model — where orbital crystallization yields patentable drug polymorphs that earn royalties on future drug sales — carries an effective horizon of 5-15 years and is contingent on (1) crystals forming in orbit, (2) crystal structures being patentable, (3) improved drug formulations being clinically meaningful, and (4) drug approval. Scientific experts describe the current crystallization process as difficult to control and the path to commercial sale as unproven.
  claimRefs:
  - CI012
  - CI023
  - CI030
  - CI031

