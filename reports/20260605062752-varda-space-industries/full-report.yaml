      - - thesis
        - >-
          AFRL IDIQ and multi-agency DoD relationships (Navy W-5, NASA/Sandia W-6) show defense demand diversifying
          beyond a single contract.
        - If AFRL IDIQ lapses or DoD spending on hypersonic testbeds declines materially, the revenue anchor disappears.
      - - thesis
        - >-
          Unlimited FAA reentry license through 2029 removes the single largest regulatory bottleneck that stalled W-1
          for months.
        - >-
          Any new denial or suspension of reentry permits, or export-control complications from international launches,
          would recreate the W-1 scenario.
      - - anti-thesis
        - >-
          No space-manufactured drug has ever received FDA approval anywhere in the world, meaning the pharma IP thesis
          is a long-dated scientific bet with no commercial precedent.
        - >-
          FDA approval of a drug meaningfully enabled by orbital manufacturing would validate the category and force
          upward revision of the pharma revenue timeline.
