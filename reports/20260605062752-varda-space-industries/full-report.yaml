      - number: '1.4'
        title: Mission Milestones, Regulatory Inflection, and Adverse Context
        blocks:
          - type: paragraph
            body: >-
              The defining early milestone was W-1. Varda launched the first mission in June 2023 on SpaceX with a
              Rocket Lab Photon bus, produced Form III ritonavir in microgravity, and then discovered that technical
              success alone did not create an operating business. The capsule remained in orbit for months because FAA
              licensing and Utah range coordination were not yet routinized for commercial land reentry. The FAA’s 2024
              finding and decision eventually authorized a Varda reentry operation at UTTR South or Northern Dugway, and
              W-1 returned in February 2024 as the first commercial spacecraft to land on U.S. soil. That episode is
              both a badge of regulatory progress and a reminder that Varda’s system depends on permissions, ranges, and
              liability allocation outside its direct control.


              The next phase is about cadence and diversification. W-4 in 2025 debuted a next-generation spacecraft
              under the FAA’s first reentry vehicle operator license. W-5 and W-6 in 2026 extended the model into
              national-security payloads, autonomous navigation, and thermal-protection testing, while NASA-supported
              C-PICA heat-shield production moved further in-house. AFRL’s $48 million contract and Prometheus-funded
              flights show that government demand is already monetizing the capsule as a hypersonic testbed. At the same
              time, the United Therapeutics collaboration is the clearest public proof that Varda is trying to convert
              orbital pharma from experiment into product development. The caution is that even sympathetic coverage
              still says the business remains commercially unproven: no space-manufactured drug is on shelves yet, and
              the economics appear to work only for the highest-value products.
