      - number: '6.4'
        title: Retention, Repeat Usage, and Customer Satisfaction Evidence
        blocks:
          - type: paragraph
            body: |-
              Government segment repeat usage is the strongest durability signal available from public
              evidence. The AFRL Prometheus program has now funded four consecutive Varda missions:
              W-2 (OSPREE, March 2025), W-3 (AFRL payload, May 2025), W-5 (U.S. Navy payload,
              January 2026), and W-6 (AFRL/Sandia/NASA payloads, May 2026). The multi-agency nature
              of W-6 — where AFRL, Sandia National Laboratories, and NASA simultaneously embedded
              payloads — demonstrates expanding, not contracting, government customer breadth within a
              single mission. The $48 million, four-year AFRL contract provides forward-contracted
              demand through 2028, and the MACH-TB 2.0 selection adds a second multi-year government
              framework. VP Dave McFarland's public statement that W-6 data "would have taken years to
              collect through traditional testing methods" signals the strong value proposition
              government customers perceive. Varda's president stated in late 2025 that the company
              has flights booked for customers well into 2027, providing an indirect indicator of
              confirmed forward bookings across both segments.

              Pharmaceutical segment repeat usage is supported by the W-1 → W-3 → W-4 sequence of
              pharmaceutical missions with undisclosed customer(s), and by United Therapeutics' explicit
              multi-mission commitment. However, no formal retention metrics exist in public sources:
              Varda has not disclosed NRR, GRR, customer count, cohort churn, contract renewal rates,
              or individual customer satisfaction scores for either segment. The proxy for operational
              reliability is the 6/6 capsule recovery rate across all W-series missions — a track record
              no other commercial reentry provider matched as of mid-2026. No customer complaint,
              mission failure, or contract termination has appeared in public sources.
