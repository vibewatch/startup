      - number: '2.5'
        title: Adoption Constraints, Contradictions, and Evidence Gaps
        blocks:
          - type: paragraph
            body: >-
              The most fundamental adoption constraint is that no commercially sold product has yet originated from
              orbital manufacturing—neither from Varda nor from any competitor. Varda's own CRO acknowledged at the 2025
              AIAA conference that the vast majority of the microgravity ecosystem remains at early research stages
              working with universities and research institutions, far from production customers. This observation is
              consistent with AIAA's independent analysis, which noted that high costs and insufficient customer demand
              have historically thwarted every previous wave of space manufacturing projections. The first W-1 ritonavir
              crystal experiment, while a genuine technical achievement, produced material for research
              characterization, not a product ready for patient use.


              Regulatory risk compounds the timeline challenge. Any novel formulation identified in orbit must complete
              IND filing, Phase I through III clinical trials, and FDA review before commercial use—a process typically
              requiring seven to ten years and several hundred million dollars of investment. MIT Technology Review
              noted explicitly that Merck's Keytruda orbital crystallization work, despite yielding insights about
              crystal formation, did not directly produce the formulation used in the eventual subcutaneous FDA
              approval. There is no straight-line connection from orbital experiment to drug on shelf.


              The in-space manufacturing market data itself contains a material contradiction: TBRC's 2025 baseline of
              roughly $1.2–1.6 billion versus 6W Research's $4.1 billion estimate for the same period implies that
              analysts disagree by a factor of three or more on current market size. Without visibility into
              methodology, geography, and scope assumptions, it is impossible to know which estimate is more reliable.
              Varda has not disclosed a SAM, SOM, or pricing model, and the financial terms of the United Therapeutics
              collaboration and the AFRL $48 million contract (including how much has been obligated and recognized)
              remain outside the public record. These evidence gaps prevent any rigorous bottom-up sizing of Varda's
              near-term revenue potential from either segment.
            claimRefs:
