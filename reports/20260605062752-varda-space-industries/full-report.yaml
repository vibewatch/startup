chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Mission, and Operating Model
        blocks:
          - type: paragraph
            body: >-
              Varda Space Industries is best understood as a hybrid infrastructure company rather than a single-mission
              space startup. Official materials describe it as a microgravity-enabled life sciences company that
              processes materials in orbit and returns them to Earth, while the platform and government pages make clear
              that the same capsule architecture also underpins a hypersonic reentry-test business. That framing matters
              for diligence because Varda is not only trying to discover a novel pharmaceutical workflow; it is also
              selling a reusable path to orbit, orbital operations, reentry, and terrestrial recovery. In other words,
              management is building both the manufacturing environment and the logistics chain around it.


              Public identity facts are comparatively crisp. Varda was founded in January 2021 by Will Bruey and Delian
              Asparouhov, is headquartered in El Segundo, California, and publicly lists additional office presence in
              Washington, D.C. and Huntsville, Alabama. The company page also stresses a talent mix drawn from SpaceX,
              Blue Origin, large pharmaceutical companies, and Silicon Valley. That combination supports the core
              thesis: Varda is attempting to industrialize low Earth orbit by pairing specialized hardware with a
              commercialization story aimed first at very high-value materials, especially pharmaceuticals, where the
              cost of launch can plausibly be absorbed.
