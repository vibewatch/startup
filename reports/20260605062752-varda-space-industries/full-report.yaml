  - id: FR003
    title: Dependency map — Varda's critical external partners and their risk dimensions
    type: dag
    layout: standard
    summary: >-
      Maps the external entities on which Varda's operational continuity depends, with risk characterization for each
      dependency edge. SpaceX and AFRL are the two highest-concentration single points of failure. Southern Launch and
      FDA are also structurally critical but with different timing and mitigation profiles.
    approximationNotes: >-
      Dependency relationships are inferred from public mission records and press releases. Contractual terms, SLA
      provisions, and sub-supplier relationships are not publicly disclosed. Risk labels are qualitative.
    claimRefs:
