      - number: '2.2'
        title: TAM, SAM, and Contradictory Sizing Lenses
        blocks:
          - type: paragraph
            body: >-
              Three independent market research estimates for the in-space manufacturing segment disagree substantially
              on both baseline size and growth trajectory. The Business Research Company estimated the global in-space
              manufacturing market at $1.21 billion in 2025 and $1.5 billion in 2026, growing to $3.51 billion in 2030
              at a CAGR of 23.6 percent. The same firm's adjacent report on space-based manufacturing materials
              estimated $1.62 billion in 2025 and $1.96 billion in 2026, also growing to $4.11 billion by 2030 at a 20.3
              percent CAGR. In contrast, 6W Research estimated the in-space manufacturing market at $4.1 billion in
              2025, projecting $9.2 billion by 2032 at a 12.1 percent CAGR—placing the 2025 baseline at 3.4 times the
              TBRC figure for the same year. These differences most likely reflect disagreements in market definition
              scope (materials value versus services revenue versus infrastructure investment), geography, and whether
              government program costs are included, but the reports do not fully disclose their methodologies.


              For the upstream pharmaceutical opportunity, GM Insights estimated the global monoclonal antibodies market
              at $285.9 billion in 2025, growing from $319.5 billion in 2026 to $936.1 billion in 2035 at a CAGR of 12.7
              percent. Coherent Market Insights estimated a narrower biologics market segment at $639.9 million in 2026,
              growing to $1.31 billion by 2033—a figure that, if taken as the in-space biologics context, would
              represent a dramatically smaller opportunity than the MAbs headline. The 3-4× discrepancy between the
              broader GMI number and the Coherent figure reflects different market definitions and should be preserved
              as contradictory evidence rather than resolved by choosing one.


              Varda itself does not publish a SAM or SOM estimate in public materials. CEO Eric Lasker stated at the
              2025 AIAA conference that no space-manufactured product is currently on pharmacy shelves, confirming that
              the commercial pharma revenue base is currently near zero. The practical SAM for the pharmaceutical path
              is bounded by the fraction of high-value drug programs—estimated by MIT Technology Review at roughly
              $7,000/kg to reach orbit—where per-gram drug value exceeds launch and processing cost by a sufficient
              margin. Management cites monoclonal antibodies and biologics as the first-probable commercially viable
              category, and Merck's pembrolizumab (Keytruda) ISS crystallization work, which contributed to FDA approval
              of a subcutaneous formulation in 2025, offers the clearest near-term proof-of-concept for the economic
              model.
