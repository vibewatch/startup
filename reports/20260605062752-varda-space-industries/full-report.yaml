  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Risk
        blocks:
          - type: paragraph
            body: |-
              Varda's operating model is more regulatory-intensive than almost any other commercial space startup
              because it requires prior approval from the FAA (reentry vehicle operator license), the DoD (range
              access for Utah Test and Training Range), and Australian authorities (CASA and South Australian Space
              Industry Centre for Koonibba Test Range operations) on every mission cycle. The W-1 episode from
              2023–2024 is the defining adverse data point: the capsule remained stranded in orbit for eight months
              because the FAA denied Varda a reentry license and the U.S. Air Force refused range access, leaving
              drug crystals in orbit and exposing investors to the possibility of total mission loss. The FAA
              explicitly stated Varda had not demonstrated compliance with applicable regulations. Public reporting
              from Payload Space and CNBC documented the episode in real time, and Aerospace America's
              "Permission to Launch" feature turned it into a cautionary tale for the entire commercial reentry
              sector. The FAA subsequently changed its rule: since April 2024, no reentry vehicle may launch from
              U.S. territory without a pre-existing reentry license in hand.

              The mitigation is substantial but conditional. Varda now holds an FAA Part 450 vehicle operator
              license (issued for W-4) that covers unlimited reentries through 2029 — the first such blanket
              authorization in U.S. commercial space history. AIAA and Aviation Week reported this as a genuine
              regulatory milestone. However, the license has a fixed expiration, and any renewal will require
              demonstrating continued compliance, conducting additional environmental assessments for new landing
              sites, and navigating whatever rules the FAA may have evolved by 2028–2029. Pharmaceutical payload
              operations add a second regulatory layer: the FDA has never approved a drug manufactured in orbit,
              and the regulatory pathway for chemistry, manufacturing, and controls (CMC) compliance under Good
              Manufacturing Practice for microgravity-origin batches remains undefined. ITAR export controls
              apply to all DoD-classified hypersonic payloads, creating an ongoing compliance obligation that
              could cause mission delays or customer restrictions if classification levels change.
