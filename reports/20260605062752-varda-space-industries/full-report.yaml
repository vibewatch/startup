            title: AFRL IDIQ and USASpending.gov confirmation is the anchor
            body: >-
              The $48 million AFRL IDIQ (FA9453-25-F-X010) is verifiable on USASpending.gov and provides the most
              credible external indicator of Varda's revenue. It confirms government willingness to pay for commercial
              reentry testbed services and reduces the single-customer concentration risk of the pharma stream.
