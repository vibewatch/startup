  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Platform Overview and Module Map
        blocks:
          - type: paragraph
            body: >-
              Varda Space Industries operates what its official materials describe as the world's only commercially
              available, non-astronaut-operated orbital manufacturing and reentry platform. The W-series is the core
              product: a free-flying orbital spacecraft that processes materials in microgravity and returns them to
              Earth inside a recoverable reentry capsule. Public materials frame the platform around two primary
              customer uses — pharmaceutical crystallization and government hypersonic reentry testing — with a shared
              hardware infrastructure serving both. The orbital satellite bus provides station-keeping, power, and
              communications; the payload module processes materials autonomously in microgravity; and the reentry
              capsule returns results to a designated landing zone.


              From W-4 onward, Varda designs and builds the bus, payload module, capsule, and heatshield entirely at its
              El Segundo headquarters and manufacturing facility, achieving end-to-end vertical integration. A
              10,000-square-foot pharmaceutical crystallization lab, funded by the 2025 Series C, operates on the ground
              in El Segundo to pre-screen drug candidates for orbital suitability before committing a mission slot.
              Varda describes two distinct pharmaceutical payload configurations: a melt crystallization module used on
              W-1 through W-3, and a fluid-based solution-based crystallization module introduced on W-4, the latter
              more closely matching terrestrial pharmaceutical lab practice for controlling particle size and
              polymorphism in small-molecule drugs.
