          label: SpaceX Falcon 9 (launch — 100% of missions; CONCENTRATION RISK HIGH)
        - id: southern
          label: Southern Launch / Koonibba (recovery — W-2 to W-6; 20-reentry agreement)
        - id: uttr
          label: Utah Test and Training Range / DoD (contingency recovery site; FAA-licensed)
        - id: afrl
          label: AFRL Prometheus + MACH-TB 2.0 (anchor customer; $48M IDIQ; CONCENTRATION RISK HIGH)
        - id: nasa
          label: NASA Ames (C-PICA license; Tipping Point grant; heatshield supply chain)
        - id: faa
          label: FAA (Part 450 license; reentry authorization; 2029 expiry)
        - id: fda
          label: FDA (pharmaceutical IND approval; CMC GMP guidance; no precedent)
        - id: ut
