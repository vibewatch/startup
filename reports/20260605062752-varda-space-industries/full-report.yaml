      - number: '8.5'
        title: 'Exit readiness: IPO window exists but secondary market is the near-term liquidity path'
        blocks:
          - type: paragraph
            body: >-
              Varda's exit profile as of June 2026 shows multiple plausible liquidity paths, none of which is imminent.
              The company has reached unicorn status, has active secondary market trading on platforms including Forge
              Global and the Nasdaq Private Market, and is tracked as a pre-IPO investment opportunity by PitchBook and
              CB Insights. Private equity analysts cited by these platforms expect an IPO window to open in late 2026 or
              2027, conditional on market conditions and continued mission execution. The availability of secondary
              trading with over $124 million in shares exchanged in recent months indicates that early investors and
              employees have access to partial liquidity; it also means a public offering is not driven by desperate
              need for exit access.


              The M&A alternative is realistic and possibly more value-maximizing than an IPO for certain outcomes.
              Varda's hypersonic reentry capability, proprietary W-series capsule hardware, FAA vehicle operator
              license, and established DoD relationships represent a strategically valuable bundle for a defense prime
              seeking commercial space manufacturing exposure. Northrop Grumman, L3Harris, and Leidos have all expanded
              space and hypersonics capabilities through acquisition in recent years; SpaceX's potential IPO could also
              create a secondary acquirer appetite for unique reentry infrastructure. The pharmaceutical IP dimension
              would be less attractive to a pure defense acquirer but could attract pharma-oriented strategic investors
              such as a large biotech or contract development and manufacturing organization seeking a novel IP
              pipeline.


              The SpaceX IPO anticipated in 2026 at a valuation potentially exceeding $1.5 trillion is expected to
              reshape valuation multiples for space hardware peers, likely pulling comparable company multiples upward
              and broadening public-market appetite for the sector. This represents an external tailwind for Varda's IPO
              timing but also a risk: if SpaceX goes public and immediately reprices the sector, Varda's own IPO
              valuation expectations may need to update against a much larger benchmark.
            claimRefs:
