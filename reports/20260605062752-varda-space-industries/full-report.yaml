      - number: '7.6'
        title: Mitigations, Monitoring Indicators, and Kill Criteria
        blocks:
          - type: paragraph
            body: |-
              Varda has materially de-risked the regulatory dimension relative to 2023: the Part 450 operator
              license removes per-mission reentry approval, Australia adds a non-Utah recovery pathway, and the
              precedent-setting W-4 through W-6 government missions have institutionalized AFRL and DoD as
              stakeholders who benefit from Varda's continued operation. The defense business model is robust to
              moderate budget cuts because MACH-TB 2.0's multi-year architecture and $2.6B+ in hypersonics
              congressional appropriations create structural demand that is harder to zero out than a single
              discretionary line item. The Southern Launch 20-reentry agreement through 2028 reduces range-access
              single-point-of-failure risk.

              The key unmitigated risks are: SpaceX exclusivity, pharma regulatory pathway uncertainty, and key-
              person concentration. Monitoring indicators for an investment thesis break include: FAA licensing
              delays on any new post-2029 license application, a Falcon 9 extended standdown affecting scheduled
              Transporter missions, any public disclosure of a United Therapeutics collaboration pause, and AFRL
              Prometheus program budget reductions above 20% of the $48M IDIQ ceiling. A CEO departure or
              exit would be a threshold event triggering comprehensive re-underwriting of both the pharma and
              defense narratives. The pharmaceutical kill criterion is simpler: if no IND application is filed by
              any Varda pharma customer by 2028, the 5-to-10-year drug commercialization timeline that supports
              the royalty thesis becomes effectively speculative rather than concrete. Investors and diligence
              teams should establish specific data-room asks — board succession plans, Bruey contract terms, AFRL
              task order pipeline, SpaceX rideshare terms and backup launcher evaluation — before committing
              capital at current valuation levels.
