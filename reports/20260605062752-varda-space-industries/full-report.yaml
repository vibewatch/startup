companyProfile:
  summary: >-
    Varda Space Industries is an El Segundo-based orbital-manufacturing and reentry company founded in January 2021 by
    Will Bruey and Delian Asparouhov. The company operates a reusable W-series spacecraft platform that performs
    microgravity processing in low Earth orbit and returns payloads via autonomous capsule reentry. By mid-2026 Varda
    had flown six orbital missions and become the first commercial operator to earn an FAA vehicle operator license
    authorizing unlimited reentries. Revenue streams include government defense testbed services anchored by an AFRL $48
    million IDIQ contract, early-commercial pharmaceutical services with United Therapeutics as the first named
    collaboration partner, and a longer-term IP licensing model for novel drug polymorphs produced in microgravity. The
    company had approximately 200 employees in May 2026 and has raised approximately $578 million through a Series D at
    a reported $1.58 billion post-money valuation.
