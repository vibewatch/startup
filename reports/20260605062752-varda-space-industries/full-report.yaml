      - number: '5.2'
        title: Customer Workflows and Use Cases
        blocks:
          - type: paragraph
            body: >-
              For pharmaceutical customers, the core workflow converts a drug compound screening candidate into orbital
              crystallization data or a processed material that would be difficult or impossible to obtain under
              terrestrial gravity. The customer submits a drug candidate; Varda's El Segundo lab performs pre-flight
              screening to evaluate microgravity suitability; the compound is loaded into the processing payload module;
              it flies to low Earth orbit on a SpaceX rideshare; crystallization or processing occurs autonomously over
              a period typically ranging from six to sixteen weeks; the capsule reenters and recovers at Koonibba Test
              Range in South Australia; the processed material is shipped back for post-flight analysis. W-1
              demonstrated this workflow with Form III ritonavir — the first commercial pharmaceutical produced in orbit
              — and a 2026 npj Microgravity paper confirmed stability of the space-processed material after reentry. W-4
              expanded the pharmaceutical toolkit with a fluid-based solution-based crystallization architecture. The
              United Therapeutics collaboration, announced in May 2026, applies this workflow to pulmonary arterial
              hypertension treatments over multiple mission runs.


              For government customers, the workflow is simpler: a customer supplies a tested payload — sensor, material
              sample, or instrument — Varda integrates it into the hypersonic testbed section of the reentry capsule,
              and the capsule collects in-flight data during Mach 25+ reentry. Recovered hardware and data are returned
              to the customer for post-flight analysis. The OSPREE spectrometer on W-2 made the first in-situ DoD
              optical emission measurements of a Mach 25+ plasma sheath, demonstrating data quality unavailable from any
              ground facility.
