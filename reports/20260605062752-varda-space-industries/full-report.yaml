      - number: '6.3'
        title: Pharmaceutical and Commercial Customers — United Therapeutics, United Semiconductors, and Undisclosed Pipeline
        blocks:
          - type: paragraph
            body: |-
              The pharmaceutical customer segment advanced significantly in May 2026 when Varda
              announced a multi-mission collaboration with United Therapeutics Corporation (Nasdaq: UTHR)
              to develop improved formulations of small-molecule drugs for rare pulmonary diseases,
              beginning with pulmonary arterial hypertension treatments. United Therapeutics CEO Martine
              Rothblatt described Varda's platform as "routinized," contrasting it with the logistical
              complexity of ISS research, and said the collaboration could "open up billions of dollars
              in markets" if microgravity enables novel molecular shapes. This is the first publicly
              named pharmaceutical company collaboration in Varda's history and the strongest public
              signal of pharma-segment commercial traction. The agreement specifies multiple missions
              over time, providing a repeat-usage commitment, though financial terms were not disclosed.

              Prior to the United Therapeutics announcement, three Varda missions carried pharmaceutical
              payloads for unnamed customers: W-1 (returned February 2024) produced Form III ritonavir,
              subsequently confirmed stable in a peer-reviewed npj Microgravity paper; W-3 (May 2025)
              carried a proprietary pharmaceutical payload; and W-4 (launched June 2025) processed a
              proprietary small-molecule compound under a solution-based crystallization protocol.
              Varda's Series C announcement (July 2025) stated the company is "in conversation with
              leading pharmaceutical manufacturers" struggling with crystallization, purity, or
              shelf-stability challenges, without naming them. The new 10,000-square-foot El Segundo
              pharmaceutical laboratory funded by the Series C is designed to accelerate pre-screening
              of these unnamed pipeline customers' compounds.

              In the advanced materials segment, Varda signed a multi-flight joint development
              agreement with United Semiconductors to produce semiconductor crystal materials in orbit
              for terrestrial use, targeting performance improvements in AI, aerospace, and defense
              semiconductor devices. United Semiconductors had previously conducted semiconductor
              manufacturing demonstrations on the International Space Station through the ISS National
              Laboratory, giving it prior orbital manufacturing experience before the Varda partnership.
              This agreement, announced approximately May 2025, broadens Varda's commercial customer
              base beyond pharmaceuticals for the first time with a named commercial partner.
