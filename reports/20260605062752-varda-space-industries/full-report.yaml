      - number: '5.4'
        title: Trust, Quality, Compliance, and Safety Controls
        blocks:
          - type: paragraph
            body: >-
              Varda's strongest public trust artifact is its mission safety record: all six W-series missions have
              successfully returned their capsules and payloads, with six consecutive recoveries at planned landing
              sites — UTTR for W-1 and Koonibba Test Range for W-2 through W-6. The company holds the FAA's first-ever
              Part 450 vehicle operator license for reentry, issued at the W-4 mission in June 2025 and valid through
              2029. This license eliminates the per-mission FAA approval process that delayed W-1's reentry by eight or
              more months when the Utah Test and Training Range declined to prioritize the commercial landing. The NASA
              C-PICA technology license confirms that the heatshield material meets aerospace-grade standards vetted at
              NASA Ames. AFRL mission assurance requirements are demonstrated through multiple successful
              Prometheus-program missions with DoD payload recovery and AFRL public affairs approval statements.


              The pharmaceutical manufacturing trust picture has material gaps. Varda has not publicly claimed GMP or
              cGMP certification for its orbital processing payloads — a prerequisite for clinical use of
              space-manufactured drugs. No public failure-mode analysis, FMEA, or reliability statistics are published.
              The six-mission success record is operationally encouraging but is not a statistical basis for reliability
              estimation on a small fleet. Scientific American expert commentary flags that orbital crystallization
              conditions are "exceedingly difficult to control," and that crystallization timing is unpredictable. The
              quality control pathway from orbital crystallization to commercial pharmaceutical supply is undefined in
              public sources.
            claimRefs:
              - CE006
