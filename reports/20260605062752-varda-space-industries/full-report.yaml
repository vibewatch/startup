  - id: FI001
    title: Revenue model bridge — customer activity to gross profit
    type: flow
    summary: >-
      Illustrates how customer commitments flow through Varda's orbital platform to generate revenue and potential gross
      profit. Defense and pharma customers book mission slots on W-series capsules; the capsule flies on SpaceX
      rideshare, conducts in-orbit work, and returns via Southern Launch; revenue is recognized on task order completion
      or service delivery. IP royalties are a long-dated downstream node contingent on drug commercialization.
    approximationNotes: >-
      Flow represents structural revenue logic, not confirmed dollar amounts. Node values are undisclosed. Defense
      mission fees are estimated from IDIQ ceiling; pharma mission fees and royalties are entirely undisclosed.
    claimRefs:
      - CI001
      - CI002
      - CI008
      - CI011
      - CI012
      - CI021
      - CI032
    data:
      nodes:
        - id: n1
          label: Government / DoD Customer (AFRL Prometheus, Navy, Sandia, NASA)
          detail: Books mission slot under IDIQ or project agreement; pays task order on data/material delivery
        - id: n2
          label: Pharma Customer (United Therapeutics and future)
          detail: Pays per-mission service fee and/or take-rate on API commercial value; IP collaboration terms undisclosed
        - id: n3
          label: SpaceX Falcon 9 Rideshare Launch (~$7,000/kg; est. $2-4M/mission)
          detail: Primary variable cost input; Varda has 10+ missions contracted through 2028 on Transporter manifests
        - id: n4
          label: W-Series Orbital Manufacturing / Testing
          detail: >-
            W-series spacecraft conducts in-orbit pharmaceutical processing or hypersonic testbed payload hosting;
            C-PICA heat shield manufactured in-house at El Segundo
        - id: n5
          label: Reentry and Recovery (Southern Launch, Koonibba Test Range, South Australia)
          detail: Capsule reenters at Mach 25; recovered within hours; data and materials returned to customer
        - id: n6
          label: Mission Fee Revenue (defense task orders + pharma service fees)
          detail: Revenue recognized on delivery; defense fees estimated $10-15M/mission under IDIQ; pharma fees undisclosed
        - id: n7
          label: IP / Royalty Revenue (long-dated, pre-revenue)
          detail: >-
            Patent royalties from novel drug polymorphs; zero recognized revenue as of mid-2026; material only if a drug
            reaches commercial sale
  - id: FI002
    title: Unit economics bridge — mission revenue to estimated gross profit
    type: flow
    summary: >-
      Shows structural unit economics for a single W-series mission, identifying confirmed and estimated cost nodes and
      the gross profit gap that must be closed for the business to reach positive contribution margins. Key inputs are
      either estimated or undisclosed. Defense missions are closer to positive contribution than pharma missions given
      the contract-backed fee structure.
