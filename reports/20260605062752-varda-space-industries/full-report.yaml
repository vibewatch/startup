      - number: '7.2'
        title: Operational, Quality, and Technical Risk
        blocks:
          - type: paragraph
            body: |-
              Varda's capsule design imposes extreme operational demands: every mission exposes the W-series
              vehicle to sustained plasma heating above 18,000 K in the flow field, 300 W/cm² heat flux, and
              Mach 25+ reentry velocities — conditions that would destroy any capsule whose thermal protection
              system underperforms. The company has completed six consecutive successful missions, which is a
              meaningful track record in an industry where single failures have bankrupted startups. However,
              the statistical base is still small, and increasing mission cadence to near-monthly rates by 2026
              compresses the time available for post-mission inspection, anomaly investigation, and hardware
              iteration. If a heatshield integrity failure or parachute anomaly results in capsule loss, the
              operational, reputational, and financial impact would be severe — a government DoD payload loss
              would likely trigger Prometheus program review, and a pharmaceutical payload loss would damage
              United Therapeutics' confidence at a commercially critical moment.

              Quality risk is particularly acute in the pharmaceutical processing domain. Ritonavir crystallization
              worked on W-1 as a proof of concept, but the transition from single-crystal demonstration to
              reproducible GMP-compliant manufacturing batches suitable for IND-filing requires process validation,
              contamination controls, and documentation that have no established precedent for in-orbit environments.
              The FDA has not published guidance for space-manufactured pharmaceuticals, and Varda has not publicly
              disclosed any engagement with FDA's Emerging Technology Program. A mission where crystals degrade,
              contaminate, or fail to meet pharmaceutical specifications on the W-4 or subsequent pharmaceutical
              missions would set back the pharma commercialization timeline without any public acknowledgment that
              the failure occurred. Cybersecurity risk on DoD payloads is classified and not publicly assessable,
              but it represents an unresolved gap given the defense intelligence sensitivity of hypersonic data.
