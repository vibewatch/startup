      - number: '1.3'
        title: Funding History, Scale Markers, and Physical Expansion
        blocks:
          - type: paragraph
            body: >-
              Varda’s capital formation has accelerated alongside mission cadence. The company publicly announced a $90
              million Series B in 2024 and then a $187 million Series C in July 2025, taking official disclosed lifetime
              funding to $329 million. Independent 2026 reporting adds a more speculative layer: TechCrunch’s unicorn
              roundup, drawing on PitchBook, said Varda last raised a $250 million Series D at a $1.6 billion valuation
              and had raised more than $570 million in total. That figure is useful as a market signal, but not yet as
              company-confirmed ground truth, so it should be carried as an external estimate rather than a settled
              internal fact.


              Operational scale markers are easier to triangulate than economics. Varda moved from 90+ employees in 2024
              to roughly 175 by late 2025 and about 200 by May 2026, while also expanding its terrestrial footprint.
              Series C funding supported a 10,000-square-foot pharmaceutical lab and a Huntsville office; the Los
              Angeles Times later reported a 205,443-square-foot former Mattel campus lease plus an earlier
              55,000-square-foot lab sublease. These facility moves imply management is preparing for higher hardware
              throughput and more serious pharma-process development. What remains absent from the public record is
              revenue, customer count, debt, and capital-structure detail, so scale is visible mostly through missions,
              hiring, and real-estate expansion rather than financial disclosure.
