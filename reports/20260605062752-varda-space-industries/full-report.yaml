      - number: '7.3'
        title: Partner and Supply Chain Dependency Risk
        blocks:
          - type: paragraph
            body: |-
              Varda's operating platform rests on a small number of critical external dependencies, any one of
              which could disrupt the mission pipeline with little lead time for substitution. SpaceX Falcon 9
              rideshare is the exclusive launch vehicle for all six W-series missions to date, and Varda has
              publicly confirmed 10+ missions booked on Transporter manifests through 2028. A Falcon 9 fleet
              standdown — as occurred for 47 days in August–October 2023 following an upper-stage anomaly —
              would cascade across Varda's launch schedule and potentially cause government customers to seek
              alternative hypersonic testbed providers. Politico's 2026 reporting flagged that approximately $8
              billion in venture-backed space investment is directly exposed to SpaceX operational continuity, and
              Varda is among the companies most tightly coupled to that single provider. Varda has not publicly
              identified an alternative launch provider for pharmaceutical or defense missions.

              Southern Launch and its Koonibba Test Range in South Australia serve as Varda's primary reentry
              recovery site since W-2. Varda announced a formal agreement for 20 reentries through approximately
              2028, and South Australian authorities confirmed the fourth Varda capsule landing in 2026. The range
              is remote, community-engaged, and operationally proven, but it introduces geographic dependencies
              (Australian airspace closures, export licensing for DoD payload return, and Southern Launch's own
              capacity) that are external to Varda's control. The Air Force Research Laboratory, via Prometheus,
              is functionally a monopsony for Varda's defense revenue today — if AFRL budget is cut, reallocated,
              or the Prometheus program is restructured, Varda would lose its primary confirmed revenue source.
              United Therapeutics represents equivalent concentration risk in the pharmaceutical segment: it is
              currently the only named pharma customer, and departure or delay would eliminate the commercial
              pharma proof-of-concept that supports the pharma licensing thesis and future revenue projections.
