            title: Revenue entirely private — all financial underwriting is deferred
            body: >-
              Varda has not publicly disclosed revenue, gross margin, burn rate, or cash position. Every financial
              estimate in this chapter is modeled from indirect signals. No investment decision can be underwritten from
              public information alone; a data-room process is a prerequisite for any material commitment.
