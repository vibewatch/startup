      - number: '5.3'
        title: W-Series Technology Architecture and Operating Design
        blocks:
          - type: paragraph
            body: >-
              The W-series system can be described as a five-layer hardware stack: (1) SpaceX Transporter rideshare as
              the launch vehicle; (2) the orbital satellite bus for power, attitude control, propulsion, and
              communications; (3) the pharmaceutical processing or government payload module; (4) the reentry capsule
              with C-PICA thermal protection; and (5) parachute and terrestrial recovery infrastructure managed by
              Southern Launch. The satellite bus evolution is the defining architectural transition in the W-series
              history. W-1, W-2, and W-3 used Rocket Lab's Photon — a commercially available satellite bus purchased
              off-the-shelf. Starting with W-4, launched June 2025, Varda replaced Photon with its own in-house bus,
              completing the move to full vertical integration. W-5 confirmed the in-house bus through a complete
              multi-week mission lifecycle including orbital maneuvering and precise deorbit burn.


              The reentry capsule is approximately 90 centimeters in diameter, 74 centimeters tall, and weighs less than
              90 kilograms. On reentry, the capsule reaches speeds exceeding 18,000 miles per hour, Mach 25+,
              experiencing a heat flux of approximately 300 watts per square centimeter and a flow-field temperature of
              18,000 Kelvin or higher. The C-PICA ablative heatshield — originally developed at NASA's Ames Research
              Center — was licensed to Varda under a NASA Tipping Point award and is now manufactured in-house at El
              Segundo from W-4 onward. The hypersonic testbed government service offers more than 100 watts of payload
              power and tens of kilograms of internal mass. The full system operates autonomously throughout each
              mission: no astronaut involvement is required at any stage of orbital operations or processing.
