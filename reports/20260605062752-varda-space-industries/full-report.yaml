      - number: '4.4'
        title: Unit Economics, Cost Structure, and Gross Margin
        blocks:
          - type: paragraph
            body: >-
              Varda's unit economics are largely opaque from public sources. No revenue per mission, gross margin, cost
              of goods sold, or per-unit operating cost breakdown is disclosed by the company. External analyst
              estimates (from Tracxn and similar data providers) put total 2025-2026 revenue at approximately $40-60
              million, but this figure is not company-confirmed and must be treated as a rough third-party
              approximation. Per-mission economics can be partially triangulated from public information but are heavily
              uncertain.


              On the cost side, the clearest data point is SpaceX rideshare pricing. Falcon 9 Transporter rideshare has
              increased to approximately $7,000 per kilogram in 2026 (up from $6,000 in 2024). Varda's W-series
              satellite bus weighs approximately 300 kilograms according to Scientific American's reporting, implying a
              launch cost in the range of $2-$3 million for the satellite bus alone — before accounting for the reentry
              capsule mass, proprietary satellite hardware, personnel, range operations, and recovery logistics. Varda
              management has cited a per-mission cost target of reducing from approximately $12 million at early cadence
              to $2.5 million at full monthly cadence through manufacturing learning curves and hardware reuse. The
              company has not disclosed its current per-mission cost.


              Gross margin drivers are unknown. For government testbed missions under a firm-fixed-price IDIQ, margin
              depends on the negotiated task order value relative to actual mission costs. If Varda achieves its cost
              reduction targets, margins on defense missions could become material over the contract lifetime. For
              pharma missions, gross margin depends entirely on whether the mission fee plus royalty potential justifies
              the full mission cost; at early stage with one customer, unit economics are likely unfavorable relative to
              long-run targets.


              Working capital dynamics are atypical for hardware: spacecraft manufacturing requires significant upfront
              materials and labor costs before launch, and revenue from government task orders may be recognized upon
              delivery of data or materials (creating timing gaps). The capital-intensive Mattel campus lease and pharma
              lab buildout represent fixed costs that grow operating leverage — favorable if mission volume scales,
              unfavorable if it doesn't. Capital expenditure on facility fit-out was estimated at 4-8 months of build
              time as of the March 2026 LA Times report, suggesting significant unproductive capital commitment in 2026.
