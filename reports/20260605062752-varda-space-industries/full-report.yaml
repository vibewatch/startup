      - number: '2.3'
        title: Buyer, User, and Payer Segmentation
        blocks:
          - type: paragraph
            body: >-
              Varda's two market segments have structurally different buyer-user-payer triads. In the pharmaceutical
              segment, the buyer is typically a large pharma or biotech company's R&D leadership or business development
              function, the user is a team of formulation scientists and structural biologists, and the payer is the
              company's pharmaceutical R&D budget—a discretionary line item rather than a capital expense. The United
              Therapeutics collaboration, announced in May 2026, is the first publicly confirmed deal in which a major
              named pharmaceutical company is paying Varda for orbital process development on pulmonary disease
              therapies. United Therapeutics CEO Martine Rothblatt said the collaboration opens "billions of dollars in
              markets" for her company, though neither party disclosed contract terms, pricing, or milestone structure.
              Merck's multi-year ISS-based pembrolizumab crystallization program offers historical precedent,
              demonstrating that large pharma companies will allocate sustained R&D budgets for microgravity formulation
              work when the pharmacokinetic prize is sufficiently large.


              In the defense and hypersonic testbed segment, the buyer and payer are U.S. government program
              offices—primarily AFRL and Navy research commands—spending from congressionally appropriated R&D lines.
              The $48 million four-year Prometheus-linked AFRL contract, plus W-5 and W-6 Navy and NASA payload work,
              confirms that multiple DoD branches now treat Varda as a credible and repeatable test infrastructure
              provider. The House Defense Appropriations Bill for FY2026 allocated over $2.6 billion for hypersonics
              programs, and the FY2026 Space Force request plus Golden Dome reconciliation totaled a nearly 40 percent
              increase over FY2025 enacted levels, providing favorable tailwinds for continued hypersonic test demand.
              Research institutions such as NASA Ames and Sandia National Laboratory participate as users rather than
              primary payers, receiving flight data in exchange for TPS payload hosting or advisory support.
