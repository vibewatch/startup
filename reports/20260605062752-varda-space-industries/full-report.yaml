          - type: callout
            title: Regulatory and range access were real blockers, not theoretical ones
            body: >-
              W-1’s months-long delay showed that Varda’s business can be bottlenecked by FAA licensing and
              military-range coordination even after the in-orbit work is complete. That is a structural risk for any
              cadence-sensitive model.
