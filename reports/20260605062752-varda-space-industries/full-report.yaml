  - id: FV001
    title: Recommendation logic — chain from operational proof, valuation, and risks to investment decision
    type: flow
    layout: wide
    summary: >-
      The investment decision for Varda flows from strong operational proof meeting a stretched price mark and thin
      financial disclosure, with pharma science uncertainty and SpaceX dependency acting as the primary swing factors.
    data:
      nodes:
        - id: ops-proof
          label: Operational proof
          detail: >-
            Six consecutive successful orbital reentries, FAA unlimited operator license, AFRL IDIQ confirmed at $48M,
            and W-5/W-6 multi-agency DoD payloads demonstrate rare execution quality.
          tone: positive
        - id: defense-revenue
          label: Defense revenue anchor
          detail: >-
            Confirmed $48M AFRL IDIQ over four years plus SpaceWERX STRATFI $60M provides the clearest near-term revenue
            foundation. Multi-agency engagement broadening.
          tone: positive
        - id: pharma-upside
          label: Pharma IP upside
          detail: >-
            United Therapeutics collaboration and El Segundo pharma lab represent the long-dated royalty thesis, but no
            drug has received FDA approval from orbital manufacturing anywhere.
          tone: warning
        - id: valuation-mark
          label: $1.58B entry mark
          detail: >-
            Implies ~33x the AFRL contract ceiling; requires defense revenue scaling significantly and/or pharma IP
            materializing within a commercial timeline.
          tone: warning
        - id: disclosure-gap
          label: Financial disclosure gap
          detail: >-
            No public revenue, gross margin, burn rate, preference stack, or per-mission economics available;
            underwriting requires a full private data room.
          tone: warning
        - id: concentration-risk
          label: SpaceX / AFRL concentration
          detail: >-
            All six missions used SpaceX Falcon 9; defense revenue concentrated in single AFRL IDIQ; CEO key-person
            dependence documented.
          tone: negative
        - id: decision
          label: Research-more
          detail: >-
            Operational quality justifies continued engagement. Price and disclosure gaps prevent a buy recommendation
            without private diligence. Require data room before underwriting.
          tone: neutral
      edges:
        - from: ops-proof
          to: decision
        - from: defense-revenue
          to: valuation-mark
        - from: pharma-upside
          to: valuation-mark
        - from: valuation-mark
          to: decision
        - from: disclosure-gap
          to: decision
        - from: concentration-risk
          to: decision
    approximationNotes: null
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV005
      - CV006
      - CV034
      - CV037
  - id: FV002
    title: Valuation sensitivity — revenue required to support the $1.58B entry mark at different multiples
    type: bar
    layout: standard
    summary: >-
      The current $1.58B mark is only comfortable at very high revenue multiples. At Redwire-comparable 11x multiples,
      Varda would need over $140M in annual revenue — well above the publicly verifiable base. At RKLB-comparable
      multiples, even modest revenue supports the current mark.
    data:
      items:
        - label: Revenue needed at 10x
          value: 158
          unit: USD millions annually
          detail: Revenue required to support $1.58B valuation at a Redwire-comparable EV/sales multiple.
          tone: negative
        - label: Revenue needed at 15x
          value: 105
          unit: USD millions annually
          detail: Revenue required at a moderate growth-stage defense hardware multiple.
          tone: warning
        - label: Revenue needed at 25x
          value: 63
          unit: USD millions annually
          detail: Revenue required at a premium-growth space/defense multiple.
          tone: neutral
        - label: Revenue needed at 50x
          value: 32
          unit: USD millions annually
          detail: Revenue required at a high-growth analog to lower end of RKLB-range multiples.
          tone: positive
        - label: AFRL IDIQ ceiling (reference)
          value: 48
          unit: USD millions total contract (not annual)
          detail: >-
            Confirmed four-year IDIQ ceiling; annualized implies roughly $10-12M/yr — insufficient at any conventional
            multiple to support current mark alone.
          tone: warning
        - label: Estimated defense revenue (base case)
          value: 70
          unit: USD millions annually (estimated, mid-point of base case range)
          detail: >-
            Analytical estimate of defense revenue at base-case mission cadence including AFRL + Navy/NASA/Sandia
            orders; not company-confirmed.
          tone: neutral
    approximationNotes: >-
      Revenue thresholds are simple EV/revenue bridges using the February 2026 Series D post-money valuation of $1.58B.
      No DCF model is possible from public evidence. All revenue figures except AFRL IDIQ ceiling are analytical
      estimates.
    claimRefs:
      - CV007
      - CV017
      - CV018
      - CV019
      - CV023
      - CV024
      - CV025
  - id: FV003
    title: Valuation / return range — bear, base, and bull case equity value with explicit assumptions
    type: range
    layout: wide
    summary: >-
      The wide valuation range reflects genuine uncertainty about defense revenue scaling and pharma IP timing. The base
      case offers approximately flat returns at the current entry price; new investors need either a lower entry price
      or bull-case conviction to achieve venture-level returns.
    data:
      items:
        - label: Bear case
          low: 300
          mid: 400
          high: 500
          displayValue: $300M–$500M
          detail: >-
            Mission cadence disrupted, pharma stalls, defense revenue stays below $40M/yr. At 10–12x depressed revenue,
            equity value falls 65–81% below the $1.58B entry mark. Trigger: regulatory hold or AFRL non-renewal.
          tone: negative
        - label: Base case
          low: 1000
          mid: 1250
          high: 1600
          displayValue: $1.0B–$1.6B
          detail: >-
            AFRL IDIQ renewed at similar size, defense grows modestly to $70–100M/yr, pharma pre-revenue through
            2027–28. At 15x forward revenue, equity value approximately flat to entry mark. Risk: good execution priced
            in already.
          tone: warning
        - label: Bull case
          low: 2500
          mid: 3200
          high: 4000
          displayValue: $2.5B–$4.0B
          detail: >-
            AFRL expands significantly, defense revenue reaches $150M+/yr, pharma IP licensing produces royalties by
            2030. At 15–20x blended revenue, equity value 1.6–2.5x entry mark. Requires three simultaneous execution
            wins.
          tone: positive
        - label: Current entry mark (Series D)
          low: 1580
          mid: 1580
          high: 1580
          displayValue: $1.58B
          detail: February 2026 Series D post-money valuation. Reference point for all scenario return calculations.
          tone: neutral
    approximationNotes: >-
      All figures are scenario-based analytical estimates for investment committee discussion. They are not management
      guidance, audited financial projections, or discounted cash flow outputs.
    claimRefs:
      - CV001
      - CV024
      - CV025
      - CV026
      - CV027
  - id: FV004
    title: Investment KPIs — IC-ready scoring across market, proof, moat, economics, risk, valuation, and evidence quality
    type: kpi
    layout: standard
    summary: >-
      Varda scores strongly on operational proof and regulatory positioning but significantly lower on financial
      disclosure, economic visibility, and valuation support. The overall profile is consistent with a research-more
      rather than buy recommendation.
    data:
      items:
        - label: Market opportunity
          score: 7
          detail: >-
            Defense hypersonic testbed market ~$5.4–5.7B globally with 11–12% CAGR; pharma orbital manufacturing
            addressable market is large but speculative with no commercial precedent. Score reflects confirmed defense
            demand rather than pharma potential.
          tone: positive
        - label: Operational proof
          score: 8
          detail: >-
            Six consecutive successful missions, FAA unlimited operator license, six-mission track record with W-6
            autonomous navigation validation. Exceptionally strong for a private space hardware company.
          tone: positive
        - label: Competitive moat
          score: 7
          detail: >-
            Only company offering commercial hypersonic reentry testbed as a service with material return; FAA operator
            license creates regulatory barrier; hardware IP is partially protectable. SpaceX could enter but is a
            customer and partner, not yet a competitor.
          tone: positive
        - label: Revenue quality
          score: 4
          detail: >-
            Government IDIQ is high-quality contract-backed revenue, but represents a small confirmed ceiling;
            pharmaceutical revenue is pre-commercial; IP licensing is speculative. No public revenue figure to anchor
            quality assessment.
          tone: warning
        - label: Financial visibility
          score: 2
          detail: >-
            No public revenue, gross margin, burn rate, or unit economics. Estimated annual burn $60–120M. No audited
            accounts or SEC filings. Most opaque dimension of the investment thesis.
          tone: negative
        - label: Risk profile
          score: 3
          detail: >-
            SpaceX dependency, AFRL contract concentration, CEO key-person risk, pharma science uncertainty, and
            regulatory reentry dependence all remain unmitigated in public evidence. High risk rating is appropriate.
          tone: negative
        - label: Valuation support
          score: 4
          detail: >-
            $1.58B mark requires significant revenue scaling beyond confirmed contracts. Base case produces flat
            returns; only bull case justifies venture-level returns from current entry. Price is stretched but not
            obviously detached from sector multiples.
          tone: warning
    approximationNotes: >-
      Scores are ordinal judgments from 0–10 synthesized from the public evidence set for investment committee
      discussion purposes. They are not quantitative outputs.
    claimRefs:
      - CV003
      - CV004
      - CV005
      - CV006
      - CV015
      - CV022
      - CV025
      - CV032
      - CV034
