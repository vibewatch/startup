      - number: '1.2'
        title: Founders, Leadership Bench, and Governance Visibility
        blocks:
          - type: paragraph
            body: >-
              The founder-market-fit case is strong on paper. Bruey came out of SpaceX avionics, giving Varda a leader
              who has already worked inside the launch-systems culture that made routine access to orbit economically
              plausible. Asparouhov brought investor-network leverage and has remained a very visible public champion of
              the company’s long-term orbital-economy thesis. By 2026, public materials also name Adrian Radocea as
              chief science officer, Nick Cialdella as chief technology officer, and Dave McFarland as vice president of
              hypersonic test and targets, suggesting that Varda now has recognized executives spanning pharmaceutical
              science, flight systems, and defense-market development.


              The governance picture is materially thinner. The reviewed public record does not expose a current board
              roster, investor control map, liquidation preferences, or other hard governance terms that a late-stage
              investor would want before underwriting a new round. That does not mean governance is weak; it means
              governance is not transparently disclosed. For chapter-one diligence, the practical read is that Varda
              still looks founder-led and execution-centric, with key-person dependence on Bruey and Asparouhov
              remaining significant until fuller board and succession detail appears in a data room or future filings.
            claimRefs:
