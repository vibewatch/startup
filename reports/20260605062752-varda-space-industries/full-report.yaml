        title: Exhibits
        blocks:
          - type: callout
            title: Validated reentry is now a repeat operational capability
            body: >-
              By 2026 Varda had moved beyond a single proof-of-concept landing into repeated W-series recoveries, with
              W-5 and W-6 demonstrating that the company can use the same basic architecture for both manufacturing and
              defense test payloads.
            calloutType: strength
