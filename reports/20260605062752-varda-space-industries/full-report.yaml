          - type: callout
            title: Pharma royalty thesis is a long-dated, science-dependent bet
            body: >-
              The IP licensing model — where orbital crystallization yields patentable drug polymorphs that earn
              royalties on future drug sales — carries an effective horizon of 5-15 years and is contingent on (1)
              crystals forming in orbit, (2) crystal structures being patentable, (3) improved drug formulations being
              clinically meaningful, and (4) drug approval. Scientific experts describe the current crystallization
              process as difficult to control and the path to commercial sale as unproven.
            calloutType: insight
