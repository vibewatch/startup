      - number: '8.3'
        title: 'Comparable analysis: no clean peer exists, but Rocket Lab and Redwire anchor the range'
        blocks:
          - type: paragraph
            body: >-
              No publicly traded company is a direct comparable for Varda Space Industries in mid-2026 because no other
              publicly traded firm combines autonomous orbital manufacturing hardware, hypersonic reentry testbed
              services, and pharmaceutical IP development in one platform. The closest publicly traded reference points
              are Rocket Lab and Redwire, each of which addresses some but not all of Varda's business model. Private
              comparables include SpaceX and SpaceForge.


              Rocket Lab (RKLB) is the most widely cited public reference for a vertically integrated commercial space
              company with significant government defense revenue. Rocket Lab's Q1 2026 results — $200.3 million in
              quarterly revenue (up 63.5% year-on-year), $2.2 billion in backlog (doubled year-on-year), and government
              contracts now representing 49% of backlog — demonstrate that space hardware companies with diversified
              defense exposure can command extraordinary valuation multiples even before profitability. At a market cap
              of approximately $66.5 billion against TTM revenue of roughly $800 million, RKLB trades at approximately
              83–98x price-to-sales. Applying even half of that multiple to Varda's best-case defense revenue scenario
              would imply a valuation well above the current $1.58 billion mark; applying a more conservative 15–20x
              forward sales would require Varda to achieve $80–100 million in annualized defense revenue to support the
              entry price.


              Redwire (RDW) provides a useful lower-bound anchor. Q1 2026 revenue was $97 million (annualized
              approximately $388 million) with a market cap of approximately $4.2 billion, implying roughly 10–11x
              EV/sales. Redwire is broadly comparable in its exposure to space hardware and defense, but it is
              unprofitable and has a gross margin of approximately 26–27%. Its SpaceMD pharma subsidiary is
              directionally similar to Varda's pharma ambitions but is earlier-stage and not a significant revenue
              contributor. If Varda were to be valued at Redwire-comparable multiples of 10–11x forward sales,
              supporting the current $1.58 billion mark would require roughly $145–160 million in annual revenue —
              materially above what the public evidence currently supports.


              SpaceX is the most important private reference point. With an estimated 2026 valuation of approximately
              $800 billion against estimated annual revenues of $22–30 billion, SpaceX trades at roughly 27–36x forward
              sales — a premium reflecting Starlink's subscription economics and launch market dominance. Varda has no
              equivalent recurring revenue anchor. SpaceForge, the nearest European private peer in space manufacturing,
              raised £30 million in a Series A from the NATO Innovation Fund in 2025 at an implied valuation
              substantially below Varda's current mark, suggesting that Varda's premium reflects its more advanced
              operational status rather than pure comparable pricing.
