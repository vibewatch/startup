      - number: '6.5'
        title: Concentration Risk, Evidence Limits, and Honest Commercial Constraints
        blocks:
          - type: paragraph
            body: |-
              Varda's customer base carries material concentration risk. The government defense segment
              is the confirmed revenue anchor, with the AFRL Prometheus program and MACH-TB 2.0 selection
              as the primary contracts. A reduction in DoD hypersonic test budgets, a shift to other
              providers, or a change in national security priorities could meaningfully reduce near-term
              revenue. All W-series missions launch on SpaceX's Transporter rideshare, creating a
              single-launch-provider dependency that constrains customer mission scheduling and
              introduces operational risk if SpaceX priorities shift.

              The pharmaceutical customer base, while strategically central to Varda's long-term
              commercial thesis, is early-stage and concentrated. United Therapeutics is the only named
              commercial pharma customer as of June 2026. Three earlier missions carried proprietary
              pharma payloads, but those customers remain undisclosed, making independent assessment
              of their depth, renewal likelihood, and commercial terms impossible from public sources.
              No pharmaceutical company has yet generated FDA-approved products from Varda's platform.
              The CEO has stated he expects drugs to reach patients before the end of the decade —
              meaning commercial pharma manufacturing revenue is unlikely before 2030. Aerospace America
              reported CEO Will Bruey as framing space-based medicine as moving "from research novelty
              to manufacturing mainstream" as a multi-year horizon, not an immediate commercial reality.

              Skeptical commentary is warranted. Scientific American expert commentary described
              orbital crystallization conditions as "exceedingly difficult to control" with timing
              unpredictable, characterizing the approach as a "game of chance." SpaceDaily and
              equity-focused analysis noted the pharmaceutical industry is "cautious," treating Varda
              not as a drug manufacturer but as a potential pipeline partner whose value depends on
              a drug reaching FDA approval and commercial scale — a multiyear, high-risk pathway.
              No public pricing, contract duration terms, or revenue per mission has been disclosed
              for any customer segment, limiting financial diligence on customer economics.
