  - id: FE001
    title: Product architecture map — W-series hardware and ground stack
    type: stack
    layout: wide
    summary: >-
      The W-series is a six-layer stack from commercial rideshare launch through to ground pharmaceutical analysis, with
      vertical integration from bus through heatshield achieved at W-4.
    data:
      layers:
        - label: Commercial launch (SpaceX Transporter Rideshare)
          detail: >-
            All six W-series missions launched aboard SpaceX Falcon 9 Transporter rideshare from Vandenberg Space Force
            Base. Launch is the only externally sourced element in the current operational stack.
        - label: Orbital satellite bus
          detail: >-
            W-1/2/3 used Rocket Lab Photon (off-the-shelf). W-4/5/6 use Varda's own in-house bus providing solar power,
            attitude control, propulsion, and communications for 6-16 week orbital operations.
        - label: Pharmaceutical or government payload module
          detail: >-
            Two variants: (1) melt crystallization (W-1/2/3) for thermal cycling of small molecules; (2) solution-based
            crystallization (W-4+) mimicking terrestrial pharmaceutical lab technique. Government missions use
            sensor/material payload sections instead.
        - label: Reentry capsule (~90 cm diameter / <90 kg)
          detail: >-
            Separates from bus at deorbit burn. Survives Mach 25+ reentry at 18,000+ mph with 300W/cm² heat flux and
            18,000K+ plasma flow field. Parachute deploys after reentry.
        - label: C-PICA ablative heatshield (NASA-licensed, in-house from W-4)
          detail: >-
            Conformal Phenolic Impregnated Carbon Ablator. Originally developed at NASA Ames. Licensed via Tipping Point
            award. Manufactured by Varda in El Segundo from W-4 onward.
        - label: Ground recovery and pharmaceutical lab (El Segundo)
          detail: >-
            Southern Launch manages landing, recovery, and payload extraction at Koonibba Test Range. El Segundo 10,000
            sqft pharma lab provides pre-flight drug screening and post-flight sample analysis.
    approximationNotes: >-
      Layer boundaries reconstructed from official press releases and publicly available descriptions of W-series
      missions. Internal bus and capsule subcomponent detail is not publicly disclosed.
    claimRefs:
      - CE001
      - CE002
      - CE005
      - CE006
      - CE007
      - CE008
      - CE020
      - CE021
      - CE024
