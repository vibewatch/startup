      - number: '8.6'
        title: Diligence asks, evidence gaps, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The investment thesis for Varda rests on evidence that is directionally strong but quantitatively
              incomplete. Operational execution is well-documented; financial performance is almost entirely
              undisclosed. An investor entering at the Series D mark needs at minimum the following data-room items
              before underwriting conviction: actual revenue and growth rate by segment; gross margin and cost per
              mission; burn rate and exact cash position as of the most recent quarter; the Series D preference stack,
              including liquidation rights, anti-dilution provisions, and any ratchets; financial terms of the United
              Therapeutics collaboration; per-customer revenue concentration; and the AFRL task-order pipeline remaining
              under the $48 million IDIQ.


              The most significant evidence gap is pharmaceutical commercialization uncertainty. No space-manufactured
              drug has received FDA approval anywhere in the world as of June 2026. Scientific American reporting and
              independent scientists cited in 2026 coverage emphasized that the timeline from an orbital crystallization
              result to an approved commercial product is typically five to fifteen years, and that there is no
              straight-line path proven from orbital crystal data to drug sales. Varda's El Segundo pharmaceutical lab
              is designed to screen candidates before committing to orbital missions, which is operationally sound, but
              it does not accelerate the FDA regulatory clock. An investor crediting pharma IP as a significant
              component of Varda's $1.58 billion valuation needs to explicitly assume a multi-year timeline and discount
              accordingly.


              Kill criteria are knowable and should be monitored quarterly. A second regulatory hold that delays or
              cancels a confirmed AFRL task order would signal that the FAA license has not fully resolved the W-1
              regulatory pattern. A SpaceX rideshare price increase above $10,000 per kilogram would materially change
              mission economics for all non-defense missions. Departure of CEO Will Bruey without a pre-named successor
              would remove the primary relationship capital with AFRL, the FAA, and DoD program managers. And any
              down-round in a future equity raise would confirm that the $1.58 billion valuation overshot the evidence
              base at the time of the Series D.
            claimRefs:
              - CV037
              - CV038
              - CV039
              - CV040
