  - - Pharmaceutical processing payload module (melt and solution variants)
    - Heats, mixes, and cools drug compounds in microgravity to produce novel crystal forms or polymorphs
    - Drug compound supplied by customer; power from satellite bus; module designed and built by Varda
    - Crystal formation timing and structure unpredictable per expert commentary; processing parameter precision not publicly documented
  - - Reentry capsule (~90 cm / ~74 cm / <90 kg)
    - Contains and protects payload contents during Mach 25+ atmospheric reentry; separates from bus at deorbit burn
    - C-PICA heatshield, parachute system, and thermal management; all manufactured in-house from W-4
    - Single-point-of-failure if heatshield or parachute malfunctions; no public FMEA published; 6/6 success record is positive
