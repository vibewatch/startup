  evidenceGaps:
  - type: missing-source
    severity: material
    topic: pharmaceutical GMP certification and quality framework
    missingEvidence: Any public GMP, cGMP, or pharmaceutical manufacturing quality standard certification or process validation documentation for Varda's orbital processing payloads.
    whyItMatters: GMP certification is a regulatory prerequisite for clinical use of space-manufactured drugs, and its absence is the primary trust gap separating Varda's current operational proof from commercially viable pharmaceutical manufacturing.
    diligencePath: Request GMP certification status, process validation documentation, and quality management system design from Varda; ask which regulatory pathway (FDA, EMA, other) is planned for space-processed drug candidates and on what timeline.
    relatedQuestionRefs:
    - QE021
    - QE027
  - type: private-evidence-only
    severity: material
    topic: W-4 solution crystallization results
    missingEvidence: Published or disclosed results from the W-4 solution-based crystallization module, which processed a proprietary molecule but had not released results as of mid-2026.
    whyItMatters: W-4 introduced the new crystallization architecture; without published results, it is impossible to independently assess whether solution-based crystallization in orbit achieves comparable quality to the melt crystallization used on W-1/2/3.
    diligencePath: Request W-4 crystallization outcomes from Varda; determine whether results are subject to customer NDA or publication embargo.
    relatedQuestionRefs:
    - QE005
    - QE012
    - QE013
  - type: missing-source
    severity: material
    topic: satellite bus avionics architecture and software
    missingEvidence: Any public documentation of Varda's in-house satellite bus avionics design, software architecture, control system, or development tooling.
    whyItMatters: The in-house bus is the key vertical integration milestone, but its technical maturity cannot be assessed independently without avionics or software documentation; limited heritage (W-4 debut, W-5 validation) is the only verifiable evidence.
    diligencePath: Request avionics block diagram, software development process documentation, and anomaly history from Varda under NDA; ask for any independent third-party hardware qualification records.
    relatedQuestionRefs:
    - QE017
    - QE027
    - QE028
  - type: missing-source
    severity: moderate
    topic: developer and practitioner community signal
    missingEvidence: Varda has no public GitHub repository, software developer portal, API documentation, or developer-facing resources. As a hardware manufacturing company, its practitioner community engagement is through published peer-reviewed papers (npj Microgravity, AIAA proceedings) rather than software developer channels.
    whyItMatters: Absence of public engineering documentation and developer resources makes it harder to assess the software maturity of mission operations, payload interfaces, and ground systems.
    diligencePath: Request mission operations software architecture overview, payload interface control documents, and ground station network design; reference published AIAA and npj Microgravity papers as the available practitioner-community engagement signals.
    relatedQuestionRefs:
    - QE027
  - type: conflicting-data
    severity: minor
    topic: commercial pharma crystallization process control
    missingEvidence: Independent scientific assessment of whether Varda's current orbital crystallization protocols achieve sufficient process control for pharmaceutical commercial standards, given expert commentary that timing and crystal structure are difficult to guarantee.
    whyItMatters: The entire pharmaceutical royalty thesis depends on reliably producing specific novel crystal forms; if process control is insufficient, the probability of achieving patentable, clinically valuable polymorphs on a predictable basis is low.
    diligencePath: Request Varda's internal process control metrics, variability data, and polymorph hit-rate statistics per mission; engage independent pharmaceutical crystallography experts to assess public scientific data from W-1 and upcoming W-4 results.
    relatedQuestionRefs:
    - QE020
    - QE021
