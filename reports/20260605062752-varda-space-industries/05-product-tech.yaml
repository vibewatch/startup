- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Varda solution
  - Measurable benefit
  - Limitation
  rows:
  - - Pharmaceutical researcher seeking novel drug polymorphs
    - ISS experiments (long scheduling, astronaut-operated) or terrestrial crystallization (gravity-limited; sedimentation and convection disrupt crystal formation)
    - Screen compound in El Segundo lab; fly compound in W-series processing module; return crystals via reentry capsule; analyze post-flight
    - W-1 produced Form III ritonavir (metastable polymorph difficult on Earth); stability confirmed in peer-reviewed npj Microgravity paper (April 2026)
    - 6-16 weeks per mission; no GMP supply chain for clinical drug use yet; fewer than 12 missions per year currently
  - - DoD / AFRL researcher needing Mach 25+ hypersonic reentry test data
    - Dedicated bespoke hypersonic test vehicles (>$100M per flight, low cadence); ground wind tunnels (short duration, false atmospheric conditions)
    - Integrate payload into W-series reentry capsule; collect in-situ data during Mach 25+ reentry; recover hardware and data from Koonibba
    - OSPREE measured Mach 25+ plasma optical emissions in situ for the first time; Navy and Sandia retrieved sensors and material performance data unavailable from ground testing
    - Capsule follows fixed ballistic reentry trajectory; payload volume limited to ~tens of kg and 100W; government mission timing tied to SpaceX rideshare schedule
  - - Pharmaceutical company seeking to reformulate IP-extended drugs
    - Reformulation specialists (Halozyme, MannKind) using nebulizers, patches, nanoparticles, or other terrestrial drug-delivery chemistry
    - Process drug compound on multi-mission Varda runs to generate novel crystal forms; seek patent protection for improved polymorph; scale via seeding on Earth
    - United Therapeutics collaboration (May 2026) targets improved bioavailability, stability, and delivery for rare PAH treatments; CEO Rothblatt cites "billions of dollars in markets"
    - Royalty path requires 5-15 years from crystallization to approved drug; no space-manufactured drug in clinical trials as of mid-2026
  - - Repeat microgravity R&D customer seeking iterative experimentation
    - ISS flights with 12-24 month booking waits and astronaut dependency; limited alternatives for autonomous experimentation with material return
    - Book multiple W-series missions in advance (flights booked into 2027); iterate experimental protocols between missions; receive processed samples within weeks of reentry
    - Higher cadence than ISS alternatives; autonomous operation removes crewed-mission scheduling dependency
    - Still fewer than monthly missions currently; dual-pharmaceutical-and-government mission split means slot availability is shared
  notes: Benefit and limitation evidence drawn from official company sources, press releases, peer-reviewed publications, and independent journalist and scientific expert commentary.
