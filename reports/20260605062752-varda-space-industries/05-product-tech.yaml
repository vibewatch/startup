  claims:
  - id: CE001
    statement: Varda Space Industries describes its W-series platform as the first commercial satellite and reentry vehicle built specifically for the return of materials from orbit, enabling in-space manufacturing outside the ISS.
    type: company-claimed
    topic: platform-definition
    sourceRefs:
    - SE001
    - SE002
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QE001
    - QE028

  - id: CE002
    statement: The W-series spacecraft is a free-flying orbital satellite that operates autonomously without astronaut involvement, processes materials in microgravity, and returns them to Earth in a recoverable reentry capsule.
    type: company-claimed
    topic: platform-definition
    sourceRefs:
    - SE001
    - SE003
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QE001
    - QE004

  - id: CE003
    statement: W-1, W-2, and W-3 used Rocket Lab's Photon satellite bus; starting with W-4 (launched June 2025), Varda replaced Photon with its own in-house-designed satellite bus, completing full vertical integration.
    type: third-party-reported
    topic: satellite-bus-evolution
    sourceRefs:
    - SE007
    - SE020
    - SE021
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QE002
    - QE017

  - id: CE004
    statement: Varda's chief strategy officer stated in May 2026 that Varda and SpaceX are currently the only companies capable of launching experiments into orbit without astronaut operation, and returning them to Earth.
    type: company-claimed
    topic: competitive-differentiation
    sourceRefs:
    - SE019
    - SE018
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QE001
    - QE009

  - id: CE005
    statement: The W-series reentry capsule is approximately 90 centimeters in diameter, 74 centimeters tall, and weighs less than 90 kilograms — roughly the size of a large kitchen trash can.
    type: third-party-reported
    topic: capsule-dimensions
    sourceRefs:
    - SE017
    - SE001
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QE003
    - QE024

  - id: CE006
    statement: The W-series capsule reenters the atmosphere at speeds exceeding 18,000 miles per hour, Mach 25+, experiencing approximately 300W/cm² heat flux and 18,000K+ plasma temperature in the flow field.
    type: company-claimed
    topic: reentry-environment
    sourceRefs:
    - SE003
    - SE001
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QE003
    - QE009

  - id: CE007
    statement: Beginning with W-4, Varda manufactures the C-PICA heatshield entirely in-house at its El Segundo headquarters under a technology license and Tipping Point award from NASA's Ames Research Center; W-5 confirmed the in-house heatshield on a full mission.
    type: third-party-reported
    topic: cpica-in-house
    sourceRefs:
    - SE007
    - SE008
    - SE014
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QE006
    - QE017

  - id: CE008
    statement: NASA selected Varda for a Tipping Point award in 2023 to begin C-PICA production and flight testing, and licensed the heatshield material to Varda as the first commercial company to receive the license; NASA also provided technical manufacturing support.
    type: third-party-reported
    topic: nasa-cpica-license
    sourceRefs:
    - SE014
    - SE007
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QE006
    - QE025

  - id: CE009
    statement: The FAA issued Varda its first-ever Part 450 vehicle operator license at the W-4 mission in June 2025, valid through 2029, allowing W-series reentries without per-mission safety methodology resubmission for identical designs.
    type: third-party-reported
    topic: faa-part-450
    sourceRefs:
    - SE007
    - SE024
    - SE027
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QE007
    - QE023

  - id: CE010
    statement: The pharmaceutical processing payload module heats, mixes, cools, and performs other functions on drug compounds in microgravity; two module variants exist — a melt crystallization design for W-1 through W-3 and a solution-based crystallization design introduced at W-4.
    type: company-claimed
    topic: payload-module
    sourceRefs:
    - SE001
    - SE007
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QE004
    - QE005

  - id: CE011
    statement: Varda's W-1 mission in 2023-2024 produced Form III ritonavir — a metastable polymorph of the HIV antiretroviral drug that is difficult to generate on Earth — in a microgravity environment, making it the first commercial pharmaceutical manufactured in orbit.
    type: third-party-reported
    topic: ritonavir-production
    sourceRefs:
    - SE001
    - SE005
    - SE015
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QE011
