- id: section-dependencies
  title: Critical Dependencies and Operational Constraints
  body: |-
    Varda's platform depends on several external inputs that create potential schedule, cost, or operational risks beyond the company's direct control. The most foundational is SpaceX's Transporter rideshare program: every W-series mission has launched aboard SpaceX, making mission timing contingent on Transporter manifest schedules, which typically offer launches every two to three months. Varda holds no dedicated launch vehicle, meaning rideshare schedule changes, payload integration lead times, and SpaceX operational priorities can affect mission timing. The W-1 regulatory episode — where the capsule remained in orbit for eight or more months awaiting FAA and range coordination — demonstrated how regulatory and external-range dependencies can create material cash-flow and operational risk even when the spacecraft is functional.

    Southern Launch's Koonibba Test Range is the recovery infrastructure for W-2 through W-6, secured under a 20-reentry contract through approximately 2028 that provides schedule certainty. NASA's technical support and license for C-PICA reduces heatshield supply risk and was integral to the transition from external purchase to in-house production. The Rocket Lab Photon dependency was fully resolved at W-4. Scaling to the targeted monthly mission cadence will require supply chain scaling for bus and capsule production, workforce automation, and the demonstrated ability to operate multiple simultaneous orbital missions — a capability partially validated by W-4 and W-5 briefly coexisting in orbit.
