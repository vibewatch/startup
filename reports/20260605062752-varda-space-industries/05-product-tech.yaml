    - 20-reentry contract through approximately 2028 provides schedule certainty; weather and airspace conditions affect recovery timing
  - - FAA Part 450 vehicle operator license
    - Regulatory authorization for W-series reentry operations in the U.S. airspace framework
    - FAA regulatory review; license issued June 2025, valid through 2029
    - Covers identical reentry designs only; future design changes require resubmission; foreign reentry operations governed by Australian authorities
