  - id: TV006
    title: Final diligence asks table
    columns:
      - topic
      - missing evidence
      - why it matters
      - owner or diligence path
    rows:
      - - Revenue and growth rate by segment
        - Actual 2025 and 2026 YTD revenue broken down between defense testbed services, pharmaceutical payload
          processing, and any IP/licensing income.
        - The current valuation cannot be underwritten without knowing whether revenue is $20M or $80M annually; the
          implied multiple changes by more than 5x across that range.
        - CFO data-room pack; audited management accounts.
      - - Per-mission gross margin and cost structure
        - Gross margin per defense mission and per pharmaceutical mission; fully loaded cost including SpaceX rideshare,
          capsule manufacturing, operations, and recovery.
        - Determines whether the business can become self-funding at defensible cadence or requires perpetual subsidy
          from new equity raises.
        - Finance and operations diligence; request itemized cost bridge per mission type.
      - - Series D preference stack and cap table
        - Liquidation preferences, anti-dilution provisions, ratchets, MFN clauses, and any secondary-transaction
          restrictions from the Series D.
        - A founder-favorable preference stack or ratchet provision can substantially reduce effective entry valuation;
          new investors need to know where they stand in waterfall.
        - Legal data-room; financing documents from Series D counsel.
      - - United Therapeutics deal financial terms
        - Deal structure (flat service fee vs. take-rate vs. milestone payments), total contract value, and any equity
          or royalty components.
        - The United Therapeutics collaboration is the only named commercial pharma relationship; its structure
          determines whether pharmaceutical revenue is near-term or speculative.
        - Business development and legal data-room; collaboration agreement.
      - - AFRL task-order pipeline and remaining ceiling
        - Itemized breakdown of task orders issued and remaining headroom under the $48M IDIQ ceiling; MACH-TB 2.0
          delivery order value; pipeline for post-IDIQ DoD engagement.
        - Defense revenue is the only confirmed revenue stream; knowing how much IDIQ value has been consumed versus
          remaining determines the revenue bridge to any Series E or IPO.
        - Contract management data-room; USASpending.gov cross-reference.
      - - Burn rate, cash position, and financing assumptions
        - Current monthly cash consumption, Q1 2026 cash balance, and capital requirements under bull/base/bear mission
          cadence scenarios.
        - With an estimated $60–120M annual burn, the Series D runway is 24–36 months; any overrun to capex or cadence
          acceleration would require a Series E within the next 18 months.
        - Treasury and CFO diligence; request monthly cash flow statements and forward burn model.
    notes: Diligence asks are ordered by materiality; absence from the public record is normal for a Series D-stage private company.
    claimRefs:
      - CV007
      - CV014
      - CV015
