  - id: section-scenarios
    title: 'Scenario analysis: the bull case is compelling, the base case is borderline, the bear case is real'
    body: >-
      A revenue-multiple scenario framework is the most appropriate tool for Varda given the absence of confirmed
      revenue, margin, or cash-flow data. Scenarios are built from observable inputs — government contract ceiling,
      mission cadence potential, and pharma commercialization probability — rather than from financial models that
      would require private data.


      The bull case assumes that the AFRL IDIQ is renewed and expanded to multiple U.S. government agencies, that
      defense revenue reaches $150 million or more annually by 2028–2029 through additional IDIQ vehicles and allied
      government contracts via Southern Launch, and that at least one pharma drug partnership produces a commercially
      licensable polymorph within five years, triggering royalty revenue. Under these assumptions, Varda could achieve
      $200–300 million in blended revenue, and at a 15–20x forward multiple (consistent with a profitable defense
      services company growing at 30%+ annually), equity value could reach $2.5–4.0 billion. This represents 1.6–2.5x
      the current entry price, a credible but not exceptional venture return given execution risk.


      The base case assumes the AFRL IDIQ renews at a similar size, that defense revenue grows modestly to $70–100
      million annually through additional Navy and Sandia-type task orders, and that pharma IP remains pre-revenue
      through 2027–2028. At 15x forward revenue on $70–100 million, implied equity value is approximately $1.0–1.5
      billion — roughly at or slightly below the current entry price. This is the most dangerous scenario for new
      investors entering at the Series D mark: an execution outcome that meets management expectations but produces
      flat-to-negative returns because all the expected progress is already priced in.


      The bear case is triggered by any of three events: a regulatory hold on reentry licenses (the W-1 precedent
      shows this is not theoretical), a failed mission or payload loss that damages customer confidence, or a
      significant DoD budget reduction affecting AFRL testbed spending. Independent scientific experts quoted in
      Scientific American have described orbital manufacturing businesses as "currently a risky business" and noted
      that crystallization timing is "exceedingly difficult" to control — a fundamental scientific risk that has not
      been eliminated by Varda's operational track record. Under bear-case assumptions of mission slowdown and
      pharma stall, revenue stays below $40 million annually, and at 10–12x depressed-scenario revenue, equity value
      falls below $400–500 million, representing a loss of greater than 65% on current entry price.
