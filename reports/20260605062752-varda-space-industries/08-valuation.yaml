  - id: TV004
    title: Comparable valuation table
    enumerationScope:
      coverage: partial
      basis: >-
        This table covers the most decision-relevant public and private comparables with accessible June 2026 evidence.
        No single company is a pure-play comparable for Varda's combined defense-hypersonic-testbed and orbital-pharma
        profile. The comp set is intentionally mixed to bound the valuation range rather than provide a single anchor.
    columns:
      - comparable
      - metric
      - multiple / valuation / status
      - relevance
      - limitation
    rows:
      - - Rocket Lab (RKLB)
        - Market cap / TTM revenue
        - ~98x P/S ($66.5B market cap; ~$800M TTM revenue; Q1 2026 revenue $200.3M up 63.5% YoY)
        - Best public benchmark for vertically integrated commercial space company with growing defense exposure and no
          current profitability; government now 49% of $2.2B backlog.
        - Rocket Lab is a launch services company evolving into space systems; Varda does not launch and earns fees on
          reentry hardware and payload services. RKLB's scale and backlog size are much larger.
      - - Redwire (RDW)
        - EV / annualized revenue
        - ~11x ($4.2B market cap; Q1 2026 revenue $97M, annualized ~$388M)
        - Useful lower-bound anchor for a public space hardware company with growing defense and pharma-adjacent
          (SpaceMD) exposure; gross margin 26–27%.
        - Redwire is unprofitable and heavily acquisition-driven; its size and business mix diverge significantly from
          Varda's focused reentry platform.
      - - SpaceX (private)
        - Private valuation / estimated forward revenue
        - ~30–36x ($800B valuation; ~$22–30B estimated 2026 revenue)
        - Shows what private market investors will pay for scarce, vertically integrated space infrastructure with
          recurring revenue and dominant market position.
        - SpaceX's Starlink subscription economics, launch market dominance, and Starship development make it
          categorically different from Varda; the multiple is a ceiling, not a target.
      - - SpaceForge (private, UK)
        - Private valuation / Series A
        - £30M Series A led by NATO Innovation Fund (2025); implied valuation below Varda's current mark
        - Nearest European peer in space manufacturing with a direct in-orbit manufacturing thesis; NATO strategic
          backing validates the sector.
        - Much earlier operational stage than Varda (no orbital returns yet as of 2025); UK regulatory environment
          differs; no pharmaceutical focus.
      - - Defense hardware primes (Leidos, SAIC, L3Harris — weighted)
        - EV / revenue
        - 1–3x revenue (diversified defense prime baseline)
        - >-
          Floor reference: if Varda matures into a mission-services business rather than a platform, defense prime
          multiples provide a valuation floor.
        - >-
          Defense primes are mature, profitable, and diversified; applying prime multiples to an early-stage growth
          company is too conservative but usefully anchors the downside scenario.
    notes: Comparable multiples are Q1-Q2 2026 public market data and private round estimates; no single comp is a pure-play match for Varda.
