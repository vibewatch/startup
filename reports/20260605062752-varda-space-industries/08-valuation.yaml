  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - trigger
      - evidence threshold
      - transmission to thesis
      - action implication
    rows:
      - - Second regulatory hold on reentry permit
        - FAA or Air Force withholds approval for a confirmed AFRL task order mission for more than 60 days.
        - Demonstrates the FAA operator license has not resolved the W-1 regulatory pattern; destroys revenue timing
          and customer confidence.
        - Pause all new capital; initiate root-cause regulatory diligence with counsel before reengaging.
      - - SpaceX rideshare pricing exceeds $10,000/kg
        - Any publicly reported Falcon 9 Transporter price increase above $10,000/kg for calendar 2027 or beyond.
        - Increases per-mission cost materially above mission fee revenue for non-defense pharmaceutical payloads;
          compresses gross margin toward zero for pharma segment.
        - Require per-mission economics data room before any new capital; reassess pharma royalty timeline.
      - - CEO Will Bruey departure without named successor
        - Confirmed departure announcement without a named replacement CEO from existing management team.
        - Removes primary AFRL, FAA, and DoD relationship capital; increases execution and regulatory risk materially.
        - Withhold new capital until successor's qualifications and relationship continuity are verified.
      - - AFRL IDIQ non-renewal or significant reduction
        - AFRL publicly documents non-renewal after the current contract period or reduces task order cadence by more
          than 50%.
        - Eliminates the only confirmed multi-year revenue anchor; requires pharma or new contract to replace 60%+
          of confirmed revenue.
        - Reassess base case downward; model bear-case valuation immediately.
      - - Down-round in future equity raise
        - Future financing round prices Varda equity below the $1.58B February 2026 post-money valuation.
        - Confirms Series D valuation overshot the evidence base; triggers preference stack analysis and dilution review
          for all existing holders.
        - Conduct preference and anti-dilution analysis; evaluate whether new entry price creates a better risk-reward.
    notes: Triggers are defined as measurable observable events that independently impair the thesis; thresholds are set conservatively to allow early warning.
