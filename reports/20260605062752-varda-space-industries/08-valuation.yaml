  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - scenario
      - key assumptions
      - valuation / return logic
      - key risks
      - probability signal
    rows:
      - - Bull
        - AFRL IDIQ renewed at $80M+ ceiling; additional DoD/allied agency contracts bring defense revenue to $150M
          annually by 2029; United Therapeutics or a second pharma partner licenses a novel polymorph by 2030; SpaceX
          rideshare pricing stable.
        - At 15–20x forward revenue on $200–300M blended revenue, equity value $2.5–4.0B — 1.6–2.5x current entry
          price. Represents viable but not exceptional venture return given capital intensity.
        - Requires simultaneous execution across defense scaling, pharma IP, and uninterrupted regulatory access;
          probability of all three is lower than any individual component.
        - low-medium
      - - Base
        - AFRL IDIQ renews at similar $48M ceiling; defense revenue grows modestly to $70–100M via Navy, NASA, Sandia
          orders; pharma remains pre-revenue through 2027–2028; mission cadence reaches six per year.
        - At 15x forward revenue on $70–100M, equity value $1.0–1.5B — roughly flat to slightly below the current
          $1.58B entry price. Execution meets expectations but all upside is already priced in.
