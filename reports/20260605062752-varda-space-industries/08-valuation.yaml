  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - direction
      - argument
      - what would change the view
    rows:
      - - thesis
        - Six consecutive successful missions with increasing hardware sophistication is rare operational proof in
          commercial space.
        - A mission failure or sustained regulatory hold would directly contradict this strength signal.
      - - thesis
        - AFRL IDIQ and multi-agency DoD relationships (Navy W-5, NASA/Sandia W-6) show defense demand diversifying
          beyond a single contract.
        - If AFRL IDIQ lapses or DoD spending on hypersonic testbeds declines materially, the revenue anchor disappears.
      - - thesis
        - Unlimited FAA reentry license through 2029 removes the single largest regulatory bottleneck that stalled W-1
          for months.
        - Any new denial or suspension of reentry permits, or export-control complications from international launches,
          would recreate the W-1 scenario.
      - - anti-thesis
        - No space-manufactured drug has ever received FDA approval anywhere in the world, meaning the pharma IP thesis
          is a long-dated scientific bet with no commercial precedent.
        - FDA approval of a drug meaningfully enabled by orbital manufacturing would validate the category and force
          upward revision of the pharma revenue timeline.
      - - anti-thesis
        - Current valuation of $1.58B implies a revenue scale that the public evidence does not yet support at any
          verifiable multiple.
        - Disclosure of $80M+ in annual revenue with improving gross margin would make the current mark defensible on
          conventional metrics.
      - - anti-thesis
        - Single-launch-provider dependency on SpaceX for all six missions creates an unmitigated operational
          concentration risk.
        - Signature of a confirmed alternative launch provider agreement would eliminate this as a thesis-break risk.
    notes: >-
      Arguments are written as price-sensitive statements, describing what the current valuation already assumes rather
      than whether Varda is a good company in absolute terms.
