  evidenceGaps:
  - topic: revenue-and-unit-economics-disclosure
    type: private-evidence-only
    severity: blocking
    missingEvidence: >-
      No public disclosure of Varda's actual revenue by segment, gross margin per mission, per-mission cost
      structure, or total annual burn rate. Third-party estimates from Tracxn put 2025–2026 revenue at $40–60M but
      this is unverified and unconfirmed. Without audited management accounts or a data-room disclosure, any
      revenue-multiple underwriting relies on analytical estimates rather than confirmed figures.
    whyItMatters: >-
      The current $1.58B valuation is entirely dependent on implied multiples of unverified revenue. An investor
      cannot distinguish between a 15x multiple on $105M revenue (fair) and a 40x multiple on $40M revenue
      (stretched) without this disclosure. It is the single most important diligence item.
    relatedTableRefs:
      - TV006

  - topic: series-d-preference-stack
    type: private-evidence-only
    severity: blocking
    missingEvidence: >-
      No public disclosure of Series D liquidation preferences, anti-dilution provisions, ratchets, or MFN clauses.
      The effective downside protection and waterfall for new investors entering at or near Series D price cannot
      be assessed from public sources.
    whyItMatters: >-
      A founder-favorable preference or participation right could substantially reduce the headline valuation that
      applies to new investors. At $1.58B, even small differences in preference structure translate to tens or
      hundreds of millions in expected value in downside scenarios.
    relatedTableRefs:
      - TV006
    relatedQuestionRefs:
      - QV008
      - QV028
      - QV029
      - QV030

  - topic: pharma-commercialization-timeline
    type: missing-source
    severity: material
    missingEvidence: >-
      No public source provides an independent assessment of how close any Varda orbital crystallization result is
      to a commercially viable drug application. The United Therapeutics collaboration is framed as R&D, not
      manufacturing, and no pre-IND filing or FDA engagement related to any Varda-processed compound has been
      announced.
    whyItMatters: >-
      The bull-case scenario credits $2.5–4.0B valuation to pharma IP royalties. Without evidence that any compound
      from Varda's missions is on a viable clinical development path, this optionality must be deeply discounted.
      Investors assigning more than 5–10% probability weight to pharma royalties within five years should request
      a scientific data room.
    relatedTableRefs:
      - TV005
      - TV006

  - topic: afrl-task-order-itemization
    type: private-evidence-only
    severity: material
    missingEvidence: >-
      Individual task order values under the $48M AFRL IDIQ are not publicly itemized on USASpending.gov. The
      MACH-TB 2.0 delivery order value is also not public. Without these figures it is impossible to determine
      remaining contract headroom, per-mission defense revenue, or contract pace relative to the four-year
      IDIQ ceiling.
    whyItMatters: >-
      Defense contract revenue is Varda's only confirmed revenue stream. Knowing how much IDIQ value has been
      consumed versus remaining is critical for modeling the Series E or IPO runway.
    relatedTableRefs:
      - TV006

  - topic: spacex-dependency-mitigations
    type: missing-source
    severity: material
    missingEvidence: >-
      No public record of any evaluation, negotiation, or agreement with an alternative launch provider for W-series
      missions. All six missions used SpaceX Falcon 9 Transporter rideshare. Varda has not publicly disclosed
      contractual protections against SpaceX schedule delays, fleet standdowns, or pricing escalation.
    whyItMatters: >-
      Any SpaceX rideshare disruption creates a multi-month scheduling gap with no publicly described mitigation.
      For a valuation that relies on mission cadence scaling, unmitigated launch provider concentration is a
      material bear-case trigger that cannot be sized without diligence disclosure.
    relatedTableRefs:
      - TV005

  - topic: comparable-valuation-coverage-TV004
    type: enumeration-incomplete
    severity: material
    missingEvidence: >-
      No publicly traded pure-play orbital manufacturing company exists against which to benchmark Varda's $1.58B
      valuation. The comparables table (TV004) uses adjacent-segment proxies — Rocket Lab (launch/space systems),
      Redwire (space hardware/pharma), SpaceX (private space infrastructure), SpaceForge (private space
      manufacturing), and defense primes (mature floor) — none of which fully captures Varda's dual defense-testbed
      and pharma-IP model. No private market transaction data is available for direct space manufacturing M&A comps.
    whyItMatters: >-
      Without a direct public comp, the valuation multiple applied to Varda relies on inference from adjacent sectors
      with different margin profiles, scale, and revenue quality. The resulting uncertainty band is wide: applying
      RKLB multiples (98x) versus Redwire multiples (11x) to the same revenue figure produces a 9x difference in
      implied equity value. This gap cannot be closed without either better Varda financial disclosure or a sector
      comp that is financially more similar.
    relatedTableRefs:
      - TV004
