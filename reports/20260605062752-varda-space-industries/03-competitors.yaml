  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: competitor-pricing
    missingEvidence: Pricing per mission or per kilogram for any competitor — including Varda, Space Forge, ATMOS, Redwire SpaceMD, and Space Cargo Unlimited. The only public data point is a $25,000–$100,000/kg ISS range from industry references at the 2025 AIAA conference.
    whyItMatters: Without pricing data, it is impossible to assess whether Varda commands a premium over ISS-based platforms, whether ATMOS and Space Forge will compete on price, or whether Varda's dual-use cross-subsidy will enable below-cost pharma pricing to win market share.
    diligencePath: Request Varda's per-mission or per-kg pricing for pharmaceutical and defense missions; obtain comparable quotes from Redwire SpaceMD and Space Cargo Unlimited via direct inquiry; review any filed SEC or OFAC disclosures from public competitors.
    relatedQuestionRefs:
    - QP006
    - QP008
    - QP020
    relatedTableRefs:
    - TP003
  - type: enumeration-incomplete
    severity: material
    topic: competitor-customer-pipelines
    missingEvidence: Customer pipeline data for all competitors — number of contracts, pharmaceutical companies under LOI or MSA, anticipated mission manifests for 2026–2028. Redwire's SpaceMD, Space Cargo Unlimited's BentoBox, and ATMOS WORKS all have undisclosed customer rosters.
    whyItMatters: A competitor that has signed 10+ pharma MSAs while Varda has one publicly named partner would represent a meaningful customer concentration asymmetry and alter the competitive threat assessment.
    diligencePath: Request customer pipeline evidence for Varda (number of active pharma LOIs, stage, and expected first mission date); cross-check against competitor press releases and investor disclosures; request Redwire SpaceMD commercial pipeline through SEC filings.
    relatedQuestionRefs:
    - QP004
    - QP011
    - QP013
    - QP022
    relatedTableRefs:
    - TP001
    - TP002
  - type: conflicting-data
    severity: minor
    topic: space-forge-forgestar1-status
    missingEvidence: Confirmation of whether ForgeStar-1 has launched and returned successfully as of mid-2026, and what materials were manufactured. The 2025 Series A announcement cited a 2025 launch target, but no public confirmation of mission completion has been identified.
    whyItMatters: If ForgeStar-1 has successfully returned manufactured semiconductor or quantum materials, Space Forge's competitive maturity is higher than the pre-flight state assumed in this chapter's analysis, and the heritage gap with Varda narrows by one mission.
    diligencePath: Monitor Space Forge official communications, UK Space Agency announcements, and ESA launch manifests; contact Space Forge directly to confirm mission status.
    relatedQuestionRefs:
    - QP012
    relatedTableRefs:
    - TP001
  - type: private-evidence-only
    severity: moderate
    topic: c-pica-licensee-list
    missingEvidence: The current list of companies that have licensed NASA's C-PICA heat shield material for commercial deployment. NASA's public statement confirms multiple licensees, but the specific companies and their deployment timelines are not publicly available.
    whyItMatters: If ATMOS Space Cargo or Space Forge have licensed C-PICA, Varda's heat shield technology moat is lower than it would be if Varda were the only or primary commercial licensee. The extent of the moat depends critically on how many competitors have access to the same material.
    diligencePath: File FOIA request with NASA STMD for the C-PICA licensing register; review NASA Tech Transfer licensing announcements; request from Varda any non-compete or exclusivity clauses in their own C-PICA license agreement.
    relatedQuestionRefs:
    - QP016
    - QP018
    relatedTableRefs:
    - TP004

