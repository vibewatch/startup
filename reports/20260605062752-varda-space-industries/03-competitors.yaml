- id: section-status-quo-substitutes
  title: Status-Quo and Terrestrial Substitutes
  body: |-
    The most common alternative to any space-based manufacturing platform is choosing not to go to space at all. Pharmaceutical formulation scientists routinely use terrestrial contract research organizations for protein crystallization, polymorph screening, and formulation development at a fraction of the cost and time of an orbital mission. Standard industry methods — high-throughput crystallization robots, co-crystal screens, spray drying, hot melt extrusion, and supercritical fluid processing — address the overwhelming majority of drug formulation challenges. The commercial argument for space is that microgravity enables crystal structures or process conditions that are physically impossible or economically impractical to achieve on Earth. But until a commercially sold product has originated from orbital manufacturing, that argument remains theoretical from a risk-averse pharmaceutical customer's perspective. Varda's own Chief Revenue Officer confirmed at the 2025 AIAA conference that no space-manufactured product was on pharmacy shelves, and the AIAA's independent analysis noted that high costs and insufficient customer demand have historically thwarted every prior wave of space manufacturing projections. This is the most important adverse fact in the competitive picture: the status-quo substitute wins by default in every customer evaluation where the microgravity advantage has not been demonstrated for that specific molecule.

    For the defense hypersonic testbed segment, the primary status-quo substitutes are government-owned sounding rockets and wind tunnel facilities that approximate reentry conditions at lower cost per test point, plus government program offices that have historically commissioned bespoke dedicated test vehicles rather than using commercial capsules. These substitutes cannot fully replicate the aero-thermal-chemical environment of orbital reentry at Mach 25+, which is why the AFRL Prometheus-linked contract was awarded to Varda's commercial platform. An internal-build alternative — building a proprietary capsule internally — is theoretically available to defense primes but has not been pursued in the small-payload commercial reentry testbed segment as of 2026.
