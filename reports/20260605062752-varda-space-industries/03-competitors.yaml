- id: section-incumbents-adjacent
  title: Incumbent Reentry Vehicles and Adjacent Entrants
  body: |-
    Two incumbent actors provide reentry capability that pharmaceutical or defense customers might use as a partial substitute for Varda's dedicated free-flyer.

    Sierra Space (Louisville, CO) is developing the Dream Chaser spaceplane for ISS cargo delivery and return. Dream Chaser's runway landing subjects cargo to less than 1.5 g on recovery — significantly gentler than an ocean splashdown or ballistic capsule return — which is in principle better suited for fragile biological samples such as protein crystals and cell cultures. Sierra Space has partnered with Merck on a 3D-printed crystallization module designed to grow monoclonal antibody crystals during the inaugural Dream Chaser ISS mission. The module takes advantage of Dream Chaser's stable landing profile to preserve crystal integrity during return. However, Dream Chaser has not completed its first commercial flight as of mid-2026, carries substantially higher fixed overhead than Varda's small-capsule model, and is primarily an ISS cargo and crew transport rather than a dedicated pharmaceutical manufacturing platform. Sierra Space has raised approximately $2.4 billion in total funding but remains pre-revenue on its core spaceplane program.

    SpaceX Dragon CRS (Commercial Resupply Services) missions routinely return ISS-hosted pharmaceutical and biotech experiments to Earth. ISS National Lab-sponsored payloads returned on SpaceX CRS-33 in 2026 included multiple pharmaceutical, biotech, and regenerative medicine research projects. SpaceX Dragon is the most reliable and highest-cadence orbital return vehicle currently operational, but it is not a dedicated manufacturing platform: it lacks controlled in-flight manufacturing environments, dedicated processing modules, and the ability to operate independently from the ISS. Pharmaceutical customers using Dragon as a return vehicle are still dependent on ISS crew-time allocation and scheduling. The adverse risk Varda faces is not SpaceX competing today, but the possibility that SpaceX eventually offers dedicated manufacturing bays in a future capsule variant at marginal cost, leveraging existing vehicle infrastructure, range relationships, and launch frequency to compress Varda's per-mission pricing power.
