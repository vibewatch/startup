- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - moat claim
  - primary threat
  - severity
  - mitigation / diligence ask
  rows:
  - - Flight heritage — 6 orbital reentry missions (W-1 through W-6), more than any free-flyer peer
    - ATMOS, Space Forge, Space Cargo Unlimited accruing missions rapidly with 2025–2026 funding
    - Medium — lead exists today but narrows with each peer launch
    - Monitor peer launch cadence; Varda must maintain >= 8 missions/year to sustain heritage lead
  - - FAA Part 450 operator license — first commercial reentry operator licensed, 12–18 month regulatory lead
    - New entrants can apply; FAA may streamline licensing process; foreign operators use ESA / national paths
    - Low-Medium — creates meaningful lead time but not permanent barrier
    - Track FAA reentry licensing applications pipeline; monitor regulatory simplification proposals
  - - Dual-use revenue (pharma + defense) — defense subsidizes pharma R&D; unique among free-flyer peers
    - AFRL contract expiry / non-renewal; defense program office priorities shift; ATMOS WORKS building European defense book
    - High — pharma revenue pre-commercial; defense concentration risk in single contract
    - Request AFRL contract renewal terms and option exercise history; build evidence of pharma revenue diversification
  - - Vertical integration — in-house satellite bus, C-PICA heat shield, capsule, and mission operations from W-5
    - Competitors could license C-PICA from NASA (not exclusive); could buy or integrate commercial satellite buses
    - Medium — integration advantage real today; diminishes as C-PICA spreads and bus options multiply
    - Confirm NASA C-PICA licensee list; assess whether Space Forge or ATMOS have accessed the technology
  - - C-PICA heat shield — NASA-licensed ablative TPS used in W-5 and W-6
    - NASA has licensed C-PICA to multiple commercial providers per NASA's own statement; not exclusive to Varda
    - Medium — Varda's in-house manufacturing adds cost moat but the IP is not proprietary
    - Identify current C-PICA licensees; assess whether Varda's manufacturing know-how creates durable cost advantage
  - - Pharmaceutical customer lock-in — re-characterization cost if customer switches vehicles
    - Pharma customers could multi-home across Varda and ISS platforms simultaneously; no exclusivity confirmed
    - Medium-High — switching cost is real but not contractual; multi-homing risk is structural
    - Request evidence of exclusivity or minimum-mission commitments in United Therapeutics and other agreements
  - - Range access (UTTR, Koonibba Test Range) — Varda has operational relationships and licensed slots
    - New entrants negotiating own range access (ATMOS using European ranges); UTTR capacity shared with government users
    - Low-Medium — range access not fully proprietary; geographic diversity of new entrants reduces dependence on Varda's ranges
    - Confirm Koonibba agreement terms and volume commitments; assess UTTR slot availability for competing entrants
  notes: Severity ratings are qualitative assessments based on public evidence and competitive signaling. High severity does not imply imminent failure, only elevated diligence priority.
