  type: kpi
  layout: standard
  summary: Varda leads on flight heritage, regulatory position, and defense revenue. Competitive pressure is building from well-funded free-flyer peers and an incumbent ISS pharma operator with NASA anchor revenue. The most durable advantage is the combination of FAA license plus defense contract revenue, which no peer replicates.
