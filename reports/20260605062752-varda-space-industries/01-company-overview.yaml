  - type: private-evidence-only
    severity: material
    topic: backlog-mix
    missingEvidence: Named customer list, mission-by-mission booked backlog, and split of pharma versus defense economics across the public 2028 pipeline.
    whyItMatters: Backlog concentration determines whether Varda is primarily a defense test company with a pharma option or already a balanced dual-use platform.
    diligencePath: Request mission manifest, signed customer agreements, booking values, and segment revenue / backlog reporting by mission cohort.
