  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Current board roster, board observer rights, voting control, and founder / investor governance documents.
    whyItMatters: Without board and control visibility, chapter-one governance risk cannot be underwritten beyond generic founder dependence.
    diligencePath: Request the current board list, shareholder agreement, voting agreements, and board-consent package for the last financing.
    relatedQuestionRefs:
    - QO005
    relatedTableRefs:
    - TO002
    - TO003
  - type: private-evidence-only
    severity: material
    topic: 2026-round-terms
    missingEvidence: The actual 2026 round announcement, term sheet, lead investor identity, security type, and post-money cap table.
    whyItMatters: The latest valuation signal is external and database-derived; underwriting entry price and dilution risk requires primary financing documents.
    diligencePath: Obtain the most recent financing deck, executed term sheet, updated cap table, and any investor rights agreement from the company.
    relatedQuestionRefs:
    - QO024
    relatedTableRefs:
