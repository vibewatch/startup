  - type: private-evidence-only
    severity: moderate
    topic: c-pica-licensee-list
    missingEvidence: >-
      The current list of companies that have licensed NASA's C-PICA heat shield material for commercial deployment.
      NASA's public statement confirms multiple licensees, but the specific companies and their deployment timelines are
      not publicly available.
    whyItMatters: >-
      If ATMOS Space Cargo or Space Forge have licensed C-PICA, Varda's heat shield technology moat is lower than it
