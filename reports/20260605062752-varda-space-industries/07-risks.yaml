- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - risk
  - monitorable trigger
  - threshold / event
  - action implication
  rows:
  - - Regulatory — FAA license expiry or denial
    - FAA Part 450 license renewal timeline; FAA public docket for commercial reentry rule changes
    - No renewal application filed by Q1 2028, or FAA issues new environmental review requirements blocking 2029+ operations
    - Suspend capital deployment; require confirmed renewal before underwriting any post-2028 mission revenue
  - - Operational — capsule loss or reentry mission failure
    - Mission anomaly reports; launch/recovery press releases; government AFRL after-action disclosures
    - Any W-series mission results in uncontrolled reentry, payload loss, or capsule non-recovery
    - Full thesis re-evaluation; customer retention and DoD contract status must be confirmed before continuing
  - - Defense budget — AFRL Prometheus program reduction or MACH-TB 2.0 de-selection
    - USASpending.gov task order activity; Congressional appropriations for AFRL; DOGE efficiency review disclosures
    - AFRL IDIQ value reduction >20% from $48M ceiling, or Varda removed from MACH-TB 2.0 provider list
    - Immediate revenue model revision; pharma commercial maturity must be assessed as primary revenue fallback
  - - Launch dependency — SpaceX Falcon 9 extended standdown or price increase
    - SpaceX anomaly investigation timelines; Transporter rideshare manifest delays; published rideshare pricing
    - Fleet standdown >60 days affecting a scheduled Varda mission, or SpaceX raises rideshare rates >50%
    - Require Varda to disclose backup launch provider evaluation; factor extended timeline into financial model
  - - Pharma — United Therapeutics collaboration paused or IND delayed
    - United Therapeutics public announcements; SEC filings (UT is public); Varda press releases
    - UT publicly discloses collaboration pause, negative preclinical results, or no IND filing by end-2028
    - Royalty revenue thesis shifts from probable to speculative; discount pharma NPV contribution to near-zero
  - - People — CEO departure or C-suite attrition
    - Leadership announcements; LinkedIn profiles; board disclosures; investor communications
    - CEO Will Bruey departure, or any two of four named C-suite executives leaving within 12 months
    - Comprehensive re-underwriting; require board governance disclosure and succession charter before continued engagement
  claimRefs:
  - CR001
  - CR004
  - CR005
  - CR013
  - CR014
  - CR017
  - CR020
  - CR021
  - CR024
  - CR025
  - CR029
  notes: Triggers are designed to be observable from public sources. Private data-room access would provide earlier leading indicators for each risk category.

