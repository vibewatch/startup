- id: TR003
  title: Partner / dependency risk register
  columns:
  - dependency
  - counterparty
  - role
  - concentration
  - failure scenario
  - severity
  - mitigation
  - residual exposure
  rows:
  - - Launch vehicle
    - SpaceX (Falcon 9 Transporter rideshare)
    - Sole launch provider for all six W-series missions; 10+ missions contracted through 2028
    - Very high — 100% of missions to date
    - Falcon 9 fleet standdown, rideshare price increase >50%, or SpaceX schedule prioritization shifts
    - Critical — no alternative launch provider publicly identified; multi-month delay to any substitute
    - None confirmed — Varda has not disclosed any backup launch agreement
    - High — single-provider concentration with no mitigant currently public
  - - Primary reentry recovery site
    - Southern Launch / Koonibba Test Range (South Australia)
    - Recovery operations, range safety, community engagement, and payload return logistics
    - Very high — W-2 through W-6 all recovered at Koonibba; formal 20-reentry agreement in place
    - Range closure (community opposition, regulatory change, environmental event, weather season)
    - High — UTTR contingency requires separate DoD/FAA coordination; delays likely 3–6 months minimum
    - Contingency access to Utah UTTR under existing FAA license; active DoD relationship
    - Medium — contingency path exists but requires federal range scheduling and is not pre-approved for every mission
  - - Government anchor customer
    - AFRL / DoD Prometheus program + MACH-TB 2.0
    - Primary confirmed revenue source; $48M IDIQ through ~2028; MACH-TB 2.0 multi-year demand signal
    - Very high — functionally 100% of confirmed contracted revenue as of mid-2026
    - AFRL program restructure, hypersonics budget cut, DOGE-driven contract termination, or political reprioritization
    - Critical — revenue contraction with no near-term commercial pharma fallback at current maturity
    - MACH-TB 2.0 multi-year architecture; bipartisan $2.6B+ hypersonics appropriations; multiple DoD agencies as customers
    - Medium-high — bipartisan support is strong but program-level risk at AFRL is non-zero given DOGE reductions
  - - Pharma customer
    - United Therapeutics
    - First and only named pharmaceutical customer; multi-mission collaboration for rare pulmonary disease
    - Very high in pharma segment — no other named pharma customer as of June 2026
    - Collaboration pause, termination, or negative Phase 1 results eliminating commercial pathway
    - High — pharma revenue thesis and royalty upside require at least one customer advancing toward IND
    - Multi-mission structure creates long-term engagement; United Therapeutics is a financially strong rare-disease-focused company
    - High — full concentration in a single pharma partner; second pharma customer not yet disclosed
  - - Legacy satellite bus supplier
    - Rocket Lab (Photon bus)
    - Satellite bus for W-1 through W-3 missions; eliminated by Varda's in-house bus at W-4
    - None (actively mitigated) — W-4 through W-6 use Varda's own bus
    - Bus supply disruption (historical only); now moot
    - Low — risk fully mitigated by vertical integration completed at W-4
    - Full vertical integration of satellite bus achieved; Rocket Lab dependency eliminated
    - Low — residual only if Varda reverts to third-party bus for cost or schedule reasons
  - - Heatshield material technology licensor
    - NASA Ames Research Center (C-PICA license and Tipping Point award)
    - Technology licensor and technical support provider for C-PICA ablative heatshield
    - Medium — Varda now manufactures C-PICA in-house but remains on NASA's license and Tipping Point grant
    - NASA budget cuts or technology license revision affecting C-PICA commercialization rights
    - Medium — license revocation unlikely given mutual benefit; budget risk is real under current federal austerity
    - In-house manufacturing capability established; technical knowledge transferred; NASA incentivized by success
    - Low-medium — license renewal and Tipping Point relationship require ongoing regulatory good standing
