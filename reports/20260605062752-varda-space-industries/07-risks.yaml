- id: TR002
  title: Operational / quality / security risk register
  columns:
  - failure mode
  - likelihood
  - severity
  - mitigation maturity
  - residual exposure
  - unresolved gap
  rows:
  - - Heatshield integrity failure or parachute anomaly during reentry (capsule loss)
    - Low — 6/6 successful missions; C-PICA proven in orbit
    - Critical — total payload loss, mission failure, DoD data loss, potential public safety impact
    - High — in-house C-PICA manufacturing, mission assurance program, multi-mission track record
    - Medium — low-probability but catastrophic; no redundant reentry vehicle exists
    - No public disclosure of post-flight heatshield inspection findings; anomaly history not disclosed
  - - Orbital pharmaceutical processing failure (contamination, incomplete crystallization, degraded API)
    - Medium — process validated conceptually on W-1; solution-based processing new on W-4
    - High — mission revenue not recognized; customer confidence damaged; IND timeline set back
    - Medium — Varda's in-house CSO leads pharmaceutical science; collaboration with Improved Pharma confirmed
    - High — GMP compliance framework undefined; no quality system publicly described for orbital batches
    - No public disclosure of pharmaceutical quality metrics for W-4 through W-6 missions; batch reproducibility unconfirmed
  - - Launch vehicle anomaly on SpaceX Falcon 9 rideshare
    - Low-medium — SpaceX Falcon 9 has >99% success rate but had a 47-day standdown in 2023
    - High — mission loss, schedule delay of 6–12 months minimum to next available slot
    - Low — single-provider dependency; no publicly confirmed backup launch agreement
    - High — concentration in one provider with no mitigation path currently disclosed
    - No public evidence that Varda has evaluated alternative launch providers (RocketLab, Exolaunch, Rocket Factory Augsburg) for W-series missions
  - - Koonibba Test Range unavailability (weather, community opposition, capacity saturation)
    - Low-medium — range has operated successfully for W-2 through W-6 but is rural and weather-sensitive
    - Medium — mission delayed; Utah UTTR contingency requires separate DoD coordination
    - Medium — 20-reentry agreement in place; Southern Launch managing capacity growth
    - Medium — single-site primary recovery; SpaceWorks also booking Koonibba in 2026, increasing saturation risk
    - No public information on Koonibba weather-delay frequency, scheduling queue, or DoD-Varda UTTR contingency protocol
  - - Cybersecurity breach or IP theft affecting classified hypersonic payload data
    - Low — government payload security protocols apply; Varda operating within DoD framework
    - High — data breach could lead to contract termination, ITAR violation, and reputational damage
    - Unknown — Varda has not publicly disclosed any cybersecurity certifications or incident history
    - High — entirely opaque from public record; classified context means independent assessment impossible
    - Confirm whether Varda holds DoD security clearance and any facility security clearance; no public incident history assessed
  - - Scale-up manufacturing quality failure (increased defect rate as capsule production ramps to 10+/yr)
    - Medium — hardware manufacturing is accelerating; new Mattel campus buildout underway
    - Medium — delayed deliveries, cost overruns, or quality escapes would erode defense customer confidence
    - Medium — in-house production proven at small scale; NASA Tipping Point supported heatshield manufacturing ramp
    - Medium — manufacturing scale-up to 10+ capsules/year is aspirational as of mid-2026; not yet demonstrated
    - No public disclosure of yield rates, defect rates, or production throughput at current scale
