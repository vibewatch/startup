  evidenceGaps:
  - topic: faa-license-renewal-pathway
    type: missing-source
    severity: blocking
    missingEvidence: No public disclosure of FAA engagement on Part 450 license renewal beyond 2029, renewal application timeline, or whether any new environmental assessment has been initiated for post-2029 operations. The license expires during Varda's primary pharmaceutical commercialization window.
    whyItMatters: A gap or delay in license renewal would halt all U.S.-origin reentry operations and would constitute a thesis-break event. Investors cannot underwrite 2030+ mission revenue without confirmed renewal pathway.
    relatedTableRefs:
    - TR001

  - topic: pharmaceutical-quality-and-gmp-compliance
    type: missing-source
    severity: blocking
    missingEvidence: No public disclosure of Varda's pharmaceutical quality system, batch reproducibility data, contamination controls, or any pre-IND engagement with FDA. Varda has not disclosed any interaction with FDA's Emerging Technology Program.
    whyItMatters: Without GMP compliance documentation, United Therapeutics cannot file an IND, and the royalty revenue stream that supports Varda's long-run valuation cannot be underwritten. This gap is the single largest risk to the pharma thesis.
    relatedTableRefs:
    - TR001
    - TR002

  - topic: spacex-backup-launch-provider
    type: missing-source
    severity: material
    missingEvidence: No public disclosure of any evaluation or negotiation with alternative launch providers (Rocket Lab, ISRO, Arianespace, RFA, or others) for W-series missions. Varda has not disclosed contractual protections against SpaceX schedule delays or pricing increases.
    whyItMatters: SpaceX exclusivity is the primary operational single point of failure. Without a disclosed backup, any Falcon 9 fleet standdown creates a multi-month schedule gap with no mitigation.
    relatedTableRefs:
    - TR003

  - topic: afrl-task-order-pipeline-detail
    type: private-evidence-only
    severity: material
    missingEvidence: Individual task order values under the $48M IDIQ are not disclosed on USASpending.gov at the task-order level that would confirm per-mission revenue or remaining unearned backlog. MACH-TB 2.0 delivery order value is also not public.
    whyItMatters: Defense mission revenue is the only confirmed revenue stream. Without task-order-level disclosure, the revenue run-rate and backlog coverage for 2026–2028 cannot be independently verified.
    relatedQuestionRefs:
    - QR025
    relatedTableRefs:
    - TR003
    - TR005

  - topic: ceo-succession-and-board-governance
    type: private-evidence-only
    severity: material
    missingEvidence: No public disclosure of board composition, CEO employment contract terms, equity vesting schedule, non-compete provisions, or board-approved succession plan. Key-person concentration in Will Bruey cannot be structurally assessed without these documents.
    whyItMatters: CEO departure without a succession plan would be a thesis-break trigger; investors need board governance evidence before committing to post-Series D capital at $1.58B valuation.
    relatedQuestionRefs:
    - QR020
    - QR027
    relatedTableRefs:
    - TR004
    - TR005

  - topic: litigation-enforcement-and-ip-disputes
    type: missing-source
    severity: material
    missingEvidence: No public record of outstanding litigation, regulatory enforcement actions, or IP disputes involving Varda Space Industries has been identified. As a private company with classified government contracts and novel pharmaceutical IP activity, undisclosed legal exposure cannot be ruled out.
    whyItMatters: Undisclosed litigation or enforcement actions could impose financial liability, restrict operations, or create IP ownership conflicts that invalidate the royalty revenue thesis. Standard legal diligence requires a representation letter and legal search.
    relatedQuestionRefs:
