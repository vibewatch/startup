  type: matrix
  layout: standard
  summary: Maps Varda's principal risks by likelihood (rows) and impact (columns) as of mid-2026. High-likelihood risks are concentrated in financial and partner categories; high-impact risks span regulatory, operational, and execution dimensions. The upper-right quadrant (high likelihood, critical impact) is minimized relative to 2023 by virtue of the FAA operator license and six consecutive mission successes.
  approximationNotes: Likelihood and severity assessments are qualitative, based on public evidence. Internal risk registers, actuarial models, and classified DoD assessments are not reflected.
