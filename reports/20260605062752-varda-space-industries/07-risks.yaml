tables:
- id: TR001
  title: Regulatory / legal risk register
  columns:
  - rule / license / case
  - jurisdiction
  - status
  - likelihood
  - severity
  - mitigation
  - residual exposure
  - diligence path
  enumerationScope:
    coverage: partial
    basis: >-
      Rows cover all identified regulatory and legal obligations that publicly bear on Varda's
      reentry operations and pharmaceutical development as of June 2026. Non-public litigation,
      undisclosed regulatory correspondence, and classified DoD compliance requirements are not
      included. Ordered by descending severity.
  rows:
  - - FAA Part 450 vehicle operator license expiration (2029)
    - U.S. Federal (FAA)
    - Active through 2029; renewal process and standards not yet defined
    - Medium — regulatory environment could tighten or FAA capacity constrained
    - Critical — expiration without renewal halts all reentry operations
    - Part 450 framework institutionalized; Varda has first-mover precedent; active FAA engagement recommended
    - High — no publicly confirmed renewal pathway or timeline; must be addressed before 2028
    - Request FAA correspondence on 2029 renewal timeline; confirm whether any post-2029 license applications have been initiated
  - - FAA pre-launch reentry license requirement (April 2024 rule)
    - U.S. Federal (FAA)
    - Active; new rule requires license in hand before launch
    - Low — Varda already compliant under current operator license
    - High — non-compliance prevents launch
    - Operator license covers all W-series capsules through 2029; mitigated for current fleet
    - Low for current missions; medium for any next-generation capsule design requiring new certification
    - Confirm whether next-gen vehicle (post-W-series) will require a new type certification or an amendment to existing operator license
  - - DoD range access (Utah Test and Training Range)
    - U.S. Federal (DoD / Air Force)
    - Available; historically used for W-1 (2024) only; Australia now primary
    - Medium — DoD range priority missions could displace Varda
    - High — Utah denial in 2023 stranded W-1 for eight months
    - Southern Launch Koonibba is now the primary site; UTTR is contingency only
    - Medium — contingency dependency on DoD goodwill remains if Australia site becomes unavailable
    - Request written range access agreement or MOU with UTTR for contingency reentries; confirm priority level relative to DoD primary missions
  - - Australian CASA and SASIC reentry regulatory compliance
    - Australia (CASA; South Australian Space Industry Centre)
    - Active and proven; W-2 through W-6 all reentered at Koonibba without reported regulatory violations
    - Low — relationship established; Australian regulatory environment is commercially supportive
    - Medium — any CASA airspace rule change or Indigenous land-use dispute at Koonibba could disrupt primary site
    - Southern Launch manages regulatory relationship; long-term community engagement with Koonibba Aboriginal Corporation
    - Medium — external regulatory jurisdiction; no formal bilateral treaty for routine U.S. commercial reentry to Australia
    - Request copy of Southern Launch–Varda reentry framework agreement; confirm CASA approval coverage through 2028
  - - FDA Good Manufacturing Practice (GMP) and CMC compliance for pharmaceutical payloads
    - U.S. Federal (FDA)
    - No precedent established; no space-manufactured drug has received FDA approval
    - Medium — FDA has not published guidance; Varda must pioneer pathway
    - High — absence of GMP compliance framework blocks IND filing for any United Therapeutics drug candidate
    - Varda has Series C-funded pharma crystallization lab; engagement with FDA not publicly confirmed
    - High — undefined regulatory pathway; no public evidence of pre-IND engagement with FDA
    - Request evidence of any FDA pre-IND meeting, Emerging Technology Program designation, or FDA correspondence on GMP compliance for microgravity-produced batches
  - - ITAR / export control compliance for DoD hypersonic payload data
    - U.S. Federal (State Department / DoD)
    - Ongoing; all Prometheus missions carry controlled technical data
    - Low — Varda operates entirely within U.S. government framework; compliance appears embedded
    - Medium — violation would terminate DoD contracts and potentially result in civil or criminal penalties
    - Defense customer manages classification; Varda operates under government-issued security guidance
    - Medium — compliance obligation is structural but opaque; cannot be independently verified from public record
    - Request confirmation of ITAR classification level for all active DoD payloads; confirm Varda has a classified facility authorization (FCL) if required
  - - IP ownership and freedom-to-operate for orbital pharmaceutical formulations
    - U.S. and international (USPTO; EPO)
    - No space-origin drug patent publicly issued as of June 2026; Varda has not disclosed patent filings
    - Medium — if crystallization results are not patentable or already covered by prior art, IP thesis collapses
    - High — without patent protection, the royalty-revenue stream that justifies pharmaceutical investment has no economic basis
    - Series C lab investment targets IP pipeline generation; United Therapeutics collaboration structured around novel formulation research
    - High — no public patent filings identified; freedom-to-operate analysis not publicly available
    - Request patent portfolio disclosure; confirm whether any provisional or issued patents cover W-1 ritonavir Form III or subsequent formulations
