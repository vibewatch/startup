company:
  name: Varda Space Industries
chapter:
  number: 7
  title: Risks
  summary: |-
    Varda Space Industries faces a distinctive risk profile shaped by its position at the intersection of
    commercial space hardware, pharmaceutical development, and U.S. national security contracting. The
    most material risks in mid-2026 are: (1) regulatory concentration — Varda's entire reentry business
    depends on a single FAA Part 450 license (expires 2029) and ongoing DoD range access, with a
    documented history of license denials and orbital delays for W-1; (2) SpaceX dependency — all six
    missions have used SpaceX Falcon 9 rideshare with no publicly confirmed alternative launch provider;
    (3) defense budget concentration — the $48M AFRL Prometheus IDIQ and MACH-TB 2.0 selection account
    for substantially all confirmed revenue, and DOGE-linked FY2026 Air Force budget reductions introduce
    meaningful contract renewal risk; (4) pharmaceutical commercialization uncertainty — no space-
    manufactured drug has yet received FDA approval anywhere, and United Therapeutics is the sole named
    pharma customer as of June 2026; and (5) key-person dependence on CEO Will Bruey, whose SpaceX
    pedigree and regulatory relationships have been indispensable. Mitigating these risks: six consecutive
    successful missions, an FAA operator license authorizing unlimited reentries through 2029, Southern
    Launch's confirmed 20-reentry agreement, and growing bipartisan defense support for hypersonics.
    Kill criteria exist for each category and are addressable through normal diligence data-room requests.

