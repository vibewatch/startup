  - id: FI001
    title: 收入模型桥——从客户活动到毛利
    type: flow
    summary: >-
      展示客户承诺如何流经 Varda 的轨道平台，形成收入和潜在毛利。防务与制药客户在 W-series 返回舱上预订任务舱位；返回舱搭乘 SpaceX 拼车发射，在轨作业，并经 Southern Launch
      回收；收入在任务订单完成或服务交付时确认。IP 版税是远期下游节点，取决于药物商业化。
    approximationNotes: 流程展示结构性收入逻辑，不是已确认金额。节点数值未披露。防务任务费用按 IDIQ 上限估计；制药任务费用和版税完全未披露。
    claimRefs:
      - CI001
      - CI002
      - CI008
      - CI011
      - CI012
      - CI021
      - CI032
    data:
      nodes:
        - id: n1
          label: 政府 / DoD 客户（AFRL Prometheus、Navy、Sandia、NASA）
          detail: 在 IDIQ 或项目协议下预订任务舱位；数据 / 材料交付后支付任务订单
        - id: n2
          label: 制药客户（United Therapeutics 及未来客户）
          detail: 按任务支付服务费，和 / 或按药物活性成分（API）商业价值支付分成；IP 合作条款未披露
        - id: n3
          label: SpaceX Falcon 9 拼车发射（~$7,000/kg；估计 $2-4M/任务）
          detail: 主要可变成本输入；Varda 已签约 2028 年前 10+ 次 Transporter 清单任务
        - id: n4
          label: W-Series 轨道制造 / 测试
          detail: W-series 航天器在轨执行制药加工或托管高超音速测试平台载荷；C-PICA 热防护罩在 El Segundo 自研制造
        - id: n5
          label: 再入与回收（Southern Launch、Koonibba Test Range、South Australia）
          detail: 返回舱以 Mach 25 再入；数小时内回收；数据和材料返还客户
        - id: n6
          label: 任务费收入（防务任务订单 + 制药服务费）
          detail: 交付时确认收入；防务费用按 IDIQ 估计为 $10-15M/任务；制药费用未披露
        - id: n7
          label: IP / 版税收入（远期、收入前）
          detail: 新型药物多晶型的专利版税；截至 2026 年中确认收入为零；只有药物进入商业销售才会有实质意义
  - id: FI002
    title: 单位经济模型桥——从任务收入到估计毛利
    type: flow
    summary: 展示单次 W-series 任务的结构性单位经济模型，识别已确认和估计成本节点，以及业务要达到正贡献毛利必须补上的毛利缺口。关键输入要么是估计，要么未披露。考虑到合同支持的收费结构，防务任务比制药任务更接近正贡献。
    approximationNotes: 所有财务数值均为估计或未披露。发射成本来自公开的 SpaceX 拼车价格和公开载荷质量。COGS 目标来自 CEO 访谈；当前实际值未披露。毛利节点反映成本节点后的残差——在当前成本结构和早期任务节奏下可能为负。
    claimRefs:
      - CI008
      - CI010
      - CI014
      - CI025
    data:
      nodes:
        - id: un1
          label: 任务收入（防务估计 ~$10-15M；制药未披露）
          detail: 单次任务主要现金流入；政府 IDIQ 任务订单已有合同；制药任务费用未公开披露
        - id: un2
          label: SpaceX 拼车发射成本（估计 ~$2-4M，由 $7,000/kg × ~300-500 kg 推断）
          detail: 公开 SpaceX Transporter 定价；Varda 载荷质量按媒体来源估计；最大已披露可变成本驱动项
        - id: un3
          label: 航天器硬件与制造 COGS（目标 $2.5M；当前实际未披露）
          detail: CEO 引用的满月度节奏目标；按早期节奏经济性，FY2025 实际成本可能更高；制造学习曲线是核心投资逻辑假设
        - id: un4
          label: 任务运营（靶场费用、回收物流、人员、Southern Launch）
          detail: Koonibba Test Range 费用、现场物流、载荷集成；金额未公开披露
        - id: un5
          label: 单次任务毛利（估计；当前阶段正负不确定）
          detail: 发射 + 硬件 + 运营后的残差；按合同价值，防务任务为正；制药任务在早期节奏下可能为负或盈亏平衡
        - id: un6
          label: IP / 版税上行（远期；当前确认收入为零）
          detail: 不计入单次任务毛利；代表需要药物商业化才能兑现的长期可选性
