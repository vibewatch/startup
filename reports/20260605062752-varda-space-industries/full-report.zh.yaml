      - number: '6.4'
        title: 留存、复用与客户满意度证据
        blocks:
          - type: paragraph
            body: >-
              从公开证据看，政府板块的重复使用是最强的持续性信号。AFRL Prometheus 项目现在已资助 Varda 连续四次任务：W-2（OSPREE，2025 年 3 月）、W-3（AFRL 载荷，2025 年 5
              月）、W-5（U.S. Navy 载荷，2026 年 1 月）和 W-6（AFRL/Sandia/NASA 载荷，2026 年 5 月）。W-6 的多机构性质——AFRL、Sandia National
              Laboratories 和 NASA 同时嵌入载荷——说明政府客户广度在单次任务内扩张，而不是收缩。$48 million、为期四年的 AFRL 合同提供了到 2028 年的前置签约需求，MACH-TB 2.0
              入选又增加了第二个多年期政府框架。VP Dave McFarland 公开表示，W-6 数据「如果通过传统测试方法收集，需要数年」，这传递出政府客户看到的强价值主张。Varda 总裁在 2025
              年底表示，公司已为客户预订了深入 2027 年的飞行，为两个板块的确认前置订单提供了间接指标。


              药品板块的重复使用由 W-1 → W-3 → W-4 这一串未披露客户药品任务，以及 United Therapeutics 明确的多任务承诺支撑。不过，公开来源中没有正式留存指标：Varda 没有披露
              NRR、GRR、客户数、队列流失、合同续约率，或任何板块的单个客户满意度得分。运营可靠性的替代指标是所有 W 系列任务 6/6 的舱体回收率——截至 2026
              年中，没有其他商业再入提供商达到这一记录。公开来源中也没有出现客户投诉、任务失败或合同终止。
