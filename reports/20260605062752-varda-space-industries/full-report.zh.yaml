      - number: '2.4'
        title: 增长驱动因素与市场成立条件
        blocks:
          - type: paragraph
            body: >-
              Varda 制药市场板块的核心增长使能因素，是过去十年发射经济性的结构性变化。SpaceX 现在每两到三天发射一次 Falcon 9，使入轨变得可预订、可预测，也比以往任何时代更便宜。这个节奏让 Varda
              能提前数年安排任务，并把轨道 R&D 纳入标准制药开发时间表；在包机飞行需要五年提前期的时代，这不可能做到。CEO Will Bruey 提出的
              Varda「七块多米诺理论」把发射成本下降、制药临床试验和持续任务需求连起来：一旦在轨处理过的分子进入临床试验，客户将在整个开发项目期间需要反复制造批次，形成一个复利式需求引擎，性质上不同于卫星星座建设。


              单克隆抗体市场以 12.7 percent CAGR 增长、到 2035 接近 $1 trillion，会放大这一驱动因素：即便 MAb 管线中只有一小部分因微重力获得制剂优势，绝对机会也会很大。Varda 从
              W-5 起内部制造 C-PICA 热盾，并垂直整合卫星 bus、胶囊和任务运营；这些运营驱动因素可降低单次任务成本，并支撑管理层公开瞄准的月度再入节奏。


              防务侧，Golden Dome 是近期最重要的需求驱动因素。白宫 Golden Dome 倡议包含 $15.7 billion 太空重点 预算调和资金；Space Force 预算请求将同比增长 40
              percent，释放出持续大规模高超音速测试需求信号，而 Varda 的固定成本商业再入胶囊正好独特适配这类需求。NASA 有意把 C-PICA
              授权给多家商业供应商，进一步降低整个行业的长期基础设施成本；这会间接支持未来竞争者进入，但眼下也验证了技术价值。
