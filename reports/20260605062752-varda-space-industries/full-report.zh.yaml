  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              Varda 的运营模式比几乎任何其他商业航天初创公司都更吃监管，因为每个任务周期都需要 FAA（再入飞行器运营商许可证）、DoD（Utah Test and Training Range
              靶场访问）和澳大利亚主管机构（CASA 与 South Australian Space Industry Centre，负责 Koonibba Test Range 运营）事先批准。2023–2024 年
              W-1 事件是最关键的反向数据点：由于 FAA 拒绝向 Varda 发放再入许可证、U.S. Air Force 拒绝开放靶场访问，舱体在轨滞留八个月，药物晶体留在轨道上，投资者面对任务完全损失的可能性。FAA
              明确表示 Varda 未能证明符合适用法规。Payload Space 和 CNBC 的公开报道实时记录了这一事件，Aerospace America 的「Permission to
              Launch」专题则把它变成整个商业再入行业的警示案例。FAA 随后修改规则：自 2024 年 4 月起，任何再入飞行器若没有事先取得再入许可证，不得从美国领土发射。


              缓释措施实质存在，但有条件。Varda 现在持有 FAA Part 450 飞行器运营商许可证（为 W-4 签发），覆盖到 2029 年的无限次再入——这是美国商业航天史上第一张这类一揽子授权。AIAA 和
              Aviation Week 都把它报道为真正的监管里程碑。不过，许可证有固定到期日，任何续期都需要证明持续合规，为新着陆点开展额外环境评估，并处理 FAA 到 2028–2029
              年可能演进出的规则。药品载荷运营叠加第二层监管：FDA 从未批准过在轨制造药品，微重力来源批次在良好生产规范（Good Manufacturing
              Practice）下如何满足化学、制造与控制（CMC）合规，路径仍未定义。ITAR 出口管制适用于所有 DoD 机密高超声速载荷，形成持续合规义务；如果保密级别变化，可能导致任务延误或客户受限。
