        - 单个载荷成本、数据密级和 W-3 具体科学结果未公开详述；政府数据可能不会公开
      - - U.S. Navy
        - 政府 / 国防
        - Prometheus 项下，借 W-5 返回舱采集高超音速再入数据
        - 生产等效（Prometheus 项下签约、已飞行、已回收）
        - W-5 返回舱搭载专用 Navy 载荷；AFRL PR 提到「精准着陆和快速回收……用于飞行后即时分析」；W-5 被描述为 2026 年首次再入
        - 除 MACH-TB 2.0 框架外，具体数据产出、科学目标和任何后续 Navy 订单均未披露
      - - Sandia National Laboratories
        - 政府 / 研究
        - TPS 模型验证——带嵌入式传感器的鼻锥瓦随 W-6 飞行，记录飞行中温度，并与计算机模型预测对照
        - 生产等效（鼻锥瓦成功回收并带回真实飞行数据）
        - Varda PR W-6 确认「鼻锥瓦嵌入了小型传感器，用于记录再入环境温度，以便将真实世界数据与高保真性能数据对比」；VP McFarland 表示「若靠传统测试方法，这些数据需要数年才能收集」
        - 具体 TPS 模型改进结果和 Sandia 后续参与尚未公开
      - - NASA Ames Research Center
        - 政府 / 伙伴
        - TPS 替代生产方法验证——两块带仪器的肩部瓦（eChar 技术）随 W-6 飞行，提供新的热数据集
        - 生产等效（瓦片成功回收，并为 NASA 研究人员带回新的 TPS 数据集）
        - Varda PR W-6 确认 NASA Ames 瓦片采集了飞行中热数据；NASA 的 C-PICA 技术许可和 Tipping Point 奖项从 W-4 起建立持续合作
        - NASA 一部分是技术许可方，一部分是客户；公开来源未完全厘清合同客户收入与合作研究支持的边界
      - - United Therapeutics Corporation (UTHR)
        - 制药
        - 多任务微重力结晶小分子肺部疾病药物（PAH 治疗）
        - 高级试点（2026 年 5 月签署多任务协议；尚未完成任务）
        - >-
          双方联合 PR；SpaceNews 报道；CEO Rothblatt 在 Beyond Earth Symposium（2026 年 2 月）及合作宣布时公开表述；MIT Technology Review
          报道；明确提到「多次任务」
        - 尚未完成任务；未公布晶体数据；财务条款未披露；没有迹象显示监管路径或临床试验时间表
      - - United Semiconductors
        - 先进材料
        - 多飞行 JDA，在轨生产半导体晶体材料，用于地面电子设备
        - 试点 / JDA 阶段（约 2025 年 5 月签署协议；未公开确认已完成生产任务）
        - Varda 公告确认多飞行 JDA；ISS National Lab 背景材料确认 United Semiconductors 此前在 ISS 做过半导体制造演示
        - 联合开发，尚未确认生产；在轨半导体产出的材料质量、商业可行性和定价均未披露；没有独立验证
      - - 未披露制药客户（W-1、W-3、W-4）
        - 制药
        - 在轨药物结晶——ritonavir（W-1）、专有化合物（W-3、W-4）
        - 生产（W-1：ritonavir Form III 在同行评议论文中确认稳定）；试点 / 研发（W-3、W-4：专有，结果未发布）
        - W-1 结果发表于 npj Microgravity（2026）；Series B 和 Series C 投资人沟通提到持续的制药客户参与；Varda 生物制药页面描述的「与 Varda 合作」框架与重复参与相符
        - 客户身份未披露；财务条款未知；W-3 和 W-4 结果未发布；无法独立验证重复任务关系或结果
    notes: >-
      「生产 vs 试点」评级适用于 Varda 自身语境：政府任务被评为生产等效，因为它们在真实飞行条件下交付了签约并回收的数据载荷。制药任务被评为试点 / 研发，因为尚无太空制造药物进入临床试验或获得 FDA
      批准。每行来源数量满足枚举表的两来源最低要求。
