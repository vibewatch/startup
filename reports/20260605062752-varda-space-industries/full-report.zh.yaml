      - number: '4.5'
        title: 资本充足性、烧钱速度与现金跑道评估
        blocks:
          - type: paragraph
            body: >-
              据报道完成 Series D 后，Varda 的资本状况显著改善。公司概况章节记录了完整融资时间线；从财务角度看，资本充足性最关键的输入是 TechCrunch 和 Tracxn 数据显示公司在 2026 年 2
              月完成 $250 million Series D，使已披露融资总额达到约 $578 million，投后估值约 $1.58 billion。准确现金余额、提款安排和债务义务均未公开披露。


              估算烧钱速度需要从可观察规模信号三角测算。截至 2026 年中约 200 名员工（Tracxn）、三处 California 设施（Aviation Boulevard 总部、Beyond Meat
              转租空间、正在装修的 Mattel 园区）、一个 Washington D.C. 办公室、一个 Huntsville Alabama 办公室，再加上任务节奏需要 SpaceX
              拼车合同——据此估计月度现金消耗在每月 $5-10 million 区间是合理的，对应年度烧钱 $60-120 million。这个区间很宽，且完全未经验证。相对于 $250 million Series D
              和部分前期现金余额，2026 年初起 24–36 个月现金跑道作为基准情景看起来可行，但前提是没有重大资本开支超支或任务失败。


              结构性融资依赖很重要。Varda 的商业模式需要持续获得 SpaceX Falcon 9 拼车发射（Varda 已披露到 2028 年有 10+ 次任务的签约舱位）、Southern Launch
              合作下澳大利亚设施的持续靶场访问，以及每次再入都获得 FAA 或国际监管批准。任何一个输入失败或变贵——包括 SpaceX 进一步提高拼车价格——维持任务节奏所需资本都会增加。AFRL IDIQ
              提供部分收入抵消，但合同覆盖不了完整运营成本结构。


              债务、项目融资或信贷额度义务未公开披露。考虑到公司仍处于风险投资阶段，且没有任何 SEC 文件（Varda 仍是私营公司），公开记录中没有可查的信贷义务。下一轮触发点不清楚；鉴于 2026 年 2 月确立了
              $1.58 billion 估值，未来融资需要高于该价格，才不会释放降价轮信号。收入质量和公开 traction 指标缺失意味着，在防务合同收入进一步放大或药品 IP 收入落地之前，公司仍会高度依赖资本。
