        - id: spacex
          label: SpaceX Falcon 9（发射——100% 任务；集中风险高）
        - id: southern
          label: Southern Launch / Koonibba（回收——W-2 至 W-6；20 次再入协议）
        - id: uttr
          label: Utah Test and Training Range / DoD（备用回收场；FAA 许可）
