      - number: '6.3'
        title: 药品与商业客户——United Therapeutics、United Semiconductors 与未披露管线
        blocks:
          - type: paragraph
            body: >-
              2026 年 5 月，Varda 宣布与 United Therapeutics Corporation（Nasdaq:
              UTHR）开展多任务合作，为罕见肺部疾病开发改良小分子药物配方，先从肺动脉高压治疗药物开始，药品客户板块因此大幅推进。United Therapeutics CEO Martine Rothblatt 把
              Varda 平台形容为「常规化」，与 ISS 研究的后勤复杂性形成对比，并表示如果微重力能带来新的分子形态，合作可能「打开数十亿美元市场」。这是 Varda
              历史上第一家公开具名的制药公司合作，也是药品板块商业进展最强的公开信号。协议约定随时间开展多次任务，提供了重复使用承诺，但财务条款未披露。


              在 United Therapeutics 宣布之前，Varda 有三次任务为未具名客户搭载药品载荷：W-1（2024 年 2 月返回）生产 Form III ritonavir，随后一篇同行评审的 npj
              Microgravity 论文确认其稳定；W-3（2025 年 5 月）搭载专有药品载荷；W-4（2025 年 6 月发射）按溶液结晶协议处理一种专有小分子化合物。Varda 的 Series C 公告（2025
              年 7 月）称，公司正与在结晶、纯度或货架稳定性上遇到挑战的「领先制药制造商」沟通，但没有点名。Series C 资助的新 10,000 平方英尺 El Segundo
              药品实验室，设计目的就是加速这些未具名管线客户化合物的预筛选。


              在先进材料板块，Varda 与 United Semiconductors 签署了多飞行联合开发协议，在轨生产可用于地面的半导体晶体材料，目标是提升 AI、航天和防务半导体器件性能。United
              Semiconductors 此前已通过 ISS National Laboratory 在 International Space Station 上开展过半导体制造演示，因此在与 Varda
              合作前已有轨道制造经验。这项协议大约在 2025 年 5 月宣布，是 Varda 首次以具名商业伙伴把商业客户基础扩展到药品之外。
