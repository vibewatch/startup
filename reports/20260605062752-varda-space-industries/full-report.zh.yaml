      - number: '8.2'
        title: 估值背景：$1.58 billion 标记隐含什么，公开证据又支撑什么
        blocks:
          - type: paragraph
            body: >-
              2026 年 2 月完成的 Series D 融资，根据 TechCrunch 独角兽追踪榜和 PM Insights，融资 $250 million，投后估值约 $1.58
              billion，使披露的股权融资总额达到约 $578 million。PM Insights 和 Nasdaq Private Market 跟踪的二级市场数据显示，到 2026 年 5
              月下旬，隐含估值已漂移至约 $1.64–1.74 billion，过去 90 天完成的老股交易超过 $124 million。Forge Global 和 Nasdaq Private Market 都把
              Varda 列为 IPO 前投资机会，说明合格投资者已经活跃参与二级市场。


              估值算术很直接，但对尽调来说并不舒服。如果 AFRL IDIQ 的 $48 million 上限是已确认年度政府收入最接近的代理指标，那么 $1.58 billion 标记约等于这项数字的 33x。即便 AFRL
              合同的任务订单收入平均为每年 $10–12 million——这是从公开合同数据和任务节奏三角测算得出的数字——对一家硬件服务公司来说，隐含收入倍数仍然极高。这个缺口只有靠新增国防机构、制药服务或 IP
              特许权使用费带来显著收入爬坡，才可能补上。三座桥目前都没有在公开记录中体现为已确认收入。


              前几轮投资者包括 Founders Fund、Khosla Ventures、Lux Capital、Caffeinated Capital、Shrug Capital 和 Natural
              Capital。披露的股权结构表里没有战略企业投资者（国防主承包商、大型药企），这一点值得注意：它说明来自运营型客户的验证尚未转化为股权合作，而后者会是重要的可信度信号。Series D
              的优先股负担、棘轮条款和清算条款都未公开披露；任何评估下行保护的新投资者，都必须把这些列入资料室重点索取项。


              用可观察代理变量估算烧钱速度——约 200 名员工、三个 California 设施地点、一个 Washington D.C. 办公室、一个 Huntsville Alabama 办公室、SpaceX
              拼车合同，以及持续运转的制药实验室——显示月度现金消耗大约在 $5–10 million，或每年 $60–120 million。这意味着 2026 年 2 月 Series D 交割后，公司大约有 24–36
              个月现金跑道，前提是没有重大资本开支超支或任务失败。这个跑道合理，但相对于制药 IP 的商业化周期并不宽裕。
