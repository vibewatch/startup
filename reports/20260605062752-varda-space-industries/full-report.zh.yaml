      - number: '1.2'
        title: 创始人、领导梯队与治理透明度
        blocks:
          - type: paragraph
            body: >-
              从纸面看，创始人与市场匹配度很强。Bruey 出身 SpaceX 航电团队，意味着 Varda 的负责人已经在让常态化入轨具备经济可行性的发射系统文化中工作过。Asparouhov
              带来投资人网络杠杆，并一直是公司长期轨道经济逻辑的高调公开倡导者。到 2026，公开材料还列出 Adrian Radocea 任首席科学官、Nick Cialdella 任首席技术官、Dave McFarland
              任高超音速测试与靶标副总裁，说明 Varda 已有覆盖制药科学、飞行系统和防务市场开发的可识别高管。


              治理信息明显更薄。已审阅公开记录没有披露现任董事会名单、投资人控制图、清算优先权或其他晚期投资人在承销新一轮前会要求看到的硬治理条款。这并不意味着治理弱；只是治理没有透明披露。对第一章尽调来说，实际判断是：Varda
              仍然像一家由创始人主导、以执行为中心的公司；在数据室或未来文件披露更完整董事会和接班安排前，对 Bruey 和 Asparouhov 的关键人依赖仍然显著。
