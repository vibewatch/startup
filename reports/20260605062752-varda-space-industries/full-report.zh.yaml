  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资建议：运营证明很强，但价格要求多条未披露收入流同时兑现
        blocks:
          - type: paragraph
            body: >-
              Varda Space Industries
              在商业航天里做成了一件确实罕见的事：它已经飞了六次轨道任务，六次都把载荷带回地面，而且全程没有宇航员在舱内，硬件复杂度还在每次任务中递增。这份运营记录不是推测。AFRL 在 USASpending.gov
              上的合同授予、独立发射与再入报道、Varda 自己的新闻稿，都有充分记录。公司也是首家拿到 FAA 载具运营商许可证、可授权无限次再入的企业；相比早期 W-1 延误，这显著降低了未来任务的监管交易成本。


              运营证明没有解决的问题，是当前 $1.58 billion 入场价是否匹配证据基础。当前估值隐含三项前瞻前提，每一项都合理，但目前都无法验证：第一，国防合同收入将通过更多合同、机构和任务节奏，远超 $48
              million AFRL IDIQ 上限；第二，轨道制药结晶将在商业相关时间内产出至少一种可商业授权的药物晶型；第三，监管准入、通过 SpaceX
              获得的发射供给，以及关键人稳定性，会在建设期内保持完好。三项前提任何一项落空，估值都会被明显压缩。三项同时落空，则意味着投资逻辑断裂。


              到 2026
              年中，投资者面对这组证据，更合适的姿态是继续研究，而不是不看价格地买入。公司执行力足够强，值得高强度跟踪，但这个入场价需要通过私下尽调才能承销。中等信心反映的是强运营信号与弱财务披露并存。高风险评级来自几个对投资逻辑至关重要的依赖点高度集中：SpaceX、AFRL
              合同、制药科学结果。估值偏高，反映的是当前标记已经计入了公共记录尚未充分验证的执行质量。
