companyProfile:
  summary: >-
    Varda Space Industries 是一家位于 El Segundo 的轨道制造与再入公司，Will Bruey 和 Delian Asparouhov 于 January 2021 创立。公司运营可复用的
    W-series 航天器平台，在低地球轨道开展微重力加工，并通过自主胶囊再入把载荷带回地面。到 mid-2026，Varda 已完成六次轨道任务，并成为首家获得 FAA
    载具运营商许可证的商业运营商，该许可证授权无限次再入。收入来源包括以 AFRL $48 million IDIQ 合同为锚点的政府防务测试台服务、与首个具名合作伙伴 United Therapeutics
    开展的早期商业化制药服务，以及针对微重力生产的新型药物多晶型的更长期 IP 授权模式。公司在 May 2026 约有 200 名员工，并已通过一轮据报道投后估值 $1.58 billion 的 Series D 累计融资约 $578
    million。
