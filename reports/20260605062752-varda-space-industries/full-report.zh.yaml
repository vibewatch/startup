  - id: TV002
    title: 论点 / 反论点表
    columns:
      - 方向
      - 论据
      - 什么会改变观点
    rows:
      - - 正方论点
        - 连续六次任务成功，且硬件复杂度不断提升，在商业航天里是少见的运营证明。
        - 任务失败或持续监管搁置会直接否定这个强信号。
      - - 正方论点
        - AFRL IDIQ 和多机构 DoD 关系（美国海军 W-5、NASA/Sandia W-6）显示，国防需求正在从单一合同走向多元化。
        - 如果 AFRL IDIQ 到期失效，或 DoD 对高超音速试验台的支出明显下滑，收入锚点就会消失。
      - - 正方论点
        - 到 2029 年有效、数量不受限的 FAA 再入许可证，移除了让 W-1 停滞数月的最大监管瓶颈。
        - 任何新的再入许可拒批或暂停，或国际发射带来的出口管制复杂化，都会重演 W-1 场景。
      - - 反方论点
        - 全球还没有任何太空制造药物获得 FDA 批准，这意味着制药 IP 论点是一场周期很长的科学押注，没有商业先例。
        - 如果有一款药物因轨道制造获得实质性赋能并拿到 FDA 批准，就会验证品类，并迫使制药收入时间线向上修订。
      - - 反方论点
        - 当前 $1.58B 估值隐含的收入规模，公开证据在任何可验证倍数下都尚未支撑。
        - 如果披露年收入 $80M+ 且毛利率改善，当前估值就能在传统指标下站住脚。
      - - 反方论点
        - 六次任务全部依赖 SpaceX 这一个发射服务商，形成没有缓解措施的运营集中风险。
        - 签署已确认的替代发射服务商协议，会把这项风险从论点破裂风险中移除。
    notes: 这些论据按价格敏感陈述撰写，描述当前估值已经纳入了什么，而不是判断 Varda 作为公司绝对意义上好不好。
