    title: 护城河 / 就绪度 KPI——Varda 与竞争版图
    type: kpi
    layout: standard
    summary: Varda 在飞行履历、监管位置和防务收入上领先。资金充足的自由飞行器同行，以及拥有 NASA 锚定收入的 ISS 制药既有运营商，正在形成竞争压力。最耐久的优势是 FAA 许可与防务合同收入的组合，目前没有同行复制。
