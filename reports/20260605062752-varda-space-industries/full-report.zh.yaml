      - number: '7.5'
        title: 人员、治理与执行风险
        blocks:
          - type: paragraph
            body: >-
              Varda 的组织和执行风险，主要集中在创始人层面的关键人依赖。CEO Will Bruey 同时具备 SpaceX 工程履历、与 DoD 项目官员和国会幕僚的直接关系，以及推动已确认披露融资超过
              $329M（截至 Series C）的媒体能见度。他讲的「七张多米诺骨牌理论」和「魔法烤箱」叙事不只是品牌包装；机构投资者、国防客户和潜在药企合作方，都靠它判断 Varda
              的差异化。公开信息中没有接班计划、没有具名副 CEO，也没有迹象显示其他高管建立了同等外部关系。联合创始人 Delian Asparouhov 带来 Founders Fund 背书和 VC
              网络入口，但他的公开身份更偏投资人，而不是经营者。CTO Nick Cialdella 和 CSO Adrian Radocea 是具名高管，但两人加入后主要是在执行 Bruey 的愿景，并非独立战略主心骨。


              执行风险也出现在制药科学人才管线。既懂 GMP 合规、又懂微重力工艺设计的航天级制药科学家，人才池极小。Varda 员工数从 2024 年约 90 人增至 2026 年 5 月约 200
              人，扩张很激进，带来文化稀释风险，也可能推高 205,000 平方英尺 Mattel 园区改造成本。洛杉矶航空航天工业地产空置率低于 4%，设施延期或成本上涨都很现实。制造扩产——每年再造 10+
              个胶囊——是公司给出的 2026 年底计划，但单个成本目标（规模化后 $2.5M）尚未公开证实已经达到；CEO 口中的目标成本与当前实际成本之间的缺口，是单位经济模型核心位置上仍未验证的执行风险。
