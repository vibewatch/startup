      - number: '1.3'
        title: 融资历史、规模信号与实体扩张
        blocks:
          - type: paragraph
            body: >-
              Varda 的融资节奏随任务节奏一起加速。公司在 2024 公开宣布 $90 million Series B，随后在 July 2025 完成 $187 million Series
              C，使官方披露的生命周期融资达到 $329 million。2026 独立报道又加了一层更具推测性的数字：TechCrunch 的独角兽汇总引用 PitchBook 称，Varda 最近一次以 $1.6
              billion 估值完成 $250 million Series D，累计融资超过 $570 million。这个数字可作为市场信号，但还不是公司确认的事实，因此应作为外部估计，而不是已坐实的内部事实。


              运营规模信号比经济性更容易交叉验证。Varda 从 2024 的 90+ 名员工增至 late 2025 约 175 人、May 2026 约 200 人，同时扩大地面版图。Series C 资金支持了一个
              10,000-square-foot 制药实验室和 Huntsville 办公室；Los Angeles Times 随后报道，公司租下前 Mattel 校园 205,443-square-foot
              面积，另有早前 55,000-square-foot
              实验室转租。这些设施动作说明管理层在为更高硬件吞吐和更严肃的制药工艺开发做准备。公开记录仍缺少收入、客户数、债务和资本结构细节，因此规模主要通过任务、招聘和房地产扩张可见，而非财务披露。
