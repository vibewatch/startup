      - number: '7.6'
        title: 缓释措施、监控指标和否决标准
        blocks:
          - type: paragraph
            body: >-
              相比 2023 年，Varda 已经实质性降低了监管风险：Part 450 运营商许可证取消了逐次任务再入审批，澳大利亚提供了非 Utah 回收路径，W-4 至 W-6 这些开创先例的政府任务也让 AFRL 和
              DoD 成为受益于 Varda 持续运营的利益相关方。国防业务模式能扛住中等幅度预算削减，因为 MACH-TB 2.0 的多年期架构，以及国会对高超音速超过 $2.6B
              的拨款，构成的结构性需求比单一可自由裁量预算项更难被清零。Southern Launch 到 2028 年的 20 次再入协议，降低了靶场准入的单点故障风险。


              尚未缓释的关键风险是 SpaceX 排他性、药企监管路径不确定性，以及关键人集中。投资逻辑失效的监控指标包括：2029 年后任何新许可证申请出现 FAA 发证延迟；Falcon 9 长时间停飞并影响已排期
              Transporter 任务；United Therapeutics 合作被公开披露暂停；AFRL Prometheus 项目预算削减超过 $48M IDIQ 上限的 20%。CEO
              离任或退出是阈值事件，会触发对制药和国防两条叙事的全面重估。制药业务的否决标准更简单：如果到 2028 年仍没有任何 Varda 制药客户提交 IND 申请，那么支撑特许权使用费逻辑的 5–10
              年药物商业化时间表，就基本从具体路径退化为投机假设。投资者和尽调团队在按当前估值投入资本前，应先明确资料室索取项——董事会接班计划、Bruey 合同条款、AFRL 任务订单管线、SpaceX
              拼车条款，以及备选发射商评估。
