      - number: '4.3'
        title: 药品载荷处理收入
        blocks:
          - type: paragraph
            body: >-
              Varda 的药品收入流仍处于商业化早期。自 2023 年以来，公司已完成六次搭载药品载荷的轨道任务，包括在 W-1 上重新配方 ritonavir（HIV 抗逆转录病毒药物），但截至 2026
              年中，还没有在轨制造的商业药品售出。首席战略官 Michael Reilly 在 2026 年 5 月明确指出，Varda 和 SpaceX
              仍是仅有的两家能够在没有宇航员操作下进行轨道制造并回收材料的公司——而太空制造药品售出时将是「第一次」。


              United Therapeutics 合作（2026 年 5 月宣布）是商业上最具体的药品合作，但它被定义为研发而非制造：United Therapeutics 向 Varda
              付费，研究其肺动脉高压药物能否在微重力下结晶成新的晶型。财务条款未披露。CEO Martine Rothblatt
              的公开评论显示，她认为交易若成功可打开「数十亿美元市场」，说明这项合作带有版税或授权上行空间，而不只是任务服务费。Varda 由 Series C 融资支持的 El Segundo
              实验室，用于在投入轨道任务名额之前筛选哪些候选药物值得飞行，从而提高药品任务命中率。


              Varda 所描述的抽成模型对高价值药物有真实收入潜力，但也带来两项结构性财务风险：（1）如果微重力结晶没有为某一特定 API 带来可专利化或临床上更优的结果，Varda
              只能赚取单次任务服务费，拿不到版税长尾；（2）从新型晶型到获批药品，监管与开发周期通常为 5–15 年，也就是说即便成功，版税收入也是极远期资产。Scientific American 在 2026
              年采访的专家把这门生意形容为「目前风险很高」，结晶时点「极其难以」控制，从轨道晶体数据通向商业药品销售的直线路径也尚未被证明。
