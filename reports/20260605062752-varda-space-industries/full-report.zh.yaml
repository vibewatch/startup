      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              Varda 的两个市场板块拥有结构上不同的买方-用户-付款方三角。在制药板块，买方通常是大型制药或生物科技公司的 R&D 领导层或业务发展职能；用户是制剂科学家和结构生物学家团队；付款方是公司的制药 R&D
              预算——这是可自由支配预算项，而非资本开支。May 2026 公布的 United Therapeutics 合作，是首个公开确认的交易：一家具名大型制药公司付费让 Varda
              为肺部疾病疗法开展轨道工艺开发。United Therapeutics CEO Martine Rothblatt 称，该合作为其公司打开「数十亿美元的市场」，但双方均未披露合同条款、定价或里程碑结构。Merck
              多年基于 ISS 的 pembrolizumab 结晶项目提供了历史先例，证明当药代动力学收益足够大时，大型制药公司会为微重力制剂工作持续投入 R&D 预算。


              在防务和高超音速测试台板块，买方和付款方是美国政府项目办公室，主要是 AFRL 和 Navy 研究司令部，资金来自国会拨款的 R&D 预算线。$48 million、四年期、与 Prometheus 相关的
              AFRL 合同，加上 W-5 和 W-6 的 Navy 与 NASA 载荷工作，确认多个 DoD 分支现在把 Varda 视为可信且可重复的测试基础设施供应商。FY2026 House Defense
              Appropriations Bill 为高超音速项目分配超过 $2.6 billion；FY2026 Space Force 预算请求加上 Golden Dome 预算调和案，总额较 FY2025
              已颁布水平增加近 40 percent，为持续的高超音速测试需求提供顺风。NASA Ames 和 Sandia National Laboratory 等研究机构是用户而非主要付款方，它们通过搭载 TPS
              载荷或提供顾问支持换取飞行数据。
