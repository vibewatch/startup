        title: 展示材料
        blocks:
          - type: callout
            title: 当前判断：继续研究；没有私下尽调，不应按 $1.58B 买入
            body: Varda 是商业航天里真正重要的公司，拥有罕见的运营证明。当前入场价只有在乐观情景下才说得通，而且需要私下财务披露才能承销。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV005
              - CV034
          - type: callout
            title: 运营记录异常出色，带来真实差异化
            body: 连续六次成功再入并带回载荷、FAA 无限次运营商许可证，以及多机构国防参与，都是商业航天领域罕见的定性信号。
            calloutType: strength
            claimRefs:
              - CV003
              - CV019
          - type: callout
            title: 制药 IP 是真实上行空间，但资产期限非常长
            body: 全球还没有任何太空制造药物获得 FDA 批准。科学专家称该业务「当前有风险」，结晶控制「极难」。应给制药可选性估值，而不是给确定性估值。
            calloutType: risk
