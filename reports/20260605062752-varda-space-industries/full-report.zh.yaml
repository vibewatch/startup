  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局概览与分类
        blocks:
          - type: paragraph
            body: >-
              Varda 的竞争对手分布在五个不同类别，每一类都代表买方完成同一底层任务的不同方式。第一类也是最直接的一类，是专用自由飞行返回同行——公司自行建造、发射并回收轨道胶囊，在 ISS
              之外的微重力环境中制造或加工材料。Space Forge（UK）、ATMOS Space Cargo（Germany）和 Space Cargo
              Unlimited（Luxembourg）都属于这一类；截至目前，没有一家实现 Varda 从 W-4 起展示的经常性商业再入节奏。第二类是基于 ISS
              的制造和研究平台——Redwire/SpaceMD、Space Tango、SpacePharma、Voyager Technologies 等公司在 ISS
              上提供微重力准入，但没有专用胶囊或独立再入能力。第三类是现有再入运输工具和相邻进入者——Sierra Space Dream Chaser 与 SpaceX Dragon CRS，两者都把返地能力作为其主要
              ISS 补给或载人任务角色的次要功能。第四类是现状地面替代品——合同研究组织、喷雾干燥实验室和结晶自动化系统，不离开地球也能处理药物制剂问题。第五类专属于 Varda
              的防务高超音速测试台业务，即政府拥有的探空火箭、风洞和传统高超音速测试载具。当前没有竞争对手同时覆盖这五个维度；Varda
              的双用途模式——用防务收入补贴制药平台——在可观察格局中独一无二。2025–2026，竞争格局显著升温，自由飞行同行融资超过 $70 million，Redwire 也以 SpaceMD
              正式进入商业制药制造领域。
