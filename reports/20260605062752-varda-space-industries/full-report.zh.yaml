  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分层概览
        blocks:
          - type: paragraph
            body: >-
              Varda Space Industries
              的客户基础分为两个结构上不同的板块，二者在收入时点、使用场景和监管敞口上都不同。第一块是政府与防务：这类机构采购再入舱飞行时间，用真实飞行条件测试高超声速飞行器技术、热防护材料、传感器和导航系统；这些条件无法在地面复现。该板块自
              2023 年起贡献已确认合同收入，客户包括 Air Force Research Laboratory、U.S. Navy、Sandia National Laboratories 和 NASA Ames
              Research
              Center。第二块是药品研发：生物技术和制药公司为微重力访问付费，用来结晶药物化合物、生成新晶型、提高生物利用度，或表征生物制剂，目标是为更优配方申请专利。该板块已从未披露的单次任务合作，推进到与 United
              Therapeutics 的具名多任务合作（2026 年 5 月宣布），以及与 United Semiconductors 在轨半导体晶体生长的联合开发协议。第三个萌芽板块是药品之外的先进材料，由 United
              Semiconductors 代表，也包括理论上延伸到其他重力敏感工业材料；但截至报告日期，这一类别没有更多具名客户公开披露。从授权药品角度看，商业药品板块仍处于收入前阶段；政府板块是 Varda
              当前运营收入基础。所有公开表述都把这两个板块视为互补：政府任务节奏为飞行器生产和运营提供资金，从而支撑药品任务。
