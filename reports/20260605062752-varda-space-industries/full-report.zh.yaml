      - number: '4.6'
        title: 财务结论——收入质量、资本强度与尽调阻碍
        blocks:
          - type: paragraph
            body: >-
              2026 年中 Varda 的财务图景最适合概括为：资本充足、但仍处于商业化前期的基础设施建设，公司有一个已确认的政府收入锚点。收入质量分化明显：政府防务服务收入质量中等偏高（有合同支撑、多年期、IDIQ 结构在
              USASpending.gov 得到确认），药品服务收入仍处早期，依赖外部投资者目前无法预测的科学结果。IP 授权收入则是投机性、长周期资产。


              资本强度是结构性特征，不是临时阶段。制造再入舱、采购拼车舱位、管理分散设施，并雇用包括航天工程师和药品科学家在内的 200+
              人团队，形成的成本结构不太可能仅靠当前节奏下的防务合同收入实现自我供血。要达到现金流盈亏平衡，公司需要显著放大防务任务收入（当前 AFRL IDIQ
              之外新增合同）、叠加多个具名客户带来的有意义药品服务费，或实现版税收入——这些都可能发生，但从当前证据看每一项都需要多年。


              主要尽调阻碍是信息缺口，不一定是业务失败。投资者目前无法评估：（a）实际收入与增长率；（b）单次任务毛利率；（c）烧钱速度和准确现金头寸；（d）United Therapeutics
              及其他任何药品客户的合同条款；（e）债务或信贷额度义务；（f）客户集中度。所有这些都是投资前标准披露，但 Varda
              已选择不公开。公开证据支持这样一家正在执行运营、并朝多条收入流建设的公司；但要有信心承销财务逻辑，仍需要完整数据室。
