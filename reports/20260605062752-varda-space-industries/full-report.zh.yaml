      - number: '5.2'
        title: 客户工作流与使用场景
        blocks:
          - type: paragraph
            body: >-
              面向药品客户，核心工作流是把一个药物化合物筛选候选物转化为轨道结晶数据，或转化为在地球重力下难以甚至无法获得的处理后材料。客户提交候选药物；Varda 的 El Segundo
              实验室进行飞行前筛选，评估微重力适配性；化合物被装入处理载荷模块；它搭乘 SpaceX 拼车进入近地轨道；结晶或处理通常自主运行六到十六周；舱体再入并在 South Australia 的 Koonibba
              Test Range 回收；处理后的材料被运回进行飞行后分析。W-1 用 Form III ritonavir 演示了这一工作流——这是第一种在轨生产的商业药品——2026 年一篇 npj
              Microgravity 论文确认，太空处理后的材料在再入后保持稳定。W-4 用流体式溶液结晶架构扩展了药品工具箱。2026 年 5 月宣布的 United Therapeutics
              合作，把这一工作流应用到多次任务中的肺动脉高压治疗药物。


              面向政府客户，工作流更简单：客户提供待测载荷——传感器、材料样本或仪器——Varda 将其集成进再入舱的高超声速测试平台段，舱体在 Mach 25+
              再入过程中采集飞行数据。回收后的硬件和数据再交还客户做飞行后分析。W-2 上的 OSPREE 光谱仪完成了 DoD 首次对 Mach 25+
              等离子体鞘套的原位光发射测量，证明其能提供任何地面设施都拿不到的数据质量。
