      - number: '5.6'
        title: 路线图、发展阶段与技术成熟度判断
        blocks:
          - type: paragraph
            body: >-
              Varda 在 2023–2026 年间公开完成六次任务，确立了再入舱和集成系统在商业再入平台中的高任务验证度。每次连续任务都增加了有意义的技术里程碑：W-1 证明轨道药品处理和 UTTR 再入；W-2 与
              W-3 展示 DoD 载荷和 Koonibba 靶场运营；W-4 实现全面垂直整合，并拿到首张 FAA 飞行器运营商许可证；W-5 在完整任务生命周期中验证自研卫星平台；W-6
              展示基于机载图像的自主导航和先进热防护数据采集。近期路线图围绕放大到每月任务节奏展开，这要求自动化、供应链建设和并行在轨运营管理。Varda 已经在为客户预订到 2027 年的飞行，20 次再入的
              Southern Launch 合同也支撑约到 2028 年的运营规划。


              中期路线图由药品逻辑驱动。CEO Will Bruey 公开提出「七张多米诺骨牌」理论，其中第 3 张——一种药物进入临床试验——会触发持续发射需求。United Therapeutics
              合作是迈向这一里程碑最具体的当前步骤。不过，Scientific American 在 2026 年采访的科学家把轨道结晶描述为「目前风险很高」，过程控制时点不可预测。截至 2026
              年中，还没有太空制造药品进入临床试验。技术成熟度判断是：硬件、再入运营和政府高超声速服务很强；药品工艺开发需要谨慎。走到临床试验药物状态的路线图，仍是产品逻辑中最重要的未证实主张。
