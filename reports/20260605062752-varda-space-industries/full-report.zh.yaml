      - number: '6.5'
        title: 集中度风险、证据边界与真实商业约束
        blocks:
          - type: paragraph
            body: >-
              Varda 的客户基础存在实质集中度风险。政府防务板块是已确认收入锚点，AFRL Prometheus 项目和 MACH-TB 2.0 入选是主要合同。DoD
              高超声速测试预算削减、转向其他供应商，或国家安全优先级变化，都可能显著压低近期收入。所有 W 系列任务都搭乘 SpaceX Transporter 拼车发射，形成单一发射供应商依赖，约束客户任务排期；如果
              SpaceX 优先级变化，也会引入运营风险。


              药品客户基础虽然是 Varda 长期商业逻辑的战略核心，但仍处早期且集中。截至 2026 年 6 月，United Therapeutics
              是唯一具名商业药品客户。此前三次任务搭载了专有药品载荷，但这些客户仍未披露，外部无法凭公开来源独立评估其深度、续约可能性和商业条款。还没有任何制药公司利用 Varda 平台产出 FDA 批准产品。CEO
              曾表示，他预计药物会在本十年结束前到达患者——这意味着商业药品制造收入不太可能在 2030 年前出现。Aerospace America 报道 CEO Will Bruey
              把太空制药描述为从「研究新奇事物」走向「制造主流」，这是多年周期，不是即时商业现实。


              有必要保留怀疑视角。Scientific American 专家评论称轨道结晶条件「极其难以控制」、时点不可预测，并把这种路径形容为「碰运气」。SpaceDaily 和偏股权分析指出，制药行业「谨慎」，并未把
              Varda 当成药品制造商，而是当作潜在管线伙伴；其价值取决于一种药物走到 FDA
              批准和商业规模——这是一条多年、高风险路径。任何客户板块的公开定价、合同期限条款或单次任务收入均未披露，限制了对客户经济性的财务尽调。
