  - id: TV004
    title: 可比估值表
    enumerationScope:
      coverage: partial
      basis: >-
        This table covers the most decision-relevant public and private comparables with accessible June 2026 evidence.
        No single company is a pure-play comparable for Varda's combined defense-hypersonic-testbed and orbital-pharma
        profile. The comp set is intentionally mixed to bound the valuation range rather than provide a single anchor.
    columns:
      - 可比公司
      - 指标
      - 倍数 / 估值 / 状态
      - 相关性
      - 局限
    rows:
      - - Rocket Lab (RKLB)
        - 市值 / TTM 收入
        - ~98x P/S（$66.5B 市值；~$800M TTM 收入；2026 年 Q1 收入 $200.3M，同比增长 63.5%）
        - 它是最好的上市基准：垂直整合商业航天公司、国防敞口增长、当前尚未盈利；政府业务现占 $2.2B 订单储备的 49%。
        - Rocket Lab 是从发射服务扩展到空间系统的公司；Varda 不发射，收入来自再入硬件和载荷服务费。RKLB 的规模和订单储备大得多。
      - - Redwire (RDW)
        - EV / 年化收入
        - ~11x（$4.2B 市值；2026 年 Q1 收入 $97M，年化约 $388M）
        - 可作为上市航天硬件公司的下限锚：国防和制药邻近（SpaceMD）敞口增长；毛利率 26–27%。
        - Redwire 未盈利且高度依赖收购；其规模和业务组合与 Varda 聚焦再入平台相差很大。
      - - SpaceX（未上市）
        - 私募估值 / 估算远期收入
        - ~30–36x（$800B 估值；估算 2026 年收入 ~$22–30B）
        - 显示私募市场愿意为稀缺、垂直整合、具备经常性收入和主导市场地位的空间基础设施支付什么价格。
        - SpaceX 的 Starlink 订阅经济、发射市场主导地位和 Starship 开发，使其与 Varda 不在同一类别；这个倍数是天花板，不是目标。
      - - SpaceForge（未上市，英国）
        - 私募估值 / Series A
        - 2025 年由 NATO Innovation Fund 领投的 £30M Series A；隐含估值低于 Varda 当前估值
        - 最接近的欧洲太空制造同业，具备直接在轨制造论点；NATO 战略背书验证了该赛道。
        - 运营阶段远早于 Varda（截至 2025 年还没有轨道返回）；英国监管环境不同；没有制药重点。
      - - 国防硬件主承包商（Leidos、SAIC、L3Harris — 加权）
        - EV / 收入
        - 1–3x 收入（多元化国防主承包商基准）
        - 地板参考：如果 Varda 成熟为任务服务业务而非平台，国防主承包商倍数可提供估值地板。
        - 国防主承包商成熟、盈利且多元化；把主承包商倍数套到早期成长公司过于保守，但能有效锚定下行情景。
    notes: 可比倍数来自 2026 年 Q1-Q2 公开市场数据和私募轮估算；没有任何单一可比公司是 Varda 的纯粹匹配。
    claimRefs:
      - CV017
      - CV018
      - CV019
      - CV020
      - CV021
      - CV022
      - CV023
  - id: TV005
    title: 论点破裂与终止触发项表
    columns:
      - 触发项
      - 证据阈值
      - 对论点的传导
      - 行动含义
    rows:
      - - 再入许可第二次被监管搁置
        - FAA 或美国空军对已确认 AFRL 任务订单任务的批准搁置超过 60 天。
        - 说明 FAA 运营商许可证没有解决 W-1 式监管模式；收入时间和客户信心会被破坏。
        - 暂停所有新增资本；重新接触前，先与法律顾问开展监管根因尽调。
      - - SpaceX 拼车价格超过 $10,000/kg
        - 任何公开报道显示 2027 日历年或之后 Falcon 9 Transporter 价格高于 $10,000/kg。
        - 单次任务成本会明显超过非国防制药载荷的任务费收入；制药板块毛利率被压到接近零。
        - 任何新增资本前要求开放单次任务经济性资料室；重新评估制药特许权使用费时间线。
      - - CEO Will Bruey 离职且未指定继任者
        - 确认离职公告，但没有从现有管理团队中指定替任 CEO。
        - 移除主要 AFRL、FAA 和 DoD 关系资本；执行和监管风险明显上升。
        - 在继任者资质和关系连续性验证前，不投入新增资本。
      - - AFRL IDIQ 未续签或显著缩减
        - AFRL 公开记录当前合同期后不续签，或任务订单节奏减少超过 50%。
        - 消除唯一已确认的多年收入锚；需要制药或新合同替代 60%+ 已确认收入。
        - 下调基准情景；立即建模熊市估值。
      - - 未来股权融资出现估值下调轮
        - 未来融资轮将 Varda 股权定价低于 2026 年 2 月 $1.58B 投后估值。
        - 确认 Series D 估值超过证据基础；触发所有现有持有人的优先权结构分析和稀释复核。
        - 开展优先权和反稀释分析；评估新的入场价格是否带来更好风险回报。
    notes: 触发项定义为可度量、可观察，并能独立损害论点的事件；阈值设置保守，便于提前预警。
    claimRefs:
      - CV004
      - CV026
      - CV027
      - CV028
      - CV037
      - CV040
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 按板块拆分的收入和增长率
        - 实际 2025 年和 2026 YTD 收入，拆分为国防试验台服务、制药载荷处理以及任何 IP / 许可收入。
        - 不知道年收入是 $20M 还是 $80M，就无法承销当前估值；这个区间内隐含倍数相差超过 5x。
        - CFO 资料室材料包；经审计的管理账目。
      - - 单次任务毛利率和成本结构
        - 国防任务和制药任务的单次毛利率；全口径成本，包括 SpaceX 拼车、胶囊制造、运营和回收。
        - 决定业务能否在可辩护的任务节奏下自我供血，还是需要持续靠新股权融资补贴。
        - 财务和运营尽调；索取按任务类型逐项拆分的成本桥。
      - - Series D 优先权结构和股权结构表
        - Series D 的清算优先权、反稀释条款、棘轮条款、MFN 条款，以及任何二级交易限制。
        - 创始人友好的优先权结构或棘轮条款会大幅降低有效入场估值；新投资者需要知道自己在分配瀑布中的位置。
        - 法律资料室；Series D 律师出具的融资文件。
      - - United Therapeutics 交易财务条款
        - 交易结构（固定服务费 vs. 抽成比例 vs. 里程碑付款）、总合同价值，以及任何股权或特许权使用费组成。
        - United Therapeutics 合作是唯一具名商业制药关系；其结构决定制药收入是近期可见还是仍属投机。
        - 商务拓展和法律资料室；合作协议。
      - - AFRL 任务订单管线和剩余上限
        - 已下发任务订单和 $48M IDIQ 上限下剩余额度的逐项拆分；MACH-TB 2.0 交付订单价值；IDIQ 后 DoD 接触管线。
        - 国防收入是唯一已确认收入流；知道 IDIQ 已消耗和剩余额度，才能判断通往 Series E 或 IPO 的收入桥。
        - 合同管理资料室；USASpending.gov 交叉核对。
      - - 烧钱速度、现金头寸和融资假设
        - 当前月度现金消耗、2026 年 Q1 现金余额，以及乐观 / 基准 / 悲观任务节奏情景下的资本需求。
        - 按估计 $60–120M 年烧钱速度，Series D 资金可支撑 24–36 个月；资本开支超支或任务节奏加速，都会要求未来 18 个月内启动 Series E。
        - 财资与 CFO 尽调；索取月度现金流量表和前瞻烧钱模型。
    notes: 尽调事项按重要性排序；Series D 阶段私营公司缺少公开记录属正常。
    claimRefs:
