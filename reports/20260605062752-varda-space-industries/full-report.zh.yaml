  - id: FE001
    title: 产品架构图——W-series 硬件与地面栈
    type: stack
    layout: wide
    summary: W-series 是从商业拼车发射到地面制药分析的六层栈，W-4 时已完成从航天器平台到热防护罩的垂直整合。
    data:
      layers:
        - label: 商业发射（SpaceX Transporter 拼车）
          detail: 全部六次 W-series 任务均搭乘 SpaceX Falcon 9 Transporter 拼车从 Vandenberg Space Force Base 发射。发射是当前运营栈中唯一外部采购环节。
        - label: 轨道卫星平台
          detail: W-1/2/3 使用 Rocket Lab Photon（现成采购）。W-4/5/6 使用 Varda 自研内部平台，为 6-16 周轨道运营提供太阳能供电、姿态控制、推进和通信。
        - label: 制药或政府载荷模块
          detail: 两种变体：（1）熔融结晶（W-1/2/3），用于小分子热循环；（2）溶液型结晶（W-4+），模拟地面制药实验室技术。政府任务改用传感器 / 材料载荷段。
        - label: 再入返回舱（直径 ~90 cm / <90 kg）
          detail: 离轨点火时与平台分离。以 Mach 25+、18,000+ mph 的速度再入，承受 300W/cm² 热通量和 18,000K+ 等离子体流场。再入后降落伞展开。
        - label: C-PICA 烧蚀隔热罩（NASA 授权，W-4 起自研制造）
          detail: C-PICA 是共形酚醛浸渍碳烧蚀材料，最初由 NASA Ames 开发。Varda 通过 Tipping Point 奖项获得授权，并从 W-4 起在 El Segundo 自行制造。
        - label: 地面回收与制药实验室（El Segundo）
          detail: Southern Launch 在 Koonibba Test Range 负责着陆、回收和载荷取出。El Segundo 的 10,000 sqft 制药实验室负责飞行前药物筛选和飞行后样品分析。
    approximationNotes: 层级边界根据官方新闻稿和 W-series 任务公开描述重建。内部卫星平台和返回舱子组件细节未公开披露。
    claimRefs:
      - CE001
      - CE002
      - CE005
      - CE006
      - CE007
      - CE008
      - CE020
      - CE021
      - CE024
