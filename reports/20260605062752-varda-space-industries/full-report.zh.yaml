      - number: '3.4'
        title: 现有再入载具与相邻进入者
        blocks:
          - type: paragraph
            body: >-
              两家现有参与者提供再入能力，制药或防务客户可能把它们作为 Varda 专用自由飞行平台的部分替代品。


              Sierra Space（Louisville, CO）正在开发 Dream Chaser 空天飞机，用于 ISS 货运交付和返回。Dream Chaser 以跑道着陆，回收时货物承受低于 1.5
              g——明显比海上溅落或弹道胶囊返回更温和——原则上更适合蛋白晶体和细胞培养等脆弱生物样本。Sierra Space 已与 Merck 合作开发 3D 打印结晶模块，计划在 Dream Chaser 首次 ISS
              任务期间生长单克隆抗体晶体。该模块利用 Dream Chaser 稳定着陆剖面，在返回过程中保护晶体完整性。不过，截至 mid-2026，Dream Chaser 尚未完成首次商业飞行；其固定开销显著高于
              Varda 的小胶囊模式，且主要是 ISS 货运和载人运输工具，而非专用制药制造平台。Sierra Space 累计融资约 $2.4 billion，但其核心空天飞机项目仍未产生收入。


              SpaceX Dragon CRS（Commercial Resupply Services）任务定期把 ISS 托管的制药和生物科技实验带回地球。ISS National Lab 赞助、搭乘 SpaceX
              CRS-33 在 2026 返回的载荷包括多个制药、生物科技和再生医学研究项目。SpaceX Dragon
              是当前运行中最可靠、节奏最高的轨道返回载具，但它不是专用制造平台：它缺少受控的飞行中制造环境、专用处理模块，也不能脱离 ISS 独立运行。使用 Dragon 作为返回载具的制药客户仍依赖 ISS
              乘员时间分配和排期。Varda 面临的反向风险不是 SpaceX 今天就竞争，而是 SpaceX 未来可能在 Dragon
              变体或未来平台中以边际成本提供专用制造舱位，利用现有载具基础设施、靶场关系和发射频率，压缩 Varda 的单次任务定价能力。
