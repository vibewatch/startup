  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与现状替代品
        blocks:
          - type: paragraph
            body: >-
              Varda 处在两个独立商业市场的交叉点。两个市场共用同一硬件平台，却由完全不同的买方逻辑驱动。第一块是高价值药物制剂服务市场，Varda
              销售微重力结晶和工艺开发能力，作为药物候选物或生命周期管理项目的输入。第二块是防务和国家安全再入测试台市场，同一胶囊架构为政府载荷提供 Mach 25+
              飞行环境。两者在采购机制、预算持有人、合同结构和监管要求上都不同；即便共用同一载具，也应分开测算和分析。


              制药板块包括：（a）在轨工艺开发任务，把材料带回地球表征；（b）通过发现新型多晶型产生知识产权；（c）作为轨道任务前置筛选出售的地面超重力筛选服务。制药可服务市场不包括：商业规模的端到端药物制造（今天没有轨道设施能支撑这种产量）；发射经济性不可承受的通用小分子药；以及任何地面结晶方法已经能交付等效结果的药物或材料。现状替代品包括
              ISS National Lab 准入（昂贵、物流复杂，并受乘员时间分配约束）、在常压下运作的合同结晶研究组织（CRO），以及完全绕开物理结晶的合成化学路径。


              防务和高超音速测试台板块包括：由政府资助的合同，收集空气动力学、热防护系统、导航、传感器和通信在再入环境下的数据。现状替代品是成本高得多且飞行不频繁的专用探空火箭或实验性高超音速测试载具，以及无法复现 Mach
              25+ 下完整气动-热-化学耦合的风洞。FAA 根据 Part 450 向 Varda 的 W-4 签发再入载具运营商许可证，为这一板块创造了更可扩展的监管框架；但 UTTR 和 Koonibba Test
              Range 的靶场准入仍是 Varda 直接控制之外的依赖。
