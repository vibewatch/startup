      - number: '2.2'
        title: TAM、SAM 与相互矛盾的测算口径
        blocks:
          - type: paragraph
            body: >-
              三家独立市场研究机构对太空制造板块的估计，在基准规模和增长轨迹上分歧很大。The Business Research Company 估计，全球太空制造市场 2025 为 $1.21 billion、2026 为
              $1.5 billion，并以 23.6 percent CAGR 增至 2030 的 $3.51 billion。同一家公司关于太空制造材料的相邻报告估计，2025 为 $1.62 billion、2026 为
              $1.96 billion，到 2030 增至 $4.11 billion，CAGR 为 20.3 percent。相比之下，6W Research 估计太空制造市场 2025 为 $4.1 billion，到
              2032 将达 $9.2 billion，CAGR 为 12.1 percent——其 2025 基准是 TBRC 同年数字的 3.4
              倍。这些差异最可能来自市场定义范围（材料价值、服务收入还是基础设施投资）、地域口径以及是否纳入政府项目成本的分歧，但报告并未完整披露方法论。


              上游制药机会方面，GM Insights 估计全球单克隆抗体市场 2025 为 $285.9 billion，从 2026 的 $319.5 billion 增至 2035 的 $936.1
              billion，CAGR 为 12.7 percent。Coherent Market Insights 对一个更窄生物制剂市场板块的估计是 2026 为 $639.9 million，到 2033 增至
              $1.31 billion；如果把它作为太空生物制剂语境，这一机会将远小于 MAbs 的标题数字。GMI 更宽口径数字与 Coherent 数字之间 3-4×
              的差异反映市场定义不同，应保留为相互矛盾的证据，而不是选一个数字来解决。


              Varda 本身没有在公开材料中发布 SAM 或 SOM 估计。CEO Eric Lasker 在 2025 AIAA conference
              表示，目前没有任何空间制造产品摆上药房货架，确认商业制药收入基础现在接近零。制药路径的实际 SAM 受高价值药物项目比例限制——MIT Technology Review 估计入轨成本约
              $7,000/kg；只有每克药物价值足以明显覆盖发射和加工成本的项目才成立。管理层称单克隆抗体和生物制剂最可能成为第一类具备商业可行性的品类；Merck 的 pembrolizumab（Keytruda）ISS
              结晶工作推动了 2025 皮下注射制剂获 FDA 批准，是这一经济模型近期最清晰的概念验证。
