chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、使命与运营模式
        blocks:
          - type: paragraph
            body: >-
              Varda Space Industries
              更像一家混合型基础设施公司，而不是单一任务的太空初创公司。官方材料将其描述为一家由微重力赋能的生命科学公司：在轨道加工材料，再带回地球；但平台和政府业务页面清楚显示，同一套胶囊架构也支撑高超音速再入测试业务。这一定位对尽调很关键：Varda
              不只是想发现一种新的制药工作流，也在销售一条可复用的链路，覆盖入轨、在轨运营、再入和地面回收。换句话说，管理层同时在搭建制造环境和围绕它的物流链。


              公开身份信息相对清楚。Varda 由 Will Bruey 和 Delian Asparouhov 于 January 2021 创立，总部位于 El Segundo, California，并公开列出
              Washington, D.C. 和 Huntsville, Alabama 的办公室。公司页面也强调人才来自 SpaceX、Blue Origin、大型制药公司和 Silicon
              Valley。这种组合支撑核心投资逻辑：Varda 试图把专用硬件和商业化叙事结合起来，推动低地球轨道工业化；首批目标是超高价值材料，尤其是药物，因为发射成本有可能被其价值吸收。
