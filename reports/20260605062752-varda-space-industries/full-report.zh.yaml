      - number: '8.3'
        title: 可比分析：没有干净对标，但 Rocket Lab 和 Redwire 锚定区间
        blocks:
          - type: paragraph
            body: >-
              到 2026 年中，没有任何上市公司能直接对标 Varda Space Industries，因为没有其他上市公司把自主轨道制造硬件、高超音速再入试验台服务和制药 IP 开发放在同一平台里。最接近的上市参考点是
              Rocket Lab 和 Redwire，两家公司各自覆盖 Varda 商业模式的一部分，但都不完整。私营可比公司包括 SpaceX 和 SpaceForge。


              Rocket Lab（RKLB）是最常被引用的公开参照：一家垂直整合的商业航天公司，且有显著政府国防收入。Rocket Lab 2026 年 Q1 业绩——季度收入 $200.3 million（同比增长
              63.5%）、积压订单 $2.2 billion（同比翻倍）、政府合同现在占积压订单 49%——说明即便尚未盈利，拥有多元国防敞口的航天硬件公司也能获得极高估值倍数。RKLB 市值约 $66.5
              billion，TTM 收入约 $800 million，对应约 83–98x 市销率。即使只把这个倍数的一半用于 Varda 最乐观的国防收入情景，也会推出明显高于当前 $1.58 billion
              标记的估值；如果采用更保守的 15–20x 远期销售额，Varda 需要做到 $80–100 million 年化国防收入，才能支撑这个入场价。


              Redwire（RDW）提供了一个有用的下限锚。2026 年 Q1 收入为 $97 million（年化约 $388 million），市值约 $4.2 billion，隐含约 10–11x
              EV/sales。Redwire 在航天硬件和国防敞口上大体可比，但仍未盈利，毛利率约 26–27%。其 SpaceMD 制药子公司与 Varda 的制药抱负方向相似，但阶段更早，也不是重要收入贡献者。如果
              Varda 按 Redwire 可比的 10–11x 远期销售额估值，要支撑当前 $1.58 billion 标记，就需要约 $145–160 million 年收入——显著高于当前公开证据能支撑的水平。


              SpaceX 是最重要的私营参考点。SpaceX 2026 年估值估计约 $800 billion，年收入估计 $22–30 billion，对应约 27–36x 远期销售额——这个溢价反映 Starlink
              订阅经济和发射市场主导地位。Varda 没有同等的经常性收入锚。SpaceForge 是欧洲最接近的航天制造私营对标，2025 年从 NATO Innovation Fund 获得 £30 million
              Series A 融资，隐含估值大幅低于 Varda 当前标记，说明 Varda 的溢价更多来自更成熟的运营状态，而不是纯粹可比定价。
