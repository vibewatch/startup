  - id: FR002
    title: 风险传导图——主要风险如何传导至收入、利润率和估值
    type: dag
    layout: standard
    summary: 展示 Varda 的核心风险如何沿商业模式扩散。监管失败和运营异常直接流入收入确认；伙伴和预算风险流入收入集中；人员和制药执行风险则影响长期估值倍数。所有路径最终都会压低投资者信心和未来融资通道。
    approximationNotes: 箭头代表根据商业模式结构和公开证据推断的合理因果路径。各传导路径的强度未量化。
    claimRefs:
      - CR001
      - CR003
      - CR013
      - CR017
      - CR020
      - CR024
      - CR025
      - CR026
      - CR029
    data:
      nodes:
        - id: reg
          label: 监管风险（FAA 许可证到期；ITAR；FDA 路径未定义）
        - id: ops
          label: 运营风险（隔热罩失效；制药质量；制造扩产）
        - id: partner
          label: 伙伴风险（SpaceX 独占；Southern Launch 容量；AFRL 集中）
        - id: budget
          label: 国防预算风险（DOGE 削减；AFRL IDIQ 续期；高超音速优先级调整）
        - id: people
          label: 人员 / 执行风险（CEO 关键人物；C-suite 集中；GMP 人才）
        - id: pharma
          label: 制药商业化风险（无 FDA 先例；UT 唯一客户；IP 未确认）
        - id: rev_defense
          label: 国防任务收入（主要已确认收入；估计 ~$10-15M/mission）
        - id: rev_pharma
          label: 制药服务 + 特许权使用费收入（早期；单一客户；周期长）
        - id: margin
          label: 毛利率（未确认；国防可能为正；制药不确定）
        - id: burn
          label: 现金消耗与现金跑道（~$250M Series D；估计 24-36 个月）
        - id: valuation
          label: 投资者信心与估值（投后 ~$1.58B；取决于特许权使用费期权价值）
      edges:
        - from: reg
          to: rev_defense
          label: 许可证被拒或延迟会暂停再入运营
        - from: reg
          to: rev_pharma
          label: 没有 FDA GMP 先例会卡住 IND 申请和特许权使用费路径
        - from: ops
          to: rev_defense
          label: 任务失败会抹掉任务订单收入并触发 DoD 复查
        - from: ops
          to: rev_pharma
          label: 制药质量失败会削弱 UT 合作和 IP 管线
        - from: partner
          to: rev_defense
          label: SpaceX 停飞或 AFRL 预算削减会直接减少国防收入
        - from: budget
          to: rev_defense
          label: AFRL IDIQ 未续期或 MACH-TB 2.0 缩减范围会压低任务管线
        - from: people
          to: rev_defense
          label: CEO 离职会扰乱 DoD 关系和再入节奏叙事
        - from: people
          to: rev_pharma
          label: CSO 离职会拖慢制药科学和 IP 生成
        - from: pharma
          to: rev_pharma
          label: UT 暂停或没有 IND 会消除近期制药收入线
        - from: rev_defense
          to: margin
          label: 国防费用支持运营；利润率质量决定再投资能力
        - from: rev_pharma
          to: valuation
          label: 除国防合同价值外，特许权使用费期权是主要估值上行
        - from: margin
          to: burn
          label: 毛利抵消净现金消耗并延长现金跑道
        - from: burn
          to: valuation
          label: 现金跑道缩短会压缩执行制药 IND 策略的能力
  - id: FR003
    title: 依赖图——Varda 的关键外部伙伴及其风险维度
    type: dag
