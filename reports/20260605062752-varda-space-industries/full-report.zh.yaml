  - id: TU005
    title: 扩张与集中风险表
    columns:
      - 扩张驱动因素
      - 集中风险
      - 影响
      - 尽调路径
    rows:
      - - AFRL/Prometheus 重复合作和 MACH-TB 2.0 扩大规模（目标 50 次测试 / 年）
        - 政府细分是已确认收入的主导来源；单一项目 Prometheus 是锚定客户；预算削减或转向替代供应商（例如 MACH-TB 2.0 中的 Stratolaunch）可能压低 Varda 的政府份额
        - 高 — 近期收入集中在政府，尤其是 AFRL；若失去 Prometheus 后续任务，公司必须快速拉起制药收入
        - 要求披露 Varda 当前积压订单中 AFRL 与其他机构的占比；确认 MACH-TB 2.0 中专门预留给 Varda 的任务订单数量
      - - ISS 退役带来的需求真空（ISS 预计约 2030 年退役）
        - 制药和材料公司从 ISS 研究转出时，可选替代方案有限；Varda 定位为主要自主平台，但也会面对商业空间站（Axiom、Starlab）竞争
        - 中-高 — 结构性市场驱动存在，但商业空间站竞争者也瞄准这批客户；过渡时间在 2028–2032 年
        - 评估 Varda 已签约管线与 Space Tango、Redwire SpaceMD 以及商业空间站方案的对比；判断制药客户切换成本
      - - United Therapeutics 多任务扩张和潜在后续制药客户
        - 单一具名制药客户（UT）；此前制药客户未披露，无法独立验证；制药细分仍完全是临床前收入
        - 高 — 如果 UT 合作无法产出可发表结果或 FDA 路径，Varda 的制药商业逻辑会停滞；没有具名备用制药客户
        - 要求披露 United Therapeutics 任务排期和计划候选分子；向 Varda 询问活跃制药潜在客户讨论数量及其管线阶段
      - - SpaceX Transporter 拼车是唯一发射供应商
        - 所有 W 系列任务都使用 SpaceX Transporter 拼车；未披露合格的替代运载火箭；排期绑定 SpaceX 发射清单
