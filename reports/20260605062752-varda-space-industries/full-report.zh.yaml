      - number: '6.2'
        title: 政府防务客户——AFRL、U.S. Navy 与 Prometheus 框架
        blocks:
          - type: paragraph
            body: >-
              Air Force Research Laboratory 是 Varda 最重要、已确认的政府客户。2024 年 11 月，AFRL 宣布一份 $48 million、为期四年的合同，由 Varda 提供 W
              系列再入舱，作为高超声速载荷测试平台。该合同承接了更早的 Prometheus 项目资金，后者覆盖 W-2 和 W-3 任务。Prometheus
              的明确设计目标是「通过低成本、高频次飞行测试平台，加速在极端再入环境中开展新型科学与技术实验的能力」，而 Varda 舱体是支撑该项目的主要商业载具。运营层面：W-2（2025 年 3 月再入）搭载 AFRL
              OSPREE 光谱仪，完成 DoD 对 Mach 25+ 等离子体鞘套的首次原位光发射测量——这是任何地面设施都无法获得的数据。W-3（2025 年 5 月）搭载 AFRL 高超声速载荷。W-5（2026 年 1
              月）在 Prometheus 下搭载专用 U.S. Navy 载荷，聚焦再入过程中的数据采集。W-6（2026 年 5 月）搭载三项载荷：带嵌入式传感器、用于热防护系统（TPS）模型验证的 Sandia
              National Laboratories 鼻锥瓦；两块使用替代 C-PICA 生产方法的 NASA Ames 仪器化肩部瓦；以及面向 DoD 高超声速应用的自主导航载荷。


              2026 年 1 月，Department of Defense 的 Test Resource Management Center（TRMC）和 Naval Surface Warfare
              Center（NSWC）Crane Division 选择 Varda 与 Stratolaunch 进入 Multi-Service Advanced Capability Hypersonic Test
              Bed（MACH-TB）2.0 项目的 Task Area 3。该项目面向 Pentagon，在所有入选供应商中每年目标开展 50 次高超声速飞行测试，为 Varda 的再入服务建立了远超初始 $48
              million Prometheus 合同的多年需求信号。USASpending.gov 的一份交付订单确认 PIID FA945326FX002，执行期为 2025 年 11 月至 2026 年 9 月，内容是
              MACH-TB 2.0 下的月度状态报告。这段政府客户关系的范围和深度——横跨四次连续成功任务、两个正式项目，以及至少四个政府机构的具名参与——使防务板块成为 Varda 在 2026
              年最充分验证、持续性最高的客户板块。
