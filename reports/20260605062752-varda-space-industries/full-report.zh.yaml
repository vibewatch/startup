      - number: '7.2'
        title: 运营、质量与技术风险
        blocks:
          - type: paragraph
            body: >-
              Varda 的舱体设计带来极端运营要求：每次任务都让 W 系列飞行器暴露在流场超过 18,000 K 的持续等离子体加热、300 W/cm² 热流和 Mach 25+
              再入速度之下——任何热防护系统表现不足的舱体都会被摧毁。公司已连续完成六次成功任务；在一个单次失败就可能让初创公司破产的行业里，这是一项有意义的记录。不过，统计基础仍然很小，而到 2026
              年把任务节奏提高到接近每月一次，会压缩飞行后检查、异常调查和硬件迭代的时间。如果隔热罩完整性失效或降落伞异常导致舱体损失，运营、声誉和财务影响都会很重——政府 DoD 载荷损失很可能触发 Prometheus
              项目复审，药品载荷损失则会在商业关键时刻削弱 United Therapeutics 信心。


              药品处理领域的质量风险尤其尖锐。W-1 上的 ritonavir 结晶作为概念验证跑通了，但从单晶演示转向可重复、符合 GMP、足以支持 IND
              申报的制造批次，需要工艺验证、污染控制和文档体系；在轨环境中没有成熟先例。FDA 没有发布太空制造药品指南，Varda 也没有公开披露与 FDA Emerging Technology Program
              的任何接触。如果 W-4 或后续药品任务中的晶体降解、污染或未能达到药品规格，药品商业化时间线会被推迟，而且外界未必能看到公司公开承认失败。DoD
              载荷的网络安全风险属于机密，公开无法评估；但考虑到高超声速数据的防务情报敏感性，它仍是未解决缺口。
