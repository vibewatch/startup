      - number: '5.5'
        title: 关键依赖与运营约束
        blocks:
          - type: paragraph
            body: >-
              Varda 的平台依赖多项外部输入，这些输入会带来公司直接控制之外的排期、成本或运营风险。最基础的是 SpaceX 的 Transporter 拼车项目：每次 W 系列任务都搭乘 SpaceX
              发射，使任务时点取决于 Transporter 清单排期；这类排期通常每两到三个月提供一次发射。Varda 没有专属运载火箭，意味着拼车排期变化、载荷集成提前期和 SpaceX
              运营优先级都可能影响任务时点。W-1 的监管事件——舱体在轨停留八个月或更久，等待 FAA 和靶场协调——说明即便航天器功能正常，监管和外部靶场依赖也会制造实质现金流与运营风险。


              Southern Launch 的 Koonibba Test Range 是 W-2 到 W-6 的回收基础设施；双方签有约到 2028 年覆盖 20 次再入的合同，提供排期确定性。NASA 对 C-PICA
              的技术支持和授权降低了隔热罩供应风险，也是 Varda 从外部采购转向内部生产的关键。Rocket Lab Photon 依赖在 W-4
              已完全解除。要放大到目标中的每月任务节奏，公司需要扩展卫星平台和舱体生产供应链、提升员工自动化水平，并证明能同时运营多项在轨任务——W-4 与 W-5 曾短暂共存在轨，已经部分验证这一能力。
