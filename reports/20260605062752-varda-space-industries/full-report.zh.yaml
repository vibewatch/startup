      - number: '4.2'
        title: 防务高超音速测试台收入
        blocks:
          - type: paragraph
            body: >-
              Varda 的防务收入在结构上是最有锚点、目前也最重要的一段。公司的 W 系列再入舱在大气层再入时以约 Mach 25
              飞行，形成地面设施无法复现的真实飞行环境，可用于高超声速与再入技术测试。传统政府高超声速测试通常依赖定制化 Air Force 项目，历史上单次飞行成本超过 $100 million，频次也很低。Varda
              的商业替代方案提供可重复测试、材料回收，以及大幅更低的单次事件成本。


              $48 million 的 AFRL IDIQ 合同（USASpending.gov 已确认）代表政府在合同期内给出的明确承诺。按满负荷节奏下每年约四次任务平均计算，单这一合同工具就意味着约 $10-12
              million 的合同隐含年收入运行率——但实际单次任务订单金额并未公开分项。更早的 SpaceWERX STRATFI 奖项（含配套资本共 $60 million）覆盖两次轨道再入任务，并确立了 W-5、W-6
              以及未来可能与 DoD 对齐任务所使用的 Prometheus 项目框架。


              防务需求正在 AFRL 之外分散。W-5（2025 年 11 月）搭载了 U.S. Navy 载荷；W-6（2026 年初）为 NASA Ames Research Center 和 Sandia
              National Laboratory 搭载了导航与热防护载荷。这些合作说明 Varda 正在建立多机构政府客户基础，而不是依赖单一机构。公司也强调与 NASA 的合作：NASA 向 Varda 授权
              C-PICA 隔热罩技术，并提供 Flight Opportunities 项目支持，降低了隔热罩生产资本开支。


              防务收入流的一项关键财务风险是监管与排期延误。2023–2024 年 FAA 和 Air Force 未批准 W-1 再入时，舱体在轨停留数月，消耗运营资源却无法确认收入。未来任务——尤其是 AFRL
              任务订单下的任务——如果再入许可延迟，成本确认时点与现金流压力错配就有真实风险。AFRL IDIQ 的固定总价结构可能挡住合同层面的重定价风险，但运营时点滑移仍是财务敞口。
