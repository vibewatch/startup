  - id: TV003
    title: 牛市 / 基准 / 熊市情景表
    columns:
      - 情景
      - 关键假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 牛市
        - >-
          AFRL IDIQ 以 $80M+ 上限续签；额外 DoD / 盟国机构合同使国防收入到 2029 年达到年化 $150M；United Therapeutics 或第二家制药伙伴到 2030
          年许可一种新型多晶型；SpaceX 拼车价格稳定。
        - 若混合收入 $200–300M、按 15–20x 远期收入计，股权价值 $2.5–4.0B——为当前入场价的 1.6–2.5x。考虑资本强度，这算可行但不突出的创投回报。
        - 需要同时跑通国防扩张、制药 IP 和不中断的监管准入；三者同时发生的概率低于任一单项。
        - 低-中
      - - 基准
        - AFRL IDIQ 以类似 $48M 上限续签；通过美国海军、NASA、Sandia 订单，国防收入温和增至 $70–100M；制药到 2027–2028 年仍未产生收入；任务节奏达到每年六次。
        - 若 $70–100M 远期收入按 15x 计，股权价值 $1.0–1.5B——大致持平或略低于当前 $1.58B 入场价。执行达到预期，但所有上行已经计入价格。
        - 持平回报的下行是主要风险；即使执行良好，按 Series D 估值进入的新投资者也可能没有回报。
        - 中
      - - 熊市
        - 第二次监管搁置或任务失败压低任务节奏；DoD 预算削减使 AFRL 试验台资金低于 $48M；制药 IP 时间线延至 2032+ 且没有商业转化；SpaceX 拼车价格涨至 $10,000/kg。
        - 若低迷收入 $30–40M、按 10–12x 计，股权价值 $300–500M——当前入场价损失 65%+。科学专家称轨道制造「目前是一门风险业务」。
        - 基于 W-1 监管历史和国防预算波动，熊市触发项各自都独立可信。
        - 低-中
    notes: 情景使用收入倍数框架，因为公开证据不足以支撑 DCF 质量模型。收入假设是基于可观察合同上限、任务节奏和可比公司经济性的分析估算。
