      - number: '7.3'
        title: 合作伙伴与供应链依赖风险
        blocks:
          - type: paragraph
            body: >-
              Varda 的运营平台建立在少数关键外部依赖之上，任何一个依赖出问题，都可能在替代准备时间很短的情况下扰乱任务管线。迄今六次 W 系列任务全部使用 SpaceX Falcon 9 拼车作为唯一运载工具，Varda
              也公开确认到 2028 年已有 10+ 次任务预订在 Transporter 清单上。Falcon 9 机队停飞——例如 2023 年 8–10 月上面级异常后停飞 47 天——会传导到 Varda
              的发射排期，并可能促使政府客户寻找替代高超声速测试平台供应商。Politico 2026 年报道指出，约 $8 billion 风投支持的航天投资直接暴露于 SpaceX 运营连续性，Varda
              是与这一单一供应商绑定最深的公司之一。Varda 没有公开确认药品或防务任务的替代发射供应商。


              自 W-2 起，Southern Launch 及其位于 South Australia 的 Koonibba Test Range 是 Varda 的主要再入回收地点。Varda 宣布了一份约到 2028
              年覆盖 20 次再入的正式协议，South Australia 主管机构也确认了 2026 年第四个 Varda 舱体着陆。该靶场位置偏远、与社区有协作、且已在运营上得到验证，但也引入了 Varda
              控制之外的地理依赖（澳大利亚空域关闭、DoD 载荷返回出口许可，以及 Southern Launch 自身产能）。通过 Prometheus，Air Force Research Laboratory 实际上是
              Varda 当前防务收入的单一买方——如果 AFRL 预算被削减、重新分配，或 Prometheus 项目重组，Varda 会失去主要已确认收入来源。United Therapeutics
              在药品板块代表同等集中度风险：它目前是唯一具名药品客户，若退出或延期，将消除支撑药品授权逻辑和未来收入预测的商业药品概念验证。
