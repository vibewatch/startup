      - number: '5.3'
        title: W 系列技术架构与运营设计
        blocks:
          - type: paragraph
            body: >-
              W 系列系统可以拆成五层硬件栈：（1）作为运载工具的 SpaceX Transporter 拼车；（2）负责供电、姿态控制、推进和通信的轨道卫星平台；（3）药品处理或政府载荷模块；（4）带 C-PICA
              热防护的再入舱；（5）由 Southern Launch 管理的降落伞与地面回收基础设施。卫星平台演进是 W 系列历史上最关键的架构转变。W-1、W-2 和 W-3 使用 Rocket Lab 的
              Photon——一个可商业购买的现成卫星平台。自 2025 年 6 月发射的 W-4 起，Varda 用自研平台替代 Photon，完成全面垂直整合。W-5
              通过完整多周任务生命周期验证了自研平台，包括轨道机动和精确离轨点火。


              再入舱直径约 90 厘米，高 74 厘米，重量低于 90 公斤。再入时，舱体速度超过每小时 18,000 英里、达到 Mach 25+，承受约每平方厘米 300 瓦的热流，以及 18,000 Kelvin
              或更高的流场温度。C-PICA 烧蚀式隔热罩最初由 NASA Ames Research Center 开发，Varda 通过 NASA Tipping Point 奖项获得授权；从 W-4 开始，Varda 在
              El Segundo 内部生产。政府高超声速测试平台服务提供超过 100 瓦载荷功率，以及数十公斤内部质量容量。整套系统在每次任务中全程自主运行：轨道操作或处理的任何阶段都不需要宇航员参与。
