        - 低 — 6/6 任务成功；C-PICA 已在轨验证
        - 关键 — 载荷全损、任务失败、DoD 数据损失，并可能影响公共安全
        - 高 — 自研 C-PICA 制造、任务保障体系、多任务记录
        - 中 — 低概率但灾难性；没有冗余再入飞行器
        - 未公开披露飞行后热防护罩检查结果；异常历史未披露
      - - 在轨制药处理失败（污染、结晶不完全、API 降解）
        - 中 — W-1 已完成概念验证；基于溶液的处理在 W-4 上才开始
        - 高 — 任务收入无法确认；客户信心受损；IND 时间线后移
        - 中 — Varda 自研 CSO 领导制药科学；已确认与 Improved Pharma 合作
        - 高 — GMP 合规框架未定义；未公开描述在轨批次质量体系
        - 未公开披露 W-4 至 W-6 任务的制药质量指标；批次可重复性尚未确认
      - - SpaceX Falcon 9 拼车发射器异常
