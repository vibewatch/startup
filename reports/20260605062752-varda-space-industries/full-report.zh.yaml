      - number: '2.5'
        title: 采用约束、矛盾与证据缺口
        blocks:
          - type: paragraph
            body: >-
              最根本的采用约束是：还没有任何商业销售产品源自轨道制造——无论来自 Varda 还是任何竞争对手。Varda 自己的首席营收官（CRO）在 2025 AIAA conference
              承认，微重力生态绝大部分仍处于早期研究阶段，主要与大学和研究机构合作，距离生产型客户还很远。这一观察与 AIAA 的独立分析一致；AIAA 指出，高成本和不足的客户需求曾让此前每一波太空制造预测落空。首次 W-1
              ritonavir 晶体实验确实是技术成就，但它产出的是研究表征材料，不是可供患者使用的产品。


              监管风险进一步拉长时间线。任何在轨识别出的新制剂，在商业使用前都必须完成 IND 申报、Phase I 至 III 临床试验和 FDA 审评；这个过程通常需要七到十年和数亿美元投入。MIT Technology
              Review 明确指出，Merck 的 Keytruda 轨道结晶工作虽然带来了关于晶体形成的洞见，但并未直接产出最终获 FDA 批准的皮下注射制剂。轨道实验到货架药物之间没有直线连接。


              太空制造市场数据本身存在重大矛盾：TBRC 对 2025 的基准约 $1.2–1.6 billion，而 6W Research 对同一时期的估计为 $4.1
              billion，意味着分析师对当前市场规模的分歧达到三倍以上。缺少方法论、地域和范围假设的透明度，就无法判断哪个估计更可靠。Varda 没有披露 SAM、SOM 或定价模型；United Therapeutics
              合作和 AFRL $48 million 合同的财务条款（包括已义务化和已确认收入金额）也不在公开记录中。这些证据缺口阻止外部对 Varda 两个板块近期收入潜力做出严谨自下而上的测算。
