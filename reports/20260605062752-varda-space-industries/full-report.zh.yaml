      - number: '4.4'
        title: 单位经济模型、成本结构与毛利率
        blocks:
          - type: paragraph
            body: >-
              公开来源几乎看不清 Varda 的单位经济模型。公司没有披露单次任务收入、毛利率、销售成本或单元运营成本拆分。外部分析师估计（来自 Tracxn 及类似数据提供商）把 2025–2026 年总收入放在约
              $40-60 million，但该数字未经公司确认，必须按粗略第三方估算处理。公开信息可以部分反推单次任务经济性，但不确定性很高。


              成本侧最清晰的数据点是 SpaceX 拼车发射价格。Falcon 9 Transporter 拼车在 2026 年涨至约每公斤 $7,000（2024 年为 $6,000）。据 Scientific
              American 报道，Varda 的 W 系列卫星平台重约 300 公斤，仅卫星平台就意味着 $2-$3 million 的发射成本——还未计入再入舱质量、自研卫星硬件、人员、靶场运营和回收物流。Varda
              管理层曾提出单次任务成本目标：借助制造学习曲线和硬件复用，从早期节奏下约 $12 million 降至满负荷每月一次时的 $2.5 million。公司没有披露当前单次任务成本。


              毛利率驱动因素未知。政府测试平台任务采用固定总价 IDIQ 时，利润取决于谈判后的任务订单金额相对于实际任务成本的差额。如果 Varda
              达成降本目标，防务任务利润率在合同生命周期内可能变得可观。药品任务的毛利率则完全取决于任务费加上版税潜力能否覆盖全部任务成本；在早期、只有一个客户的阶段，单位经济性相较长期目标很可能不利。


              作为硬件公司，Varda 的营运资本动态并不典型：航天器制造要求在发射前投入大量材料和人工成本，而政府任务订单的收入可能要到数据或材料交付后才确认（形成时点缺口）。资本密集的 Mattel
              园区租赁和药品实验室建设都是固定成本，会放大经营杠杆——如果任务量放大，这是利好；如果没有放大，就是拖累。按 2026 年 3 月 LA Times 报道，设施装修资本开支预计需要 4–8 个月建设时间，说明
              2026 年有大量资本被投入在短期无法产出的资产上。
