  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入流与商业架构
        blocks:
          - type: paragraph
            body: >-
              Varda 的财务架构最好理解为带有投机性版税尾部的资本密集型服务业务。公司今天从两条服务流收费——政府高超音速测试台飞行和制药载荷处理——同时投资实验室和 IP
              生成基础设施，管理层预期这些投入会在中期产生专利版税收入。这种双重结构不是偶然：Varda 创始人设计平台时，就让防务合同现金流补贴每次面向制药的任务成本，因为纯轨道制药制造的经济性在商业规模上仍未验证。


              政府收入流是公开披露中最具财务确定性的元素。AFRL $48 million、四年期 IDIQ 合同已由 USASpending.gov 确认（合同号 FA9453-25-F-X010），锚定防务收入至大约
              early 2028。更早的政府支持包括 2023 年 $60 million SpaceWERX STRATFI 奖项，结构为 $15 million SBIR 资金、$15 million 政府配套和 $30
              million 私人投资。这些已知政府合同是外部尽调团队能看到的最清晰收入信号。


              制药收入流处在更早阶段。Varda 已确认一个具名商业客户——United Therapeutics——对应 May 2026
              合作，但财务条款未公开。公司披露的制药定价模式，是按在轨生产或表征的活性药物成分（API）商业价值收取抽成，类似 Halozyme 和 MannKind 这类基于版税的再配方专家。由于 API
              价值差异极大——MIT Technology Review 指出，Ozempic 单公斤活性成分按零售价价值超过 $100
              million——这一模式可能让高端候选药物的单次任务产生可观收入，但完全取决于能否证明商业上可申请专利的结果。


              新兴 IP 和授权收入流具有战略意义，但尚未产生收入。Series C 明确资助了 El Segundo 的 10,000-square-foot
              制药结晶实验室，配备结构生物学家和结晶科学家，目的正是先做预筛选，让轨道任务更可能产出可专利化多晶型。尚未宣布任何授权。在源自 Varda
              轨道加工或受其显著推动的药物获得监管批准并进入商业销售之前，这条收入流仍只是理论上行。
