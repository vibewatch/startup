  - id: TU003
    title: 具名客户证明表
    enumeration: true
    columns:
      - 客户
      - 细分
      - 部署 / 用例
      - 生产 vs 试点
      - 结果（公开证据）
      - 限制
    rows:
      - - 美国空军研究实验室（AFRL）
        - 政府 / 国防
        - 高超音速测试平台——Prometheus 项下，W-2、W-3、W-5、W-6 搭载多个载荷
        - 生产等效（已签约、已飞行、已回收、数据已交付 DoD）
