        - 要求披露 Varda 的发射多元化计划；评估是否有任何 W 系列变体已获得非 SpaceX 拼车资格
    notes: 集中风险是基于具名客户、已披露合同和竞争定位等公开信息作出的定性评估。Varda 未公开披露收入集中度数据（例如来自 AFRL 的收入占比）。影响评级为作者评估，并非已披露指标。
