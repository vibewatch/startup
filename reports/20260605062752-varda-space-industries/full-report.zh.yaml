  - id: FV001
    title: 建议逻辑——从运营证明、估值和风险推导投资决策
    type: flow
    layout: wide
    summary: Varda 的投资决策来自强运营证明与偏高价格标记、薄弱财务披露之间的拉扯；制药科学不确定性和 SpaceX 依赖是主要摇摆因素。
    data:
      nodes:
        - id: ops-proof
          label: 运营证明
          detail: 连续六次轨道再入成功、FAA 无上限运营商许可证、AFRL IDIQ 确认为 $48M，以及 W-5/W-6 多机构 DoD 载荷，展现出罕见的执行质量。
          tone: positive
        - id: defense-revenue
          label: 国防收入锚
          detail: 已确认的 $48M AFRL 四年 IDIQ 加上 SpaceWERX STRATFI $60M，构成最清晰的近期收入基础。多机构参与正在拓宽。
          tone: positive
        - id: pharma-upside
          label: 制药 IP 上行
          detail: United Therapeutics 合作和 El Segundo 制药实验室承载长期特许权使用费逻辑，但全球尚无任何轨道制造药物获得 FDA 批准。
          tone: warning
        - id: valuation-mark
          label: $1.58B 进入价格
          detail: 约等于 AFRL 合同上限的 33x；需要国防收入显著放大，和 / 或制药 IP 在商业化时间线内落地。
          tone: warning
        - id: disclosure-gap
          label: 财务披露缺口
          detail: 没有公开收入、毛利率、烧钱速度、优先股堆叠或单任务经济性；承销必须依赖完整的非公开资料室。
          tone: warning
        - id: concentration-risk
          label: SpaceX / AFRL 集中
          detail: 六次任务全部使用 SpaceX Falcon 9；国防收入集中在单一 AFRL IDIQ；CEO 关键人物依赖已有记录。
          tone: negative
        - id: decision
          label: 继续研究
          detail: 运营质量足以支撑继续接触。价格和披露缺口使其在没有非公开尽调前无法给出买入建议。承销前必须拿到资料室。
          tone: neutral
      edges:
        - from: ops-proof
          to: decision
        - from: defense-revenue
          to: valuation-mark
        - from: pharma-upside
          to: valuation-mark
        - from: valuation-mark
          to: decision
        - from: disclosure-gap
          to: decision
        - from: concentration-risk
          to: decision
    approximationNotes: null
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV005
      - CV006
      - CV034
      - CV037
  - id: FV002
    title: 估值敏感性——不同倍数下支撑 $1.58B 进入价格所需收入
    type: bar
    layout: standard
    summary: 当前 $1.58B 价格只在极高收入倍数下才舒服。按 Redwire 可比的 11x 倍数，Varda 年收入需要超过 $140M，远高于公开可验证基础。按 RKLB 可比倍数，即使收入不高也能支撑当前价格。
    data:
      items:
        - label: 10x 下所需收入
          value: 158
          unit: USD millions annually
          detail: 支撑 $1.58B 估值、对应 Redwire 可比 EV/sales 倍数所需收入。
          tone: negative
        - label: 15x 下所需收入
          value: 105
          unit: USD millions annually
          detail: 对应中等成长阶段国防硬件倍数所需收入。
          tone: warning
        - label: 25x 下所需收入
          value: 63
          unit: USD millions annually
          detail: 对应高成长太空 / 国防溢价倍数所需收入。
          tone: neutral
        - label: 50x 下所需收入
          value: 32
          unit: USD millions annually
          detail: 对应 RKLB 区间低端高成长类比倍数所需收入。
          tone: positive
        - label: AFRL IDIQ 上限（参照）
          value: 48
          unit: USD millions total contract (not annual)
          detail: 已确认的四年 IDIQ 上限；年化约为 $10-12M/yr——按任何常规倍数，单靠它都不足以支撑当前价格。
          tone: warning
        - label: 估计国防收入（基准情景）
          value: 70
          unit: USD millions annually (estimated, mid-point of base case range)
          detail: 对基准情景任务节奏下国防收入的分析估计，包括 AFRL + Navy/NASA/Sandia 订单；非公司确认。
          tone: neutral
    approximationNotes: 收入阈值是简单 EV/revenue 桥接，基于 2026 年 2 月 Series D 投后估值 $1.58B。公开证据不足以做 DCF 模型。除 AFRL IDIQ 上限外，所有收入数字都是分析估计。
    claimRefs:
      - CV007
      - CV017
      - CV018
      - CV019
      - CV023
      - CV024
      - CV025
  - id: FV003
    title: 估值 / 回报区间——在明确假设下的悲观、基准、乐观股权价值
    type: range
    layout: wide
    summary: 估值区间很宽，反映国防收入放大和制药 IP 时点确实不确定。基准情景在当前进入价格下回报大致持平；新投资人要获得 VC 级回报，需要更低进入价格或对乐观情景有足够确信。
    data:
      items:
        - label: 悲观情景
          low: 300
          mid: 400
          high: 500
          displayValue: $300M–$500M
          detail: 任务节奏受扰、制药停滞、国防收入低于 $40M/yr。在 10–12x 低迷收入下，股权价值比 $1.58B 进入价格低 65–81%。触发因素：监管暂停或 AFRL 不续期。
          tone: negative
        - label: 基准情景
          low: 1000
          mid: 1250
          high: 1600
          displayValue: $1.0B–$1.6B
          detail: AFRL IDIQ 以相近规模续期，国防收入温和增至 $70–100M/yr，制药到 2027–28 年仍未产生收入。按 15x 远期收入，股权价值大致持平于进入价格。风险：良好执行已经被计入价格。
          tone: warning
        - label: 乐观情景
          low: 2500
          mid: 3200
          high: 4000
          displayValue: $2.5B–$4.0B
          detail: AFRL 显著扩张，国防收入达到 $150M+/yr，制药 IP 授权到 2030 年产生特许权使用费。按 15–20x 混合收入，股权价值为进入价格的 1.6–2.5x。需要三条执行线同时跑赢。
          tone: positive
        - label: 当前进入价格（Series D）
          low: 1580
          mid: 1580
          high: 1580
          displayValue: $1.58B
          detail: 2026 年 2 月 Series D 投后估值。所有情景回报计算的参照点。
          tone: neutral
    approximationNotes: 所有数字都是用于投委会讨论的情景化分析估计。它们不是管理层指引、经审计财务预测或折现现金流输出。
    claimRefs:
      - CV001
      - CV024
      - CV025
      - CV026
      - CV027
  - id: FV004
    title: 投资 KPI——面向 IC 的市场、证明、护城河、经济性、风险、估值和证据质量评分
    type: kpi
    layout: standard
    summary: Varda 在运营证明和监管位置上得分强，但财务披露、经济性可见度和估值支撑明显偏弱。整体画像更符合继续研究，而不是买入建议。
    data:
      items:
        - label: 市场机会
          score: 7
          detail: 国防高超音速试验平台市场全球约 ~$5.4–5.7B，CAGR 11–12%；制药轨道制造可触达市场很大，但缺乏商业先例，仍有投机性。评分反映的是已确认国防需求，而非制药潜力。
          tone: positive
        - label: 运营证明
          score: 8
          detail: 连续六次任务成功、FAA 无上限运营商许可证、六次任务记录并包含 W-6 自主导航验证。对私营太空硬件公司而言异常强。
          tone: positive
        - label: 竞争护城河
          score: 7
          detail: 唯一提供商业高超音速再入试验平台即服务并能返回材料的公司；FAA 运营商许可证构成监管壁垒；硬件 IP 可部分保护。SpaceX 可能进入，但目前是客户和伙伴，还不是竞争者。
          tone: positive
        - label: 收入质量
          score: 4
          detail: 政府 IDIQ 是由合同支撑的高质量收入，但已确认上限较小；制药收入仍在商业化前；IP 授权带有投机性。没有公开收入数字可锚定质量评估。
          tone: warning
        - label: 财务可见度
          score: 2
          detail: 没有公开收入、毛利率、烧钱速度或单位经济性。估计年度烧钱 $60–120M。无经审计账目或 SEC 文件。这是投资逻辑中最不透明的维度。
          tone: negative
        - label: 风险画像
          score: 3
          detail: SpaceX 依赖、AFRL 合同集中、CEO 关键人物风险、制药科学不确定性和再入监管依赖，在公开证据中都仍未缓释。高风险评级合理。
          tone: negative
        - label: 估值支撑
          score: 4
          detail: $1.58B 价格需要在已确认合同之外显著放大收入。基准情景回报持平；只有乐观情景能解释按当前进入价格获得 VC 级回报。价格偏高，但并未明显脱离行业倍数。
          tone: warning
    approximationNotes: 评分是为投委会讨论而从公开证据集中综合出的 0–10 序数判断，不是定量输出。
    claimRefs:
      - CV003
      - CV004
      - CV005
      - CV006
      - CV015
      - CV022
      - CV025
      - CV032
      - CV034
