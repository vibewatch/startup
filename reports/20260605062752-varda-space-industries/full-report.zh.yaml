      - number: '1.4'
        title: 任务里程碑、监管拐点与反向背景
        blocks:
          - type: paragraph
            body: >-
              早期决定性里程碑是 W-1。Varda 在 June 2023 借 SpaceX 发射首个任务，使用 Rocket Lab Photon bus，在微重力下生产 Form III
              ritonavir，随后发现单靠技术成功并不能创造可运营的业务。胶囊在轨停留数月，因为 FAA 许可和 Utah 靶场协调尚未为商业陆地再入形成常态流程。FAA 的 2024 认定和决定最终授权 Varda 在
              UTTR South 或 Northern Dugway 进行再入操作，W-1 于 February 2024 返回，成为首个在美国本土着陆的商业航天器。这一事件既是监管进展的勋章，也提醒投资人：Varda
              的系统依赖许可、靶场和责任分配，这些并不完全在其直接控制之内。


              下一阶段看节奏和多元化。W-4 在 2025 以 FAA 首张再入载具运营商许可证首飞下一代航天器。W-5 和 W-6 在 2026 把模型延伸到国家安全载荷、自主导航和热防护测试，同时 NASA 支持的
              C-PICA 热盾生产进一步内化。AFRL 的 $48 million 合同和 Prometheus 资助飞行表明，政府需求已经把胶囊作为高超音速测试台变现。与此同时，United Therapeutics
              合作是最清晰的公开证据，说明 Varda 正试图把轨道制药从实验转为产品开发。需要谨慎的是，即便立场友好的报道仍称该业务商业上尚未验证：尚无空间制造药物上架，经济性看起来只对最高价值产品成立。
