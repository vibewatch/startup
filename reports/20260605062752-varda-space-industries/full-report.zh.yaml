      - number: '5.4'
        title: 信任、质量、合规与安全控制
        blocks:
          - type: paragraph
            body: >-
              Varda 最强的公开信任资产是任务安全记录：六次 W 系列任务全部成功带回舱体和载荷，并连续六次在计划着陆点回收——W-1 在 UTTR，W-2 到 W-6 在 Koonibba Test Range。公司持有
              FAA 首张 Part 450 再入飞行器运营商许可证，该许可证在 2025 年 6 月 W-4 任务时签发，有效期至 2029 年。这张许可证取消了逐次任务 FAA 审批流程；此前 Utah Test and
              Training Range 拒绝优先安排商业着陆，导致 W-1 再入延误八个月或更久。NASA C-PICA 技术许可确认隔热罩材料达到 NASA Ames 验证的航天级标准。AFRL
              任务保证要求则通过多个成功的 Prometheus 项目任务得到展示，这些任务完成 DoD 载荷回收，并获得 AFRL 公共事务批准声明。


              药品制造的信任图景仍有实质缺口。Varda 没有公开声称其轨道处理载荷获得 GMP 或 cGMP 认证——这是太空制造药物进入临床使用的前提。公开渠道没有发布失效模式分析、FMEA
              或可靠性统计。六次任务成功记录在运营上令人鼓舞，但样本量太小，不足以成为小规模舰队可靠性估计的统计基础。Scientific American
              的专家评论指出，轨道结晶条件「极其难以控制」，结晶时点不可预测。从轨道结晶走向商业药品供应的质量控制路径，在公开来源中尚未定义。
