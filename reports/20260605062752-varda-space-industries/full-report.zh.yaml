      - 时点
      - Varda 影响
      - 尽调要求
    rows:
      - - SpaceX 发射节奏（Falcon 9 约每 2–3 天一次）
        - 驱动
        - 当前
        - 让轨道资源可预订、可预测；制药开发项目可以把多年任务排期嵌进去
        - 确认到 2028 年前发射的前置预订可见度和价格稳定性
      - - 美国国防部（DoD）高超声速支出上升（Golden Dome；众议院法案中 2026 财年高超声速预算 $2.6B+）
        - 驱动
        - 当前至 2030
        - 扩大可服务的国防测试平台市场；AFRL Prometheus 合同是切入更大项目管线的滩头堡
        - 识别 AFRL 之外哪些项目办公室正在积极沟通；确认 Golden Dome 是否为商业再入服务创造新科目
      - - 单克隆抗体市场以 12.7% CAGR 增长，2035 年约达 $936B
        - 驱动
        - 中期（3–7 年）
        - 大型生物制药上游 TAM 提供候选池；生命周期管理压力推动制药研发采用新制剂策略，包括轨道处理
        - 确认活跃单抗管线中有多大比例存在重力敏感的制剂挑战；独立测算该子集规模
      - - 当前没有太空制造药物进入药房货架
        - 约束
        - 当前；可能需要 7–10+ 年解决
        - 来自药品销售的商业制药收入今天为零；当前收入来自服务费和政府合同；采用缺口期需要持续风险资本支撑
        - 要求按细分市场和合同类型拆分收入；确认首个使用 Varda 衍生数据的候选药物进入临床试验的时间线
      - - 轨道实验后，监管路径还要求 IND/NDA/BLA 以及 I–III 期临床试验
        - 约束
        - 长期（至少 7–10 年）
        - 即便是 United Therapeutics 合作，任何产品触达患者前也要多年；近端价值是知识产权和许可收入，不是产品销售
        - 索要法规事务团队配置计划和 FDA pre-IND 沟通记录
      - - 发射成本底线仍约 $7,000/kg；制药 SAM 在经济上限于极高价值分子
        - 约束
        - 当前；缓慢改善
        - 仿制药、低利润生物制剂和多数小分子无法吸收发射经济性；制药 SAM 由候选药物的 $/gram 价值卡住
        - 按 Varda 声称的管线建模候选药物经济性；识别单次任务盈亏平衡定价
    notes: 增长驱动因素和约束对两个细分市场的作用力度不同。国防需求更近端，有预算支撑；商业制药需求更远期，取决于临床开发。公司估值必须基于一组收入组合承销：当前国防占比高，制药仍偏愿景。
