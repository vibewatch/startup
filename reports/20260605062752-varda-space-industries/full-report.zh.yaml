      - number: '3.5'
        title: 现状和地面替代品
        blocks:
          - type: paragraph
            body: >-
              任何太空制造平台最常见的替代方案，就是根本不去太空。制药制剂科学家日常使用地面合同研究组织进行蛋白结晶、多晶型筛选和制剂开发，成本和时间只是轨道任务的一小部分。标准行业方法——高通量结晶机器人、共晶筛选、喷雾干燥、热熔挤出和超临界流体处理——已经覆盖绝大多数药物制剂挑战。太空的商业论点是，微重力能够带来在地球上物理上不可能或经济上不现实的晶体结构或工艺条件。但在有商业销售产品源自轨道制造之前，对风险厌恶的制药客户而言，这个论点仍停留在理论层面。Varda
              自己的首席营收官在 2025 AIAA conference 确认，没有空间制造产品摆上药房货架；AIAA
              的独立分析也指出，高成本和不足的客户需求曾让此前每一波太空制造预测落空。这是竞争图景中最重要的反向事实：只要特定分子的微重力优势尚未得到证明，现状替代品就会在每次客户评估中默认胜出。


              防务高超音速测试台板块的主要现状替代品，是政府拥有的探空火箭和风洞设施，它们能以更低的单测试点成本近似再入条件；另有政府项目办公室，历史上会委托定制专用测试载具，而不是使用商业胶囊。这些替代品无法完全复现
              Mach 25+ 轨道再入的气动-热-化学环境，这正是 AFRL 将 Prometheus 相关合同授予 Varda 商业平台的原因。对防务主承包商来说，内部自建替代方案——自行建造专有胶囊——理论上存在，但截至
              2026，在小载荷商业再入测试台板块尚未被采用。
            claimRefs:
              - CP018
              - CP019
              - CP027
              - CP033
              - CP037
      - number: '3.6'
        title: 护城河耐久性、替代风险与反向证据
        blocks:
          - type: paragraph
            body: >-
              Varda 的竞争位置建立在五个相互作用的优势之上。这些优势真实存在，但正以不同速度被侵蚀。第一，飞行履历：截至 W-6 的六次轨道再入任务给了 Varda
              领先优势，同行飞过一次或零次演示任务无法立即追上；但每一次 ATMOS 或 Space Forge 发射都会缩小这个差距。第二，FAA Part 450
              再入载具运营商许可证——首张发给商业运营商的此类许可证——至少为任何试图在美国空域运营的新进入者制造 12–18 个月监管提前期，形成近期可防守壁垒。第三，双用途收入：AFRL $48 million 防务合同和
              W-5 Navy 载荷确认 Varda 今天已获得商业防务收入，而基于 ISS 的制药竞争对手无法提供高超音速测试台服务。第四，垂直整合：Varda 从 W-5 起内部制造 C-PICA 热盾，并整合卫星
              bus、胶囊和任务运营，能降本并加快迭代，低整合度同行难以匹配。第五，制药客户锁定：客户若已在 Varda 特定微重力环境中表征其候选药物——包括振动剖面、热环境和 g-force
              历史——一旦切换到物理特性不同的载具，将面临实质性重新表征成本。


              替代风险需要如实描述。Payload Space 的 2025 再入市场回顾把 ATMOS 认定为首个完成胶囊再入的欧洲同行，标志着 Varda 在商业胶囊返回上的临时地理垄断结束。NASA 有意把 C-PICA
              授权给多家商业供应商，意味着热盾技术并非 Varda 独占；Space Forge 等公司也能获得同一材料。United Therapeutics
              合作虽然意义重大，是首个具名商业制药伙伴，但它仍只是一个公开确认客户——买方尽调会标记这一集中度风险。Redwire 的工业规模 ISS 结晶器可能满足部分制药客户的批量规模需求，而不需要轨道再入，从而降低市场对
              Varda 自由飞行平台必要性的感知。结构上最不利的情景仍是 SpaceX 在 Dragon 变体或未来平台内部以边际成本提供专用制药制造能力，利用其发射频率和既有载具摊销，把价格压到远低于 Varda
              的全成本任务价格。
