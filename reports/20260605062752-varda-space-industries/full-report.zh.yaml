        - AFRL 合同到期 / 未续签；国防项目办公室优先级变化；ATMOS WORKS 正在建立欧洲国防订单簿
        - 高 — 制药收入尚未商业化；国防集中在单一合同，存在风险
        - 要求提供 AFRL 合同续签条款和期权行使记录；建立制药收入多元化证据
      - - 垂直整合 — W-5 起内部掌握卫星平台、C-PICA 热盾、胶囊和任务运营
        - 竞争对手可从 NASA 授权 C-PICA（非排他）；也可采购或集成商业卫星平台
        - 中 — 今天的集成优势真实存在；随着 C-PICA 扩散、卫星平台选择增多，优势会减弱
        - 确认 NASA C-PICA 被许可方名单；评估 Space Forge 或 ATMOS 是否已取得该技术
      - - C-PICA 热盾 — NASA 授权的烧蚀式 TPS，用于 W-5 和 W-6
        - NASA 自称已向多家商业提供商授权 C-PICA；并非 Varda 独占
        - 中 — Varda 内部制造带来成本护城河，但知识产权不是自有
        - 识别当前 C-PICA 被许可方；评估 Varda 制造诀窍是否形成持久成本优势
      - - 制药客户锁定 — 客户切换飞行器需要重新表征，成本高
        - 制药客户可同时多栖 Varda 和 ISS 平台；未确认排他性
        - 中-高 — 切换成本真实存在，但不是合同约束；多栖风险具备结构性
        - 要求提供 United Therapeutics 和其他协议中的排他性或最低任务承诺证据
      - - 靶场准入（UTTR、Koonibba Test Range）— Varda 拥有运营关系和持牌时段
        - 新进入者正在谈判自己的靶场准入（ATMOS 使用欧洲靶场）；UTTR 容量与政府用户共享
        - 低-中 — 靶场准入并非完全专有；新进入者的地域多元化降低对 Varda 靶场的依赖
        - 确认 Koonibba 协议条款和量承诺；评估 UTTR 可供竞争进入者使用的时段
    notes: 严重程度评级基于公开证据和竞争信号作定性评估。高严重程度不意味着即将失败，只表示尽调优先级更高。
