      - number: '8.5'
        title: 退出准备度：IPO 窗口存在，但二级市场才是近期流动性路径
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年 6 月，Varda 的退出画像显示有多条可行流动性路径，但没有一条迫在眉睫。公司已经达到独角兽状态，在 Forge Global 和 Nasdaq Private Market
              等平台有活跃二级市场交易，也被 PitchBook 和 CB Insights 跟踪为 IPO 前投资机会。这些平台引用的私募股权分析师预计，IPO 窗口会在 2026 年底或 2027
              年打开，前提是市场条件配合且任务继续执行。近期老股交易超过 $124 million，说明早期投资者和员工已经能获得部分流动性；也意味着公开发行并不是被迫解决退出通道。


              M&A 备选路径现实存在，而且在某些结果下可能比 IPO 更能最大化价值。Varda 的高超音速再入能力、自研 W-series 胶囊硬件、FAA 载具运营商许可证和既有 DoD
              关系，对寻求商业航天制造敞口的国防主承包商是一组有战略价值的资产。Northrop Grumman、L3Harris 和 Leidos 近年都通过收购扩充了航天和高超音速能力；SpaceX 潜在 IPO
              也可能带来对独特再入基础设施的二级收购需求。制药 IP 维度对纯国防收购方吸引力较弱，但可能吸引偏制药的战略投资者，例如希望获得新型 IP 管线的大型生物科技公司，或合同开发和生产组织。


              市场预计 SpaceX 将在 2026 年 IPO，估值可能超过 $1.5 trillion；这会重塑航天硬件同行的估值倍数，可能把可比公司倍数向上拉，并扩大公开市场对该板块的胃口。这是 Varda IPO
              时点的外部顺风，但也带来风险：如果 SpaceX 上市后立即重定价整个板块，Varda 自己的 IPO 估值预期也可能需要拿一个大得多的基准重新校准。
            claimRefs:
              - CV031
              - CV032
              - CV033
              - CV034
              - CV035
              - CV036
      - number: '8.6'
        title: 尽调索取项、证据缺口和投资逻辑断裂触发器
        blocks:
          - type: paragraph
            body: >-
              Varda 的投资逻辑建立在方向上很强、但数量上不完整的证据之上。运营执行记录充分；财务表现几乎完全未披露。按 Series D
              标记进入的投资者，至少需要拿到以下资料室项目，才能建立承销确信：按分部拆分的实际收入和增长率；毛利率与单次任务成本；截至最近一个季度的烧钱速度和确切现金余额；Series D
              优先股堆叠，包括清算权、反稀释条款和任何棘轮；United Therapeutics 合作的财务条款；单一客户收入集中度；以及 $48 million IDIQ 下剩余的 AFRL 任务订单管线。


              最大的证据缺口是制药商业化不确定性。截至 2026 年 6 月，全球还没有任何太空制造药物获得 FDA 批准。Scientific American 2026
              年报道及其引用的独立科学家强调，从轨道结晶结果走到获批商业产品，通常需要五到十五年，而且从轨道晶体数据到药品销售之间，还没有被证明的直线路径。Varda 的 El Segundo
              制药实验室用于在投入轨道任务前筛选候选物，这在运营上合理，但不会加快 FDA 监管时钟。若投资者把制药 IP 计入 Varda $1.58 billion
              估值的重要组成部分，就必须明确假设多年时间表，并据此折现。


              否决标准是可知的，也应按季度监控。第二次监管暂停若延误或取消已确认的 AFRL 任务订单，将说明 FAA 许可证尚未完全解决 W-1 的监管模式。SpaceX 拼车价格若升至每公斤 $10,000
              以上，将实质性改变所有非国防任务的经济性。CEO Will Bruey 若在没有预先指定继任者的情况下离职，将带走与 AFRL、FAA 和 DoD
              项目经理之间最核心的关系资本。未来任何一轮股权融资若出现降价轮，都将确认 Series D 时的 $1.58 billion 估值超过了当时证据基础。
