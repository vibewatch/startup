      - number: '3.3'
        title: 基于 ISS 的制造和研究平台
        blocks:
          - type: paragraph
            body: >-
              四家成熟运营商通过国际空间站（ISS）提供微重力准入，服务与 Varda 目标客户重叠的制药和生物科技研究板块，但它们没有独立再入载具，也没有专用自由飞行平台。


              Redwire Corporation（Jacksonville, FL；NYSE: RDW）是商业化程度最高的 ISS 制药竞争对手。August 2025，Redwire 推出 SpaceMD——一个专门用
              Pharmaceutical In-Space Laboratory（PIL-BOX）在太空商业化制药开发的专项事业子公司。截至当时，28 台 PIL-BOX 单元已飞入太空，并结晶 17 种化合物，包括
              insulin。April 2025，Redwire 向 ISS 发射高通量 Industrial Crystallizer，可处理比原始 PIL-BOX 大最多 200
              倍的样本，代表从实验室规模转向具备商业相关性的批量规模。September 2025，NASA 选择 Redwire 执行一项五年、$25 million
              合同，牵头太空生物科技和材料科学研究，为其提供持久政府收入锚点。SpaceMD 还与 ExesaLibero Pharma 签署授权和版税协议，基于 PIL-BOX 结果支持骨病药物（ELP-004）的 IND
              申请。Redwire 模式的关键限制是结构性依赖 ISS：它不能运行独立自由飞行任务，要争夺 ISS 乘员时间和排期，制造活动还受 ISS 约 2030 退役计划约束。


              Space Tango（Lexington, KY）在 ISS 上提供模块化 CubeLab 自动化制造平台。TangoBox 是由 NSF SBIR Ignite 资助的下一代系统，建立在 CubeLab
              已验证能力之上，瞄准自动化细胞培养、组织培养、3D 打印和纳米材料。ISSCOR 实验室由近 $5 million NASA 资金支持，并与 UC San Diego 的 Sanford Stem Cell
              Clinical Center 合作，支持微重力下的转化干细胞研究。Space Tango 的 NASA 和 NSF 资金流确认了机构可信度，但公司缺少任何可与 Varda 胶囊相比的返地产品制造能力。


              SpacePharma（Switzerland/Israel）通过纳卫星（DIDO 和 SPAd 系列）及 ISS
              任务，为制药和生物实验提供微型化芯片实验室（lab-on-a-chip）平台，支持端到端自动化操作和实时远程监控。SpacePharma
              成本低于自由飞行平台、部署更快，纳卫星任务瞄准蛋白结晶、癌症模型和组织工程。根本限制在于 SpacePharma
              不把制造出的材料带回地球——其价值在数据和表征，而非产品产出——因此对需要实物材料开展制剂工作的制药客户适用性有限。


              Voyager Technologies（NYSE: VOYG）作为 ISS 集成和任务管理经纪商，为制药药物发现客户提供服务。January 2026 与 Space LiinTech 签署的 ISS
              蛋白结晶合同，使 Voyager 成为一条竞争性准入路径，尤其适合那些在投入专用自由飞行平台前，先寻求成熟 ISS 环境的客户。
