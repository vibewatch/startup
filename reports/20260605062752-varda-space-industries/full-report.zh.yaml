  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品平台概览与模块图谱
        blocks:
          - type: paragraph
            body: >-
              Varda Space Industries 运营的是其官方材料所称全球唯一可商业获得、无需宇航员操作的轨道制造与再入平台。W
              系列是核心产品：一艘自由飞行的轨道航天器，在微重力中处理材料，并把材料装入可回收再入舱带回地球。公开材料把平台围绕两类主要客户用途展开——药品结晶和政府高超声速再入测试——两者共用同一套硬件基础设施。轨道卫星平台提供轨道保持、供电和通信；载荷模块在微重力下自主处理材料；再入舱把结果带回指定着陆区。


              从 W-4 开始，Varda 在其 El Segundo 总部和制造设施内完全自行设计并制造卫星平台、载荷模块、舱体和隔热罩，形成端到端垂直整合。由 2025 年 Series C 融资支持的 10,000
              平方英尺药品结晶实验室，在 El Segundo 地面运行，用于在投入任务舱位之前预筛选哪些候选药物适合上轨。Varda 描述了两种不同的药品载荷配置：W-1 到 W-3 使用的熔融结晶模块，以及 W-4
              引入的流体式溶液结晶模块；后者更接近地面药品实验室控制小分子药物粒径和晶型的实践。
