        - 将载荷集成到 W-series 再入舱；在 Mach 25+ 再入过程中采集原位数据；从 Koonibba 回收硬件和数据
        - OSPREE 首次原位测得 Mach 25+ 等离子体光学发射；Navy 和 Sandia 获取了地面测试无法获得的传感器和材料性能数据
