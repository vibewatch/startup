  - id: TR001
    title: 监管 / 法律风险登记表
    columns:
      - 规则 / 许可证 / 案件
      - 司法辖区
      - 状态
      - 可能性
      - 严重性
      - 缓释措施
      - 剩余暴露
      - 尽调路径
    enumerationScope:
      coverage: partial
      basis: >-
        Rows cover all identified regulatory and legal obligations that publicly bear on Varda's reentry operations and
        pharmaceutical development as of June 2026. Non-public litigation, undisclosed regulatory correspondence, and
        classified DoD compliance requirements are not included. Ordered by descending severity.
    rows:
      - - FAA Part 450 飞行器运营方许可证到期（2029）
        - 美国联邦（FAA）
        - 有效至 2029 年；续期流程和标准尚未定义
        - 中 — 监管环境可能收紧，或 FAA 审批能力受限
        - 关键 — 若到期后未续期，所有再入运营都会停止
        - Part 450 框架已制度化；Varda 有先发先例；建议持续与 FAA 沟通
        - 高 — 续期路径或时间表未公开确认；必须在 2028 年前解决
        - 要求查看 FAA 关于 2029 年续期时间表的往来函件；确认是否已启动任何 2029 年后许可证申请
      - - FAA 发射前再入许可证要求（2024 年 4 月规则）
        - 美国联邦（FAA）
        - 已生效；新规要求发射前必须持有许可证
        - 低 — Varda 已在现行运营方许可证下合规
        - 高 — 不合规会阻止发射
        - 运营方许可证覆盖至 2029 年的全部 W 系列返回舱；对现有船队已有缓释
        - 当前任务为低；任何需要重新认证的下一代返回舱设计为中
        - 确认下一代飞行器（W 系列之后）是否需要新的型号认证，或只需修订现有运营方许可证
      - - DoD 靶场准入（Utah Test and Training Range）
        - 美国联邦（DoD / Air Force）
        - 可用；历史上仅用于 W-1（2024）；澳大利亚目前为主要地点
        - 中 — DoD 靶场优先任务可能挤掉 Varda
        - 高 — 2023 年 Utah 拒绝使 W-1 滞留 8 个月
        - Southern Launch Koonibba 现在是主要场地；UTTR 仅作备份
        - 中 — 若澳大利亚场地不可用，对 DoD 善意的备份依赖仍然存在
        - 要求提供与 UTTR 关于备份再入的书面靶场准入协议或 MOU；确认相对 DoD 主要任务的优先级
      - - 澳大利亚 CASA 和 SASIC 再入监管合规
        - 澳大利亚（CASA；South Australian Space Industry Centre）
        - 已生效且经过验证；W-2 至 W-6 均在 Koonibba 再入，未报告监管违规
        - 低 — 关系已经建立；澳大利亚监管环境支持商业化
        - 中 — 任何 CASA 空域规则变化，或 Koonibba 原住民土地使用争议，都可能干扰主要场地
        - Southern Launch 管理监管关系；与 Koonibba Aboriginal Corporation 保持长期社区沟通
        - 中 — 外部监管辖区；美国商业再入在澳大利亚常态化运行没有正式双边条约
        - 要求提供 Southern Launch–Varda 再入框架协议副本；确认 CASA 批准覆盖至 2028 年
      - - FDA 良好生产规范（GMP）和 CMC 合规，适用于制药载荷
        - 美国联邦（FDA）
        - 尚无先例；尚无太空制造药物获得 FDA 批准
        - 中 — FDA 尚未发布指南；Varda 必须开辟路径
        - 高 — 缺少 GMP 合规框架会阻碍任何 United Therapeutics 药物候选提交 IND
        - Varda 拥有 Series C 资助的制药结晶实验室；是否与 FDA 接触尚未公开确认
        - 高 — 监管路径未定义；没有公开证据显示与 FDA 进行过 pre-IND 沟通
        - 要求提供任何 FDA pre-IND 会议、Emerging Technology Program 认定，或 FDA 关于微重力生产批次 GMP 合规的往来函件证据
      - - DoD 高超音速载荷数据的 ITAR / 出口管制合规
        - 美国联邦（State Department / DoD）
        - 持续进行；所有 Prometheus 任务都携带受控技术数据
        - 低 — Varda 完全在美国政府框架内运营；合规似乎已嵌入流程
        - 中 — 违规会终止 DoD 合同，并可能导致民事或刑事处罚
        - 国防客户管理密级；Varda 按政府发布的安全指引运营
        - 中 — 合规义务是结构性的但不透明；无法从公开记录独立验证
        - 要求确认所有活跃 DoD 载荷的 ITAR 密级；确认 Varda 是否具备所需的保密设施许可（FCL）
      - - 在轨药物制剂的 IP 归属和实施自由
        - 美国及国际（USPTO；EPO）
        - 截至 2026 年 6 月尚无公开授权的太空来源药物专利；Varda 未披露专利申请
        - 中 — 如果结晶结果无法申请专利，或已被现有技术覆盖，IP 逻辑会坍塌
        - 高 — 没有专利保护时，支撑制药投资的版税收入流缺乏经济基础
        - Series C 实验室投资瞄准 IP 管线生成；United Therapeutics 合作围绕新制剂研究设计
        - 高 — 未发现公开专利申请；实施自由分析未公开
        - 要求披露专利组合；确认是否有任何临时或已授权专利覆盖 W-1 ritonavir Form III 或后续制剂
