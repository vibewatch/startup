      - number: '3.2'
        title: 直接自由飞行返回同行
        blocks:
          - type: paragraph
            body: >-
              三家初创公司正在开发专用自由飞行返回平台，直接复制 Varda 的核心轨道制造与返回模式，但各自的目标市场、技术和成熟度不同。


              Space Forge（Cardiff, UK）在 May 2025 完成由 NATO Innovation Fund 领投的 £22.6 million（$30 million）Series
              A；当时这被称为英国航天科技史上最大 Series A，使累计融资超过 $40 million。Space Forge 的 ForgeStar 平台设计为可返回、可再次发射，ForgeStar-1 目标是在
              2025 执行在轨演示任务。关键在于，Space Forge 的商业逻辑围绕先进工业材料——半导体、量子计算基底、光子学和清洁技术化合物——而非药物结晶。UK Space Agency 在 2026
              进一步确认这一方向，资助 Space Forge、BioOrbit 和 OrbiSky 研究在轨制造先进材料。截至 mid-2026，Space Forge
              尚未完成携带制造材料的商业轨道再入任务；其半导体材料重点使它相对 Varda 更像相邻玩家，而非直接制药竞争对手。不过，两家公司争夺同一批发射清单、同类 FAA
              或国际再入许可流程，以及对自由飞行返回模式感兴趣的早期采用客户。


              ATMOS Space Cargo（Germany）在 April 2025 飞行首个 PHOENIX 1 演示任务，并在 April 2026 完成 €25.7 million Series A，由
              Balnord 和 Expansion Venture Capital 共同领投，投资方包括 Seraphim Space、OTB Ventures 和 European Innovation
              Council。ATMOS 的差异化技术是充气式热盾，与 Varda 的烧蚀式 C-PICA 系统属于根本不同的热防护路径。ATMOS 正在推进三台 PHOENIX 2 载具，并成立 ATMOS WORKS
              子公司服务欧洲政府和防务客户。其公开主要任务是通用货物再入物流，不是药物制造；因此它更像在靶场准入、发射能力和一般再入服务市场上与 Varda 竞争，而不是专门争夺 Varda 的制药客户群。


              Space Cargo Unlimited（Luxembourg）正在开发 BentoBox，这是一种具有返回能力、面向高通量微重力研究的模块化自由飞行胶囊。首个 BentoBox 任务被描述为 December
              2025 已满额订购。2026 与 Exobiosphere 的合作整合 OHTS（Orbital High-Throughput
              Screening）设备，使每次任务可执行数千个自主细胞实验——目标是药物筛选，而非 Varda 制药模型所强调的重复制造任务。Space Cargo Unlimited 早期因 WISE
              任务获得关注；该任务把葡萄酒和葡萄藤插条送上 ISS 14 个月，展示了可控的长时间微重力暴露。BentoBox 平台在商业规模上仍未验证。
