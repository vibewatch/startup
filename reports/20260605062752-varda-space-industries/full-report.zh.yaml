      - number: '7.4'
        title: 财务、预算与市场风险
        blocks:
          - type: paragraph
            body: >-
              Varda 的财务风险画像由资本强度、有限收入多元化，以及对持续政府拨款的依赖塑造；而在当前环境下，与 DOGE 相关的 Defense Department 预算削减已经在 FY2026 请求中把 Air
              Force 和 Space Force 文职人员与 R&D 条线削减约 $2.3 billion。AFRL Prometheus 项目尚未被公开报道为削减目标，高超声速也仍有两党国会支持——House
              FY2026 Defense Appropriations Bill 专门为高超声速分配超过 $2.6 billion——但任何单个项目层面的削减都可能影响 Varda 的 IDIQ 任务订单管线。MACH-TB
              2.0 入选创造了额外多年需求，但不提供任务订单执行之外的财务保证；如果 DoD 测试优先级转移或未来年度资金被撤回，在当前成熟度下没有商业药品兜底，Varda 将面临收入收缩。


              药品市场风险是结构性、长周期的。全球范围内还没有任何太空制造药品获批，而 United Therapeutics 肺部疾病合作从 CRO 到 IND
              的时间线，可能要跑三到十年才有可能产生版税型商业销售。Varda 一位由 Aerospace America
              引用的收入负责人公开承认，太空制造产品预计不会在一到两年内出现在药房货架上。如果地面制造改进（连续结晶、模块化微反应器、改良晶型筛选工具）削弱微重力结晶的差异化价值，药品逻辑会变弱，而 Varda
              没有直接反制手段。竞争进入——SpaceWorks RED-25 在 2026 年展示在轨制造、Inversion 为其 Arc 舱体融资 $71M、Outpost 瞄准工业级轨道物流——如果 Varda
              未能率先取得能形成商业护城河的监管批准，可能压缩可防御的价格溢价。
