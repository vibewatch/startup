      - number: '8.4'
        title: 情景分析：乐观情景有吸引力，基准情景临界，悲观情景真实存在
        blocks:
          - type: paragraph
            body: >-
              对 Varda 来说，在缺少已确认收入、毛利率或现金流数据的情况下，收入倍数情景框架是最合适的工具。情景不是建立在需要私有数据的财务模型上，而是来自可观察输入——政府合同上限、潜在任务节奏、制药商业化概率。


              乐观情景假设 AFRL IDIQ 被续签并扩展到多个美国政府机构，国防收入到 2028–2029 年借助更多 IDIQ 载体和通过 Southern Launch 触达的盟国政府合同，达到每年 $150
              million 或更高；同时至少一个药物合作在五年内产出可商业授权的晶型，并触发特许权使用费收入。在这些假设下，Varda 可做到 $200–300 million 混合收入；按 15–20x
              远期倍数估值（与一家每年增长 30%+ 的盈利型国防服务公司一致），股权价值可达到 $2.5–4.0 billion。这相当于当前入场价的 1.6–2.5x。考虑执行风险，这是可信但并不出众的风险投资回报。


              基准情景假设 AFRL IDIQ 以类似规模续约，国防收入通过新增 Navy 和 Sandia 类型任务订单温和增长到每年 $70–100 million，制药 IP 到 2027–2028
              年仍处于收入前阶段。以 $70–100 million 远期收入和 15x 倍数计算，隐含股权价值约 $1.0–1.5 billion——大致等于或略低于当前入场价。这是按 Series D
              标记进入的新投资者最危险的情景：执行结果达到了管理层预期，但由于所有预期进展都已经计入价格，回报仍然持平到为负。


              悲观情景由三类事件中的任意一种触发：监管层暂停再入许可证（W-1 先例说明这并非理论风险）、任务失败或载荷损失打击客户信心，或 DoD 预算显著削减并影响 AFRL 试验台支出。Scientific
              American 引用的独立科学专家把轨道制造业务描述为「当前有风险」，并指出结晶时机「极难」控制——这是基础科学风险，Varda 的运营记录还没有消除它。在任务放缓和制药停滞的悲观假设下，年收入低于 $40
              million；按 10–12x 压力情景收入估值，股权价值跌破 $400–500 million，相当于当前入场价亏损超过 65%。
