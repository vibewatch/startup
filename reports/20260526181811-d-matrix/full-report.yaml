      - number: '6.4'
        title: Durability, Concentration, and Disclosure Gaps
        blocks:
          - type: paragraph
            body: >-
              Durability evidence is the weak point in the public record. Official and independent sources say the
              company is seeing rapid customer growth and preparing multiple large-scale deployments, but none of the
              reviewed materials quantify active customer count, repeat-order frequency, contract length, gross
              retention, net revenue retention, or churn. The same goes for concentration risk: there is no public
              disclosure of top-customer exposure, partner-versus-direct channel mix, or what share of revenue comes
              from any one hyperscale, enterprise, or sovereign account. As a result, the chapter can underwrite that
              commercialization is moving forward, but not that it is already broad, sticky, or diversified. The
              freshest evidence in 2026 is architectural and partner-led, not cohort-led. That is the central
              underwriting gap investors should keep front and center: d-Matrix has enough named proof to show adoption
              is not purely conceptual, but not enough disclosure to prove that adoption is durable, repeatable, and
              diversified at production scale.
