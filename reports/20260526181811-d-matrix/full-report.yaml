      - number: '8.3'
        title: Comparable set and inferred underwriting logic
        blocks:
          - type: paragraph
            body: >-
              The comp set is useful, but only if it is used correctly. NVIDIA and AMD are the cleanest public reference
              points for scale, disclosure quality, and incumbent strength. Their official product pages define the
              technical bar on memory, bandwidth, and rack-scale integration, while their 2026 filings show what fully
              disclosed AI infrastructure businesses look like when they are already operating at enormous commercial
              scale. That makes them indispensable scale fences. It does not make them direct pricing comps for a
              private startup with no public revenue denominator.


              The private and specialized challenger set is also heterogeneous. Groq is easier to understand
              commercially because it exposes service tiers and on-prem optionality. Cerebras competes through
              wafer-scale integrated systems. Low-confidence secondary coverage suggests SambaNova belongs in yet
              another bucket: integrated enterprise AI infrastructure rather than modular card insertion. D-Matrix sits
              somewhere else again, trying to sell a memory-local inference stack that can slot into more standard
              server and rack environments. Those are not minor packaging differences; they change customer budgets,
              deployment friction, and the kind of valuation support that can be observed publicly.


              The most plausible inference is that Series C investors were underwriting category timing and
              architectural fit, not already-revealed financial scale. In other words, they likely paid for the belief
              that inference demand will keep rising, that the market will reward lower-latency and lower-power
              alternatives, and that d-Matrix can convert partner and sovereign or enterprise interest into a durable
              niche before incumbent stacks absorb the opportunity. That logic is understandable. It is still not the
              same thing as public valuation support.
            claimRefs:
              - CV018
