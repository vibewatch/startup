          Same-model third-party benchmark versus H100/H200/MI300X and any integrated challenger actually in the
          shortlist
        - Needed to validate the whole chapter's premium-economics assumption
        - Commission or obtain normalized benchmark evidence before underwriting price
    notes: >-
      These asks are blocking rather than optional. Without them, an investor is underwriting a strategic narrative more
