      - number: '6.3'
        title: Expansion Path, Channel Dependence, and Procurement Friction
        blocks:
          - type: paragraph
            body: >-
              The expansion thesis is coherent and probably the chapter's biggest positive. d-Matrix is trying to land
              first where latency-sensitive inference can be inserted into existing datacenters, then expand from card
              evaluation to single-node scale-up, rack-scale rollout, and broader heterogeneous-cloud deployments.
              GigaIO represents the single-node scale-up step, SquadRack plus Supermicro represent the rack-scale and
              channel-sales step, and Gimlet represents a cloud-service-provider path for workload-specific acceleration
              alongside GPUs. The challenge is that every one of those steps depends on partner execution. Public
              materials repeatedly show that d-Matrix needs OEMs, system integrators, switching partners, and
              orchestration layers to translate technical differentiation into repeatable customer adoption. Independent
              sources make the friction explicit: enterprises still optimize procurement around Nvidia's trusted
