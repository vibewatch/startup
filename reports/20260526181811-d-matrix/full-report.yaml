  - id: TP001
    title: Competitor Profile Table
    columns:
      - Competitor
      - Category
      - Scale / Funding
      - Target Segment
      - Key Differentiation
      - Primary Limitation
    rows:
      - - d-Matrix
        - Inference-only challenger
