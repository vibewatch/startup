      - number: '8.5'
        title: Exit readiness, thesis-break triggers, and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports strategic relevance more than exit readiness. The company is building into one of
              the most crowded but important layers of the AI stack, and that does create strategic-sale or
              later-secondary optionality if the platform becomes a must-have inference component. But current public
              disclosure does not look IPO-ready. Public comparables disclose revenue, margins, filing cadence, and
              segment performance; d-Matrix does not.


              That disclosure gap drives the kill criteria. A priced financing materially below $1 billion would
              strongly suggest the market has reset the Series C narrative. A failure to convert partner announcements
              and early-access programs into named production deployments would undercut the commercialization story. An
              independent benchmark that fails to support the claimed cost or efficiency edge would remove the central
              reason to pay a premium for a specialized inference architecture.


              The required diligence is therefore concrete rather than generic: audited revenue and ARR, margin history,
              customer concentration, bookings-to-deployment conversion, realized pricing and support terms, and the
              preference stack or any recent 409A or secondary marks. Without those, a new investor is underwriting the
              story that d-Matrix could matter, not the proposition that $2 billion is already a disciplined entry
              price.
            claimRefs:
              - CV017
              - CV050
