      - number: '7.5'
        title: Competition, Financing, and Kill Triggers
        blocks:
          - type: paragraph
            body: >-
              The final ranked cluster is the combination of incumbent competition, ecosystem lock-in, and financing
              discipline. NVIDIA, AMD, and specialist alternatives such as Groq and Cerebras keep raising the bar on
              memory capacity, rack-scale integration, deployment model, and software expectations. Independent analysis
              also argues that switching costs are system-wide, not just chip-level, and that the market stays
              concentrated through 2026. That means d-Matrix must win specific workloads where its latency-per-watt or
              brownfield-deployment advantages survive full-system comparison. Financing risk compounds this challenge.
              The 2025 round bought time, but it also set a valuation benchmark before broad public revenue proof.
              Management’s own history includes a near-death cash moment, and the company is expanding footprint and
              headcount while public customer proof remains limited. The investment case should therefore stay
              milestone-based, with explicit thesis-break triggers tied to roadmap timing, production-customer
              conversion, and supply-chain stability.
