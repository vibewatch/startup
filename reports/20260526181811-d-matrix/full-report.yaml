      - number: '7.2'
        title: Supply, Manufacturing, and Ecosystem Dependence
        blocks:
          - type: paragraph
            body: >-
              The second-ranked risk is concentrated dependency across packaging, foundry choices, networking, and
              system integration. The next-generation memory roadmap depends on external advanced-packaging execution,
              and public third-party coverage ties d-Matrix’s chiplet path to TSMC-node choices and evolving interface
              standards. At the same time, the current go-to-market motion depends on an ecosystem of Arista, Broadcom,
              Supermicro, GigaIO, and similar partners to turn cards into deployable systems. That partner-heavy model
              reduces proprietary lock-in for the customer, but it shifts execution risk onto third-party qualification,
              support handoffs, and BOM availability. Macro supply conditions do not make this easier: advanced
              packaging bottlenecks and adjacent GPU shortages have already shown how quickly AI-hardware supply chains
              can tighten. Mitigation today is conceptual openness and partner breadth, not evidence of a self-contained
              or highly redundant supply chain.
            claimRefs:
              - CR002
              - CR009
              - CR010
