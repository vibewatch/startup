          value: 4
        - label: Networked platform
          detail: JetStream moves the story from card-only proof toward multi-node deployment.
          value: 3
        - label: Purchasable rack path
          detail: SquadRack configurations are slated to be purchasable through Supermicro.
          value: 2
        - label: Select-customer cloud service
          detail: Gimlet plans named select-customer availability in 2H 2026.
          value: 1
