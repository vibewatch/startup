        title: Revenue Model and Monetization Surfaces
        blocks:
          - type: paragraph
            body: >-
              The public record points to a hardware-platform revenue model rather than a software-only or API-only
              business. D-Matrix repeatedly sells the story as a full-stack inference platform built from Corsair
              accelerators, JetStream networking, and Aviator software, with commercialization routed through
              hyperscale, enterprise, sovereign, OEM, and system-integrator channels. That matters because revenue
              quality will likely depend on hardware shipments and multi-component deployment wins, not self-serve
              software adoption. The GTM evidence is also distinctly qualification-heavy. Series B was framed as the
              round that would let the company begin commercializing Corsair, while the 2024 and 2025 product
              announcements still leaned on sampling, early-access customers, OEM qualification, and partner-configured
              systems. SquadRack, SuperNODE, and the Gimlet cloud integration all imply larger contract values than a
              single card sale could support, but they also imply shared economics across server, networking, and cloud
              partners. Crucially, d-Matrix does not publish Corsair list pricing, JetStream pricing, software license
              pricing, or a booked-customer count. Even the ecosystem page warns that partner logos are illustrative and
              not actual customers. So the monetization surface is real and widening, but public evidence still shows
              channel formation and pilot conversion more clearly than realized revenue.
