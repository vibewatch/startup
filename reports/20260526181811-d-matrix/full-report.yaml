        - High capex, power and cooling burden; buyers can still be overprovisioned for inference-only use cases
      - - AMD MI300X
        - Mainstream GPU alternative
        - Scaled through major OEM server channels
        - Hyperscale and enterprise inference needing more memory per GPU
