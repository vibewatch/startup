      - number: '2.2'
        title: Demand Drivers and Structural Bottlenecks
        blocks:
          - type: paragraph
            body: >-
              Public evidence strongly supports the category thesis that inference demand is outrunning the
              infrastructure originally built for training. CNN, VentureBeat, and TechTarget all describe GPU scarcity,
              datacenter expansion pressure, and the need for more energy and networking capacity to keep up with AI
              demand. d-Matrix’s own architecture narrative is directionally consistent with that independent evidence:
              memory movement burns power, host-mediated networking adds latency, and batch size creates a direct
              trade-off between user experience and hardware ROI. Reasoning and agentic workflows amplify those
              pressures because they increase inference-time compute without letting operators hide latency behind a
              simple throughput metric. That is why the market is shifting from a training-first conversation to an
              operations-and-serving conversation. The constraint stack is not just raw FLOPS; it is power, memory
              bandwidth, cluster communication overhead, and the economics of delivering a fast answer at scale without
              leaving too much expensive hardware idle.
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
          - type: table
            tableRef: TM004
