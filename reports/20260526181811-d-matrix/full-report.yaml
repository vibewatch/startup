      - number: '2.3'
        title: Buyer Segments, Budget Owners, and Adoption Path
        blocks:
          - type: paragraph
            body: >-
              The buyer map is narrower than generic 'enterprise AI' language implies. d-Matrix’s most realistic early
              segments are enterprises or private-cloud operators with latency-sensitive inference workloads, neocloud
              and managed-inference providers, AI product companies trying to control serving economics, and OEM or
              integrator partners who package the cards into systems. Hyperscalers still matter strategically, but they
              are structurally harder to win because they already control large GPU estates and are increasingly
              building captive silicon. d-Matrix’s open PCIe and Ethernet positioning, plus its air-cooled rack
              narrative, are more naturally aligned with customers who want to slot inference into existing datacenter
              footprints without redesigning facilities around liquid-cooled megaclusters. The adoption path is
              correspondingly infrastructure-heavy: identify a memory-bound or latency-sensitive workload, validate fit
              in a pilot or single-node deployment, then expand to server- or rack-level production once networking,
              model partitioning, and operating cost are proven. Integrators and OEMs matter because buyers are
              purchasing a deployable system, not just a chip.
            claimRefs:
              - CM016
              - CM017
              - CM018
              - CM019
              - CM020
