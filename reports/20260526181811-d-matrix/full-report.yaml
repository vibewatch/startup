  - id: TP003
    title: Pricing / Packaging Comparison
    columns:
      - Vendor / Option
      - Price / Unit / Contract Model
      - Included Capabilities
      - Discount / Unknowns
      - Competitive Implication
    rows:
      - - d-Matrix
        - No public list price; company-quoted outcome is 3x lower cost versus GPU-based systems
        - Corsair accelerators, JetStream NICs, Aviator software, standard PCIe/server deployment
        - Realized pricing, utilization assumptions, and support terms are undisclosed
        - Strong if validated in production, but public TCO proof is still thin
      - - NVIDIA H100 / H200 stack
        - Hardware plus enterprise-software and OEM/cloud contracts; public list pricing generally opaque
        - CUDA, TensorRT, Triton, AI Enterprise/NIM, NVLink, InfiniBand, broad OEM availability
        - Bulk discounts and cloud pass-through pricing are opaque
        - Default procurement path for buyers who value ecosystem certainty over inference-specific specialization
      - - NVIDIA GB200 NVL72
        - Rack-scale system sale rather than commodity card purchase
        - 72-GPU NVLink domain, liquid cooling, Mission Control, AI-factory tooling
        - Public transaction pricing not disclosed; facility upgrades can be material
        - Raises the performance bar but also narrows the buyer pool to very large deployments
      - - AMD MI300X
        - Sold through OEM server programs and cloud contracts rather than public street pricing
        - 192GB HBM3, ROCm stack, OAM module packaging, OEM server availability
        - Net pricing and support bundles are not public
        - Competes by improving memory economics inside familiar GPU buying motions
      - - Groq
        - Free, Developer, and Enterprise plans; usage-based and custom enterprise contracts
        - Public/private/co-cloud access, regional endpoints, prompt caching, optional GroqRack on-prem
        - Per-model enterprise economics are negotiated and not fully public
        - Most transparent service-style packaging among the challengers
      - - Cerebras / SambaNova
        - System-level enterprise contracts; pricing not publicly normalized
        - Integrated hardware plus software stack, tuned large-model serving, enterprise support
        - Actual token economics and appliance pricing are mostly private
        - Compete on turnkey integrated value rather than open component comparison
      - - Internal build on incumbent GPU cloud
        - Historically can mean very high monthly bills plus datacenter upgrades or huge GPU reservations
        - Maximum workflow control and reuse of incumbent ML tooling
        - True cost depends on model size, traffic, utilization, and reserved capacity
        - The substitute remains expensive, but it is familiar and therefore sticky
    notes: >-
      Public pricing is sparse across inference hardware, so this table emphasizes packaging, contract form, and what is
      visibly bundled. Where a row cites cost impact, it distinguishes vendor-authored claims from independent examples
      of GPU-era operating expense.
