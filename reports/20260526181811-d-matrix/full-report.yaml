  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: >-
              d-Matrix sits inside a crowded but still-fluid AI inference market. The most important direct alternatives
              are

              not one homogeneous peer set: NVIDIA and AMD sell general-purpose accelerator stacks that can run both
              training

              and inference; Groq, Cerebras, and SambaNova pursue inference-first or tightly integrated alternatives;
              and the

              status quo for many buyers is still internal build on incumbent GPU clouds or private racks. Independent
              market

              coverage keeps circling the same structural pressures: inference workloads are growing faster than buyers
              can

              absorb power, cooling, memory, and GPU procurement costs, and that is why challengers such as d-Matrix get

              attention in the first place. d-Matrix's own pitch is that Corsair cards, JetStream NICs, and Aviator
              software

              attack the memory-movement penalty that makes large-model inference expensive. The company therefore
              competes

              less as a generic GPU replacement than as a purpose-built answer to the memory-bound, latency-sensitive
              slice

              of inference demand.
            claimRefs:
              - CP001
              - CP002
              - CP025
              - CP026
              - CP029
              - CP032
