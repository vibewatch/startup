            body: >-
              To justify paying above the last round, investors need more than partner announcements or management
              comparisons. The bull case specifically requires named scale deployments, independent benchmark
              validation, and evidence that d-Matrix has carved out a durable place beside incumbent GPU infrastructure.
            calloutType: assumption
            claimRefs:
