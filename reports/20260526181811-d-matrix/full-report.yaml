      - number: '7.3'
        title: Adoption Proof and Deployment Friction
        blocks:
          - type: paragraph
            body: >-
              The third-ranked risk is that adoption proof still trails the technical story. Public evidence is
              strongest around early-access partners, reference architectures, and select-customer availability windows
              rather than around a broad set of named production users. The Gimlet and GigaIO announcements help because
              they show real counterparties and deployment intent, but they still read as early commercialization
              surfaces, not a mature installed base. That matters because enterprise AI adoption remains constrained by
              networking, power, and operational complexity even when the chip-level economics look better. d-Matrix’s
              air-cooled, standard-server positioning is a real sales advantage, yet the public record still does not
              show whether customers can deploy the full stack without heavy solution-engineering effort or long
              qualification cycles. This is therefore both a customer-proof risk and an implementation-friction risk.
            claimRefs:
              - CR014
              - CR015
              - CR016
              - CR017
              - CR018
              - CR035
              - CR038
              - CR043
      - number: '7.4'
        title: Compliance, Security, and Regulatory Risk
        blocks:
          - type: paragraph
            body: >-
              The fourth-ranked risk is that compliance, export-control, and security proof is thinner than what many
              enterprise and sovereign buyers now expect from inference infrastructure vendors. The public legal
              surfaces that were easy to verify are the website privacy policy and terms of use; those are necessary,
              but they are not a substitute for product-security architecture, audit posture, or a dedicated trust
              center. That gap matters because regulated buyers increasingly prioritize data control, predictable
              governance, and on-prem assurance, and competing platforms market those qualities explicitly. Overlaying
              that is export-control risk. BIS has already tightened controls on advanced computing semiconductors and
              circumvention pathways, which means advanced-AI hardware supply chains operate under an active regulatory
              regime. D-Matrix may never be directly blocked by those rules, but investors still need to understand how
              packaging partners, manufacturing geographies, and customer targets interact with evolving trade controls.
            claimRefs:
              - CR023
              - CR024
              - CR025
              - CR026
              - CR027
              - CR041
