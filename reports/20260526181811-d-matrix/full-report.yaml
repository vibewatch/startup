  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Roadmap and System-Integration Risk
        blocks:
          - type: paragraph
            body: >-
              The highest-ranked risk is that d-Matrix is not selling one isolated chip; it is trying to commercialize a
              synchronized stack spanning Corsair cards, JetStream networking, Aviator software, partner-qualified
              racks, and a next-generation 3DIMC roadmap. That architecture can be differentiated and still fragile.
              JetStream is still publicly framed as early commercialization rather than mature fleet deployment, and the
              Pavehawk-to-Raptor path is explicitly described in lab-validation terms instead of production yield or
              broad customer proof. The company also made major architecture pivots during its first five years, which
              shows adaptability but also means buyers and investors are underwriting a moving roadmap. Mitigation
              exists in the form of concrete product surfaces and partner disclosures, but mitigation maturity remains
              only moderate because the public record still relies heavily on company-authored milestones rather than
              broad independent production evidence.
            claimRefs:
