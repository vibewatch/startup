  - id: FV001
    title: Recommendation logic
    type: flow
    layout: standard
    summary: >-
      The call flows from real financing and technical credibility through missing denominator metrics to a
      price-sensitive research-more recommendation.
    data:
      nodes:
        - id: n1
          label: Verified financing
          detail: $275M Series C at $2B plus credible investor syndicate
        - id: n2
          label: Architecture and partner proof
          detail: Corsair, JetStream, GigaIO, and Gimlet support a real product narrative
        - id: n3
          label: Missing denominator
          detail: No public revenue, ARR, gross margin, or customer-count disclosure
        - id: n4
          label: Comp set mismatch
          detail: Public incumbents are scale fences, while private challengers are heterogeneous
        - id: n5
          label: Milestone-based range
          detail: Public evidence centers below the latest disclosed round unless bull milestones arrive
        - id: n6
          label: research-more / stretched
          detail: Only a lower price or hard private diligence should move the call toward buy
      edges:
        - from: n1
          to: n2
          label: supports attention
        - from: n2
          to: n5
          label: creates option value
        - from: n3
          to: n5
          label: blocks clean multiple math
        - from: n4
          to: n5
          label: forces scenario judgment
        - from: n5
          to: n6
          label: defines stance
    approximationNotes: This is a decision-logic compression of the chapter, not a causal operating model.
    claimRefs:
      - CV001
      - CV013
      - CV014
      - CV017
      - CV032
      - CV044
      - CV049
      - CV050
      - CV051
