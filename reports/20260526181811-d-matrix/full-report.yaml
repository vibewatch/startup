        title: Unit Economics and Cost Drivers
        blocks:
          - type: paragraph
            body: >-
              D-Matrix’s unit-economics case is easy to describe but still only partially public. Official materials
              consistently claim up to 10x faster interactive speed, 3x better cost performance, and 3x to 5x better
              energy efficiency than GPU-based alternatives, while third-party Gimlet testing adds a more specific
              workload proxy: speculative decode offload to Corsair produced 2x to 10x lower end-to-end request latency
              at the same energy efficiency. That is meaningful evidence that the product can improve customer economics
              on memory-bound inference stages. But it is not the same as proving d-Matrix’s own gross margin or payback
              profile. The white paper and JetStream brief explicitly label cost and power figures as preliminary, and
              both documents reveal why system economics cannot be reduced to chip benchmarks alone. JetStream adds a
              dedicated 400 Gbps NIC, optics or DACs, power draw, switch ports, and rack-integration work. The Corsair
              server and rack specs imply larger average deal sizes, but they also imply server, networking, and support
              costs that sit outside the accelerator die itself. External market proxies reinforce why this matters: AI
              inference can consume extraordinary operating budgets, while GPU infrastructure remains expensive, power
              hungry, and supply constrained. D-Matrix may address those economics, but public proof still lives at the
              benchmark and architecture layer, not the P&L layer.
