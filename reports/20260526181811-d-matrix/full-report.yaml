      - number: '3.4'
        title: Switching Costs, Distribution, and Internal Build
        blocks:
          - type: paragraph
            body: >-
              The central competitive question is not whether d-Matrix can make a strong silicon argument; it is whether
              it

              can overcome the software, networking, and channel inertia that keeps enterprises on incumbent platforms.

              NVIDIA's advantage is deeply systemic: buyers already know how to buy GPU clusters, cool them, connect
              them,

              program them with CUDA and TensorRT, and source them through familiar OEM and cloud channels. AMD weakens
              that

              moat at the margin with ROCm and more memory per GPU, but it still lives in the same rack and server
              ecosystem.

              Groq, Cerebras, and SambaNova attack the problem by changing the packaging model—API-led service, giant

              appliance, or fully integrated platform. d-Matrix sits between those camps. Its modular chiplet and
              card-based

              approach could lower insertion friction, but the public record still lacks the customer references, price
              sheets,

              and benchmark normalization that would prove buyers are willing to switch, multi-home, or standardize on
              it at

              production scale. Internal build is also a real substitute as hyperscalers and large enterprises
              increasingly

              design or co-design inference silicon around their own workloads.
            claimRefs:
              - CP027
              - CP028
              - CP030
              - CP033
              - CP034
              - CP035
              - CP036
      - number: '3.5'
        title: Moat Durability and Adverse Evidence
        blocks:
          - type: paragraph
            body: >-
              d-Matrix has a credible but still-provisional moat. The strongest pillar is technical fit: multiple
              sources tie

