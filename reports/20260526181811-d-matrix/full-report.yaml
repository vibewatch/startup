    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Footprint, and Business Model
        blocks:
          - type: paragraph
            body: >-
              d-Matrix should be treated as a private, Series C AI infrastructure company built specifically around
              inference rather than training. The official home page, about page, and 2025 Series C release all anchor
              the company in Santa Clara and frame its business as selling accelerated compute for hyperscale,
              enterprise, and sovereign data-center workloads. Public materials say the company was founded in 2019, and
              the current product stack combines Corsair inference accelerators, JetStream networking, and Aviator
              software. The home page further says the 3DIMC architecture uses a chiplet-based, PCIe-friendly design
              that can scale to models above 100 billion parameters. That makes the reusable ground truth for later
              chapters straightforward: d-Matrix is monetizing hardware-plus-software infrastructure for low-latency
              inference. What the public record does not yet provide is a companywide customer count or revenue figure
              that would let diligence treat current commercial scale as fully quantified.
