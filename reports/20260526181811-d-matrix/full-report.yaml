        title: Sizing Lenses and What Is Actually Addressable
        blocks:
          - type: paragraph
            body: >-
              The public market numbers are large, but they are not directly additive and they do not all describe the
              same commercial surface. Gartner’s generative-AI spending forecast is the broadest adjacency and includes
              software, services, and infrastructure. MarketsandMarkets’ AI inference estimate is narrower, but still
              broader than merchant silicon alone. Silicon Analysts’ AI accelerator market is narrower again on the
              hardware axis but still includes training and multiple incumbent or captive architectures. The most
              decision-relevant lower-bound lens in the source pack is not even a TAM report at all: CNBC’s estimate
              that Bing AI alone needed at least $4 billion of infrastructure. That deployment-cost lens captures why
              the category exists. For d-Matrix, the accessible SAM is smaller than all of these figures because it
              excludes training, excludes much of captive hyperscaler custom silicon, and excludes buyers who are
              content to consume inference through external APIs. Public data is sufficient to show a large category,
              but not sufficient to publish a clean d-Matrix SOM without management disclosures.
