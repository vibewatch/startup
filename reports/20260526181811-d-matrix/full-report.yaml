        - Enterprise and datacenter LLM inference
        - Digital in-memory compute; Corsair cards + JetStream NICs + Aviator software; standard-server insertion point
        - Public benchmark proof and production customer depth remain limited
      - - NVIDIA H100/H200/GB200
        - Incumbent GPU stack
        - Dominant enterprise and cloud installed base; ~75-92% share estimates depending source and year
        - Training plus inference from enterprise to hyperscale
