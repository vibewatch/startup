      - number: '3.2'
        title: 'Incumbent GPU Stacks: NVIDIA and AMD'
        blocks:
          - type: paragraph
            body: >-
              NVIDIA remains the benchmark d-Matrix must beat in practice, even when the buyer says it wants "better

              inference economics" rather than "the fastest raw cluster." H100, H200, and GB200 span the full ladder
              from

              single-GPU deployment to rack-scale NVLink domains, and NVIDIA layers software, networking, and enterprise

              support on top of the silicon. H100 anchors the installed base with NVLink, InfiniBand, Magnum IO, and AI

              Enterprise; H200 extends the moat by pushing memory capacity and bandwidth higher for large-model
              inference;

              GB200 raises the competitive bar again by collapsing 72 GPUs into a liquid-cooled rack-scale system that
              NVIDIA

              markets as a single massive inference machine. AMD is the clearest mainstream alternative because MI300X
              offers

              more memory per GPU, high bandwidth, and ROCm rather than CUDA. But AMD still competes inside the same OEM
              and

              datacenter procurement motion as NVIDIA, which means it pressures incumbent economics without fully
              changing how

              the buyer evaluates or deploys inference infrastructure.
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
