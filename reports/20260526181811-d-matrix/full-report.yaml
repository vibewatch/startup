    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold / event
      - Transmission to thesis
      - Action implication
    rows:
      - - Reset financing
        - Any priced round or secondary clearing well below ~$1B
        - Confirms the Series C narrative did not hold and compresses upside from here
        - Rebuild the investment case from the new market-clearing price
      - - Commercialization stall
        - No named production deployments or weak pilot conversion by the next financing cycle
        - Undercuts the argument that architecture is becoming a real revenue engine
        - Shift immediately toward the bear case
      - - Benchmark failure
        - Independent same-workload tests fail to validate a material TCO or efficiency edge
        - Removes the main reason to pay a premium for specialized inference hardware
        - Strip out premium assumptions and revisit willingness to invest
      - - Weak operating disclosure
        - Private diligence shows poor margin quality, concentrated customers, or low conversion
        - Converts a technology story into a low-quality hardware commercialization story
        - Demand a deep markdown or walk
      - - Incumbent absorption
        - Customers standardize on NVIDIA/AMD or integrated alternatives instead of adding d-Matrix
        - Shrinks the niche the Series C appears to underwrite
        - Assume slower growth and lower exit optionality
