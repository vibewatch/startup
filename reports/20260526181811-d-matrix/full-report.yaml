companyProfile:
  summary: >-
    d-Matrix is a Santa Clara-based AI inference infrastructure company founded in 2019 by Sid Sheth and Sudeep Bhoja.
    The company now presents a concrete full-stack product story around Corsair accelerator cards, JetStream networking,
    Aviator software, and open-standards rack deployment for hyperscale, enterprise, and sovereign datacenters. Public
    financing history is well supported, culminating in a $275 million Series C at a $2 billion valuation and $450
    million of total disclosed funding, with 250+ employees and a multi-office footprint by late 2025. What remains
    missing is the operating denominator: public sources still do not disclose revenue, ARR, broad customer count, or
    control economics in enough detail to underwrite the business like a mature late-stage infrastructure company.
