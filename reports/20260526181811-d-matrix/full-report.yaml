      - number: '5.2'
        title: DIMC, JetStream, and Aviator Architecture
        blocks:
          - type: paragraph
            body: >-
              The core technical thesis is that modern inference is dominated by memory movement, especially during
              decode, so d-Matrix optimized for memory-centric execution rather than trying to look like another GPU.
              Corsair pairs DIMC compute with large on-chip SRAM and capacity memory, then scales laterally through
              chiplets, DMX Link, and DMX Bridge. Aviator matters as much as the silicon because it handles model
              conversion, compression, compilation, runtime execution, cluster orchestration, and developer tooling.
              Recent technical essays extend that framing beyond the chip itself, arguing that context pressure,
              KV-cache reduction, and optimization across software, networking, and infrastructure are necessary
              complements to DIMC rather than side projects. JetStream extends the same low-latency philosophy to
              multi-node communication by separating data and control planes and enabling device-initiated
              accelerator-to-accelerator transfers over standard Ethernet. The most credible part of the technical story
              is that the hardware, networking, and software layers are described in enough detail to form a coherent
              operating model. The main diligence question is not whether there is an architecture, but how broadly that
              architecture has been validated outside d-Matrix and a small set of technical partners.
