            body: >-
              The public record clearly supports the existence of the Series C and the investor syndicate. It does not
              disclose the revenue, ARR, gross margin, or customer concentration needed to prove that the mark is cheap.
              That gap is the core adverse fact for valuation.
            calloutType: risk
            claimRefs:
              - CV001
