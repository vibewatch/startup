        blocks:
          - type: paragraph
            body: >-
              Capital formation is the strongest externally corroborated part of the company overview. VentureBeat
              reported a $44 million Series A in 2022 around the Microsoft Project Bonsai relationship. The official
              2023 release then disclosed a $110 million Series B led by Temasek, and the official 2025 Series C
              release, Bullhound statement, QIA statement, and independent press all agree that d-Matrix raised $275
              million at a $2 billion valuation, bringing total disclosed funding to $450 million. The same Series C
              materials also provide the clearest current scale markers in the fetched pack: 250+ employees worldwide,
              Santa Clara headquarters, and offices in Toronto, Sydney, Bangalore, and Belgrade. That combination
              supports a practical stage call of late-stage private infrastructure startup rather than early research
              project. Still, fundraising visibility exceeds operating disclosure. The company says the new capital will
              support global expansion and large-scale deployments, but no fetched source discloses current revenue,
              ARR, or a broad named-customer list, so those metrics should remain explicit diligence gaps.
