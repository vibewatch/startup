  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and the Shift from Training to Inference
        blocks:
          - type: paragraph
            body: >-
              The relevant market boundary for d-Matrix is not 'AI' in the abstract and not even all accelerator
              spending. Public company materials, technical docs, and launch messaging consistently place the company in
              datacenter inference: serving already-trained generative models with low latency, high memory bandwidth,
              and better cost and energy efficiency. Included spend therefore covers accelerator cards, inference
              servers and racks, interconnect and NIC layers required to scale serving, and the software stack that
              makes those systems deployable in enterprise or neocloud environments. Excluded spend includes model
              training clusters, hyperscaler-custom silicon that never becomes merchant hardware, pure API spend, and
              edge-device inference. This distinction matters because the technical bottlenecks change after training.
              d-Matrix and third-party developer evidence both emphasize that prefill is compute-bound while decode and
              agentic serving become memory- and latency-bound, which is exactly the part of the stack where generic GPU
              economics become weakest and where a specialist accelerator can plausibly wedge in.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
          - type: table
            tableRef: TM001
