    rows:
      - - Interactive chat or coding assistant
        - GPU-only decode can become latency-sensitive and queue-sensitive at small batches
        - Run low-latency decode on Corsair while keeping the deployment in standard PCIe servers
        - Company cites up to 60,000 tokens/s at 1 ms/token for Llama3 8B in a single server
        - This performance figure is company-reported and workload specific
      - - 70B-class on-prem inference service
        - Large models outgrow a single card and create rack-level memory and networking pressure
        - Use eight-server Corsair racks and JetStream-based node-to-node scaling
        - Company cites 30,000 tokens/s at 2 ms/token for Llama3 70B and 100B-parameter scale targets
        - Public proof is strongest in reference architectures and partner deployments, not in named customer rollouts
      - - Heterogeneous pipeline with large verifier model
        - GPU-only systems must compromise between fast decode and high-quality large-model verification
        - Use Corsair for the memory-bound speculative draft stage and keep the larger verifier on GPU
        - Gimlet reports 2-5x request speedup at equal energy for one speculative-decoding setup
        - Independent validation is narrow and does not cover every inference phase
      - - Enterprise retrofit into existing datacenter
        - New AI systems often require proprietary fabrics or heavy infrastructure changes
        - Deploy PCIe cards plus Ethernet switching in existing datacenter footprints
        - SquadRack is air-cooled and built around standard servers and top-of-rack Ethernet switches
        - Deployment quality still depends on third-party server and switch integration
      - - Single-node scale-up before multi-node complexity
        - Distributed inference can add coordination overhead and operating complexity
        - Use GigaIO SuperNODE to host dozens of Corsair cards inside one node
        - Partner claims lower multi-node complexity and cites 30,000 tokens/s at 2 ms/token for Llama3 70B
        - Single-node partnership claims are partner-reported rather than broadly benchmarked
    notes: >-
