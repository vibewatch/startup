  headquarters: Santa Clara, California
  productSummary: Corsair accelerator cards, JetStream transparent networking cards, Aviator software, and the SquadRack reference architecture together form a low-latency inference stack designed for standard PCIe servers, Ethernet fabrics, and brownfield datacenter deployment.
  customerFocus: Hyperscale, enterprise, sovereign-cloud, and specialist AI-cloud operators running latency-sensitive inference workloads.
  businessModel: Hardware-plus-software platform sales routed through OEM, integrator, and cloud partners, with economics likely tied to multi-component deployments rather than standalone self-serve software.
  stage: Series C private company
  fundingStatus: $110M Series B in 2023 followed by a $275M Series C in November 2025 at a $2B valuation, bringing total disclosed funding to $450M.
