  evidenceGaps:
  - type: missing-source
    severity: material
    topic: trust-compliance
    missingEvidence: Public SOC 2, ISO 27001, FedRAMP, or equivalent trust documentation, plus a platform-level security architecture or incident-response summary.
    whyItMatters: Enterprise and sovereign-cloud buyers often require documented controls before approving inference infrastructure for sensitive or regulated workloads.
    diligencePath: Request the current trust-center package, customer security questionnaire responses, secure-development lifecycle summary, and any recent third-party audit or penetration-test letters.
    relatedQuestionRefs:
    - QE022
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: fleet-reliability
    missingEvidence: Named production customers, uptime or SLO data, MTBF, RMA rates, and field-failure metrics for Corsair and JetStream deployments.
    whyItMatters: Reference architectures and partner announcements help with architecture credibility but do not underwrite operator reliability or support burden.
    diligencePath: Request customer reference calls, fleet telemetry summaries, support-ticket statistics, RMA history, and any internal reliability dashboards used by operations.
    relatedQuestionRefs:
    - QE024
    relatedTableRefs:
    - TE001
    - TE004
  - type: private-evidence-only
    severity: material
    topic: 3dimc-roadmap-execution
    missingEvidence: Pavehawk validation results, Raptor tapeout or production schedule, package-yield data, and independent benchmarks for the 3DIMC roadmap.
    whyItMatters: The roadmap to larger-memory inference is central to d-Matrix's long-term product case, but it is also the least externally validated part of the stack.
    diligencePath: Request silicon-validation reports, Alchip packaging plans, foundry and substrate commitments, and benchmark data that extends beyond self-reported architecture claims.
    relatedQuestionRefs:
    - QE025
    relatedTableRefs:
    - TE003
    - TE005
  - type: missing-source
    severity: minor
    topic: compatibility-matrix
    missingEvidence: A public compatibility matrix covering supported servers, NIC firmware combinations, qualified switches, and supported model families under Aviator.
    whyItMatters: Open-standards positioning is strongest when buyers can see exactly which server, rack, and model combinations are already qualified.
    diligencePath: Request the current hardware-qualification matrix, supported-model list, and any customer-facing deployment guide used by OEM and integrator partners.
