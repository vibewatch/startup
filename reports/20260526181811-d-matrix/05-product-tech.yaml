- id: TE004
  title: Trust, Quality, and Compliance Table
  columns:
  - Control / signal
  - Status
  - Scope
  - Gap
  rows:
  - - Secure boot on JetStream
    - Publicly disclosed
    - NIC-level boot integrity for the networking card
    - No broader platform security architecture is published for Corsair plus Aviator plus JetStream as a system
  - - Kubernetes plugin, metrics exporter, debugger, and profiler
    - Publicly disclosed
    - Operational tooling for deployment, monitoring, and developer diagnosis
    - Tooling existence is not the same as public uptime, MTBF, or support-performance data
  - - Open-standards deployment model
    - Publicly disclosed
    - PCIe cards, Ethernet networking, and standard top-of-rack switching reduce bespoke infrastructure risk
    - Open standards do not remove integration, firmware, or partner-qualification risk
  - - Independent practitioner benchmark from Gimlet
    - Publicly disclosed but narrow
    - One speculative-decoding workflow on a heterogeneous Corsair-plus-GPU setup
    - The validation surface is narrow and is not equivalent to broad production benchmarking
  - - Public compliance credentials
    - Not disclosed in reviewed corpus
    - Enterprise trust posture for regulated, sovereign-cloud, and security-sensitive buyers
    - No public SOC 2, ISO 27001, FedRAMP, or trust-center references were found in the reviewed official surfaces
  - - Public fleet reliability metrics
    - Not disclosed in reviewed corpus
    - Field reliability, service durability, and operator confidence
    - No public MTBF, RMA, uptime, or failure-rate disclosure appears in the chapter corpus
  notes: This table distinguishes disclosed controls from missing trust artifacts. Absence refers only to the reviewed corpus and should be closed by diligence requests rather than assumed away.
