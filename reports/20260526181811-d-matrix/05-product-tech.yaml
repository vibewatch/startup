  rows:
  - - Corsair single/dual-card accelerators
    - Platform architects and enterprise AI infrastructure teams
    - Current flagship product with public card, server, and rack specs
    - DIMC plus on-chip SRAM in PCIe cards designed for low-latency decode and interactive inference
    - Named production customers and field reliability data are not public
  - - JetStream transparent NIC
    - Operators scaling Corsair across nodes and racks
    - Current networking product with samples announced and detailed spec published
    - Device-initiated accelerator-to-accelerator transfers over standard Ethernet rather than host-mediated RDMA flow
    - Broad production proof and compatibility matrix are not public
  - - Aviator software stack
    - ML engineers, infra engineers, and platform teams
    - Current software layer with documented build and execution flows
    - Co-designed stack spanning model factory, compression, compiler, runtime, Kubernetes plugin, and observability tools
    - Supported-model matrix, SLA posture, and customer support scope are not public
  - - SquadRack reference architecture
    - Cloud, sovereign-cloud, and enterprise datacenter operators
    - Reference blueprint rather than a fully closed appliance
    - Air-cooled rack design using Corsair, JetStream, standard PCIe servers, and standard Ethernet fabrics
    - Reference architecture is not the same thing as broad GA deployment
  - - Pavehawk test silicon and Raptor roadmap
    - Future buyers needing larger-memory inference footprints
    - Roadmap stage; public validation is architectural, not commercial
    - 3DIMC roadmap adds 3D DRAM to extend the low-latency memory-centric architecture beyond Corsair
    - Independent benchmarks, production timing, package yield, and customer commitments are not public
