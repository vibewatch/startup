- id: FE002
  title: Customer Workflow and Operating Flow
  type: flow
  layout: wide
  summary: How a model moves from developer input into a heterogeneous d-Matrix deployment and then serves low-latency inference.
  data:
    nodes:
    - id: n1
      label: Import model weights
      detail: Developer starts with a model from PyTorch or Hugging Face and chooses the target workload.
    - id: n2
      label: Aviator build flow
      detail: Model Factory, Compressor, and Compiler convert the graph into d-Matrix-specific binaries.
    - id: n3
      label: Deploy to Corsair cluster
      detail: Inference Engine and Host Runtime place binaries onto one or more cards in a server or rack.
    - id: n4
      label: Optional heterogeneous prefill or verify stage
      detail: Larger verifier or prefill stages can remain on GPU or other accelerators in a disaggregated pipeline.
    - id: n5
      label: Low-latency decode on Corsair
      detail: Corsair handles the memory-bound stage where low-latency token generation matters most.
    - id: n6
      label: JetStream scale-up and scale-out
      detail: JetStream moves activations and state across nodes over standard Ethernet as the deployment grows.
    - id: n7
      label: Serve response and emit telemetry
      detail: Application returns output while Aviator tooling emits metrics and profiling data for operators.
    edges:
    - from: n1
      to: n2
    - from: n2
      to: n3
    - from: n3
      to: n4
    - from: n4
      to: n5
    - from: n5
      to: n6
    - from: n6
      to: n7
  approximationNotes: This flow synthesizes the published Aviator build and execution model with d-Matrix's own heterogeneous prefill/decode narrative. It is specific to the reviewed corpus, not an official product diagram.
