- id: TE003
  title: Technology and Operating Architecture Table
  columns:
  - Layer / process
  - Role
  - Key dependency
  - Key risk
  rows:
  - - DIMC cores with on-chip SRAM
    - Keep memory close to compute for low-latency token generation and interactive decode
    - Successful mapping of inference kernels and data movement into the DIMC memory hierarchy
    - Architecture is differentiated, but broad third-party workload validation is still limited
  - - Capacity memory tier
    - Extend model and context footprint beyond on-chip SRAM without abandoning the memory-centric design
    - Aviator scheduling and runtime policies that decide what sits in fast versus capacity memory
    - Performance depends on workload fit and on how much data must still move between tiers
  - - Chiplets plus DMX Link and DMX Bridge
    - Scale from one chiplet pool to dual-card and rack-level configurations
    - Packaging, interconnect yield, and card qualification across OEM systems
    - Chiplet and bridge complexity can become a packaging, signal-integrity, or qualification bottleneck
  - - JetStream transparent NIC
    - Provide low-latency inter-node accelerator communication without host-mediated RDMA overhead
    - Standard Ethernet optics, switches, PCIe Gen5 hosts, and JetStream firmware
    - Production networking proof is newer than Corsair compute proof
  - - Aviator software stack
    - Convert models, compress graphs, compile binaries, orchestrate distributed execution, and expose tooling
    - Model support, compiler maturity, runtime stability, and developer enablement
    - Software quality is central because hardware value is only realized through the stack
  - - Rack and server ecosystem layer
    - Turn cards and NICs into deployable systems through Supermicro, GigaIO, Liqid, Arista, and Broadcom
    - Partner qualification, support handoffs, and standard-server supply
    - Open standards reduce lock-in but increase integration dependence
  - - 3DIMC on Pavehawk and Raptor
    - Push the architecture toward larger-memory inference using stacked DRAM
    - Alchip packaging and ASIC work, foundry capacity, and successful test-silicon translation into product silicon
    - Roadmap value is high, but commercial timing and external validation remain unproven
  notes: This table focuses on the operating stack needed to turn Corsair into a usable platform. Dependencies are called out explicitly because d-Matrix is not selling a closed appliance today.
