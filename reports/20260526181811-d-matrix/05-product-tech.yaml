- id: FE001
  title: d-Matrix Product Architecture Map
  type: stack
  layout: wide
  summary: Layered view from target workload to software, networking, compute-memory hardware, and the future memory-scaling roadmap.
  data:
    layers:
    - label: Workload layer
      detail: The stack is aimed at interactive chat, coding, agents, reasoning, and multimodal inference where decode latency matters.
      items:
      - Interactive chat
      - Coding copilots
      - Agentic workflows
      - Reasoning and video inference
    - label: Software layer
      detail: Aviator handles build, compression, compilation, execution, orchestration, and observability.
      items:
      - Model Factory
      - Compressor
      - Compiler
      - Inference Engine
      - Host Runtime
    - label: Networking layer
      detail: JetStream extends device-initiated traffic across nodes using standard Ethernet infrastructure.
      items:
      - Transparent NIC
      - 400 Gbps Ethernet
      - PCIe Gen5 x16 host bus
      - Top-of-rack switches
    - label: Compute-memory layer
      detail: Corsair pairs DIMC compute with on-chip performance memory and off-chip capacity memory in PCIe cards.
      items:
      - DIMC cores
      - 2 GB on-chip SRAM per card
      - Up to 256 GB capacity memory per card
      - DMX Link and DMX Bridge
    - label: Future memory-scaling layer
      detail: 3DIMC, Pavehawk, and Raptor are meant to extend the architecture into larger-memory footprints.
      items:
      - 3D-stacked DRAM
      - Pavehawk test silicon
      - Raptor successor roadmap
      - Alchip packaging dependency
  approximationNotes: The layer boundaries are analytical rather than company-authored. The figure is meant to show how product, software, networking, and roadmap fit together as one platform.
