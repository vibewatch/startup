- id: TM003
  title: Segment / buyer map
  columns:
  - Segment
  - Buyer
  - User
  - Payer
  - Workflow
  - Budget owner
  - Adoption trigger
  rows:
  - - Enterprise private cloud / regulated operators
    - Infrastructure or platform engineering team
    - ML platform, application, and operations teams
    - Corporate IT / infra budget
    - Internal copilots, support agents, private retrieval and reasoning
    - CTO / VP Infrastructure / Head of AI platform
    - Need for low latency, data control, and predictable serving cost
  - - Neocloud or managed inference provider
    - Cloud product and capacity planning teams
    - External developer customers
    - Cloud capex and service margin
    - Hosted model serving and inference API products
    - GM cloud / VP product / finance
    - Margin pressure from GPU serving and desire for differentiated latency
  - - AI product company / model API operator
    - Applied AI or platform team
    - End users of coding, support, or agent products
    - Product P&L
    - Interactive, memory-bound inference workloads
    - CPO / CTO / infra lead
    - Rapid usage spikes and loss-making inference economics
  - - OEM / integrator channel
    - Server OEM or system integrator
    - Solution architects and deployment engineers
    - End-customer project budget
    - Packaging cards, servers, networking, and support into deployable systems
    - Business unit lead / solution practice owner
    - Customer demand for turnkey deployments
  - - Hyperscaler / captive silicon buyer
    - Cloud infrastructure organization
    - Internal model and platform teams
    - Massive datacenter capex
    - Foundation-model and cloud inference at hyperscale
    - SVP infrastructure / custom silicon org
    - Usually harder for d-Matrix to win because incumbent GPU and internal-silicon options are strong
  notes: The first four rows are realistic merchant-facing targets. The hyperscaler row is included because it matters strategically, but public evidence suggests it is the least directly accessible segment for a startup merchant accelerator.
