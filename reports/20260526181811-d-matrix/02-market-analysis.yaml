- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Factor
  - Direction
  - Timing
  - Implication for d-Matrix
  - Diligence ask
  rows:
  - - Reasoning and agentic workloads expand inference-time compute
    - Driver
    - Current and accelerating
    - Helps the category thesis because more serving work becomes latency-sensitive and memory-bound
    - Quantify how much of pipeline demand is reasoning / agentic versus conventional chat
  - - GPU scarcity and datacenter build pressure
    - Driver
    - Current
    - Creates openness to alternatives and heterogeneous serving architectures
    - Request actual buyer stories where lack of GPU supply pulled d-Matrix into evaluation
  - - Memory-movement power tax
    - Driver
    - Structural
    - Strengthens d-Matrix's DIMC / SRAM narrative versus separate-compute HBM stacks
    - Benchmark power per request on representative memory-bound workloads
  - - Host-mediated multi-node networking overhead
    - Driver
    - Structural at scale
    - Supports JetStream and transparent-NIC positioning for rack-level inference
    - Verify production latency and jitter under real multi-node traffic
  - - Batch-size economics in interactive apps
    - Driver
    - Current
    - Favors hardware that keeps utilization high at small batches instead of optimizing only peak throughput
    - Get customer evidence on acceptable latency thresholds and revenue sensitivity
  - - Nvidia software moat and benchmark leadership
    - Constraint
    - Current
    - Limits d-Matrix adoption outside very specific workload wedges
    - Test software maturity, tooling friction, and time-to-deploy versus GPU stacks
  - - Captive hyperscaler custom silicon growth
    - Constraint
    - Current and rising
    - Shrinks the merchant share of the broad inference market available to startups
    - Estimate how much target demand is already committed to internal silicon or reserved GPU supply
  - - Need for proof of production TCO, not just vendor claims
    - Constraint
    - Immediate
    - Independent workload-level evidence is still thinner than the market narrative
    - Request signed production deployments, reference architectures, and customer ROI evidence
  notes: This table mixes structural drivers and structural constraints because the same forces that expand inference demand also tighten the proof burden on a startup supplier. Every row is meant as an underwriting question, not as a claim that demand converts cleanly into revenue.
