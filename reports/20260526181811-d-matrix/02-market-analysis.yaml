callouts:
- calloutType: insight
  title: The real wedge is memory-bound, latency-sensitive serving
  body: 'd-Matrix is most plausibly selling into the part of inference where GPUs are used as Swiss-army knives: decode-heavy, multi-node, latency-sensitive serving where memory movement, host overhead, and batch-size trade-offs matter more than raw training-style compute.'
  claimRefs:
