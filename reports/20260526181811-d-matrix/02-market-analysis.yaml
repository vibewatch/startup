- id: FM004
  title: Adoption funnel or value-chain map
  type: flow
  layout: wide
  summary: Merchant inference adoption narrows from workload pain to pilot proof to production rollout, with incumbent software and capacity alternatives acting as a constant friction node.
  data:
    nodes:
    - id: N1
      label: 1. Workload pain identified
      detail: Latency, power, or serving-margin problem appears in a real inference workload
    - id: N2
      label: 2. Architecture evaluation
      detail: Buyer compares GPU-only, API, custom-silicon, and specialist accelerator options
      parent: N1
    - id: N3
      label: 3. Pilot / single-node proof
      detail: Deployment fit is tested on standard servers or scale-up systems
      parent: N2
    - id: N4
      label: 4. Rack-level production decision
      detail: Networking, model partitioning, and operating-cost proof determine go/no-go
      parent: N3
    - id: N5
      label: 5. Broader rollout
      detail: Private-cloud, neocloud, or partner-led expansion after pilot economics hold
      parent: N4
    - id: N6
      label: 'Risk node: incumbent fallback'
      detail: Buyer may stay on GPUs, reserve capacity, or consume APIs if software or benchmark proof is weaker than expected
      parent: N2
  approximationNotes: The flow is qualitative. It reflects the infrastructure buying path implied by the source pack rather than a published conversion funnel, with the risk node showing where incumbents and API abstraction can arrest adoption before full rollout.
