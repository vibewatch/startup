tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance to d-Matrix
  rows:
  - - Broad generative AI spend
    - Model software, services, cloud consumption, infrastructure, and adjacent tooling
    - No clean separation between training, inference, software, and services
    - CIO / CTO / line-of-business budgets
    - Too broad for underwriting d-Matrix
  - - AI accelerator market
    - Merchant accelerator hardware for AI workloads across training and inference
    - General CPU spend and most software/services
    - Clouds, enterprises, model labs, OEMs
    - Useful hardware outer bound, but still broader than d-Matrix
  - - Datacenter generative inference infrastructure
    - Inference cards, servers, racks, memory, interconnect, and serving software for deployed LLMs
    - Model training clusters, edge AI devices, unrelated HPC
    - Infra teams, platform teams, AI product operators
    - Closest direct category
  - - Open-standards low-latency inference systems
    - PCIe and Ethernet based inference deployments using merchant accelerators and partner servers
    - Captive hyperscaler custom silicon and bespoke internal fabrics
    - Enterprises, neoclouds, OEM/integrator channels
    - Most relevant d-Matrix wedge
  - - Status-quo substitute stack
    - Nvidia/AMD GPU servers, Groq-style inference clouds, and external API inference
    - Specialist merchant accelerators not yet adopted
    - Existing cloud or platform owners
    - Primary displacement pool
  notes: Boundary logic narrows from very broad AI spend to the smaller merchant datacenter inference layer that d-Matrix actually addresses. The fourth row is the operative underwriting boundary; rows above it are context, not SAM.
