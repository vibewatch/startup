  evidenceGaps:
  - type: missing-source
    severity: material
    topic: merchant-sam
    missingEvidence: A public dataset that isolates merchant, open-standards datacenter inference hardware spend from broader inference, accelerator, and hyperscaler-captive categories.
    whyItMatters: Without that denominator, any d-Matrix SAM calculation would look more precise than the public evidence actually supports.
    diligencePath: Ask management for the company's bottom-up market model by deployment type, buyer segment, and workload class; reconcile it against customer pipeline and partner channel data.
    relatedQuestionRefs:
    - QM009
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: production-benchmarks
    missingEvidence: Independent production workload data showing d-Matrix latency, power, and TCO versus GPU alternatives across more than one heterogeneous benchmark scenario.
    whyItMatters: Current public proof is directionally positive but still concentrated in vendor-authored materials and one third-party developer benchmark.
    diligencePath: Request customer references, anonymized production telemetry, and repeatable benchmark methodology across interactive, batched, and multi-node workloads.
    relatedQuestionRefs:
    - QM021
    relatedTableRefs:
    - TM004
  - type: private-evidence-only
    severity: material
    topic: som-calculation
    missingEvidence: Deployment count, average cards per cluster, average revenue per deployment, and workload mix by customer segment.
    whyItMatters: Those inputs are required to move from a qualitative wedge thesis to a credible SOM and revenue build.
    diligencePath: Obtain pipeline, installed-base, and pricing data from management and triangulate with OEM and partner channel checks.
    relatedQuestionRefs:
    - QM025
    relatedTableRefs:
    - TM002
  - type: conflicting-data
    severity: minor
    topic: market-share-denominator
    missingEvidence: A consistent public market-share series that uses the same denominator for AI chips, discrete GPUs, and total accelerators over time.
    whyItMatters: Conflicting denominators can make Nvidia’s moat look either weaker or stronger than it is, distorting the competitive framing.
    diligencePath: Normalize all share claims to a chosen denominator before using them in valuation work, and treat low-confidence analyst figures as scenario inputs rather than facts.
    relatedQuestionRefs:
    - QM019
    - QM020
