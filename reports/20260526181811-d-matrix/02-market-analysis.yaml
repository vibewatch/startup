  - CM010
  - CM012
  - CM013
  - CM040
- calloutType: risk
  title: The accessible market is smaller than the headline market
  body: Inference demand is clearly large, but the merchant share available to a startup is much smaller than broad AI-inference TAM slides imply because Nvidia, custom hyperscaler silicon, and API abstraction already absorb a large share of deployed value.
  claimRefs:
  - CM026
  - CM036
  - CM038
  - CM045
