          description: 声称的收益体现为更低延迟、更高每瓦吞吐和更低系统总拥有成本（TCO）
        - id: u6
          label: 公开证据缺口
          description: 主张由基准测试和规格驱动，因为 d-Matrix 不披露自身毛利数据
