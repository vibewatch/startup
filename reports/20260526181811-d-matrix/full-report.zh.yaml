  - id: TV004
    title: 可比估值表
    columns:
      - 参照对象
      - 状态
      - 观测指标
      - 倍数 / 估值背景
      - 为什么重要
      - 关键限制
    rows:
      - - d-Matrix 2025 年 11 月 Series C 轮
        - 已验证私营估值
        - 融资 $275M，估值 $2B；累计融资 $450M
        - 最新披露定价锚
        - 审阅材料中唯一干净的私营估值数据点
        - 无公开收入、ARR 或利润率分母
      - - NVIDIA FY2026 + FY2027 Q1
        - 公开在位厂商规模边界
        - FY2026 收入 $215.9B；数据中心收入 $193.737B；最新季度 $81.615B
        - 可作为披露和规模边界，不是创业公司倍数可比对象
        - 展示完整披露的 AI 基础设施规模长什么样
        - 训练和推理混在一起；业务远比 d-Matrix 宽
      - - AMD FY2025 + 2026 Q1
        - 公开替代厂商规模边界
        - FY2025 收入 $34.639B；数据中心收入 $16.635B；最新季度 $10.253B
        - 又一个规模和披露边界，而不是直接价格可比对象
        - 说明即便是挑战者型在位厂商，也会披露 d-Matrix 没有披露的分母指标
        - 同样混入推理之外更广的组合暴露
      - - Groq
        - 私营推理服务参照
        - 公有云、私有云和共建云计划，以及 GroqRack 本地部署选项可见
        - 商业化打包比 d-Matrix 公开定价更清楚
        - 有助于比较商业模式和部署路径清晰度
        - 审阅材料无法为当前估值提供高置信支撑
      - - Cerebras
        - 私营集成系统参照
        - 晶圆级推理和训练平台；系统级架构
        - 可作为差异化架构参照，不是模块化板卡可比对象
        - 展示另一条推理差异化路径
        - 审阅材料无法为当前估值提供高置信支撑
      - - SambaNova / 其他一体化推理硬件
        - 低可信度私营公司参照
        - 二手报道描述了一体化企业平台和近期融资
        - 仅作为品类背景纳入，不作为数字定价锚
        - 证明私营可比公司样本分散，并未标准化
        - 来源质量不足以支撑高可信估值迁移
    notes: 这张表有意混合一个已验证私营估值标记、两个公开规模边界和三个商业模式参照。它服务于承销逻辑， 不是干净的倍数筛选。
    enumerationScope:
