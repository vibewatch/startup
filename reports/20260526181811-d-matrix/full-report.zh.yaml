  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 乐观解读
      - 悲观解读
      - 什么会改变判断
    rows:
      - - 推理时点
        - 投资人正确预判了推理会成为 AI 的经济主战场
        - 主题可能正确，但这个价格和这家公司能捕获的份额仍可能过于乐观
        - 展示今天已经拿下推理预算的具名生产客户
      - - 架构
        - 近内存设计和模块化插入可能解决真实的延迟与功耗问题
        - 主张仍过多来自公司自述，未必经得起归一化测试
        - 发布第三方同模型基准，同时给出吞吐、延迟、功耗和成本
      - - 商业化
        - GigaIO、Gimlet 和主权 / 企业表述显示可能存在真实市场拉力
        - 公开证据可能仍以试点、伙伴和路线图证明为主，而不是已规模化的经常性需求
        - 披露已签收入、客户数和试点转生产转化
      - - 可比背景
        - 稀缺推理资产相对泛硬件或软件标的可能应享有溢价
        - NVIDIA 和 AMD 已披露巨大规模，私营挑战者仍高度异质且不透明
        - 证明 d-Matrix 属于稀缺性溢价资产，而不是投机型创业公司
      - - 价格纪律
        - 如果乐观情景里程碑很快兑现，$2B 可能合理
        - 目前估值已在缺少公开财务证明的情况下计入成功
        - 更低入场价或强力私有数据室证据会显著改善判断
    notes: 反向逻辑不是 d-Matrix 缺少技术价值，而是最新价格已经跑在公开材料真正能支撑的范围前面。
