      - number: '8.2'
        title: 公开记录支持什么，也不支持什么
        blocks:
          - type: paragraph
            body: >-
              最强的公开证据支持把 d-Matrix 视为一家以推理为先的硬件公司：融资真实、架构连贯、生态关系在增长。公司、投资人和合作伙伴材料反复讲述同一套运营叙事：推理正在成为 AI 的经济瓶颈，d-Matrix
              围绕内存搬运问题设计产品，Corsair 等产品相对 GPU 重的替代方案可以改善吞吐、延迟、功耗和总成本。GigaIO 和 Gimlet
              也至少给出了一些外部证据，显示硬件正在被集成进真实系统，并在异构推理工作流中测试。


              但估值最需要证据变强的地方，证据反而变弱。多数数字化经济性主张来自公司自述或合作伙伴放大。公开材料里最好的独立技术支持，是 Gimlet 的推测解码分析；它有用，但仍比不上与既有 GPU
              集群在同模型、同批量、同延迟下的基准对比。更重要的是，已审阅来源没有披露经常性收入基础、毛利结构、定价曲线或客户集中度，投资人无法把技术潜力换算成可辩护的企业价值。


              这种不对称很关键。今天的公开证据支持“d-Matrix 可能变得重要”。它不支持“当前私募估值已经便宜”。从估值角度，本章可以承保战略可选性和里程碑进展；但不能像隐藏单位经济性已经公开证实一样去承保。
