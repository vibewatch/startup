  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品表面与工作负载匹配
        blocks:
          - type: paragraph
            body: >-
              d-Matrix 已不再只是兜售抽象芯片架构。当前面向客户的产品表面是一套完整推理栈：Corsair 加速卡、JetStream 网络卡、Aviator 软件，以及作为机柜级参考蓝图的
              SquadRack。放到客户工作流里，公司瞄准的是交互式聊天、编码、智能体、推理和多模态工作负载，这些场景低延迟比蛮力基准吞吐更重要。一家创业硬件供应商把产品页面写到这种具体程度并不常见：它公布了单卡、双卡、服务器和机柜配置，并给出具体内存带宽和容量数字。这种具体性是真实的产品技术优势，因为它让买方和尽调团队看到可测试对象，而不是模糊的平台承诺。成熟度上的保留是，大多数公开证明仍停留在官方简报、伙伴公告和参考架构页面，而不是具名生产客户部署。架构信号很强，客户证明信号仍相对薄。公司近期文章还进一步锐化工作负载命题，认为更长上下文窗口、推理链和智能体循环会把推理变成上下文和延迟问题，而不只是原始吞吐竞赛。
