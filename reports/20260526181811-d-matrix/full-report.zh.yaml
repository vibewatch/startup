        - 抬高性能门槛，但也把买方池收窄到超大部署
      - - AMD MI300X
        - 通过 OEM 服务器项目和云合同销售，而非公开街价
        - 192GB HBM3、ROCm 堆栈、OAM 模块封装、OEM 服务器可获得性
        - 净价和支持打包不公开
        - 在熟悉的 GPU 采购路径内改善内存经济性，以此竞争
      - - Groq
        - Free、Developer 和 Enterprise 方案；按用量计费和定制企业合同
        - 公有 / 私有 / co-cloud 接入、区域端点、提示缓存、可选 GroqRack 本地部署
        - 单模型企业经济性需谈判，未完全公开
