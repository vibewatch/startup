  - id: FE001
    title: d-Matrix 产品架构图
    type: stack
    layout: wide
    summary: 从目标工作负载出发，分层展示软件、网络、计算-内存硬件，以及未来内存扩展路线图。
    data:
      layers:
        - label: 工作负载层
          detail: 该栈面向交互式聊天、编码、智能体、推理和多模态推理等场景，解码延迟在这些场景里很关键。
          items:
            - 交互式聊天
            - 编码助手
            - 智能体工作流
            - 推理与视频推理
        - label: 软件层
          detail: Aviator 负责构建、压缩、编译、执行、编排和可观测性。
          items:
            - 模型工厂
            - 压缩器
            - 编译器
            - 推理引擎
            - 主机运行时
        - label: 网络层
          detail: JetStream 借助标准 Ethernet 基础设施，把设备发起的流量扩展到多个节点。
          items:
            - 透明 NIC
            - 400 Gbps Ethernet
            - PCIe Gen5 x16 主机总线
            - 机架顶交换机
        - label: 计算-内存层
          detail: Corsair 在 PCIe 卡上把 DIMC 计算、片上性能内存和片外容量内存组合在一起。
          items:
            - DIMC 核心
            - 每卡 2 GB 片上 SRAM
            - 每卡最高 256 GB 容量内存
            - DMX Link 与 DMX Bridge
        - label: 未来内存扩展层
          detail: 3DIMC、Pavehawk 和 Raptor 旨在把架构扩展到更大的内存容量。
          items:
            - 3D 堆叠 DRAM
            - Pavehawk 测试硅片
            - Raptor 后续路线图
            - Alchip 封装依赖
    approximationNotes: 层级边界采用分析口径，不是公司官方划分。该图旨在展示产品、软件、网络和路线图如何拼成一个平台。
    claimRefs:
      - CE001
      - CE008
      - CE010
      - CE013
      - CE023
      - CE026
  - id: FE002
    title: 客户工作流与运行流程
    type: flow
    layout: wide
    summary: 模型如何从开发者输入进入异构 d-Matrix 部署，再提供低延迟推理服务。
    data:
      nodes:
        - id: n1
          label: 导入模型权重
          detail: 开发者从 PyTorch 或 Hugging Face 模型出发，选择目标工作负载。
        - id: n2
          label: Aviator 构建流程
          detail: 模型工厂、压缩器和编译器将计算图转换为 d-Matrix 专用二进制文件。
        - id: n3
          label: 部署到 Corsair 集群
          detail: 推理引擎和主机运行时将二进制文件部署到服务器或机架内的一张或多张卡上。
        - id: n4
          label: 可选异构预填充或验证阶段
          detail: 更大的验证器或预填充阶段可以留在 GPU 或其他加速器上，在解耦流水线中运行。
        - id: n5
          label: 在 Corsair 上低延迟解码
          detail: Corsair 处理内存受限阶段，低延迟生成 token 在这个阶段最关键。
        - id: n6
          label: JetStream 纵向与横向扩展
          detail: 部署规模扩大时，JetStream 通过标准 Ethernet 在节点间移动激活和状态。
        - id: n7
          label: 返回响应并输出遥测
          detail: 应用返回结果，Aviator 工具同时向运维方输出指标和性能剖析数据。
      edges:
        - from: n1
          to: n2
        - from: n2
          to: n3
        - from: n3
          to: n4
        - from: n4
          to: n5
        - from: n5
          to: n6
        - from: n6
          to: n7
    approximationNotes: 该流程综合了已发布的 Aviator 构建与执行模型，以及 d-Matrix 自己的异构预填充 / 解码叙事；它对应本次审阅语料，不是官方产品图。
