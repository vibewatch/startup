              把具名证明点与宽泛客户数叙事分开后，客户证据图景明显改善。公开层面，d-Matrix 可以指向一条真实商业化阶梯：2024 年末 Corsair 向早期访问客户采样，2025 年 JetStream
              样品，2025 年 5 月 GigaIO 的集成 SuperNODE 报价，SquadRack 计划 2026 年 Q1 通过 Supermicro 渠道可用，以及 2026 年 3 月与 Gimlet Labs
              合作做异构云部署。这些是有意义的里程碑，因为它们显示公司从硬件发布走向伙伴集成系统，再走向具名外部运营商。但同一语料也界定了证明边界。生态页面明确说展示的 logo 不是实际客户，公开的
              GigaIO、Supermicro 和 Liqid 声明仍是伙伴背书，而不是终端客户案例。Gimlet 是这组材料中最清楚的具名外部运营商，但即便如此，公开记录也说，面向选定客户可用的时间计划在 2026
              年下半年，而不是已经大规模生产。换句话说，部署成熟度是真实的，但公开证据更偏渠道就绪和运营商试点，而不是披露的生产账户深度。
