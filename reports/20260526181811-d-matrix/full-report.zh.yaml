      - number: '7.3'
        title: 采用验证与部署摩擦
        blocks:
          - type: paragraph
            body: >-
              第三大风险是采用证据仍落后于技术叙事。公开证据最强的地方，是早期使用合作伙伴、参考架构和部分客户可用窗口；证据还不是一组广泛具名的生产客户。Gimlet 和 GigaIO
              公告有帮助，因为它们显示了真实交易对手和部署意图，但读起来仍像早期商业化界面，不像成熟装机基础。这一点很关键：即便芯片层面的经济性更好，企业采用 AI 仍会被网络、供电和运营复杂度卡住。d-Matrix
              主打风冷、标准服务器，这是实打实的销售优势；但公开记录仍没有说明，客户能否在不投入大量解决方案工程、也不经历漫长认证周期的情况下部署整套栈。因此，这既是客户证明风险，也是落地摩擦风险。
