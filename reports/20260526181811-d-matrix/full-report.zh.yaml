  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 已验证估值、价格纪律与核心判断
        blocks:
          - type: paragraph
            body: >-
              d-Matrix 不是纸面公司。2025 年 Series C 公开披露融资 $275 million、估值 $2 billion，投资人名单真实存在；围绕 Corsair 加速器、JetStream 网络和
              Aviator 软件，公司也有可见的产品叙事。这一轮发生在 2023 年 $110 million Series B
              之后，也发生在公司多年围绕面向推理的数字存内计算做技术定位之后。这些足以让公司值得认真跟踪，但不足以让投资人盲目接受上一轮估值。


              估值问题出在分母。已审阅的公开材料仍未披露收入、年经常性收入（ARR）、毛利率、自由现金流、客户数或股权结构条款。Series C
              公告声称客户快速增长、合作伙伴扩张，但没有告诉外部投资人，这个故事中有多少是试点活动、生产部署，或经济性足够好的经常性需求。没有这些数字，常规的后期收入倍数无法靠公开证据自洽。


              因此，正确结论必须对价格敏感。公司或许在推理栈里有战略相关性，但在 $2 billion
              估值上，公开记录仍显得不完整。所以当前时点的判断是继续研究，而不是买入：技术叙事质量足以支撑继续工作，但公开证明仍太薄，不能把最近一轮估值当作干净的公允价值锚。
