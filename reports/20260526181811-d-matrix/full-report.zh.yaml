      - number: '3.4'
        title: 切换成本、分销与内部自建
        blocks:
          - type: paragraph
            body: >-
              核心竞争问题不在于 d-Matrix 能否讲出强硅片论证，而在于它能否越过让企业留在现有平台上的软件、网络和渠道惯性。NVIDIA 的优势深植系统：买方已经知道如何购买 GPU 集群、给它们散热、连接它们、用
              CUDA 和 TensorRT 编程，并通过熟悉的 OEM 和云渠道采购。AMD 用 ROCm 和更大单 GPU 内存在边际上削弱这道护城河，但仍活在同一套机柜和服务器生态里。Groq、Cerebras 和
              SambaNova 通过改变包装模式来攻击问题——API 主导服务、巨型设备或全一体平台。d-Matrix 站在这些阵营之间。模块化 chiplet
              和卡式路径可能降低插入摩擦，但公开记录仍缺客户参考、价格表和规范化基准，无法证明买方愿意切换、多栖或在生产规模上标准化采用它。内部自建也是一个真实替代方案，因为超大规模云厂商和大型企业越来越多地围绕自身工作负载设计或共同设计推理芯片。
