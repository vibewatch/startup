  - id: TE002
    title: 工作流和用例表
    columns:
      - 用户任务
      - 当前工作流痛点
      - d-Matrix 方案
      - 可衡量收益
      - 限制
    rows:
      - - 交互式聊天或编码助手
        - 小批量场景下，纯 GPU 解码会对延迟和排队变得敏感
        - 在 Corsair 上跑低延迟解码，同时把部署保留在标准 PCIe 服务器里
        - 公司称，单台服务器中 Llama3 8B 最高可达 60,000 tokens/s、1 ms/token
        - 该性能数字由公司报告，且绑定特定工作负载
      - - 70B 级本地推理服务
        - 大模型超出单卡能力，带来机架级内存和网络压力
        - 使用八服务器 Corsair 机架，以及基于 JetStream 的节点间扩展
        - 公司称 Llama3 70B 达 30,000 tokens/s、2 ms/token，并以 100B 参数规模为目标
        - 公开证明最强的是参考架构和伙伴部署，不是具名客户大规模上线
      - - 搭配大型验证模型的异构流水线
        - 纯 GPU 系统必须在快速解码和高质量大模型验证之间折中
        - 用 Corsair 跑受内存约束的推测草稿阶段，把更大的验证器留在 GPU 上
        - Gimlet 报告，在一个推测解码配置中，同等能耗下请求提速 2-5x
        - 独立验证范围较窄，并未覆盖每个推理阶段
      - - 企业现有数据中心改造
        - 新 AI 系统往往需要专有 fabric 或重度基础设施改造
        - 在现有数据中心空间里部署 PCIe 卡加 Ethernet 交换
        - SquadRack 采用风冷，围绕标准服务器和 ToR Ethernet 交换机构建
        - 部署质量仍取决于第三方服务器和交换机集成
      - - 多节点复杂度之前的单节点扩展
        - 分布式推理会增加协调开销和运营复杂度
        - 用 GigaIO SuperNODE 在单节点内容纳数十张 Corsair 卡
        - 伙伴称多节点复杂度更低，并引用 Llama3 70B 达 30,000 tokens/s、2 ms/token
        - 单节点伙伴说法来自伙伴报告，而非广泛基准测试
    notes: 收益混合了官方说法和一个独立从业者基准。本表讨论工作流适配度，而不是全面基准对决。
