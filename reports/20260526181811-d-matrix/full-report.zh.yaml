  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与变现面
        blocks:
          - type: paragraph
            body: >-
              公开记录指向硬件平台收入模式，而不是纯软件或纯 API 生意。d-Matrix 反复把自己讲成一套由 Corsair 加速器、JetStream 网络和 Aviator
              软件构成的全栈推理平台，商业化经由超大规模、企业、主权、OEM 和系统集成商渠道推进。关键在于，收入质量大概率取决于硬件出货和多组件部署赢单，而不是自助式软件采用。GTM 证据也明显偏资格认证。Series B
              被描述为让公司开始商业化 Corsair 的一轮融资，而 2024 和 2025 年产品公告仍依赖采样、早期访问客户、OEM 认证和伙伴配置系统。SquadRack、SuperNODE 和 Gimlet
              云集成都暗示，合同价值可能高于单卡销售，但也意味着服务器、网络和云伙伴之间共享经济性。关键是，d-Matrix 不公布 Corsair 标价、JetStream
              定价、软件许可证定价或已预订客户数。即便生态页面也提醒，伙伴 logo 只是示意，并非实际客户。因此，变现面真实且在变宽，但公开证据仍更清楚地显示渠道形成和试点转化，而不是已实现收入。
