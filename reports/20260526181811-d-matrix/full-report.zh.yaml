        title: 单位经济模型与成本驱动
        blocks:
          - type: paragraph
            body: >-
              d-Matrix 的单位经济模型故事容易描述，但公开证据仍只覆盖一部分。官方材料持续声称，相比 GPU 替代方案，交互速度最高快 10x，成本性能好 3x，能效好 3x 至 5x；第三方 Gimlet
              测试又给出更具体的工作负载代理：把 speculative decode 卸载到 Corsair，在相同能效下把端到端请求延迟降低 2x 至
              10x。这是有意义的证据，说明产品能改善客户在受内存约束推理阶段的经济性。但它不同于证明 d-Matrix 自身毛利率或回本曲线。白皮书和 JetStream
              简报明确把成本和功耗数字标为初步数据，两份文件也说明为什么系统经济性不能简化为芯片基准。JetStream 会增加专用 400 Gbps NIC、光模块或 DAC、功耗、交换机端口和机柜集成工作。Corsair
              服务器和机柜规格暗示更大的平均订单额，但也暗示服务器、网络和支持成本会落在加速器裸片之外。外部市场代理强化了这一点的重要性：AI 推理可能吞掉巨额运营预算，而 GPU
              基础设施仍昂贵、耗电且供应受限。d-Matrix 可能改善这些经济性，但公开证明仍停留在基准和架构层，而不是损益表层。
