      - number: '3.2'
        title: 现有 GPU 堆栈：NVIDIA 与 AMD
        blocks:
          - type: paragraph
            body: >-
              即使买方说想要「更好的推理经济性」而不是「最快的原始集群」，NVIDIA 仍是 d-Matrix 必须在实践中击败的基准。H100、H200 和 GB200 覆盖从单 GPU 部署到机柜级 NVLink
              域的完整梯队，NVIDIA 又在芯片之上叠加软件、网络和企业支持。H100 以 NVLink、InfiniBand、Magnum IO 和 AI Enterprise 锚定已安装基础；H200
              靠更高内存容量和带宽进一步加深大模型推理护城河；GB200 再次抬高竞争门槛，把 72 颗 GPU 收进液冷机柜级系统，并由 NVIDIA 营销成一台巨型推理机器。AMD 是最清晰的主流替代方案，因为
              MI300X 提供更大单 GPU 内存、高带宽和 ROCm，而不是 CUDA。但 AMD 仍在与 NVIDIA 相同的 OEM
