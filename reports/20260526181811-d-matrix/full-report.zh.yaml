      - number: '2.2'
        title: 需求驱动与结构性瓶颈
        blocks:
          - type: paragraph
            body: >-
              公开证据强烈支持一个品类判断：推理需求正在跑赢最初为训练而建的基础设施。CNN、VentureBeat 和 TechTarget 都描述了 GPU 稀缺、数据中心扩张压力，以及为追上 AI
              需求而增加能源和网络容量的必要性。d-Matrix 自己的架构叙事与这些独立证据方向一致：内存搬运消耗电力，主机中转网络增加延迟，batch size 直接拉扯用户体验与硬件
              ROI。推理和智能体工作流放大了这些压力，因为它们增加了推理时计算量，又不允许运营商用简单吞吐指标掩盖延迟。市场因此从训练优先的讨论转向运营和服务讨论。约束栈不只是原始
              FLOPS，而是电力、内存带宽、集群通信开销，以及在规模化交付快速答案时不让太多昂贵硬件闲置的经济性。
