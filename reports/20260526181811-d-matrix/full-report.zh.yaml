  - id: TE003
    title: 技术和运营架构表
    columns:
      - 层 / 流程
      - 作用
      - 关键依赖
      - 关键风险
    rows:
      - - 带片上 SRAM 的 DIMC 核
        - 把内存贴近计算，用于低延迟 token 生成和交互式解码
        - 成功把推理内核和数据移动映射到 DIMC 内存层级
        - 架构有差异化，但广泛第三方工作负载验证仍有限
      - - 容量内存层
        - 在不放弃内存中心设计的前提下，扩大模型和上下文占用
        - Aviator 调度和运行时策略，决定哪些数据放快速内存、哪些放容量内存
        - 性能取决于工作负载适配度，以及仍需在层级之间移动多少数据
      - - Chiplet 加 DMX Link 和 DMX Bridge
        - 从单个 chiplet 池扩展到双卡和机架级配置
        - 跨 OEM 系统的封装、互连良率和板卡认证
        - Chiplet 和桥接复杂度可能成为封装、信号完整性或认证瓶颈
      - - JetStream 透明 NIC
        - 提供低延迟节点间加速器通信，绕开主机中介 RDMA 开销
        - 标准 Ethernet 光模块、交换机、PCIe Gen5 主机和 JetStream 固件
        - 生产级网络证明晚于 Corsair 计算证明
      - - Aviator 软件栈
        - 转换模型、压缩图、编译二进制文件、编排分布式执行并暴露工具
        - 模型支持、编译器成熟度、运行时稳定性和开发者支持
        - 软件质量是核心，因为硬件价值只有通过这套栈才能兑现
      - - 机架和服务器生态层
        - 通过 Supermicro、GigaIO、Liqid、Arista 和 Broadcom，把卡和 NIC 变成可部署系统
        - 伙伴认证、支持交接和标准服务器供应
        - 开放标准降低锁定效应，但增加集成依赖
      - - Pavehawk 和 Raptor 上的 3DIMC
        - 用堆叠 DRAM 把架构推向更大内存推理
        - Alchip 封装和 ASIC 工作、晶圆厂产能，以及测试硅成功转为产品硅
        - 路线图价值很高，但商业时点和外部验证仍未证明
    notes: 本表聚焦把 Corsair 变成可用平台所需的运营栈。依赖被明确列出，因为 d-Matrix 今天卖的不是封闭设备。
