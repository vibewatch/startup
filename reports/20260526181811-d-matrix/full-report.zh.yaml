          label: Corsair 卸载
          description: 以 SRAM 为中心的加速器以更低延迟处理内存密集阶段
        - id: u4
          label: JetStream 横向扩展
          description: 专用 NIC 和标准 Ethernet 协调多节点通信
        - id: u5
