  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界，以及从训练转向推理
        blocks:
          - type: paragraph
            body: >-
              d-Matrix
              的市场边界不是抽象的「AI」，甚至也不是所有加速器支出。公司公开材料、技术文档和发布信息都持续把公司放在数据中心推理场景：以低延迟、高内存带宽和更好的成本及能效，服务已经训练好的生成式模型。因此，纳入的支出包括加速卡、推理服务器和机柜、扩展服务所需的互连与
              NIC 层，以及让这些系统可在企业或 neocloud 环境中部署的软件栈。排除的支出包括模型训练集群、永远不会变成商用硬件的超大规模云厂商自研芯片、纯 API
              支出和边缘设备推理。这个区分重要，因为训练完成后技术瓶颈会变化。d-Matrix 和第三方开发者证据都强调，prefill 受计算约束，而 decode 与智能体服务更受内存和延迟约束；这正是通用 GPU
              经济性最薄弱、专业加速器有机会切入的栈位置。
