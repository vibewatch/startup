      - number: '2.5'
        title: 相互矛盾的基准与市场份额叙事
        blocks:
          - type: paragraph
            body: >-
              本章的核心矛盾是：推理机会显然在扩张，但公开的份额获取证据仍压倒性地偏向现有厂商。d-Matrix 自有材料和 Gimlet 伙伴支持的工作负载显示，在受内存约束或异构推理阶段，特别是小 batch
              延迟重要的地方，产品可能具备真实性能优势。但标准化基准覆盖、主流 GPU 产品页和市场份额估计仍显示，Nvidia 在多数公开比较中设定可见前沿。即便市场份额数字彼此也不一致，因为分母会变化：一个来源谈 AI
              芯片，另一个谈独立 GPU，第三个谈包含自研芯片在内的全部加速器。这并不意味着创业公司命题错误，而是意味着命题必须更具体。投资人应把 d-Matrix
              承销为切入商用、低延迟敏感、开放标准推理部署的楔子，目标买方重视可预测 TCO 和部署匹配；而不是承销成一个泛泛声称将取代所有推理负载 GPU 栈的公司。
