          label: 4. 机架级生产决策
          detail: 网络、模型切分和运营成本证明决定是否推进
          parent: N3
        - id: N5
          label: 5. 更广泛部署
          detail: 试点经济性站住后，私有云、neocloud 或伙伴牵头扩张
          parent: N4
        - id: N6
          label: 风险节点：回退到现有供应商
