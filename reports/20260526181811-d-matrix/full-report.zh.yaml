        - 系统级企业合同；公开价格缺乏统一口径
        - 集成硬件加软件堆栈、调优后的大模型服务、企业支持
        - 实际 token 经济性和设备价格大多未公开
        - 靠交钥匙集成价值竞争，而不是开放组件对比
      - - 基于既有 GPU 云的内部自建
        - 历史上可能意味着极高月度账单，加上数据中心升级或巨额 GPU 预留
        - 最大化工作流控制，并复用既有 ML 工具
        - 真实成本取决于模型大小、流量、利用率和预留容量
        - 这种替代方案仍然昂贵，但熟悉，因此黏性强
