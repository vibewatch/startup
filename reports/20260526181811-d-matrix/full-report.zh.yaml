      - number: '4.3'
        title: 资本强度、伙伴依赖与融资依赖
        blocks:
          - type: paragraph
            body: >-
              融资形成是财务图景中最清楚的部分。d-Matrix 已公开披露累计融资 $450M，包括 2023 年 $110M Series B，以及 2025 年以 $2B 估值完成的 $275M Series
              C。两轮融资都明确绑定商业化、路线图执行、招聘、全球扩张和大规模部署。这是正面因素，因为公司并不是试图用很少资金扩展一套复杂的推理硬件栈。但这也是警示信号：经营计划目前看起来更由融资支撑，而不是由客户资金支撑。路线图本身资本强度很高。Corsair
              依赖 chiplet、高带宽内存集成、服务器认证和伙伴分销。JetStream 增加专用网络硬件。下一代 3DIMC 路线图又明确依赖 Alchip 做 ASIC
              设计、先进封装和制造管理。公开同业文件显示，这通常在实践中意味着库存承诺、押金、长交期、板卡和内存成本，以及需求时点偏移时的利润率压力。d-Matrix
              借助伙伴而不是垂直拥有每个系统组件，可能从中受益，但这只是把部分固定成本换成对
              Supermicro、Arista、Broadcom、GigaIO、云伙伴和先进封装供应商的执行依赖。没有公开现金、烧钱速度或现金跑道，投资人无法判断当前资产负债表是足以舒适覆盖扩张要求，还是只是在把公司桥接到下一轮融资。
