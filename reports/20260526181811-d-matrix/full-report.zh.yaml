  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >-
              d-Matrix 身处一个拥挤但仍在流动的 AI 推理市场。最重要的直接替代品不是一组同质化同业：NVIDIA 和 AMD 销售可同时跑训练与推理的通用加速器栈；Groq、Cerebras 和 SambaNova
              走推理优先或紧密集成路线；许多买方的现状仍是基于现有 GPU 云或私有机柜内部自建。独立市场报道反复提到同一组结构性压力：推理工作负载增长速度超过买方吸收电力、散热、内存和 GPU 采购成本的能力，这也是
              d-Matrix 这类挑战者首先获得关注的原因。d-Matrix 自己的主张是，Corsair 卡、JetStream NIC 和 Aviator
              软件攻击让大模型推理变贵的内存搬运惩罚。因此，公司竞争时不太像通用 GPU 替代品，更像是针对推理需求中受内存约束、低延迟敏感切片的专用答案。
