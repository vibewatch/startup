      - number: '8.4'
        title: 乐观、基准与悲观情景
        blocks:
          - type: paragraph
            body: >-
              由于收入和 ARR 未披露，情景分析必须按里程碑走，而不是按倍数走。正确问题不是“私营 AI 芯片创业公司到底该按多少 EV /
              收入倍数交易？”公开记录回答不了这个问题。正确问题是：什么证据状态足以支撑低于、接近或高于最近披露的 $2 billion 估值。


              悲观情景假设商业化仍主要由试点和合作伙伴牵引，独立基准归一化仍未出现，下一轮融资或老股交易把 d-Matrix 的价格定在更接近 IP
              价值加有条件商业可选性的位置，而不是已验证的平台领导力。这会产生一个宽泛但明显低于上一轮的区间，约为 $700 million 到 $1.0
              billion。基准情景假设部署继续推进、融资渠道仍在，但仍没有强到足以证明 Series C 估值溢价的公开财务披露；这支撑大约 $1.2 billion 到 $1.8
              billion。乐观情景要求具名大规模部署、被验证的经济性，以及更清楚的证据表明 d-Matrix 能在生产环境中与既有 GPU 基础设施共存或替代它；这支撑大约 $2.5 billion 到 $3.5
              billion。


              这个框架很重要，因为最近披露的一轮估值高于本章中点。Series C 不是完全无法辩护，但它已经计入了一条更接近乐观情景、而不是基准情景的执行路径。所以当前立场是偏高，而不是有吸引力。
