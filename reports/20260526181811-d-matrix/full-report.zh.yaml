              公开记录中最弱的是耐久性证据。官方和独立来源称公司客户快速增长，并在准备多个大规模部署，但所有已审阅材料都没有量化活跃客户数、重复订单频率、合同期限、总留存率、净留存率或流失。集中度风险也是如此：没有公开披露头部客户敞口、伙伴与直销渠道组合，也没有说明收入中有多少来自某一个超大规模、企业或主权账户。因此，本章可以承销商业化正在推进，但不能承销它已经广泛、粘性强且多元化。2026
