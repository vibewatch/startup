        - 编译器 / 运行时路径不同于标准 GPU 堆栈
      - - Cerebras
        - 集成式大模型系统
        - 拥有晶圆级平台的大型私营 AI 芯片公司
        - 超大模型训练与推理
        - 晶圆级引擎、巨大的片上算力、系统级内存策略
        - 专用设备模式不如标准机架易插即用
      - - SambaNova
