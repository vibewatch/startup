          detail: 未公开收入、ARR、毛利率或客户数量
        - id: n4
          label: 可比公司集合不匹配
          detail: 上市既有厂商构成规模围栏，私营挑战者又高度异质
        - id: n5
          label: 基于里程碑的区间
          detail: 除非乐观里程碑兑现，公开证据中心落在最新披露轮次以下
        - id: n6
          label: 继续研究 / 偏高
          detail: 只有更低价格或扎实的私下尽调，才应把判断推向买入
