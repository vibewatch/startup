      - number: '7.2'
        title: 供应、制造与生态依赖
        blocks:
          - type: paragraph
            body: >-
              第二大风险是封装、代工选择、网络和系统集成上的集中依赖。下一代内存路线图要靠外部先进封装落地，公开第三方报道也把 d-Matrix 的 chiplet 路径与 TSMC
              节点选择和演进中的接口标准绑在一起。与此同时，当前上市路径要靠 Arista、Broadcom、Supermicro、GigaIO
              等合作伙伴把卡变成可部署系统。合作伙伴重的模式降低了客户的专有锁定，但把执行风险转移到第三方认证、支持交接和 BOM 供应上。宏观供应环境并不帮忙：先进封装瓶颈和邻近的 GPU 短缺已经证明，AI
              硬件供应链收紧可以来得很快。今天的缓释因素是概念上的开放性和合作伙伴广度，不是自给自足或高度冗余供应链的证据。
