  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 买方细分与采购中心
        blocks:
          - type: paragraph
            body: >-
              即便公开材料没有透露多少账户已经转化，它们仍相当一致地描绘了 d-Matrix 想卖给谁。Series C 新闻稿把顶层目标客户锚定为超大规模、企业和主权客户；SquadRack
              又把运营买方缩窄到云供应商、主权云，以及试图服务智能体 AI、推理和视频工作负载的企业。因此，反复出现的决策者画像不是应用团队，而是基础设施和平台领导者：数据中心运营商、AI
              平台架构师，以及希望在既有设施中获得更低延迟推理的云建设者。围绕标准 PCIe 服务器、Ethernet 和风冷的销售叙事也强化了这一定位。d-Matrix
              并不是在推销一个只适合超大规模云厂商、需要绿地基础设施的定制机柜；它推销的是一条改造路径，面向想增加推理容量、但不想承接专有网络或液冷强制要求的运营商。当前最强匹配看起来是企业和 neocloud
              型运营商，加上重视基础设施可选性的主权云项目；公开材料仍没有披露超大规模云的生产引用。
