      - number: '5.2'
        title: DIMC、JetStream 与 Aviator 架构
        blocks:
          - type: paragraph
            body: >-
              核心技术命题是，现代推理受内存搬运主导，尤其在 decode 阶段，因此 d-Matrix 针对以内存为中心的执行优化，而不是试图长得像另一块 GPU。Corsair 将 DIMC 计算与大规模片上 SRAM
              和容量内存配对，再通过 chiplet、DMX Link 和 DMX Bridge 横向扩展。Aviator
              与硅片同样重要，因为它负责模型转换、压缩、编译、运行时执行、集群编排和开发者工具。近期技术文章把这一框架从芯片本身向外扩展，认为上下文压力、KV-cache 降低，以及跨软件、网络和基础设施的优化，是 DIMC
              的必要补充，而不是副业。JetStream 把同一套低延迟哲学延伸到多节点通信：分离数据平面和控制平面，并支持设备发起的加速器到加速器传输，底层仍走标准
              Ethernet。技术故事最可信的地方在于，硬件、网络和软件层描述得足够具体，可以拼出一套连贯运营模型。主要尽调问题不是有没有架构，而是该架构在 d-Matrix 和少数技术伙伴之外被多广泛地验证过。
