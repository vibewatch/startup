      - number: '5.3'
        title: 部署、机柜架构与供应依赖
        blocks:
          - type: paragraph
            body: >-
              d-Matrix 试图借助标准 PCIe 服务器、标准 Ethernet 网络和生态伙伴来降低部署难度，而不是要求客户重建专有机柜。SquadRack 和 GigaIO SuperNODE
              展示了预期服务器和机柜拓扑：尽可能在节点内纵向扩展，然后在模型尺寸或请求量增加时经 Ethernet 横向扩展。这应当降低企业和主权云环境的改造摩擦，让它们无需采用超大规模云式液冷也能获得 AI
              推理。代价是依赖。d-Matrix 需要 Supermicro、Arista、Broadcom、GigaIO 和 Liqid 把卡变成可部署系统；路线图还依赖 Alchip、晶圆产能和先进封装，从 Corsair
              推进到基于 3DIMC 的产品。近期公司和伙伴文章把这种相互依赖说得很清楚：d-Matrix 现在把开放标准框定为战略选择，其 GigaIO 公告把单节点纵向扩展纳入官方部署故事，Alchip 也独立确认了
              3DIMC 背后的共同封装角色。更早的 Nighthawk 和 Jayhawk
              披露显示，这种依赖模式并不新；封装和互连一直是公司命题的核心。因此，产品可以差异化，同时仍对执行敏感：架构对开放标准友好，但供应链并不自给自足。
