      - number: '8.3'
        title: 可比公司集合与反推承保逻辑
        blocks:
          - type: paragraph
            body: >-
              可比集合有用，但前提是用法正确。NVIDIA 和 AMD 是最干净的公开参照点，可用于衡量规模、披露质量和既有巨头强度。它们的官方产品页定义了内存、带宽和机架级集成上的技术门槛；2026
              年文件也展示了已经以巨大商业规模运行的 AI 基础设施业务该如何充分披露。因此，它们是不可缺少的规模边界，但不是一家没有公开收入分母的私营创业公司的直接定价可比。


              私营和专门化挑战者也很不均质。Groq 因为披露服务层级和本地部署可选项，商业上更容易理解。Cerebras 通过晶圆级集成系统竞争。低置信度二级市场报道显示，SambaNova 又属于另一个桶：一体化企业 AI
              基础设施，而不是模块化插卡。d-Matrix 又在别处，试图销售一套贴近内存的推理栈，可以插进更标准的服务器和机架环境。这些不是细小的封装差异；它们会改变客户预算、部署摩擦，以及公开可观察的估值支撑类型。


              最合理的推断是，Series C 投资人承保的是品类时点和架构契合度，而不是已经披露的财务规模。换句话说，他们大概率是在为几件事付费：推理需求会继续上升，市场会奖励更低延迟、更低功耗的替代方案，d-Matrix
              能在既有巨头栈吸收机会之前，把合作伙伴、主权或企业兴趣转化成一个耐久利基。这个逻辑可以理解，但它仍不是公开估值支撑。
