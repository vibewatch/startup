companyProfile:
  summary: >-
    d-Matrix 是一家位于 Santa Clara 的 AI 推理基础设施公司，由 Sid Sheth 和 Sudeep Bhoja 于 2019 年创立。公司现在围绕 Corsair 加速卡、JetStream
    网络、Aviator 软件和开放标准机柜部署，给出了一套具体的全栈产品叙事，目标客户包括超大规模、企业和主权数据中心。公开融资历史有较强证据支撑：公司在 $2B 估值下完成 $275M Series C，累计披露融资 $450M；到
    2025 年底，员工超过 250 人，并拥有多办公室布局。仍缺的是经营分母：公开资料尚未披露收入、ARR、广泛客户数或控制经济性，细节不足以像成熟后期基础设施公司那样承销这门生意。
