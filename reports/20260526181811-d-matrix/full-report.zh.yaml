      - number: '7.4'
        title: 合规、安全与监管风险
        blocks:
          - type: paragraph
            body: >-
              第四大风险是，合规、出口管制和安全证明比许多企业和主权买家今天对推理基础设施供应商的预期更薄。容易核验的公开法律材料，是网站隐私政策和使用条款；这些材料必要，但不能替代产品安全架构、审计姿态或专门的信任中心。这个缺口很重要，因为受监管买家越来越重视数据控制、可预期治理和本地部署保障，竞争平台也会明确营销这些能力。叠加其上的还有出口管制风险。BIS
              已经收紧先进计算半导体和规避路径的管制，这意味着先进 AI 硬件供应链处在活跃监管制度之下。d-Matrix
              未必会被这些规则直接挡住，但投资人仍需要搞清楚封装伙伴、制造地域和目标客户如何与不断演进的贸易管制相互作用。
