      - number: '8.5'
        title: 退出就绪度、逻辑失效触发点与最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              公开证据更支持战略相关性，而不是退出就绪度。公司正在建设 AI 栈中最拥挤但也最重要的层之一；如果平台成为必备推理组件，确实会创造战略出售或后续老股交易的可选性。但当前公开披露不像已经 IPO
              就绪。公开可比公司披露收入、利润率、文件节奏和分部表现；d-Matrix 没有。


              披露缺口决定了叫停条件。如果一次定价融资显著低于 $1 billion，就会强烈表明市场已经重估 Series C
              叙事。如果合作伙伴公告和早期使用计划无法转化成具名生产部署，商业化故事就会被削弱。如果独立基准无法支持公司声称的成本或效率优势，支付溢价购买专门化推理架构的核心理由就会消失。


              因此，所需尽调必须具体，而不是泛泛而谈：经审计收入和 ARR、毛利率历史、客户集中度、订单到部署的转化、实际定价和支持条款，以及优先股堆叠或近期 409A 或老股估值。没有这些，新投资人承保的是 d-Matrix
              可能重要这个故事，而不是 $2 billion 已经是纪律性入场价这个命题。
