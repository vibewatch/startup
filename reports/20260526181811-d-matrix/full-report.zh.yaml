  - id: TV005
    title: 投资逻辑破裂与放弃触发因素表
    columns:
      - 触发因素
      - 阈值 / 事件
      - 投资逻辑传导
      - 行动含义
    rows:
      - - 融资重置
        - 任何定价轮或老股成交价明显低于 ~$1B
        - 证明 C 轮叙事没有站住，压缩后续上行空间
        - 按新的市场出清价格重建投资案例
      - - 商业化停滞
        - 到下一轮融资周期仍无具名生产部署，或试点转生产转化偏弱
        - 削弱“架构正在变成真实收入引擎”的论点
        - 立即转向悲观情景
      - - 基准测试失败
        - 独立同一负载测试未能验证实质性总拥有成本（TCO）或效率优势
        - 拿掉为专用推理硬件支付溢价的核心理由
        - 剔除溢价假设，重新评估投资意愿
      - - 经营披露薄弱
        - 私下尽调显示毛利质量差、客户集中或转化低
        - 技术故事变成低质量硬件商业化故事
        - 要求大幅降价，否则退出
      - - 被现有巨头吸收
        - 客户标准化采用 NVIDIA/AMD 或一体化替代方案，而不是引入 d-Matrix
        - 压缩 C 轮看似押注的细分空间
        - 假设增长更慢、退出选项更少
    notes: 放弃标准可监测，并直接绑定估值传导，而不是泛泛的公司风险。
    claimRefs:
      - CV039
      - CV041
      - CV043
      - CV053
      - CV054
      - CV055
  - id: TV006
    title: 最终尽调问题清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 经审计收入 / 年经常性收入（ARR）
        - 2024-2026 年月度和年度收入，以及年经常性收入（ARR）
        - 所有公开估值方法都缺少核心分母
        - 索取经审计财报和董事会关键指标包
      - - 毛利率与现金转化
        - 毛利率、运营费用、烧钱速度和营运资本画像
        - 用来区分有价值的基础设施软件杠杆与昂贵硬件部署
        - 索取经审计损益表、现金流历史和毛利率桥
      - - 客户证据
        - 具名生产客户、队列扩张和头部账户集中度
        - 用来区分伙伴活动与可持续经常性需求
        - 索取客户名单、集中度明细和试点转生产数据
      - - 定价与支持经济性
        - 实际平均售价（ASP）、折扣、软件附加销售和支持义务
        - 用来检验公开总拥有成本（TCO）主张能否经受商业现实
        - 索取价格表、试点发票和支持条款摘要
      - - 股权结构表与优先权
        - 完全摊薄所有权、优先股堆叠、附函，以及近期任何 409A 或要约估值标记
        - 因为在估值下调情景下，企业价值和普通股价值可能大幅分叉
        - 索取股权结构表、瀑布模型，以及最新 409A 或老股交易数据
      - - 基准测试归一化
        - 与 H100/H200/MI300X 以及实际进入候选名单的一体化挑战者做同模型第三方基准测试
        - 用来验证本章全部溢价经济性假设
        - 承销价格前委托或取得归一化基准证据
    notes: 这些要求是阻断项，不是可选项。缺少它们，投资人押注的是战略叙事，而不是可辩护估值。
    claimRefs:
      - CV017
      - CV030
      - CV054
      - CV055
      - CV056
figures:
  - id: FO001
    type: timeline
    layout: wide
    title: 公司里程碑时间线
    summary: 2019 到 2026 年间，公司从融资和架构定位走向产品发布、伙伴集成和公开负载验证。
    approximationNotes: 只有月份的里程碑使用该月第一天，方便渲染器放到时间线上；这不表示抓取来源支持更精确日期。
    data:
      items:
        - label: 成立
          date: '2019-01-01'
          detail: d-Matrix 成立于 2019 年，起步时押注推理优先架构。
          tone: positive
          claimRefs:
            - CO001
            - CO008
