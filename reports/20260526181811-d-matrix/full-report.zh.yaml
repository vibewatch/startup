      - number: '3.5'
        title: 护城河耐久性与反向证据
        blocks:
          - type: paragraph
            body: >-
              d-Matrix 具备可信但仍暂定的护城河。最强支柱是技术匹配：多个来源把推理成本和电力痛点连接到内存搬运，而 d-Matrix 的数字内存内计算加 chiplet
              互连策略正是围绕这个瓶颈打造。第二个支柱是模块化；Jayhawk、卡、NIC 和软件暗示一套异构部署叙事，可能比专有超级设备更容易插入。但反向证据也有分量。NVIDIA
              仍拥有最成熟的基准记录、软件栈和分销版图。AMD 持续缩小内存论点。Groq 拥有最清晰的可预测低延迟服务公开包装。Cerebras 和 SambaNova
              为超大模型销售更紧密集成的系统。最重要的是，d-Matrix
              公开的性能和成本主张仍主要由供应商撰写，而不是由独立、同口径的基准套件规范化。护城河耐久性因此处于「中等」：差异化足以重要，但尚未坚固到可以忽视现有厂商或一体化系统反击风险。
