      - number: '2.3'
        title: 买方细分、预算所有者与采用路径
        blocks:
          - type: paragraph
            body: >-
              买方地图比泛泛的「企业 AI」表述更窄。d-Matrix 最现实的早期细分，是拥有低延迟敏感推理负载的企业或私有云运营商、neocloud 和托管推理供应商、试图控制服务经济性的 AI
              产品公司，以及把卡封装进系统的 OEM 或集成商伙伴。超大规模云厂商仍具战略意义，但结构上更难拿下，因为它们已经控制大型 GPU 资产，并越来越多地建设自有芯片。d-Matrix 的开放 PCIe 和
              Ethernet
              定位，再加上风冷机柜叙事，更自然地匹配那些希望把推理塞进既有数据中心版图、而不愿围绕液冷巨型集群重建设施的客户。采用路径也相应偏重基础设施：先识别受内存约束或对延迟敏感的工作负载，在试点或单节点部署中验证匹配度，然后在网络、模型切分和运营成本跑通后，扩展到服务器或机柜级生产。集成商和
              OEM 很重要，因为买方买的是可部署系统，而不只是一颗芯片。
