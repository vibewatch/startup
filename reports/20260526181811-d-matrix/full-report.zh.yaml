      - number: '6.3'
        title: 扩张路径、渠道依赖与采购摩擦
        blocks:
          - type: paragraph
            body: >-
              扩张命题是连贯的，也可能是本章最大的正面因素。d-Matrix 试图先在低延迟敏感推理可插入既有数据中心的地方落地，然后从卡评估扩展到 单节点纵向扩展、机柜级部署和更广泛的异构云部署。GigaIO
              代表单节点纵向扩展步骤，SquadRack 加 Supermicro 代表机柜级和渠道销售步骤，Gimlet 代表云服务商路径，可在 GPU
              旁边做工作负载特定加速。挑战在于，每一步都依赖伙伴执行。公开材料反复显示，d-Matrix 需要
              OEM、系统集成商、交换伙伴和编排层，才能把技术差异化转化为可重复客户采用。独立来源把摩擦说得更直白：企业采购仍围绕 Nvidia
              可信的软件和系统生态优化，异构部署只有在抽象层隐藏硬件复杂度之后才会变得容易。因此，d-Matrix 的客户扩张路径可信，但转化风险仍卡在 OEM
              认证、开发者工作流兼容性，以及买方是否足够信任平台、愿意从试点或评估走向重复生产支出之间。
