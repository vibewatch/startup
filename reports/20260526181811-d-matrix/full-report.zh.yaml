              - CV048
              - CV055
          - type: callout
            title: 只有更低价格或私下尽调能改变判断
            body: 本章不支持按最近披露轮次给出买入建议。只有入场价显著改善，或数据室补上公开材料留下的收入、利润率、客户和股权结构缺口，才支持继续推进。
            calloutType: recommendation
            claimRefs:
