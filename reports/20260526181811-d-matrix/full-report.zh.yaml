        title: 身份、版图与商业模式
        blocks:
          - type: paragraph
            body: >-
              应把 d-Matrix 看作一家专门围绕推理而非训练打造的 Series C AI 基础设施公司。官方网站首页、关于页面和 2025 年 Series C 新闻稿都把公司锚定在 Santa
              Clara，并将业务表述为向超大规模、企业和主权数据中心工作负载销售加速计算。公开材料称公司成立于 2019 年，当前产品栈结合了 Corsair 推理加速器、JetStream 网络和 Aviator
              软件。首页还称，3DIMC 架构采用基于 chiplet、适配 PCIe 的设计，可扩展到超过 1000 亿参数的模型。后续章节可复用的底层事实因此很清楚：d-Matrix
              正在把低延迟推理所需的硬件加软件基础设施商业化。公开记录仍未给出公司层面的客户数或收入数据，无法把当前商业规模完全量化。
