      - number: '2.4'
        title: 规模测算视角，以及真正可触达的市场
        blocks:
          - type: paragraph
            body: >-
              公开市场数字很大，但不能直接相加，也不都描述同一个商业表面。Gartner 的生成式 AI 支出预测是最宽的相邻口径，包含软件、服务和基础设施。MarketsandMarkets 的 AI
              推理估计更窄，但仍比商用芯片本身更宽。Silicon Analysts 的 AI 加速器市场在硬件轴上再窄一些，但仍包含训练和多种现有或自研架构。来源包中最有决策价值的下限视角甚至不是 TAM 报告：CNBC
              估计，仅 Bing AI 就至少需要 $4B 基础设施。这个部署成本视角抓住了该品类存在的原因。d-Matrix 可触达的 SAM
              小于上述所有数字，因为它排除了训练、排除了大量超大规模云厂商自研芯片，也排除了满足于通过外部 API 消费推理的买方。公开数据足以证明品类很大，但不足以在没有管理层披露的情况下发布干净的 d-Matrix
              SOM。
