  - CV048
  - CV055
- calloutType: recommendation
  title: Only a lower price or private diligence moves the call
  body: The chapter does not support a buy recommendation at the last disclosed round. It supports continued work only if entry price improves materially or a data room closes the revenue, margin, customer, and cap-table gaps that the public corpus leaves open.
