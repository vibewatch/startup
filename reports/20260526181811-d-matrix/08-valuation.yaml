- id: what-the-public-record-supports-and-what-it-does-not
  title: What the public record supports — and what it does not
  body: |-
    The strongest public evidence supports d-Matrix as an inference-first hardware company with real financing, a coherent architecture, and growing ecosystem ties. Company, investor, and partner materials consistently repeat the same operating narrative: inference is becoming the economic bottleneck in AI, d-Matrix designed around the memory-movement problem, and products such as Corsair can improve throughput, latency, power, and total cost versus GPU-heavy alternatives. GigaIO and Gimlet also provide at least some outside evidence that the hardware is being integrated into real systems and tested in heterogeneous inference workflows.

    But the evidence gets weaker exactly where valuation needs it to get stronger. Most numerical economic claims are company-authored or partner-amplified. The best independent technical support in the corpus is Gimlet's speculative-decoding analysis, which is useful but still narrower than a same-model, same-batch, same-latency benchmark versus incumbent GPU clusters. More importantly, no reviewed source discloses the recurring revenue base, margin structure, pricing curve, or customer concentration that would let an investor translate technical promise into a defensible enterprise value.

    That asymmetry matters. Public evidence today supports the proposition that d-Matrix could become important. It does not support the proposition that the current private mark is already cheap. In valuation terms, the chapter can underwrite strategic optionality and milestone progress; it cannot underwrite hidden unit economics as if they had been publicly proved.
