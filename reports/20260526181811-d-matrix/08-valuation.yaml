    - Shows how even a challenger incumbent discloses denominator metrics d-Matrix does not
    - Also mixes broader portfolio exposure beyond inference
  - - Groq
    - Private inference-service reference
    - Public/private/co-cloud plans and GroqRack on-prem option are visible
    - Commercial packaging is clearer than d-Matrix public pricing
    - Useful for business-model comparison and deployment-path clarity
    - Reviewed corpus does not provide high-confidence current valuation support
  - - Cerebras
    - Private integrated-system reference
    - Wafer-scale inference and training platform; system-level architecture
    - Comparable as a differentiated architecture, not as a modular card comp
    - Shows another path to inference differentiation
    - Reviewed corpus does not provide high-confidence current valuation support
