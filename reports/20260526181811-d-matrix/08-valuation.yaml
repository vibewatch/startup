company:
  name: d-Matrix
chapter:
  number: 8
  title: Valuation
  summary: d-Matrix's 2025 $275 million Series C at a $2 billion valuation is real and backed by blue-chip investors, but the public record still does not disclose revenue, ARR, gross margin, or named production customer scale. That makes the round look more like milestone underwriting on inference scarcity, architecture, and deployment optionality than a financially proven late-stage growth mark, so the chapter supports a research-more recommendation, medium confidence, high risk, and a stretched valuation stance at the latest disclosed price.
sections:
- id: verified-marks-and-price-discipline
  title: Verified marks, price discipline, and the core call
  body: |-
    d-Matrix is not a paper company. The 2025 Series C was publicly disclosed at $275 million and a $2 billion valuation, the investor list is real, and the company has a visible product story around Corsair accelerators, JetStream networking, and Aviator software. The round also came after a 2023 $110 million Series B and years of technical positioning around digital in-memory compute for inference. That is enough to justify serious attention. It is not enough to justify blind acceptance of the last mark.

    The valuation problem is the denominator. The reviewed public corpus still does not disclose revenue, ARR, gross margin, free cash flow, customer count, or cap-table terms. The Series C announcement claims rapid customer growth and expanding partners, but it does not tell an outside investor what portion of that story is pilot activity, production deployment, or economically attractive recurring demand. Without those numbers, a conventional late-stage revenue multiple cannot be defended from public evidence.

    The right conclusion is therefore price-sensitive. The company may be strategically relevant to the inference stack, but at $2 billion the public record still looks incomplete. That is why the present-tense call is research-more rather than buy: the quality of the technical story is good enough to keep working, but the public proof is still too thin to treat the latest round as a clean fair-value anchor.
