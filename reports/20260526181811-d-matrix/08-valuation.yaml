- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Bull read
  - Bear read
  - What would change the view
  rows:
  - - Inference timing
    - Investors correctly anticipated inference becoming the economic battleground of AI
    - The theme may be right while this price and this company-specific capture are still too optimistic
    - Show named production customers winning inference budgets today
  - - Architecture
    - Memory-local design and modular insertion could solve a real latency and power problem
    - Claims remain too company-authored and may not survive normalized testing
    - Publish a third-party same-model benchmark with throughput, latency, power, and cost together
  - - Commercialization
    - GigaIO, Gimlet, and sovereign/enterprise language suggest real market pull
    - Public evidence may still be mostly pilot, partner, and roadmap proof rather than scaled recurring demand
    - Disclose booked revenue, customer count, and pilot-to-production conversion
  - - Comparable context
    - Scarce inference assets may deserve a premium to generic hardware or software names
    - NVIDIA and AMD already disclose enormous scale, while private challengers remain heterogeneous and opaque
    - Prove d-Matrix belongs in a premium scarcity bucket instead of a speculative startup bucket
  - - Price discipline
    - $2B could be reasonable if bull-case milestones arrive quickly
    - At present the mark already prices in success without public financial proof
    - A lower entry or strong private data-room evidence would materially improve the call
  notes: The anti-thesis is not that d-Matrix lacks technical merit. It is that the latest price gets ahead of what the public corpus can actually support.
