  title: Recommendation summary table
  columns:
  - Dimension
  - Assessment
  - Evidence anchor
  - Decision implication
  rows:
  - - Recommendation
    - research-more
    - Real financing and product proof, but missing operating denominator metrics
    - Keep working only if diligence rights or pricing improve
  - - Confidence
    - medium
    - Funding and technical facts are real, but revenue/ARR/margin remain undisclosed
    - Use wide scenario bands and avoid precision
  - - Risk rating
    - high
    - Commercialization, benchmark normalization, and next-price discovery are still unresolved
    - Assume downside asymmetry until private evidence closes the gaps
  - - Valuation stance
    - stretched at $2B
    - Series C price sits above the chapter's public-evidence midpoint
    - Treat the last round as a milestone mark, not a proven bargain
  - - Indicative entry discipline
    - below ~$1.5B or with hard downside protection
    - Base case centers below the last round and no target return can be supported publicly at $2B
    - Require price improvement, structure, or unusually strong data-room proof
  - - Likely exit path
    - strategic sale or later secondary before IPO
    - Strategic relevance is more visible than public-market disclosure readiness
    - Do not underwrite near-term IPO liquidity from the public record
  notes: Recommendation is explicitly price-sensitive. It judges the 2026 evidence set and the latest disclosed round, not just the quality of the architecture.
