- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Audited revenue / ARR
    - Monthly and annual revenue plus ARR for 2024-2026
    - Core denominator missing from every public valuation method
    - Request audited financial statements and board KPI packs
  - - Gross margin and cash conversion
    - Gross margin, opex, burn, and working-capital profile
    - Needed to separate valuable infrastructure software leverage from expensive hardware deployment
    - Request audited P&L, cash-flow history, and margin bridge
  - - Customer proof
    - Named production customers, cohort expansion, and top-account concentration
    - Needed to distinguish partner activity from durable recurring demand
    - Request customer list, concentration schedule, and pilot-to-production conversion data
  - - Pricing and support economics
    - Realized ASPs, discounting, software attach, and support obligations
    - Needed to test whether public TCO claims survive commercial reality
    - Request pricing schedules, pilot invoices, and support-term summaries
  - - Cap table and preferences
    - Fully diluted ownership, preference stack, side letters, and any recent 409A or tender marks
    - Needed because enterprise value and common-equity value can diverge sharply in markdown scenarios
    - Request cap table, waterfall model, and latest 409A or secondary data
  - - Benchmark normalization
    - Same-model third-party benchmark versus H100/H200/MI300X and any integrated challenger actually in the shortlist
    - Needed to validate the whole chapter's premium-economics assumption
    - Commission or obtain normalized benchmark evidence before underwriting price
  notes: These asks are blocking rather than optional. Without them, an investor is underwriting a strategic narrative more than a defendable valuation.
