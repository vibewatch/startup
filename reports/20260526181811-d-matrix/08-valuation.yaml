- calloutType: insight
  title: Public filings are scale fences, not direct pricing comps
  body: NVIDIA and AMD are indispensable reference points because they disclose product, segment, revenue, and margin data. But their filings show businesses operating at a scale far beyond anything d-Matrix has disclosed. The right use of those comps is to bound the discussion, not to transfer their valuation logic directly.
