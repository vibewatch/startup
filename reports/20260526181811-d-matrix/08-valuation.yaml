- id: bull-base-and-bear-scenarios
  title: Bull, base, and bear scenarios
  body: |-
    Because revenue and ARR are undisclosed, scenario work has to be milestone-based rather than multiple-based. The right question is not “what exact EV/revenue multiple should a private AI chip startup trade on?” The public record cannot answer that. The right question is what evidence state would justify paying below, around, or above the last disclosed $2 billion mark.

    The bear case assumes that commercialization remains mostly pilot- and partner-led, that independent benchmark normalization still does not emerge, and that the next financing or secondary event prices d-Matrix closer to IP value plus conditional commercial optionality than to proven platform leadership. That produces a wide but clearly sub-round range of about $700 million to $1.0 billion. The base case assumes continued deployment progress and financing access, but still no public financial disclosure strong enough to prove a premium over the Series C valuation; that supports roughly $1.2 billion to $1.8 billion. The bull case requires named large-scale deployments, validated economics, and clearer evidence that d-Matrix can coexist with or displace incumbent GPU infrastructure in production, supporting roughly $2.5 billion to $3.5 billion.

    That framing matters because the latest disclosed round sits above the chapter's midpoint. The Series C is not impossible to justify, but it already prices in an execution path closer to the bull case than to the base case. That is why the current stance is stretched rather than attractive.
