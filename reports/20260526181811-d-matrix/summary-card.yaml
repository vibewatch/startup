  topStrengths:
    - >-
      Concrete full-stack productization: Corsair, JetStream, Aviator, and SquadRack make d-Matrix more than an
      architecture concept and give buyers a testable deployment surface.
    - >-
      Differentiated latency thesis: the memory-centric DIMC design and open-standards deployment model target a real
      inference bottleneck in brownfield datacenters rather than requiring a full rack rebuild.
    - >-
      Strong capital and ecosystem support: $450M disclosed funding and visible backing from Temasek, Bullhound,
      Triatomic, QIA, EDBI, and M12 reduce near-term existential financing risk.
    - >-
      Early commercialization proof is real enough to matter: Supermicro channel availability, GigaIO scale-up
      integration, and Gimlet's heterogeneous-cloud work show a credible path from sampling to production.
  topRisks:
    - >-
      No public revenue, ARR, gross margin, pricing, or customer-count disclosure supports the current $2B mark, so
      valuation underwriting is denominator-blind.
    - >-
      Execution depends on synchronized maturity across Corsair, JetStream, Aviator, partner-qualified systems, and the
      pre-commercial 3DIMC/Raptor roadmap.
    - >-
      Supply-chain and ecosystem dependence on advanced packaging, foundry partners, and OEM/integration partners
      creates real qualification, cost, and timing risk.
    - >-
      Customer proof remains partner-led and pilot-like: public evidence still lacks a named production-customer roster,
      retention metrics, or concentration data.
    - >-
      Security, compliance, and export-control posture are thinner publicly than many enterprise or sovereign buyers may
      require.
  unresolvedGaps:
    - Audited revenue or ARR, gross margin, pricing, cash runway, and realized unit economics remain undisclosed.
    - >-
      Named production deployments, active customer count, repeat-order cadence, retention, and concentration metrics
      are still missing from public sources.
    - Cap-table terms, liquidation preferences, secondary or 409A marks, and board-control economics are not public.
    - >-
      Production yield, cost curve, and delivery timing for JetStream ramp and the 3DIMC-to-Raptor roadmap remain
      under-evidenced.
    - >-
      Public security/compliance artifacts such as SOC 2, ISO 27001, trust-center documentation, and concrete
      export-control exposure analysis remain incomplete.
