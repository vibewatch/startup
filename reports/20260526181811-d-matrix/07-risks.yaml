- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Roadmap maturity
    - JetStream or Raptor timeline
    - Material slip versus customer qualification or procurement windows
    - Move from underwriting roadmap upside to valuing only currently deployable product surfaces
  - - Customer proof
    - Named production deployments
    - No diversified production-customer set beyond partner or early-access references by 2026-2027
    - Downgrade commercialization confidence and valuation support
  - - Supply and packaging
    - Advanced packaging or export-control shock
    - Rule change, capacity miss, or cost spike that materially changes roadmap timing or unit economics
    - Treat next-gen revenue assumptions as delayed and revisit cash needs
  - - Competitive differentiation
    - Full-system latency-per-watt comparison
    - Incumbent or specialist alternatives close the gap without comparable integration burden
    - Reduce willingness to pay for architecture premium and moat assumptions
  - - Security and regulated adoption
    - Trust-center and compliance evidence
    - No product-security assurance package while regulated opportunities remain part of the narrative
    - Constrain TAM assumptions and delay sovereign or regulated-market upside
  - - Financing discipline
    - Burn versus proof
    - Headcount and global expansion continue while bookings or production evidence remain thin
    - Shift the thesis to capital preservation and downside underwriting
  notes: These triggers are designed to be observable from follow-on diligence or future refreshes rather than generic narrative concerns.
