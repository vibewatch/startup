callouts:
- calloutType: risk
  title: 'Top risk: the roadmap is still more synchronized than proven'
  body: The underwriting problem is not whether Corsair exists; it is whether Corsair, JetStream, Aviator, partner-qualified racks, and the Raptor roadmap can all mature on a schedule that customers will actually buy against.
  claimRefs:
  - CR001
  - CR005
