  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: roadmap-dependency-details
    missingEvidence: Detailed supplier map for advanced packaging, foundry reservations, node transition milestones, and fallback plans for the Raptor/3DIMC roadmap.
    whyItMatters: Roadmap execution risk depends on whether packaging and foundry concentration are actively mitigated or merely assumed away.
    diligencePath: Request the current manufacturing dependency matrix, reserved-capacity evidence, and board-approved contingency plans.
    relatedQuestionRefs:
    - QR011
  - type: missing-source
    severity: material
    topic: security-and-compliance-posture
    missingEvidence: Product-level security architecture, customer data-handling controls, and any SOC 2, ISO 27001, FedRAMP, or equivalent compliance disclosures.
    whyItMatters: Security-sensitive buyers can block or delay adoption if the public trust posture is weaker than incumbent and specialist alternatives.
    diligencePath: Request security white papers, audit reports, trust-center materials, and a list of regulated or sovereign customer wins.
    relatedQuestionRefs:
    - QR013
    relatedTableRefs:
    - TR001
  - type: missing-source
    severity: material
    topic: field-reliability
    missingEvidence: Field MTBF, uptime, RMA, failure-rate, and support-escalation metrics for Corsair or JetStream deployments.
    whyItMatters: Without durability data, investors cannot separate promising architecture from support-heavy pilot hardware.
    diligencePath: Request fleet telemetry, service dashboards, and cohort-level support metrics from live deployments.
    relatedQuestionRefs:
    - QR015
    relatedTableRefs:
    - TR002
  - type: private-evidence-only
    severity: blocking
    topic: production-customer-proof
    missingEvidence: Named production customers, deployment counts, renewal or expansion evidence, and concentration data for live inference accounts.
    whyItMatters: The current public corpus is strong on architecture and partnerships but weak on proving repeatable production demand and customer diversity.
    diligencePath: Request the top-customer list, live deployment count, pilot-to-production conversion funnel, and reference calls.
    relatedQuestionRefs:
    - QR030
    relatedTableRefs:
    - TR003
  - type: private-evidence-only
    severity: material
    topic: valuation-underwrite
    missingEvidence: Current bookings, gross-margin trajectory, hardware and support burn, and scenario-linked capital requirements beyond the 2025 raise.
    whyItMatters: Financing and valuation risk cannot be underwritten from the public round headline alone when commercialization is still early.
    diligencePath: Request the operating plan, scenario model, backlog, and post-Series-C runway assumptions.
    relatedQuestionRefs:
    - QR030
    relatedTableRefs:
    - TR004
    - TR005
