- calloutType: risk
  title: Public customer proof still lags the architecture story
  body: The strongest public evidence is partner and early-access validation, not a broad named production-customer base with durability and expansion metrics.
  claimRefs:
  - CR014
  - CR015
  - CR043
- calloutType: risk
  title: Security and compliance are still diligence items, not public strengths
  body: The reviewed legal pages show baseline website governance, but the public corpus did not surface the sort of product-security and compliance artifacts that regulated buyers often expect.
  claimRefs:
  - CR024
  - CR025
  - CR026
  - CR027
- calloutType: insight
  title: Kill criteria should stay operational, not rhetorical
  body: If JetStream or Raptor timing slips materially, early partner deployments fail to convert into named production customers, or incumbents close the latency-per-watt gap without comparable integration burden, the current thesis should be downgraded quickly.
  claimRefs:
  - CR037
  - CR038
  - CR039
