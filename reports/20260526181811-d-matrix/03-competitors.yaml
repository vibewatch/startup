company:
  name: d-Matrix
chapter:
  number: 3
  title: Competitors
  summary: 'D-Matrix competes in AI inference against three distinct alternative sets: incumbent NVIDIA and AMD GPU stacks
    with strong software and channel lock-in, inference-first challengers such as Groq, Cerebras, and SambaNova, and internal-build
    substitutes. Its moat is most credible where memory-local inference efficiency matters, but durability remains moderate
    because public benchmark proof, software portability, and distribution depth lag the incumbent and integrated-system leaders.'
sections:
- id: competitive-landscape-overview
  title: Competitive Landscape Overview
  body: |-
    d-Matrix sits inside a crowded but still-fluid AI inference market. The most important direct alternatives are
    not one homogeneous peer set: NVIDIA and AMD sell general-purpose accelerator stacks that can run both training
    and inference; Groq, Cerebras, and SambaNova pursue inference-first or tightly integrated alternatives; and the
    status quo for many buyers is still internal build on incumbent GPU clouds or private racks. Independent market
    coverage keeps circling the same structural pressures: inference workloads are growing faster than buyers can
    absorb power, cooling, memory, and GPU procurement costs, and that is why challengers such as d-Matrix get
    attention in the first place. d-Matrix's own pitch is that Corsair cards, JetStream NICs, and Aviator software
    attack the memory-movement penalty that makes large-model inference expensive. The company therefore competes
    less as a generic GPU replacement than as a purpose-built answer to the memory-bound, latency-sensitive slice
    of inference demand.
  claimRefs:
  - CP001
  - CP002
  - CP025
  - CP026
  - CP029
  - CP032
  tableRefs:
  - TP001
  figureRefs:
  - FP001
- id: incumbent-gpu-stacks
  title: 'Incumbent GPU Stacks: NVIDIA and AMD'
  body: |-
    NVIDIA remains the benchmark d-Matrix must beat in practice, even when the buyer says it wants "better
    inference economics" rather than "the fastest raw cluster." H100, H200, and GB200 span the full ladder from
    single-GPU deployment to rack-scale NVLink domains, and NVIDIA layers software, networking, and enterprise
    support on top of the silicon. H100 anchors the installed base with NVLink, InfiniBand, Magnum IO, and AI
    Enterprise; H200 extends the moat by pushing memory capacity and bandwidth higher for large-model inference;
    GB200 raises the competitive bar again by collapsing 72 GPUs into a liquid-cooled rack-scale system that NVIDIA
    markets as a single massive inference machine. AMD is the clearest mainstream alternative because MI300X offers
    more memory per GPU, high bandwidth, and ROCm rather than CUDA. But AMD still competes inside the same OEM and
    datacenter procurement motion as NVIDIA, which means it pressures incumbent economics without fully changing how
    the buyer evaluates or deploys inference infrastructure.
