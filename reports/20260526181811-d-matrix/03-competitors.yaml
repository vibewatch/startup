- id: switching-costs-and-distribution
  title: Switching Costs, Distribution, and Internal Build
  body: |-
    The central competitive question is not whether d-Matrix can make a strong silicon argument; it is whether it
    can overcome the software, networking, and channel inertia that keeps enterprises on incumbent platforms.
    NVIDIA's advantage is deeply systemic: buyers already know how to buy GPU clusters, cool them, connect them,
    program them with CUDA and TensorRT, and source them through familiar OEM and cloud channels. AMD weakens that
    moat at the margin with ROCm and more memory per GPU, but it still lives in the same rack and server ecosystem.
    Groq, Cerebras, and SambaNova attack the problem by changing the packaging model—API-led service, giant
    appliance, or fully integrated platform. d-Matrix sits between those camps. Its modular chiplet and card-based
    approach could lower insertion friction, but the public record still lacks the customer references, price sheets,
    and benchmark normalization that would prove buyers are willing to switch, multi-home, or standardize on it at
    production scale. Internal build is also a real substitute as hyperscalers and large enterprises increasingly
    design or co-design inference silicon around their own workloads.
  claimRefs:
  - CP027
  - CP028
  - CP030
  - CP033
  - CP034
  - CP035
  - CP036
  tableRefs: []
  figureRefs: []
- id: moat-durability-and-adverse-evidence
  title: Moat Durability and Adverse Evidence
  body: |-
    d-Matrix has a credible but still-provisional moat. The strongest pillar is technical fit: multiple sources tie
    inference cost and power pain to memory movement, and d-Matrix's digital-in-memory-compute plus chiplet
    interconnect strategy is explicitly built around that bottleneck. A second pillar is modularity; Jayhawk, cards,
    NICs, and software imply a heterogeneous deployment story that could be easier to insert than a proprietary
    super-appliance. But adverse evidence is meaningful. NVIDIA still owns the most mature benchmark record,
    software stack, and distribution footprint. AMD keeps narrowing the memory argument. Groq has the cleanest
    public packaging for predictable low-latency service. Cerebras and SambaNova sell more tightly integrated
    systems for very large models. Most importantly, d-Matrix's public performance and cost claims remain largely
    vendor-authored rather than normalized by an independent, apples-to-apples benchmark suite. That leaves moat
    durability at "moderate": differentiated enough to matter, but not yet durable enough to ignore incumbent or
    integrated-system counterattack risk.
  claimRefs:
  - CP037
  - CP038
  - CP039
  - CP040
