- id: specialized-inference-challengers
  title: Specialized Inference Challengers
  body: |-
    The non-GPU challenger field is fragmented, which matters because d-Matrix is not competing against a single
    "inference chip" archetype. Groq packages low latency as a service with public, private, co-cloud, and on-prem
    options; it is the cleanest contrast to d-Matrix on deployment model and spend predictability. Cerebras goes in
    the opposite direction, using a wafer-scale engine and very large system memory so customers can keep far more
    of a model local to a specialized appliance. SambaNova bundles hardware, software, and tuned models into an
    integrated platform and positions that bundle directly against NVIDIA Blackwell on price-performance. Independent
    landscape surveys therefore frame the market as a set of different answers to the same question: should buyers
    solve inference with broad GPU ecosystems, with service-led low-latency specialists, with giant integrated
    systems, or with memory-local cards that fit more easily into standard enterprise servers? d-Matrix has a real
    seat at that table, but it does not yet own the default category narrative.
  claimRefs:
  - CP018
  - CP019
  - CP020
  - CP021
  - CP022
  - CP023
  - CP024
  - CP030
  - CP031
