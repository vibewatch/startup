tables:
- id: TP001
  title: Competitor Profile Table
  columns:
  - Competitor
  - Category
  - Scale / Funding
  - Target Segment
  - Key Differentiation
  - Primary Limitation
  rows:
  - - d-Matrix
    - Inference-only challenger
    - $450M total raised per 2025 coverage
    - Enterprise and datacenter LLM inference
    - Digital in-memory compute; Corsair cards + JetStream NICs + Aviator software; standard-server insertion point
    - Public benchmark proof and production customer depth remain limited
  - - NVIDIA H100/H200/GB200
    - Incumbent GPU stack
    - Dominant enterprise and cloud installed base; ~75-92% share estimates depending source and year
    - Training plus inference from enterprise to hyperscale
    - CUDA/TensorRT/NIM, NVLink, InfiniBand, OEM and cloud reach
    - High capex, power and cooling burden; buyers can still be overprovisioned for inference-only use cases
  - - AMD MI300X
    - Mainstream GPU alternative
    - Scaled through major OEM server channels
    - Hyperscale and enterprise inference needing more memory per GPU
    - 192GB HBM3, 5.3TB/s bandwidth, ROCm software, same-server procurement motion as GPUs
    - Weaker software incumbency than CUDA and less end-to-end platform mindshare
  - - Groq
    - Inference service challenger
    - Private company; public, private and co-cloud plans plus on-prem option
    - Interactive low-latency inference, regulated and air-gapped workloads
    - LPU architecture, predictable spend, GroqRack on-prem continuity
    - Different compiler/runtime path than standard GPU stacks
  - - Cerebras
    - Integrated large-model system
    - Large private AI chip company with wafer-scale platform
    - Very large model training and inference
    - Wafer-scale engine, enormous on-device compute, system-level memory strategy
    - Specialized appliance model is less drop-in than standard racks
  - - SambaNova
    - Integrated enterprise platform
    - $350M+ 2026 round per independent guide
    - Agentic AI and enterprise inference deployments
    - Hardware, software, and models tuned together; SN50 positioned against Blackwell on price-performance
    - Platform adoption requires buying into a proprietary full stack
  - - Internal build / custom silicon
    - Substitute / status quo alternative
    - Hyperscaler and large-enterprise capex budgets rather than vendor funding
    - Largest buyers with data-governance, latency, or utilization reasons to own the stack
    - Can optimize around proprietary workloads and avoid vendor dependence
    - Requires huge engineering, procurement, and operations capability
  notes: 'Coverage is partial and focused on the most decision-relevant options for 2026 enterprise inference buying: incumbent
    GPU stacks, inference-first challengers, and internal-build substitutes. Scale fields use public funding, share, or deployment
    context only where disclosed.'
