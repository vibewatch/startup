callouts:
- calloutType: strength
  title: The architecture fits the real inference pain point
  body: |-
    D-Matrix's best competitive argument is not that it can out-muscle GB200 on absolute rack scale. It is that
    inference economics are constrained by memory movement, and the company designed both its compute fabric and
    chiplet strategy around that bottleneck. That is the chapter's clearest moat candidate.
  claimRefs:
  - CP002
  - CP003
  - CP037
- calloutType: risk
  title: CUDA plus channel power is the real incumbent moat
  body: |-
    NVIDIA's moat is systemic: software portability, OEM availability, known networking patterns, and benchmark
    credibility all reinforce the hardware choice. Any d-Matrix win therefore requires more than a better chip; it
    requires enough tooling and customer proof to overcome entrenched operating habits.
  claimRefs:
  - CP013
  - CP032
  - CP033
- calloutType: insight
  title: The challenger set is fragmented rather than winner-take-all
  body: |-
    Groq, Cerebras, SambaNova, and d-Matrix do not sell the same thing in different packaging. Groq leads with
    service and latency, Cerebras with wafer-scale systems, SambaNova with integrated enterprise platforms, and
    d-Matrix with memory-local cards and modular infrastructure. That fragmentation reduces direct feature parity
    but increases the need for buyers to match workload to architecture.
  claimRefs:
  - CP018
  - CP021
  - CP023
  - CP040
- calloutType: risk
  title: Public benchmark proof remains the largest unresolved moat gap
  body: |-
    D-Matrix's most important public competitive claim is lower cost and better efficiency than GPU systems, yet
    the public evidence base is still dominated by company-authored comparisons. Until a standardized third-party
    benchmark normalizes d-Matrix against H100, H200, MI300X, Groq, and similar alternatives, buyers still have to
    take a leap of faith.
  claimRefs:
  - CP028
  - CP039
