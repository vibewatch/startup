- id: TP004
  title: Moat Durability / Competitive Risk Register
  columns:
  - Moat Claim
  - Threat
  - Severity
  - Mitigation / What Would Help
  - Diligence Ask
  rows:
  - - Digital in-memory compute better matches inference’s memory bottleneck
    - H200/GB200/next-gen GPU memory and bandwidth gains narrow the efficiency gap
    - High
    - Independent same-model energy and latency benchmarks versus H100/H200/MI300X
    - What public benchmark shows d-Matrix’s claimed gain under the same model, batch, and latency target?
  - - Modular chiplet plus card/NIC architecture lowers deployment friction
    - Buyers may still prefer proven NVLink/NIM/OEM stacks or turnkey challenger appliances
    - High
    - More named OEM systems and production customer references
    - Which server OEMs ship production-ready d-Matrix systems with supported software images today?
  - - Inference-only focus gives d-Matrix a sharper product thesis than general GPUs
    - Training-plus-inference platforms still win procurement because they are multipurpose
    - Medium
    - Proof that buyers separate inference budgets from general AI infrastructure budgets
    - How often do enterprises buy d-Matrix specifically for inference instead of extending existing GPU clusters?
  - - Claimed lower cost and energy improve ROI for scale inference
    - Claims remain largely vendor-authored and may not survive apples-to-apples normalization
    - High
    - Third-party benchmark or public customer bill-of-materials evidence
    - What utilization, model size, and software assumptions sit behind the 3x-lower-cost claim?
  - - Heterogeneous-system strategy could fit regulated or private deployments
    - Groq already has clearer cloud-to-on-prem packaging, while Cerebras/SambaNova sell more integrated systems
    - Medium
    - Show repeatable on-prem reference architecture and support model
    - Does d-Matrix have a public deployment path as crisp as GroqRack or a turnkey appliance rival?
  - - Inference market growth creates room for challengers
    - Internal build and custom silicon can absorb the highest-value workloads before d-Matrix does
    - Medium
    - Focus on customers lacking hyperscaler-scale design budgets
    - Which customer segments are least likely to replace third-party inference hardware with internal silicon?
  notes: Severity is a qualitative judgment based on the public record available on 2026-05-26. This is a durability register,
    not a probability forecast, so it prioritizes the threats most likely to compress d-Matrix’s differentiation if left unanswered.
