- id: TI003
  title: Unit economics table
  columns:
  - Metric / proxy
  - Public value / status
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Claimed cost-performance improvement
    - 3x better performance / TCO versus GPU-based alternatives
    - medium
    - This is the core ROI claim for enterprise buyers
    - Reproduce on customer workloads with full system BOM
  - - Claimed energy efficiency improvement
    - 3x to 5x better energy efficiency versus GPU-based alternatives
    - medium
    - Power and cooling are central to inference economics
    - Compare rack-level power including switches, optics, and idle overhead
  - - Claimed interactive speed improvement
    - Up to 10x faster interactive speed; 30K tokens/s at 2 ms/token for Llama 70B
    - medium
    - Supports the thesis that latency-sensitive workloads justify specialized hardware
    - Request benchmark methodology, prompt mix, and concurrency assumptions
  - - JetStream networking overhead
    - 400 Gbps NIC, PCIe Gen5 x16, max 150W TDP, supplemental power input
    - high
    - Networking is part of the cost stack, not a free add-on
    - Request node-level power budget and transceiver cost
  - - Server and rack density proxy
    - 8-card server up to 2 TB capacity memory; 8-node rack for 100B models; GigaIO says 64+ Corsairs in a node
    - medium
    - Potential deal size is large, but deployment complexity and rack cost rise too
    - Request typical cards-per-deal, node count, and installed rack configuration
  - - Third-party heterogeneous benchmark proxy
    - Gimlet reports 2x-10x lower latency at equal energy efficiency for speculative decode offload; 1.6B draft model fits on 2 cards
    - medium
    - Best current public proof that specialized offload can improve real workload economics
    - Request production throughput, utilization, and win-rate data by workload
  notes: The table mixes vendor claims, published specifications, and third-party benchmark proxies. It should not be read as d-Matrix reported gross margin, CAC, or payback data.
