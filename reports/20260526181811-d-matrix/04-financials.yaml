- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Buyer / route
  - Current public status
  - Revenue quality
  - Diligence ask
  rows:
  - - Corsair accelerators
    - Sale of PCIe accelerator cards and dual-card configurations
    - Enterprises, hyperscalers, sovereign clouds, OEMs, system integrators
    - Sampling in late 2024; broad availability targeted for Q2 2025
    - Likely high-ACV hardware revenue, but no public ASP, volume, or gross margin
    - Request shipped units, ASPs, gross margin, and pilot-to-production conversion
  - - JetStream NICs
    - Sale of dedicated networking cards that scale Corsair clusters
    - Sold with multi-node deployments and rack solutions
    - Samples available in Sep 2025; full production targeted by year-end 2025
    - Potential attach revenue, but attach rate and pricing are undisclosed
    - Request NIC attach rate, BOM, and realized pricing by deployment size
  - - Aviator software
    - Inference software bundled with hardware and deployment tools
    - Enterprise and OEM deployment teams
    - Repeatedly marketed as part of the full-stack platform; no standalone price disclosed
    - Could create recurring software revenue, but public evidence only supports bundle-level monetization
    - Request license model, maintenance terms, and renewal or support revenue
  - - Integrated rack and server solutions
    - Partner-configured systems such as SquadRack and GigaIO SuperNODE
    - OEM and infrastructure channel partners
    - Reference architectures and joint solutions are public; booked revenue is not
    - Higher contract value is plausible, but economics may be shared with server and networking partners
    - Request who invoices the customer, system ASP, and partner revenue split
  - - Heterogeneous cloud access
    - Select-customer access to Corsair through Gimlet Cloud alongside GPUs
    - AI-native model providers and cloud buyers
    - Targeted for select customers in 2H 2026
    - Could become usage-based proof, but current evidence is still early-access and benchmark oriented
    - Request contract structure, revenue share, and pilot-to-production conversion rates
  notes: Rows are restricted to monetization surfaces that are explicitly visible in public product, partner, and deployment materials. No public source in the pack discloses realized pricing, revenue mix, or contract duration.
