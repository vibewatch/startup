  evidenceGaps:
  - type: missing-source
    severity: blocking
    topic: revenue-gap
    missingEvidence: Monthly or quarterly revenue and ARR by product line, geography, and top-customer cohort.
    whyItMatters: Without actual revenue scale, investors cannot test valuation discipline, commercialization velocity, or whether partner announcements are converting into booked business.
    diligencePath: Request a trailing-12-month revenue bridge, current-quarter run rate, top-customer concentration, and pipeline-to-bookings conversion.
    relatedQuestionRefs:
    - QI023
    relatedTableRefs:
    - TI005
  - type: private-evidence-only
    severity: material
    topic: pricing-gap
    missingEvidence: List pricing, discount bands, pilot versus production ASPs, and software licensing terms for Corsair, JetStream, and Aviator.
    whyItMatters: Public performance claims cannot be translated into customer ROI or d-Matrix margin without actual selling prices and attach rates.
    diligencePath: Request the current price book, sample deal desk outputs, renewal terms, and blended ASPs by deployment size.
    relatedQuestionRefs:
    - QI004
    - QI005
    - QI006
    relatedTableRefs:
    - TI002
    - TI005
  - type: missing-source
    severity: blocking
    topic: runway-gap
    missingEvidence: Current cash balance, monthly net burn, runway months, and financing trigger points.
    whyItMatters: The company has enough disclosed funding to matter, but without cash and burn visibility investors cannot tell whether the next financing round is optional or necessary.
    diligencePath: Request the finance operating model with base, upside, and downside runway scenarios plus planned hiring and capex.
    relatedQuestionRefs:
    - QI021
    relatedTableRefs:
    - TI004
    - TI005
  - type: missing-source
    severity: blocking
    topic: margin-gap
    missingEvidence: Gross margin and contribution margin by Corsair cards, JetStream networking, Aviator software, and integrated systems.
    whyItMatters: This is the only way to distinguish a compelling customer TCO story from a low-margin hardware story that still struggles to create equity value.
    diligencePath: Request product-level gross margin, warranty reserves, service burden, and software attach economics for recent quarters.
    relatedQuestionRefs:
    - QI024
    relatedTableRefs:
    - TI003
    - TI005
  - type: enumeration-incomplete
    severity: material
    topic: customer-gap
    missingEvidence: Named production customers, repeat orders, deployed card or node counts, and backlog / design-win status.
    whyItMatters: Partner logos and benchmarks show ecosystem momentum, but they do not prove repeatable demand or customer concentration risk.
    diligencePath: Request customer references, shipped-system counts, renewal or reorder history, and weighted pipeline by stage.
    relatedQuestionRefs:
    - QI025
    relatedTableRefs:
    - TI001
    - TI005
  - type: missing-source
    severity: material
    topic: manufacturing-commitments
    missingEvidence: Foundry, packaging, NRE, deposit, inventory, and supplier-commitment details for Corsair, JetStream, and the 3DIMC roadmap.
    whyItMatters: Hardware startups often absorb hidden working-capital and inventory risk before revenue is visible; the roadmap dependence on advanced packaging makes this especially important.
    diligencePath: Request supplier agreements, purchase commitments, expected NRE, yield assumptions, and warranty reserve policy.
    relatedQuestionRefs:
    - QI017
    - QI018
    relatedTableRefs:
    - TI004
