- id: TI004
  title: Capital adequacy table
  columns:
  - Item
  - Public value / status
  - Evidence
  - Underwriting read-through
  - Diligence ask
  rows:
  - - Total disclosed capital raised
    - $450M
    - Series C official release, investor releases, and independent coverage align
    - Strong capitalization for a private inference hardware company, but not proof of self-funding operations
    - Reconcile cap table, primary vs. secondary proceeds, and liquidation preferences
  - - Latest round size / valuation
    - $275M Series C at $2B valuation
    - Official plus Bullhound, QIA, and news coverage
    - Shows continued investor access and valuation support in late 2025
    - Request post-money ownership, board rights, and preference stack
  - - Series B bridge capital
    - $110M in 2023 to begin commercializing Corsair
    - Official Series B release
    - Confirms multiple years of pre-revenue or early-revenue buildout before the 2025 raise
    - Request spend bridge from Series B to Series C
  - - Disclosed use of funds
    - Roadmap, hiring, global expansion, and large-scale deployments
    - Official Series B and Series C materials
    - Capital is earmarked for execution and scale-up rather than disclosed profitability
    - Request 24-month operating plan and deployment capex plan
  - - Cash on hand / burn / runway
    - Not publicly disclosed
    - No figure in reviewed official, investor, or independent sources
    - Runway and next-round timing cannot be tested from public materials
    - Request current cash balance, monthly burn, and runway under base and downside scenarios
  - - Debt / project finance / purchase commitments
    - Not publicly disclosed for d-Matrix; public hardware comps show these items can affect margins
    - D-Matrix disclosure gap plus Nvidia filing proxy
    - Hardware scaling may hide working-capital needs even if fixed capex is partner-assisted
    - Request supplier deposits, NRE, inventory commitments, warranties, and debt facilities
  notes: The disclosed funding stack is factual, but capital adequacy remains only partially visible because public sources do not provide cash, burn, runway, or supplier-commitment detail.
