callouts:
- calloutType: risk
  title: Operating opacity is the main blocker
  body: Funding and valuation are public, but revenue, ARR, gross margin, cash, burn, and runway are not. That prevents a normal underwriting view of revenue quality or self-funding capacity.
  claimRefs:
  - CI037
  - CI038
  - CI039
  - CI048
- calloutType: insight
  title: Open-standards deployment is the clearest GTM wedge
  body: Standard PCIe cards, air cooling, and Ethernet-based scale-out appear designed to lower retrofit friction for enterprises and neoclouds that do not want a proprietary supercluster from day one.
  claimRefs:
  - CI013
  - CI020
  - CI025
- calloutType: recommendation
  title: Underwrite a partner-led hardware platform, not a software multiple
  body: Until management shows ASPs, software attach, gross margin, and repeat orders, the safer lens is a qualification-heavy hardware platform whose economics depend on partner execution and future financing.
  claimRefs:
  - CI001
  - CI010
  - CI011
