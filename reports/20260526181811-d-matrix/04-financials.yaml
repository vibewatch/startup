- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - What public evidence says
  - Why it matters
  - Exact diligence path
  rows:
  - - Revenue / ARR
    - No public figure found in official, investor, or independent sources
    - Impossible to anchor underwriting on current commercial scale or valuation multiple
    - Request monthly and annual revenue by product line, geography, and customer cohort
  - - Gross margin / contribution margin
    - No public figure found
    - Cannot test whether hardware, networking, and software mix can support durable profitability
    - Request gross margin bridge by Corsair, JetStream, Aviator, and integrated systems
  - - Realized ASP / discounts
    - No public Corsair or JetStream price sheet found
    - Cannot translate performance claims into deal economics or discount strategy
    - Request price book, discount bands, and pilot versus production ASPs
  - - Software attach / recurring revenue
    - Aviator is marketed as part of the platform, but its licensing model is undisclosed
    - Recurring mix could materially change revenue quality and multiple
    - Request percentage of deals with paid software, annual contract value, and renewal terms
  - - Customer count / repeat orders
    - Partners and benchmarks are visible, but broad production-customer evidence is not
    - Cannot judge demand depth, repeatability, or concentration risk
    - Request named production customers, repeat orders, deployed cards or nodes, and backlog
  - - Cash / burn / runway / commitments
    - No public cash balance, burn, runway, debt, or supplier-commitment data found
    - Financing dependency and insolvency timing cannot be underwritten from the public record
    - Request cash waterfall, monthly burn, purchase commitments, and next-round trigger
  notes: This table is the main underwriting blocker list. The missing metrics are normal for a private company, but they are especially consequential in a hardware business with manufacturing, networking, and deployment dependencies.
