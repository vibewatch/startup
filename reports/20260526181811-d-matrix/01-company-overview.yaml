chapter:
  number: 1
  title: Company Overview
  summary: d-Matrix is a Santa Clara, 2019-founded, Series C AI inference infrastructure company whose public record supports a full-stack product story around Corsair accelerators, JetStream networking, and Aviator software. Official, investor, and independent sources corroborate $450 million of disclosed funding and a $2 billion Series C valuation, plus a 250+ employee global footprint and continued milestones through 2026. The main diligence gaps are current revenue or ARR, companywide customer count, and detailed governance or control economics beyond an investor-linked board roster.
sections:
- id: identity-footprint-and-model
  title: Identity, Footprint, and Business Model
  body: 'd-Matrix should be treated as a private, Series C AI infrastructure company built specifically around inference rather than training. The official home page, about page, and 2025 Series C release all anchor the company in Santa Clara and frame its business as selling accelerated compute for hyperscale, enterprise, and sovereign data-center workloads. Public materials say the company was founded in 2019, and the current product stack combines Corsair inference accelerators, JetStream networking, and Aviator software. The home page further says the 3DIMC architecture uses a chiplet-based, PCIe-friendly design that can scale to models above 100 billion parameters. That makes the reusable ground truth for later chapters straightforward: d-Matrix is monetizing hardware-plus-software infrastructure for low-latency inference. What the public record does not yet provide is a companywide customer count or revenue figure that would let diligence treat current commercial scale as fully quantified.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO008
  - CO009
  - CO010
  - CO019
  - CO020
  - CO044
  - CO045
