  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue-gap
    missingEvidence: A current public or shareable private revenue, run-rate revenue, or ARR figure.
    whyItMatters: Later valuation and financial chapters cannot assess operating leverage or capital efficiency without a credible topline anchor.
    diligencePath: Request a finance packet or board materials that show current revenue, run-rate revenue, and any recurring-revenue segmentation.
    relatedQuestionRefs:
    - QO025
  - type: private-evidence-only
    severity: material
    topic: customer-count-gap
    missingEvidence: A companywide count of paying customers, live deployments, or annualized production workloads.
    whyItMatters: The current record proves interest and partner activity but not the breadth of monetized customer adoption.
    diligencePath: Request booked customers, deployed systems, repeat-order counts, and any split between pilots and production deployments.
    relatedQuestionRefs:
    - QO024
  - type: missing-source
    severity: material
    topic: governance-gap
    missingEvidence: Current ownership percentages, protective provisions, board committees, and any investor-specific consent rights.
    whyItMatters: A visible board slate is useful, but it does not reveal who controls major decisions or how future financings could dilute founders.
    diligencePath: Review the cap table, investor rights agreements, board committee charters, and the latest financing term sheets.
    relatedQuestionRefs:
    - QO026
    relatedTableRefs:
    - TO003
  - type: stale
    severity: minor
    topic: headcount-gap
    missingEvidence: A current 2026 headcount by function and geography rather than the November 2025 250+ disclosure.
    whyItMatters: Hiring pace affects burn, execution capacity, and the credibility of broad product and deployment ambitions.
    diligencePath: Request an HR roster or payroll summary that shows current FTEs by location and function.
    relatedQuestionRefs:
    - QO012
  - type: private-evidence-only
    severity: material
    topic: commercialization-proof
    missingEvidence: Named paying customers, deployment volumes, or post-sampling broad-availability evidence for Corsair.
    whyItMatters: The company has strong funding and ecosystem signals, but investor confidence can still outrun customer conversion.
    diligencePath: Request customer references, booked pipeline, active deployment counts, and revenue contribution from shipped systems.
