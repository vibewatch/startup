- id: milestones-commercial-proof-and-risks
  title: Milestones, Commercial Proof, and Pressure Points
  body: The milestone record shows a company moving from architecture thesis to productization, partner integration, and early public workload proof. The chronology starts with 2019 founding, a 2022 Series A and Microsoft-linked tooling relationship, and the 2023 Series B that funded commercialization. Corsair was unveiled in November 2024 with early-access sampling and a Q2 2025 broad-availability target. d-Matrix then expanded the stack with a May 2025 GigaIO partnership, a September 2025 JetStream launch, the October 2025 SquadRack reference architecture, the November 2025 Alchip roadmap announcement, and a March 2026 Gimlet Labs benchmark that claimed 2–10x latency benefits in a heterogeneous setup. The same record also exposes pressure points. Public materials still rely heavily on vendor claims and partner-led commercialization proof, while independent coverage emphasizes that startups like d-Matrix must overcome Nvidia's installed ecosystem, scale manufacturing, and prove durable
    customer adoption. That makes the chapter's biggest remaining gaps commercial disclosure and control visibility, not identity or capitalization.
