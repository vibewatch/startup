- id: founders-leadership-and-governance
  title: Founders, Leadership, and Governance
  body: The public leadership picture is unusually clear at the founder, executive, and board-name level but still incomplete on control economics. The about page identifies Sid Sheth as founder and CEO and Sudeep Bhoja as founder and CTO, while public investor and product releases continue to quote the same pair through 2025, suggesting stable technical and commercial leadership. The company also exposes an operating bench across software, product, finance, legal, and manufacturing. Governance visibility is more mixed. d-Matrix publicly names a board slate tied to Bullhound Capital, Playground Global, Triatomic Capital, M12, Nautilus Venture Partners, and Temasek, which aligns well with the financing history and gives later chapters a usable map of who likely influences strategy. But the fetched pack does not disclose board committees, voting thresholds, protective provisions, or current ownership percentages, so governance analysis should treat the board roster as real but incomplete rather
    than assume standard venture rights.
  claimRefs:
  - CO004
  - CO005
  - CO006
  - CO007
  - CO042
  - CO046
  tableRefs:
  - TO002
- id: capital-stage-and-stakeholders
  title: Capital Formation, Stage, and Stakeholders
  body: 'Capital formation is the strongest externally corroborated part of the company overview. VentureBeat reported a $44 million Series A in 2022 around the Microsoft Project Bonsai relationship. The official 2023 release then disclosed a $110 million Series B led by Temasek, and the official 2025 Series C release, Bullhound statement, QIA statement, and independent press all agree that d-Matrix raised $275 million at a $2 billion valuation, bringing total disclosed funding to $450 million. The same Series C materials also provide the clearest current scale markers in the fetched pack: 250+ employees worldwide, Santa Clara headquarters, and offices in Toronto, Sydney, Bangalore, and Belgrade. That combination supports a practical stage call of late-stage private infrastructure startup rather than early research project. Still, fundraising visibility exceeds operating disclosure. The company says the new capital will support global expansion and large-scale deployments, but no fetched
    source discloses current revenue, ARR, or a broad named-customer list, so those metrics should remain explicit diligence gaps.'
  claimRefs:
