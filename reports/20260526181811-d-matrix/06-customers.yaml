- id: named-proof-and-deployment-maturity
  title: Named Proof and Deployment Maturity
  body: 'The customer-evidence picture improves materially once the analysis separates named proof points from broad customer-count rhetoric. Publicly, d-Matrix can point to a genuine commercialization ladder: Corsair sampling to early-access customers in late 2024, JetStream samples in 2025, GigaIO''s integrated SuperNODE offer in May 2025, SquadRack''s Supermicro channel availability for Q1 2026, and the March 2026 Gimlet Labs partnership for heterogeneous cloud deployment. Those are meaningful milestones because they show the company moving from hardware announcement to partner-integrated systems and then to a named external operator. But the same corpus also defines the limit of the proof. The ecosystem page explicitly says the showcased logos are not actual customers, and the public GigaIO, Supermicro, and Liqid statements remain partner endorsements rather than end-customer case studies. Gimlet is the clearest named external operator in the set, yet even there the public record says
    select-customer availability is planned for the second half of 2026 rather than already broad production. In other words, deployment maturity is real, but it is still better evidenced by channel readiness and operator pilots than by disclosed production-account depth.'
