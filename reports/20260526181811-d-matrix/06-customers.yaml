  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: customer-count
    missingEvidence: Current active production customer count broken out by hyperscale, enterprise, sovereign, cloud operator, and channel-led accounts.
    whyItMatters: Without an active-account denominator, the public record cannot distinguish a real installed base from a thin set of partner-backed design wins.
    diligencePath: Request a current customer ledger with deployment stage, revenue contribution, and segment classification for each account.
    relatedQuestionRefs:
    - QU009
    - QU010
    - QU012
    relatedTableRefs:
    - TU002
    - TU003
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: Net revenue retention, gross retention, churn, renewal rates, and repeat-order cadence for production cohorts.
    whyItMatters: Channel and pilot proof can look healthy even when customer quality is weak; retention metrics are the clearest durability test.
    diligencePath: Request cohort tables by booking quarter or deployment quarter, including renewals, expansions, churn, and reasons for loss.
    relatedQuestionRefs:
    - QU014
    - QU015
    - QU023
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: concentration-risk
    missingEvidence: Top-customer concentration, partner-versus-direct channel mix, and revenue share of the largest accounts.
    whyItMatters: A handful of large sovereign, hyperscale, or channel accounts could accelerate growth but also create meaningful dependency risk.
    diligencePath: Request the top 10 customers and top 10 partners by bookings or revenue, plus concentration thresholds used internally.
    relatedQuestionRefs:
    - QU020
    relatedTableRefs:
    - TU005
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: Named production references beyond partner endorsements, including workload, deployment age, realized outcome, and whether the account renewed or expanded.
    whyItMatters: The current public corpus has credible named proof points, but most of them are still channel or operator validation rather than end-customer production references.
    diligencePath: Request at least three reference calls and a written list of named production accounts with deployment status and realized KPI outcomes.
    relatedQuestionRefs:
    - QU005
    - QU021
    - QU025
    relatedTableRefs:
    - TU003
  - type: stale
    severity: minor
    topic: deployment-maturity
    missingEvidence: A fresh 2026 production-state update for Corsair and JetStream shipments, including how many sampled or purchasable systems are now live in production.
    whyItMatters: The public proof base improved in 2025-2026, but some commercialization milestones are still framed as sampling, early access, or planned availability.
    diligencePath: Request a current commercialization snapshot with units shipped, systems delivered, and production go-lives by quarter.
    relatedQuestionRefs:
    - QU004
    - QU011
    relatedTableRefs:
    - TU002
