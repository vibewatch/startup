- id: TU004
  title: Retention / repeat usage / satisfaction table
  columns:
  - Metric
  - Value
  - Segment
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Customer count
    - null
    - All segments
    - low
    - Without active-account count, deployment rhetoric cannot be translated into market share or adoption depth
    - Request current active production customers by hyperscale, enterprise, sovereign, and cloud-operator segment
  - - Net revenue retention
    - null
    - All recurring accounts
    - low
    - NRR is the cleanest way to test land-and-expand claims in infrastructure
    - Request trailing-12-month NRR by direct and channel-sourced cohort
  - - Gross retention / churn
    - null
    - All customers
    - low
    - Gross retention shows whether deployments survive beyond proof-of-concept
    - Request logo churn, gross retention, and reasons for non-renewal
  - - Contract duration / repeat order cadence
    - null
    - Enterprise and sovereign accounts
    - low
    - Hardware and infrastructure businesses can look healthy on pipeline while still lacking repeat orders
    - Request average term length, renewal cadence, and backlog conversion data
  - - Referenceable satisfaction / user advocacy
    - Only partner quotes and a named operator benchmark are public
    - Channel and operator proof
    - medium
    - Reference calls and user satisfaction matter because the product changes infrastructure design choices
    - Request at least three production reference calls with deployment age, workload, and realized outcome
  notes: Nulls are intentional. The public record reviewed for this chapter does not disclose retention, renewal, or customer-count metrics in a way that can be underwritten quantitatively.
