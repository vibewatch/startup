- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - How it expands
  - Concentration or channel risk
  - Impact
  - Diligence path
  rows:
  - - Existing-datacenter retrofit
    - Land via PCIe cards, standard Ethernet, and air-cooled deployments
    - Expansion depends on buyers trusting non-Nvidia acceleration in existing workflows
    - Can shorten time to first deployment if compatibility claims hold
    - Validate deployment effort and operator training burden on two live accounts
  - - Single-node scale-up via GigaIO
    - Expand from evaluation card count to dozens of Corsairs in one node
    - Route is partner-mediated and does not reveal end-customer concentration
    - Helpful bridge from POC to meaningful workload size
    - Request pipeline by partner and stage, plus attach rates
  - - Rack-scale path via Supermicro / SquadRack
    - Expand from node to rack and then multi-rack clusters
    - OEM availability does not prove sell-through or support quality
    - Could unlock larger enterprise, sovereign, and cloud budgets
    - Request bookings, deployments, and time-to-production through Supermicro
  - - Cloud-operator path via Gimlet
    - Expand into heterogeneous inference cloud workloads and AI-native operators
    - Select-customer launch creates dependency on a small number of early operator wins
    - Could create high-usage reference accounts quickly
    - Request current committed capacity, target customers, and revenue model with Gimlet
  - - Direct hyperscale or sovereign wins
    - Would expand average contract size materially
    - Public sources do not name any such account, leaving concentration upside and downside both opaque
    - Largest upside path but hardest one to underwrite publicly today
    - Request named accounts or procurement-stage evidence with timing and scope
  notes: The table treats concentration risk as both upside and downside because undisclosed large accounts can accelerate growth while also masking dependency.
  claimRefs:
  - CU020
  - CU021
  - CU022
  - CU023
  - CU024
  - CU032
  - CU039
  - CU041
  - CU045
- id: TU006
  title: Procurement and validation friction table
  columns:
  - Friction point
  - Why it exists
  - Current mitigation
  - Public evidence
  - Remaining ask
  rows:
  - - Entrenched Nvidia ecosystem
    - Customers already know the incumbent software, tooling, and deployment model
    - d-Matrix positions open standards, better latency, and lower power/TCO
    - Forbes, GFM Review, and IntuitionLabs all highlight incumbent ecosystem advantage
    - Request win-loss analysis against Nvidia-based alternatives
  - - Heterogeneous deployment complexity
    - Multiple accelerators only help if orchestration hides hardware complexity
    - Gimlet abstracts workload placement and d-Matrix markets Aviator plus JetStream
    - Data Center Knowledge and Gimlet describe the abstraction layer as central
    - Request operator evidence on deployment effort and code changes
  - - OEM and channel dependence
    - Customers buy systems, racks, and support packages rather than bare silicon
    - Supermicro, GigaIO, Liqid, Arista, and Broadcom extend the commercial surface
    - Official commercialization materials repeatedly rely on those partners
    - Request support split, certification matrix, and partner revenue concentration
  - - Proof depth versus proof quality
    - Partner quotes and architecture milestones are easier to publish than production cohort data
    - d-Matrix now has one named operator in Gimlet and purchasable SquadRack configurations
    - The corpus shows real progress but still lacks retention and installed-base disclosure
    - Request production reference calls and cohort metrics before underwriting durable demand
  notes: This table is intentionally qualitative. Public evidence is much stronger on what could make procurement easier than on how quickly those mitigations are converting into durable production revenue.
  claimRefs:
  - CU024
  - CU034
  - CU035
  - CU036
  - CU037
  - CU038
  - CU043
