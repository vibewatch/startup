- id: TU003
  title: Named customer proof table
  columns:
  - Proof point
  - Segment
  - Deployment / use case
  - Production vs pilot
  - Outcome / signal
  - Limitation
  enumerationScope:
    coverage: partial
    basis: Rows capture the named public proof points visible in the reviewed corpus as of 2026-05-26, including channel partners and a named cloud operator, not a complete customer roster.
  rows:
  - - Gimlet Labs
    - Specialist AI cloud / operator
    - Corsair deployed alongside GPUs for agentic inference and speculative decoding
    - Pre-broad-availability; select customers planned in 2H 2026
    - Named external operator plus technical benchmark and planned cloud offer
    - Still short of disclosed broad production customer count or renewals
  - - GigaIO
    - Enterprise scale-up infrastructure partner
    - Corsair integrated into SuperNODE for large single-node inference deployments
    - Integrated solution with early-access interest path
    - Shows a credible enterprise deployment vehicle and scale-up expansion route
    - Partner proof rather than named end-customer production logo
  - - Supermicro
    - OEM / channel partner
    - SquadRack and X14 AI server platform for rack-scale inference
    - Purchasable configuration path in Q1 2026
    - Indicates channel transactability and rack-integration readiness
    - Public statement does not identify live end users or outcomes
  - - Liqid
    - Composable infrastructure partner
    - Corsair integrated for flexible inference deployments
    - Partner endorsement only
    - Supports the story that Corsair can slot into alternate enterprise platforms
    - No named customer, deployment size, or usage metric is disclosed
  - - Undisclosed early-access customers
    - Evaluation cohort
    - Corsair samples in late 2024
    - Pilot / evaluation
    - Shows some pre-GA external testing before broader commercialization
    - Account count, conversion, and segment mix are not public
  notes: The strongest named proof in public is a mix of one cloud operator and multiple channel/OEM partners. Logos and endorsements improve confidence in deployment maturity, but they do not answer the core question of how many end customers are in production.
