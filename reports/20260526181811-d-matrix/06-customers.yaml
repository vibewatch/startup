chapter:
  number: 6
  title: Customers
  summary: 'd-Matrix has credible public customer-adoption signals, but they are still dominated by partner and channel validation rather than a disclosed production-customer base. The strongest named proof points are the GigaIO scale-up system, Supermicro-backed SquadRack availability, and Gimlet Labs as a named cloud operator planning select-customer availability in 2H 2026. The core diligence gap is unchanged: public sources do not disclose customer count, retention, NRR, concentration, or a broad roster of end customers, so commercialization maturity is better evidenced by deployment path than by durable cohort metrics.'
sections:
- id: buyer-segments-and-buying-centers
  title: Buyer Segments and Buying Centers
  body: 'Public materials give a reasonably consistent picture of who d-Matrix is trying to sell to, even if they do not reveal how many accounts have actually converted. The Series C release anchors the top-level target set as hyperscale, enterprise, and sovereign customers, while SquadRack narrows the operational buyer to cloud providers, sovereign clouds, and enterprises trying to serve agentic AI, reasoning, and video workloads. The recurring decision-maker profile is therefore infrastructure and platform leadership rather than application teams: data-center operators, AI platform architects, and cloud builders looking for lower-latency inference inside existing facilities. That targeting is reinforced by the sales narrative around standard PCIe servers, Ethernet, and air cooling. d-Matrix is not pitching a hyperscaler-only custom rack that requires greenfield infrastructure; it is pitching a retrofit path for operators who want to add inference capacity without taking on a proprietary
    fabric or liquid-cooling mandate. The strongest current fit appears to be enterprise and neocloud-style operators plus sovereign-cloud programs that value infrastructure optionality, while disclosed hyperscale production references remain absent.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
