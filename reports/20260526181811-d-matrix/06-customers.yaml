tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / budget owner
  - Primary users
  - Public proof
  - Strategic value
  - Key gap
  rows:
  - - Hyperscalers and AI factories
    - Platform and infrastructure leadership
    - AI infra teams serving frontier or high-volume inference
    - Series C release names hyperscale customers as a target, but no account is disclosed by name
    - Would validate very large-scale production adoption and silicon credibility
    - No named hyperscale production customer is public
  - - Enterprise datacenters
    - CIO / CTO / AI platform budget
    - Infrastructure and platform teams retrofitting existing facilities
    - GigaIO, Supermicro, and Liqid messaging all frame Corsair around enterprise deployment and TCO
    - Near-term commercial wedge because retrofit economics matter
    - Most proof is partner-led rather than end-customer case-study led
  - - Sovereign clouds and national programs
    - State-backed cloud operators and infrastructure procurement teams
    - Operators serving regulated or national workloads
    - Series C and SquadRack materials explicitly mention sovereign customers or sovereign clouds
    - Could be high-value accounts that care about infrastructure control
    - No sovereign customer is named or quantified publicly
  - - Specialist AI clouds / neoclouds
    - Cloud operator leadership
    - Model providers and AI-native companies
    - Gimlet is the clearest named operator using heterogeneous infrastructure with Corsair
    - Provides a route into high-usage workloads without needing a hyperscaler logo first
    - Public availability is still select-customer in 2H 2026
  - - OEM / channel ecosystem
    - System integrator and OEM product teams
    - Server, rack, and networking integration teams
    - Supermicro, GigaIO, Arista, Broadcom, and Liqid appear in public commercialization materials
    - Critical force multiplier for reach, deployment speed, and support coverage
    - Channel dependence can obscure true end-customer count and revenue mix
  notes: This table separates end-buyer segments from the OEM and channel layer that helps d-Matrix reach them. Public evidence is strongest on the route to market, not on disclosed account counts by segment.
