figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: d-Matrix is trying to move buyers from retrofit evaluation to scale-up, rack-scale, and heterogeneous cloud expansion without forcing a greenfield datacenter rebuild.
  data:
    nodes:
    - label: Identify latency-sensitive workload
      detail: Buyer starts with inference jobs where latency, power, or retrofit economics matter more than GPU incumbency.
    - label: Evaluate in existing datacenter footprint
      detail: Corsair and JetStream are pitched as PCIe and Ethernet components that fit existing servers and cooling envelopes.
    - label: Scale up inside one node
      detail: GigaIO SuperNODE represents the first meaningful expansion path before a buyer commits to distributed inference complexity.
    - label: Roll out rack-scale system
      detail: SquadRack and Supermicro create a channel path from component evaluation to purchasable rack configurations.
    - label: Extend into heterogeneous cloud
      detail: Gimlet represents the next loop, where specific inference phases move onto Corsair alongside GPUs for select customers.
  approximationNotes: Stages are analytical journey steps synthesized from public commercialization materials, not a company-authored funnel with disclosed volumes.
  claimRefs:
  - CU003
  - CU019
  - CU020
  - CU021
  - CU022
  - CU041
