figures:
  - id: FE001
    title: Product architecture map
    type: stack
    summary: Spiber's product system moves from biological design and fermentation to downstream material forms and application qualification.
    data:
      layers:
        - label: Inputs
          detail: Feedstock and molecular design inputs for the platform.
          items:
            - label: Plant-derived sugars or biomass
              detail: Primary feedstock described by Spiber and partners.
            - label: Protein and DNA designs
              detail: Designs are tuned for target properties and applications.
        - label: Biological production
          detail: Engineered microbes and fermentation convert designs into protein polymers.
          items:
            - label: Engineered microbes
              detail: Microbial hosts produce target protein polymers.
            - label: Fermentation
              detail: Tsuruoka pilot and Rayong commercial production are described; Biofoundry offers fermenters above 100 kL.
        - label: Material conversion
          detail: Purification and downstream processing create usable material forms.
          items:
            - label: Purification and polymer processing
              detail: Polymers are purified, dissolved, extruded, or otherwise formed.
            - label: Fibers, films, resins, and fluff
              detail: Public sources describe multiple downstream forms.
        - label: Customer applications
          detail: Partners qualify materials for apparel, industrial, food, and medical use cases.
          items:
            - label: Apparel and textiles
              detail: Named brand collaborations and textile development are documented.
            - label: Automotive, food, medical, and industrial
              detail: Applications are described as a broader or developing pipeline, not uniformly commercial.
        - label: Qualification and controls
          detail: Application-specific testing and controls determine whether a material can be deployed.
          items:
            - label: Performance and quality testing
              detail: Public sources do not provide current batch, durability, or SLA statistics.
        - label: Commercial feedback
          detail: Partner adoption and repeat orders are the observable market validation loop.
          items:
            - label: Brand and industrial partner feedback
              detail: Public evidence shows collaborations, but not repeat-order or customer-retention data.
    approximationNotes: "Layer order is an analytical representation of source-described workflow, not a claim that every customer uses every layer."
    claimRefs: [CE001, CE003, CE006, CE008, CE011]
callouts:
  - calloutType: insight
    title: Platform thesis
    body: Spiber's defensibility appears to reside in the combination of sequence design, fermentation scale-up, downstream material processing, and partner application know-how; a single material claim is not sufficient to evidence the whole stack.
    claimRefs: [CE002, CE006, CE011]
