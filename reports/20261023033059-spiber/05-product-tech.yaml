company:
  name: Spiber
chapter:
  number: 5
  title: Product & Technology
  summary: Spiber has moved from biomimetic-material research to a platform that designs proteins, ferments them, and converts them into fibers, films, resins, and other forms. Public evidence supports commercial-scale production and partner-led application development, but does not yet disclose enough yield, quality, reliability, cost, or security-control data to underwrite broad deployment.
sections:
  - id: platform-and-customer-workflow
    title: Platform and customer workflow
    body: >-
      Spiber's product is best understood as a configurable biomaterials platform rather than a
      single fabric SKU. Public descriptions consistently place DNA/protein design, microbial
      fermentation, purification, and downstream forming between plant-derived feedstocks and
      customer materials. The same platform can produce fibers, yarns, films, resins, fiber fluff,
      and leather-like materials, allowing a buyer to specify an end-use property rather than buy
      an undifferentiated “spider silk.” Kanematsu describes use cases spanning apparel, automotive,
      food, and medical applications, while Spiber's recent Biofoundry launch extends the workflow
      to third-party proteins. This breadth is strategically attractive, but it also makes SKU
      qualification, application testing, and customer-specific process control central to execution.
    claimRefs: [CE001, CE002, CE003, CE004, CE005]
    tableRefs: [TE001, TE002]
    figureRefs: [FE001]
  - id: scale-up-and-operating-model
    title: Scale-up and operating model
    body: >-
      The operating model combines proprietary strain and material design with external industrial
      capabilities. ADM's 2020 release described plant-based dextrose being fermented in the United
      States and shipped to Spiber downstream facilities; Kanematsu separately describes production
      beginning at the Rayong, Thailand mass-production plant. The 2026 Biofoundry description adds
      small and pilot fermenters in Tsuruoka and commercial volumes in Rayong, with service stages
      from gene-sequence design through fermenters above 100 kL. These facts indicate a lab-to-
      commercial pathway, not merely a laboratory demonstration. They also expose dependencies on
      feedstock quality, fermentation yield, downstream processing, plant utilization, logistics,
      and partner execution. Public sources do not provide a current plant-by-plant capacity,
      utilization, defect, batch-release, or unit-cost series.
    claimRefs: [CE006, CE007, CE008, CE009, CE010]
    tableRefs: [TE003]
  - id: maturity-differentiation-and-controls
    title: Maturity, differentiation, and controls
    body: >-
      Maturity is evidenced by commercial-scale production, named product collaborations, and
      repeated application development, but not by a complete operating-control package. The
      technology differentiator is the ability to redesign protein sequences and tune downstream
      form factors; the implementation differentiator is accumulated fermentation, materials, and
      partner-processing know-how. Komatsu Matere's collaboration covers waterproof films and
      alternative leather, while Kanematsu frames a wider application pipeline. At the same time,
      public evidence is mostly company or partner issued and emphasizes potential, sustainability,
      and commercialization. The record does not establish current cybersecurity controls, batch
      quality statistics, formal certifications, customer SLA performance, or regulatory readiness
      for every proposed food or medical application. Those are material diligence gaps before
      treating the platform as a repeatable multi-industry manufacturing system. A Spiber-issued
      2024 release reported that 15 brands had launched products using its materials; this is useful
      evidence of commercialization breadth at that date, but remains a company claim rather than
      independent product-volume or repeat-order evidence.
    claimRefs: [CE011, CE012, CE013, CE014, CE015, CE016]
