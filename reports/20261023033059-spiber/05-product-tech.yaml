      severity: material
      topic: operating-metrics
      missingEvidence: Current site-level capacity, utilization, yield, batch-release, defect, energy, and cost data for Tsuruoka and Rayong.
      whyItMatters: Without production-quality and cost data, commercial-scale announcements do not establish repeatable gross-margin or delivery performance.
      diligencePath: Request monthly site KPIs, batch records, quality thresholds, yield bridge, downtime log, and unit-cost bridge under NDA.
      relatedQuestionRefs: [QE008]
      relatedTableRefs: [TE003]
    - type: missing-source
      severity: material
      topic: controls
      missingEvidence: Independent evidence of cybersecurity, customer SLA, certification, traceability, and application-specific safety controls.
      whyItMatters: Multi-industry deployment expands the consequences of quality, privacy, safety, and regulatory failures.
      diligencePath: Obtain current certifications, audit reports, security controls, incident history, product specifications, and regulatory dossiers by application.
      relatedQuestionRefs: [QE007]
    - type: missing-source
      severity: minor
      topic: developer-signal
      missingEvidence: A public practitioner or developer signal showing repeatable technical adoption, such as repository activity, package usage, or engineering-community evidence.
      whyItMatters: The assigned evidence shows industrial and materials partnerships but not an open developer surface that independently signals technical adoption.
      diligencePath: Request private customer pipeline and technical deployment references, or document the absence of a relevant public developer ecosystem for this manufacturing platform.
      relatedQuestionRefs: [QE004]
