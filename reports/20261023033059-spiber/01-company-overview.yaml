company:
  name: Spiber
chapter:
  number: 1
  title: Company Overview
  summary: Spiber is a private Japanese biomaterials company founded in 2007 whose Brewed Protein platform has progressed
    from research into partner-backed commercialization. The evidence supports strategic relevance and a broad industrial
    platform, but current valuation, capitalization, operating economics, and leadership-transition implications remain materially
    uncertain.
sections:
- id: identity-and-platform
  title: Identity, platform, and operating footprint
  body: Spiber is a privately held Japanese biotechnology company founded in 2007 and headquartered in Tsuruoka, Yamagata.
    Its core product is Brewed Protein, a family of structural protein materials produced through microbial fermentation using
    plant-derived or agricultural feedstocks. Public descriptions cover fibers, films, resins, and other polymers, with applications
    spanning apparel, automotive, and adjacent fields. The official corporate page now frames the business as new-generation
    biomaterial development and identifies a Paris-based European operation plus a Thailand subsidiary operating fermentation
    and polymer manufacturing. That footprint is directionally consistent with a platform moving beyond laboratory demonstration,
    but public materials do not establish current utilization, yields, margins, or revenue.
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO014
  tableRefs:
  - TO001
- id: leadership-and-stakeholders
  title: Leadership, governance, and stakeholder dependence
  body: Leadership evidence is in transition. Historical third-party profiles identify Kazuhide Sekiyama and Junichi Sugahara
    as founders, while another account also names Hideya Mizutani. The current official page lists Maya Kawana as CEO and
    identifies functional leaders across finance, people operations, research, business development, manufacturing, and communications,
    while retaining Sekiyama and Sugahara in senior research or CEO-office roles. This suggests an effort to institutionalize
    execution beyond the founding team, but the public record does not provide a full board charter, control map, or explanation
    of the leadership change. ADM and Komatsu Matere demonstrate that production scale-up and downstream processing depend
    on strategic counterparties as well as internal science.
  claimRefs:
  - CO005
  - CO006
  - CO010
  - CO011
  tableRefs:
  - TO002
  - TO003
- id: funding-and-milestones
  title: Funding, milestones, and diligence judgment
  body: 'Spiber has attracted substantial capital, but the public financing record is inconsistent. Tracxn reports $489 million
    across nine rounds and associates a $1.22 billion valuation with September 2021; Caplight repeats the private-company
    status and approximately $1.22 billion estimate; Multiples instead reports $585 million across 14 rounds and a $900 million
    valuation for an April 2024 round. These discrepancies may reflect different treatment of debt, structured financing,
    or later data revisions, so neither valuation nor total raised should be treated as settled. The dated record nevertheless
    shows a clear commercialization arc: founding in 2007, early partner work, a 2019 product launch, 2020 scale-up collaboration,
    2021 financing and international expansion, and a 2024 funding event. The immediate diligence priority is not whether
    Spiber has raised capital, but how much remains available after the reset, on what terms, and against what operating performance.'
  claimRefs:
  - CO007
  - CO008
  - CO009
  - CO012
  - CO013
  - CO015
  - CO016
  figureRefs:
  - FO001
