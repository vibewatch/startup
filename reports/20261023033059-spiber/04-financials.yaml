company:
  name: Spiber
chapter:
  number: 4
  title: Financials
  summary: Spiber has a platform-led revenue opportunity spanning Brewed Protein materials and contract biomanufacturing,
    but public evidence does not disclose realized pricing, revenue, gross margin, cash, burn, or runway. The central underwriting
    question is whether Thailand and Japan capacity can reach commercially repeatable utilization before financing pressure
    constrains the platform.
sections:
- id: revenue-model
  title: Revenue model and monetization
  body: Public evidence supports two monetization paths rather than a single SaaS-like recurring-revenue model. Spiber sells
    or co-develops Brewed Protein materials for apparel, automotive, cosmetics and other applications, while the October 2026
    Biofoundry launch adds strain engineering, process development and contract manufacturing. The Biofoundry can be commissioned
    from a single laboratory evaluation through full production, which creates a services-to-materials funnel but also makes
    realized revenue dependent on project conversion and production utilization. ADM's partnership describes a feedstock and
    scale-up pathway, not a disclosed customer price or margin. AskCyborg describes partner-led sales but publishes no revenue,
    price, margin or sales-efficiency figures. The evidence therefore supports commercial optionality, not a verified revenue
    run-rate.
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  - CI016
  tableRefs:
  - TI001
- id: operating-economics
  title: Operating economics and cost drivers
  body: 'The operating model is fermentation and downstream processing intensive. Spiber reports Japanese R&D vessels up to
    2,000 litres and Thai commercial fermenters above 100,000 litres; a separate industry interview reports Thailand capacity
    below 1,000 tonnes per year and says stable output was achieved from 2024, while noting that full capacity had not been
    reached. Feedstock is a material cost driver: the company describes mostly sugar inputs today and is developing agricultural-
    and textile-waste routes, with waste feedstock still requiring supply-chain build-out and carrying a higher current cost.
    Public sources do not provide cost per kilogram, yield by product, energy intensity, gross margin, plant utilization or
    customer-level contribution margin. Those omissions make scale economics impossible to underwrite from public data alone.'
  claimRefs:
  - CI005
  - CI006
  - CI007
  - CI008
  - CI009
  tableRefs:
  - TI002
- id: capital-adequacy
  title: Capital adequacy and underwriting verdict
  body: 'Funding and valuation data are inconsistent across the pool and should not be treated as a current capitalization
    table. Green Queen reports $489 million raised, while Caplight presents an estimated $1.22 billion valuation and $733.55
    million total funding; Caplight explicitly labels its valuation as an estimate and its private-market data as access-limited.
    April 2026 coverage derived from Spiber''s announcement says the new management structure is pursuing early monetization
    while the founders focus on technical challenges and commercialization. None of those sources discloses cash available,
    debt terms, dilution or runway. The appropriate financial verdict is research-more: the platform has credible scale and
    partner evidence, but the capital required to reach utilization and the next-round trigger remain material diligence
    blockers.'
  claimRefs:
  - CI010
  - CI011
  - CI012
  - CI013
  - CI014
  - CI015
  tableRefs:
  - TI003
  figureRefs:
  - FI001
tables:
- id: TI001
  title: Revenue streams and evidence quality
  columns:
  - Stream
  - Mechanism
  - Unit or trigger
  - Current public status
  - Quality
  - Diligence ask
  rows:
  - - Brewed Protein materials
    - Sale or co-development of fibers, films, resins and polymers
    - Material volume / customer program
    - Used by more than 40 brands in over 200 products; realized revenue not disclosed
    - Company/partner reported; no revenue recognition detail
    - Obtain revenue by product, repeat-order rate, realized price and customer concentration
  - - Biofoundry strain engineering
    - Sequence design, host-strain construction and expression evaluation
    - Commissioned project
    - Launched in October 2026; case studies report benchmark yield multiples
    - Company service description reported by independent trade press
    - Obtain signed pipeline, conversion rate, project price and gross margin
  - - Biofoundry process development
    - Fermentation and purification development from bench to pilot scale
    - Litres / development milestone
    - Available from 1-litre to 2,000-litre R&D vessels
    - Independent report of company offering
    - Obtain utilization, cycle time, yield and customer-funded development terms
  - - Contract manufacturing
    - Commercial fermentation and downstream production
    - Production volume / batch
    - Thai facility supports fermenters above 100,000 litres; capacity is not fully utilized
    - Independent interview and company/partner evidence
    - Obtain contracted volume, take-or-pay terms, unit cost and working-capital cycle
  notes: Public sources describe mechanisms and capacity, not recognized revenue; brand count and product count are not equivalent
    to paying customers or recurring revenue.
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  - CI006
  - CI016
- id: TI002
  title: Unit economics and cost drivers
  columns:
  - Metric
  - Value
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Fermentation scale
    - 1 litre to >100,000 litres
    - Medium
    - Shows a path from development to commercial production
    - Verify usable capacity, batch cycle time and actual utilization by site
  - - Reported strain-yield improvement
    - 1.1x-2.6x interferon-gamma; 5.9x-9.4x FGF-2; fourfold average in broader tests
    - Medium
    - Yield affects substrate, reactor and downstream cost per unit
    - Obtain audited yield data for Spiber's commercial products rather than case-study proteins
  - - Sugar feedstock intensity
    - 5-10 kg sugar per kg protein fiber
    - Low-to-medium
    - Feedstock is a direct variable-cost and sustainability driver
    - Reconcile product-specific inputs, energy, waste treatment and procurement prices
  - - Gross margin / cost per kg
    - null
    - Unavailable
    - Without it, scale cannot be translated into contribution economics
    - Request product-level COGS, gross margin bridge and sensitivity to feedstock and utilization
  notes: Values are reported by interviews or company-linked coverage and are not a complete unit-economics model; null means
    no public evidence was found in the assigned pool.
  claimRefs:
  - CI005
  - CI006
  - CI007
  - CI008
  - CI009
- id: TI003
  title: Capital adequacy evidence matrix
  columns:
  - Input
  - Public evidence
  - Status
  - Underwriting implication
  - Diligence ask
  rows:
  - - Capital raised
    - $489M reported by Green Queen; $733.55M shown by Caplight
    - Conflicting / definition unclear
    - Do not use either figure as a verified current cash balance
    - Reconcile equity, debt, grants and currency conversion in a capitalization table
  - - Valuation
    - $1.22B estimated by Caplight
    - Private-market estimate
    - Valuation is not a liquidity event or available cash
    - Obtain latest preferred share price, terms, liquidation preferences and dilution
  - - Cash and runway
    - null
    - Not disclosed
    - Financing dependency cannot be quantified
    - Request latest cash, monthly burn, committed capex and runway under base/downside cases
  - - Debt / creditor obligations
    - Caplight lists multiple debt events but not terms
    - Partial
    - Debt service and security ranking may affect next-round risk
    - Obtain debt schedules, covenants, maturities and creditor waivers
  notes: Funding and valuation figures come from sources with different definitions and access limitations; missing values
    are not estimated.
