  title: The missing financial bridge is the investment decision
  body: Spiber has evidence of technical scale and commercial partners, but the assigned sources do not disclose realized
    price, revenue, gross margin, cash, burn or runway. A financing decision should remain conditional on the company's product-level
    economics and post-reset capitalization table.
  claimRefs:
