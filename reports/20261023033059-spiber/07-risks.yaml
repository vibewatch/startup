company:
  name: Spiber
chapter:
  number: 7
  title: Risks
  summary: Spiber has demonstrated commercial-scale fermentation and is broadening its platform through contract development, but execution remains exposed to scale-up complexity, partner dependence, material-performance iteration, and limited public operating and financial disclosure. The most decision-relevant risks are therefore operational and commercialization risks rather than a documented legal or safety incident.
sections:
  - id: operating-and-technology
    title: Operating and technology exposure
    body: >-
      Spiber's core execution risk is the difficulty of converting biological performance into repeatable, economic industrial production. Its 2026 biofoundry description says contract fermentation capacity is scarce and that scale-up can stall between laboratory yields and routine commercial production. The same account reports commercial-facility titers of 50 g/L, but that is a company-supplied production figure rather than an independently audited yield, and no defect, uptime, batch-failure, or unit-cost series is disclosed in the assigned evidence. Earlier product development also exposed a concrete performance risk: the first Moon Parka textile shrank significantly when soaked, requiring a redesign of the underlying protein sequence before limited sales. This history supports a material execution risk even though the redesign ultimately produced a saleable product. The operating monitor should be commercial-batch yield and failure rates by product, not the existence of a pilot or a brand launch.
    claimRefs: [CR001, CR002, CR003, CR004]
    tableRefs: [TR001, TR002]
    figureRefs: [FR001]
  - id: legal-regulatory-and-financial
    title: Legal, regulatory, and financial exposure
    body: >-
      No assigned source records a lawsuit, enforcement action, recall, or safety incident, so the evidence does not justify claiming that those risks are absent. Instead, the principal unresolved exposure is disclosure and forward-looking execution. ADM's 2020 release explicitly labels parts of the collaboration outlook as forward-looking statements and directs readers to ADM's SEC filings for risks. Spiber's biofoundry offering also spans proteins, diagnostic raw materials, and food ingredients, which creates application-specific quality and regulatory pathways that are not described in the evidence. A World Economic Forum profile reported ¥35.4 billion raised as of October 2020, but funding raised historically is not current cash available. A dated independent blog also described $230 T-shirts and $1,375 parkas as prices most consumers were not ready to pay; that is a commercialization warning, not current pricing evidence. With no current cash runway, debt terms, margin, or working-capital disclosure, diligence should obtain the capitalization, liquidity plan, insurance, quality system, and regulatory map by intended end market.
    claimRefs: [CR005, CR006, CR007, CR008, CR015, CR016]
    tableRefs: [TR003]
  - id: dependencies-and-thesis-breaks
    title: Partner, governance, and thesis-break conditions
    body: >-
      Spiber's commercialization model relies on counterparties that supply feedstock, processing, distribution, technical validation, or market access. ADM provides large-scale fermentation and agricultural supply-chain capabilities; Komatsu Matere contributes downstream processing and invested in Spiber; and brand partners have helped evaluate prototypes and identify issues. These relationships can accelerate adoption, but they also create concentration and coordination risk because public evidence does not disclose contract duration, exclusivity, economics, or replacement capacity. Governance has recently changed: TextileTechSource reports a new structure in which Maya Kawana assumes company-wide governance while the founders focus on technical challenges and commercialization. That may improve accountability, but it is also a transition risk until monetization milestones and technical bottlenecks are independently observable. Thesis-break triggers should be measurable: two consecutive commercial batches below agreed yield or quality thresholds, loss of a critical manufacturing partner without qualified replacement, a regulatory stop in a target application, or liquidity that cannot fund the next scale milestone.
    claimRefs: [CR009, CR010, CR011, CR012, CR013, CR014]
    tableRefs: []
    figureRefs: []
  - id: diligence-priorities
    title: Monitoring and diligence priorities
    body: >-
      The available evidence supports a high residual-risk posture, but not a conclusion that Spiber's platform is failing. Positive signals include a commercial plant, a reported customer-facing biofoundry, more than 40 brands and more than 200 products claimed in the 2026 release, and long-running partner relationships. Those signals are not substitutes for denominators, repeat-order data, audited economics, or independent quality records. The priority diligence package is a monthly operating dashboard covering titer, conversion yield, batch acceptance, capacity utilization, scrap, lead time, and contribution margin; a partner schedule showing committed volumes and termination rights; and a regulatory matrix separating textile, automotive, diagnostic, and food applications. Until those records are available, the appropriate risk posture is to treat scale economics and partner substitutability as material open questions.
    claimRefs: [CR002, CR009, CR012, CR014]
    tableRefs: []
    figureRefs: []
tables:
  - id: TR001
    title: Regulatory / legal risk register
    columns: [Rule or exposure, Jurisdiction or scope, Likelihood, Severity, Mitigation and diligence path]
    rows:
      - [Application-specific approvals for food or diagnostic raw materials, "Food and diagnostics; jurisdiction not specified", medium, high, "Map each intended use to its regulator and obtain the current submission and quality dossier."]
      - [Forward-looking commercialization statements, "ADM collaboration and U.S. production outlook", medium, medium, "Reconcile milestones to contracts and review the referenced SEC risk disclosures."]
      - [Material performance failure in an end use, "Textile and other product applications", medium, high, "Require end-use qualification data, wet-state testing, and customer acceptance criteria before scale commitments."]
      - ["Litigation, enforcement, recall, or safety event not visible in assigned evidence", "Global; public evidence incomplete", unknown, high, "Commission a current legal, regulatory, sanctions, recall, and insurance search."]
    notes: "Sources are public disclosures and interviews; no assigned source provides an exhaustive legal or regulatory docket, so unknown means not established rather than absent."
    claimRefs: [CR003, CR005, CR006, CR007, CR008]
    enumerationScope:
      coverage: partial
      basis: "Assigned public sources covering disclosed applications and forward-looking risk, not a complete global legal docket."
  - id: TR002
    title: Operational, quality, and security risk register
    columns: [Failure mode, Likelihood, Severity, Mitigation maturity, Residual exposure]
    rows:
      - [Scale-up from laboratory to routine commercial fermentation, high, high, "Demonstrated capability but limited public operating series", high]
      - [Low yield or batch variability, medium, high, "Reported 50 g/L production titer; no audited defect or acceptance series", high]
      - [End-use performance failure or redesign, medium, high, "Sequence redesign resolved an earlier shrinkage issue", medium]
      - [Capacity shortfall at pilot or commercial scale, medium, high, "Biofoundry offers staged capacity from 1 L to over 100 kL", medium]
      - [Premium-price adoption risk, high, high, "A dated limited-product signal exists; current pricing and elasticity are undisclosed", high]
    notes: "Likelihood and residual exposure are analyst assessments anchored to disclosed failure modes and mitigations; public sources do not provide numerical probabilities."
    claimRefs: [CR001, CR002, CR003, CR004, CR016]
  - id: TR003
    title: Partner and dependency risk register
    columns: [Dependency, Counterparty or role, Failure scenario, Severity, Mitigation and residual exposure]
    rows:
      - [Large-scale fermentation and agricultural feedstock, "ADM; U.S. production pathway", "Partner delay, capacity loss, or feedstock disruption delays commercialization", high, "Use dual-source capacity and obtain volume, termination, and contingency terms; residual exposure is high while undisclosed."]
      - [Downstream textile processing and product development, "Komatsu Matere", "Processing or investment relationship fails before products qualify", medium, "Qualify alternative processors and preserve transferable specifications."]
      - [Brand validation and market access, "Goldwin, Pangaia, and other brands", "Pilot interest does not convert to repeat orders", high, "Track paid repeat orders, volumes, and customer concentration rather than logos."]
      - [Founder technical expertise during governance transition, "Kazuhide Sekiyama and Junichi Sugahara", "Technical bottlenecks persist or decision rights become unclear", medium, "Document succession, decision rights, and milestone ownership under the new structure."]
    notes: "Counterparty roles come from public partner releases and interviews; contracts, exclusivity, economics, and replacement capacity were not disclosed in the assigned evidence."
    claimRefs: [CR009, CR010, CR011, CR012]
figures:
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: Scale economics and partner substitutability have the highest residual exposure because public evidence shows capability but not the operating and contractual denominators needed to validate resilience.
    data:
      columns: [Risk, Likelihood, Impact, Mitigation maturity, Residual exposure]
      rows:
        - label: Commercial fermentation scale-up
          values: [high, high, developing, high, "Batch yield and acceptance"]
        - label: Yield and batch variability
          values: [medium, high, developing, high, "Yield, scrap, and uptime"]
        - label: Partner capacity or concentration
          values: [medium, high, "limited public evidence", high, "Committed volumes and alternatives"]
        - label: End-use performance failure
          values: [medium, high, "demonstrated iteration", medium, "Customer acceptance and returns"]
        - label: Application-specific regulatory path
          values: [medium, high, unclear, high, "Dossier and regulator milestones"]
        - label: Governance transition execution
          values: [medium, medium, emerging, medium, "Milestone ownership and delivery"]
    claimRefs: [CR001, CR002, CR009, CR012, CR013]
callouts:
  - calloutType: risk
    title: Primary thesis-break risk
    body: "A reported commercial plant and biofoundry capability do not establish resilient economics. The thesis breaks if Spiber cannot show repeatable accepted batches, sufficient capacity, and replacement options for critical partners."
    claimRefs: [CR001, CR002, CR009, CR012]
  - calloutType: insight
    title: Positive signal with a qualification
    body: "Spiber has moved beyond laboratory-only work, but the strongest public signals remain company- or partner-supplied. Independent diligence should prioritize operating denominators and contract terms."
    claimRefs: [CR002, CR009, CR014]
