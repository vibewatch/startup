    notes: "No assigned source provides a comparable price-per-unit, contract minimum, realized discount, or gross-margin figure. The table is an evidence-gap comparison, not a price benchmark."
    claimRefs: [CP006, CP008, CP009, CP014]
figures:
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: "Ordinal positioning separates Spiber's reported customization breadth from the unresolved scale-economics barrier; points are analytical placements, not market-share measurements."
    data:
      xAxis: "Customization and material-design breadth (ordinal)"
      yAxis: "Scale-economics transparency and readiness (ordinal)"
      points:
        - {label: "Spiber", x: 4, y: 2, note: "Customizable protein platform is documented; realized price, margin and throughput are not disclosed"}
        - {label: "Animal-fiber incumbents", x: 2, y: 4, note: "Established categories and supply chains; exact comparable economics are not in the assigned sources"}
        - {label: "Petroleum-synthetic incumbents", x: 2, y: 5, note: "Mature incumbent category; exact source-backed scale metrics are not in the assigned sources"}
        - {label: "Synthetic-protein peers", x: 3, y: 1, note: "Comparable category is identified by Caplight; operating evidence is sparse"}
        - {label: "Internal build", x: 1, y: 1, note: "Status-quo alternative is in scope, but no company-specific build evidence is public"}
        - {label: "Status-quo procurement", x: 2, y: 4, note: "Existing materials remain the practical default; exact buyer switching costs are unverified"}
    approximationNotes: "Scores are ordinal analyst placements from the cited evidence and should not be interpreted as measured market shares, prices, margins, or production volumes."
    claimRefs: [CP003, CP011, CP016, CP014]
callouts:
  - calloutType: strength
    title: Platform breadth is the clearest differentiator
    body: "Spiber can design protein materials for multiple end-use properties and convert them into fibers, films, resins and leather-like materials, giving it more than a single-product competitive story."
    claimRefs: [CP002, CP003, CP006]
  - calloutType: risk
    title: Scale and price remain the moat test
    body: "The public evidence repeatedly describes high costs, the need for large-brand adoption, and ongoing scale-up; no source establishes price parity, realized margins, or repeat-order economics."
    claimRefs: [CP009, CP013, CP014]
  - calloutType: recommendation
    title: Underwrite against exact displaced materials
    body: "The next diligence step is a like-for-like performance and cost comparison against the incumbent material in each customer program, including qualification time, minimum runs, delivered price, and reorder behavior."
    claimRefs: [CP014, CP015]
