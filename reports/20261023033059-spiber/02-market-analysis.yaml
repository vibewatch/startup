company:
  name: Spiber
chapter:
  number: 2
  title: Market Analysis
  summary: Spiber addresses a broad replacement-material opportunity, but the evidence supports a constrained market thesis rather than a single headline TAM. Commercial adoption is visible in apparel and adjacent applications, while scale economics, price parity, feedstock availability, and application-specific qualification remain the gating variables.
sections:
  - id: market-boundary
    title: Market boundary and substitutes
    body: >-
      The relevant market is not “all sustainable materials.” It is the set of
      material purchases where a structural-protein polymer can meet the required
      performance, processing, regulatory, and price specifications. The observed
      beachhead is apparel and textiles: Brewed Protein can be made into fibers,
      yarns, films, resins, and leather-like formats, and the source record names
      apparel as Spiber's primary focus. The adjacent opportunity includes
      lightweight automotive parts, foams, coatings, cosmetics, and food-texture
      experiments, but these should not be aggregated with apparel spend because
      buyers, qualification cycles, units, and performance requirements differ.
      The status quo includes animal fibers such as cashmere, wool, silk and
      leather, petrochemical synthetics such as nylon and polyester, and
      application-specific internal sourcing or redesign. A defensible boundary
      therefore starts with addressable material volumes in applications where
      customers are willing to pay for differentiated performance or verified
      sustainability, then expands only when production and qualification
      evidence supports it.
    claimRefs: [CM001, CM002, CM003, CM004]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: Sizing lenses and adoption logic
    body: >-
      No assigned source provides a defensible Spiber-specific SAM or SOM, so the
      chapter preserves multiple sizing lenses instead of manufacturing a single
      estimate. The replacement lens is the broadest: it includes apparel and
      other products currently using animal- or fossil-derived materials, but
      substitution depends on functional equivalence and cost. The production
      lens is narrower and is constrained by fermentation capacity, downstream
      processing, feedstock, and plant ramp. The observed-demand lens is narrower
      again: public examples include limited apparel launches and named brand or
      partner projects, which demonstrate willingness to test but not recurring
      volume. ADM described a pathway toward commercial-scale production and
      broader-market costs, while later reporting described Thailand operations
      and a US facility under preparation; neither establishes utilization,
      realized price, gross margin, or repeat-order volume. Valuation relevance
      therefore rests on conversion from pilots and collaborations into
      repeatable, qualified material sales.
    claimRefs: [CM005, CM006, CM007, CM008, CM009]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyers-drivers-constraints
    title: Buyers, drivers, and constraints
    body: >-
      The buying center is multi-party. Brand and product teams create the
      demand signal, textile processors and manufacturers qualify the material,
      sustainability teams evaluate footprint and circularity claims, and
      procurement or finance owns the landed-cost decision. ADM adds an upstream
      feedstock and fermentation partner, while downstream partners such as
      Komatsu Matere add processing and finishing capability. Adoption drivers
      include demand for animal-free and plastic-free alternatives, differentiated
      hand feel and performance, and potential reductions in resource use. The
      constraints are equally material: Spiber's sustainability interview says
      large brands need lower costs and more scale; the evidence does not disclose
      cost per kilogram, plant utilization, yield, or customer concentration.
      Regulatory requirements become more salient if the platform expands into
      food, and EU novel-food rules require authorization for foods not consumed
      to a significant degree before 15 May 1997. The practical adoption path is
      therefore application-by-application qualification, followed by scaled
      supply and repeat orders, not a generic sustainability-led market conversion.
    claimRefs: [CM010, CM011, CM012, CM013, CM014]
    tableRefs: [TM003]
callouts:
  - calloutType: insight
    title: Market thesis
    body: Spiber has a credible platform-to-market path in differentiated textile and material applications, but the evidence supports an option-value thesis until cost, capacity, and repeat purchasing are disclosed.
    claimRefs: [CM006, CM009, CM012]
  - calloutType: risk
    title: Primary market risk
    body: "The same scale-up requirement that expands the addressable market can delay adoption: large brands may not commit meaningful volume until the material is cost-competitive and reliably available."
    claimRefs: [CM011, CM012, CM014]
