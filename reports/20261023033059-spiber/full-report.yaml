          - type: table
            tableRef: TE002
            claimRefs:
              - CE003
              - CE005
              - CE006
              - CE008
              - CE012
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE003
              - CE006
              - CE008
              - CE011
      - number: '5.2'
        title: Scale-up and operating model
        blocks:
          - type: paragraph
            body: >-
              The operating model combines proprietary strain and material design with external industrial capabilities.
              ADM's 2020 release described plant-based dextrose being fermented in the United States and shipped to
              Spiber downstream facilities; Kanematsu separately describes production beginning at the Rayong, Thailand
              mass-production plant. The 2026 Biofoundry description adds small and pilot fermenters in Tsuruoka and
              commercial volumes in Rayong, with service stages from gene-sequence design through fermenters above 100
              kL. These facts indicate a lab-to- commercial pathway, not merely a laboratory demonstration. They also
              expose dependencies on feedstock quality, fermentation yield, downstream processing, plant utilization,
              logistics, and partner execution. Public sources do not provide a current plant-by-plant capacity,
              utilization, defect, batch-release, or unit-cost series.
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
          - type: table
            tableRef: TE003
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE010
              - CE013
              - CE014
      - number: '5.3'
        title: Maturity, differentiation, and controls
        blocks:
          - type: paragraph
            body: >-
              Maturity is evidenced by commercial-scale production, named product collaborations, and repeated
              application development, but not by a complete operating-control package. The technology differentiator is
              the ability to redesign protein sequences and tune downstream form factors; the implementation
              differentiator is accumulated fermentation, materials, and partner-processing know-how. Komatsu Matere's
              collaboration covers waterproof films and alternative leather, while Kanematsu frames a wider application
              pipeline. At the same time, public evidence is mostly company or partner issued and emphasizes potential,
              sustainability, and commercialization. The record does not establish current cybersecurity controls, batch
              quality statistics, formal certifications, customer SLA performance, or regulatory readiness for every
              proposed food or medical application. Those are material diligence gaps before treating the platform as a
              repeatable multi-industry manufacturing system. A Spiber-issued 2024 release reported that 15 brands had
              launched products using its materials; this is useful evidence of commercialization breadth at that date,
              but remains a company claim rather than independent product-volume or repeat-order evidence.
            claimRefs:
              - CE011
              - CE012
              - CE013
              - CE014
              - CE015
              - CE016
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Platform thesis
            body: >-
              Spiber's defensibility appears to reside in the combination of sequence design, fermentation scale-up,
              downstream material processing, and partner application know-how; a single material claim is not
              sufficient to evidence the whole stack.
            calloutType: insight
            claimRefs:
              - CE002
              - CE006
              - CE011
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer, user, and payer segments
        blocks:
          - type: paragraph
            body: >-
              Spiber sells a material platform into existing manufacturing ecosystems rather than a finished consumer
              product. The immediate users are textile mills, yarn makers, apparel brands, and processors that turn
              Brewed Protein™ into fibers, yarns, films, or other forms; the commercial buyers are therefore typically
              industrial partners and brands, while the end payer is the consumer buying a finished garment. ADM's
              announced role shows an upstream manufacturing and feedstock partner, with polymers produced using
              plant-based dextrose and shipped to Spiber downstream facilities. Komatsu Matere adds a processor and
              investor relationship around waterproofing film and alternative leather. Public materials also identify
              automotive, interiors, and food-related development as expansion surfaces, but do not disclose segment
              revenue, contract value, or payer mix.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU016
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU010
      - number: '6.2'
        title: Named adoption and commercial proof
        blocks:
          - type: paragraph
            body: >-
              The evidence supports real product exposure, but the strength of proof varies by relationship. The North
              Face Japan's Moon Parka is described as a limited commercial launch that sold out, which demonstrates
              consumer willingness to buy a product containing Spiber fiber but does not establish repeat demand or
              production-scale economics. Parley names The North Face, Junya Watanabe, Woolrich, and Iris Van Herpen as
              brands whose apparel used Brewed Protein™ materials. ADM and Komatsu Matere document industrial scale-up
              and development partnerships, respectively. These are stronger than unaffiliated logo lists because they
              describe a product, process, or joint initiative; nevertheless, most public sources do not distinguish
              pilot, limited edition, continuing production, or renewal.
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU007
              - CU015
          - type: table
            tableRef: TU003
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU007
              - CU009
          - type: figure
            figureRef: FU001
            claimRefs: []
      - number: '6.3'
        title: Durability, expansion, and concentration
        blocks:
          - type: paragraph
            body: >-
              Spiber's expansion path is plausible but not yet measurable from public customer data. The platform can be
              adapted across fibers, films, resins, coatings, and alternative leather, allowing a relationship to expand
              from one material or garment into additional applications. ADM said the 2020 collaboration was intended to
              create a pathway toward commercial-scale production, while Komatsu Matere described a mid- to long-term
              product-development partnership. A 2024 fundraising report said 15 domestic and international brands had
              launched products using Spiber materials, but this is a cumulative launch count rather than active
              accounts, retained customers, or recurring revenue. No public source in the assigned pool provides NRR,
              GRR, churn, renewal rates, contract lengths, customer-level revenue, top-customer concentration, or plant
              utilization. Those omissions make commercial durability and concentration unproven, especially after the
              2026 management reset.
            claimRefs:
              - CU008
              - CU009
              - CU010
              - CU011
          - type: table
            tableRef: TU002
            claimRefs:
              - CU004
              - CU006
              - CU008
              - CU009
              - CU015
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Named adoption is real but heterogeneous
            body: >-
              Spiber can point to named brands, a sold-out limited launch, and industrial partnerships; the proof spans
              pilots, collections, and scale-up agreements rather than a single comparable customer cohort.
            calloutType: strength
            claimRefs:
              - CU004
              - CU005
              - CU006
          - type: callout
            title: Durability remains the central customer diligence gap
            body: >-
              No assigned source discloses NRR, GRR, churn, renewal, contract length, customer-level revenue, or
              top-customer concentration, so public adoption breadth cannot yet be translated into durable recurring
              economics.
            calloutType: risk
            claimRefs:
              - CU010
              - CU011
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Operating and technology exposure
        blocks:
          - type: paragraph
            body: >-
              Spiber's core execution risk is the difficulty of converting biological performance into repeatable,
              economic industrial production. Its 2026 biofoundry description says contract fermentation capacity is
              scarce and that scale-up can stall between laboratory yields and routine commercial production. The same
              account reports commercial-facility titers of 50 g/L, but that is a company-supplied production figure
              rather than an independently audited yield, and no defect, uptime, batch-failure, or unit-cost series is
              disclosed in the assigned evidence. Earlier product development also exposed a concrete performance risk:
              the first Moon Parka textile shrank significantly when soaked, requiring a redesign of the underlying
              protein sequence before limited sales. This history supports a material execution risk even though the
              redesign ultimately produced a saleable product. The operating monitor should be commercial-batch yield
              and failure rates by product, not the existence of a pilot or a brand launch.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR003
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR002
              - CR009
              - CR012
              - CR013
      - number: '7.2'
        title: Legal, regulatory, and financial exposure
        blocks:
          - type: paragraph
            body: >-
              No assigned source records a lawsuit, enforcement action, recall, or safety incident, so the evidence does
              not justify claiming that those risks are absent. Instead, the principal unresolved exposure is disclosure
              and forward-looking execution. ADM's 2020 release explicitly labels parts of the collaboration outlook as
              forward-looking statements and directs readers to ADM's SEC filings for risks. Spiber's biofoundry
              offering also spans proteins, diagnostic raw materials, and food ingredients, which creates
              application-specific quality and regulatory pathways that are not described in the evidence. A World
              Economic Forum profile reported ¥35.4 billion raised as of October 2020, but funding raised historically
              is not current cash available. A dated independent blog also described $230 T-shirts and $1,375 parkas as
              prices most consumers were not ready to pay; that is a commercialization warning, not current pricing
              evidence. With no current cash runway, debt terms, margin, or working-capital disclosure, diligence should
              obtain the capitalization, liquidity plan, insurance, quality system, and regulatory map by intended end
              market.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
      - number: '7.3'
        title: Partner, governance, and thesis-break conditions
        blocks:
          - type: paragraph
            body: >-
              Spiber's commercialization model relies on counterparties that supply feedstock, processing, distribution,
              technical validation, or market access. ADM provides large-scale fermentation and agricultural
              supply-chain capabilities; Komatsu Matere contributes downstream processing and invested in Spiber; and
              brand partners have helped evaluate prototypes and identify issues. These relationships can accelerate
              adoption, but they also create concentration and coordination risk because public evidence does not
              disclose contract duration, exclusivity, economics, or replacement capacity. Governance has recently
              changed: TextileTechSource reports a new structure in which Maya Kawana assumes company-wide governance
              while the founders focus on technical challenges and commercialization. That may improve accountability,
              but it is also a transition risk until monetization milestones and technical bottlenecks are independently
              observable. Thesis-break triggers should be measurable: two consecutive commercial batches below agreed
              yield or quality thresholds, loss of a critical manufacturing partner without qualified replacement, a
              regulatory stop in a target application, or liquidity that cannot fund the next scale milestone.
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
      - number: '7.4'
        title: Monitoring and diligence priorities
        blocks:
          - type: paragraph
            body: >-
              The available evidence supports a high residual-risk posture, but not a conclusion that Spiber's platform
              is failing. Positive signals include a commercial plant, a reported customer-facing biofoundry, more than
              40 brands and more than 200 products claimed in the 2026 release, and long-running partner relationships.
              Those signals are not substitutes for denominators, repeat-order data, audited economics, or independent
              quality records. The priority diligence package is a monthly operating dashboard covering titer,
              conversion yield, batch acceptance, capacity utilization, scrap, lead time, and contribution margin; a
              partner schedule showing committed volumes and termination rights; and a regulatory matrix separating
              textile, automotive, diagnostic, and food applications. Until those records are available, the appropriate
              risk posture is to treat scale economics and partner substitutability as material open questions.
            claimRefs:
              - CR002
              - CR009
              - CR012
              - CR014
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Primary thesis-break risk
            body: >-
              A reported commercial plant and biofoundry capability do not establish resilient economics. The thesis
              breaks if Spiber cannot show repeatable accepted batches, sufficient capacity, and replacement options for
              critical partners.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR009
              - CR012
          - type: callout
            title: Positive signal with a qualification
            body: >-
              Spiber has moved beyond laboratory-only work, but the strongest public signals remain company- or
              partner-supplied. Independent diligence should prioritize operating denominators and contract terms.
            calloutType: insight
            claimRefs:
              - CR002
              - CR009
              - CR014
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment case and decision
        blocks:
          - type: paragraph
            body: >-
              Spiber has a credible platform thesis: Brewed Protein materials are designed at the DNA level and produced
              through microbial fermentation, while the company has secured scale-oriented relationships with ADM and
              Komatsu Matere. The 2024 company announcement says more than JPY 10 billion was raised and that 15
              domestic and international brands had launched products using its materials. Those are useful
              commercialization signals, but they are not revenue, repeat-order, margin, or cash-runway evidence.
              Caplight publishes a $1.22 billion estimate based on funding-round data, while The Bridge reported a
              historical value-securitization financing. Neither source supplies a current transaction price or
              post-2024 security terms. The recommendation is therefore research-more with low confidence and high risk,
              not buy.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV015
          - type: table
            tableRef: TV001
            claimRefs:
              - CV003
              - CV004
              - CV011
              - CV012
              - CV015
              - CV016
      - number: '8.2'
        title: Thesis, anti-thesis, and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The strongest bull argument is that Spiber has moved beyond a laboratory concept into a multi-application
              platform with commercial-scale ambitions, external production expertise, and brand launches. ADM described
              a pathway to commercial-scale production, and Komatsu Matere disclosed an investment-linked partnership
              covering waterproof films and alternative leather. The anti-thesis is equally material: Parley reports
              that scaling enough for large players to make economic sense has been a challenge, and Spiber began
              operating under a new management structure in 2026 with an explicit early-monetization mandate and
              founders reassigned toward technical bottlenecks and commercialization. Entry should therefore require a
              current cap table, security terms, revenue by application, gross margin, cash runway, production yield,
              and customer reorder data. A lower price alone would not cure missing operating proof.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV016
      - number: '8.3'
        title: Scenarios, exit readiness, and diligence gates
        blocks:
          - type: paragraph
            body: >-
              A defensible valuation range cannot be calculated from the assigned public evidence because revenue,
              growth, gross margin, retention, debt terms, dilution, and a current financing mark are not disclosed. The
              scenarios below are decision cases rather than numerical price targets; Caplight's estimate is a screening
              reference, not primary valuation evidence. The bull case requires verified scale economics and repeat
              demand across apparel and adjacent applications. The base case treats Spiber as a promising but
              capital-intensive private platform pending proof. The bear case assumes that early monetization is delayed
              and additional financing arrives on unfavorable terms. Exit readiness is not established: the sources show
              financing and partnerships, not liquidity, a public listing timetable, or transaction comparables. The
              next decision should be conditional on primary financial and cap-table diligence.
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV006
              - CV009
              - CV011
              - CV015
              - CV016
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Decision
            body: >-
              Research-more: Spiber merits continued diligence, but a third-party valuation estimate and a 2026
              operating reset do not support a buy without primary pricing and operating evidence.
            calloutType: recommendation
            claimRefs:
              - CV011
              - CV012
              - CV015
              - CV016
          - type: callout
            title: Thesis break
            body: >-
              Treat failure to demonstrate repeat demand, positive scale economics, or adequate runway under the
              early-monetization plan as a thesis-break condition.
            calloutType: risk
            claimRefs:
              - CV009
              - CV013
              - CV014
              - CV016
