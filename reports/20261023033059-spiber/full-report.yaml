              Leadership evidence is in transition. Historical third-party profiles identify Kazuhide Sekiyama and
              Junichi Sugahara as founders, while another account also names Hideya Mizutani. The current official page
              lists Maya Kawana as CEO and identifies functional leaders across finance, people operations, research,
              business development, manufacturing, and communications, while retaining Sekiyama and Sugahara in senior
