              - CI009
      - number: '4.3'
        title: Capital adequacy and underwriting verdict
        blocks:
          - type: paragraph
            body: >-
              Funding and valuation data are inconsistent across the pool and should not be treated as a current
              capitalization table. Green Queen reports $489 million raised, while Caplight presents an estimated $1.22
              billion valuation and $733.55 million total funding; Caplight explicitly labels its valuation as an
              estimate and its private-market data as access-limited. April 2026 coverage derived from Spiber's
              announcement says the new management structure is pursuing early monetization while the founders focus on
              technical challenges and commercialization. None of those sources discloses cash available, debt terms,
              dilution or runway. The appropriate financial verdict is research-more: the platform has credible scale
              and partner evidence, but the capital required to reach utilization and the next-round trigger remain
              material diligence blockers.
