  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The relevant market is not “all sustainable materials.” It is the set of material purchases where a
              structural-protein polymer can meet the required performance, processing, regulatory, and price
              specifications. The observed beachhead is apparel and textiles: Brewed Protein can be made into fibers,
              yarns, films, resins, and leather-like formats, and the source record names apparel as Spiber's primary
              focus. The adjacent opportunity includes lightweight automotive parts, foams, coatings, cosmetics, and
              food-texture experiments, but these should not be aggregated with apparel spend because buyers,
              qualification cycles, units, and performance requirements differ. The status quo includes animal fibers
              such as cashmere, wool, silk and leather, petrochemical synthetics such as nylon and polyester, and
              application-specific internal sourcing or redesign. A defensible boundary therefore starts with
              addressable material volumes in applications where customers are willing to pay for differentiated
              performance or verified sustainability, then expands only when production and qualification evidence
              supports it.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: Sizing lenses and adoption logic
        blocks:
          - type: paragraph
            body: >-
              No assigned source provides a defensible Spiber-specific SAM or SOM, so the chapter preserves multiple
              sizing lenses instead of manufacturing a single estimate. The replacement lens is the broadest: it
              includes apparel and other products currently using animal- or fossil-derived materials, but substitution
              depends on functional equivalence and cost. The production lens is narrower and is constrained by
              fermentation capacity, downstream processing, feedstock, and plant ramp. The observed-demand lens is
              narrower again: public examples include limited apparel launches and named brand or partner projects,
              which demonstrate willingness to test but not recurring volume. ADM described a pathway toward
              commercial-scale production and broader-market costs, while later reporting described Thailand operations
              and a US facility under preparation; neither establishes utilization, realized price, gross margin, or
              repeat-order volume. Valuation relevance therefore rests on conversion from pilots and collaborations into
              repeatable, qualified material sales.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM006
              - CM009
              - CM012
      - number: '2.3'
        title: Buyers, drivers, and constraints
        blocks:
          - type: paragraph
            body: >-
              The buying center is multi-party. Brand and product teams create the demand signal, textile processors and
              manufacturers qualify the material, sustainability teams evaluate footprint and circularity claims, and
              procurement or finance owns the landed-cost decision. ADM adds an upstream feedstock and fermentation
              partner, while downstream partners such as Komatsu Matere add processing and finishing capability.
              Adoption drivers include demand for animal-free and plastic-free alternatives, differentiated hand feel
              and performance, and potential reductions in resource use. The constraints are equally material: Spiber's
              sustainability interview says large brands need lower costs and more scale; the evidence does not disclose
              cost per kilogram, plant utilization, yield, or customer concentration. Regulatory requirements become
              more salient if the platform expands into food, and EU novel-food rules require authorization for foods
              not consumed to a significant degree before 15 May 1997. The practical adoption path is therefore
              application-by-application qualification, followed by scaled supply and repeat orders, not a generic
              sustainability-led market conversion.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM010
              - CM011
              - CM013
              - CM014
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Market thesis
            body: >-
              Spiber has a credible platform-to-market path in differentiated textile and material applications, but the
              evidence supports an option-value thesis until cost, capacity, and repeat purchasing are disclosed.
            calloutType: insight
            claimRefs:
              - CM006
              - CM009
              - CM012
          - type: callout
            title: Primary market risk
            body: >-
              The same scale-up requirement that expands the addressable market can delay adoption: large brands may not
              commit meaningful volume until the material is cost-competitive and reliably available.
            calloutType: risk
            claimRefs:
              - CM011
              - CM012
              - CM014
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and basis of differentiation
        blocks:
          - type: paragraph
            body: >-
              The relevant competitive set is broader than synthetic-spider-silk startups. Spiber's Brewed Protein
              materials are positioned as alternatives to animal fibers, petroleum-derived synthetics, and selected
              coatings, films, and leather-like materials. Its process starts with custom protein designs, inserts
              corresponding DNA into microbes, ferments them with sugars, purifies the resulting polymers, and converts
              them into fibers or other forms. That breadth creates a platform-level differentiation, but it also places
              Spiber against mature incumbent supply chains whose cost, availability, and processing infrastructure are
              not disclosed here. WIPO describes the material as usable in fibers, resin-like materials, leather-like
              materials, and medical materials; Parley records that Spiber has moved from copying spider silk toward
              designing proteins for end-use performance. The competitive advantage is therefore best treated as a
              combination of molecular design, process know-how, and application learning rather than as a proven cost
              moat.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP005
              - CP011
              - CP016
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP003
              - CP011
              - CP016
              - CP014
      - number: '3.2'
        title: Buyer trade-offs, partners, and distribution
        blocks:
          - type: paragraph
            body: >-
              Buyers appear to adopt Spiber through co-development and branded product experiments, not through
              transparent list pricing. ADM's release describes a production pathway in which ADM supplies fermentation
              and agricultural-feedstock capabilities while Spiber performs downstream processing; Komatsu Matere
              describes a separate initiative combining its waterproof-film and synthetic-leather processing with
              Spiber's structural proteins. Those relationships can reduce manufacturing and qualification barriers, but
              they also create dependency on partners and do not establish realized margins or repeat-order economics.
              Public examples include The North Face Japan, Goldwin, Woolrich, and other fashion partners, while WIPO
              says high production costs led Spiber to target high-grade materials initially. The strongest current
              buying signal is willingness to collaborate on differentiated materials; the weakest is evidence of price
              parity and routine, high-volume procurement.
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP006
              - CP007
              - CP014
      - number: '3.3'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Spiber's moat has several reinforcing layers: proprietary protein designs, fermentation process knowledge,
              downstream conversion know-how, and accumulated partner testing. Its patent and financing history is
              evidence of an IP strategy, not proof that the claims are enforceable or economically exclusive. The
              platform remains exposed to commoditization if competing biomaterials or incumbent synthetics match
              performance at lower cost, and to execution risk if plants cannot reach commercially relevant throughput.
              Green Queen reports that Spiber had product launches with 15 companies and was building production
              capacity, while Parley's interview says the company still needs large brands to adopt the material and
              help bring costs down. Public sources do not provide a comparable price-per-unit matrix, repeat-order
              rates, switching costs, or competitor production yields. Those are material gaps, so the competitive
              conclusion is differentiated but not yet durable at scale.
            claimRefs:
              - CP011
              - CP012
              - CP013
              - CP014
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP006
              - CP008
              - CP009
              - CP014
      - number: '3.4'
        title: Competitive diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The public record is strong enough to identify product and partner signals, but not to rank Spiber against
              named peers on realized price, gross margin, delivery reliability, or customer retention. Caplight's
              private-market page lists AMSilk, Modern Meadow, and Bolt Threads as similarity comparables, but gives no
              comparable operating metrics in the fetched text. The feature matrix therefore preserves unknowns instead
              of converting marketing descriptions into scores. Before underwriting a durable moat, an investor should
              request contracted and realized pricing, qualification-to-order conversion, minimum viable production
              runs, partner concentration, and performance data against the exact incumbent material being displaced.
            claimRefs:
              - CP016
              - CP014
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Platform breadth is the clearest differentiator
            body: >-
              Spiber can design protein materials for multiple end-use properties and convert them into fibers, films,
              resins and leather-like materials, giving it more than a single-product competitive story.
            calloutType: strength
            claimRefs:
              - CP002
              - CP003
              - CP006
          - type: callout
            title: Scale and price remain the moat test
            body: >-
              The public evidence repeatedly describes high costs, the need for large-brand adoption, and ongoing
              scale-up; no source establishes price parity, realized margins, or repeat-order economics.
            calloutType: risk
            claimRefs:
              - CP009
              - CP013
              - CP014
          - type: callout
            title: Underwrite against exact displaced materials
            body: >-
              The next diligence step is a like-for-like performance and cost comparison against the incumbent material
              in each customer program, including qualification time, minimum runs, delivered price, and reorder
              behavior.
            calloutType: recommendation
            claimRefs:
              - CP014
              - CP015
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports two monetization paths rather than a single SaaS-like recurring-revenue model.
              Spiber sells or co-develops Brewed Protein materials for apparel, automotive, cosmetics and other
              applications, while the October 2026 Biofoundry launch adds strain engineering, process development and
              contract manufacturing. The Biofoundry can be commissioned from a single laboratory evaluation through
              full production, which creates a services-to-materials funnel but also makes realized revenue dependent on
              project conversion and production utilization. ADM's partnership describes a feedstock and scale-up
              pathway, not a disclosed customer price or margin. AskCyborg describes partner-led sales but publishes no
              revenue, price, margin or sales-efficiency figures. The evidence therefore supports commercial
              optionality, not a verified revenue run-rate.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI016
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI006
              - CI016
      - number: '4.2'
        title: Operating economics and cost drivers
        blocks:
          - type: paragraph
            body: >-
              The operating model is fermentation and downstream processing intensive. Spiber reports Japanese R&D
              vessels up to 2,000 litres and Thai commercial fermenters above 100,000 litres; a separate industry
              interview reports Thailand capacity below 1,000 tonnes per year and says stable output was achieved from
              2024, while noting that full capacity had not been reached. Feedstock is a material cost driver: the
              company describes mostly sugar inputs today and is developing agricultural- and textile-waste routes, with
              waste feedstock still requiring supply-chain build-out and carrying a higher current cost. Public sources
              do not provide cost per kilogram, yield by product, energy intensity, gross margin, plant utilization or
              customer-level contribution margin. Those omissions make scale economics impossible to underwrite from
              public data alone.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
              - CI009
          - type: table
            tableRef: TI002
            claimRefs:
