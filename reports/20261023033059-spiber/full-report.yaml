        title: Funding, milestones, and diligence judgment
        blocks:
          - type: paragraph
            body: >-
              Spiber has attracted substantial capital, but the public financing record is inconsistent. Tracxn reports
              $489 million across nine rounds and associates a $1.22 billion valuation with September 2021; Caplight
              repeats the private-company status and approximately $1.22 billion estimate; Multiples instead reports
              $585 million across 14 rounds and a $900 million valuation for an April 2024 round. These discrepancies
              may reflect different treatment of debt, structured financing, or later data revisions, so neither
              valuation nor total raised should be treated as settled. The dated record nevertheless shows a clear
              commercialization arc: founding in 2007, early partner work, a 2019 product launch, 2020 scale-up
              collaboration, 2021 financing and international expansion, and a 2024 funding event. The immediate
              diligence priority is not whether Spiber has raised capital, but how much remains available after the
