chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, platform, and operating footprint
        blocks:
          - type: paragraph
            body: >-
              Spiber is a privately held Japanese biotechnology company founded in 2007 and headquartered in Tsuruoka,
              Yamagata. Its core product is Brewed Protein, a family of structural protein materials produced through
              microbial fermentation using plant-derived or agricultural feedstocks. Public descriptions cover fibers,
              films, resins, and other polymers, with applications spanning apparel, automotive, and adjacent fields.
              The official corporate page now frames the business as new-generation biomaterial development and
              identifies a Paris-based European operation plus a Thailand subsidiary operating fermentation and polymer
              manufacturing. That footprint is directionally consistent with a platform moving beyond laboratory
              demonstration, but public materials do not establish current utilization, yields, margins, or revenue.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO014
