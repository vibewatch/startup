  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Platform and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Spiber's product is best understood as a configurable biomaterials platform rather than a single fabric
              SKU. Public descriptions consistently place DNA/protein design, microbial fermentation, purification, and
              downstream forming between plant-derived feedstocks and customer materials. The same platform can produce
              fibers, yarns, films, resins, fiber fluff, and leather-like materials, allowing a buyer to specify an
              end-use property rather than buy an undifferentiated “spider silk.” Kanematsu describes use cases spanning
              apparel, automotive, food, and medical applications, while Spiber's recent Biofoundry launch extends the
              workflow to third-party proteins. This breadth is strategically attractive, but it also makes SKU
              qualification, application testing, and customer-specific process control central to execution.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
