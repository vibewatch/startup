company:
  name: Spiber
chapter:
  number: 6
  title: Customers
  summary: Spiber has moved beyond laboratory demonstrations into named apparel and industrial relationships, but public evidence still describes launches and partnerships more clearly than recurring revenue, utilization, retention, or concentration. The customer thesis is therefore strongest as proof of technical adoption and weakest as proof of durable economics.
sections:
  - id: customer-segments
    title: Buyer, user, and payer segments
    body: >-
      Spiber sells a material platform into existing manufacturing ecosystems rather than a finished consumer product. The immediate users are textile mills, yarn makers, apparel brands, and processors that turn Brewed Protein™ into fibers, yarns, films, or other forms; the commercial buyers are therefore typically industrial partners and brands, while the end payer is the consumer buying a finished garment. ADM's announced role shows an upstream manufacturing and feedstock partner, with polymers produced using plant-based dextrose and shipped to Spiber downstream facilities. Komatsu Matere adds a processor and investor relationship around waterproofing film and alternative leather. Public materials also identify automotive, interiors, and food-related development as expansion surfaces, but do not disclose segment revenue, contract value, or payer mix.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU016
    tableRefs:
      - TU001
  - id: adoption-proof
    title: Named adoption and commercial proof
    body: >-
      The evidence supports real product exposure, but the strength of proof varies by relationship. The North Face Japan's Moon Parka is described as a limited commercial launch that sold out, which demonstrates consumer willingness to buy a product containing Spiber fiber but does not establish repeat demand or production-scale economics. Parley names The North Face, Junya Watanabe, Woolrich, and Iris Van Herpen as brands whose apparel used Brewed Protein™ materials. ADM and Komatsu Matere document industrial scale-up and development partnerships, respectively. These are stronger than unaffiliated logo lists because they describe a product, process, or joint initiative; nevertheless, most public sources do not distinguish pilot, limited edition, continuing production, or renewal.
    claimRefs:
      - CU004
      - CU005
      - CU006
      - CU007
      - CU015
    tableRefs:
      - TU003
    figureRefs:
      - FU001
  - id: durability-and-expansion
    title: Durability, expansion, and concentration
    body: >-
      Spiber's expansion path is plausible but not yet measurable from public customer data. The platform can be adapted across fibers, films, resins, coatings, and alternative leather, allowing a relationship to expand from one material or garment into additional applications. ADM said the 2020 collaboration was intended to create a pathway toward commercial-scale production, while Komatsu Matere described a mid- to long-term product-development partnership. A 2024 fundraising report said 15 domestic and international brands had launched products using Spiber materials, but this is a cumulative launch count rather than active accounts, retained customers, or recurring revenue. No public source in the assigned pool provides NRR, GRR, churn, renewal rates, contract lengths, customer-level revenue, top-customer concentration, or plant utilization. Those omissions make commercial durability and concentration unproven, especially after the 2026 management reset.
    claimRefs:
      - CU008
      - CU009
      - CU010
      - CU011
    tableRefs:
      - TU002

