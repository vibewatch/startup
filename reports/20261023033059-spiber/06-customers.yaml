callouts:
  - calloutType: strength
    title: Named adoption is real but heterogeneous
    body: Spiber can point to named brands, a sold-out limited launch, and industrial partnerships; the proof spans pilots, collections, and scale-up agreements rather than a single comparable customer cohort.
    claimRefs:
      - CU004
      - CU005
      - CU006
  - calloutType: risk
    title: Durability remains the central customer diligence gap
    body: No assigned source discloses NRR, GRR, churn, renewal, contract length, customer-level revenue, or top-customer concentration, so public adoption breadth cannot yet be translated into durable recurring economics.
    claimRefs:
      - CU010
      - CU011

