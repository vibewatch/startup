  - id: TV003
    title: Bull, base, and bear scenarios
    columns:
      - Case
      - Assumptions
      - Valuation / return logic
      - Probability signal
      - Downside trigger
    rows:
      - - Bull
        - Sustained transaction and revenue growth; repeat usage and margins validate; exit window reopens.
        - A premium could be supportable only against verified current revenue, cash flow, and comparable multiples.
        - Positive operating scale and pre-filing growth; probability not quantified.
        - Growth decelerates without improving cash conversion.
      - - Base
        - Growth continues, but liquidity takes longer and preference terms remain material.
        - Apply liquidity, governance, and information discounts to any independently priced round.
        - IPO withdrawal and missing current valuation keep this as the decision anchor; probability not quantified.
        - A new round prices below the last independently verified mark or adds senior preferences.
      - - Bear
        - >-
          Multiple compression, promotion pressure, weak retention, or margin leakage coincides with a closed exit
          market.
        - Underwrite downside from the fully diluted preference waterfall, not from headline funding totals.
        - >-
          Promotion monitors show visible discounting and weaker live deal signals than Viator; these are directional
          only.
        - Cohort deterioration, negative cash conversion, or a financing with punitive terms.
    notes: >-
      No numerical probabilities, target returns, or valuation ranges are assigned because current price, fully diluted
      ownership, preference terms, margins, and cash flow are unavailable.
    claimRefs:
