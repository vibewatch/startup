  - id: FV001
    title: Recommendation logic from operating proof to entry discipline
    type: flow
    summary: >-
      Operating scale supports continued diligence, while failed price discovery and missing security terms stop the
      chain short of a buy recommendation.
    data:
      nodes:
        - id: scale
          label: Scale proof
          detail: $541M LTM revenue, ~11M annual transacting users, and 54M 2024 experiences reported.
        - id: growth
          label: Growth proof
          detail: 2023-2024 transaction value and revenue increased.
        - id: capital
          label: Capital access
          detail: $1.03B of reported cumulative funding, but no current post-money value.
        - id: liquidity
          label: Liquidity setback
          detail: The estimated $400M U.S. IPO was withdrawn.
        - id: terms
          label: Terms gap
          detail: Current price, dilution, preferences, margins, and cash conversion are unavailable.
        - id: decision
          label: Research more / track
          detail: Proceed only after price and downside rights can be underwritten.
      edges:
        - from: scale
          to: growth
        - from: growth
          to: capital
        - from: capital
          to: liquidity
        - from: liquidity
          to: terms
        - from: terms
          to: decision
    approximationNotes: >-
      Amounts are source-reported and rounded as displayed; the flow is decision logic, not a quantitative valuation
      model.
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV007
      - CV008
      - CV011
      - CV016
