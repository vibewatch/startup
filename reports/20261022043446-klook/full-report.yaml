  - id: FP001
    title: Evidence-backed competitive positioning
    type: quadrant
    summary: >-
      Klook's observed position is strong on regional breadth and partner access but remains exposed on independently
      verified scale and switching-cost durability.
    data:
      xAxis:
        label: Independent evidence of scale and economics
        min: 0
        max: 5
