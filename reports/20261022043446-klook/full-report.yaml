            tableRef: TO002
            claimRefs:
              - CO002
              - CO005
              - CO006
      - number: '1.3'
        title: Funding, operating scale and IPO status
        blocks:
          - type: paragraph
            body: >-
              Klook reached unicorn status in 2018 after a reported $200 million round that valued it above $1 billion;
              the assigned sources also describe a $210 million Series E+ round in December 2023 and additional banking
              facilities. The strongest current operating snapshot is Renaissance Capital’s report that Klook booked
              $541 million of revenue in the twelve months ended September 30, 2025, with roughly 310,000 offerings,
              about 4,200 destinations, approximately 11 million annual transacting users, and 54 million experiences
              booked in 2024. Those figures are attributed to an IPO-related company filing context, not independently
              audited in the retained text. Klook’s planned NYSE listing under KLK was withdrawn in October 2026 after a
              November 2025 filing, so any current valuation, proceeds or public-market capitalization remains
              unavailable rather than a confirmed $4 billion outcome.
            claimRefs:
              - CO008
              - CO009
              - CO010
              - CO011
              - CO012
          - type: table
            tableRef: TO003
            claimRefs:
              - CO008
              - CO009
              - CO013
              - CO014
              - CO016
      - number: '1.4'
        title: Milestones, resilience and unresolved diligence
        blocks:
          - type: paragraph
            body: >-
              Klook’s documented trajectory runs from its 2014 Hong Kong founding through a 2017 Series B, 2018 unicorn
              milestone, a 2020 shift toward domestic travel and staycations, a 2022 Tiqets partnership, a 2023 Series
              E+ financing and reported mid-2023 cash-flow positivity, followed by the 2025 IPO filing and 2026
              withdrawal. The pandemic-era domestic pivot and expansion into mobility show strategic adaptation, while
              the withdrawal is an adverse capital-markets signal that should not be confused with operating failure.
              The public record supplied for this chapter does not establish current headcount, total lifetime funding
              on a consistent basis, current valuation, customer retention, merchant concentration, board governance or
              steady-state margins. These are material gaps for investment judgment.
