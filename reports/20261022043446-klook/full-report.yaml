chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              Klook Travel Technology Ltd is a private Hong Kong travel-technology company founded in September 2014 by
              Ethan Lin and Eric Gnock Fah. Public descriptions consistently position it as a marketplace rather than an
              operator of every listed experience: the platform connects travelers with local merchants and sells
              reservations or tickets for tours, attractions, public transport, accommodation, hotels, car rentals and
              related services. The company’s official site presents the customer-facing scope as “Experiences,
              transport & more,” while independent descriptions emphasize the platform’s particularly deep Asia
              coverage. This model gives Klook breadth without requiring it to own the underlying attractions, but it
              also leaves service quality, refunds and delivery partly dependent on third-party operators.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO008
              - CO010
              - CO011
              - CO012
              - CO017
      - number: '1.2'
        title: Leadership, governance and key-person exposure
        blocks:
          - type: paragraph
            body: >-
              The retained public sources identify Ethan Lin as co-founder, chairman and chief executive officer and
              Eric Gnock Fah as co-founder, president and chief operating officer. That pairing covers executive
              leadership and operations, but the assigned pool does not provide a current board roster,
              independent-director profile, succession plan, or evidence on the depth of the executive bench. The
              continued prominence of both founders in public company descriptions suggests meaningful key-person
              exposure, although the available evidence cannot quantify dependence or establish whether governance
              changed during the withdrawn IPO process. A diligence review should therefore request the current board,
              committee structure, executive org chart and founder-equity arrangements rather than infer them.
            claimRefs:
              - CO005
              - CO006
