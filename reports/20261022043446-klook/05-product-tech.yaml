    title: Product module and operating-layer matrix
    columns: [Module or layer, User or owner, Status or maturity, Differentiation, Diligence gap]
    rows:
      - ["Activities, tours and attractions", "Travelers and merchants", "Core bookable marketplace category described in current product material", "Standardizes fragmented inventory into searchable offers", "Independent evidence on coverage quality and fulfillment consistency"]
      - ["Transport and mobility products", "Travelers and transport suppliers", "Adjacent category described in the assigned evidence", "Reuses discovery and booking infrastructure around the trip", "Product-level adoption and unit economics by category"]
      - ["Traveler transaction layer", "Travelers and Klook", "Operating capability described across checkout to voucher or refund", "Converts selected inventory into a confirmed digital entitlement", "Independent reliability and payment-performance data"]
      - ["Merchant infrastructure", "Merchants and distributors", "Portal and connectivity layer described in source material", "Keeps inventory, capacity and reservations manageable", "API documentation, integration uptime and merchant data-quality metrics"]
      - ["Partner and affiliate distribution", "Partners and distributors", "Channel described as active in analysis sources", "Extends reach beyond direct web and app traffic", "Incremental conversion, economics and channel dependence"]
    notes: >-
      Rows synthesize assigned-source descriptions of operating roles; maturity is
      descriptive, not an audited product roadmap. Null or unavailable technical
      performance measures are intentionally stated as diligence gaps.
    claimRefs: [CE001, CE005, CE009, CE010]
  - id: TE002
    title: Workflow and use-case table
    columns: [User job, Current workflow, Klook solution, Measurable benefit, Limitation]
    rows:
      - ["Find an in-destination experience", "Browse activities, attractions or tours", "Searchable product content with availability and booking conditions", "Reduces offline discovery friction", "Coverage and ranking quality are not independently measured"]
      - ["Select a usable date and quantity", "Compare package details and timing", "Presents product terms and selectable booking inputs", "Makes a fragmented offer transactable", "Merchant inventory accuracy remains a dependency"]
      - ["Pay and receive proof of purchase", "Complete checkout and await confirmation", "Records payment and issues a voucher or booking record", "Creates a digital redemption entitlement", "Confirmation timing varies by product"]
      - ["Redeem the booked service", "Present the voucher or booking record to the operator", "Coordinates post-booking instructions and support", "Connects traveler and merchant at fulfillment", "Merchant must honor capacity and service terms"]
      - ["Manage exceptions", "Cancel, refund or resolve disruption", "Provides product-specific support and refund handling", "Preserves a booking state after changes", "Eligibility and remedies remain product-specific"]
    notes: >-
      The table describes one representative booking flow, not every Klook product.
      Benefits are workflow implications of the cited process; no conversion or
      reliability rate is inferred.
    claimRefs: [CE002, CE003, CE004, CE007]
  - id: TE003
    title: Technology and operating architecture table
    columns: [Layer or process, Role, Dependency, Risk, Evidence status]
    rows:
      - ["Merchant supply", "Provides inventory, rates, capacity and conditions", "Stale or inaccurate supply can create failed bookings", "Described in multiple assigned sources", "Inventory-quality metrics unavailable"]
      - ["Catalog and discovery", "Structures content and availability for traveler selection", "Search, content and localization systems", "Unverified ranking quality and completeness", "Operating role supported; implementation undisclosed"]
      - ["Checkout and payments", "Captures transaction and creates booking state", "Payment processors and data-processing infrastructure", "Processing interruption or payment failure", "Platform function described; redundancy limitation disclosed"]
      - ["Confirmation and voucher", "Issues booking record or redemption proof", "Merchant confirmation and connected supplier systems", "Delayed confirmation or unusable voucher", "Workflow described; service-level data unavailable"]
      - ["Support, refunds and disruption handling", "Manages post-booking changes and customer communication", "Merchant policies and support operations", "Product-specific terms can limit remedies", "Process described; outcome data unavailable"]
      - ["Merchant portal and connectivity", "Lets suppliers manage activities and reservations", "Supplier systems and API or SaaS connectivity", "Integration errors and inconsistent updates", "Connectivity described; API metrics unavailable"]
    notes: >-
      Architecture layers are an analytical synthesis of source-described roles, not
      a disclosed software bill of materials. Technical controls, certifications,
      incident rates and redundancy scope are not publicly evidenced in the assigned
      pool.
    claimRefs: [CE005, CE006, CE007, CE008]
figures:
  - id: FE001
    title: Klook product architecture map
    type: stack
    summary: Klook coordinates merchant-supplied inventory through a traveler transaction layer while external operators remain responsible for much of service fulfillment.
    data:
      layers:
        - label: Traveler outcome
          detail: The traveler receives a usable booking record or voucher for redemption.
          items:
            - label: Confirmed booking
              detail: Voucher or booking record is redeemed with the responsible service provider.
        - label: Transaction layer
          detail: The platform coordinates discovery, checkout, payment, confirmation and support.
          items:
            - label: Discovery and selection
              detail: Product content, timing, availability and booking conditions are presented to travelers.
            - label: Checkout and payment
              detail: Payment and order state are coordinated through the platform.
            - label: Confirmation and support
              detail: Confirmation, voucher delivery, refunds and post-booking communication are supported.
            - label: Booking state
              detail: Payment, confirmation and exception status are maintained across the transaction.
        - label: Merchant infrastructure
          detail: Supplier tools and connectivity keep inventory and reservations manageable.
          items:
            - label: Inventory and reservations
              detail: Suppliers manage activities, capacity and reservations through merchant tooling or connectivity.
            - label: Supplier systems
              detail: External systems provide availability, booking status and fulfillment conditions.
            - label: Partner connectivity
              detail: Portal or API-style connections pass inventory and reservation updates between parties.
        - label: Distribution channels
          detail: Direct web and app distribution can be supplemented by partners and affiliate channels.
          items:
            - label: Partner distribution
              detail: External channels can expose Klook inventory to additional traveler audiences.
        - label: Operating controls
          detail: Booking support, refunds and disruption handling provide operational continuity around transactions.
          items:
            - label: Exception handling
              detail: Product-specific cancellation, refund and support processes manage changes after purchase.
        - label: External service capacity
          detail: Merchants operate and staff the underlying attractions, tours and transport.
          items:
            - label: Attractions, tours and transport
              detail: Merchants generally operate and staff the underlying real-world service.
    claimRefs: [CE001, CE005, CE007]
callouts:
  - calloutType: insight
    title: The product boundary is the key risk-control question
    body: Klook controls the digital booking record and support workflow, but merchant execution remains critical to the traveler's realized outcome; diligence should therefore test the handoff between platform state and physical fulfillment.
    claimRefs: [CE003, CE007]
  - calloutType: risk
    title: Technical maturity is only partly observable
    body: The assigned evidence describes platform functions and a redundancy limitation, but does not establish security certification, incident history, API performance or independently verified service levels.
    claimRefs: [CE008, CE012]
