      diligencePath: "Request current security-control inventory, certifications, independent assurance reports, incident register, privacy impact assessments, API documentation, release metadata and integration-partner references from management."
      relatedQuestionRefs: [QE007, QE008]
    - type: missing-source
      severity: material
      topic: reliability
      missingEvidence: "API, payment, confirmation and voucher-delivery uptime and failure-rate data by product category and geography."
      whyItMatters: "A marketplace can scale transaction volume while still exposing travelers and merchants to failed or delayed fulfillment."
