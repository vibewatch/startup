evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: Current board roster, committee structure, executive bench and founder succession arrangements.
    whyItMatters: Founder concentration and governance quality affect execution resilience, control rights and key-person risk.
    diligencePath: >-
      Request the latest board materials, organizational chart, committee charters and succession documentation under
      NDA.
    relatedQuestionRefs:
      - QO002
      - QO006
      - QO007
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: valuation
    missingEvidence: Current valuation, cap table, liquidation preferences, ratchets, secondary transactions and debt terms.
    whyItMatters: A withdrawn IPO removes a public price signal and leaves investor economics and downside protection unknown.
    diligencePath: Obtain the latest capitalization table, financing agreements, investor-rights schedules and lender facilities.
    relatedQuestionRefs:
      - QO003
      - QO007
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: profitability
    missingEvidence: Current headcount, gross margin, operating margin, cash balance and cash-flow conversion detail.
    whyItMatters: Revenue and reported cash-flow positivity do not establish steady-state profitability or runway.
    diligencePath: Request monthly management accounts, cash-flow bridge, unit economics and a current headcount schedule.
    relatedQuestionRefs:
      - QO004
      - QO008
  - type: conflicting-data
    severity: minor
    topic: scale
    missingEvidence: A reconciled current definition of offerings, destinations, users and booked experiences.
    whyItMatters: Marketplace counts can change by period and denominator; inconsistent definitions can distort scale comparisons.
    diligencePath: Reconcile the IPO filing definitions to current internal KPI reporting and cancellation treatment.
    relatedQuestionRefs:
      - QO004
  - type: missing-source
    severity: material
    topic: market-size
    missingEvidence: >-
      Numeric global experience-market values, channel shares and geography definitions from the Statista series or
      another accessible independent dataset.
    whyItMatters: Without exposed values and definitions, a broad market estimate cannot be translated into a comparable TAM or SAM.
    diligencePath: >-
      Obtain the underlying Statista tables or commission an independent market study with explicit traveler-origin,
      channel and category definitions.
    relatedQuestionRefs:
      - QM003
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: sizing-gap
    missingEvidence: Klook transaction volume, take rate, repeat purchase, supplier retention and category mix by geography.
    whyItMatters: >-
      These metrics determine how much of the category opportunity is monetizable by Klook and whether growth can
      convert to durable economics.
    diligencePath: >-
      Request cohort, merchant, category and geography cuts under NDA and reconcile them to audited revenue and gross
      transaction value.
    relatedQuestionRefs:
      - QM003
      - QM005
      - QM008
  - type: conflicting-data
    severity: minor
    topic: valuation-context
    missingEvidence: A current, independent reconciliation of market-share, IPO and valuation references in the assigned pool.
    whyItMatters: >-
      One assigned article contains unsupported forward-looking IPO and valuation language that should not be used as
      market size or valuation evidence.
    diligencePath: >-
      Use a current filing, regulator record or high-reputation financial reporting to reconcile listing status and any
      valuation before relying on those figures.
    relatedQuestionRefs:
      - QM007
      - QM008
  - type: private-evidence-only
    severity: material
    topic: economics
    missingEvidence: >-
      Comparable Klook, Viator, and direct-channel take rates, repeat purchase rates, contribution margins, and customer
      acquisition costs.
    whyItMatters: >-
      Without comparable economics, observed promotion activity cannot be translated into durable pricing power or moat
      strength.
    diligencePath: >-
      Request cohort economics, realized take-rate bridges, promotion funding split, and competitor-benchmarked CAC and
      contribution margin data.
    relatedQuestionRefs:
      - QP005
      - QP008
    relatedTableRefs:
      - TP003
  - type: enumeration-incomplete
    severity: material
    topic: competitor-landscape
    missingEvidence: >-
      A complete current inventory of likely entrants, social-commerce booking flows, internal-build alternatives, and
      geographic competitor coverage.
    whyItMatters: The assigned pool supports a useful landscape but cannot prove exhaustive competitor coverage or entrant threat.
    diligencePath: >-
      Commission a geography-by-geography competitor scan using current product, pricing, traffic, supplier, and
      procurement evidence.
    relatedQuestionRefs:
      - QP001
      - QP008
    relatedTableRefs:
      - TP001
  - type: stale
    severity: minor
    topic: partnerships
    missingEvidence: Current status, economics, and renewal terms for the Grab and Tiqets relationships.
    whyItMatters: Historical partnership evidence may not describe current distribution power or dependency.
    diligencePath: >-
      Obtain current partner contracts, active-market coverage, booking share, renewal status, and termination
      provisions.
    relatedQuestionRefs:
      - QP007
    relatedTableRefs:
      - TP002
  - type: missing-source
    severity: blocking
    topic: unit-economics
    missingEvidence: >-
      Audited or filing-level take rate, gross margin, CAC, payback, repeat purchase, and contribution-profit data by
      category and geography.
    whyItMatters: >-
      Booking scale and reported revenue do not establish revenue quality, margin durability, or scalable customer
      acquisition.
    diligencePath: Request management's monthly cohort and category economics pack, reconciled to audited financial statements.
    relatedQuestionRefs:
      - QI004
      - QI005
      - QI008
      - QI009
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: blocking
    topic: capital-adequacy
    missingEvidence: >-
      Current cash, monthly burn, runway, debt/project-finance obligations, liquidity covenants, and financing plan
      after IPO withdrawal.
    whyItMatters: >-
      The withdrawn listing removes a planned capital-raising route, so liquidity and financing dependency cannot be
      assessed from revenue alone.
    diligencePath: Obtain the latest balance sheet, cash-flow forecast, debt schedule, and board-approved financing plan.
    relatedQuestionRefs:
      - QI006
      - QI007
      - QI009
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: revenue-recognition
    missingEvidence: >-
      Revenue-recognition policy and a reconciliation among bookings, GMV, supplier settlements, refunds, and reported
      revenue.
    whyItMatters: Marketplace gross-versus-net presentation can materially change apparent revenue scale and comparability.
    diligencePath: Review the withdrawn prospectus, auditor notes, and a sample of supplier and customer settlement flows.
    relatedQuestionRefs:
      - QI001
      - QI003
      - QI008
    relatedTableRefs:
      - TI001
  - type: missing-source
    severity: material
    topic: technical-diligence
    missingEvidence: >-
      Public security certifications, penetration-test summaries, privacy controls, incident history, and a developer or
      practitioner signal covering the traveler and merchant platforms.
    whyItMatters: >-
      Trust, regulatory exposure, engineering maturity and enterprise adoption depend on controls and operating signals
      that are not established by the assigned product descriptions.
    diligencePath: >-
      Request current security-control inventory, certifications, independent assurance reports, incident register,
      privacy impact assessments, API documentation, release metadata and integration-partner references from
      management.
    relatedQuestionRefs:
      - QE007
      - QE008
  - type: missing-source
    severity: material
    topic: reliability
    missingEvidence: API, payment, confirmation and voucher-delivery uptime and failure-rate data by product category and geography.
    whyItMatters: >-
      A marketplace can scale transaction volume while still exposing travelers and merchants to failed or delayed
      fulfillment.
    diligencePath: >-
      Obtain 24-month service-level dashboards, incident postmortems, redundancy architecture and merchant integration
      error logs.
    relatedQuestionRefs:
      - QE005
      - QE008
  - type: missing-source
    severity: minor
    topic: ai-roadmap
    missingEvidence: Technical documentation and measured outcomes for AI recommendations, pricing or merchant-operations features.
    whyItMatters: AI references are currently directional claims and do not demonstrate a durable product advantage.
    diligencePath: >-
      Request model-use cases, evaluation metrics, deployment dates, human oversight and incremental conversion or
      support results.
    relatedQuestionRefs:
      - QE005
      - QE006
  - type: private-evidence-only
    severity: material
    topic: merchant-infrastructure
    missingEvidence: Merchant-side data quality, integration coverage, cancellation rates and supplier adherence distributions.
    whyItMatters: External fulfillment is a core dependency and can determine whether the digital booking promise is realized.
    diligencePath: >-
      Request merchant cohort quality reports, cancellation and failure distributions, integration coverage and
      remediation SLAs.
    relatedQuestionRefs:
      - QE004
      - QE005
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: >-
      Monthly cohort tables showing active users, repeat purchase frequency, gross retention, net retention, churn,
      cancellations, and renewal behavior by market and product line.
    whyItMatters: Reach and inventory breadth do not establish durable customer value or recurring economics.
    diligencePath: >-
      Request 24-month cohort extracts and reconcile active-account, order, cancellation, and repeat-purchase
      definitions to booking and revenue ledgers.
    relatedQuestionRefs:
      - QU004
      - QU008
    relatedTableRefs:
      - TU002
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: >-
      A complete list of named enterprise, merchant, and destination relationships with production-versus-pilot status
      and measured outcomes.
    whyItMatters: >-
      Public case studies establish platform capability but not the breadth, quality, or durability of customer
      deployments.
    diligencePath: >-
      Obtain a customer-reference schedule segmented by traveler, merchant, B2B, and channel partner, with contract
      status and outcome metrics.
    relatedQuestionRefs:
      - QU003
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: concentration
    missingEvidence: >-
      Top-customer, top-merchant, and channel concentration by gross bookings, net revenue, margin, and transaction
      volume.
    whyItMatters: A broad marketplace can still depend on a small number of suppliers, channels, or enterprise relationships.
    diligencePath: >-
      Request quarterly concentration tables for the last eight quarters, including thresholds, related parties, and
      churned accounts.
    relatedQuestionRefs:
      - QU006
    relatedTableRefs:
      - TU001
  - type: missing-source
    severity: material
    topic: legal-security
    missingEvidence: >-
      Current regulator, court, privacy, security-certification, breach, and incident records covering Klook's material
      operating jurisdictions.
    whyItMatters: The assigned sources cannot distinguish a clean legal and security posture from an undiscovered or private issue.
    diligencePath: >-
      Request current legal register, regulator correspondence, SOC/ISO or equivalent certifications, penetration-test
      summary, DPA inventory, and incident log from management.
    relatedQuestionRefs:
      - QR004
    relatedTableRefs:
      - TR002
  - type: private-evidence-only
    severity: material
    topic: operating-metrics
    missingEvidence: >-
      Supplier concentration, cancellation/refund rates, cohort retention, merchant churn, fraud losses, and
      channel-level contribution margin.
    whyItMatters: These metrics determine whether curation and scale translate into durable contribution economics.
    diligencePath: >-
      Obtain monthly cohort and supplier-quality datasets with denominators, geography, product category, channel, and
      reconciliation to management accounts.
    relatedQuestionRefs:
      - QR002
      - QR003
      - QR005
      - QR007
  - type: stale
    severity: material
    topic: financing
    missingEvidence: Post-withdrawal financing plan, cash runway, audited 2025/2026 metrics, and current cap-table or preference terms.
    whyItMatters: >-
      The IPO withdrawal changes liquidity timing, but the assigned sources do not establish available cash or financing
      alternatives.
    diligencePath: >-
      Request the latest board-approved plan, cash and debt schedule, audited financial statements, cap table, and any
      revised listing or secondary-liquidity timetable.
    relatedQuestionRefs:
      - QR006
      - QR008
  - type: private-evidence-only
    severity: material
    topic: valuation-gap
    missingEvidence: >-
      Current fully diluted cap table, security price, liquidation preferences, participation, ratchets, option
      dilution, debt priority, and recent secondary marks.
    whyItMatters: >-
      Without the ownership and preference waterfall, headline enterprise or equity values cannot be translated into
      investor proceeds or downside.
    diligencePath: >-
      Obtain the signed financing documents, capitalization ledger, debt schedule, option register, and board-approved
      secondary transactions; model proceeds across exit values.
    relatedQuestionRefs:
      - QV007
      - QV008
    relatedTableRefs:
      - TV001
      - TV002
      - TV003
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Audited contribution margin, cash conversion, customer-acquisition payback, cohort retention, repeat purchase
      frequency, refunds, and merchant concentration by market.
    whyItMatters: >-
      Gross transaction value and revenue growth do not establish durable free cash flow or the multiple that the
      business deserves.
    diligencePath: >-
      Reconcile audited financials to monthly cohort and market-level unit economics, then test take-rate and margin
      sensitivity under promotion and supplier-pressure cases.
    relatedQuestionRefs:
      - QV001
      - QV003
      - QV007
    relatedTableRefs:
      - TV001
      - TV003
  - type: missing-source
    severity: material
    topic: comparable-valuation
    missingEvidence: >-
      Contemporaneous enterprise-value, revenue, EBITDA, growth, and margin data for genuinely comparable public
      companies, private rounds, and travel-experiences transactions.
    whyItMatters: >-
      Business-model descriptions and promotion comparisons are not independent valuation benchmarks and cannot support
      a fair-value range.
    diligencePath: >-
      Build a date-matched comparable set from public filings and signed transaction materials, normalize accounting
      periods and net cash, and apply discounts for liquidity and security seniority.
