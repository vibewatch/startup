  evidenceGaps:
    - type: missing-source
      severity: material
      topic: market-size
      missingEvidence: "Numeric global experience-market values, channel shares and geography definitions from the Statista series or another accessible independent dataset."
      whyItMatters: "Without exposed values and definitions, a broad market estimate cannot be translated into a comparable TAM or SAM."
      diligencePath: "Obtain the underlying Statista tables or commission an independent market study with explicit traveler-origin, channel and category definitions."
      relatedQuestionRefs: [QM003]
      relatedTableRefs: [TM002]
    - type: private-evidence-only
      severity: material
      topic: sizing-gap
      missingEvidence: "Klook transaction volume, take rate, repeat purchase, supplier retention and category mix by geography."
      whyItMatters: "These metrics determine how much of the category opportunity is monetizable by Klook and whether growth can convert to durable economics."
      diligencePath: "Request cohort, merchant, category and geography cuts under NDA and reconcile them to audited revenue and gross transaction value."
      relatedQuestionRefs: [QM003, QM005, QM008]
    - type: conflicting-data
      severity: minor
      topic: valuation-context
      missingEvidence: "A current, independent reconciliation of market-share, IPO and valuation references in the assigned pool."
      whyItMatters: "One assigned article contains unsupported forward-looking IPO and valuation language that should not be used as market size or valuation evidence."
      diligencePath: "Use a current filing, regulator record or high-reputation financial reporting to reconcile listing status and any valuation before relying on those figures."
      relatedQuestionRefs: [QM007, QM008]
