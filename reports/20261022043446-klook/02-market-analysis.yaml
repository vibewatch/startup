      - [Fortune, "2026; three-year comparison", Global with APAC emphasis, "80% of customers in APAC; non-Asia GTV +13.4% over three years; less than 1% global experiences market", "Reported interview and company disclosures", medium, "Different denominators; no Klook SAM or margin bridge"]
      - [ContentGrip, "2026 survey", Global; APAC comparisons, "88% maintain/increase budgets; 91% use AI planning; two-thirds plan multiple destinations", "Report summary and survey percentages", medium, "Secondary coverage of Klook Travel Pulse; not bookings"]
      - [Klook-Mastercard release, 2026, Asia-Pacific, "47% seek deals; 42% book earlier; 73% willing to visit lesser-known city for unique event", "Company/partner press release citing Travel Pulse", low, "Company-controlled release; no incremental volume"]
    notes: "Values are retained with their original population and denominator language; the rows are alternative lenses, not a sum and not a TAM/SAM/SOM waterfall."
    claimRefs: [CM003, CM005, CM006, CM007, CM008, CM010]
  - id: TM003
    title: Segment and buyer map
    columns: [Segment, Buyer, User, Payer, Workflow, Budget owner, Adoption trigger]
    rows:
      - [Independent travelers, Traveler, Traveler, Traveler, Discover activity; compare value; book digitally, Individual travel budget, Specific activity; social inspiration; convenience]
      - [Millennial and Gen Z travelers, Traveler, Traveler, Traveler, Mobile-first research and itinerary planning, Individual or household travel budget, Experience-led value and AI-assisted planning]
      - [Local operators and attractions, Merchant/supplier, Staff and travelers, Operator, Digitize inventory; receive demand; confirm bookings, Marketing or distribution budget, Reach; payments; less manual handling]
      - [Destination and channel partners, Partner, Cardholder or traveler, Partner plus traveler, Bundle benefits and route demand, Partnership or loyalty budget, Discounts; trusted payments; regional distribution]
    notes: "The map is a workflow hypothesis supported by the cited platform descriptions and partnership evidence; Klook-specific budget ownership, CAC and supplier retention are not disclosed in the assigned sources."
    claimRefs: [CM009, CM010, CM011, CM012]
