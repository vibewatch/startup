  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: "Monthly cohort tables showing active users, repeat purchase frequency, gross retention, net retention, churn, cancellations, and renewal behavior by market and product line."
    whyItMatters: "Reach and inventory breadth do not establish durable customer value or recurring economics."
    diligencePath: "Request 24-month cohort extracts and reconcile active-account, order, cancellation, and repeat-purchase definitions to booking and revenue ledgers."
    relatedQuestionRefs: [QU004, QU008]
    relatedTableRefs: [TU002]
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: "A complete list of named enterprise, merchant, and destination relationships with production-versus-pilot status and measured outcomes."
    whyItMatters: "Public case studies establish platform capability but not the breadth, quality, or durability of customer deployments."
    diligencePath: "Obtain a customer-reference schedule segmented by traveler, merchant, B2B, and channel partner, with contract status and outcome metrics."
    relatedQuestionRefs: [QU003]
    relatedTableRefs: [TU003]
  - type: private-evidence-only
    severity: material
    topic: concentration
    missingEvidence: "Top-customer, top-merchant, and channel concentration by gross bookings, net revenue, margin, and transaction volume."
    whyItMatters: "A broad marketplace can still depend on a small number of suppliers, channels, or enterprise relationships."
    diligencePath: "Request quarterly concentration tables for the last eight quarters, including thresholds, related parties, and churned accounts."
    relatedQuestionRefs: [QU006]
    relatedTableRefs: [TU001]
