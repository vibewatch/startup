    rows:
      - [Klook, Direct experience marketplace, "Approximately 310,000 offerings across approximately 4,200 destinations; figures reported in IPO coverage", "Travelers booking activities, transport, attractions, and selected stays", "Pan-regional supply and localized booking/payment execution", "Retention, supplier exclusivity, and realized economics are not disclosed in assigned evidence"]
      - [Viator, Direct experience marketplace, "126 monitored promotion signals versus Klook's 2 in one October 22, 2026 comparison snapshot", "Travelers seeking reviewed tours, activities, and flexible-cancellation options", "Broad experience marketplace and link-applied promotions", "Snapshot is not a market-share or product-quality benchmark"]
      - [Expedia and Booking, Incumbent OTA ecosystems, null, "Travelers already transacting inside lodging and broader trip flows", "Distribution, loyalty, and cross-sell potential", "Assigned sources do not quantify activity inventory, pricing, or conversion"]
      - [Trip.com, Regional incumbent / adjacent, null, "Travelers using China-linked travel distribution and domestic inventory", "Regional distribution and local ecosystem access", "Assigned evidence does not establish comparative share or economics"]
      - ["Direct operator, hotel, attraction, or offline purchase", Substitute / status quo, null, "Travelers willing to source and transact directly", "Potentially direct relationship and fewer intermediary layers", "Less standardized discovery, support, and cross-category comparison"]
    notes: "Scale values are retained only where assigned sources state them; null means the pool did not provide a comparable public figure. Competitor categories and limitations are analytical classifications, not vendor claims."
    claimRefs: [CP001, CP002, CP003, CP004, CP016]
  - id: TP002
    title: Capability and buyer-tradeoff matrix
    columns: [Buying criterion, Klook, Viator, Broad OTAs, Direct operator, Evidence implication]
    rows:
      - [Asian localization and regional payments, "Supported in assigned narrative; exact coverage not quantified", "Not quantified in assigned evidence", "Not quantified in assigned evidence", "Varies by operator", "Potential Klook advantage, but not independently benchmarked"]
      - [Experience breadth and discovery, "Tours, attractions, transport, accommodation, and eSIMs are described", "Tours, activities, and skip-the-line tickets are described", "Activities can be cross-sold with broader trips; not quantified", "Single-operator or fragmented discovery", "Klook and Viator are direct substitutes for the core booking job"]
      - [Distribution partnerships, "Grab inventory integration and Tiqets partnership are reported", null, "Large OTA distribution is a structural possibility, not quantified here", "Own channels", "Partner reach can lower acquisition friction but may increase channel dependence"]
      - [Promotion mechanics, "Codes and reduced-price activity pages observed", "Link-applied offers; 126 monitored signals in one snapshot", null, "Operator-specific", "Promotion intensity is visible, but net price and margin are unknown"]
      - [Trust and support, "Booking-page chat and product-specific confirmation/refund rules", "Flexible cancellation is described by a monitor, not independently verified", "Varies by brand and booking", "Direct accountability but uneven digital support", "Operational trust is a material switching and conversion factor"]
    notes: "Cells marked null are unsupported by the assigned pool and should not be interpreted as absence. The matrix compares buyer-relevant capabilities, not audited service-level performance."
    claimRefs: [CP006, CP007, CP008, CP009, CP010, CP011, CP012]
  - id: TP003
    title: Pricing, packaging, and switching signals
    columns: [Signal, Klook evidence, Comparator evidence, What it may imply, Underwriting limitation]
    rows:
      - [Published discounting, "Offers.com listed 5% sitewide, 25% Japan hotels, 10% order, $5 off $50, and other offers on October 22, 2026", "Viator had the only published percentage discount in the monitor at 73%", "Promotions are an active demand lever", "Promotional value is not realized revenue, take rate, or gross margin"]
      - [Promotion signal volume, "2 active signals in the monitor", "126 active signals for Viator in the same monitor", "Klook's visible promotion cadence was lower in that snapshot", "Monitor coverage and signal counts are not market share"]
      - [Supplier breadth, "Philippines awards span Play, Stay, and Move partners", null, "Multi-category supply can support cross-sell and local coverage", "Awards do not prove exclusivity, concentration, or partner retention"]
      - [Booking confirmation, "Instant-confirmation products: within 5 minutes; others: 24 to 48 hours, according to a third-party review of Klook FAQ", null, "Operational reliability affects trust and support load", "The review is not a service-level dataset"]
      - [Cancellation and credits, "Terms vary by activity; KlookCash exclusions are described", null, "Product-level policy complexity can raise comparison and support friction", "No assigned source quantifies refund rates or customer dissatisfaction"]
    notes: "Pricing rows preserve list or promotional observations and their periods; they are not normalized across geography, product, currency, or booking conditions. Null comparator cells indicate an evidence gap."
    claimRefs: [CP011, CP012, CP013, CP015]
figures:
  - id: FP001
    title: Evidence-backed competitive positioning
    type: quadrant
    summary: "Klook's observed position is strong on regional breadth and partner access but remains exposed on independently verified scale and switching-cost durability."
    data:
      xAxis:
        label: "Independent evidence of scale and economics"
        min: 0
        max: 5
      yAxis:
        label: "Regional breadth and partner access"
        min: 0
        max: 5
      points:
        - {label: Klook, x: 2, y: 5, note: "Broad category and partner evidence; scale and economics mostly company-reported or unverified", tone: "positive"}
        - {label: Viator, x: 3, y: 3, note: "Direct experience comparison and live promotion evidence; no assigned audited economics", tone: "neutral"}
        - {label: Broad OTAs, x: 2, y: 4, note: "Distribution and loyalty are structural observations, not quantified in this pool", tone: "neutral"}
        - {label: Trip.com, x: 2, y: 3, note: "Regional incumbent role is plausible, but assigned pool lacks comparative metrics", tone: "neutral"}
        - {label: Direct operators, x: 1, y: 2, note: "Direct relationship substitute; fragmented scope and support are not quantified", tone: "low"}
        - {label: Social discovery, x: 1, y: 3, note: "Potential discovery substitute; no assigned evidence quantifies booking conversion", tone: "low"}
    approximationNotes: "Ordinal scores are analyst judgments constrained by the assigned source pool, not market-share, revenue, or conversion measurements. Higher y indicates broader observed regional/category access; higher x indicates more independently usable scale/economic evidence."
    claimRefs: [CP001, CP006, CP016, CP017]
callouts:
  - calloutType: strength
    title: Localized supply is the clearest defensibility signal
    body: "Klook's assigned evidence supports a broad partner network across attractions, stays, and transport, plus regional distribution integrations; this is more concrete than an unverified claim of proprietary technology superiority."
    claimRefs: [CP006, CP016]
  - calloutType: risk
    title: Discount and distribution comparisons are snapshots
    body: "Observed promotion counts and listed coupons show active competition, but they do not establish net pricing, take rate, customer retention, or margin durability."
    claimRefs: [CP011, CP012, CP013]
  - calloutType: recommendation
    title: Underwrite retention and partner economics before assuming a moat
    body: "The next diligence step is to obtain cohort repeat rates, merchant concentration and churn, exclusivity terms, realized take rates, and comparable conversion or cancellation data against Viator and direct channels."
    claimRefs: [CP015, CP020]
