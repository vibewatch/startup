  topStrengths:
    - Broad regional marketplace coverage across experiences, attractions and transport.
    - Evidence of substantial revenue scale and continued institutional financing interest.
    - Localized supply and distribution relationships provide a concrete, if unquantified, differentiation signal.
  topRisks:
    - Current cap table, liquidation preferences and security rights are not publicly established.
    - Retention, merchant concentration, take-rate durability and steady-state margins remain under-disclosed.
    - The 2026 IPO withdrawal removes a near-term public-market liquidity and price-discovery path.
  unresolvedGaps:
    - Full cap table, liquidation preferences, ratchets and other equity-rights terms.
    - Cohort retention, repeat purchase frequency and merchant churn by geography and product line.
    - Top-merchant concentration, take-rate durability and supplier-quality distributions.
    - >-
      Security certifications, incident history and regulator correspondence sufficient to remove trust-related
      discount.
    - Steady-state profitability, margin durability and scenario-ready cash-flow conversion detail.
