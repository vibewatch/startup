    title: "California PAGA Labor Settlement and Clinician Reclassification"
    body: "Lyra Health's April 2026 PAGA settlement highlights ongoing structural friction in hybrid telehealth labor models. Future wage-and-hour or contractor reclassification claims threaten to elevate operating expenses, compress gross margins, and divert executive leadership attention from core commercial expansion."
    claimRefs:
      - "CR002"
      - "CR003"
  - calloutType: "recommendation"
    title: "Establish Rigorous Auditing for Cross-Border AI Mental Health Tools"
    body: "Given mounting international regulatory scrutiny across the EU, Canada, and the UK regarding automated healthcare decision-making, Lyra must maintain strict clinical-grade validation and transparent algorithmic audits for all AI triage and navigation tools before expanding into new foreign jurisdictions."
    claimRefs:
      - "CR004"
      - "CR005"
      - "CR009"
