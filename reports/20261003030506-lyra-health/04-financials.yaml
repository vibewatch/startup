callouts:
  - calloutType: "risk"
    title: "Downside Risk Exposure in Outcomes-Based Pricing Contracts"
    body: "Lyra's transition to outcomes-based pricing shifts clinical and operational execution risk onto its balance sheet. If member wait times lengthen, satisfaction drops, or clinical symptom improvements fail to meet contractual targets, Lyra is obligated to issue credits against care fees, creating revenue volatility and margin compression."
    claimRefs:
      - "CI002"
      - "CI003"
  - calloutType: "insight"
    title: "Margin Defense via Provider Rate Adjustments and AI Tooling"
    body: "Independent practitioner reports indicate Lyra has sought fee reductions of up to 20% from contracted 1099 clinicians while increasing caseload expectations to 30 clients per week and mandating AI documentation tools. These actions demonstrate active unit-cost management to preserve margins in an inflationary healthcare labor environment."
    claimRefs:
      - "CI005"
      - "CI006"
      - "CI007"
