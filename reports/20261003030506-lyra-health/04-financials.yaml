company:
  name: "Lyra Health"
chapter:
  number: 4
  title: "Financials"
  summary: "Lyra Health operates an enterprise B2B mental health platform historically anchored in per-employee-per-year (PEPY) access contracts and fee-for-service care delivery, while transitioning selectively to outcomes-based risk-sharing agreements. Although private estimates place annual revenue around $200M to $243M backed by over $910M in cumulative venture financing, core operating unit economics—including gross margins, clinical delivery costs, provider compensation pressure, and net cash burn—remain strictly confidential and represent major underwriting diligence gaps."
sections:
  - id: "revenue-streams-and-pricing"
    title: "Revenue Model and Outcomes-Based Pricing Mechanics"
    body: "Lyra Health generates commercial revenue primarily through enterprise B2B employer benefit contracts, historically monetized via per-employee-per-year (PEPY) administrative fees paired with session-based care delivery invoicing. In July 2025, Lyra announced a strategic evolution toward outcomes-based pricing, eliminating traditional fixed fees for adopting employers and tying commercial care fees directly to measurable clinical and financial benchmarks. Under this structure, Lyra covers program setup, management, and support, receiving baseline care fees for services delivered while earning bonus payments if one-year performance metrics—such as fast appointment access, high member satisfaction, clinical symptom improvement, and validated return on investment (ROI)—are achieved. Conversely, if agreed performance thresholds are missed, Lyra must issue fee credits back to the employer, shifting financial downside and performance risk onto the company's operating ledger. While this model aligns employer incentives, realized contract yields remain opaque, as list pricing, baseline session charges, and specific outcome-bonus formulas are negotiated on a custom client-by-client basis."
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI003"
      - "CI004"
    tableRefs:
      - "TI001"
      - "TI002"
    figureRefs:
      - "FI001"
  - id: "unit-economics-and-cost-structure"
    title: "Cost Structure, Clinical Delivery Economics, and Margin Drivers"
    body: "Lyra's cost of goods and service delivery structure is predominantly driven by provider compensation across its hybrid network of W-2 employed clinicians and 1099 independent contracted therapists, coaches, and psychiatrists. In recent years, clinician reports indicate that Lyra has implemented downward reimbursement pressure on contracted therapists, citing higher-than-average provider costs and adjusting referral volumes toward lower-cost providers and proprietary Blended Care formats. Operational changes reported by clinicians include increasing target caseload expectations from 24 to 30 clients per week, deploying mandatory AI-powered clinical documentation and note-taking tools, and conditioning continued referral volume on accepting fee reductions of up to 20%. These cost containment efforts reflect a deliberate effort to manage clinical service delivery expenses and defend gross margins against rising clinician wage demands. However, because Lyra does not publicly report GAAP financial results, exact gross margins, blended therapist labor costs per session, software gross margins, and member acquisition payback cycles remain unverified private metrics requiring targeted diligence."
    claimRefs:
      - "CI005"
      - "CI006"
      - "CI007"
      - "CI008"
    tableRefs:
      - "TI003"
  - id: "capital-adequacy-and-verdict"
    title: "Capital Adequacy, Financing Dependency, and Diligence Assessment"
    body: "Across nine institutional funding rounds through its Series F, Lyra Health has raised a total of $910M to $915M in equity capital, achieving a peak post-money valuation of approximately $5.58B to $5.9B following major rounds led by Dragoneer, Coatue, Addition, Greylock Partners, and IVP. Publicly available commercial firmographic models estimate Lyra's annual revenue at approximately $243M (with prior run-rate estimates around $200M), while tracking an organizational headcount of 1,000 to 5,000 personnel, led by clinical and medical staff. Nevertheless, forward underwriting faces severe visibility hurdles. Lyra has not executed a primary equity funding round since 2022, and its current cash reserves, monthly cash burn, and remaining operational runway are unconfirmed. With over 20 million covered lives and 13 million delivered sessions, Lyra maintains market leadership, but its heavy human clinical delivery component caps software-style operating leverage. Underwriters must obtain audited income statements, provider unit cost breakdowns, and client retention cohorts before validating valuation sustainability."
    claimRefs:
      - "CI009"
      - "CI010"
      - "CI011"
      - "CI012"
      - "CI013"
