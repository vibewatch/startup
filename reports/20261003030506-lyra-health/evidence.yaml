evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-reporting-gaps
    missingEvidence: >-
      Audited financial statements confirming exact annual recurring revenue (ARR), gross profit margin, operating cash
      burn, and cash runway post-Series F.
    whyItMatters: >-
      Without audited financial disclosures, Lyra's implied 20x+ revenue multiple and capital sustainability cannot be
      independently confirmed.
    diligencePath: >-
      Obtain confidential private placement memoranda, 409A valuation appraisals, or auditor-reviewed financial
      statements during formal investor diligence.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: board-governance
    missingEvidence: >-
      Comprehensive regulatory corporate roster detailing all current voting board seats, observer rights, and
      capitalization cap table percentages.
    whyItMatters: >-
      Determines economic voting control, protective provisions, and liquidation preference stacks between Series A
      through Series F investors.
    diligencePath: >-
      Inspect amended Articles of Incorporation and voting agreements filed with Delaware or California corporate
      authorities.
    relatedQuestionRefs:
      - QO002
      - QO003
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      A current independent estimate of employer-sponsored mental-health benefit spend segmented by geography, covered
      lives, and service category.
    whyItMatters: >-
      The available global technology estimate includes individual-consumer and provider categories and therefore cannot
      establish Lyra's SAM.
    diligencePath: >-
      Obtain a current buyer-side benefits benchmark or analyst dataset and reconcile its category boundary against
      Lyra's contracted services.
    relatedQuestionRefs:
      - QM009
  - type: private-evidence-only
    severity: material
    topic: obtainable-share
    missingEvidence: >-
      Lyra contract values, pricing units, eligible covered lives by channel, utilization, renewal, win-rate, and
      geographic revenue mix.
    whyItMatters: >-
      Without contract economics and conversion data, reported access pathways cannot be translated into revenue, market
      share, or obtainable market.
    diligencePath: >-
      Review management cohort data, customer contracts, renewal files, and invoiced revenue by employer, plan, product,
      and geography.
    relatedQuestionRefs:
      - QM010
  - type: missing-source
    severity: material
    topic: estimate-comparability
    missingEvidence: >-
      A second independent market estimate with a comparable employer-sponsored boundary, base year, geography, and
      methodology.
    whyItMatters: A single broad market forecast cannot establish estimate convergence or explain contradictory sizing assumptions.
    diligencePath: >-
      Commission or obtain a second market study and normalize both estimates to the same buyer, service, geography, and
      period.
    relatedQuestionRefs:
      - QM002
      - QM009
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: Audited balance sheet, current cash and equivalents balance, net burn rate, and debt facility covenants.
    whyItMatters: >-
      Without cash reserves and burn visibility, underwriters cannot determine whether Lyra requires near-term dilutive
      equity financing or debt restructuring to sustain operations.
    diligencePath: Request confidential management financial package and 24-month forward cash flow projections under NDA.
    relatedQuestionRefs:
      - QI007
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Audited GAAP income statements detailing gross profit, clinician provider compensation costs, and platform
      technology overhead.
    whyItMatters: >-
      Gross margin dictates whether Lyra should be underwritten as an asset-light software business or a lower-margin
      tech-enabled healthcare services provider.
    diligencePath: Obtain contribution margin reports by service line (therapy, coaching, psychiatry) and contract vintage.
    relatedQuestionRefs:
      - QI008
  - type: private-evidence-only
    severity: material
    topic: clinical-ai-safety
    missingEvidence: >-
      Independent clinical audit data detailing hallucination rates, error boundaries, and emergency escalation failure
      rates for the autonomous Lyra AI guide and documentation generators.
    whyItMatters: >-
      Direct member-facing conversational AI in behavioral health poses medical and legal liability risks if triage
      fails to detect acute crisis states or documentation misrepresents therapy sessions.
    diligencePath: >-
      Request Lyra's internal AI clinical evaluation metrics, adverse event audit logs, and provider documentation
      override frequency statistics under NDA.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE001
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: >-
      Audited multi-year Net Revenue Retention (NRR), Gross Revenue Retention (GRR), and enterprise logos renewal and
      churn percentages.
    whyItMatters: >-
      Without NRR and churn disclosures, evaluating customer contract durability and expansion efficiency is
      speculative.
    diligencePath: Request confidential customer cohort retention tables and historical renewal logs during sponsor diligence.
    relatedQuestionRefs:
      - QU007
  - type: missing-source
    severity: material
    topic: utilization-rates
    missingEvidence: Monthly active user (MAU) penetration rates and session frequency distributions across direct enterprise accounts.
    whyItMatters: >-
      Aggregate covered lives metrics (20M+) do not reveal how many employees actively engage with clinical care versus
      remaining passive beneficiaries.
    diligencePath: Obtain employer-specific engagement reports and utilization rate distributions by customer size band.
    relatedQuestionRefs:
      - QU008
  - type: enumeration-incomplete
    severity: minor
    topic: TU003
    missingEvidence: Comprehensive roster of all enterprise client accounts, ACV distributions, and contract renewal years.
    whyItMatters: >-
      Sample customer listings provide marquee brand validation but cannot rule out revenue concentration in top
      corporate accounts.
    diligencePath: Review anonymized top-20 customer revenue contribution and contract term schedules.
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: litigation-liability
    missingEvidence: Full California court filings and monetary settlement terms for the April 2026 PAGA labor proceeding.
    whyItMatters: >-
      Settlement financial amounts and injunctive operational covenants determine whether clinician labor practices will
      require structural changes across other states.
    diligencePath: >-
      Obtain California state court records, PAGA notice documentation, or request settlement disclosure from company
      legal counsel under NDA.
    relatedQuestionRefs:
      - QR002
    relatedTableRefs:
      - TR001
  - type: missing-source
    severity: material
    topic: clinical-ai-governance
    missingEvidence: >-
      Independent algorithmic bias, clinical safety verification, and data leakage audit reports for Lyra's
      international AI guide tools.
    whyItMatters: >-
      Stringent regulatory frameworks under the EU AI Act and Canadian healthcare privacy rules could mandate severe
      operational restrictions or fines if AI triage errs.
    diligencePath: >-
      Review internal algorithmic validation whitepapers, external clinical review board reports, and ISO/IEC 42001
      certification audits.
    relatedQuestionRefs:
      - QR003
  - type: private-evidence-only
    severity: material
    topic: financial-performance
    missingEvidence: Audited GAAP income statements, trailing twelve month revenue, ARR growth rate, and gross margin breakdown.
    whyItMatters: >-
      Without audited revenue metrics, estimating true enterprise multiple sustainability against public digital health
      comparables remains speculative.
    diligencePath: >-
      Obtain company disclosure package under mutual NDA or inspect confidential audited financial statements from
      primary investors.
    relatedQuestionRefs:
      - QV008
  - type: missing-source
    severity: material
    topic: secondary-transaction-pricing
    missingEvidence: Recent secondary transaction trade clearing prints, bid-ask spreads, and active volume data.
    whyItMatters: >-
      Secondary marks establish real-time private market pricing and the extent of private discount relative to the 2022
      Series G mark.
    diligencePath: >-
      Request secondary desk trading history from Forge Global, EquityZen, or Zanbato covering recent 2025 and 2026
      transactions.
    relatedQuestionRefs:
      - QV007
