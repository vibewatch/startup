callouts:
  - calloutType: "strength"
    title: "Demonstrated Claims Cost Reduction and Category Leadership"
    body: "Lyra Health's primary commercial asset is its peer-reviewed clinical validation, highlighted by a documented 26% reduction in overall annual medical claims costs and a 3:1 employer ROI [CU004]. By delivering faster clinical recoveries than traditional outpatient networks, Lyra provides enterprise benefits leaders with an economically defensible alternative to low-cost, low-engagement EAPs, enabling high-value contracts with Fortune 500 employers [CU001, CU002, CU004]."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU004"
  - calloutType: "risk"
    title: "Retention Opacity and Software Usability Friction"
    body: "Despite covering over 20 million lives, Lyra does not publicly disclose core SaaS retention metrics such as Net Revenue Retention (NRR), gross renewal rates, or customer churn [CU007, CU011]. Furthermore, independent product reviews award Lyra a modest 58/100 score, citing software feature limitations and user dissatisfaction relative to established practice management and digital health suites, presenting potential headwind risks during enterprise renewal negotiations [CU009, CU010]."
    claimRefs:
      - "CU007"
      - "CU009"
      - "CU010"
      - "CU011"
