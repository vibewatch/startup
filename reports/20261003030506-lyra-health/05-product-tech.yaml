callouts:
  - calloutType: "insight"
    title: "Platform Decoupling and Clinical Triage Efficiency"
    body: "Lyra Health's technical architecture deliberately decouples preventive, asynchronous self-care (Lyra Essentials and the 24/7 AI guide) from synchronous clinical teletherapy. By routing low-acuity members into digital interventions and algorithmic matching, Lyra protects licensed provider capacity for complex cases while maintaining immediate sub-day access for urgent workforce needs."
    claimRefs:
      - "CE001"
      - "CE003"
      - "CE005"
      - "CE011"
  - calloutType: "risk"
    title: "Generative AI Guardrails in Clinical Workflows"
    body: "While Lyra's Empower updates introduce AI-generated session summaries and conversational AI member guides, deploying large language models within behavioral healthcare creates exposure to hallucination and liability. Maintaining strict human-in-the-loop validation for clinical notes and preventing sensitive PHI leakage to external model providers remain persistent engineering hurdles."
    claimRefs:
      - "CE001"
      - "CE008"
      - "CE010"
      - "CE015"
