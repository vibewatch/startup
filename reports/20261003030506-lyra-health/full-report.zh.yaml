      - number: '1.4'
        title: 运营规模、战略里程碑与估值阻力
        blocks:
          - type: paragraph
            body: >-
              Lyra Health 的运营规模已从立足美国本土大幅扩张至覆盖全球的企业福利网络 [CO002, CO006]。公司报告称通过直接雇主合同覆盖超过 20 million
              受保人群，并通过健康险计划分销联盟在全球触达逾 200 million 人群 [CO002, CO004]。累计交付的临床咨询场次在 2020 年中突破 1 million 场，并在 2026 年突破 13
              million 场，这依托于由 1,100 多名内部及附属医疗临床人员和数千名签约网络咨询师构成的服务团队 [CO001, CO004, CO009]。2022 年 1 月收购 ICAS World
              巩固了其全球运营能力，将本地化 EAP 和危机支持基础设施扩展至 155 个国家 [CO006]。产品创新侧重于混合式远程治疗、医疗服务方工作流自动化，以及在 2025 年和 2026 年最新推出的 Lyra
              Empower AI 平台和辅导工具 [CO004, CO014]。尽管取得这些运营成果，Lyra 仍面临实质性不利风险与市场审视 [CO013, CO015]。公司顶峰时期的 $5.58 billion
              估值建立在未来利润率大幅扩张和企业留存稳定的预期之上，但由于盈利状况未披露、私有收入不透明以及资金消耗率未证实，这些预期仍未得到验证 [CO013, CO015]。此外，企业 IT 与 HR
              预算紧缩、签约兼职医生对薪酬的不满以及数字医疗老牌玩家竞争加剧等全行业阻力，给 Lyra 未来的公开上市退出路径带来了持续的不确定性 [CO013, CO015]。
