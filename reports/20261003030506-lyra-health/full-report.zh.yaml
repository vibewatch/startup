      - number: '5.2'
        title: 运营架构与数据基础设施
        blocks:
          - type: paragraph
            body: >-
              Lyra Empower 的技术底座连通了面向患者的交互端应用、企业级运营后端以及弹性分析型数据湖仓。面向 C 端与医生的核心微服务主要采用 Python 以及基于 Spring 框架的 Java 开发，并配备
              iOS 和 Android 原生移动端应用。Lyra 将结构化与非结构化医疗事件（包括医生咨询记录、会员症状问卷和运营遥测数据）接入专用的虚拟私有云（VPC）环境。在这一安全边界内，依托 Fivetran 与
              dbt 驱动的托管数据管道将数据沉淀至由 Apache Iceberg 与 Snowflake 构建的湖仓架构中，由 Apache Airflow
              统一编排。该架构在隔离受保护健康信息（PHI）的同时，支持数据科学团队训练分诊算法并评估用于行政自动化的大语言模型 Prompt。
            claimRefs:
              - CE007
