  - number: 4
    title: 财务分析
    sections:
      - number: '4.1'
        title: 收入模式与基于疗效的定价机制
        blocks:
          - type: paragraph
            body: >-
              Lyra Health 主要靠企业级 B2B 雇主福利合同取得收入。过去的模式是收取按员工每年（PEPY）计的管理费，再按诊疗次数开具服务费。2025 年 7 月，Lyra
              宣布战略性转向基于疗效的定价模式（outcomes-based 定价），为采纳该模式的雇主免除传统固定费用，将商业化诊疗费用与可衡量的临床及财务基准直接挂钩。在该架构下，Lyra
              承担项目搭建、管理和支持成本，按交付的服务收取基础诊疗费，若达成一年期绩效指标（如快速预约响应、高会员满意度、临床症状改善及经核验的投资回报率 ROI），即可获得奖金收益。相反，若未达到约定的绩效阈值，Lyra
              必须向雇主返还费用抵扣额，从而将财务下行风险与绩效风险转移至公司自身的经营账本。尽管这一模式统一了与雇主的利益诉求，但其实际合同收益率仍不透明，因标价、基准咨询单价和具体的效果奖励公式均按单一客户逐一谈判拟定。
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
