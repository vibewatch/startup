      - number: '2.3'
        title: 采购方、使用者与采纳路径
        blocks:
          - type: paragraph
            body: >-
              福利与 HR 负责人是直客业务中最明确的利益相关方。Lyra
              目前设立的用户活跃度策略岗位，正是围绕大型复杂客户、外部客户福利负责人、客户营销和可衡量的使用率所设计。健康险计划与合作伙伴构成了第二大分销渠道，而员工及其家属是诊疗使用者，并非已证实的预算支配者。移动端工作流仅在机构或保险计划开通权限后方可启动，随后依次经历注册、自助资源获取、服务商匹配、预约日程和后续活动。公开定价并未标准化：Lyra
              表示雇主定价为定制化且需单独询价。这种不透明性使得采购摩擦、实施经济性以及预算归属成为关键尽调要点，在大型企业客户之外尤为如此。
            claimRefs:
              - CM008
              - CM009
              - CM010
          - type: table
            tableRef: TM003
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
