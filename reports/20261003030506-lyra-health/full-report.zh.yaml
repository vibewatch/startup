            body: >-
              定价与商业模式构成了企业级心理健康市场的核心差异化标志与尽调难点 [CP007]。与按医生或按客户公开透明月度 SaaS 订阅费率的临床诊所软件厂商不同，Lyra Health 与 Ginger
              等综合员工健康平台依赖根据企业规模、福利范围和覆盖人数定制的企业级定价 [CP007, CP008]。Lyra 的竞争护城河依托于高转换成本，这由复杂的 HRIS
              系统集成、单点登录（SSO）配置、参保资格数据流转，以及公开发表的临床疗效（公司称康复速度提升 2x，医疗报销费用降低 26%）共同构建 [CP008, CP009, CP010,
              CP011]。然而，公开标价的缺失以及常规远程治疗的同质化，使得在竞争激烈的续约周期中始终存在被替换的风险 [CP007, CP012]。
