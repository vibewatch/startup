      - number: '1.2'
        title: 创始人、高管团队与治理架构
        blocks:
          - type: paragraph
            body: >-
              Lyra Health 由首席执行官 David Ebersman 联合创立，其丰富的高管背景横跨高成长性消费科技与生物制药领域 [CO005]。创立 Lyra 前，Ebersman 曾担任 Facebook
              (Meta) 首席财务官并领导了其 2012 年 IPO，此前在 Genentech 担任首席财务官兼执行副总裁，直至该公司被 Roche 收购 [CO005, CO006]。这一背景让其在早期风险投资机构和
              Fortune 500 强企业福利采购方中建立了独特的机构级信誉 [CO005, CO007]。公司高管团队配备了专业化的运营与临床领导层，包括首席临床官、首席临床运营官、首席产品技术官以及首席信息安全官等职位
              [CO008]。为推进企业治理制度化，Lyra 引入知名独立企业运营者扩充董事会 [CO006, CO009]。2020 年 8 月，Endeavor 首席人力资源官 Kerry Chandler
              加入董事会，带来其此前在 Under Armour、NBA 与 Disney 担任高管积累的人力资本专业经验 [CO009]。2022 年 1 月，Workday 联席总裁兼首席财务官 Robynne Sisco
              在公司完成 Series F 轮融资时获任董事，为财务报告、公司治理与 SaaS 规模化扩张提供资深指导 [CO006]。尽管拥有经验丰富的高管班底，Lyra 对 Ebersman
              仍存在实质性的关键人物依赖，后者的个人声誉与人脉网络始终是融资与企业级商业信任的核心支撑 [CO005, CO006]。
            claimRefs:
              - CO005
