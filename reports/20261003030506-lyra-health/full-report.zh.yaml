  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              Lyra
              的核心市场并非全部心理健康科技领域。其官方网站与移动端列表将产品界定为由机构或健康险计划赞助的福利，覆盖自我照护、教练、心理治疗、药物支持与专科护理。因此，相关付费方通常为雇主、保险计划或渠道合作伙伴，而员工及其家属则是终端用户。C
              端健康应用、诊所实践管理软件和独立可穿戴设备属于相邻品类，而非可直接获取的支出预算。传统员工援助计划（EAP）是最直接的现状替代品：Lyra 自家关于 EAP 的说明显示，传统模式通常提供 1 至 3
              次免费咨询后便进行转诊，且普遍采用按员工人数计提的固定收费模式。由于当前评估中唯一的宏观市场研究表明个人消费者是该赛道最大的终端用户，该研究报告的总量数据应仅视作背景参考，而非 Lyra 可触达的收入池。
            claimRefs:
              - CM005
              - CM008
              - CM012
              - CM013
              - CM016
