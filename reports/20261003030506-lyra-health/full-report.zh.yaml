            body: >-
              企业级竞争对手在临床交付模式、会员规模和技术基础设施层面存在显著分化 [CP004]。Lyra Health 依托线上线下结合的整合混合模式建立差异化壁垒，将线下与远程治疗结合，并配备自研 AI
              驱动的医生匹配技术与 Lyra Empower 平台 [CP004, CP005]。虽然 Ginger 等竞争对手高度聚焦于按需异步图文沟通和数字化教练，但 Lyra
              提供全谱系诊疗服务，包括神经多样性卓越中心（Center of Excellence for Neurodiversity）等专门项目以及复杂的药物管理 [CP005, CP006]。相比之下，Ensora 和
              AlohaABA 等纯软件平台服务于心理咨询师诊所，并非面向直接的企业采购方，凸显出供应商分类在 HR 采购评估中的关键意义 [CP002, CP003]。
