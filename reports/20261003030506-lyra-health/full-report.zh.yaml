  - number: 6
    title: 客户分析
    sections:
      - number: '6.1'
        title: 企业级买方画像与支付方分层
        blocks:
          - type: paragraph
            body: >-
              Lyra Health 主要采用 B2B 雇主福利分销模式，向自保型 Fortune 500 强企业、跨国公司和全国性医疗支付方销售全面的心理健康诊疗服务 [CU001,
              CU002]。这些机构内部的核心商业决策买方通常是首席人力资源官（CHRO）或全球福利副总裁，其采购决策受到员工医疗报销支出增加、缺勤率上升以及传统员工援助计划（EAP）公认成效不足等因素的驱动 [CU002,
              CU004]。公司称，Lyra 将自身定位为端到端临床解决方案而非基础转诊网络，将个性化临床照护导航、循证治疗、数字化教练及精神科药物管理整合进统一采购合同中 [CU002,
              CU005]。合同通常按每名员工每年（PEPY）接入模式或混合按服务付费使用结构搭建，为合资格员工及其家属提供全额赞助或补贴性质的心理健康专业人士服务 [CU001, CU006]。除直接企业雇主协议外，Lyra
              还通过与健康险计划和第三方管理机构（TPA）达成批发式战略合作拓展业务版图，建立了触达全球逾 100 million 受保人群的二级渠道 [CU001, CU005]。
            claimRefs:
              - CU001
              - CU002
              - CU004
              - CU005
              - CU006
