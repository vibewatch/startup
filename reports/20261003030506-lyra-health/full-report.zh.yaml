          - type: callout
            title: 估值倍数偏高与一级市场估值重校风险
            body: >-
              Lyra Health $5.58 billion 至 $5.85 billion 的估值基准可追溯至 2022 年 1 月的 Series F 轮融资 [CO006, CO013]。外部收入基准估算在 $200
              million 至 $243 million 区间，Lyra 的隐含市销率倍数超过 20x [CO001, CO013]。在缺乏最新一级融资或公开 S-1
              披露的情况下，鉴于公开上市的可比数字医疗企业估值倍数普遍处于个位数市销率，公司面临显著的估值重新校准风险 [CO013, CO015]。
