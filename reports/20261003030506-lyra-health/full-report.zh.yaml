            title: 高管履历构筑企业级买方信誉
            body: >-
              联合创始人 David Ebersman 曾任 Facebook 与 Genentech 首席财务官的履历背景，显著强化了 Lyra Health 在大型企业 HR 及福利采购中的竞争地位
              [CO005]。企业福利买方管理着具有信托责任性质的医疗预算，要求严苛的临床与财务问责机制；相比碎片化的数字医疗初创企业，高素质的高管领导层与蓝筹背景董事会成员（如 Workday 首席财务官 Robynne
              Sisco、Endeavor 首席人力资源官 Kerry Chandler）构成了决定性的结构化优势 [CO006, CO009]。
