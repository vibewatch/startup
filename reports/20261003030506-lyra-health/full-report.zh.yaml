  - id: TV002
    title: 正反投资论点权衡
    columns:
      - 核心维度
      - 投资论点
      - 反方观点 / 风险
      - 转变观点的触发条件
    rows:
      - - 市场规模
        - 服务网络覆盖全球逾20M名成员，手握顶级大企业的企业级合同
        - 覆盖总人数并不等同于活跃付费用户或持续稳定的软件订阅ARR
        - 经独立审计的实际使用率以及按员工付费的合同数据
      - - 资本与估值
        - 累计融资26.79M，获Dragoneer、Addition和Coatue等顶级机构投资者支持
        - .58B估值形成于2022年市场周期顶点；二级市场流动性有限
        - 明确的二级市场成交数据或经官方公开披露确认营收倍数可持续性的申报文件
      - - 产品与临床
        - 精选优质提供方网络，提供循证心理治疗与AI辅助诊疗导航
        - 临床质量与疗效声明由公司单方披露，缺乏独立第三方审计
        - 经同行评审的独立临床疗效验证及监管机构认证报告
      - - 退出就绪度
        - 核心管理团队深具医疗科技与企业运营规模化扩张经验
        - 尚未秘密递表或公开提交S-1；未盈利数字医疗企业的IPO窗口仍受严重制约
        - 提交显示已实现GAAP盈利或营业利润率大幅扩张的S-1招股说明书
    notes: 分析综合了公司官方披露的市场定位、历史融资估值标杆以及二级市场交易数据。
