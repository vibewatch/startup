      - number: '2.2'
        title: 基于证据约束的市场规模测算
        blocks:
          - type: paragraph
            body: >-
              ResearchAndMarkets 估算 2024 年全球心理健康科技市场规模为 $15.22 billion，并预测到 2030 年将达到 $30.98 billion，年均复合增长率（CAGR）为
              12.58%。报告同时指出，2024 年软件与服务占比超过 70%，北美地区占比超过 50%。这两个占比属于对全球基数不同维度的独立切片，在缺乏重叠度证据的前提下不能直接相乘。若分别单独应用各阈值，仅能得出超过
              $10.65 billion 和超过 $7.61 billion 的下限。这两个结果均未单独剥离出雇主赞助型福利、Lyra 覆盖的国家网络、受保人群、合同金额或预期渗透率。Lyra
              官方报告称通过直接雇主合同覆盖超过 20 million 受保人群，并通过保险计划与合作伙伴建立超过 200 million
              人群的触达路径，这仅代表分销规模，并不等同于收入、ARR、市场份额、可服务市场（SAM）或可用现金储备。
