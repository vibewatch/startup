      - number: '4.3'
        title: 资本充裕度、融资依赖与尽调评估
        blocks:
          - type: paragraph
            body: >-
              截至 Series F 轮，Lyra Health 历经 9 轮机构融资累计募集 $910M 至 $915M 股权资本，在 Dragoneer、Coatue、Addition、Greylock Partners
              与 IVP 等领投的大额融资后，投后估值顶峰达到约 $5.58B 至 $5.9B。公开商业画像模型估算 Lyra 年收入约为 $243M（此前年化流水估算约 $200M），追踪到的组织规模在 1,000 至
              5,000 人之间，以临床与医疗人员为主。然而，前瞻性投资承销面临严峻的可见度障碍。Lyra 自 2022 年以来未再进行过一级股权融资，其当前现金储备、月度现金消耗率及剩余运营跑道均未经证实。尽管凭借超过 20
              million 受保人群与 13 million
              次交付咨询量维持着市场领导地位，但其重度依赖人工临床交付的属性限制了软件级经营杠杆的释放。投资人必须获取经审计的利润表、服务方单位成本明细以及客户留存队列数据，方可验证其估值的可持续性。
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
