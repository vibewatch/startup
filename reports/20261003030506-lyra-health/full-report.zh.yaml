            body: >-
              企业级部署要求 Lyra Health 深度集成至雇主福利生态和医疗服务提供方系统。平台维护着用于 SAML/SSO
              的企业身份连接器，并对接第三方人力资源信息系统（HRIS）以进行持续的资格核验。企业运营团队借助高度定制的 Salesforce Service Cloud 实例协同客户工作流，并集成外部语音电话和工单系统。鉴于
              Lyra 处理高度敏感的心理健康与精神科诊疗记录，其技术基础设施已通过 HITRUST 认证，并符合 HIPAA 以及各州隐私法规。关键运营与技术风险集中在部署生成式 AI 工具时维护数据边界、应对跨外部
              SaaS 连接器的平台治理限制，以及确保跨异构医疗合作伙伴网络的低延迟同步。
            claimRefs:
