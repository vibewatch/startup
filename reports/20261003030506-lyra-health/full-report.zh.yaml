chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司定位、运营模式与平台范畴
        blocks:
          - type: paragraph
            body: >-
              Lyra Health, Inc. 是雇主赞助型全方位心理健康福利的领先服务商，总部位于加利福尼亚州 Burlingame [CO001]。公司成立于 2015
              年，采用整合照护模式，将自主节奏的数字化健康工具、循证教练、远程治疗、线下临床诊疗与药物管理相结合，为大型企业员工及其家属提供行为健康解决方案 [CO001, CO002]。Lyra
              并非传统的员工援助计划（EAP）或开放式远程医疗名录，而是提供由精选循证临床医生组成的管理型网络，并结合自研匹配算法，依据临床严重程度与个人偏好，将个体与最合适的医疗服务提供方及治疗方式精准对接 [CO002,
              CO003]。              Lyra 将诊疗规范围绕认知行为疗法（CBT）及相关循证实践标准化，主要与寻求遏制整体医疗报销支出（公司称可控制理赔成本）并提升员工生产力的自保型雇主签约 [CO002,
              CO004]。公司主要采用 B2B 订阅模式，按照合同条款向赞助雇主收费，同时在网页端和移动端为会员提供无缝接入体验 [CO001, CO003]。Lyra
              的移动应用支持企业健康险计划接入，并在主流应用商店分发，通过了 HITRUST 认证并符合 HIPAA 数据保护要求，以确保会员及其家属的临床隐私安全 [CO003]。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
