      - number: '1.3'
        title: 融资历程、估值演进与股东阵营
        blocks:
          - type: paragraph
            body: >-
              Lyra Health 历经 9 轮股权融资累计吸纳 $910 million 至 $967 million 资金，说明数字医疗投资热潮期间机构支持持续 [CO010, CO011]。2015
              年中完成种子轮融资后，公司于 2015 年底获得 $35 million Series A 轮融资；随着雇主对行为健康需求加速增长，后续成长轮次进一步充实了其资本储备 [CO010]。2020 年 8
              月，Addition 领投 $110 million Series D 轮融资，Adams Street Partners 以及包括 Greylock、IVP、Meritech Capital
              Partners、Casdin Capital、Glynn Capital、Providence Ventures、Tenaya Capital 与 Starbucks 前 CEO Howard Schultz
              在内的老股东参投 [CO009, CO012]。公司在 2021 年加速资本化运作，分别斩获 $187 million Series E 轮与 $200 million Series F 轮融资，并在 2022
              年 1 月达到顶峰，由 Dragoneer Investment Group 领投、Salesforce Ventures 和 Coatue 参投了额外一笔 $235 million 的 Series F 轮融资
              [CO006, CO010]。市场报告与二级交易追踪数据将 2022 年交易完成后 Lyra 的投后估值锚定在约 $5.58 billion 至 $5.85 billion [CO013]。然而，Lyra 自
              2022 年初以来未曾宣布过后续一级股权融资，导致其私有估值尚未根据 2022 年后数字医疗 SaaS 估值倍数的收缩进行校准 [CO010, CO013]。商业数据库估算其年收入在 $200 million 至
              $243 million 区间，历史估值倍数超过 20x 收入，也使其面临流动性与二级市场阻力 [CO001, CO013]。
            claimRefs:
