      - number: '4.2'
        title: 成本结构、临床交付经济模型与利润率驱动因素
        blocks:
          - type: paragraph
            body: >-
              Lyra 的服务交付成本与营业成本主要由其混合网络的医疗服务方薪酬所驱动，该网络涵盖全职（W-2）临床医生与独立签约（1099）的兼职心理咨询师、教练及精神科医生。近年来，临床咨询师的反馈显示，Lyra
              针对签约咨询师推行了下调服务费用的举措，理由是服务方成本高于平均水平，并将转诊量向更低成本的服务方及自研混合照护（Blended Care）模式倾斜。咨询师反映的运营变动包括：将每周目标个案负荷预期从 24
              名客户提高到 30 名、强制推行 AI 辅助的临床病历书写工具，并以接受最高 20%
              的降费作为维持后续转诊量的条件。这些控费措施反映出公司为管理临床服务交付支出、抵御咨询师涨薪诉求以维持毛利率而做出的针对性控制。然而，由于 Lyra 未公开披露 GAAP
              财务业绩，确切毛利率、单次咨询综合人工成本、软件毛利率以及会员获客回收周期等关键指标仍属未经核实的非公开数据，有待专门尽调。
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
