            body: >-
              Lyra Health 的企业会员覆盖和临床服务量都在大幅增长 [CU001, CU007]。运营披露证实，Lyra 在直接雇主合作下覆盖超过 20 million 受保人群，自创立以来交付了超过 15
              million 次心理健康诊疗咨询 [CU001, CU007]。临床研究与经济学分析表明，可衡量的投资回报率支撑着企业端的采纳度，公司称参保雇主的年度医疗报销总支出平均降低 26%，每投入一美元预计可产生
              3:1 的 ROI [CU001, CU004]。为保持会员活跃度并缓解客户账户使用率不足问题，Lyra 部署了专门的客户运营策略团队，并采用内部机器学习算法优化匹配并降低医生的病历书写负担 [CU003,
              CU007, CU008]。然而，尽管累计咨询总量庞大，确切的月活使用率、单账户渗透基准以及完整的会员活跃度分布均未公开披露，使得对持续用户活跃度的独立验证仍不完整 [CU001, CU003]。
