              - CV010
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV013
      - number: '8.2'
        title: 融资历史与股权结构演进
        blocks:
          - type: paragraph
            body: >-
              Lyra 的资本轨迹反映了 2020 至 2022 年数字医疗投资周期中的快速估值倍数扩张。公司在 2020 年 8 月以 .1 billion 估值完成由 Addition 领投的 10 million
              Series D 轮融资后跻身独角兽行列，高于 2020 年 3 月的 12.56 million Series C 轮定盘。Series D 轮每股价格为 .74，随后在 Series E 轮攀升至
              .16、Series F 轮升至 5.70，并在 Series G 轮达到每股 8.23 的顶峰。整个资本结构中的优先股条款维持着 1.0x 不参与分配清算优先权以及 6.0% 的非累积股息率。尽管 1.0x
              不参与分配清算优先权保护了 Dragoneer、Coatue 和 Sands Capital 等后期投资人免受灾难性下行影响，但普通股股东在分享股权收益前面临着近 27 million
              的巨额清算优先覆盖敞口。Forge 和 EquityZen 等二级平台上的交易活跃度流动性有限且未形成稳定的撮合定价，反映出一级市场对按 2022 年峰值倍数交易的犹疑态度。
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
      - number: '8.3'
        title: 情景分析、催化剂与尽调路径
        blocks:
          - type: paragraph
            body: >-
              我们给予 Lyra Health track 的投资评级，风险等级为 high，估值立场为 stretched。核心唱空论点聚焦于倍数收缩与退出可行性：在正常化的宏观经济环境下维持 .58 billion
              的估值，若基于可持续的 10x 至 15x 远期倍数，需要 50 million 至 00 million 的 ARR，这在没有经审计利润表的情况下无法证实。在基准情景下，Lyra
              保持平稳的企业端扩张，得出公允股权价值估算为 .5 billion 至 .2 billion，较其 Series G 轮估值折让 25% 至 37%。下行触发因素包括企业合同重新谈判、客户削减 HR
              员工健康福利预算、医生薪资通胀或 IPO 窗口受阻。投资者在考虑直接出资前，应要求获得经审计的 GAAP 收入披露、净收入留存率拆解以及临床医生离职率数据。
            claimRefs:
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV004
              - CV012
              - CV014
      - number: '8.4'
        title: 图表
        blocks:
          - type: callout
            title: Series G 轮估值倍数高企悬顶
            body: >-
              Lyra Health 在 2022 年 1 月 Series G 轮融资中的 .58 billion
              投后估值反映了数字医疗周期后期的顶峰估值。在缺乏收入年化流水或毛利率公开审计披露的情况下，要在公开市场或退出交易中维持这一估值，需要极其特殊的超额倍数支撑，而当前市场环境极难支持这一点。
            calloutType: risk
            claimRefs:
              - CV001
              - CV005
              - CV014
          - type: callout
            title: 维持 Track 评级亟待审计数据验证
            body: 建议采取持续跟踪立场。机构投资者在建立新股权敞口前，应等待经审计财务指标、可验证的群组留存数据以及二级市场交易出清价格透明化。
            calloutType: recommendation
            claimRefs:
              - CV013
              - CV015
              - CV016
