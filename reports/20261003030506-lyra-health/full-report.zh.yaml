            title: 宽口径 TAM 并非 Lyra 的 SAM
            body: 现有的 $15.22 billion 市场估算涵盖了以个人消费者为主导的广义市场，而 Lyra 有据可查的业务接入均由雇主、保险计划和合作伙伴促成。
            calloutType: insight
