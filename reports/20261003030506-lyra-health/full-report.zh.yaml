              - CM014
      - number: '2.4'
        title: 驱动因素、制约条件与估值关联
        blocks:
          - type: paragraph
            body: >-
              该赛道受益于认知度提升、远程诊疗接受度提高、智能手机分发普及以及雇主对规模化支持方案的需求。ResearchAndMarkets
              同时指出，隐私、安全以及不一致的监管政策是限制采纳的制约因素。公司层面的证据暴露出商业化制约：Lyra
              的运营团队需要扭转部分存量业务中实际使用率下滑的局面，受保资格并不必然转化为持续使用。历史报道亦将费用、心理病耻感和系统导航困难列为获取服务的主要障碍。ITQlick 的 2026
              年对比分析给出了一个低置信度信号，即订阅费用可能阻碍小型企业采购，但其评估方法和产品对比论据过弱，无法据此测算该细分市场规模。行业增长支撑远期机会，但缺少仅限雇主端的分母、合同经济模型未公开，且参保资格转化为实际使用仍不确定，因此无法搭出可信的市场份额或收入增长桥接。
            claimRefs:
              - CM002
              - CM011
              - CM014
              - CM015
