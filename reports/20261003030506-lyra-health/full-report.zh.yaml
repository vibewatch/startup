      - CV006
      - CV010
      - CV014
  - id: TV003
    title: 乐观、基准与悲观估值情景
    columns:
      - 情景
      - 隐含估值区间
      - 核心假设与驱动因素
      - 关键风险与阻力
      - 概率预期
    rows:
      - - 乐观情景
        - .0B - .5B
        - 营收突破50M且增速保持在30%+，跨国企业客户渗透率持续提升
        - 整个数字医疗板块估值倍数承压；企业对健康福利预算的审查趋紧
        - 低（15-20%）
      - - 基准情景
        - .5B - .2B
        - 企业续约平稳，营收规模约50M-20M，对应估值倍数为11x-14x
        - IPO或流动性事件时，估值较G轮.58B标杆下调25-35%（down-round）
        - 中（55-60%）
      - - 悲观情景
        - .8B - .5B
        - 营收增速滑落至10%以下，提供方成本挤压利润率且客户出现流失
        - 遭遇严重折价轮（down-round），后期优先股清算优先权压力致使普通股价值归零
        - 中（25-30%）
    notes: 各情景估值区间基于常态化SaaS与数字医疗上市交易倍数，结合估算的一级市场运营规模测算得出。
    claimRefs:
      - CV001
      - CV004
      - CV012
      - CV014
