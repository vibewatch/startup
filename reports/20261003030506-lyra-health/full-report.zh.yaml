  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 企业级行为健康竞争格局
        blocks:
          - type: paragraph
            body: >-
              雇主心理健康福利领域呈现出激烈的竞争态势，主要分布于四个不同细分赛道：直接综合心理健康平台、传统员工援助计划（EAP）、专业化单点解决方案以及医疗支付方整合网络 [CP001]。Lyra Health 与
              Spring Health 和 Modern Health 等综合企业平台直接竞争，同时替代受困于长期极低使用率的 ComPsych 和 Magellan Health 等传统 EAP 服务商 [CP001,
              CP002]。此外，Ginger（已并入 Headspace）等专业化方案聚焦线上教练与文本支持，而 Ensora Mental Health 和 AlohaABA
              等诊所管理软件则专注诊所运营，并非雇主赞助型福利 [CP002, CP003]。再者，评估心理健康平台的大型企业面临着在专业临床网络与支付方管理的内嵌计划（carve-in）之间做出结构性权衡 [CP001]。
            claimRefs:
              - CP001
              - CP002
              - CP003
