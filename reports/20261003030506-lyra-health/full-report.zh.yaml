  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品生态与会员诊疗工作流
        blocks:
          - type: paragraph
            body: >-
              Lyra Health 通过以 Lyra Empower
              平台为核心的数字化与临床整合生态系统交付心理健康福利。对于受保会员，服务入口始于原生移动应用或企业单点登录（SSO）网页门户，用户在其中完成对话式问诊与自动化分诊算法流转。会员可以使用自然语言描述症状，探索从自主数字化健康内容（Lyra
              Essentials）到教练辅导及专科临床治疗的个性化诊疗路径，并选择匹配的医生。在临床咨询间歇期，会员可通过与医生的异步沟通以及经过临床验证的 24/7 Lyra AI
              指南获取持续的数字化支持。这一产品架构将数字化分诊和自主照护资源与高强度临床干预相解耦，在优化临床医生利用率的同时，为复杂及急性精神科病例保留了高接触度的诊疗导航。
