company:
  name: Lyra Health
chapter:
  number: 8
  title: Valuation
  summary: Lyra Health attained a .58B valuation in its January 2022 Series G led by Dragoneer, bringing total capital raised
    to 26.79M. However, in the absence of audited ARR or public financial disclosures, secondary marks show limited liquidity
    and sustaining that peak multiple in the current private market presents material downside risk, supporting a track stance
    with a stretched valuation profile.
sections:
- id: investment-thesis-and-valuation-overview
  title: Investment Thesis and Valuation Context
  body: Lyra Health established itself as a category-defining employer mental health platform, achieving a peak post-money
    valuation of .58 billion in its January 2022 Series G financing round led by Dragoneer Investment Group alongside Salesforce
    Ventures and Coatue Management. Across seven venture rounds from its Series A in 2015 to Series G in 2022, Lyra accumulated
    26.79 million in total equity capital to build an integrated behavioral health infrastructure. The platform pairs video
    therapy, personalized digital lessons, and curated clinical networks covering more than 20 million lives globally. However,
    because Lyra remains private and has not filed a public S-1, operational revenue run rates and gross margins are unverified
    outside company claims. Without audited ARR figures, the .58 billion valuation implies an aggressive forward multiple,
    creating downside risk and down-round overhang for pre-IPO investors in the secondary market.
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV004
  - CV005
  - CV006
  tableRefs:
  - TV001
  - TV002
  figureRefs:
  - FV001
- id: financing-history-and-capital-structure
  title: Financing History and Cap Table Evolution
  body: Lyra's capital trajectory reflects rapid multiple expansion during the 2020 to 2022 digital health investment cycle.
    The company achieved unicorn status in August 2020 after a 10 million Series D financing led by Addition at a .1 billion
    valuation, up from its 12.56 million Series C mark in March 2020. The Series D priced at .74 per share, subsequently escalating
    to .16 in Series E, 5.70 in Series F, and culminating in the Series G price of 8.23 per share. Preferred share terms throughout
    the capital structure maintain a 1.0x non-participating liquidation preference with a 6.0% non-cumulative dividend rate.
    While non-participating 1.0x preference protects later-stage investors such as Dragoneer, Coatue, and Sands Capital from
    catastrophic downside, common shareholders face substantial liquidation overhang of nearly 27 million before sharing in
    equity proceeds. Secondary marketplace activity on platforms such as Forge and EquityZen exhibits limited liquidity and
    unestablished matched pricing, signaling private market hesitation to trade at peak 2022 multiples.
  claimRefs:
  - CV007
  - CV008
  - CV009
  - CV010
  - CV011
  - CV012
- id: scenario-analysis-and-recommendation
  title: Scenario Analysis, Catalysts, and Diligence Path
  body: 'We assign Lyra Health a recommendation of track with a high risk rating and a stretched valuation stance. The primary
    anti-thesis centers on multiple compression and exit feasibility: sustaining a .58 billion valuation in a normalized macroeconomic
    environment requires over 50 million to 00 million in ARR at sustainable 10x to 15x forward multiples, which cannot be
    verified without audited income statements. In our base scenario, Lyra executes modest enterprise expansion, yielding
    an estimated fair equity value of .5 billion to .2 billion, reflecting a 25% to 37% discount to its Series G mark. Downside
    triggers include enterprise contract re-negotiations, customer budget cuts in HR wellness benefits, clinician wage inflation,
    or an impaired IPO window. Investors should require audited GAAP revenue disclosures, net revenue retention breakdowns,
    and clinician turnover figures before considering a direct capital commitment.'
  claimRefs:
  - CV013
  - CV014
  - CV015
  - CV016
  tableRefs:
  - TV003
callouts:
- calloutType: risk
  title: Series G Valuation Multiple Overhang
  body: Lyra Health's .58 billion post-money valuation from its Series G round in January 2022 reflects late-cycle peak valuations
    in digital health. Without public audited disclosures of revenue run rate or gross margins, sustaining this valuation
    in public markets or an exit requires extraordinary multiple justification that current market conditions rarely support.
  claimRefs:
  - CV001
  - CV005
  - CV014
- calloutType: recommendation
  title: Track Stance Demands Audit Verification
  body: We recommend a track stance. Institutional investors should wait for audited financial metrics, verifiable cohort
    retention data, and transparency on secondary transaction clearing prices before establishing new equity exposure.
  claimRefs:
  - CV013
  - CV015
  - CV016
