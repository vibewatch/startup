  evidenceGaps:
    - type: missing-source
      severity: material
      topic: market-sizing
      missingEvidence: >-
        A current independent estimate of employer-sponsored mental-health benefit
        spend segmented by geography, covered lives, and service category.
      whyItMatters: >-
        The available global technology estimate includes individual-consumer and
        provider categories and therefore cannot establish Lyra's SAM.
      diligencePath: >-
        Obtain a current buyer-side benefits benchmark or analyst dataset and
        reconcile its category boundary against Lyra's contracted services.
      relatedQuestionRefs: [QM009]
    - type: private-evidence-only
      severity: material
      topic: obtainable-share
      missingEvidence: >-
        Lyra contract values, pricing units, eligible covered lives by channel,
        utilization, renewal, win-rate, and geographic revenue mix.
      whyItMatters: >-
        Without contract economics and conversion data, reported access pathways
        cannot be translated into revenue, market share, or obtainable market.
      diligencePath: >-
        Review management cohort data, customer contracts, renewal files, and
        invoiced revenue by employer, plan, product, and geography.
      relatedQuestionRefs: [QM010]
    - type: missing-source
      severity: material
      topic: estimate-comparability
      missingEvidence: >-
        A second independent market estimate with a comparable employer-sponsored
        boundary, base year, geography, and methodology.
      whyItMatters: >-
        A single broad market forecast cannot establish estimate convergence or
        explain contradictory sizing assumptions.
      diligencePath: >-
        Commission or obtain a second market study and normalize both estimates
        to the same buyer, service, geography, and period.
      relatedQuestionRefs: [QM002, QM009]
