schemaVersion: "report-v2"
artifact: market-analysis
slug: lyra-health
runDate: 2026-10-03
company:
  name: Lyra Health
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Lyra sells into the employer-sponsored and health-plan mental-health benefit
    market, a narrower category than the $15.22 billion global mental-health
    technology estimate available in the assigned evidence. Demand benefits from
    expanding digital access and employer interest, but utilization, trust,
    privacy, and opaque pricing constrain adoption, while a defensible Lyra SAM
    and SOM remain undisclosed.
sections:
  - id: market-boundary
    title: Market boundary and substitutes
    body: >-
      Lyra's core market is not all mental-health technology. Its website and
      mobile listing describe an organization- or health-plan-sponsored benefit
      spanning self-care, coaching, therapy, medication support, and specialized
      care. The relevant payer is therefore usually an employer, plan, or channel
      partner, while employees and family members are users. Consumer wellness
      apps, provider practice-management software, and standalone wearables are
      adjacent categories rather than directly addressable spend. Traditional
      employee assistance programs are the clearest status-quo substitute:
      Lyra's own EAP explainer describes one to three no-cost sessions followed
      by referral and common fixed-fee arrangements based on employee count.
      Because the only broad market study in the assigned pool says individual
      consumers are its largest end-user, that study's total should be treated
      as context, not as Lyra's addressable revenue pool.
    claimRefs: [CM005, CM008, CM012, CM013, CM016]
    tableRefs: [TM001]
  - id: sizing
    title: Evidence-constrained sizing
    body: >-
      ResearchAndMarkets estimates the global mental-health technology market at
      $15.22 billion in 2024 and forecasts $30.98 billion by 2030, a 12.58% CAGR.
      It also reports that software and services represented more than 70% and
      North America more than 50% in 2024. Those two shares are separate cuts of
      the global denominator and cannot be multiplied without evidence about
      their overlap. Applying each threshold independently produces only lower
      bounds of more than $10.65 billion and more than $7.61 billion,
      respectively. Neither result isolates employer-sponsored benefits, Lyra's
      eligible-country footprint, covered populations, contract values, or
      expected penetration. Lyra's company-reported reach of more than 20 million
      people through direct employer contracts and access pathways for more than
      200 million through plans and partners indicates distribution scale, not
      revenue, ARR, market share, SAM, or cash available.
    claimRefs: [CM001, CM002, CM003, CM004, CM006, CM007, CM016]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyers-and-adoption
    title: Buyers, users, and adoption path
    body: >-
      Benefits and HR leaders are the clearest direct-account stakeholders. A
      current Lyra engagement-strategy role is designed around large, complex
      accounts, external client benefits leaders, customer marketing, and
      measurable utilization. Health plans and partners form a second access
      channel, while employees and dependents remain the care users rather than
      the demonstrated budget owners. The mobile workflow begins only after an
      organization or plan enables access, then moves through registration,
      self-service resources, provider matching, scheduling, and ongoing
      activities. Public pricing is not standardized: Lyra says employer pricing
      is tailored and requires a quote. That opacity makes procurement friction,
      implementation economics, and budget ownership important diligence items,
      especially outside large enterprises.
    claimRefs: [CM008, CM009, CM010]
    tableRefs: [TM003]
  - id: drivers-constraints
    title: Drivers, constraints, and valuation relevance
    body: >-
      The category benefits from rising awareness, remote-care acceptance,
      smartphone distribution, and employer demand for scalable support.
      ResearchAndMarkets also identifies privacy, security, and inconsistent
      regulation as adoption restraints. Company-side evidence adds a commercial
      constraint: Lyra's engagement team is expected to reverse utilization
      declines in parts of its book of business, showing that covered eligibility
      does not automatically become sustained use. Historical reporting also
      identified cost, stigma, and system navigation as access barriers.
      ITQlick's 2026 comparison adds a low-confidence signal that subscription
      cost can deter smaller businesses, but its methodology and product
      comparison are too weak to size that segment. For valuation, category
      growth supports opportunity, while the missing employer-only denominator,
      undisclosed contract economics, and uncertain conversion from eligibility
      to utilization prevent a credible market-share or revenue-growth bridge.
    claimRefs: [CM002, CM011, CM014, CM015]
callouts:
  - calloutType: insight
    title: Broad TAM is not Lyra SAM
    body: >-
      The available $15.22 billion estimate includes a market led by individual
      consumers, whereas Lyra's documented access is mediated by employers,
      plans, and partners.
    claimRefs: [CM001, CM005, CM008, CM016]
  - calloutType: risk
    title: Eligibility does not prove utilization
    body: >-
      Lyra reports large eligible populations, but its own engagement hiring
      brief identifies utilization declines in parts of the customer base.
    claimRefs: [CM006, CM007, CM011]
tables:
  - id: TM001
    title: Market definition and substitute boundary
    columns:
      - Segment or category
      - Included spend or workflow
      - Excluded spend
      - Buyer or payer
      - Relevance to Lyra
    rows:
      - - Employer-sponsored comprehensive mental-health benefit
        - Self-care, coaching, therapy, medication support, specialty care, navigation
        - Unrelated general medical benefits and direct consumer purchases
        - Employer; benefits or HR stakeholder
        - Core documented market
      - - Health-plan and partner access
        - Behavioral-health access, navigation, and coordinated care made available through a plan or partner
        - Direct-employer contracts counted as a separate channel
        - Health plan or partner; exact budget owner not disclosed
        - Core or adjacent distribution channel
      - - Traditional EAP
        - Commonly one to three employee sessions and referral to other resources
        - Comprehensive continuing care after the referral
        - Employer, often paying by employee count or service used
        - Primary status-quo substitute
      - - Consumer mental-health technology
        - Self-paid apps, chatbots, virtual therapy, and wellness tools
        - Employer- or plan-sponsored benefit contracts
        - Individual consumer
        - Included in broad TAM but not proven Lyra-addressable spend
      - - Provider and practice-management technology
        - Clinical administration, EHR, scheduling, billing, and provider tools
        - Sponsored employee benefit and care-network contract
        - Provider organization or clinician
        - Adjacent infrastructure, not established as Lyra's core market
    notes: >-
      Boundary is evidence-constrained to the assigned sources; buyer and budget
      fields marked as undisclosed are not inferred from broad market totals.
    claimRefs: [CM005, CM008, CM010, CM012, CM013, CM016]
  - id: TM002
    title: Published sizing lenses and limitations
    columns:
      - Publisher and metric
      - Period
      - Geography and denominator
      - Reported value
      - Method or transformation
      - Confidence and limitation
    rows:
      - - ResearchAndMarkets mental-health technology market
        - "2024"
        - Global; total mental-health technology market
        - USD 15.22 billion
        - Publisher market estimate
        - Medium; broad category and largest end-user is individual consumers
      - - ResearchAndMarkets market forecast
        - 2024-2030
        - Global; total mental-health technology market
        - USD 30.98 billion by 2030; 12.58% CAGR
        - Publisher forecast from the 2024 base
        - Medium; forecast methodology is not disclosed in the fetched release
      - - Software and services segment
        - "2024"
        - Global; share of mental-health technology market
        - More than 70%; implied lower bound above USD 10.65 billion
        - 15.22 multiplied by 70% only to show a conservative threshold
        - Medium; not an employer-benefits segment and actual share exceeds threshold
      - - North America
        - "2024"
        - Regional share of global mental-health technology market
        - More than 50%; implied lower bound above USD 7.61 billion
        - 15.22 multiplied by 50% only to show a conservative threshold
        - Medium; overlap with software and services is not disclosed
    notes: >-
      USD billions unless stated. Derived values are rounded lower-bound
      thresholds, not publisher estimates; the segment and geography shares are
      separate cuts and are not multiplied together.
    claimRefs: [CM001, CM002, CM003, CM004, CM005, CM016]
  - id: TM003
    title: Buyer, user, payer, and adoption map
    columns:
      - Segment
      - Buyer or sponsor
      - User
      - Payer or budget owner
      - Adoption path
      - Trigger or constraint
    rows:
      - - Direct employer
        - Benefits or HR leader; large-account customer stakeholders
        - Employees and eligible family members
        - Employer; exact budget line not disclosed
        - Contract and enablement, communications, registration, matching, care
        - EAP replacement, outcomes, ROI, and utilization
      - - Health plan
        - Plan stakeholder not identified in assigned evidence
        - Eligible members and dependents
        - Health plan; exact contracting economics not disclosed
        - Plan enables access, member registers, then selects resources or care
        - Access, medical-cost impact, trust, and privacy
      - - Partner channel
        - Partner stakeholder not identified in assigned evidence
        - People eligible through the partner relationship
        - Partner or downstream payer not established
        - Partner pathway enables access to Lyra care
        - Distribution reach does not establish conversion or revenue
      - - Employee or dependent
        - Not the documented enterprise buyer
        - Employee, member, or family member
        - Organization or plan provides eligibility; cost sharing not disclosed
        - Register, use resources, match with provider, schedule, and continue care
        - Awareness, stigma, navigation, fit, confidentiality, and engagement
    notes: >-
      This map distinguishes demonstrated access roles from unknown contracting
      roles; it does not infer budget ownership, covered-life conversion, or
      contract value where the assigned evidence is silent.
    claimRefs: [CM006, CM007, CM008, CM009, CM010, CM011, CM014]
figures:
  - id: FM001
    title: Market sizing layers and evidence limits
    type: pyramid
    summary: >-
      Published global and regional context narrows quickly into undisclosed
      employer-benefits, Lyra SAM, and obtainable-share layers.
    data:
      items:
        - label: Published global market
          value: 15.22
          unit: USD billion
          detail: 2024 global mental-health technology estimate
        - label: Published global forecast
          value: 30.98
          unit: USD billion
          detail: 2030 forecast at a reported 12.58% CAGR from 2024
        - label: Software and services threshold
          value: 70
          unit: percent minimum
          detail: Reported as more than 70% of the 2024 global market
        - label: North America threshold
          value: 50
          unit: percent minimum
          detail: Reported as more than 50% of the 2024 global market
        - label: Employer-sponsored subset
          value: Not isolated
          unit: null
          detail: Assigned evidence does not separate employer-sponsored benefit spend
        - label: Lyra SAM and obtainable share
          value: Not disclosed
          unit: null
          detail: No public contract-value, eligible-market, or penetration denominator
    approximationNotes: >-
      The 70% and 50% values are publisher-reported lower thresholds on separate
      dimensions, not sequential funnel stages. They are not multiplied. Unknown
      employer-benefit, SAM, and SOM layers remain qualitative rather than being
      assigned unsupported values.
    claimRefs: [CM001, CM002, CM003, CM004, CM016]
