      yAxis:
        label: Clinical Acuity and Specialty Care Depth
      points:
        - label: Lyra Health
          x: 9
          'y': 9
          rationale: >-
            Global workforce integration (20M+ covered lives, SSO, HRIS data feeds) with high acuity care including
            neurodiversity CoE and medication management.
        - label: Spring Health
          x: 8
          'y': 8
          rationale: High enterprise integration depth with structured clinical assessments and digital navigation.
        - label: Ginger (Headspace)
          x: 7
          'y': 5
          rationale: >-
            Broad digital reach and virtual coaching focus, but lower specialty clinical depth for complex psychiatric
            needs.
        - label: Legacy EAP Providers
          x: 6
          'y': 3
          rationale: >-
            Broad legacy deployment across enterprises, but minimal clinical acuity and negligible continuous care
            depth.
