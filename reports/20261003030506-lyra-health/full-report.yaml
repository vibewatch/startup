      - number: '2.3'
        title: Buyers, users, and adoption path
        blocks:
          - type: paragraph
            body: >-
              Benefits and HR leaders are the clearest direct-account stakeholders. A current Lyra engagement-strategy
              role is designed around large, complex accounts, external client benefits leaders, customer marketing, and
              measurable utilization. Health plans and partners form a second access channel, while employees and
              dependents remain the care users rather than the demonstrated budget owners. The mobile workflow begins
              only after an organization or plan enables access, then moves through registration, self-service
              resources, provider matching, scheduling, and ongoing activities. Public pricing is not standardized: Lyra
              says employer pricing is tailored and requires a quote. That opacity makes procurement friction,
              implementation economics, and budget ownership important diligence items, especially outside large
              enterprises.
            claimRefs:
              - CM008
              - CM009
              - CM010
          - type: table
            tableRef: TM003
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
              - CM014
      - number: '2.4'
        title: Drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              The category benefits from rising awareness, remote-care acceptance, smartphone distribution, and employer
              demand for scalable support. ResearchAndMarkets also identifies privacy, security, and inconsistent
              regulation as adoption restraints. Company-side evidence adds a commercial constraint: Lyra's engagement
              team is expected to reverse utilization declines in parts of its book of business, showing that covered
              eligibility does not automatically become sustained use. Historical reporting also identified cost,
              stigma, and system navigation as access barriers. ITQlick's 2026 comparison adds a low-confidence signal
              that subscription cost can deter smaller businesses, but its methodology and product comparison are too
              weak to size that segment. For valuation, category growth supports opportunity, while the missing
              employer-only denominator, undisclosed contract economics, and uncertain conversion from eligibility to
              utilization prevent a credible market-share or revenue-growth bridge.
            claimRefs:
              - CM002
              - CM011
              - CM014
              - CM015
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Broad TAM is not Lyra SAM
            body: >-
              The available $15.22 billion estimate includes a market led by individual consumers, whereas Lyra's
              documented access is mediated by employers, plans, and partners.
            calloutType: insight
            claimRefs:
              - CM001
              - CM005
              - CM008
              - CM016
          - type: callout
            title: Eligibility does not prove utilization
            body: >-
              Lyra reports large eligible populations, but its own engagement hiring brief identifies utilization
              declines in parts of the customer base.
            calloutType: risk
            claimRefs:
              - CM006
              - CM007
              - CM011
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Enterprise Behavioral Health Competitive Landscape
        blocks:
          - type: paragraph
            body: >-
              The employer mental health benefits sector is characterized by intense competition across four distinct
              segments: direct comprehensive mental health platforms, legacy employee assistance programs (EAPs),
              specialized point solutions, and healthcare payer-integrated networks [CP001]. Lyra Health competes
              directly with comprehensive enterprise platforms like Spring Health and Modern Health, while displacing
              legacy EAP vendors such as ComPsych and Magellan Health that suffer from chronically low utilization rates
              [CP001, CP002]. Additionally, specialized solutions like Ginger (integrated into Headspace) target virtual
              coaching and text-based support, whereas practice management software like Ensora Mental Health and
              AlohaABA focus on clinic operations rather than employer-sponsored benefits [CP002, CP003]. Furthermore,
              large enterprises evaluating mental health platforms encounter structural tradeoffs between specialized
              clinical networks and payer-administered carve-in programs [CP001].
            claimRefs:
              - CP001
              - CP002
              - CP003
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP004
      - number: '3.2'
        title: Competitor Profiles, Scale, and Core Capabilities
        blocks:
          - type: paragraph
            body: >-
              Enterprise competitors diverge sharply in terms of clinical delivery models, member scale, and technology
              infrastructure [CP004]. Lyra Health differentiates itself through an integrated hybrid model combining
              in-person and virtual therapy with proprietary AI-driven provider matching and its Lyra Empower platform
              [CP004, CP005]. While competitors like Ginger focus heavily on on-demand asynchronous chat and digital
              coaching, Lyra provides full-spectrum care including specialized programs like its Center of Excellence
              for Neurodiversity and complex medication management [CP005, CP006]. In contrast, software-only platforms
              such as Ensora and AlohaABA serve therapist practices rather than direct enterprise purchasers,
              highlighting that vendor categorization is critical during HR procurement evaluations [CP002, CP003].
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
