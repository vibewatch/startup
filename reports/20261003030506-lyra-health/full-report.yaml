    title: Lyra Empower Platform Architecture Layers
    type: stack
    summary: >-
      Layered architecture map of Lyra Health's Empower platform from user engagement down to core data infrastructure
      and AI foundation services.
    data:
      layers:
        - label: Engagement & Presentation Layer
          detail: >-
            Mobile applications (iOS, Android), responsive web member portal, provider desktop interface, and benefits
            administration dashboard.
        - label: Application & Integration Services Layer
          detail: >-
            Python and Java/Spring microservices executing care matching, appointment scheduling, video sessions, and
            enterprise SSO/HRIS integrations.
        - label: Enterprise Operations & Care Navigation Layer
          detail: >-
            Salesforce Service Cloud infrastructure with Omni-Channel routing, CTI telephony integration, and clinical
            case management.
        - label: Data Lakehouse & Ingestion Layer
          detail: >-
            Fivetran managed ingestion, Airbyte, Apache Airflow orchestration, and Snowflake cloud data warehouse on
            Apache Iceberg table formats.
        - label: AI & Clinical Intelligence Foundation
          detail: >-
            Conversational triage models, clinically designed AI guides, LLM session summarization, and proprietary
            provider matching algorithms.
        - label: Cloud Infrastructure & Security Perimeter
          detail: >-
            HIPAA-compliant Virtual Private Cloud (VPC), HITRUST-certified boundaries, role-based access controls, and
            data encryption services.
