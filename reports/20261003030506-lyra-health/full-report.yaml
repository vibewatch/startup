              - CP009
              - CP012
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Pricing Opacity and Enterprise Procurement Friction
            body: >-
              Lyra Health's quote-based enterprise pricing creates diligence barriers during corporate renewals,
              especially when procurement teams benchmark against lower-cost digital coaching solutions.
            calloutType: risk
            claimRefs:
              - CP007
              - CP012
          - type: callout
            title: Clinical Moat and B2B Integration Lock-in
            body: >-
              Lyra's combination of peer-reviewed clinical claims reductions (26%) and mission-critical enterprise
              HRIS/SSO pipelines creates substantial switching barriers against competing platforms.
            calloutType: strength
            claimRefs:
              - CP008
              - CP009
              - CP010
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Outcomes-Based Pricing Mechanics
        blocks:
          - type: paragraph
            body: >-
              Lyra Health generates commercial revenue primarily through enterprise B2B employer benefit contracts,
              historically monetized via per-employee-per-year (PEPY) administrative fees paired with session-based care
              delivery invoicing. In July 2025, Lyra announced a strategic evolution toward outcomes-based pricing,
              eliminating traditional fixed fees for adopting employers and tying commercial care fees directly to
              measurable clinical and financial benchmarks. Under this structure, Lyra covers program setup, management,
              and support, receiving baseline care fees for services delivered while earning bonus payments if one-year
              performance metrics—such as fast appointment access, high member satisfaction, clinical symptom
              improvement, and validated return on investment (ROI)—are achieved. Conversely, if agreed performance
              thresholds are missed, Lyra must issue fee credits back to the employer, shifting financial downside and
              performance risk onto the company's operating ledger. While this model aligns employer incentives,
              realized contract yields remain opaque, as list pricing, baseline session charges, and specific
              outcome-bonus formulas are negotiated on a custom client-by-client basis.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI011
          - type: table
            tableRef: TI002
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI002
              - CI003
              - CI005
              - CI010
              - CI011
      - number: '4.2'
        title: Cost Structure, Clinical Delivery Economics, and Margin Drivers
        blocks:
          - type: paragraph
            body: >-
              Lyra's cost of goods and service delivery structure is predominantly driven by provider compensation
              across its hybrid network of W-2 employed clinicians and 1099 independent contracted therapists, coaches,
              and psychiatrists. In recent years, clinician reports indicate that Lyra has implemented downward
              reimbursement pressure on contracted therapists, citing higher-than-average provider costs and adjusting
              referral volumes toward lower-cost providers and proprietary Blended Care formats. Operational changes
              reported by clinicians include increasing target caseload expectations from 24 to 30 clients per week,
              deploying mandatory AI-powered clinical documentation and note-taking tools, and conditioning continued
              referral volume on accepting fee reductions of up to 20%. These cost containment efforts reflect a
              deliberate effort to manage clinical service delivery expenses and defend gross margins against rising
              clinician wage demands. However, because Lyra does not publicly report GAAP financial results, exact gross
              margins, blended therapist labor costs per session, software gross margins, and member acquisition payback
              cycles remain unverified private metrics requiring targeted diligence.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
          - type: table
            tableRef: TI003
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI009
              - CI010
      - number: '4.3'
        title: Capital Adequacy, Financing Dependency, and Diligence Assessment
        blocks:
          - type: paragraph
            body: >-
              Across nine institutional funding rounds through its Series F, Lyra Health has raised a total of $910M to
              $915M in equity capital, achieving a peak post-money valuation of approximately $5.58B to $5.9B following
              major rounds led by Dragoneer, Coatue, Addition, Greylock Partners, and IVP. Publicly available commercial
              firmographic models estimate Lyra's annual revenue at approximately $243M (with prior run-rate estimates
              around $200M), while tracking an organizational headcount of 1,000 to 5,000 personnel, led by clinical and
              medical staff. Nevertheless, forward underwriting faces severe visibility hurdles. Lyra has not executed a
              primary equity funding round since 2022, and its current cash reserves, monthly cash burn, and remaining
              operational runway are unconfirmed. With over 20 million covered lives and 13 million delivered sessions,
              Lyra maintains market leadership, but its heavy human clinical delivery component caps software-style
              operating leverage. Underwriters must obtain audited income statements, provider unit cost breakdowns, and
              client retention cohorts before validating valuation sustainability.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Downside Risk Exposure in Outcomes-Based Pricing Contracts
            body: >-
              Lyra's transition to outcomes-based pricing shifts clinical and operational execution risk onto its
              balance sheet. If member wait times lengthen, satisfaction drops, or clinical symptom improvements fail to
              meet contractual targets, Lyra is obligated to issue credits against care fees, creating revenue
              volatility and margin compression.
            calloutType: risk
            claimRefs:
              - CI002
              - CI003
          - type: callout
            title: Margin Defense via Provider Rate Adjustments and AI Tooling
            body: >-
              Independent practitioner reports indicate Lyra has sought fee reductions of up to 20% from contracted 1099
              clinicians while increasing caseload expectations to 30 clients per week and mandating AI documentation
              tools. These actions demonstrate active unit-cost management to preserve margins in an inflationary
              healthcare labor environment.
            calloutType: insight
            claimRefs:
              - CI005
              - CI006
              - CI007
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Ecosystem and Member Care Workflow
        blocks:
          - type: paragraph
            body: >-
              Lyra Health delivers mental health benefits through an integrated digital and clinical ecosystem organized
              under the Lyra Empower platform. For covered members, entry begins either via the native mobile
              application or enterprise single sign-on (SSO) web portal, where individuals encounter conversational
              intake and automated triage algorithms. Members can describe symptoms in natural language, navigate
              personalized care pathways ranging from self-directed digital wellness content (Lyra Essentials) to
              coaching and specialty clinical therapy, and select provider matches. Between clinical sessions, members
              access continuous digital support through asynchronous provider messaging and the clinically vetted 24/7
              Lyra AI guide. The product structure decouples digital triage and self-care resources from high-intensity
              clinical interventions, optimizing clinician utilization while maintaining high-touch care navigation for
              complex and acute psychiatric cases.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
              - CE006
              - CE011
