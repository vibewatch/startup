      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Executive Pedigree Drives Enterprise Buyer Credibility
            body: >-
              Lyra Health's competitive positioning in large enterprise HR and benefits procurement has been
              substantially amplified by co-founder David Ebersman's pedigree as former CFO of Facebook and Genentech
              [CO005]. Enterprise benefits buyers manage fiduciary healthcare budgets and require strict clinical and
              financial accountability, making high-caliber executive leadership and blue-chip board additions (e.g.
              Workday CFO Robynne Sisco, Endeavor CHRO Kerry Chandler) a decisive structural advantage over fragmented
              digital health startups [CO006, CO009].
            calloutType: insight
            claimRefs:
              - CO005
              - CO006
              - CO009
          - type: callout
            title: Stretched Multiple and Primary Valuation Recalibration Risk
            body: >-
              Lyra Health's $5.58 billion to $5.85 billion valuation benchmark dates to its January 2022 Series F
              financing [CO006, CO013]. With external revenue benchmarks estimated in the $200 million to $243 million
              range, Lyra's implied price-to-revenue multiple sits above 20x [CO001, CO013]. In the absence of an
              updated primary financing round or public S-1 disclosure, the company faces significant valuation
              recalibration risks given that comparable publicly traded digital health companies trade at single-digit
              revenue multiples [CO013, CO015].
            calloutType: risk
            claimRefs:
              - CO001
              - CO013
              - CO015
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              Lyra's core market is not all mental-health technology. Its website and mobile listing describe an
              organization- or health-plan-sponsored benefit spanning self-care, coaching, therapy, medication support,
              and specialized care. The relevant payer is therefore usually an employer, plan, or channel partner, while
              employees and family members are users. Consumer wellness apps, provider practice-management software, and
              standalone wearables are adjacent categories rather than directly addressable spend. Traditional employee
              assistance programs are the clearest status-quo substitute: Lyra's own EAP explainer describes one to
              three no-cost sessions followed by referral and common fixed-fee arrangements based on employee count.
              Because the only broad market study in the assigned pool says individual consumers are its largest
              end-user, that study's total should be treated as context, not as Lyra's addressable revenue pool.
            claimRefs:
              - CM005
              - CM008
              - CM012
              - CM013
              - CM016
          - type: table
            tableRef: TM001
            claimRefs:
              - CM005
              - CM008
              - CM010
              - CM012
              - CM013
              - CM016
      - number: '2.2'
        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              ResearchAndMarkets estimates the global mental-health technology market at $15.22 billion in 2024 and
              forecasts $30.98 billion by 2030, a 12.58% CAGR. It also reports that software and services represented
              more than 70% and North America more than 50% in 2024. Those two shares are separate cuts of the global
              denominator and cannot be multiplied without evidence about their overlap. Applying each threshold
              independently produces only lower bounds of more than $10.65 billion and more than $7.61 billion,
              respectively. Neither result isolates employer-sponsored benefits, Lyra's eligible-country footprint,
              covered populations, contract values, or expected penetration. Lyra's company-reported reach of more than
              20 million people through direct employer contracts and access pathways for more than 200 million through
              plans and partners indicates distribution scale, not revenue, ARR, market share, SAM, or cash available.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM006
              - CM007
              - CM016
