              - CP009
      - number: '3.3'
        title: Pricing Transparency, Moat Durability, and Market Gaps
        blocks:
          - type: paragraph
            body: >-
              Pricing and commercial models represent a primary differentiator and diligence hurdle in the enterprise
              mental health market [CP007]. Unlike clinical practice software vendors that publish transparent monthly
              SaaS subscription tiers per provider or per client, comprehensive workforce platforms such as Lyra Health
              and Ginger rely on customized enterprise pricing tailored to company size, scope of benefits, and covered
              lives [CP007, CP008]. Lyra's competitive moat rests on high switching costs driven by complex HRIS
              integrations, Single Sign-On (SSO) configurations, and eligibility data transfers, as well as published
              clinical outcomes demonstrating 2x faster recovery and a 26% reduction in healthcare claims costs [CP008,
              CP009, CP010, CP011]. However, the absence of public list pricing and the commoditization of standard
              virtual therapy maintain vendor displacement risks across competitive renewals [CP007, CP012].
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP003
