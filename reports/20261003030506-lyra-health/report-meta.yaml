companyProfile:
  summary: >-
    Lyra Health operates an enterprise mental health benefits platform for employers and health-plan partners, combining
    care navigation, therapy, coaching, psychiatry, and outcomes tracking. The company has a strong brand, broad
    enterprise reach, and a large claimed member footprint, but its private-market financials, retention metrics, and
    contract economics remain opaque.
