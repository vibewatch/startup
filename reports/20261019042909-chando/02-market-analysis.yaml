      - ["Personal and hair care", "Shampoo and personal-care replenishment products", "Household cleaning and unrelated FMCG", "Household shopper paying from personal-care budget", "Adds higher-frequency usage and supports omnichannel replenishment."]
      - ["Sensitive-skin and infant care", "Sensitive-skin, pediatric, and child-care beauty products", "Prescription drug treatment and hospital-delivered care", "Parents or caregivers pay; child is end user", "Extends the buyer set beyond adult self-purchase and raises trust requirements."]
    notes: >-
      Boundary uses prospectus reporting and official product disclosures. Medical aesthetics,
      professional salon services, and non-beauty FMCG are excluded because the retained pool
      only supports consumer-packaged cosmetics and personal-care demand.
    claimRefs: [CM003, CM007, CM014]
