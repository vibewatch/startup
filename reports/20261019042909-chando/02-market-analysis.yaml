      - ["Bamboo Works", "2025", "China domestic-brand share", "57.4% of sales; ~CNY 631 billion implied", "n/a", "Applies domestic-brand share to the same top-down market lens", "Medium", "Share is for domestic brands overall, not Chando's reachable segment."]
      - ["RyanBen Capital / Sina", "2025", "Chando disclosed scale", "CNY 5.318 billion revenue; 554 SKUs", "15.6% YoY revenue growth", "Prospectus summary of reported company results and portfolio breadth", "Medium", "Company scale is not market size and does not isolate serviceable demand."]
      - ["Bamboo Works and 36Kr", "2025", "Chando channel lens", "68.8%-69.5% online revenue share; ~CNY 3.7 billion implied online sales", "n/a", "Bottom-up channel lens using reported online mix", "Medium", "Distribution mix is a reach lens, not a published SAM."]
      - ["36Kr citing CBNData", "2024", "China domestic beauty structure", "55.2% domestic-brand share; top-five concentration still single-digit", "n/a", "Industry-structure lens focused on share and concentration", "Medium", "One year older than the 2025 market-size lens and still not serviceable-market detail."]
    notes: >-
      Rows intentionally combine top-down category data with bottom-up company and channel
      constraints. Derived values are approximate arithmetic from cited shares and reported
      revenue, not separate published market estimates.
    claimRefs: [CM001, CM002, CM004, CM012, CM015, CM016]
