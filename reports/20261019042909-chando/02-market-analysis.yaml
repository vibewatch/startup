callouts:
  - calloutType: "insight"
    title: "Large market, low concentration, weak direct SAM disclosure"
    body: >-
      The market is large enough to matter, but the real diligence question is not whether
      Chinese cosmetics demand exists; it is whether Chando can convert fragmented domestic
      demand into defendable share without relying on one flagship brand and paid traffic.
    claimRefs: [CM001, CM012, CM015]
  - calloutType: "risk"
    title: "Traffic costs and brand concentration can compress TAM capture"
    body: >-
      Even with domestic beauty growth, valuation upside is capped if traffic acquisition
      gets more expensive, R&D stays light, and non-flagship brands remain too small to
      diversify demand capture.
    claimRefs: [CM005, CM013, CM016]
