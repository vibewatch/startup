company:
  name: "Chando"
chapter:
  number: 2
  title: "Market Analysis"
  summary: >-
    Chando sells into a very large but still fragmented China cosmetics market: Bamboo Works
    cites a 1.1 trillion yuan category in 2025 with domestic brands already above half of
    sales, while 36Kr still describes top-five domestic concentration as single-digit in
    2024. Public evidence supports a broad TAM plus bottom-up revenue, channel, and brand
    concentration lenses, but not a clean disclosed SAM or SOM; adoption remains tied to
    mass-market pricing, ecommerce traffic, and whether Chando can turn science-led
    positioning into less concentrated multi-brand demand.
sections:
  - id: "market-boundary-and-sizing"
    title: "Market boundary and sizing logic"
    body: >-
      The retained evidence frames Chando as a mass-beauty company rather than a prestige
      luxury house or a medical-aesthetics platform. Bamboo Works says domestic brands are
      taking share in China's 1.1 trillion yuan cosmetics market and that Chando generally
      sells below 300 yuan per product, while prospectus reporting summarized by RyanBen
      describes a five-brand portfolio covering skincare, color cosmetics, personal care,
      men's care, and children or baby care. That means the practical market boundary here
      is consumer-packaged beauty and personal-care spend that can be won through brand,
      efficacy, and channel execution, while clinic procedures, injectables, and unrelated
      household categories stay outside the supported boundary. The large top-down market
      lens matters, but the more relevant sizing insight is that public evidence only
      narrows from overall category spend into Chando's own revenue, channel mix, and brand
      concentration rather than a disclosed serviceable market cut.
    claimRefs: [CM001, CM002, CM003, CM007, CM012, CM015]
    tableRefs: [TM001, TM002]
    figureRefs: [FM001]
  - id: "buyer-segments-and-adoption-path"
    title: "Buyer segments, budget ownership, and adoption path"
    body: >-
      Chando's demand path is still consumer-led, but not monolithic. The portfolio and
      product disclosures point to at least four live buying missions: anti-aging facial
      skincare, sensitive-skin repair, infant and child care, and mass personal-care or
      hair-care replenishment. In each case the end user is usually the consumer or a child
      in the household, while the payer is the individual shopper or caregiver controlling
      a personal-care budget. Adoption is increasingly mediated by digital discovery and
      platform events rather than by legacy counters alone: Bamboo Works reports 69.5% of
      2025 revenue came from online channels even though Chando still had 64,800 retail
      sales points, and JD says personal-care brands grew sharply during the 2026 618
      promotion. 36Kr's account of Jiahua's post-investment work on DTC channels reinforces
      that this is a hybrid model in transition, where ecommerce efficiency matters but
      offline reach still supports sampling, trust, and replenishment.
    claimRefs: [CM004, CM008, CM009, CM011, CM016]
    tableRefs: [TM003]
  - id: "drivers-constraints-and-valuation-importance"
    title: "Growth drivers, constraints, and valuation importance"
    body: >-
      The bull case is straightforward: domestic brands already control more than half of
      category sales, consumers are shifting toward precision beauty and efficacy-oriented
      routines, and proposed 2026 NMPA reforms could reduce launch friction for qualifying
      brands. Chando also keeps presenting science, self-developed ingredients, and
      sustainability as trust-building differentiators. The constraint set is just as
      important for valuation. Bamboo Works says livestreaming commissions for beauty
      influencers rose from about 40% in 2024 to 60% in 2025, Douyin raised skincare
      service fees from 2% to 4%, Chando's own flagship brand still represented 95.3% of
      sales, and independent coverage explicitly flags weak differentiation and low R&D
      intensity as structural risks. In other words, the market is big enough to support
      upside, but near-term value capture depends less on TAM rhetoric than on lowering
      traffic dependence, proving efficacy, and building non-flagship brands that can absorb
      budget without diluting margins.
    claimRefs: [CM005, CM006, CM010, CM013, CM014]
