      - ["Sensitive-skin repair", "Skin-sensitive consumer", "Same as buyer", "Self-funded purchase", "Problem-led search -> trust screening -> repeat if irritation stays low", "Personal-care budget", "Repair proof, soothing claims, and barrier-care credibility."]
      - ["Infant and child care", "Parent or caregiver", "Infant or child", "Household purchaser", "Research-led selection -> pediatric trust check -> replenishment", "Household and child-care budget", "Daily non-drug care, flare management, and pediatric reassurance."]
      - ["Mass personal and hair care", "Household shopper", "Adult household user", "Self-funded purchase", "Promotion-led replenishment through online events and retail points", "Household budget", "Functional improvement plus value pricing and easy availability."]
    notes: >-
      Buyer map is a synthesis from company product disclosures, prospectus reporting, JD's
      platform demand signal, and 2026 beauty-trend reporting. It indicates who controls the
      spend path, not audited customer-segment revenue splits.
