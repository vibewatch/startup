      - Unit
      - Current value / status
      - Quality
      - Diligence ask
    rows:
      - ["Flagship CHANDO brand", "Core skincare-led brand portfolio", "Share of group revenue", "~95% of revenue through 2025H1 (94.6%-95.9% across 2022-2025H1)", "Scaled but highly concentrated", "Provide monthly brand-level revenue, gross margin, and repeat-purchase data."]
      - ["Skincare", "Sell-through across online and offline beauty channels", "Revenue", "RMB 4.573 billion in 2025; >85% of revenue", "Primary revenue pillar", "Break down skincare by hero SKU, channel, and price tier."]
      - ["Personal care", "Adjacency within existing brand architecture", "Revenue", "RMB 340 million in 2025; 6.4% of revenue", "Emerging second category", "Show category margin and whether growth is repeatable without heavy promotion."]
      - ["Other brands (MAYSU / Pufuyan / Spring Summer / Jichu)", "Sub-brand portfolio diversification", "Share of group revenue", "~5% combined through 2025H1", "Still too small to offset flagship dependence", "Disclose brand-level revenue, growth, and profitability by sub-brand."]
    notes: >-
      Prospectus-derived public reporting supplies revenue mix, but not audited
      brand-level gross margin or retention; percentages for 2025H1 and 2025
      come from different articles and should be read as directional, not
      quarter-to-quarter reconciled.
    claimRefs: [CI004, CI005]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Route
      - Public price / unit / contract
      - List vs realized pricing
      - Discounts / unknowns
      - Source signal
    rows:
      - ["Owned online / DTC channels", null, "Realized online revenue reached RMB 3.695 billion in 2025; no public ASP or basket detail in assigned sources", "Discount ladders, return rates, and ad-spend dependency not disclosed", "Prospectus-derived news coverage"]
      - ["Content e-commerce", null, "Jiahua says content e-commerce is the fastest-growing channel; no disclosed take rate or realized pricing", "No disclosed CAC, creator commission, or payback", "Investor/profile coverage"]
      - ["Offline retail terminals", null, "Offline remains material through ~64,800 retail points and 30.2% of 2025 revenue", "No sell-in vs sell-through split, retailer margin, or promotional accrual detail", "Baidu profile plus prospectus-derived news"]
      - ["Consumer SKU list pricing", null, "Assigned official pages reviewed for this chapter do not publish shelf prices or contract terms", "No public evidence on discounts, bundles, or net realized pricing", "Official site and assigned news sources"]
    notes: >-
      Null means the assigned public source pool did not disclose a usable list
      price, contract model, or realized net price; this table records observed
      monetization signals rather than inventing SKU economics.
    claimRefs: [CI006, CI011, CI014]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - ["Gross margin", "66.5% / 67.8% / 69.4% in 2022-2024", "Medium", "Shows a healthy beauty gross-profit layer before selling expense", "Confirm 2025 gross margin and bridge gross-to-contribution margin by channel."]
      - ["R&D intensity", "2.8% (2022) -> 1.7% (2025H1)", "High", "Tests whether the technology story is being funded or hollowed out", "Provide full-year 2025/2026 R&D spend, capitalization policy, and personnel mix."]
      - ["Sales & marketing ratio", "55% of revenue in 2025H1", "High", "Explains why profit quality is sensitive to promotion and channel spend", "Break marketing into brand, performance, influencer, and trade-spend buckets."]
      - ["Cash / burn / runway", null, "Low", "Capital adequacy cannot be underwritten without liquidity disclosure", "Disclose cash, debt, covenant headroom, and monthly operating burn."]
      - ["CAC / payback / contribution margin", null, "Low", "Needed to judge whether online growth is efficient or merely purchased", "Provide channel CAC, repeat rate, cohort payback, and post-return contribution margin."]
    notes: >-
      Null means no retained public source disclosed the metric. Gross margin is
      last published for 2024 in the retained pool, while cost-ratio evidence
      extends into 2025H1, so cross-period comparisons should be treated as
      directional rather than perfectly matched.
    claimRefs: [CI003, CI007, CI008, CI014]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence implies a beauty revenue bridge from proprietary
      ingredients into a five-brand product set, then into online-led sales and
      reported revenue/profit.
    data:
      nodes:
        - id: r-and-d
          label: Proprietary ingredient base
          value: ">20 proprietary raw materials"
          note: "Products using self-developed ingredients account for >80% of revenue."
        - id: portfolio
          label: Brand and SKU portfolio
          value: "5 brands / 554 SKUs"
          note: "Flagship CHANDO plus MAYSU, Pufuyan, Spring Summer, and Jichu."
        - id: category
          label: Category mix
          value: "Skincare >85% of 2025 revenue"
          note: "Personal care contributed RMB 340 million in 2025."
        - id: channels
          label: Channel mix
          value: "Online 69.5% of 2025 revenue"
          note: "Offline still spans ~64,800 retail points and 30.2% of 2025 revenue."
        - id: revenue
          label: Reported revenue
          value: "RMB 5.318 billion (2025)"
          note: "2023-2025 revenue grew from RMB 4.442 billion to RMB 5.318 billion."
        - id: profit
          label: Profit capture
          value: "RMB 351 million net profit (2025)"
          note: "Latest disclosed gross margin in retained sources is 69.4% for 2024."
      edges:
        - from: r-and-d
          to: portfolio
          label: ingredient IP feeds products
        - from: portfolio
          to: category
          label: portfolio still skewed to skincare
        - from: category
          to: channels
          label: category sell-through flows into online-led mix
        - from: channels
          to: revenue
          label: channel execution converts demand into sales
        - from: revenue
          to: profit
          label: gross profit is then reduced by marketing-heavy opex
    approximationNotes: >-
      Revenue and net-profit nodes use 2025 prospectus coverage; the gross
      margin reference is the latest value explicitly published in retained
      sources (2024), so this bridge is directional rather than a reconciled
      accounting waterfall.
    claimRefs: [CI001, CI005, CI006, CI010]
callouts:
  - calloutType: risk
    title: Concentration still overwhelms the growth story
    body: >-
      Even after re-accelerating revenue growth, the group remains dependent on
      one flagship brand for roughly 95% of sales, which leaves the IPO story
      exposed to brand fatigue or channel pressure.
    claimRefs: [CI004, CI011]
  - calloutType: insight
    title: Digital distribution is working, but efficiency is still unproven
    body: >-
      Online revenue is now close to 70% of sales, which supports the digital
      transformation thesis, but public sources still do not disclose CAC,
      payback, or contribution margin by channel.
    claimRefs: [CI006, CI014]
  - calloutType: recommendation
    title: Underwrite only after a liquidity and channel-economics data room
    body: >-
      The next diligence step should be a management pack covering cash, debt,
      runway, inventory turns, channel CAC, and repeat-purchase cohorts before
      treating the IPO valuation as financeable.
    claimRefs: [CI011, CI013, CI014]
