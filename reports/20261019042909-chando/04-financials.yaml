  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: pricing-transparency
      missingEvidence: SKU-level list pricing, realized ASP, discount ladders, and retailer / platform take-rates by channel.
      whyItMatters: Without realized pricing and discount data, revenue quality and margin resilience cannot be separated from promotional intensity.
      diligencePath: Request channel P&Ls and monthly ASP / discount reports for owned e-commerce, content commerce, and offline retail.
      relatedQuestionRefs: [QI005]
      relatedTableRefs: [TI002]
    - type: private-evidence-only
      severity: blocking
      topic: channel-economics
      missingEvidence: CAC, repeat-purchase cohorts, payback periods, return rates, and contribution margin by online and offline channel.
      whyItMatters: Channel growth alone does not show whether digital expansion is value-accretive or merely purchased through marketing spend.
      diligencePath: Ask management for cohort analyses, marketing attribution, and post-return contribution margins by major channel.
      relatedQuestionRefs: [QI003, QI008]
      relatedTableRefs: [TI003]
    - type: private-evidence-only
      severity: blocking
      topic: capital-adequacy
      missingEvidence: Current cash, debt facilities, covenant headroom, monthly burn, runway, and any project-finance or other obligations.
      whyItMatters: The business is pursuing IPO capital and outside investors, but public evidence still cannot prove whether liquidity is sufficient without another raise.
      diligencePath: Obtain the latest monthly cash waterfall, debt schedule, and management liquidity forecast through the planned IPO window.
      relatedQuestionRefs: [QI006, QI007, QI008]
      relatedTableRefs: [TI003]
    - type: private-evidence-only
      severity: material
      topic: working-capital
      missingEvidence: Inventory turns, receivables and payables aging, capex, returns reserve policy, and sell-in versus sell-through reconciliation.
      whyItMatters: Beauty working capital can absorb cash even when reported revenue is growing, especially with broad offline distribution and aggressive promotion.
      diligencePath: Request audited working-capital schedules and a sell-in / sell-through reconciliation for 2024, 2025, and 2026YTD.
      relatedQuestionRefs: [QI008]
      relatedTableRefs: [TI003]
