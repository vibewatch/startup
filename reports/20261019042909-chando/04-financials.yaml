runDate: "2026-10-19"
company:
  name: Chando
chapter:
  number: 4
  title: Financials
  summary: >-
    Public evidence shows a scaled but concentrated beauty business: prospectus
    coverage reports RMB 5.318 billion of 2025 revenue and RMB 351 million of
    net profit, yet roughly 95% of revenue still comes from the flagship CHANDO
    brand and the company is leaning on IPO and pre-IPO capital to fund the
    next leg of growth. The underwriting problem is less top-line visibility
    than missing operating detail: public materials do not disclose realized
    pricing, CAC/payback, cash, debt, runway, or working-capital metrics.
sections:
  - id: revenue-quality
    title: Revenue quality is real, but concentration remains the core weakness
    body: >-
      The public IPO coverage in this pool points to a business with meaningful
      scale rather than an early-stage story: prospectus-based reporting cites
      RMB 4.442 billion, RMB 4.601 billion, and RMB 5.318 billion of revenue in
      2023-2025, with 2025 growth re-accelerating after a softer 2024 profit
      year. The problem is quality concentration. Independent coverage says the
      flagship CHANDO brand contributed roughly 95% of revenue through 2025H1,
      while skincare remained more than 85% of 2025 sales and personal care was
      only beginning to emerge as a second category. That combination makes the
      headline scale financeable, but it does not yet prove diversified revenue
      durability. If the group does list, investors would still be underwriting
      a mostly single-brand, skincare-led earnings base rather than a balanced
      multi-brand beauty portfolio.
    claimRefs: [CI001, CI004, CI005]
    tableRefs: [TI001]
  - id: channels-and-cost-structure
    title: Online DTC is the growth engine, but marketing intensity still dominates
    body: >-
      Channel mix is moving in the right direction for a modern Chinese beauty
      brand. Prospectus-derived coverage says online revenue grew from RMB 2.749
      billion in 2023 to RMB 3.695 billion in 2025, taking channel mix close to
      70% online, while the group still maintained a broad offline footprint.
      That supports the idea that customer activity increasingly converts into
      faster-turning digital sales instead of slower traditional retail sell-in.
      The cost structure is less comforting. Independent adverse coverage says
      R&D intensity fell from 2.8% of revenue in 2022 to 1.7% in 2025H1, while
      2025H1 sales and marketing costs reached 55% of revenue; prospectus
      commentary also ties the 2024 margin dip to heavier brand and product
      marketing. Official company material helps the margin-path case by showing
      real R&D infrastructure and proprietary ingredients, but public evidence
      still points to a business that remains marketing-heavy relative to its
      stated technology positioning.
    claimRefs: [CI006, CI007, CI008, CI009, CI010]
    tableRefs: [TI002]
    figureRefs: [FI001]
  - id: capital-needs
    title: External capital is available, but adequacy cannot be underwritten from public data
    body: >-
      Chando has demonstrated access to outside capital, which matters because
      the company is simultaneously pursuing a Hong Kong IPO and a multi-brand
      repositioning. Assigned reporting says L'Oréal invested RMB 442 million
      and Jiahua Capital invested RMB 300 million in 2025 at roughly RMB 7.0 to
      7.14 billion post-money valuation, while regulators later asked for more
      detail on equity history, paid-in capital, pricing differences, and trust
      or offshore compliance. Adverse reporting further says the failed filing
      delayed a capital plan aimed at brand upgrade, R&D, overseas expansion,
      and M&A or new-brand incubation. What public sources still do not give is
      the cash bridge behind that plan: no retained source in this chapter
      discloses current cash, burn, debt capacity, working capital, or runway.
      That means the company may have financing access, but capital adequacy
      itself is still a diligence item rather than a proved fact.
    claimRefs: [CI011, CI012, CI013, CI014]
    tableRefs: [TI003]
  - id: verdict
    title: Financial verdict
    body: >-
      The financial picture is investable only with caveats. Revenue scale,
      digital channel momentum, and credible outside investors argue that this
      is not a concept-stage brand. But the earnings engine remains narrow:
      flagship-brand dependence is extreme, gross-margin disclosure is dated,
      and public evidence shows a cost mix still tilted toward selling expense
      rather than rising R&D intensity. Most importantly, the chapter cannot
      independently underwrite realized pricing, customer-acquisition
      efficiency, contribution margin, inventory intensity, or liquidity. The
      right conclusion is that Chando may have enough commercial traction to
      support an IPO narrative, but not enough disclosed operating detail for a
      high-conviction underwriting case without management data-room support.
    claimRefs: [CI004, CI007, CI008, CI011, CI014]
