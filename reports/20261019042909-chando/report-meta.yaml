    Chando is a Shanghai-founded Chinese beauty group centered on the CHANDO skincare brand and organized as a pre-IPO
    Hong Kong listing applicant. Current evidence supports real scale—RMB 5.318 billion of 2025 revenue and RMB 351
    million of net profit—but it also keeps the diligence lens pointed at brand concentration, founder-family control,
    and incomplete disclosure on liquidity, customer economics, and operating efficiency.
