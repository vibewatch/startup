  topStrengths:
    - Real operating scale with profitable 2025 revenue and a live Hong Kong listing path.
    - Outside capital and strategic investors validate institutional interest in the business.
    - Online distribution momentum supports the digital-growth thesis.
    - Ingredient-led product and channel execution keep the brand platform differentiated.
  topRisks:
    - Flagship-brand dependence remains extreme and leaves the story exposed to concentration risk.
    - Founder-family control and IPO execution risk continue to complicate public-market underwriting.
    - Marketing-heavy economics and falling R&D intensity weaken the technology-premium case.
    - Public evidence still lacks cash, debt, CAC, payback, and inventory detail.
  unresolvedGaps:
    - >-
      Final IPO price range, proceeds plan, dilution mechanics, and any preference or conversion terms tied to the
      pre-IPO financing.
    - >-
      Post-promotion unit economics, including CAC, repeat-purchase behavior, contribution margin, and channel-level
      payback.
    - Evidence that non-flagship brands can become meaningfully accretive and reduce the group's dependence on CHANDO.
    - >-
      Clearer supplier, manufacturing, and compliance-detail disclosure beyond high-level quality-system and
      digital-stack descriptions.
