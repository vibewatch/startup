          outputs:
            - 补水
            - 修护
            - 抗衰
            - 敏感肌
            - 个护邻近品类
        - label: 品牌 / 产品组合层
          detail: 五品牌组合以 CHANDO 为经济中心，MAYSU、imine、Biorrier 和其他产品线作为相邻资产。
          modules:
            - CHANDO
            - MAYSU
            - imine
            - Biorrier
            - 个护延伸
        - label: 成分与研究层
          detail: 喜马拉雅来源成分计划、HiMurchaSin 平台和微生物菌种库工作，为差异化主张提供支撑。
          outputs:
            - 20+ 种自研成分
            - 558 种独特菌株
            - 67 个使用 HiMurchaSin 的配方
        - label: 配方与上市层
          detail: 主打产品迭代将研发主张转化为商业上市，例如第七代 Time Frozen / Rejuvenation Repairing 系列。
          outputs:
            - 主打 SKU 迭代
            - 系列延伸
            - 由营销活动驱动的上市
        - label: 生产与渠道层
          detail: 自产能力加上 DTC / 内容电商运营，把产品推向线上渠道、会员和零售触点。
          outputs:
            - 68.8%–69.5% 线上收入
            - 4250 万会员
            - 云店自提 / 送货上门
        - label: 信任与合规层
          detail: 动物测试资质和化妆品宣称边界可见，但更广泛的安全 / 隐私 / 认证证据尚未公开。
          outputs:
            - 测试政策披露
            - NMPA 宣称提醒
            - 控制措施方面的公开尽调缺口
    approximationNotes: 仅使用有来源的运营层和引用指标；这是定性分层图，不是涵盖所有内部流程的系统图。
    claimRefs:
      - CE001
      - CE003
      - CE005
      - CE007
      - CE009
      - CE010
      - CE013
      - CE014
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 公开客户旅程从发现延伸到重复互动触点，但购买后的经济性仍不透明。
    data:
      nodes:
        - id: awareness
          label: 认知
          title: Awareness
          detail: 旗舰 Chando 将大众市场的国货美妆作为发现入口。
          value: '#2 domestic beauty brand by 2024 retail sales'
        - id: conversion
          label: 转化
          title: Conversion
          detail: 内容电商和 DTC 渠道是主要转化界面。
          value: 68.8%-69.5% online revenue mix by 2025
        - id: omnichannel
          label: 全渠道覆盖
          title: Omnichannel reach
          detail: 即使线上转型后，线下分销覆盖仍然广泛。
          value: 64,800 terminal retail points
        - id: portfolio
          label: 日常扩展
          title: Routine expansion
          detail: 五品牌、554 SKU 的产品组合试图拓宽使用场景和价格带。
          value: 5 brands / 554 SKUs
        - id: engagement
          label: 购买后互动
          title: Post-purchase engagement
          detail: 会员和可持续发展计划是最清晰的公开重复触达界面。
          value: '>10,000 recycling-program participants'
        - id: constraint
          label: 扩张约束
          title: Expansion constraint
          detail: 旗舰品牌仍主导收入，因此扩张仍缺乏充分验证。
          value: 94.6%-95.9% flagship revenue share
    approximationNotes: 这是基于公开证据的表层旅程图，不是转化漏斗；分配证据池没有披露可比的分阶段分母。
    claimRefs:
      - CU001
      - CU003
      - CU005
      - CU006
      - CU007
      - CU010
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 剩余风险最高的部分集中在 IPO / 治理执行、旗舰品牌集中度和营销驱动的经济性，而非已披露的产品事故。
    data:
      columns:
        - 可能性
        - 影响
        - 缓释成熟度
      rows:
        - label: IPO / 治理执行
          note: 重新申报缓解了时间压力，但没有消除负面报道提出的家族控制和披露问题。
          values:
            - label: 高
              tone: high
              note: 首次申报失效后，公司才重新提交申请。
            - label: 高
              tone: critical
              note: 上市支撑资本获取、并购灵活性和治理信号。
            - label: 中
              tone: warning
              note: 保荐人、外部投资人和独立董事能够提供帮助，但核心控制结构仍然存在。
        - label: 旗舰品牌集中度
          note: 产品组合仍极度依赖核心 CHANDO 品牌。
          values:
            - label: 高
              tone: high
              note: 独立报道显示，旗舰品牌收入贡献约为 95%。
            - label: 高
              tone: critical
              note: 核心品牌一旦放缓，会立即冲击增长和议价能力。
            - label: 中低
              tone: risk
              note: 次级品牌正在增长，但基数太小，尚不足以分散集团经济性。
        - label: 营销驱动的利润模型
          note: 收入增长尚未消除利润率波动。
          values:
            - label: 高
              tone: high
              note: 2025 年上半年营销成本达到收入的 55%。
            - label: 高
              tone: critical
              note: 高媒体依赖可以维持收入增长，却可能削弱盈利质量。
            - label: 中
              tone: warning
              note: 管理层可以压低支出，但公开材料没有展示按渠道划分的 ROI 纪律。
        - label: 创新转化风险
          note: 科研产出可见，但公开记录仍显示报告研发强度较低。
          values:
            - label: 中
              tone: warning
              note: 公司确有研发产出，但研发投入强度已经下滑。
            - label: 中高
              tone: risk
              note: 科学叙事若无法变现，会进一步强化当前以营销为主的模式。
            - label: 中
              tone: warning
              note: IFSCC 论文、成分开发和 ESG 目标显示了意图，但商业化证据仍不完整。
        - label: 渠道 / 平台集中度
          note: 线上销售占比高，使执行暴露于内容电商和市场平台变化。
          values:
            - label: 中高
              tone: risk
              note: 公开报道显示，2025 年上半年线上销售占收入的 68.8%。
            - label: 中高
              tone: risk
              note: 平台或算法变化可能同时冲击销售量和付费获客效率。
            - label: 中
              tone: warning
              note: 公司具备 DTC 能力，但分配证据池没有展示各平台的渠道集中度或合同保护。
        - label: 对战略资本的依赖
          note: 近期融资和 IPO 流程有助于流动性，但也提高了执行预期。
          values:
            - label: 中
              tone: warning
              note: 新资本已经到位，但未来灵活性仍取决于上市顺利推进。
            - label: 中高
              tone: risk
              note: 上市延迟或表现疲弱，会拖慢公司所述的扩张、品牌建设和并购选项。
            - label: 中
              tone: warning
              note: 战略投资人和保荐人均已参与，但这种支持不能替代更扎实的底层经济性。
    approximationNotes: 这是基于有来源指标和已披露缓释措施的序数热力图，并非声称存在量化违约概率。
    claimRefs:
      - CR001
      - CR003
      - CR004
      - CR007
      - CR008
      - CR009
      - CR010
      - CR013
      - CR014
      - CR016
  - id: FV001
    title: 上市到推荐的逻辑链
    type: flow
    summary: 由于真实规模和并不明显偏高的私募估值被集中度、治理和 IPO 阻力风险抵消，推荐仍为跟踪。
    data:
      nodes:
        - id: scale
          label: 规模证明
          detail: 2025 年收入 RMB 5.318B、净利润 RMB 351M，显示出后期运营实质。
        - id: funding
          label: 外部验证
          detail: 超过 RMB 700M 的 IPO 前融资，并有 L'Oréal 和嘉华关联方参与，支持机构兴趣判断。
        - id: valuation
          label: 估值背景
          detail: 上次披露的私募估值隐含 2025 年销售额约 1.34 倍，低于可见的 Proya 公开销售倍数。
        - id: concentration
          label: 集中度风险
          detail: 旗舰 CHANDO 在 2025 年仍贡献 95.3% 的收入。
        - id: execution
          label: 执行与治理风险
          detail: 此前申报已经失效；负面报道指出营销投入重、研发强度下降以及家族控制集中。
        - id: recommendation
          label: 跟踪 / 合理 / 高风险
          detail: 等待 IPO 价格、结构，以及收入结构多元化方面更清晰的证据，再评估上行空间。
      edges:
        - from: scale
          to: funding
          label: 使外部资本变得可信
        - from: funding
          to: valuation
          label: 设定最后披露的私募估值
        - from: valuation
          to: concentration
          label: 需要质量折价
        - from: concentration
          to: execution
          label: 增加投资判断阻力
        - from: execution
          to: recommendation
          label: 让推荐维持跟踪
    approximationNotes: 约 1.34 倍销售额这一数字，是将披露的 RMB 7.14B 投后估值除以已报告的 2025 年收入后得到的简单隐含倍数。
    claimRefs:
      - CV001
      - CV007
      - CV008
      - CV010
      - CV006
      - CV011
      - CV012
      - CV013
