      - number: '1.2'
        title: 领导层、家族控制与治理状况
        blocks:
          - type: paragraph
            body: >-
              治理权仍高度集中在 Zheng 家族。当前证据称，Zheng Chunying 及其兄弟姐妹在上市前控制公司约 87.82%；董事会有 9
              名执行、非执行和独立董事。席位划分并未消除关键人物依赖：创始人仍主导经营与资本市场叙事，Jumeili / Sina 描述的 2026
              年审视也说明控制透明度的重要性。尽调核心不是公司有没有董事会，而是家族控制、关联方影响和投资者保护是否足以支撑公开市场转型。
            claimRefs:
              - CO004
              - CO005
              - CO014
