      - number: '3.2'
        title: 竞争优势来自品类广度、渠道与科学叙事
        blocks:
          - type: paragraph
            body: >-
              Chando 的最佳竞争资产是品类广度和分销，而非单点突破。官方材料覆盖护肤、彩妆、面膜、男士护理和个护；IPO 材料描述五品牌架构，2025 年 CBE 还显示
              CHANDO、MAYSU、imine、Biorrier 都在推广。独立报道称 2025 年线上销售约占收入 70%，线下仍覆盖全国 64,800 个终端。官方还披露 20 个实验室、超过 140 名研究人员和超过
              20 种自研成分。这些成分、品牌广度和全渠道触达让 Chando 保持在大众美妆买家考虑名单中。
