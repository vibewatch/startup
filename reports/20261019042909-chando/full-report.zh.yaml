      - number: '1.3'
        title: 融资历程、IPO 路径与里程碑解读
        blocks:
          - type: paragraph
            body: >-
              资本形成易于概括，却更难纳入投资判断。Multiples 称，一轮已披露的 2025 年 10 月融资设定 $1.0 billion 估值，使累计披露融资达到 $104 million，由 Harvest
              Capital 领投、L'Oréal 战略参与。外部支持和 2026 年 4 月重新申报香港上市显示公司有野心，但 IPO 路径并不顺畅：独立负面报道称首次申报 6
              个月后失效，争议集中于旗舰品牌集中、研发强度下降、治理复杂度及许可或离岸架构。公司有规模和品牌历史，但能否投资仍取决于更新申报能否把家族控制、营销驱动的集团转成公众投资者可接受的治理与披露形态。
