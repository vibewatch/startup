    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司身份、品牌组合与当前规模
        blocks:
          - type: paragraph
            body: >-
              现有证据仍支持 Chando 是一家源自上海、以护肤及更广泛个护产品销售为核心、如今明确归于 Shanghai CHANDO Group 的美妆公司。当前规模数据来自 2026 年香港重新申报摘要：Ryanben
              Capital 转述称，截至 2025-12-31，集团有 5 个主要品牌和 554 个 SKU；同一来源披露 2025 年收入 RMB 5.318 billion、净利润 RMB 351
              million。公司已具实质规模，但客户数、员工数和运营覆盖广度仍未在留存证据中披露，应作为明确尽调缺口，不能从收入或品牌广度反推。
            claimRefs:
