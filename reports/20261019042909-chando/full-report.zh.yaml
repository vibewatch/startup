              已披露估值可用于情景框架，却不足以形成精确目标。RMB 7.14 billion 私募估值按 RMB 5.318 billion 收入计算约为 2025 年销售额 1.34x，低于 2026-06-30 附近
              Proya 的 2.11x 市销率和 1.64x 企业价值 / 收入（EV/S）；单看此维度，Chando 不明显昂贵。 但同业判断须对质量和组合打折：Chando 更集中于单一旗舰，2025H1 研发强度降至
