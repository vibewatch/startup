        blocks:
          - type: paragraph
            body: >-
              退出准备度真实但不完整。Chando 已重启香港 IPO，有盈利财务、外部战略和财务投资者，以及多品牌扩张、数字运营和成分研发叙事，因此仍具投资可能。 但指定证据没有最终 IPO
              价格区间、募资计划、锁定期或优先权机制，也没有重线上销售后的渠道单位经济性；公开报道仍显示单一核心品牌依赖、营销激进而研发偏轻。在缺口补齐前，应留在观察名单，只有价格、结构和促销后经济性改善收益风险不对称时才参与。
              逻辑破坏触发器可量化：香港路径再次失效或重大延期；旗舰集中度超过 90%；销售及营销强度仍高于收入一半却无更好利润质量；或外部投资者条款让 IPO 新资金买家结构上处于次级地位。
