  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与入场纪律
        blocks:
          - type: paragraph
            body: >-
              公开证据支持建设性但严格受价格约束的立场。Chando 2025 年收入 RMB 5.318 billion、净利润 RMB 351 million，并从 L'Oréal 和 Jiahua
              相关实体获得外部资本，披露投后估值约 RMB 7.14 billion。这不是概念品牌，而是已有盈利、按香港上市包装的后期美妆平台。 但旗舰 CHANDO 仍贡献 2025 年收入 95.3%，Zheng
              兄弟姐妹保留约 87.82% IPO 前持股，负面报道还指出集中度、营销效率和此前申报失效的聆讯摩擦。因此只有在入场价格合适、且严格尽调当前融资定价能否通过公开市场审视时，公司才具投资性。
              正确判断是**跟踪**而非买入：私募定价相对公开美妆可比并未明显过高，但在最终 IPO 区间、募资用途和 IPO 前条款遗留问题明确前，证据尚未足以支持按此价格追高。
