      - CV002
      - CV003
      - CV006
      - CV008
      - CV009
      - CV011
      - CV012
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 乐观
        - IPO 募资按计划完成，新品牌和研发叙事开始降低对旗舰品牌的依赖，公开市场投资人愿意为盈利能力和国货美妆领导地位支付溢价。
        - 以 2025 年销售额的约 1.8–2.2 倍为敏感性区间，对应约 RMB 9.6–11.7B 股权价值；上行需要证据证明 Chando 能缩小与更强公开可比公司的质量差距。
        - 再次延迟申报或品牌结构未能多元化，都会打破重估逻辑。
        - 需要独立证据证明集中度正在下降，且以营销为主的增长正在转化为可持续的利润质量。
      - - 基准
        - IPO 路径保持开放，增长和利润维持不变，但集中度与治理疑虑限制重估空间。
        - 以 2025 年销售额的约 1.3–1.6 倍为敏感性区间，对应约 RMB 6.9–8.5B，集中在最后披露的 RMB 7.14B 私募估值附近。
        - 如果发行条款对投资人不友好，甚至这个区间也可能偏慷慨。
        - 与当前证据集一致：规模真实、投资人真实，但还没有足够证据支持溢价判断。
      - - 悲观
        - 上市拖延、渠道经济性令人失望，或新披露使营销 / 控制 / 集中度画像更难评估。
        - 以 2025 年销售额的约 0.8–1.1 倍为敏感性区间，对应约 RMB 4.3–5.9B，与下轮融资或折价 IPO 结果一致。
        - 如果执行停滞或公开市场买方要求更高风险折价，下行可能迅速到来。
        - 触发因素包括重新出现的申报阻力、盈利质量恶化，或证据证明品牌扩张没有降低对 CHANDO 的依赖。
    notes: 情景区间是锚定已披露 2025 年收入和可见 Proya 公开市场倍数的启发式敏感性区间；不是正式 DCF 或目标价模型。
    claimRefs:
      - CV002
      - CV003
      - CV006
      - CV011
      - CV012
      - CV013
      - CV014
