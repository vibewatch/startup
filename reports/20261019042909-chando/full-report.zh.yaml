      - 含义
    rows:
      - - Chando
        - 未披露可比 SKU 价格梯度；官方信息强调“最合理的价格”和全渠道零售，而非合同
        - 以喜马拉雅自然科技为定位的全品类美容和个人护理
        - 留存证据中没有公开折扣节奏、ASP 或零售商合同条款
        - 高性价比是其宣传的一部分，但公开定价透明度较弱
      - - Proya
        - 留存证据中没有公开价格梯度
        - 规模领先和更高的第二品牌贡献度清晰可见
        - 此处未披露包装规格、标价或促销节奏
        - 基于这组证据，Chando 尚不能证明相对国产龙头的价格优势
      - - 上美 / 韩束
        - 留存证据中没有公开价格梯度
        - 抖音驱动的分销优势清晰可见
        - 此处未披露折扣、捆绑销售或合同细节
        - 在这场竞争中，渠道执行可能比标价更重要
      - - 与 L’Oréal 相关的在位者
        - 留存证据中未披露中国标价或合同条款
        - 全球品牌规模、更高的被引用研发基准，以及对 Chando 的战略投资
