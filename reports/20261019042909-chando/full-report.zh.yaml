  - id: TP002
    title: 特征 / 能力矩阵
    columns:
      - 购买标准
      - Chando
      - 国产同行基准
      - 在位者 / 邻近基准
      - 含义
    rows:
      - - 产品组合广度
        - 官方及与 IPO 相关的来源显示其覆盖多个品类，并拥有五品牌集团
        - 即使多元化有所改善，同行证据仍强调主力品牌经济性
        - L’Oréal 在留存证据中被视为全球多品牌在位者
        - Chando 确有广度，但并非显然独有
      - - 渠道杠杆
        - 独立报道称 2025 年线上占比达到 69.5%，线下仍有 64,800 个零售点活跃
        - 上美以抖音优势被引用，Proya 则以更大收入规模被引用
        - 在位者的本地渠道拆分在此未披露，但品牌力在结构上更强
        - Chando 可以在触达上竞争，但同行已占据重要渠道优势
      - - 科学 / 研发能力
        - 官方来源披露有 20 个实验室、140 多名研究人员和 20 多种自研成分
        - 独立报道仍称 Chando 的研发投入强度落后于贝泰妮、华熙生物等科学驱动型同行
        - 负面报道明确将 L’Oréal 作为更高研发水平的基准
        - 科学叙事有助于差异化，但投入强度仍会引发质疑
      - - 治理 / 信任
        - 家族控制权仍为 87.82%，香港 IPO 在监管补充问询后不得不重新递交
        - 上市同行此前已通过公开市场审视
        - 在这组证据中，跨国在位者不承担同等的重新上市证明负担
        - 对 Chando 而言，信任仍是执行变量，而非已经坐实的优势
      - - 多元化韧性
        - 约 95% 收入仍来自旗舰品牌
        - Proya 披露 Proya 占 74.27%、彩棠占 13.17%；上美披露韩束占 81.4%、一叶子占 9.6%
        - 在此未量化在位者的多元化程度，但留存证据仍将全球集团视为结构上更广泛
        - Chando 的护城河比其产品组合叙事所暗示的更浅
    notes: 该矩阵仅使用留存证据。“国产同行基准”和“在位者 / 邻近基准”总结该标准下已披露的最强命名可比对象，并不声称覆盖完整市场。
    enumerationScope:
      coverage: partial
      basis: >-
        Buying-criteria comparison limited to what the retained evidence discloses about Chando and its explicitly named
        domestic and incumbent benchmarks.
    claimRefs:
      - CP003
      - CP005
      - CP007
      - CP009
      - CP011
      - CP013
      - CP014
