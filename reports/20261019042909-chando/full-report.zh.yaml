  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入质量真实存在，但集中度仍是核心弱点
        blocks:
          - type: paragraph
            body: >-
              公开 IPO 报道指向一个规模可观而非早期项目型业务：招股书报道称 2023—2025 年收入分别为 RMB 4.442 billion、RMB 4.601 billion、RMB 5.318
              billion，2025 年增长在 2024 年利润走弱后重新加速。问题是收入质量集中：旗舰 CHANDO 截至 2025H1 约贡献 95%，护肤占 2025 年销售额 85%
              以上，个护才开始成为第二品类。规模可融资，但尚未证明收入能持久多元化；上市后投资者承销的仍主要是单品牌、护肤驱动盈利基础。
            claimRefs:
              - CI001
              - CI004
              - CI005
          - type: table
            tableRef: TI001
            claimRefs:
              - CI004
              - CI005
      - number: '4.2'
        title: 线上 DTC 是增长引擎，但营销强度仍占主导
        blocks:
          - type: paragraph
            body: >-
              渠道组合正向现代中国美妆方向移动：线上收入从 2023 年 RMB 2.749 billion 增至 2025 年 RMB 3.695 billion，占比接近
              70%，同时保持广泛线下覆盖。成本结构不那么乐观：独立报道称研发强度从 2022 年 2.8% 降至 2025H1 1.7%，2025H1 销售及营销费用达收入 55%；招股书评论把 2024
              年利润率下滑与更重营销联系起来。官方研发基础设施和专有成分支持利润率改善逻辑，但公开证据仍显示业务相对技术定位营销偏重。
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
              - CI010
          - type: table
            tableRef: TI002
            claimRefs:
              - CI006
              - CI011
              - CI014
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI005
              - CI006
              - CI010
      - number: '4.3'
        title: 外部资本可得，但无法仅凭公开数据评估充足性
        blocks:
          - type: paragraph
            body: >-
              Chando 已证明能获得外部资本；报道称 L'Oréal 投资 RMB 442 million、Jiahua Capital 在 2025 年投资 RMB 300 million，对应投后估值约 RMB 7.0
              至 7.14
              billion；监管机构随后要求补充股权历史、实缴资本、定价差异及信托或离岸合规。负面报道称申报失败推迟了品牌升级、研发、海外扩张及并购或新品牌孵化计划。但没有留存来源披露现金、消耗速度、债务能力、营运资本或
              runway。因此公司可能有融资渠道，资本充足性仍是尽调事项而非已证事实。
            claimRefs:
              - CI011
              - CI012
              - CI013
              - CI014
          - type: table
            tableRef: TI003
            claimRefs:
              - CI003
              - CI007
              - CI008
              - CI014
      - number: '4.4'
        title: 财务结论
        blocks:
          - type: paragraph
            body: >-
              财务图景只有带限定条件才具投资性。收入规模、数字渠道动能和外部投资者说明这不是概念品牌，但盈利引擎仍窄：旗舰依赖极高，毛利率披露过时，成本组合仍偏销售费用而非研发上升。公开证据无法独立评估实际定价、CAC
              效率、贡献利润率、库存强度或流动性。Chando 可能有足够商业牵引力支撑 IPO 叙事，但没有管理层数据室时，披露不足以形成高确信度投资判断。
            claimRefs:
              - CI004
              - CI007
              - CI008
              - CI011
              - CI014
      - number: '4.5'
        title: 图表与要点
        blocks:
          - type: callout
            title: 集中度仍压过增长故事
            body: 即使收入增长重新加速，集团仍约 95% 依赖一个旗舰品牌，IPO 叙事因此暴露于品牌疲劳或渠道压力。
            calloutType: risk
            claimRefs:
              - CI004
              - CI011
          - type: callout
            title: 数字分销有效，但效率尚未验证
            body: 线上收入接近销售额 70%，支持数字化转型；但公开来源仍未披露按渠道拆分的 CAC、回本周期或贡献利润率。
            calloutType: insight
            claimRefs:
              - CI006
              - CI014
          - type: callout
            title: 拿到流动性与渠道经济性数据室后再评估投资
            body: 下一步应取得覆盖现金、债务、runway、库存周转、渠道 CAC 和复购 cohort 的管理层资料包，再把 IPO 估值视为可融资。
            calloutType: recommendation
            claimRefs:
              - CI011
              - CI013
              - CI014
  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品范围广，但运营仍锚定旗舰护肤品牌
        blocks:
