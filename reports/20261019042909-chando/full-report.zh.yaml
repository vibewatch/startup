            body: 跟踪 Chando，不要过早买入：可见私募定价足以保持投资性，但不便宜到可以忽略集中度、治理和 IPO 结构风险。
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV006
              - CV011
              - CV012
              - CV013
          - type: callout
            title: 什么情况会提升判断
            body: 更顺畅的公开申报路径、独立证明新品牌能稀释旗舰组合，以及不把 IPO 溢价嵌入基准区间之上的发行条款，是重新审视判断的最清晰理由。
            calloutType: assumption
            claimRefs:
              - CV001
              - CV003
              - CV006
              - CV012
