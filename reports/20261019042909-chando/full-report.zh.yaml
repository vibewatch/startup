  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与规模测算逻辑
        blocks:
          - type: paragraph
            body: >-
              留存证据把 Chando 定位为大众美妆公司，而非高端奢侈品牌或医美平台。Bamboo Works 称，国内品牌正在中国 1.1 trillion yuan 化妆品市场夺取份额，Chando 单品通常低于 300
              yuan；RyanBen
              汇总的招股书报道称，五品牌组合覆盖护肤、彩妆、个护、男士护理及儿童或婴幼儿护理。实际边界是可通过品牌、功效和渠道执行争取的消费美妆与个护支出；诊所项目、注射类产品和无关家居品类不在证据支持范围。公开证据只能从整体品类支出收窄到
              Chando 自身收入、渠道组合和品牌集中，尚未披露可服务市场切分。
            claimRefs:
