      - number: '3.3'
        title: 旗舰集中与审视限制护城河持久性
        blocks:
          - type: paragraph
            body: >-
              最强反向证据是广度尚未转化为同业级收入多元化。多个独立来源称旗舰 CHANDO 仍贡献约 95% 收入，子品牌太小，无法抵消主品牌失速。Xinhua 的比较显示 Proya、Shangmei
              集中度更低；其他报道批评营销过重、研发强度下降、公开市场信任叙事未定。2026 年 4 月重新申报还伴随据报 CSRC 问题，涉及股权历史、实缴资本、IPO 前定价和离岸 /
              家族信托合规。护城河更多来自产品主张、品牌叙事和分销执行，而非结构性锁定；留存证据没有长期切换壁垒或透明定价证明客户被锁定。
