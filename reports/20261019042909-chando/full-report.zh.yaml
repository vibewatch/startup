            title: 旗舰集中最清楚地说明 Chando 的护城河尚未稳固
            body: 多个独立来源仍称旗舰 CHANDO 约占收入 95%；Proya 和 Shangmei 集中度更低，因此主品牌势头减弱时 Chando 暴露更大。
