  - id: TV002
    title: 正 / 反论点表
    columns:
      - 论点
      - 证据
      - 哪些变化会改变判断
    rows:
      - - 规模和盈利是真实的
        - 据报道，2025 年收入为 RMB 5.318B、净利润为 RMB 351M，规模已足以支撑一场严肃的公开市场进程。
        - 重新提交申请后盈利反转，或出现一次性收益支撑的证据，都会削弱这一判断。
      - - 外部资本验证了机构兴趣
        - 已披露的 IPO 前融资超过 RMB 700M，隐含投后估值 RMB 7.14B，并有 L'Oréal 和嘉华关联方参与。
        - 如果披露的 IPO 区间明显低于上一轮私募估值，说明该轮融资并未完全转化为公开市场支持。
      - - 执行上有上行空间，但目前主要仍是管理层叙事
        - 官方材料描述了多品牌扩张、端到端数字化，以及成分驱动的研发 / ESG 计划。
        - 如果有独立证据证明新品牌和自研成分已成为重要收入来源，论点会得到加强。
      - - 核心反论点是集中度叠加效率风险
        - 独立负面报道强调了对品牌的依赖、高营销强度、较低研发强度、家族控制和上市阻力。
        - 更顺畅的 IPO、较低的旗舰品牌收入占比和更高的投入产出效率，会削弱反论点。
    notes: 正向论据部分来自公司控制的来源，因此从“跟踪”转为“买入”的门槛，是独立证据确认收入结构多元化和渠道经济性。
