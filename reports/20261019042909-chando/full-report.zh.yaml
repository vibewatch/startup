        blocks:
          - type: callout
            title: Chando 处于强势中游，而非明确的国内龙头
            body: 留存证据仍支持 Chando 是国内头部美妆集团，但独立同业报道显示其近期规模低于最强国内上市龙头，信任度和研发强度也低于成熟龙头基准。
            calloutType: insight
