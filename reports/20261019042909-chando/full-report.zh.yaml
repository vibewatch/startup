      - number: '2.2'
        title: 买方细分、预算归属与采用路径
        blocks:
          - type: paragraph
            body: >-
              Chando 的需求路径仍由消费者驱动，但并非单一模式。产品披露指向至少 4
              种购买场景：抗老面部护肤、敏感肌修护、婴幼儿护理，以及大众个护或洗护补充。最终使用者通常是消费者或家庭中的孩子，付款者是掌控个护预算的买家或照护者。数字发现和平台活动日益重要：Bamboo Works 报道
              2025 年收入的 69.5% 来自线上，尽管 Chando 仍有 64,800 个零售销售点；京东称个护品牌在 2026 年 618 促销期间大幅增长。36Kr 对 Jiahua 投资后 DTC
              工作的报道说明这是转型中的混合模式：电商效率重要，线下触达仍支持试用、信任和复购。
            claimRefs:
              - CM004
              - CM008
              - CM009
              - CM011
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM004
              - CM008
              - CM009
              - CM011
              - CM014
      - number: '2.3'
        title: 增长驱动、约束与估值意义
        blocks:
          - type: paragraph
            body: >-
              乐观情景是国内品牌已掌握超过一半品类销售，消费者转向精准美妆和功效护理，拟议 2026 年 NMPA 改革可能降低合规品牌上市摩擦。Chando
              还把科学、自研成分和可持续性作为信任差异化。约束同样重要：Bamboo Works 称美妆主播直播佣金从 2024 年约 40% 升至 2025 年 60%，抖音服务费从 2% 升至 4%；旗舰品牌仍占销售
              95.3%，独立报道指出差异化弱和研发强度低是结构性风险。市场虽大，短期价值捕获仍取决于降低流量依赖、证明功效和培育不稀释利润率的非旗舰品牌，而非 TAM 叙事。
            claimRefs:
              - CM005
              - CM006
              - CM010
              - CM013
              - CM014
      - number: '2.4'
        title: 图表与要点
        blocks:
          - type: callout
            title: 市场很大、集中度较低，但直接 SAM 披露薄弱
            body: 市场足够大，值得关注；真正的尽调问题不是中国是否存在化妆品需求，而是 Chando 能否在不依赖单一旗舰品牌和付费流量的情况下，把分散需求转成可守住的份额。
            calloutType: insight
            claimRefs:
              - CM001
              - CM012
              - CM015
          - type: callout
            title: 流量成本与品牌集中会压缩 TAM 获取空间
            body: 即便国内美妆增长，流量获客变贵、研发偏轻、非旗舰品牌过小，仍会压低估值上行空间。
            calloutType: risk
            claimRefs:
              - CM005
              - CM013
              - CM016
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争同业：国内龙头、上市专业品牌与跨国公司
        blocks:
          - type: paragraph
            body: >-
              留存证据显示竞争集合远不止单一国内护肤同业：Proya、Shangmei、Marubi 是规模、多元化和资本市场准备度的直接比较对象；L'Oréal 既是战略投资者，也是国际品牌实力和研发可信度基准。Chando
              并非微型利基品牌，官方及 IPO 来源仍按零售销售额将其定位为国内头部集团；但独立报道显示其近期收入排名落后于增长更快的上市同业。因此核心问题是其位置能否同时抵御国内上市竞争者和跨国巨头。
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP007
              - CP008
