  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: operating-scale-gaps
      missingEvidence: Current public customer-count, headcount, and site-footprint disclosures tied to the active filing cycle.
      whyItMatters: These metrics are core cover facts for later commercial and valuation chapters and cannot be inferred safely from revenue.
      diligencePath: Request the latest IPO filing tables or management KPI pack covering customers, employees, and operating locations.
      relatedQuestionRefs: [QO008]
      relatedTableRefs: [TO002, TO003]
    - type: missing-source
      severity: material
      topic: ipo-terms
      missingEvidence: Final IPO price range, proceeds allocation, dilution mechanics, and any investor preference or conversion terms.
      whyItMatters: Current valuation judgment cannot bridge the 2025 private round to public-market entry without knowing the offering structure.
      diligencePath: Review the next active HKEX prospectus and any cornerstone-investor disclosures once available.
      relatedQuestionRefs: [QO003]
    - type: conflicting-data
      severity: material
      topic: governance-scrutiny
      missingEvidence: Primary-source resolution of the 2026 concerns around trust control, historical pricing, and licensing compliance.
      whyItMatters: The current adverse reporting names the issues, but not whether they were fully resolved in the refiled materials.
      diligencePath: Compare the March 2026 criticism with the full April 2026 refiling and subsequent regulator responses.
      relatedQuestionRefs: [QO006]
