company:
  name: Chando
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Chando enters this refresh as a large but still tightly controlled Chinese beauty group:
    assigned-pool evidence supports a $1.0 billion October 2025 valuation, a single disclosed
    outside round totaling $104 million, and 2025 revenue of RMB 5.318 billion. The same
    evidence also keeps the risk lens active because the flagship CHANDO brand still appears to
    dominate revenue, the March 2026 Hong Kong filing lapse exposed governance and disclosure
    scrutiny, and key public scale metrics such as customer count and headcount remain unsupported.
sections:
  - id: identity-and-scale
    title: Identity, portfolio, and current scale
    body: >-
      The assigned evidence still supports Chando as a Shanghai-founded beauty company built around
      skincare and broader personal-care product sales, with the modern group identity now
      explicitly organized under the Shanghai CHANDO Group name. The most current scale markers in
      this pool come from the 2026 Hong Kong refiling summary rather than old background sources:
      Ryanben Capital's reposted filing summary says the group had five main brands and 554 SKUs as
      of 2025-12-31, while the same source reports RMB 5.318 billion of 2025 revenue and RMB 351
      million of net profit. This makes the business materially scaled, but not fully transparent:
      customer count, headcount, and operating footprint breadth are still not disclosed in the
      retained evidence and should remain explicit diligence gaps rather than inferred from revenue
      or brand breadth.
    claimRefs: [CO001, CO002, CO003, CO009, CO010]
    tableRefs: [TO001]
  - id: leadership-and-control
    title: Leadership, family control, and governance posture
    body: >-
      Governance remains highly concentrated around the Zheng family. The current filing-cycle
      evidence says Zheng Chunying and his siblings controlled about 87.82% of the company before
      listing, while the board structure remained formalized enough to include nine directors split
      across executive, non-executive, and independent seats. That split does not remove key-person
      dependence: the founder remains central to both operating narrative and capital-markets
      narrative, and the 2026 scrutiny described by Jumeili/Sina shows why control transparency
      matters. For diligence purposes, the central question is not whether the company has a board,
      but whether concentrated family control, related-party influence, and investor protections are
      robust enough for a public-market transition.
    claimRefs: [CO004, CO005, CO014]
    tableRefs: [TO002, TO003]
  - id: capital-history-and-milestones
    title: Funding history, IPO path, and milestone read-through
    body: >-
      Capital formation is still easy to summarize but harder to underwrite. Multiples describes a
      single disclosed October 2025 round that set a $1.0 billion valuation and brought lifetime
      disclosed funding to $104 million, led by Harvest Capital with L'Oréal as strategic
      participant. That outside backing and the April 2026 Hong Kong refiling show real ambition,
      yet the IPO path is not clean: independent adverse reporting says the first filing lapsed
      after six months, with debate centering on flagship-brand concentration, falling R&D
      intensity, governance complexity, and licensing or offshore-structure questions. The result
      is a business with genuine scale and brand history, but one whose investability still hinges
      on whether the refreshed filing can convert a family-controlled, marketing-heavy beauty group
      into a governance and disclosure profile public investors will accept.
    claimRefs: [CO006, CO007, CO008, CO009, CO011, CO012, CO013, CO015, CO016]
    figureRefs: [FO001]
