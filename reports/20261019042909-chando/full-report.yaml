  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and sizing logic
        blocks:
          - type: paragraph
            body: >-
              The retained evidence frames Chando as a mass-beauty company rather than a prestige luxury house or a
              medical-aesthetics platform. Bamboo Works says domestic brands are taking share in China's 1.1 trillion
              yuan cosmetics market and that Chando generally sells below 300 yuan per product, while prospectus
              reporting summarized by RyanBen describes a five-brand portfolio covering skincare, color cosmetics,
              personal care, men's care, and children or baby care. That means the practical market boundary here is
              consumer-packaged beauty and personal-care spend that can be won through brand, efficacy, and channel
              execution, while clinic procedures, injectables, and unrelated household categories stay outside the
              supported boundary. The large top-down market lens matters, but the more relevant sizing insight is that
              public evidence only narrows from overall category spend into Chando's own revenue, channel mix, and brand
              concentration rather than a disclosed serviceable market cut.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM007
              - CM012
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM003
