        - Track
        - Advance only if public pricing and structure preserve upside versus the last disclosed private mark.
      - - Confidence
        - Medium
        - Evidence is good enough to frame valuation, but not good enough to underwrite a precise return target.
      - - Risk rating
        - High
        - Brand concentration, family control, and IPO execution risk can still compress entry terms.
      - - Valuation stance
        - Fair
        - >-
          The 7.14 billion RMB private mark is not obviously stretched versus the visible public comp, but it is not
          clearly cheap enough to overcome execution risk.
      - - Entry discipline
        - Price-sensitive
        - Do not commit before the IPO range, proceeds plan, and dilution/preference mechanics are public.
    notes: >-
      Assessment uses only assigned-pool evidence; fair means roughly in line with the disclosed late-stage private mark
      and not a green light to pay any IPO premium.
    claimRefs:
      - CV002
      - CV003
      - CV006
      - CV011
      - CV012
      - CV013
      - CV014
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Argument
      - Evidence
      - What would change the view
    rows:
      - - Scale and profitability are real
        - >-
          2025 revenue was reported at RMB 5.318 billion and net profit at RMB 351 million, which is enough scale for a
          serious public-market process.
        - A reversal in post-refiling profitability or evidence of one-off earnings support would weaken the case.
      - - Outside capital validates institutional interest
        - >-
          The disclosed pre-IPO financing exceeded RMB 700 million and implied a 7.14 billion RMB post-money valuation
          with L'Oréal and Jiahua-linked participation.
        - >-
          A disclosed IPO range materially below the last private mark would imply that the round did not fully
          translate into public-market support.
      - - Execution upside exists but is still mostly management narrative
        - >-
          Official materials describe multi-brand expansion, end-to-end digitalization, and ingredient-led R&D/ESG
          initiatives.
        - >-
          Independent evidence that newer brands and self-developed ingredients become material revenue contributors
          would strengthen the thesis.
      - - Core anti-thesis is concentration plus efficiency risk
        - >-
          Independent adverse reporting highlighted brand dependence, high marketing intensity, lower R&D intensity,
          family control, and listing friction.
        - >-
          A cleaner IPO process plus a lower flagship revenue share and better spend productivity would reduce the
          anti-thesis.
    notes: >-
      The thesis side is partly supported by company-controlled sources, so the bar for moving from track to buy is
      independent confirmation of mix diversification and channel economics.
    claimRefs:
      - CV002
      - CV003
      - CV006
      - CV008
      - CV009
      - CV011
      - CV012
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - >-
          IPO proceeds on schedule, newer brands and R&D narrative start reducing flagship dependence, and public
          investors accept a premium for profitability plus domestic-beauty leadership.
        - >-
          Sensitivity frame of roughly 1.8x-2.2x 2025 sales implies about RMB 9.6-11.7 billion equity value; upside
          requires evidence that Chando can close some of the quality gap to stronger public peers.
        - Another filing delay or failure to diversify brand mix would break the rerating case.
        - >-
          Needs independent proof that concentration is falling and that marketing-heavy growth is converting into
          durable margin quality.
      - - Base
        - IPO path stays open, growth/profit remain intact, but concentration and governance concerns cap rerating.
        - >-
          Sensitivity frame of roughly 1.3x-1.6x 2025 sales implies about RMB 6.9-8.5 billion, clustering around the
          last disclosed 7.14 billion RMB private mark.
        - If offer terms are investor-unfriendly, even this range may prove generous.
        - 'Consistent with the current evidence set: real scale, real investors, but not enough proof for a premium call.'
      - - Bear
        - >-
          Listing drags, channel economics disappoint, or new disclosures make the marketing / control / concentration
          profile harder to underwrite.
        - >-
          Sensitivity frame of roughly 0.8x-1.1x 2025 sales implies about RMB 4.3-5.9 billion, consistent with a
          down-round or discounted IPO outcome.
        - The downside can arrive quickly if execution stalls or public buyers demand a higher risk discount.
        - >-
          Triggered by renewed filing friction, worsening profitability quality, or proof that brand expansion is not
          reducing reliance on CHANDO.
    notes: >-
      Scenario ranges are heuristic sensitivity bands anchored on disclosed 2025 revenue and the visible Proya
      public-multiple reference; they are not a formal DCF or target-price model.
    claimRefs:
      - CV002
      - CV003
      - CV006
      - CV011
      - CV012
      - CV013
      - CV014
