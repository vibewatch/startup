          label: ingredient IP feeds products
        - from: portfolio
          to: category
          label: portfolio still skewed to skincare
        - from: category
          to: channels
          label: category sell-through flows into online-led mix
        - from: channels
          to: revenue
          label: channel execution converts demand into sales
        - from: revenue
          to: profit
          label: gross profit is then reduced by marketing-heavy opex
    approximationNotes: >-
      Revenue and net-profit nodes use 2025 prospectus coverage; the gross margin reference is the latest value
