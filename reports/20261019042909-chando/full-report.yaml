  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, portfolio, and current scale
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence still supports Chando as a Shanghai-founded beauty company built around skincare and
              broader personal-care product sales, with the modern group identity now explicitly organized under the
              Shanghai CHANDO Group name. The most current scale markers in this pool come from the 2026 Hong Kong
              refiling summary rather than old background sources: Ryanben Capital's reposted filing summary says the
              group had five main brands and 554 SKUs as of 2025-12-31, while the same source reports RMB 5.318 billion
              of 2025 revenue and RMB 351 million of net profit. This makes the business materially scaled, but not
              fully transparent: customer count, headcount, and operating footprint breadth are still not disclosed in
              the retained evidence and should remain explicit diligence gaps rather than inferred from revenue or brand
              breadth.
            claimRefs:
