        title: Exhibits
        blocks:
          - type: callout
            title: Chando competes from a strong middle position, not from clear domestic leadership
            body: >-
              The retained evidence still supports Chando as a top-tier domestic beauty group, but independent peer
              coverage places it below the strongest listed domestic leaders on recent scale and below incumbent
              benchmarks on trust and R&D intensity.
            calloutType: insight
            claimRefs:
              - CP002
