              - CP011
              - CP014
          - type: callout
            title: Flagship concentration is the cleanest evidence that Chando's moat is not yet durable
            body: >-
              Multiple independent sources still put about 95% of revenue on the flagship CHANDO brand, while peer
              disclosures show lower concentration at Proya and Shangmei, leaving Chando more exposed if hero-brand
              momentum softens.
            calloutType: risk
            claimRefs:
