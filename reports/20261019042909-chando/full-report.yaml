  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      Ordinal map from retained evidence: Chando sits above niche or single-channel rivals on breadth and reach, but
      still below the strongest incumbent and domestic-benchmark combinations on defensibility.
    data:
      xAxis:
        label: Channel / distribution leverage
        min: 1
        max: 5
        lowLabel: Limited disclosed reach
        highLabel: Strong disclosed reach
        description: Ordinal 1-5 score from retained evidence on offline footprint, online intensity, or platform strength.
        scale: 1-5 ordinal
      yAxis:
        label: Portfolio and differentiation depth
        min: 1
        max: 5
        lowLabel: Narrow / easier to imitate
        highLabel: Broader / more defensible
        description: Ordinal 1-5 score from retained evidence on brand breadth, science assets, and trust signals.
        scale: 1-5 ordinal
      points:
        - label: Chando
          x: 4
          'y': 4
          detail: >-
            Roughly 70% online mix, 64,800 offline terminals, and a disclosed multi-brand, multi-category portfolio
            support a strong middle-to-top position, although revenue still depends heavily on the flagship brand.
        - label: Proya
          x: 5
          'y': 3
          detail: >-
            Xinhua's comparison gives Proya the largest disclosed scale in this peer set and better second-brand support
            than Chando, but the retained evidence says less about proprietary science or breadth.
        - label: Shangmei / Han Shu
          x: 4
          'y': 2
          detail: >-
            Strong Douyin execution is cited, yet Han Shu still dominates group revenue and the retained evidence
            exposes less about deeper portfolio breadth.
        - label: Marubi
          x: 3
          'y': 2
          detail: >-
            The retained evidence frames Marubi through eye-cream specialization and earlier access to capital markets
            rather than broad multi-brand depth.
        - label: L'Oréal-linked incumbent set
          x: 5
          'y': 5
          detail: >-
            The retained evidence describes L'Oréal as a global beauty giant, cites it as a higher-R&D benchmark, and
            shows it investing into Chando's cap table.
        - label: Science-led domestic peers
          x: 3
          'y': 4
          detail: >-
            Chinese media explicitly compare Chando's falling R&D ratio unfavorably with science-led peers such as
            Baitaine and Huaxi Bio, indicating a domestic benchmark set built on R&D credibility.
    approximationNotes: >-
      These are ordinal scores, not market-share measures. The retained evidence is uneven across named peers, so
      coordinates reflect disclosed channel, breadth, science, and trust signals rather than exhaustive audited
      competitor datasets.
    claimRefs:
      - CP007
      - CP008
      - CP009
      - CP011
      - CP013
      - CP014
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence implies a beauty revenue bridge from proprietary ingredients into a five-brand product set, then
      into online-led sales and reported revenue/profit.
    data:
      nodes:
        - id: r-and-d
          label: Proprietary ingredient base
          value: '>20 proprietary raw materials'
          note: Products using self-developed ingredients account for >80% of revenue.
        - id: portfolio
          label: Brand and SKU portfolio
          value: 5 brands / 554 SKUs
          note: Flagship CHANDO plus MAYSU, Pufuyan, Spring Summer, and Jichu.
        - id: category
          label: Category mix
          value: Skincare >85% of 2025 revenue
          note: Personal care contributed RMB 340 million in 2025.
        - id: channels
          label: Channel mix
          value: Online 69.5% of 2025 revenue
          note: Offline still spans ~64,800 retail points and 30.2% of 2025 revenue.
        - id: revenue
          label: Reported revenue
          value: RMB 5.318 billion (2025)
          note: 2023-2025 revenue grew from RMB 4.442 billion to RMB 5.318 billion.
        - id: profit
          label: Profit capture
          value: RMB 351 million net profit (2025)
          note: Latest disclosed gross margin in retained sources is 69.4% for 2024.
      edges:
        - from: r-and-d
