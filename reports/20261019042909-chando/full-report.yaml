      - number: '1.2'
        title: Leadership, family control, and governance posture
        blocks:
          - type: paragraph
            body: >-
              Governance remains highly concentrated around the Zheng family. The current filing-cycle evidence says
              Zheng Chunying and his siblings controlled about 87.82% of the company before listing, while the board
              structure remained formalized enough to include nine directors split across executive, non-executive, and
              independent seats. That split does not remove key-person dependence: the founder remains central to both
              operating narrative and capital-markets narrative, and the 2026 scrutiny described by Jumeili/Sina shows
              why control transparency matters. For diligence purposes, the central question is not whether the company
              has a board, but whether concentrated family control, related-party influence, and investor protections
              are robust enough for a public-market transition.
