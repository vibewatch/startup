      - number: '1.3'
        title: Funding history, IPO path, and milestone read-through
        blocks:
          - type: paragraph
            body: >-
              Capital formation is still easy to summarize but harder to underwrite. Multiples describes a single
              disclosed October 2025 round that set a $1.0 billion valuation and brought lifetime disclosed funding to
              $104 million, led by Harvest Capital with L'Oréal as strategic participant. That outside backing and the
              April 2026 Hong Kong refiling show real ambition, yet the IPO path is not clean: independent adverse
              reporting says the first filing lapsed after six months, with debate centering on flagship-brand
              concentration, falling R&D intensity, governance complexity, and licensing or offshore-structure
              questions. The result is a business with genuine scale and brand history, but one whose investability
              still hinges on whether the refreshed filing can convert a family-controlled, marketing-heavy beauty group
              into a governance and disclosure profile public investors will accept.
