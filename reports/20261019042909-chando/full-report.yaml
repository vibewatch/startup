  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue quality is real, but concentration remains the core weakness
        blocks:
          - type: paragraph
            body: >-
              The public IPO coverage in this pool points to a business with meaningful scale rather than an early-stage
              story: prospectus-based reporting cites RMB 4.442 billion, RMB 4.601 billion, and RMB 5.318 billion of
              revenue in 2023-2025, with 2025 growth re-accelerating after a softer 2024 profit year. The problem is
              quality concentration. Independent coverage says the flagship CHANDO brand contributed roughly 95% of
              revenue through 2025H1, while skincare remained more than 85% of 2025 sales and personal care was only
              beginning to emerge as a second category. That combination makes the headline scale financeable, but it
              does not yet prove diversified revenue durability. If the group does list, investors would still be
              underwriting a mostly single-brand, skincare-led earnings base rather than a balanced multi-brand beauty
              portfolio.
            claimRefs:
              - CI001
              - CI004
              - CI005
          - type: table
            tableRef: TI001
            claimRefs:
              - CI004
              - CI005
      - number: '4.2'
        title: Online DTC is the growth engine, but marketing intensity still dominates
        blocks:
          - type: paragraph
            body: >-
              Channel mix is moving in the right direction for a modern Chinese beauty brand. Prospectus-derived
              coverage says online revenue grew from RMB 2.749 billion in 2023 to RMB 3.695 billion in 2025, taking
              channel mix close to 70% online, while the group still maintained a broad offline footprint. That supports
              the idea that customer activity increasingly converts into faster-turning digital sales instead of slower
              traditional retail sell-in. The cost structure is less comforting. Independent adverse coverage says R&D
              intensity fell from 2.8% of revenue in 2022 to 1.7% in 2025H1, while 2025H1 sales and marketing costs
              reached 55% of revenue; prospectus commentary also ties the 2024 margin dip to heavier brand and product
              marketing. Official company material helps the margin-path case by showing real R&D infrastructure and
              proprietary ingredients, but public evidence still points to a business that remains marketing-heavy
              relative to its stated technology positioning.
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
              - CI010
          - type: table
            tableRef: TI002
            claimRefs:
              - CI006
              - CI011
              - CI014
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI005
              - CI006
              - CI010
      - number: '4.3'
        title: External capital is available, but adequacy cannot be underwritten from public data
        blocks:
          - type: paragraph
            body: >-
              Chando has demonstrated access to outside capital, which matters because the company is simultaneously
              pursuing a Hong Kong IPO and a multi-brand repositioning. Assigned reporting says L'Oréal invested RMB 442
              million and Jiahua Capital invested RMB 300 million in 2025 at roughly RMB 7.0 to 7.14 billion post-money
              valuation, while regulators later asked for more detail on equity history, paid-in capital, pricing
              differences, and trust or offshore compliance. Adverse reporting further says the failed filing delayed a
              capital plan aimed at brand upgrade, R&D, overseas expansion, and M&A or new-brand incubation. What public
              sources still do not give is the cash bridge behind that plan: no retained source in this chapter
              discloses current cash, burn, debt capacity, working capital, or runway. That means the company may have
              financing access, but capital adequacy itself is still a diligence item rather than a proved fact.
            claimRefs:
              - CI011
              - CI012
              - CI013
              - CI014
          - type: table
            tableRef: TI003
            claimRefs:
              - CI003
              - CI007
              - CI008
              - CI014
      - number: '4.4'
        title: Financial verdict
        blocks:
          - type: paragraph
            body: >-
              The financial picture is investable only with caveats. Revenue scale, digital channel momentum, and
              credible outside investors argue that this is not a concept-stage brand. But the earnings engine remains
              narrow: flagship-brand dependence is extreme, gross-margin disclosure is dated, and public evidence shows
              a cost mix still tilted toward selling expense rather than rising R&D intensity. Most importantly, the
              chapter cannot independently underwrite realized pricing, customer-acquisition efficiency, contribution
              margin, inventory intensity, or liquidity. The right conclusion is that Chando may have enough commercial
              traction to support an IPO narrative, but not enough disclosed operating detail for a high-conviction
              underwriting case without management data-room support.
            claimRefs:
              - CI004
              - CI007
              - CI008
              - CI011
              - CI014
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Concentration still overwhelms the growth story
            body: >-
              Even after re-accelerating revenue growth, the group remains dependent on one flagship brand for roughly
              95% of sales, which leaves the IPO story exposed to brand fatigue or channel pressure.
            calloutType: risk
            claimRefs:
              - CI004
              - CI011
          - type: callout
            title: Digital distribution is working, but efficiency is still unproven
            body: >-
              Online revenue is now close to 70% of sales, which supports the digital transformation thesis, but public
              sources still do not disclose CAC, payback, or contribution margin by channel.
            calloutType: insight
            claimRefs:
              - CI006
              - CI014
          - type: callout
            title: Underwrite only after a liquidity and channel-economics data room
            body: >-
              The next diligence step should be a management pack covering cash, debt, runway, inventory turns, channel
              CAC, and repeat-purchase cohorts before treating the IPO valuation as financeable.
            calloutType: recommendation
            claimRefs:
              - CI011
              - CI013
              - CI014
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product scope is broad, but the workflow is still anchored on the flagship skincare franchise
        blocks:
          - type: paragraph
            body: >
              Public listing coverage shows a real operating portfolio rather than a single-SKU beauty story. Sohu's
              April 2026 IPO summary says Chando runs five major brands and 554 SKUs spanning skincare, makeup, personal
              care, men's care, and children/baby care, while Ashley Dudarenok's profile also describes body wash, hair
              oils, masks, and men's lines. That breadth matters because the company is trying to turn a flagship
              skincare brand into a wider beauty platform rather than only refreshing one anti-aging line. The workflow
              evidence still points back to flagship skincare, though: independent coverage says the CHANDO master brand
              contributes more than 94% of revenue, and Ashley Dudarenok's profile highlights hero-product iteration
              around Time Frozen Essence and related anti-aging launches. In practice, the public workflow appears to be
              consumer-insight-led skincare discovery first, followed by line extensions into adjacent beauty and
              personal-care categories, not an evenly scaled house of brands with multiple independently proven growth
              engines.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE007
              - CE012
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE012
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE007
              - CE008
              - CE009
      - number: '5.2'
        title: The operating architecture combines ingredient R&D, self-production, and data-linked channels
        blocks:
          - type: paragraph
            body: >
              Chando's strongest product-tech evidence is the way its public materials connect proprietary ingredient
              work with manufacturing and distribution. The company's 2025 CBE write-up says the group has independently
              developed more than 20 cosmetic ingredients, spent years building a Himalayan microorganism library from
              558 unique strains, and collaborated with outside research institutions on HiMurchaSin. Independent
              synthesis from Ashley Dudarenok says HiMurchaSin is treated as a proprietary ingredient used in 67
              formulas, which suggests the ingredient program is not confined to a single halo product. The distribution
              layer is also material to the architecture: 36Kr and Ashley both describe a DTC-heavy operating model,
              with digital decision-making, online revenue concentration, a large registered-member base, and
              cloud-store tooling that links inventory with pickup or home delivery. That combination implies a
              vertically integrated beauty operator where the differentiator is not only formulation IP, but also the
              ability to push fast product refreshes through owned manufacturing and omnichannel member operations.
            claimRefs:
              - CE004
              - CE005
              - CE006
              - CE008
              - CE009
          - type: table
            tableRef: TE003
            claimRefs:
              - CE004
              - CE005
              - CE006
              - CE008
              - CE009
              - CE010
              - CE011
              - CE014
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE003
              - CE005
              - CE007
              - CE009
              - CE010
              - CE013
              - CE014
      - number: '5.3'
        title: Differentiation is credible at the ingredient-and-operations layer, but maturity proof is uneven
        blocks:
          - type: paragraph
            body: >
              Chando does have visible differentiation levers. Official material repeatedly ties the portfolio to
              self-developed ingredients, fermentation, and a Himalayan-origin raw-material story; the independent
              Ashley profile adds a commercial bridge by pointing to cumulative retail sales for the Little Purple
              Bottle line and a seventh-generation refresh in 2026. That is stronger than generic skincare branding,
              because it shows repeated reformulation and relaunch around an ingredient platform. Even so, the maturity
              evidence is uneven. Much of the strongest technical detail comes from company-issued event coverage, while
              independent adverse coverage continues to frame the business as overly reliant on one brand, too
              marketing-heavy relative to R&D, and still in transition toward a technology-led beauty model. Jing
              Daily's 2026 beauty-trend summary also suggests the market is moving toward precision beauty, wellness,
              and AI-powered personalization, raising the bar for Chando to convert its lab and campaign narratives into
              independently visible efficacy, repeatability, and consumer proof.
            claimRefs:
              - CE003
              - CE005
              - CE007
              - CE011
              - CE012
              - CE013
      - number: '5.4'
        title: Trust and compliance disclosures exist, but public proof on controls remains incomplete
        blocks:
          - type: paragraph
            body: >
              The official English site does show some explicit guardrails. It states that the brand does not conduct
              animal testing unless applicable law requires it according to Ashley Dudarenok's profile, and the company
              surface reproduces a reminder that cosmetics are not permitted to claim medical or therapeutic effects.
              Those are useful trust and compliance signals because they acknowledge regulatory boundaries instead of
              presenting only upside claims. The problem is that public proof of the wider control environment is still
              incomplete. The assigned evidence does not surface a public security, privacy, uptime, certification, or
              audit stack, and it also does not provide a convincing practitioner-community or developer-signal proxy
              for how the technical claims are received outside company channels. For diligence, that means the right
              stance is not that Chando lacks controls, but that publicly visible proof remains thinner than the
              company's science-and-innovation narrative.
            claimRefs:
              - CE010
              - CE014
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Vertical integration is the clearest public moat
            body: >
              Chando's public evidence is strongest where ingredient development, self-production, and digital member
              operations connect into one operating system rather than separate marketing claims.
            calloutType: strength
            claimRefs:
              - CE005
              - CE006
              - CE008
              - CE009
          - type: callout
            title: >-
              The product story is still more concentrated and marketing-dependent than management's tech ambition
              implies
            body: >
              Independent coverage keeps returning to the same risk pattern: flagship-brand dependence remains high, R&D
              intensity has fallen, and external validation of newer brands and technical claims still trails the
              official narrative.
            calloutType: risk
            claimRefs:
              - CE003
              - CE011
              - CE012
          - type: callout
            title: Roadmap credibility depends on converting science storytelling into third-party proof
            body: >
              Public trend coverage says Chinese beauty buyers are moving toward precision, wellness, and
              personalization, so Chando's next proof point is not another innovation announcement but harder external
              evidence on efficacy, quality, and non-flagship adoption.
            calloutType: insight
            claimRefs:
              - CE007
              - CE013
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer base is broad in consumer categories but still anchored on one flagship brand
        blocks:
          - type: paragraph
            body: >-
              Chando's public customer footprint is consumer-facing rather than enterprise-account based.
              Prospectus-linked reporting says the flagship Chando brand ranked second among domestic beauty brands by
              2024 retail sales, while the broader group ranked third among Chinese domestic cosmetics groups, and the
              same prospectus coverage says the company led surveyed mass-market domestic beauty brands on consumer
              recognition, purchase frequency, and repurchase willingness. The portfolio spans five main brands and, as
              of the 2026 IPO refiling coverage, 554 SKUs across skincare, makeup, personal care, men's, and baby-care
              categories. That supports a real segmentation story across use cases and price ladders, but the public
              record still frames the customer base mainly as mass-market Chinese beauty consumers rather than named
              enterprise or institutional buyers.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU003
              - CU006
              - CU008
              - CU010
              - CU011
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU003
              - CU005
              - CU006
              - CU007
              - CU010
      - number: '6.2'
        title: Adoption proof is strongest at the channel and distribution layer
        blocks:
          - type: paragraph
            body: >-
              The clearest public adoption proof is not a disclosed customer count; it is channel reach. Multiple
              assigned sources describe online and direct-to-consumer surfaces as the core commercial engine, with
              online sales at roughly 68.8% to 69.5% of revenue by 2025 depending on the source's periodization. At the
              same time, Futu's prospectus summary says offline channels still covered 64,800 terminal retail points
              nationwide, so the online shift has not replaced physical distribution. This combination suggests Chando
              has genuine omnichannel consumer reach, but the evidence stops short of disclosing active buyers, order
              frequency, cohort retention, or revenue per customer segment.
            claimRefs:
              - CU005
              - CU006
              - CU012
          - type: table
            tableRef: TU002
            claimRefs:
              - CU003
              - CU005
              - CU006
              - CU008
      - number: '6.3'
        title: Named proof exists, but it is mostly community, product-validation, and event evidence
        blocks:
          - type: paragraph
            body: >-
              The assigned pool does not contain classic B2B customer case studies or large sets of named production
              deployments. Instead, the best named public proof comes from three weaker but still useful surfaces: an
              official clinical-observation reference tied to Fudan Children's Hospital for the imine sub-brand,
              company-reported consumer response at the 2025 CBE expo for the Rejuvenation Repairing line, and a
              post-purchase sustainability program that has attracted more than ten thousand participants. Those data
              points support real engagement and some product validation, but they are not substitutes for disclosed
              repeat-purchase cohorts, contract renewals, or independently verified customer outcomes.
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
          - type: table
            tableRef: TU003
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
      - number: '6.4'
        title: Durability remains the biggest open question because concentration risk is explicit
        blocks:
          - type: paragraph
            body: >-
              The strongest disconfirming evidence in the pool is concentration, not a collapse in demand. Xinhua- and
              Sina-distributed IPO-lapse commentary says the flagship Chando brand generated roughly 94.6% to 95.9% of
              revenue from 2022 through 2025 H1 / 2025, while the other brands together remained small.
              Prospectus-linked coverage does show some secondary traction in personal care and in Perfection Research,
              but not enough to rebut the core conclusion that Chando is still overwhelmingly dependent on a single
              brand and heavy marketing execution. Because the assigned evidence also lacks NRR, GRR, churn, renewal,
              and cohort disclosures, investors can verify reach and distribution much more easily than customer
              durability or expansion quality.
            claimRefs:
              - CU007
              - CU008
              - CU012
              - CU013
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Real omnichannel consumer reach
            body: >-
              Public evidence supports national consumer reach through near-70% online mix, 64,800 offline retail
              points, and top-tier domestic beauty brand ranking, which is stronger adoption proof than a simple logo
              wall.
            calloutType: strength
            claimRefs:
              - CU001
              - CU005
              - CU006
          - type: callout
            title: Retention is still not verified
            body: >-
              The public package does not disclose NRR, GRR, churn, renewal, or cohort curves, so customer durability
              and land-and-expand quality remain materially under-evidenced.
            calloutType: risk
            claimRefs:
              - CU012
          - type: callout
            title: Brand concentration dominates the customer story
            body: >-
              The flagship Chando brand still accounts for more than 95% of revenue in prospectus-linked reporting,
              leaving the customer base exposed to demand or positioning weakness in one core franchise.
            calloutType: risk
            claimRefs:
              - CU007
              - CU013
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk profile
        blocks:
          - type: paragraph
            body: >
              The current risk stack is led by capital-markets and governance execution rather than an acute product
              failure. Chando had to refile its Hong Kong IPO on 2026-04-02 after the prior 2025-09-29 application
              lapsed, and independent commentary linked that lapse to concerns over flagship-brand concentration, heavy
              online marketing intensity, and concentrated family control rather than to a trivial paperwork reset.
              Those issues matter because the same public record still shows roughly 87.82% family control, a flagship
              brand contributing about 95% of revenue, and a business model still leaning heavily on paid marketing and
              online channels. The strongest mitigations are real but incomplete: the company has fresh capital from
              L'Oréal and Jiahua, joint sponsors for the listing, and visible R&D output, yet the residual severity
              remains high until listing execution, portfolio diversification, and profit quality improve together.
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR007
              - CR008
              - CR013
              - CR014
              - CR016
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR003
              - CR012
              - CR014
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR007
              - CR008
              - CR009
              - CR010
              - CR013
              - CR014
              - CR016
      - number: '7.2'
        title: Concentration and model risk
        blocks:
          - type: paragraph
            body: >
              Chando's biggest commercial risk is not lack of scale but the narrowness of where that scale comes from.
              Independent reporting says the flagship CHANDO brand still contributes about 95% of group revenue, while
              the rest of the portfolio remains too small to offset any slowdown in the core franchise. At the same
              time, the public filings summarized in the assigned pool show online sales at 68.8% of revenue and 2025
              first-half sales and marketing costs at 55% of revenue, while R&D intensity has drifted down from 2.8% in
              2022 to 1.7% in 2025 H1. That combination creates a recognizable thesis-break risk: if channel algorithms,
              influencer ROI, or flagship demand weaken before incubation brands reach material scale, revenue can keep
              growing while earnings quality stays fragile.
            claimRefs:
              - CR002
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR015
          - type: table
            tableRef: TR002
            claimRefs:
              - CR002
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR015
      - number: '7.3'
        title: Execution and dependency risk
        blocks:
          - type: paragraph
            body: >
              The counterweight to the financial-model risk is that Chando does appear to possess a real innovation
              engine and credible external backers. Company-issued materials say it independently developed more than 20
              cosmetic ingredients, built a 558-strain Himalayan microorganism library, and had 20 papers accepted at
              IFSCC 2026, with technologies already incorporated into products across multiple brands. The business also
              disclosed a financing round of more than RMB 700 million from L'Oréal/Meiting and Jiahua/Himalaya at
              roughly RMB 7.14 billion post-money valuation. Those are meaningful mitigations, but they also create new
              dependencies: Chando now has to convert research visibility into commercially differentiated products,
              keep strategic investors aligned through the listing process, and show that collaboration-heavy science
              can produce durable returns without permanently elevating marketing spend.
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
          - type: table
            tableRef: TR003
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR013
              - CR016
      - number: '7.4'
        title: Kill criteria and diligence paths
        blocks:
          - type: paragraph
            body: >
              A disciplined investor should treat this chapter as a monitorable risk screen rather than a generic
              caution list. The thesis should weaken materially if the Hong Kong process stalls again, if flagship-brand
              dependence does not fall meaningfully from the mid-90% range, if marketing spend remains near current
              levels without clearer payback disclosure, or if the science narrative continues to outrun reported R&D
              intensity and commercialization evidence. The next diligence steps are therefore concrete: inspect the
              latest HKEX risk-factor and sponsor correspondence, review channel-level CAC and repeat-purchase
              economics, test whether the fast-growing sub-brands can become relevant profit pools, and obtain
              regulator/court/recall checks that are not present in the assigned public-source pack. Until those
              workstreams are completed, mitigation quality should be scored as improving but not yet investment-grade.
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR007
              - CR008
              - CR009
              - CR013
              - CR014
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: IPO execution is still a live financing and governance risk
            body: >-
              The refiled Hong Kong process may still solve Chando's capital and credibility needs, but the first lapse
              means investors should underwrite another timing slip as a real downside scenario instead of assuming the
              listing is routine.
            calloutType: risk
            claimRefs:
              - CR001
              - CR003
              - CR014
              - CR016
          - type: callout
            title: The flagship brand and paid-media model remain the main thesis-breakers
            body: >-
              A company can survive one of these exposures in isolation, but Chando carries both at once: about 95%
              revenue concentration in the core brand and a sales-and-marketing cost base that reached 55% of 2025
              first-half revenue.
            calloutType: risk
            claimRefs:
              - CR004
              - CR007
          - type: callout
            title: Treat R&D output as a mitigation only if it improves economics
            body: >-
              The IFSCC record, ingredient pipeline, and investor support are credible positives, but they should count
              as durable mitigation only if management can show that research converts into better product mix, stronger
              repeat purchase, and less marketing-heavy growth.
            calloutType: recommendation
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
              - CR013
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports a constructive but price-disciplined stance. Chando has real scale, with 2025
              revenue reported at RMB 5.318 billion and net profit at RMB 351 million, and it has already attracted
              named outside capital from L'Oréal and Jiahua-linked entities at a disclosed post-money valuation of
              roughly RMB 7.14 billion. That means this is not a concept-stage brand story; it is a profitable,
              late-stage beauty platform that is already being framed for a Hong Kong listing.


              The problem is that the same evidence package also argues against a clean underwriting call today. The
              flagship CHANDO brand still generated 95.3% of 2025 revenue, the Zheng siblings retained about 87.82% of
              pre-IPO ownership, and adverse reporting highlighted concerns around concentration, marketing efficiency,
              and the hearing-stage friction that contributed to the earlier filing lapse. Those signals make the
              company investable only at the right entry price and with tighter diligence on whether the current
              financing mark can clear public-market scrutiny without a discount.


              The right call is therefore **track**, not buy: the disclosed private mark is not obviously stretched
              relative to public beauty comps, but the evidence does not yet justify paying through that mark before the
              final IPO range, use of proceeds, and any remaining overhang from pre-IPO terms are visible.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV006
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV002
              - CV003
              - CV006
              - CV011
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
              - CV006
              - CV008
              - CV009
              - CV011
              - CV012
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV007
              - CV008
              - CV010
              - CV006
              - CV011
              - CV012
              - CV013
      - number: '8.2'
        title: Scenario framing and comparable context
        blocks:
          - type: paragraph
            body: >-
              The disclosed valuation context is usable for scenario framing but still too thin for a precision target.
              Chando's last disclosed private valuation of RMB 7.14 billion implies roughly 1.34x 2025 sales using the
              RMB 5.318 billion revenue figure cited around the refreshed IPO filing. That sits below the public
              reference visible in the assigned pool: Proya traded around 2.11x price-to-sales and 1.64x EV-to-revenue
              on 2026-06-30. On that narrow lens alone, Chando does not screen obviously expensive.


              But the comp read has to be discounted for quality and mix. Chando remains far more concentrated in one
              flagship brand than diversified peers, and adverse reporting shows 2025 first-half R&D intensity falling
              to 1.7% of revenue while sales and marketing ran at 55% of revenue. That mix does not invalidate the
              current private mark, but it does limit how much multiple expansion an investor should assume before the
              company proves that newer brands and technology claims can become material in revenue rather than just in
              narrative.


              The most supportable base case is therefore a valuation range clustered around the last disclosed round
              rather than a sharp step-up. A bull case needs proof that the refiling converts into a clean listing and
              that brand concentration falls. A bear case is driven by another listing delay, heavier discounting, or
              evidence that customer acquisition and channel economics are weaker than the current prospectus-style
              revenue growth implies.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV006
              - CV009
              - CV010
              - CV011
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV003
              - CV006
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.3'
        title: Exit readiness, diligence asks, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Exit readiness is real but incomplete. Chando has already restarted its Hong Kong IPO process, has
              profitable disclosed financials, and can point to outside strategic and financial investors plus an
              official narrative around multi-brand expansion, digital operations, and ingredient-led R&D. Those
              features keep the company in the investable set and explain why a public listing remains plausible.


              What is still missing is the evidence required to turn plausibility into conviction. The assigned pool
              does not disclose the final IPO price range, proceeds plan, lock-up or preference mechanics, or
              channel-level unit economics after heavy online selling. Public reporting also continues to show a
              business that is highly dependent on one core brand while spending aggressively on marketing and
              relatively lightly on R&D. Until those gaps close, the right posture is to keep the company on the
              watchlist and only engage if price, structure, and post-promotion economics improve the payoff asymmetry.


              The cleanest thesis-break triggers are measurable: another lapse or material delay in the Hong Kong path,
              flagship-brand concentration staying above 90%, sales and marketing intensity remaining above half of
              revenue without better profit quality, or evidence that outside investors entered on terms that leave
              new-money IPO buyers structurally subordinated.
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV007
              - CV008
              - CV010
              - CV011
              - CV012
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Current call
            body: >-
              Track Chando rather than buying the story early: the visible private mark looks supportable enough to keep
              the company investable, but not cheap enough to ignore concentration, governance, and IPO-structure risk.
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV006
              - CV011
              - CV012
              - CV013
          - type: callout
            title: What would upgrade the call
            body: >-
              A cleaner public filing path, independent proof that newer brands can dilute the flagship mix, and offer
              terms that do not embed an IPO premium above the base-case range would be the clearest reasons to revisit
              the recommendation.
            calloutType: assumption
            claimRefs:
              - CV001
              - CV003
              - CV006
              - CV012
