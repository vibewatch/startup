      - number: '3.3'
        title: Moat durability is constrained by flagship concentration and scrutiny
        blocks:
          - type: paragraph
            body: >-
              The strongest adverse evidence is that Chando's breadth has not yet translated into peer-level revenue
              diversification. Multiple independent sources say the flagship CHANDO brand still contributes about 95% of
              revenue, leaving sub-brands too small to offset pressure if the hero brand loses momentum. Xinhua's peer
              comparison is especially damaging because it shows Proya and Shangmei with lower flagship concentration
              than Chando, while other reports criticize Chando for heavy marketing, declining R&D intensity, and a
              still-unsettled public-markets trust story. The April 2026 refiling also came with reported CSRC follow-up
              questions on equity history, paid-in capital, pre-IPO pricing, and offshore/family-trust compliance. That
              combination implies a moat built more on product claims, brand storytelling, and distribution execution
              than on structural lock-in: the retained evidence shows strong shelf and platform presence, but not
              long-term contractual switching barriers or transparent public pricing that would prove defensible
              customer captivity.
            claimRefs:
