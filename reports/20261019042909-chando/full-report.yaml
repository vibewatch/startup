      - number: '2.2'
        title: Buyer segments, budget ownership, and adoption path
        blocks:
          - type: paragraph
            body: >-
              Chando's demand path is still consumer-led, but not monolithic. The portfolio and product disclosures
              point to at least four live buying missions: anti-aging facial skincare, sensitive-skin repair, infant and
              child care, and mass personal-care or hair-care replenishment. In each case the end user is usually the
              consumer or a child in the household, while the payer is the individual shopper or caregiver controlling a
              personal-care budget. Adoption is increasingly mediated by digital discovery and platform events rather
              than by legacy counters alone: Bamboo Works reports 69.5% of 2025 revenue came from online channels even
              though Chando still had 64,800 retail sales points, and JD says personal-care brands grew sharply during
              the 2026 618 promotion. 36Kr's account of Jiahua's post-investment work on DTC channels reinforces that
              this is a hybrid model in transition, where ecommerce efficiency matters but offline reach still supports
              sampling, trust, and replenishment.
            claimRefs:
              - CM004
              - CM008
              - CM009
              - CM011
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM004
              - CM008
              - CM009
              - CM011
              - CM014
      - number: '2.3'
        title: Growth drivers, constraints, and valuation importance
        blocks:
          - type: paragraph
            body: >-
              The bull case is straightforward: domestic brands already control more than half of category sales,
              consumers are shifting toward precision beauty and efficacy-oriented routines, and proposed 2026 NMPA
              reforms could reduce launch friction for qualifying brands. Chando also keeps presenting science,
              self-developed ingredients, and sustainability as trust-building differentiators. The constraint set is
              just as important for valuation. Bamboo Works says livestreaming commissions for beauty influencers rose
              from about 40% in 2024 to 60% in 2025, Douyin raised skincare service fees from 2% to 4%, Chando's own
              flagship brand still represented 95.3% of sales, and independent coverage explicitly flags weak
              differentiation and low R&D intensity as structural risks. In other words, the market is big enough to
              support upside, but near-term value capture depends less on TAM rhetoric than on lowering traffic
              dependence, proving efficacy, and building non-flagship brands that can absorb budget without diluting
              margins.
            claimRefs:
              - CM005
              - CM006
              - CM010
              - CM013
              - CM014
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Large market, low concentration, weak direct SAM disclosure
            body: >-
              The market is large enough to matter, but the real diligence question is not whether Chinese cosmetics
              demand exists; it is whether Chando can convert fragmented domestic demand into defendable share without
              relying on one flagship brand and paid traffic.
            calloutType: insight
            claimRefs:
              - CM001
              - CM012
              - CM015
          - type: callout
            title: Traffic costs and brand concentration can compress TAM capture
            body: >-
              Even with domestic beauty growth, valuation upside is capped if traffic acquisition gets more expensive,
              R&D stays light, and non-flagship brands remain too small to diversify demand capture.
            calloutType: risk
            claimRefs:
              - CM005
              - CM013
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Peer set: domestic leaders, listed specialists, and multinational incumbents'
        blocks:
          - type: paragraph
            body: >-
              The retained evidence points to a competitive set broader than a single domestic skincare peer list. On
              one side are listed Chinese beauty groups such as Proya, Shangmei, and Marubi, which independent Chinese
              coverage uses as immediate comparison points when judging Chando's scale, diversification, and
              capital-markets readiness. On another side are multinational incumbents: L'Oréal appears not only as a
              strategic investor, but as the clearest benchmark for international brand power and R&D credibility inside
              the retained evidence. Chando is not a tiny niche brand inside this field; official and IPO-linked sources
              still position it as a top-tier domestic group by retail sales. But the same independent coverage also
              places it below faster-scaling listed peers on recent revenue ranking, which means the chapter's core
              question is not whether Chando is relevant, but whether its current position is durable enough to resist
              listed domestic rivals and multinational incumbents at the same time.
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP007
              - CP008
              - CP013
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP007
              - CP008
              - CP013
      - number: '3.2'
        title: Competitive advantages come from breadth, channels, and a visible science story
        blocks:
          - type: paragraph
            body: >-
              Chando's best disclosed competitive assets are breadth and distribution, not a single breakthrough
              category. Official materials describe a full-range beauty portfolio across skincare, makeup, facial masks,
              men's grooming, and personal care, while the IPO-linked materials describe a five-brand architecture and
              the 2025 CBE disclosure shows active promotion for CHANDO, MAYSU, imine, and Biorrier rather than only the
              flagship label. Distribution is likewise meaningful: independent coverage says online sales reached
              roughly 70% of revenue by 2025 while offline channels still covered 64,800 terminal retail points
              nationwide. The science story is not imaginary either; official sources disclose a 20-laboratory R&D
              centre, more than 140 researchers, and more than 20 internally developed cosmetic ingredients. Those
              ingredients, brand breadth, and omnichannel reach give Chando real reasons to stay in the consideration
              set for mass-market Chinese beauty buyers even before price becomes the deciding factor.
            claimRefs:
