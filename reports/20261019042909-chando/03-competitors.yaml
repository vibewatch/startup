          "Shangmei / Han Shu",
          "No public price ladder in retained evidence",
          "Douyin-led distribution strength is visible",
          "No discounting, bundle, or contract details are disclosed here",
          "Channel execution may matter more than list price in this rivalry"
        ]
      - [
          "L'Oréal-linked incumbents",
          "No China list prices or contract terms are disclosed in retained evidence",
          "Global brand scale, higher cited R&D benchmark, and strategic investment into Chando",
          "Local promo architecture is not disclosed here",
          "Incumbents can pressure Chando without this source pack revealing where premiumization or undercutting sits"
        ]
    notes: >-
      This table is intentionally conservative: the retained evidence is rich on
      positioning and channel signals but poor on public list-price ladders,
      realized discounts, and retailer contract structures, so "not disclosed"
      means unavailable in the pack rather than zero.
    enumerationScope:
      coverage: "partial"
      basis: >-
        Pricing and packaging comparison restricted to value signals explicitly
