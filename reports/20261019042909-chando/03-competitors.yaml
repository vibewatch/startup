          "Chando's moat is shallower than its portfolio story suggests"
        ]
    notes: >-
      This matrix stays within retained evidence. "Domestic peer benchmark" and
      "incumbent / adjacent benchmark" summarize the strongest named comparator
      disclosed for that criterion rather than claiming a full market census.
