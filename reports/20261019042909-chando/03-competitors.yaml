          "L'Oréal appears in retained evidence as a global multi-brand incumbent",
          "Chando has real breadth, but not obviously unique breadth"
        ]
      - [
          "Channel leverage",
          "Independent coverage says online share reached 69.5% in 2025 with 64,800 offline retail points still active",
          "Shangmei is cited for Douyin strength and Proya for larger revenue scale",
          "Incumbent local channel split is not disclosed here, but brand power is structurally stronger",
