          "The science story helps differentiation, but spending intensity still invites skepticism"
        ]
      - [
          "Governance / trust",
          "Family control remains 87.82% and the HK IPO had to be refiled after supplemental regulatory questions",
          "Listed peers already cleared public-market scrutiny earlier",
          "Multinational incumbents do not face the same re-listing proof burden in this evidence set",
          "Trust is still an execution variable for Chando rather than a settled advantage"
        ]
      - [
          "Diversification resilience",
          "About 95% of revenue still comes from the flagship brand",
          "Proya disclosed 74.27% for Proya and 13.17% for Caitang; Shangmei disclosed 81.4% for Han Shu and 9.6% for One Leaf",
