        ]
      - [
          "Science / R&D posture",
          "Official sources disclose 20 labs, 140+ researchers, and 20+ self-developed ingredients",
          "Independent coverage still says Chando's R&D intensity trails peers such as Baitaine, Huaxi Bio, or other science-led comparators",
