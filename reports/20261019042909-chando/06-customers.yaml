company:
  name: "Chando"
chapter:
  number: 6
  title: "Customers"
  summary: "Public evidence shows Chando has real consumer reach through a near-70% online mix, 64,800 offline retail points, and a flagship brand that ranks near the top of China's domestic beauty market. But the same evidence set still does not verify classic durability metrics such as NRR, churn, renewal, or cohort behavior, and it points to a major concentration risk because the flagship Chando brand still contributes more than 95% of revenue."
sections:
  - id: "customer-base"
    title: "Customer base is broad in consumer categories but still anchored on one flagship brand"
    body: |-
      Chando's public customer footprint is consumer-facing rather than enterprise-account based. Prospectus-linked reporting says the flagship Chando brand ranked second among domestic beauty brands by 2024 retail sales, while the broader group ranked third among Chinese domestic cosmetics groups, and the same prospectus coverage says the company led surveyed mass-market domestic beauty brands on consumer recognition, purchase frequency, and repurchase willingness. The portfolio spans five main brands and, as of the 2026 IPO refiling coverage, 554 SKUs across skincare, makeup, personal care, men's, and baby-care categories. That supports a real segmentation story across use cases and price ladders, but the public record still frames the customer base mainly as mass-market Chinese beauty consumers rather than named enterprise or institutional buyers.
    claimRefs: ["CU001", "CU002", "CU003", "CU004"]
    tableRefs: ["TU001"]
    figureRefs: ["FU001"]
  - id: "adoption-surfaces"
    title: "Adoption proof is strongest at the channel and distribution layer"
    body: |-
      The clearest public adoption proof is not a disclosed customer count; it is channel reach. Multiple assigned sources describe online and direct-to-consumer surfaces as the core commercial engine, with online sales at roughly 68.8% to 69.5% of revenue by 2025 depending on the source's periodization. At the same time, Futu's prospectus summary says offline channels still covered 64,800 terminal retail points nationwide, so the online shift has not replaced physical distribution. This combination suggests Chando has genuine omnichannel consumer reach, but the evidence stops short of disclosing active buyers, order frequency, cohort retention, or revenue per customer segment.
    claimRefs: ["CU005", "CU006", "CU012"]
    tableRefs: ["TU002"]
  - id: "named-proof"
    title: "Named proof exists, but it is mostly community, product-validation, and event evidence"
    body: |-
      The assigned pool does not contain classic B2B customer case studies or large sets of named production deployments. Instead, the best named public proof comes from three weaker but still useful surfaces: an official clinical-observation reference tied to Fudan Children's Hospital for the imine sub-brand, company-reported consumer response at the 2025 CBE expo for the Rejuvenation Repairing line, and a post-purchase sustainability program that has attracted more than ten thousand participants. Those data points support real engagement and some product validation, but they are not substitutes for disclosed repeat-purchase cohorts, contract renewals, or independently verified customer outcomes.
    claimRefs: ["CU009", "CU010", "CU011", "CU012"]
    tableRefs: ["TU003"]
  - id: "durability-risk"
    title: "Durability remains the biggest open question because concentration risk is explicit"
    body: |-
      The strongest disconfirming evidence in the pool is concentration, not a collapse in demand. Xinhua- and Sina-distributed IPO-lapse commentary says the flagship Chando brand generated roughly 94.6% to 95.9% of revenue from 2022 through 2025 H1 / 2025, while the other brands together remained small. Prospectus-linked coverage does show some secondary traction in personal care and in Perfection Research, but not enough to rebut the core conclusion that Chando is still overwhelmingly dependent on a single brand and heavy marketing execution. Because the assigned evidence also lacks NRR, GRR, churn, renewal, and cohort disclosures, investors can verify reach and distribution much more easily than customer durability or expansion quality.
    claimRefs: ["CU007", "CU008", "CU012", "CU013"]
callouts:
  - calloutType: "strength"
    title: "Real omnichannel consumer reach"
    body: "Public evidence supports national consumer reach through near-70% online mix, 64,800 offline retail points, and top-tier domestic beauty brand ranking, which is stronger adoption proof than a simple logo wall."
    claimRefs: ["CU001", "CU005", "CU006"]
  - calloutType: "risk"
    title: "Retention is still not verified"
    body: "The public package does not disclose NRR, GRR, churn, renewal, or cohort curves, so customer durability and land-and-expand quality remain materially under-evidenced."
    claimRefs: ["CU012"]
  - calloutType: "risk"
    title: "Brand concentration dominates the customer story"
    body: "The flagship Chando brand still accounts for more than 95% of revenue in prospectus-linked reporting, leaving the customer base exposed to demand or positioning weakness in one core franchise."
    claimRefs: ["CU007", "CU013"]
