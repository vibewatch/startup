    notes: "Benefits are limited to sourced sales, member, and launch signals; no row implies independently verified efficacy without direct support."
    claimRefs: ["CE001", "CE007", "CE008", "CE009"]
  - id: "TE003"
    title: "Technology / operating architecture table"
    columns: ["Layer / process", "Role", "Dependency", "Risk"]
    rows:
      - ["Ingredient discovery", "Build differentiated actives around Himalayan raw materials and microbes", "Internal R&D plus external academic collaboration", "Public science detail comes mainly from company-issued materials"]
      - ["Formulation / productization", "Translate ingredient assets into hero serums and adjacent lines", "Ability to turn lab claims into consumer-safe, compliant products", "Independent efficacy validation is sparse in assigned pool"]
      - ["Manufacturing / self-production", "Keep ingredient and finished-goods control closer to the company", "Operational continuity across self-developed and self-produced assets", "No public quality-yield or audit metrics surfaced here"]
      - ["DTC and member data layer", "Use digital decision-making, content commerce, and member operations to steer assortment", "Online traffic acquisition and cloud-store execution", "High marketing intensity can mask weak organic pull if payback deteriorates"]
      - ["Offline / omnichannel fulfillment", "Convert digital demand into pickup, trial, and local availability", "Distributor, retail-point, and flagship-store coordination", "Assigned evidence does not show service reliability by channel"]
      - ["Compliance boundary", "Keep marketing and claims inside cosmetics rules", "Internal review of copy, testing policy, and claim language", "Public trust stack is incomplete without visible certifications, privacy, or security disclosures"]
    notes: "Architecture summarizes only the operating layers evidenced in assigned sources; absent certifications, uptime, and audit detail are treated as gaps, not negatives."
    claimRefs: ["CE004", "CE005", "CE006", "CE008", "CE009", "CE010", "CE011", "CE014"]
