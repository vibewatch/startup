evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: operating-scale-gaps
    missingEvidence: Current public customer-count, headcount, and site-footprint disclosures tied to the active filing cycle.
    whyItMatters: >-
      These metrics are core cover facts for later commercial and valuation chapters and cannot be inferred safely from
      revenue.
    diligencePath: >-
      Request the latest IPO filing tables or management KPI pack covering customers, employees, and operating
      locations.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: ipo-terms
    missingEvidence: Final IPO price range, proceeds allocation, dilution mechanics, and any investor preference or conversion terms.
    whyItMatters: >-
      Current valuation judgment cannot bridge the 2025 private round to public-market entry without knowing the
      offering structure.
    diligencePath: Review the next active HKEX prospectus and any cornerstone-investor disclosures once available.
    relatedQuestionRefs:
      - QO003
  - type: conflicting-data
    severity: material
    topic: governance-scrutiny
    missingEvidence: Primary-source resolution of the 2026 concerns around trust control, historical pricing, and licensing compliance.
    whyItMatters: The current adverse reporting names the issues, but not whether they were fully resolved in the refiled materials.
    diligencePath: Compare the March 2026 criticism with the full April 2026 refiling and subsequent regulator responses.
    relatedQuestionRefs:
      - QO006
  - type: missing-source
    severity: material
    topic: sam-sizing
    missingEvidence: >-
      A public segmentation cut by price band, category mix, geography, and channel that isolates Chando's serviceable
      market and realistic share ceiling.
    whyItMatters: >-
      Without a real SAM/SOM boundary, valuation arguments fall back to broad TAM rhetoric and company revenue rather
      than reachable demand.
    diligencePath: >-
      Request the full Frost & Sullivan appendix or internal market model used in the Hong Kong filing and reconcile it
      to channel and category revenue splits.
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: CAC, repeat purchase, contribution margin, and payback by Douyin, Tmall, JD, DTC, and offline retail formats.
    whyItMatters: >-
      Traffic-cost inflation is a central market constraint, but public sources do not show whether Chando captures
      demand profitably after platform and influencer spend.
    diligencePath: >-
      Request cohort and channel P&Ls, including customer acquisition cost, repeat behavior, and gross-to-contribution
      waterfalls.
  - type: missing-source
    severity: material
    topic: multi-brand-diversification
    missingEvidence: Revenue, growth, and repeat-demand contribution by non-CHANDO brands and by major category.
    whyItMatters: >-
      The market narrative improves materially if smaller brands are becoming relevant, but public evidence still shows
      overwhelming dependence on the flagship brand.
    diligencePath: >-
      Ask management for brand-level revenue history, launch KPIs, and channel sell-through for MAYSU, Biorrier, Spring
      & Summer, and imine.
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: >-
      Comparable public list-price ladders, realized discount cadence, pack sizes, and retailer contract mechanics for
      Chando versus named peers.
    whyItMatters: >-
      Without those disclosures, the chapter can compare positioning and channels but cannot prove whether Chando wins
      on absolute price, premiumization, or promotion efficiency.
    diligencePath: >-
      Pull current China SKU pages, retailer screenshots, and distributor sheets for Chando, Proya, Shangmei, Marubi,
      and L'Oréal brands, then normalize by SKU size and promotion window.
    relatedQuestionRefs:
      - QP009
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: switching-costs
    missingEvidence: >-
      Public repeat-purchase, churn, retailer exclusivity, or loyalty-program evidence showing how hard it is for
      consumers or channels to switch away from Chando.
    whyItMatters: >-
      The current evidence shows reach and brand storytelling, but not strong contractual or behavioral lock-in, so moat
      durability is still partly assumed rather than demonstrated.
    diligencePath: >-
      Seek retailer interviews, loyalty-program disclosures, repeated customer cohorts, or procurement materials that
      show exclusivity, retention, or measurable multi-homing behavior.
    relatedQuestionRefs:
      - QP004
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: SKU-level list pricing, realized ASP, discount ladders, and retailer / platform take-rates by channel.
    whyItMatters: >-
      Without realized pricing and discount data, revenue quality and margin resilience cannot be separated from
      promotional intensity.
    diligencePath: >-
      Request channel P&Ls and monthly ASP / discount reports for owned e-commerce, content commerce, and offline
      retail.
    relatedQuestionRefs:
      - QI005
    relatedTableRefs:
      - TI002
  - type: private-evidence-only
    severity: blocking
    topic: channel-economics
    missingEvidence: >-
      CAC, repeat-purchase cohorts, payback periods, return rates, and contribution margin by online and offline
      channel.
    whyItMatters: >-
      Channel growth alone does not show whether digital expansion is value-accretive or merely purchased through
      marketing spend.
    diligencePath: Ask management for cohort analyses, marketing attribution, and post-return contribution margins by major channel.
    relatedQuestionRefs:
      - QI003
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: >-
      Current cash, debt facilities, covenant headroom, monthly burn, runway, and any project-finance or other
      obligations.
    whyItMatters: >-
      The business is pursuing IPO capital and outside investors, but public evidence still cannot prove whether
      liquidity is sufficient without another raise.
    diligencePath: >-
      Obtain the latest monthly cash waterfall, debt schedule, and management liquidity forecast through the planned IPO
      window.
    relatedQuestionRefs:
      - QI006
      - QI007
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: working-capital
    missingEvidence: >-
      Inventory turns, receivables and payables aging, capex, returns reserve policy, and sell-in versus sell-through
      reconciliation.
    whyItMatters: >-
      Beauty working capital can absorb cash even when reported revenue is growing, especially with broad offline
      distribution and aggressive promotion.
    diligencePath: Request audited working-capital schedules and a sell-in / sell-through reconciliation for 2024, 2025, and 2026YTD.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: control-surface
    missingEvidence: >-
      Public certifications, privacy/security disclosures, uptime evidence, or quality-audit materials for the product
      and operating stack.
    whyItMatters: >-
      Without those controls, the public trust story rests on marketing-language guardrails rather than independently
      reviewable operating evidence.
    diligencePath: >-
      Request current GMP/quality certifications, privacy and security program summaries, incident logs, and any public
      or customer-facing status materials.
    relatedQuestionRefs:
      - QE006
      - QE009
  - type: private-evidence-only
    severity: material
    topic: developer-signal-proxy
    missingEvidence: >-
      A practitioner-community or developer-signal proxy showing how technical claims are received outside company
      channels.
    whyItMatters: >-
      This chapter's brief explicitly calls for developer-signal or a close proxy, but the assigned pool does not
      contain public engineering-community, partner-integration, or practitioner-discussion evidence strong enough to
      validate adoption.
    diligencePath: >-
      Request public API/integration references, practitioner talks, partner engineering posts, or community evidence
      that the product and data stack is used and discussed outside brand-controlled marketing.
    relatedQuestionRefs:
      - QE009
  - type: missing-source
    severity: material
    topic: post-launch-efficacy
    missingEvidence: >-
      Independent post-launch efficacy, repeat-purchase, and non-flagship adoption evidence for newer anti-aging and
      specialist sub-brand releases.
    whyItMatters: >-
      The public moat case depends on technical repeatability, but current evidence proves launch activity more clearly
      than sustained user outcomes.
    diligencePath: >-
      Request cohort retention, repurchase, user-study, and sell-through evidence by hero line and sub-brand, ideally
      from third-party channels or customer references.
    relatedQuestionRefs:
      - QE004
      - QE007
      - QE009
  - type: private-evidence-only
    severity: material
    topic: retention-gap
    missingEvidence: NRR, GRR, churn, renewal-rate, repeat-purchase, and cohort data by brand and channel.
    whyItMatters: >-
      Without retention metrics, investors can validate reach but not durability, CAC payback quality, or
      land-and-expand economics.
    diligencePath: >-
      Request cohort, repeat-purchase, and channel-retention tables from the company or underwriting diligence room,
      broken out by flagship and sub-brands.
    relatedQuestionRefs:
      - QU007
      - QU008
  - type: missing-source
    severity: material
    topic: named-customer-proof
    missingEvidence: >-
      Independent named customer or retailer case studies with measurable outcomes, reorder behavior, or shelf
      productivity.
    whyItMatters: Event attention and company-run programs are weaker proof than third-party verified adoption or repeat purchase.
    diligencePath: >-
      Obtain retailer sell-through references, named marketplace case studies, or third-party review / procurement
      evidence that ties Chando products to measurable repeat demand.
    relatedQuestionRefs:
      - QU004
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: channel-concentration
    missingEvidence: Top platform, top retailer, and top channel concentration plus offline productivity and promotional dependency.
    whyItMatters: >-
      Near-70% online mix can be a strength or a fragility depending on concentration, discounting, and platform
      economics.
    diligencePath: >-
      Request channel mix by marketplace and owned DTC, customer acquisition / repeat rates by channel, and top-account
      concentration disclosures from management.
    relatedQuestionRefs:
      - QU003
      - QU005
      - QU008
  - type: enumeration-incomplete
    severity: material
    topic: Regulatory / legal risk register coverage
    missingEvidence: >-
      A regulator- and court-level list of recalls administrative penalties IP disputes data-privacy matters and pending
      lawsuits affecting Chando or its operating subsidiaries.
    whyItMatters: >-
      The assigned pool is strong on IPO, governance, and operating-model risk but weak on direct regulator or court
      records, so the legal-risk register cannot be treated as exhaustive.
    diligencePath: >-
      Pull the latest HKEX prospectus risk factors, search NMPA recall and penalty records, review PRC court dockets and
      IP-office disputes, and reconcile any hits against the listed entities in the filing.
    relatedQuestionRefs:
      - QR007
    relatedTableRefs:
      - TR001
  - type: missing-source
    severity: material
    topic: Supplier distributor and marketplace concentration
    missingEvidence: >-
      Named supplier distributor marketplace and logistics concentration with contract terms termination rights and any
      top-counterparty revenue or procurement shares.
    whyItMatters: >-
      Partner and platform concentration can turn a commercial slowdown into an abrupt execution shock, but the assigned
      public pack does not quantify counterparty dependence.
    diligencePath: >-
      Request the top ten customer supplier and marketplace schedules from the filing workpapers, plus channel contracts
      and renewal terms for the key online platforms.
  - type: private-evidence-only
    severity: material
    topic: Channel economics and media ROI
    missingEvidence: >-
      Channel-level CAC repeat-purchase contribution margin and marketing ROI broken out by flagship versus incubation
      brands.
    whyItMatters: >-
      The current public record is enough to flag the risk but not enough to decide whether Chando is buying durable
      growth or merely preserving share through expensive media.
    diligencePath: >-
      Obtain management reporting on media mix, CAC payback, cohort repeat, and contribution margin by major channel and
      brand family for 2024, 2025, and 2026 YTD.
  - type: private-evidence-only
    severity: material
    topic: ipo-terms
    missingEvidence: >-
      Final IPO price range, target proceeds, lock-up structure, and any remaining preference or conversion mechanics
      tied to the pre-IPO round.
    whyItMatters: >-
      Without the actual offer structure, investors cannot test whether the public entry price offers upside versus the
      last disclosed private mark.
    diligencePath: >-
      Obtain the live IPO term sheet or final prospectus with pricing and cap-table mechanics before moving from track
      to an underwriting decision.
    relatedQuestionRefs:
      - QV008
  - type: private-evidence-only
    severity: material
    topic: channel-unit-economics
    missingEvidence: Channel-level CAC, repeat-purchase behavior, contribution margin, and payback for the online-heavy sales mix.
    whyItMatters: >-
      Heavy marketing intensity can be acceptable if unit economics are strong, but weak payback would justify a lower
      multiple.
    diligencePath: >-
      Request channel cohort and payback data from management and reconcile it with audited gross margin and
      marketing-spend disclosure.
    relatedQuestionRefs:
      - QV008
  - type: missing-source
    severity: material
    topic: brand-diversification
    missingEvidence: >-
      Independent evidence that non-flagship brands can become a meaningful share of revenue rather than remaining
      narrative optionality.
    whyItMatters: The flagship concentration is the cleanest reason public investors may refuse to pay a premium multiple.
    diligencePath: >-
      Ask for brand-level revenue and growth by sub-brand for 2024, 2025, and 2026 year-to-date, then compare it with
      independent retailer or channel data.
    relatedQuestionRefs:
      - QV008
