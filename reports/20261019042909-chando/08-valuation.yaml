      - ["Base", "IPO path stays open, growth/profit remain intact, but concentration and governance concerns cap rerating.", "Sensitivity frame of roughly 1.3x-1.6x 2025 sales implies about RMB 6.9-8.5 billion, clustering around the last disclosed 7.14 billion RMB private mark.", "If offer terms are investor-unfriendly, even this range may prove generous.", "Consistent with the current evidence set: real scale, real investors, but not enough proof for a premium call."]
      - ["Bear", "Listing drags, channel economics disappoint, or new disclosures make the marketing / control / concentration profile harder to underwrite.", "Sensitivity frame of roughly 0.8x-1.1x 2025 sales implies about RMB 4.3-5.9 billion, consistent with a down-round or discounted IPO outcome.", "The downside can arrive quickly if execution stalls or public buyers demand a higher risk discount.", "Triggered by renewed filing friction, worsening profitability quality, or proof that brand expansion is not reducing reliance on CHANDO."]
    notes: "Scenario ranges are heuristic sensitivity bands anchored on disclosed 2025 revenue and the visible Proya public-multiple reference; they are not a formal DCF or target-price model."
