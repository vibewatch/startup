company:
  name: Chando
chapter:
  number: 8
  title: Valuation
  summary: >-
    Chando still looks investable but not yet underwritable at a clear edge: the
    latest public evidence shows 2025 revenue of RMB 5.318 billion, profitability,
    and a last disclosed private valuation of about RMB 7.14 billion, but it also
    shows flagship-brand dependence above 95%, family control near 88%, and an
    IPO story that has already required a refiling. The current evidence therefore
    supports a **track** recommendation with **medium** confidence, **high** risk,
    and a **fair** valuation stance until the offer price, proceeds plan, and
    preference/dilution mechanics are public.
sections:
  - id: recommendation-and-entry-discipline
    title: Recommendation and entry discipline
    body: |-
      Public evidence supports a constructive but price-disciplined stance. Chando has real scale, with 2025 revenue reported at RMB 5.318 billion and net profit at RMB 351 million, and it has already attracted named outside capital from L'Oréal and Jiahua-linked entities at a disclosed post-money valuation of roughly RMB 7.14 billion. That means this is not a concept-stage brand story; it is a profitable, late-stage beauty platform that is already being framed for a Hong Kong listing.

      The problem is that the same evidence package also argues against a clean underwriting call today. The flagship CHANDO brand still generated 95.3% of 2025 revenue, the Zheng siblings retained about 87.82% of pre-IPO ownership, and adverse reporting highlighted concerns around concentration, marketing efficiency, and the hearing-stage friction that contributed to the earlier filing lapse. Those signals make the company investable only at the right entry price and with tighter diligence on whether the current financing mark can clear public-market scrutiny without a discount.

      The right call is therefore **track**, not buy: the disclosed private mark is not obviously stretched relative to public beauty comps, but the evidence does not yet justify paying through that mark before the final IPO range, use of proceeds, and any remaining overhang from pre-IPO terms are visible.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV005
      - CV006
      - CV012
      - CV013
      - CV014
    tableRefs:
      - TV001
      - TV002
    figureRefs:
      - FV001
  - id: scenario-framing-and-comps
    title: Scenario framing and comparable context
    body: |-
      The disclosed valuation context is usable for scenario framing but still too thin for a precision target. Chando's last disclosed private valuation of RMB 7.14 billion implies roughly 1.34x 2025 sales using the RMB 5.318 billion revenue figure cited around the refreshed IPO filing. That sits below the public reference visible in the assigned pool: Proya traded around 2.11x price-to-sales and 1.64x EV-to-revenue on 2026-06-30. On that narrow lens alone, Chando does not screen obviously expensive.

      But the comp read has to be discounted for quality and mix. Chando remains far more concentrated in one flagship brand than diversified peers, and adverse reporting shows 2025 first-half R&D intensity falling to 1.7% of revenue while sales and marketing ran at 55% of revenue. That mix does not invalidate the current private mark, but it does limit how much multiple expansion an investor should assume before the company proves that newer brands and technology claims can become material in revenue rather than just in narrative.

      The most supportable base case is therefore a valuation range clustered around the last disclosed round rather than a sharp step-up. A bull case needs proof that the refiling converts into a clean listing and that brand concentration falls. A bear case is driven by another listing delay, heavier discounting, or evidence that customer acquisition and channel economics are weaker than the current prospectus-style revenue growth implies.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV006
      - CV009
      - CV010
      - CV011
      - CV013
      - CV014
    tableRefs:
      - TV003
  - id: exit-readiness-and-diligence-asks
    title: Exit readiness, diligence asks, and thesis-break triggers
    body: |-
      Exit readiness is real but incomplete. Chando has already restarted its Hong Kong IPO process, has profitable disclosed financials, and can point to outside strategic and financial investors plus an official narrative around multi-brand expansion, digital operations, and ingredient-led R&D. Those features keep the company in the investable set and explain why a public listing remains plausible.

      What is still missing is the evidence required to turn plausibility into conviction. The assigned pool does not disclose the final IPO price range, proceeds plan, lock-up or preference mechanics, or channel-level unit economics after heavy online selling. Public reporting also continues to show a business that is highly dependent on one core brand while spending aggressively on marketing and relatively lightly on R&D. Until those gaps close, the right posture is to keep the company on the watchlist and only engage if price, structure, and post-promotion economics improve the payoff asymmetry.

      The cleanest thesis-break triggers are measurable: another lapse or material delay in the Hong Kong path, flagship-brand concentration staying above 90%, sales and marketing intensity remaining above half of revenue without better profit quality, or evidence that outside investors entered on terms that leave new-money IPO buyers structurally subordinated.
    claimRefs:
      - CV001
      - CV005
      - CV006
      - CV007
      - CV008
      - CV010
      - CV011
      - CV012
