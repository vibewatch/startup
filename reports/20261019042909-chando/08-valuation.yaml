      - ["Core anti-thesis is concentration plus efficiency risk", "Independent adverse reporting highlighted brand dependence, high marketing intensity, lower R&D intensity, family control, and listing friction.", "A cleaner IPO process plus a lower flagship revenue share and better spend productivity would reduce the anti-thesis."]
