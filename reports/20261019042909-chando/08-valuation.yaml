        - id: execution
          label: "Execution and governance risk"
          detail: "Prior filing lapsed; adverse reporting flagged heavy marketing, lower R&D intensity, and concentrated family control."
        - id: recommendation
          label: "Track / fair / high risk"
          detail: "Wait for IPO price, structure, and cleaner proof on mix diversification before underwriting upside."
      edges:
        - from: scale
          to: funding
          label: "Makes outside capital plausible"
        - from: funding
          to: valuation
          label: "Sets the last disclosed private mark"
        - from: valuation
          to: concentration
          label: "Needs quality discount"
        - from: concentration
          to: execution
          label: "Raises underwriting friction"
        - from: execution
          to: recommendation
          label: "Keeps recommendation at track"
    approximationNotes: "The ~1.34x sales figure is a simple implied multiple from the disclosed 7.14 billion RMB post-money valuation divided by reported 2025 revenue."
