  evidenceGaps:
    - type: enumeration-incomplete
      severity: material
      topic: Regulatory / legal risk register coverage
      missingEvidence: A regulator- and court-level list of recalls administrative penalties IP disputes data-privacy matters and pending lawsuits affecting Chando or its operating subsidiaries.
