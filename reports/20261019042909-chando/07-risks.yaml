figures:
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: The highest residual risk clusters around IPO/governance execution, flagship concentration, and marketing-heavy economics rather than around a disclosed product incident.
    data:
      columns:
        - Likelihood
        - Impact
        - Mitigation maturity
      rows:
        - label: IPO / governance execution
          note: Refiling reduces timing pressure but does not remove the family-control and disclosure questions raised in adverse coverage.
          values:
            - label: High
              tone: high
              note: The first filing lapsed before the company refiled.
            - label: High
              tone: critical
              note: The listing underpins capital access, M&A flexibility, and governance signaling.
            - label: Medium
              tone: warning
              note: Sponsors, external investors, and independent directors help, but the core control structure remains intact.
        - label: Flagship brand concentration
          note: The portfolio still relies overwhelmingly on the core CHANDO brand.
          values:
            - label: High
              tone: high
              note: Independent reporting puts flagship revenue contribution at roughly 95%.
            - label: High
              tone: critical
              note: Any slowdown in the core franchise would hit growth and bargaining power immediately.
            - label: Low-Medium
              tone: risk
              note: Secondary brands are growing, but from too small a base to diversify group economics yet.
        - label: Marketing-heavy profit model
          note: Revenue growth has not eliminated margin volatility.
          values:
            - label: High
              tone: high
              note: Marketing cost reached 55% of 2025 H1 revenue.
            - label: High
              tone: critical
              note: High media dependence can preserve top-line growth while weakening earnings quality.
            - label: Medium
              tone: warning
              note: Management can moderate spend, but the public pack does not show ROI discipline by channel.
        - label: Innovation conversion risk
          note: Scientific output is visible, but the public record still shows low reported R&D intensity.
          values:
            - label: Medium
              tone: warning
              note: The company has real R&D output, but spending intensity has drifted down.
            - label: Medium-High
              tone: risk
              note: Failure to monetize the science narrative would reinforce the current marketing-heavy model.
            - label: Medium
              tone: warning
              note: IFSCC papers, ingredient development, and ESG targets show intent, but the commercialization evidence is still incomplete.
        - label: Channel / platform concentration
          note: A high online-sales mix leaves execution exposed to content-commerce and marketplace shifts.
          values:
            - label: Medium-High
              tone: risk
              note: Public reporting put online sales at 68.8% of revenue by 2025 H1.
            - label: Medium-High
              tone: risk
              note: Platform or algorithm changes can hit both sales volume and the efficiency of paid acquisition.
            - label: Medium
              tone: warning
              note: DTC capability exists, but the assigned pool does not show channel concentration or contract protections by platform.
        - label: Strategic capital dependence
          note: Recent financing and the IPO process help liquidity, but they also raise execution expectations.
          values:
            - label: Medium
              tone: warning
              note: The new capital is already closed, but future flexibility still depends on smooth listing execution.
            - label: Medium-High
              tone: risk
              note: A delayed or weak listing would slow the company's stated expansion, brand-building, and M&A options.
            - label: Medium
              tone: warning
              note: Strategic investors and sponsors are present, yet that support is not a substitute for cleaner underlying economics.
    approximationNotes: Ordinal heatmap based on sourced indicators and disclosed mitigations; it does not claim quantified default probabilities.
    claimRefs: [CR001, CR003, CR004, CR007, CR008, CR009, CR010, CR013, CR014, CR016]
