companyProfile:
  summary: >-
    Volta is a London-headquartered AI infrastructure company founded in January 2026 by Ricard Boada and
    Sofia Gumuzio. The company emerged from stealth on 4 August 2026 positioning itself as "The Utility of
    Compute," a fully vertically integrated platform spanning capital, powered land, data centers, compute,
    software, and operations. Volta's flagship public project is an AI factory in Tydal, Norway built on
    NVIDIA Vera Rubin systems in partnership with Bitdeer and Dell, with Bitdeer disclosing 121 IT MW /
    133 gross MW, approximately $4.7B of base-term site economics, and around $1.3B of expected letter-of-
    credit support. Public reporting values Volta at approximately $2.4B after a reported $300M Seed plus
    Series A financing backed by Azora, Andreessen Horowitz, Altimeter, NVIDIA, and Michael Dell's family
    office. The business is strategically compelling because it attempts to solve AI-infrastructure financing,
    but it remains hard to underwrite because revenue, margins, customer breadth, and operational performance
    are still largely undisclosed.
  foundedDate: "2026-01-09"
  founders:
