  productSummary: >-
    Volta sells dedicated AI factories rather than generic self-serve cloud instances. The public product stack
    includes capital formation, power sourcing, campus development, NVIDIA-based compute clusters, in-house
    provisioning/orchestration software, and end-to-end operations. The flagship configuration centers on
    NVIDIA Vera Rubin systems, direct liquid cooling, and large-scale AI-factory deployment in Norway.
  customerFocus: >-
    Frontier AI labs are the clearest lead segment, followed by AI-native scale-ups and enterprises that need
    dedicated AI capacity without self-funding a hyperscale-class infrastructure build.
  businessModel: >-
    Negotiated, long-duration AI-factory contracts that likely bundle dedicated compute access, financing,
    operations, and software. Public evidence shows the financing stack and site-level obligations much more
    clearly than recognized revenue, retained margins, or cash conversion.
