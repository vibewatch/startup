callouts:
  - calloutType: insight
    title: Volta has unusually large customer proof for its age, but almost no breadth
    body: >-
      The flagship relationship is meaningful because it is large, specific, and apparently tied to a demanding AI
      customer. It is risky because nearly all public customer evidence collapses into that one relationship.
    claimRefs:
      - CU011
      - CU013
      - CU027
      - CU036
  - calloutType: risk
    title: The real retention test has not happened yet
    body: >-
      Until the Norway deployment goes live and stays mission-critical for the customer, investors cannot observe
      whether Volta is creating durable customer behavior or just signing ambitious infrastructure contracts.
    claimRefs:
      - CU019
      - CU020
      - CU022
      - CU025
