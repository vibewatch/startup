callouts:
  - calloutType: insight
    title: Financing-first positioning is the core differentiator
    body: >-
      Public materials suggest Volta is less a conventional startup cloud and more a project-finance platform
      wrapped around AI data-center execution. That could be a real moat if it lowers capital cost, but it also
      means the investment case depends on credit, counterparties, and delivery milestones as much as on software.
    claimRefs:
      - CO002
      - CO026
      - CO027
      - CO032
  - calloutType: risk
    title: Public proof remains ahead of operating proof
    body: >-
      Volta has high-quality counterparties and unusually large disclosed economics for a company only months old,
      but no public audited financials, no live public uptime record, and no direct customer confirmation of the
      flagship AI-lab contract.
    claimRefs:
      - CO039
      - CO041
      - CO043
      - CO045
