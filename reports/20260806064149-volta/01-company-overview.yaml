  - id: launch-milestones-scale-and-adverse
    title: Milestones, scale signals, and adverse considerations
    body: >-
      Volta moved from incorporation to public launch in less than seven months, which is itself the core
      adverse consideration in the chapter. The company has not yet demonstrated multi-year operating
      reliability, revenue recognition, or facility delivery under its own name. Still, the early milestone set
      is material: incorporation in January 2026; formal governance and share-capital filings across April to
      July; Bitdeer’s March 2026 Tydal conversion announcement establishing the Norway campus as a Vera Rubin-
      ready AI site; Bitdeer’s June 2026 notice of an unsigned-but-conditional lease; and the 4 August 2026
      launch in which Volta disclosed a $10 billion strategic AI-lab partnership, 130 MW+ of gross contracted
      Norway capacity, 1 GW+ near-term pipeline, and a 100,000+ GPU pipeline. TechCrunch, Reuters, and several
      secondary outlets attribute the AI-lab counterparty to Anthropic via Bloomberg-sourced reporting, but
      Anthropic had not publicly confirmed the customer relationship at publication and Volta did not name the
      customer on its own site. The Register’s skeptical framing underscores the key diligence risk: a months-
      old company is asking investors to underwrite gigawatt-scale delivery and billions of dollars of implied
      contractual revenue before the first site is live. Volta’s evidence today is strongest on counterparties,
      leadership, and financing architecture; it is materially weaker on audited operating proof, revenue,
      and downstream customer diversification.
