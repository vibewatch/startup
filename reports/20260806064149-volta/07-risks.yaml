callouts:
  - calloutType: insight
    title: Most of Volta's risks are linked, not independent
    body: >-
      The same dependencies that make the model powerful — partner capital, hardware access, and one large anchor
      customer — also create correlated downside if execution slips.
    claimRefs:
      - CR020
      - CR022
      - CR029
      - CR036
  - calloutType: risk
    title: The first deployment is the whole proof stack right now
    body: >-
      Because Volta is early, the Tydal project simultaneously tests operational readiness, financing credibility,
      customer durability, and moat narrative. One visible miss could damage all four at once.
    claimRefs:
      - CR011
      - CR015
      - CR024
      - CR030
