evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: flagship-customer-confirmation
    missingEvidence: Direct customer confirmation and redacted commercial terms for the reported Anthropic contract.
    whyItMatters: The flagship demand anchor is central to the investment thesis and customer concentration assessment.
    diligencePath: >-
      Request signed contract summary, counterparty confirmation, minimum-commit schedules, and termination rights under
      NDA.
    relatedQuestionRefs:
      - QO017
  - type: private-evidence-only
    severity: material
    topic: cap-table-governance
    missingEvidence: Board committee structure, investor rights, liquidation preferences, and post-Series A cap table.
    whyItMatters: Control rights and preference overhang can materially affect future financings and downside economics.
    diligencePath: Obtain shareholder agreement, board consents, most recent cap table, and side-letter summary.
    relatedQuestionRefs:
      - QO026
    relatedTableRefs:
      - TO002
      - TO003
      - TO004
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Audited or management revenue, margin, burn, cash, and debt-program economics.
    whyItMatters: Without operating metrics, investors cannot connect valuation and contracted demand to actual unit economics.
    diligencePath: Request 2026 operating plan, launch-to-date bookings, and debt/LOC documentation.
    relatedQuestionRefs:
      - QO023
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: minor
    topic: norway-capacity-labeling
    missingEvidence: Clear reconciliation between Volta's 130MW+/133MW language and Bitdeer's 121 IT MW / 133 gross MW framing.
    whyItMatters: Misreading gross power as critical IT load would distort capacity and revenue density assumptions.
    diligencePath: Request engineering one-pager with gross MW, IT MW, PUE assumptions, and phased energization schedule.
    relatedQuestionRefs:
      - QO018
    relatedTableRefs:
      - TO001
      - TO005
  - type: private-evidence-only
    severity: minor
    topic: Genesis-Cloud-integration
    missingEvidence: Transaction terms and integration status for the Genesis Cloud technology acquisition.
    whyItMatters: The quality and maturity of the inherited software stack affect Volta's launch readiness.
    diligencePath: Request acquisition summary, retained engineering roster, and platform integration roadmap.
    relatedQuestionRefs:
      - QO024
  - type: missing-source
    severity: material
    topic: direct-sam-definition
    missingEvidence: >-
      A third-party market study that isolates financed dedicated AI-factory demand from generic GPU cloud and
      hyperscaler capex.
    whyItMatters: >-
      Without a cleaner category definition, Volta's true SAM can be overstated by broad cloud or AI-infrastructure TAM
      figures.
    diligencePath: >-
      Request internal market maps, banker decks, and customer pipeline segmentation used in Volta's Series A
      fundraising.
    relatedQuestionRefs:
      - QM025
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-pipeline
    missingEvidence: Customer pipeline by segment, average contract size, and conversion assumptions.
    whyItMatters: Public market opportunity is large, but monetizable near-term demand depends on segment mix and close rates.
    diligencePath: Request pipeline dashboard, forecast conversion assumptions, and top-20 prospect list under NDA.
    relatedQuestionRefs:
      - QM013
      - QM025
    relatedTableRefs:
      - TM003
  - type: stale
    severity: minor
    topic: capex-claim
    missingEvidence: Independent corroboration or methodology for Volta's claimed $15T AI-infrastructure capex figure.
    whyItMatters: A large macro number can anchor valuation narratives even if it is too broad or weakly sourced.
    diligencePath: >-
      Ask management for the original analysis supporting the claim and cross-check it against independent market
      research.
    relatedQuestionRefs:
      - QM024
  - type: private-evidence-only
    severity: material
    topic: adoption-path
    missingEvidence: Actual customer procurement timelines and financing close durations for Volta-style contracts.
    whyItMatters: A long or fragile adoption path could shrink the practical market despite strong macro demand.
    diligencePath: Request postmortem timeline for the flagship AI-lab contract and signed term-sheet funnel statistics.
    relatedQuestionRefs:
      - QM015
      - QM016
    relatedTableRefs:
      - TM003
      - TM004
  - type: missing-source
    severity: material
    topic: realized-pricing
    missingEvidence: >-
      Signed customer pricing, discount ladders, and total-cost-of-service comparisons versus hyperscalers and
      specialist AI clouds.
    whyItMatters: >-
      Without normalized realized pricing, it is hard to test whether Volta's financing edge produces better customer
      economics.
    diligencePath: >-
      Request executed commercial terms for the first flagship deployment and benchmark TCO models against CoreWeave,
      Lambda, and hyperscaler reservations.
    relatedQuestionRefs:
      - QP013
      - QP023
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: delivery-proof
    missingEvidence: >-
      Commissioning data, uptime metrics, deployment SLAs, and post-launch customer satisfaction for Volta-delivered AI
      factories.
    whyItMatters: Volta's moat is execution-led; without operational proof, the competitive narrative remains mostly rhetorical.
    diligencePath: >-
