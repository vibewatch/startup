      - number: '4.3'
        title: Public traction, GTM efficiency proxies, and capital adequacy
        blocks:
          - type: paragraph
            body: >-
              Public traction evidence is thin in the usual startup-finance sense. Volta does not publicly disclose
              revenue, ARR, bookings outside the reported flagship contract, gross margin, headcount by function, cash
              on hand, monthly burn, or runway. What it does disclose is capital structure: approximately $300 million
              in seed and Series A equity according to multiple outlets; a $5 billion AI Infrastructure Program backed
              by Azora per official materials; and a Bitdeer-side expectation of roughly $1.3 billion in letters of
              credit for the flagship Tydal arrangement. Those figures imply that capital adequacy for Volta should be
              thought of in layers: corporate equity for team and platform build-out, project capital for campuses and
              hardware, and credit support that helps counterparties underwrite performance. GTM efficiency is similarly
              non- standard. Sales cycles are likely long, high-touch, and concentrated in a small number of enormous
              buyers, which means traditional SaaS CAC payback frameworks are not the right benchmark. A more relevant
              question is whether Volta can repeatedly convert signed customer demand into financeable, deliverable
              projects faster than incumbents and with less dilution than a balance-sheet-heavy self-build model would
