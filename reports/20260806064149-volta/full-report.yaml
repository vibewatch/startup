  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segmentation by buyer, user, payer, and use case
        blocks:
          - type: paragraph
            body: >-
              Volta's public materials outline a customer map with three principal segments. The first and most
              important segment is frontier AI labs that need dedicated large-scale compute. The second is AI-native
              scale-ups that want dedicated infrastructure without self-funding hyperscale deployment. The third is
              enterprise customers that may value dedicated or regional capacity over public-cloud quotas. In each case,
              the buyer is not necessarily the day-to-day end user. Buyers are likely infrastructure, finance, or
              executive teams; users are model-training, inference, or platform-engineering teams; and payers are either
              treasury or a project-level financing vehicle. Geography matters as well: Volta's flagship proof sits in
              Norway while the company presents itself as a European AI-infrastructure provider with offices in London,
              Palo Alto, and New York. The public evidence does not yet provide customer counts by segment, but the
              targeting logic is clear: Volta is pursuing customers whose compute demand and financing complexity are
              both high.
