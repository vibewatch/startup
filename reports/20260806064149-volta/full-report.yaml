      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Most of Volta's risks are linked, not independent
            body: >-
              The same dependencies that make the model powerful — partner capital, hardware access, and one large
              anchor customer — also create correlated downside if execution slips.
            calloutType: insight
