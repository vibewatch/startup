  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal risks
        blocks:
          - type: paragraph
            body: >-
              Volta's most visible legal and regulatory exposures arise from two domains. First, AI-governance and data-
              related obligations in Europe continue to evolve. Skadden notes that the AI Act's high-risk obligations
              have been delayed, but transparency obligations still begin in August 2026; this matters because Volta is
              positioning itself as a European AI-infrastructure platform serving sophisticated buyers that may expect
              clear disclosure, governance, and contractual controls around AI systems. Second, advanced-computing
              export controls remain a material ecosystem risk. BIS guidance in May 2026 clarified that license
              requirements still apply to advanced-computing exports involving D:5- or Macau-headquartered entities,
              even when those entities sit outside those jurisdictions. BIS has also continued to harden controls and
              due-diligence expectations around advanced semiconductors and foundries. Volta is not publicly framed as
              violating any of these rules, but its business depends on procuring and deploying cutting-edge NVIDIA
              systems at scale. Legal risk also appears in contract structure: customer identity is partly indirect,
              site delivery is partner-led, and service-level responsibility allocation is not publicly disclosed in
              detail. For an infrastructure company selling trust as much as compute, disclosure thinness itself is a
              risk.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
