  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The bull thesis for Volta is attractive and coherent. AI compute is becoming a strategic infrastructure
              bottleneck; Europe wants more local capacity; frontier labs need dedicated access; and Volta is trying to
              solve the financing problem that prevents non-hyperscalers from securing infrastructure on attractive
              terms. If the company's first flagship deployment works, it could earn a privileged position between
              capital markets, infrastructure owners, and compute-hungry AI buyers. The anti-thesis is equally strong.
              Public evidence supports ambition more than proof. The company is extremely young, the customer base is
              not diversified publicly, the first project carries many linked dependencies, and the reported valuation
              already prices in more than seed-stage optionality. Investors are therefore not underwriting a standard
              startup; in effect they are underwriting a new infrastructure-intermediation model before public revenue
              quality is visible.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
