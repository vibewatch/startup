      - number: '1.2'
        title: Founders, leadership, and governance
        blocks:
          - type: paragraph
            body: >-
              Volta was co-founded by Ricard Boada and Sofia Gumuzio, with Boada serving as chief executive officer and
              Gumuzio as chief corporate development officer. The official company page frames both founders as
              investors and operators coming from large-cap infrastructure asset management rather than from a pure
              software background, which matches third-party reporting that connects both to Brookfield’s infrastructure
              business. That background is central to the thesis: Volta is trying to import project- finance discipline
              into AI infrastructure deployment. The launch leadership bench is unusually senior for a company only
              months old. Patrick McGregor joined as chief product officer after product leadership at Crusoe and Google
              AI/Google Cloud; Raimund Riedl came from Citi’s global data-center investment-banking practice as CFO;
              Paul Henry previously led Google’s EMEA data-center delivery; and Tristan Helmich, the CTO, previously
              built Genesis Cloud’s production-scale AI cloud stack. Volta also hired senior capital markets, tax,
              accounting, data-center delivery, and operations leaders from J.P. Morgan, Deloitte, Google, Amazon,
              VIRTUS Data Centres, and CoreWeave. Governance is still thinly disclosed, but the filing history shows a
              rapid post-founding build-out: Ricard Boada initially held 75%+ control before ceasing as a registrable
              PSC in April 2026, while director appointments in late June and July 2026 added Sofia Gumuzio, Jamin Ball,
              Shangda Xu, Rangarajan Raghuram, and Francisco Javier Rodríguez Heredia. Those appointments imply investor
              and strategic-governance formalization immediately around the capital raise, but board committee
              structure, voting rights, and shareholder protections remain undisclosed.
