      - number: '8.2'
        title: Current valuation context and comparable set
        blocks:
          - type: paragraph
            body: >-
              The best public valuation anchors are comparable infrastructure businesses rather than software companies.
              CoreWeave provides the clearest high-growth public benchmark: StockAnalysis shows a roughly $49.0 billion
              market cap, about $6.23 billion of trailing revenue, and a current P/S ratio near 7.9x, while its
              statistics page shows EV/Sales above 13x and heavy debt intensity. Bitdeer provides a rough lower-quality,
              higher-asset-intensity reference: around 3.6x current P/S, EV/Sales near 6.0x, and deeply negative free
              cash flow according to StockAnalysis. These comps are imperfect. CoreWeave is far more mature and proven;
              Bitdeer is a hybrid mining/AI infrastructure operator rather than a clean Volta analogue. Volta itself
              does not disclose revenue, so no forward or trailing multiple can be computed publicly. That pushes
              valuation back to milestone underwriting: customer validity, delivery success, diversification, financing
              cost, and margin capture. The key question is not "what multiple should Volta trade on today?" but "what
              proof must appear before a $2.4 billion price can be considered disciplined rather than speculative?"
            claimRefs:
              - CV009
