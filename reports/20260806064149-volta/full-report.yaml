  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and substitute set
        blocks:
          - type: paragraph
            body: >-
              Volta sits at the intersection of neoclouds, infrastructure developers, and hyperscaler substitutes. The
              direct-peer set includes specialist AI clouds that explicitly market GPU clusters, AI factories, or
              full-stack training and inference infrastructure. CoreWeave positions itself as the essential cloud for AI
              with platform tooling, global AI data centers, and a large public-scale commercial footprint. Lambda sells
              a broad ladder from self-serve instances to superclusters and publishes transparent pricing for B200 and
              H100 capacity. Crusoe markets a full AI cloud spanning build, train, and serve with managed
              infrastructure. Nscale is especially relevant because it pairs European and U.S. data-center footprints
              with full-stack AI infrastructure, making it one of the closest thematic competitors to Volta's
              Europe-first factory story. Together AI blends cloud infrastructure with model and inference services,
              while Voltage Park combines AI factory language with reserved and on-demand cloud offerings and, after its
              merger with Lightning AI, leans more toward an integrated application/developer platform. The substitute
              set also includes direct use of Google Cloud, AWS, Azure, and Oracle GPU infrastructure, plus enterprise
              self-build. For many buyers, the question is not simply "Which GPU cloud is cheapest?" but "Who can
              secure, finance, deliver, and run scarce capacity with the least friction and the most confidence?" That
              broader framing helps explain why Volta wants to be compared not only to GPU lessors, but also to
              infrastructure developers and financing- enabled operators.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
