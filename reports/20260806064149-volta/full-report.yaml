      - number: '4.2'
        title: Cost structure, gross-margin drivers, working-capital profile, and capex burden
        blocks:
          - type: paragraph
            body: >-
              The public cost structure is dominated by capital intensity. Volta claims to control the stack from
              capital to operations, but the Tydal disclosures show how much fixed infrastructure is required to make
              that claim real. Bitdeer's materials describe 121 IT MW supported by 133 gross MW under a 16-year
              arrangement, with remaining site capex of approximately $500 million and a proposed credit backstop of
              about $1.3 billion. Those figures show that even if Volta avoids owning every asset outright, it still
              operates in a world of very large pre-delivery commitments. Gross-margin potential depends on at least
              five variables: secured power economics, debt pricing, supplier terms on NVIDIA-based systems, the spread
              between Volta's contracted customer pricing and its infrastructure obligations, and site utilization after
              commissioning. Working capital may be less about inventory turns than about milestone timing, letters of
              credit, and how quickly end-customer commitments convert into cash receipts. The key analytical challenge
              is that public information reveals the scale of obligations better than the scale of retained margin. This
              makes Volta look more like a project-finance and infrastructure-orchestration company than like a
              conventional gross- margin software business.
