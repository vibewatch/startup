      - number: '8.4'
        title: Recommendation, confidence, valuation stance, and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              On public evidence alone, the disciplined recommendation is to defer underwriting Volta at the current
              price until the first deployment and the broader customer/financial proof set improve. This is not a call
              that the model is bad; it is a call that the current information set is too thin relative to the valuation
              already being asked of investors. Confidence in that recommendation is moderate because the market thesis
              is genuinely strong and the flagship partnership may prove transformative. But risk is high, and the
              valuation stance should be treated as rich relative to disclosed proof. A more constructive investment
              posture would require at least four upgrades: validated commissioning at Tydal, clearer revenue-quality
              and margin data, reduced customer concentration, and evidence that the financing-led model can repeat
              beyond one flagship account. It would also require clearer governance, trust, and contractual allocation
              proof so that downside scenarios can be bounded rather than merely imagined.
            claimRefs:
              - CV029
