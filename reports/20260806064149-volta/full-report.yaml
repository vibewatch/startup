      - number: '5.2'
        title: Architecture and operating model
        blocks:
          - type: paragraph
            body: >-
              Volta's public architecture story is unusually explicit for such a young company. The company says its
              gigascale campuses are built using NVIDIA's DSX platform, engineered for extreme GPU density and direct
              liquid cooling. Compute is described as NVIDIA Vera Rubin systems on either InfiniBand or RoCE networks,
              provisioned through in-house automation and orchestration software rather than licensed third-party
              control planes. The software claim matters because Volta argues that owning the provisioning layer is what
              enables fully automated compute delivery and avoids vendor hand-offs. The physical model is partly
              corroborated by Bitdeer: the Tydal campus is designed for AI colocation according to the NVIDIA reference
              design, with 121 IT MW / 133 gross MW under the lease, a PUE around 1.1, high-capacity fiber, dual-grid
              connectivity, and renewable local hydropower. This architecture makes sense for the problem Volta is
              trying to solve: large- scale dedicated training and inference capacity where facility design, networking,
              and operating software must all align. What remains missing is the internal systems detail a technical
              buyer would usually want: scheduler design, tenancy model, observability surface, failure-domain handling,
              API structure, and actual delivered performance benchmarks.
