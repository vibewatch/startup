          - type: callout
            title: The first deployment is the whole proof stack right now
            body: >-
              Because Volta is early, the Tydal project simultaneously tests operational readiness, financing
              credibility, customer durability, and moat narrative. One visible miss could damage all four at once.
            calloutType: risk
