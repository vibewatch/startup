      - number: '7.4'
        title: Financial-model risk, mitigations, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The largest model risk is that financing credibility has outrun operating proof. Volta's public story is
              powerful because it combines a $300 million equity raise, a $5 billion infrastructure program, and very
              large contract headlines. But project-financed infrastructure businesses fail when utilization, delivery,
              or counterparty assumptions slip at the same time. Volta also faces the classic risk of a young platform
              in a hot market: supplier concentration, margin compression as rivals scale, and possible consolidation
              after a capacity boom. Public adverse framing from The Register and the more cautious operational framing
              from Channel Insider are useful reminders that the first deployment, not the launch narrative, will
              determine the company's resilience. The key mitigants are real but still partly promised: long-duration
              contracts, institutional financing, phased delivery, renewable-power advantages, and full-stack
              accountability. The most important thesis-break triggers are clear: major delivery slippage, loss or
              reduction of the flagship customer, failure of the credit-support stack, or evidence that the company
              cannot diversify beyond one very large anchor account.
            claimRefs:
              - CR029
