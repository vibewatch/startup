      - number: '6.3'
        title: Retention visibility, repeat usage, and contract durability
        blocks:
          - type: paragraph
            body: >-
              There is almost no conventional retention data in public view. Volta does not disclose NRR, GRR, churn,
              cohort behavior, active-customer counts, deployment counts, or satisfaction metrics. What it does reveal
              is contract duration and infrastructure commitment length. Independent reporting says the flagship
              customer relationship runs for six years, while Bitdeer's site-level agreement with a Volta subsidiary
              runs for 16 years with an optional eight-year extension and a no-fee customer termination right after 10
              years. Those time horizons imply customer durability if the project performs, but they do not substitute
              for actual retention evidence. In fact, the dependence on one pre-delivery flagship customer means the
              most useful retention question is binary: does the first deployment reach service on time and remain
              mission-critical to the customer? Until that happens, investors cannot observe whether Volta is building
              sticky customer behavior or merely promising it. Public retention visibility should therefore be rated low
              even though the contractual setup signals an intent toward long-duration relationships.
