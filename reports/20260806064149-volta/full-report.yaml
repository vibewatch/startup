chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, headquarters, and operating model
        blocks:
          - type: paragraph
            body: >-
              Volta is an AI infrastructure company that positions compute as an infrastructure asset class rather than
              as an ordinary cloud resale product. The company’s official site describes a vertically integrated model
              spanning institutional capital, powered land, data centers, compute, software, and operations, while the
              UK Companies House record identifies the legal entity as Volta Infrastructure Holdings Limited,
              incorporated on 9 January 2026 and registered at 66 Lincoln’s Inn Fields in London. Public-facing
              materials consistently anchor the company in London even though it operates with additional offices in
              Palo Alto and New York. That mix matters because Volta is selling not just GPU time, but a financing and
              delivery stack intended to remove the biggest bottleneck in frontier AI infrastructure: access to large,
              credit-supported, dedicated capacity outside the hyperscalers. The official product narrative centers on
              AI factories using NVIDIA Vera Rubin systems, NVIDIA’s DSX design framework, owned provisioning and
              orchestration software, and end-to-end operational accountability. Volta claims over 1 GW of near-term
              power capacity, a 100,000+ GPU deployment pipeline, and 100+ employees at launch. These are company-
              stated scale markers rather than audited operating metrics, but they establish the company’s intended
              identity: a financing-led neocloud and AI factory developer rather than a software startup.
