  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition, module map, and customer jobs
        blocks:
          - type: paragraph
            body: >-
              Volta's core product is a dedicated AI factory delivered as a managed infrastructure outcome, not a simple
              compute instance catalogue. Public materials repeatedly frame the company as a fully vertically integrated
              platform that combines institutional capital, powered land, data centers, compute, software, and
              operations. That implies six product modules. The capital module funds and structures deployment. The
              power module secures energy capacity and contracting. The data-center module covers campus development and
              fit- out. The compute module delivers dedicated NVIDIA-based clusters. The software module handles
              provisioning, orchestration, and automation. The operations module keeps the factory running end to end.
              In customer workflow terms, Volta is solving three linked jobs: secure capacity that would otherwise be
              rationed, avoid self-funding a hyperscale-class AI-factory build, and obtain a single accountable operator
              instead of stitching together financing, real estate, hardware, software, and facility operations across
              multiple vendors. This makes the product especially relevant for frontier labs and AI-native scale-ups
              whose core need is guaranteed capacity, not developer convenience alone.
            claimRefs:
