      - number: '7.3'
        title: Partner, supplier, customer, and people dependency risks
        blocks:
          - type: paragraph
            body: >-
              Volta's model is deeply interdependent. Bitdeer provides the physical campus; Dell is the technology
              provider; NVIDIA underpins the compute architecture; and credit backstops are expected from J.P. Morgan
              affiliates and another major institution. This can be a strength if aligned partners accelerate delivery,
              but it also creates a dense dependency graph where delays or renegotiations can cascade. Customer
              concentration adds another layer. The public story revolves around one flagship AI-lab relationship; if
              that customer delays workload ramp, negotiates harder after delivery, or ultimately reduces commitment,
              Volta's economics could weaken materially. There is also a people risk: the company presents itself as
              founder-led and relies heavily on infrastructure-finance expertise and cross-domain execution. Losing key
              leadership or failing to scale the operating team could impair the model before it reaches repeatability.
              The right risk lens is therefore not just "who are the vendors?" but "how many critical functions are
              currently embodied in a small number of counterparties and people?"
            claimRefs:
