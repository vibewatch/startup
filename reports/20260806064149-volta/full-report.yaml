      - number: '8.3'
        title: Bull, base, and bear cases
        blocks:
          - type: paragraph
            body: >-
              In the bull case, Volta converts the flagship AI-lab contract into on-time service, demonstrates that the
              capital stack really lowers compute economics for customers, and wins at least one or two additional
              anchor customers before competitive supply commoditizes the market. In that world, the current valuation
              may look early rather than expensive because investors will be paying for repeatable asset origination in
              a market where capital, power, and deployment expertise are scarce. In the base case, the first project
              eventually works but public proof accumulates more slowly than the valuation implies; diversification
              lags, and the company needs more time before new investors can underwrite durable revenue quality. In the
              bear case, the first deployment slips, concentration stays extreme, or financing and supplier dependencies
              compress the margin pool so severely that Volta looks more like a risky intermediary than a
              category-defining platform. At the current public valuation, the base and bear cases both argue for strong
              entry discipline.
            claimRefs:
