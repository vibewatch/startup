      - number: '6.4'
        title: Expansion potential, concentration risk, and procurement friction
        blocks:
          - type: paragraph
            body: >-
              Volta's customer profile today is almost certainly highly concentrated. The company publicly highlights
              one flagship AI-lab relationship and otherwise discusses future customer categories rather than a roster
              of live accounts. That concentration can be interpreted in two opposing ways. Bullishly, winning one very
              large and sophisticated anchor customer may validate the business model faster than dozens of small
              accounts would. Bearishly, it means the company has not yet demonstrated diversification, land-and-expand,
              or a repeatable procurement motion across segments. Expansion potential exists: Volta says the same
              dedicated and financed infrastructure model can serve AI-native scale-ups, and independent reporting says
              the company plans future sites in Texas and Wyoming. Procurement friction will nevertheless remain high.
              These are not swipe-card purchases; they require infrastructure diligence, financing alignment, supplier
              coordination, and likely executive approval. The company may therefore scale through a small number of
              large customers rather than a wide base of product-led adopters. That can still work, but it heightens
              top-customer risk and reduces tolerance for delivery delays or governance ambiguity.
