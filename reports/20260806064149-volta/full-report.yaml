      - number: '7.2'
        title: Operational, quality, facility, and security risks
        blocks:
          - type: paragraph
            body: >-
              The flagship Tydal build defines Volta's operational risk stack. Bitdeer's releases show a multi-phase AI
              data-center conversion with explicit commissioning dates, remaining capex, and partner dependencies. That
              means schedule slippage, cooling or power-system underperformance, network integration problems, or
              delayed hardware availability can all directly impair customer outcomes. The product model also
              concentrates risk in one large site instead of many small self-serve customer deployments. PUE,
              renewable-energy profile, and dual-grid connectivity are positives, but they do not remove execution risk.
              A further issue is the public absence of visible SLAs, incident-response disclosures, or historical
              reliability metrics from Volta. In a business promising compute that works like a utility, operational
              excellence is the whole product. Any early outage, delivery miss, or underperformance at Tydal would carry
              outsized signaling damage because the market is still deciding whether Volta is a category-defining
              infrastructure company or just another ambitious neocloud.
            claimRefs:
