callouts:
  - calloutType: insight
    title: Nscale is the closest narrative peer; CoreWeave is the hardest scale benchmark
    body: >-
      Nscale most directly overlaps with Volta's Europe-linked full-stack AI-infrastructure story, but CoreWeave
      is the competitor whose scale, proof, and public-market visibility set the highest execution bar.
    claimRefs:
      - CP004
      - CP010
      - CP017
      - CP030
  - calloutType: risk
    title: Volta must prove it is more than an attractively financed neocloud
    body: >-
      The sector already offers the same NVIDIA generations through multiple providers. Without repeatable public
      evidence of delivery, Volta's full-stack financing narrative can be dismissed as packaging rather than moat.
    claimRefs:
      - CP028
      - CP031
      - CP034
      - CP036
