callouts:
  - calloutType: insight
    title: Volta's TAM is smaller than "all cloud," but structurally more valuable
    body: >-
      The company is targeting the slice of AI infrastructure where power, financing, and dedicated capacity
      matter more than generic cloud elasticity. That narrows the market definition but can increase contract size
      and switching friction.
    claimRefs:
      - CM001
      - CM004
      - CM018
      - CM024
  - calloutType: risk
    title: The market is clearly real; the exact SAM remains fuzzy
    body: >-
      Public evidence strongly supports rapid AI-infrastructure expansion, but the portion of that spend that will
      flow into third-party financed AI factories rather than hyperscaler capex is still uncertain.
    claimRefs:
      - CM009
      - CM013
      - CM029
      - CM036
