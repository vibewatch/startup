  - id: buyer-segments
    title: Buyer, user, and payer segmentation
    body: >-
      Volta's buyer map is structurally different from that of a pure self-serve GPU marketplace. The first and
      most important segment is the frontier AI lab or model developer that needs dedicated large-scale
      training and inference capacity over multiple years; in this segment the buyer is usually an
      infrastructure, finance, or executive team, while the user is an ML systems organization and the payer is
      corporate treasury or a structured-capex program. The second segment is the AI-native scale-up that has
      real model or inference demand but cannot fund an AI factory from its own balance sheet; here Volta's
      financing-led pitch may be most distinctive because it allows a customer to step into dedicated capacity
      earlier than its standalone credit profile would normally permit. The third segment is the enterprise
      buyer that wants sovereign or dedicated capacity for compliance, reliability, or cost reasons but lacks
      appetite for direct campus development. The fourth segment is European policy- and sovereignty-linked
      demand, where governments and industrial champions want local compute availability. In every segment,
      budget ownership matters as much as technical need. Volta is effectively trying to move AI-infrastructure
      buying from an ad hoc IT-procurement workflow toward a project-finance workflow where customer demand,
      delivery milestones, and credit support can unlock infrastructure capital. That is a more complex
      adoption path than swiping a credit card for cloud instances, but it potentially creates larger and more
      durable contracts.
    claimRefs:
      - CM018
      - CM019
      - CM020
      - CM021
      - CM022
      - CM023
      - CM024
      - CM025
