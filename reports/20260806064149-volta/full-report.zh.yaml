      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              Volta 的买方地图与纯自助 GPU 市场结构不同。第一且最重要的客群，是需要多年期、专用大规模训练和推理产能的前沿 AI 实验室或模型开发商；在这一客群中，买方通常是基础设施、财务或高管团队，用户是 ML
              系统组织，付款方则是公司财务或结构化资本开支计划。 第二类是 AI 原生成长期公司，有真实模型或推理需求，却无法用自身资产负债表出资建设 AI 工厂；Volta
              以融资为先的销售主张在这里可能最有差异性，因为它让客户比单独信用状况通常允许的时间更早进入专用产能。 第三类是企业买方，它们出于合规、可靠性或成本原因需要主权或专用产能，但不愿直接开发园区。
              第四类是欧洲政策和主权需求，政府与产业冠军希望本地可用算力。 在每个客群中，预算归属与技术需求同样重要。Volta 实际上想把 AI 基础设施采购从临时 IT
              采购流程，搬到项目融资流程里：客户需求、交付里程碑和信用支持共同撬动基础设施资本。 相比刷信用卡买云实例，这条采用路径更复杂，但也可能形成更大、更耐久的合同。
