  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              Volta 最显眼的法律与监管敞口来自两个领域。第一，欧洲围绕 AI 治理和数据的义务还在变化。Skadden 指出，AI Act 的高风险义务已经延期，但透明度义务仍将在 2026 年 8 月开始；Volta
              把自己定位为服务高要求买家的欧洲 AI 基础设施平台，这些客户可能会要求围绕 AI 系统有清晰披露、治理和合同控制。第二，先进计算出口管制仍是生态层面的实质风险。BIS 2026 年 5
              月的指引明确，涉及总部位于 D:5 国家或澳门的实体时，即便实体设在这些司法辖区之外，先进计算出口仍适用许可证要求。BIS 还在继续收紧围绕先进半导体和晶圆厂的管制与尽调预期。公开叙事并未显示 Volta
              违反这些规则，但它的业务依赖大规模采购和部署最前沿的 NVIDIA
              系统。合同结构里也有法律风险：客户身份部分间接披露，站点交付由合作方主导，服务水平责任如何分摊没有公开讲透。基础设施公司卖的不只是算力，也是信任；披露越薄，本身就是风险。
