  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局与替代集合
        blocks:
          - type: paragraph
            body: >-
              Volta 位于新型云厂商、基础设施开发商和超大规模云替代方案的交汇处。直接同行包括明确营销 GPU 集群、AI 工厂或全栈训练和推理基础设施的专业 AI 云。 CoreWeave 把自己定位为 AI
              的关键云，拥有平台工具、全球 AI 数据中心和大规模公开商业足迹。 Lambda 从自助实例到超集群提供一整套阶梯，并公开 B200 和 H100 产能的透明定价。 Crusoe 营销覆盖构建、训练和服务的完整
              AI 云，并提供托管基础设施。 Nscale 尤其相关，因为它把欧洲和美国数据中心版图与全栈 AI 基础设施配在一起，是最接近 Volta 欧洲优先工厂故事的主题竞争者之一。 Together AI
              把云基础设施与模型和推理服务结合；Voltage Park 则把 AI 工厂话术与预留和按需云产品组合，并在与 Lightning AI 合并后，更偏向一体化应用/开发者平台。 替代集合还包括直接使用
              Google Cloud、AWS、Azure 和 Oracle GPU 基础设施，以及企业自建。 对许多买方来说，问题不只是「哪家 GPU
              云最便宜？」而是「谁能用最少摩擦、最高确定性，锁定、融资、交付并运营稀缺产能？」 这个更宽的框架解释了为什么 Volta 不只想与 GPU 出租方比较，也想与基础设施开发商和融资驱动的运营方比较。
