      - number: '3.3'
        title: 切换成本、多云部署、分销力与供给获取
        blocks:
          - type: paragraph
            body: >-
              AI 基础设施买方可以、也确实会多处部署，但并非所有产能都同样可替代。 大规模训练的模型实验室关心集群拓扑、互连性能、硬件代际、部署确定性和商业条款；一旦专用设施或多年期预留启动，切换成本会显著上升。
              这有利于那些已经证明交付能力、且能强势获取 GPU、网络、电力和数据中心运营资源的供应商。
              CoreWeave、超大规模云厂商和成熟专业云有分销优势，因为客户能在熟悉的界面里发现产品、测试工作负载并扩容。Lambda 和 Crusoe 也受益于更清晰的自助或托管产品路径。 相比之下，Volta
              似乎优化的是大型谈判型交易：买方尽调、融资和站点执行都发生在广泛产品驱动采用之前。 这可能带来更大的合同，但也提高了对高管销售和合作伙伴可信度的依赖。 供给获取是另一处战场。Volta 的旗舰故事依赖
              NVIDIA 系统、Bitdeer 园区执行、Dell 作为技术提供方，以及主要金融机构安排的信用支持。 这让它的竞争位置比纯软件平台更相互依赖。若这些伙伴链条稳住，Volta
              可以用年轻公司身份打出超额影响力；若链条摇晃，更成熟的云厂商和超大规模云厂商可以拿走同一批客户需求。
