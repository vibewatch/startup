chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、总部与运营模式
        blocks:
          - type: paragraph
            body: >-
              Volta 是一家 AI 基础设施公司，它把算力定位为基础设施资产类别，而不是普通云转售产品。 公司官网描述的是一套垂直整合模型，横跨机构资本、通电土地、数据中心、算力、软件和运营；UK Companies
              House 记录则显示，其法律实体为 Volta Infrastructure Holdings Limited，于 2026 年 1 月 9 日注册成立，注册地址为伦敦 66 Lincoln’s Inn
              Fields。 尽管 Volta 还在 Palo Alto 和 New York 设有办公室，对外材料始终把公司锚在伦敦。这个组合很关键：Volta 卖的不只是 GPU 时间，而是一套融资和交付栈，目标是拆掉前沿
              AI 基础设施最大的瓶颈——在超大规模云厂商之外获得大规模、有信用支持、专用的产能。 官方产品叙事围绕几件事展开：采用 NVIDIA Vera Rubin 系统的 AI 工厂、NVIDIA 的 DSX
              设计框架、自有供给和编排软件，以及端到端运营责任。 Volta 声称短期电力容量超过 1 GW，部署管线超过 100,000 块 GPU，发布时员工超过 100 人。
              这些是公司自述的规模标记，不是审计后的运营指标，但它们勾勒了公司的目标身份：由融资驱动的新型云厂商和 AI 工厂开发商，而不是软件创业公司。
