  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义、模块地图与客户任务
        blocks:
          - type: paragraph
            body: >-
              Volta 的核心产品是作为托管基础设施结果交付的专用 AI 工厂，不是简单的算力实例目录。 公开材料反复把公司定义为一个全垂直整合平台，组合机构资本、通电土地、数据中心、算力、软件和运营。
              这意味着六个产品模块。资本模块负责出资和设计部署结构；电力模块锁定能源容量和合同；数据中心模块覆盖园区开发和装修；算力模块交付专用的基于 NVIDIA
              的集群；软件模块处理供给、编排和自动化；运营模块让工厂端到端运转。 放在客户工作流里，Volta 解决的是三件相互关联的任务：锁定原本会被配额限制的产能，避免自筹资金建设超大规模 AI
              工厂，并获得一个单一负责的运营方，而不是在多个供应商之间拼接融资、地产、硬件、软件和设施运营。 这使产品特别适合前沿实验室和 AI 原生成长期公司；它们的核心需求是有保障的产能，而不只是开发者便利。
