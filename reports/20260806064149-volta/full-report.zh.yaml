      - number: '1.4'
        title: 里程碑、规模信号与反向因素
        blocks:
          - type: paragraph
            body: >-
              Volta 从注册成立到公开发布不到七个月，这本身就是本章最核心的反向因素。公司尚未以自身名义证明多年运营可靠性、收入确认或设施交付能力。 不过，早期里程碑仍有分量：2026 年 1 月注册成立；4 月至 7
              月密集提交治理和股本备案；Bitdeer 2026 年 3 月宣布 Tydal 改造计划，把挪威园区确立为 Vera Rubin 就绪的 AI 站点；Bitdeer 2026 年 6
              月披露一份尚未签署但有条件的租约；2026 年 8 月 4 日，Volta 发布并披露 $10B 战略 AI 实验室合作、挪威总签约容量超过 130 MW、短期管线超过 1 GW，以及超过 100,000 块
              GPU 的管线。 TechCrunch、Reuters 和若干二级媒体基于 Bloomberg 来源报道，把 AI 实验室交易对手指向 Anthropic；但截至发布时，Anthropic
              尚未公开确认客户关系，Volta 自己的网站也未披露客户名称。 The Register
              的怀疑性表述点出了关键尽调风险：一家成立数月的公司，在第一个站点上线前，就要求投资人相信其能够完成吉瓦级交付和数十亿美元隐含合同收入。 Volta
              目前的证据在交易对手、领导层和融资架构上最强，在经审计运营证明、收入和下游客户多元化上明显更弱。
