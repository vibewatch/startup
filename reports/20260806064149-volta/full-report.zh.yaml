  - id: TM004
    title: 增长驱动因素与约束表
    columns:
      - 因素
      - 类型
      - 证据
      - 重要性
      - 对 Volta 的净影响
    rows:
      - - 数据中心用电需求上升
        - 驱动因素
        - IEA 预计数据中心用电需求到 2030 年大约翻倍
        - 指向 AI 物理基础设施会持续增长
        - 如果 Volta 能拿到电力和站点，就是正面
      - - 加速服务器采用
        - 驱动因素
        - IEA 称加速服务器带动了近一半需求增量
        - 有利于高密度 AI 工厂模式
        - 利好专用 GPU 园区
      - - 欧盟 AI 超级工厂推进
        - 驱动因素
        - 欧盟委员会和 EuroHPC 明确提到欧洲算力缺口
        - 为本地容量创造政策支持
        - 对欧洲定位形成叙事顺风
      - - 电力和电网交付周期
        - 约束
        - IEA 强调能源系统交付周期长
        - 即便有客户需求，也可能拖慢园区交付
        - 如果 Volta 过度承诺时间表，就是负面
      - - 资本密集度
        - 约束
        - Volta 自己的推介依赖基础设施融资和 LOC 信用支持
        - 大项目需要复杂资本栈
        - 混合：执行到位就是差异化；做不到就是瓶颈
      - - 竞争供给扩张
        - 约束
        - CoreWeave、Crusoe、Lambda、Nscale、Together AI 和超大规模云厂商都在销售 AI 容量
        - 可能压缩利润率，并降低访问独占性
        - 长期偏负面，除非 Volta 在融资和交付上拉开差异
      - - 客户集中风险
        - 约束
        - 启动故事围绕一个旗舰 AI 实验室合同
        - 单一锚定客户会扭曲经济性和议价能力
        - 除非 Volta 快速分散需求，否则为负面
      - - 硬件生态依赖
        - 约束
        - Volta 的旗舰叙事假设 NVIDIA 系统和伙伴访问能到位
        - 供应商分配可以决定商业可行性
        - 如果分配收紧或条款变差，就是负面
    notes: 说明 Volta 的市场为什么诱人，也说明它在结构上比软件或通用云转售更难。
