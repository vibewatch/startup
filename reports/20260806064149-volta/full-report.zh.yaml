            body: >-
              公开视野中几乎没有传统留存数据。Volta 不披露 NRR、GRR、流失率、队列行为、活跃客户数、部署数或满意度指标。 它披露的是合同期限和基础设施承诺时长。独立报道称，旗舰客户关系为期六年；Bitdeer 与
              Volta 子公司的站点级协议为期 16 年，可选择延长八年，并且客户在 10 年后拥有免费终止权。 如果项目表现良好，这些期限意味着客户耐久性，但它们不能替代真实留存证据。
              事实上，对一个依赖交付前单一旗舰客户的公司来说，最有用的留存问题是二元的：首个部署能否按时投入服务，并持续成为客户的任务关键基础设施？ 在那之前，投资人无法观察 Volta
              是在构建黏性客户行为，还是仅仅许诺这种行为。 因此，尽管合同设置显示了走向长周期关系的意图，公开留存可见度仍应评为低。
