      - number: '2.4'
        title: 增长驱动、采用约束与相互矛盾的估计
        blocks:
          - type: paragraph
            body: >-
              Volta 所处市场最强的增长驱动很直接：AI 工作负载需要更高功率密度的基础设施；加速服务器需求增速远高于传统服务器；欧洲也在主动弥合前沿算力缺口。 Volta
              发布时称只有超大规模云厂商和投资级买方才能锁定专用产能，这一表述反映了真实市场条件：电力并网、芯片分配和项目融资都是闸门。 另一面是，这个市场资本开支很重，运营容错率很低。IEA
              强调更广泛能源系统的长交付周期；EuroHPC 和 European Commission 都暗示欧洲仍缺少足够的大规模算力。 竞争供给也在扩张：CoreWeave 今天以远大于 Volta 的收入规模提供公开
              AI 原生云产能；Crusoe、Nscale、Together AI 和 Voltage Park 都在营销 AI 工厂或集群产品；超大规模云厂商还凭软件生态和既有企业关系保留打包力量。 矛盾仍在。Volta
              官网引用了到 2030 年 $15T 的 AI 基础设施资本开支机会，但公开独立证据更能确认方向，不能确认这个具体数字。 同样，欧洲主权算力的政策支持是真实的，但这并不保证一家私营、客户集中的 AI
              工厂会自动服务广泛欧洲需求。 市场显然够大且在增长；仍不确定的是，扩张中的资本开支池有多少会变成可融资的第三方专用产能，而不是超大规模云厂商资产负债表上的支出。
