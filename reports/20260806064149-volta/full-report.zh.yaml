        - 首个项目是核心验证点
        - 索取 PMO 看板和验收标准
      - - 客户集中度
        - 第一大客户占比和第二个锚定客户管线
        - 当前估值高度暴露于单一客户关系
        - 索取收入集中度和销售管线细节
      - - 融资优势
        - 债务条款、LOC 经济性和客户定价优势
        - 需要证明资金结构的差异化确实成立
        - 索取债务 / 信用文件和 TCO 对比
      - - 治理 / 合规
        - 安全材料、出口管制流程和合同责任分配
        - 隐性风险可能抹掉估值上行
        - 审查信任材料和法律备忘录
      - - 可复制性
        - 第二个站点的承做测算和部署手册
        - 需要超越单个定制交易的信心
        - 索取下一站点管线和标准运营模板
    notes: 这些是认可当前估值前所需的最低尽调升级。
