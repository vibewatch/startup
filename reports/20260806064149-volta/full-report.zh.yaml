        blocks:
          - type: paragraph
            body: >-
              按通常的创业财务口径看，公开牵引力证据很薄。Volta 不公开披露收入、ARR、旗舰合同之外的订单额、毛利率、按职能划分的员工数、账上现金、月度烧钱额或现金跑道。 它披露的是资本结构：多家媒体称种子轮和 A
              轮股权融资约 $300M；官方材料显示 Azora 支持一项 $5B AI 基础设施计划；Bitdeer 侧预计 Tydal 旗舰安排需要约 $1.3B 信用证。 这些数字意味着，应分层理解 Volta
              的资本充足性：公司股权用于团队和平台搭建，项目资本用于园区和硬件，信用支持帮助交易对手评估履约能力。 销售效率同样非标准。销售周期很可能漫长、需要深度维护，并集中在少数巨型买方身上，因此传统 SaaS CAC
              回本框架不是合适标杆。 更相关的问题是，Volta 能否比既有玩家更快、以更少稀释，把已签客户需求反复转化为可融资、可交付的项目。
