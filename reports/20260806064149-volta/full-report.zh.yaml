      - number: '7.4'
        title: 财务模型风险、缓释因素与投资逻辑失效触发点
        blocks:
          - type: paragraph
            body: >-
              最大的模型风险，是融资可信度跑在运营验证前面。Volta 的公开故事很有张力：$300 million 股权融资、$5 billion
              基础设施计划，以及极大的合同金额口径放在一起。但项目融资型基础设施公司会在利用率、交付或交易对手假设同时滑坡时出事。Volta
              还面临热门市场里年轻平台的经典风险：供应商集中，竞争者扩张后毛利被挤压，以及产能繁荣之后可能出现整合。The Register 的公开负面框架、Channel Insider
              更谨慎的运营框架都在提醒：决定公司韧性的不是发布叙事，而是首次部署。关键缓释因素真实存在，但仍有一部分停留在承诺里：长周期合同、机构融资、分阶段交付、可再生电力优势、全栈问责。最重要的投资逻辑失效触发点很清楚：重大交付延误、旗舰客户流失或缩减、信用支持栈失效，或出现证据显示公司无法摆脱一个超大锚定客户。
