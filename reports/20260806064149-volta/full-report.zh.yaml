      - number: '5.2'
        title: 架构与运营模式
        blocks:
          - type: paragraph
            body: >-
              以一家如此年轻的公司而言，Volta 的公开架构叙事异常具体。公司称其吉瓦级园区采用 NVIDIA 的 DSX 平台建设，面向极高 GPU 密度和直接液冷设计。 算力被描述为运行在 InfiniBand 或
              RoCE 网络上的 NVIDIA Vera Rubin 系统，并通过自研自动化和编排软件供给，而不是授权第三方控制平面。 软件主张很重要，因为 Volta
              认为，拥有供给层才能实现全自动算力交付，并避免供应商交接。 物理模型得到 Bitdeer 的部分佐证：Tydal 园区按照 NVIDIA 参考设计面向 AI 托管设计，租约下有 121 IT MW / 133
              gross MW，PUE 约 1.1，高容量光纤、双电网连接和本地可再生水电。 这一架构与 Volta 要解决的问题相匹配：大规模专用训练和推理产能，需要设施设计、网络和运营软件全部对齐。
              缺失的是技术买方通常会想看的内部系统细节：调度器设计、租户模型、可观测性界面、故障域处理、API 结构和实际交付性能基准。
