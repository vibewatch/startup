      - number: '2.2'
        title: 规模测算镜头：能源、主权算力需求与 AI 工厂资本形成
        blocks:
          - type: paragraph
            body: >-
              要可信地测算 Volta 的市场规模，需要多重镜头，因为没有任何一条公开数据序列能直接捕捉「AI 工厂融资」。 能源镜头是最干净的宏观锚。IEA 估计，2024 年数据中心用电量约 415
              TWh，并预测基准情形下到 2030 年将翻倍至约 945 TWh；加速服务器约每年增长 30%，贡献净增量近半。 这不会一比一转化为 Volta 收入，但它确认 AI
              的物理层扩张足够快，能给专用基础设施专家留出空间。 政策镜头在欧洲强化了同一点：European Commission 称欧洲在大规模 AI 计算基础设施上面临关键缺口，并正为 AI 超级工厂动员
              €20B；EuroHPC 则把这些设施描述为面向超大 AI 模型的全生命周期基础设施，包含 AI 优化算力、存储、网络和安全访问。 可比公司镜头更商业化。CoreWeave 的公开估值和收入基础，加上
              Lambda、Crusoe、Together AI、Nscale 和 Voltage Park 的官方产品广度，说明市场已经大到足以支撑多家专业 AI 云，客户需求也从创业公司延伸到前沿实验室。 Volta
              的直接 SAM 更窄：它服务的是需要比配额制公有云更可预测的经济性和可用性的客户，但这些客户可能仍然更偏好融资、表外模式，而不是直接拥有数据中心。
