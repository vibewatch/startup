  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              Volta 的乐观逻辑有吸引力，也自洽。AI 算力正在成为战略基础设施瓶颈；欧洲想要更多本地容量；前沿实验室需要专属算力；Volta
              试图解决融资问题，而这个问题正阻止非超大规模云厂商以有吸引力的条款拿到基础设施。如果公司第一个旗舰部署跑通，它可能在资本市场、基础设施业主和算力饥渴的 AI
              买家之间占据优先位置。反向逻辑同样强。公开证据更能支撑雄心，而不是证明。公司极年轻，客户基础公开看并未多元化，首个项目带着多重相互绑定的依赖，报道估值已经计入超过种子期可选性的预期。因此，投资人承销的不是一家标准创业公司；实质上是在公开收入质量可见之前，承销一种新的基础设施中介模型。
