  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Volta 的可服务市场既不是整个公有云市场，也不是整个 AI 软件市场。公司位于更窄但战略重要的 AI 基础设施层：专用 GPU 集群、AI 工厂，以及帮助客户锁定多年产能的配套融资结构。
              因此，纳入支出覆盖通电土地、数据中心装修、GPU 系统、网络、存储、编排、托管服务，以及这些组件被打包进专用 AI 产能方案时的项目级信用支持。 排除支出包括通用 CPU 云、应用层 AI API、终端用户 AI
              助手和普通企业 SaaS。 Volta 官方叙事明确区分这一点：核心市场失灵不是算力转售本身，而是融资。 实际替代方案包括：通过 AWS、Azure、Google Cloud 或 Oracle 购买超大规模云厂商
              GPU 产能；选择 CoreWeave、Crusoe、Lambda、Nscale、Together AI、Voltage Park 等替代新型云厂商；资金充足的模型公司直接自购 AI
              硬件并在本地部署；以及在标准云配额体系下延迟或限量使用产能。 Volta 真正在卖的是专用算力访问与资本形成的组合，让买方不必先把自己变成数据中心开发商，也能锁定 AI 基础设施。
