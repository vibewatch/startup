              公开客户证明几乎被一段关系主导。Volta 官网称，一家 AI 实验室选择 Volta 建设其 AI 工厂，并描述了一项 $10B 战略合作，绑定挪威 130MW+ 总电力和 NVIDIA Vera Rubin
              系统。 Bitdeer 的租约材料补充了具体底座：121 IT MW、133 gross MW、两个投产阶段，以及面向一家领先 AI 实验室的专用园区安排。 Reuters、TechCrunch、Silicon
