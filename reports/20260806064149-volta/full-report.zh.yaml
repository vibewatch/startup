      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >-
              Volta 由 Ricard Boada 和 Sofia Gumuzio 共同创立，Boada 任首席执行官，Gumuzio 任首席企业发展官。
              公司官方页面把两位创始人描绘成来自大盘基础设施资产管理的投资人和运营者，而不是纯软件背景；第三方报道也把二人与 Brookfield 的基础设施业务联系起来。 这个背景正是投资论点的核心：Volta
              想把项目融资纪律引入 AI 基础设施部署。对一家只有数月历史的公司而言，发布时的领导班子资历异常深。 Patrick McGregor 曾在 Crusoe 和 Google AI/Google Cloud
              负责产品，后加入担任首席产品官；Raimund Riedl 来自 Citi 全球数据中心投资银行业务，担任 CFO；Paul Henry 曾领导 Google 的 EMEA 数据中心交付；CTO Tristan
              Helmich 此前搭建过 Genesis Cloud 的生产级 AI 云栈。 Volta 还从 J.P. Morgan、Deloitte、Google、Amazon、VIRTUS Data Centres 和
              CoreWeave 招来资本市场、税务、会计、数据中心交付和运营高管。 治理披露仍然很薄，但备案历史显示公司成立后迅速搭架子：Ricard Boada 最初持有 75% 以上控制权，2026 年 4
              月不再作为可登记 PSC；2026 年 6 月下旬和 7 月的董事任命加入了 Sofia Gumuzio、Jamin Ball、Shangda Xu、Rangarajan Raghuram 和 Francisco
              Javier Rodríguez Heredia。 这些任命意味着公司在融资前后立即开始正规化投资人和战略治理，但董事会委员会结构、投票权和股东保护仍未披露。
