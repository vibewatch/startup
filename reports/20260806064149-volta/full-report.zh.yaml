      - number: '8.2'
        title: 当前估值语境与可比公司
        blocks:
          - type: paragraph
            body: >-
              最好的公开估值锚不是软件公司，而是可比基础设施企业。CoreWeave 提供最清晰的高增长上市基准：StockAnalysis 显示其市值约 $49.0 billion，过去 12 个月收入约 $6.23
              billion，当前 P/S 约 7.9x；统计页则显示 EV/Sales 超过 13x，债务强度很高。Bitdeer 提供一个质量更低、资产更重的粗略参照：据 StockAnalysis，当前 P/S 约
              3.6x，EV/Sales 约 6.0x，自由现金流深度为负。这些可比对象都不完美。CoreWeave 成熟度和验证程度高得多；Bitdeer 是挖矿 / AI 基础设施混合运营商，不是干净的 Volta
              类比。Volta 自身不披露收入，因此公开信息无法计算前瞻或历史倍数。估值只能回到里程碑承销：客户有效性、交付成功、多元化、融资成本和利润捕获。关键问题不是“Volta
              今天应该按什么倍数交易？”，而是“要先出现哪些证明，$2.4 billion 的价格才算有纪律，而不是投机？”
