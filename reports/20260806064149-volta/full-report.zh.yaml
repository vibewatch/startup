      - number: '8.3'
        title: 乐观、基准与悲观情景
        blocks:
          - type: paragraph
            body: >-
              乐观情景下，Volta 将旗舰 AI
              实验室合同转成按时交付的服务，证明资本栈确实能把客户算力成本打下来，并在竞争性供给把市场商品化之前，至少再拿下一两个锚定客户。到了那个世界，当前估值可能显得早，而不是贵，因为投资人买的是可复制的资产发起能力，而市场里资本、电力和部署专长都稀缺。基准情景下，第一个项目最终跑通，但公开证明积累速度慢于估值隐含的节奏；多元化滞后，公司需要更长时间，新的投资人才敢承销持久收入质量。悲观情景下，首次部署滑坡，集中度仍极端，或融资和供应商依赖把利润池压得太薄，Volta
              看起来更像一个高风险中介，而不是定义品类的平台。在当前公开估值下，基准和悲观情景都要求很强的入场纪律。
