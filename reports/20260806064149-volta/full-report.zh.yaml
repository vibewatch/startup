      - number: '3.2'
        title: 竞争者画像、能力宽度与定价姿态
        blocks:
          - type: paragraph
            body: >-
              从公开证据看，竞争集合分成三大阵营。第一类是 CoreWeave 这样的规模领导者，已经营销平台深度、基准测试证明、专用存储、托管 Kubernetes 和企业信任特性，同时受益于公开市场可见度。 第二类是
              Lambda 和 Crusoe 等专业 AI 云，产品打包更清楚，买方从按需使用走向集群和专用部署的路径也更明晰。 Lambda 的定价透明度最突出：它公布明确的 B200 单 GPU
              价格和集群规模，降低购买摩擦，也给客户一个 Volta 目前尚未公开匹配的参照点。 Crusoe 强调跨完整 AI 栈的托管训练、微调和推理，比纯基础设施资本故事更接近托管平台主张。 第三类是 Nscale
              这样的欧洲或混合运营商，以及 Voltage Park 这样的 AI 工厂品牌；它们证明，专用产能叙事已经不再独一无二。 Volta
              官网声称自己的栈比大多数同行更完整——从资本、电力、园区、算力、软件到运营——但其中很大部分仍是公司自述，还没有独立验证。 按能力看，Volta
              在融资、专用产能和电力采购最关键的场景里似乎最强；在买方需要自助工具、完整文档、公开性能基准，或一长串具名生产客户时则显得更弱。
