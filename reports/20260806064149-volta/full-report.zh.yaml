companyProfile:
  summary: >-
    Volta 是一家总部位于伦敦的 AI 基础设施公司，由 Ricard Boada 和 Sofia Gumuzio 于 2026 年 1 月创立。 公司于 2026 年 8 月 4
    日走出隐身期，将自己定位为「算力公用事业」：一套从资本、通电土地、数据中心、算力、软件到运营全链条垂直整合的平台。 Volta 公开的旗舰项目是位于挪威 Tydal 的 AI 工厂，与 Bitdeer 和 Dell 合作、基于
    NVIDIA Vera Rubin 系统建设；Bitdeer 披露该站点具备 121 IT MW / 133 gross MW，基本租期经济规模约 $4.7B，预计还需要约 $1.3B 的信用证支持。 公开报道显示，在
    Azora、Andreessen Horowitz、Altimeter、NVIDIA 和 Michael Dell 家族办公室支持的 $300M 种子轮加 A 轮融资后，Volta 估值约 $2.4B。
    这门生意在战略上有吸引力，因为它试图解决 AI 基础设施融资难题；但收入、利润率、客户广度和运营表现大多仍未披露，因此仍很难定价。
