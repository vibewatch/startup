        - 可复制的资产发起价值显现后，当前估值可能被证明投得早
        - 执行仍与交易对手绑定
        - 需要多个里程碑转绿
      - - 基准
        - 首个项目跑通，但证据积累慢于当前价格暗含的节奏
        - 运营指标出现前，估值仍难自圆其说
        - 集中度和不透明仍在
        - 按当前公开证据，这是最可能情景
      - - 悲观
        - 交付延误，集中度不降，融资栈或供应商经济性不及预期
        - 当前估值相对证据大幅压缩
        - 公开证据从可选性转为脆弱性
        - 旗舰项目失手时风险显著
