      - 阈值
      - 冲击路径
      - 行动含义
    rows:
      - - 旗舰项目交付滑坡
        - 明显错过已公布的 2026-12-31 / 2027-03-31 目标
        - 打破早期验证叙事
        - 加大折价或退出
      - - 锚定客户走弱
        - 延迟、缩小规模或未定价重新谈判
        - 削弱收入集中度假设
        - 重切估值和集中度假设
      - - 利润率不及预期
        - 证据显示基础设施利差很薄或为负
        - 打破融资优势主张
        - 拒绝溢价估值
      - - 未能多元化
        - 没有可信的第二个锚定客户路径
        - 单客户集中变成结构性问题
        - 维持观察模式
      - - 信任 / 合规薄弱
        - 尽调中暴露安全、治理或出口管制缺口
        - 抬高估值之外的隐性下行风险
        - 考虑投资前要求整改
    notes: 这些触发项把定性的反向逻辑转成可监控的尽调测试。
