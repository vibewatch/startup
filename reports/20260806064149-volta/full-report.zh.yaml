      - number: '4.4'
        title: 财务结论、收入质量担忧与尽调阻塞点
        blocks:
          - type: paragraph
            body: >-
              Volta 的财务故事很有吸引力，但证据披露不足。乐观地看，公司正在尝试中介一个新资产类别：通过超大、多年期承诺出售融资型 AI 算力。 如果旗舰合同具备第三方报道的经济规模，且 Azora
              主导的基础设施计划能够扩张，Volta 可能获得类似基础设施的收入可见度，并拥有潜在可观的价差经济。
              悲观地看，几乎所有决定性证明点都没有进入公开视野：今天确认了多少收入，合同价值中多少是转手通过，电力、债务和伙伴成本之后留下多少利润率，违约或延期保护是什么，公司层面在没有项目融资时还剩多少现金跑道。
              因此，公开证据支持的结论是：收入质量有前景，但尚未证明。公司比透明财务报告更快获得了融资可信度；对一家隐身期基础设施创业公司来说可以理解，但在 $2.4B 估值下仍是重大尽调阻塞点。
