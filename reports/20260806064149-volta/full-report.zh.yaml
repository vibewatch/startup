      - number: '7.3'
        title: 合作伙伴、供应商、客户与人员依赖风险
        blocks:
          - type: paragraph
            body: >-
              Volta 的模型高度互相嵌套。Bitdeer 提供物理园区；Dell 是技术提供方；NVIDIA 支撑算力架构；信用背书预计来自 J.P. Morgan
              关联方和另一家大型机构。合作方对齐时，这可以成为优势，加速交付；但它也织出一张密集依赖图，任何延迟或重新谈判都可能传导。客户集中度又叠了一层风险。公开叙事围绕一个旗舰 AI
              实验室关系展开；如果该客户推迟工作负载爬坡、交付后压价更狠，或最终降低承诺，Volta
              的经济性可能会明显变弱。还有人员风险：公司以创始人主导呈现，高度依赖基础设施金融专长和跨领域执行。失去关键领导层，或运营团队扩张失败，都可能在模型跑出可复制性之前伤到它。因此，正确的风险问题不只是“供应商是谁？”，而是“眼下有多少关键职能集中在少数交易对手和少数人身上？”
