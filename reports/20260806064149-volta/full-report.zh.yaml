  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 按买方、用户、付款方和用例划分客户
        blocks:
          - type: paragraph
            body: >-
              Volta 的公开材料勾勒出三个主要客户群。第一且最重要的是需要专用大规模算力的前沿 AI 实验室。 第二是 AI 原生成长期公司，它们想要专用基础设施，但不想自筹资金完成超大规模部署。
              第三是企业客户，它们可能出于公有云配额之外的考虑，更看重专用或区域产能。
              每一种场景里，买方未必是日常终端用户。买方可能是基础设施、财务或高管团队；用户是模型训练、推理或平台工程团队；付款方则是财务部门或项目级融资载体。 地理位置同样重要：Volta 的旗舰证明位于挪威，公司又以欧洲
              AI 基础设施供应商自居，并在伦敦、Palo Alto 和 New York 设办公室。 公开证据尚未提供按客群划分的客户数量，但目标逻辑很清楚：Volta 追逐的是算力需求和融资复杂度都很高的客户。
