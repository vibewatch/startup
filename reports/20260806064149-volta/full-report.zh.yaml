      - number: '4.2'
        title: 成本结构、毛利驱动、营运资本画像与资本开支负担
        blocks:
          - type: paragraph
            body: >-
              公开成本结构由资本密集度主导。Volta 声称从资本到运营控制全栈，但 Tydal 披露显示，要让这一主张落地，需要多大规模的固定基础设施。 Bitdeer 材料描述了一项 16 年安排：121 IT MW 由
              133 gross MW 支撑，剩余站点资本开支约 $500M，拟议信用兜底约 $1.3B。 这些数字说明，即使 Volta 避免直接拥有每一项资产，它仍身处一个交付前承诺极大的世界。
              毛利率潜力至少取决于五个变量：已锁定电力经济性、债务定价、基于 NVIDIA 系统的供应商条款、Volta 合同客户定价与基础设施义务之间的价差，以及投产后的站点利用率。
              营运资本可能不再主要取决于库存周转，而是取决于里程碑时点、信用证，以及终端客户承诺多快转化为现金回款。 关键分析难点在于，公开信息更清楚地揭示了义务规模，而不是留存利润率规模。这让 Volta
              更像一家项目融资和基础设施编排公司，而不是传统毛利率驱动的软件公司。
