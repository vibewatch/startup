        title: 建议、置信度、估值立场与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              仅看公开证据，有纪律的建议是推迟按当前价格承销 Volta，直到首次部署以及更广的客户 /
              财务证明集改善。这不是在判断模型不好；而是在判断当前信息集相对投资人已被要求接受的估值太薄。该建议的置信度为中等，因为市场逻辑确实强，旗舰合作也可能带来转折。但风险高，估值立场应视为相对已披露证明偏高。更建设性的投资姿态至少需要四项升级：Tydal
              调试得到验证，收入质量和利润率数据更清晰，客户集中度下降，以及有证据证明融资驱动模型能在一个旗舰账户之外复制。还需要更清晰的治理、信任和合同责任分摊证明，才能给下行情景划边界，而不是只靠想象。
