callouts:
  - calloutType: insight
    title: The financing stack is more visible than the income statement
    body: >-
      Public evidence clearly shows equity, project-capital ambition, and credit support expectations, but it does
      not yet show Volta's recognized revenue, retained margin, or runway.
    claimRefs:
      - CI018
      - CI019
      - CI020
      - CI023
  - calloutType: risk
    title: Contract headlines can mask thin public evidence on revenue quality
    body: >-
      Large announced contract values and financing facilities do not answer the key diligence questions: how
      revenue is recognized, what margin is retained, and what downside protections exist if delivery slips.
    claimRefs:
      - CI004
      - CI010
      - CI028
      - CI036
