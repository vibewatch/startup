    title: Volta's true product is the integrated stack, not any one cluster SKU
    body: >-
      The technology story only makes sense when capital, power, campus design, networking, software, and
      operations are treated as one product. That is Volta's distinctive framing relative to most GPU-cloud peers.
    claimRefs:
