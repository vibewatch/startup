  - id: FR001
    title: Evidence-based risk triage
    type: matrix
    summary: >-
      Qualitative likelihood signals and potential impact are separated from the maturity of evidenced mitigations;
      unknown status is not a zero.
    data:
      columns:
        - Likelihood signal
        - Potential impact
      rows:
        - label: Privacy and identity-data handling
          values:
            - Ongoing legal obligation; company control status unknown
            - High if controls fail
        - label: Content governance and authenticity
          values:
            - Reported regulator scrutiny and continued moderation activity
            - High
        - label: Listing approval and market access
          values:
            - Approval reported as pending in Reuters coverage
            - High for listing timing and optionality
        - label: Advertiser conversion measurement
          values:
            - Historical merchant measurement complaints reported
            - Medium-high if confidence or renewals weaken
        - label: Overseas creator monetization
          values:
            - Identity and payout friction reported in 2025
            - Medium-high for international execution
        - label: Financial downside visibility
          values:
            - Current cash-flow and downside data not evidenced in the pool
            - Unknown; no precise assessment possible
    approximationNotes: Qualitative evidence triage only; no numerical likelihood, severity score, or probability is implied.
