            body: >-
              Reuters reported more than 400 million monthly active users since 2025, and Fashion China Agency
              separately describes 400 million monthly active users in May 2026. The latter also reports approximately
              RMB 42 billion of 2025 revenue and roughly 40% year-over-year growth; another marketing-agency article
              repeats the revenue figure. These are reported estimates relayed by secondary sources, not audited
              statements in this evidence pool. JadeMond reports approximately $3.7 billion of 2023 revenue and $500
              million of net profit, again without primary financial statements here. The assigned sources do not
              establish current headcount, cash flow, audited revenue recognition, segment economics or a
              prospectus-grade reconciliation of revenue and profit. A diligence decision should keep these values
