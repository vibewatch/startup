chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, origins and operating model
        blocks:
          - type: paragraph
            body: >-
              Xiaohongshu, also called RedNote or Little Red Book, combines user-created lifestyle content with product
              discovery and shopping. Notes using text, images and video give users a way to research products and
              recommendations, while the platform also supports e-commerce. Independent descriptions and Reuters place
              the company in Shanghai and trace its founding to 2013; JadeMond and Baidu Baike identify Miranda Qu and
              Charlwin Mao as co-founders. These facts establish origin and product positioning, not the current
              corporate group structure or the precise boundary between platform, marketplace and merchant transactions.
              Current board membership, executive roles and founder operating responsibilities are not established by
              this assigned evidence.
            claimRefs:
              - CO001
              - CO002
              - CO003
      - number: '1.2'
        title: Private-company funding, valuation and stakeholders
        blocks:
          - type: paragraph
            body: >-
              The available financing record is incomplete. Tracxn reports $900 million raised across eight rounds and
              lists an undisclosed Series F round dated July 11, 2024; that database total is not a filing-grade cap
              table and should not be treated as cash available. Reuters reported private secondary trades valuing the
              company at as much as $50 billion toward the end of 2025, while JadeMond reports a $31 billion mark as of
              September 2025. Those dated, differently described private-market figures are not a directly comparable
              current valuation. JadeMond and Baidu Baike list Tencent, Alibaba, GSR Ventures, GGV Capital and Hillhouse
              among investors, but the assigned material does not establish their present ownership percentages,
              governance rights, preference stack, debt or secondary-holder overhang.
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO009
          - type: table
            tableRef: TO003
            claimRefs:
              - CO009
