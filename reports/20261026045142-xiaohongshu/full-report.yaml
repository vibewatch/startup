        - Transaction documents, share class, preferences, transfer restrictions and current bids.
      - - Regulatory and liquidity risks can impair an exit
        - >-
          The proposed IPO still required approval in Reuters' June 2026 account; private shares lack public-market
          liquidity, and a third-party overview describes persistent fake-marketing issues.
        - Required approvals, a credible timetable and enforceable secondary-transfer rights.
    notes: >-
      Qualitative thesis and countercase; Bilibili and Pinterest are competitor disclosures, not independent valuation
      benchmarks, and the reported financial figures are not audited results in the assigned evidence.
    claimRefs:
      - CV006
      - CV008
      - CV009
      - CV010
      - CV012
      - CV013
      - CV014
      - CV016
      - CV015
  - id: TV003
    title: Bull, base and bear underwriting cases
    columns:
      - Case
      - Explicit assumptions and valuation logic
      - Probability signal
      - Downside trigger or proof point
    rows:
      - - Bear
        - >-
          If approval stalls, monetization weakens or share restrictions block exit, test outcomes below the reported
          $17 billion 2024 mark; no numerical floor is supportable.
        - Unquantified; no audited downside data or current transaction terms.
        - Failed approval, deteriorating audited economics or restrictive transfer and preference terms.
      - - Base
        - >-
          Requires audited financial and cash-flow proof plus share-level terms; no fair-value range can be derived from
          the $17 billion round and $31 billion fund-NAV-derived mark.
        - Unquantified; reported marks are not a probability distribution.
        - Reconcile reported performance and obtain comparable, dated transaction documents.
      - - Bull
        - >-
          Requires durable monetization and a credible approved liquidity path; the reported secondary trades up to $50
          billion are not a price target or independently verified fair value.
        - Unquantified; the high mark comes from unnamed sources and no audited valuation inputs.
        - CSRC approval, audited cash conversion, and evidence that a transaction can clear at stated terms.
    notes: >-
      These are conditional underwriting cases, not priced forecasts. Numeric valuation ranges, target returns and
      probability weights are intentionally withheld because audited inputs, comparable terms and a current executable
      price are unavailable.
    claimRefs:
      - CV002
      - CV003
      - CV004
      - CV005
      - CV006
      - CV007
      - CV008
      - CV009
      - CV015
