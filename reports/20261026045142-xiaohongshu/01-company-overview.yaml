company:
  name: Xiaohongshu
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Xiaohongshu is a Shanghai-founded lifestyle-content and social-commerce platform whose
    reported scale is large, but whose financial, ownership and governance disclosures remain
    private and inconsistently reported. Reuters and secondary sources support a substantial
    user base; funding totals, private valuation marks and operating metrics require careful
    source attribution rather than treatment as audited facts.
sections:
  - id: identity-and-origins
    title: Identity, origins and operating model
    body: >-
      Xiaohongshu, also called RedNote or Little Red Book, combines user-created lifestyle
      content with product discovery and shopping. Notes using text, images and video give users
      a way to research products and recommendations, while the platform also supports
      e-commerce. Independent descriptions and Reuters place the company in Shanghai and trace
      its founding to 2013; JadeMond and Baidu Baike identify Miranda Qu and Charlwin Mao as
      co-founders. These facts establish origin and product positioning, not the current
      corporate group structure or the precise boundary between platform, marketplace and
      merchant transactions. Current board membership, executive roles and founder operating
      responsibilities are not established by this assigned evidence.
    claimRefs: [CO001, CO002, CO003]
  - id: funding-and-ownership
    title: Private-company funding, valuation and stakeholders
    body: >-
      The available financing record is incomplete. Tracxn reports $900 million raised across
      eight rounds and lists an undisclosed Series F round dated July 11, 2024; that database
      total is not a filing-grade cap table and should not be treated as cash available. Reuters
      reported private secondary trades valuing the company at as much as $50 billion toward
      the end of 2025, while JadeMond reports a $31 billion mark as of September 2025. Those
      dated, differently described private-market figures are not a directly comparable current
      valuation. JadeMond and Baidu Baike list Tencent, Alibaba, GSR Ventures, GGV Capital and
      Hillhouse among investors, but the assigned material does not establish their present
      ownership percentages, governance rights, preference stack, debt or secondary-holder
      overhang.
    claimRefs: [CO006, CO007, CO008, CO009]
    tableRefs: [TO003]
  - id: scale-and-financial-disclosure
    title: Scale and financial disclosure
    body: >-
      Reuters reported more than 400 million monthly active users since 2025, and Fashion China
      Agency separately describes 400 million monthly active users in May 2026. The latter also
      reports approximately RMB 42 billion of 2025 revenue and roughly 40% year-over-year
      growth; another marketing-agency article repeats the revenue figure. These are reported
      estimates relayed by secondary sources, not audited statements in this evidence pool.
      JadeMond reports approximately $3.7 billion of 2023 revenue and $500 million of net profit,
      again without primary financial statements here. The assigned sources do not establish
      current headcount, cash flow, audited revenue recognition, segment economics or a
      prospectus-grade reconciliation of revenue and profit. A diligence decision should keep
      these values separate from ARR, cash burn and cash available.
    claimRefs: [CO004, CO005, CO014]
    tableRefs: [TO001]
  - id: milestones-and-governance
    title: Milestones and governance signals
    body: >-
      The evidence supports a dated outline from the 2013 founding through the 2026 content
      integrity response, but much of the chronology is reported by a secondary encyclopedia
      rather than primary company records. It records a 2014 e-commerce launch, 2016 financing,
      a 2019 app-store removal for rectification, 2023 reported profitability, and a July 2024
      undisclosed Series F round. Baidu Baike and JadeMond describe a temporary surge of U.S.
      attention during the January 2025 TikTok-user migration. In March 2026, TechNode reported
      Xiaohongshu's crackdown on AI-managed accounts and simulated engagement. That policy
      response is an adverse governance signal about authenticity and enforcement exposure, not
      evidence that all platform content is manipulated or that a specific incident affected
      the company financially.
    claimRefs: [CO002, CO006, CO011, CO012, CO013, CO015, CO016]
    figureRefs: [FO001]
    tableRefs: [TO002]
