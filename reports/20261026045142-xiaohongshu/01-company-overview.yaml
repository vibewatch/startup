callouts:
  - calloutType: risk
    title: Private-market marks are not a current audited valuation
    body: >-
      The $31 billion and up-to-$50 billion references differ in date and transaction description;
      neither establishes a current, fully diluted enterprise value.
    claimRefs: [CO007, CO008]
  - calloutType: insight
    title: Platform scale is better evidenced than financial quality
    body: >-
      A large reported MAU base is supported by Reuters, but audited revenue, cash flow,
      monetization quality and cash available remain undisclosed in the assigned sources.
    claimRefs: [CO004, CO005]
