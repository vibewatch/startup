callouts:
  - calloutType: insight
    title: Product surface is clearer than the technical moat
    body: >-
      Assigned sources describe a connected consumer journey from user notes
      through discovery and commerce, but do not substantiate the internal
      architecture, ranking advantage, reliability or safety performance.
    claimRefs: [CE001, CE002, CE004, CE012, CE013]
  - calloutType: risk
    title: Public developer signal is not official integration evidence
    body: >-
      The GitHub topic page reflects third-party projects associated with
      Xiaohongshu; it does not verify official APIs, company code ownership,
      platform endorsement or secure production integrations.
    claimRefs: [CE009, CE010]
