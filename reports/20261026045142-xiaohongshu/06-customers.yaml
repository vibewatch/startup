schemaVersion: "report-v2"
artifact: customers
slug: xiaohongshu
runDate: 2026-10-26
company:
  name: Xiaohongshu
chapter:
  number: 6
  title: Customers
  summary: >-
    Xiaohongshu monetizes a consumer discovery community through brand advertising,
    creator programs and commerce, but public evidence in the assigned sources shows
    platform reach and isolated campaign activity rather than durable customer economics.
sections:
  - id: customer-roles
    title: Customer roles and value path
    body: >-
      Xiaohongshu serves several distinct customer groups: consumers who use lifestyle
      notes and search to evaluate products, advertisers that buy campaign reach, merchants
      that sell through platform commerce surfaces, and creators who supply sponsored or
      user-generated content. Reuters describes the app as a de-facto search destination
      for travel, lifestyle and restaurant recommendations, while Rest of World situates
      it in a social-commerce model that combines discovery with shopping (CU001). These
      audiences should not be collapsed into a single “customer” count: reported monthly
      active users measure platform reach, not paying customers, repeat purchasers,
      advertiser accounts or merchant sales. The segmentation table distinguishes the
      roles and flags where the assigned evidence does not quantify conversion or value.
    claimRefs: [CU001, CU009, CU010, CU016]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-evidence
    title: Adoption is visible; retention is not
    body: >-
      The sources provide evidence of large platform reach, a discrete U.S. migration
      event and one agency-reported advertiser campaign, but these observations have
      different populations and time bases. JadeMondo relays company-disclosed monthly
      active users above 350 million as of August 2025; Reuters later reported more than
      400 million monthly active users since 2025 (CU002). Radio Free Asia reported a
      January 2025 U.S. influx around the TikTok-ban deadline, including more than half
      a million users joining and a separate source's estimate above 700,000 (CU003).
      Neither a download surge nor a platform-wide active-user figure establishes
      customer retention. HnE Marketing Consultancy's unnamed-app case reports campaign
      outputs over 15 days, but the figures are agency-reported and are not independently
      audited (CU004, CU005). The trajectory table preserves those distinctions instead
      of treating reach, campaign leads and paying-customer growth as interchangeable.
    claimRefs: [CU002, CU003, CU004, CU005]
    tableRefs: [TU002]
  - id: proof-and-durability
    title: Named proof and commercial durability remain thin
    body: >-
      Public customer proof is narrower than the platform's reach claims. HnE describes
      a paid campaign for a European transfers, rides and delivery app but does not name
      the client; Chinafy describes an SK-II and Zhang Zifeng ambassador collaboration,
      while the 17,000 comments and sales conversions it cites were on Weibo, not a
      Xiaohongshu outcome (CU004, CU005, CU007). A South China Morning Post topic-page
      excerpt reports Apple's RedNote account had more than 200,000 followers after its
      first post, but a follower count is not evidence of active buyers or sales (CU010).
      These examples show campaign and account activity, not verified production
      deployment scale, attributable revenue or repeat use.
      Company-reported moderation measures and independent reporting on censorship and
      security concerns also make trust and content quality relevant to customer
      durability (CU012, CU013). The available sources do not report NRR, GRR, churn,
      renewal cohorts, repeat-spend rates, top-advertiser share or merchant concentration.
      These are material diligence gaps: the buyer mix may be broad, while the economics
      of retention, expansion and dependence on a small set of commercial accounts remain
      unproven.
    claimRefs: [CU004, CU005, CU007, CU010, CU011, CU012, CU013, CU014, CU015]
    tableRefs: [TU003]
tables:
  - id: TU001
    title: Customer segmentation
    columns:
      - Segment
      - Buyer, user or payer
      - Use case and evidence
      - Scale or commercial value
      - Diligence gap
    rows:
      - - Consumers and prospective buyers
        - User; potential product buyer
        - Research lifestyle recommendations, reviews and products through notes, search and commerce surfaces.
        - Platform-wide MAUs are reported; purchasing and repeat-buyer counts are not.
        - Seek active-buyer cohorts and conversion by category and geography.
      - - Advertisers and brands
        - Marketing buyer
        - Use paid placements, branded notes and creator campaigns to reach or convert audiences.
        - One agency-reported campaign provides impressions, clicks, CPC and leads; no advertiser count or spend total.
        - Obtain advertiser retention, campaign spend, ROAS and customer concentration.
      - - Merchants and sellers
        - Seller; commerce counterparty
        - Use in-app product discovery and commerce features to reach buyers.
        - Commerce is described as integrated with content; merchant GMV and active-seller counts are not established here.
        - Request active-seller cohorts, GMV attribution, take rate and repeat purchase data.
      - - Creators and influencers
        - Content supplier; may be paid by brands
        - Publish user-generated content and participate in KOL/KOC or brand collaborations.
        - Sources describe the model but do not quantify active creators, payout retention or creator concentration.
        - Request creator activation, earnings distribution and repeat-campaign data.
    notes: >-
      Segmentation synthesizes the assigned secondary and agency sources; user reach,
      campaign leads and commerce activity are different measures and are not a revenue
      or paying-customer denominator.
    claimRefs: [CU001, CU004, CU005, CU008, CU009, CU010, CU016]
  - id: TU002
    title: Public adoption and campaign indicators
    columns:
      - Metric
      - Reported value and period
      - Source and confidence
      - What it indicates
      - Missing denominator or limitation
    rows:
      - - Monthly active users
        - More than 350 million as of August 2025
        - JadeMondo relays company disclosure; medium confidence
        - Platform reach at a stated date
        - Not paying users, retention or customer count
      - - Monthly active users
        - More than 400 million since 2025; Reuters article dated June 16, 2026
        - Reuters reporting; high confidence for the reported figure
        - Later reported platform scale
        - Exact measurement date and definition are not specified in the article
      - - U.S. user influx
        - More than 500,000 users joined ahead of the January 19, 2025 TikTok deadline; a source close to the company told RFA more than 700,000 joined
        - Radio Free Asia; medium confidence, source not named
        - Short-window acquisition during an external event
        - No subsequent active-use, retention or purchasing cohort
      - - Advertiser campaign
        - HnE reports 400+ new followers in 15 days from a zero-follower account, 70,246 impressions, 3,846 clicks, 5.48% CTR, CNY 1.82 CPC and more than 30 leads
        - HnE Marketing Consultancy case study; low confidence, self-reported
        - A single campaign's reported early outputs
        - Client is unnamed; lead quality, spend, conversion and revenue are not independently verified
    notes: >-
      These are source-reported measures from different populations and periods. MAUs
      are not additive across rows; RFA's two user-influx estimates have different
      attributions; campaign results are not audited or representative.
    claimRefs: [CU002, CU003, CU004, CU005]
  - id: TU003
    title: Named customer proof table
    columns:
      - Public example
      - Segment and use
      - Deployment or outcome evidence
      - Confidence and limitation
    rows:
      - - European transfers, rides and delivery app; client name not disclosed
        - Advertiser; paid Xiaohongshu campaign
        - HnE says the new account started with zero followers and gained 400+ followers in 15 days; it also reports impressions, clicks, CPC and leads.
        - Single agency-authored case; no client confirmation, spend, attributed revenue or independent production reference.
      - - SK-II and Zhang Zifeng
        - Beauty brand and ambassador collaboration described as Xiaohongshu-linked
        - Chinafy reports the collaboration; the 17,000 comments and sales conversions from verified users in six days refer to a Weibo announcement.
        - Campaign activity is identifiable, but the cited outcome is not a Xiaohongshu result and does not establish platform-attributed sales.
      - - Apple RedNote account
        - Consumer-electronics brand account
        - A South China Morning Post topic-page excerpt says the RedNote account had more than 200,000 followers after its first post.
        - A follower count does not establish active buyers, paid campaign use or platform-attributed sales.
    enumerationScope:
      coverage: partial
      basis: >-
        Sample of customer and campaign references found in the successful assigned
        sources; it is not an exhaustive customer roster or deployment census.
    notes: >-
      Distinguish a named brand collaboration or account from a production deployment,
      and distinguish Weibo engagement and follower counts from Xiaohongshu-attributed
      sales. This is a partial sample, not an exhaustive customer roster.
    claimRefs: [CU004, CU005, CU007, CU010, CU014]
figures:
  - id: FU001
    title: Illustrative customer journey and monetization surfaces
    type: journey-map
    summary: >-
      Sources describe a path from lifestyle discovery and search to brand campaigns and
      commerce, but do not establish conversion rates or a universal sequence.
    data:
      items:
        - label: Discover
          details: Users encounter lifestyle notes and recommendations in the platform.
          touchpoints: [user-generated notes, recommendation feed]
        - label: Research
          details: Users search and compare advice before deciding what to explore.
          touchpoints: [in-app search, reviews]
        - label: Evaluate
          details: Peer or creator content may inform product consideration.
          touchpoints: [creator notes, brand content]
        - label: Reach
          details: Advertisers can amplify content through paid placements and campaigns.
          touchpoints: [paid notes, creator collaborations]
        - label: Convert
          details: A user may inquire, follow a link or purchase through commerce features.
          touchpoints: [lead inquiry, in-app commerce]
        - label: Repeat or expand
          details: Repeat use, renewal and advertiser expansion are not measured in the assigned evidence.
          touchpoints: [retention data unavailable]
    claimRefs: [CU001, CU004, CU005, CU008, CU009, CU014]
callouts:
  - calloutType: risk
    title: Reach is not retention
    body: >-
      Public MAU figures and a short-lived migration spike do not establish repeat
      purchasing, advertiser renewal or merchant concentration; those metrics require
      cohort-level disclosure.
    claimRefs: [CU002, CU003, CU014, CU015]
