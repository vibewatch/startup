evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: leadership-governance
    missingEvidence: Current executive roster, board composition, founder responsibilities, ownership and key-person succession.
    whyItMatters: >-
      Leadership accountability, control rights and dependence on specific people cannot be assessed from founder
      biographies alone.
    diligencePath: Request the current organization chart, board roster, cap table, governance documents and succession plan.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: material
    topic: valuation
    missingEvidence: Comparable transaction-level details for the reported $31 billion and up-to-$50-billion valuation references.
    whyItMatters: >-
      Private secondary marks can use different dates, share classes and transaction sizes and do not establish current
      enterprise value.
    diligencePath: Obtain dated transaction documentation, fully diluted share counts, share-class terms and the current cap table.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: financials-revenue
    missingEvidence: Audited income statements, cash-flow statements and revenue breakdowns for FY2025 and prior years.
    whyItMatters: >-
      Reported revenue and accounting profit do not establish recurring revenue, cash burn, cash flow or available
      liquidity.
    diligencePath: Request audited financial statements, segment reporting, revenue-recognition policies and a cash/debt schedule.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: headcount
    missingEvidence: A reliable, dated employee count and operating-location breakdown.
    whyItMatters: >-
      Scale, operating leverage and geographic concentration cannot be assessed without consistent employee and location
      definitions.
    diligencePath: Request a dated employee roster by entity, geography and employee/contractor status.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: funding
    missingEvidence: >-
      Primary-source funding history, current cap table, debt and credit facilities, secondary transactions and
      liquidation preferences.
    whyItMatters: >-
      A third-party total raised is not cash available and does not reveal dilution, debt obligations or investor
      downside protection.
    diligencePath: Request audited capitalization records, financing documents, debt schedules and secondary-sale documentation.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      A reproducible China-only social-commerce value series with a clear revenue-versus-GMV basis, Xiaohongshu
      category-level advertiser budgets, disclosed monetization by advertising versus commerce, and attributable
      platform-wide GMV with consistent periods and definitions.
    whyItMatters: >-
      The available China estimate has an unclear value basis, and global sources materially disagree; neither can
      support a defensible Xiaohongshu TAM, SAM, SOM or revenue-capture estimate without consistent market definitions
      and platform attribution.
    diligencePath: >-
      Review original publisher methodologies and obtain a licensed China social-commerce series; request company or
      merchant evidence reconciling category spend, ad revenue, platform GMV, take rates and off-platform conversion
      using the same period.
    relatedQuestionRefs:
      - QM007
    relatedTableRefs:
      - TM002
      - TM003
  - type: conflicting-data
    severity: material
    topic: platform-reach
    missingEvidence: >-
      A dated, consistent source definition for Xiaohongshu monthly active users, daily active users, daily searches,
      and unique users, including whether figures are company-reported or independently measured.
    whyItMatters: >-
      The retained reports use different vintages and at least one secondary 2025 figure, so headline reach cannot be
      converted into engagement, penetration, or monetizable buyer counts.
    diligencePath: >-
      Request the company's metric definitions and time series, then reconcile them with independently measured
      active-use data before using user penetration or engagement assumptions in valuation.
    relatedQuestionRefs:
      - QM005
      - QM007
    relatedTableRefs:
