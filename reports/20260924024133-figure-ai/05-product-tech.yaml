- "id": "s4"
  "title": "Deployment, Integration, and Reliability"
  "body": "Figure AI's deployment model requires a multi-month integration period before a customer can\nreach commercial\
    \ scale. The BMW Spartanburg deployment involved: (1) 11-month pilot period,\n(2) Task-specific training data collection\
    \ via human teleoperation, (3) Helix model fine-tuning\nfor BMW-specific tasks, (4) Safety protocol development and worker\
    \ co-existence testing, (5)\nGradual fleet scale-up from pilot units to 90,000+ parts handled.\n\nReliability metrics\
    \ from BMW: >99% task accuracy is the headline; availability and mean-time-\nbetween-failure (MTBF) have not been publicly\
    \ disclosed. The 5-hour battery requires periodic\nrecharging (wireless) during shift breaks, or shift-based hot-swap\
    \ infrastructure. Long-term\nactuator wear rates at industrial operating tempo are not yet established.\n\nFigure 03 roadmap:\
    \ (1) Integration into BMW Leipzig plant (planned summer 2026); (2)\nExpansion to additional manufacturing verticals (warehouse,\
    \ electronics); (3) Consumer/household\nFigure deployment (undisclosed timeline); (4) Helix model expansion to longer\
    \ task horizons\nand multi-robot coordination.\n\nIntegration requirements are significant: customer must provide structured\
    \ physical workspace,\nestablish OTA connectivity, define task parameters, and develop safety protocols. The absence\n\
    of standardized humanoid robot safety certification (OSHA, ISO) means customers must develop\nsite-specific risk assessments.\n"
