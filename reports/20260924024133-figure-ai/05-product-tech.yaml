- "id": "s3"
  "title": "Technology Architecture and Operating Model"
  "body": "Figure AI's technology stack is vertically integrated by design, providing control over the\nentire stack from\
    \ robot hardware to the AI model. Key architectural layers:\n\n1. Perception layer: 6 onboard cameras provide RGB-D visual\
    \ input. The system must handle\nocclusion, lighting variation, and object deformation in real time. No public disclosure\
    \ on\nLIDAR or tactile sensors beyond camera and force-torque data.\n\n2. Action/policy layer: Helix VLA model maps visual\
    \ observations and task language to joint\ntorque commands. The key claim is \"zero-shot generalization\" — the ability\
    \ to perform novel\nvariations of trained tasks without explicit reprogramming. This has been demonstrated in\nBMW production,\
    \ but the scope of generalization is bounded by what the model was trained on.\n\n3. Infrastructure layer: Figure OS (robot\
    \ operating system), a cloud-connected fleet management\nplatform, OTA update delivery, and real-time safety monitoring.\
    \ The cloud integration introduces\ncybersecurity risks in industrial settings.\n\n4. Manufacturing layer: BotQ is not\
    \ just an assembly facility but also the platform for quality\ntesting, AI model integration, and robot-level safety certification\
    \ before deployment.\n\nMicrosoft Azure is the primary cloud provider. NVIDIA hardware (Jetson or custom) is suspected\n\
    for on-device inference, though not officially confirmed. OpenAI's collaboration likely relates\nto large language model\
    \ integration for task understanding, though details are undisclosed.\n"
