- "id": "s5"
  "title": "Technology Differentiation and IP"
  "body": "Figure AI's key differentiators relative to competitors:\n\n1. Helix VLA model (BMW training data): The model's\
    \ commercial performance (>99% accuracy,\n400% efficiency gain) is the most validated VLA deployment in industrial humanoid\
    \ robotics.\nThe BMW production data is proprietary — competitors cannot access it. This data flywheel\nstrengthens Helix\
    \ as more tasks are completed.\n\n2. 20 DOF hand design: Among the most dexterous commercial humanoid hands, enabling\
    \ fine\nmanipulation that simpler grippers (Agility Digit hooks) cannot perform. IP includes hand\nmechanism patents and\
    \ actuation techniques.\n\n3. Wireless inductive charging: 5-hour battery with wireless charging eliminates charging\n\
    downtime interruption — a practical operational advantage for 24/7 industrial deployment.\n\n4. Vertical integration:\
    \ Control of hardware, AI model, and manufacturing gives Figure AI\nthe ability to co-optimize across layers — reducing\
    \ COGS over time and enabling performance\nimprovements that benefit from system-level tuning.\n\n5. IP portfolio: Figure\
    \ AI has filed patents on robot design, actuation mechanisms, and AI\ntraining methods, though the breadth and competitive\
    \ strength of the portfolio have not been\nindependently assessed. Brett Adcock has stated the team prioritizes speed\
    \ of innovation\nover patent filings.\n\nKey IP risks: VLA model architectures are increasingly open-source (OpenVLA,\
    \ pi0); hardware\ndesign can be reverse-engineered by well-funded Chinese competitors; regulatory IP (safety\ncertifications)\
    \ does not yet exist to protect early movers.\n"
  "claimRefs":
  - "CE015"
- "id": "s6"
  "title": "Trust, Safety, and Compliance"
  "body": "Humanoid robots operating alongside humans in industrial settings create significant safety\nand compliance challenges.\
    \ Key considerations for Figure AI:\n\n1. Physical safety: A 60kg robot moving at high speed can cause serious injury.\
    \ Safety\nsystems include: velocity and force limits near humans, emergency stop protocols, geofencing\n(robots confined\
    \ to defined work envelopes), and human proximity detection. BMW's deployment\nincludes co-existence protocols where humans\
    \ and robots share zones with physical barriers\nand speed limitations.\n\n2. Regulatory compliance: No established OSHA\
    \ or ISO standard specifically governs humanoid\nrobot deployment in industrial settings as of 2026. Figure AI operates\
    \ in a regulatory gap\nwhere customers must develop site-specific risk assessments. EU AI Act Article 6/7 may\nclassify\
    \ general-purpose humanoid robots as high-risk AI systems requiring conformity\nassessment before deployment in EU facilities.\n\
    \n3. Data privacy: Figure AI's 6-camera array captures detailed video of production facilities\nand workers. Cloud-connected\
    \ operation raises concerns about customer IP exposure (competitors\ncould theoretically observe production methods through\
    \ robot data).\n\n4. Cybersecurity: Networked industrial robots are potential targets for ransomware or sabotage.\nCloud\
    \ connectivity introduces attack surfaces. No public disclosure of Figure AI's security\narchitecture or penetration testing\
    \ results.\n\n5. AI bias and error: VLA models can produce unexpected outputs (\"hallucinations\") in novel\nsituations.\
    \ An out-of-distribution task could cause the robot to damage parts, injure a worker,\nor cause a production stoppage.\
    \ Helix's robustness under distribution shift is not fully\ncharacterized in public.\n"
