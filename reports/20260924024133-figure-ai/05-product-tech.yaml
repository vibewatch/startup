- "id": "s2"
  "title": "Product Module and Component Map"
  "body": "Figure AI's product system consists of three integrated modules:\n\n1. Figure 03 Hardware: The physical robot body\
    \ — 168cm tall, 60kg, 20 DOF hands (described as\nhaving near-human dexterity), 6 onboard cameras (stereoscopic and monocular),\
    \ a 5-hour battery\nwith wireless inductive charging. Custom-designed actuators (rotary and linear) are manufactured\n\
    in-house or by dedicated suppliers. Key proprietary components: the hand assembly (16–20 DOF),\nthe force-torque sensor\
    \ array, and the robot operating system (Figure OS).\n\n2. Helix AI Model: A vision-language-action model that maps camera\
    \ inputs and natural language\ntask descriptions to robot joint actions. The model is trained using reinforcement learning\
    \ from\ndemonstrations (human teleoperation data from BMW and internal labs) plus physics simulation.\nHelix runs inference\
    \ on-device using a dedicated AI chip (details undisclosed). Model updates\nare delivered over-the-air (OTA). As of Figure\
    \ 03 launch, Helix represents a significant\nadvancement over Figure 02's model, with higher task generalization.\n\n\
    3. BotQ Manufacturing Platform: Figure AI's purpose-built factory targeting 12,000 robots/year\ninitially (aspirational\
    \ 100,000/year). BotQ integrates robot assembly, quality control, AI\nmodel deployment, and fleet management infrastructure.\
    \ The factory location and construction\nstatus beyond the announced plans are not fully public as of May 2026.\n"
