"chapter":
  "number": !!int "5"
  "title": "Product and Technology"
  "summary": "Figure AI's product is a vertically integrated physical AI system: humanoid robot hardware\n(Figure 03) combined\
    \ with the Helix vision-language-action (VLA) model and the BotQ\nmanufacturing platform. Figure 03, launched September\
    \ 2025, is a 168cm, 60kg robot with\n20 DOF hands, 6 onboard cameras, a 5-hour battery with wireless charging, and an\
    \ onboard\nHelix inference chip. The Helix AI model is a neural visuomotor policy trained on BMW\nproduction task data,\
    \ enabling zero-shot generalization across new tasks without task-specific\nprogramming. The product architecture is full-stack\
    \ proprietary — Figure AI designs its own\nactuators, sensors, robot OS, and AI model. Key technical differentiators are\
    \ the BMW training\ndata flywheel, the Helix model's demonstrated >99% task accuracy in commercial settings, and\nthe\
    \ BotQ factory designed for 12,000 units/year. Major technical risks include task generalization\nlimits beyond pick-and-place,\
    \ actuator reliability at scale, supply chain for custom components,\nand the regulatory absence of safety certification\
    \ standards for humanoid robots.\n"
"sections":
- "id": "s1"
  "title": "Product Definition in Customer Workflow Terms"
  "body": "Figure AI's product solves a specific enterprise problem: replacing human workers in physically\ndemanding, repetitive,\
    \ and ergonomically hazardous manufacturing tasks, without requiring\nfacility retrofitting (because humanoid robots operate\
    \ in environments already built for humans).\n\nIn BMW's Spartanburg deployment, Figure robots perform sheet-metal loading\
    \ and part-handling\ntasks: picking specific body-panel parts from bins, orienting them correctly, and loading them\n\
    into production jigs at the correct position and force. These tasks were previously performed\nby humans who experienced\
    \ repetitive strain injuries and fatigue. The robot workflow is:\n(1) Visual perception of part in bin; (2) Grasp planning\
    \ using Helix; (3) Dexterous manipulation\nwith 20 DOF hands; (4) Placement verification; (5) Signal to human co-worker\
    \ or next step.\n\nThe customer value proposition is: (a) Labor substitution — the robot is available 24/7, does\nnot\
    \ fatigue, does not call in sick; (b) Quality improvement — >99% task accuracy eliminates\nhuman error in repetitive tasks;\
    \ (c) Ergonomic compliance — removes humans from injury-prone\npositions; (d) ROI — at $12K/year RaaS, payback vs. $40K+\
    \ human labor cost is compelling for\nhigh-volume tasks.\n\nThe primary limitation: Figure 03 is not yet a general-purpose\
    \ robot. Tasks must be narrow,\nrepetitive, and well-structured. Open-ended, novel, or multi-step unstructured tasks remain\n\
    beyond the system's current commercial deployment capability.\n"
