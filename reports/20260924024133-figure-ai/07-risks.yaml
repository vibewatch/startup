"chapter":
  "number": !!int "7"
  "title": "Risks"
  "summary": "Figure AI faces a multi-dimensional risk profile that is above average for a Series C hardware/AI\ncompany.\
    \ The two highest-severity risks are (1) a workplace safety incident triggering regulatory\nshutdown and reputational\
    \ collapse, and (2) single-customer concentration making Figure AI\noperationally dependent on BMW's continued commitment.\
    \ Both carry kill-criteria implications.\nA third critical risk — Tesla Optimus achieving mass-market cost advantage —\
    \ is strategically\nplausible within the 2026–2028 horizon. Additional risks include EU AI Act compliance for Leipzig,\n\
    key-person dependency on Brett Adcock, Chinese cost competition at $16,000–$50,000 per unit,\nundisclosed robot MTBF and\
    \ cybersecurity architecture, and a $39B valuation implying 250x–650x\nrevenue that requires revenue scale milestones\
    \ Figure AI has not yet achieved.\n"
"sections":
- "id": "s1"
  "title": "Risk Overview and Severity Ranking"
  "body": "Figure AI's risk profile is shaped by three structural realities: it deploys physical AI systems\nin safety-critical\
    \ manufacturing environments, it is pre-diversification with ~85–95% revenue\nconcentration at one customer (BMW), and\
    \ it carries a $39B valuation that implies future revenue\ndelivery the market has not yet proven. This chapter ranks\
    \ material risks by residual exposure\n(likelihood × impact after current mitigations), assesses mitigation maturity,\
    \ identifies\nthesis-break triggers, and proposes investor diligence asks. Risks are grouped into four\ncategories: regulatory/legal,\
    \ operational/technical, partner/dependency, and people/execution.\nThe highest residual exposure risks are: (1) BMW customer\
    \ exit/reduction (impact 5, likelihood 2\n= residual 10), (2) a workplace safety incident (impact 5, likelihood 2 = residual\
    \ 10), and (3)\nTesla Optimus achieving cost parity (impact 4, likelihood 3 = residual 12). Chinese cost\ncompetition\
    \ is the highest-probability risk (likelihood 5) but carries moderate impact (3) given\nthe current enterprise quality\
    \ differentiation.\n"
  "claimRefs":
  - "CR001"
  - "CR012"
  - "CR014"
  "figureRefs":
  - "FR001"
  "tableRefs":
  - "TR001"
- "id": "s2"
  "title": "Regulatory, Legal, and Safety Risks"
  "body": "Figure AI operates in a nascent regulatory environment. No comprehensive U.S. federal standard\nyet specifically\
    \ addresses humanoid robots; OSHA's General Duty Clause (29 U.S.C. §654) is the\nprimary compliance framework, supplemented\
    \ by ISO 10218-1:2011 (industrial robots) and ISO/TS\n15066 (collaborative robots). IEEE Spectrum noted in February 2025\
    \ that \"current OSHA standards\nwere written for fixed industrial robots, not humanoids that share workspace with humans.\"\
    \nA serious robot-caused workplace injury would trigger OSHA investigation, potential fines up to\n$156,259 per willful\
    \ violation (2025 inflation-adjusted), unlimited civil product liability,\nBMW production shutdown, and reputational damage\
    \ that could freeze the enterprise sales funnel.\nNo OSHA citations or enforcement actions related to Figure AI robot\
    \ deployments have been found\nin public databases as of May 2026. The EU AI Act (effective August 2024, phased enforcement\n\
    through 2027) classifies autonomous robots in shared human environments as Annex III high-risk\nAI systems, requiring\
    \ conformity assessment and CE marking before EU deployment. BMW Leipzig\n(planned summer 2026) faces this compliance\
    \ requirement — Figure AI has not disclosed a\nconformity assessment timeline. GDPR applies to robot vision data capturing\
    \ worker information\nin EU plants. Intellectual property risk remains latent: Tesla has filed 100+ humanoid robotics\n\
    patent applications (2022–2025); no active patent litigation naming Figure AI has been found.\n"
  "claimRefs":
  - "CR001"
  - "CR002"
  - "CR003"
