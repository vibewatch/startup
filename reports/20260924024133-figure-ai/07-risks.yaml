- "id": "s3"
  "title": "Operational, Technical, and Security Risks"
  "body": "Figure AI's primary technical risk is task generalization: the Helix VLA model has been proven\non BMW Spartanburg's\
    \ specific sheet-metal loading tasks across an 11-month pilot. Generalization\nto diverse environments remains unproven\
    \ at commercial scale. No public disclosure of robot MTBF,\nfield failure rate, or warranty provisions from the BMW deployment\
    \ exists — a material diligence\ngap. NIST's robotics manufacturing roadmap identifies quality management as the key scaling\n\
    bottleneck; Figure AI must establish ISO 9001-equivalent quality systems for BotQ's 12,000 units/yr\ntarget. Supply chain\
    \ risk: BotQ in Sunnyvale, CA is the sole manufacturing site. Key components\nincluding NVIDIA compute modules, precision\
    \ servo actuators, and optical sensors are sourced from\na constrained global supply chain. U.S.-China semiconductor export\
    \ controls affect compute\navailability. Cybersecurity risk is systemic: networked humanoid robots represent an ICS-class\n\
    attack surface (per CISA). No ISO 27001 certification or cybersecurity audit has been disclosed.\nTalent retention faces\
    \ competition from OpenAI, Google DeepMind, Tesla, and Meta FAIR for\nAI/robotics engineers in a constrained labor market.\n"
  "claimRefs":
  - "CR009"
  "tableRefs":
  - "TR003"
- "id": "s4"
  "title": "Partner, Dependency, Financial, and Competitive Risks"
  "body": "BMW accounts for an estimated 85–95% of Figure AI's 2025 revenue (analyst consensus). BMW has\nnot publicly committed\
    \ to multi-year fixed-volume robot purchase contracts — the Spartanburg\ndeployment operated as a performance-based pilot.\
    \ BMW's Leipzig expansion deepens this\nconcentration before customer diversification occurs. Tesla Optimus has a disclosed\
    \ production\ncost target below $20,000/unit by end of 2026, versus Figure AI's estimated $100,000–200,000.\nEven at 50%\
    \ of this target, Tesla's Gigafactory manufacturing advantages would undercut\nFigure AI's enterprise pricing model. Chinese\
    \ competitors Unitree (G1 at $16,000 listed),\nUBTECH, AgiBot, and Fourier are already at $16,000–$50,000. Figure AI's\
    \ $39B valuation at\n250x–650x revenue requires revenue milestones not yet demonstrated. Sacra Research estimates\nannual\
    \ operating expenditure at $250–400M (2025), implying a 3–5 year runway on $1.9B raised —\nadequate near-term but dependent\
    \ on revenue scale before 2028. BMW Leipzig will require\ncapital whose funding source has not been disclosed.\n"
  "claimRefs":
  - "CR010"
  - "CR011"
  - "CR012"
  - "CR013"
  - "CR014"
  - "CR015"
- "id": "s5"
  "title": "People, Execution, Mitigations, and Thesis-Break Triggers"
  "body": "Key-person risk: Brett Adcock drives culture, investor relations, and product vision; no named\nsuccessor or deputy\
    \ CEO has been announced. Thirteen strategic investors (Microsoft, OpenAI,\nNVIDIA, Amazon, Qualcomm, Intel, T-Mobile,\
    \ Salesforce, and others) with potentially diverging\ninterests create governance conflict risk. Key mitigations in place:\
    \ BMW endorsement and\ntrack record provide regulatory and reputational anchors. $1.9B raised provides near-term\ncapital\
    \ buffer. Strategic investor ecosystem provides technology and distribution protection.\nBotQ vertical integration reduces\
    \ single-supplier dependency for final assembly. Proposed\nmitigation gaps: Pursue OSHA Voluntary Protection Program status,\
    \ ISO 27001 certification,\nand EU AI Act conformity assessment before Leipzig. Achieve 2+ anchor enterprise customers\n\
    before 2027 — the most critical execution milestone. Five thesis-break triggers: (1) serious\nrobot safety incident at\
    \ any deployment site; (2) BMW terminating or significantly reducing\nits robot fleet; (3) Tesla Optimus at less than\
    \ $30,000/unit before 2027; (4) mandatory new\nhumanoid robot safety regulations Figure AI cannot meet; (5) Brett Adcock\
    \ departure without\nnamed successor. Diligence asks: (1) audited revenue by customer, (2) robot MTBF and field\nfailure\
    \ data, (3) OSHA safety protocol documentation, (4) BotQ quality yield rate, (5) EU AI\nAct conformity assessment timeline,\
    \ (6) cap table and governance rights.\n"
  "claimRefs":
  - "CR009"
