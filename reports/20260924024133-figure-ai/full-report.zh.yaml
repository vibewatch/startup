      - number: '7.2'
        title: 监管、法律与安全风险
        blocks:
          - type: paragraph
            body: >
              Figure AI 处于尚不成熟的法规监管环境之中。目前美国联邦层面尚未出台专门针对人形机器人的系统性法案；美国职业安全与健康管理局（OSHA）的《通用责任条款》（29 U.S.C.
              §654）是核心遵从底线，同时参考面向工业机器人的 ISO 10218-1:2011 以及面向协作机器人的 ISO/TS 15066 标准。《IEEE Spectrum》在 2025 年 2 月撰文指出：“现行
              OSHA 法规当初是为固定式工业机械臂制定的，而非面向需要与工人共享作业空间的人形机器人。”一旦发生机器人导致的严重工伤事故，将立刻触发 OSHA 深入调查、每次故意违规行为最高可达 $156,259
              的行政罚款（经 2025 年通胀调整）、无上限的民事产品责任索赔、BMW 产线暂停整顿，以及可能冻结企业级销售漏斗的声誉危机。截至 2026 年 5 月，在公共监管数据库中未发现与 Figure AI
              现场部署相关的任何 OSHA 处罚通报或执法行动。欧盟《人工智能法案》（2024 年 8 月生效，分阶段执行至 2027 年）将共享人际空间的自主机器人列为附件三（Annex III）高风险 AI
              系统，要求在欧盟属地部署前必须通过合格评定并获得 CE 认证。计划于 2026 年夏季实施的 BMW Leipzig 工厂部署必须跨过这道合规门槛——而 Figure AI
              尚未对外公布具体的合规评定推进时间表。此外，GDPR 也将管辖机器人在欧盟工厂采集含有工人肖像及隐私信息的视觉数据。在知识产权领域，潜在侵权风险依然潜伏：Tesla 在 2022 至 2025 年间已申请了
              100+ 项人形机器人专利；但截至目前，未见涉及 Figure AI 的存续专利诉讼。
            claimRefs:
