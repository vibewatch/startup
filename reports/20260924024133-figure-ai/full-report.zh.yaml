      - number: '5.2'
        title: 产品模块与组件架构图
        blocks:
          - type: paragraph
            body: >
              Figure AI 的产品体系由三大集成模块构成：


              1. Figure 03 硬件平台：机器人物理本体——身高 168cm、体重 60kg，配备 20 自由度灵巧手（官方称其具备接近人类的灵巧度），搭载 6 个机载摄像头（双目与单目感知），配备支持无线感应充电的
              5 小时续航电池。定制研发的执行器（旋转与直线执行器）由内部制造或由专属供应商供应。核心自研组件包括：手部总成（16–20 自由度）、力矩传感器阵列以及机器人操作系统（Figure OS）。


              2. Helix AI 模型：将摄像头视觉输入与自然语言任务指令直接映射为机器人关节动作的视觉-语言-动作模型。该模型结合了示范强化学习（来自 BMW
              现场与内部实验室的人工遥操作数据）与物理仿真展开训练。Helix 借助专用 AI 芯片在端侧运行推理（具体细节未予披露）。模型升级由 OTA 空中推送完成。在 Figure 03 发布时，Helix 相比
              Figure 02 的旧模型有了显著跃升，具备更高的任务泛化能力。


              3. BotQ 制造平台：Figure AI 自建的专用工厂，初期规划年产能为 12,000 台机器人（长期愿景为 100,000 台/年）。BotQ 整合了机器人整机组装、质量品控、AI
              模型烧录以及机队管理基础设施。除已公布的规划外，截至 2026 年 5 月，该工厂的具体选址与建设进展尚未完全公开。
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE002
              - CE013
              - CE014
      - number: '5.3'
        title: 技术架构与运营模式
        blocks:
          - type: paragraph
            body: >
              Figure AI 的技术栈在架构设计上追求垂直整合，实现了从机器人底层硬件到上层 AI 模型全链路的自主掌控。核心架构层级包括：


              1. 感知层：6 个机载摄像头提供 RGB-D 视觉输入。系统必须实时应对视线遮挡、光照变幻与物体形变等复杂情况。除摄像头与力矩数据外，官方未公开披露任何关于激光雷达或触觉传感器的信息。


              2. 动作/策略层：Helix VLA 模型将视觉感知与任务语言指令直接映射为关节力矩输出指令。其核心主张是具备“零样本泛化”能力——即无需重新编程即可应对已受训任务的新型变体。这一能力已在 BMW
              产线中得到验证，但其泛化边界依然受制于模型受训数据的覆盖范围。


              3. 基础设施层：搭载 Figure OS（机器人操作系统）、云端连接的机队管理平台、OTA 升级推送系统以及实时安全监控机制。云端互联也给工业生产环境引入了潜在的网络安全风险。


              4. 制造层：BotQ 不仅是一座总装车间，还是部署前全流程质检测试、AI 模型集成及整机安全认证的核心平台。


              Microsoft Azure 是其主要的云服务提供商。业内推测其端侧推理采用了 NVIDIA 硬件（Jetson 或定制芯片），但尚未获得官方证实。与 OpenAI
              的合作大概率涉及大语言模型在任务理解环节的集成，但具体细节未予披露。
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
          - type: table
            tableRef: TE003
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
      - number: '5.4'
        title: 部署、系统集成与可靠性
        blocks:
          - type: paragraph
            body: >
              Figure AI 的部署模式需要数月的集成期，客户才能达到商业化应用规模。BMW Spartanburg 工厂的部署包含以下环节：(1) 为期 11 个月的试点期；(2)
              借助人工遥操作采集特定任务的训练数据；(3) 针对 BMW 专属任务微调 Helix 模型；(4) 制定安全规范并开展人机共存测试；(5) 逐步扩充机队规模，从试点单元扩展至累计搬运 90,000+ 个零件。


              来自 BMW 的可靠性指标：任务准确率超过 99% 是主要宣传亮点；设备可用率与平均故障间隔时间（MTBF）均未公开披露。5
              小时续航的电池需要在换班休息时段进行无线感应充电，或依赖基于工班的电池热插拔基础设施。工业作业节奏下执行器的长期磨损率尚未确立。


              Figure 03 路线图包括：(1) 集成至 BMW Leipzig 工厂（计划于 2026 年夏季实施）；(2) 拓展至更多制造垂直领域（如仓储、电子装配）；(3) 消费级/家庭场景 Figure
              部署（时间表未公开）；(4) 将 Helix 模型扩展至更长任务规划周期与多机器人协同作业。


              现场集成要求相当高：客户必须提供结构化物理工作空间、搭建 OTA 网络连接、界定任务参数并制定安全规程。鉴于目前缺乏标准化的工业人形机器人安全认证（如 OSHA、ISO 标准），客户必须自行制定厂区专属风险评估。
            claimRefs:
              - CE013
              - CE014
              - CE015
              - CE016
      - number: '5.5'
        title: 技术差异化与知识产权
        blocks:
          - type: paragraph
            body: >
              Figure AI 相对于竞品的核心差异化优势包括：


              1. Helix VLA 模型（BMW 训练数据）：该模型的商业化表现（>99% 准确率，400% 效率提升）是工业人形机器人领域验证最充分的 VLA 部署案例。BMW
              的产线数据属专有资产，竞品无法获取。随着完成任务量增加，这套数据飞轮持续强化 Helix 的表现。


              2. 20 自由度灵巧手设计：属于商业化人形机器人中灵巧度最高的手部设计之一，支持精细操作，而更简单的夹爪（如 Agility Digit 的挂钩）无法胜任。其知识产权涵盖手部机械结构专利与驱动技术。


              3. 无线感应充电：5 小时电池续航配合无线感应充电，消除了充电停机中断，为 24/7 全天候工业部署提供了切实的运营优势。


              4. 垂直整合：全面掌控硬件、AI 模型与制造环节，赋予了 Figure AI 跨层协同优化的能力，能够随着时间推移降低销售成本（COGS），并借助系统级调优实现性能改进。


              5. 知识产权布局：Figure AI 已就机器人构型、驱动机构与 AI 训练方法提交了多项专利申请，但专利组合的广度与竞争壁垒尚未经独立评估。Brett Adcock 曾表示团队将创新速度置于专利申请之上。


              主要知识产权风险：VLA 模型架构正日益开源化（如 OpenVLA、pi0）；硬件设计可能被资金雄厚的中国竞品逆向工程破解；用于保护先行者的合规知识产权（如安全认证）尚未成型。
            claimRefs:
              - CE015
      - number: '5.6'
        title: 信任、安全与合规
        blocks:
          - type: paragraph
            body: >
              人形机器人在工业环境中与人类并肩作业，带来了严峻的安全与合规挑战。Figure AI 面临的关键考量包括：


              1. 物理安全：一台 60kg 的机器人高速运动可能导致严重人身伤害。现有安全系统包括：人类靠近时的速度与力量限制、急停机制、地理围栏（将机器人限定在指定作业包络内）以及人体接近感知。BMW
              的产线部署包含人机共存规程，人类与机器人通过物理隔离屏障和限速措施共享作业区域。


              2. 监管合规：截至 2026 年，尚无成熟的 OSHA 或 ISO 标准专门针对工业环境中的人形机器人部署作出规定。Figure AI
              目前处于监管空白中，客户必须自行开展厂区专属风险评估。欧盟《人工智能法案》（EU AI Act）第 6 条与第 7 条可能将通用人形机器人归类为高风险 AI 系统，要求在欧盟设施部署前完成合格评定。


              3. 数据隐私：Figure AI 配备的 6 摄像头阵列会录制生产车间与工人的详细视频。云端联网运行引发了客户对专有知识产权泄露的担忧（竞品理论上可能从机器人回传数据中窥探生产工艺）。


              4. 网络安全：联网工业机器人属于勒索软件或恶意破坏的潜在攻击目标。云端连接引入了网络攻击面。目前没有公开披露 Figure AI 的安全架构或渗透测试结果。


              5. AI 偏差与失误：VLA 模型在未见过的全新情境下可能输出异常结果（即“幻觉”）。处于分布之外的任务可能导致机器人损坏零部件、伤及工人或引发停产。Helix
              模型在分布偏移下的鲁棒性尚未在公开场合得到充分检验。
            claimRefs:
              - CE015
