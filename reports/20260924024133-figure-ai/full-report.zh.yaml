          values:
            - 2
            - 4
            - 3
        - label: 关键人风险（Adcock）
          values:
            - 2
            - 4
            - 1
        - label: 欧盟《人工智能法案》（EU AI Act）不合规
          values:
            - 3
            - 3
            - 1
        - label: 中国厂商成本竞争
          values:
            - 5
            - 3
            - 1
        - label: 供应链中断
          values:
            - 2
            - 3
            - 1
        - label: 网络安全事件
          values:
            - 2
            - 3
            - 1
        - label: AI 任务泛化失败
          values:
            - 3
            - 2
            - 3
    approximationNotes: 评分为分析师按 1–5 评定。发生概率：1=极低，5=几乎必然。影响程度：1=可忽略，5=达到足以否决项目的程度。缓解成熟度：1=未披露缓解措施，5=已全面落实。
    claimRefs:
      - CR001
  - id: FV001
    title: 建议逻辑——从实证到建议的推导链
    type: flow
    summary: |
      展示推导逻辑链：从 Figure AI 商业化实证、市场规模与 AI 护城河出发，经由风险与估值剖析，得出须附带优先经济条款的「审慎观察（CAUTIOUS WATCH）」建议。
    data:
      nodes:
        - id: n1
          label: 商业化实证（BMW 30K+ 辆汽车，准确率 >99%）
        - id: n2
          label: 市场规模（2030–2034 年 TAM 达 $38–165B）
        - id: n3
          label: AI 护城河（基于 BMW 部署数据的 Helix VLA）
        - id: n4
          label: 估值水平（$39B = 营收的 250–650 倍）
        - id: n5
          label: 核心风险（BMW 占 85–95%；Tesla <$20K；无公开 MTBF）
        - id: n6
          label: 情景分拆（乐观 20% / 基准 40% / 悲观 40%）
        - id: n7
          label: 投资建议：审慎观察（CAUTIOUS WATCH）
      edges:
        - from: n1
          to: n3
          label: 专有部署数据
        - from: n2
          to: n7
          label: 市场空间足以支撑
        - from: n3
          to: n4
          label: 护城河部分支撑估值溢价
        - from: n4
          to: n5
          label: 极高倍数放大风险
        - from: n5
          to: n6
          label: 结果高度二元分化
        - from: n6
          to: n7
          label: 若无优先权益则 E[V] 为负
    approximationNotes: 流程图展现分析师的投资建议推导逻辑。实际投委会（IC）决策框架可能纳入其他加权因子。
    claimRefs:
      - CV009
