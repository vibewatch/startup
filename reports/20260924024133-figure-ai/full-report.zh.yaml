      - number: '1.3'
        title: 融资历程与资本结构
        blocks:
          - type: paragraph
            body: >
              Figure AI 经四轮一级市场融资累计筹集约 $1.9B：


              - 种子轮（2022 年）：由 Brett Adcock 个人出资 $100M，Bold Capital Partners 等参投。

              - Series A 轮（2023 年 5 月）：$70M（外加 $9M 追加轮），由 Parkway Venture Capital 领投，Intel Capital、Tamarack Global、FJ
              Labs 及 Aliya Capital 参投。

              - Series B 轮（2024 年 2 月 29 日）：融资 $675M，投后估值 $2.6B。投资方包括 Microsoft、OpenAI Startup Fund、NVIDIA、Jeff Bezos（通过
              Bezos Expeditions）、Amazon Industrial Innovation Fund、Intel Capital、Align Ventures、ARK Invest、LG Innotek 及
              Samsung Venture Investment。Figure 同期与 OpenAI 签署合作协议，共同开发面向人形机器人的下一代 AI 模型，并承诺将 Microsoft Azure 作为其 AI
              基础设施合作伙伴。

              - Series C 轮（2025 年 9 月 16 日）：规模超 $1B，投后估值 $39B——在 18 个月内相比 Series B 录得 15 倍跃升。由 Parkway Venture Capital
              领投，Brookfield Asset Management、NVIDIA、Intel Capital、Qualcomm Ventures、T-Mobile Ventures、Salesforce 及
              Macquarie Capital 参投。Figure 表示该笔资金将用于机队规模扩张、机器人训练基础设施建设以及高阶数据采集。


              Figure AI 已向未经授权开展交易的老股经纪商发出终止函；公司对老股二级市场交易保持严格控制。公司未公开披露任何债务或授信额度。
