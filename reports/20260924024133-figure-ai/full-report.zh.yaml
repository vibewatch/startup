  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入来源与商业模式
        blocks:
          - type: paragraph
            body: >
              Figure AI 当前的主要收入来源是与 BMW 位于南卡罗来纳州 Spartanburg 工厂签署的商业协议。该协议的具体条款未公开披露，但行业分析师估算 Figure AI 要么收取硬件买断费用（每台机器人
              $70K–$130K），要么按机器人即服务（RaaS）模式收取订阅费（估算约为每台机器人每年 $12,000）。假定与 BMW 的协议采用 RaaS 模式且部署规模为 100–200 台机器人，折算年收入仅为
              $1.2M–$2.4M——远低于据报道 $60M 的估算收入。要解释这一差距，实际交付机队可能更大，也可能采用“硬件销售+服务费”的混合模式。


              Sacra 估算 Figure AI 2024 年收入约为 $60M，2025 年将增至 $158M，主要由 BMW 项目贡献。单台实际收益显著高于纯 RaaS
              订阅定价；差额可能来自硬件销售、入场费、系统集成服务，或高于公开披露的机器人交付量。


              未来规划的收入构想包括：(1) RaaS 经常性订阅费、(2) 单次硬件销售、(3) AI 模型授权（Helix）、(4) 软件与 OTA 升级服务，以及 (5) 后续维保与培训服务。截至 2025 年，第 3
              至 5 项收入来源尚未被证实能贡献实质性收入。
