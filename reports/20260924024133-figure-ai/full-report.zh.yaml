      - number: '3.2'
        title: 主要竞争对手概况
        blocks:
          - type: paragraph
            body: >
              Agility Robotics（Digit）：2015 年成立于俄勒冈州 Eugene（现获 Amazon 投资）；Digit 为双足机器人，主攻仓储分拣与物流。Amazon Industrial
              Innovation Fund 的注资兼顾了资金与核心客户关系。截至 2025 年，Digit 已在 Amazon 配送中心投入使用。Digit
              在形态设计上侧重下肢机动性而非全身极致灵巧；末端执行器为结构相对简单的夹爪挂钩，不及 Figure 的多自由度关节手设计。收入情况：非公开；累计融资 >$150M。核心隐忧在于：Amazon 可能会将
              Agility 深度整合收编，而非广泛对外商业化，从而压缩 Agility 的 TAM。


              Tesla Optimus：Tesla 于 2021 年公开的人形机器人计划。截至 2025 年，Optimus Gen 2 的演示展现出更佳的灵巧性，但很大程度上仍依赖遥操作，现场自主部署极其有限。Tesla
              设定的单机成本目标为 $20K–$30K——在结构上远低于 Figure 的价格带。Tesla 的 FSD 神经网络训练数据流是一项独有的 AI 资产。得益于 Gigafactory
              超级工厂的工业基础，Tesla 的量产爬坡路径可能最快。已上市公众公司，截至 2025 年市值超过 $900B+。


              Boston Dynamics（Electric Atlas）：1992 年成立于马萨诸塞州 Waltham；自 2021 年起隶属于 Hyundai。Atlas（2024
              年推出的电动版本）在运动灵活性指标上是物理性能最强的机器人，但定位于前沿研发与特种工业用途，并非大众规模化部署。Boston Dynamics 旗下的 SpotEnterprise 与 Stretch
              已有成熟商业销售；Atlas 尚未商业化发售。


              Apptronik（Apollo）：位于德州 Austin 的初创公司，2025 年完成融资，累计融资金额达 $767M，估值达 $5B。Apollo 瞄准制造、物流与零售场景。核心合作伙伴：NASA。相较
              Figure AI，其公开部署数据较少。


              1X Technologies：挪威初创企业，累计融资 $137M。凭借目标定价 $20K 的 Neo 机器人瞄准家庭消费市场。其商业化路径明显不同于 Figure AI 聚焦工业 B2B 的打法。


              中国竞争对手（Unitree H1/G1、Fourier GR-1、UBTECH Walker X）：Unitree 的 G1 官方售价为
              $16,000–$99,000，在硬件价格上大幅击穿美国竞品底线。得益于中国政府补贴支持。虽然美国联邦政府采购对其受限，但全球商业市场依然对其开放。
            claimRefs:
