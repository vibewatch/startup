  productSummary: >
    Figure 03：身高 168cm、体重 60kg 的双足人形机器人。配备 20 自由度多指抓握灵巧手；6 摄像头双目立体与 RGB 感知系统；支持无线充电，续航 5 小时；搭载 Helix VLA
    模型，可实时理解并执行任务；支持端侧推理（无需云端往返通信）。San Jose 的 BotQ 工厂初期年产能为 12,000 台。核心能力包括：分拣、放置、零部件装配、质检、装箱，以及无需显式编程的连续多步骤任务。Figure 02
    在 Figure 03 发布后退役。BMW 计划于 2026 年夏季将部署扩展至 Leipzig 工厂。
