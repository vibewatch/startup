  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 以客户工作流视角定义产品
        blocks:
          - type: paragraph
            body: >
              Figure AI 的产品解决了一项明确的企业痛点：在无需改造现有厂房的前提下（因为人形机器人可在专为人类设计的环境中作业），替代工人在高强度、高重复性及符合工效学危害的制造环节中从事体力劳动。


              在 BMW 的 Spartanburg 工厂落地项目中，Figure
              机器人执行钣金件装配与物料转运任务：从料箱中抓取特定的车身面板零件，校准姿态，并以精准的位置与力度装载至生产夹具中。这些任务此前由工人承担，易导致重复性劳损与身体疲劳。机器人的作业工作流为：(1)
              对料箱中的零部件进行视觉感知；(2) 基于 Helix 规划抓取路径；(3) 借助 20 自由度灵巧手执行灵活操作；(4) 核验放置精度；(5) 向协同工人发出信号或流转至下一工序。


              提供给客户的价值主张包括：(a) 替代人力——机器人能够 24/7 全天候作业，不知疲倦，也无需请假；(b) 提升质量——>99% 的任务准确率消除了重复性劳动中的人为失误；(c)
              符合工效学合规——让工人远离易致伤的高危工位；(d) 商业回报——在 $12K/年的 RaaS 成本下，相较 $40K+ 的人力成本，在大批量重复任务中具备极强的回本吸引力。


              核心局限在于：Figure 03 尚未成为真正的通用机器人。作业任务必须局限在狭窄、重复且结构化良好的流程内。对于开放式、全新场景或多步骤非结构化任务，目前的商业部署系统依然无法胜任。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE005
