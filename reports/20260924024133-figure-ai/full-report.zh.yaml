      - number: '3.3'
        title: Figure AI 竞争优势与护城河
        blocks:
          - type: paragraph
            body: >
              截至 2026 年初，Figure AI 的竞争优势集中在以下维度：


              1. BMW 落地实证：业内唯一一家在财富 100 强主机厂拥有已确认、产生真实收入、工业级人形机器人部署项目的企业。运行 11 个月、覆盖 30,000+ 辆汽车、作业准确率
              >99%。这沉淀了竞品尚未能复刻的真实 AI 训练数据与商业信用。


              2. Helix VLA 模型：基于真实产线数据训练的自研全栈视觉-语言-动作模型。VLA 模型需要海量真实物理作业数据——Figure 在 BMW
              的产线部署正是一座源源不断的数据发生器。竞品必须从零构建同类数据集。


              3. 投资人生态构筑护城河：Microsoft（算力支持、Azure/AI 合作）、OpenAI（AI 模型联合研发）、NVIDIA（软硬件协同）及 Amazon（潜在未来客户）多方合力，摊薄了 Figure
              AI 的 AI 研发成本，并为其打开了大型企业客户的大门。


              4. 资金实力：累计融资 $1.9B，位居纯人形机器人初创企业之首，支撑了 BotQ 工厂建设及 700+ 人的团队扩张。


              5. 最具深度的战略合作：BMW、NVIDIA（制造自动化）以及 Microsoft Azure 的深度整合，构筑起复合型商业纽带。


              主要短板：高昂定价（单台机器人 $70K–$130K）相比 Tesla 及中国竞品受众面更窄；任务泛化能力有限（仅限受控场景下的抓取与放置）；对 Brett Adcock
              存在强烈的关键人依赖；未公开披露收入数据；BotQ 初期产能（12,000 台/年）制约了近期的扩张规模。
            claimRefs:
              - CP011
              - CP012
              - CP013
              - CP014
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP016
      - number: '3.4'
        title: 竞品定价与商业模式对比
        blocks:
          - type: paragraph
            body: >
              各竞品在人形机器人定价上存在显著差异：

              - Figure AI：估算硬件买断价为 $70K–$130K，或在 RaaS 模式下为 $12K/年（未经证实）

              - Tesla Optimus：远期目标价 $20K–$30K（尚未商业化）

              - Boston Dynamics Atlas：尚未商业化发售；商业化产品 Spot 售价 $75K

              - Agility Robotics Digit：未公开定价；据推测早期企业采购价约为 $150K–$250K

              - Unitree G1：官方指导价 $16,000–$99,000（价格门槛最低，但能力相对受限）

              - 1X Neo：目标定价 $20,000（面向消费端）


              商业模式同样各有侧重：Figure AI 主打 RaaS（经常性收入、维保服务与 OTA 升级）；Tesla 大概率会采用硬件销售叠加软件订阅的模式；中国厂商侧重硬件销售利润；Agility 则与 Amazon
              的物流仓储体系深度绑定。


              Figure AI 的 RaaS 模式一旦起量，相比单次硬件销售能带来更可预测的经常性现金流以及更高的单机 LTV。然而，这需要巨额资本来支撑机器人租赁资产池。RaaS 模式同样意味着 Figure AI
              必须承担后续维护与升级折旧风险，而纯硬件销售商早已将此类风险转移给了买方。
            claimRefs:
              - CP016
