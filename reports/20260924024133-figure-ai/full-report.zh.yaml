      - number: '4.4'
        title: 公开业务进展指标
        blocks:
          - type: paragraph
            body: >
              尽管估值高达 $39B，Figure AI 公开披露的可验证财务数据却极少。现有业务进展主要由生产运营指标体现，财务指标仍缺乏公开佐证：

              - 在为期 11 个月的部署中，Figure 机器人参与了 30,000+ 辆 BMW 汽车的生产

              - 处理了 90,000+ 个零件

              - 累计完成 1,250+ 小时作业

              - 任务准确率 >99%

              - 在特定作业中相较此前基线将效率拉升了 400%

              - 每投入 $1 产生 $1.41 回报（IIoT World 报道称该数据来自早期采用者；具体信源尚不明确）


              ARR、单机收益、GMV 或合同金额均未获官方证实。收入估算（2024 年 $60M、2025 年 $158M）完全来自第三方分析机构 Sacra。Figure AI
              未提交公开财务文件，也未公开确认任何财务指标。


              公司 Series C 轮 $39B 估值，对应 2025 年估算收入 $60M 时市销率约为 ~650x，按 $158M 计算则约为 ~250x；这处于 2025–2026
              年有记录的非上市软件或硬件公司最高估值倍数之列。
            claimRefs:
              - CI013
              - CI014
              - CI015
              - CI016
      - number: '4.5'
        title: 资金充裕度与外部融资依赖
        blocks:
          - type: paragraph
            body: >
              Figure AI 累计融资额约为 $1.9B，分布如下：

              - 种子轮：$100M（由 Brett Adcock 个人出资）

              - Series A 轮：$70M（2023 年 5 月）

              - Series B 轮：$675M 对应估值 $2.6B（2024 年 2 月）

              - Series C 轮：约 $1B+ 对应估值 $39B（2025 年 9 月）


              Series C 轮在交割时创下了人形机器人领域历史上单笔最大融资纪录。投资方包括 Microsoft、NVIDIA、OpenAI、Amazon Industrial Innovation Fund、Bezos
              Expeditions、Intel Capital、Brookfield、Parkway VC、Qualcomm、T-Mobile 以及 Salesforce。


              年度现金消耗估算：原文将员工人数写作“$700+ headcount”；此处按 700+ 名员工理解。按 AI / 机器人行业薪酬水平估算，人均总薪酬为 $200K–$300K+，仅人力成本就达
              $140M–$210M；再加上研发、工厂资本支出和硬件销货成本，当前规模下年度总消耗可能超过 $300–$500M。若年消耗为 $300M+，且 Series C 带来 $1B+ 资金，下一轮融资前的跑道约为 3
              年（2025–2028 年）。要弥补资金缺口，收入需增至 $500M+，或公司需要 IPO。


              市场对 2026–2027 年 IPO 的预期较为活跃；以 $39B+ 的估值公开发行能提供增量资本与流动性。官方尚未确认任何具体的 IPO 时间表。
            claimRefs:
              - CI013
      - number: '4.6'
        title: 核心图表
        blocks:
          - type: callout
            title: 单一客户收入集中度过高是尽调的重大障碍
            body: >-
              据估算，BMW 贡献了 Figure AI 在 2024–2025 年间 90%+ 的收入。在 $39B 的高估值下，一旦与 BMW 的合作出现任何变故——如合同重谈、BMW 预算削减或工厂改建停工——都可能抹去
              Figure AI 绝大部分确认收入。目前尚未公开证实任何第二家商业客户。
            calloutType: risk
            claimRefs:
              - CI011
              - CI012
              - CI013
          - type: callout
            title: 缺乏经证实收入数据——$39B 估值缺乏坚实财务锚点
            body: >-
              Figure AI 未公开披露任何官方收入、毛利率、烧钱速度或合同金额。所有财务估算数据均出自第三方分析机构。其 $39B 估值——对应估算收入的 250x–650x
              倍数——要求投资人在面对实际财务模型的巨大不确定性下自担风险。
            calloutType: risk
            claimRefs:
              - CI013
              - CI015
              - CI016
          - type: callout
            title: 重资本 RaaS 模式高度依赖持续外部融资
            body: >-
              在 RaaS 模式下，Figure AI 必须在资产负债表上自行承担已交付机器人的资产沉淀，同时按月收取服务费。若按年产 12,000 台、单台成本 $70K+ 测算，满产交付每年将需要 $840M+
              的机器人资产融资。因此，公司需要大额债务授信、客户预付款或新增股权融资。
            calloutType: risk
            claimRefs:
              - CI007
          - type: callout
            title: $39B 估值的 Series C 创下人形机器人单轮融资历史纪录
            body: >-
              2025 年 9 月完成的超 $1B、估值 $39B 的 Series C 轮融资，是人形机器人行业历史上规模最大的单笔融资。豪华的投资方阵容——Microsoft、OpenAI、NVIDIA、Amazon
              Industrial Innovation Fund——即便在缺乏确凿收入实证的情况下，也为该投资逻辑提供了强有力的机构背书。
            calloutType: insight
            claimRefs:
