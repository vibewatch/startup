chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 主体身份、总部与商业模式
        blocks:
          - type: paragraph
            body: >
              Figure AI（法定名称：Figure AI Inc.）于 2022 年注册成立，总部设在加州 Sunnyvale（部分资料标注为 San
              Jose），研发与制造基地均位于同一园区。公司希望将通用人形机器人投入商业运营，以缓解全球劳动力短缺，并自动化重复性强或有工效伤害风险的作业。其核心产品线——Figure 01、Figure 02 及
              Figure 03 人形机器人——将自研硬件与 Helix 视觉-语言-动作 AI 模型相结合，使机器人能够理解自然语言指令，借助机载摄像头感知周边环境，并执行灵巧的物理作业。


              Figure 的商业模式主打机器人即服务（RaaS）：客户支付经常性服务费（而非大额前期资本支出），即可在自有设施中部署 Figure 机器人。此模式降低了客户引入门槛，为 Figure
              创造了可预测的经常性收入，也便于持续向在役机队推送 OTA 软件更新。近期目标行业包括汽车制造和仓储物流；家用场景则属于长期规划。


              公司自建并运营专用机器人制造工厂 BotQ，初期规划年产能为 12,000 台，官方提出的远景目标为年产 100,000 台机器人，以满足预期的商业化需求。
