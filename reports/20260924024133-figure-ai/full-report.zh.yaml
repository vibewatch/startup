              若采纳机器人即服务（RaaS）模式，本身具备结构性留存特性：机器人一旦深度嵌入生产工序，客户替换成本极高（牵涉工艺重构、安全重新论证以及供应商切换）。但若是纯硬件销售模式，客户锁定效应明显偏弱——客户可以在租约期满后转回人工劳动力或改换竞品设备。


