      - number: '2.2'
        title: 市场规模测算——TAM、SAM、SOM
        blocks:
          - type: paragraph
            body: >
              多家分析机构给出的市场规模差异很大，统计口径、渗透节奏和“人形机器人”的定义各不相同。对近期（2024 年）全球市场的共识估值约为 USD 1.5–2.7 billion；2030 年预测从保守情景的 4
              billion 到激进情景的 48 billion 不等。估值同时涵盖硬件、服务和软件收入。


              Figure AI 近期可触达的 SAM，是 Figure 03 与 Helix AI 能覆盖的汽车制造、综合物流与仓储、电子装配市场。按劳动力支出和机器人试点 ROI 测算，2025–2030 年全球规模约为
              5–15 billion 美元。另一种自下而上的算法，以全球 50 million 个“危险、脏乱或枯燥”的制造岗位、每个岗位每年隐含机器人价值 $30–50K 估算，远期 SAM 可超过
              $1T；但这只是推测，渗透速度仍有极大不确定性。


              未来 3–5 年，Figure AI 的 SOM 会受 BotQ 每年 12,000 台的产能和销售周期制约。若均价为 $130K/台（或 RaaS 年费 $12K），且年产 12,000
              台全部部署，年收入上限约为 $144M–$1.56B，具体取决于商业模式。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
