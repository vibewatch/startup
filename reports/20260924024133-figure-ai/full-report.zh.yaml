      - number: '8.2'
        title: 估值背景与入场纪律
        blocks:
          - type: paragraph
            body: >
              C 轮融资细节：Figure AI 于 2025 年 9 月完成了约 $1B+ 的巨额融资，投后估值跃升至 $39B。该轮融资紧随 2024 年 2 月完成的 B 轮（以 $2.6B 估值募集
              $675M）之后——在短短约 18 个月内估值暴涨 15 倍。暴涨的核心催化在于 BMW 产线部署验证了商业化落地的可行性，同时 Helix VLA 展现了多模态 AI
              驱动的自主泛化潜力。累计融资金额：历经创始团队自筹的种子轮（$100M）、A 轮（2023 年 5 月 $70M）、B 轮（2024 年 2 月 $675M）以及 C 轮（2025 年 9 月
              $1B+），累计融资金额达约 $1.9B。


              估值对标背景：$39B 的体量使 Figure AI 跃居全球身价最高的人形机器人初创独角兽，一举超越了 Boston Dynamics（2021 年被现代汽车以 $1.1B 收购）和 Agility
              Robotics（累计融资 $400M+）的隐含估值。这一体量已与自动驾驶领头羊 Waymo 的隐含企业价值（基于募集 $5.5B 推算对应约 $45B）大致相当。在短短 18 个月内从 B 轮到 C 轮飙升
              15 倍的估值跃迁极其罕见，这很大程度上反映出资本市场对宏大 AI 叙事与战略期权价值的情绪溢价，而非源自基本面财务指标的健康重估。


              入场投资纪律：后期成长型投资机构若在 $39B 的超高估值价位进场，哪怕仅追求 IPO 退出时取得 1 倍基础回报（假设按 20 倍市销率倍数退出），倒推要求公司年营收跨越 $2B+ 大关——营收需从 2025
              年预计规模增长约 15 倍。即便给予硬件公司 IPO 阶段较为罕见的 30 倍市销率高估值，实现保本也需完成 $1.3B 的年营收支撑。上述两套测算模型均要求在 2028 年前成功完成客户破局，将客户群从单一的
              BMW 扩展至 10 家以上的大型企业客户。若追求 3 倍投资回报，对应退出时 $117B 的超级市值体量，要么需要按 23 倍市销率实现 $5B 年营收，要么按 29 倍市销率实现 $4B
              年营收——这无疑构成了极其苛刻的业绩考核门槛。高度非对称的风险回报收益特征表明，这实质上是一场输赢分明的二元押注，而非稳健的传统成长期成长投资。


              优先条款结构诉求：若决定在此阶段注资，鉴于二元对立的退出分布，必须在法律合同中极力争取到具有实质防御力的下行兜底条款（涵盖清算优先权、按比例认购增发权、全额知情权与防稀释条款）。
            claimRefs:
              - CV007
