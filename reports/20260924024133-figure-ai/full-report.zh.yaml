      - number: '1.2'
        title: 创始团队与领导层
        blocks:
          - type: paragraph
            body: >
              Figure AI 由 Brett Adcock 创立并由其担任创始人兼 CEO。Adcock 是一名连续创业者：此前曾联合创办 AI 招聘平台 Vettery，2018 年据报道由 Adecco Group
              以约 $100M 收购；后联合创办电动垂直起降（eVTOL）飞行器公司 Archer Aviation，该公司于 2021 年借 SPAC 壳上市（NYSE: ACHR）。2022 年，Adcock 个人全额出资
              $100M 种子轮资金启动了 Figure AI。


              CTO Jerry Pratt 是机器人领域的资深专家，此前就职于人机认知研究所（IHMC），从事双足机器人移动运动学研究，并曾联合创办 Boardwalk Robotics。工程与产品团队汇集了来自
              Boston Dynamics、Tesla、Google DeepMind 以及 Apple 的资深人才，反映出从顶尖机器人与 AI 机构招揽核心骨干的明确策略。


              管理团队还包括增长副总裁 Lee Randaccio、业务运营副总裁 Logan Berkowitz，以及机器人系统与运营总监 Mathew DeDonato（前 Woven Planet
              Holdings）。截至 2026 年初，Figure AI 的高管团队约有 9 位核心负责人，分管工程、AI、商业运营、质量保证与生产制造。


              关键人风险突出：Brett Adcock 的战略视野、创始人声望及投资人关系，是公司融资与商业合作的核心支柱。除 Adcock 与投资方代表外，董事会的具体构成尚未公开详细披露。
