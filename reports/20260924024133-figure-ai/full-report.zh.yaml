      - number: '2.3'
        title: 买方画像与客群细分
        blocks:
          - type: paragraph
            body: >
              Figure AI 的核心买方是面临长期劳动力短缺、高负荷重复性劳动痛点，且具备相应资本预算来消化自动化改造成本的大型工业企业。关键客户群体包括：


              1. 汽车主机厂（OEM）与一级供应商（Tier-1）（BMW 为首家客户；同类企业包括
              Mercedes-Benz、Toyota、Volkswagen、Hyundai）：重复作业多、工效伤害压力大，已有证据显示其愿为自动化付费，同时还面临严格的工人安全监管。预算通常由生产运营副总裁或工厂厂长掌握。采购周期长达
              12–36 个月。


              2. 仓储/物流运营商（Amazon、DHL、FedEx、Flexe）：人员流动率极高（每年 100%+），分拣与放置任务重复繁重，已有证据表明其能接受自动化项目的 ROI。Amazon 借助其
              Industrial Innovation Fund 参投，释放出未来有望转化为商业客户的信号。


              3. 电子装配（Foxconn、鸿海、各类代工厂）：精细操作需求与 Figure 03 的 16–20 自由度灵巧手设计相匹配。面临来自东南亚竞争带来的劳动力成本压力。


              4. 更长期的客群（5–10 年）：家庭消费端（养老护理、个人助理）、医疗机构、零售/酒店住宿。Grand View Research 估算，按应用领域划分，个人助理与照护在 2024 年人形机器人市场中占比达
              31.6%。


              各领域买方的共同决策考量包括：相比人工劳动的总拥有成本（TCO）、设备可靠性与正常运行时间、安全认证资质、任务自适应能力，以及供应商自身的财务稳健性。
            claimRefs:
              - CM009
