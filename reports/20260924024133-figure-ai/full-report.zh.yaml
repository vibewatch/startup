  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >
              正向投资逻辑：Figure AI 是全球首家在工业制造场景实现通用人形机器人规模化商业落地的先行者——并由行业巨头 BMW
              完成了概念验证（PoC）。人形机器人市场尚处起步阶段，但结构性潜在体量极为广阔（根据高盛与 IDC 估算，2030–2034 年间总可用市场 TAM 预计达 $38–165B）。Figure AI 研发的
              Helix VLA 模型构成了真正意义上的 AI 护城河——这款视觉-语言-动作多模态大模型基于真实的工业作业数据训练而成，竞品缺乏等量的一线实操经验，极难在短时间内予以复现。伴随着 BMW 推进 Leipzig
              工厂扩建、Microsoft、NVIDIA 与 OpenAI 注入深度战略资源，加上 700+ 名员工协同攻坚单台年服务费 $100,000+ 级别的工业机器人商业化闭环，若能在拓展非 BMW
              客户上取得突破，预计公司在 2028 年前有望走出一条迈向 $1B+ 营收的可行路径。对应这一收入体量，按 30–40 倍市销率估算对应企业价值在 $30–40B
              之间，与当前入场估值大致相当——这也意味着当前估值很大程度上已把执行风险充分计入资产定价。若要获取 5–7 倍的超额上行收益，则要求在 $165B 的庞大蓝海中夺下 5–10%
              的市场份额；只要该软硬件平台能成功实现跨行业通用泛化，这一目标并非遥不可及。


              反向投资逻辑：高达 $39B 的估值倍数对应当前预计收入的 250 倍至 650
              倍——这通常是拥有网络效应和边际成本近乎为零的软件巨头才能享有的超高溢价，绝非高资本开支、单台销货成本（COGS）沉重的硬件制造实体所应匹配的估值模型。Figure AI
              目前仅有一家正式确认的标杆客户（BMW），尚未公布第二家正式客户，未曾披露平均故障间隔时间（MTBF）及产品良品率等核心质控指标，还要直面公布了单台成本 <$20,000 激进目标的 Tesla Optimus
              带来的颠覆性竞争挤压。此外，欧盟《人工智能法案》与 OSHA 面临的监管空白为即将落地的 Leipzig 项目带来了合规隐患。Brett Adcock 一旦离职，将严重冲击投资人信心。在 BMW 收入占比超
              90% 的现状下，押注 Figure AI 无异于将 $39B 巨资豪赌在单一商业关系之上。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
