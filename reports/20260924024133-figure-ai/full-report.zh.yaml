            body: >-
              在 Figure AI 的任何部署现场，一旦发生由机器人导致的严重人身工伤事故，将立刻招致 OSHA 现场立案调查、BMW
              全面暂停相关作业线、品牌公信力雪崩以及企业客户商务停摆。尽管目前发生概率相对偏低，但这属于冲击烈度最致命的尾部风险。
