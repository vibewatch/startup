      - number: '7.3'
        title: 运营、技术与网络安全风险
        blocks:
          - type: paragraph
            body: >
              Figure AI 的核心技术瓶颈在于任务泛化能力：Helix VLA 模型目前仅在 BMW Spartanburg 工厂特定的钣金件搬运任务中通过了 11
              个月的试点验证。该模型向多样化非结构化环境的泛化拓展能力在商业规模上未经证实。针对 BMW
              的实际部署，官方没有公开披露过任何关于机器人的平均故障间隔时间（MTBF）、现场故障率或保修准备金计提数据——这是极为关键的尽调盲区。美国国家标准与技术研究院（NIST）的机器人制造路线图将质量管控列为规模化制造的主要瓶颈；Figure
              AI 必须为其年产 12,000 台的 BotQ 工厂建立等同于 ISO 9001 水准的质量管理体系。供应链维度的脆弱性同样显著：位于加州 Sunnyvale 的 BotQ 是唯一的组装工厂。包括 NVIDIA
              计算模组、高精度伺服执行器与光学传感器在内的核心元器件高度依赖偏紧的全球供应链。美中半导体出口管制进一步左右了尖端算力芯片的供应保障。网络安全风险具有系统性特征：联网的人形机器人构成工控系统级（ICS）的高危攻击面（符合美国
              CISA 的界定）。目前没有公开披露任何有关 Figure AI 的 ISO 27001 认证进展或第三方渗透测试报告。在紧俏的顶尖技术人才市场中，留存核心工程人才面临着来自 OpenAI、Google
              DeepMind、Tesla 和 Meta FAIR 的激烈抢夺。
            claimRefs:
              - CR009
          - type: table
            tableRef: TR003
            claimRefs:
              - CR009
      - number: '7.4'
        title: 伙伴、依存度、财务与竞争风险
        blocks:
          - type: paragraph
            body: >
              分析师普遍预测，BMW 贡献了 Figure AI 2025 年预计总收入的 85–95%。BMW 尚未向公众承诺签署具有多年期固定采购量的机器人商业长约——此前 Spartanburg
              工厂的部署实为基于绩效考核的试点性质。Leipzig 工厂的推进意味着在客户多元化破局之前，单一大客户集中度将进一步拔高。Tesla 官方公布了在 2026 年底前将 Optimus 单台生产成本压缩至
              $20,000 以下的目标，相比之下 Figure AI 的单台预估成本在 $100,000–200,000 之间。即使 Tesla 仅达到其成本压缩目标的 50%，其超级工厂的规模化制造红利也能击穿
              Figure AI 的大客户定价体系。中国本土竞品如宇树科技（Unitree，G1 标价
              $16,000）、优必选（UBTECH）、智元机器人（AgiBot）以及傅利叶智能（Fourier）等，早已将产品定价下探至 $16,000–$50,000 价格带。Figure AI 高达 $39B
              的估值对应着 250 倍至 650 倍的市销率，这必须仰赖目前尚未兑现的业绩爆发式增长。Sacra Research 估算其 2025 年的年度运营开支约为 $250–400M，意味着在已募集的 $1.9B
              资金储备下，现金跑道仍可持续 3–5 年——短期弹药充裕，但中长期彻底系于 2028 年前收入规模能否大幅放量。此外，BMW Leipzig 工厂的扩建势必消耗大额资本，但其出资构成尚未对外披露。
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
