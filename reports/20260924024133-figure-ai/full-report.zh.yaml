              Unitree 的 G1 标价仅为 $16K–$99K——比 Figure AI 的估算价格区间最高便宜 8
              倍。中国政府的补贴支持促成了持久的低价策略。尽管美国出口管制可能会限制其在部分政务场景的使用，但中国厂商依然能在全球商业客户市场自由展开竞争，从而制约 Figure AI 在海外市场的定价权。
