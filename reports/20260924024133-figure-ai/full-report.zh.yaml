      - number: '8.3'
        title: 乐观、基准与悲观情景测算
        blocks:
          - type: paragraph
            body: >
              乐观情景（概率约 20%）：Figure AI 在 2030 年前确立全球工业人形机器人领域的主导平台地位。核心假设包括：(1) 依托 BMW 的成功标杆案例，在 2027 年前新增签约 5 家以上财富 500
              强级别的汽车整车厂及物流行业巨头；(2) Helix VLA 模型在跨行业作业场景中成功实现通用泛化；(3) BotQ 智能制造工厂在 2029 年前达成每年 50,000 台的量产交付爬坡；(4) Tesla
              Optimus 无法如期达成其单台成本控制目标；(5) Figure AI 在规模达 $165B 的潜在市场总额（TAM）中抢占 5–10% 市场份额，对应 2033 年实现 $8–16B 年营收。若按
              10–15 倍市销率给予估值，对应企业估值将达 $80–240B。若在 2028–2029 年以 $100B+ 估值实施 IPO，对应 $39B 入场成本的回报倍数为 2.5 倍——在乐观情景下回报依然偏温和。以
              $2.6B 估值进入的 B 轮早期风险投资人，其投资回报可达 30–50 倍。


              基准情景（概率约 40%）：Figure AI 保持平稳的大客户业务拓展节奏，在 2028 年前新增签约 3–5 家支柱标杆企业，至 2029 年年收入达到 $500M–$1B 规模。核心假设包括：(1) BMW
              持续保持合作并顺利兑现 Leipzig 工厂的扩产交付；(2) 2027 年前公布新增签约 2–3 家汽车或泛物流行业大客户；(3) BotQ 工厂年产能稳步爬坡至 20,000 台；(4)
              未发生灾难性的人机工伤安全事故；(5) Tesla Optimus 落地遭遇拖延但最终仍形成实质竞争。退出估值预测（按 2028–2030 年完成 IPO 退出）：对应 20–30 倍市销率推算企业估值在
              $15–30B 之间。这相当于较 $39B 的 C 轮入场估值缩水 25–60%。C 轮投资人的整体收益预期将落在负收益至勉强保本之间；B 轮投资人的投资收益仍可达 6–12
              倍。在缺乏优惠优先条款的前提下，当前的基准情景显然无法支撑在 $39B 价位盲目参投 C 轮。


              悲观情景（概率约 40%）：公司始终难以摆脱过度依赖单一客户 BMW 的困境；Tesla 在 2027 年前成功达成了成本持平；未能在 BMW 之外敲定任何新的正式客户。核心假设包括：(1) 出于 Tesla
              Optimus 的竞品诱惑或成本控制压力，BMW 削减了 Figure 机器人的部署规模；(2) Figure AI 年营业收入在 $200–400M 附近陷入增长停滞；(3) 必须以 $8–12B
              的降估值（down-round）形式被迫开展 D 轮求生融资。此时 C 轮投资人将承受高达 -70% 至 -80% 的本金亏损。鉴于大客户二元对立的集中度风险，此情景发生的可能性不容忽视。
            claimRefs:
              - CV013
              - CV014
              - CV015
              - CV016
