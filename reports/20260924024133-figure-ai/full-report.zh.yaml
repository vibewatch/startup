      - number: '4.2'
        title: 单机经济模型与成本结构
        blocks:
          - type: paragraph
            body: >
              人形机器人的单机经济模型仍处于早期且成本高企的阶段。Figure 02/03 的硬件制造成本未公开披露，但行业分析师估算，像 Figure 03 这样零部件复杂度极高（20 自由度灵巧手、6
              个摄像头、定制执行器、先进端侧 AI 推理芯片）的机器人，在当前生产规模下每台制造成本介于 $40,000–$80,000 之间——在 $70K–$130K 的估算售价下，毛利率极其微薄甚至为负。


              成本结构细分（估算）：

              - 研发支出：最主要的成本项（占比 70%+）；拥有 700+ 名员工，包括机器人工程师、AI 研究员与机械设计师。AI/机器人领域的平均总年薪达 $200K–$300K+。

              - 生产制造销货成本（COGS）：机器人硬件材料费；涵盖 NVIDIA 芯片、定制执行器、摄像头、传感器与电池系统。

              - BotQ 工厂资本开支：为达成 12,000 台/年目标产能而投入的厂房建设与产线工装设备。

              - 管理与销售费用（G&A）：大客户销售、法务与财务。企业销售周期长达 12–36 个月。


              跑通正向单机经济模型的路径取决于：(1) 依托规模化生产压低 COGS（放量后单台目标成本降至 $30K 以下）；(2) 将 Helix AI 软件授权打造为高毛利收入层；(3)
              扩充在役机队规模，以更多交付体量摊薄固定的研发开销。
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
          - type: table
            tableRef: TI002
            claimRefs:
              - CI001
              - CI002
              - CI004
      - number: '4.3'
        title: 定价与商业化落地经济性
        blocks:
          - type: paragraph
            body: >
              Figure AI 的市场拓展策略是直接向大型制造企业与物流运营商开展大客户直销。该模式客单价极高，但销售周期极长（12–36
              个月），且获客成本（CAC）昂贵（需配备资深大客户销售团队并经历漫长的试点验证期）。              传统的 SaaS
              CAC/回本周期指标无法直接套用，但在重资产设备领域，其等效成本在于试点开销加上部署落地期间承担的系统集成负荷。


              据报道，BMW 在正式商业部署前开展了为期 11 个月的试点——足见早期客户从初次接触到正式交付的周期长达 12+ 个月。随着 Figure AI
              走向成熟，得益于成熟的标杆客户示范效应与标准化的集成交付协议，这一周期有望缩短。


              定价议价权：企业买方拥有多元备选项（Agility Digit、未来的 Tesla Optimus、传统协作机器人自动化），这制约了 Figure AI 的定价空间。若采纳 RaaS
              模式，虽能带来稳定的年金化收入，但要求 Figure AI 在资产负债表上自行沉淀大量机器人资产；硬件直接买断虽可将资本开支转嫁给客户，却可能压低客户终身价值（LTV）。


              客户集中度风险：据推测，BMW 贡献了其 2024–2025 年约 90%+ 的收入。估值高达 $39B 的初创企业背负如此结构，单一客户集中度风险极高。
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
