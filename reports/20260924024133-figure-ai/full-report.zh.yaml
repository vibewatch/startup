      - number: '1.4'
        title: 规模指标与业务版图
        blocks:
          - type: paragraph
            body: >
              Figure AI 在 2024 年底约有 163 名员工，到 2026 年初已增至 700 多人——同比增长 127%——反映出其在机器人工程、AI 研发、生产制造及商业部署团队上的快速扩张。据报道，公司
              2024 年收入约为 $60M；基于第三方机构估算，2025 年收入约为 $158M；公司未公开披露经审计的财务数据。


              Figure AI 的首个主要商业部署在 BMW Group 位于南卡罗来纳州的 Spartanburg 工厂：Figure 02 机器人执行钣金上料任务，11 个月累计运行 1,250+ 小时、上料
              90,000+ 个零部件，并参与生产 30,000+ 辆 BMW X3。这是现代汽车制造业首个大规模、真实场景的人形机器人商业部署。


              Figure AI 在加州运营着一处核心基地，整合了公司总部、研发实验室与 BotQ 生产线。公司尚未正式宣布国际扩张计划，但 BMW 正在评估向更多工厂扩大部署的可行性，包括德国 Leipzig 工厂。
            claimRefs:
              - CO007
      - number: '1.5'
        title: 关键里程碑与最新动向
        blocks:
          - type: paragraph
            body: >
              Figure AI 从成立到大规模商业化部署历时不到三年，堪称人形机器人历史上扩张速度最快的企业之一。关键里程碑包括：2022 年成立并由创始人全额出资种子轮；2023 年完成 Series A
              轮引入机构资本；2024 年 2 月完成 Series B 轮，同时与 OpenAI 达成合作并与 BMW 签署商业协议；2024 年 9 月 BMW 官方宣布在生产线部署 Figure 02；以及 2025 年
              11 月公布 BMW 为期 11 个月的部署成果。


              2025 年 9 月，Figure 宣布完成 $39B 估值的 Series C 轮融资，同时开始将机队从 Figure 02 切换至 Figure 03。Figure 03 吸收了 BMW
              产线部署的实战经验——尤其是对前臂及手腕电气架构的重新设计——并配备了无线感应充电系统、带织物软外皮的 16 自由度灵巧手，以及下一代 Helix 2 模型。


              负面争议事件：Figure AI 曾因自主能力落地时间线承诺过高而招致批评；多方评测指出，其在 BMW 的作业任务被严格限定在可预测的抓取与放置流程，并非真正的通用自主作业。TechCrunch 于 2025 年
              4 月报道称，Figure 正向未经授权的老股经纪商发出终止函，显示出公司对股权流动性与估值管控的高度敏感。
            claimRefs:
              - CO007
