companyProfile:
  summary: >
    Figure AI 是一家通用人形机器人私营企业，由连续创业者 Brett Adcock 于 2022 年在加州 Sunnyvale
    创立。公司要打造能承担人类工人现有各类灵巧体力劳动的通用双足机器人，先从工业制造切入，再拓展至物流、仓储，最终进入消费市场。Figure 的旗舰产品（Figure 02 与 Figure 03）为人形机器人，配备 20
    自由度灵巧手与 6 摄像头感知系统，搭载自研 Helix 视觉-语言-动作（VLA）模型；该模型基于 BMW 工厂 11+ 个月的真实生产数据训练而成。截至本报告运行日，BMW 位于 Spartanburg
    的制造工厂是其唯一得到证实的商业客户，Figure 机器人已在此协助 30,000+ 辆汽车组装了 90,000+ 个零部件，任务准确率超过 99%。公司在 San Jose 运营自建的 BotQ 机器人制造工厂，初期年产能规划为
    12,000 台，长期愿景目标为 100,000 台/年。核心投资方包括 Microsoft、OpenAI、NVIDIA、Amazon Industrial Innovation Fund、Jeff Bezos、Intel
    Capital、Parkway VC、Qualcomm、T-Mobile、Salesforce Ventures 以及 Brookfield Asset Management。
  foundedDate: '2022-01-01'
  founders:
