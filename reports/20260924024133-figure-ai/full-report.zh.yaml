      - number: '7.5'
        title: 团队、执行力、缓释策略与投资逻辑破裂触发点
        blocks:
          - type: paragraph
            body: >
              关键人物风险突出：Brett Adcock 深度掌控企业文化构建、投资人关系协调与产品前沿构想；目前尚未指派或对外宣布法定接班人或副总裁级联席领导人。多达 13 家战略投资方（涵盖
              Microsoft、OpenAI、NVIDIA、Amazon、Qualcomm、Intel、T-Mobile、Salesforce
              等）在诉求上存在分歧隐患，带来了公司治理冲突风险。现有的核心风险缓释要素包括：BMW 的背书与成功验证为应对监管审核和奠定市场声誉提供了压舱石；$1.9B
              的累计融资额构筑了充裕的近端资金缓冲；战略投资人生态网络筑牢了技术协同与分销渠道屏障；BotQ 工厂垂直整合总装环节降低了单一部件组装代工的外部依赖。需尽快弥补的治理盲区包括：推进
              OSHA“自愿保护计划”（VPP）认证资格、拿下 ISO 27001 信息安全认证，以及在 Leipzig 产线投运前完成欧盟《人工智能法案》合格评定。在 2027 年前至少开拓 2
              家以上支柱级标杆企业客户——这是考验管理层执行力最核心的里程碑。五项投资逻辑破裂触发条件：(1) 任一实际部署厂区发生严重的机器人伤人责任事故；(2) BMW 决定终止商业协议或大幅度砍掉机器人机队采购；(3)
              Tesla Optimus 在 2027 年前实现单台低于 $30,000 的工业级成本；(4) 各国强制推行 Figure AI 无法达标的人形机器人安全新规；(5) Brett Adcock
              突然离职且无明确继任者接盘。投委会核心尽调问题清单：(1) 经审计的按客户拆分收入构成；(2) 机器人的 MTBF 与现场运维故障明细；(3) OSHA 生产安全规程备案文件；(4) BotQ
              产线的整机良品率与制造成本；(5) 欧盟《人工智能法案》合规评定推进时间表；(6) 股权结构表及核心治理投票权分配明细。
            claimRefs:
              - CR009
