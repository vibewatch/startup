      - number: '8.4'
        title: 可比公司估值对标
        blocks:
          - type: paragraph
            body: >
              公开市场工业机器人与自动化对标标的：ABB Ltd（市值约 $30B，对应约 2.5 倍市销率）与 FANUC 发那科（市值约 $17B，对应约 3 倍市销率）是工业自动化领域经典的公开对标龙头。Rockwell
              Automation 罗克韦尔自动化（市值 $11B，约 3 倍市销率）以及 Teradyne 泰瑞达（市值 $5B，约 4 倍市销率，包含部分 Boston Dynamics
              资产折算）代表了该估值梯队的下限。按 2024 年预计的年化收入运行率（约 $60M）测算，Figure AI $39B 的天价估值对应市销率高达 650 倍——而二级市场工业可比公司的估值区间仅为 2.5–4
              倍。唯有将 Figure AI 锚定为一家正在成长为行业统治者的顶尖 AI 软件公司（常规交易倍数在 20–40 倍 ARR 之间），其巨大估值落差才勉强具备理论合理性。这就要求投资人必须坚信 Figure AI
              未来的收入爆发曲线将复刻超大规模 AI 软件服务商的轨迹，而非被传统的机器人硬件制造商规律所束缚。


              一级市场私募对标标的：Waymo 对应约 $45B 的隐含估值（基于累计融资 $5.5B）在业务构架上与其最为相近——同样以 AI 驱动解决物理世界的自主运行难题、面临早期单一客户集中度过高（主要依赖 Waymo
              One）的运营现状，并兼具长远的平台对外授权潜力。Boston Dynamics 于 2021 年以 $1.1B 的对价易手；即便假设其在过去 3 年间实现了 10 倍的超高速增长，推算当前对标估值也仅在
              $11B 左右——依然远逊于 Figure AI 的 $39B。Agility Robotics 在较低的隐含估值下累计融资 $400M+；其背靠 Amazon 的生态协作模式在业务构架上与 Figure AI
              和 BMW 的合作羁绊极其相似。


              基于里程碑解锁的估值模型：基于风险投资里程碑模型的推演路径包括：(1) BMW Leipzig 工厂落地投产成功 → 支撑 $45B 隐含估值；(2) 首度敲定 BMW 以外的第二家支柱标杆企业 → 支撑
              $60B 估值；(3) 年经常性收入（ARR）达到 $500M → 按 20 倍成长性乘数推算支撑 $80B 估值；(4) IPO 上市阶段 → 若二级市场严格将其作为硬件企业给予 15–25
              倍市销率，则估值倍数面临收缩至 $25–40B 的风险。该推演明确揭示出：在营收规模尚未得到实质性证明之前，相较于当前 $39B 的入场基线，资产本身潜藏着较大的估值下修风险。


              并购潜在溢价空间：潜在战略收购方包括 Microsoft（为 Azure 云端生态配套前沿实体 AI 机器人）、NVIDIA（算力硬件底座与端侧推理融合）、丰田/BMW（主机厂推进前向垂直整合）或
              Amazon（仓储物流全自动化）。若要在 $39B 估值底座之上给出合理的战略溢价，要求收购方能捕捉到极具颠覆性的业务协同价值。若由 Microsoft 出资 $39B+ 收购 Figure AI，将刷新 AI
              产业有史以来最高并购金额纪录；理论上具备商业想象空间，但极度依赖超常的战略决心。
            claimRefs:
              - CV010
      - number: '8.5'
        title: 退出就绪度、终审尽调清单与投资逻辑破裂触发点
        blocks:
          - type: paragraph
            body: >
              退出路径与时间表规划：IPO 是最可能的主要退出渠道，目前的基准目标是在达成客户收入多元化里程碑的前提下于 2027–2028 年挂牌上市。在此之前，Figure AI 必须向市场展示：(1) 经审计的 GAAP
              口径下超过 $500M 且多客户可验证的营业收入；(2) 转正的综合毛利率（硬件毛利率目标 >20%）；(3) 清晰可见的经营杠杆释放路径。若无法如期完成上述里程碑，IPO
              承销银团将严格按传统硬件设备商倍数（15–25 倍市销率）而非 AI 平台型企业倍数（30–50 倍）为其发行定价，导致最终退出市值遭遇大幅腰斩。被行业巨头战略收购可作为第二备选退出方案——尤其在二级市场 IPO
              窗口收紧或自身拓客受挫时，被收购的可能性更大。


              呈报投资决策委员会（IC）的终审尽职调查清单：(1) 经正规审计的按客户拆分收入构成与详细合同计费架构；(2) 来自 BMW 产线的机器人 MTBF 实际故障统计与维保准备金留存凭据；(3) BMW
              之外已签署意向书（LOI）或商业合同的在途客户储备管线；(4) 欧盟《人工智能法案》合规评定执行时间表；(5) C 轮增资后的完整股权结构表（包含清算优先权偿付顺位与清算分配条款）；(6) BotQ
              产线的整机良率数据与单台制造完全成本拆解。


              投资逻辑破裂触发条件（承接第 7 章）：发生严重的人机安全生产事故；BMW 全面撤资或终止合作；Tesla Optimus 压低至 <$30K 工业级售价；Brett Adcock
              关键创始人离职。若在客户多元化（即至少签下 2 家非 BMW 支柱客户）之前触发任何一项，投资逻辑便不再成立，投资人应抓住任何可行的流动性窗口撤出。


              投委会最终评定建议：谨慎观察（CAUTIOUS WATCH）。在没有争取到实质性优惠条款与下行风险兜底保障（包括 1 倍以上清算优先权、按比例认购增发权等）的前提下，切勿在 $39B
              的超高估值价位盲目跟投。对于深耕该领域、投资周期为 5–8 年且看好人形机器人的垂直专项基金，只有在落实有力的下行保护条款、并且核心尽调问题得到肯定答复后，以 $39B
              入场才说得通。在没有保护性条款时，基准情景不足以让 C 轮投资人收回本金。
            claimRefs:
              - CV010
      - number: '8.6'
        title: 展品展示
        blocks:
          - type: callout
            title: 投资评级建议：谨慎观察（CAUTIOUS WATCH）
            body: >-
              在高达 $39B 的估值下，Figure AI 的定价几乎苛求完美执行：250–650
              倍高额市销率、严重依赖单一客户、缺乏经审计的公开财务凭据，并且面临二元对立的风险回报结局。该标的仅适合那些能够拿下优惠防御条款（1 倍以上清算优先权）、拥有 5–8
              年长久期耐心资本并具备深厚机器人产业认知的专项基金介入。并不契合普通成长型通用投资基金。
            calloutType: insight
            claimRefs:
              - CV001
              - CV015
          - type: callout
            title: 乐观情景兑现的前提是 2027 年前打破单一客户依赖
            body: >-
              实现乐观情景预测（基于 $39B 入场估值获得 3 倍以上回报）的必要前提，是在 2027 年前至少正式签下 3 家以上非 BMW 的大型企业客户，并在 2029 年前将营收运行率推升至 $1B 规模。若截至
              2027 年 BMW 仍是唯一的采购客户，在缺乏清算防御条款保障的情况下，基准情景测算将直接导致 C 轮投资人本金遭受亏损。
            calloutType: insight
            claimRefs:
              - CV013
              - CV016
