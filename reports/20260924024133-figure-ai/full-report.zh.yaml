  - id: FR001
    title: 风险热力图——发生概率与影响程度评分
    type: matrix
    summary: |
      以矩阵形式展现 Figure AI 10 项重大风险的三维评分（发生概率 1–5、影响程度 1–5、缓解成熟度 1–5）。得分越高代表担忧越甚；综合敞口以 BMW 客户集中度与工作场所安全居首。
    data:
      columns:
        - 发生概率（1–5）
        - 影响程度（1–5）
        - 缓解成熟度（1–5）
      rows:
        - label: 工作场所安全事故
          values:
            - 2
            - 5
            - 2
        - label: BMW 客户流失
          values:
            - 2
            - 5
            - 1
