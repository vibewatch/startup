  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险概览与严重程度排序
        blocks:
          - type: paragraph
            body: >
              Figure AI 的风险特征由三大基本面客观现实决定：在安全要求极高的工业生产环境中部署实体物理 AI 系统；尚未破除客户集中瓶颈，约 85–95% 收入依赖单一客户（BMW）；背负着 $39B
              的高昂估值，要求后续兑现市场尚未证实的庞大营收。本章按净风险敞口（经既有缓释措施对冲后的发生概率与冲击烈度乘积）对关键风险排序，评估风险缓释成熟度，梳理投资逻辑破裂触发点，并列出投资人需开展的尽职调查清单。各项风险划分为四大类别：合规与法律、运营与技术、伙伴与依存度，以及人员与执行。净敞口最大的三项核心风险是：(1)
              BMW 客户流失或采购缩减（冲击烈度 5，发生概率 2，净风险值 10）；(2) 厂区作业安全工伤事故（冲击烈度 5，发生概率 2，净风险值 10）；(3) Tesla Optimus 实现成本对齐（冲击烈度
              4，发生概率 3，净风险值 12）。来自中国厂商的低价竞争是概率最高的风险（发生概率 5），但考虑到现有工业级品质与软件壁垒，其对近端业务的直接冲击评定为中等（3）。
