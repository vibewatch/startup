  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与研究范畴
        blocks:
          - type: paragraph
            body: >
              人形机器人市场涵盖双足、人体形态机器人的设计、制造与部署，这类机器人能够在专为人类打造的环境中执行各类物理作业。Figure AI 专注于该领域内的“具身物理 AI（physical
              AI）”——将先进感知、大语言模型与灵巧操作融为一体，无需针对具体任务重新编程即可执行开放式作业。


              该市场与传统工业机器人（固定机械臂、SCARA、并联机器人）截然不同，人形机器人无需改造工厂即可在非结构化环境中与人类协同作业。相邻市场包括：(1) 协作机器人（cobots）、(2)
              自主移动机器人（AMR）、(3) 工业外骨骼，以及 (4) 内嵌 AI 的工业自动化软件。这些相邻领域既是竞争对手，也是互补的预算资金池。


              Figure AI 近期要争取的预算，主要来自大型制造商和物流企业的设备采购与自动化服务支出；零售、酒店业则是后续机会。家庭消费电子与养老护理服务属于更长期的市场。下文聚焦近期可触达的商业工业市场。
            claimRefs:
              - CM001
              - CM002
              - CM003
