      - number: '2.4'
        title: 增长驱动因素与商业化阻力
        blocks:
          - type: paragraph
            body: >
              核心增长驱动因素包括：(1) 全球制造与物流业的劳动力短缺：截至 2025 年，仅美国就有约 500,000 个制造业岗位空缺，而日本、德国与中国的人口老龄化加剧了结构性用工缺口。(2)
              核心制造区域用工成本上涨，拉高了部署机器人的投入产出比（ROI）。(3) 机器人 AI 实力突飞猛进（视觉-语言-动作模型、基础模型），大幅削减了针对特定任务的编程开销。(4) 商业 ROI
              得到实际验证：Figure AI 在 BMW 的落地（特定任务效率提升 400%、准确率 >99%）提供了首个规模化实证。(5) 战略投资方生态赋能：Microsoft、NVIDIA 与 OpenAI
              联手压低了算力成本与 AI 模型研发负担。


              主要落地障碍包括：(1) 单机成本高（每台 $70K–$130K，协作机器人为 $30K–$50K），早期客户因此局限于资金充裕的企业。(2)
              任务泛化能力受限：当前部署严格局限在可预测的抓取与放置流程，无法应对开放式自主作业。(3) 安全认证标准缺失：工业场景下的人形机器人尚无成熟监管框架（OSHA、ISO）。(4) 企业采购周期漫长（12–36
              个月）。(5) 关键生产环境中联网自主机器人面临的网络安全风险。
            claimRefs:
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: 竞争格局与市场结构
        blocks:
          - type: paragraph
            body: >
              2025 年的人形机器人市场中，少数资金充裕的欧美初创企业既彼此竞争，又与科技巨头阵营的入局者（Tesla Optimus）及老牌玩家（Boston
              Dynamics/Hyundai）展开博弈。当前市场格局较为分散，无论从交付台数还是收入规模来看，都还没有出现绝对的领头羊，但 Figure AI 在纯人形机器人初创公司中坐拥最高估值（$39B）。获
              Amazon 支持的 Agility Robotics 则凭借 Digit 机器人在仓储落地台数上暂居首位。


              Figure AI 的核心差异化优势在于多维合力：(1) 累计融资金额最高（$1.9B）；(2) 商业试点标杆最硬（BMW）；(3) 拥有自研全栈 AI 模型（Helix）；(4)
              战略投资方生态覆盖最广（Microsoft、OpenAI、NVIDIA、Amazon、BMW）。然而，Tesla 的 Optimus 项目构成了最大的长期竞争威胁，原因在于 Tesla 具备庞大的制造规模、领先的
              AI 积淀（FSD 技术栈），以及具备杀伤力的预期定价（目标价 $20K–$30K，显著低于 Figure 的 $70K–$130K 区间）。


              中国竞争对手（Unitree、Fourier Intelligence、UBTECH）依托大规模制造能力与政府补贴，构成了长期的硬件成本竞争压力。
            claimRefs:
              - CM005
      - number: '2.6'
        title: 核心图表
        blocks:
          - type: callout
            title: TAM 预测分歧巨大，折射行业路径不确定性
            body: >-
              对 2030 年人形机器人市场规模的预测在保守情景（$4B）与激进情景（$48B）之间相差 12 倍，折射出根本性的路径不确定性——即硬件成本能否在 2030
              年前足够快地下探，进而叩开消费端市场的大门。Figure AI 的 $39B 估值，实际上默认了激进情景的兑现。
            calloutType: insight
            claimRefs:
              - CM004
              - CM005
              - CM006
          - type: callout
            title: 汽车制造实证落地，验证近期 SAM 可行性
            body: >-
              BMW 产线落地为汽车制造领域的自动化 ROI 提供了首个公开实证：特定任务下录得 >99% 任务准确率与 400% 效率拉升，加上 BMW 随后推进的 Leipzig
              工厂扩充规划，坐实了企业客户在受控工业环境下为人形机器人买单的真实意愿。
            calloutType: strength
            claimRefs:
              - CM009
              - CM015
              - CM016
          - type: callout
            title: Tesla Optimus 成本目标压制定价权
            body: >-
              Tesla 为 Optimus 设定的 $20K–$30K 远期单机成本目标，大幅低于 Figure AI 当前 $70K–$130K 的价格区间；一旦规模化落地，将给 Figure AI 的定价带来巨大冲击。在
              Optimus 步入大规模量产前，Figure AI 必须筑牢软件与 AI 差异化壁垒并锁定客户粘性。
            calloutType: risk
            claimRefs:
              - CM005
          - type: callout
            title: 监管真空增加落地阻力
            body: 目前尚无成熟监管框架（OSHA、ISO、EU AI Act）针对工业环境中的人形机器人部署作出明确规范。这导致安全事故责任认定存在法律模糊地带，不仅拉长了企业采购周期，也限制了早期的部署规模。
            calloutType: risk
            claimRefs:
              - CM016
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局总览
        blocks:
          - type: paragraph
            body: >
              2025 年的人形机器人市场分化出三大竞争梯队。第一梯队是美国纯人形机器人初创公司：Figure AI、Agility Robotics、Apptronik、1X Technologies、Sanctuary
              AI、Skild AI（AI 模型层）以及 Boston Dynamics（部分业务）。第二梯队是借助现有 AI 生态切入的消费电子与科技巨头：Tesla Optimus、Apple（市场传闻）以及
              Amazon（通过参股 Agility）。第三梯队是中国人形机器人厂商：Unitree、Fourier Intelligence、UBTECH 以及
              Zhiyuan/HINGE。各梯队在成本结构、落地节奏与战略诉求上各不相同。


              Figure AI 的主战场在于企业级与工业制造场景。截至 2026 年初，尚无其他纯人形机器人初创公司达到同等体量的商业化落地规模。不过在 Amazon 仓储网络中，Agility Robotics 部署的
              Digit 机器人台数更多。随着 Tesla Optimus 逼近生产导入期以及中国厂商不断压低硬件成本下限，竞争格局预计将迅速演变。
