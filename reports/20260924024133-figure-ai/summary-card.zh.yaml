  topStrengths:
    - BMW Spartanburg 部署已持续 11+ 个月：机器人为 30,000+ 辆汽车装配 90,000+ 个零部件，任务准确率 >99%。这是业内唯一经验证达到汽车制造规模的商用人形机器人部署
    - 自研 Helix VLA 模型基于 BMW 11+ 个月的真实产线数据训练，部署越久，数据积累越多；没有汽车合作伙伴的竞品很难复制这道数据壁垒
    - Microsoft、OpenAI、NVIDIA、Amazon IIF、Bezos、Qualcomm 和 T-Mobile 等战略投资方，带来平台黏性与潜在分销渠道，不止为机器人销售提供资金
    - BotQ 自建制造让 Figure AI 能掌握无自有工厂的机器人公司难以控制的毛利结构；首期年产能 12,000 台，显示公司正按工业化规模布局
    - 累计约 $1.9B 融资提供数年充裕现金跑道，支撑技术迭代与客户开拓，短期内无直接稀释股权压力
    - BMW 计划于 2026 年夏季扩展至 Leipzig 工厂；若落地，将验证跨厂区复制能力，也是缓解客户集中风险的关键下一步
  topRisks:
    - 客户高度集中：BMW 是当前唯一确认的客户（预计占收入 85–95%）；BMW 任何合同缩减、推迟或终止，都会对近期业务造成致命冲击
    - Tesla Optimus 竞争威胁：Tesla 的垂直整合能力（自研执行器、芯片以及成熟的纯电动车量产体系）加上预计低于 $20,000 的单台成本，可能在 Figure AI 起量前将其挤出大众市场
    - 估值极其极端：以 2025 年预计收入的 250–650 倍对应 $39B 估值，隐含着对一个尚未成型市场的绝对主导地位假定；若估值倍数回落至硬件可比公司水平（2–5 倍收入），入场价值将蒸发 95%+
    - 未披露 MTBF 与可靠性数据：公司未公开平均故障间隔时间（MTBF）、维护周期或正常运行时间 SLA 条款；BMW 产线部署的准确率指标均为公司单方面披露且未经审计
    - 二元监管合规风险：EU AI Act 高风险分类以及 OSHA/ANSI 安全认证要求，可能让每个新地域与新客户的落地部署推迟 2–3 年
    - 创始人缺乏工业硬件经验：Brett Adcock 此前没有工业硬件量产经验；其创办的前两家公司（Vettery、Archer）偏重软件；以机器人行业的毛利水平推进硬件规模化，是截然不同的运营挑战
  unresolvedGaps:
    - BMW 合同财务细节：合同金额、期限、单台定价及续约概率均未公开披露——整套收入逻辑全凭一份未经审计的合同支撑
    - BMW 以外的客户储备：除 BMW 外，公司未披露任何意向书（LOI）、深入商洽或具名的潜在客户
    - 可靠性数据：MTBF、正常运行时间 SLA、现场故障率及维护成本数据均未公开
    - 毛利率：单台制造成本、物料清单及毛利率目标均未披露
    - Series C 轮治理条款：2025 年 9 月融资中的清算优先权、反稀释条款、董事会席位及知情权均属非公开信息
    - BotQ 产能爬坡：向 BMW 实际交付的台数以及当前 BotQ 产能利用率均未公开披露
