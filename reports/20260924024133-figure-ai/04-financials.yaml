- "id": "s2"
  "title": "Unit Economics and Cost Structure"
  "body": "The unit economics of humanoid robots are at an early, costly stage. Hardware manufacturing\ncosts for Figure 02/03\
    \ are not publicly disclosed, but industry analysts estimate that a\nrobot with the component complexity of Figure 03\
    \ (20 DOF hands, 6 cameras, custom actuators,\nadvanced AI inference chips) costs between $40,000–$80,000 per unit to\
    \ manufacture at current\nproduction scale — leaving thin or negative gross margins at the estimated $70K–$130K price.\n\
    \nCost structure breakdown (estimated):\n- R&D: The dominant cost (70%+); 700+ employees including robotics engineers,\
    \ AI researchers,\n  mechanical designers. Average total compensation in AI/robotics is $200K–$300K+.\n- Manufacturing\
    \ COGS: Material costs for robot hardware; NVIDIA chips, custom actuators,\n  cameras, sensors, battery systems.\n- BotQ\
    \ factory capex: Construction and tooling for 12,000 unit/year target capacity.\n- G&A and sales: Enterprise sales, legal,\
    \ finance. Sales cycles are 12–36 months.\n\nThe path to positive unit economics requires: (1) scale manufacturing to\
    \ drive COGS down\n(target sub-$30K per robot at volume), (2) developing Helix AI licensing as a high-margin\nrevenue\
    \ layer, and (3) growing fleet size to spread fixed R&D costs over more deployed robots.\n"
  "claimRefs":
  - "CI005"
  - "CI006"
  - "CI007"
  - "CI008"
  "tableRefs":
  - "TI002"
- "id": "s3"
  "title": "Pricing and Go-to-Market Economics"
  "body": "Figure AI's go-to-market strategy is direct enterprise sales to large manufacturers and logistics\noperators. This\
    \ model has high average contract values but extremely long sales cycles\n(12–36 months) and high customer acquisition\
    \ costs (senior enterprise sales teams, lengthy\npilot periods). Traditional SaaS CAC/payback metrics do not apply directly,\
    \ but the analog\nfor capital equipment is the cost of the pilot + integration burden absorbed during deployment.\n\n\
    BMW's pilot was reported to last 11 months before commercial deployment — suggesting a 12+\nmonth sales-to-deployment\
    \ cycle for an early customer. As Figure AI matures, cycle times\nmay shorten with established reference customers and\
    \ certified integration protocols.\n\nPricing leverage: Enterprise buyers have alternatives (Agility Digit, future Tesla\
    \ Optimus,\ncobot automation), limiting Figure AI's pricing power. The RaaS model, if adopted, creates\npredictable annuity\
    \ revenue but requires Figure AI to carry robots as assets. Hardware sale\ntransfers CapEx to customers but may reduce\
    \ LTV.\n\nCustomer concentration risk: BMW is believed to account for approximately 90%+ of 2024–2025\nrevenue. This creates\
    \ a severe single-customer concentration risk for a company with $39B\nvaluation.\n"
  "claimRefs":
  - "CI009"
  - "CI010"
  - "CI011"
  - "CI012"
