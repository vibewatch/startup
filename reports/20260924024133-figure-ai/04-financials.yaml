  "name": "Figure AI"
"chapter":
  "number": !!int "4"
  "title": "Financials"
  "summary": "Figure AI's financials are almost entirely opaque — a private company with no public revenue\ndisclosure. External\
    \ estimates suggest 2024 revenue of approximately $60 million (primarily\nfrom the BMW commercial agreement) growing to\
    \ $158 million in 2025 as the BMW deployment\nexpands. The company operates with significant cash burn driven by R&D headcount\
    \ (700+),\nBotQ factory construction, and hardware manufacturing costs. With $1.9 billion raised and the\nmost recent\
    \ Series C closing at over $1 billion in September 2025, Figure AI likely has 3–5\nyears of operating runway at current\
    \ burn, depending on production ramp speed. The core\nfinancial challenge is bridging from a single customer (BMW) to\
    \ multi-customer scale while\nmanaging the capital-intensive RaaS model (robot leasing requires balance-sheet assets).\n\
    Revenue quality is weak: narrow customer concentration, unconfirmed contract values, and\nunaudited private estimates.\
    \ The path to profitability requires solving for both unit economics\n(robot gross margin + RaaS margin) and production\
    \ cost reduction at BotQ scale.\n"
"sections":
- "id": "s1"
  "title": "Revenue Streams and Model"
  "body": "Figure AI's primary current revenue source is its commercial agreement with BMW Manufacturing\nat the Spartanburg,\
    \ South Carolina plant. The agreement structure is not publicly disclosed,\nbut industry analysts estimate Figure AI charges\
    \ either a hardware sale price ($70K–$130K per\nrobot) or a Robot-as-a-Service (RaaS) subscription fee estimated at approximately\
    \ $12,000 per\nrobot per year. If the BMW agreement is structured as a RaaS contract with, for example, 100–200\nrobots\
    \ deployed, implied annual revenue would be $1.2M–$2.4M — far below reported revenue\nestimates of $60M, suggesting a\
    \ larger fleet deployment or hybrid hardware+service model.\n\nSacra estimates Figure AI's 2024 revenue at approximately\
    \ $60 million, growing to $158 million\nin 2025, primarily driven by BMW. This implies a significantly higher per-unit\
    \ revenue than\npure RaaS pricing would suggest, potentially from hardware sales, onboarding fees, integration\nservices,\
    \ or a larger robot fleet count than publicly disclosed.\n\nPlanned revenue streams: (1) RaaS recurring subscription fees,\
    \ (2) hardware sales (one-time),\n(3) AI model licensing (Helix), (4) software/OTA update services, and (5) future maintenance\n\
    and training services. As of 2025, revenue streams 3–5 are not confirmed to be generating\nmaterial revenue.\n"
