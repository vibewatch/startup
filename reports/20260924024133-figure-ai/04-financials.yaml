- "id": "s4"
  "title": "Public Traction Metrics"
  "body": "Despite its $39B valuation, Figure AI has disclosed very few verifiable financial metrics\npublicly. The primary\
    \ public traction evidence is operational (deployment performance) rather\nthan financial:\n- 30,000+ BMW vehicles processed\
    \ by Figure robots during 11-month deployment\n- 90,000+ parts handled\n- 1,250+ hours of task completion\n- >99% task\
    \ accuracy\n- 400% efficiency gain vs. prior baseline in specific tasks\n- $1.41 return per $1 spent (cited by IIoT World,\
    \ covering early adopters; source unclear)\n\nNo ARR, unit revenue, GMV, or contract values have been officially confirmed.\
    \ Revenue estimates\n($60M for 2024, $158M for 2025) come exclusively from secondary analyst sources (Sacra).\nFigure\
    \ AI has not filed public financials and has not publicly confirmed any financial metric.\n\nThe company's Series C at\
    \ $39B valuation implies a ~650x revenue multiple on estimated 2025\nrevenue of $60M, or ~250x on $158M — among the highest\
    \ non-public software or hardware company\nmultiples recorded in the 2025–2026 period.\n"
  "claimRefs":
  - "CI013"
  - "CI014"
  - "CI015"
  - "CI016"
- "id": "s5"
  "title": "Capital Adequacy and Financing Dependency"
  "body": "Figure AI's total capital raised is approximately $1.9 billion across:\n- Seed: $100M (self-funded by Brett Adcock)\n\
    - Series A: $70M (May 2023)\n- Series B: $675M at $2.6B (February 2024)\n- Series C: ~$1B+ at $39B (September 2025)\n\n\
    The Series C was the largest humanoid robotics funding round in history at time of close.\nInvestors include Microsoft,\
    \ NVIDIA, OpenAI, Amazon Industrial Innovation Fund, Bezos\nExpeditions, Intel Capital, Brookfield, Parkway VC, Qualcomm,\
    \ T-Mobile, and Salesforce.\n\nEstimated annual cash burn: given $700+ headcount at AI/robotics compensation levels\n\
    ($200K–$300K+ average total comp = $140M–$210M people cost alone), plus R&D, factory capex,\nand hardware COGS, total\
    \ annual burn likely exceeds $300–$500M per year at current scale.\nAssuming $300M+ burn and $1B+ from Series C, runway\
    \ is approximately 3 years (2025–2028)\nbefore the next capital raise would be required. Revenue growth toward $500M+\
    \ or an IPO\nwould be needed to close the gap.\n\nIPO speculation is active for 2026–2027; a public offering at $39B+\
    \ would provide additional\ncapital and liquidity. No official IPO timeline has been confirmed.\n"
  "claimRefs":
  - "CI013"
