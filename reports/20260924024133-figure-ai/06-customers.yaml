"chapter":
  "number": !!int "6"
  "title": "Customers"
  "summary": "Figure AI has one confirmed commercial customer — BMW Manufacturing (Spartanburg, SC) — which\naccounts for\
    \ an estimated 90%+ of its 2024–2025 revenue. The BMW deployment is genuinely\nimpressive as a commercial proof point:\
    \ 30,000+ vehicles, 90,000+ parts handled, >99% task\naccuracy, 400% efficiency gain on specific tasks, and $1.41 ROI\
    \ per $1 spent (per IIoT World\nciting early adopter data). BMW Leipzig expansion is planned for summer 2026. However,\
    \ the\nsingle-customer concentration represents the most critical diligence gap — at a $39B valuation,\nthe entire revenue\
    \ base depends on one relationship. No second commercial customer has been\npublicly confirmed. Amazon's Industrial Innovation\
    \ Fund investment is a potential future customer\nsignal. The customer journey for new buyers requires 12+ months of sales-to-deployment\
    \ cycle,\nhigh integration burden, and novel safety protocol development — structural barriers that protect\nagainst rapid\
    \ competition but also limit rapid scale.\n"
"sections":
- "id": "s1"
  "title": "Customer Base Segmentation"
  "body": "Figure AI's current customer base is effectively a single named enterprise: BMW Manufacturing.\nBMW is a Fortune\
    \ 100 German automotive OEM with manufacturing operations in the US, Germany,\nUK, China, and other markets. The Spartanburg,\
    \ SC plant is BMW's largest globally by volume,\nproducing SUVs (X3, X4, X5, X6, X7) at approximately 1,500 vehicles per\
    \ day.\n\nTarget customer profile (for expansion):\n- Industry: Automotive OEM, Tier-1 automotive supplier, logistics/warehouse\
    \ operators,\n  electronics assembly contractors\n- Geography: US (priority), Germany (BMW expansion), Japan, South Korea\
    \ (automotive),\n  and eventually global\n- Company size: Large enterprise (>$1B revenue) with capital automation budgets\n\
    - Buyer: VP Manufacturing Operations, Plant Directors, Automation/CAPEX budget owners\n- Use case: Repetitive, high-volume\
    \ tasks with ergonomic hazard or labor shortage pressure\n- Key requirement: Structured production environment; established\
    \ safety protocol capacity\n\nChannel: Direct enterprise sales only (no channel partners publicly confirmed). This is\n\
    consistent with 12–36 month sales cycles and the technical complexity of integration.\n"
  "claimRefs":
  - "CU001"
  - "CU002"
  - "CU003"
  - "CU004"
  "tableRefs":
  - "TU001"
  "figureRefs":
  - "FU001"
- "id": "s2"
  "title": "Adoption Trajectory and Growth"
  "body": "Figure AI's commercial deployment has followed a measured single-customer ramp:\n- January 2024: BMW commercial\
    \ agreement announced\n- February–December 2024: 11-month pilot and production ramp (30,000+ vehicles)\n- September 2025:\
    \ Figure 03 announced; BMW deployment expanded to include Figure 03\n- Summer 2026 (planned): BMW Leipzig expansion begins\n\
    \nAt BMW Spartanburg, the deployment covers a single manufacturing task type (sheet-metal loading\nand parts handling)\
    \ across a portion of the 1,500 vehicles/day production line. The total fleet\nsize has not been disclosed; based on the\
    \ 90,000+ parts handled over 1,250+ hours, the\nimplied task rate suggests a fleet of 10–50 robots deployed in the initial\
    \ commercial phase.\n\nNo other commercial customer deployment has been announced. The Amazon Industrial Innovation\n\
    Fund's participation in Figure AI's Series B represents a potential future customer relationship,\nbut no Amazon commercial\
    \ deployment has been confirmed. BMW is planning to expand Figure robot\ndeployment to its Leipzig, Germany plant in summer\
    \ 2026 — the first announced international\ndeployment.\n\nThe adoption pace reflects the structural reality of enterprise\
    \ hardware deployment: 12–36\nmonth sales-to-deployment cycles, long integration periods, and single-site proof before\n\
    expansion commitment.\n"
  "claimRefs":
  - "CU005"
  - "CU006"
  - "CU007"
  - "CU008"
  "tableRefs":
  - "TU002"
- "id": "s3"
  "title": "Named Customer Proof"
  "body": "BMW Manufacturing is the only publicly confirmed commercial customer. Evidence quality is\nstrong for operational\
    \ metrics but weak for financial terms:\n\nConfirmed operational facts:\n- 30,000+ vehicles processed during deployment\
    \ period\n- 90,000+ parts handled\n- 1,250+ hours of robot task operation\n- >99% task accuracy on sheet-metal loading\
    \ tasks\n- 400% efficiency gain (throughput improvement) vs. prior baseline on specific tasks\n- BMW Leipzig expansion\
    \ planned for summer 2026\n\nNot confirmed:\n- Contract value or pricing terms\n- Number of deployed robots\n- Revenue\
    \ paid to Figure AI\n- Contract renewal terms or length\n- BMW's internal assessment of ROI or satisfaction\n\nThe $1.41\
    \ per $1 return ROI figure cited by IIoT World was attributed to \"early adopters\" broadly\nand may not be specific to\
    \ Figure AI or BMW. BMW's public statements have been positive but\ngeneric — no quantified ROI endorsement has been provided\
    \ directly by BMW.\n\nReference quality: BMW is an exceptional reference customer (Fortune 100, brand recognition,\nmanufacturing\
    \ credibility). However, a single reference customer with 90%+ revenue concentration\nis an extreme risk for a $39B company.\n"
  "claimRefs":
  - "CU009"
  - "CU010"
  - "CU011"
  - "CU012"
  "tableRefs":
  - "TU003"
- "id": "s4"
  "title": "Retention, Renewal, and Satisfaction"
  "body": "As of May 2026, Figure AI's BMW relationship appears intact: BMW is expanding to Leipzig,\nwhich is the strongest\
    \ indicator of customer satisfaction and contract renewal intent. The\nLeipzig expansion signals that BMW has internally\
    \ validated the ROI case and is willing to\ncommit additional capital and operational resources to the relationship.\n\
    \nHowever, formal retention metrics — Net Revenue Retention (NRR), Gross Revenue Retention\n(GRR), contract length, renewal\
    \ rate, and customer satisfaction scores — are not publicly\navailable for any Figure AI customer. There are no published\
    \ case studies, customer testimonials,\nor public satisfaction ratings beyond BMW's expansion decision.\n\nThe nature\
    \ of the RaaS model (if adopted) creates structural retention: once robots are\nintegrated into production workflows,\
    \ switching costs are high (workflow redesign, safety\nre-certification, supplier change). However, hardware sale models\
    \ create less structural lock-in\n— a customer could end a hardware lease and return to human labor or switch vendors.\n\
    \nKey retention risks: (1) BMW internal politics — board pressure to reduce external service\ncosts; (2) Competitor displacement\
    \ (Tesla Optimus for future BMW deployments); (3) Technical\ndisappointment if the expansion to Leipzig underperforms;\
    \ (4) Safety incident risk that\ntriggers suspension.\n"
  "claimRefs":
  - "CU013"
  - "CU014"
  - "CU015"
  - "CU016"
- "id": "s5"
  "title": "Expansion and Customer Concentration Risk"
  "body": "Figure AI's most acute financial risk is customer concentration: one customer (BMW) appears\nto represent approximately\
    \ 90%+ of 2024–2025 revenue. At a $39B valuation, this is an extreme\ndeviation from normal enterprise software norms\
    \ where the top customer typically represents 10–25%\nof revenue at comparable valuations.\n\nExpansion vectors:\n1. BMW\
    \ Leipzig (summer 2026) — confirmed expansion\n2. Additional BMW plants (Munich, Regensburg, etc.) — no announced timeline\n\
    3. Second automotive OEM — no confirmed commercial customer\n4. Logistics/warehouse — potential Amazon relationship; no\
    \ commercial deployment\n5. Electronics assembly — no announced customer\n\nAmazon Industrial Innovation Fund's Series\
    \ B investment creates an implied future customer\nrelationship — Amazon is unlikely to invest as a pure financial investor.\
    \ If Amazon deploys\nFigure robots in warehouses, this would be the most important deconcentration event.\n\nThe structural\
    \ challenge: given 12–36 month sales cycles and high integration burden, adding\na new manufacturing customer takes 1–3\
    \ years from contract to commercial scale. Even with\nmultiple pilots in progress (not publicly known), Figure AI may\
    \ have only 2–4 commercial\ncustomers by end of 2027.\n"
  "claimRefs":
  - "CU006"
