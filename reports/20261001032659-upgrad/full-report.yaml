              - CU002
              - CU003
              - CU004
              - CU009
              - CU014
              - CU015
      - number: '6.2'
        title: Adoption Scale Is Large but Mostly Aggregate
        blocks:
          - type: paragraph
            body: >-
              The strongest current adoption evidence is aggregate and company-issued. Syndicated FY26 disclosures
              report more than 100,000 concurrent learners across online, study-abroad, and offline programs, plus more
              than 700 enterprises choosing upGrad Enterprise for skilling, recruitment, or workforce development. A
              low-reputation marketing case study separately claims a cumulative base above 10 million learners, while
              another low-reputation profile reports that the enterprise client base increased nearly 50% in FY24. These
              quantities use different populations and periods, so they should not be combined into a conversion funnel.
              None discloses unique paid learners, average utilization, enterprise contract value, or cohort-level
              adoption.
            claimRefs:
              - CU001
              - CU002
              - CU006
              - CU008
              - CU013
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
