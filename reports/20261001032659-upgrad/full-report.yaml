      - number: '5.2'
        title: Delivery Model and Enterprise Extension
        blocks:
          - type: paragraph
            body: >-
              The strongest public evidence describes an operating model, not an application architecture. Consumer
              delivery uses structured curricula, capstones or hands-on projects, live sessions, mentors, and career
              services. Enterprise delivery adds verticalized AI tracks, role-based programs, executive innovation labs,
              coding centers, sandboxes, build days, and rapid prototyping through the Hexaware relationship. A
              three-day program for banking executives and engineering managers is evidence of actual delivery, while
              the proposed broader portfolio is still an announced expansion. The collaboration's roughly 30%-40%
              faster-release language is expressly an aim, not a measured customer outcome, so it should not be treated
              as verified performance.
            claimRefs:
              - CE002
