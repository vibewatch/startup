        title: Exhibits
        blocks:
          - type: callout
            title: Scale is not retention
            body: >-
              More than 100,000 concurrent learners and more than 700 enterprises establish reported reach, but they do
              not reveal renewal, churn, completion, contract duration, or concentration.
            calloutType: risk
            claimRefs:
              - CU001
              - CU002
