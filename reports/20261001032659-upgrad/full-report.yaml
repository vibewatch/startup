    title: Valuation Benchmark and Recommendation Summary
    columns:
      - Metric / Dimension
      - Current Status / Observation
      - Valuation / Diligence Implication
    rows:
      - - Recommendation Stance
        - Track / Neutral
        - Wait for audited RoC FY26 statements and Unacademy integration clearance.
      - - Fair Equity Valuation
        - $1.73 Billion (Rs 16,500 crore)
        - Pegged by Incwert DCF valuation for Rs 361 crore internal rights round.
      - - Valuation Multiple
        - 7.9x Net Income / 7.9x FY26 Gross Revenue
        - Stretched relative to global edtech peers; relies on FY31 long-term plan.
      - - Risk Rating
        - High
        - Customer dissatisfaction, capex ramp, and distressed M&A integration overhead.
