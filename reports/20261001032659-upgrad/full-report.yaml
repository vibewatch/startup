              - CU005
              - CU006
              - CU008
      - number: '6.3'
        title: Named Proof Is Reverse-Direction, Not Customer Validation
        blocks:
          - type: paragraph
            body: >-
              The pool contains one named production-style deployment, but it runs in the wrong direction for customer
              diligence: Microsoft presents upGrad as Microsoft's customer. That case study says Microsoft 365 A5 and
              Microsoft 365 Copilot supported more than 4,000 active users at upGrad. This is useful evidence of
              upGrad's internal operating scale, not evidence that a named enterprise bought upGrad training, renewed a
              contract, or achieved a workforce outcome. The 700-enterprise disclosure and the
              100,000-concurrent-learner disclosure remain unnamed aggregates. Accordingly, the customer-proof inventory
              below distinguishes external customer evidence from supplier case evidence instead of treating logos,
              suppliers, and customers as interchangeable.
            claimRefs:
              - CU001
              - CU002
              - CU005
              - CU016
          - type: table
            tableRef: TU003
            claimRefs:
              - CU001
              - CU002
              - CU005
              - CU016
      - number: '6.4'
        title: Durability, Expansion, and Concentration Remain Unverified
        blocks:
          - type: paragraph
            body: >-
              Public retention evidence is the central weakness. A third-party presentation says long online courses
              experienced low completion and required stronger support, and it also describes high customer-acquisition
              cost from substantial digital marketing. Another low-reputation profile identifies placement outcomes as a
              continuing learner expectation. Company-issued FY26 material reports INR 530 crore of collected revenue
              not yet recognized, but that accounting balance is not NRR, GRR, cash available, or proof of renewal. An
              independent article also cautions that the reported FY26 figures were not yet independently verified
              through regulatory filings when it was written. The assigned pool discloses neither retention rates nor
              top-customer concentration, so land-and-expand durability and dependency risk remain diligence gaps rather
              than quantified facts.
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
              - CU014
              - CU015
