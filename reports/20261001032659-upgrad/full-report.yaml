      - number: '4.2'
        title: Profitability and Cost Path
        blocks:
          - type: paragraph
            body: >-
              Management reports that Ind-AS EBITDA increased from $1.6 million in FY25 to $13 million in FY26, while
              net loss narrowed 52% to $13.8 million. Independent reporting adds useful caution: the published FY26
              headline had not yet been independently verified through formal regulatory filings, and an Economic Times
              report described the first eleven months' ₹1,532 crore revenue and ₹38 crore profit after tax as
              provisional and unaudited. The forward margin case is more assumption than result. A valuation report
              cited by ET projects direct costs at 35.3% of revenue, employee benefits at 19.6%, and SG&A at 20.3%;
              those forecast ratios do not establish current gross margin, CAC payback, or sustainable cash generation.
            claimRefs:
              - CI004
              - CI005
              - CI008
              - CI009
              - CI011
              - CI012
          - type: table
            tableRef: TI003
            claimRefs:
              - CI001
              - CI002
              - CI004
              - CI005
              - CI011
              - CI012
      - number: '4.3'
        title: Pricing, GTM, and Service Delivery
        blocks:
          - type: paragraph
            body: >-
              Public pricing evidence is thin and stale. A company-authored Wellfound profile says the first-year
              data-analytics program enrolled 800 students at a price of ₹2 lakh, but that historical example cannot
              establish current list prices, discounts, realized tuition, or financing take-up. The 700-plus enterprise
              count signals a B2B channel but does not reveal contract value, sales cycle, retention, or client
              concentration. A current Trustpilot review alleges that one learner paid ₹1.5 lakh, lacked course access
              for five months, and did not receive a refund. That anecdote is not a representative refund rate, but it
              identifies a diligence pathway around service delivery, cancellation exposure, and the quality of upfront
              collections.
            claimRefs:
              - CI007
              - CI015
              - CI016
          - type: table
            tableRef: TI002
            claimRefs:
              - CI007
              - CI015
              - CI016
      - number: '4.4'
        title: Capital Adequacy and Underwriting Verdict
        blocks:
          - type: paragraph
            body: >-
              Public evidence does not establish current liquidity. Clay reports ₹2.875 billion of debt financing in
              June 2024, while ET reports a valuation model that projects annual capital expenditure at 2% to 3% of
              revenue and a rise from ₹5 crore in FY26 to ₹51 crore in FY27. Historical financing raised is not cash
              available, and accounting loss is not cash burn; the sources disclose no current cash balance, monthly
              burn, restricted cash, debt maturity schedule, covenant headroom, or funded acquisition obligations. The
              financial verdict is therefore conditional: reported EBITDA and loss trends are constructive, but revenue
              quality, unit economics, capital intensity, and runway cannot be underwritten without audited statements
              and management schedules.
            claimRefs:
              - CI004
              - CI005
              - CI013
              - CI014
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Capital adequacy is not publicly underwritable
            body: >-
              A historical debt financing event and projected capex ratios do not disclose today's cash, burn, debt
              service, covenants, or runway. Funding raised must not be treated as cash available.
            calloutType: risk
            claimRefs:
              - CI013
              - CI014
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Portfolio and Customer Workflows
        blocks:
          - type: paragraph
            body: >-
              upGrad serves two main workflows. Individuals buy education and career-transition programs spanning
              university-led degrees, certificates, bootcamps, and technical courses; the documented experience combines
              curriculum, projects, live interaction, mentoring, and career support rather than a self-service content
              library alone. Enterprise buyers purchase workforce programs organized around roles, industries, and
              transformation objectives. The FY26 company release reports more than 100,000 concurrent learners and more
              than 700 enterprise customers, but those figures do not disclose active-use definitions, completion,
              retention, or the mix between recurring programs and one-off engagements. Product breadth is visible;
              cohort quality and durable usage remain private diligence items.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE009
              - CE010
              - CE011
