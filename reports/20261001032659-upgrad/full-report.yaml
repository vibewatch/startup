  - id: FI001
    title: Revenue Model Bridge and Missing Underwriting Inputs
    type: flow
    summary: >-
      The operating sequence separates commercial activity, cash collection, accounting recognition, delivery costs, and
      profitability without implying that gross revenue or collected consideration is ARR.
    data:
