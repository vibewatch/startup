chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Platform Scope, and Operational Scale
        blocks:
          - type: paragraph
            body: >-
              upGrad (incorporated as UpGrad Education Private Limited) is a Mumbai-headquartered online higher
              education, professional upskilling, and workforce development platform founded in 2015. Initially
              established by serial media entrepreneur Ronnie Screwvala alongside co-founders Mayank Kumar and Phalgun
              Kompalli to offer industry-aligned certificates in data analytics and digital marketing, upGrad has
              expanded horizontally across undergraduate and postgraduate degrees, executive MBAs, doctorates, study
              abroad pathways, offline skilling, and corporate workforce training. By FY26, upGrad reported maintaining
              over 100,000 concurrent learners across its academic and vocational tracks, supported by institutional
              enterprise engagements with more than 700 corporate clients through upGrad Enterprise. The company's
              platform integrates artificial intelligence across more than 80% of its curriculum and deploys AI
              internally to compress marketing acquisition and platform technology delivery overhead.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
          - type: table
            tableRef: TO001
            claimRefs:
              - CO002
              - CO003
              - CO009
              - CO010
              - CO011
              - CO012
              - CO013
      - number: '1.2'
        title: Founders, Governance Structure, and Executive Leadership
        blocks:
          - type: paragraph
            body: >-
              upGrad was co-founded by Ronnie Screwvala, Mayank Kumar, and Phalgun Kompalli, with Ronnie Screwvala
              serving as executive chairperson and principal strategic architect. Screwvala, previously renowned for
              building and selling UTV Software Communications to The Walt Disney Company, exerts decisive economic and
              operational governance over upGrad, expanding his equity ownership stake to approximately 45% through
              secondary and internal capital investments. Executive operations are anchored by Chief Financial Officer
              Mukesh Mundra, who has overseen financial tightening, cost rationalization, and Ind-AS accounting
              transitions. Governance reflects significant institutional backing from Singapore sovereign wealth fund
              Temasek Holdings, the International Finance Corporation (IFC), 360 ONE, and debt financing partner
              EvolutionX Debt Capital. Despite institutional board presence, governance exhibits pronounced key-person
              dependency on Screwvala for strategic consolidation decisions, capital calls, and debt guarantees.
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO005
              - CO006
              - CO007
          - type: table
            tableRef: TO003
            claimRefs:
              - CO006
              - CO008
              - CO010
      - number: '1.3'
        title: Funding Trajectory, Valuation Realities, and Strategic Consolidation
        blocks:
          - type: paragraph
            body: >-
              Between its inception and FY26, upGrad raised over $780 million in cumulative equity capital across ten
              funding rounds, reaching a peak private transaction benchmark of $2.25 billion in late 2024 backed by
              Temasek. In May 2026, an internal funding round of ₹361 million ($43M) led by Screwvala's personal
              investment of ₹300 million was executed alongside Temasek, IFC, and 360 ONE, underpinned by a formal
              discounted cash flow (DCF) valuation report prepared by Incwert Valuation that pegged upGrad's standalone
              enterprise fair value at ₹16,500 crore ($1.73 billion). Operationally, upGrad completed a multi-year
              turnaround in FY26: gross revenue expanded 7% year-on-year to ₹2,070 crore ($219.5M), while Ind-AS EBITDA
              surged more than eightfold from ₹15 crore ($1.6M) in FY25 to ₹123 crore ($13M) in FY26, and annual net
              losses contracted 52% to ₹130 crore ($13.8M) from peak deficits of ₹1,142 crore ($121M) in FY23. On
              September 1, 2026, upGrad concluded its acquisition of Unacademy for $200 million (₹1,955 crore),
              capturing online test-prep categories (UPSC, JEE, NEET, GATE), ₹400 crore in annual run-rate revenue, and
              an estimated ₹900 crore in cash reserves.
            claimRefs:
              - CO009
              - CO010
              - CO011
              - CO012
              - CO013
              - CO014
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO001
              - CO008
              - CO009
              - CO010
              - CO011
              - CO012
              - CO013
              - CO014
      - number: '1.4'
        title: Consumer Perception, Service Delivery Risks, and Lending Dependencies
        blocks:
          - type: paragraph
            body: >-
              While upGrad has demonstrated operational turnaround at the corporate P&L level, public consumer
              satisfaction and student service delivery indicators reveal material friction. On Trustpilot, upGrad holds
              an aggregate rating of 3.7 out of 5 across 680 verified customer reviews, characterized by persistent
              unprompted learner complaints regarding aggressive sales tactics by admissions counselors, unresponsive
              post-enrollment academic assistance, delays in curriculum batch deferrals, and friction in obtaining
              refunds or cancelling third-party Non-Banking Financial Company (NBFC) student credit lines. Because
              upGrad's high-ticket certification and degree programs rely on student credit financing facilitated
              through fintech NBFC partners such as Fibe (EarlySalary), regulatory shifts in consumer lending guidelines
              or NBFC underwriting approval contractions present an unhedged operational risk to retail student intake.
            claimRefs:
              - CO015
              - CO016
      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Strategic Implication of the Unacademy Consolidation
            body: >-
              The acquisition of Unacademy for $200M on September 1, 2026, represents a structural turning point for
              upGrad. Beyond adding ₹400 crore in topline and an estimated ₹900 crore in balance-sheet liquidity, the
              acquisition expands upGrad's addressable user funnel into earlier test-prep cycles (UPSC, JEE, NEET). This
              creates an integrated pipeline spanning early test preparation, undergraduate/postgraduate degrees,
              vocational internships via Internshala, and executive corporate training.
            calloutType: insight
            claimRefs:
              - CO013
              - CO014
          - type: callout
            title: Student Financing Exposure and Retail NBFC Underwriting Risk
            body: >-
              Public consumer reviews reflect material vulnerability surrounding course fee financing through NBFC loan
              partners like Fibe. With high course fees (often exceeding ₹1.5 to ₹2 lakh) financed via multi-month EMIs,
              administrative delays in batch onboarding or rejected university credentials trigger loan servicing
              disputes. More stringent RBI oversight on retail fintech lending could constrain student intake and
              conversion.
            calloutType: risk
            claimRefs:
              - CO015
              - CO016
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Category Scope, and Addressable Spend
        blocks:
          - type: paragraph
            body: >-
              upGrad operates at the intersection of accredited online higher education and career-focused professional
              upskilling, serving working professionals seeking career acceleration and transition. The addressable
              market boundary encompasses post-graduate diplomas, executive MBAs, technical certifications in artificial
              intelligence and data science, and corporate enterprise workforce training. Excluded from this boundary
              are conventional on-campus K-12 education, full-time undergraduate residential programs, and informal
              consumer tutorials that lack formal university accreditation or employer recognition. In response to
              structural shifts in technology hiring and corporate automation, upGrad has expanded from its initial
              focus on vocational technology bootcamps into university-partnered post-graduate degrees, international
              articulation pathways, and enterprise workforce development programs.
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
      - number: '2.2'
        title: TAM, SAM, SOM Sizing Lenses and Segment Realities
        blocks:
          - type: paragraph
            body: >-
              Estimating upGrad's addressable market requires decomposing top-down education macro aggregates into
              evidence-constrained serviceable segments. While India's total higher education and adult lifelong
              learning expenditure reaches approximately ₹4,00,000 crore ($48 billion), the accessible online market
              represents roughly ₹40,000 crore ($4.8 billion) across undergraduate and post-graduate offerings. Within
              this broader digital landscape, the serviceable addressable market (SAM) for premium executive degrees and
              certified post-graduate diplomas is constrained to approximately ₹12,000 crore ($1.4 billion) by
              individual household purchasing power and consumer credit underwriting thresholds. At an operating scale
              of ₹2,000 crore in FY26 gross collections ($219.5 million inclusive of taxes) and $184 million in net
              Ind-AS operating income, upGrad has captured roughly 16% of the high-ticket executive segment, leaving
              growth dependent on international market penetration and B2B corporate enterprise adoption.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM014
              - CM015
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM014
              - CM015
      - number: '2.3'
        title: Buyer Personas, Financing Channels, and Procurement Dynamics
        blocks:
          - type: paragraph
            body: >-
              The buyer universe for upGrad bifurcates into direct-to-consumer individual learners and institutional
              enterprise accounts, each operating under distinct economic models. Individual buyers are primarily
              mid-career technology professionals, engineers, and functional managers aiming to overcome stagnation or
              transition into high-growth disciplines like artificial intelligence. Because average program tuition
              ranges from ₹1,50,000 to over ₹5,00,000, consumer adoption relies extensively on third-party non-banking
              financial company (NBFC) credit partners providing multi-month zero-cost EMI loans. Conversely, enterprise
              clients procure structured capability academies and workforce transformation cohorts through centralized
              corporate human resource and L&D budgets, creating more resilient multi-year revenue streams with lower
              customer acquisition costs compared to the consumer channel.
            claimRefs:
              - CM008
              - CM009
              - CM010
          - type: table
            tableRef: TM003
            claimRefs:
              - CM008
              - CM009
              - CM010
      - number: '2.4'
        title: Growth Drivers, Regulatory Hurdles, and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              Market growth is underpinned by secular tailwinds including corporate artificial intelligence
              transformation, rising demand for accredited online credentials, and university regulatory reforms
              supporting remote degree delivery. However, significant adoption constraints temper this expansion
              velocity. Tightening consumer lending scrutiny and potential credit policy shifts by NBFC financing
              partners represent an immediate demand-side risk for high-ticket program sales. Furthermore, persistent
              consumer friction regarding aggressive outbound telemarketing and stringent refund dispute policies
              underscores the operational risk inherent in high-pressure direct-to-consumer sales funnels. Long-term
              valuation durability requires upGrad to balance aggressive learner acquisition with student satisfaction,
              employment outcome verification, and enterprise contract diversification.
            claimRefs:
              - CM011
              - CM012
              - CM013
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Consumer Financing Dependence and Lead Conversion Friction
            body: >-
              A substantial portion of retail learners rely on NBFC-partnered zero-cost EMI plans to finance high-ticket
              university diplomas, creating acute sensitivity to consumer credit tightening, while aggressive outbound
              sales tactics have generated student dissatisfaction and refund friction.
            calloutType: risk
            claimRefs:
              - CM011
              - CM012
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Structure and Alternative Archetypes
        blocks:
          - type: paragraph
            body: >-
              The competitive arena in which upGrad operates encompasses five distinct organizational models: direct
              domestic skilling aggregators, global MOOC and credential platforms, specialized vertical bootcamps,
              enterprise workforce training platforms, and traditional university distance-learning programs. Direct
              peers such as Great Learning and Simplilearn compete directly for working professionals in India seeking
              AI, data science, and management diplomas. Global providers like Coursera and edX leverage international
              institutional prestige to offer university-backed degrees and employer-sponsored certificates at flexible
              self-paced price tiers. Specialized providers like DataCamp focus on interactive browser-based technical
              programming, while StarAgile concentrates on project management and PMP certification. Concurrently,
              traditional higher-education institutions increasingly offer their own direct online programs, while
              status-quo corporate internal training represents a persistent non-consumption substitute. This fragmented
              structure forces upGrad to balance broad curriculum coverage across undergraduate, postgraduate, and
              executive levels against specialized competitors that operate with leaner delivery overhead.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP006
              - CP007
      - number: '3.2'
        title: Competitor Profiles, Relative Scale, and Capability Comparison
        blocks:
          - type: paragraph
            body: >-
              A comparative evaluation of leading alternatives reveals stark divergence in commercial scale, target
              buyer segments, and product architecture. Competitors such as Eruditus operate at larger international
              scale, reporting ₹3,733 crore ($448M) in revenue in FY24, which is nearly double upGrad's scale at the
              time, while Coursera and LinkedIn Learning command massive global user bases and enterprise penetration.
              upGrad differentiates through high-touch blended delivery, university partnership credentials, and
              dedicated placement support, targeting mid-career professionals willing to commit substantial capital. In
              contrast, self-paced platforms like Coursera and edX deliver lower price-point credentials with minimal
              live intervention. Meanwhile, niche providers like DataCamp and StarAgile achieve high completion velocity
              by focusing exclusively on applied technical workflows or exam preparation. upGrad's planned horizontal
              consolidation through the acquisition of Unacademy and Internshala aims to capture learners across their
              complete educational lifecycle, but integrating diverse learner bases introduces operational execution
              friction.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP007
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP007
      - number: '3.3'
        title: Pricing Models, Switching Economics, and Moat Durability
        blocks:
          - type: paragraph
            body: >-
              Pricing and packaging across the higher education and skilling landscape span subscription, freemium,
              one-time course fees, and multi-thousand-dollar degree financing. While platforms like LinkedIn Learning
              and DataCamp monetize via recurring monthly or annual subscriptions, and Coursera combines course auditing
              with subscription specializations, upGrad's core consumer revenue depends on high-ticket upfront fees
              often funded via non-banking financial company (NBFC) multi-month installment loans. Industry analysis
              documents that student switching costs between independent providers remain low to moderate once a
              specific program concludes, as curriculum offerings across AI, data science, and management remain fairly
              undifferentiated at their core. Furthermore, upGrad's commercial pricing strategy relies on premium
              positioning, bundle discounts, and promotional concessions, which risk eroding customer price perception.
              Adverse consumer feedback highlights aggressive sales tactics, counsellor misrepresentations regarding
              university eligibility, and delayed refunds following rejected admissions, indicating that aggressive
              customer acquisition can compromise brand trust and long-term moat durability.
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Low Switching Costs and Commodity Risk in Core Tech Curriculum
            body: >-
              Industry structural analysis reveals that students can switch between online programs with moderate
              effort. Core curriculums across artificial intelligence, machine learning, and data science are widely
              commoditized across Coursera, Simplilearn, and Great Learning. As institutional partners license programs
              across multiple platforms, upGrad's pricing power rests heavily on placement support and brand marketing
              rather than exclusive intellectual property.
            calloutType: risk
            claimRefs:
              - CP010
              - CP011
          - type: callout
            title: Lifecycle Expansion via Acquisition as a Moat Defense
            body: >-
              By closing the acquisitions of Unacademy and Internshala alongside its organic higher education and B2B
              enterprise offerings, upGrad is actively constructing a full-lifecycle learning moat. Serving learners
              from early test preparation through college internships, postgraduate skilling, and corporate workforce
              L&D creates proprietary cross-sell distribution channels that standalone certification competitors cannot
              easily replicate.
            calloutType: insight
            claimRefs:
              - CP004
              - CP008
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Quality and Recognition
        blocks:
          - type: paragraph
            body: >-
              upGrad's FY26 release uses several distinct top-line measures that should not be collapsed into one
              revenue number. It reports $219.5 million of gross revenue inclusive of taxes, up 7% year on year, while
              post-Ind-AS accounting closed at $184 million of total income. The same release identifies $56 million
              already collected but not yet recognized, which supports future recognition visibility but is neither ARR
              nor evidence that the amount remains available as cash. Scale indicators include more than 100,000
              concurrent learners and more than 700 enterprises choosing upGrad Enterprise in FY26, but neither metric
              discloses revenue mix, renewal, concentration, realized pricing, or contribution margin.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI006
              - CI007
