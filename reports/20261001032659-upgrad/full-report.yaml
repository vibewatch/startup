          label: Learner and enterprise demand
          detail: >-
            More than 100,000 concurrent learners and 700-plus enterprises are scale indicators, not disclosed revenue
            cohorts.
        - id: contract
          label: Enrollment or enterprise contract
          detail: Current realized consumer pricing, enterprise ACV, discounts, and sales cycle are unavailable.
        - id: collection
          label: Cash collection
          detail: $56 million was collected but not yet recognized; availability and refund exposure are undisclosed.
        - id: recognition
          label: Accounting recognition
          detail: FY26 gross revenue inclusive of taxes was $219.5 million, while post-Ind-AS total income was $184 million.
        - id: delivery
          label: Program delivery and operating cost
          detail: A valuation report projects direct, employee, and SG&A ratios, but current segment margins are not public.
        - id: outcome
          label: EBITDA, net loss, and cash flow
          detail: Reported EBITDA was $13 million and net loss was $13.8 million; operating cash flow was not disclosed.
      edges:
        - from: demand
          to: contract
        - from: contract
          to: collection
        - from: collection
          to: recognition
        - from: recognition
          to: delivery
        - from: delivery
          to: outcome
    approximationNotes: >-
