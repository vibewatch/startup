      - CV001
      - CV002
      - CV007
      - CV014
  - id: TV002
    title: Investment Thesis vs Anti-Thesis Matrix
    columns:
      - Thesis Dimension
      - Core Thesis Argument
      - Anti-Thesis / Downside Factor
      - What Would Change View
    rows:
      - - Operating Leverage
        - EBITDA expanded 8x to $13M with marketing and tech expenses dropping.
        - Aggressive SG&A cuts may impair learner acquisition and brand retention.
        - Audited proof of sustained positive operating cash flow in FY27.
      - - Market Consolidation
        - Acquiring Unacademy for Rs 2,055 crore consolidates test-prep and skilling.
        - Absorbing distressed operations risks renewed cash burn and management distraction.
        - Successful turnaround and EBITDA breakeven across acquired business units.
      - - Enterprise L&D Scale
        - Over 700 enterprise clients contracted for B2B workforce training.
        - Lack of disclosed NRR or cohort concentration masks potential churn.
        - Disclosure of audited enterprise retention and multi-year contract backlog.
    notes: Evaluates key growth pillars against disclosed operational constraints and acquisition risks.
    claimRefs:
      - CV004
      - CV006
      - CV008
      - CV009
  - id: TV003
    title: 'Scenario Analysis: Bull, Base, and Bear Valuations'
    columns:
      - Scenario
      - Key Assumptions & Drivers
      - Valuation Range
      - Probability Signal
    rows:
      - - Bull Case
        - Unacademy adds Rs 500 Cr sales; Atlas University expands; EBITDA reaches Rs 200 Cr+.
        - $1.73B – $2.0B
        - 25% — contingent on seamless integration and rapid margin realization.
      - - Base Case
        - Steady 12-15% organic growth; university degrees scale; modest net profitability.
        - $1.3B – $1.5B
        - 50% — reflects realistic growth moderation and public market discount.
      - - Bear Case
        - Rising learner acquisition costs; refund backlash; heavy capex burn through FY31.
        - $0.8B – $1.0B
        - 25% — multiple compression down to 3x-4x sales in distressed funding environment.
    notes: Scenarios model potential valuation outcomes across different operational execution paths.
    claimRefs:
      - CV007
      - CV009
      - CV011
      - CV012
figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      Chronological milestone timeline mapping upGrad from its 2015 founding through aggressive acquisitions,
      capitalization peaks, operational turnaround, and the $200M Unacademy acquisition.
    data:
      items:
        - label: Company Founding
          detail: >-
            Founded in Mumbai by Ronnie Screwvala, Mayank Kumar, and Phalgun Kompalli to launch data analytics and
            digital marketing programs.
          date: '2015-03-01'
          tone: positive
        - label: IAMAI & FastCompany Accolades
          detail: Awarded Best Tech for Education by IAMAI and ranked top 10 most innovative Indian companies by FastCompany.
          date: '2018-05-01'
          tone: positive
        - label: Temasek Anchor Funding
          detail: >-
            Secured $120M in growth funding led by Temasek Holdings to accelerate post-pandemic higher-education
            expansion.
          date: '2021-04-01'
          tone: positive
        - label: Unicorn Valuation Milestone
          detail: >-
            Raised $225M in primary capital, cementing unicorn status and expanding university degree partnerships
            across India.
          date: '2022-06-01'
          tone: positive
        - label: Peak Operating Deficit
          detail: >-
            Reported peak fiscal year net loss of ₹1,142 crore ($121M) in FY23, triggering comprehensive
            cost-rationalization mandate.
          date: '2023-03-31'
          tone: negative
        - label: EvolutionX Debt & Secondary Round
          detail: >-
            Secured ₹287.5 crore structured credit from EvolutionX; Temasek backed $60M round pegging valuation at
            $2.25B as Screwvala lifted stake to 45%.
          date: '2024-10-01'
          tone: neutral
        - label: EBITDA Breakeven & Internshala Deal
          detail: >-
            Achieved initial Ind-AS EBITDA profitability of ₹15 crore in FY25; acquired 90% stake in Internshala to
            connect skilling to job recruitment.
          date: '2025-03-31'
          tone: positive
        - label: Incwert DCF Valuation Pegged at $1.73B
          detail: >-
            Incwert Valuation report set standalone fair enterprise value at ₹16,500 crore ($1.73B) ahead of internal
            rights round.
          date: '2026-02-28'
          tone: neutral
        - label: FY26 Operational Turnaround
          detail: >-
            Reported ₹2,070 crore ($219.5M) gross revenue and 8x EBITDA surge to ₹123 crore ($13M), narrowing net loss
            52% to ₹130 crore.
          date: '2026-08-18'
          tone: positive
        - label: Unacademy Acquisition Closed
          detail: >-
            Finalized $200M (₹1,955 crore) acquisition of Unacademy, absorbing ₹400 crore topline, ₹900 crore cash, and
            test-prep categories.
          date: '2026-09-01'
          tone: positive
    approximationNotes: Dates represent public disclosure months and fiscal period closes. Valuations reflect transaction benchmarks.
    claimRefs:
      - CO001
      - CO008
      - CO009
      - CO010
      - CO011
      - CO012
      - CO013
      - CO014
