evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: nbfc-lending-exposure
    missingEvidence: >-
      Monthly loan approval percentages, partner NBFC default rates, and recourse liability terms for student tuition
      credit.
    whyItMatters: >-
      Directly determines whether tuition revenue growth is vulnerable to tightening NBFC underwriting guidelines or RBI
      credit regulations.
    diligencePath: Review credit partner agreements and request audited NBFC origination disclosures during financial due diligence.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: enterprise-nrr-and-margin
    missingEvidence: >-
      Audited segment reporting detailing upGrad Enterprise revenue contribution, gross margins, and net revenue
      retention (NRR).
    whyItMatters: >-
      Critical for evaluating whether B2B workforce training provides durable, high-margin counter-cyclical cash flow
      against consumer edtech volatility.
    diligencePath: Obtain segment-level management accounts and auditor reconciliation notes for upGrad Enterprise.
    relatedQuestionRefs:
      - QO003
      - QO008
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: material
    topic: consumer-credit-data
    missingEvidence: >-
      Granular monthly loan application, approval rate, and credit default statistics from partner NBFCs providing
      zero-cost EMI financing to upGrad students.
    whyItMatters: >-
      Retail enrolment velocity is heavily dependent on student financing; changes in NBFC underwriting criteria
      directly impact upGrad's conversion funnel and revenue realization.
    diligencePath: >-
      Request private NBFC partner performance reports, cohort-level delinquency data, and cancellation rates under
      diligence NDA.
    relatedQuestionRefs:
      - QM009
  - type: missing-source
    severity: minor
    topic: enterprise-retention-metrics
    missingEvidence: >-
      Audited B2B enterprise net revenue retention (NRR), gross retention, and annual contract value distribution for
      upGrad's corporate training accounts.
    whyItMatters: >-
      Enterprise L&D resilience cannot be fully separated from cyclical corporate hiring and discretionary training
      budget contractions without account-level retention data.
    diligencePath: >-
      Obtain audited enterprise client cohort retention tables and enterprise customer concentration reports during
      management diligence.
    relatedQuestionRefs: []
  - type: private-evidence-only
    severity: material
    topic: institutional-revenue-share
    missingEvidence: >-
      Audited institutional contract terms and revenue-share percentages between upGrad and university partners like
      IIIT-B or MICA.
    whyItMatters: Revenue-share splits determine upGrad's gross margin sustainability against university-direct online offerings.
    diligencePath: Review university licensing contracts, partner margin disclosures, or private statutory schedules.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - id: gap-competitor-margins
    type: missing-source
    severity: minor
    topic: peer-unit-economics
    missingEvidence: >-
      Granular EBITDA and customer acquisition cost (CAC) breakdowns for unlisted competitors Great Learning and
      Simplilearn.
    whyItMatters: >-
      Direct CAC benchmarking would clarify whether upGrad's sales-assisted acquisition model is more or less efficient
      than peers.
    diligencePath: Inspect MCA filings and Registrar of Companies annual returns for domestic competitors.
    relatedQuestionRefs:
      - QP002
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: cash and runway
    missingEvidence: >-
      Current unrestricted cash, restricted cash, monthly cash burn, debt maturities, covenant headroom, and
      management's 24-month liquidity plan.
    whyItMatters: Neither funding raised nor accounting loss establishes cash availability or runway.
    diligencePath: >-
      Obtain bank statements, audited cash-flow statements, debt agreements, covenant certificates, and a monthly
      liquidity forecast.
    relatedQuestionRefs:
      - QI005
  - type: missing-source
    severity: material
    topic: audited FY26 financials
    missingEvidence: >-
      Audited FY26 income statement, balance sheet, cash-flow statement, revenue note, EBITDA reconciliation, and
      contract-liability roll-forward.
    whyItMatters: >-
      Company-issued and provisional figures cannot reconcile gross revenue inclusive of taxes, total income, EBITDA,
      net loss, and cash generation.
    diligencePath: >-
      Request signed FY26 financial statements and reconcile them to the public release and provisional
      first-eleven-month figures.
    relatedQuestionRefs:
      - QI004
      - QI006
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: unit economics
    missingEvidence: >-
      Program-level realized tuition, discounts, CAC, payback, university share, gross margin, completion, refunds, and
      contribution margin.
    whyItMatters: Headline learner and enterprise counts do not establish durable revenue quality or profitable acquisition.
    diligencePath: >-
      Obtain cohort economics by product, geography, and channel, including paid versus organic acquisition and
      enterprise renewals.
    relatedQuestionRefs:
      - QI001
      - QI002
      - QI003
      - QI008
    relatedTableRefs:
      - TI001
      - TI002
      - TI003
  - type: private-evidence-only
    severity: material
    topic: architecture-controls-gap
    missingEvidence: >-
      Current architecture diagrams, hosting and data-flow maps, deployment process, capacity metrics, uptime and
      incident history, disaster-recovery tests, security certifications, privacy controls, and assessment-integrity
      controls.
    whyItMatters: >-
      Without these materials, investors cannot verify scalability, resilience, data protection, compliance readiness,
      or whether technology rather than labor supports operating leverage.
    diligencePath: >-
      Run technical diligence with the CTO and security owner; inspect architecture and data-flow diagrams,
      service-level dashboards, incident postmortems, penetration-test summaries, audit reports, and disaster-recovery
      evidence.
    relatedQuestionRefs:
      - QE003
      - QE006
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: material
    topic: learning-efficacy
    missingEvidence: >-
      Program-level active-use definitions, completion and dropout cohorts, assessment-validity evidence, independently
      measured skills gains, placements, and enterprise renewal or expansion.
    whyItMatters: >-
      Catalog breadth, concurrent-learner counts, and testimonials do not establish learning efficacy, retention, or
      durable enterprise demand.
    diligencePath: >-
      Request cohort-level LMS exports, completion and placement audits, pre/post skills assessments, enterprise
      contract cohorts, renewals, and reference calls.
    relatedTableRefs:
      - TE001
      - TE002
  - type: missing-source
    severity: material
    topic: support-quality
    missingEvidence: >-
      Support-ticket volume, response and resolution service levels, cohort-migration error rates, refund outcomes,
      application defect rates, and complaint denominators.
    whyItMatters: Anecdotal reviews identify plausible failure modes but cannot quantify prevalence, severity, or remediation.
    diligencePath: >-
      Reconcile helpdesk, CRM, refund, defect, and cohort-administration logs by program and month, then sample closed
      and escalated cases.
    relatedTableRefs:
      - TE002
      - TE003
  - type: private-evidence-only
    severity: material
    topic: retention-gap
    missingEvidence: Segment-level NRR, GRR, learner completion, churn, renewal, repeat-purchase, and contract-duration data.
    whyItMatters: >-
      Aggregate customer counts cannot establish durability or lifetime value without cohort retention and renewal
      evidence.
    diligencePath: >-
      Request three years of B2C learner cohorts and B2B logo and revenue-retention schedules, reconciled to billed and
      recognized revenue.
    relatedQuestionRefs:
      - QU004
  - type: private-evidence-only
    severity: material
    topic: concentration-gap
    missingEvidence: >-
      Top-1, top-5, and top-10 customer revenue concentration plus university, channel, and financing-partner
      dependency.
    whyItMatters: >-
      A large aggregate enterprise count can coexist with material dependency on a small number of contracts or
      distribution partners.
    diligencePath: >-
      Request audited customer-concentration schedules, partner revenue shares, contract expiries, and lender or
      financing-channel exposure.
    relatedQuestionRefs:
      - QU007
  - type: enumeration-incomplete
    severity: material
