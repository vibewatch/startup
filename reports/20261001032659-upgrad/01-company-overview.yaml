callouts:
  - calloutType: "insight"
    title: "Strategic Implication of the Unacademy Consolidation"
    body: "The acquisition of Unacademy for $200M on September 1, 2026, represents a structural turning point for upGrad. Beyond adding ₹400 crore in topline and an estimated ₹900 crore in balance-sheet liquidity, the acquisition expands upGrad's addressable user funnel into earlier test-prep cycles (UPSC, JEE, NEET). This creates an integrated pipeline spanning early test preparation, undergraduate/postgraduate degrees, vocational internships via Internshala, and executive corporate training."
    claimRefs:
      - "CO013"
      - "CO014"
  - calloutType: "risk"
    title: "Student Financing Exposure and Retail NBFC Underwriting Risk"
    body: "Public consumer reviews reflect material vulnerability surrounding course fee financing through NBFC loan partners like Fibe. With high course fees (often exceeding ₹1.5 to ₹2 lakh) financed via multi-month EMIs, administrative delays in batch onboarding or rejected university credentials trigger loan servicing disputes. More stringent RBI oversight on retail fintech lending could constrain student intake and conversion."
    claimRefs:
      - "CO015"
      - "CO016"
