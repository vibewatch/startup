company:
  name: "upGrad"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Founded in Mumbai in 2015 by Ronnie Screwvala, Mayank Kumar, and Phalgun Kompalli, upGrad has transitioned from a specialized professional higher-education provider into an integrated lifelong learning platform spanning test preparation, university degrees, study abroad, and enterprise workforce skilling. Operating at a registered gross revenue run-rate of ₹2,070 crore ($219.5M) with ₹123 crore ($13M) EBITDA in FY26, the company completed a transformative $200M acquisition of Unacademy in September 2026 to consolidate market reach across student and professional lifecycles."
sections:
  - id: "identity-and-operating-scale"
    title: "Corporate Identity, Platform Scope, and Operational Scale"
    body: "upGrad (incorporated as UpGrad Education Private Limited) is a Mumbai-headquartered online higher education, professional upskilling, and workforce development platform founded in 2015. Initially established by serial media entrepreneur Ronnie Screwvala alongside co-founders Mayank Kumar and Phalgun Kompalli to offer industry-aligned certificates in data analytics and digital marketing, upGrad has expanded horizontally across undergraduate and postgraduate degrees, executive MBAs, doctorates, study abroad pathways, offline skilling, and corporate workforce training. By FY26, upGrad reported maintaining over 100,000 concurrent learners across its academic and vocational tracks, supported by institutional enterprise engagements with more than 700 corporate clients through upGrad Enterprise. The company's platform integrates artificial intelligence across more than 80% of its curriculum and deploys AI internally to compress marketing acquisition and platform technology delivery overhead."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
    tableRefs:
      - "TO001"
    figureRefs: []
  - id: "governance-and-leadership"
    title: "Founders, Governance Structure, and Executive Leadership"
    body: "upGrad was co-founded by Ronnie Screwvala, Mayank Kumar, and Phalgun Kompalli, with Ronnie Screwvala serving as executive chairperson and principal strategic architect. Screwvala, previously renowned for building and selling UTV Software Communications to The Walt Disney Company, exerts decisive economic and operational governance over upGrad, expanding his equity ownership stake to approximately 45% through secondary and internal capital investments. Executive operations are anchored by Chief Financial Officer Mukesh Mundra, who has overseen financial tightening, cost rationalization, and Ind-AS accounting transitions. Governance reflects significant institutional backing from Singapore sovereign wealth fund Temasek Holdings, the International Finance Corporation (IFC), 360 ONE, and debt financing partner EvolutionX Debt Capital. Despite institutional board presence, governance exhibits pronounced key-person dependency on Screwvala for strategic consolidation decisions, capital calls, and debt guarantees."
    claimRefs:
      - "CO005"
      - "CO006"
      - "CO007"
      - "CO008"
    tableRefs:
      - "TO002"
      - "TO003"
    figureRefs: []
  - id: "capitalization-and-turnaround"
    title: "Funding Trajectory, Valuation Realities, and Strategic Consolidation"
    body: "Between its inception and FY26, upGrad raised over $780 million in cumulative equity capital across ten funding rounds, reaching a peak private transaction benchmark of $2.25 billion in late 2024 backed by Temasek. In May 2026, an internal funding round of ₹361 million ($43M) led by Screwvala's personal investment of ₹300 million was executed alongside Temasek, IFC, and 360 ONE, underpinned by a formal discounted cash flow (DCF) valuation report prepared by Incwert Valuation that pegged upGrad's standalone enterprise fair value at ₹16,500 crore ($1.73 billion). Operationally, upGrad completed a multi-year turnaround in FY26: gross revenue expanded 7% year-on-year to ₹2,070 crore ($219.5M), while Ind-AS EBITDA surged more than eightfold from ₹15 crore ($1.6M) in FY25 to ₹123 crore ($13M) in FY26, and annual net losses contracted 52% to ₹130 crore ($13.8M) from peak deficits of ₹1,142 crore ($121M) in FY23. On September 1, 2026, upGrad concluded its acquisition of Unacademy for $200 million (₹1,955 crore), capturing online test-prep categories (UPSC, JEE, NEET, GATE), ₹400 crore in annual run-rate revenue, and an estimated ₹900 crore in cash reserves."
    claimRefs:
      - "CO009"
      - "CO010"
      - "CO011"
      - "CO012"
      - "CO013"
      - "CO014"
    tableRefs: []
    figureRefs:
      - "FO001"
  - id: "reputation-and-service-delivery-friction"
    title: "Consumer Perception, Service Delivery Risks, and Lending Dependencies"
    body: "While upGrad has demonstrated operational turnaround at the corporate P&L level, public consumer satisfaction and student service delivery indicators reveal material friction. On Trustpilot, upGrad holds an aggregate rating of 3.7 out of 5 across 680 verified customer reviews, characterized by persistent unprompted learner complaints regarding aggressive sales tactics by admissions counselors, unresponsive post-enrollment academic assistance, delays in curriculum batch deferrals, and friction in obtaining refunds or cancelling third-party Non-Banking Financial Company (NBFC) student credit lines. Because upGrad's high-ticket certification and degree programs rely on student credit financing facilitated through fintech NBFC partners such as Fibe (EarlySalary), regulatory shifts in consumer lending guidelines or NBFC underwriting approval contractions present an unhedged operational risk to retail student intake."
    claimRefs:
      - "CO015"
      - "CO016"
    tableRefs: []
    figureRefs: []
