  - calloutType: risk
    title: Antitrust Clearance Risk on Unacademy Acquisition
    body: The pending Rs 2,055 crore acquisition of Unacademy represents a defining inorganic bet to absorb competitor scale and add an estimated Rs 500 crore in sales. However, awaiting Competition Commission of India (CCI) assent leaves the timing and operational integration vulnerable to regulatory conditions, remedies, or integration delays.
    claimRefs:
      - CR002
  - calloutType: risk
    title: Aggressive Multi-Year Profitability and Capex Escalation
    body: Valuation models project capital expenditure expanding from Rs 5 crore in FY26 to Rs 383 crore in FY28, with EBITDA rising to Rs 7,000 crore by FY31. This forecast hinges on employee expenses dropping from 51.7% to 19.6% of revenue while simultaneously executing complex M&A integrations and offline centre buildouts.
    claimRefs:
      - CR001
      - CR014
