company:
  name: "upGrad"
chapter:
  number: 4
  title: "Financials"
  summary: "upGrad's company-issued FY26 release reports $219.5 million of gross revenue inclusive of taxes, $184 million of post-Ind-AS total income, $13 million of EBITDA, and a $13.8 million net loss. The direction is improving, but audited FY26 statements, segment margins, customer acquisition economics, cash, runway, and debt terms remain unavailable, so the public record is insufficient for full underwriting."
sections:
  - id: "revenue-quality-and-recognition"
    title: "Revenue Quality and Recognition"
    body: >-
      upGrad's FY26 release uses several distinct top-line measures that should not be
      collapsed into one revenue number. It reports $219.5 million of gross revenue
      inclusive of taxes, up 7% year on year, while post-Ind-AS accounting closed at
      $184 million of total income. The same release identifies $56 million already
      collected but not yet recognized, which supports future recognition visibility
      but is neither ARR nor evidence that the amount remains available as cash. Scale
      indicators include more than 100,000 concurrent learners and more than 700
      enterprises choosing upGrad Enterprise in FY26, but neither metric discloses
      revenue mix, renewal, concentration, realized pricing, or contribution margin.
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI003"
      - "CI006"
      - "CI007"
    tableRefs:
      - "TI001"
    figureRefs:
      - "FI001"
  - id: "profitability-and-cost-path"
    title: "Profitability and Cost Path"
    body: >-
      Management reports that Ind-AS EBITDA increased from $1.6 million in FY25 to
      $13 million in FY26, while net loss narrowed 52% to $13.8 million. Independent
      reporting adds useful caution: the published FY26 headline had not yet been
      independently verified through formal regulatory filings, and an Economic Times
      report described the first eleven months' ₹1,532 crore revenue and ₹38 crore
      profit after tax as provisional and unaudited. The forward margin case is more
      assumption than result. A valuation report cited by ET projects direct costs at
      35.3% of revenue, employee benefits at 19.6%, and SG&A at 20.3%; those forecast
      ratios do not establish current gross margin, CAC payback, or sustainable cash
      generation.
    claimRefs:
      - "CI004"
      - "CI005"
      - "CI008"
      - "CI009"
      - "CI011"
      - "CI012"
    tableRefs:
      - "TI003"
  - id: "pricing-gtm-and-delivery"
    title: "Pricing, GTM, and Service Delivery"
    body: >-
      Public pricing evidence is thin and stale. A company-authored Wellfound profile
      says the first-year data-analytics program enrolled 800 students at a price of
      ₹2 lakh, but that historical example cannot establish current list prices,
      discounts, realized tuition, or financing take-up. The 700-plus enterprise count
      signals a B2B channel but does not reveal contract value, sales cycle, retention,
      or client concentration. A current Trustpilot review alleges that one learner
      paid ₹1.5 lakh, lacked course access for five months, and did not receive a
      refund. That anecdote is not a representative refund rate, but it identifies a
      diligence pathway around service delivery, cancellation exposure, and the quality
      of upfront collections.
    claimRefs:
      - "CI007"
      - "CI015"
      - "CI016"
    tableRefs:
      - "TI002"
  - id: "capital-adequacy-and-verdict"
    title: "Capital Adequacy and Underwriting Verdict"
    body: >-
      Public evidence does not establish current liquidity. Clay reports ₹2.875 billion
      of debt financing in June 2024, while ET reports a valuation model that projects
      annual capital expenditure at 2% to 3% of revenue and a rise from ₹5 crore in
      FY26 to ₹51 crore in FY27. Historical financing raised is not cash available, and
      accounting loss is not cash burn; the sources disclose no current cash balance,
      monthly burn, restricted cash, debt maturity schedule, covenant headroom, or
      funded acquisition obligations. The financial verdict is therefore conditional:
      reported EBITDA and loss trends are constructive, but revenue quality, unit
      economics, capital intensity, and runway cannot be underwritten without audited
      statements and management schedules.
    claimRefs:
      - "CI004"
      - "CI005"
      - "CI013"
      - "CI014"
    tableRefs: []
    figureRefs: []
