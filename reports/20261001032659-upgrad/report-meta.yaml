companyProfile:
  summary: >-
    upGrad is a Mumbai-headquartered professional education and workforce-skilling platform founded in 2015 by Ronnie
    Screwvala, Mayank Kumar, and Phalgun Kompalli. The company now spans online degrees, executive education, test prep,
    study-abroad support, and enterprise L&D, with FY26 disclosures citing more than 100,000 concurrent learners and
    more than 700 enterprise customers. Public reporting shows meaningful profitability improvement in FY26, but the
    company still discloses too little about segment economics, cash, and customer quality to fully underwrite the
    business from public information alone.
