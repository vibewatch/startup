  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 合规监管、反垄断审查与学位资质风险
        blocks:
          - type: paragraph
            body: >-
              upGrad 所处的监管环境极受瞩目，横跨企业并购、高等教育学位资质认证以及数字消费者权益保护等领域。当下最紧迫的监管节点，是拟斥资 Rs 2,055 crore（$218M）收购 SoftBank 支持的
              Unacademy 一案能否获得印度竞争委员会（CCI）批准。该交易旨在整合市场份额并贡献估计约 Rs 500 crore
              的销售额，但任何监管审批延宕、强制资产剥离或附加经营条件均可能打乱整合进度。与此同时，高等教育课程交付亦受制于大学拨款委员会（UGC）监管规定与国家评估与认证委员会（NAAC）门槛。尽管 upGrad 旗下的
              Atlas University 在读学生已增至约 7,500 名，且获 NAAC
              评级认证可在校区之外开展线上学位教育，但未来的增长仍高度取决于常态化监管抽查、高校附属资质审查，以及对印度数字个人数据保护新规的严格合规。
