            - 技术与企业级合作方
        - label: 未披露的底层软件与控制平面
          detail: 指定证据未说明托管方案、组件架构、安全认证、隐私控制、正常运行时间、故障事件或系统吞吐量。
          items:
            - 学习平台架构证据缺口
            - 安全、隐私与系统可靠性证据缺口
    approximationNotes: 基于留存公开证据梳理的运营模式概念分层；并非 upGrad 未披露软件架构的真实呈现。
