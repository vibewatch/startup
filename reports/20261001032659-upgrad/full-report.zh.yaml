            title: 借并购切入全生命周期构筑护城河
            body: >-
              完成对 Unacademy 和 Internshala 的收购后，upGrad 结合原有的高等教育与 B2B 企业内训业务，正全力打造涵盖学员全生命周期的学习护城河。贯通早期应试备考、大学实习、硕博进阶及企业在职
              L&D，为其创造了单一认证竞品难以复制的私有化交叉销售渠道。
