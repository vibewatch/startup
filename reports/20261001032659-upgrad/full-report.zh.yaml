      - number: '3.3'
        title: 定价模式、切换成本与护城河持久度
        blocks:
          - type: paragraph
            body: >-
              高教与技能培训市场的定价与打包模式繁多，横跨订阅制、免费增值（Freemium）、单次购课，以及数千美元的学位分期贷款。LinkedIn Learning 和 DataCamp
              依靠按月或按年订阅变现，Coursera 结合免费旁听与专项进阶订阅，而 upGrad 的核心 C
              端收入则高度依赖昂贵的前置学费，多借由非银金融公司（NBFC）多期分期贷款完成筹资。行业分析表明，一旦具体项目结课，学员在不同培训机构之间的切换成本处于低至中等水平，归根结底是因为
              AI、数据科学与管理类课程的核心内容并无本质壁垒。不仅如此，upGrad
              虽采取高端定位，商业定价却频繁运用捆绑折扣与促销让利，这会侵蚀用户对品牌的价值感知。负面客诉集中于销售过度施压、顾问对高校录取门槛虚假陈述以及录取被拒后退款延宕，反映出激进获客正在透支品牌信任，威胁护城河的长效稳固。
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
      - number: '3.4'
        title: 专栏分析
