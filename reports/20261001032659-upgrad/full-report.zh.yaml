    rows:
      - - 投资建议立场
        - 观察 / 中性
        - 等待经审计的 RoC FY26 报表出炉及 Unacademy 整合审批通过。
      - - 公允股权估值
        - $1.73B（Rs 16,500 crore）
        - 由 Incwert DCF 估值为 Rs 361 crore 内部配股轮次锚定。
      - - 估值倍数
        - 7.9x 净利润 / 7.9x FY26 毛收入
        - 相较全球教育科技同行估值偏高；有赖于 FY31 长期规划兑现。
      - - 风险评级
        - 高
        - 客户满意度下滑、资本支出激增以及困境并购带来的整合管理包袱。
    notes: 基于 Entrackr 与 Economic Times 披露的 Incwert Advisory DCF 估值报告，并结合公司公布的 FY26 未经审计数据。
    claimRefs:
      - CV001
      - CV002
      - CV007
      - CV014
  - id: TV002
    title: 投资逻辑与反向逻辑矩阵
    columns:
      - 投资逻辑维度
      - 核心投资逻辑
      - 反向逻辑 / 下行因素
      - 何时改变观点
    rows:
      - - 经营杠杆
        - 营销与技术支出下降，带动 EBITDA 扩大 8x 至 $13M。
        - 激进削减 SG&A 开支可能损害学员获客与品牌留存。
        - 经审计证实 FY27 持续产生正向经营现金流。
      - - 行业整合
        - 斥资 Rs 2,055 crore 收购 Unacademy，整合应试培训与技能提升业务。
        - 兼并困境资产可能引发新一轮现金消耗，并分散管理层精力。
        - 被收购业务板块成功扭亏并实现 EBITDA 盈亏平衡。
      - - 企业级 L&D 规模
        - 签约超过 700 家企业客户开展 B2B 员工培训。
        - 未披露 NRR 或客户队列集中度，掩盖了潜在流失风险。
        - 披露经审计的企业留存率与多年期在手合同订单。
    notes: 对照已披露的运营瓶颈与并购风险，评估核心增长支柱。
    claimRefs:
      - CV004
      - CV006
      - CV008
      - CV009
  - id: TV003
    title: 情景分析：乐观、基准与悲观估值
    columns:
      - 情景
      - 关键假设与驱动因素
      - 估值区间
      - 概率信号
    rows:
      - - 乐观情景
        - Unacademy 贡献 Rs 500 Cr 销售额；Atlas University 扩张；EBITDA 突破 Rs 200 Cr+。
        - $1.73B – $2.0B
        - 25% —— 取决于业务整合顺畅且利润迅速释放。
      - - 基准情景
        - 保持 12-15% 的稳健内生增长；大学学位业务起量；实现小幅盈利。
        - $1.3B – $1.5B
        - 50% —— 反映增速理性放缓与二级市场折价。
      - - 悲观情景
        - 学员获客成本攀升；退款抵制发酵；资本支出持续消耗直至 FY31。
        - $0.8B – $1.0B
        - 25% —— 在融资遇冷的困境下，估值倍数压缩至 3x-4x sales。
    notes: 多情景测算不同业务执行路径下的潜在估值走向。
    claimRefs:
      - CV007
      - CV009
      - CV011
      - CV012
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 按时间顺序梳理 upGrad 从 2015 年创立，历经激进并购、估值巅峰、业务扭亏，直至斥资 $200M 收购 Unacademy 的发展历程。
    data:
      items:
        - label: 公司创立
          detail: Ronnie Screwvala、Mayank Kumar 与 Phalgun Kompalli 在孟买创立公司，推出数据分析与数字营销课程。
          date: '2015-03-01'
          tone: positive
        - label: 荣获 IAMAI 与 FastCompany 赞誉
          detail: 获 IAMAI 评为教育类最佳技术奖，并入选 FastCompany 印度最具创新力企业前 10 强。
          date: '2018-05-01'
          tone: positive
        - label: Temasek 领投成长轮融资
          detail: 获得由 Temasek Holdings 领投的 $120M 成长轮融资，加速后疫情时代的高等教育业务扩张。
          date: '2021-04-01'
          tone: positive
        - label: 晋升独角兽估值里程碑
          detail: 完成 $225M 一级市场融资，确立独角兽地位，并在全印度扩大大学学位合作伙伴关系。
          date: '2022-06-01'
          tone: positive
        - label: 经营亏损触顶
          detail: FY23 财年录得最高净亏损 ₹1,142 crore ($121M)，促使公司启动全面成本合理化管控。
          date: '2023-03-31'
          tone: negative
        - label: EvolutionX 债权及老股轮次
          detail: 从 EvolutionX 获得 ₹287.5 crore 结构化信贷；Temasek 支持 $60M 轮次且估值锚定在 $2.25B，Screwvala 持股比例提升至 45%。
          date: '2024-10-01'
          tone: neutral
        - label: EBITDA 扭亏与收购 Internshala
          detail: FY25 初步实现 Ind-AS EBITDA 盈利 ₹15 crore；收购 Internshala 90% 股权，打通技能培训与求职招聘。
          date: '2025-03-31'
          tone: positive
        - label: Incwert DCF 估值锚定在 $1.73B
          detail: 在内部配股轮次前，Incwert 估值报告将独立公允企业价值评定为 ₹16,500 crore ($1.73B)。
          date: '2026-02-28'
          tone: neutral
        - label: FY26 经营扭亏为盈
          detail: 公布毛收入 ₹2,070 crore ($219.5M)，EBITDA 激增 8x 至 ₹123 crore ($13M)，净亏损收窄 52% 至 ₹130 crore。
          date: '2026-08-18'
          tone: positive
        - label: 完成收购 Unacademy
          detail: 完成对 Unacademy 价值 $200M (₹1,955 crore) 的收购，吸收 ₹400 crore 营收、₹900 crore 现金及应试培训品类。
          date: '2026-09-01'
          tone: positive
    approximationNotes: 日期对应公开披露月份与财期截止日。估值反映交易基准。
    claimRefs:
      - CO001
      - CO008
      - CO009
      - CO010
      - CO011
      - CO012
      - CO013
      - CO014
