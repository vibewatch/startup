chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司定位、平台范畴与业务体量
        blocks:
          - type: paragraph
            body: >-
              upGrad（注册实体为 UpGrad Education Private Limited）总部设在孟买，是一家创立于 2015 年的在线高等教育、职业进阶与人才发展平台。公司最初由传媒连环创业者 Ronnie
              Screwvala 联手联合创始人 Mayank Kumar 及 Phalgun Kompalli 成立，起步切入契合行业需求的数据分析与数字营销认证，此后横向拓展至本硕学位、高管
              MBA、博士项目、留学升学通道、线下培训和企业内训。到 FY26，upGrad 披露其学历教育与职业培训在读学员超过 100,000 名，旗下 upGrad Enterprise 亦与 700
              多家企业客户展开机构合作。平台在 80% 以上的课程中引入了人工智能，并在内部借助 AI 压降营销获客和平台技术交付成本。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
          - type: table
            tableRef: TO001
            claimRefs:
              - CO002
              - CO003
              - CO009
              - CO010
              - CO011
              - CO012
              - CO013
      - number: '1.2'
        title: 创始人团队、治理结构与高管团队
        blocks:
          - type: paragraph
            body: >-
              upGrad 由 Ronnie Screwvala、Mayank Kumar 与 Phalgun Kompalli 联合创立，Ronnie Screwvala 出任执行董事长与核心战略操盘人。Screwvala
              早年曾创办 UTV Software Communications 并出售给 The Walt Disney Company，在 upGrad
              拥有绝对的经济与经营控制权；他经由老股受让与内部增资，已将个人持股比例提升至约 45%。日常经营则由首席财务官 Mukesh Mundra 掌舵，全面推进财务紧缩、成本优化以及向 Ind-AS
              会计准则过渡。治理架构上，公司获得了新加坡主权财富基金 Temasek Holdings、国际金融公司（IFC）、360 ONE 等重要机构背书，债务融资则引入了 EvolutionX Debt
              Capital。尽管董事会拥有机构席位，但在战略并购整合、资金追加以及债务担保等重大决策上，治理机制依然高度依赖 Screwvala 个人。
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
          - type: table
            tableRef: TO002
            claimRefs:
