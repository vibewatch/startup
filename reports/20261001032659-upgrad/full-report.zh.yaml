            body: >-
              行业结构分析显示，学员在各类线上项目间切换门槛不高。Coursera、Simplilearn 与 Great Learning 等平台的
              AI、机器学习及数据科学核心课程已高度同质化。随着高校伙伴将项目授权给多家平台，upGrad 的定价权很大程度上仰仗就业服务与品牌营销，而非独家知识产权。
