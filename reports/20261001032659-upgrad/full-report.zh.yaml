      - number: '1.3'
        title: 融资历程、真实估值与战略并购
        blocks:
          - type: paragraph
            body: >-
              自成立至 FY26，upGrad 历经 10 轮融资累计获得逾 $780M 股权资本；在 Temasek 支持下，其一级市场交易估值曾于 2024 年底触及 $2.25B 峰值。2026 年 5
              月，公司完成一轮由 Screwvala 个人出资 ₹300 million 领投、Temasek、IFC 及 360 ONE 参投的 ₹361 million（$43M）内部融资；该轮由 Incwert
              Valuation 出具正式现金流折现（DCF）估值报告背书，将 upGrad 独立企业公允价值锚定在 ₹16,500 crore（$1.73B）。经营层面，upGrad 在 FY26
              完成了历时数年的业绩反转：营业总收入同比增长 7% 至 ₹2,070 crore（$219.5M）；Ind-AS EBITDA 由 FY25 的 ₹15 crore（$1.6M）激增逾八倍至 FY26 的
              ₹123 crore（$13M）；全年净亏损则较 FY23 峰值亏损 ₹1,142 crore（$121M）收窄 52% 至 ₹130 crore（$13.8M）。2026 年 9 月 1 日，upGrad 以
              $200M（₹1,955 crore）完成对 Unacademy 的收购，一举囊括在线应试培训类目（UPSC、JEE、NEET、GATE）、₹400 crore 年化运行率收入以及估计约 ₹900 crore
              的现金储备。
