      - number: '1.4'
        title: 用户口碑、交付风险与助学贷依赖
        blocks:
          - type: paragraph
            body: >-
              尽管从集团利润表看，upGrad 交出了扭亏答卷，但公开评价中的消费者满意度与学员服务交付指标却显露实质摩擦。在 Trustpilot 上，upGrad 基于 680 条核实客户评价仅录得 3.7 分（满分 5
              分）；学员自发投诉屡见不鲜，焦点集中于招生顾问激进推销、入学后学术辅导响应迟缓、延期开班申请拖沓，以及退款和取消第三方非银金融公司（NBFC）助学分期贷款受阻等环节。upGrad 的高客单价认证与学位项目高度依赖
              Fibe（EarlySalary）等金融科技 NBFC 伙伴提供的助学贷款分期支持，因此消费信贷监管新规或 NBFC 授信审批收紧，对个人端招生构成了未对冲的经营风险。
            claimRefs:
              - CO015
              - CO016
      - number: '1.5'
        title: 专栏分析
        blocks:
          - type: callout
            title: 并购 Unacademy 的战略意义
            body: >-
              2026 年 9 月 1 日以 $200M 收购 Unacademy，是 upGrad 的结构性转折点。此举除增厚 ₹400 crore 营收并带来估计约 ₹900 crore 的资产负债表流动性外，还将
              upGrad 的潜在客群漏斗延伸至早期的应试备考周期（UPSC、JEE、NEET）。这为公司打通了一条涵盖早期应试辅导、本硕学位、Internshala 职业实习及企业高管培训的一体化链条。
            calloutType: insight
            claimRefs:
              - CO013
              - CO014
          - type: callout
            title: 助学贷款敞口与零售 NBFC 授信风险
            body: >-
              公开评价反映出，依靠 Fibe 等 NBFC 贷款伙伴为课程学费提供分期存在明显隐患。高额学费（通常超 ₹1.5 lakh 至 ₹2
              lakh）通过多期等额本息还款（EMI）支付；一旦学员入学开班延误或高校录取资格被拒，极易激化还贷纠纷。印度央行（RBI）若收紧对零售金融科技信贷的监管，恐将直接抑制生源吸纳与转化。
            calloutType: risk
            claimRefs:
              - CO015
              - CO016
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、品类范畴与潜在支出
        blocks:
          - type: paragraph
            body: >-
              upGrad 处于合规认证在线高等教育与职业技能进阶的交汇点，主打有职业晋升与转型需求的在职人士。其目标市场范畴涵盖研究生文凭、高管 MBA、人工智能与数据科学技术认证，以及企业级员工内训。传统校内 K-12
              教育、全日制住读本科项目，以及缺乏高校正规认证或雇主认可的非正式泛知识网课，均被排除在该边界之外。面对科技人才招聘结构变化与企业自动化浪潮，upGrad
              从早期聚焦技术职业训练营，逐步延伸至高校合作研究生学位、国际升学衔接通道及企业人才发展培训项目。
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
      - number: '2.2'
        title: TAM、SAM、SOM 测算视角与细分现状
        blocks:
          - type: paragraph
            body: >-
              测算 upGrad 的潜在市场，需要将自上而下的宏观教育总体支出拆解为受客观证据约束的可服务细分市场。尽管印度高等教育与成人终身学习总支出达到约 ₹4,00,000
              crore（$48B），但涵盖本硕学位的在线可及市场规模仅约 ₹40,000
              crore（$4.8B）。在更广阔的数字化盘子中，受制于家庭购买力与消费信贷审批门槛，高端在职学位与认证研究生文凭的可服务市场（SAM）被收窄至约 ₹12,000 crore（$1.4B）。按 FY26
              营业总流水 ₹2,000 crore（含税 $219.5M）及 Ind-AS 口径营业净收入 $184M 的业务体量测算，upGrad 约占高端在职客群的 16%，后续增长只能依赖拓展国际市场及渗透 B2B
              企业端。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM014
              - CM015
