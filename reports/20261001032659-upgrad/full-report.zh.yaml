    type: stack
    summary: 公开运营架构逐层展示合作伙伴、课程体系、实操学习、人工支持与成效宣称；底层软件及控制平面仍未披露。
    data:
      layers:
        - label: 买方与学员成效
          detail: 职业转型、学历证书、团队能力与企业转型均为承诺成效；缺乏充分的独立度量。
          items:
            - 个人职业发展与学历证书目标
            - 企业组织能力与业务转型目标
        - label: 职业发展与学员支持
          detail: 导师、教练、顾问及就业服务贯穿整体学习体验。
          items:
            - 导师带教与学习辅导
            - 职业转型支持
        - label: 实操应用学习体验
          detail: 依托平时作业、毕业设计（capstone）、商业案例、沙箱、实操日及原型开发，把课程内容转化为实战技能。
          items:
            - 个人端实战项目与毕业设计
            - 企业端 AI 实践探索
        - label: 课程体系与项目设计
          detail: 课程按学科领域、岗位角色、行业属性及合作方要求组织。
          items:
            - 大学与认证证书课程体系
            - 基于岗位角色与垂类行业构建的企业进阶方向
        - label: 院校机构与交付合作伙伴
          detail: 大学合作方、行业专家、Hexaware、超大规模云厂商及 AI 原生伙伴共同提供学历认证或交付能力。
          items:
