      - number: '7.2'
        title: 规模化运营、学员服务与消费信贷风险
        blocks:
          - type: paragraph
            body: >-
              面对超过 100,000 名在读学员，大规模运营履约显露出严峻的交付漏洞与声誉隐患。Trustpilot 汇总的客户评价反映出显著的用户不满，在 680 条评价中均分仅为 3.7 分（满分 5
              分）。高频客诉直指招生顾问过度推销、课程承诺未兑现、退费遭遇推诿阻挠，以及申请延期开班时沟通严重脱节。此外，upGrad
              高度依赖第三方非银金融公司（NBFC）与金融科技放贷机构为学员提供免息分期还款（EMI）支持。当学员申请退课或遭遇履约瑕疵时，纠纷极易升级为还贷矛盾，从而带来消费者保护问责风险，并可能招致印度储备银行（RBI）对在线教育贷款合作的监管调查。尽管部分垂直项目的就业结果证明其对高自驱学员具有实际价值，但普遍存在的行政流程摩擦恐将推高学员流失率，拉升核心
              C 端业务的获客成本。
            claimRefs:
              - CR003
              - CR004
              - CR008
              - CR012
          - type: table
            tableRef: TR002
            claimRefs:
              - CR003
              - CR004
              - CR008
              - CR012
      - number: '7.3'
        title: 高校合作、企业端依赖与交易对手风险
        blocks:
          - type: paragraph
            body: >-
              upGrad 商业模式的底层脆弱性，在于其运营深度依赖外部高校与企业交易对手。核心学位项目必须依托与 IIIT Bangalore
              及海外高校等名校的品牌合作，才能颁发被市场认可的文凭资质。涵盖高校收入分成、课程交付与内容制作的直接成本，预计平均占收入的
              35.3%；一旦合作协议重新谈判或高校自行开设直营线上学位，营业利润率极易受到冲击。企业端，upGrad Enterprise 在 FY26 服务了 700
              多家企业客户。但企业培训与人才发展（L&D）预算具有极强的顺周期性，科技行业冻结招聘与裁员收缩将直接波及 B2B 收入流。在从 Temasek Holdings 和 Ronnie Screwvala
              等知名资方处累计斩获 $782.7M 风险投资后，妥善处理多层级合作方关系与复杂的股东诉求，对维持业务连续性至关重要。
            claimRefs:
              - CR005
              - CR009
              - CR010
              - CR013
          - type: table
            tableRef: TR003
            claimRefs:
              - CR005
              - CR009
              - CR010
              - CR013
      - number: '7.4'
        title: 财务执行、激进预测与下行情景压力
        blocks:
          - type: paragraph
            body: >-
              尽管 upGrad 在 FY26 报出亮眼的经营反转——营业总收入突破 ₹2,000 crore（$219.5M），Ind-AS 确认总收入达 $184M，Ind-AS EBITDA 激增八倍至
              $13M，净亏损减半至 $13.8M——但长期财务预测却潜藏巨大的执行风险。Incwert Valuation 出具的机密估值报告显示，管理层预测到 FY31，EBITDA 将由 Rs 110 crore 暴增至
              Rs 7,000 crore，净利润亦将达到 Rs 5,334 crore。这一激进目标建立在极度乐观的假设之上：员工福利支出占收入比重将从 51.7% 压缩至 19.6%，销售及一般行政开支（SG&A）也将由
              43.5% 骤降至 20.3%。与此同时，为支撑线下留学咨询中心建设与出海扩张，年度资本开支预计将从 FY26 的 Rs 5 crore 激增至 FY27 的 Rs 51 crore、FY28 的 Rs 383
              crore，并在 FY31 达到 Rs 460 crore。鉴于 FY25 营收增速已放缓至约 5%，一旦激进的成本压降与资本开支规划未能顺利兑现，极易引发资金链断裂及低价流血融资（down-round），正如
              2026 年 2 月公允估值回落至 $1.7B 所折射的那样。
            claimRefs:
              - CR001
              - CR002
              - CR006
              - CR014
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR003
              - CR005
              - CR006
              - CR014
      - number: '7.5'
        title: 专栏分析
        blocks:
          - type: callout
            title: 收购 Unacademy 面临的反垄断审查风险
            body: >-
              拟斥资 Rs 2,055 crore 收购 Unacademy，是吸收竞品规模、增厚估计约 Rs 500 crore
              销售额的关键外延动作。但交易仍在等待印度竞争委员会（CCI）放行，审批附加条件、资产剥离要求或交割推迟均将给整合节点与实际运营带来变数。
            calloutType: risk
            claimRefs:
              - CR002
          - type: callout
            title: 激进的多年期盈利假设与资本开支激增
            body: >-
              估值模型预计资本开支将从 FY26 的 Rs 5 crore 扩大至 FY28 的 Rs 383 crore，EBITDA 到 FY31 飙升至 Rs 7,000
              crore。这一预测完全取决于员工费用占收入比重能否从 51.7% 压缩至 19.6%，且前提是同步推进复杂的并购整合与线下中心网络扩张。
            calloutType: risk
            claimRefs:
              - CR001
              - CR014
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与融资背景
        blocks:
          - type: paragraph
            body: >-
              在印度本土在线教育遭遇全行业深度调整之后，upGrad 展现出了高等教育赛道中最强的规模化韧性。2026 年 5 月的监管文件披露，upGrad 以每股 Rs 40.55 发行强制可转换优先股（CCPS）募资
              Rs 361 crore（约 $38M）；以 Incwert Advisory 出具的独立 DCF 估值报告为准，公司估值为 $1.73B（Rs 16,500 crore）。相比早期评估中 $2.25B
              的入场基准，这一定价代表了估值倍数的理性回调，反映出公司主动贴合低迷的一级市场环境。该轮融资以内部人出资为主，创始人兼董事长 Ronnie Screwvala 个人出资 Rs 300 crore，现有机构投资者
              Temasek、IFC 与 360 ONE 亦有跟投。核心投资逻辑立足于 upGrad 展现出的经营纪律：FY26 营业总收入达 $219.5M（Rs 2,000+ crore），Ind-AS 确认收入
              $184M，EBITDA 激增 8 倍至 $13M。但反向逻辑同样突出：$1.73B 的估值本质上依然偏高，完全仰赖 DCF 模型中对 FY31 营收增至 Rs 15,000 crore、EBITDA 达 Rs
              7,000 crore 的超高速增长假设。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV007
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV006
              - CV008
              - CV009
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV009
              - CV015
      - number: '8.2'
        title: 情景分析与收益回报特征
        blocks:
          - type: paragraph
            body: >-
              评估 upGrad 的风险调整后收益特征，必须拿持续存在的交付与退费摩擦去检验管理层激进的经营杠杆假设。基准情景预计至 FY29 营收年复合增长率（CAGR）维持在温和的 15%，由高校合作学位及 700 多家
              B2B 客户的企业培训驱动，得出公允价值估计约为 $1.3B 至 $1.5B（对应净收入的 5.5 倍至 6.5 倍 EV/sales）。乐观情景假定低估值受困资产整合顺利——特别是拟以 Rs 2,055
              crore（$218M）收购 Unacademy 并增厚 Rs 500 crore 销售额——且 Atlas University 扩张无虞，以此支撑 $1.73B 至 $2.0B
              估值区间。悲观情景则充分考虑运营执行风险、退费维权客诉不断，以及资本开支从 FY26 的 Rs 5 crore 激增至 FY31 的 Rs 460 crore，公允价值被压缩至 $0.8B–$1.0B。
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV007
              - CV009
              - CV011
              - CV012
      - number: '8.3'
        title: 退出准备度与尽调重点
        blocks:
          - type: paragraph
            body: >-
              upGrad 若想通过印度主板首次公开募股（IPO）实现最终流动性退出，必须确立连续多年的法定盈利记录，并化解治理架构与消费者满意度层面的严峻挑战。公司通报在经历 FY23 高达 $121M
              的峰值亏损后，FY26 净亏损已收窄至 $13.8M，然而向印度企业注册局（Registrar of
              Companies）提交的全年正式法定审计财报仍未出炉。消费者口碑风险依然突出：公开评价平台记录了学员对高压招生推销、退款承诺未兑现以及开学入学技术故障的强烈不满。潜在出资人在认可当前估值入场之前，必须要求看清完整股权结构表（cap
              table）、详尽的 CCPS 清算优先权堆叠、独立拆分的企业端合同留存指标，以及经法定审计的可持续经营性现金流证明。
            claimRefs:
              - CV005
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: 专栏分析
        blocks:
          - type: callout
            title: 估值纪律要求跟进未决披露
            body: >-
              尽管 upGrad 在 FY26 将 EBITDA 扩充至 $13M 交出了亮眼的经营反转答卷，但鉴于其 $1.73B 估值仅由内部人主导轮次的内部 DCF
              模型确定，该定价依然偏高。在法定审计财报证实其可持续现金造血能力、且收购 Unacademy 展现出实际价值增厚之前，投资者宜保持「观察」（Track）立场。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV014
