        - Transition into general management or board-level roles
      - - Fresh Graduates & Early Aspirants
        - Recent college graduates and job seekers
        - Entry-level job seekers
        - Parents or family guarantor via student loan
        - Intensive full-time placement-linked bootcamp training
        - Family educational savings or entry-level NBFC loan
        - Campus placement deficits and demand for first tech employment
    notes: Segmentation profiles reflect distinct procurement cycles, decision triggers, and payment methods across individual and enterprise customer segments.
