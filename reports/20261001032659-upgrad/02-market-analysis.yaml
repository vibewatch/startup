      - End User
      - Payer Entity
      - Primary Workflow
      - Budget Ownership
      - Adoption Trigger
    rows:
      - - Mid-Career Tech Professionals
        - Senior Software Developers & Analysts
        - Mid-career engineers seeking role transition
        - Individual learner via NBFC financing or personal savings
        - Evening/weekend live lectures, peer cohorts, capstone projects
        - Household discretionary and career development budget
        - Promotion ceilings, tech layoffs, and generative AI skill obsolescence
      - - Enterprise Corporate L&D
        - Chief Human Resources Officers & VP Talent
        - Corporate engineering and business teams
        - Corporate enterprise employer via corporate training budget
        - Custom cohort curriculum, LMS integration, skill benchmarking
        - Centralized corporate HR / L&D enterprise budget
        - Enterprise AI transformation mandates and retention initiatives
      - - Executive Leaders & General Managers
        - Business Unit Heads and Senior Managers
        - Senior directors and functional leaders
        - Co-funded or individual self-financed tuition
        - Hybrid campus immersions with top global business schools
