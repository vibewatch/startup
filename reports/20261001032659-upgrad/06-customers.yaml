chapter:
  number: 6
  title: "Customers"
  summary: "Company-supplied FY26 disclosures report more than 100,000 concurrent learners and more than 700 enterprise customers, but the assigned evidence does not establish retention, concentration, contract duration, or named external-customer outcomes. The result is credible evidence of aggregate reach, but weak public evidence of customer durability."
sections:
  - id: "segments-and-buyers"
    title: "Segments, Buyers, and Delivery Surfaces"
    body: >-
      upGrad addresses several distinct demand pools rather than one homogeneous customer base.
      Company-supplied FY26 material describes online skilling and degree programs, study-abroad
      services, offline skilling, bootcamps, diplomas, certificates, and enterprise workforce
      development. A third-party profile likewise describes individual, professional, and enterprise
      revenue streams, although it does not provide audited segment economics. The official university
      partner page adds a separate institutional channel: upGrad markets admissions, content, platform,
      and delivery services to universities. These surfaces imply different buyers and renewal
      mechanics, but the public pool provides no segment revenue mix, payer split, or contribution
      margin with which to rank their economic importance.
    claimRefs:
      - "CU003"
      - "CU004"
      - "CU007"
    tableRefs:
      - "TU001"
    figureRefs:
      - "FU001"
  - id: "adoption-and-scale"
    title: "Adoption Scale Is Large but Mostly Aggregate"
    body: >-
      The strongest current adoption evidence is aggregate and company-issued. Syndicated FY26
      disclosures report more than 100,000 concurrent learners across online, study-abroad, and
      offline programs, plus more than 700 enterprises choosing upGrad Enterprise for skilling,
      recruitment, or workforce development. A low-reputation marketing case study separately claims
      a cumulative base above 10 million learners, while another low-reputation profile reports that
      the enterprise client base increased nearly 50% in FY24. These quantities use different
      populations and periods, so they should not be combined into a conversion funnel. None discloses
      unique paid learners, average utilization, enterprise contract value, or cohort-level adoption.
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU006"
      - "CU008"
      - "CU013"
    tableRefs:
      - "TU002"
  - id: "proof-and-reference-quality"
    title: "Named Proof Is Reverse-Direction, Not Customer Validation"
    body: >-
      The pool contains one named production-style deployment, but it runs in the wrong direction for
      customer diligence: Microsoft presents upGrad as Microsoft's customer. That case study says
      Microsoft 365 A5 and Microsoft 365 Copilot supported more than 4,000 active users at upGrad.
      This is useful evidence of upGrad's internal operating scale, not evidence that a named enterprise
      bought upGrad training, renewed a contract, or achieved a workforce outcome. The 700-enterprise
      disclosure and the 100,000-concurrent-learner disclosure remain unnamed aggregates. Accordingly,
      the customer-proof inventory below distinguishes external customer evidence from supplier case
      evidence instead of treating logos, suppliers, and customers as interchangeable.
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU005"
      - "CU016"
    tableRefs:
      - "TU003"
  - id: "durability-and-concentration"
    title: "Durability, Expansion, and Concentration Remain Unverified"
    body: >-
      Public retention evidence is the central weakness. A third-party presentation says long online
      courses experienced low completion and required stronger support, and it also describes high
      customer-acquisition cost from substantial digital marketing. Another low-reputation profile
      identifies placement outcomes as a continuing learner expectation. Company-issued FY26 material
      reports INR 530 crore of collected revenue not yet recognized, but that accounting balance is not
      NRR, GRR, cash available, or proof of renewal. An independent article also cautions that the
      reported FY26 figures were not yet independently verified through regulatory filings when it was
      written. The assigned pool discloses neither retention rates nor top-customer concentration, so
      land-and-expand durability and dependency risk remain diligence gaps rather than quantified facts.
    claimRefs:
      - "CU009"
      - "CU010"
      - "CU011"
      - "CU012"
      - "CU014"
      - "CU015"
callouts:
  - calloutType: "risk"
    title: "Scale is not retention"
    body: >-
      More than 100,000 concurrent learners and more than 700 enterprises establish reported reach,
      but they do not reveal renewal, churn, completion, contract duration, or concentration.
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU014"
      - "CU015"
  - calloutType: "insight"
    title: "The only named deployment is supplier evidence"
    body: >-
      Microsoft's 4,000-plus-user case study validates an internal upGrad deployment of Microsoft
      products; it does not validate outcomes for an external upGrad learner or enterprise customer.
    claimRefs:
      - "CU005"
      - "CU016"
