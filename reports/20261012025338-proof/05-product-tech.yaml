  - id: TE002
    title: Workflow / use-case table
    columns:
      - User Job
      - Current / Legacy Workflow
      - Company Solution
      - Measurable Benefit
      - Limitation
    rows:
      - - Real Estate Mortgage eClosing
        - In-person signing with paper documents, mobile notary dispatch, physical raised stamps
        - Notarize network RON session with digital closing room and multi-party signing
        - Closes loans in hours instead of days; eliminates paper courier overhead
        - Requires state RON legislation and title underwriter acceptance (California permanent RON delayed to 2030)
      - - Business Account Opening & KYB
        - Manual paper document submission, physical tax forms, unverified email signature requests
        - Verified Business Identity automated flow powered by Enigma business data
        - One-time automated entity validation conferring verified badge on transactions
        - Limited to Pro+ and Premium commercial portal tiers; restricted to US entity registries
      - - High-Assurance Identity Verification
        - In-person branch visits, unverified uploaded utility bills, basic SMS OTP authentication
        - NIST IAL2 credentialing via biometric facial matching, credential analysis, and live referees
        - High-assurance tamper-proof audit trails meeting federal identity guidelines
        - Friction of mandatory live referee intervention for non-standard identity documents
      - - Equipment & Commercial Lending
        - Physical Power of Attorney notarization, in-person signing at equipment pickup locations
        - Remote digital notarization and eSignatures with integrated fraud risk screening
        - Compresses funding approval and equipment release cycles from weeks to single days
        - Dependent on local dealership compliance readiness and borrower digital literacy
    notes: Workflow comparisons compiled from company case studies, industry publications, and legal regulatory reviews; transaction velocity benefits represent optimized customer deployments.
    claimRefs:
      - CE002
      - CE004
      - CE005
      - CE011
  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Architecture Component
      - Operational Role
      - Key Dependency
      - Technical / Execution Risk
    rows:
      - - Notarize Network & Referee Engine
        - Schedules, matches, and manages 1,800+ live identity agents and independent notaries
        - Licensed notary supply, WebRTC video streaming, and real-time queue orchestration
        - Peak demand queuing latency and multi-state notary jurisdictional licensing compliance
      - - Defend AI Fraud Risk Engine
        - Monitors transactions and computes predictive risk scores across 400+ signals
        - Historical cross-platform behavioral transaction graph and device telemetry
        - Model drift in response to evolving synthetic identity fraud and deepfake injection attacks
      - - Cryptographic Sealing & PKI
        - Applies digital certificates and cryptographic hashes to guarantee document integrity
        - WebTrust-audited certificate authority infrastructure and Adobe Approved Trust List
        - Private key exposure risk, certificate expiration management, and long-term signature validation
      - - Verified Business Identity Pipeline
        - Executes automated organization KYB verification against legal tax registries
        - Third-party data provider Enigma and government business filing databases
        - Third-party API downtime, data freshness lags, and international corporate entity opacity
    notes: System components and operational risk profiles synthesized from published technical documentation, security audit scopes, and industry trade reviews; internal system SLA metrics are confidential.
    claimRefs:
      - CE003
      - CE005
      - CE008
      - CE010
figures:
  - id: FE001
    title: Product architecture map
    type: stack
    summary: Six-layer functional architecture of the Proof platform illustrating end-to-end transaction security from ingest to cryptographic trust standards.
    data:
      layers:
        - label: Client Ingestion & API Layer
          detail: Web applications, iOS/Android mobile clients, EasyLinks no-code portals, and RESTful developer APIs (Proof and legacy Notarize APIs).
        - label: Identity Verification & KYB Layer
          detail: Biometric selfie matching, government credential optical inspection, KBA challenges, Enigma-powered KYB business verification, and NIST IAL2 protocols.
        - label: Fraud Intelligence & Defense Layer
          detail: Defend risk engine evaluating 400+ behavioral and network signals, transaction anomaly scoring, and Verify deepfake video detection.
        - label: Signing & Workflow Orchestration Layer
          detail: Proof Sign eSignature engine, multi-party routing, on-demand trusted referee dispatch, and in-house notary queue management.
        - label: Notarization Execution Layer
          detail: On-demand notary network with 1,800+ live identity agents, dual-custody audio/video session recording, and digital journal logging.
        - label: Cryptographic Trust & Standards Layer
          detail: WebTrust-audited Digital Organization Certificates, Adobe Approved Trust List integration, MISMO RON standards, and FIDO Alliance agentic identity protocols.
    approximationNotes: Architecture layers represent platform functional capabilities published in technical guides and partner integrations; internal microservice topology is omitted.
    claimRefs:
      - CE001
      - CE003
      - CE006
      - CE007
