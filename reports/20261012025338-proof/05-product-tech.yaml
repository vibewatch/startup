chapter:
  number: 5
  title: Product & Technology
  summary: Proof provides an identity-centric authorization and remote online notarization (RON) platform linking verified signers to legally binding digital transactions. Its architecture spans an on-demand network of 1,800+ live identity agents, multi-signal fraud defense via Defend, cryptographic document sealing, and emerging agentic standards.
sections:
  - id: core-platform-architecture
    title: Core Platform Architecture & Notarize Network
    claimRefs:
      - CE001
      - CE003
      - CE007
      - CE010
    tableRefs:
      - TE003
    figureRefs:
      - FE001
    body: |-
      Proof operates a comprehensive identity-centric security and transaction platform designed to execute legally binding digital agreements, identity verifications, and remote online notarizations. Originally established as Notarize, the company unified its offerings under the Proof brand while retaining Notarize as a dedicated child brand for its notary network. The architecture integrates an on-demand network of over 1,800 live identity agents with automated software workflows that secure more than $200 billion in digital transactions annually across diverse commercial sectors.

      The platform architecture is constructed around three synchronized subsystems: an ingestion and workflow engine supporting standard eSignatures, on-demand trusted referees, and remote online notarizations; an automated risk analysis layer that inspects digital transactions against multi-point fraud heuristics; and a cryptographic sealing infrastructure that binds certified signer attributes directly to digital records. Proof supports dual operating models for notarial sessions, enabling organizations to deploy in-house notaries (IHN) through customer-managed portals while offering automated failover to Proof's 24/7 on-demand notary (ODN) pool when internal capacity is exceeded.
  - id: product-modules-and-identity
    title: Product Modules & Identity Verification Suite
    claimRefs:
      - CE002
      - CE005
      - CE009
      - CE011
    tableRefs:
      - TE001
    body: |-
      The Proof product suite extends beyond conventional document signing into a modular verification hierarchy covering Verify, Identify, Sign, Defend, and Notarize. Proof Sign provides native electronic signatures equipped with signer presence detection, audit logs, and integrated identity verification, positioning the solution as an enterprise alternative to legacy signature providers. Through its Identify and Verify modules, the platform verifies signers using government credential validation, selfie facial matching, and knowledge-based authentication (KBA) compliant with National Institute of Standards and Technology (NIST) Identity Assurance Level 2 (IAL2) standards.

      For commercial counterparties, Proof provides Verified Business Identity, allowing organizations to execute a one-time Know Your Business (KYB) verification process. By integrating with third-party business data provider Enigma, Proof verifies corporate legal entity names, registered addresses, tax identification numbers (TIN/EIN), and domain ownership, conferring a verified badge on outbound signing requests. To protect high-value workflows against evolving synthetic fraud, Proof deployed Defend, an artificial intelligence-driven fraud prevention module that calculates real-time transaction risk scores across more than 400 network signals, complemented by Verify's deepfake detection for agent-supervised interactions.
  - id: workflows-use-cases-and-standards
    title: Workflows, Industry Standards & Compliance
    claimRefs:
      - CE004
      - CE006
      - CE012
      - CE013
    tableRefs:
      - TE002
    body: |-
      Proof's operational workflows serve high-stakes transaction domains including mortgage eClosings, commercial lending, insurance onboarding, equipment leasing, and legal affidavits. By automating identity checks and eliminating physical notary requirements, Proof compresses multi-day closing timelines into minutes while establishing evidentiary audit trails that satisfy strict evidentiary and regulatory standards. Transactions are executed in compliance with Remote Online Notarization laws enacted across 45 or more states, providing cross-border legal enforceability under state uniform acts and interstate recognition frameworks.

      The technical foundation is anchored in rigorous third-party certifications and regulatory compliance standards. Proof maintains SOC 2 Type II compliance, WebTrust auditing, Kantara Initiative NIST IAL2 certification, and Mortgage Industry Standards Maintenance Organization (MISMO) RON certification. Under MISMO standards and ALTA guidelines, Proof ensures tamper-evident document sealing, long-term audio/video record retention, and detailed audit trails recording signer verification events. Furthermore, Proof issues Digital Organization Certificates and notary digital certificates recognized with trusted green checkmarks in Adobe Reader, ensuring non-repudiation and cryptographic validation across international document viewers.
  - id: technical-dependencies-and-risks
    title: Technical Dependencies, Infrastructure & Operational Risks
    claimRefs:
      - CE008
      - CE010
      - CE014
    body: |-
      Proof maintains critical technical and operational dependencies across third-party infrastructure providers, identity registries, and regulatory bodies. Identity verification and business authentication rely heavily on third-party verification services such as Enigma for business entity data, external credential analysis vendors, and state motor vehicle database connections. Disruptions or latency spikes within these external data conduits directly introduce transaction friction, potentially degrading on-demand notarization completion rates or forcing manual session review.

      Furthermore, the platform's operational reliability depends on maintaining a highly trained, geographically distributed network of licensed notaries and trusted referees. Operating an on-demand labor pool introduces complex staffing management, multi-state commission compliance monitoring, and real-time session load balancing. While Proof has expanded into emerging standards such as FIDO Alliance agentic identity protocols (x401) to verify artificial intelligence agents acting on behalf of humans, commercial production telemetry and revenue contribution for agentic authorization remain in early development stages, presenting product-market execution uncertainties outside its core real estate and notarization verticals.
callouts:
  - calloutType: insight
    title: Architectural Evolution from Document Signing to Cryptographic Identity Infrastructure
    claimRefs:
      - CE001
      - CE003
      - CE006
      - CE007
    body: Proof's core technical differentiation lies in replacing passive e-signatures with active cryptographic identity binding. By combining NIST IAL2 identity verification, KYB verification, and real-time fraud scoring across 400+ signals with tamper-evident digital certificate seals, Proof creates an audit-ready evidentiary record that legacy signing tools cannot reproduce without complex third-party stitching.
