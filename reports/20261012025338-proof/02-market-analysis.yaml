  rows:
  - - Remote Online Notarization (RON)
    - Notary network fees, statutory notarization fees, video session recording, digital certificate issuance
    - In-person mobile notary travel expenses, physical paper filing couriers, paper deed storage
    - Title agencies, mortgage lenders, law firms, retail consumers
    - Core historical wedge with on-demand 24/7 notary network and high market share
  - - Identity-Assured eSign
    - Document workflow software, identity proofing (IAL2), biometric liveness checks, audit trail logging
    - Commodity unverified e-signatures, internal document routing without external counterparty risk
    - Enterprise procurement, corporate legal, HR departments, wealth managers
    - Expansion wedge replacing legacy eSign (DocuSign/Adobe) for high-value contracts
  - - Fraud Prevention & Risk Scoring
    - Real-time risk scoring, deepfake injection detection, biometric credential validation (Defend/Verify)
    - General endpoint security, network firewalls, broad consumer identity theft monitoring
    - Chief Risk Officers, compliance officers, fraud operations teams in fintech/banking
    - Defensive differentiation increasing contract value and enterprise retention
  - - Business Identity & KYB
    - Corporate registry verification, TIN/EIN validation, domain credentialing, organization certificates
    - Complex international entity structuring, ongoing beneficial ownership AML investigations
    - B2B marketplaces, procurement teams, vendor management offices
    - Emerging verification standard securing B2B transaction flows via Enigma partnership
  notes: Primary categorization of addressable transaction and identity verification spend boundaries relevant to Proof's
    multi-product platform.
