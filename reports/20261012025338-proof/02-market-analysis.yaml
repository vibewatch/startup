company:
  name: Proof
chapter:
  number: 2
  title: Market Analysis
  summary: Proof operates at the convergence of remote online notarization, electronic signatures, and cryptographic identity
    verification, addressing a market propelled by escalating AI-generated synthetic fraud and federal standardization. While
    the company has demonstrated high volume in real estate transactions, long-term valuation hinges on expanding into broader
    financial services and enterprise verification workflows.
sections:
- id: market-boundary-and-scope
  title: Market Boundary, Category Definitions, and Adjacent Spend
  body: 'Proof defines its addressable operating boundary across three contiguous transaction tiers: statutory remote online
    notarization (RON), identity-assured electronic signatures, and enterprise Know Your Business (KYB) authorization. Historically,
    digital execution vendors bifurcated into commodity signature pads like DocuSign and standalone identity verification
    point solutions. Proof unites these workflows under a unified public-key infrastructure (PKI) architecture that binds
    verified biometric credentials directly to the signed data payload. Included spend spans enterprise document management,
    notary network dispatch fees, IAL2 identity proofing, and automated fraud scoring. Excluded spend encompasses general
    endpoint cybersecurity, internal employee single sign-on, and unverified low-risk document routing where counterparties
    accept basic electronic marks. By positioning its cryptographic certificates across this boundary, Proof addresses high-consequence
    corporate agreements, mortgage settlements, and commercial lending authorizations that cannot tolerate synthetic identity
    fraud or repudiation.'
  claimRefs:
  - CM001
  - CM004
  - CM013
  - CM014
  tableRefs:
  - TM001
- id: sizing-lenses-and-tam
  title: Market Sizing Lenses, Addressable Spend, and TAM/SAM/SOM
  body: Sizing Proof's addressable opportunity requires evaluating multiple distinct analytical lenses rather than relying
    on an unconstrained top-line estimate. At the macroeconomic tier, the Financial Crimes Enforcement Network (FinCEN) identifies
    false records as the second most expensive identity fraud category in the United States, inflicting $45 billion in annual
    damages. Within operational telemetry, Entrust documents that artificial intelligence deepfakes now represent one in five
    biometric fraud attacks, while identity injection attempts surged 40% year-over-year. On the enterprise demand side, Liminal
    survey data indicates that 83% of financial services buyers require a consolidated platform uniting identity verification
    and fraud detection. Proof demonstrated tangible operational scale by processing $150 billion in authorized transactions
    during 2024, expanding real estate volume by 44% counter-cyclically. Nevertheless, total transaction value represents
    the underlying financial assets rather than recognized recurring software spend, leaving exact market capture dependent
    on transaction fee take rates.
  claimRefs:
  - CM002
  - CM005
  - CM006
  - CM009
  - CM011
  - CM012
  tableRefs:
  - TM002
  figureRefs:
  - FM001
- id: buyer-segmentation-and-workflows
  title: Buyer Segments, Budget Ownership, and Procurement Triggers
  body: Enterprise procurement of identity-assured execution spans three core buyer profiles with distinct budgetary authorities
    and compliance mandates. In title and real estate settlement, escrow officers and agency executives procure Proof to execute
    remote closing transactions, frequently passing statutory notary fees through to closing costs while funding platform
    software via settlement operations budgets. For retail and commercial banking, heads of fraud prevention and digital channels
    deploy Proof for wire transfer authorizations and commercial guarantees, allocating risk management capital to curb account
    takeover liabilities. In property and casualty insurance, innovation leaders such as State Farm Ventures invest and partner
    to secure claims documentation against deepfakes. Furthermore, corporate legal teams utilize Proof's KYB verification
    partner Enigma to credential business counterparties during B2B onboarding, consolidating disparate point tools into one
    auditable signature repository.
  claimRefs:
  - CM002
  - CM003
  - CM007
  - CM013
  - CM014
  tableRefs:
  - TM003
- id: growth-drivers-and-adoption-constraints
  title: Growth Drivers, Regulatory Tailwinds, and Adoption Constraints
  body: Market expansion is propelled by structural regulatory catalysts and an escalating threat environment, yet faces meaningful
    adoption headwinds. On the regulatory horizon, federal legislative initiatives like H.R. 1059 (the SECURE Notarization
    Act of 2023) establish interstate recognition and clear technical standards for electronic and remote notarizations, eliminating
    state-by-state legal friction. Concurrently, the proliferation of generative AI deepfakes and automated biometric injection
    attacks forces enterprises to abandon legacy unverified e-signatures in favor of hardware-bound cryptographic certainty.
    However, adoption velocity is constrained by high organizational switching costs, embedded incumbent integrations, and
    prolonged procurement cycles in risk-averse financial institutions. Additionally, Proof's historic concentration in real
    estate closing workflows exposes revenue durability to interest rate volatility, necessitating aggressive customer diversification
    into horizontal corporate contracts and commercial insurance.
  claimRefs:
  - CM005
  - CM006
  - CM008
  - CM010
  - CM011
  - CM012
  - CM015
