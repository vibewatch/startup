callouts:
- calloutType: insight
  title: Convergence of Identity Verification and Transaction Execution
  body: The historical bifurcation between electronic signature tools and Know-Your-Customer verification vendors is collapsing
    under generative AI impersonation threats. Proof is uniquely positioned by binding tamper-evident cryptographic public-key
    infrastructure directly to identity verification workflows.
  claimRefs:
  - CM001
  - CM004
- calloutType: risk
  title: Real Estate Concentration vs. Horizontal Enterprise Expansion
  body: While Proof expanded transaction volume to $150 billion in 2024 with 44% growth in real estate despite depressed home
    sales, its valuation depends heavily on breaking out of mortgage and title dependency into broader financial services
    and insurance.
  claimRefs:
  - CM005
  - CM006
