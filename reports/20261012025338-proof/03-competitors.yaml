callouts:
  - calloutType: "insight"
    title: "The Battle for Identity-Assured Transactions"
    body: "Proof's evolution from a specialized remote notary platform (Notarize) into an identity authorization network represents a strategic imperative to avoid commoditization by DocuSign and Adobe. By embedding biometric verification, live referee verification, and Adobe AATL-compliant certificates into transactions, Proof seeks to establish a premium tier of legally binding digital agreements where basic e-signatures represent an unacceptable fraud liability."
    claimRefs:
      - "CP005"
      - "CP006"
      - "CP007"
      - "CP009"
  - calloutType: "risk"
    title: "Incumbent Bundle and Consolidation Pressures"
    body: "Enterprise IT buyers facing economic pressures frequently seek vendor consolidation, favoring broad e-signature agreements with DocuSign over best-of-breed specialized transaction platforms. If horizontal incumbents enhance their native identity verification and remote notary modules, Proof risks being relegated to high-friction real estate and legal exceptions rather than securing universal enterprise transaction flow."
    claimRefs:
      - "CP001"
      - "CP013"
      - "CP016"
