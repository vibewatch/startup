        title: Go-To-Market Motion and Unit Economics Dynamics
        blocks:
          - type: paragraph
            body: >-
              Proof's commercial go-to-market motion combines self-serve consumer acquisition, partner channel
              integrations, and direct enterprise sales targeting regulated sectors. The company reported expanding its
              customer base to over 8,000 organizations across financial services, healthcare, government, and real
              estate, demonstrating strong commercial momentum. A major driver of enterprise adoption is the convergence
              of identity verification with fraud prevention, as 83% of financial services buyers actively seek unified
              identity and anti-fraud solutions. Unit economics differ sharply between automated identity verification
              and on-demand notary fulfillment. Proof absorbs the cost of issuing WebTrust-compliant cryptographic
              certificates to over 4,000 independent notaries within its network to preserve liquidity and transaction
              reliability, while automated biometric verifications scale with minimal marginal labor expense.
            claimRefs:
