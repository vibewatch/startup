      - number: '2.3'
        title: Buyer Segments, Budget Ownership, and Procurement Triggers
        blocks:
          - type: paragraph
            body: >-
              Enterprise procurement of identity-assured execution spans three core buyer profiles with distinct
              budgetary authorities and compliance mandates. In title and real estate settlement, escrow officers and
              agency executives procure Proof to execute remote closing transactions, frequently passing statutory
              notary fees through to closing costs while funding platform software via settlement operations budgets.
              For retail and commercial banking, heads of fraud prevention and digital channels deploy Proof for wire
              transfer authorizations and commercial guarantees, allocating risk management capital to curb account
              takeover liabilities. In property and casualty insurance, innovation leaders such as State Farm Ventures
              invest and partner to secure claims documentation against deepfakes. Furthermore, corporate legal teams
              utilize Proof's KYB verification partner Enigma to credential business counterparties during B2B
              onboarding, consolidating disparate point tools into one auditable signature repository.
            claimRefs:
              - CM002
              - CM003
              - CM007
              - CM013
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM007
              - CM013
              - CM014
      - number: '2.4'
        title: Growth Drivers, Regulatory Tailwinds, and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              Market expansion is propelled by structural regulatory catalysts and an escalating threat environment, yet
              faces meaningful adoption headwinds. On the regulatory horizon, federal legislative initiatives like H.R.
              1059 (the SECURE Notarization Act of 2023) establish interstate recognition and clear technical standards
              for electronic and remote notarizations, eliminating state-by-state legal friction. Concurrently, the
              proliferation of generative AI deepfakes and automated biometric injection attacks forces enterprises to
              abandon legacy unverified e-signatures in favor of hardware-bound cryptographic certainty. However,
              adoption velocity is constrained by high organizational switching costs, embedded incumbent integrations,
              and prolonged procurement cycles in risk-averse financial institutions. Additionally, Proof's historic
              concentration in real estate closing workflows exposes revenue durability to interest rate volatility,
              necessitating aggressive customer diversification into horizontal corporate contracts and commercial
              insurance.
            claimRefs:
              - CM005
              - CM006
              - CM008
              - CM010
              - CM011
              - CM012
              - CM015
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Convergence of Identity Verification and Transaction Execution
            body: >-
              The historical bifurcation between electronic signature tools and Know-Your-Customer verification vendors
              is collapsing under generative AI impersonation threats. Proof is uniquely positioned by binding
              tamper-evident cryptographic public-key infrastructure directly to identity verification workflows.
            calloutType: insight
            claimRefs:
              - CM001
              - CM004
          - type: callout
            title: Real Estate Concentration vs. Horizontal Enterprise Expansion
            body: >-
              While Proof expanded transaction volume to $150 billion in 2024 with 44% growth in real estate despite
              depressed home sales, its valuation depends heavily on breaking out of mortgage and title dependency into
              broader financial services and insurance.
            calloutType: risk
            claimRefs:
