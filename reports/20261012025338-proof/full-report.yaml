      - number: '7.2'
        title: Operational Reliability, Failure Modes, and Anti-Fraud Defenses
        blocks:
          - type: paragraph
            body: >-
              The rapid emergence of artificial intelligence deepfakes, synthetic identity manipulation, and biometric
              injection attacks represents a critical operational risk for high-value transaction authorization. The FBI
              IC3 reported that cyber-enabled fraud drove an unprecedented $16.6 billion in economic losses in 2024,
              highlighting the intensifying threat landscape confronting online authentication platforms. Proof
              addresses these vectors through Defend, its proprietary fraud intelligence system that continuously
              analyzes over 100 network risk signals and evaluates live video streams with machine learning models
              trained on hundreds of thousands of hours of video data. These controls are reinforced by rigorous
              independent security attestations, including Kantara Initiative IAL2 certification, AICPA SOC 2 Type II
              compliance, MISMO mortgage certifications, and Schellman WebTrust audits. Despite these defensive layers,
              customer reviews and Better Business Bureau records indicate residual operational vulnerabilities: users
              report occasional session disconnects during live video notarization, transactions stuck in verification
              queues, and unexpected document rejections arising from unfamiliar state requirements or technical
              glitches.
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
