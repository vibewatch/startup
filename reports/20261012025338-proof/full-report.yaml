            figureRef: FU001
            claimRefs:
              - CU007
              - CU008
              - CU011
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Counter-Cyclical Market Share Capture
            body: >-
              Proof's 44% transaction growth in real estate during 2024 demonstrates that digital RON and eClosing
              adoption expanded even as nationwide home sales hit multi-decade lows, driven by lenders seeking $444
              per-loan operational savings.
            calloutType: insight
            claimRefs:
              - CU002
