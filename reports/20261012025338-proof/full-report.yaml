              - CM006
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Competitive Landscape: Incumbents, Verticals, and Substitutes'
        blocks:
          - type: paragraph
            body: >-
              The competitive landscape confronting Proof spans four distinct operating fronts: generic electronic
              signature incumbents, specialized real estate settlement and mortgage closing platforms, automated
              biometric identity verification providers, and traditional manual or in-person notarization workflows.
              Historically operating under the brand Notarize, Proof established early dominance in digital remote
              notarization by pairing software workflows with an on-demand network of thousands of commissioned
              notaries. However, mainstream e-signature incumbents such as DocuSign maintain overwhelming distribution
              advantages across Fortune 500 enterprises and horizontal business agreements. DocuSign expanded into
              remote notarization directly via its $38 million acquisition of Liveoak Technologies in 2020, launching
              DocuSign Notary to serve high-value regulated agreements within its existing contract ecosystem.
              Meanwhile, vertical platforms like Snapdocs and Qualia have entrenched their software deep within title
              agencies, closing attorneys, and lender loan origination systems. These vertical vendors often control the
              operational workflow of residential real estate settlement, limiting Proof's leverage when title agencies
              prefer all-in-one closing software suites. At the same time, automated identity verification vendors such
              as Persona, Socure, and Incode provide fast developer-focused KYC APIs, forcing Proof to differentiate by
              combining automated fraud defense with human referee verification and legally binding cryptographic
              notarization. Despite rapid digital adoption across 8,000 enterprise organizations, the largest single
              alternative across regulated markets remains traditional paper-based wet-ink notarization and in-person
              branch closings. Lenders and county recorder offices that hesitate to accept remote digital records or
              require county-by-county paper filings sustain this offline status quo, creating friction against
              universal platform adoption.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
      - number: '3.2'
        title: Feature Comparison and Technical Differentiation
        blocks:
          - type: paragraph
            body: >-
              Proof differentiates against traditional horizontal e-signature and standalone identity verification tools
              through full-stack transaction trust, cryptographic non-repudiation, and human-in-the-loop assurance.
              Legacy e-signature tools capture signature marks and basic IP-timestamp audit trails, but typically lack
              native biometric liveness verification, automated government document forensic analysis, and
              tamper-evident digital certificates. In contrast, Proof incorporates multi-factor signer authentication
              adhering to NIST IAL-2 standards, utilizing biometric facial comparison against government-issued
              credentials alongside knowledge-based authentication challenge questions. To address the emergence of
              generative AI deepfakes and automated synthetic identity fraud, Proof deployed its Defend transaction risk
              engine—which analyzes over 400 real-time risk signals—and Verify, a live agent verification solution
              designed to authenticate individuals in high-stakes environments. Furthermore, Proof's cryptographic
              architecture issues x.509 digital certificates compliant with WebTrust and Adobe Approved Trust List
              (AATL) standards, displaying verifiable green checkmarks in standard PDF viewers to confirm record
              integrity without vendor lock-in. A critical operational moat is Proof's 24/7 on-demand trusted referee
              and notary network, which provides human identity adjudication in less than a second when automated
              algorithms flag anomalies. In contrast, commodity e-signature providers treat identity verification as an
              optional add-on integration, and standalone identity verification providers do not execute legally
              enforceable digital signing, remote notarization, or long-term digital record retention.
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP002
            claimRefs:
              - CP005
              - CP007
              - CP008
              - CP009
              - CP011
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP007
              - CP008
              - CP010
      - number: '3.3'
        title: Commercial Packaging, Pricing Models, and GTM Friction
        blocks:
          - type: paragraph
            body: >-
              Proof's commercial model reflects a hybrid structure combining platform SaaS subscription tiers with
              transaction-based consumption fees. In consumer and small-business segments, single on-demand
              notarizations are billed at fixed transaction fees, while enterprise accounts across financial services,
              insurance, and healthcare purchase annual platform commitments coupled with tiered per-transaction
              verification and notarization charges. In contrast, incumbent horizontal e-signature vendors like DocuSign
              and Adobe Sign primarily monetize through annual per-seat licenses with envelope usage allowances. This
              pricing divergence creates both opportunities and adoption friction. Enterprise procurement teams
              accustomed to predictable per-seat SaaS costs often experience friction evaluating Proof's mixed
              transaction billing, especially when transaction volumes vary with cyclical mortgage and lending activity.
              To mitigate cyclical exposure and broaden enterprise distribution, Proof has executed strategic
              distribution partnerships, securing strategic investment from State Farm Ventures to automate insurance
              verification workflows and partnering with IDEMIA Public Security to establish interoperable verifiable
              digital credentials (VDCs). By embedding its cryptographic transaction capabilities into broader
              enterprise partner ecosystems, Proof seeks to overcome the distribution entrenchment of incumbent
              enterprise platforms.
            claimRefs:
              - CP013
              - CP014
              - CP015
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP013
              - CP014
              - CP016
      - number: '3.4'
        title: Moat Durability, Switching Costs, and Displacement Risks
        blocks:
          - type: paragraph
            body: >-
              Evaluating the long-term durability of Proof's competitive moat reveals structural strengths alongside
              notable displacement risks. Proof's primary defensibility stems from its two-sided notary and referee
              network, proprietary integrations into title and lending systems, and deep compliance alignment with state
              remote online notarization statutes and Adobe AATL standards. Switching costs are moderate to high for
              large enterprises that have deeply integrated Proof's APIs into core underwriting, loan closing, and
              customer onboarding stacks. However, in standard e-signature workflows, switching costs are substantially
              lower, as DocuSign and Adobe Sign benefit from pervasive enterprise familiarity, existing master services
              agreements, and IT vendor consolidation trends. Proof faces displacement risk if enterprise procurement
              departments decide that basic e-signatures paired with standalone identity verification APIs (such as
              Persona or Socure) are 'good enough' for non-notarized transactions, avoiding Proof's premium transaction
              pricing. Additionally, FinCEN regulatory data indicates that false records represent the second most
              costly category of identity fraud in the United States, driving $45 billion in annual illicit activity.
              While this fraud environment highlights the demand for Proof's cryptographic and deepfake detection
              solutions, it also heightens liability and regulatory scrutiny if fraudulent transactions circumvent
              automated checks. Proof's ultimate durability depends on whether its identity authorization network and
              Certify tool can achieve network effects across non-real-estate verticals before horizontal incumbents
              match its cryptographic assurance capabilities.
            claimRefs:
              - CP005
              - CP009
              - CP012
              - CP015
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The Battle for Identity-Assured Transactions
            body: >-
              Proof's evolution from a specialized remote notary platform (Notarize) into an identity authorization
              network represents a strategic imperative to avoid commoditization by DocuSign and Adobe. By embedding
              biometric verification, live referee verification, and Adobe AATL-compliant certificates into
              transactions, Proof seeks to establish a premium tier of legally binding digital agreements where basic
              e-signatures represent an unacceptable fraud liability.
            calloutType: insight
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP009
          - type: callout
            title: Incumbent Bundle and Consolidation Pressures
            body: >-
              Enterprise IT buyers facing economic pressures frequently seek vendor consolidation, favoring broad
              e-signature agreements with DocuSign over best-of-breed specialized transaction platforms. If horizontal
              incumbents enhance their native identity verification and remote notary modules, Proof risks being
              relegated to high-friction real estate and legal exceptions rather than securing universal enterprise
              transaction flow.
            calloutType: risk
            claimRefs:
              - CP001
              - CP013
              - CP016
