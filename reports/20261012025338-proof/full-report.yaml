  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory Compliance, State RON Disparity, and Legal Enforceability
        blocks:
          - type: paragraph
            body: >-
              Proof operates in a legally nuanced environment governed by state notarial statutes rather than a
              harmonized federal framework. Although remote online notarization is recognized across most U.S. states,
              statutory variations in notary jurisdiction, credential analysis standards, and acceptable audio-visual
              recording retention create continuing compliance overhead. Federal legislation intended to establish
              nationwide minimum standards—the SECURE Notarization Act of 2023 (H.R. 1059)—passed the House but remains
              stalled in the Senate Committee on the Judiciary following its referral in February 2023. Consequently,
              remote transactions remain exposed to inconsistent municipal recording practices and potential title
              insurer challenges. Furthermore, document fraud represents a severe national liability vector: FinCEN
              estimates indicate false records cause $45 billion in fraudulent activity annually across the United
              States. Proof mitigates liability through rigorous compliance, yet its Help Center terms explicitly state
              that platform documentation does not constitute legal advice, placing local validity risks squarely upon
              transacting enterprise customers.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR014
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
