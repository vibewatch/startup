              - CE011
      - number: '5.4'
        title: Technical Dependencies, Infrastructure & Operational Risks
        blocks:
          - type: paragraph
            body: >-
              Proof maintains critical technical and operational dependencies across third-party infrastructure
              providers, identity registries, and regulatory bodies. Identity verification and business authentication
              rely heavily on third-party verification services such as Enigma for business entity data, external
              credential analysis vendors, and state motor vehicle database connections. Disruptions or latency spikes
              within these external data conduits directly introduce transaction friction, potentially degrading
              on-demand notarization completion rates or forcing manual session review.


              Furthermore, the platform's operational reliability depends on maintaining a highly trained,
              geographically distributed network of licensed notaries and trusted referees. Operating an on-demand labor
              pool introduces complex staffing management, multi-state commission compliance monitoring, and real-time
              session load balancing. While Proof has expanded into emerging standards such as FIDO Alliance agentic
              identity protocols (x401) to verify artificial intelligence agents acting on behalf of humans, commercial
              production telemetry and revenue contribution for agentic authorization remain in early development
              stages, presenting product-market execution uncertainties outside its core real estate and notarization
              verticals.
            claimRefs:
              - CE008
              - CE010
              - CE014
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Architectural Evolution from Document Signing to Cryptographic Identity Infrastructure
            body: >-
              Proof's core technical differentiation lies in replacing passive e-signatures with active cryptographic
              identity binding. By combining NIST IAL2 identity verification, KYB verification, and real-time fraud
              scoring across 400+ signals with tamper-evident digital certificate seals, Proof creates an audit-ready
              evidentiary record that legacy signing tools cannot reproduce without complex third-party stitching.
            calloutType: insight
            claimRefs:
              - CE001
              - CE003
              - CE006
              - CE007
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Buyer Personas
        blocks:
          - type: paragraph
            body: >-
              Proof organizes its commercial customer base into three primary buyer and user categories: mortgage
              lenders, title and settlement agencies, and general commercial enterprises. Mortgage lenders represent a
              foundational transactional constituency, deploying Proof's remote online notarization (RON) and eClosing
              tools to accelerate digital loan fulfillment and secondary-market saleability. Title agents and settlement
              attorneys operate as critical operational nodes in property transactions, utilizing the platform to
              coordinate escrow closings, manage document packages, and execute notarizations with remote signers.
              General commercial enterprises increasingly adopt Proof Sign and Business Pro+ plans to execute corporate
              agreements, human resources documentation, and vendor contracts. Additionally, independent notaries access
              Proof's on-demand network to receive transaction volume around the clock, functioning as a decentralized
              fulfillment engine. While Proof markets comprehensive coverage across these segments, commercial
              contribution remains heavily weighted toward real estate closing workflows, where buyer persona
              requirements are deeply intertwined with title agent operational preferences and lender compliance
              mandates.
            claimRefs:
              - CU007
              - CU009
              - CU014
          - type: table
            tableRef: TU001
            claimRefs:
              - CU007
              - CU009
              - CU014
      - number: '6.2'
        title: Adoption Trajectory and Transaction Volume Scale
        blocks:
          - type: paragraph
            body: >-
              Proof's operational scale has demonstrated significant throughput expansion, reaching $150 billion in
              authorized platform transactions in 2024. Despite a historic downturn in U.S. residential real estate and
              lowest home sales since 1995, Proof recorded 44% year-over-year volume growth in the real estate sector.
              This counter-cyclical growth indicates ongoing market share capture from paper-based closing processes,
              driven by measurable lender cost savings. An independent evaluation by MarketWise Advisors established
              that full eClosing with online notarization saves lenders up to $444 per loan and settlement agents up to
              $100 per transaction through eliminated shipping, reduced cycle times, and reduced document errors.
              However, the Mortgage Bankers Association's documentation of sharp origination contractions and rising
              origination expenses highlights the cyclical volatility inherent in mortgage-driven software revenues.
              Without published disclosures breaking down annual recurring revenue (ARR) versus usage-based transaction
              fees, the exact financial durability of this transaction throughput across different housing cycles
              remains a crucial diligence question.
            claimRefs:
              - CU001
              - CU002
              - CU006
              - CU012
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU002
              - CU003
      - number: '6.3'
        title: Production Deployments and Named Customer Proof
        blocks:
          - type: paragraph
            body: >-
              Verified production case studies substantiate that Proof has transitioned key enterprise accounts beyond
              initial pilots into high-volume digital workflows. In residential lending, United Wholesale Mortgage (UWM)
              represents a premier reference deployment, where independent mortgage brokers completed over 30,000
              digital closings and refinancings on Proof in 2025 across signers in nearly every state. Outside
              residential mortgage origination, commercial finance lender Alliance Funding Group replaced paper mailing
              with Proof RON, reducing power-of-attorney execution times from days to hours. In consumer platforms,
              rental marketplace Avail deployed Proof identity verification to establish verified identities between
              landlords and prospective tenants, preventing fraudulent listings and forged credentials. Furthermore,
              State Farm Ventures formed a strategic investment and commercial partnership with Proof to deploy digital
              verification across insurance documentation. These reference accounts prove that Proof's identity
              authorization platform delivers verifiable operational outcomes across multiple verticals, although
              comprehensive data regarding contract durations, annual contract values, and logo retention among
              mid-market customers remains closely held.
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU010
          - type: table
            tableRef: TU003
            claimRefs:
