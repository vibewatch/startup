              - CR010
              - CR012
              - CR013
      - number: '7.4'
        title: Investment Implications, Thesis-Break Triggers, and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              From an underwriting perspective, Proof possesses defensible technical infrastructure and prestigious
              institutional certifications, but faces distinct macroeconomic, legal, and operational risks. Key
              thesis-break triggers include: first, judicial invalidation or state appellate rulings rejecting
              out-of-state remote online notarizations for real estate deeds, which would sever volume from conservative
              title underwriters; second, prolonged depression in national mortgage refinance and purchase transactions
              exceeding Proof's non-real-estate expansion velocity; and third, any successful deepfake bypass or
              biometric spoofing incident on the Defend platform resulting in significant commercial loan fraud or
              financial loss. Diligence must focus on establishing audited non-real-estate revenue share, tracking
              enterprise churn related to session reliability glitches reported in Better Business Bureau complaints,
              and verifying contingency failover mechanisms for single-source data providers such as Enigma.
            claimRefs:
              - CR001
              - CR005
              - CR008
              - CR014
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Housing Market Concentration Risk
            body: >-
              With over $640 billion in cumulative real estate transactions secured and mortgage closings forming
              Proof's core historic volume, persistent stagnation in home purchase or refinance activity directly
              impacts transaction velocity and platform fee revenues.
            calloutType: risk
            claimRefs:
              - CR008
              - CR009
          - type: callout
            title: Legal Enforceability and Interstate Friction
            body: >-
              Although 24/7 on-demand notarization is technically operational across all 50 states, interstate
              recognition disparities and the stalled federal SECURE Notarization Act leave local recording and county
              acceptance vulnerable to jurisdictional challenge.
            calloutType: insight
            claimRefs:
              - CR001
              - CR002
              - CR014
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Recommendation
        blocks:
          - type: paragraph
            body: >-
              Proof occupies an exceptional market position as the premier remote online notarization (RON) network in
              the United States, processing over $200 billion in annual transaction volume across 8,000 enterprise
              organizations. The core investment thesis rests on the platform's demonstrated ability to expand from
              statutory real estate notarization into a broader identity authorization network securing digital
              commerce, insurance verifications, and high-value payments. Landmark distribution agreements with Visa and
              strategic equity backing from State Farm Ventures validate the platform's multi-industry enterprise appeal
              and technical credibility.


              Despite these substantial commercial achievements, our investment recommendation remains firmly set at
              Research-More with a High risk rating and a Stretched valuation stance. This recommendation is governed by
              persistent financial opacity regarding audited annual recurring revenue (ARR), gross profit margins, and
              net revenue retention (NRR). While private market filings from Forge Global establish a post-money
              valuation of $986.73 million following its October 2025 Series E financing, historical revenue estimates
              of $80.0 million from Sacra imply a forward revenue multiple between 10x and 12x. In the absence of
              audited subscription metrics, committing new growth capital at this valuation implies excessive downside
              exposure.
            claimRefs:
              - CV001
              - CV004
              - CV006
              - CV007
              - CV008
              - CV010
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV009
              - CV010
      - number: '8.2'
        title: Thesis and Anti-Thesis Dynamics
        blocks:
          - type: paragraph
            body: >-
              Evaluating Proof requires weighing a compelling operational thesis against concrete structural
              counterarguments. On the thesis side, Proof is establishing defensible network moats. Its rollout of Proof
              Certificates adhering to WebTrust standards and reusable biometric Digital IDs compliant with NIST IAL2
              specifications significantly differentiates Proof from legacy e-signature commodities. Furthermore,
              integrating Proof's cryptographic identity rails with Visa Direct creates an unprecedented entry point
              into $55 trillion in global money movement flows, expanding the total addressable market well beyond title
              and escrow offices.


              Conversely, the anti-thesis highlights critical vulnerabilities in Proof's revenue quality and macro
              defensibility. Sacra's diligence underscores that the real estate sector still accounts for a substantial
              majority of Proof's transactional volume, leaving the company heavily exposed to cyclical mortgage rate
              volatility and depressed transaction turnover. Moreover, while total equity funding stands at $225.6
              million with clean 1.0x non-participating liquidation preferences, the October 2025 financing revealed
              internal capital structure stress. Investors should demand verified operational indicators before treating
              Proof as a secular identity software provider.
            claimRefs:
              - CV002
              - CV003
              - CV006
              - CV007
              - CV009
              - CV011
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
              - CV006
              - CV007
              - CV009
              - CV010
              - CV011
              - CV012
      - number: '8.3'
        title: Financing Context and Scenario Analysis
        blocks:
          - type: paragraph
            body: >-
              Proof's capital structure and round history provide vital context for establishing entry price discipline.
              At its peak venture round in March 2021, Proof raised $130 million in Series D capital at a $758.5 million
              post-money valuation, representing a rich 30.3x multiple on 2021 revenue of $25.0 million. Subsequent
              market rationalization led to the October 2025 Series E round, which achieved a nominal step-up to a
              $986.73 million valuation. However, filings reveal that this financing was split into a $4.2 million
              primary Series E tranche at $19.40 per share and an $11.35 million Series E-1 tranche priced at $15.52 per
              share.


              The discounted Series E-1 price of $15.52 per share sits meaningfully below the $18.09 per share price set
              in the 2021 Series D financing, signaling clear down-tier pricing adjustments among insider syndicates. To
              model risk-adjusted outcomes over a three-year horizon, our scenario framework evaluates bull, base, and
              bear paths. Under our base case (55% probability), revenue compounds at 20% to 25% reaching $115 million,
              which at a normalized 7.0x multiple yields an $805 million enterprise value—representing an 18% loss
              against the nominal Series E post-money mark.
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV009
              - CV010
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV009
              - CV010
      - number: '8.4'
        title: Recommendation Logic and Diligence Priorities
        blocks:
          - type: paragraph
            body: >-
              The decision logic guiding our Research-More recommendation follows a sequential evaluation of operational
              proof points versus information gaps. Proof has successfully demonstrated product-market fit, enterprise
              scale, and cross-vertical traction, as shown by its expansion into equipment leasing and verified business
              identity workflows with partner Enigma. However, because transaction-based notary revenue commands lower
              public multiples than true recurring software subscriptions, underwriting an investment at a near-$1.0
              billion valuation without transparent financial statements creates unacceptable risk of capital
              impairment.


              To advance to an affirmative investment stance, phase-two diligence must obtain concrete operating
              schedules. Key requirements include: (1) audited GAAP financial statements breaking out software
              subscription ARR from transaction-based notary volume; (2) cohort-level net revenue retention (NRR) and
              gross margin trends across mortgage versus non-mortgage verticals; and (3) commercial conversion
              benchmarks for the Visa and State Farm partnerships demonstrating realized transaction monetization.
            claimRefs:
              - CV006
              - CV007
              - CV011
              - CV012
              - CV013
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV006
              - CV007
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Withhold Growth Investment Pending Financial Verification
            body: >-
              While Proof demonstrates impressive scale with $200B+ in annual transaction flow and strong enterprise
              validation from Visa and State Farm, the company's lack of disclosed ARR, margin, and retention data makes
              the ~$987M Series E valuation unsupportable for new growth capital. Investors should maintain a
              Research-More posture.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV006
              - CV007
              - CV008
          - type: callout
            title: Down-Tier Pricing Signals Underlying Valuation Friction
            body: >-
              The bifurcation of Proof's October 2025 Series E into a $19.40 Series E tranche and a discounted $15.52
              Series E-1 tranche signals internal valuation tension and investor resistance to peak multiples,
              underscoring the risk of multiple compression in subsequent liquidity events.
            calloutType: risk
            claimRefs:
              - CV002
              - CV003
              - CV010
