      - - Network Scale
        - >-
          Visa collaboration and 8,000 enterprise customers establish high switching costs and defensible network
          effects for digital credentials.
        - Partnership announcements may take multiple years to convert into high-margin recurring software revenue.
        - Demonstrated transaction monetization from Visa Direct flows and verified third-party API integration revenue.
      - - Capital Structure
        - >-
          Total funding of $225.6M with clean 1.0x non-participating preferred terms provides a stable balance sheet
          through market volatility.
        - >-
          Series E-1 discount ($15.52/share vs $18.09 Series D) signals capitalization friction and selective investor
          skepticism.
        - >-
          Closing a clean, up-round Series F led by a top-tier institutional investor with no down-tier preference
          tranches.
      - - Product Defensibility
        - >-
          Proof Certificates and IAL2-compliant reusable Digital IDs raise switching moats against legacy e-signature
          providers.
        - >-
          Deepfake fraud risks and regulatory shifts in state RON statutes could impose substantial operational and
          legal liabilities.
        - >-
