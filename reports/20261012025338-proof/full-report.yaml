  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Revenue & Growth Assumptions
      - Target Multiple & Implied Valuation
      - Key Risk Drivers
      - Probability Signal
    rows:
      - - Bull Case
        - ARR accelerates to $150M+ driven by rapid enterprise adoption of Visa identity flows and equipment financing.
        - 12.0x ARR multiple yielding $1.80B valuation (1.8x MOIC / 22% 3-year IRR).
        - Execution delays in enterprise sales cycles and renewed macro interest rate headwinds.
        - 20% (requires immediate conversion of strategic partnerships into high-margin recurring ARR)
      - - Base Case
        - Revenue compounds at 20-25% reaching $115M ARR, with real estate stabilizing and moderate identity expansion.
        - 7.0x ARR multiple yielding $805M valuation (-18% vs Series E mark / flat return).
        - Margin compression from customer support and continued mortgage volume cyclicality.
        - 55% (reflects historical 33% growth deceleration and modest expansion outside core title workflows)
      - - Bear Case
        - Mortgage volumes stagnate, non-real estate traction stalls, and revenue declines or flattens at $70M.
        - 4.0x revenue multiple yielding $280M valuation (-72% vs Series E mark).
        - Significant multiple compression, down-round recapitalization, and senior liquidation overhang.
        - 25% (supported by internal down-tier pricing observed in the Series E-1 financing tranche)
    notes: >-
      Projections assume a 3-year holding period from October 2026; valuations calibrated against public identity and
      transaction software multiples.
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV005
      - CV009
