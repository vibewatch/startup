chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity and Platform Evolution
        blocks:
          - type: paragraph
            body: >-
              Proof operates an enterprise identity authorization and transaction verification network designed to
              cryptographically secure digital interactions and legal agreements. Founded in 2015 as Notarize, Inc. in
              Boston, Massachusetts, the organization built the nation's largest on-demand remote online notarization
              (RON) network before completing a comprehensive corporate rebrand to Proof in September 2023. The platform
              has broadened its scope beyond real estate notarization into a multi-product trust suite comprising
              Notarize, Verify, Defend, and Certify, designed to prevent synthetic identity fraud and deepfake
              impersonation across banking, auto finance, and legal transactions. Proof also offers Know Your Business
              (KYB) organizational verification through a data partnership with Enigma, enabling corporate entities to
              cryptographically validate their credentialed identity before counter-parties.
            claimRefs:
              - CO001
              - CO002
              - CO008
              - CO009
              - CO014
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO005
              - CO006
              - CO007
              - CO008
              - CO009
              - CO010
              - CO015
      - number: '1.2'
        title: Executive Leadership and Regulatory Advocacy
        blocks:
          - type: paragraph
            body: >-
              Proof's leadership structure is anchored by founder and Chief Executive Officer Patrick Kinsel, an
              entrepreneur who previously built and sold mobile data collection startup Spindle to Twitter in 2013.
              Following an administrative failure where a notary failed to countersign legal acquisition paperwork,
              Kinsel co-founded Notarize alongside Adam Pase to modernize paper-based legal execution. Pase, a former
              congressional policy advisor to Representative Dennis Moore, spearheaded statutory advocacy initiatives
              that helped secure remote online notarization legislation across 38 states. This legislative moat was
              pivotal in expanding legal recognition for camera-based notarization across state jurisdictions. While
              executive retention has stabilized following early financing turbulence, the business maintains high
              key-person dependence on Kinsel's strategic vision as it pivots into artificial intelligence agent
              authorization and cryptographic identity standards.
            claimRefs:
              - CO001
              - CO003
              - CO004
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO003
              - CO004
      - number: '1.3'
        title: Capitalization History and Institutional Backing
        blocks:
          - type: paragraph
            body: >-
              Proof has raised over $213 million in cumulative equity capital across primary financing rounds to fund
              platform infrastructure and national regulatory advocacy. The company's principal institutional funding
              benchmark occurred in March 2021 with a $130 million Series D financing round led by fintech specialist
              Canapi Ventures, valuing the business at $760 million post-money. Existing venture sponsors participating
              in earlier rounds include Camber Creek and Polaris Partners. In late 2024, State Farm Ventures completed a
              strategic equity investment in Proof to support automated fraud prevention tools across insurance
              underwriting and policy claims workflows. However, secondary trading marks and subsequent bridge rounds
              have not disclosed comprehensive cap table rights, liquidation preferences, or anti-dilution structures,
              leaving contemporary private valuation multiples unverified against public comparable software benchmarks.
            claimRefs:
              - CO005
              - CO006
              - CO010
              - CO015
          - type: table
            tableRef: TO003
            claimRefs:
              - CO005
              - CO006
              - CO010
      - number: '1.4'
        title: Operational Scale, Adverse Events, and Roadmap Milestones
        blocks:
          - type: paragraph
            body: >-
              Proof's commercial adoption has demonstrated resilience amid fluctuating macroeconomic conditions,
              reporting $150 billion in authorized transactions in 2024 with 44 percent annual volume growth in real
              estate closings. The company's developmental path has nevertheless weathered significant adverse
              operational disruptions. In December 2016, litigation initiated by Kinsel's brother John Nelligan via
              Corsa alleged improper commercial appropriation of regional goodwill before being dismissed. In early
              2018, the withdrawal of a lead institutional real estate investor from a planned Series B round forced a
              $1 million founder liquidity loan and a 30 percent staff layoff. Recent milestones underscore product
              diversification, including native Adobe Reader integration via WebTrust-audited Proof Certificates in 2024
              and the rollout of x401, an open HTTP-native protocol for cryptographically verifying autonomous
              artificial intelligence agents.
            claimRefs:
              - CO006
              - CO007
              - CO010
              - CO011
              - CO012
              - CO013
