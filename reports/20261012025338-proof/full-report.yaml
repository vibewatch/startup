      - number: '6.4'
        title: Customer Journey, Expansion Dynamics, and Concentration Risks
        blocks:
          - type: paragraph
            body: >-
              Proof's customer journey expands from single transaction fulfillment into enterprise-wide identity
              governance. Organizations typically initiate usage through targeted remote notarizations or eSign
              workflows, frequently catalyzed by lender mandates or urgent closing deadlines. As transaction volumes
              stabilize, enterprises embed Proof via API integrations, adopting Proof Sign for general contract
              execution and deploying Know Your Business (KYB) verification to credential organizational counterparties.
              The rollout of WebTrust-compliant Proof Certificates and deepfake detection tools (Verify) establishes a
              pathway to upsell customers from commoditized eSign into premium fraud mitigation and risk scoring
              (Defend). Nonetheless, significant customer concentration and discovery friction persist. Real estate
              transactions continue to generate the majority of platform activity, exposing Proof to lender
              consolidation and title agency churn. Concurrently, external brand collision with unrelated B2B platforms
              such as Southern Glazer's wholesale ordering system complicates organic customer acquisition in web search
              channels, underscoring the necessity of direct sales channels to maintain enterprise expansion momentum.
            claimRefs:
              - CU008
              - CU011
              - CU013
