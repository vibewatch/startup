      - number: '4.4'
        title: Financial Verdict and Underwriting Diligence Blockers
        blocks:
          - type: paragraph
            body: >-
              From an institutional diligence perspective, Proof presents a high-volume platform operating behind strict
              financial confidentiality. The company has publicly shared milestone statistics, including $150 billion in
              2024 authorized transaction volume and cumulative volumes surpassing $500 billion, yet withholds GAAP
              revenue, recurring software ARR, net retention, gross margins, and cash burn rates. While Proof claimed
              44% growth in real estate volume during a housing market trough, transaction velocity cannot substitute
              for verified revenue quality or positive unit contribution margins. Until management provides audited
              income statements and cohort-level retention data under confidential disclosure, underwriting Proof's
              forward capital runway and secondary market valuation remains blocked.
            claimRefs:
              - CI002
              - CI003
              - CI013
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Bifurcated Unit Economics: Automated Software Versus Human Network'
            body: >-
              Proof's financial profile is fundamentally determined by the operational divergence between its
              high-margin automated identity verification products and its labor-intensive on-demand notary network.
              While API-driven identity verification and digital credentialing scale at near-zero marginal cost, notary
              sessions require human witnesses and certificate subsidies that compress blended transaction margins.
            calloutType: insight
            claimRefs:
              - CI008
              - CI009
              - CI012
          - type: callout
            title: 'Underwriting Impasse: Secondary Valuation Unanchored by Disclosed Fundamentals'
            body: >-
              Without verified disclosure of current ARR, gross margin percentage, net revenue retention, or operating
              burn rate, investors cannot rigorously validate whether Proof's historical capital raises and secondary
              market valuations reflect sustainable SaaS economics or an overcapitalized business navigating cyclical
              mortgage transaction exposure.
            calloutType: risk
            claimRefs:
              - CI003
              - CI006
              - CI013
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Core Platform Architecture & Notarize Network
        blocks:
          - type: paragraph
            body: >-
              Proof operates a comprehensive identity-centric security and transaction platform designed to execute
              legally binding digital agreements, identity verifications, and remote online notarizations. Originally
              established as Notarize, the company unified its offerings under the Proof brand while retaining Notarize
              as a dedicated child brand for its notary network. The architecture integrates an on-demand network of
              over 1,800 live identity agents with automated software workflows that secure more than $200 billion in
              digital transactions annually across diverse commercial sectors.


              The platform architecture is constructed around three synchronized subsystems: an ingestion and workflow
              engine supporting standard eSignatures, on-demand trusted referees, and remote online notarizations; an
              automated risk analysis layer that inspects digital transactions against multi-point fraud heuristics; and
              a cryptographic sealing infrastructure that binds certified signer attributes directly to digital records.
              Proof supports dual operating models for notarial sessions, enabling organizations to deploy in-house
              notaries (IHN) through customer-managed portals while offering automated failover to Proof's 24/7
              on-demand notary (ODN) pool when internal capacity is exceeded.
            claimRefs:
              - CE001
              - CE003
              - CE007
              - CE010
          - type: table
            tableRef: TE003
            claimRefs:
              - CE003
              - CE005
              - CE008
              - CE010
