          - type: callout
            title: Opacity in Retention and Revenue Concentration
            body: >-
              While Proof demonstrates production proof with major accounts like United Wholesale Mortgage, the absence
              of disclosed net revenue retention (NRR) and vertical concentration metrics obscures customer durability
              through mortgage downcycles.
            calloutType: risk
            claimRefs:
