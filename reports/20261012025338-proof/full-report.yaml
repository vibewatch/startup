      - number: '7.3'
        title: Counterparty Dependencies, Housing Cyclicality, and Entity Administration
        blocks:
          - type: paragraph
            body: >-
              Proof displays significant business model concentration in the real estate settlement ecosystem, having
              historically facilitated more than $640 billion in real estate transactions. While the platform
              demonstrated resilience in 2024 by authorizing $150 billion in total transactions and recording 44% growth
              in real estate volume despite U.S. existing home sales dropping to multi-decade lows, its growth
              trajectory remains intrinsically coupled to mortgage origination and housing turnover. To diversify beyond
              real estate, Proof has expanded into enterprise eSign and formed strategic partnerships, notably securing
              an investment from State Farm Ventures to deploy digital identity verification across insurance claims and
              underwriting. Operationally, Proof exhibits partner dependency on Enigma Technologies, which supplies
              automated Know Your Business verification data for customer onboarding. Additionally, Proof maintains dual
              corporate identities: while customer-facing branding transitioned to Proof, business operations, customer
              invoicing, and check payments remain administered under Notarize, Inc. (dba Proof.com), requiring client
              IT adjustments and corporate allow-list updates.
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
          - type: table
            tableRef: TR003
            claimRefs:
