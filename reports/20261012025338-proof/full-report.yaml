  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Category Definitions, and Adjacent Spend
        blocks:
          - type: paragraph
            body: >-
              Proof defines its addressable operating boundary across three contiguous transaction tiers: statutory
              remote online notarization (RON), identity-assured electronic signatures, and enterprise Know Your
              Business (KYB) authorization. Historically, digital execution vendors bifurcated into commodity signature
              pads like DocuSign and standalone identity verification point solutions. Proof unites these workflows
              under a unified public-key infrastructure (PKI) architecture that binds verified biometric credentials
              directly to the signed data payload. Included spend spans enterprise document management, notary network
              dispatch fees, IAL2 identity proofing, and automated fraud scoring. Excluded spend encompasses general
              endpoint cybersecurity, internal employee single sign-on, and unverified low-risk document routing where
              counterparties accept basic electronic marks. By positioning its cryptographic certificates across this
              boundary, Proof addresses high-consequence corporate agreements, mortgage settlements, and commercial
              lending authorizations that cannot tolerate synthetic identity fraud or repudiation.
            claimRefs:
              - CM001
              - CM004
              - CM013
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM004
              - CM013
              - CM014
              - CM015
      - number: '2.2'
        title: Market Sizing Lenses, Addressable Spend, and TAM/SAM/SOM
        blocks:
          - type: paragraph
            body: >-
              Sizing Proof's addressable opportunity requires evaluating multiple distinct analytical lenses rather than
              relying on an unconstrained top-line estimate. At the macroeconomic tier, the Financial Crimes Enforcement
              Network (FinCEN) identifies false records as the second most expensive identity fraud category in the
              United States, inflicting $45 billion in annual damages. Within operational telemetry, Entrust documents
              that artificial intelligence deepfakes now represent one in five biometric fraud attacks, while identity
              injection attempts surged 40% year-over-year. On the enterprise demand side, Liminal survey data indicates
              that 83% of financial services buyers require a consolidated platform uniting identity verification and
              fraud detection. Proof demonstrated tangible operational scale by processing $150 billion in authorized
              transactions during 2024, expanding real estate volume by 44% counter-cyclically. Nevertheless, total
              transaction value represents the underlying financial assets rather than recognized recurring software
              spend, leaving exact market capture dependent on transaction fee take rates.
            claimRefs:
              - CM002
              - CM005
              - CM006
              - CM009
              - CM011
              - CM012
