              - CE003
              - CE006
              - CE007
      - number: '5.2'
        title: Product Modules & Identity Verification Suite
        blocks:
          - type: paragraph
            body: >-
              The Proof product suite extends beyond conventional document signing into a modular verification hierarchy
              covering Verify, Identify, Sign, Defend, and Notarize. Proof Sign provides native electronic signatures
              equipped with signer presence detection, audit logs, and integrated identity verification, positioning the
              solution as an enterprise alternative to legacy signature providers. Through its Identify and Verify
              modules, the platform verifies signers using government credential validation, selfie facial matching, and
              knowledge-based authentication (KBA) compliant with National Institute of Standards and Technology (NIST)
              Identity Assurance Level 2 (IAL2) standards.


              For commercial counterparties, Proof provides Verified Business Identity, allowing organizations to
              execute a one-time Know Your Business (KYB) verification process. By integrating with third-party business
              data provider Enigma, Proof verifies corporate legal entity names, registered addresses, tax
              identification numbers (TIN/EIN), and domain ownership, conferring a verified badge on outbound signing
              requests. To protect high-value workflows against evolving synthetic fraud, Proof deployed Defend, an
              artificial intelligence-driven fraud prevention module that calculates real-time transaction risk scores
              across more than 400 network signals, complemented by Verify's deepfake detection for agent-supervised
              interactions.
            claimRefs:
              - CE002
              - CE005
              - CE009
              - CE011
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE004
              - CE009
      - number: '5.3'
        title: Workflows, Industry Standards & Compliance
        blocks:
          - type: paragraph
            body: >-
              Proof's operational workflows serve high-stakes transaction domains including mortgage eClosings,
              commercial lending, insurance onboarding, equipment leasing, and legal affidavits. By automating identity
              checks and eliminating physical notary requirements, Proof compresses multi-day closing timelines into
              minutes while establishing evidentiary audit trails that satisfy strict evidentiary and regulatory
              standards. Transactions are executed in compliance with Remote Online Notarization laws enacted across 45
              or more states, providing cross-border legal enforceability under state uniform acts and interstate
              recognition frameworks.


              The technical foundation is anchored in rigorous third-party certifications and regulatory compliance
              standards. Proof maintains SOC 2 Type II compliance, WebTrust auditing, Kantara Initiative NIST IAL2
              certification, and Mortgage Industry Standards Maintenance Organization (MISMO) RON certification. Under
              MISMO standards and ALTA guidelines, Proof ensures tamper-evident document sealing, long-term audio/video
              record retention, and detailed audit trails recording signer verification events. Furthermore, Proof
              issues Digital Organization Certificates and notary digital certificates recognized with trusted green
              checkmarks in Adobe Reader, ensuring non-repudiation and cryptographic validation across international
              document viewers.
            claimRefs:
              - CE004
              - CE006
              - CE012
              - CE013
          - type: table
            tableRef: TE002
