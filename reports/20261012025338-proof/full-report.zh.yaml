      - number: '8.3'
        title: 融资背景与情景分析
        blocks:
          - type: paragraph
            body: >-
              Proof 的资本结构和融资轮次历史，是建立入场价格纪律的重要背景。2021 年 3 月的高峰风险投资轮次中，Proof 以 $758.5M 投后估值融资 $130M Series D，相当于以 2021 年
              $25.0M 收入的 30.3x 倍数融资。随后市场理性化，2025 年 10 月完成 Series E，名义估值小幅升至 $986.73M。但文件显示，这轮融资拆分为 $4.2M 的 Series E
              新股部分，发行价为每股 $19.40；以及 $11.35M 的 Series E-1，发行价为每股 $15.52。


              Series E-1 每股 $15.52 的折价，明显低于 2021 年 Series D 融资设定的每股
              $18.09，清楚表明内部投资人联合体的估值已向下调整。为模拟三年期的风险调整结果，我们的情景框架评估乐观、基准和悲观路径。在基准情景（概率 55%）下，收入以 20% 至 25% 的速度复合增长至
              $115M；按正常化 7.0x 倍数计算，企业价值为 $805M，相比名义 Series E 投后估值低 18%。
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV009
              - CV010
          - type: table
            tableRef: TV003
