      - number: '5.3'
        title: 工作流、行业标准与合规
        blocks:
          - type: paragraph
            body: >-
              Proof 的运营工作流服务于抵押贷款电子成交、商业贷款、保险入驻、设备租赁和法律宣誓书等高风险交易领域。
              公司通过自动化身份检查、取消实体公证要求，把数天的成交周期压缩到几分钟，同时建立满足严格证据和监管标准的证据审计轨迹。 交易遵循在 45
              个或更多州颁布的远程在线公证法律，在州统一法和州际认可框架下提供跨境法律可执行性。

              技术基础建立在严格的第三方认证和监管合规标准之上。Proof 维持 SOC 2 Type II 合规、WebTrust 审计、Kantara Initiative NIST IAL2 认证， 以及
              Mortgage Industry Standards Maintenance Organization（MISMO）RON 认证。 在 MISMO 标准和 ALTA 指南下，Proof
              确保文件封存具备防篡改能力、长期保留音视频记录，并保留记录签署人验证事件的详细审计轨迹。 此外，Proof 签发 Digital Organization Certificates 和公证员数字证书；这些证书在
              Adobe Reader 中显示受信任的绿色勾号，确保国际文档查看器中的不可否认性和密码学验证。
