      - number: '2.3'
        title: 买方细分、预算归属与采购触发因素
        blocks:
          - type: paragraph
            body: >-
              企业采购身份保障型签署服务，涉及三类核心买方画像，各自拥有不同的预算权限和合规要求。 在产权和房地产结算中，托管人员及代理机构高管采购 Proof
              来执行远程交割交易，通常把法定公证费转入交割成本，同时从结算运营预算支付平台软件费用。 在零售和商业银行，欺诈防范及数字渠道负责人部署 Proof 处理电汇授权和商业担保，并将风险管理资金用于降低账户接管责任。
              在财产与意外保险领域，State Farm Ventures 等创新负责人投资并合作，以保护理赔文件免受深度伪造影响。 此外，企业法务团队使用 Proof 的 KYB 验证合作伙伴 Enigma，在 B2B
              入驻时为企业交易对手方建立凭证，把分散的单点工具整合为一个可审计的签名存储库。
