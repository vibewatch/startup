  - id: TV001
    title: 建议摘要表
    columns:
      - 维度
      - 评估
      - 证据锚点
      - 决策含义
    rows:
      - - 建议
        - 继续研究
        - Forge $986.73M 估值对比 Sacra $80M 收入估算
        - 在披露经审计 ARR 和单位经济性之前，暂不承诺成长股权投资。
      - - 信心
        - 中
        - 已记录的 Series E 申报文件，但私营公司业绩指标未披露
        - 持续跟踪私募二级市场估值和企业合作落地情况。
      - - 风险评级
        - 高
        - 高度依赖周期性抵押贷款交易量，且 Series E-1 价格下探
        - 采用较高资本成本（25%+ 门槛回报率），并要求保护性清算优先权。
      - - 估值立场
        - 偏高
        - 在未披露经常性利润率画像的情况下，隐含约 10–12 倍历史收入
        - 除非 ARR 增长超过 40% 且毛利率 >75%，否则将入场价控制在 8.0 倍收入以下。
    notes: 综合 Forge Global Series E 申报文件与 Sacra 私募市场估算；私营公司业绩指标仍未经审计。
    claimRefs:
      - CV001
