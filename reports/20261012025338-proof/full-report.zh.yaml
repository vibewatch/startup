      - number: '6.5'
        title: 展示项
        blocks:
          - type: callout
            title: 逆周期市场份额获取
            body: Proof 2024 年房地产交易增长 44%，说明即使全国房屋销售降至数十年低点，数字 RON 和电子成交的采用仍在扩大，驱动力是贷款方寻求每笔贷款 $444 的运营节省。
            calloutType: insight
            claimRefs:
              - CU002
              - CU006
          - type: callout
            title: 留存与收入集中度不透明
            body: 尽管 Proof 以 United Wholesale Mortgage 等大客户证明了生产部署能力，但由于未披露净收入留存率（NRR）和垂直集中度指标， 公司在抵押贷款下行周期中的客户持久性仍然模糊。
            calloutType: risk
            claimRefs:
              - CU003
