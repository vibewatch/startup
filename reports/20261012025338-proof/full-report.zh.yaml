        title: 核心平台架构与 Notarize 网络
        blocks:
          - type: paragraph
            body: >-
              Proof 运营着一个以身份为核心的安全与交易平台，用于执行具有法律约束力的数字协议、身份验证和远程在线公证。 公司最初以 Notarize 之名成立，后来将产品统一到 Proof 品牌下，同时保留
              Notarize 作为公证网络的独立子品牌。 该架构将超过 1,800 名实时身份代理组成的按需网络，与自动化软件工作流结合，每年为各类商业领域超过 $200 billion 的数字交易提供保障。

              平台架构围绕三个同步子系统搭建：支持标准电子签名、按需可信复核员和远程在线公证的接入及工作流引擎；
              根据多点欺诈启发式规则检查数字交易的自动化风险分析层；以及把经过认证的签署人属性直接绑定到数字记录的密码学封存基础设施。 Proof
              为公证场次提供双重运营模式：组织可通过客户管理的门户部署内部公证员（IHN），当内部容量超限时，则自动切换到 Proof 全天候按需公证员（ODN）池。
