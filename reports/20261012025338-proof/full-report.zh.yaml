      - number: '3.3'
        title: 商业打包、定价模式与 GTM 摩擦
        blocks:
          - type: paragraph
            body: >-
              Proof 的商业模式结合平台 SaaS 订阅层级和按交易计费的消费费。 在消费者和小企业领域，单次按需公证按固定交易费计费；金融服务、保险和医疗领域的企业账户则购买年度平台承诺，并支付分层的单笔验证和公证费用。
              相比之下，DocuSign 和 Adobe Sign 等横向电子签名巨头主要依靠按席位计费的年度许可及信封使用额度变现。 这种定价差异既带来机会，也造成采用摩擦。习惯可预测按席位 SaaS
              成本的企业采购团队，在评估 Proof 的混合交易计费时常感到困难，尤其是抵押贷款和放贷活动具有周期性、交易量会波动时。 为降低周期性风险并扩大企业分销，Proof 已开展战略分销合作：获得 State Farm
              Ventures 的战略投资以自动化保险验证工作流，并与 IDEMIA Public Security 合作建立可互操作的可验证数字凭证（VDC）。 Proof
              试图把密码学交易能力嵌入更广泛的企业合作伙伴生态，从而突破传统企业平台根深蒂固的分销优势。
            claimRefs:
              - CP013
              - CP014
              - CP015
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP013
              - CP014
              - CP016
      - number: '3.4'
        title: 护城河持久性、切换成本与替代风险
        blocks:
          - type: paragraph
            body: >-
              对 Proof 长期竞争护城河的评估，既能看到结构性优势，也能看到明显的替代风险。 Proof 的主要防御力来自双边公证员和复核员网络、嵌入产权及放贷系统的专有集成，以及与州远程在线公证法规和 Adobe
              AATL 标准的深度合规协同。 对于已将 Proof API 深度接入核心承保、贷款成交和客户入驻技术栈的大型企业，切换成本中高。 但在标准电子签名工作流中，切换成本明显更低，因为 DocuSign 和
              Adobe Sign 拥有普遍的企业认知、现成的主服务协议和 IT 供应商整合趋势。 如果企业采购部门认为基础电子签名配合 Persona 或 Socure 等独立身份验证
              API，已足以覆盖非公证交易，Proof 就可能面临被替代的风险，从而失去其溢价交易定价。 此外，FinCEN 监管数据表明，虚假记录是美国代价第二高的身份欺诈类别，推动每年 $45 billion 的非法活动。
              这种欺诈环境凸显了市场对 Proof 密码学和深度伪造检测方案的需求，但如果欺诈交易绕过自动检查，也会提高其责任和监管审查压力。 Proof 最终能否守住护城河，取决于其身份授权网络和 Certify
              工具能否在非房地产垂直领域形成网络效应，赶在横向巨头匹配其密码学保障能力之前完成扩张。
            claimRefs:
              - CP005
              - CP009
              - CP012
              - CP015
      - number: '3.5'
        title: 展示项
        blocks:
          - type: callout
            title: 身份保障型交易之争
            body: >-
              Proof 从专业远程公证平台（Notarize）演变为身份授权网络，是避免被 DocuSign 和 Adobe 商品化的战略必需。 Proof 将生物识别验证、实时复核员验证和符合 Adobe AATL
              的证书嵌入交易，试图建立一个具有法律约束力的数字协议溢价层，让基础电子签名成为不可接受的欺诈责任来源。
            calloutType: insight
