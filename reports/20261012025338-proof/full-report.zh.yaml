      - number: '8.4'
        title: 建议逻辑与尽调重点
        blocks:
          - type: paragraph
            body: >-
              我们给出继续研究建议，依据的是一套按顺序比较运营验证点和信息缺口的决策逻辑。              Proof 已证明产品与市场匹配、企业规模以及跨垂直行业牵引力，具体体现在其进入设备租赁领域，并与合作伙伴
              Enigma 搭建经过验证的企业身份工作流。但交易型公证收入的公开估值倍数低于真正的经常性软件订阅收入，在财务报表不透明的情况下按接近 $1.0B 的估值评估投资，会带来不可接受的资本损失风险。


              若要转向明确的投资立场，第二阶段尽调必须拿到具体的运营明细。关键要求包括：（1）经审计的 GAAP 财务报表，拆分软件订阅 ARR
              与交易型公证量；（2）按抵押贷款和非抵押贷款垂直行业拆分的队列级净留存率（NRR）及毛利率趋势；（3）Visa 和 State Farm 合作关系的商业转化基准，证明交易变现已经实现。
            claimRefs:
              - CV006
              - CV007
              - CV011
              - CV012
              - CV013
              - CV014
