      - number: '7.4'
        title: 投资含义、论点失效触发因素与尽调要求
        blocks:
          - type: paragraph
            body: >-
              从投资评估角度看，Proof
              拥有较难复制的技术基础设施和声誉突出的机构认证，但也面临明确的宏观经济、法律和运营风险。关键投资逻辑破裂触发因素包括：第一，法院判定房地产契据的州外远程在线公证无效，或州上诉法院作出否定裁决，导致保守型产权承保商不再贡献交易量；第二，全国住房抵押贷款再融资和购房交易持续低迷，且下滑幅度超过
              Proof 非房地产业务的扩张速度；第三，Defend 平台出现成功的深度伪造绕过或生物识别欺骗事件，造成重大商业贷款欺诈或财务损失。尽调应重点确认经审计的非房地产收入占比，跟踪 Better Business
              Bureau 投诉中所述会话可靠性故障引发的企业客户流失，并核实 Enigma 等单一数据源供应商的应急故障切换机制。
            claimRefs:
              - CR001
              - CR005
              - CR008
              - CR014
      - number: '7.5'
        title: 图表
        blocks:
          - type: callout
            title: 住房市场集中度风险
            body: 累计保障的房地产交易额已超过 $640B，抵押贷款交割又构成 Proof 历史上的核心交易量，因此购房或再融资活动持续停滞会直接拖慢交易速度，并压低平台手续费收入。
            calloutType: risk
            claimRefs:
              - CR008
              - CR009
          - type: callout
            title: 法律可执行性与州际摩擦
            body: 尽管 24/7 按需公证已在全美 50 个州实现技术运营，但州际认可差异以及停滞的联邦 SECURE Notarization Act，使地方登记和县级受理仍容易受到司法管辖权挑战。
            calloutType: insight
            claimRefs:
