  - id: TV002
    title: 论点 / 反论点表
    columns:
      - 支柱
      - 论点
      - 反论点
      - 什么会改变判断
    rows:
      - - 市场扩张
        - 从远程公证扩展到企业身份授权，可覆盖银行和数字商业领域规模达 $55T 的巨大 TAM。
        - 核心交易量仍高度集中于房地产和抵押贷款产权工作流，容易受到宏观下行冲击。
        - 非房地产 ARR 已有据可查地超过总收入的 50%，且企业合同持续扩张。
      - - 网络规模
        - Visa 合作和 8,000 家企业客户构筑了较高切换成本，也为数字凭证形成可防守的网络效应。
        - 合作公告可能需要数年才能转化为高毛利经常性软件收入。
        - 证明 Visa Direct 流程已实现交易变现，并已有经验证的第三方 API 集成收入。
      - - 资本结构
        - $225.6M 总融资加上干净的 1.0 倍非参与型优先股条款，为公司穿越市场波动提供稳定资产负债表。
        - Series E-1 折价（每股 $15.52，对比 Series D 的 $18.09）表明资本化存在摩擦，投资者也存在选择性怀疑。
        - 由一线机构投资者领投、无下探优先级分档的干净上行 Series F 完成交割。
      - - 产品防守力
        - Proof Certificates 和符合 IAL2 的可复用 Digital IDs，构筑了对传统电子签名提供商的切换壁垒。
        - 深度伪造欺诈风险及州 RON 法规变化，可能带来重大运营和法律责任。
        - 独立第三方安全审计验证零漏洞责任，并证明 50 个州持续获得监管批准。
    notes: 评估核心投资驱动因素及其反论点；“什么会改变判断”的标准为论点失效设定可实证检验的触发条件。
    claimRefs:
      - CV002
      - CV003
      - CV006
      - CV007
      - CV009
      - CV010
      - CV011
      - CV012
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 收入与增长假设
      - 目标倍数与隐含估值
      - 关键风险驱动因素
      - 概率信号
    rows:
      - - 乐观情景
        - 在 Visa 身份流程和设备融资快速被企业采用的推动下，ARR 加速至 $150M+。
        - 12.0 倍 ARR，带来 $1.80B 估值（1.8 倍 MOIC / 22% 三年 IRR）。
        - 企业销售周期执行延迟，宏观利率逆风重新出现。
        - 20%（要求战略合作立即转化为高毛利经常性 ARR）
      - - 基准情景
        - 收入以 20–25% 的速度复合增长，达到 $115M ARR；房地产企稳，身份业务温和扩张。
        - 7.0 倍 ARR，带来 $805M 估值（较 Series E 估值低 18% / 回报持平）。
        - 客户支持挤压利润率，抵押贷款交易量周期性持续。
        - 55%（反映历史 33% 增长放缓，以及核心产权工作流之外的温和扩张）
      - - 悲观情景
        - 抵押贷款交易量停滞，非房地产业务进展停滞，收入降至或持平于 $70M。
        - 4.0 倍收入，带来 $280M 估值（较 Series E 估值低 72%）。
        - 倍数显著压缩、下轮重组融资，以及高级清算权形成的悬垂压力。
        - 25%（Series E-1 融资档中观察到的内部下探定价为该判断提供支持）
    notes: 预测假设自 2026 年 10 月起持有 3 年；估值参照公开身份和交易软件倍数校准。
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV005
      - CV009
      - CV010
