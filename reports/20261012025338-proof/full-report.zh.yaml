      - number: '5.2'
        title: 产品模块与身份验证套件
        blocks:
          - type: paragraph
            body: >-
              Proof 产品套件超越传统文件签署，形成覆盖 Verify、Identify、Sign、Defend 和 Notarize 的模块化验证层级。 Proof Sign
              提供原生电子签名，配备签署人在场检测、审计日志和集成式身份验证，定位为传统签名供应商的企业替代方案。 通过 Identify 和 Verify
              模块，平台使用政府凭证验证、自拍人脸匹配，以及符合美国国家标准与技术研究院（NIST）身份保障等级 2（IAL2）标准的知识型认证（KBA）来验证签署人。

              面向商业交易对手方，Proof 提供 Verified Business Identity，让组织完成一次性了解你的业务（KYB）验证。 Proof 与第三方商业数据供应商 Enigma
              集成，验证企业法定实体名称、注册地址、税务识别号（TIN/EIN）和域名所有权，并在发出的签署请求上加注已验证徽章。 为保护高价值工作流免受不断演化的合成欺诈影响，Proof 部署了
              Defend——一个由人工智能驱动的防欺诈模块，可根据 400 多个网络信号计算实时交易风险分数， 同时配合 Verify 对代理监督交互进行深度伪造检测。
