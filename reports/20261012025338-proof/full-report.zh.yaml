              - CV009
              - CV010
      - number: '8.2'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              评估 Proof，必须在有说服力的运营逻辑与具体的结构性反论之间权衡。支持投资逻辑的一侧，Proof 正在建立较难复制的网络护城河。Proof Certificates 遵循 WebTrust 标准，Proof
              可复用生物识别 Digital IDs 符合 NIST IAL2 规范；这两项产品让 Proof 明显区别于传统电子签名工具。进一步将 Proof 的加密身份基础设施与 Visa Direct
              接通后，平台得以进入全球 $55T 的资金流转市场，总可用市场远超产权和托管办公室。


              反向逻辑则指出 Proof 收入质量和宏观防御能力存在关键脆弱点。Sacra 的尽调显示，房地产行业仍贡献 Proof 交易量中的绝大多数，使公司高度暴露于抵押贷款利率周期波动和交易周转低迷。虽然累计股权融资达到
              $225.6M，且清晰的 1.0x 非参与型清算优先权对投资人有利，但 2025 年 10 月融资暴露出内部资本结构压力。投资者应先要求经过验证的运营指标，再把 Proof 当作跨周期的身份软件供应商。
            claimRefs:
              - CV002
              - CV003
              - CV006
              - CV007
              - CV009
              - CV011
