  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管合规、各州 RON 差异与法律可执行性
        blocks:
          - type: paragraph
            body: >-
              Proof 所处环境受各州公证法规约束，而不是统一的联邦框架，法律细节复杂。 尽管大多数美国州承认远程在线公证，但公证辖区、凭证分析标准和可接受的视听记录留存要求各不相同，持续增加合规负担。
              旨在建立全国最低标准的联邦立法——2023 年 SECURE Notarization Act（H.R. 1059）——已通过众议院， 但自 2023 年 2 月转交参议院司法委员会后仍陷于停滞。
              因此，远程交易仍暴露于不一致的地方登记做法和产权保险机构可能提出的挑战。 此外，文件欺诈是严重的全国性责任风险：FinCEN 估计，虚假记录每年在全美造成 $45 billion 的欺诈活动。 Proof
              通过严格合规降低责任，但其帮助中心条款明确声明，平台文档不构成法律建议，因此地方有效性风险完全落在交易企业客户身上。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR014
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
