      - number: '1.2'
        title: 管理层与监管倡议
        blocks:
          - type: paragraph
            body: >-
              Proof 的管理层由创始人兼首席执行官 Patrick Kinsel 主导。他此前创办移动数据采集初创公司 Spindle，并于 2013 年将其出售给 Twitter。
              一名公证员未能为法律收购文件补签，暴露出行政流程失误；此后 Kinsel 与 Adam Pase 共同创办 Notarize，推动纸质法律签署现代化。 曾任 Dennis Moore 众议员国会政策顾问的
              Pase，主导法定倡议，帮助远程在线公证立法覆盖 38 个州。 这道立法护城河对扩大摄像头公证在各州的法律认可至关重要。早期融资波折后，高管留任已趋稳定，但公司转向人工智能代理授权和密码学身份标准时，仍高度依赖
              Kinsel 的战略判断。
            claimRefs:
              - CO001
              - CO003
              - CO004
