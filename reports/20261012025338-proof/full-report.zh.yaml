      - number: '2.4'
        title: 增长驱动、监管顺风与采用约束
        blocks:
          - type: paragraph
            body: >-
              市场扩张由结构性监管催化剂和不断升级的威胁环境推动，但也面临明显的采用阻力。 从监管看，H.R. 1059（2023 年 SECURE Notarization
              Act）等联邦立法倡议确立州际认可和电子及远程公证的明确技术标准，消除各州之间的法律摩擦。 同时，生成式 AI
              深度伪造和自动化生物识别注入攻击不断扩散，迫使企业放弃未经验证的传统电子签名，转向绑定硬件的密码学确定性。 但组织切换成本高、现有系统集成根深蒂固，加之风险厌恶型金融机构采购周期漫长，都会拖慢采用速度。
              此外，Proof 历来集中于房地产成交工作流，收入持续性容易受到利率波动影响，因此必须积极将客户拓展至横向企业合同和商业保险。
