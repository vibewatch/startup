          description: 平台执行生物识别自拍扫描、凭证分析和 NIST IAL2 验证
        - id: fraud-check
          label: 3. 实时欺诈评估（Defend）
          description: 自动化风险评分监控 400+ 个信号，增量计算成本较低
        - id: fulfillment
          label: 4. 履约与会话执行
          description: 纯自动化密码学 eSign，或将交易路由至按需人工公证人网络
        - id: credentials
          label: 5. 审计轨迹与密码学认证
          description: 生成防篡改数字证书和符合 WebTrust 的审计日志
        - id: monetization
          label: 6. 费用结算与利润率实现
          description: 确认软件订阅费和交易费，扣除公证人工及供应商成本
      edges:
