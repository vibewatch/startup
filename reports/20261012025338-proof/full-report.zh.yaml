chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与平台演进
        blocks:
          - type: paragraph
            body: >-
              Proof 运营着一个企业级身份授权和交易验证网络，用密码学保护数字交互和法律协议。公司 2015 年以 Notarize, Inc. 之名在马萨诸塞州波士顿成立，
              随后打造出全美最大的按需远程在线公证（RON）网络，并于 2023 年 9 月完成全面的公司品牌重塑，改名为 Proof。 平台已从房地产公证扩展为多产品信任套件，涵盖
              Notarize、Verify、Defend 和 Certify，用于防范银行、汽车金融和法律交易中的合成身份欺诈与深度伪造冒用。 Proof 还通过与 Enigma
              的数据合作提供了解企业（KYB）组织验证，让企业实体在与交易对手方交互前，以密码学方式验证其凭证身份。
            claimRefs:
              - CO001
              - CO002
              - CO008
              - CO009
              - CO014
