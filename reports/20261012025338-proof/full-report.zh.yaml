  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、类别定义与相邻支出
        blocks:
          - type: paragraph
            body: >-
              Proof 将其可服务运营边界定义为三个相邻的交易层级：法定远程在线公证（RON）、身份保障型电子签名，以及企业了解你的业务（KYB）授权。 历史上，数字签署供应商分化为 DocuSign
              这类商品化签署工具和独立的身份验证单点方案。 Proof 以统一的公钥基础设施（PKI）架构整合这些工作流，把经过验证的生物识别凭证直接绑定到签署数据载荷。 纳入的支出包括企业文档管理、公证网络派单费、IAL2
              身份校验和自动化欺诈评分；排除的支出包括通用端点网络安全、内部员工单点登录， 以及交易对手接受基础电子签名的未验证低风险文档流转。Proof
              将密码学证书布置在这条边界上，服务于无法容忍合成身份欺诈或否认的高后果企业协议、抵押贷款结算和商业贷款授权。
            claimRefs:
              - CM001
              - CM004
              - CM013
              - CM014
