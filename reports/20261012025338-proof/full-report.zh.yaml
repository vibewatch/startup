  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局：传统巨头、垂直平台与替代方案
        blocks:
          - type: paragraph
            body: >-
              Proof 面对四条截然不同的竞争战线：通用电子签名巨头、专业房地产结算和抵押贷款成交平台、自动化生物识别身份验证供应商， 以及传统人工或线下公证工作流。Proof 过去以 Notarize
              品牌运营，通过软件工作流配合数千名受委托公证员组成的按需网络， 在数字远程公证领域建立了早期优势。然而 DocuSign 等主流电子签名巨头在《财富》500 强企业和横向商业协议中拥有压倒性的分销优势。
              DocuSign 于 2020 年以 $38 million 收购 Liveoak Technologies，直接进入远程公证领域，并推出 DocuSign Notary，为现有合同生态中的高价值受监管协议服务。
              与此同时，Snapdocs 和 Qualia 等垂直平台已将软件深度嵌入产权代理机构、成交律师和贷款方贷款发起系统。
              这些垂直供应商常常掌控住宅房地产结算的运营流程；当产权代理机构偏好一体化成交软件套件时，Proof 的议价能力就会受限。 Persona、Socure 和 Incode
              等自动化身份验证供应商则提供面向开发者的快速 KYC API，迫使 Proof 以自动化防欺诈、人类复核员验证和具有法律约束力的密码学公证的组合来差异化。 尽管数字化已迅速覆盖 8,000
              个企业组织，受监管市场中最大的单一替代方案仍是传统纸质湿签公证和线下网点成交。 对远程数字记录持谨慎态度，或要求逐县提交纸质文件的贷款方和县记录办公室，维持了这一线下现状，阻碍平台普及。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
      - number: '3.2'
        title: 功能比较与技术差异化
        blocks:
          - type: paragraph
            body: >-
              Proof 通过全栈交易信任、密码学不可否认性和人机协同保障，与传统横向电子签名及独立身份验证工具拉开差距。 传统电子签名工具记录签名标记和基础 IP
              时间戳审计轨迹，但通常缺乏原生生物识别活体检测、自动化政府证件取证分析和防篡改数字证书。 相比之下，Proof 采用符合 NIST IAL-2
              标准的多因素签署人认证，把生物识别人脸比对与政府签发凭证结合，并辅以基于知识的认证问题。 为应对生成式 AI 深度伪造和自动化合成身份欺诈，Proof 部署了 Defend 交易风险引擎——分析超过 400
              个实时风险信号——以及 Verify 实时代理验证方案， 用于在高风险环境中认证个人。其密码学架构还签发符合 WebTrust 和 Adobe Approved Trust List（AATL）标准的 x.509
              数字证书， 在标准 PDF 查看器中显示可验证的绿色勾号，确认记录完整性而不锁定于某一供应商。 Proof
              的关键运营护城河是全天候按需可信复核员和公证员网络：当自动算法标记异常时，该网络能在不到一秒内完成身份人工裁决。
              相比之下，商品化电子签名供应商把身份验证作为可选附加集成，独立身份验证供应商也无法执行具有法律约束力的数字签署、远程公证或长期数字记录留存。
            claimRefs:
