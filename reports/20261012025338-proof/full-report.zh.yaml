      - number: '6.4'
        title: 客户旅程、扩张动力与集中度风险
        blocks:
          - type: paragraph
            body: >-
              Proof 的客户旅程从单笔交易履约扩展到企业级身份治理。 组织通常从有针对性的远程公证或电子签名工作流开始使用，触发因素往往是贷款方要求或紧迫的成交期限。 交易量稳定后，企业通过 API 集成嵌入
              Proof，采用 Proof Sign 执行一般合同，并部署了解你的业务（KYB）验证，为组织交易对手方建立凭证。 推出符合 WebTrust 的 Proof Certificates
              和深度伪造检测工具（Verify），为客户从商品化电子签名增购到高级欺诈缓解和风险评分（Defend）铺平了路径。 但客户集中度和获客摩擦仍然明显。房地产交易继续贡献平台大部分活动，使 Proof
              暴露于贷款方整合和产权代理机构流失。 同时，Proof 与 Southern Glazer's 批发订货系统等无关 B2B
              平台发生外部品牌冲突，增加了网络搜索渠道的自然获客难度，也凸显直销渠道对维持企业扩张势头的必要性。
            claimRefs:
              - CU008
              - CU011
              - CU013
