      - number: '2.2'
        title: 市场规模视角、可服务支出与 TAM/SAM/SOM
        blocks:
          - type: paragraph
            body: >-
              评估 Proof 的可服务机会，需要采用多个彼此不同的分析视角，而不是依赖不受约束的总量估算。 从宏观经济看，金融犯罪执法网络（FinCEN）指出，虚假记录是美国代价第二高的身份欺诈类别，每年造成 $45
              billion 损失。 从运营遥测看，Entrust 记录称，人工智能深度伪造已占生物识别欺诈攻击的五分之一，而身份注入尝试同比激增 40%。 在企业需求侧，Liminal 调查数据表明，83%
              的金融服务买家需要一个整合身份验证与欺诈检测的平台。 Proof 在 2024 年处理了 $150 billion 的授权交易，且房地产交易量逆周期增长 44%，证明其具备实际运营规模。
              不过，交易总额代表底层金融资产，而非已确认的软件经常性支出；精确的市场获取仍取决于交易费抽成率。
