            body: >-
              Proof 年交易流量超过 $200B，并得到 Visa 和 State Farm 的强力企业验证，规模令人印象深刻；但公司没有披露 ARR、利润率和留存数据，使约 $987M 的 Series E
              估值无法支撑新的增长资本投入。投资者应继续保持继续研究的立场。
            calloutType: recommendation
