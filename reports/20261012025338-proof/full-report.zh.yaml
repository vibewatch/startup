              Proof 将 2025 年 10 月的 Series E 拆成每股 $19.40 的 Series E 和折价至每股 $15.52 的 Series
              E-1，表明内部估值存在张力，投资人也不愿接受高峰倍数，进一步凸显后续流动性事件中估值倍数压缩的风险。
            calloutType: risk
