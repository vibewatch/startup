      - number: '6.3'
        title: 生产部署与具名客户验证
        blocks:
          - type: paragraph
            body: >-
              已验证的生产案例研究证明，Proof 已将关键企业账户从初始试点推进到高交易量数字工作流。 在住宅贷款领域，United Wholesale Mortgage（UWM）是重要参考部署：独立抵押贷款经纪人在
              2025 年通过 Proof 完成超过 30,000 笔数字成交和再融资，签署人几乎遍布每个州。 在住宅抵押贷款发起之外，商业金融贷款方 Alliance Funding Group 用 Proof RON
              替代纸质邮寄，将授权委托书的执行时间从数天缩短至数小时。 在消费者平台领域，租赁市场 Avail 部署 Proof 身份验证，在房东与潜在租户之间建立已验证身份，防止虚假房源和伪造凭证。 此外，State
              Farm Ventures 与 Proof 建立战略投资和商业合作关系，将数字验证部署到保险文件中。 这些参考客户证明 Proof
              的身份授权平台能在多个垂直领域交付可验证的运营结果，但中型市场客户的合同期限、年度合同价值和客户标识留存等完整数据仍严格保密。
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU010
