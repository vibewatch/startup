        blocks:
          - type: paragraph
            body: >-
              从机构尽调角度看，Proof 是一个交易量很大、但受严格财务保密约束的平台。 公司公开分享了若干里程碑数据，包括 2024 年 $150 billion 的授权交易额和超过 $500 billion
              的累计交易额，却没有披露 GAAP 收入、软件经常性 ARR、净收入留存率、毛利率和现金消耗率。 Proof 曾声称在房地产市场低谷期交易量增长 44%，但交易速度不能替代经验证的收入质量或正向单位贡献利润率。
              在管理层通过保密披露提供经审计的损益表和按客户群划分的留存数据之前，Proof 的未来资本续航和二级市场估值都无法完成投资评估。
