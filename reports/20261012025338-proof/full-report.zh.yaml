      - number: '6.2'
        title: 采用轨迹与交易量规模
        blocks:
          - type: paragraph
            body: >-
              Proof 的运营规模显著扩大，2024 年平台授权交易额达到 $150 billion。 尽管美国住宅房地产经历历史性低迷，房屋销售量降至 1995 年以来最低水平，Proof 的房地产交易量仍同比增长
              44%。 这一逆周期增长表明，公司持续从纸质成交流程中夺取市场份额，背后动力是贷款方可量化的成本节省。 MarketWise Advisors
              的独立评估显示，完整的电子成交配合在线公证，每笔贷款可为贷款方节省最多 $444，每笔交易可为结算代理节省最多 $100，原因包括取消寄送、缩短周期和减少文件错误。 但 Mortgage Bankers
              Association 记录的发起量大幅收缩和发起费用上涨，凸显抵押贷款驱动软件收入固有的周期波动。
              在公司未公开拆分年度经常性收入（ARR）与按使用量计费的交易费之前，这些交易吞吐量在不同房地产周期中的确切财务持久性仍是关键尽调问题。
