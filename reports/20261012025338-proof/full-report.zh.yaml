  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与建议
        blocks:
          - type: paragraph
            body: >-
              Proof 处在美国远程在线公证（RON）网络的领先位置，覆盖 8,000 家企业组织，年处理交易量超过
              $200B。核心投资逻辑在于：平台已经证明自己能从法定房地产公证扩展为更广泛的身份授权网络，为数字商业、保险核验和大额支付提供保障。与 Visa 达成的标志性分销协议，以及 State Farm Ventures
              的战略股权支持，验证了平台对多行业企业客户的吸引力和技术可信度。


              尽管商业进展可观，我们的投资建议仍明确为继续研究，风险评级为高，估值判断为偏高。主要原因是财务透明度持续不足，尤其是经审计的年经常性收入（ARR）、毛利率和净留存率（NRR）数据缺失。Forge Global
              的私募市场文件显示，Proof 在 2025 年 10 月 Series E 融资后投后估值为 $986.73M；但 Sacra 对历史收入的估计为 $80.0M，意味着远期收入倍数在 10x 至 12x
              之间。在缺少经审计订阅指标的情况下，按这一估值投入新的增长资本，意味着下行风险过高。
            claimRefs:
              - CV001
              - CV004
              - CV006
              - CV007
              - CV008
              - CV010
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
