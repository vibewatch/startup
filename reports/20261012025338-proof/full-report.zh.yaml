            body: >-
              Proof 对第三方基础设施供应商、身份登记机构和监管机构存在关键技术与运营依赖。 身份验证和企业认证高度依赖 Enigma 等第三方验证服务提供商的企业实体数据、外部凭证分析供应商，以及州机动车数据库连接。
              这些外部数据通道一旦中断或出现延迟峰值，就会直接增加交易摩擦，可能降低按需公证完成率，或迫使人工复核场次。

              此外，平台运营可靠性取决于能否维持一支训练充分、地域分散的持证公证员和可信复核员网络。 运营按需劳动力池会带来复杂的人员调度、多州委托合规监控和实时场次负载均衡问题。 Proof 虽已拓展到 FIDO
              Alliance 代理身份协议（x401）等新兴标准，用于验证代表人类行事的人工智能代理， 但代理授权的商业生产遥测和收入贡献仍处于早期开发阶段，在核心房地产和公证垂直业务之外存在产品市场执行不确定性。
