      - number: '7.3'
        title: 交易对手依赖、住房周期与实体管理
        blocks:
          - type: paragraph
            body: >-
              Proof 的商业模式高度集中于房地产结算生态，历史上促成的房地产交易额超过 $640 billion。 尽管美国现有房屋销售量降至数十年低点，平台仍在 2024 年授权 $150 billion
              的总交易额，房地产交易量增长 44%，体现出韧性； 但其增长轨迹仍与抵押贷款发起和住房周转内在绑定。 为摆脱房地产依赖，Proof 已扩展到企业电子签名并建立战略合作，尤其获得 State Farm
              Ventures 投资，将数字身份验证部署到保险理赔和承保业务。 从运营看，Proof 依赖 Enigma Technologies，该公司为客户入驻提供自动化了解你的业务验证数据。 此外，Proof
              维持双重公司身份：面向客户的品牌已转为 Proof，但业务运营、客户开票和支票支付仍由 Notarize, Inc.（dba Proof.com）管理，因此客户 IT 系统需要调整并更新公司允许名单。
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
