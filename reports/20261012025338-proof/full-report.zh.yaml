          - type: callout
            title: 传统巨头捆绑与整合压力
            body: >-
              面临经济压力的企业 IT 买方往往寻求供应商整合，更偏好与 DocuSign 签订广泛的电子签名协议，而不是选择同类最佳的专业交易平台。 如果横向巨头增强原生身份验证和远程公证模块，Proof
              可能被限制在摩擦高的房地产和法律例外场景，而无法取得普遍的企业交易流量。
