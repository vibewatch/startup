      - number: '7.2'
        title: 运营可靠性、失效模式与反欺诈防御
        blocks:
          - type: paragraph
            body: >-
              人工智能深度伪造、合成身份操纵和生物识别注入攻击快速出现，成为高价值交易授权的关键运营风险。 FBI IC3 报告称，网络驱动欺诈在 2024 年造成前所未有的 $16.6 billion
              经济损失，凸显线上认证平台所面对的威胁环境正在加剧。 Proof 通过自有欺诈情报系统 Defend 应对这些风险：该系统持续分析超过 100
              个网络风险信号，并用基于数十万小时视频数据训练的机器学习模型评估实时视频流。 这些控制措施还得到严格的独立安全认证支持，包括 Kantara Initiative IAL2 认证、AICPA SOC 2 Type
              II 合规、MISMO 抵押贷款认证和 Schellman WebTrust 审计。 尽管有这些防御层，客户评价和 Better Business Bureau
              记录仍显示出残余运营漏洞：用户报告实时视频公证期间偶发会话断开、交易卡在验证队列中， 以及因不熟悉的州要求或技术故障而出现意外文件拒绝。
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
