  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户群细分与买方画像
        blocks:
          - type: paragraph
            body: >-
              Proof 将商业客户划分为三类主要买方和用户：抵押贷款方、产权及结算代理机构，以及一般商业企业。 抵押贷款方是基础性的交易客户群，部署 Proof
              的远程在线公证（RON）和电子成交工具，加快数字贷款履约并提高贷款在二级市场的可售性。 产权代理人和结算律师是房地产交易中的关键运营节点，利用平台协调托管成交、管理文件包，并与远程签署人完成公证。
              一般商业企业日益采用 Proof Sign 和 Business Pro+ 计划，以执行企业协议、人力资源文件和供应商合同。 此外，独立公证员接入 Proof 的按需网络，全天候接收交易量，成为去中心化履约引擎。
              尽管 Proof 以覆盖这些细分市场为卖点，商业贡献仍高度偏向房地产成交工作流；在这一领域，买方画像需求与产权代理人的运营偏好及贷款方合规要求深度交织。
