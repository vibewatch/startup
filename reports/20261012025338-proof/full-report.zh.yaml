        title: 资本化历程与机构支持
        blocks:
          - type: paragraph
            body: >-
              Proof 在多轮主要融资中累计筹集超过 $213 million 股权资本，用于平台基础设施和全国监管倡议。 2021 年 3 月，公司完成由金融科技专业投资机构 Canapi Ventures 领投的
              $130 million Series D 融资，投后估值 $760 million。 早期轮次的现有风险投资方包括 Camber Creek 和 Polaris Partners。2024 年末，State
              Farm Ventures 对 Proof 完成战略股权投资， 支持保险承保和保单理赔工作流中的自动化防欺诈工具。然而，二级交易估值标记和后续过桥轮次均未披露完整的股权结构表权利、清算优先权或反稀释结构，
              因此当前私人估值倍数尚无法与公开可比软件公司基准核实。
