company:
  name: Proof
chapter:
  number: 8
  title: Valuation
  summary: Proof has demonstrated significant commercial adoption with over $200 billion in authorized transactions and Tier-1 partnerships like Visa and State Farm, but financial opacity and a dual-tier October 2025 Series E round at a $986.73 million valuation warrant a Research-More stance until recurring ARR, gross margins, and non-real estate retention are audited.
sections:
  - id: investment-thesis-and-recommendation
    title: Investment Thesis and Recommendation
    claimRefs:
      - CV001
      - CV004
      - CV006
      - CV007
      - CV008
      - CV010
    tableRefs:
      - TV001
    body: |-
      Proof occupies an exceptional market position as the premier remote online notarization (RON) network in the United States, processing over $200 billion in annual transaction volume across 8,000 enterprise organizations. The core investment thesis rests on the platform's demonstrated ability to expand from statutory real estate notarization into a broader identity authorization network securing digital commerce, insurance verifications, and high-value payments. Landmark distribution agreements with Visa and strategic equity backing from State Farm Ventures validate the platform's multi-industry enterprise appeal and technical credibility.

      Despite these substantial commercial achievements, our investment recommendation remains firmly set at Research-More with a High risk rating and a Stretched valuation stance. This recommendation is governed by persistent financial opacity regarding audited annual recurring revenue (ARR), gross profit margins, and net revenue retention (NRR). While private market filings from Forge Global establish a post-money valuation of $986.73 million following its October 2025 Series E financing, historical revenue estimates of $80.0 million from Sacra imply a forward revenue multiple between 10x and 12x. In the absence of audited subscription metrics, committing new growth capital at this valuation implies excessive downside exposure.
  - id: thesis-and-anti-thesis-dynamics
    title: Thesis and Anti-Thesis Dynamics
    claimRefs:
      - CV002
      - CV003
      - CV006
      - CV007
      - CV009
      - CV011
      - CV012
    tableRefs:
      - TV002
    body: |-
      Evaluating Proof requires weighing a compelling operational thesis against concrete structural counterarguments. On the thesis side, Proof is establishing defensible network moats. Its rollout of Proof Certificates adhering to WebTrust standards and reusable biometric Digital IDs compliant with NIST IAL2 specifications significantly differentiates Proof from legacy e-signature commodities. Furthermore, integrating Proof's cryptographic identity rails with Visa Direct creates an unprecedented entry point into $55 trillion in global money movement flows, expanding the total addressable market well beyond title and escrow offices.

      Conversely, the anti-thesis highlights critical vulnerabilities in Proof's revenue quality and macro defensibility. Sacra's diligence underscores that the real estate sector still accounts for a substantial majority of Proof's transactional volume, leaving the company heavily exposed to cyclical mortgage rate volatility and depressed transaction turnover. Moreover, while total equity funding stands at $225.6 million with clean 1.0x non-participating liquidation preferences, the October 2025 financing revealed internal capital structure stress. Investors should demand verified operational indicators before treating Proof as a secular identity software provider.
  - id: financing-context-and-scenario-analysis
    title: Financing Context and Scenario Analysis
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV005
      - CV009
      - CV010
    tableRefs:
      - TV003
    body: |-
      Proof's capital structure and round history provide vital context for establishing entry price discipline. At its peak venture round in March 2021, Proof raised $130 million in Series D capital at a $758.5 million post-money valuation, representing a rich 30.3x multiple on 2021 revenue of $25.0 million. Subsequent market rationalization led to the October 2025 Series E round, which achieved a nominal step-up to a $986.73 million valuation. However, filings reveal that this financing was split into a $4.2 million primary Series E tranche at $19.40 per share and an $11.35 million Series E-1 tranche priced at $15.52 per share.

      The discounted Series E-1 price of $15.52 per share sits meaningfully below the $18.09 per share price set in the 2021 Series D financing, signaling clear down-tier pricing adjustments among insider syndicates. To model risk-adjusted outcomes over a three-year horizon, our scenario framework evaluates bull, base, and bear paths. Under our base case (55% probability), revenue compounds at 20% to 25% reaching $115 million, which at a normalized 7.0x multiple yields an $805 million enterprise value—representing an 18% loss against the nominal Series E post-money mark.
  - id: recommendation-logic-and-diligence-asks
    title: Recommendation Logic and Diligence Priorities
    claimRefs:
      - CV006
      - CV007
      - CV011
      - CV012
      - CV013
      - CV014
    figureRefs:
      - FV001
    body: |-
      The decision logic guiding our Research-More recommendation follows a sequential evaluation of operational proof points versus information gaps. Proof has successfully demonstrated product-market fit, enterprise scale, and cross-vertical traction, as shown by its expansion into equipment leasing and verified business identity workflows with partner Enigma. However, because transaction-based notary revenue commands lower public multiples than true recurring software subscriptions, underwriting an investment at a near-$1.0 billion valuation without transparent financial statements creates unacceptable risk of capital impairment.

      To advance to an affirmative investment stance, phase-two diligence must obtain concrete operating schedules. Key requirements include: (1) audited GAAP financial statements breaking out software subscription ARR from transaction-based notary volume; (2) cohort-level net revenue retention (NRR) and gross margin trends across mortgage versus non-mortgage verticals; and (3) commercial conversion benchmarks for the Visa and State Farm partnerships demonstrating realized transaction monetization.
tables:
  - id: TV001
    title: Recommendation summary table
    columns:
      - Dimension
      - Assessment
      - Evidence Anchor
      - Decision Implication
    rows:
      - - Recommendation
        - Research-More
        - Forge $986.73M valuation vs $80M Sacra revenue estimate
        - Withhold growth equity commitment pending audited ARR and unit economics disclosure.
      - - Confidence
        - Medium
        - Documented Series E filing with undisclosed private performance metrics
        - Maintain active monitoring of private secondary marks and enterprise partnership rollouts.
      - - Risk Rating
        - High
        - High dependence on cyclical mortgage volume and down-tier Series E-1 pricing
        - Apply a high cost of capital (25%+ hurdle rate) and require protective liquidation preferences.
      - - Valuation Stance
        - Stretched
        - Implies ~10-12x trailing revenue without disclosed recurring margin profile
        - Discipline entry price below 8.0x revenue unless ARR growth exceeds 40% with >75% gross margin.
    notes: Synthesis of Forge Global Series E filings and Sacra private market estimates; private performance metrics remain unaudited.
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV009
      - CV010
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Pillar
      - Thesis Argument
      - Anti-Thesis Counterargument
      - What Would Change the View
    rows:
      - - Market Expansion
        - Expanding from remote notarization into enterprise identity authorization creates a massive $55T TAM across banking and digital commerce.
        - Core transaction volume remains heavily concentrated in real estate and mortgage title workflows susceptible to macro downturns.
        - Documented non-real estate ARR surpassing 50% of total revenue with sustained enterprise contract expansion.
      - - Network Scale
        - Visa collaboration and 8,000 enterprise customers establish high switching costs and defensible network effects for digital credentials.
        - Partnership announcements may take multiple years to convert into high-margin recurring software revenue.
        - Demonstrated transaction monetization from Visa Direct flows and verified third-party API integration revenue.
      - - Capital Structure
        - Total funding of $225.6M with clean 1.0x non-participating preferred terms provides a stable balance sheet through market volatility.
        - Series E-1 discount ($15.52/share vs $18.09 Series D) signals capitalization friction and selective investor skepticism.
        - Closing a clean, up-round Series F led by a top-tier institutional investor with no down-tier preference tranches.
      - - Product Defensibility
        - Proof Certificates and IAL2-compliant reusable Digital IDs raise switching moats against legacy e-signature providers.
        - Deepfake fraud risks and regulatory shifts in state RON statutes could impose substantial operational and legal liabilities.
        - Independent third-party security audits validating zero breach liability and sustained regulatory approval across all 50 states.
    notes: Evaluates core investment drivers against counterarguments; what-would-change criteria establish empirical thesis-break triggers.
    claimRefs:
      - CV002
      - CV003
      - CV006
      - CV007
      - CV009
      - CV010
      - CV011
      - CV012
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Revenue & Growth Assumptions
      - Target Multiple & Implied Valuation
      - Key Risk Drivers
      - Probability Signal
    rows:
      - - Bull Case
        - ARR accelerates to $150M+ driven by rapid enterprise adoption of Visa identity flows and equipment financing.
        - 12.0x ARR multiple yielding $1.80B valuation (1.8x MOIC / 22% 3-year IRR).
        - Execution delays in enterprise sales cycles and renewed macro interest rate headwinds.
        - 20% (requires immediate conversion of strategic partnerships into high-margin recurring ARR)
      - - Base Case
        - Revenue compounds at 20-25% reaching $115M ARR, with real estate stabilizing and moderate identity expansion.
        - 7.0x ARR multiple yielding $805M valuation (-18% vs Series E mark / flat return).
        - Margin compression from customer support and continued mortgage volume cyclicality.
        - 55% (reflects historical 33% growth deceleration and modest expansion outside core title workflows)
      - - Bear Case
        - Mortgage volumes stagnate, non-real estate traction stalls, and revenue declines or flattens at $70M.
        - 4.0x revenue multiple yielding $280M valuation (-72% vs Series E mark).
        - Significant multiple compression, down-round recapitalization, and senior liquidation overhang.
        - 25% (supported by internal down-tier pricing observed in the Series E-1 financing tranche)
    notes: Projections assume a 3-year holding period from October 2026; valuations calibrated against public identity and transaction software multiples.
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV005
      - CV009
      - CV010
