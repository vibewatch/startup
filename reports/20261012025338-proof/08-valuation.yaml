    body: The bifurcation of Proof's October 2025 Series E into a $19.40 Series E tranche and a discounted $15.52 Series E-1 tranche signals internal valuation tension and investor resistance to peak multiples, underscoring the risk of multiple compression in subsequent liquidity events.
    claimRefs:
      - CV002
      - CV003
      - CV010
