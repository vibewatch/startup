    body: While Proof demonstrates impressive scale with $200B+ in annual transaction flow and strong enterprise validation from Visa and State Farm, the company's lack of disclosed ARR, margin, and retention data makes the ~$987M Series E valuation unsupportable for new growth capital. Investors should maintain a Research-More posture.
