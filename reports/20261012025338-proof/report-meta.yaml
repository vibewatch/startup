companyProfile:
  summary: >-
    Proof is a Boston-based identity authorization and remote online notarization platform founded in 2015 as Notarize
    and rebranded in 2023. It combines transactional notarization with recurring identity verification, fraud screening,
    and KYB tooling through products such as Notarize, Verify, Defend, Certify, Proof Certificates, and x401. The
    company has meaningful enterprise adoption across regulated verticals, but its current ARR, gross margin, and net
    retention remain undisclosed, limiting a full underwriting of the current private valuation.
  founders:
    - name: Patrick Kinsel
      role: Founder and Chief Executive Officer
      background: Former founder of Spindle, the mobile data startup acquired by Twitter in 2013.
      claimRefs:
        - CO003
    - name: Adam Pase
      role: Co-founder
      background: Former congressional policy advisor who helped advance remote online notarization legislation across 38 states.
      claimRefs:
        - CO004
  foundingLocation: Boston, Massachusetts
  headquarters: Boston, MA, USA (remote-first)
  productSummary: >-
    Remote online notarization and identity authorization software spanning Notarize, Verify, Defend, Certify, Proof
    Certificates, x401, and KYB verification.
  customerFocus: >-
    Regulated enterprises in real estate, financial services, insurance, healthcare, and adjacent trust-sensitive
    workflows.
  businessModel: Transactional notarization fees, recurring subscriptions, and identity verification / fraud-prevention fees.
  stage: growth-stage venture
