evidenceGaps:
  - type: missing-source
    severity: material
    topic: financial-metrics
    missingEvidence: Audited financial statements, recent ARR, net revenue retention (NRR), and GAAP gross margins as of 2026.
    whyItMatters: >-
      Private financial opacity obscures revenue run rate, operational efficiency, and burn rate necessary to validate
      current valuation multiples.
    diligencePath: >-
      Request confidential financial disclosures or audited management accounts under non-disclosure agreement during
      formal diligence.
    relatedQuestionRefs:
      - QO009
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-and-founder-table
    missingEvidence: Complete enumeration of current board directors, independent observers, and senior vice president appointments.
    whyItMatters: >-
      Corporate governance structure and board oversight balance between founders and institutional investors cannot be
      fully audited.
    diligencePath: >-
      Examine corporate secretarial filings, Delaware state corporate records, or comprehensive management
      organizational charts.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholder-or-investor-map
    missingEvidence: >-
      Full cap table capitalization breakdown, exact equity ownership percentages, and secondary transaction share
      allocations.
    whyItMatters: >-
      Detailed voting control, liquidation preference seniority, and secondary transfer restrictions remain unverified
      from public sources alone.
    diligencePath: >-
      Review formal capitalization table (CapTable/Carta export) and certificate of incorporation during confirmatory
      legal diligence.
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: vertical-revenue-mix
    missingEvidence: >-
      Disclosed percentage breakdown of Proof's annualized revenue across real estate title/mortgage versus non-real
      estate enterprise sectors.
    whyItMatters: >-
      Validating whether Proof has established a durable standalone enterprise identity business or remains exposed to
      residential mortgage transaction volume cycles.
    diligencePath: >-
      Obtain management reporting detailing contract revenue by sector, customer GMV cohorts, and non-real estate ARR
      expansion metrics.
    relatedQuestionRefs:
      - QM009
  - type: private-evidence-only
    severity: material
    topic: pricing-models
    missingEvidence: >-
      Audited enterprise contract terms, realized net price per notarization, and tier discounting schedules for Fortune
      500 customers.
    whyItMatters: >-
      Direct enterprise contract pricing reveals whether Proof can defend premium transaction rates when competing
      against DocuSign bundle proposals.
    diligencePath: >-
      Request customer contract samples and enterprise price book schedules under confidential non-disclosure
      agreements.
    relatedQuestionRefs:
      - QP005
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: incumbent-competition
    missingEvidence: >-
