schemaVersion: report-v2
artifact: financials
slug: proof
runDate: '2026-10-12'
company:
  name: Proof
chapter:
  number: 4
  title: Financials
  summary: >-
    Proof demonstrates substantial platform transaction velocity with over $500 billion in cumulative authorized volume
    and 8,000 enterprise customers, yet the company remains financially opaque with undisclosed ARR, gross margins, and
    cash burn. The investment case hinges on Proof successfully shifting revenue from cyclically sensitive mortgage and
    title notarizations toward high-margin recurring identity authorization, while confronting incumbent pricing
    pressure from DocuSign and unresolved underwriting visibility.
sections:
  - id: revenue-streams-and-pricing-architecture
    title: Revenue Streams and Pricing Architecture
    body: >-
      Proof operates a multi-product monetization model designed to monetize both transactional legal events and
      recurring corporate compliance workflows. Historically established as an online notary network, the business
      generates transactional fee revenue from remote online notarizations across retail consumers, title agencies, and
      mortgage lenders. To expand customer lifetime value and improve revenue predictability, Proof layered subscription
      pricing tiers across its Business and Pro+ portals, requiring recurring software commitments alongside metered
      usage. The company is actively diversifying its revenue mix toward identity authorization software, monetizing its
      proprietary Defend fraud risk engine and Certify cryptographic credentials across digital assets, banking, and
      commercial title operations. While transaction volume throughput is significant, realized net revenue and average
      contract values remain unverified private metrics.
    claimRefs:
      - CI001
      - CI002
      - CI005
      - CI007
      - CI012
    tableRefs:
      - TI001
      - TI002
  - id: gtm-motion-and-unit-economics
    title: Go-To-Market Motion and Unit Economics Dynamics
    body: >-
      Proof's commercial go-to-market motion combines self-serve consumer acquisition, partner channel integrations, and
      direct enterprise sales targeting regulated sectors. The company reported expanding its customer base to over
      8,000 organizations across financial services, healthcare, government, and real estate, demonstrating strong
      commercial momentum. A major driver of enterprise adoption is the convergence of identity verification with fraud
      prevention, as 83% of financial services buyers actively seek unified identity and anti-fraud solutions. Unit
      economics differ sharply between automated identity verification and on-demand notary fulfillment. Proof absorbs
      the cost of issuing WebTrust-compliant cryptographic certificates to over 4,000 independent notaries within its
      network to preserve liquidity and transaction reliability, while automated biometric verifications scale with
      minimal marginal labor expense.
    claimRefs:
      - CI003
      - CI008
      - CI009
      - CI014
    figureRefs:
      - FI001
  - id: capital-adequacy-and-adverse-market-dependencies
    title: Capital Adequacy and Adverse Market Dependencies
    body: >-
      Proof has capitalized its growth through major institutional venture rounds, notably raising a $130 million Series
      D round in 2021 at a valuation exceeding $760 million, following earlier institutional financings. More recently,
      State Farm Ventures completed an undisclosed strategic investment to integrate Proof's identity verification and
      fraud prevention capabilities into insurance workflows, providing strategic balance-sheet support. However, Proof
      operates with material cyclical and legal dependencies. The business expanded rapidly within real estate
      settlement, leaving transaction volumes vulnerable to persistent housing affordability pressures and mortgage rate
      fluctuations. Furthermore, digital signature and notarization platforms face legal enforceability hurdles in
      strict legal venues, where bankruptcy courts have previously mandated wet ink signatures. Compounding these risks,
      incumbent e-signature giant DocuSign entered the remote notary sector by acquiring Liveoak Technologies for $38
      million and launching DocuSign Notary, creating direct pricing and distribution headwinds.
    claimRefs:
      - CI004
      - CI006
      - CI010
      - CI011
    tableRefs:
      - TI003
  - id: financial-verdict-and-underwriting-blockers
    title: Financial Verdict and Underwriting Diligence Blockers
    body: >-
      From an institutional diligence perspective, Proof presents a high-volume platform operating behind strict
      financial confidentiality. The company has publicly shared milestone statistics, including $150 billion in 2024
      authorized transaction volume and cumulative volumes surpassing $500 billion, yet withholds GAAP revenue,
      recurring software ARR, net retention, gross margins, and cash burn rates. While Proof claimed 44% growth in real
      estate volume during a housing market trough, transaction velocity cannot substitute for verified revenue quality
      or positive unit contribution margins. Until management provides audited income statements and cohort-level
      retention data under confidential disclosure, underwriting Proof's forward capital runway and secondary market
      valuation remains blocked.
    claimRefs:
      - CI002
      - CI003
      - CI013
tables:
  - id: TI001
    title: Revenue Streams and Monetization Mechanisms
    columns:
      - Revenue Stream
      - Mechanism
      - Pricing Unit
      - Current Status
      - Revenue Quality
      - Diligence Requirement
    rows:
      - - Remote Online Notarization (RON)
        - Transactional fee per completed notarization session
        - Per-session transaction fee ($25 list for consumer / tiered contract for business)
        - Core mature stream; $150B transaction volume in 2024
        - Moderate; subject to real estate and mortgage cyclicality
        - Historical revenue breakdown between retail and title/lender contracts
      - - Platform Subscriptions (Business & Pro+)
        - Monthly or annual recurring software subscription for business portals
        - Per-seat / per-organization recurring license fee
        - Active tiering across business, title, and mortgage lender portals
        - High; predictable recurring SaaS revenue
        - Disclosed ARR, paid seat counts, and gross churn metrics
      - - Identity Verification & Fraud Signals (Defend/Verify)
        - Per-verification or bundled API consumption charge
        - Per-check fee based on risk scoring and biometric matching
        - Rapidly scaling; launched Defend risk scoring and Verify biometric detection
        - High; repeatable compliance necessity across regulated fintech
        - Contract minimums, overage rates, and stand-alone API ACV
      - - Digital Credentials & Certify (Web3 & Payments)
        - Cryptographic authorization credentials and compliance screening
        - Per-credential issuance and verification network fee
        - Early adoption; commercial partnerships with Lightspark and title firms
        - High potential; non-cyclical open payment infrastructure
        - Adoption pipeline, commercial transaction take rates, and customer ramp
    notes: >-
      Mechanisms and current status compiled from Proof platform announcements and product documentation. Realized
      revenue figures, customer contract minimums, and net churn rates remain undisclosed private metrics.
    claimRefs:
      - CI001
      - CI002
      - CI007
      - CI012
  - id: TI002
    title: Platform Pricing and Packaging Structure
    columns:
      - Product Edition
      - Target Market
      - List Pricing Structure
      - Included Capabilities
      - Discount & Overage Factors
      - Financial Implication
    rows:
      - - On-Demand Consumer Notarization
        - Individuals and retail consumers
        - $25 per initial notarization; $10 per additional notary stamp
        - Identity verification, video session with on-demand notary, encrypted audit log
        - No recurring discount; transaction fee charged at point of service
        - Immediate cash generation with zero customer acquisition lock-in
      - - Business / Pro+ Portal
        - SMBs, legal practices, and corporate teams
        - Monthly SaaS base fee plus metered notarization transactions
        - Multi-user seats, custom branding, audit logs, and EasyLinks
        - Annual upfront commitment discounts; volume-tiered per-session rates
        - Predictable baseline subscription with usage expansion upside
      - - Title & Lender Solutions
        - Title agencies, settlement agents, and mortgage lenders
        - Custom enterprise contract based on anticipated closing volume
        - RON, eSign, lender portal integrations, hybrid closing workflows
        - Custom enterprise negotiated pricing; minimum monthly commitments
        - High contract value subject to residential real estate volume volatility
      - - Enterprise Identity (Verify / Certify)
        - Regulated financial institutions and fintechs
        - Custom enterprise annual platform fee plus volume-based API verification tiers
        - NIST IAL2 biometric checks, Defend fraud risk scoring, Travel Rule compliance
        - Tiered API volume discounting with multi-year enterprise commitments
        - High gross margin potential when automated verification succeeds without human intervention
    notes: >-
      Pricing tiers reflect public platform documentation and announced enterprise solutions. Specific enterprise
      contract terms, realized ARPU, and volume discount schedules are proprietary to Proof and require confidential
      underwriting access.
    claimRefs:
      - CI005
      - CI007
      - CI012
      - CI014
  - id: TI003
    title: Unit Economics and Underwriting Benchmarks
    columns:
      - Metric Dimension
      - Reported / Estimated Value
      - Confidence Level
      - Economic Significance
      - Diligence Requirement
    rows:
      - - Annual Authorized Transaction Volume
        - $150B (2024 annual); $500B+ cumulative
        - Medium (Company-reported)
        - Demonstrates massive platform throughput and transaction velocity
        - Reconciliation of authorized transaction dollar volume to realized fee revenue
      - - Customer Organization Base
        - 8,000+ organizations across key regulated sectors
        - Medium (Company-reported)
        - Indicates broad enterprise footprint and lower single-customer concentration risk
        - Customer tier distribution across enterprise vs SMB self-serve accounts
      - - Notary Network Operational Cost
        - Zero-cost certificate issuance to 4,000+ network notaries
        - Medium (Third-party reported)
        - Proof absorbs cryptographic certificate costs to sustain supply liquidity
        - Notary contractor payment schedule and blended cost per completed human session
      - - Automated vs Human Session Economics
        - Underlying margin split not publicly disclosed
        - Low (Private-metric gap)
        - Automated biometric checks yield >80% margin while human notary sessions incur labor COGS
        - Percentage of transactions resolved via pure automation versus human notary fallback
    notes: >-
      Metrics reflect company announcements and third-party industry reports. True gross margin, contribution margin per
      transaction, and customer acquisition cost (CAC) payback remain private company data.
    claimRefs:
      - CI001
      - CI002
      - CI005
      - CI008
      - CI009
      - CI013
figures:
  - id: FI001
    title: Proof Commercial Revenue and Gross Margin Bridge
    type: flow
    summary: >-
      Sequential operational flow illustrating how customer demand converts through automated verification, fraud
      detection, and notary fulfillment into platform revenue and gross margin.
    data:
      nodes:
        - id: intake
          label: 1. Transaction Initiation & Portal Access
          description: Customer initiates transaction via API, EasyLink, or business portal on subscription tier
        - id: idv
          label: 2. Automated Identity Verification
          description: Platform executes biometric selfie scan, credential analysis, and NIST IAL2 validation
        - id: fraud-check
          label: 3. Real-Time Fraud Assessment (Defend)
          description: Automated risk scoring monitors 400+ signals with low incremental compute cost
        - id: fulfillment
          label: 4. Fulfillment & Session Execution
          description: Pure automated cryptographic eSign or routing to on-demand human notary network
        - id: credentials
          label: 5. Audit Trail & Cryptographic Certification
          description: Generation of tamper-evident digital certificate and WebTrust-compliant audit log
        - id: monetization
          label: 6. Fee Settlement & Margin Realization
          description: Recognition of software subscription and transaction fees minus notary labor and vendor costs
      edges:
        - from: intake
          to: idv
        - from: idv
          to: fraud-check
        - from: fraud-check
          to: fulfillment
        - from: fulfillment
          to: credentials
        - from: credentials
          to: monetization
    approximationNotes: >-
      Process flow model conceptualizes Proof's commercial transaction conversion mechanics; exact cost allocations
      between automated processing and human notary compensation are not publicly disclosed.
    claimRefs:
      - CI007
      - CI008
      - CI009
      - CI012
callouts:
  - calloutType: insight
    title: 'Bifurcated Unit Economics: Automated Software Versus Human Network'
    body: >-
      Proof's financial profile is fundamentally determined by the operational divergence between its high-margin
      automated identity verification products and its labor-intensive on-demand notary network. While API-driven
      identity verification and digital credentialing scale at near-zero marginal cost, notary sessions require human
      witnesses and certificate subsidies that compress blended transaction margins.
    claimRefs:
      - CI008
      - CI009
      - CI012
  - calloutType: risk
    title: 'Underwriting Impasse: Secondary Valuation Unanchored by Disclosed Fundamentals'
    body: >-
      Without verified disclosure of current ARR, gross margin percentage, net revenue retention, or operating burn
      rate, investors cannot rigorously validate whether Proof's historical capital raises and secondary market
      valuations reflect sustainable SaaS economics or an overcapitalized business navigating cyclical mortgage
      transaction exposure.
    claimRefs:
      - CI003
      - CI006
      - CI013
