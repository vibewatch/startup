    - type: missing-source
      severity: material
      topic: financial-concentration-risk
      missingEvidence: Audited financial breakdown of revenues by sector separating title agency and mortgage closings from commercial eSign and insurance identity verification.
      whyItMatters: High reliance on cyclical real estate transactions leaves corporate cash flow and platform margins vulnerable to macro mortgage volume contractions.
      diligencePath: Obtain detailed revenue schedules detailing customer concentration by vertical, title agency volume contributions, and non-mortgage annual contract values.
      relatedTableRefs:
