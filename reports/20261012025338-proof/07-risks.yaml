      - CR009
  - calloutType: insight
    title: Legal Enforceability and Interstate Friction
    body: Although 24/7 on-demand notarization is technically operational across all 50 states, interstate recognition disparities and the stalled federal SECURE Notarization Act leave local recording and county acceptance vulnerable to jurisdictional challenge.
    claimRefs:
      - CR001
      - CR002
      - CR014
