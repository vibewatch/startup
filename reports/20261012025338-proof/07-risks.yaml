    - type: private-evidence-only
      severity: minor
      topic: partner-dependency-risk
      missingEvidence: Service level agreements and secondary fallback architecture for third-party business data verification providers including Enigma.
      whyItMatters: Single-source reliance on external KYB data sources creates an unhedged operational bottleneck if API rate limits or vendor service interruptions occur.
