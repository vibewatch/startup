chapter:
  number: 7
  title: Risks
  summary: Proof navigates substantial legal, operational, and macroeconomic risk vectors, including state-level remote online notarization recognition disparity while the federal SECURE Notarization Act remains stalled, acute exposure to real estate transaction cyclicality, and user-reported technical friction across live notary sessions.
sections:
  - id: regulatory-and-legal-framework
    title: Regulatory Compliance, State RON Disparity, and Legal Enforceability
    body: 'Proof operates in a legally nuanced environment governed by state notarial statutes rather than a harmonized federal framework. Although remote online notarization is recognized across most U.S. states, statutory variations in notary jurisdiction, credential analysis standards, and acceptable audio-visual recording retention create continuing compliance overhead. Federal legislation intended to establish nationwide minimum standards—the SECURE Notarization Act of 2023 (H.R. 1059)—passed the House but remains stalled in the Senate Committee on the Judiciary following its referral in February 2023. Consequently, remote transactions remain exposed to inconsistent municipal recording practices and potential title insurer challenges. Furthermore, document fraud represents a severe national liability vector: FinCEN estimates indicate false records cause $45 billion in fraudulent activity annually across the United States. Proof mitigates liability through rigorous compliance, yet its Help Center terms explicitly state that platform documentation does not constitute legal advice, placing local validity risks squarely upon transacting enterprise customers.'
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR014
    tableRefs:
      - TR001
  - id: operational-reliability-and-fraud-mitigation
    title: Operational Reliability, Failure Modes, and Anti-Fraud Defenses
    body: 'The rapid emergence of artificial intelligence deepfakes, synthetic identity manipulation, and biometric injection attacks represents a critical operational risk for high-value transaction authorization. The FBI IC3 reported that cyber-enabled fraud drove an unprecedented $16.6 billion in economic losses in 2024, highlighting the intensifying threat landscape confronting online authentication platforms. Proof addresses these vectors through Defend, its proprietary fraud intelligence system that continuously analyzes over 100 network risk signals and evaluates live video streams with machine learning models trained on hundreds of thousands of hours of video data. These controls are reinforced by rigorous independent security attestations, including Kantara Initiative IAL2 certification, AICPA SOC 2 Type II compliance, MISMO mortgage certifications, and Schellman WebTrust audits. Despite these defensive layers, customer reviews and Better Business Bureau records indicate residual operational vulnerabilities: users report occasional session disconnects during live video notarization, transactions stuck in verification queues, and unexpected document rejections arising from unfamiliar state requirements or technical glitches.'
    claimRefs:
      - CR004
      - CR005
      - CR006
      - CR007
    tableRefs:
      - TR002
    figureRefs:
      - FR001
  - id: counterparty-and-macro-concentration
    title: Counterparty Dependencies, Housing Cyclicality, and Entity Administration
    body: 'Proof displays significant business model concentration in the real estate settlement ecosystem, having historically facilitated more than $640 billion in real estate transactions. While the platform demonstrated resilience in 2024 by authorizing $150 billion in total transactions and recording 44% growth in real estate volume despite U.S. existing home sales dropping to multi-decade lows, its growth trajectory remains intrinsically coupled to mortgage origination and housing turnover. To diversify beyond real estate, Proof has expanded into enterprise eSign and formed strategic partnerships, notably securing an investment from State Farm Ventures to deploy digital identity verification across insurance claims and underwriting. Operationally, Proof exhibits partner dependency on Enigma Technologies, which supplies automated Know Your Business verification data for customer onboarding. Additionally, Proof maintains dual corporate identities: while customer-facing branding transitioned to Proof, business operations, customer invoicing, and check payments remain administered under Notarize, Inc. (dba Proof.com), requiring client IT adjustments and corporate allow-list updates.'
    claimRefs:
      - CR008
      - CR009
      - CR010
      - CR011
      - CR012
      - CR013
    tableRefs:
      - TR003
  - id: thesis-break-triggers-and-kill-criteria
    title: Investment Implications, Thesis-Break Triggers, and Diligence Asks
    body: 'From an underwriting perspective, Proof possesses defensible technical infrastructure and prestigious institutional certifications, but faces distinct macroeconomic, legal, and operational risks. Key thesis-break triggers include: first, judicial invalidation or state appellate rulings rejecting out-of-state remote online notarizations for real estate deeds, which would sever volume from conservative title underwriters; second, prolonged depression in national mortgage refinance and purchase transactions exceeding Proof''s non-real-estate expansion velocity; and third, any successful deepfake bypass or biometric spoofing incident on the Defend platform resulting in significant commercial loan fraud or financial loss. Diligence must focus on establishing audited non-real-estate revenue share, tracking enterprise churn related to session reliability glitches reported in Better Business Bureau complaints, and verifying contingency failover mechanisms for single-source data providers such as Enigma.'
    claimRefs:
      - CR001
      - CR005
      - CR008
      - CR014
