  title: "Customers"
  summary: "Proof serves over 7,000 customers across mortgage lending, title settlement, and general enterprise segments, driving $150 billion in authorized transactions in 2024. Production deployments at major counterparties like United Wholesale Mortgage (30,000+ digital closings) demonstrate deep workflow integration, but revenue durability remains exposed to cyclical real estate concentration and undisclosed net retention rates."
sections:
  - id: "customer-base-segmentation"
    title: "Customer Base Segmentation and Buyer Personas"
    body: "Proof organizes its commercial customer base into three primary buyer and user categories: mortgage lenders, title and settlement agencies, and general commercial enterprises. Mortgage lenders represent a foundational transactional constituency, deploying Proof's remote online notarization (RON) and eClosing tools to accelerate digital loan fulfillment and secondary-market saleability. Title agents and settlement attorneys operate as critical operational nodes in property transactions, utilizing the platform to coordinate escrow closings, manage document packages, and execute notarizations with remote signers. General commercial enterprises increasingly adopt Proof Sign and Business Pro+ plans to execute corporate agreements, human resources documentation, and vendor contracts. Additionally, independent notaries access Proof's on-demand network to receive transaction volume around the clock, functioning as a decentralized fulfillment engine. While Proof markets comprehensive coverage across these segments, commercial contribution remains heavily weighted toward real estate closing workflows, where buyer persona requirements are deeply intertwined with title agent operational preferences and lender compliance mandates."
    claimRefs:
      - "CU007"
      - "CU009"
      - "CU014"
    tableRefs:
      - "TU001"
  - id: "adoption-trajectory-volume"
    title: "Adoption Trajectory and Transaction Volume Scale"
    body: "Proof's operational scale has demonstrated significant throughput expansion, reaching $150 billion in authorized platform transactions in 2024. Despite a historic downturn in U.S. residential real estate and lowest home sales since 1995, Proof recorded 44% year-over-year volume growth in the real estate sector. This counter-cyclical growth indicates ongoing market share capture from paper-based closing processes, driven by measurable lender cost savings. An independent evaluation by MarketWise Advisors established that full eClosing with online notarization saves lenders up to $444 per loan and settlement agents up to $100 per transaction through eliminated shipping, reduced cycle times, and reduced document errors. However, the Mortgage Bankers Association's documentation of sharp origination contractions and rising origination expenses highlights the cyclical volatility inherent in mortgage-driven software revenues. Without published disclosures breaking down annual recurring revenue (ARR) versus usage-based transaction fees, the exact financial durability of this transaction throughput across different housing cycles remains a crucial diligence question."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU006"
      - "CU012"
    tableRefs:
      - "TU002"
  - id: "named-customer-evidence"
    title: "Production Deployments and Named Customer Proof"
    body: "Verified production case studies substantiate that Proof has transitioned key enterprise accounts beyond initial pilots into high-volume digital workflows. In residential lending, United Wholesale Mortgage (UWM) represents a premier reference deployment, where independent mortgage brokers completed over 30,000 digital closings and refinancings on Proof in 2025 across signers in nearly every state. Outside residential mortgage origination, commercial finance lender Alliance Funding Group replaced paper mailing with Proof RON, reducing power-of-attorney execution times from days to hours. In consumer platforms, rental marketplace Avail deployed Proof identity verification to establish verified identities between landlords and prospective tenants, preventing fraudulent listings and forged credentials. Furthermore, State Farm Ventures formed a strategic investment and commercial partnership with Proof to deploy digital verification across insurance documentation. These reference accounts prove that Proof's identity authorization platform delivers verifiable operational outcomes across multiple verticals, although comprehensive data regarding contract durations, annual contract values, and logo retention among mid-market customers remains closely held."
    claimRefs:
      - "CU003"
      - "CU004"
      - "CU005"
      - "CU010"
    tableRefs:
      - "TU003"
  - id: "retention-expansion-risks"
    title: "Customer Journey, Expansion Dynamics, and Concentration Risks"
    body: "Proof's customer journey expands from single transaction fulfillment into enterprise-wide identity governance. Organizations typically initiate usage through targeted remote notarizations or eSign workflows, frequently catalyzed by lender mandates or urgent closing deadlines. As transaction volumes stabilize, enterprises embed Proof via API integrations, adopting Proof Sign for general contract execution and deploying Know Your Business (KYB) verification to credential organizational counterparties. The rollout of WebTrust-compliant Proof Certificates and deepfake detection tools (Verify) establishes a pathway to upsell customers from commoditized eSign into premium fraud mitigation and risk scoring (Defend). Nonetheless, significant customer concentration and discovery friction persist. Real estate transactions continue to generate the majority of platform activity, exposing Proof to lender consolidation and title agency churn. Concurrently, external brand collision with unrelated B2B platforms such as Southern Glazer's wholesale ordering system complicates organic customer acquisition in web search channels, underscoring the necessity of direct sales channels to maintain enterprise expansion momentum."
    claimRefs:
      - "CU008"
      - "CU011"
      - "CU013"
    figureRefs:
      - "FU001"
