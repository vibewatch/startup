  - id: core-modules
    title: Core modules — discovery, posture, and threat protection
    body: >-
      API Discovery is delivered through three complementary data paths: Salt Connect (agentless connectors pulling metadata from AWS, Azure, GCP, Kong, Apigee, MuleSoft, NGINX, and Istio via traffic mirroring), Salt Surface (external attack-surface scanner that maps public-facing APIs from an adversary's perspective), and GitHub Connect (code-repository scanner launched November 2025 that identifies APIs and MCP server configurations in source before deployment). Together these three paths address the industry limitation Salt's own research identified: CDN-based single-source discovery misses an estimated 30.7% of APIs. The Posture Management engine, centered on the Policy Hub, ships with approximately 100 pre-loaded rules and allows custom rule authoring. Salt's 2025 State of API Security Report found only 10% of enterprises have deployed an API posture governance strategy, which frames the Policy Hub as an early-mover advantage. The Threat Detection engine uses behavioral ML baselines to detect BOLA/IDOR, credential stuffing, account takeover, data exfiltration, session manipulation, API abuse, and injection attacks—categories Salt's research shows make up roughly 80% of attacks mapped to the OWASP API Security Top 10. Attack remediation surfaces actionable developer guidance through SIEM and ticketing integrations (Splunk, Microsoft Sentinel, Jira). Sensitive-data tracking maps PII, PHI, and payment-card data flowing through APIs in motion, feeding both posture reports and compliance exports.
