  - id: TE003
    title: Technology / operating architecture
    columns:
      - Layer / Component
      - Role
      - Dependency / Technology
      - Risk
    rows:
      - - Salt Connect (traffic ingestion)
        - Receives copy of API traffic via mirroring from gateways and cloud sources
        - AWS, Azure, GCP, Kong, Apigee, MuleSoft, NGINX, Istio, Akamai, Cloudflare, F5
        - Traffic-copy availability depends on gateway cooperation; bypass is possible if team uses unlisted gateway
      - - API Data Lake
        - Stores and indexes API metadata for ML training and historical threat correlation
        - AWS-hosted, Kafka message queue, Kubernetes orchestration
        - Central cloud dependency on AWS; EDP commitment creates switching friction
      - - Behavioral ML Engine (patented)
        - Baselines legitimate API behavior across hundreds of attributes; detects attacker reconnaissance
        - Proprietary ML models; company-operated model training on customer metadata
        - Model drift risk if traffic patterns change rapidly; accuracy on novel attack vectors unverified
      - - Policy Hub
        - Evaluates API configurations against ~100 pre-loaded and custom posture rules
        - Internally developed rule engine; framework mappings maintained by Salt
        - Rule coverage accuracy depends on Salt's framework interpretation; no independent rule audit available
      - - Agentic Security Graph
        - Contextualizes risk across LLMs, MCP servers, and APIs by mapping their interconnections
        - Extends the core data lake and ML engine to agent-driven traffic
        - Relatively new (March 2026); production scale and accuracy benchmarks not yet publicly reported
      - - GitHub Connect
        - Pre-deployment API and MCP discovery via code-repository analysis
        - Read-only OAuth integration into public/private GitHub repos; traffic-free risk scoring
        - Dependent on GitHub API availability; limited to GitHub repositories (GitLab, Bitbucket not confirmed)
      - - Ask Pepper AI
        - Natural-language query interface over platform data
        - Generative-AI assistant (underlying LLM provider not disclosed)
        - LLM provider and data-handling policy for analyst queries not publicly documented
      - - SIEM / Response Integrations
        - Sends alerts and enriched context to security operations tooling
        - Splunk, CrowdStrike Falcon, Microsoft Sentinel, Jira, Slack
        - Integration depth varies by platform; no public SLA on alert delivery latency
    notes: >-
      Layer descriptions draw from official Salt pages, technical PDFs from CrowdStrike marketplace and AllCloud/Datadog case study, and the AppSec Santa technical review. No public architecture diagram confirming exact component boundaries is available; this table synthesizes public evidence with appropriate inference labels.
