callouts:
  - calloutType: strength
    title: Agentless, zero-latency deployment differentiates against inline API gateways
    body: >-
      Salt's traffic-mirroring architecture means no code changes and no impact on application request latency. Enterprise buyers replacing legacy WAF or gateway-based controls can deploy Salt alongside existing tooling without architectural change. The AllCloud case study documents Salt processing several million messages per minute at production scale on AWS, and G2 and PeerSpot reviewers consistently cite ease of deployment as a key advantage.
    claimRefs:
      - CE002
      - CE003
      - CE029
      - CE030

  - calloutType: strength
    title: Agentic Security Platform is first-to-market for full-stack AI agent security
    body: >-
      Salt's March 2026 Agentic Security Platform—combining AG-SPM, AG-DR, MCP Protect, GitHub Connect, and Ask Pepper AI—represents the first unified offering to secure LLMs, MCP servers, and APIs as an interconnected Agentic Security Graph. Siemens CISO validation and a 327-person enterprise survey anchoring the 1H 2026 launch provide early demand-side proof. No competitor is publicly documented securing all three agentic stack layers simultaneously.
    claimRefs:
      - CE020
      - CE021
      - CE022
      - CE025
      - CE026

  - calloutType: risk
    title: Mindshare erosion and limited independent benchmarks are competitive risks
    body: >-
      One 2026 market research source reports Salt's API security buyer mindshare dropped from 13% (2025) to 7% (2026), suggesting competitive pressure from Imperva, Akamai, 42Crunch, and others. G2 shows only 12 reviews—low for a company claiming global enterprise reach. No independent benchmark of Salt's behavioral detection accuracy, false-positive rate, or MTTA/MTTR has been published. gRPC support is unconfirmed. These gaps make objective performance comparison against alternatives difficult for buyers.
    claimRefs:
      - CE046
      - CE047
      - CE048

  - calloutType: risk
    title: Trust-surface gaps—no public status page, SLA, or own-platform certifications
    body: >-
      Salt's public trust surface lacks a status page, contractual uptime SLA, SOC 2 Type II disclosure, ISO 27001 certification, or FedRAMP authorization. The data-processing model (Salt receives copied API metadata in its cloud data lake) creates a shared-responsibility boundary that requires enterprise buyers to assess Salt's own security posture—currently assessable only via UpGuard's external "B" rating, not a formal audit artifact.
    claimRefs:
      - CE036
      - CE037
      - CE038
      - CE039
      - CE040

