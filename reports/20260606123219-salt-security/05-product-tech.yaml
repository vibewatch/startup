  - id: roadmap-releases
    title: Roadmap, releases, and development velocity
    body: >-
      Salt's public 2025 release cadence, documented in its "12 Months of Innovation" press release, shows one major product launch per month across discovery, posture, runtime protection, MCP/agentic AI security, and conversational investigation features. Key 2025 releases: Salt Illuminate (June 2025, unified platform brand), Salt Surface (July 2025, external attack-surface scanner), AI Agent API Security at CrowdStrike Fal.Con (September 2025), GitHub Connect and MCP Finder (November 2025), and Ask Pepper AI plus AWS WAF MCP protection (December 2025). In March 2026 Salt launched the Agentic Security Platform with AG-SPM and AG-DR, its largest architectural expansion to date. Salt Code (AI coding assistant security) was announced June 2026. The GitHub org (SECful) shows active commits through May 2026 across open-source tools including Peekaboo (visual API discovery scanner, Python), api_extractor (REST API extraction from source code), apk-processor (Android APK API extraction, Go), url_learning_v2 (high-performance path-template trie, Java, 1.2M lookups/sec), deployment_ai_advisor (AI-powered infrastructure recommendations), and terraform-ibm-salt-cloud-connect (Terraform module for IBM Cloud, updated May 2026). Competitive mindshare concern: one market research source reports Salt's API security buyer mindshare fell from 13% in 2025 to 7% in 2026, indicating competitive erosion despite rapid product innovation. gRPC support has not been confirmed in any reviewed source and remains an evidence gap; the platform clearly supports REST and GraphQL and is documented for WebSocket traffic mirroring.
