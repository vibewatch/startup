  - id: trust-compliance
    title: Trust, security, and compliance
    body: >-
      Salt's Policy Hub ships with approximately 100 pre-loaded posture rules aligned to PCI DSS, HIPAA, GDPR, SOC 2, NIST, CMMC, and FedRAMP. These are framework mappings for customer APIs, not certifications of Salt's own platform. The cloudsecurity.org technical assessment maps the platform to ISO 27001 controls for incident management (5.24–5.28) and access control (5.15–5.18), noting Salt supports continuous API traffic monitoring, anomaly detection, SIEM integration, and enforcement commands to block unauthorized access. UpGuard's June 2026 security rating assigned Salt Security a "B" grade based on externally verifiable posture checks, noting a flagged content-security-policy (CSP) concern but no major breach history. The CrowdStrike marketplace brief notes that Salt connects Salt API intelligence into the CrowdStrike security ecosystem for closed-loop protection, integrating with AWS WAF for enforcement at the edge (announced December 2025). Salt has not publicly disclosed SOC 2 Type II, ISO 27001, or FedRAMP certifications for its own SaaS platform. The data-processing model—in which Salt receives metadata copied from customer API traffic—creates a shared-responsibility boundary: Salt processes API metadata in its cloud data lake, which requires customers to trust Salt's own security controls for potentially sensitive API behavioral data. This trust boundary is a standard diligence ask for enterprise security buyers but is not publicly addressed in Salt's current trust surface.
