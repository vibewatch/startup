chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Salt Security's Salt Illuminate platform delivers agentless API discovery, posture governance, and behavioral-AI threat detection across REST, GraphQL, and WebSocket traffic in cloud-native and hybrid environments. The March 2026 Agentic Security Platform launch extended coverage to LLMs, MCP servers, and AI agent orchestration layers, positioning Salt as the first vendor securing the full agentic stack. Core technical differentiators—a patented behavioral ML engine, an API data lake, no-inline traffic mirroring, and a ~100-rule Policy Hub—are well evidenced from official and third-party sources; however, gRPC support, formal ISO/SOC 2 certification status, detailed SLA figures, and production attach-rate data remain undisclosed and require diligence confirmation.

sections:
  - id: platform-overview
    title: Platform definition and architecture
    body: >-
      Salt Security markets its core product as Salt Illuminate, a SaaS-delivered API security platform that operates agentlessly by mirroring API traffic through cloud connectors (Salt Connect) to an off-path cloud data lake. No inline agent is inserted into the request path, so application latency is unaffected. The platform then applies behavioral machine learning to establish per-API traffic baselines—modelling hundreds of attributes such as parameter consistency, request frequency, response volume, and device or address patterns—and flags deviations as attacker reconnaissance before credentials are compromised or data is exfiltrated. The company describes this engine as patented. The three top-level platform capabilities are API Discovery & Visibility (finding shadow, zombie, internal, partner, and public APIs), API Posture & Compliance (mapping APIs against ~100 pre-loaded security rules covering PCI DSS, HIPAA, GDPR, SOC 2, NIST, CMMC, and FedRAMP), and API Threat Detection & Protection (behavioral anomaly detection and early blocking). In March 2026 Salt launched the Agentic Security Platform, expanding coverage to LLMs, MCP servers, and AI agent traffic under the umbrella of the Agentic Security Graph—a contextual risk layer mapping relationships between reasoning, execution, and action layers of modern AI stacks. Salt frames this as securing the full agentic lifecycle from code (GitHub Connect, November 2025) to runtime (AG-DR). The platform is available as SaaS or on-premises, integrates with AWS, Azure, GCP, and major API gateways, and claims deployment within minutes for the initial cloud-connect step.
