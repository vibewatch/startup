  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: trust-compliance
      missingEvidence: SOC 2 Type II report, ISO 27001 certificate, or FedRAMP authorization for Salt's SaaS platform
      whyItMatters: Enterprise procurement and government cloud use typically require these certifications; their absence from public sources prevents buyer assessment of Salt's own security posture
      diligencePath: Request current certification status, latest audit reports, and DPA/data-processing agreement from Salt Security directly during procurement
      relatedQuestionRefs: [QE007, QE023]

    - type: private-evidence-only
      severity: material
      topic: performance-metrics
      missingEvidence: Independent benchmarks of detection accuracy, false-positive rate, MTTA/MTTR, and alert volume for the behavioral ML engine
      whyItMatters: Self-reported metrics (96% fewer alerts, 20× faster resolution) from a vendor-authored PDF cannot substitute for independent validation in a competitive evaluation
      diligencePath: Request reference customers for POC performance validation; seek independent analyst assessments comparing Salt to Imperva, Akamai, and 42Crunch
      relatedQuestionRefs: [QE014, QE018]

    - type: missing-source
      severity: minor
      topic: protocol-support
      missingEvidence: Confirmed gRPC support documentation or explicit statement from Salt
      whyItMatters: gRPC is a common enterprise API protocol; uncertainty about support limits deployment scope assessment for gRPC-heavy architectures
      diligencePath: Confirm gRPC support with Salt technical team during POC or procurement
      relatedQuestionRefs: [QE002]

    - type: missing-source
      severity: minor
      topic: github-connect
      missingEvidence: Documentation of non-GitHub code repository support (GitLab, Bitbucket, Azure Repos)
      whyItMatters: Enterprises using non-GitHub repositories cannot benefit from shift-left MCP/API discovery if other platforms are unsupported
      diligencePath: Confirm supported code-hosting platforms in Salt Illuminate documentation or with product team
      relatedQuestionRefs: [QE013]

    - type: private-evidence-only
      severity: material
      topic: ask-pepper-ai
      missingEvidence: Underlying LLM provider and data-handling policy for analyst queries submitted via Ask Pepper AI
      whyItMatters: Enterprise buyers need to understand if analyst queries (potentially containing sensitive API metadata or investigation context) are processed by a third-party LLM
      diligencePath: Request data-handling documentation and LLM provider disclosure for Ask Pepper AI from Salt Security
      relatedQuestionRefs: [QE012]

    - type: missing-source
      severity: material
      topic: trust-compliance
      missingEvidence: Public uptime SLA, historical availability data, and public status page URL for Salt Illuminate SaaS
      whyItMatters: No contractual or published reliability commitment is available for evaluation; enterprise security platforms typically offer 99.9%+ SLA commitments
      diligencePath: Request contractual SLA, incident history, and status-page URL from Salt
      relatedQuestionRefs: [QE007]

    - type: missing-source
      severity: minor
      topic: competitive-differentiation
      missingEvidence: Direct head-to-head functional comparison of Salt Surface versus dedicated DAST tools (Burp Suite, OWASP ZAP) or attack-surface management platforms (Cybersixgill, Censys, runZero)
      whyItMatters: Without a direct comparison, buyers cannot determine whether Salt Surface provides enough DAST/ASM capability to replace dedicated tools or only supplements them
      diligencePath: Request a competitive POC evaluation against a dedicated attack-surface management platform; ask Salt for differentiation documentation referencing specific competitor capabilities
      relatedQuestionRefs: [QE022]

    - type: missing-source
      severity: minor
      topic: ip-patents
      missingEvidence: Public patent filings, patent numbers, or formal IP registration details for Salt's behavioral ML engine beyond the company's generic "patented" marketing claim
      whyItMatters: The strength of IP protection affects defensibility against competitors building similar behavioral ML approaches; unverified IP claims cannot be valued in a diligence context
      diligencePath: Search USPTO and patent databases for Salt Security / Secful Inc. filings; request patent portfolio list from Salt legal team during diligence
      relatedQuestionRefs: [QE026]

