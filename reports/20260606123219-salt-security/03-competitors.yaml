- id: moat-durability
  title: Moat durability and underwriting takeaway
  body: |-
    Salt’s moat is real, but narrower than a category-creator narrative might imply. The company still has a coherent specialist story around discovery, posture governance, behavioral analysis, and partner-friendly deployment into existing stacks. That depth should remain valuable in environments where generic WAAP checklists miss business-logic abuse, contract drift, or workflow integration needs. The presence of direct specialists such as Cequence, Wallarm, and 42Crunch also suggests the market has not fully commoditized into a single WAAP feature bucket.

    The harder underwriting issue is whether Salt can preserve premium positioning as more buyers default to platform consolidation. Inline-capable specialists can turn the conversation into a “detect versus block” objection. WAAP and CNAPP vendors can turn it into a “why buy another point product?” objection. Hybrid or regulated buyers can favor vendors with explicit traffic-path control or hybrid deployment language. Meanwhile, public sources still do not reveal comparative win rates or delivered economics. That means the right conclusion for later risk and valuation work is not that Salt lacks differentiation, but that its durability depends on proving three things with private evidence: first, that behavioral analytics and posture governance translate into measurable customer outcomes; second, that partner-led distribution expands pipeline faster than platforms internalize the feature set; and third, that Salt can defend margin and renewal quality even as API security becomes a standard evaluation criterion inside broader app-security platforms.
