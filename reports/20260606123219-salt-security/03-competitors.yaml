  - type: private-evidence-only
    severity: material
    topic: competitive-win-rates
    missingEvidence: Named win-loss data or bake-off summaries showing which vendors prevail in direct API-security evaluations and in broader platform-consolidation deals.
    whyItMatters: Without win-rate evidence, the chapter can describe pressure points but cannot prove whether Salt is taking share or merely surviving in attractive evaluations.
    diligencePath: Request anonymized CRM win-loss data, partner-sourced pipeline commentary, and reference-call notes broken out by deployment model and buyer size.
    relatedQuestionRefs:
    - QP025
  - type: missing-source
    severity: material
    topic: partner-distribution-economics
    missingEvidence: Independent evidence on the pipeline and retention contribution from CrowdStrike and Wiz partnerships relative to direct sales motion.
    whyItMatters: Partnerships look strategically important, but the public record does not quantify whether they expand durable distribution or simply enrich larger platforms.
    diligencePath: Ask management for sourced-pipeline mix, influenced ARR, attach rate, and renewal outcomes for CrowdStrike- and Wiz-connected customers.
