- id: TP003
  title: Deployment / packaging / public pricing comparison
  columns:
  - Vendor cluster
  - Deployment posture
  - Public pricing / packaging visibility
  - Public buyer-fit signal
  - Implication
  rows:
  - - Salt
    - Works with existing stack and partner workflows
    - No retained public list pricing; marketplace and integration packaging only
    - Best when buyer wants dedicated API context without replacing platform stack
    - Economics still require live proposals and partner-influenced deal context.
  - - Akamai / Noname
    - Cloud, edge, on-premises, and third-party environments claimed
    - Opaque in retained public set
    - Best for enterprises already buying app and API security from Akamai
    - Bundle leverage may beat pure product depth in some deals.
  - - Traceable
    - Design-to-runtime platform inside Harness
    - Opaque in retained public set
    - Best for buyers blending DevSecOps and API security
    - Platform adjacency matters more than public list pricing.
  - - Cequence / Wallarm
    - Cequence UAP plus Wallarm hybrid or managed inline deployment
    - Opaque in retained public set
    - Best for teams prioritizing blocking and abuse defense
    - Inline enforcement can reframe the buying criteria away from analytics alone.
  - - 42Crunch
    - Containerized API Firewall and contract-driven platform deployment
    - Opaque in retained public set
    - Best for spec-first teams with mature OpenAPI ownership
    - Buyers can justify the tool as a development and runtime control, not just SOC software.
  - - Cloudflare / Fastly / Prisma
    - Bundled edge or CNAPP packaging with broader app-security services
    - Cloudflare shows add-on and SLA structure; others remain largely consultative in retained set
    - Best for platform-consolidation buyers
    - Public packaging is clearer than delivered TCO, so bundle comparisons still need proposals.
  - - Kong / gateway substitute
    - Open source, enterprise, and Konnect deployment paths
    - Tier structure is clearer than specialist API-security vendors
    - Best when buyer wants gateway control, auth, and rate limiting first
    - Substitutes can absorb budget before a dedicated API-security platform is purchased.
  notes: This exhibit compares pricing visibility and packaging style rather than pretending public sources reveal true delivered software plus services cost.
