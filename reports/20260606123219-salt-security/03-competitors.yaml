sections:
- id: landscape
  title: Landscape and competitor classes
  body: |-
    Salt no longer competes in a clean pure-play API-security lane. The direct API-native set still matters most in product-to-product evaluations: Akamai after its Noname acquisition, Traceable by Harness, Cequence, Wallarm, and 42Crunch each sell a recognizably dedicated API-security story. But the market boundary has widened in two directions. First, broader WAAP and CNAPP vendors such as Prisma Cloud, Cloudflare, Fastly, and Imperva now market discovery, protection, and posture capabilities as part of bigger app, edge, or cloud-security platforms. Second, substitutes such as Kong-style gateways and bot specialists like DataDome can absorb narrower budget lines when a buyer wants validation, rate limiting, or abuse defense rather than a full API-security control plane.

    The category is also consolidating. Noname was absorbed by Akamai, while Traceable merged with Harness, showing that API security is increasingly being distributed through larger security and delivery platforms rather than remaining a standalone procurement motion. That matters for Salt because buyer shortlists now mix pure-play vendors, edge or WAAP suites, CNAPP platforms, and status-quo controls in the same evaluation. The chapter therefore treats the field as four classes: direct API-native rivals, bundled WAAP and cloud incumbents, gateway or edge substitutes, and partner platforms that both help Salt distribute and highlight where the market is converging.
