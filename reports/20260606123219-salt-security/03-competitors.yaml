chapter:
  number: 3
  title: Competitors
  summary: Salt Security’s sharpest direct competition still comes from dedicated API-security peers such as Akamai after Noname, Traceable by Harness, Cequence, Wallarm, and 42Crunch, but the bigger underwriting pressure now comes from WAAP and CNAPP vendors that bundle API protection into broader platforms. Salt retains a differentiated public story around discovery, posture governance, and behavioral analytics, yet its moat is increasingly tested by inline-blocking rivals, platform consolidation, and the lack of public pricing or win-rate evidence.
