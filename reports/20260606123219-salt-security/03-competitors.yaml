- id: TP005
  title: Moat durability / competitive risk register
  columns:
  - Moat claim / risk
  - Threat
  - Severity
  - Evidence
  - Mitigation / diligence ask
  rows:
  - - Integrated discovery plus posture plus behavioral analytics
    - WAAP bundles can replicate enough of the checklist inside broader platforms
    - High
    - Salt platform plus Prisma, Cloudflare, Fastly, Akamai, and Gartner-shift evidence
    - Prove that Salt’s depth drives measurable detection, remediation, and renewal outcomes.
  - - Partner-led distribution
    - Partner consoles can become the primary control plane and negotiating center
    - Medium
    - CrowdStrike and Wiz integrations
    - Measure whether partner-led distribution expands net-new pipeline faster than it erodes platform ownership.
  - - Inline-blocking objection
    - Wallarm and Cequence can position Salt as detect-first rather than stop-first
    - High
    - Wallarm and Cequence official claims versus Salt positioning
    - Collect customer references showing how Salt plus enforcement layers performs in production.
  - - Hybrid and regulated-buyer fit
    - Buyers may prefer vendors with explicit hybrid deployment or traffic-path control
    - High
    - Wallarm hybrid docs, Akamai environment claims, Prisma and Imperva materials, Cloudflare criticism
    - Map win-loss outcomes by deployment posture and compliance sensitivity.
  - - Public pricing opacity
    - The retained public record cannot prove ROI or lower TCO against bundled alternatives
    - Medium
    - Cloudflare packaging, Kong tiering, and pricing-gap claims
    - Review live proposals, SOWs, and renewal data across at least three buyer segments.
  - - Category consolidation
    - Akamai/Noname and Harness/Traceable show specialists being absorbed into larger platforms
    - High
    - Akamai and Traceable transaction sources
    - Test whether buyers increasingly prefer platform vendors or still pay for standalone depth.
  notes: Salt’s moat depends not only on product quality but on whether specialist depth remains worth a separate budget line as platform vendors converge on API security.
