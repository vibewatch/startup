- id: capability-models
  title: 'Capability models: runtime depth, posture, and shift-left trade-offs'
  body: |-
    Salt’s public differentiation is not simply “API security,” but the specific combination of discovery, posture governance, and behavioral threat analysis that can plug into an existing security stack. That makes it distinct from the two sharpest specialist counterpositions. Wallarm and Cequence attack the category from the inline-blocking side, arguing that discovery and detection are insufficient unless the platform can natively block abuse, account takeover, and OWASP API attacks in real time. 42Crunch pushes from the contract-first side: its micro-firewall and audit workflow are strongest when teams already manage mature OpenAPI definitions and want policy enforcement tied directly to API contracts and CI/CD gates.

    The broader platform vendors compete differently. Prisma Cloud combines discovery, risk profiling, bot and DoS controls, and both inline and out-of-band deployment inside a CNAPP and WAAS frame. Cloudflare and Fastly bring API security into edge-native traffic, abuse, and DDoS workflows. Kong is a weaker direct replacement for Salt because it depends on plugins, gateway controls, and developer-owned policies rather than dedicated API-discovery and behavior analytics; however, it remains a meaningful substitute for buyers who want “good enough” gateway security before buying a specialist platform. The practical read-through is that Salt wins when buyers value deep API-specific context without re-platforming their WAF, CDN, or gateway estate, but loses narrative advantage whenever a rival can collapse that functionality into inline enforcement or a preexisting platform budget.
