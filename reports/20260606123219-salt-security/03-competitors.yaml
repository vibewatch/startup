  - type: private-evidence-only
    severity: material
    topic: pricing-and-tco
    missingEvidence: Signed proposals and implementation statements of work that show software, services, and traffic-path economics for Salt, Akamai, Wallarm, Prisma Cloud, and Cloudflare.
    whyItMatters: Public packaging signals exist, but they do not establish delivered total cost of ownership or whether Salt wins on economics versus bundled alternatives.
    diligencePath: Collect three to five recent enterprise proposals by buyer segment and compare software, services, enforcement, and renewal terms line by line.
    relatedQuestionRefs:
