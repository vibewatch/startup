  - - Akamai + Noname
    - Direct rival inside WAAP and edge platform
    - ~$450M acquisition; 200+ Noname employees; broader Akamai app and API platform
    - Large global enterprises wanting unified app, edge, and API protection
    - Shadow-API discovery and deployment choice inside a scaled platform vendor
    - Gartner criticism cited high price, false positives, and UI complexity.
  - - Traceable by Harness
    - Direct rival inside DevSecOps platform
    - Harness merger plus 2024 strategic investment and strong growth claims
    - Enterprises wanting design-to-runtime AppSec and API coverage
    - Lifecycle coverage spanning posture, testing, threat hunting, and protection
    - Public evidence is thin on pricing and on any clear inline-blocking advantage.
  - - Cequence
    - Direct inline-capable specialist
    - Unified API Protection positioning with bot and fraud heritage
    - Security teams wanting discovery, defense, and testing in one API-native platform
    - Native real-time remediation and strong discover-detect-defend framing
    - Public scale and packaging visibility are limited in the retained set.
  - - Wallarm
    - Direct inline specialist
    - Hybrid or managed deployment and broad protocol support
    - Teams prioritizing inline protection across heterogeneous API protocols
    - No-spec-required inline blocking plus AI, shadow, and zombie API discovery
    - Competitor-authored comparison pages may overstate rivals’ weaknesses.
  - - 42Crunch
    - Shift-left and runtime specialist
    - Contract-driven platform with audit and micro-firewall docs
    - DevSecOps and API teams with mature OpenAPI discipline
    - Strong CI/CD, audit, and contract-based enforcement story
    - Current runtime docs do not support GraphQL protection.
  - - Prisma Cloud
    - WAAP and CNAPP incumbent
    - Integrated CNAPP and WAAS with API security modules
    - Cloud-native and hybrid enterprises consolidating security vendors
    - Discovery, risk profiling, bots, DoS, and inline or out-of-band enforcement
    - Less API-native positioning than dedicated specialists.
  - - Cloudflare
    - WAAP and edge incumbent
    - Global network plus enterprise support and packaging add-ons
    - Cloud-first enterprises already using Cloudflare traffic and security stack
    - Endpoint discovery and positive-security enforcement at the edge
    - Historical Gartner criticism centered on lack of hybrid deployment.
