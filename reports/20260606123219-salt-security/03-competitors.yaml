- id: distribution-and-partners
  title: Distribution power, platform leverage, and partner overlap
  body: |-
    Competitive power in this market increasingly comes from distribution and adjacency, not only from product checklists. Akamai’s Noname deal gives it a direct API-security asset inside a much broader application and edge-security business. Cloudflare and Fastly benefit from already sitting in the traffic path. Prisma Cloud benefits from existing CNAPP, cloud, and compliance buying motions. Those vendors do not need to win on API security alone; they can package it with broader platform renewal, cloud posture, WAAP, bot management, or enterprise-support commitments.

    Salt’s answer is partnership-led expansion. The CrowdStrike and Wiz integrations strengthen Salt’s route to market by putting API risk context inside XDR and CNAPP workflows that many enterprises already operate. The CrowdStrike integration is particularly important because it lowers discovery friction through Falcon agents and offers automated response hooks, while the Wiz integration connects API posture and threat data to cloud attack-path analysis. Yet those same integrations reveal a strategic tension: if API security becomes a feature inside the dominant XDR and cloud-security consoles, the platform owner gains distribution leverage and can eventually compress the specialist’s bargaining power. Public pricing evidence compounds this issue. Cloudflare and Kong expose more packaging structure than the specialist set, but the retained evidence still does not provide true apples-to-apples delivered cost, making live proposals and win-loss data more important than website pricing for underwriting.
