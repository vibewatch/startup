- id: TP004
  title: Distribution, partner overlap, and substitute map
  columns:
  - Pressure source
  - How it competes with Salt
  - Evidence from retained sources
  - Implication for Salt
  - Diligence ask
  rows:
  - - CrowdStrike ecosystem
    - Makes Salt easier to buy and operate inside Falcon while keeping Falcon as the workflow owner
    - Marketplace listing and integration page
    - Improves Salt distribution, but Falcon owns customer context and response workflow
    - Ask for attach rates, expansion rates, and whether CrowdStrike drives or merely hosts pipeline.
  - - Wiz ecosystem
    - Pulls Salt posture and threat data into CNAPP attack-path analysis
    - Salt and Wiz integration release
    - Expands relevance for cloud buyers, but normalizes API security as a CNAPP feature
    - Ask what proportion of Salt cloud pipeline is partner-sourced versus direct.
  - - WAAP and CNAPP suites
    - Bundle API security with WAF, DDoS, bots, and cloud posture
    - Akamai, Prisma, Cloudflare, Fastly, Imperva, Gartner-shift sources
    - Salt can lose to platform consolidation even if feature depth remains better
    - Request competitive-loss data where buyers chose a broader suite over a specialist.
  - - Inline specialists
    - Turn the conversation into “detect versus block” rather than “who sees more”
    - Wallarm and Cequence official materials
    - This is the sharpest product-level objection to Salt’s positioning
    - Ask how often Salt wins by integrating with enforcement layers instead of owning them.
  - - Shift-left contract platforms
    - Push API security earlier into design, contract audit, and CI/CD gates
    - 42Crunch product and docs
    - Developer-owned buying motions can bypass a runtime-first evaluation
    - Request examples where Salt is paired with versus displaced by shift-left tooling.
  - - Gateways and bot tools
    - Solve narrower use cases such as auth, validation, rate limiting, scraping, or account takeover
    - Kong and DataDome official pages
    - The substitute set is broader than named direct API-security rivals
    - Break loss reasons down by control objective, not only by vendor name.
  notes: Competitive pressure comes from partner and platform leverage as much as from product capability. Substitute breadth includes narrower controls that can shrink the need for a dedicated API-security purchase.
