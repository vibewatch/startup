      Values are estimated from qualitative G2 review text (12 total reviews archived May 2026). 2021-2022 reviews consistently mention "promising but maturing" and "missing some integrations" — mapped to lower feature-completeness scores. 2023 reviews shift to "creme de la creme" and "instrumental" language — mapped to higher scores. No 2024-2026 G2 reviews were posted (approximately 2-month gap before run date), so that column is omitted. This cohort is illustrative of sentiment trajectory only; it is NOT a statistically significant NRR proxy.
    claimRefs:
      - CU025
      - CU026
      - CU027

callouts:
  - calloutType: strength
    title: Two independently evidenced enterprise deployments anchor customer proof
    body: >-
      DeinDeal (2021, named CTO quote, PR Newswire + TFiR coverage) and Siemens (2026, named CISO quote at Agentic Platform launch) are the only fully independent production references but they span a 5-year range and two different platform generations—API security and agentic security. The Siemens CISO's specific statement about Salt enabling safe AI scaling at Siemens Software is the strongest evidence that the 2026 Agentic Platform is in real enterprise use.
    claimRefs:
      - CU016
      - CU017
      - CU019

  - calloutType: risk
    title: Retention and concentration data are completely opaque
    body: >-
      No NRR, GRR, contract lengths, customer count, top-customer revenue concentration, or cohort data is publicly available. Salt operates in an enterprise-only go-to-market, where individual deal sizes are likely large and a small number of departures could materially affect revenue. The 12 G2 reviews and 20 FeaturedCustomers references for a company that raised $271M+ suggests limited reference-program participation, which itself may be a retention risk signal.
    claimRefs:
      - CU028
      - CU029
      - CU035
      - CU036

  - calloutType: risk
    title: Competitive mindshare erosion is the primary adverse signal
    body: >-
      A single analyst source (PeerSpot) reports Salt's API security mindshare among buyers dropped from 13% in 2025 to 7% in 2026. If accurate, this represents a significant competitive displacement, possibly toward Imperva, Akamai, 42Crunch, or Noname Security. This is a single-source, non-attributed metric and cannot be independently validated, but combined with the low G2 review velocity, it warrants close monitoring. Salt's pivot to the Agentic Security Platform may be intended to differentiate against these competitors in a new product category.
    claimRefs:
      - CU036
      - CU037

  - calloutType: insight
    title: Agentic platform creates new land-and-expand surface within existing accounts
    body: >-
      Every existing Salt customer deploying AI agents or MCP servers has a new and growing attack surface that only AG-SPM, AG-DR, and GitHub Connect address. This creates a structurally enabled upsell: as customers adopt AI automation (66% report 50%+ API growth in 2026), Salt's platform consumption should grow without requiring new customer acquisition. The key uncertainty is whether expansion pricing is per-API, per-traffic, or per-module, and whether NRR reflects this dynamic—neither is disclosed.
    claimRefs:
      - CU012
      - CU033
      - CU034
      - CU037

