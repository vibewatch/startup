  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: retention-metrics
      missingEvidence: Net Revenue Retention (NRR), Gross Revenue Retention (GRR), and churn rate for any trailing period
      whyItMatters: Without NRR/GRR data, it is impossible to assess whether Salt is retaining and expanding its customer base; enterprise security SaaS typically requires NRR > 110% for high-growth classification
      diligencePath: Request NRR and GRR from Salt for trailing 4 quarters; if not provided, negotiate this as a closing condition or reduction in valuation
      relatedQuestionRefs: [QU006, QU018]

    - type: private-evidence-only
      severity: blocking
      topic: customer-count
      missingEvidence: Total active customer count, annual customer additions, and customer-by-customer ARR breakdown
      whyItMatters: Without customer count, per-customer ACV cannot be estimated and market penetration cannot be quantified; the enterprise-only model means each customer lost has outsized impact
      diligencePath: Request customer count, ACV distribution, and top-10 customer revenue share from Salt; benchmark against comparable API security peers
      relatedQuestionRefs: [QU002]

    - type: private-evidence-only
      severity: material
      topic: pricing-model
      missingEvidence: Pricing metric (per API, per traffic volume, per seat), list pricing, and typical contract value
      whyItMatters: The pricing model determines whether expansion economics are automatic (per-API/per-traffic = growing customer surfaces drive growing ARR) or manual (per-seat = requires active upsell)
      diligencePath: Request pricing model and standard contract terms from Salt; ask for anonymized ACV distribution across customer segments
      relatedQuestionRefs: [QU027]

    - type: private-evidence-only
      severity: material
      topic: contract-length
      missingEvidence: Standard contract length (annual vs multi-year), renewal terms, and early-termination provisions
      whyItMatters: Multi-year contracts reduce near-term churn risk; annual contracts with month-to-month clauses create higher revenue risk
      diligencePath: Request contract template and renewal history from Salt
      relatedQuestionRefs: [QU018]

    - type: access-blocked
      severity: material
      topic: gartner-peer-insights
      missingEvidence: Gartner Peer Insights scores and review themes (URL blocked with 403 during fetch)
      whyItMatters: Gartner Peer Insights is the primary enterprise-buyer reference for security platform evaluation; unavailability limits independent verification of customer satisfaction beyond G2 (12 reviews)
      diligencePath: Access Gartner Peer Insights via subscription; request latest Gartner review summary from Salt; ask Gartner for Magic Quadrant or Market Guide placement for Salt
      relatedQuestionRefs: [QU007]

    - type: stale
      severity: material
      topic: deindeal-case-study
      missingEvidence: Updated DeinDeal case study or renewal confirmation; the published case study is from April 2021 (5+ years old)
      whyItMatters: DeinDeal is the only fully independently evidenced production customer; a 5-year-old case may not reflect current platform capabilities or customer satisfaction
      diligencePath: Request an updated DeinDeal reference call or a new case study; confirm DeinDeal is still an active customer and ask for current platform modules in use
      relatedQuestionRefs: [QU003]
      relatedTableRefs: [TU003]

    - type: enumeration-incomplete
      severity: material
      topic: named-customer-proof
      missingEvidence: >-
        Independently confirmed production deployments for Alaska Airlines, Hyundai, SoFi, Stryker, and Kingston Technology with named executive quotes or outcome evidence; currently all are logo/mention-level only
      whyItMatters: Five of the seven publicly named customers lack any independent confirmation of production deployment status, outcomes, or retention; the named-customer proof table is necessarily partial/sample scope
      diligencePath: Request reference calls and outcome statements from each named customer; obtain executive-level case studies or NPS/CSAT data; supplement with G2/Gartner Peer Insights for anonymous production confirmation
      relatedTableRefs: [TU003]
      relatedQuestionRefs: [QU005, QU025]

    - type: missing-source
      severity: material
      topic: competitive-mindshare
      missingEvidence: Independent corroboration of the reported 13%-to-7% mindshare decline beyond the single PeerSpot source
      whyItMatters: If the mindshare decline is accurate, it could precede customer and revenue churn; if it is a single-source artifact, it is less concerning; the difference matters for thesis formation
      diligencePath: Commission or obtain independent API security market share analysis from Forrester, IDC, or Gartner; triangulate with Salt's win/loss data
      relatedQuestionRefs: [QU014]

