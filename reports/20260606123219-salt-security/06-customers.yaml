figures:
  - id: FU001
    title: Customer segments, adoption surfaces, and expansion loops
    type: journey-map
    layout: wide
    summary: Maps Salt Security's enterprise customer segments through the adoption lifecycle from initial discovery to full-platform expansion.
    data:
      nodes:
        - id: seg-fintech
          label: FinTech / Financial Services
          description: "SoFi, Standard Bank Group. High-value APIs processing financial transactions. Compliance (PCI DSS, GDPR) drives posture governance adoption."
        - id: seg-tech
          label: Technology SaaS / Hardware
          description: "Kingston Technology, enterprise SaaS buyers. High API density; DevSecOps-led adoption. Policy Hub and posture governance are primary entry points."
        - id: seg-retail
          label: Retail / E-commerce
          description: "DeinDeal. API-driven customer journeys with PII and transaction data. API discovery and sensitive-data tracking are primary value drivers."
        - id: seg-mfg
          label: Manufacturing / Industrial Software
          description: "Siemens, Hyundai. Enterprise digital transformation with growing agentic AI adoption. AG-SPM and AG-DR are primary entry points for 2026 cohort."
        - id: seg-healthcare
          label: Healthcare / Medical Devices
          description: "Stryker. HIPAA-aligned API posture governance and PHI tracking in API traffic. Compliance-first buying motion."
        - id: stage-eval
          label: "Evaluation: Free API scan or POC"
          description: Salt offers a free external API surface scan via salt.security as a no-commitment entry point. Under-10-minute cloud-connect setup enables rapid POC.
        - id: stage-deploy
          label: "Initial Deployment: Salt Connect + Discovery"
          description: Customer connects cloud accounts and API gateways. Within minutes, first API inventory and risk scores are available. Shadow and zombie API discovery is the early AHA moment.
        - id: stage-posture
          label: "Posture Governance: Policy Hub"
          description: Customer adopts Policy Hub rules across PCI, HIPAA, GDPR, NIST, CMMC, FedRAMP. Compliance export and audit support drive renewal justification.
        - id: stage-protect
          label: "Runtime Protection: Behavioral ML"
          description: Platform baselines traffic over weeks and begins detecting anomalies. SOC team integrates alerts into Splunk/CrowdStrike workflow. Entity-level blocking deployed.
        - id: stage-expand
          label: "Expansion: Agentic Security + GitHub Connect"
          description: New 2026 expansion surface — AG-SPM/AG-DR for AI agent environments, GitHub Connect for shift-left code-level discovery. Ask Pepper AI for SOC analyst productivity.
    approximationNotes: >-
      Journey stages are inferred from product launch sequence, official product pages, and DeinDeal/Siemens case evidence. No internal funnel conversion data is publicly available. Stage ordering reflects typical enterprise security SaaS adoption pattern, not observed customer lifecycle data.
    claimRefs:
      - CU001
      - CU004
      - CU016
      - CU017
      - CU019
      - CU031
      - CU037

  - id: FU002
    title: Adoption / deployment journey flow
