company:
  name: Salt Security
chapter:
  number: 6
  title: Customers
  summary: >-
    Salt Security claims a global enterprise customer base spanning financial services, retail e-commerce, technology, manufacturing, and healthcare verticals, with named deployments at Alaska Airlines, Hyundai, SoFi, Stryker, Standard Bank Group, Kingston Technology, DeinDeal, and Siemens. The DeinDeal (2021) and Siemens (2026) cases provide the strongest independent proof of production deployment and business outcome. Independent review signal is limited—only 12 G2 reviews—and critical metrics including NRR, GRR, contract lengths, customer count, and revenue concentration are entirely undisclosed. A reported mindshare decline from 13% to 7% in 2026 and the absence of any adverse third-party churn data suggest competitive pressure but insufficient public evidence to quantify retention risk.

sections:
  - id: customer-base-segmentation
    title: Customer base segmentation and vertical focus
    body: >-
      Salt Security's official marketing and the CrowdStrike Executive Brief identify FinTech, Financial Services, Technology SaaS, and Pharmaceutical as the company's primary target verticals. The AppSec Santa 2026 review and company customer page corroborate this with a broader named-customer list spanning retail e-commerce (DeinDeal, Switzerland), automotive/manufacturing (Hyundai), medical devices (Stryker), financial technology (SoFi), hardware/technology (Kingston Technology), banking (Standard Bank Group, South Africa), manufacturing/software (Siemens), and aviation (Alaska Airlines). These names are drawn from company-authored materials and the AppSec Santa independent review; they have not been individually confirmed via independent third-party case studies except for DeinDeal (2021 PR Newswire announcement) and Siemens (2026 CISO quote at Agentic Platform launch). The buyer profile is consistently enterprise: the G2 review base skews to Enterprise (>1,000 employees) and Mid-Market buyers. Salt's own 2025 State of API Security Report surveyed 206 professionals, and the 1H 2026 report surveyed 327 security leaders—these respondent pools are consistent with enterprise security spending. No customer count (total active accounts) is publicly disclosed. The CrowdStrike brief states Salt "protects some of the largest enterprises in the world." No breakdown by geography, industry vertical share, or account size band is publicly available.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU005
      - CU006
      - CU007
      - CU008
    tableRefs:
      - TU001
    figureRefs:
      - FU001

  - id: adoption-trajectory
    title: Adoption trajectory and deployment indicators
    body: >-
      Salt does not publicly disclose customer count, ARR, or pipeline metrics. Adoption-trajectory signals available from public sources are indirect. The AllCloud/Datadog case study states that "over the past year, Salt Security has grown its customer base significantly," with the infrastructure scaled to process several million messages per minute across hundreds of backend instances. The 2025 "12 Months of Innovation" press release states "the market response has been tremendous" for 2025 releases, and the company completed a 3-year AWS Enterprise Discount Program commitment—a forward signal of expected traffic growth. Salt's own market research (1H 2026, 327 respondents) found 66% of organizations report API growth of over 50% in the past year, and only 37% of organizations using agentic AI have dedicated API security—both metrics frame a large unmet demand that Salt's new Agentic Platform addresses. The Microsoft Azure Marketplace and CrowdStrike marketplace listings indicate multi-cloud distribution partnership coverage. G2 review count (12 total, last review May 2026) is low for a company claiming global enterprise reach, and the platform has not received a new G2 review in approximately two months as of run date. The FeaturedCustomers profile for Salt shows 20 total customer references, with reference rating 4.8/5. No publicly available cohort data, renewal rates, or account expansion metrics are disclosed.
    claimRefs:
      - CU009
      - CU010
      - CU011
      - CU012
      - CU013
      - CU014
      - CU015
    tableRefs:
      - TU002
    figureRefs:
      - FU002

  - id: named-customer-proof
    title: Named customer proof and deployment quality
    body: >-
      The strongest independent proof of production deployment is DeinDeal, a Swiss e-commerce retailer. The deployment was publicly announced via PR Newswire in April 2021 with a named executive quote (Alexandre Branquart, CTO) confirming production use of automated API discovery, PII protection, behavioral anomaly detection, and blocking in the company's mobile and web applications. The case study cites processing thousands of transactions daily, discovery of all APIs across build/deploy/runtime, and context for blocking attackers. DeinDeal processed high volumes of PII; the deployment context (rapid pandemic growth, food delivery expansion) gives this reference strong qualitative depth. The Siemens case provides 2026 production validation: CISO Shawn Griffin (listed as CISO, CFIUS Security Officer & Cybersecurity Officer) gave a named quote at the Agentic Platform launch (March 2026), stating that Salt gave Siemens "improved visibility and protection that we need to confidently scale AI across the Siemens Software business." This is agentic-platform early-adoption evidence from a global manufacturing enterprise. The SoFi deployment is mentioned in Salt's YouTube and marketing materials as a case involving API security for a fintech platform; no independent case study is available. Alaska Airlines, Hyundai, Stryker, Kingston Technology, and Standard Bank are listed as customers in the AppSec Santa 2026 review (an independent technical analysis) and on the Salt customers page, but without outcome evidence or public confirmation beyond logo/mention level. The TFiR article independently covered the DeinDeal deployment announcement, providing third-party editorial confirmation of that reference. G2 reviews (12 total) include multiple Enterprise and Senior InfoSec titles reporting production use, anomaly detection in live environments, and API visibility benefits—qualitatively consistent with claimed deployment depth.
    claimRefs:
      - CU016
      - CU017
      - CU018
      - CU019
      - CU020
      - CU021
      - CU022
      - CU023
      - CU024
    tableRefs:
      - TU003

  - id: retention-durability
    title: Retention, durability, and satisfaction signals
    body: >-
      No NRR, GRR, gross retention rate, or cohort-level churn data is publicly disclosed by Salt Security. G2 shows an aggregate score of 4.7/5 across 12 reviews, with consistent themes of strong product capability and highly responsive support team. One G2 enterprise reviewer (2023) rated the platform 5/5 and stated it is "the creme de la creme of API security tools." A Senior Manager Security reviewer (2023) noted the product was "instrumental in helping us resolve attacks and better understanding vulnerabilities" with "great responsiveness from Salt team," and cited a desire for better root-cause findings as the only criticism. Earlier G2 reviews (2021–2022) note a newer, maturing product with some missing integrations (native SIEM action logging gaps), which is consistent with the product's 2021–2022 stage rather than current maturity. The PeerSpot profile notes that Salt "improves security posture" and cites real-time monitoring and automated threat detection as valued features. The DeinDeal case study (2021) does not disclose renewal terms, but the ongoing presence of DeinDeal on the Salt customers page (as of the 2026 customers page fetch) suggests continued relationship. The Gartner Peer Insights URL was fetched but returned a 403 paywall block; the content was not accessible. No enterprise churned customer, public contract cancellation, or critical adverse review was found in any retained source. The adverse signal is indirect: a reported mindshare drop from 13% to 7% (2026) may indicate competitive customer erosion, but this is a single-source, non-attributed claim from PeerSpot and cannot be independently validated.
    claimRefs:
      - CU025
      - CU026
      - CU027
      - CU028
      - CU029
      - CU030
    tableRefs:
      - TU004
    figureRefs:
      - FU004

  - id: expansion-concentration-channel
    title: Expansion, concentration, and channel dependence
    body: >-
      Salt's go-to-market leverages the CrowdStrike Falcon platform (integration deepened April 2025) and the Microsoft Azure Marketplace and CrowdStrike Marketplace as distribution channels. The 3-year AWS EDP commitment adds AWS as a structural partnership. Salt also partners with AllCloud (AWS managed services), suggesting a VAR/SI channel for complex deployments. These partnerships create both distribution reach and dependency: Salt's ability to reach CrowdStrike's installed base (enterprise security teams) is a growth lever, but also means a portion of pipeline health is linked to CrowdStrike's sales motion. No revenue concentration data (top 10 customer share of ARR) is publicly disclosed. Salt targets the world's largest enterprises, which means individual deals are likely large and account concentration could be material; this is a diligence ask. The land-and-expand model is structurally enabled: Salt's platform discovers more APIs over time and can expand coverage as customers add new cloud environments, gateways, and AI agents—each new capability (AG-SPM, AG-DR, GitHub Connect) is a new upsell surface. However, no NRR or expansion ARR data is disclosed to validate whether this model is working in practice. The 1H 2026 survey found 47% of organizations have delayed production AI releases due to API security concerns, creating a procurement tailwind but also a potential objection to fast adoption of the newer Agentic Platform modules.
    claimRefs:
      - CU031
      - CU032
      - CU033
      - CU034
      - CU035
      - CU036
      - CU037
