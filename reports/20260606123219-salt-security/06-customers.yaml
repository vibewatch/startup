  - id: TU005
    title: Expansion and concentration risk table
    columns:
      - Dimension
      - Current Signal
      - Concentration / Dependency Risk
      - Impact
      - Diligence Path
    rows:
      - - Revenue concentration (top customers)
        - No data disclosed
        - Unknown — undisclosed
        - High if any customer > 10% ARR given enterprise-only go-to-market
        - Request top-10 customer revenue share from Salt directly; assess customer-loss scenario
      - - CrowdStrike channel dependency
        - Deep integration (since 2025); API intelligence embedded in Falcon
        - Medium — meaningful distribution channel; not sole channel
        - CrowdStrike relationship changes (pricing, go-to-market shift) could affect pipeline
        - Assess exclusivity terms; confirm whether CrowdStrike is a reseller or integration partner only
      - - AWS platform dependency
        - 3-year EDP commitment; AllCloud manages AWS infrastructure
        - Medium — all SaaS hosted on AWS; no Azure/GCP primary hosting disclosed
        - AWS outage or pricing change affects service delivery; EDP lock-in reduces short-term flexibility
        - Confirm BCPs and multi-region failover; review EDP terms and exit provisions
      - - Land-and-expand (API growth)
        - Structurally enabled by growing API surfaces and new modules (AG-SPM, AG-DR, GitHub Connect)
        - Positive — more APIs per customer = more platform consumption
        - Expanding attack surface should drive existing customer ARR growth if NRR > 100%
        - Request NRR data; confirm whether platform is priced per API, per traffic volume, or per seat
      - - GitHub dependency (GitHub Connect)
        - GitHub Connect requires GitHub API; no GitLab/Bitbucket confirmed
        - Low-medium — affects only shift-left customers on non-GitHub platforms
        - Customers on non-GitHub repos cannot use GitHub Connect; limits full platform adoption
        - Confirm roadmap for GitLab/Bitbucket support
      - - Market mindshare trend
        - Reported drop from 13% (2025) to 7% (2026) by one analyst source
        - Medium — competitive pressure from Imperva, Akamai, 42Crunch, others
        - Mindshare decline may precede pipeline or logo churn; worth monitoring closely
        - Corroborate mindshare data with independent analyst sources; triangulate with win/loss data from Salt
    notes: >-
      "Current Signal" reflects the best available public evidence as of 2026-06-06. Revenue concentration data is entirely absent from public sources. CrowdStrike and AWS dependency signals are drawn from official announcements and the AllCloud case study. Mindshare drop figure is from a single analyst source (PeerSpot) and should be treated as indicative rather than conclusive.
