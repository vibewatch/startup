  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 类型
      - 指标
      - 倍数 / 估值
      - 与 Salt Security 的相关性
      - 主要局限
    rows:
      - - Noname Security / Akamai（2024）
        - 私有公司并购
        - 累计融资约 $220M；此前估值标记约 $1B+
        - 收购价约 $450M（较私有估值标记折价约 50%）
        - 最接近的直接可比：独立 API 安全，规模相近，以色列创立
        - Akamai 平台溢价未必适用于纯财务买家
      - - Imperva（Thales 收购，2023）
        - 私有公司并购
        - 收购价约 $3.6B
        - 约 5-6x 收入（估计）；捆绑 WAF / API / DDoS
        - 说明 CDN / 安全平台愿意为 API 安全资产付费
        - Imperva 规模大得多且更多元；不是纯 API 安全可比
      - - Cloudflare（NET，2026 年中估计）
        - 上市 SaaS 平台
        - 远期收入约 $1.5B（估计）
        - 远期收入约 12-15x（估计）
        - 领先 API 安全 + CDN 板块；享有平台宽度溢价
        - 规模大得多；平台宽度无法与 Salt 的单点方案直接比较
      - - Qualys（QLYS，2026 年中估计）
        - 上市 SaaS 安全
        - 收入约 $600M（估计）
        - 远期收入约 6-7x（估计）
        - 成熟 SaaS 安全可比对象，可用于私有到上市过渡的基准
        - 重点在云安全；GTM 与 API 安全不同
      - - Rapid7（RPD，2026 年中估计）
        - 上市应用安全
        - 收入约 $800M（估计）
        - 远期收入约 3-4x（估计）
        - 在上市公司中，规模和应用安全角度最接近
        - 以 SIEM / SOAR 为主；API 安全是次要功能；倍数受压
      - - CrowdStrike（CRWD，2026 年中估计）
        - 上市终端 / 安全平台
        - 收入约 $3.9B（估计）
        - 远期收入约 15-18x（估计）
        - 代表广泛采用并形成平台地位后可拿到的平台溢价
        - 规模大得多，终端优先；Salt 需先做出平台地位才配得上该倍数
    notes: >-
      2026 年中上市公司倍数为分析师估计，依据一致预期增长预测和当时 SaaS 安全倍数；Salt Security 未披露 ARR 或收入，因此所有相对 Salt 的隐含倍数均为估计。Noname / Imperva
      收购价为报道数字；确切条款和业绩对赌条款未公开。
    enumerationScope:
      coverage: partial
      basis: >
        Covers the primary publicly documented M&A transactions and public company benchmarks relevant to valuing a
        US-incorporated standalone API security SaaS vendor with Israeli R&D in mid-2026. Excludes private secondary
        transactions, venture debt benchmarks, and company-specific synergy premiums that strategic acquirers might pay.
    claimRefs:
      - CV021
      - CV022
      - CV023
      - CV027
      - CV028
      - CV029
  - id: TV005
    title: 投资逻辑破裂与止损触发项表
    columns:
      - 触发项
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - ARR 下滑或同比增长低于 10%
        - 任一经确认的 ARR 增速在 12+ 个月内 <10%
        - 显示竞争替代发生；基准情景转向悲观
        - 启动退出流程；以任何可获得倍数寻求并购
      - - 主要客户用超大规模云厂商替换 Salt
        - 任一具名公开客户宣布迁移到 AWS / Cloudflare 原生 API 安全
        - 说明客户基盘估值受损；倍数压缩加速
        - 立即评估续约队列；加快并购接触
      - - 新一轮投前估值低于 $600M
        - 任一融资或老股交易宣布估值 <$600M
        - 确认 Series D 估值标记受损；触发优先股稀释模型
        - 建模新的优先股堆叠；重新评估普通股股东回收额
      - - Agentic Security 在 GA 后 12 个月内未拿到付费客户
        - GA 日期后 12 个月内未公布 Salt Code 付费客户
        - 转向执行风险兑现；没有新收入流抵消 API 商品化
        - 重新评估竞争护城河；评估加速战略出售
      - - 以色列研发中断 >3 个月
        - 以色列可用员工持续 3+ 个月低于 50%
        - 产品开发停摆；路线图延后；客户信心受损
        - 启动 BCP；要求披露美国 / 全球工程备份能力
    notes: 止损标准是基于典型 Series D 网络安全投资者预期的监测启发式指标。实际投资者条款和触发条款未公开。
    claimRefs:
      - CV031
      - CV032
      - CV033
      - CV034
      - CV035
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - ARR 与增长率
        - 2024 年和 2025 年年经常性收入、同比增长率、NRR
        - 没有 ARR，就无法做基于倍数的估值；也无法确认基准还是悲观情景
        - 要求提供审计财务报表或管理账；与前销售员工交叉验证
      - - 业务连续性
        - 覆盖冲突升级情景的以色列研发团队书面 BCP
        - 以色列团队集中是重大风险；没有 BCP 无法评估严重程度
        - 向公司索取；审查工程团队地域分布和备份计划
      - - GDPR DPA
        - 与 3-5 家欧盟客户已签署的 GDPR 第 28 条数据处理协议副本
        - 没有 DPA 证据，无法确认监管合规；存在欧盟执法风险
        - 向法律顾问索取；审查 DPA 模板和数据留存条款
      - - 股权结构表与瀑布
        - 当前股权结构表、优先权条款，以及 $300M、$450M、$600M 退出下的清算瀑布模型
        - 在累计优先权约 $271M 以下，普通股回收额为零；这是回报建模的关键
        - 向公司索取股权结构表；与法律 / 财务顾问建模优先股堆叠
      - - Agentic Security 进展
        - 截至 2026 年中，Salt Code / Agentic Security 产品已签署的试点协议或 LOI
        - 转向逻辑需要 PMF 证据；仅早期访问不足以支撑投资信心
        - 索取设计伙伴名单；与早期访问组织做客户访谈
    notes: 尽调问题按重大性排序。第 1 项（ARR）和第 2 项（BCP）是任何投资决定前的最低必要条件。第 3-5 项是形成充分信心所需。
    claimRefs:
      - CV036
      - CV037
      - CV038
      - CV039
      - CV040
figures:
