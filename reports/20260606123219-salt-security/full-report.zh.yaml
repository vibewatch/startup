  - id: TE003
    title: 技术 / 运行架构
    columns:
      - 层 / 组件
      - 作用
      - 依赖 / 技术
      - 风险
    rows:
      - - Salt Connect（流量摄取）
        - 通过网关和云源镜像接收 API 流量副本
        - AWS、Azure、GCP、Kong、Apigee、MuleSoft、NGINX、Istio、Akamai、Cloudflare、F5 等集成
        - 流量副本取决于网关配合；若团队使用未列出的网关，可能绕过采集
      - - API 数据湖
        - 存储并索引 API 元数据，用于 ML 训练和历史威胁关联
        - AWS 托管、Kafka 消息队列、Kubernetes 编排
        - 核心云依赖 AWS；EDP 承诺提高切换摩擦
      - - 行为 ML 引擎（已获专利）
        - 基于数百个属性建立合法 API 行为基线；检测攻击者侦察
        - 自研 ML 模型；公司用客户元数据训练模型
        - 流量模式快速变化时有模型漂移风险；新型攻击向量上的准确率未经验证
      - - Policy Hub
        - 按约 100 条预置和自定义姿态规则评估 API 配置
        - 内部开发的规则引擎；框架映射由 Salt 维护
        - 规则覆盖准确性取决于 Salt 对框架的解读；没有独立规则审计
      - - 智能体安全图谱
        - 通过映射 LLM、MCP 服务器和 API 的互联关系，给风险补上下文
        - 将核心数据湖和 ML 引擎扩展到智能体驱动流量
        - 相对较新（March 2026）；生产规模和准确率基准尚未公开报告
      - - GitHub Connect
        - 通过代码仓库分析，在部署前发现 API 和 MCP
        - 对公有 / 私有 GitHub 仓库的只读 OAuth 集成；无需流量即可做风险评分
        - 依赖 GitHub API 可用性；仅限 GitHub 仓库（GitLab、Bitbucket 未确认）
      - - Ask Pepper AI
        - 面向平台数据的自然语言查询界面
        - 生成式 AI 助手（底层 LLM 提供方未披露）
        - LLM 提供方以及分析师查询的数据处理政策没有公开文档
      - - SIEM / 响应集成
        - 将告警和增强上下文发送到安全运营工具
        - Splunk、CrowdStrike Falcon、Microsoft Sentinel、Jira、Slack 等工具
        - 不同平台集成深度不一；告警投递延迟没有公开 SLA
    notes: >-
      层级描述来自 Salt 官方页面、CrowdStrike marketplace 和 AllCloud/Datadog 案例研究中的技术 PDF，以及 AppSec Santa
      技术评测。没有公开架构图确认确切组件边界；本表基于公开证据综合整理，并标明推断。
