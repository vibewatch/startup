      - number: '8.6'
        title: 附录
        blocks:
          - type: callout
            title: 继续研究 — 入场纪律要求较 2022 年估值打 30-50% 折扣
            body: >
              Salt Security 不是放弃项目——TAM、护城河和 Sequoia 背书都支持继续跟踪。但按 2022 年 $1.4B 估值给出买入建议站不住脚，原因包括：ARR 未披露、Noname
              收购可比交易（$450M）、私募市场倍数压缩， 以及 Agentic Security 转向尚未验证。可辩护的入场点是 $600-800M 企业价值，前提是 ARR 高于 $70M、 增速
              15%+，且已拿到以色列 R&D 业务连续性文件。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV009
              - CV021
          - type: callout
            title: 优先股堆叠意味着退出价低于 $400M 时普通股持有人承压
            body: >
              公司累计融资约 $271M，且清算条款逐轮加码；在完全棘轮或 1x 参与型优先股条款下， 清算优先权瀑布意味着退出价低于约 $400M 时，普通股股东（包括创始人和持期权员工）拿不到任何回款。 按 2022
              年估值入场的投资人，在基准情景下隐含亏损超过 70%。
            calloutType: risk
            claimRefs:
              - CV009
              - CV010
              - CV020
          - type: callout
            title: Noname/Akamai 定的是估值地板，不是天花板
            body: >
              $450M 的 Noname 收购是 Salt Security 估值最重要的近期数据点。它应被理解为地板指标， 而且已经包含战略溢价（Akamai 为打包价值付费）。纯财务买家或动力不足的战略买家，
              出价大概率低于 Noname 可比交易。Salt Security 重新定位到 Agentic Security，是突破 Noname 地板、拿到溢价的唯一可信路径。
            calloutType: insight
            claimRefs:
              - CV021
              - CV022
              - CV006
