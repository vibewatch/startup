      - number: '7.2'
        title: 监管、法律与隐私义务
        blocks:
          - type: paragraph
            body: >
              Salt Security 核心业务需要监控和分析实时 API 流量，不可避免地处理 API 载荷中传输的个人身份信息。 这带来持续的 GDPR、CCPA 及其他隐私法合规义务。Salt Security
              隐私政策（2024 年 3 月更新） 承认会收集和处理可能包含个人数据的客户 API 流量数据，并承诺与在欧盟运营的企业客户签署 GDPR Article 28 数据处理协议。 GDPR 违规最高可处全球年营业额
              4% 或 €20 million（取较高者）的罚款，形成实质财务风险。


              California Consumer Privacy Act 施加退出授权和删除义务，并允许对故意违规处以最高 $7,500/次的民事罚款。 SEC 2023 年网络安全披露规则（2023 年 12
              月生效，Release 33-11216）要求上市公司客户在四个工作日内报告重大网络安全事件， 并每年披露风险管理治理，从而把合规文档需求下游传导到 Salt Security 这个记录在案的安全供应商。FTC
              根据 Section 5 广泛执行数据安全标准，NIST Cybersecurity Framework 2.0（2024 年发布）已成为美国企业安全的事实标准， 企业客户和 Salt 平台都必须对齐。


              存在知识产权诉讼风险：API 安全领域已经在 WAAP 和 API 监控版图出现专利主张，Salt 用于行为分析的专有机器学习方法， 可能吸引拥有更广泛专利组合的大型既有厂商发起专利挑战。
