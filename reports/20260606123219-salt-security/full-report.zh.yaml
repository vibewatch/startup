  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >
              Salt Security 的投资论点建立在四根支柱上：（1）大型且增长中的 API 与智能体安全市场（2030 年总可服务市场 $5-10 billion）， （2）八年行为数据集和 ML
              模型，超大规模云厂商难以快速复制，（3）抢在既有安全平台前及时转向 Agentic Security， （4）Sequoia Capital 背书及包含 Carl
              Eschenbach（Alphabet）的董事会，带来治理质量和企业网络资源。 Noname/Akamai 以约 $450 million 收购，验证 CDN 和云玩家对 API 安全平台有 M&A 兴趣。


              反论点同样重要：（1）Salt Security 2022 年 $1.4 billion 估值设在风险投资市场高峰，按 Noname 可比交易现在隐含 40-60% 折价； （2）ARR
              未披露，无法验证公司财务轨迹是否支撑 2022 年标记；（3）超大规模云厂商（Cloudflare、AWS、Akamai） 以现有客户零边际成本捆绑 API 安全，压缩 Salt 可获得的 ASP 和
              TAM；（4）Agentic Security 转向仍处早期访问阶段， 没有外部采用指标，同时带来对现有 API 安全客户基础的内部蚕食风险和新类别执行风险。据报道， 客户 POC 周期耗时数月，G2 评价也指出
              SIEM 集成存在产品缺口。


              综合看，论点尚未破裂，但需要更多证据才能支持有信心的正面决策。投资论点关键取决于：（a）在竞争压力下证明 ARR 年增长高于 15%， （b）Agentic Security 转向在 12-18
              个月内获得付费客户基础，（c）以色列 R&D 团队具备业务连续性韧性。
