            body: >-
              DeinDeal（2021 年，具名 CTO 引语，PR Newswire + TFiR 报道）和 Siemens（2026 年，Agentic Platform 发布时具名 CISO 引语）
              是仅有的完全独立生产参考，但它们横跨 5 年、覆盖两代不同平台——API 安全和智能体安全。Siemens CISO 关于 Salt 帮助 Siemens Software 安全扩展 AI 的具体表述，是
              2026 年 Agentic Platform 已在真实企业使用的最强证据。
            calloutType: strength
            claimRefs:
