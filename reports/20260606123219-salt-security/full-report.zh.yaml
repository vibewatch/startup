  - id: FV003
    title: 估值 / 回报区间——乐观、基准、悲观退出结果
    type: range
    layout: standard
    summary: Salt Security 三种情景下的估计企业价值区间，单位为百万美元。
    data:
      items:
        - label: 悲观情景退出（3-4 年周期）
          low: 120
          mid: 185
          high: 250
        - label: 基准情景退出（3-5 年周期）
          low: 260
          mid: 350
          high: 440
        - label: 乐观情景退出（2-4 年周期）
          low: 520
          mid: 660
          high: 820
    approximationNotes: >-
      企业价值区间为分析师估计，基于 Noname/Akamai 收购基准（$450M）、估计 ARR 情景（$40-100M 区间）以及当前私营网络安全 SaaS 倍数（3-8x ARR）。区间纳入了 ARR
      未披露和转型执行差异带来的不确定性。单位为百万美元。
    claimRefs:
      - CV017
      - CV018
      - CV019
      - CV020
  - id: FV004
    title: 投资 KPI 评分卡——Salt Security
    type: kpi
    layout: wide
    summary: 截至 2026 年 6 月，Salt Security 关键投资维度的 IC 可用评分。
    data:
      items:
        - label: 市场机会
          value: Large ($5-10B TAM by 2030; growing AI agent adoption)
        - label: 竞争护城河
          value: Medium (8yr ML dataset; defensible vs. speed-followers; eroding vs. hyperscalers)
        - label: 产品市场匹配
          value: Medium (API security proven; Agentic Security unproven early-access only)
        - label: 财务健康度
          value: Unknown (private; ARR, burn, NRR not disclosed; no Series E in 4+ years)
        - label: 管理层质量
          value: Medium-High (IDF founders, Forbes 30U30 CEO, Sequoia-backed, Eschenbach board)
        - label: 估值吸引力
          value: Stretched (2022 mark requires 10-14x ARR; market comps support 5-7x; Noname set 450M floor)
        - label: 证据质量
          value: Low (private company; no audited financials; all revenue/growth estimates inferred)
    approximationNotes: null
    claimRefs:
      - CV001
      - CV003
      - CV005
      - CV009
      - CV016
      - CV021
      - CV022
