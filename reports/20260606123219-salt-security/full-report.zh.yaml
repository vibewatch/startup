  - id: TP003
    title: 部署 / 产品打包 / 公开定价对比
    columns:
      - 厂商组
      - 部署形态
      - 公开定价 / 打包可见度
      - 公开买方适配信号
      - 启示
    rows:
      - - Salt
        - 可配合现有技术栈和伙伴工作流
        - 已保留公开资料没有标价；仅见市场渠道和集成打包
        - 买方希望获得专门 API 上下文、又不替换平台栈时最适合
        - 经济性仍需看实时方案报价和受伙伴影响的交易语境。
      - - Akamai / Noname
        - 声称支持云、边缘、本地和第三方环境
        - 已保留公开资料不透明
        - 已从 Akamai 采购应用与 API 安全的企业最适合
        - 部分交易中，捆绑杠杆可能压过单点产品深度。
      - - Traceable
        - Harness 内的设计到运行时平台
        - 已保留公开资料不透明
        - 希望把 DevSecOps 与 API 安全合并采购的买方最适合
        - 平台邻近性比公开标价更关键。
      - - Cequence / Wallarm
        - Cequence UAP 加 Wallarm 混合或托管内联部署
        - 已保留公开资料不透明
        - 优先阻断和滥用防御的团队最适合
        - 内联执行会把采购标准从单纯分析重构为防护能力。
      - - 42Crunch
        - 容器化 API Firewall 和合约驱动的平台部署
        - 已保留公开资料不透明
        - 规格优先、OpenAPI 归属成熟的团队最适合
        - 买方可把该工具定位为开发与运行时控制，而不只是 SOC 软件。
      - - Cloudflare / Fastly / Prisma
        - 与更广应用安全服务捆绑的边缘或 CNAPP 打包
        - Cloudflare 展示附加项和 SLA 结构；已保留资料中，其它厂商大多仍需咨询报价
        - 平台整合买方最适合
        - 公开打包比实际交付 TCO 更清楚，因此套件比较仍需报价方案。
      - - Kong / 网关替代方案
        - 开源、企业版和 Konnect 部署路径
        - 层级结构比专门 API 安全厂商更清楚
        - 买方首先要网关控制、认证和限流时最适合
        - 替代品可能先吃掉预算，专门 API 安全平台尚未采购。
    notes: 本图表比较定价可见度和打包方式，不假装公开来源能揭示真实交付的软件加服务成本。
