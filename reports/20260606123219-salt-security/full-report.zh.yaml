      - number: '1.5'
        title: 里程碑、合作关系与负面信号
        blocks:
          - type: paragraph
            body: >-
              Salt Security 的里程碑可以分为四个阶段：创始期技术开发（2016–2019）、快速资本形成与品类定义（2020–2021）、独角兽扩张与国际化（2022），以及产品拓宽和 ARR
              爬坡（2023–2025）。

              重要产品里程碑包括：隐身期推出有专利的 C-3A Context-based API Analysis Architecture；2023 年推出 STEP（Salt Technical Ecosystem
              Partner）计划，正式化技术集成；在 Fal.Con 2023 宣布 CrowdStrike Falcon 集成；2024 年末推出 Falcon Next-Gen SIEM 扩展；以及 2025
              年连续十二个月发布产品，包含 GitHub Connect、MCP Finder、面向 AWS WAF 的 MCP 防护和 Ask Pepper AI 对话式助手。Salt Labs——Salt 专门的 API
              安全研究部门——增强了发表可信度和品牌权威；按公司自身说法，Salt Labs 发现的 API 漏洞多于任何其他研究团队。

              对一家安全公司来说，负面信号不多但有实质意义。Escape.tech 的一份竞品对比（2025）批评 Salt 的测试能力，称其依赖 HTTP header 分析而不是深度 payload
              检查，并且在发现位于网关或代理之外、未被监控的 API 时存在限制。Akto 的竞品分析称，平台复杂度和高价位会阻碍中端市场买家。截至本次报告日期，在 layoffs.fyi 或相关追踪器中未发现 Salt
              Security 的 WARN Act 备案或公开大规模裁员，不过绝对员工数自 2022 年末以来似乎在 200 人左右平台期。二级市场平台 Forge 将 Salt Security
              列为有市场活动、可交易的公司，同时提示显示价格可能较最近一轮新股估值折价。自 2022 年 2 月以来没有新融资——已超过四年——引出一个问题：公司现金跑道是否充足，是否正在走向退出或桥接融资。
