  - id: TP004
    title: 分销、伙伴重叠与替代品地图
    columns:
      - 压力来源
      - 它如何与 Salt 竞争
      - 留存来源证据
      - 对 Salt 的影响
      - 尽调问题
    rows:
      - - CrowdStrike 生态
        - 让 Salt 在 Falcon 内更容易购买和运维，但工作流主导权仍在 Falcon
        - Marketplace 列表和集成页面
        - 改善 Salt 分发，但 Falcon 掌握客户上下文和响应工作流
        - 要求提供附加率、扩张率，以及 CrowdStrike 是拉动销售管线还是只是承载销售管线。
      - - Wiz 生态
        - 把 Salt 的安全态势和威胁数据拉入 CNAPP 攻击路径分析
        - Salt 与 Wiz 集成发布
        - 让 Salt 更贴近云买家，但也把 API 安全常态化为 CNAPP 的一个功能
        - 询问 Salt 云端销售管线中，合作伙伴来源与直销各占多少。
      - - WAAP 与 CNAPP 套件
        - 把 API 安全与 WAF、DDoS、机器人防护和云态势打包
        - Akamai、Prisma、Cloudflare、Fastly、Imperva 和 Gartner 转向来源
        - 即使功能深度仍更强，Salt 也可能输给平台整合
        - 要求提供买家选择更广套件而非专精厂商的竞争失单数据。
      - - 内联式专精厂商
        - 把讨论从「谁看得更多」转成「检测还是阻断」
        - Wallarm 和 Cequence 官方材料
        - Salt 定位面临最尖锐的产品层反驳
        - 询问 Salt 有多常靠接入执行层取胜，而不是自己掌握执行层。
      - - 左移式契约平台
        - 把 API 安全前移到设计、契约审计和 CI/CD 卡点
        - 42Crunch 产品和文档
        - 开发者主导的采购动作可能绕过以运行时为先的评估
        - 要求提供 Salt 与左移工具配套、以及被左移工具替代的案例。
      - - 网关和机器人防护工具
        - 解决更窄的用例，如认证、校验、限速、抓取或账号接管
        - Kong 和 DataDome 官方页面
        - 替代品集合比具名的 API 安全直接竞品更宽
        - 按控制目标拆分失单原因，不只按厂商名称。
    notes: 竞争压力不只来自产品能力，也来自合作伙伴和平台的杠杆。替代品的广度还包括更窄的控制项，它们会压缩专门购买 API 安全的必要性。
