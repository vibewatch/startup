      - number: '3.2'
        title: 能力模型：运行时深度、态势与左移取舍
        blocks:
          - type: paragraph
            body: >-
              Salt 的公开差异化不只是「API 安全」，而是发现、态势治理和行为威胁分析这套组合，可以接入既有安全栈。也正因为如此，它与两个最尖锐的专业厂商反向定位不同。Wallarm 和 Cequence
              从在线阻断一侧切入，主张如果平台不能原生实时阻断滥用、账户接管和 OWASP API 攻击，发现和检测就不够。42Crunch 则从契约优先一侧推进：当团队已经管理成熟的 OpenAPI
              定义，并希望把策略执行直接绑定到 API 契约和 CI/CD 闸门时，它的微防火墙和审计工作流最强。


              更宽的平台厂商竞争方式不同。Prisma Cloud 把发现、风险画像、机器人和 DoS 控制，以及在线与带外两种部署，放进 CNAPP 和 WAAS 框架。Cloudflare 和 Fastly 把 API
              安全带入边缘原生流量、滥用和 DDoS 工作流。Kong 对 Salt 的直接替代较弱，因为它依赖插件、网关控制和开发者拥有的策略，而不是专用 API
              发现和行为分析；但对那些在购买专业平台前想要「足够好」网关安全的买家来说，Kong 仍是有意义的替代。实际读法是：当买家重视深度 API 专项上下文、又不想重建 WAF、CDN 或网关体系时，Salt
              能赢；当对手可以把同样功能压进在线执行或既有平台预算时，Salt 的叙事优势就会丢失。
