  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 竞争压力与市场商品化
        blocks:
          - type: paragraph
            body: >
              Salt Security 处在快速整合的 API 安全市场，超大规模云厂商和 CDN 平台已经提供原生 API 防护功能， 直接竞争 Salt 的独立产品。Cloudflare 2021 年推出 API
              Abuse Detection，AWS API Gateway 原生提供限流、 授权和请求校验，Akamai 2024 年以约 $450 million 收购 Noname Security——Salt
              主要的专用型竞争对手。 Akamai 2026 年宣布有意收购 LayerX，用于 AI 使用控制，显示平台扩张仍在继续。这些动作代表激进的平台整合， 会压缩独立 API
              安全厂商可触达的溢价市场，并带来长期利润率压力。


              Escape.tech（2025 年）的一份独立竞品对比称，安全专业人士对 Salt Security 的挫败感上升，原因是 POC 周期耗时数月，发现结果被描述为不可执行。G2 评价（共 12 条，平均 4.7
              星）指出，产品“仍然相对较新，缺少不少附加功能”， 且 SIEM 日志集成缺乏原生操作日志。Salt Security 平台的企业销售周期天然较长；如果超大规模云厂商继续改进原生 API 安全能力，
              买家可能选择足够好的捆绑式产品，而不是同类最佳的点解决方案。Wallarm、Akto、Imperva、F5 和 Escape 也构成来自专业厂商或捆绑玩家的额外竞争向量。


              Noname/Akamai 以约 $450 million 退出，而此前估计私募估值超过 $1 billion，说明 API 安全市场没有拿到 2022 年风险投资高峰时预期的溢价收购倍数。这是评估 Salt
              Security 独立 API 安全业务价值时最直接可比的公开数据点。
