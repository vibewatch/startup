      - number: '4.3'
        title: 成本结构与毛利率信号
        blocks:
          - type: paragraph
            body: >-
              Salt Security 是云交付 SaaS 公司，成本结构符合高增长企业安全平台特征：软件毛利率高，R&D 和 S&M 投入重，实体资本需求有限。2020 年 TechCrunch
              报道是唯一公开毛利率数据点：截至 2020 年 6 月，毛利率已「显著提升至超过 90%」。这与同等规模纯 SaaS 安全公司一致，其中托管式大数据基础设施（Salt 的核心差异点）是主要 COGS 驱动因素。

              Salt 的 API Protection Platform 依赖云规模大数据处理引擎，必须摄取并分析大型企业级 API 流量。其公开架构使用云规模时间序列
              ML/AI，意味着企业部署会产生实质基础设施成本，包括云计算、存储和数据出站。随着 ARR 从约 $5 million（2021）增至约 $75 million（2025），COGS 可能按比例增加，但 90%+
              的毛利率基线说明，相对于订阅收入，基础设施成本管理良好。行业 SaaS 基准将订阅毛利率中位数放在 75-85%，顶级四分位安全 SaaS 公司为 80-90%（Benchmarkit 2025），因此 Salt
              的 2020 年数字即便对顶级四分位也偏激进；当前毛利率未知，且随着基础设施规模扩大可能已被压缩。

              运营费用主要由 R&D 和销售与营销构成。Series D（$140M，2022 年 2 月）明确用于增加 R&D 投入并扩大销售和营销。公司在 2021 至 2022 年间员工数增加了两倍（约 65 人到
              192 人），说明当时 S&M 人员投入很大。此后员工数在 2022–2025 年间平台期在约 200 人，暗示 Series D 初期部署后，运营费用增长放缓。对云托管 SaaS
              公司来说，资本开支很低；业务模式没有暗示制造、库存或重大硬件资本开支。
