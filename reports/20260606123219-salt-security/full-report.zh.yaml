  - id: TE002
    title: 工作流 / 用例表
    columns:
      - 用户任务
      - 现有工作流
      - Salt 方案
      - 可衡量收益（声称）
      - 局限
    rows:
      - - 发现所有生产 API，包括影子端点
        - 靠手工登记、网关日志或 CDN 检查，通常会漏掉 30%+ 端点
        - Salt Connect 从云和网关镜像流量；Salt Surface 扫描外部暴露面；GitHub Connect 扫描代码
        - 公司研究：未记录 API 减少 33%；几分钟内开始发现
        - 公司自报指标；没有独立生产基准
      - - 梳理 API 中的敏感数据暴露
        - 手工数据流图、定期审计，通常不完整且很快过期
        - 在动态 API 流量中持续跟踪 PII、PHI 和支付卡数据，并标记姿态问题
        - 官方平台页描述实时敏感数据分类；DeinDeal 提到在生产环境保护 PII
        - 敏感数据检测没有公开的精确率 / 召回率指标
      - - 在攻击者打穿前检测并阻断 API 攻击
        - WAF 或 API 网关限速规则，看不见来自认证身份和业务逻辑层的攻击
        - 行为 ML 基线 + 实时异常关联；按实体级阻断，不是按交易级阻断
        - CrowdStrike 简报：告警减少 96%，处置速度快 20 倍，修复快 3 倍
        - 客户自报指标，未经独立审计
      - - 向审计方证明 API 合规
        - 手工映射政策、用电子表格收集证据
        - Policy Hub 按约 100 条规则评估 API；导出审计合规材料
        - 按官方说法，减少审计准备时间，并免去手工证据收集
        - 没有公开案例量化审计准备时间节省
      - - 运行时保护 AI 智能体的 API 调用
        - 多数组织没有面向智能体 API 安全的专用工具（Salt 研究称，只有 37% 为智能体 AI 配备专门的 API 安全能力）
        - AG-DR 监控并阻断异常的 MCP 和智能体驱动 API 行为；首次登录即自动设置护栏
        - Siemens CISO 引述：提升可视性和保护能力，支撑 Siemens Software 业务扩展 AI
        - 早期能力；Siemens 引述之外尚无公开正式生产案例研究
    notes: 「可衡量收益」列来自公司发布的指标、新闻稿和一条客户引述。除非标明为独立报告，这些数字均为公司声称。所有收益数字都需要尽调验证。
