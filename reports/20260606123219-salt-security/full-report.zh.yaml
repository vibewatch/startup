      - number: '8.4'
        title: 可比估值组与市场背景
        blocks:
          - type: paragraph
            body: >
              私人 API 安全 M&A 可比样本很薄，但 Noname/Akamai 交易提供锚点。上市安全 SaaS 公司提供次级基准， 不过大多数比 Salt Security
              规模更大、业务更多元，或盈利阶段不同。可比组给出的关键信号是： 除非达到相当规模（$150M+ ARR），或被战略收购方看中专利组合或客户基础，独立 API 安全平台拿不到溢价收购倍数。 Salt
              Security 估计 $50-80M ARR 区间明显低于驱动溢价 M&A 定价的规模门槛。


              2022 年高峰估值融资的私人 SaaS 网络安全公司，在 2023–2026 年私募市场普遍面临 40-60% 估值压缩。 跨阶段比较显示，$50-80M ARR 且增长 20-30% 的网络安全 SaaS
              公司，在 2025–2026 年二级市场交易于 5-8x ARR。 按 Salt Security 估计 $50-80M ARR 区间，5-7x ARR 倍数对应企业价值 $250-560M，覆盖 Noname
              可比交易（$450M）， 并说明若要兑现 2022 年 $1.4B 标记，需要 10-14x ARR——当前可比组不支持这一倍数。Agentic Security 转向若成功，
              可能释放平台溢价，但市场尚未将智能体 AI 安全与 API 安全分开定价。
            claimRefs:
