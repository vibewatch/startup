      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >-
              到 2028 年，五个主要增长驱动因素正在塑造 API 安全市场。第一是 API 激增：Salt 2024 报告记录，API 数量同比增长 167%，66% 的组织管理超过 100 个 API，67%
              的组织每月收到超过 10 million 次 API 请求。每一个新 API 都是潜在攻击面，传统工具无法覆盖。第二是攻击升级：37% 的受访者在过去 12 个月发生过 API 安全事件（2023 年为
              17%），拥有高级 API 安全项目的比例从 12%（2023）降至 7.5%（2024）——说明成熟防御供给落后于攻击者需求。

              第三是监管与合规压力：OWASP API Security Top 10（2023）把采购团队如今直接引用的风险类别标准化；PCI DSS v4.0 和 GDPR 在金融和医疗垂直行业创造可执行义务；美国和欧盟
              AI 治理框架也要求智能体 AI 工作负载具备 API 级控制。第四是智能体 AI 和 LLM 采用：当组织部署通过 Model Context Protocol（MCP）服务器和 REST / GraphQL
              API 通信的 AI 智能体时，API 攻击面会扩展到提示注入、权限过大的智能体，以及未经审查的第三方工具集成——这是既有 WAF 和网关厂商无法原生处理的新风险类别。Salt 的 2025 年路线图（Salt
              Illuminate、MCP protection、Ask Pepper AI）正是围绕这一驱动因素定位。

              第五是数字化转型和云迁移：多云架构会增加 API 端点数量，也增加需要一致策略执行的环境数量；微服务拆分把单体业务逻辑转成 API 暴露服务，进一步放大发现和治理挑战。

              采用约束也很实质。预算集中度有限：只有 7.5% 的组织拥有专门 API 测试和威胁建模项目，意味着大众市场尚未在独立 API 安全工具上花钱。3–6 个月 POC
              周期、部署复杂度（流量镜像、传感器部署、SIEM 集成）以及高日志成本（Escape.tech 批评 Salt 的流量镜像方法会增加日志成本）会放慢价值实现时间并拉长回本周期。Akamai、Cloudflare
              和 Imperva 的既有 WAAP 打包，使大型企业客户能在现有合同上以零或接近零的增量成本满足清单式 API 安全要求，压低独立 API 安全交易规模和赢单率。市场整合（Akamai 2024 年以约
              $450M 收购 Noname Security）把渠道权力和资质背书集中到既有厂商手中。
