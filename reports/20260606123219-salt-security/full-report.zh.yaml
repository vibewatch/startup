      - number: '8.5'
        title: 退出准备、尽调事项与论点失效触发因素
        blocks:
          - type: paragraph
            body: >
              Salt Security 的退出准备度中等。最可能的路径是并购退出，买方可能来自 CDN、云厂商或企业安全公司； Akamai、Cloudflare、CrowdStrike、Palo Alto
              Networks、Google 都是潜在战略买家。Noname/Akamai 交易已经证明，CDN 玩家愿意收购 API 安全资产。IPO 准备度低：ARR 规模、盈利路径，以及智能体转向尚未验证，
              意味着公司最快也要 3-5 年才具备公开市场条件。老股流动性可以给现有投资人一个出口，但价格未知， 大概率低于 2022 年估值。


              最终尽调必须回答：（1）实际 ARR、ARR 增速和 NRR，用来测算业务规模并验证 5-7x 倍数区间； （2）以色列团队员工数和业务连续性文件；（3）关键 GDPR 第 28 条数据处理协议副本和 SOC2
              Type II 认证； （4）在 $300M、$450M、$600M 退出价格下的股权结构表和清算优先权瀑布模型； （5）Agentic Security 付费客户或已签试点协议的证据。


              会打破 Salt Security 投资逻辑的触发因素包括：ARR 下降或同比增速低于 10%；一家大客户公开称已用 超大规模云厂商替换 API 安全；Salt Code GA 后 12 个月内仍未宣布任何
              Agentic Security 付费客户； 以色列 R&D 中断超过三个月；任何监管执法；或以低于 $600M 的投前估值完成新一轮融资。
            claimRefs:
