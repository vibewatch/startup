  - id: FI004
    title: 资本强度 / 现金流图
    type: flow
    layout: standard
    summary: 绘制 Salt Security 在 D 轮之后（2022–2026）的资本来源、资金投向和关键充足性不确定因素。
    data:
      nodes:
        - id: capital_in
          label: 已募集资本
          detail: 累计股权融资约 $271M；$140M D 轮（2022 年 2 月）是最近一次新股事件；CrowdStrike Falcon Fund 战略投资（2022 年 9 月，金额未披露）。
        - id: rd
          label: 研发投入
          detail: D 轮资金的主要用途；包括 Salt Labs 研究团队、平台工程（员工基数约 200 人）和产品路线图（MCP/AI 安全、2025 创新冲刺）。
        - id: gtm
          label: 销售与市场
          detail: D 轮资金的次要用途；2023 年招聘 CRO 和 CMO；渠道计划（STEP、CrowdStrike Marketplace）；向欧洲和 LATAM 国际扩张。
        - id: arr_engine
          label: ARR 引擎
          detail: 经常性订阅收入约 $75M ARR（2025 年中）；同比增长约 54%；随着 ARR 接近运营成本运行率，开始抵消烧钱。
