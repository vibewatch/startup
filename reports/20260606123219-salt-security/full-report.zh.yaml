        title: 缓释因素、终止标准与监控指标
        blocks:
          - type: paragraph
            body: >
              Salt Security 针对竞争风险的主要缓释包括：通过智能体安全转向，在高增长 AI 安全空间抢在大型既有厂商前重新定位； 以及八年的 API
              流量行为数据集，形成超大规模云厂商难以快速复制的数据护城河。Noname/Akamai 收购验证了战略 M&A 退出路径， 即便相对 2022 年估值打折。针对监管和隐私风险，Salt 2024 年 3
              月隐私政策更新及其承诺签署 GDPR 数据处理协议， 构成部分结构性缓释。Sequoia Capital 参与（Carl Eschenbach 自 Series B 起进入董事会）提供治理质量和网络资源，
              降低不利资本事件风险。


              关键论点失效触发因素包括：ARR 同比增长低于 15%；以色列 R&D 人员中断超过三个月；Salt 遭遇任何 GDPR 或 FTC 执法行动； Salt Code 正式 GA 后 12
              个月内未能展现实质外部采用；新融资轮投前估值低于 $800 million； 或标杆企业客户流失给超大规模云厂商的捆绑式替代方案。以 $600 million 或以上 M&A 退出，将代表相对 2022
              年标记的部分论点修复； 低于 $300 million 退出，则构成 Series D 投资人的论点失效。
