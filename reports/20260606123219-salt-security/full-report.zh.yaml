      - number: '4.5'
        title: 资本充足性、融资依赖与财务结论
        blocks:
          - type: paragraph
            body: >-
              Salt Security 最近一次新股融资事件是 2022 年 2 月 $140 million Series D，由 SEC Form D（File No. 021-434118）确认。ARR 从约
              $48.5 million（2024 年末）增至约 $75 million（2025 年中），如果假设公司按照 90%+ 毛利率基线所支持的规模路径管理并接近现金流盈亏平衡，那么 Series D
              资金理论上应能支撑运营至少到 2025-2026，具体取决于烧钱速度。但烧钱速度未披露：一家 200 人规模的企业安全公司，若维持 API 安全行业典型的重 R&D 和 S&M 投入，月度运营费用可能合理落在
              $3-8 million，意味着从 Series D 部署窗口起剩余现金跑道为 12-36 个月。这些只是估计。

              截至 2026 年 6 月本次报告日期，公司未公开宣布 Series E 或后续债务 / 信贷额度。Forge Global 和 notice.co 的二级市场观察显示，股份可能较 2022 年 $1.4
              billion 新股估值折价交易。四年以上没有新股融资、员工数平台期、ARR 改善（如果 Latka
              数字方向正确）这几件事合在一起，可能指向两种情景：（a）有机现金生成能力强并接近盈亏平衡，因此无需新融资；或（b）难以按 $1.4 billion
              参考估值取得资本，因而转向现金跑道管理。没有经审计财务时，两种情景都与公开证据一致。

              财务结论：Salt Security 拥有高质量 SaaS 收入模式（年度订阅、企业 ACV、90%+ 毛利率基线）、强 ARR 增长信号（约 54%
              YoY）和充足的历史资本。主要财务尽调阻碍是缺少经审计财务、烧钱速度和现金跑道未知、NRR 与 CAC 回本未知，以及资本结构问题未解决（2022 年后无新股融资）。鉴于企业订阅模式和具名 Fortune 500
              标识，收入质量评估为中高，但没有管理层财务接触就无法承销。
