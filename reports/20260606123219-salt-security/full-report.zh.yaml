    notes: 「Policy Hub」姿态规则是面向客户的合规检查，用在客户自己的 API 上；它们不认证 Salt 的 SaaS 平台。标为「未公开」的行，表示截至 2026-06-06 保留来源中没有证据，不等于确认不存在认证。
