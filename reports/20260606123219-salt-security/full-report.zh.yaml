chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品范围与公司结构
        blocks:
          - type: paragraph
            body: >-
              Salt Security 由 IDF 网络安全老兵 Roey Eliyahu（CEO）和 Michael Nicosia（COO）于 2016 年创立。公司早期运营根基在以色列，之后扩展到当前的 Palo
              Alto 总部。公司最初以 Secful 名义注册，后来在推出商业化 API 防护平台、走出隐身期时更名为 Salt Security。Salt Security 注册地在 Delaware，总部位于 Palo
              Alto，并把研发集中在以色列 Tel Aviv，采用以色列网络安全公司常见的双枢纽模式。

              公司的核心产品是 Salt Security API Protection Platform，一款云交付 SaaS 解决方案。平台结合云规模大数据处理、机器学习和人工智能，提供三项整合能力：自动化 API
              发现（包括影子 API 和僵尸 API）、行为式运行时威胁检测，以及面向开发者的态势治理。Salt 自称是第一家打造专用且有专利的 API 安全平台的厂商，并以此将自己定位为品类开创者。截至 2025
              年中，平台已经扩展到智能体 AI 安全、MCP 服务器防护，以及通过「Ask Pepper AI」进行对话式安全调查。

              Salt Security 面向大型组织中的企业安全团队、CISO 和应用安全从业者，这些组织运行复杂且 API 密集的应用栈。公司把产品定位为 API 网关、WAF 和 SIEM
              平台的补充，而不是替代品；CrowdStrike Falcon 和 AWS WAF 集成也体现了这一点。阶段上，公司属于 Series D / 后期私有公司；截至本次报告日期，尚未宣布 IPO。
