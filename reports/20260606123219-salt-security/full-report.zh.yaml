              平台会随时间发现更多 API，并可在客户新增云环境、网关和 AI 智能体时扩展覆盖；每项新能力（AG-SPM、AG-DR、GitHub Connect） 都是新的增购切入点。但没有披露 NRR 或扩张 ARR
