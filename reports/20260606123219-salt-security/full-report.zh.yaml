      - number: '3.4'
        title: 护城河耐久性与承销结论
        blocks:
          - type: paragraph
            body: >-
              Salt 的护城河真实存在，但比品类开创者叙事暗示的要窄。公司围绕发现、态势治理、行为分析，以及以合作伙伴友好的方式部署进既有技术栈，仍有连贯的专业厂商故事。当通用 WAAP
              清单漏掉业务逻辑滥用、契约漂移或工作流集成需求时，这种深度仍有价值。Cequence、Wallarm 和 42Crunch 等直接专业厂商仍然存在，也说明市场尚未完全商品化为单一 WAAP 功能桶。


              更难承销的问题是，更多买家默认平台整合之后，Salt 能否守住溢价定位。具备在线能力的专业厂商可以把对话转向「检测 vs. 阻断」质疑。WAAP 和 CNAPP
              厂商可以把对话转向「为什么再买一个点产品？」质疑。混合部署或受监管买家可能偏好明确具备流量路径控制或混合部署表述的厂商。与此同时，公开来源仍不披露相对赢单率或交付经济性。因此，后续风险和估值工作的正确结论不是
              Salt 缺乏差异化，而是它的耐久性取决于能否用私有证据证明三件事：第一，行为分析和态势治理能转化为可衡量的客户结果；第二，伙伴驱动分发能比平台内化该功能集更快扩大管线；第三，即使 API
              安全成为更宽应用安全平台中的标准评估项，Salt 仍能守住利润率和续约质量。
