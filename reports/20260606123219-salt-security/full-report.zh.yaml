              关于 Salt Security 当前财务健康状况，公开证据有限。公司未披露 ARR、收入运行率或现金消耗率。未发现数据泄露、公开投诉或执法行动。 Agentic Security 是当前产品定位（截至 2026
              年 6 月），Salt Code 已面向前 100 家企业组织开放早期访问。 公司博客活跃（最近一篇 2026 年 6 月）。2024–2025 年没有 ARR 里程碑公告，引发对增长轨迹的疑问。


