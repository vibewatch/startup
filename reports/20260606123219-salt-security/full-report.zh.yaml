      - number: '2.2'
        title: 市场规模 — TAM、SAM 与相互冲突的估计
        blocks:
          - type: paragraph
            body: >-
              MarketsandMarkets（2023 年 7 月）估计，独立 API 安全市场到 2028 年将达到 USD 3,034 million，CAGR 为 32.5%。这一数字只覆盖 API
              安全平台和解决方案、专业服务以及托管服务，地理范围为全球。方法论是自下而上的厂商收入汇总叠加自上而下增长建模；局限包括依赖厂商提供数据、纳入相邻品类导致范围外溢，以及发布时间窗口距离本次报告日期较早且较集中。

              更宽的应用安全市场提供了更大的可寻址框架：MarketsandMarkets（2026 年 7 月）预计 App Security 市场 2026 年为 USD 41.16 billion，到 2031 年增至
              USD 66.03 billion，CAGR 为 9.9%；API 安全只是其中一个子细分，与 SAST、DAST、SCA、容器安全和移动 AppSec 并列。API 安全在 App Security
              支出中的份额没有被精确拆出，但分析师笔记显示，在成熟项目中，10–15% 的 App Security 预算会留给 API 专项工具。

              相互冲突的估计被保留下来：MarketsandMarkets 到 2028 年 $3.0B 的数字，在 32.5% CAGR 下倒推 2023 年基数约 $680M；而行业媒体引用的一些分析师摘要，把 2026
              年 API 安全市场放在 $3–5B。这些差异来自定义边界不同（狭义 API 安全 vs. WAAP vs. 完整 App Security）、方法论不同（厂商收入 vs.
              买方支出），以及是否纳入专业服务。Salt Security 的 SAM——聚焦 1,000 名以上员工、应用栈复杂且 API 密集、位于受监管垂直行业的大型企业账户——无法从公开来源精确拆出；该证据缺口已记录。

              行业信号印证了需求增长：Salt 2024 State of API Security 报告发现，66% 的组织管理超过 100 个 API（2023 年为 59%），API 数量同比增长
              167%。Gartner 2021 年修订后的预测称，API 滥用将成为企业 Web 应用泄露中最常见的攻击向量。这些数据点是验证市场创建的滞后指标，但不能直接换算为可寻址收入池。
