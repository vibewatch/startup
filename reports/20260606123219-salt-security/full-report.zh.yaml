      - number: '7.4'
        title: 财务、融资与执行风险
        blocks:
          - type: paragraph
            body: >
              Salt Security 在 2022 年 1 月 Series D 融资 $140 million，估值 $1.4 billion——接近私人科技估值高峰。 按 SEC Form D 文件，四轮总融资约
              $271 million。2022 年以来，私人网络安全公司的 SaaS ARR 倍数大幅压缩。 从 Series D 到 2026 年 6 月运行日之间，没有公开宣布 Series E
              或后续融资，暗示公司要么仍在消耗 Series D 资金续航， 要么已经盈利，要么无法以可接受条款融资。当前环境下任何新一轮融资，都可能需要接受降估值融资或低于 2022 年的估值。 公司累计 $271
              million 融资形成的清算优先权堆叠意味着，低于 $400 million 的退出很可能让普通股股东拿到极少甚至零收益。


              2026 年 6 月 “Salt Code” 面向前 100 家组织开放早期访问，代表一次重大战略转向 “Agentic Security”——保护 AI 智能体、 MCP 服务器和
              API。这一转向需要新的产品开发投入、重塑 GTM，并重新教育客户。智能体 AI 安全仍是新兴市场， 买家定义和定价规范不清晰；来自 LLM 安全厂商（CrowdStrike、Palo Alto
              Networks、Wiz）的竞争框架也声称覆盖智能体安全。 如果转型失败，Salt 仍将暴露在收缩的纯 API 安全市场中，而超大规模云厂商正在侵蚀溢价 ASP。
