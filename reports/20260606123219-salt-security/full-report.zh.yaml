      - number: '4.4'
        title: 公开牵引指标与私有数据缺口
        blocks:
          - type: paragraph
            body: >-
              相对于投资承销要求，Salt Security 可见的公开财务图景很窄。已确认或来源较好的指标包括：Latka 显示 ARR 约 $48.5 million（2024 年 11 月）和约 $75
              million（2025 年 6 月）；累计股权融资约 $271 million（最近确认的 2022 年 2 月 SEC Form D）；最近一轮估值 $1.4 billion（2022 年 2
              月）。这些是唯一有实质来源的收入相关数字。

              公司在 2022 年 2 月 Series D 新闻稿中自称的牵引包括：过去 12 个月收入增长 500%、客户基数增长 300%、已签约 Fortune 500 / Global 500 客户增长
              900%。如果 2022 年增长数字方向正确，而 2020 年 ARR 约为 $5 million（由 Latka 2021 年 $4.9 million 数字隐含），那么 2022 年 Series D 后的
              ARR 轨迹大致会把 Salt 放在 $20-30 million。Latka 对 2024 年末给出的 $48.5 million 数字，意味着 2022-2024 年增长慢于 2020-2022
              年的超高速扩张阶段。这与更宽 API 安全市场成熟、以及 Salt 员工数在约 200 人平台期相一致（暗示公司有意管理费用或进入投资消化期）。

              公开披露中实质缺失的包括：绝对客户数、客户集中度（top-5 ARR 占比）、净收入留存率、总美元流失率、平均合同价值（ACV）分布、递延收入、现金及现金等价物、净利润 / 亏损，以及烧钱速度。这些都是 SaaS
              公司标准承销输入，无法从公开来源重建。公司的披露姿态是私有未披露。
