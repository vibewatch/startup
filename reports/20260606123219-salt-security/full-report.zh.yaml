              PCI DSS v4.0 的 API 专项要求（2025 年 3 月生效）把 API 安全从 CISO 自由裁量采购转成全球约 3 million
              商户和处理方的合规强制预算项。这个单一监管事件会实质压缩金融服务业的现状替代策略，而金融服务正是 Salt 最强的垂直行业。
