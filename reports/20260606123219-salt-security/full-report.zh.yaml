            body: >-
              Salt Security 披露的信息足以支撑方向性投资判断，但不足以在没有管理层接触的情况下完成承销。公开来源中最可靠的封面指标包括：最新一轮估值 $1.4 billion（2022 年 2
              月）；累计股权融资约 $271 million；Latka 数据库显示 ARR 约 $48.5 million（2024 年 11 月）和约 $75 million（2025 年 6 月），隐含约 54% ARR
              增长；LinkedIn 衍生估计显示员工数约 135 人（2022 年 2 月）、约 192 人（2022 年 12 月）、约 202 人（2023 年 12 月）和约 201 人（2025 年 11 月）。

              客户牵引信号以定性为主。Series D 新闻稿称，前一年收入增长 500%，客户基数增长 300%，已签约 Fortune 500 和 Global 500 客户增长 900%。具名企业客户包括
              Equinix、Amway、OneMain Financial、Finastra、Aon、Telefónica、City National Bank、Live Oak
              Bank、HealthEquity、Navan、Takeda Pharmaceuticals、BP Launchpad、Markel、Berkshire Bank、Icatu Seguros 和
