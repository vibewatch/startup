  - id: TR005
    title: 缓释与否决标准表
    columns:
      - 风险
      - 可监测触发器
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 竞争性商品化
        - ARR 增长率
        - 任一 12 个月测量期内 ARR 同比增长低于 15%
        - 投资逻辑破裂：加速 M&A 流程，或考虑以承压倍数进行老股出售
      - - 估值压缩 / 降价融资
        - 新融资或 M&A 价格
        - Series E 轮或 M&A 流程的投前估值低于 $800M
        - 投资逻辑破裂：2022 年 $1.4B Series D 逻辑失效；按当前估值评估退出替代方案
      - - 以色列研发人力中断
        - 以色列人力可用性
        - 长期中断连续超过 3 个月影响超过 20% 的工程团队
        - 重大风险：要求启动 BCP；评估产品路线图延迟影响
      - - GDPR 或 FTC 执法行动
        - 监管问询、罚款或同意令
        - 欧盟 DPA 或 FTC 对 Salt Security 发出任何执法行动
        - 重大风险：评估罚款规模；评估客户合同续约影响
      - - 智能体安全转向停滞
        - Salt Code 采用指标
        - GA 日期后 12 个月内未公告外部设计伙伴案例研究或付费客户
        - 战略风险：转向可能无法形成差异化；需评估核心 API 安全竞争护城河
      - - 超大规模云厂商功能同等公告
        - AWS / Cloudflare / Akamai 产品发布说明
        - 重大 API 安全功能同等公告削弱 Salt 检测优势
        - 竞争风险：加速 M&A 接洽；在下一轮续约周期前考虑战略替代方案
    notes: |
      否决标准阈值是分析师基于典型 Series D 网络安全 SaaS 投资人预期作出的估计。实际投资人条款、优先股堆叠细节和管理层业绩基准未公开披露。这些触发器是监控启发式，并非合同契约。
    claimRefs:
      - CR025
      - CR027
      - CR028
      - CR030
  - id: TV001
    title: 建议摘要表
    columns:
      - 维度
      - 值
      - 依据
      - 置信度
      - 决策含义
    rows:
      - - 建议
        - 继续研究
        - ARR 数据不足；转向尚未验证；估值偏高
        - 中
        - ARR 和 BCP 尽调完成前不要投入资本
      - - 置信度
        - 低至中
        - 私营公司；未披露 ARR、烧钱速度或 NRR
        - N/A
        - 置信度提高前，需要大量私下尽调
      - - 风险评级
        - 高
        - 竞争性商品化、地缘政治、融资压力
        - 中
        - 保守控制仓位；主动跟踪投资逻辑破裂触发项
      - - 估值立场
        - 偏高
        - $1.4B 估值标记对比 Noname $450M 可比交易；隐含 10-14x ARR，对比市场 5-7x
        - 中
        - 新进场必须较 2022 年估值标记有实质折价；目标入场估值 <$700M
      - - 退出周期
        - 3-5 年
        - 并购退出最可能；达到 IPO 准备度还需要 3 年以上规模化
        - 低
        - 按并购退出定价；基准情景计入较 2022 年估值标记下行 40-60%
    notes: >-
      建议对价格高度敏感。若入场估值为 $500-600M（较 2022 年估值标记折价 30-60%），风险 / 回报显著改善。若按 2022 年估值标记进入，基于 Noname 可比交易，Series D
      投资者的预期情景结果为负。
    claimRefs:
