      - number: '5.2'
        title: 核心模块——发现、态势与威胁防护
        blocks:
          - type: paragraph
            body: >-
              API Discovery 由三条互补数据路径交付：Salt Connect（无代理连接器，通过流量镜像从 AWS、Azure、GCP、Kong、 Apigee、MuleSoft、NGINX 和 Istio
              拉取元数据）、Salt Surface（从攻击者视角绘制面向公网 API 的外部攻击面扫描器）， 以及 GitHub Connect（2025 年 11 月推出的代码仓库扫描器，在部署前识别源码中的 API 和
              MCP 服务器配置）。 三条路径合在一起，指向 Salt 自研报告揭示的行业局限：只靠 CDN 的单一来源发现会漏掉估计 30.7% 的 API。 Posture Management 引擎以 Policy
              Hub 为中心，内置约 100 条规则，并允许客户编写自定义规则。Salt 2025 State of API Security Report 发现，只有 10% 的企业部署了 API 态势治理策略，这让
              Policy Hub 具备先发优势。Threat Detection 引擎用行为 ML 基线检测 BOLA/IDOR、撞库、账户接管、数据外泄、会话操纵、API 滥用和注入攻击； Salt
              研究显示，这些类别约占映射到 OWASP API Security Top 10 攻击的 80%。攻击修复通过 SIEM 和工单集成（Splunk、 Microsoft
              Sentinel、Jira）给出可执行的开发者指引。敏感数据追踪会映射 API 流动中的 PII、PHI 和支付卡数据， 并输入态势报告和合规导出。
