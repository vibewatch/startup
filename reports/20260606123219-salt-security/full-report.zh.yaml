  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与定价结构
        blocks:
          - type: paragraph
            body: >-
              Salt Security 的收入模式是纯企业 SaaS 订阅，按年度合同销售，主要按照 API 调用量定价。公司没有发布公开定价页；最清晰的标价信号来自 AWS Marketplace
              上架页，其中标准企业部署的公开基准价是每年 $100,000，覆盖每月最高 100 million 次 API 调用。Vendr 采购数据库和第三方定价聚合器确认，企业客户的估计平均合同价值（ACV）区间约为每年
              $70,000 到 $210,000，差异来自调用量、功能集和谈判后的部署范围。

              除基础订阅外，当月度 API 调用量超过合同阈值时，模式还包括超额费用。企业买家可以叠加更多能力，例如态势治理模块、高级修复，以及 CrowdStrike Falcon 集成附加模块。Salt Security
              通过直销和云市场（AWS Marketplace、CrowdStrike Marketplace）销售，让客户可以用云承诺消费协议抵扣 Salt 采购。

              收入几乎全部来自订阅；基于业务模式描述和公司沟通，专业服务（集成、概念验证交付）似乎只占总收入少数。AWS Marketplace
              评论渠道中的一位合作伙伴称其定价「可承受」，且属于「年度订阅费」，同时指出集成支持更多是组织层面而非软件本身。这印证了纯软件收入确认模式，没有明显嵌入服务导致的毛利稀释。收入确认遵循标准 SaaS
              订阅期内按月摊销会计，因此 ARR 在合同期内逐月确认，多年预付会形成递延收入。
