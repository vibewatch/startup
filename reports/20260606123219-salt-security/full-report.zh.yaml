      - number: '7.3'
        title: 以色列来源、地缘政治与平台依赖风险
        blocks:
          - type: paragraph
            body: >
              Salt Security 最初以 Secful, Inc. 注册，后由 Israeli Defense Forces 退伍军人 Roey Eliyahu（CEO）和 Michael Nicosia（COO） 在
              2016 年公开推出，公司至今仍在以色列维持活跃 R&D 运营。2023 年 10 月升级的中东冲突，为 Salt 以色列工程团队带来业务连续性风险、
              潜在人力中断，并增加美国联邦政府和国防邻近销售渠道的敏感性。在 Export Administration Regulations（EAR）和更广泛地缘政治背景下，
              美国政府机构和承包商部署以色列来源供应商的安全产品可能受到审查。部分美国政府采购工具要求来源和供应链验证， 以色列来源软件必须满足这些要求。


              平台依赖风险实质存在：Salt Security 平台依赖来自第三方 API 网关的带外流量镜像，包括 Apigee、Kong、MuleSoft 和 NGINX。 如果这些网关厂商投资原生安全分析——AWS
              API Gateway 已经在做——Salt 就会失去数据摄取优势。Kong 的 API 安全最佳实践 文档现在覆盖 Salt
              所处理的同类威胁，说明网关厂商正在把自己定位为具备安全能力。云基础设施集中度增加运营风险： Salt SaaS 平台依赖 AWS 或 Azure
              托管，造成对超大规模云厂商的可用性和成本依赖，而这些云厂商也通过原生 API 安全功能直接竞争。 客户迁移 API 网关平台时必须重新集成 Salt Security，迁移过程中产生流失风险。
