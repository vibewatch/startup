  - id: FV002
    title: 估值敏感性——ARR 倍数情景与 2022 年标记对比
    type: bar
    layout: wide
    summary: 不同 ARR 倍数下的企业价值结果，并与 2022 年 Series D 标记和 Noname 收购基准对比。
    data:
      items:
        - label: 悲观（3x ARR，估计约 $55M）
          value: 165
        - label: 基准（5x ARR，估计约 $65M）
          value: 325
        - label: 乐观（7x ARR，估计约 $90M）
          value: 630
        - label: Noname 收购基准（2024）
          value: 450
        - label: 2022 年 Series D 投后估值标记
          value: 1400
    approximationNotes: ARR 估计值（$55M、$65M、$90M）是分析师基于 Series D 融资背景和行业基准推断；实际 ARR 未公开披露。企业价值以百万美元计。
