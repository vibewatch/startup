      - number: '1.3'
        title: 融资历史、投资人与估值
        blocks:
          - type: paragraph
            body: >-
              Salt Security 的资本形成期包括 2018 年至 2022 年六轮公开可查融资。公司在 2018 年 9 月向 SEC 提交了种子轮 Form D。最早披露金额的融资是 2020 年 6 月 $20
              million Series A，由 Tenaya Capital 领投，S Capital VC 和 Y Combinator 参投，使当时累计融资达到约 $30 million。六个月后，Sequoia
              Capital 在 2020 年 12 月领投 $30 million Series B，使总融资达到 $60 million，并让 Carl Eschenbach 加入董事会。2020
              年两轮融资相隔六个月，节奏很紧，反映出早期产品市场契合度较强、收入增长很快。

              2021 年 5 月，Salt 完成 $70 million Series C，由 Advent International 领投，Alkeon Capital、DFJ Growth
              和既有投资人参投。Series C 公告称，公司过去十二个月收入增长 400%，员工数增长 160%。2022 年 9 月，CrowdStrike 的 Falcon Fund 对 Salt Security
              进行战略投资，开启 GTM 合作关系。

              决定性的资本事件是 2022 年 2 月 Series D：$140 million，由 CapitalG（Alphabet 旗下独立成长基金）领投，所有既有投资人参与。该轮于 2022 年 2 月 18 日向
              SEC 备案（File No. 021-434118，CIK 0001753414），Salt 估值达到 $1.4 billion，获得独角兽身份。Globes 报道指出，公司在 Series D
              前十二个月内融资 $210 million。Series D 资金用途是加速研发、扩展销售和营销，并扩大国际业务。截至本次报告日期，公司未宣布 Series E 或之后的新股融资。Forge、notice.co
              等二级市场观察者显示，当前私募市场交易中，Salt 股份可能较 2022 年峰值估值折价。
