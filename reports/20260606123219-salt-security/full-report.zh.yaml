      - number: '3.3'
        title: 分发权力、平台杠杆与伙伴重叠
        blocks:
          - type: paragraph
            body: >-
              这个市场的竞争权力越来越来自分发和相邻位置，而不只是产品清单。Akamai 收购 Noname，让它在更大的应用和边缘安全业务中拥有直接 API 安全资产。Cloudflare 和 Fastly
              的优势在于它们已经坐在流量路径上。Prisma Cloud 则受益于既有 CNAPP、云和合规采购动作。那些厂商不需要单靠 API 安全取胜；它们可以把 API
              安全与更宽的平台续约、云态势、WAAP、机器人管理或企业支持承诺打包。


              Salt 的应对是合作伙伴驱动扩张。CrowdStrike 和 Wiz 集成加强了 Salt 的 GTM 路径，把 API 风险上下文放进许多企业已经运行的 XDR 和 CNAPP 工作流。CrowdStrike
              集成尤其重要，因为它借助 Falcon agent 降低发现摩擦，并提供自动响应钩子；Wiz 集成则把 API 态势和威胁数据连接到云攻击路径分析。但这些集成也暴露出战略张力：如果 API 安全成为主导 XDR
              和云安全控制台内的一个功能，平台所有者就会获得分发杠杆，并最终压缩专业厂商的议价权。公开定价证据加剧了这一点。Cloudflare 和 Kong
              比专业厂商披露更多包装结构，但保留下来的证据仍无法给出真正同口径的交付成本，因此实时报价和输赢单数据比网站价格更重要。
