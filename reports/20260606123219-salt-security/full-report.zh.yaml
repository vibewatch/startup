      - number: '1.2'
        title: 创始人、管理层厚度与治理
        blocks:
          - type: paragraph
            body: >-
              Roey Eliyahu 联合创办 Salt Security 并担任 CEO。创办 Salt 之前，Eliyahu 联合创办了 Eshkol College，这是一家网络安全培训机构，重点培养毕业生进入 IDF
              精英网络部队；他本人也在 IDF 网络部队服役三年，最终担任团队负责人。联合创始人兼 COO Michael Nicosia 曾任 Adallom 全球销售副总裁；Adallom 后来被 Microsoft
              收购，成为 Cloud App Security 产品线的一部分，这给 Salt 带来了直接的企业安全销售经验。

              Series D 前后，高管团队明显扩容。关键新增成员包括 Kfir Lippmann（CFO），他曾在 monday.com 从 40 名员工一路负责财务到 Nasdaq IPO；Matt
              Quarles（CRO），2023 年加入，负责扩大全球收入；Michael Callahan（CMO），曾任 Acronis CMO；Renee Hollinger（Chief People
              Officer），曾任 Reltio CHRO；Gilad Gruber（SVP Engineering），曾任 Payoneer CTO；以及 Yaniv Balmas（VP Research），他在
              Check Point 领导网络研究八年后创办了 Salt Labs。

              董事会席位反映了投资人联盟：Tom Banahan（Tenaya Capital）在 Series A 后加入；Carl Eschenbach（Sequoia Capital）在 Series B
              后加入；James Luo（CapitalG）随 Series D 投资加入；Haim Sadger 和 Ayala Peterburg（S Capital
              VC）代表创始阶段投资人。这种五席董事会、投资人占比较高的结构，符合后期风投支持公司常见模式。关键人物依赖仍然重要：两位联合创始人都在运营一线，Eliyahu 是主要公开面孔；Lippmann 的
              monday.com IPO 经验，也让他成为任何公开市场路径中的关键资源。
