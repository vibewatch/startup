            body: >
              牛市情景假设 Salt Security 到 2027–2028 年实现 $80-100M ARR，成功将相当一部分客户基础迁移到 Agentic Security 并获得溢价定价，
              同时吸引超大规模云厂商或企业安全平台以 7-8x 远期 ARR 发出 M&A 要约。$80M ARR、7x 倍数对应企业价值 $560 million； $100M ARR、8x 倍数对应 $800
              million。牛市退出相当于从 2022 年 $1.4B 标记恢复 40-57%，会让 Series C 投资人 （按约 $1/股、$68M 资本进入）获得中性到正收益，但 Series D 投资人（按约
              $1.4B 每股等价估值进入）可能仍为负收益。 牛市需要：Agentic Security 在 12-18 个月内形成实质付费 ARR、没有主要企业客户流失给超大规模云厂商，以及以色列 R&D 连续性。


              基准情景假设 ARR 温和增长（每年 10-15%）到 2027 年达到 $60-70M，Agentic Security 转向取得早期采用但未爆发， Salt Security 通过 M&A 以 5x ARR
              出售给 CDN 或企业安全收购方，对应约 $300-350M。在该情景下，Series D 投资人 （按约 $1.4B 估值进入）在企业价值上将面临 75-80% 损失，普通股股东在清算优先权后收益极少。


              熊市情景假设 API 安全商品化加速，Agentic Security 转向未能实现产品市场匹配，ARR 增长停滞在 10% 以下， Salt Security 被迫以 3x ARR（$150-200M）困境
              M&A，或进行进一步稀释普通股的降估值融资。 $150-200M 的熊市退出很可能让普通股股东零收益，Series B/C 投资人只能部分回收。
            claimRefs:
