      - number: '4.2'
        title: GTM 动作与销售效率代理指标
        blocks:
          - type: paragraph
            body: >-
              Salt Security 采用企业直销动作，并辅以渠道计划。由 CRO Matt Quarles（2023 年加入）领导的直销团队，聚焦 Fortune 500 和 Global 500 账户中的 CISO
              与应用安全买家。公司自 2021 年以来扩张至欧洲和拉丁美洲，体现出两层地理 GTM：核心北美企业市场，以及国际扩张市场。

              渠道经济性以 2023 年 8 月推出的 STEP（Salt Technical Ecosystem Partner）计划和 CrowdStrike Marketplace 上架为锚点，后者让 Salt 接触到
              CrowdStrike 的装机基盘。CrowdStrike Falcon Fund 的战略投资和联合销售安排（2022 年 9 月）是一个重要 GTM 事件：CrowdStrike 的 Falcon
              Next-Gen SIEM 集成（2024 年末）让 Salt 能接触已经运行 CrowdStrike 的客户，从而扩大渠道 TAM。AWS Marketplace 可用性也让客户把预留容量支出用于 Salt
              合同，降低云原生买家的采购摩擦。

              公开单位经济数据很少。唯一披露的销售效率代理指标，是公司自己称 2020 年毛利率超过 90%，这意味着软件毛利润很高，但没有揭示 CAC 或 LTV。企业 API 安全交易在首年通常需要 3-9
              个月销售周期；续约周期更快。概念验证（PoC）阶段是关键摩擦点——竞品对比来源把拉长的 PoC 周期列为客户抱怨，这会影响 CAC 回本。公司没有公开披露 NRR
              或队列留存数据。公司把客户满意度和员工留存作为主要成功指标（来自 Series D 评论），这些指标滞后，而不是领先的收入效率指标。
