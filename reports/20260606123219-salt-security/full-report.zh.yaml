  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 平台定义与架构
        blocks:
          - type: paragraph
            body: >-
              Salt Security 将核心产品定位为 Salt Illuminate：一个 SaaS 交付的 API 安全平台，通过云连接器（Salt Connect）镜像 API
              流量，把数据送入旁路云数据湖，从而无代理运行。请求路径中不插入内联代理， 因此不会影响应用延迟。平台随后用行为机器学习为每个 API 建立流量基线，建模数百项属性，如参数一致性、
              请求频率、响应量、设备或地址模式，并在凭据被攻破或数据外泄前，把偏离基线的行为标记为攻击者侦察。 公司称该引擎已获专利。平台三项顶层能力是 API Discovery &
              Visibility（发现影子、僵尸、内部、 合作伙伴和公开 API）、API Posture & Compliance（将 API 映射到约 100 条预置安全规则，覆盖 PCI DSS、
              HIPAA、GDPR、SOC 2、NIST、CMMC 和 FedRAMP）以及 API Threat Detection & Protection（行为异常检测和早期阻断）。 2026 年 3 月，Salt 推出
              Agentic Security Platform，将覆盖范围扩展到 LLM、MCP 服务器和 AI 智能体流量， 底层是 Agentic Security Graph：一层上下文风险图谱，映射现代 AI
              技术栈中推理、执行和动作层之间的关系。 Salt 将其定义为从代码（GitHub Connect，2025 年 11 月）到运行时（AG-DR）保护完整智能体生命周期。 平台可用 SaaS 或本地部署，集成
              AWS、Azure、GCP 和主要 API 网关，并声称初始云连接步骤可在几分钟内完成部署。
