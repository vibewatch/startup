      年评测转向“精英中的精英”和“关键”这类表述——映射为较高分数。2024-2026 年未发布 G2 评测（距离运行日期约 2 个月空档），因此省略该列。该队列只用于说明情绪轨迹；不是具有统计显著性的 NRR 代理。
    claimRefs:
      - CU025
      - CU026
      - CU027
