      - number: '2.3'
        title: 买家分层与采用路径
        blocks:
          - type: paragraph
            body: >-
              API 安全采购主要由企业驱动。核心买方画像是年收入超过 USD 500 million、API 暴露面复杂（100+ 外部
              API）且承担受监管数据义务的组织中的首席信息安全官（CISO）或应用安全副总裁。多数采购周期里，CISO 拥有预算；AppSec 或 DevSecOps 团队负责技术评估；DevOps
              和平台工程团队是最终用户和集成负责人。

              垂直集中度较高：Salt Security 的具名客户覆盖金融服务（OneMain Financial、Berkshire Bank、City National Bank、Live Oak
              Bank、Apiture、Finastra、Icatu Seguros）、保险（Aon、Markel）、制药（Takeda）、科技 /
              SaaS（Equinix、Navan、HealthEquity、Apiture）以及能源 / 工业（BP Launchpad）。这种分布与 OWASP Top 10 威胁暴露相吻合：金融 API 承担 BOLA
              / 认证风险；医疗 API 承担数据隐私监管暴露（HIPAA、GDPR）；数字商务 API 承担业务逻辑滥用和机器人攻击风险。

              采用路径通常从发现先行开始：组织先做 API 清单和影子 API 发现（无需安装 agent），观察行为基线，再扩展到态势治理和运行时威胁检测。企业规模下的概念验证（POC）周期被指出为 3–6
              个月，这会拉长销售周期，并让已确认 ARR 相对签约额更慢释放。WAAP 套件整合（Akamai、Imperva、Cloudflare）提供了另一条采用路径：API 安全作为既有 WAF
              许可证的新增功能，而不是单独采购产品。

              预算负责人的决策框架越来越由合规驱动：PCI DSS v4.0（2025 年生效）引入 API 专项要求；针对 API 数据暴露的 GDPR 执法行动正在增加；美国 Executive Order on
              Improving the Nation's Cybersecurity（EO 14028）提高了联邦承包商在软件供应链和 API 安全上的要求。这些监管顺风把 API
              安全从可自由裁量的采购，转成受监管垂直行业中合规强制的预算项。
