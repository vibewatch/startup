      - number: '5.4'
        title: 部署模式、集成与可靠性
        blocks:
          - type: paragraph
            body: >-
              Salt 通过流量镜像无代理部署：平台接收 API 流量副本，只把元数据发送到云端 API 数据湖。 该架构保证对应用请求延迟零影响，也不需要改代码或调整架构。Salt Illuminate
              的导入向导声称，云连接 来源的完整初始部署可在几分钟内完成。AllCloud/Datadog 案例显示，Salt 自身基础设施运行在 AWS 上， 跨数百个后端实例每分钟处理数百万条消息。平台用 Kafka
              做消息队列、Kubernetes 做容器编排，并用 Datadog 做可观测性和成本优化。 集成生态覆盖 API
              网关（Kong、Apigee、MuleSoft、NGINX、Istio）、云平台（AWS、Azure、GCP、Akamai、Cloudflare、F5、Kubernetes）、 SIEM/SOAR
              与可观测性（Splunk、CrowdStrike Falcon、Microsoft Sentinel、Jira、Slack）以及 CI/CD 工具（GitHub、Docker）。 2025 年 4
              月，CrowdStrike 集成加深，在 Falcon 平台内提供闭环 API 情报。Salt 签下 3 年 AWS Enterprise Discount Program（EDP）承诺，显示其长期云基础设施依赖
              AWS。目前无法从 Salt Security 网站访问公开状态页、可用性 SLA 或事故历史； 对需要合同化可靠性承诺的企业买家，这是尽调缺口。
