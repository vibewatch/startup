          label: 清单锚定 ML 基线
        - from: n4
          to: n7
          label: 态势缺口流向开发修复
        - from: n5
          to: n6
          label: 异常触发告警和阻断
        - from: n6
          to: n7
          label: 攻击上下文输入开发加固
