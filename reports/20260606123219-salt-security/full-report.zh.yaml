  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义与边界
        blocks:
          - type: paragraph
            body: >-
              API 安全保护应用程序编程接口，覆盖发现、态势治理、运行时威胁检测和面向开发者的左移控制。该市场位于更宽的 Web Application and API
              Protection（WAAP）品类之内；Gartner 将 WAAP 定义为包括 Web 应用防火墙（WAF）、机器人防护、分布式拒绝服务（DDoS）缓解和 API 专项控制。Salt Security
              这类专用 API 安全厂商只聚焦 API 层，而既有 WAAP 厂商则把 API 防护打包进更宽的平台产品。

              纳入支出范围的包括：API 发现和资产清单工具、API 态势治理与合规平台、API 行为式运行时威胁检测、API 安全测试（DAST、模糊测试、schema 校验），以及智能体 / AI API 安全。不纳入狭义
              API 安全市场的包括传统 WAF 支出（计入 WAAP 或应用安全）、API 网关管理和开发者工具（计入 API 管理）、通用 AppSec 测试平台（SAST、SCA），以及身份与访问管理（IAM）支出。

              现状替代方案包括：企业 WAF 规则（Imperva、Akamai、F5、Cloudflare），能提供部分 API 可见性；API 网关安全策略（Kong、MuleSoft、AWS API
              Gateway）；自建 API 清单表和手工渗透测试；以及覆盖 API 有限的 SaaS 安全态势管理（SSPM）工具。这些替代方案服务的是尚未设立专用 API 安全预算项的预算。

              OWASP API Security Top 10（2023 版）锚定了买家评估解决方案时参考的风险分类。G2 的 API Security 品类要求产品必须发现并盘点 API、执行认证和
              RBAC、加密数据、记录访问活动并执行漏洞评估——这些标准定义了最低可行产品底线，也塑造采购清单。
