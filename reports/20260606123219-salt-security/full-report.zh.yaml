      - number: '5.5'
        title: 信任、安全与合规
        blocks:
          - type: paragraph
            body: >-
              Salt 的 Policy Hub 内置约 100 条态势规则，对齐 PCI DSS、HIPAA、GDPR、SOC 2、NIST、CMMC 和 FedRAMP。 这些是客户 API 的框架映射，不是 Salt
              自身平台的认证。cloudsecurity.org 技术评估将平台映射到 ISO 27001 控制项中的事件管理 （5.24–5.28）和访问控制（5.15–5.18），并指出 Salt 支持持续 API
              流量监控、异常检测、SIEM 集成， 以及用于阻断未授权访问的执行命令。UpGuard 2026 年 6 月安全评级基于外部可验证的态势检查，给 Salt Security “B” 级， 指出一项
              content-security-policy（CSP）问题，但未发现重大数据泄露历史。CrowdStrike Marketplace 简报指出，Salt 将 Salt API 情报接入 CrowdStrike
              安全生态，实现闭环保护，并与 AWS WAF 集成在边缘执行（2025 年 12 月宣布）。 Salt 尚未公开披露其自身 SaaS 平台的 SOC 2 Type II、ISO 27001 或 FedRAMP
              认证。数据处理模式——Salt 接收客户 API 流量复制出的元数据—— 形成共享责任边界：Salt 在其云数据湖处理 API 元数据，客户因此必须信任 Salt 自身对潜在敏感 API 行为数据的安全控制。
              企业安全买家通常会在尽调中追问这一信任边界，但 Salt 当前公开信任面并未回应。
