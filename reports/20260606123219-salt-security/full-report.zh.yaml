  - id: FE001
    title: Salt Illuminate 平台架构（技术栈）
    type: stack
    layout: standard
    summary: 分层展示 Salt Illuminate 平台从数据摄取到安全成效的链路。
    data:
      layers:
        - label: 集成与执行层
          detail: >-
            API
            网关（Kong、Apigee、MuleSoft、NGINX、Istio）、云平台（AWS、Azure、GCP）、SIEM/SOAR（Splunk、CrowdStrike、Sentinel）、工单（Jira、Slack）和
            CI/CD（GitHub）。执行指令发往 WAF 和网关；告警推送到 SIEM。2025 年 12 月新增 AWS WAF MCP 防护。
        - label: 流量摄取层 — Salt Connect
          detail: >-
            无代理流量镜像；云连接器在不做内联拦截的情况下拉取 API 元数据。不增加请求延迟。Salt Surface 增加外部攻击者视角的 API 扫描。GitHub Connect 增加部署前代码仓库发现。基于 AWS
            上的 Kafka/Kubernetes，每分钟处理数百万条消息。
        - label: API 数据湖与行为 ML 引擎
          detail: 云规模数据湖存储所有客户流量的 API 元数据。已获专利的行为 ML 基于数百个属性为每个 API 建立基线（参数一致性、频率、体量、设备 / 地址模式）。公司称模型持续在行业最大的 API 流量数据集上训练。
        - label: 检测、态势与智能体分析层
          detail: >-
            三个分析引擎 — Threat Detection（把异常关联到攻击者实体，生成合并告警，支持实体级阻断）、Policy Hub（按约 100 条规则评估 API 态势，覆盖 PCI、HIPAA、GDPR、SOC
            2、NIST、CMMC、FedRAMP）和 Agentic Security Graph（把 LLM、MCP 服务器和 API 映射为 AG-SPM 与 AG-DR 模块，用于智能体风险管理）。
        - label: 安全成效与 UX 层
          detail: Salt Illuminate 仪表盘提供实时 API 清单、态势缺口评分、攻击时间线、修复指引和敏感数据暴露图。Ask Pepper AI 对话界面支持自然语言调查。合规导出服务审计流程。取证分析用于事件后响应。
    approximationNotes: 层级边界综合自官方产品页、CrowdStrike 市场平台简报、AllCloud/Datadog 案例研究和 AppSec Santa 技术评测。内部微服务拓扑的精确形态未公开记录。
    claimRefs:
      - CE001
      - CE003
      - CE005
      - CE006
      - CE029
      - CE030
  - id: FE002
    title: 客户工作流 — 从 API 发现到威胁响应
    type: flow
    layout: standard
    summary: 从环境连接到 API 发现、态势治理、威胁检测和修复的端到端流程。
    data:
      nodes:
        - id: n1
          label: 连接环境
          description: 客户连接 AWS/Azure/GCP、API 网关（Kong、Apigee、MuleSoft、NGINX）和 GitHub 仓库。无代理 OAuth/连接器设置；官方称用时不到 10 分钟。
        - id: n2
          label: 自动化 API 发现
          description: Salt Connect 镜像实时流量；Salt Surface 扫描外部攻击面；GitHub Connect 扫描代码仓库。发现影子、僵尸、合作伙伴、内部和公开 API，并按端点分配风险分数。
        - id: n3
          label: API 清单与数据分类
          description: 所有 API 都带元数据入库：认证类型、数据分类（PII、PHI、支付）、环境、服务负责人、风险分数。环境变化时持续更新。
        - id: n4
          label: 态势分析
          description: Policy Hub 用约 100 条规则评估每个 API。缺口按严重性排序（严重、高、中）。合规报告可导出，用于 PCI、HIPAA、GDPR、NIST 审计。
        - id: n5
          label: 行为基线与威胁检测
          description: ML 引擎用数天 / 数周为每个 API 建立流量基线。实时监控标记异常（BOLA、撞库、数据外泄、注入）。攻击者实体在全部活动中被关联起来。
        - id: n6
          label: 告警与阻断
          description: 合并告警避免疲劳（实体级，而非交易级）。阻断命令发往 API 网关或 WAF。为 SOC 工作流创建 SIEM 和 Jira 工单。攻击时间线和取证数据可供 IR 使用。
        - id: n7
          label: 修复与开发者反馈
          description: 态势缺口和攻击者利用洞察通过集成推送给开发团队。左移：GitHub Connect 确保新 API 和 MCP 在部署前被扫描。态势漂移监控持续运行。
      edges:
        - from: n1
          to: n2
          label: 连接触发发现
