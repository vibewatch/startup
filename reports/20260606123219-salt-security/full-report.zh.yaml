          - type: callout
            title: 竞争心智下滑是主要负面信号
            body: >-
              单一分析来源（PeerSpot）称，Salt 在 API 安全买家中的心智份额从 2025 年的 13% 降至 2026 年的 7%。 若准确，这代表显著的竞争替换，可能流向
              Imperva、Akamai、42Crunch 或 Noname Security。这是单一来源、未署名指标， 无法独立验证；但叠加偏低的 G2 评价增速，值得密切监控。Salt 转向 Agentic
              Security Platform，可能就是为了在新产品类别中与这些竞争对手拉开差异。
