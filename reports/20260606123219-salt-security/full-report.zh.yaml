  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局与竞争者类型
        blocks:
          - type: paragraph
            body: >-
              Salt 面对的已不再是干净的纯 API 安全赛道。直接 API 原生厂商仍然在产品对产品评估中最重要：Akamai 收购 Noname 后、Harness 旗下
              Traceable、Cequence、Wallarm 和 42Crunch 都能讲出清晰的专用 API 安全故事。但市场边界向两个方向扩大。第一，Prisma Cloud、Cloudflare、Fastly 和
              Imperva 等更宽的 WAAP 与 CNAPP 厂商，已经把发现、防护和态势能力作为更大的应用、边缘或云安全平台的一部分来营销。第二，Kong 式网关和 DataDome
              这类机器人专家也可能吸收更窄的预算线，尤其当买家只想要验证、限流或滥用防御，而不是完整 API 安全控制平面时。


              品类也在整合。Noname 被 Akamai 吸收，Traceable 与 Harness 合并，说明 API 安全越来越通过更大的安全和交付平台分发，而不是继续停留在独立采购动作中。对 Salt
              来说，这很重要，因为买家短名单如今会把纯玩家、边缘或 WAAP 套件、CNAPP 平台以及现状控制放在同一次评估里。因此本章把市场分成四类：直接 API 原生对手、打包式 WAAP
              和云既有厂商、网关或边缘替代方案，以及既能帮助 Salt 分发、也能显示市场正在向何处收敛的合作伙伴平台。
