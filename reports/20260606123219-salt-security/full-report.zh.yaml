  - id: FI001
    title: 收入模型桥接
    type: flow
    layout: standard
    summary: Salt Security 如何把企业 API 流量保护需求转成订阅收入和毛利，从客户动作一路走到收入确认。
    data:
      nodes:
        - id: customer
          label: 企业客户
          detail: Fortune 500 / Global 500 安全团队；CISO 采购；平均 ACV $70K–$210K；API 调用量决定套餐档位。
        - id: sales
          label: 销售打法
          detail: 企业直销（CRO 牵头）+ 市场平台（AWS / CrowdStrike）；初始销售周期 3-9 个月；需要 PoC 周期。
        - id: contract
          label: 年度订阅合同
          detail: 按期确认的年度订阅；100M calls/mo 基线标价 $100K；超过阈值另收超额费；可通过市场平台消耗额度。
        - id: revenue
          label: 订阅收入（ARR）
          detail: ARR 约 $75M（2025 年中，估计）；在合同期内按期确认；多年预付款计入递延收入。
        - id: cogs
          label: 收入成本（COGS，云基础设施）
          detail: 大数据 ML/AI 引擎消耗云计算、存储和数据出站；约占订阅收入 10% 或更低（由 2020 年 >90% 毛利率信号推断）。
        - id: gross_profit
          label: 毛利
          detail: '>90% 毛利率（2020 基线）；当前毛利率未确认；行业前四分位 SaaS 安全公司 = 80–90%。'
      edges:
        - from: customer
          to: sales
          label: 通过……接触
        - from: sales
          to: contract
          label: 签约
        - from: contract
          to: revenue
          label: 按期确认
        - from: revenue
          to: cogs
          label: 由……抵扣
        - from: revenue
          to: gross_profit
          label: 减去 COGS 得到
    approximationNotes: COGS 和毛利来自 2020 年 TechCrunch 毛利率披露及 SaaS 基准；当前数据未公开。
    claimRefs:
      - CI001
      - CI014
      - CI015
      - CI023
  - id: FI002
    title: 单位经济性桥接
    type: flow
    layout: standard
    summary: 定性单位经济性流程，展示 Salt Security SaaS 客户生命周期中的已知输入、估计节点和未知缺口。
    data:
      nodes:
        - id: lead
          label: 线索 / 潜客
          detail: 大型企业的 CISO / AppSec 采购者；来自直接外呼、活动、Salt Labs 研究内容和 CrowdStrike 联合销售管线。
        - id: poc
          label: 概念验证（PoC）
          detail: 延长的 PoC 周期被提为摩擦点；通常 4-12 周；包含 API 流量接入和首次价值展示，会抬高 CAC。
        - id: close
          label: 获客
          detail: ACV $70K–$210K；通过直销或市场平台合同成交。CAC 未知；企业 SaaS 行业中位数约为 18 个月回本。
        - id: expansion
          label: 扩张 / 续约
          detail: NRR 未披露；扩张由 API 调用量增长和功能增购驱动（态势治理、Falcon SIEM）。行业前四分位 NRR = 110%+。
        - id: churn
          label: 流失风险
          detail: 未披露总流失数据；平台复杂度和高端定价被列为中端市场风险因素；企业买家价格敏感度较低。
        - id: ltv
          label: LTV（估计）
          detail: 缺少 NRR、ACV 和总流失，无法计算；考虑到企业 API 安全用例粘性强，方向上为正。
      edges:
        - from: lead
          to: poc
          label: 进入
        - from: poc
          to: close
          label: 转化为
        - from: close
          to: expansion
          label: 通过……增长
        - from: close
          to: churn
          label: 或因……退出
        - from: expansion
          to: ltv
          label: 累积为
    approximationNotes: 所有标注“未披露”或“估计”的节点，都反映公开单位经济性数据缺失。CAC、NRR 和 LTV 无法填入数值；该流程是管理层尽调访谈的定性框架。
    claimRefs:
      - CI008
      - CI012
      - CI017
      - CI033
