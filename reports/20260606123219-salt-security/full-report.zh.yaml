        - 审查智能体团队规模；确认 Salt Code 设计伙伴名单
    notes: |
      人员风险估计为定性判断；实际员工数和角色分布未公开披露。以色列研发集中度由公司创始来源推断，并由 2020 年 NoCamels 报道确认（Salt “总部位于加利福尼亚和以色列”）。
