      - number: '5.3'
        title: 智能体安全能力与 AI 原生功能
        blocks:
          - type: paragraph
            body: >-
              2025 年 9 月 CrowdStrike Fal.Con 上，Salt 发布 MCP Protect 和 Agentic AI Governance，声称这是行业首个在运行时保护跨 API 和 Model
              Context Protocol（MCP）服务器的 AI 智能体动作的方案。GitHub Connect（2025 年 11 月）把发现能力扩展到源码仓库， 用于部署前 MCP 风险评分。2026 年 3
              月，这些能力被统一进 Salt Agentic Security Platform，并新增两个安全产品类别： Agentic Security Posture Management（AG-SPM，持续发现和治理
              LLM 连接、智能体清单、MCP 服务器及其关系）和 Agentic Detection and Response（AG-DR，跨智能体驱动的 API 调用和 MCP
              交互实时检测滥用、误用和异常行为）。平台还提供 Ask Pepper AI， 这是 2025 年 12 月发布的对话助手，允许安全分析师用自然语言查询平台、调查威胁，而不必学习专用查询语法。2026 年 6
              月发布的 Salt Code，目标是把安全策略带入 AI 编程助手输出。底层概念是 Agentic Security Graph——一个安全上下文层，将 LLM（推理）、 MCP 服务器（执行）和
              API（动作）映射为相互连接的支柱；这样可以按每个智能体的实际爆炸半径排序风险， 而不是把所有智能体等同处理。Salt 2026 上半年研究（调研 327 名安全专业人士）发现，92%
              的组织在智能体环境中缺乏高级安全成熟度， 分析的攻击尝试中 99% 来自已认证来源，印证了重点应放在运行时行为防护，而不是边界阻断。
