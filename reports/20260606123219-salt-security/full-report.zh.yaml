  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 维度
      - 投资逻辑
      - 反向逻辑
      - 观点改变条件
    rows:
      - - 市场
        - API / 智能体安全 TAM 到 2030 年扩至 $5-10B；AI 智能体扩散带来结构性需求
        - 超大规模云厂商以零边际成本捆绑 API 安全；压缩 Salt 可收费的可服务市场
        - 超大规模云厂商原生功能在 OWASP Top 10 覆盖上证明达到同等水平
      - - 产品
        - 8 年行为数据集与 Salt Labs 研究构成真实 ML 护城河；Salt Code 延伸进开发流程
        - Salt Code 仍仅限早期访问；智能体转向可能无法在竞争对手前跑出 PMF；评测中提到 SIEM 集成缺口
        - Salt Code 在 GA 后 12 个月内转化 20+ 个付费客户，ACV 均超过 $100K
      - - 财务
        - Sequoia 支持，累计融资 $271M；未见陷入困境的报道；公司仍在积极招聘（2026 年推出 Salt Code）
        - ARR 未披露；2022 年以来未公布新的 ARR 里程碑；若增长停滞，现金跑道可能成问题
        - 公司公布 ARR 里程碑 >$70M，或以高于 $800M 估值完成 Series E
      - - 竞争
        - Noname / Akamai 交易验证并购退出路径；Salt 是剩余最大的独立 API 安全平台
        - Akamai（Noname）、Cloudflare、AWS、Imperva、F5 均提供竞争性 API 安全；整合正在加速
        - Salt 宣布与一级收购方建立战略合作，或启动出售流程
      - - 团队 / 治理
        - Roey Eliyahu（CEO，Forbes 30U30）、Carl Eschenbach（Alphabet / Sequoia 董事）、强以色列技术基因
        - 以色列研发集中带来地缘政治业务连续性风险；未见公开 BCP 文件
        - 公司披露以色列工程团队组织韧性计划
      - - 估值
        - 以 $450-600M 入场，风险 / 回报可自洽；Noname 可比交易支持这一区间
        - 2022 年 $1.4B 估值标记需要 10-14x ARR 倍数——当前可比组不支持
        - 新一轮融资或老股交易以 $600M+ 估值完成，证明机构在合理倍数上继续支持
    notes: 反向逻辑有公开证据支撑。投资逻辑部分依赖推断和估计市场动态，尚未用 Salt Security 的私有财务数据验证。
    claimRefs:
      - CV003
      - CV004
      - CV005
      - CV006
      - CV007
      - CV008
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 核心假设
      - 估计 ARR（2027-28）
      - 退出倍数
      - 隐含企业价值
      - 主要风险
      - 概率信号
    rows:
      - - 乐观
        - Agentic Security 在 12-18 个月内跑通 PMF；ARR 同比增长 25%+；以溢价并购退出
        - $90-110M
        - 7-8x ARR
        - $630-880M
        - 转向执行；超大规模云厂商原生功能追平
        - 低-中（25-30%）
      - - 基准
        - ARR 温和增长 10-15%；API 安全基本盘守住，Agentic 开始有牵引；按市场价并购
        - $60-70M
        - 5-6x ARR
        - $300-420M
        - 退出估值压到 $300M 以下；清算优先权瀑布使普通股归零
        - 中（45-50%）
      - - 悲观
        - ARR 停滞或下滑；Agentic Security 未跑出 PMF；困境并购或下轮降价融资
        - $40-55M
        - 3-4x ARR
        - $120-220M
        - 普通股股东没有回款；降价轮进一步稀释
        - 低-中（20-25%）
    notes: 情景概率为分析师估计，依据行业基准、可比交易和竞争动态。2027-28 年 ARR 估计基于典型 Series D 网络安全 SaaS 增长轨迹；实际 ARR 未公开披露。隐含企业价值为清算优先权瀑布前的企业价值。
