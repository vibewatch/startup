            body: >-
              每个部署 AI 智能体或 MCP 服务器的现有 Salt 客户，都有一个新的、不断扩大的攻击面，只有 AG-SPM、AG-DR 和 GitHub Connect 能覆盖。 这带来结构性增购机会：客户采用 AI
              自动化后（66% 报告 2026 年 API 增长 50%+），Salt 平台消耗应会增长，而无需获取新客户。 关键不确定性在于扩张定价是按 API、按流量还是按模块，以及 NRR
