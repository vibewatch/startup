          - type: callout
            title: 留存与集中度数据完全不透明
            body: >-
              公开资料没有 NRR、GRR、合同期限、客户数量、头部客户收入集中度或同期群数据。Salt 采用只面向企业的 GTM， 单笔交易规模可能较大，少数客户流失就可能对收入造成实质影响。一家累计融资 $271M+
              的公司只有 12 条 G2 评价和 20 条 FeaturedCustomers 引用，说明客户推荐计划参与有限；这本身也可能是留存风险信号。
