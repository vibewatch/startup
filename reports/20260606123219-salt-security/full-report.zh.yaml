      - number: '5.6'
        title: 路线图、发布节奏与开发速度
        blocks:
          - type: paragraph
            body: >-
              Salt 2025 年公开发布节奏见其 “12 Months of Innovation” 新闻稿：围绕发现、态势、运行时防护、MCP/智能体 AI 安全和对话式调查功能， 基本每月一次重大产品发布。2025
              年关键发布包括 Salt Illuminate（2025 年 6 月，统一平台品牌）、Salt Surface（2025 年 7 月， 外部攻击面扫描器）、CrowdStrike Fal.Con 上的 AI
              Agent API Security（2025 年 9 月）、GitHub Connect 和 MCP Finder （2025 年 11 月），以及 Ask Pepper AI 加 AWS WAF MCP
              保护（2025 年 12 月）。2026 年 3 月，Salt 推出 Agentic Security Platform， 带来 AG-SPM 和 AG-DR，是其迄今最大的一次架构扩展。Salt Code（AI
              编程助手安全）于 2026 年 6 月宣布。GitHub 组织（SECful）显示， 开源工具截至 2026 年 5 月仍有活跃提交，包括 Peekaboo（可视化 API
              发现扫描器，Python）、api_extractor（从源代码提取 REST API）、 apk-processor（Android APK API 提取，Go）、url_learning_v2（高性能路径模板
              trie，Java，1.2M lookups/sec）、 deployment_ai_advisor（AI 驱动的基础设施建议）和 terraform-ibm-salt-cloud-connect（IBM
              Cloud 的 Terraform 模块，2026 年 5 月更新）。 竞争心智风险：一个市场研究来源称，Salt 在 API 安全买家中的心智份额从 2025 年的 13% 降至 2026 年的 7%，
              说明在快速产品创新之外，竞争仍在侵蚀。所审阅来源均未确认 gRPC 支持，仍是证据缺口；平台明确支持 REST 和 GraphQL， 并有 WebSocket 流量镜像文档。
