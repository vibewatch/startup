  topStrengths:
    - >-
      Salt helped define the dedicated API security category and still ships credible product innovation across posture,
      runtime detection, and agentic-AI controls.
    - >-
      Public evidence supports enterprise traction, with ARR growing from roughly $48.5M in 2024 to roughly $75M in 2025
      and multiple named enterprise references.
    - >-
      The investor base is strong, with CapitalG, Sequoia, Tenaya, DFJ Growth, and Y Combinator providing durable
      strategic and signaling value.
  topRisks:
    - >-
      The 2022 $1.4B valuation appears difficult to support against current standalone API-security comparables,
      especially the discounted Noname/Akamai benchmark.
    - >-
      Salt still does not publicly disclose audited revenue, NRR/GRR, churn, customer concentration, burn, or current
      cash position.
    - >-
      Hyperscalers and WAAP incumbents increasingly bundle API-security features, which can compress standalone pricing
      and expansion economics.
    - >-
      Israeli R&D concentration introduces business-continuity and procurement-risk questions that are not fully
      addressed in public materials.
  unresolvedGaps:
    - Audited ARR/revenue, burn, cash balance, and runway as of 2026.
    - Customer count, NRR/GRR, churn, contract duration, and top-customer concentration.
    - Written business continuity planning for the Israeli R&D organization.
    - Evidence of durable paid adoption for Agentic Security and Salt Code beyond launch messaging.
