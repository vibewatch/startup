  - id: s4
    title: Cover metrics, scale markers, and disclosure posture
    body: >-
      Salt Security discloses enough to anchor a directional investment view but not enough to
      underwrite the business without management access. The most reliable cover metrics from
      public sources are: last-round valuation $1.4 billion (Feb 2022); total equity raised
      approximately $271 million; ARR approximately $48.5 million (November 2024) and
      approximately $75 million (June 2025) per the Latka database, implying roughly 54% ARR
      growth; headcount approximately 135 (Feb 2022), approximately 192 (Dec 2022), approximately
      202 (Dec 2023), and approximately 201 (Nov 2025) per LinkedIn-derived estimates.

      Customer traction signals are qualitative. The Series D press release cited 500% revenue
      growth, 300% customer base growth, and 900% growth in signed Fortune 500 and Global 500
      customers in the preceding year. Named enterprise customers include Equinix, Amway, OneMain
      Financial, Finastra, Aon, Telefónica, City National Bank, Live Oak Bank, HealthEquity,
      Navan, Takeda Pharmaceuticals, BP Launchpad, Markel, Berkshire Bank, Icatu Seguros, and
      Apiture. Absolute customer count has not been disclosed in any reviewed public source.
      Precise ARR per customer (ACV), net revenue retention, and gross margin are private and
      cannot be confirmed without management access. The company's disclosure posture is private-
      undisclosed in the standard taxonomy.
