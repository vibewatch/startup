  - id: s2
    title: Founders, leadership bench, and governance
    body: >-
      Roey Eliyahu co-founded Salt Security and serves as CEO. Before Salt, Eliyahu co-founded
      Eshkol College, a cybersecurity training institution focused on preparing graduates for
      elite IDF cybersecurity units; he also served three years in IDF cyber, culminating in a
      team-leader role. Michael Nicosia, co-founder and COO, previously served as VP of Global
      Sales at Adallom (acquired by Microsoft as part of the Cloud App Security product line),
      providing direct enterprise security sales experience.

      The executive bench grew substantially during and after the Series D. Key additions include
      Kfir Lippmann (CFO), who led finance at monday.com from 40 employees through its Nasdaq
      IPO; Matt Quarles (CRO), hired in 2023 to scale global revenue; Michael Callahan (CMO),
      former CMO at Acronis; Renee Hollinger (Chief People Officer), formerly CHRO at Reltio;
      Gilad Gruber (SVP Engineering), former CTO at Payoneer; and Yaniv Balmas (VP Research),
      who spent eight years running cyber research at Check Point before founding Salt Labs.

      Board representation reflects the investor syndicate: Tom Banahan (Tenaya Capital) joined
      after the Series A; Carl Eschenbach (Sequoia Capital) joined after the Series B; James Luo
      (CapitalG) joined as part of the Series D investment; and Haim Sadger and Ayala Peterburg
      (S Capital VC) represent the founding-era investor. This five-seat board composition with
      heavy investor representation is typical for a late-stage venture-backed company. Key-
      person dependency remains material: both co-founders are operational, Eliyahu is the
      primary public face, and Lippmann's monday.com IPO experience makes him an important
      resource for any public-market pathway.
