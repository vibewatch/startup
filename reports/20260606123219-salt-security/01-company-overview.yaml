  - id: s3
    title: Financing history, investors, and valuation
    body: >-
      Salt Security's capital formation occurred in six publicly documented rounds spanning
      2018 to 2022. The company filed a Form D with the SEC for a seed round in September 2018.
      The first disclosed-amount rounds were a $20 million Series A in June 2020, led by Tenaya
      Capital with participation from S Capital VC and Y Combinator, which brought total funding
      to roughly $30 million at that point. Six months later, Sequoia Capital led a $30 million
      Series B in December 2020, bringing the total to $60 million and adding Carl Eschenbach to
      the board. This compressed 2020 capital cadence—two rounds in six months—reflected strong
      early product-market fit and rapid revenue growth.

      In May 2021, Salt raised a $70 million Series C led by Advent International, with
      participation from Alkeon Capital, DFJ Growth, and existing investors. The Series C
      announcement cited 400% revenue growth and 160% headcount growth in the prior twelve
      months. In September 2022, CrowdStrike's Falcon Fund made a strategic investment in Salt
      Security, initiating a go-to-market partnership.

      The defining capital event was the February 2022 Series D: $140 million led by CapitalG
      (Alphabet's independent growth fund), with all existing investors participating. The round
      was filed with the SEC on 18 February 2022 (File No. 021-434118, CIK 0001753414) and
      valued Salt at $1.4 billion, securing unicorn status. The Globes report noted the company
      raised $210 million in the twelve months preceding the Series D. The stated use of Series D
      capital was to accelerate R&D, expand sales and marketing, and grow international
      operations. As of the run date, no Series E or subsequent primary round has been announced.
      Secondary-market observers (Forge, notice.co) suggest shares may trade at a discount to
      the 2022 peak valuation in current private-market transactions.
