  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: financials
      missingEvidence: Audited ARR, revenue, gross margin, net income/loss, and cash position from audited financial statements or management disclosure.
      whyItMatters: Without audited financials, investment underwriting and valuation confidence remain low; Latka ARR estimates are directional only.
      diligencePath: Request audited financial statements or management-prepared financials from Salt Security investor relations.
      relatedQuestionRefs:
        - QO016

    - type: private-evidence-only
      severity: material
      topic: debt-credit
      missingEvidence: Any debt instruments, credit facilities, or structured financing entered into after the February 2022 Series D.
      whyItMatters: Four-plus years since last equity round could indicate either strong organic cash generation or reliance on undisclosed debt financing.
      diligencePath: Request capitalization table and any debt schedule from Salt Security; check Delaware registry for UCC filings.
      relatedQuestionRefs:
        - QO012

    - type: private-evidence-only
      severity: material
      topic: governance
      missingEvidence: Shareholder agreement, voting rights, protective provisions, and liquidation preference stack for all preferred share classes; full board composition including any independent directors.
      whyItMatters: Five investor-representative board seats with dual S Capital representation could constrain founder decision-making on exit timing and terms.
      diligencePath: Request shareholder agreement, certificate of incorporation, and any side letters from counsel or investor relations.
      relatedQuestionRefs:
        - QO027
      relatedTableRefs:
        - TO002
        - TO003

    - type: private-evidence-only
      severity: material
      topic: customers
      missingEvidence: Total customer count, customer concentration (top-5 share of ARR), and net revenue retention rate.
      whyItMatters: Concentration risk and retention quality are critical underwriting metrics for a SaaS security company; without them revenue quality is unassessable.
      diligencePath: Request customer count, top-10 ACV breakdown, and NRR history from management.
      relatedQuestionRefs:
        - QO016

    - type: missing-source
      severity: minor
      topic: arr-growth
      missingEvidence: ARR benchmarks for comparable API security peers (Noname Security, Traceable, Cequence) in 2024 to 2025 to contextualize Salt's ~54% YoY growth.
      whyItMatters: Without peer ARR data, it is unclear whether Salt's growth rate is above, at, or below category average.
      diligencePath: Seek analyst reports from Gartner, Forrester, or IDC covering API security vendor revenue benchmarks.
      relatedQuestionRefs:
        - QO024

    - type: enumeration-incomplete
      severity: minor
      topic: milestone table
      missingEvidence: Pre-2020 product milestones (2016–2019 stealth period), precise seed round date and amount, and any adverse regulatory or legal events not covered in public sources.
      whyItMatters: The stealth-period development record and early customer wins are not captured in the milestone table, limiting understanding of the founding arc.
      diligencePath: Request company timeline and early customer references from management; review Israeli patent database for early filings.
      relatedTableRefs:
        - TO004
