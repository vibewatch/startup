  - id: s5
    title: Milestones, partnerships, and adverse signals
    body: >-
      Salt Security's milestone arc spans four phases: founding-era technical development
      (2016–2019), rapid capital formation and category definition (2020–2021), unicorn scaling
      and international expansion (2022), and product broadening plus ARR ramp (2023–2025).

      Significant product milestones include the company's stealth-phase launch of the
      patented C-3A Context-based API Analysis Architecture, the 2023 launch of the STEP
      (Salt Technical Ecosystem Partner) program to formalize technology integrations, the
      CrowdStrike Falcon integration announced at Fal.Con 2023, the Falcon Next-Gen SIEM
      extension in late 2024, and twelve consecutive months of product releases in 2025 that
      included GitHub Connect, MCP Finder, MCP protection for AWS WAF, and the Ask Pepper AI
      conversational assistant. The launch of Salt Labs—Salt's dedicated API security research
      unit—added publication credibility and brand authority; by its own claims, Salt Labs has
      discovered more API vulnerabilities than any other research team.

      Adverse signals are limited but material for a security company. A competitor comparison
      by Escape.tech (2025) criticized Salt's testing capabilities, noting reliance on HTTP
      header analysis over deep payload inspection and limitations in discovering unmonitored
      APIs that sit outside gateways or proxies. Akto's competitor analysis cited platform
      complexity and premium pricing as barriers for mid-market buyers. No WARN Act filings or
      publicized mass layoffs were found for Salt Security in layoffs.fyi or related trackers
      through the run date, though absolute headcount appears to have plateaued near 200 since
      late 2022. Secondary-market platform Forge lists Salt Security as actively traded with
      market activity, while noting that the displayed price may reflect discounts to the last
      primary-round valuation. The lack of a new funding round since February 2022—now over
      four years—raises a question about runway adequacy and whether the company is managing
      toward an exit or a bridge round.
