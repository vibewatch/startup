callouts:
  - calloutType: strength
    title: Category-creator advantage with enterprise traction
    body: >-
      Salt Security was the first company to build a dedicated, patented API security platform
      and has maintained market leadership through continuous product investment. Named enterprise
      logos across financial services, pharma, insurance, and digital services, plus 900% growth
      in Fortune 500/Global 500 signed customers (2022), indicate real purchasing behavior in
      regulated-industry budgets.
    claimRefs:
      - CO004
      - CO030
      - CO031

  - calloutType: risk
    title: No primary funding since February 2022
    body: >-
      Salt Security has not disclosed a new primary equity round in over four years. ARR of
      approximately $75 million (mid-2025) against total raised of approximately $271 million
      and a burn rate that is not publicly known raises questions about runway adequacy and
      whether the company is managing toward IPO, acquisition, or a bridge round. Secondary
      market trading may reflect a discount to the 2022 $1.4 billion peak valuation.
    claimRefs:
      - CO022
      - CO029
      - CO042

  - calloutType: risk
    title: Platform complexity and testing limitations cited by competitors
    body: >-
      Escape.tech and Akto have independently criticized Salt's reliance on HTTP header analysis
      over deeper payload inspection, limited proactive shadow API discovery outside gateways,
      and steep learning curve. These criticisms, while from competing vendors, echo themes from
      enterprise buyers evaluating multiple API security platforms and represent a real
      differentiation risk as the category matures.
    claimRefs:
      - CO040
      - CO041

  - calloutType: insight
    title: IDF-veteran founding team with complementary enterprise background
    body: >-
      Eliyahu's deep IDF cyber unit experience combined with Nicosia's enterprise SaaS sales
      background at Adallom (acquired by Microsoft) gave Salt Security a rare combination of
      credible technical founding and commercial go-to-market instincts from day one. This
      co-founder pairing is a recognized pattern in elite Israeli cybersecurity companies.
    claimRefs:
      - CO009
      - CO010

