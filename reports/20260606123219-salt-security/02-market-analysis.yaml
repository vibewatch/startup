  - id: TM004
    title: Growth drivers and adoption constraints
    columns:
      - Driver / Constraint
      - Direction
      - Timing
      - Implication for Salt Security
      - Diligence Ask
    rows:
      - - API proliferation (167% YoY count growth)
        - Tailwind
        - Current / ongoing
        - Expands addressable attack surface; increases urgency for discovery product
        - Confirm API count metric methodology in Salt's platform data
      - - API attack escalation (37% incident rate in 2024, up from 17% in 2023)
        - Tailwind
        - Current / accelerating
        - Raises willingness-to-pay; supports 32.5% market CAGR; creates CISO urgency
        - Validate with independent breach data (IBM Cost of a Data Breach, Verizon DBIR)
      - - Regulatory pressure (OWASP API Top 10, PCI DSS v4.0, GDPR, EO 14028)
        - Tailwind
        - PCI DSS v4.0 active since March 2025; GDPR enforcement ongoing
        - Converts API security from discretionary to compliance-mandated; accelerates regulated verticals
        - Confirm PCI DSS v4.0 API requirements language and enforcement date
      - - Agentic AI / MCP server adoption
        - Tailwind
        - Emerging 2025–2027
        - New attack surface requiring new vendor capability (prompt injection, agent auth)
        - Verify Salt's MCP protection product maturity and customer wins in agentic AI use cases
      - - Digital transformation / multi-cloud
        - Tailwind
        - Ongoing
        - More APIs per enterprise; more environments needing consistent governance
        - Assess multi-cloud coverage (AWS, Azure, GCP connector maturity) in Salt platform
      - - Low API security program maturity (7.5% advanced)
        - Constraint
        - Current; may ease as breaches accumulate
        - Limits near-term SAM; many enterprises at status-quo stage (WAF + gateway)
        - Track maturity progression in annual Salt Labs / industry surveys
      - - Long POC cycles (3–6 months reported)
        - Constraint
        - Current
        - Slows ARR recognition; compresses NTM revenue predictability; increases CAC
        - Request POC-to-close conversion rate and average sales cycle length from management
      - - WAAP bundling by incumbents (Akamai, Cloudflare, Imperva)
        - Constraint
        - Current / intensifying post-Noname acquisition
        - Compresses SAM; incumbents can offer API security at marginal cost on existing contracts
        - Assess displacement win rate against WAAP bundled deals; size of $0-incremental deals
      - - Budget competition with broader AppSec / cloud security consolidation
        - Constraint
        - Current
        - CISOs consolidating vendors; Salt competes for AppSec budget with CNAPP, SAST, SCA
        - Confirm platform extension strategy reduces single-tool risk in vendor consolidation
      - - High traffic-mirroring / logging costs
        - Constraint
        - Current
        - >-
          Escape.tech criticism indicates traffic mirroring increases logging costs;
          sensitivity to infrastructure cost for high-volume API environments
        - Assess cost impact on mid-market buyers; validate gross margin at scale with logging costs
    notes: >-
      Driver and constraint assessments based on Salt Security's 2024 State of API Security report,
