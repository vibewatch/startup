runDate: "2026-06-06"
company:
  name: Salt Security
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    The dedicated API security market is projected to reach approximately USD 3.0 billion by 2028
    at a 32.5% CAGR (MarketsandMarkets, 2023), sitting inside a much larger application security
    market estimated at USD 41 billion in 2026. Buyers are predominantly enterprise CISOs and
    AppSec teams in financial services, insurance, pharma, and digital platforms, driven by
    explosive API proliferation (167% count increase YoY per Salt Labs), escalating attack
    frequency (37% of organizations reported an API incident in 2024), and tightening regulatory
    frameworks anchored to OWASP API Security Top 10 and PCI DSS. Growth is constrained by
    immature buyer programs (only 7.5% have dedicated API testing), long evaluation cycles, and
    incumbent WAF vendors defending territory through WAAP bundling.
sections:
  - id: s1
    title: Market definition and boundary
    body: >-
      API security addresses the protection of Application Programming Interfaces across
      discovery, posture governance, runtime threat detection, and developer-facing shift-left
      controls. The market sits within the broader Web Application and API Protection (WAAP)
      category defined by Gartner to encompass web application firewalls (WAF), bot protection,
      distributed denial-of-service (DDoS) mitigation, and API-specific controls. Dedicated API
      security vendors such as Salt Security focus exclusively on the API layer, while incumbent
      WAAP vendors bundle API protections into broader platform offerings.

      Included spend covers: API discovery and inventory tools, API posture governance and
      compliance platforms, behavioral runtime threat detection for APIs, API security testing
      (DAST, fuzzing, schema validation), and agentic/AI API security. Excluded from the narrow
      API security market are traditional WAF spend (counted in WAAP or application security),
      API gateway management and developer tooling (counted in API management), general AppSec
      testing platforms (SAST, SCA), and identity and access management (IAM) spend.

      Status-quo substitutes include: enterprise WAF rules (Imperva, Akamai, F5, Cloudflare)
      that provide partial API visibility; API gateway security policies (Kong, MuleSoft, AWS
      API Gateway); homegrown API inventory spreadsheets and manual pen-testing; and SaaS
      security posture management (SSPM) tools with limited API coverage. These substitutes
      serve budgets not yet committed to a dedicated API security line item.

      The OWASP API Security Top 10 (2023 edition) anchors the risk taxonomy buyers reference
      when evaluating solutions. The G2 API Security category qualifies products that must
      discover and inventory APIs, enforce authentication and RBAC, encrypt data, log access
      activities, and perform vulnerability assessments—criteria that define the minimum viable
      product floor and shape the purchasing checklist.
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM004
      - CM005
      - CM006
    tableRefs:
      - TM001

  - id: s2
    title: Market sizing — TAM, SAM, and contradictory estimates
    body: >-
      The standalone API security market is estimated at USD 3,034 million by 2028 at a CAGR of
      32.5% (MarketsandMarkets, July 2023). This figure covers platforms and solutions,
      professional services, and managed services for API security only, and is geographically
      global. The methodology is a bottom-up vendor revenue aggregation with top-down growth
      modeling; limitations include reliance on vendor-provided data, scope creep from inclusion
      of adjacent categories, and compressed publication window relative to the run date.

      The broader application security market offers a wider addressable frame: MarketsandMarkets
      (July 2026) projects the App Security market at USD 41.16 billion in 2026 growing to
      USD 66.03 billion by 2031 at a 9.9% CAGR, of which API security is one sub-segment
      alongside SAST, DAST, SCA, container security, and mobile AppSec. API security's share of
      App Security spend is not precisely isolated but analyst notes suggest 10–15% of App
      Security budgets are earmarked for API-specific tools where programs are mature.

      Contradictory estimates are preserved: the MarketsandMarkets $3.0B by 2028 figure implies
      a 2023 base of approximately $680M (back-calculated at 32.5% CAGR), while some analyst
      summaries cited in industry press position the 2026 API security market at $3–5B. These
      divergences reflect definitional boundary differences (narrow API security vs. WAAP vs.
      full App Security), methodology (vendor revenue vs. buyer spend), and inclusion or
      exclusion of professional services. The SAM for Salt Security—focusing on large enterprise
      accounts above 1,000 employees with complex API-intensive application stacks in regulated
      verticals—cannot be precisely isolated from public sources; an evidence gap is documented.

      Industry signals corroborate demand growth: Salt's 2024 State of API Security report found
      66% of organizations manage more than 100 APIs (up from 59% in 2023), and API count grew
      167% year-on-year. The Gartner 2021 revised prediction stated that API abuses would
      constitute the most-frequent attack vector for enterprise web-application breaches. These
      data points are lagging indicators that validate market creation but do not translate
      directly to addressable revenue pools.
