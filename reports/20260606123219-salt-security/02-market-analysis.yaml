      Funnel stage values are illustrative estimates derived from stated POC cycle duration and
      WAAP bundling commentary; no independent conversion rate data is publicly available from Salt
      or other API security vendors. Values should be treated as relative proportions only.
    claimRefs:
      - CM028
      - CM029
      - CM030

callouts:
  - calloutType: insight
    title: API security is a compliance-mandate accelerant in regulated verticals
    body: >-
      PCI DSS v4.0's API-specific requirements (active March 2025) convert API security from a
      CISO discretionary purchase to a compliance-mandated line item for approximately 3 million
      merchants and processors globally. This single regulatory event materially compresses the
      status-quo substitute strategy in financial services, Salt's strongest vertical.
    claimRefs:
      - CM022
      - CM025
  - calloutType: risk
    title: Low API security program maturity limits near-term SAM capture
    body: >-
      Only 7.5% of organizations have advanced API testing and governance programs (Salt 2024),
      down from 12% in 2023. The majority of the market is still at status-quo or basic stage,
      meaning Salt's direct competition for near-term enterprise ARR is from a shrinking advanced
      segment, while mass-market conversion requires years of buyer-program maturation.
    claimRefs:
      - CM014
      - CM026
  - calloutType: risk
    title: WAAP bundling by incumbents is the primary structural constraint on dedicated API security TAM
    body: >-
      Akamai (post-Noname), Cloudflare, and Imperva can offer API discovery and basic posture
      at near-zero incremental cost on existing WAAP contracts, effectively commoditizing the
      low-end of Salt's market. Salt must win on depth of behavioral ML, agentic AI coverage,
      and developer toolchain integration to justify a standalone price premium.
    claimRefs:
      - CM031
      - CM032
      - CM033

