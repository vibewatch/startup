  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market definition and boundary
        blocks:
          - type: paragraph
            body: >-
              API security addresses the protection of Application Programming Interfaces across discovery, posture
              governance, runtime threat detection, and developer-facing shift-left controls. The market sits within the
              broader Web Application and API Protection (WAAP) category defined by Gartner to encompass web application
              firewalls (WAF), bot protection, distributed denial-of-service (DDoS) mitigation, and API-specific
              controls. Dedicated API security vendors such as Salt Security focus exclusively on the API layer, while
              incumbent WAAP vendors bundle API protections into broader platform offerings.

              Included spend covers: API discovery and inventory tools, API posture governance and compliance platforms,
              behavioral runtime threat detection for APIs, API security testing (DAST, fuzzing, schema validation), and
              agentic/AI API security. Excluded from the narrow API security market are traditional WAF spend (counted
              in WAAP or application security), API gateway management and developer tooling (counted in API
              management), general AppSec testing platforms (SAST, SCA), and identity and access management (IAM) spend.

              Status-quo substitutes include: enterprise WAF rules (Imperva, Akamai, F5, Cloudflare) that provide
              partial API visibility; API gateway security policies (Kong, MuleSoft, AWS API Gateway); homegrown API
              inventory spreadsheets and manual pen-testing; and SaaS security posture management (SSPM) tools with
              limited API coverage. These substitutes serve budgets not yet committed to a dedicated API security line
              item.

              The OWASP API Security Top 10 (2023 edition) anchors the risk taxonomy buyers reference when evaluating
              solutions. The G2 API Security category qualifies products that must discover and inventory APIs, enforce
              authentication and RBAC, encrypt data, log access activities, and perform vulnerability
              assessments—criteria that define the minimum viable product floor and shape the purchasing checklist.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
