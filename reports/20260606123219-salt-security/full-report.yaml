      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: API security is a compliance-mandate accelerant in regulated verticals
            body: >-
              PCI DSS v4.0's API-specific requirements (active March 2025) convert API security from a CISO
              discretionary purchase to a compliance-mandated line item for approximately 3 million merchants and
              processors globally. This single regulatory event materially compresses the status-quo substitute strategy
              in financial services, Salt's strongest vertical.
            calloutType: insight
