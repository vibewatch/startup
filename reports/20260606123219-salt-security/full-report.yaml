  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pricing structure
        blocks:
          - type: paragraph
            body: >-
              Salt Security's revenue model is a pure-play enterprise SaaS subscription, sold as annual contracts priced
              primarily on API call volume. The company does not publish a public pricing page; the clearest list-price
              signal comes from the AWS Marketplace listing, which sets $100,000 per year for up to 100 million API
              calls per month as a published baseline for standard enterprise deployment. The Vendr procurement database
              and third-party pricing aggregators confirm an estimated average contract value (ACV) range of
              approximately $70,000 to $210,000 annually for enterprise customers, with variance driven by call volume,
              feature set, and negotiated deployment scope.

              Beyond base subscription, the model includes overage charges when monthly API call volume exceeds
              contracted thresholds. Enterprise buyers can layer in additional capabilities such as the posture
              governance module, advanced remediation, and the CrowdStrike Falcon integration add-on. Salt Security is
              available through direct sales and through cloud marketplaces (AWS Marketplace, CrowdStrike Marketplace),
              enabling customers to draw down cloud committed-spend agreements against Salt purchases.

              Revenue is almost entirely subscription-based; professional services (integration, proof- of-concept
              delivery) appear to be a minority of total revenue based on business model description and company
              communications. A partner in the AWS Marketplace review channel described the pricing as "affordable" and
              "annual subscription fee," while noting integration support is organizational rather than software-based.
              This confirms the software-only revenue recognition model with no significant embedded services margin
              dilution. Revenue recognition follows standard SaaS ratable-over-subscription-term accounting, meaning ARR
              is recognized monthly over the contract period and multi-year prepayments would create deferred revenue.
