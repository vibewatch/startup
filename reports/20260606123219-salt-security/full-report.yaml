      - number: '4.3'
        title: Cost structure and gross margin signals
        blocks:
          - type: paragraph
            body: >-
              Salt Security is a cloud-delivered SaaS company with the cost structure typical of high- growth enterprise
              security platforms: high gross margins on software, heavy R&D and S&M investment, and limited physical
              capital requirements. The 2020 TechCrunch report is the only public gross margin data point: gross margins
              had "significantly improved to over 90%" as of June 2020. This is consistent with pure-play SaaS security
              companies of similar scale, where hosted big-data infrastructure (the core Salt differentiator) is the
              main COGS driver.

              Salt's API Protection Platform relies on a cloud-scale big-data processing engine that must ingest and
              analyze API traffic at large enterprise volumes. The stated architecture uses time-series ML/AI at cloud
              scale, implying meaningful infrastructure costs in cloud compute, storage, and data egress for enterprise
              deployments. As ARR has grown from approximately $5 million (2021) to approximately $75 million (2025),
              COGS likely increased proportionally, but the 90%+ margin baseline suggests infrastructure costs are
              well-managed relative to subscription revenue. Industry SaaS benchmarks place subscription gross margins
              at 75-85% median and 80-90% for top-quartile security SaaS companies (Benchmarkit 2025), making Salt's
              2020 figure aggressive even by top-quartile standards; current margin is unknown and may have compressed
              as infrastructure scale grew.

              Operating expenses are dominated by R&D and sales & marketing. The Series D ($140M, Feb 2022) was
              explicitly directed at increasing R&D investment and expanding sales and marketing. The company tripled
              its workforce between 2021 and 2022 (roughly 65 to 192 employees), indicating substantial S&M headcount
              investment at that period. Headcount has since plateaued near 200 employees (2022–2025), suggesting
              operating expense growth moderated after the initial Series D deployment. Capital expenditures are minimal
              for a cloud-hosted SaaS company; no manufacturing, inventory, or significant hardware capex is implied by
              the business model.
