      - number: '2.2'
        title: Market sizing — TAM, SAM, and contradictory estimates
        blocks:
          - type: paragraph
            body: >-
              The standalone API security market is estimated at USD 3,034 million by 2028 at a CAGR of 32.5%
              (MarketsandMarkets, July 2023). This figure covers platforms and solutions, professional services, and
              managed services for API security only, and is geographically global. The methodology is a bottom-up
              vendor revenue aggregation with top-down growth modeling; limitations include reliance on vendor-provided
              data, scope creep from inclusion of adjacent categories, and compressed publication window relative to the
              run date.

              The broader application security market offers a wider addressable frame: MarketsandMarkets (July 2026)
              projects the App Security market at USD 41.16 billion in 2026 growing to USD 66.03 billion by 2031 at a
              9.9% CAGR, of which API security is one sub-segment alongside SAST, DAST, SCA, container security, and
              mobile AppSec. API security's share of App Security spend is not precisely isolated but analyst notes
              suggest 10–15% of App Security budgets are earmarked for API-specific tools where programs are mature.

              Contradictory estimates are preserved: the MarketsandMarkets $3.0B by 2028 figure implies a 2023 base of
              approximately $680M (back-calculated at 32.5% CAGR), while some analyst summaries cited in industry press
              position the 2026 API security market at $3–5B. These divergences reflect definitional boundary
              differences (narrow API security vs. WAAP vs. full App Security), methodology (vendor revenue vs. buyer
              spend), and inclusion or exclusion of professional services. The SAM for Salt Security—focusing on large
              enterprise accounts above 1,000 employees with complex API-intensive application stacks in regulated
              verticals—cannot be precisely isolated from public sources; an evidence gap is documented.

              Industry signals corroborate demand growth: Salt's 2024 State of API Security report found 66% of
              organizations manage more than 100 APIs (up from 59% in 2023), and API count grew 167% year-on-year. The
              Gartner 2021 revised prediction stated that API abuses would constitute the most-frequent attack vector
              for enterprise web-application breaches. These data points are lagging indicators that validate market
              creation but do not translate directly to addressable revenue pools.
