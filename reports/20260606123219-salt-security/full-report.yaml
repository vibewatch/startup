      - number: '2.4'
        title: Growth drivers and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              Five primary growth drivers are shaping the API security market through 2028. First, API proliferation:
              the Salt 2024 report documents a 167% increase in API count year-on-year, with 66% of organizations
              managing more than 100 APIs and 67% receiving more than 10 million API requests monthly. Each new API is a
              potential attack surface that legacy tools do not cover. Second, attack escalation: 37% of survey
              respondents experienced an API security incident in the past 12 months (up from 17% in 2023), and the
              proportion with advanced API security programs declined from 12% (2023) to 7.5% (2024)—indicating supply
              of mature defenses is lagging demand from attackers.

              Third, regulatory and compliance pressure: OWASP API Security Top 10 (2023) codified risk categories that
              procurement teams now reference directly; PCI DSS v4.0 and GDPR create enforceable obligations in
              financial and healthcare verticals; and U.S. and EU AI-governance frameworks impose API-level controls for
              agentic AI workloads. Fourth, agentic AI and LLM adoption: as organizations deploy AI agents that
              communicate via Model Context Protocol (MCP) servers and REST/GraphQL APIs, the API attack surface expands
              to include prompt injection, over-permissioned agents, and unvetted third-party tool integrations—a new
              risk category that incumbent WAF and gateway vendors do not address natively. Salt's 2025 roadmap (Salt
              Illuminate, MCP protection, Ask Pepper AI) is specifically positioned on this driver.

              Fifth, digital transformation and cloud migration: multi-cloud architectures multiply the number of API
              endpoints and the number of environments requiring consistent policy enforcement; microservices
              decomposition converts monolith business logic into API-exposed services, compounding the discovery and
              governance challenge.

              Adoption constraints are material. Budget concentration limits: 7.5% of organizations have dedicated API
              testing and threat modeling programs, meaning the mass market is not yet spending on standalone API
              security tools. POC cycles of 3–6 months, deployment complexity (traffic mirroring, sensor placement, SIEM
              integration), and high logging costs (Salt's traffic-mirroring approach was criticized by Escape.tech as
              increasing logging costs) slow time-to-value and extend payback. Incumbent WAAP bundling by Akamai,
              Cloudflare, and Imperva allows large enterprise customers to address a checklist API security requirement
              at zero or near-zero incremental cost on an existing contract, reducing standalone API security deal size
              and win rates. Market consolidation (Akamai's ~$450M acquisition of Noname Security in 2024) concentrates
              channel power and credentialing in incumbent hands.
