      - number: '7.3'
        title: Israeli-Origin, Geopolitical, and Platform Dependency Risks
        blocks:
          - type: paragraph
            body: >
              Salt Security was originally incorporated as Secful, Inc. before the company’s public 2016 launch by
              Israeli Defense Forces veterans Roey Eliyahu (CEO) and Michael Nicosia (COO), and it still maintains
              active R&D operations in Israel. The conflict in the Middle East that escalated in October 2023 introduces
              business continuity risk to Salt's Israeli engineering team, potential workforce disruption, and
              sensitivity in US federal government and defense-adjacent sales channels. US government agencies and
              contractors may face scrutiny deploying security products from Israeli-origin vendors given Export
              Administration Regulations (EAR) and the broader geopolitical context. Some US government procurement
              vehicles impose origin and supply-chain verification requirements that Israeli-origin software must
              navigate.


              Platform dependency risk is material: Salt Security's platform relies on out-of-band traffic mirroring
              from third-party API gateways including Apigee, Kong, MuleSoft, and NGINX. If these gateway vendors invest
              in native security analytics—which AWS API Gateway is already doing—Salt loses its data ingestion
              advantage. Kong's API security best practices documentation now covers the same threat categories Salt
              addresses, indicating gateway vendors are positioning as security-capable. Cloud infrastructure
              concentration adds operational risk: Salt's SaaS platform depends on AWS or Azure for hosting, creating
              availability and cost dependency on hyperscalers who also compete directly through native API security
              features. Customers who migrate API gateway platforms must re-integrate Salt Security, creating churn risk
              during migrations.
            claimRefs:
              - CR013
              - CR014
              - CR015
              - CR016
              - CR017
              - CR018
