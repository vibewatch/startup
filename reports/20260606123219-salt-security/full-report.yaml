  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Competitive Pressure and Market Commoditization
        blocks:
          - type: paragraph
            body: >
              Salt Security operates in a rapidly consolidating API security market where hyperscalers and CDN platforms
              now offer native API protection features that compete directly with Salt's standalone offering. Cloudflare
              launched API Abuse Detection in 2021, AWS API Gateway provides throttling, authorization, and request
              validation natively, and Akamai completed the acquisition of Noname Security—Salt's primary purpose-built
              competitor—in 2024 for approximately $450 million. Akamai in 2026 announced its intent to acquire LayerX
              for AI usage control, signaling continued platform expansion. These moves represent aggressive platform
              consolidation that compresses the addressable premium market for standalone API security vendors and
              creates long-term margin pressure.


              An independent competitor comparison by Escape.tech (2025) states that frustration among security
              professionals with Salt Security has been mounting due to proof-of-concept cycles that take months and
              findings described as not actionable. G2 reviews (12 total, average 4.7 stars) note that the product is
              "still relatively new and missing quite a few bells and whistles" and that SIEM logging integrations lack
              native action logging. The enterprise sales cycle for Salt Security's platform is inherently long; if
              hyperscalers continue improving native API security capabilities, buyers may opt for good-enough bundled
              offerings rather than best-in-class point solutions. Wallarm, Akto, Imperva, F5, and Escape represent
              additional competitive vectors from specialized or bundled players.


              The Noname/Akamai exit at approximately $450 million against an estimated prior private mark of $1
              billion-plus signals that the API security market has not attracted the premium acquisition multiples
              anticipated at the 2022 venture peak. This is the most directly comparable public datapoint for valuing
              Salt Security's standalone API security business.
            claimRefs:
