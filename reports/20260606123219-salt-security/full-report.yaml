      - - Cap table and waterfall
        - Current cap table, preference terms, and liquidation waterfall model at $300M, $450M, $600M exits
        - Common shareholder recovery is zero below ~$271M cumulative preference; critical for return modeling
        - Request cap table from company; model preference stack with legal/financial advisors
      - - Agentic Security traction
        - Signed pilot agreements or LOIs for Salt Code / Agentic Security product as of mid-2026
        - Pivot thesis requires PMF evidence; early-access only status is insufficient for investment conviction
        - Request design partner list; conduct reference calls with early-access organizations
    notes: >-
      Diligence asks are prioritized by materiality. Items 1 (ARR) and 2 (BCP) are minimum necessary before any
      investment decision. Items 3-5 are required for full conviction.
