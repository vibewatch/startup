      - number: '7.2'
        title: Regulatory, Legal, and Privacy Obligations
        blocks:
          - type: paragraph
            body: >
              Salt Security's core business requires monitoring and analyzing live API traffic, which inevitably
              processes personally identifiable information transmitted in API payloads. This creates ongoing GDPR,
              CCPA, and other privacy-law compliance obligations. Salt Security's Privacy Policy (updated March 2024)
              acknowledges collection and processing of customer API traffic data that may contain personal data, and
              commits to GDPR Article 28 data processing agreements with enterprise customers operating in the EU. GDPR
              violations can result in fines of up to 4% of total worldwide annual turnover or €20 million, whichever is
              greater, creating material financial exposure.


              The California Consumer Privacy Act imposes opt-out and deletion obligations and allows civil fines of up
              to $7,500 per intentional violation. The SEC's 2023 cybersecurity disclosure rules (effective December
              2023, Release 33-11216) require public company customers to report material cybersecurity incidents within
              four business days and disclose risk management governance annually, creating downstream compliance
              documentation demands on Salt Security as a security vendor of record. The FTC enforces data security
              standards broadly under Section 5, and NIST Cybersecurity Framework 2.0 (released 2024) has become the de
              facto US enterprise security standard that enterprise customers and Salt's platform must align with.


              IP litigation risk is present: the API security space has seen patent assertions across the WAAP and API
              monitoring landscape, and Salt's proprietary machine-learning methods for behavioral analysis could
              attract patent challenges from larger incumbents with broader portfolios.
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
