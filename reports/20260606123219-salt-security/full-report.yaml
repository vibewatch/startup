      - number: '8.3'
        title: Bull, Base, and Bear Scenario Analysis
        blocks:
          - type: paragraph
            body: >
              The bull case assumes Salt Security achieves $80-100M ARR by 2027-2028, successfully transitions a
              meaningful portion of its customer base to Agentic Security with premium pricing, and attracts an M&A
              offer from a hyperscaler or enterprise security platform at 7-8x forward ARR. At $80M ARR and a 7x
              multiple, the implied enterprise value is $560 million; at $100M ARR and an 8x multiple, it is $800
              million. A bull case exit would represent a 40-57% recovery from the 2022 $1.4B mark and would yield
              neutral to positive returns for Series C investors (who paid approximately $1 per share on $68M of
              capital) but likely negative returns for Series D investors (who paid approximately $1.4B per share
              equivalent). The bull case requires: Agentic Security achieving material paid ARR within 12-18 months, no
              major enterprise customer churn to hyperscalers, and Israeli R&D continuity.


              The base case assumes ARR grows modestly (10-15% per year) to $60-70M by 2027, the Agentic Security pivot
              achieves early adoption but not breakout growth, and Salt Security exits via M&A to a CDN or enterprise
              security acquirer at 5x ARR, yielding approximately $300-350M. Under this scenario, Series D investors
              (who paid approximately $1.4B) would face a 75-80% loss on the enterprise value, with common shareholders
              receiving minimal proceeds after preference liquidation.


              The bear case assumes API security commoditization accelerates, the Agentic Security pivot fails to
              achieve product-market fit, ARR growth stalls below 10%, and Salt Security is forced into a distressed M&A
              at 3x ARR ($150-200M) or a down round that further dilutes common holders. A bear case exit at $150-200M
              would likely yield zero proceeds to common shareholders and partial recovery for Series B/C investors.
            claimRefs:
              - CV017
              - CV018
              - CV019
              - CV020
              - CV023
              - CV024
              - CV025
              - CV026
