      - number: '7.4'
        title: Financial, Funding, and Execution Risks
        blocks:
          - type: paragraph
            body: >
              Salt Security raised $140 million in its Series D round in January 2022 at a $1.4 billion valuation—near
              the peak of private technology valuations. Total funding stands at approximately $271 million across four
              rounds (SEC Form D filings). Since 2022, SaaS ARR multiples for private cybersecurity companies have
              compressed significantly. No Series E or subsequent financing has been publicly announced between the
              Series D and the June 2026 run date, suggesting the company is operating within Series D runway, has
              reached profitability, or has been unable to raise at acceptable terms. Any new funding round in the
              current environment could require accepting a down round or a below-2022 valuation. The company's
              cumulative liquidation preference stack at $271 million raised means a below-$400 million exit would
              likely leave common shareholders with minimal or zero proceeds.


              The June 2026 launch of "Salt Code" in early access for the first 100 organizations represents a
              significant strategic pivot to "Agentic Security"—securing AI agents, MCP servers, and APIs. This pivot
              requires new product development investment, retooled go-to-market, and customer re-education. Agentic AI
              security is a nascent market with unclear buyer definitions and pricing norms; competing frameworks from
              LLM security vendors (CrowdStrike, Palo Alto Networks, Wiz) also claim the agentic security space. If the
              pivot does not succeed, Salt remains exposed to a contracting pure-play API security market where
              hyperscalers are eroding premium ASPs.
            claimRefs:
              - CR019
              - CR020
              - CR021
              - CR022
