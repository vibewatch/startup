  - id: FE002
    title: Customer workflow — API discovery to threat response
    type: flow
    layout: standard
    summary: >-
      End-to-end flow from environment connection through API discovery, posture governance, threat detection, and
      remediation.
    data:
      nodes:
        - id: n1
          label: Connect Environment
          description: >-
            Customer connects AWS/Azure/GCP, API gateways (Kong, Apigee, MuleSoft, NGINX), GitHub repos. Agentless
            OAuth/connector setup; under 10 minutes per official claims.
        - id: n2
          label: Automated API Discovery
          description: >-
            Salt Connect mirrors live traffic; Salt Surface scans external attack surface; GitHub Connect scans code
            repos. Shadow, zombie, partner, internal, and public APIs are discovered. Risk scores assigned per endpoint.
        - id: n3
          label: API Inventory & Data Classification
          description: >-
            All APIs catalogued with metadata: authentication type, data classification (PII, PHI, payment),
            environment, service owner, risk score. Continuous updates as environment evolves.
        - id: n4
          label: Posture Analysis
          description: >-
            Policy Hub evaluates each API against ~100 rules. Gaps ranked by severity (Critical, High, Medium).
            Compliance reports exported for PCI, HIPAA, GDPR, NIST audits.
        - id: n5
          label: Behavioral Baseline & Threat Detection
          description: >-
            ML engine establishes per-API traffic baseline over days/weeks. Real-time monitoring flags anomalies (BOLA,
            credential stuffing, exfiltration, injection). Attacker entity correlated across all activity.
        - id: n6
          label: Alert & Block
          description: >-
            Consolidated alert avoids fatigue (entity-level, not transaction-level). Block command sent to API gateway
            or WAF. SIEM and Jira tickets created for SOC workflow. Attack timeline and forensic data available for IR.
        - id: n7
          label: Remediation & Developer Feedback
          description: >-
            Posture gaps and attacker exploitation insights surfaced to dev teams via integrations. Shift-left: GitHub
            Connect ensures new APIs and MCPs are scanned before deployment. Posture drift monitoring continues.
      edges:
        - from: n1
          to: n2
          label: Connect triggers discovery
        - from: n2
          to: n3
          label: Discovered APIs enter inventory
        - from: n3
          to: n4
          label: Inventory feeds posture engine
        - from: n3
          to: n5
          label: Inventory anchors ML baseline
        - from: n4
          to: n7
          label: Posture gaps routed to dev remediation
        - from: n5
          to: n6
          label: Anomaly triggers alert and block
        - from: n6
          to: n7
          label: Attack context feeds developer hardening
    approximationNotes: null
    claimRefs:
      - CE002
      - CE010
      - CE011
      - CE016
      - CE017
      - CE018
  - id: FE003
