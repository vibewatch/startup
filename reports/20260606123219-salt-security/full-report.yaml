      - number: '5.2'
        title: Core modules — discovery, posture, and threat protection
        blocks:
          - type: paragraph
            body: >-
              API Discovery is delivered through three complementary data paths: Salt Connect (agentless connectors
              pulling metadata from AWS, Azure, GCP, Kong, Apigee, MuleSoft, NGINX, and Istio via traffic mirroring),
              Salt Surface (external attack-surface scanner that maps public-facing APIs from an adversary's
              perspective), and GitHub Connect (code-repository scanner launched November 2025 that identifies APIs and
              MCP server configurations in source before deployment). Together these three paths address the industry
              limitation Salt's own research identified: CDN-based single-source discovery misses an estimated 30.7% of
              APIs. The Posture Management engine, centered on the Policy Hub, ships with approximately 100 pre-loaded
              rules and allows custom rule authoring. Salt's 2025 State of API Security Report found only 10% of
              enterprises have deployed an API posture governance strategy, which frames the Policy Hub as an
              early-mover advantage. The Threat Detection engine uses behavioral ML baselines to detect BOLA/IDOR,
