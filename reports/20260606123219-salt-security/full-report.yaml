            body: >-
              Salt Security uses an enterprise direct-sales motion supplemented by a channel program. The direct-sales
              team, led by CRO Matt Quarles (hired in 2023), focuses on CISO and application-security buyers at Fortune
              500 and Global 500 accounts. The company has expanded into Europe and Latin America since 2021, reflecting
              a two-tier geographic GTM: the core North American enterprise market and international expansion markets.

              Channel economics are anchored by the STEP (Salt Technical Ecosystem Partner) program launched in August
              2023 and the CrowdStrike Marketplace listing, which gives Salt access to CrowdStrike's installed base. The
              CrowdStrike Falcon Fund strategic investment and co-sell arrangement (September 2022) is a material GTM
              event: CrowdStrike's Falcon Next- Gen SIEM integration (late 2024) expands the channel TAM by allowing
              Salt to reach customers already running CrowdStrike. AWS Marketplace availability also lets customers
              apply reserved-capacity spend toward Salt contracts, reducing procurement friction for cloud-native
              buyers.

              Public unit-economics data are sparse. The only disclosed sales efficiency proxy is the company's own
              claim of 90%+ gross margins (2020), which implies high software gross profit but does not reveal CAC or
              LTV. Enterprise API security deals typically run 3-9 month sales cycles in the initial year; renewal
              cycles are faster. Proof-of-concept (PoC) periods are a critical friction point — competitor comparison
              sources note extended PoC timelines as a customer complaint, which affects CAC payback. No NRR or cohort
              retention data has been publicly disclosed. The company targets customer satisfaction and employee
              retention as its primary success metrics (per Series D commentary), which are lagging rather than leading
