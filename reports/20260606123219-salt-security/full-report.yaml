      - number: '4.5'
        title: Capital adequacy, financing dependency, and financial verdict
        blocks:
          - type: paragraph
            body: >-
              Salt Security's last primary equity event was the $140 million Series D in February 2022, confirmed by SEC
              Form D (File No. 021-434118). With ARR growing from approximately $48.5 million (late 2024) to
              approximately $75 million (mid-2025), and assuming the company manages toward cash-flow break-even at
              scale consistent with the 90%+ gross margin baseline, the Series D capital should theoretically support
              operations through at least 2025-2026 depending on burn rate. However, burn rate is not disclosed: a
              200-person enterprise security company with heavy R&D and S&M investment typical of the API security
              sector could plausibly run at $3-8 million per month in operating expenses, implying remaining runway of
              12-36 months from the Series D deployment window. These are estimates only.

              No Series E or subsequent debt/credit facility has been publicly announced as of the June 2026 run date.
              Secondary-market observations from Forge Global and notice.co suggest shares trade at potential discounts
              to the $1.4 billion 2022 primary-round valuation. The combination of four-plus years without a primary
              round, plateaued headcount, and improving ARR (if the Latka figures are directional) could indicate
              either: (a) strong organic cash generation approaching break-even, making a new round unnecessary; or (b)
              difficulty accessing capital at the $1.4 billion reference valuation, leading to runway management.
              Without audited financials, both scenarios are consistent with public evidence.

              Financial verdict: Salt Security has a high-quality SaaS revenue model (annual subscriptions, enterprise
              ACV, 90%+ gross margin baseline), strong ARR growth signals (~54% YoY), and adequate historical capital.
              The primary financial diligence blockers are the absence of audited financials, unknown burn and runway,
              unknown NRR and CAC payback, and the unresolved capital structure question (no post-2022 primary round).
              Revenue quality is assessed as medium-high given the enterprise subscription model and named Fortune 500
              logos, but cannot be underwritten without management financial access.
