  - id: FE001
    title: Salt Illuminate platform architecture (stack)
    type: stack
    layout: standard
    summary: Layered view of the Salt Illuminate platform from data ingestion through security outcomes.
    data:
      layers:
        - label: Integrations & Enforcement Layer
          detail: >-
            API gateways (Kong, Apigee, MuleSoft, NGINX, Istio), cloud platforms (AWS, Azure, GCP), SIEM/SOAR (Splunk,
            CrowdStrike, Sentinel), ticketing (Jira, Slack), and CI/CD (GitHub). Enforcement commands sent to WAF and
            gateway; alerts pushed to SIEM. AWS WAF MCP protection added December 2025.
        - label: Traffic Ingestion Layer — Salt Connect
          detail: >-
            Agentless traffic mirroring; cloud connectors pull API metadata without inline interception. Zero added
            request latency. Salt Surface adds external adversary-perspective API scanning. GitHub Connect adds
            pre-deployment code-repository discovery. Processes millions of messages per minute on Kafka/Kubernetes on
            AWS.
        - label: API Data Lake & Behavioral ML Engine
          detail: >-
            Cloud-scale data lake stores API metadata for all customer traffic. Patented behavioral ML establishes
            per-API baselines across hundreds of attributes (parameter consistency, frequency, volume, device/address
            patterns). Trains continuously on the industry's largest API traffic dataset per company claim.
        - label: Detection, Posture & Agentic Analysis Layer
          detail: >-
            Three analytical engines — Threat Detection (correlates anomalies to attacker entities, generates
            consolidated alerts, enables entity-level blocking), Policy Hub (evaluates API posture against approx. 100
            rules across PCI, HIPAA, GDPR, SOC 2, NIST, CMMC, FedRAMP), and Agentic Security Graph (maps LLMs, MCP
            servers, and APIs as AG-SPM and AG-DR modules for agentic risk management).
        - label: Security Outcomes & UX Layer
          detail: >-
            Salt Illuminate dashboard with live API inventory, posture gap scoring, attack timelines, remediation
            guidance, and sensitive-data exposure maps. Ask Pepper AI conversational interface for natural-language
            investigation. Compliance export for audit workflows. Forensic analytics for post-incident response.
    approximationNotes: >-
      Layer boundaries synthesized from official product pages, CrowdStrike marketplace brief, AllCloud/Datadog case
      study, and AppSec Santa technical review. Exact internal microservice topology is not publicly documented.
    claimRefs:
      - CE001
