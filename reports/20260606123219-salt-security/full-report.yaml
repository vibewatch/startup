            posture governance are primary entry points.
        - id: seg-retail
          label: Retail / E-commerce
          description: >-
            DeinDeal. API-driven customer journeys with PII and transaction data. API discovery and sensitive-data
            tracking are primary value drivers.
        - id: seg-mfg
          label: Manufacturing / Industrial Software
          description: >-
            Siemens, Hyundai. Enterprise digital transformation with growing agentic AI adoption. AG-SPM and AG-DR are
            primary entry points for 2026 cohort.
        - id: seg-healthcare
          label: Healthcare / Medical Devices
          description: >-
            Stryker. HIPAA-aligned API posture governance and PHI tracking in API traffic. Compliance-first buying
            motion.
        - id: stage-eval
          label: 'Evaluation: Free API scan or POC'
          description: >-
            Salt offers a free external API surface scan via salt.security as a no-commitment entry point.
            Under-10-minute cloud-connect setup enables rapid POC.
        - id: stage-deploy
          label: 'Initial Deployment: Salt Connect + Discovery'
          description: >-
            Customer connects cloud accounts and API gateways. Within minutes, first API inventory and risk scores are
            available. Shadow and zombie API discovery is the early AHA moment.
        - id: stage-posture
          label: 'Posture Governance: Policy Hub'
          description: >-
            Customer adopts Policy Hub rules across PCI, HIPAA, GDPR, NIST, CMMC, FedRAMP. Compliance export and audit
            support drive renewal justification.
        - id: stage-protect
          label: 'Runtime Protection: Behavioral ML'
          description: >-
            Platform baselines traffic over weeks and begins detecting anomalies. SOC team integrates alerts into
            Splunk/CrowdStrike workflow. Entity-level blocking deployed.
        - id: stage-expand
          label: 'Expansion: Agentic Security + GitHub Connect'
