  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >
              The investment thesis for Salt Security rests on four pillars: (1) a large and growing API and agentic
              security market ($5-10 billion total addressable market by 2030), (2) an eight-year behavioral dataset and
              ML models that hyperscalers cannot quickly replicate, (3) a well-timed pivot to Agentic Security ahead of
              the incumbent security platforms, and (4) Sequoia Capital sponsorship and a board that includes Carl
              Eschenbach (Alphabet) providing governance quality and enterprise network access. The Noname/Akamai
              acquisition at approximately $450 million validates M&A interest in API security platforms from CDN and
              cloud players.


              The anti-thesis is equally material: (1) Salt Security's $1.4 billion 2022 valuation was set at peak
              venture market conditions and now faces a 40-60% implied discount based on the Noname comparable; (2) ARR
              is undisclosed, making it impossible to verify whether the company's financial trajectory supports the
              2022 mark; (3) hyperscalers (Cloudflare, AWS, Akamai) are bundling API security at zero marginal cost to
              existing customers, compressing Salt's available ASP and TAM; and (4) the Agentic Security pivot is
              early-access with no external adoption metrics, creating a simultaneous cannibalization risk to the
              existing API security base and execution risk in the new category. Customer proof-of-concept cycles
              reportedly take months, and G2 reviews highlight product gaps in SIEM integration.


              On balance, the thesis is not broken but requires substantially more evidence before a confident positive
              decision is supportable. The investment thesis depends critically on (a) demonstrating ARR growth above
              15% per year despite competitive pressure, (b) the Agentic Security pivot achieving a paying customer base
              within 12-18 months, and (c) business continuity robustness for the Israeli R&D team.
            claimRefs:
