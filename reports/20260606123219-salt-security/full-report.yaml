      - number: '5.3'
        title: Agentic security capabilities and AI-native features
        blocks:
          - type: paragraph
            body: >-
              At CrowdStrike Fal.Con in September 2025 Salt introduced MCP Protect and Agentic AI Governance—the
              industry's first claimed solution to secure AI agent actions across APIs and Model Context Protocol (MCP)
              servers at runtime. GitHub Connect (November 2025) extended discovery into source-code repositories for
              pre-deployment MCP risk scoring. In March 2026 these capabilities were unified as the Salt Agentic
              Security Platform, which adds two new security product categories: Agentic Security Posture Management
              (AG-SPM, continuous discovery and governance of LLM connectivity, agent inventories, MCP servers, and
              their relationships) and Agentic Detection and Response (AG-DR, real-time detection of abuse, misuse, and
              anomalous behavior across agent-driven API calls and MCP interactions). The platform also ships Ask Pepper
              AI, a conversational assistant announced December 2025 that allows security analysts to query the platform
              in natural language and investigate threats without learning bespoke query syntax. Salt Code, announced
              June 2026, aims to carry security policy into AI coding-assistant outputs. The underlying concept is the
              Agentic Security Graph—a security context layer mapping LLMs (reasoning), MCP servers (execution), and
              APIs (action) as interconnected pillars, so risk can be prioritized by the actual blast radius of each
              agent rather than treating all agents as equivalent. Salt's 1H 2026 research (327 security professionals
              surveyed) found 92% of organizations lack advanced security maturity for agentic environments and 99% of
              attack attempts analyzed originate from authenticated sources, validating the focus on behavioral runtime
              protection rather than perimeter blocking.
