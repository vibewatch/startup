      - number: '8.2'
        title: Financing Context and Valuation Evidence
        blocks:
          - type: paragraph
            body: >
              Salt Security has raised approximately $271 million in four SEC Form D-documented rounds: an early round
              (~$11M, 2018), Series B ($30M led by Sequoia, 2020), Series C (~$68M, 2021), and Series D ($124M closed at
              $1.4B post-money, January 2022). No Series E or public secondary transaction has been identified as of the
              June 2026 run date. The company is incorporated in Delaware (as Salt Security, Inc., formerly Secful Inc.)
              and is headquartered in Palo Alto, California. The preference overhang from $271M raised at progressive
              liquidation terms means a below-$400 million exit could result in zero or minimal common stockholder
              proceeds under typical full-ratchet or participating preferred terms.


              Public evidence on Salt Security's current financial health is limited. The company has not disclosed ARR,
              revenue run rate, or burn rate. No data breach, public complaint, or enforcement action has been
              identified. Agentic Security is the current product positioning (as of June 2026), with Salt Code launched
              in early access for the first 100 enterprise organizations. The company's blog is active (most recent post
              June 2026). The absence of an ARR milestone announcement in 2024-2025 raises questions about growth
              trajectory.


              Against this opacity, the Noname/Akamai acquisition at approximately $450M in 2024 is the most relevant
              public datapoint. Noname raised approximately $220 million and was last privately valued at over $1
              billion; the acquisition price represented a 40-60% haircut to its private mark. If Salt Security faces a
              similar discount path, the implied fair value range would be $560-840 million (a 40-60% discount from the
              $1.4B mark). A full-cycle M&A premium to Noname's price would imply $600M-$900M, still below the 2022
              mark.
            claimRefs:
              - CV009
              - CV010
              - CV013
              - CV014
              - CV015
