  - id: FU001
    title: Customer segments, adoption surfaces, and expansion loops
    type: journey-map
    layout: wide
    summary: >-
      Maps Salt Security's enterprise customer segments through the adoption lifecycle from initial discovery to
      full-platform expansion.
    data:
      nodes:
        - id: seg-fintech
          label: FinTech / Financial Services
          description: >-
            SoFi, Standard Bank Group. High-value APIs processing financial transactions. Compliance (PCI DSS, GDPR)
