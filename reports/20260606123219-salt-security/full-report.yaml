      - number: '5.4'
        title: Deployment model, integrations, and reliability
        blocks:
          - type: paragraph
            body: >-
              Salt deploys agentlessly via traffic mirroring: the platform receives a copy of API traffic and sends only
              metadata to its cloud-based API data lake. This architecture ensures zero impact on application request
              latency and requires no code changes or architectural modifications. The onboarding wizard for Salt
              Illuminate claims full initial deployment in minutes for cloud-connect sources. Salt's own infrastructure
              runs on AWS and processes several million messages per minute across hundreds of backend instances, as
              documented in the AllCloud/Datadog case study. The platform uses Kafka as its message queue and Kubernetes
              for container orchestration, with Datadog for observability and cost optimization. Integration ecosystem
              covers API gateways (Kong, Apigee, MuleSoft, NGINX, Istio), cloud platforms (AWS, Azure, GCP, Akamai,
              Cloudflare, F5, Kubernetes), SIEM/SOAR and observability (Splunk, CrowdStrike Falcon, Microsoft Sentinel,
              Jira, Slack), and CI/CD tooling (GitHub, Docker). The CrowdStrike integration deepened in April 2025 to
              provide closed-loop API intelligence in the Falcon platform. Salt entered a 3-year AWS Enterprise Discount
              Program (EDP) commitment, signaling long-term cloud-infrastructure dependency on AWS. No public status
              page, uptime SLA, or incident history is currently accessible from the Salt Security website, which is a
              diligence gap for enterprise buyers requiring contractual reliability assurances.
            claimRefs:
