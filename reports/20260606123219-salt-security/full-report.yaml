      - number: '8.4'
        title: Comparable Valuation Set and Market Context
        blocks:
          - type: paragraph
            body: >
              The private API security M&A comp set is thin but anchored by the Noname/Akamai transaction. Public
              security SaaS companies provide secondary benchmarks, though most are larger, more diversified, or at
              different stages of profitability than Salt Security. The key insight from the comp set is that standalone
              API security platforms do not command premium acquisition multiples unless they have achieved substantial
              scale ($150M+ ARR) or are acquired for their patent portfolio or customer base by a strategic acquirer.
              Salt Security at an estimated $50-80M ARR range would fall well below the scale threshold that drives
              premium M&A pricing.


              Private SaaS cybersecurity companies that raised at 2022 peak valuations have generally faced 40-60%
              valuation compression in the 2023-2026 private market. Cross-stage comparisons suggest cybersecurity SaaS
              companies at $50-80M ARR with 20-30% growth are trading at 5-8x ARR in 2025-2026 secondary markets. At
              Salt Security's estimated ARR range of $50-80M, a 5-7x ARR multiple implies an enterprise value of
              $250-560M, which brackets the Noname comp ($450M) and suggests the 2022 $1.4B mark requires 10-14x ARR to
              be realized—a multiple not currently supported by the comparable set. The Agentic Security pivot, if
              successful, could unlock a platform premium, but the market has not yet priced agentic AI security
              separately from API security.
            claimRefs:
              - CV021
              - CV022
              - CV023
              - CV027
              - CV028
              - CV029
              - CV030
          - type: table
            tableRef: TV004
            claimRefs:
