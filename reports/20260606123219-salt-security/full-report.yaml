      - number: '8.5'
        title: Exit Readiness, Diligence Asks, and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >
              Salt Security's exit readiness is moderate. M&A exit to a CDN, cloud, or enterprise security acquirer is
              the most likely path, with Akamai, Cloudflare, CrowdStrike, Palo Alto Networks, and Google as potential
              strategic acquirers. The Noname/Akamai transaction establishes that CDN players are willing to acquire API
              security assets. IPO readiness is low: ARR scale, profitability path, and the agentic pivot's unproven
              nature make public market readiness a 3-5 year timeline at best. Secondary market liquidity is an option
              for existing investors but at unknown prices, likely below the 2022 mark.


              Final diligence must address: (1) actual ARR, ARR growth rate, and NRR to size the business and validate
              the 5-7x multiple range; (2) Israeli team headcount and business continuity documentation; (3) copies of
              key GDPR Article 28 data processing agreements and SOC2 Type II certification; (4) cap table and
              preference waterfall modeling at $300M, $450M, and $600M exit prices; (5) evidence of Agentic Security
              paying customers or signed pilot agreements.


              The thesis-break triggers for Salt Security are: ARR declining or growing below 10% YoY; a major customer
              publicly citing a hyperscaler for API security replacement; failure to announce any paying Agentic
              Security customer within 12 months of Salt Code GA; Israeli R&D disruption of more than three months; any
              regulatory enforcement action; or a new financing round at below $600M pre-money valuation.
            claimRefs:
              - CV031
              - CV032
              - CV033
              - CV034
              - CV035
              - CV036
