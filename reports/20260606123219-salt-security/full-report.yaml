      - number: '2.3'
        title: Buyer segmentation and adoption path
        blocks:
          - type: paragraph
            body: >-
              API security buying is predominantly enterprise-led. The primary buyer persona is the Chief Information
              Security Officer (CISO) or VP of Application Security at organizations with annual revenues above USD 500
              million, complex API surface areas (100+ external APIs), and regulated data obligations. The CISO owns the
              budget in most procurement cycles; the AppSec or DevSecOps team is the technical evaluator; DevOps and
              platform engineering teams are the end users and integration owners.

              Vertical concentration is high: Salt Security's named customer set spans financial services (OneMain
              Financial, Berkshire Bank, City National Bank, Live Oak Bank, Apiture, Finastra, Icatu Seguros), insurance
              (Aon, Markel), pharmaceutical (Takeda), technology/SaaS (Equinix, Navan, HealthEquity, Apiture), and
              energy/industrial (BP Launchpad). This distribution mirrors the OWASP Top 10 threat exposure: financial
              APIs carry BOLA/authentication risk; healthcare APIs carry data-privacy regulatory exposure (HIPAA, GDPR);
              digital commerce APIs carry business-logic abuse and bot-attack risk.

              The adoption path typically follows a discovery-first motion: organizations begin with API inventory and
              shadow API discovery (no agent required), observe behavioral baselines, then expand to posture governance
              and runtime threat detection. The proof-of-concept (POC) cycle has been noted as 3–6 months at enterprise
              scale, which lengthens sales cycles and compresses recognized ARR relative to bookings. Platform
              consolidation toward WAAP bundles (Akamai, Imperva, Cloudflare) creates an alternative adoption path where
              API security is added to an existing WAF license rather than purchased as a standalone product.

              The budget owner's decision frame is increasingly compliance-driven: PCI DSS v4.0 (effective 2025)
              introduces API-specific requirements; GDPR enforcement actions for API data exposures are rising; the U.S.
              Executive Order on Improving the Nation's Cybersecurity (EO 14028) elevated software supply-chain and API
              security for federal contractors. These regulatory tailwinds convert API security from a discretionary to
              a compliance-mandated budget line item in regulated verticals.
            claimRefs:
