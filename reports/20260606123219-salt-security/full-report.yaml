chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product scope, and corporate structure
        blocks:
          - type: paragraph
            body: >-
              Salt Security was founded in 2016 by IDF cybersecurity veterans Roey Eliyahu (CEO) and Michael Nicosia
              (COO), with the company’s early operating roots in Israel before scaling into its current Palo Alto
              headquarters. The company was originally registered under the name Secful before rebranding to Salt
              Security as it emerged from stealth with a commercial API protection platform. Salt Security is
              incorporated in Delaware, maintains its headquarters in Palo Alto, and concentrates its research and
              development in Tel Aviv, Israel, operating a dual-hub model common among Israeli cybersecurity companies.

              The company's core offering is the Salt Security API Protection Platform, a cloud-delivered SaaS solution
              that combines cloud-scale big data processing with machine learning and artificial intelligence to provide
              three integrated capabilities: automated API discovery (including shadow and zombie APIs), behavioral
              runtime threat detection, and developer- facing posture governance. Salt markets itself as the first
              vendor to have built a dedicated, patented API security platform, framing the company as the category
              creator. As of mid-2025, the platform had been extended to cover agentic AI security, MCP server
              protection, and conversational security investigation via "Ask Pepper AI."

              Salt Security targets enterprise security teams, CISOs, and application-security practitioners at large
              organizations running complex, API-intensive application stacks. The company positions its product as a
              complement to API gateways, WAFs, and SIEM platforms rather than a replacement, reflected in its
              CrowdStrike Falcon and AWS WAF integrations. Stage is Series D / late-stage private; no IPO has been
              announced as of the run date.
