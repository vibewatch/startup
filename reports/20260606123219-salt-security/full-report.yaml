      - number: '7.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Commoditization is the single highest-severity thesis risk
            body: >
              Hyperscaler and CDN platform API security bundling by Cloudflare, AWS, and Akamai/Noname is the
              highest-severity risk facing Salt Security. If large incumbents achieve feature parity at zero marginal
              cost to existing CDN/cloud customers, Salt's price premium disappears and growth stalls. The Noname/Akamai
              acquisition at ~$450M versus Noname's ~$1B+ private mark is the most important forward valuation
              benchmark.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR022
          - type: callout
            title: GDPR and CCPA compliance exposure is structural, not incidental
            body: >
              Salt Security's business model requires processing API traffic that contains PII. This is not an edge
              case; it is the core of the product. The March 2024 privacy policy update acknowledges this and commits to
              GDPR Article 28 DPAs, but enforcement risk remains ongoing. Any failure to maintain DPA compliance with EU
              customers creates existential regulatory risk.
            calloutType: risk
            claimRefs:
              - CR007
              - CR008
              - CR009
          - type: callout
            title: Obtain BCP documentation and executed DPAs before any investment decision
            body: >
              Two items are non-negotiable for diligence: (1) a written business continuity plan for the Israeli R&D
              team covering escalated conflict scenarios; and (2) copies of executed GDPR Article 28 data processing
              agreements from representative EU enterprise customers. Both are material risk factors that cannot be
              assessed without primary documentation.
            calloutType: recommendation
            claimRefs:
