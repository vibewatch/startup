      - number: '7.5'
        title: Mitigations, Kill Criteria, and Monitoring Indicators
        blocks:
          - type: paragraph
            body: >
              Salt Security's primary mitigations for competitive risk include its agentic security pivot repositioning
              it in the high-growth AI security space ahead of larger incumbents, and its eight-year API traffic
              behavioral dataset that provides a data moat hyperscalers cannot quickly replicate. The Noname/Akamai
              acquisition validates the strategic M&A exit path even if at a discount to 2022 marks. For regulatory and
              privacy risk, Salt's March 2024 privacy policy update and stated GDPR data processing agreement commitment
              are partial structural mitigations. Sequoia Capital's involvement (Carl Eschenbach on the board since
              Series B) provides governance quality and network access that reduces the risk of adverse capital events.


              Key thesis-break triggers include: ARR growth falling below 15% year-on-year; evidence of an Israeli R&D
              workforce disruption exceeding three months; any GDPR or FTC enforcement action against Salt; failure of
              Salt Code to demonstrate material external adoption within 12 months of general availability; a new
              financing round at below $800 million pre-money valuation; or loss of a marquee enterprise customer to a
              hyperscaler bundled alternative. An M&A exit at or above $600 million would represent a partial thesis
              recovery from the 2022 mark; an exit below $300 million would constitute a thesis break for Series D
              investors.
            claimRefs:
              - CR025
