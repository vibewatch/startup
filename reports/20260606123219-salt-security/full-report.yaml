              - CV039
              - CV040
      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Research More — Entry discipline requires 30-50% discount to 2022 mark
            body: >
              Salt Security is not a pass—the TAM, moat, and Sequoia pedigree support continued monitoring. But a buy
              recommendation at the 2022 $1.4B mark is not supportable given: undisclosed ARR, the Noname acquisition
              comp ($450M), compressed private multiples, and the unproven Agentic Security pivot. A defensible entry
              point is $600-800M enterprise value, contingent on ARR above $70M with 15%+ growth and Israeli R&D
              business continuity documentation in hand.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV009
              - CV021
          - type: callout
            title: Preference stack means common holders are at risk below $400M exit
            body: >
              With approximately $271M raised at progressive liquidation terms, the preference waterfall means common
              shareholders (including founders and employees on options) receive zero proceeds at exit prices below
              approximately $400M under full-ratchet or 1x participating preferred terms. Investors entering at the 2022
              mark face an implied 70%+ loss under the base case scenario.
            calloutType: risk
            claimRefs:
              - CV009
              - CV010
              - CV020
          - type: callout
            title: Noname/Akamai sets the valuation floor, not the ceiling
            body: >
              The $450M Noname acquisition is the most important recent datapoint for Salt Security's valuation. It
              should be read as a floor indicator with a strategic premium already embedded (Akamai paid for bundle
              value). A pure financial buyer or a less motivated strategic would likely pay below the Noname comp. Salt
              Security's Agentic Security repositioning is the only credible path to a premium above the Noname floor.
            calloutType: insight
            claimRefs:
              - CV021
              - CV022
              - CV006
