  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: revenue financials
      missingEvidence: Audited revenue, ARR, gross margin (current), net income/loss, cash position, and burn rate from audited financial statements or management disclosure.
      whyItMatters: These are the minimum inputs for SaaS investment underwriting; without them the $1.4B valuation cannot be assessed against current fundamentals.
      diligencePath: Request audited P&L, balance sheet, and cash flow statement from investor relations; cross-reference with Series D-era audit if available.
      relatedQuestionRefs:
        - QI019
        - QI025
        - QI028

    - type: private-evidence-only
      severity: blocking
      topic: unit economics table
      missingEvidence: Net revenue retention (NRR), gross dollar retention (GDR), CAC, LTV, and payback period; these are the standard SaaS unit-economics underwriting inputs.
      whyItMatters: Without NRR and CAC payback, it is impossible to determine whether Salt's ARR growth is driven by expansion within existing accounts (high quality) or net-new logo acquisition at elevated cost.
      diligencePath: Request quarterly NRR history, gross churn rate, new-logo CAC by cohort, and payback period from management.
      relatedQuestionRefs:
        - QI006
        - QI008
        - QI024
      relatedTableRefs:
        - TI003

    - type: private-evidence-only
      severity: material
      topic: public financial gaps table
      missingEvidence: Customer count, top-10 ACV concentration, and deferred revenue balance; needed to assess revenue concentration risk and multi-year commitment quality.
      whyItMatters: SaaS companies with concentrated customer bases (e.g., top-3 = >30% ARR) carry material churn risk if any anchor customers re-evaluate.
      diligencePath: Request customer count, top-10 ACV list, and deferred revenue balance sheet line from management.
      relatedQuestionRefs:
        - QI016
        - QI030
      relatedTableRefs:
        - TI005

    - type: private-evidence-only
      severity: material
      topic: capital adequacy
      missingEvidence: Actual monthly burn rate, current cash and cash equivalents, and any debt or credit facility entered into post-Series D.
      whyItMatters: Four years without a primary round is unusual for a $1.4B-valued company not yet profitable; actual runway determines urgency of next financing or exit event.
      diligencePath: Request trailing 12-month operating cash flow, current bank balance, and any credit facility terms from management.
      relatedQuestionRefs:
        - QI018
        - QI019
        - QI025

    - type: missing-source
      severity: minor
      topic: pricing risk
      missingEvidence: Independent analyst pricing comparison of Salt Security against Noname Security, Traceable AI, Cequence Security, and AWS native API Gateway security tiers.
      whyItMatters: If competitor pricing has compressed below Salt's $100K baseline, future ACV may face downward pressure.
      diligencePath: Seek Gartner Magic Quadrant for API Security or Forrester Wave report with pricing tier comparisons.
      relatedQuestionRefs:
        - QI026
