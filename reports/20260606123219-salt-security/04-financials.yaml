          label: offset by
        - from: revenue
          to: gross_profit
          label: minus COGS yields
    approximationNotes: >-
      COGS and gross profit are derived from the 2020 TechCrunch gross-margin disclosure and SaaS
      benchmarks; current figures are not publicly available.
