callouts:
  - calloutType: strength
    title: High-quality SaaS subscription model with enterprise ACV
    body: >-
      Annual subscription pricing anchored to API call volume, enterprise ACVs of $70K–$210K,
      and 90%+ gross margin (2020 disclosure) indicate a high-quality recurring revenue business.
      The AWS Marketplace and CrowdStrike Marketplace channels reduce procurement friction and
      allow customers to draw on committed cloud spend, supporting deal velocity.
    claimRefs:
      - CI001
      - CI002
      - CI014

  - calloutType: risk
    title: No audited financials and no new primary round in 4+ years
    body: >-
      Salt Security's last primary equity event was the February 2022 Series D. With ARR at
      approximately $75 million (unaudited, Latka) and no public cash-position disclosure, the
      company's runway and path to break-even are unresolvable without management access. Secondary-
      market signals suggest potential valuation discount versus the 2022 $1.4 billion mark.
    claimRefs:
      - CI027
      - CI028
      - CI030

  - calloutType: risk
    title: Unit economics entirely private
    body: >-
      NRR, CAC payback, gross churn, deferred revenue, and net income are not publicly disclosed.
      The company's self-described success metrics (customer satisfaction and employee retention)
      are lagging indicators that do not substitute for underwriting-grade financial data.
      Without these inputs, revenue quality cannot be confirmed beyond the directional ARR signal.
    claimRefs:
      - CI016
      - CI017
      - CI034

  - calloutType: insight
    title: CrowdStrike Marketplace channel as a capital-light GTM multiplier
    body: >-
      The CrowdStrike Falcon Fund investment (2022), Falcon Platform integration (2023), and
      Falcon Next-Gen SIEM extension (2024) create a distribution channel that leverages
      CrowdStrike's installed enterprise base without requiring proportional S&M headcount
      growth. This channel reduces marginal CAC for new logos reached through the CrowdStrike
      pipeline and could be a meaningful driver of the ARR growth observed in 2024–2025.
    claimRefs:
      - CI009
      - CI010
      - CI011

