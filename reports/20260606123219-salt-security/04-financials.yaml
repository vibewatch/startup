figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    layout: standard
    summary: >-
      How Salt Security converts enterprise API traffic protection needs into subscription
      revenue and gross profit, from customer activity through revenue recognition.
    data:
      nodes:
        - id: customer
          label: Enterprise customer
          detail: >-
            Fortune 500 / Global 500 security team; CISO buyer; average ACV $70K–$210K;
            API call volume determines tier.
        - id: sales
          label: Sales motion
          detail: >-
            Direct enterprise sales (CRO-led) + marketplace (AWS / CrowdStrike); 3-9 month
            initial sales cycle; PoC period required.
        - id: contract
          label: Annual subscription contract
          detail: >-
            Ratable annual subscription; $100K list for 100M calls/mo baseline; overages above
            threshold; marketplace draw-down option.
        - id: revenue
          label: Subscription revenue (ARR)
          detail: >-
            ~$75M ARR (mid-2025, est.); recognized ratably over contract term; deferred revenue
            on multi-year prepayments.
        - id: cogs
          label: COGS (cloud infrastructure)
          detail: >-
            Cloud compute, storage, data egress for big-data ML/AI engine; ~10% or less of
            subscription revenue (implied by >90% gross margin signal, 2020).
        - id: gross_profit
          label: Gross profit
          detail: >-
            >90% gross margin (2020 baseline); current margin unconfirmed; industry top-quartile
            SaaS security = 80–90%.
