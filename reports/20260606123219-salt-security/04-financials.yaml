company:
  name: Salt Security
chapter:
  number: 4
  title: Financials
  summary: >-
    Salt Security operates a cloud-delivered, enterprise SaaS API security platform monetized
    through annual subscriptions priced on API call volume, with a list price of approximately
    $100,000 per year for 100 million API calls per month on the AWS Marketplace. Third-party
    data (Latka) puts ARR at approximately $48.5 million in late 2024 and approximately $75
    million by mid-2025 (~54% YoY growth). The company disclosed gross margins above 90% in
    2020; current unit economics are private. Total equity raised is approximately $271 million
    across six rounds through February 2022; no subsequent primary round has been announced,
    creating a four-plus-year runway question that is the primary capital-adequacy diligence item.
sections:
  - id: s1
    title: Revenue model and pricing structure
    body: >-
      Salt Security's revenue model is a pure-play enterprise SaaS subscription, sold as annual
      contracts priced primarily on API call volume. The company does not publish a public pricing
      page; the clearest list-price signal comes from the AWS Marketplace listing, which sets
      $100,000 per year for up to 100 million API calls per month as a published baseline for
      standard enterprise deployment. The Vendr procurement database and third-party pricing
      aggregators confirm an estimated average contract value (ACV) range of approximately
      $70,000 to $210,000 annually for enterprise customers, with variance driven by call volume,
      feature set, and negotiated deployment scope.

      Beyond base subscription, the model includes overage charges when monthly API call volume
      exceeds contracted thresholds. Enterprise buyers can layer in additional capabilities such
      as the posture governance module, advanced remediation, and the CrowdStrike Falcon
      integration add-on. Salt Security is available through direct sales and through cloud
      marketplaces (AWS Marketplace, CrowdStrike Marketplace), enabling customers to draw down
      cloud committed-spend agreements against Salt purchases.

      Revenue is almost entirely subscription-based; professional services (integration, proof-
      of-concept delivery) appear to be a minority of total revenue based on business model
      description and company communications. A partner in the AWS Marketplace review channel
      described the pricing as "affordable" and "annual subscription fee," while noting integration
      support is organizational rather than software-based. This confirms the software-only revenue
      recognition model with no significant embedded services margin dilution. Revenue recognition
      follows standard SaaS ratable-over-subscription-term accounting, meaning ARR is recognized
      monthly over the contract period and multi-year prepayments would create deferred revenue.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI005
      - CI006
    tableRefs:
      - TI001
      - TI002
    figureRefs:
      - FI001

  - id: s2
    title: GTM motion and sales efficiency proxies
    body: >-
      Salt Security uses an enterprise direct-sales motion supplemented by a channel program.
      The direct-sales team, led by CRO Matt Quarles (hired in 2023), focuses on CISO and
      application-security buyers at Fortune 500 and Global 500 accounts. The company has
      expanded into Europe and Latin America since 2021, reflecting a two-tier geographic GTM:
      the core North American enterprise market and international expansion markets.

      Channel economics are anchored by the STEP (Salt Technical Ecosystem Partner) program
      launched in August 2023 and the CrowdStrike Marketplace listing, which gives Salt access
      to CrowdStrike's installed base. The CrowdStrike Falcon Fund strategic investment and
      co-sell arrangement (September 2022) is a material GTM event: CrowdStrike's Falcon Next-
      Gen SIEM integration (late 2024) expands the channel TAM by allowing Salt to reach
      customers already running CrowdStrike. AWS Marketplace availability also lets customers
      apply reserved-capacity spend toward Salt contracts, reducing procurement friction for
      cloud-native buyers.

      Public unit-economics data are sparse. The only disclosed sales efficiency proxy is the
      company's own claim of 90%+ gross margins (2020), which implies high software gross profit
      but does not reveal CAC or LTV. Enterprise API security deals typically run 3-9 month sales
      cycles in the initial year; renewal cycles are faster. Proof-of-concept (PoC) periods are
      a critical friction point — competitor comparison sources note extended PoC timelines as a
      customer complaint, which affects CAC payback. No NRR or cohort retention data has been
      publicly disclosed. The company targets customer satisfaction and employee retention as its
      primary success metrics (per Series D commentary), which are lagging rather than leading
      revenue-efficiency indicators.
    claimRefs:
      - CI007
      - CI008
      - CI009
      - CI010
      - CI011
      - CI012
      - CI013
    figureRefs:
      - FI002

  - id: s3
    title: Cost structure and gross margin signals
    body: >-
      Salt Security is a cloud-delivered SaaS company with the cost structure typical of high-
      growth enterprise security platforms: high gross margins on software, heavy R&D and S&M
      investment, and limited physical capital requirements. The 2020 TechCrunch report is the
      only public gross margin data point: gross margins had "significantly improved to over 90%"
      as of June 2020. This is consistent with pure-play SaaS security companies of similar
      scale, where hosted big-data infrastructure (the core Salt differentiator) is the main
      COGS driver.

      Salt's API Protection Platform relies on a cloud-scale big-data processing engine that
      must ingest and analyze API traffic at large enterprise volumes. The stated architecture
      uses time-series ML/AI at cloud scale, implying meaningful infrastructure costs in cloud
      compute, storage, and data egress for enterprise deployments. As ARR has grown from
      approximately $5 million (2021) to approximately $75 million (2025), COGS likely increased
      proportionally, but the 90%+ margin baseline suggests infrastructure costs are well-managed
      relative to subscription revenue. Industry SaaS benchmarks place subscription gross margins
      at 75-85% median and 80-90% for top-quartile security SaaS companies (Benchmarkit 2025),
      making Salt's 2020 figure aggressive even by top-quartile standards; current margin is
      unknown and may have compressed as infrastructure scale grew.

      Operating expenses are dominated by R&D and sales & marketing. The Series D ($140M, Feb
      2022) was explicitly directed at increasing R&D investment and expanding sales and
      marketing. The company tripled its workforce between 2021 and 2022 (roughly 65 to 192
      employees), indicating substantial S&M headcount investment at that period. Headcount has
      since plateaued near 200 employees (2022–2025), suggesting operating expense growth
      moderated after the initial Series D deployment. Capital expenditures are minimal for a
      cloud-hosted SaaS company; no manufacturing, inventory, or significant hardware capex is
      implied by the business model.
    claimRefs:
      - CI014
      - CI015
      - CI016
      - CI017
      - CI018
      - CI019
    tableRefs:
      - TI003

  - id: s4
    title: Public traction metrics and private-data gaps
    body: >-
      The available public financial picture for Salt Security is narrow relative to investment
      underwriting requirements. Confirmed or well-sourced metrics include: ARR approximately
      $48.5 million (November 2024) and approximately $75 million (June 2025) per Latka; total
      equity raised approximately $271 million (last confirmed Feb 2022 via SEC Form D); last
      round valuation $1.4 billion (Feb 2022). These are the only numeric revenue-related data
      points with meaningful sourcing.

      Company-claimed traction from the February 2022 Series D press release includes 500%
      revenue growth, 300% customer base growth, and 900% growth in signed Fortune 500/Global 500
      customers in the preceding 12 months. If the 2022 growth numbers are directionally accurate,
      and the 2020 ARR was approximately $5 million (implied by Latka's 2021 figure of $4.9
      million), then the 2022 ARR trajectory would have placed Salt at approximately $20-30
      million post-Series D. The Latka $48.5 million figure for late 2024 implies slower growth
      in 2022-2024 than the hyperscale 2020-2022 period. This is consistent with the broader
      API security market maturing and with Salt plateauing its headcount at ~200 employees
      (suggesting deliberate expense management or a period of investment digestion).

      Materially absent from public disclosure: absolute customer count, customer concentration
      (top-5 ARR share), net revenue retention rate, gross dollar churn, average contract value
      (ACV) distribution, deferred revenue, cash and cash equivalents, net income/loss, and
      burn rate. These are standard underwriting inputs for a SaaS company that cannot be
      reconstructed from public sources. The company's disclosure posture is private-undisclosed.
    claimRefs:
      - CI020
      - CI021
      - CI022
      - CI023
      - CI024
      - CI025
      - CI026
    tableRefs:
      - TI005

  - id: s5
    title: Capital adequacy, financing dependency, and financial verdict
    body: >-
      Salt Security's last primary equity event was the $140 million Series D in February 2022,
      confirmed by SEC Form D (File No. 021-434118). With ARR growing from approximately
      $48.5 million (late 2024) to approximately $75 million (mid-2025), and assuming the company
      manages toward cash-flow break-even at scale consistent with the 90%+ gross margin baseline,
      the Series D capital should theoretically support operations through at least 2025-2026
      depending on burn rate. However, burn rate is not disclosed: a 200-person enterprise
      security company with heavy R&D and S&M investment typical of the API security sector
      could plausibly run at $3-8 million per month in operating expenses, implying remaining
      runway of 12-36 months from the Series D deployment window. These are estimates only.

      No Series E or subsequent debt/credit facility has been publicly announced as of the
      June 2026 run date. Secondary-market observations from Forge Global and notice.co suggest
      shares trade at potential discounts to the $1.4 billion 2022 primary-round valuation.
      The combination of four-plus years without a primary round, plateaued headcount, and
      improving ARR (if the Latka figures are directional) could indicate either: (a) strong
      organic cash generation approaching break-even, making a new round unnecessary; or (b)
      difficulty accessing capital at the $1.4 billion reference valuation, leading to runway
      management. Without audited financials, both scenarios are consistent with public evidence.

      Financial verdict: Salt Security has a high-quality SaaS revenue model (annual subscriptions,
      enterprise ACV, 90%+ gross margin baseline), strong ARR growth signals (~54% YoY), and
      adequate historical capital. The primary financial diligence blockers are the absence of
      audited financials, unknown burn and runway, unknown NRR and CAC payback, and the
      unresolved capital structure question (no post-2022 primary round). Revenue quality is
      assessed as medium-high given the enterprise subscription model and named Fortune 500
      logos, but cannot be underwritten without management financial access.
    claimRefs:
