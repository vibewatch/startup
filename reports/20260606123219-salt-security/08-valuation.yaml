runDate: "2026-06-06"
company:
  name: Salt Security
chapter:
  number: 8
  title: Valuation
  summary: >
    Salt Security's 2022 Series D $1.4 billion mark is the anchor for all valuation analysis, but it
    sits in direct tension with the Noname Security acquisition benchmark (~$450M against a ~$1B prior
    mark), compressed private SaaS multiples, undisclosed ARR, and an unproven pivot to Agentic
    Security. The recommendation is Research More: the valuation thesis requires ARR evidence,
    business continuity assurance, and a demonstrated Agentic Security go-to-market before a
    confident investment decision can be made. Risk rating is High; valuation stance is Stretched.

sections:
  - id: thesis-antithesis
    title: Investment Thesis and Anti-Thesis
    body: >
      The investment thesis for Salt Security rests on four pillars: (1) a large and growing API
      and agentic security market ($5-10 billion total addressable market by 2030), (2) an
      eight-year behavioral dataset and ML models that hyperscalers cannot quickly replicate,
      (3) a well-timed pivot to Agentic Security ahead of the incumbent security platforms, and
      (4) Sequoia Capital sponsorship and a board that includes Carl Eschenbach (Alphabet) providing
      governance quality and enterprise network access. The Noname/Akamai acquisition at approximately
      $450 million validates M&A interest in API security platforms from CDN and cloud players.


      The anti-thesis is equally material: (1) Salt Security's $1.4 billion 2022 valuation was set
      at peak venture market conditions and now faces a 40-60% implied discount based on the Noname
      comparable; (2) ARR is undisclosed, making it impossible to verify whether the company's
      financial trajectory supports the 2022 mark; (3) hyperscalers (Cloudflare, AWS, Akamai) are
      bundling API security at zero marginal cost to existing customers, compressing Salt's available
      ASP and TAM; and (4) the Agentic Security pivot is early-access with no external adoption
      metrics, creating a simultaneous cannibalization risk to the existing API security base and
      execution risk in the new category. Customer proof-of-concept cycles reportedly take months,
      and G2 reviews highlight product gaps in SIEM integration.


      On balance, the thesis is not broken but requires substantially more evidence before a
      confident positive decision is supportable. The investment thesis depends critically on
      (a) demonstrating ARR growth above 15% per year despite competitive pressure, (b) the
      Agentic Security pivot achieving a paying customer base within 12-18 months, and (c)
      business continuity robustness for the Israeli R&D team.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV006, CV007, CV008, CV011, CV012]
    tableRefs: [TV002]
    figureRefs: [FV001]

  - id: financing-valuation-context
    title: Financing Context and Valuation Evidence
    body: >
      Salt Security has raised approximately $271 million in four SEC Form D-documented rounds:
      an early round (~$11M, 2018), Series B ($30M led by Sequoia, 2020), Series C (~$68M, 2021),
      and Series D ($124M closed at $1.4B post-money, January 2022). No Series E or public
      secondary transaction has been identified as of the June 2026 run date. The company is
      incorporated in Delaware (as Salt Security, Inc., formerly Secful Inc.) and is headquartered
      in Palo Alto, California. The preference overhang from $271M raised at progressive liquidation
      terms means a below-$400 million exit could result in zero or minimal common stockholder
      proceeds under typical full-ratchet or participating preferred terms.


      Public evidence on Salt Security's current financial health is limited. The company has
      not disclosed ARR, revenue run rate, or burn rate. No data breach, public complaint, or
      enforcement action has been identified. Agentic Security is the current product positioning
      (as of June 2026), with Salt Code launched in early access for the first 100 enterprise
      organizations. The company's blog is active (most recent post June 2026). The absence of
      an ARR milestone announcement in 2024-2025 raises questions about growth trajectory.


      Against this opacity, the Noname/Akamai acquisition at approximately $450M in 2024 is the
      most relevant public datapoint. Noname raised approximately $220 million and was last
      privately valued at over $1 billion; the acquisition price represented a 40-60% haircut
      to its private mark. If Salt Security faces a similar discount path, the implied fair value
      range would be $560-840 million (a 40-60% discount from the $1.4B mark). A full-cycle M&A
      premium to Noname's price would imply $600M-$900M, still below the 2022 mark.
    claimRefs: [CV009, CV010, CV013, CV014, CV015, CV016, CV021, CV022]
    tableRefs: [TV001]
    figureRefs: [FV004]

  - id: scenarios
    title: Bull, Base, and Bear Scenario Analysis
    body: >
      The bull case assumes Salt Security achieves $80-100M ARR by 2027-2028, successfully
      transitions a meaningful portion of its customer base to Agentic Security with premium
      pricing, and attracts an M&A offer from a hyperscaler or enterprise security platform
      at 7-8x forward ARR. At $80M ARR and a 7x multiple, the implied enterprise value is
      $560 million; at $100M ARR and an 8x multiple, it is $800 million. A bull case exit
      would represent a 40-57% recovery from the 2022 $1.4B mark and would yield neutral to
      positive returns for Series C investors (who paid approximately $1 per share on $68M of
      capital) but likely negative returns for Series D investors (who paid approximately $1.4B
      per share equivalent). The bull case requires: Agentic Security achieving material paid
      ARR within 12-18 months, no major enterprise customer churn to hyperscalers, and Israeli
      R&D continuity.


      The base case assumes ARR grows modestly (10-15% per year) to $60-70M by 2027, the
      Agentic Security pivot achieves early adoption but not breakout growth, and Salt Security
      exits via M&A to a CDN or enterprise security acquirer at 5x ARR, yielding approximately
      $300-350M. Under this scenario, Series D investors (who paid approximately $1.4B) would
      face a 75-80% loss on the enterprise value, with common shareholders receiving minimal
      proceeds after preference liquidation.


      The bear case assumes API security commoditization accelerates, the Agentic Security
      pivot fails to achieve product-market fit, ARR growth stalls below 10%, and Salt Security
      is forced into a distressed M&A at 3x ARR ($150-200M) or a down round that further
      dilutes common holders. A bear case exit at $150-200M would likely yield zero proceeds
      to common shareholders and partial recovery for Series B/C investors.
    claimRefs: [CV017, CV018, CV019, CV020, CV023, CV024, CV025, CV026]
    tableRefs: [TV003]
    figureRefs: [FV003]

  - id: comparable-valuations
    title: Comparable Valuation Set and Market Context
    body: >
      The private API security M&A comp set is thin but anchored by the Noname/Akamai transaction.
      Public security SaaS companies provide secondary benchmarks, though most are larger, more
      diversified, or at different stages of profitability than Salt Security. The key insight from
      the comp set is that standalone API security platforms do not command premium acquisition
      multiples unless they have achieved substantial scale ($150M+ ARR) or are acquired for their
      patent portfolio or customer base by a strategic acquirer. Salt Security at an estimated
      $50-80M ARR range would fall well below the scale threshold that drives premium M&A pricing.


      Private SaaS cybersecurity companies that raised at 2022 peak valuations have generally
      faced 40-60% valuation compression in the 2023-2026 private market. Cross-stage comparisons
      suggest cybersecurity SaaS companies at $50-80M ARR with 20-30% growth are trading at
      5-8x ARR in 2025-2026 secondary markets. At Salt Security's estimated ARR range of $50-80M,
      a 5-7x ARR multiple implies an enterprise value of $250-560M, which brackets the Noname
      comp ($450M) and suggests the 2022 $1.4B mark requires 10-14x ARR to be realized—a multiple
      not currently supported by the comparable set. The Agentic Security pivot, if successful,
      could unlock a platform premium, but the market has not yet priced agentic AI security
      separately from API security.
    claimRefs: [CV021, CV022, CV023, CV027, CV028, CV029, CV030]
    tableRefs: [TV004]
    figureRefs: [FV002]

  - id: exit-diligence-triggers
    title: Exit Readiness, Diligence Asks, and Thesis-Break Triggers
    body: >
      Salt Security's exit readiness is moderate. M&A exit to a CDN, cloud, or enterprise security
      acquirer is the most likely path, with Akamai, Cloudflare, CrowdStrike, Palo Alto Networks,
      and Google as potential strategic acquirers. The Noname/Akamai transaction establishes that
      CDN players are willing to acquire API security assets. IPO readiness is low: ARR scale,
      profitability path, and the agentic pivot's unproven nature make public market readiness a
      3-5 year timeline at best. Secondary market liquidity is an option for existing investors
      but at unknown prices, likely below the 2022 mark.


      Final diligence must address: (1) actual ARR, ARR growth rate, and NRR to size the business
      and validate the 5-7x multiple range; (2) Israeli team headcount and business continuity
      documentation; (3) copies of key GDPR Article 28 data processing agreements and SOC2 Type II
      certification; (4) cap table and preference waterfall modeling at $300M, $450M, and $600M
      exit prices; (5) evidence of Agentic Security paying customers or signed pilot agreements.


      The thesis-break triggers for Salt Security are: ARR declining or growing below 10% YoY;
      a major customer publicly citing a hyperscaler for API security replacement; failure to
      announce any paying Agentic Security customer within 12 months of Salt Code GA; Israeli
      R&D disruption of more than three months; any regulatory enforcement action; or a new
      financing round at below $600M pre-money valuation.
    claimRefs: [CV031, CV032, CV033, CV034, CV035, CV036, CV037, CV038, CV039, CV040]
    tableRefs: [TV005, TV006]
    figureRefs: []

