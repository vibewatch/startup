callouts:
  - calloutType: insight
    title: Inverted Pricing Model as Customer Acquisition Engine
    body: Wave disrupted incumbent telecom mobile money providers across West Africa by eliminating fees on account creation, cash deposits, peer-to-peer transfers, and utility bill payments, monetizing exclusively via a 1% fee on agent cash withdrawals. While this radical fee transparency drove adoption to over 21 million accounts, it creates an operational dependency on cash-out volumes that faces margin compression as digital payment rails mature.
    claimRefs:
      - CO001
      - CO004
      - CO009
      - CO012
  - calloutType: risk
    title: Regulatory Interoperability and Regional Competitive Headwinds
    body: Wave's operational moat relies on managing liquidity across more than 100,000 physical agent locations and holding direct BCEAO e-money licensing. However, incoming BCEAO regional interoperability regulations threaten to lower barriers for traditional commercial banks, while entrenched operators like Orange and MTN in Cameroon continue to defend their distribution networks aggressively.
    claimRefs:
      - CO006
      - CO009
      - CO011
      - CO013
