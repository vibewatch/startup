company:
  name: "Wave Mobile Money"
chapter:
  number: 5
  title: "Product & Technology"
  summary: "Wave delivers a vertically integrated, app-centric and QR-card mobile money network across West Africa with 1% domestic P2P transfer fees, free deposits and withdrawals, and zero bill-payment surcharges. Operating on proprietary mobile and agent infrastructure supported by a UEMOA electronic money institution licence and an Ivorian commercial banking licence (Wave Bank Africa S.A.), the company prioritizes high-throughput transactional velocity over legacy USSD telco rails while confronting regulatory and expansion frictions in markets like Cameroon."
sections:
  - id: "core-product-definition"
    title: "Product Definition and Consumer Workflow"
    body: >
      Wave operates a digital financial platform designed to displace cash and legacy telecom-operated mobile money networks across West Africa. The primary consumer product is an iOS and Android smartphone application that provides domestic peer-to-peer transfers, merchant payments, bill payments, and airtime top-ups. Wave charges a flat 1% fee for money transfers, while cash deposits and cash withdrawals at its agent network remain free for retail users. Bill payments are also executed with zero consumer surcharges, eliminating the fee friction common to legacy telecommunication incumbents such as Orange Money and MTN MoMo. For users without smartphones or who experience digital literacy barriers, Wave issues physical QR-encoded cards that allow local agents to scan, identify, and execute cash-in and cash-out transactions instantly. Customer support is embedded directly into the core user experience via toll-free telephone assistance across operating jurisdictions including Senegal, Côte d'Ivoire, Mali, Burkina Faso, Uganda, and The Gambia.
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE004"
      - "CE005"
      - "CE007"
    tableRefs:
      - "TE001"
  - id: "operating-architecture"
    title: "Technology Stack, Agent Rails, and Architecture"
    body: >
      Unlike first-generation mobile money services that depend heavily on carrier-controlled Unstructured Supplementary Service Data (USSD) menus and SMS notifications, Wave built an application-driven and QR-code-based financial core. Transactions execute over cellular IP data connections, eliminating telecom session timeouts and per-session menu navigation delays. The physical network relies on thousands of authorized local retail agents equipped with smartphone applications and QR-code scanners, creating a cybernetic distribution layer that interfaces directly with unbanked communities. In markets like Côte d'Ivoire, Wave's deployment model has achieved monthly active user scale across millions of consumers, driving over 8 million monthly active users in Senegal alone. However, smartphone dependency creates an operational divide in rural territories where device penetration and digital literacy remain constrained, making agent assistance and physical QR cards essential to service continuity.
    claimRefs:
      - "CE006"
      - "CE007"
      - "CE008"
      - "CE013"
    figureRefs:
      - "FE001"
    tableRefs:
      - "TE002"
  - id: "infrastructure-licensing-differentiation"
    title: "Institutional Rails, Licensing, and Regional Expansion Risks"
    body: >
      Wave's technological differentiation is tightly coupled with its institutional licensing architecture. In April 2022, Wave obtained an Electronic Money Institution (EMI) licence from the Central Bank of West African States (BCEAO), becoming the first non-bank, non-telecom fintech granted direct access to the regional settlement infrastructure in the West African Economic and Monetary Union (WAEMU/UEMOA). To deepen its balance sheet capabilities and expand its corporate financial services, Wave subsequently launched a commercial bank in Côte d'Ivoire, Wave Bank Africa S.A., supported by institutional debt financing including a €117 million facility from Rand Merchant Bank, British International Investment, Finnfund, and Norfund. This structure allows Wave to manage settlement liquidity and partner with public health systems—such as digitizing payments across Senegal's public health facilities—without relying on traditional banking intermediaries. Conversely, regional expansion outside UEMOA presents severe operational friction: in Cameroon, Wave has proceeded with caution and faced entrenched resistance from incumbent telcos Orange and MTN, illustrating that software agility cannot circumvent fragmented national regulatory regimes and telco-defended distribution barriers.
    claimRefs:
      - "CE009"
      - "CE010"
      - "CE011"
      - "CE012"
      - "CE014"
      - "CE015"
    tableRefs:
      - "TE003"
callouts:
  - calloutType: "strength"
    title: "App-First Economics and Regulatory Autonomy"
    body: >
      Wave bypasses carrier USSD choke points through a modern smartphone and QR-code platform backed by a direct BCEAO electronic money licence and an Ivorian commercial bank charter (Wave Bank Africa S.A.). This architecture yields radical fee transparency (1% transfers, free cash-in/cash-out, zero bill fees) and high user satisfaction.
    claimRefs:
      - "CE002"
      - "CE007"
      - "CE009"
      - "CE010"
  - calloutType: "risk"
    title: "Cross-Border Fragmentation and Incumbent Defense"
    body: >
      Wave's software and agent model is vulnerable to geographic licensing barriers outside the UEMOA currency union. In markets such as Cameroon, incumbent mobile operators like Orange and MTN aggressively defend agent liquidity and distribution channels, constraining Wave's cross-border velocity and requiring bespoke bank partnerships.
    claimRefs:
      - "CE011"
      - "CE012"
      - "CE015"
