companyProfile:
  summary: >-
    Wave Mobile Money is a Dakar-headquartered mobile financial services platform that offers free deposits, free bill
    payments, free peer-to-peer transfers, and a flat 1% withdrawal fee across Francophone West Africa. The company was
    founded by CEO Drew Durbin, reached more than 21 million users, operates an agent network above 100,000 points, and
    has expanded from payments into licensed e-money and banking infrastructure backed by a 2025 debt financing round.
  founders:
    - name: Drew Durbin
      role: Co-founder and Chief Executive Officer
      background: Previously built Sendwave, a digital remittance business for African corridors.
      claimRefs:
        - CO002
  foundingLocation: Dakar, Senegal
  headquarters: Dakar, Senegal
  productSummary: >-
    Consumer and merchant mobile-money services with free cash-in and cash-out, low-fee transfers, bill payments, and
    expanding banking rails.
  customerFocus: Unbanked and underbanked consumers, informal merchants, and public-sector bill payers in West and Central Africa.
  businessModel: >-
    Transaction-fee monetization centered on peer-to-peer transfers, agent cash-out economics, and emerging banking and
