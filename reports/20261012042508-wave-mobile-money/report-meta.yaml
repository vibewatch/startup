  topStrengths:
    - Massive user adoption and a dense agent distribution network across Francophone West Africa.
    - Clear low-fee pricing and direct BCEAO / banking rails that support differentiated product economics.
    - Institutional financing and bank expansion give Wave more balance-sheet flexibility than pure payments peers.
  topRisks:
    - Fee caps and interoperability mandates can compress the core transfer-margin engine.
    - Cameroon and other expansion markets face entrenched telco competition and regulatory fragmentation.
    - Private financial disclosure remains thin, leaving audited revenue, margin, and cap-table risk unresolved.
  unresolvedGaps:
    - Consolidated audited revenue, gross margin, EBITDA, cash burn, and debt service detail.
    - Current cap table, liquidation preferences, and any common-equity overhang from the 2021 Series A.
    - Country-by-country licensing status, rail access, and unit economics outside Senegal and Côte d’Ivoire.
    - Retention, cohort behavior, and customer or merchant concentration by market.
