    keyQuote: >-
      Wave Mobile Money has expanded its reach across West Africa, operating in Senegal, Côte d’Ivoire, Uganda, Gambia,
      Sierra Leone, Mali, and Burkina Faso. Its partnership with TerraPay has enhanced cross-border remittance services,
      allowing users to receive funds directly into their Wave mobile wallets. Willie Kanyeki, TerraPay’s Vice President
      for Sub-Sahara Africa, highlights: “Our partnership with Wave Mobile Money marks a significant milestone in our
      mission to power borderless money movement. By enabling instant, cost-effective, and fully compliant remittances
      from key markets like the US, Canada, and Europe, we are simplifying financial access and driving financial
      inclusion in Mali.”
