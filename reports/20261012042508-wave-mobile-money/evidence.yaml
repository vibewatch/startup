    keyQuote: >-
      Wave Mobile Money obtained an electronic money licence from the Central Bank of West African States in April 2022.
      It became the first non-bank, non-telecom fintech authorised to operate in the West African Economic and Monetary
      Union. Wave launched a commercial bank called Wave Bank Africa S.A. in Côte d’Ivoire. The bank launch followed a
      €117 million debt financing round completed in June 2025. Rand Merchant Bank led that round, with British
      International Investment, Finnfund, and Norfund participating. ... Wave reports serving more than 21 million users
      across Africa and emphasises a low-fee model. The 2025 debt financing raised US$137 million to expand operational
      capacity across the continent. Wave obtained operational approval in Cameroon in 2025 through a partnership with
      Commercial Bank Cameroon. Senegal’s Ministry of Health signed a formal partnership with Wave to digitise payments
      across public health facilities.
