evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: audited-financials
    missingEvidence: >-
      Consolidated audited revenue, gross margin, EBITDA, net income, and operating cash burn figures for FY2024 through
      FY2026.
    whyItMatters: >-
      Without audited financials, assessing Wave's path to profitability and unit gross margins on 1% cash-out fees is
      impossible for secondary valuation diligence.
    diligencePath: Request confidential data-room access to audited IFRS or OHADA financial statements and management accounts.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: stakeholder-or-investor-map
    missingEvidence: >-
      Detailed capitalization table showing founder equity percentage, Series A liquidation preferences, employee share
      option pool, and post-2025 debt covenants.
    whyItMatters: >-
      Understanding common equity overhang, protective provisions, and liquidation waterfall thresholds is critical
      given the $1.7B 2021 valuation and subsequent debt layering.
    diligencePath: >-
      Review shareholder agreements, corporate registry filings, and loan covenants from Rand Merchant Bank and DFI
      consortium lenders.
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: minor
    topic: leadership-and-founder-table
    missingEvidence: >-
      Complete roster of Wave Mobile Money board members, independent directors, and C-suite executives beyond CEO Drew
      Durbin and Regional Director Coura Sene.
    whyItMatters: >-
      Key-person risk and regulatory compliance governance cannot be fully evaluated without full visibility into the
      board composition and supervisory committees.
    diligencePath: Request company corporate governance manual, organizational chart, and regulatory compliance oversight filings.
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      Country-level disaggregated transaction volume and net fee revenue for Wave across non-Senegal operating
      territories (Côte d'Ivoire, Mali, Burkina Faso, Guinea, The Gambia, Uganda, Cameroon).
    whyItMatters: >-
      Aggregated 20 million user metrics obscure regional profitability variations, unit economics, and whether newer
      markets can achieve Senegal's network density.
    diligencePath: >-
      Request regulatory filings from BCEAO and CEMAC or country-by-country management accounts during confirmatory
      financial diligence.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: minor
    topic: tam-methodology
    missingEvidence: >-
      Reconciliation between macro transaction flow estimates (GSMA $1.4T global volume) and vendor addressable market
      sizing reports (UnivDatos $800M African mobile money market).
    whyItMatters: >-
      Macro sizing methodologies often conflate gross payments volume (GPV) with operator revenue pools, creating
      hundred-fold discrepancies in addressable market assessments.
    diligencePath: >-
      Model TAM exclusively on achievable operator rake rates (1% P2P fee) applied to addressable cash-to-digital
      conversion volume.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: competitor-unit-economics
    missingEvidence: >-
      Audited country-level gross margin and agent commission breakdown for Orange Money and MTN MoMo in Francophone
      West Africa.
    whyItMatters: >-
      Prevents independent verification of whether incumbent fee reductions are subsidized by telecom voice/data profits
      or represent standalone sustainable margin compression.
    diligencePath: >-
      Obtain regional statutory entity filings from OHADA corporate registries for Orange Finances Mobiles Senegal and
      MTN Mobile Money Côte d'Ivoire.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: cameroon-and-uganda-market-share
    missingEvidence: Granular market share and monthly active user counts for Wave in Cameroon and Uganda relative to Orange and MTN.
    whyItMatters: >-
      Crucial for quantifying whether Wave's expansion outside Senegal and Côte d'Ivoire is stabilizing or suffering
      terminal customer acquisition stagnation.
    diligencePath: >-
      Request management reporting on cohort retention, agent transaction volume, and marketing spend in secondary
      expansion territories.
    relatedQuestionRefs:
      - QP007
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: blocking
    topic: audited-financials
    missingEvidence: >-
      Audited consolidated financial statements disclosing annual revenue, gross profit, agent commission payouts, and
      EBITDA or net income.
    whyItMatters: >-
      Without audited financials, underwriting cannot verify whether the 1% fee model achieves positive contribution
      margins after agent commissions and network costs.
    diligencePath: >-
      Request audited consolidated financial statements for FY2023-FY2025 and management accounts for YTD 2026 under
      NDA.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI001
      - TI003
  - type: missing-source
    severity: material
    topic: debt-covenants
    missingEvidence: >-
      Full covenant schedule, interest rate terms, maturity dates, and encumbered assets for the $137 million debt
      facility raised in June 2025.
    whyItMatters: >-
      Debt service obligations and covenant restrictions impact cash runway and forward equity value in downside or
      slow-growth scenarios.
    diligencePath: Obtain credit agreements with Rand Merchant Bank and participating DFIs to evaluate debt service coverage ratios.
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: developer-ecosystem
    missingEvidence: >-
      Public developer portal, API documentation, webhook specifications, and sandbox SDKs for Wave merchant checkout
      integrations.
    whyItMatters: >-
      Without public technical API documentation, external engineers and merchants cannot verify integration effort,
      webhook reliability, or developer traction.
    diligencePath: >-
      Request developer integration guides, merchant API rate limits, and merchant checkout onboarding documentation
      directly from Wave's business team.
    relatedQuestionRefs:
      - QE008
  - type: private-evidence-only
    severity: material
    topic: enterprise-and-merchant-retention-metrics
    missingEvidence: >-
      Audited cohort-level net revenue retention (NRR), gross revenue retention (GRR), and churn rates for B2B billers
      and retail consumers across Senegal and Côte d'Ivoire.
    whyItMatters: >-
      Wave's low-margin flat 1% model requires high customer retention and transactional frequency to achieve long-term
      operating profitability; without cohort data, customer lifetime value cannot be independently verified.
    diligencePath: >-
      Request confidential cohort retention tables and merchant churn reporting from Wave management during
      pre-investment diligence.
    relatedQuestionRefs:
      - QU009
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-and-institutional-contract-disclosures
    missingEvidence: >-
      Comprehensive institutional contract terms, SLA commitments, and revenue share schedules for major utility and
      public-sector integrations (such as Senegal Ministry of Health, CIE, SODECI, and Canal+).
    whyItMatters: >-
      Public references verify deployment existence but omit commercial pricing concessions, contract durations,
      exclusivity terms, and volume commitments necessary to model enterprise segment margins.
    diligencePath: Review commercial enterprise contracts and public procurement agreements in virtual data room.
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: regulatory-legal-risk-register
    missingEvidence: >-
      Audited regulatory compliance filings and capital adequacy ratios for Wave Bank Africa S.A. submitted to the BCEAO
      Banking Commission.
    whyItMatters: >-
      Without formal banking supervision disclosures, investors cannot assess whether Wave Bank Africa meets minimum
      regulatory solvency buffers or faces discretionary capital add-ons.
    diligencePath: >-
      Request BCEAO prudential supervisory returns and capitalization audit reports directly from Wave executive
      management during confirmatory diligence.
    relatedTableRefs:
      - TR001
  - type: missing-source
    severity: material
    topic: credit-default-risk
    missingEvidence: >-
      Non-performing loan (NPL) ratios, default provisions, and credit underwriting loss rates for Wave's emerging
      lending and credit portfolio.
    whyItMatters: >-
      As Wave transitions from transaction fees to credit provision, unhedged credit losses could accelerate operating
      cash burn and deplete banking capital.
    diligencePath: >-
      Review internal credit risk dashboards, cohort default curves, and provisioning methodologies during management
      review.
    relatedQuestionRefs:
      - QR009
  - type: missing-source
    severity: material
    topic: audited-financial-performance
    missingEvidence: >-
      Consolidated audited income statement, gross margin breakdown between P2P transfers and merchant payments, and
      operating cash burn for FY2024-FY2025.
    whyItMatters: >-
      Without verified revenue and margin figures, estimating Wave's EV/Sales or cash burn runway relies on rough
      transaction velocity projections rather than audited unit economics.
    diligencePath: >-
      Request audited financials from Wave's executive management or review confidential lender information memoranda
      through syndicated debt participants.
    relatedQuestionRefs:
      - QV008
