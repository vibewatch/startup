    keyQuote: >-
      Wave builds mobile money infrastructure in West and Central Africa, offering free deposits, free transfers, and
      low-cost cash-out — undercutting incumbent MNO wallets on price. They operate licensed in Senegal, Côte d’Ivoire,
      Uganda, and several other markets, with Senegal being the breakout success story. ... Cash-out fees are the
      primary revenue driver. Users deposit for free but pay roughly 1% to cash out at agent points. ... Agent network
      density. Wave reportedly has 100K+ agents across its markets. ... Would I invest today at the reported $1.7B
      valuation? Harder call.
