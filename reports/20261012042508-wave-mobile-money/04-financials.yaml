callouts:
  - calloutType: risk
    title: "Margin Compression Inherent in Ultra-Low Pricing"
    body: "Wave's defining value proposition of 1% transfers with free cash-in and cash-out creates structurally thin unit margins. Unlike incumbent telcos who cross-subsidize mobile money through airtime and voice revenues, Wave must fund agent commissions, liquidity rebalancing, and regulatory compliance entirely from transaction fees and emerging banking products."
    claimRefs:
      - "CI005"
      - "CI006"
      - "CI008"
  - calloutType: insight
    title: "Shift Toward Debt Capital and Banking Infrastructure"
    body: "With $439 million in cumulative funding including $228.5 million in disclosed debt facilities, Wave is increasingly utilizing debt financing from development finance institutions to support balance-sheet-heavy operations and its newly licensed commercial bank, Wave Bank Africa S.A."
    claimRefs:
      - "CI010"
      - "CI011"
      - "CI012"
