callouts:
  - calloutType: "risk"
    title: "Regulatory Compression of Core 1% Transfer Fee"
    body: "The BCEAO mandate capping mobile money transfer fees at 0.8% above 8,000 CFA francs and making transfers below 8,000 CFA francs completely free directly threatens Wave's foundational 1% transfer pricing model. Because high-frequency P2P transfers represent the bedrock of Wave's customer acquisition, regulatory margin compression forces the company to accelerate balance-sheet-heavy banking and credit lines to preserve gross profit."
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR003"
  - calloutType: "insight"
    title: "The Strategic Imperative of Wave Bank Africa S.A."
    body: "Wave's pivot to establish Wave Bank Africa S.A. in Côte d'Ivoire with $35 million in initial capital reflects a defensive transformation against telecom fee wars. By securing direct access to central bank settlement infrastructure and unlocking deposit-taking and lending, Wave seeks to transition from an exposed low-margin payment rail into a full-stack digital bank, albeit at the cost of substantial capital lockup and dual regulatory oversight."
    claimRefs:
      - "CR004"
      - "CR005"
      - "CR007"
