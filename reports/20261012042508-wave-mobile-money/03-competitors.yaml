callouts:
  - calloutType: risk
    title: "Pricing Trap and Margin Compression"
    body: "Wave's core disruption—making money movement virtually free—has permanently shifted consumer expectations across West Africa. Because raising fees to 2% or 3% would immediately open the door for telecom retaliation, Wave is structurally locked into thin transaction margins and must cross-sell credit and merchant acquiring to achieve long-term corporate profitability."
    claimRefs:
      - CP001
      - CP006
      - CP014
  - calloutType: insight
    title: "The Preparedness Asymmetry in Expansion Markets"
    body: "Wave's dramatic conquest of Senegal occurred because Orange operated an unhedged monopoly with extractive pricing and sluggish innovation. In subsequent expansion markets like Uganda and Cameroon, incumbents MTN and Orange were fully alerted, aggressively defending agent exclusivity and matching low-tier pricing to inflict multi-million dollar operating losses on the challenger."
    claimRefs:
      - CP003
      - CP004
      - CP008
      - CP010
