  - id: FE001
    title: Wave Mobile Money Technology and Operating Stack
    type: stack
    summary: Five-tier architectural decomposition of Wave's mobile money platform from user interface to settlement rails.
    data:
      layers:
        - label: Client Application & Access Layer
          detail: Native iOS/Android consumer apps and physical QR cards for low-literacy and non-smartphone users.
        - label: Agent Network & Point-of-Sale Layer
          detail: >-
            Proprietary agent application enabling QR-assisted cash deposits, free cash withdrawals, and customer
            onboarding.
        - label: Core Transaction Processing & Ledger
          detail: Scalable modern microservices ledger handling real-time balance checks, fraud scoring, and fee calculations.
        - label: Customer Assistance & Support Rails
          detail: Dedicated toll-free national telephony integration and human support desks across Francophone West Africa.
        - label: Regulatory Compliance & Identity Layer
          detail: >-
            Customer identification, AML/KYC checks, and transaction monitoring aligned with regional central bank
            standards.
        - label: Institutional Settlement & Banking Layer
          detail: >-
            BCEAO Electronic Money Institution licence rails and Wave Bank Africa S.A. commercial banking
            infrastructure.
    approximationNotes: Architecture layers synthesized from technical reviews, licensing disclosures, and product specifications.
