chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity and Core Operating Model
        blocks:
          - type: paragraph
            body: >-
              Wave Mobile Money is an African mobile financial services platform established to build radically
              inclusive, low-cost financial infrastructure across markets where traditional banking access remains
              limited. The company inverts the incumbent telecom mobile money pricing framework by offering free wallet
              deposits, free peer-to-peer money transfers, and free utility bill payments, charging customers only a
              flat 1% transaction fee upon cash withdrawal at agent locations. This consumer-first fee transparency
              catalyzed rapid user acquisition, expanding the platform's self-reported customer base to more than 21
              million accounts. However, this positioning creates a structural commercial tension: because top-line
              transaction revenue is concentrated in physical cash-out transactions, Wave faces unit-margin compression
              as economies digitize and merchant payments or account-to-account settlements reduce the need for physical
              cash conversion.
            claimRefs:
              - CO001
              - CO004
              - CO009
              - CO012
          - type: table
            tableRef: TO001
            claimRefs:
              - CO005
              - CO007
              - CO009
              - CO012
      - number: '1.2'
        title: Founders, Leadership Governance, and Key-Person Exposure
        blocks:
          - type: paragraph
            body: >-
              Wave Mobile Money was co-founded by Chief Executive Officer Drew Durbin, who previously built and scaled
              digital cross-border remittance service Sendwave into one of Africa's largest remittance corridors before
              establishing Wave's standalone domestic payments platform. Senior operational leadership across
              Francophone West Africa is directed by Regional and Public Affairs Director Coura Sene, who brings over
              two decades of executive experience across telecom operators, mobile financial institutions, and insurance
              underwriters to oversee regulatory engagements and strategic policy. Governance across Wave's operating
              territories—spanning Senegal, Côte d’Ivoire, Uganda, Gambia, Sierra Leone, Mali, and Burkina Faso—relies
              heavily on localized compliance teams and field agent supervisors. Nevertheless, organizational key-person
              dependency remains concentrated in Durbin's strategic vision and Sene's regulatory capital across West
              African central banking authorities.
            claimRefs:
              - CO002
              - CO003
              - CO010
          - type: table
            tableRef: TO002
            claimRefs:
              - CO002
              - CO003
              - CO010
      - number: '1.3'
        title: Capitalization, Debt Financing, and Valuation Profile
        blocks:
          - type: paragraph
            body: >-
              Wave established its benchmark equity valuation in September 2021 upon closing a landmark Series A
              financing at a $1.7 billion post-money valuation, making it the first technology unicorn founded in
              Francophone West Africa. The company fortified its regulatory independence in April 2022 by securing a
              direct Electronic Money Institution license from the Central Bank of West African States (BCEAO),
              transitioning away from reliance on third-party commercial bank sponsorship. In June 2025, Wave
              diversified its capitalization through a €117 million ($137 million) debt facility arranged by Rand
              Merchant Bank with participation from prominent development finance institutions British International
              Investment, Finnfund, and Norfund. This capital infusion supported the launch of Wave Bank Africa S.A. in
              Côte d’Ivoire, shifting the company toward balance-sheet-supported operations while exposing it to
              upcoming BCEAO payment interoperability rules that could dilute its proprietary network advantage.
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
              - CO013
          - type: table
            tableRef: TO003
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
              - CO013
      - number: '1.4'
        title: Operational Scale, Milestones, and Regional Expansion Headwinds
        blocks:
          - type: paragraph
            body: >-
              Wave's operating footprint encompasses seven core African countries supported by an extensive distribution
              network of over 100,000 active cash agents, enabling high-density liquidity management in major
              metropolitan corridors like Dakar and Abidjan. To expand international remittance inflows, Wave integrated
              with global payment infrastructure provider TerraPay, allowing instant cross-border transfers directly
              into recipient mobile wallets. This physical and digital expansion follows historical precedents where
              mobile payments bridged severe formal banking voids across West Africa, including emergency hazard
              compensation programs in Sierra Leone. However, geographic expansion outside UEMOA core markets has
              encountered operational resistance; in Cameroon, despite securing operational authorization in 2025 via
              Commercial Bank Cameroon, Wave has struggled to gain meaningful market traction against well-capitalized
              incumbent telecom operators Orange and MTN, necessitating defensive adjustments to its expansion roadmap.
            claimRefs:
              - CO006
              - CO009
              - CO010
              - CO011
              - CO014
