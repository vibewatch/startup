  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Six-stage lifecycle mapping retail consumer onboarding, transaction adoption, and enterprise utility expansion
      loops.
    data:
      items:
        - label: Discovery & App Onboarding
          detail: >-
            Consumer downloads smartphone application with any active telecom SIM card; registration verified via
            national ID card (CNI).
          touchpoints:
            - Smartphone app store download
            - National identity document validation
            - Toll-free customer support onboarding
          tone: positive
        - label: First-Mile Agent Cash-In
          detail: Consumer visits local retail agent to deposit cash into digital wallet without any transaction fees.
          touchpoints:
            - Physical agent retail kiosk
            - QR-code or phone number identification
            - Immediate SMS / in-app deposit confirmation
          tone: positive
        - label: P2P Money Transfer Execution
          detail: >-
            Consumer initiates domestic peer-to-peer transfer to family or business contact at a transparent flat 1%
            fee.
          touchpoints:
            - In-app contact selection
            - Real-time fee calculation display (1%)
            - Instant recipient notification
          tone: positive
        - label: Utility & Bill Payment Adoption
          detail: >-
            Active wallet users transition into paying recurring household utility bills (electricity, water, TV) with
            zero fee surcharge.
          touchpoints:
            - CIE and SODECI biller integration
            - Canal+ television subscription renewal
            - Woyofal electricity token purchase
          tone: positive
        - label: Merchant QR Code Checkout
          detail: Users pay local merchants and retail shops via in-app QR code scanning, bypassing physical cash handling.
          touchpoints:
            - Merchant counter QR code display
            - Zero-fee consumer checkout
            - Merchant transaction reconciliation
          tone: neutral
        - label: Cross-Border & Banking Expansion
          detail: >-
            Advanced users access regional remittances, institutional health disbursements, and emerging commercial bank
            products via Wave Bank Africa S.A.
          touchpoints:
            - Regional UEMOA cross-border corridors
            - Senegal Ministry of Health facility rails
            - Wave Bank commercial deposit accounts
          tone: neutral
    approximationNotes: Lifecycle stages synthesized from Wave product documentation, user reviews, and public partner announcements.
