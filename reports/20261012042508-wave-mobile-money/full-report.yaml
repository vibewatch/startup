      - number: '4.2'
        title: Cost Structure & Agent Network Unit Economics
        blocks:
          - type: paragraph
            body: >-
              The economic sustainability of Wave's business model hinges upon tight operational discipline and rigorous
              agent network management. Because retail users deposit and withdraw physical currency free of charge, Wave
              absorbs the cash-handling and liquidity rebalancing burdens that traditional operators pass on to
              consumers. Wave distributes its services through an extensive network of independent third-party agents
              who must be compensated via commissions for maintaining local cash and e-money liquidity. Industry
              analysis indicates that Wave's core strategic tradeoff pairs ultra-low consumer pricing for rapid market
              share against razor-thin unit margins that demand relentless scale and strict cost control. The cash-heavy
              nature of retail distribution creates ongoing unit-economics pressure, where high agent payout obligations
              and underlying carrier infrastructure costs can compress net operating margins unless offset by massive
              transaction throughput. While bypassing traditional card network interchange rails eliminates standard
              payment card processing fees, sustaining agent loyalty and operational liquidity under a 1% take-rate cap
              remains an ongoing structural operational challenge.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
          - type: table
            tableRef: TI003
            claimRefs:
              - CI001
              - CI005
              - CI006
              - CI009
              - CI010
      - number: '4.3'
        title: Capital Adequacy & Forward Financing Profile
        blocks:
          - type: paragraph
            body: >-
              To finance its capital-intensive expansion and support operational liquidity across multiple
              jurisdictions, Wave has raised $439 million in cumulative funding across six disclosed financing rounds.
              In a notable shift from its venture-backed equity roots—highlighted by its $200 million Series A round in
              2021—Wave has increasingly turned to large-scale debt capital to fund its balance sheet. In June 2025,
              Wave secured a $137 million debt financing facility led by Rand Merchant Bank, with substantial
              participation from development finance institutions including British International Investment, Norfund,
              and Finnfund. This followed an earlier $91.5 million multi-lender debt facility orchestrated by the
              International Finance Corporation in 2022. Concurrently, Wave has transitioned from a pure payments
              application toward regulated financial infrastructure. Anchored by its April 2022 Central Bank of West
              African States (BCEAO) electronic money issuer license, Wave launched a commercial banking entity, Wave
              Bank Africa S.A., in Côte d’Ivoire in 2025. This banking transition provides a regulatory framework for
              deposit-taking and corporate treasury management, but also subjects the business to dual supervision,
              higher capital reserve requirements, and debt servicing obligations.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
      - number: '4.4'
        title: Commercial Traction & Financial Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              Wave reports serving over 21 million users across Africa as of 2026, establishing a commanding market
              presence across core West African Economic and Monetary Union (WAEMU) territories such as Senegal and Côte
              d’Ivoire. However, commercial momentum has proven geographically uneven. When expanding into Central
              African markets such as Cameroon, Wave has encountered stiff resistance from entrenched telecom incumbents
              Orange and MTN, leading to regulatory friction and slower merchant adoption. From an institutional
              underwriting perspective, Wave's financial profile presents severe disclosure limitations. As a private
              entity, Wave publishes no audited financial statements, consolidated annual revenues, gross margins,
              EBITDA, or cash burn figures. Furthermore, the covenant terms, interest rates, and repayment horizons
              governing its $137 million debt facility remain confidential. Prospective investors and lenders must treat
              Wave's 1% fee model as an unverified unit margin structure until granular cohort retention, net take-rates
              after agent commissions, and debt service coverage metrics are made available through formal diligence
              disclosures.
            claimRefs:
              - CI005
              - CI014
              - CI015
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Margin Compression Inherent in Ultra-Low Pricing
            body: >-
              Wave's defining value proposition of 1% transfers with free cash-in and cash-out creates structurally thin
              unit margins. Unlike incumbent telcos who cross-subsidize mobile money through airtime and voice revenues,
              Wave must fund agent commissions, liquidity rebalancing, and regulatory compliance entirely from
              transaction fees and emerging banking products.
            calloutType: risk
            claimRefs:
              - CI005
              - CI006
              - CI008
          - type: callout
            title: Shift Toward Debt Capital and Banking Infrastructure
            body: >-
              With $439 million in cumulative funding including $228.5 million in disclosed debt facilities, Wave is
              increasingly utilizing debt financing from development finance institutions to support balance-sheet-heavy
              operations and its newly licensed commercial bank, Wave Bank Africa S.A.
            calloutType: insight
            claimRefs:
