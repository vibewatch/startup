      - number: '5.3'
        title: Institutional Rails, Licensing, and Regional Expansion Risks
        blocks:
          - type: paragraph
            body: >
              Wave's technological differentiation is tightly coupled with its institutional licensing architecture. In
              April 2022, Wave obtained an Electronic Money Institution (EMI) licence from the Central Bank of West
              African States (BCEAO), becoming the first non-bank, non-telecom fintech granted direct access to the
              regional settlement infrastructure in the West African Economic and Monetary Union (WAEMU/UEMOA). To
              deepen its balance sheet capabilities and expand its corporate financial services, Wave subsequently
              launched a commercial bank in Côte d'Ivoire, Wave Bank Africa S.A., supported by institutional debt
              financing including a €117 million facility from Rand Merchant Bank, British International Investment,
              Finnfund, and Norfund. This structure allows Wave to manage settlement liquidity and partner with public
              health systems—such as digitizing payments across Senegal's public health facilities—without relying on
              traditional banking intermediaries. Conversely, regional expansion outside UEMOA presents severe
              operational friction: in Cameroon, Wave has proceeded with caution and faced entrenched resistance from
              incumbent telcos Orange and MTN, illustrating that software agility cannot circumvent fragmented national
              regulatory regimes and telco-defended distribution barriers.
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
              - CE014
              - CE015
