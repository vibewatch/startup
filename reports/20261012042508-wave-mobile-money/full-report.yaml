      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: App-First Economics and Regulatory Autonomy
            body: >
              Wave bypasses carrier USSD choke points through a modern smartphone and QR-code platform backed by a
              direct BCEAO electronic money licence and an Ivorian commercial bank charter (Wave Bank Africa S.A.). This
              architecture yields radical fee transparency (1% transfers, free cash-in/cash-out, zero bill fees) and
              high user satisfaction.
            calloutType: strength
            claimRefs:
              - CE002
              - CE007
              - CE009
              - CE010
          - type: callout
            title: Cross-Border Fragmentation and Incumbent Defense
            body: >
              Wave's software and agent model is vulnerable to geographic licensing barriers outside the UEMOA currency
              union. In markets such as Cameroon, incumbent mobile operators like Orange and MTN aggressively defend
              agent liquidity and distribution channels, constraining Wave's cross-border velocity and requiring bespoke
              bank partnerships.
            calloutType: risk
            claimRefs:
              - CE011
              - CE012
              - CE015
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation and Value Proposition
        blocks:
          - type: paragraph
            body: >
              Wave segments its customer ecosystem into three principal user groups: mass-market retail consumers, local
              retail agent operators, and institutional utility billers. For retail consumers, the platform functions
              primarily as an affordable digital wallet for domestic remittances, utility bill settlements, and airtime
              top-ups. Wave's core value proposition hinges on a radical pricing disruption: deposits and bill payments
              are completely free for end users, while peer-to-peer transfers and cash withdrawals incur a flat 1% fee.
              This fee structure represents a 70% to 80% discount compared to the 5% to 7% tiered fee schedules
              historically imposed by telecom incumbents Orange Money and MTN MoMo. By decoupling user accounts from
              specific telecommunication provider SIM cards, Wave enables any smartphone owner with a valid national
              identity document (CNI) to transact seamlessly across networks. This open-access model catalyzed
              widespread switching behavior across urban and peri-urban populations in Senegal and Côte d'Ivoire,
              forcing incumbent telecom operators into defensive fee reductions across Francophone West Africa.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU007
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU007
      - number: '6.2'
        title: Adoption Trajectory and Regional Market Penetration
        blocks:
          - type: paragraph
            body: >
              Wave's customer acquisition trajectory demonstrates extraordinary velocity across its primary West African
              markets. Across its total footprint, Wave reports serving more than 21 million users as of 2026, driven by
              aggressive ground-game distribution and price transparency. In Senegal, its initial market launched in
              2017, the platform achieved unprecedented market penetration: an estimated three-quarters of all adult
              smartphone owners had installed and activated the Wave application by 2023, surpassing formal commercial
              banking penetration where only half of adults held bank accounts. Expansion into Côte d'Ivoire produced
              comparable rapid scaling, with industry estimates indicating Wave reached between 8 million and 10 million
              active users within two years of its 2021 launch. On an operational level, Wave processes over USD 2
              billion in monthly mobile payment transactions, reflecting heavy daily velocity in peer-to-peer transfers
              and cash-out operations. However, public user metrics lack granular standardized definitions, conflating
              registered application downloads with 30-day or 90-day monthly active transacting accounts.
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU013
          - type: table
            tableRef: TU002
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU013
      - number: '6.3'
        title: Production Deployments and Institutional Validation
        blocks:
          - type: paragraph
            body: >
              To transition from an informal peer-to-peer payment tool into indispensable public and commercial payment
              infrastructure, Wave has secured key institutional partnerships across government, utility, and banking
              sectors. In Senegal, the Ministry of Health entered into a formal partnership with Wave to digitize
              payments across public health facilities nationwide, establishing digital payment rails as a permanent
              operating standard for healthcare delivery. In Côte d'Ivoire, Wave integrated major national public
              utility providers into its application, enabling millions of consumers to settle electricity bills with
              Compagnie Ivoirienne d'Électricité (CIE) and water bills with SODECI without paying convenience
              surcharges. Entertainment and media billers such as Canal+ Côte d'Ivoire have similarly integrated Wave QR
              payments for subscription renewals. In Cameroon, Wave partnered with Commercial Bank Cameroon to secure
              operational approval for Central African expansion, though competitive counter-measures from Orange and
              MTN have constrained customer acquisition velocity relative to Wave's West African strongholds.
            claimRefs:
              - CU008
              - CU009
              - CU010
              - CU011
          - type: table
            tableRef: TU003
            claimRefs:
