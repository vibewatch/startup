    summary: >-
      Illustrates the progression of funds and fee capture from customer cash-in through 1% P2P transfer monetization to
      agent commission and operational expense deduction.
    data:
      nodes:
        - id: cash-in
          label: Customer Cash-In Deposit
          detail: Consumer deposits physical currency at local agent kiosk; free of charge to user.
        - id: wallet-issuance
          label: E-Money Wallet Credit
          detail: Digital wallet balance issued under BCEAO non-bank electronic money license.
        - id: p2p-transfer
          label: P2P Money Transfer
          detail: User sends digital funds to another recipient across mobile app or QR card rails.
        - id: gross-revenue
          label: 1% Gross Fee Capture
          detail: Wave extracts 1% flat fee on transfer value, representing primary revenue rail.
        - id: agent-commission
          label: Agent Commission Deduction
          detail: Liquidity provisioning and transaction handling fees paid to independent agent network.
        - id: network-compliance
          label: Telecom & Compliance Expenses
          detail: Underlying SMS, carrier connectivity, central bank reporting, and AML/KYC costs.
        - id: net-margin
          label: Net Unit Contribution
          detail: Residual operating margin retained to service corporate overhead and debt facilities.
    approximationNotes: >-
      Flow sequence reflects operational monetization model; quantitative cost deductions per stage are private and
      omitted.
