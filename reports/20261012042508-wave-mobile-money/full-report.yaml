              - CU011
      - number: '6.4'
        title: Retention Durability, Expansion Friction, and Concentration Risks
        blocks:
          - type: paragraph
            body: >
              Wave's long-term customer durability depends on transitioning transacting users from commoditized
              transfers into sticky financial workflows while overcoming geographic and infrastructure barriers. To
              deepen financial integration and offer corporate accounts, Wave established Wave Bank Africa S.A., an
              authorized commercial banking subsidiary in Côte d'Ivoire. However, customer durability faces structural
              risks. In expansion markets outside the UEMOA monetary union, particularly Cameroon, Wave has struggled
              against entrenched telecom duopolies that vigorously defend agent liquidity and subscriber loyalty.
              Furthermore, across rural West African territories, widespread infrastructure bottlenecks—including
              intermittent wireless connectivity, power outages, and low smartphone ownership—create first-mile friction
              that limits organic digital adoption. Crucially, Wave discloses no audited cohort retention, net revenue
              retention (NRR), or merchant churn data, leaving open diligence questions regarding whether low-fee
              customer adoption translates into durable, profitable lifetime customer value.
            claimRefs:
              - CU012
              - CU014
              - CU015
          - type: figure
            figureRef: FU001
            claimRefs:
