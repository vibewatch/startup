  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Consumer Workflow
        blocks:
          - type: paragraph
            body: >
              Wave operates a digital financial platform designed to displace cash and legacy telecom-operated mobile
              money networks across West Africa. The primary consumer product is an iOS and Android smartphone
              application that provides domestic peer-to-peer transfers, merchant payments, bill payments, and airtime
              top-ups. Wave charges a flat 1% fee for money transfers, while cash deposits and cash withdrawals at its
              agent network remain free for retail users. Bill payments are also executed with zero consumer surcharges,
              eliminating the fee friction common to legacy telecommunication incumbents such as Orange Money and MTN
              MoMo. For users without smartphones or who experience digital literacy barriers, Wave issues physical
              QR-encoded cards that allow local agents to scan, identify, and execute cash-in and cash-out transactions
              instantly. Customer support is embedded directly into the core user experience via toll-free telephone
              assistance across operating jurisdictions including Senegal, Côte d'Ivoire, Mali, Burkina Faso, Uganda,
              and The Gambia.
            claimRefs:
              - CE001
