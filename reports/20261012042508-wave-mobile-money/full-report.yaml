      - number: '5.2'
        title: Technology Stack, Agent Rails, and Architecture
        blocks:
          - type: paragraph
            body: >
              Unlike first-generation mobile money services that depend heavily on carrier-controlled Unstructured
              Supplementary Service Data (USSD) menus and SMS notifications, Wave built an application-driven and
              QR-code-based financial core. Transactions execute over cellular IP data connections, eliminating telecom
              session timeouts and per-session menu navigation delays. The physical network relies on thousands of
              authorized local retail agents equipped with smartphone applications and QR-code scanners, creating a
              cybernetic distribution layer that interfaces directly with unbanked communities. In markets like Côte
              d'Ivoire, Wave's deployment model has achieved monthly active user scale across millions of consumers,
              driving over 8 million monthly active users in Senegal alone. However, smartphone dependency creates an
              operational divide in rural territories where device penetration and digital literacy remain constrained,
              making agent assistance and physical QR cards essential to service continuity.
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE013
