      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Inverted Pricing Model as Customer Acquisition Engine
            body: >-
              Wave disrupted incumbent telecom mobile money providers across West Africa by eliminating fees on account
              creation, cash deposits, peer-to-peer transfers, and utility bill payments, monetizing exclusively via a
              1% fee on agent cash withdrawals. While this radical fee transparency drove adoption to over 21 million
              accounts, it creates an operational dependency on cash-out volumes that faces margin compression as
              digital payment rails mature.
            calloutType: insight
            claimRefs:
              - CO001
              - CO004
              - CO009
              - CO012
          - type: callout
            title: Regulatory Interoperability and Regional Competitive Headwinds
            body: >-
              Wave's operational moat relies on managing liquidity across more than 100,000 physical agent locations and
              holding direct BCEAO e-money licensing. However, incoming BCEAO regional interoperability regulations
              threaten to lower barriers for traditional commercial banks, while entrenched operators like Orange and
              MTN in Cameroon continue to defend their distribution networks aggressively.
            calloutType: risk
            claimRefs:
              - CO006
              - CO009
              - CO011
              - CO013
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Included Spend, and Transaction Scope
        blocks:
          - type: paragraph
            body: >-
              The African mobile money market is defined primarily by cash-in, cash-out (CICO) agent distribution and
              domestic peer-to-peer (P2P) transfers, rather than traditional card network interchange or overdraft
              banking. Wave establishes its competitive boundary across low-cost mobile money corridors in francophone
              West Africa, focusing on high-velocity consumer wallet transfers and retail merchant payments. Historical
              incumbent telecom operators such as Orange, Free, and Expresso Telecom extracted fees as high as 10% per
              transaction, creating a substantial pricing umbrella. Wave disrupted this market structure by offering
              free deposits, free withdrawals, and free utility bill payments alongside a flat 1% fee for P2P transfers.
              This boundary deliberately includes everyday consumer wallet velocity, bill payments, and cash liquidity
              management, while excluding capital-intensive commercial lending, complex corporate treasury, and
              traditional credit card processing.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM010
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM010
      - number: '2.2'
        title: 'Addressable Sizing Lenses: Macro Flows vs. Monetizable Service Revenue'
        blocks:
          - type: paragraph
            body: >-
              Sizing the African mobile money opportunity requires distinguishing macro gross payment volumes from
              wallet operator fee pools. On an industry service revenue basis, independent market analysis values the
              African mobile money sector at approximately USD 800 million in 2024, expanding at an 18.00% compound
              annual growth rate through 2033 to reach USD 3.55 billion. In contrast, macro payment flow data from GSMA
              demonstrates that global mobile money transaction values grew 14% to USD 1.4 trillion in 2023 across 435
              million monthly active accounts, while annual transaction volumes expanded 23% to 85 billion transfers.
              Sub-Saharan Africa accounts for the majority of these transactions, with mobile network operator led
              models and USSD infrastructure dominating due to low smartphone penetration and limited internet
              connectivity. Wave's serviceable addressable market across its eight operating countries represents a
              specialized slice of this flow, where high user velocity contrasts with constrained operator monetization.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM007
              - CM014
      - number: '2.3'
        title: Buyer, User, and Payer Segmentation Across Mobile Corridors
        blocks:
          - type: paragraph
            body: >-
              Adoption dynamics across Wave's operating territories reflect distinct user motivations and payment
              workflows. The primary user base comprises informal retail consumers and unbanked households, where over
              85% of regional populations have historically lacked formal commercial bank accounts. For these
              individuals, mobile wallets serve as the default transaction and savings account, with adoption triggered
              by immediate fee savings against incumbent telcos. The second segment encompasses informal neighborhood
              merchants and agent kiosks who function as decentralized bank branches, monetizing cash liquidity rather
              than software licenses. The third segment includes institutional billers, utilities, and government
              bodies, such as Senegal's Ministry of Health, which partnered with Wave to permanently digitize payment
              collections across public healthcare facilities. Finally, global payment aggregators integrate mobile
              wallet APIs to facilitate seamless cross-border payouts and fiat disbursements into rural corridors.
            claimRefs:
              - CM004
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM004
              - CM010
              - CM011
              - CM012
      - number: '2.4'
        title: Macro Growth Drivers, Incumbent Friction, and Expansion Constraints
        blocks:
          - type: paragraph
            body: >-
              Sector expansion is propelled by structural tailwinds, including smartphone price declines, 4G network
              rollouts, and regulatory pushes for financial inclusion. Wave solidified its institutional position by
              securing an electronic money issuer licence from the Central Bank of West African States (BCEAO) in April
              2022 and launching Wave Bank Africa S.A. in Côte d'Ivoire, supported by a USD 137 million debt facility.
              However, geographic expansion beyond Senegal and Côte d'Ivoire encounters steep structural friction. In
              Cameroon, Wave has struggled to gain rapid traction as entrenched incumbents Orange and MTN aggressively
              defend agent exclusivity and pricing corridors. Furthermore, cross-border interoperability remains
              fragmented across regional monetary unions, forcing fintechs to navigate dual regulatory scrutiny as both
              payments facilitators and deposit-taking banking entities.
            claimRefs:
              - CM009
              - CM013
              - CM015
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Transaction Velocity Diverges from Net Operator Monetization
            body: >-
              While macro industry statistics track trillions of dollars in annual African mobile money payments flow,
              Wave's radical pricing model decouples volume from gross margin. By keeping deposits, withdrawals, and
              bill payments free while taking only 1% on transfers, Wave drives massive user adoption but captures only
              a narrow fraction of total wallet volume as top-line revenue.
            calloutType: insight
            claimRefs:
              - CM003
              - CM006
              - CM007
          - type: callout
            title: Incumbent Telco Retaliation and Multi-Country Regulatory Bottlenecks
            body: >-
              Wave's rapid domestic conquest in Senegal cannot be assumed across all target expansion markets. In
              Cameroon and broader Central Africa, incumbent operators Orange and MTN have aggressively defended their
              agent and distribution moats, while multi-country regulatory hurdles and banking compliance raise
              operating capital intensity.
            calloutType: risk
            claimRefs:
              - CM013
              - CM015
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Peer Profiles
        blocks:
          - type: paragraph
            body: >-
              The competitive landscape for mobile money across Sub-Saharan Africa is bifurcated between incumbent
              telecom operators who historically treated mobile financial services as an extractive churn-reduction
              utility, and specialized fintech challengers pursuing independent scale. In Francophone West Africa, Wave
              emerged from its initial 2017 Senegal deployment to challenge entrenched mobile network operators
              including Orange Money, MTN Mobile Money, and Airtel Money, alongside regional giant Safaricom's M-Pesa in
              East Africa. While legacy telecom operators dominated via subscriber-base ownership and ubiquitous airtime
              distribution, traditional commercial banks remained functionally irrelevant to the unbanked majority due
              to high maintenance fees, distant physical branches, and onerous identity documentation requirements. Wave
              restructured this dynamic by operating as an unbundled, low-cost financial utility, scaling its footprint
              to millions of active users across nine African countries. However, unlike telecom carriers who subsidize
              infrastructure through voice and mobile data revenue, standalone fintechs must support their entire agent
              liquidity, compliance, and device management overhead strictly from financial transaction volume.
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP005
              - CP011
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP011
              - CP013
      - number: '3.2'
        title: Capability Parity and Channel Distribution
        blocks:
          - type: paragraph
            body: >-
              A critical structural differentiation between Wave and incumbent telco carriers lies in infrastructure
              architecture and agent distribution topology. While Orange and MTN traditionally relied on
              telecom-controlled USSD menus that incurred carrier access friction and offered rudimentary user
              experiences, Wave introduced a modern smartphone application paired with physical QR-code cards for
              feature-phone users and offline-assisted transactions. To support offline resilience in areas with fragile
              connectivity, Wave deployed proprietary device policy management across a heterogeneous fleet and
              established a non-exclusive agent network exceeding 150,000 physical access points across West Africa.
              Furthermore, Wave eliminated utility bill payment fees, allowing consumers to purchase electricity tokens
              such as Senelec Woyofal in Senegal without extra surcharges. To insulate its operations against carrier
              channel foreclosure and arbitrary USSD pricing, Wave secured a direct Electronic Money Institution license
              from BCEAO in April 2022 and launched Wave Bank Africa S.A. in Côte d'Ivoire, establishing regulatory
              parity with institutional banks.
            claimRefs:
              - CP004
              - CP005
              - CP009
              - CP012
          - type: table
            tableRef: TP002
            claimRefs:
              - CP004
              - CP005
              - CP009
              - CP012
      - number: '3.3'
        title: Pricing Mechanics and Incumbent Retaliation
        blocks:
          - type: paragraph
            body: >-
              Wave's rapid disruption of West African mobile money was catalyzed by an aggressive pricing model that
              eliminated the complex fee schedules historically enforced by telecom monopolies. Prior to Wave's market
              entry, sending and withdrawing money across Senegal cost consumers between 5% and 8% of the principal
              transaction amount. Wave replaced these tiered deductions with a simple flat fee of 1% on peer-to-peer
              transfers, while making cash deposits, cash withdrawals, and bill payments entirely free. This pricing
              collapse catalyzed massive consumer adoption, allowing Wave to capture over 50% market share in Senegal
              within four years and forcing dominant incumbent Orange Money to slash its transaction fees by nearly 80%
              to stem customer defection. Nonetheless, this aggressive price leadership creates severe economic
              compression for Wave's distribution chain. In Côte d'Ivoire, compressed commission margins triggered
              temporary agent strikes and service halts, illustrating that when cash movement becomes almost free to the
              consumer, the structural cost of maintaining physical liquidity across thousands of independent shops
              strains the fintech's operating margins.
            claimRefs:
              - CP001
              - CP003
              - CP006
              - CP007
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP001
              - CP003
              - CP006
              - CP007
              - CP008
              - CP014
      - number: '3.4'
        title: Differentiation Durability and Expansion Barriers
        blocks:
          - type: paragraph
            body: >-
              While Wave proved that a 1% flat pricing structure could shatter an unprepared telecom monopoly in
              Senegal, the durability of its competitive moat faces severe headwinds as it attempts to scale into
              secondary markets. In markets like Uganda and Cameroon, incumbent carriers MTN and Orange had witnessed
              the Senegalese disruption and prepared aggressive competitive defenses, leveraging established agent
              exclusivity, bundled airtime promotions, and regulatory lobbying. Consequently, Wave's geographic
              expansion in Uganda resulted in an operating loss of $3.78 million in 2024 despite generating meaningful
              top-line transaction volume, while in Cameroon the company has struggled over the past year to establish
              an agent foothold against entrenched telco networks. Furthermore, cross-border continental expansion in
              African fintech entails massive capital requirements, as evidenced by Safaricom's M-Pesa incurring over
              $364 million in after-tax losses during its FY2026 Ethiopian rollout. Because Wave's 1% model permanently
              established low fees as the baseline consumer expectation, the company cannot easily raise prices to
              offset rising expansion costs, creating a strategic imperative to monetize adjacent banking, SME credit,
              and merchant acquiring services.
            claimRefs:
              - CP004
              - CP005
              - CP008
              - CP010
              - CP013
              - CP014
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP004
              - CP005
              - CP009
              - CP010
              - CP014
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Pricing Trap and Margin Compression
            body: >-
              Wave's core disruption—making money movement virtually free—has permanently shifted consumer expectations
              across West Africa. Because raising fees to 2% or 3% would immediately open the door for telecom
              retaliation, Wave is structurally locked into thin transaction margins and must cross-sell credit and
              merchant acquiring to achieve long-term corporate profitability.
            calloutType: risk
            claimRefs:
              - CP001
              - CP006
              - CP014
          - type: callout
            title: The Preparedness Asymmetry in Expansion Markets
            body: >-
              Wave's dramatic conquest of Senegal occurred because Orange operated an unhedged monopoly with extractive
              pricing and sluggish innovation. In subsequent expansion markets like Uganda and Cameroon, incumbents MTN
              and Orange were fully alerted, aggressively defending agent exclusivity and matching low-tier pricing to
              inflict multi-million dollar operating losses on the challenger.
            calloutType: insight
            claimRefs:
              - CP003
              - CP004
              - CP008
              - CP010
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams & Monetization Model
        blocks:
          - type: paragraph
            body: >-
              Wave Mobile Money has disrupted the West African retail payments landscape by pioneering an aggressive,
              consumer-friendly monetization model. Unlike incumbent mobile network operators who historically levied
              tiered fees ranging from 3% to 10% on domestic money transfers, Wave instituted a flat 1% transaction fee
              on outgoing peer-to-peer (P2P) transfers while providing cash deposits, cash withdrawals, and utility bill
              payments completely free of charge to retail consumers. This radical pricing asymmetry eliminated friction
              for mass-market users, accelerating digital financial inclusion across unbanked populations by
              substantially lowering financial transfer costs. To diversify its revenue base beyond consumer P2P
              transfer fees, Wave enables instant mobile airtime purchases and has established public-sector and utility
              integrations, such as partnering with Senegal's Ministry of Health to digitize public health facility
              payments. However, because deposits and withdrawals remain unmonetized at the retail layer, Wave relies
              almost entirely on transaction velocity and aggregate P2P transfer volumes to generate gross top-line fee
              revenue.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
