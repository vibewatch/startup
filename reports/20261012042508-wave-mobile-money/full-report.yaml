              - CU007
              - CU012
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Disruptive Flat-Fee Model as a Customer Acquisition Engine
            body: >
              Wave restructured West African mobile money by replacing legacy telco fee tiers (5–7%) with a flat 1%
              withdrawal fee and free P2P transfers. This aggressive pricing drove rapid customer adoption across
              Senegal and Côte d'Ivoire, forcing incumbent telecom operators into defensive price cuts.
            calloutType: insight
            claimRefs:
              - CU001
              - CU003
              - CU005
          - type: callout
            title: Expansion Headwinds and Telecom Incumbent Resistance
            body: >
              While Wave commands dominant market share in Senegal and Côte d'Ivoire, geographic expansion into Central
              Africa faces severe resistance. In Cameroon, entrenched telcos Orange and MTN have defended their agent
              networks and distribution channels, constraining Wave's customer acquisition velocity.
            calloutType: risk
            claimRefs:
              - CU011
              - CU014
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory Mandates, Fee Caps, and Dual Banking Oversight
        blocks:
          - type: paragraph
            body: >-
              Wave Mobile Money operates in an increasingly stringent regulatory environment across the West African
              Economic and Monetary Union (WAEMU). Historically, Wave disrupted the regional market by offering a flat
              1% peer-to-peer transfer fee alongside free deposits, withdrawals, and bill payments. However, the Central
              Bank of West African States (BCEAO) has intensified fee regulations, capping mobile money transfer fees at
              0.8% above 8,000 CFA francs daily and mandating free transfers below that threshold. Furthermore,
              participation in the regional instant interoperable payment system PI-SPI was made mandatory ahead of a
              November 2, 2026 deadline. Wave delayed joining PI-SPI until October 2026, as free interoperability
              threatens to erode its core fee-based pricing moat. To adapt to these structural margin pressures, Wave
              incorporated Wave Bank Africa S.A. in Côte d'Ivoire with 20 billion CFA francs (approximately USD 35
              million) in capital, subjecting the company to dual regulatory oversight as both a licensed fintech and a
              commercial bank.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR007
              - CR013
          - type: table
            tableRef: TR001
            claimRefs:
