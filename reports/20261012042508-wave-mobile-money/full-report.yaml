  - id: TV001
    title: Recommendation summary table
    columns:
      - Metric / Dimension
      - Stance / Rating
      - Evidence Basis
      - Decision Implication
    rows:
      - - Recommendation
        - Track
        - >-
          Over 20 million active users across 8 markets contrasted with unverified consolidated revenue and EBITDA
          disclosures.
        - Maintain watchlist monitoring; defer capital commitment until audited financial reporting is accessible.
      - - Confidence
        - Medium
        - >-
          Primary DFI debt filings from IFC and BII verify operating scale, but equity cap table and margins remain
          private.
        - Sufficient evidence for debt and operating benchmarks; inadequate for unpriced common equity commitment.
      - - Risk Rating
        - High
        - >-
          Tight 1% pricing take-rate, sovereign currency exposure, and active telco incumbent retaliation in expansion
          territories.
        - Requires protective debt covenants or liquidation preferences before entering capital structure.
      - - Valuation Stance
        - Stretched
        - >-
          Historical $1.7B Series A post-money valuation from 2021 is unanchored by fresh equity rounds or public
          secondary marks.
        - Resist pricing entry at unicorn parity without audited unit economics and cash burn metrics.
    notes: >-
      Recommendation and risk assessment synthesized from institutional debt filings, DFI disclosures, and regional
      operating metrics as of 2026-10.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Pillar
      - Thesis Argument
      - Anti-Thesis Risk
      - Falsification Trigger
    rows:
      - - Scale & Adoption
        - Over 20 million active users and 150,000 agents built on high-velocity 1% peer-to-peer mobile payments.
        - Flat 1% fee limits gross revenue capture while agent commissions and cash logistics consume operating margins.
        - Monthly active user contraction or agent attrition exceeding 15% year-over-year in Senegal or Côte d'Ivoire.
      - - Capital Structure
        - >-
          Secured €117 million in institutional debt from RMB and DFIs to finance working capital without equity
          dilution.
        - >-
          Commercial bank syndicates lacked risk appetite without DFI backing, underscoring unproven standalone
          creditworthiness.
        - Debt service stress, covenant breach, or inability to refinance DFI credit facilities at commercial maturity.
      - - Licensing & Moat
        - >-
          Direct BCEAO electronic money institution licence and Wave Bank Africa S.A. bypass telco-controlled USSD
          rails.
        - >-
          Dual regulation as a banking and electronic money entity increases reserve capital requirements and compliance
          overhead.
        - Regulatory revocation of EMI standing or central bank restrictions on non-bank deposit-taking activities.
      - - Geographic Expansion
        - Expanding footprint beyond Senegal and Côte d'Ivoire across Mali, Burkina Faso, Gambia, and Central Africa.
        - Incumbents Orange and MTN defend positions fiercely, causing Wave to struggle for market traction in Cameroon.
        - Market share stagnation or permanent operational exit from secondary expansion markets like Cameroon.
    notes: >-
      Core investment debate juxtaposing operational scale against capital intensity, margin pressure, and regional
      competition.
    claimRefs:
      - CV002
      - CV003
      - CV006
      - CV007
      - CV008
      - CV009
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Core Operating Assumptions
      - Implied Valuation / Return Logic
      - Downside Triggers & Risks
      - Probability Signal
    rows:
      - - Bull Case
        - >-
          Active users scale beyond 30M; Wave Bank Africa monetizes lending and corporate payments; successful AfCFTA
          corridor expansion.
        - >-
          Implied valuation of $2.5B to $3.0B based on revenue diversification and high-margin financial services
          adoption.
        - Regulatory delay in commercial banking approvals or credit underwriting losses in new markets.
        - 25% (Conditional on banking cross-sell and sustained transaction volume).
      - - Base Case (Current Track)
        - >-
          Active users stabilize at 20M to 24M; Senegal and Côte d'Ivoire remain core volume drivers; secondary markets
          show moderate progress.
        - >-
          Implied valuation of $1.5B to $1.7B, preserving Series A parity through debt financing support but capped by
          fee ceilings.
        - Agent commission inflation or increased customer acquisition costs in competitive territories.
        - 55% (Reflects verified customer scale counterbalanced by private equity illiquidity).
      - - Bear Case
        - >-
          Telco fee retaliation matches zero-fee cash movements; Cameroon operations fail; severe regional currency
          devaluations.
        - Valuation compresses to $700M to $900M, representing a down-round correction of 45% to 60% vs Series A mark.
        - Debt covenant breach, severe agent liquidity shortages, or hostile regulatory interventions.
        - 20% (Triggered by competitive fee wars or regulatory lockouts).
    notes: >-
      Scenario valuation matrix based on revenue monetization, competitive dynamics with regional telcos, and debt
      service capacity.
    claimRefs:
      - CV003
      - CV005
      - CV008
      - CV010
      - CV011
      - CV012
