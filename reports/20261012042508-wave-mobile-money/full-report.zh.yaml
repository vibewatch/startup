              难以对抗积极守住代理流动性和用户忠诚度的电信双寡头。西非农村地区的无线连接间歇、电力中断和智能手机拥有率低等基础设施瓶颈，也造成限制自然数字采用的首公里摩擦。更重要的是，Wave 没有披露经审计的 cohort
