        title: 收入来源与变现模式
        blocks:
          - type: paragraph
            body: >-
              Wave Mobile Money 以激进且对消费者友好的变现模式颠覆西非零售支付。传统移动网络运营商过去对国内转账收取 3% 至 10% 的分层费用；Wave 则对外发点对点（P2P）转账统一收取
              1%，同时让零售消费者免费存入现金、提现和支付公用事业账单。这种定价不对称大幅降低了大众用户的转账成本，加速无银行账户人群的数字金融普惠。为超越消费者 P2P 转账费拓展收入，Wave
              支持即时移动通信时长购买，并接入公共部门和公用事业，例如与 Senegal Ministry of Health 合作，将公共医疗机构支付数字化。但由于零售端存款和提现不变现，Wave 几乎完全依靠交易频次和
              P2P 总转账量产生收入。
