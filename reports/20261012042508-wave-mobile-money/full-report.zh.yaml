chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与核心运营模式
        blocks:
          - type: paragraph
            body: >-
              Wave Mobile Money
              是一家非洲移动金融服务平台，旨在传统银行覆盖有限的市场，建设高度普惠且低成本的金融基础设施。公司颠覆了电信运营商主导的移动货币定价框架：钱包存款、点对点转账和公用事业账单支付均免费，只有在代理网点提现时收取统一
              1% 的交易费。以消费者为先的透明费率推动用户快速增长，平台自报账户数已超过 21
              million。但这种定位也带来结构性商业张力：交易收入主要集中在实体提现；随着经济数字化、商户支付和账户间结算减少实体现金转换需求，Wave 的单位利润率会受到挤压。
            claimRefs:
              - CO001
              - CO004
              - CO009
              - CO012
          - type: table
            tableRef: TO001
            claimRefs:
              - CO005
              - CO007
              - CO009
              - CO012
      - number: '1.2'
        title: 创始人、领导层治理与关键人物风险
        blocks:
          - type: paragraph
            body: >-
              Wave Mobile Money 由 CEO Drew Durbin 联合创办。Durbin 此前将数字跨境汇款服务 Sendwave 建成非洲最大的汇款通道之一，之后才创立 Wave
              的独立国内支付平台。法语西非的日常运营由区域及公共事务总监 Coura Sene 负责；她在电信运营商、移动金融机构和保险承保机构拥有超过 20 年高管经验，负责监管沟通和政策战略。Wave 在
              Senegal、Côte d’Ivoire、Uganda、Gambia、Sierra Leone、Mali 和 Burkina Faso 的治理高度依赖本地合规团队及一线代理主管。不过，公司仍明显依赖
              Durbin 的战略愿景，以及 Sene 在西非央行体系中的监管资源。
            claimRefs:
              - CO002
              - CO003
              - CO010
          - type: table
            tableRef: TO002
            claimRefs:
              - CO002
              - CO003
              - CO010
      - number: '1.3'
        title: 资本结构、债务融资与估值概况
        blocks:
          - type: paragraph
            body: >-
              Wave 在 September 2021 完成标志性的 Series A 融资，以 $1.7 billion post-money valuation
              确立基准股权估值，成为首家在法语西非创立的科技独角兽。2022 年 4 月，公司从 Central Bank of West African States（BCEAO）取得直接 Electronic Money
              Institution 牌照，摆脱对第三方商业银行担保的依赖。2025 年 6 月，Wave 通过 Rand Merchant Bank 安排的 €117 million（$137
              million）债务授信进一步多元化资本结构，British International Investment、Finnfund 和 Norfund 等开发金融机构参与其中。这笔资金支持 Wave 在 Côte
              d’Ivoire 设立 Wave Bank Africa S.A.，推动业务转向资产负债表驱动的运营，同时也使其暴露于可能削弱自有网络优势的 BCEAO 支付互操作规则。
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
              - CO013
          - type: table
            tableRef: TO003
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
              - CO013
      - number: '1.4'
        title: 运营规模、里程碑与区域扩张阻力
        blocks:
          - type: paragraph
            body: >-
              Wave 覆盖七个核心非洲国家，并由超过 100,000 名活跃现金代理组成的分销网络支撑，在 Dakar、Abidjan 等主要都市通道实现高密度流动性管理。为扩大国际汇款流入，Wave
              接入全球支付基础设施提供商 TerraPay，可将跨境资金即时转入收款人的移动钱包。这种线上线下扩张延续了移动支付填补西非正规银行体系缺口的历史路径，包括 Sierra Leone
              的紧急灾害补偿项目。然而，公司在 UEMOA 核心市场之外扩张时遭遇运营阻力：尽管 2025 年通过 Commercial Bank Cameroon 获得运营授权，Wave 在 Cameroon
              仍难以对抗资本充足的 Orange 和 MTN，必须防守性地调整扩张路线图。
            claimRefs:
              - CO006
              - CO009
              - CO010
              - CO011
              - CO014
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO001
              - CO002
              - CO004
              - CO006
              - CO007
              - CO008
              - CO010
              - CO011
      - number: '1.5'
        title: 展示项
        blocks:
          - type: callout
            title: 反向定价模型驱动获客
            body: >-
              Wave 取消了开户、现金存入、点对点转账和公用事业账单支付的费用，只通过代理提现收取 1% 费用，从而颠覆西非传统电信移动货币服务。透明费率推动账户数超过 21
              million，但也让运营依赖提现量；随着数字支付基础设施成熟，利润率面临压缩。
            calloutType: insight
            claimRefs:
              - CO001
              - CO004
              - CO009
              - CO012
          - type: callout
            title: 监管互操作性与区域竞争阻力
            body: >-
              Wave 的运营护城河建立在超过 100,000 个实体代理网点的流动性管理能力，以及直接 BCEAO 电子货币牌照之上。但即将实施的 BCEAO
              区域互操作监管会降低传统商业银行的进入门槛；与此同时，Cameroon 的 Orange 和 MTN 仍在强力守住分销网络。
            calloutType: risk
            claimRefs:
              - CO006
              - CO009
              - CO011
              - CO013
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与交易范围
        blocks:
          - type: paragraph
            body: >-
              非洲移动货币市场主要由现金存入、现金提现（CICO）代理分销和国内点对点（P2P）转账构成，而不是传统卡组织交换费或透支银行业务。Wave
              将竞争边界设在法语西非的低成本移动货币通道，聚焦高频消费者钱包转账和零售商户支付。Orange、Free、Expresso Telecom 等传统电信运营商过去每笔交易最高收取 10%
              费用，形成了宽松的定价空间。Wave 以免费存款、免费提现、免费公用事业账单支付和统一 1% P2P
              转账费打破这一结构。该边界纳入日常消费者钱包交易、账单支付和现金流动性管理，但排除资本密集型商业贷款、复杂企业资金管理和传统信用卡处理。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM010
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM010
      - number: '2.2'
        title: 可寻址规模视角：宏观流量与可变现服务收入
        blocks:
          - type: paragraph
            body: >-
              评估非洲移动货币机会时，必须区分宏观支付总额与钱包运营商的费用池。按行业服务收入计算，独立市场分析认为非洲移动货币行业在 2024 年约为 USD 800 million，并将以 18.00%
              的复合年增长率增长至 2033 年的 USD 3.55 billion。相比之下，GSMA 的宏观支付流量数据显示，全球移动货币交易金额在 2023 年增长 14% 至 USD 1.4 trillion，覆盖
              435 million 个月活账户；年度交易量增长 23% 至 85 billion 笔。撒哈拉以南非洲占据多数交易，移动网络运营商模式和 USSD 基础设施因智能手机渗透率低、网络连接有限而占主导。Wave
              在八个运营国家的可服务市场只是这类流量中的一个细分领域：用户交易频次高，但运营商变现受限。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM007
              - CM014
      - number: '2.3'
        title: 移动通道中的买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              Wave 各运营地区的采用动力和支付流程并不相同。第一类用户是非正式零售消费者和无银行账户家庭，区域人口过去有超过 85%
              没有正式商业银行账户。对他们而言，移动钱包就是默认的交易和储蓄账户，直接节省相对于传统电信运营商的费用是采用触发点。第二类是非正式社区商户和代理
              kiosks，它们像分散式银行网点一样运营，靠现金流动性而非软件许可变现。第三类包括机构账单收款方、公用事业公司和政府部门，例如与 Wave 合作、将公共医疗机构收费永久数字化的 Senegal Ministry
              of Health。最后，全球支付聚合商接入移动钱包 API，为农村通道提供顺畅的跨境付款和法币发放。
            claimRefs:
              - CM004
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM004
              - CM010
              - CM011
              - CM012
      - number: '2.4'
        title: 宏观增长驱动、传统运营商摩擦与扩张约束
        blocks:
          - type: paragraph
            body: >-
              行业扩张受智能手机降价、4G 网络铺设和金融普惠监管推动。Wave 于 2022 年 4 月取得 Central Bank of West African States（BCEAO）电子货币发行牌照，并在
              Côte d’Ivoire 设立 Wave Bank Africa S.A.，由 USD 137 million 债务授信支持，从而巩固了机构地位。但扩张到 Senegal 和 Côte d’Ivoire
              以外时，公司面临强烈结构性摩擦。在 Cameroon，Orange 和 MTN 等根深蒂固的运营商积极守住代理商排他性和定价通道，Wave 难以快速获得
              traction。跨境互操作性也仍受区域货币联盟分割，金融科技公司必须同时面对支付促进者和吸收存款银行实体两套监管审查。
            claimRefs:
              - CM009
              - CM013
              - CM015
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 交易频次与运营商净变现背离
            body: >-
              宏观行业统计记录了非洲移动货币每年数万亿美元的支付流量，但 Wave 的激进定价模式切断了交易量与毛利率之间的联系。存款、提现和账单支付免费、转账仅收 1%，让 Wave
              获得大量用户，却只能将钱包总量中的很小一部分转化为收入。
            calloutType: insight
            claimRefs:
              - CM003
              - CM006
              - CM007
          - type: callout
            title: 传统电信反击与多国监管瓶颈
            body: >-
              Wave 在 Senegal 的快速本土扩张不能直接外推到所有目标市场。在 Cameroon 和更广泛的中非地区，Orange、MTN
              等传统运营商积极守住代理和分销护城河；多国监管障碍及银行合规要求也推高运营资本强度。
            calloutType: risk
            claimRefs:
              - CM013
              - CM015
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局与同业画像
        blocks:
          - type: paragraph
            body: >-
              撒哈拉以南非洲的移动货币竞争分成两类：传统电信运营商过去将移动金融服务当作降低流失的收费工具；专业金融科技公司则追求独立扩张。在法语西非，Wave 自 2017 年在 Senegal 首次部署后，开始挑战
              Orange Money、MTN Mobile Money、Airtel Money 等根深蒂固的移动网络运营商；东非则有区域巨头 Safaricom 的
              M-Pesa。传统电信运营商凭借用户基数和无处不在的通信时长分销占据主导，但高维护费、网点遥远和繁琐的身份文件要求，让传统商业银行对多数无银行账户人群几乎没有作用。Wave
              以拆分式、低成本金融基础设施重塑这一格局，已将业务扩展至九个非洲国家的数百万活跃用户。不过，电信运营商可以用语音和移动数据收入补贴基础设施，独立金融科技公司却只能依靠金融交易量承担代理流动性、合规和设备管理的全部成本。
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP005
              - CP011
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP011
              - CP013
      - number: '3.2'
        title: 能力对等与渠道分销
        blocks:
          - type: paragraph
            body: >-
              Wave 与传统电信运营商的关键结构差异，在于基础设施架构和代理分销拓扑。Orange、MTN 过去依赖电信控制的 USSD 菜单，用户体验简单且存在运营商接入摩擦；Wave
              则推出现代智能手机应用，为功能手机用户配备实体二维码卡，并支持离线辅助交易。为提高连接脆弱地区的离线韧性，Wave 在异构设备群上部署专有设备策略管理，并建立超过 150,000
              个实体接入点的非排他性代理网络。Wave 还取消公用事业账单支付费，使 Senegal 消费者可以购买 Senelec Woyofal 电力代币而无需额外附加费。为避免运营商关闭渠道或任意提高 USSD
              价格，Wave 于 2022 年 4 月取得 BCEAO 直接 Electronic Money Institution 牌照，并在 Côte d’Ivoire 设立 Wave Bank Africa
              S.A.，实现与机构银行相当的监管地位。
            claimRefs:
              - CP004
              - CP005
              - CP009
              - CP012
          - type: table
            tableRef: TP002
            claimRefs:
              - CP004
              - CP005
              - CP009
              - CP012
      - number: '3.3'
        title: 定价机制与传统运营商反击
        blocks:
          - type: paragraph
            body: >-
              Wave 以激进定价颠覆西非移动货币，取消了电信垄断者过去执行的复杂费率表。Wave 进入市场前，Senegal 消费者发送和提现金额要支付本金的 5% 至 8%。Wave 用点对点转账统一 1%
              费率取代分层扣费，同时让现金存入、现金提现和账单支付全部免费。这种定价坍塌带来大规模采用，使 Wave 在四年内拿下 Senegal 超过 50% 的市场份额，并迫使主导者 Orange Money
              将交易费削减近 80% 以阻止客户流失。但激进的价格领导也严重挤压了 Wave 的分销链。在 Côte
              d’Ivoire，佣金空间收窄曾引发代理商罢工和服务暂停，说明当现金流动对消费者几乎免费时，维持数千家独立商铺实体流动性的结构性成本会侵蚀金融科技公司的运营利润。
            claimRefs:
              - CP001
              - CP003
              - CP006
              - CP007
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP001
              - CP003
              - CP006
              - CP007
              - CP008
              - CP014
      - number: '3.4'
        title: 差异化持久性与扩张壁垒
        blocks:
          - type: paragraph
            body: >-
              Wave 证明统一 1% 定价可以击穿 Senegal 准备不足的电信垄断，但其进入二线市场时，竞争护城河受到严重冲击。在 Uganda、Cameroon 等市场，MTN 和 Orange 已见识过
              Senegal 的颠覆，并通过代理排他性、通信时长捆绑促销和监管游说提前布防。因此，Wave 在 Uganda 的扩张虽产生了可观交易收入，却在 2024 年录得 $3.78 million 运营亏损；在
              Cameroon，公司过去一年也难以对抗根深蒂固的电信网络建立代理立足点。非洲金融科技的跨境扩张还需要巨额资本，Safaricom 的 M-Pesa 在 FY2026 埃塞俄比亚推广期间税后亏损超过 $364
              million 就是例证。由于 Wave 的 1% 模式永久把低费率设为消费者预期，公司很难提价抵消扩张成本，只能设法从相邻的银行、SME 信贷和商户收单服务变现。
