      - number: '4.2'
        title: 成本结构与代理网络单位经济
        blocks:
          - type: paragraph
            body: >-
              Wave 商业模式能否持续，取决于严格的运营纪律和代理网络管理。零售用户免费存取实体货币，因此 Wave
              承担传统运营商转嫁给消费者的现金处理和流动性再平衡负担。公司通过大量独立第三方代理提供服务，并以佣金补偿代理商维持本地现金和电子货币流动性。行业分析认为，Wave
              以超低消费者价格换取快速份额增长，但代价是极薄的单位利润率，必须不断扩大规模并严格控制成本。零售分销偏现金的特征持续造成单位经济压力：高额代理支出和底层运营商基础设施成本会压缩净运营利润，除非巨大的交易吞吐量能够抵消。绕开传统卡组织交换费可以省掉标准卡处理费用，但在
              1% take-rate 上限下维持代理忠诚和运营流动性，仍是结构性挑战。
            claimRefs:
              - CI005
