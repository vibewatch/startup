              为支付资本密集型扩张并支持多司法辖区的运营流动性，Wave 已在六轮披露融资中累计筹资 $439 million。相比以风险投资支持的股权起点——包括 2021 年 $200 million Series
              A——Wave 越来越依赖大规模债务资本支持资产负债表。2025 年 6 月，公司取得由 Rand Merchant Bank 主导的 $137 million 债务授信，British
              International Investment、Norfund 和 Finnfund 等开发金融机构大量参与。此前，International Finance Corporation 于 2022 年安排了
              $91.5 million 多贷款方债务授信。与此同时，Wave 从纯支付应用转向受监管金融基础设施。依托 2022 年 4 月获得的 Central Bank of West African
              States（BCEAO）电子货币发行牌照，公司于 2025 年在 Côte d’Ivoire 设立 Wave Bank Africa S.A.
              商业银行。银行化转型提供了吸收存款和企业资金管理的监管框架，但也带来双重监管、更高资本准备金要求和债务偿付义务。
