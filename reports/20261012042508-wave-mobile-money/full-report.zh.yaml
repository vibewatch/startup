  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与消费者流程
        blocks:
          - type: paragraph
            body: >
              Wave 运营一个数字金融平台，旨在取代西非的现金和传统电信移动货币网络。核心消费者产品是 iOS 和 Android 智能手机应用，支持国内点对点转账、商户支付、账单支付和通信时长充值。Wave
              对资金转账收取统一 1% 费用，但代理网络的现金存入和提现对零售用户免费；账单支付也不收消费者附加费，消除了 Orange Money、MTN MoMo
              等传统电信运营商常见的费率摩擦。没有智能手机或存在数字素养障碍的用户，可使用 Wave 提供的实体二维码卡，由本地代理扫描、识别并即时执行现金存入和提现。Senegal、Côte
              d'Ivoire、Mali、Burkina Faso、Uganda 和 The Gambia 等运营地还提供嵌入核心体验的免费电话客服。
