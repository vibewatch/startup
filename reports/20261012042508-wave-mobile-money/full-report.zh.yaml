  - id: FI001
    title: Wave 收入与单位经济交易流
    type: flow
    summary: 展示资金与费用捕获从客户现金存入、经 1% P2P 转账变现，到扣除代理佣金和运营费用的流程。
    data:
      nodes:
        - id: cash-in
          label: 客户现金存入
          detail: 消费者在本地代理点柜台存入实物货币；用户无需付费。
        - id: wallet-issuance
          label: 电子货币钱包入账
          detail: 依据 BCEAO 非银行电子货币牌照发放的数字钱包余额。
        - id: p2p-transfer
          label: P2P 资金转账
          detail: 用户通过移动应用或 QR 卡通道向另一收款人发送数字资金。
        - id: gross-revenue
          label: 1% 总费率捕获
          detail: Wave 按转账金额收取固定 1% 费用，这是主要收入通道。
        - id: agent-commission
          label: 代理佣金扣除
          detail: 向独立代理网络支付流动性供应与交易处理费用。
        - id: network-compliance
          label: 电信与合规费用
          detail: 包括底层 SMS、运营商连接、央行报告及 AML / KYC 成本。
        - id: net-margin
          label: 单位净贡献
          detail: 留存的剩余运营利润，用于承担公司管理费用与债务融资。
    approximationNotes: 流程顺序反映运营变现模型；各阶段的量化成本扣除属非公开信息，未予列出。
    claimRefs:
      - CI001
      - CI002
      - CI005
      - CI006
      - CI007
      - CI010
  - id: FE001
    title: Wave Mobile Money 技术与运营栈
    type: stack
    summary: 将 Wave 移动货币平台从用户界面到结算通道拆解为五层架构。
    data:
      layers:
        - label: 客户应用与接入层
          detail: 原生 iOS / Android 消费者应用及实体 QR 卡，服务低识字率用户与非智能手机用户。
        - label: 代理网络与销售点层
          detail: 专有代理应用支持 QR 辅助现金存入、免费提现及客户开户。
        - label: 核心交易处理与账本
          detail: 可扩展的现代微服务账本，处理实时余额核验、欺诈评分与费用计算。
        - label: 客户协助与支持通道
          detail: 在法语西非各地提供专用全国免费电话集成与人工支持台。
        - label: 监管合规与身份层
          detail: 按区域央行标准执行客户识别、AML / KYC 核查与交易监控。
        - label: 机构结算与银行层
          detail: BCEAO 电子货币机构牌照通道与 Wave Bank Africa S.A. 商业银行基础设施。
    approximationNotes: 架构层综合技术审查、牌照披露及产品规格得出。
    claimRefs:
      - CE001
      - CE004
      - CE006
      - CE009
      - CE010
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 六阶段生命周期图，描绘零售消费者开户、交易采用及企业用途扩展循环。
    data:
      items:
        - label: 发现与应用开户
          detail: 消费者使用任意有效电信 SIM 卡下载智能手机应用；通过国民身份证（CNI）验证注册。
          touchpoints:
            - 智能手机应用商店下载
            - 国民身份证件验证
            - 免费客户支持开户
          tone: positive
        - label: 首公里代理现金存入
          detail: 消费者前往本地零售代理点，将现金存入数字钱包且无需支付交易费。
          touchpoints:
            - 实体代理零售柜台
            - QR 码或电话号码识别
            - 即时 SMS / 应用内存入确认
          tone: positive
        - label: P2P 资金转账执行
          detail: 消费者以透明的固定 1% 费用向家人或商业联系人发起境内点对点转账。
          touchpoints:
            - 应用内联系人选择
            - 实时费用计算显示（1%）
            - 即时收款人通知
          tone: positive
        - label: 公用事业与账单支付采用
          detail: 活跃钱包用户开始支付周期性家庭公用事业账单（电力、水、电视），且不收附加费。
          touchpoints:
            - CIE 与 SODECI 账单方集成
            - Canal+ 电视订阅续费
            - Woyofal 电力代币购买
          tone: positive
        - label: 商户 QR 码结账
          detail: 用户在应用内扫描 QR 码向本地商户与零售店付款，绕过实物现金处理。
          touchpoints:
            - 商户柜台 QR 码展示
            - 消费者零费率结账
            - 商户交易对账
          tone: neutral
        - label: 跨境与银行业务扩张
          detail: 高阶用户通过 Wave Bank Africa S.A. 使用区域汇款、机构医疗拨款及新兴商业银行产品。
          touchpoints:
            - 区域 UEMOA 跨境走廊
            - 塞内加尔卫生部医疗机构通道
            - Wave Bank 商业存款账户
          tone: neutral
    approximationNotes: 生命周期阶段综合 Wave 产品文档、用户评价及公开合作伙伴公告得出。
    claimRefs:
      - CU001
      - CU002
      - CU007
      - CU012
