  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层与价值主张
        blocks:
          - type: paragraph
            body: >
              Wave 将客户生态分为三类主要用户：大众零售消费者、本地零售代理运营商和机构公用事业账单收款方。对零售消费者而言，平台主要是用于国内汇款、公用事业账单结算和通信时长充值的低价数字钱包。Wave
              的核心价值在于激进定价：终端用户免费存款和支付账单，点对点转账和提现统一收取 1%。相比 Orange Money、MTN MoMo 历来收取的 5% 至 7% 分层费率，这一结构便宜 70% 至
              80%。Wave 将用户账户与特定电信运营商 SIM 卡解耦，任何持有效国民身份证（CNI）的智能手机用户都能跨网络交易。这种开放模式推动 Senegal 和 Côte d’Ivoire
              城市及城郊居民大量换用，并迫使法语西非传统电信运营商防守性降费。
            claimRefs:
              - CU001
