    approximationNotes: 风险评分综合已披露监管要求、银行资本文件及 WAEMU、CEMAC 市场的竞争对手费率调整得出。
    claimRefs:
      - CR001
      - CR004
      - CR006
      - CR010
      - CR012
      - CR014
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 将运营规模、资本结构、扩张风险及估值不透明度连接至“跟踪”建议的逻辑决策流。
    data:
      nodes:
        - id: scale
          label: 运营规模
          description: 覆盖 8 个西非市场，月活用户超过 2,000 万，代理商达 150k。
        - id: pricing
          label: 颠覆性低费率模式
          description: P2P 固定 1% 费率，现金存入与提现免费。
        - id: capital
          label: 依赖债务资本
          description: RMB 与 DFI 牵头的 €117M 债务轮，为营运资金需求提供融资。
        - id: expansion-risk
          label: 扩张阻力
          description: 喀麦隆面临电信商激烈抵制与市场渗透摩擦。
        - id: financial-gap
          label: 财务披露不透明
          description: 缺少经审计的合并收入、毛利率与 EBITDA。
        - id: recommendation
          label: 建议：跟踪
          description: 保持观察名单纪律；在获得经审计指标前暂缓购买股权。
      edges:
        - from: scale
          to: pricing
        - from: pricing
          to: capital
        - from: capital
          to: expansion-risk
        - from: expansion-risk
          to: financial-gap
        - from: financial-gap
          to: recommendation
    approximationNotes: 流程图综合通向“跟踪”立场的定性尽调依赖关系。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV007
      - CV009
      - CV013
