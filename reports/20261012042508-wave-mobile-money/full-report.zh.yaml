        - 55%（已验证的客户规模与非公开股权流动性不足相互抵消）。
      - - 悲观情景
        - 电信商报复性收费追平零费率现金转移；喀麦隆业务失败；区域货币严重贬值。
        - 估值压缩至 $700M 至 $900M，相比 Series A 定价下修 45% 至 60%。
        - 债务契约违约、代理商严重流动性短缺，或监管部门敌意干预。
        - 20%（由竞争性费率战或监管封锁触发）。
    notes: 情景估值矩阵依据收入变现、与区域电信商的竞争动态及偿债能力编制。
    claimRefs:
      - CV003
      - CV005
      - CV008
      - CV010
      - CV011
      - CV012
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: Wave Mobile Money 从 Sendwave 起步到区域银行业务与债务扩张的时间顺序演进。
    approximationNotes: null
    claimRefs:
      - CO001
      - CO002
      - CO004
      - CO006
      - CO007
      - CO008
      - CO010
      - CO011
    data:
      items:
        - date: 2018-01
          label: Sendwave 孵化与分拆
          detail: Drew Durbin 在 Sendwave 成功后，将 Wave 启动为低成本移动货币基础设施项目。
          tone: neutral
        - date: 2020-03
          label: 塞内加尔市场突破
          detail: Wave 在塞内加尔推出激进的 1% 提现费定价，推动消费者与代理网络快速采用。
          tone: positive
        - date: 2021-09
          label: 独角兽地位与 Series A
          detail: Wave 达到 $1.7B 投后估值，成为法语西非首家科技独角兽。
          tone: positive
        - date: 2022-04
          label: BCEAO 电子货币机构牌照
          detail: Wave 直接取得西非国家中央银行电子货币发行牌照，绕过合作银行的监管伞护。
          tone: positive
        - date: 2024-06
          label: 区域走廊版图
          detail: 运营版图覆盖塞内加尔、科特迪瓦、乌干达、冈比亚、塞拉利昂、马里及布基纳法索。
          tone: neutral
        - date: 2025-06
          label: €117M 债务融资
          detail: Rand Merchant Bank、BII、Finnfund 与 Norfund 牵头的财团提供 €117M（$137M）债务额度，用于扩大资产负债表。
          tone: positive
        - date: 2025-10
          label: Wave Bank Africa S.A. 启动
          detail: Wave 在科特迪瓦设立持牌商业银行实体，扩大资产负债表业务与存款产品。
          tone: positive
        - date: 2026-07
          label: 喀麦隆市场阻力
          detail: Wave 在喀麦隆持续遭到在位 MNO Orange 与 MTN 的防御性反制，被迫调整策略。
          tone: negative
  - id: FM001
    title: 市场规模视角
    type: pyramid
    summary: 对比非洲宏观支付流量与 Wave 可触达、已实现变现池的结构化规模层次。
    data:
      items:
        - label: 全球移动货币交易基数
          value: 1400000
          unit: USD M
          detail: GSMA 报告的全球交易价值，覆盖 1.75B 个注册账户。
        - label: 撒哈拉以南非洲交易流
          value: 910000
          unit: USD M
          detail: 估计的区域支付规模，主要由东非与西非移动货币网络贡献。
        - label: 非洲移动货币可触达市场
          value: 800
          unit: USD M
          detail: UnivDatos 估计非洲移动货币服务收入在 2024 年按 18.00% CAGR 增长。
        - label: WAEMU 数字支付走廊费率池
          value: 320
          unit: USD M
          detail: 估计覆盖 BCEAO 八个成员国的可触达支付与汇款费率池。
        - label: Wave 可服务版图（8 个市场）
          value: 220
          unit: USD M
          detail: Wave 活跃于西非 8 国版图的可服务费率收入潜力。
        - label: Wave 已实现年度费率收入
          value: 75
          unit: USD M
          detail: 估计净交易费收取额，受 1% P2P 费率与现金存取零费率限制。
    approximationNotes: 宏观交易量指标代表系统间转移的本金总额；市场规模与收入估算则反映移动钱包运营商收取的净服务费。
    claimRefs:
