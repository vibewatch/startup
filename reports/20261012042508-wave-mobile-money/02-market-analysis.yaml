callouts:
  - calloutType: "insight"
    title: "Transaction Velocity Diverges from Net Operator Monetization"
    body: "While macro industry statistics track trillions of dollars in annual African mobile money payments flow, Wave's radical pricing model decouples volume from gross margin. By keeping deposits, withdrawals, and bill payments free while taking only 1% on transfers, Wave drives massive user adoption but captures only a narrow fraction of total wallet volume as top-line revenue."
    claimRefs:
      - "CM003"
      - "CM006"
      - "CM007"
  - calloutType: "risk"
    title: "Incumbent Telco Retaliation and Multi-Country Regulatory Bottlenecks"
    body: "Wave's rapid domestic conquest in Senegal cannot be assumed across all target expansion markets. In Cameroon and broader Central Africa, incumbent operators Orange and MTN have aggressively defended their agent and distribution moats, while multi-country regulatory hurdles and banking compliance raise operating capital intensity."
    claimRefs:
      - "CM013"
      - "CM015"
