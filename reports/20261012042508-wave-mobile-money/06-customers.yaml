chapter:
  number: 6
  title: "Customers"
  summary: "Wave demonstrates massive consumer adoption across Senegal and Côte d'Ivoire with over 21 million reported users and more than $2 billion in monthly transaction volume driven by radical 1% transfer pricing and free cash withdrawals. However, customer cohort retention metrics remain undisclosed private data, while regional expansion outside the UEMOA currency bloc encounters intense incumbent defense from telecom operators in Cameroon."
sections:
  - id: "customer-segmentation-economics"
    title: "Customer Segmentation and Value Proposition"
    body: >
      Wave segments its customer ecosystem into three principal user groups: mass-market retail consumers, local retail agent operators, and institutional utility billers. For retail consumers, the platform functions primarily as an affordable digital wallet for domestic remittances, utility bill settlements, and airtime top-ups. Wave's core value proposition hinges on a radical pricing disruption: deposits and bill payments are completely free for end users, while peer-to-peer transfers and cash withdrawals incur a flat 1% fee. This fee structure represents a 70% to 80% discount compared to the 5% to 7% tiered fee schedules historically imposed by telecom incumbents Orange Money and MTN MoMo. By decoupling user accounts from specific telecommunication provider SIM cards, Wave enables any smartphone owner with a valid national identity document (CNI) to transact seamlessly across networks. This open-access model catalyzed widespread switching behavior across urban and peri-urban populations in Senegal and Côte d'Ivoire, forcing incumbent telecom operators into defensive fee reductions across Francophone West Africa.
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU007"
    tableRefs:
      - "TU001"
  - id: "adoption-trajectory-penetration"
    title: "Adoption Trajectory and Regional Market Penetration"
    body: >
      Wave's customer acquisition trajectory demonstrates extraordinary velocity across its primary West African markets. Across its total footprint, Wave reports serving more than 21 million users as of 2026, driven by aggressive ground-game distribution and price transparency. In Senegal, its initial market launched in 2017, the platform achieved unprecedented market penetration: an estimated three-quarters of all adult smartphone owners had installed and activated the Wave application by 2023, surpassing formal commercial banking penetration where only half of adults held bank accounts. Expansion into Côte d'Ivoire produced comparable rapid scaling, with industry estimates indicating Wave reached between 8 million and 10 million active users within two years of its 2021 launch. On an operational level, Wave processes over USD 2 billion in monthly mobile payment transactions, reflecting heavy daily velocity in peer-to-peer transfers and cash-out operations. However, public user metrics lack granular standardized definitions, conflating registered application downloads with 30-day or 90-day monthly active transacting accounts.
    claimRefs:
      - "CU004"
      - "CU005"
      - "CU006"
      - "CU013"
    tableRefs:
      - "TU002"
  - id: "named-deployments-institutional-proof"
    title: "Production Deployments and Institutional Validation"
    body: >
      To transition from an informal peer-to-peer payment tool into indispensable public and commercial payment infrastructure, Wave has secured key institutional partnerships across government, utility, and banking sectors. In Senegal, the Ministry of Health entered into a formal partnership with Wave to digitize payments across public health facilities nationwide, establishing digital payment rails as a permanent operating standard for healthcare delivery. In Côte d'Ivoire, Wave integrated major national public utility providers into its application, enabling millions of consumers to settle electricity bills with Compagnie Ivoirienne d'Électricité (CIE) and water bills with SODECI without paying convenience surcharges. Entertainment and media billers such as Canal+ Côte d'Ivoire have similarly integrated Wave QR payments for subscription renewals. In Cameroon, Wave partnered with Commercial Bank Cameroon to secure operational approval for Central African expansion, though competitive counter-measures from Orange and MTN have constrained customer acquisition velocity relative to Wave's West African strongholds.
    claimRefs:
      - "CU008"
      - "CU009"
      - "CU010"
      - "CU011"
    tableRefs:
      - "TU003"
  - id: "retention-expansion-concentration-risks"
    title: "Retention Durability, Expansion Friction, and Concentration Risks"
    body: >
      Wave's long-term customer durability depends on transitioning transacting users from commoditized transfers into sticky financial workflows while overcoming geographic and infrastructure barriers. To deepen financial integration and offer corporate accounts, Wave established Wave Bank Africa S.A., an authorized commercial banking subsidiary in Côte d'Ivoire. However, customer durability faces structural risks. In expansion markets outside the UEMOA monetary union, particularly Cameroon, Wave has struggled against entrenched telecom duopolies that vigorously defend agent liquidity and subscriber loyalty. Furthermore, across rural West African territories, widespread infrastructure bottlenecks—including intermittent wireless connectivity, power outages, and low smartphone ownership—create first-mile friction that limits organic digital adoption. Crucially, Wave discloses no audited cohort retention, net revenue retention (NRR), or merchant churn data, leaving open diligence questions regarding whether low-fee customer adoption translates into durable, profitable lifetime customer value.
    claimRefs:
      - "CU012"
      - "CU014"
      - "CU015"
    figureRefs:
      - "FU001"
