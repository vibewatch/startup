callouts:
  - calloutType: "insight"
    title: "Disruptive Flat-Fee Model as a Customer Acquisition Engine"
    body: >
      Wave restructured West African mobile money by replacing legacy telco fee tiers (5–7%) with a flat 1% withdrawal fee and free P2P transfers. This aggressive pricing drove rapid customer adoption across Senegal and Côte d'Ivoire, forcing incumbent telecom operators into defensive price cuts.
    claimRefs:
      - "CU001"
      - "CU003"
      - "CU005"
  - calloutType: "risk"
    title: "Expansion Headwinds and Telecom Incumbent Resistance"
    body: >
      While Wave commands dominant market share in Senegal and Côte d'Ivoire, geographic expansion into Central Africa faces severe resistance. In Cameroon, entrenched telcos Orange and MTN have defended their agent networks and distribution channels, constraining Wave's customer acquisition velocity.
    claimRefs:
      - "CU011"
      - "CU014"
