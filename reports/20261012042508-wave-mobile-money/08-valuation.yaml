callouts:
  - calloutType: "recommendation"
    title: "Discipline Over Hype: Why Track Prevails Over Buy"
    body: "Wave has proven superior product-market fit and consumer adoption across Francophone West Africa, scaling to over 20 million active users. However, in the absence of audited consolidated margins, EBITDA, or recent private equity price discovery, committing capital at the legacy $1.7 billion valuation implies excessive multiple risk. Investors should track balance-sheet debt absorption and banking monetization before committing equity."
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV003"
      - "CV005"
  - calloutType: "risk"
    title: "The 1% Margin Trap and Telco Retaliation"
    body: "While Wave's flat 1% fee successfully broke telco monopolies in Senegal and Côte d'Ivoire, it leaves tight unit economics. In expansion markets like Cameroon, incumbents Orange and MTN are defending market share aggressively, restricting Wave's ability to subsidize cash distribution agents without continuous external financing."
    claimRefs:
      - "CV007"
      - "CV009"
      - "CV014"
