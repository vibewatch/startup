  researchQuestions:
  - id: QP001
    question: 'Which competitor classes matter most for Cera: scaled providers, tech-layer vendors, substitutes, or model competitors?'
    type: enumeration
    targets:
    - contentRequirements/0
    status: answered
    answer: All four matter. Scaled providers win on service trust, software vendors attack workflow ownership, NHS/internal pathways substitute for high-value home care, and Buurtzorg-style models influence commissioner thinking.
  - id: QP002
    question: How strong is Helping Hands as Cera's closest scaled home-care comparator?
    type: comparison
    targets:
    - contentRequirements/1
    status: answered
    answer: Strong on trust, reviews, branch footprint and live-in care; weaker than Cera on public predictive-AI positioning.
  - id: QP003
    question: What scale signals does Helping Hands publicly disclose?
    type: quantification
    targets:
    - plannedTables/competitor-profile-table
    status: answered
    answer: Its official materials point to 150 branches, 10k+ customers, 6k+ carers and 3.5m care hours in 2024.
  - id: QP004
    question: Do Helping Hands' quality signals materially strengthen its competitive position?
    type: verification
    targets:
    - contentRequirements/1
    status: answered
    answer: Yes. Official sources report 97% of branches rated Good or Outstanding plus Excellent review positioning.
  - id: QP005
    question: How does Prestige Nursing & Care position itself versus Cera?
    type: comparison
    targets:
    - contentRequirements/1
    status: answered
    answer: Prestige emphasises clinical and complex care, governance, franchise support and nurse-led delivery rather than predictive AI.
  - id: QP006
    question: Is Prestige still clearly Sodexo-controlled?
    type: verification
    targets:
    - contentRequirements/1
    status: partial
    answer: Companies House filing history shows Sodexo Holdings Ltd ceased as PSC in October 2023, but the replacement control structure is not clearly disclosed in the fetched public sources.
  - id: QP007
    question: Does HC-One materially overlap with domiciliary care or mostly sit in residential care?
    type: comparison
    targets:
    - contentRequirements/1
    status: answered
    answer: Mostly residential and discharge-adjacent. Its overlap with Cera is indirect and strongest where step-down and community pathways meet care-home operations.
  - id: QP008
    question: What digital investment signals show HC-One can narrow operational gaps with more tech-forward providers?
    type: mechanism
    targets:
    - contentRequirements/1
    status: answered
    answer: HC-One's annual review highlights digital care planning, event reporting, quality assurance and refurbishment / pay investment at scale.
  - id: QP009
    question: Is Birdie a direct care provider or a workflow-layer competitor?
    type: verification
    targets:
    - contentRequirements/2
    status: answered
    answer: Birdie is a workflow-layer competitor. Its public materials describe software for agencies rather than direct regulated care delivery.
  - id: QP010
    question: What scale and funding has Birdie publicly disclosed?
    type: quantification
    targets:
    - plannedTables/competitor-profile-table
    status: answered
    answer: Birdie disclosed 700+ partner care businesses, 35k care recipients, 8k family members and $52M total investment in 2022, while its 2026 homepage markets to 1,000+ homecare businesses.
  - id: QP011
    question: How does Birdie sharpen competition in private-pay and agency productivity?
    type: mechanism
    targets:
    - plannedTables/pricing-packaging-comparison
    status: answered
    answer: Birdie explicitly markets tools for shifting agencies from council work toward sustainable private pay, while packaging unified rostering, finance, compliance and analytics.
  - id: QP012
    question: What exactly does Person Centred Software compete on?
    type: comparison
    targets:
    - contentRequirements/2
    status: answered
    answer: PCS competes for care-management workflow ownership via digital care planning, eMAR, training and CQC-ready compliance tooling.
  - id: QP013
    question: Does Person Centred Software broaden its moat through connected-care acquisitions?
    type: mechanism
    targets:
    - contentRequirements/2
    status: answered
    answer: Yes. The Redcrier acquisition is framed as adding training into a broader connected-care ecosystem.
  - id: QP014
    question: Why is Lilli the clearest narrow AI challenger?
    type: comparison
    targets:
    - contentRequirements/2
    status: answered
    answer: Lilli sells predictive lifestyle monitoring and council ROI directly, making it the closest public example of an AI-first home-care proposition even without a large care workforce.
  - id: QP015
    question: What funding and commercial traction has Lilli disclosed?
    type: quantification
    targets:
    - plannedTables/competitor-profile-table
    status: answered
    answer: Lilli raised £8.2M Series A, cites multiple £1M+ contracts in late 2023 and claims council ROI up to £9 saved per £1 spent.
  - id: QP016
    question: How large and fast-growing is Alcedo as a regional challenger?
    type: quantification
    targets:
    - plannedTables/competitor-profile-table
    status: answered
    answer: Company-backed coverage cites 1,000 staff, 18 offices, £24M FY23 turnover and a 30-branch target by end-2025.
  - id: QP017
    question: What services are driving Alcedo's expansion?
    type: mechanism
    targets:
    - contentRequirements/1
    status: answered
    answer: Live-in care, complex care, children's services and new office openings appear to be the main growth engines.
  - id: QP018
    question: Is Buurtzorg a UK operating competitor or mainly a model competitor?
    type: comparison
    targets:
    - contentRequirements/3
    status: answered
    answer: Mainly a model competitor and commissioner reference point; it has been active in Britain since 2015 but public evidence here does not show scaled UK operating share.
  - id: QP019
    question: How broad is NHS internal care-at-home competition?
    type: verification
    targets:
    - contentRequirements/3
    status: answered
    answer: Broad and growing. Virtual wards are in every ICS and neighbourhood-health policy is explicitly shifting more care into homes and communities.
  - id: QP020
    question: What scale targets show NHS internal hospital-at-home expansion?
    type: quantification
    targets:
    - plannedFigures/moat-readiness-kpis
    status: answered
    answer: NHS England cites 7,000 virtual ward beds already rolled out, an ambition to exceed 10,000, and a longer-term target of 40-50 per 100,000 population.
  - id: QP021
    question: How large is unpaid family care as a substitute to formal home care?
    type: quantification
    targets:
    - contentRequirements/3
    status: answered
    answer: Carers UK estimates 5.7 million unpaid carers across the UK, making informal care the largest substitute by far.
  - id: QP022
    question: Why is unpaid family care a fragile status quo rather than a stable equilibrium?
    type: adverse
    targets:
    - contentRequirements/3
    status: answered
    answer: Because unpaid carers face materially higher poverty risk and many provide long hours of labour without formal support, making the substitute pervasive but economically brittle.
  - id: QP023
    question: Is Saga still an active direct home-care operator?
    type: verification
    targets:
    - contentRequirements/3
    status: unresolved
    answer: The previously public Saga home-care URL now returns 404, but the fetched evidence is insufficient to map the full timeline or corporate exit mechanics.
  - id: QP024
    question: Which rival is strongest in each competitive lane?
    type: comparison
    targets:
    - plannedFigures/competitive-positioning-map
    status: answered
    answer: Helping Hands leads scaled private home care, Prestige leads clinically-oriented staffing, Birdie leads workflow enablement, Lilli leads narrow predictive AI, Alcedo leads regional branch growth, and NHS internal pathways lead acute care-at-home substitution.
  - id: QP025
    question: Can any current rival match Cera's integrated AI + direct-care model at national scale?
    type: comparison
    targets:
    - contentRequirements/3
    status: answered
    answer: 'Public evidence does not show a single rival matching all three layers simultaneously: direct care scale, commissioner footprint and predictive AI narrative.'
  - id: QP026
    question: How transparent are public pricing and contract structures across provider and software rivals?
    type: verification
    targets:
    - plannedTables/pricing-packaging-comparison
    status: partial
    answer: Public packaging logic is visible, but realised provider rates, SaaS subscriptions, discounts and commissioner-specific contract terms are mostly private.
  - id: QP027
    question: What is the main adverse risk to Cera's moat over the next few years?
    type: adverse
    targets:
    - contentRequirements/4
    status: answered
    answer: That commissioners and rival agencies buy enough modular software or internal NHS capacity to erode the pricing power of Cera's integrated model without matching all of its features.
