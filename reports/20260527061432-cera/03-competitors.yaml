company:
  name: Cera
chapter:
  number: 3
  title: Competitors
  summary: 'Cera competes against three different rival sets rather than a single like-for-like peer: scaled home-care operators such as Helping Hands, Prestige and Alcedo; workflow and AI vendors such as Birdie, Person Centred Software and Lilli; and substitutes such as NHS virtual wards, Buurtzorg-style neighbourhood models and unpaid family care. The competitive insight is that no rival appears to match Cera''s full stack of direct care delivery, public-sector procurement reach and predictive AI, but modular software vendors and NHS internal delivery routes can still erode parts of that moat.

    '
sections:
- id: landscape-and-frames-of-competition
  title: Landscape and frames of competition
  body: 'Cera''s competitor set is structurally mixed. The company does not only compete with other domiciliary care brands for care hours; it also competes with software vendors that help rival agencies digitise without outsourcing operations, with NHS internal care-at-home pathways that keep activity inside the public system, and with the unpaid family-care status quo that still absorbs a large share of UK care demand. That means a simple branch-count leaderboard misses the real market structure.


    The scaled private and regional providers matter because they shape trust, workforce density, quality ratings and public-sector tender credibility. Helping Hands is the strongest brand-led home-care comparator on private-pay and live-in services; Prestige is a clinically-oriented staffing and governance competitor; HC-One matters more as a large residential and discharge-adjacent incumbent than as a pure domiciliary peer; and Alcedo shows that regional operators can still scale quickly with multi-service expansion.


    The tech layer is a separate battle. Birdie and Person Centred Software do not replace carers directly, but they can weaken Cera''s differentiation by giving other operators better rostering, compliance, analytics and family visibility. Lilli is the clearest narrower AI challenger because it sells predictive monitoring and councils'' ROI rather than labour capacity. Against all of these, Cera''s strongest claim is integration across care delivery, data capture and predictive intervention.

    '
