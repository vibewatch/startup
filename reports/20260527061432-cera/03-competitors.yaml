  evidenceGaps:
  - type: missing-source
    severity: material
    topic: prestige-control-structure
    missingEvidence: Exact current shareholder and governance structure for Prestige after Sodexo Holdings Ltd ceased as PSC in October 2023.
    whyItMatters: Ownership affects financing capacity, strategic direction and the credibility of old market maps that still treat Prestige as a Sodexo-controlled rival.
    diligencePath: Request the current cap table, board list and latest statutory accounts from management or pull the latest confirmation statements and shareholder filings directly.
    relatedQuestionRefs:
    - QP006
  - type: private-evidence-only
    severity: material
    topic: competitor-pricing
    missingEvidence: Realised customer pricing, framework rates, enterprise SaaS subscriptions and discount structures for the main provider and software competitors.
    whyItMatters: Packaging logic is visible in public sources, but pricing power determines whether Cera's integrated model actually earns a premium.
    diligencePath: Request sample customer contracts, framework schedules, order forms and renewal data across Helping Hands, Prestige, Birdie, PCS, Lilli and major NHS pathways.
    relatedQuestionRefs:
    - QP026
    relatedTableRefs:
    - TP003
  - type: missing-source
    severity: minor
    topic: saga-current-status
    missingEvidence: A high-confidence corporate statement explaining whether Saga formally exited direct home care or only removed legacy marketing pages.
    whyItMatters: Saga's over-50s brand could still matter for consumer acquisition or partnerships even if direct service delivery has wound down.
    diligencePath: Seek archived announcements, corporate reports or press coverage confirming the timeline and current status of any Saga home-care activity.
    relatedQuestionRefs:
    - QP023
  - type: missing-source
    severity: minor
    topic: profile-table-coverage
    missingEvidence: Company-profile style evidence for Saga, NHS virtual wards, Buurtzorg and unpaid family care that would let them fit TP001's normal HQ / founding / funding structure.
    whyItMatters: These competitor sets matter strategically but do not map neatly into a standard corporate profile table, which is why TP001 focuses on provider and software entities.
    diligencePath: Expand TP001 only if a future refresh obtains corporate or archival evidence strong enough to profile those substitutes in the same format.
    relatedTableRefs:
    - TP001
  - type: private-evidence-only
    severity: material
    topic: cera-win-loss-data
    missingEvidence: Deal-level evidence showing how often Cera wins or loses against service providers, software vendors and NHS internal pathways in specific tenders or local markets.
    whyItMatters: The moat question cannot be answered from category labels alone; it requires real procurement and retention evidence.
    diligencePath: Ask management for competitor-coded bid data, local authority renewal outcomes, NHS tender win-loss logs and reasons for churn by account.
    relatedQuestionRefs:
    - QP024
    - QP025
    - QP027
    relatedTableRefs:
    - TP004
