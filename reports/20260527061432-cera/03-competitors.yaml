- id: substitutes-procurement-and-moat
  title: Substitutes, procurement dynamics and moat durability
  body: 'The most underestimated competitive pressure on Cera may be internal NHS delivery rather than another branded home-care provider. NHS England''s virtual ward guidance says these services are now available in every integrated care system, targets occupancy above 80%, and frames them as acute-care substitutes that shift activity into patients'' usual place of residence. Separate NHS policy aims to expand virtual ward capacity from 7,000 beds to above 10,000, with a longer-term ambition of 40-50 beds per 100,000 people. Those pathways do not replace long-run domiciliary care, but they can absorb high-value admission-avoidance and discharge work before it reaches outsourced providers.


    Buurtzorg is more a model competitor than a scaled UK operator today. Its self-managed neighbourhood teams dominate Dutch home care and it has worked in Britain since 2015, so commissioners can point to it as evidence that local, nurse-led and flatter operating structures are viable alternatives to centralised platforms. Unpaid family care is even more important: Carers UK estimates 5.7 million unpaid carers across the UK, making informal care the largest substitute by far, albeit one that is financially fragile and often unsustainable.


    This leaves Cera''s moat in a nuanced position. The company appears unique in combining national direct-care scale with a heavy AI narrative, but rivals can chip away at individual layers: Helping Hands on trust and quality, Prestige on clinical governance, Birdie and PCS on workflow ownership, Lilli on predictive ROI, NHS pathways on acute home treatment, and unpaid carers on baseline substitution. The core diligence question is therefore not whether Cera has competitors, but whether its integrated model drives materially better tender wins, retention or margins than these narrower alternatives.

    '
