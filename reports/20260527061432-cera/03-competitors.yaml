- id: scaled-provider-rivals
  title: Scaled provider rivals
  body: 'Helping Hands is the clearest service-line comparator for Cera in home care because it combines national brand recognition, live-in and visiting care, specialist nursing support, and unusually strong public quality signals. Its 2024 impact report and related coverage point to 150 branches, more than 10,000 customers and more than 6,000 carers, while its official positioning stresses no agency staff, regulated services and high review scores. That makes Helping Hands especially relevant in private-pay and family-led purchasing, even if its public materials do not emphasize predictive AI.


    Prestige Nursing & Care competes differently. Its public positioning is more clinical and complex-care oriented, with hourly, live-in and nurse-led services backed by compliance and governance infrastructure. Importantly, the company still markets over 80 years of expertise, but Companies House filing history shows Sodexo Holdings Ltd ceased as a person with significant control in 2023, so ownership references in market commentary may be stale. That ambiguity is a diligence issue rather than a thesis breaker, but it matters when mapping who actually finances or governs the business.


    HC-One is not a close like-for-like domiciliary operator, yet it matters as a large residential incumbent that is investing in digital care planning, quality systems and step-down style categories. Alcedo is the more direct regional threat: family-owned, 1,000+ staff, 18 offices and live-in/complex-care expansion across the North of England and Wales. Together, these providers show that Cera''s non-AI moat still rests heavily on workforce execution, tender credibility and service breadth.

    '
