- id: ai-agents-predictive-tools
  title: AI Agents, Predictive Analytics, and Evidence Base
  body: 'Cera''s predictive AI generates up to 5,000 high-risk alerts daily across more than two million monthly home care visits. The Falls Prevention AI, which monitors vital signs entered via the CeraApp, was the subject of an NHS England press release in March 2025 announcing a "nationwide rollout" and claiming 97% accuracy in predicting falls risk. The BMJ investigated this announcement and found that the "nationwide rollout" referred to Cera expanding its own service contracts, not an independent NHS-wide deployment. NHS England directed BMJ''s requests for evidence to Cera; Cera stated the 97% figure derived from "technical evaluations" comparing risk categorisation. The BMJ found no peer-reviewed clinical RCT evidence to support the large-scale outcome claims, and the NHS Confederation welcomed the tool while emphasising the need for "robust evaluation." The Faculty.ai case study states outcomes were published in a medical journal, but the specific citation has not been publicly
    disclosed by Cera.

    Despite the evidence-base gap, deployment scale is significant: 29 of 42 NHS Integrated Care Systems used the Falls AI as of March 2025, pilots at 800 and 2,254 patients in July and September 2023 showed a 20% reduction in falls, and third-party analysis credits Cera''s model with saving the NHS over £1 million per day. Cera claims its model reduces hospitalisations by up to 70%, though this figure, like the 97% accuracy claim, has not been independently validated in published academic literature.

    The AI agents tier represents a more recent and less independently verified capability. Field Care Supervisor Agent reduces clinical review time by 85% through automated synthesis of visit logs, medication records, and care plan updates. The AI Retention Agent identifies at-risk staff within two days versus two weeks for human teams, contributing to a claimed 22% improvement in retention. Pilots of all four agents took place across Cera''s UK sites before the January 2026 launch.

    '
