chapter:
  number: 5
  title: Product & Technology
  summary: 'Cera''s technology platform centres on the CeraApp — a mobile-first digital care record that replaces paper-based notes across 2.5 million monthly home visits — underpinned by a 300-billion-data-point longitudinal dataset and a suite of proprietary AI agents and predictive algorithms. The Falls Prevention AI, developed with Faculty.ai, predicts hospitalisation risk with claimed 80% recall up to seven days in advance and is deployed across two-thirds of NHS Integrated Care Systems. A BMJ investigation questioned the framing of NHS England''s "nationwide rollout" press release and noted that accuracy claims rest on internal technical evaluations rather than peer-reviewed clinical trials. The April 2026 AI Lab launch, backed by eight-figure investment and UK government endorsement, signals a pivot from pure provider to technology licensor, with robotics (GenieConnect) and licensing-ready AI agents the primary forward vectors.

    '
sections:
- id: product-portfolio
  title: Product Portfolio and Service Modules
  body: 'Cera''s commercial offering integrates three interlocking layers: a care-delivery operations platform (CeraApp and workforce tooling), a predictive clinical AI suite (Falls Prevention, Hospitalisation Predict-Prevent, illness detection), and an autonomous AI agents tier (Ami recruitment, Care Coordinator, Field Care Supervisor, Retention). A fourth layer, home-care robotics (GenieConnect), was added via acquisition in November 2025. The company positions the AI and robotics layers as licensable to external health and care organisations, creating a potential B2B technology revenue stream alongside its core care-delivery contracts.

    The CeraApp, available on iOS (version 1.27.0, May 2026, rated 4.3/5 from 253 ratings) and Android, serves as the primary data-capture interface. Carers log indicators such as sleep quality, mood, hydration, blood pressure, heart rate, and temperature at each visit. These structured observations feed directly into the predictive AI models, creating a closed-loop between frontline data collection and clinical risk detection. Automation of visit schedules and care plan generation reduces carer administrative time, allowing more time for direct patient interaction.

    Cera describes its AI agents as autonomous decision-support systems with reasoning, planning, and memory capabilities that take action without requiring human prompting for each step. The AI recruitment agent Ami has been deployed internally since early 2026, handling initial interviews for approximately 500,000 annual applicants and doubling hiring throughput; Cera is now licensing Ami to external care organisations. Three further agents — Care Coordinator, Field Care Supervisor, and Retention — were launched to approximately 1,000 staff across 130+ UK sites in January 2026.

    '
