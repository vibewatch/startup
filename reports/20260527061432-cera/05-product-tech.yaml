callouts:
- calloutType: strength
  title: NHS-Scale Dataset as Structural Moat
  body: 'Cera''s 300-billion data-point longitudinal dataset — the output of 10,000 carers logging observations across 2.5 million monthly home visits — is a dataset that no pure-software competitor can replicate without comparable care-delivery scale. This creates a proprietary training corpus and real-world validation environment that underpins both current AI tools and the AI Lab''s R&D pipeline. Faculty.ai''s externally validated hospitalisation model demonstrates that the dataset can produce clinically meaningful predictive signals.

    '
  claimRefs:
  - CE011
  - CE014
  - CE015
- calloutType: risk
  title: Evidence-Base Gap Under Scrutiny
  body: 'The BMJ''s April 2025 investigation found that the NHS England "nationwide rollout" announcement of Cera''s Falls Prevention AI was misleading, and that the 97% accuracy claim rests on internal technical evaluations rather than published peer-reviewed trials. The NHS Confederation called for robust independent evaluation. This gap creates material risk: if regulatory classification (MHRA SaMD) is triggered, Cera would face a demanding clinical evidence pathway; and institutional purchasers increasingly require independent efficacy data. The absence of a published journal citation for the Faculty.ai hospitalization model compounds this exposure.

    '
  claimRefs:
  - CE025
  - CE026
  - CE031
  - CE032
  - CE041
- calloutType: insight
  title: Dual-Use Platform Strategy — Provider Plus Licensor
  body: 'Cera''s 2026 AI Lab launch formalises a strategy that has been building since 2025: using its provider operations as a live validation environment for AI tools, then licensing validated tools externally. Ami is already licensed to external care organisations; GenieConnect is planned for licensing to 30+ care providers over 18 months. This model structurally separates Cera from traditional care companies and from pure-SaaS digital health startups, combining operational credibility with technology leverage. The key commercial risk is that technology licensing revenue remains pre-commercial as of May 2026.

    '
  claimRefs:
  - CE019
  - CE021
  - CE022
  - CE036
