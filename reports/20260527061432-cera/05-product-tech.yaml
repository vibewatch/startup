  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: MHRA-SaMD-classification
    missingEvidence: 'Confirmation of whether Cera has sought or received MHRA Software as a Medical Device classification for the Falls Prevention AI and hospitalisation prediction model.

      '
    whyItMatters: 'If Cera''s clinical decision-support AI qualifies as a SaMD under MHRA guidance, deployment without registration would represent a regulatory compliance risk; investors and NHS procurement teams need confirmation.

      '
    diligencePath: 'Request formal MHRA DUNS/registration confirmation from Cera or search the MHRA device register; review DTAC assessment if NHS-deployed.

      '
    relatedQuestionRefs:
    - QE024
  - type: missing-source
    severity: material
    topic: hospitalisation-model-publication
    missingEvidence: 'The specific journal citation for the Faculty.ai-co-developed hospitalisation prediction model''s outcomes review, referenced in both the Faculty.ai case study and Cera communications.

      '
    whyItMatters: 'Without the journal citation, it is impossible to independently assess methodology, patient population, effect size, and generalisability of the key clinical evidence claim.

      '
    diligencePath: 'Request the published paper citation directly from Cera''s clinical team or Faculty.ai; search PubMed for Cera/Faculty AI hospitalisation prediction papers.

      '
    relatedQuestionRefs:
    - QE005
    - QE003
  - type: private-evidence-only
    severity: material
    topic: ISO-27001-certification
    missingEvidence: 'Public evidence or certification confirmation of ISO 27001 (Information Security Management System) for Cera''s data systems.

      '
    whyItMatters: 'NHS and enterprise clients increasingly require ISO 27001 alongside DSPT; absence of public certificate may be a procurement barrier for new institutional contracts.

      '
    diligencePath: 'Request ISO 27001 certificate and scope statement from Cera management; verify with certifying body (e.g., BSI, LRQA).

      '
    relatedQuestionRefs:
    - QE012
  - type: missing-source
    severity: minor
    topic: NHS-integration-standards
    missingEvidence: 'Formal confirmation from Cera of specific NHS API and interoperability standards used (FHIR version, NHS Care Connect, NHS Login) in the CeraApp and data-exchange layer.

      '
    whyItMatters: 'Integration standard choice affects scalability and upgradeability as NHS England migrates to newer API frameworks; investors need to assess technical debt risk.

      '
    diligencePath: 'Review Cera''s developer documentation (if available) or request technical architecture document from engineering leadership; check NHS API catalogues for Cera registrations.

      '
    relatedQuestionRefs:
    - QE018
  - type: missing-source
    severity: minor
    topic: AI-agent-technical-dependency
    missingEvidence: 'Disclosure of the LLM or reasoning infrastructure provider powering Cera''s AI agent tier (Ami, Care Coordinator, Field Supervisor, Retention).

      '
    whyItMatters: 'Dependency on a single LLM provider (e.g., OpenAI, Anthropic, or proprietary) creates supply/vendor-lock and cost concentration risk that investors cannot currently quantify.

      '
    diligencePath: 'Request vendor disclosure from Cera''s CTO or engineering team; review job postings for LLM/AI infrastructure engineer roles.

      '
    relatedQuestionRefs:
    - QE011
  - type: enumeration-incomplete
    severity: minor
    topic: competitor-comparison
    missingEvidence: 'Direct comparative technical assessment of Cera''s AI capabilities versus competitors such as Person Centred Software, Birdie, and Lilli that have overlapping digital care platforms.

      '
    whyItMatters: 'Without a comparison baseline it is difficult to assess whether Cera''s AI differentiation is structural or replicable by a well-funded competitor.

      '
    diligencePath: 'Commission a technical benchmarking review or review competitor product documentation to compare data model, AI features, and NHS integrations.

      '
    relatedQuestionRefs:
    - QE020
