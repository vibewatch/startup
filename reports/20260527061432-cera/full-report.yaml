  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and compliance risks
        blocks:
          - type: paragraph
            body: >-
              Cera sits in a regulated service category where negative evidence can surface at branch level even if the
              provider page shows no overall rating. That matters because the clearest adverse evidence in this run is
              concrete, not hypothetical: CQC's Castleham Lodge assessment was triggered by information of concern and
              recorded six breaches across safeguarding, safe care, person-centred care, complaints, staffing, and
              governance. At the same time, CQC's current assessment framework is more evidence-led and explicitly
              linked to quality statements and regulations, while CQC's AI guidance makes clear that the provider
              remains accountable when technology affects care quality. The legal baseline is also broad rather than
              narrow. The Care Act and DHSC market-shaping guidance put commissioners under duties to assess need and
              sustain markets, but they do not insulate any one provider from retendering, fee pressure, or remediation
              demands. For Cera, the regulatory risk is therefore two-layered: service-level quality failures can still
              trigger interventions, and any scaled use or licensing of AI increases the governance burden around
              safety, equity, transparency, and documentation.
