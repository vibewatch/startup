            title: The biggest risk cluster is public-system dependence, not a single AI bug
            body: >-
              Cera's most material downside comes from the interaction of public-sector concentration, underfunded
              commissioning, labour scarcity, and service-quality accountability. AI risk matters, but it becomes most
              dangerous when cost pressure and branch-level execution are already under strain.
