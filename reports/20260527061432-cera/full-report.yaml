            body: >
              Cera's engineering infrastructure is cloud-hosted, with public GitHub repositories under the ceracare
              organisation showing Terraform modules for scalable infrastructure on both AWS and GCP, confirming a
              multi-cloud approach. A backend C# interview repository indicates .NET-based server-side components. The
              ceracare GitHub org has 5+ public repositories, with the AWS Terraform runner module last updated July
              2025 and the GCP landing zones module updated December 2024, suggesting active infrastructure maintenance.
              Core proprietary code — the AI models and CeraApp logic — is not publicly available.

              The central data asset is a longitudinal dataset of more than 300 billion anonymised health data points,
              accumulated through digital health plans, integrated medication records, dynamic risk scoring, and
              real-time care observations captured via the CeraApp. This dataset serves as the training corpus for
              predictive models and the evaluation environment for new AI agents. Cera's 2026 AI Lab will directly
              leverage this corpus to develop and validate new tools before international licensing.

              Cera partnered with specialist AI consultancy Faculty.ai to develop its hospitalization prediction model.
              Faculty's published case study describes a model that predicts 80% of admissions up to one week in advance
              and proved 2.6× more accurate than clinicians alone. The model outputs a prioritised patient risk list for
              nursing staff, enabling low-cost preventative interventions such as GP telephone consultations or district
              nurse visits. According to Faculty, outcomes were independently reviewed and published in a leading
              medical journal, though Cera has not publicly disclosed the journal citation.
