      - number: '5.4'
        title: Deployment, Robotics, and 2026 Roadmap
        blocks:
          - type: paragraph
            body: >
              Cera's operational footprint as of May 2026 spans 130+ sites across the UK, with AI tools deployed across
              more than two-thirds of NHS Integrated Care Systems and care commissioned by 100+ local authorities.
              Germany operations began in 2022 but remain smaller-scale. The CeraApp is the universal front-end across
              all sites; backend AI tools are centrally operated and push alerts to site managers and clinical
              supervisors.

              In November 2025, Cera acquired GenieConnect — a robot technology platform — and secured a manufacturing
              deal to accelerate unit supply. Pilots prior to acquisition delivered: 96% success for on-time medication
              reminders; 64–80% success encouraging patients to eat; 78–90% success encouraging regular fluid intake.
              The robots have been trialled by 12+ local councils and 30 care providers. Cera intends to scale
              GenieConnect across additional UK regions and license the technology to third-party care providers over
              the following 18 months, with plans to integrate GenieConnect software with the 300B-data-point corpus to
              add predictive prevention capability.

              The April 2026 AI Lab launch, backed by an eight-figure investment with UK government AI minister
              endorsement, signals the formalisation of Cera's technology-licensing strategy. The Lab recruits
              entrepreneurs in residence on an equity model, focuses on workforce capacity and patient-deterioration
              prediction as initial domains, and targets international licensing to governments and providers once
              UK-scale validation is complete. This creates a potential IP-heavy revenue stream beyond care delivery
              contracts, though no specific licensing deals or revenue figures have been publicly disclosed.
