      - number: '1.2'
        title: Leadership, Founders, and Governance
        blocks:
          - type: paragraph
            body: >
              Dr. Ben (Mahiben) Maruthappu MBE (born March 1988) is founder and CEO, and the dominant public face of
              Cera. Trained as a clinician at Oxford, Cambridge, and Harvard, he previously served as Innovation Advisor
              to NHS England and co-founded the NHS Innovation Accelerator. His personal motivation for founding Cera
              arose from the experience of coordinating fragmented home care for his mother following a back fracture in
              2016. Maruthappu has received more than 100 awards, including an MBE (2020), Great British Entrepreneur of
              the Year (2023), and EY Entrepreneur of the Year UK (2024); at 31 he became the youngest doctor to receive
              a UK national honour.

              Co-founders Marek Sacha (Board Member) and Martin Ocenas (Head of Engineering) remain with the company.
              Matthew Edward Ashley was appointed CFO and Director in June 2024, bringing financial leadership as Cera
              transitioned toward profitability. Peter Sands (former Standard Chartered CEO and Global Fund executive
              director) chairs the board. Andrew Stephen Brode joined the board in September 2019, Ankur Jain in June
              2020, and Alexander Jared Fiance (American, appointed September 2025) reflects the post-2025 financing
              relationship with US investors BDT & MSD Partners. Paul Van Reesch was appointed Company Secretary in
              December 2024. Sir David Behan (former CEO of the Care Quality Commission) sits on the advisory board,
              providing regulatory expertise.

              Key-person concentration on Dr. Maruthappu is material: the brand, investor relations, government
              advocacy, and AI vision all funnel through his public persona. The company has not disclosed a CFO
              succession plan. The board's expansion with investor-appointed directors after the 2025 financing round
              indicates growing institutional governance, but detailed committee structures and independent directors'
              mandates remain private.
