      - number: '5.5'
        title: Trust, Safety, and Compliance Controls
        blocks:
          - type: paragraph
            body: >
              Cera Care Operations Limited (NHS organisation code AQ1X) has published the NHS Data Security and
              Protection Toolkit (DSPT) assessment every year from 2019-20 through 2024-25, achieving "Standards Met"
              status in all six published assessments. The 2024-25 assessment was published 28 June 2025, confirming
              ongoing compliance with the National Data Guardian's 10 data security standards. DSPT compliance is a
              mandatory gate for any organisation with access to NHS patient data and systems, covering encryption,
              access controls, breach notification, and staff training requirements.

              The CeraApp's Apple App Store listing confirms the app collects only "Diagnostics" data, not personal
              identifiable information linked to device identity, under Apple's privacy nutrition labels. Patient health
              data entered via the CeraApp is stored under Cera's DSPT-compliant information governance framework. The
              company's patient-facing website and care operations comply with UK GDPR; all data used in AI training is
              anonymised.

              The primary unresolved trust/compliance gap is regulatory classification of Cera's clinical AI under MHRA
              Software as a Medical Device (SaMD) guidance: no public evidence confirms whether Cera has sought or
              received MHRA classification for the Falls Prevention AI or hospitalisation prediction model as a SaMD,
              despite their clinical decision-support role. The BMJ investigation implicitly raises this gap by noting
              the absence of peer-reviewed clinical evidence to substantiate outcome claims — a standard that medical
              device regulators typically require. No reported data breaches, CQC enforcement actions, or ICO regulatory
              notices were found for Cera as of May 2026.
