              - CV028
              - CV029
              - CV047
      - number: '8.3'
        title: Comparable lens and scenario range
        blocks:
          - type: paragraph
            body: >-
              The cleanest public valuation anchor available from retained evidence is not a private-data-platform mark
              but the implied multiple embedded in Cera's own 2025 price. Using the official c.$500 million annualised
              revenue claim, a $1 billion headline valuation implies roughly 2.0x valuation-to-revenue. That sits well
              above the public comparables retained here: Teladoc at 0.59x EV/revenue, Oscar Health at 0.17x, and Humana
              at 0.33x as of late May 2026. Mears does not provide a retained EV/revenue figure, but its £1.136 billion
              FY2025 revenue and £4.0 billion order book offer a useful UK public-services scale reference, reinforcing
              that Cera is already priced for more than traditional care-delivery execution. The premium is not
              irrational — Cera has stronger growth, a differentiated AI story, and clear proof of institutional demand
              — but it is a premium nonetheless. That points to a narrow bull case, an acceptable but not exciting base
              case, and a real bear case if debt, labour, or reimbursement dynamics consume equity value. The core
              modeling judgment is therefore that public evidence supports the existence of the current price, but only
              selectively supports the return case from the current price.
            claimRefs:
