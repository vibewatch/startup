    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Headquarters, and Business Model
        blocks:
          - type: paragraph
            body: >
              Cera (legally Cera Care Limited, Companies House number 09874278) is headquartered at Labs Hawley Lock,
              Camden, London, England. Founded in 2016 by Dr. Ben (Mahiben) Maruthappu MBE, Marek Sacha, and Martin
              Ocenas, Cera operates as a digital-first provider of home healthcare services across the United Kingdom
              and, since 2022, Germany. The company's mission is to empower people to live longer, healthier lives at
              home by harnessing artificial intelligence, data, and digital tools to reimagine how care is planned and
              delivered.

              Cera's core business combines a managed service operation — employing over 10,000 carers and nurses who
              deliver personal care, nursing, physiotherapy, mental health support, and learning-disability services
              directly into patients' homes — with a proprietary SaaS/AI platform that collects real-time data from
              every visit. Revenue is generated primarily through local authority and NHS commissioning contracts (150+
              local governments and two-thirds of NHS Integrated Care Systems), supplemented by growing B2B licensing of
              its AI agents and predictive-care tools to other providers globally.

              The integrated model gives Cera a structural data advantage: its app logs patient symptoms and care
              outcomes across 2.5 million monthly visits, producing a dataset of over 300 billion data points described
              as the largest home-healthcare dataset in Europe. This dataset underpins proprietary AI algorithms for
              falls prevention and hospitalisation prediction, and powers a suite of AI agents addressing recruitment,
              workforce scheduling, clinical supervision, and compliance. In April 2026 Cera formalised this AI asset
              into a dedicated AI Lab, backed by an eight-figure investment, to develop and license tools globally.
