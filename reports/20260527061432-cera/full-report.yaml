      - number: '8.4'
        title: Kill triggers and diligence close plan
        blocks:
          - type: paragraph
            body: >-
              What would move this call to buy is straightforward and mostly diligence-driven. First, management would
              need to open the debt package and show that secured borrowings are sized for flexibility rather than
              acting as a hidden tax on new equity. Second, the company would need to produce an audited financial pack
              — or at minimum a lender- grade bridge — that reconciles the leap from 2023 revenue evidence to the 2025
              c.$500 million annualised claim and shows how much margin sits in labour-intensive care delivery versus
              higher-value software or AI features. Third, Cera would need to prove that its AI outcomes and savings
              claims are repeatable outside company-framed studies and that AI productization is translating into
              monetisable software-like revenue rather than only improving service delivery efficiency. Absent that
              package, the risk controls matter more than the upside narrative. Kill triggers are therefore covenant
              strain, flat public-commissioner volume, worsening worker economics, or evidence that the 2025 round
              cleared only because debt rather than equity did the heavy lifting. The diligence agenda should stay
              disciplined around documents that change pricing power, equity seniority, and exit math — not around
              narrative demos.
            claimRefs:
              - CV030
              - CV031
              - CV032
              - CV033
