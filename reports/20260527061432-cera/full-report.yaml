      - number: '2.2'
        title: Market Sizing and Addressability
        blocks:
          - type: paragraph
            body: >
              Multiple analytical lenses produce estimates that differ by scope and methodology. The £11.5 billion
              "funded domiciliary care" figure (PolicyBee/ONS) represents the widest operationally validated UK-wide
              estimate and is used as the TAM anchor; it is directionally consistent with MarkWide's $16.8 billion
              (broader scope) and IBISWorld's £6.7 billion (narrower intensive nursing only), all reflecting a 6–8%
              CAGR.

              For Cera's Serviceable Addressable Market (SAM), the relevant population is technology-enabled or
              "digitally-ready" home care contracts in England—where Cera is currently licensed to operate—plus its
              emerging German presence. A conservative SAM estimate anchors on local-authority-commissioned domiciliary
              care in England (approximately £7–8 billion, pro-rated from the UK total), of which Cera's ~£275 million
              in annual revenue represents approximately 3–4% penetration.

              Cera's Serviceable Obtainable Market (SOM) over five years is bounded by the rate at which additional
              local authorities and NHS ICBs digitise commissioning and partner with platform-enabled providers. With
              150 of 382 local authorities (~39%) and 29 of 42 NHS ICBs (~69%) already under contract, incremental SOM
              growth increasingly depends on converting the remaining 232 local authorities and deepening ICB engagement
              into technology-platform licensing alongside direct care delivery.

              Independent validation by Faculty (an NHS-affiliated AI consultancy) estimates that Cera's platform is
              already saving the NHS approximately £1 million per day, forecast to rise to £3 million per day by autumn
              2026—equivalent to £1 billion in annualised NHS savings—validating the economic case for continued
              public-sector adoption. Each freed bed-day is valued by the NHS at approximately £460, and Cera's platform
              frees over 1,210 hospital bed-days monthly through fall and hospitalisation prevention.
            claimRefs:
