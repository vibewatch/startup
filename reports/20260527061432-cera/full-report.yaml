  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and frames of competition
        blocks:
          - type: paragraph
            body: >
              Cera's competitor set is structurally mixed. The company does not only compete with other domiciliary care
              brands for care hours; it also competes with software vendors that help rival agencies digitise without
              outsourcing operations, with NHS internal care-at-home pathways that keep activity inside the public
              system, and with the unpaid family-care status quo that still absorbs a large share of UK care demand.
              That means a simple branch-count leaderboard misses the real market structure.


              The scaled private and regional providers matter because they shape trust, workforce density, quality
              ratings and public-sector tender credibility. Helping Hands is the strongest brand-led home-care
              comparator on private-pay and live-in services; Prestige is a clinically-oriented staffing and governance
              competitor; HC-One matters more as a large residential and discharge-adjacent incumbent than as a pure
              domiciliary peer; and Alcedo shows that regional operators can still scale quickly with multi-service
              expansion.


              The tech layer is a separate battle. Birdie and Person Centred Software do not replace carers directly,
              but they can weaken Cera's differentiation by giving other operators better rostering, compliance,
              analytics and family visibility. Lilli is the clearest narrower AI challenger because it sells predictive
              monitoring and councils' ROI rather than labour capacity. Against all of these, Cera's strongest claim is
              integration across care delivery, data capture and predictive intervention.
