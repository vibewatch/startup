  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Definition and Boundaries
        blocks:
          - type: paragraph
            body: >
              Cera operates principally in the UK domiciliary (home) care market, a sub-segment of the broader adult
              social care and home healthcare landscape. For sizing purposes, the relevant market has two nested
              boundaries. The outer boundary, "UK home healthcare," encompasses personal care, nursing care at home,
              reablement, remote patient monitoring, assistive technology, and clinical home visits—forecast at $16.8
              billion in 2026 by MarkWide Research, expanding at a 7.9% CAGR to $33.3 billion by 2035. The inner
              operationally precise boundary, "UK domiciliary care," covers publicly and privately funded personal-care
              and support visits delivered in the home, valued at approximately £11.5 billion in 2024 (+12% since 2020)
              and forecast to grow at approximately 6.8% annually.

              The market excludes: residential nursing homes, NHS acute or community hospital beds, GP and primary-care
              consultations, mental-health supported living (unless co-delivered), and medical equipment supply chains.
              A meaningful adjacency is the technology-licensing (SaaS) segment—selling care-coordination software and
              AI tools to other providers—which remains nascent but is strategically relevant to Cera's platform
              monetisation roadmap.

              Approximately 80% of the £11.5 billion market is publicly commissioned via local authorities and NHS
              Integrated Care Boards (ICBs); the remaining 20% is self-funded (private pay). However, by user count
              self-funders represent approximately 23.5% of service users and pay significantly higher per-hour rates
              (£32–34+ vs. £24.10 LA average), making the private-pay mix disproportionately valuable to margin-seeking
              operators. The UK's roughly 13,500 domiciliary care providers are highly fragmented, with no single
              operator holding more than a low single-digit share of the total market by revenue.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
