      - number: '7.3'
        title: Financial and funding risks
        blocks:
          - type: paragraph
            body: >-
              The core financial risk is a mismatch between what public commissioners typically pay, what legally
              compliant delivery appears to cost, and the amount of leverage Cera has now added to the model. Homecare
              Association's 2025-26 and 2026-27 benchmarks imply a persistent funding gap versus current public fee
              rates, while Health Foundation, King's Fund, Care England, and the NAO all describe a system where higher
              spending has not resolved structural fragility. Cera's own business appears deeply tied to this public
              system: independent reporting places the company across 150 local authorities and 29 NHS ICBs, so budget
              pressure, contract renewal friction, or fee resets matter more than for a private-pay-led operator. The
              January 2025 financing round adds a second layer of downside. TechCrunch says the $150 million round was
              mostly debt; Macfarlanes confirms debt-plus-equity but not the split, pricing, or covenant package. That
              means investors can see the leverage headline but not the terms that would matter most in a downside
              scenario. If wage inflation and underfunded commissioning persist while debt service is opaque, Cera's
              margin resilience becomes materially harder to underwrite from public sources alone.
