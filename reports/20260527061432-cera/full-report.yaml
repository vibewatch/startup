  - id: FV001
    title: Recommendation logic
    type: flow
    layout: standard
    summary: >-
      The recommendation starts with verified scale and credible capital, but flows through two constraining nodes —
      debt-heavy structure and incomplete evidence quality — before landing on research-more rather than buy.
    approximationNotes: >-
      This is a qualitative decision path, not a weighted scoring model; the purpose is to show why positive company
      quality does not override structural opacity.
    data:
      nodes:
        - id: scale
          label: 'Strength: c.$500M annualised revenue and broad public-commissioner footprint'
          type: input
        - id: capital
          label: 'Strength: real institutional round led by BDT & MSD and Schroders'
          type: input
        - id: premium
          label: 'Constraint: ~2.0x implied headline multiple already above retained public comp band'
          type: process
        - id: structure
          label: 'Constraint: majority-debt round and secured charges obscure common-equity pricing'
          type: process
        - id: evidence
          label: 'Constraint: no public debt package, waterfall, or audited margin bridge in retained evidence'
          type: process
        - id: decision
          label: 'Recommendation: research-more; only re-rate on documents that improve equity-underwriting clarity'
          type: output
    claimRefs:
