  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Argument
      - Thesis
      - Anti-thesis
      - What would change the view
    rows:
      - - Scale and demand proof
        - >-
          Cera has real operational scale: c.$500 million annualised revenue, 2.5 million monthly visits, and broad
          local-government/NHS penetration.
        - >-
          Scale is still supported mainly by company and founder-linked disclosures rather than a public audited
          valuation pack, so quality of revenue and contribution margin remain unclear.
        - Audited revenue by segment and a margin bridge that reconciles care delivery, software, and central overheads.
      - - Capital quality
        - >-
          BDT & MSD and Schroders are credible institutions, and Companies House supports that the 2025 financing was a
          real refinancing event rather than promotional headline inflation.
        - >-
          The round was majority debt, security-heavy, and undisclosed on split and covenants, so high-quality capital
          does not equal attractive new-equity terms.
        - >-
          Full debt agreement, maturity schedule, covenant headroom, and waterfall disclosure showing limited structural
          subordination for new money.
      - - AI premium
        - >-
          Faculty outcome evidence, a 2026 AI Lab, and 1,000 deployed AI agents suggest a differentiated product roadmap
          rather than a generic staffing business.
        - >-
          The strongest outcome claims are still company-framed or partner-framed, and no retained evidence proves that
          AI has become a software-like revenue line deserving premium multiples.
        - >-
          Independent replication of savings/outcome claims and disclosed AI-linked revenue, retention, or pricing
          uplift.
      - - Workforce and delivery economics
        - Scale in public commissioning can create sticky demand and route density advantages.
        - >-
          Breakroom pay and review data point to labour-pressure risk, meaning the model may have less margin cushion
          than a pure tech narrative implies.
        - Verified retention, vacancy, and contract-level gross-margin data showing wage inflation is being absorbed.
      - - Current price
        - >-
          On the company's c.$500 million annualised revenue claim, the >$1 billion headline valuation implies only
          about 2.0x revenue, which is not a bubble-era multiple.
        - >-
          That 2.0x still sits above retained public comparables, and the majority-debt structure means even a fair
          enterprise-value headline can still be unattractive for common equity.
        - >-
          Either a lower effective entry price or documentary proof that the debt/pref stack leaves room for strong
          equity upside.
      - - Exit path
        - >-
          A scaled UK care platform with AI tooling could be strategically relevant to private equity, listed care, or
          payor-platform buyers.
        - >-
          No retained public evidence shows near-term IPO readiness, disclosed AI licensing mix, or a clean path to
          software-like exit multiples.
        - >-
          A documented exit narrative tied to audited EBITDA, software mix, and covenant-light balance-sheet
          positioning.
    notes: >-
      Thesis is evidence-led and explicitly price-sensitive; positive company quality signals do not override structure
      opacity.
    claimRefs:
      - CV013
      - CV021
      - CV022
      - CV026
      - CV029
