        - label: Structure transparency
          value: 1
          unit: /5
          note: Debt package and waterfall remain the biggest blockers to underwriting.
        - label: Exit clarity
          value: 2
          unit: /5
          note: No retained evidence yet supports a clean IPO or strategic-exit pathway at a premium multiple.
