      - CV039
      - CV040
      - CV044
      - CV045
      - CV046
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - >-
          Audited revenue exits 2026 above $600 million, AI tools convert into disclosed software-like revenue, and debt
          terms show ample covenant headroom.
        - >-
          3.0x-3.5x valuation-to-revenue on $600-650 million supports roughly $1.8-2.3 billion headline value and an
          attractive but not extreme multiple expansion story.
        - AI monetisation fails to separate from service delivery, or debt remains senior enough to cap equity upside.
        - Requires new documentary evidence; not supported by the current public record alone.
      - - Base
        - >-
          Annualised revenue stays near $500-550 million, public-commissioner contracts remain sticky, and AI improves
          operating quality more than monetisation.
        - >-
          2.0x-2.5x revenue supports roughly $1.0-1.4 billion headline value, implying limited upside from current
          pricing unless structure proves cleaner than it appears.
        - Flat volume, wage inflation, or higher-than-expected central costs keep equity returns mediocre.
        - Best aligned with retained evidence and with a research-more / track posture.
      - - Bear
        - >-
          Debt turns out tighter than expected, labour pressure worsens, or public-commissioner pricing and growth fail
          to support the current narrative.
        - >-
          1.0x-1.6x revenue on $450-500 million would imply roughly $0.45-0.8 billion headline value and weak or
          negative common-equity returns after structural seniority.
        - Covenant breach, down-round risk, or equity value compression despite stable enterprise activity.
        - >-
          Plausible if diligence shows the majority-debt round carried restrictive terms or if workforce metrics
          degrade.
    notes: >-
      Scenario values are analyst estimates based on retained public evidence, not a banker-style DCF; downside is most
      sensitive to debt structure and labour economics rather than top-line alone.
    claimRefs:
      - CV038
      - CV040
      - CV041
      - CV042
      - CV043
      - CV044
  - id: TV004
    title: Comparable valuation table
    columns:
      - Comparable
      - Metric
      - Multiple / valuation / status
      - Relevance
      - Limitation
    rows:
      - - Cera 2025 reference price
        - c.$500M annualised revenue (company claim)
        - '>$1B headline valuation from Jan 2025 financing; implied ~2.0x headline valuation / revenue.'
        - Direct anchor for current entry discipline.
        - Majority-debt structure means headline valuation is not clean common-equity pricing.
      - - Teladoc
        - $2.51B trailing revenue
        - 0.59x EV / revenue at 26 May 2026.
        - Public digital-health benchmark with meaningful scale.
        - Telehealth mix and post-Livongo baggage likely depress the multiple.
      - - Oscar Health
        - $13.3B trailing revenue
        - 0.17x EV / revenue at 26 May 2026.
        - Shows how public markets price tech-enabled care delivery at scale.
        - Insurance-risk economics differ sharply from home care and commissioning.
      - - Humana
        - $137.2B trailing revenue
        - 0.33x EV / revenue at 26 May 2026.
        - Senior-care adjacency and scale anchor for home-health relevance.
        - Mature payer profile is far less growth-oriented than Cera.
      - - Mears Group
        - £1.136B FY2025 revenue; £4.0B order book
        - Public UK operating reference; no clean retained EV / revenue metric.
        - UK outsourced-services and care-delivery scale analogue.
        - Not a pure digital-health company and retained evidence lacks valuation multiple precision.
    notes: >-
      Partial comparable set: retained evidence is strongest on public large-cap care and digital-health operators, but
      weak on directly comparable listed home-health companies with disclosed EV / revenue metrics.
    claimRefs:
      - CV034
      - CV035
      - CV036
      - CV037
      - CV038
      - CV039
      - CV048
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the retained public and reference-price set that is usable from fetched evidence as of 2026-05-27; it is
        partial because directly comparable listed home-health assets with disclosed EV/revenue were not available in
        the retained source pack.
  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Debt package proves restrictive
        - Covenant headroom or pricing indicates limited flexibility under moderate volume or margin pressure.
        - Turns a defensible enterprise-value story into weak common-equity economics.
        - Do not invest at current price without structural reset.
      - - Revenue quality disappoints
        - Audited revenue or cohort data fails to support c.$500M annualised scale or shows weak contract margins.
        - Breaks the scale thesis that supports any premium to public comparables.
        - Re-cut valuation using lower revenue and treat current mark as stretched-to-expensive.
      - - Labour pressure worsens
        - Higher churn, higher wage intensity, or weaker worker satisfaction points to deteriorating delivery economics.
        - Compresses margin and makes debt service more dangerous.
        - Move to avoid unless pricing power and retention evidence improve materially.
      - - AI moat remains narrative only
        - No independently replicated outcomes or no disclosed AI-linked revenue within the next diligence cycle.
        - Eliminates the main argument for paying above public care-delivery multiples.
        - Underwrite to public-comp-style multiples only.
      - - Exit path stays opaque
        - No credible IPO, sponsor, or strategic-buyer pathway tied to audited profitability and clean structure.
        - Limits multiple expansion and caps upside even if operations stay sound.
        - Hold only at materially lower entry price.
    notes: >-
      Triggers focus on changes that alter equity value, not just company quality; the main transmission channel is
      structure plus margin, not narrative momentum.
    claimRefs:
      - CV033
      - CV040
      - CV041
      - CV043
      - CV044
      - CV046
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - Debt agreement
        - Full facility, pricing, maturity, collateral, and covenant package for the January 2025 financing.
        - Majority-debt structure is the biggest gap between headline price support and equity attractiveness.
        - Request management data room access and lender summary pack.
      - - Cap table and waterfall
        - Preference stack, liquidation preferences, option pool, and any participating or ratchet terms.
        - Common-equity returns cannot be inferred from the headline valuation alone.
        - Request latest cap table plus exit waterfall at downside, base, and upside cases.
      - - Audited financial bridge
        - Audited FY2024/FY2025 statements or lender-grade bridge from 2023 revenue evidence to 2025 run-rate.
        - Needed to validate scale, cash quality, and margin durability.
        - Request audited statements, monthly management accounts, and contract-margin bridge.
      - - AI monetisation
        - Revenue, retention, or pricing uplift attributable to AI products rather than core care delivery.
        - Determines whether any premium to public care-delivery multiples is deserved.
        - Request product P&L, attach-rate data, and customer case studies with commercial terms.
      - - Workforce economics
        - Staff retention, wage inflation exposure, paid-break policy, and vacancy trend by region.
        - Labour pressure is a direct input into margin and covenant risk.
        - Request HR dashboard and contract-level staffing sensitivity analysis.
      - - Outcome validation
        - Independent replication of hospitalization and savings claims across non-company-sponsored cohorts.
        - Without outside validation, AI upside remains more narrative than underwritable.
        - Commission third-party outcomes review or NHS/commissioner reference calls.
    notes: >-
      These asks are ordered by their ability to change the underwriting decision, not by convenience or storytelling
      value.
    claimRefs:
      - CV040
      - CV041
      - CV044
      - CV045
      - CV046
