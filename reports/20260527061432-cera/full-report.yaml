    summary: >-
      IC-style scoring across seven dimensions on a 1-5 scale, with strongest marks for scale and quality of capital and
      weakest marks for valuation clarity and structure transparency.
    approximationNotes: >-
      Scores are editorial assessments from retained public evidence and should improve or worsen materially once debt,
      cap-table, and audited financial documents are reviewed.
    data:
