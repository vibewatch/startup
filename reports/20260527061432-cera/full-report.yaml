  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Financing Structure and Investor Quality
        blocks:
          - type: paragraph
            body: >
              Cera's most recent financing closed in January 2025 — a $150 million mixed debt-and-equity round that
              valued the company at over $1 billion, making it one of the few UK health-tech unicorns. The round was led
              by BDT & MSD Partners, a US merchant bank founded in 2023 via the merger of BDT Capital Partners and MSD
              Partners that focuses on "founders, family business owners, and select like-minded investors." Schroders
              Capital — the private-markets arm of Schroders plc, a FTSE 100 asset manager with £764 billion in AUM —
              co-invested alongside BDT & MSD. The involvement of a global institutional asset manager and a US merchant
              bank with deep family-business orientation signals patient, long-duration capital suited to Cera's
              NHS-rooted business model and long-term care sector thesis.

              Companies House filings independently corroborate the round's debt component. Two outstanding charges
              registered in December 2024 and March 2025 name Kroll Trustee Services Limited as security agent for the
              beneficiaries, covering "all current and future material land" — standard security language for a
              credit-facility debenture. Two earlier charges registered with Glas Trust Corporation (from 2020 and 2022)
              were both satisfied on January 9, 2025, the same date as the new round's closing. This sequential payoff
              and recharge is consistent with a re-financing of legacy debt on improved terms, not simply additive
              leverage. Simultaneous with the April 2026 AI Lab announcement, Companies House recorded two SH01
              share-allotment statements in April 2026 (filed 26 May 2026), indicating fresh equity was issued alongside
              AI Lab activation — a positive signal that the company is still attracting equity capital outside the
              flagship 2025 round.

              The round's mixed nature is both a strength and a diligence flag. The equity component (amount
              undisclosed) dilutes existing shareholders less than a pure equity round would at the prevailing
              valuation, while the debt component implies committed cash-flow obligations. Debt terms (tenor, interest
              rate, covenant package) are not publicly disclosed, and the Kroll security charges are broad ("all current
              and future material land"), leaving an investor unable to assess covenant headroom without direct access
              to the credit agreement. The overall investor quality — FTSE 100 institutional, patient merchant bank,
              confirmed unicorn anchor — is among the stronger signals available for a private healthcare company at
              this stage.
