        - label: Product / AI differentiation
          value: 4
          unit: /5
          note: Faculty outcomes, AI Lab launch, and 1,000 AI agents support genuine product ambition.
        - label: Quality of capital
          value: 4
          unit: /5
          note: BDT & MSD and Schroders are credible institutions, but structure still matters.
        - label: Margin durability
