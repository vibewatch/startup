      - number: '3.3'
        title: Tech-layer and AI challengers
        blocks:
          - type: paragraph
            body: >
              Birdie is the most important workflow-layer challenger because it helps other care agencies narrow
              operational gaps without copying Cera's vertically integrated model. Birdie now markets itself to more
              than 1,000 homecare businesses and positions its system as one platform spanning rostering, finance, care
              management, compliance and family apps. Its earlier 2022 funding materials already showed 700 partner
              agencies, 35,000 care recipients and 8,000 family members. The strategic point is not that Birdie replaces
              Cera, but that it reduces the performance penalty for staying independent.


              Person Centred Software sits in a similar but more care-home and regulated-operations lane. Its public
              materials emphasise digital care planning, eMAR, fast onboarding and CQC-readiness, while Redcrier's
              acquisition announcement frames PCS as building a broader connected-care ecosystem across training,
              wellness, medication and operations. That makes PCS a competitor for workflow ownership and compliance
              budgets, especially where commissioners or operators want digitisation without switching their service
              provider.


              Lilli is the clearest narrow AI challenge. Its proposition is proactive lifestyle monitoring and
              behaviour-change detection rather than full workforce management or direct care delivery. The company
              claims councils can save up to £9 for every £1 spent, accelerate discharge by up to 16 days and had
              multiple contracts above £1 million revenue in late 2023. If those claims hold, Lilli shows that targeted
              predictive modules can compete for the same NHS and local-authority budgets that Cera hopes to defend with
              a broader AI stack.
