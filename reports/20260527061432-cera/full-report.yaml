  - id: FE001
    title: Cera Technology Platform — Product Stack
    type: stack
    layout: standard
    summary: >
      Cera's platform is organised in five functional layers from core data infrastructure through predictive AI models
      to agent automation, robotics, and an overarching governance layer.
    data:
      layers:
        - id: l1
          label: Data Governance & Compliance
          detail: >
            NHS DSPT Standards Met (2024-25, published June 2025); UK GDPR / ICO compliance; anonymisation pipeline
            applied to all 300B data points before AI training use.
        - id: l2
          label: Robotics Layer
          detail: >
            GenieConnect robots (acquired November 2025); AI-driven medication, food/drink, and wellbeing reminders; 96%
            on-time medication success in pilots; 3,000 patient visits/week during pre-acquisition pilots across 12+
            councils and 30 care providers.
        - id: l3
          label: AI Agents Tier
          detail: >
            Ami AI recruitment agent (500k applications/year; doubles hiring volume; now licensed externally); Care
            Coordinator Agent (50% time saving on cover scheduling); Field Care Supervisor Agent (85% clinical review
            time saving); AI Retention Agent (22% retention improvement; 7× faster staff contact than human teams).
        - id: l4
          label: Predictive AI Suite
          detail: >
            Falls Prevention AI (97% categorisation accuracy per internal technical evaluation; deployed 29/42 NHS ICSs;
            5,000 high-risk alerts per day); Hospitalisation Predict-Prevent co-developed with Faculty.ai (80% recall
            1–7 days ahead; 2.6× more accurate than clinicians); illness detection for COVID-19, flu, RSV, norovirus.
        - id: l5
          label: Core Platform
          detail: >
            CeraApp: iOS v1.27.0 (May 2026, 4.3★) + Android; real-time structured data logging at 2.5M monthly visits;
            300B-data-point longitudinal dataset; multi-cloud infrastructure (AWS + GCP, Terraform-managed per public
            GitHub ceracare organisation).
    approximationNotes: >
      Layer boundaries are conceptual; actual microservice topology not publicly disclosed. Agent and predictive AI
      counts reflect official announcements; additional internal tools may exist.
    claimRefs:
      - CE005
      - CE011
      - CE016
