      - number: '2.3'
        title: Buyer and Segment Analysis
        blocks:
          - type: paragraph
            body: >
              The UK home care market has three distinct buyer-payer segments, each with different procurement dynamics,
              margin profiles, and technology adoption curves.

              Public segment — local authorities: ~80% of market volume; 382 local authorities in England commission
              home care through framework contracts and spot purchasing. The median LA hourly rate of £24.10 sits 39%
              below the Homecare Association's 2026 minimum cost of £34.42/hour, creating structural underfunding that
              suppresses small-provider margins and accelerates market consolidation. Switching costs for local
              authorities are high—linked to TUPE obligations, CQC registration requirements, and procurement
              regulation—providing incumbents with significant contract stickiness. Entry requires competitive tender
              (median contract values in the multimillion range; highest reported at £600 million), and Cera has secured
              contracts with 150+ authorities including Lincolnshire, Peterborough, Bedford, and Scottish council areas.

              NHS / Integrated Care Boards: Clinically-led purchasing of reablement, hospital-discharge bridging,
              virtual ward step-down, and preventative home care. Cera holds contracts across 29 of 42 NHS ICBs. ICBs
              increasingly value technology-enabled providers that can produce outcomes data (fall prediction,
              hospitalisation reduction) to meet ICS efficiency targets. Adoption here is faster than LA commissioning
              because ICS leadership has explicit incentives to reduce delayed discharges and A&E pressure.

              Private self-funders: Approximately 23.5% of users, approximately 20% of spend, but growing and with
              higher margin per hour (£32–34+ vs. £24.10). Buyers in this segment are typically adult children arranging
              care for elderly parents; they are quality-sensitive and value digital access and transparency. Providers
              are strategically migrating toward private pay to escape LA rate suppression.

              Technology-licensing (SaaS): A nascent fourth segment where Cera or peers license AI care-coordination
              platforms to other providers. This segment is strategically relevant but not yet a material revenue
              contributor as of 2026.
            claimRefs:
