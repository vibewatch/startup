      - number: '2.4'
        title: Growth Dynamics and Adoption Constraints
        blocks:
          - type: paragraph
            body: >
              The UK home care market is structurally demand-led: demographic ageing and NHS policy shifts are
              compounding drivers that will sustain above-GDP growth through at least 2035. The UK's over-65 population
              is rising from approximately 19% to a projected 27% of the total population over the next 50 years (ONS),
              and 85% of Cera's own patient base is already over 65. NHS policy is an active accelerant: the Better Care
              Fund directs £9 billion of joint NHS-local authority funding toward integrated care and hospital
              avoidance; virtual ward expansion requires community providers to accept step-down patients; and the
              Baroness Casey independent commission (Phase 1 reporting 2026) is expected to recommend increased
              investment in community and home-based care. The government pledged £4 billion in additional adult social
              care funding by 2028-29 in the Spending Review 2025.

              The principal supply-side constraint is workforce: approximately 111,000 unfilled adult social care roles
              as of 2026, with home care vacancy rates at approximately 13%—roughly four times the UK average—and staff
              turnover exceeding 30% annually. The March 2025 immigration rule change (closing the Health and Care visa
              for care and senior care workers) eliminated the international staffing pipeline that had partially
              bridged the domestic supply gap since Brexit. Structural wage underfunding from LA rates below the cost
              floor means domestic recruitment cannot close the gap without significant policy intervention.

              Technology adoption is a second-order constraint. Despite clear efficiency benefits from AI-enabled care
              platforms, a significant portion of the care workforce lacks digital literacy, and transitioning from
              manual/paper-based systems imposes upfront financial and operational costs that smaller providers cannot
              easily absorb. This creates a bifurcated market: scale operators with technology infrastructure grow share
              while small operators consolidate, exit, or hand back contracts to local authorities.

              The Health Foundation estimates that without sustained real-terms increases of 3–4.5% annually, the sector
              faces compounding funding shortfalls of £3.4–8.7 billion by 2028-29. This fiscal risk is partially offset
              by the Spending Review 2025 commitments, but the sector's structural dependency on under-indexed LA rates
              remains unresolved until the Casey Commission's final recommendations are implemented.
            claimRefs:
