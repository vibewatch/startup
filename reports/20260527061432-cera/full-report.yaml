      - number: '8.2'
        title: Capital structure and evidence quality
        blocks:
          - type: paragraph
            body: >-
              The public record strongly supports the existence of institutional capital and a refinancing event, but
              not the exact structure that matters most for downside protection. Official and legal-adviser sources
              confirm that BDT & MSD Partners and Schroders Capital led the January 2025 financing, and BDT's own
              website supports that this is a scaled, regulated merchant-banking platform rather than opportunistic
              capital. Companies House filings further show that two older Glas Trust charges were satisfied on 9
              January 2025 and replaced by newer Kroll-linked security, consistent with a debt-heavy refinancing. But
              public databases diverge sharply on total money raised: official sources say over $400 million, TechCrunch
              says more than $407 million, CB Insights says $561.69 million over 17 rounds, and Tracxn says $571 million
              over 13 rounds while separately classifying the latest round as both debt and equity. The same pattern
              appears in investor-count data, where Dealroom shows 33 investors and CB Insights lists 38. Revenue
              evidence is directionally positive rather than precise: Sifted put annualised revenue at £275 million in
              2023, CB Insights estimated 2023 revenue at $340.16 million, and Cera's May 2025 newsroom post claimed
              c.$500 million annualised revenue. That is enough to frame scenarios, but not enough to treat valuation
              math as clean.
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
