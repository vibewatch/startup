            body: >-
              Cera's disclosed customer mix is led by public-sector commissioners rather than self-serve consumer
              acquisition. Official and trade coverage repeatedly describe more than 150 local authorities and 29 of 42
              NHS integrated care boards using the model, which makes councils and NHS bodies the dominant buyers and
              payers for many care packages. The end users, however, are elderly or vulnerable people receiving home
              care, reablement, nursing, mental-health, learning-disability, palliative and other support in their
              homes. Family members are also visibly part of the product workflow: NHS England describes carers, family
              members and healthcare staff recording updates into the app, and both NHS England and Cumberland Council
              publish family-side testimonials. Public evidence also shows a smaller private-pay channel at branch level
              rather than only public commissioning. Lottie's Newcastle listing explicitly says the site accepts
              Private, Local Authority and NHS funding, while Cumberland Council's provider page addresses both disabled
              end users and relatives arranging care. Finally, Cera is trying to add a partner/licensing channel through
