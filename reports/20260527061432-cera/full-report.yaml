              The three highest-value asks are: branch-level CQC remediation history after Castleham; the covenant,
              tenor, and pricing package behind the mostly debt 2025 round; and AI-governance artefacts such as DPIAs,
              model-monitoring thresholds, bias testing, and override logs. These are the items most likely to change
              residual risk materially.
