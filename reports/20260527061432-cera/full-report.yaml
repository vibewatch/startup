    sections:
      - number: '8.1'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The central valuation question is not whether a real price exists; it does. Multiple sources support that
              Cera raised more than $150 million in January 2025 and crossed the $1 billion valuation threshold. The
              harder question is whether a new investor should treat that headline price as an attractive common-equity
              entry point. Public evidence does not support that leap. TechCrunch reported that the majority of the
              round was debt and that the company declined to disclose the split, while Companies House filings show
              broad secured charges around the same period. That means the headline valuation can describe market
              clearing price and still leave common-equity economics materially worse than the headline suggests.
              Operationally, Cera has real scale — a c.$500 million annualised revenue claim, 2.5 million monthly
              visits, and deep local-government/NHS penetration — but the public record still lacks the debt agreement,
              waterfall, and audited margin bridge required to convert a plausible enterprise-value story into an
              investable equity story. The right posture is therefore research-more rather than buy: acknowledge that
              the 2025 round validates demand for the asset, but insist on structure and cash-quality diligence before
              underwriting upside.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV011
              - CV013
