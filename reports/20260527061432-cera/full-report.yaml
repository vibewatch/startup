            body: >-
              Cera does not disclose direct customer-retention metrics in public materials: no NRR, GRR, logo churn,
              commissioner renewal rate, contract duration or cohort table is available from the sources reviewed. That
              means durability has to be inferred from proxies. Positive proxies include a Good branch profile in
              Newcastle via Lottie, a positive 2026 CQC page for Wiltshire, continuing public-procurement award flow,
              and evidence that some branches offer both fixed-term and ongoing care rather than one-off discharge-only
              episodes. Negative proxies are meaningful too. CQC's Castleham Lodge report found six legal breaches,
              missed and delayed visits, weak governance and staff-retention issues; Breakroom reviews separately cite
              rota instability, under-supported staff, poor communication, no sick pay and travel-time pressure. Taken
              together, the public record implies that customer relationships can be durable where execution is stable,
              but branch-level variance and workforce stress are credible threats to renewal quality. The unresolved
              diligence gap is not whether Cera has customers; it is whether its best public quality proxies map to the
