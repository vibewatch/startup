  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Portfolio and Service Modules
        blocks:
          - type: paragraph
            body: >
              Cera's commercial offering integrates three interlocking layers: a care-delivery operations platform
              (CeraApp and workforce tooling), a predictive clinical AI suite (Falls Prevention, Hospitalisation
              Predict-Prevent, illness detection), and an autonomous AI agents tier (Ami recruitment, Care Coordinator,
              Field Care Supervisor, Retention). A fourth layer, home-care robotics (GenieConnect), was added via
              acquisition in November 2025. The company positions the AI and robotics layers as licensable to external
              health and care organisations, creating a potential B2B technology revenue stream alongside its core
              care-delivery contracts.

              The CeraApp, available on iOS (version 1.27.0, May 2026, rated 4.3/5 from 253 ratings) and Android, serves
              as the primary data-capture interface. Carers log indicators such as sleep quality, mood, hydration, blood
              pressure, heart rate, and temperature at each visit. These structured observations feed directly into the
              predictive AI models, creating a closed-loop between frontline data collection and clinical risk
              detection. Automation of visit schedules and care plan generation reduces carer administrative time,
              allowing more time for direct patient interaction.

              Cera describes its AI agents as autonomous decision-support systems with reasoning, planning, and memory
              capabilities that take action without requiring human prompting for each step. The AI recruitment agent
              Ami has been deployed internally since early 2026, handling initial interviews for approximately 500,000
              annual applicants and doubling hiring throughput; Cera is now licensing Ami to external care
              organisations. Three further agents — Care Coordinator, Field Care Supervisor, and Retention — were
              launched to approximately 1,000 staff across 130+ UK sites in January 2026.
