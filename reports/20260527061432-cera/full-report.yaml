      - number: '4.2'
        title: Governance, Board Composition, and Ownership Structure
        blocks:
          - type: paragraph
            body: >
              Cera Care Limited (Companies House number 09874278) has 20 active officers as of May 2026, including eight
              active directors. The board is a notable mix of founders, American tech-capital representatives, and
              independent operators. Dr. Mahiben (Ben) Maruthappu, CEO and co-founder, has been a director since
              December 2016 and is the public face of the company. Marek Sacha, CTO and co-founder, has been on the
              board since the company's incorporation in November 2015. Peter Alexander Sands (b. January 1962, British)
              joined the board in February 2017; Peter Sands served as CEO of Standard Chartered from 2006 to 2015 and
              subsequently became Executive Director of The Global Fund to Fight AIDS, Tuberculosis and Malaria — a
              high-credibility independent director appointment. Andrew Stephen Brode (b. September 1940) has been a
              director since September 2019; at age 85 as of 2026, Brode is a veteran dealmaker who has chaired and
              invested in multiple UK healthcare businesses.

              Two American directors joined the board in 2024-2025: Matthew Edward Ashley (b. February 1974, British,
              appointed June 2024) and Alexander Jared Fiance (b. May 1988, American, appointed September 2025).
              Alexander Fiance's appointment in September 2025 — eight months after the January 2025 BDT & MSD-led round
              — is consistent with an investor board seat. Jordi Sabe (Spanish, appointed June 2024) likely represents
              Schroders Capital's governance engagement. Ankur Jain (American, b. February 1990, appointed June 2020)
              joined at Series C stage and may represent an earlier strategic investor.

              The Persons with Significant Control (PSC) register shows zero active PSCs, with a standing statement
              (notified April 1, 2020) that "the company knows or has reasonable cause to believe that there is no
              registrable person or registrable relevant legal entity in relation to the company." Under UK rules, this
              means no individual holds more than 25% voting rights or significant influence. The former PSC — Marek
              Sacha — ceased in March 2018 after a restructuring that distributed control below the 25% threshold,
              typically via a holding structure. While this is legally compliant, it reduces transparency: an investor
              cannot identify the beneficial ownership chain from public filings. The board has no disclosed independent
              remuneration or audit committee structures in the filing record, which is typical for a private company
              but limits governance verification for institutional investors.
