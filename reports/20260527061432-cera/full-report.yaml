        - High
        - Service buyers often choose reliability and quality before advanced analytics
        - >-
          Compare tender strike rates, referral conversion and branch-level quality performance against leading
          incumbents
      - - Public-sector procurement footprint
        - NHS virtual wards and neighbourhood teams internalise higher-value home-based care
        - High
        - Internal NHS pathways can absorb admission-avoidance and discharge work before outsourcing
        - Ask what share of Cera's NHS revenue is exposed to internal hospital-at-home expansion
      - - Residential / discharge adjacency
        - HC-One and similar incumbents can digitise and deepen step-down pathways
        - Medium
        - Large operators can adopt digital tools without adopting Cera's whole AI stack
        - Request evidence that Cera wins on discharge-to-home conversion and follow-on care retention
      - - Regional density advantages
        - Alcedo-style regional challengers can still add branches and service lines quickly
        - Medium
        - Regional leaders can defend local authority and workforce markets even without national AI branding
        - Review local authority concentration and branch economics in the North of England and Wales
      - - Formal care substitution
        - Unpaid carers remain the default fallback and are free at point of use for many households
        - Medium
        - Even weak substitutes can cap willingness to pay if public funding is unavailable
        - >-
          Test how Cera converts carers-in-crisis households and whether payer mix improves when informal care breaks
          down
