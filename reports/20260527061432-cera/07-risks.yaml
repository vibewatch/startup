    {
      "id": "market-competitive-and-policy-risks",
      "title": "Market, competitive, and policy risks",
      "body": "Cera's market risk is less about whether demand for home care exists and more about which organisation captures the highest-value parts of home-based care as policy evolves. NHS England's virtual-wards framework aims to deliver hospital-level care at home with occupancy consistently above 80%, which means internal NHS pathways can absorb some admission-avoidance and discharge activity before it reaches outsourced providers. That does not eliminate the need for domiciliary care, but it can narrow the highest-acuity, best-funded parts of the opportunity. Policy timing adds a second layer of uncertainty. The Casey Commission and the 2025 reform package show that social-care reform remains live, yet sector bodies are openly arguing the system cannot wait years for change. For Cera, the exposure is amplified by public-sector concentration: when the same system sets budgets, procurement rules, and substitution pathways, policy shifts can flow through pricing, renewal timing, and addressable scope simultaneously. The chapter therefore treats public-commissioning dependence, not simple category demand, as the key market risk. A thesis can still work if Cera wins share and improves economics, but policy and commissioner behaviour remain the main external variables.",
