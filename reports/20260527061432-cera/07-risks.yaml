      "id": "workforce-and-operational-risks",
      "title": "Workforce and operational risks",
      "body": "Cera's operating model is labour-heavy even though its public narrative is AI-heavy. The underlying sector is still short of carers, with Centre for Care describing roughly 111,000 unfilled roles, and the government's 2025 decision to end new overseas care-worker recruitment removes a labour buffer that the sector had come to rely on. Rising wage floors worsen the squeeze: the National Living Wage stepped to £12.21 for 2025-26 and moves again to £12.71 from April 2026. Public fee rates have not kept up. Homecare Association says the average state-funded rate is £24.10 per hour and Care England reports that most fee uplifts did not cover NLW costs, leaving a meaningful share of providers already in deficit. For Cera specifically, the direct public workforce-risk evidence is not only sectoral. Breakroom reviews mention inconsistent hours, weaker pay during annual leave, and communication problems, while the Castleham Lodge findings show how staffing and governance issues can become regulator-visible quality failures. The operating risk is therefore not just hiring enough carers; it is hiring, retaining, and supervising them tightly enough that branch-level quality does not deteriorate under cost pressure.",
