  "chapter": {
    "number": 7,
    "title": "Risks",
    "summary": "Cera's risk profile is dominated by an interaction effect: public-sector concentration, underfunded commissioning, and labour scarcity all sit underneath a more visible AI story. The clearest hard adverse evidence is CQC's Castleham Lodge assessment, which found six breaches across safeguarding, staffing, governance, complaints, and safe care. Financial pressure is structural rather than cyclical: Homecare Association's fee-rate research shows an average state-funded rate of £24.10 per hour against materially higher minimum-price benchmarks, while Care England and broader policy sources describe a sector already operating under deficit stress. Technology adds a second layer rather than replacing the first: BMJ challenged the framing of Cera's flagship AI rollout, ICO and CQC both imply heavier governance duties for care AI, and GenieConnect plus cloud infrastructure widen dependency risk. The result is a business with real scale and real mitigants, but also a risk stack that is unusually exposed to policy, price, quality, and governance slippage at the same time."
  },
