  "callouts": [
    {
      "calloutType": "risk",
      "title": "The biggest risk cluster is public-system dependence, not a single AI bug",
      "body": "Cera's most material downside comes from the interaction of public-sector concentration, underfunded commissioning, labour scarcity, and service-quality accountability. AI risk matters, but it becomes most dangerous when cost pressure and branch-level execution are already under strain.",
      "claimRefs": [
        "CR017",
        "CR019",
        "CR027",
        "CR044"
      ]
    },
    {
      "calloutType": "recommendation",
      "title": "Priority diligence should focus on quality remediation, debt terms, and AI governance artefacts",
      "body": "The three highest-value asks are: branch-level CQC remediation history after Castleham; the covenant, tenor, and pricing package behind the mostly debt 2025 round; and AI-governance artefacts such as DPIAs, model-monitoring thresholds, bias testing, and override logs. These are the items most likely to change residual risk materially.",
      "claimRefs": [
        "CR002",
        "CR026",
        "CR033",
        "CR036"
      ]
    },
    {
      "calloutType": "insight",
      "title": "Cera has genuine mitigants, but most are narrower than the risk surface",
      "body": "DSPT “Standards met,” visible cloud engineering activity, and broad public commissioning reach are real positives. But none of them answers the hardest questions about branch-level quality trends, contract repricing power, or whether the flagship AI systems are governed as rigorously as they are marketed.",
      "claimRefs": [
        "CR012",
        "CR023",
        "CR036",
        "CR038"
      ]
    }
  ],
