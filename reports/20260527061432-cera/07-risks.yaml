    {
      "id": "technology-ai-and-data-risks",
      "title": "Technology, AI, and data risks",
      "body": "Cera's technology risk is not limited to cyber hygiene; it includes model validity, data governance, cloud dependence, and integration complexity. The BMJ directly challenged the framing of the NHS rollout narrative around Cera's falls AI and reported that public accuracy claims were rooted in technical evaluations rather than peer-reviewed evidence. Home Care Insight separately quoted the NHS Confederation warning that AI uses should be robustly evaluated. That is a real diligence problem because CQC says providers remain accountable for AI-enabled care outcomes and ICO guidance treats care data as highly sensitive. Public mitigants exist: Cera's DSPT history shows \"Standards met,\" and the GitHub organisation suggests active infrastructure work across AWS and GCP. But those are incomplete controls. DSPT does not answer whether Cera has published model-drift thresholds, bias-testing cadences, DPIAs, or incident logs, and GitHub evidence of cloud usage also confirms dependence on third-party platforms. GenieConnect and the AI Lab widen the surface further by adding hardware, manufacturer, licensing, and cross-border governance complexity. In short, Cera's AI story increases both upside optionality and the number of failure modes investors need to monitor.",
