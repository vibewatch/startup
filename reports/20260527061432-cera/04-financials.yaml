callouts:
  - calloutType: strength
    title: Institutional Investor Quality Signals a Durable Thesis
    body: >
      The combination of BDT & MSD Partners (patient, founder-oriented merchant bank) and Schroders Capital
      (FTSE 100 institutional, long-duration mandate) as co-leads provides one of the strongest institutional
      validation signals available for a UK private health-tech company. Peter Sands' board presence as a
      former FTSE 100 bank CEO further anchors governance credibility. These investors conduct rigorous
      private-market diligence before committing at unicorn scale — their participation is a confirmed
      positive signal of institutional confidence in Cera's model.
    claimRefs:
      - CI002
      - CI003
      - CI013

  - calloutType: risk
    title: Debt-Led Financing Creates Covenant and Cash-Flow Opacity
    body: >
      Two outstanding secured charges held by Kroll Trustee Services Limited (created December 2024 and
      March 2025) with broad "all current and future material land" security indicate material debt
      obligations from the January 2025 round. The terms — interest rate, covenants, tenor, and
      repayment schedule — are not publicly disclosed. Without access to the credit agreement, an
      investor cannot assess covenant headroom, trigger risk, or the true enterprise-to-equity value
      bridge. This is a material diligence blocker.
    claimRefs:
      - CI005
      - CI006
      - CI041

  - calloutType: risk
    title: Worker Welfare Adverse Signals Create Regulatory and Operational Risk
    body: >
      Cera's care workers are paid below the UK Real Living Wage (£12.21-13.85/hr vs £13.45 benchmark),
      most workers receive no paid breaks, and the Breakroom platform rates Cera 4.7/10 based on 274
      worker reviews — below sector norms. As UK government adult social care reform initiatives include
      mandatory pay improvements for care workers, this gap could force cost increases. Worker attrition
      risk is high at below-living-wage rates, and any operational capacity shortfall would directly
      impair NHS and local authority contract delivery.
    claimRefs:
      - CI031
      - CI032
      - CI033
      - CI034

