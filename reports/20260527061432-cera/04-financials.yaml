  - id: counter-signals-and-diligence-gaps
    title: Counter-Signals, Adverse Indicators, and Financial Diligence Blockers
    summary: Debt opacity, governance concentration risk, worker satisfaction concerns, unaudited financials, and AI-outcome claim provenance issues.
    body: >
      Cera presents a compelling growth story but carries a cluster of adverse signals that should inform
      diligence framing. First, the financing structure is debt-weighted in a way that limits equity-upside
      clarity: two outstanding Kroll-secured charges cover broad asset classes, and neither the debt-to-equity
      split in the January 2025 round nor the interest rate, tenor, or covenant package have been disclosed.
      A scenario where much of the $150 million is debt rather than equity implies that the $1B+ valuation
      rests on a smaller equity base, and any covenant breach could trigger acceleration events.

      Second, ownership opacity is a governance risk. The PSC register shows no registrable person, meaning
      beneficial ownership above 25% is achieved through a holding structure not visible in UK public filings.
      This is legal and common for venture-backed companies but means an investor faces a non-trivial KYC
      exercise to trace ultimate beneficial owners, particularly given the cross-border nature of BDT & MSD
      (US), Schroders Capital (UK/global), and unnamed prior investors.

      Third, AI outcome claims rely heavily on company-commissioned evidence. The Faculty study (reducing
      hospitalisations by 52-70%) was commissioned by Cera, covers a subset of deployments, and has not been
      independently replicated or published in a peer-reviewed journal. The £1bn NHS savings forecast is
      extrapolated nationally from this study and should be treated as a company-claimed projection rather
      than a regulatory finding.

      Fourth, worker welfare signals are adverse: pay below the Real Living Wage, absence of sick pay, and
      a 4.7/10 Breakroom rating from frontline workers create reputational exposure and regulatory risk,
      particularly as the UK government's Adult Social Care Reform agenda includes workforce pay improvement
      as a stated objective. A sustained shortage of care workers willing to work at below-living-wage
      rates could strain Cera's operational capacity, which currently depends on recruiting and retaining
      over 10,000 workers.

      Fifth, Sifted reported in November 2023 that Cera was nearing profitability but had delayed
      international expansion — a sign that the company had previously attempted international moves that
      proved less viable than the UK core. Whether that plan has revived under the 2025 unicorn funding
      is unclear.
