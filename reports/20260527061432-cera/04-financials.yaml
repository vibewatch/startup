  - id: revenue-model-and-strategic-partnerships
    title: Revenue Model, Traction, and Strategic Partnership Depth
    summary: NHS and local authority commissioning, scale metrics, AI platform as a second revenue vector, and partnership quality signals.
    body: >
      Cera's primary revenue engine is commissioned homecare delivery, billed on a per-visit or per-hour basis by NHS
      Integrated Care Boards (ICBs) and local authorities across the UK. By January 2025, Cera served 150+ local
      governments — covering roughly 39% of the UK's 382 local authorities — and 29 of 42 NHS ICBs (two-thirds),
      reaching approximately 30 million people. One care visit is delivered every second, and annualised revenues
      reached approximately $500 million (~£400 million at prevailing exchange) by May 2025. Commissioned care at
      this volume is a strong investment signal: NHS and local authority commissioning contracts are multi-year,
      publicly funded, and institutionally credible. They also imply low counter-party credit risk and relatively
      stable demand, given demographic tailwinds in an ageing UK population.

      Revenue quality is partially constrained by public-sector pricing dynamics. The Homecare Association's
      2025-26 recommended minimum fee rate is £30.36/hour (up from £28.53 in 2024-25), reflecting care-worker
      costs after the April 2025 National Living Wage increase, while commissioning bodies typically pay between
      £23 and £24 per hour — well below the minimum recommended rate. This structural underpayment compresses
      gross margins and creates a chronic mismatch between what commissioners pay and what full-cost delivery
      requires. Cera's scale may provide marginal purchasing leverage for technology and logistics, but it cannot
      alter the underlying public-sector pricing constraint without either policy change or diversification into
      private-pay or platform licensing.

      The second revenue vector — AI platform licensing — is nascent but strategically significant. Cera launched
      its AI Lab in April 2026 with an 8-figure self-investment (£10M+), focused on "Cera Genie" and AI-agent
      products that automate care decisions, scheduling, and clinical alerts. The company claims to have deployed
      1,000 AI agents across its care platform and points to a Faculty (London-based AI consultancy) study
      concluding that its Digital Care Plan reduced hospitalizations in over-65s by 52-70%. Licensing this AI
      platform to other care providers, local authorities, and NHS bodies would diversify Cera beyond
      service-delivery revenue, but to date no licensing revenue figure has been disclosed.
