  - id: unit-economics-and-org-maturity
    title: Unit Economics, Cost Structure, and Organisational Maturity
    summary: Care-visit cost drivers, worker pay signals, hiring capacity, GTM efficiency, and AI investment as a cost structure signal.
    body: >
      Cera's unit economics are primarily driven by care-worker labour costs, which constitute the majority of
      per-visit variable cost. Breakroom data (274 worker respondents, updated April 2026) shows care assistants
      earning £12.24-13.79/hour, with 21-and-over workers paid £12.21-13.85/hour. The UK Real Living Wage for
      outside London was £13.45/hour in 2025-26. A significant portion of Cera's care workers are therefore paid
      below the Real Living Wage, creating both a reputational risk and a long-term cost risk if wage floors
      increase. Breakroom also reports that most care workers at Cera do not receive paid breaks, and the platform
      assigns a worker-satisfaction rating of 4.7 out of 10 — below the average for UK care providers. At least
      one February 2026 review cited absence of sick pay as a "worst thing."

      GTM efficiency proxies are difficult to evaluate from public data. Cera's B2G/B2B model (commissioning from
      local authorities and NHS bodies) implies a long but stable sales cycle — procurement frameworks typically
      run 3-5 years, with embedded renewal at the end of each term. Customer acquisition cost for a commissioned
      care contract is primarily bid-preparation and compliance cost, not paid advertising or sales-team expense.
      The 150+ local authority base represents near-saturation of councils willing to commission managed digital
      homecare, and further growth would likely require either market-share displacement or expansion into new
      services (private pay, international, or SaaS). As of May 2026, Cera has 132 open job listings across the
      UK (Breakroom), suggesting continued operational expansion.

      Cera claimed EBITA-positivity in 2023 and free-cash-flow positivity in 2024. These are company-reported
      metrics not yet corroborated by filed accounts: FY2024 accounts are not yet on Companies House (the last
      published accounts for Cera Care Limited would cover through FY2022 or FY2023 at best). The April 2026
      AI Lab 8-figure investment implies ongoing capital deployment from the January 2025 round, and the
      simultaneous share allotments (April 2026) suggest equity financing was accessed again. An investor
      relying solely on public data cannot verify burn rate, gross margin, or unit-level contribution margin.
