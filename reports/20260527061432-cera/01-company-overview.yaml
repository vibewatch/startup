    severity: minor
    topic: board-and-leadership-completeness
    missingEvidence: Full board composition including committee memberships, compensation structures, and any independent non-executive directors not listed on Companies House.
    whyItMatters: Incomplete board picture limits governance quality assessment; undisclosed committees and remuneration could mask misaligned incentives.
