- id: funding-and-financial-profile
  title: Funding History, Valuation, and Financial Profile
  body: 'Cera has raised over $571 million in total across thirteen funding rounds since 2016, blending venture equity with institutional debt. The most recent financing was a $150 million round in January 2025 — primarily debt, led by BDT & MSD Partners and Schroders Capital — that valued the company at over $1 billion, confirming unicorn status. Participating investors across the equity base include Earlymarket, Guinness Ventures, DigitalHealth.London, and Robin Klein. The 2022 Series C raised $320 million (led by Vanderbilt University, Jane Street, and Schroders Capital) and the 2020 Series B raised $70 million led by Kairos, Yabeo, and Guinness Global Investors.

    On profitability, Cera''s spokesperson confirmed the company was EBITA-positive in 2023 and free-cash-flow positive in 2024. Revenue exceeded $500 million in 2025, reflecting a 100-fold scale-up over five years (from approximately $5 million at launch). The company describes itself as "increasingly a self-sustaining business," which it cites as the reason it could raise a primarily debt-based round in 2025 rather than dilutive equity. Publicly filed accounts at Companies House have not yet reflected these profitability milestones as of the filing date; external verification of the exact EBITDA margin and revenue figure remains a diligence gap.

    The business delivers care on behalf of 150+ local governments and two-thirds of NHS Integrated Care Systems, which provides a high-quality, largely recurring public-sector revenue base, reducing customer concentration risk. Claims to save the UK healthcare system £1 million per day (revised upward to £1.5 million per day in October 2025 by an independent analysis) have not been independently peer-reviewed and should be treated as company-supported claims requiring third-party validation.

    '
