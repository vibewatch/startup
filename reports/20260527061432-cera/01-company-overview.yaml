- id: scale-impact-technology
  title: Scale, Operational Impact, and AI Technology
  body: 'As of May 2026 Cera operates at a scale that rivals the NHS''s own community-care footprint: 2.5 million patient home visits monthly (equivalent to the total visits to all NHS Accident and Emergency departments nationwide), conducted by more than 10,000 carers and nurses in over 100 UK cities. The company processes approximately 500,000 job applications per year and has attracted over 1 million applicants to the care sector since 2016.

    Cera''s AI platform collects data from every visit, producing a dataset described as exceeding 300 billion data points. Proprietary algorithms include a Falls Prevention AI, capable of predicting over 80 percent of falls a week before they occur, and a Hospitalisation Predict-Prevent AI, which the company claims predicts 83 percent of hospitalisations seven days in advance. Cera attributes a 20 percent reduction in falls and up to a 70 percent reduction in hospitalisations to its AI tools, though these figures are company-stated and based on internal programme analyses rather than peer-reviewed randomised trials.

    In January 2026 Cera deployed a suite of nearly 1,000 AI agents across its workforce, including Ami (AI recruitment agent, doubling hiring volumes), an AI Care Coordinator Agent (halves time to organise last-minute cover), a Field Care Supervisor Agent (cuts care review time by 85 percent), and an AI Retention Agent (identifies at-risk staff up to seven times faster, with 22 percent retention improvement claimed). The company acquired GenieConnect (robot care platform) in 2025 and is piloting AI-powered care robots in patient homes. In April 2026 it launched a dedicated AI Lab — backed by an eight-figure investment and staffed by Entrepreneurs in Residence, data scientists, and clinicians — to build and license AI tools to healthcare providers globally. The UK AI Minister publicly endorsed the Lab launch.

    '
