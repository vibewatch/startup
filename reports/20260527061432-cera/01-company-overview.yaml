  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: key-person-risk
    missingEvidence: Formal succession plan, CEO insurance, or governance documentation demonstrating continuity if Dr. Maruthappu departed.
    whyItMatters: All brand, investor, and government relationships concentrate on a single founder-CEO; departure could destabilise funding and NHS contract renewal.
    diligencePath: Request board governance documents; assess employment contracts and key-man insurance policies.
    relatedQuestionRefs:
    - QO013
  - type: private-evidence-only
    severity: minor
    topic: acquisition-terms
    missingEvidence: Financial terms, acquisition price, and integration details for the GenieConnect acquisition in 2025.
    whyItMatters: The acquisition advances Cera's robotics roadmap; understanding the price and earn-out structure affects asset valuation.
    diligencePath: Review Companies House filings for GenieConnect; request transaction documents.
    relatedQuestionRefs:
    - QO021
  - type: missing-source
    severity: minor
    topic: germany-operations
    missingEvidence: 'Detailed metrics on Cera''s German operations: revenue, visit volume, workforce, and regulatory status with German Pflegedienst authorities.'
    whyItMatters: Germany expansion is cited as a growth vector in the 2025 fundraise; scale and progress affect market opportunity assessment.
    diligencePath: Search German healthcare regulator databases; contact Cera for Germany-specific metrics.
    relatedQuestionRefs:
    - QO022
  - type: private-evidence-only
    severity: material
    topic: data-governance
    missingEvidence: Formal data governance documentation including ICO registration, GDPR compliance framework, data anonymisation methodology, and consent management processes for the 300B+ data point dataset.
    whyItMatters: Data is Cera's core AI moat; any GDPR enforcement or consent challenge could limit model training and invalidate the core technology value proposition.
    diligencePath: Request ICO registration number; review privacy policy and DPIA documentation; engage data protection counsel.
    relatedQuestionRefs:
    - QO023
  - type: private-evidence-only
    severity: material
    topic: financials
    missingEvidence: Publicly filed Companies House accounts confirming EBITA and FCF-positive status, with exact revenue and margin figures.
    whyItMatters: Financial profitability claims are company-stated and have not been independently audited or filed with Companies House, limiting investor verification.
    diligencePath: Request audited management accounts from Cera directly; monitor Companies House for annual filings.
    relatedQuestionRefs:
    - QO009
    - QO010
  - type: missing-source
    severity: material
    topic: AI-performance
    missingEvidence: Peer-reviewed clinical study independently validating Cera's AI prediction accuracy (80%+ falls, 83% hospitalisations) and outcome claims (70% hospitalisation reduction, 20% fall reduction).
    whyItMatters: All performance claims originate from company-internal analysis; absence of independent peer review introduces evaluation risk for payers and commissioners.
    diligencePath: Search PubMed and NHS Evidence for independent validation; request Faculty consultancy full methodology report.
    relatedQuestionRefs:
    - QO017
    - QO024
  - type: private-evidence-only
    severity: material
    topic: debt-covenants
    missingEvidence: Details of debt covenants, interest rate, repayment schedule, and governance rights attached to the $150M January 2025 round.
    whyItMatters: The majority of the 2025 round was debt; covenant restrictions could limit future equity dilution options and strategic flexibility.
    diligencePath: Review loan agreement and any security register filings at Companies House; engage legal counsel for term sheet review.
    relatedQuestionRefs:
    - QO027
