      - number: '4.2'
        title: 治理、董事会构成与所有权结构
        blocks:
          - type: paragraph
            body: >
              截至 2026 年 5 月，Cera Care Limited（Companies House 编号 09874278）有 20 名在任公司官员，其中包括 8
              名在任董事。董事会组合值得注意，混合了创始人、美国科技资本代表和独立运营者。Dr. Mahiben (Ben) Maruthappu 是 CEO 兼联合创始人，自 2016 年 12
              月起担任董事，也是公司公众面孔。Marek Sacha 是 CTO 兼联合创始人，自公司 2015 年 11 月注册成立以来即在董事会任职。Peter Alexander Sands（1962 年 1
              月出生，英国人）于 2017 年 2 月加入董事会；Peter Sands 曾在 2006 至 2015 年担任 Standard Chartered CEO，随后出任 The Global Fund to
              Fight AIDS, Tuberculosis and Malaria 执行董事，是可信度很高的独立董事任命。Andrew Stephen Brode（1940 年 9 月出生）自 2019 年 9
              月起担任董事；截至 2026 年已 85 岁，Brode 是资深交易撮合者，曾担任多家英国医疗企业董事长并投资其中。

              2024-2025 年，两名美国背景董事加入董事会：Matthew Edward Ashley（1974 年 2 月出生，英国人，2024 年 6 月获任）和 Alexander Jared
              Fiance（1988 年 5 月出生，美国人，2025 年 9 月获任）。Alexander Fiance 在 2025 年 9 月获任，距 2025 年 1 月 BDT & MSD
              领投融资八个月，符合投资方董事席位特征。Jordi Sabe（西班牙人，2024 年 6 月获任）很可能代表 Schroders Capital 的治理参与。Ankur Jain（美国人，1990 年 2
              月出生，2020 年 6 月获任）在 Series C 阶段加入，可能代表更早期战略投资者。

              Persons with Significant Control（PSC）登记册显示没有在任 PSC，并有一项持续声明（2020 年 4 月 1
              日通知）：公司「知悉或有合理理由相信，公司没有可登记个人或可登记相关法律实体」。按英国规则，这意味着没有个人持有超过 25% 投票权或重大影响力。前 PSC Marek Sacha 在 2018 年 3
              月重组后退出 PSC 状态，控制权被分散到 25%
              门槛以下，通常通过控股结构实现。法律上合规，但透明度下降：投资者无法从公开申报中识别受益所有权链条。申报记录未披露独立薪酬或审计委员会结构，这对私营公司很常见，但限制了机构投资者对治理的验证。
