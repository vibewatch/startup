      - number: '8.2'
        title: 资本结构与证据质量
        blocks:
          - type: paragraph
            body: >-
              公开记录强力支持机构资本和再融资事件确实存在，但并不支持下行保护最关键的具体结构。官方和法律顾问来源确认，BDT & MSD Partners 和 Schroders Capital 领投 January
              2025 融资；BDT 自己的网站也支持其为有规模、受监管的商人银行业务平台，而非机会型资本。Companies House 文件进一步显示，两个较老的 Glas Trust 担保已于 9 January
              2025 解除，并被新的 Kroll 相关担保替代，这与偏债务的再融资相吻合。但公开数据库对总融资额分歧很大：官方来源称超过 $400 million，TechCrunch 称超过 $407 million，CB
              Insights 称 17 轮共 $561.69 million，Tracxn 称 13 轮共 $571 million，同时又将最新轮分类为债务和股权。投资者数量数据也呈现同样模式，Dealroom 显示 33
              名投资者，CB Insights 列出 38 名。收入证据方向正面，但不精确：Sifted 将 2023 年化收入置于 £275 million，CB Insights 估算 2023 收入为 $340.16
              million，Cera 在 May 2025 新闻室文章中宣称约 $500 million 年化收入。这足以搭建情景，但不足以把估值数学视为干净。
