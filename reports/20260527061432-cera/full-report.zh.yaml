        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              Cera 披露的客户结构由公共部门委托方主导，而不是自助式消费者获客。官方和行业报道反复提到，超过 150 个地方政府和 42 个 NHS integrated care boards 中的 29
              个在使用该模型，这让地方议会和 NHS 机构成为许多护理套餐的主导买方和付款方。真正的终端用户则是接受居家护理、康复、护理、心理健康、学习障碍、临终关怀等支持的老人或脆弱人群。家庭成员也明显嵌在产品流程里：NHS
              England 称护理员、家属和医护人员会把更新记录进应用，NHS England 和 Cumberland Council
              都发布了家属侧证言。公开证据还显示，分支层面存在规模较小的自费渠道，而不只是公共委托。Lottie 的 Newcastle 页面明确写到，该站点接受自费、地方政府和 NHS 资金；Cumberland
              Council 的服务提供商页面同时面向残障终端用户和安排护理的亲属。最后，Cera 正试图通过向其他健康与护理机构销售 AI 智能体，增加合作伙伴 / 授权渠道，但该动作的公开客户名称和收入仍缺席。
