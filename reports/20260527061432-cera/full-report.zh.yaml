      - number: '5.2'
        title: 技术架构与数据平台
        blocks:
          - type: paragraph
            body: >
              Cera 的工程基础设施托管在云上；ceracare 组织名下的公开 GitHub 仓库显示，团队有面向 AWS 和 GCP 的可扩展基础设施 Terraform 模块，印证了多云路线。一个后端 C#
              面试仓库表明服务端组件基于 .NET。ceracare GitHub 组织有 5+ 个公开仓库，其中 AWS Terraform runner 模块最后更新于 July 2025，GCP landing
              zones 模块更新于 December 2024，说明基础设施仍在维护。核心自研代码——AI 模型和 CeraApp 逻辑——未公开。

              核心数据资产是一套纵向数据集，包含通过数字健康计划、集成用药记录、动态风险评分，以及 CeraApp 实时护理观察累积的超过 300 billion 个匿名化健康数据点。数据集既是预测模型的训练语料，也是新 AI
              智能体的评估环境。Cera 的 2026 AI Lab 将直接使用这套语料，在国际授权前开发并验证新工具。

              Cera 与专业 AI 咨询公司 Faculty.ai 合作开发住院预测模型。Faculty 发布的案例研究称，该模型能提前最多一周预测 80% 的住院，并且准确度是单靠临床医生的
              2.6×。模型向护理人员输出按优先级排序的患者风险清单，让 GP 电话咨询或社区护士上门等低成本预防干预可以落地。Faculty 称结果经过独立审查并发表于顶级医学期刊，但 Cera 尚未公开具体期刊引用。
