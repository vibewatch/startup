      - number: '3.4'
        title: 替代方案、采购机制与护城河韧性
        blocks:
          - type: paragraph
            body: >
              Cera 最容易被低估的竞争压力，可能来自 NHS 内部交付，而不是另一个品牌化居家护理服务商。NHS England 的虚拟病房指南称，这些服务现在已覆盖每个综合护理系统，目标床位占用率高于
              80%，并把虚拟病房定义为急性护理替代方案，把服务转移到患者日常居住地。另一项 NHS 政策计划把虚拟病房容量从 7,000 张床扩至 10,000 张以上，并有更长期目标，即每 100,000 人 40-50
              张床。这些路径不会替代长期居家护理，但可以在高价值的避免入院和出院服务到达外包服务商前先吸收掉。


              Buurtzorg 今天更像模式竞争者，而不是规模化英国运营商。它的自管理邻里团队主导荷兰居家护理，自 2015
              年起也在英国开展工作，因此委托方可以把它作为证据，说明本地、护士主导、层级更扁平的运营结构可以替代集中式平台。无偿家庭照护更重要：Carers UK 估计英国有 5.7 million
              名无偿护理者，使非正式照护成为遥遥领先的最大替代方案，尽管它财务脆弱且往往不可持续。


              因此，Cera 的护城河处在微妙位置。公司似乎独特地结合了全国直接护理规模和强 AI 叙事，但竞争对手可以逐层蚕食：Helping Hands 攻信任和质量，Prestige 攻临床治理，Birdie 和 PCS
              攻工作流所有权，Lilli 攻预测 ROI，NHS 路径攻居家急性治疗，无偿护理者则提供基础替代。核心尽调问题不是 Cera
              有没有竞争对手，而是其一体化模式能否比这些更窄的替代方案带来实质更好的投标胜率、留存或利润率。
