      - number: '7.4'
        title: 技术、AI 与数据风险
        blocks:
          - type: paragraph
            body: >-
              Cera 的技术风险不止网络安全卫生；还包括模型有效性、数据治理、云依赖和集成复杂度。BMJ 直接质疑了围绕 Cera 跌倒 AI 的 NHS
              推广叙事，并报道公开准确率主张扎根于技术评估，而不是同行评审证据。Home Care Insight 另行引用 NHS Confederation 的警告称，AI 用途应接受扎实评估。这是实打实的尽调问题，因为
              CQC 称服务提供商仍要对 AI 赋能的护理结果负责，ICO 指引也把护理数据视为高度敏感数据。公开缓释因素存在：Cera 的 DSPT 历史显示「Standards met」，GitHub 组织也表明其在
              AWS 和 GCP 上有活跃基础设施工作。但这些控制并不完整。DSPT 无法回答 Cera 是否发布了模型漂移阈值、偏见测试节奏、DPIA 或事件日志；GitHub
              上的云使用证据也确认了对第三方平台的依赖。GenieConnect 和 AI Lab 进一步扩大风险面，引入硬件、制造商、授权和跨境治理复杂度。简言之，Cera 的 AI
              故事同时增加了上行可选性，也增加了投资者需要监控的失效模式数量。
