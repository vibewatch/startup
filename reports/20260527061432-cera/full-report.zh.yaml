      - number: '4.5'
        title: 反向信号、不利指标与财务尽调堵点
        blocks:
          - type: paragraph
            body: >
              Cera 呈现出有吸引力的增长故事，但也带有一组反向信号，尽调时必须纳入框架。第一，融资结构偏债，限制了股权上行的清晰度：两项未结清的 Kroll 担保押记覆盖广泛资产类别，而 2025 年 1
              月融资中的债股比例、利率、期限和契约包均未披露。如果 $150 million 中大部分是债务而非股权，则 $1B+ 估值建立在更小的股权基数上，任何契约违约都可能触发加速到期事件。

              第二，所有权不透明是治理风险。PSC 登记册没有可登记个人，意味着超过 25% 的受益所有权通过英国公开申报不可见的控股结构实现。这对风投支持公司合法且常见，但投资者需要花费不小的 KYC
              成本追溯最终受益所有人，尤其考虑到 BDT & MSD（美国）、Schroders Capital（英国 / 全球）和未具名早期投资者的跨境属性。

              第三，AI 结果主张高度依赖公司委托证据。Faculty 研究（住院减少 52-70%）由 Cera 委托，覆盖部分部署场景，尚未被独立复现，也未发表在同行评审期刊。£1bn NHS
              节省预测由该研究全国外推而来，应视为公司主张的预测，而不是监管结论。

              第四，员工福利信号偏负面：薪资低于 Real Living Wage、没有病假工资，以及一线员工给出的 4.7/10 Breakroom 评分，共同带来声誉暴露和监管风险；英国政府 Adult Social
              Care Reform 议程已把改善劳动力薪酬列为明确目标。如果愿意以低于生活工资水平工作的护理员持续短缺，Cera 的运营产能会承压，而公司当前依赖招聘并留住超过 10,000 名员工。

              第五，Sifted 2023 年 11 月报道称，Cera 接近盈利但推迟了国际扩张——这说明公司此前尝试的国际化动作不如英国核心业务可行。2025 年独角兽融资后，该计划是否重启仍不清楚。
