  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 核心风险
      - 概率信号
    rows:
      - - 乐观
        - 经审计收入在 2026 年结束时超过 $600 million，AI 工具转化为已披露的软件型收入，债务条款显示契约余量充足。
        - 在 $600-650 million 收入上给 3.0x-3.5x 估值 / 收入，可支撑约 $1.8-2.3 billion 名义价值；倍数扩张有吸引力，但不极端。
        - AI 变现未能从服务交付中拆出来，或债务仍足够优先，压住股权上行。
        - 需要新的文件证据；仅靠当前公开记录支撑不了。
      - - 基准
        - 年化收入维持在 $500-550 million 附近，公共委托方合同保持粘性，AI 对运营质量的改善多于变现。
        - 2.0x-2.5x 收入可支撑约 $1.0-1.4 billion 名义价值；除非结构比表面更干净，否则当前价格上行有限。
        - 量不增长、工资通胀或高于预期的总部成本，会让股权回报平庸。
        - 最符合留存证据，也符合继续研究 / 观察姿态。
      - - 悲观
        - 债务比预期更紧、劳动力压力恶化，或公共委托方定价和增长撑不起当前叙事。
        - 按 $450-500 million 收入给 1.0x-1.6x，意味着约 $0.45-0.8 billion 名义价值；扣除结构性优先级后，普通股回报偏弱或为负。
        - 契约违约、估值下调融资风险，或企业经营稳定但股权价值被压缩。
        - 如果尽调显示多数债务融资附带限制性条款，或劳动力指标恶化，该情景就有现实可能。
    notes: 情景价值是基于留存公开证据的分析师估计，不是投行式 DCF；下行对债务结构和劳动力经济性更敏感，而不只看收入。
