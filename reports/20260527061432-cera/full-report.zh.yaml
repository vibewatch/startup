              Better Care Fund（£9B）、Spending Review 2025（到 2028-29 年增加 £4B）、虚拟病房扩张和 Casey Commission（Phase 1 建议 2026
              年）都指向公共部门居家护理采购增长。这种政策一致性在中期显著降低 Cera 公共部门收入底座的风险。
