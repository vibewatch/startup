  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品组合与服务模块
        blocks:
          - type: paragraph
            body: >
              Cera 的商业产品由三层扣在一起：护理交付运营平台（CeraApp 和员工工具）、预测型临床 AI 套件（Falls Prevention、Hospitalisation
              Predict-Prevent、疾病检测），以及自主 AI 智能体层（Ami 招聘、Care Coordinator、Field Care Supervisor、Retention）。2025 年 11
              月，公司通过收购补上第四层：家庭护理机器人（GenieConnect）。Cera 将 AI 和机器人层定位为可授权给外部健康与护理机构的技术，在核心护理交付合同之外，可能打开 B2B 技术收入流。

              CeraApp 有 iOS 版（版本 1.27.0，May 2026，253 个评分下为 4.3/5）和 Android
              版，是主要的数据采集入口。护理员每次上门时记录睡眠质量、情绪、补水、血压、心率、体温等指标。结构化观察直接流入预测 AI
              模型，把一线数据采集和临床风险检测连成闭环。上门排班和护理计划生成自动化后，护理员的行政时间减少，可以把更多时间留给直接患者互动。

              Cera 将其 AI 智能体描述为自主决策支持系统，具备推理、规划和记忆能力，不需要人类每一步提示就能行动。AI 招聘智能体 Ami 已自 2026 年初起在内部部署，处理每年约 500,000
              名申请人的初面，并将招聘吞吐量翻倍；Cera 现在正把 Ami 授权给外部护理机构。另有三个智能体——Care Coordinator、Field Care Supervisor 和 Retention——已于
              January 2026 面向 130+ 个英国站点的约 1,000 名员工推出。
