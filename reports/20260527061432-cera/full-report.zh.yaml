          - type: callout
            title: 证据基础缺口正被审视
            body: >
              BMJ 在 April 2025 的调查发现，NHS England 对 Cera Falls Prevention AI「全国铺开」的公告具有误导性，97%
              准确率主张建立在内部技术评估上，而不是已发表的同行评审试验。NHS Confederation 呼吁做扎实的独立评估。这个缺口带来实质风险：一旦触发监管分类（MHRA SaMD），Cera
              将面对要求很高的临床证据路径；机构采购方也越来越要求独立疗效数据。Faculty.ai 住院模型没有公开期刊引用，进一步放大了风险敞口。
