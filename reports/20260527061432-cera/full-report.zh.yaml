        - NHS 内部路径可先吸收避免入院和出院工作，再考虑外包
        - 询问 Cera 有多少 NHS 收入暴露于内部居家医院扩张
      - - 机构护理 / 出院相邻业务
        - HC-One 等既有玩家可数字化并深化降阶护理路径
        - 中
        - 大型运营商可采用数字工具，而不必采用 Cera 整套 AI 栈
        - 索取证据，证明 Cera 在出院转居家转化和后续护理留存上胜出
      - - 区域密度优势
        - Alcedo 式区域挑战者仍能快速增加分支和服务线
        - 中
        - 即便没有全国性 AI 品牌，区域龙头也能守住地方政府和劳动力市场
        - 审查英格兰北部和威尔士的地方政府集中度和分支经济性
      - - 正式护理替代
        - 对许多家庭来说，无偿照护者仍是默认兜底，使用时不付费
        - 中
        - 一旦公共资金不到位，即便弱替代品也会压住付费意愿
        - 测试 Cera 如何转化照护者陷入危机的家庭，以及非正式照护崩溃后付款方组合是否改善
    notes: |
      本登记表聚焦护城河耐久性，而非产品质量。关键问题是：Cera 优势中哪些部分必须靠全栈集成， 哪些可被更窄的竞争者复刻。
