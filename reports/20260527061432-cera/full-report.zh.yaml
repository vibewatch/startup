            body: >-
              真实采用的最强证据不是客户标识，而是运营量。Cera 在 May 2025 的里程碑新闻稿中称，公司已达到约 $500 million 年化收入、每月约 2.5 million 次居家上门，以及超过 10,000
              名护理员和护士；同一新闻稿还称，其足迹接近 150 个受监管站点，覆盖 150+ 个英国地方政府和三分之二的 NHS integrated care systems。Hospital Management
              的独立报道描述，January 2025 日上门量超过 60,000 次；NHS England 称，仅跌倒预防平台到 March 2025 就已用于每月超过 2 million
              次居家护理上门。这些信号口径不一，但方向一致：同一装机基础似乎同时服务庞大的公共部门委托方版图、广泛分支覆盖和极高的经常性上门量。关键判断是，Cera
              不是试点阶段的数字护理供应商；它已经在受监管居家护理网络内全国规模运行。主要分母缺口在于，地方政府、NHS 和自费收入如何拆分，各渠道绑定多少上门量，以及头部总数背后有多少具名客户组织。
