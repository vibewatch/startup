      - number: '7.5'
        title: 市场、竞争与政策风险
        blocks:
          - type: paragraph
            body: >-
              Cera 的市场风险，重点不是居家护理需求是否存在，而是政策演进时，哪类组织会抓住居家护理中价值最高的部分。NHS England 的虚拟病房框架目标是在家交付医院级护理，并让入住率持续高于 80%；这意味着内部
              NHS 路径可以在活动流向外包提供商之前，吸收一部分避免入院和出院活动。这不会消除上门护理需求，但会压窄最高急性度、资金最充足的机会部分。政策时点又增加第二层不确定性。Casey Commission 和
              2025 改革方案显示，社会照护改革仍在推进，但行业机构公开主张系统等不了多年才改变。对 Cera
              而言，公共部门集中度放大了风险敞口：同一系统同时设定预算、采购规则和替代路径时，政策变化会同时传导到定价、续约时点和可服务范围。因此，本章把公共委托依赖，而不是简单的品类需求，视为关键市场风险。如果 Cera
              赢得份额并改善经济性，投资逻辑仍可能成立；但政策和委托方行为仍是主要外部变量。
            claimRefs:
