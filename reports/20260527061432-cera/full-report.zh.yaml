              - CE041
          - type: callout
            title: 双重用途平台战略——既做服务提供商，也做授权方
            body: >
              Cera 在 2026 推出 AI Lab，使一项自 2025 起成形的战略正式化：用自己的服务运营作为 AI 工具的实时验证环境，再把验证过的工具对外授权。Ami
              已经授权给外部护理机构；GenieConnect 计划在 18 个月内授权给 30+ 家护理提供商。这一模式在结构上把 Cera 同传统护理公司、纯 SaaS
              数字健康初创公司区分开来，把运营可信度和技术杠杆结合起来。关键商业风险在于，截至 May 2026，技术授权收入仍处于商业化前阶段。
