  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: standard
    summary: 推荐从已验证规模和可信资本出发，但经过两个约束节点——债务偏重结构和证据质量不完整——最后落在继续研究而非买入。
    approximationNotes: 这是定性决策路径，不是加权评分模型；目的在于说明，为什么公司质量为正也不能覆盖结构性不透明。
    data:
      nodes:
        - id: scale
          label: 优势：约 $500M 年化收入和广泛公共委托方覆盖
          type: input
        - id: capital
          label: 优势：BDT & MSD 和 Schroders 领投的真实机构融资轮
          type: input
        - id: premium
          label: 约束：约 2.0x 隐含表观倍数已高于保留上市可比区间
          type: process
        - id: structure
          label: 约束：债务占多数的融资轮和担保抵押模糊普通股定价
          type: process
        - id: evidence
          label: 约束：保留证据中没有公开债务包、清偿顺位或经审计利润率桥
          type: process
        - id: decision
          label: 建议：继续研究；只有能提升股权承销清晰度的文件才触发重估
          type: output
    claimRefs:
      - CV001
      - CV013
      - CV039
      - CV040
      - CV045
      - CV046
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 在约 $500 million 年化收入基数上套用收入倍数，观察隐含表观估值敏感性。当前 >$1 billion 参考价大致就是 2.0x 门槛。
    approximationNotes: 以公司 2025 年 5 月年化收入说法为基数，套用简单估值 / 收入倍数；这是框架工具，不是完整 EV 桥。
    data:
      items:
        - label: 0.5x 收入
          value: 250
        - label: 1.0x 收入
          value: 500
        - label: 1.5x 收入
          value: 750
        - label: 2.0x 收入
          value: 1000
        - label: 2.5x 收入
          value: 1250
        - label: 3.0x 收入
          value: 1500
    claimRefs:
      - CV034
      - CV035
      - CV036
      - CV038
      - CV039
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 基于保留证据集给出的可能表观估值结果区间，突出当当前定价已内嵌相对上市可比的溢价时，上行空间如何变窄。
    approximationNotes: 区间为分析师估计，使用保留收入锚点和情景倍数；未调整未知股权结构表或债务清偿顺位，因此普通股结果可能比图示更差。
    data:
      items:
        - label: 悲观情景表观价值
          low: 450
          high: 800
          unit: $M
        - label: 基准情景表观价值
          low: 1000
          high: 1400
          unit: $M
        - label: 乐观情景表观价值
          low: 1800
          high: 2300
          unit: $M
    claimRefs:
      - CV041
      - CV042
      - CV043
      - CV045
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 以 IC 风格对七个维度按 1-5 分打分；规模和资本质量得分最强，估值清晰度和结构透明度最弱。
    approximationNotes: 分数是基于保留公开证据的编辑评估；一旦债务、股权结构表和经审计财务文件完成审查，分数应会出现实质上调或下调。
    data:
      items:
        - label: 规模证明
          value: 4
          unit: /5
          note: 约 $500M 年化收入说法和广泛公共委托方覆盖是有意义的正面因素。
        - label: 产品 / AI 差异化
          value: 4
          unit: /5
          note: Faculty 成果、AI Lab 启动和 1,000 个 AI 智能体支撑真实产品野心。
        - label: 资本质量
          value: 4
          unit: /5
          note: BDT & MSD 和 Schroders 都是可信机构，但交易结构仍然关键。
        - label: 利润率韧性
          value: 2
          unit: /5
          note: 员工端信号以及缺少经审计的业务组合披露，限制了对利润率的信心。
        - label: 估值吸引力
          value: 2
          unit: /5
          note: 约 2.0x 的表面倍数已经高于纳入样本的上市可比公司。
        - label: 结构透明度
          value: 1
          unit: /5
          note: 债务组合和分配瀑布仍是投资判断的最大障碍。
        - label: 退出清晰度
          value: 2
          unit: /5
          note: 尚无留存证据支持其以溢价倍数走通清晰 IPO 或战略出售路径。
    claimRefs:
      - CV022
      - CV029
      - CV033
      - CV039
      - CV040
      - CV045
