  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 融资结构与投资者质量
        blocks:
          - type: paragraph
            body: >
              Cera 最近一轮融资于 2025 年 1 月完成，是 $150 million 的债务 + 股权混合轮，公司估值超过 $1 billion，使其成为少数英国医疗科技独角兽之一。本轮由 BDT & MSD
              Partners 领投；这是一家美国商人银行，由 BDT Capital Partners 和 MSD Partners 于 2023
              年合并成立，聚焦「创始人、家族企业所有者和精选志同道合投资者」。Schroders Capital 共同投资；它是 FTSE 100 资产管理公司 Schroders plc 的私募市场部门，AUM 为 £764
              billion。全球机构资产管理人和深耕家族企业的美国商人银行参与，释放出耐心、长期资本信号，适配 Cera 扎根 NHS 的商业模式和长期护理行业逻辑。

              Companies House 申报独立佐证了本轮的债务部分。2024 年 12 月和 2025 年 3 月登记的两项未结清担保押记，将 Kroll Trustee Services Limited
              列为受益人的担保代理，覆盖「所有当前和未来重要土地」——这是信贷额度债券的标准担保措辞。此前两项由 Glas Trust Corporation 登记的担保押记（来自 2020 年和 2022 年）均在 2025
              年 1 月 9 日解除，正好是新一轮融资交割日。这种先偿还后重新设保的顺序，更符合用更优条款再融资旧债，而不是简单叠加杠杆。与 2026 年 4 月 AI Lab 公告同步，Companies House 记录了
              2026 年 4 月的两份 SH01 配股声明（2026 年 5 月 26 日提交），说明 AI Lab 启动时公司还发行了新股——这是积极信号，表明公司在旗舰 2025 年融资之外仍能吸引股权资本。

              本轮混合属性既是优势，也是尽调提示。股权部分（金额未披露）相比按当前估值做纯股权融资，对现有股东稀释更小；债务部分则意味着确定的现金流义务。债务条款（期限、利率、契约包）未公开披露，Kroll
              担保押记范围很广（「所有当前和未来重要土地」），没有直接查看信贷协议，投资者无法评估契约缓冲。整体投资者质量——FTSE 100
              机构、耐心型商人银行、已确认独角兽锚点——是现阶段私营医疗公司能够拿出的较强信号之一。
