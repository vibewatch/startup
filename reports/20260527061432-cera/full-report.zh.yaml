      - number: '4.4'
        title: 单位经济、成本结构与组织成熟度
        blocks:
          - type: paragraph
            body: >
              Cera 的单位经济主要由护理员人工成本驱动，这构成每次上门服务可变成本的大头。Breakroom 数据（274 名员工受访者，2026 年 4 月更新）显示，护理助理时薪为 £12.24-13.79，21
              岁及以上员工时薪为 £12.21-13.85。2025-26 年，伦敦以外英国 Real Living Wage 为 £13.45/hour。因此，Cera 相当一部分护理员收入低于 Real Living
              Wage；如果工资底线提高，这既带来声誉风险，也带来长期成本风险。Breakroom 还报告称，Cera 大多数护理员没有带薪休息，平台给出的员工满意度评分为 4.7/10，低于英国护理服务商平均水平。至少一条
              2026 年 2 月评论把没有病假工资列为「最糟糕的事」。

              公开数据很难评估 GTM 效率代理指标。Cera 的 B2G/B2B 模式（来自地方政府和 NHS 机构采购）意味着销售周期长但稳定——采购框架通常运行 3-5
              年，并在每个周期末嵌入续约。委托护理合同的获客成本主要是投标准备和合规成本，而不是广告投放或销售团队费用。150+
              个地方政府客户意味着愿意采购托管式数字居家护理的地方政府接近饱和，进一步增长可能需要抢占市场份额，或扩展到新服务（自费、国际或 SaaS）。截至 2026 年 5 月，Cera 在英国有 132
              个开放职位（Breakroom），显示运营仍在扩张。

              Cera 称 2023 年 EBITA 转正、2024 年自由现金流转正。这些指标由公司披露，尚未被申报账目佐证：FY2024 账目尚未出现在 Companies House（Cera Care Limited
              最近公开账目最多覆盖 FY2022 或 FY2023）。2026 年 4 月 AI Lab 的 8 位数投资意味着公司仍在动用 2025 年 1 月融资所得资本；同期配股（2026 年 4
              月）则暗示再次获得股权融资。仅依赖公开数据的投资者无法验证烧钱速度、毛利率或单位层面贡献利润率。
