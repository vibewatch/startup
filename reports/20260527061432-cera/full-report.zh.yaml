  - id: TV005
    title: 投资逻辑破裂与放弃触发表
    columns:
      - 触发项
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 债务条款过紧
        - 财务契约余量或定价显示，在中等访问量或利润率压力下，灵活性有限。
        - 原本还能支撑企业价值的故事，会变成普通股经济性偏弱的问题。
        - 除非结构重置，否则不按当前价格投资。
      - - 收入质量不及预期
        - 审计收入或队列数据撑不起约 $500M 年化规模，或显示合同利润率偏弱。
        - 支撑相对上市可比公司溢价的规模逻辑被打断。
        - 用更低收入重切估值，并把当前估值视为偏高到昂贵。
      - - 劳动力压力恶化
        - 更高流失率、更高工资强度，或更弱的员工满意度，指向交付经济性变差。
        - 利润率被压缩，偿债风险随之上升。
        - 除非定价权和留存证据显著改善，否则转为回避。
      - - AI 护城河仍只是叙事
        - 下一轮尽调周期内，没有独立复现的结果，也没有披露 AI 相关收入。
        - 高于上市照护交付倍数的主要理由消失。
        - 只按上市可比公司式倍数承销。
      - - 退出路径仍不透明
        - 没有可信的 IPO、财务买家或战略买家路径，并且该路径需绑定经审计盈利能力和干净结构。
        - 即使经营保持稳健，倍数扩张也受限，上行空间被封顶。
        - 只有在入场价格显著降低时才持有。
    notes: 这些触发项盯的是会改变股权价值的变量，而不只是公司质量；核心传导链是结构加利润率，不是叙事动能。
    claimRefs:
      - CV033
      - CV040
      - CV041
      - CV043
      - CV044
      - CV046
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人或尽调路径
    rows:
      - - 债务协议
        - 2025 年 1 月融资的完整授信、定价、期限、抵押品和契约条款包。
        - 以债务为主的结构，是名义价格支撑与股权吸引力之间最大的缺口。
        - 要求管理层开放数据室，并提供贷款人摘要包。
      - - 股权结构表与退出分配
        - 优先股堆叠、清算优先权、期权池，以及任何参与分配或棘轮条款。
        - 只看名义估值，无法推断普通股回报。
        - 要求提供最新股权结构表，以及下行、基准、上行情景下的退出分配。
      - - 审计财务桥接
        - FY2024/FY2025 审计报表，或贷款人级别的桥接，把 2023 年收入证据连到 2025 年运行率。
        - 需要借此验证规模、现金质量和利润率韧性。
        - 要求提供审计报表、月度管理账，以及合同利润率桥接。
      - - AI 变现
        - 可归因于 AI 产品，而不是核心照护交付的收入、留存或定价提升。
        - 决定公司是否配得上高于上市照护交付倍数的溢价。
        - 要求产品 P&L、附加率数据，以及带商业条款的客户案例。
      - - 劳动力经济性
        - 员工留存、工资通胀敞口、带薪休息政策，以及按地区划分的空缺趋势。
        - 劳动力压力直接影响利润率和契约风险。
        - 要求 HR 仪表盘，以及合同级人员配置敏感性分析。
      - - 结果验证
        - 非公司资助队列中，对住院率和节省金额主张的独立复现。
        - 没有外部验证，AI 上行仍更像叙事，难以承销。
        - 委托第三方结果评审，或访谈 NHS / 委托方参考客户。
    notes: 这些问题按改变承销决策的能力排序，而不是按获取便利度或讲故事价值排序。
    claimRefs:
      - CV040
      - CV041
      - CV044
      - CV045
      - CV046
