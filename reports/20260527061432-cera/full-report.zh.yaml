            title: 结构性用工短缺限制需求转化为收入
            body: >
              2025 年 3 月的海外招聘禁令切断了 Brexit 后主要的国际用工管道。在 111,000
              个岗位空缺、本土供给按当前工资水平不足的情况下，所有英国居家护理服务商都面临结构性产能约束，限制增长需求转化为可计费上门服务——无论其技术能力或公共部门合同拿单能力如何。
            calloutType: risk
            claimRefs:
              - CM025
