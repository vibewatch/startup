      - number: '8.3'
        title: 可比视角与情景范围
        blocks:
          - type: paragraph
            body: >-
              留存证据中最干净的公开估值锚，不是私有数据平台标记，而是 Cera 自己 2025 价格内含的倍数。按官方约 $500 million 年化收入主张计算，$1 billion 名义估值对应约 2.0x 估值 /
              收入。这个水平明显高于此处留存的公开可比公司：截至 May 2026 下旬，Teladoc 为 0.59x EV/revenue，Oscar Health 为 0.17x，Humana 为 0.33x。Mears
              没有提供留存 EV/revenue 数字，但其 FY2025 £1.136 billion 收入和 £4.0 billion 订单簿，提供了有用的英国公共服务规模参照，进一步说明 Cera
              的定价已经不只是传统护理交付执行。溢价并非不理性——Cera 增长更强、AI
              故事有差异化，也明确证明了机构需求——但它仍是溢价。这指向一个较窄的乐观情景、一个可接受但不令人兴奋的基准情景，以及在债务、劳动力或报销动态吞噬股权价值时真实存在的悲观情景。因此，核心建模判断是：公开证据支持当前价格存在，但只选择性支持从当前价格出发的回报情景。
