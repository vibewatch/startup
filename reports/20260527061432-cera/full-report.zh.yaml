  - id: FM001
    title: 市场规模测算视角
    type: kpi
    caption: >
      2024–2026 年英国居家照护和居家医疗有四个市场规模锚点，口径各不相同。MarkWide 采用最宽口径（临床居家护理 + 个人照护 + 监测技术）。PolicyBee/ONS
      是经英国数据验证、范围最宽的上门照护服务估算。IBISWorld 只覆盖高强度居家护理。Cera 披露收入用于锚定 SOM。
    data:
      items:
        - label: 英国居家医疗 — MarkWide（宽口径）
          value: $16.8B
          note: 2026 年预测；CAGR 7.9%；包含临床居家护理 + 监测技术
        - label: 英国上门照护 — PolicyBee/ONS
          value: £11.5B
          note: 2024 年实际值；较 2020 年 +12%；公共和私人支付合计
        - label: 上门照护 — IBISWorld（高强度护理）
          value: £6.7B
          note: 2025–26 年预测；不含基础个人照护访问
        - label: Cera 收入（SOM 代理）
          value: £275M
          note: 2023 年年化；约占英格兰可服务市场的 3–4%
    approximationNotes: |
      所有市场估算都有口径不清的问题；£11.5B 和 $16.8B 使用不同币种和服务定义，不能直接对比。Cera 收入来自公司口径，尚未体现在公开提交账目中。
