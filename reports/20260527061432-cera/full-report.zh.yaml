      - number: '5.5'
        title: 信任、安全与合规控制
        blocks:
          - type: paragraph
            body: >
              Cera Care Operations Limited（NHS 组织代码 AQ1X）自 2019-20 至 2024-25 每年都发布 NHS Data Security and Protection
              Toolkit（DSPT）评估，六次公开评估均达到「Standards Met」。2024-25 评估发布于 28 June 2025，确认其持续符合 National Data Guardian 的 10
              项数据安全标准。任何接触 NHS 患者数据和系统的组织都必须通过 DSPT 这一门槛，要求覆盖加密、访问控制、泄露通知和员工培训。

              CeraApp 的 Apple App Store 页面确认，在 Apple 隐私营养标签下，应用只收集「Diagnostics」数据，不收集与设备身份关联的个人身份信息。通过 CeraApp
              输入的患者健康数据存放在 Cera 符合 DSPT 的信息治理框架下。公司面向患者的网站和护理运营遵守 UK GDPR；用于 AI 训练的所有数据都已匿名化。

              主要未解的信任 / 合规缺口，是 Cera 临床 AI 在 MHRA 软件即医疗器械（Software as a Medical Device，SaMD）指南下的监管分类：尽管 Falls Prevention
              AI 和住院预测模型承担临床决策支持角色，公开证据未确认 Cera 是否已为其申请或取得 MHRA SaMD 分类。BMJ
              调查指出缺少同行评审临床证据来支撑结果主张，间接抬出了这个缺口——这通常是医疗器械监管机构要求的标准。截至 May 2026，未发现 Cera 有被报道的数据泄露、CQC 执法行动或 ICO 监管通知。
