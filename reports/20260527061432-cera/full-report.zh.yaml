      - number: '7.3'
        title: 财务与融资风险
        blocks:
          - type: paragraph
            body: >-
              核心财务风险，是公共委托方通常支付的价格、合法合规交付看起来需要的成本，以及 Cera 现在加到模型上的杠杆之间并不匹配。Homecare Association 的 2025-26 和 2026-27
              基准显示，与当前公共费率相比，资金缺口持续存在；Health Foundation、King's Fund、Care England 和 NAO 也都描述了一个支出增加却未解决结构性脆弱的系统。Cera
              自身业务看起来深度绑定这个公共系统：独立报道显示，公司覆盖 150 个地方政府和 29 个 NHS ICB，因此预算压力、合同续约摩擦或费率重设，比对自费主导运营商更关键。January 2025
              融资轮又增加了第二层下行。TechCrunch 称 $150 million 融资大多是债务；Macfarlanes
              确认债务加股权，但没有披露拆分、定价或贷款约束条款组合。这意味着投资者能看到杠杆标题，却看不到下行情景中最重要的条款。如果工资通胀和资金不足的委托持续存在，而债务服务仍不透明，仅凭公开来源承销 Cera
              的利润率韧性会明显更难。
