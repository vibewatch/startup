              Cera 的 January 2025 融资明确发生，且明确以超过 $1 billion
              出清，说明市场已经发出信号：这个资产融得到钱。公开证据仍没有显示，在债务优先、未知贷款约束条款和优先权悬置之后，多少价格属于干净的普通股价值。这个差异正是判断为继续研究而非买入的原因。
