      - number: '2.4'
        title: 增长动力与采用约束
        blocks:
          - type: paragraph
            body: >
              英国居家护理市场由需求结构驱动：人口老龄化和 NHS 政策转向共同发力，至少到 2035 年都会支撑高于 GDP 的增长。英国 65 岁以上人口占比正从约 19% 上升，未来 50 年预计达到总人口的
              27%（ONS）；Cera 自身患者中已有 85% 超过 65 岁。NHS 政策是主动加速器：Better Care Fund 将 £9 billion 的 NHS
              与地方政府联合资金投向整合护理和避免住院；虚拟病房扩张要求社区服务商承接降阶患者；Baroness Casey 独立委员会（Phase 1 将于 2026 年报告）预计会建议加大社区和居家护理投资。政府在
              Spending Review 2025 中承诺到 2028-29 年额外投入 £4 billion 成人社会照护资金。

              供给端最大约束是劳动力：截至 2026 年，成人社会照护约有 111,000 个岗位空缺，居家护理空缺率约 13%，约为英国平均水平的 4 倍，员工年流失率超过 30%。2025 年 3
              月移民规则调整（关闭护理员和高级护理员的 Health and Care visa）切断了 Brexit
              后部分填补本土供给缺口的国际招聘管道。地方政府费率低于成本底线，导致工资结构性不足；没有重大政策干预，本土招聘无法填平缺口。

              技术采用是第二层约束。AI 赋能护理平台的效率收益很清楚，但相当一部分护理劳动力缺乏数字素养，从人工 /
              纸质系统迁移也会带来前期财务和运营成本，小型服务商难以消化。市场因此分化：拥有技术基础设施的规模运营商扩大份额，小型运营商则整合、退出，或把合同交还给地方政府。

              Health Foundation 估计，如果没有每年 3–4.5% 的持续实际增长，到 2028-29 年该行业将面临 £3.4–8.7 billion 的复合资金缺口。Spending Review 2025
              的承诺部分抵消了这一财政风险，但在 Casey Commission 最终建议落地前，行业对涨幅不足的地方政府费率仍有结构性依赖。
