      - number: '6.4'
        title: 持久性、满意度与证据缺口
        blocks:
          - type: paragraph
            body: >-
              Cera 没有在公开材料中披露直接客户留存指标：受审阅来源中没有 NRR、GRR、客户数流失、委托方续约率、合同期限或队列表。因此，关系持久性只能从代理指标推断。正面代理包括 Lottie 上 Newcastle
              分支的 Good 档案、Wiltshire 的 2026 正面 CQC 页面、持续的公共采购中标流，以及部分分支同时提供固定期限和持续护理、而非一次性出院服务的证据。负面代理也有分量。CQC 的
              Castleham Lodge 报告发现六项法律违规、漏访和迟访、治理薄弱以及员工留存问题；Breakroom
              评论还提到排班不稳、年假期间薪酬较弱、沟通差、没有病假工资和通勤时间压力。合在一起，公开记录意味着：执行稳定时，客户关系可以有持久性；但分支层面的差异和劳动力压力，会真实威胁续约质量。未解的尽调缺口不是 Cera
              有没有客户，而是其最好的公开质量代理能否代表整个网络，而不是被挑选出来的分支。
