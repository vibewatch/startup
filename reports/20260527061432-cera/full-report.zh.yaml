  - id: FE001
    title: Cera 技术平台——产品堆栈
    type: stack
    layout: standard
    summary: |
      Cera 平台分为五个功能层：从核心数据基础设施，到预测 AI 模型、智能体自动化、机器人，再到贯穿其上的治理层。
    data:
      layers:
        - id: l1
          label: 数据治理与合规
          detail: |
            NHS DSPT 达标（2024-25，2025 年 6 月发布）；符合 UK GDPR / ICO；所有 300B 数据点在用于 AI 训练前均走匿名化管道。
        - id: l2
          label: 机器人层
          detail: |
            GenieConnect 机器人（2025 年 11 月收购）；AI 驱动用药、饮食与健康提醒；试点中 96% 按时服药成功率；收购前试点覆盖 12+ 个议会和 30 家护理提供方，每周 3,000 次患者访问。
        - id: l3
          label: AI 智能体层
          detail: >
            Ami AI 招聘智能体（每年处理 500k 份申请；招聘量翻倍；现已对外授权）；Care Coordinator Agent（替班排班节省 50% 时间）；Field Care Supervisor
            Agent（临床审核节省 85% 时间）；AI Retention Agent（留存提升 22%；员工触达比人工团队快 7×）。
        - id: l4
          label: 预测 AI 套件
          detail: >
            Falls Prevention AI（内部技术评估称分类准确率 97%；部署于 29/42 个 NHS ICS；每天 5,000 条高风险预警）；与 Faculty.ai 共研的 Hospitalisation
            Predict-Prevent（提前 1–7 天召回率 80%；比临床医生准确 2.6×）；COVID-19、流感、RSV、诺如病毒病情检测。
        - id: l5
          label: 核心平台
          detail: >
            CeraApp：iOS v1.27.0（2026 年 5 月，4.3★）+ Android；每月 2.5M 次上门服务实时结构化数据记录；300B 数据点纵向数据集；多云基础设施（AWS + GCP，按公开
            GitHub ceracare 组织信息由 Terraform 管理）。
    approximationNotes: |
      分层边界为概念划分；实际微服务拓扑未公开披露。智能体与预测 AI 数量来自官方公告；可能还有其他内部工具。
    claimRefs:
      - CE005
      - CE011
      - CE016
