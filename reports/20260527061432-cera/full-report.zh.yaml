  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与竞争框架
        blocks:
          - type: paragraph
            body: >
              Cera 的竞争对手结构很混合。公司不只与其他居家护理品牌争夺护理时长；它还要面对帮助竞争机构数字化、但不外包运营的软件供应商，NHS
              体系内保留活动量的居家护理路径，以及仍然吸收大量英国护理需求的无偿家庭照护现状。因此，单纯按分支数量排名看不出真正的市场结构。


              规模化私人和区域服务商很重要，因为它们塑造信任、劳动力密度、质量评级和公共部门投标可信度。Helping Hands 是自费和住家护理服务上品牌驱动最强的居家护理对标；Prestige
              是偏临床的人员配置和治理竞争者；HC-One 与其说是纯居家护理同业，不如说是大型机构养老和出院衔接相邻在位者；Alcedo 则说明，区域运营商仍能靠多服务扩张快速放大。


              技术层是另一场战斗。Birdie 和 Person Centred Software 不会直接替代护理员，但它们给其他运营商更好的排班、合规、分析和家属可视化能力，从而削弱 Cera 的差异化。Lilli
              是最清晰的窄口径 AI 挑战者，因为它销售预测监测和地方政府 ROI，而不是劳动产能。面对这些对手，Cera 最强的主张是护理交付、数据采集和预测干预的一体化。
