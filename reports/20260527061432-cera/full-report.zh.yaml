      - number: '8.4'
        title: 放弃触发项与尽调收尾计划
        blocks:
          - type: paragraph
            body: >-
              要把这个判断推到买入，路径很直接，且主要由尽调驱动。第一，管理层需要打开债务包，证明担保借款规模是为了灵活性，而不是对新股权征收隐藏税。第二，公司需要拿出经审计财务包，或至少是贷款方级别桥接表，来调和从 2023
              收入证据到 2025 约 $500 million 年化主张的跃升，并说明劳动密集型护理交付和更高价值软件或 AI 功能各自贡献多少利润率。第三，Cera 需要证明其 AI
              结果和节省主张可以在公司框定研究之外重复，并且 AI
              产品化正在转化为可货币化、类软件收入，而不只是提升服务交付效率。没有这套材料，风险控制比上行叙事更重要。因此，放弃触发项是贷款约束承压、公共委托方量停滞、员工经济性恶化，或证据显示 2025
              轮之所以出清，主要靠债务而不是股权托底。尽调议程应围绕能改变定价权、股权优先顺位和退出数学的文件保持纪律，而不是围绕叙事演示打转。
