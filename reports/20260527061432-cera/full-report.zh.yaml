      - number: '1.3'
        title: 融资历史、估值与财务画像
        blocks:
          - type: paragraph
            body: >
              自 2016 年以来，Cera 已完成 13 轮融资，总额超过 $571 million，结构混合了风险股权和机构债务。最近一轮是 2025 年 1 月的 $150 million 融资，主要是债务，由 BDT
              & MSD Partners 和 Schroders Capital 领投，公司估值超过 $1 billion，确认独角兽身份。股权投资方包括 Earlymarket、Guinness
              Ventures、DigitalHealth.London 和 Robin Klein。2022 年 Series C 融资 $320 million（由 Vanderbilt University、Jane
              Street 和 Schroders Capital 领投），2020 年 Series B 融资 $70 million，由 Kairos、Yabeo 和 Guinness Global Investors
              领投。

              盈利方面，Cera 发言人确认公司 2023 年 EBITA 转正，2024 年自由现金流转正。2025 年收入超过 $500 million，较五年前约 $5 million 的起步规模扩大 100
              倍。公司称自己是「越来越能自我造血的业务」，并把这作为 2025 年能以债务为主融资、而非发行稀释性股权的原因。截至申报日，Companies House 的公开财务报表尚未体现这些盈利里程碑；具体 EBITDA
              利润率和收入数字仍缺外部验证，是尽调缺口。

              公司代表 150+ 个地方政府和三分之二的 NHS Integrated Care Systems 交付护理服务，公共部门收入质量较高、复购属性强，降低了客户集中风险。Cera 称每天为英国医疗系统节省 £1
              million（2025 年 10 月独立分析将其上调至每日 £1.5 million），但这些说法尚未经过独立同行评审，应视为需要第三方验证的公司支持性主张。
