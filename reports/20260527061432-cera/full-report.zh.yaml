      - number: '3.2'
        title: 规模化服务商对手
        blocks:
          - type: paragraph
            body: >
              Helping Hands 是 Cera 在居家护理服务线中最清晰的对标，因为它同时拥有全国品牌认知、住家和上门护理、专业护理支持，以及异常强的公开质量信号。其 2024 年影响报告和相关报道显示，Helping
              Hands 有 150 个分支、超过 10,000 名客户和超过 6,000 名护理员；官方定位强调不使用中介人员、服务受监管且评价分数高。即便公开材料不强调预测 AI，Helping Hands
              在自费和家庭主导采购中仍尤其相关。


              Prestige Nursing & Care 的竞争方式不同。其公开定位更偏临床和复杂护理，提供小时制、住家和护士主导服务，并由合规与治理基础设施支撑。重要的是，公司仍对外宣传 80 多年经验，但
              Companies House 申报历史显示 Sodexo Holdings Ltd 已在 2023
              年停止作为具有重大控制权的人，因此市场评论中的所有权表述可能已经过时。这种模糊性是尽调问题，不足以推翻投资逻辑，但在梳理谁实际出资或治理业务时很重要。


              HC-One 并不是严格同口径的居家护理运营商，但它作为大型机构养老在位者仍有意义，因为它正在投资数字化护理计划、质量系统和降阶护理类目。Alcedo 是更直接的区域威胁：家族所有，拥有 1,000+
              名员工、18 个办公室，并在英格兰北部和威尔士扩张住家 / 复杂护理。合在一起，这些服务商说明，Cera 的非 AI 护城河仍重度依赖劳动力执行、投标可信度和服务宽度。
