  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义与边界
        blocks:
          - type: paragraph
            body: >
              Cera
              主要处在英国居家护理市场，这是更广义成人社会照护和居家医疗版图中的一个子板块。做市场测算时，市场口径有内外两层边界。外层边界是「英国居家医疗」，覆盖个人照护、居家护理、复能服务、远程患者监测、辅助技术和临床上门服务；MarkWide
              Research 预计该市场 2026 年规模为 $16.8 billion，并以 7.9% CAGR 增至 2035 年 $33.3
              billion。内层、运营口径更精确的边界是「英国居家照护」，覆盖由公共或私人付费、在家中交付的个人照护和支持服务，2024 年规模约 £11.5 billion（较 2020 年 +12%），预计年增速约
              6.8%。

              不纳入该市场口径的包括：养老护理院、NHS 急性或社区医院床位、GP
              和初级保健咨询、心理健康支持型居住服务（除非与居家护理共同交付）以及医疗设备供应链。一个重要相邻市场是技术授权（SaaS）板块，即向其他服务商销售护理协调软件和 AI 工具；该板块仍处早期，但与 Cera
              的平台变现路线高度相关。

              约 80% 的 £11.5 billion 市场由地方政府和 NHS Integrated Care Boards（ICB）公共采购；剩余 20% 为自费（私人付费）。但按用户数看，自费用户约占
              23.5%，且每小时费率显著更高（£32–34+，地方政府平均为 £24.10），因此自费组合对追求利润率的运营商价值更高。英国约 13,500
              家居家护理服务商高度分散，按收入计，没有任何单一运营商拥有超过低个位数的总市场份额。
