        title: 图表
        blocks:
          - type: callout
            title: 最大风险簇是公共系统依赖，而不是单个 AI 缺陷
            body: Cera 最实质的下行来自公共部门集中度、委托资金不足、劳动力稀缺和服务质量问责之间的相互作用。AI 风险重要，但当成本压力和分支层面执行已经承压时，它才最危险。
            calloutType: risk
            claimRefs:
              - CR017
              - CR019
              - CR027
              - CR044
          - type: callout
            title: 优先尽调应聚焦质量整改、债务条款和 AI 治理材料
            body: >-
              三个最高价值问题是：Castleham 之后分支层面的 CQC 整改历史；以债务为主的 2025 轮背后的贷款约束条款、期限和定价组合；以及 DPIA、模型监控阈值、偏见测试、人工覆写日志等 AI
              治理材料。这些事项最可能实质改变剩余风险。
            calloutType: recommendation
            claimRefs:
              - CR002
              - CR026
              - CR033
              - CR036
          - type: callout
            title: Cera 有真实缓释因素，但多数窄于风险面
            body: DSPT「Standards met」、可见的云工程活动和广泛公共委托覆盖都是真实正面因素。但它们都没有回答最难的问题：分支层面质量趋势如何、合同重定价能力有多强，以及旗舰 AI 系统的治理是否和营销一样严格。
