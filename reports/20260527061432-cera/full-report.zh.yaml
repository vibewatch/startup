      - number: '3.3'
        title: 技术层和 AI 挑战者
        blocks:
          - type: paragraph
            body: >
              Birdie 是最重要的工作流层挑战者，因为它帮助其他护理机构缩小运营差距，而无需复制 Cera 的垂直一体化模式。Birdie 现在面向 1,000
              多家居家护理企业销售，并把系统定位为覆盖排班、财务、护理管理、合规和家属应用的一体化平台。其 2022 年早期融资材料已经显示有 700 家合作机构、35,000 名护理对象和 8,000
              名家庭成员。战略重点不是 Birdie 替代 Cera，而是它降低了独立运营的绩效惩罚。


              Person Centred Software 处在类似但更偏护理院和受监管运营的赛道。其公开材料强调数字化护理计划、eMAR、快速上线和 CQC 就绪；Redcrier 的收购公告则把 PCS
              描述为正在围绕培训、健康、用药和运营构建更广的互联护理生态。PCS 因此会争夺工作流所有权和合规预算，尤其是在委托方或运营商希望数字化、但不想更换服务商的场景。


              Lilli 是最清晰的窄口径 AI 挑战。它的主张是主动式生活方式监测和行为变化识别，而不是完整劳动力管理或直接护理交付。公司称地方政府每投入 £1 最多可节省 £9，将出院提速最多 16 天，并在 2023
              年末已有多个收入超过 £1 million 的合同。如果这些主张成立，Lilli 说明目标明确的预测模块可以争夺 Cera 希望用更宽 AI 堆栈守住的同一批 NHS 和地方政府预算。
