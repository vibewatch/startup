      - number: '5.6'
        title: 图表
        blocks:
          - type: callout
            title: NHS 规模数据集构成结构性护城河
            body: >
              Cera 的 300-billion 个数据点纵向数据集，来自 10,000 名护理员在每月 2.5 million
              次上门中记录观察；没有同等护理交付规模的纯软件竞争对手，很难复制这套数据集。它构成自有训练语料和真实世界验证环境，支撑现有 AI 工具，也支撑 AI Lab 的研发管线。Faculty.ai
              外部验证的住院模型表明，这套数据集能产出有临床意义的预测信号。
            calloutType: strength
            claimRefs:
              - CE011
