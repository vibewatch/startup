        title: 劳动力与运营风险
        blocks:
          - type: paragraph
            body: >-
              Cera 的运营模式劳动力密集，尽管公开叙事高度 AI 化。底层行业仍缺护理员；Centre for Care 描述约有 111,000 个岗位空缺，而政府 2025
              年决定停止新增海外护理工招聘，移除了行业已经依赖的劳动力缓冲。工资底线抬升让挤压更重：National Living Wage 在 2025-26 升至 £12.21，并将在 April 2026 再升至
              £12.71。公共费率没有跟上。Homecare Association 称，国家资助平均费率为每小时 £24.10；Care England 报告称，大多数费率上调没有覆盖 NLW
              成本，已有相当一部分提供商处于亏损。对 Cera 本身，直接公开劳动力风险证据不只是行业层面。Breakroom 评论提到工时不稳定、年假期间薪酬偏弱和沟通问题；Castleham Lodge
              调查结果则显示，人员配置和治理问题如何变成监管可见的质量失败。因此，运营风险不只是招到足够多的护理员，而是在成本压力下把招聘、留存和监督管得足够紧，不让分支层面质量恶化。
