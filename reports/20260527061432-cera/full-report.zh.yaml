      - number: '5.3'
        title: AI 智能体、预测分析与证据基础
        blocks:
          - type: paragraph
            body: >
              Cera 的预测 AI 每天在超过 2 million 次月度居家护理上门中生成最多 5,000 条高风险警报。Falls Prevention AI 监测通过 CeraApp 录入的生命体征；NHS
              England 在 March 2025 的新闻稿中宣布其「全国铺开」，并称跌倒风险预测准确率为 97%。BMJ 调查发现，所谓「全国铺开」指的是 Cera 扩张自己的服务合同，而非独立的 NHS
              全系统部署。NHS England 将 BMJ 的证据请求转给 Cera；Cera 表示 97% 来自比较风险分类的「技术评估」。BMJ 没有找到支持大规模结果主张的同行评审临床 RCT 证据；NHS
              Confederation 欢迎该工具，但强调需要「扎实评估」。Faculty.ai 案例研究称结果已发表于医学期刊，但 Cera 尚未公开具体引用。

              尽管证据基础有缺口，部署规模已经不小：截至 March 2025，42 个 NHS Integrated Care Systems 中有 29 个使用 Falls AI；July 和 September 2023
              面向 800 名和 2,254 名患者的试点显示跌倒减少 20%；第三方分析认为 Cera 的模型每天为 NHS 节省超过 £1 million。Cera 称其模型最多可减少 70% 的住院，但这个数字和 97%
              准确率一样，尚未在公开学术文献中得到独立验证。

              AI 智能体层更晚近，独立验证也更少。Field Care Supervisor Agent 通过自动汇总上门记录、用药记录和护理计划更新，将临床审查时间减少 85%。AI Retention Agent
              能在两天内识别有流失风险的员工，而人工团队需要两周；Cera 称这推动留存改善 22%。四个智能体都先在 Cera 的英国站点试点，之后才在 January 2026 推出。
