      - number: '2.2'
        title: 市场规模与可触达性
        blocks:
          - type: paragraph
            body: >
              多个分析口径给出的估算因范围和方法不同而分化。PolicyBee/ONS 的 £11.5 billion「受资助居家照护」数字，是运营上已验证、覆盖英国最广的估算，本报告以此作为 TAM 锚点；它与
              MarkWide 的 $16.8 billion（范围更广）和 IBISWorld 的 £6.7 billion（仅限更窄的重度护理）方向一致，均指向 6–8% CAGR。

              Cera 的可服务市场（SAM）对应英格兰技术赋能或「数字就绪」的居家护理合同——这是 Cera 当前持牌运营的区域——再加上新兴德国业务。保守的 SAM
              估算以英格兰地方政府委托采购的居家护理为锚（按英国总量折算约 £7–8 billion），Cera 约 £275 million 年收入对应约 3–4% 渗透率。

              未来五年，Cera 的可获取市场（SOM）受限于新增地方政府和 NHS ICB 数字化采购、并与平台型服务商合作的速度。公司已签约 382 个地方政府中的 150 个（约 39%）和 42 个 NHS ICB
              中的 29 个（约 69%），新增 SOM 增长越来越依赖于转化剩余 232 个地方政府，并在直接护理交付之外深化 ICB 对技术平台授权的参与。

              Faculty（一家 NHS 关联 AI 咨询公司）的独立验证估计，Cera 平台已为 NHS 每天节省约 £1 million，并预计到 2026 年秋季升至每天 £3 million，相当于 NHS 年化节省
              £1 billion，验证了公共部门继续采用的经济理由。NHS 对每个释放的床日估值约 £460；Cera 平台通过预防跌倒和住院，每月释放超过 1,210 个医院床日。
