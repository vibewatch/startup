      - number: '1.2'
        title: 领导层、创始人与治理
        blocks:
          - type: paragraph
            body: >
              Dr. Ben (Mahiben) Maruthappu MBE（1988 年 3 月出生）是创始人兼 CEO，也是 Cera 最主要的公众面孔。他在 Oxford、Cambridge 和 Harvard
              接受临床训练，此前担任 NHS England 创新顾问，并联合创办 NHS Innovation Accelerator。2016 年，他在母亲背部骨折后协调碎片化居家护理，这段经历直接推动他创立
              Cera。Maruthappu 获得过 100 多个奖项，包括 MBE（2020 年）、Great British Entrepreneur of the Year（2023 年）和 EY
              Entrepreneur of the Year UK（2024 年）；他 31 岁时成为获得英国国家荣誉的最年轻医生。

              联合创始人 Marek Sacha（董事会成员）和 Martin Ocenas（工程负责人）仍在公司任职。Matthew Edward Ashley 于 2024 年 6 月获任 CFO 和董事，在 Cera
              转向盈利阶段补上财务领导力。Peter Sands（前 Standard Chartered CEO、Global Fund 执行董事）担任董事长。Andrew Stephen Brode 于 2019 年 9
              月加入董事会，Ankur Jain 于 2020 年 6 月加入；Alexander Jared Fiance（美国人，2025 年 9 月获任）反映了 2025 年融资后与美国投资方 BDT & MSD
              Partners 的关系。Paul Van Reesch 于 2024 年 12 月获任公司秘书。Sir David Behan（Care Quality Commission 前
              CEO）进入顾问委员会，提供监管经验。

              Dr. Maruthappu 的关键人集中度很高：品牌、投资者关系、政府倡导和 AI 愿景都集中在他的公众形象上。公司未披露 CFO 继任计划。2025
              年融资后，董事会加入投资方委派董事，显示机构化治理在增强；但委员会结构和独立董事职责仍未公开。
