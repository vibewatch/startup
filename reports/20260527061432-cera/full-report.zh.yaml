      - number: '2.3'
        title: 买方与分层分析
        blocks:
          - type: paragraph
            body: >
              英国居家护理市场有三个清晰的购买 / 支付方分层，每一层的采购机制、利润率画像和技术采用曲线都不同。

              公共部门——地方政府：约占市场服务量的 80%；英格兰 382 个地方政府通过框架合同和即时采购委托居家护理。地方政府每小时费率中位数为 £24.10，较 Homecare Association 的 2026
              年最低成本 £34.42/hour 低 39%，形成结构性资金不足，压低小型服务商利润率并加速市场整合。地方政府切换成本高，受 TUPE 义务、CQC
              注册要求和采购监管约束，给在位者带来显著合同黏性。进入市场需要竞争性投标（合同中位价值为数百万，最高披露为 £600 million），Cera 已拿下 150+ 个地方政府合同，包括
              Lincolnshire、Peterborough、Bedford 和苏格兰若干议会辖区。

              NHS / Integrated Care Boards：采购更偏临床，由 ICB 购买复能服务、出院衔接、虚拟病房降阶和预防性居家护理。Cera 覆盖 42 个 NHS ICB 中的 29 个。ICB
              越来越看重能产出结果数据（跌倒预测、住院减少）的技术赋能服务商，以满足 ICS 效率目标。这里的采用速度快于地方政府采购，因为 ICS 领导层有明确激励去减少延迟出院和急诊压力。

              私人自费用户：约占用户数的 23.5%、支出的约 20%，但在增长，且每小时利润率更高（£32–34+，对比
              £24.10）。该板块买方通常是为年迈父母安排护理的成年子女；他们对质量敏感，重视数字化访问和透明度。服务商正有策略地转向自费，以摆脱地方政府费率压制。

              技术授权（SaaS）：这是萌芽中的第四类分层，Cera 或同业向其他服务商授权 AI 护理协调平台。该板块有战略意义，但截至 2026 年尚未贡献实质收入。
