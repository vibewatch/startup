      - number: '4.3'
        title: 收入模式、牵引力与战略合作深度
        blocks:
          - type: paragraph
            body: >
              Cera 的主要收入引擎是受委托的居家护理交付，由英国各地 NHS Integrated Care Boards（ICB）和地方政府按上门次数或小时计费。到 2025 年 1 月，Cera 服务 150+
              个地方政府，覆盖英国 382 个地方政府中的约 39%，并覆盖 42 个 NHS ICB 中的 29 个（三分之二），触达约 30 million 人。公司每秒交付一次护理上门服务；截至 2025 年 5
              月，年化收入约 $500 million（按当时汇率约 £400 million）。这个规模的委托护理是强投资信号：NHS
              和地方政府采购合同通常多年期、公共资金支持、机构可信度高；考虑到英国人口老龄化顺风，这也意味着较低的对手方信用风险和相对稳定的需求。

              公共部门定价机制部分约束了收入质量。Homecare Association 2025-26 年建议最低费率为 £30.36/hour（高于 2024-25 年的 £28.53），反映 2025 年 4 月
              National Living Wage 上调后的护理员成本；而委托采购方通常支付 £23 至 £24
              每小时，远低于建议最低费率。结构性低付费压缩毛利率，并造成委托方支付金额与全成本交付需求之间的长期错配。Cera
              的规模或许能在技术和物流采购上提供边际议价能力，但若没有政策变化，或向自费和平台授权多元化，它无法改变底层公共部门定价约束。

              第二条收入线是 AI 平台授权，仍处早期但战略意义很强。Cera 于 2026 年 4 月推出 AI Lab，自投 8 位数资金（£10M+），重点开发「Cera Genie」和 AI
              智能体产品，用于自动化护理决策、排班和临床提醒。公司称已在护理平台内部署 1,000 个 AI 智能体，并引用 Faculty（一家伦敦 AI 咨询公司）研究，称其 Digital Care Plan 让 65
              岁以上人群住院减少 52-70%。向其他护理服务商、地方政府和 NHS 机构授权该 AI 平台，将使 Cera 摆脱单一服务交付收入，但截至目前公司未披露授权收入数字。
