            body: >-
              Cera 最好的扩张向量看起来是在现有委托方账户内先落地、再扩张，而不是寻找全新的客户类型。官方和独立来源描述了护理、物理治疗、医生上门、专科和临终居家护理等较新服务线，这些可以扩大现有地方政府和 NHS
              关系内的钱包份额。新兴的 AI 智能体授权动作可能分散客户基础，但公开证据尚未列出外部被授权方或披露任何授权收入。因此，集中度风险仍主要由英国公共支出和采购主导。BidStats
              显示多个可见买方仍有活跃中标流，这降低了对依赖单一具名地方议会的担忧，但它没有披露收入集中度、合同期限，或地方政府与 NHS 机构各自贡献的销售占比。再叠加分支质量差异和劳动力压力，主要客户风险很清楚：Cera
              采用面广，但仍高度暴露于英国公共资金需求、采购周期，以及大型受监管网络内运营一致性。
