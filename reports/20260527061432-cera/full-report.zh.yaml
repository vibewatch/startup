        - id: workforce
          label: 一线劳动力
          description: 10,000+ 名护理员和护士交付护理并收集上门数据
        - id: visits
          label: 持续服务活动
          description: 约 2.5 million 次月度上门服务和超过 2 million 次 AI 赋能月度上门服务，显示持续使用
      edges:
        - from: universe
          to: contracts
          label: 采购 / 委托中标
        - from: contracts
          to: sites
          label: 区域服务激活
        - from: sites
          to: workforce
          label: 人员配置 + 排班
        - from: workforce
          to: visits
          label: 持续居家护理交付
  - id: FU003
    title: 客户证据矩阵
    type: matrix
    layout: wide
    summary: 不同证据类型在命名质量、生产确定性、结果具体度和留存可见性上差异很大。
    approximationNotes: 单元格是基于引用来源的定性标签，而非评分指标。视角是证据质量，不是客户价值。
    claimRefs:
      - CU010
      - CU011
      - CU012
      - CU013
      - CU014
      - CU015
      - CU022
      - CU023
      - CU034
      - CU035
      - CU036
      - CU037
      - CU038
    data:
      columns:
        - 官方地方政府案例研究
        - 客户侧目录
        - 分支 / 监管页面
        - 具名患者 / 家属故事
      rows:
        - label: 生产 vs 试点
          values:
            - label: 带有实际出院和再评估工作流的生产服务
            - label: 面向实际服务的生产服务商列表
            - label: 处于有效监管下的生产分支
            - label: 具名人士描述的生产护理体验
        - label: 结果具体度
          values:
            - label: 节省金额和护理小时变化强，议会名称弱
            - label: 中等：有证言和服务列表，经济性有限
            - label: 质量状态和违规证据强，客户期限弱
            - label: 个人结果强，但属轶事而非队列层面
        - label: 留存可见性
          values:
            - label: 低：未披露续约或期限
            - label: 低至中：只有持续服务 vs 固定期限线索
            - label: 中：分支稳定性和质量代理指标
            - label: 低：证言不显示重复行为
        - label: 独立性 / 新鲜度
          values:
            - label: 公司撰写，近期
            - label: 客户 / 独立，近期
            - label: 监管 / 独立，近期
            - label: 官方 / 媒体，近期
  - id: FR001
    title: 风险热图——可能性 vs 严重性
    type: matrix
    approximationNotes: 位置为定性判断，综合章节内公开证据，并非内部概率模型。
    data:
      columns:
        - 低可能性
        - 中等可能性
        - 高可能性
      rows:
        - label: 关键严重性
          values:
            - label: '---'
            - label: 以债务为主的资本结构压缩灵活性
            - label: 服务级质量失效 / 整改延误
        - label: 高严重性
          values:
            - label: GenieConnect 整合冲击
            - label: 网络安全或数据治理事件
            - label: 劳动力短缺叠加工资通胀
        - label: 中等严重性
          values:
            - label: Casey 改革延误
            - label: AI 证据缺口拖慢采用
            - label: 公共费率资金不足
        - label: 低严重性
          values:
            - label: 云冗余按预期运转
            - label: 虚拟病房选择性分流
            - label: 公司层面投诉指标仍未披露
    claimRefs:
      - CR002
      - CR017
      - CR024
      - CR030
      - CR033
      - CR037
      - CR039
      - CR042
      - CR043
  - id: FR002
    title: 监管与政策时间线
    type: timeline
    data:
      items:
        - date: '2014'
          label: Care Act 基线
          detail: 地方政府在评估和市场塑造上的职责仍是居家护理的结构性法律框架。
          tone: neutral
          claimRefs:
            - CR006
        - date: 2024-06
          label: EU AI Act 生效
          detail: 任何跨境授权或扩张都需要把欧洲 AI 合规负担纳入实际规划。
          tone: negative
          claimRefs:
            - CR010
        - date: 2025-01
          label: Casey Commission 启动
          detail: 政府启动多年改革路径，但行业机构警告系统等不到 2028 年。
          tone: risk
          claimRefs:
            - CR020
            - CR043
        - date: 2025-05
          label: 海外招聘终止
          detail: 政府关闭护理行业一条主要劳动力供应通道。
          tone: negative
          claimRefs:
            - CR015
        - date: 2026-04
          label: NLW 上调至 £12.71
          detail: 许多公共合同尚未重设，服务商成本基础又上升。
          tone: negative
          claimRefs:
            - CR016
            - CR029
        - date: 2026+
          label: AI / 授权监管加深
          detail: 医疗 AI 监管、CQC AI 预期和 EU 扩张分析都要求更强治理证据。
          tone: negative
          claimRefs:
            - CR005
            - CR009
            - CR040
    claimRefs:
      - CR005
      - CR006
      - CR009
      - CR010
      - CR015
      - CR016
      - CR020
      - CR043
  - id: FR003
    title: 依赖地图——关键外部失效路径
    type: dag
    approximationNotes: 节点和边根据公开证据推断，表达依赖逻辑，而非量化权重。
    data:
      nodes:
        - id: n1
          label: 地方政府 / NHS 委托预算
          type: financial
        - id: n2
          label: 护理员劳动力供给
          type: operational
        - id: n3
          label: AWS / GCP 云堆栈
          type: technical
        - id: n4
          label: Cera AI 与数字护理工作流
          type: technical
        - id: n5
          label: GenieConnect 硬件 / 制造商层
          type: technical
        - id: n6
          label: 服务质量 / 合同履约
          type: operational
        - id: n7
          label: 收入、利润率与续约韧性
          type: financial
      edges:
        - from: n1
          to: n7
