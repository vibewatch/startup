  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与入场纪律
        blocks:
          - type: paragraph
            body: >-
              核心估值问题不是有没有真实价格；价格确实存在。多个来源支持 Cera 在 January 2025 融资超过 $150 million，并跨过 $1 billion
              估值门槛。更难的问题是，新投资者是否应该把这个名义价格视为有吸引力的普通股入场点。公开证据不支持这一步。TechCrunch 报道称，该轮大多数是债务，且公司拒绝披露拆分；Companies House
              文件显示，同期存在范围很广的担保债权。这意味着名义估值可以描述市场出清价格，同时普通股经济性仍可能显著弱于名义数字。运营上，Cera 确有规模——约 $500 million 年化收入主张、每月 2.5
              million 次上门，以及对地方政府 / NHS 的深度渗透——但公开记录仍缺少把一个看似合理的企业价值故事转成可投资股权故事所需的债务协议、清偿顺序和经审计利润率桥。正确姿态因此是继续研究而非买入：承认
              2025 轮验证了市场对该资产的需求，但在承销上行前，坚持做结构和现金质量尽调。
