  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与合规风险
        blocks:
          - type: paragraph
            body: >-
              Cera 处在受监管服务类别中，即使服务提供商页面没有整体评级，负面证据也可能在分支层面浮出水面。这很关键，因为本轮最清楚的反向证据是具体事实，而不是假设：CQC 的 Castleham Lodge
              评估由关切信息触发，并记录了涉及保护、安全护理、以人为本护理、投诉、人员配置和治理的六项违规。与此同时，CQC 当前评估框架更强调证据，并明确连接质量陈述和法规；CQC 的 AI
              指引也说得很清楚，当技术影响护理质量时，服务提供商仍要负责。法律基线也很宽，而不是很窄。Care Act 和 DHSC
              市场塑造指南要求委托方评估需求、维持市场，但并不会让任何单一提供商免于重新招标、费用压力或整改要求。因此，对 Cera 而言，监管风险有两层：服务层面的质量失败仍可能触发干预；AI
              的规模化使用或授权，也会加重安全、公平、透明和文档方面的治理负担。
