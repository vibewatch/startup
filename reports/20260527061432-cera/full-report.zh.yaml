    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、总部与商业模式
        blocks:
          - type: paragraph
            body: >
              Cera（法定名称 Cera Care Limited，Companies House 编号 09874278）总部位于英格兰伦敦 Camden 的 Labs Hawley Lock。公司由 Dr. Ben
              (Mahiben) Maruthappu MBE、Marek Sacha 和 Martin Ocenas 于 2016 年创立，是一家数字优先的居家医疗服务提供商，业务覆盖英国，并自 2022
              年进入德国。公司的使命是用人工智能、数据和数字工具重构护理规划与交付，让人们在家中活得更久、更健康。

              Cera 的核心业务把托管服务运营和自研 SaaS/AI 平台绑在一起：公司雇用超过 10,000
              名护理员和护士，把个人照护、护理服务、物理治疗、心理健康支持和学习障碍服务送到患者家中；平台则从每次上门服务收集实时数据。收入主要来自地方政府和 NHS 委托采购合同（150+ 个地方政府、三分之二的 NHS
              Integrated Care Systems），同时面向全球其他服务商授权 AI 智能体和预测护理工具的 B2B 业务在增长。

              这种一体化模式给了 Cera 结构性数据优势：其应用记录每月 2.5 million 次上门服务中的患者症状和护理结果，沉淀出超过 300 billion
              个数据点，公司称这是欧洲最大的居家医疗数据集。该数据集支撑自研跌倒预防和住院预测 AI 算法，也驱动一组覆盖招聘、劳动力排班、临床监督和合规的 AI 智能体。2026 年 4 月，Cera 将这项 AI
              资产正式整合为独立 AI Lab，并投入八位数资金，用于开发工具并向全球授权。
