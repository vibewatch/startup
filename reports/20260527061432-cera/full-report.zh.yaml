            body: >
              不同分析估算从 £6.7B（IBISWorld，仅重度护理）到 $16.8B（MarkWide，全部居家医疗）不等。差异完全来自范围不同，而非方法冲突。投资者应以更窄的 PolicyBee/ONS £11.5B
              居家照护数字为锚，因为 Cera 收入主要来自个人照护和复能服务，而不是临床护理。
            calloutType: insight
            claimRefs:
              - CM015
