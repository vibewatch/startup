      - number: '1.4'
        title: 规模、运营影响与 AI 技术
        blocks:
          - type: paragraph
            body: >
              截至 2026 年 5 月，Cera 的规模已接近 NHS 自身社区护理触达：每月 2.5 million 次患者居家上门服务（相当于全英国 NHS 急诊部门的总到访量），由 10,000 多名护理员和护士在
              100 多个英国城市执行。公司每年处理约 500,000 份求职申请，自 2016 年以来已为护理行业吸引超过 1 million 名申请者。

              Cera 的 AI 平台从每次上门服务收集数据，形成公司称超过 300 billion 个数据点的数据集。自研算法包括 Falls Prevention AI，可提前一周预测超过 80% 的跌倒事件；以及
              Hospitalisation Predict-Prevent AI，公司称可提前七天预测 83% 的住院。Cera 将跌倒减少 20%、住院最多减少 70% 归因于其 AI
              工具；但这些数字来自公司披露，并基于内部项目分析，而非同行评审的随机试验。

              2026 年 1 月，Cera 在员工体系内部署了近 1,000 个 AI 智能体，包括 Ami（AI 招聘智能体，将招聘量翻倍）、AI
              护理协调智能体（将临时补班组织时间减半）、现场护理督导智能体（将护理复核时间削减 85%）和 AI 留任智能体（识别高流失风险员工速度最高提升 7 倍，公司称留任改善 22%）。公司 2025 年收购
              GenieConnect（机器人护理平台），并在患者家中试点 AI 驱动护理机器人。2026 年 4 月，公司推出独立 AI
              Lab，背后有八位数投资，并配置驻场创业者、数据科学家和临床医生，目标是为全球医疗服务商构建并授权 AI 工具。英国 AI Minister 公开为 Lab 发布背书。
