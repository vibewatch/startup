      - number: '5.4'
        title: 部署、机器人与 2026 路线图
        blocks:
          - type: paragraph
            body: >
              截至 May 2026，Cera 的运营足迹覆盖英国 130+ 个站点，AI 工具已部署到超过三分之二的 NHS Integrated Care Systems，且护理由 100+ 个地方政府委托。德国业务始于
              2022，但规模仍小。CeraApp 是所有站点统一的一线前端；后端 AI 工具集中运行，并向站点经理和临床主管推送警报。

              November 2025，Cera 收购机器人技术平台 GenieConnect，并签下制造协议以加快设备供应。收购前试点交付的结果包括：准时用药提醒成功率 96%；鼓励患者进食成功率
              64–80%；鼓励规律饮水成功率 78–90%。这些机器人已在 12+ 个地方议会和 30 家护理提供商试用。Cera 计划在未来 18 个月把 GenieConnect
              扩展到更多英国地区，并向第三方护理提供商授权；公司还计划将 GenieConnect 软件接入 300B 数据点语料，加入预测性预防能力。

              April 2026 推出的 AI Lab 获得八位数投资，并得到英国政府 AI 部长背书，标志着 Cera 的技术授权战略正式化。Lab
              以股权模式招募驻场创业者，先聚焦劳动力产能和患者恶化预测两个领域，并在英国规模验证完成后，面向政府和服务提供商做国际授权。这可能在护理交付合同之外带来更重 IP 的收入流，但 Cera
              尚未公开具体授权交易或收入数字。
