companyProfile:
  summary: 'Cera is a London-based digital health and home care company founded in 2016 by Dr. Ben Maruthappu MBE, Marek Sacha, and Martin Ocenas. The company delivers personal care, nursing, physiotherapy, and mental health support to patients in their homes across the UK, primarily commissioned by NHS and local government bodies. Cera''s proprietary AI platform analyzes 300B+ data points from 10,000+ carers'' visit logs to predict hospital admissions and flag deteriorating patients. The company raised >$150M in January 2025 at a >$1B valuation, reaching unicorn status, and reports revenue exceeding $500M with a 100-fold scale-up over five years.

