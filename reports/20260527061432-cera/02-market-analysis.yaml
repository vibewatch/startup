  evidenceGaps:
    - type: no-public-data
      severity: minor
      topic: germany-home-care-market
      missingEvidence: >
        No public sources quantify the German home care market size, Cera's German revenue
        or visit volume, or its competitive position with German Pflegedienst authorities.
        Cera entered Germany in 2022 but has not disclosed German operational metrics.
      whyItMatters: >
        Germany is Cera's primary international expansion market; without market size data,
        total SAM is understated and geographic concentration risk cannot be assessed.
      diligencePath: >
        Review German federal social care statistics (Statistisches Bundesamt); request
        Germany revenue breakdown from Cera; check German subsidiary filings.
      relatedQuestionRefs: [QM021]

    - type: no-public-data
      severity: minor
      topic: technology-saas-market-size
      missingEvidence: >
        No public data quantifies the emerging B2B market for AI care-coordination SaaS
        licensing to UK home care providers. Total addressable SaaS spend across 13,500
        providers is not publicly estimated.
      whyItMatters: >
        If Cera's platform matures into a SaaS product for the fragmented provider market,
        this represents an asset-light revenue stream significantly expanding TAM.
      diligencePath: >
        Request product roadmap and technology licensing pipeline from Cera; benchmark
        against comparable HealthTech SaaS providers (AlayaCare, Netsmart, Birdie).
      relatedQuestionRefs: [QM028]

    - type: no-public-data
      severity: moderate
      topic: provider-market-concentration
      missingEvidence: >
        No public source provides a revenue-ranked concentration ratio (CR5 or HHI) for
        UK domiciliary care providers. The degree of concentration among the top-5 is
        unknown from public data.
      whyItMatters: >
        Market concentration data is necessary to assess Cera's competitive moat and
        the headroom for organic share gain before encountering competitive resistance.
      diligencePath: >
        Cross-reference Companies House accounts for Care UK, Helping Hands, Bluebird Care,
        HC-One, Home Instead; use BidStats contract data to estimate LA contract shares.
      relatedTableRefs: [TM003]
      relatedQuestionRefs: [QM023]

    - type: no-public-data
      severity: minor
      topic: technology-adoption-baseline
      missingEvidence: >
        No aggregate industry-wide statistic exists on the percentage of UK home care
        providers that have adopted AI/digital care management platforms vs. paper-based
        processes. Current adoption baseline is unknown.
      whyItMatters: >
        Understanding adoption levels determines the addressable market for platform
        displacement and how quickly the technology transition is occurring.
      diligencePath: >
        Request Skills for Care digital adoption survey data; review NHSX/NHS England
        digital maturity assessments for community care providers.
      relatedQuestionRefs: [QM024]

    - type: no-public-data
      severity: minor
      topic: reablement-sub-market-size
      missingEvidence: >
        The reablement and hospital-discharge home care sub-market is not separately
        quantified in any public source; it is bundled within total domiciliary care
        statistics, preventing precise SAM calculation for this NHS ICB channel.
      whyItMatters: >
        Cera holds 29/42 NHS ICB contracts primarily for reablement; understanding this
        sub-market's size determines the ceiling on its NHS ICB revenue.
      diligencePath: >
        Request NHSE disaggregated community care spend data; review ICB commissioning
        framework documents for reablement-specific budget lines.
      relatedQuestionRefs: [QM019]
