      statement: >
        The UK government announced on 3 January 2025 an £86 million boost to the Disabled
        Facilities Grant (bringing the annual total to £711 million), enabling 7,800 more
        elderly and disabled people to make home adaptations, directly expanding the
        addressable market for home-based care services.
      type: third-party-reported
      topic: government-policy
      sourceRefs: [SM009, SM022]
      confidence: high
      freshness: current
      answersQuestionRefs: [QM013]

    - id: CM021
      statement: >
        The Better Care Fund directs approximately £9 billion of joint NHS and local-authority
