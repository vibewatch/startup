      type: third-party-reported
      topic: better-care-fund
      sourceRefs: [SM009, SM022]
      confidence: high
      freshness: current
      answersQuestionRefs: [QM020]

    - id: CM022
      statement: >
        Clinical home care saves the NHS approximately £1.6 billion annually, equivalent to
