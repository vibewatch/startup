  researchQuestions:
    - id: QM001
      question: "What is the total size of the UK home care and domiciliary care market in 2024-2026?"
      type: quantification
      targets: ["contentRequirements/1"]
      status: answered
      answer: >
        UK domiciliary care: ~£11.5B in 2024 (PolicyBee/ONS); broader home healthcare: $16.8B
        in 2026 (MarkWide). Both reflect 6.8–7.9% CAGR. Multiple anchor points validated.

    - id: QM002
      question: "What CAGR do major analyst houses estimate for the UK home healthcare market through 2030-2036?"
      type: quantification
      targets: ["contentRequirements/1"]
      status: answered
      answer: >
        MarkWide: 7.9% (2026–2036, broad scope). IBISWorld: 6.8% (domiciliary, 2025-26).
        Fortune Business Insights: 7.1% (products, 2023–2030). Consensus range: 6.8–7.9%.

    - id: QM003
      question: "What is the operational distinction between domiciliary care and broader home healthcare, and which does Cera primarily compete in?"
      type: comparison
      targets: ["contentRequirements/0"]
      status: answered
      answer: >
        Domiciliary care covers personal care and support visits (~£11.5B UK). Home healthcare
        is broader, adding clinical nursing, monitoring tech, and medical devices. Cera competes
        primarily in domiciliary care and reablement but its AI platform spans into clinical monitoring.

    - id: QM004
      question: "What portion of UK home care is publicly funded vs. privately funded?"
      type: quantification
      targets: ["contentRequirements/2"]
      status: answered
      answer: >
        ~80% publicly commissioned (LA + NHS) by volume; ~20% privately self-funded by spend.
        By user count, 23.5% are self-funders paying ~£32–34+/hr vs £24.10 LA average.

    - id: QM005
      question: "How many local authorities and NHS ICBs commission home care services in England?"
      type: quantification
      targets: ["contentRequirements/2"]
      status: answered
      answer: >
        382 local authorities and 42 NHS ICBs commission home care in England. Cera holds
        contracts with 150 LAs (~39%) and 29 ICBs (~69%).

    - id: QM006
      question: "What share of Cera's revenue is from public sector vs. private pay?"
      type: verification
      targets: ["contentRequirements/2"]
      status: answered
      answer: >
        Approximately 90% of Cera's revenue derives from public-sector contracts (LA and
        NHS ICBs); ~10% from private pay, consistent with the market's 80/20 split.

    - id: QM007
      question: "How many home care providers currently operate in the UK?"
      type: verification
      targets: ["contentRequirements/0"]
      status: answered
      answer: >
        ~13,500 domiciliary care providers in the UK; 15,232 CQC-registered domiciliary
        care services in England (2025), up 81% from 8,414 in 2017.

    - id: QM008
      question: "What is Cera's current market share relative to total UK domiciliary care market size?"
      type: quantification
      targets: ["contentRequirements/1"]
      status: answered
      answer: >
        Cera's ~£275M revenue vs. ~£11.5B total UK market = ~2.4% UK share. Against
        England-only addressable (~£7-8B), share is approximately 3–4%.

    - id: QM009
      question: "Who are the principal payer types and what are their commissioning mechanisms?"
      type: mechanism
      targets: ["contentRequirements/2"]
      status: answered
      answer: >
        Three segments: (1) LAs commission via tender/frameworks at £24.10/hr avg;
        (2) NHS ICBs via ICS frameworks for reablement/virtual wards; (3) private
        self-funders at £32–34+/hr via direct consumer channels.

    - id: QM010
      question: "What is the average hourly rate paid by local authorities vs. private payers in 2026?"
      type: quantification
      targets: ["contentRequirements/2"]
      status: answered
      answer: >
        LA average: £24.10/hr. Homecare Association 2026 minimum cost: £34.42/hr. Private
        market rate: £32–34+/hr. LA rates are 39% below the minimum sustainable cost floor.

    - id: QM011
      question: "How does NHS spending on community care compare to hospital spending and what is the pressure to shift care?"
      type: mechanism
      targets: ["contentRequirements/3"]
      status: answered
      answer: >
        Clinical home care saves NHS ~£1.6B/year (1.5M+ bed-days avoided). Better Care Fund
        directs £9B toward hospital avoidance. NHS incentivising care closer to home via
        virtual ward expansion and ICS integration.

    - id: QM012
      question: "What is the forecast growth in the UK 65+ population and how does it translate to home care demand?"
      type: quantification
      targets: ["contentRequirements/3"]
      status: answered
      answer: >
        Over-65s forecast to rise from ~19% to 27% of UK population over 50 years (ONS).
        85% of Cera's patients are already 65+. This demographic trajectory is the primary
        long-run structural demand driver.

    - id: QM013
      question: "What are the main regulatory drivers affecting the UK home care market in 2025-2026?"
      type: mechanism
      targets: ["contentRequirements/3"]
      status: answered
      answer: >
        CQC continuous evidence-based compliance model; Casey Commission Phase 1 recommendations
        due 2026; National Minimum Wage uplifts affecting provider costs; Better Care Fund
        policy framework renewed for 2025-26 with accountability measures.

    - id: QM014
      question: "How does the Baroness Casey Commission's timeline affect market structure and investment decisions?"
      type: mechanism
      targets: ["contentRequirements/3"]
      status: answered
      answer: >
        Phase 1 (2026) recommends medium-term reforms; Phase 2 (2028) proposes National Care
        Service architecture. Policy uncertainty until 2028 may slow large-scale structural
        investment, but the direction toward home-based care is unambiguous.

    - id: QM015
      question: "What workforce supply constraints exist in UK home care in 2026?"
      type: mechanism
      targets: ["contentRequirements/3"]
      status: answered
      answer: >
        111,000 unfilled roles; 13% vacancy rate (4x UK average); 30%+ annual turnover;
        overseas recruitment ban (March 2025); domestic pipeline insufficient without
        significant wage uplift. Structural, not cyclical, constraint.

    - id: QM016
      question: "How has the end of overseas care worker visa sponsorship (2025 Immigration White Paper) impacted supply?"
      type: mechanism
      targets: ["contentRequirements/3"]
      status: answered
      answer: >
        March 2025 rule change closed Health and Care visa routes for care and senior care
        workers, removing the primary post-Brexit international supply pipeline. Smaller
        providers disproportionately affected; domestic pipeline cannot compensate at current wages.

    - id: QM017
      question: "What is the estimated market opportunity for technology-enabled care platforms vs. traditional delivery?"
      type: quantification
      targets: ["contentRequirements/1"]
      status: answered
      answer: >
        Faculty estimates Cera's national platform could save £1B/year. Technology creates
        margin improvement within the structurally underfunded market; platform value
        accrues within direct-care revenue rather than as a separate SaaS market.

    - id: QM018
      question: "How does Cera's technology-enabled model compare to traditional domiciliary care in total cost to commissioners?"
      type: mechanism
      targets: ["contentRequirements/1"]
      status: answered
      answer: >
        Cera claims 52–70% reduction in unnecessary hospitalisations. At £460/bed-day,
        freeing 1,210+ bed-days/month = £6.6M+/month in avoided NHS costs, creating a
        compelling commissioner ROI narrative even at standard care visit rates.

    - id: QM019
      question: "What is the size of the reablement/hospital-discharge sub-market and Cera's position in it?"
      type: quantification
      targets: ["contentRequirements/2"]
      status: partial
      answer: >
        Cera holds 29/42 NHS ICB contracts covering reablement and hospital-discharge services.
        The sub-market size is not separately quantified in public data; estimates suggest
        reablement represents approximately 10–15% of total funded home care.

    - id: QM020
      question: "How much does the Better Care Fund allocate for integrated social care and what share flows to home care?"
      type: quantification
      targets: ["contentRequirements/3"]
      status: answered
      answer: >
        The Better Care Fund directs approximately £9 billion of joint NHS-LA funding toward
        integrated care. The specific share flowing to domiciliary care providers is not
        disaggregated in public data.

    - id: QM021
      question: "What is the size of the German home care market and Cera's position in it?"
      type: quantification
      targets: ["contentRequirements/0"]
      status: unresolved

    - id: QM022
      question: "What is the private self-funder segment size and growth trajectory in UK home care?"
      type: quantification
      targets: ["contentRequirements/2"]
      status: answered
      answer: >
        Self-funders represent ~23.5% of users and ~20% of spend (~£2.3B). The segment
        is growing as LA underfunding pushes more users to self-fund; providers migrating
        toward private pay for margin sustainability (Birdie 2026 growth blueprint).

    - id: QM023
      question: "How fragmented is the UK domiciliary care market and what is the top-5 concentration ratio?"
      type: quantification
      targets: ["contentRequirements/0"]
      status: partial
      answer: >
        Highly fragmented: 13,500 providers UK-wide; no published CR5 or HHI. Cera with
        ~£275M revenue holds ~2.4% of the total UK market. Provider revenue rankings
        are not publicly available for aggregation.

    - id: QM024
      question: "What is the current technology adoption rate among UK home care providers for AI/digital platforms?"
      type: quantification
      targets: ["contentRequirements/3"]
      status: partial
      answer: >
        No aggregate adoption rate data exists publicly. Key indicators: Lombard notes a
        "significant portion of workforce lacks digital skills"; digital adoption is
        accelerating among large providers but remains a minority across all 13,500.

    - id: QM025
      question: "What does the competitive landscape look like between large-scale vs. small local providers?"
      type: comparison
      targets: ["contentRequirements/0"]
      status: answered
      answer: >
        Large providers (Cera, Care UK, Home Instead, Helping Hands) grow share through
        technology and capital; small/micro providers face margin squeeze, CQC burden, and
        staff shortages, driving consolidation and contract hand-backs.

    - id: QM026
      question: "What are the contradictory market sizing estimates and what explains the variation?"
      type: adverse
      targets: ["contentRequirements/1"]
      status: answered
      answer: >
        Range: £6.7B (IBISWorld, intensive nursing) to $16.8B (MarkWide, all home healthcare).
        Variation is entirely driven by scope differences. No methodological contradiction;
        each estimate is internally consistent within its boundary.

    - id: QM027
      question: "What are the key switching costs preventing local authorities from changing home care providers?"
      type: mechanism
      targets: ["contentRequirements/3"]
      status: answered
      answer: >
        TUPE transfer obligations, CQC registration requirements for new provider, 12-18
        month re-tender processes under procurement regulation, care continuity obligations
        for service users, and system data migration costs.

    - id: QM028
      question: "What is the addressable market for Cera's SaaS/technology licensing to other home care providers?"
      type: quantification
      targets: ["contentRequirements/1"]
      status: unresolved

