callouts:
  - calloutType: insight
    title: "Two overlapping TAM definitions span a 2x range"
    body: >
      Competing analyst estimates range from £6.7B (IBISWorld, intensive nursing only) to
      $16.8B (MarkWide, all home healthcare). The variation is driven entirely by scope
      differences, not methodology conflicts. Investors should anchor on the narrower
      PolicyBee/ONS £11.5B domiciliary care figure, as Cera's revenue derives primarily
      from personal care and reablement, not clinical nursing.
    claimRefs:
      - CM015

  - calloutType: risk
    title: "Structural workforce shortage limits ability to convert demand into revenue"
    body: >
      The March 2025 overseas recruitment ban removed the primary post-Brexit international
      staffing pipeline. With 111,000 unfilled roles and domestic supply insufficient at
      current wage levels, all UK home care providers face a structural capacity constraint
      that limits the conversion of growing demand into billable visits—regardless of
      technology capability or public-sector contract wins.
    claimRefs:
      - CM025
      - CM027

  - calloutType: strength
    title: "Government policy is an unambiguous demand tailwind through 2028"
    body: >
      The Better Care Fund (£9B), Spending Review 2025 (£4B uplift by 2028-29), virtual
      ward expansion, and the Casey Commission (Phase 1 recommendations 2026) all point
      toward growing public commissioning of home-based care. This policy alignment
      substantially de-risks Cera's public-sector revenue base over the medium term.
    claimRefs:
      - CM030
      - CM031
      - CM032
      - CM033

