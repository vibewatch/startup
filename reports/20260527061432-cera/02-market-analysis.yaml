      type: third-party-reported
      topic: government-spending
      sourceRefs: [SM022, SM009]
      confidence: high
      freshness: current
      answersQuestionRefs: [QM013, QM020]

    - id: CM024
      statement: >
        The UK's over-65 population is forecast to rise from approximately 19% of the total
