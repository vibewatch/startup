  claims:
    - id: CM001
      statement: >
        The UK domiciliary care market was valued at approximately £11.5 billion in 2024,
        representing a 12% increase since 2020, with nearly one million people receiving
        publicly-funded home care across the UK.
      type: third-party-reported
      topic: market-size
      sourceRefs: [SM003, SM017]
      confidence: high
      freshness: current
      answersQuestionRefs: [QM001]

    - id: CM002
      statement: >
        The broader UK home healthcare market (including clinical nursing, remote monitoring,
        and personal care) is forecast to reach $16.8 billion in 2026, expanding at a CAGR
        of 7.9% to $33.3 billion by 2035 according to MarkWide Research.
      type: third-party-reported
      topic: market-size
      sourceRefs: [SM001]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QM001, QM002]

    - id: CM003
      statement: >
        IBISWorld forecasts UK domiciliary care (intensive at-home nursing only) revenues at
        £6.7 billion for 2025-26, growing at 6.8% CAGR. This narrower scope excludes basic
        personal-care visits, explaining the lower estimate relative to the wider market.
      type: third-party-reported
      topic: market-size
      sourceRefs: [SM002]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QM002, QM003]

    - id: CM004
      statement: >
        Approximately 80% of UK home care is commissioned by the public sector (local
        authorities and NHS), with the remaining 20% privately self-funded by users who
        pay market rates significantly above LA-contracted hourly rates.
      type: third-party-reported
      topic: market-structure
      sourceRefs: [SM003, SM018]
      confidence: high
      freshness: current
      answersQuestionRefs: [QM004]

    - id: CM005
      statement: >
        Approximately 959,464 people receive domiciliary care across the UK: 818,000 in
        England, 89,620 in Scotland, 28,596 in Wales, and 23,248 in Northern Ireland.
      type: third-party-reported
      topic: market-size
      sourceRefs: [SM003, SM017]
      confidence: high
      freshness: current
      answersQuestionRefs: [QM001]

    - id: CM006
      statement: >
        There are approximately 13,500 domiciliary care providers in the UK, with 15,232
        CQC-registered domiciliary care services in England as of 2025—an 81% increase from
        8,414 in 2017—while residential care establishments declined by 6.2% over the same period.
      type: third-party-reported
      topic: market-fragmentation
      sourceRefs: [SM003, SM025]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QM007]

    - id: CM007
      statement: >
        Adult social care contributes £77.8 billion to the UK economy in England, up 12.2%
        since 2023-24, exceeding the economic contribution of sectors such as accommodation
        and food services.
      type: third-party-reported
      topic: economic-contribution
      sourceRefs: [SM003, SM022]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QM001]

    - id: CM008
      statement: >
        Cera's annualised revenue grew from £178 million in 2022 to £275 million in 2023,
        a 54% increase, with 85% of its patient base aged over 65.
      type: company-claimed
      topic: revenue-growth
      sourceRefs: [SM008, SM007]
      confidence: medium
      freshness: recent
      answersQuestionRefs: [QM008]

    - id: CM009
      statement: >
        Faculty (AI consultancy) validated that Cera's platform is already saving the NHS
        approximately £1 million per day, forecast to rise to £3 million per day by autumn
        2026, equivalent to £1 billion in annualised savings.
      type: third-party-reported
      topic: NHS-savings
      sourceRefs: [SM007, SM008, SM028]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QM017, QM018]

    - id: CM010
      statement: >
        Cera's model prevents at least 233 emergency admissions per month by predicting falls,
        tracking symptoms, and mobilising nurses for high-risk alerts, freeing over 1,210
        hospital bed-days monthly at an average NHS bed-day cost of £460.
      type: company-claimed
      topic: clinical-impact
      sourceRefs: [SM007, SM008]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QM018]

    - id: CM011
      statement: >
        Cera's platform is deployed across 150 of the UK's 382 local authorities (~39%)
        and 29 of 42 NHS Integrated Care Boards (~69%), giving it the broadest public-sector
        footprint of any technology-enabled home care provider in the UK.
      type: third-party-reported
      topic: market-penetration
      sourceRefs: [SM007, SM021]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QM005, QM008, QM011]

    - id: CM012
      statement: >
        BidStats contract records show that Cera Care Operations received 10 contract award
        notices from 9 public-sector buyers, with the highest reported contract value at
        £600 million, confirming its position as a major public-sector home care contractor.
      type: third-party-reported
      topic: public-contracts
      sourceRefs: [SM020]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QM005]

    - id: CM013
      statement: >
        Cera's ~£275 million revenue against an England-addressable market of approximately
        £7–8 billion represents a 3–4% current penetration, implying significant headroom for
        organic growth through additional LA and ICB contract wins.
      type: estimated
      topic: market-share
      sourceRefs: [SM008, SM003]
      confidence: low
      freshness: current
      answersQuestionRefs: [QM008, QM013]

    - id: CM014
      statement: >
        Fortune Business Insights estimates the UK home healthcare products market (wound care,
        continence, ostomy, clinical nutrition, respiratory) at $1.50 billion in 2022, growing
        to $2.60 billion by 2030 at 7.1% CAGR. This is a products sub-segment, not services.
      type: third-party-reported
      topic: market-size
      sourceRefs: [SM004]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QM002, QM003]

    - id: CM015
      statement: >
        Competing analyst TAM estimates for UK home care/healthcare range from £6.7B (IBISWorld,
        intensive nursing) to approximately $16.8B (MarkWide, all home healthcare)—a 2x spread
        driven entirely by scope differences. All estimates are internally consistent within
        their respective market boundaries.
      type: estimated
      topic: market-sizing-methodology
      sourceRefs: [SM001, SM002, SM003, SM004]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QM026]

    - id: CM016
      statement: >
        Local authorities in England commission home care at an average rate of £24.10 per
        hour, 39% below the Homecare Association's 2026 minimum price of £34.42 per hour,
        creating structural underfunding that suppresses small-provider margins.
      type: third-party-reported
      topic: pricing-structure
      sourceRefs: [SM014, SM019]
      confidence: high
      freshness: current
      answersQuestionRefs: [QM010]

    - id: CM017
      statement: >
        Approximately 23.5% of domiciliary care users in England self-fund at market rates
        of £32–34+ per hour—40–45% above the average LA rate—making private pay
        disproportionately valuable to providers seeking above-average margin.
      type: third-party-reported
      topic: private-pay-segment
      sourceRefs: [SM018, SM014]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QM004, QM022]

    - id: CM018
      statement: >
        UK home care providers are increasingly adopting private-pay migration as a
        sustainability strategy, since LA rates below the cost floor compress margins while
        private-pay fees track closer to the real cost of service delivery.
      type: third-party-reported
      topic: business-model-shift
      sourceRefs: [SM014, SM019]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QM022]

    - id: CM019
      statement: >
        NHS Integrated Care Boards represent the fastest-growing commissioning channel for
        technology-enabled home care providers because ICS leadership faces explicit
        performance targets on delayed discharges and A&E pressure, creating a clear ROI
        case for providers with validated hospitalisation-reduction data.
      type: estimated
      topic: ICB-commissioning
      sourceRefs: [SM007, SM009, SM005]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QM009, QM019]

