chapter:
  number: 2
  title: Market Analysis
  summary: >
    The UK domiciliary care market was valued at approximately £11.5 billion in 2024,
    with broader home healthcare reaching $16.8 billion in 2026 at a 7.9% CAGR. Demand is
    structurally driven by an ageing population (over-65s rising to 27% of the UK), NHS
    policy shifts to care at home, and a £9 billion Better Care Fund. Cera's £275 million
    revenue represents approximately 3–4% of the England-addressable market, with its platform
    deployed across 150 of 382 local authorities and 29 of 42 NHS ICBs. The principal
    constraints are a chronic workforce shortage (111,000 unfilled roles; overseas recruitment
    ban March 2025), structural LA underpayment (£24.10/hr vs. £34.42 cost floor), and
    fragmented commissioning. Market consolidation is accelerating, favouring technology-enabled
    scale providers.

sections:
  - id: market-definition-boundaries
    title: Market Definition and Boundaries
    body: >
      Cera operates principally in the UK domiciliary (home) care market, a sub-segment of
      the broader adult social care and home healthcare landscape. For sizing purposes, the
      relevant market has two nested boundaries. The outer boundary, "UK home healthcare,"
      encompasses personal care, nursing care at home, reablement, remote patient monitoring,
      assistive technology, and clinical home visits—forecast at $16.8 billion in 2026 by
      MarkWide Research, expanding at a 7.9% CAGR to $33.3 billion by 2035. The inner
      operationally precise boundary, "UK domiciliary care," covers publicly and privately
      funded personal-care and support visits delivered in the home, valued at approximately
      £11.5 billion in 2024 (+12% since 2020) and forecast to grow at approximately 6.8%
      annually.

      The market excludes: residential nursing homes, NHS acute or community hospital beds,
      GP and primary-care consultations, mental-health supported living (unless co-delivered),
      and medical equipment supply chains. A meaningful adjacency is the technology-licensing
      (SaaS) segment—selling care-coordination software and AI tools to other providers—which
      remains nascent but is strategically relevant to Cera's platform monetisation roadmap.

      Approximately 80% of the £11.5 billion market is publicly commissioned via local
      authorities and NHS Integrated Care Boards (ICBs); the remaining 20% is self-funded
      (private pay). However, by user count self-funders represent approximately 23.5% of
      service users and pay significantly higher per-hour rates (£32–34+ vs. £24.10 LA
      average), making the private-pay mix disproportionately valuable to margin-seeking
      operators. The UK's roughly 13,500 domiciliary care providers are highly fragmented,
      with no single operator holding more than a low single-digit share of the total market
      by revenue.
    claimRefs:
