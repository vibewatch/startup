      Four market size anchors for UK home care and home healthcare in 2024-2026,
      drawn from different scope definitions. MarkWide uses the broadest scope (clinical
      nursing + personal care + monitoring technology). PolicyBee/ONS is the widest
      UK-validated domiciliary care services estimate. IBISWorld covers intensive at-home
      nursing only. Cera's reported revenue anchors the SOM.
