      topic: NHS-savings
      sourceRefs: [SM003, SM009]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QM011]

    - id: CM023
      statement: >
        The UK Spending Review 2025 committed an uplift of over £4 billion in adult social
