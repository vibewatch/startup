company:
  name: Cera
chapter:
  number: 8
  title: Valuation
  summary: 'Public evidence supports that Cera closed a $150 million January 2025 financing at a valuation above $1 billion, but that headline price is structurally hard to underwrite because the round was majority debt, the split is undisclosed, and public datasets disagree materially on lifetime capital raised. On a headline basis the company screens at roughly 2.0x annualised revenue against a 2025 c.$500 million run-rate, which is above retained public care and digital-health comparables but not absurd for a scaled private asset; on a common-equity basis, though, debt terms, preference overhang, and audited margin quality remain too opaque for a buy call. Recommendation: research-more, with medium confidence, high risk, and a stretched valuation stance at current terms.'
sections:
- id: recommendation-and-entry-discipline
  title: Recommendation and entry discipline
  body: 'The central valuation question is not whether a real price exists; it does. Multiple sources support that Cera raised more than $150 million in January 2025 and crossed the $1 billion valuation threshold. The harder question is whether a new investor should treat that headline price as an attractive common-equity entry point. Public evidence does not support that leap. TechCrunch reported that the majority of the round was debt and that the company declined to disclose the split, while Companies House filings show broad secured charges around the same period. That means the headline valuation can describe market clearing price and still leave common-equity economics materially worse than the headline suggests. Operationally, Cera has real scale — a c.$500 million annualised revenue claim, 2.5 million monthly visits, and deep local-government/NHS penetration — but the public record still lacks the debt agreement, waterfall, and audited margin bridge required to convert a plausible
    enterprise-value story into an investable equity story. The right posture is therefore research-more rather than buy: acknowledge that the 2025 round validates demand for the asset, but insist on structure and cash-quality diligence before underwriting upside.'
