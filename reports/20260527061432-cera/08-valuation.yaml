- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - Audited revenue exits 2026 above $600 million, AI tools convert into disclosed software-like revenue, and debt terms show ample covenant headroom.
    - 3.0x-3.5x valuation-to-revenue on $600-650 million supports roughly $1.8-2.3 billion headline value and an attractive but not extreme multiple expansion story.
    - AI monetisation fails to separate from service delivery, or debt remains senior enough to cap equity upside.
    - Requires new documentary evidence; not supported by the current public record alone.
  - - Base
    - Annualised revenue stays near $500-550 million, public-commissioner contracts remain sticky, and AI improves operating quality more than monetisation.
    - 2.0x-2.5x revenue supports roughly $1.0-1.4 billion headline value, implying limited upside from current pricing unless structure proves cleaner than it appears.
    - Flat volume, wage inflation, or higher-than-expected central costs keep equity returns mediocre.
    - Best aligned with retained evidence and with a research-more / track posture.
  - - Bear
    - Debt turns out tighter than expected, labour pressure worsens, or public-commissioner pricing and growth fail to support the current narrative.
    - 1.0x-1.6x revenue on $450-500 million would imply roughly $0.45-0.8 billion headline value and weak or negative common-equity returns after structural seniority.
    - Covenant breach, down-round risk, or equity value compression despite stable enterprise activity.
    - Plausible if diligence shows the majority-debt round carried restrictive terms or if workforce metrics degrade.
  notes: Scenario values are analyst estimates based on retained public evidence, not a banker-style DCF; downside is most sensitive to debt structure and labour economics rather than top-line alone.
