  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: Debt terms and covenant package
    missingEvidence: The January 2025 debt agreement, maturity profile, pricing, collateral details, and covenant headroom are not public in retained evidence.
    whyItMatters: Majority-debt financing can leave headline valuation intact while materially reducing new common-equity attractiveness and downside protection.
    diligencePath: Request the executed facility documents, lender presentation, and covenant model from management.
    relatedQuestionRefs:
    - QV002
    - QV016
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: blocking
    topic: Cap table and liquidation waterfall
    missingEvidence: No public cap table, preference stack, or exit waterfall is available to size common-equity upside versus headline enterprise value.
    whyItMatters: Without seniority detail, investors cannot translate the $1B plus headline price into actual ownership economics or downside protection.
    diligencePath: Request the latest cap table, preference terms, option pool, and waterfall outputs at downside, base, and upside exits.
    relatedQuestionRefs:
    - QV015
    - QV024
    relatedTableRefs:
    - TV006
  - type: conflicting-data
    severity: material
    topic: Total capital raised and investor-count reconciliation
    missingEvidence: Public sources disagree materially on lifetime capital raised and investor count, with over-$400M, over-$407M, $561.69M, and $571M all appearing in retained evidence.
    whyItMatters: The disagreement signals that historical debt/equity classification and investor mapping may be incomplete, which weakens confidence in any implied dilution analysis.
    diligencePath: Reconcile the company's financing history directly from the cap table, round documents, and board approvals.
    relatedQuestionRefs:
    - QV004
    relatedTableRefs:
    - TV001
  - type: private-evidence-only
    severity: material
    topic: Audited financial bridge and margin quality
    missingEvidence: Retained evidence does not include an audited bridge from 2023 revenue evidence to the 2025 c.$500 million annualised run-rate or a segment-level margin view.
    whyItMatters: Valuation sensitivity is only as good as the revenue and margin base; without audited detail, even a sensible multiple can be applied to the wrong denominator.
    diligencePath: Request audited FY2024 and FY2025 statements, monthly management accounts, and contract-level gross-margin decomposition.
    relatedQuestionRefs:
    - QV005
    - QV006
    - QV024
    - QV028
    relatedTableRefs:
    - TV003
    - TV006
  - type: missing-source
    severity: material
    topic: Independent replication of AI savings and hospitalisation claims
    missingEvidence: The strongest AI outcome evidence in retained sources is company-framed or partner-framed rather than fully independent and externally replicated.
    whyItMatters: Any premium to public care-delivery multiples depends on proof that AI creates durable clinical or commercial advantage, not just marketing differentiation.
    diligencePath: Obtain commissioner references, third-party studies, or externally audited outcomes cohorts that are not company-sponsored.
    relatedQuestionRefs:
    - QV029
    relatedTableRefs:
    - TV006
  - type: enumeration-incomplete
    severity: minor
    topic: Comparable valuation table coverage
    missingEvidence: Retained evidence does not include a broader set of directly comparable listed home-health operators with disclosed EV to revenue metrics.
    whyItMatters: The comp table is directionally useful, but a wider like-for-like set would narrow the valuation band and improve confidence in downside anchoring.
    diligencePath: Extend the comp set with directly comparable home-health and outsourced-care public names once usable market-data pages are retained.
    relatedQuestionRefs:
    - QV030
    relatedTableRefs:
    - TV004
