- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Debt agreement
    - Full facility, pricing, maturity, collateral, and covenant package for the January 2025 financing.
    - Majority-debt structure is the biggest gap between headline price support and equity attractiveness.
    - Request management data room access and lender summary pack.
  - - Cap table and waterfall
    - Preference stack, liquidation preferences, option pool, and any participating or ratchet terms.
    - Common-equity returns cannot be inferred from the headline valuation alone.
    - Request latest cap table plus exit waterfall at downside, base, and upside cases.
  - - Audited financial bridge
    - Audited FY2024/FY2025 statements or lender-grade bridge from 2023 revenue evidence to 2025 run-rate.
    - Needed to validate scale, cash quality, and margin durability.
    - Request audited statements, monthly management accounts, and contract-margin bridge.
  - - AI monetisation
    - Revenue, retention, or pricing uplift attributable to AI products rather than core care delivery.
    - Determines whether any premium to public care-delivery multiples is deserved.
    - Request product P&L, attach-rate data, and customer case studies with commercial terms.
  - - Workforce economics
    - Staff retention, wage inflation exposure, paid-break policy, and vacancy trend by region.
    - Labour pressure is a direct input into margin and covenant risk.
    - Request HR dashboard and contract-level staffing sensitivity analysis.
  - - Outcome validation
    - Independent replication of hospitalization and savings claims across non-company-sponsored cohorts.
    - Without outside validation, AI upside remains more narrative than underwritable.
    - Commission third-party outcomes review or NHS/commissioner reference calls.
  notes: These asks are ordered by their ability to change the underwriting decision, not by convenience or storytelling value.
