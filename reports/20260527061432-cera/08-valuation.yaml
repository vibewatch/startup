    - $13.3B trailing revenue
    - 0.17x EV / revenue at 26 May 2026.
    - Shows how public markets price tech-enabled care delivery at scale.
    - Insurance-risk economics differ sharply from home care and commissioning.
  - - Humana
    - $137.2B trailing revenue
    - 0.33x EV / revenue at 26 May 2026.
