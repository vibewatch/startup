callouts:
- calloutType: recommendation
  title: Headline price verified; equity underwriting not yet verified
  body: Cera's January 2025 financing clearly happened and clearly cleared above $1 billion, so the market has already signaled that the asset is financeable. What public evidence still does not show is how much of that price belongs to clean common-equity value after debt seniority, unknown covenants, and preference overhang. That difference is why the call is research-more rather than buy.
  claimRefs:
  - CV001
  - CV003
  - CV040
  - CV045
  - CV046
- calloutType: risk
  title: Funding-history disagreement is a real diligence signal
  body: Official, news, and data-platform sources all agree that Cera has raised a large amount of capital, but they do not agree on how much. Over-$400M, over-$407M, $561.69M, and $571M cannot all be precise at once. That matters because inconsistent capital history often hides duplicate debt/equity classification, incomplete investor mapping, or waterfall complexity that only the cap table can resolve.
  claimRefs:
  - CV006
  - CV007
  - CV008
  - CV009
  - CV010
  - CV011
- calloutType: insight
  title: A 2.0x headline multiple is defensible for the enterprise, not automatically for new equity
  body: If one looks only at the c.$500M annualised revenue claim, Cera's >$1B valuation does not look absurd. But the public comp band retained here is only 0.17x-0.59x EV/revenue, and Cera's round was majority debt. That means the current headline can simultaneously be real, enterprise-value-plausible, and still a poor risk-reward entry for fresh common equity.
