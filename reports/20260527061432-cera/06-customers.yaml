- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - Add more in-home clinical service lines such as nursing, physiotherapy, doctors' visits and palliative care
    - Expansion still sits largely inside UK public-sector accounts
    - Can deepen wallet share, but does not by itself diversify away from UK budget cycles
    - Request revenue by service line and by council vs NHS vs private-pay payer
  - - License AI agents to other health and care organisations
    - Public customer names, contract count and licensing revenue are not disclosed
    - Potentially important diversification path remains unproven commercially
    - Request first external logos, ACV, renewal terms and implementation scope
  - - Broad visible award flow across multiple buyers
    - BidStats does not reveal revenue concentration or buyer share
    - Visible buyer diversity reduces single-logo fear but not budget dependence
    - Request top-10 customer revenue concentration and framework share
  - - Strong hospital-discharge and prevention ROI case
    - Procurement-driven adoption can slow if councils or NHS bodies change priorities
    - Growth remains tied to rebids, budgets and commissioning pathways
    - Request win-rate, sales-cycle length and proportion of revenue on rebid
  - - Large regulated estate and workforce
    - Branch-quality variance and staffing strain can hurt service continuity
    - Operational inconsistency can threaten renewals and reputation even with strong top-line adoption
    - Review missed-visit rates, branch-level CQC history and turnover by region
  - - Private-pay branch availability
    - No disclosed private-pay scale to offset public underfunding
    - Private-pay exists, but public evidence does not show it is yet a major cushion
    - Request active private-pay households, ARPU and referral-source mix
  notes: Expansion paths are real, but the available public record does not quantify segment-level revenue. Risks therefore focus on procurement dependence, UK public-sector concentration and branch-level service execution.
