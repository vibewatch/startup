  title: Customer journey map
  type: journey-map
  layout: wide
  summary: Publicly supported journey from commissioner referral or family enquiry through home-care delivery, escalation and ongoing relationship expansion.
  approximationNotes: Stages are synthesized from Cera case studies, NHS England workflow descriptions, Lottie branch listings and Cumberland Council's customer-side directory page.
