tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / User / Payer
  - Use case
  - Scale
  - Revenue / strategic value
  - Gap
  rows:
  - - Local-authority commissioned home care
    - 'Buyer+payer: council adult social care; user: person receiving care at home'
    - Domiciliary care, reablement, discharge bridging, ongoing support
    - 150+ local authorities in public materials
    - Core commissioner base and procurement entry point
    - No public split of council revenue by authority or service line
  - - NHS / integrated-care-board partnerships
    - 'Buyer+payer: NHS bodies and discharge pathways; user: high-risk or recently discharged patient'
    - Falls prevention, hospital avoidance, faster discharge, virtual-at-home support
    - 29 of 42 NHS ICBs; 2m+ monthly AI-enabled home-care visits
    - Validates healthcare-at-home positioning and can deepen clinical wallet share
    - Named ICB roster and contract values are not public
  - - Publicly funded elderly / vulnerable end users
    - 'Buyer+payer often public body; user: older or vulnerable person; family also involved'
    - Routine home visits, medication support, clinical observation, end-of-life support
    - Nearly 80% of patients are 65+; 2.5m monthly visits
    - High recurring need and strong demographic tailwind
    - No public breakdown by acuity, diagnosis or care hours
  - - Private-pay / family-arranged branch customers
    - 'Buyer+payer: household or family; user: care recipient at home'
    - Hourly, ongoing or fixed-term home care arranged directly
    - Lottie Newcastle lists Private alongside Local Authority and NHS funding
    - Provides margin-diversification potential beyond public rates
    - No public count or revenue mix for private-pay customers
  - - Short-term discharge and trusted-assessor episodes
    - 'Buyer+payer: local authority and/or NHS; user: patient leaving hospital'
    - Six-to-eight-week bridging care and post-discharge reassessment
    - Official case studies show live programmes in South West and North West England
    - Creates measurable discharge ROI and opens ongoing-care follow-on
    - Case studies are anonymised by region or borough, not named councils
  - - AI-agent licensing / partner channel
    - 'Buyer+payer: external health and care organisation; user: staff inside partner organisation'
    - Recruitment, cover management, care-quality review automation
    - Publicly described as active licensing motion; named customers not disclosed
    - Could diversify away from pure labour-delivery revenue
    - No public logo list, contract count or licensing revenue
  notes: Segmentation combines official Cera materials, NHS England, customer-side directory pages and branch listings. Public evidence is strong on who uses the service, but weak on revenue mix and the exact split between council, NHS, private-pay and licensing channels.
