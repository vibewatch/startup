- id: named-customer-proof-and-reference-quality
  title: Named customer proof and reference quality
  body: 'Public customer proof is more substantive than a generic customer-logo list, but it is still uneven. Cera''s own local-government case-study page documents live production services rather than pilots, including a South West discharge bridging service and a North West trusted-assessor service with explicit savings and care-hour outcomes. Customer-side confirmation exists as well: Cumberland Council lists Cera as one of its home-care providers and publishes direct testimonials from a disabled service user and a family member, while Lottie lists the Newcastle branch with funding channels, service specialisms and a linked CQC rating. NHS England and SocialCareToday add named patient/family proof through Christine from Essex and Mary describing her father Peter''s end-of-life support at home. This mix matters because it combines company-authored case studies, customer-authored directory content, regulator-linked branch evidence and patient testimony. The main weakness is coverage completeness:
    the public set still does not reveal contract tenure, account economics, or a broad roster of named councils, ICBs or private-pay household customers. Production proof is therefore real but partial.'
