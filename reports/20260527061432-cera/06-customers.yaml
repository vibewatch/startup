company:
  name: Cera
chapter:
  number: 6
  title: Customers
  summary: 'Cera''s customer base is dominated by UK public-sector commissioning: public materials and third-party coverage consistently place the company in more than 150 local authorities and 29 of 42 NHS integrated care boards, supported by almost 150 regulated sites, more than 10,000 carers and nurses, and roughly 2.5 million monthly home visits. Customer proof is stronger than a logo wall because it includes official local-authority case studies, customer-side directory listings, named patient and family testimonials, public procurement records, and branch-level CQC evidence. Durability is still hard to prove directly: Cera does not publicly disclose NRR, churn, renewal or tenure, so the best public proxies are active award flow, good branch ratings in places like Newcastle and Wiltshire, and adverse evidence from Castleham Lodge and Breakroom showing that staffing strain and branch-level variance remain real risks.'
sections:
- id: buyer-user-payer-segmentation
  title: Buyer, user, and payer segmentation
  body: 'Cera''s disclosed customer mix is led by public-sector commissioners rather than self-serve consumer acquisition. Official and trade coverage repeatedly describe more than 150 local authorities and 29 of 42 NHS integrated care boards using the model, which makes councils and NHS bodies the dominant buyers and payers for many care packages. The end users, however, are elderly or vulnerable people receiving home care, reablement, nursing, mental-health, learning-disability, palliative and other support in their homes. Family members are also visibly part of the product workflow: NHS England describes carers, family members and healthcare staff recording updates into the app, and both NHS England and Cumberland Council publish family-side testimonials. Public evidence also shows a smaller private-pay channel at branch level rather than only public commissioning. Lottie''s Newcastle listing explicitly says the site accepts Private, Local Authority and NHS funding, while Cumberland Council''s
    provider page addresses both disabled end users and relatives arranging care. Finally, Cera is trying to add a partner/licensing channel through AI-agent sales to other health and care organisations, but public customer names and revenue for that motion are still absent.'
