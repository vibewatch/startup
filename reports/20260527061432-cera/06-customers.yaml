- id: expansion-and-concentration-risks
  title: Expansion and concentration risks
  body: 'Cera''s best expansion vector appears to be land-and-expand inside existing commissioner accounts rather than a wholly new customer archetype. Official and independent sources describe newer service lines such as nursing, physiotherapy, doctors'' visits, specialist and palliative care in the home, which can widen wallet share within existing local-authority and NHS relationships. The emerging AI-agent licensing motion could diversify the base, but public evidence stops short of naming external licensees or reporting any licensing revenue. Concentration risk is therefore still dominated by UK public spending and procurement. BidStats shows active award flow across multiple visible buyers, which reduces fear of reliance on a single named council, but it does not reveal revenue concentration, contract duration or the share of sales tied to local authorities versus NHS bodies. Add in branch-quality variance and workforce strain, and the main customer risk is clear: Cera has broad adoption,
    but it remains heavily exposed to UK publicly funded demand, procurement cycles and operational consistency across a large regulated network.'
