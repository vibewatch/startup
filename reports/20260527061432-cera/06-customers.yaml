  evidenceGaps:
  - type: missing-source
    severity: material
    topic: retention-gap
    missingEvidence: Commissioner renewal rates, NRR, GRR, logo churn, contract tenure and cohort-level repeat-usage data by customer segment.
    whyItMatters: Without direct retention metrics, durability must be inferred from weaker proxies such as branch ratings, procurement awards and testimonials.
    diligencePath: Request cohort retention and renewal data split by local authority, NHS, private-pay and any licensing customers.
    relatedQuestionRefs:
    - QU015
    - QU025
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: licensing-channel
    missingEvidence: Named external AI-agent licensees, contract counts, ACV and renewal terms for the partner channel.
    whyItMatters: The licensing narrative could materially diversify customer concentration, but public sources only confirm the intent to license, not commercial traction.
    diligencePath: Ask management for the first external deployments, customer names, implementation scope and revenue contribution from licensing.
    relatedQuestionRefs:
    - QU008
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof-table coverage
    missingEvidence: A fuller named roster of local authorities, NHS buyers, private-pay households and reference accounts behind the public customer claims.
    whyItMatters: The public proof set demonstrates real production use, but it is too incomplete to infer account breadth, tenure or concentration with confidence.
    diligencePath: Request a referenceable customer list with segment, region, service line, production date and willingness-to-reference status.
    relatedQuestionRefs:
    - QU009
    - QU010
    - QU026
    relatedTableRefs:
    - TU003
  - type: missing-source
    severity: material
    topic: concentration-risk
    missingEvidence: Top-customer revenue share and payer-mix split across local-authority, NHS, private-pay and licensing channels.
    whyItMatters: Visible buyer diversity in award notices does not reveal whether revenue is broadly distributed or concentrated in a small number of contracts.
    diligencePath: Request the top-10 customer revenue table, rebid schedule, payer mix and any single-buyer exposure thresholds used internally.
    relatedQuestionRefs:
    - QU021
    - QU026
    relatedTableRefs:
    - TU005
