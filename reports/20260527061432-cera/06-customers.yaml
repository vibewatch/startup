  data:
    nodes:
    - id: referral
      label: Referral / enquiry
      description: Local authority, NHS discharge team or family identifies home-care need and approaches Cera or a listed branch provider
    - id: assessment
      label: Assessment
      description: Trusted-assessor or branch intake determines care package, discharge support or ongoing domiciliary needs
    - id: setup
      label: Home-care setup
      description: Regulated branch allocates carers or nurses, defines visit cadence, and starts digital monitoring and care plans
    - id: delivery
      label: Recurring home visits
      description: Cera staff deliver recurring visits, record updates digitally, and support patients in their own homes
    - id: escalation
      label: Escalation / prevention
      description: AI alerts, family updates and staff interventions help prevent deterioration, hospitalisation or delayed discharge
    - id: expansion
      label: Ongoing / expanded relationship
      description: Relationship can extend into ongoing care, broader clinical services, or in future into partner-licensed workflow tools
