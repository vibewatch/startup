- id: adoption-scale-and-operational-footprint
  title: Adoption scale and operational footprint
  body: 'The strongest evidence for real adoption is operating volume rather than logos. Cera''s May 2025 milestone release said the company had reached c. $500 million in annualised revenue, around 2.5 million home visits per month and more than 10,000 carers and nurses, while the same release put the footprint at almost 150 regulated sites spanning over 150 UK local governments and two-thirds of NHS integrated care systems. Independent coverage from Hospital Management described more than 60,000 daily visits in January 2025, and NHS England said the falls-prevention platform alone was already being used in more than 2 million home-care visits a month by March 2025. These are mixed but directionally consistent signals: the same installed base appears to be serving large public-sector commissioner footprints, broad branch coverage and very high recurring visit volume. The key interpretation is that Cera is not a pilot-stage digital-care vendor; it is operating at national scale inside a
    regulated home-care estate. The main denominator gaps are the split between local-authority, NHS and private-pay revenue, the share of visits tied to each channel, and the number of named customer organisations behind the headline counts.'
