      - number: '2.3'
        title: Buyer, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              Travelers are both users and payers on the demand side; local operators, attractions, and activity
              providers supply inventory and effectively purchase global distribution through transaction commissions.
              Adoption begins when a traveler needs to compare unfamiliar local options, then depends on visible
              availability, reviews, mobile fulfillment, cancellation terms, and trusted payment. GetYourGuide's
              proprietary 2023 research, based on more than 6,000 travelers in six countries, reported 142%
              mobile-booking growth from 2022 to 2023 and said its selected "Modern Explorer" cohort valued flexible
              online booking over price. Current coupon listings show that price promotion still participates in
              acquisition, but those offers do not reveal ordinary realized prices or marketplace take rate. The
              evidence therefore supports digitization and convenience as adoption drivers without proving durable
              pricing power.
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.4'
        title: Constraints, timing, and diligence implications
        blocks:
          - type: paragraph
            body: >-
              The market's fragmentation is both opportunity and constraint. Aggregating small operators can improve
              selection and discovery, yet service delivery remains in third-party hands. Complaint pages contain
              individual reports about no-shows, cancellations, invalid tickets, and delayed refunds; these observations
              establish failure modes, not their frequency, because no booking-volume denominator is disclosed. Adoption
              can therefore accelerate through mobile convenience and flexible policies while trust, supplier quality,
              refund execution, and regulatory differences slow conversion or repeat use. Valuation should rely on
              verified cohort retention, take rate, contribution margin, supplier concentration, and complaint incidence
              rather than applying the broad market growth rate directly to GetYourGuide. Independent regional market
              sizing and normalized service-quality data are the two material evidence gaps.
            claimRefs:
              - CM007
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Large category claims are not an investable SOM
            body: >-
              Neither retained source isolates the digitally bookable regional spend that GetYourGuide can serve or the
              share obtainable after direct and marketplace substitutes. Use the broad estimates as directional context
              only.
            calloutType: risk
            claimRefs:
              - CM004
              - CM006
              - CM007
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: A broad landscape with no single winner
        blocks:
          - type: paragraph
            body: >-
              The relevant competitive set extends beyond another tours marketplace. Viator is the closest global OTA
              peer and benefits from Tripadvisor's travel-planning funnel; Klook is a mobile-first Asian challenger;
              Civitatis emphasizes Spanish-language discovery; and narrower marketplaces compete through regional focus
              or lower intermediation. Tripadvisor, Airbnb, Groupon, Peek, Thrillophilia, and other discovery surfaces
              are adjacent entrants because they can redirect existing audiences toward activities. The durable status
              quo is also formidable: travelers still discover and buy through local operators, hotel concierges,
              guidebooks, walk-up kiosks, and operator-owned websites. Tracxn ranks GetYourGuide first within its own
              194-company peer taxonomy, but that ranking is not market share and should not be read as proof of
              dominance.
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP008
              - CP012
          - type: table
            tableRef: TP001
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP006
              - CP008
              - CP010
              - CP012
      - number: '3.2'
        title: Convenience and distribution are the main battlegrounds
        blocks:
          - type: paragraph
            body: >-
              GetYourGuide's consumer proposition combines broad activity discovery with reviews, mobile booking, free
              cancellation on most activities, pay-later availability, and round-the-clock support. Those features
              reduce transaction friction, but they are not unique: Viator offers a similar marketplace and draws demand
              from Tripadvisor, while many operators list on both platforms. Multi-homing limits hard supplier lock-in
              and gives travelers overlapping inventory. GetYourGuide is trying to sharpen merchandising around
              distinctive experiences; its own 2026 trend content says workshop bookings rose 58% year over year. That
              signal supports a curation strategy, but it is company-issued demand evidence rather than an independent
              benchmark of superior conversion or retention.
            claimRefs:
              - CP001
              - CP002
              - CP006
              - CP007
              - CP011
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP006
              - CP007
              - CP011
              - CP012
              - CP015
      - number: '3.3'
        title: Commission economics invite direct and low-fee substitutes
        blocks:
          - type: paragraph
            body: >-
              Public sources do not disclose a current standardized GetYourGuide rate card. Two non-company sources
              describe marketplace commissions around 20% to 30%, while a competing marketplace claims direct booking
              can be 15% to 25% cheaper. These figures are directional rather than audited: rates may vary by operator,
              product, geography, and negotiated terms, and the cheaper claim comes from a competitor promoting its own
              subscription model. Even so, the mechanism is clear. Suppliers can trade commission for global demand,
              support, and booking infrastructure, or invest in direct acquisition and retain more economics. Because
              operators can multi-home, distribution power depends on sustained demand generation rather than
              contractual exclusivity demonstrated in the available evidence.
            claimRefs:
              - CP007
              - CP009
              - CP010
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP008
              - CP009
              - CP010
              - CP015
      - number: '3.4'
        title: The moat is a reinforcing network, not proven lock-in
        blocks:
          - type: paragraph
            body: >-
              GetYourGuide's defensibility is best understood as a reinforcing distribution and trust loop: broad supply
              attracts travelers, reviews and support reduce booking risk, and demand gives suppliers a reason to
              maintain inventory and modern booking workflows. The evidence does not establish exclusive supply,
              proprietary inventory, or high switching costs. A detailed user complaint also illustrates the downside of
              delegated fulfillment: supplier conduct, cancellation handling, and refunds can damage the marketplace
              brand even when the underlying tour is delivered by a third party. An affiliate review likewise identifies
              operator-dependent quality and variable refund timing. Viator's Tripadvisor funnel, direct booking,
              regional specialists, and low-fee models can therefore weaken take rates or raise acquisition costs
              without having to duplicate GetYourGuide's entire product.
            claimRefs:
              - CP013
              - CP014
              - CP016
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP005
              - CP006
              - CP010
              - CP012
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Marketplace trust inherits supplier execution risk
            body: >-
              One historical complaint describes weak pre-booking safety reassurance, a later operator cancellation, and
              difficulty obtaining a refund. It is anecdotal rather than an incidence rate, but it demonstrates how
              third-party fulfillment can transmit operational failures to the platform brand.
            calloutType: risk
            claimRefs:
              - CP013
              - CP014
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pricing transparency
        blocks:
          - type: paragraph
            body: >-
              GetYourGuide's supplier materials describe a marketplace rather than an inventory-owning tour operator.
              Suppliers may add and maintain activities without an upfront platform fee, and GetYourGuide charges a
              commission only when a booking succeeds. The exact rate is not publicly standardized: the company says it
              varies by country and is disclosed after signup. An affiliate-supported industry article estimates a
              typical 20%-30% booking commission, but that range is not a company tariff and should not be treated as
              realized take rate. Customer-facing pages show activity-level "From" prices and discounts, while the
              evidence does not disclose revenue mix, contra-revenue treatment, refund accounting, or whether any
              non-commission streams are material.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI005
              - CI011
