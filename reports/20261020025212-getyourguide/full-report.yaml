  - id: FU001
    title: Customer discovery, fulfillment, and expansion loop
    type: journey-map
    summary: >-
      Marketplace reach feeds listing choice, operator fulfillment, review formation, and data-led listing improvement,
      but public evidence does not quantify retention through the loop.
    data:
      items:
        - label: Traveler discovery
          detail: Travelers arrive through direct and distributed surfaces.
          touchpoints:
            - Marketplace
            - distribution partners
            - creators
        - label: Search and comparison
          detail: Listings expose activity details, prices, ratings, and availability.
          touchpoints:
            - Destination pages
            - activity cards
            - reviews
        - label: Booking
          detail: A traveler books an operator-provided experience through the marketplace.
          touchpoints:
            - Checkout
            - payment methods
            - confirmation
        - label: Local fulfillment
          detail: The supplier delivers the experience, creating operator-dependent quality risk.
          touchpoints:
            - Meeting point
            - tour or attraction
            - support
        - label: Review and trust
          detail: Traveler feedback and Creator Reviews can add social proof.
          touchpoints:
            - Traveler review
            - Creator Reviews beta
            - provider rating
        - label: Performance feedback
          detail: Operators receive listing-funnel visibility and tailored suggestions.
          touchpoints:
            - Views
            - bookings
            - recommended actions
        - label: Listing improvement
          detail: Operators adjust content, availability, and service to compete for visibility.
          touchpoints:
            - Listing quality
            - availability
            - response quality
    approximationNotes: >-
      The sequence is an evidence-backed operating model, not a measured conversion funnel; no stage conversion or
      retention rates are inferred.
    claimRefs:
      - CU006
      - CU010
      - CU016
  - id: FR001
    title: Residual risk heatmap
    type: matrix
    summary: >-
      Supplier compliance, service execution, and connectivity carry the highest residual impact because controls are
      documented but current outcome evidence is incomplete.
    data:
      columns:
        - label: Likelihood
          detail: Qualitative assessment from documented failure mechanisms
        - label: Impact
          detail: Potential effect on customers, operations, or investment thesis
        - label: Mitigation maturity
          detail: Strength of controls visible in assigned evidence
      rows:
        - label: Supplier compliance and safety
          note: Verification and enforcement exist; incident outcomes are undisclosed.
          values:
            - label: Medium
            - label: High
            - label: Medium
        - label: Availability and service quality
          note: Supplier performance and listing accuracy remain distributed.
          values:
            - label: Medium
            - label: High
            - label: Medium
        - label: Connectivity and booking integrity
          note: Configuration guidance exists; reliability rates are unavailable.
          values:
            - label: Medium
            - label: High
            - label: Low-Medium
        - label: Data and agentic-system controls
          note: Observability, evaluations, and guardrails are active engineering priorities.
          values:
            - label: Medium
            - label: High
            - label: Medium
        - label: Payment, fraud, and chargebacks
          note: Contractual allocation exists; loss and concentration data are unavailable.
          values:
            - label: Medium
            - label: Medium
            - label: Medium
        - label: Financing and liquidity opacity
          note: 2023 funding does not disclose current cash, debt drawn, or runway.
          values:
            - label: Medium
            - label: High
            - label: Low
    approximationNotes: >-
      Qualitative categories are analytical assessments, not measured probabilities; they should be replaced with
      incident, concentration, and financial data during diligence.
    claimRefs:
      - CR001
      - CR005
      - CR006
      - CR009
      - CR014
      - CR015
      - CR016
