      - number: '5.3'
        title: Maturity and differentiation
        blocks:
          - type: paragraph
            body: >-
              The evidence indicates a mature commercial surface: the official supplier page claims 35,000-plus supply
              partners, 150,000-plus activities, 37 traveler languages, and activity coverage in more than 12,000
              cities. Wikipedia also records an engineering office opened in Zurich in 2017, while the live consumer
              site shows destination search, activity merchandising, reviews, pricing, cancellation messaging, support,
              mobile applications, and multiple payment methods. The defensible product advantage appears to be
              orchestration across global demand, localized content, supplier distribution, and reservation-system
              connectivity rather than a publicly demonstrated proprietary infrastructure breakthrough. An affiliate
              account describes recent AI features for content, discovery, and provider workflows, but no assigned
              primary technical documentation or independent benchmark verifies model quality, adoption, accuracy, or
              durable advantage.
            claimRefs:
