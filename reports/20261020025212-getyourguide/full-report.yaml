  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, footprint, and marketplace scale
        blocks:
          - type: paragraph
            body: >-
              GetYourGuide operates a two-sided travel-experiences marketplace: travelers discover and book tours,
              attraction tickets, and activities supplied by local operators rather than by GetYourGuide itself. The
              company describes more than 150,000 experiences across 12,000 cities and more than 200 million tickets
              sold, indicating substantial catalog breadth and transaction history, but neither figure discloses active
              suppliers, unique travelers, or current annual bookings. TechCrunch described the business as Berlin-based
              and identified Zurich as an engineering office; the live consumer site likewise presents Zurich and Berlin
              as its operating centers. These scale claims are useful operating markers, not substitutes for
              independently audited marketplace KPIs.
            claimRefs:
              - CO001
              - CO004
              - CO005
              - CO006
