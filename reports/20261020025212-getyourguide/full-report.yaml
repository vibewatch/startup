        title: Milestones, operating momentum, and diligence implications
        blocks:
          - type: paragraph
            body: >-
              The milestone record spans formation in 2009, major venture financings in 2017 and 2023, and a 2025
              profitability announcement. The company also reported 30% year-over-year GMV growth and 10 million
              experiences booked in Q3 2025, while a current aggregator reports 1,344 employees at December 2025. These
