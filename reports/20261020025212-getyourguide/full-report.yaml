      - number: '4.2'
        title: Distribution, service delivery, and working capital
        blocks:
          - type: paragraph
            body: >-
              The public model combines owned web and app demand with affiliate, API, and broader distribution
              relationships. AskCyborg identifies direct, affiliate, and API channels, but explicitly labels its work
              AI-generated and not independently verified; a separate affiliate-supported article claims more than 1,000
              distribution partners. These signals indicate a broad acquisition surface, not efficient acquisition
              economics. Company materials say commission funds platform management, tools, supplier insights, and
              promotion, while the consumer site advertises support and flexible booking features. Supplier settlements
              are monthly at no extra cost or twice monthly for a surcharge, with fulfilled bookings paid net of
              commission. That cadence creates an observable settlement mechanism, but public sources do not quantify
              payment reserves, refund float, marketing intensity, support cost, or gross-margin contribution.
            claimRefs:
              - CI004
              - CI006
              - CI007
              - CI008
              - CI009
          - type: table
            tableRef: TI003
            claimRefs:
              - CI004
              - CI005
              - CI007
              - CI008
              - CI009
              - CI012
              - CI013
              - CI014
              - CI015
              - CI016
      - number: '4.3'
        title: Marketplace scale and financing signals
        blocks:
          - type: paragraph
            body: >-
              Scale claims are substantial but cannot be translated into current revenue. StartupHub reports more than
              150,000 tours, activities, and attractions from more than 20,000 suppliers; these are inventory and
              supplier counts, not bookings, GMV, active customers, or recognized revenue. Its financing profile reports
              $895 million of total funding and labels conventional debt as the most recent round on record. Separately,
              The Traveler reports a June 2023 financing of $194 million combining equity and debt at an approximately
              $2 billion valuation. These records show access to external capital and debt, but funding raised is not
              cash available. No retained source provides a current cash balance, burn rate, runway, debt maturity
              schedule, covenant package, liquidation preferences, or next-round trigger.
            claimRefs:
              - CI010
              - CI012
              - CI013
      - number: '4.4'
        title: Financial verdict and underwriting blockers
        blocks:
          - type: paragraph
            body: >-
              The model has attractive structural features: variable transaction revenue, no stated supplier listing
              fee, and a broad inventory base. The unresolved issue is revenue quality after acquisition, refunds,
              support, payment processing, and supplier payouts. Historical pandemic evidence shows that travel
              interruption could eliminate revenue quickly enough to require furloughs and cost cuts. Customer evidence
              also describes cancellation and refund failure after an operator canceled, while a 2026 affiliate review
              cautions that operator quality and refund timing vary. These observations do not quantify present loss
              rates, but they identify costs and liabilities that a gross-booking-value narrative can hide. The
              investment stance therefore remains diligence-gated until audited statements, cohort economics,
              channel-level CAC and payback, refund rates, cash, burn, runway, and debt obligations are supplied.
            claimRefs:
              - CI002
              - CI014
              - CI015
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Funding is not runway
            body: >-
              Public financing records show access to equity and debt, but they do not establish current unrestricted
              cash, monthly burn, debt service, covenant headroom, or the next financing trigger. Capital adequacy
              remains ununderwritten.
            calloutType: risk
            claimRefs:
              - CI012
              - CI013
          - type: callout
            title: Underwrite from cohorts, not inventory
            body: >-
              Require audited revenue and margin bridges plus booking cohorts by channel, geography, and activity
              category. Large supplier or activity counts do not reveal repeat behavior, acquisition efficiency, refund
              leakage, or contribution margin.
            calloutType: recommendation
            claimRefs:
              - CI008
              - CI009
              - CI010
              - CI014
              - CI015
              - CI016
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product workflow and operating modules
        blocks:
          - type: paragraph
            body: >-
              The product joins two workflows. Travelers browse destination and attraction pages, compare activity
              details, prices, ratings, availability, and booking conditions, then transact through the marketplace.
              Suppliers register a business, submit an activity for review, provide legal and financial information, and
              maintain listing content, capacity, schedules, and pricing through a portal. GetYourGuide's current
              supplier page also describes analytics, demand insights, special offers, multilingual listing management,
              and AI-assisted content creation. This is broader than a simple catalog: the operating product combines
              merchandising, transaction support, supplier tooling, and distribution. However, most capability and scale
              statements are company-issued, and public evidence does not quantify conversion lift, supplier tool
              adoption, booking accuracy, or traveler repeat behavior.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
              - CE009
