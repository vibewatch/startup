    columns:
      - Scenario
      - Explicit assumptions
      - Valuation and return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - >-
          Audited growth, retention, contribution margin, and cash conversion are strong; debt and preferences are
          manageable.
        - >-
          A premium to the $2B June 2023 reference is considered only after a comparable-set bridge and required-return
          model.
        - Multiple compression, travel cyclicality, and supplier concentration.
        - Unpriced until audited operating evidence is supplied.
      - - Base
        - Scale persists, but current profitability and cash conversion remain unverified.
        - Use the $2B mark only as a negotiation reference; do not pay a premium without verified fundamentals.
        - Stale price anchor, financing overhang, and limited exit visibility.
        - Current public evidence supports tracking, not a numeric probability.
      - - Bear
        - Growth or repeat demand weakens, supplier-quality costs rise, or debt and preferences absorb equity proceeds.
        - Require a material discount to the historical mark and model preference-adjusted downside before entry.
        - Refund leakage, covenant pressure, operator failures, and weak cash conversion.
        - Triggered by failed diligence or adverse operating trends.
    notes: >-
