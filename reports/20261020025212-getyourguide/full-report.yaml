  - id: FI001
    title: Transaction-to-service economic flow
    type: flow
    summary: >-
      The public evidence supports the booking and settlement mechanics, but not the margin retained after acquisition,
      support, refunds, and platform costs.
    data:
      nodes:
        - id: traveler-demand
          label: Traveler demand
          detail: Direct, affiliate, API, and distribution channels bring travelers to activity-level offers.
        - id: booking-value
          label: Completed booking value
          detail: Traveler prices vary by activity and may include displayed discounts.
        - id: platform-commission
          label: Platform commission
          detail: Company-confirmed on successful bookings; exact rate varies and is disclosed after supplier signup.
        - id: supplier-settlement
          label: Supplier settlement
          detail: Fulfilled bookings are paid monthly or twice monthly, net of commission.
        - id: service-costs
          label: Platform and service costs
          detail: >-
            Technology, promotion, support, payment operations, refunds, and channel acquisition consume commission
            revenue.
        - id: contribution-cash
          label: Contribution and cash generation
          detail: Not publicly disclosed; audited margin and cash-conversion evidence is required.
      edges:
        - from: traveler-demand
          to: booking-value
          label: converts to booking
        - from: booking-value
          to: platform-commission
          label: commission deducted
        - from: platform-commission
          to: supplier-settlement
          label: supplier receives net amount
        - from: platform-commission
          to: service-costs
          label: funds platform delivery
        - from: service-costs
          to: contribution-cash
          label: residual not disclosed
    approximationNotes: >-
      The 20%-30% commission range is a third-party estimate and is intentionally omitted from the flow values; no
      cumulative bridge or margin amount is implied.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI006
      - CI007
      - CI008
      - CI009
      - CI011
      - CI015
