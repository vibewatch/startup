              - CE010
              - CE011
              - CE012
              - CE013
      - number: '5.4'
        title: Trust, reliability, safety, and roadmap risks
        blocks:
          - type: paragraph
            body: >-
              GetYourGuide's consumer surface promises trusted reviews, quality tours, free cancellation on most
              activities, pay-later availability, and 24/7 support. Its supplier page says applicants undergo review and
              that operators must be registered, legally compliant, and provide high-quality products. These are
              company-stated controls, not evidence of control design or effectiveness. Independent signals are mixed: a
              2026 affiliate review describes a legitimate, convenient marketplace but notes that experience quality
              depends on local operators and that refund and cancellation outcomes vary; a ComplaintsBoard account
              alleges a 2018 safety escalation and refund failure involving a local operator. One complaint cannot
              establish an incident rate, yet it demonstrates the severity of marketplace-control failure modes.
              Underwriting therefore requires current incident, refund, fraud, uptime, supplier-removal,
              penetration-test, privacy, and certification evidence, plus a dated roadmap tied to measurable release
              outcomes.
            claimRefs:
              - CE012
              - CE013
              - CE014
              - CE016
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Operational breadth is the visible product moat
            body: >-
              The strongest public product signal is the coordinated traveler, supplier, distribution, and
              reservation-system workflow, not independently verified proprietary infrastructure.
            calloutType: strength
            claimRefs:
              - CE001
              - CE005
              - CE006
              - CE007
              - CE010
          - type: callout
            title: Trust promises outrun disclosed control evidence
            body: >-
              Public pages describe reviews, supplier screening, cancellation flexibility, and support, but the assigned
              evidence does not disclose control testing, security certification, incident rates, or service levels.
            calloutType: risk
            claimRefs:
              - CE012
              - CE014
              - CE016
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: A multi-sided customer system
        blocks:
          - type: paragraph
            body: >-
              GetYourGuide serves travelers as buyers and users, experience operators as suppliers, and distribution
              partners and creators as acquisition and trust channels. Its live storefront shows destination,
              attraction, price, duration, rating, and cancellation information at the point of choice, while the
              company reports more than 50,000 operators, more than 40 million monthly travelers, more than 15,000
              distribution partners, and a creator community of 33,000. These figures describe reach rather than
              monetized or retained cohorts: none discloses active-booker counts, repeat-booking rates, supplier GMV
              distribution, or overlap among channels. The segmentation therefore supports marketplace breadth but not a
              conclusion about durable customer economics.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU011
              - CU013
      - number: '6.2'
        title: Adoption is visible, but proof quality is uneven
        blocks:
          - type: paragraph
            body: >-
              The strongest production evidence is supplier-level rather than traveler-level. An independent
              affiliate-supported article reports that City Tours Belgium gets 65% of bookings through GetYourGuide and
              recorded 200% year-over-year growth after joining; it also reports that Graff Tours receives about 10% of
              bookings from the platform. GetYourGuide's supplier site separately lists connectivity case studies for
              Tour Marbella, Clio Muse, and International Friends, but the retained landing page does not expose their
              underlying outcome metrics. A Contentstack partner case study cites more than 500,000 daily visitors,
              offering historical corroboration of audience scale without a publication date or a directly comparable
              definition to monthly travelers.
            claimRefs:
              - CU011
              - CU012
              - CU013
              - CU014
              - CU015
          - type: table
            tableRef: TU002
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU005
              - CU015
          - type: table
            tableRef: TU003
            claimRefs:
              - CU011
              - CU012
              - CU013
              - CU014
      - number: '6.3'
        title: Reviews and distribution create the expansion loop
        blocks:
          - type: paragraph
            body: >-
              Supplier expansion depends on visibility, conversion, availability, and review quality rather than a
              disclosed contractual land-and-expand motion. The independent operator analysis says these signals
              influence marketplace ranking. GetYourGuide's September 2026 release adds a Creator Reviews beta in which
              an eligible new activity can be booked and reviewed by a travel partner; the company says early tests
              indicate that even one review improves booking odds. The same release gives operators listing-funnel
              visibility and tailored suggestions, linking performance feedback to listing improvement. This is a
              plausible reinforcement loop, but no retained evidence quantifies incremental bookings, renewal behavior,
              or supplier lifetime value from the feature.
            claimRefs:
              - CU006
              - CU010
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU006
              - CU010
              - CU016
      - number: '6.4'
        title: Durability and concentration remain unproven
        blocks:
          - type: paragraph
            body: >-
              Public evidence does not disclose NRR, GRR, churn, traveler repeat cohorts, contract length, top-supplier
              concentration, or the share of bookings sourced from any distribution channel. The available adverse
              evidence is qualitative: an independent review guide warns that experience quality depends on local
              operators and that refund timing and cancellation policies vary, while a historical ComplaintsBoard
              account describes safety concerns followed by a canceled tour and refund friction. These sources establish
              plausible execution risk, not incident frequency. Investment diligence should therefore treat customer
              durability as unverified and request cohort, concentration, complaint, refund, and cancellation data
              directly from management.
            claimRefs:
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Reach is not retention
            body: >-
              Public reach metrics and selected supplier cases do not reveal repeat booking, cohort retention, supplier
              churn, or concentration; these remain material diligence requests.
            calloutType: risk
            claimRefs:
              - CU002
              - CU003
              - CU011
              - CU013
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk posture
        blocks:
          - type: paragraph
            body: >-
              Supplier quality and compliance are the principal residual risks because the marketplace contract places
              service performance, listing accuracy, licensing, insurance, tax compliance, and much customer-data
              handling on suppliers, while an affiliate-funded profile reports a network of 35,000 partners across more
              than 150 countries. GetYourGuide can verify suppliers, remove offers, refund customers, and use complaint
              and cancellation signals in ranking, but those controls are largely detective or remedial rather than
              proof that every experience is safe before sale. A first-person complaint alleging that a tour was sold
              immediately before an operator disclosed a government closure is only one historical account, not an
              incident-rate estimate, yet it illustrates the downside when inventory and field conditions diverge. The
              investment implication is a high diligence burden: the thesis should break if verified severe incidents,
              complaint rates, or supplier suspensions rise without timely remediation.
            claimRefs:
              - CR001
              - CR004
              - CR007
              - CR010
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR005
              - CR006
              - CR009
              - CR014
              - CR015
              - CR016
      - number: '7.2'
        title: Legal, regulatory, and financial allocation
        blocks:
          - type: paragraph
            body: >-
              The October 2026 supplier terms define GetYourGuide as a commercial agent while the customer buys the
              service directly from the supplier. That structure narrows direct operating responsibility but does not
              remove platform exposure to consumer dissatisfaction, regulatory scrutiny, payment disputes, or
              reputational damage. Suppliers must complete verification checks and maintain licenses, insurance, and tax
              information; GetYourGuide may reject or remove non-compliant offers and issue refunds. Chargeback
              provisions also make supplier payout conditional on successful customer payment. Separately, the 2023
              financing announcement comprised $85 million of equity and a $109 million revolving credit facility; it is
              historical financing raised, not evidence of current cash, current debt drawn, or runway. Investment
              approval should therefore require current litigation and regulator searches, insurance-control testing,
              and a debt utilization schedule rather than inferring present liquidity from the announced financing.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR015
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR010
      - number: '7.3'
        title: Operations, security, and customer harm
        blocks:
          - type: paragraph
            body: >-
              Operational failure can originate at the supplier, the platform, or a connectivity partner. TourTask's
              integration documentation describes temporary unconfirmed bookings before payment and warns that
              mismatched participant limits can permit a party the supplier cannot serve or leave party sizes without a
              price. GetYourGuide's terms make the supplier responsible for third-party connectivity failures and for
              compliant processing of customer personal data through those tools. A reposted GetYourGuide engineering
              role calls for tracing, quality metrics, online and offline evaluations, feedback loops, and guardrails
              for an internal agent platform, which shows active control design but does not establish production
              reliability. The practical kill criteria are repeated overselling, unreconciled booking states, material
              customer-data incidents, or inability to produce tested recovery and model evaluation evidence.
            claimRefs:
              - CR006
              - CR008
              - CR009
              - CR014
          - type: table
            tableRef: TR002
            claimRefs:
              - CR003
              - CR004
              - CR006
              - CR008
              - CR009
              - CR014
      - number: '7.4'
        title: Dependency mitigation and monitoring
        blocks:
          - type: paragraph
            body: >-
              GetYourGuide's public customer promise includes free cancellation on most activities, pay-later
              availability, and round-the-clock support, while its supplier terms permit refunds, offer removal, payout
              withholding, and termination. These are meaningful mitigation tools, but the assigned evidence does not
              quantify response times, refund completion, false-availability rates, supplier concentration, or
              connectivity availability. Independent affiliate content explicitly notes that experience quality depends
              on local operators and that refund timing and cancellation policies vary. Monitoring should therefore
              combine supplier cancellation and complaint rates, booking-state reconciliation, refund aging,
              verification expiry, security-event severity, and concentration by supplier, connectivity partner,
              destination, and acquisition channel. A sustained breach of service thresholds, an uncontained privacy
              event, or loss of a material distribution or connectivity dependency should trigger a pause and renewed
              underwriting.
            claimRefs:
              - CR003
              - CR004
              - CR006
              - CR011
              - CR012
              - CR013
          - type: table
            tableRef: TR003
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR011
              - CR012
              - CR013
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Thesis-break triggers
            body: >-
              Pause underwriting if verified severe supplier incidents, complaint or cancellation rates,
              booking-reconciliation failures, refund aging, privacy events, or liquidity pressure exceed management
              thresholds without timely remediation and auditable root-cause closure.
            calloutType: risk
            claimRefs:
              - CR004
              - CR006
              - CR007
              - CR009
              - CR015
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Decision and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The appropriate decision is research-more/track, not buy. The strongest retained valuation anchor is a $2
              billion Series F mark from June 2023, and the same financing package included both $85 million of equity
              and a $109 million revolving credit facility. That historical mark establishes what investors once paid,
              not what the business is worth in October 2026. The reviewed pool provides no audited current revenue,
              margin, EBITDA, cash-conversion, or retention metrics and no current liquidation-preference or drawn-debt
              schedule. Entry discipline should therefore require a data-room valuation bridge from the 2023 mark to
              verified current performance, with funding raised kept distinct from cash available.
            claimRefs:
              - CV001
              - CV002
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV014
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV006
              - CV014
              - CV015
              - CV016
      - number: '8.2'
        title: Thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The thesis rests on marketplace scale, a commission-based intermediary model, and continuing product
              investment. GetYourGuide's company-issued April 2026 release claims 50,000 supply partners and 200,000
              experiences, while the terms identify the company as the commercial agent rather than the activity
              provider. That structure can support broad selection, but it also makes supplier execution and marketplace
              controls central to value. The anti-thesis is that the latest profitability statement in the retained
              evidence dates to 2023 and offered no timetable. A retained customer complaint alleges serious safety,
              cancellation, and refund failures; it is anecdotal, not an incidence measure, but aligns with the
              operator-dependency caveat identified by an affiliate review and the allocation of supplier responsibility
              in the terms.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV009
              - CV010
              - CV011
              - CV012
      - number: '8.3'
        title: Scenarios, comparables, and exit readiness
        blocks:
          - type: paragraph
            body: >-
              Multiples lists selected travel-company revenue multiples from 1.2x to 4.2x, but those references span
              different business mixes and cannot be applied responsibly without a verified GetYourGuide revenue
              denominator, margin profile, and growth period. The bull, base, and bear cases are therefore conditional
              decision boundaries rather than point estimates or fabricated probability weights. A premium to the 2023
              mark would require audited growth, contribution margin, cash conversion, and retention that support a
              defensible comparable set. The base case holds the price judgment open pending those data. The bear case
              requires a material discount if supplier-quality failures, weak cash conversion, or financing preferences
              impair equity value.
            claimRefs:
              - CV001
              - CV009
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV009
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: Final diligence asks and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              No supportable target return, hold period, or exit value can be set from the assigned public evidence.
              Before investment, obtain audited monthly revenue and gross-booking value bridges, take rate, gross and
              contribution margins, cohort retention, cash conversion, debt utilization, the fully diluted cap table,
              and every preference or conversion term. Reconcile the conflicting public totals for funding rounds rather
              than treating either aggregate as liquidity. Thesis-break triggers should include deterioration in repeat
              demand, persistent supplier-quality failures, negative contribution margin after acquisition costs,
              covenant pressure, or preference-adjusted proceeds below the required return. Exit readiness also requires
              evidence of a clean equity waterfall and a credible path to audited public-company reporting.
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV011
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price is the gating variable
            body: >-
              The company may have attractive scale, but public evidence cannot support a buy call without current
              audited economics, financing terms, and preference-adjusted returns.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV014
              - CV015
              - CV016
