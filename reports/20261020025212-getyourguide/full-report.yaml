      - number: '1.3'
        title: Capital history and emerging profitability
        blocks:
          - type: paragraph
            body: >-
              Public evidence shows a long capital-intensive scaling path. TechCrunch reported a $75 million Series D in
              2017, led by Battery Ventures, that brought cumulative funding at that point to about $170 million. A
              later aggregator reports a $194 million Series F at a $2 billion valuation in June 2023 and $868 million
              raised across four rounds, but those totals are not verified here against primary financing documents. In
              October 2025, the company said it had been profitable on an adjusted EBITDA basis for the prior year and
              that trailing revenue was approaching EUR 1 billion. Independent reporting in 2026 described the turn to
              profitability after roughly EUR 500 million of cumulative losses, underscoring both scale and the
              historical cost of reaching it.
