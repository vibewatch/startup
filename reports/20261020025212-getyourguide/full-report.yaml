      - number: '1.2'
        title: Founders, leadership, and governance visibility
        blocks:
          - type: paragraph
            body: >-
              The company says Johannes Reck, Tao Tao, Martin Sieber, and Tobias Rein founded GetYourGuide in 2009 after
              a travel-planning problem in Beijing. Current third-party evidence identifies Reck as chief executive, and
              company communications continue to center major operating updates on him. The assigned evidence does not
              establish the current executive roles of the other founders, the full leadership team, board composition,
              voting control, or succession arrangements. That asymmetry creates potential key-person dependence around
              Reck while leaving the actual control structure unverified. Diligence should therefore distinguish visible
              founder leadership from proven governance resilience and obtain a current organization chart, board
              roster, reserved-matters schedule, and succession plan.
