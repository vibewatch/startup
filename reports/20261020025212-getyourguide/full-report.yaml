  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The investable boundary is the transaction layer for discovering and booking tours, attraction tickets,
              day trips, transfers, and other in-destination experiences. GetYourGuide's own storefront shows this
              breadth, while independent descriptions characterize the model as a marketplace rather than a tour
              operator. Core airfare, lodging, and general destination spending therefore sit outside the boundary
              unless attached to an experience transaction. The relevant status quo is not only another online
              marketplace: direct operator booking, hotel concierges, brochures, on-site sales, and self-planned
              activities can all bypass the platform. This boundary matters because a broad travel-spend estimate would
              overstate addressability, whereas an experiences-only boundary captures the spend on which GetYourGuide
              can plausibly earn a commission.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM011
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM011
      - number: '2.2'
        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              Available sizing is directional rather than underwriting-grade. A syndicated company release places the
              global experiences market near EUR 420 billion and projects 9% annual growth for 2025-2030, while a 2023
              company survey release used a USD 375 billion end-2024 projection. Those figures differ in currency,
              vintage, and company-defined methodology and should not be blended into a single TAM. Platform-scale
              claims provide a narrower operating lens: more than EUR 4 billion of fiscal-2025 GMV from more than 33
              million booked experiences, supported by 50,000 supply partners and more than 200,000 experiences. These
              figures suggest meaningful penetration of a fragmented category, but they do not identify a
              geography-adjusted SAM or a realistically obtainable SOM. Skift's observation that category financial
              disclosure remains sparse reinforces the need for primary market data before assigning a market-share
              premium.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
