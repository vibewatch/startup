artifact: competitors
slug: getyourguide
runDate: 2026-10-20
company:
  name: GetYourGuide
chapter:
  number: 3
  title: Competitors
  summary: >-
    GetYourGuide competes in a fragmented tours-and-activities market where Viator has a
    Tripadvisor-backed distribution advantage, regional specialists differentiate by geography or
    language, and suppliers can multi-home or sell direct. Its strongest defensibility appears to
    be distribution, reviews, booking convenience, and supplier tooling rather than exclusive
    inventory, leaving commission pressure and inconsistent operator execution as material risks.
sections:
  - id: competitive-landscape
    title: A broad landscape with no single winner
    body: >-
      The relevant competitive set extends beyond another tours marketplace. Viator is the closest
      global OTA peer and benefits from Tripadvisor's travel-planning funnel; Klook is a mobile-first
      Asian challenger; Civitatis emphasizes Spanish-language discovery; and narrower marketplaces
      compete through regional focus or lower intermediation. Tripadvisor, Airbnb, Groupon, Peek,
      Thrillophilia, and other discovery surfaces are adjacent entrants because they can redirect
      existing audiences toward activities. The durable status quo is also formidable: travelers
      still discover and buy through local operators, hotel concierges, guidebooks, walk-up kiosks,
      and operator-owned websites. Tracxn ranks GetYourGuide first within its own 194-company peer
      taxonomy, but that ranking is not market share and should not be read as proof of dominance.
    claimRefs: [CP003, CP004, CP005, CP008, CP012]
    tableRefs: [TP001]
  - id: capability-and-distribution
    title: Convenience and distribution are the main battlegrounds
    body: >-
      GetYourGuide's consumer proposition combines broad activity discovery with reviews, mobile
      booking, free cancellation on most activities, pay-later availability, and round-the-clock
      support. Those features reduce transaction friction, but they are not unique: Viator offers a
      similar marketplace and draws demand from Tripadvisor, while many operators list on both
      platforms. Multi-homing limits hard supplier lock-in and gives travelers overlapping
      inventory. GetYourGuide is trying to sharpen merchandising around distinctive experiences;
      its own 2026 trend content says workshop bookings rose 58% year over year. That signal supports
      a curation strategy, but it is company-issued demand evidence rather than an independent
      benchmark of superior conversion or retention.
    claimRefs: [CP001, CP002, CP006, CP007, CP011]
    tableRefs: [TP002]
  - id: pricing-and-supplier-power
    title: Commission economics invite direct and low-fee substitutes
    body: >-
      Public sources do not disclose a current standardized GetYourGuide rate card. Two non-company
      sources describe marketplace commissions around 20% to 30%, while a competing marketplace
      claims direct booking can be 15% to 25% cheaper. These figures are directional rather than
      audited: rates may vary by operator, product, geography, and negotiated terms, and the cheaper
      claim comes from a competitor promoting its own subscription model. Even so, the mechanism is
      clear. Suppliers can trade commission for global demand, support, and booking infrastructure,
      or invest in direct acquisition and retain more economics. Because operators can multi-home,
      distribution power depends on sustained demand generation rather than contractual exclusivity
      demonstrated in the available evidence.
    claimRefs: [CP007, CP009, CP010, CP015]
    tableRefs: [TP003]
  - id: moat-and-displacement-risk
    title: The moat is a reinforcing network, not proven lock-in
    body: >-
      GetYourGuide's defensibility is best understood as a reinforcing distribution and trust loop:
      broad supply attracts travelers, reviews and support reduce booking risk, and demand gives
      suppliers a reason to maintain inventory and modern booking workflows. The evidence does not
      establish exclusive supply, proprietary inventory, or high switching costs. A detailed user
      complaint also illustrates the downside of delegated fulfillment: supplier conduct,
      cancellation handling, and refunds can damage the marketplace brand even when the underlying
      tour is delivered by a third party. An affiliate review likewise identifies operator-dependent
      quality and variable refund timing. Viator's Tripadvisor funnel, direct booking, regional
      specialists, and low-fee models can therefore weaken take rates or raise acquisition costs
      without having to duplicate GetYourGuide's entire product.
    claimRefs: [CP013, CP014, CP016]
    figureRefs: [FP001]
