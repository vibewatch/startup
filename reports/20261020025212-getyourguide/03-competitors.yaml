      - [FindToursIn, "Flat supplier subscription", "Claims no booking fee and no commission", "Direct operator contact and regional curation", "Low-fee entrants can pressure commissions in covered markets"]
      - [Direct operator website, "Operator-owned acquisition and checkout", "Competitor claims 15%-25% lower prices for the same tour; not independently verified", "Direct relationship and operator-controlled packaging", "Lower intermediation trades off against OTA reach and support"]
      - [Walk-up / concierge / local channel, "Varies by local intermediary or operator", "Unknown", "In-destination discovery and local context", "Offline fragmentation remains a substitute and limits total OTA penetration"]
    notes: >-
      Directional public comparison, not a rate card: commission and savings ranges are publisher
      claims, may vary by contract and market, and no realized GetYourGuide pricing data was available.
    claimRefs: [CP008, CP009, CP010, CP015]
figures:
  - id: FP001
    title: Competitive positioning by reach and managed booking layer
    type: quadrant
    summary: >-
      Evidence-backed ordinal placement shows GetYourGuide and Viator as global full-service OTAs,
      with regional specialists and direct suppliers occupying distinct positions.
    data:
      xAxis:
        label: "Geographic reach (1=local, 5=global)"
        min: 1
        max: 5
      yAxis:
        label: "Managed booking layer (1=direct/light, 5=full OTA)"
        min: 1
        max: 5
      points:
        - label: GetYourGuide
          x: 5
          y: 5
          detail: "Global marketplace with booking, reviews, cancellation options, and support."
        - label: Viator / Tripadvisor
          x: 5
          y: 5
          detail: "Global OTA with Tripadvisor distribution and review integration."
        - label: Klook
          x: 4
          y: 5
          detail: "Mobile-first OTA with reported Asia strength; current scale is not quantified here."
        - label: Civitatis
          x: 4
          y: 4
          detail: "Global inventory with Spanish-language concentration in Europe and Latin America."
        - label: FindToursIn
          x: 2
          y: 2
          detail: "Regional marketplace emphasizing direct contact and a subscription model."
        - label: Direct / local supplier
          x: 1
          y: 1
          detail: "Owned inventory and customer relationship without a global OTA layer."
    approximationNotes: >-
      Ordinal analyst scores, not measured market shares: positions translate stated geography and
      service model from the assigned sources; coincident GetYourGuide and Viator coordinates are
      intentional and do not imply equal scale.
    claimRefs: [CP005, CP006, CP010, CP012, CP016]
callouts:
  - calloutType: risk
    title: Marketplace trust inherits supplier execution risk
    body: >-
      One historical complaint describes weak pre-booking safety reassurance, a later operator
      cancellation, and difficulty obtaining a refund. It is anecdotal rather than an incidence
      rate, but it demonstrates how third-party fulfillment can transmit operational failures to the
      platform brand.
    claimRefs: [CP013, CP014]
