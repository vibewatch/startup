companyProfile:
  summary: >-
    GetYourGuide is a founder-led, two-sided marketplace for tours, attraction tickets, activities, and related
    in-destination experiences. It aggregates inventory from local operators, acquires traveler demand through its
    marketplace and distribution relationships, and earns commission on successful bookings. Public evidence indicates
    substantial catalog and transaction scale, while supplier delivery, current unit economics, governance, and capital
    structure remain incompletely disclosed.
