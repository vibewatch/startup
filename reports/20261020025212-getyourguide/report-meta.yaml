  topStrengths:
    - Large company-reported catalog and cumulative transaction footprint across a broad global marketplace.
    - Transaction-linked commission model with no stated upfront supplier listing fee.
    - Company-reported adjusted-EBITDA profitability and revenue approaching EUR 1 billion.
    - Continued investment in traveler discovery, reviews, operator tools, and connectivity.
  topRisks:
    - Current audited revenue quality, margins, cash conversion, retention, and acquisition economics are unavailable.
    - Supplier-controlled fulfillment creates safety, quality, availability, cancellation, and refund exposure.
    - >-
      The current debt balance, liquidation preferences, ownership, covenants, and preference-adjusted equity value are
      undisclosed.
    - >-
      Suppliers can multi-home or sell direct, while exclusive supply and durable contractual lock-in are not
      established.
  unresolvedGaps:
    - >-
      Obtain audited revenue, GMV, realized take rate, gross and contribution margins, cohort retention, CAC, and cash
      conversion through September 2026.
    - >-
      Reconcile the fully diluted cap table, liquidation preferences, drawn revolving-credit balance, debt covenants,
      and conversion terms.
    - >-
      Quantify unique and repeat travelers, active suppliers, concentration, cancellations, refunds, chargebacks,
      complaints, and severe incidents by cohort.
    - >-
      Verify the current executive and board roster, voting control, succession plan, litigation, regulatory matters,
      and control-testing results.
