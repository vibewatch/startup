            title: 市场平台的信任会继承供应商执行风险
            body: 一则历史投诉称预订前安全保障不足，之后运营商取消行程且退款困难。这是轶事而非发生率，但说明第三方履约如何将运营失败传导给平台品牌。
            calloutType: risk
            claimRefs:
