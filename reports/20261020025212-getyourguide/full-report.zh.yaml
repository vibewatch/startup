              - CR016
      - number: '7.5'
        title: 展示项
        blocks:
          - type: callout
            title: 投资论点失效触发条件
            body: 如果经核实的严重供应商事件、投诉或取消率、预订对账失败、退款账龄、隐私事件或流动性压力超过管理层阈值，且未及时补救并完成可审计的根因关闭，应暂停投资判断。
            calloutType: risk
            claimRefs:
              - CR004
