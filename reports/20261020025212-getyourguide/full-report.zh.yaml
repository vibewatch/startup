            body: >-
              公开模式将自有网站和应用需求，与联盟、API 及更广泛的分销关系结合。AskCyborg 识别出直接、联盟和 API 渠道，但明确称其工作由 AI 生成且未经独立核验；另一篇由联盟支持的文章称分销伙伴超过
              1,000
              家。这些信号说明获客入口广泛，不代表获客经济高效。公司材料称佣金用于平台管理、工具、供应商洞察和促销，消费者网站则宣传支持和灵活预订功能。供应商结算可按月且不额外收费，也可加收费用后每月两次；已履约预订按扣除佣金后的净额支付。这一节奏说明存在可观察的结算机制，但公开来源没有量化支付准备金、退款浮存金、营销强度、支持成本或毛利贡献。
