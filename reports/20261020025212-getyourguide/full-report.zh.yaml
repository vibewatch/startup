  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与定价透明度
        blocks:
          - type: paragraph
            body: >-
              GetYourGuide 的供应商材料将其描述为市场平台，而非持有库存的旅行团运营商。供应商可以在没有预付平台费的情况下添加和维护活动，GetYourGuide
              只在预订成功时收取佣金。确切费率没有公开统一标准：公司称费率按国家变化，并在注册后披露。一篇由联盟支持的行业文章估计典型预订佣金为
              20%—30%，但该区间不是公司费率，不应视为实际收取率。面向客户的页面展示活动级“起价”和折扣，但证据没有披露收入构成、收入抵销处理、退款会计，或非佣金收入是否重要。
