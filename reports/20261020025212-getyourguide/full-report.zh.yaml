          detail: GetYourGuide 自有队列和平台证据。
          tone: positive
          claimRefs:
            - CM013
    approximationNotes: 层宽只表示作者设定的顺序，不代表比例价值或漏斗转化；单位和期间各不相同，不得合并。
    claimRefs:
      - CM004
      - CM005
      - CM008
      - CM009
      - CM010
      - CM013
  - id: FP001
    title: 按覆盖范围与托管预订层划分的竞争定位
    type: quadrant
    summary: 有证据支撑的序数定位显示，GetYourGuide 和 Viator 是全球全服务 OTA；区域专业平台和直接供应商各处于不同位置。
    data:
      xAxis:
        label: 地理覆盖范围（1=本地，5=全球）
        min: 1
        max: 5
      yAxis:
        label: 托管预订层（1=直接 / 轻量，5=全服务 OTA）
        min: 1
        max: 5
      points:
        - label: GetYourGuide
          x: 5
          'y': 5
          detail: 提供预订、评论、取消选项和客服的全球平台。
        - label: Viator / Tripadvisor
          x: 5
          'y': 5
          detail: 通过 Tripadvisor 分发并整合评论的全球 OTA。
        - label: Klook
          x: 4
          'y': 5
          detail: 移动端优先的 OTA，据报在亚洲较强；此处未量化当前规模。
        - label: Civitatis
          x: 4
          'y': 4
          detail: 全球库存，且在欧洲和拉丁美洲以西班牙语供给为主。
        - label: FindToursIn
          x: 2
          'y': 2
          detail: 强调直接联系和订阅模式的区域平台。
        - label: 直接 / 本地供应商
          x: 1
          'y': 1
          detail: 自有库存和客户关系，不经过全球 OTA 层。
    approximationNotes: 这是分析师序数评分，不是测量得到的市场份额：位置将指定来源所述的地理范围和服务模式转化为坐标；GetYourGuide 与 Viator 坐标重合是有意设置，不代表规模相同。
    claimRefs:
      - CP005
      - CP006
      - CP010
      - CP012
      - CP016
  - id: FI001
    title: 从交易到服务的经济流
    type: flow
    summary: 公开证据支持预订和结算机制，但无法说明扣除获客、客服、退款和平台成本后保留的利润率。
    data:
      nodes:
        - id: traveler-demand
          label: 旅行者需求
          detail: 直接、联盟、API 和分销渠道将旅行者带到具体活动的报价页。
        - id: booking-value
          label: 完成预订的价值
          detail: 旅行者支付的价格因活动而异，可能包含页面显示的折扣。
        - id: platform-commission
          label: 平台佣金
          detail: 公司确认成功预订会收取佣金；具体费率因情况而异，供应商注册后才会披露。
        - id: supplier-settlement
          label: 供应商结算
          detail: 已履约预订按月或半月付款，扣除佣金后结算。
        - id: service-costs
          label: 平台与服务成本
          detail: 技术、推广、客服、支付运营、退款和渠道获客会消耗佣金收入。
        - id: contribution-cash
          label: 贡献与现金生成
          detail: 未公开披露；需要经审计的利润率和现金转化证据。
      edges:
        - from: traveler-demand
          to: booking-value
          label: 转化为预订
        - from: booking-value
          to: platform-commission
          label: 扣除佣金
        - from: platform-commission
          to: supplier-settlement
          label: 供应商收到净额
        - from: platform-commission
          to: service-costs
          label: 支撑平台交付
        - from: service-costs
          to: contribution-cash
          label: 剩余部分未披露
    approximationNotes: 20%-30% 的佣金区间是第三方估算，特意未放入流图数值；不代表存在累计桥接或利润金额。
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI006
      - CI007
      - CI008
      - CI009
      - CI011
      - CI015
  - id: FE001
    title: 有公开证据支持的产品架构图
    type: stack
    summary: 该堆栈追踪从旅行者发现到供应商运营及连接的预订系统这一外部可见路径。
    data:
      layers:
        - label: 旅行者发现
          detail: 目的地、景点、活动、评论、价格和可用性界面
          items:
            - 搜索与商品运营
        - label: 预订与信任
          detail: 结账、支付选项、确认、取消信息和客服
          items:
            - 评论与预订条件
        - label: 平台协调
          detail: 将旅行者需求匹配到运营商提供的体验和条款
          items:
            - 交易交接
        - label: 供应商运营
          detail: 商户入驻、内容、日程、容量、定价和绩效工具
          items:
            - 门户与增长工具
        - label: 连接边界
          detail: 合作伙伴集成交换可用性、价格、预订和取消信息
          items:
            - 合作伙伴 API 同步
        - label: 外部履约
          detail: 本地运营商和预订系统交付并管理体验
          items:
            - 运营商交付
    approximationNotes: 仅为概念顺序；不推断内部服务、基础设施拓扑、数据流或性能特征。
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
      - CE005
      - CE006
      - CE007
      - CE008
      - CE014
  - id: FU001
    title: 客户发现、履约与扩张闭环
    type: journey-map
    summary: 平台覆盖带动商品选择、运营商履约、评论形成和数据驱动的商品改进，但公开证据没有量化这一闭环中的留存。
    data:
      items:
        - label: 旅行者发现
          detail: 旅行者通过直接渠道和分发界面进入。
          touchpoints:
            - 平台
            - 分销合作伙伴
            - 创作者
        - label: 搜索与比较
          detail: 商品页展示活动详情、价格、评分和可用性。
          touchpoints:
            - 目的地页面
            - 活动卡片
            - 评论
        - label: 预订
          detail: 旅行者通过平台预订运营商提供的体验。
          touchpoints:
            - 结账
            - 支付方式
            - 确认
        - label: 本地履约
          detail: 供应商交付体验，产生取决于运营商的质量风险。
          touchpoints:
            - 集合点
            - 旅游或景点
            - 客服
        - label: 评论与信任
          detail: 旅行者反馈和 Creator Reviews 可以增加社会证明。
          touchpoints:
            - 旅行者评论
            - Creator Reviews 测试版
            - 供应商评分
        - label: 绩效反馈
          detail: 运营商可以看到商品漏斗表现，并收到定制建议。
          touchpoints:
            - 浏览量
            - 预订
            - 建议操作
        - label: 商品页改进
          detail: 运营商调整内容、可用性和服务，以争取更高曝光。
          touchpoints:
            - 商品页质量
            - 可用性
            - 响应质量
    approximationNotes: 该序列是有证据支持的运营模型，不是测量得到的转化漏斗；不推断任何阶段转化率或留存率。
    claimRefs:
      - CU006
      - CU010
      - CU016
  - id: FR001
    title: 剩余风险热力图
    type: matrix
    summary: 供应商合规、服务执行和连接的剩余影响最高，因为控制措施已有文档记录，但当前结果证据不完整。
    data:
      columns:
        - label: 可能性
          detail: 基于已记录故障机制的定性评估
        - label: 影响
          detail: 对客户、运营或投资论点的潜在影响
        - label: 缓解措施成熟度
          detail: 指定证据中可见控制措施的强度
      rows:
        - label: 供应商合规与安全
          note: 已有验证和执行机制；事故结果未披露。
          values:
            - label: 中
            - label: 高
            - label: 中
        - label: 可用性与服务质量
          note: 供应商绩效和商品页准确性仍分散在各方。
          values:
            - label: 中
            - label: 高
            - label: 中
        - label: 连接与预订完整性
          note: 已有配置指引；可靠性比率不可得。
          values:
            - label: 中
            - label: 高
            - label: 低-中
        - label: 数据与智能体系统控制
          note: 可观测性、评估和护栏是当前积极推进的工程重点。
          values:
            - label: 中
            - label: 高
            - label: 中
        - label: 支付、欺诈与拒付
          note: 合同中已有责任分配，但损失和集中度数据不可得。
          values:
            - label: 中
            - label: 中
            - label: 中
        - label: 融资与流动性不透明
          note: 2023 年融资信息未披露当前现金、已提款债务或现金续航期。
          values:
            - label: 中
            - label: 高
            - label: 低
    approximationNotes: 定性分类是分析判断，不是测量得到的概率；开展尽调时，应以事件、集中度和财务数据替换这些分类。
    claimRefs:
      - CR001
      - CR005
      - CR006
      - CR009
      - CR014
      - CR015
      - CR016
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 从历史融资锚点出发、以数据门槛约束建议的顺序化证据链。
    data:
      nodes:
        - id: price-anchor
          label: 2023 年 6 月价格锚点
          detail: $2B Series F 轮估值
        - id: financing-reconciliation
          label: 融资记录需要核对
          detail: 公共聚合平台对累计融资额和轮次存在分歧
        - id: current-scale
          label: 公司当前规模口径
          detail: 50,000 家供应合作伙伴和 200,000 个体验项目
        - id: economics-gap
          label: 经济性缺口
          detail: 留存资料中没有经审计的当前收入、利润率、现金转化或留存数据
        - id: capital-gap
          label: 资本结构缺口
          detail: 没有当前债务提款额、股权结构表或优先权安排表
        - id: recommendation
          label: 继续研究 / 跟踪
          detail: 风险高；在数据室证据到位前，估值无法确定
    approximationNotes: 该流程只展示决策顺序，不是定量估值桥接或概率模型。
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV006
      - CV014
      - CV015
      - CV016
