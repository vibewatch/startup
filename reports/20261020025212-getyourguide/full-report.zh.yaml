            body: >-
              里程碑覆盖 2009 年成立、2017 年和 2023 年主要风险融资，以及 2025 年盈利公告。公司还报告 2025 年第三季度 GMV 同比增长 30%、预订体验达 1,000 万项；一家当前聚合网站称截至
              2025 年 12 月有 1,344
              名员工。这些信息可用于判断方向，但混合了公司发布、媒体报道和聚合数据，定义与可信度不同。一则客户投诉描述了取消和退款困难，说明市场平台存在执行风险，但不能证明发生率或趋势。投资尽调应优先取得经审计财务报表、收取率和复购分组、供应商集中度、投诉发生率，以及完全摊薄股权结构表，再判断标题式规模是否足以代表完整的运营或估值情况。
