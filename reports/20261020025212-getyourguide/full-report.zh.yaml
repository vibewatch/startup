  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 决策与入场纪律
        blocks:
          - type: paragraph
            body: >-
              合适的决策是继续研究并跟踪，而不是买入。最强的留存估值锚点是 2023 年 6 月 20 亿美元的 Series F 估值；同一融资方案还包括 8,500 万美元股权和 1.09
              亿美元循环信贷额度。该历史估值说明投资者曾经支付过什么，而不是公司在 2026 年 10
              月值多少。审阅材料没有经审计的当前收入、利润率、EBITDA、现金转换或留存指标，也没有当前清算优先权或已提款债务表。因此，入场纪律应要求数据室提供从 2023
              年估值到经验证当前表现的估值桥，并将筹得资金与可用现金区分开。
            claimRefs:
              - CV001
              - CV002
              - CV014
              - CV015
              - CV016
