      - number: '8.2'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              投资论点建立在市场平台规模、佣金中介模式和持续产品投入之上。GetYourGuide 2026 年 4 月公司发布稿称拥有 50,000 家供应伙伴和 200,000
              项体验，而条款将公司定义为商业代理而非活动提供商。这种结构可以支持广泛选择，但也使供应商执行和市场控制成为价值核心。反论点是，留存证据中的最新盈利表述可追溯至 2023
              年，且没有给出时间表。一则留存客户投诉声称发生严重的安全、取消和退款失败；这只是轶事，不是发生率，但与联盟评论指出的运营商依赖，以及条款中对供应商责任的分配相一致。
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV009
              - CV010
              - CV011
              - CV012
      - number: '8.3'
        title: 情景、可比公司与退出准备
        blocks:
          - type: paragraph
            body: >-
              倍数清单选取的旅行公司收入倍数介于 1.2x 和 4.2x 之间，但这些参考对象业务组合不同；在没有经验证的 GetYourGuide
              收入分母、利润率和增长期之前，不能负责任地套用。因而，乐观、基准和悲观情景是有条件的决策边界，而非点估计或人为编造的概率权重。若要在 2023
              年估值之上给出溢价，需要经审计的增长、贡献毛利、现金转换和留存来支撑可辩护的可比公司集合。基准情景在取得这些数据前暂不确定价格判断；若供应商质量失败、现金转换疲弱或融资优先权损害股权价值，悲观情景要求显著折价。
            claimRefs:
              - CV001
              - CV009
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV009
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: 最终尽调要求与投资论点失效触发条件
        blocks:
          - type: paragraph
            body: >-
              仅凭指定公开证据，无法设定可支持的目标回报、持有期或退出价值。投资前应取得经审计的月度收入和总预订额桥接、收取率、毛利和贡献毛利、分组留存、现金转换、债务使用、完全摊薄股权结构表，以及每一项优先权或转换条款。应调和公开融资轮次总额冲突，不要把任一累计数视为流动性。投资论点失效触发条件应包括复购需求恶化、供应商质量问题持续、获客成本后贡献毛利为负、契约压力，或按优先权调整后的收益低于所需回报。退出准备还需要清晰的股权瀑布表，以及走向经审计公众公司报告的可信路径。
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV011
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 价格是闸门变量
            body: 公司可能拥有吸引人的规模，但在缺少当前经审计经济数据、融资条款和按优先权调整后的回报前，公开证据不足以支持买入判断。
