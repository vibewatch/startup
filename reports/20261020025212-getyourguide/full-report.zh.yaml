              - CM009
              - CM010
              - CM013
      - number: '2.3'
        title: 买方、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              需求侧的旅行者既是用户也是付款方；本地运营商、景点和活动提供商提供库存，并通过交易佣金实质购买全球分销。采用通常始于旅行者需要比较陌生的本地选择，随后取决于可见的库存、评价、移动端履约、取消条款和可信支付。GetYourGuide
              基于六国超过 6,000 名旅行者开展的 2023 年自有研究称，2022 至 2023 年移动预订增长 142%，并称其选定的“Modern
              Explorer”群体比起价格更看重灵活的线上预订。当前优惠券列表显示价格促销仍参与获客，但无法说明日常实际价格或市场平台收取率。因此，证据支持数字化和便利性是采用驱动因素，但不能证明公司拥有持久定价权。
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.4'
        title: 约束、时点与尽调含义
        blocks:
          - type: paragraph
            body: >-
              市场的分散既是机会也是约束。整合小型运营商可以改善选择和发现，但服务履约仍掌握在第三方手中。投诉页面有关于未出现、取消、无效票和退款延迟的个别报告；由于没有披露预订量分母，这些观察只说明失败模式，不说明发生频率。移动便利性和灵活政策可能推动采用加速，但信任、供应商质量、退款执行和监管差异会拖慢转化或复购。估值应依赖经验证的留存分组、收取率、贡献毛利、供应商集中度和投诉发生率，而不是直接把广义市场增长率套到
              GetYourGuide。独立的区域市场规模和标准化服务质量数据，是两项重大证据缺口。
            claimRefs:
              - CM007
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 大类市场规模不等于可投资 SOM
            body: 留存来源都没有单独识别 GetYourGuide 能服务的、可数字化预订的区域消费，也没有识别在直接预订和其他市场平台替代方案之后公司可获得的份额。广义估算只能作为方向性背景。
            calloutType: risk
            claimRefs:
              - CM004
              - CM006
              - CM007
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 广阔市场格局，没有单一赢家
        blocks:
          - type: paragraph
            body: >-
              相关竞争集合不止另一家旅行团市场。Viator 是最接近的全球 OTA 同业，受益于 Tripadvisor 的旅行规划漏斗；Klook 是移动优先的亚洲挑战者；Civitatis
              侧重西班牙语发现；更窄的市场则靠区域专注或更低中介费竞争。Tripadvisor、Airbnb、Groupon、Peek、Thrillophilia
              和其他发现入口也属于相邻进入者，因为它们可以把既有受众导向活动。真正强大的既有方式仍然存在：旅行者继续通过本地运营商、酒店礼宾、指南、现场售票亭和运营商自有网站发现并购买。Tracxn 在其 194
              家公司同业分类中将 GetYourGuide 排名第一，但这不是市场份额，不能解读为主导地位。
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP008
              - CP012
          - type: table
            tableRef: TP001
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP006
              - CP008
              - CP010
              - CP012
      - number: '3.2'
        title: 便利性与分销是主要战场
        blocks:
          - type: paragraph
            body: >-
              GetYourGuide 的消费者价值主张结合了广泛的活动发现、评价、移动预订、大多数活动免费取消、延后付款和全天候支持。这些功能减少交易摩擦，但并不独特：Viator 提供类似市场，并从 Tripadvisor
              获取需求；许多运营商也同时在两个平台上架。多平台经营限制了供应商锁定，也让旅行者拥有重叠库存。GetYourGuide 正围绕独特体验强化选品；其 2026 年自有趋势内容称工作坊预订同比增长
              58%。这一信号支持策展策略，但属于公司发布的需求证据，不是转化率或留存优于同业的独立基准。
            claimRefs:
              - CP001
              - CP002
              - CP006
              - CP007
              - CP011
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP006
              - CP007
              - CP011
              - CP012
              - CP015
      - number: '3.3'
        title: 佣金经济学为直订和低费替代留下空间
        blocks:
          - type: paragraph
            body: >-
              公开来源没有披露 GetYourGuide 当前统一费率表。两个非公司来源称市场佣金约为 20%—30%，而一家竞争平台称直接预订可便宜
              15%—25%。这些数字只是方向性信息，未经审计：费率可能因运营商、产品、地域和谈判条款而变，较低价格的说法来自推广自身订阅模式的竞争者。即便如此，机制很清楚：供应商可以用佣金换取全球需求、支持和预订基础设施，也可以投入直接获客并保留更多经济利益。由于运营商可以多平台经营，分销能力取决于持续产生需求，而非现有证据已证明的合同排他性。
            claimRefs:
              - CP007
              - CP009
              - CP010
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP008
              - CP009
              - CP010
              - CP015
      - number: '3.4'
        title: 护城河是强化型网络，而非已证实的锁定
        blocks:
          - type: paragraph
            body: >-
              GetYourGuide
              的防御力最好理解为分销和信任的强化循环：丰富供给吸引旅行者，评价和支持降低预订风险，需求又促使供应商维护库存并采用现代预订流程。证据没有证明独家供给、专有库存或高转换成本。一则详细用户投诉也说明委托履约的下行风险：即使旅行团由第三方实际提供，供应商行为、取消处理和退款也可能损害平台品牌。一篇联盟评论同样指出质量依赖运营商、退款时长存在差异。因此，Viator
              的 Tripadvisor 漏斗、直接预订、区域专业平台和低费模式，都可能压低收取率或推高获客成本，而不必复制 GetYourGuide 的全部产品。
            claimRefs:
              - CP013
              - CP014
              - CP016
          - type: figure
            figureRef: FP001
