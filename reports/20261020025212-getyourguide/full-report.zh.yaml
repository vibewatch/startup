      - number: '1.2'
        title: 创始人、领导层与治理透明度
        blocks:
          - type: paragraph
            body: >-
              公司称 Johannes Reck、Tao Tao、Martin Sieber 和 Tobias Rein 于 2009 年在北京因一次旅行规划难题共同创办 GetYourGuide。当前第三方证据确认 Reck
              是 CEO，公司沟通也持续由他主导重大运营更新。现有证据无法确认其他创始人的当前高管职务、完整领导团队、董事会构成、投票控制权或继任安排。这种不对称可能意味着公司对 Reck
              存在关键人物依赖，但实际控制结构仍未验证。因此，尽调应区分可见的创始人领导力与已证明的治理韧性，并取得当前组织架构、董事会名单、保留事项清单和继任计划。
            claimRefs:
              - CO002
              - CO003
          - type: table
            tableRef: TO002
            claimRefs:
              - CO002
              - CO003
              - CO007
      - number: '1.3'
        title: 资本历史与盈利能力初现
        blocks:
          - type: paragraph
            body: >-
              公开证据显示公司经历了长期、资本密集型的扩张。TechCrunch 报道其 2017 年完成由 Battery Ventures 领投的 $75 million Series D，当时累计融资约 $170
              million。随后一家聚合网站称公司于 2023 年 6 月以 $2 billion 估值完成 $194 million Series F，并在四轮融资中累计筹得 $868
              million；但本报告未用主要融资文件核验这些数字。2025 年 10 月，公司称此前一年按调整后 EBITDA 口径实现盈利，过去 12 个月收入接近 EUR 1 billion。2026
              年独立报道则称公司在累计亏损约 EUR 500 million 后转为盈利，既凸显规模，也说明达到这一规模的历史成本。
