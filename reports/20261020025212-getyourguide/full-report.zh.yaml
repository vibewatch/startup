      - number: '7.2'
        title: 法律、监管与财务责任分配
        blocks:
          - type: paragraph
            body: >-
              2026 年 10 月供应商条款将 GetYourGuide
              定义为商业代理，而客户直接向供应商购买服务。该结构缩小了直接运营责任，但不能消除平台面对消费者不满、监管审查、支付争议或声誉损害的风险敞口。供应商必须完成核验并维护许可证、保险和税务信息；GetYourGuide
              可以拒绝或下架不合规商品并发放退款。拒付条款也使供应商收款取决于客户是否成功付款。另据 2023 年融资公告，融资包括 8,500 万美元股权和 1.09
              亿美元循环信贷额度；这是历史融资额，不是当前现金、当前已提款债务或跑道的证据。因此，投资批准应要求当前诉讼和监管机构搜索、保险控制测试以及债务使用明细，而不是从已宣布融资推断当前流动性。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR015
