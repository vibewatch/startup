  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              可投资边界是发现并预订旅行团、景点门票、一日游、接送及其他目的地体验的交易层。GetYourGuide
              自有商店展示了这一宽度，而独立描述将其定位为市场平台而非旅行团运营商。因此，核心机票、住宿和一般目的地消费不在边界内，除非它们附着于体验交易。真正的既有替代不只是另一家线上市场：直接向运营商预订、酒店礼宾、宣传册、现场销售和自行规划活动都可能绕开平台。这个边界很重要：过宽的旅行消费估算会高估可触达市场，而只包含体验的边界则更接近
              GetYourGuide 有可能赚取佣金的消费。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM011
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM011
      - number: '2.2'
        title: 受证据约束的市场规模
        blocks:
          - type: paragraph
            body: >-
              现有市场规模只能作为方向性参考，尚不足以支持投资判断。一份联合发布的公司稿件称全球体验市场接近 EUR 420 billion，并预计 2025—2030 年年增长 9%；公司 2023 年调查稿件则采用
              2024 年末 USD 375 billion 的预测。两组数据在货币、时点和公司自定义方法上都不同，不应合并为单一 TAM。平台规模提供了更窄的运营视角：2025 财年 GMV 超过 EUR 4
              billion、预订体验超过 33 million 项，并有 50,000 个供应伙伴和超过 200,000 项体验。这些数据说明公司已切入高度分散的品类，但无法给出按地域调整的 SAM 或现实可获得的
              SOM。Skift 指出该品类财务披露仍很少，更说明在赋予市场份额溢价前需要一手市场数据。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
