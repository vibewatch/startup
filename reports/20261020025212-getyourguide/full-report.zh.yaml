  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险排序
        blocks:
          - type: paragraph
            body: >-
              供应商质量和合规是剩余风险中的首要风险，因为市场平台合同把服务表现、上架准确性、许可、保险、税务合规和大量客户数据处理责任放在供应商一侧；一份由联盟资助的资料称其网络覆盖超过 150 个国家、拥有 35,000
              家伙伴。GetYourGuide
              可以核验供应商、下架商品、向客户退款，并在排名中使用投诉和取消信号，但这些控制主要是事后发现或补救，并不能证明每项体验在销售前都安全。一则第一人称投诉称某旅行团在运营商披露政府关闭之前就已售出；这只是单一历史经历，不是事件率估计，却说明库存与现场条件不一致时的下行风险。投资含义是尽调负担很高：如果经核实的严重事件、投诉率或供应商暂停数量上升且未及时补救，投资论点应失效。
            claimRefs:
              - CR001
