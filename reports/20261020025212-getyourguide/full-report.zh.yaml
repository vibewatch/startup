    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、覆盖范围与市场规模
        blocks:
          - type: paragraph
            body: >-
              GetYourGuide 运营双边旅行体验市场：旅行者发现并预订由本地运营商提供的旅行团、景点门票和活动，而非由 GetYourGuide 自营。公司称平台覆盖 12,000 个城市、超过 150,000
              项体验，累计售出超过 200 million 张门票，显示商品目录和交易历史规模可观；但两项数据都没有披露活跃供应商、去重旅行者或当前年度预订量。TechCrunch
              将公司描述为总部位于柏林，并确认苏黎世设有工程办公室；消费者网站目前也将苏黎世和柏林列为运营中心。这些规模数据可作为运营指标，但不能替代经独立审计的市场平台 KPI。
