      - number: '7.3'
        title: 运营、安全与客户伤害
        blocks:
          - type: paragraph
            body: >-
              运营失败可能源于供应商、平台或连接伙伴。TourTask 集成文档描述了付款前暂未确认的预订，并警告参与人数限制不匹配可能允许供应商无法服务的团体，或使团体人数没有对应价格。GetYourGuide
              条款让供应商负责第三方连接失败，以及通过这些工具合规处理客户个人数据。一则转发的 GetYourGuide
              工程岗位要求为内部智能代理平台建立追踪、质量指标、线上和离线评估、反馈循环及防护栏，显示公司正在设计控制，但不代表生产可靠性。实际的止损标准包括反复超售、无法对账的预订状态、重大客户数据事件，或无法提供经测试的恢复和模型评估证据。
            claimRefs:
              - CR006
              - CR008
              - CR009
              - CR014
          - type: table
            tableRef: TR002
            claimRefs:
              - CR003
              - CR004
              - CR006
              - CR008
              - CR009
              - CR014
      - number: '7.4'
        title: 依赖缓释与监控
        blocks:
          - type: paragraph
            body: >-
              GetYourGuide
              的公开客户承诺包括大多数活动免费取消、延后付款和全天候支持；供应商条款允许退款、下架商品、扣留款项和终止合作。这些是有意义的缓释工具，但指定证据没有量化响应时间、退款完成度、虚假可用率、供应商集中度或连接可用性。独立联盟内容明确指出，体验质量依赖本地运营商，退款时长和取消政策存在差异。因此，监控应结合供应商取消和投诉率、预订状态对账、退款账龄、核验到期、安全事件严重度，以及按供应商、连接伙伴、目的地和获客渠道计算的集中度。如果服务阈值持续被突破、发生未被遏制的隐私事件，或重要分销或连接依赖丧失，应暂停并重新评估投资。
            claimRefs:
              - CR003
              - CR004
              - CR006
              - CR011
              - CR012
              - CR013
          - type: table
            tableRef: TR003
            claimRefs:
              - CR005
