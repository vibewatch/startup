        - 按市场和品类提供月度 GMV 与净收入
      - - 毛利率与贡献利润率
        - 不可得
        - 低
        - 检验支持、支付、退款和获客成本能否随规模扩张
        - 提供经审计的毛利率，以及按渠道拆分的贡献利润桥接
      - - CAC 与回本期
        - 不可得
        - 低
        - 广泛的直销和合作伙伴覆盖并不能证明获客效率
        - 按付费、自然、联盟、API 和合作伙伴渠道提供 CAC、回本期和客户终身价值
      - - 供应商结算频率
        - 每月一次免费，或每月两次但收取附加费；履约订单扣除佣金后结算
        - 中
        - 影响营运资金、准备金和供应商流动性
        - 提供现金转换周期、退款准备金、拒付和支付处理商条款
      - - 已记录资本
