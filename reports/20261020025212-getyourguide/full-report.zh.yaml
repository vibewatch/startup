      - number: '4.3'
        title: 市场平台规模与融资信号
        blocks:
          - type: paragraph
            body: >-
              规模数据很大，但不能直接换算为当前收入。StartupHub 称平台拥有超过 150,000 个旅行团、活动和景点，来自超过 20,000
              家供应商；这些是库存和供应商数量，不是预订、GMV、活跃客户或确认收入。其融资画像称累计融资 8.95 亿美元，并将传统债务列为记录中的最近一轮。另据 The Traveler，2023 年 6 月融资为
              1.94 亿美元，结合股权和债务，估值约 20
              亿美元。这些记录说明公司能获得外部资本和债务，但筹得资金不等于可用现金。留存来源没有提供当前现金余额、烧钱率、现金跑道、债务到期表、契约条款、清算优先权或下一轮触发条件。
            claimRefs:
              - CI010
              - CI012
              - CI013
      - number: '4.4'
        title: 财务判断与投资判断阻碍
        blocks:
          - type: paragraph
            body: >-
              该模式具备吸引力的结构特征：交易收入可变、供应商无需支付已披露的平台上架费，以及广泛库存基础。未解决的问题是，扣除获客、退款、支持、支付处理和供应商结算后的收入质量。历史疫情证据表明，旅行中断可能迅速抹去收入，以至于公司需要休假和削减成本。客户证据也描述运营商取消后出现取消和退款失败；一篇
              2026 年联盟评论提醒，运营商质量和退款时长存在差异。这些都说明成本与负债可能被 GMV 叙事掩盖。因此，在取得经审计报表、分组经济、渠道级 CAC
              和回本期、退款率、现金、烧钱、跑道和债务义务前，投资立场仍应由尽调结果决定。
            claimRefs:
              - CI002
              - CI014
              - CI015
              - CI016
