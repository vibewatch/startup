            title: 规模无法消除市场平台质量风险
            body: 一则历史投诉称供应商取消旅行团、自助取消失败并出现退款摩擦。这只是单一经历，不是发生率指标，因此仍需尽调投诉和拒付分组。
            calloutType: risk
            claimRefs:
