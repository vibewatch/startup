        - 中
        - 说明融资渠道，但不代表当前流动性
        - 提供当前现金、受限现金、债务明细、契约和清算优先权
      - - 下行与服务损失敞口
        - 据描述，疫情期间收入被抹去；退款和运营商质量事件尚未量化
        - 低
        - 旅行冲击和服务故障可能挤压收入并推高支持成本
        - 提供压力情景、退款率、拒付、服务补偿和保险追偿
    notes: 已筹资金不等于可用现金，市场库存也不等于收入；不可得指标应明确标为缺口，而不是估算值。
