company:
  name: "GetYourGuide"
chapter:
  number: 5
  title: "Product & Technology"
  summary: >-
    GetYourGuide operates a two-sided experiences marketplace with traveler discovery and booking surfaces,
    a supplier portal, and a connectivity layer that can synchronize inventory, pricing, bookings, and
    cancellations with reservation systems. The public evidence supports a broad, operational product surface,
    but it does not expose core architecture, service levels, security certifications, incident history, or
    roadmap delivery, leaving material technical and trust-control diligence gaps.
sections:
  - id: "product-workflow-and-modules"
    title: "Product workflow and operating modules"
    body: >-
      The product joins two workflows. Travelers browse destination and attraction pages, compare activity
      details, prices, ratings, availability, and booking conditions, then transact through the marketplace.
      Suppliers register a business, submit an activity for review, provide legal and financial information,
      and maintain listing content, capacity, schedules, and pricing through a portal. GetYourGuide's current
      supplier page also describes analytics, demand insights, special offers, multilingual listing management,
      and AI-assisted content creation. This is broader than a simple catalog: the operating product combines
      merchandising, transaction support, supplier tooling, and distribution. However, most capability and
      scale statements are company-issued, and public evidence does not quantify conversion lift, supplier tool
      adoption, booking accuracy, or traveler repeat behavior.
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE004"
      - "CE005"
      - "CE009"
      - "CE010"
      - "CE011"
    tableRefs:
      - "TE001"
      - "TE002"
  - id: "architecture-and-integration-model"
    title: "Publicly evidenced architecture and integration model"
    body: >-
      Public pages support an operating model rather than a verifiable internal software architecture. The
      traveler surface feeds a marketplace transaction and support layer; the supplier portal holds listings,
      availability, pricing, and business information; and connectivity partners link external reservation
      systems to that portal. TripWorks describes real-time availability and pricing exchange, immediate booking
      propagation, and cancellation relay through an API connection. GetYourGuide separately claims more than
      250 connectivity partners. Together these sources support a multi-system integration boundary whose
      reliability depends on supplier data quality and partner synchronization, but they do not disclose API
      contracts, cloud topology, data stores, observability, redundancy, latency, uptime, recovery objectives,
      or security controls. The architecture map therefore shows only externally evidenced layers and avoids
      inferring implementation details.
    claimRefs:
      - "CE004"
      - "CE006"
      - "CE007"
      - "CE008"
      - "CE015"
    tableRefs:
      - "TE003"
    figureRefs:
      - "FE001"
  - id: "maturity-and-differentiation"
    title: "Maturity and differentiation"
    body: >-
      The evidence indicates a mature commercial surface: the official supplier page claims 35,000-plus supply
      partners, 150,000-plus activities, 37 traveler languages, and activity coverage in more than 12,000 cities.
      Wikipedia also records an engineering office opened in Zurich in 2017, while the live consumer site shows
      destination search, activity merchandising, reviews, pricing, cancellation messaging, support, mobile
      applications, and multiple payment methods. The defensible product advantage appears to be orchestration
      across global demand, localized content, supplier distribution, and reservation-system connectivity rather
      than a publicly demonstrated proprietary infrastructure breakthrough. An affiliate account describes
      recent AI features for content, discovery, and provider workflows, but no assigned primary technical
      documentation or independent benchmark verifies model quality, adoption, accuracy, or durable advantage.
    claimRefs:
      - "CE002"
      - "CE005"
      - "CE006"
      - "CE009"
      - "CE010"
      - "CE011"
      - "CE012"
      - "CE013"
  - id: "trust-reliability-and-roadmap"
    title: "Trust, reliability, safety, and roadmap risks"
    body: >-
      GetYourGuide's consumer surface promises trusted reviews, quality tours, free cancellation on most
      activities, pay-later availability, and 24/7 support. Its supplier page says applicants undergo review and
      that operators must be registered, legally compliant, and provide high-quality products. These are
      company-stated controls, not evidence of control design or effectiveness. Independent signals are mixed:
      a 2026 affiliate review describes a legitimate, convenient marketplace but notes that experience quality
      depends on local operators and that refund and cancellation outcomes vary; a ComplaintsBoard account
      alleges a 2018 safety escalation and refund failure involving a local operator. One complaint cannot
      establish an incident rate, yet it demonstrates the severity of marketplace-control failure modes.
      Underwriting therefore requires current incident, refund, fraud, uptime, supplier-removal, penetration-test,
      privacy, and certification evidence, plus a dated roadmap tied to measurable release outcomes.
    claimRefs:
      - "CE012"
      - "CE013"
      - "CE014"
      - "CE016"
    calloutRefs: []
