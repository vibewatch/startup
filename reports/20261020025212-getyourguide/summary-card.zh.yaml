    - 供应商可以多平台经营或直接销售；独家供给和持久的合同锁定尚未得到证实。
  unresolvedGaps:
    - 获取截至 2026 年 9 月的经审计收入、GMV、实际抽成率、毛利率和贡献利润率、分 cohort 留存、CAC 及现金转化数据。
    - 核对完全摊薄后的股权结构表、清算优先权、已提取的循环信贷余额、债务契约和转换条款。
