schemaVersion: "report-v2"
artifact: "customers"
slug: "getyourguide"
runDate: "2026-10-20"
company:
  name: "GetYourGuide"
chapter:
  number: 6
  title: "Customers"
  summary: "GetYourGuide reports a broad two-sided customer system spanning 50,000+ travel operators, 40 million+ monthly travelers, 15,000+ distribution partners, and a 33,000-member creator community. Named supplier examples indicate meaningful production use, but public evidence does not disclose traveler retention, cohort economics, supplier concentration, or channel-level revenue dependence."
sections:
  - id: "customer-system"
    title: "A multi-sided customer system"
    body: >-
      GetYourGuide serves travelers as buyers and users, experience operators as
      suppliers, and distribution partners and creators as acquisition and trust
      channels. Its live storefront shows destination, attraction, price, duration,
      rating, and cancellation information at the point of choice, while the company
      reports more than 50,000 operators, more than 40 million monthly travelers,
      more than 15,000 distribution partners, and a creator community of 33,000.
      These figures describe reach rather than monetized or retained cohorts: none
      discloses active-booker counts, repeat-booking rates, supplier GMV distribution,
      or overlap among channels. The segmentation therefore supports marketplace
      breadth but not a conclusion about durable customer economics.
    claimRefs: [CU001, CU002, CU003, CU004, CU005]
    tableRefs: [TU001]
  - id: "adoption-and-proof"
    title: "Adoption is visible, but proof quality is uneven"
    body: >-
      The strongest production evidence is supplier-level rather than traveler-level.
      An independent affiliate-supported article reports that City Tours Belgium gets
      65% of bookings through GetYourGuide and recorded 200% year-over-year growth
      after joining; it also reports that Graff Tours receives about 10% of bookings
      from the platform. GetYourGuide's supplier site separately lists connectivity
      case studies for Tour Marbella, Clio Muse, and International Friends, but the
      retained landing page does not expose their underlying outcome metrics. A
      Contentstack partner case study cites more than 500,000 daily visitors, offering
      historical corroboration of audience scale without a publication date or a
      directly comparable definition to monthly travelers.
    claimRefs: [CU011, CU012, CU013, CU014, CU015]
    tableRefs: [TU002, TU003]
  - id: "discovery-to-expansion"
    title: "Reviews and distribution create the expansion loop"
    body: >-
      Supplier expansion depends on visibility, conversion, availability, and review
      quality rather than a disclosed contractual land-and-expand motion. The
      independent operator analysis says these signals influence marketplace ranking.
      GetYourGuide's September 2026 release adds a Creator Reviews beta in which an
      eligible new activity can be booked and reviewed by a travel partner; the
      company says early tests indicate that even one review improves booking odds.
      The same release gives operators listing-funnel visibility and tailored
      suggestions, linking performance feedback to listing improvement. This is a
      plausible reinforcement loop, but no retained evidence quantifies incremental
      bookings, renewal behavior, or supplier lifetime value from the feature.
    claimRefs: [CU006, CU010]
    figureRefs: [FU001]
  - id: "durability-and-risk"
    title: "Durability and concentration remain unproven"
    body: >-
      Public evidence does not disclose NRR, GRR, churn, traveler repeat cohorts,
      contract length, top-supplier concentration, or the share of bookings sourced
      from any distribution channel. The available adverse evidence is qualitative:
      an independent review guide warns that experience quality depends on local
      operators and that refund timing and cancellation policies vary, while a
      historical ComplaintsBoard account describes safety concerns followed by a
      canceled tour and refund friction. These sources establish plausible execution
      risk, not incident frequency. Investment diligence should therefore treat
      customer durability as unverified and request cohort, concentration, complaint,
      refund, and cancellation data directly from management.
    claimRefs: [CU016]
