      - ["City Tours Belgium", "Small-group city tours", "Growth after joining the marketplace", "Production", "200% year-over-year growth reportedly followed joining", "Causality and base period are not disclosed"]
      - ["Graff Tours", "Street-art tours and workshops", "OTA-supported international marketing", "Production", "About 10% of bookings reportedly come through GetYourGuide", "Platform-attributable revenue and margin are not disclosed"]
      - ["Tour Marbella", "Tour operator", "API connectivity through Bókun", "Named case-study listing", null, "Retained landing page names the case but provides no outcome text"]
      - ["Clio Muse", "Local travel startup", "Connectivity for global distribution", "Named case-study listing", null, "Retained landing page names the case but provides no outcome text"]
