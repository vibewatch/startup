    title: "Customer discovery, fulfillment, and expansion loop"
    type: "journey-map"
    summary: "Marketplace reach feeds listing choice, operator fulfillment, review formation, and data-led listing improvement, but public evidence does not quantify retention through the loop."
    data:
      items:
        - label: "Traveler discovery"
          detail: "Travelers arrive through direct and distributed surfaces."
          touchpoints: ["Marketplace", "distribution partners", "creators"]
        - label: "Search and comparison"
          detail: "Listings expose activity details, prices, ratings, and availability."
          touchpoints: ["Destination pages", "activity cards", "reviews"]
        - label: "Booking"
          detail: "A traveler books an operator-provided experience through the marketplace."
          touchpoints: ["Checkout", "payment methods", "confirmation"]
        - label: "Local fulfillment"
          detail: "The supplier delivers the experience, creating operator-dependent quality risk."
          touchpoints: ["Meeting point", "tour or attraction", "support"]
        - label: "Review and trust"
          detail: "Traveler feedback and Creator Reviews can add social proof."
          touchpoints: ["Traveler review", "Creator Reviews beta", "provider rating"]
        - label: "Performance feedback"
          detail: "Operators receive listing-funnel visibility and tailored suggestions."
          touchpoints: ["Views", "bookings", "recommended actions"]
        - label: "Listing improvement"
          detail: "Operators adjust content, availability, and service to compete for visibility."
          touchpoints: ["Listing quality", "availability", "response quality"]
    approximationNotes: "The sequence is an evidence-backed operating model, not a measured conversion funnel; no stage conversion or retention rates are inferred."
    claimRefs: [CU006, CU010, CU016]
callouts:
  - calloutType: "risk"
    title: "Reach is not retention"
    body: "Public reach metrics and selected supplier cases do not reveal repeat booking, cohort retention, supplier churn, or concentration; these remain material diligence requests."
    claimRefs: [CU002, CU003, CU011, CU013]
