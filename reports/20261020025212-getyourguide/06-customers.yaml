  evidenceGaps:
    - type: "private-evidence-only"
      severity: "material"
      topic: "retention"
      missingEvidence: "Traveler repeat-booking cohorts, supplier GRR and NRR, churn, renewal behavior, and contract-length distributions."
      whyItMatters: "Reach and selected production examples cannot establish durable demand or supplier retention."
      diligencePath: "Request monthly traveler and supplier cohort tables for at least 36 months, reconciled to bookings, GMV, take rate, and contribution margin."
      relatedQuestionRefs: [QU006]
    - type: "private-evidence-only"
      severity: "material"
      topic: "concentration"
      missingEvidence: "Top traveler, supplier, destination, and acquisition-channel shares of bookings, GMV, net revenue, and contribution profit."
      whyItMatters: "Undisclosed concentration can make reported marketplace reach economically fragile or dependent on a small number of channels."
      diligencePath: "Request top-10 and top-20 concentration schedules by supplier, destination, and channel, including direct, paid, partner, creator, and AI-assistant traffic."
      relatedQuestionRefs: [QU009]
    - type: "enumeration-incomplete"
      severity: "minor"
      topic: "named-supplier-proof"
      missingEvidence: "A complete list of named production suppliers with deployment dates, bookings, GMV, retention, and verified outcomes."
      whyItMatters: "The retained named examples are selective and cannot establish representative supplier adoption or performance."
      diligencePath: "Obtain a management-provided reference list and independently interview a stratified sample of large, medium, and small operators."
      relatedTableRefs: [TU003]
