  - id: TR003
    title: Partner / dependency risk register
    columns:
      - Dependency
      - Counterparty
      - Role
      - Concentration evidence
      - Failure scenario
      - Severity
      - Mitigation
      - Residual exposure
    rows:
      - - Experience fulfillment
        - Local suppliers
        - Deliver booked service and maintain availability
        - 35,000 partners reported by an affiliate-funded profile; distribution unknown
        - Safety, quality, cancellation, or listing failure
        - High
        - Verification, ranking signals, refunds, suspension, termination
        - No supplier or destination concentration data
      - - Reservation connectivity
        - Channel managers and reservation systems
        - Synchronize products, capacity, prices, and bookings
        - No partner shares disclosed
        - Stale inventory, wrong pricing, or booking-state mismatch
        - High
        - Configuration guidance and supplier accountability
        - No availability SLO, recovery time, or reconciliation rate
      - - Payment collection
        - Payment service providers and sub-commercial agents
        - Collect customer funds and route supplier payouts
        - No provider shares disclosed
        - Chargeback, nonpayment, delay, or compliance block
        - High
        - Withholding, deductions, dispute response, multiple payout schedules
        - Fraud losses, payout aging, and provider concentration unavailable
      - - Customer remediation
        - GetYourGuide support and suppliers
        - Cancellation, refund, complaint, and alternative-service handling
        - No case-volume or response-time disclosure
        - Slow refund or unresolved service failure damages trust
        - Medium
        - Most-activity cancellation promise, 24/7 support, contractual refund rights
        - Independent content says timing and policies can vary
    notes: >-
