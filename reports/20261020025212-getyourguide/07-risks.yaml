company:
  name: GetYourGuide
chapter:
  number: 7
  title: Risks
  summary: >-
    The highest residual exposures arise from a globally distributed supplier base whose
    service quality, licensing, safety, data handling, availability, and connectivity can
    fail outside GetYourGuide's direct operational control. Contractual verification,
    refund, enforcement, support, and observability mechanisms reduce but do not eliminate
    these risks, while current incident rates, regulator records, concentration, and debt
    utilization remain unavailable in the assigned public evidence.
sections:
  - id: ranked-risk-posture
    title: Ranked risk posture
    body: >-
      Supplier quality and compliance are the principal residual risks because the
      marketplace contract places service performance, listing accuracy, licensing,
      insurance, tax compliance, and much customer-data handling on suppliers, while an
      affiliate-funded profile reports a network of 35,000 partners across more than 150
      countries. GetYourGuide can verify suppliers, remove offers, refund customers, and
      use complaint and cancellation signals in ranking, but those controls are largely
      detective or remedial rather than proof that every experience is safe before sale.
      A first-person complaint alleging that a tour was sold immediately before an
      operator disclosed a government closure is only one historical account, not an
      incident-rate estimate, yet it illustrates the downside when inventory and field
      conditions diverge. The investment implication is a high diligence burden: the
      thesis should break if verified severe incidents, complaint rates, or supplier
      suspensions rise without timely remediation.
    claimRefs:
      - CR001
      - CR004
      - CR007
      - CR010
      - CR016
    figureRefs:
      - FR001
  - id: legal-and-regulatory
    title: Legal, regulatory, and financial allocation
    body: >-
      The October 2026 supplier terms define GetYourGuide as a commercial agent while the
      customer buys the service directly from the supplier. That structure narrows direct
      operating responsibility but does not remove platform exposure to consumer
      dissatisfaction, regulatory scrutiny, payment disputes, or reputational damage.
      Suppliers must complete verification checks and maintain licenses, insurance, and
      tax information; GetYourGuide may reject or remove non-compliant offers and issue
      refunds. Chargeback provisions also make supplier payout conditional on successful
      customer payment. Separately, the 2023 financing announcement comprised $85 million
      of equity and a $109 million revolving credit facility; it is historical financing
      raised, not evidence of current cash, current debt drawn, or runway. Investment
      approval should therefore require current litigation and regulator searches,
      insurance-control testing, and a debt utilization schedule rather than inferring
      present liquidity from the announced financing.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR004
      - CR005
      - CR015
    tableRefs:
      - TR001
  - id: operations-security-and-customer-harm
    title: Operations, security, and customer harm
    body: >-
      Operational failure can originate at the supplier, the platform, or a connectivity
      partner. TourTask's integration documentation describes temporary unconfirmed
      bookings before payment and warns that mismatched participant limits can permit a
      party the supplier cannot serve or leave party sizes without a price. GetYourGuide's
      terms make the supplier responsible for third-party connectivity failures and for
      compliant processing of customer personal data through those tools. A reposted
      GetYourGuide engineering role calls for tracing, quality metrics, online and offline
      evaluations, feedback loops, and guardrails for an internal agent platform, which
      shows active control design but does not establish production reliability. The
      practical kill criteria are repeated overselling, unreconciled booking states,
      material customer-data incidents, or inability to produce tested recovery and model
      evaluation evidence.
    claimRefs:
      - CR006
      - CR008
      - CR009
      - CR014
    tableRefs:
      - TR002
  - id: dependency-mitigation-and-monitoring
    title: Dependency mitigation and monitoring
    body: >-
      GetYourGuide's public customer promise includes free cancellation on most
      activities, pay-later availability, and round-the-clock support, while its supplier
      terms permit refunds, offer removal, payout withholding, and termination. These are
      meaningful mitigation tools, but the assigned evidence does not quantify response
      times, refund completion, false-availability rates, supplier concentration, or
      connectivity availability. Independent affiliate content explicitly notes that
      experience quality depends on local operators and that refund timing and
      cancellation policies vary. Monitoring should therefore combine supplier
      cancellation and complaint rates, booking-state reconciliation, refund aging,
      verification expiry, security-event severity, and concentration by supplier,
      connectivity partner, destination, and acquisition channel. A sustained breach of
      service thresholds, an uncontained privacy event, or loss of a material distribution
      or connectivity dependency should trigger a pause and renewed underwriting.
    claimRefs:
      - CR003
      - CR004
      - CR006
      - CR011
      - CR012
      - CR013
    tableRefs:
      - TR003
