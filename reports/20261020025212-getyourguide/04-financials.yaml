schemaVersion: "report-v2"
artifact: financials
slug: getyourguide
runDate: "2026-10-20"
company:
  name: GetYourGuide
chapter:
  number: 4
  title: Financials
  summary: >-
    GetYourGuide has a transaction-linked marketplace model: suppliers can list without an
    upfront fee, while the platform earns a commission on fulfilled bookings. Public evidence
    supports the mechanism and some scale and financing signals, but audited revenue, realized
    take rate, gross margin, cash conversion, burn, runway, and the full debt stack remain
    unavailable, preventing a financeable underwriting model.
sections:
  - id: revenue-model
    title: Revenue model and pricing transparency
    body: >-
      GetYourGuide's supplier materials describe a marketplace rather than an inventory-owning
      tour operator. Suppliers may add and maintain activities without an upfront platform fee,
      and GetYourGuide charges a commission only when a booking succeeds. The exact rate is not
      publicly standardized: the company says it varies by country and is disclosed after
      signup. An affiliate-supported industry article estimates a typical 20%-30% booking
      commission, but that range is not a company tariff and should not be treated as realized
      take rate. Customer-facing pages show activity-level "From" prices and discounts, while
      the evidence does not disclose revenue mix, contra-revenue treatment, refund accounting,
      or whether any non-commission streams are material.
    claimRefs: [CI001, CI002, CI003, CI005, CI011]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: go-to-market-and-cost-base
    title: Distribution, service delivery, and working capital
    body: >-
      The public model combines owned web and app demand with affiliate, API, and broader
      distribution relationships. AskCyborg identifies direct, affiliate, and API channels, but
      explicitly labels its work AI-generated and not independently verified; a separate
      affiliate-supported article claims more than 1,000 distribution partners. These signals
      indicate a broad acquisition surface, not efficient acquisition economics. Company
      materials say commission funds platform management, tools, supplier insights, and
      promotion, while the consumer site advertises support and flexible booking features.
      Supplier settlements are monthly at no extra cost or twice monthly for a surcharge, with
      fulfilled bookings paid net of commission. That cadence creates an observable settlement
      mechanism, but public sources do not quantify payment reserves, refund float, marketing
      intensity, support cost, or gross-margin contribution.
    claimRefs: [CI004, CI006, CI007, CI008, CI009]
    tableRefs: [TI003]
  - id: traction-and-capital
    title: Marketplace scale and financing signals
    body: >-
      Scale claims are substantial but cannot be translated into current revenue. StartupHub
      reports more than 150,000 tours, activities, and attractions from more than 20,000
      suppliers; these are inventory and supplier counts, not bookings, GMV, active customers,
      or recognized revenue. Its financing profile reports $895 million of total funding and
      labels conventional debt as the most recent round on record. Separately, The Traveler
      reports a June 2023 financing of $194 million combining equity and debt at an approximately
      $2 billion valuation. These records show access to external capital and debt, but funding
      raised is not cash available. No retained source provides a current cash balance, burn
      rate, runway, debt maturity schedule, covenant package, liquidation preferences, or
      next-round trigger.
    claimRefs: [CI010, CI012, CI013]
  - id: financial-verdict
    title: Financial verdict and underwriting blockers
    body: >-
      The model has attractive structural features: variable transaction revenue, no stated
      supplier listing fee, and a broad inventory base. The unresolved issue is revenue quality
      after acquisition, refunds, support, payment processing, and supplier payouts. Historical
      pandemic evidence shows that travel interruption could eliminate revenue quickly enough
      to require furloughs and cost cuts. Customer evidence also describes cancellation and
      refund failure after an operator canceled, while a 2026 affiliate review cautions that
      operator quality and refund timing vary. These observations do not quantify present loss
      rates, but they identify costs and liabilities that a gross-booking-value narrative can
      hide. The investment stance therefore remains diligence-gated until audited statements,
      cohort economics, channel-level CAC and payback, refund rates, cash, burn, runway, and
      debt obligations are supplied.
    claimRefs: [CI002, CI014, CI015, CI016]
