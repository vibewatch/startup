  - id: TI002
    title: Pricing and channel economics
    columns:
      - Price or contract element
      - Public value
      - Evidence status
      - Economic implication
      - Diligence ask
    rows:
      - [Supplier listing and maintenance, "$0 upfront", "Company-confirmed", "Lowers supplier adoption friction; monetization depends on completed bookings", "Confirm whether onboarding, integration, or premium placement fees exist"]
      - [Supplier commission, "Exact rate disclosed after signup and varies by country", "Company-confirmed structure", "Supports segmented pricing but obscures realized take rate", "Provide contract samples and weighted-average rate by geography and category"]
      - [Typical booking commission, "20%-30% per booking", "Third-party affiliate-supported estimate", "Directional only; not a verified realized rate", "Reconcile estimate to company contracts and audited net revenue"]
      - [Traveler price, "Per-activity 'From' prices, sometimes showing a discount", "Observed on company marketplace", "No platformwide list price; mix and promotions affect booking value", "Provide average order value, discount funding, and cancellation-adjusted net booking value"]
      - [Distribution economics, "Direct, affiliate, API, and claimed 1,000+ partner reach", "Third-party reports with limited verification", "Reach can diversify demand but may add referral or paid-acquisition cost", "Provide bookings, revenue, CAC, contribution margin, and payback by channel"]
    notes: "List and advertised prices are not realized revenue; the commission band and distribution scale are third-party claims and require contract-level reconciliation."
    claimRefs: [CI003, CI005, CI008, CI009, CI011]
  - id: TI003
    title: Unit economics and capital adequacy
    columns:
      - Metric
      - Public value or status
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - [Realized take rate, "Unavailable; external article estimates 20%-30% typical commission", Low, "Primary revenue yield before refunds and incentives", "Provide monthly GMV and net revenue by market and category"]
      - [Gross and contribution margin, Unavailable, Low, "Tests whether support, payment, refund, and acquisition costs scale", "Provide audited gross margin and contribution bridge by channel"]
      - [CAC and payback, Unavailable, Low, "Broad direct and partner reach does not establish acquisition efficiency", "Provide CAC, payback, and lifetime value by paid, organic, affiliate, API, and partner channel"]
      - [Supplier settlement cadence, "Monthly free or twice monthly with surcharge; fulfilled bookings paid net of commission", Medium, "Affects working capital, reserves, and supplier liquidity", "Provide cash-conversion cycle, refund reserves, chargebacks, and processor terms"]
      - [Capital on record, "$895M total funding in StartupHub; June 2023 financing reported as $194M equity and debt", Medium, "Shows financing access but not current liquidity", "Provide current cash, restricted cash, debt schedule, covenants, and liquidation preferences"]
      - [Downturn and service-loss exposure, "Pandemic revenue described as wiped out; refund and operator-quality incidents are unquantified", Low, "Travel shocks and service failures can pressure revenue and support costs", "Provide stress cases, refund rate, chargebacks, service credits, and insurance recoveries"]
    notes: "Funding raised is not cash available, and marketplace inventory is not revenue; unavailable metrics remain explicit gaps rather than estimates."
    claimRefs: [CI004, CI005, CI007, CI008, CI009, CI012, CI013, CI014, CI015, CI016]
figures:
  - id: FI001
    title: Transaction-to-service economic flow
    type: flow
    summary: "The public evidence supports the booking and settlement mechanics, but not the margin retained after acquisition, support, refunds, and platform costs."
    data:
      nodes:
        - id: traveler-demand
          label: Traveler demand
          detail: "Direct, affiliate, API, and distribution channels bring travelers to activity-level offers."
        - id: booking-value
          label: Completed booking value
          detail: "Traveler prices vary by activity and may include displayed discounts."
        - id: platform-commission
          label: Platform commission
          detail: "Company-confirmed on successful bookings; exact rate varies and is disclosed after supplier signup."
        - id: supplier-settlement
          label: Supplier settlement
          detail: "Fulfilled bookings are paid monthly or twice monthly, net of commission."
        - id: service-costs
          label: Platform and service costs
          detail: "Technology, promotion, support, payment operations, refunds, and channel acquisition consume commission revenue."
        - id: contribution-cash
          label: Contribution and cash generation
          detail: "Not publicly disclosed; audited margin and cash-conversion evidence is required."
      edges:
        - from: traveler-demand
          to: booking-value
          label: converts to booking
        - from: booking-value
          to: platform-commission
          label: commission deducted
        - from: platform-commission
          to: supplier-settlement
          label: supplier receives net amount
        - from: platform-commission
          to: service-costs
          label: funds platform delivery
        - from: service-costs
          to: contribution-cash
          label: residual not disclosed
    approximationNotes: "The 20%-30% commission range is a third-party estimate and is intentionally omitted from the flow values; no cumulative bridge or margin amount is implied."
    claimRefs: [CI001, CI002, CI003, CI004, CI006, CI007, CI008, CI009, CI011, CI015]
callouts:
  - calloutType: risk
    title: Funding is not runway
    body: >-
      Public financing records show access to equity and debt, but they do not establish current
      unrestricted cash, monthly burn, debt service, covenant headroom, or the next financing
      trigger. Capital adequacy remains ununderwritten.
    claimRefs: [CI012, CI013]
  - calloutType: recommendation
    title: Underwrite from cohorts, not inventory
    body: >-
      Require audited revenue and margin bridges plus booking cohorts by channel, geography, and
      activity category. Large supplier or activity counts do not reveal repeat behavior,
      acquisition efficiency, refund leakage, or contribution margin.
    claimRefs: [CI008, CI009, CI010, CI014, CI015, CI016]
