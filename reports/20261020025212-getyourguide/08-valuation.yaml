company:
  name: GetYourGuide
chapter:
  number: 8
  title: Valuation
  summary: >-
    The latest retained priced-round anchor is the $2 billion June 2023 Series F valuation,
    but the assigned public evidence does not disclose current audited economics or the
    capital stack needed to underwrite a new entry price. The recommendation is therefore
    research-more/track with high risk and an indeterminate valuation stance.
sections:
  - id: decision-and-entry-discipline
    title: Decision and entry discipline
    body: >-
      The appropriate decision is research-more/track, not buy. The strongest retained
      valuation anchor is a $2 billion Series F mark from June 2023, and the same financing
      package included both $85 million of equity and a $109 million revolving credit
      facility. That historical mark establishes what investors once paid, not what the
      business is worth in October 2026. The reviewed pool provides no audited current
      revenue, margin, EBITDA, cash-conversion, or retention metrics and no current
      liquidation-preference or drawn-debt schedule. Entry discipline should therefore
      require a data-room valuation bridge from the 2023 mark to verified current
      performance, with funding raised kept distinct from cash available.
    claimRefs: [CV001, CV002, CV014, CV015, CV016]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: thesis-and-anti-thesis
    title: Thesis and anti-thesis
    body: >-
      The thesis rests on marketplace scale, a commission-based intermediary model, and
      continuing product investment. GetYourGuide's company-issued April 2026 release
      claims 50,000 supply partners and 200,000 experiences, while the terms identify the
      company as the commercial agent rather than the activity provider. That structure
      can support broad selection, but it also makes supplier execution and marketplace
      controls central to value. The anti-thesis is that the latest profitability statement
      in the retained evidence dates to 2023 and offered no timetable. A retained customer
      complaint alleges serious safety, cancellation, and refund failures; it is anecdotal,
      not an incidence measure, but aligns with the operator-dependency caveat identified
      by an affiliate review and the allocation of supplier responsibility in the terms.
    claimRefs: [CV005, CV006, CV007, CV008, CV009, CV010, CV011, CV012]
    tableRefs: [TV002]
  - id: scenarios-comparables-and-exit
    title: Scenarios, comparables, and exit readiness
    body: >-
      Multiples lists selected travel-company revenue multiples from 1.2x to 4.2x, but those
      references span different business mixes and cannot be applied responsibly without
      a verified GetYourGuide revenue denominator, margin profile, and growth period. The
      bull, base, and bear cases are therefore conditional decision boundaries rather than
      point estimates or fabricated probability weights. A premium to the 2023 mark would
      require audited growth, contribution margin, cash conversion, and retention that
      support a defensible comparable set. The base case holds the price judgment open
      pending those data. The bear case requires a material discount if supplier-quality
      failures, weak cash conversion, or financing preferences impair equity value.
    claimRefs: [CV001, CV009, CV013, CV014, CV015, CV016]
    tableRefs: [TV003]
  - id: diligence-and-thesis-breaks
    title: Final diligence asks and thesis-break triggers
    body: >-
      No supportable target return, hold period, or exit value can be set from the assigned
      public evidence. Before investment, obtain audited monthly revenue and gross-booking
      value bridges, take rate, gross and contribution margins, cohort retention, cash
      conversion, debt utilization, the fully diluted cap table, and every preference or
      conversion term. Reconcile the conflicting public totals for funding rounds rather
      than treating either aggregate as liquidity. Thesis-break triggers should include
      deterioration in repeat demand, persistent supplier-quality failures, negative
      contribution margin after acquisition costs, covenant pressure, or preference-adjusted
      proceeds below the required return. Exit readiness also requires evidence of a clean
      equity waterfall and a credible path to audited public-company reporting.
    claimRefs: [CV002, CV003, CV004, CV011, CV014, CV015, CV016]
