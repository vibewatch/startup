    notes: "Analyst judgment based only on retained public evidence; no current audited financials or cap-table terms were available."
    claimRefs: [CV001, CV002, CV014, CV015, CV016]
  - id: TV002
    title: Thesis and anti-thesis
    columns:
      - Side
      - Argument
      - What would change the view
    rows:
      - [Thesis, "Company-issued scale claim of 50,000 supply partners and 200,000 experiences.", "Verify active, revenue-generating supply and concentration by destination and operator."]
      - [Thesis, "Commission intermediary model can aggregate fragmented activity supply.", "Confirm take rate, contribution margin, refund leakage, and supplier retention."]
      - [Thesis, "2026 product release shows continued investment in search, reviews, and operator tooling.", "Demonstrate conversion uplift and durable acquisition-cost efficiency."]
      - [Anti-thesis, "The retained profitability signal is a non-quantified 2023 management statement.", "Provide audited profitability, cash conversion, and monthly trend data through 2026."]
      - [Anti-thesis, "Supplier delivery and content sit outside direct company provision under the terms.", "Show quality-control outcomes, incident rates, refund times, and operator remediation."]
      - [Anti-thesis, "A retained complaint alleges safety, cancellation, and refund failures.", "Provide normalized complaint incidence and severity by bookings, destination, and operator."]
    notes: "Scale and product claims are company-issued; the complaint is a single historical account and is not an incidence estimate."
    claimRefs: [CV005, CV006, CV007, CV009, CV010, CV011, CV012]
  - id: TV003
    title: Bull, base, and bear scenario framework
    columns:
      - Scenario
      - Explicit assumptions
      - Valuation and return logic
      - Key risks
      - Probability signal
    rows:
      - [Bull, "Audited growth, retention, contribution margin, and cash conversion are strong; debt and preferences are manageable.", "A premium to the $2B June 2023 reference is considered only after a comparable-set bridge and required-return model.", "Multiple compression, travel cyclicality, and supplier concentration.", "Unpriced until audited operating evidence is supplied."]
      - [Base, "Scale persists, but current profitability and cash conversion remain unverified.", "Use the $2B mark only as a negotiation reference; do not pay a premium without verified fundamentals.", "Stale price anchor, financing overhang, and limited exit visibility.", "Current public evidence supports tracking, not a numeric probability."]
      - [Bear, "Growth or repeat demand weakens, supplier-quality costs rise, or debt and preferences absorb equity proceeds.", "Require a material discount to the historical mark and model preference-adjusted downside before entry.", "Refund leakage, covenant pressure, operator failures, and weak cash conversion.", "Triggered by failed diligence or adverse operating trends."]
    notes: "These are conditional boundaries, not forecasts; exact valuation ranges, probabilities, target returns, and exit timing require private financial and capital-structure evidence."
    claimRefs: [CV001, CV009, CV013, CV014, CV015, CV016]
