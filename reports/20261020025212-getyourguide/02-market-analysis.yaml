callouts:
  - calloutType: "risk"
    title: "Large category claims are not an investable SOM"
    body: >-
      Neither retained source isolates the digitally bookable regional spend that
      GetYourGuide can serve or the share obtainable after direct and marketplace
      substitutes. Use the broad estimates as directional context only.
    claimRefs: [CM004, CM006, CM007]
