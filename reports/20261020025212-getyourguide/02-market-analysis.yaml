slug: "getyourguide"
runDate: "2026-10-20"
company:
  name: "GetYourGuide"
chapter:
  number: 2
  title: "Market Analysis"
  summary: >-
    GetYourGuide addresses the fragmented market for bookable tours, attractions,
    activities, and related in-destination experiences rather than the whole travel
    wallet. Company-originated evidence points to a large, increasingly digital
    category and meaningful platform scale, but independent SAM/SOM evidence and
    service-failure denominators remain unavailable.
sections:
  - id: "market-boundary"
    title: "Market boundary and substitutes"
    body: >-
      The investable boundary is the transaction layer for discovering and booking
      tours, attraction tickets, day trips, transfers, and other in-destination
      experiences. GetYourGuide's own storefront shows this breadth, while independent
      descriptions characterize the model as a marketplace rather than a tour
      operator. Core airfare, lodging, and general destination spending therefore sit
      outside the boundary unless attached to an experience transaction. The relevant
      status quo is not only another online marketplace: direct operator booking,
      hotel concierges, brochures, on-site sales, and self-planned activities can all
      bypass the platform. This boundary matters because a broad travel-spend estimate
      would overstate addressability, whereas an experiences-only boundary captures
      the spend on which GetYourGuide can plausibly earn a commission.
    claimRefs: [CM001, CM002, CM003, CM011]
    tableRefs: [TM001]
  - id: "sizing-lenses"
    title: "Evidence-constrained sizing"
    body: >-
      Available sizing is directional rather than underwriting-grade. A syndicated
      company release places the global experiences market near EUR 420 billion and
      projects 9% annual growth for 2025-2030, while a 2023 company survey release used
      a USD 375 billion end-2024 projection. Those figures differ in currency, vintage,
      and company-defined methodology and should not be blended into a single TAM.
      Platform-scale claims provide a narrower operating lens: more than EUR 4 billion
      of fiscal-2025 GMV from more than 33 million booked experiences, supported by
      50,000 supply partners and more than 200,000 experiences. These figures suggest
      meaningful penetration of a fragmented category, but they do not identify a
      geography-adjusted SAM or a realistically obtainable SOM. Skift's observation
      that category financial disclosure remains sparse reinforces the need for
      primary market data before assigning a market-share premium.
    claimRefs: [CM004, CM005, CM006, CM007, CM008, CM009, CM010]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: "buyers-and-adoption"
    title: "Buyer, payer, and adoption path"
    body: >-
      Travelers are both users and payers on the demand side; local operators,
      attractions, and activity providers supply inventory and effectively purchase
      global distribution through transaction commissions. Adoption begins when a
      traveler needs to compare unfamiliar local options, then depends on visible
      availability, reviews, mobile fulfillment, cancellation terms, and trusted
      payment. GetYourGuide's proprietary 2023 research, based on more than 6,000
      travelers in six countries, reported 142% mobile-booking growth from 2022 to
      2023 and said its selected "Modern Explorer" cohort valued flexible online
      booking over price. Current coupon listings show that price promotion still
      participates in acquisition, but those offers do not reveal ordinary realized
      prices or marketplace take rate. The evidence therefore supports digitization
      and convenience as adoption drivers without proving durable pricing power.
    claimRefs: [CM011, CM012, CM013, CM014, CM015]
    tableRefs: [TM003]
  - id: "constraints-and-diligence"
    title: "Constraints, timing, and diligence implications"
    body: >-
      The market's fragmentation is both opportunity and constraint. Aggregating small
      operators can improve selection and discovery, yet service delivery remains in
      third-party hands. Complaint pages contain individual reports about no-shows,
      cancellations, invalid tickets, and delayed refunds; these observations establish
      failure modes, not their frequency, because no booking-volume denominator is
      disclosed. Adoption can therefore accelerate through mobile convenience and
      flexible policies while trust, supplier quality, refund execution, and regulatory
      differences slow conversion or repeat use. Valuation should rely on verified
      cohort retention, take rate, contribution margin, supplier concentration, and
      complaint incidence rather than applying the broad market growth rate directly
      to GetYourGuide. Independent regional market sizing and normalized service-quality
      data are the two material evidence gaps.
    claimRefs: [CM007, CM013, CM014, CM015, CM016]
