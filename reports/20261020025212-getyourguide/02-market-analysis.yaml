      - ["Last-minute traveler", "Traveler already at destination", "Traveler household", "Mobile discovery and near-term booking", "Live availability and mobile fulfillment", "Inventory or support failure is time-critical"]
      - ["Plan-ahead traveler", "Traveler or group organizer", "Traveler household or group", "Advance comparison and cancellation review", "Flexibility and confidence", "Policy variation across listings"]
