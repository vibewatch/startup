callouts:
  - calloutType: risk
    title: Scale does not resolve marketplace-quality risk
    body: >-
      One historical complaint describes a canceled supplier tour, failed self-service
      cancellation, and refund friction. It is a single account rather than an incidence
      measure, so complaint and chargeback cohorts remain a diligence requirement.
    claimRefs: [CO016]
