company:
  name: GetYourGuide
chapter:
  number: 1
  title: Company Overview
  summary: >-
    GetYourGuide is a founder-led marketplace for tours, attractions, and activities that
    reports meaningful global scale and adjusted-EBITDA profitability, but its current
    capitalization, audited economics, governance, and unique-customer base remain private.
sections:
  - id: identity-and-scale
    title: Identity, footprint, and marketplace scale
    body: >-
      GetYourGuide operates a two-sided travel-experiences marketplace: travelers discover
      and book tours, attraction tickets, and activities supplied by local operators rather
      than by GetYourGuide itself. The company describes more than 150,000 experiences
      across 12,000 cities and more than 200 million tickets sold, indicating substantial
      catalog breadth and transaction history, but neither figure discloses active suppliers,
      unique travelers, or current annual bookings. TechCrunch described the business as
      Berlin-based and identified Zurich as an engineering office; the live consumer site
      likewise presents Zurich and Berlin as its operating centers. These scale claims are
      useful operating markers, not substitutes for independently audited marketplace KPIs.
    claimRefs: [CO001, CO004, CO005, CO006]
    tableRefs: [TO001]
  - id: founders-and-governance
    title: Founders, leadership, and governance visibility
    body: >-
      The company says Johannes Reck, Tao Tao, Martin Sieber, and Tobias Rein founded
      GetYourGuide in 2009 after a travel-planning problem in Beijing. Current third-party
      evidence identifies Reck as chief executive, and company communications continue to
      center major operating updates on him. The assigned evidence does not establish the
      current executive roles of the other founders, the full leadership team, board
      composition, voting control, or succession arrangements. That asymmetry creates
      potential key-person dependence around Reck while leaving the actual control structure
      unverified. Diligence should therefore distinguish visible founder leadership from
      proven governance resilience and obtain a current organization chart, board roster,
      reserved-matters schedule, and succession plan.
    claimRefs: [CO002, CO003]
    tableRefs: [TO002]
  - id: capital-and-economics
    title: Capital history and emerging profitability
    body: >-
      Public evidence shows a long capital-intensive scaling path. TechCrunch reported a
      $75 million Series D in 2017, led by Battery Ventures, that brought cumulative funding
      at that point to about $170 million. A later aggregator reports a $194 million Series F
      at a $2 billion valuation in June 2023 and $868 million raised across four rounds, but
      those totals are not verified here against primary financing documents. In October
      2025, the company said it had been profitable on an adjusted EBITDA basis for the prior
      year and that trailing revenue was approaching EUR 1 billion. Independent reporting in
      2026 described the turn to profitability after roughly EUR 500 million of cumulative
      losses, underscoring both scale and the historical cost of reaching it.
    claimRefs: [CO007, CO008, CO010, CO011, CO012, CO013, CO014]
    tableRefs: [TO003]
  - id: milestones-and-diligence
    title: Milestones, operating momentum, and diligence implications
    body: >-
      The milestone record spans formation in 2009, major venture financings in 2017 and
      2023, and a 2025 profitability announcement. The company also reported 30% year-over-year
      GMV growth and 10 million experiences booked in Q3 2025, while a current aggregator
      reports 1,344 employees at December 2025. These are useful directionally but mix
      company-issued, journalistic, and aggregated evidence with different definitions and
      assurance levels. A customer complaint describing cancellation and refund difficulty
      illustrates marketplace execution risk but cannot establish incidence or trend.
      Investment diligence should prioritize audited financials, take-rate and repeat-booking
      cohorts, supplier concentration, complaint prevalence, and a fully diluted capitalization
      table before treating headline scale as a complete operating or valuation picture.
    claimRefs: [CO002, CO009, CO012, CO013, CO014, CO015, CO016]
    figureRefs: [FO001]
