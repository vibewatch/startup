evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Current executive roster, board composition, voting rights, succession plan, fully diluted cap table, debt, and
      preference stack.
    whyItMatters: These determine control, key-person exposure, governance protections, and financing seniority.
    diligencePath: >-
      Request the current organization chart, board materials, charter documents, capitalization table, debt schedule,
      and financing agreements.
    relatedQuestionRefs:
      - QO002
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: financial-quality
    missingEvidence: >-
      Audited revenue, gross margin, contribution margin, adjusted-EBITDA reconciliation, cash conversion, and
      period-end cash.
    whyItMatters: >-
      Company-issued profitability and revenue statements do not establish accounting profit, cash generation, or
      balance-sheet resilience.
    diligencePath: >-
      Obtain audited financial statements and a management bridge from bookings and GMV through revenue, contribution
      profit, EBITDA, and free cash flow.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: scale-denominators
    missingEvidence: >-
      Unique customers, repeat-booking cohorts, active suppliers, current payroll headcount, and periodized booking
      volume.
    whyItMatters: >-
      Cumulative ticket and catalog figures cannot establish retention, concentration, or current operating
      productivity.
    diligencePath: >-
      Request monthly cohort, supplier, booking, and payroll extracts with metric definitions and reconciliation
      controls.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: customer-complaints
    missingEvidence: Complaint, cancellation, refund, chargeback, safety-incident, and supplier-remediation rates by cohort and market.
    whyItMatters: A single complaint demonstrates a failure mode but cannot establish prevalence, severity, or trend.
    diligencePath: >-
      Review customer-support and trust-and-safety dashboards, sampled case files, refund aging, chargebacks, and
      supplier enforcement outcomes.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: sizing-limitations
    missingEvidence: >-
      Independent regional market size, online-booking penetration, and GetYourGuide serviceable share by geography and
      category.
    whyItMatters: >-
      Without consistent scope and methodology, broad category estimates cannot support a defensible SAM, SOM, or
      market-share premium.
    diligencePath: >-
      Commission an independent market study and reconcile it to operator transaction data by region, category, channel,
      currency, and booking year.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: service-quality
    missingEvidence: >-
      Normalized complaint, refund, cancellation, no-show, and invalid-ticket rates using completed bookings as the
      denominator.
    whyItMatters: >-
      Anecdotal complaint pages identify failure modes but cannot establish their frequency, trend, or effect on repeat
      booking.
    diligencePath: >-
      Request monthly trust-and-safety and support dashboards, supplier SLA data, refund aging, and cohort retention
      segmented by market and operator.
    relatedQuestionRefs:
      - QM010
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Take rate, contribution margin, paid-acquisition intensity, repeat-booking cohorts, and supplier concentration by
      market.
    whyItMatters: >-
      Market growth does not establish that GetYourGuide can capture profitable share or retain demand without continued
      promotion.
    diligencePath: >-
      Reconcile audited marketplace revenue to GMV and inspect cohort, channel, supplier, and contribution-margin
      schedules.
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: >-
      Current realized take rates, operator-specific discounts, refund costs, and contribution economics by geography
      and activity category.
    whyItMatters: >-
      Without realized economics, public commission ranges cannot establish pricing power, supplier profitability, or
      room for competitive discounting.
    diligencePath: >-
      Request anonymized supplier contracts, take-rate cohorts, refund and support cost data, and direct-versus-OTA
      price-parity analysis.
    relatedQuestionRefs:
      - QP010
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: supplier-power
    missingEvidence: >-
      Supplier concentration, exclusive inventory share, multi-homing rate, channel concentration, and traveler
      repeat-booking cohorts.
    whyItMatters: >-
      These data determine whether the marketplace has durable liquidity and switching costs or mainly rents demand
      through paid and partner distribution.
    diligencePath: >-
      Request supplier and demand concentration cohorts, exclusive inventory definitions, repeat-booking curves, and
      channel-level acquisition economics.
    relatedQuestionRefs:
      - QP005
      - QP008
  - type: private-evidence-only
    severity: material
    topic: underwriting-model
    missingEvidence: >-
      Audited revenue, GMV, realized take rate, gross margin, contribution margin, CAC, payback, repeat cohorts, and
      cash conversion.
    whyItMatters: >-
      Without these inputs, marketplace scale and a commission range cannot establish revenue quality or sustainable
      unit economics.
    diligencePath: >-
      Obtain audited statements and a monthly cohort model segmented by channel, geography, activity category, and new
      versus repeat traveler.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI001
      - TI002
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Current unrestricted cash, burn, runway, debt and credit facilities, maturities, covenants, liquidation
      preferences, and next-round trigger.
    whyItMatters: >-
      Historical funding and debt events do not establish current liquidity, downside protection, or financing
      dependency.
    diligencePath: >-
      Review the latest balance sheet, cash forecast, debt documents, capitalization table, board financing plan, and
      covenant compliance certificates.
    relatedQuestionRefs:
      - QI006
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: refunds-and-service-costs
    missingEvidence: Current refund, cancellation, chargeback, supplier-failure, service-credit, and customer-support cost rates.
    whyItMatters: Anecdotal complaints identify possible leakage but cannot quantify its frequency, severity, or margin impact.
    diligencePath: >-
      Obtain monthly operational loss data, complaint cohorts, refund aging, chargeback reports, supplier suspension
      records, and insurance recoveries.
    relatedQuestionRefs:
      - QI007
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: technical-diligence
    missingEvidence: >-
      Current architecture diagrams, API contracts, cloud and data-store topology, dependency inventory, uptime,
      latency, error rates, recovery objectives, and capacity-test results.
    whyItMatters: >-
      The public operating model does not establish whether the marketplace and partner-integration boundary can meet
      peak-demand reliability or recover from partial failures.
    diligencePath: >-
      Request a technical architecture review with engineering leadership plus twelve months of availability, incident,
      latency, capacity, and disaster-recovery evidence.
    relatedQuestionRefs:
      - QE003
      - QE004
      - QE007
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: trust-and-security
    missingEvidence: >-
      Security and privacy certifications, penetration-test summary, data-flow and retention maps, fraud-loss data,
      supplier-screening controls, incident history, and control-test results.
    whyItMatters: >-
      Company trust promises and isolated external reviews do not quantify the effectiveness of controls protecting
      traveler data, payments, safety, and refunds.
    diligencePath: >-
      Obtain the security pack, privacy impact assessments, audit reports, incident register, supplier-removal log,
      refund SLA performance, and fraud and chargeback cohorts.
    relatedQuestionRefs:
      - QE006
      - QE008
  - type: missing-source
    severity: material
    topic: product-roadmap
    missingEvidence: >-
      A dated product roadmap with release status, owner, adoption measures, experiment results, and reliability or
      support-performance objectives.
    whyItMatters: >-
      Affiliate descriptions of recent AI features do not establish current adoption, accuracy, roadmap execution, or a
      durable technical advantage.
    diligencePath: >-
      Review the board-approved roadmap, release scorecards, feature-adoption cohorts, model-quality evaluations, and
      post-launch outcome reports.
    relatedQuestionRefs:
      - QE007
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: Traveler repeat-booking cohorts, supplier GRR and NRR, churn, renewal behavior, and contract-length distributions.
    whyItMatters: Reach and selected production examples cannot establish durable demand or supplier retention.
    diligencePath: >-
      Request monthly traveler and supplier cohort tables for at least 36 months, reconciled to bookings, GMV, take
      rate, and contribution margin.
    relatedQuestionRefs:
      - QU006
  - type: private-evidence-only
    severity: material
    topic: concentration
    missingEvidence: >-
      Top traveler, supplier, destination, and acquisition-channel shares of bookings, GMV, net revenue, and
      contribution profit.
    whyItMatters: >-
      Undisclosed concentration can make reported marketplace reach economically fragile or dependent on a small number
      of channels.
    diligencePath: >-
      Request top-10 and top-20 concentration schedules by supplier, destination, and channel, including direct, paid,
      partner, creator, and AI-assistant traffic.
    relatedQuestionRefs:
      - QU009
  - type: enumeration-incomplete
    severity: minor
    topic: named-supplier-proof
    missingEvidence: >-
      A complete list of named production suppliers with deployment dates, bookings, GMV, retention, and verified
      outcomes.
    whyItMatters: The retained named examples are selective and cannot establish representative supplier adoption or performance.
    diligencePath: >-
      Obtain a management-provided reference list and independently interview a stratified sample of large, medium, and
      small operators.
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: legal-regulatory
    missingEvidence: Current court, regulator, licensing-authority, and enforcement records across material jurisdictions.
    whyItMatters: >-
      Company terms describe contractual controls but cannot establish the absence, frequency, or severity of legal and
      regulatory actions.
    diligencePath: >-
      Run entity and affiliate searches in EU and US court and regulator databases, then reconcile results to
      management's litigation and compliance schedules.
    relatedQuestionRefs:
      - QR002
      - QR003
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: operational-outcomes
    missingEvidence: >-
      Supplier incident rates, cancellations, complaint cohorts, refund aging, booking reconciliation errors, security
      incidents, and remediation times.
    whyItMatters: >-
      Without denominators, documented controls and isolated complaints cannot establish actual loss frequency or
      mitigation effectiveness.
    diligencePath: >-
      Obtain monthly operating cohorts for at least 24 months, stratified by supplier, destination, connectivity
      partner, severity, and time to closure.
    relatedQuestionRefs:
      - QR001
      - QR004
      - QR005
      - QR008
      - QR009
  - type: private-evidence-only
    severity: material
    topic: concentration
    missingEvidence: >-
      Revenue, gross booking value, inventory, and outage concentration by supplier, connectivity partner, payment
      provider, destination, and acquisition channel.
    whyItMatters: >-
      A broad partner count does not show whether a small number of counterparties or destinations drives economics or
      operational exposure.
    diligencePath: >-
      Request concentration schedules, dependency maps, contract terms, redundancy tests, and modeled loss from each top
      counterparty failure.
    relatedQuestionRefs:
      - QR006
  - type: stale
    severity: material
    topic: financing
    missingEvidence: >-
      Current cash, revolving-credit utilization, covenant headroom, debt maturities, cash burn, working capital, and
      downside runway.
    whyItMatters: >-
      The June 2023 financing announcement records capital raised and facility size, not current liquidity or cash
      available as of the 2026 run date.
    diligencePath: >-
      Obtain current bank statements, debt agreements, borrowing-base reports, covenant calculations, audited accounts,
      and a monthly downside cash forecast.
    relatedQuestionRefs:
      - QR007
  - type: private-evidence-only
    severity: material
    topic: capital-stack-gap
    missingEvidence: Current fully diluted cap table, liquidation preferences, debt balances, covenants, and conversion terms.
    whyItMatters: >-
      Preference-adjusted ownership and proceeds determine whether the historical valuation can produce an acceptable
      equity return.
    diligencePath: >-
      Obtain the signed financing documents, debt schedule, option ledger, and waterfall model; reconcile them to the
      general ledger and board records.
    relatedQuestionRefs:
      - QV003
    relatedTableRefs:
      - TV001
      - TV003
  - type: private-evidence-only
    severity: material
    topic: financial-data-gap
    missingEvidence: >-
      Audited current revenue, gross booking value, take rate, margins, retention, acquisition cost, and cash-conversion
      data.
    whyItMatters: >-
      Comparable multiples and scenario returns cannot be applied without consistent denominators, periods, and verified
      unit economics.
    diligencePath: >-
      Review audited statements and monthly cohort and contribution-margin schedules through September 2026, then
      rebuild the valuation bridge.
    relatedQuestionRefs:
      - QV002
      - QV006
    relatedTableRefs:
      - TV001
      - TV003
  - type: missing-source
    severity: material
    topic: exit-readiness
    missingEvidence: Management's target exit path, timing, readiness milestones, and preference-adjusted return cases.
    whyItMatters: >-
      A target return and hold period require a credible liquidity path and an equity waterfall, neither of which is
      public.
    diligencePath: >-
      Interview management and lead investors, inspect board-approved strategic plans, and model IPO, strategic-sale,
      and secondary outcomes.
    relatedQuestionRefs:
      - QV009
    relatedTableRefs:
      - TV003
