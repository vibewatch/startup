  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: pricing-opacity
      missingEvidence: Buyer-level contract pricing, reimbursement take rates, and PMPM or PEPM economics for Nourish, Foodsmart, Omada, and Virta.
      whyItMatters: Public competitive positioning is directionally clear, but pricing power and margin durability cannot be judged without actual contract economics.
      diligencePath: Request recent payer, employer, and PBM contract templates plus realized reimbursement data by product line.
      relatedQuestionRefs:
        - QP019
      relatedTableRefs:
        - TP003
    - type: private-evidence-only
      severity: material
      topic: switching-costs
      missingEvidence: Renewal, retention, and displacement data by buyer cohort for Nourish and its closest competitors.
      whyItMatters: Switching costs are a core moat question, but public sources mostly describe channels and capabilities rather than actual buyer stickiness.
      diligencePath: Ask for gross and net retention by payer, employer, health-system, and consumer-origin cohort plus top churn reasons.
      relatedQuestionRefs:
        - QP020
      relatedTableRefs:
        - TP004
    - type: private-evidence-only
      severity: material
      topic: internal-build-risk
      missingEvidence: Evidence on whether plans, PBMs, or health systems prefer outsourcing to specialists versus expanding existing in-house workflows.
      whyItMatters: The internal-build route could cap category pricing power even if Nourish remains the best specialist vendor.
      diligencePath: Interview current and former payer, PBM, and health-system buyers about build-versus-buy decisions and failed pilots.
      relatedQuestionRefs:
        - QP022
      relatedTableRefs:
        - TP004
    - type: missing-source
      severity: minor
      topic: unsupported-cells
      missingEvidence: Clearer public proof for the weaker or unknown capability cells in competitor AI, medication, and regulatory-trust comparisons.
      whyItMatters: The overall directional matrix is supportable, but some second-order feature claims remain too qualitative for stronger scoring.
      diligencePath: Pull product documentation, customer case studies, or implementation material for each adjacent competitor before using more granular scores in investment memos.
      relatedQuestionRefs:
        - QP028
      relatedTableRefs:
        - TP002
