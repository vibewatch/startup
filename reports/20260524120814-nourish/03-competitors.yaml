  - id: TP004
    title: Moat durability / competitive risk register
    columns:
      - Moat or risk theme
      - Evidence-backed takeaway
      - Main threat
      - Severity
      - Mitigation or diligence ask
    rows:
      - - RD supply density
        - Nourish publicly discloses the largest RD network among direct peers
        - Fay or Berry Street can still bid for the same provider supply and patient demand
        - high
        - Test clinician retention, utilization, and productive-hours density by cohort
      - - Payer integration
        - Nourish and Fay both disclose broad insurer access around 200M covered lives
        - Payer access may commoditize if multiple vendors clear the same network hurdle
        - high
        - Request plan-level penetration, win rates, and renewal data rather than headline covered lives
      - - Scope breadth
        - Nourish has the broadest disclosed clinic scope with labs, medication management, and AI agents
        - Adjacent platforms can close feature gaps from stronger incumbent channels
        - high
        - Validate attach rates for labs, GLP-1, and non-RD extensions to see if breadth monetizes
      - - Channel ownership
        - Foodsmart and Omada already control large employer, health-plan, PBM, and provider routes
        - Buyer may prefer bundled vendors or internal build over specialist vendors
        - high
        - Ask which channels drive current bookings and what percent of revenue is concentration-exposed
      - - AI differentiation
        - Nourish, Fay, and Berry Street all market AI-enabled provider workflows
        - Admin automation may become table stakes rather than moat
        - medium
        - Focus diligence on outcome lift, staffing leverage, and proprietary data loops, not AI branding alone
      - - Public-market valuation durability
        - Hims, Teladoc, and WW show very different valuation outcomes for scaled health platforms
        - Later-stage valuation can compress if growth, trust, or margins disappoint
        - medium
        - Avoid underwriting software-like multiples without proof of durable retention and margin structure
      - - Internal build / likely entrants
        - Existing payer, PBM, and telehealth players already own adjacent assets and could extend further
        - New entrants may bundle nutrition into broader chronic-care or GLP-1 programs
        - high
        - Check buyer willingness to outsource versus expand current vendor or in-house stacks
    notes: >-
      Severity is qualitative: high means a risk can materially change win rates, pricing power, or retention within the next one to three years; medium means it is meaningful but more execution-dependent. Each row ties to public evidence rather than to speculative future scenarios.
