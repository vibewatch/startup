tables:
  - id: TP001
    title: Competitor profile table
    columns:
      - Company / option
      - Category
      - Disclosed scale / funding
      - Target buyer or user
      - Differentiation
      - Limitation versus Nourish
    rows:
      - - Nourish
        - Direct peer / reference point
        - 10,000+ RDs; 200M+ covered lives; $100M Series C; $215M total raised
        - Patients, health plans, employers, health systems, providers
        - Insurance-covered metabolic clinic with labs, GLP-1 management, AI agents, and referral depth
        - No public contract pricing and limited public revenue disclosure
      - - Fay
        - Direct peer
        - 2,300+ RDs; 200M+ covered Americans; $50M Series B at $500M valuation
        - Consumers, employers, physicians, payors
        - Strong payer integrations plus vertical AI for dietitian workflow automation
        - Narrower disclosed scope than Nourish on medical layering and referral depth
      - - Berry Street
        - Direct peer
        - 1,000+ RDs; $50M round; 1,250+ insurance-plan partnerships
        - Consumers and independent dietitian practices
        - Private-practice enablement plus AI back-office tooling and consumer app
        - Public record looks more enablement-led and less clinic-integrated than Nourish
      - - Foodsmart
        - Adjacent scaled player
        - 2.2M members; >$200M Rise Fund investment; 1,000+ employers
        - Health plans, employers, provider systems, members
        - Telenutrition plus food benefits, SNAP, food ordering, and foodscripts
        - Less explicitly positioned as a broad 1:1 virtual metabolic clinic than Nourish
      - - Omada
        - Adjacent scaled player
        - 1.02M members; $78M Q1 2026 revenue; PBM relationships with all top 3 PBMs
        - Employers, health plans, PBMs, health systems
        - Multi-condition cardiometabolic platform with GLP-1 support and strong enterprise distribution
        - Nutrition is only one component inside a broader chronic-care model
      - - Virta
        - Adjacent scaled player
        - Medication-reduction positioning; national health-plan partnerships
        - Health plans, employers, members with metabolic disease
        - Disease-reversal framing with coaching, care teams, and app support
        - Less explicit public evidence of broad insurance-covered RD marketplace scale
      - - Hims
        - Substitute / consumer-facing option
        - $5.5B market cap; $608.1M Q1 FY26 revenue on Yahoo
        - Cash-pay consumers seeking convenience and weight-loss access
        - Closed-loop pharmacy, telehealth, and brand reach across many categories
        - No insurance acceptance and not dietitian-led
      - - Traditional in-person dietitian
        - Status quo substitute
        - Existing offline care base inside a 90,900-job U.S. workforce
        - Patients using clinics, hospitals, or local practices
        - Familiar clinical trust and face-to-face care
        - Fragmented discovery, variable access, and weaker software-enabled convenience
      - - Internal build / incumbent stack
        - Status quo / internal build
        - Budget often embedded inside existing payer, PBM, or provider operations
        - Health plans, PBMs, employers, health systems
        - Can bundle nutrition support into existing care-management or GLP-1 workflows
        - Usually lacks the specialized RD supply density Nourish discloses publicly
    notes: >-
      This table is exhaustive for the material alternative classes required by the chapter brief as of 2026-05-24: direct peers, adjacent scaled players, substitutes, status quo, and internal-build routes. Scale and funding fields use only publicly disclosed figures from the local fetch pack; unknown contract economics are intentionally left qualitative.
