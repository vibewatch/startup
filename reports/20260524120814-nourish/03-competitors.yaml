  - id: scaled-adjacencies
    title: Foodsmart, Omada, and Virta compete through bigger channel or care-model wedges
    body: >-
      The more strategically dangerous competitors may be adjacent platforms that do not look like pure dietitian marketplaces. Foodsmart competes through a broader “Foodcare” stack that joins telenutrition to food benefits management, meal planning, online food ordering, SNAP support, and provider “foodscripts.” Its 2024 financing materials say it serves more than 2.2 million members through Medicaid managed care, Medicare Advantage, commercial insurers, and more than one thousand employers, which means it enters buyer conversations with a broader benefits and social-determinants story than Nourish currently discloses. Omada attacks from a different angle: its May 2026 results say it had 1.02 million members, $78 million of quarterly revenue, relationships with all three leading PBMs, and GLP-1 support embedded inside a larger multi-condition cardiometabolic platform. Virta is narrower in buyer type but still important because it markets reversal of metabolic disease and medication reduction rather than dietitian access alone, supported by coaching, clinical teams, and a health-plan-facing posture.

      These companies matter because they change what “competition” means for Nourish. Against Fay and Berry Street, the fight is mostly over provider network density, insurance workflows, and patient matching. Against Foodsmart and Omada, the fight shifts toward enterprise channel ownership, breadth of condition coverage, and whether buyers prefer a specialized dietitian-led vendor or a broader medical-management platform. Against Virta, the comparison is more clinical and trust-oriented: Virta’s promise is disease reversal and fewer medications, while Nourish’s public story is nutrition-first metabolic care that can layer medication management when needed. Nourish’s disclosed advantage remains breadth inside an RD-centered clinic, but adjacent platforms prove that large buyers may reward broader solution bundles or stronger preexisting distribution even when the nutrition component is only one part of the package.
