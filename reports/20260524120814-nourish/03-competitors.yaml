  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - Company / option
      - Public price or contract model
      - What is included publicly
      - Unknowns
      - Implication
    rows:
      - - Nourish
        - Insurance-covered; 94% of in-network patients pay $0 out of pocket; fallback out-of-pocket rate $145 on GLP-1 page
        - RD visits, messaging, GLP-1 pathways, and broader metabolic support depending on need
        - No public payer contract economics or employer PMPM
        - Attractive consumer access, but buyer economics still need diligence
      - - Fay
        - As low as $0 per session with insurance
        - Dietitian matching, app support, insurance billing, AI-enabled provider workflow
        - No public enterprise pricing and plan-specific cost variance remains
        - Strong consumer affordability positioning in direct competition with Nourish
      - - Berry Street
        - Typically 100% covered by insurance with $0 out of pocket per Fierce
        - One-on-one counseling, consumer app, and AI-enabled practice tools
        - No disclosed enterprise pricing or utilization economics
        - Competes well on affordability but less transparently on broader care scope
      - - Foodsmart
        - Contracted health-plan / employer model; public unit pricing not disclosed
        - Telenutrition plus food-buying and food-benefit services
        - No public PMPM, PEPM, or visit pricing
        - Buyer appeal may come from bundled ROI rather than consumer list price
      - - Omada
        - Contracted employer / health-plan / PBM model; public unit pricing not disclosed
        - Multi-condition virtual care plus GLP-1 support
        - No public pricing by condition or channel
        - Competes through enterprise budget ownership, not consumer affordability claims
      - - Virta
        - Public consumer or payer pricing not disclosed on retained page
        - Coaching, care team, app, and metabolic-disease program
        - No public unit pricing, contract duration, or reimbursement mix
        - Buyer decision rests on outcomes and medication reduction claims rather than list price
      - - Hims
        - Direct customer payment; insurance not accepted
        - Telehealth consults, pharmacy fulfillment, subscriptions, and branded or compounded GLP-1 access
        - Package economics vary by therapy and are not comparable to insurance-covered RD care
        - Strong substitute for convenience-seeking consumers but weak match for payer buyers
      - - Traditional in-person dietitian
        - Varies by clinic and insurance plan
        - Face-to-face counseling and existing local clinical relationships
        - Publicly comparable pricing is fragmented
        - Status quo remains viable but less standardized and less software-enabled
    notes: >-
      This table intentionally mixes public consumer pricing signals with contract-model disclosures because enterprise PMPM or visit economics are not publicly available for most scaled competitors. Unknown means the local fetch pack did not provide enough specificity to state a price without guessing.
