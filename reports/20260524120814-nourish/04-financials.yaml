- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Why it matters
  - Current public proxy
  - Impact on underwriting
  - Exact diligence path
  rows:
  - - Recognized revenue / ARR
    - Determines scale, growth quality, and usable comp set
    - Tripled YoY claim; public comps only
    - Business size still cannot be independently measured
    - Request monthly revenue, quarterly revenue, ARR if tracked, and revenue by payer segment
  - - Gross margin / contribution margin
    - Tests whether W-2 care delivery and AI can scale profitably
    - AI narrative plus labor benchmark only
    - Long-term margin path remains speculative
    - Request gross margin by visit type and cohort contribution margins
  - - Collections and denial rate
    - Separates billed claims from cash revenue
    - Nourish Guarantee implies claims volatility exists
    - Revenue quality could be weaker than visit growth suggests
    - Request allowed amounts, collected amounts, denials, and write-offs by payer
  - - Payer / channel concentration
    - Shows renewal risk and reimbursement dependence
    - 200M covered lives and 250 health systems are access metrics, not mix data
    - A few plans or systems could drive outsized exposure
    - Request top-10 customer concentration and revenue by channel
  - - Clinician utilization / productivity
    - Explains labor leverage under the W-2 model
    - 81% second-visit rate and AI tooling are rough proxies only
    - Idle capacity or low panel density could compress margins
    - Request sessions per RD, fill rates, no-show rates, and documentation-time savings
  - - Cash balance / burn / runway
    - Determines whether Series C is offensive capital or survival capital
    - Total capital raised of $215M only
    - Capital adequacy cannot be underwritten from public evidence
    - Request current cash, monthly burn, runway, and downside operating plan
  notes: Each row names a private metric that would materially improve the underwriting quality of this chapter. Public proxies are deliberately listed as proxies, not substitutes for direct disclosure.
