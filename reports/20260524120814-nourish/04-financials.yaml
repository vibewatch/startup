company:
  name: Nourish
chapter:
  number: 4
  title: Financials
  summary: 'Nourish’s public financial picture is strongest where reimbursement quality and access signals overlap: insurer-paid virtual dietitian visits appear to be the core revenue engine, 94% of in-network patients reportedly pay $0 out of pocket, referral channels look broad, and company materials now pair clinical outcomes with payer-ROI claims. The harder underwrite problem is not demand but disclosure. Despite $215 million of total capital raised through the 2026 Series C, the company still does not publish revenue, gross margin, burn, cash, runway, or realized reimbursement by payer, so the chapter’s verdict is positive on revenue quality but cautious on margin path and capital adequacy.'
sections:
- id: reimbursement-engine
  title: Insurance reimbursement is the core revenue engine, while partnerships mainly widen distribution
  body: 'Nourish’s public record supports a simple but commercially attractive core revenue model: acquire or receive a patient, verify benefits, match that patient to a registered dietitian, deliver virtual care, and bill the insurer rather than relying on direct consumer spend. Forbes explicitly framed the model as hiring licensed dietitians, connecting them with patients through a virtual platform, and billing insurance companies directly. The company’s billing PDF and insurance FAQ reinforce that same structure. Nourish says 94% of in-network patients pay $0 out of pocket, handles in-network claims itself, and uses a no-surprise billing guarantee that waives charges for already completed denied or deductible-hit sessions. Self-pay exists, but publicly it looks like a fallback valve at $145 per session rather than the core economics.


    The more nuanced point is how Nourish’s secondary channels fit around that engine. The company says patients come from digital marketing, referrals, insurance directories, existing-patient word of mouth, and partnerships with health systems and employers. The Community Health Network partnership and the 2026 Series C materials imply that health systems, employers, and plans are mostly distribution and contracting layers around the same insurer-paid visit flow, not separately disclosed standalone revenue lines. That is strategically positive because broader channels should lower friction and improve referral density, but it also keeps the chapter anchored on reimbursement quality rather than on software-style subscription math. The one clearly adverse reimbursement signal is Medicaid: the April 2025 Series B press release said Nourish partnered with Medicaid plans, while the current FAQ says Medicaid is not accepted. That contradiction is a real signal of payer-scope volatility, even
    if the underlying reason remains undisclosed.'
