- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Unit
  - Current value / status
  - Quality
  - Diligence ask
  rows:
  - - Insurance-reimbursed virtual RD visits
    - Virtual sessions billed to commercial or Medicare plans after benefit verification
    - Per session / episode
    - Core disclosed engine; 94% of in-network patients reportedly pay $0 OOP, but realized reimbursement is undisclosed
    - High strategic importance, medium disclosure
    - Request payer mix, average allowed amount, net collection rate, and denial or write-off rate
  - - Medicare MNT visits
    - Part B medical nutrition therapy coverage for diabetes or renal disease with referral
    - Per covered hour / visit
    - Coverage exists, but eligibility is narrow and diagnosis constrained
    - Well corroborated, structurally limited
    - Request Medicare visit share, diagnosis mix, and reimbursement by claim
  - - Self-pay visits
    - Patient-paid fallback when coverage is absent or future visits are not covered
    - USD per session
    - $145 per session list price
    - Transparent price, low mix visibility
    - Request self-pay visit share and conversion after denial or deductible events
  - - Health-system referral channel
    - Providers refer into Nourish and patients then use insurance-covered visits
    - Referred patients / converted visits
    - 250+ health systems disclosed; appointments offered within 24 hours after referral
    - Strong distribution signal, monetization indirect
    - Request referral-to-booking and referral-to-paid-visit conversion by system
  - - Employer / health-plan partnerships
    - Contracting and member-access layer that feeds reimbursed visits
    - Contracts / covered lives
    - 200M covered lives disclosed; no PMPM, PEPM, or realized contract pricing public
    - Strategically important, economically opaque
    - Request contract type, pricing basis, and concentration by partner
  - - Labs / GLP-1 / medication layer
    - Adjunct services deepen care around the nutrition visit
    - Attach rate / billed service
    - Labs and medication management disclosed; billing party and margin are not public
    - Potentially valuable, low transparency
    - Request attach rates, who bills medical services, and incremental gross margin
  notes: Rows separate the core insurer-paid visit engine from distribution channels and adjunct services. Public evidence is strongest on access and weakest on realized reimbursement and revenue mix.
