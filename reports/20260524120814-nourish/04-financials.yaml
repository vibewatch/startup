- id: FI001
  title: Revenue model bridge
  type: flow
  layout: wide
  summary: Nourish’s public materials describe a reimbursement-first model in which marketing and referral channels feed covered virtual dietitian visits, insurer adjudication, and only then occasional self-pay fallback.
  approximationNotes: This bridge maps the public operating logic rather than audited accounting flows. It shows where cash appears to enter the system, not recognized revenue policy.
  data:
    nodes:
    - id: acquire
      label: Patient acquisition
      detail: Digital marketing, employer and health-system partnerships, insurance directories, word of mouth, and provider referrals feed the funnel.
    - id: verify
      label: Benefit verification
      detail: Coverage is checked up front and Nourish estimates patient cost before care.
    - id: care
      label: Virtual RD session
      detail: Insurance-covered nutrition visits remain the core disclosed service.
    - id: claims
      label: Claim adjudication
      detail: Nourish bills in-network plans directly and monitors claims status inside the patient portal.
    - id: fallback
      label: Self-pay fallback
      detail: If future visits are uncovered, the public fallback price is $145 per session.
    - id: grossprofit
      label: Net revenue pool
      detail: Collections then absorb clinician labor, benefits, admin, and claims operations before any gross profit remains.
