- id: capital-adequacy
  title: Capital raised is substantial, but runway still cannot be underwritten from public sources
  body: 'Nourish has clearly raised enough capital to build a national platform. The company’s financing chronology now totals $215 million: a $35 million Series A in 2024, a $70 million Series B in 2025, and a $100 million Series C in 2026. Just as important as the size is the use-of-funds language. Series B was aimed at product development, RD-network expansion, and strategic partnerships, while Series C added clinical-network growth, AI agents, deeper plan/employer/system partnerships, and expansion of the metabolic-clinic model. That framing makes the latest round look more like acceleration capital than a rescue financing, especially alongside the company’s claim that it has more than tripled year over year by mid-2026.


    Even so, public capital adequacy remains impossible to underwrite with precision because the core cash-flow inputs are missing. None of the retained Nourish sources publishes cash on hand, monthly burn, runway, current revenue, or gross margin. That matters because the gap between “raised a large round” and “has enough runway to reach durable self-sufficiency” can be very wide in care-delivery businesses with significant labor expense and ongoing product investment. Public comps illustrate the valuation sensitivity around those unknowns. Omada shows that a reimbursement-linked virtual-care business can get to positive adjusted EBITDA with 62% gross margin and a meaningful cash buffer. Hims shows how much larger market value can become in a consumer-led model with disclosed revenue scale. Teladoc and WW show the opposite lesson: scale alone does not protect valuation once margin structure or growth quality disappoints. Nourish therefore looks well financed in absolute dollars, but still
    not financeable from public data alone without a private view of cash, burn, and collections.'
