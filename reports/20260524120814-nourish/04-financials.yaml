  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: Current cash balance, monthly burn, and runway scenario cases.
    whyItMatters: Without cash and burn, the Series C cannot be judged as expansion capital versus bridge capital.
    diligencePath: Request board materials or monthly reporting that show cash, operating cash flow, hiring plan, and runway under base/upside/downside scenarios.
    relatedQuestionRefs:
    - QI020
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: material
    topic: revenue-disclosure
    missingEvidence: Recognized revenue, ARR, and payer collections by month or quarter.
    whyItMatters: The chapter can describe access and outcomes, but it still cannot size Nourish’s actual revenue base.
    diligencePath: Request monthly revenue, quarterly revenue, ARR if tracked, and reconciliations from billed claims to collected cash by payer.
    relatedQuestionRefs:
    - QI021
    relatedTableRefs:
    - TI005
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Average reimbursement per visit, denial rate, write-offs, clinician utilization, and CAC/payback by channel.
    whyItMatters: These inputs determine whether the W-2 model and AI stack actually create a scalable margin structure.
    diligencePath: Request cohort-level unit economics for commercial, Medicare, self-pay, and referral-driven segments.
    relatedQuestionRefs:
    - QI021
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: material
    topic: channel-mix
    missingEvidence: Revenue concentration by health plan, employer, health system, and referral source.
    whyItMatters: Broad covered lives and partner counts can hide concentration or weak monetization in specific channels.
    diligencePath: Request top-10 customer concentration, revenue by channel, and conversion from referral to paid visit.
    relatedQuestionRefs:
    - QI020
    - QI021
    relatedTableRefs:
    - TI001
    - TI005
  - type: conflicting-data
    severity: minor
    topic: medicaid-coverage
    missingEvidence: A dated explanation of why 2025 fundraising materials referenced Medicaid plans while the current FAQ says Medicaid is not accepted.
    whyItMatters: The contradiction may reflect contracting changes, carve-outs, or product scoping that matter for future reimbursement risk.
    diligencePath: Ask management for the timeline, affected states or plan types, and whether Medicaid re-entry is planned.
    relatedQuestionRefs:
    - QI005
