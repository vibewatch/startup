  topStrengths:
    - 供给已具全国规模：10,000+ 注册营养师，覆盖全部 50 个州。
    - 支付方准入主张强，报道称 94% 的网内患者自付为 $0。
    - 临床证据真实，覆盖体重、A1C、LDL、GLP-1 支持，以及据称 3.1x 的健康计划 ROI。
    - 分销正在扩展，触达健康计划、雇主和 250+ 个健康系统转诊关系。
    - AI 原生工作流和代谢诊所扩张把服务深度推到基础远程营养之外。
  topRisks:
