    - 当前不接受 Medicaid 与早期扩张表述冲突，凸显报销波动。
    - GLP-1 和肥胖覆盖政策变化可能压制代谢护理扩张逻辑。
    - 10,000 名营养师网络带来质量控制、资质核验和运营一致性风险。
    - 隐私、安全和治理披露落后于公司当前临床抱负和估值。
