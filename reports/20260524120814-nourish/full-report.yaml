      - number: '4.5'
        title: 'Financial verdict: promising reimbursement quality, material disclosure gaps, and real policy risk'
        blocks:
          - type: paragraph
            body: >-
              The best-supported financial verdict is positive on revenue quality but cautious on margin path and
              capital adequacy. Nourish appears to have a real reimbursement-led engine, low patient price friction,
              strong referral and partner distribution, and a set of outcomes claims that can plausibly support payer
              renewals. The model also has strategic depth beyond basic tele-nutrition because the company now layers
              labs, GLP-1 management, coordinated care, and AI workflow tools around the visit. Those traits make the
              business look more durable than a cash-pay wellness app and more defensible than a simple provider
              directory.


              Goodwin’s analysis of post-2025 Medicaid cuts points to a tougher reimbursement backdrop for businesses
              with any public-program exposure, and KFF shows that GLP-1 obesity coverage in Medicaid remains both
              limited and optional for states. That does not break Nourish’s model—its core story is nutrition-first,
              not drug-only—but it does constrain upside for any metabolic-care offering that assumes wide drug
              reimbursement or public-program stability. More importantly, the biggest blockers are still internal
              economics that the company has chosen not to publish: recognized revenue, payer take rates, denials,
              clinician utilization, gross margin, burn, and runway. Until those are shared privately, the correct
              posture is not skepticism about demand but discipline about underwriting. Revenue quality looks promising;
              revenue magnitude, margin durability, and financing dependency remain under-disclosed.
            claimRefs:
