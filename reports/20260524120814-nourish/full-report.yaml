  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Direct peers Fay and Berry Street are the closest product substitutes
        blocks:
          - type: paragraph
            body: >-
              Nourish’s clearest direct competitors are Fay and Berry Street because all three market insurance-covered
              access to registered dietitians and frame nutrition support as a longitudinal answer to chronic-disease
              and GLP-1 demand rather than as a one-off wellness content product. Public evidence still shows meaningful
              separation inside that peer set. Nourish’s May 2026 Series C post says the company has more than 10,000
              dietitians, millions of appointments, more than 200 million covered lives, health-plan partnerships,
              health-system referrals, AI agents for patients and providers, and medical extensions such as labs and
              GLP-1 prescribing. Fay’s February 2025 materials are substantial but narrower: they say Fay had raised $50
              million at a $500 million valuation, had more than 2,300 dietitians, reached more than 200 million
              Americans through payor integrations, and used vertical AI to automate claims, scheduling, and follow-up.
              Berry Street’s positioning is narrower again around private-practice enablement: third-party coverage says
              it had more than 1,000 dietitians, 1,250-plus insurance-plan partnerships, AI-enabled back-office tooling,
              and a consumer app, but its public record is still more marketplace-like than clinic-like.

              The practical implication is that Fay and Berry Street are credible enough to prevent Nourish from
              behaving like a monopolist in insurance-covered nutrition care, but neither direct peer matches Nourish’s
              disclosed combination of provider scale, referral depth, and broader metabolic-care layering. Fay looks
              strongest where payer integrations, employer logos, and AI workflow support matter; Berry Street looks
              strongest where empowering independent dietitian practices and unlocking underused insurance benefits
              matter. Nourish appears strongest where buyers want a more integrated metabolic clinic with broader trust
              posture, clinical scope, and health-system interoperability. That supports a nuanced conclusion:
              direct-peer risk is real on dietitian supply and insurance discovery, but Nourish’s biggest edge is not
              merely “more dietitians.” It is the coupling of scale with payer distribution, coordinated care, and a
              more explicit GLP-1-plus-metabolic workflow.
