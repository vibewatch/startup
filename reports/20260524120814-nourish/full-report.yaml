      - number: '2.2'
        title: Supply Constraints and Reimbursement Architecture
        blocks:
          - type: paragraph
            body: >-
              Supply and reimbursement architecture make this market harder than consumer demand alone suggests. BLS
              counted 90,900 dietitian and nutritionist jobs in 2024 and projected 6% growth through 2034, with 6,200
              average annual openings. BLS also notes that practitioners usually need a degree, supervised training, and
              state licensure or equivalent requirements, which means telehealth nutrition capacity cannot scale as
              quickly as a software-only marketplace. Nourish’s own supply story is therefore strategically material: it
              said it had 6,000-plus dietitians in 2025 and more than 10,000 by May 2026, which is a meaningful share of
              the total occupation.


              Reimbursement broadens demand but also fragments it. HHS’s telenutrition billing guide says CPT codes
              97802, 97803, and 97804 are permanently covered for telehealth, creating a durable regulatory base for
              virtual medical nutrition therapy. CMS’s national coverage determination keeps Medicare MNT narrow,
              however, by focusing on diabetes and renal disease; Nourish’s Medicare FAQ translates that into diabetes
              or kidney disease plus a doctor’s referral. CCHP’s Fall 2025 survey shows every state, DC, and Puerto Rico
              have some Medicaid telehealth reimbursement, but modality, parity, and billing rules remain uneven, and
              only 24 states plus Puerto Rico have explicit private-payer payment parity. That means Nourish’s market is
              supported by real reimbursement infrastructure, but monetization still depends on jurisdiction, benefit
              design, credentialing, and diagnosis eligibility rather than simple top-of-funnel awareness.
            claimRefs:
