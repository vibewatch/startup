  - id: FV001
    title: Recommendation logic flow
    type: flow
    layout: standard
    summary: How scale, proof, comp compression, and disclosure gaps combine into a track recommendation.
    data:
      nodes:
        - id: scale
          label: 'Scale proof: 500k+ people, 10,000+ dietitians, millions of appointments'
          type: input
        - id: outcomes
          label: 'Clinical proof: weight, A1C, LDL, ROI evidence'
          type: input
        - id: privatecomp
          label: 'Private support: premium to Fay is directionally explainable'
          type: input
        - id: publiccomp
          label: 'Public drag: Omada/Hims/TDOC/WW multiples are far lower'
          type: input
        - id: gaps
          label: 'Key gaps: revenue, margin, payer mix, cap table'
          type: input
        - id: synthesis
          label: 'Synthesis: good company, demanding price, limited margin of safety'
          type: process
        - id: decision
          label: 'Decision: Track / medium confidence / high risk / stretched valuation'
          type: output
      edges:
        - from: scale
          to: synthesis
        - from: outcomes
          to: synthesis
        - from: privatecomp
          to: synthesis
        - from: publiccomp
          to: synthesis
        - from: gaps
          to: synthesis
        - from: synthesis
          to: decision
    approximationNotes: null
    claimRefs:
      - CV014
      - CV029
      - CV041
      - CV042
      - CV043
      - CV044
      - CV048
  - id: FV002
    title: Valuation sensitivity bar
    type: bar
    layout: wide
    summary: >-
      Estimated annual revenue Nourish would need to justify a $1.75B valuation under different revenue-multiple
      assumptions.
    data:
      items:
        - label: At ~1.9x revenue (Hims-like public growth comp)
          value: 921
          unit: USD M
        - label: At ~3.0x revenue (Omada-like public comp)
          value: 585
          unit: USD M
        - label: At 5.0x revenue (rich growth premium)
          value: 350
          unit: USD M
        - label: At 6.0x revenue (generous private-growth case)
          value: 292
          unit: USD M
        - label: At 8.0x revenue (very bullish private case)
          value: 219
          unit: USD M
    approximationNotes: >-
      These are required-revenue calculations, not reported Nourish revenue. They simply divide the reported $1.75B
      valuation by different multiple assumptions.
    claimRefs:
      - CV023
      - CV026
      - CV029
      - CV030
      - CV031
      - CV032
  - id: FV003
    title: Valuation / return range
    type: range
    layout: wide
    summary: >-
      Bear, base, and bull valuation ranges around the reported 2026 Series C mark, using explicitly estimated revenue
      assumptions.
    data:
      items:
        - label: Bear case
          low: 0.8
          mid: 1
          high: 1.2
          unit: USD B
        - label: Base case
          low: 1.4
          mid: 1.6
          high: 1.8
          unit: USD B
        - label: Bull case
          low: 2.2
          mid: 2.5
          high: 2.8
          unit: USD B
        - label: Reported current mark
          low: 1.7
          mid: 1.75
          high: 1.8
          unit: USD B
    approximationNotes: >-
      Ranges reflect scenario assumptions in the chapter and are built from estimated revenue bands plus multiple ranges
      because Nourish does not disclose revenue publicly.
    claimRefs:
      - CV006
      - CV007
      - CV038
      - CV039
      - CV040
      - CV050
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: wide
    summary: IC-style scoring across seven valuation-relevant dimensions on a 1-5 scale, with 5 meaning strongest support.
    data:
      items:
        - label: Market tailwind
          value: 4
          note: Large chronic-disease and metabolic-care demand backdrop.
        - label: Operating proof
          value: 4
          note: Scale, outcomes, ROI, and health-system proof are all visible.
        - label: Competitive position
          value: 4
          note: Nourish appears ahead of closest private nutrition-care peers on disclosed scale.
        - label: Revenue visibility
          value: 1
          note: Public revenue and margin disclosure are still missing.
        - label: Reimbursement durability
          value: 2
          note: Insurance-led model is attractive but exposed to policy and coverage shifts.
        - label: Valuation discipline
          value: 2
          note: Current price already assumes strong future revenue disclosure.
        - label: Evidence quality
          value: 2
          note: Official operating proof is strong, but valuation evidence chain is incomplete.
    approximationNotes: Scores are judgment aids only and should not be interpreted as a standalone investment model.
    claimRefs:
      - CV008
      - CV009
      - CV018
      - CV029
      - CV033
      - CV042
      - CV043
      - CV044
