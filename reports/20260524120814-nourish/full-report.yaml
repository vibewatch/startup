        title: Scale, Milestones, Contradictions, and Remaining Gaps
        blocks:
          - type: paragraph
            body: >-
              Scale markers are plentiful, but they do not eliminate contradictions. The 2025 Impact Report says Nourish
              had already served 500,000 patients and scaled to more than 6,000 dietitians, added lab services, and
              delivered a 3.1x first-year ROI for health-plan partners. Current outcomes pages add concrete clinical
              markers such as 8% average weight loss, a 1.3-point A1C reduction, and a 31-point LDL reduction, while
