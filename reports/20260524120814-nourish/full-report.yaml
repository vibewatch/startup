companyProfile:
  summary: >
    Nourish is a U.S. virtual nutrition and metabolic-care platform founded in 2021 by Aidan Dewar, Sam Perkins, and
    Stephanie Liu. The company connects patients to registered dietitians through an insurance-covered telehealth model
    and has expanded from nutrition counseling into a broader AI-native metabolic clinic with labs, GLP-1-related
    support, and coordinated virtual care. By May 2026, Nourish said it had more than 10,000 registered dietitians,
    millions of completed appointments, more than 200 million covered lives, and referrals from over 250 health systems,
    while public evidence also showed 500,000 patients served in 2025 and a reported 3.1x first-year ROI for health-plan
    partners.
