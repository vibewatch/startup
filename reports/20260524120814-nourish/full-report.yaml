      - number: '2.4'
        title: Sizing Lenses, Adoption Constraints, and Explicit Caveats
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports several sizing lenses but not a clean, investable TAM/SAM/SOM stack. The broadest
              need proxy is CDC’s chronic-disease burden; narrower need proxies are the 40.1 million people with
              diabetes and 115.2 million adults with prediabetes in 2023; access proxies are Nourish’s 200 million
              covered lives and all-50-state footprint; realized-penetration proxies are 500,000 patients served in 2025
              and Nourish’s own claim that fewer than 1% of eligible Americans use their covered RD benefit. Those
              numbers are directionally useful because they show a large gap between need, theoretical coverage, and
              actual utilization. They are not additive. Condition counts overlap, covered lives are not equivalent to
              eligible reimbursable members, and Medicare MNT rules exclude large portions of the disease burden.


              The key constraints are equally explicit. Goodwin argues 2025 Medicaid cuts could shrink enrollment and
              reimbursement in uneven state patterns, while Dickinson Wright argues that telehealth weight-loss
              platforms face CPOM and fee-splitting risk if corporate operators influence clinical protocols or
              prescribing. Nourish’s own public materials also preserve a coverage contradiction: its 2025 Series B
              language referenced Medicaid-plan partnerships, but the current Medicaid FAQ says the platform does not
              accept Medicaid. That inconsistency is exactly why this chapter uses sizing lenses instead of a single TAM
              number. The investable thesis is a large but regulation-heavy market where access expansion depends on
              payer operations, state policy, diagnosis specificity, and provider supply discipline as much as on
              disease prevalence.
