  - id: FE004
    title: Product maturity / capability matrix
    type: matrix
    layout: wide
    summary: >-
      Workflow maturity is highest in the visible care-delivery loops and lower in the publicly disclosed technical
      underlay beneath them.
    data:
      columns:
        - Workflow maturity
        - Disclosure depth
        - Comments
      rows:
        - label: Patient onboarding + insurance verification
          values:
            - High
            - Medium
            - Clearly visible on current product pages, but no conversion or denial metrics are public
        - label: Recurring RD visits + between-visit app support
          values:
            - High
            - Medium
            - The core loop is well described across home, condition, and recruiting pages
        - label: AI patient support features
          values:
            - Medium
            - Low
            - Meal tracking and AI-agent claims are public, but model governance is not
        - label: Provider copilot + AI charting
          values:
            - Medium
            - Low
