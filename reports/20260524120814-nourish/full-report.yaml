      - number: '1.3'
        title: Capital Formation and Stakeholder Map
        blocks:
          - type: paragraph
            body: >-
              The capital story is strong on fundraising momentum and weaker on pricing detail. Third-party reporting
              says Nourish raised a $35 million Series A in March 2024. Official disclosures then show a $70 million
              Series B in 2025 that brought total funding to $115 million, followed by a $100 million Series C in May
              2026 that lifted total funding to $215 million. The investor roster is unusually consistent for a young
              care-delivery platform: J.P. Morgan led the Series B; Menlo led the Series C; and Thrive Capital, Index
              Ventures, Y Combinator, Maverick, BoxGroup, Atomico, and others reappeared. That repeat participation
              matters because Nourish’s model depends on coordinating three scarce constituencies at once: patients,
              payer reimbursement, and a massive dietitian network. Public channel disclosures support that thesis.
              Nourish says patients come through digital marketing, physicians, health systems, employers, insurance
              directories, and word of mouth, while Series C materials add hundreds of plans, more than 200 million
              covered lives, and referrals from more than 250 health systems. The unresolved question is valuation
              transparency: official releases disclose capital raised but not a cap-table price, even as third-party
              outlets peg the Series C at $1.75 billion.
