            title: Coverage breadth is not the same thing as stable reimbursement
            body: >-
              The current Medicaid FAQ, limited Medicaid obesity-drug coverage, and potential federal Medicaid cuts all
              point in the same direction: public-program demand can be broad in theory and still unstable in practice.
