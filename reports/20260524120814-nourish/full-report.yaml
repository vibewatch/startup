        title: Exhibits
        blocks:
          - type: callout
            title: Permanent telehealth coding plus underused covered benefits create real whitespace
            body: >-
              Permanent telehealth MNT billing and Nourish’s claim that fewer than 1% of eligible Americans use covered
              RD benefits together suggest a real adoption runway if referral and benefit-verification workflows
              improve.
            calloutType: strength
