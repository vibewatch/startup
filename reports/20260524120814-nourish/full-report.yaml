        - from: cpom
          to: unit
          label: service-scope constraint
        - from: cpom
          to: valuation
          label: restructuring risk
        - from: privacy
          to: channels
          label: trust + enterprise diligence
        - from: quality
          to: channels
          label: provider + system confidence
        - from: quality
          to: unit
          label: retention + claims quality
        - from: unit
          to: valuation
          label: growth durability + margins
    approximationNotes: The DAG shows directional transmission, not causal certainty or time sequencing.
