      - number: '4.2'
        title: >-
          Outcomes, engagement, and payer ROI support revenue quality better than they support realized pricing
          disclosure
        blocks:
          - type: paragraph
            body: >-
              Public evidence for revenue quality is better than public evidence for revenue magnitude. Nourish’s 2025
              impact-report post says health-plan partners saw an independently validated 3.1x ROI in year one, while
              the 2026 Series C materials say the model drives more than $2,000 in annual savings per patient for health
              plans. On the clinical side, the outcomes page discloses 8% average weight loss after 12 months for
              patients not on weight-loss drugs, 1.3% average A1C reduction after 6 months, 31 mg/dL LDL reduction after
              6 months, and 33% more weight loss for GLP-1 patients paired with Nourish. Those are company-claimed
              metrics rather than audited payer data, but they still matter because reimbursement-led care platforms
              usually need to defend renewal budgets with some combination of measurable outcomes, lower medical spend,
              and positive patient experience.


              Engagement signals point in the same direction. Nourish says 81% of patients return for a second visit and
              90% make progress toward health goals after three months. Those are not substitutes for payer-level
              retention, denied-claim trends, or net revenue retention, but they do suggest the platform behaves more
              like a recurring care model than like one-off nutrition content. The problem is that realized economics
              remain opaque. The retained sources show what patients often pay, what outcomes the company says it can
              produce, and how management talks about payer ROI, but they do not reveal the average allowed amount per
              visit, the collected amount after denials, the share of volume by payer type, or the contract structures
              behind employer and health-plan partnerships. In other words, the top of the funnel and the clinical value
              story are visible, while the revenue-recognition layer underneath them is not.
