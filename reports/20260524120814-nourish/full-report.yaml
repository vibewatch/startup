      - number: '4.3'
        title: The W-2 clinician model and centralized operations likely trade margin pressure for control and consistency
        blocks:
          - type: paragraph
            body: >-
              Nourish’s cost structure appears more labor-heavy than a pure marketplace because the company says its
              dietitians are W-2 employees, not contractors. The recruiting page also says dietitians receive flat
              guaranteed session rates, employer-paid benefits, and centralized help on claims, credentialing,
              multi-state licensing, and patient acquisition, with just 15 sessions per week qualifying for full-time
              benefits. That setup should improve care standardization, scheduling control, and clinical quality
              management, but it also implies a real fixed-cost layer beyond the variable cost of each session. The BLS
              wage benchmark for dietitians and nutritionists—$73,850 median annual pay in 2024—does not reveal
              Nourish’s actual loaded clinician cost, but it does anchor the fact that large-scale nutrition care is not
              a software-only business.


              AI may offset part of that burden, but only directionally in public materials. Nourish’s Series B and
              Series C materials describe AI copilots and AI agents that automate note-taking, surface clinical
              insights, reinforce patient behavior change, and reduce administrative work. The recruiting page expands
              that story by presenting scheduling, charting, EHR, messaging, and meal logging as a unified workflow.
              That combination is encouraging because operating leverage in a services-heavy care model often comes from
              reducing documentation time, increasing panel density, and lowering non-billable overhead. Still, no
              retained source discloses clinician productivity, documentation minutes saved, gross-margin uplift, or
              contribution margin by visit type. The likely conclusion is that Nourish’s cost base is strategically
              rational—especially if the company wants payer trust and a differentiated clinic model—but the public
              record still cannot prove where the margin path inflects.
            claimRefs:
              - CI016
