              is paired with medication. By the Series C, official materials said the network exceeded 10,000
              dietitians, completed millions of appointments, and reached more than 200 million covered lives. The most
              important caution flag is insurance mix. In 2025 materials, Nourish said it worked with Medicaid plans,
              but the current FAQ now says it does not accept Medicaid at this time. Because the company also avoids
              disclosing revenue, ARR, enterprise headcount, precise headquarters, and a full board or cap table, later
              chapters should treat scale as well evidenced but operating disclosure completeness as still incomplete.
