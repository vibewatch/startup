  - id: TM001
    title: Market definition table
    columns:
      - Layer
      - Included scope
      - Excluded / adjacent
      - Buyer / payer
      - Why it matters
    rows:
      - - Core market — reimbursed virtual RD care
        - Telehealth visits, longitudinal MNT, nutrition planning, care coordination
        - Self-pay wellness content and food products
        - Patient user; insurer, employer, or Medicare payer
        - This is the monetization engine Nourish is actually building around
      - - Integrated metabolic-care extension
        - RD-led support for diabetes, obesity, heart health, GI issues, and GLP-1 programs
        - Drug spend itself and pharmacy distribution economics
        - Payer medical-management budget and referral workflows
        - Expands value beyond one-off counseling but still sits inside regulated reimbursement
      - - Distribution layer — employer / provider / health-system referrals
        - Referral pathways, eligibility verification, scheduling, and longitudinal engagement
        - Standalone consumer marketing spend without reimbursement conversion
        - Benefits leaders, clinicians, care teams
        - Budget ownership and workflow integration matter as much as patient intent
      - - Adjacent substitute — in-person outpatient dietitian care
        - Traditional clinic-based nutrition counseling
        - Not excluded as competition, but outside Nourish’s virtual-delivery thesis
        - Patient plus insurer / Medicare
        - Shows the company competes with incumbents, not just apps
      - - Adjacent substitute — pure GLP-1 teleprescribing or wellness apps
        - Medication-only programs or lightweight habit apps
        - No longitudinal RD-led behavior-change layer
        - Cash pay or pharmacy budget
        - Important substitute set, but not the same care model or reimbursement logic
    notes: >-
      Included scope is defined as reimbursed virtual nutrition and metabolic care rather than all food, wellness, or
      obesity-drug spend. Adjacencies are listed to prevent an inflated TAM.
