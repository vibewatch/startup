            claimRefs:
              - CV023
              - CV026
              - CV029
              - CV030
              - CV031
              - CV032
      - number: '8.4'
        title: Scenario work suggests the current round price already sits near the top of a reasonable base case
        blocks:
          - type: paragraph
            body: >-
              Because Nourish does not disclose revenue, scenario work has to stay explicit about its assumptions. This
              chapter therefore uses estimated revenue bands, not reported revenue, and links them to multiple ranges
              that are generous versus public comps but still below pure narrative pricing. In the bull case, Nourish
              proves revenue north of roughly $250M, maintains broad reimbursement support, and shows enough margin
              structure to deserve a premium-growth multiple; that can support roughly $2.2B-$2.8B of value and
              meaningful upside from the current reported mark. In the base case, the company grows into the story but
              does not blow it away: estimated revenue of about $180M-$220M and continued reimbursement stability can
              justify about $1.4B-$1.8B, which means today’s entry price is already close to full value. In the bear
              case, reimbursement pressure, weaker economics, or public-comp compression can push fair value back toward
              roughly $0.8B-$1.2B. That downside skew is why the correct action is to monitor, not chase.
            claimRefs:
              - CV029
              - CV030
              - CV031
