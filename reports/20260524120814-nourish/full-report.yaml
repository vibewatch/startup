            body: >-
              The public financing trail is strong on capital raised and weaker on the exact valuation bridge. Series B
              in April 2025 clearly raised $70M and took total funding to $115M; Series C in May 2026 raised another
              $100M and took total funding to $215M. The operating progression between those rounds is material:
              Nourish’s own materials moved from 3,000+ dietitians and hundreds of thousands of patients to 500k+ people
              helped, 6,000+ dietitians, then 10,000+ dietitians, millions of appointments, 250+ health-system
              relationships, and 200M+ covered lives. That is enough to support a genuine step-up in valuation. What
              remains missing is the exact bridge. The local public pack reviewed here does not directly substantiate
              the often-cited idea that Series B itself was already above $1B; and the official Series C release also
              omits valuation, leaving investors to rely on Axios and Ventureburn for the reported $1.75B mark. So the
              chapter treats valuation momentum as plausible but not fully audit-ready until management produces direct
              round terms and current economics.
