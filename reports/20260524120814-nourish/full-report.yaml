  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Patient workflow is clear from intake through recurring RD care, with the app carrying support between visits
        blocks:
          - type: paragraph
            body: >-
              Nourish’s customer-facing product is best understood as a guided care workflow rather than a single app
              feature. The homepage and GLP-1 condition surface show the same basic path: patients state their goals and
              symptoms, upload insurance information, get matched to a dietitian, and book a telehealth visit. Once care
              begins, the model is intentionally recurring. Nourish describes regular virtual appointments, post-session
              notes, and messaging between sessions rather than one-off consultations. The patient app then carries the
              between-visit loop through goal tracking, meal logging, macro or photo uploads, recipe recommendations,
              condition guides, and ongoing reminders. This matters strategically because it makes Nourish look more
              like a behavior-change service with longitudinal touchpoints than a static provider directory. The same
              patient materials also make clear that care is personalized: dietitians review medical history, eating
              habits, lifestyle, and medication use, then work with existing providers when needed. The strongest caveat
              is matching. Public sources clearly say Nourish matches patients to expert dietitians, but they do not
              explain whether the matching layer itself is AI-driven or simply rules-based and operationally assisted.
