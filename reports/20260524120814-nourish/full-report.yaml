      - - Public-program pressure
        - >-
          Management discloses material dependence on public-program reimbursement while Medicaid or obesity-drug
          coverage tightens further.
        - Coverage and reimbursement risk become direct valuation threats rather than background policy noise.
        - Re-underwrite downside immediately.
      - - Economics miss
        - >-
          Disclosed annualized revenue lands well below the rough $200M+ zone needed for a generous private-growth
          multiple framework.
        - Current price stops looking like a stretch and starts looking like a hard miss versus fundamentals.
        - Seek a materially lower entry or pass.
      - - Down-round signal
        - Next financing is priced below the reported Series C valuation or contains heavy structure.
        - Signals private-market skepticism and raises preference-stack risk.
        - Treat as a major negative catalyst.
      - - Public-comp reset
        - Omada, Hims, or broader telehealth comps compress further without offsetting Nourish disclosure gains.
        - Comparable support for a premium private multiple deteriorates.
        - Tighten valuation range toward the bear case.
    notes: >-
