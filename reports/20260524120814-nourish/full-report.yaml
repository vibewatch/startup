  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Patients are the primary users, but payers and referral partners shape who can access care
        blocks:
          - type: paragraph
            body: >-
              Nourish’s public materials consistently position the patient as the product’s primary user: the front door
              is goal-based, insurance-aware, and built around matching a person with a dietitian for recurring virtual
              care. The marketed use cases are also patient-level rather than employer-level wellness abstractions,
              spanning diabetes, gut health, eating disorders, heart health, and broader metabolic or GLP-1 support. At
              the same time, the commercial customer picture is clearly multi-sided. Health plans matter because
              reimbursement and in-network coverage determine whether care is effectively free to the member. Referring
              providers and health systems matter because they feed patients into the platform and receive notes back.
              Employers matter as another acquisition and reimbursement stakeholder even though Nourish does not publish
              a large named employer roster. The practical result is a customer model where the end user is the patient,
              the economic buyer is usually an insurer or sponsor, and referral stakeholders materially affect
              conversion and expansion.
