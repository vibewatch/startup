  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Included Spend, and Substitutes
        blocks:
          - type: paragraph
            body: >-
              Nourish should be analyzed inside the insurance-covered, dietitian-led virtual nutrition and
              metabolic-care market, not inside the entire food, wellness, or obesity-drug economy. The strongest
              need-side evidence is public-health data. CDC says chronic diseases drive $4.9 trillion in annual US
              healthcare costs, three in four adults have at least one chronic condition, 40.1 million people had
              diabetes in 2023, and 115.2 million adults had prediabetes. CDC also says cardiovascular disease caused
              919,032 deaths in 2023 and heart-disease care and medication costs exceeded $168 billion between 2021 and
              2022. Those figures show why payers, employers, and providers keep looking for lower-cost behavior-change
              infrastructure.


              That burden does not mean every chronic-disease dollar belongs in Nourish’s market. The included market is
              reimbursed outpatient nutrition and metabolic support delivered by registered dietitians over telehealth,
              often layered with referral management, care coordination, labs, and GLP-1 support. Excluded or adjacent
              pools include self-pay wellness content, food products, inpatient dietetics, and pure telehealth
              prescribing models that do not own longitudinal nutrition behavior change. Nourish’s own surfaces
              reinforce that narrower boundary: the company presents itself as insurance-covered, longitudinal,
              telehealth care for diabetes, heart health, obesity, GI issues, and GLP-1 support rather than as a
              one-time meal-plan marketplace. The practical result is that buyer budgets, coding rules, and provider
              supply matter more than any generic “nutrition TAM” headline.
