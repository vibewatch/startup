            - Patient acquisition + referrals
            - Professional-corporation / MSO structure
    approximationNotes: >-
      Layer boundaries are functional rather than technical. The fetched pack supports the workflow modules listed here
      but does not disclose the specific cloud, data, or model vendors powering them.
    claimRefs:
      - CE009
      - CE015
      - CE018
      - CE021
      - CE022
      - CE029
      - CE044
      - CE046
  - id: FE002
    title: Customer workflow flow
    type: flow
    layout: wide
    summary: >-
      The visible patient journey moves from goals and insurance intake into a recurring, app-supported RD relationship
      rather than a one-time counseling interaction.
    data:
      nodes:
        - id: n1
          label: Tell Nourish your goals
          detail: Patient shares goals, symptoms, and care needs.
        - id: n2
          label: Provide insurance information
          detail: Insurance card and benefits details are collected before care.
        - id: n3
          label: Get matched to an RD
          detail: Nourish routes the patient to a dietitian suited to the case, though matching logic is not public.
        - id: n4
          label: Complete the first virtual assessment
          detail: Dietitian reviews medical history, eating habits, medications, and lifestyle context.
        - id: n5
          label: Receive care plan + between-visit support
          detail: Patients get notes, messages, goals, logging tasks, and educational content in the app.
        - id: n6
          label: Layer in labs / GLP-1 / medical care if needed
          detail: Adjunct services are added based on need and coordinated with existing providers.
        - id: n7
          label: Continue recurring visits and referral follow-up
          detail: Patients stay in longitudinal care, including health-system or physician referrals when relevant.
      edges:
        - from: n1
          to: n2
        - from: n2
          to: n3
        - from: n3
          to: n4
        - from: n4
          to: n5
        - from: n5
          to: n6
          label: When clinically appropriate
        - from: n5
          to: n7
          label: Recurring care loop
        - from: n6
          to: n7
    approximationNotes: null
    claimRefs:
      - CE001
      - CE002
      - CE004
      - CE005
      - CE006
      - CE015
      - CE027
  - id: FE003
    title: Critical dependency DAG
    type: dag
    layout: wide
    summary: >-
      Nourish’s care model depends on coordinated payer, provider, technology, and compliance nodes even though the
      public stack details beneath them are limited.
    data:
      nodes:
        - id: company
          label: Nourish care platform
          role: Central orchestrator
        - id: patients
          label: Patients + caregivers
          role: Demand and engagement
        - id: rds
          label: Registered Dietitians
          role: Primary care delivery workforce
        - id: medical
          label: Medical-care entities
          role: Labs, prescribing, medication management, and other virtual care
        - id: payers
          label: Health plans / insurer workflows
          role: Coverage, claims, and reimbursement
        - id: referrals
          label: Providers + health systems
          role: Referrals, note sharing, and partner coordination
        - id: consumertech
          label: Mobile + telehealth + connected data
          role: App engagement, Zoom visits, device data, messaging
        - id: compliance
          label: Consent / privacy / security controls
          role: HIPAA, telehealth consent, disclosure, and admin boundaries
      edges:
        - from: patients
          to: company
          label: onboarding + app engagement
        - from: company
          to: rds
          label: workflow + admin tooling
        - from: rds
          to: patients
          label: virtual visits + coaching
        - from: company
          to: medical
          label: adjunct metabolic services
        - from: company
          to: payers
          label: coverage + claims
        - from: referrals
          to: company
          label: patient referrals
        - from: company
          to: referrals
          label: clinical notes + updates
        - from: consumertech
          to: company
          label: telehealth + app + integrations
        - from: compliance
          to: company
          label: policy + consent constraints
    approximationNotes: >-
      The DAG is an operating dependency map, not a network diagram. It highlights the external systems and
      institutional relationships that must function together for Nourish’s model to work at scale.
    claimRefs:
      - CE015
      - CE017
      - CE026
      - CE029
