      - number: '7.2'
        title: >-
          Metabolic-clinic expansion raises the risk ceiling because medication-management services pull Nourish into
          stricter healthcare law territory
        blocks:
          - type: paragraph
            body: >-
              Nourish’s newer metabolic-clinic positioning expands the opportunity set, but it also expands the legal
              attack surface. The 2026 Series C announcement explicitly says the company now layers lab testing, GLP-1
              prescribing, medication management, and other virtual medical care on top of dietitian-led visits, while
              local FAQs say dietitians can help facilitate necessary tests and coordinate with other providers. That
              makes the model more compelling commercially, but it also pushes the business closer to the CPOM,
              fee-splitting, and clinical-independence boundaries that matter in multi-state telehealth. Dickinson
              Wright’s 2026 analysis is directly relevant: it says telehealth weight-loss platforms typically depend on
              MSO-PC structures, that regulators are increasingly testing whether management companies influence
              protocols, visit cadence, or prescription criteria, and that states such as California, Texas, and New
              York are especially attentive to functional control rather than paper form. The same piece notes that
              revenue-based management fees can look like prohibited fee-splitting and that billing insurers or federal
              programs through a non-compliant structure can cascade into Anti-Kickback, Stark, or False Claims Act
              exposure. For Nourish, the core risk is not that nutrition counseling itself is newly suspect; it is that
              adding prescribing and medication-management services may force the company to prove much tighter
              separation between clinical judgment and centralized growth, workflow, and AI-driven operations than its
              public materials currently explain.
            claimRefs:
