            body: >-
              Nourish’s strongest valuation defense comes from private and category-specific comparison, not from public
              telehealth comps. Fay is the cleanest private benchmark: a $500M valuation with 2,300+ dietitians and
              broad payer reach. On disclosed network scale alone, Nourish’s reported 1.75B value is not absurd; it is
              about 3.5x Fay’s valuation against more than 4x Fay’s dietitian scale. Foodsmart offers a second category
              anchor: it is clearly larger on member reach, serving 2.2M members and attracting a $200M+ Rise Fund
              investment, which suggests Nourish is still earlier than the category’s largest incumbent rather than
              already over-scaled. The harder part is public comps. Omada’s current market value implies roughly 3.0x
              revenue, Hims about 1.8x-2.0x, Teladoc about 0.47x, and WW about 0.18x. Those businesses are not
              apples-to-apples, but together they show how unforgiving current public markets are. Against that
              backdrop, Nourish’s reported valuation needs a revenue base far larger than anything the public pack
