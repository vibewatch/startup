    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Model, and Coverage Footprint
        blocks:
          - type: paragraph
            body: >-
              Nourish should be treated as a virtual dietitian and metabolic-care company rather than a generic wellness
              app. The reusable facts are consistent across Y Combinator, current company surfaces, and the 2025-2026
              financing record: the company was founded in 2021 by Aidan Dewar, Sam Perkins, and Stephanie Liu; it
              matches patients to registered dietitians over telehealth; and it monetizes through insurance
              reimbursement rather than a consumer subscription alone. Current product pages show RD visits, messaging,
              meal logging, resources, and goal tracking, while later materials show the model expanding into labs,
              GLP-1-related care, and AI support for both patients and providers. Coverage breadth is also central to
              identity. Nourish says it operates across all 50 states, most patients pay nothing out of pocket, and the
              current insurance surface explicitly names BCBS, United, Aetna, Cigna, and Medicare. What later chapters
              should not overstate is headquarters precision: public datelines repeatedly say New York, but the fetched
              pack does not pin down a canonical headquarters address or clarify whether New York is the operating HQ
              versus a press location.
