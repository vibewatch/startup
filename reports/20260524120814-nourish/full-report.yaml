      - number: '3.3'
        title: Cash-pay GLP-1 platforms and legacy public comps frame the substitute set
        blocks:
          - type: paragraph
            body: >-
              Hims and traditional in-person dietitian care are the most relevant substitutes, but they pressure Nourish
              in different ways. Hims is the cleaner substitute for consumer demand because its Yahoo profile describes
              a large telehealth and pharmacy platform spanning weight loss, mental health, sexual health, dermatology,
              and other categories, with more than two million subscribers, no insurance acceptance, and direct customer
              payment. That makes Hims more medication-led and pharmacy-led than dietitian-led, so it competes for the
              same consumer intent around weight loss and convenience without directly matching Nourish’s
              payer-integrated clinical posture. Traditional outpatient dietitians are the core status quo. TechCrunch’s
              Berry Street coverage and BLS workforce data together show that nutrition care already exists offline but
              remains fragmented and underutilized, which is exactly the inefficiency Nourish, Fay, and Berry Street are
              trying to solve with software, insurance workflows, and broader network access.

              Public-market comparables add a valuation and durability warning. Yahoo and CompaniesMarketCap show Hims
              carrying roughly a $5.5 billion market cap in late May 2026 on roughly $608 million of first-quarter
              revenue, reflecting the public market’s willingness to pay for scaled direct-to-consumer health and
              pharmacy distribution. Teladoc shows the opposite lesson: Macrotrends and CompaniesMarketCap indicate
              about $2.53 billion of 2025 revenue but only about $1.18 billion of market cap in May 2026. WW offers
              another cautionary frame, with Yahoo showing only about $128 million of market cap against roughly $692
              million of trailing revenue. The takeaway is not that Nourish will resemble any one of these models. It is
              that public markets separate medication-led consumer scale, reimbursement-led care delivery, and
              weight-management brands very differently once growth or margin expectations change. Nourish therefore
              competes in a market where substitutes are abundant and where scale alone is not enough to lock in premium
              valuation.
