      - number: '2.3'
        title: Buyer, User, Payer, and GLP-1 Tailwinds
        blocks:
          - type: paragraph
            body: >-
              The commercial logic is multi-sided. The end user is the patient with diabetes, obesity, heart-health, GI,
              or other nutrition-related needs; the economic payer may be a commercial insurer, Medicare, an employer
              benefit program, or a health system referral workflow trying to improve outcomes and reduce downstream
              costs. Nourish’s current site says patients reach the platform through digital marketing, employers,
              providers, insurance directories, and word of mouth. Provider-facing FAQs say referrals should happen
              after new diagnoses, abnormal labs, treatment noncompliance, or significant weight change, that Nourish
              contacts referred patients within one business day and offers appointments within 24 hours, and that it
              shares clinical notes and coordinates treatment with referring providers. The labs FAQ also says
              dietitians can facilitate needed tests directly or with other providers. Those mechanics explain why
              employers and health systems can act as budget owners or channel partners even when the patient is the
              visible user.


              GLP-1s strengthen that buyer case, but in a constrained way. Nourish’s outcomes and GLP-1 pages say
              nutrition support improves weight loss, adherence, side effects, and persistence, while KFF says Medicaid
              obesity coverage remains limited and optional, with only 13 state fee-for-service programs covering GLP-1
              obesity treatment as of January 2026. Pharmacy Times adds that some states kept pushing coverage mandates
              in 2025, including North Dakota’s essential-health-benefit approach, so commercial expansion is real at
              the margin. The market signal is therefore not “GLP-1s solved obesity reimbursement.” It is that
              medication growth increased payer and employer urgency to find longitudinal support models that protect
              persistence, reduce side effects, and create a better ROI story than drug spend alone.
