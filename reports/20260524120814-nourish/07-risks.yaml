- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Reimbursement breadth collapses
    - Coverage language or plan participation changes
    - Material narrowing in Medicaid / Medicare / telehealth coverage before replacement channels are proven
    - Downgrade growth durability and re-underwrite acquisition economics
  - - CPOM / fee-splitting scrutiny rises
    - State AG, board, or civil enforcement against telehealth weight-loss platforms
    - Any action that challenges MSO control, prescribing criteria, or compensation structure
    - Pause confidence in metabolic-clinic scaling and request structure proof
  - - Privacy / security posture disappoints
    - Incident disclosure or prolonged lack of security-assurance detail
    - Any reportable incident or continued absence of audit / certification evidence as enterprise partnerships scale
    - Increase control discount and treat partner expansion claims more cautiously
  - - Quality control degrades at scale
    - Wait times, clinician churn, complaints, or partner dissatisfaction rise
    - Meaningful deterioration while the RD network continues expanding
    - Assume operating leverage is masking quality debt
  - - Partner concentration is worse than implied
    - Private diligence shows top-plan or top-system dependence
    - A small set of payers or channels drives revenue or visits
    - Reframe Nourish as a concentrated reimbursement-distribution bet rather than a diversified network
  notes: Kill criteria focus on events that would break the reimbursement-led and compliance-heavy scaling thesis rather than merely slow growth.
