company:
  name: Nourish
chapter:
  number: 7
  title: Risks
  summary: Nourish’s highest-severity risks cluster around reimbursement breadth, regulatory expansion into metabolic-clinic services, and operating-control demands created by a 10,000-dietitian network. The sharpest thesis-breakers are coverage contraction across Medicaid / Medicare / telehealth, CPOM or fee-splitting scrutiny as medication-management services scale, and a privacy, security, or quality incident that arrives before the company discloses stronger control evidence.
sections:
- id: reimbursement-and-coverage
  title: Reimbursement breadth is the primary severity driver because Nourish’s customer value proposition is coverage-led
  body: 'The biggest risk to Nourish’s current growth model is not raw patient interest; it is whether the reimbursement rails that make the service feel nearly free stay broad enough to support conversion and repeat use. Nourish’s own pricing materials say 94% of in-network patients pay $0 out of pocket, which means the company’s mainstream offer is tightly coupled to payer acceptance rather than a cash-pay habit. That creates four linked policy exposures. First, the current FAQ says Nourish does not accept Medicaid, while 2025 fundraising materials still described relationships with commercial, Medicare, and Medicaid plans. That contradiction matters because it suggests either a narrower current reimbursement footprint than prior marketing implied or a more complex plan-type mix that the company has not explained publicly. Second, Goodwin’s December 2025 legal analysis argues Medicaid cuts can simultaneously reduce patient volume and reimbursement rates for Medicaid-dependent healthcare
    models. Third, KFF shows obesity-oriented GLP-1 coverage in Medicaid remains optional and limited, with several states already pulling back or constraining benefits under budget pressure. Fourth, Medicare nutrition coverage remains narrow: the CMS MNT determination and Nourish’s Medicare FAQ both tie eligibility to diabetes or kidney disease, not to obesity or general metabolic coaching. Combined with CCHP and HHS telehealth guidance showing ongoing state-by-state reimbursement variation, this means Nourish’s highest-severity commercial risk is a policy-led contraction in who can access reimbursed nutrition and metabolic support.'
