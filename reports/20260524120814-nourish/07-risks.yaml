- id: privacy-security-and-quality
  title: Privacy, consent, and quality-control risk rise as data integrations and clinician scale move faster than public control disclosures
  body: 'Nourish has credible trust artifacts, but the public control surface still looks lighter than the company’s AI-native metabolic-clinic ambition. The privacy page is visibly last updated in January 2022 even though it now contemplates Apple Health and Google Health Connect data such as weight, activity, exercise, sleep, heart rate, and active energy. The consent agreement adds another meaningful layer by allowing recording or transcription for clinical-summary generation and by clarifying that messaging is not a real-time monitoring channel. The responsible-disclosure page shows a basic security process with an email alias, a five-business-day acknowledgment promise, and a ten-business-day target for critical issues, but it does not surface certifications, audit results, status reporting, architecture detail, or external assurance that would help an investor calibrate enterprise-readiness. At the same time, the operating model is scaling quickly: Series C says Nourish now has more
    than 10,000 dietitians and millions of appointments, while the recruiting page shows centralized scheduling, charting, EHR, credentialing, insurance enrollment, and multi-state licensing all inside one control plane. That centralization is a mitigation against contractor sprawl, but it also means a privacy incident, consent failure, or documentation-quality problem can propagate across a very large network. The independent workforce-review surface is not especially helpful either, because the local Indeed fetch was rate-limited, limiting outside visibility into clinician sentiment or operational strain.'
