  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: state-practice-structure
    missingEvidence: State-by-state entity structure, supervising medical groups, prescriber model, and management-fee design for Nourish’s metabolic-clinic services.
    whyItMatters: Without the state map and governance design, investors cannot tell whether clinical-scope expansion is cleanly structured against CPOM and fee-splitting risk.
    diligencePath: Request the full state launch matrix, MSO-PC agreements, compensation model, and clinical-governance org chart for metabolic-clinic operations.
    relatedQuestionRefs:
    - QR028
    - QR009
    - QR010
    - QR012
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: margin-and-concentration
    missingEvidence: Gross margin, denial rate, payer mix, concentration by health plan / health system / employer, and revenue share tied to GLP-1 or public-program channels.
    whyItMatters: The top commercial risk is reimbursement dependence, yet public sources do not show whether the business is diversified or whether one policy change could impair economics.
    diligencePath: Request a channel-mix bridge, top-10 payer and partner concentration tables, gross-margin walk, and denial-rate cohort by plan type.
    relatedQuestionRefs:
    - QR029
    - QR020
    - QR022
    - QR023
    relatedTableRefs:
    - TR003
    - TR005
  - type: private-evidence-only
    severity: material
    topic: security-controls
    missingEvidence: Security certifications, penetration-test summaries, incident history, vendor list, data-retention controls, and monitoring / uptime practices for AI and health-data workflows.
    whyItMatters: Nourish is handling sensitive health information and AI-generated summaries, but the public record does not yet show whether enterprise-grade security controls are in place.
    diligencePath: Request SOC or HITRUST-equivalent materials, incident logs, retention schedules, vendor reviews, and privacy-impact assessments for connected-health-data integrations.
    relatedQuestionRefs:
    - QR030
    - QR015
    - QR016
    relatedTableRefs:
    - TR002
    - TR004
  - type: private-evidence-only
    severity: material
    topic: quality-assurance
    missingEvidence: QA scorecards, complaint rates, clinician-retention metrics, wait-time trends, documentation audit results, and remediation processes across the dietitian network.
    whyItMatters: A 10,000-clinician network can compound operating leverage or compound quality failures; the public pack proves scale but not enough QA depth.
    diligencePath: Request provider-quality dashboards, supervision ratios, documentation-audit results, and escalation metrics by cohort and state.
    relatedQuestionRefs:
    - QR017
    - QR018
    - QR027
    - QR031
    relatedTableRefs:
    - TR002
    - TR004
  - type: conflicting-data
    severity: material
    topic: medicaid-contradiction
    missingEvidence: A dated explanation for why the current FAQ says Medicaid is not accepted while earlier fundraising language referenced Medicaid plan relationships.
    whyItMatters: The contradiction changes how much of the TAM is truly open today and whether public-program contraction already happened before the current fundraise.
    diligencePath: Ask management for the timeline, plan types, states affected, and whether Medicaid re-entry or managed-Medicaid partnerships remain active.
    relatedQuestionRefs:
    - QR001
    - QR002
    - QR003
    relatedTableRefs:
    - TR001
    - TR005
acknowledgedWarnings:
- dimension: unverifiedSource
