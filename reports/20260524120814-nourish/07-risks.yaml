- id: mitigations-triggers-and-diligence
  title: Residual risk is manageable only if reimbursement durability, structural compliance, and operating controls keep improving in parallel
  body: 'The mitigation picture is real but incomplete. Nourish benefits from several buffers: a W-2 and centralized operations model instead of a loose contractor marketplace, documented care-coordination practices with providers, broad commercial proof that plans and health systems already use the service, and a nutrition-first thesis that is not purely dependent on selling medication access. Those are meaningful positives, yet the residual exposure remains high because the public pack does not answer the most investment-critical diligence questions. The company has not explained the timeline behind the Medicaid contradiction, disclosed state-by-state metabolic-clinic practice structure, shown how quality assurance scales across 10,000 dietitians, or published the security and incident-response detail that enterprise buyers often expect. The right monitoring posture is therefore explicit rather than abstract: watch Medicaid and Medicare nutrition policy, state telehealth reimbursement
    updates, CPOM or fee-splitting enforcement against weight-loss telehealth peers, any change to the Medicaid FAQ or to insurer-coverage language, expansion or retrenchment in health-system referrals, public security-documentation upgrades, and signs of workforce strain or partner churn. If reimbursement breadth narrows before self-pay or employer economics are proven, if CPOM scrutiny forces restructuring of medication services, or if a privacy or quality event lands while disclosure depth still lags ambition, the current investment thesis breaks quickly.'
