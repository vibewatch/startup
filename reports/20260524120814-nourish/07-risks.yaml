- id: partner-and-model-dependencies
  title: Partner concentration, referral dependence, and opaque margins make the business model more fragile than topline growth messaging suggests
  body: 'Nourish’s expansion story is impressive, but it is structurally dependent on counterparties the company does not fully disclose. Series C says Nourish works with hundreds of health plans covering more than 200 million lives and has more than 250 health systems plus tens of thousands of referring providers feeding patients into the model. Community Health Network shows that this is not hypothetical; Nourish can sit inside an existing health-system workflow and route patients through their current benefits. The coordination FAQ and referral-timing FAQ make the dependency more concrete by promising clinical-note sharing and rapid follow-up for referred patients. That is useful, but it means insurers, health systems, and referring providers are not just demand sources; they are operating dependencies. The economics are similarly coverage-led. Y Combinator frames the market opportunity as an underused insured benefit, and Nourish’s own insurance page highlights minimal out-of-pocket
    cost rather than premium cash-pay willingness. Public materials do not disclose payer mix, gross margin, concentration, NRR, or contract structure, so investors cannot tell whether growth is diversified or whether a small number of plans, channels, or benefit designs drive the outcome. GLP-1 economics amplify that opacity: Nourish is clearly using the medication wave as a growth catalyst, but payer enthusiasm could reverse if obesity-drug budgets rise faster than outcomes savings or if access rules tighten.'
