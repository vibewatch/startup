- id: scale-milestones-and-gaps
  title: Scale, Milestones, Contradictions, and Remaining Gaps
  body: Scale markers are plentiful, but they do not eliminate contradictions. The 2025 Impact Report says Nourish had already served 500,000 patients and scaled to more than 6,000 dietitians, added lab services, and delivered a 3.1x first-year ROI for health-plan partners. Current outcomes pages add concrete clinical markers such as 8% average weight loss, a 1.3-point A1C reduction, and a 31-point LDL reduction, while dedicated GLP-1 materials claim 33% more weight loss and 68% six-month persistence when nutrition support is paired with medication. By the Series C, official materials said the network exceeded 10,000 dietitians, completed millions of appointments, and reached more than 200 million covered lives. The most important caution flag is insurance mix. In 2025 materials, Nourish said it worked with Medicaid plans, but the current FAQ now says it does not accept Medicaid at this time. Because the company also avoids disclosing revenue, ARR, enterprise headcount, precise headquarters,
    and a full board or cap table, later chapters should treat scale as well evidenced but operating disclosure completeness as still incomplete.
