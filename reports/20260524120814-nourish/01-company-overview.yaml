- id: leadership-and-governance
  title: Founders, Leadership, and Governance Visibility
  body: 'Nourish’s public leadership record is founder-centric. Aidan Dewar appears as the main spokesperson across the Series B and Series C announcements and is clearly the CEO. Sam Perkins is consistently named co-founder, president, and COO and is the public voice on payer economics, care-model operations, and health-system ROI. Stephanie Liu is repeatedly named as a co-founder in YC and Forbes coverage, but the fetched pack does not provide the same clarity on her current operating remit, which is a real diligence gap rather than a formatting issue. Governance visibility improved in the Series C announcement because Menlo Ventures partner J.P. Sanday joined the board, but that is still far short of a full governance map. No fetched source discloses the broader board roster, committee structure, ownership splits, or investor-control terms. That makes key-person concentration material: the public record is heavily executive-led by Aidan and Sam, while the actual balance of founder, investor,
    and board influence still requires private diligence.'
  claimRefs:
  - CO003
  - CO004
  - CO005
  - CO006
  - CO031
  - CO041
  - CO042
  tableRefs:
  - TO002
- id: capital-and-stakeholders
  title: Capital Formation and Stakeholder Map
  body: 'The capital story is strong on fundraising momentum and weaker on pricing detail. Third-party reporting says Nourish raised a $35 million Series A in March 2024. Official disclosures then show a $70 million Series B in 2025 that brought total funding to $115 million, followed by a $100 million Series C in May 2026 that lifted total funding to $215 million. The investor roster is unusually consistent for a young care-delivery platform: J.P. Morgan led the Series B; Menlo led the Series C; and Thrive Capital, Index Ventures, Y Combinator, Maverick, BoxGroup, Atomico, and others reappeared. That repeat participation matters because Nourish’s model depends on coordinating three scarce constituencies at once: patients, payer reimbursement, and a massive dietitian network. Public channel disclosures support that thesis. Nourish says patients come through digital marketing, physicians, health systems, employers, insurance directories, and word of mouth, while Series C materials add hundreds
    of plans, more than 200 million covered lives, and referrals from more than 250 health systems. The unresolved question is valuation transparency: official releases disclose capital raised but not a cap-table price, even as third-party outlets peg the Series C at $1.75 billion.'
