company:
  name: Nourish
chapter:
  number: 1
  title: Company Overview
  summary: Nourish is a 2021-founded, insurance-covered virtual dietitian and metabolic-care company led publicly by Aidan Dewar and Sam Perkins. The fetched record supports a strong financing arc from a third-party-reported $35 million Series A to an official $70 million Series B in 2025 and an official $100 million Series C in 2026, with operating scale moving from 500,000 patients and 6,000-plus dietitians in the 2025 Impact Report to 10,000-plus dietitians and 200 million covered lives by Series C. The main diligence gaps are exact headquarters, full governance or cap-table disclosure, official valuation, and the unresolved contradiction between older Medicaid coverage claims and the current FAQ.
sections:
- id: identity-and-model
  title: Identity, Model, and Coverage Footprint
  body: 'Nourish should be treated as a virtual dietitian and metabolic-care company rather than a generic wellness app. The reusable facts are consistent across Y Combinator, current company surfaces, and the 2025-2026 financing record: the company was founded in 2021 by Aidan Dewar, Sam Perkins, and Stephanie Liu; it matches patients to registered dietitians over telehealth; and it monetizes through insurance reimbursement rather than a consumer subscription alone. Current product pages show RD visits, messaging, meal logging, resources, and goal tracking, while later materials show the model expanding into labs, GLP-1-related care, and AI support for both patients and providers. Coverage breadth is also central to identity. Nourish says it operates across all 50 states, most patients pay nothing out of pocket, and the current insurance surface explicitly names BCBS, United, Aetna, Cigna, and Medicare. What later chapters should not overstate is headquarters precision: public datelines
    repeatedly say New York, but the fetched pack does not pin down a canonical headquarters address or clarify whether New York is the operating HQ versus a press location.'
  claimRefs:
  - CO001
  - CO002
  - CO007
  - CO008
  - CO009
  - CO010
  - CO011
  - CO012
  - CO013
  - CO036
