- id: TV006
  title: Final diligence asks
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Current revenue bridge
    - Run-rate revenue, appointment volume, revenue per appointment, and cohort retention by payer.
    - This is the single biggest missing input for deciding whether $1.75B is bold, fair, or actually cheap.
    - Request monthly revenue cohort tables and payer-segment dashboards.
  - - Gross margin and claims leakage
    - Gross margin, clinician cost structure, denial rate, write-offs, and billing leakage.
    - Premium multiple support depends on more than topline growth; margin structure decides durability.
    - Request finance package and claims-operations KPIs.
  - - Payer mix and coverage exposure
    - Commercial vs Medicare vs Medicaid or other public-program exposure, plus covered-lives quality.
    - Valuation downside is highly sensitive to reimbursement durability and public-policy shocks.
    - Request payer-mix detail and reimbursement sensitivity model.
  - - Cap table and liquidation preferences
    - Recent financing terms, liquidation stack, option dilution, and any structured provisions.
    - Headline valuation can materially overstate common-equity value.
    - Request cap-table summary and legal financing docs.
  - - Series B and Series C exact valuation terms
    - Direct confirmation of the 2025 Series B valuation and the 2026 Series C post-money from company materials.
    - The public pack leaves an avoidable gap in the valuation bridge.
    - Request term sheets or board-approved financing summaries.
  - - Exit readiness
    - Board expectations for next round, strategic interest, and IPO-readiness milestones.
    - Return timing and required holding period depend on the most plausible exit path.
    - Ask management for financing roadmap and liquidity plan.
  notes: Items are ordered by pricing materiality. The first four are required to move from track to buy without a major valuation reset.
