- id: diligence-and-thesis-breaks
  title: Residual uncertainty is concentrated in revenue visibility, reimbursement durability, and cap-table math
  body: 'The diligence agenda is unusually clear because the missing pieces are exactly the ones that decide valuation. First, revenue visibility: investors need current run-rate revenue, realized revenue per appointment, gross margin, denial leakage, and cohort retention by payer before they can judge whether the company is already in the revenue zone implied by a $1.75B mark. Second, reimbursement durability: Nourish still markets near-zero out-of-pocket access, but Goodwin and KFF both show how Medicaid and obesity-GLP-1 coverage can tighten under budget pressure, and Nourish’s current insurance page no longer says it accepts Medicaid. Third, cap-table overhang: without the preference stack, dilution, and recent round terms, headline valuation can misstate common-equity outcomes. Those gaps make the monitoring triggers straightforward. If reimbursement breadth narrows, if the next round reprices below the current reported mark, or if disclosed revenue lands well below the $200M-plus zone
    required by generous private-growth multiples, the thesis breaks quickly and valuation should reset lower.'
