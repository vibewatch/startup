  evidenceGaps:
  - type: missing-source
    severity: material
    topic: series-b-valuation-gap
    missingEvidence: A direct public source or company-confirmed term sheet showing Nourish’s 2025 Series B post-money valuation.
    whyItMatters: The step-up from Series B to Series C is central to judging whether the current private mark reflects accelerating fundamentals or simple momentum pricing.
    diligencePath: Request the 2025 Series B term sheet, board materials, or a reputable independent article that states the exact post-money valuation.
    relatedQuestionRefs:
    - QV003
    relatedTableRefs:
    - TV004
  - type: private-evidence-only
    severity: blocking
    topic: revenue-visibility
    missingEvidence: Current revenue run-rate, appointment volume, realized revenue per visit, gross margin, and denial or leakage rates by payer cohort.
    whyItMatters: Without revenue and margin disclosure, investors cannot test whether a $1.75 billion mark is aggressive, reasonable, or actually cheap relative to comp-based multiple ranges.
    diligencePath: Request monthly recurring revenue or run-rate revenue, contribution margin by visit, payer mix, and a bridge from booked appointments to realized revenue.
    relatedQuestionRefs:
    - QV019
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: cap-table-overhang
    missingEvidence: Current cap table, liquidation preference stack, employee option dilution, and any secondary liquidity or ratchet terms from recent rounds.
    whyItMatters: Late-stage healthcare financings can leave common-equity outcomes far below headline valuations, especially if growth slows or the next round reprices the company.
    diligencePath: Request a cap-table summary and recent financing terms from counsel or the data room before underwriting any ownership or return assumptions.
    relatedQuestionRefs:
    - QV020
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: payer-mix-exposure
    missingEvidence: Current payer mix by commercial, Medicare, Medicaid or other public programs, plus visit utilization and reimbursement by payer class.
    whyItMatters: Valuation downside is highly sensitive to reimbursement durability, but the public pack does not reveal how much current revenue depends on more volatile coverage buckets.
    diligencePath: Request payer-mix detail, denial trends, cohort retention by payer, and any sensitivity analysis management uses for reimbursement changes.
    relatedTableRefs:
    - TV006
