- id: TV002
  title: Thesis / anti-thesis
  columns:
  - Pillar
  - Thesis argument
  - Anti-thesis / what would change the view
  rows:
  - - Operating proof
    - Nourish has moved from 3,000+ to 10,000+ dietitians, reached 500k+ people, and publishes outcome and ROI evidence.
    - Public operating proof is not the same as disclosed economics; revenue and margin support remain missing.
  - - Private comp support
    - At 10,000+ dietitians, Nourish’s reported 1.75B value is only about 3.5x Fay’s 500M valuation while disclosed network scale is more than 4x.
    - Private peer support alone is insufficient if the economics do not eventually map onto public-market valuation discipline.
  - - Category tailwind
    - Chronic disease, GLP-1 behavior support, and payer demand for lower-cost intervention all create a large market backdrop.
    - Coverage and reimbursement can tighten quickly if obesity-drug budgets rise or Medicaid pressure intensifies.
  - - Distribution
    - Health-system and payer relationships suggest Nourish is building real embedded demand rather than pure consumer acquisition.
    - The exact economics and concentration of those partnerships are not publicly disclosed, so investors cannot yet judge durability.
  - - Valuation discipline
    - A generous private-growth lens can still support current pricing if revenue is already moving into the $200M+ zone.
    - At public comp multiples, the company would need far more revenue than the public pack currently substantiates.
  - - Exit path
    - Another private round or strategic transaction remains plausible if economics mature.
    - Near-term IPO support looks weak while telehealth and obesity-adjacent public multiples remain compressed.
  notes: This table intentionally separates company-quality arguments from valuation arguments; a good company can still be a weak entry at the current price.
