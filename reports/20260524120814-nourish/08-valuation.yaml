company:
  name: Nourish
chapter:
  number: 8
  title: Valuation
  summary: 'Nourish has real operating proof and a plausible private-scale premium versus nutrition peers, but the reported 2026 Series C valuation of about $1.75B already assumes strong revenue and margin outcomes that public materials do not yet disclose. Relative to Fay, the premium is directionally defensible on dietitian scale; relative to Omada, Hims, Teladoc, and WW, the price looks stretched unless Nourish can show economics far stronger than the current public pack supports. Recommendation: track; confidence: medium; risk rating: high; valuation stance: stretched.'
sections:
- id: thesis-and-recommendation
  title: Recommendation is track because operating quality is real but the reported price already assumes a large share of the upside
  body: 'Nourish looks like a genuine breakout company in virtual nutrition and metabolic care. The business moved from 3,000+ W-2 dietitians and hundreds of thousands of patients around the 2025 Series B to 10,000+ dietitians, millions of appointments, and 200M+ covered lives by the 2026 Series C. Company pages, the 2025 impact report, the outcomes page, and the Community Health Network partnership all reinforce that the model is producing real clinical and distribution proof, not just a financing narrative. That operating quality matters because Nourish is clearly out-scaling the closest private nutrition comp, Fay. But valuation discipline matters more than admiration. Axios and Ventureburn put the 2026 Series C at roughly $1.75B, while the official release omits valuation and public materials still withhold revenue, margin, payer-mix, and cap-table data. That combination leads to a price-sensitive conclusion: recommendation track, confidence medium, risk rating high, valuation stance
    stretched. The company may yet grow into the reported mark, but the currently disclosed evidence does not justify a buy call from this starting price.'
