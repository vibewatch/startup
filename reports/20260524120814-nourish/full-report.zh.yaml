      - number: '8.5'
        title: 剩余不确定性集中在收入能见度、报销耐久性和股权结构测算
        blocks:
          - type: paragraph
            body: >-
              尽调议程异常清晰，因为缺失项正是决定估值的因素。第一，收入能见度：投资者需要当前收入运行率、每次预约实现收入、毛利率、拒付漏损，以及按支付方分列的队列留存，才能判断公司是否已经进入 $1.75B
              估值所隐含的收入区间。第二，报销耐久性：Nourish 仍在营销接近零自付的准入，但 Goodwin 和 KFF 都显示，Medicaid 和肥胖 GLP-1 覆盖可能在预算压力下收紧，而 Nourish
              当前保险页已不再称接受
              Medicaid。第三，股权结构悬空：如果没有优先股堆叠、稀释和近期轮次条款，名义估值可能误导普通股结果。这些缺口让监控触发点很直接。如果报销广度收窄，如果下一轮定价低于当前据报估值，或如果披露收入明显低于慷慨私营成长倍数所需的
              $200M+ 区间，投资逻辑会很快破裂，估值也应下调。
