        title: 数据集成和临床人员规模跑得快于公开控制披露，隐私、同意和质量控制风险随之上升
        blocks:
          - type: paragraph
            body: >-
              Nourish 有可信的信任工件，但公开控制面仍比公司的 AI 原生代谢诊所愿景更薄。隐私页显然最后更新于 2022 年 1 月，尽管现在已经涵盖 Apple Health 和 Google Health
              Connect
              数据，例如体重、活动、运动、睡眠、心率和活动能量。同意协议又增加了一个重要层次：允许为生成临床摘要而录音或转录，并说明消息不是实时监控渠道。负责任披露页面展示了基础安全流程，包括一个邮箱别名、五个工作日内确认的承诺，以及关键问题十个工作日内处理的目标；但它没有展示认证、审计结果、状态报告、架构细节或外部保证，投资者难以据此校准企业就绪度。与此同时，运营模型正在快速扩张：Series
              C 称 Nourish 现在有 10,000+
              名营养师和数百万次预约，招聘页则显示排期、病历记录、EHR、资质认证、保险入网和多州执照都集中在一个控制平面里。集中化能缓解承包商蔓延，但也意味着隐私事件、同意失败或文档质量问题可能穿透一个很大的网络。独立劳动力评价面也帮助有限，因为本地
              Indeed 抓取被限流，外部难以看清临床人员情绪或运营压力。
