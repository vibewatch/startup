      - number: '7.2'
        title: 代谢诊所扩张抬高风险上限，因为药物管理服务把 Nourish 拉进更严格的医疗法律地带
        blocks:
          - type: paragraph
            body: >-
              Nourish 较新的代谢诊所定位拓宽了机会集，也扩大了法律攻击面。2026 Series C 公告明确称，公司现在把实验室检测、GLP-1 开方、药物管理和其他虚拟医疗照护叠加在营养师主导的就诊之上；本地
              FAQ 则称营养师可以协助安排必要检测，并与其他提供方协调。这让模型在商业上更有吸引力，但也把业务推近多州远程医疗中重要的 CPOM、费用分成和临床独立性边界。Dickinson Wright 2026
              年分析与此直接相关：远程减重平台通常依赖 MSO-PC 结构，监管者越来越会测试管理公司是否影响治疗方案、就诊频率或处方标准；California、Texas 和 New York
              等州尤其关注功能控制，而不是纸面形式。同一篇文章还指出，按收入计费的管理费可能看起来像被禁止的费用分成，通过不合规结构向保险方或联邦项目计费，还可能连锁触发 Anti-Kickback、Stark 或 False
              Claims Act 暴露。对 Nourish 来说，核心风险不是营养咨询本身突然可疑，而是增加开方和药物管理服务后，公司可能必须证明临床判断与集中式增长、工作流和 AI
              驱动运营之间有更严格的隔离；其公开材料目前没有说明到这个深度。
