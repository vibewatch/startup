      - number: '3.4'
        title: Nourish 的护城河真实存在，但渠道权力和 AI 商品化会侵蚀它
        blocks:
          - type: paragraph
            body: >-
              证据支撑最强的 Nourish 护城河，是服务提供者供给密度、支付方集成和更宽诊所范围。Nourish 披露的超过 10,000 名营养师网络，显著大于 Fay 披露的超过 2,300 名和 Berry
              Street 披露的超过 1,000 名营养师网络；其产品故事也进一步延伸到实验室、GLP-1 开方、用药管理、协同护理和 AI
              agents。这很重要，因为买方评估代谢护理供应商时，买的不只是预约库存；他们买的是可靠性、覆盖广度、转诊响应速度，以及供应商支撑更复杂患者旅程的信心。Nourish 跨超过 250
              个医疗系统的转诊足迹，也显示出新市场平台无法一夜复制的信任和分销楔子。从这个意义上说，Nourish 的位置比简单目录或预约 App 更耐久。

              反向观点同样重要。Omada 已经拥有 PBM 关系和多病种合同，Foodsmart 已经靠更宽食品福利故事卖给健康计划和雇主，Hims 已经证明消费者减重需求可以在没有保险的情况下快速扩张，Fay 和
              Berry Street 也显示 AI 工作流自动化正在整个品类扩散。这意味着渠道所有者可能越来越偏好打包平台，或把更窄的营养层内化进既有护理管理栈。结果是一张竞争地图：Nourish
              的护城河有意义，但不永久。当买方需要支付方集成、保险覆盖、营养师主导的代谢诊所时，它的领先最强；当买方需要更宽病种管理套件、自费用药漏斗，或能搭在既有雇主、PBM、医疗系统分销上的轻量赋能层时，它的领先最弱。后续尽调应因此把
              Nourish 视为领先但未被隔离；按买方队列拆分的合同经济性和留存，仍是决定性的未答问题。
