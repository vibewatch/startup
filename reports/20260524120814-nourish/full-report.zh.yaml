      nodes:
        - id: acquire
          label: 患者获取
          detail: 数字营销、雇主和医疗系统合作、保险目录、口碑和服务提供者转诊把需求送入漏斗。
        - id: verify
          label: 福利核验
          detail: Nourish 先检查覆盖，并在护理前估算患者费用。
        - id: care
          label: 虚拟 RD 就诊
          detail: 保险覆盖的营养就诊仍是披露的核心服务。
        - id: claims
          label: 理赔裁定
          detail: Nourish 直接向网内计划计费，并在患者门户内监控理赔状态。
        - id: fallback
          label: 自费兜底
          detail: 若未来就诊不被覆盖，公开兜底价格为每次 $145。
        - id: grossprofit
          label: 净收入池
          detail: 回款随后要吸收临床人力、福利、行政和理赔运营成本，之后才留下毛利润。
