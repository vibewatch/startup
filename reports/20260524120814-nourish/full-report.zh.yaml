  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: Nourish 的价值主张靠保险覆盖成立，报销广度因此决定风险严重性
        blocks:
          - type: paragraph
            body: >-
              Nourish 当前增长模型的最大风险不是患者兴趣不足，而是让服务接近免费的报销轨道能否保持足够宽，继续支撑转化和复用。Nourish 自己的定价材料称，94% 的网内患者自付
              $0，意味着公司的主流产品与支付方接受度紧密绑定，而不是现金自费习惯。这带来四个相互关联的政策暴露。第一，当前 FAQ 称 Nourish 不接受 Medicaid，而 2025
              融资材料仍描述其与商业保险、Medicare 和 Medicaid 计划的关系。这个矛盾很重要：要么当前报销足迹比先前营销暗示得更窄，要么计划类型组合更复杂，但公司尚未公开解释。第二，Goodwin 2025 年
              12 月法律分析认为，Medicaid 削减可能同时压低依赖 Medicaid 医疗模式的患者量和报销费率。第三，KFF 显示，Medicaid 中面向肥胖的 GLP-1
              覆盖仍是可选且有限的，多个州已经在预算压力下回撤或限制福利。第四，Medicare 营养覆盖仍窄：CMS MNT 裁定和 Nourish Medicare FAQ
              都把资格绑定到糖尿病或肾病，而非肥胖或一般代谢辅导。再结合 CCHP 和 HHS 远程医疗指引显示报销仍按州差异化，Nourish 最高严重性的商业风险就是政策驱动的收缩：谁还能获得可报销的营养和代谢支持。
