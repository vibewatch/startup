        - Nourish 和 Fay 均披露广泛保险接入，覆盖人群约 200M
        - 如果多家供应商都跨过同一网络门槛，付款方接入可能商品化
        - 高
        - 索取计划层面的渗透率、赢单率和续约数据，而不是只看覆盖人群标题数字
      - - 服务范围宽度
        - Nourish 披露的诊所范围最广，覆盖实验室、用药管理和 AI 智能体
        - 相邻平台可凭更强既有渠道补齐功能差距
        - 高
        - 验证实验室、GLP-1 和非 RD 延展的附加率，看宽度能否变现
      - - 渠道所有权
        - Foodsmart 和 Omada 已掌控大型雇主、健康险计划、PBM 和医疗服务通道
        - 买方可能偏好打包供应商或自建，而不是专业供应商
        - 高
        - 询问当前签约由哪些渠道驱动，以及暴露在集中度风险下的收入占比
      - - AI 差异化
        - Nourish、Fay 和 Berry Street 都在营销 AI 赋能的服务提供者工作流
        - 行政自动化可能变成标配，而不是护城河
        - 中
        - 尽调应盯结果提升、人效杠杆和专有数据闭环，不只看 AI 品牌
      - - 公开市场估值韧性
        - Hims、Teladoc 和 WW 显示规模化健康平台估值结局差异很大
        - 如果增长、信任或利润率不及预期，后期估值可能压缩
        - 中
        - 没有持久留存和利润率结构证据，不要按软件式倍数承销
      - - 自建 / 潜在进入者
        - 既有付款方、PBM 和远程医疗玩家已拥有相邻资产，可能继续外延
        - 新进入者可能将营养打包进更广慢病护理或 GLP-1 项目
        - 高
        - 检查买方愿不愿外包，而不是扩展现有供应商或内部栈
    notes: 严重性是定性判断：高表示该风险可能在未来一到三年内实质改变赢单率、定价权或留存；中表示风险有意义，但更取决于执行。每一行都锚定公开证据，而不是投机性的未来场景。
