              6,000+；2026 Series C 材料又把网络口径推到 10,000 名营养师、200M 覆盖人群、数百万次预约，以及覆盖 250+ 个医疗系统的转诊关系。更早的 2025 融资报道提到数十万患者和
              3,000+ W-2 营养师基数，有助于说明这是真实扩张，而不是一次性新闻跳升。核心保留意见在分母质量。“已服务患者”不等于活跃患者，覆盖人群也不等于已参与会员。Nourish
