  - id: TV005
    title: 投资逻辑破裂触发因素
    columns:
      - 触发因素
      - 阈值 / 事件
      - 对投资判断的传导
      - 行动含义
    rows:
      - - 报销收缩
        - Nourish 披露覆盖人群明显流失、支付方接受范围收窄，或患者自付负担显著上升。
        - 保险驱动的获客和留存经济性走弱，支撑溢价估值的收入底盘随之收缩。
        - 在支付方韧性重新站稳前转为回避。
      - - 公共项目压力
        - 管理层披露对公共项目报销存在重大依赖，同时 Medicaid 或肥胖药覆盖进一步收紧。
        - 覆盖和报销风险不再只是政策背景噪音，而是直接威胁估值。
        - 立即重新测算下行情景。
      - - 经济性不达标
        - 披露的年化收入远低于支持高增长型私募慷慨倍数框架所需的大致 $200M+ 区间。
        - 当前价格不再只是偏贵，而是相对基本面明显落空。
        - 寻找显著更低的进入价格，或直接放弃。
      - - 降价融资信号
        - 下一轮融资价格低于披露的 Series C 估值，或带有重结构条款。
        - 释放私募市场怀疑信号，并抬高优先清算权风险。
        - 视为重大负面催化。
      - - 上市可比公司重估
        - Omada、Hims 或更广泛的远程医疗可比公司继续压缩，且 Nourish 披露改善不足以抵消。
        - 支撑私募溢价倍数的可比公司基础恶化。
        - 将估值区间向熊市情景收紧。
    notes: 这些触发点按估值传导来选，不只是看经营重要性。每一项都会直接改变收入底盘、估值倍数或普通股结果。
    claimRefs:
      - CV029
      - CV035
      - CV036
      - CV037
      - CV047
  - id: TV006
    title: 最终尽调问题
    columns:
      - 主题
      - 缺失证据
      - 为何重要
      - 负责人 / 尽调路径
    rows:
      - - 当前收入桥
        - 按支付方拆分的运行率收入、预约量、单次预约收入和队列留存。
        - 这是判断 $1.75B 是激进、合理，还是其实便宜的最大缺失输入。
        - 索取月度收入队列表和支付方分层看板。
      - - 毛利率和理赔流失
        - 毛利率、临床人员成本结构、拒赔率、核销和计费流失。
        - 支撑溢价倍数不能只靠收入增长；利润率结构决定耐久性。
        - 索取财务包和理赔运营 KPI。
      - - 支付方组合和覆盖敞口
        - 商业保险、Medicare、Medicaid 或其他公共项目敞口，以及覆盖人群质量。
        - 估值下行对报销耐久性和公共政策冲击高度敏感。
        - 索取支付方组合明细和报销敏感性模型。
      - - 股权结构和清算优先权
        - 近期融资条款、清算顺位、期权稀释，以及任何结构化条款。
        - 头部估值可能显著高估普通股价值。
        - 索取股权结构摘要和融资法律文件。
      - - Series B 和 Series C 精确估值条款
        - 由公司材料直接确认 2025 年 Series B 估值和 2026 年 Series C 投后估值。
        - 公开材料在估值桥里留下了一个本可避免的缺口。
        - 索取投资条款清单或董事会批准的融资摘要。
      - - 退出准备度
        - 董事会对下一轮融资、战略方兴趣和 IPO 就绪里程碑的预期。
        - 回报时点和所需持有期取决于最可能的退出路径。
        - 向管理层询问融资路线图和流动性计划。
    notes: 这些事项按定价重要性排序。若没有重大估值重置，前四项是从跟踪转为买入的必要条件。
    claimRefs:
      - CV033
      - CV034
      - CV045
      - CV046
      - CV049
