  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 患者是主要用户，但支付方和转诊伙伴决定谁能获得照护
        blocks:
          - type: paragraph
            body: >-
              Nourish
              的公开材料始终把患者放在产品主用户位置：入口按目标组织，先识别保险覆盖，再把个人匹配给营养师，提供持续的虚拟照护。公司主推的用例也落在患者层面，而不是雇主层面的健康福利抽象，覆盖糖尿病、肠胃健康、进食障碍、心脏健康，以及更广泛的代谢或
              GLP-1
              支持。与此同时，商业客户图谱明显是多边结构。健康计划重要，是因为报销和网内覆盖决定会员是否几乎免费获得照护。转诊提供方和医疗系统重要，是因为它们把患者导入平台，也接收回传记录。雇主同样是获客和报销链条中的利益方，尽管
              Nourish 没有公布大型具名雇主名单。实际结果是：终端用户是患者，经济买方通常是保险方或计划赞助方，转诊利益方实质影响转化和扩张。
