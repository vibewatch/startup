    Nourish 将注册营养师远程就诊与 AI 驱动的患者 App、供医护使用的 copilots、餐食和症状追踪、可穿戴设备和实验室集成，以及不断加厚的代谢护理层配在一起；代谢护理层包括实验室检测、GLP-1
