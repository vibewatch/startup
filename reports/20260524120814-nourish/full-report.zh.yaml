      - number: '2.2'
        title: 供给约束与报销架构
        blocks:
          - type: paragraph
            body: >-
              供给和报销架构让这个市场比单看消费者需求更难。BLS 统计 2024 年有 90,900 个营养师和营养学家岗位，预计到 2034 年增长 6%，平均每年新增 6,200 个职位空缺。BLS
              还指出，从业者通常需要学位、监督培训，以及州执照或等同要求，这意味着远程营养护理产能无法像纯软件市场一样快速扩张。因此 Nourish 自身供给故事具有战略意义：公司称 2025 年拥有超过 6,000
              名营养师，到 2026 年 5 月超过 10,000 名，占整个职业总量的可观比例。


              报销扩大需求，也切碎需求。HHS 的远程营养计费指南称 CPT codes 97802、97803 和 97804 永久覆盖远程医疗，为虚拟医学营养治疗提供耐久监管基础。不过 CMS 的 national
              coverage determination 仍把 Medicare MNT 限定得很窄，聚焦糖尿病和肾病；Nourish 的 Medicare FAQ 则把它翻译成糖尿病或肾病加医生转诊。CCHP Fall
              2025 调查显示，所有州、DC 和 Puerto Rico 都有某种 Medicaid 远程医疗报销，但服务方式、平价要求和计费规则仍不均衡，只有 24 个州加 Puerto Rico
              明确有私营支付方支付平价。这意味着 Nourish 的市场有真实报销基础设施支撑，但变现仍取决于司法辖区、福利设计、资质认证和诊断资格，而不是简单的漏斗顶端认知。
