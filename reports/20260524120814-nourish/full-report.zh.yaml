    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份定位、模式与覆盖版图
        blocks:
          - type: paragraph
            body: >-
              Nourish 应被视为虚拟营养师和代谢护理公司，而不是普通健康 App。可复用事实在 Y Combinator、公司当前页面和 2025-2026 融资记录中一致：公司由 Aidan Dewar、Sam
              Perkins 和 Stephanie Liu 于 2021 年创立；通过远程医疗把患者匹配给注册营养师；变现靠保险报销，而不只是消费者订阅。当前产品页面显示 RD
              就诊、消息、饮食记录、资源和目标追踪；后续材料则显示模式扩展到实验室检测、GLP-1 相关护理，以及面向患者和服务提供者的 AI 支持。覆盖广度也是身份定位的核心。Nourish 称其覆盖全部 50
              个州，多数患者无需自付；当前保险页面明确列出 BCBS、United、Aetna、Cigna 和 Medicare。后续章节不应夸大总部精确度：公开新闻稿日期行反复写 New
              York，但抓取材料没有锁定标准总部地址，也没有说明 New York 是运营总部还是新闻发布地点。
