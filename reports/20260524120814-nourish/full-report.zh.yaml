              规模指标很多，但没有消除矛盾。2025 Impact Report 称 Nourish 已服务 500,000 名患者，扩展到超过 6,000 名营养师，增加实验室服务，并为健康计划伙伴交付 3.1x 首年
              ROI。当前结果页面加入具体临床指标，如平均减重 8%、A1C 降低 1.3 points、LDL 降低 31 points；专门 GLP-1 材料声称，将营养支持与药物结合后，减重多 33%，6 个月持续率为
              68%。到 Series C，官方材料称网络已超过 10,000 名营养师，完成数百万次预约，并触达超过 200 million 覆盖人群。最重要的警示是保险组合。2025 年材料中，Nourish 称其与
              Medicaid 计划合作；但当前 FAQ 又说目前不接受
              Medicaid。公司还回避披露收入、ARR、企业员工数、精确总部、完整董事会或股权结构，因此后续章节应把规模视为证据充分，同时承认运营披露完整度仍不够。
