  - id: FI001
    title: 收入模型桥
    type: flow
    layout: wide
    summary: Nourish 公开材料描述的是报销优先模型：营销和转诊渠道带来已覆盖的虚拟营养师就诊，经过保险公司裁定后，才偶尔落到自费兜底。
    approximationNotes: 这张桥接图映射的是公开运营逻辑，不是经审计的会计流。它展示现金可能在哪里进入系统，而不是收入确认政策。
