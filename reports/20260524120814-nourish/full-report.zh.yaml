  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议为观察，因为运营质量真实，但据报道的价格已计入大部分上行
        blocks:
          - type: paragraph
            body: >-
              Nourish 看起来确实是虚拟营养和代谢照护里的突破型公司。业务从 2025 Series B 前后的 3,000+ 名 W-2 营养师和数十万患者，推进到 2026 Series C 时的 10,000+
              名营养师、数百万次预约和 200M+ 覆盖人群。公司页面、2025 年影响报告、结果页以及 Community Health Network
              合作都强化了同一个判断：模型正在产出真实的临床和分发证明，而不只是融资叙事。运营质量重要，因为 Nourish 明显跑赢最接近的私营营养可比公司 Fay。但估值纪律比欣赏公司更重要。Axios 和
              Ventureburn 把 2026 Series C 估在大约
              $1.75B，而官方发布没有披露估值，公开材料也仍未给出收入、利润率、支付方组合和股权结构表数据。这个组合导向一个对价格敏感的结论：建议观察，信心中，风险评级高，估值立场偏高。公司可能最终消化这个据报估值，但从当前披露的证据出发，还不足以支持买入判断。
