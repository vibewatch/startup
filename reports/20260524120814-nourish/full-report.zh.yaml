      - number: '3.2'
        title: Foodsmart、Omada 和 Virta 通过更大的渠道或护理模式楔子竞争
        blocks:
          - type: paragraph
            body: >-
              更具战略危险的竞争者，可能是不像纯营养师市场的相邻平台。Foodsmart 靠更宽的 “Foodcare” 产品栈竞争，把远程营养与食品福利管理、膳食计划、线上食品订购、SNAP 支持和服务提供者
              “foodscripts” 接在一起。其 2024 融资材料称，公司通过 Medicaid managed care、Medicare Advantage、商业保险和超过 1,000 名雇主服务超过 2.2
              million 会员，这意味着它进入买方对话时，福利和社会决定因素叙事比 Nourish 当前披露更宽。Omada 从另一个角度进攻：其 2026 年 5 月业绩称，公司有 1.02 million 会员、$78
              million 季度收入、与全部三大领先 PBM 建立关系，并把 GLP-1 支持嵌入更大的多病种心代谢平台。Virta 买方类型更窄，但仍重要，因为它营销的是代谢疾病逆转和减少用药，而不只是营养师可及性，背后有
              coaching、临床团队和面向健康计划的姿态支撑。

              这些公司重要，因为它们改变了 Nourish 所谓“竞争”的含义。面对 Fay 和 Berry Street，战场主要是服务提供者网络密度、保险工作流和患者匹配。面对 Foodsmart 和
              Omada，战场转向企业渠道所有权、病种覆盖宽度，以及买方偏好专业营养师主导供应商还是更宽医疗管理平台。面对 Virta，比较更临床、也更围绕信任：Virta 承诺疾病逆转和减少用药，而 Nourish
              的公开故事是以营养为先的代谢护理，并在需要时叠加用药管理。Nourish 披露出的优势仍是 RD 中心诊所内部的宽度，但相邻平台证明，大买方可能奖励更宽解决方案包或更强既有分销，即便营养组件只是整个套餐的一部分。
