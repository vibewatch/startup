      - number: '4.4'
        title: 融资规模可观，但仍无法从公开来源承销现金跑道
        blocks:
          - type: paragraph
            body: >-
              Nourish 显然已筹到足够资本来搭建全国平台。公司融资时间线目前合计 $215 million：2024 年 $35 million Series A、2025 年 $70 million Series
              B，以及 2026 年 $100 million Series C。与规模同样重要的是资金用途表述。Series B 瞄准产品开发、RD 网络扩张和战略合作；Series C 增加临床网络增长、AI
              agents、更深入的计划 / 雇主 / 系统合作，以及代谢诊所模式扩张。该框架让最新一轮更像加速资本，而不是救援融资；尤其是公司还声称到 2026 年中同比增长超过 3x。


              即便如此，公开资本充足性仍无法精确承销，因为核心现金流输入缺失。保留的 Nourish 来源均未公布账面现金、月度
              burn、runway、当前收入或毛利率。这很重要，因为在有显著人力开支和持续产品投入的护理交付业务中，“融了一大轮”和“有足够跑道达到持久自给”之间可能差很远。上市可比公司说明这些未知数对估值有多敏感。Omada
              显示，报销挂钩的虚拟护理业务可以做到正调整后 EBITDA、62% 毛利率和有意义的现金缓冲。Hims 显示，消费者主导模式一旦披露收入规模，市值可以大得多。Teladoc 和 WW
              显示相反教训：当利润率结构或增长质量令人失望，规模本身并不能保护估值。因此 Nourish 绝对融资额看起来充足，但仅凭公开数据仍无法认定模型可融资，除非私下看到现金、burn 和回款。
