  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: 患者先走保险牵引的入组流程，服务方、健康系统和赞助方则影响获客与扩张。
    data:
      items:
        - label: 发现需求
          stage: 发现需求
          actor: 患者
          channel: 目标搜索、症状或诊断触发
          touchpoints:
            - 数字营销
            - 社交媒体
            - 口碑
            - 转诊服务方
          detail: 患者通常在确诊、实验室指标异常、体重变化，或搜索有保险覆盖的营养照护后进入。
        - label: 验证可负担性
          stage: 验证可负担性
          actor: 患者 / 保险方
          channel: 覆盖资格检查和保险上传
          touchpoints:
            - 覆盖资格计算器
            - 网内匹配
            - 计费 FAQ
          detail: 费用清晰度是关键转化步骤，因为 Nourish 将线上照护营销为通常 $0 自付。
        - label: 匹配并预约
          stage: 匹配并预约
          actor: 患者 / Nourish 运营
          channel: 专科匹配和远程医疗排期
          touchpoints:
            - 病种页面
            - 预约排期
            - 24 小时转诊排期承诺
          detail: 转诊患者会在一个工作日内收到联系，并被提供 24 小时内的预约。
        - label: 持续照护
          stage: 持续照护
          actor: 患者 / RD / 转诊服务方
          channel: 线上问诊和会间支持
          touchpoints:
            - 远程医疗问诊
            - 会后记录
            - 消息
            - 临床记录共享
          detail: 核心产品体验是长期照护，而不是一次性问诊。
        - label: 扩展关系
          stage: 扩展关系
          actor: 医疗保险计划 / 雇主 / 健康系统 / 服务方
          channel: 转诊、ROI 证明和代谢照护邻近场景
          touchpoints:
            - 健康系统集成
            - 雇主与支付方合作
            - GLP-1 支持
            - AI App 互动
          detail: 扩张来自更多可覆盖入口、更多转诊伙伴，以及更深的代谢照护用例。
    approximationNotes: 这张旅程图总结了公开页面和伙伴材料披露的漏斗机制；它不是私有转化分析视图。
    claimRefs:
      - CU001
      - CU002
      - CU005
      - CU006
      - CU007
      - CU008
      - CU026
      - CU048
  - id: FU002
    title: 采用 / 部署漏斗
    type: flow
    layout: wide
    summary: 公开证据显示，巨大的理论可达池逐步收窄为已服务患者、转诊流量，以及一小批具名公开伙伴。
    data:
      nodes:
        - label: 覆盖可达池
          segment: 医疗保险计划 / 雇主 / 健康系统
          detail: Series C 材料称，Nourish 可触达超过 200 million 名受保人群。
        - label: 已服务患者
          segment: 广泛患者基础
          detail: 2025 年影响报告称，Nourish 在全美已服务患者超过 500,000 人。
        - label: 长期照护交付
          segment: RD 网络和定期问诊
          detail: 数百万次预约和由 10,000 名营养师组成的网络意味着大规模照护交付，不只是漏斗顶部触达。
        - label: 转诊集成
          segment: 服务方 / 健康系统
          detail: 据称，250+ 个健康系统中的数万名服务方会将患者转诊进这一模型。
        - label: 具名公开证据
          segment: 公开可识别企业客户
          detail: 在本地抓取包里，Community Health Network 是最清晰的具名健康系统证据；更广泛的客户标识仍然稀少。
    claimRefs:
      - CU019
      - CU021
      - CU023
      - CU024
      - CU039
      - CU041
      - CU050
  - id: FU003
    title: 客户证据矩阵
    type: matrix
    layout: wide
    summary: 公开证据在患者结果和聚合伙伴覆盖上最强；在企业客户名单透明度和留存可见度上较弱。
    data:
      columns:
        - 证据质量
        - 结果具体度
        - 生产成熟度
        - 持久性可见度
      rows:
        - label: 结果页聚合证据
          values:
            - 高
            - 高
            - 暗示生产环境照护已上线
            - 中，因为留存指标不完整
        - label: 成功案例患者证据
          values:
            - 中
            - 高
            - 生产环境中的患者关系
            - 低，因为案例是轶事而非队列留存
        - label: Community Health 伙伴证据
          values:
            - 高
            - 中
            - 已描述生产工作流集成
            - 低，因为缺少合同和续约数据
        - label: 更广泛企业客户名单
          values:
            - 中
            - 低
            - 明显商业化，但未完整具名
            - 低，因为集中度和续约未披露
    approximationNotes: 矩阵评分是对本地抓取包证据质量的定性判断，不是私有尽调发现。
    claimRefs:
      - CU025
      - CU027
      - CU031
      - CU033
      - CU039
      - CU040
  - id: FU004
    title: 留存 / 复诊队列
    type: cohort
    layout: wide
    summary: 公开的持久性披露更适合作为里程碑代理指标，而不是真正的同用户留存队列。
    data:
      columns:
        - 第 0-1 个月
        - 第 3 个月
        - 第 6 个月
        - 第 12 个月
      rows:
        - label: 公开持久性代理指标
          values:
            - 81
            - 90
            - 67
            - 62
    approximationNotes: 这是一个代理队列，取自最接近的公开里程碑百分比：到诊、三个月目标进展、六个月消化健康改善，以及十二个月减重 5%+ 达成率。Nourish 没有公开披露真正的同用户留存或续约队列。
    claimRefs:
      - CU032
      - CU034
      - CU036
      - CU038
      - CU041
      - CU049
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 剩余严重性最高的区域，是报销覆盖广度、临床范围扩张与外部政策控制交叉的地方。
    data:
      columns:
        - 低可能性
        - 中等可能性
        - 高可能性
        - 极高可能性
      rows:
        - label: 关键影响
          values:
            - ''
            - ''
            - CPOM / 费用分成对代谢诊所模型的挑战
            - Medicaid / Medicare / 远程医疗报销收缩
        - label: 高影响
          values:
            - ''
            - 隐私 / 知情同意事件
            - 10,000 名 RD 网络质量漂移
            - GLP-1 覆盖 / 支付方预算回撤
        - label: 中等影响
          values:
            - ''
            - 伙伴集中度意外
            - 理赔 / 资质认证瓶颈
            - 文档披露深度落后于企业级野心
    approximationNotes: 位置是定性判断，反映现有公开缓释措施之后的剩余严重性，而不是概率损失模型。
    claimRefs:
      - CR012
      - CR020
      - CR026
      - CR032
      - CR040
      - CR044
      - CR045
      - CR046
  - id: FR002
    title: 风险传导 DAG
    type: dag
    layout: wide
    summary: 最危险的路径从政策和结构风险传导到覆盖、渠道流量、利润率，最终传导到估值。
    data:
      nodes:
        - id: policy
          label: 覆盖政策
          role: Medicaid, Medicare, telehealth rules
        - id: cpom
          label: CPOM / 结构
          role: Clinical independence and fee design
        - id: privacy
          label: 隐私 / 知情同意姿态
          role: Data and trust controls
        - id: quality
          label: 规模化临床质量
          role: 10,000-RD consistency
        - id: coverage
          label: 受保会员入口
          role: Who can use reimbursed care
        - id: channels
          label: 转诊 + 伙伴流量
          role: Health plans, systems, providers
        - id: unit
          label: 收入 / 利润率
          role: Visit conversion and unit economics
        - id: valuation
          label: 投资逻辑
          role: Growth durability and multiple support
      edges:
        - from: policy
          to: coverage
          label: 资格 + 报销
        - from: coverage
          to: channels
          label: 会员入口 + 伙伴 ROI
        - from: channels
          to: unit
          label: 转诊 + 规模
        - from: cpom
          to: unit
          label: 服务范围约束
        - from: cpom
          to: valuation
          label: 重组风险
        - from: privacy
          to: channels
          label: 信任 + 企业尽调
        - from: quality
          to: channels
          label: 服务方 + 健康系统信心
        - from: quality
          to: unit
          label: 留存 + 理赔质量
        - from: unit
          to: valuation
          label: 增长持久性 + 利润率
    approximationNotes: DAG 展示传导方向，不代表因果确定性或时间顺序。
    claimRefs:
      - CR012
      - CR020
      - CR032
      - CR041
      - CR044
      - CR045
      - CR046
  - id: FR003
    title: 依赖 DAG
    type: dag
    layout: wide
    summary: Nourish 依赖多个外部交易对手，其激励在公开材料中只露出一部分。
    data:
      nodes:
        - id: company
          label: Nourish
          role: Central care and workflow platform
        - id: plans
          label: 医疗保险计划
          role: Coverage, claims, reimbursement
        - id: medicare
          label: CMS / Medicare MNT 规则
          role: Public-program eligibility ceiling
        - id: medicaid
          label: 州 Medicaid / GLP-1 规则
          role: Budget-sensitive optional coverage
        - id: systems
          label: 健康系统
          role: Embedded channel partners
        - id: referrers
          label: 转诊服务方
          role: Patient feed and note loop
        - id: rds
          label: 注册营养师
          role: Primary care workforce
        - id: medical
          label: 处方 / 实验室实体
          role: Metabolic-clinic extension
        - id: glp1
          label: GLP-1 经济性
          role: Demand pull and payer pressure
      edges:
        - from: plans
          to: company
          label: 覆盖 + 支付
        - from: medicare
          to: plans
          label: 政策基线
        - from: medicaid
          to: company
          label: 公共项目可用性
        - from: systems
          to: company
          label: 嵌入式入口
        - from: referrers
          to: company
          label: 患者转诊
        - from: company
          to: rds
          label: 工作流 + 行政
        - from: company
          to: medical
          label: 实验室检查 + 用药管理
        - from: glp1
          to: plans
          label: 预算压力
        - from: glp1
          to: company
          label: 会员需求
    approximationNotes: 这是依赖图，不是组织架构图；它突出会实质影响风险传导的外部节点。
    claimRefs:
      - CR033
      - CR034
      - CR035
      - CR036
      - CR037
      - CR039
      - CR040
      - CR041
  - id: FV001
    title: 推荐逻辑流
    type: flow
    layout: standard
    summary: 规模、证据、可比公司估值压缩和披露缺口如何共同导向观察建议。
    data:
      nodes:
        - id: scale
          label: 规模证据：500k+ 人、10,000+ 名营养师、数百万次预约
          type: input
        - id: outcomes
          label: 临床证据：体重、A1C、LDL、ROI 证据
          type: input
        - id: privatecomp
          label: 私募支撑：相对 Fay 的溢价方向上可解释
          type: input
        - id: publiccomp
          label: 公开市场拖累：Omada / Hims / TDOC / WW 倍数低得多
          type: input
        - id: gaps
          label: 关键缺口：收入、利润率、支付方结构、股权结构表
          type: input
        - id: synthesis
          label: 综合判断：公司不错、价格要求高、安全边际有限
          type: process
        - id: decision
          label: 决策：观察 / 中等信心 / 高风险 / 估值偏高
          type: output
      edges:
        - from: scale
          to: synthesis
        - from: outcomes
          to: synthesis
        - from: privatecomp
          to: synthesis
        - from: publiccomp
          to: synthesis
        - from: gaps
          to: synthesis
        - from: synthesis
          to: decision
    approximationNotes: null
    claimRefs:
      - CV014
      - CV029
      - CV041
      - CV042
      - CV043
      - CV044
      - CV048
  - id: FV002
    title: 估值敏感性条形图
    type: bar
    layout: wide
    summary: 在不同收入倍数假设下，Nourish 需要多少估计年收入才能支撑 $1.75B 估值。
    data:
      items:
        - label: 按 ~1.9x 收入（类似 Hims 的公开市场增长可比样本）
          value: 921
          unit: USD M
        - label: 按 ~3.0x 收入（类似 Omada 的公开市场可比样本）
          value: 585
          unit: USD M
        - label: 按 5.0x 收入（高增长溢价）
          value: 350
          unit: USD M
        - label: 按 6.0x 收入（宽松的私募增长情景）
          value: 292
          unit: USD M
        - label: 按 8.0x 收入（非常乐观的私募情景）
          value: 219
          unit: USD M
    approximationNotes: 这些是所需收入测算，不是 Nourish 报告收入。计算只是用已报道的 $1.75B 估值除以不同倍数假设。
    claimRefs:
      - CV023
      - CV026
      - CV029
      - CV030
      - CV031
      - CV032
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 围绕已报道的 2026 年 Series C 标记，基于明确估计的收入假设，给出悲观、基准和乐观估值区间。
    data:
      items:
        - label: 悲观情景
          low: 0.8
          mid: 1
          high: 1.2
          unit: USD B
        - label: 基准情景
          low: 1.4
          mid: 1.6
          high: 1.8
          unit: USD B
        - label: 乐观情景
          low: 2.2
          mid: 2.5
          high: 2.8
          unit: USD B
        - label: 已报道当前估值标记
          low: 1.7
          mid: 1.75
          high: 1.8
          unit: USD B
    approximationNotes: 区间反映章节里的情景假设，由估计收入区间和倍数区间构建，因为 Nourish 未公开披露收入。
    claimRefs:
      - CV006
      - CV007
      - CV038
      - CV039
      - CV040
      - CV050
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: wide
    summary: 以 IC 口径在七个估值相关维度上按 1-5 分评分，5 代表支撑最强。
    data:
      items:
        - label: 市场顺风
          value: 4
          note: 慢性病和代谢照护需求背景庞大。
        - label: 运营证据
          value: 4
          note: 规模、结果、ROI 和健康系统证据都可见。
        - label: 竞争位置
          value: 4
          note: 按披露规模看，Nourish 似乎领先最接近的私营营养照护同业。
        - label: 收入可见度
          value: 1
          note: 公开收入和利润率披露仍然缺失。
        - label: 报销持久性
          value: 2
          note: 保险牵引的模型有吸引力，但暴露于政策和覆盖变化。
        - label: 估值纪律
          value: 2
          note: 当前价格已经预支了未来披露强劲收入的预期。
        - label: 证据质量
          value: 2
          note: 官方运营证据扎实，但估值证据链还不完整。
    approximationNotes: 评分只辅助判断，不应解读为独立投资模型。
    claimRefs:
      - CV008
      - CV009
      - CV018
      - CV029
      - CV033
      - CV042
      - CV043
      - CV044
