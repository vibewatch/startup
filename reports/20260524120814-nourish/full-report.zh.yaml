  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与替代品
        blocks:
          - type: paragraph
            body: >-
              Nourish 应放在保险覆盖、营养师主导的虚拟营养和代谢护理市场中分析，而不是整个食品、健康管理或减肥药经济。需求侧最强证据来自公共卫生数据。CDC 称，慢性病每年推高美国医疗成本 $4.9
              trillion，每 4 名成年人中有 3 名至少有一种慢性病，2023 年有 40.1 million 人患糖尿病、115.2 million 成年人处于糖尿病前期。CDC 还称，心血管疾病在 2023 年导致
              919,032 人死亡，2021 至 2022 年心脏病护理和用药成本超过 $168 billion。这些数字解释了为什么支付方、雇主和服务提供者持续寻找成本更低的行为改变基础设施。


              这种疾病负担不代表每一美元慢性病支出都属于 Nourish 的市场。纳入市场是由注册营养师通过远程医疗交付、可报销的门诊营养和代谢支持，通常叠加转诊管理、护理协调、实验室检测和 GLP-1
              支持。排除或相邻资金池包括自费健康内容、食品产品、住院营养服务，以及不拥有长期营养行为改变的纯远程开方模式。Nourish 自身页面也强化了更窄边界：公司把自己呈现为面向糖尿病、心脏健康、肥胖、GI 问题和
              GLP-1 支持的保险覆盖、长期远程医疗，而不是一次性膳食计划市场。实际结果是，买方预算、编码规则和服务提供者供给，比任何泛泛的“营养 TAM”标题更重要。
