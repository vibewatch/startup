  - id: TP001
    title: 竞争者画像表
    columns:
      - 公司 / 选项
      - 类别
      - 已披露规模 / 融资
      - 目标买方或用户
      - 差异化
      - 相比 Nourish 的限制
    rows:
      - - Nourish
        - 直接同业 / 参照点
        - 10,000+ RD；200M+ 覆盖人群；$100M Series C；累计融资 $215M
        - 患者、健康险计划、雇主、医疗系统、医疗服务提供者
        - 保险覆盖的代谢诊所，叠加实验室、GLP-1 管理、AI 智能体和转诊深度
        - 未公开合同定价，公开收入披露有限
      - - Fay
        - 直接同业
        - 2,300+ RD；200M+ 覆盖美国人；$50M Series B，估值 $500M
        - 消费者、雇主、医生、付款方
        - 付款方集成强，并用垂直 AI 自动化营养师工作流
        - 医疗服务叠加和转诊深度的公开披露范围窄于 Nourish
      - - Berry Street
        - 直接同业
        - 1,000+ RD；$50M 融资；1,250+ 保险计划合作
        - 消费者和独立营养师诊所
        - 私人诊所赋能，叠加 AI 后台工具和消费者 App
        - 公开记录看起来更偏赋能，不如 Nourish 诊所整合度高
      - - Foodsmart
        - 相邻规模化玩家
        - 2.2M 会员；Rise Fund 投资 >$200M；1,000+ 雇主
        - 健康险计划、雇主、医疗服务系统、会员
        - 远程营养，叠加食品福利、SNAP、食品订购和食品处方
        - 相比 Nourish，公开定位不太像广义 1:1 虚拟代谢诊所
      - - Omada
        - 相邻规模化玩家
        - 1.02M 会员；2026 年 Q1 收入 $78M；与前三大 PBM 均有关系
        - 雇主、健康险计划、PBM、医疗系统
        - 覆盖多病种的心代谢平台，提供 GLP-1 支持，企业分销强
        - 营养只是更广慢病护理模型中的一个组件
      - - Virta
        - 相邻规模化玩家
        - 降低用药定位；全国性健康险计划合作
        - 健康险计划、雇主、有代谢疾病的会员
        - 以疾病逆转为叙事，配套辅导、护理团队和 App 支持
        - 广泛保险覆盖 RD 市场规模的公开证据不够明确
      - - Hims
        - 替代品 / 面向消费者选项
        - 市值 $5.5B；Yahoo 披露 FY26 Q1 收入 $608.1M
        - 追求便利和减重入口的自费消费者
        - 药房、远程医疗和品牌触达形成闭环，覆盖多个品类
        - 不接受保险，也不是营养师主导
      - - 传统线下营养师
        - 现状替代品
        - 美国 90,900 个岗位的劳动力中已有线下护理基础
        - 使用诊所、医院或本地诊疗机构的患者
        - 熟悉的临床信任和面对面护理
        - 发现路径分散、可及性不一，软件带来的便利更弱
      - - 自建 / 既有供应商栈
        - 现状 / 自建
        - 预算往往嵌在既有付款方、PBM 或医疗服务运营中
        - 健康险计划、PBM、雇主、医疗系统
        - 可把营养支持打包进既有护理管理或 GLP-1 工作流
        - 通常缺少 Nourish 公开披露的专业 RD 供给密度
    notes: 截至 2026-05-24，本表覆盖章节简报要求的所有重要替代类别：直接同业、相邻规模化玩家、替代品、现状方案和自建路线。规模和融资字段只使用本地抓取包中的公开披露数字；合同经济性未知，因此有意保留为定性表述。
