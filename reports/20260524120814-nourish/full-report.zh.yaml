        - 最好的上市代谢护理收入锚
        - 业务组合和公司阶段不同于 Nourish。
      - - Hims & Hers
        - 上市成长型健康平台
        - '5.497'
        - 2026 指引 2.8-3.0
        - ~1.8x-2.0x
        - ~2.6M 订阅用户
        - 有用的上市增长上沿可比公司
        - 消费者现金支付和广泛品类组合差异很大。
      - - Teladoc Health
        - 上市远程医疗在位者
        - '1.18'
        - 2025 收入 2.53
        - ~0.47x
        - 大型传统远程医疗规模
        - 显示上市远程医疗估值压缩的严重程度
        - 更成熟、增速更慢，战略上也不同。
      - - WW International
        - 上市体重管理品牌
        - '0.128'
        - TTM 收入 0.692
        - ~0.18x
        - 大品牌，但股权承压
        - 显示肥胖相邻上市情绪可以有多严厉
        - 转型故事；不是干净的运营类比。
    notes: 上市公司倍数基于市值而非企业价值，因为本地抓取的来源包提供的是市值锚点。所有 Nourish 收入引用仍明确为未披露或估算。
