      - number: '1.3'
        title: 资本形成与利益相关方地图
        blocks:
          - type: paragraph
            body: >-
              资本故事在融资势头上强，在定价细节上弱。第三方报道称 Nourish 于 2024 年 3 月完成 $35 million Series A。官方披露随后显示，2025 年 $70 million Series
              B 将累计融资推至 $115 million，2026 年 5 月 $100 million Series C 又把累计融资提升至 $215
              million。对一家年轻护理交付平台而言，投资人名单异常稳定：J.P. Morgan 领投 Series B；Menlo 领投 Series C；Thrive Capital、Index Ventures、Y
              Combinator、Maverick、BoxGroup、Atomico 等继续出现。重复参与很重要，因为 Nourish
              的模式同时要协调三类稀缺群体：患者、支付方报销和庞大营养师网络。公开渠道披露支持这一逻辑。Nourish 称患者来自数字营销、医生、医疗系统、雇主、保险目录和口碑；Series C 材料又加入数百个计划、超过
              200 million 覆盖人群，以及来自超过 250 个医疗系统的转诊。未解决的问题是估值透明度：官方新闻稿披露融资额，但不披露股权结构价格，尽管第三方媒体将 Series C 定在 $1.75
              billion。
