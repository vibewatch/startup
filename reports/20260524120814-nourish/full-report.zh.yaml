        title: 伙伴集中、转诊依赖和不透明利润率，让业务模型比收入增长叙事更脆弱
        blocks:
          - type: paragraph
            body: >-
              Nourish 的扩张故事很亮眼，但结构上依赖公司没有完全披露的交易对手。Series C 称 Nourish 与数百个健康计划合作，覆盖 200M+ 人群，并有 250+
              个医疗系统和数万名转诊提供方把患者导入模型。Community Health Network 说明这不是假设：Nourish 可以嵌入既有医疗系统工作流，并通过患者当前福利完成路径。协调 FAQ 和转诊时效
              FAQ 把这种依赖变得更具体，承诺共享临床记录，并为转诊患者快速跟进。这有价值，但也意味着保险方、医疗系统和转诊提供方不只是需求来源，而是运营依赖。经济性同样由覆盖牵引。Y Combinator
