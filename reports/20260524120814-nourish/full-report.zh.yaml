      - number: '8.2'
        title: 融资故事在轮次规模和业务规模上可信，但完整估值桥仍未打通
        blocks:
          - type: paragraph
            body: >-
              公开融资轨迹在募资额上很强，在精确估值桥上较弱。2025 年 4 月的 Series B 明确融资 $70M，把累计融资推到 $115M；2026 年 5 月的 Series C 又融资
              $100M，把累计融资推到 $215M。两轮之间的运营进展很实质：Nourish 自有材料从 3,000+ 名营养师和数十万患者，推进到帮助 500k+ 人、6,000+ 名营养师，再到 10,000+
              名营养师、数百万次预约、250+ 医疗系统关系和 200M+ 覆盖人群。这足以支撑估值的真实上台阶。缺口在精确桥接。本文审阅的本地公开材料没有直接证实常被引用的说法，即 Series B 本身已经超过
              $1B；官方 Series C 发布也没有披露估值，投资者只能依赖 Axios 和 Ventureburn 给出的 $1.75B
              报道口径。因此，本章把估值动能视为合理，但在管理层给出直接轮次条款和当前经济性之前，还不能算完全可审计。
