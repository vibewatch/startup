      - number: '8.3'
        title: 私营可比公司确有支撑，但公开市场倍数压缩仍让当前估值显得吃力
        blocks:
          - type: paragraph
            body: >-
              Nourish 最强的估值防线来自私营和品类特定比较，而不是公开远程医疗可比公司。Fay 是最干净的私营基准：估值 $500M，拥有 2,300+ 名营养师，并有广泛支付方触达。只看已披露网络规模，Nourish
              据报道的 $1.75B 估值并不荒唐；相当于 Fay 估值的约 3.5x，对应超过 4x 的营养师规模。Foodsmart 提供第二个品类锚点：它在会员触达上明显更大，服务 2.2M 会员，并获得 $200M+
              Rise Fund 投资，这说明 Nourish 相比品类最大既有公司仍更早，而不是已经过度放大。更难的是公开可比公司。Omada 当前市值隐含约 3.0x 收入，Hims 约 1.8x-2.0x，Teladoc
              约 0.47x，WW 约 0.18x。这些公司并非完全可比，但合在一起说明当前公开市场有多苛刻。在这个背景下，Nourish 据报道的估值需要一个远大于公开材料当前披露水平的收入基础。
