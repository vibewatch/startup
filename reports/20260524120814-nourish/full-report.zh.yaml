      - number: '5.3'
        title: Nourish 正从 RD 就诊延伸到更宽的代谢诊所和转诊集成层
        blocks:
          - type: paragraph
            body: >-
              2026 Series C 公告最清楚地证明，Nourish 产品已越过经典虚拟营养咨询。它现在描述的是营养师主导的代谢诊所：每位患者仍与 RD 远程合作，但临床需要时，可以叠加实验室检测、GLP-1
              开方、用药管理和其他虚拟医疗护理。GLP-1 页面把这种扩张具体化：Nourish 营销专门的 Companion 和 Off-Ramp
              路径，处理副作用、肌肉流失、营养充足、食欲变化和体重维持，并且现在发布持续率和结果数据来支撑该工作流。在服务提供者侧，FAQ 和伙伴材料显示的不是纯消费者获客，而是转诊集成。Nourish
              称其与转诊伙伴共享临床记录，在 1 个工作日内联系被转诊患者，在 24 hours 内提供预约，并可嵌入多个专科的医疗系统工作流。Community Health Network
              公告尤其重要，因为它把关系描述为嵌入既有临床运营的工作流集成，尽管没有披露深入技术 EHR 或 API 架构。因此，即便技术管道仍不透明，产品在工作流层面看起来已具备商业成熟度。
