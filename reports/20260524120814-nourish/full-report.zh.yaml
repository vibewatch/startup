      - number: '2.3'
        title: 买方、用户、支付方与 GLP-1 顺风
        blocks:
          - type: paragraph
            body: >-
              商业逻辑是多边的。终端用户是有糖尿病、肥胖、心脏健康、GI 或其他营养相关需求的患者；经济支付方可能是商业保险、Medicare、雇主福利项目，或希望改善结果并降低下游成本的医疗系统转诊流程。Nourish
              当前网站称，患者通过数字营销、雇主、服务提供者、保险目录和口碑进入平台。面向服务提供者的 FAQ 称，新诊断、异常实验室结果、治疗不依从或显著体重变化之后应发起转诊；Nourish 会在 1
              个工作日内联系被转诊患者，并在 24 hours 内提供预约，同时共享临床记录并与转诊服务提供者协调治疗。实验室 FAQ
              还称，营养师可直接或联合其他服务提供者推动所需检测。这些机制解释了为什么雇主和医疗系统即便不是可见用户，也能成为预算所有者或渠道合作伙伴。


              GLP-1 强化了买方逻辑，但强化方式受约束。Nourish 的结果和 GLP-1 页面称，营养支持能改善减重、依从性、副作用和持续率；KFF 则称 Medicaid 对肥胖治疗覆盖仍有限且由州选择，截至
              2026 年 1 月，只有 13 个州 fee-for-service 计划覆盖 GLP-1 肥胖治疗。Pharmacy Times 补充说，2025 年部分州继续推动覆盖强制要求，包括 North Dakota
              的 essential-health-benefit 路径，因此商业扩张在边际上是真实的。市场信号不是“GLP-1
              已解决肥胖报销”。信号是，用药增长提高了支付方和雇主寻找长期支持模式的紧迫性：这些模式要保护持续用药、减少副作用，并比单独药费讲出更好的 ROI 故事。
