      - number: '4.5'
        title: 财务结论：报销质量有吸引力，披露缺口实质，政策风险真实
        blocks:
          - type: paragraph
            body: >-
              证据最充分的财务结论是：收入质量偏正面，但利润率路径和资本充足性需要谨慎。Nourish
              看起来拥有真实的报销主导引擎、低患者价格摩擦、强转诊和合作伙伴分销，以及一组可能支撑支付方续约的结果主张。该模式也不止基础远程营养，因为公司现在围绕就诊叠加实验室、GLP-1 管理、协同护理和 AI
              工作流工具。这些特征让业务看起来比自费健康 App 更耐久，也比简单服务提供者目录更可防守。


              Goodwin 对 2025 年后 Medicaid 削减的分析指向更艰难的报销背景，任何有公共项目敞口的业务都会受影响；KFF 显示 Medicaid 中的 GLP-1 肥胖覆盖仍有限，且由各州选择。这不会击穿
              Nourish
              的模式——其核心故事是营养优先，而不是只靠药物——但会限制任何假设广泛药物报销或公共项目稳定性的代谢护理产品上行空间。更重要的是，最大阻塞仍是公司选择不披露的内部经济性：确认收入、支付方费率、拒赔、临床人员利用率、毛利率、burn
              和 runway。在这些通过私下渠道共享之前，正确姿态不是怀疑需求，而是保持承销纪律。收入质量看起来有吸引力；收入规模、利润率耐久性和融资依赖仍披露不足。
