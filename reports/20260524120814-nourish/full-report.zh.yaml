  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 保险报销是核心收入引擎，合作主要拓宽分销
        blocks:
          - type: paragraph
            body: >-
              Nourish 的公开记录支持一个简单但商业上有吸引力的核心收入模型：获取或接收患者，核验福利，把患者匹配给注册营养师，交付虚拟护理，然后向保险方收费，而不是依赖消费者直接支出。Forbes
              明确把该模式描述为雇用持证营养师、通过虚拟平台把他们与患者连接，并直接向保险公司计费。公司的 billing PDF 和 insurance FAQ 也强化同一结构。Nourish 称，94% 网内患者自付
              $0，公司自行处理网内理赔，并使用 no-surprise billing guarantee，为已经完成但被拒赔或落入免赔额的就诊免除费用。自费存在，但公开看更像 $145 每次的备用阀，而不是核心经济性。


              更细的点在于 Nourish 的次级渠道如何围绕该引擎运转。公司称患者来自数字营销、转诊、保险目录、现有患者口碑，以及与医疗系统和雇主的合作。Community Health Network 合作和 2026
              Series C
              材料暗示，医疗系统、雇主和计划主要是同一保险方支付就诊流周围的分销和签约层，而不是单独披露的独立收入线。这在战略上是正向的，因为更宽渠道应降低摩擦、提高转诊密度；但也让本章锚定在报销质量，而不是软件式订阅数学上。唯一清楚的反向报销信号是
              Medicaid：2025 年 4 月 Series B 新闻稿称 Nourish 与 Medicaid 计划合作，而当前 FAQ 称不接受
              Medicaid。即便底层原因未披露，这个矛盾也真实提示支付方范围波动。
