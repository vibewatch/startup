        - 否则患者需要搜索目录或等待转诊匹配
        - Nourish 匹配专科营养师并处理排班
        - 降低搜索摩擦，更快完成首次就诊
        - 匹配方法未披露
      - - 在两次预约之间持续获得支持
        - 就诊结束后，患者往往失去动力
        - 会后笔记、消息、App 提醒、目标和饮食记录
        - 形成督促和纵向行为改变闭环
        - 未公开按功能拆分的留存队列
      - - 在营养支持下使用 GLP-1
        - 只给药项目常在副作用和持续性上卡住
        - Companion 和 Off-Ramp 路径，加上 RD 指导
        - 33% 更高减重和 68% 六个月持续性是公司声称的信号
        - 抓取包中没有独立受控研究
      - - 下单检测或协调更广泛照护
        - 碎片化营养照护可能漏掉实验室检测或医生协同
        - 营养师可直接或与其他服务方一起推进检测，并共享临床笔记
        - 支持一体化代谢照护，而非孤立咨询
        - 各州执业范围实施细节未披露
      - - 从医疗系统或医生办公室转诊
        - 人工转诊常停滞，或缺少后续可见性
        - Nourish 在一个工作日内联系，并在 24 小时内提供预约
        - 交接更快，门诊营养服务更容易触达
        - 未披露 API、EHR 接口或闭环转诊报告数据结构
      - - 运营营养师执业，不被行政事务拖住
        - 独立 RD 否则需自行处理账单、资质认证和执照
