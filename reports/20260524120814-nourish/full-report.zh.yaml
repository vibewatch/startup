        - 远程医疗就诊、长期 MNT、营养规划、照护协调
        - 自费健康内容和食品产品
        - 患者用户；保险方、雇主或 Medicare 支付方
        - 这是 Nourish 实际围绕建设的变现引擎
      - - 一体化代谢照护延伸
        - 注册营养师主导的糖尿病、肥胖、心脏健康、GI 问题和 GLP-1 项目支持
        - 药物支出本身和药房分销经济性
        - 支付方医疗管理预算和转诊工作流
        - 把价值从一次性咨询扩展出去，但仍处在受监管报销内
      - - 分发层 — 雇主 / 提供方 / 医疗系统转诊
        - 转诊路径、资格核验、排期和长期参与
        - 没有报销转化的独立消费者营销支出
        - 福利负责人、临床医生、照护团队
        - 预算归属和工作流集成与患者意图同样重要
      - - 相邻替代 — 线下门诊营养师照护
        - 传统诊所营养咨询
        - 不排除其作为竞争，但它不在 Nourish 的虚拟交付逻辑内
        - 患者加保险方 / Medicare
        - 说明公司与既有供给方竞争，而不只是与应用竞争
      - - 相邻替代 — 纯 GLP-1 远程开方或健康应用
        - 只做药物的项目或轻量习惯应用
        - 没有注册营养师主导的长期行为改变层
        - 现金自费或药房预算
        - 重要替代集合，但不是同一种照护模型或报销逻辑
    notes: 纳入范围定义为可报销的虚拟营养和代谢照护，而不是全部食品、健康或肥胖药支出。列出相邻领域，是为了避免 TAM 被抬得过高。
