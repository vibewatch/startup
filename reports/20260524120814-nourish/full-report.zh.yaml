        - 如果认知和转诊流程改善，仍有空白市场
      - - GLP-1 采用和持续使用问题
        - 驱动因素
        - 当前
        - Nourish GLP-1 页面，以及 KFF 和 Pharmacy Times
        - 整合式营养支持变得更迫切，不能只靠用药护理
      - - RD 供给瓶颈
        - 约束
        - 结构性
        - BLS 劳动力数据对比 Nourish 网络披露
        - 供给聚合和服务提供者留存是战略问题，不是后台问题
      - - Medicare 诊断限制
        - 约束
        - 当前
        - CMS NCD 和 Nourish Medicare FAQ
        - 疾病负担大，不等于 Medicare 会普遍报销
      - - Medicaid 与州级覆盖限制
        - 约束
        - 当前 / 近期
        - KFF、Goodwin、当前 Medicaid FAQ
        - 公共项目需求会因州和预算周期显著缩水或波动
      - - CPOM 与分费审查
        - 约束
        - 当前
        - Dickinson Wright 法律分析
        - 全国远程医疗扩张需要治理能力，也要严守州法
    notes: 各行把结构性需求驱动与报销、法律、供给约束放在一起，因为市场采用要同时看这三件事。Medicaid 一行有意保留当前披露与过往披露之间的矛盾。
