            body: >-
              Nourish 的信任和质量姿态不是空的，只是不均衡。同意协议相对详细：涵盖 HIPAA 权利、治疗和付款用途、远程医疗风险、Zoom 使用、AI
              生成摘要、有限录音保留，以及平台内消息不用于紧急情况或实时监控。服务提供者页面补充了临床质量经理和辅导；about 和 outcomes
              页面也强化公司衡量护理质量，并用研究和反馈改善实践。问题在于公开披露的外边界。隐私页面可见最后更新于 2022 年 1 月，但现在已经引用 Apple Health 和 Google Health Connect
              数据；负责任披露页面相对于公司当前 AI 原生代谢诊所定位显得轻：它提供邮箱渠道、5 个工作日确认目标和关键问题 10
              个工作日目标，但没有公开漏洞赏金、安全架构、认证清单、状态页或渗透测试摘要。因此，产品成熟度在护理工作流上显得强，但在可靠性、供应商和安全细节更具体披露前，技术信心应保持中等。
