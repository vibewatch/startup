            body: >-
              来源包中可见的产品架构有三层实用结构。第一层是患者体验：排班、远程医疗就诊、消息、饮食记录、食谱，以及接入可穿戴设备或实验室上下文的集成。第二层是临床人员工作流：Nourish
              的服务提供者页面描述了一个用于排班、虚拟就诊、患者 EHR、饮食记录，以及 AI 驱动病历记录或辅助的平台；2025 和 2026 融资材料还加入 AI 饮食追踪、临床洞察浮现、笔记自动化和服务提供者
