  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 直接同业 Fay 和 Berry Street 是最接近的产品替代品
        blocks:
          - type: paragraph
            body: >-
              Nourish 最清晰的直接竞争者是 Fay 和 Berry Street，因为三家公司都营销由保险覆盖的注册营养师可及性，并把营养支持定位为慢性病和 GLP-1
              需求的长期答案，而不是一次性健康内容产品。公开证据仍显示这个同业组内部有明显分化。Nourish 2026 年 5 月 Series C 帖文称，公司拥有超过 10,000 名营养师、数百万次预约、超过 200
              million 覆盖人群、健康计划合作、医疗系统转诊、面向患者和服务提供者的 AI agents，以及实验室和 GLP-1 开方等医疗延展。Fay 2025 年 2 月材料也很扎实但更窄：Fay 称其以 $500
              million 估值融资 $50 million，拥有超过 2,300 名营养师，通过支付方集成覆盖超过 200 million 美国人，并用 vertical AI 自动化理赔、排班和随访。Berry
              Street 的定位再次更窄，围绕私营执业赋能：第三方报道称其拥有超过 1,000 名营养师、超过 1,250 个保险计划合作、AI 驱动后台工具和消费者 App，但其公开记录看起来仍比诊所更像市场平台。

              实际含义是，Fay 和 Berry Street 足以让 Nourish 无法在保险覆盖营养护理中像垄断者一样行事，但两个直接同业都没有匹配 Nourish
              披露出的服务提供者规模、转诊深度和更广代谢护理分层组合。Fay 在支付方集成、雇主 logo 和 AI 工作流支持重要的场景最强；Berry Street
              在赋能独立营养师诊所和释放低使用率保险福利的场景最强。Nourish
              在买方需要更一体化的代谢诊所时最强：信任姿态更宽、临床范围更广，也更能与医疗系统互操作。由此得到的结论需要细分：直接同业在营养师供给和保险发现上构成真实风险，但 Nourish
              最大优势不只是“更多营养师”。优势在于把规模与支付方分销、协同护理，以及更明确的 GLP-1 加代谢工作流绑在一起。
