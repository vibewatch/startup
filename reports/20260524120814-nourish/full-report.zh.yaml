  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 患者工作流从入组到持续 RD 护理都很清楚，App 承接两次就诊之间的支持
        blocks:
          - type: paragraph
            body: >-
              Nourish 面向客户的产品，最好理解为一套引导式护理工作流，而不是单一 App 功能。首页和 GLP-1
              病种页面展示同一路径：患者说明目标和症状，上传保险信息，被匹配给营养师，并预约一次远程医疗就诊。护理开始后，该模式刻意设计成持续发生。Nourish
              描述的是定期虚拟预约、会后笔记和就诊间消息，而不是一次性咨询。患者 App 随后用目标追踪、饮食记录、宏量营养素或照片上传、食谱推荐、病种指南和持续提醒，承接两次就诊之间的循环。这在战略上重要，因为它让
              Nourish
              更像有长期触点的行为改变服务，而不是静态服务提供者目录。同一组患者材料也说清楚，护理是个性化的：营养师查看病史、饮食习惯、生活方式和用药情况，并在需要时与现有服务提供者合作。最强保留点是匹配。公开来源清楚说
              Nourish 会把患者匹配给专家营养师，但没有解释匹配层本身由 AI 驱动，还是只是基于规则并由运营辅助。
