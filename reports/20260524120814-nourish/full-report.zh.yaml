        - label: 临床照护层
          detail: 注册营养师问诊仍是核心服务；Nourish 现在把 GLP-1 路径、实验室检查、处方、用药管理，以及必要时与其他服务方协同都接了进去。
          items:
            - 初次评估 + 定期 RD 问诊
            - GLP-1 Companion 与 Off-Ramp 路径
            - 实验室检查协助 / 开单
            - 用药管理与处方
            - 与外部服务方共享临床记录
        - label: AI 与工作流智能层
