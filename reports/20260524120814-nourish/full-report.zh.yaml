      - number: '4.2'
        title: 结果、参与度和支付方 ROI 更能支撑收入质量，但不足以披露实际定价
        blocks:
          - type: paragraph
            body: >-
              公开证据对收入质量的支撑，强于对收入规模的支撑。Nourish 的 2025 impact-report 帖文称，健康计划伙伴第一年看到经独立验证的 3.1x ROI；2026 Series C
              材料称，该模式每年为健康计划带来每名患者超过 $2,000 的节省。临床侧，结果页面披露，未使用减重药患者 12 个月后平均减重 8%，6 个月后 A1C 平均降低 1.3%，LDL 在 6 个月后降低 31
              mg/dL，与 Nourish 搭配的 GLP-1 患者减重多
              33%。这些是公司声称的指标，不是经审计的支付方数据，但仍重要，因为报销主导的护理平台通常需要用可衡量结果、更低医疗支出和正向患者体验的某种组合来捍卫续约预算。


              参与度信号指向同一方向。Nourish 称 81% 患者会回访第二次，90% 在 3
              个月后朝健康目标取得进展。这些不能替代支付方层面的留存、拒赔趋势或净收入留存率，但确实说明该平台更像持续护理模型，而不是一次性营养内容。问题在于，实际经济性仍不透明。保留来源显示患者通常支付什么、公司声称能产生什么结果、管理层如何谈支付方
              ROI，但没有揭示每次就诊的平均核准金额、拒赔后的实收金额、按支付方类型拆分的量，或雇主和健康计划合作背后的合同结构。换句话说，漏斗顶端和临床价值故事可见，下面的收入确认层不可见。
