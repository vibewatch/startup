      - 指标 / 数值
      - 来源 / 方法
      - 为什么不是直接 TAM
      - 含义
    rows:
      - - 慢性病负担视角
        - $4.9T 年度医疗成本；75% 成人有 1+ 种慢性病
        - CDC 慢性病概览
        - 负担不等于一家营养平台可获得的可报销支出
        - 说明买方为何在意
      - - 糖尿病视角
        - 2023 年 40.1M 糖尿病患者
        - CDC National Diabetes Statistics Report 报告
        - 诊断患病率窄于全部营养需求，也不等于已覆盖福利使用
        - 锚定较保守的需求侧底线
      - - 糖尿病前期视角
        - 2023 年 115.2M 糖尿病前期成人
        - CDC National Diabetes Statistics Report 报告
        - 与更广泛的心代谢风险和商业覆盖人群重叠
        - 显示确诊疾病之外的预防机会
      - - 覆盖准入视角
        - 200M 覆盖人群；全部 50 州
        - Nourish Series C 和公司页面
        - 覆盖人群不等于网内、符合诊断资格或已使用的福利
        - 显示获客漏斗顶部准入上限
      - - 已实现使用视角
        - 2025 年服务 500k 患者；已覆盖福利使用率 <1% 的说法
        - Nourish 影响报告和 Series B
        - 服务患者是历史吞吐，不是未来市场规模
        - 显示准入与实际使用之间的差距
      - - 供给视角
        - 90.9k 个美国岗位 vs. Nourish 声称 10k+ 营养师
        - BLS 和 Nourish Series C
        - 职业人数和公司网络声称不能与可用临床小时互换
        - 显示供给集中和扩张约束
    notes: 本表刻意使用多个彼此不兼容但有证据支撑的视角，而不是编造一个可加总 TAM。疾病患病率、覆盖人群和已实现使用会重叠，应被读作边界，而不是公式。
