      - number: '7.5'
        title: 只有报销耐久性、结构合规和运营控制并行改善，剩余风险才可控
        blocks:
          - type: paragraph
            body: >-
              缓释因素真实但不完整。Nourish 有几层缓冲：采用 W-2
              和集中运营模型，而不是松散承包商市场；与提供方有成文的照护协调实践；计划和医疗系统已经使用该服务，有广泛商业证明；营养优先逻辑也不完全依赖出售药物准入。这些都是有意义的正面因素，但剩余暴露仍高，因为公开材料没有回答最关键的投资尽调问题。公司没有解释
              Medicaid 矛盾背后的时间线，没有披露逐州的代谢诊所执业结构，没有说明质量保证如何在 10,000
              名营养师中扩展，也没有发布企业买方通常期待的安全和事件响应细节。因此，正确的监控姿态要具体，而不是抽象：盯住 Medicaid 和 Medicare 营养政策、州级远程医疗报销更新、针对减重远程医疗同行的
              CPOM 或费用分成执法、Medicaid FAQ 或保险覆盖措辞的任何变化、医疗系统转诊的扩张或收缩、公开安全文档升级，以及劳动力压力或伙伴流失迹象。如果报销广度在自费或雇主经济性被证明前收窄，如果 CPOM
              审查迫使药物服务重组，或如果披露深度仍落后于野心时发生隐私或质量事件，当前投资逻辑会很快破裂。
