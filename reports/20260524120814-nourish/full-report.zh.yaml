companyProfile:
  summary: >
    Nourish 是一家美国虚拟营养和代谢护理平台，2021 年由 Aidan Dewar、Sam Perkins 和 Stephanie Liu 创立。公司通过保险覆盖的远程医疗模式把患者连接到注册营养师，并已从营养咨询扩展为更宽的
    AI 原生代谢诊所，包含实验室检测、GLP-1 相关支持和协同虚拟护理。到 2026 年 5 月，Nourish 称其拥有超过 10,000 名注册营养师、完成数百万次预约、覆盖超过 200 million 人，并获得超过 250
    个医疗系统转诊；公开证据还显示，2025 年已服务 500,000 名患者，健康计划伙伴首年 ROI 据报为 3.1x。
