      - number: '3.3'
        title: 自费 GLP-1 平台和传统上市可比公司框定替代品集合
        blocks:
          - type: paragraph
            body: >-
              Hims 和传统线下营养师护理是最相关替代品，但它们给 Nourish 施压的方式不同。Hims 是更清晰的消费者需求替代品，因为 Yahoo
              资料页把它描述为覆盖减重、心理健康、性健康、皮肤科和其他品类的大型远程医疗与药房平台，拥有超过 2 million 订阅者，不接受保险，客户直接付款。这使 Hims
              比营养师主导更偏药物和药房主导，因此它争夺的是同一类围绕减重和便利性的消费者意图，却不直接匹配 Nourish 的支付方集成临床姿态。传统门诊营养师是核心现状。TechCrunch 的 Berry Street
              报道与 BLS 劳动力数据共同显示，营养护理线下早已存在，但仍碎片化且使用不足；这正是 Nourish、Fay 和 Berry Street 试图用软件、保险工作流和更宽网络可及性解决的低效。

              上市可比公司还给出估值和耐久性警示。Yahoo 和 CompaniesMarketCap 显示，Hims 在 2026 年 5 月下旬市值约 $5.5 billion，对应第一季度收入约 $608
              million，反映公开市场愿意为规模化 DTC 健康和药房分销付费。Teladoc 展示相反教训：Macrotrends 和 CompaniesMarketCap 显示 2025 年收入约 $2.53
              billion，但 2026 年 5 月市值只有约 $1.18 billion。WW 提供另一重警示框架，Yahoo 显示其市值只有约 $128 million，而过去 12 个月收入约 $692
              million。结论不是 Nourish 会像其中任何一种模式。结论是，一旦增长或利润率预期改变，公开市场会非常不同地拆分药物主导的消费者规模、报销主导的护理交付和体重管理品牌。因此 Nourish
              处在替代品充足的市场里，单靠规模不足以锁定溢价估值。
