      - number: '8.4'
        title: 情景测算显示，当前轮次价格已接近合理基准情景的上沿
        blocks:
          - type: paragraph
            body: >-
              Nourish 没有披露收入，所以情景测算必须把假设摆在台面上。本章因此使用估计收入区间，而不是报告收入，并把它们连接到多组倍数范围；这些范围相对公开可比公司偏慷慨，但仍低于纯叙事定价。乐观情景下，Nourish
              证明收入大约超过 $250M，维持广泛报销支持，并展示足够的利润率结构，配得上高增长溢价倍数；这可以支撑约 $2.2B-$2.8B
              的价值，并相对当前据报估值带来有意义上行。基准情景下，公司兑现故事，但没有大幅超预期：约 $180M-$220M 的估计收入和持续报销稳定性，可以支持约
              $1.4B-$1.8B，意味着今天的进入价格已经接近满值。悲观情景下，报销压力、经济性较弱或公开可比公司倍数压缩，都可能把公允价值推回约 $0.8B-$1.2B。正是这种下行偏斜决定了正确动作是观察，而不是追高。
