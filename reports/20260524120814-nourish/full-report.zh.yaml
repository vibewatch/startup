      - number: '4.3'
        title: W-2 临床人员模式和集中运营，可能用利润率压力换控制和一致性
        blocks:
          - type: paragraph
            body: >-
              Nourish 成本结构看起来比纯市场更偏人力，因为公司称其营养师是 W-2
              员工，不是承包商。招聘页面还称，营养师获得固定保底就诊费率、雇主支付的福利，以及在理赔、资质认证、多州执照和患者获取上的集中支持；每周只需 15 次 session
              即可获得全职福利。这种设置应改善护理标准化、排班控制和临床质量管理，但也意味着除了每次就诊的可变成本外，还有真实固定成本层。BLS 对营养师和营养学家的工资基准——2024 年年薪中位数
              $73,850——没有揭示 Nourish 实际全口径临床人员成本，但它锚定了一个事实：大规模营养护理不是纯软件业务。


              AI 可能抵消部分负担，但公开材料只能提供方向性证据。Nourish 的 Series B 和 Series C 材料描述了 AI copilots 和 AI
              agents：自动记录笔记、浮现临床洞察、强化患者行为改变、减少行政工作。招聘页面把这个故事展开为一个统一工作流：排班、病历记录、EHR、消息和饮食记录。这个组合令人鼓舞，因为服务型护理模型的经营杠杆通常来自减少文档时间、提高负责患者面板密度、降低非计费开销。尽管如此，没有保留来源披露临床人员生产率、节省的文档分钟数、毛利率提升，或按就诊类型拆分的贡献利润率。可能的结论是，Nourish
              的成本基础在战略上合理——尤其如果公司想赢得支付方信任并做出差异化诊所模型——但公开记录仍无法证明利润率路径在哪里拐点。
