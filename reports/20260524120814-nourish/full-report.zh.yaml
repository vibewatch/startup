      - number: '2.4'
        title: 规模测算视角、采用约束与明确限制
        blocks:
          - type: paragraph
            body: >-
              公开证据支持几个规模测算视角，但无法拼出干净、可投资的 TAM/SAM/SOM 堆栈。最宽的需求代理是 CDC 的慢性病负担；更窄的需求代理是 2023 年 40.1 million 糖尿病患者和 115.2
              million 糖尿病前期成年人；可及性代理是 Nourish 的 200 million 覆盖人群和全部 50 州覆盖；已实现渗透代理是 2025 年服务 500,000 名患者，以及 Nourish 自称不到
              1% 符合资格的美国人使用已覆盖 RD 福利。这些数字方向上有用，因为它们显示需求、理论覆盖和实际使用之间差距很大。但它们不能相加。疾病人数会重叠，覆盖人群不等于符合可报销资格的成员，Medicare MNT
              规则也排除了大部分疾病负担。


              关键约束同样明确。Goodwin 认为 2025 年 Medicaid 削减可能按州以不均衡方式压缩参保和报销；Dickinson Wright 认为，如果企业运营方影响临床方案或开方，远程减重平台会面临
              CPOM 和 fee-splitting 风险。Nourish 自身公开材料也保留了一处覆盖矛盾：2025 Series B 语言提到 Medicaid 计划合作，但当前 Medicaid FAQ 称平台不接受
              Medicaid。这种不一致正是本章使用规模视角而不是单一 TAM 数字的原因。可投资逻辑是：市场很大，但监管很重；可及性扩张取决于支付方运营、州政策、诊断精确度和服务提供者供给纪律，其重要性不亚于疾病流行率。
