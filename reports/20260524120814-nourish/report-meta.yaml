companyProfile:
  summary: >
    Nourish is a U.S. virtual nutrition and metabolic-care platform founded in 2021 by
    Aidan Dewar, Sam Perkins, and Stephanie Liu. The company connects patients to
    registered dietitians through an insurance-covered telehealth model and has expanded
    from nutrition counseling into a broader AI-native metabolic clinic with labs,
    GLP-1-related support, and coordinated virtual care. By May 2026, Nourish said it had
    more than 10,000 registered dietitians, millions of completed appointments, more than
    200 million covered lives, and referrals from over 250 health systems, while public
    evidence also showed 500,000 patients served in 2025 and a reported 3.1x first-year
    ROI for health-plan partners.
  foundedDate: '2021-01-01'
  founders:
    - name: Aidan Dewar
      role: Co-founder and CEO
      background: Built Nourish after personal patient experience with nutrition-related chronic conditions and remains the company's main public spokesperson.
      claimRefs: [CO002, CO003]
    - name: Sam Perkins
      role: Co-founder, President and COO
      background: Public owner of payer economics and operating-model messaging; founder story is tied to personal experience with dietitian-led care.
      claimRefs: [CO002, CO004]
    - name: Stephanie Liu
