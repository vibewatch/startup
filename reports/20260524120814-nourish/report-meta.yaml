summary:
  headline: >
    Nourish has built a scaled, payer-aligned virtual metabolic-care platform with strong
    clinical and distribution signals, but the reported $1.75 billion 2026 valuation looks
    stretched until management discloses revenue, margins, and reimbursement durability in
    more detail.
