  foundingLocation: United States (exact founding city not publicly disclosed in retained sources)
  headquarters: New York, NY (public dateline signal; exact legal/operating HQ still needs management confirmation)
  productSummary: >
    Nourish pairs registered-dietitian telehealth visits with an AI-enabled patient app,
    provider copilots, meal and symptom tracking, wearable and lab integrations, and a
    growing metabolic-care layer that includes labs, GLP-1-related support, medication
    management, and coordinated care when clinically appropriate.
  customerFocus: >
    Patients with nutrition-related chronic conditions are the primary end users, while
    health plans, employers, health systems, and referring providers are the key
    reimbursement and distribution stakeholders.
  businessModel: >
    Core monetization appears to come from insurer-paid virtual dietitian visits rather
    than cash-pay subscriptions, with employer, payer, and health-system partnerships
    widening referral flow and coverage access around the same reimbursement engine.
  stage: Series C private company
  fundingStatus: >
    Nourish completed a $100 million Series C in May 2026, bringing total funding to
    $215 million. Third-party reporting put that round at a $1.75 billion valuation, but
    the official Series C release did not disclose a post-money price.
