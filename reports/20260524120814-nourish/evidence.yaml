evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: An official post-money valuation, share count, and round pricing table for the 2026 Series C.
    whyItMatters: >-
      Third-party valuation reporting is useful but insufficient for ownership dilution, option-pool, and
      valuation-stance work.
    diligencePath: Request the Series C financing deck, cap-table excerpt, or executed financing summary from management.
    relatedQuestionRefs:
      - QO017
  - type: conflicting-data
    severity: material
    topic: medicaid coverage
    missingEvidence: >-
      A dated payer-network change log that explains when and why Medicaid coverage language changed from accepted to
      not accepted.
    whyItMatters: >-
      The contradiction affects the quality of the covered-lives story, vulnerable-member access, and any thesis that
      depends on Medicaid reimbursement.
    diligencePath: >-
      Request a state-by-state payer roster with effective dates and a short explanation of Medicaid contraction or
      pause decisions.
    relatedQuestionRefs:
      - QO012
  - type: missing-source
    severity: minor
    topic: headquarters
    missingEvidence: An authoritative headquarters disclosure, office list, or legal-entity address that confirms the operating HQ.
    whyItMatters: >-
      Later chapters should not overstate jurisdiction, labor-market footprint, or local policy exposure from datelines
      alone.
    diligencePath: >-
      Request the principal office address from legal, HR, or financing materials and confirm whether New York is the
      operating headquarters.
    relatedQuestionRefs:
      - QO024
  - type: enumeration-incomplete
