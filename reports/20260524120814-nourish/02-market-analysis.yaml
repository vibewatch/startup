company:
  name: Nourish
chapter:
  number: 2
  title: Market Analysis
  summary: 'Nourish operates in a very large need market but a much narrower monetizable one: chronic-disease burden is massive, yet usable demand is gated by registered-dietitian supply, reimbursement rules, and state-by-state telehealth and legal variance. Public evidence supports multiple sizing lenses—40.1 million people with diabetes, 115.2 million adults with prediabetes, 200 million covered lives, and 500,000 patients served—but not a clean additive TAM. The investable thesis is real buyer pull from payers, employers, providers, and GLP-1 users, offset by Medicare diagnosis limits, limited Medicaid obesity coverage, Medicaid-cut risk, and CPOM compliance complexity.'
sections:
- id: market-boundary
  title: Market Boundary, Included Spend, and Substitutes
  body: 'Nourish should be analyzed inside the insurance-covered, dietitian-led virtual nutrition and metabolic-care market, not inside the entire food, wellness, or obesity-drug economy. The strongest need-side evidence is public-health data. CDC says chronic diseases drive $4.9 trillion in annual US healthcare costs, three in four adults have at least one chronic condition, 40.1 million people had diabetes in 2023, and 115.2 million adults had prediabetes. CDC also says cardiovascular disease caused 919,032 deaths in 2023 and heart-disease care and medication costs exceeded $168 billion between 2021 and 2022. Those figures show why payers, employers, and providers keep looking for lower-cost behavior-change infrastructure.


    That burden does not mean every chronic-disease dollar belongs in Nourish’s market. The included market is reimbursed outpatient nutrition and metabolic support delivered by registered dietitians over telehealth, often layered with referral management, care coordination, labs, and GLP-1 support. Excluded or adjacent pools include self-pay wellness content, food products, inpatient dietetics, and pure telehealth prescribing models that do not own longitudinal nutrition behavior change. Nourish’s own surfaces reinforce that narrower boundary: the company presents itself as insurance-covered, longitudinal, telehealth care for diabetes, heart health, obesity, GI issues, and GLP-1 support rather than as a one-time meal-plan marketplace. The practical result is that buyer budgets, coding rules, and provider supply matter more than any generic “nutrition TAM” headline.'
