- id: TM002
  title: TAM/SAM/SOM or sizing lens table
  columns:
  - Lens
  - Metric / value
  - Source / method
  - Why it is not a direct TAM
  - Implication
  rows:
  - - Chronic-disease burden lens
    - $4.9T annual healthcare cost; 75% of adults with 1+ chronic condition
    - CDC chronic-disease overview
    - Burden is not reimbursable spend available to one nutrition platform
    - Shows why buyers care
  - - Diabetes lens
    - 40.1M people with diabetes in 2023
    - CDC National Diabetes Statistics Report
    - Diagnosis prevalence is narrower than all nutrition need and still not equal to covered benefit use
    - Anchors a conservative need-side floor
  - - Prediabetes lens
    - 115.2M adults with prediabetes in 2023
    - CDC National Diabetes Statistics Report
    - Overlaps with broader cardiometabolic risk and with commercial covered lives
    - Shows prevention opportunity beyond diagnosed disease
  - - Coverage-access lens
    - 200M covered lives; all 50 states
    - Nourish Series C and company pages
    - Covered lives are not equal to in-network, diagnosis-qualified, or used benefits
    - Shows top-of-funnel access ceiling
  - - Realized utilization lens
    - 500k patients served in 2025; <1% covered-benefit use claim
    - Nourish impact report and Series B
    - Patients served are historical throughput, not future market size
    - Shows gap between access and actual use
  - - Supply lens
    - 90.9k U.S. jobs vs. Nourish claim of 10k+ dietitians
    - BLS and Nourish Series C
    - Occupation counts and company network claims are not interchangeable with available clinical hours
    - Shows supply concentration and scaling constraints
  notes: This table intentionally uses multiple incompatible but evidence-backed lenses instead of inventing one additive TAM. Condition prevalence, covered lives, and realized utilization overlap and should be read as bounds, not a formula.
