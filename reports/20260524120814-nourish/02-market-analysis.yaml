callouts:
- calloutType: strength
  title: Permanent telehealth coding plus underused covered benefits create real whitespace
  body: Permanent telehealth MNT billing and Nourish’s claim that fewer than 1% of eligible Americans use covered RD benefits together suggest a real adoption runway if referral and benefit-verification workflows improve.
  claimRefs:
  - CM013
  - CM040
  - CM047
- calloutType: risk
  title: Coverage breadth is not the same thing as stable reimbursement
  body: 'The current Medicaid FAQ, limited Medicaid obesity-drug coverage, and potential federal Medicaid cuts all point in the same direction: public-program demand can be broad in theory and still unstable in practice.'
  claimRefs:
  - CM038
  - CM042
  - CM055
- calloutType: insight
  title: GLP-1 tailwinds favor longitudinal support, not just medication access
  body: The strongest buyer logic is not generic weight-loss demand; it is the need for nutrition-first support that protects adherence, persistence, side-effect management, and ROI once GLP-1s enter the care pathway.
  claimRefs:
  - CM036
  - CM037
  - CM048
