  evidenceGaps:
  - type: missing-source
    severity: material
    topic: sam-precision
    missingEvidence: A de-duplicated member-level or actuarial model that converts covered lives into actually eligible, in-network, diagnosis-qualified demand for Nourish’s services.
    whyItMatters: Without this filter stack, the 200 million covered-lives figure overstates serviceable demand and makes any public SAM estimate too aggressive.
    diligencePath: Request payer-by-payer eligibility, network, diagnosis, and denial-rate data from management or major health-plan partners; use that to convert covered lives into qualified demand.
    relatedQuestionRefs:
    - QM027
    - QM030
    relatedTableRefs:
    - TM002
  - type: conflicting-data
    severity: material
    topic: tam-overlap
    missingEvidence: A consistent overlap model for chronic-disease, diabetes, prediabetes, obesity, and covered-life counts.
    whyItMatters: Current public lenses are directionally useful but overlap heavily, so any single public TAM would risk double counting and false precision.
    diligencePath: Build a payer or actuarial overlap model using member-level prevalence files or plan claims data; reconcile disease prevalence with eligibility and network data before publishing TAM.
    relatedQuestionRefs:
    - QM027
    - QM031
    relatedTableRefs:
    - TM002
  - type: missing-source
    severity: minor
    topic: state-rate-variance
    missingEvidence: State-by-state reimbursement rates, credentialing timelines, and parity enforcement for Nourish’s actual payer roster.
    whyItMatters: Policy existence does not equal equal reimbursement or fast provider onboarding; those operational details determine whether coverage is economically meaningful.
    diligencePath: Collect plan contract extracts, state Medicaid fee schedules, and internal credentialing metrics for the company’s live payer roster.
    relatedQuestionRefs:
    - QM011
    - QM012
    - QM030
    relatedTableRefs:
    - TM004
  - type: private-evidence-only
    severity: material
    topic: channel-mix
    missingEvidence: Actual acquisition and revenue mix by digital, payer, employer, provider, health-system, and word-of-mouth channels.
    whyItMatters: The buyer map is visible publicly, but the commercial durability of the model depends on which channels drive the most bookings, retention, and reimbursement quality.
    diligencePath: Request funnel conversion, CAC, retention, and claims-realization metrics by acquisition channel from management.
    relatedQuestionRefs:
    - QM032
    relatedTableRefs:
    - TM003
