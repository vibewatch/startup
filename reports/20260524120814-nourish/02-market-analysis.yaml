  - - RD supply bottleneck
    - Constraint
    - Structural
    - BLS workforce data vs. Nourish network claims
    - Supply aggregation and provider retention are strategic, not back-office, problems
  - - Medicare diagnosis limits
    - Constraint
    - Current
    - CMS NCD and Nourish Medicare FAQ
    - Large disease burden does not translate into universal Medicare reimbursement
  - - Medicaid and state coverage limits
    - Constraint
    - Current / recent
