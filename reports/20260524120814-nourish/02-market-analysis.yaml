    - Public-program demand can shrink or vary materially by state and budget cycle
  - - CPOM and fee-splitting scrutiny
    - Constraint
    - Current
    - Dickinson Wright legal analysis
    - National telehealth scaling requires governance and state-law discipline
  notes: Rows mix structural demand drivers with reimbursement, legal, and supply constraints because market adoption depends on all three. The Medicaid row intentionally preserves the current-vs-prior disclosure contradiction.
