  - id: TU005
    title: Expansion and concentration risk table
    columns:
      - Expansion driver
      - Concentration risk
      - Impact
      - Diligence path
    rows:
      - - Deeper health-plan partnerships and broader covered lives
        - Top-plan exposure is undisclosed
        - Stronger access could still hide reimbursement concentration
        - Request top-10 plan mix, reimbursement yield, and denial-rate by payer
      - - Employer channel build-out
        - Public employer roster is incomplete
        - Employer expansion may be real but cannot be sized from public logos
        - Request named employer accounts, launch dates, and active-member counts
      - - Health-system and provider referrals
        - Community is named, but broader health-system roster is mostly aggregate
        - Referral momentum may depend on a few systems or specialties
        - Request referral volume and visit conversion by top referring system
      - - GLP-1 / metabolic-clinic expansion
        - Coverage and economics depend on external policy and plan design
        - Reimbursement shifts could change customer acquisition and retention economics
        - Request payer coverage map and cohort outcomes for GLP-1 users by plan type
      - - Public-program reimbursement exposure
        - Medicaid acceptance is contradictory across public materials
        - Category-level policy tightening could shrink eligible demand or reimbursement quality
        - Request dated explanation of Medicaid scope, state coverage, and re-entry plans
    notes: >-
