figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: Patients move through an insurance-led intake flow, while providers, health systems, and sponsors shape acquisition and expansion.
    data:
      items:
        - label: Discover need
          stage: Discover need
          actor: Patient
          channel: Goals search, symptoms, or diagnosis trigger
          touchpoints:
            - Digital marketing
            - Social media
            - Word of mouth
            - Referring providers
          detail: Patients often enter after a diagnosis, abnormal labs, weight change, or a search for covered nutrition care.
        - label: Verify affordability
          stage: Verify affordability
          actor: Patient / insurer
          channel: Coverage check and insurance upload
          touchpoints:
            - Coverage calculator
            - In-network matching
            - Billing FAQ
          detail: Coverage clarity is a key conversion step because Nourish markets virtual care as usually $0 out of pocket.
        - label: Match and book
          stage: Match and book
          actor: Patient / Nourish operations
          channel: Specialist matching and telehealth scheduling
          touchpoints:
            - Condition-specific pages
            - Appointment booking
            - 24-hour referral scheduling promise
          detail: Referred patients are contacted within one business day and offered appointments within 24 hours.
        - label: Recurring care
          stage: Recurring care
          actor: Patient / RD / referring provider
          channel: Virtual visits and between-session support
          touchpoints:
            - Telehealth sessions
            - Post-session notes
            - Messages
            - Clinical-note sharing
          detail: Longitudinal care rather than a one-off visit is the core product experience.
        - label: Expand relationship
          stage: Expand relationship
          actor: Health plan / employer / health system / provider
          channel: Referrals, ROI proof, and metabolic-care adjacencies
          touchpoints:
            - Health-system integration
            - Employer and payer partnerships
            - GLP-1 support
            - AI app engagement
          detail: Expansion comes from more covered access, more referral partners, and deeper metabolic-care use cases.
    approximationNotes: This journey map summarizes the disclosed funnel mechanics from public pages and partner materials; it is not a private conversion analytics view.
    claimRefs:
      - CU001
      - CU002
      - CU005
      - CU006
      - CU007
      - CU008
      - CU026
      - CU048
  - id: FU002
    title: Adoption / deployment funnel
    type: flow
    layout: wide
    summary: Public evidence shows a large theoretical access pool narrowing into served patients, referred flows, and only a small named public partner roster.
    data:
      nodes:
        - label: Covered access pool
          segment: Health plans / employers / health systems
          detail: Series C materials say Nourish reaches more than 200 million covered lives.
        - label: Patients served
          segment: Broad patient base
          detail: The 2025 impact report says Nourish surpassed 500,000 patients served nationwide.
        - label: Longitudinal care delivery
          segment: RD network and recurring visits
          detail: Millions of appointments and a 10,000-dietitian network imply large-scale care delivery, not only top-of-funnel reach.
        - label: Referral integration
          segment: Providers / health systems
          detail: Tens of thousands of providers across 250+ health systems are said to refer patients into the model.
        - label: Named public proof
          segment: Publicly identifiable enterprise accounts
          detail: Community Health Network is the clearest named health-system proof in the local pack; broader logos remain sparse.
    claimRefs:
      - CU019
      - CU021
      - CU023
      - CU024
      - CU039
      - CU041
      - CU050
  - id: FU003
    title: Customer proof matrix
    type: matrix
    layout: wide
    summary: Public proof is strongest on patient outcomes and aggregate partner reach, weaker on enterprise-roster transparency and retention visibility.
    data:
      columns:
        - Evidence quality
        - Outcome specificity
        - Production maturity
        - Durability visibility
      rows:
        - label: Outcomes page aggregate proof
          values:
            - High
            - High
            - Live production care implied
            - Medium because retention metrics are incomplete
        - label: Success-story patient proof
          values:
            - Medium
            - High
            - Production patient relationship
            - Low because cases are anecdotal not cohort retention
        - label: Community Health partner proof
          values:
            - High
            - Medium
            - Production workflow integration described
            - Low because contract and renewal data are absent
        - label: Broader enterprise roster
          values:
            - Medium
            - Low
            - Clearly commercial, but not fully named
            - Low because concentration and renewal are undisclosed
    approximationNotes: Matrix scores are qualitative judgments about proof quality in the local pack, not private diligence findings.
    claimRefs:
      - CU025
      - CU027
      - CU031
      - CU033
      - CU039
      - CU040
  - id: FU004
    title: Retention / repeat cohort
    type: cohort
    layout: wide
    summary: Public durability disclosures are best read as milestone proxies rather than a true same-user retention cohort.
    data:
      columns:
        - Month 0-1
        - Month 3
        - Month 6
        - Month 12
      rows:
        - label: Public durability proxy
          values:
            - 81
            - 90
            - 67
            - 62
    approximationNotes: >-
      This is a proxy cohort built from the nearest public milestone percentages: appointment attendance, three-month goal progress,
      six-month digestive-health improvement, and twelve-month 5%+ weight-loss attainment. Nourish does not publicly disclose a true
      same-user retention or renewal cohort.
    claimRefs:
      - CU032
      - CU034
      - CU036
      - CU038
      - CU041
      - CU049
callouts:
  - calloutType: strength
    title: Multi-stakeholder customer acquisition appears real
    body: Nourish is not relying on one funnel alone. Public sources point to direct digital acquisition, insurance-aware member access, provider referrals, health-system relationships, and payer / employer expansion.
    claimRefs:
      - CU005
      - CU024
      - CU040
  - calloutType: risk
    title: Public demand proof is better than public durability proof
    body: Outcomes, satisfaction, and reach are well marketed, but public materials still do not disclose active-patient cohorts, churn, NRR, top-customer concentration, or a resolved Medicaid reimbursement story.
    claimRefs:
      - CU041
      - CU044
      - CU045
      - CU046
      - CU049
