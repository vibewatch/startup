schemaVersion: report-v2
artifact: customers
slug: nourish
runDate: '2026-05-24'
company:
  name: Nourish
chapter:
  number: 6
  title: Customers
  summary: >-
    Nourish’s customer base is broad at the patient layer and multi-stakeholder at the commercial layer: patients are the primary
    users, while health plans, employers, health systems, and referring providers shape reimbursement and acquisition. Public proof
    of adoption is strong on reach and outcomes — 500,000 patients served in 2025, 200 million covered lives, 10,000 dietitians,
    250+ health-system referral relationships, 94% recommendation, and 90% three-month goal progress — but weaker on classic
    SaaS-style durability and concentration metrics. The biggest customer-risk gap is not demand creation but disclosure depth:
    public logos remain sparse, retention and NRR are undisclosed, and Medicaid acceptance is contradictory across older fundraising
    materials versus the current FAQ.
sections:
  - id: customer-base
    title: Patients are the primary users, but payers and referral partners shape who can access care
    body: >-
      Nourish’s public materials consistently position the patient as the product’s primary user: the front door is goal-based,
      insurance-aware, and built around matching a person with a dietitian for recurring virtual care. The marketed use cases are
      also patient-level rather than employer-level wellness abstractions, spanning diabetes, gut health, eating disorders, heart
      health, and broader metabolic or GLP-1 support. At the same time, the commercial customer picture is clearly multi-sided.
      Health plans matter because reimbursement and in-network coverage determine whether care is effectively free to the member.
      Referring providers and health systems matter because they feed patients into the platform and receive notes back. Employers
      matter as another acquisition and reimbursement stakeholder even though Nourish does not publish a large named employer roster.
      The practical result is a customer model where the end user is the patient, the economic buyer is usually an insurer or
      sponsor, and referral stakeholders materially affect conversion and expansion.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU005
      - CU006
      - CU007
      - CU008
      - CU009
      - CU010
      - CU011
      - CU012
      - CU013
      - CU014
      - CU015
      - CU016
      - CU017
      - CU018
    tableRefs:
      - TU001
    figureRefs:
      - FU001
  - id: adoption-trajectory
    title: Adoption proof is strongest on served lives, provider-network scale, and referral breadth rather than active-account disclosure
    body: >-
      Nourish’s public adoption story is unusually strong for a private care platform, but the disclosed metrics are mostly reach
      and throughput metrics rather than clean active-customer cohorts. The company’s 2025 impact report said it surpassed 500,000
      patients served and expanded to a 6,000-plus dietitian network, while the 2026 Series C materials pushed that network figure
      to 10,000 dietitians, 200 million covered lives, millions of appointments, and referral relationships spanning more than 250
      health systems. Earlier 2025 fundraising coverage described hundreds of thousands of patients and a 3,000-plus W-2 dietitian
      base, which helps show genuine scaling rather than a one-time press jump. The main caveat is denominator quality. “Patients
      served” is not the same as active patients, and covered lives are not the same as engaged members. Nourish looks commercially
      real and increasingly national, but the public pack still stops short of utilization, activation, or segment-by-segment
      conversion disclosure.
    claimRefs:
      - CU019
      - CU020
      - CU021
      - CU022
      - CU023
      - CU024
      - CU050
      - CU051
    tableRefs:
      - TU002
    figureRefs:
      - FU002
  - id: named-proof
    title: Named customer proof is credible at the patient and health-system level, but public enterprise logos remain sparse
    body: >-
      The strongest named customer proof in the local pack comes from two different levels. First, Nourish publishes patient-level
      proof with concrete use cases and outcome details: Olivia’s GI case, Jason’s GLP-1 support journey, and Susan’s prediabetes
      and heart-health story all make the service look like an active care relationship rather than passive content consumption.
      Second, Community Health Network provides the clearest named enterprise proof, describing Nourish as embedded into multiple
      specialties inside an existing health-system workflow across Indiana. That matters because it shows the business is not only
      a direct-to-consumer funnel; it can also land inside provider organizations. What remains missing is a broader public roster.
      Outside Community, Nourish’s enterprise references are mostly aggregate statements about health plans, employers, health
      systems, and referring providers rather than a list of named customers or production deployments. Public proof therefore supports
      real adoption, but not yet a fully transparent roster of enterprise accounts.
    claimRefs:
      - CU025
      - CU026
      - CU027
      - CU028
      - CU029
      - CU030
      - CU039
      - CU040
    tableRefs:
      - TU003
    figureRefs:
      - FU003
  - id: durability-and-satisfaction
    title: Satisfaction and longitudinal-outcome signals are strong, but true retention and repeat economics remain undisclosed
    body: >-
      Nourish has unusually strong public customer-satisfaction and longitudinal-outcome messaging for a private health company.
      Across the home, outcomes, and impact-report surfaces, it claims 94% recommendation, 90% progress toward goals after three
      months, 81% appointment attendance, 4.9 Trustpilot, and measurable six- and twelve-month clinical outcomes across weight,
      A1C, LDL, blood pressure, eating disorders, digestive health, and GLP-1 support. That is enough to argue that customer value
      is not purely anecdotal. It is not enough to underwrite classic durability metrics. The public pack does not disclose churn,
      renewal, contract length, NRR, active-member retention, or cohort decay by payer or employer segment. Even the repeat-visit
      narrative is suggestive rather than fully measured in the extracted pages. The customer story therefore looks sticky in practice,
      but the financial durability layer still has to be diligenced privately.
    claimRefs:
      - CU031
      - CU032
      - CU033
      - CU034
      - CU035
      - CU036
      - CU037
      - CU038
      - CU048
      - CU049
    tableRefs:
      - TU004
    figureRefs:
      - FU004
  - id: expansion-and-risk
    title: Expansion pathways are visible, but customer concentration and reimbursement durability remain the largest public unknowns
    body: >-
      Nourish’s expansion logic is straightforward from the source pack: deepen payer relationships, add employers, embed into health
      systems, and keep pulling patients from referring providers while broadening the metabolic-care product. That pathway is credible
      because the company already markets multi-stakeholder acquisition, health-system referrals, and payer-partner ROI. The problem
      is visibility into concentration and policy exposure. Public customer logos are sparse, enterprise partner rosters remain incomplete,
      and no source in the pack discloses top-plan exposure, employer concentration, revenue share by channel, or land-and-expand
      conversion. Reimbursement fragility adds another risk layer. Current FAQs say Medicaid is not accepted, yet 2025 fundraising
      materials referenced Medicare and Medicaid plan relationships, and broader Medicaid or GLP-1 policy tightening could reduce
      reimbursable demand in parts of the market. This is not a demand-creation problem; it is a transparency and reimbursement-durability
      problem.
    claimRefs:
      - CU039
      - CU040
      - CU041
      - CU042
      - CU043
      - CU044
      - CU045
      - CU046
      - CU047
    tableRefs:
      - TU005
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Core use case
      - Public scale / proof
      - Strategic value
      - Main gap
    rows:
      - - Individual patients
        - User = patient; payer usually insurer
        - Virtual nutrition counseling and recurring RD support
        - 500,000 patients served in 2025; 94% recommend; 90% three-month goal progress
        - Core demand pool and outcomes engine
        - Active-patient count and segment mix are undisclosed
      - - Diabetes / cardiometabolic patients
        - User = patient; payer = insurer / sponsor
        - A1C, blood-sugar, weight, blood-pressure, and cholesterol improvement
        - Diabetes, heart, and metabolic pages plus A1C / LDL / BP outcomes
        - Largest medical-necessity and payer-ROI segment
        - No payer-specific utilization split by condition
      - - Gut-health and eating-disorder patients
        - User = patient; payer = insurer / sponsor
        - Symptom reduction, meal planning, and behavioral support
        - Named stories and condition pages across GI and eating disorders
        - Expands category beyond GLP-1 or obesity-only positioning
        - No disclosed revenue share by specialty
      - - GLP-1 / metabolic-support patients
        - User = patient; payer = insurer / sponsor
        - Side-effect management, adherence support, and off-ramp maintenance
        - Jason success story plus outcomes and Series C metabolic-clinic claims
        - Fast-growing wedge tied to payer and employer interest
        - Coverage durability depends on external reimbursement policy
      - - Health plans, employers, health systems, and referring providers
        - Buyer / channel / reimbursement stakeholder, not primary user
        - Member access, referrals, and partner ROI / care integration
        - 200M covered lives; 250+ health systems; Community Health named
        - Main expansion path beyond direct patient traffic
        - Public partner roster and concentration by stakeholder type are incomplete
    notes: >-
      Rows separate the end user from reimbursement and channel stakeholders. Public proof is strongest for patient use and aggregate
      reach, not for named enterprise-account breadth.
