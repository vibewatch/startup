  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: active-utilization
      missingEvidence: Active-patient count, monthly booked visits, repeat-visit rate, and utilization by payer or employer segment.
      whyItMatters: Patients served and covered lives demonstrate reach, but not how much of that reach converts into active recurring customer relationships.
      diligencePath: Request monthly active patients, visits per active patient, conversion from covered life to booked visit, and segment-level utilization cohorts.
      relatedQuestionRefs:
        - QU007
        - QU009
        - QU019
      relatedTableRefs:
        - TU002
        - TU004
    - type: private-evidence-only
      severity: material
      topic: retention-economics
      missingEvidence: Churn, renewal, contract length, NRR, GRR, and payer- or employer-level retention cohorts.
      whyItMatters: Public satisfaction and outcome metrics do not answer whether customer relationships persist economically over time.
      diligencePath: Request quarterly retention dashboards for members, payers, employers, and health-system channels plus definitions for renewal and expansion.
      relatedQuestionRefs:
        - QU017
        - QU019
        - QU025
      relatedTableRefs:
        - TU004
        - TU005
    - type: private-evidence-only
      severity: material
      topic: concentration
      missingEvidence: Top-plan, top-employer, top-health-system exposure and channel concentration by revenue or visits.
      whyItMatters: Aggregate covered lives and referral counts can mask dependence on a small number of payers or enterprise partners.
      diligencePath: Request top-10 concentration tables by payer, employer, health system, and referral source plus visit and revenue contribution.
      relatedQuestionRefs:
        - QU016
        - QU017
        - QU025
      relatedTableRefs:
        - TU003
        - TU005
    - type: conflicting-data
      severity: material
      topic: medicaid-scope
      missingEvidence: A dated explanation of how 2025 fundraising materials referenced Medicaid relationships while the current FAQ says Medicaid is not accepted.
      whyItMatters: The contradiction affects how durable Nourish’s public-program customer opportunity really is and whether some coverage paths were lost, narrowed, or reframed.
      diligencePath: Ask management for the timeline, affected plan types or states, current exclusions, and whether Medicaid re-entry is planned.
      relatedQuestionRefs:
        - QU020
        - QU021
        - QU024
      relatedTableRefs:
        - TU005
