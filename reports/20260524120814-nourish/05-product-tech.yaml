- id: metabolic-clinic-expansion
  title: Nourish is extending beyond RD visits into a broader metabolic-clinic and referral-integration layer
  body: 'The 2026 Series C announcement is the clearest evidence that Nourish’s product has moved beyond classic virtual nutrition
    counseling. It now describes a dietitian-led metabolic clinic in which every patient still works virtually with an RD,
    but lab testing, GLP-1 prescribing, medication management, and other virtual medical care can be layered in when clinically
    needed. The GLP-1 pages make that expansion concrete: Nourish markets dedicated Companion and Off-Ramp pathways that address
    side effects, muscle loss, nutrient sufficiency, appetite changes, and weight maintenance, and it now publishes persistence
    and outcomes data to support that workflow. On the provider side, FAQ and partner materials show referral integration
    rather than pure consumer acquisition alone. Nourish says it shares clinical notes with referring partners, reaches out
    to referred patients within one business day, offers appointments within 24 hours, and can be embedded into health-system
    workflows across multiple specialties. Community Health Network’s announcement is especially important because it frames
    the relationship as workflow integration into existing clinical operations, albeit without disclosing a deep technical
    EHR or API architecture. That makes the product look commercially mature at the workflow level even if the technical plumbing
    remains opaque.'
