- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control / quality signal
  - Status
  - Scope
  - Gap or concern
  rows:
  - - HIPAA notice and consent agreement
    - Publicly posted
    - Treatment, payment, disclosures, patient rights
    - Document is broad but not a substitute for current security architecture disclosure
  - - Telehealth consent + Zoom disclosure
    - Publicly posted
    - Explains convenience, interruption risk, unauthorized access risk, and Zoom usage
    - No public status page or business-continuity detail
  - - Session recording + AI-generated summary consent
    - Publicly posted
    - Allows recording/transcription with consent for clinical summary generation
    - No public vendor, retention duration, or quality-review standard
  - - In-platform messaging emergency boundary
    - Publicly posted
    - Messaging is not monitored in real time and is not for emergencies
    - No public escalation workflow or response-time target
  - - Health-data permission controls
    - Publicly posted
    - Apple Health and Google Health Connect permissions for weight, activity, sleep, heart rate, etc.
    - Privacy page is dated Jan 2022 despite newer connected-data features
  - - Clinical Quality Managers
    - Publicly marketed
    - 1:1 support and coaching for dietitians on complex cases
    - No public audit cadence or intervention thresholds
  - - Care-team coordination
    - Publicly posted
    - Clinical notes and treatment updates can be shared with referring providers and partners
    - No public interoperability standard or data-sharing map
  - - Responsible disclosure program
    - Publicly posted
    - Security inbox with five-business-day acknowledgment and ten-business-day critical target
    - No bug bounty, safe harbor detail, or certification surface
  - - MSO / professional corporation disclosure
    - Publicly posted
    - Separates clinical entities from non-clinical management support
    - Does not answer state-by-state implementation or liability design
  - - Public security / reliability transparency
    - Weakly disclosed
    - Only lightweight pages are public
    - No SOC 2, HITRUST, penetration-testing, or uptime artifacts in the fetched pack
  notes: The table distinguishes concrete controls from missing external validation. Positive controls exist, but the public
