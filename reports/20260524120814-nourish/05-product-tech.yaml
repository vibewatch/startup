- id: FE001
  title: Product architecture stack
  type: stack
  layout: wide
  summary: Four practical layers describe the disclosed Nourish product stack from patient experience up through medical and
    operating infrastructure.
  data:
    layers:
    - label: Patient engagement layer
      detail: Onboarding, insurance capture, telehealth booking, recurring messaging, meal logging, goals, recipes, and between-visit
        support in the patient app.
      items:
      - Goal capture + insurance upload
      - Telehealth booking
      - Messaging + post-session notes
      - Meal logging + macros + photo uploads
      - Recipes, meal ideas, and condition guides
    - label: Clinical care layer
      detail: Registered dietitian visits remain the core service, now expanded with GLP-1 pathways, labs, prescribing, medication
        management, and coordination with other providers when needed.
      items:
      - Initial assessment + recurring RD visits
      - GLP-1 Companion and Off-Ramp pathways
      - Lab facilitation / ordering
      - Medication management and prescribing
      - Clinical note sharing with external providers
    - label: AI and workflow intelligence layer
      detail: AI meal tracking, a patient-facing health agent, and provider-facing copilots help reinforce behavior change
        and reduce documentation burden.
      items:
      - AI meal tracking
      - Wearable + lab integrations
      - Patient AI health agent
      - AI charting and summaries
      - Clinical insight surfacing
    - label: Clinic operations layer
      detail: Non-clinical services and compliance functions centralize payer and provider operations so clinicians can stay
        inside a standardized workflow.
      items:
      - Billing + claims
      - Credentialing + insurance enrollment
      - Multi-state licensing support
      - Patient acquisition + referrals
      - Professional-corporation / MSO structure
  approximationNotes: Layer boundaries are functional rather than technical. The fetched pack supports the workflow modules
    listed here but does not disclose the specific cloud, data, or model vendors powering them.
