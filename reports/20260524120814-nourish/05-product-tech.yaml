- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Nourish solution
  - Measurable benefit
  - Current limitation
  rows:
  - - Start care with coverage clarity
    - Describe goals, upload insurance, estimate coverage, book first visit
    - Insurance-aware intake and in-network RD booking flow
    - 94% of in-network patients reportedly pay $0 out of pocket
    - Realized reimbursement and denial rates are not public
  - - Find the right dietitian quickly
    - Patient would otherwise search directories or wait for referral matching
    - Nourish matches to a specialist and handles scheduling
    - Lower search friction and faster time to first visit
    - Matching methodology is not disclosed
  - - Stay supported between appointments
    - Patients often lose momentum after the visit ends
    - Post-session notes, messaging, app reminders, goals, and meal logging
    - Creates accountability and longitudinal behavior change loops
    - No public retention cohort by feature
  - - Use GLP-1s with nutrition support
    - Medication-only programs often struggle with side effects and persistence
    - Companion and Off-Ramp pathways plus RD coaching
    - 33% more weight loss and 68% six-month persistence are company-claimed signals
    - No independent controlled study in the fetched pack
  - - Order tests or coordinate broader care
    - Fragmented nutrition care can miss labs or physician coordination
    - Dietitians can facilitate tests directly or with other providers and share clinical notes
    - Supports integrated metabolic care instead of isolated counseling
    - Scope-of-practice implementation details are not disclosed by state
  - - Refer from a health system or physician office
    - Manual referrals often stall or lack follow-up visibility
    - Nourish reaches out within one business day and offers appointments within 24 hours
    - Faster handoff and easier outpatient nutrition access
    - No disclosed API, EHR interface, or closed-loop referral reporting schema
  - - Run a dietitian practice without admin drag
    - Independent RDs would otherwise manage billing, credentialing, and licensing alone
    - Centralized operations plus one end-to-end platform
    - Higher clinical focus and standardized workflows
    - Economic efficiency and tooling uptime are not public
  notes: This table maps disclosed user jobs to operating workflows. Benefits are sourced from public claims; limitations
    identify where operational or technical specificity is still missing.
