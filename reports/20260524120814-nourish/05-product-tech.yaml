- id: care-delivery-stack
  title: The disclosed stack combines patient engagement, provider tooling, and centralized clinic operations
  body: 'The product architecture visible in the source pack has three practical layers. First is the patient experience:
    scheduling, telehealth sessions, messaging, meal logging, recipes, and integrations that pull in wearables or lab context.
    Second is the clinician workflow: Nourish’s provider page describes one platform for scheduling, virtual sessions, patient
    EHR, meal logging, and AI-powered charting or assistance, while the 2025 and 2026 financing materials add AI meal tracking,
    clinical-insight surfacing, note automation, and provider copilots. Third is the operating backbone that dietitians do
    not need to run themselves. Nourish says it centralizes billing, claims, credentialing, insurance enrollment, multi-state
    licensing, and patient acquisition, which is a meaningful operational distinction from a marketplace that simply routes
    leads to contractors. This centralized-services layer likely helps explain why the company uses W-2 clinicians and frames
    itself as a clinic. It also creates dependency on internal tooling quality and payer operations, because clinician productivity
    and patient experience both rely on the same shared platform. The source pack shows a cohesive operating model, but not
    the specific cloud, data, or model infrastructure under it.'
