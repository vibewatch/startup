company:
  name: Nourish
chapter:
  number: 5
  title: Product & Technology
  summary: 'Nourish’s product has evolved from an insurance-covered tele-nutrition workflow into a broader AI-assisted metabolic-care
    operating system. The strongest evidence covers patient onboarding, recurring RD visits, patient-app engagement, provider
    workflow tooling, health-system referrals, and the newer metabolic-clinic layer of labs, GLP-1 prescribing, and medication
    management. The main product-tech risk is not feature absence but disclosure depth: the fetched pack supports medium-to-high
    confidence on workflow maturity, but only medium confidence on the underlying technical stack because cloud, model, reliability,
    and security-architecture details remain largely undisclosed.'
sections:
- id: patient-workflow
  title: Patient workflow is clear from intake through recurring RD care, with the app carrying support between visits
  body: 'Nourish’s customer-facing product is best understood as a guided care workflow rather than a single app feature.
    The homepage and GLP-1 condition surface show the same basic path: patients state their goals and symptoms, upload insurance
    information, get matched to a dietitian, and book a telehealth visit. Once care begins, the model is intentionally recurring.
    Nourish describes regular virtual appointments, post-session notes, and messaging between sessions rather than one-off
    consultations. The patient app then carries the between-visit loop through goal tracking, meal logging, macro or photo
    uploads, recipe recommendations, condition guides, and ongoing reminders. This matters strategically because it makes
    Nourish look more like a behavior-change service with longitudinal touchpoints than a static provider directory. The same
    patient materials also make clear that care is personalized: dietitians review medical history, eating habits, lifestyle,
    and medication use, then work with existing providers when needed. The strongest caveat is matching. Public sources clearly
    say Nourish matches patients to expert dietitians, but they do not explain whether the matching layer itself is AI-driven
    or simply rules-based and operationally assisted.'
