- id: trust-quality-and-risks
  title: Trust signals are real but uneven, and public technical disclosure lags product ambition
  body: 'Nourish’s trust and quality posture is not empty; it is just uneven. The consent agreement is relatively detailed:
    it covers HIPAA rights, treatment and payment use cases, telehealth risks, Zoom usage, AI-generated summaries, limited
    recording retention, and the fact that in-platform messaging is not for emergencies or real-time monitoring. The provider
    page adds clinical quality managers and coaching, while the about and outcomes pages reinforce that the company measures
    care quality and uses research and feedback to improve practice. The issue is the outer perimeter of public disclosure.
    The privacy page is visibly last updated in January 2022 even though it now references Apple Health and Google Health
    Connect data, and the responsible-disclosure page is lightweight relative to the company’s current AI-native metabolic
    clinic positioning: it provides an email channel, a five-business-day acknowledgment target, and a ten-business-day goal
    for critical issues, but no public bug bounty, security architecture, certification list, status page, or penetration-testing
    summary. As a result, product maturity appears strong in care workflow terms, while technical-confidence should remain
    medium until reliability, vendor, and security details are disclosed more concretely.'
