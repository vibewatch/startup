  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: matching-engine
    missingEvidence: A product brief or technical document that explains how patient-to-dietitian matching works, including
      whether AI is used and what signals it ranks.
    whyItMatters: Matching is central to product quality and utilization, but the public pack only confirms the existence
      of matching, not the actual decision logic.
    diligencePath: Request an internal product spec or live product demo covering matching inputs, ranking logic, and override
      workflows.
    relatedQuestionRefs:
    - QE003
    relatedTableRefs:
    - TE001
    - TE003
  - type: private-evidence-only
    severity: material
    topic: ai-health-agent-governance
    missingEvidence: Metrics and operating policies for the patient AI health agent and provider copilots, including escalation
      rules, audit workflows, and quality thresholds.
    whyItMatters: The company markets AI heavily, but without governance detail it is hard to judge safety, reliability, and
      defensibility.
    diligencePath: Request internal AI governance documentation, feature-level usage metrics, and clinician review controls.
    relatedQuestionRefs:
    - QE012
    - QE020
    - QE024
    relatedTableRefs:
    - TE003
    - TE004
  - type: private-evidence-only
    severity: material
    topic: technical-architecture
    missingEvidence: A current architecture diagram naming cloud, data, model, EHR, and messaging vendors plus reliability
      and observability practices.
    whyItMatters: The chapter can describe the operating model, but not the true software stack or resilience profile, which
      limits technical confidence.
    diligencePath: Request a CTO or product-engineering review with vendor map, uptime targets, incident process, and integration
      architecture.
    relatedQuestionRefs:
    - QE020
    - QE024
    relatedTableRefs:
    - TE003
  - type: stale
    severity: material
    topic: privacy-disclosure
    missingEvidence: A current privacy and AI-governance disclosure that matches the present connected-health and AI-native
      product footprint.
    whyItMatters: The privacy page is visibly old relative to current product claims, which weakens external confidence in
      governance maturity.
    diligencePath: Request the latest privacy notice, AI governance summary, and data-retention schedule for connected-health
      and transcription data.
    relatedQuestionRefs:
    - QE021
    - QE025
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: material
    topic: security-assurance
    missingEvidence: Public or private evidence of certifications, penetration tests, bug-bounty scope, status monitoring,
      or broader security program controls.
    whyItMatters: The responsible-disclosure page is better than nothing but too lightweight to underwrite trust on its own
      for an AI-heavy clinical platform.
    diligencePath: Request recent security assessments, certification reports, incident history, and security-program owner
      interviews.
    relatedQuestionRefs:
