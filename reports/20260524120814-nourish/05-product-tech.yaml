- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / process / component
  - Role in delivery
  - Critical dependency
  - Key risk
  rows:
  - - Patient intake + insurance capture
    - Collects goals, symptoms, and coverage information before care begins
    - Web or app onboarding plus payer operations
    - Intake quality and insurance estimation errors can distort experience
  - - Matching + scheduling layer
    - Routes patients to a dietitian and gets the first visit booked
    - Provider availability, specialty metadata, operations rules
    - Matching transparency and scheduling logic are not public
  - - Virtual visit + patient EHR layer
    - Hosts synchronous care and stores clinical documentation
    - Telehealth tooling, EHR workflow, clinician documentation discipline
    - Vendor architecture, uptime, and redundancy are undisclosed
  - - Between-visit patient app layer
    - Supports messaging, meal logging, goals, recipes, and reminders
    - Mobile engagement, notification delivery, content relevance
    - Public engagement metrics exist only at a high level
  - - Wearable + lab context layer
    - Enriches care with Apple Health, Google Health Connect, and lab inputs
    - User consent, device APIs, data normalization, lab workflows
    - Data-governance complexity rises faster than public documentation depth
  - - AI meal-tracking and patient agent layer
    - Adds structured nutrition logging and proactive behavior-change support
    - Model quality, escalation rules, usage telemetry
    - No public model-governance or safety-evaluation detail
  - - Provider copilot + AI charting layer
    - Automates notes and surfaces clinical insights for clinicians
    - Transcription quality, prompt design, chart-review workflow
    - No public error-rate, override, or audit process
  - - Claims / credentialing / licensing layer
    - Centralizes the non-clinical work that enables insurer-paid care
    - Payer enrollment, licensure maintenance, claims operations
    - Operational bottlenecks can affect both access and economics
  - - Referral + partner workflow layer
    - Brings in providers, health systems, plans, and employers
    - Partner process design and care-team coordination
    - API or EHR depth is not publicly specified
  - - Medical-care extension layer
    - Enables labs, prescribing, and medication management beyond RD visits
    - Professional corporations, medical staffing, compliance controls
    - State-by-state scope and staffing details are not public
  notes: Architecture is an operating-model reconstruction from disclosed workflows rather than a vendor-level system diagram.
    Risks emphasize where delivery depends on opaque infrastructure or shared operations.
