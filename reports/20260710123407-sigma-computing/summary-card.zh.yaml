  topStrengths:
    - 产品定位清晰，围绕 warehouse-native 展开，并已可信地扩到嵌入式应用和 agentic analytics
    - 公开增长信号很强，包括到 2026 年 $200M ARR、100%+ 增长和 2,000+ 客户
    - 客户与伙伴证明质量高，覆盖大型企业和现代数据平台生态
    - 未再融一轮巨额融资，估值仍能从 2024 年 $1.5B 抬到 2026 年 $3B
    - 对 Snowflake、Databricks 及其他云数据栈参与者具备战略相关性
  topRisks:
    - 毛利率、烧钱速度、留存、集中度和股权条款仍未披露
    - 私有市场溢价估值取决于持续增长和收入质量，但公开来源还无法验证
    - Sigma 最适配受支持的仓库中心化环境，并不覆盖所有分析部署模式
    - 随着 Sigma 扩到嵌入式工作流、数据应用和 AI agent 表面，执行复杂度会上升
    - 既有厂商和相邻 AI-native analytics 挑战者不断拥挤，可能压缩叙事优势
  unresolvedGaps:
    - 按 cohort 拆分的 NRR、GRR、logo 流失和扩张行为
    - 毛利率、烧钱、runway、回本周期和现金效率指标
