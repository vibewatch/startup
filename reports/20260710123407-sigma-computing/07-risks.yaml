chapter:
  number: 7
  title: Risks
  summary: Sigma’s public risk profile is meaningful but not thesis-breaking. The clearest visible risks are operational-security surface area, platform and partner dependency, technical-fit narrowing in some environments, and rising execution pressure as the company scales its AI/workflow platform ambitions under a $3 billion valuation. Public adverse evidence does not reveal one fatal flaw; instead it shows a company with the normal but important risks of a fast-growing enterprise-data platform. The biggest unanswered questions are around partner concentration, regulated-workload exposure, customer deployment complexity, and the economics of newer surfaces like embedded analytics and AI agents.
sections:
- id: security-privacy-and-governance-surface
  title: Security, privacy, and governance surface area
  body: Sigma’s public trust posture is mixed in the way many serious enterprise software vendors are mixed. On the positive side, the company publishes a trust center, privacy policy, DPA, DPA change log, subprocessors list, and terms, which gives customers a meaningful starting point for diligence. On the cautionary side, the trust center also documents a go-to-market-stack incident involving Salesloft Drift and Salesforce CRM contact data. The disclosure explicitly said Sigma platform and warehouse data were unaffected, which narrows the severity. Still, the existence of the incident confirms that Sigma’s risk surface extends beyond core product code into its operational tooling. UpGuard adds an external vendor-risk lens, while HIPAA and broader privacy expectations remind investors that enterprise buyers may hold Sigma to high compliance standards even when it is not the system of record. The right conclusion is not panic, but neither is it complacency, because compliance obligations
    and contractual change management also accumulate over time.
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  - CR005
  - CR006
  - CR023
  - CR024
  - CR038
  tableRefs:
  - TR001
  figureRefs:
  - FR001
- id: platform-product-and-adoption-risk
  title: Platform dependence, product-fit narrowing, and adoption friction
  body: 'Sigma’s strongest product strength—warehouse-native analytics on top of modern data platforms—is also a source of risk. The architecture depends on supported ecosystems, customer permissions, and reasonably mature data-platform environments. Snowflake, Databricks, and BigQuery alignment are strategically helpful, but they also mean Sigma depends on platforms it does not control. Public review evidence shows the same pattern at the product level: Sigma looks strongest in warehouse-centric deployments and weaker where buyers need deeper polyglot data access, heavier custom embedding, or very low-change operational rollouts. The platform and embedded pages further indicate that Sigma wants to expand into broader workflow and distributed analytics scenarios, which raises implementation complexity and support expectations. Review sites also suggest onboarding and governance effort remain real. So the key product risk is not that Sigma lacks demand, but that deployment complexity and
    fit boundaries may constrain how fast demand converts into durable usage, especially as broader user populations are invited into governed workflows.'
  claimRefs:
