chapter:
  number: 8
  title: Valuation
  summary: 'Sigma’s clearest public valuation anchor is the May 2026 Series E at a $3 billion valuation, coming one month after the company disclosed $200 million ARR. That implies an approximate 15x ARR multiple and a 2.0x step-up from the $1.5 billion Series D in 2024. On public evidence alone, that price looks defensible but not obviously cheap: it sits within a plausible high-growth private-software range if growth, retention, and margin quality hold, but the missing data on NRR, margins, cash efficiency, and cap-table terms prevent a stronger conviction. The right public stance is therefore constructive but conditional—Neutral-to-Positive rather than deeply bullish or clearly negative.'
sections:
- id: observable-price-and-anchor-facts
  title: Observable price and the highest-confidence anchor facts
  body: The valuation chapter starts from an unusually solid public anchor for a private company. Sigma disclosed $200 million ARR in April 2026, then announced an $80 million Series E in May 2026 at a $3 billion valuation. That sequencing matters because it gives investors both a revenue denominator and a recent market-clearing price. The company’s 2024 Series D at a $1.5 billion valuation provides a second anchor, making the step-up visible rather than inferred. On this public record, the headline implied ARR multiple is about 15x, and the valuation doubled in roughly two years. Those are meaningful facts, not speculative proxies. They do not prove intrinsic value by themselves, but they sharply constrain what a reasonable public valuation debate can look like. Any serious external view should begin with the priced round and test it for reasonableness, not ignore it in favor of generic software screens or stale heuristics.
  claimRefs:
