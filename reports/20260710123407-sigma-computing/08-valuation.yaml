- id: range-framework-and-why-the-price-can-be-defensible
  title: A practical range framework and why the price can be defensible
  body: A simple public range framework is enough to see why Sigma’s latest price is not obviously outlandish. If one brackets the company at roughly 12x to 18x ARR on the disclosed $200 million revenue base, the range lands around $2.4 billion to $3.6 billion, with the actual $3 billion mark near the middle. That does not mean the round is automatically cheap. It means the price can be defended for a private software company claiming $200 million ARR and 100%+ growth, particularly when the narrative includes AI-native analytics, data applications, and workflow expansion. The core caveat is that public evidence supports growth better than it supports margin quality or durability. In other words, the multiple is being supported by topline momentum and strategic relevance, not by a complete quality-of-revenue proof. That distinction is precisely why the valuation can look fair rather than obviously attractive.
