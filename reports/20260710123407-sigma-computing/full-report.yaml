      - number: '2.4'
        title: Growth drivers, frictions, and the investable interpretation
        blocks:
          - type: paragraph
            body: >-
              The market tailwinds are real. Cloud warehouses are increasingly treated as the system of record for
              analytics; BigQuery, Databricks, and Sigma all describe a world where business logic, permissions, and AI
              workflows live closer to the data. NIST’s AI risk-management framing further strengthens the case for
              governed analytics because enterprises now care not only about getting an answer, but about whether the
              answer is permissioned, explainable, and grounded in approved metrics. At the same time, the market is not
              frictionless. Knowi’s adverse review captures several structural constraints that matter in diligence:
              Sigma requires a supported cloud SQL warehouse, depends on upstream semantic discipline for the strongest
              governance outcomes, and is weaker where customers need deep SDK-driven embedded analytics or direct
              NoSQL/API querying. Incumbents also constrain expansion. Power BI benefits from Microsoft bundling, Looker
              from semantic-governance credibility, ThoughtSpot from AI-first search positioning, and Tableau from
              installed dashboard estates. The investable conclusion is therefore nuanced: Sigma has a large and timely
              market, but its real opportunity is a governed warehouse-workflow layer, not the entire BI universe.
