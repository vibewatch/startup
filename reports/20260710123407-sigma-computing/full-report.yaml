    sections:
      - number: '7.1'
        title: Security, privacy, and governance surface area
        blocks:
          - type: paragraph
            body: >-
              Sigma’s public trust posture is mixed in the way many serious enterprise software vendors are mixed. On
              the positive side, the company publishes a trust center, privacy policy, DPA, DPA change log,
              subprocessors list, and terms, which gives customers a meaningful starting point for diligence. On the
              cautionary side, the trust center also documents a go-to-market-stack incident involving Salesloft Drift
              and Salesforce CRM contact data. The disclosure explicitly said Sigma platform and warehouse data were
              unaffected, which narrows the severity. Still, the existence of the incident confirms that Sigma’s risk
              surface extends beyond core product code into its operational tooling. UpGuard adds an external
              vendor-risk lens, while HIPAA and broader privacy expectations remind investors that enterprise buyers may
              hold Sigma to high compliance standards even when it is not the system of record. The right conclusion is
              not panic, but neither is it complacency, because compliance obligations and contractual change management
              also accumulate over time.
