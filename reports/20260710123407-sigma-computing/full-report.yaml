  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Observable price and the highest-confidence anchor facts
        blocks:
          - type: paragraph
            body: >-
              The valuation chapter starts from an unusually solid public anchor for a private company. Sigma disclosed
              $200 million ARR in April 2026, then announced an $80 million Series E in May 2026 at a $3 billion
              valuation. That sequencing matters because it gives investors both a revenue denominator and a recent
              market-clearing price. The company’s 2024 Series D at a $1.5 billion valuation provides a second anchor,
              making the step-up visible rather than inferred. On this public record, the headline implied ARR multiple
              is about 15x, and the valuation doubled in roughly two years. Those are meaningful facts, not speculative
              proxies. They do not prove intrinsic value by themselves, but they sharply constrain what a reasonable
              public valuation debate can look like. Any serious external view should begin with the priced round and
              test it for reasonableness, not ignore it in favor of generic software screens or stale heuristics.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV025
              - CV029
              - CV039
