          - type: paragraph
            body: >-
              The most important public risk gaps are structural, not sensational. Investors still do not know board
              control terms, round protections, partner-linked revenue concentration, exposure to regulated workloads,
              or how much revenue depends on embedded analytics and AI-agent adoption. Legal pages, vendor-risk
              summaries, and review sites are useful because they point to the diligence agenda, but they cannot close
              it. The public evidence is enough to reject any simplistic “low risk” thesis, yet it is also enough to
              reject any simplistic “broken company” thesis. The risk pattern looks more like concentration, dependency,
              execution complexity, and governance burden scaling with ambition. That means the best diligence plan is
              to test customer and partner concentration, security controls, regulated-workload exposure, onboarding
              effort, and attach rates for newer surfaces. If those areas check out, the visible public risks look
              serious but manageable rather than fatal for disciplined investors.
            claimRefs:
              - CR021
              - CR022
              - CR029
              - CR031
              - CR032
              - CR033
              - CR034
              - CR035
          - type: table
            tableRef: TR005
            claimRefs:
