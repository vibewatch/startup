        title: Incumbent-specific threats by segment
        blocks:
          - type: paragraph
            body: >-
              Each major rival pressures Sigma differently. Power BI is the most dangerous in Microsoft-heavy accounts
              because price, procurement convenience, and adjacent platform commitments can outweigh interface benefits.
              Tableau remains especially hard to dislodge in visualization-centric enterprises with large dashboard
              estates, existing enablement, and Salesforce ties. Looker is a more direct threat in governed semantic
              analytics because its core pitch overlaps with modern-data-stack buyers who care deeply about trusted
              definitions and embedded distribution. ThoughtSpot is the clearest collision on AI-first and search-led
              analytics, and the messaging overlap is greater in 2026 than in earlier years as both vendors lean into
              agentic positioning. This means investors should not ask “Who is Sigma’s competitor?” in the singular. The
              better question is which competitor dominates each buying context and whether Sigma’s usability wedge is
              strong enough to break that context.
