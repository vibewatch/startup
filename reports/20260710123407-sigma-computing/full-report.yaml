  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, included spend, and substitutes
        blocks:
          - type: paragraph
            body: >-
              The cleanest way to define Sigma’s market is not “all analytics software,” but the subset of analytics and
              application-layer spend that sits directly on governed cloud data warehouses and turns exploration into
              action. Sigma’s architecture page and product pages repeatedly center live, zero-copy querying, governed
              semantic context, spreadsheet-native interaction, AI apps, and workflow automation. That means the
              relevant market includes self-service BI, embedded analytics, semantic modeling, writeback-driven
              operational workflows, and agentic analytics running on warehouse data. It excludes the warehouse itself,
              general-purpose LLM tools with no governed data layer, and many stand-alone planning or operational
              systems that do not use analytics as their control plane. The strongest substitutes are therefore legacy
              BI tools, spreadsheets plus custom SQL, and adjacent analytics platforms such as Tableau, Power BI,
              Looker, and ThoughtSpot. Each can address part of the need, but they vary in live-query behavior, semantic
              governance, embedded control, and action-taking depth. For investors, that boundary logic matters more
              than quoting a giant generic TAM because Sigma’s value rests on replacing passive dashboards with governed
              data workflows.
            claimRefs:
