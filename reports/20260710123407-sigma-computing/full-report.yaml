      - number: '4.2'
        title: Funding history, valuation step-up, and capital-structure interpretation
        blocks:
          - type: paragraph
            body: >-
              Sigma’s public round history is unusually well documented for a private company. The 2021 Series C
              announcement said the company raised $300 million in that round and $381.3 million to date. In May 2024,
              Sigma announced a $200 million Series D at a $1.5 billion valuation. In May 2026, it announced an $80
              million Series E at a $3 billion valuation. Using only those disclosed facts, Sigma has publicly raised at
              least about $661 million across the rounds cited here. The smaller 2026 round size relative to the prior
              Series D is notable: management and investors were evidently able to justify a much higher valuation
              without repeating a giant capital raise. That can be read as a sign of optionality and confidence, though
              the public record does not reveal whether the company simply did not need more cash, preferred less
              dilution, or was optimizing for a strategic syndicate. Either way, the capital structure story is
              directionally positive.
