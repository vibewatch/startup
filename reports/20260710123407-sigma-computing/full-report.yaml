    title: Financials
    sections:
      - number: '4.1'
        title: Reported ARR scale and growth signals
        blocks:
          - type: paragraph
            body: >-
              The highest-confidence public financial fact in the file is Sigma’s disclosed $200 million ARR in April
              2026, corroborated by both the company announcement and FinancialContent / Business Wire republication.
              That alone moves Sigma firmly into scale-stage software territory. The other notable growth signals come
              from the Series E materials one month later, where the company said it had grown more than 100% and added
              more than 1.1 million new active users. Together, those disclosures indicate very rapid topline momentum
              and unusually strong product adoption for a private analytics company in a crowded market. They also
              explain why investor appetite remained high despite a difficult broader software environment. What these
              disclosures do not do is explain the composition of ARR, the durability of expansion, or the cost to
              achieve that growth. Investors can therefore trust the scale direction, while still treating
              quality-of-revenue questions as open until private diligence fills them in.
