      - number: '2.3'
        title: Buyers, users, payers, and how adoption tends to unfold
        blocks:
          - type: paragraph
            body: >-
              Sigma’s public materials imply a cross-functional buyer map rather than a single-department purchase. Data
              and analytics leaders remain the natural technical gatekeepers because a supported warehouse connection,
              permissions, and data models have to exist before end users can self-serve safely. But the company’s
              messaging and customer examples clearly reach beyond BI teams to finance, operations, analytics engineers,
              and business operators who already think in spreadsheet terms. That suggests a mixed buyer-user-payer
              structure: IT, data platform, finance, or revenue-operations budgets pay for the stack, while business
              analysts and operators become the daily users. The adoption path is also more staged than the AI buzz
              suggests. Public docs show the motion beginning with live warehouse access, then self-service workbooks,
              then governed models and metrics, then writeback, actions, and embedded apps, and only after that broader
              agentic workflows. This sequence matters because it means Sigma wins by making existing warehouse data
              more usable first and only later turns that footprint into workflow automation. That staged motion can
              widen the customer base, but it also slows fully monetized AI narratives compared with a pure copilot
              pitch.
