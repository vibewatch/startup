      - number: '3.4'
        title: Durability of the wedge and what public data still cannot prove
        blocks:
          - type: paragraph
            body: >-
              The best public case for Sigma is that it changes day-to-day behavior, not just dashboard styling. If
              users can explore live warehouse data in a spreadsheet-native interface and then push that work into data
              apps and actions, the product can become more deeply embedded in operations than legacy BI surfaces. The
              problem is that public evidence does not show how consistently Sigma wins that argument by segment, by
              competitor, or by contract size. Review sites and third-party commentary support the idea that Sigma
              resonates with data-mature customers, but they also repeatedly surface onboarding, governance, and
              embedded-fit constraints. Meanwhile, AI feature velocity is rising everywhere, making it harder to rely on
              feature checklists as a durable moat. The investable thesis therefore depends on whether Sigma can
              translate its usability wedge into an application platform before incumbents narrow the experience gap or
              bundle away the budget, especially in large enterprises where distribution and procurement gravity can
              overwhelm product-level enthusiasm.
