      - number: '8.4'
        title: Stance and what private diligence still has to close
        blocks:
          - type: paragraph
            body: >-
              The best public stance is neither a triumphalist bull case nor a reflexive skepticism. Sigma’s recent
              priced round is more informative than a synthetic model built on incomplete public data, so the job is to
              decide whether the observable price is reasonable and what hidden evidence must support it. On that test,
              the answer is constructive but conditional. A Neutral-to-Positive stance fits the public record: the
              company looks fairly valued to modestly rich rather than clearly cheap, and the principal open questions
              sit underneath the price rather than outside it. Public sources do not reveal cap-table protections,
              effective preferred economics, margin structure, revenue concentration, or the degree to which future
              upside depends on embedded analytics, data apps, and AI agents. Private diligence must therefore bridge
              from a credible observed price to the unseen evidence on cohort quality and margin quality. If that bridge
              holds, the valuation is supportable; if not, the round will look full for investors over time externally.
            claimRefs:
              - CV026
