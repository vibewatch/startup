              company with a $3 billion valuation and a public $200 million ARR disclosure, which raises the performance
              bar. Competitive risk comes from multiple directions at once: entrenched incumbents, AI-heavy messaging
              from peers, and new or scaled challengers such as Omni attracting capital in adjacent analytics
              categories. Sigma’s own competitor-comparison materials implicitly acknowledge this crowding, while
              ThoughtSpot and other agentic-analytics narratives show how quickly the category can become
              messaging-saturated. None of that means Sigma is losing. It does mean that slower growth, weaker
              execution, or feature gaps would matter more now than they did when the company was smaller. Expectation
              risk is therefore real: higher valuation and broader ambition increase the cost of mis-execution, and
              public ARR disclosure further tightens that narrative leash for management teams internally.
