  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Direct peer set and how Sigma is positioning itself
        blocks:
          - type: paragraph
            body: >-
              Sigma’s public positioning leaves little ambiguity about the peer set. The company explicitly compares
              itself with Tableau, Power BI, Looker, and ThoughtSpot, while also framing spreadsheets and custom SQL as
              the persistent status quo it wants to replace. That is strategically important because it places Sigma in
              a mature, high-intensity market rather than in an unoccupied niche. The differentiation claim is also
              consistent across its architecture, spreadsheet, embedded, and agent product pages: Sigma argues that
              users should be able to work directly on live warehouse data in a familiar interface, then extend that
              into apps and automation. InterWorks’ independent comparison supports part of that story by describing
              Sigma as a shift from dashboards to data apps, especially versus Tableau and Power BI. Still, the
              competitive perimeter is tightening because incumbents also market AI-assisted analytics, embedded
              workflows, and governed answers. The result is a market where Sigma has a real positioning wedge, but not
              a monopoly on the narrative, and one where distribution still matters nearly as much as product design and
              procurement today.
