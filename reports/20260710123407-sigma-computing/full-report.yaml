      - number: '2.2'
        title: Sizing lenses and why the published numbers diverge
        blocks:
          - type: paragraph
            body: >-
              Public market-sizing sources support a large market, but they do not offer a precise Sigma-only
              denominator. Emergen Research puts the global BI and analytics market at $31.86 billion in 2025 with 13.7%
              CAGR, while Business Research Insights estimates the business intelligence and analytics software market
              at $29.21 billion in 2026 and $50.44 billion by 2035. Those two figures are directionally consistent—they
              both describe a large and still-growing software category—but they should not be treated as
              interchangeable because one is framed around BI and analytics broadly while the other is narrower software
              spend with a different time anchor. More importantly, neither source breaks out the warehouse-native
              AI-analytics slice that Sigma specifically targets. There is no public Sigma-specific SAM or SOM in the
              fetched record. The right reading is therefore to use multiple bounded lenses: one for broad category
              size, another for Sigma’s own architecture-driven niche, and an explicit evidence gap for the serviceable
              market. That preserves analytical honesty and prevents later valuation work from leaning on a denominator
              that the public record does not actually support.
