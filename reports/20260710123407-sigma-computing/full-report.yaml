chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, footprint, and operating model
        blocks:
          - type: paragraph
            body: >-
              Sigma is no longer positioning itself as a classic dashboard vendor. Across its homepage, architecture
              materials, documentation, and company page, it frames itself as the AI apps and agentic analytics platform
              built on the cloud data warehouse. That language matters because the company is explicitly tying business
              intelligence to action-taking workflows, governed semantic context, and warehouse-resident AI rather than
              to standalone reporting. The product surface is broad even in public materials: Sigma says teams can work
              in a single governed workspace using spreadsheet formulas, SQL, Python, and native AI while keeping data
              in the warehouse. The contact page anchors the operating footprint in San Francisco and also lists offices
              in New York and London, which supports a meaningful go-to-market and customer-support footprint beyond a
              single Bay Area office. The company page further shows that Sigma is trying to define itself as an
              execution layer on top of enterprise data, not only an analysis layer, and claims 1,900+ organizations and
              6,000+ AI apps built by customers. That combination of warehouse-native architecture, spreadsheet
              familiarity, and AI positioning is the base identity later chapters should treat as canonical.
