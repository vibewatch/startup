              - CV007
              - CV010
              - CV011
      - number: '8.3'
        title: Comparables, premium-support factors, and downside risks
        blocks:
          - type: paragraph
            body: >-
              Public comparables help mainly as context. Omni’s 2026 $1.5 billion Series C shows that adjacent
              AI-analytics challengers can still command meaningful private valuations, although Sigma’s disclosed
              revenue anchor makes its own mark more robust. ThoughtSpot and other private-analytics profiles show the
              category remains competitively funded, while old public transactions such as Tableau’s sale to Salesforce
              confirm that large strategic outcomes can exist in analytics—but they are too dated to serve as current
              pricing anchors. The strongest support for Sigma’s premium comes from the combination of customer proof,
              partner support, and an expansion narrative that reaches beyond classic BI into AI-native workflows and
              applications. The main downside, however, is that this premium still leans on beliefs about retention,
              margin durability, and multi-surface expansion that the public file does not fully prove. That is why the
              price is defendable but still conditional, and why downside cases deserve explicit weighting.
            claimRefs:
              - CV013
