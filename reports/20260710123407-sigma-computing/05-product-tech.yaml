chapter:
  number: 5
  title: Product & Technology
  summary: 'Sigma’s product thesis is technically coherent: keep analytics live on the warehouse, layer governed models and permissions on top, and expose that through spreadsheet-like UX, embedded apps, AI assistants, and agents. The architecture aligns with modern Snowflake, BigQuery, and Databricks estates and benefits from partner validation. The main tradeoff is that the same warehouse-native purity can narrow fit in polyglot data environments, deep custom-embedding scenarios, or cost-sensitive deployments where warehouse economics become a debate. Public evidence supports rapid product expansion, but it does not yet prove performance benchmarks or broad adoption of Sigma’s newest AI surfaces.'
sections:
- id: architecture-and-control-plane
  title: Warehouse-native architecture and the control-plane thesis
  body: Sigma’s technical identity starts with a zero-copy, warehouse-native architecture. The product pages and docs consistently describe a model where customers query and govern data in the underlying platform rather than exporting it into a separate analytics store managed by Sigma. That has two important consequences. First, it tightens alignment with the warehouse as the source of truth and reduces replication complexity. Second, it makes product quality partly dependent on the customer’s own data-platform design, permissions, and compute economics. The connection docs for Snowflake and BigQuery reinforce that this is an enterprise integration pattern, not a lightweight browser widget; setup depends on warehouse objects, access controls, and account configuration. In practical terms, Sigma is behaving less like a standalone database product and more like a control plane that sits on top of modern cloud data infrastructure. That architecture is the foundation for both the product upside
    and its technical constraints in real deployments.
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  - CE026
  - CE027
  - CE029
  tableRefs:
  - TE001
  figureRefs:
