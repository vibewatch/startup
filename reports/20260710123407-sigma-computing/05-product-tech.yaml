- id: ux-ai-and-surface-area-expansion
  title: Spreadsheet UX, AI-native features, and surface-area expansion
  body: 'Sigma’s product strategy is broader than self-service BI, but it still anchors itself in a familiar interaction model. Workbook-style exploration, spreadsheet formulas, and governed live data are central because they reduce adoption friction for users who are comfortable in spreadsheets but do not want the limitations of flat files. From that base, Sigma is expanding into embedded analytics, data apps, AI assistants, and AI agents. The feature-announcement and data-app launch materials show a company trying to move from passive dashboard consumption into action-taking workflows. That matters because it suggests Sigma wants to own a larger share of daily operating behavior, not just report generation. It also explains why semantic modeling shows up alongside AI messaging: the company appears to believe trustworthy AI analytics requires governed context, not just prompts. The resulting surface area resembles an analytics application runtime more than a classic BI tool.'
