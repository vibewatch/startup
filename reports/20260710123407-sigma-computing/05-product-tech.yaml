- id: maturity-limitations-and-what-public-sources-cannot-prove
  title: Maturity, limitations, and what public sources still cannot prove
  body: The strongest product-technology reading is that Sigma is well matched to modern cloud-data-stack customers that want governed self-service, spreadsheet-like flexibility, and a path toward embedded apps and AI workflows. The biggest limitations arise from the same architectural choices that make that story attractive. Third-party review evidence points to weaker fit where customers need direct non-SQL or API-native querying, deeply customized embedding, or a technical abstraction layer that hides warehouse economics altogether. Even when the product fit is good, scale characteristics still matter. Public materials do not provide audited benchmark data for latency, concurrency, or comparative cost efficiency, and they do not quantify how widely new surfaces like agents or data apps are used across the installed base. Investors should therefore treat the product thesis as credible but still partially unproven on operational depth at scale, despite solid ecosystem and procurement signals
    today overall.
