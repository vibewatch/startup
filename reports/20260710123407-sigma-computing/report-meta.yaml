companyProfile:
  summary: |
    Sigma Computing is a San Francisco-based analytics software company built around a warehouse-native
    product thesis: keep data live in the cloud warehouse, add governed modeling and permissions, and let
    business teams work through spreadsheet-like interfaces, embedded apps, and AI-native workflows.
    Public materials support a 2014 founding, current leadership under CEO Mike Palmer, and a co-founder
    story centered on Rob Woollen and Jason Frantz. By mid-2026 the company had disclosed $200M ARR,
    2,000+ customers, and an $80M Series E at a $3B valuation, placing it among the more scaled private
    analytics vendors. The strategic case is strong, but the company remains materially under-disclosed on
    margins, retention, concentration, and cap-table terms needed to fully underwrite the current price.
  foundedDate: "2014-01-01"
  founders:
    - name: "Rob Woollen"
      role: "CTO and Co-Founder"
      background: |
        Official company materials and the Series C announcement identify Woollen as a co-founder and the
        long-lived technical leader behind Sigma’s warehouse-native product architecture.
      claimRefs: ["CO006", "CO010"]
    - name: "Jason Frantz"
