  foundingLocation: "San Francisco, California, USA"
  headquarters: "San Francisco, California, USA"
  productSummary: |
    Sigma sells warehouse-native analytics, BI, embedded analytics, data apps, and AI/agentic workflows
    that run directly on governed cloud data platforms rather than on replicated extracts.
  customerFocus: |
    Mid-market and enterprise organizations with modern cloud data stacks—especially finance, operations,
    analytics, product, and business teams that want governed self-service and workflow-oriented analytics.
  businessModel: |
    Enterprise SaaS sold through negotiated subscriptions and platform-aligned go-to-market motions,
    increasingly expanded through embedded analytics, data apps, and AI-native workflow surfaces.
  stage: "Series E"
