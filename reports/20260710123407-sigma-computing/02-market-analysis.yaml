  evidenceGaps:
  - type: missing-source
    severity: material
    topic: sigma-sam-som
    missingEvidence: A public or management-supported Sigma-specific SAM or SOM with methodology.
    whyItMatters: Later valuation work needs a bounded penetration case rather than a generic BI TAM.
    diligencePath: Request internal market segmentation by warehouse platform, buyer segment, and current penetration assumptions.
    relatedQuestionRefs:
