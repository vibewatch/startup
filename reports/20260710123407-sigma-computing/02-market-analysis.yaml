chapter:
  number: 2
  title: Market Analysis
  summary: Sigma is selling into a broad but definable market for cloud-native analytics, BI, embedded analytics, and AI-enabled workflow tooling layered on top of modern data warehouses. Public market estimates support a large opportunity—roughly $29-32 billion today depending on boundary choice—but they do not isolate a Sigma-specific SAM or SOM. The strongest market drivers are cloud-warehouse consolidation, AI-assisted analytics adoption, and buyer demand to connect governed data directly to execution, while the biggest frictions remain governance maturity, incumbent bundling, warehouse dependence, and limits in polyglot or customer-facing use cases.
sections:
- id: market-boundary-and-substitutes
  title: Market boundary, included spend, and substitutes
  body: The cleanest way to define Sigma’s market is not “all analytics software,” but the subset of analytics and application-layer spend that sits directly on governed cloud data warehouses and turns exploration into action. Sigma’s architecture page and product pages repeatedly center live, zero-copy querying, governed semantic context, spreadsheet-native interaction, AI apps, and workflow automation. That means the relevant market includes self-service BI, embedded analytics, semantic modeling, writeback-driven operational workflows, and agentic analytics running on warehouse data. It excludes the warehouse itself, general-purpose LLM tools with no governed data layer, and many stand-alone planning or operational systems that do not use analytics as their control plane. The strongest substitutes are therefore legacy BI tools, spreadsheets plus custom SQL, and adjacent analytics platforms such as Tableau, Power BI, Looker, and ThoughtSpot. Each can address part of the need, but they vary
    in live-query behavior, semantic governance, embedded control, and action-taking depth. For investors, that boundary logic matters more than quoting a giant generic TAM because Sigma’s value rests on replacing passive dashboards with governed data workflows.
  claimRefs:
