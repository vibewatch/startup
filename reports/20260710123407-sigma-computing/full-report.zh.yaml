      - number: '2.2'
        title: 规模测算视角，以及公开数字为何分歧
        blocks:
          - type: paragraph
            body: >-
              公开市场规模来源支持一个大市场，但没有给出只属于 Sigma 的精确分母。Emergen Research 估算全球 BI 与分析市场在 2025 年为 $31.86B，CAGR 为 13.7%；Business
              Research Insights 则估算商业智能与分析软件市场在 2026 年为 $29.21B，并将在 2035 年达到
              $50.44B。这两个数字方向一致——都指向一个庞大且仍在增长的软件类别——但不能互换使用，因为一个围绕宽泛的 BI 与分析，另一个是时间锚点不同、范围更窄的软件支出。更重要的是，二者都没有拆出 Sigma
              具体瞄准的仓库原生 AI 分析切片。本次抓取记录中没有公开的 Sigma 专属 SAM 或 SOM。因此，正确读法是采用多个有边界的视角：一个看大类规模，一个看 Sigma
              由架构驱动的细分市场，并明确标出可服务市场的证据缺口。这样才能保持分析诚实，避免后续估值工作压在一个公开记录并不真正支持的分母上。
