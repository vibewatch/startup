  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 已披露 ARR 规模与增长信号
        blocks:
          - type: paragraph
            body: >-
              档案中可信度最高的公开财务事实，是 Sigma 在 2026 年 4 月披露 $200M ARR，并由公司公告和 FinancialContent / Business Wire 转载共同佐证。仅这一点就足以把
              Sigma 推入规模化软件公司区间。另几个值得注意的增长信号来自一个月后的 Series E 轮材料：公司称增长超过 100%，并新增超过 110
              万活跃用户。合在一起，这些披露显示其收入线动能很快，对一家处在拥挤市场中的私营分析公司而言，产品采用也异常强劲。它们也解释了为什么即使大软件环境艰难，投资者兴趣仍然很高。但这些披露没有解释 ARR
              构成、扩张的耐久性，或取得这种增长需要付出的成本。因此，投资者可以相信规模方向，同时在私下尽调补齐前，继续把收入质量问题视为未决。
