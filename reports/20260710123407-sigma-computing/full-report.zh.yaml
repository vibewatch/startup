      - number: '2.3'
        title: 买家、用户、付款方，以及采用通常如何展开
        blocks:
          - type: paragraph
            body: >-
              Sigma 的公开材料指向跨职能买方图谱，而不是单一部门采购。数据和分析负责人仍是天然技术守门人，因为要让终端用户安全自助，必须先有受支持的仓库连接、权限和数据模型。但公司的信息和客户案例明显越过 BI
              团队，触达财务、运营、分析工程师，以及已经习惯用电子表格思考的业务运营人员。这意味着买家、用户、付款方是混合结构：IT、数据平台、财务或营收运营预算为技术栈付费，业务分析师和运营人员成为日常用户。采用路径也比
              AI 热词暗示的更分阶段。公开文档显示，动作通常从实时仓库访问开始，随后是自助式工作簿，再到受治理模型和指标，然后是写回、动作和嵌入式应用，最后才是更广的智能体式工作流。这个顺序很重要，因为 Sigma
              先靠让现有仓库数据更好用来赢，之后才把这片版图转成工作流自动化。分阶段动作可以扩大客户基础，但和纯 AI 助手叙事相比，也会放慢 AI 叙事的完全变现。
