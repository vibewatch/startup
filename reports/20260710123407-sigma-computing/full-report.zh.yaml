            body: >-
              对一家私营公司而言，Sigma 的公开轮次历史记录得异常完整。2021 年 Series C 轮公告称，公司该轮融资 $300M，累计融资 $381.3M。2024 年 5 月，Sigma 宣布以 $1.5B
              估值完成 $200M Series D 轮。2026 年 5 月，公司又宣布以 $3B 估值完成 $80M Series E 轮。仅使用这些披露事实，Sigma 在此处引用轮次中已公开融资至少约
              $661M。2026 年轮次规模小于此前 Series D
              轮，这一点值得注意：管理层和投资者显然能在不重复一次巨额融资的情况下，支撑明显更高的估值。它可以被解读为可选性和信心的信号，尽管公开记录没有说明公司是不需要更多现金、偏好少稀释，还是在优化战略投资人组合。无论哪种，资本结构故事方向上偏正面。
