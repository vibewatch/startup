      - number: '8.5'
        title: 展品
        blocks:
          - type: callout
            title: 最新定价轮是最关键的估值事实
            body: 有了刚出炉的 $3 billion 标记和披露的 $200 million ARR 锚点，公开分析该做的是检验其合理性，而不是抛开本轮、改用泛化市场经验法则。
