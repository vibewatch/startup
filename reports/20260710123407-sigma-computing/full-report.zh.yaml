      - number: '1.4'
        title: 里程碑、披露缺口与负面背景
        blocks:
          - type: paragraph
            body: >-
              概览章节不能把 Sigma 的公开档案写得比实际更干净。积极的一面是，抓取材料给出一条连贯年表：2014 年创立，2021 年 Series C 轮，2024 年 Series D 轮，2026 年 ARR
              里程碑和 Series E 轮。Snowflake 和 Databricks 的公开伙伴证据也支持一个判断：过去几年里，Sigma
              在现代仓库生态中具备战略相关性。但披露缺口仍然重要。公司没有在本次审阅的来源中发布审计财务、可对账的总融资额、精确员工数、烧钱速度、跑道、NRR 或股权控制条款。Tracxn、VCBacked
              等第三方数据库有方向性参考价值，但无法和官方轮次披露完全对齐，尤其是债务和累计融资额。公开档案中最明确的负面事项，是 Sigma 信任中心披露的 2026 年 Salesloft Drift 事件：Sigma
              称其 Salesforce CRM 暴露了有限的业务联系人信息，但核心 Sigma 平台和客户云数据仓库未受影响。另有批评性评测也认为，Sigma 的纯仓库架构和以 iframe
              为主的嵌入方式，对部分买家可能构成限制。因此，投资者应把 Sigma 视为现代 BI 里真实成规模的赢家，但它在支撑后续章节高精度承销估值所需的指标上，仍然披露不足。
