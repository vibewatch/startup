              像一家严肃的私营软件公司，已经具备规模、品类动能和投资者信念。公司明显已经越过了「是否有人想要这个产品」的阶段。现在真正的问题是，增长是否足够高效、多元且耐久，从而支撑私募市场的溢价定价。Tracxn、VCBacked、Eqvista、Clearly
              Acquired 等二级来源可作为背景，但当事实冲突或精度重要时，应低于官方披露。它们的价值在于勾勒尽调桥，而不是替代尽调桥。这座桥有三部分：第一，通过 NRR
              和流失率判断客户队列质量；第二，看毛利结构和现金效率；第三，看集中度和续约风险。在这些信息通过私下渠道披露前，公开档案支持强增长论点，但只能支持临时质量论点。对今天的后期私营公司而言，这个结论是健康的，不是看空的。
