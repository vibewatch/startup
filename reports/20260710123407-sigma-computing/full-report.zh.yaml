  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 仓库原生架构与控制平面论点
        blocks:
          - type: paragraph
            body: >-
              Sigma 的技术身份始于零拷贝、仓库原生架构。产品页面和文档持续描述一种模式：客户在底层平台中查询和治理数据，而不是把数据导出到 Sigma
              管理的独立分析存储。这带来两个重要后果。第一，它让仓库作为事实源的地位更稳，也降低复制复杂度。第二，产品质量会部分依赖客户自身的数据平台设计、权限和计算经济性。Snowflake 和 BigQuery
              连接文档进一步说明，这是一种企业级集成模式，不是轻量浏览器小组件；设置依赖仓库对象、访问控制和账户配置。实际来看，Sigma
              更像是坐在现代云数据基础设施之上的控制平面，而不是一个独立数据库产品。这种架构既是产品上行空间的基础，也是实际部署中技术约束的来源。
