  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与替代品
        blocks:
          - type: paragraph
            body: >-
              定义 Sigma 市场的最干净方式，不是把它归入「所有分析软件」，而是界定为直接位于受治理云数据仓库之上、把探索转成动作的分析和应用层支出。Sigma
              的架构页面和产品页面反复强调实时、零拷贝查询、受治理语义上下文、电子表格原生交互、AI 应用和工作流自动化。这意味着相关市场包括自助式
              BI、嵌入式分析、语义建模、由写回驱动的运营工作流，以及运行在仓库数据上的智能体式分析。它不包括仓库本身、没有受治理数据层的通用 LLM
              工具，也不包括许多不把分析作为控制平面的独立规划或运营系统。因此，最强替代品是传统 BI 工具、电子表格加自定义 SQL，以及 Tableau、Power BI、Looker、ThoughtSpot
              等相邻分析平台。每一类都能覆盖部分需求，但在实时查询行为、语义治理、嵌入式控制和执行动作深度上差异明显。对投资者而言，这套边界逻辑比引用一个巨大泛化 TAM 更重要，因为 Sigma
              的价值建立在用受治理数据工作流替代被动仪表盘之上。
