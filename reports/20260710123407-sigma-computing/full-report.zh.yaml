  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 直接同业集合，以及 Sigma 如何定位自己
        blocks:
          - type: paragraph
            body: >-
              Sigma 的公开定位让同业集合几乎没有歧义。公司明确把自己同 Tableau、Power BI、Looker 和 ThoughtSpot 比较，同时把电子表格和自定义 SQL
              描绘成它想替代的长期现状。这一点具有战略意义，因为它把 Sigma 放进一个成熟、高强度市场，而不是无人占据的细分角落。差异化主张在其架构、电子表格、嵌入式和智能体产品页面中也保持一致：Sigma
              认为用户应该能在熟悉界面里直接处理实时仓库数据，再把工作延伸到应用和自动化。InterWorks 的独立对比支持了部分叙事，称 Sigma 尤其相对于 Tableau 和 Power
              BI，是从仪表盘转向数据应用。不过，竞争边界正在收紧，因为既有厂商也在营销 AI 辅助分析、嵌入式工作流和受治理答案。结果是，Sigma 确实有定位楔子，但不垄断叙事；在今天，分发仍几乎和产品设计、采购一样重要。
