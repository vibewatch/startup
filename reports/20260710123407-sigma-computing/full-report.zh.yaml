              对一家私营公司而言，估值章节从一个异常扎实的公开锚点开始。Sigma 在 2026 年 4 月披露 $200M ARR，随后在 2026 年 5 月宣布以 $3B 估值完成 $80M Series E
              轮融资。这个顺序很重要，因为它同时给投资者一个收入分母和一个近期出清价格。公司 2024 年 Series D 轮的 $1.5B 估值提供了第二个锚点，使估值跃升可见，而不是靠推断。在这份公开记录上，标题隐含
              ARR 倍数约为
