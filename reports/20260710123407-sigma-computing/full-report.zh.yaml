            body: >-
              对一家私营分析公司而言，Sigma 的资本市场故事罕见地有充分公开材料支撑。公司在 2026 年 5 月宣布以 $3B 估值完成 $80M Series E 轮融资，由 Princeville Capital
              领投，Databricks Ventures、ServiceNow Ventures 和 Workday Ventures 新参与，Altimeter、Avenir、D1、Spark、Sutter Hill
              等老股东也继续跟进。就在一年多前，Sigma 宣布完成 $200M Series D 轮，独立报道将该轮估值定在 $1.5B。再往前，官方 Series C 轮公告披露 2021 年 12 月融资
              $300M，当时累计融资 $381.3M。运营层面，Sigma 在 2026 年 4 月发布的 ARR 公告是关键牵引数据点：公司称 ARR 达到 $200M，同比增长超过 100%，最近一个财年新增 110
              万活跃用户，并跨过 2,000 家客户。该披露和 Series E 轮新闻稿还把 AMD、Duolingo、Colgate-Palmolive 和 JPMorgan Chase
              列为参考客户。因此，公开档案最强的是融资和收入增长方向，而不是毛利、留存或集中度等底层收入质量指标。
