          - type: paragraph
            body: >-
              公开可比公司主要提供背景。Omni 在 2026 年完成 $1.5 billion Series C，说明相邻的 AI 分析挑战者仍能拿到可观私募估值；不过 Sigma
              披露了收入锚点，自己的估值标记更扎实。ThoughtSpot 等私有分析公司画像显示，这一赛道融资竞争仍然充分；Tableau 出售给 Salesforce
              这类较早的公开交易，则证明分析领域确实可能出现大型战略退出——但交易太旧，不能作为今天的定价锚。Sigma 溢价最强的支撑来自客户验证、伙伴背书，以及一条把经典 BI 延伸到 AI
              原生工作流和应用的扩张叙事。主要下行风险是，这份溢价仍押注于留存、利润率耐久性和多界面扩张，而公开材料尚未完全证明。也因此，这个价格可以辩护，但仍带条件；下行情形需要被明确纳入权重。
            claimRefs:
