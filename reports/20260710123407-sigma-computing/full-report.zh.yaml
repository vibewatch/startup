              智能体采用。法律页面、供应商风险摘要和评测网站有用，因为它们指向尽调议程，但无法收口。公开证据足以否定任何简单的「低风险」论点，也足以否定任何简单的「公司已经坏掉」论点。风险图谱更像是集中度、依赖性、执行复杂度和治理负担随雄心一起放大。这意味着最好的尽调计划，是测试客户和伙伴集中度、安全控制、受监管工作负载暴露、入门投入，以及新界面的附加率。如果这些方面经得起检验，可见公开风险对有纪律的投资者而言，就是严重但可管理，而不是致命。
