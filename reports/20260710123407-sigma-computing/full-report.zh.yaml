  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 安全、隐私与治理暴露面
        blocks:
          - type: paragraph
            body: >-
              Sigma 的公开信任姿态像许多严肃企业软件厂商一样好坏交织。积极一面是，公司发布信任中心、隐私政策、DPA、DPA
              变更日志、子处理方列表和条款，为客户尽调提供了有意义起点。需要谨慎的一面是，信任中心还记录了一起涉及 Salesloft Drift 和 Salesforce CRM 联系人数据的市场拓展技术栈事件。披露明确称
              Sigma 平台和仓库数据未受影响，这降低了严重性。尽管如此，事件本身证明 Sigma 的风险面会从核心产品代码延伸到运营工具。UpGuard 增加了外部供应商风险视角，HIPAA
              和更广泛隐私预期也提醒投资者，即使 Sigma 不是记录系统，企业买家也可能以高合规标准要求它。正确结论不是恐慌，也不是自满，因为合规义务和合同变更管理也会随时间累积。
