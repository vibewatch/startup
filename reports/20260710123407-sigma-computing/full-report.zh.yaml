companyProfile:
  summary: >
    Sigma Computing 是一家总部位于旧金山的分析软件公司，产品判断建立在仓库原生之上：数据留在云数据仓库里，叠加受治理的建模和权限，再让业务团队通过类电子表格界面、嵌入式应用和 AI 原生工作流开展工作。公开材料支持其
    2014 年创立、现由 CEO Mike Palmer 领导，也支持围绕 Rob Woollen 和 Jason Frantz 的联合创始人叙事。截至 2026 年中，公司已披露 $200M ARR、2,000+ 客户，以及以
    $3B 估值完成 $80M Series E 轮融资，跻身规模更大的私营分析厂商之列。战略逻辑很强，但毛利率、留存、集中度和股权条款披露仍明显不足，尚不足以完整承销当前价格。
