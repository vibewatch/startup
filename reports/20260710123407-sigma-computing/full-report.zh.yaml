              的伙伴与投资者支持，也说明公司在现代数据生态中被视为有战略相关性。但这些仍是代理指标。公开材料没有披露毛利率、烧钱速度、CAC 回收期、自由现金流或 EBITDA，也没有披露
              NRR、流失率或收入集中度。评测网站证据的主要价值，是提醒人们即便在高增长软件中，实施和入门工作仍然存在。因此，公开档案支持增长叙事和相关性叙事，但不支持盈利能力或毛利质量叙事。这是任何外部承销判断的核心限制。
