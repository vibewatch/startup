    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、版图与运营模式
        blocks:
          - type: paragraph
            body: >-
              Sigma 已不再把自己定位成传统仪表盘厂商。无论是官网首页、架构材料、文档还是公司页面，它都把自己表述为建在云数据仓库之上的 AI
              应用和智能体式分析平台。这套说法很关键，因为公司明确把商业智能和执行动作的工作流、受治理的语义上下文、仓库内 AI 绑在一起，而不是停在独立报表。即使只看公开材料，产品表面也已经很宽：Sigma
              称团队可以在一个受治理工作区内使用电子表格公式、SQL、Python 和原生
              AI，同时让数据留在仓库里。联系页面把运营版图锚定在旧金山，也列出纽约和伦敦办公室，说明其市场拓展和客户支持触达不只限于湾区单一办公室。公司页面还显示，Sigma
              试图把自己定义为企业数据之上的执行层，而不只是分析层，并称有 1,900+ 组织和客户构建的 6,000+ AI 应用。仓库原生架构、电子表格熟悉感和 AI 定位共同构成了后续章节应作为基准的身份。
