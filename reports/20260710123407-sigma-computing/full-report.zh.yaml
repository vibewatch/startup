      - number: '8.4'
        title: 立场以及私下尽调仍需补齐的问题
        blocks:
          - type: paragraph
            body: >-
              基于公开信息，最好的立场既不是凯歌式多头，也不是条件反射式怀疑。Sigma
              近期定价轮比用不完整公开数据拼出的合成模型更有信息量；关键是判断可观察价格是否合理，以及背后必须有哪些未公开证据支撑。按这个测试，结论是建设性但有条件。中性偏正面符合公开记录：公司估值看起来合理到略贵，而非明显便宜；主要未解问题藏在价格底下，不在价格之外。公开来源没有披露股权结构保护、有效优先股经济条款、利润率结构、收入集中度，也没有说明未来上行在多大程度上依赖嵌入式分析、数据应用和
              AI 智能体。因此，私下尽调必须把可信的观察价格，与队列质量和利润率质量的未见证据接起来。如果这座桥站得住，估值就有支撑；否则，从外部投资者的时间维度看，本轮会显得偏满。
