      - number: '2.4'
        title: 增长驱动、阻力与可投资解读
        blocks:
          - type: paragraph
            body: >-
              市场顺风真实存在。云数据仓库越来越被视为分析的记录系统；BigQuery、Databricks 和 Sigma 都在描绘一个商业逻辑、权限和 AI 工作流更贴近数据的世界。NIST 的 AI
              风险管理框架进一步强化了受治理分析的逻辑，因为企业现在关心的不只是得到答案，还关心答案是否有权限、可解释，并建立在获批指标之上。与此同时，市场并非没有摩擦。Knowi
              的负面评测抓住了尽调中必须重视的几项结构性限制：Sigma 需要受支持的云 SQL 仓库，最强治理结果依赖上游语义纪律，在客户需要深度 SDK 驱动嵌入式分析或直接 NoSQL/API
              查询时较弱。既有厂商也会限制扩张。Power BI 受益于 Microsoft 捆绑，Looker 受益于语义治理可信度，ThoughtSpot 受益于 AI 优先搜索定位，Tableau
              受益于已安装的仪表盘资产。因此，可投资结论需要细分：Sigma 面对的是一个又大又及时的市场，但真正机会是受治理的仓库工作流层，而不是整个 BI 宇宙。
