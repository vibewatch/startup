  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: A company-confirmed current employee count and location split.
    whyItMatters: Headcount is a basic scale and efficiency proxy for a private software company, and conflicting database estimates weaken productivity analysis.
    diligencePath: Request a management headcount bridge by function and geography as of the Series E close.
    relatedQuestionRefs:
    - QO021
  - type: conflicting-data
    severity: material
    topic: total-capital
    missingEvidence: A reconciled schedule of equity, debt, and any secondary proceeds across all funding rounds.
    whyItMatters: Official round disclosures and database summaries do not align perfectly, which affects dilution and capital-efficiency analysis.
    diligencePath: Obtain the company cap-table summary and financing history from management or lead investors.
    relatedQuestionRefs:
    - QO022
    - QO024
    relatedTableRefs:
    - TO003
    - TO004
  - type: private-evidence-only
    severity: material
    topic: governance-and-control
    missingEvidence: Board committee structure, voting control, preference stack, and any secondary terms tied to Series E.
    whyItMatters: Governance and preference terms can materially change investor downside and board influence even when top-line growth looks strong.
    diligencePath: Request the current board matrix, investor rights summary, and Series E term sheet during management diligence.
    relatedQuestionRefs:
    - QO023
    relatedTableRefs:
    - TO002
  - type: private-evidence-only
    severity: material
    topic: financial-quality
    missingEvidence: Gross margin, burn, runway, net retention, gross retention, and top-customer concentration.
    whyItMatters: The overview chapter can establish scale, but later valuation work still depends on operating-quality metrics that are absent from public sources.
    diligencePath: Request a board-style KPI pack covering quarterly ARR bridge, retention, margin, burn, and concentration.
    relatedQuestionRefs:
    - QO025
