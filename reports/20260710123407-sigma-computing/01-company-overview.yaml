company:
  name: Sigma Computing
chapter:
  number: 1
  title: Company Overview
  summary: Sigma Computing is a San Francisco-based warehouse-native analytics company that now markets itself as an AI apps and agentic analytics platform. The strongest public evidence supports a $80 million Series E at a $3 billion valuation in May 2026, $200 million ARR in April 2026, 2,000+ customers, and a leadership team centered on CEO Mike Palmer with co-founders Rob Woollen and Jason Frantz. Public disclosure is strong on financing and product narrative, but still weak on headcount, margin, burn, and a fully reconciled total-capital figure.
sections:
- id: identity-footprint-and-operating-model
  title: Identity, footprint, and operating model
  body: 'Sigma is no longer positioning itself as a classic dashboard vendor. Across its homepage, architecture materials, documentation, and company page, it frames itself as the AI apps and agentic analytics platform built on the cloud data warehouse. That language matters because the company is explicitly tying business intelligence to action-taking workflows, governed semantic context, and warehouse-resident AI rather than to standalone reporting. The product surface is broad even in public materials: Sigma says teams can work in a single governed workspace using spreadsheet formulas, SQL, Python, and native AI while keeping data in the warehouse. The contact page anchors the operating footprint in San Francisco and also lists offices in New York and London, which supports a meaningful go-to-market and customer-support footprint beyond a single Bay Area office. The company page further shows that Sigma is trying to define itself as an execution layer on top of enterprise data, not only
    an analysis layer, and claims 1,900+ organizations and 6,000+ AI apps built by customers. That combination of warehouse-native architecture, spreadsheet familiarity, and AI positioning is the base identity later chapters should treat as canonical.'
