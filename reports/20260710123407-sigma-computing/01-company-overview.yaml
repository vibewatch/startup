- id: founders-leadership-and-governance
  title: Founders, leadership, and governance
  body: The public record is clear on current leadership but slightly weaker on the full founding story than the user-supplied brief suggests. Sigma’s company page lists Mike Palmer as CEO, Rob Woollen as CTO and co-founder, Jason Frantz as chief architect and co-founder, Christina Liu as CFO, Eran Davidov as SVP Engineering, Orla Clifford as VP Operations, and Ali Harmer as General Counsel. It also names a five-person board consisting of Brad Gerstner, John McMahon, René Bonvanie, Chad Peets, and Pete Schlampp, while the Series E announcement adds Princeville Capital partner Vivian Huang to the board. The official 2021 Series C announcement says Sigma was founded in 2014, not 2016, and directly quotes Woollen as co-founder. That means the prompt’s statement that Mike Palmer founded Sigma in 2016 is not supported by the fetched public record used in this run. Instead, the better-supported view is that Palmer is the current CEO, while Woollen and Frantz are the public co-founder figures still
    visible in company materials. Governance disclosure is therefore serviceable on executives and directors, but thin on committee structure, voting control, or preference stack.
