- id: milestones-disclosure-gaps-and-adverse-context
  title: Milestones, disclosure gaps, and adverse context
  body: 'The overview chapter should not present Sigma’s public file as cleaner than it is. On the positive side, the fetched materials show a coherent chronology from 2014 founding, to the 2021 Series C, to a 2024 Series D, to a 2026 ARR milestone and Series E. Public partner evidence from Snowflake and Databricks also supports the idea that Sigma has been strategically relevant inside the modern warehouse ecosystem for several years. But the disclosure gaps are still material. The company does not publish audited financials, a reconciled total-capital figure, exact headcount, burn, runway, NRR, or cap-table control terms in the sources reviewed here. Third-party databases such as Tracxn and VCBacked are directionally useful, but they do not fully reconcile with official round disclosures, especially around debt and aggregate capital raised. The clearest adverse item in the public file is the 2026 Salesloft Drift incident disclosed in Sigma’s trust center: Sigma says it exposed limited
    business contact information in its Salesforce CRM while leaving the core Sigma platform and customer cloud data warehouses untouched. Separate critical review coverage also argues that Sigma’s warehouse-only architecture and iframe-led embedding can be limiting for some buyers. Investors should therefore treat Sigma as a real scaled winner in modern BI, but still under-disclosed on the metrics that would let later chapters underwrite valuation with high precision.'
