- id: funding-scale-and-customer-traction
  title: Funding, scale, and customer traction
  body: 'Sigma’s capital-market story is unusually well supported for a private analytics company. The company announced an $80 million Series E at a $3 billion valuation in May 2026, led by Princeville Capital with new participation from Databricks Ventures, ServiceNow Ventures, and Workday Ventures, while prior backers such as Altimeter, Avenir, D1, Spark, and Sutter Hill also returned. Just over a year earlier, Sigma announced a $200 million Series D, and independent coverage pegged that round at a $1.5 billion valuation. Going further back, the official Series C announcement disclosed $300 million raised in December 2021 and $381.3 million raised to date then. Operationally, Sigma’s April 2026 ARR announcement is the crucial traction datapoint: the company says it hit $200 million ARR, grew more than 100% year over year, added 1.1 million new active users in the latest fiscal year, and crossed 2,000 customers. The same disclosure and the Series E press release cite AMD, Duolingo, Colgate-Palmolive,
    and JPMorgan Chase as reference customers. The public file is therefore strongest on funding and top-line growth direction, not on underlying revenue quality metrics such as margin, retention, or concentration.'
