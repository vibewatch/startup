- id: what-public-financial-quality-evidence-supports-and-does-not-support
  title: What public evidence supports financial quality—and what it does not
  body: There are some public signals that Sigma’s growth reflects real customer demand rather than financial engineering. DoorDash’s case study links higher usage to constant Snowflake cost, while Makena and Stratum show that customers describe meaningful productivity and decision-speed gains. Partner and investor support from Snowflake and Databricks also suggests the company is seen as strategically relevant inside the modern data ecosystem. But these are still proxy indicators. None of the public materials disclose gross margin, burn, CAC payback, free cash flow, or EBITDA. They also do not disclose NRR, churn, or revenue concentration. Review-site evidence is useful mainly as a reminder that implementation and onboarding work still exist even in high-growth software. So the public file supports a growth narrative and a relevance narrative, but it does not support a profitability or margin-quality narrative. That is the central constraint on any external underwriting view.
