- id: financial-judgment-and-diligence-bridge
  title: Financial judgment and the diligence bridge from scale to quality
  body: 'On balance, Sigma looks like a serious private software company with scale, category momentum, and investor conviction. The company is clearly past the stage where the key question is whether anyone wants the product. The relevant question now is whether the growth is efficient, diversified, and durable enough to justify premium private-market pricing. Secondary sources such as Tracxn, VCBacked, Eqvista, and Clearly Acquired are useful context but should be weighted below official disclosures when facts conflict or precision matters. Their value is in framing the diligence bridge, not in substituting for it. That bridge has three parts: first, cohort quality through NRR and churn; second, margin structure and cash efficiency; third, concentration and renewal risk. Until those are disclosed privately, the public file supports a strong growth thesis, but only a provisional quality thesis. That is a healthy, not bearish, conclusion for a late-stage private company today overall externally.'
