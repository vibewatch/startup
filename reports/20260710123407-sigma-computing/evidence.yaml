evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: A company-confirmed current employee count and location split.
    whyItMatters: >-
      Headcount is a basic scale and efficiency proxy for a private software company, and conflicting database estimates
      weaken productivity analysis.
    diligencePath: Request a management headcount bridge by function and geography as of the Series E close.
    relatedQuestionRefs:
      - QO021
  - type: conflicting-data
    severity: material
    topic: total-capital
    missingEvidence: A reconciled schedule of equity, debt, and any secondary proceeds across all funding rounds.
    whyItMatters: >-
      Official round disclosures and database summaries do not align perfectly, which affects dilution and
      capital-efficiency analysis.
    diligencePath: Obtain the company cap-table summary and financing history from management or lead investors.
    relatedQuestionRefs:
      - QO022
      - QO024
    relatedTableRefs:
      - TO003
      - TO004
  - type: private-evidence-only
    severity: material
    topic: governance-and-control
    missingEvidence: Board committee structure, voting control, preference stack, and any secondary terms tied to Series E.
    whyItMatters: >-
      Governance and preference terms can materially change investor downside and board influence even when top-line
      growth looks strong.
    diligencePath: Request the current board matrix, investor rights summary, and Series E term sheet during management diligence.
    relatedQuestionRefs:
      - QO023
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: financial-quality
    missingEvidence: Gross margin, burn, runway, net retention, gross retention, and top-customer concentration.
    whyItMatters: >-
      The overview chapter can establish scale, but later valuation work still depends on operating-quality metrics that
      are absent from public sources.
    diligencePath: Request a board-style KPI pack covering quarterly ARR bridge, retention, margin, burn, and concentration.
    relatedQuestionRefs:
      - QO025
  - type: missing-source
    severity: material
    topic: sigma-sam-som
    missingEvidence: A public or management-supported Sigma-specific SAM or SOM with methodology.
    whyItMatters: Later valuation work needs a bounded penetration case rather than a generic BI TAM.
    diligencePath: Request internal market segmentation by warehouse platform, buyer segment, and current penetration assumptions.
    relatedQuestionRefs:
      - QM007
      - QM023
  - type: private-evidence-only
    severity: material
    topic: buyer-budget-splits
    missingEvidence: Budget-owner split, deal-size distribution, and paid-seat versus app-based monetization by buyer segment.
    whyItMatters: Without budget-owner evidence, customer-acquisition and market-conversion assumptions remain speculative.
    diligencePath: Ask management for pipeline mix by function, ACV band, and economic buyer.
    relatedQuestionRefs:
      - QM024
    relatedTableRefs:
      - TM003
  - type: stale
    severity: minor
    topic: market-estimates
    missingEvidence: A 2026 purpose-built warehouse-native or agentic-analytics category study.
    whyItMatters: Broad BI market reports overstate precision for Sigma’s niche and may lag AI-driven budget shifts.
    diligencePath: Use primary customer and win-loss data instead of generic market reports in later refreshes.
    relatedQuestionRefs:
      - QM023
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: penetration-and-win-rates
    missingEvidence: Win rates, incumbent displacement data, and deployment penetration by segment.
    whyItMatters: The public file validates the market but does not show how efficiently Sigma converts that opportunity.
    diligencePath: Request cohort win-loss analysis against Tableau, Power BI, and Looker by segment.
    relatedQuestionRefs:
      - QM025
