  - - Data-mature organization
    - Higher chance of expansion and self-service success
    - Narrows addressable pool
  - - Regulated enterprise buyer
    - Trust and legal artifacts support procurement
    - Vendor-risk review can still slow conversion
  notes: Customer fit is technical and organizational, not just feature-based.
