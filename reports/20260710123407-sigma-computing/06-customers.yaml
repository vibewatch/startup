chapter:
  number: 6
  title: Customers
  summary: 'Public evidence supports a real and broad Sigma customer base with 2,000+ organizations by mid-2026 and named enterprise logos including AMD, Duolingo, Colgate-Palmolive, and JPMorgan Chase. The strongest public customer proof is qualitative but meaningful: stories show workflow gains in finance, operations, logistics, customer insights, and embedded analytics, with DoorDash’s cost-constant query growth standing out as a concrete efficiency datapoint. The customer fit appears strongest in modern cloud-data-stack environments. The main missing evidence is not logo count, but retention, concentration, expansion depth, and adoption rates for newer surfaces like data apps and AI agents.'
sections:
- id: customer-base-and-vertical-breadth
  title: Customer base, logo quality, and vertical breadth
  body: 'Sigma’s public customer record is credible on breadth. The company’s 2026 Series E materials say it serves more than 2,000 customers, while the company page still says 1,900+ organizations, implying the count was moving quickly upward. The named logos cited in the 2026 financing materials—AMD, Duolingo, Colgate-Palmolive, and JPMorgan Chase—help validate that the company is not limited to small experimental accounts. Beyond those names, Sigma’s own customer-story library spans fintech, alternative asset management, logistics, retail, social impact, customer-insights teams, and data-services providers. That diversity matters because it suggests the company is not riding a single-vertical demand pocket. At the same time, the stories point to a common pattern: customers tend to already have meaningful data assets and want governed analytics closer to functional workflows. The better interpretation is therefore “broad enterprise relevance with data-stack filtering,” not simple horizontal
    universality, across multiple business motions.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
  - CU030
  - CU031
  tableRefs:
  - TU001
  - TU002
  figureRefs:
