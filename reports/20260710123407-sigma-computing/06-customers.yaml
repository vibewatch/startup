- id: who-fits-best-and-where-friction-remains
  title: Customer fit, cloud-data-stack alignment, and the frictions still visible
  body: The visible customer file suggests Sigma fits best where customers already run modern cloud data platforms and want governed self-service for functional teams. Snowflake and Databricks partner materials reinforce that interpretation, while BigQuery’s platform framing supports relevance in Google Cloud environments as well. Review sites add a useful balancing view. TrustRadius, G2, and Research.com all support the idea that users value governed self-service and spreadsheet-like flexibility, but adverse review sources also point to onboarding, governance, and data-maturity requirements. Knowi and Lokad are especially useful here because they imply Sigma is strongest in supported warehouse-centric contexts and less natural in broader polyglot or deeply customized scenarios. This means customer fit is not purely about use case; it is also about data-platform readiness. That can be a strength, because mature customers may expand more predictably, but it also narrows the naturally addressable
    pool and can lengthen implementation or change-management work during large enterprise rollouts.
  claimRefs:
  - CU013
  - CU014
  - CU015
  - CU016
  - CU017
  - CU018
  - CU019
  - CU026
  - CU027
  tableRefs:
  - TU004
  figureRefs:
  - FU004
- id: what-is-still-missing-for-customer-diligence
  title: What is still missing for real customer diligence
  body: Public evidence is good enough to establish that Sigma has real enterprise customers and credible workflow use cases, but it is not good enough to establish the quality of the revenue base. The biggest omissions are net revenue retention, gross churn, segment-level expansion, and customer concentration. Public sources also do not reveal how much revenue comes from flagship accounts versus the long tail, or which customer cohorts adopt newer surfaces such as data apps and AI agents most deeply. Because most of the strongest customer stories are curated by Sigma, review sites remain essential balancing evidence but still cannot replace cohort data. The practical diligence question is therefore not whether customers exist, but how durable and concentrated customer value is by segment and workflow. That distinction matters because the customer thesis is strongest when Sigma becomes part of operating behavior, not when it is just another admired analytics tool in a large software stack
    over time sustainably.
  claimRefs:
