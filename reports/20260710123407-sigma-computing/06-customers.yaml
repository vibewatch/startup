- id: what-customer-stories-actually-prove
  title: What the public customer stories actually prove
  body: 'The public case studies are strongest when they show workflow change, not just positive brand association. DoorDash’s reported 30% increase in queries while keeping Snowflake cost constant is the clearest quantitative example because it links higher use with stable infrastructure spend. Makena Capital’s reporting-time story, Stratum Data Services’ decision-latency story, Emerson Group’s embedded-analytics story, and Affirm’s compensation data-app example all point in the same direction: Sigma is being used to make governed data more operationally useful. Bilt, Persona, Armstrong, and Scribe add evidence that the product can support modern data-stack, customer-insights, logistics, and finance workflows without staying trapped inside central BI teams. These stories do not prove universal customer economics, but they do suggest Sigma’s footprint can move beyond static dashboards into operating processes. That is more strategically meaningful than generic satisfaction claims because
    it supports expansion potential if the workflows become sticky across teams and renewal cycles.'
  claimRefs:
