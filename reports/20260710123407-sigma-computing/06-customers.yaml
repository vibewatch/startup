  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention-and-expansion
    missingEvidence: NRR, gross churn, logo churn, and expansion by segment or workflow.
    whyItMatters: Customer quality matters more than customer count at Sigma’s current scale.
    diligencePath: Request cohort retention and expansion metrics by segment and product surface.
    relatedQuestionRefs:
    - QU016
    - QU024
    relatedTableRefs:
    - TU005
  - type: private-evidence-only
    severity: material
    topic: concentration-and-partial-logo-coverage
    missingEvidence: Revenue concentration across top customers and share of ARR from flagship logos.
    whyItMatters: Named logos can overstate diversification if a small number of accounts drive growth, and the public logo list is only partial.
    diligencePath: Request top-10 customer concentration and renewal schedule.
    relatedQuestionRefs:
    - QU017
    relatedTableRefs:
    - TU001
    - TU005
  - type: private-evidence-only
    severity: material
    topic: data-app-and-agent-adoption
    missingEvidence: Installed-base adoption and expansion metrics for data apps and AI agents.
    whyItMatters: The expansion thesis relies on workflow surfaces beyond core BI.
    diligencePath: Request attach rates, cohort usage, and upsell conversion for advanced surfaces.
    relatedQuestionRefs:
    - QU018
    relatedTableRefs:
    - TU003
    - TU005
  - type: missing-source
    severity: minor
    topic: independent-reference-depth
    missingEvidence: Independent customer references with quantified before/after economics beyond curated case studies.
    whyItMatters: Public customer proof is heavily company-curated.
    diligencePath: Run reference calls across finance, operations, and embedded use-case segments.
