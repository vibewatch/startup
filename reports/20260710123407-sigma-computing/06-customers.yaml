  title: Open customer diligence questions
  columns:
  - Open question
  - Why unresolved publicly
  - Diligence ask
  rows:
  - - What is net revenue retention?
    - No public cohort data
    - Request NRR by segment and vintage
  - - How concentrated is revenue?
    - Named logos do not reveal revenue mix
    - Request top-10 customer concentration
  - - Which cohorts adopt data apps and agents?
    - Launch narratives do not equal broad usage
    - Request feature adoption and expansion rates
  - - Where does customer value prove most durable?
    - Case studies are curated snapshots
    - Review retention and usage by workflow
  notes: The missing evidence is about customer quality and durability, not whether customers exist.
