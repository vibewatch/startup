  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: named-account-verification
    missingEvidence: Top-20 customer list, three reference calls, and contract-level proof tying marquee OEMs or logistics/electronics leaders to Mech-Mind by name.
    whyItMatters: Public sources prove sector presence but do not establish whether marquee logos like BMW, SAIC, Geely, CATL, BYD, Foxconn, or JD Logistics are actual Mech-Mind customers.
    diligencePath: Request customer reference sheets under NDA, including named plant, workflow, go-live date, and whether deployment was direct or through an integrator.
    relatedQuestionRefs:
    - QU010
    - QU011
    - QU012
    - QU013
    - QU026
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: NRR, GRR, logo churn, renewal rates, and multi-year cohort data by vertical or region.
    whyItMatters: The public footprint suggests real deployments, but durability cannot be underwritten without renewal evidence.
    diligencePath: Ask management for annual retention metrics, top-20 customer tenure, and examples of plant-to-plant or product-to-product expansion.
    relatedQuestionRefs:
    - QU020
    - QU026
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: concentration-metrics
    missingEvidence: Revenue share by top customer, top-10 customers, top vertical, and top region, plus channel mix between direct and integrator-led deals.
    whyItMatters: Automotive appears to be the deepest public vertical, but concentration cannot be quantified from current public disclosures.
    diligencePath: Request ARR concentration schedule, vertical ARR mix, and any customer-specific dependency or non-renewal scenario analysis.
    relatedQuestionRefs:
    - QU021
    - QU026
    relatedTableRefs:
    - TU005
  - type: enumeration-incomplete
    severity: material
    topic: public-reference-roster
    missingEvidence: An auditable roster connecting the 100+ Fortune 500 claim to named public references or customer-approved testimonials.
    whyItMatters: Without a public or data-room roster, aggregate scale claims are useful for context but weak for underwriting named-account quality.
    diligencePath: Request a customer-reference appendix mapping aggregate customer claims to named accounts, verticals, regions, and current deployment status.
    relatedQuestionRefs:
    - QU023
    - QU026
    relatedTableRefs:
    - TU003
