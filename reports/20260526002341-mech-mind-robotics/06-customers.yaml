company:
  name: Mech-Mind Robotics
chapter:
  number: 6
  title: Customers
  summary: 'Mech-Mind has credible public evidence of broad industrial deployment: current English and Chinese official pages each state 24,000+ deployed units, 100+ Fortune 500 clients, and roughly 50 covered countries or regions, while the case library shows real workflow depth in automotive, logistics, electronics, EV battery, and metals. The weak point is named-account proof rather than adoption itself. Public sources reviewed for this chapter do not verify marquee names such as BMW, SAIC, Geely, CATL, BYD, Foxconn, or JD Logistics as Mech-Mind customers by name; BMW- and SAIC-adjacent sources instead point to other vendors. Retention, renewal, and concentration metrics remain undisclosed, so customer durability still requires private diligence.'
sections:
- id: customer-footprint-and-verticals
  title: Customer Footprint and Vertical Mix
  body: |-
    Mech-Mind's public customer picture is broad in aggregate and specific in workflow terms, but thin in named-account disclosure. Current English and Chinese official surfaces both claim 24,000+ deployed units, 100+ Fortune 500 clients, and roughly 50 covered countries or regions. That scale is directionally corroborated by third-party profiles, although older third-party snapshots still cite 10,000+ cameras or 15,000+ installations, so the right way to read the installed base is as a moving time-series rather than a single audited denominator.

    Vertical mix is clearer than customer names. Official English pages center automotive, logistics, metal and machining, electronics, EV battery, and food and beverage. Chinese surfaces describe roughly the same footprint using automotive manufacturing, logistics handling, heavy industry, light industry, new energy, and industrial quality inspection. Across both languages, automotive appears deepest, followed by logistics and battery or electronics. The public evidence therefore supports real cross-vertical deployment breadth, but it does not provide a clean customer-by-customer roster that would let an investor map revenue by logo, geography, or cohort.
