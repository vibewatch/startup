- id: named-customer-verification
  title: Named Customer Verification and Proof Quality
  body: |-
    The sharpest customer-side issue is not whether Mech-Mind has industrial deployments; it is whether marquee customer names can be publicly verified. On the positive side, the official case library is large and operationally specific. On the negative side, the company's own pages overwhelmingly describe anonymous plants, parts, or workflows rather than naming the buyer. That means named-customer proof is much weaker than installed-base or vertical-breadth proof.

    The user specifically asked to verify names such as BMW, SAIC, and Geely rather than assume them. The reviewed public evidence does not verify BMW as a named Mech-Mind customer: Mech-Mind's own reviewed pages do not name BMW, and the fetched BMW-adjacent sources point to UR and Hexagon rather than Mech-Mind. SAIC and SAIC-GM are similar: 2026 public battery-line deployment coverage names Zhiyuan/Nengzai, not Mech-Mind. Geely, CATL, BYD, Foxconn, and JD Logistics remain publicly unverified in the fetched set. The result is a clear underwriting distinction between sector fit and customer-name proof.
