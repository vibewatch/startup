company:
  name: Mech-Mind Robotics
chapter:
  number: 2
  title: Market Analysis
  summary: Mech-Mind operates in a large but non-identical stack of markets spanning industrial robots, machine vision, warehouse automation, and narrower 3D-guidance workcells. Public evidence supports strong adoption tailwinds in automotive, electronics, and logistics—especially in China—but the chapter preserves important frictions around integration, capex, and inconsistent market definitions, so the right underwriting lens is a layered SAM rather than one heroic TAM number.
sections:
- id: market-boundary-and-substitutes
  title: Market Boundary, Included Spend, and Substitutes
  body: Mech-Mind should be analyzed as an industrial AI and 3D-vision infrastructure vendor rather than as a full robot OEM. Its own portfolio and third-party profiles consistently describe a stack of industrial 3D cameras, vision software, deep-learning tools, and no-code robot programming used for jobs such as bin picking, depalletizing, machine tending, precision assembly, and inspection. That means the company participates in the perception, planning, and deployment layer that sits on top of robot arms and workcells, not in every dollar of factory or warehouse automation capex. Included spend therefore covers 3D sensors, vision and AI software, deployment tooling, workflow-specific configuration, and local integration support. Excluded spend includes most robot-arm hardware, conveyors, AS/RS steel, and unrelated plant IT. The closest substitutes are manual handling, simpler 2D vision, hard-coded robot cells, or fixed automation that avoids flexible 3D perception altogether, which is
    why the market boundary has to start from hard workflows rather than from the broadest published automation category.
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM005
  - CM006
  tableRefs:
  - TM001
- id: sizing-lenses-and-regional-dynamics
  title: Sizing Lenses and Regional Dynamics
  body: Public market data is directionally positive but not cleanly additive. IFR shows a very large and still-growing global industrial-robot installed base, yet Mech-Mind cannot capture all robot hardware spend; the monetizable wedge is a narrower vision-and-guidance layer riding on that base. The closest adjacent markets in the public source pack are warehouse automation, warehouse robotics, and machine vision. They are all large enough to support meaningful category leaders, but they differ in scope, forecast window, and methodology, so preserving their spread is more honest than pretending they resolve to one consensus TAM. China matters disproportionately in this chapter because it is simultaneously the largest industrial-robot market, the leading electronics-installation market, and an increasingly domestic supplier-led environment. At the same time, public sources do not agree on how to measure robot density, which is a reminder that regional benchmarks need denominator discipline.
    The practical conclusion is that Mech-Mind benefits from a deep automation base in China and from globally expanding machine-vision and warehouse-automation demand, but investors still need a constrained SAM lens rather than a broad headline TAM.
