- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Labor availability and labor cost pressure
    - Positive
    - Now
    - Keeps automation on the budget agenda across warehouses and factories
    - How severe is labor churn in target auto, electronics, and logistics accounts?
  - - AI autonomy and IT/OT convergence
    - Positive
    - Now to medium term
    - Makes 3D-vision-guided systems more flexible and easier to justify
    - How much of Mech-Mind ROI comes from software agility versus hardware replacement?
  - - Logistics machine-vision expansion
    - Positive
    - Medium term
    - Creates a faster-growing demand pool outside classic factory inspection
    - What percent of pipeline comes from logistics versus manufacturing?
  - - China scale and policy support
    - Positive
    - Now to long term
    - Provides dense demand, referenceability, and domestic supplier momentum
    - How transferable are China-proven workflows to overseas customers?
  - - Funding approval gap
    - Negative
    - Now
    - Interest does not convert cleanly into booked projects
    - What share of pilots stall for budget rather than technical reasons?
  - - High AI cost, data infrastructure, and skills gaps
    - Negative
    - Now
    - Slows scaling beyond early adopters
    - How much customer enablement or partner training is needed per deployment?
  - - Legacy integration and fixed-system capex
    - Negative
    - Now to medium term
    - Long payback and WMS/ERP friction can delay adoption
    - What is the median deployment timeline and integration burden by workflow?
  - - Safety, validation, and oversight
    - Negative
    - Ongoing
    - Certification and human-robot safety work remain gating tasks
    - Who bears safety validation cost between Mech-Mind, integrator, and end customer?
  notes: The table combines survey evidence, industry-trend commentary, and regulatory guidance. It is meant to show why demand is real but still converts workflow by workflow rather than automatically at the level implied by top-down TAM slides.
