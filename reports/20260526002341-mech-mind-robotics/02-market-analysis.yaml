  evidenceGaps:
  - type: missing-source
    severity: material
    topic: robot-guidance-tam
    missingEvidence: A direct public market study that isolates industrial 3D robot guidance / AI-vision TAM, SAM, and SOM by workflow or end market.
    whyItMatters: Without a standalone category benchmark, underwriting must triangulate across adjacent markets and may overstate the revenue pool Mech-Mind can actually capture.
    diligencePath: Request bottoms-up pipeline or bookings by workflow, and locate any paid analyst coverage that explicitly sizes 3D robot-guidance software and camera attach rates.
    relatedQuestionRefs:
    - QM010
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: workflow-roi-and-attach-rate
    missingEvidence: Workflow-level ROI, deployment cycle time, win rate, and attach-rate data for Mech-Mind across automotive, electronics, and logistics.
    whyItMatters: Those metrics determine whether a large adjacent TAM converts into repeatable software-rich revenue or stays trapped in low-volume integration projects.
    diligencePath: Ask management for payback periods, gross-margin mix by software versus hardware, integrator attach rates, and pilot-to-production conversion by workflow.
    relatedQuestionRefs:
    - QM025
    relatedTableRefs:
    - TM004
  - type: private-evidence-only
    severity: minor
    topic: regional-and-vertical-revenue-mix
    missingEvidence: Revenue or bookings split by China versus overseas and by automotive, electronics, and logistics.
    whyItMatters: The company’s localization footprint suggests global ambition, but public evidence still does not show where revenue concentration or cyclicality is highest.
    diligencePath: Request regional bookings, installed-base concentration, and top-vertical mix from management or investor materials.
    relatedQuestionRefs:
    - QM025
