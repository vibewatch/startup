- id: capital-formation-and-adequacy
  title: Capital Formation, Valuation Path, and Adequacy
  body: 'Fundraising is the best-documented part of the file. Officially, Mech-Mind says it has completed a Series C+ round and raised $300 million in total. CB Insights shows a lower $222.36 million cumulative total over 14 rounds, but it also lists the key checkpoint the user asked us to verify: an August 2022 Series D of $38 million at an $858 million valuation. Later sources are stronger on round size than on valuation. Marketscreener and multiple Chinese outlets report an August 2025 Series E-II of about RMB500 million, with a syndicate spanning Zhongshan Broad-Ocean Motor, CICC Porsche, Haihe, Hebei Structural Reform, Shanghe, Nanxiang, Tianjin Venture Capital, China Growth Capital, and Xiong''an-linked funds. By late 2025, several media outlets described cumulative funding as roughly or above RMB2 billion. That is enough to say the company entered the pre-IPO window with substantial balance-sheet support, but not enough to compute runway. We found no reviewed disclosure for cash on
    hand, monthly burn, debt, or project-finance obligations. We also found no authoritative public source that cleanly confirms a post-2022 valuation above $1 billion; low-reputation pre-IPO commentary points to about RMB8 billion, but that remains a reported estimate rather than a verified step-up. So the capital story is strong, yet the valuation path after the 2022 Series D is still partly opaque.'
