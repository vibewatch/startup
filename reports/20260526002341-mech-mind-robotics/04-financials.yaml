- id: TI003
  title: Unit economics table
  columns:
  - Driver
  - Public evidence
  - Likely effect
  - Confidence
  - Diligence ask
  rows:
  - - Hardware content
    - 3D cameras, laser profilers, and robot stations are core products
    - Lowers gross margin versus pure software and may require inventory or supplier management
    - Medium
    - Show product BOM, supplier concentration, and inventory turns
  - - Software reuse
    - No-code / visual programming and reusable vision stack across many use cases
    - Raises contribution margin as applications repeat
    - Medium
    - Disclose software attach rate and gross margin by module
  - - Deployment and maintenance labor
    - Official lifecycle support plus Jiemian service-cycle disclosure
    - Creates labor-heavy COGS and implementation overhead
    - Medium
    - Provide implementation hours, field-service headcount, and support ratio
  - - Standardization across robot brands
    - Xueqiu says standard products adapt to 20+ robot brands
    - Improves scalability and reduces custom engineering per project
    - Low
    - Show average customization hours by deployment wave
  - - International support footprint
    - 50-country deployment claim and overseas revenue share commentary
    - Adds local support, travel, and working-capital burden
    - Low
    - Disclose regional gross margin and overseas service cost
  notes: The public record is strong enough to identify cost drivers, but not to calculate true per-cell gross margin, CAC, or payback.
