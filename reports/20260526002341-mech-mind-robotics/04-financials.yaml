- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Public status
  - Why it matters
  - Best public proxy
  - Diligence path
  rows:
  - - Revenue / ARR
    - Not officially disclosed
    - Prevents revenue-multiple or growth-quality analysis
    - Installed base, order growth, and customer count proxies only
    - Request audited historical revenue by product and geography
  - - Gross margin / BOM
    - Not disclosed
    - Blocks unit-economics and scale-margin analysis
    - Hardware-software-service mix plus 2021 R&D and support disclosures
    - Request gross margin by product line and service attach
  - - Cash balance / burn / runway
    - Not disclosed
    - Prevents adequacy and next-round trigger analysis
    - Large cumulative funding only
    - Request monthly burn, cash on hand, and 24-month forecast
  - - Customer concentration / renewal
    - Not disclosed
    - Critical for channel and revenue durability underwriting
    - 100+ Fortune 500 clients and head-customer risk commentary
    - Request top-10 customer share and renewal / expansion rates
  - - Realized pricing / discounting
    - Not disclosed
    - Prevents normalized ASP and margin modeling
    - Historical 2021 relative pricing signal only
    - Request current quotes, channel discounts, and maintenance terms
  - - Debt / contingent liabilities
    - Not disclosed
    - Could change enterprise value and IPO readiness
    - Registry intermediaries mention filings but not public schedules
    - Request debt, guarantees, litigation, and import-dependency disclosure
  notes: The biggest gap is not whether Mech-Mind has traction; it is that private-company disclosure stops before investors can build a conventional IPO model.
