- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Public evidence
  - Likely mechanism
  - Current status
  - Quality
  - Diligence ask
  rows:
  - - Industrial 3D cameras / profilers
    - Official Mech-Eye pages and product stack
    - Hardware sale through integrators or automation projects
    - Clearly offered
    - Primarily one-time unless replenishment repeats
    - Provide ASP, BOM, and hardware gross margin by product family
  - - Vision software licenses
    - Official Mech-Vision and Mech-Viz pages
    - Per-cell, per-site, or project software license plus updates
    - Clearly offered
    - Potentially recurring but structure undisclosed
    - Disclose license term, maintenance attach rate, and renewal rate
  - - Deployment / commissioning services
    - Official about and cooperation pages mention consulting, design, training, deployment, maintenance
    - Service revenue attached to installation and go-live
    - Clearly implied
    - Useful for landing revenue but likely lower margin
    - Break out billable services share and utilization
  - - Partner / channel economics
    - Official materials repeatedly target integrators and value providers
    - Channel discounting, resale margins, or solution-delivery revenue share
    - Implied
    - Can expand reach but reduce realized price
    - Show partner discount bands and channel mix
  - - Embodied AI / robot-station systems
    - Official robot-station product pages and bin-picking solution pages
    - Higher-ASP bundled solution sale with hardware, software, and deployment
    - Offered
    - Could boost revenue per project but increases delivery complexity
    - Provide order count, average system value, and service attach rate
  notes: Public evidence supports a bundled hardware-software-service model, but not the realized mix of one-time versus recurring revenue.
