- id: TI002
  title: Pricing / monetization table
  columns:
  - Question
  - Public answer
  - Best proxy
  - Risk to underwriting
  - Diligence ask
  rows:
  - - List pricing published?
    - No public list price found
    - Official pages mention competitive pricing only
    - No way to benchmark realized ASPs or discounting
    - Collect current quotes and distributor price sheets
  - - Relative price versus foreign peers?
    - Historical only
    - Jiemian said 2021 pricing was about half of foreign mainstream competitors
    - Signal may be stale or promotion-specific
    - Compare current quotes to Cognex / Keyence / local peers
  - - What is sold together?
    - Bundle likely
    - 2021 reporting and official product stack suggest camera + vision + programming + service packages
    - Bundle obscures software-only economics
    - Provide SKU-level revenue split by hardware, software, service
  - - Support cadence disclosed?
    - Partly
    - Mature projects in weeks, new applications in months in 2021 reporting
    - Deployment intensity can compress gross margin
    - Show current average implementation and support hours
  - - Recurring element visible?
    - Unclear
    - Maintenance, training, and software updates likely recur but terms are undisclosed
    - Hard to assess revenue durability or net retention
    - Disclose maintenance renewal and software update pricing
  notes: Pricing evidence is mostly relative or historical; no reviewed source disclosed current price lists, discount ladders, or maintenance terms.
