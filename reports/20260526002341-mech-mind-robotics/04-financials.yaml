- id: TI004
  title: Capital adequacy table
  columns:
  - Topic
  - Public fact
  - What is known
  - Financial implication
  - Diligence ask
  rows:
  - - Official cumulative funding
    - USD 300M
    - Official about page says Series C+ closed with total funding of USD300M
    - Suggests substantial capital base
    - Reconcile official figure to cap table and proceeds by round
  - - Database cumulative funding
    - USD 222.36M
    - CB Insights lists 14 rounds and lower cumulative funding
    - Vendor disagreement complicates comparables and dilution analysis
    - Provide round-by-round reconciliation schedule
  - - Latest financing
    - CNY 500M
    - Multiple 2025 sources describe an Aug 2025 Series E-II / new round near RMB500M
    - Meaningfully extends financing runway qualitatively
    - Provide closing date, primary vs secondary split, and money in bank
  - - Verified 2022 valuation point
    - USD 858M post-money proxy
    - CB Insights lists Aug 2022 Series D at $38M and $858M valuation
    - Useful anchor for valuation path
    - Provide board-approved valuation history since 2022
  - - Late-2025 cumulative media figure
    - ≈RMB 2B+
    - Several media articles describe cumulative funding around or above RMB2B
    - Consistent with a heavily financed pre-IPO company
    - Disclose exact cumulative equity and any debt raised
  - - Cash / burn / runway
    - null
    - No reviewed source disclosed cash balance, burn, runway months, debt, or project-finance obligations
    - Runway cannot be computed from public evidence
    - Provide monthly burn, net cash, debt schedule, and minimum-cash covenant
  notes: Capital is clearly substantial, but data vendors disagree on cumulative totals and none of the reviewed sources disclose cash, burn, runway, or debt.
