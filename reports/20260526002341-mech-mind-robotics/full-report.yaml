      - number: '1.3'
        title: Capital Formation, Investors, and Stage Signals
        blocks:
          - type: paragraph
            body: >-
              Mech-Mind’s financing history is substantial, but the source pack makes clear that public-stage labels lag
              the underlying company. Official Chinese materials say cumulative financing now exceeds RMB 2 billion and
              name a venture roster that includes IDG Capital, Meituan, Sequoia China, Source Code Capital, Intel
              Capital, and Qiming Venture Partners. Independent Chinese reporting fills in the dated milestones: Aiqicha
              records Pre-A, A/A+, B, B+, and an earlier 2021 C round; 36Kr’s September 2021 coverage adds the near-RMB
              1 billion C-series financing led by Meituan and IDG; and the 36Kr project page records D, D++, and E-round
              labels through 2025. MarketScreener then reports a nearly RMB 500 million syndicate financing in August
              2025, while Hong Kong financial media say the company confidentially filed for a Hong Kong IPO in
              September 2025 with a targeted USD 200 million raise. The key diligence point is that not every public
              dataset updated in parallel. The English official about page still says Series C+ and USD 300 million
              total funding, and Tracxn still presents a Series C label with only USD 200 million across six rounds.
              That makes the right canonical stage description “late-stage private company with public evidence of
              2024–2025 D/E financing steps and IPO preparation,” not “current Series C company.”
