  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and Competitive Classes
        blocks:
          - type: paragraph
            body: >-
              Mech-Mind does not sit in a single tidy peer group. The closest alternatives break into four practical
              classes. First are incumbent machine-vision vendors such as Cognex, Keyence, Omron, and ISRA Vision that
              already sell trusted automation, inspection, and sensing products into large factories. Second are focused
              3D-guidance specialists such as Photoneo, Roboception, and Pickit that attack bin picking, depalletizing,
              and related handling workflows with narrower stacks. Third are platform-layer substitutes such as
              Intrinsic, which package skills, simulation, and robot control abstractions rather than a Mech-Mind-style
              one-vendor stack. Fourth are robot-platform ecosystems such as Universal Robots, where hardware,
              marketplace partners, and integrators can absorb some of the same buyer budgets. Mech-Mind’s public
              materials show why it is still differentiated inside that crowd: it markets one Eye-Brain-Hand offer
              across cameras, robot guidance, deep learning, inspection, and prebuilt workcells. The competitive
              question is therefore not whether substitutes exist—they clearly do—but whether Mech-Mind’s integrated
              workflow packaging is valuable enough to offset the incumbent distribution, ecosystem, and pricing
              advantages around it.
