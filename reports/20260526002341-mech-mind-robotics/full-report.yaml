  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / component
      - Role in stack
      - Key dependency
      - Main risk
    rows:
      - - Mech-Eye area-scan cameras
        - Capture wide-field 3D point clouds for guidance, localization, and assembly
        - Optics, structured-light imaging, ambient-light handling, and model selection by standoff distance
        - Hardware is mature, but performance still depends heavily on material properties and deployment conditions
      - - Mech-Eye laser profilers
        - Generate line-scan depth data for inline metrology and defect inspection
        - Stable encoder/control integration, HDR settings, and ROI tuning
        - Inspection deployments can still be sensitive to setup, profile quality, and software parameterization
      - - Mech-Vision perception layer
        - Runs 3D processing, matching, deep learning steps, robot communication, and production deployment
        - Project-step configuration, datasets, parameter recipes, and camera input quality
        - Poor ROI, thresholding, or data flow can produce no-result, timeout, or invalid-output conditions
      - - Mech-DLK learning layer
        - Manages labeling, training, validation, deployment, and cascading for hard-recognition tasks
        - Good training data, version control, and integration into Mech-Vision or custom software
        - Public metrics are strong marketing signals but not independently benchmarked across workloads
      - - Mech-Viz planning / control layer
        - Abstracts robot programs into flow charts with simulation, collision checks, and grasp planning
        - Robot-brand adapters, controller options, TCP setup, and motion-planning constraints
        - Singularities, invalid pick points, or collisions can still require tuning and vendor support
      - - Standard interface + brand adapters
        - Connects Mech-Mind outputs to ABB, FANUC, KUKA, UR, Yaskawa, Kawasaki and others
        - Supported controller versions, required controller software options, and brand-specific manuals
        - Breadth is real but version mismatches or missing docs can slow commissioning
      - - SDK / ROS / GenICam surface
        - Enables custom integration, parameter control, and point-cloud access from external software
        - SDK compatibility, Ubuntu/ROS packages, OpenCV/PCL dependencies, and network configuration
        - Open interfaces reduce lock-in but shift some implementation burden to the integrator
      - - Eye-Brain-Hand extension
        - >-
          Adds embodied reasoning, natural-language-driven interaction, and dexterous manipulation on top of the
          classical stack
        - Launch-stage hardware/software maturity, Mech-GPT performance, and real deployment references
        - Public proof is still shallower than for the older camera-plus-vision-plus-planning layers
    notes: >-
      This architecture table reflects the externally observable operating model assembled from product pages, manuals,
      SDK docs, and partner integration evidence rather than an internal system diagram.
