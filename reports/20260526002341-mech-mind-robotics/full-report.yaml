  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and module map
        blocks:
          - type: paragraph
            body: >-
              Mech-Mind's product surface is best understood as a layered industrial automation stack sold around
              concrete workflows such as bin picking, machine tending, localization, assembly, depalletizing,
              palletizing, and inline inspection. The public 2026 surface shows a broad but still coherent portfolio:
              Mech-Eye industrial 3D cameras, Mech-Eye 3D laser profilers, Mech-Vision, Mech-Viz, Mech-DLK, Mech-MSR,
              Mech-Station InstaDepal, and the newer embodied-intelligence "Eye-Brain-Hand" station. The core commercial
              logic is that the camera and profiler families collect usable 3D data, Mech-Vision turns that data into
              pose or inspection results, Mech-Viz plans and simulates robot motion, and Mech-DLK supplies trainable AI
              models when classical vision steps are not enough. That stack design is a real differentiator because it
              lets Mech-Mind sell an integrated workflow instead of a sensor alone. The main caveat is product-boundary
              clarity: current official English and Chinese surfaces do not expose Mech-Recon as a standalone 2026 page,
              so diligence still needs management to explain whether it remains a legacy term, a feature family, or an
              internally scoped module rather than an externally sold SKU.
