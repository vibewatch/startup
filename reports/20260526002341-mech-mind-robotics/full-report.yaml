      - number: '8.4'
        title: Bull / Base / Bear Ranges and Valuation Stance
        blocks:
          - type: paragraph
            body: >-
              Because the company has not publicly disclosed the operating inputs required for a conventional IPO model,
              scenario work is more honest than a single-number target. In the bull case, disclosed revenue scale,
              durable overseas deployments, and a software-like margin structure would allow investors to look through
              current opacity and support a meaningfully higher public or pre-IPO mark. In the base case, Mech-Mind
              remains a real unicorn with credible technology and financing support, but multiple expansion stays
              limited until the disclosure package improves. In the bear case, an IPO or next financing reveals a
              business mix that looks more like lower-multiple automation hardware or services than software. That would
              compress the underwriting band sharply even if the company remains strategically relevant. The key point
              is that current public evidence supports a broad zone around the unicorn floor and 18C scale thresholds,
              not a precise ceiling. That is why the stance here is stretched rather than broken: the story may still
              work, but the public proof package is not yet rich enough to pay aggressively for the upside narrative.
            claimRefs:
              - CV032
              - CV033
              - CV041
              - CV042
              - CV044
              - CV045
              - CV047
          - type: table
