  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation Boundary and What Public Data Can Actually Underwrite
        blocks:
          - type: paragraph
            body: >-
              Mech-Mind is clearly no longer a speculative seed-stage robotics name. Public evidence now supports a
              firmer floor than that: the company completed another sizable financing in August 2025, is described by
              multiple public sources as a unicorn, and is being discussed as a confidential Hong Kong IPO candidate.
              That combination is enough to underwrite late-stage status, continuing capital access, and serious
              investor interest in the story. It is not enough to underwrite a precise fair value. Public sources still
              do not disclose audited revenue, gross margin, burn, retention, customer concentration, or cap-table
              terms. Without those items, the valuation exercise should be framed as boundary-setting rather than
              point-estimation. The right current recommendation is therefore research-more. The thesis is investable
              enough to keep working on, but not documented enough to justify paying up on narrative alone. Public
              evidence can support a broad unicorn-level band and venue optionality; it cannot yet support a conviction
              buy or a clean IPO price target.
            claimRefs:
