          type: competitive
        - id: n6
          label: Gross-margin pressure
          type: financial
        - id: n7
          label: BIS / trade-policy shock
          type: regulatory
        - id: n8
          label: Roadmap or BOM delay
          type: product
        - id: n9
          label: IPO timing uncertainty
          type: capital-markets
        - id: n10
          label: Funding / valuation pressure
          type: financial
        - id: n11
          label: Reduced strategic flexibility
          type: strategy
      edges:
