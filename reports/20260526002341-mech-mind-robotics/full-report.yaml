  - id: FU003
    title: Customer proof matrix
    type: matrix
    summary: >-
      The matrix separates real industrial fit from actual named-account verification, which is the biggest public-proof
      weakness in this chapter.
    data:
      columns:
        - Direct naming
        - Production evidence
        - Independent corroboration
        - Underwriting verdict
      rows:
        - label: BMW Group
          values:
            - label: 'No'
              tone: risk
              detail: Reviewed Mech-Mind pages do not name BMW
            - label: BMW automation yes
              tone: neutral
              detail: UR / Hexagon-linked sources show BMW robotics activity
            - label: Adjacent only
              tone: warning
              detail: Fetched sources cite other vendors, not Mech-Mind
            - label: Unverified for Mech-Mind
              tone: risk
              detail: Do not underwrite as a named customer
        - label: SAIC / SAIC-GM
          values:
            - label: 'No'
              tone: risk
              detail: No fetched source names Mech-Mind with SAIC
            - label: SAIC automation yes
              tone: neutral
              detail: 2026 battery-line stories show real production automation
            - label: Fetched sources name another vendor
              tone: warning
              detail: Zhiyuan / Nengzai are named instead
            - label: Unverified for Mech-Mind
              tone: risk
              detail: Cannot treat as a public reference account
        - label: Geely / 吉利
          values:
            - label: 'No'
              tone: risk
              detail: No fetched source names Geely with Mech-Mind
            - label: No direct public proof
              tone: risk
              detail: Only sector fit is visible
            - label: None in fetched set
              tone: risk
              detail: Requires NDA reference checks
            - label: Publicly unverified
              tone: risk
              detail: Do not infer from automotive vertical presence
        - label: CATL / BYD / Foxconn / JD Logistics
          values:
            - label: 'No'
              tone: risk
              detail: Names absent from fetched customer-facing pages
            - label: Sector fit only
              tone: warning
              detail: Battery, electronics, and logistics use cases match buyer profile
            - label: None in fetched set
              tone: risk
              detail: No direct naming or customer-side evidence
            - label: Publicly unverified
              tone: risk
              detail: Use only as diligence targets, not proof
        - label: 100+ Fortune 500 cohort
          values:
            - label: Aggregate only
              tone: warning
              detail: Official claim without roster
            - label: Yes at aggregate level
              tone: positive
              detail: Official pages support broad industrial reach
            - label: Low named support
              tone: warning
              detail: Third-party sources do not map the cohort to logos
            - label: Useful scale signal only
              tone: warning
              detail: Not a substitute for named references
        - label: Anonymous application customers
          values:
            - label: 'No'
              tone: risk
              detail: Customer names are withheld
            - label: 'Yes'
              tone: positive
              detail: Official case pages show production-cell tasks
            - label: Mostly company-only
              tone: warning
              detail: Independent corroboration is limited
            - label: Good use-case proof, weak account proof
              tone: warning
              detail: Useful for product-market fit, not concentration analysis
    approximationNotes: Matrix cells summarize proof quality, not revenue or deployment volume.
