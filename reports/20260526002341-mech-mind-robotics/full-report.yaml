    title: Risk transmission map
    type: dag
    layout: standard
    summary: >-
      External shocks do not hit Mech-Mind in isolation: weak China demand, export-control frictions, and incumbent
      discounting all flow through longer pilots, lower conversion, and higher financing pressure before they appear as
      valuation risk.
    data:
      nodes:
        - id: n1
          label: China PMI / demand weakness
          type: macro
        - id: n2
          label: Customer capex caution
          type: customer
        - id: n3
