          - type: callout
            title: Official reliability mitigants are meaningful but not independently proven
            body: >-
              IP65/IP67 hardware, drift correction, and 100,000-hour MTBF claims are better than a demo-only story, yet
              the retained public pack contains no customer-side uptime cohort or field-failure dataset. That keeps
              reliability risk in the “mitigated but still under-verified” bucket.
            calloutType: insight
