      - number: '7.3'
        title: Operational reliability, integration, and customer opacity
        blocks:
          - type: paragraph
            body: >-
              The operational question is not whether Mech-Mind can demo advanced perception—its own material shows
              strong capabilities on reflective metals, transparent containers, thin-walled parts, and inline
              inspection—but how often those results survive brownfield variability at scale. The company’s reliability
              blog explicitly describes drift, vibration, dust, ambient light, and continuous runtime as conditions that
              can degrade camera accuracy or cause failure over time. Other official pages acknowledge that reflective
              surfaces, refraction, occlusion, and changing geometries can destabilize recognition and picking, turning
              perception problems into downtime, rework, and missed cycle times. Mech-Mind’s mitigants are meaningful:
              IP65/IP67 hardware, MTBF claims up to 100,000 hours, auto-correction for drift, simulation tools, and
              no-code deployment workflows. But those mitigants are mostly company-authored and there is no public
              field-cohort data showing uptime, failure rates, or pilot-to-production conversion by vertical. That gap
              matters because customer exposure is still opaque. Official pages name automotive, logistics, EV
              batteries, heavy industry, electronics, and food as core deployment areas, yet no public source discloses
              top-customer dependence, vertical revenue split, renewal rates, or attach rates by robot brand.
            claimRefs:
