      - number: '2.2'
        title: Sizing Lenses and Regional Dynamics
        blocks:
          - type: paragraph
            body: >-
              Public market data is directionally positive but not cleanly additive. IFR shows a very large and
              still-growing global industrial-robot installed base, yet Mech-Mind cannot capture all robot hardware
              spend; the monetizable wedge is a narrower vision-and-guidance layer riding on that base. The closest
              adjacent markets in the public source pack are warehouse automation, warehouse robotics, and machine
              vision. They are all large enough to support meaningful category leaders, but they differ in scope,
              forecast window, and methodology, so preserving their spread is more honest than pretending they resolve
              to one consensus TAM. China matters disproportionately in this chapter because it is simultaneously the
              largest industrial-robot market, the leading electronics-installation market, and an increasingly domestic
              supplier-led environment. At the same time, public sources do not agree on how to measure robot density,
              which is a reminder that regional benchmarks need denominator discipline. The practical conclusion is that
              Mech-Mind benefits from a deep automation base in China and from globally expanding machine-vision and
              warehouse-automation demand, but investors still need a constrained SAM lens rather than a broad headline
              TAM.
