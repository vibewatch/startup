      - number: '5.2'
        title: Architecture and operating workflow
        blocks:
          - type: paragraph
            body: >-
              The operating model runs from sensing to action in a way that is more explicit than most industrial-vision
              vendors publish. Mech-Eye cameras and laser profilers capture depth data or profile data; Mech-Vision
              provides the no-code perception environment that handles 3D processing, matching, deep-learning-backed
              recognition, robot communication, and production deployment; Mech-Viz then simulates and plans motion
              using collision detection, picking strategy, multiple TCPs, and robot-brand abstraction; and Mech-DLK
              handles dataset management, labeling, training, validation, cascading, and deployment for harder
              recognition or defect-inspection cases. Chinese product pages are especially concrete here, claiming 1000+
              robot models, 1-2 day communication tuning, and minutes-level changeover workflows through the production
              interface. Eye-Brain-Hand is the extension layer above this classical stack: it bundles Mech-Eye,
              Mech-GPT, and Mech-Hand for more generalized embodied workflows, and AW 2026 evidence shows the concept
              moving into transparent-object handling, humanoid shelf picking, and standardized depalletizing cells. The
              result is a credible architecture in which camera hardware, AI inference, and robot execution are meant to
              land as one deployment package.
