            title: China is both a demand center and a market-definition problem
            body: >-
              China is clearly the single most important industrial-robot market in the source pack, but the public data
              also shows how easily investors can overstate precision: installation, density, and domestic-share figures
              are directionally supportive yet not always methodologically aligned.
            calloutType: insight
            claimRefs:
