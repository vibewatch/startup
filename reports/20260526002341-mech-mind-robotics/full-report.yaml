      - number: '7.5'
        title: People, mitigation maturity, and kill criteria
        blocks:
          - type: paragraph
            body: >-
              Execution risk sits above the product layer. Public material still centers heavily on founder-CEO Shao
              Tianlan and a relatively small set of visible leaders, while board composition, audit readiness,
              internal-control maturity, and succession planning remain largely private. The company does have visible
              mitigants: 600+ employees, a self-owned camera factory, global subsidiaries, partner training, and a
              strategy of validating products in China before international rollout. Those are better than a pure
              demo-stage story, and they help explain why Mech-Mind has scaled internationally. But they do not
              eliminate the need for hard monitoring. The key investable questions are whether win rates hold against
              Cognex and Keyence in core workflows, whether support quality keeps pace with global deployments, whether
              China-demand softness prolongs PoC-to-production cycles, whether export-control or trade shocks slow
              roadmap execution, and whether the rumored IPO ever converts into a publicly disclosed filing with
              auditable metrics. Table R005 translates those uncertainties into explicit triggers. If management cannot
              provide concentration, win-loss, BOM, and uptime data in diligence, the correct stance is not to assume
              the mitigants work; it is to preserve a high residual-risk rating.
