  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The chapter recommendation follows a simple chain: fresh capital plus unicorn confirmation, then disclosure gaps,
      therefore research-more rather than buy.
    data:
      nodes:
        - id: funding
          label: 2025 financing confirmed
        - id: unicorn
          label: Unicorn status corroborated
        - id: gaps
          label: Core financial disclosure still missing
        - id: ipo
          label: HK IPO optionality exists
        - id: rec
          label: Research-more
      edges:
        - from: funding
          to: unicorn
        - from: unicorn
          to: gaps
        - from: gaps
          to: ipo
        - from: ipo
          to: rec
    approximationNotes: This flow is the chapter’s underwriting logic, not a company-issued framework.
