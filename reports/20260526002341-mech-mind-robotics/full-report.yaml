      - number: '4.4'
        title: IPO Considerations and Disclosure Gaps
        blocks:
          - type: paragraph
            body: >-
              The Hong Kong IPO story is credible as a market report, but not yet a filing-backed fact set.
              Bloomberg-origin coverage reproduced by Yahoo Finance, The Standard, Ifeng, and HKCD said Mech-Mind was
              considering or had confidentially filed for a Hong Kong listing targeting roughly $200 million, while also
              stressing that timing and size were not final and that the company had not publicly confirmed the plan.
              That leaves investors with an unusual mismatch: there is enough evidence to believe capital-markets
              preparation is underway, but not enough disclosure to underwrite the business like a real IPO candidate.
              No reviewed official or filing-type source disclosed annual revenue, ARR, gross margin, EBITDA, net
              income, cash, burn, debt, deferred revenue, or customer concentration. One Eastmoney pre-IPO commentary
              article circulated a 2024 revenue figure above RMB800 million and a net margin above 20%, but we found no
              corroborating official document, prospectus, or mainstream filing-type evidence for those numbers.
              Registry intermediaries indicate Chinese filings and financial accounts exist somewhere in the underlying
              system, but they were not publicly available in the materials we could review. Until a prospectus or
              audited statements appear, the right financial verdict is that Mech-Mind has credible product-market
              traction and ample recent financing, but still too many private-only metrics for precise valuation
              underwriting.
