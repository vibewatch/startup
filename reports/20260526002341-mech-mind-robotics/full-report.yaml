    title: Valuation / return range
    type: range
    layout: standard
    summary: Current public evidence supports a broad range around the unicorn floor rather than a narrow target price.
    data:
      items:
        - label: Bear supportable zone
          low: 700
          high: 1000
          unit: USD m illustrative
        - label: Base supportable zone
          low: 1100
          high: 1600
          unit: USD m illustrative
        - label: Bull supportable zone
