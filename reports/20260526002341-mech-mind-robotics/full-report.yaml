        title: Exhibits
        blocks:
          - type: callout
            title: Incumbent channel power is the single largest commercial risk
            body: >-
              Mech-Mind’s core workflows are real, but so are the overlapping offers from Cognex, Keyence, and other
              incumbent ecosystems. Without public win-loss data, investors should assume installed trust and
              discounting power remain a structural headwind rather than a solved moat question.
