              Require one package that ties together top-customer concentration, renewal behavior, competitive
              evaluations against Cognex and Keyence, BOM exposure to export-controlled inputs, and post-launch uptime
              by flagship workflow. Those five disclosures would collapse more risk uncertainty than another product
              demo.
