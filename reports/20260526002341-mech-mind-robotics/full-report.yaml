      - number: '8.2'
        title: Financing Step-Up, Unicorn Confirmation, and the Limits of the 2022 Baseline
        blocks:
          - type: paragraph
            body: >-
              The strongest accessible financing fact is the August 2025 round: multiple English and Chinese reports
              independently place it at about CNY500 million and tie the proceeds to further investment in Mech-Mind’s
              embodied-intelligence eye-brain-hand stack and global commercialization. Accessible public coverage also
              confirms a 2022 Series D round of CNY500 million, giving a visible late-stage starting point for
              comparison. The more important valuation development is what happened between those points. By 2025-2026,
              China Daily’s Hurun-related coverage explicitly placed Mech-Mind above the $1 billion threshold, while
              Xinhua and State Council reporting separately described the company as a Chinese unicorn. That is enough
              to verify a directional step-up from the 2022 financing era into explicit unicorn territory. What public
              pages do not cleanly settle is the exact 2022 post-money figure often cited in subscription databases. For
              valuation work, the prudent read is that the company has clearly crossed into unicorn framing, but the
              exact slope of the step-up remains partly hidden behind private-market opacity.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV010
      - number: '8.3'
        title: Comparable Frame and IPO Route Options
        blocks:
          - type: paragraph
            body: >-
              The comparable exercise only works if it is treated as framing, not as a spreadsheet that magically solves
              Mech-Mind’s private-market price. Symbotic is the closest high-growth warehouse-automation reference, but
              it is more installation- and systems-heavy than Mech-Mind. Cognex is cleaner on disclosure and closer to
              machine vision, but narrower in scope and more inspection-centric. Zebra shows what diversified automation
              hardware can trade at when investors pay lower sales multiples, while Teradyne and Universal Robots show
              how hard it is to extract a clean robotics multiple from a larger conglomerate structure. Private rounds
              such as Mind Robotics show that investors still pay up for industrial AI robotics, but those rounds also
              come with sparse disclosure and should not be treated as proof of durable public-market support. On exit
              routes, HKEX Chapter 18C is the most plausible disclosed pathway because it explicitly accommodates
              specialist technology companies and includes robotics within advanced hardware and software. Even there,
              public sources still do not reveal whether Mech-Mind would screen as commercial or pre-commercial, so
              venue plausibility should not be mistaken for underwriting certainty.
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
