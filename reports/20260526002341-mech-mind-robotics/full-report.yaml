chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Footprint, and Product Architecture
        blocks:
          - type: paragraph
            body: >-
              Mech-Mind should be treated first as an enabling-platform company for embodied intelligence, not as a
              single-robot SKU vendor. Official English and Chinese company pages agree that the business was founded in
              2016 and centers on an “Eye-Brain-Hand” stack: industrial 3D cameras as the eyes, AI software and
              multimodal reasoning as the brain, and dexterous end-effectors as the hands. KrASIA and AsiaICT reinforce
              the same framing, adding that the company’s go-to-market logic is to standardize these components so
              integrators and end users can deploy across many manufacturing and logistics tasks without bespoke
              redevelopment for every workflow. The operating-footprint story also needs precision. Chinese company
              pages anchor Beijing as the R&D center and Shanghai as the sales and delivery base, while English and
              Chinese contact pages show a broader network spanning Germany, Japan, Korea, and the US plus multiple
              Chinese cities. Some directories and IPO rumor coverage foreground Xiong’an or Hebei addresses, but those
              are better read as legal-entity or association addresses than as the sole operating headquarters. For
              later chapters, the reusable canonical identity is a late-stage private Chinese robotics platform company
              with Beijing and Shanghai operating importance, a globally distributed field footprint, and a standardized
              “Eye-Brain-Hand” product architecture.
