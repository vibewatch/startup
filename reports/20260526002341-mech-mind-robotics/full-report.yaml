  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Included Spend, and Substitutes
        blocks:
          - type: paragraph
            body: >-
              Mech-Mind should be analyzed as an industrial AI and 3D-vision infrastructure vendor rather than as a full
              robot OEM. Its own portfolio and third-party profiles consistently describe a stack of industrial 3D
              cameras, vision software, deep-learning tools, and no-code robot programming used for jobs such as bin
              picking, depalletizing, machine tending, precision assembly, and inspection. That means the company
              participates in the perception, planning, and deployment layer that sits on top of robot arms and
              workcells, not in every dollar of factory or warehouse automation capex. Included spend therefore covers
              3D sensors, vision and AI software, deployment tooling, workflow-specific configuration, and local
              integration support. Excluded spend includes most robot-arm hardware, conveyors, AS/RS steel, and
              unrelated plant IT. The closest substitutes are manual handling, simpler 2D vision, hard-coded robot
              cells, or fixed automation that avoids flexible 3D perception altogether, which is why the market boundary
              has to start from hard workflows rather than from the broadest published automation category.
            claimRefs:
