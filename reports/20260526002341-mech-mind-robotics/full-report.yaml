          - type: callout
            title: Chapter 18C creates a route, not certainty
            body: >-
              The robotics listing pathway exists, and multiple media sources report a confidential filing, but public
              evidence still does not show whether Mech-Mind meets the audited revenue or alternative threshold tests.
              Until that bridge is visible, the IPO should not be treated as de-risked liquidity.
            calloutType: risk
            claimRefs:
              - CR031
