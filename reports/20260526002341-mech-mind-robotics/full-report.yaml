  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: standard
    summary: >-
      The valuation debate is most sensitive to disclosure quality and business-mix evidence, not to another headline
      round by itself.
    data:
      items:
        - label: Audited revenue disclosure
          value: 3
          unit: relative upside turns
        - label: Gross margin above 60%
          value: 2
          unit: relative upside turns
        - label: HK listing underwritten cleanly
          value: 1
          unit: relative upside turns
        - label: Customer concentration above 30%
          value: -2
          unit: relative downside turns
        - label: Hardware/services mix dominates
          value: -3
          unit: relative downside turns
        - label: IPO window closes or pulls
          value: -2
          unit: relative downside turns
    approximationNotes: Sensitivity bars are qualitative weighting aids rather than a statistical factor model.
    claimRefs:
      - CV013
      - CV035
      - CV036
      - CV041
      - CV043
      - CV046
