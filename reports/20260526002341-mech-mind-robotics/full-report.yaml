  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk priority and transmission
        blocks:
          - type: paragraph
            body: >-
              Mech-Mind’s risk profile is not dominated by a single fatal flaw; it is driven by the interaction between
              competitive pressure, industrial-demand cyclicality, and disclosure gaps. Public evidence confirms that
              the company has real scale—24,000+ deployed units, 100+ Fortune Global 500 customers, and a footprint
              spanning nearly 50 countries—but the strongest proof of reliability and deployment maturity still comes
              from company-authored materials. At the same time, independent market sources place Cognex, Keyence, and
              other incumbents at the center of machine-vision buying decisions, while China PMI data stayed weak into
              2026 and external analysts warn that China’s slowdown and trade fragmentation are already reshaping
              manufacturing demand. The highest residual risk is therefore commercial-execution compression: long,
              integration-heavy industrial projects can slip precisely when end customers turn cautious, incumbents use
              installed-base and channel advantages, and management is asking investors to underwrite an IPO without
              public audited revenue, concentration, or win-loss disclosure. Figures R001 and R002 rank the risk stack
              and show how external shocks propagate into revenue, margin, and financing outcomes.
            claimRefs:
              - CR001
