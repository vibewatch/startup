              Ubuntu/OpenCV/PCL prerequisites, and manual material showing GenICam support, GigE-based acquisition, and
              third-party machine-vision interoperability. That said, the same documentation also implies that
              deployment still depends on controller options, SDK versions, recipe tuning, and on-site integration
