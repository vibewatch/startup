companyProfile:
  summary: >-
    Mech-Mind Robotics is a 2016-founded Chinese industrial AI company commercializing an Eye-Brain-Hand stack for robot
    guidance. It combines Mech-Eye sensing hardware, Mech-Vision and Mech-Viz software, and Mech-DLK deep-learning
    tooling to automate pick, place, depalletizing, machine-tending, assembly, and inspection workflows across factories
    and warehouses, but it still discloses far less than public-market investors would want on economics and control.
