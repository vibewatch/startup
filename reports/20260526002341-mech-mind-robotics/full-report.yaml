      - number: '8.5'
        title: Final Diligence Asks and Break Triggers
        blocks:
          - type: paragraph
            body: >-
              The remaining work is unusually concrete. Investors do not need another broad product demo to improve
              valuation confidence; they need the operating and governance package that converts a unicorn narrative
              into an underwritten price. Four asks dominate: audited 2024-2025 financials, order-book and
              customer-cohort data, a fully specified cap table including preference terms, and draft listing
              disclosures that clarify venue, classification, and use of proceeds. Without those items, recommendation
              confidence should remain capped at medium. The same discipline defines the break triggers. If the Hong
              Kong IPO is pulled, if the next round prices below the current unicorn frame, or if audited disclosure
              reveals a lower-margin hardware-services mix closer to lower-multiple automation peers, the thesis needs
              to be reset quickly. The valuation question is therefore less “Is Mech-Mind interesting?” and more “What
              fresh disclosure would make the current mark investable?” Until that answer arrives, the right posture is
              active diligence rather than passive belief.
            claimRefs:
              - CV035
