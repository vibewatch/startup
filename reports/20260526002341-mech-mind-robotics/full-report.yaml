      - number: '6.5'
        title: Durability, Retention, and Concentration Caveats
        blocks:
          - type: paragraph
            body: >-
              The biggest remaining customer-risk questions are durability and concentration. No fetched official or
              third-party profile source discloses NRR, GRR, churn, renewal rates, top-customer share, or top-10
              customer concentration. That does not mean the business lacks retention; it means the current public
              record does not let an investor measure it. The same problem applies to concentration. Automotive looks
              like the deepest public vertical, and China remains the company's validation base, but the revenue
              exposure of any one customer, vertical, or region is not publicly quantified.


              The implication is that public diligence can support a medium-confidence view that Mech-Mind has real
              cross-vertical deployments and a workable partner-led support model. It cannot support a high-confidence
              view on customer quality, renewal durability, or concentration risk without private evidence. For this
              chapter, the right conclusion is therefore bifurcated: adoption proof is real, but named-account
              underwriting remains incomplete. Any investment view should require reference calls, top-customer
              schedules, renewal data, and examples of successful multi-site or multi-product expansion before treating
              the aggregate customer claims as fully bankable.
