  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Pricing Signals
        blocks:
          - type: paragraph
            body: >-
              Public evidence points to a solution-led revenue model rather than a pure software subscription business.
              Mech-Mind sells an "Eye-Brain-Hand" stack that includes industrial 3D cameras, machine-vision software,
              robot-programming software, and related embodied-intelligence stations, then supports partners through
              consulting, solution design, training, deployment, and maintenance. That matters financially because the
              company is not merely licensing code: some revenue almost certainly comes from hardware, some from
              software licenses, and some from deployment or lifecycle service work attached to integrator-led projects.
              Official materials repeatedly emphasize partners and value providers, which suggests channel economics and
              implementation support are central to monetization. What is missing is actual contract structure. No
              reviewed source published list pricing, discount ladders, software maintenance rates, or the split between
              one-time deployment revenue and recurring support. The only explicit pricing proxy we found is historical:
              Jiemian reported in 2021 that Mech-Mind priced products at roughly half the level of foreign mainstream
              competitors. That is directionally useful but too stale for present underwriting. The right conclusion is
              that Mech-Mind likely monetizes a bundled automation cell or solution stack, with better long-term
              economics if software reuse and repeat deployments keep rising, but public data cannot yet isolate
              realized ASPs or recurring revenue quality.
