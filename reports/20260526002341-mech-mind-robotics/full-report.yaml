  - id: FR001
    title: Risk heatmap
    type: matrix
    layout: standard
    summary: >-
      The highest combined-risk quadrant is occupied by incumbent/channel pressure, export-control exposure, and
      customer-concentration opacity; macro and IPO uncertainty sit just below them because their transmission depends
      on disclosure that is still missing.
    data:
      columns:
        - Low likelihood
        - Medium likelihood
        - High likelihood
      rows:
        - label: Critical severity
          values:
            - Judicial / case spike beyond current public counts
            - IPO route fails to produce auditable metrics
            - Incumbent channel pressure; export-control/BOM shock
        - label: High severity
          values:
            - Founder / key-talent disruption
            - Customer concentration hidden inside logo breadth
            - China capex slowdown extending long sales cycles
        - label: Medium severity
          values:
            - Service-footprint stretch
            - Calibration drift / uptime proof gap
            - Reflective / transparent integration misses at scale
        - label: Low severity
          values:
            - One-off show-floor marketing miss
            - Minor policy clarification delay
            - Single-country office expansion delay
    claimRefs:
      - CR016
      - CR028
      - CR034
      - CR038
      - CR042
      - CR045
      - CR050
