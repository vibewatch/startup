- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Incumbent channel and pricing pressure
    - Named win-loss and discounting trend versus Cognex / Keyence
    - Three consecutive strategic losses in core workflows or >5pp gross-margin compression on new deals
    - Re-underwrite moat, lower growth assumptions, and demand competitive bid files
  - - Export controls / semiconductor access
    - Critical compute or camera component requires license or substitute
    - Shipment denial, >90-day delay, or forced redesign of core BOM
    - Pause roadmap assumptions and re-model product-cost / timing risk
  - - China macro slowdown and manufacturing cyclicality
    - PMI and order-conversion trend
    - Official or private manufacturing PMI remains <50 for three consecutive months while internal pipeline conversion weakens
    - Haircut China-led growth and extend sales-cycle assumptions
  - - IPO / capital-markets uncertainty
    - Progress from rumor to publicly supportable listing process
    - No public filing, no audited revenue bridge, or 12+ month slip versus management expectation
    - Remove IPO as a near-term catalyst and raise financing-risk weighting
  - - Customer concentration opacity
    - Availability of cohort and concentration disclosure
    - Management cannot provide top-10 customer, top-5 vertical, and renewal data in diligence
    - Maintain high risk rating and refuse to underwrite logo breadth as concentration diversification
  - - Field reliability and integration quality
    - Referenceable uptime and launch-performance evidence
    - No independently referenceable uptime data or repeated sub-95% performance in flagship applications
    - Require site visits, customer references, and implementation holdbacks before sizing exposure
  notes: Thresholds are diligence tools rather than public-company guidance; each converts a soft narrative into an observable underwriting test.
