chapter:
  number: 7
  title: Risks
  summary: Mech-Mind’s highest residual risks come from incumbent machine-vision competition, export-control and geopolitics exposure, long integration-heavy industrial sales cycles, and a China manufacturing backdrop that stayed soft into 2026. Official sources show real scale and real technical mitigants, but the public pack still lacks audited revenue, customer concentration, independent uptime, win-loss data, and BOM-level export-control disclosure. That makes IPO optionality and reliability claims supportive but not decisive, leaving a high residual-risk profile despite clear product strength.
sections:
- id: risk-priority-and-transmission
  title: Risk priority and transmission
  body: 'Mech-Mind’s risk profile is not dominated by a single fatal flaw; it is driven by the interaction between competitive pressure, industrial-demand cyclicality, and disclosure gaps. Public evidence confirms that the company has real scale—24,000+ deployed units, 100+ Fortune Global 500 customers, and a footprint spanning nearly 50 countries—but the strongest proof of reliability and deployment maturity still comes from company-authored materials. At the same time, independent market sources place Cognex, Keyence, and other incumbents at the center of machine-vision buying decisions, while China PMI data stayed weak into 2026 and external analysts warn that China’s slowdown and trade fragmentation are already reshaping manufacturing demand. The highest residual risk is therefore commercial-execution compression: long, integration-heavy industrial projects can slip precisely when end customers turn cautious, incumbents use installed-base and channel advantages, and management is asking
    investors to underwrite an IPO without public audited revenue, concentration, or win-loss disclosure. Figures R001 and R002 rank the risk stack and show how external shocks propagate into revenue, margin, and financing outcomes.'
