callouts:
- calloutType: risk
  title: Incumbent channel power is the single largest commercial risk
  body: Mech-Mind’s core workflows are real, but so are the overlapping offers from Cognex, Keyence, and other incumbent ecosystems. Without public win-loss data, investors should assume installed trust and discounting power remain a structural headwind rather than a solved moat question.
  claimRefs:
  - CR010
  - CR011
  - CR015
  - CR016
  - CR051
- calloutType: risk
  title: Chapter 18C creates a route, not certainty
  body: The robotics listing pathway exists, and multiple media sources report a confidential filing, but public evidence still does not show whether Mech-Mind meets the audited revenue or alternative threshold tests. Until that bridge is visible, the IPO should not be treated as de-risked liquidity.
  claimRefs:
  - CR031
  - CR032
  - CR034
  - CR035
  - CR044
- calloutType: insight
  title: Official reliability mitigants are meaningful but not independently proven
  body: IP65/IP67 hardware, drift correction, and 100,000-hour MTBF claims are better than a demo-only story, yet the retained public pack contains no customer-side uptime cohort or field-failure dataset. That keeps reliability risk in the “mitigated but still under-verified” bucket.
  claimRefs:
  - CR021
  - CR022
  - CR023
  - CR024
  - CR026
- calloutType: recommendation
  title: The highest-value data-room ask is a concentration and win-loss pack
  body: Require one package that ties together top-customer concentration, renewal behavior, competitive evaluations against Cognex and Keyence, BOM exposure to export-controlled inputs, and post-launch uptime by flagship workflow. Those five disclosures would collapse more risk uncertainty than another product demo.
  claimRefs:
  - CR042
  - CR050
  - CR051
  - CR052
