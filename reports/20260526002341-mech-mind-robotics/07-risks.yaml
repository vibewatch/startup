  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: regulatory-register-coverage
    missingEvidence: A full jurisdiction-by-jurisdiction matrix of product certification, export, and litigation exposure across all deployed markets.
    whyItMatters: The regulatory table is intentionally severity-ranked, so it may miss lower-frequency country obligations that still matter in diligence or in a refresh run.
    diligencePath: Request counsel-prepared country matrix covering product certification, export restrictions, distributor structure, and live disputes for every market with material revenue.
    relatedQuestionRefs:
    - QR011
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: blocking
    topic: ipo-threshold-proof
    missingEvidence: Audited revenue, profitability, and adviser analysis showing whether Mech-Mind qualifies as a Chapter 18C commercial or pre-commercial applicant.
    whyItMatters: Without audited metrics, the IPO route cannot be treated as a reliable liquidity or financing mitigation.
    diligencePath: Request the latest audit package, listing counsel memorandum, and board-approved IPO timeline with fallback financing plan.
    relatedQuestionRefs:
    - QR012
  - type: missing-source
    severity: material
    topic: independent-uptime-validation
    missingEvidence: Customer-side uptime, warranty-claim, and pilot-to-production conversion cohorts for flagship workflows such as reflective parts, transparent packaging, and EV-battery handling.
    whyItMatters: Company-authored reliability claims are directionally helpful but do not prove production-grade repeatability or support burden.
    diligencePath: Obtain reference calls, SLA reports, warranty statistics, and at least three customer-verified uptime cohorts by workflow.
    relatedQuestionRefs:
    - QR024
    relatedTableRefs:
    - TR002
  - type: private-evidence-only
    severity: blocking
    topic: customer-concentration
    missingEvidence: Top-10 customer revenue, top-5 vertical and geography concentration, renewal behavior, and channel attach rates by robot brand.
    whyItMatters: Logo breadth does not tell investors whether revenue is diversified or whether one automotive, logistics, or battery cohort dominates results.
    diligencePath: Request cohort revenue bridges, renewal dashboards, and account-level concentration tables before underwriting growth.
    relatedQuestionRefs:
    - QR025
    relatedTableRefs:
    - TR002
  - type: private-evidence-only
    severity: material
    topic: competitive-win-loss
    missingEvidence: Named competitive evaluations, discounting bands, and reasons won or lost versus Cognex, Keyence, and other incumbent alternatives.
    whyItMatters: The highest-severity commercial risk is incumbent channel power, but public sources do not reveal whether Mech-Mind actually wins on price, accuracy, support, or speed.
    diligencePath: Ask for the last 20 competitive bids, normalized by workflow, robot brand, ASP, and outcome.
    relatedQuestionRefs:
    - QR031
    relatedTableRefs:
    - TR005
  - type: private-evidence-only
    severity: material
    topic: compute-bom-exposure
    missingEvidence: Current GPU, accelerator, camera-module, and semiconductor sourcing map plus export-license contingency plans.
    whyItMatters: BIS policy risk is clear at the macro level, but investors still cannot tell how direct the exposure is for Mech-Mind’s current product or training stack.
    diligencePath: Obtain engineering BOMs, vendor concentration, substitute qualification status, and legal review of export-license sensitivity.
    relatedQuestionRefs:
    - QR032
    relatedTableRefs:
    - TR001
