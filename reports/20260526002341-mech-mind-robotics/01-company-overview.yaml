  title: The reusable company thesis is component-platform leverage, not single-robot novelty
  body: Across official pages and independent profiles, Mech-Mind repeatedly appears as the supplier of the eyes, brain, and hands that let many robot forms operate in real industrial settings. That is the right baseline for later product, market, and competition chapters.
  claimRefs:
