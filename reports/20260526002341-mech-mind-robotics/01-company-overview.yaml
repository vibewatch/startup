  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance-disclosure
    missingEvidence: Current board roster, committee structure, shareholder-rights summary, and a reconciled control map across founders, venture investors, and state-linked funds.
    whyItMatters: The public record is founder-heavy but thin on formal governance, which limits confidence in control, oversight, and pre-IPO decision-making.
    diligencePath: Request the latest board deck, board observer list, shareholder agreement summary, and cap-table summary in management diligence.
    relatedQuestionRefs:
    - QO009
    relatedTableRefs:
    - TO002
    - TO003
  - type: missing-source
    severity: material
    topic: ipo-readiness
    missingEvidence: Official Hong Kong filing text, prospectus draft, listing timetable, and management confirmation of intended proceeds and use of funds.
    whyItMatters: Financial-media reports suggest IPO preparation, but without primary filing materials the chapter cannot distinguish exploratory work from a committed listing path.
    diligencePath: Monitor HKEX disclosures and request management confirmation or the draft prospectus if the listing process continues.
    relatedQuestionRefs:
    - QO016
    relatedTableRefs:
    - TO004
  - type: private-evidence-only
    severity: blocking
    topic: valuation-and-financials
    missingEvidence: Current valuation mark, latest audited or board-approved revenue and ARR figures, gross margin, and the evidence chain behind any 2022 post-money valuation claim.
    whyItMatters: Recommendation quality later in the report depends on capital efficiency and valuation context, and the public pack does not support either reliably.
    diligencePath: Request the last two financing decks, valuation memos, audited financial statements, and finance KPI pack; do not rely on stale third-party database summaries.
    relatedQuestionRefs:
    - QO025
    relatedTableRefs:
    - TO001
