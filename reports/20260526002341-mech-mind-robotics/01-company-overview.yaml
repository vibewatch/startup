- id: founders-leadership-and-governance
  title: Founders, Leadership, and Governance
  body: 'The public leadership record is founder-led and technically credible, but still thinner than ideal for institutional diligence. Mech-Mind’s official team page names Shao Tianlan as founder and CEO and identifies his training in Tsinghua University’s School of Software and the Technical University of Munich, which aligns with 36Kr and KrASIA reporting on the company’s founder-market fit in industrial robotics. The Chinese startup profile page adds two publicly visible co-founders, Fu Ao on the business side and Ding Youshuang on the R&D-management side, while the official team page also highlights Professor Jianwei Zhang as founding technical advisor and chief scientist. KrASIA adds Xu Tingting as vice president of business and marketing, which is useful because it shows an internationalization bench beyond the founder. Governance disclosure remains weaker than leadership disclosure. The fetched official pages do not expose a full board roster, committee structure, or detailed shareholder-rights
    framework. What is public is the compliance posture: the company’s anti-corruption statement says it has an Integrity Compliance Committee, an inspectorate team, and a formal whistleblowing channel. That is a positive governance signal, but it does not substitute for board composition, investor-rights, or control-economics disclosure. Later chapters should therefore rely on Shao, the co-founders, Zhang, and the compliance architecture as verified public leadership anchors, while preserving formal board and control details as unresolved diligence asks.'
