  title: Public metadata lags the real financing timeline
  body: The most current English marketing copy, Chinese startup databases, and third-party directories do not agree on Mech-Mind’s present stage. The safest synthesis is to anchor on the dated 2024-2025 financing trail and treat older Series C/C+ labels as stale metadata rather than current state.
  claimRefs:
  - CO020
  - CO022
  - CO024
  - CO027
  - CO042
- calloutType: risk
  title: Commercial scale is visible, but governance and valuation disclosure are still incomplete
  body: The fetched public pack is strong on deployments, investors, and exhibition milestones, but weak on board composition, current valuation, revenue or ARR, and fully official IPO documentation. The Aiqicha dispute snapshot adds a modest adverse signal that should be preserved without being overstated.
