- id: global-scale-milestones-and-open-risks
  title: Global Scale, Milestones, and Open Risks
  body: 'The strongest company-overview evidence is on commercialization scale and the weakest is on financial transparency. Current official pages say Mech-Mind has more than 24,000 deployed units, serves over 100 Fortune Global 500 clients, operates in nearly 50 countries and regions, and employs 600+ people globally. Those numbers are directionally consistent with older but narrower third-party signals: Automate’s association profile speaks of 10,000+ industrial 3D cameras in 50+ countries and 1,500+ clients, while KrASIA and 36Kr reported 15,000+ installations before the current official 24,000+ claim. That progression suggests genuine scale growth plus shifting denominators between cameras, installations, and total units. The milestone record is also reusable. Aiqicha preserves early financing checkpoints from 2017 onward; KrASIA reports a Tokyo robotics lab opening in March 2025; official iREX 2025 and AW 2026 coverage shows the company using large international exhibitions to launch
    products and demonstrate wider embodied-intelligence scenarios; and QbitAI’s Davos coverage frames Mech-Mind as an export-oriented Chinese robotics player. The main negative signal is not a catastrophic operating failure but incomplete disclosure combined with measurable legal friction: Aiqicha lists multiple disputes and litigation-related records for the Xiong’an entity. Combined with the absence of publicly confirmed valuation, revenue, ARR, and full board disclosure, that means later chapters should preserve Mech-Mind as commercially scaled but still partially opaque.'
