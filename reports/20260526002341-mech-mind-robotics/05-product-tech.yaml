  evidenceGaps:
  - type: missing-source
    severity: material
    topic: mech-recon
    missingEvidence: A current official page, datasheet, or release note that explicitly defines Mech-Recon's product scope and relation to the rest of the Mech-Mind stack.
    whyItMatters: Without a current authoritative description, buyers cannot tell whether Mech-Recon is a sellable module, a legacy label, or an internal component.
    diligencePath: Ask product management for the current module map, SKU sheet, and any customer-facing Mech-Recon documentation; reconcile it against the 2026 catalog and docs surface.
    relatedQuestionRefs:
    - QE025
    relatedTableRefs:
    - TE001
  - type: private-evidence-only
    severity: material
    topic: performance-proof
    missingEvidence: Independent customer data on realized cycle times, accuracy, false-positive rates, deployment duration, and module attach in production cells.
    whyItMatters: Many of the strongest speed and accuracy claims in public materials are vendor-provided, so underwriters still lack audited evidence on whether the economics scale across customer environments.
    diligencePath: Request reference calls, acceptance-test reports, and before/after KPI dashboards for at least one camera-only cell, one Mech-DLK deployment, and one Eye-Brain-Hand project.
    relatedQuestionRefs:
    - QE022
  - type: missing-source
    severity: material
    topic: software-security
    missingEvidence: Public trust-center or product-security artifacts describing deployment model, tenancy, SLAs, patch cadence, and attestations for the software stack.
    whyItMatters: Hardware certifications and troubleshooting guidance do not clear enterprise diligence on the software plane, especially for multiregion or high-availability deployments.
    diligencePath: Obtain security white papers, trust-center access, uptime commitments, and architecture review materials for Mech-Vision, Mech-Viz, Mech-DLK, and any hosted components.
    relatedQuestionRefs:
    - QE024
    relatedTableRefs:
    - TE004
  - type: stale
    severity: minor
    topic: 2026-launches
    missingEvidence: Post-launch GA datasheets, pricing, availability, and customer references for ULTRA M-GL, AIC-Lite GL, and Mech-Station InstaDepal after the AW 2026 preview cycle.
    whyItMatters: Preview-stage launches can look more mature than they are, and underwriting should distinguish shipped GA products from event-driven roadmap messaging.
    diligencePath: Re-fetch product pages, part-number sheets, and regional distributor materials after GA; ask sales for orderability, lead times, and first reference accounts.
    relatedQuestionRefs:
    - QE016
    - QE026
    relatedTableRefs:
    - TE005
