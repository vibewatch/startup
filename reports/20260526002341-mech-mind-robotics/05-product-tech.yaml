- id: FE001
  title: Product architecture map
  type: stack
  layout: wide
  summary: Public product architecture layers Mech-Mind from sensing hardware through perception, planning, learning, and embodied-AI extensions.
  approximationNotes: This is an operating stack assembled from public product, documentation, and launch materials rather than an internal engineering diagram.
  data:
    layers:
    - id: layer-sensing
      label: Sensing layer
      detail: Mech-Eye industrial 3D cameras and Mech-Eye 3D laser profilers generate the point clouds and profile data that feed the rest of the stack.
    - id: layer-perception
      label: Perception layer
      detail: Mech-Vision handles 3D processing, matching, deep-learning inference, robot communication, and production-side orchestration.
    - id: layer-learning
      label: Learning layer
      detail: Mech-DLK manages datasets, labeling, training, validation, cascading, deployment, and SDK export for harder vision tasks.
    - id: layer-planning
      label: Planning and control layer
      detail: Mech-Viz abstracts robot programming into flow charts with one-click simulation, motion planning, collision detection, and pick-strategy planning.
    - id: layer-integration
      label: Integration surface
      detail: Standard interfaces, URCap packaging, SDKs, ROS interfaces, GenICam, GigE Vision, and sample repos connect the stack to robot controllers and external software.
    - id: layer-embodied
      label: Embodied-AI extension
      detail: Eye-Brain-Hand adds Mech-GPT and Mech-Hand on top of the older stack to target generalized picking and humanoid workflows.
