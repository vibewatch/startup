- id: product-technology-verdict
  title: Product & technology verdict
  body: |-
    The best read on Mech-Mind is that it has already built a mature industrial stack for classical 3D-vision-guided robotics and is now trying to use that installed base to climb into broader embodied-AI territory. The mature layer is well evidenced: ruggedized 3D hardware, laser profilers, no-code perception and robot-planning software, controller-specific documentation, UR marketplace packaging, ROS/SDK/GenICam interfaces, and public maintenance signals around developer assets. That combination makes the company more than a camera vendor and gives it a differentiated integration moat.

    The diligence burden is on what comes next and on what is still hidden. Public materials rely heavily on vendor claims for cycle time, detection accuracy, and deployment speed; they do not publish the same depth on software security, SLAs, or realized attach by module; and they leave Mech-Recon's status unclear. Verdict: Mech-Mind's product appears technically differentiated and commercially mature in the camera-plus-vision-plus-planning stack, while Eye-Brain-Hand and newer 2026 launches look promising but should still be underwritten as expansion options until management produces GA specs, customer references, and architecture/security detail beyond the launch-news layer.
