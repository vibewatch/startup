  title: Customer workflow / operating flow
  type: flow
  layout: wide
  summary: Representative deployment flow from 3D capture to pose generation, robot planning, execution, and production-side feedback.
  approximationNotes: The flow condenses the public Mech-Eye + Mech-Vision + Mech-Viz + Mech-DLK workflow into one generic operating sequence.
  data:
    nodes:
    - id: w1
      label: Select camera / profiler and mount hardware
      detail: Integrator chooses the Mech-Eye model or laser profiler that matches distance, field of view, and part properties.
    - id: w2
      label: Capture 3D data
      detail: Camera or profiler acquires point-cloud or profile data from parts, pallets, transparent objects, or inspection targets.
    - id: w3
      label: Run Mech-Vision project
      detail: No-code project handles 3D processing, matching, AI inference, robot communication, and parameter-recipe control.
    - id: w4
