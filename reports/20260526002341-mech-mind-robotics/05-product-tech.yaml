tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user
  - Public maturity / status
  - Technical differentiation
  - Key diligence gap
  rows:
  - - Mech-Eye industrial 3D cameras
    - Robotics integrators, automation engineers, vision teams
    - Mature / flagship hardware family
    - Broad working-distance range, ambient-light tolerance, detailed 3D point clouds, ruggedized industrial packaging
    - Need independent proof of realized throughput and defect-rate improvement by model and application
  - - Mech-Eye 3D laser profilers
    - Inspection, metrology, and quality engineers
    - Mature / specialized inspection line
    - 4K-class line profiling, up to 15 kHz scan rate, micron-level repeatability, single-shot HDR, GenICam support
    - Need wider third-party validation outside vendor and partner catalog materials
  - - Mech-Vision
    - Vision/application engineers and factory operators
    - Mature / core perception layer
    - No-code UI plus 3D processing, deep learning, robot communication, and production deployment in one environment
    - Claims around 1000+ robot models, 1-2 day tuning, and >99.99% recognition need customer-level validation
  - - Mech-Viz
    - Robot programmers and system integrators
    - Mature / control-planning layer
    - Flow-chart robot programming, one-click simulation, motion planning, collision detection, multi-TCP and picking strategies
    - Need evidence on how much logic still migrates into robot-native code for complex cells
  - - Mech-DLK
    - AI/vision specialists and inspection teams
    - Scaling / commercial AI layer
    - Integrated data-management-to-deployment workflow, cascading models, multi-language SDKs, and fast labeling tools
    - Public performance metrics are company-claimed and not independently benchmarked
  - - Embodied Intelligence Eye-Brain-Hand station
    - Embodied-AI pilots, retail/logistics innovation teams, advanced automation buyers
    - Emerging / launch-led expansion layer
    - Combines Mech-Eye, Mech-GPT, and Mech-Hand into a general-purpose sensing-reasoning-actuation stack
    - Public evidence is strong on demos and launch cadence but thinner on manuals, production references, and support boundaries
  - - Mech-Recon public footprint
    - Solution architects and buyers trying to map the stack
    - Unclear / not surfaced as standalone 2026 SKU
    - The term appears in discovery context but not in the retained official 2026 product pages as a clearly documented standalone SKU
    - Management should clarify whether Mech-Recon is legacy branding, a feature family, or a non-public module
  notes: Status labels reflect public documentation depth and deployment evidence, not undisclosed revenue mix or internal module attach.
