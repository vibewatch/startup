- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control / signal
  - Public status
  - Scope
  - Gap / risk
  rows:
  - - Hardware environmental protection
    - IP65 on industrial 3D cameras and IP67 on laser profilers are publicly marketed
    - Factory-floor dust, humidity, and rugged deployment tolerance
    - Hardware ruggedness does not answer software-security or uptime questions for the wider stack
  - - Safety / EMC certifications
    - Camera and profiler pages publish CE, FCC, VCCI and broader regional certification sets
    - Electrical / EMC procurement and cross-border deployment readiness
    - Certification depth is strongest on hardware; software attestation detail is not similarly public
  - - Durability / reliability
    - Official camera materials publish MTBF >= 100,000 hours and partner catalogs mention extended continuous testing
    - Long-running hardware deployments
    - These are still vendor-aligned sources rather than field failure-rate datasets
  - - Controller compatibility tables
    - Standard-interface docs list tested controller versions and required options across major robot brands
    - Commissioning predictability and supportability
    - Unlisted versions can work, but the docs explicitly warn that communication may fail and support may be required
  - - Runtime troubleshooting surface
    - Status-code docs enumerate execution timeout, failed camera connection, motion singularity, invalid pick point, and robot collision conditions
    - Operational debugging and safety-related tuning
    - The public docs show maturity, but they also reveal how many failure modes the integrator still has to manage
  - - Software / cloud trust disclosure
    - Publicly thin compared with hardware and integration documentation
    - Security architecture, SLA, tenancy model, patch cadence, and attestation evidence for the software stack
    - A buyer still needs trust-center material, questionnaires, or direct diligence to clear enterprise software risk
  notes: Trust table focuses on public hardware quality, integration safety, and disclosure surfaces; it is not a substitute for security questionnaires, factory acceptance testing, or SLA review.
