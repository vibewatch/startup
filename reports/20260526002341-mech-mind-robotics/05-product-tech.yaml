- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Mech-Mind flow
  - Measurable / public proof
  - Limitation
  rows:
  - - Random bin or piece picking
    - Locate and pick varied, reflective, or tightly packed items without manual fixture design
    - Mech-Eye captures depth -> Mech-Vision recognizes and outputs poses -> Mech-Viz plans a collision-free pick
    - UR marketplace and official pages position the stack for bin picking, piece picking, and unknown-object scenarios across 300-3500 mm camera coverage
    - Public proof is strongest on capability claims and weaker on independent cycle-time distributions
  - - Machine tending and localization / assembly
    - Find pose, align robot, and place parts precisely under factory-floor conditions
    - Camera or laser data feed vision matching and path planning; brand-specific adapters execute on ABB/KUKA/FANUC/UR/Yaskawa/Kawasaki controllers
    - Official docs publish tested controller versions and KUKA-specific calibration/programming references
    - Unsupported controller versions may still need vendor support and custom debugging
  - - Depalletizing / palletizing
    - Handle mixed pallets, unstable stacks, and SKU changes without hardcoded cells
    - Classical camera-plus-software stack or the newer Mech-Station InstaDepal cell handles pose detection and pallet workflow
    - AW 2026 page says InstaDepal supports 30-minute deployment and random arrivals/new SKUs
    - The 30-minute figure is a vendor launch claim rather than third-party commissioning evidence
  - - Inspection / measurement
    - Capture small defects, seams, glue beads, and dimensional deviation at line speed
    - Laser profiler plus Mech-MSR / Mech-Vision pipeline produces point clouds, CAD comparison, OCR, and defect measurements
    - Profilers advertise 4,096 points per profile, 15 kHz scan rates, and micron-level repeatability
    - Most performance proof is official or partner-driven rather than benchmark-lab audited
  - - Transparent or reflective object handling
    - Image objects that normally break structured-light or inspection workflows
    - New transparent-object imaging plus embodied "Eye + Brain" demos extend the stack into packaged goods, bottles, cans, and test tubes
    - AW 2026 launch material highlights ULTRA M-GL, sub-millimeter transparent-object picking, and generalized transparent-item handling
    - Current evidence is launch/demo heavy and not yet paired with a broad GA spec sheet or customer reference set
  - - Complex recognition / defect inspection with deep learning
    - Train models for overlapping objects, OCR, segmentation, or anomaly cases where rule-based vision is insufficient
    - Mech-DLK handles labeling, training, validation, deployment, and SDK export; Mech-Vision can then operationalize trained models
    - Chinese materials claim average inference around 10 ms, ~40% faster than peers, with low overkill and miss rates
    - These quality and speed numbers are company-claimed and should be tested on customer data
  notes: Benefits mix official and partner descriptions with a small amount of third-party corroboration; they are not standardized benchmark results.
