- id: integration-and-developer-surface
  title: Integration and developer surface
  body: 'Integration depth is one of Mech-Mind''s strongest public technical signals. Official standard-interface documentation does not just name robot brands; it lists tested controller families and versions across ABB, FANUC, KUKA, UR, Yaskawa, Kawasaki, and other brands, while the KUKA branch alone includes automatic calibration, example programs, commands, and error-message references. On the partner side, Universal Robots distributes Mech-Mind through its marketplace and explicitly describes a plug-and-play URCap that turns the Mech-Eye plus Mech-Vision plus Mech-Viz bundle into a deployable UR workflow. The developer surface is unusually open for industrial 3D vision: Mech-Mind publishes a GitHub organization, community posts linking C++, Python, ROS, ROS2, and HALCON samples, ROS 1 and ROS 2 interfaces with Ubuntu/OpenCV/PCL prerequisites, and manual material showing GenICam support, GigE-based acquisition, and third-party machine-vision interoperability. That said, the same documentation
    also implies that deployment still depends on controller options, SDK versions, recipe tuning, and on-site integration competence, so the openness story reduces lock-in but does not remove implementation complexity.'
