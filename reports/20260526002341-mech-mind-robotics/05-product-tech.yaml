- id: FE003
  title: Critical dependency map
  type: dag
  layout: wide
  summary: The practical success of a Mech-Mind deployment depends on hardware fit, data quality, robot-adapter compatibility, and integrator execution.
  approximationNotes: This dependency map emphasizes externally visible implementation dependencies rather than every internal software service.
  data:
    nodes:
    - id: d1
      label: Camera / profiler fit
      detail: Correct field of view, distance, lighting tolerance, and hardware selection for the target application.
    - id: d2
      label: Material and scene complexity
      detail: Reflective, transparent, dark, tightly packed, or high-mix objects directly affect imaging and recognition difficulty.
    - id: d3
      label: Mech-Vision project quality
      detail: ROI, thresholds, recipes, and project-step design determine whether the perception layer returns usable outputs.
    - id: d4
      label: Training data and models
      detail: Mech-DLK performance depends on label quality, coverage, and deployment discipline for hard cases.
    - id: d5
      label: Mech-Viz planning setup
      detail: Collision rules, TCPs, symmetry, grasp margins, and controller settings shape whether planned motion is executable.
    - id: d6
      label: Robot controller / brand adapter
      detail: Supported controller versions, required options, and controller-specific programs are needed for reliable execution.
    - id: d7
      label: SDK / ROS / GenICam custom integration
      detail: Open interfaces lower lock-in but add package, network, and software-maintenance dependencies.
    - id: d8
      label: On-site integrator and support flow
      detail: Local partners, training, and support determine how quickly projects clear setup and troubleshooting bottlenecks.
    - id: d9
      label: Real production performance
      detail: Cycle time, uptime, and accuracy in the field depend on all upstream choices working together.
