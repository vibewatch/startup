            body: >-
              香港 IPO 叙事作为市场报道可信，但还不是由申报文件支撑的事实集。Yahoo Finance、The Standard、Ifeng 和 HKCD 转载的 Bloomberg 源报道称，Mech-Mind
              正考虑或已秘密递交香港上市，目标约募资 $200 million；同时也强调时间和规模尚未最终确定，公司也未公开确认计划。这让投资人面对一种少见错配：证据足以相信资本市场准备已经启动，但披露还不足以像真正 IPO
              候选公司一样承销业务。已审阅官方或类文件来源均未披露年度收入、ARR、毛利率、EBITDA、净利润、现金、烧钱速度、债务、递延收入或客户集中度。一篇 Eastmoney 的 IPO 前评论文章流传了 2024
              年收入超过 RMB800 million、净利率超过 20%
              的数字，但我们没有找到官方文件、招股书或主流类申报证据来交叉印证这些数字。注册中介显示，中国备案和财务账目在底层系统中某处存在，但本次可审阅材料并未公开。直到招股书或审计报表出现，正确财务结论是：Mech-Mind
              有可信的产品市场牵引力和充足近期融资，但仍有太多仅限私下披露的指标，无法精确承销估值。
