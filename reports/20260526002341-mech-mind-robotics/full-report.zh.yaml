          label: 集成接口层
          detail: 标准接口、URCap 封装、SDK、ROS 接口、GenICam、GigE Vision 和示例仓库，把该技术栈接到机器人控制器和外部软件。
        - id: layer-embodied
          label: 具身 AI 扩展
          detail: Eye-Brain-Hand 在旧技术栈之上增加 Mech-GPT 和 Mech-Hand，瞄准通用抓取和人形机器人工作流。
