  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与定价信号
        blocks:
          - type: paragraph
            body: >-
              公开证据指向解决方案驱动的收入模式，而不是纯软件订阅业务。Mech-Mind 销售一套「Eye-Brain-Hand」栈，涵盖工业 3D
              相机、机器视觉软件、机器人编程软件和相关具身智能工作站，并通过咨询、方案设计、培训、部署和维护支持伙伴。这在财务上很重要，因为公司并不只是授权代码：部分收入几乎肯定来自硬件，部分来自软件许可，部分来自跟随集成商主导项目的部署或生命周期服务。官方材料反复强调伙伴和价值提供商，说明渠道经济性和实施支持是变现核心。缺失的是实际合同结构。已审阅来源没有发布标价、折扣阶梯、软件维护费率，或一次性部署收入与经常性支持之间的拆分。我们找到的唯一明确价格代理是历史性的：Jiemian
              在 2021 年报道称，Mech-Mind 产品定价大约是外国主流竞争对手的一半。这在方向上有用，但对当前承销来说太旧。正确结论是，Mech-Mind
              可能通过捆绑自动化单元或解决方案栈变现；如果软件复用和重复部署持续上升，长期经济性会更好，但公开数据还无法拆出已实现 ASP 或经常性收入质量。
