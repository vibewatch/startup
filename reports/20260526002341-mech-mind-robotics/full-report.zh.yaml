      - number: '2.3'
        title: 买方分群、垂直行业与采用路径
        blocks:
          - type: paragraph
            body: >-
              买方地图由流程驱动，而不是由客户名称驱动。在汽车和电子行业，类似 Mech-Mind
              的系统通常落在工厂自动化、质量或制造工程预算里，因为回报来自周期时间、废品率降低、精度提升，以及在困难部件上的劳动力杠杆。物流场景中，自然买方是配送中心运营团队、3PL，以及部署拆垛、包裹导入、料箱拣选和混合
              SKU
              单件拣选单元的集成商。用户是产线操作员、仓库主管、自动化工程师和集成商团队；付款方是工厂或站点运营职能，而不是泛化的「AI」预算。这一结构很重要，因为在反光、透明、深色或随机堆叠物体上，传统视觉失效时，Mech-Mind
              的公开适配度最强。这些条件反复出现在汽车零部件、电子装配、电池和物流包裹中。因此，系统集成商是核心商业层，而不是事后补丁，因为他们吸收部署复杂度，并为终端客户把工作单元本地化。
