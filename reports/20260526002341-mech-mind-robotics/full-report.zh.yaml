companyProfile:
  summary: >-
    Mech-Mind Robotics 是一家 2016 年成立的中国工业 AI 公司，围绕机器人引导商业化 Eye-Brain-Hand 栈。公司把 Mech-Eye 感知硬件、Mech-Vision 和 Mech-Viz
    软件、Mech-DLK 深度学习工具组合起来，在工厂和仓库里自动化抓取、放置、拆垛、机床上下料、装配和检测流程；但在经济性和控制权披露上，公开信息仍远少于公开市场投资者希望看到的程度。
