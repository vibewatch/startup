        - 已审阅材料中无标价
        - 竞争性价格定位，加对集成商友好的全栈
        - 强调快速部署，但商务条款定制
        - 商业验证比标价更重要
      - - Cognex
        - 已审阅材料中无公开定价
        - 存量自动化销售
        - 买方依赖装机信任和产品组合宽度
        - 竞争靠信任和宽度，而不是公开价格
      - - Keyence
        - 已审阅材料中无公开定价
        - 直接自动化销售，配设置工具和 CAD 辅助工作流
        - 部署看起来结构化，但由报价牵引
        - 可凭自动化可信度销售，而非透明价格
      - - Photoneo
        - 已审阅材料中无公开定价
        - 应用聚焦的 3D 视觉套件
        - 可能是项目制视觉销售
        - 买方更看匹配度，而非标价成本
      - - Intrinsic
        - 已审阅材料中无公开定价
        - 平台 / 技能 / 生态路径
        - 软件集成导向更强
        - 可作为控制层预算竞争，而不是相机 SKU
      - - Universal Robots
        - 官方预算指南，加上独立机械臂价格区间
        - 机器人硬件，加上合作伙伴和集成商生态
        - 硬件价格可见，完整工作站成本取决于工装、软件和支持
        - 在这组厂商里给出最清晰的公开成本锚
      - - Pickit
        - 已审材料未见公开定价
        - 聚焦 3D 视觉应用销售
        - 先卖应用，面向柔性自动化买家
        - 相比定制集成，更像产品化方案
      - - ISRA / Omron
        - 已审材料未见公开定价
        - 更广的自动化或检测销售动作
        - 品类可信度可能压过价格透明度
        - 既有厂商可用打包方案压制单点方案
    notes: 本表比较价格透明度和打包方式，而非实际合同价值；大多数已审厂商不披露公开标价。
