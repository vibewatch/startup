chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、布局与产品架构
        blocks:
          - type: paragraph
            body: >-
              应首先把 Mech-Mind 视为具身智能的赋能平台公司，而不是单一机器人 SKU 供应商。官方英文和中文公司页面都显示，公司成立于 2016 年，核心是「Eye-Brain-Hand」栈：工业 3D
              相机充当眼睛，AI 软件和多模态推理充当大脑，灵巧末端执行器充当手。KrASIA 和 AsiaICT
              也强化了同一叙事，并补充说，公司的商业化逻辑是把这些组件标准化，让集成商和终端用户能覆盖大量制造和物流任务，而不必为每个流程重做定制开发。运营布局也需要说清楚。中文公司页面把北京作为研发中心、上海作为销售和交付基地；中英文联系页面则显示更广的网络，覆盖德国、日本、韩国、美国，以及多个中国城市。一些目录和
              IPO
              传闻报道突出雄安或河北地址，但更适合把这些地址理解为法律实体或协会地址，而不是唯一运营总部。供后续章节复用的标准身份应是：一家处于后期的中国私营机器人平台公司，北京和上海在运营上重要，现场团队全球分布，并拥有标准化的「Eye-Brain-Hand」产品架构。
