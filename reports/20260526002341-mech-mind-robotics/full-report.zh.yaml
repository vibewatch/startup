  - id: TP001
    title: 竞争对手画像表
    columns:
      - 竞争对手
      - 类别
      - 公开产品范围
      - 主要部署模式
      - 垂直行业 / 地域信号
      - 相比 Mech-Mind 的关键短板
    rows:
      - - Mech-Mind Robotics
        - 直接全栈同类
        - 3D 相机、规划、深度学习、检测、具身工作站
        - 不绑定机器人品牌的工作流栈，通过集成商和直销部署销售
        - 50+ 个国家；汽车、物流、电子、食品、零售
        - 公开定价和精确赢率数据仍稀缺
      - - Cognex
        - 机器视觉龙头存量厂商
        - 机器视觉、智能相机、视觉传感器、条码读取
        - 工厂自动化存量厂商，装机信任基础广
        - 全球工业客户基础；存量厂商声誉强
        - 公开材料较少将其定位为一体化「眼-脑-手」工作站栈
      - - Keyence
        - 机器视觉 / 机器人导引存量厂商
        - 2D、线扫、3D 相机，AI 与规则视觉，3D VGR
        - 报价驱动的自动化销售，配校准和 CAD 辅助设置
        - 制造业装机基础大
        - 公开来源更强调视觉深度，而非单一供应商工作流栈
      - - Photoneo
        - 聚焦 3D 机器人视觉的对手
        - Locator Studio、Bin Picking Studio、拆垛、MotionCam-3D、扫描仪
        - 围绕搬运和运动物体感知部署 3D 机器人视觉
        - 工厂、仓库、物流
        - 公开控制 / 检测层比 Mech-Mind 窄
      - - ISRA Vision
        - 偏检测的存量厂商
        - 面向汽车、电池、玻璃、金属、纸张、塑料的机器视觉解决方案
        - 工业检测与图像处理销售
        - 在重检测行业覆盖广
        - 公开材料较少强调不绑定机器人品牌的拣选 / 编程栈
      - - Intrinsic
        - 平台型替代者
        - Flowstate、技能架构、视觉模型、数字孪生、AI 工具
        - 跨第三方机器人和开放工具运行的软件平台
        - 通过 FANUC、ROS、Gazebo、Open-RMF 做生态打法
        - 本身不像打包式 3D 相机厂商
      - - Roboception
        - 聚焦 3D 感知的对手
        - rc_visard 传感器，加 CADMatch、ItemPickAI、BoxPick、SLAM、URCap
        - 面向机器人导引的模块化传感器 + 软件模块
        - 模块化感知买方和集成商
        - 在检测和工作站上的公开广度窄于 Mech-Mind
      - - Omron
        - 自动化存量厂商 / 相邻对手
        - 机器人技术加机器人视觉系统，用于装配、检测、包装、运输
        - 广泛的自动化和机器人销售路径
        - 汽车、数字、食品、医疗、物流
        - 机器人视觉只是更大自动化组合的一部分
      - - Universal Robots / Teradyne
        - 机器人平台生态替代者
        - 协作机械臂、市场伙伴、部署与预算内容
        - 机器人硬件加伙伴 / 集成商生态
        - 协作机器人装机基础广；伙伴渠道
        - 需要伙伴插件才能匹配 Mech-Mind 式完整视觉栈
      - - Pickit
        - 聚焦 3D 导引的对手
        - 料箱拣选、拆垛、装配、在线测量
        - 应用优先的 3D 视觉套件
        - 适合 SMB 和协作机器人的搬运任务
        - 工作流范围比 Mech-Mind 更聚焦
    notes: 各行概括每个竞争对手最可见的公开产品和部署姿态，并非穷尽内部能力清单。
