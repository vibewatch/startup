            body: >-
              公司没有公开披露传统 IPO 模型所需的运营输入，用情景分析比给单一目标数更诚实。乐观情景下，如果披露的收入规模、持久海外部署和类软件利润率结构成立，投资人就可以穿透当前不透明，支持显著更高的公开市场或
              pre-IPO 估值标记。基准情景下，Mech-Mind 仍是真实独角兽，技术和融资支持可信，但在披露包改善前，倍数扩张会受限。悲观情景下，IPO
              或下一轮融资披露出的业务组合更像低倍数自动化硬件或服务，而不是软件。即使公司仍有战略价值，承销区间也会被大幅压缩。关键在于，当前公开证据支撑的是围绕独角兽底线和 18C
              规模门槛的宽区间，而不是精确上限。因此本报告给出“偏高而非断裂”的判断：故事仍可能成立，但公开证明包还不够厚，不能为上行叙事激进付费。
