      - number: '8.2'
        title: 融资抬升、独角兽确认与 2022 基线的局限
        blocks:
          - type: paragraph
            body: >-
              最强的可获取融资事实是 2025 年 8 月轮次：多家英文和中文报道独立将其规模放在约 CNY500 million，并把资金用途指向继续投入 Mech-Mind
              的具身智能眼脑手栈和全球商业化。可获取的公开报道也确认了 2022 年 CNY500 million 的 Series D 轮，为比较提供了可见的后期起点。更重要的估值变化发生在这两个点之间。到
              2025-2026 年，China Daily 的 Hurun 报道明确把 Mech-Mind 放在 $1 billion 门槛之上；Xinhua 和 State Council
              报道也分别称公司为中国独角兽。这些证据足以验证一个方向性抬升：公司从 2022 年融资时代进入了明确的独角兽区间。公开页面没有干净解决的，是订阅数据库常引用的 2022
              年投后估值确切数字。做估值时，谨慎读法是公司显然已经进入独角兽框架，但抬升斜率的一部分仍被私募市场不透明遮住。
