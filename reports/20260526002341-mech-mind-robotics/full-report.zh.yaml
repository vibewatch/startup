  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户足迹与垂直行业组合
        blocks:
          - type: paragraph
            body: >-
              Mech-Mind 的公开客户图景在总量上很广、在流程上很具体，但具名账户披露偏薄。当前英文和中文官方材料都声称已部署 24,000+ 个单元、拥有 100+ 家 Fortune 500 客户，并覆盖约 50
              个国家或地区。第三方资料在方向上印证了这一规模，尽管较旧第三方快照仍引用 10,000+ 台相机或 15,000+ 个安装案例；因此，解读装机基数的正确方式是把它看成移动时间序列，而不是单一审计分母。


              垂直行业组合比客户名称更清楚。官方英文页面聚焦汽车、物流、金属和机加工、电子、EV
              电池，以及食品饮料。中文材料用汽车制造、物流搬运、重工业、轻工业、新能源和工业质检描述了大致相同的足迹。两种语言中，汽车看起来最深，其后是物流、电池或电子。公开证据因此支持真实的跨垂直部署广度，但没有提供干净的逐客户名单，让投资人按客户名称、地区或队列映射收入。
