      - number: '1.4'
        title: 全球规模、里程碑和未解风险
        blocks:
          - type: paragraph
            body: >-
              公司概况中最强的证据在商业化规模，最弱的证据在财务透明度。当前官方页面称 Mech-Mind 已部署超过 24,000 个单元，服务 100 多家 Fortune Global 500 客户，覆盖近 50
              个国家和地区，全球员工 600+。这些数字与更早但口径更窄的第三方信号大体一致：Automate 的协会资料提到在 50+ 个国家有 10,000+ 台工业 3D 相机、1,500+ 个客户；KrASIA 和
              36Kr 在当前官方 24,000+ 说法之前报道过 15,000+ 个安装案例。这一变化说明规模确有增长，同时相机、安装案例和总单元之间的分母也在切换。里程碑记录也可复用。Aiqicha 保留了自 2017
              年以来的早期融资节点；KrASIA 报道 2025 年 3 月东京机器人实验室开设；官方 iREX 2025 和 AW 2026 信息显示公司借大型国际展会发布产品，并展示更广的具身智能场景；QbitAI 的
              Davos 报道则把 Mech-Mind 置于中国机器人出海玩家框架中。主要负面信号不是灾难性经营失败，而是不完整披露叠加可衡量的法律摩擦：Aiqicha
              对雄安实体列出多项纠纷和诉讼相关记录。再加上估值、收入、ARR 和完整董事会披露均未公开确认，后续章节应把 Mech-Mind 定位为商业化已有规模、但仍部分不透明。
