        title: 团队、缓释成熟度与终止条件
        blocks:
          - type: paragraph
            body: >-
              执行风险高于产品层。公开材料仍高度围绕创始人兼 CEO Shao Tianlan 和少数可见管理者展开；董事会构成、审计准备度、内控成熟度和接班计划大多仍是私域信息。公司确有可见缓释项：600+
              名员工、自有相机工厂、全球子公司、伙伴培训，以及先在中国验证产品、再推向国际的策略。这些条件强于纯演示阶段故事，也解释了 Mech-Mind
              为何能国际化扩张。但它们不能替代硬监控。关键的可投资问题包括：核心工作流中赢单率能否顶住 Cognex 和 Keyence；全球部署扩张时支持质量能否跟上；中国需求走弱是否拉长 PoC
              到量产的周期；出口管制或贸易冲击是否拖慢路线图执行；传闻中的 IPO 能否转化为带可审计指标的公开文件。表 R005 把这些不确定性转成明确触发器。如果管理层在尽调中无法提供客户集中度、赢单 / 输单、BOM
