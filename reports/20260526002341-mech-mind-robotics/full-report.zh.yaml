        - 上市顾问和招股书草案
        - 高
      - - 硬件与软件组合
        - 装机基础、软件附着率、服务占比、按产品族拆分的利润率
        - 区分平台经济模型和集成商经济模型
        - 管理账和定价包
        - 高
      - - 全球部署质量
        - 按地区和垂直行业拆分的付费部署，而不只是展示活动
        - 检验国际足迹能否转化为耐久收入
        - 销售负责人和渠道报告
        - 高
    notes: 这些问题是最低配置；只有拿到它们，才能从叙事丰富的独角兽框架，推进到价格纪律约束下的投资决策。
    claimRefs:
      - CV035
      - CV036
      - CV043
