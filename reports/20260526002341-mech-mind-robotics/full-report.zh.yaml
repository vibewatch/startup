              融资是本文件中记录最完整的部分。官方层面，Mech-Mind 称已完成 Series C+ 轮并累计融资 $300 million。CB Insights 显示的累计金额较低，为 14 轮 $222.36
              million，但它也列出用户要求我们验证的关键节点：2022 年 8 月 Series D 融资 $38 million，估值 $858
              million。后续来源对轮次规模的证据强于估值证据。Marketscreener 和多家中文媒体报道，2025 年 8 月 Series E-II 约 RMB500 million，投资团包括
              Zhongshan Broad-Ocean Motor、CICC Porsche、Haihe、Hebei Structural Reform、Shanghe、Nanxiang、Tianjin Venture
              Capital、China Growth Capital，以及 Xiong'an 相关基金。到 2025 年末，多家媒体把累计融资描述为大约或超过 RMB2
              billion。这足以说明公司带着相当充足的资产负债表支持进入 IPO 前窗口，但不足以计算现金跑道。我们没有找到关于账上现金、月度烧钱速度、债务或项目融资义务的已审阅披露。也没有找到权威公开来源能清楚确认
              2022 年后估值超过 $1 billion；低声誉 IPO 前评论指向约 RMB8 billion，但这仍是报道估计，而不是已验证的升值轮。因此，资本故事强，但 2022 年 Series D
