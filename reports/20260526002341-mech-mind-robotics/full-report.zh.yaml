  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局与竞争类别
        blocks:
          - type: paragraph
            body: >-
              Mech-Mind 不属于一个整齐的同业组。最接近的替代方案可拆成四类。第一类是 Cognex、Keyence、Omron、ISRA Vision
              等老牌机器视觉厂商，它们已经把受信任的自动化、检测和传感产品卖进大型工厂。第二类是 Photoneo、Roboception、Pickit 等聚焦 3D
              引导的专业厂商，围绕料箱拣选、拆垛和相关搬运流程，用更窄的栈切入。第三类是 Intrinsic 等平台层替代者，它们打包技能、仿真和机器人控制抽象，而不是 Mech-Mind 式的单供应商栈。第四类是
              Universal Robots 等机器人平台生态，硬件、市场合作伙伴和集成商会吸收部分相同买方预算。Mech-Mind
              公开材料显示，它在这群对手中仍有差异化：公司把相机、机器人引导、深度学习、检测和预制工作单元包装成一个 Eye-Brain-Hand 方案。竞争问题因此不是替代者是否存在——它们显然存在——而是
              Mech-Mind 的集成式流程包装，是否足以抵消周围老牌渠道、生态和定价优势。
