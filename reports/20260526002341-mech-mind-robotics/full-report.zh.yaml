        blocks:
          - type: paragraph
            body: >-
              公开证据显示，Mech-Mind 比多数专业 3D 引导对手更宽，但在渠道触达上窄于最大自动化老牌厂商。其中英文公开材料覆盖工业 3D
              相机、激光轮廓仪、Mech-Vision、Mech-Viz、Mech-DLK、Mech-MSR 和具身机器人工作站，文档足迹则覆盖引导、检测、测量和机器人通信。这套公开栈比 Pickit 或
              Roboception 更宽，后两者看起来更集中在拣选和感知模块；也不同于 Photoneo 对机器人视觉、料箱拣选、拆垛和高速 3D 相机的强调。Keyence 和 Cognex
              仍是基准老牌厂商，因为它们把宽机器视觉产品线与长期自动化信任配在一起。Intrinsic 又是结构性不同的对手：它向上移动到技能、仿真和数字孪生流程，可跨第三方机器人运行。结果是，Mech-Mind
              的主要优势不是拥有机器人手臂，而是减少在现有机器人单元上搭建困难 3D 视觉任务所需的独立供应商数量。
