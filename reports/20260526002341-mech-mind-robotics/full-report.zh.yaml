  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与模块地图
        blocks:
          - type: paragraph
            body: >-
              最适合把 Mech-Mind 的产品公开材料理解为一套分层工业自动化栈，围绕料箱拣选、机床上下料、定位、装配、拆垛、码垛和在线检测等具体流程销售。2026
              年公开材料显示，公司产品组合很宽但仍连贯：Mech-Eye 工业 3D 相机、Mech-Eye 3D
              激光轮廓仪、Mech-Vision、Mech-Viz、Mech-DLK、Mech-MSR、Mech-Station
              InstaDepal，以及更新的具身智能「Eye-Brain-Hand」工作站。核心商业逻辑是，相机和轮廓仪家族采集可用 3D 数据，Mech-Vision 把数据转成位姿或检测结果，Mech-Viz
              规划并仿真机器人运动，Mech-DLK 在传统视觉步骤不够时提供可训练 AI 模型。这套栈设计是真实差异化，因为它让 Mech-Mind
              销售集成流程，而不是只卖传感器。主要提示是产品边界清晰度：当前官方英文和中文页面没有把 Mech-Recon 作为 2026
              年独立页面展示，因此尽调仍需管理层解释，它仍是遗留术语、功能家族，还是内部范围模块，而不是对外销售 SKU。
