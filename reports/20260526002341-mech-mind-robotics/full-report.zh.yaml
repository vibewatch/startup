      - number: '4.2'
        title: 牵引力代理与单位经济逻辑
        blocks:
          - type: paragraph
            body: >-
              由于 Mech-Mind 是私营公司，最有信息量的财务代理是部署、市场份额和交付信号。官方材料称在近 50 个国家部署了 24,000+ 个单元，并拥有 100 多家 Fortune Global 500
              客户；第三方报道则称公司连续五年领先中国 3D 视觉引导工业机器人细分市场，并在 2024 年达到 38% 份额。更早报道还显示，订单曾以每年超过三倍增长，2021 年团队已超过 300
              人，并有可观研发投入。合在一起，这些指标支撑真实商业化规模，但还不能转化为干净的收入质量指标。单位经济可能是混合的。相机、轮廓仪和机器人工作站带来硬件采购，以及可能的库存或营运资本暴露；方案设计、部署和维护带来人工成本；但如果重复部署增长快于现场服务强度，软件复用、无代码编程和跨多个机器人品牌的标准化适配会创造杠杆。最有用的正向代理是标准化：Mech-Mind
              有意避开制造机器人本体，转而试图把可复用的感知和控制层卖进多个行业。最有用的负向代理是集中度风险：近期分析认为，长尾客户仍更难拿下，小客户对成本敏感，高端汽车部署仍面临国际全栈竞争对手压力。
