  - id: FE002
    title: 客户工作流 / 运行流程
    type: flow
    layout: wide
    summary: 代表性部署流程：从 3D 采集到位姿生成、机器人规划、执行和生产侧反馈。
    approximationNotes: 该流程把公开的 Mech-Eye + Mech-Vision + Mech-Viz + Mech-DLK 工作流压缩成一个通用运行序列。
    data:
      nodes:
        - id: w1
          label: 选择相机 / 轮廓仪并安装硬件
          detail: 集成商选择与距离、视野和工件属性匹配的 Mech-Eye 型号或激光轮廓仪。
        - id: w2
          label: 采集 3D 数据
          detail: 相机或轮廓仪从工件、托盘、透明物体或检测目标获取点云或轮廓数据。
        - id: w3
          label: 运行 Mech-Vision 项目
          detail: 无代码项目负责 3D 处理、匹配、AI 推理、机器人通信和参数配方控制。
        - id: w4
          label: 按需训练或优化模型
          detail: Mech-DLK 支持标注、训练、验证和部署，用于难识别或缺陷检测场景。
        - id: w5
          label: 在 Mech-Viz 中规划机器人运动
          detail: 运动仿真、碰撞检测和抓取策略生成可执行路径，不依赖机器人原生语言。
        - id: w6
          label: 通过机器人适配器 / URCap / 标准接口执行
          detail: 面向特定控制器的适配器把结果发送给 ABB、KUKA、UR、FANUC、Yaskawa、Kawasaki 等受支持机器人。
        - id: w7
          label: 监控生产并调整配方
          detail: 操作员使用生产视图、参数切换和故障排查文档处理换型、超时或边界情况。
      edges:
