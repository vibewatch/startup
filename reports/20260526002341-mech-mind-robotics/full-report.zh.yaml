  - id: TP004
    title: 护城河耐久度 / 竞争风险清单
    columns:
      - 护城河或风险
      - 方向
      - 重要性
      - 当前公开证据
      - 尽调问题
    rows:
      - - Eye-Brain-Hand 技术栈宽度
        - 优势
        - 单一厂商可覆盖感知、规划、AI 和检测
        - Mech-Mind 公开技术栈覆盖相机、编程、深度学习、测量和工作站
        - 客户支出中有多少落到 Mech-Mind，而不是合作伙伴？
      - - 集成商友好型部署
        - 优势
        - 集成负担更低，可加快试点和规模化
        - A3 档案强调产品易用、价格有竞争力，并聚焦集成商
        - 从试点到稳定生产的中位用时是多少？
      - - 既有厂商的产品组合与渠道力量
        - 风险
        - Cognex、Keyence、Omron 和 ISRA 带着既有信任和更广自动化版图入场
        - Qviro 和 IMR 凸显既有厂商深度及伙伴扩张
        - Mech-Mind 对阵具名既有厂商的胜率是多少？
      - - 平台抽象与生态替代
        - 风险
        - Intrinsic、FANUC 及 UR 式生态可降低客户对单一集成视觉厂商的依赖
        - Flowstate 加上 FANUC/ROS 和 UR 市场，拓宽了替代选项
        - 哪些机器人品牌贡献了 Mech-Mind 大部分收入和附加率？
      - - 拥挤的 3D 视觉赛道
        - 风险
        - 买家可评估多家可信的机器人引导专精厂商
        - QYResearch 将 Mech-Mind 列入多家全球 3D 视觉厂商，并提到前五集中度
        - Mech-Mind 在吞吐量或正常运行时间上，哪里已明确优于 Photoneo、Pickit 和 Roboception？
      - - 规模指标不一致
        - 风险
        - 规模证据方向上强，但仍缺一个清晰的公开分母
        - 公开来源分别提到 10,000+ 台相机、15,000+ 次安装和 24,000+ 台相机
        - 当前经审计安装基数、活跃客户数和分地区收入是多少？
    notes: 风险清单把有支持的方向性证据与尚未解决的投资判断问题分开；多个关键商业指标仍未公开。
