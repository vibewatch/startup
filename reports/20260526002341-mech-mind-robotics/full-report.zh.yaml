    title: 产品架构图
    type: stack
    layout: wide
    summary: 公开产品架构把 Mech-Mind 从传感硬件延展到感知、规划、学习和具身 AI 扩展。
    approximationNotes: 该运营栈来自公开产品、文档和发布材料，不是内部工程图。
    data:
      layers:
        - id: layer-sensing
          label: 传感层
          detail: Mech-Eye 工业 3D 相机和 Mech-Eye 3D 激光轮廓仪生成点云和轮廓数据，供后续技术栈使用。
        - id: layer-perception
