      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >-
              公开领导层记录显示，公司由创始人驱动，技术可信度较强，但对机构尽调来说仍偏薄。Mech-Mind 官方团队页面列出 Shao Tianlan 为创始人兼 CEO，并披露其在 Tsinghua University
              软件学院和 Technical University of Munich 的学习经历，这与 36Kr、KrASIA
              对其工业机器人创始人与市场匹配度的报道一致。中文创业公司资料页又补充两位公开可见的联合创始人：商务侧的 Fu Ao、研发管理侧的 Ding Youshuang；官方团队页面还突出 Professor
              Jianwei Zhang 为创始技术顾问兼首席科学家。KrASIA 还提到 Xu Tingting
              担任业务和市场副总裁，这一点有用，因为它显示创始人之外还有国际化班底。治理披露弱于领导层披露。本次检索到的官方页面没有给出完整董事会名单、委员会架构或详细股东权利框架。公开可见的是合规姿态：公司的反腐败声明称其设有诚信合规委员会、监察团队和正式举报渠道。这是正面治理信号，但不能替代董事会构成、投资人权利或控制权经济安排的披露。因此，后续章节应把
              Shao、联合创始人、Zhang，以及合规架构作为已验证的公开领导层锚点，同时把正式董事会和控制权细节保留为未解决的尽调问题。
