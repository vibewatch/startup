  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险优先级与传导
        blocks:
          - type: paragraph
            body: >-
              Mech-Mind 的风险画像不是由单一致命缺陷主导，而是由竞争压力、工业需求周期性和披露缺口相互作用推高。公开证据确认公司已有真实规模——部署 24,000+ 台设备、服务 100+ 家 Fortune
              Global 500 客户、足迹覆盖近 50 个国家——但可靠性和部署成熟度的最强证明仍主要来自公司自有材料。与此同时，独立市场资料把 Cognex、Keyence 等老牌厂商放在机器视觉采购决策的核心位置；中国
              PMI 到 2026
              年仍偏弱，外部分析也警示，中国放缓和贸易碎片化已经在重塑制造业需求。因此最高的剩余风险是商业执行被挤压：工业项目周期长、集成重，终端客户转谨慎时，项目最容易滑期；老牌厂商又有存量基础和渠道优势，而管理层还希望投资人承销一个没有公开审计收入、客户集中度或赢单
              / 输单披露的 IPO。图 R001 和 R002 对风险栈排序，并展示外部冲击如何传导到收入、利润率和融资结果。
