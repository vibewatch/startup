  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议边界：公开数据究竟能支撑什么
        blocks:
          - type: paragraph
            body: >-
              Mech-Mind 显然已不再是投机性的种子阶段机器人公司。公开证据现在能支撑更扎实的底线：公司在 2025 年 8 月又完成一笔规模不小的融资，多项公开来源称其为独角兽，市场也把它作为秘密递表香港 IPO
              的候选公司讨论。上述组合足以支撑后期阶段、持续融资能力，以及投资人对故事的认真兴趣；但还不足以支撑精确公允价值。公开来源仍未披露经审计收入、毛利率、烧钱速度、留存、客户集中度或股权结构条款。缺少这些项目，估值工作应定位为划边界，而不是给点估值。因此当前正确建议是继续研究。投资逻辑足够可投，值得继续推进，但文件证据还不足以证明只凭叙事就应付出溢价。公开证据可以支撑宽泛的独角兽级别区间和上市地可选性；还不能支撑高确信买入或清晰的
              IPO 目标价。
