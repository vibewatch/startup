      - number: '6.3'
        title: 具名客户验证与证明质量
        blocks:
          - type: paragraph
            body: >-
              客户侧最尖锐的问题，不是 Mech-Mind
              是否有工业部署，而是标杆客户名称能否被公开验证。正面来看，官方案例库规模大且运营细节具体。负面来看，公司自有页面压倒性地描述匿名工厂、零部件或流程，而不是点名买方。这意味着，具名客户证明远弱于装机基数或垂直广度证明。


              用户特别要求验证 BMW、SAIC、Geely 等名称，而不是默认假设。已审阅公开证据没有把 BMW 验证为 Mech-Mind 的具名客户：Mech-Mind 本次审阅的自有页面没有点名 BMW，抓取到的
              BMW 相邻来源指向的是 UR 和 Hexagon，而不是 Mech-Mind。SAIC 和 SAIC-GM 情况类似：2026 年公开电池线部署报道点名 Zhiyuan/Nengzai，而不是
              Mech-Mind。Geely、CATL、BYD、Foxconn 和 JD Logistics 在抓取集合中仍未获公开验证。结果是，行业适配和客户名称证明之间必须清晰区分。
