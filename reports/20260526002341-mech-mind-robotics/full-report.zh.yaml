      - number: '1.3'
        title: 融资形成、投资人和阶段信号
        blocks:
          - type: paragraph
            body: >-
              Mech-Mind 的融资历史相当扎实，但源材料包清楚显示，公开阶段标签滞后于公司真实状态。官方中文材料称累计融资已超过 RMB 2 billion，并列出 IDG Capital、Meituan、Sequoia
              China、Source Code Capital、Intel Capital、Qiming Venture Partners 等投资人。独立中文报道补上了带日期的节点：Aiqicha 记录了
              Pre-A、A/A+、B、B+ 以及更早的 2021 年 C 轮；36Kr 2021 年 9 月报道补充了由 Meituan 和 IDG 领投、接近 RMB 1 billion 的 C 系列融资；36Kr
              项目页则记录了截至 2025 年的 D、D++ 和 E 轮标签。MarketScreener 随后报道 2025 年 8 月公司完成近 RMB 500 million 的联合融资；香港财经媒体称公司已在 2025
              年 9 月秘密递交香港 IPO，目标募资 USD 200 million。关键尽调点在于，并非所有公开数据集都同步更新。英文官方关于页面仍写着 Series C+ 和 USD 300 million
              累计融资，Tracxn 仍以 Series C 标签呈现，并只统计六轮、USD 200 million。因此，更合适的标准阶段描述是「有公开证据支持 2024–2025 年 D/E 轮融资步骤和 IPO
              准备的后期私营公司」，而不是「当前 Series C 公司」。
