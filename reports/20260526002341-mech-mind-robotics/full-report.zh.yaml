      - number: '6.4'
        title: 部署深度、流程广度与扩张信号
        blocks:
          - type: paragraph
            body: >-
              公开证明在应用层面最强。仅汽车页面就覆盖机床上下料、车轮装配、轮胎搬运、制动和车轴搬运、冲压件上架、玻璃涂胶、在线测量和焊接支持。物流页面覆盖纸箱、周转箱、袋装物和铅酸电池拆垛，以及包裹导入。EV
              电池、电子和金属页面又显示模块拆解、module-to-pack 装配、连接器检测、家电装配、钢板折弯和红热车轮上下料等额外广度。


              这种广度重要，因为它暗示 Mech-Mind 在客户工厂内部按流程扩张，而不是靠公开客户名称营销扩张。官方 2025 年汽车在线检测新闻尤其重要：它说明 Mech-Mind
              正从机器人引导任务进入汽车产线相邻的质量和测量流程。即便如此，公开的工厂间铺开或账户扩张证据仍大多是间接的。公司证明了其产品正在被用于许多流程类别，但没有公开展示许多具名账户如何随时间从试点走到生产，再走向多站点扩张。
