  - id: TE002
    title: 工作流 / 用例表
    columns:
      - 用户任务
      - 当前工作流
      - Mech-Mind 流程
      - 可衡量 / 公开证明
      - 限制
    rows:
      - - 随机料箱或单件拣选
        - 在没有手工夹具设计的情况下，定位并抓取多样、反光或紧密堆叠的物品
        - Mech-Eye 捕获深度 -> Mech-Vision 识别并输出位姿 -> Mech-Viz 规划无碰撞抓取
        - UR 市场和官方页面将该栈定位于料箱拣选、单件拣选和未知物体场景，覆盖 300-3500 mm 相机范围
        - 公开证明最强的是能力声称，独立周期时间分布较弱
      - - 机床上下料与定位 / 装配
        - 在工厂现场条件下寻找位姿、对齐机器人并精准放置零件
        - 相机或激光数据输入视觉匹配和路径规划；面向 ABB/KUKA/FANUC/UR/Yaskawa/Kawasaki 控制器的品牌适配器负责执行
        - 官方文档公布已测试控制器版本，以及 KUKA 专属标定 / 编程参考
        - 未支持的控制器版本仍可能需要供应商支持和定制调试
      - - 拆垛 / 码垛
        - 无需硬编码工作站，即可处理混合托盘、不稳定堆叠和 SKU 变化
        - 经典相机 + 软件栈，或较新的 Mech-Station InstaDepal 工作站，处理位姿检测和托盘工作流
        - AW 2026 页面称 InstaDepal 支持 30 分钟部署、随机到货和新 SKU
        - 30 分钟数字是供应商发布声称，而非第三方调试证据
      - - 检测 / 测量
        - 以产线速度捕捉小缺陷、接缝、胶线和尺寸偏差
        - 激光轮廓仪加 Mech-MSR / Mech-Vision 管线，生成点云、CAD 对比、OCR 和缺陷测量
        - 轮廓仪宣传每条轮廓 4,096 点、15 kHz 扫描率和微米级重复性
        - 多数性能证明来自官方或伙伴，而非基准实验室审计
      - - 透明或反光物体处理
        - 为通常会打断结构光或检测工作流的物体成像
        - 新的透明物体成像，加上具身「Eye + Brain」演示，将技术栈延伸到包装商品、瓶子、易拉罐和试管
        - AW 2026 发布材料强调 ULTRA M-GL、亚毫米级透明物体拣选和泛化透明物品处理
        - 现有证据偏发布和演示，还没有配套的大范围 GA 规格表或客户参考集
      - - 复杂识别 / 深度学习缺陷检测
        - 在规则视觉不够用的重叠物体、OCR、分割或异常场景中训练模型
        - Mech-DLK 负责标注、训练、验证、部署和 SDK 导出；Mech-Vision 随后把训练好的模型落到生产流程
        - 中文材料称平均推理约 10 ms，比同业快约 40%，过杀率和漏检率较低
        - 这些质量和速度数字来自公司说法，需在客户数据上复测
    notes: 收益项混合了官方和伙伴描述，只有少量第三方佐证；不是标准化基准测试结果。
