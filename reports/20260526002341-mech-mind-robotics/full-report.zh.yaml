          label: 3D 数据输入
        - from: w3
          to: w4
          label: 传统视觉不足时训练
        - from: w4
          to: w3
          label: 部署新模型
        - from: w3
          to: w5
          label: 位姿 / 检测输出
        - from: w5
          to: w6
          label: 机器人路径
        - from: w6
          to: w7
          label: 运行时反馈
