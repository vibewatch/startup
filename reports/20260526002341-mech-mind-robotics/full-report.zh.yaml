      - number: '6.2'
        title: 地理分布与渠道模式
        blocks:
          - type: paragraph
            body: >-
              当前官方材料明确显示 Mech-Mind
              的客户覆盖全球，并列出中国、美国、德国、日本和韩国的办公室或设施。这一点重要，因为工业自动化里的客户证明不只看装机基数，还要看上线后部署、服务、培训和故障排查能否在本地处理。Mech-Mind
              的中文和英文公开材料，加上 KrASIA，都指向一种模式：中心化验证产品，叠加本地化商业和支持存在。


              商业化模式看起来更偏伙伴驱动，而不是纯直营。KrASIA 称区域系统集成商和代理负责部署与推广，Mech-Mind
              专注产品开发和售后支持。中文官方关于页面又补充了面向集成商伙伴的培训、参考方案设计、展会支持和项目支持。UR+ 会员身份，以及在 Automate 和 iREX 的反复亮相，也符合这一模式：Mech-Mind
              正搭建一个生态，终端客户触达很大程度上由机器人平台、本地集成商、展会或目录发现渠道中介，而不只是直接标杆客户营销。
