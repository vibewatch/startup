      - number: '5.2'
        title: 架构与运行流程
        blocks:
          - type: paragraph
            body: >-
              其运行模式从感知到动作，比多数工业视觉供应商公开得更清楚。Mech-Eye 相机和激光轮廓仪采集深度数据或轮廓数据；Mech-Vision 提供无代码感知环境，处理 3D
              处理、匹配、深度学习支持的识别、机器人通信和生产部署；Mech-Viz 再用碰撞检测、抓取策略、多 TCP 和机器人品牌抽象来仿真并规划运动；Mech-DLK
              则为更困难的识别或缺陷检测场景处理数据集管理、标注、训练、验证、级联和部署。中文产品页面在这里尤其具体，声称支持 1000+ 款机器人型号、1-2
              天通信调试，以及通过生产界面实现分钟级换型流程。Eye-Brain-Hand 是传统栈之上的扩展层：它把 Mech-Eye、Mech-GPT 和 Mech-Hand 组合起来，面向更泛化的具身流程；AW 2026
              证据显示，这一概念正进入透明物体搬运、人形机器人货架拣选和标准化拆垛单元。结果是一套可信架构：相机硬件、AI 推理和机器人执行，被设计成一个部署包落地。
