  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与替代方案
        blocks:
          - type: paragraph
            body: >-
              应把 Mech-Mind 分析为工业 AI 和 3D 视觉基础设施供应商，而不是完整机器人 OEM。公司自有产品组合和第三方资料一致描述了一套由工业 3D
              相机、视觉软件、深度学习工具和无代码机器人编程组成的栈，用于料箱拣选、拆垛、机床上下料、精密装配和检测等任务。这意味着公司参与的是架在机器人手臂和工作单元之上的感知、规划和部署层，而不是工厂或仓库自动化资本开支中的每一美元。纳入支出因此包括
              3D 传感器、视觉和 AI 软件、部署工具、面向具体流程的配置，以及本地集成支持。排除支出则包括大多数机器人手臂硬件、输送线、AS/RS 钢结构，以及无关的工厂 IT。最接近的替代方案是人工搬运、更简单的 2D
              视觉、硬编码机器人单元，或完全绕开柔性 3D 感知的固定自动化。因此，市场边界必须从困难流程出发，而不是从最宽泛的公开自动化类别出发。
