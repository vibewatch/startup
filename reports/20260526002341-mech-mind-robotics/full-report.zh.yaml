    summary: Mech-Mind 的运营模型依赖四个外部节点：系统集成商、大型工业买家、先进算力输入和既有视觉生态。任何一个都可能独立失效，叠加后会放大影响。
    data:
      nodes:
        - id: d1
          label: Mech-Mind 核心平台
          type: core
        - id: d2
          label: 系统集成商 / 代理商
          type: channel
        - id: d3
          label: 全球支持办公室
          type: operations
        - id: d4
          label: 汽车 / 物流 / 电子买家
          type: demand
        - id: d5
          label: 先进算力 / 半导体供应
          type: technology
        - id: d6
          label: Cognex / Keyence / Basler 生态
          type: competitive
        - id: d7
          label: 香港 IPO 路径
          type: capital-markets
        - id: d8
          label: 中国宏观周期
          type: macro
      edges:
        - from: d1
          to: d2
          label: 需要借助其部署和推广
        - from: d1
          to: d3
          label: 需要其提供售后支持
        - from: d1
          to: d4
          label: 销往
        - from: d1
          to: d5
          label: 算力 / 零部件依赖于
        - from: d4
          to: d8
          label: 资本开支受其影响
        - from: d6
          to: d4
          label: 在其内部争夺预算
        - from: d2
          to: d4
          label: 借其影响转化
        - from: d7
          to: d1
          label: 可为其规模化提供资金
        - from: d5
          to: d1
          label: 可限制其路线图
    claimRefs:
      - CR007
      - CR008
      - CR010
      - CR013
      - CR016
      - CR038
      - CR046
      - CR047
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 本章的建议逻辑很简单：新资金和独角兽身份先得到确认，但披露缺口仍在，所以结论是继续研究，而不是买入。
    data:
      nodes:
        - id: funding
          label: 2025 年融资已确认
        - id: unicorn
          label: 独角兽身份得到印证
        - id: gaps
          label: 核心财务披露仍缺失
        - id: ipo
          label: 存在香港 IPO 可选项
        - id: rec
          label: 继续研究
      edges:
        - from: funding
          to: unicorn
        - from: unicorn
          to: gaps
        - from: gaps
          to: ipo
        - from: ipo
          to: rec
    approximationNotes: 这条流程是本章的投资判断逻辑，不是公司发布的框架。
    claimRefs:
      - CV001
      - CV006
      - CV035
      - CV039
      - CV040
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 估值争议最受披露质量和业务结构证据影响，不是单靠又一轮高调融资就能定价。
    data:
      items:
        - label: 经审计收入披露
          value: 3
          unit: relative upside turns
        - label: 毛利率超过 60%
          value: 2
          unit: relative upside turns
        - label: 香港上市承销顺利
          value: 1
          unit: relative upside turns
        - label: 客户集中度超过 30%
          value: -2
          unit: relative downside turns
        - label: 硬件 / 服务组合占主导
          value: -3
          unit: relative downside turns
        - label: IPO 窗口关闭或收紧
          value: -2
          unit: relative downside turns
    approximationNotes: 敏感性条形只是定性权重辅助，不是统计因子模型。
    claimRefs:
      - CV013
      - CV035
      - CV036
      - CV041
      - CV043
      - CV046
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 现有公开证据只能支撑围绕独角兽估值底线的宽区间，而不是一个窄目标价。
    data:
      items:
        - label: 悲观可支撑区间
          low: 700
          high: 1000
          unit: USD m illustrative
        - label: 基准可支撑区间
          low: 1100
          high: 1600
          unit: USD m illustrative
        - label: 乐观可支撑区间
          low: 1800
          high: 2500
          unit: USD m illustrative
    approximationNotes: 这些区间是投资判断辅助，依据独角兽身份确认、18C 门槛和公开可比公司框架拼出；不是市场出清报价。
    claimRefs:
      - CV041
      - CV042
      - CV044
      - CV045
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: compact
    summary: 公开 KPI 在融资和战略可选性上强，经营披露偏弱。
    data:
      items:
        - label: 最新融资轮
          value: ~RMB500M
        - label: 独角兽信号
          value: '>$1B confirmed in 2026 sources'
        - label: 传闻 IPO 募资额
          value: ~$200M
        - label: 建议
          value: research-more
        - label: 置信度
          value: medium
        - label: 估值立场
          value: stretched
    approximationNotes: KPI 面板有意排除未披露的收入和利润率数字，而不是替它们做猜测。
    claimRefs:
      - CV001
      - CV006
      - CV008
      - CV039
      - CV040
      - CV041
