      - number: '2.5'
        title: Mech-Mind 的全球位置与仍需尽调的问题
        blocks:
          - type: paragraph
            body: >-
              Mech-Mind 最适合作为具身工业 AI
              的「铲子和镐」供应商来理解：它销售感知、规划和部署层，可以横跨汽车、电子和物流单元，而不要求绑定某一种机器人形态或某一个终端市场。这在战略上有吸引力，因为当客户购买的是柔性而不只是更多金属时，机器视觉、3D
              软件和仓库自动化层可以跑赢底层机器人基数。公司在中国、日本、韩国、德国和美国的本地化布局也强化了这一点：它想通过全球制造和集成商生态销售，而不只依靠中国国内需求。承销上的谨慎点在于，这里可用的公开市场数字大多来自相邻市场。投资人仍缺少按地区和垂直行业拆分的收入结构、每个机器人单元的附着率，以及按应用拆分的流程级
              ROI。因此，可投资问题不是市场是否足够大——答案是足够大——而是 Mech-Mind 能否反复把这套庞大装机基数转化为软件含量高、全球可支持、且部署摩擦可控的收入。
            claimRefs:
              - CM040
              - CM041
              - CM042
              - CM043
