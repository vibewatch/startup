      - number: '7.3'
        title: 运营可靠性、集成与客户不透明
        blocks:
          - type: paragraph
            body: >-
              运营问题不在于 Mech-Mind
              能否演示先进感知——其自有材料显示，它在反光金属、透明容器、薄壁零件和在线检测上能力较强——而在于这些结果有多大概率在存量现场的规模化波动中站得住。公司可靠性博客明确写到，漂移、振动、灰尘、环境光和连续运行会降低相机精度，或在一段时间后导致故障。其他官方页面也承认，反光表面、折射、遮挡和几何形状变化会让识别和抓取失稳，把感知问题变成停机、返工和节拍丢失。Mech-Mind
              的缓释措施有实质意义：IP65/IP67 硬件、最高 100,000 小时 MTBF
              声称、漂移自动校正、仿真工具和无代码部署流程。但这些缓释措施大多由公司自己发布，公开资料中没有按行业展示正常运行时间、故障率或试点转量产转化率的现场队列数据。这个缺口重要，因为客户暴露仍不透明。官方页面列出汽车、物流、动力电池、重工业、电子和食品等核心部署领域，但没有公开来源披露头部客户依赖、行业收入拆分、续约率或按机器人品牌计算的附着率。
