        - 相对 Cognex / Keyence 的具名输赢单和折扣趋势
        - 核心工作流连续三次战略性输单，或新交易毛利率压缩 >5pp
        - 重新评估护城河，下调增长假设，并要求提供竞标文件
      - - 出口管制 / 半导体获取
        - 关键算力或相机组件需要许可或替代件
        - 出货被拒、延迟 >90 天，或核心 BOM 被迫重设计
        - 暂停路线图假设，重建产品成本 / 时间风险模型
      - - 中国宏观放缓和制造业周期性
        - PMI 和订单转化趋势
        - 官方或私营制造业 PMI 连续三个月低于 50，同时内部销售管线转化走弱
        - 下调中国驱动的增长，并拉长销售周期假设
      - - IPO / 资本市场不确定性
        - 从传闻走向可公开支撑上市流程的进展
        - 没有公开申报、没有经审计收入桥，或较管理层预期延后 12+ 个月
        - 移除 IPO 作为近期催化剂，并提高融资风险权重
      - - 客户集中度不透明
        - 队列和集中度披露可得性
        - 管理层在尽调中无法提供前 10 大客户、前 5 大垂直行业和续约数据
        - 维持高风险评级，不把客户标识覆盖面当作集中度分散来支撑判断
      - - 现场可靠性和集成质量
        - 可背书的正常运行时间和上线表现证据
        - 没有可独立背书的正常运行时间数据，或旗舰应用中反复出现低于 95% 的表现
        - 在确定敞口规模前，要求现场走访、客户访谈和实施款项保留
    notes: 这些阈值是尽调工具，不是上市公司指引；每一项都把软叙事转成可观察的投资判断测试。
