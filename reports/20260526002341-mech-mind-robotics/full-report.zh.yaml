      - number: '7.2'
        title: 监管、法律与资本市场风险
        blocks:
          - type: paragraph
            body: >-
              Mech-Mind 依赖自己无法左右的政策时，监管风险最实质。2026 年 1 月 BIS
              规则没有消除出口管制风险；该规则只是把一刀切假定改为某些先进半导体可逐案审查的狭窄路径，同时保留繁重的认证、了解客户（KYC）、测试和反转移义务。公开资料没有披露 Mech-Mind
              当前计算硬件物料清单（BOM），但任何对美国来源先进 AI 芯片或相关模块的依赖，都会落在一个可能迅速再次收紧的政策框架下。资本市场风险同样只是悬而未决，并未解决。HKEX Chapter 18C
              明确给机器人发行人留出通道，但该路径仍取决于经审计收入或未商业化门槛；公开传闻包只说 Mech-Mind 已秘密递表香港 IPO，希望募资约 US$200 million，最终条款仍未确定。Aiqicha
              还给出另一项法律悬挂信号：Xiong’an 主体显示多起商业纠纷和诉讼相关记录。上述事项都不能证明投资逻辑今天断裂，但意味着 IPO 叙事应被视为有条件的期权，而不是已去风险的流动性。
