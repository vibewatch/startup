      - number: '6.5'
        title: 耐久性、留存与集中度提示
        blocks:
          - type: paragraph
            body: >-
              最大的剩余客户风险问题是耐久性和集中度。本次抓取到的官方或第三方资料来源都没有披露 NRR、GRR、流失率、续约率、最大客户占比或前 10
              大客户集中度。这并不意味着业务缺少留存；它意味着当前公开记录无法让投资人衡量留存。同样的问题也适用于集中度。汽车看起来是公开最深的垂直行业，中国仍是公司的验证基础，但任何单一客户、垂直行业或地区的收入暴露都没有公开量化。


              含义是，公开尽调可以支持一个中等信心判断：Mech-Mind
              拥有真实跨垂直部署和可运作的伙伴主导支持模式。没有私下证据，它无法支持对客户质量、续约耐久性或集中度风险的高信心判断。本章的正确结论因此是二分的：采用证明真实，但具名账户承销仍不完整。任何投资观点都应要求客户访谈、头部客户明细、续约数据，以及成功多站点或多产品扩张案例，然后再把总量客户说法视为完全可承销。
