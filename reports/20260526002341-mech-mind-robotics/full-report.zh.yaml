      - number: '2.2'
        title: 规模测算视角与区域动态
        blocks:
          - type: paragraph
            body: >-
              公开市场数据方向上积极，但不能简单相加。IFR 显示全球工业机器人装机基数很大且仍在增长，但 Mech-Mind
              无法捕获所有机器人硬件支出；可变现的楔子是骑在这组基数上的更窄视觉与引导层。公开源材料包里最接近的相邻市场是仓库自动化、仓库机器人和机器视觉。它们都足够大，能够支撑有意义的品类领导者，但范围、预测窗口和方法论不同；保留这些分布，比假装它们能收敛成一个共识
              TAM
              更诚实。中国在本章格外重要，因为它同时是最大工业机器人市场、领先的电子安装市场，也正变成一个越来越由本土供应商主导的环境。与此同时，公开来源对如何衡量机器人密度并不一致，这提醒我们区域基准必须严守分母。务实结论是，Mech-Mind
              受益于中国深厚的自动化基础，也受益于全球机器视觉和仓库自动化需求扩张；但投资人仍需要受约束的可服务市场（SAM）视角，而不是宽泛的标题式 TAM。
