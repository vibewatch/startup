      - number: '2.4'
        title: 增长向量与采用阻碍
        blocks:
          - type: paragraph
            body: >-
              需求驱动真实且多因共振。仓库运营商仍把劳动力短缺和人工成本列为最清晰的近期采用触发因素；IFR 和 A3 则把 AI 自主性、IT/OT
              融合和物流数字化描述为机器人和视觉系统可处理流程范围扩大的背景。这个背景有利于 Mech-Mind，因为当客户希望从现有机器人单元里获得更高柔性时，其无代码和 3D
              感知叙事最有力。但源材料包同样清楚地说明，需求不会无摩擦地转化为生产收入。资金审批率仍落后于口头兴趣；许多制造商难以选择正确技术、接入遗留系统，或提供维持项目推进所需的内部专业能力。当机器人更靠近人，安全、认证和人工监督也仍是重要部署关口。因此，市场不是被需求不足卡住，而是被实际成本、集成和准备度门槛卡住；这些门槛把试点需求和规模化铺开隔开。
