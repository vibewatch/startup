      - number: '8.3'
        title: 可比框架与 IPO 路径选项
        blocks:
          - type: paragraph
            body: >-
              可比分析只有被当作框架才成立，不能把它当成一张能神奇解开 Mech-Mind 私募市场价格的表。Symbotic 是最接近的高增长仓储自动化参照，但它比 Mech-Mind 更偏安装和系统。Cognex
              披露更清晰，也更接近机器视觉，但范围更窄、也更偏检测。Zebra 展示了多元化自动化硬件在投资人给出较低销售倍数时的交易状态；Teradyne 和 Universal Robots
              则说明，从大型集团结构中抽出干净机器人倍数有多难。Mind Robotics 这类私募轮显示，投资人仍愿意为工业 AI
              机器人支付溢价，但这些轮次同样披露稀疏，不应被当作持久公开市场支持的证明。退出路径上，HKEX Chapter 18C
              是最可信的已披露通道，因为它明确容纳特专科技公司，并把机器人纳入先进硬件和软件。即便如此，公开来源仍未说明 Mech-Mind 会被筛为商业化还是未商业化，因此上市地可行性不等于承销确定性。
