  - id: FE003
    title: 关键依赖图
    type: dag
    layout: wide
    summary: Mech-Mind 部署能否真正成功，取决于硬件匹配、数据质量、机器人适配器兼容性和集成商执行。
    approximationNotes: 该依赖图强调外部可见的实施依赖，而不是每一项内部软件服务。
    data:
      nodes:
        - id: d1
          label: 相机 / 轮廓仪匹配
          detail: 针对目标应用，视野、距离、光照容忍度和硬件选型必须正确。
        - id: d2
          label: 材料与场景复杂度
          detail: 反光、透明、深色、紧密堆叠或高混合度物体，会直接影响成像和识别难度。
        - id: d3
          label: Mech-Vision 项目质量
          detail: ROI、阈值、配方和项目步骤设计，决定感知层是否返回可用输出。
        - id: d4
          label: 训练数据和模型
          detail: Mech-DLK 在困难案例中的表现取决于标注质量、覆盖度和部署纪律。
        - id: d5
          label: Mech-Viz 规划设置
          detail: 碰撞规则、TCP、对称性、抓取余量和控制器设置，决定规划动作能否执行。
        - id: d6
          label: 机器人控制器 / 品牌适配器
          detail: 要稳定执行，需要受支持的控制器版本、必要选项和控制器专属程序。
        - id: d7
          label: SDK / ROS / GenICam 定制集成
          detail: 开放接口降低锁定效应，但会增加包、网络和软件维护依赖。
        - id: d8
          label: 现场集成商和支持流程
          detail: 本地合作伙伴、培训和支持，决定项目多快跨过安装和故障排查瓶颈。
        - id: d9
          label: 真实生产表现
          detail: 现场节拍、正常运行时间和精度，取决于所有上游选择协同跑通。
      edges:
        - from: d2
          to: d1
          label: 驱动硬件选择
        - from: d1
          to: d3
          label: 图像质量供给感知
        - from: d4
          to: d3
          label: 模型质量影响检测
        - from: d3
          to: d5
          label: 位姿 / 检测输出驱动规划
        - from: d5
          to: d6
          label: 规划动作必须匹配控制器现实
        - from: d7
          to: d8
          label: 定制集成负担
        - from: d6
          to: d9
          label: 执行可靠性
        - from: d8
          to: d9
          label: 调试和支持质量
