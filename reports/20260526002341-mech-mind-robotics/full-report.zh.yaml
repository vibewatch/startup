      - number: '5.4'
        title: 成熟度、质量控制与产品风险
        blocks:
          - type: paragraph
            body: >-
              产品成熟度不只由营销文案支撑。官方公开材料声称有 24,000+ 台相机、100+ 家 Fortune Global 500 客户，并在约 50 个国家和地区运营；KR-Asia 和 Eastmoney
              也独立描述了 15,000+ 个安装案例、本地化实验室、区域工程团队和自有相机工厂。公开质量信号同样有意义：相机和轮廓仪页面发布 IP65/IP67 以及广泛 EMC/安全认证，手册披露 GenICam 和
              SDK 发布说明，故障排查文档列举了真实运行故障模式，如执行超时、相机连接失败、运动奇异点、无效抓取点和机器人碰撞。这些都是平台部署足够多之后积累运营边缘案例的特征。风险在于公开证明仍不对称。Mech-Mind
              对硬件耐用性、机器人适配器和展会发布的记录，强于对软件安全架构、SLA 边界，或经独立验证的吞吐量和精度基准的记录。Eye-Brain-Hand
              显然在推进，但其公开证据基础仍更多来自新闻，而不是手册；Mech-Recon 在保留的公开语料中仍文档不足。
