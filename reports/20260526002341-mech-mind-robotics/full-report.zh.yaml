      - number: '7.4'
        title: 老牌厂商、渠道依赖与周期性需求
        blocks:
          - type: paragraph
            body: >-
              竞争风险在结构上偏不利，因为 Mech-Mind 攻入的工作流本来就在老牌厂商的采购地图里。Cognex 的 10-K 显示其对物流、汽车、消费电子和大中华区有实质暴露；Keyence 的 3D VGR
              产品页显示，自动标定、CAD 导入、路径规划和仿真并非 Mech-Mind 独有。独立排名和市场报告同样把 Cognex、Keyence、Basler、Omron、机器人 OEM
              和系统集成商生态放在机器人视觉选型的中心。重要的是，Mech-Mind 的分销模式也依赖合作伙伴。KrASIA
              称公司通过本地系统集成商和代理商合作；公开的价值提供商材料和联系页面显示，其支持网络分散在欧洲、美国、日本、韩国、北京和上海。资本开支强劲时，该模式能放大触达；资本开支转弱时，它可能拉低服务质量，并拉长本就顾问式的销售周期。宏观证据并不温和。中国
              PMI 在 2025 年末和 2026 年 1 月再次跌破 50；NBR 认为，中国放缓和贸易关系恶化会冲击制造业出口商，并迫使它们多元化。对 Mech-Mind
              而言，汽车、电子或物流客户的资本开支暂停，可能与老牌厂商降价、合作伙伴执行滑坡合并成一条下行闭环。
