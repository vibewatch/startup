  evidenceGaps:
  - type: access-blocked
    severity: material
    topic: 2022-post-money-baseline
    missingEvidence: A clean, accessible public page that explicitly states Mech-Mind's exact 2022 post-money valuation, rather than only the 2022 D-round amount.
    whyItMatters: The chapter can verify a directional step-up into unicorn territory, but not the exact numerical slope from 2022 without a clean baseline.
    diligencePath: Request a subscription-database screenshot or investor memo excerpt that cites the 2022 post-money and reconcile it against the cap table.
    relatedQuestionRefs:
    - QV026
  - type: private-evidence-only
    severity: blocking
    topic: operating-financial-disclosure
    missingEvidence: Audited 2024-2025 revenue, gross margin, opex, burn, cash, and working-capital statements.
    whyItMatters: Without formal operating disclosure, no investor can defend a precise IPO or crossover valuation, only a broad range.
    diligencePath: Obtain audited financials or management accounts and reconcile them to any draft prospectus disclosure.
    relatedQuestionRefs:
    - QV027
    - QV030
  - type: private-evidence-only
    severity: blocking
    topic: cap-table-and-preferences
    missingEvidence: The full cap table, preference stack, anti-dilution protections, liquidation rights, and board-control terms.
    whyItMatters: These terms shape downside protection, dilution, and true entry price even if the headline valuation looks acceptable.
    diligencePath: Request the latest cap table, shareholder agreement summary, and term sheets for the 2025 round and any IPO pre-marketing discussions.
    relatedQuestionRefs:
    - QV028
  - type: missing-source
    severity: material
    topic: ipo-classification-path
    missingEvidence: Formal disclosure showing whether Mech-Mind would list as a commercial or pre-commercial Chapter 18C issuer, or via another route.
    whyItMatters: Route choice changes the scale threshold, disclosure burden, and how investors should interpret the rumored Hong Kong IPO.
    diligencePath: Review the draft listing application or ask counsel for the intended rule basis and threshold work-up.
    relatedQuestionRefs:
    - QV029
  - type: enumeration-incomplete
    severity: material
    topic: comparable-coverage
    missingEvidence: A fuller set of accessible private robotics rounds and M&A precedents with disclosed valuation terms.
    whyItMatters: The current comparable table is intentionally partial because many private robotics marks remain opaque or paywalled, which widens valuation error bars.
    diligencePath: Expand the comparable pack with paid-data exports or banker comp sheets and attach them to the investment memo.
    relatedQuestionRefs:
    - QV018
    - QV030
    relatedTableRefs:
    - TV004
