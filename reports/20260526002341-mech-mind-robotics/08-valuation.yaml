- id: financing-step-up-and-unicorn-confirmation
  title: Financing Step-Up, Unicorn Confirmation, and the Limits of the 2022 Baseline
  body: 'The strongest accessible financing fact is the August 2025 round: multiple English and Chinese reports independently place it at about CNY500 million and tie the proceeds to further investment in Mech-Mind’s embodied-intelligence eye-brain-hand stack and global commercialization. Accessible public coverage also confirms a 2022 Series D round of CNY500 million, giving a visible late-stage starting point for comparison. The more important valuation development is what happened between those points. By 2025-2026, China Daily’s Hurun-related coverage explicitly placed Mech-Mind above the $1 billion threshold, while Xinhua and State Council reporting separately described the company as a Chinese unicorn. That is enough to verify a directional step-up from the 2022 financing era into explicit unicorn territory. What public pages do not cleanly settle is the exact 2022 post-money figure often cited in subscription databases. For valuation work, the prudent read is that the company has
    clearly crossed into unicorn framing, but the exact slope of the step-up remains partly hidden behind private-market opacity.'
