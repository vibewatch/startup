    - CFO, auditor, or listing draft
    - Critical
  - - Customer and order-book cohorts
    - Account count, concentration, renewal/expansion, backlog quality
    - Tells investors whether deployments are repeatable
    - Revenue operations and finance
    - Critical
  - - Cap table and preference terms
    - Preferred stack, anti-dilution, liquidation rights, board control
    - Prices dilution and downside protection
    - Legal counsel and finance team
    - Critical
  - - IPO classification and route
    - Commercial vs pre-commercial 18C treatment, venue logic, proceeds plan
    - Determines listing threshold and risk framing
    - Listing counsel and draft prospectus
    - High
  - - Hardware versus software mix
    - Installed base, software attach, service share, margin by product family
    - Separates platform economics from integrator economics
    - Management accounts and pricing pack
    - High
  - - Global deployment quality
    - Paid deployments by region and vertical, not just showcase activity
    - Tests whether international footprint converts into durable revenue
    - Sales leadership and channel reports
    - High
  notes: These asks are the minimum package required to move from a narrative-rich unicorn frame to a price-disciplined investment decision.
