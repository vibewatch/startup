company:
  name: Mech-Mind Robotics
chapter:
  number: 8
  title: Valuation
  summary: 'Mech-Mind Robotics has clearly graduated into unicorn-level financing and IPO optionality, but public disclosure still underwrites only a broad valuation boundary rather than a precise fair value. The best-supported current call is research-more with medium confidence and a stretched valuation stance: the 2025 near-RMB500 million round and 2026 unicorn confirmation are real, while revenue quality, margins, and cap-table economics remain too opaque for a buy call.'
sections:
- id: recommendation-boundary
  title: Recommendation Boundary and What Public Data Can Actually Underwrite
  body: 'Mech-Mind is clearly no longer a speculative seed-stage robotics name. Public evidence now supports a firmer floor than that: the company completed another sizable financing in August 2025, is described by multiple public sources as a unicorn, and is being discussed as a confidential Hong Kong IPO candidate. That combination is enough to underwrite late-stage status, continuing capital access, and serious investor interest in the story. It is not enough to underwrite a precise fair value. Public sources still do not disclose audited revenue, gross margin, burn, retention, customer concentration, or cap-table terms. Without those items, the valuation exercise should be framed as boundary-setting rather than point-estimation. The right current recommendation is therefore research-more. The thesis is investable enough to keep working on, but not documented enough to justify paying up on narrative alone. Public evidence can support a broad unicorn-level band and venue optionality; it
    cannot yet support a conviction buy or a clean IPO price target.'
