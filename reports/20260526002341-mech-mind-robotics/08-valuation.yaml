- id: TV005
  title: Thesis-break and stop triggers table
  columns:
  - Trigger
  - Threshold or event
  - Transmission to thesis
  - Action implication
  - Primary evidence needed
  rows:
  - - Pulled or indefinitely delayed IPO
    - Hong Kong filing does not proceed after confidential preparation
    - Signals weaker market readiness or disclosure comfort
    - Reset valuation floor and wait
    - Formal filing status and advisor commentary
  - - Down-round or structured rescue financing
    - Next round prices below current unicorn framing or adds punitive terms
    - Destroys current late-stage pricing signal
    - Do not chase; re-underwrite from the new cap table
    - Term sheet and preference stack
  - - Low-margin economics disclosed
    - Audited numbers show hardware-services mix with weak gross margin
    - Pushes Mech-Mind toward lower-multiple automation peers
    - Compress valuation band sharply
    - Audited income statement and segment mix
  - - Customer concentration is extreme
    - One or two accounts dominate commercial proof
    - Reduces durability of revenue and platform narrative
    - Reduce confidence even if top-line is growing
    - Cohort and concentration disclosure
  - - International deployment quality disappoints
    - Global footprint exists but repeat paid deployments are thin
    - Turns a platform story into a pilot story
    - Shift toward bear case
    - Install-base and renewal data
  notes: These triggers are designed to stop an investor from paying for the narrative if new disclosure weakens the economic case.
