  - CV002
  - CV003
  - CV004
  - CV005
  - CV006
  - CV007
  - CV010
- id: comparable-frame-and-ipo-routes
  title: Comparable Frame and IPO Route Options
  body: The comparable exercise only works if it is treated as framing, not as a spreadsheet that magically solves Mech-Mind’s private-market price. Symbotic is the closest high-growth warehouse-automation reference, but it is more installation- and systems-heavy than Mech-Mind. Cognex is cleaner on disclosure and closer to machine vision, but narrower in scope and more inspection-centric. Zebra shows what diversified automation hardware can trade at when investors pay lower sales multiples, while Teradyne and Universal Robots show how hard it is to extract a clean robotics multiple from a larger conglomerate structure. Private rounds such as Mind Robotics show that investors still pay up for industrial AI robotics, but those rounds also come with sparse disclosure and should not be treated as proof of durable public-market support. On exit routes, HKEX Chapter 18C is the most plausible disclosed pathway because it explicitly accommodates specialist technology companies and includes robotics
    within advanced hardware and software. Even there, public sources still do not reveal whether Mech-Mind would screen as commercial or pre-commercial, so venue plausibility should not be mistaken for underwriting certainty.
