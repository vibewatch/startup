evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance-disclosure
    missingEvidence: >-
      Current board roster, committee structure, shareholder-rights summary, and a reconciled control map across
      founders, venture investors, and state-linked funds.
    whyItMatters: >-
      The public record is founder-heavy but thin on formal governance, which limits confidence in control, oversight,
      and pre-IPO decision-making.
    diligencePath: >-
      Request the latest board deck, board observer list, shareholder agreement summary, and cap-table summary in
      management diligence.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: ipo-readiness
    missingEvidence: >-
      Official Hong Kong filing text, prospectus draft, listing timetable, and management confirmation of intended
      proceeds and use of funds.
    whyItMatters: >-
      Financial-media reports suggest IPO preparation, but without primary filing materials the chapter cannot
      distinguish exploratory work from a committed listing path.
    diligencePath: >-
      Monitor HKEX disclosures and request management confirmation or the draft prospectus if the listing process
      continues.
    relatedQuestionRefs:
      - QO016
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: blocking
    topic: valuation-and-financials
    missingEvidence: >-
      Current valuation mark, latest audited or board-approved revenue and ARR figures, gross margin, and the evidence
      chain behind any 2022 post-money valuation claim.
    whyItMatters: >-
      Recommendation quality later in the report depends on capital efficiency and valuation context, and the public
      pack does not support either reliably.
    diligencePath: >-
      Request the last two financing decks, valuation memos, audited financial statements, and finance KPI pack; do not
      rely on stale third-party database summaries.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: robot-guidance-tam
    missingEvidence: >-
      A direct public market study that isolates industrial 3D robot guidance / AI-vision TAM, SAM, and SOM by workflow
      or end market.
    whyItMatters: >-
      Without a standalone category benchmark, underwriting must triangulate across adjacent markets and may overstate
      the revenue pool Mech-Mind can actually capture.
    diligencePath: >-
      Request bottoms-up pipeline or bookings by workflow, and locate any paid analyst coverage that explicitly sizes 3D
      robot-guidance software and camera attach rates.
    relatedQuestionRefs:
      - QM010
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: workflow-roi-and-attach-rate
    missingEvidence: >-
      Workflow-level ROI, deployment cycle time, win rate, and attach-rate data for Mech-Mind across automotive,
      electronics, and logistics.
    whyItMatters: >-
      Those metrics determine whether a large adjacent TAM converts into repeatable software-rich revenue or stays
      trapped in low-volume integration projects.
    diligencePath: >-
      Ask management for payback periods, gross-margin mix by software versus hardware, integrator attach rates, and
      pilot-to-production conversion by workflow.
    relatedQuestionRefs:
      - QM025
    relatedTableRefs:
      - TM004
  - type: private-evidence-only
    severity: minor
    topic: regional-and-vertical-revenue-mix
    missingEvidence: Revenue or bookings split by China versus overseas and by automotive, electronics, and logistics.
    whyItMatters: >-
      The company’s localization footprint suggests global ambition, but public evidence still does not show where
      revenue concentration or cyclicality is highest.
    diligencePath: >-
      Request regional bookings, installed-base concentration, and top-vertical mix from management or investor
      materials.
    relatedQuestionRefs:
      - QM025
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: >-
      Contract-level pricing, discounting, and deployment-cost structure for Mech-Mind, Photoneo, Keyence, Intrinsic,
      and other rivals.
    whyItMatters: >-
      Without realized commercial terms, it is hard to compare true ROI, gross-margin headroom, or competitive discount
      pressure across vendors.
    diligencePath: >-
      Request three recent customer proposals or SOWs from Mech-Mind plus side-by-side competitive quotes for the same
      workflow.
    relatedQuestionRefs:
      - QP017
      - QP025
    relatedTableRefs:
      - TP003
  - type: conflicting-data
    severity: material
    topic: deployment-scale
    missingEvidence: >-
      One reconciled install-base and active-customer count for Mech-Mind, broken out by cameras, workcells, and active
      production deployments.
    whyItMatters: >-
      Public sources support global reach but use different denominators, which limits precision when assessing market
      share and moat durability.
    diligencePath: >-
      Request the current audited installed base, active-customer count, and regional mix, with definitions for cameras,
      installations, and production lines.
    relatedQuestionRefs:
      - QP024
  - type: missing-source
    severity: material
    topic: competitive-win-loss
    missingEvidence: Named win-loss examples against Cognex, Keyence, Photoneo, Pickit, Roboception, and UR-ecosystem alternatives.
    whyItMatters: >-
      Moat durability is still inferred from product scope and ecosystem posture rather than from public proof of repeat
      wins against the strongest alternatives.
    diligencePath: >-
      Ask management for the last 20 competitive evaluations by workflow, including incumbent displaced, robot brand
      used, and reason won or lost.
    relatedQuestionRefs:
      - QP023
      - QP025
    relatedTableRefs:
      - TP004
  - type: private-evidence-only
    severity: blocking
    topic: revenue mix
    missingEvidence: >-
      Audited revenue by hardware, software, services, geography, and channel, plus realized ASPs and maintenance
      renewal data.
    whyItMatters: >-
      Without revenue mix and realized pricing, investors cannot judge recurring revenue quality, gross-margin
      durability, or valuation multiple relevance.
    diligencePath: >-
      Request audited income statements, product-level revenue breakdowns, maintenance-renewal cohorts, and current
      quote / discount schedules.
    relatedQuestionRefs:
      - QI021
      - QI022
    relatedTableRefs:
      - TI001
      - TI002
      - TI005
  - type: private-evidence-only
    severity: blocking
    topic: cash burn runway
    missingEvidence: Cash on hand, monthly burn, debt schedule, capex plan, and 12-to-24-month runway forecast.
    whyItMatters: >-
      Capital raised alone does not show whether Mech-Mind can fund growth through an IPO window or needs another
      private round.
    diligencePath: Request board materials or management reporting showing cash, burn, debt, capex, and base / downside runway.
    relatedQuestionRefs:
      - QI020
      - QI023
    relatedTableRefs:
      - TI003
      - TI004
      - TI005
  - type: conflicting-data
    severity: material
    topic: valuation path
    missingEvidence: >-
      A primary document showing the post-2022 valuation path, including the pricing of the 2025 round and any pre-IPO
      step-up.
    whyItMatters: >-
      The user asked whether later rounds made Mech-Mind a unicorn, but reviewed sources only verified the 2022 $858M
      anchor and low-confidence later commentary.
    diligencePath: >-
      Request signed round documents, cap-table history, or a prospectus / banker presentation showing valuation by
      financing event.
    relatedQuestionRefs:
      - QI017
    relatedTableRefs:
      - TI004
  - type: access-blocked
    severity: material
    topic: registry and audited filings
    missingEvidence: >-
      Publicly accessible Chinese annual reports, financial statements, or an actual Hong Kong prospectus / application
      proof.
    whyItMatters: IPO readiness depends on auditable disclosures, not only on media reports or vendor summaries.
    diligencePath: >-
      Pull the underlying Chinese registry annual reports directly or wait for a public HKEX filing / prospectus before
      final valuation work.
    relatedQuestionRefs:
      - QI018
      - QI024
      - QI025
    relatedTableRefs:
      - TI005
  - type: stale
    severity: material
    topic: pricing signal
    missingEvidence: A current 2025-2026 pricing benchmark versus foreign and domestic competitors.
    whyItMatters: >-
      The best public pricing proxy was a 2021 interview, which is too old to support present ASP or discount
      assumptions.
    diligencePath: >-
      Obtain recent quotes, partner price books, or customer proposals and compare them against current competitor
      offers.
    relatedQuestionRefs:
      - QI005
    relatedTableRefs:
      - TI002
  - type: missing-source
    severity: material
    topic: mech-recon
    missingEvidence: >-
      A current official page, datasheet, or release note that explicitly defines Mech-Recon's product scope and
      relation to the rest of the Mech-Mind stack.
    whyItMatters: >-
      Without a current authoritative description, buyers cannot tell whether Mech-Recon is a sellable module, a legacy
      label, or an internal component.
    diligencePath: >-
      Ask product management for the current module map, SKU sheet, and any customer-facing Mech-Recon documentation;
      reconcile it against the 2026 catalog and docs surface.
    relatedQuestionRefs:
      - QE025
    relatedTableRefs:
      - TE001
  - type: private-evidence-only
    severity: material
    topic: performance-proof
    missingEvidence: >-
      Independent customer data on realized cycle times, accuracy, false-positive rates, deployment duration, and module
      attach in production cells.
    whyItMatters: >-
      Many of the strongest speed and accuracy claims in public materials are vendor-provided, so underwriters still
      lack audited evidence on whether the economics scale across customer environments.
    diligencePath: >-
      Request reference calls, acceptance-test reports, and before/after KPI dashboards for at least one camera-only
      cell, one Mech-DLK deployment, and one Eye-Brain-Hand project.
    relatedQuestionRefs:
      - QE022
  - type: missing-source
    severity: material
    topic: software-security
    missingEvidence: >-
      Public trust-center or product-security artifacts describing deployment model, tenancy, SLAs, patch cadence, and
      attestations for the software stack.
    whyItMatters: >-
      Hardware certifications and troubleshooting guidance do not clear enterprise diligence on the software plane,
      especially for multiregion or high-availability deployments.
    diligencePath: >-
      Obtain security white papers, trust-center access, uptime commitments, and architecture review materials for
      Mech-Vision, Mech-Viz, Mech-DLK, and any hosted components.
    relatedQuestionRefs:
      - QE024
    relatedTableRefs:
      - TE004
  - type: stale
    severity: minor
    topic: 2026-launches
    missingEvidence: >-
      Post-launch GA datasheets, pricing, availability, and customer references for ULTRA M-GL, AIC-Lite GL, and
      Mech-Station InstaDepal after the AW 2026 preview cycle.
    whyItMatters: >-
      Preview-stage launches can look more mature than they are, and underwriting should distinguish shipped GA products
      from event-driven roadmap messaging.
    diligencePath: >-
      Re-fetch product pages, part-number sheets, and regional distributor materials after GA; ask sales for
      orderability, lead times, and first reference accounts.
    relatedQuestionRefs:
      - QE016
      - QE026
    relatedTableRefs:
      - TE005
  - type: private-evidence-only
    severity: material
    topic: named-account-verification
    missingEvidence: >-
      Top-20 customer list, three reference calls, and contract-level proof tying marquee OEMs or logistics/electronics
      leaders to Mech-Mind by name.
    whyItMatters: >-
      Public sources prove sector presence but do not establish whether marquee logos like BMW, SAIC, Geely, CATL, BYD,
      Foxconn, or JD Logistics are actual Mech-Mind customers.
