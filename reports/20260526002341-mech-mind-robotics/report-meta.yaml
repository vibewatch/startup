companyProfile:
  summary: Mech-Mind Robotics is a 2016-founded Chinese industrial AI company commercializing an Eye-Brain-Hand stack for robot guidance. It combines Mech-Eye sensing hardware, Mech-Vision and Mech-Viz software, and Mech-DLK deep-learning tooling to automate pick, place, depalletizing, machine-tending, assembly, and inspection workflows across factories and warehouses, but it still discloses far less than public-market investors would want on economics and control.
  foundedDate: '2016-09-12'
  founders:
    - name: Shao Tianlan
      role: Founder and CEO
      background: Tsinghua University software graduate with a Technical University of Munich robotics master's degree.
      claimRefs: [CO003, CO004]
    - name: Fu Ao
      role: Co-founder and Business VP
      background: Public 36Kr project materials identify him as the commercial-side co-founder.
      claimRefs: [CO005]
    - name: Ding Youshuang
      role: Co-founder and R&D Management VP
      background: Public 36Kr project materials identify him as an engineering-management co-founder.
      claimRefs: [CO006]
  foundingLocation: Beijing, China
  headquarters: Beijing, China
  productSummary: Mech-Mind sells Mech-Eye industrial 3D cameras and laser profilers, Mech-Vision perception software, Mech-Viz robot-planning software, Mech-DLK deep-learning tooling, and integrated Eye-Brain-Hand robot stations.
  customerFocus: Automotive, electronics and EV battery manufacturing, logistics and warehousing, and metals or machinery operators, often through system-integrator and robot-brand ecosystems.
  businessModel: Hybrid hardware-software-service deployments sold into industrial automation projects rather than pure stand-alone SaaS.
  stage: late-stage private
  fundingStatus: Latest public financing was an approximately CNY500 million Series E-II round in August 2025; official materials say total funding has reached about USD300 million or more than RMB2 billion, and media reports place the company in unicorn territory with a possible Hong Kong IPO.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO007, CO019, CI009, CV001, CV006, CV007, CV034]
