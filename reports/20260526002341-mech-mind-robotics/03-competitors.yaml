- id: product-breadth-and-deployment-model
  title: Product Breadth and Deployment Model
  body: 'Public evidence suggests that Mech-Mind is broader than most specialist 3D-guidance rivals, but narrower than the largest automation incumbents in channel reach. Its Chinese and English surfaces span industrial 3D cameras, laser profilers, Mech-Vision, Mech-Viz, Mech-DLK, Mech-MSR, and embodied robot stations, while the documentation footprint covers guidance, inspection, measurement, and robot communication. That is a wider public stack than Pickit or Roboception, which look more concentrated around picking and perception modules, and different from Photoneo’s emphasis on robot vision, bin picking, depalletization, and high-speed 3D cameras. Keyence and Cognex remain the benchmark incumbents because they pair broad machine-vision lineups with long-standing automation trust. Intrinsic is structurally different again: it competes by moving up the stack into skills, simulation, and digital-twin workflows that can run across third-party robots. The result is that Mech-Mind’s main advantage
    is not owning the robot arm, but reducing the number of separate vendors needed to stand up hard 3D-vision tasks on existing robot cells.'
