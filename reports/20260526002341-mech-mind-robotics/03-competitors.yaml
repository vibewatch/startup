  title: Eye-Brain-Hand is broader than a camera SKU
  body: Mech-Mind’s best public differentiation is not a single sensor spec. It is the way the company packages cameras, planning, deep learning, inspection, and embodied workcells into one robot-agnostic stack for hard 3D workflows.
  claimRefs:
