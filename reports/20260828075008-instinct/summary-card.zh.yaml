  topStrengths:
    - ARR 增速罕见：8 个月约 16× 增长（$5M → $80M ARR），说明早期用户里的产品市场匹配度很强。
    - 创始人技术差异化明显（Reflexion NeurIPS 2023），智能体记忆架构有防御性，通用模型不容易直接复刻。
    - 一线投资人组合（Index Ventures、Benchmark、Kleiner Perkins）给出强背书，也带来治理支持和后续融资通道。
    - SMS / WhatsApp 分发绕开 app store 摩擦，借现有消息应用装机基础推动病毒式增长。
    - 在完全自主的消费级 AI 智能体品类里，Instinct 已先于大科技公司跑出有意义规模，占住先发位置。
  topRisks:
    - 永久且不可撤销的数据许可，以及 OAuth 撤销后仍以明文留存邮件，让 Instinct 暴露在 GDPR、CCPA 和 FTC 执法风险下。
    - 已被验证的提示注入漏洞允许恶意邮件劫持 Instinct 的自主动作，安全与责任风险很高。
    - $2.5B 估值（约 31× ARR）对一款尚未正式发布、未披露单位经济的消费产品偏贵；隐私反弹可能迅速压缩倍数。
    - 23 岁首次担任 CEO，却已进入超常规模；在员工快速扩张和产品发布期，执行与治理风险上升。
    - Google、Apple、OpenAI 和 Microsoft 拥有原生平台集成和深度消费者分发，带来直接竞争风险。
  unresolvedGaps:
    - 定价模型和单位经济尚未公开；$80M ARR 口径无法核验。
    - 员工数、烧钱速度和盈利路径完全不透明。
    - 监管机构（FTC、EU AI Act）会如何回应自主绑定交易能力，仍不清楚。
    - 股权结构表、稀释历史和老股交易活动均不可得。
    - 企业转向潜力和 B2B 路线图（如有）尚未公开释放信号。
