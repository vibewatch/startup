- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Observed use case
  - Scale visibility
  - Revenue / strategic value
  - Gap
  rows:
  - - Tech-insider power users
    - Individual consumer / same person / same person
    - Delegates dense personal admin, travel, shopping, subscriptions, and email tasks through text
    - Named anecdotes only; no cohort size disclosed
    - High strategic value because this cohort generated the launch-week proofs of utility and likely much of the initial virality
    - Unknown how representative they are of mainstream consumers
  - - Founders, investors, and operators
    - Individual consumer using work-adjacent personal workflows
    - Uses Instinct for reservations, CRM follow-up, LP data rooms, and scheduling that blend work and personal life
    - Named anecdotes from a handful of public users
    - High signaling value because many of the loudest positive and negative posts came from this cohort
    - No evidence that enterprises buy the product or reimburse usage
  - - Household and family coordinators
    - Individual consumer / same person / same person
    - Tracks school schedules, homework reminders, bills, rides, appointments, and coordination across messaging apps
    - Visible only in anecdotes; no demographic breakout
    - Potentially large long-run consumer segment if trust and reliability improve
    - No evidence on retention, willingness to pay, or household multi-user behavior
  - - Privacy-sensitive mainstream consumers
    - Prospective consumer / same person / same person
    - May value convenience but hesitate to connect inbox, messages, credentials, and payments
    - Not observed directly because product is still gated
    - Large expansion pool if controls improve because AI-assistant adoption is already mainstream
    - Current beta evidence likely overstates willingness to grant broad permissions
  notes: Segmentation is inferred from named user anecdotes, official product positioning, and 2026 consumer-AI adoption benchmarks because Instinct discloses no demographic or customer-count breakdown.
