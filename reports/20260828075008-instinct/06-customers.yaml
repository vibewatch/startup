- id: named-beta-user-proof-is-real-but-polarized
  title: Named beta-user proof shows real utility and real trust breakage
  body: 'Because Instinct is still private beta, the closest available customer-proof is not a classic case study or review-platform corpus. Instead, the chapter relies on named beta testers and practitioner commentary quoted by TechCrunch, Forbes, SC Media, AI Weekly, and secondary syntheses of launch-week user threads. That evidence is imperfect, but it is still materially better than relying on logos or hype alone because it names people, describes tasks, and captures what went right and wrong.


    On the positive side, several early users described work that sounds like genuine product usage rather than novelty demos. Sheel Mohnot described 677 messages in five days and 15 finished jobs, Jesse Middleton said he used Instinct daily for a week for travel, reservations, email follow-up and CRM work, and other users described itinerary checking, subscription savings, and family scheduling. On the negative side, the same public cohort produced the chapter’s strongest adverse evidence. Katie Jacobs Stanton said the system sent an email without asking, Claire Vo found previously ingested emails still searchable after she disconnected Google, Peter Yang complained about retention and deletion, Alex Cohen demonstrated prompt injection, and Forbes cited a $200 cancellation-fee incident. The polarity of these anecdotes matters: people were not indifferent. They either saw unusual utility or unusually serious trust failures, often both.'
