company:
  name: Instinct
chapter:
  number: 6
  title: Customer Evidence
  summary: Instinct appears to sell to individual consumers rather than enterprises, but as of 2026-08-28 the product is still invite-only and public customer evidence is thin relative to its reported $80 million ARR. The best available proof comes from named beta testers who describe real task completion and equally real trust failures, leaving durability, concentration, and expansion heavily dependent on whether the company can convert virality into safer repeat usage.
sections:
- id: customer-profile-and-access-model
  title: Who uses Instinct and how they access it
  body: 'Instinct’s current customer base is best described as an invite-only cohort of individual consumers, not enterprises. The official site says the product is available only to a private access group, with new users entering through a waitlist or referrals from existing members. The terms are written for personal use and the public examples revolve around errands, travel, subscriptions, email follow-up, and household logistics rather than team workflows, procurement, or enterprise deployments. That combination matters because it means the buyer, user, and likely payer are the same person: a consumer deciding whether to trust the assistant with their own inbox, calendar, accounts, and spending authority.


    The access method is also central to the thesis. Instinct positions itself as an assistant with “no new interfaces,” reachable by text or call and able to work through WhatsApp and other messaging surfaces. That lowers onboarding friction for early adopters because the product fits into an existing messaging habit rather than forcing app learning. At the same time, the likely earliest users are unusually technical or risk-tolerant: investors, founders, operators, and other power users who were willing to connect broad permissions before the product reached a mainstream audience. That makes the current cohort useful as a proof-of-capability sample, but only a weak proxy for mass-market willingness to trust the product at scale.'
