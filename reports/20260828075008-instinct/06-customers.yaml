- id: adoption-trajectory-with-missing-denominators
  title: Adoption trajectory is strong on revenue but weak on denominators
  body: 'The headline customer signal around Instinct is not a disclosed user count or named account base; it is revenue. TechCrunch reported that the company told The Wall Street Journal it had reached about $80 million ARR by late August 2026, up from about $5 million in January 2026. On its face, that is extraordinary. A roughly 16x increase in under a year while the product remains private beta suggests that some users are paying meaningfully and that the product’s scope is broad enough to justify nontrivial spending. It also explains why investors were willing to support a $2.5 billion valuation before general release.


    But the denominator problem is severe. Instinct does not disclose how many users generate that ARR, how many are paying versus simply testing, what pricing tiers exist, or what portion of usage comes from a tiny, high-intensity cohort. Forbes reported the product was still free to use publicly and that no formal pricing had been announced, which deepens the opacity. The result is a split picture: revenue momentum is real enough to matter, yet adoption proof is still structurally incomplete. For diligence purposes, that means customer growth cannot be separated cleanly into retention, expansion, pricing, or new-user acquisition. Each of those could support the ARR story, but the company has not shown which one dominates.'
