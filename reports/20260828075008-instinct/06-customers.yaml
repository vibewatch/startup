  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: customer-count
    missingEvidence: Active users, paying users, waitlist size, invite conversion, and geographic split by month.
    whyItMatters: Without denominators, ARR growth cannot be translated into adoption breadth or market readiness.
    diligencePath: Request internal KPI dashboard exports for monthly active users, paying users, and invite funnel conversion.
    relatedQuestionRefs:
    - QU006
    - QU008
    - QU009
    relatedTableRefs:
    - TU002
  - type: private-evidence-only
    severity: material
    topic: named-customers
    missingEvidence: Named paying customer references, permissioned user interviews, and any case-study-quality testimonials.
    whyItMatters: Current customer proof relies on beta-tester anecdotes, which prove capability and trust issues but not durable commercial adoption.
    diligencePath: Request a customer reference list with usage duration, spending band, and permission to speak with at least three active users.
    relatedQuestionRefs:
    - QU010
    - QU019
    relatedTableRefs:
    - TU003
  - type: missing-source
    severity: material
    topic: retention-gap
    missingEvidence: Churn, cohort retention, renewal, WAU/MAU, task-success rates, and action-reversal rates.
    whyItMatters: Trust-heavy consumer software can show strong early monetization while still masking fragile repeat behavior.
    diligencePath: Request retention cohorts and complaint/postmortem metrics from the beta program, then compare them with expansion cohorts after privacy fixes.
    relatedQuestionRefs:
    - QU020
    - QU021
    relatedTableRefs:
    - TU004
  - type: missing-source
    severity: material
    topic: pricing-opacity
    missingEvidence: Public or private detail on pricing tiers, discounting, plan mix, refund policy, and how reported ARR is booked in beta.
    whyItMatters: Pricing opacity makes it impossible to determine whether ARR is driven by high ARPU, prepaid commitments, or broad willingness to pay.
    diligencePath: Request cohort-level pricing, billing cadence, and refund/chargeback data for all paying users.
    relatedQuestionRefs:
    - QU007
    - QU008
    - QU021
    relatedTableRefs:
    - TU002
    - TU004
  - type: enumeration-incomplete
    severity: material
    topic: concentration-risk
    missingEvidence: Revenue concentration by top users, share of ARR from invite-source cohorts, and segment-level ARPU.
    whyItMatters: An $80 million ARR figure from a private beta could be either a powerful PMF signal or a fragile concentration story.
    diligencePath: Request top-10, top-50, and top-decile revenue concentration plus churn histories for those cohorts.
    relatedQuestionRefs:
    - QU022
    - QU025
    relatedTableRefs:
    - TU005
