- id: durability-expansion-and-concentration-risk
  title: Durability is unproven and concentration risk is likely material
  body: 'Instinct has not disclosed the metrics normally used to judge customer durability: churn, cohort retention, renewal rates, repeat usage frequency, or revenue retention. That silence would be a moderate concern for a normal consumer product and a major concern for a product that asks for unusually broad permissions. Without customer counts or retention curves, the company’s reported ARR growth can support multiple contradictory stories: strong retention and word-of-mouth expansion, rapid acquisition masking churn, high prices charged to a small cohort, or some combination of the three. The absence of these denominators is itself one of the chapter’s most important findings.


    Expansion potential is nevertheless visible. Broad 2026 survey data shows that consumer AI adoption is already mainstream enough for a product like Instinct to have a real addressable market: nearly half of U.S. adults use AI chatbots, daily use has reached about one-quarter of adults, and commerce-oriented AI usage is rising quickly. However, the same datasets make clear why Instinct’s next challenge is trust, not awareness. Large majorities expect AI to make personal information less secure, over half of consumers trust AI less than humans with personal data, and meaningful shares already punish brands for AI-related data concerns by canceling or switching. For Instinct, that means the upside is substantial if it proves safer controls, but the downside is equally clear: $80 million ARR from a private beta with no user denominator strongly suggests early concentration risk, and negative word of mouth could constrain expansion before the product ever reaches the early majority.'
