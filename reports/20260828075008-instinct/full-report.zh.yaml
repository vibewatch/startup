  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              Instinct 的乐观逻辑建立在四个命题上：（1）消费者 AI 助理会成为主导的个人生产力入口，形成赢家通吃大半的市场；（2）Instinct 在 7 个月内 ARR 增长 16
              倍，显示出消费软件罕见的真实产品市场契合；（3）Noah Shinn 兼具学术 AI 可信度和消费产品直觉，23 岁就有这种组合极为少见；（4）手握 $350M 资本，Instinct
              有足够跑道在竞争对手抹平领先前完成商业化。反向逻辑同样有力：（1）未披露定价意味着 ARR 可能来自非经常性或促销安排；（2）Apple、Google、Microsoft
              等大型既有玩家拥有近乎无限的分发能力，可以用零边际 CAC 吸收 AI 助理需求；（3）AI 推理成本是结构性成本，除非谈降，否则会压缩毛利率；（4）2026 年 8 月的隐私反弹可能带来尚未反映在 ARR
              中的监管摩擦或流失风险。净结果是：这家公司正站在风险投资押注和战略平台风险的边界上。
