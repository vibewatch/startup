      - number: '8.4'
        title: 可比估值组
        blocks:
          - type: paragraph
            body: >-
              可比对象分三层：（1）直接面向消费者的 AI 助理（Perplexity AI、Character.AI）；（2）处于早期高速增长阶段的新一代消费 SaaS（Superhuman、Motion）；（3）AI
              原生横向平台（Scale AI、Cohere、Mistral）。没有一家上市公司可比对象能精确映射到 Instinct 的阶段和定位。私募轮次中，Perplexity AI 2024 年 4 月以 $1B
              估值融资，当时 ARR 约 $25-30M，隐含 33-40x ARR——高于 Instinct 的 31x，但 Perplexity 已推出付费层。Google 于 2024 年 9 月收购
              Character.AI，价格约 $2.7B，约为估计收入的 25x。Scale AI 2024 年 12 月 Series F 将公司估值定为 $13.8B，约 11x
              ARR——且有经审计财务和盈利的政府合同。Cohere 2024 年 6 月以 $5B 估值融资，当时 ARR 约 $200M（25x），并披露了 B2B 合同。若因 Instinct 变现不确定性打
              20-30% 折扣，公允价值为 $1.7-2.0B，而本轮价格为 $2.5B。
