  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义与边界
        blocks:
          - type: paragraph
            body: >-
              Instinct 竞争的是消费级 AI 个人助理市场，这属于更广义的智能虚拟助理行业。该市场包括能理解自然语言指令，并代表个人消费者自主执行
              排期、邮件管理、旅行预订、购买和信息检索等任务的软件产品。它不包括只面向企业的解决方案、没有行动能力的纯聊天机器人，也不包括缺乏深度 设备集成的纯语音智能音箱助理。核心参与者既有 Apple
              Siri、Google Assistant、Amazon Alexa、Microsoft Cortana、Samsung Bixby 等平台既有玩家，也有 Instinct、Rabbit r1、Humane AI
              Pin 等 AI 原生进入者。2025-2026 年市场变化的关键，是从被动问答助理转向 主动智能体系统：后者只需要最少用户确认就能自主行动。Instinct 处在消费端智能体转型的前沿，差异点是 SMS 和
              WhatsApp 入口、深权限模型 以及自主任务执行能力。市场边界在边缘地带较模糊：带 AI 功能的生产力 SaaS、浏览器自动化工具和 AI 编码助理，都与个人助理功能重叠，但主要用例
              不同。为估算市场规模，本分析聚焦主要以个人助理定位、且具备多领域任务执行能力的产品。
