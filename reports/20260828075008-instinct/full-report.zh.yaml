              在仍然仅限邀请的情况下，ARR 约八个月从 $5M 增至 $80M，说明产品市场契合度真实存在。这一增速——一年不到 16×——即便放在 2026 年消费级 AI 里也很罕见，也是支撑 $2.5 billion
              估值的主要财务依据。
