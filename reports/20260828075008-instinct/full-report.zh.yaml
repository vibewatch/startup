      - number: '3.2'
        title: 相邻替代品与专用工作流工具
        blocks:
          - type: paragraph
            body: >-
              下一圈竞争来自只解决 Instinct 部分工作、但不提供完整委托助理组合的产品。Claude 和 Perplexity 是这一组里最重要的广义替代品。Claude 在推理、
              写作和分析上很强，但其公开入口目前不像 Instinct 或 Operator 那样强调消费级任务执行。Perplexity 擅长搜索、研究和答案质量；对一些用户来说，
              这足以降低他们对更广义助理的需求，但它并不承诺自主收件箱、日历、购物和旅行管理。


              然后是专用工具。Superhuman 把邮件速度和体验做得很强。Motion 占住排期和时间分配。Cal.com 提供排期基础设施。这些公司重要，是因为它们说明即便 通用 AI
              变强，窄工作流软件仍然可以赢。专用工具更容易被信任、预算更清晰，也比一个触达所有事务的助理更容易做基准评估。


              对 Instinct 而言，竞争门槛是双面的。它必须在行动导向上胜过广义 AI 产品，同时在具体工作流可用性上胜过专用工具。这并非不可能，但比“通用工具打败点状工具” 的简单故事门槛更高。
