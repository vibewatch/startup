            body: >-
              Spear Street Technology Inc. 已完成两轮可识别融资。Series A 于 2026 年 1 月完成，规模 $100 million，由 Kleiner Perkins 领投， 合伙人
              Mamoon Hamid 获得董事会观察员或董事席位；Conviction Capital（Sarah Guo）参投。Series A 时，ARR 约 $5 million，隐含该轮 收入倍数约
              ~100×。Series B 于 2026 年 8 月 26 日完成，规模 $250 million，由 Index Ventures 和 Benchmark 共同领投，投后估值 $2.5
              billion。Series B 时，管理层口径 ARR 约 $80 million，隐含 ~31× ARR。Greenoaks Capital 也参与了 Series B。所有已披露轮次累计融资 $350
              million。种子轮或 pre-seed 信息没有公开披露。股权结构表、投资人持股比例和稀释安排均不可得。
