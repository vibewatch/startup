            calloutType: insight
            claimRefs:
              - CI001
              - CI007
              - CI032
  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: Instinct 在日常工作流中交付什么
        blocks:
          - type: paragraph
            body: >-
              Instinct 的定位是面向消费者的个人助理，生活在人们已经使用的渠道里，而不是要求用户学习新 app。官网称产品“无需新界面”，系统被训练为会使用手机和电脑， 用户可以给它发短信或打电话；第三方报道补充称
              WhatsApp 也是支持渠道。实际产品承诺不是用于信息检索的聊天，而是委托执行。公开描述的任务包括清理收件箱、
              起草跟进、预约、餐厅订位、旅行协调、叫车、购物，以及当智能体发现未完成线程时主动提醒。相同来源也清楚表明，Instinct 可以跨邮件、消息、日历、屏幕、
              音频和位置权限行动，这显著扩大了范围：它不只是助理，更像操作员。这种工作流设计在战略上有吸引力，因为它移除安装摩擦，并把许多杂务集中到一个对话入口；
              但产品质量也因此取决于不可见的后台决策，而不只是答案质量。用户同时购买便利和代理权转移，所以看似很小的控制失效——例如一封未授权邮件——都会变成一阶产品风险。
