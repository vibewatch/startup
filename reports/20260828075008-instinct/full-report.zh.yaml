      - number: '8.2'
        title: 估值语境与入场纪律
        blocks:
          - type: paragraph
            body: >-
              Instinct Series B 后 $2.5 billion 投后估值，对应管理层声称 $80M ARR 的 31x ARR 倍数。作为参照，历史上 Series B 阶段的消费软件独角兽中位数通常在
              10-20x ARR；在 2021 年市场高点，增长最快的消费 SaaS 前一成达到 30-50x ARR。当前 2026 年环境下，AI 原生软件享有结构性溢价。KPMG Venture Pulse Q2
              2026 报告称，AI 原生软件 Series B 中位数为 18-25x ARR；Instinct 的 31x 比该中位数高出 24-72%。关键担忧包括：（1）未验证 ARR
              降低了倍数分母的可信度；（2）未披露定价模型，未来 ARR 可持续性未知；（3）Series A 隐含 100x 倍数，造成显著稀释，限制 Series B 投资人的回报预期。按市价入场、参与 Series B
              后轮次，需要 5-7x 回报才能补偿风险溢价——只有乐观情景才可能做到。若因变现不确定性打 20-30% 折扣，公允价值为 $1.7-2.0B，而本轮价格为 $2.5B。
