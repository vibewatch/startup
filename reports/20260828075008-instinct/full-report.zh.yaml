        title: 财务风险与烧钱展望
        blocks:
          - type: paragraph
            body: >-
              Instinct 的核心财务风险集中在四点：（1）估值 $2.5 billion 时仍未披露变现模型，带来证明价格合理性的执行风险；（2）依赖未披露的 LLM 供应商，
              其定价或可用性可能不利变化；（3）烧钱速度未知，但考虑 AI 推理成本和工程团队人数，可能相当高；（4）消费级 AI 产品规模化变现历来困难。 公司已融资 $350 million，若假设每月烧钱 $3-7
              million（基于行业的估计），从 Series B 交割起现金跑道约 36-58 个月，足以支撑商业发布和首个 变现周期。然而，如果隐私反弹或竞争压力导致 ARR
              增长放缓，相对收入的烧钱速度可能更快变成问题。缺少审计财务报表或任何第三方财务认证，意味着所有
              现金跑道估计都高度不确定，只应视为指示性判断。反稀释条款、清算优先权等偏投资人的条款很可能存在，但完全未披露，这进一步限制了财务建模和退出情景 分析的精度。
