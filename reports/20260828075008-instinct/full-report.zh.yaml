      - number: '3.3'
        title: 分发力量、切换成本与定价压力
        blocks:
          - type: paragraph
            body: >-
              Instinct 最大的非产品差异点，是它通过 SMS 和 WhatsApp 触达用户，而不是 app 优先界面。这很重要，因为消费级助理的设置负担不只是创建账户，还有习惯养成。
              消息线程比下载并学习另一个应用更低摩擦。与此同时，渠道所有权仍在外部。Apple、Google、Microsoft、Meta 和 WhatsApp 控制主流设备、身份、应用商店和
              通信界面，进而影响发现和信任。它们也有能力把助理功能捆进用户已经付费的产品。


              这种捆绑能力会压低定价空间。OpenAI、Google、Microsoft 和 Claude 现在都销售付费 AI 套餐，验证了经常性支出，但也让用户习惯把多个助理并排比较。 Meta 则朝相反方向走，把 AI
              辅助免费化。在这种环境下，Instinct 大概率不能只靠价格取胜。它必须靠可感知的有用性取胜：省下足够时间或认知负担，让用户 在替代品充足时仍愿意单独付费。


              切换成本只是中等。许多用户仍会多平台并用，现状也很碎片化。这有助于 Instinct 获得试用，但除非助理深度嵌入敏感且可信的工作流，否则长期锁定更难。
