      - number: '5.5'
        title: 关键依赖、路线图不透明与技术尽调风险
        blocks:
          - type: paragraph
            body: >-
              对于一家年轻消费初创公司，产品外部依赖图谱异常重。即便供应商名单未披露，设计几乎必然依赖前沿 LLM API、消息传输供应商、OAuth 身份系统、Gmail 和 Calendar 基础设施、Microsoft
              Graph 式连接器、云计算，以及安全的 secret 或 token 存储。官网自己也承认，算力是当前放量门槛，因此在扩容时限制访问。与此同时，
              创始人的研究脉络比产品本身释放出更强的开发者信号：Reflexion 和 τ-bench 都有活跃公开仓库、可观 star 数，以及仍未关闭的 issue 队列；Instinct 除了很薄的 Hacker
              News 足迹外，几乎没有可比的公开工程界面。这种不对称很关键。它说明当前技术可信度更多建立在创始人先前成果上，而不是可观察的运营卓越上。真正未解的
              尽调项因此不是“能不能做出一个智能体助理”，而是“哪些模型和云供应商是集中风险点，存在哪些回滚和批准机制，还有哪些发布门槛，规模化时背着多少安全债”。
