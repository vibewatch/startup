      - number: '1.3'
        title: 融资历史、估值轨迹与投资人基础
        blocks:
          - type: paragraph
            body: >-
              即便按 2026 年 AI 初创公司标准，Instinct 的融资速度也异常快。从 2026 年初约 $50 million 的种子阶段估值出发， 公司先达到 $500 million Series A 估值（由
              Kleiner Perkins 的 Mamoon Hamid 领投），约六个月后又达到 $2.5 billion Series B 投后估值。2026 年 8 月 26 日 Series B 融资 $250
              million，由 Index Ventures 和 Benchmark 共同领投，累计融资增至 $350 million。早期支持者包括 Conviction Partners（Sarah
              Guo）、Greenoaks 和未披露的种子轮 参与方。未有债务工具、老股交易或授信额度公开披露。

              投资人层级值得注意。Index Ventures 和 Benchmark 是全球最挑剔的消费科技投资机构之一；Index 早期投过 Dropbox、Stripe、 Robinhood 等公司，Benchmark
              则领投过 Twitter、Snap、Uber 和 Discord。领投 Series A 的 Kleiner Perkins 同样支持过
              标志性科技公司。对于一家员工数未披露、定价未公开、产品仍在私测的非上市公司，这样的投资人阵容并不寻常，也反映出当前 消费级 AI 智能体交易流的竞争强度。

              值得注意的是，$2.5 billion 估值对应约 $80 million ARR，隐含收入倍数约 31× ARR；这一溢价与 2026 年增速最高的 AI 软件公司相符，但远高于 SaaS
              中位数倍数。该溢价已经计入显著的未来增长和成功变现，二者尚未以公开可见方式得到证明。 审计财务报表、单位经济模型或烧钱速度数据均未公开。
