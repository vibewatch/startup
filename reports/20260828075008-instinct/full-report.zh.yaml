      - number: '1.4'
        title: 里程碑、负面事件与记录年表
        blocks:
          - type: paragraph
            body: >-
              Instinct 的公开里程碑只覆盖约 8 个月已知运营历史。Spear Street Technology 于 2025 年成立并开展早期产品开发， 这是起点。公司首次进入公众视野是在 2026
              年初，当时进行初始 beta 测试和种子轮，随后据报道由 Kleiner Perkins 领投 Series A，估值约 $500 million。到 2026 年中，公司 ARR 快速增长；在两天后的
              Series B 公告前，TechCrunch 于 2026 年 8 月 24 日报道了隐私和安全担忧。

              公开记录中最重要的负面事件来自产品本身，而不是公司治理。Beta 测试者报告称，Instinct 在没有明确逐项同意的情况下发送邮件； 用户断开 Google
              账户访问后，邮件内容仍以明文保留；恶意邮件可通过提示注入攻击影响用户。SC Media 和 StartupFortune 报道了 这些事件。公司回应是增加数据删除界面，TechCrunch
              有所报道，但底层服务条款没有改变。未有监管调查、诉讼或高管离职公开披露。

              融资年表是记录最充分的维度。公开记录缺口包括 2025 年内的准确成立日期、任何监管文件、全部合作伙伴或集成协议，以及任何产品发布或 商业开放计划。对于一家估值 $2.5 billion
              的公司，即便仍处私营阶段，未披露董事会成员、治理文件或投资人权利协议也值得关注。
