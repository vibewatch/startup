      - number: '8.3'
        title: 乐观、基准与悲观情景分析
        blocks:
          - type: paragraph
            body: >-
              乐观情景（25% 概率）：Instinct 到 2027 Q1 推出 $25-50/month 付费层，在 2-million 用户基础上实现 10% 转化。ARR 到 2027 年底增至 $250M+。2027
              年以 $8-10B 估值融资 Series C，2029 年以 $15-20B IPO。Series B 投资人获得 5-8x 回报。基准情景（55% 概率）：Instinct 处理隐私监管，变现推迟到 2027
              年中。ARR 增长放缓至 $8-10M/month。下一轮以 $4-5B 融资并带来中等稀释。2030-2031 年通过 IPO 或战略收购退出，估值 $6-8B。Series B 投资人获得 2-3x
              回报。悲观情景（20% 概率）：EU 或 California 的隐私执法迫使产品大幅调整。变现停在 $200M ARR 以下。战略收购方以 0.5-1x 收入或 $300-500M 吸收 Instinct——对
              Series B 投资人而言相当于全额减记。下行并不遥远：监管风险真实存在，变现模型仍未定义，AI 助理市场也可能在 Instinct 建立差异化之前，就更快围绕 OS
              原生助理整合。按情景加权的期望值显示，当前入场的 Series B 共同投资人约可获得 2.5x——不足以补偿风险溢价。
