          - type: callout
            title: 变现缺口是核心阻断风险
            body: >-
              本分析中的每一种退出情景、每一个回报倍数、每一项增长假设，都取决于 Instinct 能否成功推出付费层，并留住足够数量的付费用户来支撑 $2.5B 估值。Instinct
