      - number: '5.4'
        title: 成熟度、信任与安全态势
        blocks:
          - type: paragraph
            body: >-
              Instinct 的成熟度信号是矛盾的：产品显然已足够可用，能让测试者满意并执行真实世界动作；但控制还不足以宣称达到生产级安全。多家独立报道描述，助理曾在没有
              明确逐项批准的情况下发送或准备邮件，遵循嵌入来信中的指令，并在 Google 访问被撤销后保留此前已索引内容。这些不是表层 bug。它们说明核心产品循环——读取、
              推断、行动——已经跑通，也说明其失败模式正是自主消费级智能体在全面开放前应该加固的部分。官方政策部分缩窄了训练问题，称 Google Workspace 数据不用于模型训练，
              也不用于第三方模型供应商的二次使用；但更广的隐私框架仍允许非 Workspace 材料在政策例外约束下用于改进产品和模型。同样重要的是，外部安全审计、认证、
              可用性指标或红队披露都没有公开证据。因此成熟度判断只能是“真实产品，控制平面不完整”：强于演示玩具，弱于能让消费者安全委托行动的操作系统。
