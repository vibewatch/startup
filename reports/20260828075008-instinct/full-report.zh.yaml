            - 设置
            - 工作区删除控制
        - label: 智能体推理层
          detail: 前沿 LLM 加上规划和执行逻辑，负责理解目标、选择工具并决定行动。
          modules:
            - 核心模型
            - 任务规划器
            - 行动策略
        - label: 记忆与索引层
          detail: 持久上下文和已索引的外部数据，支撑后续响应和跨会话连续性。
          modules:
            - 情景记忆
            - 可搜索索引
            - 对话上下文存储
        - label: 集成与执行层
          detail: 连接器把智能体意图转成电子邮件、日历、消息、商户或结账动作。
          modules:
            - Google Workspace 适配器
            - Microsoft 或 Outlook 适配器
            - 商户或结账动作
        - label: 后端基础设施层
          detail: Webhook 接收器、Pub/Sub 任务、token 存储和云计算，在用户两次交互之间维持智能体运转。
          modules:
            - Webhook 端点
            - 续期任务
            - 密钥或 token 保管库
            - 云计算
