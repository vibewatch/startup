      - number: '8.5'
        title: 退出准备度、尽调要求与投资逻辑失效触发器
        blocks:
          - type: paragraph
            body: >-
              退出路径包括：（1）IPO——如果 Instinct 建成清晰变现模型并达到 $300M+ ARR，2029+ 年可行；（2）战略收购——最可能由 Apple、Google、Microsoft 或
              Salesforce 出手，收购倍数为 5-10x 前瞻 ARR；（3）私募二级市场退出——随着公司成熟，2027-2028 年可能出现。任何投资决策之前，必须完成四项阻断事项：通过第三方审计独立验证
              ARR；完整披露定价模型和转化漏斗；法律审查 EU AI Act、UK DPA 和 California CPRA 合规；以及审查投资人权利协议中的清算优先权和反稀释条款。投资逻辑失效触发器包括：连续两个季度
              ARR 增长低于 $5M/month；任何主要司法辖区出现监管执法行动；CEO Noah Shinn 离职；或未能在 2027 Q2 前推出付费层。任一触发器出现，都应立即重新评估，不受 ARR 轨迹影响。
