      - number: '6.3'
        title: 具名 beta 用户证明了真实效用，也暴露了真实信任破裂
        blocks:
          - type: paragraph
            body: >-
              由于 Instinct 仍处于封闭 beta，最接近客户验证的材料不是传统案例研究，也不是评论平台语料。本章因此依赖 TechCrunch、Forbes、SC Media、AI Weekly 引述的具名 beta
              测试者和从业者评论，以及对发布周用户讨论串的二级梳理。这些证据并不完美，但仍明显强于只看客户标识或炒作：材料写出了人名、任务，也记录了成败。


              正面看，几位早期用户描述的不是新奇演示，而像真实使用。Sheel Mohnot 说 5 天内发了 677 条消息、完成 15 个任务；Jesse Middleton 说一周里每天用 Instinct
              处理旅行、预订、邮件跟进和 CRM；其他用户也提到检查行程、节省订阅费、安排家庭日程。负面看，同一批公开用户给出了本章最强的反向证据。Katie Jacobs Stanton
              称系统未经询问就发出邮件；Claire Vo 发现断开 Google 后，先前导入的邮件仍可搜索；Peter Yang 抱怨留存和删除；Alex Cohen 演示了提示词注入；Forbes 则提到一次产生
              $200 取消费的事件。这些轶事的正负分化很重要：用户不是无感，而是要么看到了少见效用，要么遇到了严重信任故障，很多时候两者同时存在。
