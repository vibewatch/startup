chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品与运营模式
        blocks:
          - type: paragraph
            body: >-
              Instinct 是一款 AI 个人助理，完全通过短信和电话运转——用户通过 SMS 或 WhatsApp 互动，让它预约、
              管理邮件、整理日历、安排旅行、处理购物、退订服务，并在已连接账户和设备之间代用户自主行动。公司的法律实体 Spear Street Technology Inc. 于 2025 年在加利福尼亚州注册。产品品牌为
              Instinct，官网是 instinct.co。

              运营模式权限很深：Instinct 连接用户的电子邮件账户、消息平台、日历、设备音频、位置数据和屏幕截图。集成完成后， 助理无需逐项确认即可自主执行任务。服务条款授予 Instinct
              一项“永久且不可撤销”的许可，可访问、存储、使用并修改 所有用户材料，包括用于 AI 训练——这一条款在 2026 年 8 月引发持续公开批评。早期反弹后，公司增加了数据删除工具， 但宽泛条款结构保留了下来。

              截至 2026 年 8 月，Instinct 仍处私测阶段——访问只靠邀请或候补名单。公司尚未公开定价、员工数或商业化上线日期。 即便尚未广泛开放，产品已拿到 $350 million
              风险资本，年经常性收入（ARR）约 $80 million。Instinct 总部位于 加利福尼亚州 San Francisco；具体办公地址未公开披露。公司称团队规模很小，成员主要来自 MIT 和企业 AI
              公司 Sierra 的前沿 AI 研究背景。
