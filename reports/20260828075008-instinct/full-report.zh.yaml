  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 直接对手与既有玩家标杆
        blocks:
          - type: paragraph
            body: >-
              Instinct 最接近的参照组不是所有聊天机器人，而是那些试图成为用户日常数字工作操作界面的产品。OpenAI Operator 是最清晰的直接标杆，因为它明确 承诺基于浏览器执行任务。Google
              Gemini、Apple Intelligence 和 Microsoft Copilot 稍有不同：它们是更广的生态或捆绑型助理，不是初创公司式单一产品；
              但从用户结果看，它们越来越多地覆盖同一组核心工作：起草、排期、总结，以及最终采取行动。Meta AI 属于同一个外圈，因为它让用户在消费级通信界面里 期待免费 AI 帮助。


              Humane 需要单独看。AI Pin 已经不是活跃竞争对手，但仍有战略意义，因为它同时证明了投资人对常开型助理产品的兴趣，以及消费者端的脆弱性。被 HP
              收购后的关停提醒市场：新奇感和宏大的助理叙事，不能弥补薄弱的产品循环。这个先例对 Instinct 重要，因为公司同样要求用户在主流证明出现前，先信任一种 新的委托形式。


              在这个参照组里，Instinct 的优势不是规模或品牌，而是聚焦：它是消息原生助理，目标是在真实账户里运转，不再等待持续确认。这让产品比许多既有玩家更像 智能体，但一旦信任破裂，暴露面也更大。
