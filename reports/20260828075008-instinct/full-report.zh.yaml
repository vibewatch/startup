      - number: '5.2'
        title: 推断的智能体架构与创始人技术脉络
        blocks:
          - type: paragraph
            body: >-
              Instinct 没有发布正式系统图，也没有点名模型供应商，因此公开技术画像只能从产品文案、法律披露和 Noah Shinn 过往研究中重构。这条脉络信息量异常高。 Shinn 的 Reflexion 论文和
              NeurIPS 海报描述了一个 actor-evaluator-reflector 循环：语言智能体从存入情景记忆的语言反馈中学习，而不是通过权重更新学习； τ-bench
              随后把这一世界观延展到动态、使用工具的对话中，并受 API 工具和政策规则约束。这些材料不能证明 Instinct 的内部实现，但强烈暗示产品并非只是 原始 LLM 套壳。最合理的公开解读，是一个分层栈：前沿
              LLM 作为推理底座，编排循环负责规划和工具选择，持久记忆 / 索引层承载跨会话上下文，再用集成适配器
              连接各项服务。官网承诺助理理解用户重视什么、跟进中断线程，并能长期代表用户行动，也进一步支撑这一推断。换句话说，可防守的技术点是有记忆支撑的代理能力， 而不只是把消息当作用户界面。
