      - number: '6.4'
        title: 持久性尚未验证，集中风险可能不低
        blocks:
          - type: paragraph
            body: >-
              Instinct
              未披露通常用来判断客户持久性的指标：流失、队列留存、续约率、重复使用频次或收入留存。对普通消费产品，这种沉默只是中等风险；对一个要求异常广泛权限的产品，这是重大风险。没有客户数或留存曲线，公司披露的 ARR
              增长可以讲出多种互相冲突的故事：留存强、口碑扩张；快速获客掩盖流失；对小规模队列收高价；或三者兼有。缺少这些分母，本身就是本章最重要的发现之一。


              不过，扩张空间确实可见。2026 年广泛调查显示，消费者 AI 采用已足够主流，Instinct 这类产品有真实可触达市场：近一半美国成年人使用 AI 聊天机器人，日使用率已接近成年人四分之一，面向交易的 AI
              使用也在快速上升。但同一批数据也说明，Instinct 下一关是信任，不是认知度。大多数人预计 AI 会让个人信息更不安全，超过半数消费者在个人数据上不如信任人类那样信任 AI，已有相当比例会因 AI
              数据担忧而取消或更换品牌。对 Instinct 而言，含义很直接：如果能证明控制更安全，上行空间很大；但下行同样清楚——封闭 beta 做到 $80 million
              ARR、却没有用户分母，强烈暗示早期集中风险；负面口碑可能在产品触达早期大众之前就压住扩张。
