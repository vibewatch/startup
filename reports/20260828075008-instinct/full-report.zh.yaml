            title: 永久数据许可和隐私架构是结构性负债
            body: >-
              Instinct 的服务条款授予公司对用户数据的永久、不可撤销许可，范围包括邮件内容、屏幕截图和键盘输入，即便服务终止后仍然适用。
              已有事件显示，产品曾未经同意自主发送邮件，并在权限撤销后继续保留数据，由此引发持续负面报道。这些是架构和法律设计选择，不是 bug； 一旦规模扩大，会带来重大监管和声誉敞口。
