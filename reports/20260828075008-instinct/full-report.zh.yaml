      - number: '2.4'
        title: 增长驱动因素与市场约束
        blocks:
          - type: paragraph
            body: >-
              市场增长由五个主要催化剂推动。第一，生成式 AI 能力提升后，自然语言理解和任务完成已经可靠到可以投入生产用例。第二，智能手机普及提供了设备底座 和联网能力，让随时可用的助理成为可能。第三，消费者通过
              ChatGPT 等产品熟悉 AI，AI 互动已被正常化，采纳摩擦下降。第四，远程和混合办公带来的 生产力压力，提高了对委托工具的需求。第五，Instinct 采用的 SMS
              和消息应用入口不需要用户学习新应用，降低了上手摩擦。市场约束包括：围绕 AI 智能体责任和数据保护的监管不确定性；高知名度 AI 失败事件之后的消费者信任缺口；Apple 和 Google
              的平台把关限制第三方助理能力；以及提示注入攻击等 削弱可靠性的安全漏洞。FTC 已释放信号，将加强审查代表消费者进入有约束力交易的 AI 智能体；EU AI Act 可能将自主个人助理归类为高风险系统，
              要求进行符合性评估。CCPA 和 GDPR 等隐私法规增加合规负担，并限制数据保留做法。市场轨迹很大程度取决于：智能体 AI 的信任缺口能否比监管约束 收紧更快闭合。
