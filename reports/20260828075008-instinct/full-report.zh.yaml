    title: 风险
    sections:
      - number: '7.1'
        title: 隐私、同意与监管暴露
        blocks:
          - type: paragraph
            body: >-
              Instinct 最核心的风险在于，它最强的产品特性——在邮件、日历、购物和消息工作流里自主行动——也正是最尖锐的监管和同意暴露来源。公开批评不只是泛泛讨论 AI
              幻觉，而是质疑这款助理能否以消费者未明确授权的方式行动、留存并再利用敏感用户信息。这形成典型的高信任 / 高责任风险画像。


              到 2026 年，政策背景已不再默认宽松。EU AI Act 已经生效，European Commission 也已进入透明度要求的主动执法阶段。GDPR
              仍然关键，因为个人助理会跨多个连接系统处理私密通信、元数据和行为语境。在美国，如果产品夸大安全性、错误描述删除或留存行为，或模糊用户同意边界，FTC 指引都给了监管机构多个抓手。


              结果未必是立即禁用，但合规成本、设计约束和执法可选项都会显著增加。产品建立在委托行动之上，信任和法律清晰度不能事后再补。
