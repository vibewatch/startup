      - number: '7.4'
        title: 执行、治理与综合判断
        blocks:
          - type: paragraph
            body: >-
              Instinct
              的执行风险更高，因为它的公开身份与一位年轻创始人、一个小团队，以及一个扩张速度可能快过可见治理结构的产品高度绑定。产品迭代阶段，这可能是优势；但公司一旦需要同时处理事故、监管、招聘、基础设施和公众信任，就会变成负担。除创始人主导的核心外，公开材料几乎看不到深厚管理梯队或成熟运营体系。


              整体风险图景的异常之处在于速度。上行路径要求持续增长和信任扩张；下行路径可能快得多：一次严重的隐私、删除或自主性事件，就可能在用户、媒体、合作伙伴和监管机构之间触发连锁反应。这种不对称，才是投资人应关注的重点。


              公开记录足以识别主要红旗，但不足以高精度框定财务或法律下行。因此，本章支持给出高风险评级和具体否决标准，而不是精确到数字的损失预测。
