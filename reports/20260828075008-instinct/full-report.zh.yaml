        title: 单位经济模型与利润率估计
        blocks:
          - type: paragraph
            body: >-
              由于 Instinct 没有披露定价、员工数或成本结构，所有单位经济模型分析只能基于行业基准，以及对可比消费级 AI 公司的推断。自主 AI 助理处理邮件、日历和 多步骤任务时，LLM 推理成本估计占收入的
              15-35%，依据是类似智能体产品公开的成本结构。若套用到 $80 million ARR，意味着年度 LLM 推理成本为 $12-28
              million。考虑到病毒式候补名单模式，获客成本（CAC）可能较低，但这一点带有推测性。不完全依赖基础设施的可比消费级 AI SaaS 企业毛利率在 50-75% 区间；Instinct
              推理强度更高，意味着更可能落在区间低端。净留存率未知；私测背景和未披露流失数据使分析无法展开。GTM 动作依赖病毒式分发和
              仅限邀请的候补名单，提示付费获客成本较低，但增长放大后的可预测性有限。销售周期未定义；未披露外呼或企业销售动作。GTM 效率指标——CAC 回本周期、 LTV/CAC 比率和渠道组合——在公开披露中完全缺席。
