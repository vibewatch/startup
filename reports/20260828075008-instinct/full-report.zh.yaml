      - number: '2.3'
        title: 市场分层与买家画像
        blocks:
          - type: paragraph
            body: >-
              消费级 AI 个人助理市场按任务类型、用户成熟度、隐私容忍度和付费意愿分层。按任务类型，市场分为排期和日历管理、邮件和沟通管理、旅行和物流、
              购物和购买、信息检索和研究，以及账单支付、订阅管理等生活行政事务。按用户成熟度，范围从只想简单问答的基础语音指令用户，到愿意授予广泛权限、
              让系统自主行动的高阶用户。按隐私容忍度，市场明显分裂：隐私敏感用户拒绝广泛数据访问，便利优先用户愿意用隐私换功能。按付费意愿，细分包括 只用免费层的用户、每月低于 10 USD
              的低价订阅者，以及愿意为全面辅助支付 20-50 USD 或更多的高端订阅者。Instinct 的目标细分似乎是 隐私容忍度高、付费意愿高的高阶用户，他们看重自主执行胜过逐步确认。该细分相对小，但随着生成式 AI
              让数据共享正常化，正在快速增长。 地理上，北美和西欧是主要市场，原因是智能手机渗透率、英语 AI 模型成熟度和消费能力；亚太地区绝对增量最快。年龄结构偏向 25-45 岁专业人士：
              日程复杂、有可支配收入，但没有专属真人助理。
