      - number: '5.3'
        title: 集成、传输通道与后台执行要求
        blocks:
          - type: paragraph
            body: >-
              尽管 Instinct 只明确点名部分合作伙伴，产品表面仍暗示其集成版图很广。隐私政策称 Google Workspace 访问范围可覆盖 Gmail、Calendar、Drive、Docs、
              Sheets、Slides 和 Tasks，服务条款提到 Apple、Facebook 和 Google 账户绑定，报道还补充了 Outlook 和 WhatsApp。公开平台文档有助于界定其运营含义。
              Gmail 和 Google Calendar 都支持基于 watch 的变更通知模型，但需要服务端 Pub/Sub 或 HTTPS webhook 基础设施，以及续订逻辑。Microsoft Graph 提供
              邮件和日历 API，可打通个人和组织 Outlook 账户。消息侧，WhatsApp Cloud API 将自由形式服务回复限制在 24 小时客服窗口内，而 Twilio 消息 API 提供外发、
              送达状态回调、脱敏和渠道抽象。合在一起看，Instinct 几乎必然在幕后依赖一层相当重的凭证、token 和回调系统。架构负担因此不在于生成文本，而在于安全持有
              委托权限、接收变更事件、决定何时行动，并在异构外部系统中从部分失败里恢复。
