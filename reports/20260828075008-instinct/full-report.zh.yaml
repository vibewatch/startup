      - number: '2.2'
        title: 市场规模与增长轨迹
        blocks:
          - type: paragraph
            body: >-
              2026 年，全球消费级 AI 个人助理市场估计达到 4.84 billion USD，相比 2025 年 3.4 billion USD 基线，复合年增长率为 42.2%。
              更广义的智能个人助理市场包括企业与混合部署，2026 年规模约 17.95 billion USD，CAGR 为 25.9%。市场预测显示，如果当前增速延续， 消费端到 2030 年将达到 19.6
              billion USD。由于“个人助理”和通用 AI 聊天机器人、专用生产力工具之间定义模糊，这些估计存在较大不确定区间。 Research and Markets 与 The Business Research
              Company 提供主要第三方规模估计，其方法将订阅收入、广告支持使用和硬件捆绑助理价值汇总。 总可用市场（TAM）代表理论上所有智能手机用户都采用付费 AI
              助理时的最大市场；可服务市场（SAM）缩小到已表现出为生产力委托付费意愿的用户； 可获取市场（SOM）则对应 2026-2027 年 具备深权限的智能体助理可触达市场。具体到
              Instinct，真正可触达的是愿意授予广泛设备权限，并为自主任务执行支付订阅费的消费者子集。 重视隐私的用户以及受监管行业中的用户，是这一可触达市场的结构性排除项。Instinct 在 8 个月实现 16x
              ARR 增长，要么说明其目标细分市场内 产品市场契合度异常强，要么是早期采用者激增，等候补名单清空后会回归常态。
