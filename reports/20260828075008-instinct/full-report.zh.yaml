      - number: '1.2'
        title: 创始人背景、技术脉络与团队构成
        blocks:
          - type: paragraph
            body: >-
              Noah Shinn 是 Instinct 唯一公开确认的创始人，也是 Spear Street Technology 的 CEO。2026 年 8 月 Series B 公告时，他 23 岁。Shinn 于
              2023 年从 Northeastern University 退学，此前也在 MIT 做过机器学习和编程语言研究。 之后他加入企业 AI 智能体公司 Sierra，是最早一批员工之一，职位为研究科学家。

              学术上，Shinn 最有辨识度的标签是 Reflexion 论文第一作者，该论文发表于 NeurIPS 2023。Reflexion 框架提出一种方法：
              语言智能体在任务失败后进行“口头反思”，把经验存入情景记忆，并在不进行模型微调的情况下改善后续尝试。该方法在 HumanEval 编码基准上取得 91% pass@1，明显高于当时 GPT-4 报告的
              80%。共同作者包括 Federico Cassano、 Ashwin Gopinath、Karthik Narasimhan 和 Shunyu Yao。Shinn 还共同开发了
              τ-bench，用来评估智能体处理真实用户互动、 工具调用和业务规则遵循的能力。以 Shinn 的年龄，这条从学术智能体研究、Sierra 企业部署到消费级产品的技术脉络， 是一项差异化资历。

              其他团队成员没有公开披露。公司材料称其为一支“小型 San Francisco 团队”，背景来自 MIT 和 Sierra，但本次查看的公开报道
              没有点名任何其他成员。董事会构成、投资人观察员和治理结构完全未披露。领导力高度集中，带来显著关键人依赖：公司的技术可信度、 投资人关系和产品愿景，在公开叙事里都系于一人，且没有清晰继任安排。
