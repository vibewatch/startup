      - number: '6.2'
        title: 采用轨迹：收入强，分母弱
        blocks:
          - type: paragraph
            body: >-
              Instinct 头部客户信号不是披露的用户数或具名客户基础，而是收入。TechCrunch 报道称，公司告诉 The Wall Street Journal，截至 2026 年 8 月下旬 ARR 已达到约
              $80 million，高于 2026 年 1 月约 $5 million。表面看，这极不寻常。产品仍处私测，却在一年不到实现约 16x 增长，说明部分用户正在支付
              可观金额，也说明产品范围足够广，能支撑不低的支出。这也解释了为什么投资人愿意在正式开放前支持 $2.5 billion 估值。


              但分母问题很严重。Instinct 没有披露多少用户贡献这部分 ARR，多少人在付费而非单纯测试，存在哪些定价层，或多少使用量来自一个很小但高强度的队列。 Forbes
              报道称，产品公开层面仍可免费使用，且尚未宣布正式定价，这进一步加深不透明。结果是一幅分裂图景：收入动能真实到足以重要，但采用证明在结构上
              仍不完整。尽调时，客户增长无法干净拆分为留存、扩张、定价或新用户获取。每一项都可能支撑 ARR 故事，但公司尚未说明哪一项占主导。
