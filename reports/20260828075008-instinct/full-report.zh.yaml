      - number: '7.2'
        title: 安全、提示词注入与技术控制风险
        blocks:
          - type: paragraph
            body: >-
              技术风险栈很重，因为自主助理一次性叠加了三个危险属性：吸收不可信输入，持有敏感上下文，还能调用工具。OWASP 和 2026
              年安全指引仍把提示词注入列为智能体系统风险清单首位。一个读取收件箱邮件或消息、再根据信号采取行动的助理，如果没有强权限边界、工具作用域和执行隔离，就会暴露在间接提示词注入之下。


              围绕 Instinct 的公开指控让这不再只是理论担忧。据报道的提示词注入漏洞，以及 OAuth 撤销后仍以明文留存，指向的正是自主助理最关键区域里的控制薄弱点。即便部分指控反映的是早期 beta
              状态，也足以说明容错空间有多窄。


              NIST 和 OWASP 都意味着，生产级控制应包括感知身份的访问边界、人工覆盖、删除可信度、日志记录和结构化风险审查。公开记录还不足以证明这些护栏已经把技术风险完全缓释。
