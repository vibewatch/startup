      - number: '8.6'
        title: 图表
        blocks:
          - type: callout
            title: 观察——不要按当前估值投资
            body: >-
              在 $2.5B 估值和 31x 未验证 ARR 下，Instinct 达不到 5 年 5x 风险调整回报的投资门槛。ARR
              由管理层声称且未验证；变现模型完全未披露；鉴于产品的邮件访问架构，监管风险结构性嵌入。具吸引力的入场需要独立验证 ARR、披露变现路线图，并把估值下调至约
              $1.2-1.5B。等变现得到证明、隐私合规解决后，再跟踪 Series C 入场。
            calloutType: recommendation
