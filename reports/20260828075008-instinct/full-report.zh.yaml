  - id: FE002
    title: 客户工作流 / 运行流程
    type: flow
    layout: wide
    summary: 用户提出请求后，系统检索上下文、自主执行，并在后续继续跟进；这是一个代表性旅程。
    data:
      nodes:
        - id: request
          label: 1. 用户给 Instinct 发短信或打电话
          detail: 无需安装新应用；对话从现有消息界面开始。
        - id: context
          label: 2. 智能体检索已连接上下文
          detail: 读取匹配的邮件、日历、消息或其他已连接数据。
        - id: plan
          label: 3. 智能体规划任务并选择工具
          detail: LLM 或编排器判断是起草、搜索、安排日程、购买还是跟进。
        - id: execute
          label: 4. 智能体在已连接服务上行动
          detail: 可能发送邮件、创建日程、预订，或下单。
        - id: notify
          label: 5. 用户收到结果或澄清请求
          detail: 结果回到消息线程或通话上下文中。
        - id: persist
          label: 6. 上下文保留下来，供后续跟进
          detail: 线程中断或外部更新到来后，系统可以重新介入。
      edges:
        - from: request
          to: context
          label: 意图已接收
        - from: context
          to: plan
          label: 检索匹配状态
        - from: plan
          to: execute
          label: 选择工具或行动路径
        - from: execute
          to: notify
          label: 返回结果或问题
        - from: notify
          to: persist
          label: 存储状态供后续使用
    approximationNotes: 流程抽象自官方文案和测试者报告暗示的常见运行模式；具体任务可能在执行前分支，或要求澄清。
