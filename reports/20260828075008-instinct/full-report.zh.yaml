      - number: '7.3'
        title: 商业模式、平台与竞争风险
        blocks:
          - type: paragraph
            body: >-
              Instinct 的商业风险离不开平台依赖。公司并不拥有交付成熟产品所需的主导操作系统、消息通道、邮件生态或模型供应链。Apple、Google、Microsoft、Meta/WhatsApp
              以及模型提供商都可以改变定价、政策、集成深度或默认设置，其中一些还是直接或邻近竞争对手。


              这种依赖进一步放大了商业模式的不确定性。公司必须说服用户在付费和信任上都达到高于纯聊天产品的水平，同时承担有意义的可变 AI 服务成本。大额融资有帮助，但不能让经济模型或分发永久安全。如果模型成本上升、API
              收紧，或打包进平台的既有玩家已经足够好，Instinct 的切入口会很快变窄。


              同样逻辑也适用于竞争。即便产品强，只要平台方把“足够安全”的体验打包进用户已经信任的界面，独立产品仍可能输掉。因此，平台权力是所有独立个人智能体的核心风险之一。
