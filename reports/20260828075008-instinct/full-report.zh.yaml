  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 谁在使用 Instinct，以及如何访问
        blocks:
          - type: paragraph
            body: >-
              Instinct 当前客户基础最准确的描述，是一个仅限邀请的个人消费者队列，而不是企业。官网称产品只向私有访问群体开放，新用户通过候补名单或现有成员推荐进入。
              服务条款面向个人使用，公开示例围绕跑腿、旅行、订阅、邮件跟进和家庭后勤，而不是团队工作流、采购或企业部署。这种组合很关键，因为它意味着买方、用户和
              可能的付款方都是同一个人：一个消费者在决定是否把自己的收件箱、日历、账户和支出权限交给助理。


              访问方式也是投资逻辑的核心。Instinct 将自己定位为“无需新界面”的助理，可通过短信或电话触达，并能通过 WhatsApp 等消息界面工作。这降低了早期采用者的
              上手摩擦，因为产品嵌入既有消息习惯，而不是强迫学习 app。同时，最早期用户很可能格外懂技术或更能承受风险：投资人、创始人、运营人员和其他高阶用户，
              愿意在产品触达主流受众前连接广泛权限。这让当前队列能作为能力证明样本，但只能弱代理大众市场在规模化时愿意信任产品的程度。
