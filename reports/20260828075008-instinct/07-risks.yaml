- id: execution-and-synthesis
  title: Execution, governance, and synthesis
  body: |-
    Execution risk is amplified because the public identity of Instinct is tightly bound to a single young founder, a small team, and a product that may be scaling faster than its visible governance structure. That can be a feature during product iteration, but it becomes a liability when the company must simultaneously manage incidents, regulators, hiring, infrastructure, and public trust. There is little public evidence of a deep management bench or mature operating system beyond the founder-led core.

    What makes the overall risk picture unusual is speed. The upside path requires sustained growth and expanding trust. The downside path can be much faster: one serious privacy, deletion, or autonomy incident can trigger a cascade through users, media, partners, and regulators. That asymmetry is what investors should focus on.

    The public record is sufficient to identify the main red flags, but not sufficient to bound downside financially or legally with high precision. That means the chapter supports a high risk rating with specific kill criteria rather than a numerically precise loss forecast.
