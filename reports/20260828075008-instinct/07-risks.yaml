chapter:
  number: 7
  title: Risks
  summary: 'Instinct carries an unusually concentrated risk stack for such an early-stage consumer company: high-severity privacy, consent, prompt-injection, and platform-dependency risks sit directly on top of its core product promise. The public evidence supports a high risk rating with explicit kill criteria around trust, deletion controls, regulator attention, partner access, and model-cost dependency.'
sections:
- id: privacy-and-regulatory
  title: Privacy, consent, and regulatory exposure
  body: |-
    Instinct's defining risk is that its strongest product feature—autonomous action inside email, calendar, shopping, and messaging workflows—is also the source of its sharpest regulatory and consent exposure. Public criticism is not about generic AI hallucinations alone. It is about whether the assistant can act, retain, and repurpose sensitive user information in ways consumers did not clearly authorize. That creates a classic high-trust/high-liability profile.

    The policy backdrop in 2026 is no longer permissive by default. The EU AI Act is now operative, and the European Commission has already moved into active enforcement of transparency requirements. GDPR remains relevant because a personal assistant processes intimate communications, metadata, and behavioral context across multiple connected systems. In the United States, FTC guidance gives regulators several hooks if the product overstates its safety, misstates deletion or retention behavior, or blurs user consent boundaries.

    The result is not necessarily immediate prohibition, but it is a meaningful increase in compliance cost, design constraint, and enforcement optionality. For a product built on delegated action, trust and legal clarity cannot be patched in later.
