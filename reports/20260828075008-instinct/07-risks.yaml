- id: business-and-platform
  title: Business-model, platform, and competitive risk
  body: |-
    Instinct's commercial risk is inseparable from platform dependence. The company does not own the dominant operating systems, messaging rails, email ecosystems, or model supply chain it needs to deliver a polished product. Apple, Google, Microsoft, Meta/WhatsApp, and model providers can all change pricing, policies, integration depth, or defaults. Some of those entities are also direct or adjacent competitors.

    That dependence compounds business-model ambiguity. The company must persuade users to both pay and trust at a level higher than a chat-only product requires, while also carrying meaningful variable AI serving costs. A large funding base helps, but it does not make the economics or distribution permanently safe. If model costs rise, APIs tighten, or bundled incumbents become good enough, Instinct's wedge can narrow quickly.

    The same logic applies competitively. A strong product can still lose if a safer-enough experience is bundled by a platform owner into a surface the user already trusts. Platform power is therefore one of the central risks to any standalone personal agent.
