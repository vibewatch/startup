  evidenceGaps:
  - type: missing-source
    severity: material
    topic: pricing-launch
    missingEvidence: A public pricing schedule, monetization explanation, or general-availability launch timeline for consumer access.
    whyItMatters: Without pricing and launch timing, it is impossible to judge revenue quality, support expectations, or whether current beta behavior is representative of the planned commercial product.
    diligencePath: Request the latest pricing deck, beta cohort monetization terms, and the internal launch readiness checklist tied to broader release.
    relatedQuestionRefs:
    - QE006
    relatedTableRefs:
    - TE005
  - type: missing-source
    severity: material
    topic: model-provider
    missingEvidence: Named production model vendor or vendors, model versions, fallback strategy, and whether critical reasoning runs on one provider or several.
    whyItMatters: Model concentration affects cost, latency, reliability, privacy architecture, and switching risk for the whole product.
    diligencePath: Ask management for current model-provider architecture, failover design, rate-limit posture, and data-processing terms with each provider.
    relatedQuestionRefs:
    - QE007
    relatedTableRefs:
    - TE003
  - type: missing-source
    severity: material
    topic: security-assurance
    missingEvidence: SOC 2 or equivalent audit reports, penetration-test summaries, red-team findings, incident response playbooks, and uptime or SLO disclosures.
    whyItMatters: An autonomous assistant with access to inboxes, calendars, purchases, and device context needs stronger evidence than legal terms to prove it is safe at scale.
    diligencePath: Request security assurance artifacts, the latest red-team memo, revocation and data-deletion verification design, and an incident history since beta launch.
    relatedQuestionRefs:
    - QE025
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: material
    topic: roadmap
    missingEvidence: Forward-looking milestones for general availability, user-control features, confirmation policies, approval modes, and reliability instrumentation.
    whyItMatters: Public readers can see the privacy backlash but not the concrete engineering plan for resolving it before broader release.
    diligencePath: Request the product roadmap, launch gates, bug backlog by severity, and the rollout plan for confirmation, rollback, and audit-log features.
    relatedQuestionRefs:
    - QE028
    relatedTableRefs:
    - TE005
  - type: missing-source
    severity: minor
    topic: instinct-developer-signal
    missingEvidence: Public SDKs, API docs, changelog posts, or engineering writeups from Instinct itself that would show ongoing practitioner engagement with the live product.
    whyItMatters: Current developer signal mostly comes from the founder’s prior research rather than from the production product, limiting visibility into maintainability and external scrutiny.
    diligencePath: Ask whether Instinct intends to publish engineering notes, trust updates, or a developer or control-plane surface as the product matures.
    relatedQuestionRefs:
    - QE029
    relatedTableRefs:
    - TE003
