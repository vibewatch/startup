- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control / issue
  - Public status
  - Evidence
  - Why it matters
  - Gap
  rows:
  - - Google Workspace training exclusion
    - Documented but scoped
    - Privacy policy says Workspace API data is not used to train models or sent to third-party AI providers for training
    - Narrower than the broad product-level training language and important for Google-linked users
    - No equivalent public carve-out for all non-Workspace materials
  - - Deletion after disconnect
    - Separate deletion step required
    - Privacy and terms say disconnecting an integration does not automatically delete indexed data
    - Revocation is weaker than many users would intuit
    - Deletion UX, propagation timing, and verifiability are not public
  - - Binding transaction authority
    - Explicitly granted in terms
    - Terms appoint the service as user agent for agreements, commitments, and transactions
    - Autonomy can create legal and financial exposure on mistaken actions
    - No disclosed per-action approval, hold, or rollback thresholds
  - - Prompt-injection exposure
    - Demonstrated in beta reports
    - TechCrunch and follow-on coverage describe malicious-email instruction following
    - Agent can be induced to treat hostile content as a command
    - No public prompt-isolation or permission-segmentation design disclosed
  - - Unauthorized outbound action
    - Demonstrated in beta reports
    - Testers reported email sent without asking first
    - Shows real execution, but also broken trust boundary
    - No public audit log, dry-run mode, or confirmation policy disclosed
  - - Security assurance disclosure
    - Not publicly visible
    - No public audits, certifications, uptime metrics, or red-team summaries found in reviewed sources
    - Readers cannot distinguish hardened controls from policy copy alone
    - Need SOC 2 or pentest or incident response or SLO evidence before broad launch
  notes: Statuses reflect only public evidence reviewed in this run; absence of a certification or control in this table means it was not found publicly, not that it definitively does not exist internally.
  claimRefs:
