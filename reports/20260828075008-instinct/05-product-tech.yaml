- id: integrations-transport-and-background-execution
  title: Integrations, transport rails, and background execution requirements
  body: The product surface implies a broad integration estate even though Instinct names only some partners explicitly. The privacy policy says Google Workspace access can cover Gmail, Calendar, Drive, Docs, Sheets, Slides, and Tasks, while the terms mention Apple, Facebook, and Google account linking and reporting adds Outlook and WhatsApp. Public platform documentation helps bound what this means operationally. Gmail and Google Calendar both support watch-based change notification models, but they require server-side Pub/Sub or HTTPS webhook infrastructure plus renewal logic. Microsoft Graph exposes mail and calendar APIs that can bridge both personal and organizational Outlook accounts. On the messaging side, WhatsApp Cloud API constrains free-form service responses to a 24-hour customer-service window, while Twilio’s messaging APIs provide outbound sends, delivery-state callbacks, redaction, and channel abstraction. Put together, this means Instinct almost certainly depends on a substantial
    credential, token, and callback layer behind the scenes. The architectural burden is therefore less about generating text than about securely holding delegated permissions, receiving change events, deciding when to act, and recovering from partial failures across heterogeneous external systems.
  claimRefs:
  - CE019
  - CE020
  - CE021
  - CE022
