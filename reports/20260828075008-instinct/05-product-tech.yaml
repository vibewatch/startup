figures:
- id: FE001
  title: Product architecture map
  type: stack
  layout: wide
  summary: Publicly inferable layers run from messaging UX through agent orchestration, memory, integrations, and backend callback infrastructure.
  data:
    layers:
    - label: Messaging interaction layer
      detail: Text, call, and reported WhatsApp entry points provide the only everyday user interface.
      modules:
      - SMS or text thread
      - Phone-call surface
      - WhatsApp conversation rail
    - label: Identity and control layer
      detail: Account linking, waitlist, settings, and workspace controls manage consent and revocation.
      modules:
      - Linked accounts
      - Settings
      - Workspace deletion controls
    - label: Agent reasoning layer
      detail: A frontier LLM plus planning and execution logic interprets goals, selects tools, and decides actions.
      modules:
      - Core model
      - Task planner
      - Action policy
    - label: Memory and indexing layer
      detail: Persistent context and indexed external data support follow-up behavior and cross-session continuity.
      modules:
      - Episodic memory
      - Searchable index
      - Conversation context store
    - label: Integration and execution layer
      detail: Connectors translate agent intent into email, calendar, messaging, merchant, or checkout actions.
      modules:
      - Google Workspace adapters
      - Microsoft or Outlook adapters
      - Merchant or checkout actions
    - label: Backend infrastructure layer
      detail: Webhook receivers, Pub/Sub jobs, token storage, and cloud compute keep the agent running between user turns.
      modules:
      - Webhook endpoints
      - Renewal jobs
      - Secret or token vault
      - Cloud compute
  approximationNotes: Instinct has not published a formal architecture diagram; this stack is synthesized from official copy, legal pages, Shinn’s prior research, and the required behavior of the cited integration platforms.
  claimRefs:
  - CE010
  - CE011
  - CE015
  - CE016
  - CE017
  - CE018
- id: FE002
  title: Customer workflow / operating flow
  type: flow
  layout: wide
  summary: Representative journey from a user request into context retrieval, autonomous execution, and later follow-up.
  data:
    nodes:
    - id: request
      label: 1. User texts or calls Instinct
      detail: No new app is required; the thread starts in an existing messaging surface.
    - id: context
      label: 2. Agent retrieves linked context
      detail: Reads relevant email, calendar, messaging, or other connected data.
    - id: plan
      label: 3. Agent plans task and selects tools
      detail: LLM or orchestrator determines whether to draft, search, schedule, buy, or follow up.
    - id: execute
      label: 4. Agent acts on connected services
      detail: May send mail, create events, make bookings, or place orders.
    - id: notify
      label: 5. User receives result or clarification
      detail: Outcome appears back in the message thread or call context.
    - id: persist
      label: 6. Context persists for later follow-up
      detail: The system can re-engage when threads are dropped or external updates arrive.
    edges:
    - from: request
      to: context
      label: intent received
    - from: context
      to: plan
      label: retrieve relevant state
    - from: plan
      to: execute
      label: choose tool or action path
    - from: execute
      to: notify
      label: return result or issue
    - from: notify
      to: persist
      label: store state for later
  approximationNotes: Workflow abstracts the common operating pattern implied by official copy and tester reports; specific tasks may branch or request clarification before execution.
  claimRefs:
  - CE001
  - CE004
  - CE006
  - CE021
  - CE025
  - CE029
