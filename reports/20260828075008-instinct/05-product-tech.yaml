- id: dependencies-roadmap-and-diligence-risks
  title: Critical dependencies, roadmap opacity, and technical diligence risks
  body: 'The product’s external dependency map is unusually heavy for a young consumer startup. Even without a disclosed vendor list, the design almost certainly relies on a frontier LLM API, messaging transport providers, OAuth identity systems, Gmail and Calendar infrastructure, Microsoft Graph-style connectors, cloud compute, and secure secret or token storage. The official site itself admits compute is a current gating factor by limiting access while scaling capacity. At the same time, the founder’s research lineage carries stronger developer signal than the product itself: Reflexion and τ-bench both have active public repositories, meaningful star counts, and still-open issue queues, while Instinct has little comparable public engineering surface beyond a thin Hacker News footprint. That asymmetry matters. It suggests technical credibility currently rests more on founder prior art than on observed operating excellence. The big unresolved diligence items are therefore not “can an agentic
    assistant be built?” but “which model and cloud vendors are concentration points, what rollback and approval mechanisms exist, what launch gates remain, and how much safety debt is being carried into scale.”'
