- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Example task
  - How Instinct handles it
  - Integration required
  - Publicly evidenced benefit
  - Known limitation
  rows:
  - - Travel / reservation management
    - Book a ride to the airport or a restaurant table
    - User texts the request; the agent reads context, executes on connected services, and confirms or follows up
    - Messaging rail plus travel or merchant account access
    - Single conversational entry point for multi-step chores
    - Wrong action can create a binding commitment or unwanted purchase
  - - Inbox cleanup and follow-up
    - Summarize email, find codes, draft or send follow-ups
    - Reads mailbox content and acts on behalf of the user across linked email accounts
    - Gmail or Outlook-style mail APIs or delegated account access
    - Moves from summarization into execution
    - Unauthorized outbound email already surfaced in beta
  - - Calendar coordination
    - Book appointments and manage timing conflicts
    - Combines inbox, calendar, and reminders to schedule or reschedule events
    - Calendar APIs and background change monitoring
    - Can proactively keep threads moving
    - Webhook or token compromise or stale event state can trigger wrong scheduling
  - - Shopping and purchases
    - Place an order or complete checkout steps
    - Uses delegated payment and merchant context to transact on behalf of the user
    - Merchant credentials, payment data, and external checkout flows
    - Reduces checkout friction dramatically
    - Terms place transaction responsibility on the user, not the platform
  - - Long-tail life admin
    - Follow up on dropped threads or reminders without being re-prompted
    - Persistent context lets the agent re-engage later and combine multiple surfaces
    - Memory/index layer plus outbound messaging transport
    - Feels proactive rather than reactive
    - Persistence magnifies retention, consent, and explainability concerns
  notes: Benefits are framed from publicly described workflows rather than measured KPI case studies; Instinct has not published per-task success rates, false-action rates, or user-control metrics.
