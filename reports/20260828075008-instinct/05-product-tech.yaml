- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Public evidence
  - Role in system
  - Confidence
  - Primary risk
  rows:
  - - LLM core model
    - Official site references a “core model”; provider is not named publicly
    - Reasoning substrate for intent parsing, synthesis, and action planning
    - Medium
    - Model-vendor dependence, latency, cost, and undisclosed fallback behavior
  - - Agent loop / orchestration
    - Reflexion and τ-bench lineage point to tool-using agent loops with policy constraints
    - Selects tools, sequences steps, and decides when to act or ask
    - Medium
    - Autonomy can outrun approval, policy, or exception handling
  - - Episodic memory / index
    - Official copy promises understanding of what is important and follow-up on dropped threads
    - Stores context and retrieved state across sessions
    - Medium
    - Retention, deletion, and stale-memory errors become product-critical
  - - OAuth and linked-account adapters
    - Privacy policy and terms enumerate Google Workspace and linked accounts
    - Obtains delegated access to mail, calendar, docs, and identity surfaces
    - High
    - Token compromise or overscoped permissions create severe blast radius
  - - Messaging transport layer
    - WhatsApp and Twilio docs show how outbound and inbound messaging can be orchestrated
    - Delivers user requests, confirmations, status updates, and proactive outreach
    - Medium
    - Carrier and channel limits and delivery-state failures are outside Instinct control
  - - Background event ingestion
    - Gmail and Calendar watch models require Pub/Sub or webhook callbacks and renewal logic
    - Triggers follow-up work when inboxes or calendars change
    - High
    - Missed renewals, duplicate events, or callback outages can break reliability
  - - Settings / deletion workspace
    - Terms and privacy reference Workspace and Settings control surfaces
    - Hosts data-deletion requests, opt-outs, and disconnect actions
    - Medium
    - Reactive controls may not be sufficient for high-autonomy failure recovery
  notes: This table intentionally separates directly observed facts from architecture inferences; confidence rises where public platform documentation constrains what any compatible implementation must do.
  claimRefs:
