callouts:
- calloutType: strength
  title: Distribution is the first real product advantage
  body: Instinct removes one of the largest adoption barriers for consumer assistants by living inside existing phone and messaging behavior instead of requiring a new app habit.
  claimRefs:
  - CE001
  - CE003
  - CE005
- calloutType: risk
  title: The delegated-action surface is ahead of the control surface
  body: Public evidence suggests the agent can already do the hard part—read and act across tools—but not yet the equally important part of consistently limiting, explaining, and reversing those actions.
  claimRefs:
  - CE004
  - CE030
  - CE033
  - CE035
  - CE037
- calloutType: assumption
  title: Architecture quality is inferred more than disclosed
  body: The founder’s research lineage gives a credible blueprint for how Instinct could work, but buyers still lack named production vendors, cloud topology, and safety-layer specifics.
  claimRefs:
  - CE015
  - CE043
  - CE045
