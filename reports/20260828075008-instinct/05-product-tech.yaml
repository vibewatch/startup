tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - What it does
  - User / surface
  - Maturity
  - Differentiation / diligence gap
  rows:
  - - Messaging interface rail
    - Receives user requests and sends follow-ups over text, call, and reported WhatsApp surfaces
    - End-user front end
    - Private beta, live with testers
    - No app download is a real UX differentiator; exact transport vendors are undisclosed
  - - Connected-account ingestion
    - Pulls context from email, messaging, calendar, and other linked services
    - User data and context layer
    - Private beta, permissions publicly documented
    - Depth of access is differentiated; scope governance and least-privilege design are not public
  - - Agentic action engine
    - Turns requests into bookings, purchases, scheduling moves, and outbound communications
    - Core execution layer
    - Functionally proven, control quality still immature
    - Autonomy is the headline feature; approval thresholds and rollback logic are undisclosed
  - - Memory / indexing layer
    - Stores prior context and indexed external data so the assistant can follow up on dropped threads
    - Personalization layer
    - Clearly active, governance challenged
    - Persistent memory appears central; deletion semantics became controversial in beta
  - - Background sync / notification layer
    - Monitors connected services for updates and triggers later work
    - Backend operations
    - Inferred from platform docs and product claims
    - Likely uses watch/webhook jobs; no public architecture or observability evidence
  - - Workspace / settings surface
    - Hosts account linking, deletion, and control settings outside the conversational thread
    - Admin / safety surface
    - Reactive public evidence only
    - Delete tool appears to have been added after complaints; audit-log visibility is absent
  notes: Rows combine official product copy, legal documents, integration-platform documentation, and adverse tester reporting; several backend layers are inferred because Instinct publishes no formal architecture diagram.
