companyProfile:
  summary: >-
    Instinct, operated by Spear Street Technology Inc. (California, 2025), is a
    consumer AI personal assistant accessed exclusively via SMS and WhatsApp. The
    product connects to users' email, calendar, messaging apps, audio, location,
    and screen, and executes tasks—booking, email management, scheduling, shopping—
    autonomously without requiring per-action user confirmation. Founded by Noah
    Shinn, a 23-year-old former Sierra research scientist and lead author of
    Reflexion (NeurIPS 2023), Instinct achieved viral traction in early 2026,
    growing ARR from ~$5 million in January 2026 to ~$80 million by August 2026.
    The company raised $250 million at a $2.5 billion post-money valuation in a
    Series B co-led by Index Ventures and Benchmark. The product remains in
    private beta and has attracted both significant user enthusiasm and serious
    adverse attention over privacy, security, and data-governance concerns.
  foundedDate: '2025-01-01'
  founders:
    - name: Noah Shinn
      role: Founder and CEO
      background: >-
        Former research scientist at Sierra (enterprise AI agents); lead author
        of Reflexion (NeurIPS 2023); MIT AI research; Northeastern dropout (2023).
      claimRefs: [CO007, CO008, CO009, CO012]
  foundingLocation: San Francisco, CA
  headquarters: San Francisco, CA
  productSummary: >-
    A consumer AI personal assistant delivered over SMS and WhatsApp. No app
    download required. Connects via OAuth to email (Gmail, Outlook, Apple Mail),
    calendar, and messaging apps; accesses device audio, location, and screen.
    Executes tasks autonomously: booking appointments, managing email, scheduling
    travel, and shopping—including entering binding transactions on the user's behalf.
  customerFocus: >-
    Tech-savvy consumers seeking autonomous task management; private beta invite-only
    as of August 2026.
  businessModel: >-
    Not publicly disclosed. Revenue likely subscription or per-task model; $80M ARR
    from private beta cohort suggests paid access or credit-based pricing, though
    terms have not been publicly announced.
  stage: Series B
  fundingStatus: >-
    $250 million Series B (August 26, 2026) co-led by Index Ventures and Benchmark
    at $2.5 billion post-money valuation; $100 million Series A (January 2026) led
    by Kleiner Perkins; total capital raised $350 million.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO003, CO004, CO005, CO006, CO007, CO015, CO016, CO017, CO018]
summary:
  headline: >-
    Instinct is a $2.5B consumer AI assistant with extraordinary ARR momentum but
    material privacy, security, and governance risks that make the valuation stretched
    at current evidence quality.
