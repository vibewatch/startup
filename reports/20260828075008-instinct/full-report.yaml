chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product, and operating model
        blocks:
          - type: paragraph
            body: >-
              Instinct is an AI-powered personal assistant that operates entirely through text messages and phone
              calls—users interact via SMS or WhatsApp, asking the assistant to book appointments, manage email,
              organize calendars, arrange travel, handle shopping, unsubscribe from services, and act autonomously on
              their behalf across connected accounts and devices. The company's legal entity, Spear Street Technology
              Inc., was incorporated in California in 2025. The product brand is "Instinct" and the official web
              presence is instinct.co.

              The operating model is deeply permissive: Instinct connects to users' email accounts, messaging platforms,
              calendar, device audio, location data, and screen captures. Once integrated, the assistant acts without
              per-action confirmation, executing tasks autonomously. The terms of service grant Instinct a "perpetual
              and irrevocable" license to access, store, use, and modify all user materials, including for AI training
              purposes—a provision that generated sustained public criticism in August 2026. The company added a data
              deletion tool after early backlash, but retained the broad terms structure.

              As of August 2026, Instinct remains in private beta—access is by invitation or waitlist only. The company
              has not publicly disclosed pricing, headcount, or a commercial launch date. The product has nonetheless
              attracted $350 million in venture capital and reached approximately $80 million in annual recurring
              revenue, a scale achieved without broad public availability. Instinct's headquarter address is San
              Francisco, California; no specific office address has been publicly disclosed. The company describes
              itself as having a small team, primarily drawn from advanced AI research backgrounds at MIT and the
              enterprise AI firm Sierra.
