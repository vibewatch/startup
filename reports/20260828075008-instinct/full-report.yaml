      - number: '1.3'
        title: Funding history, valuation trajectory, and investor base
        blocks:
          - type: paragraph
            body: >-
              Instinct's capital formation has been exceptionally rapid even by 2026 AI startup standards. From an
              approximate $50 million seed-stage valuation in early 2026, the company reached a $500 million Series A
              valuation (led by Kleiner Perkins' Mamoon Hamid) and then a $2.5 billion Series B post-money valuation in
              approximately six months. The August 26, 2026 Series B raised $250 million, co-led by Index Ventures and
              Benchmark, bringing total capital raised to $350 million. Early-stage backers include Conviction Partners
              (Sarah Guo), Greenoaks, and undisclosed seed participants. No debt facilities, secondary transactions, or
              credit lines have been publicly disclosed.

              The investor base is notable for its tier. Index Ventures and Benchmark are among the most selective
              consumer technology investors globally; Index has backed Dropbox, Stripe, Robinhood, and others from early
              stages, while Benchmark led investments in Twitter, Snap, Uber, and Discord. Kleiner Perkins, which led
              the Series A, has similarly supported iconic technology companies. For a pre-public company with no
              disclosed headcount, no public pricing, and a product still in private beta, this investor constellation
              is unusual and reflects the current intensity of competition for consumer AI agent deal flow.

              Notably, the $2.5 billion valuation at approximately $80 million ARR implies a revenue multiple of roughly
              31× ARR—a premium consistent with the highest-growth AI software companies in 2026 but well above median
              SaaS multiples. This premium prices in significant future growth and successful monetization, neither of
              which has yet been demonstrated in a publicly visible way. No audited financial statements, unit
              economics, or burn rate figures are publicly available.
