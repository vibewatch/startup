  - id: FU004
    title: Retention / repeat cohort
    type: cohort
    layout: standard
    summary: >-
      Illustrative scenarios show how many different retention paths could still fit the same ARR headline when user
      counts and cohorts are undisclosed.
    data:
      columns:
        - Month 1
        - Month 3
        - Month 6
      rows:
        - label: High-retention + steady adds
