      - number: '5.2'
        title: Inferred agent architecture and founder technical lineage
        blocks:
          - type: paragraph
            body: >-
              Instinct does not publish a formal systems diagram or name its model provider, so the public technical
              picture has to be reconstructed from the product copy, legal disclosures, and Noah Shinn’s prior research.
              That lineage is unusually informative. Shinn’s Reflexion paper and NeurIPS poster describe an
              actor-evaluator-reflector loop where language agents learn from linguistic feedback stored in episodic
              memory instead of weight updates; τ-bench then extends that worldview into dynamic, tool-using
              conversations constrained by API tools and policy rules. Those artifacts do not prove Instinct’s internal
              implementation, but they strongly suggest that the product is not just a raw LLM wrapper. The most
              plausible public interpretation is a layered stack with a frontier LLM as reasoning substrate, an
              orchestration loop for planning and tool selection, a persistent memory/index layer for cross-session
              context, and integration adapters for each connected service. That inference is further supported by the
              official promise that the assistant understands what matters to the user, follows up on dropped threads,
              and can act on their behalf over time. In other words, the defensible technical idea is memory-backed
              agency, not simply messaging as a user interface.
