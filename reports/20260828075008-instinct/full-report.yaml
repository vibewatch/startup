              - CV028
              - CV029
      - number: '8.5'
        title: Exit Readiness, Diligence Asks, and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              Exit pathways include: (1) IPO — viable in 2029+ if Instinct achieves $300M+ ARR with a clear monetization
              model; (2) strategic acquisition — most likely by Apple, Google, Microsoft, or Salesforce, with
              acquisition multiples of 5-10x forward ARR; (3) private secondary market exit — possible in 2027-2028 as
              the company matures. Before any investment decision, four blocking items must be completed: independent
              ARR verification via third-party audit; full disclosure of the pricing model and conversion funnel; legal
              review of EU AI Act, UK DPA, and California CPRA compliance; and investor rights agreement review for
              liquidation preferences and anti-dilution. Thesis-break triggers include: ARR growth below $5M/month for
              two consecutive quarters; regulatory enforcement action in any major jurisdiction; departure of CEO Noah
              Shinn; or failure to launch a paid tier by Q2 2027. Any of these triggers should prompt immediate
              re-evaluation regardless of ARR trajectory.
            claimRefs:
              - CV033
              - CV034
              - CV035
              - CV036
              - CV037
              - CV038
              - CV039
              - CV040
          - type: table
            tableRef: TV005
            claimRefs:
              - CV033
              - CV034
              - CV035
              - CV036
          - type: table
            tableRef: TV006
            claimRefs:
              - CV037
              - CV038
              - CV039
              - CV040
      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Track — do not invest at current valuation
            body: >-
              At $2.5B valuation and 31x unverified ARR, Instinct does not clear the investment bar for a risk-adjusted
              return of 5x in five years. The ARR is management-stated and unverified; the monetization model is
              entirely undisclosed; and regulatory risk is structurally embedded given the product's email-access
              architecture. A compelling entry would require independent ARR verification, disclosure of a monetization
              roadmap, and a valuation step-down to approximately $1.2-1.5B. Track for a Series C entry once
              monetization is demonstrated and privacy compliance is resolved.
            calloutType: recommendation
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV017
              - CV033
          - type: callout
            title: Monetization gap is the central blocking risk
            body: >-
              Every exit scenario, every return multiple, and every growth assumption in this analysis depends on
              Instinct successfully launching a paid tier and retaining paying users in sufficient volume to justify the
              $2.5B valuation. Instinct has no disclosed pricing, no disclosed conversion path, and no disclosed
              commitment from its current user base to pay. This single gap makes the investment uninvestable at current
              valuation for any fund with a DPI mandate.
            calloutType: risk
            claimRefs:
              - CV013
              - CV014
              - CV021
              - CV036
