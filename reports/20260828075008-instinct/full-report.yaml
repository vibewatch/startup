  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: What Instinct delivers in day-to-day workflow terms
        blocks:
          - type: paragraph
            body: >-
              Instinct is positioned as a consumer personal assistant that lives inside channels people already use
              instead of asking them to learn a new app. The official site says there are “no new interfaces,” that the
              system is trained to use a phone and a computer, and that users can text or call it; third-party reporting
              adds WhatsApp as a supported channel. In practice, the product promise is not chat for information
              retrieval, but delegated execution. Publicly described tasks include inbox cleanup, follow-up drafting,
              appointment booking, restaurant reservations, travel coordination, ride booking, shopping, and proactive
              reminders when the agent notices unfinished threads. The same sources also make clear that Instinct can
              act across email, messaging, calendar, screen, audio, and location permissions, which materially expands
              the scope from an assistant to an operator. That workflow design is strategically attractive because it
              removes install friction and centralizes many chores into one conversational surface, but it also means
              product quality depends on invisible background decisions, not just answer quality. The user therefore
              buys convenience and agency transfer at the same time, which is why seemingly small control failures—like
              one unauthorized email—become first-order product risks.
