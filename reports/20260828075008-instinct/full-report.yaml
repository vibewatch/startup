      - number: '1.4'
        title: Milestones, adverse events, and chronology of record
        blocks:
          - type: paragraph
            body: >-
              Instinct's public milestone record covers roughly 8 months of known operating history. The founding of
              Spear Street Technology in 2025 and early product development represent the origins. The company's first
              public visibility came in early 2026 with initial beta testing and a seed round, followed by a Series A
              reportedly led by Kleiner Perkins at roughly a $500 million valuation. By mid-2026 the company was growing
              ARR rapidly, and TechCrunch reported privacy and security concerns in its August 24, 2026 coverage before
              the Series B announcement two days later.

              The most material adverse events in the public record relate to the product itself rather than corporate
              governance. Beta testers reported that Instinct sent emails without explicit per-action consent, retained
              email content in plain text after users disconnected Google account access, and exposed users to prompt
              injection attacks via malicious emails. SC Media and StartupFortune covered these incidents. The company's
              response—adding a data deletion interface—was reported by TechCrunch but did not change the underlying
              terms of service. No regulatory investigations, lawsuits, or leadership departures have been publicly
              disclosed.

              The funding chronology is the most well-documented dimension. The gap in the public record includes the
              exact founding date within 2025, any regulatory filings, all partner or integration agreements, and any
              product launch or commercial opening plans. The absence of named board members, governance documents, or
              investor rights agreements is notable for a $2.5 billion company, even at the private stage.
