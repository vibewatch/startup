      - number: '7.2'
        title: Security, prompt injection, and technical control risk
        blocks:
          - type: paragraph
            body: >-
              The technical risk stack is serious because autonomous assistants combine three dangerous properties at
              once: they ingest untrusted inputs, they hold sensitive context, and they can call tools. OWASP and 2026
              security guidance still place prompt injection at the top of the risk list for agentic systems. An
              assistant that reads inbound emails or messages and then acts on those signals is exposed to indirect
              prompt injection unless it has strong permission boundaries, tool scoping, and execution isolation.


              The public allegations around Instinct make this more than a theoretical concern. Reported
              prompt-injection vulnerability and plain-text retention after OAuth revocation point to control weaknesses
              in exactly the areas that matter most for an autonomous assistant. Even if some allegations reflect
              early-beta conditions, they still demonstrate how narrow the margin for error is.


              NIST and OWASP both imply that production-grade controls should include identity-aware access boundaries,
              human override, deletion confidence, logging, and structured risk review. The public record does not yet
              show enough of those safeguards to treat the technical risk as fully mitigated.
            claimRefs:
              - CR009
