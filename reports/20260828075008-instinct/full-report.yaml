  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Privacy, consent, and regulatory exposure
        blocks:
          - type: paragraph
            body: >-
              Instinct's defining risk is that its strongest product feature—autonomous action inside email, calendar,
              shopping, and messaging workflows—is also the source of its sharpest regulatory and consent exposure.
              Public criticism is not about generic AI hallucinations alone. It is about whether the assistant can act,
              retain, and repurpose sensitive user information in ways consumers did not clearly authorize. That creates
              a classic high-trust/high-liability profile.


              The policy backdrop in 2026 is no longer permissive by default. The EU AI Act is now operative, and the
              European Commission has already moved into active enforcement of transparency requirements. GDPR remains
              relevant because a personal assistant processes intimate communications, metadata, and behavioral context
              across multiple connected systems. In the United States, FTC guidance gives regulators several hooks if
              the product overstates its safety, misstates deletion or retention behavior, or blurs user consent
              boundaries.


              The result is not necessarily immediate prohibition, but it is a meaningful increase in compliance cost,
              design constraint, and enforcement optionality. For a product built on delegated action, trust and legal
              clarity cannot be patched in later.
            claimRefs:
