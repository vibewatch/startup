  - id: FE001
    title: Product architecture map
    type: stack
    layout: wide
    summary: >-
      Publicly inferable layers run from messaging UX through agent orchestration, memory, integrations, and backend
      callback infrastructure.
    data:
      layers:
        - label: Messaging interaction layer
          detail: Text, call, and reported WhatsApp entry points provide the only everyday user interface.
          modules:
            - SMS or text thread
            - Phone-call surface
            - WhatsApp conversation rail
        - label: Identity and control layer
          detail: Account linking, waitlist, settings, and workspace controls manage consent and revocation.
          modules:
            - Linked accounts
            - Settings
            - Workspace deletion controls
        - label: Agent reasoning layer
          detail: A frontier LLM plus planning and execution logic interprets goals, selects tools, and decides actions.
          modules:
            - Core model
            - Task planner
            - Action policy
        - label: Memory and indexing layer
          detail: Persistent context and indexed external data support follow-up behavior and cross-session continuity.
          modules:
            - Episodic memory
            - Searchable index
            - Conversation context store
        - label: Integration and execution layer
          detail: Connectors translate agent intent into email, calendar, messaging, merchant, or checkout actions.
          modules:
            - Google Workspace adapters
            - Microsoft or Outlook adapters
            - Merchant or checkout actions
        - label: Backend infrastructure layer
          detail: Webhook receivers, Pub/Sub jobs, token storage, and cloud compute keep the agent running between user turns.
          modules:
            - Webhook endpoints
            - Renewal jobs
            - Secret or token vault
            - Cloud compute
    approximationNotes: >-
      Instinct has not published a formal architecture diagram; this stack is synthesized from official copy, legal
      pages, Shinn’s prior research, and the required behavior of the cited integration platforms.
