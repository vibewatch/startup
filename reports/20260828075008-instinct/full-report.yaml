        - label: User backlash
          id: users
        - label: Media amplification
          id: media
        - label: Partner scrutiny
          id: partners
        - label: Regulator interest
          id: regulators
        - label: Churn / growth slowdown
          id: revenue
      edges:
        - from: incident
          to: users
