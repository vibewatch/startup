          - type: callout
            title: Perpetual data license and privacy architecture are structural liabilities
            body: >-
              Instinct's terms of service grant the company a perpetual, irrevocable license to user data including
              email content, screen captures, and keyboard inputs, even after service discontinuation. Documented
              incidents of autonomous email-sending without consent and data retention after permission revocation have
              generated sustained negative coverage. These are architectural and legal design decisions, not bugs, and
              they create material regulatory and reputational exposure at scale.
