      - number: '8.2'
        title: Valuation Context and Entry Discipline
        blocks:
          - type: paragraph
            body: >-
              Instinct's $2.5 billion post-money valuation at Series B implies a 31x ARR multiple on management-stated
              $80M ARR. For context, the median consumer software unicorn at Series B has historically traded at 10-20x
              ARR; the top decile of hypergrowth consumer SaaS reached 30-50x ARR at peak market conditions in 2021. In
              the current 2026 environment, AI-native software commands a structural premium. KPMG Venture Pulse Q2 2026
              reports median Series B multiples of 18-25x ARR for AI-native software; Instinct at 31x is 24-72% above
              this median. Key concerns include: (1) unverified ARR reduces confidence in the denominator of the
              multiple; (2) no pricing model means future ARR sustainability is unknown; (3) the Series A implied a 100x
              multiple, creating significant dilution that limits return expectations for Series B investors. A
              mark-to-market entry joining post-Series B would need a 5-7x return to justify the risk premium —
              achievable only in the bull scenario. Applying a 20-30% discount for monetization uncertainty implies fair
              value of $1.7-2.0B, versus the $2.5B round price.
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
