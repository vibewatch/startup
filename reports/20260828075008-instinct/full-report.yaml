        title: Exhibits
        blocks:
          - type: callout
            title: Exceptional ARR growth in private beta
            body: >-
              Growing from $5M to $80M ARR in approximately eight months while remaining invite-only signals genuine
              product-market fit. This growth rate—16× in under a year—is exceptional even for consumer AI in 2026 and
              provides the primary financial basis for the $2.5 billion valuation.
            calloutType: strength
