            - Low-medium
            - High
        - label: Platform / provider dependency
          values:
            - Medium
            - High
            - Low
            - High
        - label: Execution / governance
          values:
            - Medium
            - High
            - Low
            - High
    approximationNotes: Cells are ordinal descriptors synthesized from public evidence and 2026 governance reports.
    claimRefs:
