      - number: '8.4'
        title: Comparable Valuation Set
        blocks:
          - type: paragraph
            body: >-
              The relevant comparable set spans three tiers: (1) direct consumer AI assistants (Perplexity AI,
              Character.AI); (2) next-generation consumer SaaS at early hypergrowth stages (Superhuman, Motion); and (3)
              AI-native horizontal platforms (Scale AI, Cohere, Mistral). No public company comparables exist that map
              precisely to Instinct's stage and positioning. Among private rounds, Perplexity AI raised at $1B valuation
              in April 2024 at approximately $25-30M ARR, implying 33-40x ARR — above Instinct's 31x but with a launched
              paid tier. Character.AI was acquired by Google in September 2024 at approximately $2.7B, representing ~25x
              estimated revenue. Scale AI's Series F in December 2024 valued the company at $13.8B at ~11x ARR — with
              audited financials and profitable government contracts. Cohere raised at $5B valuation in June 2024 at
              approximately $200M ARR (25x) with disclosed B2B contracts. Applying a 20-30% discount for Instinct's
              monetization uncertainty implies fair value of $1.7-2.0B versus the $2.5B round price.
            claimRefs:
              - CV025
              - CV026
              - CV027
              - CV028
              - CV029
              - CV030
              - CV031
              - CV032
