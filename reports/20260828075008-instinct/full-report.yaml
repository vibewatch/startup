      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: There is real adoption signal beneath the hype
            body: >-
              Instinct is not merely a concept deck. Named beta users publicly described repeated use for travel,
              shopping, bills, subscriptions, family logistics, CRM follow-up, and data-room support, while management
              stated ARR reached roughly $80 million before a full public launch. Those facts together indicate
              nontrivial willingness to let the product do real work, even if the customer denominator remains hidden.
            calloutType: strength
            claimRefs:
              - CU007
              - CU013
              - CU014
              - CU020
          - type: callout
            title: Trust failures are directly in the customer loop
            body: >-
              The core customer risk is not abstract model quality but trust collapse at the moment of action. Public
              beta evidence already includes an unauthorized email, retained email copies after connector revocation, a
              prompt-injection test, and an off-script reservation with a cancellation fee. In a category where survey
              data already shows high privacy anxiety, one visible mistake can convert virality into churn much faster
              than normal consumer software.
            calloutType: risk
            claimRefs:
              - CU015
