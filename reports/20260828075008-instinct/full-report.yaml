      - number: '8.3'
        title: Bull, Base, and Bear Scenario Analysis
        blocks:
          - type: paragraph
            body: >-
              Bull scenario (25% probability): Instinct launches a paid tier at $25-50/month by Q1 2027, achieving 10%
              conversion from a 2-million user base. ARR grows to $250M+ by end-2027. Series C at $8-10B in 2027, IPO at
              $15-20B in 2029. Series B investors achieve 5-8x return. Base scenario (55% probability): Monetization is
              delayed until mid-2027 as Instinct navigates privacy regulations. ARR growth moderates to $8-10M/month.
              Next round raises at $4-5B with moderate dilution. Exit via IPO or strategic acquisition at $6-8B in
              2030-2031. Series B investors achieve 2-3x return. Bear scenario (20% probability): Privacy enforcement
              from the EU or California forces significant product changes. Monetization stalls below $200M ARR. A
              strategic acquirer absorbs Instinct at 0.5-1x revenue or $300-500M — a full write-down for Series B
              investors. The downside is not remote: regulatory risk is real, the monetization model remains undefined,
              and the AI-assistant market may consolidate around OS-native assistants faster than Instinct can
              differentiate. Expected value across scenarios yields roughly 2.5x for a Series B co-investor at current
              entry — insufficient to justify the risk premium.
            claimRefs:
              - CV017
              - CV018
              - CV019
              - CV020
              - CV021
              - CV022
              - CV023
              - CV024
