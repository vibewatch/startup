      - CR027
      - CR031
      - CR032
      - CR041
      - CR042
  - id: FR002
    title: Risk cascade
    type: dag
    layout: wide
    summary: A single autonomy or deletion failure can cascade through several stakeholder groups quickly.
    data:
      nodes:
        - label: Autonomy incident
