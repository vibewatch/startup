  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Direct rivals and incumbent benchmarks
        blocks:
          - type: paragraph
            body: >-
              Instinct's closest reference set is not every chatbot. It is the subset of products trying to become a
              user's operating interface for everyday digital work. OpenAI Operator is the clearest direct benchmark
              because it explicitly promises browser-based task execution. Google Gemini, Apple Intelligence, and
              Microsoft Copilot are slightly different cases: they are broader ecosystems or bundled assistants rather
              than startup-style single products, but from a user-outcomes perspective they increasingly overlap with
              the same core jobs of drafting, scheduling, summarizing, and eventually acting. Meta AI belongs in the
              same outer ring because it conditions users to expect free AI help inside consumer communication surfaces.


              Humane deserves special treatment. Its AI Pin is not a live competitor anymore, but it is strategically
              relevant because it showed both investor appetite and consumer fragility for always-on assistant products.
              The shutdown after HP's acquisition is a warning that novelty and ambitious assistant rhetoric do not
              compensate for a weak product loop. That precedent matters for Instinct because the company is also asking
              users to trust a new form of delegation before broad mainstream proof exists.


              Instinct's edge in this set is not scale or brand. It is focus: a messaging-native assistant that aims to
              operate inside real accounts without waiting for constant confirmation. That makes the product feel more
              agentic than many incumbents, but also more exposed if trust breaks.
