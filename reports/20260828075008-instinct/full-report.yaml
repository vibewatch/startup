    Instinct, operated by Spear Street Technology Inc. (California, 2025), is a consumer AI personal assistant accessed
    exclusively via SMS and WhatsApp. The product connects to users' email, calendar, messaging apps, audio, location,
    and screen, and executes tasks—booking, email management, scheduling, shopping— autonomously without requiring
