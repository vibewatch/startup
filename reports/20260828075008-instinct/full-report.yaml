  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The bull thesis for Instinct rests on four propositions: (1) consumer AI assistants will become the
              dominant personal productivity interface, creating a winner-take-most market; (2) Instinct's 16x ARR
              growth in 7 months signals genuine product-market fit rarely achieved in consumer software; (3) Noah
              Shinn's combination of academic AI credibility and consumer product intuition is exceptionally rare at age
              23; and (4) with $350M in capital, Instinct has the runway to commercialize before competitors neutralize
              its lead. The anti-thesis is equally compelling: (1) no disclosed pricing means the ARR figure may reflect
              non-recurring or promotional arrangements; (2) large incumbents — Apple, Google, Microsoft — have
              near-unlimited distribution to absorb AI-assistant demand at zero marginal CAC; (3) AI inference costs are
              structural and will compress gross margins unless negotiated down; and (4) privacy backlash in August 2026
              may create regulatory friction or churn risk that has not yet materialized in the ARR figure. The net
              result is a company at the boundary between venture bet and strategic platform risk.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
          - type: table
            tableRef: TV002
