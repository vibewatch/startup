      - number: '2.2'
        title: Market Sizing and Growth Trajectory
        blocks:
          - type: paragraph
            body: >-
              The global consumer AI personal assistant market reached an estimated 4.84 billion USD in 2026,
              representing a 42.2 percent compound annual growth rate from 2025's 3.4 billion USD baseline. The broader
              intelligent personal assistant market, which includes enterprise and hybrid deployments, reached
              approximately 17.95 billion USD in 2026 growing at 25.9 percent CAGR. Market projections suggest the
              consumer segment will reach 19.6 billion USD by 2030 if current growth rates sustain. These estimates
              carry significant uncertainty bounds due to definitional ambiguity around what constitutes a personal
              assistant versus a general-purpose AI chatbot or specialized productivity tool. Research and Markets and
              The Business Research Company provide the primary third-party sizing estimates, with methodologies that
              aggregate subscription revenue, advertising-supported usage, and hardware-bundled assistant value. The TAM
              represents the theoretical maximum if every smartphone user adopted a paid AI assistant; the SAM narrows
              to users with demonstrated willingness to pay for productivity delegation; the SOM reflects the
              addressable market for agentic assistants with deep permissions in 2026-2027. For Instinct specifically,
              the relevant addressable market is the subset of consumers willing to grant extensive device permissions
              and pay subscription fees for autonomous task execution. Privacy-conscious users and those in regulated
              industries represent structural exclusions from the addressable market. The 16x ARR growth Instinct
              achieved in 8 months suggests either exceptional product-market fit within its target segment or
              unsustainable early-adopter surge that will normalize as the waitlist clears.
