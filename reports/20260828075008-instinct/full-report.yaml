  - id: FE002
    title: Customer workflow / operating flow
    type: flow
    layout: wide
    summary: Representative journey from a user request into context retrieval, autonomous execution, and later follow-up.
    data:
      nodes:
        - id: request
          label: 1. User texts or calls Instinct
          detail: No new app is required; the thread starts in an existing messaging surface.
        - id: context
          label: 2. Agent retrieves linked context
          detail: Reads relevant email, calendar, messaging, or other connected data.
        - id: plan
          label: 3. Agent plans task and selects tools
          detail: LLM or orchestrator determines whether to draft, search, schedule, buy, or follow up.
        - id: execute
          label: 4. Agent acts on connected services
          detail: May send mail, create events, make bookings, or place orders.
        - id: notify
          label: 5. User receives result or clarification
          detail: Outcome appears back in the message thread or call context.
        - id: persist
          label: 6. Context persists for later follow-up
          detail: The system can re-engage when threads are dropped or external updates arrive.
      edges:
        - from: request
          to: context
          label: intent received
        - from: context
          to: plan
          label: retrieve relevant state
        - from: plan
          to: execute
          label: choose tool or action path
        - from: execute
          to: notify
          label: return result or issue
        - from: notify
          to: persist
          label: store state for later
    approximationNotes: >-
      Workflow abstracts the common operating pattern implied by official copy and tester reports; specific tasks may
      branch or request clarification before execution.
