  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Definition and Scope
        blocks:
          - type: paragraph
            body: >-
              Instinct competes in the consumer AI personal assistant market, a segment of the broader intelligent
              virtual assistant industry. The market encompasses software products that understand natural language
              commands and autonomously execute tasks on behalf of individual consumers such as scheduling, email
              management, travel booking, purchasing, and information retrieval. The market excludes enterprise-only
              solutions, pure chatbots without action capabilities, and voice-only smart speaker assistants that lack
              deep device integration. Core market participants include platform incumbents like Apple Siri, Google
              Assistant, Amazon Alexa, Microsoft Cortana, and Samsung Bixby, as well as AI-native entrants like
              Instinct, Rabbit r1, and Humane AI Pin. The defining characteristic of the 2025-2026 market shift is the
              transition from reactive query-response assistants to proactive agentic systems that take autonomous
              action with minimal user confirmation. Instinct represents the leading edge of this agentic transition in
              the consumer segment, distinguished by its SMS and WhatsApp interface, deep permission model, and
              autonomous task execution capabilities. The market boundary is fuzzy at the edges: productivity SaaS with
              AI features, browser automation tools, and AI coding assistants overlap with personal assistant
              functionality but serve distinct primary use cases. For sizing purposes, this analysis focuses on products
              marketed primarily as personal assistants with multi-domain task execution capabilities.
            claimRefs:
