      - number: '2.4'
        title: Growth Drivers and Market Constraints
        blocks:
          - type: paragraph
            body: >-
              Market growth is driven by five primary catalysts. First, generative AI capability improvements have made
              natural language understanding and task completion reliable enough for production use cases. Second,
              smartphone ubiquity provides the device substrate and connectivity for always-available assistance. Third,
              consumer familiarity with AI through ChatGPT and similar products has normalized AI interaction and
              reduced adoption friction. Fourth, productivity demands from remote and hybrid work arrangements have
              increased demand for delegation tools. Fifth, SMS and messaging-app interfaces like those used by Instinct
              eliminate the need to learn new applications, reducing onboarding friction. Market constraints include
              regulatory uncertainty around AI agent liability and data protection, consumer trust deficits following
              high-profile AI failures, platform gatekeeping by Apple and Google that limits third-party assistant
              capabilities, and security vulnerabilities including prompt injection attacks that undermine reliability.
              The FTC has signaled increased scrutiny of AI agents that enter binding transactions on behalf of
              consumers, and the EU AI Act may classify autonomous personal assistants as high-risk systems requiring
              conformity assessments. Privacy regulations including CCPA and GDPR create compliance overhead and limit
              data retention practices. The market trajectory depends heavily on whether the agentic AI trust gap closes
              faster than regulatory constraints tighten.
