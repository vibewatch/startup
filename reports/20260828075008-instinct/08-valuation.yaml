      - ['Character.AI (acquisition)', September 2024, '$2.7B', '~27x ARR']
      - [Scale AI, December 2024, '$13.8B', '~11x ARR']
      - [Cohere, June 2024, '$5.0B', '~25x ARR']
      - [Instinct, August 2026, '$2.5B', '~31x unverified ARR']
    enumerationScope:
      coverage: partial
      basis: >-
        Covers five representative consumer and enterprise AI companies with
        publicly disclosed or analyst-estimated valuations from 2024-2026.
        Not exhaustive; excludes earlier-stage and Chinese AI firm comparables.
    notes: >-
      All ARR figures are analyst estimates. Instinct's ARR is management-stated
      and unverified. All comparables had either a paid tier or contractual
      revenue at time of valuation; Instinct does not.
    claimRefs: [CV025, CV026, CV027, CV028, CV029]
  - id: TV005
    title: Thesis-break and kill triggers
    columns: [Trigger, Threshold, Recommended action]
    rows:
      - [ARR growth deceleration, 'Growth < $5M/month for two consecutive quarters', 'Re-evaluate; request ARR bridge and cohort data']
      - [Regulatory action, 'Any enforcement action in EU, UK, or California related to privacy', 'Immediate re-evaluation; engage legal counsel for product-change assessment']
      - [Key-person departure, 'CEO Noah Shinn departure or other principal technical author', 'Downgrade to sell; flag as thesis-break event for IC review']
      - [Monetization failure, 'No paid tier launched by Q2 2027', 'Downgrade to pass; trigger write-down consideration for existing holders']
    notes: >-
      Threshold definitions are fixed at the time of this report. Triggers are
      binary flags for investment committee re-evaluation, not automatic sell signals.
    claimRefs: [CV033, CV034, CV035, CV036]
  - id: TV006
    title: Blocking diligence asks
    columns: [Diligence ask, Criticality, Blocking]
    rows:
      - ['Independent ARR verification via third-party audit or rep-and-warranty insurance', Critical, Yes]
      - ['Full disclosure of pricing model, conversion funnel, and paying-user count', Critical, Yes]
      - ['Privacy compliance review across EU AI Act, UK DPA, and California CPRA', High, Yes]
      - ['Investor rights agreement review for liquidation preferences and anti-dilution', High, Yes]
    notes: >-
      All four items are blocking for any investment decision at current valuation.
    claimRefs: [CV037, CV038, CV039, CV040]
