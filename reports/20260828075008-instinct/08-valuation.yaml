    columns: [Scenario, Probability, Series B return, Key assumption]
    rows:
      - [Bull, '25%', '5-8x', 'Paid tier Q1 2027; 10% conversion; ARR $250M+ end-2027; IPO at $15-20B in 2029']
      - [Base, '55%', '2-3x', 'Monetization delayed to mid-2027; ARR $120-160M end-2027; exit $6-8B in 2030']
      - [Bear, '20%', '<0.1x', 'Privacy enforcement; monetization failure; distress sale at $300-500M']
    notes: >-
      Scenario probabilities are analyst judgment informed by chapter-level evidence.
      Series B return calculated at $2.5B entry valuation. Bear case is not remote.
    claimRefs: [CV017, CV018, CV019, CV020, CV021, CV022]
  - id: TV004
