      - [Team, 'Shinn combines academic AI depth (ReAct, Reflexion) and consumer intuition', 'Single 23-year-old founder; thin public operating track record']
      - [Financials, '$350M capital; 36-58 month runway; demonstrated capital efficiency', 'ARR unverified; burn unknown; no monetization model at 31x multiple']
      - [Regulatory, 'Privacy risk manageable with architecture adjustments', 'EU AI Act + California CPRA pose structural risk to email-access product']
    notes: >-
      Each dimension maps to a specific chapter: market to Ch2, product to Ch5,
      team to Ch1, financials to Ch4, regulatory to Ch7.
