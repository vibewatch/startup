- id: adjacent-and-specialist
  title: Adjacent substitutes and specialist workflow tools
  body: |-
    The next competitive ring is formed by products that solve part of Instinct's job but not the whole delegated-assistant bundle. Claude and Perplexity are the most important broad substitutes in this group. Claude is strong on reasoning, writing, and analysis, but its public surface does not currently emphasize consumer task execution in the same way as Instinct or Operator. Perplexity excels at search, research, and answer quality; for some users, that is enough to reduce demand for a broader assistant, but it is not the same product promise as autonomous inbox, calendar, shopping, and travel management.

    Then there are the specialists. Superhuman owns email speed and polish. Motion owns scheduling and time allocation. Cal.com provides scheduling infrastructure. These companies matter because they show that narrow workflow software can still win even if general AI improves. A specialist can be easier to trust, easier to budget for, and easier to benchmark than an assistant touching everything at once.

    For Instinct, this means the competitive bar is two-sided. It has to beat broad AI products on action orientation, while also beating specialists on workflow-specific usability. That is possible, but it is a higher bar than a simple 'general beats point tools' story.
