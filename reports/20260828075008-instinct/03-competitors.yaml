- id: moat-and-threats
  title: Moat durability and the anti-thesis
  body: |-
    The best argument for Instinct's moat is product architecture and user experience. The company is trying to collapse several fragmented jobs into one assistant that acts, not just advises. If it can reliably handle communications, scheduling, shopping, and travel in a messaging thread, the product may feel qualitatively different from both general chat and single-workflow apps. The founder's research background in agentic loops adds credibility to that ambition.

    The anti-thesis is stronger than many startup narratives admit. Every major platform owner is moving toward more agentic behavior from a far stronger installed base. If Google, Apple, OpenAI, Microsoft, or Meta match most of Instinct's autonomy while retaining higher trust and deeper platform integration, the standalone wedge compresses quickly. Instinct's own adverse incidents make this risk worse because trust is one of the few areas where incumbents already start ahead.

    The right diligence view is therefore conditional. Instinct has a real wedge today, but moat durability is not yet proven. The public record is missing pricing, retention, task-level success, and churn relative to competitors. Until those data exist, competitive advantage should be treated as plausible but not durable by default.
