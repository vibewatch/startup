- id: distribution-and-switching
  title: Distribution power, switching costs, and pricing pressure
  body: |-
    Instinct's biggest non-product differentiator is that it arrives over SMS and WhatsApp rather than through an app-first interface. That matters because the setup burden for a consumer assistant is not just account creation but habit formation. A message thread is a lower-friction starting point than downloading and learning another application. At the same time, channel ownership remains external. Apple, Google, Microsoft, Meta, and WhatsApp control the dominant devices, identities, app stores, and communication surfaces that shape discovery and trust. They also have the ability to bundle assistant features into products users already pay for.

    That bundling power affects pricing. OpenAI, Google, Microsoft, and Claude all now sell paid AI plans, which validates recurring spend but also normalizes a market where users compare several assistants side by side. Meta pushes the opposite direction by making AI assistance free. In that environment, Instinct probably cannot win on price alone. It has to win on felt usefulness: saving enough time or cognitive load to justify a separate spend despite abundant substitutes.

    Switching costs are only moderate. Many users still multi-home among tools, and the status quo is fragmented. That helps Instinct get trial but makes lasting lock-in harder unless the assistant becomes deeply embedded in sensitive, trusted workflows.
