  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: competitive-metrics
    missingEvidence: Task-level success rates, conversion, and retention for Instinct versus broad assistant and specialist alternatives.
    whyItMatters: Without those metrics, public competitive comparisons overemphasize feature marketing and underweight actual user behavior.
    diligencePath: Request side-by-side user testing data, churn reasons, and cohort retention by workflow depth.
    relatedQuestionRefs:
    - QP022
    - QP024
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: Instinct has not publicly disclosed pricing, so willingness-to-pay comparisons rely on substitutes rather than direct evidence.
    whyItMatters: Standalone consumer assistants must prove premium utility to win against bundled or free incumbents.
    diligencePath: Request current beta pricing or monetization experiments and compare conversion against ChatGPT, Gemini, and specialist tools.
    relatedQuestionRefs:
    - QP013
    - QP014
    - QP024
    relatedTableRefs:
    - TP004
  - type: conflicting-data
    severity: minor
    topic: capability-scoring
    missingEvidence: Public capability comparisons are often marketing-led and lack normalized test harnesses for autonomy and trust.
    whyItMatters: Matrix scores can drift if they are not tied to a consistent benchmarking method.
    diligencePath: Run controlled workflow tests across Instinct, Operator, Gemini, Apple Intelligence, and key specialists.
    relatedQuestionRefs:
    - QP003
    - QP004
    - QP021
    - QP023
