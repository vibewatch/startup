- id: leadership-and-team
  title: Founder background, technical lineage, and team composition
  body: >-
    Noah Shinn is the sole publicly identified founder of Instinct and serves as CEO of Spear
    Street Technology. He was 23 years old at the time of the August 2026 Series B announcement.
    Shinn dropped out of Northeastern University in 2023, having also conducted machine learning
    and programming language research at MIT. He subsequently became one of the earliest employees
    at Sierra, an enterprise AI agent company, where he worked as a research scientist.

    Shinn is best known academically as the lead author of the Reflexion paper, presented at
    NeurIPS 2023. The Reflexion framework introduced a method for language agents to "verbally
    reflect" on task failures, store learnings in episodic memory, and improve on subsequent
    attempts without model fine-tuning. The approach achieved a 91% pass@1 rate on the HumanEval
    coding benchmark, substantially above GPT-4's reported 80% at the time. Co-authors included
    Federico Cassano, Ashwin Gopinath, Karthik Narasimhan, and Shunyu Yao. Shinn also co-developed
    τ-bench, a benchmark evaluating agents' ability to handle real-world user interactions, tool
    invocations, and business-rule compliance. This technical lineage—from academic agent research
    through enterprise deployment at Sierra to a consumer product—is a distinguishing credential
    for a founder of Shinn's age.

    The rest of the team is publicly undisclosed. Company materials describe a "small San Francisco
    team" with backgrounds from MIT and Sierra, but no other team members have been identified by
    name in any public reporting reviewed for this run. Board composition, investor observers, and
    governance structure are entirely undisclosed. The concentrated leadership creates a significant
    key-person dependency: the company's technical credibility, investor relationships, and product
    vision are publicly tied to a single individual with no succession clarity.
