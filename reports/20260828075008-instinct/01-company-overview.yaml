callouts:
- calloutType: strength
  title: Exceptional ARR growth in private beta
  body: >-
    Growing from $5M to $80M ARR in approximately eight months while remaining invite-only
    signals genuine product-market fit. This growth rate—16× in under a year—is exceptional
    even for consumer AI in 2026 and provides the primary financial basis for the $2.5 billion
    valuation.
  claimRefs:
  - CO017
  - CO018
- calloutType: risk
  title: Perpetual data license and privacy architecture are structural liabilities
  body: >-
    Instinct's terms of service grant the company a perpetual, irrevocable license to user data
    including email content, screen captures, and keyboard inputs, even after service
    discontinuation. Documented incidents of autonomous email-sending without consent and
    data retention after permission revocation have generated sustained negative coverage.
    These are architectural and legal design decisions, not bugs, and they create material
    regulatory and reputational exposure at scale.
  claimRefs:
  - CO024
  - CO025
  - CO027
  - CO030
