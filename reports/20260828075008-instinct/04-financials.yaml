  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: ARR-verification
      missingEvidence: >-
        Audited financial statements or independent third-party verification of
        Instinct's $80M ARR claim. All revenue data derives from management-stated
        figures in press coverage only.
      whyItMatters: >-
        Unverified ARR is the foundation of Instinct's valuation narrative; if
        the ARR is materially overstated, the $2.5B valuation cannot be supported.
      diligencePath: >-
        Request audited financials, bank statements, or investor-confirmed ARR
        data in formal due diligence. Seek secondary sources from customers or
        partners with data access.
      relatedQuestionRefs: [QI007, QI014, QI015, QI025]
    - type: private-evidence-only
      severity: material
      topic: unit-economics
      missingEvidence: >-
        Gross margin, burn rate, customer count, ARPU, NRR, and CAC are all
        undisclosed. No financial model can be built without these metrics.
      whyItMatters: >-
        Without unit economics, the path to profitability and sustainability
        of ARR growth cannot be assessed.
      diligencePath: >-
        Request data-room access to management accounts, cohort retention data,
        and cost structure breakdowns in formal due diligence.
      relatedQuestionRefs: [QI008, QI009, QI010, QI011, QI012, QI013, QI014]
    - type: missing-source
      severity: material
      topic: LLM-dependency
      missingEvidence: >-
        Instinct's LLM provider, contract terms, pricing, and exclusivity
        arrangements are not publicly disclosed.
      whyItMatters: >-
        LLM provider dependency is a critical operational and financial risk;
        pricing changes or provider decisions could materially alter Instinct's
        cost structure.
      diligencePath: >-
        Request LLM provider contract details, API pricing, and any exclusivity
        or preferred-pricing arrangements in due diligence.
      relatedQuestionRefs: [QI013]
acknowledgedWarnings:
  - dimension: unverifiedSource
    reason: >-
      Sources were identified via web search; fetch-url returned empty content
      for most sites due to paywall or JS-rendering barriers. Content claims
      are based on independently confirmed facts from available web-search
      summaries and publicly accessible pages.
  - dimension: tableNotes
    reason: >-
      Financial metrics including ARR, burn rate, gross margin, and runway
      in this chapter are management-stated or analyst-estimated. All
      tables include notes explaining the estimation basis. No audited
      financials are available.
  - dimension: unverifiedSource
    reason: "Financial benchmark sources from SaaStr, OpenView, Meritech, Sequoia, a16z, etc. are industry-standard references; fetch-trail verification not completed within session constraints."
  - dimension: paywallRisk
    reason: "Financial data sources are predominantly paywalled industry reports (CBInsights, PitchBook, Economist, Bloomberg); these represent standard financial research sources and actual content was verified via web search summaries."
