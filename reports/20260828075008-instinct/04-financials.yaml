callouts:
  - calloutType: strength
    title: 16× ARR growth in 7 months is historically exceptional
    body: >-
      Growing from $5M to $80M ARR in approximately 7 months implies a monthly
      growth rate that places Instinct among the fastest-growing consumer software
      companies ever recorded. Even if management-stated ARR is 20% overstated,
      the underlying growth signal remains extraordinary.
    claimRefs: [CI007, CI009, CI029]
  - calloutType: risk
    title: $2.5B valuation without a monetization model is high risk
    body: >-
      Instinct has not disclosed any pricing, business model, or path to profitability
      as of August 2026. Valuing a private-beta consumer AI product at 31× ARR—without
      verified unit economics, customer count, or NRR—carries significant execution
      and execution risk, particularly if ARR growth decelerates post-launch.
    claimRefs: [CI019, CI022, CI030]
  - calloutType: risk
    title: Unverified ARR is the central diligence risk
    body: >-
      All revenue figures are management-stated and unverified by any independent
      source. The absence of audited financials means the $80M ARR figure—and by
      extension the entire growth narrative—rests on a single, unverified data
      source. This is the primary diligence gate before any investment decision.
    claimRefs: [CI011, CI012, CI031]
  - calloutType: insight
    title: Series B capital efficiency improved dramatically
    body: >-
      At Series A, Instinct raised $100M against $5M ARR (0.05× ARR per $M raised).
      At Series B, it raised $250M against $80M ARR (0.32× ARR per $M raised)—a 6×
      improvement in capital efficiency, suggesting the team learned to deploy capital
      more productively as the product found product-market fit.
    claimRefs: [CI001, CI007, CI032]
