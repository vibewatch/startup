    columns: [Risk area, Description, Severity, Evidence, Mitigation path]
    rows:
      - ['No monetization model', 'No pricing or revenue model disclosed at $2.5B valuation', 'Critical', 'Zero public disclosures', 'Commercial launch announcement']
      - ['LLM provider dependency', 'Undisclosed LLM provider; API pricing or availability could change', 'High', 'Inference costs estimated 15–35% of revenue', 'Negotiate long-term contracts; diversify providers']
      - ['Unverified ARR', '$80M ARR is management-stated; no third-party verification', 'High', 'Single source: management statements', 'Audited financials in due diligence']
      - ['Consumer monetization history', 'Consumer AI historically struggles to sustain paid subscriptions at scale', 'High', 'Historical: Inflection, Character AI', 'Differentiated product value; autonomous utility']
      - ['Privacy backlash revenue risk', 'August 2026 adverse coverage may slow ARR growth or increase churn', 'High', 'TechCrunch Aug 2026 adverse coverage', 'Product fixes; transparent data policy']
    notes: >-
