slug: instinct
runDate: '2026-08-28'
company:
  name: Instinct
chapter:
  number: 4
  title: Financial Analysis
  summary: >-
    Instinct has raised $350 million across two rounds reaching a $2.5 billion
    post-money valuation in August 2026, with management-reported ARR of $80 million
    growing from $5 million in January 2026—a 16× step-up in roughly seven months.
    Unit economics, burn rate, and pricing remain undisclosed; financial analysis
    relies on implied metrics and sector benchmarks.
sections:
  - id: funding-history
    title: Funding History and Capital Structure
    body: >-
      Spear Street Technology Inc. has raised capital in two identified rounds. The
      Series A closed in January 2026 at $100 million, led by Kleiner Perkins with
      partner Mamoon Hamid taking a board-observer or director role, with participation
      from Conviction Capital (Sarah Guo). At time of the Series A, ARR was
      approximately $5 million—implying a ~100× revenue multiple for the round.
      The Series B closed on August 26, 2026 at $250 million, co-led by Index Ventures
      and Benchmark, at a $2.5 billion post-money valuation. At the time of Series B,
      management-stated ARR was approximately $80 million—implying ~31× ARR. Greenoaks
      Capital also participated in the Series B. Total capital raised across all
      disclosed rounds is $350 million. No seed or pre-seed information has been
      disclosed publicly. Cap table, investor ownership percentages, and dilution
      schedule are not available.
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI006]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: revenue-trajectory
    title: Revenue Trajectory and ARR Growth
    body: >-
      Instinct's management-stated ARR grew from approximately $5 million in January
      2026 to approximately $80 million in August 2026, representing a 16× increase
      in approximately seven months. This implies an average monthly net-new ARR of
      roughly $10.7 million. This growth rate, if real, would be among the fastest
      ARR ramp-rates recorded for any consumer software product. No independent
      verification of ARR has been disclosed; the figure derives entirely from
      management statements reported in press coverage. Gross margin, net revenue
      retention, customer count, average revenue per user (ARPU), and pricing
      structure are all undisclosed. The product remains in private beta with
      invite-only access, suggesting that the ARR may derive from a small cohort
      of early paying users or early commercial arrangements not publicly described.
    claimRefs: [CI007, CI008, CI009, CI010, CI011, CI012]
    tableRefs: [TI002]
    figureRefs: [FI002]
  - id: unit-economics
    title: Unit Economics and Margin Estimates
    body: >-
      Because Instinct has not disclosed pricing, headcount, or cost structure,
      all unit-economics analysis is based on sector benchmarks and inference from
      comparable consumer AI companies. LLM inference cost for autonomous AI
      assistants processing email, calendar, and multi-step tasks is estimated at
      15-35% of revenue, based on published cost structures for similar agentic
      products. If applied to $80 million ARR, this implies $12-28 million in
      annual LLM inference costs. Customer acquisition cost (CAC) is likely low
      given the viral waitlist model, though this is speculative. Gross margin for
      comparable consumer AI SaaS businesses that are not entirely infrastructure-
      bound ranges from 50-75%; Instinct's higher inference intensity suggests the
      lower end of this range. Net revenue retention is unknown; the private beta
      context and lack of disclosed churn data prevent analysis. The go-to-market
      motion relies on viral distribution and an invite-only waitlist, suggesting
      low paid customer-acquisition cost but limited predictability of growth
      scaling. Sales cycle is undefined; no outbound or enterprise sales motion
      has been disclosed. GTM efficiency metrics—CAC payback period, LTV/CAC
      ratio, and channel mix—are entirely absent from public disclosures.
    claimRefs: [CI013, CI014, CI015, CI016, CI017, CI018]
    tableRefs: [TI003]
    figureRefs: [FI003]
  - id: financial-risks
    title: Financial Risks and Burn Outlook
    body: >-
      Instinct's key financial risks center on: (1) the absence of a disclosed
      monetization model at $2.5 billion valuation, creating execution risk to
      justify the price; (2) dependency on an undisclosed LLM provider whose
      pricing or availability could change adversely; (3) burn rate that is unknown
      but likely substantial given AI inference costs and engineering headcount;
      and (4) the historical challenge of monetizing consumer AI products at scale.
      With $350 million raised, assuming a burn rate of $3-7 million per month
      (sector-informed estimate), runway would be approximately 36-58 months from
      close of Series B—sufficient for a commercial launch and first monetization
      cycle. However, if ARR growth decelerates due to privacy backlash or
      competitive pressure, the burn rate relative to revenue could become
      problematic more quickly. The lack of audited financial statements or any
      third-party financial certification means all runway estimates carry high
      uncertainty and should be treated as indicative only. Investor-favorable
      terms such as anti-dilution provisions and liquidation preferences are very
      likely present but remain entirely undisclosed, which further limits precision
      of financial modeling and exit scenario analysis.
    claimRefs: [CI019, CI020, CI021, CI022, CI023, CI024]
    tableRefs: [TI004, TI005]
    figureRefs: [FI004]
