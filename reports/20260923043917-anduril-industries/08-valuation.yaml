    - Multiple expands on stronger proof
    - Execution misses
  - - Base
    - Growth continues; disclosure stays opaque
    - Current price roughly fair to slightly stretched
    - No clean re-rate
  - - Bear
    - Growth slows; mix stays hardware-heavy
    - Multiple compresses
    - Funding or margin surprise
  - - Exit
    - Public disclosure closes gap
    - IPO or similar liquidity event
    - Timing risk
