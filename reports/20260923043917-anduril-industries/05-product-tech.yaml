sections:
- id: SE-S1
  title: Product Definition and Workflow
  body: 'Anduril''s product story is easiest to understand as a workflow: detect, decide, and act with software and hardware
    in the same loop. Lattice sits in the middle, but the company''s public product pages make clear that this is not a pure
    software vendor. The stack spans autonomous aircraft, undersea systems, sensors, and border-security infrastructure, which
    means the real product is an integrated system rather than any one SKU. That integrated framing matters because it explains
    why the company keeps selling into mission programs instead of trying to win through a standalone app layer. That is why
    public product demos alone are not enough.'
  claimRefs:
  - CE001
  - CE003
  - CE010
  tableRefs:
  - TE001
  figureRefs:
  - FE001
- id: SE-S2
  title: Modules, Assets, and Architecture
  body: The module map shows how broad the stack has become. Ghost, Roadrunner, Dive-LD, Fury, Sentry, and Lattice SDK are
    not interchangeable products; they are different slices of the same mission architecture. That breadth creates a stronger
    story for cross-sell and reuse, but it also makes the company responsible for more of the operational burden. If the field
    system fails, the software story fails with it. If the manufacturing pipeline slips, the autonomy story loses credibility.
    Product breadth therefore strengthens the platform narrative only if execution stays tight.
  claimRefs:
  - CE002
  - CE004
  - CE011
  tableRefs:
  - TE002
- id: SE-S3
  title: Differentiation and Controls
  body: Differentiation comes from a mix of integration, IP, manufacturing, and support. The company can point to partner
    integrations and the General Dynamics relationship as evidence that it wants to own more of the operating layer, not just
    the point product. But the same breadth makes margin analysis harder and raises the bar on trust, safety, privacy, and
    compliance. In practice, the moat is not a single technical feature; it is the ability to keep shipping operational systems
    that customers can actually field and sustain over time. The strategic risk is that this operational moat only stays valuable
    if the product keeps getting easier to deploy across different missions without turning into a bespoke services business.
  claimRefs:
  - CE005
  - CE006
  - CE007
  - CE008
  - CE009
  - CE012
  tableRefs:
  - TE003
