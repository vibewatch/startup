  title: Market Analysis
  summary: Anduril plays in the defense-autonomy market, where buyers want faster sensor-to-shooter cycles, stronger counter-drone
    capability, and software-defined command-and-control. The market is large but fragmented across primes, internal builds,
    and adjacent software vendors, and adoption is gated by procurement, security, and export constraints. The main question
    is less whether demand exists than how quickly budgets and buying processes can absorb autonomous systems at scale.
