sections:
- id: SM-S1
  title: Market Boundary and Buyer Set
  body: Anduril sits in a market that blends defense modernization, autonomy, and command-and-control. The real boundary is
    not whether the company sells hardware or software, but whether a buyer wants a faster sensor-to-shooter loop and is willing
    to buy that capability as an integrated program. That framing captures why the company can sell across air, land, sea,
    and border-security missions without looking like a traditional narrow-point vendor. It also explains why primes, internal
    government builds, and adjacent software vendors remain relevant substitutes even when Anduril has a strong technology
    narrative.
  claimRefs:
  - CM001
  - CM002
  - CM006
  tableRefs:
  - TM001
  figureRefs:
  - FM001
- id: SM-S2
  title: Sizing Lenses and Growth Drivers
  body: Budget ownership is primarily with defense and homeland-security organizations, plus allied ministries that can buy
    similar capabilities. The market is attractive because the budget pools are large and the geopolitical backdrop remains
    supportive, but procurement, export, and security requirements slow conversion from interest to revenue. That combination
    makes adoption path analysis more important than a single top-down TAM number. In practice, the company wins by tying
    autonomy to mission outcomes and then expanding across adjacent programs once buyers trust the deployment.
  claimRefs:
  - CM003
  - CM004
  - CM005
  - CM010
  - CM011
  tableRefs:
  - TM002
- id: SM-S3
  title: Adoption Constraints and Momentum Signals
  body: Anduril's hiring and partnership signals show a market still in build mode. The company continues to add technical
    talent, manufacturing capacity, and customer-facing support, while the General Dynamics relationship shows that ground-force
    modernization remains an important adjacency. At the same time, the market remains hard to size precisely because many
    program budgets are fragmented or partially classified. The result is a market that looks large and durable, but one where
    the pace of adoption is still constrained by institutions rather than by product desirability alone. Procurement timing
    matters because the strongest market signals do not turn into revenue on the same schedule as software. Buyers may want
    autonomy immediately, yet they still have to align budgets, test reliability, and often pilot the system before full deployment.
    That lag is what keeps the market attractive but not frictionless.
  claimRefs:
  - CM007
  - CM008
  - CM009
  - CM012
