  topStrengths:
    - 软硬件垂直一体化的自主武器平台（Lattice OS + 自研硬件），赛道内尚无直接对标对手
    - 深厚且专属性强的 DoD 合作生态：覆盖 SOCOM、CBP、美国陆军、空军、海军、太空军及 AUKUS
    - 先发优势护城河：Lattice OS 已切入一线实战部署，具备极高切换成本
    - Series H 轮融资 $5B、投后估值 $61B，印证其获取稀缺大额资本的能力
    - 顶尖创始人与 CEO 组合（Palmer Luckey + Brian Schimpf），兼具军政层信任与技术声誉
    - 契合年增 7-9% 的 $2.2T+ 全球国防开支大盘，具备结构性增长红利
    - Replicator 与 CCA 等核心军工项目构成 $5-15B 潜在项目价值储备管线
  topRisks:
    - LAWS/CCW 条约风险：具约束力的自主武器限令可能重创其自主打击产品线
    - CCA 竞标若败给 General Atomics：非赢即输的二元竞争，对估值影响达 $5-8B
    - IPO 时面临硬件估值倍数重定价：若毛利率暴露出重硬件结构，估值倍数将从 23x 压缩至 4-5x
    - 客户集中度高：3-4 个重点采购项目（贡献约 ~60-70% 收入）带来项目取消的二元风险
    - 资金缺口风险：即便斩获 Series H 巨资，每年 $1.2-1.8B 的烧钱速度仍需严格执行纪律；若市场转冷可能引发融资压力
    - ITAR 监管执法敞口：向国际市场扩张（AUKUS+）推高合规复杂度与受罚风险
  unresolvedGaps:
    - 未披露 GAAP 财务数据：缺乏毛利率、EBITDA、收入确认政策及自由现金流，所有估值指标全凭估计 ARR 推算
