sections:
- id: SI-S1
  title: Revenue Streams and Monetization
  body: 'Anduril''s money appears to come from a familiar defense stack: government programs, bundled systems, and recurring
    support around deployed platforms. That makes the revenue base more durable than a one-off prototype shop, but it also
    means that line-item pricing is often hidden inside program awards and contract modifications. The company can therefore
    look like a platform business while still being reported as a set of program wins rather than a clean software subscription
    model. That distinction is the core reason the financial story is both compelling and hard to benchmark.'
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI013
  tableRefs:
  - TI001
  figureRefs:
  - FI001
- id: SI-S2
  title: Margins, Cost Structure, and Capital
  body: Pricing and packaging are mostly program-specific, which is normal for defense but frustrating for investors. Lattice-like
    software may be embedded inside larger hardware and support bundles, so the visible price on a contract is not the same
    as the true software attach rate. That creates a margin story that can improve materially if the same software is reused
    across more deployments, but it also means the company has to prove that repeatability exists. Without that proof, the
    financial profile can still look like a high-growth hardware business with some software upside rather than a software
    company with hardware around the edges.
  claimRefs:
  - CI006
  - CI007
  - CI008
  - CI009
  - CI010
  tableRefs:
  - TI002
- id: SI-S3
  title: Valuation and Financial Verdict
  body: 'The capital picture is strong but not simple. The 2026 Series H gives Anduril a much larger cushion, yet the company
    still has to fund labor, manufacturing, and customer support while building a durable margin structure. Because audited
    financials are not public, every view on runway or profitability is necessarily approximate. That is why the current valuation
    remains a diligence test: it is plausible if growth stays fast and margins improve, but it is vulnerable if execution
    slows or if the business proves more hardware-heavy than the market wants. Investors should therefore treat the valuation
    as a claim on future execution, not as proof that current disclosures already support it. That makes diligence on margins
    and backlog especially important.'
  claimRefs:
  - CI004
  - CI005
  - CI011
  - CI012
  tableRefs:
  - TI003
