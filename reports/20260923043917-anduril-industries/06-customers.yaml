sections:
- id: SU-S1
  title: Customer Segments
  body: Anduril's customer base is concentrated in defense and homeland-security channels. The company sells to agencies that
    care about mission performance, security, and procurement reliability more than about consumer UX or self-service conversion.
    That means customer segmentation has to be read through the lens of buyer, user, and payer, not through a classic SaaS
    funnel. The visible footprint also suggests a company that grows by landing one program and then using that deployment
    to open the next adjacent program. That makes the market feel concentrated even when the public story shows many different
    agencies and partners. The same handful of program offices can therefore shape most of the company's visible growth path.
  claimRefs:
  - CU001
  - CU005
  - CU009
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: SU-S2
  title: Adoption Trajectory
  body: Adoption signals are strongest when a program moves from proof-of-concept language to production or scale language.
    Public materials around surge capacity and manufacturing indicate that Anduril has at least some customers willing to
    treat the company as a real delivery partner rather than a one-off prototype vendor. That matters because it suggests
    the company can create repeatable use cases, but it does not reveal how many accounts are actually active. The public
    story is therefore stronger on movement than on denominators.
  claimRefs:
  - CU002
  - CU008
  - CU010
  tableRefs:
  - TU002
- id: SU-S3
  title: Named Proof and Durability
  body: 'The customer story is compelling but incomplete. Named partnerships, production language, and hiring all support
    a land-and-expand interpretation, yet the public record still leaves retention, renewal, and concentration data hidden.
    For an investor, that means the key question is durability: can a small number of large government relationships keep
    expanding, or will the company have to keep re-earning every program from scratch? The answer is likely somewhere in the
    middle, which is exactly why concentration and repeat-buy evidence matter so much. For diligence, that means a single
    strong proof point is not enough. Investors need to know whether the same account can keep expanding or whether every
    new win requires a fresh procurement cycle and a new round of persuasion.'
  claimRefs:
  - CU003
  - CU004
  - CU006
  - CU007
  - CU011
  - CU012
  tableRefs:
  - TU003
