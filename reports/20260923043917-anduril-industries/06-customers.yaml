  title: Customers
  summary: Anduril's customer base is concentrated in government and defense channels, with U.S. agencies, allied ministries,
    and prime-adjacent programs doing most of the visible buying. The public evidence is strongest on adoption signals and
    named partnerships, but weak on retention metrics, concentration ratios, and customer-level economics. That means the
    key diligence question is not whether there are customers, but how durable and repeatable the customer relationship is
    once a program lands.
