sections:
- id: SP-S1
  title: Competitor Landscape
  body: 'The competitive set is broad because Anduril is not just selling one product. In any given deal, it can run into
    a prime contractor, a software platform, a specialized autonomy startup, or an internal government team trying to build
    the same thing. That breadth matters because the company''s best argument is integration: one stack across sensing, autonomy,
    and command-and-control. It is also a reminder that Anduril does not have the luxury of a simple named-peer comparison;
    it must win across several different buying criteria at once.'
  claimRefs:
  - CP001
  - CP002
  - CP003
  - CP004
  tableRefs:
  - TP001
  figureRefs:
  - FP001
- id: SP-S2
  title: Scale, Trust, and Distribution
  body: Scale and trust still favor the biggest incumbents. Legacy primes bring manufacturing depth, certification experience,
    and long-standing procurement relationships, while startups like Shield AI can be faster or more focused in a narrower
    slice of autonomy. Anduril tries to sit between those extremes by pairing startup velocity with prime-like delivery. That
    is a useful position, but it also means the company has to keep proving that its integration layer and software cadence
    are durable enough to keep larger buyers from simply stitching together their own stack.
  claimRefs:
  - CP005
  - CP008
  - CP010
  tableRefs:
  - TP002
- id: SP-S3
  title: Moat Durability and Price Power
  body: 'The strongest moat evidence is not a single benchmark score; it is the fact that Anduril keeps showing up in broader
    partnership and ecosystem conversations. Lattice SDK, prime-adjacent partnerships, and the continued hiring push all suggest
    a company trying to make its software hard to replace once deployed. But the same market structure that helps Anduril
    also gives buyers options. Multi-homing remains possible, pricing is usually opaque, and defense buyers can still fall
    back to status quo suppliers or build in-house if the product path disappoints. This is why the company''s moat is best
    judged as a moving target: every program win can strengthen switching costs, but every competitor can also learn from
    the last contract and push the comparison back toward price, reliability, and procurement trust. today.'
  claimRefs:
  - CP006
  - CP007
  - CP009
  - CP011
  - CP012
  tableRefs:
  - TP003
