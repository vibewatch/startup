evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial disclosure
    missingEvidence: Audited revenue, gross margin, cash balance, and cap table details are not public.
    whyItMatters: >-
      Those items determine whether the current valuation is supported by operating performance or only by
      private-market enthusiasm.
    diligencePath: Request company financial diligence material or an IPO-style disclosure package from management.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: TAM sizing
    missingEvidence: A defensible public TAM/SAM/SOM model with explicit boundaries and comparable spend data.
    whyItMatters: Without a consistent sizing lens, the market case can only be directional.
    diligencePath: Build a constrained sizing model from procurement and allied-budget sources.
    relatedQuestionRefs:
      - QM004
      - QM007
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: pricing opacity
    missingEvidence: Public contract price sheets or a standardized product tariff for comparable programs.
    whyItMatters: Without comparable pricing, competitive win-rate and margin analysis stay approximate.
    diligencePath: Collect procurement records and program-level pricing from customers or public filings.
    relatedQuestionRefs:
      - QP004
      - QP005
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: unit economics
    missingEvidence: Audited revenue, gross margin, backlog, and cash balance details.
    whyItMatters: >-
      Those inputs are required to test whether valuation is anchored in operating performance or only in capital
      access.
    diligencePath: Request a diligence package or IPO-preparation financials from management.
    relatedQuestionRefs:
      - QI007
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: product margin stack
    missingEvidence: Segment-level software attach rates, gross margins, and deployment reliability metrics.
    whyItMatters: Those inputs determine whether the product moat translates into scalable unit economics.
    diligencePath: Request product-line margins and deployment KPI data from management.
    relatedQuestionRefs:
      - QE006
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: material
    topic: retention metrics
    missingEvidence: NRR, GRR, renewal, and customer concentration data.
    whyItMatters: Those metrics determine whether the company can turn a few wins into a durable revenue base.
    diligencePath: Request customer concentration and retention data from management.
    relatedQuestionRefs:
      - QU007
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: legal exposure
    missingEvidence: Public litigation, enforcement, or audit details that would quantify legal downside.
    whyItMatters: Legal exposure can re-rate defense suppliers quickly and affect customer trust.
    diligencePath: Search for public filings, regulator notices, and contract dispute records.
    relatedQuestionRefs:
      - QR007
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: IPO readiness
    missingEvidence: A public filing or diligence package with detailed financials, cap table, and customer concentration.
    whyItMatters: That disclosure would let the market judge whether the current price is justified.
    diligencePath: Wait for S-1 style disclosure or request a private diligence package.
    relatedQuestionRefs:
      - QV007
    relatedTableRefs:
      - TV003
