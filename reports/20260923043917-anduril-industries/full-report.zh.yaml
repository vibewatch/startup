      - number: '4.3'
        title: 估值水平与财务结论
        blocks:
          - type: paragraph
            body: >-
              资金面充足但财务推演并不轻松。2026 年完成的 H 轮融资为 Anduril
              提供了厚实的资金安全垫，但要在搭建稳健毛利结构的同时，持续为研发人才、产线扩建与一线技术保障大额注资。由于缺乏公开审计报表，外界对其现金跑道与盈利能力的判断均为粗略估计。正因如此，当前估值仍是一场尽调大考：若营收持续放量且毛利率逐步抬升，估值逻辑尚能成立；可一旦交付执行脱节或业务被证实偏重重资产硬件，高估值就会面临剧烈挤压。投资人应将当前估值视为对未来交付兑现的主张，而非已有披露数据能够充分支撑的事实。深入排查毛利率底色与在手订单积压至关重要。
