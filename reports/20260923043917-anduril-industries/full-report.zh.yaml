      - number: '1.3'
        title: 融资历程与规模扩张
        blocks:
          - type: paragraph
            body: >-
              融资历程展现了清晰的后期扩张规模：2024 年完成估值 $14B 的 F 轮融资，2025 年公开估值跃升突破 $30B，2026 年再落定 $5B H
              轮。新一轮大额融资是当前投资人看好其成长为巨型国防平台的最强信号。与此同时，员工人数扩增与南加州制造基地扩张，表明资金被扎实转化为产能、研发工程和项目交付能力，并未闲置。里程碑演进呈现产品定型、大额资本注入与物理产能同步放量的特征。
