      - number: '4.2'
        title: 利润率、成本结构与资本开支
        blocks:
          - type: paragraph
            body: >-
              定价与打包方式基本一案一议，这符合国防采办常态，却让二级市场投资人审视受阻。Lattice
              这类软件往往与大件硬件、现场保障绑定竞标，合同账面数字无法直观拆出真实的纯软件搭售率。如果同一套软件架构能在更多硬件载具上复用，综合毛利率具备大幅跃升空间；但公司必须拿出证据证明这种复用确实在规模化发生。若无法证实，其财务成色就会停留在高增长的军工硬件制造商附带软件溢价，而非一家以硬件为交付触角的高毛利软件平台。
