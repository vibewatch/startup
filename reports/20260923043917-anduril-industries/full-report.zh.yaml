      - number: '3.2'
        title: 规模、信任度与分发渠道
        blocks:
          - type: paragraph
            body: >-
              在生产规模与军方信任度上，传统军工巨头仍占主导。老牌主承包商拥有成熟产线、严格的军标适航认证与数十年累积的军方人脉；Shield AI 等垂直初创团队则在局部自主空战算法上反应更快、更聚焦。Anduril
              试图在二者之间卡位：既有初创团队的敏捷软件迭代，又兼具主承包商的整机交付能力。这一定位颇具战术价值，但它也必须反复证明自身的集成中枢和软件敏捷度足够稳固，否则大客户完全可以自行拼装不同供应商的软硬件。
            claimRefs:
              - CP005
              - CP008
              - CP010
          - type: table
            tableRef: TP002
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP011
      - number: '3.3'
        title: 护城河韧性与定价权
        blocks:
          - type: paragraph
            body: >-
              最硬核的护城河不是单项技术评测得分，而是 Anduril 持续嵌入核心防务生态网络。Lattice
              SDK、与主承包商的联手竞标以及持续的人才扩张，都说明它试图让软件在装备实战部署后难以被剥离。然而同样的市场机制也留给买方充裕选择。军方完全可以多头采购，项目定价向来不透明，一旦产品演进不及预期，采办部门仍可退回传统供货商或转向内部定制。因此，公司的护城河本质是动态博弈：每一个中标项目都能拉高客户切换成本，但对手也会从上一轮竞标中学习，迅速将竞争拉回价格、可靠性与交付信任度的传统比拼。
            claimRefs:
              - CP006
              - CP007
              - CP009
              - CP011
              - CP012
