      - number: '1.2'
        title: 创始人团队与控制权
        blocks:
          - type: paragraph
            body: >-
              创始团队兼具产品公信力、工程落地能力与政治信号资本。Palmer Luckey 是公众品牌符号，Brian Schimpf 主管公司日常运营；核心团队背靠 Oculus、Palantir 与 Founders
              Fund 的资源网络。这种组合既能招揽顶尖硬件与软件工程师，也能给出契合国防买家的叙事。治理核心不在于创始人名气大小，而在于业务能在多大程度上摆脱对少数关键人物的依赖，持续拿单、守住军方信任并维持产品交付节奏。
            claimRefs:
