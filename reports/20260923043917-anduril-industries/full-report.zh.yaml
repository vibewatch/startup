  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与作业流
        blocks:
          - type: paragraph
            body: >-
              理解 Anduril 产品体系的最佳切口是作战闭环：把感知、决策、打击全链路打包在统一的软硬件闭环中。Lattice
              是核心指挥中枢，但公开产品线表明它绝非纯软件厂商。技术栈完整覆盖自主飞行器、水下无人潜航器、阵地传感器和边境安防基建，本质交付的是集成化作战系统，而非单点软硬件
              SKU。这种垂直一体化解释了为何它始终以重大作战项目为切入点拿单，而非作为独立应用层参与竞争。单纯看公开产品演示远远不够。
