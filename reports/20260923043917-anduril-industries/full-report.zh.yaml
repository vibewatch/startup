  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局全貌
        blocks:
          - type: paragraph
            body: >-
              竞争对手覆盖面极广，因为 Anduril
              并非单一装备商。在具体竞标中，它既会遭遇传统军工主承包商，也会面对软件平台、垂直自主系统初创公司，甚至军方内部自研团队。这种多线竞争凸显了其核心卖点在于垂直整合：用同一套底层打通态势感知、自主决策与指挥控制。这也意味着
              Anduril 无法简单对标单一同行，必须同时在多个截然不同的采购维度上赢下竞争。
