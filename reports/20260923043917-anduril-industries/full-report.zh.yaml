              - CU004
              - CU005
              - CU010
      - number: '6.2'
        title: 客户采纳轨迹
        blocks:
          - type: paragraph
            body: >-
              当采办用语从概念验证（PoC）阶段转向批量列装或规模生产时，采纳动向才最可信。有关战备扩产和智能制造基地的公开报道表明，Anduril
              至少已有一部分客户愿意将其视作真实的交付伙伴，而非一次性样机试制方。这一转变表明其能够创造可复制的应用场景，但并未揭示活跃采购账户的真实总数。因此，公开信息展示的势头很强，但在分母数据上依然不透明。
            claimRefs:
              - CU002
              - CU008
              - CU010
          - type: table
            tableRef: TU002
            claimRefs:
              - CU002
              - CU008
              - CU010
      - number: '6.3'
        title: 标杆案例与客群留存
        blocks:
          - type: paragraph
            body: >-
              客户进展引人注目但信息依然零散。官方伙伴名录、批量列装用语和持续招募均符合“立足并扩张”的逻辑，但公开记录仍未披露客户留存率、合同续签率和单一买家集中度。站在投资人视角，首要问题在于客户韧性：究竟是少数几家巨额政府大单能够持续横向延伸，还是每次拿到新项目都必须从头经历一遍漫长的竞标说服？真实情况大概率介于两者之间，这也是深挖客户集中度与复购证据的核心原因。尽调不能仅凭单一标杆案例下结论，关键要查明同一军种账户能否持续增购，抑或每一笔新订单都等同于开启一次全新的采购长跑与博弈。
            claimRefs:
              - CU003
              - CU004
              - CU006
              - CU007
              - CU011
              - CU012
