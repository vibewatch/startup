        blocks:
          - type: paragraph
            body: >-
              产品模块图谱展现出极宽的技术延展面。Ghost、Roadrunner、Dive-LD、Fury、Sentry 以及 Lattice SDK
              并非彼此割裂，而是统一作战架构下的不同功能切片。宽产品线能讲出更强的交叉销售和架构复用故事，但也让公司承担了极重的实战交付与运维包袱。前线阵地硬件一旦故障，软件叙事就会随之崩塌；先进制造产线一旦脱节，自主平台的可信度便大打折扣。因此，产品线越宽，越依赖严丝合缝的交付执行来支撑平台逻辑。
