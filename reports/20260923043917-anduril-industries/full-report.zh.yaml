  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与买家画像
        blocks:
          - type: paragraph
            body: >-
              Anduril
              处在国防现代化、自主作战与指挥控制（C2）的交汇地带。市场边界的关键不在于卖硬件还是卖软件，而在于客户是否追求更快的“传感器到射手”闭环，并愿意以集成化项目形式采购这套能力。这种定位解释了为何它能横跨空中、陆地、海上及边境安全任务，却不像传统单点硬件厂商；也解释了为何即便其技术叙事极强，传统主承包商、政府自研团队和通用软件供应商依然是强劲替代品。
            claimRefs:
              - CM001
              - CM002
              - CM006
