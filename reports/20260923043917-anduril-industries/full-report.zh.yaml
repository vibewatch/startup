            body: >-
              Anduril
              的资金来源属于典型的军工结构：政府装备项目大单、软硬一体打包系统，以及部署后的持续运维保障服务。相比单纯做样机研发的项目制公司，这种收入底盘更具连续性；但单项软硬件定价往往被打包隐匿在项目总包和合同变更条款中。因此，公司表面上像平台型企业，财务表现却多以离散的项目中标呈现，而非清晰透明的软件订阅模式。这种收入特质也是其财务逻辑极具吸引力却难以直接对标的核心原因。
