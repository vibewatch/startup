        title: 壁垒深度与技术控制力
        blocks:
          - type: paragraph
            body: >-
              产品壁垒来自软硬集成、专有知识产权、先进制造和一线保障的复合能力。生态伙伴接入以及与 General Dynamics
              的合作表明，其意图掌控整个作战系统的核心操作系统层，而非仅仅提供单一末端载具。然而产品线过宽也增加了毛利率拆解难度，大幅推高了军方在系统可靠性、安全密级、数据隐私和合规认证上的门槛。实操中，真正的护城河并非某项单一技术指标，而是能持续交付且经受前线恶劣环境考验的实战系统。战略隐忧在于：若无法让这套产品跨越不同作战任务敏捷部署，而是滑向重度定制的军工外包服务，运营壁垒的含金量就会大打折扣。
