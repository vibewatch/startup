  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险排位
        blocks:
          - type: paragraph
            body: >-
              Anduril
              的风险结构完全符合一家夹在国防科技与公共政策交界处的独角兽特征。公司既要保持极高的交付速度来竞标军工项目，又必须应对远比普通软件初创严苛的采办、保密与合规审查。这构成了独特的风险格局：那些赋予公司高溢价的核心特质——深入敏感一线部署的自主杀伤武器——在发生系统差错或公众争议时，也会瞬间招致最严厉的监管与舆论审视。从这个维度看，合规与政策风险早已内生于其商业模式中，并非外来偶发变量。
            claimRefs:
              - CR001
              - CR008
              - CR011
          - type: table
            tableRef: TR001
            claimRefs:
              - CR002
              - CR006
              - CR008
          - type: figure
            figureRef: FR001
            claimRefs:
