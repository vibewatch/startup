      - number: '2.2'
        title: 市场规模测算与增长驱动
        blocks:
          - type: paragraph
            body: >-
              采购预算主要由国防和国土安全部门掌握，能够采购类似能力的盟国国防部也是重要来源。市场吸引力在于总体资金池体量庞大，地缘政治大环境持续提供催化；但漫长的装备采购流程、出口管制和保密合规要求拖慢了从意向到收入的转化节奏。因此，分析采购落地路径比单看自上而下的总可用市场（TAM）数字更为关键。实操中，公司先用自主能力解决具体作战任务打入体系，待客户验证可靠性后再向相邻项目横向延伸。
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM010
              - CM011
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM011
      - number: '2.3'
        title: 采纳阻碍与动量信号
        blocks:
          - type: paragraph
            body: >-
              招聘走势和生态合作表明该市场仍处在产能与体系铺设阶段。公司持续扩充工程研发、先进制造与一线保障团队；与 General Dynamics
              的合作则证明陆军地面装备现代化是不可忽视的延展方向。由于大量国防预算高度碎片化或涉及涉密采购，市场规模难以精准切片测算。整体赛道庞大且具备长期确定性，但渗透节奏仍受制于军方建制流程，并非单靠产品吸引力就能加速。采购节奏之所以关键，在于军工大单从意向转为收入的周期无法像纯软件那样敏捷。买家即便迫切需要自主系统，也必须经过预算审批、实战测试、小批量试用才能铺开列装。这种滞后性让市场充满吸引力，却并非畅行无阻。
            claimRefs:
              - CM007
              - CM008
