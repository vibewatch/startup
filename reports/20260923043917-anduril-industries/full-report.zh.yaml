    title: 公司概况
    sections:
      - number: '1.1'
        title: 业务定位与客群
        blocks:
          - type: paragraph
            body: >-
              Anduril
              本质是一家国防科技公司，核心逻辑是将软件、传感器与自主硬件打包成单一操作系统，交付军方和边境安全客户。这一定位比单点无人机厂商更广，比传统主承包商更聚焦。商业模式绑定政府装备项目与长采购周期；但产品体系比典型国防供应商更易理解，靠
              Lattice、自主算法与硬件整合成一套清晰平台。对外叙事始终锚定美军及盟国任务，产品演进直接受政府采购驱动，而非面向消费市场。
