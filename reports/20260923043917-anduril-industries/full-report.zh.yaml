        title: 细分客户群体
        blocks:
          - type: paragraph
            body: >-
              客户群体高度集中在国防军工与国土安全体系。采购部门看重实战效能、保密安全与长期履约可靠性，而非普通消费级的交互体验或自助注册转化。分析客户细分必须紧扣立项决策者、实际作战使用者与买单方的三权分立视角，不能套用传统
              SaaS
              销售漏斗。现有履约痕迹显示，公司基本沿着“拿下标杆项目、扎根部署、顺势切入相邻项目”的路径滚动扩张。这种打法让整个客户底盘显得相当集中，哪怕公开披露列出了众多军兵种和合作伙伴。归根结底，少数核心项目办公室的采办决策主导了公司大部分的显性增长空间。
            claimRefs:
              - CU001
              - CU005
              - CU009
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU005
              - CU006
          - type: figure
            figureRef: FU001
            claimRefs:
