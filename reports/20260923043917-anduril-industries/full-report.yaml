chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and Positioning
        blocks:
          - type: paragraph
            body: >-
              Anduril is best understood as a defense technology company that tries to package software, sensors, and
              autonomous hardware into a single operating system for military and border-security customers. That
              positioning matters because it is broader than a point-solution drone vendor and narrower than a
              traditional prime contractor. The business model is anchored in government programs and long sales cycles,
              but the product story is easier to follow than a typical defense supplier because Lattice, autonomy, and
              hardware show up as a coherent platform. The company's external messaging consistently emphasizes U.S. and
              allied missions, which keeps the product set tied to procurement rather than consumer demand.
            claimRefs:
              - CO001
              - CO009
              - CO010
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO006
              - CO007
              - CO011
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO001
              - CO004
              - CO005
              - CO006
              - CO008
              - CO012
      - number: '1.2'
        title: Founders, Leadership, and Control
        blocks:
          - type: paragraph
            body: >-
              The founding team combines product credibility, operating discipline, and political signaling. Palmer
              Luckey remains the public brand face, Brian Schimpf runs the company, and the broader founding group still
              matters because it links Anduril to Oculus, Palantir, and Founders Fund. That mix helps the company
              recruit both hardware engineers and software talent while also giving it a narrative that resonates with
              defense buyers. The main governance question is not whether the founders are visible, but how much of the
              business remains dependent on a small number of people to win programs, maintain trust, and keep the
              product cadence moving.
            claimRefs:
              - CO002
              - CO003
          - type: table
            tableRef: TO002
            claimRefs:
              - CO002
              - CO003
      - number: '1.3'
        title: Funding, Scale, and Milestones
        blocks:
          - type: paragraph
            body: >-
              The company's financing path shows clear late-stage scale: a $14B Series F in 2024, a public jump above
              $30B in 2025, and a $5B Series H in 2026. The new round is the strongest current signal that investors
              still see room for Anduril to compound into a much larger defense platform. At the same time, the
              company's growing headcount and Southern California expansion show that capital is being converted into
              manufacturing, engineering, and program capacity rather than sitting idle. The milestone pattern is
              therefore a mix of product launches, capital raises, and physical expansion at scale.
            claimRefs:
              - CO004
              - CO005
              - CO006
              - CO007
              - CO008
              - CO012
          - type: table
            tableRef: TO003
            claimRefs:
              - CO004
              - CO005
              - CO006
              - CO008
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Buyer Set
        blocks:
          - type: paragraph
            body: >-
              Anduril sits in a market that blends defense modernization, autonomy, and command-and-control. The real
              boundary is not whether the company sells hardware or software, but whether a buyer wants a faster
              sensor-to-shooter loop and is willing to buy that capability as an integrated program. That framing
              captures why the company can sell across air, land, sea, and border-security missions without looking like
              a traditional narrow-point vendor. It also explains why primes, internal government builds, and adjacent
              software vendors remain relevant substitutes even when Anduril has a strong technology narrative.
            claimRefs:
              - CM001
              - CM002
              - CM006
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM005
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM009
              - CM010
      - number: '2.2'
        title: Sizing Lenses and Growth Drivers
        blocks:
          - type: paragraph
            body: >-
              Budget ownership is primarily with defense and homeland-security organizations, plus allied ministries
              that can buy similar capabilities. The market is attractive because the budget pools are large and the
              geopolitical backdrop remains supportive, but procurement, export, and security requirements slow
              conversion from interest to revenue. That combination makes adoption path analysis more important than a
              single top-down TAM number. In practice, the company wins by tying autonomy to mission outcomes and then
              expanding across adjacent programs once buyers trust the deployment.
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM010
              - CM011
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM011
      - number: '2.3'
        title: Adoption Constraints and Momentum Signals
        blocks:
          - type: paragraph
            body: >-
              Anduril's hiring and partnership signals show a market still in build mode. The company continues to add
              technical talent, manufacturing capacity, and customer-facing support, while the General Dynamics
              relationship shows that ground-force modernization remains an important adjacency. At the same time, the
              market remains hard to size precisely because many program budgets are fragmented or partially classified.
              The result is a market that looks large and durable, but one where the pace of adoption is still
              constrained by institutions rather than by product desirability alone. Procurement timing matters because
              the strongest market signals do not turn into revenue on the same schedule as software. Buyers may want
              autonomy immediately, yet they still have to align budgets, test reliability, and often pilot the system
              before full deployment. That lag is what keeps the market attractive but not frictionless.
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM004
              - CM006
              - CM008
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitor Landscape
        blocks:
          - type: paragraph
            body: >-
              The competitive set is broad because Anduril is not just selling one product. In any given deal, it can
              run into a prime contractor, a software platform, a specialized autonomy startup, or an internal
              government team trying to build the same thing. That breadth matters because the company's best argument
              is integration: one stack across sensing, autonomy, and command-and-control. It is also a reminder that
              Anduril does not have the luxury of a simple named-peer comparison; it must win across several different
              buying criteria at once.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
      - number: '3.2'
        title: Scale, Trust, and Distribution
        blocks:
          - type: paragraph
            body: >-
              Scale and trust still favor the biggest incumbents. Legacy primes bring manufacturing depth, certification
              experience, and long-standing procurement relationships, while startups like Shield AI can be faster or
              more focused in a narrower slice of autonomy. Anduril tries to sit between those extremes by pairing
              startup velocity with prime-like delivery. That is a useful position, but it also means the company has to
              keep proving that its integration layer and software cadence are durable enough to keep larger buyers from
              simply stitching together their own stack.
            claimRefs:
              - CP005
              - CP008
              - CP010
          - type: table
            tableRef: TP002
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP011
      - number: '3.3'
        title: Moat Durability and Price Power
        blocks:
          - type: paragraph
            body: >-
              The strongest moat evidence is not a single benchmark score; it is the fact that Anduril keeps showing up
              in broader partnership and ecosystem conversations. Lattice SDK, prime-adjacent partnerships, and the
              continued hiring push all suggest a company trying to make its software hard to replace once deployed. But
              the same market structure that helps Anduril also gives buyers options. Multi-homing remains possible,
              pricing is usually opaque, and defense buyers can still fall back to status quo suppliers or build
              in-house if the product path disappoints. This is why the company's moat is best judged as a moving
              target: every program win can strengthen switching costs, but every competitor can also learn from the
              last contract and push the comparison back toward price, reliability, and procurement trust. today.
            claimRefs:
              - CP006
              - CP007
              - CP009
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP006
              - CP009
              - CP011
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams and Monetization
        blocks:
          - type: paragraph
            body: >-
              Anduril's money appears to come from a familiar defense stack: government programs, bundled systems, and
              recurring support around deployed platforms. That makes the revenue base more durable than a one-off
              prototype shop, but it also means that line-item pricing is often hidden inside program awards and
              contract modifications. The company can therefore look like a platform business while still being reported
              as a set of program wins rather than a clean software subscription model. That distinction is the core
              reason the financial story is both compelling and hard to benchmark.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI013
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI003
              - CI013
          - type: figure
