              - CV004
              - CV005
              - CV010
              - CV012
      - number: '8.2'
        title: Recommendation and Stance
        blocks:
          - type: paragraph
            body: >-
              The recommendation stays cautious because the company has to clear multiple hurdles at once: more revenue,
              better margins, and better disclosure. In other words, the current price is not obviously wrong, but it is
              far too rich to ignore the evidence gaps. That is why the correct stance is to track the company rather
              than to assume the market has already solved the pricing problem. If the company can show operating
              leverage and repeatability, the valuation can be defended; if not, the multiple will feel stretched very
              quickly.
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV010
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV005
              - CV006
              - CV008
              - CV011
      - number: '8.3'
        title: Scenarios and Exit Readiness
        blocks:
          - type: paragraph
            body: >-
              Scenario analysis helps because valuation here is less about one exact number and more about a range of
              outcomes. The bull case assumes fast program growth and software reuse; the base case assumes continued
              expansion but with a disclosure discount; the bear case assumes slower growth or a hardware-heavy mix.
              Comparable references are useful only as anchors, not as precise formulas, because the company is still
              private and still operating with more opacity than a public defense contractor. That is why exit readiness
              matters so much. The important point is that the market still has to decide whether Anduril is a rare
              defense platform or merely a very well-funded private contractor.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
          - type: table
            tableRef: TV003
