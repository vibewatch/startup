              - CI006
              - CI007
              - CI008
              - CI009
              - CI013
      - number: '4.2'
        title: Margins, Cost Structure, and Capital
        blocks:
          - type: paragraph
            body: >-
              Pricing and packaging are mostly program-specific, which is normal for defense but frustrating for
              investors. Lattice-like software may be embedded inside larger hardware and support bundles, so the
              visible price on a contract is not the same as the true software attach rate. That creates a margin story
              that can improve materially if the same software is reused across more deployments, but it also means the
              company has to prove that repeatability exists. Without that proof, the financial profile can still look
              like a high-growth hardware business with some software upside rather than a software company with
              hardware around the edges.
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
              - CI010
          - type: table
            tableRef: TI002
            claimRefs:
              - CI002
              - CI009
      - number: '4.3'
        title: Valuation and Financial Verdict
        blocks:
          - type: paragraph
            body: >-
              The capital picture is strong but not simple. The 2026 Series H gives Anduril a much larger cushion, yet
              the company still has to fund labor, manufacturing, and customer support while building a durable margin
              structure. Because audited financials are not public, every view on runway or profitability is necessarily
              approximate. That is why the current valuation remains a diligence test: it is plausible if growth stays
              fast and margins improve, but it is vulnerable if execution slows or if the business proves more
              hardware-heavy than the market wants. Investors should therefore treat the valuation as a claim on future
              execution, not as proof that current disclosures already support it. That makes diligence on margins and
              backlog especially important.
            claimRefs:
              - CI004
              - CI005
              - CI011
              - CI012
          - type: table
            tableRef: TI003
            claimRefs:
              - CI006
              - CI008
              - CI010
              - CI012
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Workflow
        blocks:
          - type: paragraph
            body: >-
              Anduril's product story is easiest to understand as a workflow: detect, decide, and act with software and
              hardware in the same loop. Lattice sits in the middle, but the company's public product pages make clear
              that this is not a pure software vendor. The stack spans autonomous aircraft, undersea systems, sensors,
              and border-security infrastructure, which means the real product is an integrated system rather than any
              one SKU. That integrated framing matters because it explains why the company keeps selling into mission
              programs instead of trying to win through a standalone app layer. That is why public product demos alone
              are not enough.
            claimRefs:
              - CE001
              - CE003
              - CE010
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE011
              - CE012
      - number: '5.2'
        title: Modules, Assets, and Architecture
        blocks:
          - type: paragraph
            body: >-
              The module map shows how broad the stack has become. Ghost, Roadrunner, Dive-LD, Fury, Sentry, and Lattice
              SDK are not interchangeable products; they are different slices of the same mission architecture. That
              breadth creates a stronger story for cross-sell and reuse, but it also makes the company responsible for
              more of the operational burden. If the field system fails, the software story fails with it. If the
              manufacturing pipeline slips, the autonomy story loses credibility. Product breadth therefore strengthens
              the platform narrative only if execution stays tight.
            claimRefs:
              - CE002
              - CE004
              - CE011
          - type: table
            tableRef: TE002
            claimRefs:
              - CE003
              - CE004
              - CE010
      - number: '5.3'
        title: Differentiation and Controls
        blocks:
          - type: paragraph
            body: >-
              Differentiation comes from a mix of integration, IP, manufacturing, and support. The company can point to
              partner integrations and the General Dynamics relationship as evidence that it wants to own more of the
              operating layer, not just the point product. But the same breadth makes margin analysis harder and raises
              the bar on trust, safety, privacy, and compliance. In practice, the moat is not a single technical
              feature; it is the ability to keep shipping operational systems that customers can actually field and
              sustain over time. The strategic risk is that this operational moat only stays valuable if the product
              keeps getting easier to deploy across different missions without turning into a bespoke services business.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
              - CE012
          - type: table
            tableRef: TE003
            claimRefs:
              - CE003
              - CE005
              - CE011
              - CE012
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segments
        blocks:
          - type: paragraph
            body: >-
              Anduril's customer base is concentrated in defense and homeland-security channels. The company sells to
              agencies that care about mission performance, security, and procurement reliability more than about
              consumer UX or self-service conversion. That means customer segmentation has to be read through the lens
              of buyer, user, and payer, not through a classic SaaS funnel. The visible footprint also suggests a
              company that grows by landing one program and then using that deployment to open the next adjacent
              program. That makes the market feel concentrated even when the public story shows many different agencies
              and partners. The same handful of program offices can therefore shape most of the company's visible growth
              path.
            claimRefs:
              - CU001
              - CU005
              - CU009
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
