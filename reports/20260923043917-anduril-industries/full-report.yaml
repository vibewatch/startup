              - CU002
              - CU003
              - CU004
              - CU005
              - CU010
      - number: '6.2'
        title: Adoption Trajectory
        blocks:
          - type: paragraph
            body: >-
              Adoption signals are strongest when a program moves from proof-of-concept language to production or scale
              language. Public materials around surge capacity and manufacturing indicate that Anduril has at least some
              customers willing to treat the company as a real delivery partner rather than a one-off prototype vendor.
              That matters because it suggests the company can create repeatable use cases, but it does not reveal how
              many accounts are actually active. The public story is therefore stronger on movement than on
              denominators.
            claimRefs:
              - CU002
              - CU008
              - CU010
          - type: table
            tableRef: TU002
            claimRefs:
              - CU002
              - CU008
              - CU010
      - number: '6.3'
        title: Named Proof and Durability
        blocks:
          - type: paragraph
            body: >-
              The customer story is compelling but incomplete. Named partnerships, production language, and hiring all
              support a land-and-expand interpretation, yet the public record still leaves retention, renewal, and
              concentration data hidden. For an investor, that means the key question is durability: can a small number
              of large government relationships keep expanding, or will the company have to keep re-earning every
              program from scratch? The answer is likely somewhere in the middle, which is exactly why concentration and
              repeat-buy evidence matter so much. For diligence, that means a single strong proof point is not enough.
              Investors need to know whether the same account can keep expanding or whether every new win requires a
              fresh procurement cycle and a new round of persuasion.
            claimRefs:
              - CU003
              - CU004
              - CU006
              - CU007
              - CU011
              - CU012
          - type: table
            tableRef: TU003
            claimRefs:
              - CU003
              - CU004
              - CU006
              - CU010
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk Ranking
        blocks:
          - type: paragraph
            body: >-
              Anduril's risk stack is what you would expect from a company sitting between defense tech and public
              policy. The company has to move quickly enough to win programs, but it also has to satisfy procurement,
              security, and compliance expectations that are much stricter than those faced by a typical software
              startup. That creates a risk profile where the same thing that makes the company attractive — autonomous
              systems deployed into sensitive missions — also makes it easy to attract scrutiny whenever something goes
              wrong or looks controversial. In that sense, risk is built into the business model, not an external
              add-on.
            claimRefs:
              - CR001
              - CR008
              - CR011
          - type: table
            tableRef: TR001
            claimRefs:
              - CR002
              - CR006
              - CR008
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR012
      - number: '7.2'
        title: Regulatory and Operational Risk
        blocks:
          - type: paragraph
            body: >-
              Regulatory and legal risk sit at the top because they can create sudden downside without warning. Public
              criticism around border security shows that the company's work can become a political issue, while the
              defense setting keeps privacy, export, and safety questions alive all the time. The operational layer is
              nearly as important: hardware programs can slip, supply chains can tighten, and support burdens can rise
              exactly when the company is trying to scale. Those are the kinds of failures that can turn a strong sales
              story into a delivery problem very quickly.
            claimRefs:
              - CR002
              - CR003
              - CR006
              - CR007
              - CR010
          - type: table
            tableRef: TR002
            claimRefs:
              - CR003
              - CR007
              - CR010
      - number: '7.3'
        title: Partner, Financial, and Thesis Break Risk
        blocks:
          - type: paragraph
            body: >-
              Partner and capital risks are the subtler version of the same problem. Anduril relies on allies, primes,
              and program partners to broaden reach, which helps distribution but also creates dependency. The 2026
              financing round buys time, but it does not remove the need for disciplined execution or a cleaner
              disclosure story. Investors should therefore watch for warnings in contract cadence, hiring, program
              deliveries, and public criticism rather than waiting for a single headline event. The thesis weakens when
              multiple small failures line up at once. Put differently, the company can survive any one of these risks,
              but investors should worry if several of them worsen together during the same budget cycle.
            claimRefs:
              - CR004
              - CR005
              - CR009
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR004
              - CR005
              - CR011
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Current Price Context
        blocks:
          - type: paragraph
            body: >-
              Anduril's valuation now has a much higher anchor than it did in the last funding cycle. The 2026 Series H
              sets a new price point, but the real question for investors is whether the company can keep compounding
              fast enough to make the number feel conservative in hindsight. Because the business is still private, the
              market is pricing a story rather than a fully disclosed financial profile. That makes the valuation debate
              more dependent on the quality of the growth narrative than on a clean public model. The market is likely
              to keep rewarding proof, not promises. for now, at least.
            claimRefs:
              - CV001
              - CV002
              - CV011
          - type: table
            tableRef: TV001
            claimRefs:
              - CV004
              - CV005
              - CV010
          - type: figure
