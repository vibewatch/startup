sections:
- id: SO-S1
  title: Identity and Positioning
  body: Anduril is best understood as a defense technology company that tries to package software, sensors, and autonomous
    hardware into a single operating system for military and border-security customers. That positioning matters because it
    is broader than a point-solution drone vendor and narrower than a traditional prime contractor. The business model is
    anchored in government programs and long sales cycles, but the product story is easier to follow than a typical defense
    supplier because Lattice, autonomy, and hardware show up as a coherent platform. The company's external messaging consistently
    emphasizes U.S. and allied missions, which keeps the product set tied to procurement rather than consumer demand.
  claimRefs:
  - CO001
  - CO009
  - CO010
  tableRefs:
  - TO001
  figureRefs:
  - FO001
- id: SO-S2
  title: Founders, Leadership, and Control
  body: The founding team combines product credibility, operating discipline, and political signaling. Palmer Luckey remains
    the public brand face, Brian Schimpf runs the company, and the broader founding group still matters because it links Anduril
    to Oculus, Palantir, and Founders Fund. That mix helps the company recruit both hardware engineers and software talent
    while also giving it a narrative that resonates with defense buyers. The main governance question is not whether the founders
    are visible, but how much of the business remains dependent on a small number of people to win programs, maintain trust,
    and keep the product cadence moving.
  claimRefs:
  - CO002
  - CO003
  tableRefs:
  - TO002
- id: SO-S3
  title: Funding, Scale, and Milestones
  body: 'The company''s financing path shows clear late-stage scale: a $14B Series F in 2024, a public jump above $30B in
    2025, and a $5B Series H in 2026. The new round is the strongest current signal that investors still see room for Anduril
    to compound into a much larger defense platform. At the same time, the company''s growing headcount and Southern California
    expansion show that capital is being converted into manufacturing, engineering, and program capacity rather than sitting
    idle. The milestone pattern is therefore a mix of product launches, capital raises, and physical expansion at scale.'
  claimRefs:
  - CO004
  - CO005
  - CO006
  - CO007
  - CO008
  - CO012
  tableRefs:
  - TO003
