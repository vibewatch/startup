chapter:
  number: 1
  title: Company Overview
  summary: Anduril Industries is a late-stage private defense technology company founded in 2017 and headquartered in Costa
    Mesa, California. It combines autonomy software, sensors, and hardware systems into a single government contracting business
    spanning air, land, sea, and border-security missions. The company's most visible current milestones are its 2026 Series
    H capital raise, its expanding manufacturing and campus footprint in Southern California, and its continued role as one
    of the best-known private defense platforms in the U.S. market.
