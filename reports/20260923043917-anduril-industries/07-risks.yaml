sections:
- id: SR-S1
  title: Risk Ranking
  body: "Anduril's risk stack is what you would expect from a company sitting between defense tech and public policy. The\
    \ company has to move quickly enough to win programs, but it also has to satisfy procurement, security, and compliance\
    \ expectations that are much stricter than those faced by a typical software startup. That creates a risk profile where\
    \ the same thing that makes the company attractive \u2014 autonomous systems deployed into sensitive missions \u2014 also\
    \ makes it easy to attract scrutiny whenever something goes wrong or looks controversial. In that sense, risk is built\
    \ into the business model, not an external add-on."
  claimRefs:
  - CR001
  - CR008
  - CR011
  tableRefs:
  - TR001
  figureRefs:
  - FR001
- id: SR-S2
  title: Regulatory and Operational Risk
  body: 'Regulatory and legal risk sit at the top because they can create sudden downside without warning. Public criticism
    around border security shows that the company''s work can become a political issue, while the defense setting keeps privacy,
    export, and safety questions alive all the time. The operational layer is nearly as important: hardware programs can slip,
    supply chains can tighten, and support burdens can rise exactly when the company is trying to scale. Those are the kinds
    of failures that can turn a strong sales story into a delivery problem very quickly.'
  claimRefs:
  - CR002
  - CR003
  - CR006
  - CR007
  - CR010
  tableRefs:
  - TR002
- id: SR-S3
  title: Partner, Financial, and Thesis Break Risk
  body: Partner and capital risks are the subtler version of the same problem. Anduril relies on allies, primes, and program
    partners to broaden reach, which helps distribution but also creates dependency. The 2026 financing round buys time, but
    it does not remove the need for disciplined execution or a cleaner disclosure story. Investors should therefore watch
    for warnings in contract cadence, hiring, program deliveries, and public criticism rather than waiting for a single headline
    event. The thesis weakens when multiple small failures line up at once. Put differently, the company can survive any one
    of these risks, but investors should worry if several of them worsen together during the same budget cycle.
  claimRefs:
  - CR004
  - CR005
  - CR009
  - CR012
  tableRefs:
  - TR003
