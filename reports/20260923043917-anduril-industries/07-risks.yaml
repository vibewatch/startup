  title: Risks
  summary: Anduril's largest risks cluster around regulation, operations, dependency concentration, and capital intensity.
    The company's defense mission creates real upside, but it also exposes the business to procurement delays, export controls,
    safety issues, and public criticism. The main diligence issue is not whether risk exists; it is whether the company can
    keep mitigating it faster than scale makes each failure mode more expensive.
