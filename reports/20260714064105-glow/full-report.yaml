  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and what counts as the problem Glow is selling into
        blocks:
          - type: paragraph
            body: >-
              Glow should not be placed into the market map as only another endpoint antivirus or EDR startup. Its
              current homepage and terms describe an enterprise software platform built to control what runs on
              endpoints, surface software and AI-tool usage, and help organizations adopt AI safely. That pushes Glow
              into a converged control layer where endpoint enforcement, insider-risk monitoring, data-loss prevention,
              and AI-governance workflows increasingly overlap. CISA's insider-threat framework and Microsoft's Insider
              Risk Management product documentation are especially useful for boundary-setting because they show the
              enterprise problem is no longer just malware prevention; it also includes authorized users misusing
              access, inadvertent data leakage, risky browser or AI behavior, and governance processes for investigating
              policy violations. Palo Alto's DSPM materials add the adjacent data-first lens, emphasizing discovery,
              classification, access monitoring, and policy enforcement across hybrid environments. The right market
              boundary for Glow is therefore a layered one: core endpoint software visibility and control at the device
              edge, broader data and insider-risk governance around it, and emerging AI-governance spending as the
              fastest-growing adjacency. What should stay outside the boundary is generic network security, firewall
              spend, classic SIEM log storage, or undifferentiated SMB antivirus.
