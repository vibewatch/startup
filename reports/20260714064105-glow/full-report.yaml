      - number: '2.4'
        title: Growth drivers, adoption constraints, and the market questions that still matter most
        blocks:
          - type: paragraph
            body: >-
              Several demand accelerants line up behind Glow's category wedge. IBM's 2025 breach research ties
              ungoverned AI and weak access controls to more costly incidents, CrowdStrike says AI platforms and
              developer tools are under active attack, and Palo Alto as well as the DSPM market reports connect
              cloud-data sprawl to rising demand for visibility and automated enforcement. The SEC's 2023
              cyber-governance rules add another layer of urgency for larger companies by making cyber-risk processes
              and board oversight more explicit disclosure topics. These forces all support the idea that buyers want
              controls that span endpoint activity, data movement, and AI usage rather than siloed point products. The
              constraints are just as important. Microsoft's privacy guide shows that insider-risk monitoring requires
              explicit opt-in and careful role design, which means employee-trust and privacy objections are real, not
              theoretical. Microsoft's setup documentation, DataHorizzon's restraint discussion, and Zscaler's
              legacy-DLP critique all point to the same operational brake: configuration, connectors, false positives,
              and multicloud complexity can slow adoption even when the need is obvious. Competitive pressure is another
              brake because large incumbents can bundle insider risk, DLP, DSPM, or endpoint capabilities into broader
              suites. The deepest remaining public-information gap is not whether the market is large; it is where
              Glow's actual revenue wedge sits inside it, how buyers budget the platform, and how much of the category
              is realistically open to an independent startup rather than platform vendors.
