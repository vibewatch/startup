      - number: '7.2'
        title: Competition, deployment complexity, and third-party dependencies can transmit quickly into revenue risk
        blocks:
          - type: paragraph
            body: >-
              Glow's second major risk cluster is operational, but the driver is competitive reality as much as internal
              execution. The company's own contract surfaces imply a nontrivial deployment environment: hosting-provider
              dependence, integrations into customer and third-party systems, automatic updates and upgrades that may
              reach customer-premises components, and optional professional services for installation, configuration,
              integration, and training. Those are all normal enterprise-software terms, but they imply deployment
              friction, change-management burden, and possible services intensity. In a category touching endpoints,
              false positives, change-control mistakes, or brittle integrations can create outsized customer pain.


              Competitors and adjacent vendors show how exposed Glow is to this burden. ThreatLocker markets
              allowlisting as fast to deploy, easy to scale, and explicitly compliance-aligned. Cyberhaven has raised
              $100 million at a $1 billion valuation behind a differentiated data-lineage narrative. Nudge Security says
              it has nearly 200 customers, 3x ARR growth for two consecutive years, and over 60 feature releases while
              selling AI and SaaS governance from the workforce edge. Even if those companies are not perfect
              substitutes, they prove that enterprise buyers have adjacent options with stronger public traction, faster
              deployment claims, or more complete proof packages.


              The operational implication is that Glow cannot rely on category excitement alone. If deployment requires
              too much customization, if the product's autonomous controls create operational friction, or if
              integrations lag the pace of enterprise requirements, competition will translate directly into slower
              conversions, smaller initial lands, and weaker expansion. The public evidence does not prove that Glow has
              these problems, but it also does not yet disprove them.
