      - number: '5.3'
        title: Differentiation, trust controls, and what the public evidence still does not prove
        blocks:
          - type: paragraph
            body: >-
              Glow's public differentiation rests on three linked ideas. First, it is endpoint-first at a moment when AI
              changes what runs on the device edge and how quickly new tools spread. Second, it treats AI governance as
              a software-governance problem rather than only a model-governance problem. Third, its trademark record
              suggests it wants to combine visibility with active execution control instead of stopping at discovery or
              advisory analytics. The comparison set clarifies the wedge. Nudge's Workforce Edge story is strongest on
              discovery, SaaS and AI inventory, and behavioral nudges without agents or proxies. Palo Alto and Microsoft
              sell broader multi-signal suites with mature SOC integrations. Glow is trying to sit between those models:
              more control-layer specific than the large suites, but more endpoint-enforcement oriented than
              discovery-first governance startups. That is a potentially investable wedge because enterprises often
              trust the endpoint more than the browser as a real control point.


              The trust and control story is directionally real but under-documented. Glow's privacy materials describe
              data collection, cloud providers, AI tools and features, analytics vendors, and compliance interactions
              with regulators and courts. The terms describe customer data, analytics information, third-party hosting,
              support, professional services, and third-party software components. Those are useful signs that the
              company has already thought about data handling, service operations, and legal posture. The support page
              advertises contact channels and references compliance, and the existence of a privacy-policy-2026 URL
              suggests the legal surface is being actively maintained. However, no reviewed public source disclosed SOC
              2, ISO 27001, ISO 42001, FedRAMP, or equivalent control attestations. There is also no public incident or
              status page, and the public docs surface is gated. The company is therefore showing the right categories
              of trust instrumentation without yet exposing the proof package a later-stage enterprise buyer would
              normally expect.


              The biggest product-tech caution is the gap between specificity and completeness. The trademark language
              is unusually specific and points to a serious product vision, but the website still contains placeholder
              press content and only shallow product prose. That means the differentiated thesis is plausible, yet the
              external evidence still stops short of proving breadth of integrations, quality of remediation, policy
              false-positive rates, deployment burden, platform coverage across operating systems, or durability of
              analytics at scale. Product-tech diligence should therefore focus less on whether Glow has a concept and
