  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product scope, module map, and the customer job Glow is selling
        blocks:
          - type: paragraph
            body: >-
              Glow's own language now makes the customer job legible. The company calls itself 'The Endpoint AI Company'
              and repeatedly says it helps security teams control everything that runs on endpoints. The website narrows
              that promise into three practical product buckets: safe AI adoption, software visibility and control, and
              asset inventory management. Those are not random marketing tags. Together they imply a platform that
              starts with software and tool discovery on employee devices, extends into governance of plugins, packages,
              MCP servers, and AI-enabled applications, and then adds policy or access controls to keep the environment
              clean over time. The terms reinforce that this is sold as an enterprise SaaS product with features and
              subscription scope defined by order form rather than a single shrink-wrapped agent. Glow therefore looks
              less like a traditional EDR replacement and more like a software-governance control layer built on the
              endpoint as the enforcement point.


              The trademark record is especially valuable because it exposes functionality that the homepage only hints
              at. The GLOW and AUTONOMOUS FENCING applications describe adaptive allow-listing, risk scoring,
              application execution policy creation and enforcement, AI-based classification of executables, telemetry
              reporting, API-based integration with third-party systems, and controls on application access to data.
              That language supports a module map with at least five logical components: endpoint discovery and
              telemetry, software and AI inventory, policy and execution control, AI or rule-assisted classification and
              remediation, and integration outputs into the broader enterprise security stack. The public site's
              customer language is also consistent with this reading. Antares focuses on getting clean and understanding
              what is actually running, Xactly highlights the connection between AI governance and broader software
              governance, and the anonymous engineering quote emphasizes autonomous remediation. Those signals together
              suggest the platform is meant to reduce software sprawl first and automate control actions second.


              Glow's public portfolio surface is still early-stage, but it is no longer empty. The blogs hub has
              Product, Customer Stories, Glow Labs, and Industry Insights categories, and the events surface is active
              around Black Hat 2026. That indicates the company is building a category narrative around endpoint AI
              control rather than keeping the product completely hidden. Even so, there is still no public pricing page,
              no public packaging grid, and no publicly open technical docs set. Investors should read Glow as a company
              with a coherent product thesis and emerging module structure, but with externally visible product
              documentation that is still closer to launch-phase marketing than to a mature platform handbook.
