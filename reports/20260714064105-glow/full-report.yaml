  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape shape: direct converged startups, suite incumbents, and status-quo substitutes'
        blocks:
          - type: paragraph
            body: >-
              Glow's competitive set is broader than the word 'endpoint' suggests. Its public product language sits at
              the junction of endpoint control, AI governance, software visibility, and data-risk reduction, so the
              buyer can solve the same job in at least three different ways. The first class is the direct converged
              startup set. Cyberhaven is the strongest example because it explicitly combines DSPM, DLP, insider risk
              management, and AI security in one platform and positions its data-detection-and-response approach as a
              replacement for legacy DLP and insider-threat tools. Nudge Security is another meaningful adjacent peer:
              it does not lead with endpoint enforcement, but it attacks the same safe-AI-adoption problem from the
              workforce edge by discovering AI and SaaS usage, OAuth grants, and risky integrations without traditional
              agents or proxies. The second class is the incumbent platform suite. CrowdStrike, SentinelOne, Microsoft,
              and Palo Alto Networks all extend far beyond endpoint detection into adjacent control planes such as
              identity, cloud, DLP, SIEM, and AI-enabled response. The third class is status-quo substitutes and
              narrower tools, including allowlisting or execution-control products like ThreatLocker, legacy DLP, manual
              AI-governance review, and internal build-outs on top of endpoint and identity telemetry. Glow therefore is
              not just fighting for superiority inside one feature matrix; it is fighting for the right to define which
