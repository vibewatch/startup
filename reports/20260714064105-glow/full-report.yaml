            body: >-
              Glow's customer chapter is stronger than a pure-stealth story but weaker than a mature growth-company
              customer file. The company has real named references, those references are fresh enough to matter, and the
              reference set spans exactly the kinds of sophisticated buyers that security investors want to see:
              regulated finance, enterprise software, and large IT operations. That is a meaningful positive because
              many stealth or newly emerged security companies still rely only on anonymous quotes or investor
              narrative.


              The limitation is that almost every core underwriting question after initial proof remains unanswered in
              public. The reviewed sources do not reveal how many customers Glow has, which of the named references are
              paid production customers, what deployment scope they run, whether any have renewed, how fast
              land-and-expand works, or how concentrated the book of business may be. The public file therefore supports
              the claim that Glow has won high-quality conversations and likely some real deployments, but it does not
              support a claim of broad commercial scale or durable cohort performance.


