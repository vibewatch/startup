    company positions itself as The Endpoint AI Company and is building an enterprise SaaS platform for software
    visibility, AI-tool and MCP governance, and control over what runs on managed endpoints. Public traction signals
    remain narrow but meaningful, with named references from Antares Capital, Xactly, and BMC Software, while the
    funding path has accelerated from seed and Series A rounds in 2025 to a reported $100M+ Series B at a $1B+ valuation
