            body: >-
              Cyberhaven is the most relevant startup benchmark because it sells the same convergence story more
              explicitly than Glow does today. Its official materials say it unifies DSPM, DLP, IRM, and AI security,
              and its April 2025 financing announcement shows that investors were willing to price that thesis at a $1
              billion valuation after the company raised $100 million Series D and reached $250 million total funding.
              Nudge Security is a smaller but strategically important adjacent player. Its 2025 Series A announcement
              says it had nearly 200 customers and two consecutive years of 3x ARR growth while focusing on Workforce
              Edge discovery, governance, and user nudges around SaaS and AI usage. That gives it a lighter-weight,
              faster-deploying answer to the same shadow-AI and shadow-app problem, albeit with less native
              endpoint-enforcement emphasis. The incumbent benchmark set is formidable. CrowdStrike ended fiscal 2026 at
              $5.25 billion of ARR and now frames itself as AI mission-critical infrastructure; SentinelOne passed $1
              billion in revenue and claims customers are standardizing on Singularity as a unified platform; Palo Alto
              Networks produced $9.2 billion of revenue in fiscal 2025 while selling through a powerful channel network
              and extending XDR into DLP and cloud-security operations; and Microsoft can push similar functionality
              through Defender, Purview, Intune, Entra, and M365 packaging. Against that field, Glow's best chance is
              not to out-bundle the giants, but to be more precise and easier to operationalize at the endpoint-control
