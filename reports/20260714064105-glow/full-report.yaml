      - number: '1.2'
        title: Founders, leadership bench, and key-person exposure
        blocks:
          - type: paragraph
            body: >-
              The public record supports a technically strong founding team. Startup Nation Central names Roi Tiger,
              Omer Singer, and Ophir Arie as founders, and Glow's own about page gives all three continuing executive
              roles: Tiger as CEO, Singer as CTO, and Arie as VP R&D. Calcalist's March 2025 report adds that Pini
              Pinhasov was part of the original formation but Calcalist's February 2026 follow-up says he later left the
              company. That sequence is important for diligence because it implies Glow started with a broader founding
              bench than the current website shows, and that at least one founding-era operator had departed before the
              unicorn round was publicly reported.


              Founder-market fit is unusually strong for such a young company. Calcalist says Tiger co-founded Onavo and
              later led engineering for commerce at Meta before leaving in 2022; TechCrunch's 2013 acquisition coverage
              independently confirms Tiger's Onavo CTO role and the material outcome from selling the company to
              Facebook. Singer's background is also highly relevant to Glow's stated product direction: SecurityInformed
              identifies him as Snowflake's former Head of Cybersecurity Strategy, and his personal site says he helped
              pioneer the modern security data lake at Snowflake. Arie and Pinhasov both trace back to Medigate, whose
              sale to Claroty gave the founding cluster another Israeli cyber exit credential. This is the kind of
              founder-market fit that can justify early capital velocity even before broad product disclosure.


              Glow has also begun to professionalize its non-founder bench in public. The about page adds Arnon Joseph
              as Chief Product Officer, Emily Heath as Chief Strategy Officer, and Patti Degnan as Chief Trust &
              Security Officer. Heath's prior profile as a Cyberstarts general partner and former CISO at United
              Airlines and DocuSign suggests Glow is recruiting operators with boardroom credibility and
              enterprise-security go-to-market empathy, not only engineering depth. The flip side is concentrated
              key-person dependence: Tiger remains the identity anchor for fundraising, Singer appears to be the most
              public technical founder, and there is still no disclosed public board roster that would let outside
              investors judge governance balance.
