      - number: '3.4'
        title: Moat durability, incumbent pressure, and the competitive verdict
        blocks:
          - type: paragraph
            body: >-
              The competitive verdict is mixed but investable. Glow is entering a category where buyer pain is real and
              where even sophisticated security teams are still looking for cleaner ways to manage AI usage, endpoint
              software sprawl, and data movement. That gives the company room to define a new wedge. But the moat is not
              durable yet. Cyberhaven already articulates a fuller AI-and-data-security platform story, Nudge has a
              faster and easier governance-led entry motion for shadow AI, ThreatLocker owns a crisp allowlisting
              substitute, and the incumbents can wrap endpoint, DLP, IRM, cloud, SIEM, and identity into one procurement
              event. Palo Alto's indirect channel model and customer base across almost all Fortune 100 companies
              exemplify how much distribution leverage Glow is up against. CrowdStrike's module expansion and Falcon
              Flex accounts, Microsoft bundle economics, and SentinelOne's upmarket standardization claims all point to
              the same structural hazard: if Glow's product value is perceived as modular rather than foundational, the
              market will reward incumbents that can attach similar features to existing platforms. Adverse evidence
              from Cybereason reinforces the point that the endpoint category can be unforgiving to vendors that scale
              costs faster than durable differentiation. The practical takeaway is that Glow does not need to beat every
              rival everywhere; it needs to win a narrow but urgent control problem quickly enough to become sticky
              before suite consolidation catches up.
