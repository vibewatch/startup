      - number: '8.2'
        title: Comparable context shows why a $1B+ mark is plausible, but also why public support is still thin
        blocks:
          - type: paragraph
            body: >-
              The easiest mistake in valuing Glow is to cherry-pick only the highest-multiple comps. The public security
              leaders are huge, real, and impressive: CrowdStrike ended fiscal 2026 at $5.25 billion ARR and $4.81
              billion revenue, SentinelOne reached $1.12 billion ARR and just over $1.0 billion revenue, and Palo Alto
              generated $9.2 billion revenue with $15.8 billion remaining performance obligations. Their public-equity
              values in July 2026 are correspondingly large. But those companies are not just larger versions of Glow.
              They are scaled businesses with broad product suites, established renewal histories, and much denser proof
              packages.


              Benchmark sources make the trade-off clearer. SaaSDB's 2026 public SaaS report places the median security
              EV/revenue multiple at 5.8x, while BVP's Cloud 100 benchmarks say the average public BVP Cloud Index
              company trades around 8x ARR and private AI companies command around 24x on average. Cyberhaven's $1
              billion valuation and Nudge Security's strong growth show that private investors are willing to pay for
              AI-native security stories. But those benchmarks are useful only if the company in question can
              demonstrate corresponding growth or category dominance. Glow has not publicly done that yet.


              Put differently: a $1B headline value is plausible inside the 2026 private AI/security market, but the
              public record does not yet show which multiple family Glow actually belongs in. It might deserve a
              public-security-like discount, a premium private-AI multiple, or something in between. Without ARR and
              retention, there is no way to know from public evidence alone.
