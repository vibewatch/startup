  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, privacy, and trust risk is the most immediate diligence cluster
        blocks:
          - type: paragraph
            body: >-
              Glow operates in a control category that sits uncomfortably close to employee monitoring, software
              governance, and AI governance at the same time. That combination creates real regulatory and trust
              complexity. The EU AI Act is now being implemented through the AI Office, national competent authorities,
              and a growing body of secondary documents and guidelines. NIST is actively revising its AI risk framework
              and has already issued a 2026 concept note for critical-infrastructure AI risk management. The SEC's
              cybersecurity disclosure rules have also sharpened board- and management-level expectations for governance
              and incident readiness. Even where those rules do not apply directly to Glow as a private company, they
              shape what enterprise buyers now expect from vendors handling security-sensitive workflows.


              Endpoint and insider-risk workflows raise an additional privacy problem. The ICO's worker-monitoring
              guidance makes clear that organizations must justify, limit, and govern monitoring practices carefully.
              Microsoft's Insider Risk Management privacy documentation shows what mature vendor positioning looks like
              in this category: pseudonymization, role-based access controls, audit logs, and explicit opt-in for
              sensitive indicators. Glow's public privacy policy and terms show that the company has already thought
              about data collection, hosting, AI tools, service providers, regulators, and cross-border transfers. But
              the same public file does not disclose a public trust center, third-party certifications, a status page,
              an incident archive, or detailed privacy-by-design controls at Microsoft-like depth. The docs surface is
              gated, so outsiders cannot inspect how the product handles sensitive workflows in practice.


              This does not prove non-compliance. It does mean the burden of proof shifts into diligence. For a company
              promising autonomous remediation, application control, and endpoint-level governance, buyers will
              reasonably ask how policy actions are scoped, logged, reviewed, and rolled back. Until Glow can show that
              evidence package, regulatory and trust risk should be treated as material rather than hypothetical.
            claimRefs:
