      - number: '8.4'
        title: Exit logic is credible, but underwriting readiness still depends on missing metrics and round terms
        blocks:
          - type: paragraph
            body: >-
              There are credible exit paths for Glow if the hidden metrics are strong. Strategically, larger security
              platforms continue to buy or build around AI, endpoint, cloud, and data-control themes. Financially,
              growth investors are still willing to finance companies that look like category leaders early. But exit
              credibility is not the same as underwriting readiness. The question for investors is not whether there
              could be a buyer or future sponsor. The question is whether today's entry price leaves enough room for
              risk-adjusted returns once dilution, preference terms, and operating quality are known.


              That is where the diligence burden is concentrated. An investor needs current ARR, net retention,
              concentration, gross-margin mix, professional-services load, and the exact terms of the 2026 round. If
              those numbers are exceptional, today's stretched-looking price could still become fair or attractive. If
              they are only average, the same headline price could quickly look expensive. Public evidence cannot
              resolve that tension. It can only frame the right questions.


              The correct conclusion is therefore conditional: Glow is likely too important to ignore, but still too
              opaque to bless at face value.
