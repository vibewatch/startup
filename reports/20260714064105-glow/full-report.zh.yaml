      - number: '4.4'
        title: 财务结论：软件经济模型有前景，但核验阻碍严重
        blocks:
          - type: paragraph
            body: >-
              财务结论并不看空商业模式质量；它看空公开证据质量。Glow 几乎肯定具备一个有财务吸引力的企业安全模型轮廓：经常性 SaaS
              合同、没有可见硬件负担、足够积极招聘的资本，以及一个在利润率和留存可信时会给软件优先安全平台强估值支持的市场。但硬核投资核验指标都不公开。因此，关于收入质量、利润率路径、CAC
              回收、现金续航或超出融资头条之外的资本充足度，所有有意义结论都只是估计，而不是已验证事实。近期最大的财务风险，是擅长套件打包的竞争对手在 Glow
              证明必需切入点之前，迫使它降价并拉长销售周期。最大的尽调阻碍不是缺少某一个指标，而是所有能把已融资金额与商业效率连起来的指标同时缺席。换句话说，从外部看 Glow
              可融资，因为投资人已经投了钱；但没有管理层数据室访问，Glow 还不能作为后期运营资产被公开核验。
