  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - Glow 隐藏 ARR 增长异常强劲，企业客户扩张真实，且信任材料包足以支撑 快速扩张
        - 随时间推移支撑约 $3B-$5B 的估值结果
        - 执行、竞争或治理证明仍可能打破该情景
        - 只有隐藏指标已经呈现顶级水平时才可能成立
      - - 基准
        - Glow 确有切口，也有真实企业牵引，但经济性和扩张只是扎实， 并非出众
        - 支撑约 $1B-$2B 估值区间
        - 当前估值可能已经消化该情景的大部分上行
        - 最符合当前公开证据
      - - 悲观
        - 客户深度弱于暗示，服务负担较高，或估值跑在产品市场契合度前面
        - 支撑位下滑至约 $0.5B-$0.9B
        - 下调融资或战略重置变得可能
        - 没有数据室就无法排除
    notes: 情景区间对证据敏感；ARR 未披露，因此有意设得较宽。
    claimRefs:
      - CV021
      - CV022
      - CV023
      - CV027
      - CV028
