    summary: Glow 在具名买方可信度上得分最高，在公开留存和部署深度可见性上最弱。
    data:
      columns:
        - 具名买方可信度
        - 结果具体度
        - 生产可见性
        - 留存可见性
      rows:
        - label: Antares Capital
          values:
            - 高
            - 中
            - 低-中
            - 低
        - label: Xactly
          values:
            - 高
            - 中
            - 低-中
            - 低
        - label: BMC Software
          values:
            - 高
            - 中
            - 低-中
            - 低
        - label: 匿名科技客户
          values:
            - 低
            - 中
            - 低
            - 低
    approximationNotes: 矩阵单元格表达的是证据质量，不是每段客户关系本身的质量。
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU005
      - CU010
      - CU029
      - CU030
      - CU040
  - id: FU004
    title: GTM 与采购流程
    type: flow
    layout: wide
    summary: Glow 可能要走经典企业安全采购流程，经过多道关卡，持久收入才会显现。
    data:
      nodes:
        - id: demo
          label: 演示 / 一线获客
        - id: poc
          label: POC / 技术验证
        - id: legal
          label: 法务 / 隐私 / 采购评审
        - id: deploy
          label: 生产部署
        - id: expand
          label: 续约 / 扩张
      edges:
        - from: demo
          to: poc
          label: 安全关注
        - from: poc
          to: legal
          label: 技术验证通过
        - from: legal
          to: deploy
          label: 合同批准
        - from: deploy
          to: expand
          label: 证明价值
    approximationNotes: 该流程依据独立网络安全销售周期证据，以及 Glow 面向企业的条款和活动打法推断。
    claimRefs:
      - CU017
      - CU018
      - CU020
      - CU021
      - CU022
      - CU023
      - CU024
      - CU025
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: Glow 当前最重的风险，是不透明、治理负担和商业化压力叠加，而不是某个单一、致命的产品缺陷。
    data:
      columns:
        - 可能性
        - 影响
        - 缓释成熟度
        - 剩余严重度
      rows:
        - label: 监管 / 隐私证明缺口
          values:
            - 中-高
            - 高
            - 低-中
            - 高
        - label: 隐身状态不透明 / 证明缺口
          values:
            - 高
            - 高
            - 低
            - 高
        - label: 竞争压力
          values:
            - 高
            - 高
            - 中
            - 高
        - label: 独角兽融资后的执行
          values:
            - 中-高
            - 高
            - 中
            - 高
        - label: 创始人 / 人才集中度
          values:
            - 中
            - 中-高
            - 中
            - 中-高
    approximationNotes: 热力图单元格是基于经佐证的公开证据作出的分析判断，不是供应商发布的评分。
    claimRefs:
      - CR001
      - CR011
      - CR016
      - CR025
      - CR028
      - CR031
      - CR035
      - CR041
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 最重要的风险不是直接通过某个单一法律事件传导，而是经过客户转化、信任和估值传导。
    data:
      nodes:
        - id: opacity
          label: 不透明 / 证据缺失
        - id: trust
          label: 买方信任和合规评审
        - id: sales
          label: 销售周期长度和转化
        - id: expansion
          label: 续约 / 扩张质量
        - id: revenue
          label: 收入持久性
        - id: valuation
          label: 估值支撑
      edges:
        - from: opacity
          to: trust
          label: 抬高尽调负担
        - from: trust
          to: sales
          label: 拖慢采购
        - from: sales
          to: expansion
          label: 初始落地弱，会压低后续加购
        - from: expansion
          to: revenue
          label: 限制持久性
        - from: revenue
          to: valuation
          label: 压缩支撑
        - from: trust
          to: valuation
          label: 直接影响支付意愿
    approximationNotes: 传导路径依据公开证据和标准企业安全采购行为建模。
    claimRefs:
      - CR001
      - CR018
      - CR025
      - CR026
      - CR028
      - CR029
      - CR040
      - CR041
  - id: FR003
    title: 依赖图
    type: dag
    layout: wide
    summary: Glow 需要托管基础设施、客户集成、服务能力和隐私控制，商业故事才能跑通。
    data:
      nodes:
        - id: hosting
          label: 托管提供商
        - id: integrations
          label: 客户 / 第三方集成
        - id: services
          label: 支持与专业服务
        - id: privacy
          label: 隐私与治理控制
        - id: buyers
          label: 企业买方
        - id: growth
          label: 商业规模化
      edges:
        - from: hosting
          to: buyers
          label: 可用性基线
        - from: integrations
          to: buyers
          label: 工作流契合
        - from: services
          to: buyers
          label: 部署成功
        - from: privacy
          to: buyers
          label: 信任 / 批准
        - from: buyers
          to: growth
          label: 转化与扩张
        - from: services
          to: growth
          label: 利润率与速度
    approximationNotes: 具名供应商和精确集中度未公开，因此依赖项按类别层级展示。
    claimRefs:
      - CR010
      - CR019
      - CR020
      - CR021
      - CR022
      - CR029
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 建议左侧由战略质量驱动，右侧由缺失的估值输入驱动。
    data:
      nodes:
        - id: market
          label: 品类切口和战略质量
        - id: proof
          label: 创始人、客户和支持方
        - id: gaps
          label: 缺失的 ARR / NRR / 利润率 / 结构
        - id: price
          label: 价格纪律
        - id: call
          label: 继续研究 / 跟踪
      edges:
        - from: market
          to: proof
          label: 支撑兴趣
        - from: proof
          to: price
          label: 质量可支撑溢价
        - from: gaps
          to: price
          label: 但压低确信度
        - from: price
          to: call
          label: 接触，但不要盲目高价买入
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV024
      - CV033
      - CV039
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: Glow 的估值对隐藏运营指标和结构最敏感，不只是对 TAM 叙事敏感。
    data:
      items:
        - label: ARR / 增长质量
          value: 10
        - label: 留存 / 集中度
          value: 9
        - label: 轮次结构 / 稀释
          value: 8
        - label: 部署 / 利润率组合
          value: 8
        - label: 竞争胜率
          value: 7
        - label: 品类顺风
          value: 5
    claimRefs:
      - CV003
      - CV015
      - CV018
      - CV027
      - CV031
      - CV032
      - CV036
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 公开记录支撑的是宽区间，而不是单一公允价值。
    data:
      items:
        - label: 悲观估值区间
          low: 0.5
          high: 0.9
          unit: $B
          note: 商业化质量不及预期，或结构不利
        - label: 基准估值区间
          low: 1
          high: 2
          unit: $B
          note: 切口真实、牵引力真实，但持久性证据仍只有中等强度
        - label: 乐观估值区间
          low: 3
          high: 5
          unit: $B
          note: 需要异常强的隐藏 ARR、留存和部署质量
    claimRefs:
      - CV021
      - CV022
      - CV023
      - CV039
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: wide
    summary: Glow 在战略吸引力上得分较好，在公开估值精度上较弱。
    data:
      items:
        - label: 市场时机
          value: High
          sublabel: Endpoint + AI governance urgency
        - label: 牵引力证据
          value: Medium
          sublabel: Named references, but sparse cohorts
        - label: 经济性可见性
          value: Low
          sublabel: ARR / NRR / margin undisclosed
        - label: 估值信心
          value: Medium-Low
          sublabel: Wide band, current price evidence-sensitive
    claimRefs:
      - CV002
      - CV003
      - CV014
      - CV015
      - CV025
      - CV035
      - CV039
