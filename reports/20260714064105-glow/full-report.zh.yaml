        - 估值偏高 / 对证据敏感
        - 保持跟进，但没有强数据室就不要为账面价格背书
      - - 透明度改善后跟踪
        - 中
        - 高
        - 若 ARR、NRR 和利润率强劲，估值可能靠近合理
        - 如果公司开放指标和交易结构，快速重看
    notes: 建议把资产质量与估值精确度分开判断。
