      - number: '1.4'
        title: 里程碑、商标与剩余公开信息限制
        blocks:
          - type: paragraph
            body: >-
              Glow 的公开里程碑已经不止融资头条。公司似乎在 2025 年 2 月成立，数周内完成种子轮和 Series A，2025 年 7 月提交 GLOW 和 AUTONOMOUS FENCING 两项商标，2026
              年 2 月以据报独角兽融资亮相，2026 年 5 月发布更新后的法律和隐私材料，并围绕 Black Hat 2026
              开始事件驱动的公开市场推广活动。商标描述尤其有用，因为它比最初的隐身报道暴露出更具体的产品方向：白名单、执行控制、基于 AI 的分类、API 集成、风险评分和威胁阻断，都指向现代端点与软件治理平台，而不只是泛化
              APT 检测。

              同时，公开记录仍留下重大核验缺口。没有受审阅来源披露 ARR、收入年化规模、毛利率、净留存，甚至没有可靠员工数。Startup Nation Central 可见的 3 名员工数，与 Glow
              公开高管梯队、网站建设和 Black Hat
              存在感并不匹配，更适合视为过期或部分数据库输出，而不是权威运营指标。董事会构成也仍不透明；本文审阅的来源没有识别创始人与投资人之间的董事席位或治理权利。在独角兽轮语境下，这些遗漏并非小事，因为它们挡住了对执行质量、资本效率或控制权的任何严肃判断。

              还有两条负面或谨慎线索需要带入后续章节。第一，StartupWired 的怀疑框架在方向上公平：一家公司在广泛产品发布前达到独角兽估值，商业验证容错空间会被压缩。第二，American Bazaar 对
              Onavo 后期隐私争议的回顾并不直接牵连 Glow，但提醒投资人，Tiger 过去的胜利伴随过围绕数据实践的公共审视。因此，合适的概览判断既不是追捧，也不是否定：Glow
              明显具备顶级创始人—市场匹配和投资人支持，但公开资料仍像尽调前预告材料，而不是可直接核验的运营档案。
