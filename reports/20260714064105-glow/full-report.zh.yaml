      - number: '3.3'
        title: 能力、定价与锁定：Glow 能赢在哪里，又暴露在哪里
        blocks:
          - type: paragraph
            body: >-
              从能力看，赛场按不同强项清楚分层。Cyberhaven 最强在数据血缘、上下文阻断和以数据为中心的调查；Nudge 最强在轻代理发现、SaaS 与 AI 资产清单、塑造行为的治理；ThreatLocker
              最强在默认拒绝的硬执行控制；大型套件最强在广度、采购熟悉度和相邻控制平面集成。Glow 的机会在于，这些模型没有谁能用一个简单叙事完美合并端点原生执行、广泛软件可见性和 AI
              专属治理。风险在于，每个对手已经占住买方心智的一块。定价和包装会放大这个风险。Microsoft 可以把功能藏进或补贴进更宽的 M365 和安全套件。CrowdStrike 至少有一个可见在线入口 Falcon
              Go，面向最多 100 台设备；企业平台则靠扩展和模块采用变现。Cyberhaven、SentinelOne、Palo Alto 和 Glow 都更像询价式企业销售，ThreatLocker
              用价格引导漏斗，但最终仍落到销售对话，而不是公开标价。也就是说，切换成本和锁定更多来自部署，而不是标价。一旦买方已有端点代理、调查工作流、政策逻辑、身份集成和渠道承诺，即使技术上可以多供应商并行，运营上也很昂贵。因此，Glow
              必须证明自己的信号质量、AI 治理相关性或运营简洁性足够强，足以让买方新建一个控制平面，而不是向既有套件提功能需求。
