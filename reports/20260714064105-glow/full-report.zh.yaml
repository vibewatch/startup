      - number: '8.4'
        title: 退出逻辑可信，但投资准备度仍取决于缺失指标和轮次条款
        blocks:
          - type: paragraph
            body: >-
              如果隐藏指标强，Glow 的退出路径可信。战略上，更大的安全平台仍在围绕 AI、端点、云和数据控制主题买入或自建。财务上，成长型投资者仍愿意为早期看起来像品类领导者的公司融资。
              但退出可信度不等于投资准备度。投资者要问的不是未来是否可能有买家或赞助方，而是在已知稀释、优先权条款和运营质量之后，今天的进入价格是否还给风险调整后回报留下足够空间。


              尽调负担就集中在这里。投资者需要当前 ARR、净留存、集中度、毛利率结构、专业服务负载，以及 2026 年轮次的精确条款。如果这些数字异常强，
              今天看似偏高的价格仍可能变得公平或有吸引力。如果它们只是平均水平，同一个标题价格很快会显得昂贵。公开证据无法解决这个张力，只能框定正确问题。


              因此，正确结论是有条件的：Glow 可能重要到不能忽视，但仍太不透明，不能按表面材料直接背书。
