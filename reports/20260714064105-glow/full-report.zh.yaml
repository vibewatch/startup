      - number: '2.3'
        title: 企业安全团队中的买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              这个市场由安全领导层购买，但实际使用者是一组更宽的运营联盟。Microsoft Insider Risk Management 材料显示，部署会跨管理员、调查员、分析师、法务/合规利益方和审计日志审阅者；IBM
              的 AI 治理概览还把 CEO、CTO、法务和 CFO 纳入治理利益方，而不只是孤立终端用户。Zscaler 和 Palo Alto 对 DLP 与 DSPM 的描述也呈现类似跨职能动态：安全团队需要集中政策，但
              IT、数据所有者、平台团队和合规职能会影响部署，因为这些工具触及电子邮件、云存储库、SaaS、端点和敏感数据流。垂直需求也不均匀。端点安全、DLP、IRM 和 DSPM 来源反复强调
              BFSI、医疗、政府及其他受监管大型企业环境，这比商品化 SMB 端点市场更贴合 Glow
              自己可见的客户引用和高端定位。采用路径通常从可见性和资产清单开始，再进入政策调优、告警、调查工作流，最后扩展到更宽的自动化或治理。Microsoft
              明确显示，买方需要连接器、许可、分析扫描、权限和审计日志，政策才能规模化运行；这提醒我们，该品类的胜出不仅靠原始检测主张，也靠运营集成。Glow 最可能的最佳买方，是已经在吸收 AI
              蔓延、端点复杂性和合规压力的大型企业，而不是寻找最低价端点代理的团队。
