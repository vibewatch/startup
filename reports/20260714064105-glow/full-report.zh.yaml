  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品范围、模块图谱与 Glow 正在销售的客户任务
        blocks:
          - type: paragraph
            body: >-
              Glow 自己的语言现在让客户任务变得清楚。公司称自己为「端点 AI 公司」，并反复说它帮助安全团队控制端点上运行的一切。网站把这个承诺收窄为三个实际产品桶：安全采用
              AI、软件可见性与控制、资产清单管理。它们不是随机营销标签。合在一起，它们指向一个平台：从员工设备上的软件和工具发现起步，延伸到插件、包、MCP 服务器和 AI
              应用的治理，再加入政策或访问控制，让环境长期保持干净。条款也强化了这一点：产品作为企业 SaaS 销售，功能和订阅范围由订单定义，而不是单一盒装代理。因此，Glow 看起来不像传统 EDR
              替代品，更像一个以端点作为执行点的软件治理控制层。

              商标记录尤其有价值，因为它暴露了主页只暗示的功能。GLOW 和 AUTONOMOUS FENCING 申请描述了自适应白名单、风险评分、应用执行政策创建与执行、基于 AI
              的可执行文件分类、遥测报告、与第三方系统的 API 集成，以及对应用访问数据的控制。这些语言支持至少五个逻辑组件的模块图谱：端点发现与遥测、软件与 AI 资产清单、政策和执行控制、AI
              或规则辅助的分类与修复，以及输出到更宽企业安全栈的集成。公开网站上的客户语言也与这个解读一致。Antares 关注清理环境并理解实际运行的内容，Xactly 强调 AI
              治理和更宽软件治理之间的连接，匿名工程引用强调自主修复。这些信号合在一起说明，平台意在先减少软件蔓延，再把控制动作自动化。

              Glow 的公开产品组合界面仍处早期，但已经不再空白。博客中心有产品、客户故事、Glow Labs 和行业洞察分类，活动页面围绕 Black Hat 2026 保持活跃。这说明公司正在围绕端点 AI
              控制构建品类叙事，而不是把产品完全藏起来。即便如此，公开定价页、公开包装表、公开开放的技术文档都还没有。投资人应把 Glow
              读作一家拥有连贯产品论点和初步模块结构的公司，但外部可见的产品文档仍更接近发布期营销，而不是成熟平台手册。
