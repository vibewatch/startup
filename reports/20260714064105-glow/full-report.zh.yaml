      - number: '2.2'
        title: 规模测算视角：今天是端点核心，下一步是数据和 AI 治理相邻市场
        blocks:
          - type: paragraph
            body: >-
              衡量 Glow 当前商业机会，最站得住脚的口径是受约束的端点安全核心，而不是包罗万象的网络安全 TAM。The Business Research Company 估计端点保护平台市场 2026 年为
              $6.31B，2030 年达 $9.34B；Fortune Business Insights 则把更宽的端点安全市场放在 2026 年 $17.79B、2034 年 $34.40B。这些数字大致框住 Glow
              销售端点控制和软件治理能力时想撬动的预算上限。相邻品类也足够大。The Business Research Company 估算 DLP 2026 年为 $4.67B、2030 年为
              $12.53B；ResearchAndMarkets 估算内部人风险管理 2024 年为 $2.4B、2030 年为 $3.7B。DSPM 更不稳定：Palo Alto 的市场指南显示，2025 年估计值从约
              $415M 到 $2B 不等，因为分析师对只计独立 DSPM 还是计入更宽平台模块意见不一；另外两家出版方分别把该品类放在 2024 年 $1.42B 和 2023 年 $1.8B。AI
              治理的绝对美元规模小得多，但在本组来源中增长最快，TBRC 预计它将从 2026 年 $0.61B 增至 2030 年 $2.63B。实际含义是，Glow
              进入的是一个拥有多个活跃预算池的市场集群，但公开数据尚不足以给「端点 AI 控制」切出干净的独立 SAM 或 SOM。
