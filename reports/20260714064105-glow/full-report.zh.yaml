  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、隐私和信任风险是最紧迫的尽调组合
        blocks:
          - type: paragraph
            body: >-
              Glow 所在的控制品类，同时贴近员工监控、软件治理和 AI 治理，这个位置天然别扭。这种组合带来真实的监管和信任复杂性。EU AI Act 正通过 AI
              Office、各国主管机关，以及越来越多的二级文件和指南落地。NIST 正积极修订 AI 风险框架，并已发布面向关键基础设施 AI 风险管理的 2026 年概念说明。SEC
              的网络安全披露规则也提高了董事会和管理层对治理与事件准备的预期。即便这些规则不直接适用于作为私营公司的 Glow， 它们也会塑造企业买方对处理安全敏感工作流的供应商的期待。


              端点和内部风险工作流还会抬高隐私问题。ICO 的员工监控指南讲得很清楚：组织必须谨慎证明、限制并治理监控做法。Microsoft 的 Insider Risk Management
              隐私文档展示了这个品类里成熟供应商该怎么站位：假名化、基于角色的访问控制、审计日志，以及敏感指标的明确选择加入。 Glow 的公开隐私政策和条款显示，公司已经想过数据收集、托管、AI
              工具、服务提供商、监管机构和跨境传输。但同一套公开材料没有披露公开信任中心、 第三方认证、状态页、事故档案，或达到 Microsoft
              深度的隐私内建控制。文档入口被门禁挡住，外部无法检查产品在实际中如何处理敏感工作流。


              这并不证明不合规。它意味着举证责任转入尽调。对于一家承诺自主修复、应用控制和端点级治理的公司，买方合理地会追问策略动作如何界定范围、记录日志、 接受审查并回滚。在 Glow
              拿出这套证据之前，监管和信任风险应被视为实质风险，而不是假设风险。
