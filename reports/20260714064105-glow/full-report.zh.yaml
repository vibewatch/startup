  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户细分、买方角色，以及 Glow 明确在卖给谁
        blocks:
          - type: paragraph
            body: >-
              Glow 的客户证明数量不多，但买方质量异常清晰。当前首页点名 Antares Capital、Xactly 和 BMC Software，所有被引用发言者都是资深安全或 IT 决策者，不是基层从业者。Kyle
              Weckman 的身份是 Antares Capital CISO，Matthew Sharp 是 Xactly CISO，Scott Crowder 是 BMC Software SVP 兼
              CIO。这一点重要，因为它说明 Glow 不是只和小型技术团队或匿名设计伙伴测试；它正在进入那些端点治理、软件蔓延和 AI 控制问题已经摆上高管桌面的组织。背书组合也覆盖了有意义的垂直行业。Antares
              代表金融服务和信贷，Xactly 代表企业 SaaS 和收入软件，BMC 代表大规模基础设施和企业软件运营。因此，具名证明支持当前最合理的细分判断：Glow
              面向受监管或软件密集环境里的大型企业和偏高端的中型企业买方。


              引言暗示的客户任务也一致。Antares 强调把环境清理干净、降低风险，并弄清企业内部到底在运行什么。Xactly 强调 AI 治理和更广泛软件治理问题之间的联系。BMC 的引言把 Glow
              定位成端点控制点，能帮助组织以 AI 速度行动。这些背书合在一起说明，Glow 卖给的是安全和 IT
              领导者，他们需要把发现、治理和修复放在一套动作里，而不是只买一个狭窄的清单工具。关于自主修复的匿名安全工程引言，也从操作者视角强化了同一点， 尽管证据强度弱于具名背书。


              公开材料尚未证明的内容同样重要。公司没有披露客户数、席位数、除少数具名背书之外的客户标识数、地区结构、ACV 区间或生产环境足迹。
              也没有公开证据能区分付费生产部署、试点、POC，或被引用的设计伙伴关系。因此，投资者应把客户表面信号读作真实的早期企业相关性证明， 而不是持久采用数据集。
