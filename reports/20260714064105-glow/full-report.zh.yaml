              - CI033
      - number: '4.2'
        title: 单位经济与成本结构：设计上偏软件，但仍主要靠推断
        blocks:
          - type: paragraph
            body: >-
              理解 Glow 经济模型的最佳方法，是看公开可比公司和软件基准，而不是任何已披露的公司 KPI。产品看起来由软件主导：Glow 条款描述远程 SaaS
              访问，且没有受审阅来源指向硬件库存、制造暴露或实体部署成本。如果交付负担主要停留在软件、云基础设施、客户成功和安全研究上，该商业模式有机会拥有较强毛利率。公开可比公司支持这个大方向。CrowdStrike
              2026 财年退出时非 GAAP 订阅毛利率为 81%，SentinelOne 报告非 GAAP 毛利率为 79%，MainFoundry 2026 年基准笔记称顶级 SaaS 企业仍位于 70% 高段到 80%
              中段毛利率区间。SaaSDB 的上市公司基准显示，172 家上市 SaaS 公司的中位毛利率为 74.6%，给健康软件公司一个更低锚点。这些数字不能证明 Glow
              已经达到类似水平，但它们框定了市场对软件优先安全供应商的预期区间。成本结构才是不确定性叠加的地方。端点控制和 AI
              治理仍可能需要在检测工程、政策支持、客户上线、集成，以及推理或分析算力上投入大量资金。也就是说，Glow 最终可能更像一个高毛利安全平台，而不是纯轻量 SaaS
              工作流工具；但公开资料仍缺少把毛利潜力与真实毛利兑现区分开的输入。
