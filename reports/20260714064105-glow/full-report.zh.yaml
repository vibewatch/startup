  - id: TV002
    title: 投资论点 / 反论点表
    columns:
      - 论点
      - 方向
      - 什么会改变判断
    rows:
      - - 顶级背书、可信创始人和踩准时点的端点 AI 切口支撑战略兴趣
        - 论点
        - 客户深度弱或部署质量差会削弱这一判断
      - - 在 2026 年私募 AI / 安全市场，$1B+ 估值有可能成立
        - 论点
        - 隐藏指标低于高溢价增长门槛会削弱这一判断
      - - 公开证据缺少 ARR、NRR、利润率、集中度和轮次结构清晰度
        - 反论点
        - 强数据室会大幅提升信心
      - - 大平台和邻近创业公司的打包压力可能压缩上行空间
        - 反论点
        - 清晰胜率和有粘性的扩张会降低担忧
      - - 占位网页资产和需授权文档压低公开估值信心
        - 反论点
        - 更完整的证明材料包会收窄折价
    notes: 反论点主要是价格和证据风险，而不是否定市场。
