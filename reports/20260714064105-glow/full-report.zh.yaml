  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：Glow 究竟在卖哪类问题
        blocks:
          - type: paragraph
            body: >-
              不应把 Glow 在市场图谱中只放进另一个端点杀毒或 EDR 初创公司的格子。它当前主页和条款描述的是一个企业软件平台，用来控制端点上运行的内容、呈现软件和 AI 工具使用，并帮助组织安全采用 AI。这把
              Glow 推进一个融合控制层：端点执行、内部人风险监控、数据防泄漏和 AI 治理工作流正在越来越多地重叠。CISA 的内部威胁框架和 Microsoft Insider Risk Management
              产品文档尤其适合界定边界，因为它们显示企业问题早已不只是防恶意软件；问题还包括授权用户滥用访问、无意数据泄漏、有风险的浏览器或 AI 行为，以及调查政策违规的治理流程。Palo Alto 的 DSPM
              材料又补上相邻的数据优先视角，强调跨混合环境的发现、分类、访问监控和政策执行。因此，Glow 的合理市场边界是分层的：设备边缘的核心端点软件可见性和控制，外围的数据与内部人风险治理，以及增长最快的相邻 AI
              治理支出。应排除在边界之外的是泛化网络安全、防火墙支出、传统 SIEM 日志存储，或无差异化 SMB 杀毒。
