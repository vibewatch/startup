      - number: '1.3'
        title: 融资形成、投资人阵容与首批公开客户信号
        blocks:
          - type: paragraph
            body: >-
              Glow 的融资弧线，是它进入本报告名单最清楚的理由。Calcalist 2025 年 3 月报道称，公司刚完成 $20M 种子轮，同时正由 Greenoaks 领投、以 $400M 估值融资 $55M。到
              2026 年 2 月，Calcalist 报道称 Glow 已从 Sequoia、Index Ventures、Cyberstarts 和 Greenoaks 获得约 $80M，随后正以 $1B 以上估值融资超过
              $100M。Startup Nation Central 的公开档案把这些数据点串成三级阶梯——2025 年 2 月 $20M 种子轮、2025 年 3 月 $55M Series A、2026 年 2 月
              $100M Series B——并列出累计融资 $175M。即使准确的法律交割机制仍未公开，现有证据已足以把 Glow 归为新晋网络安全独角兽，且资本形成速度异常快。

              投资人质量和现金规模一样重要。Sequoia、Index Ventures、Cyberstarts 和 Greenoaks 都是以色列企业安全领域可信的资方，Calcalist 还明确指出其中许多投资人也投了
              Wiz。重叠不证明 Glow 会复制 Wiz 轨迹，但它说明成熟网络安全投资人愿意在很短时间内两次支持
              Tiger，并继续把公司推入独角兽估值轮。公开资料未披露老股转让、债务、清算优先权或董事席位，因此资本故事在头部信号上很强，在结构细节上很弱。

              客户证据仍处早期，但不再缺席。Glow 的 v05 主页现在发布了 Antares Capital 的 Kyle Weckman、Xactly 的 Matthew Sharp、BMC Software 的
              Scott Crowder 的引用。它们还不能等同于可量化客户基础，但说明 Glow 愿意把产品与可识别的企业技术领导者绑定。再叠加公司计划参加 Black Hat 2026 展位和发布派对，证据显示 Glow
              正把 2026 年融资不仅用于产品建设，也用于提升品类市场能见度。这与 2026 年初报道中的纯隐身姿态相比，是有意义的变化。
