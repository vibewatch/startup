chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品框架与法律实体图景
        blocks:
          - type: paragraph
            body: >-
              从 2026 年 2 月融资报道到 2026 年 7 月研究日，Glow 的公开身份已经明显变化。Calcalist 和 Startup Nation Central 仍把公司描述为隐身或研发阶段，但 Glow
              现在运营品牌网站 glow.io，并有信息更丰富的 v05 主页，明确称自己为「端点 AI 公司」。当前公开话术有两层：根站点仍使用更宽泛的「面向现代工作空间的 AI 驱动安全」，更深层的营销页面则称 Glow
              帮助安全团队控制端点上运行的一切，并理解软件、插件、MCP 和 AI 工具。意义在于，后续章节不应再把 Glow 当作泛化的隐身网络安全公司；公开记录已经把它框定为一个以端点为中心的平台，服务 AI
              治理、软件可见性和资产控制。

              法律实体图景也比用户简报暗示的更清楚，尽管仍不完全干净。Glow 的隐私政策把控制方列为 Glow Security Ltd，指向以色列运营实体；公开主服务协议则以 Glow Security, Inc.
              名义签署。GLOW 和 AUTONOMOUS FENCING 的商标页面同样把 Glow Security, Inc. 列为申请所有人。Startup Nation Central 还给出以色列注册号
              517114773，并把公司地点放在 Tel Aviv-Yafo。因此，最稳妥的概览表述是：这是一家以色列创立、根在 Tel Aviv 的网络安全公司，并用美国签约实体承接商业销售，而不是单一司法辖区的初创公司。

              商业模式披露仍很薄，但方向有用。Glow 的条款明显按企业 SaaS
              供应商来写：订阅以订单形式销售，用美元开票，可直接购买，也可经授权经销商和渠道伙伴购买。公司已经在站点地图中呈现活动、博客、支持、隐私和新闻页面，公开文档入口存在但仍需权限。合在一起看，Glow
              已不只是靠创始人履历融资；它正在搭建真实企业软件供应商需要的外部运营界面，只是更深的技术和财务细节仍未公开。
