      - number: '4.3'
        title: 公开牵引缺口，相对于资本充足度和后续融资需求
        blocks:
          - type: paragraph
            body: >-
              资本形成是最清楚的公开财务强项。Startup Nation Central 显示三级融资阶梯合计 $175M；Calcalist 两篇报道锚定种子轮、以 $400M 估值完成的 $55M Series
              A，以及后续据报超过 $100M 的独角兽轮。这样的资本量足以说明，Glow
              不像更早期种子公司那样面临即时融资稀缺。但它不足以计算现金续航。没有受审阅公开来源披露现金余额、月度烧钱速度、招聘速度、销售效率或下一轮触发条件。运营牵引数据的缺席同样严重：ARR、收入年化规模、净收入留存、毛利率、客户
              logo 数量、扩张行为或客户集中度都未公开。竞争语境在这里两面作用。Cyberhaven 和 Nudge 显示，当增长可信时，投资人仍愿意为强安全叙事提供资金；但 Cybereason
              的估值崩塌也显示，一旦端点安全里的执行走弱，市场信心会很快蒸发。实际财务判断是，Glow 近期很可能有足够资产负债表支持去资助商业化和产品扩展，但外部人仍无法判断公司是在高效扩张，还是只是在昂贵扩张。
