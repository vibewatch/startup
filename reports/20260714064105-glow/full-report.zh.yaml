  - id: TV005
    title: 论点破裂与否决触发项表
    columns:
      - 触发项
      - 阈值
      - 对投资论点的传导
      - 行动含义
    rows:
      - - 相对当前估值，隐藏 ARR 偏低
        - 数据室显示 ARR 太低，撑不起高溢价基准逻辑
        - 估值支撑立即压缩
        - 重新定价或放弃
      - - 留存 / 集中度不及预期
        - NRR、流失率或头部客户敞口弱于预期
        - 增长质量论点走弱
        - 下调情景区间并要求保护条款
      - - 部署被证明服务占比重
        - 实施强度扩张快于产品杠杆
        - 利润率和可扩展性假设破裂
        - 向悲观情景靠拢
      - - 信任材料包仍然单薄
        - 没有可信的控制 / 认证 / 治理材料包
        - 采购摩擦上升，退出信心下降
        - 暂停或大幅下调
      - - 竞争输单加速
        - 买方偏好套件或相邻 AI 治理工具
        - 增长和退出上限被压缩
        - 下调乐观情景概率
      - - 轮次结构对投资者不友好
        - 清算优先权堆栈或稀释压力比暗示更糟
        - 普通股上行空间收缩
        - 要求结构性保护，或回避
    notes: 这些触发项把叙事不确定性转成可监测的投资判断测试。
    claimRefs:
      - CV027
      - CV028
      - CV031
      - CV032
      - CV033
      - CV036
      - CV040
  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人 / 尽调路径
    rows:
      - - ARR 和增长质量
        - 当前 ARR、订单到收入桥接、收入组合和增长节奏
        - 所有估值倍数比较的核心输入
        - 财务团队 / 数据室
      - - 留存和集中度
        - NRR、GRR、流失率和前 10 大客户敞口
        - 区分漂亮客户名单和可持续经济性
        - 财务 + RevOps / 数据室
      - - 利润率和服务负担
        - 软件、支持和服务的毛利率拆分
        - 决定 Glow 是否配得上软件式估值
        - 财务 + 客户成功
      - - 轮次结构
        - 一级 / 二级出售、优先权、治理权和稀释条款
        - 决定账面价格下投资者的真实结果
        - 法务 + 财务 / 交易文件
      - - 部署现实
        - 实施周期、回滚负担、模块附加和支持负载
        - 测试可扩展性和扩张假设
        - 现场尽调 + 推荐客户访谈
      - - 竞争证明
        - 近期相对套件和 AI 治理相邻厂商的赢输记录
        - 测试切口能否转成持久护城河
        - 销售运营 + 客户推荐
    notes: 这些要求是从兴趣进入投资判断的最低门槛。
    claimRefs:
