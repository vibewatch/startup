  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 公开资料中可见的收入模型与变现结构
        blocks:
          - type: paragraph
            body: >-
              Glow
              最强的公开财务事实不是数字，而是机制。服务条款清楚描述了一种安全软件即服务订阅：以订单形式销售，用美元开票，预付，并可直接交易或经经销商及其他授权渠道伙伴交易。这与硬件重、广告支持或消费级用量模型有实质差异。网站还发布了来自大型企业客户名称的引用，进一步证明
              Glow 追求的是经典企业 B2B
              销售，而不是自助式大众市场变现。公开记录没有揭示的是，公司在实践中如何给这个模型定价：没有审阅到公开标价、没有按端点或按席位的费率表、没有公开合同期限，也没有说明定价基于端点、员工、模块、数据量还是混合口径。竞争者证据解释了为什么这很重要。Microsoft
              可以把端点和治理功能埋进更宽的企业套件；CrowdStrike 暴露了至少一个小企业入口，同时靠更深的平台扩展变现；Cyberhaven、SentinelOne、Palo Alto 和 ThreatLocker
              这类询价式平台都把定价讨论转向企业价值，而不是透明表价。因此，Glow 很可能销售高 ACV、协商型软件合同，但实际变现质量仍不透明。
