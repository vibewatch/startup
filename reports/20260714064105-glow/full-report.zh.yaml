      - number: '5.2'
        title: 架构、部署模型、集成与运营工作流
        blocks:
          - type: paragraph
            body: >-
              尽管工程蓝图并未公开，Glow 的条款和文档界面已经暴露出足够运营细节，可以勾勒架构。产品以远程访问的安全 SaaS
              交付，但协议也预设安装在客户现场的服务组件，因为更新和升级可能远程维护这些组件。这种混合语言很重要。它暗示 Glow 不只是浏览器仪表盘或被动 SaaS
              控制台；部分执行或遥测元素很可能靠近端点，管理和分析则在云端。网站暗示的运营工作流很直接：盘点正在运行的内容，分类重要内容，创建或调优政策，接入相邻系统，然后支持持续修复和监控。文档门户确认存在面向开发者的接口，但被访问码门槛限制，也就是说
              API 入口的存在是公开的，细节不是。

              部署故事比文档完整度更可信。条款提到账户设置、用户账户、接入客户或第三方系统、SLA
              下的支持与维护、可选专业服务用于安装、部署、配置、定制、集成和培训，以及可通过直销或渠道购买。这是一个面向生产使用的企业平台所使用的运营词汇，不是轻量自助工具。支持页显示活跃的支持邮箱和询问流程，隐私政策提到客户联系和账单信息、展位、网络研讨会，以及与现有和潜在客户的互动。公开活动页面也强化了
              Glow 正在主动推进演示和现场接触。所有这些都说明，Glow 预期部署需要安全、IT，可能还有采购利益方协同，这与问题品类匹配。

              竞争者文档凸显了 Glow 实际必须匹配的能力。Microsoft Defender for Endpoint 现在呈现出成熟企业栈：把端点信号输入统一门户，开放 API 做工作流集成，并覆盖
              Windows、macOS、Linux、Android 和 iOS。Palo Alto 的 Cortex XDR 同样营销一个跨端点、网络、云、身份和电子邮件来源的单平台工作流。Nudge Security 的
              Workforce Edge 材料展示了另一种架构，避免重代理，转而靠身份和 API 中心技术发现 SaaS 与 AI 使用。Glow 的独特主张不同于两者。它似乎以端点作为主要控制点，同时仍延伸到软件、插件和
              AI 供应链。尽调挑战在于，Glow 没有发布足够实现细节，无法显示工作流中多少是端点代理，多少是云分析，多少依赖客户侧集成。
