      - number: '1.2'
        title: 创始人、管理层梯队与关键人风险
        blocks:
          - type: paragraph
            body: >-
              公开记录支持一个技术底色很强的创始团队。Startup Nation Central 将 Roi Tiger、Omer Singer 和 Ophir Arie 列为创始人，Glow
              自己的关于页面也显示三人仍在担任高管：Tiger 任 CEO，Singer 任 CTO，Arie 任研发副总裁。Calcalist 2025 年 3 月报道还称 Pini Pinhasov 参与了最初组建，但
              Calcalist 2026 年 2 月后续报道说他后来离开公司。这个顺序对尽调重要：Glow 起步时的创始班底比当前官网展示的更宽，且至少一名创立期运营者在独角兽轮被公开报道前已经离开。

              对一家这么年轻的公司，创始人—市场匹配异常强。Calcalist 称 Tiger 联合创立 Onavo，后来在 Meta 负责商业工程，并于 2022 年离职；TechCrunch 2013 年收购报道独立确认了
              Tiger 的 Onavo CTO 身份，以及把公司出售给 Facebook 所带来的重大结果。Singer 的背景也高度贴合 Glow 的产品方向：SecurityInformed 称他曾任 Snowflake
              网络安全战略负责人，他的个人网站说他在 Snowflake 推动现代安全数据湖。Arie 和 Pinhasov 都来自 Medigate，Medigate 出售给 Claroty
              又给这个创始群体增添了一项以色列网络安全退出履历。这样的创始人—市场匹配，足以解释为什么公司在广泛披露产品前就能获得早期资本速度。

              Glow 也开始在公开层面补强非创始人团队。关于页面新增 Arnon Joseph 任首席产品官、Emily Heath 任首席战略官、Patti Degnan 任首席信任与安全官。Heath 曾任
              Cyberstarts 普通合伙人，也曾担任 United Airlines 和 DocuSign 的 CISO，说明 Glow
              招募的不只是工程深度，还有能进入董事会语境、理解企业安全商业化的运营者。反面是关键人依赖集中：Tiger 仍是融资身份锚点，Singer
              看起来是最公开的技术创始人，且公司仍未披露公开董事会名单，外部投资人无法判断治理平衡。
