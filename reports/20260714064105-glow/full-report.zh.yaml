      - number: '6.4'
        title: 客户结论：早期证明真实，公开持久性证据薄弱
        blocks:
          - type: paragraph
            body: >-
              Glow 的客户章节强于纯隐身期故事，但弱于成熟成长型公司的客户材料。公司有真实具名背书，这些背书足够新，值得重视；背书组合覆盖了安全投资者想看到的成熟买方： 受监管金融、企业软件和大型 IT
              运营。这是有意义的正面信号，因为许多隐身期或刚浮出水面的安全公司仍只依赖匿名引言或投资人叙事。


              局限在于，初步证明之后几乎所有核心投资判断问题，在公开层面都没有答案。已审阅来源没有说明 Glow 有多少客户、哪些具名背书是付费生产客户、部署范围多大、
              是否有人续约、先落地再扩张跑多快，或业务账本可能有多集中。因此，公开材料支持 Glow 已赢得高质量对话、且可能已有一些真实部署的判断； 但不支持它已经具备广泛商业规模或持久客群表现的判断。


              对投资者来说，下一步不是否定客户故事，而是追问它。最低限度的尽调材料包应包括按细分划分的客户数、每个具名背书的付费生产状态、头部账户的 ACV
              和期限、续约数据、部署时间线、客户标识到销售管线的转化，以及任何渠道来源业务的证据。如果这些数据强，Glow 小而公开的背书组合可能只是更深企业客户基础露出的边缘。
              如果数据弱，当前客户故事就更像精心筛选的信号，而不是持久牵引力。
