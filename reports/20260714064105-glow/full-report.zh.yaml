      - number: '8.2'
        title: 可比背景说明 $1B+ 估值标记为何可信，也说明公开支撑仍然很薄
        blocks:
          - type: paragraph
            body: >-
              估 Glow 最容易犯的错，是只挑最高倍数的可比公司。公开市场安全龙头规模巨大、真实且亮眼：CrowdStrike 在 2026 财年末达到 $5.25 billion ARR 和 $4.81 billion
              收入，SentinelOne 达到 $1.12 billion ARR 和略高于 $1.0 billion 的收入，Palo Alto 实现 $9.2 billion 收入，并有 $15.8 billion
              剩余履约义务。它们 2026 年 7 月的公开股权价值也相应很大。但这些公司不只是更大版的 Glow。 它们是已规模化的企业，产品套件广、续约历史已建立，证明材料包也密得多。


              基准来源把取舍讲得更清楚。SaaSDB 的 2026 年公开 SaaS 报告显示，安全公司 EV/revenue 中位数倍数为 5.8x；BVP 的 Cloud 100 基准称，平均公开 BVP Cloud
              Index 公司约按 8x ARR 交易，未上市 AI 公司平均约拿到 24x。Cyberhaven 的 $1 billion 估值和 Nudge Security 的强增长说明，私人投资者愿意为 AI
              原生安全故事付钱。但只有当被估公司能展示相应增长或品类主导力时，这些基准才有用。 Glow 还没有在公开层面做到这一点。


              换句话说，在 2026 年私人 AI / 安全市场里，$1B 标题估值是可信的；但公开记录还没有说明 Glow 实际属于哪个倍数家族。它可能应拿到类似公开安全公司的折价， 也可能应拿到高溢价未上市 AI
              倍数，或介于两者之间。没有 ARR 和留存，只靠公开证据无法判断。
