  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局形态：直接融合型初创公司、套件型既有厂商与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Glow 的竞争集合比「端点」一词暗示的更宽。它的公开产品语言站在端点控制、AI 治理、软件可见性和数据风险降低的交汇处，因此买方至少可以用三类方式解决同一项工作。第一类是直接融合型初创公司。Cyberhaven
              是最强样本，因为它明确把 DSPM、DLP、内部人风险管理和 AI 安全合进一个平台，并把数据检测与响应路径定位为传统 DLP 和内部威胁工具的替代品。Nudge Security
              是另一个有意义的相邻同业：它不以端点执行为主叙事，但从劳动力边缘切入同一个安全采用 AI 的问题，发现 AI 与 SaaS 使用、OAuth
              授权和有风险集成，而且不依赖传统端点代理或代理服务器。第二类是既有平台套件。CrowdStrike、SentinelOne、Microsoft 和 Palo Alto Networks
              都早已从端点检测扩展到身份、云、DLP、SIEM 和 AI 响应等相邻控制平面。第三类是现状替代方案和更窄工具，包括 ThreatLocker 这类白名单或执行控制产品、传统 DLP、人工 AI
              治理审查，以及基于端点和身份遥测的内部自建。Glow 因此不只是要在一个功能矩阵里争第一；它还要争夺定义品类的权利，让买方相信自己买的首先就是这个类别。
