      - number: '3.2'
        title: 竞争者画像：谁最能对位 Glow，以及原因
        blocks:
          - type: paragraph
            body: >-
              Cyberhaven 是最相关的初创公司基准，因为它比 Glow 今天更明确地讲同一个融合故事。官方材料称它统一 DSPM、DLP、IRM 和 AI 安全；2025 年 4 月融资公告显示，投资人愿意在公司完成
              $100M Series D、累计融资达到 $250M 后，把这一论点定价到 $1B 估值。Nudge Security 规模更小，但战略意义重要。它 2025 年 Series A 公告称，围绕
              Workforce Edge 的 SaaS 与 AI 使用发现、治理和用户提醒，公司已有近 200 个客户，并连续两年实现 3 倍 ARR 增长。这给同一个影子 AI
              和影子应用问题提供了更轻、更快部署的答案，尽管原生端点执行色彩较弱。既有厂商基准集合很强。CrowdStrike 在 2026 财年末 ARR 达到 $5.25B，并开始把自己框定为 AI
              关键任务基础设施；SentinelOne 收入突破 $1B，并称客户正在把 Singularity 标准化为统一平台；Palo Alto Networks 2025 财年收入达到
              $9.2B，拥有强大的渠道网络，并把 XDR 延伸到 DLP 和云安全运营；Microsoft 则能借 Defender、Purview、Intune、Entra 和 M365
              打包推送类似功能。面对这组对手，Glow 最好的机会不是在打包能力上压过巨头，而是在端点控制层比巨型套件和数据治理优先的初创公司都更精准、更容易落地。
