      - - Omer Singer / Ophir Arie 技术领导连续性
        - 核心产品可信度压在少数资深技术负责人身上
        - 中
        - 高
        - 关于页面显示当前领导层保持连续
        - 要求提供留任方案和领导层冗余安排
      - - Pini Pinhasov 离职
        - 原始创始团队在 Series B 前发生变化
        - 中
        - 中高
        - 可能并无负面，但公开原因不清楚
        - 要求说明离职时间、角色影响和股权结构影响
      - - 招聘 / 扩张挑战
        - 需要比典型隐身创业公司更快把资本转成执行力
        - 中高
        - 高
        - Glow 正在积极招聘并打造团队品牌
        - 要求对照路线图和客户支持需求提供招聘计划
      - - Onavo 历史带来的声誉外溢
        - 隐私敏感型买家可能更严格审视创始人背景
        - 中低
        - 中
        - 风险来自叙事，并非 Glow 不当行为证据
        - 在推荐客户访谈中测试买方异议和信任担忧
    notes: 公开公司叙事仍以创始人为中心，因此人员风险被抬高。
    claimRefs:
      - CR004
      - CR005
      - CR006
      - CR030
      - CR031
      - CR032
      - CR033
  - id: TR005
    title: 缓释措施与否决标准表
    columns:
      - 风险
      - 可监测触发项
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 信任 / 合规缺口
        - 尽调要求提出后仍拿不到保证材料包
        - 没有可信的隐私 / 控制材料包或面向客户的文档
        - 重新定价或暂停投资
      - - 生产环境证明薄弱
        - 具名客户仍停留在试点或窄范围评估
        - 缺少持续付费生产环境或扩张证据
        - 大幅下调信心
      - - 竞争滑坡
        - 面对套件或相邻 AI 治理厂商，赢输格局恶化
        - 在文档、部署速度或产品广度上反复输单
        - 下调增长和估值假设
      - - 服务重的扩张模式
        - 专业服务负担上升快于软件杠杆
        - 为促成交易，部署需要反复定制
        - 将业务重新定性为可扩展性较弱
      - - 治理事件
        - 出现严重隐私、监控或客户信任问题
        - 买方重大升级、法律问题或控制失效
        - 暂停尽调并重估投资论点
      - - 资本转化失败
        - 大额融资后，ARR 或客户深度没有清晰进展
        - 执行里程碑落后于融资叙事
        - 将估值视为偏高，而非战略性定价
    notes: 否决标准设计成尽调中可度量的信号，而非理念判断。
    claimRefs:
      - CR028
      - CR029
      - CR035
      - CR037
      - CR040
      - CR042
  - id: TV001
    title: 建议摘要表
    columns:
