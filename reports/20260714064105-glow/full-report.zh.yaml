      - number: '2.4'
        title: 增长驱动、采用约束，以及市场仍最需要回答的问题
        blocks:
          - type: paragraph
            body: >-
              多重需求加速器正在支撑 Glow 的品类切入点。IBM 2025 年数据泄露研究把未治理 AI 和弱访问控制与更高事故成本联系起来；CrowdStrike 称 AI 平台和开发者工具正在遭受主动攻击；Palo
              Alto 以及 DSPM 市场报告都把云数据蔓延与可见性、自动化执行需求上升连接起来。SEC 2023
              年网络治理规则又给大型公司增加一层紧迫感，让网络风险流程和董事会监督成为更明确的披露主题。这些力量共同支撑一个判断：买方想要能跨端点活动、数据流动和 AI
              使用的控制，而不是孤立点产品。约束同样重要。Microsoft 隐私指南显示，内部人风险监控需要明确选择加入和谨慎的角色设计，员工信任和隐私反对是真实问题，不是理论问题。Microsoft
              设置文档、DataHorizzon 的限制讨论、Zscaler 对传统 DLP
              的批评都指向同一个运营刹车：配置、连接器、误报和多云复杂性会拖慢采用，即使需求很明显。竞争压力也是刹车，因为大型既有厂商能把内部人风险、DLP、DSPM
              或端点能力打包进更宽套件。最深的剩余公开信息缺口，不在市场是否足够大，而在 Glow 的真实收入切入点位于哪里，买方如何为平台编预算，以及独立初创公司而非平台厂商现实中能拿下多少品类支出。
