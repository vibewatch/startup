  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 参考意义
      - 局限
    rows:
      - - Glow 2026 年 2 月融资轮
        - 私募估值
        - '>$1B 账面估值'
        - 当前最好的公司专属锚点
        - ARR、结构或清算优先权细节均未公开
      - - Glow 2025 年融资轮
        - 私募估值
        - ~$400M 估值
        - 显示 2026 年前估值快速上调
        - 产品成型前、独角兽前阶段
      - - Cyberhaven 2025 年 4 月
        - 私募估值
        - $100M Series D 后估值 ~$1B
        - 有用的相邻私募 AI / 数据安全可比对象
        - 产品、牵引和成熟度不同
      - - CrowdStrike FY26 / 2026 年 7 月
        - 上市可比
        - 5.25B ARR；$191.34B 市值；2026 年末 P/S 23.1x
        - 展示规模化端点龙头可获得的溢价
        - 规模远大于 Glow，验证程度也高得多
      - - SentinelOne FY26 / 2026 年 7 月
        - 上市可比
        - 1.12B ARR；$6.33B 市值；2026 年末 P/S 4.75x
        - 有用的低倍数端点基准
        - 仍大得多，且为上市公司
      - - Palo Alto FY25 / 2026 年 7 月
        - 上市可比
        - 9.2B 收入；$269.19B 市值；2026 年末 P/S 12.5x
        - 展示平台级安全公司的溢价背景
        - 规模和产品广度都无法与 Glow 直接相比
      - - Fortinet 2026 年 7 月
        - 上市可比
        - $117.67B 市值；2025 年末 P/S 8.78x
        - 额外的上市安全板块情绪锚点
        - 品类和成熟度不匹配
      - - SaaSDB / BVP 2026 基准
        - 市场基准
        - 安全中位数 ~5.8x EV/Rev；上市 BVP Cloud Index ~8x ARR；私募 AI ~24x
        - 框定私募投资者可能采用的估值区间
        - 各类基准无法识别 Glow 的真实匹配位置
    notes: 可比行只是锚点，不是同口径定价公式。
    enumerationScope:
      coverage: sample
      basis: >-
        Sample includes company-specific anchors, adjacent private references, and the most decision-relevant public /
        benchmark comparables for valuation framing.
