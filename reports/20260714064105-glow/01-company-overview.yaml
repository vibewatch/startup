- id: capital-customers
  title: Capital formation, investor roster, and first public customer signals
  body: |-
    Glow's fundraising arc is the clearest reason it qualifies for this report roster. Calcalist's March 2025 story said the company had just raised a $20 million seed round and was simultaneously raising $55 million at a $400 million valuation, with Greenoaks leading. By February 2026, Calcalist reported that Glow was raising more than $100 million at a valuation above $1 billion after already bringing in about $80 million from Sequoia, Index Ventures, Cyberstarts, and Greenoaks. Startup Nation Central's public profile stitches those datapoints into a three-round ladder — $20 million seed in February 2025, $55 million Series A in March 2025, and $100 million Series B in February 2026 — and lists total funding at $175 million. Even if the exact legal close mechanics are still private, the available evidence is strong enough to classify Glow as a newly minted cyber unicorn with unusually fast capital formation.

    The investor quality matters as much as the cash amount. Sequoia, Index Ventures, Cyberstarts, and Greenoaks are all credible backers for Israeli enterprise security, and Calcalist explicitly notes that many overlap with the investors behind Wiz. That overlap does not prove Glow will reproduce Wiz's trajectory, but it does mean sophisticated cyber investors were willing to back Tiger twice in rapid succession and then keep supporting the company into a unicorn-valued round. Public sources do not disclose secondaries, debt, liquidation preferences, or board seats, so the capital story is strong on headline signaling and weak on structure.

    Customer proof is still early but no longer absent. Glow's v05 homepage now publishes quotes attributed to Kyle Weckman at Antares Capital, Matthew Sharp at Xactly, and Scott Crowder at BMC Software. Those do not yet amount to a quantified customer base, but they do show Glow is comfortable associating its product with recognizable enterprise technology leaders. Combined with the company's planned Black Hat 2026 booth and launch party, the evidence suggests Glow is using its 2026 financing not only to fund product buildout but also to step into category-market visibility. That is a meaningful change from the purely stealth posture described in early 2026 coverage.
