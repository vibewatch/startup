- id: milestones-gaps
  title: Milestones, trademarks, and remaining public-information limits
  body: |-
    Glow's public milestones now extend beyond fundraising headlines. The company appears to have been founded in February 2025, raised its seed and Series A within weeks, filed both the GLOW and AUTONOMOUS FENCING trademarks in July 2025, surfaced as a reported unicorn financing in February 2026, published updated legal/privacy materials in May 2026, and began public event-led go-to-market activity around Black Hat 2026. The trademark descriptions are especially useful because they expose a more concrete product direction than the original stealth articles did: allow-listing, execution control, AI-based classification, API integration, risk scoring, and threat blocking all point toward a modern endpoint and software-governance platform rather than only generic APT detection.

    At the same time, the public record still leaves major underwriting gaps. No reviewed source disclosed ARR, revenue run rate, gross margin, net retention, or even a dependable headcount. Startup Nation Central's visible employee count of three sits uneasily beside Glow's public executive bench, website build-out, and Black Hat presence, so it is better treated as stale or partial database output than as a canonical operating metric. Board composition is also still opaque; no source reviewed here identified director seats or governance rights for founders versus investors. Those omissions are not minor in the context of a unicorn round because they block any serious view on execution quality, capital efficiency, or control.

    There are also two adverse or cautionary threads worth carrying into later chapters. First, StartupWired's skeptical framing is directionally fair: a company that reaches a unicorn valuation before broad product launch inherits a compressed margin for error on commercial validation. Second, American Bazaar's recap of Onavo's later privacy controversy does not directly implicate Glow, but it does remind investors that Tiger's prior win came with public scrutiny around data practices. The right overview judgment is therefore neither hype nor dismissal: Glow clearly has elite founder-market fit and investor backing, but the public file still looks like a pre-diligence teaser rather than an underwritable operating dossier.
