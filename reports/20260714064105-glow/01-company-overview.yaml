  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financing-structure
    missingEvidence: Exact Series B close date, post-money valuation, preference stack, debt if any, and whether any secondary shares cleared in the round.
    whyItMatters: Unicorn headline pricing is not enough to assess dilution, downside protection, or how much primary cash actually reached the balance sheet.
    diligencePath: Request the executed financing documents, cap table, and board-consent package for the February 2026 round.
    relatedQuestionRefs:
    - QO016
    relatedTableRefs:
    - TO002
    - TO003
  - type: missing-source
    severity: material
    topic: financial-opacity
    missingEvidence: Verified ARR, revenue run rate, gross margin, burn, runway, and net retention metrics.
    whyItMatters: Without even a bounded revenue frame, the reported unicorn valuation cannot be benchmarked against execution quality or capital efficiency.
    diligencePath: Obtain the latest board deck or CFO reporting pack and reconcile topline, margin, and cash-burn metrics to the fundraising story.
    relatedQuestionRefs:
    - QO018
    relatedTableRefs:
    - TO001
  - type: missing-source
    severity: material
    topic: customer-opacity
    missingEvidence: Total customer count, ACV distribution, deployment scope for quoted logos, and any concentration among the top accounts.
    whyItMatters: A few named references do not reveal whether Glow has genuine commercial breadth or only a small set of design partners.
    diligencePath: Request a customer roster by ARR bucket plus the commercial status of the Antares, Xactly, and BMC references.
    relatedQuestionRefs:
    - QO019
    relatedTableRefs:
    - TO001
    - TO003
  - type: conflicting-data
    severity: minor
    topic: headcount
    missingEvidence: A current employee count or range directly from Glow or a more current third-party people dataset.
    whyItMatters: The public employee figure appears stale enough that it should not be reused as a valuation, operating-leverage, or go-to-market proxy.
    diligencePath: Request a current organization snapshot by function and compare it with LinkedIn or HRIS-export evidence.
    relatedQuestionRefs:
    - QO020
    relatedTableRefs:
    - TO001
  - type: missing-source
    severity: material
    topic: governance-opacity
    missingEvidence: A board roster, observer rights, and any public director biographies tied to the current financing stack.
    whyItMatters: Governance visibility is essential for judging investor influence, founder control, and escalation capacity in a high-valuation private company.
    diligencePath: Request the current board list, voting agreements, and any investor information rights granted in the Series B documents.
    relatedQuestionRefs:
    - QO024
    relatedTableRefs:
    - TO003
  - type: missing-source
    severity: minor
    topic: milestone-coverage
    missingEvidence: Public partnership or formal board-governance milestones that would round out the chronology beyond financing, trademarks, and launch marketing.
    whyItMatters: The milestone record is usable but still overweights financing events because Glow has not publicly disclosed many non-funding milestones.
    diligencePath: Ask Glow for a verified chronology covering product GA, initial paid customers, partnerships, and board formation.
    relatedTableRefs:
    - TO004
