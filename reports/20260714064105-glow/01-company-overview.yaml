company:
  name: Glow
chapter:
  number: 1
  title: Company Overview
  summary: |-
    Glow is an Israeli cybersecurity startup that has moved from stealth fundraising in early 2025 to a controlled public launch posture by mid-2026. Public sources support a founding team led by Roi Tiger, Omer Singer, and Ophir Arie, a dual Israeli/U.S. legal-entity setup, and a rapid financing path from a $20 million seed to a reported $100 million Series B at a unicorn valuation. The strongest reusable facts are Glow's endpoint- and AI-governance positioning, blue-chip backers including Sequoia, Index Ventures, Cyberstarts, and Greenoaks, and newly public customer references from Antares Capital, Xactly, and BMC Software. The main diligence caveats are persistent opacity around revenue, customer count, headcount, board composition, and exact final Series B closing terms.
sections:
- id: identity-product
  title: Identity, product frame, and legal-entity picture
  body: |-
    Glow's public identity changed materially between the February 2026 financing coverage and the July 2026 research date. Calcalist and Startup Nation Central still describe the company as stealth or R&D-stage, but Glow now operates a branded website at glow.io and a richer v05 homepage that explicitly calls it "The Endpoint AI Company." The current public pitch combines two layers: the root site still uses the broader "AI-Powered Security for the Modern Workspace" language, while the deeper marketing pages say Glow helps security teams control everything that runs on endpoints and understand software, plugins, MCPs, and AI tools. That matters because later chapters should treat Glow as more than a generic stealth cyber company; the public record now frames it as an endpoint-centric platform for AI governance, software visibility, and asset control.

    The legal-entity picture is also clearer than the user brief implied, although it is not fully clean. Glow's privacy policy identifies the controller as Glow Security Ltd, suggesting an Israeli operating entity, while the public Master Services Agreement is written in the name of Glow Security, Inc. The trademark surfaces for both GLOW and AUTONOMOUS FENCING likewise reference Glow Security, Inc. as the applicant owner. Startup Nation Central adds an Israeli registrar number, 517114773, and places the company in Tel Aviv-Yafo. The safest overview description is therefore an Israeli-founded cybersecurity company with Tel Aviv roots and a U.S. contracting entity for commercial sales, rather than a single-jurisdiction startup.

    Business-model disclosure remains skeletal but directionally useful. Glow's terms are clearly written for an enterprise SaaS vendor: subscriptions are sold by order form, invoiced in U.S. dollars, and may be bought either directly or through authorized resellers and channel partners. The company is already exposing event, blog, support, privacy, and press surfaces in its sitemap, and its public docs endpoint exists but remains access-restricted. Together, those facts suggest Glow is no longer only fundraising on founder pedigree; it is building the outward operating surfaces of a real enterprise vendor, even though deeper technical and financial detail is still withheld.
