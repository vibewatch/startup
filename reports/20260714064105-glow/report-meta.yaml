  topStrengths:
    - Founder-market fit is strong, with Onavo/Meta, Snowflake, and enterprise cyber lineage.
    - Product positioning around endpoint AI governance and software control is timely and differentiated.
    - Blue-chip investors including Sequoia, Index, Cyberstarts, and Greenoaks validate market interest.
    - Named customer proof from Antares Capital, Xactly, and BMC Software is better than a pure stealth narrative.
  topRisks:
    - ARR, retention, margin, customer concentration, and burn remain undisclosed.
    - Large incumbent endpoint vendors can bundle adjacent controls with much greater distribution.
    - Category adoption for AI governance may lag investor expectations or consolidate into broader platforms.
    - Round structure and downside protection are not public, creating price and dilution uncertainty.
  unresolvedGaps:
    - Current ARR, growth, gross margin, and net retention.
    - Exact Series B structure, liquidation preferences, and cap-table dilution.
    - Customer concentration, production deployment depth, and renewal durability.
    - Evidence of whether Autonomous Fencing and endpoint governance translate into repeatable expansion.
