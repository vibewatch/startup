companyProfile:
  summary: >-
    Glow is an Israeli cybersecurity startup founded in February 2025 by Roi Tiger, Omer Singer,
    and Ophir Arie. The company positions itself as The Endpoint AI Company and is building an
    enterprise SaaS platform for software visibility, AI-tool and MCP governance, and control over
    what runs on managed endpoints. Public traction signals remain narrow but meaningful, with
    named references from Antares Capital, Xactly, and BMC Software, while the funding path has
    accelerated from seed and Series A rounds in 2025 to a reported $100M+ Series B at a $1B+
    valuation in February 2026.
  foundedDate: '2025-02-01'
  founders:
    - name: Roi Tiger
      role: Co-Founder & CEO
      background: Former Onavo co-founder and Meta engineering leader.
      claimRefs: [CO008, CO011, CE028]
    - name: Omer Singer
      role: Co-Founder & CTO
      background: Former Snowflake cybersecurity strategy leader and security-data-lake builder.
      claimRefs: [CO008, CE025, CE026, CE027]
    - name: Ophir Arie
      role: Co-Founder & VP R&D
      claimRefs: [CO008, CO007]
  foundingLocation: Tel Aviv-Yafo, Israel
  headquarters: Tel Aviv-Yafo, Israel
  productSummary: >-
    Endpoint security and AI governance software that helps enterprises discover software and AI
    agents on endpoints, understand risk, and enforce access and execution controls across apps,
    extensions, plugins, MCP-connected tools, and related software surfaces.
  customerFocus: >-
    Large enterprise and upper-mid-market security, IT, and governance teams in regulated and
    software-heavy environments, with current public proof spanning financial services,
    enterprise SaaS, and complex IT operations.
  businessModel: >-
    Sales-led B2B SaaS sold through subscriptions and order forms, with direct enterprise selling
    and partner-assisted channels rather than self-serve motion.
  stage: Series B (private, venture-backed)
  fundingStatus: >-
    Public sources show a $20M seed in February 2025, a $55M Series A in March 2025, and a
    reported $100M+ Series B in February 2026 at a valuation above $1B, for about $175M of total
    disclosed funding.
  disclosureProfile: private-undisclosed
  claimRefs: [CO006, CO007, CO008, CO011, CE001, CE003, CE004, CE011, CU001, CI005, CV004]
summary:
  headline: >-
    Glow has the ingredients of a serious endpoint AI security company, but the public record is
    still too thin to underwrite a confident buy at a unicorn valuation.
