  topStrengths:
    - Founder-market fit is strong, with Onavo/Meta, Snowflake, and enterprise cyber lineage.
    - Product positioning around endpoint AI governance and software control is timely and differentiated.
    - Blue-chip investors including Sequoia, Index, Cyberstarts, and Greenoaks validate market interest.
