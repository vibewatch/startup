evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financing-structure
    missingEvidence: >-
      Exact Series B close date, post-money valuation, preference stack, debt if any, and whether any secondary shares
      cleared in the round.
    whyItMatters: >-
      Unicorn headline pricing is not enough to assess dilution, downside protection, or how much primary cash actually
      reached the balance sheet.
    diligencePath: Request the executed financing documents, cap table, and board-consent package for the February 2026 round.
    relatedQuestionRefs:
      - QO016
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: financial-opacity
    missingEvidence: Verified ARR, revenue run rate, gross margin, burn, runway, and net retention metrics.
    whyItMatters: >-
      Without even a bounded revenue frame, the reported unicorn valuation cannot be benchmarked against execution
      quality or capital efficiency.
    diligencePath: >-
      Obtain the latest board deck or CFO reporting pack and reconcile topline, margin, and cash-burn metrics to the
      fundraising story.
    relatedQuestionRefs:
      - QO018
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: customer-opacity
    missingEvidence: >-
      Total customer count, ACV distribution, deployment scope for quoted logos, and any concentration among the top
      accounts.
    whyItMatters: >-
      A few named references do not reveal whether Glow has genuine commercial breadth or only a small set of design
      partners.
    diligencePath: Request a customer roster by ARR bucket plus the commercial status of the Antares, Xactly, and BMC references.
    relatedQuestionRefs:
      - QO019
    relatedTableRefs:
      - TO001
      - TO003
  - type: conflicting-data
    severity: minor
    topic: headcount
    missingEvidence: A current employee count or range directly from Glow or a more current third-party people dataset.
    whyItMatters: >-
      The public employee figure appears stale enough that it should not be reused as a valuation, operating-leverage,
      or go-to-market proxy.
    diligencePath: Request a current organization snapshot by function and compare it with LinkedIn or HRIS-export evidence.
    relatedQuestionRefs:
      - QO020
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: governance-opacity
    missingEvidence: A board roster, observer rights, and any public director biographies tied to the current financing stack.
    whyItMatters: >-
      Governance visibility is essential for judging investor influence, founder control, and escalation capacity in a
      high-valuation private company.
    diligencePath: >-
      Request the current board list, voting agreements, and any investor information rights granted in the Series B
      documents.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: minor
    topic: milestone-coverage
    missingEvidence: >-
      Public partnership or formal board-governance milestones that would round out the chronology beyond financing,
      trademarks, and launch marketing.
    whyItMatters: >-
      The milestone record is usable but still overweights financing events because Glow has not publicly disclosed many
      non-funding milestones.
    diligencePath: Ask Glow for a verified chronology covering product GA, initial paid customers, partnerships, and board formation.
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: sam-som-isolation
    missingEvidence: >-
      No reviewed public source isolates a standalone SAM or SOM for Glow's combined endpoint-control, insider-risk, and
      AI-governance wedge.
    whyItMatters: >-
      A blended category can look very large while still hiding a much narrower budget line that is realistically open
      to an independent startup.
    diligencePath: >-
      Request management's internal segmentation model showing pipeline, ACV, and target accounts by budget line
      (endpoint, data security, compliance, AI governance).
    relatedQuestionRefs:
      - QM011
      - QM025
  - type: private-evidence-only
    severity: material
    topic: pricing-and-packaging
    missingEvidence: >-
      No reviewed source disclosed Glow's pricing model, unit of sale, deployment minimums, or whether the platform is
      sold by endpoint, user, module, or data volume.
    whyItMatters: >-
      Pricing structure determines whether Glow competes first against endpoint suites, insider-risk tools, or
      data-security platforms and shapes gross-margin potential.
    diligencePath: Request current price book, example order forms, packaging roadmap, and win-loss notes on price objections.
    relatedQuestionRefs:
      - QM024
      - QM025
  - type: private-evidence-only
    severity: material
    topic: buyer-budget-owner
    missingEvidence: >-
      Public sources do not reveal which budget owner actually pays for Glow in live deals or whether the company lands
      through security, IT, or AI-governance programs.
    whyItMatters: >-
      Budget-line ambiguity is one of the biggest risks in converged control categories because it can elongate sales
      cycles and increase incumbent competition.
    diligencePath: Ask for closed-won deal summaries naming economic buyer, champion, procurement path, and displaced alternative.
    relatedQuestionRefs:
      - QM014
      - QM024
  - type: missing-source
    severity: material
    topic: independent-deployment-proof
    missingEvidence: >-
      Public evidence does not show independent case studies quantifying deployment breadth, policy volumes, or
      measurable ROI for Glow.
    whyItMatters: >-
      Market attractiveness alone does not prove that Glow's product fits enterprise workflows well enough to survive
      incumbent bundle pressure.
    diligencePath: >-
      Request customer references, deployment architecture diagrams, and before/after metrics on risky-tool discovery,
      policy coverage, and alert quality.
    relatedQuestionRefs:
      - QM024
      - QM025
  - type: conflicting-data
    severity: minor
    topic: market-size-dispersion
    missingEvidence: >-
      Published DSPM and IRM market estimates differ substantially across sources because each publisher draws the
      category boundary differently.
    whyItMatters: >-
      Overstating the category from the highest estimate could mislead valuation logic or hide how much overlap exists
      with incumbent suites.
    diligencePath: >-
      Use management's actual competitor set and deal mix to build a bottoms-up market model instead of relying on one
      syndicated TAM source.
    relatedQuestionRefs:
      - QM009
      - QM011
  - type: private-evidence-only
    severity: material
    topic: competitive-win-rate
    missingEvidence: >-
      No reviewed public source disclosed Glow's direct win-loss rates, named displaced competitors, or share of
      pipeline won against incumbents versus startups.
    whyItMatters: >-
      Competitive framing is only partially useful without evidence that buyers actually choose Glow over Cyberhaven,
      Microsoft, CrowdStrike, or other alternatives.
    diligencePath: >-
      Request CRM-based win-loss analysis, top-opportunity competitor tags, and at least five recent
      closed-won/closed-lost deal memos.
    relatedQuestionRefs:
      - QP024
      - QP025
  - type: private-evidence-only
    severity: material
    topic: pricing-benchmark
    missingEvidence: >-
