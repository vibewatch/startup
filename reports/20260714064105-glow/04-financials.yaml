company:
  name: Glow
chapter:
  number: 4
  title: Financials
  summary: Glow's public financial picture is strong on funding headlines and weak on operating evidence. The company clearly sells enterprise security software-as-a-service by subscription, has raised roughly $175 million across seed, A, and reported B rounds, and appears positioned for high-margin recurring software economics if product delivery stays mostly software-led. But the public record still does not disclose ARR, revenue, net retention, cash burn, runway, customer concentration, or realized pricing, so the right financial verdict is that capital access is proven while revenue quality and capital efficiency remain un-underwritten.
sections:
- id: revenue-model
  title: Revenue model and monetization structure visible in the public file
  body: 'Glow''s strongest public financial fact is not a number but a mechanism. Its terms of service clearly describe a security software-as-a-service subscription sold by order form, invoiced in U.S. dollars, and payable in advance, with the option to transact directly or through resellers and other authorized channel partners. That is materially different from a hardware-heavy, ad-supported, or usage-consumer model. The website also publishes customer references from large enterprise names, which reinforces that Glow is pursuing a classic enterprise B2B motion rather than self-serve mass-market monetization. What the public record does not reveal is how the company prices that model in practice: there is no reviewed list price, no per-endpoint or per-seat rate card, no public contract term, and no clear statement about whether pricing is based on endpoints, employees, modules, data volume, or some hybrid. Competitor evidence shows why that matters. Microsoft can bury endpoint and governance
    functionality inside broader enterprise suites, CrowdStrike exposes at least a small-business on-ramp while monetizing deeper platform expansion, and quote-led platforms such as Cyberhaven, SentinelOne, Palo Alto, and ThreatLocker all shift the pricing discussion to enterprise value rather than transparent list rates. Glow therefore likely sells a high-ACV, negotiated software contract, but its realized monetization quality is still opaque.'
