  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: revenue-visibility
    missingEvidence: Current ARR, revenue run rate, quarterly revenue trend, and billings are all absent from the public file.
    whyItMatters: Without top-line scale, no late-stage valuation or runway conclusion can be tied to operating reality.
    diligencePath: Request management financial statements, ARR bridge, and trailing four-quarter revenue history.
    relatedQuestionRefs:
    - QI009
    - QI024
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics
    missingEvidence: Gross margin, CAC, payback, net retention, and customer concentration are not publicly disclosed.
    whyItMatters: These metrics determine whether growth is durable, efficient, and resilient under bundle pressure.
    diligencePath: Request cohort retention, margin bridge, CAC model, payback analysis, and top-customer concentration table.
    relatedQuestionRefs:
    - QI010
    - QI016
    - QI024
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: Current cash on hand, monthly burn, and runway months are undisclosed.
    whyItMatters: Large historical funding does not prove the business is adequately financed today.
    diligencePath: Request current balance sheet, burn forecast, and board-approved operating plan.
    relatedQuestionRefs:
    - QI011
    - QI024
  - type: private-evidence-only
    severity: material
    topic: pricing-realization
    missingEvidence: No reviewed source disclosed Glow's unit of sale, realized ASP, contract term, or standard discounting.
    whyItMatters: Pricing realization determines both revenue quality and gross-margin path.
    diligencePath: Request current price book, realized ASP distribution, and standard contract templates.
    relatedQuestionRefs:
    - QI007
    - QI008
  - type: missing-source
    severity: material
    topic: sales-efficiency
    missingEvidence: No public evidence quantified Glow's sales cycle, pipeline conversion, or channel economics.
    whyItMatters: Enterprise cybersecurity can look capital-light on paper while hiding very expensive GTM motion.
