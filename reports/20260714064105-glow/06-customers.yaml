chapter:
  number: 6
  title: Customers
  summary: Glow has crossed the threshold from pure stealth into real but still narrow public customer proof. The best evidence is not broad usage telemetry or cohort data; it is a small set of named executive references on Glow's own site, especially Antares Capital, Xactly, and BMC Software. Those references are credible enough to show that Glow is engaging security leaders in regulated and software-heavy enterprises, but they are still insufficient to prove production depth, renewal durability, customer concentration, or scale of spend. The resulting customer picture is encouraging for an early enterprise-security company, yet still under-disclosed for a unicorn valuation.
sections:
- id: customer-segments-and-buyer-shape
  title: Customer segments, buyer roles, and what Glow is clearly selling into
  body: |-
    Glow's customer proof is thin in count but unusually legible in buyer quality. The current homepage names Antares Capital, Xactly, and BMC Software, and every quoted speaker is a senior security or IT decision maker rather than a low-level practitioner. Kyle Weckman is identified as CISO of Antares Capital, Matthew Sharp as CISO of Xactly, and Scott Crowder as SVP and CIO of BMC Software. That matters because it suggests Glow is not testing only with small technical teams or anonymous design partners; it is trying to sell into organizations where endpoint governance, software sprawl, and AI-control questions are visible at executive level. The reference set also spans meaningful verticals. Antares represents financial services and credit, Xactly represents enterprise SaaS and revenue software, and BMC represents large-scale infrastructure and enterprise software operations. The named proof therefore supports a best-current segmentation of large enterprise and upper-mid-market buyers in regulated or software-intensive environments.

    The customer jobs implied by the quotes are also consistent. Antares emphasizes getting clean, reducing risk, and understanding what is actually running across the enterprise. Xactly emphasizes the connection between AI governance and the broader software-governance problem. BMC's quote frames Glow as an endpoint control point that can help organizations act at AI speed. Together these references imply that Glow is selling to security and IT leaders who need discovery, governance, and remediation in one motion rather than just a narrow inventory tool. The anonymous security-engineering quote on autonomous remediation reinforces the same point from an operator perspective, even though it is weaker evidence than the named references.

    What the public file does not yet prove is equally important. There is no disclosed customer count, seat count, logo count beyond the few named references, regional mix, ACV band, or live-production footprint. There is also no public evidence separating a paid production deployment from a pilot, proof of concept, or quoted design-partner relationship. Investors should therefore read the customer surface as real early proof of enterprise relevance, but not as a durable adoption dataset.
