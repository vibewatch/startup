tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Unit
  - Current value / status
  - Revenue quality
  - Diligence ask
  rows:
  - - Consumer service fee
    - Omio may charge a service fee for booking/intermediation services on eligible direct bookings.
    - Per booking
    - Officially disclosed in terms; exact schedule not public.
    - Medium; recurring with transaction volume but vulnerable to price comparison.
    - Provide fee take rate by mode, country, and operator.
  - - Provider commission
    - Omio receives commission from third-party providers when acting as agent.
    - Percentage of fare or booking
    - Officially disclosed in terms; actual commission bands undisclosed.
    - Medium to high; embedded in supplier distribution economics.
    - Provide weighted-average commission by rail, bus, flight, and ferry.
  - - Omio Flex ancillary
    - Paid cancellation/flexibility add-on underwritten with Companjon.
    - Per covered booking
    - Global rollout announced in 2025; refund level and cutoff vary by policy context.
    - Medium; attractive ancillary but carries refund/claims cost.
    - Provide attach rate, net contribution margin, and claims ratio.
  - - Omio Pass membership
    - 90-day paid membership offering 10% discounts across trains, buses, and ferries.
    - Per member / 90-day pass
    - Announced in 2026 strategy release; pricing and adoption not disclosed.
    - Unknown; could improve repeat booking behavior if attach is meaningful.
    - Provide price point, conversion rate, and repeat-booking uplift.
  - - B2B API / white-label distribution
    - Omio provides transport inventory, booking, payments, and ticketing infrastructure to partners.
    - Contract / revenue-share / integration economics
    - Publicly expanding through TUI and easyTrain; revenue terms not disclosed.
    - High if recurring contract economics and partner stickiness are real.
    - Provide B2B ARR, gross margin, and top-partner concentration.
  notes: Public sources confirm the existence of these streams but not revenue contribution by stream. Omio Pass and B2B economics are especially under-disclosed.
  claimRefs:
  - CI002
  - CI011
  - CI015
  - CI018
  - CI019
  - CI031
- id: TI002
  title: Pricing / monetization table
  columns:
  - Product / layer
  - Price / structure
  - List vs realized pricing
  - Discounts / unknowns
  - Source
  rows:
  - - Direct booking service fee
    - Variable fee charged by Omio for some platform bookings.
    - List schedule not public; realized fee likely route- and provider-specific.
    - Unknown by geography, mode, and refundability.
    - Omio Terms of Use; ORR fee review.
  - - Provider commission
    - Commission paid by third-party provider to Omio.
    - Not publicly listed.
    - Could vary materially by transport mode and contract.
    - Omio Terms of Use.
  - - Omio Flex
    - Customers can add a paid flexibility product; refund benefit public, price not public.
    - Marketing promises flexibility; realized economics depend on attach and claim rate.
    - Current help guidance says 80% refund up to two hours before departure; earlier rollout press referenced up to 100% depending on fare type and as late as 15 minutes before departure.
    - Omio Flex product/help pages and 2025 press release.
  - - Omio Pass
    - 90-day paid membership with 10% discounts across trains, buses, and ferries.
    - Public discount benefit disclosed; price not disclosed.
    - Unknown whether subsidy is funded by Omio margin, suppliers, or both.
    - Omio 2026 strategy release.
  - - TUI / easyTrain B2B economics
    - White-label/API distribution that monetizes inventory and ancillary attachment.
    - Contract pricing not public.
    - Unknown mix of setup fees, rev share, and ticketing margin.
    - Omio TUI and easyTrain press releases.
  notes: Omio discloses pricing structure far more clearly than price points. The only public constants are the existence of service fees, provider commissions, and discount/flexibility products.
  claimRefs:
  - CI002
  - CI011
  - CI012
  - CI015
  - CI017
  - CI019
- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Value / status
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Public revenue estimate
    - $64.5M ARR in 2025; $38.1M in 2024 per GetLatka estimate.
    - Low; third-party estimate only.
    - Anchor for implied take-rate and multiple analysis.
    - Provide management revenue by quarter and by business line.
  - - Ticket-sales throughput
    - $1B+ ticket sales in 2024; 80,000 tickets daily.
    - Medium; company-claimed but clear.
    - Shows scale of gross transaction flow.
    - Reconcile ticket sales to recognized revenue and refund netting.
  - - Implied public take-rate proxy
    - Roughly 6%+ using $64.5M revenue estimate against $1B+ ticket sales.
    - Low; periods differ and ticket sales are a lower bound.
    - Indicates whether revenue quality resembles a distributor rather than a pure search lead-gen model.
    - Provide net revenue / gross booking value by mode.
  - - Gross margin
    - Not publicly disclosed.
    - Unknown.
    - Core determinant of valuation defensibility and operating leverage.
    - Provide audited or board-level gross margin bridge.
  - - CAC / payback
    - Not publicly disclosed.
    - Unknown.
    - Needed to test whether growth is capital efficient or traffic-acquisition heavy.
    - Provide paid vs organic CAC and payback by region.
  - - NRR / repeat behavior
    - Not publicly disclosed.
    - Unknown.
    - Critical for assessing whether app, membership, and Flex create durable customer value.
    - Provide cohort repeat-booking and member retention data.
  - - Refund / service burden
    - Review sources and ORR intervention imply meaningful fee and service sensitivity.
    - Medium.
    - High support burden can erode apparent booking-fee economics.
    - Provide support cost per booking, refund cycle time, and complaint rate.
  notes: This table separates directly observed data from inferred proxies. No public source provided gross margin, CAC, payback, NRR, or monthly burn.
  claimRefs:
  - CI021
  - CI028
  - CI029
  - CI033
  - CI037
- id: TI004
  title: Capital adequacy table
  columns:
  - Item
  - Value
  - Notes
  rows:
  - - Hercules growth capital facility
    - $120M
    - Officially announced December 2024; linked to future growth and Southeast Asia expansion.
  - - Public profitability marker
    - EBITDA profitable in 2024
    - Officially company-claimed, not audited in public Omio filings.
  - - Lifetime capital, low end
    - ~$459M
    - Seedtable estimate; likely excludes some later debt/strategic components.
  - - Lifetime capital, mid estimate
    - ~$486M to $596M
    - Tracxn and GetLatka data points bracket a central market-database range.
  - - Lifetime capital, high end
    - ~$606M
    - InforCapital estimate; inclusion logic not transparent.
  - - Cash on hand / monthly burn / runway
    - Not disclosed
    - Biggest unresolved capital-adequacy blocker.
  - - Debt obligations / covenants / maturity
    - Not publicly disclosed
    - Investors need documentation on interest cost, covenants, and repayment schedule.
  notes: Company Overview contains the full round chronology. This table focuses on present capital adequacy and on the wide spread in public capital totals rather than repeating every historical round.
  claimRefs:
  - CI005
  - CI006
  - CI022
  - CI023
  - CI024
  - CI025
  - CI035
- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact
  - Exact diligence path
  rows:
  - - Revenue by stream
    - Cannot judge mix quality between consumer fees, provider commissions, B2B, Flex, membership, and advertising.
    - Request CFO revenue waterfall for last eight quarters.
  - - Gross margin by segment
    - Impossible to test whether the business deserves software-like or OTA-like multiples.
    - Request segment gross margin by B2C, B2B, Flex, and membership.
  - - CAC and payback
    - Cannot assess the real cost of acquiring traffic across search, app, and partner channels.
    - Request blended and channel-level CAC/payback by geography.
  - - Net revenue retention / repeat booking cohorts
    - Cannot tell whether Omio Pass and brand expansion create durable monetization or just one-off bookings.
    - Request cohort retention by first-booking mode and by member status.
  - - Cash, burn, runway, and debt terms
    - Cannot stress-test whether the Hercules facility meaningfully extends runway or merely substitutes for equity.
    - Request board cash forecast, debt agreement summary, and covenant package.
  notes: These are the core underwriting blockers as of the 2026-08-12 run date.
  claimRefs:
  - CI032
  - CI033
  - CI035
  - CI040
