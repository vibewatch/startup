summary:
  headline: >
    Omio is a strategically credible multimodal travel platform, but the current roughly $1 billion mark looks stretched
    on public evidence because it implies a revenue multiple far above public travel-tech comparables without matching
    disclosure depth on revenue quality, retention, concentration, or debt terms.
