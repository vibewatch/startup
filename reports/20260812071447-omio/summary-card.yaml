  topStrengths:
    - >-
      Rare multimodal breadth across trains, buses, flights, and ferries, plus proof of white-label and partner-channel
      distribution beyond the core app.
    - >-
      2024 profitability claim and >$1B ticket-sales milestone suggest the company may finally be showing real operating
      leverage after the pandemic recovery period.
    - >-
      Public evidence supports meaningful scale in demand and inventory: 3,000+ partners, 46-47 countries, and large
      annual user and daily traveler figures.
    - >-
      Channel expansion into Omio B2B, Omio Business, and branded partnerships creates upside optionality beyond direct
      consumer booking.
    - >-
      Tier-1 investors and lender support imply Omio has continued access to strategic capital despite travel-market
      volatility.
  topRisks:
    - >-
      Current ~$1B private mark implies ~15.5x 2025 estimated revenue and >26x 2024 estimated revenue, far above the
      0.3x-6.0x public comp band used here.
    - >-
      Debt adds financing flexibility but public sources do not disclose covenant terms, maturity, pricing, or downside
      triggers for the Hercules facility.
    - >-
      Customer trust is not pristine: ORR intervention on fee transparency and recurring review-site complaints about
      refunds and support still matter.
    - >-
      Partner and supply dependence remain material because Omio does not own transport inventory and public sources do
      not quantify concentration by carrier or partner.
    - >-
      Core valuation inputs such as revenue, employee count, and total capital raised still rely heavily on third-party
      databases rather than audited company disclosure.
    - >-
      Execution complexity is rising as Omio adds SMB, B2B, memberships, new geographies, and white-label distribution
      on top of the consumer app.
  unresolvedGaps:
    - Management-confirmed annual revenue, gross margin, and take-rate disclosure by segment.
    - Retention, repeat-booking, and cohort behavior across direct B2C, partner-channel, and SMB products.
    - Debt covenant package, maturity schedule, pricing, and refinancing sensitivity for the Hercules facility.
    - Partner concentration, top-carrier exposure, and renewal timing for major channel relationships.
    - Support and refund operating metrics, including SLA, chargeback rate, fraud losses, and dispute-resolution time.
    - Board-level liquidity strategy, including appetite for IPO, strategic sale, or longer private-market hold.
