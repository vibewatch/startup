evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: board-governance
    missingEvidence: A current board roster, committee structure, and any documented succession planning for Naren Shaam.
    whyItMatters: >-
      Governance transparency is thin for a company executing debt-funded and M&A-led expansion, increasing key-person
      and control risk.
    diligencePath: >-
      Request the latest board deck, board observer list, governance charter, and any succession materials directly from
      management.
    relatedQuestionRefs:
      - QO020
      - QO026
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: material
    topic: total-funding
    missingEvidence: A management-confirmed capital table reconciling equity, debt, and strategic investments across all rounds.
    whyItMatters: >-
      Public databases disagree on cumulative funding totals and later-round labels, which affects ownership, dilution,
      and liquidation analysis.
    diligencePath: Obtain a round-by-round capitalization summary and supporting closing documents from finance or counsel.
    relatedQuestionRefs:
      - QO011
    relatedTableRefs:
      - TO003
  - type: stale
    severity: minor
    topic: headcount-office-footprint
    missingEvidence: A single current headcount and office-footprint disclosure with group-versus-brand definitions.
    whyItMatters: >-
      Public pages reference 300, 400+, and 430+ employees, creating uncertainty around current operating scale and
      organizational leverage.
    diligencePath: Request a current org snapshot with global headcount, contractor count, and office list as of the diligence date.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: revenue-disclosure
    missingEvidence: A precise 2025 or 2026 revenue figure, its accounting definition, and supporting financial statements.
    whyItMatters: >-
      Ticket sales and EBITDA profitability are directionally useful, but underwriting needs net revenue, gross margin,
      and cash-generation clarity.
    diligencePath: >-
      Request audited or management financials showing revenue, take rate, gross margin, and EBITDA bridge for
      2024-2026.
    relatedQuestionRefs:
      - QO009
  - type: private-evidence-only
    severity: material
    topic: omio-specific-sam-som
    missingEvidence: A management-backed view of Omio’s serviceable market and actual mode-by-geography revenue mix.
    whyItMatters: >-
      Public market reports size broad categories, but investors need to know what portion Omio can realistically
      monetize given its current supply and take-rate model.
    diligencePath: >-
      Request internal market maps, GMV by mode and geography, and management assumptions for serviceable market
      capture.
    relatedQuestionRefs:
      - QM021
      - QM026
  - type: conflicting-data
    severity: material
    topic: publisher-sizing-variance
    missingEvidence: A reconciled methodology note explaining why third-party market estimates differ so widely.
    whyItMatters: >-
      Market size dispersion is large enough to affect valuation framing and can lead to false precision if one
      publisher number is treated as canonical.
    diligencePath: Compare publisher definitions directly and ask management which lens they use internally when framing TAM.
    relatedQuestionRefs:
      - QM022
  - type: missing-source
    severity: minor
    topic: segment-monetization
    missingEvidence: >-
      Public evidence on conversion, take rate, or monetization by segment such as leisure, SMB, B2B, or inbound
      traveler.
    whyItMatters: >-
      Buyer segmentation is visible, but segment economics are not, limiting confidence in whether expansion markets are
      profit pools or simply traffic pools.
    diligencePath: Request segment-level GMV, conversion, repeat rate, and gross-margin contribution.
    relatedQuestionRefs:
      - QM018
      - QM026
  - type: stale
    severity: minor
    topic: regulatory-final-text
    missingEvidence: >-
      The final enacted text and implementation timing for the EU passenger package and any related rail-ticketing
      obligations.
    whyItMatters: >-
      The current policy debate is directionally clear, but legal timing and enforcement detail will shape platform
      compliance cost and upside.
    diligencePath: Track final legislative text, delegated acts, and industry compliance guidance through 2026 and 2027.
    relatedQuestionRefs:
      - QM015
      - QM016
  - type: missing-source
    severity: material
    topic: peer-conversion-and-take-rate
    missingEvidence: Like-for-like conversion, fee incidence, refund rates, and take-rate data across Omio and peers.
    whyItMatters: >-
      Workflow businesses with low switching costs should be judged on real conversion and trust metrics, not only on
      route breadth or app claims.
    diligencePath: >-
      Request internal competitive win-loss data and third-party retailer benchmark studies covering conversion and
      complaint rates.
    relatedQuestionRefs:
      - QP022
      - QP026
  - type: private-evidence-only
    severity: material
    topic: entrant-risk
    missingEvidence: Management view of threats from Google, Booking, AI trip planners, and direct-operator product improvements.
    whyItMatters: >-
      Potential entrant risk may be more important than current private peers, but the public evidence base is too thin
      to score it rigorously.
    diligencePath: >-
      Request board materials or strategy memos discussing likely entrants, CAC inflation, and defensive product
      priorities.
    relatedQuestionRefs:
      - QP021
  - type: missing-source
    severity: minor
    topic: standardized-fee-comparison
    missingEvidence: A normalized current fee schedule for each retailer and operator across identical routes and refund scenarios.
    whyItMatters: >-
      Fee transparency is a known trust issue, but public sources do not yet permit a rigorous apples-to-apples pricing
      benchmark.
    diligencePath: Run a mystery-shopping exercise across representative cross-border routes and ticket-change scenarios.
    relatedQuestionRefs:
      - QP009
      - QP024
  - type: private-evidence-only
    severity: material
    topic: supply-contract-durability
    missingEvidence: >-
      Supplier contract terms, API rights, and any exclusivity or preferred-display arrangements that determine platform
      durability.
    whyItMatters: >-
      Competitive advantage in this category ultimately rests on supply access and operator relationships more than on
      front-end UI alone.
    diligencePath: Review top operator agreements, content-rights clauses, and termination/change-control provisions.
    relatedQuestionRefs:
      - QP025
      - QP026
