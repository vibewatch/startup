- id: milestones-and-adverse-signals
  title: Milestones, International Expansion, and Adverse Signals
  body: The operating story is one of steady widening scope. By 2019 Omio had already reached 27 million monthly users and 18 languages, then added Rome2Rio later that year to expand travel discovery. Management says COVID briefly erased 98 percent of business, but the company recovered, reached EBITDA profitability by the end of 2024, and resumed expansion through new capital and partnerships. In 2025, Omio deepened U.S. ground coverage through Transcor Data Services and continued live inventory distribution through partners such as Amtrak. In 2026 it launched Omio Business, announced a strategic $10 million Granite-Integral investment to accelerate Japan and Southeast Asia, and agreed to acquire Rail Europe, which would dramatically enlarge rail-distribution scale if closed. The adverse read is that customer-experience evidence is much less polished than the growth narrative. Third-party complaint sources repeatedly mention refund delays, duplicate charges, weak support, and poor handling
    of complex trips. Those issues matter because Omio’s thesis depends on simplifying fragmented travel, not merely aggregating it.
