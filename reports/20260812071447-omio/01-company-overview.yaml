  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: board-governance
    missingEvidence: A current board roster, committee structure, and any documented succession planning for Naren Shaam.
    whyItMatters: Governance transparency is thin for a company executing debt-funded and M&A-led expansion, increasing key-person and control risk.
    diligencePath: Request the latest board deck, board observer list, governance charter, and any succession materials directly from management.
    relatedQuestionRefs:
    - QO020
    - QO026
    relatedTableRefs:
    - TO002
  - type: conflicting-data
    severity: material
    topic: total-funding
    missingEvidence: A management-confirmed capital table reconciling equity, debt, and strategic investments across all rounds.
    whyItMatters: Public databases disagree on cumulative funding totals and later-round labels, which affects ownership, dilution, and liquidation analysis.
    diligencePath: Obtain a round-by-round capitalization summary and supporting closing documents from finance or counsel.
    relatedQuestionRefs:
    - QO011
    relatedTableRefs:
    - TO003
