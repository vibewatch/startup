company:
  name: Omio
chapter:
  number: 1
  title: Company Overview
  summary: Omio is a Berlin-founded multimodal travel booking platform that evolved from GoEuro into a broader global mobility group spanning consumer booking, B2B distribution, and travel-discovery assets. Public evidence supports meaningful scale in supply breadth and traffic, but governance, precise revenue, and fully reconciled funding data remain materially thinner than the company’s operating footprint would suggest.
sections:
- id: identity-and-model
  title: Identity, Product Model, and Brand Evolution
  body: 'Omio is a Berlin-headquartered multimodal travel search and booking platform that began as GoEuro in 2013. The founding thesis was practical rather than speculative: Naren Shaam struggled to book an intercity rail trip during a 2010 backpacking journey and concluded that European transport remained digitally fragmented even as urban mobility and e-commerce had become app-native. The company now positions itself as a unified interface for trains, buses, flights, ferries, and selected transfer inventory, with a mix of metasearch and direct booking behavior depending on provider integration. That hybrid model is important for diligence because it makes Omio neither a pure OTA nor a pure discovery layer; its value comes from stitching together fragmented inventory and keeping users inside one itinerary flow. The 2019 rebrand from GoEuro to Omio was not cosmetic. Management explicitly tied it to global ambitions beyond Europe, arguing that a less region-bound brand was necessary to expand
    supply, languages, and consumer relevance across international markets.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO007
  - CO008
  figureRefs:
  - FO002
- id: leadership-and-governance
  title: Leadership, Executive Visibility, and Key-Person Dependence
  body: 'Naren Shaam still dominates Omio’s public identity in 2026. He appears as founder and CEO across corporate pages and external interviews, and he remains the lead voice on product direction, international expansion, and post-COVID operating strategy. Publicly fetchable sources also surface an executive bench that includes finance, product, technology, and marketing leaders, but those disclosures are thinner than what investors would typically expect from a late-stage private company. RocketReach excerpts identify Tomas Vocetka as CTO, Ashish Chatterjee as Chief Product Officer, and Facundo Viguie Aleman as CMO, while Seedtable and corporate materials also point to Jean-Bernard Moens as CFO. What is missing is equally important: official fetchable materials did not provide a clean, authoritative board roster, committee structure, or succession framing. For a company that has raised hundreds of millions and is executing debt-funded expansion and M&A, this governance opacity increases
    diligence burden and heightens dependence on Shaam as the central decision-maker and external spokesperson.'
  claimRefs:
  - CO014
  - CO015
  - CO040
  tableRefs:
  - TO002
- id: capital-history-and-stakeholders
  title: Funding Path, Investor Base, and Capital Context
  body: Omio’s financing history shows a company that repeatedly used outside capital to widen supply coverage, geography, and eventually group scope. TechCrunch documented a $45 million Goldman-led Series B in 2015, a $70 million Series C in 2016 led by Silver Lake Kraftwerk and Kleiner Perkins, and a $150 million 2018 round from Kinnevik and Temasek that pushed cumulative funding close to $300 million. Later databases add an $80 million 2022 round led by Lazard Asset Management, then a December 2024 Hercules Capital debt facility and a July 2026 strategic investment from Granite-Integral. The main caution is not whether Omio can raise capital; it clearly can. The caution is that public databases disagree materially on cumulative funding and classify newer capital differently. Depending on source and inclusion logic, total money raised ranges from roughly $459 million to $606 million, while external valuation references cluster around $1 billion after the 2024 debt financing. That level
    of variance is tolerable for a private growth company but not precise enough for cap-table-sensitive underwriting without management confirmation.
  claimRefs:
  - CO016
  - CO017
  - CO018
  - CO023
  - CO024
  - CO025
  - CO028
  - CO029
  - CO030
  - CO031
