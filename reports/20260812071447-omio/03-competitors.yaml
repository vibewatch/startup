  evidenceGaps:
  - type: missing-source
    severity: material
    topic: peer-conversion-and-take-rate
    missingEvidence: Like-for-like conversion, fee incidence, refund rates, and take-rate data across Omio and peers.
    whyItMatters: Workflow businesses with low switching costs should be judged on real conversion and trust metrics, not only on route breadth or app claims.
    diligencePath: Request internal competitive win-loss data and third-party retailer benchmark studies covering conversion and complaint rates.
    relatedQuestionRefs:
    - QP022
    - QP026
  - type: private-evidence-only
    severity: material
    topic: entrant-risk
    missingEvidence: Management view of threats from Google, Booking, AI trip planners, and direct-operator product improvements.
    whyItMatters: Potential entrant risk may be more important than current private peers, but the public evidence base is too thin to score it rigorously.
    diligencePath: Request board materials or strategy memos discussing likely entrants, CAC inflation, and defensive product priorities.
    relatedQuestionRefs:
    - QP021
  - type: missing-source
    severity: minor
    topic: standardized-fee-comparison
    missingEvidence: A normalized current fee schedule for each retailer and operator across identical routes and refund scenarios.
    whyItMatters: Fee transparency is a known trust issue, but public sources do not yet permit a rigorous apples-to-apples pricing benchmark.
    diligencePath: Run a mystery-shopping exercise across representative cross-border routes and ticket-change scenarios.
    relatedQuestionRefs:
    - QP009
    - QP024
  - type: private-evidence-only
    severity: material
    topic: supply-contract-durability
    missingEvidence: Supplier contract terms, API rights, and any exclusivity or preferred-display arrangements that determine platform durability.
    whyItMatters: Competitive advantage in this category ultimately rests on supply access and operator relationships more than on front-end UI alone.
    diligencePath: Review top operator agreements, content-rights clauses, and termination/change-control provisions.
    relatedQuestionRefs:
    - QP025
    - QP026
