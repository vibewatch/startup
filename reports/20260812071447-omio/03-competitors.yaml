- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Platform
  - Public price / fee model
  - What is included
  - What remains unknown
  - Implication
  rows:
  - - Omio
    - Retailer fee transparency reviewed by ORR; exact current fee schedule not normalized in chapter
    - Multimodal search and booking workflow
    - Exact fee incidence by mode and market
    - Convenience value must outweigh any added fee perception
  - - Trainline
    - Retailer fee transparency reviewed by ORR; route savings marketing visible on home page
    - Train and bus booking plus adjacent railcards / attachments
    - Exact current fees across geographies
    - Public scale helps distribution, but fee scrutiny can erode trust
  - - Rail Europe
    - Retailer fee transparency reviewed by ORR; route comparison and multi-currency checkout visible
    - Rail-first search and booking
    - Exact fees and pass economics by journey type
    - Specialist trust can offset narrower breadth if checkout is clear
  - - Wanderu
    - Markets lowest prices and no redirects from app flow
    - Bus and train compare-book surface
    - Whether any service fees apply by carrier or route
    - Consumer promise is convenience plus price confidence
  - - Direct operators
    - Often face-value or primary-ticket source, depending on operator
    - Primary inventory and direct customer relationship
    - Cross-mode comparison and multi-operator convenience
    - Direct booking remains powerful for simple journeys
  notes: The public record is stronger on fee transparency scrutiny than on standardized, current fee schedules. Pricing comparisons should therefore be interpreted as model comparisons, not as a precise fee league table.
