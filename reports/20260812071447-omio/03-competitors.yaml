  - - Multimodal workflow UX
    - Low switching costs and easy multi-homing
    - High
    - Request retention, repeat search, and assisted-support metrics
  - - Group structure (Rome2Rio + B2B + Omio Business)
    - Execution sprawl and weak user understanding
    - Medium
    - Review segment adoption and cross-sell conversion
  - - Bus and rail expansion outside Europe
    - Local champions with stronger inventory depth
    - Medium
    - Measure attach rates and route conversion in new geographies
  - - Price transparency and trust
    - Regulatory fee scrutiny and refund complaints
    - High
    - Review fee disclosures, refund SLAs, and complaint rates
  - - Brand and app habit
    - Hyperscale entrants or direct-operator improvements
    - Medium
    - Track organic traffic share, CAC, and brand search resilience
  notes: Omio’s moat is more integration- and workflow-based than exclusivity-based. The register therefore focuses on whether those workflow advantages are durable enough to survive fee scrutiny and operator power.
