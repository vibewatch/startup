      - number: '4.5'
        title: Financial Verdict and Diligence Blockers
        blocks:
          - type: paragraph
            body: >-
              The headline read is favorable but incomplete. Omio appears to have a real, diversified monetization
              engine: consumer service fees, provider commissions, paid flexibility, subscription-style membership, B2B
              white-label distribution, and potentially future advertising around Rome2Rio. The company also has
              credible proof of scale and at least one official profitability milestone. Benchmarking against Trainline
              is directionally helpful because it shows that European ground-transport distribution can convert high
              ticket volume into meaningful revenue and EBITDA, but the comparison only goes so far: Trainline is a
              listed company with audited filings, while Omio remains a private issuer with a much thinner disclosure
              footprint. The biggest diligence blockers are therefore straightforward. Public sources do not show
              revenue by stream, gross margin, CAC, payback, NRR, monthly burn, cash on hand, debt terms, or segment
              profitability. External reviewers also keep repeating a practical caution: Omio is often useful as a
              discovery layer, but travelers sometimes prefer to book direct to avoid fees or intermediary-service
              complexity. That does not break the business model, but it caps confidence in revenue quality until
              management data is opened.
