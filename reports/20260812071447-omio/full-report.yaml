              real consumer usage at scale. Omio Business adds a more targeted adoption path: a UK launch, no-contract
              onboarding, secure payments, VAT invoices, and centralized booking history for small teams. The broader
              implication is that Omio has genuine user reach across both self-serve and partner-assisted channels, even
