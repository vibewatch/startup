            body: >-
              The customer verdict is favorable with caveats. Omio has enough public evidence to show real adoption in
              leisure travel, app distribution, and partner-powered channels. It also has a credible angle into SMB work
              travel through Omio Business, and its partner ecosystem proves that some large brands trust the platform
              with real end-user traffic. What is missing is the depth investors would want for underwriting: segment
              revenue mix, cohort retention, account concentration, customer acquisition cost by segment, and net
              promoter or satisfaction data by channel. That means the customer base is believable, but the revenue
              quality of that base is still partially opaque. The key diligence priority is to convert public proof into
              segment economics—especially around repeat leisure usage, partner dependency, and whether Omio Business
