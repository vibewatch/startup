  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segments, Buyer Roles, and Use Cases
        blocks:
          - type: paragraph
            body: >-
              Omio serves at least four meaningfully different customer groups. The core segment is still the
              self-directed traveler using Omio as a search, comparison, booking, and ticket-management layer across
              modes. In that segment, buyer, user, and payer usually collapse into the same individual or household. A
              second segment consists of travelers entering through partner channels such as Uber, TUI, and easyTrain,
              where Omio is often invisible to the end user but still powers the booking path. A third is the SMB or
              freelancer work-travel user targeted by Omio Business, where the traveler remains the user but the
              employer or budget owner becomes payer. A fourth, lighter segment is the repeat value-seeker addressed by
              Omio Savings Pass and related discounts. The common thread across segments is complexity. Omio wins when
              travelers or partners do not want to stitch together multiple operators, fare rules, currencies, or
              tickets manually. That buyer map is strategically attractive because it spreads demand across leisure,
              partner distribution, and work-travel use cases rather than relying on a single acquisition channel.
            claimRefs:
              - CU001
              - CU002
