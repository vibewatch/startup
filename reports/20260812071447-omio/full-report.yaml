companyProfile:
  summary: >
    Omio is a Berlin-based multimodal travel booking platform founded in 2013 under the GoEuro brand and rebranded to
    Omio in 2019 as the company expanded beyond Europe. The platform combines search, comparison, and booking across
    trains, buses, flights, and ferries, while also supporting partner distribution through Omio B2B, white-label
    integrations, and newer SMB workflow products such as Omio Business. Public sources support meaningful scale signals
    — including 2024 profitability claims, more than $1 billion in ticket sales, and 2026 claims of more than one
    billion annual users — but monetization, retention, and debt-detail disclosure remain materially thinner than the
    operating footprint would imply.
  foundedDate: '2013-01-01'
  foundingLocation: Berlin, Germany
  headquarters: Berlin, Germany
  founders:
    - name: Naren Shaam
      role: Founder & CEO
      background: >-
        Founded GoEuro after struggling to book cross-border European rail travel and still anchors Omio's public
        strategic narrative in 2026.
      claimRefs:
        - CO001
        - CO002
  productSummary: >
    Consumer app and desktop booking platform for multimodal travel, supplemented by partner-distribution tooling (Omio
    B2B), white-label integrations, discovery assets, paid membership, and SMB travel workflow features. The platform's
    core value proposition is reducing fragmentation across rail, bus, ferry, and flight booking rather than owning
    transport supply itself.
  customerFocus: >-
    Leisure travelers, partner-channel users, and small business travel buyers across Europe, North America, Brazil, and
    Southeast Asia.
  businessModel: >
    Hybrid intermediation model combining booking-related fees and commissions from third-party travel providers with
    newer monetization layers in partner distribution, memberships, ancillary products, and SMB travel workflows. Omio's
    value creation depends on aggregating fragmented supply and converting high travel-search intent into bookable
    transactions rather than owning carriers.
  stage: Series E / late-stage private
  fundingStatus: >
