  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Taxonomy
        blocks:
          - type: paragraph
            body: >-
              Omio does not compete in a single neat box. Its direct peers include multimodal and rail-heavy aggregators
              such as Trainline, Rail Europe, and Wanderu; its narrower substitutes include bus specialists like
              CheckMyBus; its adjacent planning substitute is Rome2Rio; and its status-quo competition includes direct
              rail and coach operator sites. That taxonomy matters because it explains why simple “market share”
              comparisons are misleading. Travelers do not always choose between like-for-like competitors. A
              Paris-to-Amsterdam search may pit Omio against Trainline on one trip, against a direct Eurostar or SNCF
              purchase on another, and against Rome2Rio when the traveler is still exploring options. Omio’s proposition
              is strongest when search, mode comparison, and booking need to happen in one place. It is weakest when the
              journey is simple, the operator brand is strong, or the traveler already knows the exact rail or coach
              they want. In other words, competitive analysis has to start from traveler context, not from corporate
              labels. A traveler going from London to Paris may perceive Trainline and Rail Europe as close substitutes,
              while a traveler piecing together ferry, rail, and airport transfer legs may see Omio and Rome2Rio as the
              more relevant choice set.
            claimRefs:
              - CP001
              - CP002
              - CP007
              - CP009
              - CP011
