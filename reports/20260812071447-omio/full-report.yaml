      - number: '1.3'
        title: Funding Path, Investor Base, and Capital Context
        blocks:
          - type: paragraph
            body: >-
              Omio’s financing history shows a company that repeatedly used outside capital to widen supply coverage,
              geography, and eventually group scope. TechCrunch documented a $45 million Goldman-led Series B in 2015, a
              $70 million Series C in 2016 led by Silver Lake Kraftwerk and Kleiner Perkins, and a $150 million 2018
              round from Kinnevik and Temasek that pushed cumulative funding close to $300 million. Later databases add
              an $80 million 2022 round led by Lazard Asset Management, then a December 2024 Hercules Capital debt
              facility and a July 2026 strategic investment from Granite-Integral. The main caution is not whether Omio
              can raise capital; it clearly can. The caution is that public databases disagree materially on cumulative
              funding and classify newer capital differently. Depending on source and inclusion logic, total money
              raised ranges from roughly $459 million to $606 million, while external valuation references cluster
              around $1 billion after the 2024 debt financing. That level of variance is tolerable for a private growth
              company but not precise enough for cap-table-sensitive underwriting without management confirmation.
