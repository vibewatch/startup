  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Risk
        blocks:
          - type: paragraph
            body: >-
              Omio’s legal exposure starts with the fact that it sits between traveler and carrier across multiple
              transport modes and jurisdictions. Its terms say it is an independent intermediary, while carrier terms
              still govern the underlying trip. That structure is standard for a booking platform, but it creates a
              recurring complaint-routing problem whenever a delay, cancellation, refund dispute, or pricing dispute
              occurs. The UK rail market already produced a concrete example: the Office of Rail and Road said Omio was
              among the online ticket retailers whose fee-transparency practices raised consumer-law concerns and later
              confirmed that Omio improved help-page disclosures and incorporated booking fees into the total price
              earlier in the flow. The 2024 Digital Markets, Competition and Consumers Act hardens that standard.
              Privacy risk is also real because Omio publicly says it processes identity, itinerary, government-ID, and
              payment data under GDPR, BDSG, and other laws. Passenger-rights rules for rail, bus, and air preserve
              operator obligations, but the customer still experiences Omio as the frontline brand when something goes
              wrong. Omio’s public product messaging and AI emphasis add a smaller but rising compliance vector as
              automated recommendations and support become more central.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
