      - number: '8.2'
        title: Financing and Valuation Context
        blocks:
          - type: paragraph
            body: >-
              Public valuation context for Omio is anchored by a few strong signals and a much larger set of missing
              details. Coverager and Omio’s own 2024 year-end update confirm a $120 million Hercules debt facility and a
              profitable 2024 with more than $1 billion of ticket sales. PR Newswire’s 2026 release then layers on
              stronger reach claims, including more than one billion annual users and over 100,000 active travelers
              daily. Against that, the revenue base still comes mainly from third-party databases. GetLatka estimates
              $64.5 million of 2025 revenue and $38.1 million in 2024, while Tracxn points to a $1 billion current
              valuation and a different total-funding figure. Those differences are not noise; they are a reminder that
              public valuation work on a late-stage private company is constrained by disclosure quality. The valuation
              discussion therefore has to distinguish clearly between strategic scale, which looks real, and
              monetization depth, which remains only partially observed. That is why the same $1 billion mark can look
              reasonable narratively and still look rich numerically.
            claimRefs:
              - CV007
              - CV008
