  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Pricing Architecture
        blocks:
          - type: paragraph
            body: >-
              Omio’s own terms make clear that the platform is not simply a media/search front end. It identifies,
              compares, and intermediates travel services, offers direct booking for most offerings, charges service
              fees for Omio services, and also receives commission from third-party providers. That matters because
              Omio’s revenue model is hybrid by construction: part customer-paid convenience fee, part supplier-paid
              distribution commission, and part newer ancillary or partner-distribution monetization. The pricing layer
              is intentionally opaque. Omio does not publish a universal fee card for consumer bookings, and realized
              take rates almost certainly vary by operator, route, refundability, and geography. Public materials do,
              however, show monetization deepening in 2025 to 2026. Omio Flex created a paid flexibility product that
              lets customers cancel for any reason within defined windows, while the 2026 strategy release added Omio
              Pass, a 90-day membership product offering 10 percent discounts, and the B2B announcements show
              white-label/API revenue expanding alongside the consumer app. Financially, this is healthier than relying
              on a single booking fee, but it also means investors need a clean revenue bridge by stream before they can
              judge mix quality.
