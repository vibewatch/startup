      - number: '1.2'
        title: Leadership, Executive Visibility, and Key-Person Dependence
        blocks:
          - type: paragraph
            body: >-
              Naren Shaam still dominates Omio’s public identity in 2026. He appears as founder and CEO across corporate
              pages and external interviews, and he remains the lead voice on product direction, international
              expansion, and post-COVID operating strategy. Publicly fetchable sources also surface an executive bench
              that includes finance, product, technology, and marketing leaders, but those disclosures are thinner than
              what investors would typically expect from a late-stage private company. RocketReach excerpts identify
              Tomas Vocetka as CTO, Ashish Chatterjee as Chief Product Officer, and Facundo Viguie Aleman as CMO, while
              Seedtable and corporate materials also point to Jean-Bernard Moens as CFO. What is missing is equally
              important: official fetchable materials did not provide a clean, authoritative board roster, committee
              structure, or succession framing. For a company that has raised hundreds of millions and is executing
              debt-funded expansion and M&A, this governance opacity increases diligence burden and heightens dependence
              on Shaam as the central decision-maker and external spokesperson.
            claimRefs:
              - CO014
              - CO015
              - CO040
