      - number: '4.4'
        title: Capital Adequacy and Financing Dependence
        blocks:
          - type: paragraph
            body: >-
              Omio’s capital structure looks good enough to fund expansion, but not transparent enough to model
              comfortably. The strongest official financing fact is the $120 million Hercules Capital facility announced
              alongside the year-end profitability message in December 2024. Management tied that capital directly to
              future growth, especially Southeast Asia expansion, which implies a deliberate willingness to use debt
              once the business had recovered from the pandemic shock. The challenge is that market databases disagree
              materially about lifetime funding: Tracxn shows roughly $486 million, Seedtable roughly $459 million,
              GetLatka roughly $596 million, and InforCapital roughly $606 million. That spread is too wide to ignore
              and probably reflects different treatment of debt, secondary capital, and later strategic rounds.
              Operationally, Omio is also adding new obligations as it broadens the platform: Omio Flex means potential
              refund payouts; white-label growth means more integration and support work; and geographic expansion means
              more compliance and localization cost. Profitability reduces near-term stress, but without cash, burn,
              covenant, or maturity detail, investors still cannot prove runway from public information alone.
