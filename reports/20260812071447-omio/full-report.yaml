      - number: '3.3'
        title: Pricing, Switching Costs, and Moat Durability
        blocks:
          - type: paragraph
            body: >-
              Competitive durability in this category is not driven by exclusivity in the software sense. Consumers can
              multi-home across apps with very low friction, which means switching costs are thin and the product has to
              win repeatedly on route coverage, price confidence, and after-sales support. The ORR’s 2025
              fee-transparency review is important because it shows that pricing trust is a sector problem touching
              Omio, Trainline, and Rail Europe alike. No player in the fetched record publishes a simple, normalized fee
              table that makes competitive comparison trivial. That reinforces two conclusions. First, a better workflow
              can still justify use of an intermediary even when direct booking exists. Second, trust can erode quickly
              if added fees or refund handling feel opaque. Omio’s strongest moat claims therefore sit in supply
              breadth, multimodal search, and its group portfolio. Its weakest moat claims sit in lock-in, exclusivity,
              and the ability to prevent travelers from defecting to direct channels or rail specialists when trips
              become simpler. This also means that competitive readiness cannot be measured only by current user counts
              or route coverage. The decisive variable is whether the platform reduces enough planning and disruption
              pain that users come back even when the same seat can be bought elsewhere. If that habit does not form,
              supply breadth becomes a feature rather than a moat.
            claimRefs:
              - CP020
              - CP021
              - CP022
              - CP023
              - CP024
              - CP028
