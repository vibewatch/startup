              - CR020
              - CR021
              - CR022
      - number: '7.3'
        title: Partner and Dependency Risk
        blocks:
          - type: paragraph
            body: >-
              Omio’s moat and its fragility both come from the same place: third-party supply and distribution. The
              company does not own transport inventory, so availability, fulfillment quality, and many disruption
              outcomes remain downstream of carriers and travel providers. At the same time, the growth narrative now
              extends beyond direct B2C traffic. Uber, TUI, easyTrain, Omio B2B, and Omio Business all show that Omio is
              becoming a distribution and workflow layer for other brands and use cases. That is strategically
              attractive because it diversifies beyond one consumer app funnel. It also means Omio is exposed to partner
              attach rates, API uptime, commercial renewals, and the priorities of brands that own the customer
              relationship. A white-label deployment can disappear from the public surface faster than a direct consumer
              brand can. Public materials do not quantify concentration by carrier, by partner, or by account, so
              investors cannot tell whether a single rail operator, major channel partner, or geography carries
              disproportionate revenue weight. The operating model likely needs these partnerships to widen inventory
              and monetization, but the dependence is not yet matched by public concentration disclosure.
            claimRefs:
              - CR023
