chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Product Model, and Brand Evolution
        blocks:
          - type: paragraph
            body: >-
              Omio is a Berlin-headquartered multimodal travel search and booking platform that began as GoEuro in 2013.
              The founding thesis was practical rather than speculative: Naren Shaam struggled to book an intercity rail
              trip during a 2010 backpacking journey and concluded that European transport remained digitally fragmented
              even as urban mobility and e-commerce had become app-native. The company now positions itself as a unified
              interface for trains, buses, flights, ferries, and selected transfer inventory, with a mix of metasearch
              and direct booking behavior depending on provider integration. That hybrid model is important for
              diligence because it makes Omio neither a pure OTA nor a pure discovery layer; its value comes from
              stitching together fragmented inventory and keeping users inside one itinerary flow. The 2019 rebrand from
              GoEuro to Omio was not cosmetic. Management explicitly tied it to global ambitions beyond Europe, arguing
              that a less region-bound brand was necessary to expand supply, languages, and consumer relevance across
              international markets.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO007
              - CO008
          - type: figure
            figureRef: FO002
            claimRefs:
              - CO003
              - CO004
