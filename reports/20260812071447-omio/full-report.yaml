  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The recommendation chain runs from real strategic proof through public-comp mismatch to a valuation-cautious final
      stance.
    data:
      nodes:
        - id: n1
          label: Real multimodal platform
          description: Consumer app, partner distribution, SMB and B2B surfaces are all publicly visible
        - id: n2
          label: 2024 profitability and scale signal
          description: Company claimed profitability, $1B+ ticket sales, and continued expansion
        - id: n3
          label: Sparse audited disclosure
          description: Revenue, debt, retention, and concentration remain partially estimated
        - id: n4
          label: Public comp gap
          description: Implied 15.5x revenue sits far above 0.3x-6.0x public band
        - id: n5
          label: Price-sensitive risk/reward
          description: Strategic upside exists, but current entry leaves limited margin for error
        - id: n6
          label: TRACK / RESEARCH MORE
          description: Require lower price or better diligence evidence before upgrading
      edges:
        - from: n1
          to: n5
        - from: n2
          to: n5
        - from: n3
          to: n5
        - from: n4
          to: n5
        - from: n5
          to: n6
