  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Recommendation and Thesis Framing
        blocks:
          - type: paragraph
            body: >-
              The most defensible present-tense call on Omio is TRACK / RESEARCH MORE, not because the company lacks
              strategic merit, but because the public evidence set is too thin for a clean positive recommendation at
              the current valuation reference. Omio clearly has real assets: multimodal inventory across rail, bus,
              flight, and ferry; embedded distribution through partner channels; SMB expansion through Omio Business;
              and a cross-platform discovery-to-booking story. That matters. So does the 2024 profitability claim. But
              valuation is not a generic quality score. It is a price-sensitive judgment. At roughly $1 billion,
              investors are being asked to pay a multiple that sits far above relevant public travel-tech comparables
              while still accepting third-party revenue estimates, incomplete debt disclosure, and unresolved
              customer-support and concentration questions. That combination argues for a balanced stance: strategically
              positive, valuation cautious, and highly sensitive to either a lower entry price or much better diligence
              data. This is the classic case where company quality can be real while entry discipline still matters more
              than enthusiasm.
            claimRefs:
              - CV001
