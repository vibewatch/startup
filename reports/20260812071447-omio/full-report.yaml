            title: Satisfaction is visible, retention is not
            body: >-
              Ratings and review snapshots are strong enough to show many users are happy, but investors still need
              cohort, repeat-use, and NPS evidence by segment.
            calloutType: insight
            claimRefs:
              - CU023
              - CU024
