      - number: '4.3'
        title: Unit Economics and Cost Structure
        blocks:
          - type: paragraph
            body: >-
              Omio’s public unit-economics picture is mostly inferential. The business is clearly asset-light in the
              traditional capex sense: the platform does not own trains, buses, aircraft, or lodging inventory. Instead,
              the principal cost buckets appear to be partner integration, payment processing, customer support, refunds
              and cancellations, engineering, and traffic acquisition. The terms of use show Omio sitting in the booking
              flow and taking both service fees and provider commissions, while the fee transparency intervention from
              the UK Office of Rail and Road shows how sensitive this model is to the presentation of fees in checkout.
              Omio Flex likely improves monetization and conversion on some bookings, but it also introduces
              claims-handling and refund obligations that can offset part of the margin benefit. A crude public
              take-rate proxy using GetLatka’s $64.5 million 2025 revenue estimate against the company’s
              more-than-$1-billion 2024 ticket-sales disclosure lands around six percent or a bit higher, which is
              plausible for a multimodal distributor but too rough to treat as a true net-take rate. Without gross
              margin, CAC, payback, NRR, or cohort data, the unit-economics debate remains open.
