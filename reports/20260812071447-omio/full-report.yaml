            body: >-
              Omio’s current public scale disclosures are strong on traffic and network breadth but weaker on reconciled
              financials and headcount. The most recent official materials describe 46-country coverage, 3,000-plus
              supply partners, more than one billion annual users, and over 100,000 active travelers daily. December
              2024 materials add 900 million annual visitors, more than one billion journey searches, 80,000 tickets
              sold per day, and EBITDA profitability. The same disclosure family also says the group surpassed $1
              billion in ticket sales in 2024. By contrast, the consumer about page still references a 300-person team
              with older office geography, while newer group pages refer to 400-plus or 430-plus employees and an
              expanded office map. Omio’s structure has also broadened: beyond the flagship consumer app, the group now
              emphasizes Omio B2B, Rome2Rio, and Omio Business. That multi-brand architecture supports multiple
              distribution routes, but it also means investors should insist on segment-level reporting rather than
              treating all traffic, tickets, and users as interchangeable proof of one homogeneous business.
