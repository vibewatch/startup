      - number: '3.2'
        title: Capability, Distribution, and Segment Comparison
        blocks:
          - type: paragraph
            body: >-
              The direct comparison with Trainline is the clearest strategic benchmark. Trainline brings public-company
              scale, a 27 million active customer base, and distribution strength as Europe’s most downloaded rail app,
              but its public surface remains train-and-bus centric. Omio counters with broader modal coverage and a
              wider group architecture that includes Rome2Rio, Omio B2B, and Omio Business. Rail Europe is a specialist
              rather than a full-stack multimodal peer: it is likely to win where train depth, pass familiarity, and
              rail-only trust matter most. Wanderu sits between those poles with large bus and train route counts and a
              strong compare-book promise, while CheckMyBus is bus-led and therefore narrower. The key consequence is
              that Omio’s competitive win condition is breadth with acceptable trust: it must be wide enough to justify
              one-stop planning, without becoming so generic that specialists or direct operators win on clarity or
              confidence. Another way to read the field is that every competitor concentrates on a different shortcut
              for the traveler: Trainline on rail app habit, Rail Europe on rail confidence, Wanderu on route inventory
              and compare-book convenience, and Rome2Rio on inspiration plus planning. Omio’s burden is to make breadth
              feel simpler rather than heavier.
