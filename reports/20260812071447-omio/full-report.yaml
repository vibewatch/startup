      - number: '4.2'
        title: Traction, Volume, and Public Revenue Signals
        blocks:
          - type: paragraph
            body: >-
              The strongest public financial evidence around Omio is operating scale rather than GAAP-style revenue. In
              December 2024 the company said it had become EBITDA profitable, grown the app by 30 percent year over
              year, surpassed $1 billion in ticket sales, and reached 900 million annual visitors, more than one billion
              journey searches, and 80,000 tickets sold daily. The March 2026 strategy release then raised the
              operational framing again, describing more than one billion annual users, over 100,000 active travellers
              daily, 46-country coverage, and more than 430 employees. The only explicit public revenue estimate found
              in fetched sources came from GetLatka, which pegged 2025 revenue at $64.5 million ARR, up from $38.1
              million in 2024. That estimate is useful as a lower-resolution anchor, but it is not management-filed
              data. The main analytical implication is that Omio discloses plenty of volume proxies but little
              recognized-revenue detail. Investors can see throughput and user activity, yet cannot tell how much of
              that activity is net revenue, pass-through ticket value, or low-margin partner economics. That gap is the
              central financial tension of the company.
            claimRefs:
              - CI005
