              anchors the stack, but public materials also describe Rome2Rio as the discovery surface, Omio B2B as the
              partner-distribution layer, and Omio Business as a work-travel workflow for SMBs. The app-store listings
              show the consumer product is dense with features: multimodal search across trains, buses, flights, and
              ferries; mobile ticketing; real-time updates; multiple payment methods; and multilingual, multicurrency
              support. Corporate sources broaden that further with 47-country coverage, 3,000-plus providers, Omio
              Savings Pass, and business-travel extensions. The product implication is positive. Omio is not betting on
              one thin comparison screen; it is building multiple surfaces around the same inventory and booking
              backbone. The caution is that public product descriptions are not fully harmonized. Consumer app listings
              still mention 45-plus countries and 2,000 providers while corporate pages cite 47 countries and 3,000-plus
