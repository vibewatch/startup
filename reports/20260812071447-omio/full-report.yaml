      - number: '2.4'
        title: Regulation, Rail Structure, and Strategic Implication
        blocks:
          - type: paragraph
            body: >-
              European rail policy has long aimed to make the market more competitive through competition,
              interoperability, safety standards, and infrastructure investment. That policy backdrop is fundamentally
              supportive for a company like Omio because more open, interoperable rail systems produce more digital
              inventory and cross-border demand. But regulatory intent is not the same as platform-ready execution. Even
              in 2026, both industry media and trade bodies still frame booking fragmentation as unresolved. That
              matters for valuation because it creates a two-sided outcome. If the passenger package and related
              data-sharing reforms genuinely improve multi-operator ticketing and passenger-rights protection, Omio
              benefits from a larger and easier-to-convert market. If reform remains partial, Omio still benefits from
              fragmentation-driven demand, but it must continue carrying the product and customer-service complexity
              that regulators failed to simplify. The net effect is that the market remains attractive, but investors
              should underwrite it as a structurally messy category where regulatory progress improves upside more than
              it removes the need for execution excellence.
            claimRefs:
              - CM022
              - CM023
              - CM024
              - CM025
              - CM026
              - CM027
              - CM034
              - CM035
