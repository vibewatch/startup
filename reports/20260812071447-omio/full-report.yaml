figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    layout: wide
    summary: >-
      Omio’s path runs from a Europe-focused search tool to a broader multimodal platform using brand expansion, M&A,
      and new regional capital to extend scope.
    data:
      items:
        - date: '2010'
          label: Founder pain point identified
          detail: Naren Shaam struggles to buy a cross-border ticket in Europe.
        - date: '2013'
          label: GoEuro launches
          detail: Berlin-based multimodal travel search begins operations.
        - date: 2015-12
          label: Series B
          detail: $45M led by Goldman Sachs.
        - date: 2016-10
          label: Series C
          detail: $70M led by Silver Lake Kraftwerk and Kleiner Perkins.
        - date: 2018-10
