      - number: '7.5'
        title: Mitigations, Monitoring, and Kill Criteria
        blocks:
          - type: paragraph
            body: >-
              Omio does have visible mitigations. The ORR process ended with concrete fee-display changes rather than
              open enforcement. The company has diversified from direct consumer bookings into B2B, white-label, SMB,
              and membership products. It also reached profitability in 2024 before layering on the Hercules facility,
              which is a better setup than using debt to fund a still-unproven recovery. Those are meaningful positives.
              But the unresolved diligence questions are still substantial: partner concentration, customer-support SLA
              performance, chargeback and fraud rates, debt covenants, and retention economics by channel are all
              missing from fetched sources. That means the right underwriting posture is not to assume hidden failure,
              but to define clear triggers for re-rating risk. A new fee-transparency dispute, a disclosed privacy
              incident, a top-partner loss, or a support-quality collapse would all transmit quickly into trust and
              conversion. Likewise, a refinancing problem or evidence that Omio Business and B2B are absorbing
              disproportionate support cost would weaken the diversification thesis. The company can be investable with
              these risks, but only if those triggers are monitored explicitly and the information gaps are closed
              during diligence.
            claimRefs:
