- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Fee-transparency compliance
    - Regulatory or complaint resurfacing
    - New ORR/CMA action or a major fee-disclosure rollback
    - Pause underwriting until remediation evidence is provided
  - - Support / refund trust erosion
    - Public review deterioration
    - Trustpilot falls below 3.8 or refund-cycle complaints become a persistent leading complaint theme
    - Cut conviction; request SLA and dispute data before proceeding
  - - Partner concentration shock
    - Major partner loss or inventory contraction
    - Loss of a top branded channel or a material carrier set
    - Re-underwrite channel economics and concentration immediately
  - - Debt / liquidity stress
    - Refinancing or covenant strain
    - Need for emergency capital or covenant amendment before clear growth inflection
    - Move to negative valuation stance until terms are understood
  - - Execution overload
    - Diversification without proof of economics
    - B2B/SMB launches grow but segment retention or monetization remains undisclosed after 2-3 quarters
    - Treat diversification as complexity, not moat, until metrics are shown
  notes: These triggers are designed to convert Omio’s information gaps into explicit monitoring tests rather than vague caution.
