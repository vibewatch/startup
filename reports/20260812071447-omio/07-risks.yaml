    - ORR already required Omio changes and new law hardens earlier total-price disclosure
    - Medium
    - High
    - Fees now shown earlier and help pages improved
    - Relapse risk if UX or fees change again
    - Request UK compliance owner, monitoring cadence, and complaint trend by fee issue
  - - Privacy / personal-data breach
    - EU / UK / multi-jurisdiction privacy law
    - Omio publicly processes travel, ID, contact, and payment-related data at scale
    - Medium
    - High
    - Published privacy policy, multi-entity operating structure, lawful-basis framing
    - No public audit scope, incident log, or board reporting disclosed
    - Request DPO reporting line, incident history, and security audit coverage
  - - Passenger-rights misrouting
    - Rail, bus, and air passenger-rights regimes
    - Carrier obligations remain primary but customers often experience Omio as the booking brand
    - High
    - Medium-High
    - Terms explain intermediary role and provider terms
    - Refund and delay disputes can still hit trust and support cost
    - Request dispute-resolution workflow and refund turnaround by mode
  - - AI / recommendation compliance
    - EU AI Act and evolving consumer-information standards
    - Omio is publicly emphasizing product innovation and AI-enabled experiences
    - Low-Medium
    - Medium
    - Current AI scope appears narrow and mostly assistive
    - Future ranking, support, or personalization features may need tighter governance
    - Request AI feature inventory, model providers, and compliance review process
