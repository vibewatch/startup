company:
  name: Omio
chapter:
  number: 7
  title: Risks
  summary: 'Omio’s risk profile is centered on trust, regulation, and partner dependence rather than heavy fixed assets. The strongest public risk evidence is concrete: the UK rail regulator pushed Omio to improve fee transparency; Omio’s own terms emphasize its intermediary status and non-refundable service fees; review sources continue to flag refund and support friction; and the 2024 Hercules debt facility added capital flexibility without disclosing covenant detail. Diversification into B2B, white-label, SMB travel, and memberships helps, but it also raises execution load and widens the surface for compliance, service, and channel-concentration failures.'
sections:
- id: regulatory-and-legal-risk
  title: Regulatory and Legal Risk
  body: 'Omio’s legal exposure starts with the fact that it sits between traveler and carrier across multiple transport modes and jurisdictions. Its terms say it is an independent intermediary, while carrier terms still govern the underlying trip. That structure is standard for a booking platform, but it creates a recurring complaint-routing problem whenever a delay, cancellation, refund dispute, or pricing dispute occurs. The UK rail market already produced a concrete example: the Office of Rail and Road said Omio was among the online ticket retailers whose fee-transparency practices raised consumer-law concerns and later confirmed that Omio improved help-page disclosures and incorporated booking fees into the total price earlier in the flow. The 2024 Digital Markets, Competition and Consumers Act hardens that standard. Privacy risk is also real because Omio publicly says it processes identity, itinerary, government-ID, and payment data under GDPR, BDSG, and other laws. Passenger-rights
    rules for rail, bus, and air preserve operator obligations, but the customer still experiences Omio as the frontline brand when something goes wrong. Omio’s public product messaging and AI emphasis add a smaller but rising compliance vector as automated recommendations and support become more central.'
  claimRefs:
