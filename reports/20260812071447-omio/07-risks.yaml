- id: operational-quality-and-support-risk
  title: Operational, Quality, and Support Risk
  body: 'Operationally, Omio looks stronger at discovery and booking than at exception handling. The app-store evidence is favorable: iOS and Android storefronts signal broad usage and high ratings. But the independent review layer is materially noisier. Trustpilot is positive on balance yet clearly below app-store ratings, and JustUseApp surfaces repeated complaints around refund timing, support responsiveness, and booking changes. Omio’s own terms reveal why this risk persists. Some tickets can take up to 24–48 hours to issue because provider processes are still manual. Service fees may be non-refundable even when a traveler experiences friction. Additional provider fees can apply. These are manageable mechanics during normal travel periods, but they become brand-damaging when disruptions rise, customers need fast answers, or a multimodal trip spans several carriers. Omio is not an asset-heavy operator, so its operational downside is less about plants and equipment and more about customer-trust
    erosion, refund workload spikes, data-handling mistakes, payments operations, and resolution quality under stress. That also means small compliance or service defects can scale quickly across a large booking base.'
  claimRefs:
  - CR014
  - CR015
  - CR016
