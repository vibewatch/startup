chapter:
  number: 2
  title: Market Analysis
  summary: 'Omio addresses a structurally attractive but messy market: European intercity multimodal travel distribution. Demand for online booking is already mainstream, yet supply fragmentation, refund complexity, and partial regulation keep the category difficult enough that Omio’s execution quality matters more than top-down TAM rhetoric.'
sections:
- id: market-boundary-and-sizing
  title: Market Boundary and Sizing Lenses
  body: 'Omio sits in a specific slice of travel commerce: digital intercity trip discovery and booking across multiple transport modes. That matters because the broadest travel-market numbers overstate its immediate revenue opportunity, while rail-only figures understate the breadth of its consumer use case. The most relevant top-down lens is the European online travel market, where Research and Markets puts 2026 spend at $112.8 billion and IMARC puts 2025 spend at $156.8 billion. A broader booking-industry lens cited by Worldmetrics reaches $320 billion by 2027, but that figure likely sweeps in more of the total booking stack than Omio directly serves. On the narrow end, Omio’s own Rail Europe deal materials point to a global rail market of more than $300 billion by 2032, reminding investors that rail alone is large but still only one component of Omio’s multimodal thesis. The practical conclusion is that Omio’s real serviceable market is broader than rail-only digital distribution but
    narrower than all online travel because it is not fundamentally a lodging-led OTA.'
