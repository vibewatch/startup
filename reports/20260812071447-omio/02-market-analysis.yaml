- id: growth-drivers-and-constraints
  title: Growth Drivers and Constraints
  body: 'The demand side is favorable. Official and industry sources point to mobile-first booking, sustained travel recovery, and growing interest in seamless and sustainable multimodal journeys. The 2025 Commission survey found that 76 percent of respondents already use online booking services, while IMARC and Research and Markets both highlight digital, mobile, and personalization trends as core growth drivers. Yet the same sources explain why this market remains structurally difficult. Thirty-six percent of surveyed Europeans still struggle to book combined-mode journeys, 31 percent avoid them because the process is too complex, and direct-industry critics argue that the 2026 passenger package still falls short of genuine multimodal interoperability. Fragmented operator systems, uneven data quality, traffic-acquisition inflation, and ambiguous refund handling remain real drags on conversion. In practice, this means the market can grow while still punishing weak execution: the same complexity
    that creates Omio’s value proposition also creates the operational burden that can destroy margin and trust if the product experience is poor.'
