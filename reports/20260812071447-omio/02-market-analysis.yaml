  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: omio-specific-sam-som
    missingEvidence: A management-backed view of Omio’s serviceable market and actual mode-by-geography revenue mix.
    whyItMatters: Public market reports size broad categories, but investors need to know what portion Omio can realistically monetize given its current supply and take-rate model.
    diligencePath: Request internal market maps, GMV by mode and geography, and management assumptions for serviceable market capture.
    relatedQuestionRefs:
    - QM021
    - QM026
  - type: conflicting-data
    severity: material
    topic: publisher-sizing-variance
