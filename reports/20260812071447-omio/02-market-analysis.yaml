- id: buyers-and-adoption-path
  title: Buyers, Users, and Adoption Path
  body: The primary Omio user is still the self-directed leisure traveler trying to compare cross-border or multi-leg options without visiting multiple operator sites. In that use case, buyer and user usually collapse into one person, while the household budget is the payer. Omio Business introduces an adjacent segment in which the traveler remains the user but the business or freelancer budget becomes the payer, creating a more structured workflow and a more enterprise-like purchase trigger. The common adoption trigger across segments is not brand affinity with an aggregator; it is complexity. Consumers choose a multimodal platform when itineraries span operators, currencies, stations, or modes, and when direct-booking search costs are high. Europe’s continued travel growth and Japan’s surge as a long-haul source market reinforce demand for digital trip composition tools, but the structural need for Omio comes from simplifying fragmented supply, not merely reselling generic travel inventory.
    That is why Omio’s proposition can extend to the U.S., Japan, and Southeast Asia when those markets exhibit similar fragmentation.
