- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Evidence
  - Counterpoint
  - What would change the view
  rows:
  - - Multimodal platform breadth is real
    - Omio, Rome2Rio, B2B, SMB, and partner distribution are all publicly visible
    - Breadth can also mean complexity before monetization is proven
    - Segment-level gross margin and retention data
  - - 2024 profitability could be an inflection point
    - Company said it reached profitability and passed $1B in ticket sales
    - Profitability is company-claimed; persistence is unverified publicly
    - Two years of verified profitability and cash generation
  - - Partner channels expand monetization beyond the app
    - Uber, TUI, and easyTrain show real external deployment
    - Channel ownership often sits with the partner, not Omio
    - Partner renewal, attach-rate, and concentration disclosure
  - - Current mark already discounts much of the upside
    - Implied 15.5x revenue multiple is well above public comp band
    - Private growth optionality can justify some premium
    - Evidence that Omio can grow into the mark within 12-24 months
  - - Disclosure quality is the real valuation limiter
    - Core revenue inputs come from third-party databases
    - Private investors may still access better information directly
    - Data-room confirmation of revenue, debt, and customer economics
  notes: The anti-thesis is mainly valuation and disclosure driven, not an argument that Omio lacks product-market reality.
