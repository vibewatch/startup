company:
  name: Omio
chapter:
  number: 8
  title: Valuation
  summary: 'Omio is strategically credible but hard to underwrite at a roughly $1 billion private mark using public evidence alone. The company’s own disclosures support strong scale signals, growing channel breadth, and a 2024 profitability milestone, while third-party databases imply 2025 revenue of only about $64.5 million. That creates an implied revenue multiple of roughly 15.5x — or more than 26x on the 2024 estimate — far above a public travel-tech comp set that ranges from about 0.3x to 6.0x revenue. The right conclusion is not that Omio is weak; it is that the current mark already prices in substantial execution success. Recommendation: TRACK / RESEARCH MORE, with a full-to-rich valuation stance unless direct diligence materially improves revenue-quality, retention, and debt-transparency evidence.'
sections:
- id: investment-recommendation-and-thesis
  title: Investment Recommendation and Thesis Framing
  body: 'The most defensible present-tense call on Omio is TRACK / RESEARCH MORE, not because the company lacks strategic merit, but because the public evidence set is too thin for a clean positive recommendation at the current valuation reference. Omio clearly has real assets: multimodal inventory across rail, bus, flight, and ferry; embedded distribution through partner channels; SMB expansion through Omio Business; and a cross-platform discovery-to-booking story. That matters. So does the 2024 profitability claim. But valuation is not a generic quality score. It is a price-sensitive judgment. At roughly $1 billion, investors are being asked to pay a multiple that sits far above relevant public travel-tech comparables while still accepting third-party revenue estimates, incomplete debt disclosure, and unresolved customer-support and concentration questions. That combination argues for a balanced stance: strategically positive, valuation cautious, and highly sensitive to either a lower
    entry price or much better diligence data. This is the classic case where company quality can be real while entry discipline still matters more than enthusiasm.'
