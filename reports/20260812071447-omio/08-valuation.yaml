- id: comparable-valuation-analysis
  title: Comparable Valuation Analysis
  body: 'The public comparable set is imperfect, but it is still informative. Trainline is the closest public marketplace-style travel booking comparison in Europe, even if it is narrower in modal scope. Amadeus is much larger and more infrastructure-like. Booking is more global and much more profitable. Sabre and eDreams frame the lower-quality end of public travel-tech. Even with those caveats, the comp message is consistent: Omio’s implied private multiple is high. On GetLatka’s 2025 estimate, Omio sits at about 15.5x revenue. Trainline trades around 1.9x, Amadeus about 3.6x, Booking about 6.0x, eDreams about 0.8x, and Sabre about 0.3x. Booking is the richest of the public set and still sits far below Omio’s implied multiple. That does not prove Omio is overvalued in an absolute sense — private companies can command premia for growth and scarcity — but it does mean the burden of proof is on Omio to show superior revenue growth, economics, and defensibility. Public comps do not support
    treating the current mark as obviously cheap.'
