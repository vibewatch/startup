- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Valuation range
  - Core assumptions
  - Probability signal
  - Key risk
  rows:
  - - Bull
    - $0.95B-$1.25B
    - Revenue scales materially above current third-party estimates; 2024 profitability proves durable; partner and SMB diversification work
    - Possible but requires direct diligence confirmation
    - Current price already sits near this range
  - - Base
    - $0.60B-$0.85B
    - Omio remains strategically relevant and growing, but still trades below current mark until disclosure and economics improve
    - Most defensible from public evidence
    - Premium compresses without hard KPI disclosure
  - - Bear
    - $0.35B-$0.55B
    - Public-comp gravity dominates; support/regulatory friction or partner issues persist; debt opacity worries investors
    - Plausible if trust or financing narrative weakens
    - Valuation reset without business failure
  - - Upgrade trigger
    - '>$1.0B support sustained'
    - Verified >$100M annual revenue plus clean debt and retention disclosure
    - Needs direct diligence
    - Otherwise story stays ahead of proof
  - - Downgrade trigger
    - <$0.50B warranted
    - Evidence of partner loss, renewed pricing scrutiny, or fading profitability
    - Can happen quickly in private rounds
    - Thin monetization leaves little room for trust shocks
  notes: Ranges are heuristic enterprise/equity value references based on public evidence, not DCF outputs. They are designed to test price discipline.
