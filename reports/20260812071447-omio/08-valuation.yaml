- id: bull-base-and-bear-scenarios
  title: Bull, Base, and Bear Scenarios
  body: 'Scenario analysis helps separate what Omio is from what today’s price appears to assume. In a bull case, Omio proves that the 2024 profitability milestone is durable, that partner-distribution and SMB products deepen monetization, and that revenue growth scales well beyond the current third-party estimates. Under that path, a valuation above $1 billion can be defended and even expanded. The base case is less exciting but more realistic from public evidence: Omio keeps growing, retains strategic relevance, and deserves a healthy premium to public marketplaces, yet still trades below the current mark until disclosure improves. The bear case is not a collapse case. It is a re-rating case in which public-market gravity, support friction, or partner/debt uncertainty compresses the premium. The critical insight is that current pricing is already closer to the bull end of a defensible range than to the center of it. That makes price discipline, liquidation preference, and access to private
    diligence materials central to any fresh investment decision.'
