- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold / event
  - Transmission to thesis
  - Action implication
  rows:
  - - Valuation unsupported by verified metrics
    - Data room fails to support >$100M revenue path or durable profitability
    - Current premium loses credibility
    - Do not invest at current price
  - - Fee / conduct issue returns
    - Fresh ORR or similar consumer-law action
    - Trust and conversion thesis weakens
    - Reduce fair value range immediately
  - - Partner concentration shock
    - Loss of a major branded channel or meaningful carrier access
    - Diversification thesis reverses into dependence risk
    - Re-underwrite revenue durability
  - - Debt stress appears
    - Covenant amendment, short maturity, or refinancing dependence disclosed
    - Flexibility premium disappears
    - Move to clearly negative valuation stance
  - - Support quality deteriorates
    - Independent review trend worsens materially or SLA data shows backlog
    - Thin monetization absorbs higher service cost
    - Lower multiple and delay entry
  notes: These are concrete monitorable conditions intended to prevent narrative momentum from overriding valuation discipline.
  claimRefs:
  - CV031
  - CV032
  - CV039
  - CV040
  - CV041
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Revenue quality
    - Segment revenue, gross margin, repeat-booking mix, and partner take rate
    - Determines whether Omio can grow into the current mark
    - Management data room / CFO session
  - - Debt facility
    - Covenants, maturity, pricing, and permitted uses
    - Changes downside risk and entry protection needs
    - Treasury / lender summary
  - - Partner concentration
    - Top carriers, top channels, and renewal exposure
    - Key to understanding whether distribution breadth is real or concentrated
    - Commercial leadership disclosure
  - - Support operations
    - Refund cycle time, first-response SLA, chargeback and fraud rates
    - Thin-marketplace monetization can be overwhelmed by service costs
    - Ops and customer experience review
  - - Retention by channel
    - Direct B2C, B2B, white-label, and SMB cohort performance
    - Validates whether diversification is compounding or merely adding complexity
    - Analytics / board dashboard
  - - Exit preparedness
    - Board posture on IPO, M&A, and timing
    - Affects return horizon and private-market liquidity assumptions
    - CEO / board discussion
  notes: These are the gating asks most likely to move the recommendation or the price an investor should be willing to pay.
