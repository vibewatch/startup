- id: diligence-asks-and-thesis-breaks
  title: Diligence Asks, Exit Readiness, and Thesis-Break Criteria
  body: 'The final underwriting hurdle is not imagination; it is verification. Omio has enough evidence to warrant serious attention, but not enough to close the diligence loop at the current price from public sources alone. Investors need a cleaner view of segment revenue, partner concentration, retention by channel, support and refund metrics, and the actual Hercules covenant package. Those asks matter because Omio’s monetization layer appears thin relative to its traffic and ticket-sales scale, so small changes in support cost, partner economics, or compliance burden can have outsized effects on equity value. Exit-readiness also remains more speculative than explicit. A strategic sale to a larger OTA, travel-tech platform, or mobility stack is conceivable, but there is no fetched sign of near-term IPO preparation. The most important thesis-break criteria are therefore operational and financial: if trust, concentration, or debt-flexibility assumptions deteriorate, the multiple should reset
    quickly. Until those gaps are closed, entry discipline should remain stricter than the story alone might tempt investors to be.'
