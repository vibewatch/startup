summary:
  headline: |
    Omio 是战略上可信的多式联运出行平台，但按公开证据看，当前约 $1B 估值偏高：它对应的收入倍数远高于上市 travel-tech 可比公司，却缺少同等深度的收入质量、留存、集中度和债务条款披露。
  overallScore: 5.9
  recommendation: research-more
