  topStrengths:
    - 覆盖火车、巴士、航班和渡轮，少见的多式联运广度；白标和合作伙伴渠道也证明了核心 App 之外的分发能力。
    - 2024 年盈利说法和 >$1B 票务销售里程碑显示，疫情恢复期后，公司可能终于跑出真实经营杠杆。
    - 公开证据支持其在需求和库存侧已有可观规模：3,000+ 合作伙伴、46-47 个国家，以及较大的年用户数和日旅客数。
    - Omio B2B、Omio Business 和品牌合作伙伴关系拓展渠道，给直接消费者预订之外增加了上行可选性。
    - 一线投资人和贷款方支持，意味着尽管旅游市场波动，Omio 仍能获得战略资本。
  topRisks:
    - 当前约 $1B 私募估值对应约 15.5x 2025 年估计收入、>26x 2024 年估计收入，远高于本文采用的 0.3x-6.0x 上市可比区间。
    - 债务增加了融资弹性，但公开来源没有披露 Hercules 融资的契约条款、到期日、定价或下行触发条件。
    - 客户信任并不干净：ORR 对费用透明度的介入，以及评论网站上反复出现的退款和客服投诉，仍然重要。
    - Omio 不拥有交通库存，公开来源也没有量化承运商或合作伙伴集中度，因此合作伙伴和供给依赖仍然实质性。
    - 收入、员工数、累计融资等核心估值输入，仍高度依赖第三方数据库，而非经审计的公司披露。
    - Omio 在消费者 App 之上叠加 SMB、B2B、会员、新地区和白标分发，执行复杂度正在上升。
  unresolvedGaps:
    - 管理层确认的年收入、毛利率和按分部拆分的抽佣率披露。
    - 直接 B2C、合作伙伴渠道和 SMB 产品的留存、重复预订和队列行为。
    - Hercules 融资的债务契约包、到期时间表、定价和再融资敏感性。
    - 合作伙伴集中度、头部承运商敞口和主要渠道关系续约时间。
    - 支持和退款运营指标，包括 SLA、拒付率、欺诈损失和争议解决时间。
    - 董事会层面的流动性策略，包括 IPO、战略出售或更长时间留在私募市场的意愿。
