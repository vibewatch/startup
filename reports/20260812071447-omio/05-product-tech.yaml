  - FE003
- id: b2b-business-and-discovery-expansion
  title: B2B, Business-Travel, and Discovery Expansion
  body: >-
    Omio’s product scope widened materially in 2026. Omio B2B now markets plug-and-play API and white-label
    options, deep-link or embedded journeys, localized language and currency flows, and integrations at the
    moment of search, including Google Travel widgets. The company is explicit that partners such as Uber,
    Google, KAYAK, TUI, and easyGroup use these tools to distribute travel inventory under their own brand.
    Omio Business then extends the same inventory and booking logic into SMB travel management with VAT
    invoicing, booking history, cost tracking, secure payments, and hotel inventory in addition to trains,
    buses, and flights. Rome2Rio adds the discovery layer: a global route-finding surface that the 2026
    strategy update said would receive AI-driven route intelligence, integrated booking, and an advertising
    platform. The strategic read is that Omio is steadily building a connected travel operating system where
    discovery, booking, partner distribution, and SMB workflow sit on one common supply backbone.
  claimRefs:
  - CE006
  - CE007
  - CE008
  - CE012
  - CE017
  - CE025
  - CE026
  - CE027
  - CE028
  - CE030
- id: trust-quality-and-compliance
  title: Trust, Quality, and Compliance Signals
  body: >-
    Public trust and quality evidence is mixed. On the positive side, the app-store listings show active
    release management, high visible user ratings, mobile-ticket support, live operational updates, secure
    payment methods, and 24/7 customer service. Omio Savings Pass and its terms show the company codifying
    subscription-like product behavior across multiple jurisdictions, with discount caps, withdrawal rights,
    and exchange-rate rules. Omio Business adds VAT-compliant invoicing and centralized booking history,
    which are practical product-level compliance features for a work-travel buyer. At the same time, the
    fetched source set did not surface public ISO certifications, SOC reports, formal uptime data, or a
    public developer portal with auditable operational guarantees. That omission matters because Omio is not
    only serving leisure consumers anymore; it is also positioning itself as infrastructure for partners and
    business users. Trust appears good enough for scaled commercial use, but the evidence is product-copy
    heavy and assurance-document light.
  claimRefs:
  - CE002
  - CE015
  - CE016
  - CE018
  - CE023
  - CE024
  - CE025
  - CE032
  tableRefs:
  - TE004
  figureRefs:
  - FE004
- id: roadmap-and-development-maturity
  title: Roadmap and Development Maturity
  body: >-
    Omio’s 2026 roadmap signals a company that is moving from feature expansion to platform leverage.
    Public releases show Savings Pass, Omio Business, the TUI and easyTrain integrations, and a Rome2Rio
    refresh with AI route intelligence and destination advertising. The jobs page adds an organizational
    signal: Omio says it is becoming an AI-native organization and is empowering teams to experiment across
    functions. Engineering-role evidence goes beyond buzzwords. The AI role is explicitly about moving from
    manual rule-based systems to AI-driven ones, while the principal-engineer post pushes AI tools and
    automation inside the software-delivery lifecycle itself. Historical Medium posts about Kubernetes cost
    management and SLO alerting further suggest the engineering organization has worked on operational
    discipline rather than only shipping user-facing features. The balanced conclusion is that Omio’s product
    machine looks increasingly mature and cross-functional, but investors should still request formal release
    velocity, incident, security, and architecture-review artifacts before treating those signals as proof.
