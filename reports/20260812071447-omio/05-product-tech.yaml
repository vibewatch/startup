  - FE001
- id: operating-flow-and-architecture
  title: Operating Flow and Underlying Architecture
  body: >-
    The most consistent technical theme across Omio’s public materials is abstraction of fragmentation.
    Job postings and B2B pages repeatedly describe a cloud platform that hides the messy variability of
    supplier data and APIs and turns it into a structured, performant system that consumer and partner
    applications can use. That architecture is visible in the job-market signal: Go-based backend roles for
    Omio4Business, a principal engineer role spanning Java, Node.js, REST, GraphQL, React, React Native,
    Kubernetes, Docker, GCP, Jest, and Cypress, and frontend roles focused on reusable components that can
    mount dynamically across React surfaces. This is not proof of elegant execution, but it is strong proof
    of a modular product architecture rather than a monolith. It also shows Omio is solving for both
    customer-facing UX and partner-facing integration. The main diligence caveat is that no public systems
    documentation, SLAs, or reliability metrics were found; the operating architecture is inferable from
    jobs and product pages, not externally verified technical documentation.
  claimRefs:
  - CE006
  - CE009
  - CE010
  - CE011
  - CE013
  - CE021
  - CE022
  - CE023
  tableRefs:
  - TE003
