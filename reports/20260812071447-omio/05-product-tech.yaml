chapter:
  number: 5
  title: Product & Tech
  summary: Omio’s product stack is broader than a single consumer booking app. Public evidence supports a multi-layer system spanning consumer search and booking, Rome2Rio discovery, B2B APIs and white-label integrations, SMB travel workflow tooling, and a growing AI layer inside both engineering and product releases. The architecture looks credible and increasingly modular, but the public record is thin on formal security certifications, uptime, and external technical documentation.
sections:
- id: product-surface-and-assets
  title: Product Surface and Core Assets
  body: >-
    Omio now presents as a product family rather than a standalone consumer app. The core travel app still
    anchors the stack, but public materials also describe Rome2Rio as the discovery surface, Omio B2B as
    the partner-distribution layer, and Omio Business as a work-travel workflow for SMBs. The app-store
    listings show the consumer product is dense with features: multimodal search across trains, buses,
    flights, and ferries; mobile ticketing; real-time updates; multiple payment methods; and multilingual,
    multicurrency support. Corporate sources broaden that further with 47-country coverage, 3,000-plus
    providers, Omio Savings Pass, and business-travel extensions. The product implication is positive.
    Omio is not betting on one thin comparison screen; it is building multiple surfaces around the same
    inventory and booking backbone. The caution is that public product descriptions are not fully harmonized.
    Consumer app listings still mention 45-plus countries and 2,000 providers while corporate pages cite
    47 countries and 3,000-plus providers, which suggests metadata and storefront copy can lag actual
    platform scope.
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  - CE005
  - CE015
  - CE019
  - CE020
  - CE021
  tableRefs:
