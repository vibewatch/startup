  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Company solution
  - Measurable benefit
  - Limitation
  rows:
  - - Plan multi-country leisure trip
    - Compare multiple operator sites and modes manually
    - Omio app search, compare, book, and manage flow
    - Faster comparison and mobile-ticket convenience
    - Coverage/disclosures in store listings can lag corporate expansion claims
  - - Discover unfamiliar route
    - Use maps, blogs, or operator pages separately
    - Rome2Rio discovery plus Omio booking path
    - Higher funnel capture before booking intent crystallizes
    - Actual handoff conversion not disclosed
  - - Add travel to partner ecosystem
    - Build costly custom integrations and supplier relationships
    - Omio B2B API or white label
    - Faster launch with localized payments, languages, and ticketing
    - Public technical documentation is limited
  - - Manage infrequent SMB work travel
    - Book directly across many providers and track spend manually
    - Omio Business with VAT invoices and booking history
    - Lower admin friction and broader travel choice
    - New product with little public retention history
  notes: Omio wins when travel complexity is high and users or partners want one surface across fragmented modes.
