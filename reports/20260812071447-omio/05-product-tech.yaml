- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset / product line
  - User
  - Status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - Omio consumer app
    - Leisure and self-directed travelers
    - Mature
    - Multimodal comparison and booking in one interface
    - Need churn, repeat-booking, and app engagement metrics
  - - Rome2Rio
    - Discovery-first trip planners
    - Mature core, evolving feature set
    - Global route discovery extends funnel before booking intent hardens
    - Need traffic split and conversion to Omio booking flows
  - - Omio B2B APIs
    - Travel partners and mobility platforms
    - Mature
    - Lets partners distribute inventory without building full supply stack
    - Need integration depth, uptime, and top-partner concentration
  - - White-label journeys
    - OTAs, travel brands, operators
    - Mature
    - Localized branded booking experiences via deep links, widgets, or embeds
    - Need contractual economics and implementation complexity by client type
  - - Omio Business
    - SMBs, sole traders, freelancers
    - Emerging
    - Brings corporate-like controls without enterprise contracts or monthly fees
    - Need adoption, retention, and attach-to-core metrics
  notes: The product family shares a common supply and booking backbone but addresses different intent points in the traveler journey.
