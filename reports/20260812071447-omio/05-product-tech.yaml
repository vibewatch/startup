    - Reusable React / React Native surfaces across products
    - TS/JS expertise and component libraries
    - UX inconsistency risk if shared components diverge by surface
  - - Infrastructure and quality
    - Kubernetes, Docker, GCP, Jenkins, Jest, Cypress underpin delivery and testing
    - Cloud cost and platform ops discipline
    - No public uptime, incident, or security-SLA disclosure
