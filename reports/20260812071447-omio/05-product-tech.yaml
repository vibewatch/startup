  - - Search and Booking APIs
    - Power partner and Omio4Business workflows
    - Internal cloud platform and partner integrations
    - Reliability and latency are mission critical but not externally reported
  - - Backend services
    - Go, Java, Node.js, REST, GraphQL services support booking and platform logic
    - Engineering hiring and service architecture
    - Stack sprawl can raise coordination cost without strong standards
