companyProfile:
  summary: >
    Omio is a Berlin-based multimodal travel booking platform founded in 2013 under the GoEuro brand and
    rebranded to Omio in 2019 as the company expanded beyond Europe. The platform combines search,
    comparison, and booking across trains, buses, flights, and ferries, while also supporting partner
    distribution through Omio B2B, white-label integrations, and newer SMB workflow products such as Omio
    Business. Public sources support meaningful scale signals — including 2024 profitability claims, more
    than $1 billion in ticket sales, and 2026 claims of more than one billion annual users — but monetization,
    retention, and debt-detail disclosure remain materially thinner than the operating footprint would imply.
  foundedDate: "2013-01-01"
  foundingLocation: "Berlin, Germany"
  headquarters: "Berlin, Germany"
  founders:
    - name: "Naren Shaam"
      role: "Founder & CEO"
      background: "Founded GoEuro after struggling to book cross-border European rail travel and still anchors Omio's public strategic narrative in 2026."
      claimRefs: [CO001, CO002]
  productSummary: >
    Consumer app and desktop booking platform for multimodal travel, supplemented by partner-distribution
    tooling (Omio B2B), white-label integrations, discovery assets, paid membership, and SMB travel workflow
    features. The platform's core value proposition is reducing fragmentation across rail, bus, ferry, and
    flight booking rather than owning transport supply itself.
  customerFocus: "Leisure travelers, partner-channel users, and small business travel buyers across Europe, North America, Brazil, and Southeast Asia."
  businessModel: >
    Hybrid intermediation model combining booking-related fees and commissions from third-party travel
    providers with newer monetization layers in partner distribution, memberships, ancillary products, and
    SMB travel workflows. Omio's value creation depends on aggregating fragmented supply and converting high
    travel-search intent into bookable transactions rather than owning carriers.
  stage: "Series E / late-stage private"
  fundingStatus: >
    Public evidence points to a roughly $1 billion private valuation reference, a $120 million Hercules debt
    facility announced in December 2024, and total capital figures that vary by source between roughly
    $486 million and $596 million depending on how debt and later financing events are classified.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO003, CO007, CO026, CO032, CE005, CV007, CV008, CV009, CV010, CV011, CV012, CV015]

summary:
  headline: >
    Omio is a strategically credible multimodal travel platform, but the current roughly $1 billion mark
    looks stretched on public evidence because it implies a revenue multiple far above public travel-tech
    comparables without matching disclosure depth on revenue quality, retention, concentration, or debt terms.
  overallScore: 5.9
  recommendation: research-more
  confidence: medium
  riskRating: high
  valuationStance: stretched
  keyMetrics:
    valuationUsdM: 1000
    revenueRunRateUsdM: 64.5
    arrUsdM: 64.5
    revenueGrowthYoYPct: 69.3
    grossMarginPct: null
    nrrPct: null
    totalRaisedUsdM: 596
    customerCount: 100000
    headcount: 430
  topStrengths:
    - "Rare multimodal breadth across trains, buses, flights, and ferries, plus proof of white-label and partner-channel distribution beyond the core app."
    - "2024 profitability claim and >$1B ticket-sales milestone suggest the company may finally be showing real operating leverage after the pandemic recovery period."
    - "Public evidence supports meaningful scale in demand and inventory: 3,000+ partners, 46-47 countries, and large annual user and daily traveler figures."
    - "Channel expansion into Omio B2B, Omio Business, and branded partnerships creates upside optionality beyond direct consumer booking."
    - "Tier-1 investors and lender support imply Omio has continued access to strategic capital despite travel-market volatility."
  topRisks:
    - "Current ~$1B private mark implies ~15.5x 2025 estimated revenue and >26x 2024 estimated revenue, far above the 0.3x-6.0x public comp band used here."
    - "Debt adds financing flexibility but public sources do not disclose covenant terms, maturity, pricing, or downside triggers for the Hercules facility."
    - "Customer trust is not pristine: ORR intervention on fee transparency and recurring review-site complaints about refunds and support still matter."
    - "Partner and supply dependence remain material because Omio does not own transport inventory and public sources do not quantify concentration by carrier or partner."
    - "Core valuation inputs such as revenue, employee count, and total capital raised still rely heavily on third-party databases rather than audited company disclosure."
    - "Execution complexity is rising as Omio adds SMB, B2B, memberships, new geographies, and white-label distribution on top of the consumer app."
  unresolvedGaps:
    - "Management-confirmed annual revenue, gross margin, and take-rate disclosure by segment."
    - "Retention, repeat-booking, and cohort behavior across direct B2C, partner-channel, and SMB products."
    - "Debt covenant package, maturity schedule, pricing, and refinancing sensitivity for the Hercules facility."
    - "Partner concentration, top-carrier exposure, and renewal timing for major channel relationships."
    - "Support and refund operating metrics, including SLA, chargeback rate, fraud losses, and dispute-resolution time."
    - "Board-level liquidity strategy, including appetite for IPO, strategic sale, or longer private-market hold."

