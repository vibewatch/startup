        - 多元化但缺少经济性验证
        - B2B/SMB 上线增长，但 2-3 个季度后分群留存或变现仍未披露
        - 指标出现前，把多元化视为复杂度，而不是护城河
    notes: 这些触发器旨在把 Omio 的信息缺口转成明确监测测试，而不是停留在模糊谨慎。
    claimRefs:
      - CR021
      - CR031
      - CR038
      - CR041
      - CR042
  - id: TV001
    title: 建议摘要表
    columns:
      - 维度
      - 评估
      - 支撑逻辑
      - 何种情况会改变判断
    rows:
      - - 建议
        - 跟踪 / 继续研究
        - 公司战略上站得住脚，但当前公开证据对估值支撑太薄，难以直接给出正面结论
        - 直接尽调收入质量、留存和债务条款，或等到进入价格明显降低
      - - 置信度
        - 中
        - 公开证据支撑规模和牵引力，但估值输入仍主要来自估算
        - 经审计财务桥接表和渠道级 KPI
      - - 风险评级
        - 高
        - 客服摩擦、ORR 历史、合作伙伴依赖和债务不透明仍然重要
        - 清晰披露 SLA、集中度和债务约束条款
      - - 估值立场
        - 按 $1B 看估值已偏满到偏贵
        - 隐含 2025 年收入 15.5x，显著高于上市可比公司区间
        - 核实更快增长和可持续利润率，或价格重置
      - - 决策含义
        - 不为价格硬追；必须保留尽调杠杆
        - 新资金要么拿到数据室确认，要么取得结构性下行保护
        - 董事会权利、下行保护或改善后的指标
    notes: 截至 2026-08-12，该建议对价格和证据都敏感。这是尽调观点，不是投资建议。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV043
  - id: TV002
    title: 论点 / 反论点表
    columns:
      - 论点
      - 证据
      - 反方观点
      - 何种情况会改变判断
    rows:
      - - 多式联运平台广度确实存在
        - Omio、Rome2Rio、B2B、SMB 和合作伙伴分销都能从公开信息中看到
        - 广度也可能意味着复杂性，在变现跑通前尤其如此
        - 细分板块毛利率和留存数据
      - - 2024 年盈利可能是拐点
        - 公司称已实现盈利，票务销售额超过 $1B
        - 盈利来自公司口径；持续性尚未得到公开验证
        - 两年经验证的盈利能力和现金生成
      - - 合作伙伴渠道把变现扩展到 App 之外
        - Uber、TUI 和 easyTrain 说明外部部署真实存在
        - 渠道所有权往往在合作伙伴手里，不在 Omio 手里
        - 合作伙伴续约、附加率和集中度披露
      - - 当前估值已计入大部分上行
        - 隐含 15.5x 收入倍数显著高于上市可比公司区间
        - 私营公司的增长可选性可以支撑一定溢价
        - 证明 Omio 能在 12-24 个月内消化该估值
      - - 披露质量才是真正的估值约束
        - 核心收入输入来自第三方数据库
        - 私募投资人仍可能直接拿到更好的信息
        - 数据室确认收入、债务和客户经济性
    notes: 反论点主要来自估值和披露，不是说 Omio 没有产品-市场基础。
    claimRefs:
