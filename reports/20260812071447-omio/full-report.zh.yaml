      - number: '2.4'
        title: 监管、铁路结构与战略含义
        blocks:
          - type: paragraph
            body: >-
              欧洲铁路政策长期想用竞争、互操作、安全标准和基础设施投资，让市场更具竞争性。这个政策背景从根本上利好 Omio
              这类公司，因为更开放、更互操作的铁路系统会产生更多数字库存和跨境需求。但监管意图不等于平台可直接落地。即使到 2026
              年，行业媒体和贸易组织仍把预订碎片化描述为未解决问题。这会影响估值，因为结果是双面的。如果旅客一揽子方案和数据共享改革确实改善多运营商票务和旅客权益保护，Omio
              会受益于更大、更易转化的市场。如果改革仍不彻底，Omio
              也会受益于碎片化带来的需求，但必须继续承担监管未能简化的产品和客服复杂度。净效果是：市场仍有吸引力，但投资人应把它视为一个结构性混乱的品类；监管进展更多提高上行空间，而不是消除卓越执行的必要性。
