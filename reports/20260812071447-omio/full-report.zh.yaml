      role: 创始人兼 CEO
      background: Naren Shaam 在预订欧洲跨境铁路行程时受挫后创立 GoEuro；到 2026 年，他仍是 Omio 公开战略叙事的核心人物。
      claimRefs:
        - CO001
        - CO002
  productSummary: >
    面向消费者的 app 和桌面端多交通方式旅行预订平台，辅以合作伙伴分发工具（Omio B2B）、白标集成、发现型资产、付费会员，以及 SMB
    差旅流程功能。平台的核心价值主张，是降低铁路、巴士、渡轮和航班预订之间的碎片化，而不是自己持有运力供给。
  customerFocus: 欧洲、北美、巴西和东南亚的休闲旅客、合作伙伴渠道用户，以及小企业差旅买家。
  businessModel: |
    混合中介模式，把来自第三方旅行供应商的预订相关费用和佣金，与合作伙伴分发、会员、附加产品、SMB 差旅流程中的新货币化层结合起来。Omio 创造价值靠聚合碎片化供给，并把高意图旅行搜索转化成可预订交易，而不是持有承运商。
