            body: >-
              Omio 现在呈现为一个产品族，而不是单独的消费者 app。核心旅行 app 仍锚定技术栈，但公开材料也把 Rome2Rio 描述为发现入口，把 Omio B2B 描述为合作伙伴分发层，把 Omio
              Business 描述为面向 SMB 的工作差旅流程。应用商店列表显示，消费者产品功能很密：覆盖火车、巴士、航班和渡轮的多交通方式搜索；移动票；实时更新；多种支付方式；以及多语言、多币种支持。公司来源进一步扩展到
              47 个国家覆盖、3,000 多家供应商、Omio Savings Pass 和商务差旅延伸。产品含义是正面的。Omio
              不是押注一张薄薄的比价页，而是在同一套库存和预订主干周围搭建多个触点。需要警惕的是，公开产品描述并不完全一致。消费者 app 列表仍提到 45 个以上国家和 2,000 家供应商，而公司页面引用 47 个国家和
              3,000 多家供应商，说明元数据和应用商店文案可能滞后于实际平台范围。
