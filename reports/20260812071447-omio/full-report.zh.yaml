            body: >-
              从运营看，Omio 在发现和预订环节强于异常处理。应用商店证据有利：iOS 和 Android 商店显示使用广、评分高。但独立评价层明显更嘈杂。Trustpilot
              整体为正，却明显低于应用商店评分；JustUseApp 反复出现退款时效、客服响应和预订变更相关投诉。Omio 自己的条款解释了风险为何持续：部分票据可能因供应商流程仍靠人工而需要 24–48
              小时才能出票；即便旅客遇到摩擦，服务费也可能不退；供应商还可能加收费用。平时这些机制可管理，但一旦中断增多、客户需要快速答复，或一次多式联运行程跨越多个承运商，就会伤害品牌。Omio
              不是重资产运营商，运营下行不在厂房设备，而在客户信任流失、退款工作量陡增、数据处理失误、支付运营，以及压力下的问题解决质量。也就是说，小的合规或服务缺陷也可能在庞大预订基数上迅速放大。
            claimRefs:
              - CR014
              - CR015
              - CR016
