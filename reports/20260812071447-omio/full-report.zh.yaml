        - $28.0B
        - $7.69B
        - ~3.6x
        - 高质量旅游科技基准，但规模大得多，也更偏基础设施
      - - Booking Holdings
        - 上市全球 OTA / 平台
        - $164.94B
        - $27.68B
        - ~6.0x
        - 该组中大型上市旅游平台最高的倍数，但成熟度和盈利能力高得多
      - - eDreams ODIGEO
        - 上市 OTA
        - $0.65B
        - $0.78B
        - ~0.8x
        - 展示 OTA 可比区间低端；质量较弱，业务组合也不同于 Omio
      - - Sabre
        - 上市旅游分销基础设施
        - $0.80B
        - $2.82B
        - ~0.3x
        - 分销低端可比；不是同等质量的市场平台类比，但可用于下行情景框定
      - - Omio 2025 年隐含值
        - 基于 GetLatka 估算的私募估值标记
        - $1.0B
        - $0.0645B
        - ~15.5x
        - 要证明相对上市组合的溢价合理，需要强增长和更好的经济性披露
    notes: 可比组合有意混合：没有一家上市公司能完美匹配 Omio 的多式联运私募市场故事，因此目标是框定估值，而不是制造虚假的精确感。
    enumerationScope:
