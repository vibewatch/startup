      - number: '8.4'
        title: 牛市、基准和熊市情景
        blocks:
          - type: paragraph
            body: >-
              情景分析有助于拆开 Omio 本身与今日价格似乎假设的东西。牛市情形下，Omio 证明 2024 年盈利里程碑可持续，合作伙伴分销和 SMB 产品加深变现，收入增速明显超过当前第三方估算。沿着这条路径，超过 $1
              billion 的估值可以被辩护，甚至继续上调。基准情形不那么令人兴奋，但从公开证据看更现实：Omio
              继续增长，保留战略地位，并应获得相对上市市场平台的健康溢价；但在披露改善前，估值仍低于当前标记。熊市情形不是崩盘，而是重估：公开市场重力、支持摩擦或合作伙伴 /
              债务不确定性压缩溢价。关键洞察在于，当前定价已经更接近可辩护区间的牛市端，而非中点。因此，价格纪律、清算优先权和获取私有尽调材料的能力，是任何新投资决策的核心。
