      - number: '8.2'
        title: 融资和估值背景
        blocks:
          - type: paragraph
            body: >-
              Omio 的公开估值语境由少数强信号和更多缺失细节共同锚定。Coverager 和 Omio 自己的 2024 年底更新确认了 Hercules $120 million 债务额度、2024 年盈利，以及超过
              $1 billion 的票务销售额。PR Newswire 的 2026 年发布稿又叠加更强的触达口径，包括超过 1B 年度用户、每日超过 100,000
              名活跃旅客。与之相对，收入基数仍主要来自第三方数据库。GetLatka 估算 2025 年收入 $64.5 million、2024 年 $38.1 million；Tracxn 则指向 $1 billion
              当前估值和不同的总融资额。这些差异不是噪音，而是在提醒：对后期私营公司的公开估值工作受限于披露质量。因此，估值讨论必须清楚区分战略规模与变现深度：前者看起来真实，后者仍只被部分观察到。这就是为什么同一个 $1
              billion 标记，叙事上可以合理，数字上仍显得偏贵。
