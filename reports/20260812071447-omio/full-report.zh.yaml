              Omio 披露客户牵引力远比披露留存更积极。公司的公开渠道指向数以百万计的日度和月度用户互动：2024 年盈利公告称 Omio 每日售出 80,000 张票，吸引 9 亿年访客；2026
              年战略发布则把表述提高到超过 10 亿年用户和超过 100,000 日活跃旅客。消费者端，iOS 列表显示 77,000 个评分给出 4.9 分；JustUseApp 聚合器称有 2,700 万月用户、2,200
              万 app 下载，以及 74,493 条被分析评价。这些数字不是等价指标，不应混成一个漏斗；但合在一起，它们支撑了真实且规模化的消费者使用。Omio Business
              加入了更定向的采用路径：英国上线、无合同入驻、安全支付、VAT 发票，以及面向小团队的集中化预订历史。更广的含义是，Omio 在自助和合作伙伴辅助渠道上都具备真实用户触达，即使公开分母质量仍不一致。
