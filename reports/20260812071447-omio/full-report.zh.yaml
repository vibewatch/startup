chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、产品模式与品牌演进
        blocks:
          - type: paragraph
            body: >-
              Omio 是一家总部位于柏林的多交通方式旅行搜索和预订平台，2013 年从 GoEuro 起步。创立逻辑更偏实际问题，而不是投机设想：Naren Shaam 在 2010
              年背包旅行中想预订一段欧洲城际铁路却很费劲，由此判断，城市出行和电商已经 app
              原生化，欧洲交通却仍高度数字碎片化。如今公司把自己定位成一个统一入口，覆盖火车、巴士、航班、渡轮和部分接驳库存；具体到供应商集成，既有元搜索，也有直接预订。这个混合模式对尽调很关键：Omio 既不是纯
              OTA，也不是纯发现层；它的价值在于把碎片库存拼起来，并把用户留在同一条行程流程里。2019 年从 GoEuro 更名为 Omio
              并非换皮。管理层明确把更名与欧洲之外的全球野心绑定，认为公司要在国际市场扩展供给、语言和消费者相关性，就需要一个不那么受地域束缚的品牌。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO007
              - CO008
