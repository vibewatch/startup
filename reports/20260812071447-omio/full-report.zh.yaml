      - number: '1.4'
        title: 当前规模、覆盖范围与集团结构
        blocks:
          - type: paragraph
            body: >-
              Omio 目前公开披露的规模，在流量和网络广度上很强，在可对账财务和员工数上较弱。最新官方材料称其覆盖 46 个国家、拥有 3,000 多个供给合作伙伴、年用户超过 10 亿、日活跃旅客超过
              100,000。2024 年 12 月材料还给出 9 亿年访客、超过 10 亿次行程搜索、每日售出 80,000 张票，以及 EBITDA 盈利。同一组披露也称集团 2024 年票务销售额超过 $1
              billion。相比之下，消费者“关于”页面仍引用 300 人团队和较早的办公室地域；较新的集团页面则提到 400 多或 430 多名员工以及扩大的办公室地图。Omio 的结构也已变宽：除了旗舰消费者
              app，集团现在强调 Omio B2B、Rome2Rio 和 Omio Business。这种多品牌架构支持多条分发路径，但也意味着投资人应要求分板块报告，而不是把所有流量、票量和用户都当成同一个同质业务的证明。
