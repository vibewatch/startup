      - number: '7.3'
        title: 合作伙伴和依赖风险
        blocks:
          - type: paragraph
            body: >-
              Omio 的护城河和脆弱性来自同一个地方：第三方供给与分销。公司不拥有交通库存，因此可订性、履约质量和许多中断结果仍取决于下游承运商和旅行供应商。与此同时，增长叙事已经越过直接 B2C
              流量。Uber、TUI、easyTrain、Omio B2B 和 Omio Business 都说明，Omio 正变成其他品牌和使用场景的分销与工作流层。战略上这有吸引力，因为它让公司不再只押一个消费者 app
              漏斗；但 Omio 也因此暴露在合作伙伴挂载率、API
              可用性、商业续约，以及掌握客户关系的品牌优先级之下。白标部署从公众视野消失的速度，可能比直接消费者品牌更快。公开材料没有按承运商、合作伙伴或账户量化集中度，投资者看不出单一铁路运营商、主要渠道伙伴或某个地区是否承载了不成比例的收入权重。运营模型很可能需要这些合作来拓宽库存和变现，但这种依赖尚未匹配公开的集中度披露。
            claimRefs:
              - CR023
              - CR024
              - CR025
              - CR026
              - CR027
              - CR028
              - CR029
              - CR030
