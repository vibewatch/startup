  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与分类
        blocks:
          - type: paragraph
            body: >-
              Omio 并不在一个整齐盒子里竞争。直接同行包括 Trainline、Rail Europe、Wanderu 这类多交通方式或重铁路聚合商；更窄替代品包括 CheckMyBus
              这样的巴士专营平台；相邻规划替代品是
              Rome2Rio；现状竞争包括铁路和长途客车运营商直营网点。这个分类很重要，因为它解释了为什么简单的“市场份额”比较会误导。旅客并不总是在同类对手之间选择。一次巴黎到阿姆斯特丹搜索，可能一程让 Omio 对上
              Trainline，另一程对上 Eurostar 或 SNCF 直购，旅客还在探索选项时又会对上 Rome2Rio。Omio
              的命题在搜索、交通方式比较和预订需要在一个地方完成时最强；行程简单、运营商品牌强、旅客已经知道具体想要哪趟铁路或长途车时最弱。换句话说，竞争分析必须从旅客场景出发，而不是从公司标签出发。从伦敦到巴黎的旅客可能会把
              Trainline 和 Rail Europe 视为近替代；把渡轮、铁路和机场接驳拼在一起的旅客，则可能认为 Omio 和 Rome2Rio 更相关。
