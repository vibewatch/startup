      - number: '1.2'
        title: 领导层、高管可见度与关键人依赖
        blocks:
          - type: paragraph
            body: >-
              Naren Shaam 到 2026 年仍主导 Omio 的公开身份。他在公司页面和外部访谈中都是创始人兼
              CEO，也仍是产品方向、国际扩张和后疫情运营策略的主要发声者。公开可获取资料也能看到一支覆盖财务、产品、技术和营销的高管团队，但披露厚度低于投资人通常会要求的后期私企标准。RocketReach 摘要显示
              Tomas Vocetka 为 CTO，Ashish Chatterjee 为首席产品官，Facundo Viguie Aleman 为 CMO；Seedtable 和公司材料也指向 Jean-Bernard
              Moens 担任 CFO。缺口同样重要：官方可获取材料没有给出清晰、权威的董事会名单、委员会结构或继任安排。对于一家已融资数亿美元、又在用债务资金推进扩张和 M&A 的公司，这种治理不透明会加重尽调负担，也提高
              Shaam 作为核心决策者和外部代言人的关键人依赖。
