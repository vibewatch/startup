  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与定价架构
        blocks:
          - type: paragraph
            body: >-
              Omio 自己的条款说得很清楚：平台不只是一个媒体 / 搜索前端。它识别、比较并撮合旅行服务，为多数供给提供直接预订，针对 Omio 服务收取服务费，也从第三方供应商收取佣金。这很重要，因为 Omio
              的收入模式从设计上就是混合的：一部分是客户支付的便利费，一部分是供应商支付的分发佣金，还有一部分来自较新的附加产品或合作伙伴分发货币化。定价层刻意不透明。Omio
              不发布适用于消费者预订的通用费率卡，实际抽佣率几乎肯定会随运营商、路线、可退性和地区变化。不过，公开材料显示 2025 至 2026 年货币化在加深。Omio Flex
              创造了一个付费灵活性产品，让客户在规定窗口内可因任何原因取消；2026 年战略发布又加入 Omio Pass，这是一款 90 天会员产品，提供 10% 折扣；B2B 公告则显示白标 / API 收入在消费者
              app 之外扩张。财务上，这比依赖单一预订费更健康，但也意味着投资人需要按收入流拆开的清晰收入桥，才能判断组合质量。
