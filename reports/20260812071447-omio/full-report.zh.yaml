companyProfile:
  summary: >
    Omio 是一家总部位于柏林的多交通方式旅行预订平台，2013 年以 GoEuro 品牌创立；随着公司走出欧洲，2019 年更名为 Omio。平台把火车、巴士、航班和渡轮的搜索、比价、预订放在一起，也通过 Omio
    B2B、白标集成，以及 Omio Business 等较新的 SMB 流程产品支持合作伙伴分发。公开资料能支撑一些有意义的规模信号——包括 2024 年盈利说法、超过 $1 billion 的票务销售额，以及 2026 年超过 10
    亿年用户的说法——但货币化、留存和债务细节披露仍明显薄于其运营覆盖面应有的水平。
  foundedDate: '2013-01-01'
  foundingLocation: Berlin, Germany
  headquarters: Berlin, Germany
  founders:
