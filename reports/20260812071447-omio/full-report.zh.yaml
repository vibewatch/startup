  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户板块、买方角色与用例
        blocks:
          - type: paragraph
            body: >-
              Omio 至少服务四类差异显著的客户。核心板块仍是自主规划旅客，他们把 Omio 用作跨交通方式的搜索、比较、预订和票务管理层。在这个板块，买家、用户和付款方通常合为同一个个人或家庭。第二类是通过
              Uber、TUI、easyTrain 等合作伙伴渠道进入的旅客；Omio 对终端用户往往不可见，但仍驱动预订路径。第三类是 Omio Business 瞄准的 SMB
              或自由职业者工作差旅用户，旅客仍是用户，但雇主或预算所有者变成付款方。第四类较轻，是 Omio Savings Pass
              和相关折扣触达的复购型价格敏感用户。各板块的共同线索是复杂度。当旅客或合作伙伴不想手工拼接多个运营商、票价规则、货币或票证时，Omio
              就会赢。这个买方地图在战略上有吸引力，因为它把需求分散到休闲、合作伙伴分发和工作差旅用例，而不是依赖单一获客渠道。
