  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              Omio 的法律风险，首先来自它横跨多种交通方式和司法辖区，夹在旅客与承运商之间。其条款称 Omio
              是独立中介，底层行程仍由承运商条款管辖。这种结构是预订平台的标准做法，但一旦出现延误、取消、退款争议或价格争议，投诉该由谁处理就会反复变成问题。英国铁路市场已经给出具体案例：Office of Rail and
              Road 称，Omio 属于一批在线售票零售商，其费用透明度做法引发消费者法担忧；随后该机构确认，Omio 改善了帮助页面披露，并在更早流程里把预订费计入总价。2024 年 Digital Markets,
              Competition and Consumers Act 把这一标准进一步写硬。隐私风险也真实存在，因为 Omio 公开表示，它依据 GDPR、BDSG 和其他法律处理身份、行程、政府 ID
              和支付数据。铁路、巴士和航空旅客权利规则保留运营商义务，但出问题时，客户仍把 Omio 当作一线品牌。Omio 的公开产品叙事和 AI 重点又增加了一条较小但在上升的合规线，因为自动推荐和支持正变得更核心。
