      - number: '4.3'
        title: 单位经济与成本结构
        blocks:
          - type: paragraph
            body: >-
              Omio 的公开单位经济图景主要靠推断。传统资本开支意义上，这个业务显然轻资产：平台不持有火车、巴士、飞机或住宿库存。主要成本项看起来是合作伙伴集成、支付处理、客服、退款和取消、工程，以及流量获客。使用条款显示
              Omio 位于预订流程中，同时收取服务费和供应商佣金；英国 Office of Rail and Road 的费用透明度干预则显示，这个模式对结账中费用呈现方式非常敏感。Omio Flex
              可能提高部分预订的货币化和转化，但也引入理赔处理和退款义务，可能抵消部分利润收益。用 GetLatka 对 2025 年 $64.5 million 收入估计，除以公司 2024 年超过 $1 billion
              票务销售额披露，得到的粗略公开抽佣率代理值约为 6% 或略高；这对一个多交通方式分发商来说合理，但太粗，不能当作真实净抽佣率。没有毛利率、CAC、回本周期、NRR 或 cohort 数据，单位经济争论仍未关闭。
