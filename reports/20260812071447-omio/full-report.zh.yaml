      - number: '3.3'
        title: 定价、转换成本与护城河耐久性
        blocks:
          - type: paragraph
            body: >-
              这个品类的竞争耐久性，并不来自软件意义上的排他性。消费者可以在多个 app 之间低摩擦多栖使用，所以转换成本很薄，产品必须反复靠路线覆盖、价格信心和售后支持取胜。ORR 的 2025
              年费用透明度审查很重要，因为它说明定价信任是触及 Omio、Trainline 和 Rail Europe
              的行业问题。在已抓取记录中，没有任何玩家发布简单、标准化、能让竞争比较变得轻松的费用表。这强化了两个结论。第一，即使存在直订，更好的流程仍能支撑用户使用中介。第二，如果附加费或退款处理显得不透明，信任会很快被侵蚀。因此，Omio
              最强的护城河主张在供给广度、多交通方式搜索和集团组合；最弱的护城河主张在锁定、排他，以及当行程变简单时阻止旅客流向直营渠道或铁路专营玩家的能力。这也意味着，竞争准备度不能只用当前用户数或路线覆盖衡量。决定性变量是：平台是否减少了足够多的规划和中断痛点，让用户即使同一座位也能在别处购买，仍愿意回来。如果习惯没有形成，供给广度就是功能，而不是护城河。
