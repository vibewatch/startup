  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与规模测算口径
        blocks:
          - type: paragraph
            body: >-
              Omio
              位于旅行商业的一个特定切片：跨多种交通方式的数字化城际行程发现与预订。这点很重要，因为最宽泛的旅游市场数字会夸大它眼前收入机会，而只看铁路又会低估其消费者用例的广度。最相关的自上而下口径是欧洲在线旅行市场，Research
              and Markets 预计 2026 年支出为 $112.8 billion，IMARC 预计 2025 年支出为 $156.8 billion。Worldmetrics 引用的更宽泛预订行业口径到 2027
              年达到 $320 billion，但该数字很可能纳入了更多 Omio 不直接服务的总预订栈。窄口径一端，Omio 自己的 Rail Europe 交易材料指向 2032 年超过 $300 billion
              的全球铁路市场，提醒投资人单是铁路已经很大，但仍只是 Omio 多交通方式命题的一部分。实际结论是，Omio 真正可服务市场比只看铁路数字分发更宽，却比全部在线旅行更窄，因为它本质上不是住宿主导的 OTA。
