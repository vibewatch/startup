  - id: TV005
    title: 论点失效与终止触发因素表
    columns:
      - 触发因素
      - 阈值 / 事件
      - 对论点的传导
      - 行动含义
    rows:
      - - 估值缺乏经验证指标支撑
        - 数据室无法支撑 >$100M 收入路径或可持续盈利
        - 当前溢价失去可信度
        - 不按当前价格投资
      - - 费用 / 行为问题卷土重来
        - 新的 ORR 或类似消费者保护法执法行动
        - 信任和转化论点转弱
        - 立即下调公允价值区间
      - - 合作伙伴集中度冲击
        - 失去某个重要品牌渠道或有意义的承运商接入
        - 多元化论点反转为依赖风险
        - 重新评估收入韧性
      - - 债务压力浮现
        - 披露约束条款修改、短期限或再融资依赖
        - 灵活性溢价消失
        - 转向明确负面的估值立场
      - - 客服质量恶化
        - 独立评价趋势明显恶化，或 SLA 数据显示积压
        - 薄变现被更高服务成本吃掉
        - 下调倍数并推迟进入
    notes: 这些条件具体且可监测，目的是防止叙事动量压过估值纪律。
