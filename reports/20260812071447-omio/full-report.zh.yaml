      - number: '8.3'
        title: 可比估值分析
        blocks:
          - type: paragraph
            body: >-
              公开可比公司集不完美，但仍有信息量。Trainline 是欧洲最接近市场平台式旅行预订的上市对照，尽管覆盖交通方式更窄。Amadeus 体量大得多，也更像基础设施。Booking
              更全球化，盈利能力强得多。Sabre 和 eDreams 则勾勒出上市旅游科技中质量较低的一端。即便有这些限制，可比结论仍一致：Omio 隐含的私营市场倍数偏高。按 GetLatka 的 2025
              年估算，Omio 约为 15.5x 收入。Trainline 约 1.9x，Amadeus 约 3.6x，Booking 约 6.0x，eDreams 约 0.8x，Sabre 约 0.3x。Booking
              是上市组里倍数最高的公司，但仍远低于 Omio 隐含倍数。这不能证明 Omio 绝对高估——私营公司可以因增长和稀缺性获得溢价——但确实意味着举证责任落在 Omio
              身上：它必须证明收入增长、经济性和可防御性更强。上市可比公司并不支持把当前估值视为明显便宜。
