  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 为何重要
      - 负责人 / 尽调路径
    rows:
      - - 收入质量
        - 分板块收入、毛利率、复购结构和合作伙伴抽佣率
        - 决定 Omio 能否消化当前估值
        - 管理层数据室 / CFO 会议
      - - 债务工具
        - 约束条款、期限、定价和允许用途
        - 改变下行风险和入场保护需求
        - 资金团队 / 贷款方摘要
      - - 合作伙伴集中度
        - 头部承运商、头部渠道和续约敞口
        - 判断分销广度是真实还是集中化的关键
        - 商务负责人披露
      - - 客服运营
        - 退款周期、首次响应 SLA、拒付和欺诈率
        - 薄利市场模式可能被服务成本压垮
        - 运营与客户体验审查
      - - 按渠道划分的留存
        - 直销 B2C、B2B、白标和 SMB 队列表现
        - 验证多元化是在复利增长，还是只是增加复杂性
        - 分析数据 / 董事会仪表盘
      - - 退出准备度
        - 董事会对 IPO、M&A 和时点的态度
        - 影响回报周期和私募市场流动性假设
        - CEO / 董事会讨论
    notes: 这些卡点问题最可能改变建议，或改变投资人愿意支付的价格。
    claimRefs:
