      - number: '1.5'
        title: 里程碑、国际扩张与不利信号
        blocks:
          - type: paragraph
            body: >-
              运营故事是一条持续拓宽边界的线。到 2019 年，Omio 已达到 2,700 万月用户和 18 种语言，随后在当年收购 Rome2Rio，扩大旅行发现能力。管理层称 COVID 曾短暂抹掉 98%
              业务，但公司随后恢复，在 2024 年底实现 EBITDA 盈利，并通过新资本和合作伙伴关系重新扩张。2025 年，Omio 通过 Transcor Data Services 加深美国地面交通覆盖，并继续通过
              Amtrak 等合作伙伴分发实时库存。2026 年，公司推出 Omio Business，宣布 $10 million Granite-Integral 战略投资以加速日本和东南亚，并同意收购 Rail
              Europe；若交易完成，铁路分发规模会显著扩大。不利解读在于，客户体验证据远没有增长叙事漂亮。第三方投诉资料反复提到退款延迟、重复扣费、支持薄弱，以及复杂行程处理差。这些问题重要，因为 Omio
              的命题是简化碎片化旅行，而不只是把供给聚合起来。
