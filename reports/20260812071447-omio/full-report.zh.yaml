      - number: '4.5'
        title: 财务判断与尽调卡点
        blocks:
          - type: paragraph
            body: >-
              标题层面的判断有利，但不完整。Omio 似乎拥有真实且多元化的货币化引擎：消费者服务费、供应商佣金、付费灵活性、订阅式会员、B2B 白标分发，以及未来可能围绕 Rome2Rio
              的广告。公司也有可信的规模证明，且至少有一个官方盈利里程碑。拿 Trainline 做基准有方向性帮助，因为它显示欧洲地面交通分发可以把高票量转化成可观收入和 EBITDA；但比较只能到此为止：Trainline
              是有审计披露的上市公司，Omio
              仍是披露足迹薄得多的私营发行人。因此，最大的尽调卡点很直接。公开来源没有展示按流拆分收入、毛利率、CAC、回本周期、NRR、月度烧钱、在手现金、债务条款或分板块盈利能力。外部评论者也反复给出一个实务警示：Omio
              经常是有用的发现层，但旅客有时更愿意直订，以避开费用或中介服务复杂度。这不会击穿商业模式，但在管理层数据开放前，会限制对收入质量的信心。
