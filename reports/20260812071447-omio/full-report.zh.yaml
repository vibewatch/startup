      - number: '7.4'
        title: 财务、治理和执行风险
        blocks:
          - type: paragraph
            body: >-
              Omio 的财务风险不是显性的困境，而是信息不透明叠加杠杆。公司 2024 年 12 月更新及后续报道显示，Omio 已实现盈利，并获得 Hercules 提供的 $120 million
              增长融资额度。这是正面信号：COVID
              后的旅行低谷过去后，贷款方仍愿意承销这家平台。但公开记录仍未披露债务契约组合、利息负担、到期结构，也没有说明这笔债务究竟延长了多少资金续航。外部数据库在总融资额、员工数，甚至用于评估 $1 billion
              估值的收入基线方面都不一致。GetLatka 指向 2025 年收入 $64.5 million，Tracxn 则给出不同的融资基础和 2026 年新融资活动。报告票务销售额与估算收入之间的差距也说明，Omio
              的变现层很薄，客服、退款、支付成本或合作伙伴经济性都可能很关键。执行层面，Omio 在创始人主导叙事和有限公开治理细节下，同时推进 Omio
              Business、B2B、会员、白标合作和新市场扩张。这不推翻投资论点，但意味着投资者是在用少于本阶段通常所需的信息来承销管理质量。
            claimRefs:
