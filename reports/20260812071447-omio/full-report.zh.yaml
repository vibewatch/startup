      - number: '7.5'
        title: 缓释、监控和否决标准
        blocks:
          - type: paragraph
            body: >-
              Omio 确有可见缓释项。ORR 流程以具体费用展示调整收尾，而不是开放式执法。公司已经从直接消费者预订分散到 B2B、白标、SMB 和会员产品。它还在 2024 年达到盈利，之后才叠加 Hercules
              融资额度；这比用债务资助仍未验证的复苏更好。这些都是有意义的正面因素。但未解决的尽调问题仍然不少：合作伙伴集中度、客服 SLA
              表现、拒付和欺诈率、债务契约，以及按渠道拆分的留存经济性，都没有出现在抓取来源中。因此，正确的承销姿态不是假设隐藏失败，而是定义清晰的风险重估触发器。新的费用透明度争议、披露的隐私事件、头部合作伙伴流失，或支持质量崩塌，都会快速传导到信任和转化。同样，若再融资出问题，或有证据显示
              Omio Business 和 B2B 吸收了不成比例的支持成本，分散化论点会被削弱。带着这些风险，公司仍可能可投，但前提是这些触发器被明确监控，信息缺口在尽调中补齐。
