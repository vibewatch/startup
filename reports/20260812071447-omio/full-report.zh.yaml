      - CV006
      - CV024
      - CV025
      - CV028
      - CV029
      - CV030
      - CV031
      - CV032
      - CV033
      - CV034
  - id: TV003
    title: 乐观 / 基准 / 悲观场景表
    columns:
      - 场景
      - 估值区间
      - 核心假设
      - 概率信号
      - 关键风险
    rows:
      - - 乐观
        - $0.95B-$1.25B
        - 收入明显高于当前第三方估计；2024 年盈利可持续性得到验证；合作伙伴和 SMB 多元化跑通
        - 有可能，但需要直接尽调确认
        - 当前价格已接近该区间
      - - 基准
        - $0.60B-$0.85B
        - Omio 仍具战略相关性并保持增长，但在披露和经济性改善前，估值仍低于当前估值标记
        - 最能被公开证据支撑
        - 没有硬 KPI 披露，溢价会压缩
      - - 悲观
        - $0.35B-$0.55B
        - 上市可比公司的估值引力占上风；客服 / 监管摩擦或合作伙伴问题延续；债务不透明让投资人担忧
        - 如果信任或融资叙事转弱，该情形可信
        - 估值重置不必等到业务失败
      - - 上调触发条件
        - 持续支撑 >$1.0B
        - 核实年收入 >$100M，且债务和留存披露清晰
        - 需要直接尽调
        - 否则故事仍跑在证据前面
      - - 下调触发条件
        - 应低于 $0.50B
        - 出现合作伙伴流失、定价审视再起或盈利能力减弱的证据
        - 私募轮中可能很快发生
        - 变现太薄，承受不起信任冲击
    notes: 区间是基于公开证据的启发式企业价值 / 股权价值参考，不是 DCF 输出。用途是检验价格纪律。
    claimRefs:
