      - number: '4.2'
        title: 牵引力、交易量与公开收入信号
        blocks:
          - type: paragraph
            body: >-
              围绕 Omio 最强的公开财务证据，是运营规模，而不是 GAAP 式收入。2024 年 12 月，公司称自己已经实现 EBITDA 盈利，app 同比增长 30%，票务销售额超过 $1 billion，年访客达到
              9 亿、行程搜索超过 10 亿次、每日售出票数 80,000 张。2026 年 3 月战略发布又提高了运营表述，称年用户超过 10 亿、日活跃旅客超过 100,000、覆盖 46 个国家、员工超过 430
              人。已抓取来源中唯一明确的公开收入估计来自 GetLatka，其称 2025 年收入为 $64.5 million ARR，高于 2024 年的 $38.1
              million。这个估计可作为粗颗粒锚点，但不是管理层备案数据。主要分析含义是，Omio
              披露了大量交易量代理指标，却很少披露确认收入细节。投资人能看到吞吐量和用户活动，却看不清其中多少是净收入、代收代付票面额，或低利润合作伙伴经济。这一缺口是公司的核心财务张力。
