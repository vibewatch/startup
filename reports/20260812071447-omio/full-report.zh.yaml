  - id: FR003
    title: 依赖图
    type: dag
    layout: wide
    summary: Omio 依赖承运商、品牌伙伴、支付通道和监管方，把发现转化为完成的行程。
    data:
      nodes:
        - id: omio
          label: Omio
          detail: 多模式预订和分销平台
          tone: neutral
        - id: carriers
          label: 承运商 / 运营商
          detail: 底层铁路、巴士、渡轮和航空库存
          tone: warning
        - id: partners
