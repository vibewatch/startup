      - number: '8.5'
        title: 尽调问题、退出准备度和论点破坏标准
        blocks:
          - type: paragraph
            body: >-
              最后一道承销门槛不是想象力，而是验证。Omio 的证据足以值得认真关注，但仅靠公开来源，还不足以在当前价格下闭合尽调回路。投资者需要更清晰地看到分部收入、合作伙伴集中度、按渠道留存、支持与退款指标，以及
              Hercules 债务契约的实际条款。这些问题重要，因为相对于流量和票务销售规模，Omio
              的变现层看起来较薄；支持成本、合作伙伴经济性或合规负担的细小变化，都可能对股权价值产生放大影响。退出准备度也仍然更偏推测而非明确。卖给更大的 OTA、旅游科技平台或出行技术栈具有想象空间，但抓取材料没有显示近期
              IPO 准备迹象。因此，最重要的论点破坏标准落在运营和财务上：如果信任、集中度或债务灵活性假设恶化，倍数应迅速重置。在这些缺口补齐前，入场纪律应比故事本身诱导的水平更严格。
