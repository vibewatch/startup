      - number: '3.2'
        title: 能力、分发与细分板块对比
        blocks:
          - type: paragraph
            body: >-
              与 Trainline 的直接比较，是最清晰的战略基准。Trainline 具备上市公司规模、2,700 万活跃客户基础，以及作为欧洲下载量最高铁路 app 的分发强度，但其公开产品仍以火车和巴士为中心。Omio
              用更宽的交通方式覆盖和更宽的集团架构回应，后者包括 Rome2Rio、Omio B2B 和 Omio Business。Rail Europe
              是专营玩家，而不是完整多交通方式同业：在铁路深度、通票熟悉度和铁路专属信任最重要的场景，它很可能胜出。Wanderu 介于两端，巴士和火车路线数量很大，且有强“比价即预订”承诺；CheckMyBus
              则由巴士主导，因此更窄。关键结果是，Omio
              的竞争胜利条件是“广度加可接受信任”：它必须足够宽，才能证明一站式规划有价值；又不能宽到过于泛化，让专营玩家或直营运营商在清晰度或信心上赢走用户。另一种读法是，每个竞争者都集中服务旅客的不同捷径：Trainline
              押铁路 app 习惯，Rail Europe 押铁路信任，Wanderu 押路线库存和比价预订便利，Rome2Rio 押灵感加规划。Omio 的负担是让广度显得更简单，而不是更重。
