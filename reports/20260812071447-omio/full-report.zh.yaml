    title: 风险传导图
    type: dag
    layout: wide
    summary: 消费者法、支持、合作伙伴和债务冲击都会迅速传导到信任、利润率和估值。
    data:
      nodes:
        - id: fee_issue
          label: 费用透明度倒退
          detail: 定价或预订费披露低于当前标准
          tone: negative
        - id: support_spike
          label: 支持 / 退款激增
          detail: 中断或政策摩擦压垮购后支持
          tone: negative
        - id: partner_loss
          label: 合作伙伴或承运商流失
          detail: 关键库存或渠道依赖削弱
          tone: negative
        - id: debt_stress
          label: 债务压力
          detail: 出现契约、到期或再融资问题
          tone: negative
        - id: trust_loss
          label: 旅客信任流失
          detail: 转化和复购使用走弱
          tone: negative
        - id: margin_pressure
          label: 利润率压力
          detail: 支持、支付和商业成本吃掉经济性
          tone: warning
        - id: valuation_reset
          label: 估值重置
          detail: 投资者按更低收入质量重新定价
          tone: negative
        - id: thesis_break
          label: 投资逻辑破裂
          detail: 多元化不再抵消信任和依赖风险
          tone: negative
      edges:
        - from: fee_issue
          to: trust_loss
          label: 客户质疑公平性
        - from: support_spike
          to: trust_loss
          label: 解决不佳伤害复购
        - from: partner_loss
          to: margin_pressure
          label: 组合或转化恶化
        - from: debt_stress
          to: valuation_reset
          label: 融资灵活性收窄
        - from: trust_loss
          to: margin_pressure
          label: 复购降低且服务成本增加
        - from: margin_pressure
          to: valuation_reset
          label: 单薄变现显得更弱
        - from: valuation_reset
