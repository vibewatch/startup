    title: 推荐逻辑
    type: flow
    layout: wide
    summary: 推荐逻辑从真实战略验证出发，经过公开可比公司错配，最后落到估值审慎的结论。
    data:
      nodes:
        - id: n1
          label: 真实多式联运平台
          description: 消费者应用、合作伙伴分发、SMB 和 B2B 触点都能在公开渠道看到
        - id: n2
          label: 2024 年盈利与规模信号
          description: 公司称已盈利，票务销售额超过 $1B，并继续扩张
        - id: n3
          label: 审计披露稀疏
          description: 收入、债务、留存和客户集中度仍有一部分只能估算
        - id: n4
          label: 公开可比公司缺口
          description: 隐含 15.5x 收入倍数，远高于 0.3x-6.0x 的公开区间
        - id: n5
          label: 风险回报对价格敏感
          description: 战略上行存在，但当前入场价几乎不给犯错空间
        - id: n6
          label: 跟踪 / 继续研究
          description: 价格更低或尽调证据更扎实后，才应上调评级
