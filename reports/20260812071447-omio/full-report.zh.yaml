            body: >-
              Omio 的资本结构看起来足以支持扩张，但透明度不足，难以舒服建模。最强的官方融资事实，是 2024 年 12 月在年末盈利消息中一并宣布的 $120 million Hercules Capital
              工具。管理层把这笔资本直接绑定未来增长，尤其是东南亚扩张；这意味着公司从疫情冲击中恢复后，有意愿使用债务。挑战在于，市场数据库对生命周期融资额分歧很大：Tracxn 显示约 $486
              million，Seedtable 约 $459 million，GetLatka 约 $596 million，InforCapital 约 $606
              million。这个差距大到不能忽略，可能反映了各方对债务、二级资本和后续战略轮的处理不同。运营上，随着平台变宽，Omio 也在增加新义务：Omio Flex
              意味着潜在退款支出；白标增长意味着更多集成和支持工作；地域扩张意味着更多合规和本地化成本。盈利降低了近期压力，但缺少现金、烧钱、契约或到期细节，投资人仍无法仅凭公开信息证明资金续航。
