      - number: '1.3'
        title: 融资路径、投资人基础与资本背景
        blocks:
          - type: paragraph
            body: >-
              Omio 的融资史显示，公司反复借助外部资本扩大供给覆盖、地理边界，最终扩大集团范围。TechCrunch 记录了 2015 年 Goldman 领投的 $45 million Series B、2016 年
              Silver Lake Kraftwerk 和 Kleiner Perkins 领投的 $70 million Series C，以及 Kinnevik 和 Temasek 参与的 2018 年 $150
              million 融资，使累计融资接近 $300 million。后续数据库又加入了 2022 年 Lazard Asset Management 领投的 $80 million 融资、2024 年 12 月
              Hercules Capital 债务工具，以及 2026 年 7 月 Granite-Integral 战略投资。主要警示不在于 Omio
              能不能融资；它显然可以。问题在于公开数据库对累计融资额分歧很大，对新资本的分类也不同。根据来源和纳入口径，总融资额大约在 $459 million 到 $606 million 之间，而外部估值引用在 2024
              年债务融资后集中在约 $1 billion。对一家私营成长型公司来说，这种差异可以容忍；但若承销依赖股权结构精度，缺少管理层确认就不够。
