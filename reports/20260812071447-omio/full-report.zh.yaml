      - number: '5.3'
        title: B2B、商务差旅与发现扩张
        blocks:
          - type: paragraph
            body: >-
              2026 年，Omio 的产品范围明显变宽。Omio B2B 现在对外销售即插即用 API 和白标选项、深链或嵌入式旅程、本地化语言和货币流程，以及搜索时点的集成，包括 Google Travel
              小组件。公司明确表示，Uber、Google、KAYAK、TUI 和 easyGroup 等合作伙伴用这些工具，在自己的品牌下分发旅行库存。Omio Business 随后把同一套库存和预订逻辑延伸到 SMB
