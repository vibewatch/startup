      - number: '2.3'
        title: 增长驱动与约束
        blocks:
          - type: paragraph
            body: >-
              需求侧有利。官方和行业来源都指向移动优先预订、旅行持续复苏，以及对无缝、可持续多交通方式行程的兴趣升温。2025 年欧盟委员会调查发现，76% 的受访者已经使用在线预订服务；IMARC 和 Research
              and Markets 也都把数字化、移动端和个性化列为核心增长驱动。但同一批来源也解释了这个市场为什么结构上难做。36% 的受访欧洲人仍难以预订组合交通方式行程，31%
              因流程过于复杂而回避这类行程；来自行业一线的批评者还认为，2026
              年旅客一揽子方案仍未实现真正的多交通方式互操作。运营商系统割裂、数据质量参差、流量获客成本膨胀、退款处理含混，仍会实实在在拖累转化。实际含义是，市场可以增长，却仍会惩罚执行差的玩家：同一种复杂度既创造 Omio
              的价值主张，也带来运营负担；如果产品体验差，它会吃掉利润并破坏信任。
