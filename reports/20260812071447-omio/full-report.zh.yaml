      - number: '2.2'
        title: 买家、用户与采用路径
        blocks:
          - type: paragraph
            body: >-
              Omio 的主要用户仍是自主规划的休闲旅客，他们想比较跨境或多段选项，又不愿逐个访问运营商网站。在这个用例中，买家和用户通常合为一个人，家庭预算则承担付款。Omio Business
              引入了一个相邻板块：旅客仍是用户，但企业或自由职业者预算成为付款方，形成更结构化的流程和更接近企业采购的触发点。各板块共同的采用触发器不是对聚合商品牌的偏好，而是复杂度。行程跨运营商、货币、车站或交通方式，且直订搜索成本较高时，消费者才会选择多交通方式平台。欧洲旅行持续增长、日本作为长途客源市场的热度上升，都强化了数字化行程组合工具的需求；但
              Omio 的结构性需求来自简化碎片化供给，而不是转售通用旅行库存。因此，当美国、日本和东南亚市场呈现类似碎片化时，Omio 的命题也可以延伸过去。
