  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资建议和论点框架
        blocks:
          - type: paragraph
            body: >-
              现阶段对 Omio 最站得住脚的结论是跟踪 / 继续研究，而不是积极推荐；原因不是公司缺乏战略价值，而是按当前估值参照，公开证据不足以支撑干净的正面结论。Omio
              的真实资产很清楚：横跨铁路、巴士、航班和渡轮的多式库存；通过合作伙伴渠道嵌入分销；借 Omio Business 向 SMB 扩张；以及跨平台的从发现到预订故事。这些重要。2024
              年盈利口径也重要。但估值不是泛泛的质量打分，而是价格敏感判断。约 $1 billion
              的价格下，投资者要支付的倍数远高于同类上市旅游科技可比公司，同时还要接受第三方收入估算、不完整债务披露，以及未解决的客服和集中度问题。这种组合支持一种均衡立场：战略上正面，估值上谨慎，并且对更低进入价格或更充分尽调数据高度敏感。这是典型案例：公司质量可以真实存在，但入场纪律仍比热情更重要。
