company:
  name: Omio
chapter:
  number: 6
  title: Customers
  summary: Omio’s customer picture is broad but unevenly disclosed. Public evidence strongly supports a large self-serve leisure base, visible app adoption, and production partner demand from Uber, TUI, and easyTrain. Omio Business adds a new SMB work-travel segment with practical admin features. But there is little direct disclosure on cohort retention, customer concentration, or revenue by segment, so the customer story is strongest on usage breadth and weakest on monetization depth.
sections:
- id: customer-segments-and-buyer-map
  title: Customer Segments, Buyer Roles, and Use Cases
  body: >-
    Omio serves at least four meaningfully different customer groups. The core segment is still the
    self-directed traveler using Omio as a search, comparison, booking, and ticket-management layer across
    modes. In that segment, buyer, user, and payer usually collapse into the same individual or household.
    A second segment consists of travelers entering through partner channels such as Uber, TUI, and
    easyTrain, where Omio is often invisible to the end user but still powers the booking path. A third is
    the SMB or freelancer work-travel user targeted by Omio Business, where the traveler remains the user
    but the employer or budget owner becomes payer. A fourth, lighter segment is the repeat value-seeker
    addressed by Omio Savings Pass and related discounts. The common thread across segments is complexity.
    Omio wins when travelers or partners do not want to stitch together multiple operators, fare rules,
    currencies, or tickets manually. That buyer map is strategically attractive because it spreads demand
    across leisure, partner distribution, and work-travel use cases rather than relying on a single
    acquisition channel.
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
  - CU006
  - CU007
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: adoption-and-public-traction
  title: Adoption, Scale, and Public Usage Signals
  body: >-
    Omio discloses customer traction much more readily than retention. The company’s public surfaces point
    to millions of daily and monthly user interactions: the 2024 profitability announcement said Omio sold
    80,000 tickets daily and attracted 900 million annual visitors, while the 2026 strategy release lifted
    the framing to more than one billion annual users and more than 100,000 active travelers daily. On the
    consumer side, the iOS listing shows a 4.9 rating from 77,000 ratings, and the JustUseApp aggregator
    states 27 million monthly users, 22 million app downloads, and an analyzed review base of 74,493.
    These figures are not equivalent metrics and should not be blended into one funnel, but together they
    support real consumer usage at scale. Omio Business adds a more targeted adoption path: a UK launch,
    no-contract onboarding, secure payments, VAT invoices, and centralized booking history for small teams.
    The broader implication is that Omio has genuine user reach across both self-serve and partner-assisted
    channels, even if public denominator quality remains inconsistent.
  claimRefs:
  - CU008
  - CU009
  - CU010
  - CU011
  - CU012
  - CU013
  - CU014
  - CU015
  tableRefs:
  - TU002
  figureRefs:
  - FU002
- id: named-customer-proof-and-expansion
  title: Named Customer Proof and Expansion Loops
  body: >-
    The strongest named-customer proof comes from distribution partners rather than classic end-customer case
    studies. Uber is the clearest example: Omio’s API powers rail and coach inventory inside Uber, expanded
    from the UK into Spain, and one external market summary tied to the official announcement said the joint
    offering had reached one million rides by April 2024. TUI and easyTrain add two more proof points that
    matter for diligence because they validate different kinds of partner demand. TUI uses Omio for
    post-booking ground-transport ancillaries within a major leisure ecosystem, while easyTrain uses the
    white-label stack to distribute rail and bus options under the easy brand. These are not trivial logo
    placements; they are evidence that Omio’s content, checkout, and localization layers are usable in real
    customer-facing environments. The company also names Google, KAYAK, and LNER on B2B materials, which
    suggests a wider partner base, although those relationships are less concretely described in fetched
    source text than Uber, TUI, and easyTrain. Customer expansion, therefore, appears to happen through
    both consumer repeat usage and embedded partner distribution.
  claimRefs:
  - CU016
  - CU017
  - CU018
  - CU019
  - CU020
  - CU021
  - CU022
  tableRefs:
  - TU003
  figureRefs:
  - FU003
- id: satisfaction-retention-and-risk
  title: Satisfaction, Retention, and Concentration Risk
  body: >-
    Public satisfaction signals are mixed but net positive. Trustpilot surfaces recent stories of strong
    support, urgent changes handled well, and fast refunds in some cases, while negative reviews and third-
    party review aggregators also preserve complaints about ticket downloads, booking problems, and support
    friction. App-store ratings remain strong, which suggests many routine trips work well, but high ratings
    are not the same thing as enterprise-grade retention or cohort economics. Omio’s customer risk profile
    therefore has two layers. At the consumer level, the product seems broadly liked, but refund complexity
    and service burden can still damage trust. At the partner level, concentration risk is hard to quantify
    because public sources do not disclose revenue share by Uber, TUI, easyTrain, or any other major account.
    The same opacity exists for repeat booking behavior: Savings Pass signals an attempt to deepen loyalty,
    but no fetched source provided customer retention, repeat-booking frequency, churn, or segment-specific
    NPS. The practical outcome is that Omio’s customer proof is strong on visible activity and weak on
    durable monetization disclosure.
  claimRefs:
  - CU023
  - CU024
  - CU025
  - CU026
  - CU027
  - CU028
  - CU029
  - CU033
  - CU034
  tableRefs:
  - TU004
  - TU005
  figureRefs:
  - FU004
- id: customer-verdict
  title: Customer Verdict and Diligence Priorities
  body: >-
    The customer verdict is favorable with caveats. Omio has enough public evidence to show real adoption in
    leisure travel, app distribution, and partner-powered channels. It also has a credible angle into SMB
    work travel through Omio Business, and its partner ecosystem proves that some large brands trust the
    platform with real end-user traffic. What is missing is the depth investors would want for underwriting:
    segment revenue mix, cohort retention, account concentration, customer acquisition cost by segment, and
    net promoter or satisfaction data by channel. That means the customer base is believable, but the revenue
    quality of that base is still partially opaque. The key diligence priority is to convert public proof
    into segment economics—especially around repeat leisure usage, partner dependency, and whether Omio
    Business becomes a meaningful expansion vector or remains a niche adjacency.
  claimRefs:
  - CU018
  - CU024
  - CU028
  - CU030
  - CU031
  - CU032
