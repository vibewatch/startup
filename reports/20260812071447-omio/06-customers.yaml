- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - Omio Business
    - Could remain a niche UK SMB product if adoption is weak
    - Limits expansion beyond leisure/search use case
    - Track UK active accounts, spend per account, and market rollout pace
  - - Uber channel growth
    - A large platform partner can become a meaningful demand concentration point
    - Pricing or integration changes could affect volume sharply
    - Request revenue and booking share by top partner
  - - TUI and easyTrain expansion
    - White-label growth may cluster in a handful of large accounts
    - Good for reach, risky for partner bargaining power
    - Request top-10 B2B revenue concentration and renewal schedule
  - - Savings Pass loyalty
    - Could improve repeat usage or simply subsidize existing behavior
    - Affects customer quality and retention economics
    - Measure pass attach, renewal, and incremental trips per member
  - - Consumer support burden
    - Refund or ticketing friction can offset app goodwill
    - Weakens repeat purchase and brand advocacy
    - Track service contacts per booking and refund resolution time
  notes: The central customer risk is not lack of demand proof; it is lack of segment-level economics and concentration visibility.
