artifact: company-overview
slug: moneybox
runDate: 2026-10-25
company:
  name: Moneybox
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Moneybox is a founder-led UK savings and investing platform whose 2026
    employee secondary implied an £800 million (US$1.1 billion) valuation, but
    the transaction raised no new company capital. Public evidence supports
    substantial customer, asset and revenue scale while leaving the fully
    diluted cap table, independently reconciled funding total and current
    regulator-register record as material diligence gaps.
sections:
  - id: identity-and-business-model
    title: Identity and business model
    body: >-
      Digital Moneybox Limited is an active UK company incorporated on 18 May
      2015, while independent coverage describes Moneybox as founded and
      launched in 2016 by Ben Stanway and Charlie Mortimer. The distinction
      reconciles the legal-entity date with the consumer product's operating
      history. Moneybox began with automated round-ups and now offers a
      mobile-first suite spanning cash savings, ISAs, Lifetime ISAs, Junior
      ISAs, general investing, pensions and home-buying support. Independent
      reviewers consistently position the service toward beginners and simple
      goal-based wealth building rather than sophisticated trading, while its
      company-issued app listing identifies Digital Moneybox Limited and states
      its FCA authorisation numbers. The headquarters evidence supports London,
      but the public sources do not establish a complete location footprint.
    claimRefs: [CO001, CO002, CO005, CO006]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership and governance
    body: >-
      Founder continuity remains central to the operating model. Ben Stanway is
      identified in 2026 coverage as co-founder and executive chair, while
      Tracxn identifies Charlie Mortimer as co-founder and current CEO. That
      pairing provides strategic and operating continuity, but also creates
      key-person concentration because both founders remain in senior control
      roles more than a decade after incorporation. Tracxn reports a broader
      board, yet the assigned public evidence does not independently verify
      every director's current appointment, committee remit, investor
      representation or ownership rights. The leadership exhibit therefore
      covers only the two consistently evidenced founders rather than
      presenting a database-derived list as an exhaustive governance record.
    claimRefs: [CO002, CO003, CO004]
    tableRefs: [TO002]
  - id: capital-scale-and-valuation
    title: Capital, scale and valuation
    body: >-
      The July 2026 PISCES transaction priced Moneybox at £800 million
      (US$1.1 billion) through a planned £45 million sale of vested employee
      shares. It was a secondary liquidity event: no new shares or fresh
      company capital were involved. Independent reporting also describes more
      than 1.9 million customers, over £23 billion of assets under
      administration, revenue above £115 million in 2025 and a third
      consecutive profitable year. Tracxn separately reports 524 employees as
      of September 2026. Funding aggregates are not decision-grade: Tracxn says
      US$131 million across nine rounds, whereas Clay says US$213 million over
      eleven rounds and also derives at least £163 million from disclosed
      transactions. Secondary proceeds must not be treated as primary funding,
      so a cap-table and cash-flow reconciliation remains necessary.
    claimRefs: [CO007, CO008, CO009, CO010, CO011, CO012, CO013, CO014, CO015]
    tableRefs: [TO003]
  - id: milestones-and-diligence-implications
    title: Milestones and diligence implications
    body: >-
      Moneybox's public chronology shows a progression from 2015 incorporation
      and a 2016 consumer launch through institutional and community financing,
      a 2024 secondary, 2025 scale evidence and the 2026 PISCES liquidity event.
      The current valuation is therefore a meaningful price signal, but not a
      direct substitute for a competitively priced primary round: The Next Web
      and Tech Funding News both note the limited price history and thin trading
      context of the new market. Product reviews add a separate execution
      constraint, describing a deliberately simple proposition whose fee
      competitiveness and investment choice vary by customer profile. The
      diligence priority is to verify the fully diluted ownership, regulatory
      permissions, current management bench and post-secondary trading depth
      before treating the headline valuation or reported funding totals as
      settled facts.
    claimRefs: [CO001, CO002, CO006, CO007, CO008, CO015, CO016]
    figureRefs: [FO001]
