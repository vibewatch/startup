callouts:
  - calloutType: strength
    title: Profitable scale with long-duration assets
    body: >-
      Independent 2026 reporting relays more than 1.9 million customers, over
      £23 billion in assets under administration and a third consecutive
      profitable year, indicating a materially scaled consumer wealth platform.
    claimRefs: [CO009, CO010, CO011]
  - calloutType: risk
    title: Valuation signal is not primary-round price discovery
    body: >-
      The £800 million mark came from a permissioned employee secondary on a
      market with limited price history, so it neither added cash to Moneybox
      nor proves the same price would clear in a competitive primary financing.
    claimRefs: [CO007, CO008, CO016]
