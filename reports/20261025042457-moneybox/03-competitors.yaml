    title: Competitor and substitute profile
    columns: [Competitor or substitute, Category, Target customer, Differentiation, Limitation or open question]
    rows:
      - [Moneybox, Direct digital wealth platform, "Beginner UK savers and investors", "Round-ups, low minimum, broad ISA/LISA/JISA/SIPP and cash coverage", "All-in cost and depth of investment choice vary by balance and account"]
      - [Wealthify, Direct ready-made portfolio platform, "Users wanting more portfolio tailoring", "Five risk-rated portfolios and five ethical portfolios in the cited comparison", "Minimum investment cited as £1,000 for ISA/JISA and £5,000 for GIA/SIPP"]
      - [J.P. Morgan Personal Investing, Incumbent digital wealth platform, "Users seeking guided portfolios with a major-bank brand", "Broad wrappers, multiple portfolio styles, and JPMorgan Chase ownership", "Investment choice and app transactions remain limited in the cited review"]
      - [Plum, Behavioural savings substitute, "Users wanting automated saving", "The Boring Money review contrasts its algorithms with Moneybox's round-ups", "Does not offer the same cited combination of Moneybox tax wrappers"]
      - [Traditional banks, Incumbent cash substitute, "Cash-first savers", "Existing banking relationship and cash access", "May lack Moneybox's investing habit loop and wrapper breadth"]
      - [DIY brokers, Specialist investment substitute, "Experienced and research-led investors", "Broader security selection and self-directed control", "Higher choice burden and potentially weaker beginner onboarding"]
    notes: "Profiles combine independent comparison/review descriptions and are not a complete market census; unavailable competitor pricing or product facts remain open rather than inferred."
    claimRefs: [CP001, CP002, CP003, CP004, CP007, CP015]
  - id: TP002
    title: Capability and trust matrix
    columns: [Buying criterion, Moneybox evidence, Competitive implication, Confidence]
    rows:
      - [Wrapper breadth, "Cash ISA, Cash LISA, Stocks and Shares ISA, Stocks and Shares LISA, JISA, GIA and SIPP are listed across the assigned sources", "Strong cross-goal coverage for UK household wealth workflows", high]
      - [Starting friction, "£1 minimum investment is reported by Money To The Masses and official app copy", "Supports beginner acquisition and small-balance experimentation", high]
      - [Portfolio choice, "Moneybox is described as three streamlined portfolios or a limited range; Wealthify is described as five risk-rated portfolios", "Moneybox wins simplicity; rivals can win customisation", medium]
      - [Habit automation, "Round-ups and regular/payday contributions are described in reviews and official app copy", "Behavioural loop can improve retention and recurring deposits", high]
      - [Regulatory trust, "FCA authorisation and FSCS protection are described by official and third-party sources", "Baseline trust requirement, not a unique differentiator", high]
      - [Investment depth, "Reviews state the range is limited and not ideal for users wanting research or broad choice", "Experienced users remain vulnerable to migration", medium]
    notes: "A cell marked as a capability is source-backed only to the extent stated in the cited claim; this is not a product certification or a complete feature audit."
    claimRefs: [CP005, CP006, CP007, CP008, CP009]
  - id: TP003
    title: Pricing and switching-cost comparison
    columns: [Dimension, Moneybox, Rival or substitute signal, Competitive reading]
    rows:
      - [Minimum investment, "£1 reported", "Wealthify comparison cites £1,000 ISA/JISA and £5,000 GIA/SIPP minimums", "Moneybox has a clear low-balance acquisition advantage"]
      - [Recurring platform charge, "£1 per month plus 0.45% for many investment accounts; fund costs on top", "Wealthify comparison cites 0.60% flat fee for several accounts", "Headline percentage is favourable, but the fixed fee matters at small balances"]
      - [Portfolio breadth, "Three ready-made portfolios plus selected funds, ETFs and US stocks in cited reviews", "Wealthify comparison cites five risk-rated portfolios", "More choice can attract experienced or higher-balance users"]
      - [Behavioural lock-in, "Round-ups, payday boosts, regular deposits, and multiple wrappers", "DIY brokers and bank accounts may not combine all cited tools", "Habit and account consolidation may raise switching friction"]
      - [Performance signal, "Cited review reports weaker 2025 returns than Wealthify across three matched categories", "Wealthify comparison reports 6.16% vs 4.6%, 10.38% vs 9.9%, and 13.81% vs 11.0%", "Directional adverse signal only; not a forward performance forecast"]
      - [Incumbent pricing, "Moneybox charges a fixed subscription plus a percentage fee on many investment accounts", "J.P. Morgan Personal Investing is cited at 0.45% for Fixed Allocation or 0.75% for managed portfolios below £100,000, without an additional account-type fee", "Incumbent economics vary by portfolio style and balance; realised customer cost is unknown"]
    notes: "Fees and returns are source-reported snapshots with different products, periods, and methodologies; they must not be treated as realised customer economics or a forecast."
    claimRefs: [CP010, CP011, CP012, CP013, CP014, CP015]

figures:
  - id: FP001
    title: Evidence-backed competitive positioning
    type: quadrant
    summary: "Ordinal map: x-axis is buyer control and investment choice; y-axis is onboarding simplicity and habit automation, each scored from 1 (low) to 4 (high)."
    data:
      points:
        - {label: Moneybox, x: 2, y: 2, note: "Low-friction, guided breadth; source-backed ordinal placement"}
        - {label: Wealthify, x: 3, y: 3, note: "More portfolio choice, higher cited minimums"}
        - {label: J.P. Morgan Personal Investing, x: 3, y: 3, note: "More portfolio styles and major-bank distribution; limited self-directed choice"}
        - {label: Plum, x: 1, y: 1, note: "Automated saving substitute; investment comparison is incomplete"}
        - {label: DIY brokers, x: 4, y: 4, note: "Higher control and choice; beginner workflow not evidenced here"}
        - {label: Traditional banks, x: 1, y: 3, note: "Cash relationship and access; investing breadth not evidenced here"}
    approximationNotes: "Coordinates are analyst ordinal placements from the cited capability evidence, not measured market scores; no ranking threshold or percentage is implied."
    claimRefs: [CP003, CP015, CP016]

callouts:
  - calloutType: strength
    title: Breadth plus low-friction entry
    body: "Moneybox combines a £1 starting point, round-ups, and multiple UK savings and investment wrappers, creating a coherent beginner proposition."
    claimRefs: [CP001, CP005, CP007]
  - calloutType: risk
    title: Balance-sensitive price pressure
    body: "The fixed subscription can erode returns for small balances, while larger customers may have more incentive to switch toward broader or lower-cost platforms."
    claimRefs: [CP010, CP011, CP012]
  - calloutType: insight
    title: Durability is behavioural, not informational
    body: "The evidence supports a habit and consolidation moat more strongly than a moat based on unique selection, research, or pricing, but public data does not quantify its persistence."
    claimRefs: [CP006, CP009, CP013, CP016]

