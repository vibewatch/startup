company:
  name: Moneybox
chapter:
  number: 6
  title: Customers
  summary: Moneybox reports substantial consumer reach, including more than 1.9 million opened accounts, 100,000 homes bought with its Lifetime ISA, and more than £16 billion of assets under administration. Independent review signals support ease of use and customer satisfaction, but the public evidence set does not disclose active-account, retention, cohort, revenue-concentration, or channel-concentration measures.
sections:
  - id: customer-segments
    title: Consumer segments and jobs to be done
    body: Moneybox serves individual UK consumers rather than an enterprise procurement market. The public product surface addresses cash savers, first-home savers, beginner investors, parents saving for children, and retirement savers, with the same person acting as buyer, user, and payer in most cases. Moneybox presents saving, investing, home-buying, and retirement products in one app, while Finder describes a low-friction investing start from £1. A competitor-authored comparison similarly positions the service around habitual saving and beginner-friendly long-term investing, but that comparison is not an independent benchmark. Public materials do not split customers, balances, or revenue across these segments.
    claimRefs: [CU004, CU005, CU012, CU013]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-and-scale
    title: Adoption scale and evidence quality
    body: The strongest scale evidence is company-issued. Moneybox says more than 1.9 million customers had opened an account as of July 2026, displays 100,000 homes bought with a Moneybox Lifetime ISA, and reports more than £16 billion of assets under administration. Those are meaningful reach and asset signals, but they use different units and cannot be combined into a conversion funnel. The Google Play listing provides a lower-bound distribution claim of more than one million UK users, while Trustpilot and Finder provide external satisfaction signals. None of these measures identifies funded accounts, monthly active users, contribution frequency, net inflows, product mix, or revenue per customer.
    claimRefs: [CU001, CU002, CU003, CU006, CU007, CU010, CU011]
    tableRefs: [TU002]
  - id: durability-and-friction
    title: Durability, service quality, and friction
    body: Review evidence is favorable overall but cannot substitute for retention data. Finder reports that 93% of its 2026 survey respondents would recommend Moneybox, and its review assigns strong ease-of-use and mobile-app scores. Trustpilot's archived snapshot also shows high aggregate satisfaction and describes frequent praise for app navigation and support. The same snapshot includes a complaint about delayed access to funds after repeated document requests and no clear decision timeline. Unbiased and InvestingBrokers separately describe possible withdrawal delays, while Kael Tripton argues that the subscription and platform-fee structure becomes less competitive at larger balances. These signals identify potential friction, not its prevalence or effect on churn.
    claimRefs: [CU007, CU008, CU009, CU010, CU011, CU014, CU015]
    tableRefs: [TU003]
  - id: expansion-and-concentration
    title: Expansion logic and unresolved concentration
    body: The plausible expansion loop begins with a simple savings or investment entry point, adds automated round-ups or payday contributions, and broadens into Cash ISAs, Stocks and Shares ISAs, Lifetime ISAs, pensions, and home-buying support. The 100,000-home claim suggests that at least one goal-oriented journey reaches a concrete milestone, but no public source quantifies cross-sell rates, repeat funding, or movement between products. The reviewed evidence also does not disclose NRR, GRR, churn, renewal, contract length, cohort retention, product-level ARPU, top-customer exposure, or acquisition-channel dependence. Because Moneybox is consumer-facing, concentration should be tested across balances, products, high-value cohorts, partner banks, and acquisition channels rather than inferred from the headline account count.
    claimRefs: [CU002, CU004, CU005, CU016]
