    notes: "The pool contains aggregate consumer proof rather than attributable named-customer case studies. It does not disclose contracts, balances, cohort retention, or independently audited outcomes."
    claimRefs: [CU002, CU007, CU008, CU009, CU010, CU011]
figures:
  - id: FU001
    title: Customer journey and expansion loop
    summary: Moneybox can lead a consumer from a low-friction entry product toward broader wealth goals, but public evidence does not quantify conversion or retention between stages.
    type: journey-map
    data:
      nodes:
        - id: discover
          label: Discover a goal
          value: "Save, invest, buy a first home, or prepare for retirement"
          touchpoints: ["Moneybox app", "Product and review pages"]
        - id: open
          label: Open an account
          value: "Mobile-led registration with products starting from £1"
          touchpoints: ["App download", "Cash or investment account selection"]
        - id: fund
          label: Build a habit
          value: "Bank transfer, round-ups, regular deposits, or payday boosts"
          touchpoints: ["Round ups", "Payday boost", "Recurring contributions"]
        - id: expand
          label: Add products
          value: "Cash ISA, Stocks and Shares ISA, LISA, GIA, Junior ISA, or pension"
          touchpoints: ["Savings", "Investing", "Home-buying", "Retirement"]
        - id: milestone
          label: Reach a milestone
          value: "Moneybox reports 100,000 homes bought with its Lifetime ISA"
          touchpoints: ["Deposit calculator", "Mortgage support"]
        - id: retain
          label: Retain and deepen
          value: "Public NRR, GRR, churn, cohort, and cross-sell metrics are unavailable"
          touchpoints: ["Support", "Withdrawals", "Ongoing contributions"]
    approximationNotes: "The nodes show an evidence-backed qualitative sequence, not measured conversion stages; no rates or value-proportional widths are implied."
    claimRefs: [CU002, CU004, CU005, CU009, CU012, CU014, CU016]
callouts:
  - calloutType: strength
    title: Scale spans several consumer goals
    body: Company-issued account, asset, and home-buying measures indicate a broad consumer platform rather than a single-purpose round-up app.
    claimRefs: [CU001, CU002, CU003, CU004]
  - calloutType: risk
    title: Reach does not establish durability
    body: Public satisfaction signals are favorable, but no retained source quantifies active use, repeat funding, retention, churn, cross-sell, or concentration.
    claimRefs: [CU007, CU010, CU011, CU016]
