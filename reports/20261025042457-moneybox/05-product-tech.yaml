    title: Product module and asset matrix
    columns: [Module or asset, User job, Public maturity/status, Differentiation, Diligence gap]
    rows:
      - ["Cash ISA", "Tax-efficient cash saving", "Listed on official product page", "Cash wrapper inside the same app", "Current rate and settlement controls"]
      - ["Lifetime ISA", "First-home or retirement saving", "Listed with 25% bonus and £4,000 annual contribution limit", "Goal-specific wrapper and calculator tools", "Active-account and withdrawal outcome data"]
      - ["Stocks and Shares ISA", "Long-term investing", "Listed with Cautious/Balanced/Adventurous options", "Curated entry points and round-ups", "Portfolio construction and suitability evidence"]
      - ["Personal Pension", "Pension consolidation and contributions", "Listed with provider-search and 25% tax relief", "Combines pension discovery with investing", "Transfer exceptions and processing metrics"]
    notes: Product availability and stated features are sourced from public pages; the matrix does not establish active usage, realized performance, or current terms for every account.
    claimRefs: [CE001, CE002, CE003, CE004]
  - id: TE002
    title: Workflow and use-case table
    columns: [User job, Current workflow, Company solution, Measurable benefit, Limitation]
    rows:
      - [Build a saving habit, Link bank or card and round purchases, Automatic round-ups to a chosen account, Reduces manual contribution decisions, No public cohort or incremental-save evidence]
      - [Make recurring contributions, Set payday or regular deposits, Automations and Direct Debit funding, Repeatable funding workflow, Failure and reconciliation timing undisclosed]
      - [Start investing, Select a curated risk option and fund from £1, Stocks and Shares ISA with three starting options, Low entry threshold, No independent return or suitability benchmark]
    notes: Workflow steps are public product descriptions; measurable benefits are framed as mechanisms rather than verified outcomes because denominators and performance data are not disclosed.
    claimRefs: [CE005, CE006, CE007, CE008]
  - id: TE003
    title: Technology and operating architecture
    columns: [Layer or process, Role, Dependency, Risk or unknown]
    rows:
      - ["Mobile experience", "Account discovery", "Identity verification and app delivery", "Accessibility and release-quality metrics not public"]
      - ["Funding rails", "Bank transfer, Open Banking, and Direct Debit contributions", "Linked-bank and payment-provider availability", "Transfer failure and retry handling not public"]
      - ["Wrapper and ledger layer", "Separates ISA, pension, cash, and general investment journeys", "Tax and product-rule accuracy", "Reconciliation controls and exception rates not public"]
      - ["Custody and partner infrastructure", "Holds or routes cash and investments through regulated counterparties", "Counterparty and settlement operations", "Reconciliation and outage exposure"]
      - ["Security perimeter", "Protects personal information and regulated account access", "Encryption and FCA control environment", "Independent testing scope and incident history"]
      - ["Support and operations", "Handles withdrawals, pension transfers, and product exceptions", "Customer support and partner workflows", "Service levels and support cost by module"]
    notes: This is an evidence-bounded operating model inferred from disclosed workflows and protections; no source supplies a technical architecture diagram or service-level metrics.
    claimRefs: [CE005, CE009, CE010, CE011, CE012]
figures:
  - id: FE001
    title: Moneybox product operating stack
    type: stack
    summary: Moneybox combines a mobile goal-and-account experience with automated funding, regulated wrappers, and external financial infrastructure.
    data:
      layers:
        - label: Customer experience
          detail: One mobile-first surface for account discovery, goals, and product management.
          items:
            - label: Mobile account hub
              detail: Cash, ISA, pension, Junior ISA, and general investment journeys are presented in one app.
            - label: Goal tools
              detail: Lifetime ISA calculator, ISA time machine, and pension search are publicly described.
        - label: Contribution automation
          detail: Automated and recurring funding mechanisms connect customer activity to account contributions.
          items:
            - label: Round-ups
              detail: Linked spending is rounded to the nearest pound and spare change is transferred to a chosen account.
            - label: Recurring funding
              detail: Payday boosts, regular deposits, bank transfer, Open Banking, and Direct Debit are described.
        - label: Product wrappers
          detail: Tax-efficient and general investment products organize savings, investing, and pension use cases.
          items:
            - label: Tax-efficient accounts
              detail: Cash ISA, Stocks and Shares ISA, Lifetime ISA, Junior ISA, and pension products.
            - label: Flexible investing
              detail: General Investment Account and curated Cautious, Balanced, and Adventurous starting options.
        - label: Regulated infrastructure
          detail: Publicly disclosed control and counterparty boundary; quantitative resilience evidence is not available in the assigned pool.
          items:
            - label: Partner dependencies
              detail: Bank, investment-provider, payment, tax, and compensation dependencies require operational diligence.
            - label: Missing assurance
              detail: No assigned source provides independent uptime, recovery, penetration-test, or latency metrics.
        - label: Control perimeter
          detail: Moneybox discloses regulatory status, compensation-scheme language, encryption, and product-specific risk warnings.
          items:
            - label: Partner banks and investment providers
              detail: Cash savings use partner banks; fund-provider costs and regulated investment protection are disclosed.
        - label: Operating assurance
          detail: Public evidence does not establish service levels, incident response, or release-quality metrics.
          items:
            - label: Evidence request
              detail: Obtain architecture, security, recovery, support, and reconciliation artefacts before underwriting maturity.
    approximationNotes: The stack is an evidence-bounded operating model, not a disclosed software architecture; dependency boundaries and technical performance require verification.
    claimRefs: [CE001, CE005, CE009, CE010, CE011, CE012]
