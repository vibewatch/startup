  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              Moneybox should be evaluated as a UK direct-to-consumer wealth platform, not as a micro-investing app or a
              generic global fintech. Its addressable workflows span cash saving, tax-sheltered investing, first-home
              saving, pension consolidation, and mortgage support. That breadth expands the potential relationship but
              also places Moneybox against several status-quo substitutes: bank savings accounts, manual transfers,
              workplace pensions, incumbent investment platforms, direct fund providers, and mortgage brokers. Round-ups
              and a £1 starting point lower the behavioural barrier to entry; they do not eliminate the economic
              comparison with lower-cost investment platforms. The practical market boundary is therefore UK retail
              customers who value automation and consolidation enough to accept product-specific fees and restrictions,
              rather than every UK household with financial assets.
            claimRefs:
              - CM001
              - CM002
              - CM011
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM013
              - CM015
      - number: '2.2'
        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports several non-additive sizing lenses rather than a single TAM/SAM/SOM headline. The
              Lifetime ISA niche reached roughly two million adult holders in 2024 and £2.35 billion of annual
              subscriptions in 2023/24, while the wider online investing category is described through a substantial
              2026 consumer and platform research base without publishing a free aggregate market value. Household
              disposable income also constrains investable capacity and varies materially by income quintile. Against
              those category indicators, Moneybox had crossed one million customers and £10 billion of AUA by late 2024,
              with the company reporting 1.3 million customers and £11.7 billion of AUA at December 2024. These figures
              establish scale, but they cannot be converted into market share or SOM because category denominators,
              unique funded accounts, product-level AUA, and overlap among account holders are not disclosed.
            claimRefs:
              - CM005
              - CM006
              - CM008
              - CM009
              - CM010
              - CM014
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM008
              - CM009
              - CM010
              - CM014
          - type: figure
            figureRef: FM001
            claimRefs:
