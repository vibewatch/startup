  - id: FE001
    title: Moneybox product operating stack
    type: stack
    summary: >-
      Moneybox combines a mobile goal-and-account experience with automated funding, regulated wrappers, and external
      financial infrastructure.
    data:
      layers:
        - label: Customer experience
          detail: One mobile-first surface for account discovery, goals, and product management.
          items:
            - label: Mobile account hub
              detail: Cash, ISA, pension, Junior ISA, and general investment journeys are presented in one app.
            - label: Goal tools
              detail: Lifetime ISA calculator, ISA time machine, and pension search are publicly described.
        - label: Contribution automation
          detail: Automated and recurring funding mechanisms connect customer activity to account contributions.
          items:
            - label: Round-ups
              detail: Linked spending is rounded to the nearest pound and spare change is transferred to a chosen account.
            - label: Recurring funding
              detail: Payday boosts, regular deposits, bank transfer, Open Banking, and Direct Debit are described.
        - label: Product wrappers
          detail: Tax-efficient and general investment products organize savings, investing, and pension use cases.
          items:
            - label: Tax-efficient accounts
              detail: Cash ISA, Stocks and Shares ISA, Lifetime ISA, Junior ISA, and pension products.
            - label: Flexible investing
              detail: General Investment Account and curated Cautious, Balanced, and Adventurous starting options.
        - label: Regulated infrastructure
          detail: >-
            Publicly disclosed control and counterparty boundary; quantitative resilience evidence is not available in
            the assigned pool.
          items:
            - label: Partner dependencies
              detail: Bank, investment-provider, payment, tax, and compensation dependencies require operational diligence.
            - label: Missing assurance
              detail: No assigned source provides independent uptime, recovery, penetration-test, or latency metrics.
        - label: Control perimeter
          detail: >-
            Moneybox discloses regulatory status, compensation-scheme language, encryption, and product-specific risk
            warnings.
          items:
            - label: Partner banks and investment providers
              detail: Cash savings use partner banks; fund-provider costs and regulated investment protection are disclosed.
        - label: Operating assurance
          detail: Public evidence does not establish service levels, incident response, or release-quality metrics.
          items:
            - label: Evidence request
              detail: >-
                Obtain architecture, security, recovery, support, and reconciliation artefacts before underwriting
                maturity.
    approximationNotes: >-
      The stack is an evidence-bounded operating model, not a disclosed software architecture; dependency boundaries and
      technical performance require verification.
    claimRefs:
      - CE001
      - CE005
      - CE009
      - CE010
      - CE011
      - CE012
