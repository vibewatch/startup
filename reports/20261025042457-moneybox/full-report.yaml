      - number: '2.3'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The core user and payer is usually the same retail customer, but purchase logic differs sharply by goal.
              First-time savers and novice investors buy convenience and habit formation; first-home buyers respond to
              the LISA bonus but must accept eligibility, property-price, and withdrawal constraints; pension
              consolidators seek account aggregation; and larger DIY investors compare total fees and breadth against
              specialist platforms. Evidence from Boring Money indicates that the current online-investing “third wave”
              skews toward cautious 35-to-44-year-olds, reinforcing a need for trust, transparent pricing, and guidance
              rather than trading complexity. Adoption can begin with round-ups or cash saving, then deepen through tax
              wrappers and pensions, but public data do not show the conversion rate between those stages.
            claimRefs:
              - CM003
              - CM004
              - CM011
              - CM013
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM003
              - CM011
              - CM013
              - CM015
              - CM016
      - number: '2.4'
        title: Growth drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              The strongest demand drivers are tax-efficient wrappers, the 25% LISA bonus, app-based automation, low
              starting amounts, and the ability to consolidate several financial goals. Moneybox's 2024 scale and
              company-reported 2025 inflows indicate that these drivers can produce both acquisition and asset
              deepening. The constraints are equally material. Fixed subscription charges weigh most heavily on very
              small investment balances, percentage platform and fund charges become more visible as portfolios grow,
              and LISA withdrawal penalties can make the product unsuitable for customers needing liquidity. Income
              dispersion limits the savings capacity of the mass market, while regulation can reshape guidance-led
              acquisition funnels. For valuation, durable upside depends less on the broad number of UK savers than on
              funded customer retention, product cross-sell, net inflows, and fee realization—metrics that remain only
              partially public.
            claimRefs:
              - CM004
              - CM007
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
              - CM016
