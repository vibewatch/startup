    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              Digital Moneybox Limited is an active UK company incorporated on 18 May 2015, while independent coverage
              describes Moneybox as founded and launched in 2016 by Ben Stanway and Charlie Mortimer. The distinction
              reconciles the legal-entity date with the consumer product's operating history. Moneybox began with
              automated round-ups and now offers a mobile-first suite spanning cash savings, ISAs, Lifetime ISAs, Junior
              ISAs, general investing, pensions and home-buying support. Independent reviewers consistently position the
              service toward beginners and simple goal-based wealth building rather than sophisticated trading, while
              its company-issued app listing identifies Digital Moneybox Limited and states its FCA authorisation
              numbers. The headquarters evidence supports London, but the public sources do not establish a complete
              location footprint.
