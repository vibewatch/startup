  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization
        blocks:
          - type: paragraph
            body: >-
              Moneybox monetizes a multi-product wealth platform rather than a single trading feature. Its own 2025
              release describes savings, investing, pensions, home-buying workflows and AI-enabled guidance, while the
              app listing states that investment products carry a £1 monthly subscription and a 0.45% annual fee on
              invested value, with fund provider costs on top. Independent reviews describe the round-up and
              beginner-led workflow as the entry point, but also flag that the fixed subscription is expensive for small
              balances and that the investment selection is constrained. This supports recurring platform and
              asset-linked revenue as a mechanism, not an assertion of ARR: Moneybox does not publicly disclose revenue
              by product, customer cohort, or realized fee yield.
