      - number: '1.3'
        title: Capital, scale and valuation
        blocks:
          - type: paragraph
            body: >-
              The July 2026 PISCES transaction priced Moneybox at £800 million (US$1.1 billion) through a planned £45
              million sale of vested employee shares. It was a secondary liquidity event: no new shares or fresh company
              capital were involved. Independent reporting also describes more than 1.9 million customers, over £23
              billion of assets under administration, revenue above £115 million in 2025 and a third consecutive
              profitable year. Tracxn separately reports 524 employees as of September 2026. Funding aggregates are not
              decision-grade: Tracxn says US$131 million across nine rounds, whereas Clay says US$213 million over
              eleven rounds and also derives at least £163 million from disclosed transactions. Secondary proceeds must
              not be treated as primary funding, so a cap-table and cash-flow reconciliation remains necessary.
