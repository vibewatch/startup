  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Customer product surface
        blocks:
          - type: paragraph
            body: >-
              Moneybox presents one mobile-first surface for multiple financial jobs rather than a single investment
              SKU. Its official app listing names Cash ISAs, a Lifetime ISA, Stocks and Shares ISA, General Investment
              Account, Junior ISA, Personal Pension, and savings accounts, while an independent Q&A source also
              describes a Cash ISA, pension, Junior ISA, and general investment account in the same app. The product
              logic is therefore account-wrapper and goal oriented: users can save for a first home, invest for the long
              term, or consolidate pensions without changing the front-end relationship. The breadth is commercially
              useful, but the evidence does not show how many users actively use each module or whether all listed
              products remain available on identical terms at the run date.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
      - number: '5.2'
        title: Contribution and investment workflow
        blocks:
          - type: paragraph
            body: >-
              The documented workflow is deliberately low-friction. Users complete identity verification, fund accounts
              by bank transfer, Open Banking payment, or Direct Debit, and can link a current account or card so
              purchases are rounded to the nearest pound. Moneybox says it supports payday automations, regular
              deposits, round-ups, and investing from £1; its official page also describes three curated starting
              options named Cautious, Balanced, and Adventurous. These are product mechanics, not proof of portfolio
              performance. The workflow depends on linked-bank connectivity, payment processing, partner-bank
              settlement, and suitable tax-wrapper rules, so diligence should test failure handling, reconciliation
              timing, and the controls applied when a transfer, withdrawal, or pension transfer is delayed.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE002
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
      - number: '5.3'
        title: Architecture, controls, and maturity
        blocks:
          - type: paragraph
            body: >-
              Public evidence gives only a partial architecture view. The official surface discloses FCA authorisation,
              separate fee layers, bank-level 256-bit encryption, and fund-provider costs, while FSCS explains that
              investment protection depends on an authorised provider and regulated activity and does not cover poor
              investment performance. A third-party review describes the platform as mobile-first and refers to
              client-asset segregation, but those statements are not an independent technical audit. The product
              therefore appears operationally integrated across regulated wrappers, partner banks, custodial or fund
              infrastructure, and payment rails; however, no assigned source provides uptime, incident history, recovery
              objectives, penetration-test results, API documentation, or quantitative processing latency. Those missing
              artefacts limit confidence in technical maturity.
