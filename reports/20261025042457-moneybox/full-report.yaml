      - number: '4.2'
        title: Growth, cost structure and margin path
        blocks:
          - type: paragraph
            body: >-
              The strongest public financial datapoint is the 2025 reported result: revenue reached £115.6m, up 23% from
              £93.3m, while profit before tax was £14.9m versus £19.4m in 2024. City A.M. reports that annual costs
              exceeded £100m, up more than 23%, with £6.8m spent on software and platform development in the second half
              of 2025; it also describes the pre-tax margin narrowing to 13% from 21%. The combination is consistent
              with deliberate investment in automation, marketing and infrastructure, not with a mature steady-state
              margin. The official release reports £6.4bn of 2025 net inflows and £19bn of year-end AUA, but AUA and
              inflows are balance-sheet-adjacent activity measures, not revenue or gross profit. Public sources do not
              provide CAC, payback, gross margin reconciliation, servicing cost per account, or working-capital detail.
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
              - CI010
              - CI011
      - number: '4.3'
        title: Capital adequacy and underwriting gaps
        blocks:
          - type: paragraph
            body: >-
              Moneybox appears less dependent on primary fundraising than an early-stage fintech, but the evidence is
              not a substitute for a current cash-flow model. City A.M. reports capital resources of just under £60m
              after an £18.5m share buyback, while the London Stock Exchange describes a £45m permissioned employee
              auction at a valuation of approximately £800m. The latter is a secondary liquidity event, not cash raised
              for the company, and Moneybox explicitly said it was no longer reliant on raising primary capital to fund
              growth. Clay reports historical disclosed funding and a prior £550m valuation, but its aggregation is not
              audited financial reporting. The underwriting conclusion is therefore positive on demonstrated
              profitability and liquidity access, but incomplete on unrestricted cash, debt or project-finance
              obligations, regulated-capital headroom, future financing triggers, and whether 2026 growth converts into
              cash after marketing and technology investment.
