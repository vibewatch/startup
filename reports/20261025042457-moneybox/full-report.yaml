  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Customer saving and investing activity feeds Moneybox's fee-bearing platform, while product and cost disclosures
      determine the conversion from scale to profit.
    data:
      nodes:
        - id: customer-activity
          label: Customer contributions and AUA
          detail: £6.4bn 2025 net inflows and £19bn 2025 AUA reported by Moneybox
          value: £6.4bn / £19bn
          unit: reported activity
        - id: fee-bearing-products
          label: ISAs, pensions, investments and savings
          detail: Products span investment subscriptions, asset-linked fees and cash products
        - id: platform-revenue
          label: Platform revenue
          detail: £115.6m gross revenue in 2025; product mix not disclosed
          value: £115.6m
          unit: 2025 revenue
        - id: operating-costs
          label: Technology, marketing and operating costs
          detail: Annual costs exceeded £100m; £6.8m software/platform development in H2 2025
          value: '>£100m / £6.8m'
          unit: reported costs
        - id: profit-before-tax
          label: Profit before tax
          detail: £14.9m in 2025, down from £19.4m in 2024
          value: £14.9m
          unit: 2025 PBT
        - id: margin-pressure
          label: Margin pressure
          detail: Pre-tax margin narrowed to 13% from 21% as technology and marketing investment increased
          value: 13% vs 21%
          unit: reported pre-tax margin
      edges:
        - from: customer-activity
          to: fee-bearing-products
