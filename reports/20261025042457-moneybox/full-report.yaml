  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and buyer choice
        blocks:
          - type: paragraph
            body: >-
              Moneybox sits between a savings habit product, a digital investment platform, and a long-term wealth
              wrapper. Its direct alternatives include Wealthify and other ready-made portfolio services; its broader
              substitutes include Plum-style automated saving, J.P. Morgan Personal Investing, traditional banks and
              cash accounts, DIY brokers, and adviser-led pensions. The comparison evidence shows that Moneybox's
              distinctive job is not maximum choice: it combines cash savings, ISAs, a Lifetime ISA, a Junior ISA, a
              SIPP, round-ups, and guided portfolios in one mobile-first experience. That makes the product most
              relevant to first-time or low-confidence investors who value a single workflow over research depth. The
              same positioning leaves an opening for providers that offer broader portfolios, lower all-in fees, or more
              mature advice and trading tools.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP007
              - CP015
      - number: '3.2'
        title: Capability, trust, and distribution comparison
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a clear capability contrast. Moneybox offers a wider set of UK tax-advantaged
              wrappers than the Wealthify comparison, while Wealthify offers five risk-rated portfolios versus
              Moneybox's three. Moneybox's £1 minimum lowers acquisition friction, and round-ups plus payday automation
              create a distribution loop through everyday banking behaviour. Against that, reviewers describe a limited
              investment menu and weaker suitability for users who want to inspect or select many securities. FCA
              authorisation, FSCS references, and the official app's risk disclosures support a trust baseline, but they
              are table stakes rather than a unique moat: J.P. Morgan Personal Investing is also described as FCA
              regulated and FSCS-protected, while adding the distribution and brand support of JPMorgan Chase.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
          - type: table
            tableRef: TP002
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP003
              - CP015
              - CP016
      - number: '3.3'
        title: Pricing pressure and moat durability
        blocks:
          - type: paragraph
            body: >-
              Pricing is a material competitive pressure. Moneybox is reported at a £1 monthly subscription plus a 0.45%
              platform fee for many investment accounts, with fund costs on top; the SIPP has a different fee treatment.
              The Wealthify comparison says its 0.60% platform fee is higher than Moneybox's percentage fee, but also
              warns that Moneybox's subscription can erode returns for small portfolios. That means the competitive
              answer depends on balance size and product mix, not on a single headline percentage. Moneybox's moat is
              therefore more plausibly behavioural and distribution-led than data- or selection-led: habit formation,
              tax-wrapper breadth, accumulated balances, and cross-sell may raise switching costs, while a customer can
              still multi-home or move to a cheaper broker when balances become material. Public sources do not quantify
              churn, transfer-outs, or realised all-in fees, so the persistence of that behavioural advantage remains a
              data-room question rather than an established moat.
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
              - CP014
              - CP015
      - number: '3.4'
        title: Adverse evidence and strategic verdict
        blocks:
          - type: paragraph
            body: >-
              Adverse evidence is concentrated in the gap between beginner convenience and experienced-investor value.
              Independent reviews describe the underlying investments as basic, the platform as expensive for larger
              balances, and recent comparable performance as weaker than Wealthify across the cited 2025 portfolios.
              Those are not proof of future underperformance, and competitor comparison pages are not independent
              benchmarks; they do, however, identify credible displacement vectors. Traditional institutions can copy
              digital onboarding, J.P. Morgan can combine a familiar bank brand with broad wrappers, low-cost brokers
              can win price-sensitive balances, and robo-advisers can win customers seeking more portfolio choice.
              Moneybox's reported scale and product breadth make it a credible category participant, but durability
              depends on retaining the habit loop while improving economics and demonstrating outcomes after fees. The
              FCA's continuing Financial Lives survey also underscores that competition spans consumers' product
              holdings and firm relationships, not only app-level feature comparisons.
            claimRefs:
              - CP014
              - CP015
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Breadth plus low-friction entry
            body: >-
              Moneybox combines a £1 starting point, round-ups, and multiple UK savings and investment wrappers,
              creating a coherent beginner proposition.
            calloutType: strength
            claimRefs:
              - CP001
              - CP005
              - CP007
          - type: callout
            title: Balance-sensitive price pressure
            body: >-
              The fixed subscription can erode returns for small balances, while larger customers may have more
              incentive to switch toward broader or lower-cost platforms.
            calloutType: risk
            claimRefs:
              - CP010
              - CP011
              - CP012
          - type: callout
            title: Durability is behavioural, not informational
            body: >-
              The evidence supports a habit and consolidation moat more strongly than a moat based on unique selection,
              research, or pricing, but public data does not quantify its persistence.
            calloutType: insight
            claimRefs:
