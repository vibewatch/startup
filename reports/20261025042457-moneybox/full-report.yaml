        title: Leadership and governance
        blocks:
          - type: paragraph
            body: >-
              Founder continuity remains central to the operating model. Ben Stanway is identified in 2026 coverage as
              co-founder and executive chair, while Tracxn identifies Charlie Mortimer as co-founder and current CEO.
              That pairing provides strategic and operating continuity, but also creates key-person concentration
              because both founders remain in senior control roles more than a decade after incorporation. Tracxn
              reports a broader board, yet the assigned public evidence does not independently verify every director's
              current appointment, committee remit, investor representation or ownership rights. The leadership exhibit
              therefore covers only the two consistently evidenced founders rather than presenting a database-derived
              list as an exhaustive governance record.
