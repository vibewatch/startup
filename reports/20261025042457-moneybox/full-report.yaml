        blocks:
          - type: callout
            title: Public data do not support a precise SOM
            body: >-
              Do not convert Moneybox customer or AUA figures into market share without a matched denominator for unique
              funded UK retail accounts and assets across the same product set.
            calloutType: risk
            claimRefs:
