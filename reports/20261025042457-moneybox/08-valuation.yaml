schemaVersion: "report-v2"
artifact: valuation
slug: moneybox
runDate: 2026-10-25
company:
  name: Moneybox
chapter:
  number: 8
  title: Valuation
  summary: Moneybox has credible scale, profitable growth, and a completed £800 million secondary valuation, but public evidence does not disclose the cap table, preference stack, or enough product-level economics to support a buy call. The appropriate stance is track pending primary financial and transaction diligence.
sections:
  - id: investment-case
    title: Investment case and price signal
    body: >-
      Moneybox presents a stronger operating foundation than a typical early-stage
      consumer-fintech valuation story. Its Q2 2026 shareholder update reports £23.2
      billion of assets under administration, 1.9 million funded customers, £1.7
      billion of quarterly net inflows, £41.2 million of quarterly revenue, and a 98%
      gross-profit margin. The same update records a completed £45 million employee
      secondary transaction at an £800 million valuation, approximately 45% above the
      2024 valuation. The London Stock Exchange independently confirms the transaction
      mechanics and c.US$1.1 billion translated value. These are meaningful proof
      points for scale, liquidity access, and profitability, but the price is a
      secondary-market mark rather than a disclosed primary financing valuation.
    claimRefs: [CV001, CV002, CV003, CV004, CV005]
    tableRefs: [TV001]
  - id: thesis-antithesis
    title: Thesis, anti-thesis, and comparability
    body: >-
      The thesis is that Moneybox monetises a broad savings-and-investing relationship
      rather than a single round-up feature: the app spans cash ISAs, Lifetime ISAs,
      investment accounts, pensions, and home-buying workflows. Independent reviews
      consistently describe the product as effective for beginners and behavioural
      saving, while also identifying a 0.45% investment platform fee plus a £1 monthly
      subscription and extra fund or FX costs. That pricing can support revenue quality
      if customers retain balances, but it creates a ceiling against low-cost platforms
      as balances mature. Public funding databases also disagree on historical totals
      and round counts, so disclosed funding should not be used as a proxy for current
      valuation or cash available. Public comparables are directional only:
      Wealthsimple reported $155.6 billion of assets and 3.6 million clients in Canada,
      but its geography, product mix, currency basis, and undisclosed valuation multiple
      prevent a like-for-like valuation bridge to Moneybox.
    claimRefs: [CV006, CV007, CV008, CV009, CV010]
    tableRefs: [TV002]
  - id: scenarios-and-diligence
    title: Scenarios, exit readiness, and diligence
    body: >-
      A bull case requires Moneybox to convert customer and asset growth into durable
      fee revenue while preserving high margins and making the next liquidity event
      broader and more price-discoverable. The base case is a profitable private
      wealth platform whose £800 million mark is fair but not demonstrably cheap, with
      returns dependent on continued inflows, retention, and a future exit or secondary
      sale. The bear case is multiple compression or a down-round if growth slows,
      customers migrate to cheaper platforms, or liquidity remains episodic. Probability
      labels below are analytical signals, not model-derived odds, because public
      evidence does not provide ARPU, cohort retention, revenue mix, net cash, debt,
      liquidation preferences, or post-transaction buyer turnover. The investment
      decision should therefore remain conditional on primary diligence.
    claimRefs: [CV011, CV012, CV013, CV014, CV015, CV016]
    tableRefs: [TV003]
    figureRefs: [FV001]
tables:
  - id: TV001
    title: Recommendation summary
    columns: [Dimension, Evidence, Decision implication]
    rows:
      - [Recommendation, "Track", "Do not underwrite a buy at the £800m secondary mark without primary financial and cap-table evidence."]
      - [Confidence, "Medium", "Operating evidence is current, but valuation mechanics and product economics remain incomplete."]
      - [Risk rating, "Medium", "Execution and pricing risks are material; no public evidence here establishes a critical risk."]
      - [Valuation stance, "Fair", "The mark is supported by growth and profitability signals, not by a disclosed comparable or cash-flow model."]
    notes: "Recommendation synthesis from the cited Q2 2026 operating update, LSEG transaction release, and independent fee/funding references; no private cap-table or preference data was available."
    claimRefs: [CV001, CV004, CV007, CV011, CV016]
  - id: TV002
    title: Thesis / anti-thesis
    columns: [Argument, Supporting evidence, What would change the view]
    rows:
      - ["Scale and inflows support platform relevance", "£23.2bn AUA, 1.9m funded customers, and £1.7bn Q2 net inflows", "Cohort retention, net flows after Q2, and customer concentration"]
      - ["Profitability improves financing resilience", "Moneybox reports £41.2m Q2 revenue, 98% gross margin, and profitable growth", "Audited statements, cash conversion, and operating-cost trajectory"]
      - ["Secondary liquidity validates institutional demand", "£45m PISCES transaction at £800m, with institutional participation", "Auction depth, buyer mix, clearing price distribution, and repeat liquidity"]
      - ["Pricing can weaken mature-account economics", "Reviews report £1/month plus 0.45% platform fee and additional fund/FX costs", "ARPU, churn by balance cohort, fee waivers, and competitor pricing response"]
    notes: "Rows combine company/venue-reported metrics with independent review observations; fee observations are not audited unit economics and the transaction is secondary liquidity rather than primary capital."
    claimRefs: [CV001, CV002, CV004, CV006, CV007, CV008, CV010]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Explicit assumptions, Valuation / return logic, Probability signal, Downside trigger]
    rows:
      - [Bull, "AUA and funded-customer growth persists; gross margin stays near the reported 98%; broader secondary liquidity develops", "Current mark compounds through higher recurring fee revenue and a more liquid exit", "Medium", "Net inflows fall materially or margin compresses"]
      - [Base, "Profitability continues, but product economics and liquidity remain only partly disclosed", "£800m is a fair reference mark; upside requires operational delivery and a later price-discovery event", "High", "No transparent follow-on liquidity or weak cohort retention"]
      - [Bear, "Growth slows, fee-sensitive customers migrate, or market multiples compress", "Down-round or flat valuation becomes plausible; illiquidity increases holding-period risk", "Medium", "Down-round, regulatory friction, or sustained net outflows"]
      - [Diligence gate, "Audited accounts, cap table, preferences, ARPU, retention, and auction data are obtained", "Re-rate only after replacing public proxies with primary evidence", "Required", "Any material mismatch with reported operating metrics"]
    notes: "Scenario values are qualitative because public sources do not disclose enough inputs for a defensible point estimate; probability signals are judgmental labels, not statistical probabilities."
    claimRefs: [CV003, CV005, CV011, CV012, CV013, CV014, CV015, CV016]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: Operating scale and profitability support a fair valuation stance, while missing transaction and cohort evidence keeps the recommendation at track.
    data:
      nodes:
        - id: scale
          label: "Scale: £23.2bn AUA / 1.9m funded customers"
        - id: inflows
          label: "Growth: £1.7bn Q2 net inflows"
        - id: earnings
          label: "Economics: £41.2m Q2 revenue / 98% gross margin"
        - id: liquidity
          label: "Liquidity: £45m secondary at £800m"
        - id: gaps
          label: "Gaps: ARPU, retention, preferences, buyer mix"
        - id: decision
          label: "Decision: Track at a fair stance"
    claimRefs: [CV001, CV003, CV004, CV011, CV014, CV016]
callouts:
  - calloutType: recommendation
    title: Track, not buy
    body: >-
      The public record supports a credible, profitable platform and a meaningful
      liquidity event, but not a sufficiently transparent entry price. Revisit the
      recommendation after audited accounts, cohort economics, preference terms, and
      post-PISCES transaction data are obtained.
    claimRefs: [CV004, CV011, CV014, CV016]
  - calloutType: risk
    title: Secondary price is not cash raised
    body: >-
      The £45 million transaction value describes shares exchanged in a permissioned
      employee secondary auction. It should not be treated as new company cash or as
      proof that all shareholders can exit at the same price.
    claimRefs: [CV004, CV005, CV012]
