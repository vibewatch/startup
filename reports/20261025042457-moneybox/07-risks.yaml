callouts:
  - calloutType: risk
    title: Highest near-term risk
    body: >-
      Cash protection is not equivalent to a simple bank deposit guarantee: the customer-level FSCS limit aggregates balances by banking brand, while Moneybox routes cash through third-party banks. Management should prove allocation, reconciliation, and customer-warning controls before treating the protection model as low risk.
    claimRefs: [CR005, CR006]
  - calloutType: assumption
    title: Evidence boundary
    body: The assigned public sources do not establish Moneybox's incident frequency, outage history, fraud losses, or recovery-test performance. That absence is an unresolved diligence question, not evidence that no such event occurred.
    claimRefs: [CR014]
