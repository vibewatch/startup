    title: Regulatory / legal risk register
    columns: [Rule / issue, Jurisdiction, Status, Likelihood, Severity, Mitigation, Residual exposure, Diligence path]
    rows:
      - [FCA conduct and permissions, UK, "Moneybox states Digital Moneybox Limited is FCA-authorised; current permissions and supervisory status need confirmation", Medium, High, "Maintain permissions, Consumer Duty controls, risk disclosures, and complaints oversight", "High if permissions, fair-value evidence, or remediation controls are incomplete", "Obtain current FCA register extract, permission perimeter, complaints MI, and latest Consumer Duty board reporting"]
      - [Cash protection through third-party banks, UK, "Independent coverage says Moneybox is not a bank and places cash with partner banks", Medium, High, "Disclose bank allocation and FSCS mechanics; keep concentration limits", "High for customers with overlapping balances at the same banking brand", "Obtain current bank-by-bank allocation, legal entity map, reconciliation controls, and customer disclosure testing"]
      - [Lifetime ISA withdrawal and house-price rules, UK, "Moneybox discloses a 25% early-withdrawal penalty and £450,000 first-home limit", Medium, High, "Eligibility checks, warnings, and customer suitability communications", "Material if rules make intended home purchase unavailable or customers misunderstand penalties", "Review exception handling, complaint outcomes, and scenario testing for failed or delayed purchases"]
      - [Consumer Duty customer outcomes, UK, "The FCA requires firms to put retail customers' needs first", Medium, High, "Board-approved outcome monitoring, fair-value reviews, and complaints remediation", "High if customer cohorts show foreseeable harm or poor value", "Obtain Consumer Duty board reports, outcome tests, fair-value assessments, and remediation logs"]
      - [ISA reform from 6 April 2027, UK, "Government factsheet states a £12,000 under-65 Cash ISA limit, transfer restrictions, and 22% cash-interest charge in non-Cash ISAs", Medium, High, "Build policy implementation, product redesign, and communications plan", "High until implementation and customer migration controls are evidenced", "Obtain regulatory change plan, test evidence, customer-impact analysis, and audit sign-off"]
    notes: "Rows combine Moneybox disclosures, independent reporting, and government policy; likelihood and residual exposure are analytical assessments requiring management evidence."
    enumerationScope:
      coverage: partial
      basis: "Publicly evidenced regulatory and legal exposures identified for Moneybox as of the 2026-10-25 run date"
    claimRefs: [CR001, CR004, CR005, CR006, CR007, CR008, CR015]
  - id: TR002
    title: Operational / quality / security risk register
    columns: [Failure mode, Likelihood, Severity, Mitigation maturity, Residual exposure, Unresolved gap]
    rows:
      - [Withdrawal or transfer delay, Medium, High, "Public product and support channels exist; control performance is not disclosed", High, "No assigned source provides withdrawal-time distributions, backlog, or recovery targets"]
      - [Fee drag and small-balance attrition, High, Medium, "Fees are disclosed and the first three subscription months are free", Medium-High, "Product-level margin, waiver, churn, and customer-value data are private"]
      - [Investment loss or unsuitable risk selection, Medium, High, "Risk warnings and curated options are disclosed", High, "No public suitability testing, complaints, or outcome monitoring by cohort"]
      - ["Cyber, fraud, or service outage", Unknown, High, "Moneybox says it uses 256-bit encryption; resilience and incident history are not evidenced", High, "No public incident register, uptime series, recovery test, or independent assurance in the assigned pool"]
      - [Capital or liquidity shortfall, Unknown, High, "The cited £70 million October 2024 transaction was a secondary share sale, not established operating capital", High, "No assigned source provides audited cash, regulatory capital, cash burn, or runway"]
    notes: "Risk ratings are not incident findings; they identify exposure where the public record discloses a control or warning but not its effectiveness."
    claimRefs: [CR002, CR003, CR009, CR010, CR011, CR012, CR014, CR016]
  - id: TR003
    title: Partner / dependency risk register
    columns: [Dependency, Counterparty, Role, Concentration, Failure scenario, Severity, Mitigation, Residual exposure]
    rows:
      - [Cash banking network, Santander / HSBC and other partner banks, Hold customer cash and savings deposits, "YourMoney reports two banks for the Cash ISA at the time of its article and a nine-bank split for the LISA", "Bank failure, allocation error, or FSCS-limit overlap delays recovery", High, "Diversify deposits and provide allocation information on request", High until current allocation and reconciliation evidence is supplied]
      - [Custody and fund providers, External custodian and underlying fund managers, Safekeep and administer investment assets, Not quantified in assigned current evidence, "Custodian or provider disruption affects dealing, transfers, or access", High, "Segregation and regulated-provider model are described in reviews and company material", "Medium-High pending contracts, contingency testing, and assurance reports"]
      - [Mortgage and product partners, Mortgage lenders and regulated advice partners, Support home-buying and product distribution, Not disclosed, "Partner changes or lender criteria reduce conversion and customer outcomes", Medium, "Use multiple lenders and provide regulated-advice disclosures", Medium-High pending partner concentration and outcome data]
      - [Government and tax-policy framework, HM Treasury / HMRC / FCA rule-makers, "Define ISA, LISA, pension, and conduct requirements", System-wide dependency, "Rule change or interpretation requires rapid product and communications changes", High, "Maintain regulatory-change governance and customer notices", Medium-High until 2027 implementation evidence is available]
    notes: "Counterparty concentration is stated only where the assigned evidence supports it; undisclosed fields remain explicit gaps rather than estimates."
    claimRefs: [CR005, CR006, CR007, CR008, CR009, CR013, CR014]
