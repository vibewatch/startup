evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: funding-total
    missingEvidence: >-
      A company-certified financing schedule separating primary proceeds, crowdfunding, secondary transfers, debt and
      currency conversions.
    whyItMatters: Public databases disagree on both round count and total raised, and secondary proceeds are not company cash.
    diligencePath: Reconcile the cap table, bank statements and board-approved financing documents with management and counsel.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: material
    topic: leadership
    missingEvidence: >-
      Current organisation chart, statutory director list, board committee mandates, succession plan and
      senior-management retention data.
    whyItMatters: >-
      The public record consistently identifies only the two founders, preventing a complete assessment of management
      depth and governance independence.
    diligencePath: Request the board pack, Companies House officer history, employment roster and management succession materials.
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: regulation
    missingEvidence: >-
      Current FCA Register records for every Moneybox group entity, permission, appointed representative and regulated
      product.
    whyItMatters: >-
      A company-issued app listing is not independent proof that each current product sits within the stated
      permissions.
    diligencePath: Match each product and legal entity to current FCA Register entries and obtain compliance counsel confirmation.
    relatedQuestionRefs:
      - QO010
  - type: private-evidence-only
    severity: material
    topic: market-share
    missingEvidence: >-
      Matched UK market denominators and Moneybox product-level funded accounts, AUA, revenue, acquisition, retention,
      and customer overlap.
    whyItMatters: >-
      Without like-for-like denominators, the public scale figures cannot support a defensible SAM, SOM, market share,
