  topStrengths:
    - Demonstrated scale across customers, assets, and net inflows.
    - Reported profitability and high gross-profit margin.
    - Broad product relationship spanning saving, investing, pensions, and home-buying.
    - Evidence of shareholder liquidity through the PISCES secondary transaction.
  topRisks:
    - Product-level revenue mix, ARPU, retention, and cash conversion remain private.
    - The latest valuation is a thinly traded secondary-market mark, not a primary financing price.
    - Fee drag may weaken mature-account economics against lower-cost alternatives.
    - Regulatory, partner-bank, operational, and policy-change execution risks require control evidence.
  unresolvedGaps:
    - Audited 2025 financial statements and segment economics are not yet publicly available.
    - Product-level ARPU, revenue mix, cohort retention, and customer economics remain undisclosed.
    - Post-PISCES buyer mix, clearing depth, turnover quality, and price discovery remain private.
    - Liquidation preferences, anti-dilution protections, and broader cap-table rights are undisclosed.
    - H2 2026 revenue conversion from customer and inflow growth is not yet visible publicly.
