companyProfile:
  summary: >-
    Moneybox is a UK consumer wealth platform founded by Ben Stanway and Charlie Mortimer that combines automated
    saving, cash and investment ISAs, pensions, Junior ISAs, and home-buying workflows in a mobile-first product. The
    public record shows more than 1.9 million funded customers, £23.2 billion of assets under administration, reported
    profitability, and a July 2026 employee secondary transaction valuing the company at £800 million.
