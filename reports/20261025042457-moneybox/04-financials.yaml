schemaVersion: "report-v2"
artifact: financials
slug: moneybox
runDate: 2026-10-25
company:
  name: Moneybox
chapter:
  number: 4
  title: Financials
  summary: Moneybox entered 2026 with reported scale, revenue growth and three consecutive profitable years, but the earnings profile is being tested by reinvestment in technology and customer acquisition. Public evidence supports a diversified savings and investment monetization model; product-level revenue mix, cohort economics, cash runway detail and realized pricing remain unavailable.
sections:
  - id: revenue-monetization
    title: Revenue model and monetization
    body: >-
      Moneybox monetizes a multi-product wealth platform rather than a single
      trading feature. Its own 2025 release describes savings, investing,
      pensions, home-buying workflows and AI-enabled guidance, while the
      app listing states that investment products carry a £1 monthly
      subscription and a 0.45% annual fee on invested value, with fund
      provider costs on top. Independent reviews describe the round-up and
      beginner-led workflow as the entry point, but also flag that the fixed
      subscription is expensive for small balances and that the investment
      selection is constrained. This supports recurring platform and
      asset-linked revenue as a mechanism, not an assertion of ARR: Moneybox
      does not publicly disclose revenue by product, customer cohort, or
      realized fee yield.
    claimRefs: [CI001, CI002, CI003, CI004, CI005]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: operating-leverage
    title: Growth, cost structure and margin path
    body: >-
      The strongest public financial datapoint is the 2025 reported result:
      revenue reached £115.6m, up 23% from £93.3m, while profit before tax
      was £14.9m versus £19.4m in 2024. City A.M. reports that annual costs
      exceeded £100m, up more than 23%, with £6.8m spent on software and
      platform development in the second half of 2025; it also describes the
      pre-tax margin narrowing to 13% from 21%. The combination is consistent
      with deliberate investment in automation, marketing and infrastructure,
      not with a mature steady-state margin. The official release reports
      £6.4bn of 2025 net inflows and £19bn of year-end AUA, but AUA and
      inflows are balance-sheet-adjacent activity measures, not revenue or
      gross profit. Public sources do not provide CAC, payback, gross margin
      reconciliation, servicing cost per account, or working-capital detail.
    claimRefs: [CI006, CI007, CI008, CI009, CI010, CI011]
  - id: capital-adequacy
    title: Capital adequacy and underwriting gaps
    body: >-
      Moneybox appears less dependent on primary fundraising than an
      early-stage fintech, but the evidence is not a substitute for a
      current cash-flow model. City A.M. reports capital resources of just
      under £60m after an £18.5m share buyback, while the London Stock
      Exchange describes a £45m permissioned employee auction at a valuation
      of approximately £800m. The latter is a secondary liquidity event, not
      cash raised for the company, and Moneybox explicitly said it was no
      longer reliant on raising primary capital to fund growth. Clay reports
      historical disclosed funding and a prior £550m valuation, but its
      aggregation is not audited financial reporting. The underwriting
      conclusion is therefore positive on demonstrated profitability and
      liquidity access, but incomplete on unrestricted cash, debt or
      project-finance obligations, regulated-capital headroom, future
      financing triggers, and whether 2026 growth converts into cash after
      marketing and technology investment.
    claimRefs: [CI012, CI013, CI014, CI015, CI016]
    tableRefs: [TI003]
tables:
  - id: TI001
    title: Revenue streams
    columns: [Stream, Mechanism, Unit or basis, Current value/status, Quality, Diligence ask]
    rows:
      - [Investment products, "Subscription plus platform fee on invested value", "£1/month and 0.45%/year; fund costs extra", "Public list terms", "Official product disclosure", "Obtain realized fee yield and product revenue mix"]
      - [Cash savings and Cash ISAs, "Interest-bearing savings products and tax wrappers", "Account/product balance; rate varies", "Offered; revenue share not disclosed", "Product surface, economics unavailable", "Reconcile net interest or partner economics by product"]
      - [Pensions and SIPPs, "Long-term retirement accounts", "Account and invested assets", "Offered; revenue not disclosed", "Product range confirmed", "Obtain active accounts, AUA and revenue per account"]
      - [Round-ups and automated plans, "Small recurring deposits routed into savings or investments", "Transaction round-up / scheduled contribution", "Core acquisition and engagement feature", "Independent reviews corroborate workflow", "Measure conversion, retention and servicing cost"]
      - [Financial guidance and planned advice, "AI-enabled guidance with planned regulated advice", "Advice interaction / future fee model", "Guidance launched; 2026 advice rollout planned", "Company-claimed roadmap", "Confirm authorization, pricing and unit economics"]
    notes: "Sources combine official product terms, the 2025 company release and independent reviews; null economics mean Moneybox does not disclose product-level revenue or realized pricing."
    claimRefs: [CI001, CI002, CI003, CI004, CI005]
  - id: TI002
    title: Pricing and monetization
    columns: [Product or customer type, List pricing or charge, Realized pricing, Quality, Implication]
    rows:
      - [Investment products, "£1 monthly subscription; first three months free", null, "Official list pricing", "Fixed fee can be material on small balances"]
      - [Investment products, "0.45% of investments per year", null, "Official list pricing", "Asset-linked revenue scales with AUA"]
      - [Underlying funds, "Fund provider costs on top", null, "Official qualification", "All-in customer cost and Moneybox share require diligence"]
      - [Cash savings accounts, "No account fee reported for Cash ISA or savings accounts", null, "Official list terms", "Economics may depend on partner and spread arrangements"]
      - [Large-balance investors, "Independent reviewers describe subscription plus fund charges as less competitive at scale", null, "Third-party assessment", "Pricing pressure and mix shift need testing"]
    notes: "List prices and third-party fee commentary are not realized revenue, take rate, discounting, or margin; the company has not published customer-level pricing distributions."
    claimRefs: [CI002, CI003, CI004, CI005]
  - id: TI003
    title: Unit economics and capital underwriting
    columns: [Metric, Value or null, Confidence, Why it matters, Diligence ask]
    rows:
      - [2025 revenue, "£115.6m", high, "Shows reported scale and 23% year-on-year growth", "Obtain audited accounts and segment note"]
      - [2025 profit before tax, "£14.9m", high, "Demonstrates a third consecutive profitable year", "Reconcile one-offs, tax, cash conversion and statutory accounts"]
      - [2025 AUA, "£19bn", high, "Indicates asset scale supporting fee-linked monetization", "Obtain asset mix, fee-bearing share and custody economics"]
      - [2025 net inflows, "£6.4bn", high, "Signals customer funding activity", "Reconcile gross flows, withdrawals, retention and revenue conversion"]
      - [CAC and payback, null, low, "Needed to judge whether acquisition spending is efficient", "Provide channel CAC, cohort payback and contribution margin"]
      - [Cash runway and debt obligations, null, low, "Needed to test capital adequacy after reinvestment and buyback", "Provide unrestricted cash, debt schedule, covenants and 24-month plan"]
    notes: "Reported company and news figures are not a substitute for audited segment economics; null rows identify private underwriting blockers rather than zero values."
    claimRefs: [CI006, CI007, CI008, CI009, CI010, CI011, CI012, CI015, CI016]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: "Customer saving and investing activity feeds Moneybox's fee-bearing platform, while product and cost disclosures determine the conversion from scale to profit."
    data:
      nodes:
        - id: customer-activity
          label: "Customer contributions and AUA"
          detail: "£6.4bn 2025 net inflows and £19bn 2025 AUA reported by Moneybox"
          value: "£6.4bn / £19bn"
          unit: "reported activity"
        - id: fee-bearing-products
          label: "ISAs, pensions, investments and savings"
          detail: "Products span investment subscriptions, asset-linked fees and cash products"
        - id: platform-revenue
          label: "Platform revenue"
          detail: "£115.6m gross revenue in 2025; product mix not disclosed"
          value: "£115.6m"
          unit: "2025 revenue"
        - id: operating-costs
          label: "Technology, marketing and operating costs"
          detail: "Annual costs exceeded £100m; £6.8m software/platform development in H2 2025"
          value: ">£100m / £6.8m"
          unit: "reported costs"
        - id: profit-before-tax
          label: "Profit before tax"
          detail: "£14.9m in 2025, down from £19.4m in 2024"
          value: "£14.9m"
          unit: "2025 PBT"
        - id: margin-pressure
          label: "Margin pressure"
          detail: "Pre-tax margin narrowed to 13% from 21% as technology and marketing investment increased"
          value: "13% vs 21%"
          unit: "reported pre-tax margin"
      edges:
        - from: customer-activity
          to: fee-bearing-products
          label: "funds and balances use products"
        - from: fee-bearing-products
          to: platform-revenue
          label: "subscription and asset-linked charges"
        - from: platform-revenue
          to: operating-costs
          label: "revenue funds operating investment"
        - from: platform-revenue
          to: profit-before-tax
          label: "reported result after costs"
    approximationNotes: "The bridge is a conceptual revenue mechanism, not a reconciled waterfall: public sources do not disclose product mix, gross margin, or cash conversion."
    claimRefs: [CI001, CI002, CI006, CI007, CI008, CI009, CI010, CI011]
callouts:
  - calloutType: strength
    title: Profitable scale is evidenced, not merely projected
    body: "Moneybox reports £115.6m of 2025 revenue and £14.9m of profit before tax, its third consecutive profitable year; the reported result provides a stronger underwriting base than venture-stage growth alone."
    claimRefs: [CI006, CI007]
  - calloutType: risk
    title: Margin quality still depends on reinvestment discipline
    body: "The reported 23% cost increase, technology spend and marketing expansion coincided with a fall in pre-tax profit from £19.4m to £14.9m, leaving CAC, payback and steady-state margin unresolved."
    claimRefs: [CI008, CI009, CI010, CI011]
  - calloutType: recommendation
    title: Require cohort and cash evidence before underwriting
    body: "The next diligence step should be an audited bridge from AUA and inflows to revenue, contribution margin and cash, together with cohort retention, channel CAC, unrestricted cash and debt obligations."
    claimRefs: [CI008, CI011, CI012, CI015, CI016]
