chapter:
  number: 6
  title: "Customers"
  summary: "Hubble Network has scaled its hybrid IoT connectivity platform to over 500,000 active devices across a 100-million gateway terrestrial network, transitioning from early invite-only pilots to general availability. Enterprise adoption is anchored by strategic pilots with connected operations vendor Samsara and hardware integrations with InPlay and Reelables, though customer retention metrics, churn rates, and production contract values remain undisclosed private data."
sections:
  - id: "customer-segmentation-and-target-buyers"
    title: "Customer Base Segmentation & Target Buyers"
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU004"
      - "CU005"
      - "CU010"
    tableRefs:
      - "TU001"
    body: |
      Hubble Network segments its commercial customer base across three primary categories: enterprise fleet and asset operators, hardware and silicon integration partners, and original equipment manufacturers (OEMs) developing smart labels and tracking peripherals. For enterprise fleet and logistics buyers, the primary commercial driver is eliminating costly blind spots in remote and transit environments where cellular coverage does not reach. Because cellular networks cover approximately 15% of the Earth's landmass, industrial operators have historically faced severe operational trade-offs between expensive satellite modems and unmonitored transit routes.

      In the hardware and component segment, Hubble focuses on semiconductor makers and beacon manufacturers such as InPlay and Texas Instruments. These partners integrate Hubble's specialized Bluetooth Low Energy (BLE) firmware directly into commodity silicon, allowing downstream device makers to produce connected assets without custom radio hardware. In turn, printable smart-label makers such as Reelables target high-volume, low-margin supply chain packaging where tag unit economics must remain under one dollar. While enterprise asset tracking represents the largest near-term revenue opportunity, consumer-facing tracking and stolen vehicle recovery constitute strategic expansion verticals.
  - id: "adoption-trajectory-and-network-scale"
    title: "Adoption Trajectory & Network Scale"
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU006"
      - "CU008"
      - "CU012"
    tableRefs:
      - "TU002"
    body: |
      Hubble Network's reported adoption trajectory reflects rapid scaling on its hybrid terrestrial network, supported by an expanding base of managed access points. The company announced that active devices on its network reached 500,000 units in September 2026, representing a greater than 10-fold increase compared to the prior twelve-month period. This deployment surge coincided with the opening of Hubble's satellite network from closed commercial pilot access into general availability, enabling any standard Bluetooth-enabled device to connect directly to orbital receivers through an over-the-air firmware update.

      The foundation of this device volume is Hubble's terrestrial footprint, which comprises over 100 million gateways spanning 170 countries and covering approximately three million square miles. This terrestrial infrastructure allows devices in urban, warehouse, and transit hub environments to transmit telemetry without consuming orbital uplink resources. However, commercial adoption remains in an early monetization phase. Although Hubble reported working with more than ten commercial pilot customers in late 2025, the company does not disclose the conversion rate from pilot evaluations to multi-year production subscriptions, nor does it report customer logo counts or account retention cohorts.
  - id: "named-customer-proof-and-deployments"
    title: "Named Customer Proof & Commercial Pilots"
    claimRefs:
      - "CU003"
      - "CU004"
      - "CU005"
      - "CU006"
      - "CU009"
    tableRefs:
      - "TU003"
    body: |
      Named customer proof centers on marquee enterprise partnerships and silicon integration milestones rather than broad public customer registries. Connected operations provider Samsara (NYSE: IOT) represents Hubble's primary named commercial deployment, actively piloting Hubble's infrastructure to track critical field machinery and industrial equipment operating in off-grid sites. For Samsara, Hubble's primary value proposition is providing field visibility beyond the perimeter of traditional cellular towers without requiring customers to install secondary satellite transceivers or modify deployed hardware.

      On the device manufacturing side, Hubble has established integration partnerships with semiconductor developer InPlay and printable shipping label provider Reelables. InPlay's sub-$1 IN100 NanoBeacon chip combines with Hubble firmware to deliver low-cost telemetry for cold chain monitoring, returnable transport items, and smart shipping labels. Similarly, Reelables integrates Hubble connectivity into printable paper-thin shipping labels to enable disposable package tracking across intermodal logistics. These relationships demonstrate technical interoperability and supply-side validation, though verified customer-level outcome metrics such as theft reduction percentages or operational cost savings remain privately held.
  - id: "customer-economics-and-expansion-dynamics"
    title: "Customer Economics, Retention & Expansion Risks"
    claimRefs:
      - "CU007"
      - "CU008"
      - "CU009"
      - "CU011"
      - "CU012"
      - "CU013"
      - "CU014"
    figureRefs:
      - "FU001"
    body: |
      The economic calculus for adopting Hubble Network depends heavily on deployment scale, message update frequency, and geographic distribution. Hubble positions its connectivity at a list price of $1 to $2 per device monthly ($12 to $24 annually), with aggressive volume discounting dropping per-device annual costs toward approximately $6 for enterprise deployments exceeding 100,000 units. For global tracking applications requiring frequent reporting, Hubble provides predictable fixed billing compared to cellular roaming tariffs or usage-metered cloud services like Amazon Sidewalk.

      Conversely, for small-scale fleets operating within dense residential or metropolitan areas, alternative networks offer significant cost advantages. For example, Amazon Sidewalk charges no direct network access fee, resulting in estimated annual costs of approximately $1.10 per device for daily reporting at 1,000-unit scale, compared to Hubble's $12 to $24 baseline. Furthermore, Hubble faces operational expansion constraints tied to its constellation deployment schedule. With six satellites currently operational in low Earth orbit and a roadmap targeting 60 satellites by 2030, latency and update intervals in remote areas remain dependent on orbital pass windows. In the absence of published customer cohort retention or churn metrics, long-term customer durability remains a critical diligence topic.
