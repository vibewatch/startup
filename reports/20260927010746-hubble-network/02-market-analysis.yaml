callouts:
  - calloutType: "insight"
    title: "Bill-of-Materials Deflation Shifts Asset Tracking Economics"
    body: "Lowering asset connectivity silicon costs below 50 cents eliminates the economic barrier that historically confined satellite tracking to assets worth tens of thousands of dollars. By enabling firmware updates on standard Bluetooth Low Energy chips, operators can track returnable transport packaging, tools, and pallets previously classified as expendable losses."
    claimRefs:
      - "CM003"
      - "CM009"
      - "CM010"
  - calloutType: "risk"
    title: "Constellation Revisit Latency Limits Real-Time Alerting"
    body: "With six satellites currently in orbit, Hubble Network provides intermittent rather than continuous orbital coverage. Emergency exception alerts in off-grid regions are subject to satellite pass timing until the full 60-satellite constellation is operational in 2030, necessitating local data buffering on devices."
    claimRefs:
      - "CM008"
      - "CM014"
  - calloutType: "assumption"
    title: "Direct-to-Device Share Expansion Depends on Partner Firmware Distribution"
    body: "The projection that direct-to-device links will capture 68.84% of satellite IoT connections in 2026 assumes frictionless enterprise firmware distribution across semiconductor partners like Nordic Semiconductor and telematics platforms like Samsara without requiring physical hardware recertification."
    claimRefs:
      - "CM006"
      - "CM011"
      - "CM012"
