    title: "Capital-Efficient Bluetooth-to-Orbit Disruption"
    body: "By pairing 6 low-Earth orbit satellites with an existing global base of roughly 90 million to 100 million terrestrial Bluetooth gateways, Hubble Network bypasses expensive cellular and proprietary satellite modems, enabling asset tracking with sub-50-cent chips and $4 monthly subscriptions."
    claimRefs:
      - "CO006"
      - "CO007"
  - calloutType: "risk"
    title: "Orbital Depletion and Constellation Latency Constraints"
    body: "With one of seven initial satellites already lost to orbital decay, Hubble's current six-satellite array leaves multi-hour revisit gaps over key geographies, making full real-time global tracking dependent on successful delivery of its planned 60-satellite constellation by 2030."
