chapter:
  number: 1
  title: "Company Overview"
  summary: "Hubble Network operates a hybrid low-Earth orbit and terrestrial IoT connectivity network enabling off-the-shelf Bluetooth Low Energy devices to transmit directly to space without cellular or satellite modems. Founded in 2021 and headquartered in Seattle, Washington, the company reached a $1.6 billion private market valuation following a $200 million Series C financing round in September 2026 led by Smith Point Capital."
sections:
  - id: "corporate-identity-and-scale"
    title: "Corporate Identity, Stage, and Global Scale"
    body: "Hubble Network is a venture-backed commercial space technology and Internet of Things (IoT) operator incorporated in October 2021 and headquartered in Seattle, Washington. Originating from Y Combinator's Winter 2022 accelerator cohort, the company has developed an architectural model that enables commodity Bluetooth Low Energy (BLE) silicon embedded in billions of existing sensors, tags, and industrial devices to communicate directly with low-Earth orbit (LEO) satellites. By eliminating dedicated satellite modems and expensive cellular connectivity hardware, Hubble Network reduces device hardware enablement costs below fifty cents while establishing recurring connectivity services priced at approximately four dollars monthly per device.\n\nThe company's operational footprint integrates two complementary segments: an orbital constellation of demonstration spacecraft and an expansive terrestrial gateway network comprising more than 100 million scanners across 170 countries and approximately three million square miles of coverage. As of September 2026, the hybrid network manages more than 500,000 active connected devices, reflecting a tenfold expansion over the trailing twelve-month period. Headquartered in Seattle's aerospace and satellite engineering cluster, Hubble Network employs roughly 70 people and ranks No. 135 on the GeekWire 200 index of top Pacific Northwest startups."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO005"
      - "CO006"
      - "CO007"
    tableRefs:
      - "TO001"
  - id: "executive-leadership-and-governance"
    title: "Executive Leadership, Co-Founders, and Key-Person Dependence"
    body: "Hubble Network was founded by an executive team combining consumer IoT tracking scale, low-power wireless networking protocol development, and satellite payload systems engineering. Chief Executive Officer Alex Haro previously co-founded Life360, guiding the family location-sharing platform through its 2019 initial public offering on the Australian Securities Exchange while directing connected hardware initiatives. Chief Technology Officer Ben Wild previously founded crowdsourced wireless networking startup Iotera (acquired by Ring and subsequently Amazon) and served as the primary inventor and product architect of Amazon Sidewalk. Co-founder John Kim contributed extensive aerospace systems qualification and flight operations expertise gained at SSL (Maxar Technologies) and aerospace advisory practices.\n\nThis leadership composition establishes strong founder-market fit across edge wireless telemetry and orbital mechanics. However, Hubble Network exhibits pronounced key-person dependency on Haro and Wild. The company's core technological differentiation—decoding weak sub-one-dollar Bluetooth signals across hundreds of miles of atmospheric attenuation via phased-array antenna processing and proprietary bitrate reduction tricks—relies directly on the co-founders' specialized domain knowledge. While corporate governance has expanded through institutional board participation from Smith Point Capital, technical execution and intellectual property evolution remain concentrated among its founding technologists."
    claimRefs:
      - "CO001"
      - "CO004"
      - "CO005"
    tableRefs:
      - "TO002"
  - id: "capitalization-and-stakeholder-map"
    title: "Capitalization History, Series C Financing, and Investor Syndicate"
    body: "Hubble Network achieved unicorn status on September 23, 2026, announcing the completion of an oversubscribed $200 million Series C financing round that established a private market equity valuation of $1.6 billion. The transaction was led by Smith Point Capital, founded by former Salesforce Co-CEO Keith Block, with participation from specialist space fund Seraphim Space, Australian venture firm Carthona Capital, climate and infrastructure investor Earthshot Ventures, Y Combinator, and early-stage backer RPM Ventures. The injection raised Hubble Network's cumulative equity capital raised to $300 million, following a $20 million Series A round in March 2023 led by Transpose Platform and a $70 million Series B round completed in September 2025.\n\nThe Series C financing positions Hubble Network among the best-capitalized direct-to-device satellite startups globally. Beyond primary funding rounds, unregistered secondary market liquidity interest is facilitated on alternative trading venues including Nasdaq Private Market. Despite rapid valuation expansion from early-stage venture funding to a $1.6 billion valuation, Hubble Network maintains private disclosure discipline: annual recurring revenue (ARR), gross profit margins, and net customer cash burn remain confidential, representing primary diligence verification priorities for prospective investors."
    claimRefs:
      - "CO002"
      - "CO003"
      - "CO013"
      - "CO014"
    tableRefs:
      - "TO003"
  - id: "constellation-roadmap-and-operational-milestones"
    title: "Satellite Constellation Roadmap, Operational Milestones, and Orbital Decay"
    body: "Hubble Network's space segment currently comprises six operational demonstration cubesats deployed in low-Earth orbit. The initial constellation hardware, engineered and fabricated in collaboration with Spire Global, was deployed across SpaceX Falcon 9 rideshare flights, including the Transporter-10 mission. Notably, the operational orbital population was previously seven satellites; one spacecraft experienced premature orbital decay and de-orbited, leaving six operational platforms conducting daily passes over North America. While these initial spacecraft validate ground-to-orbit BLE signal acquisition without hardware modification, sparse orbital density results in multi-hour revisit gaps for remote devices situated beyond terrestrial gateway reach.\n\nTo achieve continuous global telemetry, Hubble Network has executed a commercial contract with satellite manufacturer Muon Space to host custom next-generation payloads on its MuSat XL platform. The company's architectural roadmap targets a full operational constellation of 60 larger satellites by 2030, with the first two production spacecraft scheduled for launch in 2027. Each next-generation platform features ten times the antenna surface area of the Spire-built cubesats, expanding simultaneous signal processing capacity to more than ten million connected devices. Alongside this orbital roadmap, Hubble transitioned from invite-only enterprise pilot partnerships (including connected fleet leader Samsara) to public general availability in September 2026, enabling commercial device operators to activate satellite connectivity via over-the-air firmware updates."
    claimRefs:
      - "CO008"
      - "CO009"
      - "CO010"
      - "CO011"
      - "CO012"
    figureRefs:
      - "FO001"
