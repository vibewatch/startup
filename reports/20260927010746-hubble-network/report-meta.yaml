  foundingLocation: "Seattle, Washington"
  headquarters: "Seattle, Washington"
  productSummary: >-
    Hubble sells direct-to-satellite Bluetooth connectivity for enterprise asset
    tracking, pairing software-only firmware updates with hybrid terrestrial and LEO
    coverage.
  customerFocus: "Enterprise asset tracking, logistics, industrial IoT, and smart labels"
  businessModel: "Recurring per-device connectivity subscriptions with platform and onboarding services"
  stage: "Series C"
  fundingStatus: >-
