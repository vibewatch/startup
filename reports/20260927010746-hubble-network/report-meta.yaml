companyProfile:
  summary: >-
    Hubble Network is a private, disclosed direct-to-satellite IoT company that
    turns standard Bluetooth Low Energy devices into hybrid terrestrial-orbital
    trackers through firmware rather than dedicated satellite modems. Founded in
    2021 and headquartered in Seattle, it combines a large terrestrial gateway
    footprint with a small operational LEO constellation, and it moved to public
    general availability in September 2026 after announcing a $200 million Series C.
  founders:
