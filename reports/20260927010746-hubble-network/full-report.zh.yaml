  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与客户工作流
        blocks:
          - type: paragraph
            body: >-
              Hubble Network 改变了低功耗广域物联网连接范式，使标准 Bluetooth Low Energy 芯片能够直接与近地轨道卫星通信。传统超出蜂窝覆盖范围的资产追踪必须依赖专用卫星收发器，其单模块成本在
              $25 至 $50 且功耗巨大。Hubble 的方案用纯软件固件更新取代了这笔硬件重税，直接运行在单价仅为 $0.50 至 $3.00 的通用 BLE 芯片上。在企业级工作流中，终端设备广播包含设备坐标及至多
              13 bytes 自定义传感器载荷的标准 BLE 广播包。数据经由 Hubble 的混合网络实现无缝接入——既可由超过 100 million 个地面网关就近捕获，也可由 Hubble 卫星在轨接收——并通过
              REST APIs 与 webhooks 交付给客户的 ERP、WMS 和 TMS 平台。
            claimRefs:
              - CE001
              - CE003
              - CE005
              - CE011
              - CE014
