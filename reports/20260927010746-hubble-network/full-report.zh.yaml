  - id: TV003
    title: 乐观、基准与悲观情景建模
    columns:
      - 情景
      - 核心运营假设
      - 估值与回报测算
      - 核心风险与下行触发因素
      - 概率
    rows:
      - - 乐观情景
        - 企业级采纳迅速推进，到 2028 年联网设备达 10M+ 台；到 2029 年部署 60 颗卫星；毛利率超过 65%。
        - $3.5B-$5.0B 终局估值（对应预测 ARR 的 12x-15x）；以 C 轮价格（$17.20/股）计实现 2.2x-3.1x MOIC。
        - 频谱干扰、轨道碰撞，或电信巨头加速推进手机直连卫星（Direct-to-Cell）竞争。
        - 20%
      - - 基准情景
        - 设备数量到 2029 年增长至 3.0M-4.5M 台；由 24-36 颗卫星组成的部分星座提供周期性追踪；ARR 达到 $40M-$60M。
        - $1.2B-$1.8B 终局估值（对应 ARR 的 7x-9x）；0.8x-1.1x MOIC，代表资本保本及小幅上行空间。
        - 发射排期推迟导致资本支出消耗周期拉长；对价格敏感的物联网物流客户发生流失。
        - 50%
      - - 悲观情景
        - 企业级客户转化停滞在 1.5M 台设备以下；星座成本超支导致需要进行稀释性过桥轮融资；老股缺乏流动性的状况持续。
        - $300M-$500M 重组或战略出售（对应投资额的 1x-2x）；C 轮 1.0x 清算优先权严重侵蚀普通股价值。
        - 星座资金耗尽触发降估值融资（Down-round）；Muon Space XL 搭载载荷故障。
        - 30%
    notes: 概率加权情景建模基于 $1.6B 的 C 轮投后估值基线、1.0x 清算优先权及优先股堆叠以及 $100M 的预计星座资本支出。
    claimRefs:
      - CV001
      - CV004
      - CV006
      - CV008
      - CV014
