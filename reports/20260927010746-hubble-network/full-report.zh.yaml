      - number: '3.3'
        title: 定价经济学、总体拥有成本与迁移壁垒
        blocks:
          - type: paragraph
            body: >
              资产追踪的总体拥有成本（TCO）由前期模块硬件成本、设备电池寿命、认证开销以及每月经常性通信资费决定。专用卫星调制解调器与 3GPP NTN 蜂窝模块的单节点硬件成本在 $10 至 $50
              之间，单项资产每月订阅费通常在 $5 到 $20+。在一次性货运标签、托盘追踪器与分布式农业探针这类场景下，高昂的硬件与持续数据资费支出会彻底破坏实际部署中的单体经济模型。


              Hubble 将连接能力沉淀到固件中，改变了这一成本平衡：采用存量 BLE 芯片的设备新增 BOM 成本低于 $0.50，目标月度经常性订阅费约 $4。此外，由于 BLE 射频芯片已具备既有的 FCC/CE/IC
              模块化认证，企业设备制造商可直接绕过昂贵漫长的定制卫星射频合规审查周期。不同技术路线的切换成本与客户锁定效应大相径庭：采用 3GPP NTN
              的客户受益于多家芯片厂商的货源保障（Qualcomm、MediaTek、Sony Altair）以及运营商可携性；而 Hubble 专有的卫星检测协议则从软件协议维度将客户深度绑定在 Hubble
              的地面-卫星混合网关基础设施上。
            claimRefs:
              - CP012
              - CP013
              - CP014
              - CP015
