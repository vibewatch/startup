  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、覆盖盲区与蜂窝替代赤字
        blocks:
          - type: paragraph
            body: >-
              全球资产追踪与遥测市场存在由地面网络物理特性决定的结构性格局。传统蜂窝网络（包括 LTE-M 与 NB-IoT）仅覆盖全球约 15% 的陆地面积，剩下 85%
              的地理区域完全缺乏地面无线信号覆盖。集装箱、偏远农业机械、冷链冷藏拖车和油田设备等资产一旦脱离城市交通走廊和主要干道，便立即陷入运营盲区。过去，弥合这一连接缺口需要单台设备花费 $10 至 $50
              的专用卫星收发器硬件，外加持续高昂的卫星通信月费。高昂的硬件门槛导致只有高价值固定资产才用得起卫星追踪。据估计，中型企业因离网在途可见度缺失，平均每年产生 $13 million
              的资产损失与被盗成本。Hubble Network 凭借通用 Bluetooth Low Energy 芯片连通地面基础设施与低轨卫星，无需专用调制解调器，重新划定了该市场的经济边界。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
