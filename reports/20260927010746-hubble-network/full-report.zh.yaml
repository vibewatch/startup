            body: >-
              Hubble 目前在近地轨道运行着由 6 到 7 颗卫星构成的基础星座，以每日约一至两次的过顶重访频次提供基础的全球卫星连接。为了从周期性资产打卡迈向近乎连续的全球追踪，Hubble 与 Muon Space
              达成合作，在后者的 MuSat XL 500 kg-class 航天器上搭载下一代 BLE 载荷。首批 MuSat XL 卫星依托先进的多千瓦级供电架构与能在显著更低功率阈值下捕获信号的升级接收机，可提供
