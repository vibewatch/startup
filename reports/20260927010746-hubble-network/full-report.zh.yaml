      - number: '6.3'
        title: 标杆客户实证与商业试点
        blocks:
          - type: paragraph
            body: >
              标杆客户验证主要集中在头部企业合作和芯片集成里程碑，而非广泛公开的客户花名册。物联网运营平台提供商 Samsara（NYSE: IOT）是 Hubble 最主要的公开商业部署案例，正在试点利用 Hubble
              基础设施追踪在无网现场运行的关键野外机械和工业设备。对 Samsara 而言，Hubble 的核心价值在于将现场能见度延伸至传统蜂窝基站覆盖范围之外，且无需客户加装二级卫星收发器或改动既有部署硬件。


              在设备制造端，Hubble 与半导体开发商 InPlay 以及可打印物流标签供应商 Reelables 建立了集成合作。InPlay 价格低于 $1 的 IN100 NanoBeacon 芯片与 Hubble
              固件相结合，为冷链监测、可循环运输载具（RTI）和智能运输标签提供低成本遥测。同样，Reelables 将 Hubble
              连接能力嵌入可打印的纸质超薄运输标签中，在多式联运中实现一次性包裹追踪。这些合作印证了技术互操作性与供应链侧的认可，但经核实的客户级成果指标（例如防盗减损比例或运营成本节约额）仍属于未披露的非公开信息。
