      - number: '7.3'
        title: 供应链与合作伙伴依赖
        blocks:
          - type: paragraph
            body: >-
              Hubble Network 的资本效率建立在外包卫星制造与通用硬件集成之上，这带来了严重的交易对手集中风险。公司已与卫星运营商 Muon Space 签约，由其 MuSat XL 平台卫星总线承载下一代载荷，使
              Muon Space 的生产交付节奏与发射船期成为星座扩容的单点故障隐患。在客户端设备侧，与 Texas Instruments 和 InPlay
              等半导体供应商的集成合作将终端设备经济学与元器件供应及交期紧密绑定。此外，部署 Bluetooth 追踪器的硬件创业者面临严峻的供应链挑战：美国针对中国电子元器件加征的 301 条款关税使元器件成本上升 7.5%
              至 25%，而单一来源的芯片采购也使硬件部署容易遭受配额冻结以及现货经纪商元器件质量缺陷的冲击。
