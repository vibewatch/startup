              Hubble 宣布于 2026 年 9 月以 $1.6 billion 估值完成 $200 million 的 Series C 融资，且多家近期报道称其累计融资金额达到 $300
              million。在未确认是否已包含在 Series C 或累计总额之前，不应将 Seraphim 另行报道的 8 月 $30 million 投资重复计入。公开数据库在此亦存在分歧：Multiples
              记录其五轮融资累计 $321 million，而 Tracxn 页面仍仅记录单轮 $20
              million。这些数据相互矛盾，管理层提供的股权结构表因此至关重要。更关键的是，累计融资金额并不等同于手头现金、非受限流动性、账面亏损、现金烧钱速度、跑道长度、债务负担或支撑 2030
              年规划的资金实力。因此，现有证据只能支持有限的财务判断：近期融资规模可观，但收入质量、利润率走势、资本密集度和下一轮融资时点仍缺乏充分依据。
