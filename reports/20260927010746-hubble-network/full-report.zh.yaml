      - number: '1.2'
        title: 管理团队、联合创始人与关键人物依赖
        blocks:
          - type: paragraph
            body: >-
              Hubble Network 由一支兼具消费级 IoT 追踪规模化经验、低功耗无线网络协议开发能力与卫星载荷系统工程背景的高管团队创立。首席执行官 Alex Haro 曾联合创立
              Life360，带领该家庭位置共享平台于 2019 年在澳大利亚证券交易所完成 IPO，并主导过智能硬件业务。首席技术官 Ben Wild 曾创立众包无线网络初创公司 Iotera（后被 Ring 及
              Amazon 收购），并作为核心发明人兼产品架构师主导了 Amazon Sidewalk 的研发。联合创始人 John Kim 则依托在 SSL（Maxar
              Technologies）及航天咨询领域的积累，带来了深厚的航天系统适航认证与在轨飞行操作经验。


              这套高管配置在边缘无线遥测与天体轨道力学之间建立了极强的创始人-市场契合度。但 Hubble Network 对 Haro 与 Wild
              表现出显著的关键人物依赖。公司的核心技术壁垒——借助相控阵天线信号处理与自研码率缩减技巧，穿透数百英里的大气衰减以解码 1 美元以下芯片发射的微弱 Bluetooth
              信号——直接依赖两位联创的专门技术诀窍。尽管随着机构投资方 Smith Point Capital 进入董事会，公司治理结构有所完善，但技术执行与知识产权演进依然高度集中在创始技术团队手中。
