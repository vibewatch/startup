      - number: '5.5'
        title: 核心图表
        blocks:
          - type: callout
            title: 绕过专用卫星硬件重税
            body: >-
              Hubble 的核心技术突破在于用 1 美元以下的标准 Bluetooth LE 芯片（$0.50-$3.00 BOM）取代了昂贵的专用卫星调制解调器（$25-$50 BOM）与蜂窝 SIM 模块（$8-$25
              BOM）。Hubble 将链路预算补偿负担从发射设备转移至星载 100+ 单元相控阵天线，从而让普通纽扣电池也能支持数年的续航寿命。
            calloutType: insight
            claimRefs:
              - CE001
              - CE004
              - CE005
          - type: callout
            title: 轨道重访时延与下行载荷约束
            body: >-
              尽管地面 BLE 中继在城市走廊能提供接近实时的连接，但偏远地区的卫星覆盖目前仍受制于仅有 6-to-7 颗卫星的星座规模，重访窗口大约仅为每日一到两次。此外，13-byte
              的最大有效载荷将设备传输限制在坐标和基础传感器标志位上，在 60 颗卫星星座成熟前，无法实现连续的双向指挥与控制。
            calloutType: risk
            claimRefs:
              - CE003
