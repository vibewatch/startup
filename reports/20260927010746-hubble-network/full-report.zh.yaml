              - CE009
              - CE010
  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户群体分层与目标买家
        blocks:
          - type: paragraph
            body: >
              Hubble Network
              将其商业客户群划分为三大核心类别：企业车队与资产运营商、硬件与芯片集成合作伙伴，以及开发智能标签和追踪外设的原始设备制造商（OEM）。面向企业车队和物流采购方，核心商业驱动力在于消除蜂窝网络无法触及的偏远及在途环境中的昂贵监控盲区。蜂窝网络仅覆盖地球陆地面积的约
              15%，工业运营商长期以来在昂贵的卫星调制解调器与放任在途路线失联之间面临严峻的权衡取舍。


              在硬件和元器件细分领域，Hubble 重点开拓 InPlay 和 Texas Instruments 等半导体制造商与信标硬件商。这些合作伙伴将 Hubble 专有的 Bluetooth Low
              Energy（BLE）固件直接集成到通用芯片中，使下游设备制造商无需定制射频硬件即可生产联网资产。与此同时，Reelables
              等可打印智能标签制造商瞄准高通量、低毛利的供应链包装场景，该场景要求单标签物料成本必须控制在 1 美元以下。尽管企业资产追踪代表了短期内最庞大的收入机会，但面向消费级市场的追踪与被盗车辆寻回构成了战略性拓展赛道。
            claimRefs:
