            body: >-
              将资产连接芯片成本降至 50 美分以下，打破了以往卫星追踪仅局限于数万美元高净值资产的经济壁垒。凭借标准 Bluetooth Low Energy
              芯片上的固件更新能力，运营商能够对以往直接归入耗损损失的可循环运输包装、工具及托盘展开追踪。
            calloutType: insight
            claimRefs:
              - CM003
              - CM009
              - CM010
          - type: callout
            title: 星座重访时延制约实时告警能力
            body: >-
              由于目前仅有 6 颗卫星在轨，Hubble Network 提供的仅是间歇性而非连续的轨道覆盖。在 2030 年 60
              颗卫星完整星座投入运营之前，离网区域的紧急异常告警完全受限于卫星过顶时间窗口，必须依赖设备端本地数据缓存。
            calloutType: risk
