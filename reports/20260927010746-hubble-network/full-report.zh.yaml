      - number: '6.4'
        title: 客户经济学、留存与拓展风险
        blocks:
          - type: paragraph
            body: >
              采纳 Hubble Network 的经济账在很大程度上取决于部署规模、报文上报频率以及地理分布。Hubble 的连接服务官方刊例价为每台设备每月 $1 至 $2（每年 $12 至 $24）；针对超过
              100,000 台的企业级部署，激进的批量折扣可将单设备年费压降至约 $6。针对需要高频上报的全球追踪场景，相较于蜂窝漫游资费或 Amazon Sidewalk 等按量计费的云服务，Hubble
              提供了可预期的固定计费。


              反观在密集居民区或大都市区内运行的小规模车队，替代网络则具备明显的成本优势。例如，Amazon Sidewalk 不收取直接网络接入费，在 1,000 台规模下每日上报的单设备年成本估计约 $1.10，而
              Hubble 的基准费用为 $12 至 $24。此外，Hubble 面临与星座部署节奏挂钩的运营扩张制约。由于当前近地轨道仅有 6 颗卫星在运行，且 60 颗卫星的路线图目标定在 2030
              年，偏远地区的时延和更新间隔依然受制于轨道过顶窗口。在缺乏公开的客户群留存或流失率指标的情况下，客户关系的长期持续性仍是投资尽调的核心审议课题。
