          detail: 超过 500,000 台活跃设备分布于 100M+ 处扫描网关和 6 颗在轨运行的低地球轨道卫星。
          value: 500000
    approximationNotes: 规模测算层级综合了 Fortune Business Insights 的市场预测与公司报告的单机 BOM 及陆地覆盖指标；金额反映总市场价值，连接占比反映直连设备细分市场份额。
    claimRefs:
      - CM001
      - CM003
      - CM005
      - CM006
      - CM007
      - CM008
      - CM009
  - id: FP001
    title: 竞争定位图：直连设备物联网能效与功能复杂度对比
    type: quadrant
    summary: 卫星与地面物联网连接方案在硬件集成负担与通信能力两个维度的序数定位。
    data:
      xAxis: 硬件简易度与成本效益
      yAxis: 通信能力与方向性
      points:
        - label: Hubble Network
          x: 9
          'y': 3
          tone: positive
          detail: 低于 $0.50 的 BOM、纽扣电池供电、仅需固件的 BLE 集成，但严格限于单向上行遥测。
        - label: Skylo (3GPP NTN)
          x: 4
          'y': 8
          tone: opportunity
          detail: 电信级双向报文传输与移动网络运营商（MNO）集成，但调制解调器成本和功耗较高。
        - label: Kinéis
          x: 4
          'y': 5
          tone: neutral
          detail: 专用 LEO UHF 遥测且支持可选下行；需要专用射频前端和天线。
        - label: Swarm (SpaceX)
          x: 3
          'y': 6
          tone: warning
          detail: 传统双向 VHF 报文传输；瓷砖大小的笨重硬件且商业路线图不明朗。
        - label: AST SpaceMobile
          x: 2
          'y': 9
          tone: neutral
          detail: 面向未经改装智能手机的高带宽蜂窝宽带；不适合一次性物联网标签。
        - label: 地面 BLE 查找网络
          x: 9
          'y': 2
          tone: risk
          detail: 通用 BLE 硬件且无卫星成本，但在智能手机 Mesh 网络之外完全零覆盖。
    approximationNotes: 序数评分（0–10 分制）源于已公开的射频功耗特征、模块硬件成本及双向报文传输能力。
    claimRefs:
      - CP002
      - CP004
      - CP005
      - CP006
      - CP007
      - CP008
      - CP010
      - CP011
      - CP012
  - id: FI001
    title: 受证据约束的收入至毛利传导桥
    type: flow
    summary: 公开模型只能推到订阅刊例价；实际成交价和服务交付成本不明，尚无法据公开信息可靠测算毛利。
    data:
      nodes:
        - id: device
          label: 客户设备
          detail: 现有或新增且具备蓝牙功能的资产
        - id: enablement
          label: 固件赋能
          detail: Hubble 声称无需新硬件
        - id: coverage
          label: 混合网络接入
          detail: 地面与卫星连接
        - id: activity
          label: 活跃设备
          detail: 据报道有 500,000+ 台活跃设备
        - id: list-price
          label: 官方订阅价
          detail: 每台设备每月约 $4
        - id: net-revenue
          label: 实际净收入
          detail: 未披露的折扣、试点计费处理以及计费设备结构
        - id: service-cost
          label: 服务交付成本
          detail: 未披露的合作伙伴、卫星、云与支持成本
        - id: gross-profit
          label: 毛利
          detail: 无法根据所掌握的公开证据计算
    approximationNotes: 未对利润率指标进行估算；该流程将据报道的商业输入与非公开的定价及成本数据区分开来。
    claimRefs:
      - CI001
      - CI003
      - CI005
      - CI016
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 涵盖芯片固件、地面网关、轨道接收器与遥测数据流的六层产品及运营技术栈。
    approximationNotes: 分层结构反映了从边缘芯片终端到客户企业级应用的数据与信号逻辑流向。
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE007
      - CE008
      - CE009
      - CE012
    data:
      layers:
        - label: 芯片与嵌入式固件
          detail: 运行自研 Zephyr RTOS SDK 的现成 BLE MCU
          tone: positive
          modules:
            - TI CC2340
            - SiLabs MG24
          outputs:
            - BLE 2.4 GHz 射频
        - label: 地面网关网络
          detail: 捕获本地 BLE 信标的 100M+ 分布式接入点
          tone: neutral
          modules:
            - Life360 节点
            - 专用网关
          outputs:
            - IP 上行链路
        - label: 轨道空间段
          detail: 配备 100+ 元相控阵天线的 LEO 卫星星座
          tone: opportunity
          modules:
            - LEO 相控阵
            - Muon MuSat XL
          outputs:
            - 地面站下行链路
        - label: 信号处理与解码
          detail: 多普勒频移补偿、大气校正与数据包解码
          tone: neutral
          modules:
            - 多普勒校正
            - 差错控制
          outputs:
            - 13 字节遥测数据
        - label: 云端湖仓一体平台
          detail: 具备 PII 脱敏、Apache Iceberg 与 Redshift 的分层湖仓
          tone: neutral
          modules:
            - Iceberg 流处理
            - Redshift 数仓
          outputs:
            - 经审计的数据集市
        - label: 开发者与企业 API 接口
          detail: 实时 Webhook、REST 接口与车队可视化看板
          tone: positive
          modules:
            - REST API
            - 运营看板
          outputs:
            - WMS/ERP 集成
  - id: FU001
    title: 客户旅程与部署生命周期
    type: journey-map
    summary: 企业级物联网客户从设备评估与固件集成，到全球混合遥测与规模化部署的生命周期各阶段。
    data:
      items:
        - label: 1. 硬件评估
          touchpoints:
            - 选定标准 BLE 芯片（Texas Instruments、InPlay、Nordic）
            - 对比传统蜂窝调制解调器，评估低于 $1 的 BOM 经济效益
        - label: 2. 固件集成
          touchpoints:
            - 将 Hubble SDK 嵌入现有的外设固件
            - 配置 BLE 广播参数与功耗预算
        - label: 3. 地面验证
          touchpoints:
            - 在受管网关（覆盖全球的 100M+ 网络）上部署测试信标
            - 验证本地数据包摄取与云端 API 遥测数据源
        - label: 4. 卫星回退链路激活
          touchpoints:
            - OTA 固件升级激活轨道上行链路能力
            - 卫星过顶窗口期验证直连太空数据包捕获
        - label: 5. 生产环境规模部署
          touchpoints:
            - 扩大部署至车队级规模（1,000 至 100,000+ 台设备）
            - 遥测数据对接企业级 WMS/TMS 运营平台
        - label: 6. 阶梯用量规模拓展
          touchpoints:
            - 合同规模阶梯推动单台设备年连接成本降至约 $6
            - 拓展覆盖多式联运物流、冷链及外场资产
    approximationNotes: 生命周期各阶段梳理自开发者文档、合作伙伴集成指南与定价披露材料。
    claimRefs:
      - CU004
      - CU007
      - CU009
      - CU010
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 按发生概率与残留严重程度，综合评估核心技术、运营、监管及外部依赖风险。
    approximationNotes: 发生概率与影响等级基于公开星座运行历史、已公布供应商合作关系及硬件采购披露信息估算得出。
