  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与融资估值背景
        blocks:
          - type: paragraph
            body: >-
              2026 年 9 月 23 日，Hubble Network 宣布完成 $200 million C 轮融资，投后估值达 $1.6 billion，估值体量迎来实质性跃升。该轮融资由 Keith Block
              旗下的 Smith Point Capital 领投，Seraphim Space、Carthona Capital、Earthshot Ventures、RPM Ventures 以及 Y Combinator
              跟投。此交易推动 Hubble 跻身独角兽行列，其涵盖种子轮、A 轮、B 轮及 C 轮的累计终身股权融资金额达到 $294.24 million。相较于 2025 年 9 月完成的 $298.73 million
              B 轮融资，本轮投后估值大幅扩张了 5.4x。


              投资逻辑的核心在于确立卫星直连物联网通信的全球标准，免去专用卫星调制解调器与蜂窝收发器历来高达 $10 至 $50 的硬件附加成本。仅凭纯软件固件升级，即可让通用的低功耗蓝牙（Bluetooth Low
              Energy）芯片直接与低轨卫星通信，Hubble 将新增的物料清单（BOM）成本压缩至 50 cents 以下。然而反向逻辑同样鲜明：$1.6 billion
              的高估值要求其迅速在数以亿计的企业级设备上跑通商业变现，以此支撑基于历史基本面、目前未获证实的收入倍数。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV006
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
      - number: '8.2'
        title: 资本结构、清算优先权与老股流动性
        blocks:
          - type: paragraph
            body: >-
              深入剖析 Hubble Network 的股权结构显示，C 轮融资按每股 $17.20 定价，共发行 11,629,518 股优先股，确立了总额 $200 million 的 C 轮优先股堆叠。本轮设置了干净的
              1.0x 不参与分配型清算优先权（non-participating liquidation
              preference），既为新入场资本提供下行保护，又避免对既有优先股及普通股股东施加惩罚性的参与分配稀释。对比每股定价 $4.27 的 B 轮（B-1 轮为 $3.63），该结构展现出健康溢价，代表每股价格在
              12 个月内涨幅达 4.0x。


              尽管一级市场首发轮次估值耀眼，但私募老股二级市场数据反映出明显的结构性制约。涵盖 Forge Global 在内的机构级老股交易平台将 Hubble Network 的市场活跃度归为受限级别，尚未确立 Forge
              Price、结算交易量或活跃撮合成交价。此外，历史风投追踪数据库仍停留在 2023 年的滞后披露；Dealroom 独立分析师基准则将同类物联网基础设施企业的可比估值锚定在 $250 million 至 $500
              million 之间。老股流动性匮乏的现状突显出，$1.6 billion 的投后估值属于高度集中的成长期财团定价，是尚未获证实的估值层级，而非公允且具备流动性的市场共识。
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV012
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV007
              - CV008
              - CV009
              - CV010
      - number: '8.3'
        title: 情景分析、回报驱动因素与估值模型
        blocks:
          - type: paragraph
            body: >-
              为评估以 $1.6 billion C 轮估值为基准的潜在回报，我们构建了截至 2031 年的五年乐观、基准和悲观运营情景。核心运营催化剂与资本开支主要投向 Hubble
              自研卫星星座的组网部署。公司目前在低地球轨道运营 6 颗卫星，并计划在 2030 年前扩容至 60 颗航天器；首席执行官 Alex Haro 估算，该项资本部署计划包含制造、发射及运营的总资本开支约为 $100
              million。


              在乐观情景（20% 概率）下，得益于搭乘 Muon Space XL 航天器的搭载载荷发射进展顺利，高速客户拓展带动在网活跃设备数在 2028 年前突破 10 million
              台。这将推动预计年经常性收入（ARR）向 $250 million 靠拢，支撑公司以 $3.5 billion 至 $5.0 billion 估值推进 IPO 或战略出售（对应 2.2x 至 3.1x
              MOIC）。在基准情景（50% 概率）下，终端设备规模温和增长至 3.0 million 到 4.5 million 台，到 2029 年产生 $40 million 至 $60 million
              ARR，对应终局估值 $1.2 billion 至 $1.8 billion，基本处于资本保本区间。悲观情景（30% 概率）假定星座发射延期、射频干扰受限以及企业级客户转化迟滞，将年收入死死压制在 $20
              million 以下，迫使公司以 $300 million 至 $500 million 开展降估值融资（down-round）或折价出售；届时高顺位的清算优先权将严重侵蚀普通股与早期优先股的权益价值。
            claimRefs:
              - CV001
              - CV007
              - CV008
              - CV014
