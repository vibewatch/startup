      - number: '5.4'
        title: 数据基础设施、安全性与质量控制
        blocks:
          - type: paragraph
            body: >-
              分布式 IoT 追踪的企业级落地，需要高可靠云端数据接入、严密安防控制与严格合规性。Hubble 借助现代云端湖仓一体架构处理来自超过 500,000 台活跃设备的遥测数据，将原始数据包分流汇入 Apache
              Iceberg、Amazon Redshift 以及自动化对账流水线。鉴于 Hubble 网络捕获的传输跨越 170
              个国家，该平台执行严格的数据治理：遥测流水线部署了自动化个人身份信息（PII）脱敏与敏感度标记，以维护客户保密性。此外，由于 Hubble
              自行设计并运营星载射频接收机及卫星通信载荷，公司受制于美国《国际武器贸易条例》（ITAR），要求其航天工程业务执行严密的出口管制与人员资质审查。
            claimRefs:
