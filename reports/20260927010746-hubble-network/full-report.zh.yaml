  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 替代技术架构与直连设备（D2D）卫星物联网格局
        blocks:
          - type: paragraph
            body: >
              偏远地区资产连接与物联网（IoT）追踪市场正在围绕直连设备（D2D）卫星架构发生结构性分化。传统蜂窝网络仅覆盖地球陆地面积的约 15%，广袤的海洋、农业区和偏远工业带均无地面信号。早期的卫星 IoT
              方案主要依赖每台成本在 $10 至 $50 或更高的专用卫星终端与调制解调器，高昂的硬件 BOM 成本让大批量、低毛利的资产追踪在经济上完全不可行。为此，卫星 IoT
              方案分化出两种截然不同的技术路线：超低功耗单向遥测网络，以及高吞吐量双向指挥与控制系统。


              Hubble Network 选择切入单向遥测路线，使现成商用 Bluetooth Low Energy（BLE）芯片组（例如 Nordic Semiconductor nRF52/nRF54
              系列）无需专用射频前端、网关硬件或卫星调制解调器，即可直接向近地轨道（LEO）卫星发射信号。与 Hubble 同台竞技的包括遵循标准的 3GPP 非地面网络（NTN）服务商 Skylo、欧洲专用 LEO 星座
              Kinéis，以及 Swarm（SpaceX）和 Iridium 等传统卫星运营商。3GPP NTN 方案侧重蜂窝与卫星的无缝融合及运营商漫游，而 Hubble 则将重心放在极小模块尺寸（<1
              cm²）、超低休眠电流（1–3 μA）以及低于 $0.50 的新增硬件成本上。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
