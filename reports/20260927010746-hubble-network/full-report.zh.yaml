      - number: '3.2'
        title: 竞对画像、技术范畴与能力矩阵
        blocks:
          - type: paragraph
            body: >
              评估各竞品方案需综合考量核心替代路径在射频频谱分配、硬件形态、功耗表现及运营商集成模式上的差异：


              Skylo 是契合行业标准路线的核心代表，依托地球静止轨道及合作伙伴卫星资源部署 3GPP Release 17 NB-IoT/LTE-M NTN 协议。Skylo
              与移动网络运营商（MNO）的用户管理系统直接打通，提供统一的混合 SIM 卡，允许商业设备在地面蜂窝网通信并在失联时故障切换至卫星 NTN。但 Skylo 依赖专用的调制解调器级芯片（封装尺寸达 15×15
              mm+），发射功耗较高（通常为 23 dBm），且因需维持持续或周期的下行寻呼窗口，其休眠电流超过 10 μA。


              Kinéis 运营着一个由 25 颗欧洲近地轨道卫星组成的专用星座，沿袭了 401 MHz UHF 频段的 Argos 系统遗产。Kinéis 虽然能提供存储转发遥测以及可选的双向下行链路，但其 UHF
              频段需要更大的实体天线（四分之一波长鞭状或螺旋天线），其 25×25 mm 模块在发射时功耗约 500 mW。2021 年被 SpaceX 收购的 Swarm Technologies 运营着 150+ 颗
              VHF 频段卫星，采用自研 Tile 调制解调器（~43×30 mm，发射功耗 ~1 W）；但在 Starlink 体系下，Swarm 面临老旧硬件路线图不明朗、迁移规划不透明等问题。以 Apple Find
              My 与 Google Find My Device 为代表的地面 Bluetooth 扫描网络虽然零卫星成本，但完全依赖众包消费级智能手机的分布密度，在乡村、海洋或无人区彻底失效。
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
