              Hubble 对外呈现的是由固件激活的连接订阅服务，而非披露硬件毛利的传统硬件生意。公司称，已部署的标准 Bluetooth 芯片无需更换硬件即可启用；独立报道则给出约 $4
              的单设备月订阅价。商业模式因此指向按活跃终端收费的持续网络接入。公开资料还提到自助开发套件和企业试点，但未说明套件销售、实施服务、卫星接入和地面接入是否分别收费。10 多家试点客户及据报道超过 500,000
              台活跃设备，可作为采用度指标；但这不等于客户数、签约 ARR 或确认收入，也不能证明客户留存，更不能说明刊例价已在企业规模部署中兑现。
