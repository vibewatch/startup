              颗。这一十倍的船队扩容意味着庞大的制造、发射、保险、地面网络和运营履约义务，但指定证据并未披露已签署的采购承诺或支出时间表。Multiples 另行估计，建设、发射并运营一个完整星座需耗资约 $100
