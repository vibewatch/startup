      - number: '3.4'
        title: 护城河韧性、架构瓶颈与战略劣势
        blocks:
          - type: paragraph
            body: >
              Hubble 的核心差异化优势在于其高灵敏度卫星相控阵接收器，能够跨越 550–600 km 的轨道距离捕获微弱的 +20 dBm BLE
              广播数据包。然而，这一架构选择带来了严重的物理技术约束，反过来保护了高阶应用中的老牌玩家。Hubble
              的协议本质上是单向上行链路：卫星无法向下发送下行确认信号、空中下载（OTA）配置变更指令或向现场终端下发固件补丁。如果企业需要双向指挥与控制——例如触发远程阀门执行机构或更新车队路线参数——Hubble
              在架构上被直接排除在外。


              此外，Hubble 目前在轨星座仅由 6 颗在运行卫星组成，受卫星过顶轨道几何角度影响，重访时延较高，在 15 minutes 至数小时不等。虽然 Hubble 凭借 $200 million Series C
              融资规划了在 2030 年前扩建至 60 颗卫星的路线图（以将重访周期缩短至接近连续覆盖），但传统星座（Iridium、Globalstar）以及运营商支持的 3GPP NTN
              联盟已能提供实时或低时延的双向覆盖。此外，诸如 Life360 的无约束力意向书等商业合作，也暴露出执行进度上的外部依赖，因为最终排他性协议的达成仍取决于伙伴谈判及星座扩容里程碑。
            claimRefs:
              - CP004
              - CP008
              - CP013
              - CP014
              - CP016
      - number: '3.5'
        title: 核心图表
        blocks:
          - type: callout
            title: 直连设备卫星物联网的技术路线分化
            body: >
              卫星 IoT 市场正在分化为两条截然不同的技术路线。第一条路线聚焦于大众资产追踪的超低功耗单向上行遥测，省去专用调制解调器将单机成本压缩至 50
              美分以下。第二条路线聚焦于关键任务指挥与控制的双向运营商融合通信（3GPP NTN）。如果单纯为了遥测追踪而选用双向调制解调器架构，会带来不必要的功耗与 BOM 成本负担。
            calloutType: insight
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP006
          - type: callout
            title: 下行能力缺失与星座时延制约
            body: >
              Hubble 的核心差异化在于复用标准 BLE 射频芯片向太空发射信号，但这天然欠缺下行接收能力。终端设备无法通过卫星接收空中下载（OTA）固件更新、动态重配指令或网络确认包。此外，由于在轨仅有 6
              颗在运行卫星，15 minutes 至数小时的重访时延导致在星座完成扩容前，其落地场景被严格限制在耐受延迟的用例范围内。
            calloutType: risk
            claimRefs:
              - CP004
