      - number: '6.2'
        title: 采纳轨迹与网络规模
        blocks:
          - type: paragraph
            body: >
              Hubble Network 披露的技术采用轨迹反映了其混合地面网络的快速扩张，并由持续增加的受管接入点提供支撑。公司宣布其网络上的活跃设备在 2026 年 9 月达到 500,000 台，相比前 12
              个月实现了超过 10 倍的增长。这一部署规模的爆发期恰逢 Hubble 将卫星网络从封闭的商业试点访问转向全面正式商用（GA），使得任何标准 Bluetooth 终端均可通过 OTA 固件更新直接连接轨道接收机。


              庞大设备规模的基石是 Hubble 的地面网络资产，由跨越 170 个国家、覆盖约 300 万平方英里的超过 100 million
              个网关组成。该地面基础设施使身处城市、仓库和物流中转枢纽的设备无需消耗轨道上行资源即可上传遥测数据。然而，商业落地仍处于变现早期。尽管 Hubble 报道称在 2025 年底与 10
              多家商业试点客户开展合作，但公司未披露从试点评估到多年生产期订阅的转化率，亦未报告客户品牌名单或客户群留存数据。
            claimRefs:
              - CU001
              - CU002
              - CU006
              - CU008
              - CU012
