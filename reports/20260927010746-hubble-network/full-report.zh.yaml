      - number: '1.4'
        title: 卫星星座路线图、运营里程碑与轨道衰减
        blocks:
          - type: paragraph
            body: >-
              Hubble Network 目前在空间段拥有 6 颗部署于近地轨道的在轨试验立方星。首批星座硬件由公司联合 Spire Global 设计制造，通过 SpaceX Falcon 9 拼车任务（包括
              Transporter-10）发射入轨。值得注意的是，其在轨卫星数量此前为 7 颗；其中 1 颗航天器过早发生轨道衰减并再入脱轨，目前仅存 6
              颗在运行平台每日飞越北美上空。尽管首批航天器验证了在不改动硬件的前提下实现地面到轨道的 BLE 信号捕获，但稀疏的轨道密度导致超出地面网关覆盖范围的偏远设备面临数小时的重访间隔。


              为实现连续的全球遥测，Hubble Network 已与卫星制造商 Muon Space 签署商业合同，在其 MuSat XL 平台上搭载定制的下一代载荷。根据架构路线图，公司计划到 2030 年部署由 60
              颗更大型卫星构成的完整运营星座，其中前两颗量产型航天器定于 2027 年发射。每颗下一代平台的天线表面积均为 Spire 制立方星的十倍，可将并发信号处理能力扩容至千万级联网设备。伴随空间轨道推进，Hubble
              于 2026 年 9 月从特邀企业试点合作（包括车队物联网龙头 Samsara）正式转向公开全面商用（GA），商业设备运营商只需空中下载（OTA）固件更新即可激活卫星直连。
