chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司定位、发展阶段与全球业务规模
        blocks:
          - type: paragraph
            body: >-
              Hubble Network 是一家获风投支持的商业航天技术与物联网（IoT）运营商，于 2021 年 10 月注册成立，总部位于华盛顿州 Seattle。公司出自 Y Combinator 2022
              年冬季加速营（W22），其开发的技术架构使数十亿存量传感器、标签及工业设备中内置的通用 Bluetooth Low
              Energy（BLE）芯片能够直接与近地轨道（LEO）卫星通信。公司省去专用卫星调制解调器与昂贵的蜂窝连接硬件，将设备硬件改造成本降至 50 美分以下，并确立了每台设备每月约 4 美元的经常性连接服务收费模式。


              公司的业务布局由两个互补部分组成：由试验航天器构成的轨道星座，以及覆盖 170 个国家、约 300 万平方英里、包含超过 100 million 个扫描设备的庞大地面网关网络。截至 2026 年 9
              月，该混合网络管理着超过 500,000 台在网活跃设备，在过去 12 个月内实现了十倍增长。Hubble Network 扎根于 Seattle 的航空航天与卫星工程产业集群，拥有约 70 名员工，位列
              GeekWire 200 太平洋西北地区顶尖初创公司榜单 No. 135。
