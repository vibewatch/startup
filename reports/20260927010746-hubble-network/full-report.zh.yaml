  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与频谱许可风险敞口
        blocks:
          - type: paragraph
            body: >-
              Hubble Network 直接从太空接收标准 Bluetooth Low Energy
              传输信号，给跨国电信监管管辖带来了前所未有的合规考量。尽管该公司持有美国联邦通信委员会（FCC）的实验性及商业运营授权，但全球部署仍需遵从国际电信联盟（ITU）的协调框架以及每个目标国家的本地射频法规。鉴于
              2.4 GHz 频段的 Bluetooth
              传统上被划归地面工业、科学与医疗（ISM）用途，星载接收可能会在工业密集地区面临监管审查或地面运营商的干扰投诉。若在未公开确认获得全面国际落地权的情况下，将全面商用（GA）从本土试点向外拓展，将给跨国运营硬件的全球供应链客户带来合规风险。
            claimRefs:
              - CR001
              - CR002
              - CR003
          - type: table
            tableRef: TR001
            claimRefs:
