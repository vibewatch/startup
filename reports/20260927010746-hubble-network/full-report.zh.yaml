      - number: '1.3'
        title: 融资历程、Series C 轮与投资人阵容
        blocks:
          - type: paragraph
            body: >-
              2026 年 9 月 23 日，Hubble Network 宣布完成超额认购的 $200 million Series C 融资，投后估值达 $1.6 billion，正式晋升独角兽行列。本轮融资由前
              Salesforce 联席 CEO Keith Block 创立的 Smith Point Capital 领投，商业航天专业基金 Seraphim Space、澳大利亚风投机构 Carthona
              Capital、气候与基础设施投资方 Earthshot Ventures、Y Combinator 以及早期投资方 RPM Ventures 跟投。在此之前，公司于 2023 年 3 月完成了由
              Transpose Platform 领投的 $20 million Series A 融资，并于 2025 年 9 月完成了 $70 million Series B 融资；此轮注资使 Hubble
              Network 累计股权融资金额达到 $300 million。


              Series C 轮融资使 Hubble Network 跻身全球资金最充裕的直连设备（D2D）卫星初创企业之列。除一级市场融资外，Nasdaq Private Market
              等另类交易平台也开始撮合未注册老股流动性意向。尽管估值从早期风投阶段快速跃升至 $1.6 billion，Hubble Network
              仍保持严格的非公开披露口径：年经常性收入（ARR）、毛利率以及客户净现金消耗率依然保密，是潜在投资者开展尽调时需重点核实的核心指标。
