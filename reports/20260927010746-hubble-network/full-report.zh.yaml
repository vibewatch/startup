      - number: '2.4'
        title: 应用驱动因素、数据配额与星座部署制约
        blocks:
          - type: paragraph
            body: >-
              供应链全流程追踪合规要求、冷链强监管政策，以及 Nordic Semiconductor、Texas Instruments 和 InPlay
              等半导体龙头的生态协同，共同拉动了技术落地节奏。然而，严苛的实际运营条件仍然制约着大规模部署的可行性。卫星端 Bluetooth 上行链路受制于严格的物理学与载荷条件，仅适合周期性小数据包遥测（如 GPS
              坐标、温度超限预警及碰撞震动警报），无法承载高频连续数据流。正如 1NCE 售价 $14 的终身套餐（将生命周期流量限制在 500MB）等低成本蜂窝 IoT
              商业模式所反映的那样，计划外的空中下载（OTA）固件更新与高频回传可能会迅速耗尽数据配额或电池电量。Hubble Network 若想在实际落地中取得成功，必须在目前仅有 6
              颗低轨在运行卫星的现状下管理好客户对重访时延的预期。在 2030 年完成 60 颗完整星座部署之前，赤道及偏远地区的设备只能获得间歇性卫星过顶覆盖，必须在设备端完成本地数据缓存，这直接限制了实时紧急干预能力。
            claimRefs:
              - CM013
              - CM014
