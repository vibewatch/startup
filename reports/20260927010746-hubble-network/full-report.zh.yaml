    data:
      items:
        - date: 2021-10
          label: 公司注册成立
          detail: Alex Haro、Ben Wild 与 John Kim 在华盛顿州西雅图注册成立 Hubble Network。
          tone: neutral
        - date: 2022-01
          label: Y Combinator W22
          detail: 入选 Y Combinator 2022 年冬季批次（W22），研发卫星蓝牙连接技术。
          tone: positive
        - date: 2023-03
          label: A 轮融资（$20M）
          detail: 完成由 Transpose Platform 领投，YC、Seraphim Space 与 11.2 Capital 跟投的 $20M A 轮融资。
          tone: positive
        - date: 2024-03
          label: 首批卫星部署
          detail: 搭乘 SpaceX Transporter-10 发射首批立方星，验证地面蓝牙直连轨道接收能力。
          tone: positive
        - date: 2025-09
          label: B 轮融资（$70M）
          detail: 筹集 $70M B 轮资金，用于扩建地面网关网络及开展初步卫星测试。
          tone: positive
        - date: 2026-06
          label: 立方星轨道衰减
          detail: 7 颗初期验证立方星中 1 颗退化脱轨，使在轨运行的空间段卫星减至 6 颗。
          tone: negative
        - date: 2026-09
          label: C 轮独角兽融资（$200M）
          detail: 获得由 Smith Point Capital 领投的 $200M C 轮融资，估值达 $1.6B，使累计融资金额达到 $300M。
          tone: positive
        - date: 2026-09
          label: 全面商用与 Muon Space 合约
          detail: 网络正式面向公众全面商用，并与 Muon Space 签约建设面向 2030 年的 60 颗卫星星座。
          tone: positive
