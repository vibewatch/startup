  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 按时间顺序梳理 Hubble Network 从 2021 年成立至 2026 年 C 轮全面商用期间的运营、技术与融资里程碑。
    approximationNotes: 里程碑日期反映公开披露的公司注册、融资公告、轨道发射以及网络开放日期。
