      - number: '2.2'
        title: 市场测算视角、增长预测与直连设备（D2D）扩张
        blocks:
          - type: paragraph
            body: >-
              卫星物联网（Satellite IoT）的市场测算反映出企业正加速转向直连设备（D2D）架构。据 Fortune Business Insights 数据，全球卫星 IoT 市场在 2025 年规模为 $2.01
              billion，预计到 2034 年将达到 $6.51 billion，呈现稳健的长期复合年均增长态势。直连设备链路预计在 2026 年占到全部卫星 IoT 连接的
              68.84%，反映出免专用硬件与免专用网关的上行架构正逐步替代专用卫星终端设备。Hubble Network 的潜在市场空间既涵盖对存量 Bluetooth
              追踪设备的直接升级，也包含此前未纳入监控的供应链增量部署。依托分布在 170 个国家、包含 100 million 个扫描网关的地面网络，Hubble 已连接超过 500,000
              台活跃设备，在稳固地面覆盖的同时将偏远地区流量引入轨道。然而，要完全吃透卫星 IoT 支出，公司必须突破当前 6 颗在轨低轨航天器的限制，在 2030 年前如期建成规划中的 60
              颗卫星星座，以保障全球运输路线上的低时延遥测更新。
