      - number: '8.4'
        title: 投资建议、尽调路径与否决标准
        blocks:
          - type: paragraph
            body: >-
              综合技术差异化壁垒、资本结构、星座执行风险以及二级老股流动性匮乏等多重考量，我们给出继续研究（Research-More）的投资建议，评定风险等级为高（High），估值立场为偏高（Stretched）。尽管
              Hubble Network 已经跑通蓝牙直连卫星链路，并在 100 million 个地面网关中累计接入超 500,000 台活跃设备，但投后估值大幅跳升 5.4x 达 $1.6
              billion，已提前透支了未来数年高度激进的业务执行预期，对任何运营闪失几乎毫无容错空间。


              在注入股权资本或参与老股流动性项目之前，机构投资者必须紧盯四条关键证实性尽调路径：第一，获取经审计的股权结构表及 C 轮股票购买协议，逐项核实清算分配瀑布流；第二，对 6
              颗在轨卫星开展技术链路余量审查，精确核验数据包误码率；第三，审计 Samsara、Life360 及 Reelables 等试点伙伴的客户留存、流失率与净收入留存率（NRR）；第四，核对与 Muon Space
              及拼车发射经纪商锁定的固定成本发射合同。一旦触发以下破坏投资逻辑的硬性指标，必须立即转向回避（Avoid）立场：未能如期发射规划中的批次星座、年度客户流失率超过
              15%，或是主流电信联盟出台直连手机的蓝牙技术标准。
            claimRefs:
              - CV001
              - CV005
              - CV009
              - CV010
              - CV011
              - CV014
      - number: '8.5'
        title: 重点展品
        blocks:
          - type: callout
            title: 估值立场与入场纪律
            body: >-
              Hubble Network 的 $1.6 billion 投后估值提前打入了激进的收入转化预期与毫无波折的星座组网进度。鉴于一级市场老股流动性匮乏，加之 500,000
              台在网设备的收入变现尚未得到核实，机构投资者应保持继续研究立场，在投入成长期资本前，务必索取经审计的客户队列经济模型并确认发射里程碑兑现。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV013
          - type: callout
            title: 星座资本开支与优先清算受偿压顶
            body: >-
              随着 C 轮融资完成 $200 million，Hubble Network 必须将资金投向增造并部署 54 颗卫星，以达成 2030 年前拥有 60 颗卫星的目标。由此确立的 $200 million C
              轮清算优先权固然为新入场资本构筑了坚实的下行屏障，却大幅抬高了早期投资者与普通股股东的回报门槛。
            calloutType: risk
            claimRefs:
              - CV002
              - CV007
              - CV009
