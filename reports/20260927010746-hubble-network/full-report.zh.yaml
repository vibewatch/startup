      - number: '7.2'
        title: 运营可靠性与在轨卫星损耗
        blocks:
          - type: paragraph
            body: >-
              Hubble Network 面临的核心运营瓶颈在于星座密度与航天器可靠性。公司在先前发射了 7 颗卫星后，目前在近地轨道运行着 6 颗卫星，其中 1 颗卫星在全面商用前脱离轨道坠毁。仅依靠 6
              颗在轨运行航天器，对更新频率与链路可用性造成了严苛的物理限制：处于地面网关接收范围之外的偏远 IoT 设备，必须等待每日仅发生数次的轨道过顶窗口。尽管 Hubble 覆盖 170 个国家的超过 100
              million 个地面网关网络为其超过 500,000 台活跃设备承担了大量本土流量，但在 60 颗卫星星座于 2030 年达到目标轨道密度之前，偏远地区的运营依然极易受到高时延的困扰。
            claimRefs:
