  - id: FV001
    title: 投资建议推演逻辑
    type: flow
    summary: 串联商业化规模、星座资本开支、老股流动性受限与估值约束，推导投资立场的决策逻辑。
    data:
      nodes:
        - label: 商业规模：500k+ 活跃设备
        - label: 单位经济模型：硬件 BOM 成本 <$0.50
        - label: 资本开支门槛：60 颗卫星需 $100M+
        - label: 估值基准：$1.6B C 轮定盘价
        - label: 流动性约束：老股交易有限
        - label: 投资立场：继续研究 / 估值偏高
      edges:
        - from: 'Commercial Scale: 500k+ Active Devices'
          to: 'Unit Economics: <$0.50 BOM Hardware Cost'
        - from: 'Unit Economics: <$0.50 BOM Hardware Cost'
          to: 'Capex Hurdle: $100M+ for 60 Satellites'
        - from: 'Capex Hurdle: $100M+ for 60 Satellites'
          to: 'Valuation Benchmark: $1.6B Series C Mark'
        - from: 'Valuation Benchmark: $1.6B Series C Mark'
          to: 'Liquidity Constraint: Limited Secondary Activity'
        - from: 'Liquidity Constraint: Limited Secondary Activity'
          to: 'Investment Stance: Research-More / Stretched'
    approximationNotes: 逻辑流程图综合量化证据，提炼估值把关门槛。
