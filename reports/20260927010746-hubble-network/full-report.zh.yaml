      - number: '5.2'
        title: 运行架构与芯片集成
        blocks:
          - type: paragraph
            body: >-
              Hubble 的技术架构通过芯片固件与星载接收端的协同创新，弥合了极端苛刻的链路预算。将 2.4 GHz 信号从地面跨越 550 至 650
              公里发射至以轨道速度飞行的卫星，必须克服巨大的路径损耗、大气衰减及严重的多普勒频移。Hubble
              的技术应对方案包括大幅压低数据传输码率、嵌入前向纠错码（FEC）以及动态补偿多普勒频移。设备端软件开发套件（SDK）基于开源的 Zephyr RTOS 构建，能以极低的工程开销集成到 Silicon Labs
              MG24 以及 Texas Instruments CC2340 和 CC2755x 无线微控制器中。在接收端，Hubble 卫星部署了由 100 多个协同单元组成的高性能相控阵天线，用于放大地面以 13 至
              20 dBm 功率发射的微弱信号。
