        - "Launch schedule delays extending capex burn; customer churn among price-sensitive IoT logistics clients."
        - "50%"
      - - "Bear Case"
        - "Enterprise conversion stalls below 1.5M devices; constellation cost overruns require dilutive bridge round; secondary illiquidity persists."
        - "$300M-$500M restructuring or strategic sale (1x-2x invested capital); Series C 1.0x liquidation preference impairs common equity."
        - "Down-round financing triggered by constellation funding exhaustion; failure of Muon Space XL host payloads."
