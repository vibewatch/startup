        - "$3.5B-$5.0B terminal valuation (12x-15x projected ARR); 2.2x-3.1x MOIC from Series C price ($17.20/share)."
        - "Spectrum interference, orbital collision, or accelerated direct-to-cell competition from telecom giants."
