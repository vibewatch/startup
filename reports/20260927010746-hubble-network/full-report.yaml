      - number: '1.4'
        title: Satellite Constellation Roadmap, Operational Milestones, and Orbital Decay
        blocks:
          - type: paragraph
            body: >-
              Hubble Network's space segment currently comprises six operational demonstration cubesats deployed in
              low-Earth orbit. The initial constellation hardware, engineered and fabricated in collaboration with Spire
              Global, was deployed across SpaceX Falcon 9 rideshare flights, including the Transporter-10 mission.
              Notably, the operational orbital population was previously seven satellites; one spacecraft experienced
              premature orbital decay and de-orbited, leaving six operational platforms conducting daily passes over
              North America. While these initial spacecraft validate ground-to-orbit BLE signal acquisition without
              hardware modification, sparse orbital density results in multi-hour revisit gaps for remote devices
              situated beyond terrestrial gateway reach.


              To achieve continuous global telemetry, Hubble Network has executed a commercial contract with satellite
              manufacturer Muon Space to host custom next-generation payloads on its MuSat XL platform. The company's
              architectural roadmap targets a full operational constellation of 60 larger satellites by 2030, with the
              first two production spacecraft scheduled for launch in 2027. Each next-generation platform features ten
              times the antenna surface area of the Spire-built cubesats, expanding simultaneous signal processing
              capacity to more than ten million connected devices. Alongside this orbital roadmap, Hubble transitioned
              from invite-only enterprise pilot partnerships (including connected fleet leader Samsara) to public
              general availability in September 2026, enabling commercial device operators to activate satellite
              connectivity via over-the-air firmware updates.
            claimRefs:
              - CO008
              - CO009
              - CO010
              - CO011
              - CO012
