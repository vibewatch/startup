      - number: '7.3'
        title: Supply Chain and Partner Dependencies
        blocks:
          - type: paragraph
            body: >-
              Hubble Network's capital efficiency relies on outsourcing satellite manufacturing and commodity hardware
              integration, creating substantial counterparty concentration risk. The company has contracted with
              satellite operator Muon Space to host its next-generation payloads on the MuSat XL bus platform, making
              Muon Space's production velocity and launch manifests single-point failure vectors for constellation
              scaling. On the client device side, integrations with semiconductor suppliers including Texas Instruments
              and InPlay tie client device economics to component availability and lead times. Furthermore, hardware
              founders deploying Bluetooth trackers face severe supply chain hazards: United States Section 301 tariffs
              on Chinese electronics add 7.5% to 25% to component costs, while single-source silicon components expose
              deployments to allocation freezes and broker quality defects.
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
          - type: table
            tableRef: TR003
            claimRefs:
