              - CE014
      - number: '5.4'
        title: Data Infrastructure, Security, and Quality Controls
        blocks:
          - type: paragraph
            body: >-
              Enterprise adoption of distributed IoT tracking requires robust cloud data ingestion, rigorous security
              controls, and strict regulatory compliance. Hubble processes telemetry from over 500,000 active devices
              through a modern cloud lakehouse architecture that routes raw packet streams through Apache Iceberg,
              Amazon Redshift, and automated reconciliation pipelines. Because Hubble's network captures transmissions
              across 170 countries, the platform enforces strict data governance: telemetry pipelines implement
              automated PII masking and sensitivity tagging to maintain customer confidentiality. Additionally, because
              Hubble designs and operates spaceborne radio frequency receivers and satellite communication payloads, the
              company is subject to U.S. International Traffic in Arms Regulations (ITAR), requiring strict export
              controls and personnel vetting across its space engineering operations.
            claimRefs:
              - CE006
              - CE012
              - CE013
          - type: table
            tableRef: TE003
            claimRefs:
