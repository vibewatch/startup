  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Customer Workflow
        blocks:
          - type: paragraph
            body: >-
              Hubble Network redefines low-power wide-area IoT connectivity by enabling standard Bluetooth Low Energy
              silicon to communicate directly with low Earth orbit satellites. Traditional asset tracking beyond
              cellular reach requires specialized satellite transceivers that cost $25 to $50 per module and consume
              significant power. Hubble's solution replaces this hardware tax with a software-only firmware update that
              operates on commodity BLE chips costing $0.50 to $3.00. In enterprise workflows, the end device broadcasts
              a standard BLE advertisement containing device coordinates and up to 13 bytes of arbitrary sensor payload.
              Data is ingested seamlessly across Hubble's hybrid network—either captured locally by over 100 million
              terrestrial gateways or received in orbit by Hubble satellites—and delivered to customer ERP, WMS, and TMS
              platforms via REST APIs and webhooks.
            claimRefs:
              - CE001
              - CE003
              - CE005
              - CE011
              - CE014
          - type: table
            tableRef: TE001
            claimRefs:
