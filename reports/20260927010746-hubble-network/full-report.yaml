            title: Capital-Efficient Bluetooth-to-Orbit Disruption
            body: >-
              By pairing 6 low-Earth orbit satellites with an existing global base of roughly 90 million to 100 million
              terrestrial Bluetooth gateways, Hubble Network bypasses expensive cellular and proprietary satellite
              modems, enabling asset tracking with sub-50-cent chips and $4 monthly subscriptions.
            calloutType: insight
