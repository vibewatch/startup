  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Coverage Gaps, and Cellular Substitution Deficit
        blocks:
          - type: paragraph
            body: >-
              The global tracking and telemetry market exhibits a structural divide dictated by terrestrial network
              physics. Conventional cellular networks—including LTE-M and NB-IoT—reach approximately 15% of Earth's
              total landmass, leaving 85% of geographic terrain without terrestrial wireless coverage. Assets operating
              outside urban corridors and major transportation arteries, such as intermodal shipping containers, remote
              agricultural machinery, cold-chain reefer trailers, and oilfield equipment, immediately drop into
              operational blind spots upon departing cellular cell tower range. Historically, closing this connectivity
              gap required dedicated satellite transceiver hardware costing between $10 and $50 per device, plus ongoing
              high-cost satellite subscriptions. This substantial hardware cost created an economic threshold where only
              high-value capital assets could justify satellite tracking. Mid-sized enterprises incur an estimated
              average of $13 million annually in asset loss and theft due to off-grid transit visibility deficits.
              Hubble Network redefines the market boundary by utilizing commodity Bluetooth Low Energy silicon to bridge
              terrestrial infrastructure and low Earth orbit satellites without dedicated modems.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM004
