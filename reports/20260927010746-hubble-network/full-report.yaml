      - number: '6.4'
        title: Customer Economics, Retention & Expansion Risks
        blocks:
          - type: paragraph
            body: >
              The economic calculus for adopting Hubble Network depends heavily on deployment scale, message update
              frequency, and geographic distribution. Hubble positions its connectivity at a list price of $1 to $2 per
              device monthly ($12 to $24 annually), with aggressive volume discounting dropping per-device annual costs
              toward approximately $6 for enterprise deployments exceeding 100,000 units. For global tracking
              applications requiring frequent reporting, Hubble provides predictable fixed billing compared to cellular
              roaming tariffs or usage-metered cloud services like Amazon Sidewalk.


              Conversely, for small-scale fleets operating within dense residential or metropolitan areas, alternative
              networks offer significant cost advantages. For example, Amazon Sidewalk charges no direct network access
              fee, resulting in estimated annual costs of approximately $1.10 per device for daily reporting at
              1,000-unit scale, compared to Hubble's $12 to $24 baseline. Furthermore, Hubble faces operational
              expansion constraints tied to its constellation deployment schedule. With six satellites currently
              operational in low Earth orbit and a roadmap targeting 60 satellites by 2030, latency and update intervals
              in remote areas remain dependent on orbital pass windows. In the absence of published customer cohort
              retention or churn metrics, long-term customer durability remains a critical diligence topic.
            claimRefs:
              - CU007
              - CU008
              - CU009
              - CU011
