      - number: '1.3'
        title: Capitalization History, Series C Financing, and Investor Syndicate
        blocks:
          - type: paragraph
            body: >-
              Hubble Network achieved unicorn status on September 23, 2026, announcing the completion of an
              oversubscribed $200 million Series C financing round that established a private market equity valuation of
              $1.6 billion. The transaction was led by Smith Point Capital, founded by former Salesforce Co-CEO Keith
              Block, with participation from specialist space fund Seraphim Space, Australian venture firm Carthona
              Capital, climate and infrastructure investor Earthshot Ventures, Y Combinator, and early-stage backer RPM
              Ventures. The injection raised Hubble Network's cumulative equity capital raised to $300 million,
              following a $20 million Series A round in March 2023 led by Transpose Platform and a $70 million Series B
              round completed in September 2025.


              The Series C financing positions Hubble Network among the best-capitalized direct-to-device satellite
              startups globally. Beyond primary funding rounds, unregistered secondary market liquidity interest is
              facilitated on alternative trading venues including Nasdaq Private Market. Despite rapid valuation
              expansion from early-stage venture funding to a $1.6 billion valuation, Hubble Network maintains private
              disclosure discipline: annual recurring revenue (ARR), gross profit margins, and net customer cash burn
              remain confidential, representing primary diligence verification priorities for prospective investors.
            claimRefs:
