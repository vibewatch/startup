      - number: '2.2'
        title: Market Sizing Lenses, Growth Projections, and Direct-to-Device Expansion
        blocks:
          - type: paragraph
            body: >-
              Market sizing for satellite-enabled Internet of Things reflects accelerating enterprise migration toward
              direct-to-device architectures. According to Fortune Business Insights, the global satellite IoT market
              was valued at $2.01 billion in 2025 and is forecasted to reach $6.51 billion by 2034, exhibiting robust
              long-term compound annual growth. Direct-to-device links are projected to represent 68.84% of all
              satellite IoT connections in 2026, indicating that hardware-free and gateway-free uplink models are
              displacing specialized satellite terminal equipment. Hubble Network's addressable opportunity spans both
              the immediate conversion of existing Bluetooth tracking devices and greenfield deployments across
              unmonitored supply chains. With more than 500,000 active devices connected across its terrestrial network
              of 100 million scanning gateways in 170 countries, Hubble captures terrestrial presence while
              transitioning remote traffic to orbit. However, capturing full addressable satellite IoT spend requires
              expanding beyond its current six operational low Earth orbit spacecraft toward a planned 60-satellite
              constellation by 2030 to guarantee low-latency telemetry updates across global transit routes.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
