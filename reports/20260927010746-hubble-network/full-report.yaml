chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Stage, and Global Scale
        blocks:
          - type: paragraph
            body: >-
              Hubble Network is a venture-backed commercial space technology and Internet of Things (IoT) operator
              incorporated in October 2021 and headquartered in Seattle, Washington. Originating from Y Combinator's
              Winter 2022 accelerator cohort, the company has developed an architectural model that enables commodity
              Bluetooth Low Energy (BLE) silicon embedded in billions of existing sensors, tags, and industrial devices
              to communicate directly with low-Earth orbit (LEO) satellites. By eliminating dedicated satellite modems
              and expensive cellular connectivity hardware, Hubble Network reduces device hardware enablement costs
              below fifty cents while establishing recurring connectivity services priced at approximately four dollars
              monthly per device.


              The company's operational footprint integrates two complementary segments: an orbital constellation of
              demonstration spacecraft and an expansive terrestrial gateway network comprising more than 100 million
              scanners across 170 countries and approximately three million square miles of coverage. As of September
              2026, the hybrid network manages more than 500,000 active connected devices, reflecting a tenfold
              expansion over the trailing twelve-month period. Headquartered in Seattle's aerospace and satellite
              engineering cluster, Hubble Network employs roughly 70 people and ranks No. 135 on the GeekWire 200 index
              of top Pacific Northwest startups.
            claimRefs:
              - CO001
              - CO002
