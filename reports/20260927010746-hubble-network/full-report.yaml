              - CE007
              - CE008
              - CE009
              - CE012
      - number: '5.3'
        title: Constellation Roadmap and Orbital Dependencies
        blocks:
          - type: paragraph
            body: >-
              Hubble currently operates a foundational constellation of six to seven satellites in low Earth orbit,
              providing baseline global satellite connectivity with approximately once-to-twice daily revisit passes. To
              transition from periodic asset check-ins to near-continuous global tracking, Hubble has partnered with
              Muon Space to host next-generation BLE payloads aboard MuSat XL 500 kg-class spacecraft. The initial MuSat
              XL satellites deliver a 12-hour revisit window using advanced multi-kilowatt power architectures and
              upgraded receivers capable of detecting signals at significantly lower power thresholds. Supported by a
              $200 million Series C financing, Hubble plans to scale the orbital network to 60 operational satellites by
              2030, reducing revisit latency down to minutes and enabling high-frequency telemetry across logistics,
              agricultural, and industrial monitoring applications.
            claimRefs:
              - CE008
              - CE009
              - CE010
          - type: table
            tableRef: TE002
