      - number: '4.2'
        title: Pricing, hardware economics, and missing margins
        blocks:
          - type: paragraph
            body: >-
              The visible pricing advantage sits at the device edge. GeekWire and Briefs Finance report roughly $0.50 of
              Bluetooth hardware and a $4 monthly subscription, while Citybiz describes dedicated satellite hardware at
              $10 to $50 per chip. Those figures support a lower upfront connectivity bill of materials, but they do not
              reveal Hubble's realized average revenue per device or its gross profit. No assigned source discloses
              enterprise volume discounts, free-pilot treatment, partner revenue shares, launch and ground-station
              expense, cloud telemetry cost, satellite depreciation, or support burden. Consequently, a
              contribution-margin waterfall would require invented deductions. The investable diligence object is
              instead the bridge from a reported list price to unknown net revenue and unknown gross profit.
            claimRefs:
              - CI002
              - CI003
              - CI004
              - CI016
