      - number: '1.2'
        title: Executive Leadership, Co-Founders, and Key-Person Dependence
        blocks:
          - type: paragraph
            body: >-
              Hubble Network was founded by an executive team combining consumer IoT tracking scale, low-power wireless
              networking protocol development, and satellite payload systems engineering. Chief Executive Officer Alex
              Haro previously co-founded Life360, guiding the family location-sharing platform through its 2019 initial
              public offering on the Australian Securities Exchange while directing connected hardware initiatives.
              Chief Technology Officer Ben Wild previously founded crowdsourced wireless networking startup Iotera
              (acquired by Ring and subsequently Amazon) and served as the primary inventor and product architect of
              Amazon Sidewalk. Co-founder John Kim contributed extensive aerospace systems qualification and flight
              operations expertise gained at SSL (Maxar Technologies) and aerospace advisory practices.


              This leadership composition establishes strong founder-market fit across edge wireless telemetry and
              orbital mechanics. However, Hubble Network exhibits pronounced key-person dependency on Haro and Wild. The
              company's core technological differentiation—decoding weak sub-one-dollar Bluetooth signals across
              hundreds of miles of atmospheric attenuation via phased-array antenna processing and proprietary bitrate
              reduction tricks—relies directly on the co-founders' specialized domain knowledge. While corporate
              governance has expanded through institutional board participation from Smith Point Capital, technical
              execution and intellectual property evolution remain concentrated among its founding technologists.
            claimRefs:
              - CO001
              - CO004
              - CO005
