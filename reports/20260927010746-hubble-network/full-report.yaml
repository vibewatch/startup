      - number: '6.3'
        title: Named Customer Proof & Commercial Pilots
        blocks:
          - type: paragraph
            body: >
              Named customer proof centers on marquee enterprise partnerships and silicon integration milestones rather
              than broad public customer registries. Connected operations provider Samsara (NYSE: IOT) represents
              Hubble's primary named commercial deployment, actively piloting Hubble's infrastructure to track critical
              field machinery and industrial equipment operating in off-grid sites. For Samsara, Hubble's primary value
              proposition is providing field visibility beyond the perimeter of traditional cellular towers without
              requiring customers to install secondary satellite transceivers or modify deployed hardware.


              On the device manufacturing side, Hubble has established integration partnerships with semiconductor
              developer InPlay and printable shipping label provider Reelables. InPlay's sub-$1 IN100 NanoBeacon chip
              combines with Hubble firmware to deliver low-cost telemetry for cold chain monitoring, returnable
              transport items, and smart shipping labels. Similarly, Reelables integrates Hubble connectivity into
              printable paper-thin shipping labels to enable disposable package tracking across intermodal logistics.
              These relationships demonstrate technical interoperability and supply-side validation, though verified
              customer-level outcome metrics such as theft reduction percentages or operational cost savings remain
              privately held.
            claimRefs:
