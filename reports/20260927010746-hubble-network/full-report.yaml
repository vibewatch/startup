      - number: '4.4'
        title: Capital adequacy and underwriting verdict
        blocks:
          - type: paragraph
            body: >-
              Hubble announced a $200 million Series C in September 2026 at a $1.6 billion valuation, and several
              current reports put cumulative funding at $300 million. Seraphim's separately reported $30 million August
              investment should not be added again without confirming whether it is included in the Series C or
              cumulative total. Public databases also disagree: Multiples reports $321 million across five rounds, while
              Tracxn's page still reports only $20 million over one round. These conflicts make a management-provided
              capitalization table essential. More importantly, cumulative funding does not establish cash on hand,
              unrestricted liquidity, accounting losses, cash burn, runway, debt obligations, or ability to fund the
              2030 plan. The financial verdict is therefore evidence-constrained: recent financing is substantial, but
              revenue quality, margin path, capital intensity, and next-round timing remain ununderwritten.
            claimRefs:
