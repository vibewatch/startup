  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Spectrum Licensing Exposure
        blocks:
          - type: paragraph
            body: >-
              Hubble Network operates standard Bluetooth Low Energy transmissions directly from orbit, introducing
              unprecedented regulatory considerations across international telecommunications jurisdictions. While the
              company operates under United States Federal Communications Commission experimental and commercial
              authorizations, global deployment requires compliance with International Telecommunication Union
              coordination frameworks and local radio frequency rules across every targeted nation. Because Bluetooth
              frequencies in the 2.4 GHz band are traditionally allocated for terrestrial Industrial, Scientific, and
              Medical uses, orbital reception could face regulatory scrutiny or interference complaints from ground
              operators in dense industrial regions. Expanding general availability beyond domestic pilots without
              public confirmation of comprehensive international landing rights creates compliance exposure for global
              supply chain customers who operate hardware across borders.
            claimRefs:
              - CR001
              - CR002
              - CR003
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
      - number: '7.2'
        title: Operational Reliability and Constellation Attrition
        blocks:
          - type: paragraph
            body: >-
              The core operational bottleneck confronting Hubble Network is constellation density and spacecraft
              reliability. The company operates six satellites in low Earth orbit today after previously launching seven
              spacecraft, with one satellite having fallen out of orbit prior to general availability. Operating with
              only six active spacecraft imposes severe physical constraints on update frequency and link availability:
              remote IoT devices located outside terrestrial gateway reception must wait for orbital passes that occur
              only several times per day. While Hubble's terrestrial network of over 100 million gateways across 170
              countries handles significant domestic traffic for over 500,000 active devices, remote operations remain
              vulnerable to latency delays until the 60-satellite constellation achieves target orbital density by 2030.
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
