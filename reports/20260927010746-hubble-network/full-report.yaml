    rows:
      - - Technology & BOM
        - >-
          Firmware-only update enables standard BLE chips to reach space, cutting connectivity hardware costs below
          $0.50.
        - Radio frequency attenuation and link margin limitations may restrict throughput and message frequency.
        - Independent RF audit verifying packet delivery success rate across dense urban and remote geographies.
      - - Market & Traction
        - >-
          500k+ active connected devices and 100M+ terrestrial gateways across 170 countries provide massive
          distribution.
        - Monetization model ($4/month per device) unverified at enterprise scale with potential customer concentration.
        - Disclosed ARR surpassing $25 million with net revenue retention above 115% across key accounts.
      - - Constellation Capex
        - >-
          Capital-efficient constellation model estimated at $100 million total capex for 60 satellites via hosted
          payload partnerships.
        - Orbital launch delays, payload integration failures, or replacement capex could double cash burn requirements.
        - Successful deployment and operational commissioning of first 12 operational MuSat XL satellites.
      - - Capital Structure
        - 1.0x non-participating preferred shares provide clean conversion mechanics without participating dilution.
        - Senior Series C liquidation preference of $200 million creates substantial return hurdles for junior equity.
        - Cap table recapitalization or secondary transaction clearing at or above $17.20 per share.
