      - number: '4.3'
        title: Operating scale, constellation commitments, and cost drivers
        blocks:
          - type: paragraph
            body: >-
              Hubble reported six satellites operating in September 2026 and a plan to reach 60 by 2030. That tenfold
              fleet expansion implies material manufacturing, launch, insurance, ground-network, and operating
              obligations, but the assigned evidence does not disclose signed commitments or a cost schedule. Multiples
              separately estimates about $100 million to build, launch, and operate a full constellation; because that
              estimate combines several cost categories and describes a different timetable, it should be treated as
              directional rather than as a per-satellite capital cost. Headcount reports of about 70 to 73 provide only
              a weak operating expense proxy. They cannot support a burn estimate without payroll, contractor, launch,
              satellite-hosting, and infrastructure data.
            claimRefs:
              - CI007
              - CI008
              - CI015
              - CI016
          - type: table
