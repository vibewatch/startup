              - CE002
              - CE003
              - CE011
              - CE012
              - CE014
      - number: '5.2'
        title: Operating Architecture and Silicon Integration
        blocks:
          - type: paragraph
            body: >-
              Hubble's technical architecture bridges an extreme link budget through coordinated innovations across
              silicon firmware and spaceborne receivers. Transmitting a 2.4 GHz signal from Earth across 550 to 650
              kilometers to a satellite moving at orbital velocity requires overcoming heavy path loss, atmospheric
              attenuation, and severe Doppler shifts. Hubble resolves this by reducing data transmission bitrates,
              embedding forward error correction, and dynamically compensating for Doppler shifts. The device-side
              software development kit is built on the open-source Zephyr RTOS, enabling integration into Silicon Labs
              MG24 and Texas Instruments CC2340 and CC2755x wireless microcontrollers with minimal engineering overhead.
              On the receiving end, Hubble's satellites deploy high-performance phased array antennas featuring more
              than 100 coordinated elements that amplify faint terrestrial signals transmitted at 13 to 20 dBm.
            claimRefs:
              - CE001
              - CE002
              - CE004
              - CE007
              - CE008
          - type: figure
            figureRef: FE001
            claimRefs:
