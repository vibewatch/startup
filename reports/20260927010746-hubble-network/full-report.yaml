    title: 'Competitive Positioning Map: Direct-to-Device IoT Power Efficiency vs. Functional Sophistication'
    type: quadrant
    summary: >-
      Ordinal positioning of satellite and terrestrial IoT connectivity options across Hardware Integration Burden and
      Communication Capability.
    data:
      xAxis: Hardware Simplicity & Cost Efficiency
      yAxis: Communication Capability & Directionality
      points:
        - label: Hubble Network
          x: 9
          'y': 3
          tone: positive
          detail: Sub-$0.50 BOM, coin-cell power, firmware-only BLE integration, but strictly 1-way uplink telemetry.
        - label: Skylo (3GPP NTN)
          x: 4
          'y': 8
          tone: opportunity
          detail: Carrier-grade bidirectional messaging and MNO integration, with higher modem cost and power draw.
        - label: Kinéis
          x: 4
          'y': 5
          tone: neutral
          detail: Dedicated LEO UHF telemetry with optional downlink; requires specialized RF front-end and antenna.
        - label: Swarm (SpaceX)
          x: 3
          'y': 6
          tone: warning
          detail: Legacy bidirectional VHF messaging; bulky tile hardware and uncertain commercial roadmap.
        - label: AST SpaceMobile
          x: 2
          'y': 9
          tone: neutral
          detail: High-bandwidth cellular broadband to unmodified smartphones; ill-suited for disposable IoT tags.
        - label: Terrestrial BLE Find Networks
          x: 9
          'y': 2
          tone: risk
          detail: Commodity BLE hardware with zero satellite cost, but entirely zero coverage outside smartphone mesh.
