      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Bypassing the Specialized Satellite Hardware Tax
            body: >-
              Hubble's core technical disruption lies in substituting expensive, dedicated satellite modems ($25-$50
              BOM) and cellular SIM modules ($8-$25 BOM) with sub-dollar standard Bluetooth LE silicon ($0.50-$3.00
              BOM). By shifting link budget compensation from the transmitting device to spaceborne 100+ element phased
              array antennas, Hubble enables multi-year battery life on commodity coin cells.
            calloutType: insight
            claimRefs:
              - CE001
              - CE004
              - CE005
          - type: callout
            title: Orbital Revisit Latency and Downlink Payload Constraints
            body: >-
              While terrestrial BLE relays provide near-real-time connectivity in urban corridors, remote satellite
              coverage is currently constrained by a 6-to-7 satellite constellation delivering roughly once- or
              twice-daily revisit windows. Furthermore, the 13-byte maximum payload restricts device transmission to
              coordinates and basic sensor flags, precluding continuous bidirectional command-and-control until the
              60-satellite constellation matures.
            calloutType: risk
            claimRefs:
              - CE003
              - CE008
              - CE009
              - CE010
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation & Target Buyers
        blocks:
          - type: paragraph
            body: >
              Hubble Network segments its commercial customer base across three primary categories: enterprise fleet and
              asset operators, hardware and silicon integration partners, and original equipment manufacturers (OEMs)
              developing smart labels and tracking peripherals. For enterprise fleet and logistics buyers, the primary
              commercial driver is eliminating costly blind spots in remote and transit environments where cellular
              coverage does not reach. Because cellular networks cover approximately 15% of the Earth's landmass,
              industrial operators have historically faced severe operational trade-offs between expensive satellite
              modems and unmonitored transit routes.


              In the hardware and component segment, Hubble focuses on semiconductor makers and beacon manufacturers
              such as InPlay and Texas Instruments. These partners integrate Hubble's specialized Bluetooth Low Energy
              (BLE) firmware directly into commodity silicon, allowing downstream device makers to produce connected
              assets without custom radio hardware. In turn, printable smart-label makers such as Reelables target
              high-volume, low-margin supply chain packaging where tag unit economics must remain under one dollar.
              While enterprise asset tracking represents the largest near-term revenue opportunity, consumer-facing
              tracking and stolen vehicle recovery constitute strategic expansion verticals.
            claimRefs:
              - CU001
              - CU002
              - CU004
              - CU005
              - CU010
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
