  - id: TV003
    title: Bull, Base, and Bear Scenario Modeling
    columns:
      - Scenario
      - Core Operating Assumptions
      - Valuation / Return Framing
      - Key Risks & Downside Triggers
      - Probability
    rows:
      - - Bull Case
        - >-
          Rapid enterprise adoption reaches 10M+ connected devices by 2028; 60 satellites deployed by 2029; gross
          margins exceed 65%.
        - $3.5B-$5.0B terminal valuation (12x-15x projected ARR); 2.2x-3.1x MOIC from Series C price ($17.20/share).
        - Spectrum interference, orbital collision, or accelerated direct-to-cell competition from telecom giants.
        - 20%
      - - Base Case
        - >-
          Device count grows to 3.0M-4.5M by 2029; partial constellation of 24-36 satellites provides periodic tracking;
          ARR reaches $40M-$60M.
        - >-
          $1.2B-$1.8B terminal valuation (7x-9x ARR); 0.8x-1.1x MOIC representing capital preservation with modest
          upside.
        - Launch schedule delays extending capex burn; customer churn among price-sensitive IoT logistics clients.
        - 50%
      - - Bear Case
        - >-
          Enterprise conversion stalls below 1.5M devices; constellation cost overruns require dilutive bridge round;
          secondary illiquidity persists.
        - >-
          $300M-$500M restructuring or strategic sale (1x-2x invested capital); Series C 1.0x liquidation preference
          impairs common equity.
        - Down-round financing triggered by constellation funding exhaustion; failure of Muon Space XL host payloads.
        - 30%
