              - CU010
      - number: '6.2'
        title: Adoption Trajectory & Network Scale
        blocks:
          - type: paragraph
            body: >
              Hubble Network's reported adoption trajectory reflects rapid scaling on its hybrid terrestrial network,
              supported by an expanding base of managed access points. The company announced that active devices on its
              network reached 500,000 units in September 2026, representing a greater than 10-fold increase compared to
              the prior twelve-month period. This deployment surge coincided with the opening of Hubble's satellite
              network from closed commercial pilot access into general availability, enabling any standard
              Bluetooth-enabled device to connect directly to orbital receivers through an over-the-air firmware update.


              The foundation of this device volume is Hubble's terrestrial footprint, which comprises over 100 million
              gateways spanning 170 countries and covering approximately three million square miles. This terrestrial
              infrastructure allows devices in urban, warehouse, and transit hub environments to transmit telemetry
              without consuming orbital uplink resources. However, commercial adoption remains in an early monetization
              phase. Although Hubble reported working with more than ten commercial pilot customers in late 2025, the
              company does not disclose the conversion rate from pilot evaluations to multi-year production
              subscriptions, nor does it report customer logo counts or account retention cohorts.
            claimRefs:
              - CU001
              - CU002
              - CU006
              - CU008
              - CU012
