callouts:
  - calloutType: "risk"
    title: "Funding raised is not runway"
    body: >-
      The $200 million Series C and $300 million reported cumulative funding indicate
      financing access, not unrestricted cash. Capital already spent, reserved for
      satellites, subject to obligations, or needed for operating losses cannot be
      inferred from round announcements.
    claimRefs:
      - "CI009"
      - "CI010"
      - "CI016"
  - calloutType: "recommendation"
    title: "Underwrite the customer-to-cash bridge before valuation"
    body: >-
      Require a monthly reconciliation from active devices to billable devices, net
      subscription revenue, COGS, gross profit, and cash collections before treating
      adoption claims as recurring revenue.
    claimRefs:
      - "CI003"
      - "CI005"
      - "CI016"
