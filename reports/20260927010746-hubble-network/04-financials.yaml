company:
  name: "Hubble Network"
chapter:
  number: 4
  title: "Financials"
  summary: >-
    Public evidence supports a list-price model of roughly $4 per active device per
    month using sub-$0.50 Bluetooth hardware, alongside company-reported growth to
    more than 500,000 active devices. A September 2026 $200 million Series C improves
    financing capacity for the planned 60-satellite network, but funding raised is not
    cash available: revenue, ARR, realized pricing, gross margin, burn, debt, and
    runway remain undisclosed and block a conventional financial underwriting.
sections:
  - id: "revenue-model"
    title: "Revenue model and go-to-market evidence"
    body: >-
      Hubble's public economic proposition is a firmware-enabled connectivity service,
      not a disclosed hardware-margin business. The company says standard Bluetooth
      chips already in the field can be enabled without new hardware, while independent
      reports describe an approximately $4 monthly subscription per device. This points
      to recurring network-access revenue tied to active endpoints. Public materials also
      identify self-service development kits and enterprise pilots, but they do not
      establish whether kit sales, implementation services, satellite access, and
      terrestrial access are separately priced revenue streams. More than ten pilot
      customers and over 500,000 reported active devices are useful adoption proxies;
      they are not customer count, contracted ARR, recognized revenue, retention, or
      proof that list pricing is realized at enterprise scale.
    claimRefs:
      - "CI001"
      - "CI003"
      - "CI005"
      - "CI006"
      - "CI016"
    tableRefs:
      - "TI001"
    figureRefs:
      - "FI001"
  - id: "pricing-and-unit-economics"
    title: "Pricing, hardware economics, and missing margins"
    body: >-
      The visible pricing advantage sits at the device edge. GeekWire and Briefs Finance
      report roughly $0.50 of Bluetooth hardware and a $4 monthly subscription, while
      Citybiz describes dedicated satellite hardware at $10 to $50 per chip. Those
      figures support a lower upfront connectivity bill of materials, but they do not
      reveal Hubble's realized average revenue per device or its gross profit. No assigned
      source discloses enterprise volume discounts, free-pilot treatment, partner revenue
      shares, launch and ground-station expense, cloud telemetry cost, satellite
      depreciation, or support burden. Consequently, a contribution-margin waterfall
      would require invented deductions. The investable diligence object is instead the
      bridge from a reported list price to unknown net revenue and unknown gross profit.
    claimRefs:
      - "CI002"
      - "CI003"
      - "CI004"
      - "CI016"
    tableRefs:
      - "TI002"
  - id: "cost-base-and-scale"
    title: "Operating scale, constellation commitments, and cost drivers"
    body: >-
      Hubble reported six satellites operating in September 2026 and a plan to reach
      60 by 2030. That tenfold fleet expansion implies material manufacturing, launch,
      insurance, ground-network, and operating obligations, but the assigned evidence
      does not disclose signed commitments or a cost schedule. Multiples separately
      estimates about $100 million to build, launch, and operate a full constellation;
      because that estimate combines several cost categories and describes a different
      timetable, it should be treated as directional rather than as a per-satellite
      capital cost. Headcount reports of about 70 to 73 provide only a weak operating
      expense proxy. They cannot support a burn estimate without payroll, contractor,
      launch, satellite-hosting, and infrastructure data.
    claimRefs:
      - "CI007"
      - "CI008"
      - "CI015"
      - "CI016"
    tableRefs:
      - "TI003"
  - id: "capital-adequacy"
    title: "Capital adequacy and underwriting verdict"
    body: >-
      Hubble announced a $200 million Series C in September 2026 at a $1.6 billion
      valuation, and several current reports put cumulative funding at $300 million.
      Seraphim's separately reported $30 million August investment should not be added
      again without confirming whether it is included in the Series C or cumulative
      total. Public databases also disagree: Multiples reports $321 million across five
      rounds, while Tracxn's page still reports only $20 million over one round. These
      conflicts make a management-provided capitalization table essential. More
      importantly, cumulative funding does not establish cash on hand, unrestricted
      liquidity, accounting losses, cash burn, runway, debt obligations, or ability to
      fund the 2030 plan. The financial verdict is therefore evidence-constrained:
      recent financing is substantial, but revenue quality, margin path, capital
      intensity, and next-round timing remain ununderwritten.
    claimRefs:
      - "CI009"
      - "CI010"
      - "CI011"
      - "CI012"
      - "CI013"
      - "CI014"
      - "CI016"
