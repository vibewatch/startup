callouts:
  - calloutType: insight
    title: The Bifurcation of Direct-to-Device Satellite IoT
    body: |
      The satellite IoT market is bifurcating into two distinct architectural lanes. Lane one focuses on ultra-low-power, one-way uplink telemetry for mass asset tracking, where eliminating specialized modems slashes unit costs below 50 cents. Lane two focuses on bidirectional, carrier-converged communication (3GPP NTN) for mission-critical command and control. Selecting a bidirectional modem architecture for pure telemetry tracking imposes unnecessary power and BOM penalties.
    claimRefs:
      - CP001
      - CP002
      - CP004
      - CP006
  - calloutType: risk
    title: Downlink Inability and Constellation Latency Constraints
    body: |
      Hubble's core differentiation—reusing standard BLE radios to transmit to space—inherently lacks downlink receive capability. Devices cannot receive over-the-air firmware updates, dynamic reconfiguration commands, or network acknowledgments via satellite. Furthermore, with only six operational satellites in orbit, revisit latencies of 15 minutes to several hours restrict adoption to delay-tolerant use cases until constellation expansion is realized.
    claimRefs:
      - CP004
      - CP008
      - CP014
      - CP016
