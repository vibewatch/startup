    severity: material
    topic: named-customer-deployments
    missingEvidence: >-
      Comprehensive customer registry of commercial accounts, production contract values, and volume tiers across
      logistics, defense, and industrial sectors.
    whyItMatters: >-
      Public disclosure is limited to a handful of strategic partners (Samsara, InPlay, Reelables), leaving total
