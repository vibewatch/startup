evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: commercial-telemetry-revenue
    missingEvidence: >-
      Audited revenue figures, annual recurring revenue (ARR), and net subscriber churn metrics across enterprise pilot
      and commercial tracking contracts.
    whyItMatters: >-
      A $1.6 billion private market valuation cannot be fundamentally evaluated without concrete ARR multiples or gross
      margin performance.
    diligencePath: >-
      Request non-disclosure access to audited financial schedules, ARR bridge reports, and cohort retention metrics
      during Series D diligence.
    relatedQuestionRefs:
      - QO006
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholder-or-investor-map
    missingEvidence: >-
      Complete capitalization table listing exact preferred share class ownership percentages, liquidation preference
      multipliers, and founder voting control.
    whyItMatters: >-
      Investor governance rights, protective covenants, and liquidation distribution priority cannot be ascertained from
      financing press announcements.
    diligencePath: >-
      Inspect the certified Certificate of Incorporation and comprehensive capitalization ledger in the corporate data
      room.
    relatedTableRefs:
      - TO003
    relatedQuestionRefs:
      - QO004
  - type: private-evidence-only
    severity: material
    topic: constellation-latency-telemetry
    missingEvidence: >-
      Empirical latency and pass-frequency benchmarks for the active 6-satellite constellation in transmitting periodic
      telemetry packets outside terrestrial receiver range.
    whyItMatters: >-
      Asset tracking applications in logistics and cold chain require predictable ping intervals; without 60 satellites,
      revisit intervals may introduce hours of telemetry latency.
    diligencePath: >-
      Request customer pilot telemetry logs from Samsara and Minew field trials detailing revisit intervals, packet loss
      rates, and mean time to first orbit fix.
    relatedQuestionRefs:
      - QM005
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: commercial-pricing-schedule
    missingEvidence: Formal public pricing tiers and data overage schedules for Hubble Network's direct satellite transmission service.
    whyItMatters: >-
      While hardware BOM addition is under $0.50, recurring satellite connectivity pricing governs enterprise total cost
      of ownership relative to cellular lifetime models like 1NCE.
    diligencePath: >-
      Review enterprise master service agreements and developer portal subscription schedules for per-device annual
      connectivity fees and satellite uplink caps.
    relatedQuestionRefs:
      - QM003
    relatedTableRefs:
      - TM001
  - type: private-evidence-only
    severity: material
    topic: pricing-comparison
    missingEvidence: >-
      Contracted enterprise tier pricing schedules and volume discount tiers for Hubble Network satellite airtime versus
      Skylo and Kinéis.
    whyItMatters: Determines realized unit economics for multi-million device deployments in asset tracking.
    diligencePath: Request standard enterprise customer Master Service Agreements and rate cards from Hubble sales engineering.
  - type: missing-source
    severity: material
    topic: competitive-benchmarks
    missingEvidence: >-
      Independent laboratory or field RF link budget benchmarks comparing packet reception rates of Hubble BLE LEO
      uplink versus 3GPP NTN under dense canopy or heavy cloud cover.
    whyItMatters: Validates real-world packet delivery reliability where attenuation may degrade +20 dBm BLE transmissions.
    diligencePath: Obtain third-party test data or enterprise pilot evaluations from field trials.
  - type: private-evidence-only
    severity: blocking
    topic: revenue-quality
    missingEvidence: >-
      Audited revenue, ARR, revenue-recognition policy, contracted backlog, billed devices, net ARPU, retention, and
      customer concentration by cohort.
    whyItMatters: >-
      Adoption and list pricing cannot establish recurring revenue quality or convert the private valuation into a
      defensible revenue multiple.
    diligencePath: >-
      Reconcile monthly active devices to billable devices, invoices, cash receipts, deferred revenue, and recognized
      revenue for the prior twenty-four months.
    relatedQuestionRefs:
      - QI001
      - QI003
      - QI007
      - QI008
    relatedTableRefs:
      - TI001
      - TI003
  - type: private-evidence-only
    severity: blocking
    topic: gross-margin-and-unit-economics
    missingEvidence: >-
      Realized contract pricing and COGS split across satellite capacity, launch and hosting, terrestrial partners,
      ground stations, cloud telemetry, and support.
    whyItMatters: >-
      The reported four-dollar list price does not demonstrate positive contribution margin or a scalable gross-margin
      path.
    diligencePath: >-
      Obtain customer contracts, supplier and partner agreements, satellite schedules, and a device-cohort gross-margin
      bridge from list price to gross profit.
    relatedQuestionRefs:
      - QI002
      - QI004
      - QI007
      - QI008
    relatedTableRefs:
      - TI002
      - TI003
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: >-
      Unrestricted cash, monthly cash burn, accounting losses, debt and covenants, signed constellation commitments,
      runway, and next-financing trigger.
    whyItMatters: >-
      Funding raised cannot establish available liquidity or whether the planned sixty-satellite network is fully
      financed through 2030.
    diligencePath: >-
      Review bank statements, audited cash flow statements, debt schedules, board budgets, and executed manufacturing
      and launch contracts.
    relatedQuestionRefs:
      - QI004
      - QI005
      - QI007
      - QI008
    relatedTableRefs:
      - TI003
  - type: conflicting-data
    severity: material
    topic: funding-data
    missingEvidence: >-
      A management-approved capitalization table reconciling the reported $300 million, $321 million, and stale $20
      million cumulative funding totals.
    whyItMatters: >-
      Double-counting the August Seraphim investment or omitting rounds would distort financing history, dilution
      analysis, and capital-availability assumptions.
    diligencePath: >-
      Reconcile every close date, security, amount, investor, and cash receipt to bank records and board-approved
      financing documents.
    relatedQuestionRefs:
      - QI005
      - QI006
  - type: missing-source
    severity: material
    topic: canopy-attenuation-benchmarks
    missingEvidence: >-
      Independent third-party empirical packet loss benchmarks measuring Bluetooth-to-satellite uplink attenuation
      across wet tree canopy, precipitation, and complex industrial metal structures.
    whyItMatters: >-
      Crucial for underwriting enterprise reliability in heavy forestry, mining, and metal container tracking where 2.4
      GHz signal attenuation is severe.
    diligencePath: Request raw pilot telemetry logs and packet reception rate histograms from Samsara industrial customer trials.
    relatedQuestionRefs:
      - QE009
  - type: private-evidence-only
    severity: material
    topic: terrestrial-gateway-density
    missingEvidence: >-
      Granular geographic access point density maps and partner SLA commitments for the 100M+ terrestrial gateway
      network outside metropolitan centers.
    whyItMatters: >-
      Terrestrial coverage fallbacks dictate device battery life and reporting latency when orbital passes are 12 hours
      apart.
    diligencePath: Review partner agreement terms with Life360 and inspect regional gateway density matrices in data room.
