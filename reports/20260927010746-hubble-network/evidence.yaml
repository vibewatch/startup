    keyQuote: >-
      Competitors and alternatives in the broader satellite IoT and non terrestrial network (NTN) space include
      3GPP-based NB-IoT/LTE-M NTN providers (e.g., Skylo and others), LoRa based systems (e.g., Kinéis), legacy
      satellite IoT operators (Iridium, Globalstar), and other specialized players. Hubble differentiates on zero or
      near zero incremental hardware cost (firmware only on existing BLE silicon), multi year battery life, simplified
      certification/integration, and hybrid terrestrial scale. It is generally not positioned for high bandwidth,
      bidirectional, low latency, or large payload needs where cellular or other NTN options may fit better.
