    severity: minor
    topic: next-gen-satellite-launch-manifest
    missingEvidence: >-
      Firm launch manifests, FAA/FCC licensing approvals, and integration milestones for Muon Space MuSat XL
      constellation deployment.
    whyItMatters: >-
      Timing of constellation buildout determines the timeline for reducing revisit intervals from 12 hours down to
      near-real-time.
    diligencePath: >-
      Obtain FCC satellite earth-station licensing filings and launch broker reservation receipts for 2027 orbital
      slots.
  - type: private-evidence-only
    severity: material
    topic: customer-retention-and-churn
    missingEvidence: >-
      Audited customer cohort retention data, Net Revenue Retention (NRR), Gross Revenue Retention (GRR), and logo churn
