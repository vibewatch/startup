callouts:
  - calloutType: "risk"
    title: "Constellation Pass Latency Threatens Real-Time SLA Guarantees"
    body: "Operating only six active low-Earth orbit satellites creates multi-hour revisit gaps for remote IoT devices outside ground gateway footprints. Without rapid deployment of the planned 60-satellite constellation by 2030, enterprise tracking remains asynchronous batch reporting rather than continuous live telemetry."
    claimRefs:
      - "CR004"
      - "CR005"
  - calloutType: "insight"
    title: "Single-Source Bus Reliance Amplifies Execution Risk"
    body: "Hubble Network's scaling roadmap depends heavily on its inaugural contract with Muon Space for MuSat XL satellite buses. Any production delays, launch manifest slips, or orbital bus anomalies will directly bottleneck constellation growth regardless of available capital."
    claimRefs:
      - "CR001"
      - "CR008"
