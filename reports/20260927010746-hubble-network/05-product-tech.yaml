chapter:
  number: 5
  title: "Product & Technology"
  summary: "Hubble Network delivers global direct-to-satellite Internet-of-Things connectivity using standard, off-the-shelf Bluetooth Low Energy (BLE) microcontrollers without dedicated satellite modems. By pairing firmware-level signal processing on commercial silicon with high-gain spaceborne phased arrays across seven operational LEO satellites and 100 million terrestrial gateways, Hubble achieves global tracking at a sub-$1 hardware cost. While satellite revisit latency and 13-byte packet payloads currently limit high-frequency telemetry, ongoing constellation scaling to 60 satellites targets near-continuous planetary coverage by 2030."

sections:
  - id: "product-definition-and-customer-workflow"
    title: "Product Definition and Customer Workflow"
    body: "Hubble Network redefines low-power wide-area IoT connectivity by enabling standard Bluetooth Low Energy silicon to communicate directly with low Earth orbit satellites. Traditional asset tracking beyond cellular reach requires specialized satellite transceivers that cost $25 to $50 per module and consume significant power. Hubble's solution replaces this hardware tax with a software-only firmware update that operates on commodity BLE chips costing $0.50 to $3.00. In enterprise workflows, the end device broadcasts a standard BLE advertisement containing device coordinates and up to 13 bytes of arbitrary sensor payload. Data is ingested seamlessly across Hubble's hybrid network—either captured locally by over 100 million terrestrial gateways or received in orbit by Hubble satellites—and delivered to customer ERP, WMS, and TMS platforms via REST APIs and webhooks."
    claimRefs:
      - "CE001"
      - "CE003"
      - "CE005"
      - "CE011"
      - "CE014"
    tableRefs:
      - "TE001"

  - id: "operating-architecture-and-silicon-integration"
    title: "Operating Architecture and Silicon Integration"
    body: "Hubble's technical architecture bridges an extreme link budget through coordinated innovations across silicon firmware and spaceborne receivers. Transmitting a 2.4 GHz signal from Earth across 550 to 650 kilometers to a satellite moving at orbital velocity requires overcoming heavy path loss, atmospheric attenuation, and severe Doppler shifts. Hubble resolves this by reducing data transmission bitrates, embedding forward error correction, and dynamically compensating for Doppler shifts. The device-side software development kit is built on the open-source Zephyr RTOS, enabling integration into Silicon Labs MG24 and Texas Instruments CC2340 and CC2755x wireless microcontrollers with minimal engineering overhead. On the receiving end, Hubble's satellites deploy high-performance phased array antennas featuring more than 100 coordinated elements that amplify faint terrestrial signals transmitted at 13 to 20 dBm."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE004"
      - "CE007"
      - "CE008"
    figureRefs:
      - "FE001"

  - id: "constellation-roadmap-and-orbital-mechanics"
    title: "Constellation Roadmap and Orbital Dependencies"
    body: "Hubble currently operates a foundational constellation of six to seven satellites in low Earth orbit, providing baseline global satellite connectivity with approximately once-to-twice daily revisit passes. To transition from periodic asset check-ins to near-continuous global tracking, Hubble has partnered with Muon Space to host next-generation BLE payloads aboard MuSat XL 500 kg-class spacecraft. The initial MuSat XL satellites deliver a 12-hour revisit window using advanced multi-kilowatt power architectures and upgraded receivers capable of detecting signals at significantly lower power thresholds. Supported by a $200 million Series C financing, Hubble plans to scale the orbital network to 60 operational satellites by 2030, reducing revisit latency down to minutes and enabling high-frequency telemetry across logistics, agricultural, and industrial monitoring applications."
    claimRefs:
      - "CE008"
      - "CE009"
      - "CE010"
    tableRefs:
      - "TE002"

  - id: "data-infrastructure-security-and-compliance"
    title: "Data Infrastructure, Security, and Quality Controls"
    body: "Enterprise adoption of distributed IoT tracking requires robust cloud data ingestion, rigorous security controls, and strict regulatory compliance. Hubble processes telemetry from over 500,000 active devices through a modern cloud lakehouse architecture that routes raw packet streams through Apache Iceberg, Amazon Redshift, and automated reconciliation pipelines. Because Hubble's network captures transmissions across 170 countries, the platform enforces strict data governance: telemetry pipelines implement automated PII masking and sensitivity tagging to maintain customer confidentiality. Additionally, because Hubble designs and operates spaceborne radio frequency receivers and satellite communication payloads, the company is subject to U.S. International Traffic in Arms Regulations (ITAR), requiring strict export controls and personnel vetting across its space engineering operations."
    claimRefs:
      - "CE006"
      - "CE012"
      - "CE013"
    tableRefs:
      - "TE003"

