callouts:
  - calloutType: "insight"
    title: "Bypassing the Specialized Satellite Hardware Tax"
    body: "Hubble's core technical disruption lies in substituting expensive, dedicated satellite modems ($25-$50 BOM) and cellular SIM modules ($8-$25 BOM) with sub-dollar standard Bluetooth LE silicon ($0.50-$3.00 BOM). By shifting link budget compensation from the transmitting device to spaceborne 100+ element phased array antennas, Hubble enables multi-year battery life on commodity coin cells."
    claimRefs:
      - "CE001"
      - "CE004"
      - "CE005"

  - calloutType: "risk"
    title: "Orbital Revisit Latency and Downlink Payload Constraints"
    body: "While terrestrial BLE relays provide near-real-time connectivity in urban corridors, remote satellite coverage is currently constrained by a 6-to-7 satellite constellation delivering roughly once- or twice-daily revisit windows. Furthermore, the 13-byte maximum payload restricts device transmission to coordinates and basic sensor flags, precluding continuous bidirectional command-and-control until the 60-satellite constellation matures."
    claimRefs:
      - "CE003"
      - "CE008"
      - "CE009"
      - "CE010"

