      - FO003
  - id: milestones
    title: Milestones and trajectory
    body: "ApplyBoard's eleven-year arc moves from rapid Canada-led ascent to a more defensive, diversification-driven phase. After founding in 2015 the company scaled quickly, hit unicorn status in 2020, peaked at a $4 billion CAD valuation in 2021, and stacked Deloitte Fast 50 placements. From 2022 the trajectory grew more complicated: a quiet CEO change, a 6% customer-experience layoff in November 2022, the September 2024 RBCx facility paired with a 4% workforce cut, and a further 150-plus layoffs in June 2025 attributed to policy changes across major study destinations. Product milestones — the March 2022 TrainHub acquisition, the June 2024 launch of the Abbie AI advisor, and the January 2025 launch of Germany as a first non-Anglophone market — show an active response to the headwinds created by Canada's 2024 student cap, which drove roughly a 45% decline in study permit approvals. The milestone record captures both genuine category leadership and accumulating execution stress."
    claimRefs:
