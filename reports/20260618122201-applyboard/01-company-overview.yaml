company:
  name: ApplyBoard
chapter:
  number: 1
  title: Company Overview
  summary: ApplyBoard is a 2015-founded, founder-led international student recruitment platform that peaked at a $4B CAD valuation in 2021 and now faces a reported ~74% valuation decline, three layoff rounds and a Canadian policy shock, even as it diversifies markets and ships AI products.
sections:
  - id: identity-model
    title: Identity and business model
    body: ApplyBoard Inc. is a Kitchener-Waterloo, Ontario company founded in 2015 that operates an AI-powered platform connecting international students, post-secondary institutions and recruitment partners. The company was started by three Iranian-Canadian brothers, Martin, Meti and Massi Basiri, who had themselves navigated the friction of applying to study abroad and built ApplyBoard to remove those barriers. Its mission, stated consistently since launch, is to make education accessible worldwide. The platform now spans six study destinations, more than 1,500 partner institutions and over 150,000 programs, and it monetises primarily through per-student placement economics paid by institutions alongside test-provider and financial-services partnerships. ApplyBoard remains a privately held, growth-stage unicorn headquartered at 101 Frederick Street in Kitchener, and it has signalled longer-term IPO ambitions without committing to a timeline. This chapter establishes the company identity, leadership, capital structure, cover metrics and milestone trajectory that anchor the rest of the diligence.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO019
      - CO020
      - CO033
      - CO034
    figureRefs:
      - FO002
  - id: leadership-governance
    title: Founders, leadership and governance
    body: Leadership concentration in a single founding family is the defining governance feature of ApplyBoard. Meti Basiri, previously chief marketing officer, became chief executive officer in August 2022 when founding CEO Martin Basiri stepped down; brother Massi Basiri serves as President leading product and innovation. David Borecky is chief financial officer and has been the public voice on valuation questions. The August 2022 CEO transition was handled quietly and only publicly disclosed in January 2023, a transparency gap worth noting for governance diligence. Martin Basiri remained a board member after stepping down, took parental leave, and then departed to found Passage, a separate venture that raised a $40 million CAD seed round to tackle Canada's skilled-worker shortage. The continued presence of three brothers across executive and board roles creates meaningful key-person and related-party considerations that a buyer should test against the shareholders agreement and board composition.
    claimRefs:
      - CO004
      - CO005
      - CO006
      - CO007
      - CO008
      - CO009
    tableRefs:
      - TO002
  - id: capital-structure
    title: Funding, valuation and capital
    body: ApplyBoard reached unicorn status in May 2020 and peaked with a June 2021 Series D of $375 million CAD at a $4 billion CAD valuation led by Ontario Teachers' Pension Plan Board through its Teachers' Innovation Platform, with Fidelity, BDC Capital, Index Ventures, Harmonic, Garage Capital and Blue Cloud Ventures participating. Through that close the company had raised roughly $600 million CAD in equity from 31 or more investors. In September 2024 it added a $100 million CAD credit facility from RBCx — debt, not equity — earmarked for global expansion and AI, targeting 20 new markets by 2030. The capital story turned adverse in early 2025 when Fidelity fund markings implied a valuation decline of as much as 74% from the 2021 peak. CFO David Borecky countered that "valuations are a moment in time" and that the company is well-capitalised with several years of cash on hand and no need to fundraise.
