  - id: cover-metrics
    title: Cover metrics and scale
    body: "ApplyBoard's headline cover metrics emphasise reach. As of 2026 the homepage reports more than 1.5 million students helped, up from a 1.3 million milestone in mid-2025 and 1 million in June 2024, alongside a 95% application success rate, 150,000-plus programs, students from over 180 nationalities, more than 1,500 partner institutions and six destination countries. These are company-reported figures and should be treated as directional rather than audited; independent databases give only partial corroboration and the company has not disclosed current headcount or a post-correction valuation. ApplyBoard reinforces credibility through external recognition, ranking #4 on the 2024 Deloitte Technology Fast 50 Enterprise list for a sixth consecutive year, with Deloitte citing nearly 800% revenue growth over three years. The cover metrics frame a company with substantial scale and brand strength whose growth narrative is now intersecting with a sharply tightening Canadian regulatory backdrop."
    claimRefs:
      - CO017
      - CO018
      - CO019
      - CO020
      - CO021
      - CO022
      - CO023
      - CO036
    tableRefs:
      - TO001
