  topStrengths:
    - Category leadership and real scale — 1,500+ institution partners across six destinations and more than 1.5 million students helped from 180-plus nationalities.
    - A differentiated, verifiable outcome edge — ApplyBoard students achieved an 82% study-permit approval rate versus a roughly 50% national average in 2024.
    - An AI moat anchored less in the commoditizing Abbie chatbot than in document-extraction quality, evidenced by published ICPRS 2025 confidence-score research and six consecutive Deloitte Fast 50 listings.
    - Resilient capitalization signals, including a September 2024 C$100M RBCx debt facility extended even as equity marks fell, and management claims of several years of cash on hand.
  topRisks:
    - Acute, exogenous regulatory exposure — Canada's study-permit cap cut new permits about 48% in 2024 and was extended into 2026, with Bill C-2 threatening to pause or cancel applications.
    - Revenue concentration in Canada-bound enrolments means per-enrolment fees fall almost directly with permit declines, and the corridor revenue mix is undisclosed.
    - Thin disclosure — no audited revenue, margins, or runway, and divergent third-party revenue estimates (about US$210M ARR versus roughly US$295M revenue) that swing the implied multiple.
    - Execution and morale pressure evidenced by three layoff rounds (2022, 2024, 2025) and a ~74% implied valuation decline from the 2021 peak.
  unresolvedGaps:
    - Audited revenue, gross margin, burn, and runway behind the company's "years of cash on hand" claim.
    - Revenue split by destination corridor and source country to size Canada policy exposure precisely.
    - Reconciliation of conflicting third-party revenue estimates and confirmation of the true 2025 revenue base.
    - Recent secondary-transaction prices and the current cap table to validate the implied US$0.8-1.0B mark.
