  productSummary: >-
    ApplyBoard sells an AI-powered study-abroad platform spanning program discovery and matching, application submission, and document verification, surrounded by a suite that includes the Abbie AI advisor, TrainHub recruiter training, ApplyProof GIC verification, ApplyInsights market intelligence, and RBC/TD-backed GIC financial products.
  customerFocus: >-
    Two-sided: paying post-secondary institutions seeking vetted international enrolments, free-to-use international students (historically concentrated in India, Nigeria, and the Philippines), and a recruitment-agent network as a third channel.
  businessModel: >-
    Per-enrolled-student placement fees paid by institutions, augmented by test-provider and financial-product partnerships and SaaS/data tools; revenue scales with study-permit approvals, so it is directly exposed to immigration policy.
  stage: Series D / Unicorn (private)
  fundingStatus: >-
