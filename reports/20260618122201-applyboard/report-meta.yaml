companyProfile:
  summary: >-
    ApplyBoard Inc. is a private EdTech company founded in 2015 in Kitchener, Ontario by three Iranian-Canadian brothers — Martin, Meti, and Massi Basiri — to remove barriers in the international study-abroad application process. Its AI-powered platform connects students, recruitment partners, and more than 1,500 post-secondary institutions across six destinations (Canada, the US, UK, Australia, Ireland, and Germany), and the company reports having helped over 1.5 million students from 180-plus nationalities. ApplyBoard reached unicorn status in 2020 and peaked at a C$4 billion (about US$3.2 billion) valuation at its June 2021 Series D, but Fidelity fund markings since imply a decline of as much as 74% from that peak. The central diligence limitation is disclosure: as a private company ApplyBoard does not publish audited revenue, margins, revenue-by-corridor mix, or runway, and it faces acute exposure to Canada's international-student policy tightening.
