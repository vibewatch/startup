  topStrengths:
    - 品类领导地位和真实规模——覆盖六个留学目的地、1,500+ 院校伙伴，已帮助来自 180 多个国籍的 1.5M+ 学生。
    - 结果优势可验证——2024 年 ApplyBoard 学生学习许可获批率 82%，显著高于约 50% 的全国平均水平。
    - AI 护城河不主要在商品化加速的 Abbie 聊天机器人，而在文档抽取质量；ICPRS 2025 置信度评分研究和连续六次 Deloitte Fast 50 上榜提供佐证。
    - 资本韧性仍有信号：即便股权估值下调，RBCx 仍在 2024 年 9 月延长 C$100M 债务额度；管理层称账上现金可支撑数年。
  topRisks:
    - 外生监管敞口尖锐——加拿大 2024 年新学习许可上限让新许可减少约 48%，政策延长至 2026 年，Bill C-2 还可能暂停或取消申请。
    - 收入集中在赴加拿大入学，按入学收费几乎会随许可下降同步下滑；各走廊收入组合未披露。
    - 披露薄弱——没有经审计收入、利润率或现金跑道，第三方收入估计分歧很大（约 US$210M ARR 对约 US$295M 收入），隐含倍数会被大幅拉动。
    - 三轮裁员（2022、2024、2025）和较 2021 年峰值隐含下跌约 74% 的估值，反映执行和士气压力。
  unresolvedGaps:
    - 经审计收入、毛利率、烧钱速度和现金跑道，才能验证公司“账上现金可支撑数年”的说法。
    - 按留学目的地走廊和生源国拆分的收入，用于精确测算加拿大政策敞口。
    - 相互冲突的第三方收入估计需要调和，并确认真实的 2025 年收入基数。
    - 近期二级交易价格和当前 cap table，用于验证隐含 US$0.8-1.0B 估值。
