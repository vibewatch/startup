summary:
  headline: ApplyBoard 是国际学生招生平台里的品类龙头，也真正把 AI 跑进了流程，但估值较 2021 年峰值隐含下跌约 74%，私有财务不透明，加拿大政策敞口尖锐，目前只适合跟踪。
