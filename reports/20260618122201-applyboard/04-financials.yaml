company:
  name: ApplyBoard
chapter:
  number: 4
  title: Financials
  summary: ApplyBoard discloses no audited financials; third-party trackers estimate 2025 revenue at $210M-$295M against ~$600M CAD equity raised, a $100M CAD RBCx debt facility, and a reported ~74% valuation decline. Funding is well-documented, but revenue quality, margin, burn and runway remain diligence blockers.
sections:
  - id: disclosure-revenue
    title: Disclosure posture and revenue
    body: ApplyBoard is a private company that does not publish audited financial statements, so its revenue picture must be assembled from program submissions, third-party trackers and management commentary. The strongest public signal is Deloitte's recognition of nearly 800% revenue growth over the three years to 2024, but that is a Fast 50 program figure rather than an audited disclosure. Industry trackers estimate 2025 ARR near $210 million and revenue near $295 million, a roughly $85 million spread that itself signals how unreliable external estimates are. The underlying revenue model is per-enrolled-student placement fees paid by institutions, supplemented by test-provider partnerships, SaaS tools for institutions, and financial-services GIC fee income from RBC and TD. The Canadian permit decline flows directly into the largest of these lanes, placement volume, making the unaudited growth narrative harder to extrapolate forward. Revenue quality is therefore an open question that only company-provided audited data can resolve.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI005
      - CI006
      - CI029
      - CI030
      - CI031
    tableRefs:
      - TI001
      - TI002
    figureRefs:
      - FI001
  - id: unit-economics
    title: Unit economics and margin
    body: "Without audited cost data, ApplyBoard's unit economics can only be framed structurally. The core unit is the placement: a fee per enrolled student set against the cost of student acquisition, application processing and partner commissions shared with recruitment agents. The software-and-services mix plausibly supports a software-like gross margin, but this is an inference rather than a disclosed figure. Three layoff rounds since 2022 — customer experience in November 2022, about 4% in September 2024, and more than 150 staff in June 2025 — indicate active cost management to defend runway as Canadian revenue pressure built. Pricing power on placement fees is constrained by competitor multi-homing and institution budget cycles, capping the ability to offset volume declines with rate increases. The gross-to-net realisation rate on placement fees, after agent commissions and refunds, is unknown and is one of the more important missing inputs for any margin model. A buyer should size this rate directly with the company, since even a software-like headline margin can be undercut by high partner-commission revenue share."
    claimRefs:
      - CI021
      - CI022
      - CI023
      - CI031
      - CI035
    tableRefs:
      - TI003
    figureRefs:
      - FI002
  - id: capital-position
    title: Funding, valuation and capital adequacy
    body: ApplyBoard's financing history is its most verifiable financial dimension. It raised a $375 million CAD (about $300 million USD) Series D in June 2021 at a $4 billion CAD / $3.2 billion USD peak valuation, bringing total equity to roughly $600 million CAD, with PIE News citing about $554 million USD from 31 or more investors by early 2025. In September 2024 it added a $100 million CAD RBCx credit facility as debt rather than equity, a choice consistent with avoiding a dilutive down-round given that Fidelity fund markings imply a valuation decline of as much as 74% from peak, to a roughly $840 million to $1.04 billion USD range. Management maintains the company is well-capitalised with several years of cash and a huge run rate, but actual cash, burn and the drawn portion of the RBCx facility are undisclosed, so capital adequacy for the 20-market expansion plan cannot be independently confirmed.
    claimRefs:
      - CI007
      - CI008
      - CI009
      - CI010
      - CI011
      - CI012
      - CI013
      - CI014
      - CI015
      - CI016
      - CI017
      - CI024
      - CI025
      - CI033
      - CI034
    tableRefs:
      - TI004
    figureRefs:
      - FI003
      - FI004
  - id: benchmark-verdict
    title: Benchmarks, gaps and financial verdict
    body: "The only fully audited comparable in the analysis is listed peer IDP Education, which reported FY2025 revenue of about AUD 882 million and whose public valuation multiples compressed sharply alongside a revenue decline — a useful but imperfect lens for pricing ApplyBoard's private equity. The financial verdict is that ApplyBoard's funding rounds are well-documented while its operating financials remain a diligence blocker: there is no audited revenue, ARR, gross margin, burn or runway figure in the public record, and third-party revenue estimates conflict by roughly $85 million. The debt-first 2024 financing and disciplined layoffs suggest management is protecting capital efficiency, and the eventual IPO ambition implies future disclosure, but underwriting today requires company-provided audited statements and an operating model. Until those are obtained, every revenue-based valuation must be treated as provisional and bounded by the wide estimate ranges documented here."
    claimRefs:
      - CI018
      - CI019
      - CI020
      - CI026
      - CI027
      - CI028
      - CI032
      - CI036
    tableRefs:
      - TI005
