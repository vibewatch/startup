  name: ApplyBoard
chapter:
  number: 2
  title: Market Analysis
  summary: The international student recruitment market is large ($15.8B-$42.8B TAM) and structurally growing at 8.6%-10.2%, but its near-term trajectory is dominated by Canada's 2024 study permit cap, which cut new permits ~48% and exposed the sector's single-country regulatory concentration.
sections:
  - id: market-definition
    title: Market definition and boundaries
    body: "ApplyBoard sells into the international student recruitment market: the spend institutions devote to attracting, qualifying and enrolling cross-border students, monetised mainly through per-student placement fees and adjacent services. The included spend covers placement commissions, platform subscriptions for institutions, and recruitment-partner tooling; it excludes domestic admissions, tuition itself, and the broader EdTech learning-software category valued at roughly $251 billion in 2024. Status-quo substitutes are direct institutional admissions offices and traditional offline agents, while adjacencies span language testing, student finance and study-abroad advisory. The market sits within a global pool of more than 6.4 million students studying abroad in 2025. Defining the boundary tightly matters because headline market estimates mix recruitment-agency revenue with adjacent EdTech spend, producing the wide $15.8 billion to $42.8 billion range seen across third-party reports. For this diligence, the relevant serviceable market is the six destination countries where ApplyBoard runs partner networks."
    claimRefs:
      - CM004
      - CM016
      - CM025
      - CM026
      - CM027
      - CM028
    tableRefs:
      - TM001
  - id: market-sizing
    title: Market sizing and growth
    body: "Sizing this market requires multiple lenses because no single report cleanly matches ApplyBoard's niche. Recruitment-market estimates cluster between $15.8 billion and $42.8 billion for 2024-2025 with projected CAGRs of 8.6% to 10.2% into the early 2030s, while the broader EdTech category provides an outer bound near $251 billion. The underlying demand driver is a global mobile-student pool exceeding 6.4 million, of which Asia Pacific contributes about 41.2% of market revenue. ApplyBoard reinforces the bull case with its claim that student mobility has doubled every decade and points to nearly 800% three-year revenue growth recognised by Deloitte through 2024. The principal caveat is methodological: definitions blend agency revenue, placement fees and software spend, so a defensible SAM and SOM for ApplyBoard should be rebuilt bottom-up from placement economics rather than borrowed from any one top-down figure."
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM005
      - CM006
      - CM033
    tableRefs:
      - TM002
    figureRefs:
      - FM001
      - FM002
  - id: segments-buyers
    title: Segments, buyers and adoption
    body: "The market segments along three axes: destination geography, institution type (universities, colleges, language and pathway providers), and student segment (undergraduate, graduate, language, pathway). Institutions are the primary paying customers, compensating platforms per enrolled student, while recruitment partners and agents form the distribution channel that originates much of the demand. Students are the end users whose trust, visa-approval odds and switching costs determine whether they adopt a platform over a direct application. This multi-sided structure means budget ownership sits with institutions even though acquisition depends on partner and student behaviour. Adoption of digital platforms over offline agents is driven by transparency, breadth of program choice and demonstrably higher visa-approval rates, which is precisely where ApplyBoard positions its value proposition. Understanding which side pays and which side decides is essential for assessing pricing power and durability later in the diligence."
    claimRefs:
      - CM016
      - CM017
      - CM018
      - CM022
      - CM029
      - CM032
    tableRefs:
      - TM003
    figureRefs:
      - FM003
      - FM004
  - id: drivers-constraints
    title: Growth drivers and constraints
    body: "The market's long-run drivers are structural: rising higher-education demand, demographic pressure in South Asia and Sub-Saharan Africa, and the digitisation of a historically fragmented agent channel. Against these tailwinds sits an acute near-term constraint — Canadian regulation. The January 2024 study permit cap targeted roughly a 35% reduction, required provincial attestation letters, tightened post-graduation work permit eligibility, and was extended into 2026 at about 10% below 2024 levels. The result was 267,890 new permits in 2024, down about 48% year over year and roughly 100,000 below IRCC's target, with ApplyBoard's own analysis showing approvals down about 45% and capped college programs down about 60%. Traditional source countries such as India, Nigeria and Nepal each fell more than 50%, while emerging corridors like Senegal, Guinea and Vietnam grew. The episode exposes the market's structural vulnerability to single-country regulatory concentration."
    claimRefs:
      - CM007
      - CM008
      - CM009
      - CM010
      - CM011
      - CM012
      - CM013
      - CM014
      - CM015
      - CM019
      - CM020
      - CM031
      - CM036
    tableRefs:
      - TM004
  - id: market-outlook
    title: Outlook and diligence gaps
    body: "The forward view is a tug-of-war between diversification and contraction. ApplyBoard is responding to the Canadian shock by targeting 20 new study destinations by 2030 and launching non-Anglophone markets such as Germany, and it continues to publish a fifth annual trends report to maintain market authority. Yet the valuation correction of as much as 74% from the 2021 peak reflects investor repricing of a business whose Canadian growth engine stalled. Two diligence gaps dominate this chapter: estimates for ApplyBoard's precise niche cannot be reconciled across third-party reports, and the net 2026 effect of new-market gains versus Canadian losses remains unquantified. Both should be closed with bottom-up placement-fee sizing and 2026 permit tracking before underwriting any market-growth assumption. The market remains large and structurally growing, but its near-term Canadian concentration makes top-down optimism unsafe without company-specific data."
    claimRefs:
      - CM021
      - CM023
      - CM024
      - CM030
      - CM034
      - CM035
