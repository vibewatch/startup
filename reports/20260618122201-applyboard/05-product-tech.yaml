      - TE002
    figureRefs:
      - FE002
  - id: architecture
    title: Architecture and operating model
    body: "Architecturally the platform is a multi-sided marketplace linking students, recruitment partners and institutions, layered over a data and document-processing core. Document handling is a central technical workflow because visa applications require accurate extraction and verification, where errors carry real consequences for students. ApplyBoard has invested in this layer: researchers published an ICPRS 2025 paper describing an embedding-based confidence score for AI document entity extraction that reportedly separated correct from erroneous extractions with an F1-score of about 0.98, explicitly targeting AI's \"silent failure\" problem by flagging low-confidence outputs for human review. The company also maintains a public GitHub organisation as a visible developer-signal footprint. Critical external dependencies include third-party large language models behind Abbie and integrations with bank GIC systems and institution admissions systems. No public documentation discloses the underlying software stack or infrastructure providers, which is a genuine technical-diligence gap that engineering interviews would need to close."
    claimRefs:
      - CE002
      - CE005
      - CE006
      - CE007
      - CE017
      - CE020
      - CE024
      - CE025
      - CE032
