chapter:
  number: 5
  title: Product and Technology
  summary: ApplyBoard runs a multi-sided AI platform spanning discovery, application, document verification (ApplyProof), recruiter training (TrainHub), insights and GIC financial services, with Abbie AI (2024) and published document-AI confidence research (ICPRS 2025, F1 ~0.98); its strongest moat is document-extraction quality, not the commoditising chatbot layer.
sections:
  - id: product-suite
    title: Product suite and workflows
    body: "ApplyBoard sells an AI-powered platform that spans the full international study journey: program discovery, AI matching, application submission, document handling and status tracking across more than 150,000 programs, with a claimed 95% application success rate. Around this core sits a broad suite — TrainHub for recruiter training (acquired as Panda Portal in March 2022), ApplyProof for digital GIC certificate verification, the 360 Solutions application-to-arrival bundle, ApplyInsights for market intelligence, and financial-services GIC products delivered with RBC and TD. The conversational layer is Abbie, launched in June 2024 and billed as the world's first AI advisor for studying abroad, a GPT-based multilingual chatbot. For students the workflow is discover, match, apply, verify and arrive; for institutions it is a managed inbound pipeline; for agents it is a tooled distribution channel. This breadth is the product's defining strength and frames the architecture and differentiation analysis that follows."
    claimRefs:
      - CE001
      - CE008
      - CE009
      - CE010
      - CE011
      - CE012
      - CE013
      - CE014
      - CE015
      - CE030
