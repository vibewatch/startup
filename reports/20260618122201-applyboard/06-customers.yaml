    - type: enumeration-incomplete
      severity: minor
      topic: named-customers
      missingEvidence: A complete, verified roster of institution customers beyond the few named publicly.
      whyItMatters: Named-customer proof is partial, so concentration and quality of the partner book cannot be fully assessed from public sources.
      diligencePath: Obtain the full institution partner list and revenue-by-partner breakdown under NDA.
      relatedQuestionRefs:
