company:
  name: ApplyBoard
chapter:
  number: 6
  title: Customers
  summary: "ApplyBoard is two-sided: 1,500+ paying institutions and 1.5M+ free students across 180+ nationalities, with recruitment agents as a third group. Its strongest, verifiable proof is an 82% student visa-approval rate versus ~50% nationally and named TD/RBC partnerships; weaknesses are Canada demand concentration (cap cut approvals ~45%), curated rather than independent satisfaction proof, and layoffs touching customer-facing teams."
sections:
  - id: customer-base
    title: Customer base and segments
    body: ApplyBoard is a two-sided business. Its paying customers are the more than 1,500 post-secondary institutions across six countries that pay for enrolled students, while students themselves use the platform for free; a network of recruitment agents acts as both distribution channel and a third customer group that the company tools and trains. The platform reports helping more than 1.5 million students as of 2026, up from a 1.3 million milestone in mid-2025, drawn from over 180 nationalities. Student segments span undergraduate, graduate, language and pathway programs, and historically the largest source markets have been India, Nigeria and the Philippines, with a Great Place to Work-certified India operation supporting that demand. Institution customers value ApplyBoard as an inbound enrolment channel that aggregates vetted international applicants they could not source directly, while the six-country footprint widens their reach. This dual structure shapes everything from acquisition economics to retention and concentration risk discussed below.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU005
      - CU006
      - CU007
      - CU015
      - CU016
      - CU022
      - CU023
      - CU031
    tableRefs:
      - TU001
      - TU002
    figureRefs:
      - FU001
  - id: proof-outcomes
    title: Proof points and student outcomes
    body: "The most differentiated and verifiable customer proof point is outcome quality: ApplyBoard students achieved an 82% study-permit approval rate in 2024 against a roughly 50% national average, alongside an advertised 95% application success rate. Named customers that can be checked include institutions such as Western University and Laurentian University, plus a marquee financial-services partnership with TD Bank, whose International Student GIC Program runs on ApplyProof digital verification; RBC and TD partnerships lend third-party credibility to the funding workflow. Student testimonials are warm — describing the service as \"an answer from heaven\" and crediting outcomes entirely to ApplyBoard — but they are company-curated rather than independent. Third-party review-site coverage is thin and access-restricted, and audited satisfaction metrics such as NPS are not disclosed, so the published proof skews promotional. A buyer should weight the verifiable visa-approval outcome heavily and treat testimonials as supporting, not decisive, evidence of satisfaction, and should seek independent reference calls during diligence to confirm institution sentiment."
    claimRefs:
      - CU008
      - CU009
      - CU010
      - CU011
      - CU012
      - CU013
      - CU014
      - CU024
      - CU025
      - CU032
      - CU033
      - CU034
    tableRefs:
      - TU003
    figureRefs:
      - FU003
  - id: retention-service
    title: Retention, repeat usage and service capacity
    body: "Retention must be read through the two-sided lens. On the student side retention is structurally limited because most students transact once for a single enrolment journey, so lifetime value comes from a single funnel rather than recurring use. The durable, recurring customers are the institutions and recruitment agents whose repeat usage drives revenue across many student cohorts, and embedding GIC financial products deepens engagement at the funding step. Service capacity is a watch item: the November 2022 layoffs specifically hit the customer experience department, and the June 2025 reductions of more than 150 staff spanned customer-facing teams in Canada and India, raising questions about support levels during a demand downturn. Independent satisfaction evidence is the biggest gap here, since the company has not published NPS or churn figures and review sites are sparse. The cohort lens therefore matters more for institutions and agents than for one-time students."
    claimRefs:
      - CU020
      - CU021
      - CU026
      - CU027
      - CU028
      - CU035
    tableRefs:
      - TU004
    figureRefs:
      - FU004
  - id: concentration-expansion
    title: Concentration risk and expansion
    body: The defining customer risk is concentration. Demand has been heavily weighted toward Canada-bound students, and the 2024 study-permit cap cut approvals by roughly 45%, with the total international-student population in Canada falling to 997,820 at end-2024, about 4% lower year over year. ApplyBoard's own survey found four in five respondents viewed Canada as less attractive after the cap — an adverse demand signal from its own customers. Concentration in a handful of high-volume source corridors amplifies exposure to any single country's policy shock. The strategic response is geographic diversification into the UK, Australia, Ireland and Germany to spread customer demand away from Canada, plus deeper monetisation of existing institution relationships through financial products and data tools. Whether institution enrolment volumes are recovering after the cap is not yet evidenced, making 2026 corridor-level demand the single most important customer metric to track for any prospective investor.
    claimRefs:
      - CU017
      - CU018
      - CU019
      - CU029
      - CU030
      - CU036
    tableRefs:
      - TU005
    figureRefs:
      - FU002
