runDate: "2026-06-18"
company:
  name: ApplyBoard
chapter:
  number: 7
  title: Risks
  summary: "ApplyBoard's risk profile is high but predominantly exogenous: Canada's study-permit cap (permits −48% in 2024, extended to 2026) and Bill C-2 powers to cancel/suspend applications drive demand straight into per-enrolment revenue, compounded by US visa cancellations, three layoff rounds, Basiri-family key-person concentration, and undisclosed Canada revenue exposure. Mitigation rests on UK/AU/IE/DE diversification whose success is the central monitorable."
sections:
  - id: regulatory-legal
    title: Regulatory and legal risk
    body: "Regulatory and legal risk is ApplyBoard's single largest exposure, because demand depends directly on government study-permit and visa policy that is currently tightening. Canada's 2024 cap cut new study permits to 267,890, down 48% from 2023 and far below the IRCC target, and issuance kept falling steeply through 2025; the cap was extended into 2026 at roughly 10% below 2024 levels, prolonging the headwind. Stricter PGWP eligibility and a 24-hour weekly work cap further reduce Canada's relative attractiveness. Layered on top is Canada's Bill C-2, the Strong Borders Act, which would grant powers to pause, cancel or suspend immigration documents and in-flight applications — a direct legal threat to pipeline certainty that signals a broader political tightening. Diversification destinations are not risk-free either: the United States doubled student-visa cancellations in 2025, making it an unreliable near-term alternative. These exogenous policy forces are the risks a buyer must underwrite first because they are already materialising rather than hypothetical."
    claimRefs:
      - CR001
      - CR002
      - CR036
      - CR003
      - CR004
      - CR005
      - CR006
      - CR007
      - CR008
      - CR033
      - CR040
    tableRefs:
      - TR001
    figureRefs:
      - FR001
  - id: concentration-financial
    title: Concentration and financial risk
    body: The policy risk bites so hard because of concentration. Revenue has been weighted toward Canada-bound enrolments, and because ApplyBoard earns per-enrolment fees, permit declines translate almost directly into revenue declines — the IRCC "reckoning" narrative captures exactly this transmission. The quantified split of revenue by destination corridor is not disclosed, which is a material diligence gap, but the directional exposure is clear. Financially, the valuation has fallen sharply from its 2021 peak, raising financing and morale risk if the downturn persists, and the company's claim of several years of runway is not independently verifiable from public sources. Risk transmits in a chain from policy to permit volumes to per-enrolment revenue to headcount and ultimately valuation, which is why three layoff rounds tracked the deteriorating policy environment. Sizing the Canada revenue share and confirming runway are therefore the two most valuable pieces of private evidence a buyer should demand.
    claimRefs:
      - CR009
      - CR010
      - CR020
      - CR029
      - CR030
      - CR031
      - CR037
      - CR038
      - CR039
    tableRefs:
      - TR002
    figureRefs:
      - FR002
  - id: operational-partner
    title: Operational, partner and people risk
    body: Beyond policy, ApplyBoard carries a normal but non-trivial set of operating risks. On supply it depends on third-party institutions, whose churn directly reduces platform inventory; on demand it depends on recruitment agents, whose conduct and quality can trigger regulatory scrutiny and reputational damage if applications are poor or fraudulent. Bank GIC partnerships with RBC and TD are valuable but concentrate financial-product reliance on a few institutions. Handling sensitive visa and financial documents creates data-security and privacy obligations, and AI-driven document processing introduces model-error or "silent failure" risk if the confidence controls described in the product chapter fail. On people and governance, three layoff rounds in 2022, 2024 and 2025 — the last explicitly tied to destination policy changes — signal execution stress, while the quiet 2022 founder-to-brother CEO transition and concentrated family control by the three Basiri brothers are key-person and governance considerations. These risks are largely management-controllable and rank below the exogenous policy risks in severity.
    claimRefs:
      - CR011
      - CR012
      - CR013
      - CR014
      - CR015
      - CR016
      - CR017
      - CR018
      - CR019
      - CR034
      - CR041
    tableRefs:
      - TR003
      - TR004
    figureRefs:
      - FR003
  - id: mitigation-monitoring
    title: Mitigation, kill criteria and monitoring
    body: The principal mitigation is geographic diversification into the UK, Australia, Ireland and Germany to spread demand away from Canada, supported by deeper monetisation of existing institutions through financial products and data tools. Diversification is itself execution-risky because each new corridor carries its own evolving visa regime, as the US cancellations show. A structural mitigant is secular student-mobility growth, which has trended upward over decades and partially offsets any single corridor. For underwriting, a reasonable kill criterion is failure to materially reduce Canada revenue share by 2027 while caps persist, and the monitoring framework should track Canada permit issuance, corridor mix and the enactment status of Bill C-2 as leading indicators. Competitive risk from IDP and others is real but secondary to the policy-driven demand contraction. Overall the risk profile is high, but the defining feature is that the principal risks are externally driven rather than idiosyncratic to ApplyBoard, which matters for how a buyer prices and monitors the position.
    claimRefs:
      - CR021
      - CR022
      - CR023
      - CR024
      - CR025
      - CR026
      - CR027
      - CR028
      - CR032
      - CR035
