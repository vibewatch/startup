  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Disclosure posture and revenue
        blocks:
          - type: paragraph
            body: >-
              ApplyBoard is a private company that does not publish audited financial statements, so its revenue picture
              must be assembled from program submissions, third-party trackers and management commentary. The strongest
              public signal is Deloitte's recognition of nearly 800% revenue growth over the three years to 2024, but
              that is a Fast 50 program figure rather than an audited disclosure. Industry trackers estimate 2025 ARR
              near $210 million and revenue near $295 million, a roughly $85 million spread that itself signals how
              unreliable external estimates are. The underlying revenue model is per-enrolled-student placement fees
              paid by institutions, supplemented by test-provider partnerships, SaaS tools for institutions, and
              financial-services GIC fee income from RBC and TD. The Canadian permit decline flows directly into the
              largest of these lanes, placement volume, making the unaudited growth narrative harder to extrapolate
              forward. Revenue quality is therefore an open question that only company-provided audited data can
              resolve.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
