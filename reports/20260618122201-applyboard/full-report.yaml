      - number: '4.3'
        title: Funding, valuation and capital adequacy
        blocks:
          - type: paragraph
            body: >-
              ApplyBoard's financing history is its most verifiable financial dimension. It raised a $375 million CAD
              (about $300 million USD) Series D in June 2021 at a $4 billion CAD / $3.2 billion USD peak valuation,
              bringing total equity to roughly $600 million CAD, with PIE News citing about $554 million USD from 31 or
              more investors by early 2025. In September 2024 it added a $100 million CAD RBCx credit facility as debt
              rather than equity, a choice consistent with avoiding a dilutive down-round given that Fidelity fund
              markings imply a valuation decline of as much as 74% from peak, to a roughly $840 million to $1.04 billion
              USD range. Management maintains the company is well-capitalised with several years of cash and a huge run
              rate, but actual cash, burn and the drawn portion of the RBCx facility are undisclosed, so capital
              adequacy for the 20-market expansion plan cannot be independently confirmed.
