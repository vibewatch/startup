      - number: '5.3'
        title: Differentiation, data and AI
        blocks:
          - type: paragraph
            body: >-
              ApplyBoard's differentiation rests on AI-native matching, document automation and a multi-country
              institution network, reinforced by a proprietary data asset built from millions of historical applications
              that powers both matching and the ApplyInsights analytics business. The conversational AI advisor Abbie
              and the document-AI confidence research position ApplyBoard as more AI-forward than manual rivals, and the
              company leans on six consecutive years of Deloitte Technology Fast 50 recognition and published research
              to support a technology-company identity. The reliability investment matters because the most defensible
              part of the AI stack is not the chatbot — large language models are widely available — but the
              document-extraction quality control that reduces costly errors at scale. Even so, independent benchmarks
              of Abbie's advisory accuracy are not public, so the AI advantage is plausible but not yet externally
              validated, and a buyer should treat conversational-AI parity as a real medium-term risk that diligence
              must probe with a direct, hands-on accuracy test.
