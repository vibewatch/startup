              - CP023
      - number: '3.4'
        title: Moats, switching costs and competitive risk
        blocks:
          - type: paragraph
            body: >-
              ApplyBoard's moat rests more on institution-partner breadth and agent network density than on proprietary
              technology. The network effect is real — more institutions attract more partners and students, raising
              switching costs for agents embedded in ApplyBoard's tooling — but it is contestable. Recruitment agents
              routinely multi-home across competing platforms, limiting exclusivity and pricing power, and AI-driven
              matching is becoming table stakes that erodes any first-mover advantage from ApplyBoard's AI messaging.
              The most durable competitive risk is therefore the combination of commoditising AI capability and agent
              multi-homing, against which breadth of coverage and demonstrated visa-approval outcomes are the strongest
              defences. Brand strength, reinforced by six consecutive Deloitte Fast 50 placements and favourable
              recruitment-agency review coverage, provides a softer but meaningful barrier. A buyer should weigh whether
              ApplyBoard's scale and brand can sustain margins as AI parity spreads across the field. In practice, the
              defensibility question reduces to two tests: whether ApplyBoard can keep institution partners exclusive
              enough to preserve placement economics, and whether its visa-approval outcomes stay measurably ahead of
              rivals as every platform adopts similar AI tooling. Neither test is settled by public evidence, so both
              belong on the confirmatory diligence list alongside direct partner-institution and agent reference calls.
            claimRefs:
              - CP014
              - CP015
              - CP019
              - CP020
              - CP025
              - CP029
              - CP030
              - CP034
