      - number: '8.4'
        title: Recommendation, triggers and diligence
        blocks:
          - type: paragraph
            body: >-
              The recommended stance is to track ApplyBoard rather than transact at current disclosure levels. The
              valuation stance is stretched-to-fair: the implied 3-5x revenue multiple is reasonable only if
              diversification works, and the overall risk rating is high, dominated by the exogenous regulatory exposure
              carried over from the risk chapter. Thesis-break triggers are concrete — failure to grow non-Canada
              revenue share by 2027, or enactment of Bill C-2 powers that materially disrupt application pipelines. The
              priority diligence asks are audited revenue, margin and revenue-by-corridor data, and verified cash, burn
              and runway behind the "years of cash" claim; a precise enterprise value cannot be triangulated without
              audited financials and a clean cap table, and it is not publicly known whether secondaries are clearing
              near the implied mark. Netting strong franchise quality against unresolved disclosure and policy risk, the
              overall investment score is a middling 6.0 out of 10. This reconciles a strong-but-repriced franchise with
              the risks documented throughout this report.
