      - number: '7.3'
        title: Operational, partner and people risk
        blocks:
          - type: paragraph
            body: >-
              Beyond policy, ApplyBoard carries a normal but non-trivial set of operating risks. On supply it depends on
              third-party institutions, whose churn directly reduces platform inventory; on demand it depends on
              recruitment agents, whose conduct and quality can trigger regulatory scrutiny and reputational damage if
              applications are poor or fraudulent. Bank GIC partnerships with RBC and TD are valuable but concentrate
              financial-product reliance on a few institutions. Handling sensitive visa and financial documents creates
              data-security and privacy obligations, and AI-driven document processing introduces model-error or "silent
              failure" risk if the confidence controls described in the product chapter fail. On people and governance,
              three layoff rounds in 2022, 2024 and 2025 — the last explicitly tied to destination policy changes —
              signal execution stress, while the quiet 2022 founder-to-brother CEO transition and concentrated family
              control by the three Basiri brothers are key-person and governance considerations. These risks are largely
              management-controllable and rank below the exogenous policy risks in severity.
