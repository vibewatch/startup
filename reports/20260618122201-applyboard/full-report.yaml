      - number: '5.4'
        title: Trust, compliance and roadmap
        blocks:
          - type: paragraph
            body: >-
              Trust and compliance in ApplyBoard's product hinge on accurate visa-document handling and on the conduct
              of the recruitment agents who originate demand. The TrainHub ethical recruitment practices course acts as
              a soft compliance control over agent behaviour, while the document-AI confidence work addresses quality
              control on the platform side. The roadmap is oriented around deepening AI capability and reaching 20 new
              markets by 2030, with the January 2025 Germany launch demonstrating the language and regulatory
              localisation needed to move beyond Anglophone destinations. Financial-services integration deepens
              stickiness by embedding ApplyBoard in the student-funding workflow, raising switching costs. The product
              maturity profile is highest in matching and document automation, mid-stage in market intelligence and
              financial services, and earliest in conversational AI. The combination of an AI-reliability research
              agenda with regulated-geography expansion is the clearest strategic signal in the product story, and it
              directly supports the diversification thesis seen elsewhere in this report and in the market chapter.
