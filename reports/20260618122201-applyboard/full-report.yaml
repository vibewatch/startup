      - number: '8.2'
        title: Revenue basis and comparables
        blocks:
          - type: paragraph
            body: >-
              No primary financial statements are public, so every revenue-based valuation rests on third-party
              estimates: trackers put 2025 ARR near US$210 million and revenue around US$295 million, an unresolved
              conflict that itself swings the multiple. Against the implied US$0.8-1.0 billion value, that base maps to
              roughly 3-5x revenue. The closest public comparable is IDP Education, the ASX-listed placement and IELTS
              group, which reported FY2025 revenue of about A$882 million, down roughly 15% year over year, with its own
              share price and multiples compressed — clear evidence that the whole sector is being repriced rather than
              ApplyBoard alone. Public placement peers now trade at subdued revenue multiples reflecting the
              policy-driven downturn. The addressable backdrop is large — a roughly US$250 billion EdTech market and a
              US$16-43 billion international recruitment market — which supports a constructive terminal-value case if
              mobility resumes its long-run growth. The financial basis is the weakest link, so the conflicting-estimate
              reconciliation is a priority diligence item.
