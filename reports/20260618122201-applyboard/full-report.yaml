  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer base and segments
        blocks:
          - type: paragraph
            body: >-
              ApplyBoard is a two-sided business. Its paying customers are the more than 1,500 post-secondary
              institutions across six countries that pay for enrolled students, while students themselves use the
              platform for free; a network of recruitment agents acts as both distribution channel and a third customer
              group that the company tools and trains. The platform reports helping more than 1.5 million students as of
              2026, up from a 1.3 million milestone in mid-2025, drawn from over 180 nationalities. Student segments
              span undergraduate, graduate, language and pathway programs, and historically the largest source markets
              have been India, Nigeria and the Philippines, with a Great Place to Work-certified India operation
              supporting that demand. Institution customers value ApplyBoard as an inbound enrolment channel that
              aggregates vetted international applicants they could not source directly, while the six-country footprint
              widens their reach. This dual structure shapes everything from acquisition economics to retention and
              concentration risk discussed below.
