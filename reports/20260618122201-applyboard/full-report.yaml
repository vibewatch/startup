      - number: '7.2'
        title: Concentration and financial risk
        blocks:
          - type: paragraph
            body: >-
              The policy risk bites so hard because of concentration. Revenue has been weighted toward Canada-bound
              enrolments, and because ApplyBoard earns per-enrolment fees, permit declines translate almost directly
              into revenue declines — the IRCC "reckoning" narrative captures exactly this transmission. The quantified
              split of revenue by destination corridor is not disclosed, which is a material diligence gap, but the
              directional exposure is clear. Financially, the valuation has fallen sharply from its 2021 peak, raising
              financing and morale risk if the downturn persists, and the company's claim of several years of runway is
              not independently verifiable from public sources. Risk transmits in a chain from policy to permit volumes
              to per-enrolment revenue to headcount and ultimately valuation, which is why three layoff rounds tracked
              the deteriorating policy environment. Sizing the Canada revenue share and confirming runway are therefore
              the two most valuable pieces of private evidence a buyer should demand.
