      - number: '4.2'
        title: Unit economics and margin
        blocks:
          - type: paragraph
            body: >-
              Without audited cost data, ApplyBoard's unit economics can only be framed structurally. The core unit is
              the placement: a fee per enrolled student set against the cost of student acquisition, application
              processing and partner commissions shared with recruitment agents. The software-and-services mix plausibly
              supports a software-like gross margin, but this is an inference rather than a disclosed figure. Three
              layoff rounds since 2022 — customer experience in November 2022, about 4% in September 2024, and more than
              150 staff in June 2025 — indicate active cost management to defend runway as Canadian revenue pressure
              built. Pricing power on placement fees is constrained by competitor multi-homing and institution budget
              cycles, capping the ability to offset volume declines with rate increases. The gross-to-net realisation
              rate on placement fees, after agent commissions and refunds, is unknown and is one of the more important
              missing inputs for any margin model. A buyer should size this rate directly with the company, since even a
              software-like headline margin can be undercut by high partner-commission revenue share.
            claimRefs:
              - CI021
              - CI022
              - CI023
              - CI031
              - CI035
          - type: table
            tableRef: TI003
            claimRefs:
