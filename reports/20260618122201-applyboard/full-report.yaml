      - number: '1.3'
        title: Funding, valuation and capital
        blocks:
          - type: paragraph
            body: >-
              ApplyBoard reached unicorn status in May 2020 and peaked with a June 2021 Series D of $375 million CAD at
              a $4 billion CAD valuation led by Ontario Teachers' Pension Plan Board through its Teachers' Innovation
              Platform, with Fidelity, BDC Capital, Index Ventures, Harmonic, Garage Capital and Blue Cloud Ventures
              participating. Through that close the company had raised roughly $600 million CAD in equity from 31 or
              more investors. In September 2024 it added a $100 million CAD credit facility from RBCx — debt, not equity
              — earmarked for global expansion and AI, targeting 20 new markets by 2030. The capital story turned
              adverse in early 2025 when Fidelity fund markings implied a valuation decline of as much as 74% from the
              2021 peak. CFO David Borecky countered that "valuations are a moment in time" and that the company is
              well-capitalised with several years of cash on hand and no need to fundraise.
