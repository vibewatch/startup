  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal risk
        blocks:
          - type: paragraph
            body: >-
              Regulatory and legal risk is ApplyBoard's single largest exposure, because demand depends directly on
              government study-permit and visa policy that is currently tightening. Canada's 2024 cap cut new study
              permits to 267,890, down 48% from 2023 and far below the IRCC target, and issuance kept falling steeply
              through 2025; the cap was extended into 2026 at roughly 10% below 2024 levels, prolonging the headwind.
              Stricter PGWP eligibility and a 24-hour weekly work cap further reduce Canada's relative attractiveness.
              Layered on top is Canada's Bill C-2, the Strong Borders Act, which would grant powers to pause, cancel or
              suspend immigration documents and in-flight applications — a direct legal threat to pipeline certainty
              that signals a broader political tightening. Diversification destinations are not risk-free either: the
              United States doubled student-visa cancellations in 2025, making it an unreliable near-term alternative.
              These exogenous policy forces are the risks a buyer must underwrite first because they are already
              materialising rather than hypothetical.
            claimRefs:
              - CR001
