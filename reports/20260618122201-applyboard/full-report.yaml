            claimRefs:
              - CM032
              - CM017
      - number: '2.4'
        title: Growth drivers and constraints
        blocks:
          - type: paragraph
            body: >-
              The market's long-run drivers are structural: rising higher-education demand, demographic pressure in
              South Asia and Sub-Saharan Africa, and the digitisation of a historically fragmented agent channel.
              Against these tailwinds sits an acute near-term constraint — Canadian regulation. The January 2024 study
              permit cap targeted roughly a 35% reduction, required provincial attestation letters, tightened
              post-graduation work permit eligibility, and was extended into 2026 at about 10% below 2024 levels. The
              result was 267,890 new permits in 2024, down about 48% year over year and roughly 100,000 below IRCC's
              target, with ApplyBoard's own analysis showing approvals down about 45% and capped college programs down
              about 60%. Traditional source countries such as India, Nigeria and Nepal each fell more than 50%, while
              emerging corridors like Senegal, Guinea and Vietnam grew. The episode exposes the market's structural
              vulnerability to single-country regulatory concentration.
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
              - CM019
              - CM020
              - CM031
              - CM036
          - type: table
            tableRef: TM004
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM019
              - CM020
              - CM031
      - number: '2.5'
        title: Outlook and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The forward view is a tug-of-war between diversification and contraction. ApplyBoard is responding to the
              Canadian shock by targeting 20 new study destinations by 2030 and launching non-Anglophone markets such as
              Germany, and it continues to publish a fifth annual trends report to maintain market authority. Yet the
              valuation correction of as much as 74% from the 2021 peak reflects investor repricing of a business whose
              Canadian growth engine stalled. Two diligence gaps dominate this chapter: estimates for ApplyBoard's
              precise niche cannot be reconciled across third-party reports, and the net 2026 effect of new-market gains
              versus Canadian losses remains unquantified. Both should be closed with bottom-up placement-fee sizing and
              2026 permit tracking before underwriting any market-growth assumption. The market remains large and
              structurally growing, but its near-term Canadian concentration makes top-down optimism unsafe without
              company-specific data.
            claimRefs:
              - CM021
              - CM023
              - CM024
              - CM030
              - CM034
              - CM035
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape
        blocks:
          - type: paragraph
            body: >-
              ApplyBoard competes in a layered landscape that runs from listed global incumbents to private niche
              players, discovery portals, and the offline status quo. The most formidable direct competitor is IDP
              Education, an ASX-listed company operating across roughly 74 countries that pairs student placement with
              co-ownership of the IELTS English test. Shorelight is a private, US-focused rival founded in 2013 built
              around deep university partnerships, while Studyportals and Keystone Education Group compete upstream in
              program discovery rather than head-to-head in placement. Smaller regional players such as CIBT operate
              adjacent in Canadian immigration and language services. British Council occupies an unusual coopetitive
              position as both an IELTS testing provider and an ApplyBoard partner. The most important non-platform
              substitute remains direct institutional admissions offices. This breadth of competitor types means
              ApplyBoard must defend on multiple fronts simultaneously, and no single comparison fully captures its
              position.
            claimRefs:
              - CP001
              - CP005
              - CP007
              - CP008
              - CP010
              - CP011
              - CP024
              - CP036
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP005
              - CP007
              - CP008
              - CP010
              - CP014
      - number: '3.2'
        title: Competitor profiles and scale
        blocks:
          - type: paragraph
            body: >-
              Scale and disclosure vary sharply across the set. IDP Education is the only fully audited benchmark,
              reporting FY2025 revenue of about AUD 882.2 million, down roughly 15% year over year, with Canada
              placements down about 56% — direct evidence that the Canadian shock is sector-wide rather than unique to
              ApplyBoard. Shorelight, Keystone and Studyportals are private and disclose little revenue, making precise
              market-share ranking impossible without third-party databases. ApplyBoard sits as a well-capitalised
              growth-stage challenger whose six-country footprint exceeds Shorelight's US focus and rivals IDP's
              destination breadth, while its institution-partner count of more than 1,500 anchors its network position.
              The shared exposure of listed IDP and private ApplyBoard to the same regulatory downturn is the single
              clearest competitive signal in the chapter: even the category leader saw revenue fall, underscoring that
              regulatory volatility, not competitive displacement, is the dominant near-term force.
            claimRefs:
