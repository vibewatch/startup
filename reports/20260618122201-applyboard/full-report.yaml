      - number: '6.2'
        title: Proof points and student outcomes
        blocks:
          - type: paragraph
            body: >-
              The most differentiated and verifiable customer proof point is outcome quality: ApplyBoard students
              achieved an 82% study-permit approval rate in 2024 against a roughly 50% national average, alongside an
              advertised 95% application success rate. Named customers that can be checked include institutions such as
              Western University and Laurentian University, plus a marquee financial-services partnership with TD Bank,
              whose International Student GIC Program runs on ApplyProof digital verification; RBC and TD partnerships
              lend third-party credibility to the funding workflow. Student testimonials are warm — describing the
              service as "an answer from heaven" and crediting outcomes entirely to ApplyBoard — but they are
              company-curated rather than independent. Third-party review-site coverage is thin and access-restricted,
              and audited satisfaction metrics such as NPS are not disclosed, so the published proof skews promotional.
              A buyer should weight the verifiable visa-approval outcome heavily and treat testimonials as supporting,
              not decisive, evidence of satisfaction, and should seek independent reference calls during diligence to
              confirm institution sentiment.
