      - number: '3.3'
        title: Capability and pricing comparison
        blocks:
          - type: paragraph
            body: >-
              On capability, recruitment platforms compete on breadth of institution coverage, visa-approval outcomes,
              and the quality of agent tooling. ApplyBoard differentiates on AI-native matching across six destinations,
              an advertised 82% student visa approval rate roughly 32 points above the Canadian national average, and a
              recruitment-partner network reinforced by TrainHub training tools. IDP counters with global scale and
              IELTS ownership, a testing revenue stream ApplyBoard does not have, while ApplyBoard adds
              financial-services monetisation through RBC and TD GIC partnerships that peers de-emphasise. Pricing
              across the sector is dominated by per-placement commissions paid by institutions, with limited public
              rate-card disclosure; IDP layers in IELTS test fees for diversification. The practical consequence is that
              head-to-head comparison must weigh ApplyBoard's breadth and outcome claims against IDP's scale and revenue
              diversification, with private rivals occupying narrower geographic or value-chain niches.
            claimRefs:
              - CP004
              - CP012
              - CP013
              - CP018
              - CP023
              - CP026
              - CP027
              - CP028
          - type: table
            tableRef: TP002
            claimRefs:
              - CP004
              - CP012
              - CP018
              - CP028
          - type: table
            tableRef: TP003
            claimRefs:
