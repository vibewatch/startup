chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              ApplyBoard Inc. is a Kitchener-Waterloo, Ontario company founded in 2015 that operates an AI-powered
              platform connecting international students, post-secondary institutions and recruitment partners. The
              company was started by three Iranian-Canadian brothers, Martin, Meti and Massi Basiri, who had themselves
              navigated the friction of applying to study abroad and built ApplyBoard to remove those barriers. Its
              mission, stated consistently since launch, is to make education accessible worldwide. The platform now
              spans six study destinations, more than 1,500 partner institutions and over 150,000 programs, and it
              monetises primarily through per-student placement economics paid by institutions alongside test-provider
              and financial-services partnerships. ApplyBoard remains a privately held, growth-stage unicorn
              headquartered at 101 Frederick Street in Kitchener, and it has signalled longer-term IPO ambitions without
              committing to a timeline. This chapter establishes the company identity, leadership, capital structure,
              cover metrics and milestone trajectory that anchor the rest of the diligence.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO019
              - CO020
              - CO033
              - CO034
          - type: figure
            figureRef: FO002
            claimRefs:
              - CO019
              - CO020
              - CO036
      - number: '1.2'
        title: Founders, leadership and governance
        blocks:
          - type: paragraph
            body: >-
              Leadership concentration in a single founding family is the defining governance feature of ApplyBoard.
              Meti Basiri, previously chief marketing officer, became chief executive officer in August 2022 when
              founding CEO Martin Basiri stepped down; brother Massi Basiri serves as President leading product and
              innovation. David Borecky is chief financial officer and has been the public voice on valuation questions.
              The August 2022 CEO transition was handled quietly and only publicly disclosed in January 2023, a
              transparency gap worth noting for governance diligence. Martin Basiri remained a board member after
              stepping down, took parental leave, and then departed to found Passage, a separate venture that raised a
              $40 million CAD seed round to tackle Canada's skilled-worker shortage. The continued presence of three
              brothers across executive and board roles creates meaningful key-person and related-party considerations
              that a buyer should test against the shareholders agreement and board composition.
