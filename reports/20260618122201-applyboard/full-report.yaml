      - number: '7.4'
        title: Mitigation, kill criteria and monitoring
        blocks:
          - type: paragraph
            body: >-
              The principal mitigation is geographic diversification into the UK, Australia, Ireland and Germany to
              spread demand away from Canada, supported by deeper monetisation of existing institutions through
              financial products and data tools. Diversification is itself execution-risky because each new corridor
              carries its own evolving visa regime, as the US cancellations show. A structural mitigant is secular
              student-mobility growth, which has trended upward over decades and partially offsets any single corridor.
              For underwriting, a reasonable kill criterion is failure to materially reduce Canada revenue share by 2027
              while caps persist, and the monitoring framework should track Canada permit issuance, corridor mix and the
              enactment status of Bill C-2 as leading indicators. Competitive risk from IDP and others is real but
              secondary to the policy-driven demand contraction. Overall the risk profile is high, but the defining
              feature is that the principal risks are externally driven rather than idiosyncratic to ApplyBoard, which
              matters for how a buyer prices and monitors the position.
