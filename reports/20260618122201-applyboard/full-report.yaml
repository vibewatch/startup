              The only fully audited comparable in the analysis is listed peer IDP Education, which reported FY2025
              revenue of about AUD 882 million and whose public valuation multiples compressed sharply alongside a
              revenue decline — a useful but imperfect lens for pricing ApplyBoard's private equity. The financial
              verdict is that ApplyBoard's funding rounds are well-documented while its operating financials remain a
              diligence blocker: there is no audited revenue, ARR, gross margin, burn or runway figure in the public
