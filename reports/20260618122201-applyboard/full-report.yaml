      - number: '6.3'
        title: Retention, repeat usage and service capacity
        blocks:
          - type: paragraph
            body: >-
              Retention must be read through the two-sided lens. On the student side retention is structurally limited
              because most students transact once for a single enrolment journey, so lifetime value comes from a single
              funnel rather than recurring use. The durable, recurring customers are the institutions and recruitment
              agents whose repeat usage drives revenue across many student cohorts, and embedding GIC financial products
              deepens engagement at the funding step. Service capacity is a watch item: the November 2022 layoffs
              specifically hit the customer experience department, and the June 2025 reductions of more than 150 staff
              spanned customer-facing teams in Canada and India, raising questions about support levels during a demand
              downturn. Independent satisfaction evidence is the biggest gap here, since the company has not published
              NPS or churn figures and review sites are sparse. The cohort lens therefore matters more for institutions
              and agents than for one-time students.
