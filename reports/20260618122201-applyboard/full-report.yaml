      - number: '2.3'
        title: Segments, buyers and adoption
        blocks:
          - type: paragraph
            body: >-
              The market segments along three axes: destination geography, institution type (universities, colleges,
              language and pathway providers), and student segment (undergraduate, graduate, language, pathway).
              Institutions are the primary paying customers, compensating platforms per enrolled student, while
              recruitment partners and agents form the distribution channel that originates much of the demand. Students
              are the end users whose trust, visa-approval odds and switching costs determine whether they adopt a
              platform over a direct application. This multi-sided structure means budget ownership sits with
              institutions even though acquisition depends on partner and student behaviour. Adoption of digital
              platforms over offline agents is driven by transparency, breadth of program choice and demonstrably higher
              visa-approval rates, which is precisely where ApplyBoard positions its value proposition. Understanding
              which side pays and which side decides is essential for assessing pricing power and durability later in
              the diligence.
            claimRefs:
              - CM016
              - CM017
              - CM018
              - CM022
              - CM029
              - CM032
