      - number: '6.4'
        title: Concentration risk and expansion
        blocks:
          - type: paragraph
            body: >-
              The defining customer risk is concentration. Demand has been heavily weighted toward Canada-bound
              students, and the 2024 study-permit cap cut approvals by roughly 45%, with the total international-student
              population in Canada falling to 997,820 at end-2024, about 4% lower year over year. ApplyBoard's own
              survey found four in five respondents viewed Canada as less attractive after the cap — an adverse demand
              signal from its own customers. Concentration in a handful of high-volume source corridors amplifies
              exposure to any single country's policy shock. The strategic response is geographic diversification into
              the UK, Australia, Ireland and Germany to spread customer demand away from Canada, plus deeper
              monetisation of existing institution relationships through financial products and data tools. Whether
              institution enrolment volumes are recovering after the cap is not yet evidenced, making 2026
              corridor-level demand the single most important customer metric to track for any prospective investor.
