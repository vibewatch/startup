      - number: '8.3'
        title: Scenarios and sensitivity
        blocks:
          - type: paragraph
            body: >-
              The scenario spread is wide. The bull case is that diversification into the UK, Australia, Ireland and
              Germany restores growth and re-rates ApplyBoard toward its peak revenue multiple, supported by secular
              mobility growth. The base case is a stabilised, structurally smaller ApplyBoard worth roughly its current
              US$0.8-1.0 billion implied value, anchored by investor sentiment that OPM Wire bluntly labelled a
              "debacle". The bear case is continued Canada contraction and failed diversification pushing value below
              US$0.7 billion, with study-permit approvals at decade lows as the dominant downside driver. The valuation
              is most sensitive to revenue recovery in non-Canada corridors and to sustained gross margins, so small
              changes in the diversification trajectory move the outcome sharply. The RBCx debt facility is a modest
              positive signal — lenders extended credit even as equity marks fell — but it does not resolve the equity
              question. Expected return is therefore modest and back-end-loaded, contingent on a 2026-2027
              diversification inflection.
