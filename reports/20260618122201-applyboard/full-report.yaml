  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product suite and workflows
        blocks:
          - type: paragraph
            body: >-
              ApplyBoard sells an AI-powered platform that spans the full international study journey: program
              discovery, AI matching, application submission, document handling and status tracking across more than
              150,000 programs, with a claimed 95% application success rate. Around this core sits a broad suite —
              TrainHub for recruiter training (acquired as Panda Portal in March 2022), ApplyProof for digital GIC
              certificate verification, the 360 Solutions application-to-arrival bundle, ApplyInsights for market
              intelligence, and financial-services GIC products delivered with RBC and TD. The conversational layer is
              Abbie, launched in June 2024 and billed as the world's first AI advisor for studying abroad, a GPT-based
              multilingual chatbot. For students the workflow is discover, match, apply, verify and arrive; for
              institutions it is a managed inbound pipeline; for agents it is a tooled distribution channel. This
              breadth is the product's defining strength and frames the architecture and differentiation analysis that
              follows.
