  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Valuation history and current mark
        blocks:
          - type: paragraph
            body: >-
              ApplyBoard's valuation peaked at C$4 billion (about US$3.2 billion) at the June 2021 Series D, a C$375
              million round led by Ontario Teachers' Pension Plan. The repricing began early: Fidelity cut the carrying
              value of its stake by about 22.9% in mid-2022, and by February 2025 Fidelity fund marks implied a decline
              of up to roughly 74% from the peak — mapping to a current equity value in the region of US$840 million to
              US$1.04 billion. Management has pushed back, with the CFO calling valuations "a moment in time" and the
              CEO pointing to a #4 Deloitte Fast 50 ranking and roughly 800% three-year revenue growth, and asserting
              the company is well-capitalised with several years of cash and no need to fundraise. The core anti-thesis
              is therefore that ApplyBoard is a leveraged bet on a single regulator's policy direction, while the thesis
              is a category-leading AI platform able to consolidate a fragmented recruitment market. This tension frames
              the rest of the valuation.
