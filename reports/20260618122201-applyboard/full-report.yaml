  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market definition and boundaries
        blocks:
          - type: paragraph
            body: >-
              ApplyBoard sells into the international student recruitment market: the spend institutions devote to
              attracting, qualifying and enrolling cross-border students, monetised mainly through per-student placement
              fees and adjacent services. The included spend covers placement commissions, platform subscriptions for
              institutions, and recruitment-partner tooling; it excludes domestic admissions, tuition itself, and the
              broader EdTech learning-software category valued at roughly $251 billion in 2024. Status-quo substitutes
              are direct institutional admissions offices and traditional offline agents, while adjacencies span
              language testing, student finance and study-abroad advisory. The market sits within a global pool of more
              than 6.4 million students studying abroad in 2025. Defining the boundary tightly matters because headline
              market estimates mix recruitment-agency revenue with adjacent EdTech spend, producing the wide $15.8
              billion to $42.8 billion range seen across third-party reports. For this diligence, the relevant
              serviceable market is the six destination countries where ApplyBoard runs partner networks.
            claimRefs:
              - CM004
              - CM016
              - CM025
              - CM026
              - CM027
              - CM028
          - type: table
            tableRef: TM001
            claimRefs:
              - CM016
              - CM027
              - CM028
      - number: '2.2'
        title: Market sizing and growth
        blocks:
          - type: paragraph
            body: >-
              Sizing this market requires multiple lenses because no single report cleanly matches ApplyBoard's niche.
              Recruitment-market estimates cluster between $15.8 billion and $42.8 billion for 2024-2025 with projected
              CAGRs of 8.6% to 10.2% into the early 2030s, while the broader EdTech category provides an outer bound
              near $251 billion. The underlying demand driver is a global mobile-student pool exceeding 6.4 million, of
              which Asia Pacific contributes about 41.2% of market revenue. ApplyBoard reinforces the bull case with its
              claim that student mobility has doubled every decade and points to nearly 800% three-year revenue growth
              recognised by Deloitte through 2024. The principal caveat is methodological: definitions blend agency
              revenue, placement fees and software spend, so a defensible SAM and SOM for ApplyBoard should be rebuilt
              bottom-up from placement economics rather than borrowed from any one top-down figure.
