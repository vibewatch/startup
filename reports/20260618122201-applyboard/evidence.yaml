evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: A disclosed current valuation or recent primary round confirming the post-2021 marking.
    whyItMatters: Without a fresh valuation the 74% decline figure rests on third-party fund markings, not company disclosure.
    diligencePath: Request the most recent 409A or investor mark from management under NDA.
    relatedQuestionRefs:
      - QO020
      - QO026
  - type: missing-source
    severity: minor
    topic: headcount
    missingEvidence: A current employee count reconciling the three reported layoff rounds.
    whyItMatters: Headcount is a core cover metric and a proxy for burn and execution capacity.
    diligencePath: Cross-check LinkedIn headcount trend against a management-confirmed figure.
    relatedQuestionRefs:
      - QO021
  - type: enumeration-incomplete
    severity: minor
    topic: Stakeholder or investor map
    missingEvidence: A complete investor roster with ownership percentages and secondary participation.
    whyItMatters: >-
      The full cap table determines preference overhang and control, which the public investor list only partially
      reveals.
    diligencePath: Obtain the capitalization table and shareholders agreement during confirmatory diligence.
    relatedQuestionRefs:
      - QO023
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: material
    topic: methodology
    missingEvidence: A reconciled market-size figure for the specific international student recruitment niche.
    whyItMatters: Third-party estimates range from $15.8B to $42.8B, too wide to anchor a SAM/SOM with confidence.
    diligencePath: Commission a bottom-up sizing from placement-fee economics across the six destinations.
    relatedQuestionRefs:
      - QM025
      - QM026
    relatedTableRefs:
      - TM002
  - type: stale
    severity: minor
    topic: net-effect
    missingEvidence: Forward 2026 permit and enrolment data isolating diversification gains from Canadian losses.
    whyItMatters: Whether new markets offset Canada determines the platform's near-term revenue trajectory.
    diligencePath: Track 2026 IRCC monthly permit data alongside ApplyBoard non-Canada placement volumes.
    relatedQuestionRefs:
      - QM025
  - type: private-evidence-only
    severity: material
    topic: market-share
    missingEvidence: Audited revenue or placement-volume data for private competitors Shorelight, Keystone and Studyportals.
    whyItMatters: Without private competitor financials, relative market-share and competitive ranking cannot be quantified.
    diligencePath: Seek private databases (PitchBook) or management estimates of placement volumes by competitor.
    relatedQuestionRefs:
      - QP026
  - type: missing-source
    severity: minor
    topic: pricing
    missingEvidence: Published per-placement commission rates across platforms.
    whyItMatters: Pricing transparency is needed to assess relative pricing power and margin pressure.
    diligencePath: Interview partner institutions on commission structures during commercial diligence.
    relatedQuestionRefs:
      - QP022
  - type: private-evidence-only
    severity: blocking
    topic: revenue
    missingEvidence: Audited revenue, ARR, gross margin and burn figures from management.
    whyItMatters: >-
      All revenue and margin analysis currently rests on unverified third-party estimates; this blocks any reliable
      financial underwrite.
    diligencePath: Obtain audited financials and a management-prepared operating model under NDA.
    relatedQuestionRefs:
