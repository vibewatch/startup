  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: valuation-gap
      missingEvidence: Audited revenue, margin and revenue-by-corridor figures and a clean cap table.
      whyItMatters: Every revenue-based valuation here rests on third-party estimates; a precise enterprise value cannot be set without primary financials.
      diligencePath: Obtain audited financials, a current cap table and a management model under NDA.
      relatedQuestionRefs:
        - QV028
    - type: missing-source
      severity: material
      topic: valuation-gap
      missingEvidence: Recent secondary-transaction prices for ApplyBoard shares.
      whyItMatters: Secondary clearing prices would validate or refute the ~US$0.8-1.0B implied mark.
      diligencePath: Survey secondary brokers and request the company's latest 409A/fair-value reference.
      relatedQuestionRefs:
        - QV029
    - type: conflicting-data
      severity: material
      topic: revenue
      missingEvidence: Reconciliation between divergent third-party revenue estimates (US$210M ARR vs ~US$295M revenue).
      whyItMatters: The valuation multiple swings materially depending on which estimate is correct.
      diligencePath: Confirm the true revenue base directly with management and tie to audited accounts.
