              年已帮助 150 多万名学生，高于 2025 年中 130 万里程碑，学生来自 180 多个国籍。学生细分覆盖本科、研究生、语言和桥梁课程，历史上最大的来源市场是印度、尼日利亚和菲律宾，并由获得 Great
