            body: >-
              缺少经审计成本数据时，ApplyBoard
              的单位经济只能从结构上框定。核心单位是一次安置：每名入学学生一笔费用，对应学生获客、申请处理以及与招生代理分成的合作伙伴佣金成本。软件与服务组合理论上可支撑类似软件的毛利率，但这只是推断，并非披露数据。2022
              年以来三轮裁员——2022 年 11 月客户体验团队、2024 年 9 月约 4%、2025 年 6 月超过 150
              人——显示加拿大收入压力累积时，公司在主动管控成本、守住跑道。安置费定价权受竞争对手多栖和院校预算周期限制，因此难以靠提价抵消量的下滑。安置费扣除代理佣金和退款后的总收入口径到净收入口径实现率未知，是任何利润率模型里更重要的缺失输入之一。买方应直接向公司测算该比率，因为即便表面毛利率像软件，高合作伙伴佣金分成也会侵蚀利润。
