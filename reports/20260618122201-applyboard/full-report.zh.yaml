      - number: '2.4'
        title: 增长驱动与约束
        blocks:
          - type: paragraph
            body: >-
              市场长期驱动是结构性的：高等教育需求上升、南亚和撒哈拉以南非洲的人口压力，以及历史上碎片化代理渠道的数字化。顺风之上，近端约束很尖锐——加拿大监管。2024 年 1 月的学习许可上限目标约减少
              35%，要求省级证明信，收紧毕业后工作许可资格，并延长至 2026 年，额度比 2024 年水平约低 10%。结果是 2024 年新许可 267,890 份，同比下降约 48%，比 IRCC 目标低约
              100,000；ApplyBoard 自身分析显示，获批量下降约 45%，受限学院项目下降约 60%。印度、尼日利亚和尼泊尔等传统来源国各自下滑超过
              50%，塞内加尔、几内亚和越南等新兴走廊则增长。这一事件暴露出市场对单一国家监管集中度的结构性脆弱。
