      - number: '1.4'
        title: 封面指标与规模
        blocks:
          - type: paragraph
            body: >-
              ApplyBoard 的封面指标强调覆盖面。截至 2026 年，官网披露已帮助 150 多万名学生，高于 2025 年中 130 万和 2024 年 6 月 100 万的里程碑；同时披露申请成功率
              95%、150,000 多个项目、学生来自 180 多个国籍、1,500
              多所合作院校和六个目的地国家。这些数据均由公司披露，应视为方向性指标而非经审计数据；独立数据库只能部分佐证，公司也未披露当前员工数或估值修正后的估值。ApplyBoard 借外部认可强化可信度：2024 年
              Deloitte Technology Fast 50 Enterprise 榜单排名第 4，连续第六年上榜，Deloitte 称其三年收入增长接近
              800%。这些封面指标描绘出一家规模和品牌都不小的公司，但其增长故事正撞上加拿大监管急剧收紧的背景。
