      - number: '6.2'
        title: 证明点与学生结果
        blocks:
          - type: paragraph
            body: >-
              最差异化、也最可验证的客户证明点是结果质量：2024 年 ApplyBoard 学生学习许可获批率达到 82%，对比全国平均约 50%；公司还宣传申请成功率 95%。可核验的具名客户包括 Western
              University 和 Laurentian University 等院校，以及与 TD Bank 的标志性金融服务合作；TD 的 International Student GIC Program 使用
              ApplyProof 数字验证，RBC 和 TD 合作则为资金流程提供第三方可信度。学生证言语气热烈——把服务形容为「来自天堂的答案」，并把结果完全归功于
              ApplyBoard——但这些证言由公司筛选，并非独立来源。第三方评论网站覆盖很薄且访问受限，NPS
              等经审计满意度指标也未披露，因此公开证明偏宣传。买方应高度重视可验证的签证获批结果，把证言视为支持性而非决定性满意度证据，并在尽调中寻找独立访谈来确认院校情绪。
