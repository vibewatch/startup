      - number: '8.3'
        title: 情景与敏感性
        blocks:
          - type: paragraph
            body: >-
              情景分布很宽。牛市情景是，向英国、澳大利亚、爱尔兰和德国多元化恢复增长，并在长期学生流动增长支撑下，让 ApplyBoard 估值倍数回到峰值附近。基准情景是，一个稳定但结构性变小的
              ApplyBoard，价值约等于当前 US$0.8-1.0 billion 隐含价值；投资者情绪则被 OPM Wire 直白称作「debacle」。熊市情景是加拿大继续收缩、多元化失败，价值跌破 US$0.7
              billion，学习许可获批量处于十年低位成为最大下行驱动。估值对非加拿大走廊收入恢复和持续毛利率最敏感，因此多元化轨迹的小变化会大幅移动结果。RBCx
              债务融资是温和正面信号——即便股权标记下跌，贷款方仍提供信用——但它不能回答股权问题。因此，预期回报温和且靠后兑现，取决于 2026-2027 年能否出现多元化拐点。
            claimRefs:
              - CV019
              - CV020
              - CV021
              - CV022
              - CV023
              - CV034
              - CV035
              - CV036
