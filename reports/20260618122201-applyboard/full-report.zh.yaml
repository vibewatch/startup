      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >-
              单一创始家族高度集中，是 ApplyBoard 治理上最突出的特征。Meti Basiri 此前担任首席营销官，2022 年 8 月在创始 CEO Martin Basiri 卸任后接任首席执行官；兄弟
              Massi Basiri 担任总裁，负责产品和创新。David Borecky 是首席财务官，也是公司回应估值问题时的公开发声者。2022 年 8 月 CEO 交接处理得很低调，直到 2023 年 1
              月才公开披露，这一透明度缺口值得在治理尽调中记录。Martin Basiri 卸任后仍留任董事，随后休育儿假，并离开创办 Passage；该公司获得 C$40 million
              种子轮，用来解决加拿大技术工人短缺问题。三兄弟继续分布在高管和董事会角色中，带来明显的关键人和关联方考量，买方应对照股东协议和董事会构成逐项核验。
