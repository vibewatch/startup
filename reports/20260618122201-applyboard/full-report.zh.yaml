      - number: '8.4'
        title: 建议、触发条件与尽调
        blocks:
          - type: paragraph
            body: >-
              建议立场是在当前披露水平下跟踪 ApplyBoard，而不是交易。估值判断介于偏贵到合理之间：隐含 3-5x
              收入倍数只有在多元化奏效时才合理；整体风险评级高，主因是风险章节延续下来的外生监管暴露。打破论点的触发条件很具体——到 2027 年未能提高非加拿大收入占比，或 Bill C-2
              权力生效并实质性扰乱申请管道。优先尽调要求包括经审计收入、利润率和按走廊拆分的收入数据，以及支撑「数年现金」说法的现金、烧钱和跑道验证；没有经审计财务和干净股权表，就无法精确三角定位企业价值，二级交易是否接近隐含标记也不公开。把强
              franchise 质量与未解决披露和政策风险相抵后，整体投资评分为中等的 6.0/10。这一分数调和了一个强但已被重估的 franchise 与本报告通篇记录的风险。
