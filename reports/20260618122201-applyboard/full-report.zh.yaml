      - number: '7.4'
        title: 缓释、否决标准与监测
        blocks:
          - type: paragraph
            body: >-
              主要缓释手段是向英国、澳大利亚、爱尔兰和德国做地理多元化，把需求从加拿大分散出去，并借金融产品和数据工具更深变现现有院校关系。多元化本身也有执行风险，因为每条新走廊都有不断变化的签证制度，美国签证取消事件就是例子。结构性缓释因素是长期学生流动性增长；几十年来，该趋势向上，能部分抵消单一走廊冲击。承销时，一个合理的否决标准是：若上限持续，到
              2027 年仍未实质性降低加拿大收入占比；监测框架应把加拿大许可发放、走廊组合和 Bill C-2 生效状态作为领先指标。来自 IDP
              等公司的竞争风险真实存在，但次于政策驱动的需求收缩。总体风险画像偏高，但最关键特征是主要风险来自外部，而非 ApplyBoard 自身特殊问题；这会影响买方如何定价和监控该持仓。
