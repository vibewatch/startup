      - number: '3.4'
        title: 护城河、切换成本与竞争风险
        blocks:
          - type: paragraph
            body: >-
              ApplyBoard 的护城河更多来自院校合作伙伴广度和代理网络密度，而非专有技术。网络效应是真实存在的——更多院校吸引更多合作伙伴和学生，嵌入 ApplyBoard
              工具的代理切换成本随之上升——但并非不可攻破。招生代理常在多个竞争平台上多栖，削弱排他性和定价权；AI 驱动匹配也正在成为标配，稀释 ApplyBoard AI 叙事的先发优势。因此，最持久的竞争风险，是 AI
              能力商品化与代理多栖叠加；对抗它们的最强防线，是覆盖广度和可证明的签证获批结果。品牌强度提供更软但有意义的壁垒，连续六年 Deloitte Fast 50
              上榜和较正面的招生代理评论覆盖都在强化这一点。买方应判断：随着 AI 同质化扩散，ApplyBoard 的规模和品牌能否支撑利润率。实际防御性问题可压缩成两个测试：ApplyBoard
              能否让院校合作伙伴足够排他，以守住安置经济学；其签证获批结果能否在每个平台都采用类似 AI 工具后仍显著领先同行。公开证据无法给出答案，因此两项都应进入确认性尽调清单，并配合院校合作伙伴和代理的直接访谈。
