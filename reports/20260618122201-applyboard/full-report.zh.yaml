  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义与边界
        blocks:
          - type: paragraph
            body: >-
              ApplyBoard
              面向国际学生招生市场销售：也就是院校为吸引、筛选并录取跨境学生投入的支出，主要通过按学生收取安置费和相邻服务变现。纳入范围包括安置佣金、面向院校的平台订阅，以及招生合作伙伴工具；不包括本土招生、学费本身，也不包括
              2024 年规模约 $251 billion 的更广义 EdTech 学习软件类别。现状替代方案包括院校自有招生办公室和传统线下中介；相邻领域包括语言考试、学生金融和留学咨询。该市场嵌在 2025 年超过 640
              万名海外留学生的全球池子里。边界必须收紧，因为头部市场估算常把招生代理收入和相邻 EdTech 支出混在一起，导致第三方报告给出 $15.8 billion 到 $42.8 billion
              的宽区间。本次尽调中，相关可服务市场是 ApplyBoard 已运营合作伙伴网络的六个目的地国家。
            claimRefs:
              - CM004
              - CM016
