      - number: '1.3'
        title: 融资、估值与资本
        blocks:
          - type: paragraph
            body: >-
              ApplyBoard 于 2020 年 5 月成为独角兽，并在 2021 年 6 月完成 C$375 million Series D 轮，估值达到 C$4 billion，由 Ontario Teachers'
              Pension Plan Board 旗下 Teachers' Innovation Platform 领投，Fidelity、BDC Capital、Index Ventures、Harmonic、Garage
              Capital 和 Blue Cloud Ventures 参投。截至该轮交割，公司已从 31 名或更多投资者获得约 C$600 million 股权融资。2024 年 9 月，公司又从 RBCx 获得
              C$100 million 信贷额度——这是债务，不是股权——用于全球扩张和 AI，目标到 2030 年进入 20 个新市场。资本叙事在 2025 年初转负：Fidelity 基金标记显示，估值较 2021
              年峰值最多下跌 74%。CFO David Borecky 回应称「估值只是某个时点」，并表示公司资本充足，手头现金可支撑数年，也不需要融资。
