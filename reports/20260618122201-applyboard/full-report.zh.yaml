      - number: '2.3'
        title: 细分、买方与采用
        blocks:
          - type: paragraph
            body: >-
              市场按三条轴线切分：目的地地理、院校类型（大学、学院、语言和桥梁课程提供方）以及学生类型（本科、研究生、语言、桥梁课程）。院校是主要付费客户，按入学学生向平台付款；招生合作伙伴和代理则构成分发渠道，发起很大一部分需求。学生是终端用户，他们的信任、签证获批概率和切换成本，决定是否选择平台而非直接申请。多边结构意味着预算归院校掌握，但获客依赖合作伙伴和学生行为。数字平台替代线下中介，靠的是透明度、项目选择广度以及可证明更高的签证获批率；ApplyBoard
              正是在这些点上定位自身价值。弄清谁付钱、谁做决定，是后续评估定价权和持久性的基础。
