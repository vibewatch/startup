      - number: '6.4'
        title: 集中度风险与扩张
        blocks:
          - type: paragraph
            body: >-
              最核心客户风险是集中度。需求高度偏向赴加拿大学生，2024 年学习许可上限使获批量下降约 45%；2024 年底加拿大国际学生总数降至 997,820，同比低约 4%。ApplyBoard
              自己的调查显示，五分之四受访者在上限后认为加拿大吸引力下降——这是来自其自有客户的不利需求信号。少数高量来源走廊的集中，又放大了任何单一国家政策冲击。战略回应是向英国、澳大利亚、爱尔兰和德国做地理多元化，把客户需求从加拿大分散出去，同时通过金融产品和数据工具更深变现现有院校关系。上限后院校入学量是否恢复，目前仍没有证据；因此，2026
              年走廊级需求是任何潜在投资者最应跟踪的客户指标。
            claimRefs:
              - CU017
              - CU018
              - CU019
              - CU029
