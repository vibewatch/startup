      - number: '2.5'
        title: 展望与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              前景是一场多元化与收缩之间的拉扯。面对加拿大冲击，ApplyBoard 计划到 2030 年进入 20 个新留学目的地，并推出德国等非英语市场；同时继续发布第五份年度趋势报告，维持市场权威。但较 2021
              年峰值最多 74% 的估值修正，反映投资者正在重估一家加拿大增长引擎失速的公司。本章有两个核心尽调缺口：第三方报告无法对齐 ApplyBoard 精确细分市场的估算；新市场增长与加拿大损失相抵后，2026
              年净影响仍未量化。承销任何市场增长假设前，都应靠自下而上的安置费测算和 2026 年许可跟踪补上这两个缺口。市场仍然庞大且结构性增长，但短期加拿大集中度很高，没有公司特定数据时，不能安全套用自上而下的乐观叙事。
