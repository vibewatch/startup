companyProfile:
  summary: >-
    ApplyBoard Inc. 是一家私营 EdTech 公司，2015 年由三位伊朗裔加拿大兄弟 Martin、Meti 和 Massi Basiri 在安大略省 Kitchener 创立，目标是降低国际留学申请门槛。其 AI
    驱动平台连接学生、招生合作伙伴和六个目的地（加拿大、美国、英国、澳大利亚、爱尔兰和德国）的 1,500 多所高等院校；公司称已帮助来自 180 多个国籍的 150 多万名学生。ApplyBoard 于 2020 年成为独角兽，并在
    2021 年 6 月 Series D 轮达到 C$4 billion（约 US$3.2 billion）峰值估值；此后 Fidelity 基金标记显示，估值较峰值最多下跌
    74%。尽调的核心限制在于披露：作为私营公司，ApplyBoard 不公布经审计收入、利润率、各留学走廊收入结构或现金跑道，同时高度暴露于加拿大收紧国际学生政策的风险。
