  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值历史与当前标记
        blocks:
          - type: paragraph
            body: >-
              ApplyBoard 的估值在 2021 年 6 月 Series D 轮达到峰值 C$4 billion（约 US$3.2 billion）；该轮融资 C$375 million，由 Ontario
              Teachers' Pension Plan 领投。重估很早就开始：2022 年中 Fidelity 将其持股账面价值下调约 22.9%；到 2025 年 2 月，Fidelity
              基金标记显示估值较峰值最多下跌约 74%，对应当前股权价值约 US$840 million 至 US$1.04 billion。管理层予以反驳，CFO 称估值是「某个时点」，CEO 则指向 Deloitte
              Fast 50 第 4 名和约 800% 三年收入增长，并称公司资本充足、拥有数年现金、不需要融资。因此，核心反论点是 ApplyBoard 本质上是对单一监管者政策方向的杠杆押注；正向论点则是它是品类领先的
              AI 平台，能够整合碎片化招生市场。这一张力框定了后续估值讨论。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
