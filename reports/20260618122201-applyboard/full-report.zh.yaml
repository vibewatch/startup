      - number: '3.2'
        title: 竞争对手画像与规模
        blocks:
          - type: paragraph
            body: >-
              这一组公司在规模和披露上差异很大。IDP Education 是唯一经完整审计的基准，FY2025 收入约 AUD 882.2 million，同比下降约 15%，加拿大安置量下降约
              56%——这直接证明加拿大冲击是全行业问题，而非 ApplyBoard 独有。Shorelight、Keystone 和 Studyportals
              都是私营公司，收入披露很少；没有第三方数据库就无法精确排序市场份额。ApplyBoard 是资本充足的成长阶段挑战者，六国布局超过 Shorelight 的美国聚焦，也接近 IDP 的目的地广度；1,500
              多所院校合作伙伴则支撑其网络地位。本章最清晰的竞争信号，是上市 IDP 和私营 ApplyBoard 共同暴露于同一轮监管下行：即便品类领导者收入也在下滑，说明短期主导力量是监管波动，而不是竞争替代。
