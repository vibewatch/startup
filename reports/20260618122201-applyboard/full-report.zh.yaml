      - number: '6.3'
        title: 留存、复用与服务能力
        blocks:
          - type: paragraph
            body: >-
              留存必须放在双边结构里理解。学生端留存在结构上有限，因为多数学生只为一次入学旅程交易一次，生命周期价值来自单次漏斗，而不是反复使用。持久、复购的客户是院校和招生代理，他们的重复使用推动多个学生 cohort
              的收入；嵌入 GIC 金融产品则加深资金环节的参与度。服务能力需要观察：2022 年 11 月裁员明确打到客户体验部门，2025 年 6 月 150
              多人的裁撤覆盖加拿大和印度的客户面对团队，令人质疑需求下行期间的支持水平。独立满意度证据是这里最大的缺口，因为公司没有发布 NPS 或流失率，评论网站也稀疏。因此，cohort
              视角对院校和代理的意义，大于对一次性学生的意义。
            claimRefs:
              - CU020
              - CU021
              - CU026
              - CU027
              - CU028
              - CU035
