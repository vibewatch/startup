      - number: '7.3'
        title: 运营、合作伙伴与人员风险
        blocks:
          - type: paragraph
            body: >-
              政策之外，ApplyBoard 还承担一组常规但不轻的运营风险。供给端依赖第三方院校，院校流失会直接减少平台库存；需求端依赖招生代理，若申请质量差或存在欺诈，代理行为和质量会触发监管审查与声誉损害。与 RBC 和
              TD 的银行 GIC 合作价值很高，但也把金融产品依赖集中在少数机构。处理敏感签证和金融文件带来数据安全和隐私义务；AI
              驱动文件处理则引入模型错误或「静默失败」风险，前提是产品章节描述的置信度控制失效。人员和治理层面，2022、2024 和 2025 年三轮裁员——最后一轮明确与目的地政策变化有关——释放执行压力信号；2022
              年创始人向兄弟的 CEO 低调交接，以及 Basiri 三兄弟集中的家族控制，也是关键人和治理考量。这些风险大多可由管理层控制，严重性低于外生政策风险。
