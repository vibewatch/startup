  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              监管和法律风险是 ApplyBoard 最大的单一暴露，因为需求直接取决于政府学习许可和签证政策，而这些政策正在收紧。加拿大 2024 年上限把新学习许可压到 267,890 份，较 2023 年下降
              48%，且远低于 IRCC 目标；2025 年发放量继续大幅下滑。该上限已延长至 2026 年，额度约低于 2024 年水平 10%，逆风被拉长。更严格的 PGWP 资格和每周 24
              小时工作上限，进一步削弱加拿大相对吸引力。叠加其上的，是加拿大 Bill C-2《Strong Borders
              Act》；该法案将赋予暂停、取消或中止移民文件和在途申请的权力，直接威胁管道确定性，也释放更广泛政治收紧信号。多元化目的地也并非无风险：美国 2025
              年学生签证取消量翻倍，使其短期替代可靠性不足。买方必须首先承销这些外生政策力量，因为它们已经在兑现，而非假设风险。
            claimRefs:
              - CR001
              - CR002
              - CR036
              - CR003
              - CR004
              - CR005
