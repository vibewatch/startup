      - number: '2.2'
        title: 市场规模与增长
        blocks:
          - type: paragraph
            body: >-
              给这个市场定规模需要多重视角，因为没有单一报告能干净匹配 ApplyBoard 的细分位置。2024-2025 年招生市场估算集中在 $15.8 billion 到 $42.8 billion，预计到 2030
              年代初 CAGR 为 8.6% 到 10.2%；更广义 EdTech 类别则提供接近 $251 billion 的外沿上限。底层需求驱动来自超过 640 万人的全球流动学生池，其中亚太贡献约 41.2%
              的市场收入。ApplyBoard 用自己的说法强化牛市叙事：学生流动性每十年翻一番，并指向 Deloitte 截至 2024 年认可的近 800%
              三年收入增长。主要保留意见在方法论：定义把代理收入、安置费和软件支出揉在一起，因此 ApplyBoard 可辩护的 SAM 和 SOM 应从安置经济学自下而上重建，而不是直接借用任何一个自上而下数字。
