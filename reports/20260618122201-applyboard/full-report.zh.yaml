  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品套件与工作流
        blocks:
          - type: paragraph
            body: >-
              ApplyBoard 销售一套 AI 驱动平台，覆盖完整国际留学旅程：项目发现、AI 匹配、申请提交、文件处理，以及超过 150,000 个项目的状态跟踪，并宣称申请成功率
              95%。核心平台周围是一套广泛产品：TrainHub 用于招生顾问培训（2022 年 3 月以 Panda Portal 名义收购）、ApplyProof 用于数字 GIC 证书验证、360 Solutions
              覆盖从申请到抵达的组合服务、ApplyInsights 提供市场情报，以及与 RBC 和 TD 合作交付的金融服务 GIC 产品。对话层是 Abbie，2024 年 6 月上线，被称为全球首个留学 AI
              顾问，是一个基于 GPT 的多语言聊天机器人。学生端流程是发现、匹配、申请、验证和抵达；院校端获得托管式入站生源管道；代理端则是配套工具的分发渠道。这种广度是产品的核心强项，也框定了后续架构和差异化分析。
