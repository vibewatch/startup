      - number: '7.2'
        title: 集中度与财务风险
        blocks:
          - type: paragraph
            body: >-
              政策风险之所以咬得这么深，是因为集中度。收入偏向赴加拿大入学，而 ApplyBoard
              按入学收取费用，许可下滑几乎会直接传导为收入下滑——IRCC「清算」叙事正好描述了这条传导。按目的地走廊拆分的收入比例没有披露，这是重大尽调缺口，但方向性暴露很清楚。财务上，估值已较 2021
              年峰值大幅下跌；如果下行持续，融资和士气风险都会上升。公司称有数年现金跑道，但公开来源无法独立验证。风险链条从政策传导到许可量、再到单次入学收入、员工规模，最终传导到估值；这也是三轮裁员都跟随政策环境恶化发生的原因。因此，测算加拿大收入占比并确认现金跑道，是买方应要求的两项最有价值的私有证据。
            claimRefs:
              - CR009
              - CR010
              - CR020
              - CR029
              - CR030
              - CR031
              - CR037
              - CR038
              - CR039
