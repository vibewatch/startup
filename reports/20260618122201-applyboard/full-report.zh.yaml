chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              ApplyBoard Inc. 是一家位于安大略省 Kitchener-Waterloo 的公司，成立于 2015 年，运营一个 AI 驱动平台，连接国际学生、高等院校和招生合作伙伴。三位伊朗裔加拿大兄弟
              Martin、Meti 和 Massi Basiri 曾亲历留学申请中的摩擦，因此创办 ApplyBoard
              来拆掉这些门槛。公司自成立以来反复强调的使命，是让全球教育更容易获得。平台如今覆盖六个留学目的地、1,500 多所合作院校和 150,000
              多个项目，主要靠院校按学生支付安置费变现，同时叠加考试服务商和金融服务合作。ApplyBoard 仍是一家总部位于 Kitchener 101 Frederick Street 的私营成长阶段独角兽，曾释放长期
              IPO 意向，但没有承诺时间表。本章先确立公司身份、领导层、资本结构、封面指标和里程碑轨迹，为后续尽调搭底。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO019
              - CO020
              - CO033
