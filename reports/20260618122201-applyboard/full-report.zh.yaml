      - number: '3.3'
        title: 能力与定价对比
        blocks:
          - type: paragraph
            body: >-
              能力层面，招生平台比拼的是院校覆盖广度、签证获批结果和代理工具质量。ApplyBoard 的差异化在于跨六个目的地的 AI 原生匹配、其宣传的 82% 学生签证获批率（约高于加拿大全国平均 32
              个百分点），以及由 TrainHub 培训工具强化的招生合作伙伴网络。IDP 用全球规模和 IELTS 所有权反击，后者是 ApplyBoard 不具备的考试收入流；ApplyBoard 则通过 RBC 和 TD
              GIC 合作叠加金融服务变现，而同行对此强调较少。行业定价主要由院校支付的单次安置佣金主导，公开费率卡披露有限；IDP 还叠加 IELTS 考试费以实现多元化。实际结果是，正面对比必须把 ApplyBoard
              的广度和结果主张，与 IDP 的规模和收入多元化放在一起衡量；私营对手则占据更窄的地域或价值链生态位。
