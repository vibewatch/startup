      - number: '1.5'
        title: 里程碑与轨迹
        blocks:
          - type: paragraph
            body: >-
              ApplyBoard 十一年轨迹，从加拿大驱动的快速上升，转入更防守、更依赖多元化的阶段。2015 年创立后，公司迅速扩张，2020 年成为独角兽，2021 年估值达到 C$4 billion，并连续拿下
              Deloitte Fast 50 席位。2022 年之后，轨迹开始复杂：CEO 悄然更换；2022 年 11 月客户体验团队裁员 6%；2024 年 9 月获得 RBCx 融资的同时裁员 4%；2025 年 6
              月又裁撤 150 多人，公司归因于主要留学目的地政策变化。产品里程碑——2022 年 3 月收购 TrainHub、2024 年 6 月推出 Abbie AI 顾问、2025 年 1
              月把德国作为首个非英语市场上线——显示公司在主动应对加拿大 2024 年学生上限带来的逆风，该上限导致学习许可获批量约下滑 45%。里程碑记录同时呈现真实品类领导力和不断累积的执行压力。
