        title: 披露姿态与收入
        blocks:
          - type: paragraph
            body: >-
              ApplyBoard 是私营公司，不发布经审计财务报表，因此收入图景只能从项目申报、第三方追踪器和管理层评论中拼出。最强公开信号是 Deloitte 认可其截至 2024 年三年收入增长接近 800%，但这是
              Fast 50 项目数据，不是经审计披露。行业追踪器估算 2025 年 ARR 接近 $210 million，收入接近 $295 million，二者相差约 $85
              million，本身就说明外部估算不可靠。底层收入模式是院校按入学学生支付安置费，并由考试服务商合作、面向院校的 SaaS 工具，以及 RBC 和 TD 带来的金融服务 GIC
              费用收入补充。加拿大许可下降直接打到最大收入通道——安置量——使未经审计的增长叙事更难向前外推。因此，收入质量仍是开放问题，只有公司提供的经审计数据才能解决。
