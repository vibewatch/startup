      - number: '8.2'
        title: 收入基础与可比公司
        blocks:
          - type: paragraph
            body: >-
              没有公开的一手财务报表，因此所有基于收入的估值都建立在第三方估算上：追踪器把 2025 年 ARR 放在约 US$210 million，收入约 US$295
              million；这个未解决的冲突本身就会撬动倍数。相对 US$0.8-1.0 billion 的隐含价值，该收入基础对应约 3-5x 收入。最接近的公开可比公司是 IDP Education，这家 ASX
              上市的安置与 IELTS 集团 FY2025 收入约 A$882 million，同比下降约 15%，其股价和倍数也被压缩——这清楚说明整个行业正在被重估，而不只是
              ApplyBoard。公开安置同行目前以较低收入倍数交易，反映政策驱动的下行。可寻址背景仍然很大——约 US$250 billion 的 EdTech 市场和 US$16-43 billion
              的国际招生市场——如果学生流动性恢复长期增长，可支撑建设性的终值案例。财务基础是最弱一环，因此调和相互冲突的估算，是优先尽调项。
