  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局
        blocks:
          - type: paragraph
            body: >-
              ApplyBoard 所处竞争格局分层明显，从上市全球老牌公司，到私营细分玩家、发现门户和线下现状方案。最强的直接竞争对手是 IDP Education，这家 ASX 上市公司覆盖约 74 个国家，把学生安置与
              IELTS 英语考试共同所有权结合起来。Shorelight 是 2013 年成立、聚焦美国的私营对手，核心是深度大学合作；Studyportals 和 Keystone Education Group
              则在项目发现上游竞争，而不是在安置环节正面对打。CIBT 等较小区域玩家相邻经营加拿大移民和语言服务。British Council 位置特殊，既是 IELTS 考试提供方，也是 ApplyBoard
              合作伙伴。最重要的非平台替代方案仍是院校直接招生办公室。竞争类型如此宽，意味着 ApplyBoard 必须同时防守多条战线，单一对比都无法完整刻画其位置。
