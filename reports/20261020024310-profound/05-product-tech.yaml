  - id: "TE003"
    title: "Functional technology and operating architecture"
    columns: ["Layer/process", "Observed role", "Dependency", "Principal risk"]
    rows:
      - ["Prompt inputs", "Combines customer-defined prompts with a stated real-world query dataset", "Prompt taxonomy, market/language configuration, and demand-data provenance", "Biased or stale prompt sets can misstate visibility"]
      - ["Answer capture", "Runs tracked prompts daily and states that responses are captured from browser experiences", "Continued access to changing answer-engine interfaces", "Personalization, interface changes, and sampling variance may reduce comparability"]
      - ["Analysis", "Calculates visibility, share of voice, sentiment, citations, factual claims, and competitor differences", "Stable entity resolution, scoring definitions, and retained response history", "Opaque scoring or taxonomy drift can impair trend interpretation"]
      - ["Crawler and referral analytics", "Uses server logs and infrastructure integrations to inspect AI crawler and referral activity", "Customer log access, bot classification, analytics connectors, and privacy controls", "Spoofed agents, incomplete logs, or attribution error may distort conclusions"]
      - ["Action layer", "Agents create or optimize content against identified gaps", "Credits, approved knowledge, human review, and publishing workflow", "Generated work may be inaccurate or fail to influence third-party citations"]
    notes: "This table maps publicly described functions and dependencies; it does not claim knowledge of Profound's undisclosed internal implementation."
    claimRefs: ["CE002", "CE003", "CE004", "CE005", "CE006", "CE010", "CE012"]
