  topStrengths:
    - >-
      Broad enterprise workflow spans monitoring, citation analysis, benchmarking, recommendations, and agent-assisted
      action.
    - >-
      The $180 million Series D and rapid prior-round step-up demonstrate strong investor sponsorship and category
      interest.
    - >-
      Company-reported revenue tripling over six months and more than 1,000 enterprise customers indicate substantial
      potential scale if reconciled to primary records.
  topRisks:
    - >-
      The $1.8 billion financing mark cannot be tested against audited ARR, retention, gross margin, customer
      concentration, or common-equity terms.
    - >-
      More than 650 listed AEO solutions and Semrush's higher observed G2 Score create material bundling, pricing, and
      differentiation pressure.
    - >-
      Custom pricing and changing 2026 packaging obscure realized contract value, acquisition efficiency, renewal
      quality, and expansion economics.
    - >-
      Product value depends on changing answer engines and on customers having the staff and workflow discipline to
      convert monitoring into outcomes.
  unresolvedGaps:
    - >-
      Audited monthly ARR and revenue bridges, gross margin, GRR/NRR, churn, cohort expansion, CAC, payback, and
      realized contract pricing.
    - >-
      Current unrestricted cash, monthly burn, debt and fixed obligations, use-of-funds reconciliation, runway, and
      next-round trigger.
    - >-
      Fully diluted cap table, option pool, preference stack, anti-dilution rights, secondary transactions, and Series D
      security terms.
    - >-
      Customer concentration, contract duration, renewal history, production deployment scope, and independently
      verified outcome evidence.
    - >-
      Complete C-suite and board roster, investor governance rights, delegated authority, founder employment terms, and
      succession planning.
    - >-
      SOC 2 report scope, DPA and subprocessors, incident history, penetration testing, cyber insurance, and tested
      RPO/RTO commitments.
