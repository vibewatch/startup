summary:
  headline: >-
    Profound has credible enterprise product breadth and exceptional financing momentum, but its $1.8 billion mark is
    stretched against public evidence that omits audited recurring revenue, retention, margins, and security-level
    economics.
  overallScore: 6.5
  recommendation: research-more
  confidence: medium
