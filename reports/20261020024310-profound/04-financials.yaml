schemaVersion: "report-v2"
artifact: financials
slug: profound
runDate: 2026-10-20
company:
  name: Profound
chapter:
  number: 4
  title: Financials
  summary: >-
    Public evidence supports an enterprise software monetization model built around a short
    trial and custom-priced deployment, but the reported packaging changed during 2026 and
    no assigned source discloses realized revenue, ARR, retention, gross margin, burn, cash,
    or runway. The financing record demonstrates access to capital, not capital adequacy,
    leaving revenue quality and forward funding needs as material underwriting blockers.
sections:
  - id: revenue-model
    title: Revenue model and packaging
    body: >-
      Profound appears to monetize a vertically integrated AI-visibility platform rather
      than a single monitoring feature. Its official product materials describe prompt
      monitoring, answer-engine visibility, citation tracking, competitive benchmarking,
      and agent-driven recommendations, while independent reviews describe a time-limited
      trial followed by a sales-led Enterprise contract. This supports a recurring
      enterprise-software revenue hypothesis, but the public record reviewed here does not
      disclose contract duration, minimum commitment, usage overages, professional-services
      fees, or revenue-recognition policy. The distinction matters: feature breadth can
      support willingness to pay, yet it does not reveal realized price, recurring mix, or
      the portion of delivery that depends on strategists and engagement support.
    claimRefs: [CI001, CI007, CI008, CI009]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: pricing-and-gtm
    title: Pricing evidence and go-to-market implications
    body: >-
      Pricing evidence is internally time-sensitive and externally inconsistent. AEO Labs
      reports that, by October 2026, the public pricing surface had reverted to a free
      seven-day Trial and custom Enterprise pricing, with earlier $99 Starter and $399
      Growth tiers removed. Other 2026 reviews captured materially different snapshots,
      including a $499 Lite plan and the earlier $99/$399 structure. The defensible
      interpretation is not a single durable list price but an evolving packaging strategy
      that has shifted toward qualification and negotiated contracts. That may improve
      enterprise price discrimination, while also increasing sales-cycle friction and
      making CAC, discounting, implementation effort, and sales efficiency impossible to
      estimate without the company’s cohort and pipeline data.
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI006]
    tableRefs: [TI002]
  - id: economics-and-traction
    title: Unit economics, cost structure, and traction gaps
    body: >-
      The assigned evidence describes substantial data collection, daily prompt execution,
      crawler analytics, integrations, security controls, and enterprise support. These
      activities identify plausible cost drivers across model or browser execution,
      infrastructure, data acquisition, onboarding, support, and content-agent workloads,
      but no source quantifies any cost pool. Nor does the source set disclose ARR,
      recognized revenue, gross margin, net revenue retention, churn, CAC, payback, or
      customer concentration. Product-scale claims such as prompt datasets or tracked
      activity are operating indicators, not revenue. Consequently, neither software-like
      gross margins nor efficient growth can be assumed; both require management reporting
      reconciled to audited or board-approved financial statements.
    claimRefs: [CI010, CI011, CI012, CI013, CI014]
    tableRefs: [TI003]
  - id: capital-adequacy
    title: Capital adequacy and financial verdict
    body: >-
      AEO Analytics reports $154.5 million of cumulative funding, including a $96 million
      Series C at a $1 billion valuation in 2026. That history indicates financing access,
      but funding raised is not cash available and cannot establish runway. None of the
      assigned sources reports cash on hand, monthly net burn, debt or credit facilities,
      working-capital needs, planned use of funds, or a next-round trigger. The financial
      verdict is therefore evidence-constrained: packaging suggests enterprise recurring
      revenue potential, but revenue quality, margin path, capital intensity, and financing
      dependency remain un-underwritable. Diligence should prioritize a monthly financial
      pack, customer and contract cohorts, cloud and data costs, service-delivery labor, and
      a downside runway bridge before relying on the headline valuation.
    claimRefs: [CI015, CI016, CI012, CI013, CI014]
tables:
  - id: TI001
    title: Revenue streams and monetization mechanisms
    columns: [Stream, Mechanism, Unit, Public status, Revenue quality, Diligence ask]
    rows:
      - [Enterprise platform subscription, "Custom negotiated contract", "Company or workspace; exact basis undisclosed", "Currently described as custom-priced Enterprise", "Potentially recurring, but contract term and realized price are unavailable", "Provide ARR by contract cohort, term, seats, prompts, engines, and geography"]
      - [Trial conversion, "Free seven-day product evaluation", "50 prompts run daily during trial", "Three engines reported for the current Trial", "Acquisition mechanism rather than revenue", "Provide trial starts, product-qualified leads, conversion rate, cycle, and conversion CAC"]
      - [Agents and workflow functionality, "Included platform capability or separately packaged feature; public treatment unclear", "Usage, seat, or contract inclusion not disclosed", "Official materials show agent-driven recommendations and workflows", "Could deepen expansion, but monetization and delivery cost are unknown", "Provide attach rate, usage limits, incremental price, and model-compute cost"]
      - [Enterprise support and security, "Negotiated enterprise package", "Account or contract; exact basis undisclosed", "Reviews describe SSO/SAML, SOC 2, API access, and enterprise support", "May support premium pricing but can add service labor", "Separate subscription revenue from onboarding, support, and professional services"]
    notes: >-
      Mechanisms are evidence-backed packaging observations, not reported revenue streams;
      realized price, accounting treatment, mix, and recurring status require company data.
    claimRefs: [CI001, CI007, CI008, CI009]
  - id: TI002
    title: Pricing and packaging snapshots during 2026
    columns: [Evidence snapshot, Trial or entry tier, Growth or mid tier, Enterprise, Interpretation]
    rows:
      - ["AEO Labs, current-state review", "Free; 50 prompts daily for 7 days on three engines", "No public paid middle tier shown", "Custom quote; up to nine engines reported", "Latest reviewed snapshot indicates a sales-led model"]
      - ["Chloevolution review", "$499/month Lite; 15% annual discount", "Not reported", "Custom quote", "Conflicts with both earlier $99 entry pricing and the later trial-only entry"]
      - ["Nick Lafferty, August 2026", "$99/month Starter", "$399/month Growth", "Custom pricing", "Personal review captured a lower-priced self-serve structure"]
      - ["Rankability, mid-2026 snapshot", "$99/month Starter billed annually", "$399/month Growth billed annually", "Custom pricing", "Earlier snapshot confirms that public tiers existed during 2026"]
    notes: >-
      These are dated or undated public list-price snapshots from different reviewers, not
      realized customer pricing; packaging appears to have changed during 2026.
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI006]
  - id: TI003
    title: Unit economics and capital-adequacy underwriting matrix
    columns: [Metric, Public value, Confidence, Why it matters, Diligence ask]
    rows:
      - [ARR and recognized revenue, null, Low, "Core denominator for growth and valuation", "Monthly ARR, GAAP revenue, bookings, and deferred revenue for 24 months"]
      - [Gross margin, null, Low, "Tests whether data, model, browser, and service costs scale like software", "Gross margin bridge by hosting, data, model, support, and professional-services cost"]
      - [Net revenue retention and churn, null, Low, "Measures durability and expansion of contracted revenue", "Logo and dollar retention by segment, cohort, and plan"]
      - [CAC and payback, null, Low, "Tests sales-led efficiency after packaging moved toward custom contracts", "Fully loaded CAC, sales cycle, win rate, and payback by segment"]
      - [Cash and monthly net burn, null, Low, "Determines actual financing runway", "Current unrestricted cash and trailing 12-month cash-flow statement"]
      - [Debt and fixed obligations, null, Low, "May reduce effective liquidity or add covenants", "Debt schedule, leases, cloud commitments, and covenant headroom"]
      - [Reported cumulative funding, "$154.5M", Medium, "Shows access to external capital, not cash availability", "Reconcile proceeds to cash uses, secondary transactions, and current balance"]
      - [Runway and next-round trigger, null, Low, "Frames dilution and financing dependency", "Base and downside monthly runway through the next operating milestone"]
    notes: >-
      Null means the metric was not disclosed in the eight assigned sources reviewed for this
      chapter; cumulative funding is third-party reported and must not be treated as cash.
    claimRefs: [CI010, CI011, CI012, CI013, CI014, CI015, CI016]
figures:
  - id: FI001
    title: Evidence-bounded monetization flow
    type: flow
    summary: >-
      Public evidence shows a trial-to-enterprise packaging sequence, while realized revenue,
      delivery cost, and gross profit remain undisclosed.
    data:
      nodes:
        - id: evaluation
          label: Seven-day Trial
          value: "50 prompts daily"
          detail: "Reported across ChatGPT, Gemini, and Google AI Overviews"
        - id: qualification
          label: Enterprise qualification
          value: "Sales-led"
          detail: "Paid deployment requires a custom quote"
        - id: contract
          label: Enterprise contract
          value: "Realized price unavailable"
          detail: "Term, discounts, seats, usage limits, and service fees are not public"
        - id: platform-use
          label: Recurring platform use
          value: "Daily prompt runs"
          detail: "Up to nine answer engines and API access are reported for Enterprise"
        - id: delivery-cost
          label: Delivery and support cost
          value: "Unavailable"
          detail: "Compute, data, infrastructure, onboarding, and strategist labor are not quantified"
        - id: gross-profit
          label: Gross profit
          value: "Unavailable"
          detail: "No public revenue or gross-margin disclosure supports a calculated bridge"
    approximationNotes: >-
      This is a qualitative sequence, not a value-proportional funnel or cumulative financial
      bridge; no conversion rate, contract value, delivery cost, or gross profit is estimated.
    claimRefs: [CI001, CI009, CI011, CI014]
callouts:
  - calloutType: risk
    title: Funding is not runway
    body: >-
      The reported $154.5 million financing total does not establish current cash, burn, debt,
      or months of runway; a use-of-funds and liquidity bridge is required.
    claimRefs: [CI015, CI016]
  - calloutType: recommendation
    title: Underwrite contracts before the valuation
    body: >-
      Request contract cohorts, realized pricing, retention, delivery costs, and a monthly
      runway model before applying a recurring-revenue multiple.
    claimRefs: [CI012, CI013, CI014, CI016]
