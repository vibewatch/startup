  topStrengths:
    - 企业级工作流覆盖监测、引用分析、基准比较、推荐和智能体辅助执行。
    - $180M 的 Series D 以及前几轮估值的快速上调，体现出投资者的强力支持和对这一品类的浓厚兴趣。
    - 公司称收入在六个月内增长至三倍、企业客户超过 1,000 家；若能与一手记录对账，这说明其具备相当的规模潜力。
  topRisks:
    - $1.8B 融资估值无法用经审计 ARR、留存率、毛利率、客户集中度或普通股条款进行检验。
    - 市面上列出的 AEO 解决方案超过 650 个，且 Semrush 观测到的 G2 Score 更高，给产品捆绑、定价和差异化带来明显压力。
    - 定制化定价和不断变化的 2026 年产品套餐，使实际合同价值、获客效率、续约质量和扩张经济性难以看清。
    - 产品价值取决于不断变化的答案引擎，也取决于客户是否有足够人手和工作流纪律把监测结果转化为成果。
  unresolvedGaps:
    - 经审计的月度 ARR 和收入桥接表、毛利率、GRR/NRR、流失率、分 cohort 扩张、CAC、回本周期及实际合同定价。
    - 当前无限制现金、月度烧钱、债务和固定负债、资金用途对账、现金 runway 及下一轮融资触发条件。
    - 完全摊薄口径的股权结构表、期权池、优先股堆叠、反稀释权、老股交易及 Series D 证券条款。
    - 客户集中度、合同期限、续约历史、生产环境部署范围及经独立验证的成果证据。
    - 完整的 C-suite 和董事会名单、投资者治理权、授权范围、创始人雇佣条款及继任规划。
    - SOC 2 报告范围、DPA 和子处理方、事故历史、渗透测试、网络保险及经过测试的 RPO/RTO 承诺。
