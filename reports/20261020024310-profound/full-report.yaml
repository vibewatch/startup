        - id: reported-scale
          label: Reported scale
          detail: >-
            Sources repeat more than 1,000 enterprise customers and revenue tripling over six months as company-reported
            figures.
        - id: missing-denominators
          label: Missing denominators
          detail: Audited ARR, retention, margin, cohort, and concentration data are unavailable in the retained evidence.
        - id: financing-mark
          label: Financing mark
          detail: $180M Series D at $1.8B followed a $96M Series C at $1.0B roughly seven months earlier.
        - id: downside-tests
          label: Downside tests
          detail: Custom pricing, lower-cost alternatives, and a crowded category challenge multiple durability.
        - id: recommendation
          label: Research-more
          detail: Require primary financial, cap-table, preference, and return evidence before investing.
    approximationNotes: >-
      The sequence is analytical and not value-proportional; it does not assign scenario probabilities or a fair-value
      range.
