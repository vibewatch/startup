  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The investable market should be bounded as software that monitors and improves how brands appear in
              AI-generated answers, including prompt monitoring, answer-engine visibility, citation tracking,
              competitive benchmarking, and recommendations. Profound's own walkthrough confirms that functional
              perimeter. It should not be sized as all search advertising, all SEO software and services, or all content
              production: those are adjacent budget pools, not equivalent products. Managed AEO execution, legacy SEO
              suites with AI modules, public self-serve trackers, and manual prompt testing are complements or
              substitutes depending on the buyer's operating model. This distinction matters because monitoring software
              does not itself earn citations or publish the work needed to change measured visibility.
            claimRefs:
              - CM005
              - CM013
              - CM014
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM013
              - CM014
              - CM015
      - number: '2.2'
        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              Available evidence establishes scale in the surrounding search economy, not a standalone AEO-software
              market. The DataStory reports an estimated $190 billion of U.S. search-ad spending in 2025, equal to 33%
              of U.S. digital advertising, and cites an estimate of roughly $100 billion per year for SEO software and
              services. It also reports AI platforms at about 1% of website referral traffic and relays a Gartner
              forecast that traditional search will fall 25%, but the article does not state that forecast's horizon.
              These figures use different denominators and cannot be stacked into TAM, SAM, and SOM. They are demand and
              substitution signals only. A defensible sizing model still requires category revenue, enterprise contract
              values, buyer counts, and adoption rates.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM002
