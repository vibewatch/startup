              - CP007
              - CP008
              - CP009
              - CP010
              - CP015
      - number: '3.3'
        title: Packaging can outweigh feature leadership
        blocks:
          - type: paragraph
            body: >-
              The latest retained review reports that Profound had returned to a sales-led structure by October 2026: a
              seven-day trial and custom Enterprise pricing replaced the self-serve Starter and Growth tiers shown
              earlier in the year. Other 2026 sources still quote entry prices between $82.50 and $99 per month and a
              $332.50 to $399 Growth tier, so those numbers are historical or conflicting rather than a reliable current
              rate card. This opacity strengthens lower-friction rivals during initial evaluation and makes realized
              contract economics a diligence gap. Switching costs can still grow once teams accumulate prompt histories,
              reporting conventions, connectors, governance approvals, and content workflows. Multi-homing is
              structurally likely because Profound is not a full traditional SEO replacement, leaving buyers to keep an
              SEO suite while adding AEO measurement or to combine a monitor with internal execution.
            claimRefs:
              - CP003
              - CP004
              - CP008
              - CP012
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP011
              - CP014
      - number: '3.4'
        title: Competitive verdict and diligence priorities
        blocks:
          - type: paragraph
            body: >-
              Profound appears strongest where the customer needs enterprise governance, broad answer-engine coverage,
              deep diagnostic data, and workflows that connect measurement to action. Its moat is less durable for
              buyers who need only visibility reporting, because Peec, Otterly, HubSpot, and SEO-suite add-ons can
              satisfy narrower jobs with simpler adoption or familiar distribution. The adverse case is gradual
              commoditization: monitoring metrics converge, incumbents bundle acceptable features, and agencies or
              internal teams supply the optimization layer. The upside case requires Profound's prompt-demand corpus,
              crawler intelligence, and agentic integrations to produce measurably better decisions and retention.
              Before underwriting durability, diligence should obtain a current official rate card, cohort-level
              win/loss and churn by competitor, a common-prompt accuracy benchmark, connector usage, time-to-value, and
              customer evidence separating software contribution from agency or content execution.
            claimRefs:
              - CP001
              - CP003
              - CP005
              - CP007
              - CP008
              - CP009
              - CP012
              - CP013
              - CP015
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Enterprise depth is the clearest differentiation
            body: >-
              Profound combines visibility, citations, competitive monitoring, prompt-demand data, crawler analytics,
              and action workflows in one enterprise-oriented platform, although most superiority evidence in the pool
              is company- or competitor-issued.
            calloutType: strength
            claimRefs:
