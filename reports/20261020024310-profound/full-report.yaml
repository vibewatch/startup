              - CM003
              - CM004
              - CM009
              - CM010
      - number: '2.3'
        title: Buyer, user, and payer segmentation
        blocks:
          - type: paragraph
            body: >-
              The core economic buyer is a CMO, VP of Marketing, or Head of Digital Marketing accountable for
              discoverability and budget allocation; daily users are SEO, content, PR, analytics, and demand-generation
              teams. The DataStory describes a second primary user in the content or SEO lead who decides what to
              publish and how to optimize it. Independent and commercially adjacent reviews converge on strongest fit
              among growth-stage companies, enterprises, and agencies, while smaller teams face a weaker fit when they
              need inexpensive self-service coverage or lack staff to act on recommendations. The payer is therefore
              normally the marketing organization, but adoption requires an explicit workflow owner rather than a
              passive dashboard buyer.
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM010
              - CM012
