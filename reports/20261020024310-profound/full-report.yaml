      - number: '2.4'
        title: Drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Adoption is driven by the migration of product discovery into AI answers, the loss of click-through
              visibility, and the need to compare brand presence across engines using repeatable data rather than manual
              prompts. Constraints are equally material: Profound returned to custom enterprise pricing by October 2026,
              its short trial cannot demonstrate month-over-month movement, and benefits depend on content,
              communications, or agency capacity outside the measurement layer. Category crowding is also rapid: Blastra
              counted more than 650 G2 AEO listings on October 4, 2026 and placed Semrush ahead of Profound by G2 Score.
              Valuation should therefore reflect a potentially important new analytics category, but not capitalize the
              entire adjacent search economy or assume early category leadership guarantees durable share.
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
              - CM016
