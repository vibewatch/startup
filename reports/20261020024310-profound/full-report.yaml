              - CI013
              - CI014
              - CI015
              - CI016
      - number: '4.4'
        title: Capital adequacy and financial verdict
        blocks:
          - type: paragraph
            body: >-
              AEO Analytics reports $154.5 million of cumulative funding, including a $96 million Series C at a $1
              billion valuation in 2026. That history indicates financing access, but funding raised is not cash
              available and cannot establish runway. None of the assigned sources reports cash on hand, monthly net
              burn, debt or credit facilities, working-capital needs, planned use of funds, or a next-round trigger. The
              financial verdict is therefore evidence-constrained: packaging suggests enterprise recurring revenue
              potential, but revenue quality, margin path, capital intensity, and financing dependency remain
              un-underwritable. Diligence should prioritize a monthly financial pack, customer and contract cohorts,
              cloud and data costs, service-delivery labor, and a downside runway bridge before relying on the headline
              valuation.
