  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: A crowded market organized around buyer maturity
        blocks:
          - type: paragraph
            body: >-
              Buyers can solve the AI-visibility job through purpose-built AEO platforms, extensions to an existing SEO
              or marketing suite, lighter monitoring tools, agency-supported workflows, or manual prompt checks and
              internal dashboards. Profound's own guide names nineteen platforms, so category leadership should not be
              confused with an uncontested market. The practical segmentation is by operating model: regulated
              enterprises may value broad engine coverage, governance, integrations, and dedicated support, while
              smaller teams and agencies can favor fast onboarding, published entry pricing, and focused monitoring.
              Status-quo spreadsheets and internal scripts remain credible for narrow prompt sets, although they must
              recreate scheduling, normalization, citation history, and reporting. The evidence base is directionally
              useful but interested: official comparisons, competing vendors, and agencies dominate, with no independent
              head-to-head product benchmark in the assigned corpus.
            claimRefs:
              - CP002
              - CP005
              - CP006
              - CP007
              - CP010
              - CP011
              - CP014
              - CP015
