      - number: '4.3'
        title: Unit economics, cost structure, and traction gaps
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence describes substantial data collection, daily prompt execution, crawler analytics,
              integrations, security controls, and enterprise support. These activities identify plausible cost drivers
              across model or browser execution, infrastructure, data acquisition, onboarding, support, and
              content-agent workloads, but no source quantifies any cost pool. Nor does the source set disclose ARR,
              recognized revenue, gross margin, net revenue retention, churn, CAC, payback, or customer concentration.
              Product-scale claims such as prompt datasets or tracked activity are operating indicators, not revenue.
              Consequently, neither software-like gross margins nor efficient growth can be assumed; both require
              management reporting reconciled to audited or board-approved financial statements.
            claimRefs:
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
          - type: table
