      - number: '4.2'
        title: Pricing evidence and go-to-market implications
        blocks:
          - type: paragraph
            body: >-
              Pricing evidence is internally time-sensitive and externally inconsistent. AEO Labs reports that, by
              October 2026, the public pricing surface had reverted to a free seven-day Trial and custom Enterprise
              pricing, with earlier $99 Starter and $399 Growth tiers removed. Other 2026 reviews captured materially
              different snapshots, including a $499 Lite plan and the earlier $99/$399 structure. The defensible
              interpretation is not a single durable list price but an evolving packaging strategy that has shifted
              toward qualification and negotiated contracts. That may improve enterprise price discrimination, while
              also increasing sales-cycle friction and making CAC, discounting, implementation effort, and sales
              efficiency impossible to estimate without the company’s cohort and pipeline data.
            claimRefs:
              - CI001
