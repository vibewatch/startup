      - number: '3.2'
        title: Depth is the moat; distribution is the attack surface
        blocks:
          - type: paragraph
            body: >-
              Profound's defensible wedge is the breadth of the operating loop rather than simple mention tracking. Its
              documentation combines prompt monitoring, answer-engine visibility, citation tracking, competitive
              benchmarking, and recommendations through Agents. Company-affiliated comparisons add real-user prompt
              data, crawler analytics, integrations, and enterprise controls, but those superiority claims are not
              independent benchmarks. Peec is repeatedly positioned as easier to configure and more execution-oriented,
              while Semrush, HubSpot, Ahrefs, and other incumbents can distribute baseline AI visibility into tools
              customers already buy. This creates a durability test: Profound must keep proprietary data and workflow
              depth sufficiently ahead of suite add-ons to justify a separate procurement process. The assigned evidence
              does not establish comparative accuracy, response coverage, or realized customer outcomes under a common
              test protocol.
            claimRefs:
