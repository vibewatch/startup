  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and packaging
        blocks:
          - type: paragraph
            body: >-
              Profound appears to monetize a vertically integrated AI-visibility platform rather than a single
              monitoring feature. Its official product materials describe prompt monitoring, answer-engine visibility,
              citation tracking, competitive benchmarking, and agent-driven recommendations, while independent reviews
              describe a time-limited trial followed by a sales-led Enterprise contract. This supports a recurring
              enterprise-software revenue hypothesis, but the public record reviewed here does not disclose contract
              duration, minimum commitment, usage overages, professional-services fees, or revenue-recognition policy.
              The distinction matters: feature breadth can support willingness to pay, yet it does not reveal realized
              price, recurring mix, or the portion of delivery that depends on strategists and engagement support.
            claimRefs:
              - CI001
              - CI007
              - CI008
              - CI009
