      - number: '5.2'
        title: Functional architecture and data model
        blocks:
          - type: paragraph
            body: >-
              The externally observable architecture has three principal data paths. First, scheduled prompts produce
              browser-captured answer samples that feed visibility, sentiment, citation, accuracy, and competitive
              analysis. Second, server-log and infrastructure integrations support Agent Analytics for crawler behavior
              and referral analysis. Third, Agents consume identified opportunities and produce marketing work. Profound
              states that prompts run daily and that browser capture reflects the customer-facing experience rather than
              API-only output. These are meaningful design choices for a volatile measurement surface, yet the assigned
              evidence does not disclose sampling controls, storage architecture, model-change normalization, latency
              objectives, or failure handling. The architecture below is therefore functional, not an assertion about
              Profound's internal software stack.
            claimRefs:
              - CE002
              - CE003
              - CE005
              - CE006
              - CE012
          - type: table
            tableRef: TE003
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE005
              - CE006
              - CE010
              - CE012
      - number: '5.3'
        title: Deployment, integration, and control plane
        blocks:
          - type: paragraph
            body: >-
              The current buying and deployment model is enterprise-led. Two October 2026 comparisons report a seven-day
              trial followed by custom Enterprise pricing, and one reports that the earlier self-serve tiers had
              disappeared. Publicly described Enterprise capabilities include API access, exports, broad answer-engine
              coverage, SSO/SAML, and SOC 2. Profound's own product page additionally lists role-based access control
              and automated backups. Those controls improve procurement fit, but the retained material does not
              establish implementation timelines, support service levels, uptime history, recovery objectives, or the
              scope and date of audit coverage. Buyers should treat the controls as vendor statements pending review of
              the current audit report, architecture documentation, data-processing terms, and an integration plan.
            claimRefs:
              - CE007
              - CE008
              - CE009
          - type: table
            tableRef: TE002
            claimRefs:
              - CE007
              - CE008
              - CE009
      - number: '5.4'
        title: Differentiation, maturity, and technical risk
        blocks:
          - type: paragraph
            body: >-
              The clearest product differentiation in the assigned evidence is the combination of Prompt Volume demand
              data, browser-based response capture, autonomous Agents, and server-log crawler analytics.
              Competitor-authored reviews consistently regard the platform as deep and enterprise-oriented, but they are
              not independent benchmarks and should not be treated as proof of superior accuracy. One review also says
              Profound does not fully publish how Prompt Volume data is collected, while a separate source cautions that
              customer outcome claims are vendor- or client-reported rather than independently audited. Product breadth
              and category momentum indicate commercial maturity; they do not answer diligence questions about
              reproducibility, uptime, data provenance, incident history, or roadmap delivery. Those questions remain
              the primary technical underwriting gap.
            claimRefs:
              - CE003
              - CE006
              - CE011
              - CE012
              - CE013
              - CE014
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Breadth spans measurement, diagnosis, and action
            body: >-
              Profound joins browser-captured answer monitoring, citation and narrative analysis, crawler analytics, and
              agentic execution in one enterprise-oriented workflow.
            calloutType: strength
            claimRefs:
              - CE001
              - CE003
              - CE005
              - CE006
          - type: callout
            title: Public architecture evidence stops at the functional layer
            body: >-
              The retained evidence does not establish uptime, latency, incident history, sampling reproducibility,
              Prompt Volume provenance, or independently audited outcome lift.
            calloutType: risk
            claimRefs:
              - CE012
              - CE013
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Enterprise focus is visible in the buying motion
        blocks:
          - type: paragraph
            body: >-
              Profound's current public packaging separates evaluation from operational use. The free Trial is
              explicitly for companies that want to test the product before a demo, while the Enterprise tier is
              positioned for teams operationalizing AI-search insights and marketing agents at scale. The enterprise
              package adds broader answer-engine coverage, dedicated support, SSO/SAML, and SOC 2 compliance, which
              points to marketing leadership and AI-search practitioners as users and security, IT, and procurement
              stakeholders as important buying participants. Independent reviewers likewise describe the product as best
              suited to enterprises with large prompt sets and dedicated ownership. Sacra's older description of a
              self-serve mid-market tier is useful historical context, but the current official pricing page no longer
              presents a paid self-serve rung, so it should not be treated as the present acquisition path.
            claimRefs:
              - CU001
              - CU003
              - CU004
              - CU006
              - CU010
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU003
              - CU004
              - CU006
              - CU007
              - CU010
      - number: '6.2'
        title: Public adoption proof is named but shallow
        blocks:
          - type: paragraph
            body: >-
              The available evidence shows a real evaluation surface and several named customer signals, but not a
              measurable adoption trajectory. The Trial runs 50 prompts daily for seven days across three engines,
              establishing a low-commitment product test rather than paid adoption. Profound's pricing page carries a
              Statsig testimonial about selecting the platform after trying alternatives, Sacra names U.S. Bank as an
              enterprise example, and an official comparison article quotes a CRS marketing leader on the support
              relationship. These are stronger than unqualified logos because each has some stated context, yet none
              discloses seats, prompts, contract value, production duration, renewal, or business outcomes. Accordingly,
              the named references validate buyer relevance but cannot establish customer scale, conversion from trial,
              or durable production usage.
            claimRefs:
              - CU002
              - CU007
              - CU008
              - CU009
          - type: table
            tableRef: TU002
            claimRefs:
              - CU002
              - CU007
              - CU008
              - CU009
      - number: '6.3'
        title: Retention and concentration remain the central customer diligence gaps
        blocks:
          - type: paragraph
            body: >-
              No retained source reports gross or net revenue retention, logo churn, renewal rates, contract length,
              cohort behavior, customer count, or satisfaction scores. There is also no customer-revenue distribution,
              so top-customer and vertical concentration cannot be measured. The sales-led package creates additional
              proof requirements: a seven-day, three-engine Trial is too short to demonstrate month-over-month trend
              quality, while the paid price and prompt allowance remain available only through a quote. AEO Labs and
              DerivateX independently identify this packaging and ownership burden as a poor fit for smaller teams.
              Sacra also flags probabilistic answer variability as a challenge to consistent measurement, which may
              complicate ROI validation and renewal unless Profound can show repeatable outcome attribution during
              diligence.
            claimRefs:
              - CU011
              - CU013
              - CU014
              - CU015
          - type: table
            tableRef: TU003
            claimRefs:
              - CU011
              - CU012
              - CU013
              - CU014
              - CU015
      - number: '6.4'
        title: Expansion is plausible through usage breadth, not publicly proven by cohorts
        blocks:
          - type: paragraph
            body: >-
              The product naturally exposes several land-and-expand surfaces. A customer can begin with a fixed trial
              prompt set, progress through enterprise procurement, deploy recurring prompt and citation monitoring, act
              on recommendations, and then add engines, competitors, keywords, markets, or automated workflows. Sacra
              specifically describes increased usage across keywords, competitors, and AI platforms plus upsells into
              agent monitoring and content workflows as revenue-growth mechanisms. The official walkthrough supports the
              operational sequence from monitoring through action. This is a credible product-led expansion design, not
              evidence that expansion actually occurs: Profound publishes no cohort, plan migration, usage growth, NRR,
              or upsell-rate data. The investment case therefore needs customer-level records linking initial scope,
              later scope, renewal, and realized value.
            claimRefs:
              - CU005
              - CU012
              - CU016
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU005
              - CU012
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Customer economics are not publicly testable
            body: >-
              Named references and enterprise packaging establish buyer relevance, but the retained evidence contains no
              retention, paid-customer count, concentration, or customer-outcome series. Request contract-level cohorts
              before treating the apparent enterprise fit as durable adoption.
            calloutType: risk
            claimRefs:
              - CU007
              - CU008
              - CU009
              - CU013
              - CU014
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk picture
        blocks:
          - type: paragraph
            body: >-
              The highest residual exposure is execution rather than a documented legal event. TechCrunch reported a
              $180 million Series D at a $1.8 billion valuation less than seven months after a $96 million Series C,
              while attributing threefold six-month revenue growth and more than 1,000 enterprise customers to the
              company. That combination raises the operating bar without disclosing retention, gross margin, customer
              concentration, or contract economics. The second cluster is product and category dependency: Profound
              itself says AI answers vary enough to require daily prompt runs, while Blastra observed more than 650
              products in G2's AEO category and Profound behind Semrush by G2 Score on October 4. The heatmap is
              qualitative, uses only public signals, and does not claim measured incident probabilities.
            claimRefs:
              - CR001
              - CR004
              - CR005
              - CR006
              - CR007
              - CR014
              - CR015
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR003
              - CR011
              - CR012
              - CR013
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR005
              - CR008
              - CR011
              - CR012
              - CR014
              - CR015
      - number: '7.2'
        title: Legal, security, and recovery posture
        blocks:
          - type: paragraph
            body: >-
              Public evidence shows meaningful controls but not a complete legal or resilience record. Profound says
              Answer Engine Insights is SOC 2 Type II compliant, supports SSO and role-based access control, and creates
              daily backups retained for one week. These claims reduce procurement friction, but they do not disclose
              the audit scope, exceptions, recovery-point and recovery-time objectives, subprocessor obligations,
              breach-notification terms, data residency, or incident history. The assigned pool also did not produce a
              regulator, court, or enforcement record specific to Profound; that is an evidence gap, not proof that no
              event exists. Investment diligence should therefore obtain the SOC report, DPA, subprocessor list,
              penetration-test summary, insurance certificate, incident register, and contractual recovery commitments.
            claimRefs:
              - CR002
              - CR003
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR008
              - CR009
      - number: '7.3'
        title: Platform, partner, and commercial dependencies
        blocks:
          - type: paragraph
            body: >-
              Profound sits between enterprise customers and answer engines it does not control. Its own product page
              says tracked prompts run daily because AI platforms do not return the same answer twice, so methodology,
              browser access, model interfaces, and engine policies are continuing dependencies. Packaging also creates
              procurement risk: AEO Labs and DerivateX describe a seven-day trial followed by custom enterprise pricing,
              and DerivateX says public information is insufficient to calculate cost per 1,000 answers. Finally, the
              customer must fund the work after measurement. DerivateX argues that trackers do not themselves publish
              pages or earn third-party citations and that an unowned dashboard repeats the same gap. This makes renewal
              quality dependent on customer staffing and measurable workflow adoption, not only dashboard accuracy.
            claimRefs:
              - CR001
              - CR008
              - CR009
              - CR010
              - CR012
              - CR013
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR007
              - CR008
              - CR009
              - CR010
              - CR012
              - CR014
              - CR015
              - CR016
      - number: '7.4'
        title: Mitigations, monitors, and thesis-break criteria
        blocks:
          - type: paragraph
            body: >-
              Diligence should convert the public signals into measurable covenants. Require quarterly disclosure of
              gross retention, net retention, cohort expansion, top-ten customer concentration, gross margin, cash burn,
              and enterprise sales-cycle length; funding raised is not cash available and reported revenue growth is not
              ARR. For reliability, monitor prompt-run completion, export latency, integration failures, source
              coverage, recovery tests, and material security events by severity. For product value, pre-register a
              representative prompt set and compare visibility, citation quality, and downstream pipeline over at least
              one quarter rather than extrapolating from the seven-day trial. Thesis-break triggers are a material
              unresolved security event, failure to provide contract-grade controls, worsening retention despite
              reported customer growth, or two consecutive quarters in which customer outcomes fail to justify the
              custom enterprise cost and staffing load.
            claimRefs:
              - CR003
              - CR006
              - CR007
              - CR009
              - CR010
              - CR011
              - CR012
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Fast financing raises the proof threshold
            body: >-
              The $180 million Series D at a $1.8 billion valuation followed the $96 million Series C by less than seven
              months. Treat that cadence as an execution expectation, not as evidence of cash runway, ARR, margins, or
              customer durability.
            calloutType: risk
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
          - type: callout
            title: Gate the thesis on private evidence
            body: >-
              Require retention, concentration, unit economics, incident history, recovery testing, and contract-grade
              security documents before underwriting the public growth narrative or enterprise-control claims.
            calloutType: recommendation
            claimRefs:
              - CR002
              - CR003
              - CR006
              - CR007
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment call and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The current public financing reference is the September 15, 2026 Series D: $180 million at a reported $1.8
              billion valuation, following a $96 million Series C at $1.0 billion roughly seven months earlier. That is
              an 80% increase in headline value over a short interval, while reported total capital raised now exceeds
              $335 million. The retained evidence also repeats company-reported revenue tripling over six months and
              more than 1,000 enterprise customers, but it does not provide audited ARR, net retention, gross margin,
              cohort economics, or fully diluted capitalization. The appropriate call is therefore research-more, not
              buy: treat $1.8 billion as a financing mark rather than independently established fair value, and
              condition any investment on primary financial and cap-table evidence.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV009
              - CV010
              - CV013
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV007
              - CV009
              - CV010
              - CV013
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV013
              - CV016
      - number: '8.2'
        title: Thesis, anti-thesis, and competitive durability
        blocks:
          - type: paragraph
            body: >-
              The thesis rests on a real enterprise workflow rather than funding alone. Profound's own documentation
              describes prompt monitoring, answer-engine visibility, citation tracking, competitive benchmarking, and
              agentic recommendations, while third-party reviews characterize the paid offer as enterprise-oriented,
              with broad engine coverage and procurement features. The anti-thesis is that category leadership may not
              translate into durable pricing power. Public comparisons show materially cheaper trackers, the company has
              returned to custom enterprise pricing, and one directory analysis says the G2 category expanded beyond 650
              solutions with Semrush ahead of Profound by G2 Score in October 2026. Durable retention, expansion, and
              attributable customer outcomes must therefore carry more weight than brand recognition or review volume.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV011
              - CV012
              - CV014
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV010
              - CV011
              - CV014
              - CV015
      - number: '8.3'
        title: Scenario framework and comparable references
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports scenario conditions, not a precise fair-value range. The latest private rounds
              provide two observable reference points: $1.0 billion in February 2026 and $1.8 billion in September 2026.
              Product comparisons provide operating context rather than valuation comps: lower-priced vendors publish
              entry prices, while Profound reserves its broadest coverage and enterprise controls for a custom quote.
              The bull case requires the reported customer and revenue trajectory to convert into verified retention,
              expansion, and margin quality. The base case assumes a credible enterprise product but withholds support
              for further mark-up. The bear case is multiple compression or a down round if incumbents close the feature
              gap, price transparency matters, or reported growth does not reconcile to durable recurring revenue.
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: Exit readiness, diligence asks, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Exit readiness is not established by the retained public record. Large financing rounds and enterprise
              adoption can support future strategic or public-market optionality, but neither an exit window nor an
              achievable return can be underwritten without security-level terms, ownership, liquidation preferences,
              debt, revenue quality, and comparable transaction evidence. Before investing, obtain audited monthly ARR
              and revenue bridges, gross margin, logo and dollar retention by cohort, customer concentration, sales
              efficiency, cash burn, runway, the fully diluted cap table, preference stack, and board materials
              supporting the latest price. Thesis-break triggers should include a material failure to reconcile the
              reported growth, sustained loss of competitive standing, weak enterprise expansion, or terms that make
              common-equity returns unattractive even if the headline valuation holds.
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV010
              - CV011
              - CV013
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price-sensitive recommendation
            body: >-
              Research-more at the current evidence level. A buy case requires audited recurring-revenue quality,
              retention, margins, ownership, preferences, and a target-return model that survives downside assumptions.
            calloutType: recommendation
            claimRefs:
              - CV009
              - CV010
              - CV013
              - CV016
          - type: callout
            title: Headline valuation is not fair value
            body: >-
              The $1.8 billion figure is a reported private financing mark. It does not disclose dilution, liquidation
              preferences, debt, or the common-equity economics relevant to a new investor.
            calloutType: risk
            claimRefs:
              - CV001
              - CV010
              - CV016
