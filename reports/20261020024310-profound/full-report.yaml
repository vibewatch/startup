  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Profound is organized around a monitor-analyze-act workflow rather than a single rank-tracking dashboard.
              Its official walkthrough connects prompt monitoring, answer-engine visibility, citation tracking,
              competitive benchmarking, and agentic recommendations. Answer Engine Insights covers visibility, share of
              voice, sentiment, citations, factual inaccuracies, and competitor comparisons, while Prompt Volumes is
              positioned as the demand-discovery input. Agents then turn identified gaps into content or optimization
              work. This breadth gives enterprise marketing teams a shared operating surface, but it does not eliminate
              the need for editorial review, distribution, or third-party authority: an independent comparison
              explicitly notes that trackers measure outcomes rather than publish content or earn citations on a
              customer's behalf.
            claimRefs:
              - CE001
              - CE004
              - CE005
              - CE010
              - CE011
