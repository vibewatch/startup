chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and product boundary
        blocks:
          - type: paragraph
            body: >-
              Profound operates at the intersection of AI marketing and answer-engine optimization. Its own site frames
              the company around an AI Marketer and describes a platform that combines visibility measurement, traffic
              analytics, content workflows, competitive benchmarking, and enterprise controls. The product documentation
              narrows the operating loop further: monitor prompts, measure answer-engine visibility and sentiment, trace
              citations, compare competitors, and turn recommendations into agentic workflows. External reviews broadly
              agree that the product is analytics-led and aimed at enterprise users, while warning that the depth can
              exceed the needs and execution capacity of smaller teams. That makes the business model best understood as
              enterprise software with a trial entry point and custom brand pricing, not as a disclosed low-touch SaaS
              schedule. The legal address and incorporation record were not present in the assigned evidence; New York
              is therefore retained as the reported headquarters rather than a verified registered office.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO006
              - CO015
          - type: table
            tableRef: TO001
            claimRefs:
              - CO005
              - CO006
              - CO010
              - CO012
              - CO013
              - CO014
      - number: '1.2'
        title: Founder-led leadership with limited governance visibility
        blocks:
          - type: paragraph
            body: >-
              Publicly available evidence identifies James Cadwallader and Dylan Babbs as the founders. Cadwallader is
              also identified as chief executive, while the assigned sources do not establish Babbs's current operating
              title, the wider C-suite, the board roster, committee structure, investor observer rights, or succession
              arrangements. This leaves a meaningful key-person question: the company's public category narrative and
              major event appearances are closely associated with Cadwallader, yet there is not enough evidence to
              quantify how decision authority or customer relationships are distributed below the founders. The
              leadership table is deliberately partial and should not be read as a complete management roster. Primary
              evidence such as the certificate of incorporation, current board consents, organization chart, employment
              agreements, and key-person provisions is required before drawing a governance or continuity conclusion.
            claimRefs:
              - CO007
              - CO008
          - type: table
            tableRef: TO002
            claimRefs:
              - CO007
              - CO008
      - number: '1.3'
        title: Rapid financing outpaces disclosed operating evidence
        blocks:
          - type: paragraph
            body: >-
              The latest reported financing was a $180 million Series D on September 15, 2026 at a $1.8 billion
              valuation, co-led by Sequoia Capital and Kleiner Perkins. The round followed a reported $96 million Series
              C at a $1 billion valuation in February 2026, and one secondary account places cumulative funding above
              $335 million after the Series D. The company also reportedly said that revenue tripled over the preceding
              six months and that it served more than 1,000 enterprise customers. Those growth statements lack an
              absolute revenue base, ARR, retention, cohort, or customer-definition disclosure, so they should not be
              converted into run-rate or valuation multiples. Funding raised likewise does not establish cash available.
              The pace and size of the rounds indicate strong investor sponsorship, but the absence of dilution,
              liquidation preferences, debt, secondary-sale, burn, and runway data prevents a capital-efficiency
              judgment.
            claimRefs:
              - CO009
              - CO010
              - CO011
              - CO012
              - CO013
              - CO014
          - type: table
            tableRef: TO003
            claimRefs:
              - CO010
              - CO011
      - number: '1.4'
        title: Milestones show acceleration and rising competitive pressure
        blocks:
          - type: paragraph
            body: >-
              Profound moved from a reported 2024 founding to unicorn financing in roughly two years. Category
              validation arrived before the largest rounds: Blastra reports that Profound was the sole Leader on the
              first AEO Grid in December 2025, followed by a February 2026 Series C and the September 2026 Series D. The
              same source supplies the adverse counterpoint: by October 4, 2026, G2's AEO category reportedly contained
              more than 650 solutions and Semrush ranked ahead of Profound by G2 Score. An October 19 pricing review
              still characterized Profound as an enterprise product with unpublished brand pricing, reinforcing both its
              positioning and the difficulty of testing price-to-value from public data. The six-point timeline is
              shorter than the desired eight entries because the assigned evidence does not provide sufficiently dated
              product launches, partnerships, regulatory events, or leadership changes. Those omissions remain an
              explicit research gap rather than being filled with inferred dates.
            claimRefs:
              - CO005
              - CO009
              - CO010
              - CO015
              - CO016
