  - id: FU001
    title: Customer journey from evaluation to potential expansion
    type: journey-map
    summary: >-
      The public product and pricing surfaces imply a six-stage enterprise journey, while conversion and cohort evidence
      remain unavailable.
    data:
      nodes:
        - id: evaluate
          label: Evaluate
          detail: Run a seven-day baseline on three answer engines.
          touchpoints:
            - Free Trial
            - 50 daily prompts
        - id: scope
          label: Scope
          detail: Define brands, prompts, competitors, engines, and reporting needs.
          touchpoints:
            - Prompt monitoring
            - Competitive benchmarking
        - id: procure
          label: Procure
          detail: Obtain a custom quote and complete enterprise controls review.
          touchpoints:
            - Demo and quote
            - SSO/SAML
            - SOC 2
        - id: monitor
          label: Monitor
          detail: Track visibility, citations, sentiment, and competitive position.
          touchpoints:
            - Answer Engine Insights
            - Citation tracking
        - id: act
          label: Act
          detail: Use recommendations and agentic workflows to prioritize marketing work.
          touchpoints:
            - Actionable recommendations
            - Agents
        - id: expand
          label: Expand
          detail: Add prompts, competitors, engines, markets, or advanced workflows.
          touchpoints:
            - Usage breadth
            - Workflow upsell
    approximationNotes: >-
      The stage order is an analytical synthesis of the published product and buying surfaces, not a measured funnel; no
      conversion rate, duration, or value is implied.
    claimRefs:
      - CU005
      - CU012
      - CU016
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      Qualitative placement of six evidence-backed risks by likelihood signal, investment impact, and public mitigation
      maturity; the cells are ordinal judgments, not measured probabilities.
    data:
      columns:
        - label: Likelihood signal
        - label: Investment impact
        - label: Public mitigation maturity
      rows:
        - label: Execution expectations after financing
          values:
            - label: Elevated
              detail: Rapid Series C-to-D cadence and company-reported growth raise the delivery bar.
            - label: High
              detail: Failure to convert capital and growth into durable economics would impair the thesis.
            - label: Not public
              detail: Burn, margin, retention, and concentration controls were not disclosed in the assigned pool.
        - label: Answer-engine volatility
          values:
            - label: Persistent
              detail: Profound says engines do not return the same answer twice.
            - label: High
              detail: Coverage or methodology drift can affect the core measurement product.
            - label: Moderate
              detail: Daily runs and source tracing mitigate but do not control upstream platforms.
        - label: Customer execution bandwidth
          values:
            - label: Elevated
              detail: Independent analysis says a tracker without an owner repeats the same gap.
            - label: High
              detail: Weak operational adoption threatens outcome proof and renewals.
            - label: Moderate
              detail: Agents and recommendations support action but do not publish or earn placements autonomously.
        - label: Commercial opacity
          values:
            - label: Current
              detail: The current public package is a short trial followed by a custom enterprise quote.
            - label: Medium-high
              detail: Opaque unit cost can slow procurement and complicate ROI proof.
            - label: Low
              detail: No public paid price or cost-per-answer denominator was available.
        - label: Product reliability
          values:
            - label: Reported, unquantified
              detail: A third-party review cites recurring bugs, integration issues, and slow exports.
            - label: Medium
              detail: Workflow disruptions can undermine reporting and trust.
            - label: Unclear
              detail: No incident frequency, uptime series, or severity denominator was public.
        - label: Competitive crowding
          values:
            - label: Current
              detail: Blastra observed more than 650 G2 AEO listings in October 2026.
            - label: High
              detail: Suite vendors can bundle adjacent SEO capabilities and pressure a specialist.
            - label: Moderate
              detail: Profound retains enterprise depth, but public switching-cost evidence is absent.
    approximationNotes: >-
      Ordinal labels synthesize cited evidence and explicit gaps as of 2026-10-20; they are not numeric probabilities,
      audited control ratings, or predictions of incident frequency.
    claimRefs:
      - CR001
      - CR003
      - CR004
      - CR005
      - CR008
      - CR011
      - CR012
      - CR014
      - CR015
