            title: Do not capitalize the adjacent search economy as AEO TAM
            body: >-
              The retained evidence supports urgency and a large surrounding budget pool, but not category revenue,
              contract-value distribution, buyer count, or adoption inputs for a standalone software TAM. These missing
              denominators are a material valuation gap.
