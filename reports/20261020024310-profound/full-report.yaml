  - id: FP001
    title: 'Competitive positioning: buying accessibility versus enterprise depth'
    type: quadrant
    summary: >-
      Ordinal positioning suggests Profound trades lower self-serve accessibility for greater enterprise depth, while
      suite extensions and lightweight tools invert that trade-off.
    data:
      points:
        - label: Profound
          x: 2
          'y': 5
          detail: Sales-led packaging; broad diagnostic, governance, and workflow claims.
        - label: Peec AI
          x: 4
          'y': 3
          detail: Lower-friction setup and action orientation; enterprise depth is less established.
        - label: Semrush
          x: 4
          'y': 3
          detail: Strong installed-base accessibility; retained comparisons describe narrower AEO depth.
        - label: HubSpot AEO
          x: 5
          'y': 2
          detail: Accessible suite distribution; standalone enterprise depth is unverified.
        - label: Otterly
          x: 5
          'y': 2
          detail: Low-cost simple entry; lighter data and governance profile.
        - label: Internal build
          x: 3
          'y': 2
          detail: High control for narrow scopes but substantial custom work for sustained breadth.
    approximationNotes: >-
      Analyst-authored ordinal scores from 1 (low) to 5 (high), using qualitative packaging, onboarding, integration,
      security, and workflow evidence; these are not measured product performance or an independent benchmark. X
      measures buying accessibility and Y measures enterprise depth.
    claimRefs:
