callouts:
  - calloutType: recommendation
    title: Price-sensitive recommendation
    body: >-
      Research-more at the current evidence level. A buy case requires audited
      recurring-revenue quality, retention, margins, ownership, preferences, and
      a target-return model that survives downside assumptions.
    claimRefs: [CV009, CV010, CV013, CV016]
  - calloutType: risk
    title: Headline valuation is not fair value
    body: >-
      The $1.8 billion figure is a reported private financing mark. It does not
      disclose dilution, liquidation preferences, debt, or the common-equity
      economics relevant to a new investor.
    claimRefs: [CV001, CV010, CV016]
