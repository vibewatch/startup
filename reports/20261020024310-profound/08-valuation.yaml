company:
  name: Profound
chapter:
  number: 8
  title: Valuation
  summary: >-
    Profound's September 2026 Series D established a $1.8 billion financing
    valuation after a $1.0 billion Series C roughly seven months earlier, but
    the retained public evidence still does not disclose audited ARR, retention,
    gross margin, cap-table terms, or a defensible target-return model. The
    recommendation is research-more: the product and company-reported growth
    support category-leader potential, while the rapid mark-up, custom pricing,
    and proliferating lower-cost competition make entry price and primary
    financial diligence decisive.
sections:
  - id: investment-call
    title: Investment call and entry discipline
    body: >-
      The current public financing reference is the September 15, 2026 Series D:
      $180 million at a reported $1.8 billion valuation, following a $96 million
      Series C at $1.0 billion roughly seven months earlier. That is an 80%
      increase in headline value over a short interval, while reported total
      capital raised now exceeds $335 million. The retained evidence also repeats
      company-reported revenue tripling over six months and more than 1,000
      enterprise customers, but it does not provide audited ARR, net retention,
      gross margin, cohort economics, or fully diluted capitalization. The
      appropriate call is therefore research-more, not buy: treat $1.8 billion
      as a financing mark rather than independently established fair value, and
      condition any investment on primary financial and cap-table evidence.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV009, CV010, CV013, CV016]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: thesis-and-antithesis
    title: Thesis, anti-thesis, and competitive durability
    body: >-
      The thesis rests on a real enterprise workflow rather than funding alone.
      Profound's own documentation describes prompt monitoring, answer-engine
      visibility, citation tracking, competitive benchmarking, and agentic
      recommendations, while third-party reviews characterize the paid offer as
      enterprise-oriented, with broad engine coverage and procurement features.
      The anti-thesis is that category leadership may not translate into durable
      pricing power. Public comparisons show materially cheaper trackers, the
      company has returned to custom enterprise pricing, and one directory
      analysis says the G2 category expanded beyond 650 solutions with Semrush
      ahead of Profound by G2 Score in October 2026. Durable retention, expansion,
      and attributable customer outcomes must therefore carry more weight than
      brand recognition or review volume.
    claimRefs: [CV006, CV007, CV008, CV011, CV012, CV014, CV015]
    tableRefs: [TV002]
  - id: scenarios-and-comparables
    title: Scenario framework and comparable references
    body: >-
      Public evidence supports scenario conditions, not a precise fair-value
      range. The latest private rounds provide two observable reference points:
      $1.0 billion in February 2026 and $1.8 billion in September 2026. Product
      comparisons provide operating context rather than valuation comps:
      lower-priced vendors publish entry prices, while Profound reserves its
      broadest coverage and enterprise controls for a custom quote. The bull case
      requires the reported customer and revenue trajectory to convert into
      verified retention, expansion, and margin quality. The base case assumes a
      credible enterprise product but withholds support for further mark-up. The
      bear case is multiple compression or a down round if incumbents close the
      feature gap, price transparency matters, or reported growth does not
      reconcile to durable recurring revenue.
    claimRefs: [CV001, CV002, CV004, CV005, CV007, CV008, CV009, CV010, CV011, CV014, CV015]
    tableRefs: [TV003]
  - id: exit-readiness-and-diligence
    title: Exit readiness, diligence asks, and thesis-break triggers
    body: >-
      Exit readiness is not established by the retained public record. Large
      financing rounds and enterprise adoption can support future strategic or
      public-market optionality, but neither an exit window nor an achievable
      return can be underwritten without security-level terms, ownership,
      liquidation preferences, debt, revenue quality, and comparable transaction
      evidence. Before investing, obtain audited monthly ARR and revenue bridges,
      gross margin, logo and dollar retention by cohort, customer concentration,
      sales efficiency, cash burn, runway, the fully diluted cap table, preference
      stack, and board materials supporting the latest price. Thesis-break
      triggers should include a material failure to reconcile the reported growth,
      sustained loss of competitive standing, weak enterprise expansion, or terms
      that make common-equity returns unattractive even if the headline valuation
      holds.
    claimRefs: [CV003, CV004, CV005, CV010, CV011, CV013, CV015, CV016]
