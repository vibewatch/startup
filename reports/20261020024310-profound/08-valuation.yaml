  - id: TV003
    title: Bull, base, and bear scenarios
    columns:
      - Scenario
      - Explicit assumptions
      - Valuation / return logic
      - Probability signals
      - Downside or trigger
    rows:
      - ["Bull", "Reported revenue and customer growth reconcile to audited recurring revenue; retention, expansion, and margin quality are strong", "Value above the $1.8B round could be supportable only after primary metrics establish durable growth and an investable ownership outcome", "Verified cohort expansion, enterprise wins, and durable product differentiation", "Growth decelerates, retention weakens, or ownership is diluted by preference overhang"]
      - ["Base", "Profound remains a credible enterprise platform, but competition and custom pricing limit visibility into pricing power", "Use $1.8B only as the latest financing reference; no independent fair-value range is supportable from public data", "Stable renewals and product adoption, but incomplete margin and cohort proof", "Do not invest until the requested data supports a price-sensitive return case"]
      - ["Bear", "Incumbents narrow the feature gap, lower-priced tools constrain pricing, or reported growth fails to translate into quality ARR", "A value below the $1.0B prior-round reference or a down round is possible, but cannot be quantified from retained evidence", "Loss of category standing, weak expansion, rising concessions, or financing on structured terms", "Pause or reject if primary data fails to reconcile reported scale or common-equity economics"]
    notes: "Scenario boundaries use the two observed 2026 private financing marks only as references; they are not fair-value estimates, probability weights are qualitative, and target returns remain an evidence gap."
    claimRefs: [CV001, CV002, CV004, CV005, CV007, CV008, CV009, CV010, CV011, CV014, CV015, CV016]
