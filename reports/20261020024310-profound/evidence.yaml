evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: operating-metrics
    missingEvidence: ARR, absolute revenue, gross margin, net revenue retention, burn, runway, and customer-cohort definitions.
    whyItMatters: >-
      Without these denominators, reported growth and customer claims cannot support a valuation multiple or
      capital-efficiency assessment.
    diligencePath: >-
      Obtain audited financial statements, monthly management accounts, ARR bridge, cohort retention schedules, cash
      ledger, and board-approved plan.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: leadership-governance
    missingEvidence: >-
      Complete executive roster, current board and observer list, committee structure, founder employment terms,
      delegated authority, and succession plan.
    whyItMatters: The public record is too thin to assess governance quality, functional coverage, or dependence on either founder.
    diligencePath: >-
      Review the organization chart, board minutes and consents, charter, investor-rights agreement, employment
      agreements, and succession materials.
    relatedQuestionRefs:
      - QO003
      - QO009
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: capitalization
    missingEvidence: >-
      Full cap table, round-by-round dilution, liquidation preferences, investor governance rights, debt facilities, and
      secondary transactions.
    whyItMatters: >-
      Public round amounts and valuation headlines do not establish ownership, control, preference overhang, or current
      cash availability.
    diligencePath: >-
      Obtain the fully diluted cap table, financing documents, side letters, debt schedule, secondary-sale ledger, and
      current cash reconciliation.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: minor
    topic: pricing
    missingEvidence: >-
      Current first-party plan sheet reconciling DerivateX's reported seven-day trial with Simaia's statement that no
      free trial was available.
    whyItMatters: >-
      Trial availability affects sales friction, while unpublished pricing prevents public assessment of contract size
      and price realization.
    diligencePath: >-
      Request a dated enterprise quote, trial terms, standard order form, discount schedule, renewal uplift policy, and
      realized-ACV distribution.
    relatedQuestionRefs:
      - QO006
  - type: missing-source
    severity: minor
    topic: milestones
    missingEvidence: At least two additional reliably dated product, partnership, regulatory, leadership, or adverse-event milestones.
    whyItMatters: >-
      The six supported timeline entries emphasize financing and category position and do not establish the full
      operating history.
    diligencePath: >-
      Review dated company newsroom archives, release notes, partnership announcements, regulatory databases, litigation
      dockets, and board records.
    relatedQuestionRefs:
      - QO010
  - type: missing-source
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      Auditable AEO category revenue, enterprise buyer counts, contract-value distribution, adoption rates, and
      geographic splits.
    whyItMatters: >-
      Without common-denominator inputs, adjacent search spending cannot be converted into a defensible TAM, SAM, SOM,
      or valuation multiple.
    diligencePath: >-
      Obtain third-party category revenue estimates, triangulate vendor revenue and contract values, and validate buyer
      counts through customer and procurement data.
    relatedQuestionRefs:
      - QM002
      - QM010
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: packaging
    missingEvidence: >-
      Current enterprise price bands, average contract value, prompt-volume tiers, renewal terms, and conversion from
      the seven-day trial.
    whyItMatters: >-
      Custom pricing and changing self-serve availability obscure the serviceable buyer base and the spend Profound can
      realistically capture.
    diligencePath: >-
      Review current order forms and cohort-level contract data, then interview buyers who evaluated both Profound and
      publicly priced alternatives.
    relatedQuestionRefs:
      - QM002
      - QM010
  - type: private-evidence-only
    severity: material
    topic: competitor-scale
    missingEvidence: Comparable competitor funding, revenue, customer counts, win rates, churn, and strategic roadmap evidence.
    whyItMatters: >-
      Without normalized scale and retention data, product breadth cannot be translated into competitive strength or
      share durability.
    diligencePath: >-
      Request Profound win/loss analyses and churn by named competitor, then corroborate scale using competitor filings,
      funding records, and customer references.
    relatedQuestionRefs:
      - QP002
    relatedTableRefs:
      - TP001
  - type: conflicting-data
    severity: material
    topic: pricing
    missingEvidence: >-
      A current first-party rate card and sample realized contracts by prompt volume, engine count, seat count, and
      service level.
    whyItMatters: Conflicting public tiers prevent a reliable comparison of total cost, discounting, and willingness to pay.
    diligencePath: Obtain current Profound, Peec, and suite-extension quotes under one standardized enterprise use case.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: independent-benchmark
    missingEvidence: An independent head-to-head benchmark using the same prompts, engines, geographies, dates, and scoring method.
    whyItMatters: Company and competitor comparisons cannot establish relative accuracy, completeness, or causal customer outcomes.
    diligencePath: >-
      Commission a blinded proof of concept across Profound, Peec, and one incumbent suite with archived raw responses
      and predefined accuracy metrics.
    relatedQuestionRefs:
      - QP008
      - QP009
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: material
    topic: revenue-quality
    missingEvidence: Contract-level ARR, realized pricing, discounts, term, bookings, recognized revenue, and deferred revenue.
    whyItMatters: List-price snapshots cannot establish recurring revenue quality, growth, or the valuation denominator.
    diligencePath: >-
      Obtain the latest board-approved monthly financial pack and reconcile it to anonymized contract cohorts and the
      general ledger.
    relatedQuestionRefs:
      - QI001
      - QI002
      - QI003
      - QI007
      - QI010
    relatedTableRefs:
      - TI001
      - TI002
      - TI003
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Gross margin, hosting and model cost, data acquisition cost, support labor, churn, NRR, CAC, sales cycle, and
      payback by segment.
    whyItMatters: >-
      These inputs determine whether growth is software-like or dependent on expensive data, compute, and service
      delivery.
    diligencePath: >-
      Review contribution-margin cohorts by customer size and product tier, including fully loaded sales and support
      costs.
    relatedQuestionRefs:
      - QI004
      - QI005
      - QI006
      - QI009
      - QI010
    relatedTableRefs:
      - TI001
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Current unrestricted cash, monthly net burn, debt and lease obligations, committed cloud spend, use of funds,
      runway, and next-round trigger.
    whyItMatters: Cumulative funding does not show remaining liquidity or the dilution required to reach the next milestone.
    diligencePath: >-
      Build a monthly base and downside cash bridge from the latest bank balance through the next financing or
      break-even milestone.
    relatedQuestionRefs:
      - QI008
      - QI010
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: technical-architecture
    missingEvidence: >-
      Current architecture diagram, sampling methodology, data lineage, model-change controls, uptime history, incident
      record, latency targets, recovery objectives, and third-party reliability evidence.
    whyItMatters: >-
      Without these materials, investors cannot test measurement reproducibility, operational resilience, or the cost
      and risk of dependence on changing answer-engine interfaces.
    diligencePath: >-
      Request architecture and data-flow reviews, twelve months of availability and incident data, RPO/RTO evidence,
      model-change procedures, and a reference call with a customer operating at comparable scale.
    relatedQuestionRefs:
      - QE009
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: material
    topic: developer-signal
    missingEvidence: >-
      A public developer repository, package-registry signal, API documentation set, public status history, or
      practitioner-community proxy tied directly to Profound was not present in the assigned successful source pool.
    whyItMatters: >-
      The absence prevents external assessment of release cadence, integration ergonomics, ecosystem adoption, and
      reliability beyond marketing descriptions.
    diligencePath: >-
      Request current API documentation, changelog and status history, integration telemetry, developer-support metrics,
      and customer engineer references.
    relatedQuestionRefs:
      - QE003
      - QE009
  - type: private-evidence-only
    severity: material
    topic: security-controls
    missingEvidence: >-
      The current SOC 2 report, bridge letter, penetration-test summary, subprocessor inventory, data-retention
      schedule, privacy impact assessment, and role/audit-log matrix.
    whyItMatters: >-
      Public control labels do not establish audit scope, control effectiveness, data residency, or whether the deployed
      configuration satisfies a buyer's policies.
    diligencePath: >-
      Complete security and privacy diligence under NDA and map each asserted control to current audit evidence and
      contract commitments.
    relatedQuestionRefs:
      - QE006
      - QE009
  - type: missing-source
    severity: material
    topic: outcome-validation
    missingEvidence: >-
      Independent before-and-after benchmarks linking Profound use to durable changes in visibility, citations,
      qualified traffic, or revenue with disclosed baselines and denominators.
    whyItMatters: Feature breadth and vendor case studies do not establish causal lift or economic return.
    diligencePath: >-
      Run a time-boxed proof of value with fixed prompts, holdout workflows, raw response exports, agreed baselines, and
      downstream attribution.
    relatedQuestionRefs:
      - QE005
      - QE007
      - QE009
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: NRR, GRR, logo churn, renewal rates, contract length, and customer cohorts by plan and segment.
    whyItMatters: Durability and expansion economics cannot be assessed without renewal and cohort evidence.
    diligencePath: >-
      Request anonymized customer-level billing cohorts, renewal schedules, churn reasons, and NRR bridges for the last
      eight quarters.
    relatedQuestionRefs:
      - QU008
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Revenue concentration by top customer, top ten customers, vertical, geography, and acquisition channel.
    whyItMatters: Enterprise-logo or vertical dependence could create renewal-driven revenue volatility.
    diligencePath: Obtain the current customer revenue ledger, top-20 renewal calendar, and segment/channel concentration schedule.
    relatedQuestionRefs:
      - QU009
    relatedTableRefs:
      - TU003
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: >-
      A complete current customer roster with production status, deployment scope, start date, renewal history, and
      quantified outcomes.
    whyItMatters: Three public references demonstrate relevance but do not establish the breadth or quality of production adoption.
    diligencePath: >-
      Sample at least ten customer contracts and conduct independent reference calls across enterprise, regulated, and
      newer accounts.
    relatedQuestionRefs:
      - QU003
      - QU004
    relatedTableRefs:
      - TU002
  - type: enumeration-incomplete
    severity: material
    topic: legal and regulatory record
    missingEvidence: >-
      Primary regulator, court, privacy, enforcement, insurance, and incident records specific to Profound, plus
      contract-level DPA and subprocessor obligations.
    whyItMatters: >-
      Public company claims about controls do not establish the absence of disputes, reportable incidents, contractual
      exceptions, or jurisdiction-specific obligations.
