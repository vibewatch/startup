      - - Concentration
        - "No top-customer, top-10, vertical, geography, or channel share disclosed"
        - "Unverified"
        - "Revenue fragility and enterprise-logo dependence cannot be sized"
        - "Revenue concentration schedule and renewal calendar"
      - - Procurement and validation
        - "Custom paid quote after a short, three-engine Trial"
        - "Meaningful friction for small teams; enterprise-aligned"
        - "May improve deal size while lengthening sales cycles"
        - "Median sales cycle, proof-of-value pass rate, and loss reasons"
      - - Measurement reliability
        - "Probabilistic AI responses vary with timing, prompts, and model updates"
        - "Category-level customer ROI risk"
        - "Weak reproducibility could pressure adoption or renewal"
        - "Test-retest methodology and customer outcome attribution"
    notes: >-
      Assessments distinguish supported product mechanisms from missing operating metrics; the
      table does not estimate retention, concentration, conversion, or sales-cycle values.
    claimRefs: [CU011, CU012, CU013, CU014, CU015]
figures:
  - id: FU001
    title: Customer journey from evaluation to potential expansion
    type: journey-map
    summary: >-
      The public product and pricing surfaces imply a six-stage enterprise journey, while conversion
      and cohort evidence remain unavailable.
    data:
      nodes:
        - id: evaluate
          label: Evaluate
          detail: "Run a seven-day baseline on three answer engines."
          touchpoints:
            - "Free Trial"
            - "50 daily prompts"
        - id: scope
          label: Scope
          detail: "Define brands, prompts, competitors, engines, and reporting needs."
          touchpoints:
            - "Prompt monitoring"
            - "Competitive benchmarking"
        - id: procure
          label: Procure
          detail: "Obtain a custom quote and complete enterprise controls review."
          touchpoints:
            - "Demo and quote"
            - "SSO/SAML"
            - "SOC 2"
        - id: monitor
          label: Monitor
          detail: "Track visibility, citations, sentiment, and competitive position."
          touchpoints:
            - "Answer Engine Insights"
            - "Citation tracking"
        - id: act
          label: Act
          detail: "Use recommendations and agentic workflows to prioritize marketing work."
          touchpoints:
            - "Actionable recommendations"
            - "Agents"
        - id: expand
          label: Expand
          detail: "Add prompts, competitors, engines, markets, or advanced workflows."
          touchpoints:
            - "Usage breadth"
            - "Workflow upsell"
    approximationNotes: >-
      The stage order is an analytical synthesis of the published product and buying surfaces, not
      a measured funnel; no conversion rate, duration, or value is implied.
    claimRefs: [CU005, CU012, CU016]
callouts:
  - calloutType: risk
    title: Customer economics are not publicly testable
    body: >-
      Named references and enterprise packaging establish buyer relevance, but the retained evidence
      contains no retention, paid-customer count, concentration, or customer-outcome series. Request
      contract-level cohorts before treating the apparent enterprise fit as durable adoption.
    claimRefs: [CU007, CU008, CU009, CU013, CU014]
