artifact: customers
slug: profound
runDate: 2026-10-20
company:
  name: Profound
chapter:
  number: 6
  title: Customers
  summary: >-
    Profound's public customer surface is built for enterprise marketing teams: a short free
    trial leads into a custom package with broader engine coverage, support, and procurement
    controls. Public evidence names Statsig, U.S. Bank, and CRS, but it does not disclose
    deployment scale, retention, customer concentration, or quantified customer outcomes.
sections:
  - id: segments-and-buying-motion
    title: Enterprise focus is visible in the buying motion
    body: >-
      Profound's current public packaging separates evaluation from operational use. The free
      Trial is explicitly for companies that want to test the product before a demo, while the
      Enterprise tier is positioned for teams operationalizing AI-search insights and marketing
      agents at scale. The enterprise package adds broader answer-engine coverage, dedicated
      support, SSO/SAML, and SOC 2 compliance, which points to marketing leadership and AI-search
      practitioners as users and security, IT, and procurement stakeholders as important buying
      participants. Independent reviewers likewise describe the product as best suited to
      enterprises with large prompt sets and dedicated ownership. Sacra's older description of
      a self-serve mid-market tier is useful historical context, but the current official pricing
      page no longer presents a paid self-serve rung, so it should not be treated as the present
      acquisition path.
    claimRefs: [CU001, CU003, CU004, CU006, CU010]
    tableRefs: [TU001]
  - id: adoption-proof
    title: Public adoption proof is named but shallow
    body: >-
      The available evidence shows a real evaluation surface and several named customer signals,
      but not a measurable adoption trajectory. The Trial runs 50 prompts daily for seven days
      across three engines, establishing a low-commitment product test rather than paid adoption.
      Profound's pricing page carries a Statsig testimonial about selecting the platform after
      trying alternatives, Sacra names U.S. Bank as an enterprise example, and an official
      comparison article quotes a CRS marketing leader on the support relationship. These are
      stronger than unqualified logos because each has some stated context, yet none discloses
      seats, prompts, contract value, production duration, renewal, or business outcomes.
      Accordingly, the named references validate buyer relevance but cannot establish customer
      scale, conversion from trial, or durable production usage.
    claimRefs: [CU002, CU007, CU008, CU009]
    tableRefs: [TU002]
  - id: durability-and-friction
    title: Retention and concentration remain the central customer diligence gaps
    body: >-
      No retained source reports gross or net revenue retention, logo churn, renewal rates,
      contract length, cohort behavior, customer count, or satisfaction scores. There is also no
      customer-revenue distribution, so top-customer and vertical concentration cannot be
      measured. The sales-led package creates additional proof requirements: a seven-day,
      three-engine Trial is too short to demonstrate month-over-month trend quality, while the
      paid price and prompt allowance remain available only through a quote. AEO Labs and
      DerivateX independently identify this packaging and ownership burden as a poor fit for
      smaller teams. Sacra also flags probabilistic answer variability as a challenge to
      consistent measurement, which may complicate ROI validation and renewal unless Profound
      can show repeatable outcome attribution during diligence.
    claimRefs: [CU011, CU013, CU014, CU015]
    tableRefs: [TU003]
  - id: expansion-loop
    title: Expansion is plausible through usage breadth, not publicly proven by cohorts
    body: >-
      The product naturally exposes several land-and-expand surfaces. A customer can begin with a
      fixed trial prompt set, progress through enterprise procurement, deploy recurring prompt and
      citation monitoring, act on recommendations, and then add engines, competitors, keywords,
      markets, or automated workflows. Sacra specifically describes increased usage across
      keywords, competitors, and AI platforms plus upsells into agent monitoring and content
      workflows as revenue-growth mechanisms. The official walkthrough supports the operational
      sequence from monitoring through action. This is a credible product-led expansion design,
      not evidence that expansion actually occurs: Profound publishes no cohort, plan migration,
      usage growth, NRR, or upsell-rate data. The investment case therefore needs customer-level
      records linking initial scope, later scope, renewal, and realized value.
    claimRefs: [CU005, CU012, CU016]
    figureRefs: [FU001]
