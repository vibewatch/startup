chapter:
  number: 3
  title: "Competitors"
  summary: >-
    Profound is differentiated by an enterprise-oriented combination of multi-engine
    monitoring, citation analysis, prompt-demand data, crawler analytics, and agentic
    workflows, but the category is already crowded with specialist monitors, SEO-suite
    extensions, lower-friction tools, and internal-build substitutes. The strongest
    competitive risk is not a single feature-for-feature rival; it is price-transparent
    alternatives and incumbent distribution eroding the premium for Profound's integrated
    depth while current pricing and independent benchmark evidence remain incomplete.
sections:
  - id: "landscape-and-buyer-choice"
    title: "A crowded market organized around buyer maturity"
    body: >-
      Buyers can solve the AI-visibility job through purpose-built AEO platforms, extensions
      to an existing SEO or marketing suite, lighter monitoring tools, agency-supported
      workflows, or manual prompt checks and internal dashboards. Profound's own guide names
      nineteen platforms, so category leadership should not be confused with an uncontested
      market. The practical segmentation is by operating model: regulated enterprises may
      value broad engine coverage, governance, integrations, and dedicated support, while
      smaller teams and agencies can favor fast onboarding, published entry pricing, and
      focused monitoring. Status-quo spreadsheets and internal scripts remain credible for
      narrow prompt sets, although they must recreate scheduling, normalization, citation
      history, and reporting. The evidence base is directionally useful but interested:
      official comparisons, competing vendors, and agencies dominate, with no independent
      head-to-head product benchmark in the assigned corpus.
    claimRefs:
      - "CP002"
      - "CP005"
      - "CP006"
      - "CP007"
      - "CP010"
      - "CP011"
      - "CP014"
      - "CP015"
    tableRefs:
      - "TP001"
    figureRefs:
      - "FP001"
  - id: "capability-and-distribution"
    title: "Depth is the moat; distribution is the attack surface"
    body: >-
      Profound's defensible wedge is the breadth of the operating loop rather than simple
      mention tracking. Its documentation combines prompt monitoring, answer-engine
      visibility, citation tracking, competitive benchmarking, and recommendations through
      Agents. Company-affiliated comparisons add real-user prompt data, crawler analytics,
      integrations, and enterprise controls, but those superiority claims are not
      independent benchmarks. Peec is repeatedly positioned as easier to configure and more
      execution-oriented, while Semrush, HubSpot, Ahrefs, and other incumbents can distribute
      baseline AI visibility into tools customers already buy. This creates a durability
      test: Profound must keep proprietary data and workflow depth sufficiently ahead of
      suite add-ons to justify a separate procurement process. The assigned evidence does
      not establish comparative accuracy, response coverage, or realized customer outcomes
      under a common test protocol.
    claimRefs:
      - "CP001"
      - "CP005"
      - "CP006"
      - "CP007"
      - "CP009"
      - "CP010"
      - "CP012"
      - "CP015"
    tableRefs:
      - "TP002"
  - id: "pricing-switching-and-multihoming"
    title: "Packaging can outweigh feature leadership"
    body: >-
      The latest retained review reports that Profound had returned to a sales-led structure
      by October 2026: a seven-day trial and custom Enterprise pricing replaced the
      self-serve Starter and Growth tiers shown earlier in the year. Other 2026 sources still
      quote entry prices between $82.50 and $99 per month and a $332.50 to $399 Growth tier,
      so those numbers are historical or conflicting rather than a reliable current rate
      card. This opacity strengthens lower-friction rivals during initial evaluation and
      makes realized contract economics a diligence gap. Switching costs can still grow once
      teams accumulate prompt histories, reporting conventions, connectors, governance
      approvals, and content workflows. Multi-homing is structurally likely because Profound
      is not a full traditional SEO replacement, leaving buyers to keep an SEO suite while
      adding AEO measurement or to combine a monitor with internal execution.
    claimRefs:
      - "CP003"
      - "CP004"
      - "CP008"
      - "CP012"
      - "CP013"
    tableRefs:
      - "TP003"
  - id: "durability-verdict"
    title: "Competitive verdict and diligence priorities"
    body: >-
      Profound appears strongest where the customer needs enterprise governance, broad
      answer-engine coverage, deep diagnostic data, and workflows that connect measurement
      to action. Its moat is less durable for buyers who need only visibility reporting,
      because Peec, Otterly, HubSpot, and SEO-suite add-ons can satisfy narrower jobs with
      simpler adoption or familiar distribution. The adverse case is gradual
      commoditization: monitoring metrics converge, incumbents bundle acceptable features,
      and agencies or internal teams supply the optimization layer. The upside case requires
      Profound's prompt-demand corpus, crawler intelligence, and agentic integrations to
      produce measurably better decisions and retention. Before underwriting durability,
      diligence should obtain a current official rate card, cohort-level win/loss and churn
      by competitor, a common-prompt accuracy benchmark, connector usage, time-to-value, and
      customer evidence separating software contribution from agency or content execution.
    claimRefs:
      - "CP001"
      - "CP003"
      - "CP005"
      - "CP007"
      - "CP008"
      - "CP009"
      - "CP012"
      - "CP013"
      - "CP015"
      - "CP016"
