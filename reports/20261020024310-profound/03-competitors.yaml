        - label: "Internal build"
          x: 3
          y: 2
          detail: "High control for narrow scopes but substantial custom work for sustained breadth."
    approximationNotes: >-
      Analyst-authored ordinal scores from 1 (low) to 5 (high), using qualitative packaging,
      onboarding, integration, security, and workflow evidence; these are not measured product
      performance or an independent benchmark. X measures buying accessibility and Y measures
      enterprise depth.
