company:
  name: Profound
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Profound addresses an emerging enterprise software category at the intersection of
    AI-answer visibility, SEO analytics, and content workflow automation. The evidence
    supports a large adjacent search-marketing budget pool and urgent measurement need,
    but it does not support a standalone AEO software TAM, SAM, or SOM; current buyer fit
    is strongest where a large marketing organization can fund both the platform and the
    people or services required to act on its output.
sections:
  - id: market-boundary
    title: Market boundary and substitutes
    body: >-
      The investable market should be bounded as software that monitors and improves how
      brands appear in AI-generated answers, including prompt monitoring, answer-engine
      visibility, citation tracking, competitive benchmarking, and recommendations.
      Profound's own walkthrough confirms that functional perimeter. It should not be
      sized as all search advertising, all SEO software and services, or all content
      production: those are adjacent budget pools, not equivalent products. Managed AEO
      execution, legacy SEO suites with AI modules, public self-serve trackers, and manual
      prompt testing are complements or substitutes depending on the buyer's operating
      model. This distinction matters because monitoring software does not itself earn
      citations or publish the work needed to change measured visibility.
    claimRefs: [CM005, CM013, CM014, CM015]
    tableRefs: [TM001]
  - id: evidence-constrained-sizing
    title: Evidence-constrained sizing
    body: >-
      Available evidence establishes scale in the surrounding search economy, not a
      standalone AEO-software market. The DataStory reports an estimated $190 billion of
      U.S. search-ad spending in 2025, equal to 33% of U.S. digital advertising, and cites
      an estimate of roughly $100 billion per year for SEO software and services. It also
      reports AI platforms at about 1% of website referral traffic and relays a Gartner
      forecast that traditional search will fall 25%, but the article does not state that
      forecast's horizon. These figures use different denominators and cannot be stacked
      into TAM, SAM, and SOM. They are demand and substitution signals only. A defensible
      sizing model still requires category revenue, enterprise contract values, buyer
      counts, and adoption rates.
    claimRefs: [CM001, CM002, CM003, CM004, CM016]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyer-user-payer
    title: Buyer, user, and payer segmentation
    body: >-
      The core economic buyer is a CMO, VP of Marketing, or Head of Digital Marketing
      accountable for discoverability and budget allocation; daily users are SEO, content,
      PR, analytics, and demand-generation teams. The DataStory describes a second primary
      user in the content or SEO lead who decides what to publish and how to optimize it.
      Independent and commercially adjacent reviews converge on strongest fit among
      growth-stage companies, enterprises, and agencies, while smaller teams face a
      weaker fit when they need inexpensive self-service coverage or lack staff to act on
      recommendations. The payer is therefore normally the marketing organization, but
      adoption requires an explicit workflow owner rather than a passive dashboard buyer.
    claimRefs: [CM006, CM007, CM008, CM010, CM012]
    tableRefs: [TM003]
  - id: drivers-constraints-and-valuation-relevance
    title: Drivers, constraints, and valuation relevance
    body: >-
      Adoption is driven by the migration of product discovery into AI answers, the loss
      of click-through visibility, and the need to compare brand presence across engines
      using repeatable data rather than manual prompts. Constraints are equally material:
      Profound returned to custom enterprise pricing by October 2026, its short trial
      cannot demonstrate month-over-month movement, and benefits depend on content,
      communications, or agency capacity outside the measurement layer. Category crowding
      is also rapid: Blastra counted more than 650 G2 AEO listings on October 4, 2026 and
      placed Semrush ahead of Profound by G2 Score. Valuation should therefore reflect a
      potentially important new analytics category, but not capitalize the entire adjacent
      search economy or assume early category leadership guarantees durable share.
    claimRefs: [CM009, CM010, CM011, CM012, CM013, CM014, CM016]
