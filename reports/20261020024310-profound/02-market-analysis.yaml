      enterprise product scope without presenting them as nested TAM, SAM, or SOM.
    data:
      items:
        - label: U.S. search-ad spending
          value: "$190B"
          period: "2025"
          detail: Secondary estimate reported by The DataStory
        - label: Search share of U.S. digital ads
          value: "33%"
          period: "2025"
          detail: Same broad advertising denominator; not AEO software
        - label: SEO software and services spending
          value: "~$100B/year"
          period: Not stated
          detail: Estimate varies and includes services
        - label: AI-platform share of website referrals
          value: "~1%"
          period: Current at source publication
          detail: Traffic-share signal rather than spend
        - label: Traditional-search change forecast
          value: "-25%"
          period: Horizon not stated
          detail: Gartner forecast relayed by The DataStory
        - label: Profound Enterprise engine coverage
          value: "Up to 9"
          period: October 2026
          detail: Product scope reported by AEO Labs
    approximationNotes: >-
      Metrics are reproduced with their original units and qualifications. They are not
      additive or nested, and no visual level should be interpreted as TAM, SAM, or SOM.
    claimRefs: [CM001, CM002, CM003, CM004, CM009, CM010]
callouts:
  - calloutType: risk
    title: Do not capitalize the adjacent search economy as AEO TAM
    body: >-
      The retained evidence supports urgency and a large surrounding budget pool, but not
      category revenue, contract-value distribution, buyer count, or adoption inputs for a
      standalone software TAM. These missing denominators are a material valuation gap.
    claimRefs: [CM001, CM002, CM003, CM004, CM016]
