company:
  name: "Profound"
chapter:
  number: 7
  title: "Risks"
  summary: >-
    Profound's principal public-evidence risks are execution pressure after a rapid financing cadence,
    dependence on changing answer engines, opaque enterprise pricing, and the operating burden required
    to convert visibility data into outcomes. SOC 2 Type II and daily backups are positive controls, but
    contract-level privacy, recovery, incident, concentration, and retention evidence remains unavailable.
sections:
  - id: "ranked-risk-picture"
    title: "Ranked risk picture"
    body: >-
      The highest residual exposure is execution rather than a documented legal event. TechCrunch reported
      a $180 million Series D at a $1.8 billion valuation less than seven months after a $96 million Series C,
      while attributing threefold six-month revenue growth and more than 1,000 enterprise customers to the
      company. That combination raises the operating bar without disclosing retention, gross margin, customer
      concentration, or contract economics. The second cluster is product and category dependency: Profound
      itself says AI answers vary enough to require daily prompt runs, while Blastra observed more than 650
      products in G2's AEO category and Profound behind Semrush by G2 Score on October 4. The heatmap is
      qualitative, uses only public signals, and does not claim measured incident probabilities.
    claimRefs: [CR001, CR004, CR005, CR006, CR007, CR014, CR015]
    tableRefs: [TR002]
    figureRefs: [FR001]
  - id: "legal-security-and-recovery"
    title: "Legal, security, and recovery posture"
    body: >-
      Public evidence shows meaningful controls but not a complete legal or resilience record. Profound says
      Answer Engine Insights is SOC 2 Type II compliant, supports SSO and role-based access control, and creates
      daily backups retained for one week. These claims reduce procurement friction, but they do not disclose
      the audit scope, exceptions, recovery-point and recovery-time objectives, subprocessor obligations,
      breach-notification terms, data residency, or incident history. The assigned pool also did not produce a
      regulator, court, or enforcement record specific to Profound; that is an evidence gap, not proof that no
      event exists. Investment diligence should therefore obtain the SOC report, DPA, subprocessor list,
      penetration-test summary, insurance certificate, incident register, and contractual recovery commitments.
    claimRefs: [CR002, CR003]
    tableRefs: [TR001]
  - id: "dependencies-and-commercial-model"
    title: "Platform, partner, and commercial dependencies"
    body: >-
      Profound sits between enterprise customers and answer engines it does not control. Its own product page
      says tracked prompts run daily because AI platforms do not return the same answer twice, so methodology,
      browser access, model interfaces, and engine policies are continuing dependencies. Packaging also creates
      procurement risk: AEO Labs and DerivateX describe a seven-day trial followed by custom enterprise pricing,
      and DerivateX says public information is insufficient to calculate cost per 1,000 answers. Finally, the
      customer must fund the work after measurement. DerivateX argues that trackers do not themselves publish
      pages or earn third-party citations and that an unowned dashboard repeats the same gap. This makes renewal
      quality dependent on customer staffing and measurable workflow adoption, not only dashboard accuracy.
    claimRefs: [CR001, CR008, CR009, CR010, CR012, CR013, CR016]
    tableRefs: [TR003]
  - id: "mitigations-monitors-and-kill-criteria"
    title: "Mitigations, monitors, and thesis-break criteria"
    body: >-
      Diligence should convert the public signals into measurable covenants. Require quarterly disclosure of
      gross retention, net retention, cohort expansion, top-ten customer concentration, gross margin, cash burn,
      and enterprise sales-cycle length; funding raised is not cash available and reported revenue growth is not
      ARR. For reliability, monitor prompt-run completion, export latency, integration failures, source coverage,
      recovery tests, and material security events by severity. For product value, pre-register a representative
      prompt set and compare visibility, citation quality, and downstream pipeline over at least one quarter rather
      than extrapolating from the seven-day trial. Thesis-break triggers are a material unresolved security event,
      failure to provide contract-grade controls, worsening retention despite reported customer growth, or two
      consecutive quarters in which customer outcomes fail to justify the custom enterprise cost and staffing load.
    claimRefs: [CR003, CR006, CR007, CR009, CR010, CR011, CR012]
