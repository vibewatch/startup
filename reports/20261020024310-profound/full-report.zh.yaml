  - id: FU001
    title: 从评估到潜在扩张的客户旅程
    type: journey-map
    summary: 公开的产品和定价页面暗示了一条六阶段企业旅程，但转化和 cohort 证据仍不可得。
    data:
      nodes:
        - id: evaluate
          label: 评估
          detail: 在 3 个答案引擎上运行 7 天基线测试。
          touchpoints:
            - Free Trial
            - 50 daily prompts
        - id: scope
          label: 界定范围
          detail: 定义品牌、prompts、竞争对手、引擎和报告需求。
          touchpoints:
            - Prompt monitoring
            - Competitive benchmarking
        - id: procure
          label: 采购
          detail: 获取定制报价并完成企业控制审查。
          touchpoints:
            - Demo and quote
            - SSO/SAML
            - SOC 2
        - id: monitor
          label: 监测
          detail: 跟踪可见度、引用、情绪和竞争地位。
          touchpoints:
            - Answer Engine Insights
            - Citation tracking
        - id: act
          label: 行动
          detail: 用建议和 Agent 工作流确定市场营销工作的优先级。
          touchpoints:
            - Actionable recommendations
            - Agents
        - id: expand
          label: 扩张
          detail: 增加 prompts、竞争对手、引擎、市场或高级工作流。
          touchpoints:
            - Usage breadth
            - Workflow upsell
    approximationNotes: 阶段顺序是对已发布产品和购买页面的分析性综合，不是实测漏斗；不代表任何转化率、时长或价值。
    claimRefs:
      - CU005
      - CU012
      - CU016
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 按可能性信号、投资影响和公开缓释成熟度，对 6 项有证据支撑的风险进行定性定位；各单元格是序数判断，不是实测概率。
    data:
      columns:
        - label: 可能性信号
        - label: 投资影响
        - label: 公开缓释成熟度
      rows:
        - label: 融资后的执行预期
          values:
            - label: 偏高
              detail: Series C 到 D 的节奏很快，加之公司自报增长，抬高了交付门槛。
            - label: 高
              detail: 如果无法把资本和增长转化为持久的经济性，投资论点会受损。
            - label: 未公开
              detail: 指定来源池未披露烧钱、利润率、留存和集中度控制。
        - label: 答案引擎波动
          values:
            - label: 持续存在
              detail: Profound 表示，引擎不会两次返回完全相同的答案。
            - label: 高
              detail: 覆盖范围或方法论漂移会影响核心测量产品。
            - label: 中等
              detail: 每日运行和来源追踪可以缓解，但无法控制上游平台。
        - label: 客户执行带宽
          values:
            - label: 偏高
              detail: 独立分析称，没有责任人的追踪器只会反复暴露同一个缺口。
            - label: 高
              detail: 运营采用疲弱会威胁结果证明和续约。
            - label: 中等
              detail: Agent 和建议能支持行动，但不会自主发布内容或获得投放位置。
        - label: 商业不透明
          values:
            - label: 当前
              detail: 当前公开方案是短期试用，之后转为企业定制报价。
            - label: 中高
              detail: 不透明的单位成本可能拖慢采购，并使 ROI 证明更复杂。
            - label: 低
              detail: 没有公开的付费价格或每个答案的成本分母。
        - label: 产品可靠性
          values:
            - label: 据报道，未量化
              detail: 一份第三方评测提到反复出现的 bug、集成问题和导出缓慢。
            - label: 中等
              detail: 工作流中断会削弱报告能力和信任。
            - label: 不明确
              detail: 未公开事件频率、正常运行时间序列或严重程度分母。
        - label: 竞争拥挤
          values:
            - label: 当前
              detail: Blastra 在 October 2026 观察到 G2 上超过 650 个 AEO 产品条目。
            - label: 高
              detail: 套件厂商可以捆绑相邻的 SEO 能力，给专业厂商施压。
            - label: 中等
              detail: Profound 保有企业级深度，但缺少公开的切换成本证据。
    approximationNotes: 序数标签综合截至 2026-10-20 的引用证据和明确缺口；它们不是数值概率、经审计的控制评级或事件频率预测。
    claimRefs:
      - CR001
      - CR003
      - CR004
      - CR005
      - CR008
      - CR011
      - CR012
      - CR014
      - CR015
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 这条顺序决策链把产品证明与融资估值分开，最后给出有条件的进一步研究建议。
    data:
      nodes:
        - id: product-proof
          label: 产品证明
          detail: 官方文档展示了监测、引用、基准比较和 Agent 工作流。
        - id: reported-scale
          label: 已披露规模
          detail: 多个来源重复提到超过 1,000 家企业客户，以及收入在六个月内增至原来的三倍，均为公司自报数字。
        - id: missing-denominators
          label: 缺失的分母
          detail: 保留证据中没有审计后的 ARR、留存、利润率、cohort 和集中度数据。
        - id: financing-mark
          label: 融资估值
          detail: 约 7 个月前以 $1.0B 完成 $96M 的 Series C，随后以 $1.8B 完成 $180M 的 Series D。
        - id: downside-tests
          label: 下行测试
          detail: 定制化定价、低价替代品和拥挤的品类，都在挑战倍数的持久性。
        - id: recommendation
          label: 进一步研究
          detail: 投资前，必须先拿到一手财务、股权结构表、优先股堆叠和回报证据。
    approximationNotes: 该序列用于分析，并不按价值比例排列；它不赋予情景概率，也不提供公允价值区间。
    claimRefs:
      - CV004
      - CV005
      - CV006
      - CV007
      - CV008
      - CV009
      - CV010
      - CV011
      - CV013
      - CV016
