              Profound 夹在企业客户与其无法控制的答案引擎之间。产品页称，由于 AI 平台不会两次返回完全相同的答案，追踪提示词每天运行；
              因此方法论、浏览器访问、模型接口和引擎政策都构成持续依赖。产品包装也带来采购风险：AEO Labs 和 DerivateX 描述了七天试用 之后的企业定制报价，DerivateX 还称公开信息不足以计算每
              1,000 个答案的成本。更重要的是，测量之后的执行工作仍需客户投入。 DerivateX 认为，追踪器本身不会发布页面或获取第三方引用，没有负责人管理的仪表盘会重复同一缺口。因此，续约质量依赖客户人手
              和可量化的工作流采用，而不只是仪表盘准确性。
            claimRefs:
              - CR001
              - CR008
              - CR009
              - CR010
              - CR012
              - CR013
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
