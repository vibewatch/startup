  - id: FE001
    title: Profound 功能型产品栈
    type: stack
    summary: 展示需求输入如何经过捕获和分析，转化为受治理的行动。
    data:
      layers:
        - label: 需求输入
          items:
            - 真实世界查询数据集
            - 客户定义的 prompts
          detail: 定义平台测量的对象；公开来源细节不完整。
        - label: 每日答案捕获
          items:
            - 浏览器体验采样
            - 多引擎响应收集
          detail: Profound 表示，所跟踪的 prompts 每日运行，响应来自面向客户的浏览器体验。
        - label: 答案智能
          items:
            - 可见度和声量份额
            - 情绪和叙事
            - 引用和 FactCheck
          detail: 把捕获的答案转化为可监测的品牌和竞争对手信号。
        - label: 网站智能
          items:
            - AI 爬虫活动
            - 页面级访问
            - 引荐分析
          detail: 据描述，Agent Analytics 使用服务器日志和基础设施集成。
        - label: 行动层
          items:
            - Agent
            - 内容优化
            - 优先级建议
          detail: 把识别出的缺口转化为工作，但仍需人工制定策略和审核。
        - label: 企业控制
          items:
            - SSO 和基于角色的访问
            - SOC 2 Type II
            - API 和导出
          detail: 支持采购和受治理的部署；当前控制证据仍需尽调。
    approximationNotes: 根据公开描述提炼的功能抽象；内部服务、数据存储和网络拓扑未披露。
