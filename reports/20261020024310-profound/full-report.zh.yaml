      - number: '7.4'
        title: 缓释措施、监测指标与论点失效标准
        blocks:
          - type: paragraph
            body: >-
              尽调应把公开信号转成可量化的契约条款。要求按季度披露毛留存率、净留存率、群组扩张、前十客户集中度、毛利率、现金烧钱和企业 销售周期长度；已募集资金不是可用现金，报道收入增长也不是
              ARR。可靠性方面，应监测提示词运行完成率、导出延迟、集成失败、来源 覆盖率、恢复测试，以及按严重程度划分的重大安全事件。产品价值方面，应预先登记一组有代表性的提示词，至少观察一个季度的可见度、
              引用质量和下游销售管道，而不是从七天试用外推。论点失效触发条件包括重大且未解决的安全事件、无法提供合同级控制、即使客户增长 报道良好留存仍恶化，或连续两个季度客户结果不足以证明企业定制成本和人力负担合理。
            claimRefs:
              - CR003
              - CR006
              - CR007
              - CR009
              - CR010
              - CR011
              - CR012
      - number: '7.5'
        title: 图表
        blocks:
          - type: callout
            title: 快速融资提高了证明门槛
            body: $1.8B 估值下的 $180M Series D，距 $96M Series C 不到七个月。应把这种节奏视为执行预期，而不是现金 runway、ARR、毛利率或客户持久性的证据。
            calloutType: risk
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
          - type: callout
            title: 用非公开证据为投资论点设门槛
            body: 在评估公开增长叙事或企业控制说法前，必须取得留存率、集中度、单位经济性、事故历史、恢复测试和合同级安全文件。
            calloutType: recommendation
