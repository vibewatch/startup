              - CO014
      - number: '1.2'
        title: 创始人主导，但治理透明度有限
        blocks:
          - type: paragraph
            body: >-
              公开证据确认 James Cadwallader 和 Dylan Babbs 是创始人，Cadwallader 还被列为 CEO；但指定来源无法确认 Babbs 当前的运营职务，
              也没有披露更广泛的高管团队、董事名单、委员会架构、投资人观察员权利或继任安排。这留下了一个重要的关键人问题：公司公开的 品类叙事和重大活动露面都与 Cadwallader
              紧密相关，但现有证据不足以量化创始人以下的决策权和客户关系如何分配。领导层表格有意 保持不完整，不应被理解为完整的管理层名单。要得出治理或业务连续性结论，还需要公司注册证书、现任董事会同意书、组织架构图、
              雇佣协议和关键人条款等一手证据。
            claimRefs:
              - CO007
              - CO008
          - type: table
            tableRef: TO002
            claimRefs:
