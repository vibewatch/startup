  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资判断与入场纪律
        blocks:
          - type: paragraph
            body: >-
              当前公开融资参考是 2026 年 9 月 15 日完成的 Series D：融资 $180 million，据报道估值 $1.8 billion；约七个月前的 Series C 融资 $96 million，估值
              $1.0 billion。 短时间内 headline 估值上涨 80%，而据报道累计募资已超过 $335 million。现有证据还重复了公司口径的六个月收入增至原来的三倍和超过 1,000 家企业客户，
              但没有提供经审计的 ARR、净留存率、毛利率、客户群组经济性或完全摊薄资本结构。因此正确的判断是继续研究，而不是买入：把 $1.8 billion 视为融资定价，
              而非独立确立的公允价值；任何投资都应以一手财务和股权结构表证据为条件。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV009
              - CV010
              - CV013
              - CV016
