        - 营销负责人 / AI 搜索运营人员 / 企业采购
        - 多引擎可见度、报告、Agents 和归因
        - 定制 Enterprise 方案；最多支持 9 个答案引擎
        - 表面上最匹配，且交易规模潜力最高
        - 未披露 ACV、部署数量或细分收入
      - - 试用阶段评估者
        - 营销从业者 / 潜在预算负责人
        - 覆盖 3 个引擎的 7 天基线
        - 每日运行 50 个 prompts，持续 7 天
        - 低摩擦地进入演示环节
        - 未披露试用转付费转化率或激活数据
      - - 受监管企业
        - 营销团队及安全、IT 和采购部门
        - 带企业控制的可见度监测
        - 宣传支持 SSO/SAML 和 SOC 2；Sacra 提到 U.S. Bank
        - 支持规模更大、采购环节更重的部署
        - 未披露安全审查周期、合同规模或生产范围
      - - 中型市场或小团队
        - 精简营销团队 / 直接预算负责人
        - 自助式可见度跟踪
        - 当前付费定价为定制报价；未显示付费自助档位
        - 存在潜在需求，但当前产品包装匹配度较弱
        - 未披露当前细分客户采用率或流失证据
    notes: 细分来自当前官方产品包装和独立买方匹配评测的推断；定量字段为 null 时不作估算，Sacra 对自助服务的描述按历史信息而非当前情况处理。
    claimRefs:
      - CU001
      - CU003
      - CU004
      - CU006
      - CU007
      - CU010
  - id: TU002
    title: 具名客户证明表
    columns:
      - 信号
      - 价值 / 客户
      - 证据日期
      - 证据质量
      - 能支持的判断
      - 缺失分母或限制
    rows:
      - - 产品评估
        - 免费试用：在 3 个引擎上每日运行 50 个 prompts，持续 7 天
        - 截至 2026-10-20 有效
        - 高：官方页面获两份独立评测佐证
        - 一条真实、低承诺的评估路径
        - 没有完成率、转化率或付费激活率
      - - 选型推荐语
        - Statsig
        - 当前官方定价页面
        - 中：Profound 发布的客户引述
        - 一名具名买方称其在测试替代方案后选择了 Profound
        - 没有合同规模、部署范围、期限或结果
      - - 受监管企业示例
        - U.S. Bank
        - Sacra 画像反映 2025 年信息
        - 中：独立分析师画像
        - 说明其与企业安全和合规需求的相关性
        - 没有直接客户陈述、生产范围或结果
      - - 支持关系
        - CRS
        - 未注明日期的 2026 年官方比较文章
        - 中：Profound 发布的客户引述
        - 具名营销负责人描述了战略支持
        - 没有使用指标、续约证据或量化结果
    notes: 这是公开信号的部分阶梯，而非完整客户名单；具名引用与生产规模及结果证明分开，后两者仍未披露。
    enumerationScope:
      coverage: sample
      basis: Publicly retained evidence available to this chapter as of 2026-10-20.
    claimRefs:
      - CU002
      - CU007
      - CU008
      - CU009
  - id: TU003
    title: 持续性、扩张与集中度尽调
    columns:
      - 维度
      - 公开证据
      - 当前判断
      - 投资含义
      - 所需尽调证据
    rows:
      - - 留存
        - 未找到 NRR、GRR、logo 流失、续约或合同期限指标
        - 未验证
        - 公开证据不足以支撑溢价 SaaS 倍数
        - 客户级续约文件及按方案划分的队列留存
      - - 扩张
        - 更多关键词、竞品、平台和高级工作流被视为使用杠杆
        - 机制有支持；实际扩张尚未验证
        - 如果覆盖广度转化为付费消费，则存在上行空间
        - 起始范围与当前范围、扩张 ARR 和使用队列
      - - 集中度
        - 未披露头部客户、前 10 大客户、行业、地域或渠道份额
        - 未验证
        - 无法量化收入脆弱性和对企业客户的依赖
        - 收入集中度表和续约日历
      - - 采购与验证
        - 短期、3 引擎 Trial 后提供付费定制报价
        - 对小团队形成明显摩擦；符合企业客户定位
        - 可能提高交易规模，同时拉长销售周期
        - 销售周期中位数、价值验证通过率和流失原因
      - - 衡量可靠性
        - 概率型 AI 响应会随时间、prompts 和模型更新而变化
        - 客户 ROI 存在类别风险
        - 可复现性弱可能压制采用或续约
        - 重测方法和客户结果归因
    notes: 这些判断区分了有证据支持的产品机制与缺失的运营指标；本表不估算留存、集中度、转化或销售周期数值。
    claimRefs:
      - CU011
      - CU012
      - CU013
      - CU014
      - CU015
  - id: TR001
    title: 监管 / 法律风险登记表
    columns:
      - 规则、许可证或案件
      - 管辖区
      - 公开状态
      - 可能性信号
      - 严重性
      - 缓解措施
      - 剩余风险
      - 尽调路径
    rows:
      - - 隐私与安全保障（DPA、子处理商、泄露通知）
        - 客户合同和数据管辖区
        - SOC 2 Type II 为公司自述；指定证据中没有合同条款
        - 未确认
        - 对受监管企业买方可能较高
        - 公开描述了 SOC 2、SSO 和基于角色的访问控制
        - 审计范围、例外、数据驻留和通知条款仍未知
        - 获取 SOC 2 报告、DPA、子处理商名单、渗透测试摘要和事件登记表
      - - 业务连续性与数据恢复承诺
        - 客户合同和适用的韧性规则
        - 每日备份、留存一周为公司自述
        - 取决于配置和合同
        - 如果客户恢复预期超过公开陈述，则为中到高
        - 每日备份流程
        - 指定来源池中没有公开 RPO、RTO、恢复测试结果或更长留存承诺
        - 测试恢复；审查 RPO、RTO、留存、灾难恢复和保险条款
      - - AI 衍生的衡量与呈现准确性
        - 营销、消费者保护和客户合同制度
        - Profound 称 AI 答案会在不同运行间变化，并提供 FactCheck 和每日抽样
        - 方法论风险持续存在
        - 中等；当输出用于受监管主张或支出决策时更高
        - 每日运行 prompts、溯源和 FactCheck 流程
        - 单个仪表板无法消除抽样和方法论风险
        - 审查方法论、抽样控制、客户披露、错误处理和责任限制条款
    notes: 截至 2026-10-20 的部分公开证据登记表；指定来源池中没有针对 Profound 的监管机构或法院来源，因此未观察到的案件记录为缺口，而非视为不存在。
    enumerationScope:
      coverage: partial
      basis: Public controls and unresolved legal or contractual topics visible in the assigned 2026 source pool.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR008
      - CR009
  - id: TR002
    title: 运营 / 质量 / 安全风险登记表
    columns:
      - 失效模式
      - 可能性信号
      - 严重性
      - 缓解成熟度
      - 剩余风险
      - 监测项
      - 未解决缺口
    rows:
      - - 答案引擎输出在重复运行间发生变化
        - 公司称各平台不会两次返回完全相同的答案
        - 如果抽样不具代表性，则分析影响较高
        - 每日运行和源级溯源已经产品化
        - 引擎变化和浏览器行为不受 Profound 控制
        - 运行完成情况、引擎覆盖、方差和方法变化
        - 指定来源池中没有公开的独立准确性或可复现性基准
      - - 备份窗口可能不匹配企业恢复需求
        - 公司称每日备份保留一周
        - 取决于合同和数据关键程度，风险为中到高
        - 存在备份控制；恢复测试未公开
        - RPO、RTO、恢复成功率和更长留存均未知
        - 恢复测试通过率和恢复时间
        - 合同级恢复证据属于私有信息或无法取得
      - - 界面、集成或导出能力下降
        - ReviewHuman 报告了反复出现的界面缺陷、集成问题和导出缓慢
        - 中等；可能损害报告节奏和工作流采用
        - 同一评测对支持评价积极，但缺陷指标未公开
        - 频率、持续时间和受影响客户分母未知
        - 支持工单、导出延迟、集成错误率和一级严重事件
        - 无法获得独立事件率和正常运行时间证据
      - - 客户未能将洞察落地
        - 独立机构分析称，无人负责的跟踪器会重复同一缺口
        - 通过较弱 ROI 和续约压力产生较高商业影响
        - Agent 和建议能推动行动，但不能替代责任人
        - 成效取决于人员配置、内容发布和第三方投放工作
        - 启用率、周活跃分析师数、建议完成率和可归因管道
        - 未披露公开的 cohort 留存率或结果分布
    notes: 可能性和严重程度是基于所引公开信号的定性分析判断，不代表事件频率、概率、服务水平测量值或经独立审计的控制结果。
    claimRefs:
      - CR001
      - CR003
      - CR011
      - CR012
      - CR013
  - id: TR003
    title: 合作伙伴 / 依赖风险登记表
    columns:
      - 依赖项
      - 交易对手方
      - 角色
      - 集中度
      - 失效情景
      - 严重程度
      - 缓释措施
      - 剩余暴露
    rows:
      - - 答案引擎的访问和行为
        - ChatGPT、Gemini、Google、Perplexity、Claude 及其他引擎
        - 提供可观测的答案和引用
        - 产品覆盖多个引擎，但每个引擎仍由外部控制
        - 政策、浏览器、界面或模型变化会削弱覆盖度或可比性
        - 高
        - 多引擎覆盖和每日重跑
        - 没有公开的引擎访问或输出稳定性合同控制
      - - 企业打包和采购
        - Profound
        - 设定价格、prompt 数量、引擎、API 和安全条款
        - 付费品牌定价需定制报价
        - 销售周期过长或报价缺乏经济性，会延迟采用并损害扩张
        - 中高
        - 免费 7 天试用，仅能有限评估
        - 单位成本和完整部署经济性无法从公开信息计算
      - - 执行负责人和内容工作流
        - 客户市场、公关、SEO 和内容团队
        - 把发现的缺口转化为内容和第三方引用
        - 可能集中在一个小型专业团队
        - 没有人负责落实发现，测量就无法改善结果
        - 高
        - Agent 和可执行建议减少手工工作
        - 发布、投放和组织跟进仍依赖客户
      - - 竞争分发和套件捆绑
        - Semrush 及大量 AEO 厂商
        - 争夺预算，并把 AI 可见性嵌入更广泛的技术栈
        - 该类别收录超过 650 个产品；在观察日，按 G2 Score，Semrush 领先 Profound
        - 既有厂商捆绑足够功能，压缩单独产品定价
        - 高
        - Profound 强调企业级深度、分析能力和工作流广度
        - 差异化的持久性和切换成本未公开量化
      - - 企业客户结构和续约质量
        - 公司自报超过 1,000 家企业客户
        - 提供经常性收入和客户背书
        - 头部客户占比和 cohort 留存率未披露
        - 大客户流失或扩张疲弱会削弱增长质量
        - 可能较高；可能性未知
        - 已披露的客户数量较广
        - NRR、GRR、合同期限、扩张情况和前十大客户集中度仍是尽调缺口
    notes: 仅在来源支持时才陈述集中度；否则，客户和平台集中度的分母标为 unknown，不根据客户标志或客户总数推断。
    claimRefs:
      - CR001
      - CR007
      - CR008
      - CR009
      - CR010
      - CR012
      - CR014
      - CR015
      - CR016
  - id: TV001
    title: 建议摘要
    columns:
      - 决策输入
      - 公开证据
      - 评估
      - 决策含义
    rows:
      - - 建议
        - 2026 年 9 月融资，估值 $1.8B；经营证据仍来自公司自报
        - 继续研究
        - 不要仅凭融资估值买入
      - - 置信度
        - 多个当前来源对该轮融资说法一致；缺少主要财务报表
        - 融资事实的置信度中等；公允价值的置信度低
        - 定价前必须完成一手尽调
      - - 风险评级
        - 估值快速上调、定制化定价和竞争加剧
        - 对估值和执行高度敏感
        - 使用保护下行的条款和里程碑门槛
      - - 估值立场
        - $1.0B 的 Series C 后约 7 个月完成 $1.8B 的 Series D
        - 相对于已披露证据，估值偏高
        - 谈判锚定在最新估值之下，或附条件接受
      - - 回报 / 退出
        - 保留的来源没有提供退出时间、完全摊薄持股比例、优先权或上市公司财务可比性
        - 缺乏公开依据
        - 收到资本结构表、cohort 和交易证据后再建模
    notes: 融资估值是第三方报道的轮次估值；评估属于分析判断。由于缺少所需分母和证券条款，没有计算基于 ARR 的倍数或目标回报。
    claimRefs:
      - CV001
      - CV002
      - CV007
      - CV009
      - CV010
      - CV013
      - CV016
  - id: TV002
    title: 正方论点与反方论点
    columns:
      - 立场
      - 论点
      - 证据信号
      - 哪些情况会改变判断
    rows:
      - - 正方
        - AEO 正在成为企业工作流
        - Profound 记录了监测、引用分析、基准比较和 Agent 建议
        - 有独立证据证明这些工作流能带来留存和可量化的客户结果
      - - 正方
        - Profound 融资势头强
        - $1.0B 的 $96M Series C 之后，又以 $1.8B 完成 $180M 的 Series D
        - 清晰的股权结构表，以及与估值跃升相匹配的增长质量
      - - 正方
        - 已披露的企业采用规模可观
        - 多个来源重复提到超过 1,000 家企业客户，且均标注为公司自报数字
        - 合同 ARR、集中度、cohort 留存和扩张证据
      - - 反方
        - 估值跑在已披露经营证据之前
        - 保留的来源中没有审计后的 ARR、NRR、毛利率或 cohort 经济性
        - 能支撑合理经常性收入倍数的审计指标
      - - 反方
        - 定价能力不透明
        - 企业付费定价需要定制报价，而低价竞争对手公开了价格
        - 即使采用溢价定价，续约和扩张仍然强劲
      - - 反方
        - 品类领导地位并不稳固
        - 目录分析报告称有超过 650 个解决方案，且按 G2 Score，Semrush 领先
        - 企业 cohort 中持续的赢单率和差异化结果
    notes: 这是基于当前保留来源搭建的决策框架；客户、收入和目录排名相关说法均保留归因，不视为经审计的经营结果。
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV005
      - CV006
      - CV007
      - CV008
      - CV010
      - CV011
      - CV014
      - CV015
  - id: TV003
    title: 乐观、基准和悲观情景
    columns:
      - 情景
      - 明确假设
      - 估值 / 回报逻辑
      - 概率信号
      - 下行情景或触发条件
    rows:
      - - 乐观
        - 已披露的收入和客户增长能与审计后的经常性收入对上；留存、扩张和利润率质量都很强
        - 只有一手指标证明增长持久且持股结果具备投资价值后，$1.8B 轮次之上的估值才有可能站得住
        - 已验证的 cohort 扩张、企业赢单和持久的产品差异化
        - 增长放缓、留存走弱，或持股比例被优先权负担摊薄
      - - 基准
        - Profound 仍是可信的企业平台，但竞争和定制化定价限制了对定价能力的判断
        - 仅将 $1.8B 作为最新融资参考；公开数据不足以支撑独立的公允价值区间
        - 续约和产品采用稳定，但利润率与 cohort 证据不完整
        - 在所需数据支撑一个对价格敏感的回报案例前，不要投资
      - - 悲观
        - 既有厂商缩小功能差距，低价工具限制定价，或已披露增长未能转化为高质量 ARR
        - 估值低于上一轮 $1.0B 参考值或出现降价轮融资都有可能，但无法根据保留证据量化
        - 品类地位下滑、扩张疲弱、让利增加，或融资附带结构化条款
        - 如果一手数据无法与已披露规模或普通股经济性对上，就暂停或拒绝投资
    notes: 情景边界仅把观察到的两次 2026 年私募融资估值作为参考；这不是公允价值估计，概率权重是定性的，目标回报仍存在证据缺口。
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV005
      - CV007
      - CV008
      - CV009
      - CV010
      - CV011
      - CV014
