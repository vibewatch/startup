figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: Profound 在早期获得品类认可后融资提速，而可见的竞争格局在 2026 年明显拥挤。
    data:
      items:
        - date: '2024'
          label: 公司成立
