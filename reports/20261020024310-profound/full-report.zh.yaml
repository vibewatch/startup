chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与产品边界
        blocks:
          - type: paragraph
            body: >-
              Profound 位于 AI 营销与答案引擎优化的交叉地带。公司官网以 AI Marketer 为核心介绍公司，并将平台描述为集可见度测量、
              流量分析、内容工作流、竞争基准和企业控制于一体。产品文档进一步明确了运行闭环：监测提示词，衡量答案引擎可见度与情绪，
              追踪引用，比较竞争对手，再把建议转成智能代理工作流。外部评测普遍认可其分析驱动、面向企业用户，但也提醒产品深度可能超过
              小团队的需求和执行能力。因此，这项业务更适合被理解为以试用为入口、品牌价格定制的企业软件，而不是已公开透明的低接触 SaaS
              价目表。指定证据中没有法律地址或注册记录，因此保留纽约作为报道中的总部所在地，而非已核实的注册办公地址。
