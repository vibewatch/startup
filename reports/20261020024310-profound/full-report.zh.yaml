              - CV016
      - number: '8.2'
        title: 投资论点、反论点与竞争持久性
        blocks:
          - type: paragraph
            body: >-
              投资论点建立在真实的企业工作流上，而不只是融资。Profound 自己的文档介绍提示词监测、答案引擎可见度、引用追踪、竞争基准和
              智能代理建议；第三方评测则将付费方案描述为面向企业，覆盖广泛引擎并具备采购功能。反论点是，品类领先未必能转化为持久的定价权。 公开比较显示有明显更便宜的追踪器，公司已回到企业定制报价；一份目录分析称，2026 年
              10 月 G2 品类已扩展到超过 650 个解决方案， 且按 G2 Score，Semrush 排在 Profound 之前。因此，持久留存、扩张和可归因的客户结果，必须比品牌认知或评测数量更受重视。
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV011
              - CV012
              - CV014
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV010
              - CV011
              - CV014
              - CV015
      - number: '8.3'
        title: 情景框架与可比参考
        blocks:
          - type: paragraph
            body: >-
              公开证据支持情景条件，但不足以给出精确的公允价值区间。最近几轮非上市融资提供了两个可观察参考点：2026 年 2 月的 10 亿美元 和 2026 年 9 月的 18
              亿美元。产品比较提供的是经营背景，而非估值可比：低价供应商公开入门价格，Profound 则把最广覆盖和企业
              控制留给定制报价。乐观情景要求报道中的客户和收入轨迹转化为经验证的留存、扩张和利润率质量。基准情景假设企业产品可信，
              但不支持进一步加价。悲观情景是倍数压缩或下轮融资，触发因素包括成熟厂商补齐功能差距、价格透明度变得重要，或报道增长无法与持久的经常性收入相勾稽。
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: 退出准备度、尽调要求与论点失效触发条件
        blocks:
          - type: paragraph
            body: >-
              现有公开记录无法证明退出准备度。大额融资和企业采用可以支持未来的战略或公开市场选择权，但没有证券层面的条款、持股、清算优先权、
              债务、收入质量和交易可比证据，就无法评估退出窗口或可实现回报。投资前应取得经审计的月度 ARR 和收入桥接表、毛利率、按客户群组 划分的 Logo
              与金额留存率、客户集中度、销售效率、现金烧钱、runway、完全摊薄股权结构表、优先股堆叠，以及支持最新价格的董事会材料。论点失效触发条件包括：无法合理解释报道增长、竞争地位持续下滑、企业扩张疲弱，或即使
              headline 估值维持不变，条款仍使普通股回报 缺乏吸引力。
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV010
              - CV011
              - CV013
              - CV015
              - CV016
      - number: '8.5'
        title: 图表
        blocks:
          - type: callout
            title: 对价格敏感的建议
            body: 以当前证据水平，应继续研究。买入逻辑需要经审计的经常性收入质量、留存率、利润率、持股、优先权，以及能经受下行情景假设的目标回报模型。
            calloutType: recommendation
            claimRefs:
