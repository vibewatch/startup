  - id: FP001
    title: 竞争定位：购买便利度与企业级深度
    type: quadrant
    summary: 序数定位显示，Profound 以较低的自助购买便利度换取更深的企业能力；套件扩展和轻量工具则反过来。
    data:
      points:
        - label: Profound
          x: 2
          'y': 5
          detail: 以销售为主导的打包方式；覆盖广泛的诊断、治理和工作流主张。
        - label: Peec AI
          x: 4
          'y': 3
          detail: 上手阻力较低且强调行动；企业级深度尚不明确。
        - label: Semrush
          x: 4
          'y': 3
          detail: 既有客户基础带来较强的可获得性；保留的比较显示其 AEO 深度较窄。
        - label: HubSpot AEO
          x: 5
          'y': 2
          detail: 套件分发便利；独立的企业级深度尚未验证。
        - label: Otterly
          x: 5
          'y': 2
          detail: 低价、简单的入门选择；数据和治理能力较轻。
        - label: 内部自建
          x: 3
          'y': 2
          detail: 对窄范围场景控制力高，但要持续覆盖广泛范围，需要大量定制工作。
    approximationNotes: 分析师根据打包、上手、集成、安全和工作流证据编制 1（低）至 5（高）的序数评分；这些不是实测产品性能，也不是独立基准。X 轴衡量购买便利度，Y 轴衡量企业级深度。
    claimRefs:
      - CP003
      - CP005
      - CP006
      - CP007
      - CP009
      - CP010
      - CP011
      - CP014
      - CP015
  - id: FI001
    title: 受证据约束的变现流程
    type: flow
    summary: 公开证据显示了从试用到企业版的打包路径，但实际收入、交付成本和毛利润仍未披露。
    data:
      nodes:
        - id: evaluation
          label: 7 天试用
          value: 50 prompts daily
          detail: ChatGPT、Gemini 和 Google AI Overviews 均有相关报道
        - id: qualification
