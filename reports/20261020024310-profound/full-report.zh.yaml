            tableRef: TO003
            claimRefs:
              - CO010
              - CO011
      - number: '1.4'
        title: 里程碑显示加速，竞争压力也在上升
        blocks:
          - type: paragraph
            body: >-
              Profound 从据报道于 2024 年成立，到获得独角兽级融资，前后约两年。最大几轮融资之前，品类已得到验证：Blastra 报道称， Profound 是 2025 年 12 月首期 AEO Grid
              中唯一的 Leader；随后公司于 2026 年 2 月完成 C 轮，并于 2026 年 9 月完成 D 轮。 同一来源也给出不利对照：截至 2026 年 10 月 4 日，G2 的 AEO 品类据报道已有超过
              650 个解决方案，且按 G2 Score 计算， Semrush 排名高于 Profound。10 月 19 日的定价评测仍将 Profound 描述为企业产品，品牌定价未公开；这既强化了其定位，也说明
              仅凭公开数据难以检验价格与价值。时间线只有六个节点，少于目标八个，是因为指定证据没有提供日期足够明确的产品发布、合作伙伴、 监管事件或领导层变动。这些遗漏仍是明确的研究空白，不应靠推断日期填补。
