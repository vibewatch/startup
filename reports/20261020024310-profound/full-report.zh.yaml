      - number: '3.2'
        title: 深度是护城河，分销是攻击面
        blocks:
          - type: paragraph
            body: >-
              Profound 可守住的切口在于运营闭环的广度，而不只是追踪提及次数。其文档把提示词监测、答案引擎可见度、引用追踪、竞争基准和 Agents
              建议执行串在一起。公司相关比较还加入真实用户提示词数据、爬虫分析、集成和企业控制，但这些优越性说法没有独立基准支持。 Peec 反复被定位为更易配置、更偏执行；Semrush、HubSpot、Ahrefs
              等成熟厂商则可以把基础 AI 可见度分发到客户已经购买的工具中。 这形成了一个持久性检验：Profound
              必须让专有数据和工作流深度持续领先于套件附加功能，才足以支撑单独采购。指定证据没有在统一测试协议下证明其比较准确性、回答覆盖率或实际客户结果。
            claimRefs:
              - CP001
              - CP005
              - CP006
              - CP007
              - CP009
              - CP010
