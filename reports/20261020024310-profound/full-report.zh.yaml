  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代品
        blocks:
          - type: paragraph
            body: >-
              可投资市场应限定为：监测并改善品牌在 AI 生成答案中呈现方式的软件，包括提示词监测、答案引擎可见度、引用追踪、竞争基准和建议。 Profound
              自己的产品演示也证实了这一功能边界。市场规模不应把所有搜索广告、所有 SEO 软件与服务或所有内容生产都算进去： 它们是相邻预算池，并非同类产品。托管式 AEO 执行、带 AI 模块的传统 SEO
              套件、公开自助式追踪工具和手工提示词测试，取决于买方 的运营模式，既可能是补充品，也可能是替代品。这个区分很重要，因为监测软件本身不会获得引用，也不会替客户发布改变可见度所需的内容。
            claimRefs:
              - CM005
              - CM013
              - CM014
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM013
              - CM014
              - CM015
      - number: '2.2'
        title: 受证据约束的市场规模估算
        blocks:
          - type: paragraph
            body: >-
              现有证据证明的是周边搜索经济的规模，而不是独立的 AEO 软件市场。DataStory 报道称，2025 年美国搜索广告支出估计为 1,900 亿美元， 占美国数字广告的 33%，并引用了 SEO
              软件与服务每年约 1,000 亿美元的估算。该文还称 AI 平台约占网站引荐流量的 1%，并转述 Gartner 对传统搜索将下降 25% 的预测，但没有说明预测期限。这些数字使用的分母不同，不能简单叠加为
              TAM、SAM 和 SOM。 它们只能作为需求和替代信号。要建立可辩护的规模模型，仍需品类收入、企业合同金额、买方数量和采用率。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM016
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM009
              - CM010
      - number: '2.3'
        title: 买方、用户与付费方分层
        blocks:
          - type: paragraph
            body: >-
              核心经济买方通常是负责可发现性和预算分配的 CMO、营销副总裁或数字营销负责人；日常用户则是 SEO、内容、公关、分析和需求生成团队。 DataStory 还将内容或 SEO
              负责人列为第二类主要用户，由其决定发布什么、如何优化。独立评测和商业相关评测都认为，产品最适合 成长期公司、企业和代理机构；当小团队需要低价自助覆盖，或没有人手执行建议时，匹配度会下降。因此付费方通常是营销组织，
              但要真正采用，必须有明确的工作流负责人，而不能只靠一个被动的仪表盘买方。
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM010
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM012
              - CM013
      - number: '2.4'
        title: 驱动因素、约束与估值意义
        blocks:
          - type: paragraph
            body: >-
              采用率受三点驱动：产品发现转向 AI 答案、点击流量可见度下降，以及买方需要用可重复的数据而不是手工提示词比较各引擎中的品牌存在感。 约束同样明显：到 2026 年 10 月，Profound
              已回到企业定制报价；短期试用无法展示月环比变化；产品收益还依赖测量层之外的内容、 传播或代理执行能力。品类拥挤也在迅速加剧：Blastra 统计截至 2026 年 10 月 4 日 G2 上有超过 650 个
              AEO 列表，并按 G2 Score 将 Semrush 排在 Profound 之前。因此，估值可以反映一个可能重要的新分析品类，但不应把整个相邻搜索经济资本化，也不能假设早期品类领先 就必然带来持久份额。
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
              - CM016
      - number: '2.5'
        title: 图表
        blocks:
          - type: callout
            title: 不要把相邻搜索经济资本化为 AEO TAM
            body: 现有证据支持需求紧迫性和庞大的周边预算池，但没有提供独立软件 TAM 所需的品类收入、合同金额分布、买方数量或采用率输入。 这些缺失的分母是估值上的重大缺口。
            calloutType: risk
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM016
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 围绕买方成熟度组织的拥挤市场
        blocks:
          - type: paragraph
            body: >-
              买方可以通过专门的 AEO 平台、既有 SEO 或营销套件的扩展功能、轻量监测工具、代理支持的工作流，或手工提示词检查与内部仪表盘来解决 AI 可见度问题。Profound 自己的指南列出了 19
              个平台，因此不能把品类领先等同于没有竞争。实际分层取决于运营模式：受监管企业可能 更看重广泛的引擎覆盖、治理、集成和专属支持；小团队和代理机构则可能偏好快速上手、公开的入门价格和聚焦监测。针对狭窄提示词集合，
              现有的表格和内部脚本仍有可信度，尽管它们必须重建调度、标准化、引用历史和报告能力。证据在方向上有用，但存在利益关系： 官方比较、竞争供应商和代理机构占主导，指定资料中没有独立的正面对比产品基准。
            claimRefs:
