      - number: '1.3'
        title: 融资快速增长，超过已披露的经营证据
        blocks:
          - type: paragraph
            body: >-
              最新一轮报道融资为 2026 年 9 月 15 日完成的 $180 million Series D，估值 $1.8 billion，由 Sequoia Capital 和 Kleiner Perkins
              共同领投。 此前，公司据报道于 2026 年 2 月以 $1 billion 估值完成 $96 million Series C；另一份二手资料称，D 轮后累计融资超过 $335
              million。公司还据报道表示， 前六个月收入增至原来的三倍，服务的企业客户超过 1,000 家。但这些增长说法没有绝对收入基数、ARR、留存率、cohort 或客户定义披露，
              因此不应换算为年化收入或估值倍数。已募集资金同样不能证明可用现金。融资轮次的速度和规模显示投资人支持强劲，但缺少稀释、 清算优先权、债务、老股转让、烧钱和现金 runway 数据，无法判断资本效率。
