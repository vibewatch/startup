evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: operating-metrics
    missingEvidence: Audited revenue by line, ARR, fee capture, customer definition and count, cash balance, burn, and runway.
    whyItMatters: >-
      Protocol deposits and funding raised cannot establish company monetization, liquidity, or recurring commercial
      traction.
    diligencePath: >-
      Request monthly management accounts, bank statements, customer and integration cohort schedules, fee waterfalls,
      and a 24-month cash forecast.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: leadership
    missingEvidence: >-
      Current board roster, functional executive team, employment status of each founder, succession plan, and
      key-person protections.
    whyItMatters: >-
      Public strategy and fundraising visibility is concentrated around the CEO, while functional coverage and
      continuity are unclear.
    diligencePath: >-
      Obtain the organization chart, board minutes, founder employment agreements, succession plan, and key-person
      insurance details.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Association statutes, Morpho Labs ownership records, IP and services agreements, token-governance concentration,
      and reserved-matter rights.
    whyItMatters: >-
      The nonprofit, operating company, and tokenholder constituencies may have different control and value-capture
      rights.
    diligencePath: >-
      Review corporate registries, Association statutes, intercompany agreements, treasury mandates, token allocation
      schedules, and governance delegation data.
    relatedQuestionRefs:
