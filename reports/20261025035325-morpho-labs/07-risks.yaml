      rows:
        - label: Oracle / collateral failure
          values: [4, 5, 2, 5]
        - label: Curator allocation failure
          values: [4, 5, 2, 5]
        - label: Regulatory / AML exposure
          values: [3, 5, 2, 4]
        - label: Liquidity stress
          values: [3, 4, 2, 4]
        - label: Module or integration security
          values: [3, 5, 3, 4]
        - label: Entity / financial opacity
          values: [3, 4, 1, 4]
    approximationNotes: "Scores are qualitative analyst ratings on a 1-5 scale, not sourced probabilities or loss estimates; the underlying risk descriptions and controls are cited in the linked claims."
    claimRefs: [CR001, CR003, CR005, CR007, CR009, CR013, CR016]
callouts:
  - calloutType: risk
    title: Highest-conviction risk
    body: >-
      Morpho's immutable core does not remove the dominant externality: market creators, curators, oracles, collateral issuers, and integrators can still transmit losses to users.
    claimRefs: [CR001, CR002, CR003]
  - calloutType: recommendation
    title: Diligence gate
    body: Do not underwrite a lower risk rating until Morpho supplies a reconciled incident ledger, recovery outcomes, vault and curator concentration, legal-entity map, and deployment-level compliance evidence.
    claimRefs: [CR004, CR007, CR013, CR014]
