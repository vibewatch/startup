company:
  name: Morpho Labs
chapter:
  number: 7
  title: Risks
  summary: Morpho's principal exposure is not a single mutable core contract but the surrounding collateral, oracle, curator, compliance, and integration layers. Public evidence shows both meaningful controls and realized losses, so the residual risk remains high until recovery, legal-entity, operating, and dependency disclosures improve.
sections:
  - id: risk-posture
    title: Risk posture and control boundary
    body: >-
      Morpho separates its immutable lending primitive from the risk-management layer operated by vault curators and market creators. Blockworks Intel classifies Morpho as decentralized lending within DeFi, while the assigned evidence describes isolated markets, fixed parameters, and governance limits but also documents losses when collateral, oracle, or curator choices failed. That boundary matters for underwriting: core-contract immutability can reduce upgrade risk without eliminating market-specific oracle, stablecoin, liquidity, or curator risk. Morpho's own institutional material says risk management occurs above the protocol in Morpho Vaults, while independent disclosures record a $6.2 million episode tied to a hardcoded oracle and a $49,303 oracle-manipulation loss. The correct residual-risk view is therefore layered rather than binary: controls are credible in some areas, but user outcomes still depend on external configuration and counterparties.
    claimRefs: [CR001, CR002, CR003, CR004, CR016]
    tableRefs: [TR001]
    figureRefs: [FR001]
  - id: regulatory-legal
    title: Regulatory and legal exposure
    body: Regulatory risk is material because Morpho's infrastructure is permissionless while institutional integrations require jurisdiction-specific controls, disclosures, and accountability. EBA and ESMA identify money-laundering and terrorist-financing exposure, excessive leverage, information asymmetry, collateral-chain interconnectedness, and limited user information as risks in crypto lending and DeFi. Morpho's company-issued material presents permissioned markets and non-custodial design as possible mitigations, but those are design options rather than proof that every deployment is authorized or compliant. A French registry record also shows that the Morpho Labs SASU entry was radiated from the Paris commercial register on 27 March 2026; the relationship between that entity and the Morpho Association should be verified before relying on the corporate record for contracting, liability, or capitalization conclusions.
    claimRefs: [CR005, CR006, CR007, CR008]
    tableRefs: [TR002]
  - id: operational-dependency
    title: Operational, security, and dependency risks
    body: Operational exposure concentrates in oracle design, curator decisions, stablecoin collateral, smart-contract configuration, and integrator interfaces. The Cantina review examined Morpho's fixed-rate interest-rate module for rate-setting controls, overflow protections, and invalid configurations that could lock user funds, which supports a meaningful assurance process but not a clean bill of health for the full stack. Morpho's security framework cites formal verification, audits, monitoring, and a $2.5 million bug bounty, yet the company also acknowledges that DeFi hacks have caused substantial losses and that protocol upgrades can compromise contracts. Independent reporting describes a frontend exploit attempt that was halted before funds were lost and temporary liquidity shortfalls in a small number of vaults; both should be monitored rather than treated as proof of no loss.
    claimRefs: [CR009, CR010, CR011, CR012]
    tableRefs: [TR003]
  - id: thesis-breaks
    title: Financial, partner, and thesis-break triggers
    body: The investment case can break through measurable deterioration in collateral quality, recovery, liquidity, compliance, or operating solvency. The public record does not establish Morpho-wide revenue, burn, runway, insurance, or concentration metrics, so the risk register uses explicit diligence paths instead of false precision. A French company registry reports a 2024 net loss of €482,000, €512,000 of cash, and partial confidentiality of accounts for that entity; these figures must not be generalized to the Morpho Association or protocol economics. Chainalysis reports at least $154 billion received by illicit cryptocurrency addresses in 2025, a lower-bound estimate, highlighting the broader sanctions and illicit-finance environment in which integrations operate. Monitoring should focus on realized bad debt, unrecovered losses, oracle changes, curator concentration, regulatory notices, and liquidity stress.
    claimRefs: [CR007, CR013, CR014, CR015]
