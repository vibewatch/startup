      - ["Curator or Public Allocator routes liquidity into impaired collateral", "Medium-high", "High", "Partial", "High", "Vault concentration, decision logs and recovery waterfall"]
      - ["Fixed-rate module configuration locks funds or misprices rates", "Medium", "High", "Developing", "Medium-high", "Production monitoring and incident-response evidence"]
      - ["Frontend, integration, or upgrade surface is compromised", "Medium", "High", "Developing", "Medium-high", "Complete deployment inventory, monitoring and post-incident register"]
      - ["Liquidity stress produces withdrawal delays or shortfalls", "Medium", "High", "Partial", "Medium-high", "Market-level liquidity and stress-test history"]
    notes: "Likelihood and residual exposure are analyst ratings grounded in the cited incidents and control descriptions; they are not probabilities. Null or unavailable operating denominators are not converted into zero."
    claimRefs: [CR001, CR002, CR003, CR009, CR010, CR011, CR012]
  - id: TR003
    title: Partner / dependency risk register
    columns: [Dependency, Counterparty or role, Role, Concentration signal, Failure scenario, Severity, Mitigation, Residual exposure]
    rows:
      - ["Vault curators", "Gauntlet, Steakhouse, Re7 and others", "Select markets and allocate liquidity", "Material but not quantified", "Curator choices expose deposits to bad collateral or stale oracles", "High", "Curator controls, isolation and monitoring", "High"]
      - ["Price oracles", "Market-specific oracle providers", "Value collateral and trigger liquidation", "Not disclosed", "Stale or manipulable prices create bad debt", "High", "Fixed market parameters and review", "High"]
      - ["Stablecoin collateral", "USDX, xUSD, deUSD, USR and other issuers", "Collateral and liquidity source", "Not disclosed", "Depeg or exploit leaves undercollateralized loans", "High", "Collateral restrictions and curator limits", "High"]
      - ["Institutional and exchange integrators", "Coinbase and other platforms", "Distribute user-facing lending products", "Not quantified", "Partner outage, compliance breach, or product withdrawal reduces usage", "Medium-high", "Permissioned products and non-custodial architecture", "Medium-high"]
    notes: "The public evidence names roles and examples but does not disclose contractual concentration, service levels, insurance, or termination rights. Partner names are not treated as proof of current production volume."
    claimRefs: [CR002, CR003, CR006, CR011, CR012]
