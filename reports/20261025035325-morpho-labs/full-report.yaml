              - CM011
              - CM012
      - number: '2.3'
        title: Buyer segments, drivers, and constraints
        blocks:
          - type: paragraph
            body: >-
              Adoption follows a multi-sided path. DeFi-native lenders and borrowers value permissionless market
              creation, rate and collateral choice, and access to isolated risk; curators and DAOs package those markets
              into vaults; exchanges, wallets, and fintechs can place familiar interfaces in front of decentralized
              rails; and institutions need predictable terms, compliance controls, and operational reliability. Morpho
              V2 coverage explicitly frames fixed-rate, fixed-term, customizable loans and enhanced KYC and whitelisting
              as responses to institutional requirements. Drivers include stablecoin and RWA adoption, demand for yield
              and balance-sheet efficiency, and distribution through established financial interfaces. Constraints
              include over-collateralization, oracle and liquidation risk, fragmented liquidity, curator dependence,
              information asymmetry, and regulatory uncertainty. MiCA is operational in the EU, but the treatment of
              DeFi still depends on structure and legal-entity control. EBA and ESMA specifically flag limited
              engagement, leverage, disclosure, and interconnectedness risks, so market growth should not be treated as
              equivalent to low-risk or immediately monetizable adoption.
            claimRefs:
              - CM005
              - CM006
              - CM008
              - CM009
              - CM010
              - CM015
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM005
              - CM006
              - CM015
              - CM016
