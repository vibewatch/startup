  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              Morpho's competitive set spans pooled lending protocols, modular lending primitives, curated vault
              products, and the status quo of centralized or internally built credit products. Independent descriptions
              identify Aave, Compound, and Sky as major alternatives, while Morpho's own architecture positions Morpho
              Blue as an immutable base primitive and MetaMorpho as a curation layer. For a borrower or lender, the real
              choice is not simply protocol brand: it is whether to accept pooled parameters, select an isolated market,
              use a curated vault, or buy a packaged product from an exchange or fintech. This broad landscape matters
              because distribution can hide the infrastructure provider; CoinShares describes Coinbase and other
              platforms using Morpho behind familiar interfaces. Internal build remains a credible substitute for large
              platforms that can staff smart-contract, risk, oracle, and compliance functions, but the public evidence
              does not quantify build cost or switching cost. Likely entrants include other permissionless lending
              primitives, chain-specific markets, and traditional-finance products that add fixed terms and compliance
              controls.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP018
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP018
      - number: '3.2'
        title: Capability, pricing, and trust comparison
        blocks:
          - type: paragraph
            body: >-
              Morpho's principal capability distinction is configurable, isolated market design: collateral, loan asset,
              oracle, liquidation threshold, and interest-rate model can be specified per market. MetaMorpho then
              packages selected markets into curated vaults, shifting some complexity from the user to a curator. Aave
              and Compound are described as more standardized pooled alternatives, which can make the user experience
              easier but gives users less market-by-market control. Morpho V2 reporting describes a further move toward
              fixed-rate, fixed-term, intent-based terms and enhanced KYC or whitelisting, but the cited article says
              rollout was planned rather than documenting broad production adoption. Pricing is not directly comparable
              across protocols: Morpho's public materials describe fee-switch flexibility and vault performance fees,
              while user yield and borrowing rates vary with utilization, collateral, oracle, and curation. Trust
              therefore depends on smart-contract and oracle controls, liquidation design, governance/admin powers, and
              the quality of the curator or distribution partner.
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP002
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP009
              - CP010
              - CP011
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP010
      - number: '3.3'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Morpho's moat is more plausibly an ecosystem and distribution moat than a proprietary pricing algorithm.
              Its layered design lets builders, fintechs, and exchanges reuse primitive markets while applications add
              curation, allocation, compliance, liquidation, or user-experience layers. That can create network effects
              around shared liquidity and integrations, but it also exposes Morpho to multi-homing: a partner can
              present multiple lending rails, and a user can move between vaults or protocols when rates or risk terms
              change. Independent reporting documents rapid scale and major integrations, but it also records an
              attempted frontend exploit in April 2025 and temporary liquidity shortfalls in a handful of vaults. Those
              events do not establish realized protocol loss, yet they show that operational trust and liquidity
              resilience remain competitive variables. Aave and Compound retain incumbent familiarity and
              pooled-liquidity simplicity; newer intent-based or compliant products could displace Morpho for
              institutions if they offer predictable terms without requiring users to evaluate isolated-market risks.
            claimRefs:
              - CP013
              - CP014
              - CP015
      - number: '3.4'
        title: Underwriting implications
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a differentiated infrastructure position, but not a conclusion that Morpho has
              durable pricing power over every lending use case. The most defensible advantage is configurable risk and
              composable distribution; the most material counterweight is that permissionlessness moves diligence burden
              to market creators, curators, integrators, and users. A buyer comparison should therefore score each
              alternative on the job to be done: pooled liquidity and simplicity, isolated risk control, curated access,
              fixed terms, compliance, and distribution. Public sources do not provide a consistent cross-protocol price
              sheet, retention data, switching-cost measurement, or like-for-like loss history. Those are material
              evidence gaps rather than reasons to fill matrix cells with guesses. The near-term competitive test is
              whether Morpho can convert ecosystem adoption into repeatable, protocol-level economics while maintaining
              trust through stress events.
            claimRefs:
              - CP018
              - CP019
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Differentiation is architectural, not automatically commercial
            body: >-
              Morpho's isolated-market and vault stack gives builders more control than pooled incumbents, but public
              evidence does not yet prove that this control converts into durable fees, retention, or lower total risk
              for every customer.
            calloutType: insight
            claimRefs:
              - CP007
              - CP013
              - CP019
          - type: callout
            title: The competitor set can compress from both directions
            body: >-
              Incumbent pooled protocols can win on simplicity and liquidity, while institutional entrants can win on
              fixed terms and compliance; Morpho must defend both the primitive and the distribution layer.
            calloutType: risk
            claimRefs:
              - CP004
              - CP011
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue architecture and pricing
        blocks:
          - type: paragraph
            body: >
              The public model has several economic layers that should not be collapsed into one revenue line. Gate's
              syndicated explainer says Morpho Blue can direct 0% to 25% of borrower interest to the Morpho DAO through
              a market-level fee switch, while MetaMorpho vault economics sit with curators rather than the DAO.
              EarnPark, a competing yield platform, reports no protocol supply fee and curator performance fees of 5% to
              15% of earned yield; those figures are a third-party schedule, not audited realized pricing. Borrower
              interest primarily funds supplier yield before any configured fee capture. Morpho's own strategy describes
              a minimal lending primitive with abstraction layers built above it, reinforcing an infrastructure model
              but not establishing which entity ultimately records revenue.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
