        title: Public traction and sales-efficiency limits
        blocks:
          - type: paragraph
            body: >
              FinanceFeeds, The Block, and Unchained repeat Morpho's claim that the network crossed $11 billion in
              deposits and identify exchanges, wallets, and institutional service providers using the infrastructure.
              This is meaningful evidence of liquidity and distribution, but deposits are neither recognized revenue nor
              cash owned by Morpho Labs. The partner-led route could lower direct acquisition cost by embedding lending
              into existing interfaces, yet the assigned evidence provides no customer count, contract value, renewal
              rate, partner revenue share, implementation cost, sales cycle, CAC, or payback. Public traction therefore
              supports demand for the rail, not a quantified sales-efficiency conclusion. A usable operating model
              requires a dated bridge from fee-bearing balances and utilization to gross fees, partner and curator
              allocations, incentives, and net operating-company revenue.
            claimRefs:
              - CI006
