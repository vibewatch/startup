      - number: '4.3'
        title: Financing and capital adequacy
        blocks:
          - type: paragraph
            body: >
              Multiple outlets report a $175 million June 2026 financing and an up-to-$2 billion valuation, but the
              transaction was a MORPHO token purchase rather than a disclosed conventional cash equity round. The stated
              use of proceeds is to deepen technical and commercial integrations and expand credit infrastructure. Those
              facts demonstrate financing access, not cash currently available for payroll, incentives, or acquisitions.
              Public databases also disagree on cumulative funding: Multiples reports $243 million across three rounds,
              Tracxn reports $249 million across six, and VentureBurn reports $244.35 million. Pappers shows a €482K
              2024 net loss and €512K of cash for the French SASU, whose accounts were partially confidential; that
              entity-level snapshot should not be treated as a current consolidated group cash position.
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >
              The strongest financial conclusion is that Morpho may have attractive operating leverage if lending
              activity becomes fee-bearing and if distribution partners deliver durable volume, but neither condition is
              quantified publicly. Revenue quality remains unproven because the evidence does not disclose realized take
              rates, revenue mix, recognition policy, customer concentration, or the allocation of economics among the
              DAO, association, curators, partners, and Morpho Labs. Margin and capital intensity are also open:
              engineering, security, compliance, incentives, integrations, and partner support may be material even when
              the core protocol is minimal. Adverse reviews identify curator-dependent risk, contagion exposure, and
              possible liquidity fragmentation. The investment case should remain blocked on entity-level financials,
              token-sale terms, treasury liquidity, fee ledgers, channel contracts, and cohort-level utilization.
            claimRefs:
