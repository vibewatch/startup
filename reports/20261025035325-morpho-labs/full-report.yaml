  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and buying job
        blocks:
          - type: paragraph
            body: >-
              The relevant market is not all cryptocurrency activity. It is the infrastructure and application layer
              that creates, routes, curates, and services collateralized lending and borrowing of on-chain assets.
              Morpho Blue is described as a standalone, permissionless lending layer where market creators set
              collateral, loan asset, liquidation threshold, rate model, and oracle parameters; MetaMorpho adds vaults
              and curator-defined risk strategies on top of that layer. This boundary includes protocol infrastructure,
              vault management, collateral and oracle integrations, and embedded lending interfaces. It excludes spot
              trading, unsecured corporate credit, and general blockchain infrastructure unless those products directly
              supply the lending workflow. Traditional bank lending, centralized exchange credit, Aave/Compound-style
              pools, and internal treasury tools are substitutes or adjacent alternatives rather than automatic parts of
              the addressable market. The buyer's job is to obtain predictable, risk-adjusted liquidity or yield with
              acceptable collateral, compliance, and operational controls.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM005
              - CM006
      - number: '2.2'
        title: Sizing lenses and evidence limits
        blocks:
          - type: paragraph
            body: >-
              A single DeFi headline number is not a defensible Morpho TAM. The available sources provide several
              different denominators: ecosystem share of total crypto value, protocol deposits and loans at a historical
              point, total value locked, and the broader pool of tokenized real-world assets. Those measures describe
              different populations and cannot be added or converted into revenue without fee, utilization, duration,
              geography, and market-share assumptions. The EBA and ESMA characterize DeFi as a niche phenomenon and
              report limited EU consumer and financial institution engagement, while other sources describe rapid RWA
              and stablecoin expansion. The result is an evidence-constrained market: Morpho has exposure to multiple
              growing pools, but public material does not isolate its serviceable market, obtainable share, or
              monetizable revenue pool. The table therefore preserves each lens, its methodology, and its limitation
              rather than presenting a synthetic TAM.
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM007
              - CM009
              - CM011
              - CM012
              - CM014
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM007
