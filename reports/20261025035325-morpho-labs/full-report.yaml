    title: Company milestone timeline
    type: timeline
    summary: >-
      Morpho progressed from a 2021 Paris founding to institutional credit infrastructure and a $175 million token
      financing, with governance and resilience events interleaved.
    data:
      items:
        - date: 2021-08
          label: Morpho founded in Paris
          detail: CoinShares identifies Paul Frambot, Mathis Gontier Delaunay, and Merlin Egalite as the founding group.
          tone: positive
        - date: '2022-12-20'
          label: Mainnet launch
          detail: OKX dates the protocol's official mainnet launch to December 20, 2022.
          tone: positive
        - date: 2024-08
          label: $50M strategic round
          detail: The Block reports that Ribbit Capital led the prior $50 million strategic round.
          tone: positive
        - date: 2025-04
          label: Frontend exploit attempt blocked
          detail: CoinShares reports a $2.6 million attempted exploit was intercepted before funds were lost.
          tone: negative
        - date: 2025-06
          label: Labs ownership changed
          detail: An independent analyst reports Morpho Labs became wholly owned by the Morpho Association.
          tone: neutral
        - date: 2025-09
          label: SG-FORGE integration announced
          detail: CoinShares describes the integration of MiCA-compliant stablecoins into Morpho.
          tone: positive
        - date: '2025-11-06'
          label: Vault liquidity shortfalls addressed
          detail: >-
            A co-founder said three to four of more than 320 vaults experienced brief shortfalls without losses or bad
            debt.
          tone: negative
        - date: '2026-06-09'
          label: $175M token financing
          detail: >-
            Paradigm, a16z crypto, and Ribbit Capital co-led a MORPHO-token purchase valuing the protocol at up to $2
            billion.
          tone: positive
        - date: 2026-06
          label: 79 employees reported
          detail: Tracxn reports 79 employees as of June 2026; no later verified count was retained.
          tone: neutral
    approximationNotes: >-
      Dates use the precision available in the retained sources; month-only entries are not presented as exact event
      dates.
    claimRefs:
      - CO001
      - CO004
      - CO006
      - CO007
      - CO008
      - CO011
      - CO012
      - CO013
      - CO014
      - CO015
      - CO016
  - id: FM001
    title: Evidence-constrained market sizing lenses
    type: pyramid
    summary: >-
      The pyramid presents distinct market lenses in ordered layers; it does not imply that the values are comparable or
      additive.
    data:
      nodes:
        - label: Global tokenized-asset opportunity
          value: $4B to $18B
          unit: RWA value, 2025
          detail: DWF Labs market commentary; broader asset stock, not lending TAM
        - label: Global DeFi footprint
          value: 4%
          unit: of global crypto-asset market value
          detail: EBA and ESMA assessment; not a revenue denominator
        - label: Morpho reported TVL lens
          value: $6.68B
          unit: TVL
          detail: CoinShares report; point-in-time and not independently reconciled here
        - label: Morpho Blue activity snapshot
          value: $1.35B / $510M
          unit: deposits / loans
          detail: Gate Learn/Foresight News historical snapshot
        - label: Base deployment snapshot
          value: $110M / $36.84M
          unit: deposits / loans
          detail: Gate Learn/Foresight News historical snapshot
        - label: Monetizable Morpho SAM/SOM
          value: null
          unit: null
          detail: Not isolated in public evidence; fee capture, utilization, geography, and share are gaps
    approximationNotes: >-
      Layers retain source-reported values but mix asset stock, market share, TVL, deposits, and loans. The ordered
      display is not magnitude-proportional and does not derive conversion rates or a synthetic TAM.
    claimRefs:
      - CM007
      - CM009
      - CM011
      - CM012
  - id: FP001
    title: Competitive positioning by configuration and user simplicity
    type: quadrant
    summary: >-
      Morpho occupies the high-configuration side of the market while pooled incumbents emphasize simplicity; the
      positions are evidence-backed ordinal judgments rather than measured scores.
    data:
      points:
        - label: Morpho Blue / MetaMorpho
          x: 8
          'y': 5
          note: High configuration; vaults improve simplicity but direct markets remain complex.
        - label: Aave
          x: 4
          'y': 8
          note: Pooled market convention and simpler user experience are described in the assigned comparisons.
        - label: Compound
          x: 3
          'y': 8
          note: Foundational pooled model with straightforward user experience.
        - label: Sky
          x: 5
          'y': 6
          note: Adjacent DeFi lending and stablecoin ecosystem; public evidence is less directly comparable.
        - label: Centralized or fintech product
          x: 2
          'y': 9
          note: Packaged front-end and managed terms can simplify access, but product scope varies.
        - label: Internal build
          x: 9
          'y': 3
          note: Maximum control, with substantial engineering, security, oracle, and compliance burden.
      xAxis: Configuration and risk-control flexibility (ordinal, 1 low to 10 high)
      yAxis: User simplicity and packaging (ordinal, 1 low to 10 high)
    approximationNotes: >-
      Coordinates are analyst ordinal scores anchored to the cited capability descriptions; they are not market-share,
      price, or performance measurements.
    claimRefs:
      - CP007
      - CP008
      - CP009
      - CP010
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      The operating question is where borrower interest becomes supplier yield, curator fees, DAO fees, and any retained
      Morpho Labs revenue.
    data:
      nodes:
        - id: borrower-demand
          label: Borrower demand
          detail: Borrowers draw liquidity from isolated Morpho Blue markets.
          unit: borrowed principal
        - id: borrower-interest
          label: Borrower interest
          detail: Interest accrues against utilized borrowing.
          unit: '% of utilized borrowing'
        - id: supplier-yield
          label: Supplier yield
          detail: Most underlying interest supports returns to liquidity suppliers.
          unit: yield
        - id: protocol-fee-switch
          label: DAO fee switch
          detail: Selected markets can direct a reported 0% to 25% of total interest to the Morpho DAO.
          unit: '% of total interest'
        - id: metamorpho-vault
          label: MetaMorpho vault
          detail: A curator allocates supplied assets among Morpho Blue markets.
          unit: allocated assets
        - id: curator-fee
          label: Curator performance fee
          detail: EarnPark reports 5% to 15% of earned yield, varying by vault.
          unit: '% of earned yield'
        - id: operating-company
          label: Morpho Labs revenue
          detail: Entity-level capture from DAO, curators, or partners is not publicly reconciled.
          unit: unavailable
    approximationNotes: >-
      This is a mechanism map, not a value-proportional bridge or forecast; it does not treat deposits, supplier yield,
      DAO receipts, or curator fees as Morpho Labs revenue.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI005
  - id: FE001
    title: Morpho product architecture map
    type: stack
    summary: The product separates a narrow lending primitive from market configuration, curation, and distribution layers.
    data:
      layers:
        - label: Distribution
          detail: Application distribution and user-facing access.
          items:
            - label: Wallets, exchanges, and fintechs
              detail: Embed Morpho-powered lending or yield experiences for end users.
        - label: Curated access
          detail: Delegated market selection and allocation.
          items:
            - label: MetaMorpho vaults
              detail: Curators allocate deposits across selected isolated markets.
        - label: Market layer
          detail: Configured lending venues with explicit risk parameters.
          items:
            - label: Morpho Blue markets
              detail: Markets specify loan asset, collateral, LLTV, oracle, and interest-rate model.
        - label: Core protocol
          detail: Non-custodial execution primitive.
          items:
            - label: Immutable EVM contracts
              detail: Non-custodial base primitive with permissionless market creation and integrator-oriented callbacks.
        - label: External dependencies
          detail: Services and networks required for pricing and execution.
          items:
            - label: Oracles, chains, and liquidation venues
              detail: External systems affect pricing, execution, and loss containment.
        - label: Security and operations
          detail: Assurance and operational controls around deployments and partners.
          items:
            - label: Audits, incident response, and support controls
              detail: Public evidence is incomplete for the full operating-control package.
    approximationNotes: >-
      Layer order is an analytical representation of documented product composition, not a measured control hierarchy or
      proof that every deployment uses every layer.
    claimRefs:
      - CE001
      - CE005
      - CE006
      - CE009
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Morpho's customer path runs from capital providers and borrowers through curated or partner interfaces into
      embedded credit products.
    data:
      nodes:
        - id: capital-provider
          label: Capital provider
          detail: Retail or institutional depositor supplies capital through a vault or lending market.
          touchpoints:
            - MetaMorpho vaults
            - Morpho Blue markets
        - id: risk-interface
          label: Curator or risk interface
          detail: Curators allocate deposits across markets and expose a managed user experience.
          touchpoints:
            - Curated vault
            - Risk parameters
        - id: borrower
          label: Borrower
          detail: Crypto-native or institutional borrower seeks collateralized credit.
          touchpoints:
            - Collateral deposit
            - Loan market
        - id: distribution-partner
          label: Distribution partner
          detail: Exchange, wallet, payment platform, or bank places the lending interface in front of end users.
          touchpoints:
            - Coinbase
            - Crypto.com
            - SG-FORGE
            - Ledger
        - id: embedded-product
          label: Embedded credit product
          detail: End user receives a partner-branded loan or yield product while Morpho supplies rails.
          touchpoints:
            - Bitcoin-backed loan
            - Stablecoin lending
            - Institutional lending
        - id: expansion-loop
          label: Expansion loop
          detail: >-
            Additional assets, chains, vaults, or partner interfaces can broaden use, but retention and economics are
            undisclosed.
          touchpoints:
            - More markets
            - More front ends
    claimRefs:
      - CU001
      - CU003
      - CU004
      - CU005
      - CU014
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: Residual exposure is highest where external collateral, oracle, curator, and regulatory dependencies combine.
    data:
      columns:
        - Likelihood
        - Impact
        - Mitigation maturity
        - Residual exposure
      rows:
        - label: Oracle / collateral failure
          values:
            - 4
            - 5
            - 2
            - 5
        - label: Curator allocation failure
          values:
            - 4
            - 5
            - 2
            - 5
        - label: Regulatory / AML exposure
          values:
            - 3
            - 5
            - 2
            - 4
        - label: Liquidity stress
          values:
            - 3
            - 4
            - 2
            - 4
        - label: Module or integration security
          values:
            - 3
            - 5
            - 3
            - 4
        - label: Entity / financial opacity
          values:
            - 3
            - 4
            - 1
            - 4
    approximationNotes: >-
      Scores are qualitative analyst ratings on a 1-5 scale, not sourced probabilities or loss estimates; the underlying
      risk descriptions and controls are cited in the linked claims.
    claimRefs:
      - CR001
      - CR003
      - CR005
      - CR007
      - CR009
      - CR013
      - CR016
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Scale and product optionality justify diligence, but economic rights, downside evidence, and entry price must be
      established before investment.
    data:
      nodes:
        - id: scale
          label: Protocol scale
          detail: Reported lending scale and channel integrations support strategic relevance.
        - id: monetization
          label: Monetization proof
          detail: Recurring attributable fee capture is not publicly established.
        - id: rights
          label: Instrument rights
          detail: Governance rights do not currently include dividends or redemption.
        - id: dilution
          label: Dilution and liquidity
          detail: Token vesting and market liquidity require reconciliation with equity ownership.
        - id: downside
          label: Downside controls
          detail: Incident, loss, insurance, and regulatory evidence remains incomplete.
        - id: decision
          label: Research-more
          detail: Price only after the economics, rights, and exit package is verified.
      edges:
        - from: scale
          to: monetization
        - from: monetization
          to: rights
        - from: rights
          to: dilution
        - from: dilution
          to: downside
        - from: downside
          to: decision
    approximationNotes: This is a qualitative decision sequence; node order does not represent magnitude, probability, or conversion.
    claimRefs:
      - CV001
      - CV004
      - CV007
      - CV012
      - CV014
      - CV015
      - CV016
