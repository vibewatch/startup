callouts:
  - calloutType: insight
    title: The financing headline is not an equity valuation
    body: >-
      The 2026 capital was raised through a MORPHO token purchase, so the cited
      $2 billion figure should not be used as a conventional post-money equity
      mark for Morpho Labs.
    claimRefs: [CO007, CO008]
  - calloutType: risk
    title: Public scale metrics do not reveal company economics
    body: >-
      More than $11 billion of reported deposits demonstrates protocol scale,
      but the retained evidence does not disclose audited revenue, ARR, burn,
      runway, cash availability, or a denominator-defined customer count.
    claimRefs: [CO010]
