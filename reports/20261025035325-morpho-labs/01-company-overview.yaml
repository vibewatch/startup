slug: morpho-labs
runDate: 2026-10-25
company:
  name: Morpho Labs
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Morpho began in Paris in 2021 and now presents itself as configurable
    infrastructure for onchain credit, with more than $11 billion of deposits
    reported around its June 2026 financing. The $175 million financing was a
    MORPHO-token purchase rather than a conventional equity round, making
    ownership, value capture, cumulative funding, and private-company operating
    metrics central diligence gaps.
sections:
  - id: identity-and-operating-model
    title: Identity and operating model
    body: >-
      Morpho was founded in Paris in 2021. Retained histories consistently name
      Paul Frambot, Mathis Gontier Delaunay, and Merlin Egalite, while one funding
      article additionally names Julien Thomas; the discrepancy is preserved
      rather than forcing a definitive founder roster. The company and protocol
      should also be distinguished: Morpho Labs contributes software, while the
      public product is positioned as open, noncustodial infrastructure through
      which institutions, fintechs, and users can configure lending and borrowing
      products. The official bundlers repository shows a concrete integration
      layer around Morpho Blue and MetaMorpho, supporting the characterization of
      Morpho as infrastructure rather than a conventional balance-sheet lender.
    claimRefs: [CO001, CO002, CO003]
    tableRefs: [TO001]
  - id: leadership-governance-and-control
    title: Leadership, governance, and control
    body: >-
      Paul Frambot is the publicly identified CEO and the most visible strategic
      spokesperson, creating material key-person dependence even though the
      project has multiple founders. The more important control issue is the
      relationship among Morpho Labs, the Morpho Association, and MORPHO
      tokenholders. An independent analyst reports that Morpho Labs became a
      wholly owned subsidiary of the French nonprofit Association in June 2025
      and that the Association cannot issue ordinary shareholder equity or
      distribute profits. Public evidence does not establish a current board,
      executive bench, reserved matters, or the contractual allocation of
      intellectual property and cash among these entities.
    claimRefs: [CO001, CO004, CO005]
    tableRefs: [TO002]
  - id: funding-scale-and-stakeholders
    title: Funding, scale, and stakeholders
    body: >-
      The June 2026 financing brought in $175 million and was co-led by Paradigm,
      a16z crypto, and Ribbit Capital, with a wider group of institutional
      participants. It was structured as a MORPHO token purchase, not an equity
      issuance, and the cited valuation of up to $2 billion represented token
      value rather than a negotiated private-company post-money valuation.
      Published cumulative-funding totals conflict at $244.35 million, $249
      million, and more than $250 million. Separately, Morpho reported more than
      $11 billion in deposits and a substantial institutional integration roster;
      neither deposits nor funding raised should be interpreted as company
      revenue, cash available, or recurring customer economics.
    claimRefs: [CO006, CO007, CO008, CO009, CO010, CO011, CO012, CO013]
    tableRefs: [TO003]
  - id: milestones-and-risk-signals
    title: Milestones and risk signals
    body: >-
      The operating history combines rapid product and capital milestones with
      governance and resilience questions. Mainnet launched in December 2022,
      Ribbit led a $50 million strategic round in 2024, and integrations expanded
      into exchanges and regulated financial institutions before the 2026 token
      financing. Adverse evidence is not absent: CoinShares describes a blocked
      $2.6 million frontend exploit attempt in April 2025 and later temporary
      liquidity shortfalls in several vaults. A co-founder said three to four of
      more than 320 vaults were affected and that no losses or bad debt resulted,
      but that explanation remains company-attributed and does not substitute for
      an independently reconciled incident history.
    claimRefs: [CO004, CO006, CO011, CO013, CO014, CO015, CO016]
    figureRefs: [FO001]
