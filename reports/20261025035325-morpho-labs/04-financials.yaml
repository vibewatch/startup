company:
  name: Morpho Labs
chapter:
  number: 4
  title: Financials
  summary: Morpho has credible fee mechanisms, reported network scale, and strong financing access, but public evidence does not reconcile those signals to Morpho Labs revenue, gross margin, burn, or cash runway. Underwriting therefore depends on separating protocol and curator economics from operating-company economics and on validating how the June 2026 token financing funds the business.
sections:
  - id: revenue-architecture-and-pricing
    title: Revenue architecture and pricing
    body: |
      The public model has several economic layers that should not be collapsed into one revenue line. Gate's syndicated explainer says Morpho Blue can direct 0% to 25% of borrower interest to the Morpho DAO through a market-level fee switch, while MetaMorpho vault economics sit with curators rather than the DAO. EarnPark, a competing yield platform, reports no protocol supply fee and curator performance fees of 5% to 15% of earned yield; those figures are a third-party schedule, not audited realized pricing. Borrower interest primarily funds supplier yield before any configured fee capture. Morpho's own strategy describes a minimal lending primitive with abstraction layers built above it, reinforcing an infrastructure model but not establishing which entity ultimately records revenue.
    claimRefs: [CI001, CI002, CI003, CI004, CI005]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: traction-and-sales-efficiency
    title: Public traction and sales-efficiency limits
    body: |
      FinanceFeeds, The Block, and Unchained repeat Morpho's claim that the network crossed $11 billion in deposits and identify exchanges, wallets, and institutional service providers using the infrastructure. This is meaningful evidence of liquidity and distribution, but deposits are neither recognized revenue nor cash owned by Morpho Labs. The partner-led route could lower direct acquisition cost by embedding lending into existing interfaces, yet the assigned evidence provides no customer count, contract value, renewal rate, partner revenue share, implementation cost, sales cycle, CAC, or payback. Public traction therefore supports demand for the rail, not a quantified sales-efficiency conclusion. A usable operating model requires a dated bridge from fee-bearing balances and utilization to gross fees, partner and curator allocations, incentives, and net operating-company revenue.
    claimRefs: [CI006, CI009]
    tableRefs: [TI003]
  - id: financing-and-capital-adequacy
    title: Financing and capital adequacy
    body: |
      Multiple outlets report a $175 million June 2026 financing and an up-to-$2 billion valuation, but the transaction was a MORPHO token purchase rather than a disclosed conventional cash equity round. The stated use of proceeds is to deepen technical and commercial integrations and expand credit infrastructure. Those facts demonstrate financing access, not cash currently available for payroll, incentives, or acquisitions. Public databases also disagree on cumulative funding: Multiples reports $243 million across three rounds, Tracxn reports $249 million across six, and VentureBurn reports $244.35 million. Pappers shows a €482K 2024 net loss and €512K of cash for the French SASU, whose accounts were partially confidential; that entity-level snapshot should not be treated as a current consolidated group cash position.
    claimRefs: [CI007, CI008, CI009, CI010, CI011, CI012, CI013]
  - id: financial-verdict
    title: Financial verdict and diligence blockers
    body: |
      The strongest financial conclusion is that Morpho may have attractive operating leverage if lending activity becomes fee-bearing and if distribution partners deliver durable volume, but neither condition is quantified publicly. Revenue quality remains unproven because the evidence does not disclose realized take rates, revenue mix, recognition policy, customer concentration, or the allocation of economics among the DAO, association, curators, partners, and Morpho Labs. Margin and capital intensity are also open: engineering, security, compliance, incentives, integrations, and partner support may be material even when the core protocol is minimal. Adverse reviews identify curator-dependent risk, contagion exposure, and possible liquidity fragmentation. The investment case should remain blocked on entity-level financials, token-sale terms, treasury liquidity, fee ledgers, channel contracts, and cohort-level utilization.
    claimRefs: [CI001, CI002, CI003, CI006, CI008, CI013, CI014, CI015, CI016]

tables:
  - id: TI001
    title: Revenue streams and capture quality
    columns: [Stream, Mechanism, Unit, Public status, Revenue quality, Diligence ask]
    rows:
      - [Protocol fee switch, "Selected Morpho Blue markets can allocate part of borrower interest to the DAO", "% of total borrower interest", "Permitted range reported at 0% to 25%; activation and realized take rate not disclosed", "Potential DAO revenue, not proven Morpho Labs revenue", "Obtain market-by-market fee settings, fee-bearing volume, collections, and entity allocation"]
      - [MetaMorpho curator fee, "Vault curator charges a performance fee on yield earned", "% of earned yield", "EarnPark reports 5% to 15% by vault", "Curator economics; company participation is unknown", "Obtain curator agreements, realized fee schedules, rebates, and any Morpho share"]
      - [Supplier interest flow, "Borrowers pay interest that funds returns to liquidity suppliers", "Interest rate multiplied by utilized borrowing", "Mechanism described; retained spread is not disclosed", "Gross activity before protocol, curator, partner, and incentive allocations", "Reconcile utilization, borrower interest, supplier yield, bad debt, and retained fees"]
      - [Commercial integrations, "Technical and commercial embedding into exchanges, wallets, and financial platforms", "Contract or revenue-share terms", "Use of proceeds names integration expansion; pricing is undisclosed", "Potential recurring or services revenue remains unverified", "Request partner contracts, implementation fees, minimums, revenue shares, and concentration"]
    notes: "The sources describe mechanisms and quoted fee ranges, not audited Morpho Labs revenue; funding and deposits are excluded as revenue streams."
    claimRefs: [CI001, CI002, CI004, CI009]
  - id: TI002
    title: Pricing and monetization evidence
    columns: [Charge, Recipient, Denominator, Public value, Interpretation, Missing evidence]
    rows:
      - [Protocol supply fee, "Morpho protocol", "Supplied principal or yield", "0% reported by EarnPark", "A reported absence of supply-side protocol pricing, not proof of zero total monetization", "Current official schedule and historical fee receipts"]
      - [Curator performance fee, "MetaMorpho vault curator", "Yield earned", "5% to 15% reported by EarnPark", "Indicative third-party range; realized fees vary by vault", "Vault-level realized fees, discounts, rebates, and sharing terms"]
      - [Morpho Blue fee switch, "Morpho DAO", "Total borrower interest in a selected market", "0% to 25% permitted range reported by Gate", "Governance-configurable ceiling, not realized pricing", "Activation history, fee-bearing utilization, collections, and downstream allocation"]
      - [Partner economics, "Morpho and distribution partner, if contracted", "Undisclosed", null, "No public basis for realized enterprise pricing or channel margin", "Executed agreements, renewal terms, implementation cost, and partner concentration"]
    notes: "Protocol, DAO, curator, and partner charges have different recipients and denominators; null means unavailable in the assigned public evidence, not zero."
    claimRefs: [CI001, CI002, CI003]
  - id: TI003
    title: Unit economics and capital-adequacy ledger
    columns: [Metric, Public value, Confidence, Underwriting use, Diligence ask]
    rows:
      - [Deposits, "More than $11B claimed by Morpho and repeated by independent outlets", "High confidence in attribution; unverified as revenue", "Distribution and liquidity signal only", "Reconcile dated deposits to utilization, fee-bearing balances, and retained revenue"]
      - [Revenue and ARR, null, "Unavailable", "Cannot calculate growth, mix, or valuation multiples", "Provide audited revenue by line, recognition policy, and monthly recurring components"]
      - [Gross margin, null, "Unavailable", "Cannot test operating leverage or service-delivery burden", "Provide direct infrastructure, incentives, security, support, curator, and partner costs"]
      - [CAC and payback, null, "Unavailable", "Cannot assess partner-led sales efficiency", "Provide sales spend, implementation cost, contracted revenue, renewal, and cohort retention"]
      - [Latest financing, "$175M MORPHO token purchase in June 2026", "High for transaction occurrence; cash availability unknown", "Shows financing access but not unrestricted operating cash", "Review token-sale contracts, settlement assets, lockups, recipients, and treasury custody"]
      - [Financing valuation, "Up to $2B reported", "High for reported headline; basis not disclosed", "Reference price for the financing, not an earnings valuation", "Obtain fully diluted security rights, token/equity linkage, dilution, and valuation mechanics"]
      - [French SASU 2024 snapshot, "€482K net loss and €512K cash; accounts partially confidential", "Medium; entity-level historical data", "Does not establish current consolidated burn or runway", "Reconcile the SASU to the operating group, association, DAO, and post-financing treasury"]
      - [Burn and runway, null, "Unavailable", "Determines financing dependency and next-round timing", "Provide monthly cash burn, liquid token treasury, debt, headcount plan, and downside runway"]
    notes: "Funding raised, valuation, deposits, accounting loss, and cash are distinct measures. Pappers data relate to the French SASU for 2024 and are not presented as a current consolidated group balance."
    claimRefs: [CI006, CI007, CI008, CI009, CI013]

figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: The operating question is where borrower interest becomes supplier yield, curator fees, DAO fees, and any retained Morpho Labs revenue.
    data:
      nodes:
        - id: borrower-demand
          label: Borrower demand
          detail: "Borrowers draw liquidity from isolated Morpho Blue markets."
          unit: "borrowed principal"
        - id: borrower-interest
          label: Borrower interest
          detail: "Interest accrues against utilized borrowing."
          unit: "% of utilized borrowing"
        - id: supplier-yield
          label: Supplier yield
          detail: "Most underlying interest supports returns to liquidity suppliers."
          unit: "yield"
        - id: protocol-fee-switch
          label: DAO fee switch
          detail: "Selected markets can direct a reported 0% to 25% of total interest to the Morpho DAO."
          unit: "% of total interest"
        - id: metamorpho-vault
          label: MetaMorpho vault
          detail: "A curator allocates supplied assets among Morpho Blue markets."
          unit: "allocated assets"
        - id: curator-fee
          label: Curator performance fee
          detail: "EarnPark reports 5% to 15% of earned yield, varying by vault."
          unit: "% of earned yield"
        - id: operating-company
          label: Morpho Labs revenue
          detail: "Entity-level capture from DAO, curators, or partners is not publicly reconciled."
          unit: "unavailable"
    approximationNotes: "This is a mechanism map, not a value-proportional bridge or forecast; it does not treat deposits, supplier yield, DAO receipts, or curator fees as Morpho Labs revenue."
    claimRefs: [CI001, CI002, CI003, CI004, CI005]

callouts:
  - calloutType: strength
    title: Financing access is demonstrated
    body: Multiple independent outlets report a $175M June 2026 financing involving major crypto and traditional-finance investors.
    claimRefs: [CI007]
  - calloutType: risk
    title: Scale metrics do not prove monetization
    body: The reported $11B deposit figure measures network activity, not recognized revenue, gross profit, or cash available to Morpho Labs.
    claimRefs: [CI006]
  - calloutType: recommendation
    title: Require an entity-level bridge
    body: Do not apply a revenue multiple until management reconciles borrower interest, curator and DAO fees, partner economics, token financing, and operating-company cash flows.
    claimRefs: [CI001, CI002, CI003, CI008, CI013]

