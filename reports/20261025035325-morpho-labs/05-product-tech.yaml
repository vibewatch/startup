    rows:
      - ["Borrow against crypto collateral", "Select a pool with shared risk parameters", "Select or enter an isolated Blue market with specified collateral and oracle", "Market-specific terms and risk containment", "Borrower still bears liquidation and oracle risk"]
      - ["Earn yield without configuring every market", "Review individual markets and parameters", "Deposit through a curated MetaMorpho vault", "Simpler access and delegated allocation", "Curator quality and underlying liquidity determine the experience"]
      - ["Embed credit in a wallet or exchange", "Build and operate a separate lending backend", "Integrate Morpho-powered loans or vaults", "Reusable non-custodial lending primitive", "Integrator controls, compliance, support, and distribution layer"]
      - ["Offer predictable credit terms", "Use variable-rate DeFi pools", "Use the described V2 offer-based fixed-rate and fixed-term design", "Potentially closer fit to structured credit workflows", "Public materials do not verify production scale or execution quality"]
    notes: "The benefit column states architectural or workflow implications, not independently measured customer outcomes; no public source in this chapter establishes realized conversion, retention, or net performance."
    claimRefs: [CE002, CE003, CE008, CE012]
  - id: TE003
    title: Technology and operating architecture
    columns: [Layer or process, Role, Dependency, Risk]
    rows:
      - ["Core contract", "Executes non-custodial lending markets", "EVM deployment and audited code", "Smart-contract defects and deployment-specific failure"]
      - ["Market configuration", "Defines assets, oracle, LLTV, and interest model", "Market creator and oracle availability", "Parameter errors and fragmented liquidity"]
      - ["Vault and curator layer", "Allocates deposits across markets", "Curator process and underlying withdrawal liquidity", "Concentration, misallocation, or delayed liquidity"]
      - ["Integrator and application layer", "Provides wallet, exchange, or fintech user experience", "Partner controls, compliance, and support", "Operational or customer-service failure outside core contracts"]
      - ["Governance and legal entities", "Coordinates protocol resources and ownership", "MORPHO governance and Morpho Association structure", "Unclear fee, token, equity, and accountability boundaries"]
      - ["Cross-chain deployments", "Extends access across networks", "Chain security, bridges, and deployment operations", "Additional dependency and incident surface"]
    notes: "Architecture is synthesized from the repository, protocol descriptions, and reported operating structure; the table separates observed components from risks that require further operating evidence."
    claimRefs: [CE005, CE006, CE009, CE010, CE011, CE013]
figures:
  - id: FE001
    title: Morpho product architecture map
    type: stack
    summary: The product separates a narrow lending primitive from market configuration, curation, and distribution layers.
    data:
      layers:
        - label: Distribution
          detail: Application distribution and user-facing access.
          items:
            - label: Wallets, exchanges, and fintechs
              detail: Embed Morpho-powered lending or yield experiences for end users.
        - label: Curated access
          detail: Delegated market selection and allocation.
          items:
            - label: MetaMorpho vaults
              detail: Curators allocate deposits across selected isolated markets.
        - label: Market layer
          detail: Configured lending venues with explicit risk parameters.
          items:
            - label: Morpho Blue markets
              detail: Markets specify loan asset, collateral, LLTV, oracle, and interest-rate model.
        - label: Core protocol
          detail: Non-custodial execution primitive.
          items:
            - label: Immutable EVM contracts
              detail: Non-custodial base primitive with permissionless market creation and integrator-oriented callbacks.
        - label: External dependencies
          detail: Services and networks required for pricing and execution.
          items:
            - label: Oracles, chains, and liquidation venues
              detail: External systems affect pricing, execution, and loss containment.
        - label: Security and operations
          detail: Assurance and operational controls around deployments and partners.
          items:
            - label: Audits, incident response, and support controls
              detail: Public evidence is incomplete for the full operating-control package.
    approximationNotes: "Layer order is an analytical representation of documented product composition, not a measured control hierarchy or proof that every deployment uses every layer."
    claimRefs: [CE001, CE005, CE006, CE009]
