schemaVersion: "report-v2"
artifact: customers
slug: morpho-labs
runDate: 2026-10-25
company:
  name: Morpho Labs
chapter:
  number: 6
  title: Customers
  summary: Morpho is primarily an infrastructure layer consumed through exchanges, wallets, vault curators, and institutional integrations rather than a single consumer application. Public evidence supports named integrations and substantial on-chain activity, but does not establish retention, revenue concentration, or renewal durability.
sections:
  - id: customer-segments
    title: Customer and user segmentation
    body: >-
      Morpho serves several economically distinct groups. Retail and crypto-native depositors can access curated MetaMorpho vaults, while borrowers use lending markets directly or through familiar front ends. Exchanges, wallets, payment platforms, and financial institutions are the higher-value distribution layer: they embed Morpho rails while owning the customer interface and, in some cases, the compliance relationship. The source evidence therefore supports a platform-to-platform customer model more strongly than a direct-to-consumer one. Buyer, user, and payer are not necessarily the same party, and public materials do not disclose revenue by segment or the commercial terms attached to integrations.
    claimRefs: [CU001, CU003, CU004, CU005]
    tableRefs: [TU001]
  - id: adoption-trajectory
    title: Adoption and usage trajectory
    body: >-
      Public metrics indicate meaningful usage, but the figures are not directly comparable because they come from different publishers, dates, and measurement conventions. A Gate Learn article reported $1.4 billion of TVL and more than $880 million of loans, while a DefiLlama snapshot in the assigned evidence showed $11.328 billion of TVL across many chains. The gap is a diligence signal rather than a growth rate: neither source supplies a consistent historical series, active-user denominator, utilization definition, or reconciliation to Morpho Labs revenue. Standard Chartered coverage also frames Morpho as infrastructure for onchain banks and asset managers, which is evidence of institutional positioning, not proof of contracted adoption.
    claimRefs: [CU006, CU007, CU008]
    tableRefs: [TU002]
  - id: named-customer-proof
    title: Named deployments and customer proof
    body: >-
      Named evidence is strongest where an external platform describes a concrete product or integration. Coinbase is reported as using Morpho for Bitcoin-backed USDC loans on Base, with an additional Ethereum-backed loan product described in the same account. Trust Wallet currently offers access to Morpho vaults in its Stablecoin Earn product. Crypto.com and Cronos are described as preparing stablecoin lending markets, while SG-FORGE is described as integrating compliant stablecoins into Morpho. The evidence distinguishes deployed or announced product surfaces from pilots and future plans: the Crypto.com/Cronos account explicitly describes expected future deployment, and the reviewed materials do not provide customer outcome metrics, production volumes, service-level commitments, or customer-paid fees. This makes reference quality more important than logo count when assessing commercial traction.
    claimRefs: [CU004, CU005, CU009, CU015]
    tableRefs: [TU003]
  - id: durability-and-concentration
    title: Durability, expansion, and concentration risk
    body: >-
      No assigned source provides NRR, GRR, churn, renewal rates, contract length, cohort retention, or a customer-level revenue concentration schedule. Morpho's distribution model can expand through additional front ends and curated vaults, but it also places customer access and parts of the relationship with partners. A December 2025 account reported temporary liquidity shortfalls in three to four of more than 320 vaults, with no reported losses or bad debt; an April 2026 review separately described curator quality and ecosystem contagion as material risks. These observations do not prove customer churn, but they identify the operational and trust events that could impair retention and make partner diligence central.
    claimRefs: [CU003, CU010, CU011, CU014]
    figureRefs: [FU001]
  - id: exhibits
    title: Exhibits
    body: >-
      The exhibits consolidate the available customer evidence without treating logos, TVL, or announced integrations as equivalent to recurring revenue. The named-customer table marks production-style interfaces separately from preparation or roadmap language, and the adoption table preserves each source's date and denominator limitations. Retention and concentration remain open because the assigned public record does not disclose customer-level economics or a time-series cohort view. This distinction prevents aggregate protocol activity from being mistaken for contracted customer durability.
    claimRefs: [CU006, CU008, CU012, CU013]
tables:
  - id: TU001
    title: Customer segmentation table
    columns: [Segment, Buyer or payer, User and use case, Strategic value, Evidence gap]
    rows:
      - [Retail depositor, Depositor or vault share holder, Uses MetaMorpho vaults for passive lending exposure, Distribution and deposits, No disclosed active-account or revenue denominator]
      - [Crypto-native borrower, Borrower or market participant, Borrows against collateral through Morpho markets or an integrated front end, Loan demand and utilization, No disclosed repeat-borrow or cohort data]
      - [Exchange or wallet user, Exchange or wallet partner, Uses a partner interface for products such as Bitcoin-backed loans, Scalable distribution and embedded credit, Commercial terms and production volumes not disclosed]
      - ["Institutional or asset-management user", "Institution or asset manager", "Potentially accesses bespoke or compliant onchain lending", "Higher-value use cases and credibility", "No disclosed contracts, fees, or renewal evidence"]
    notes: "Segments are synthesized from named use cases and architecture descriptions; public sources do not establish payer identity, recurring revenue, or segment size."
    claimRefs: [CU001, CU003, CU004, CU005, CU008, CU016]
  - id: TU002
    title: Customer growth / adoption trajectory
    columns: [Metric, Reported value, Date or period, Source basis, Confidence, Implication and missing denominator]
    rows:
      - [Total value locked, "$1.4 billion", "Not stated in fetched Gate Learn text", "Gate Learn article citing DeFiLlama", medium, "Indicates scale but lacks chain scope and historical baseline"]
      - [Loans, "More than $880 million", "Not stated in fetched Gate Learn text", "Gate Learn article", medium, "Shows borrowing activity but not unique borrowers or utilization"]
      - [Total value locked, "$11.328 billion", "Snapshot accessed 2026-10-25", "DefiLlama protocol page", medium, "Shows a later multi-chain snapshot but is not a like-for-like series with the Gate figure"]
      - [Institutional positioning, "Infrastructure powering onchain banks and asset managers", "Published 2026-07-01", "CoinDesk summary of Standard Chartered coverage", medium, "Supports positioning, not contracted customer adoption"]
    notes: "Values are publisher-reported and not normalized across dates, chains, or definitions; no growth rate is calculated and no active-user denominator is available."
    claimRefs: [CU006, CU007, CU008]
  - id: TU003
    title: Named customer proof table
    columns: [Customer or partner, Segment, Deployment or use case, Production vs pilot, Outcome evidence, Limitation]
    rows:
      - ["Coinbase", "Exchange", "Bitcoin-backed USDC loans on Base and an Ethereum-backed loan product", "Reported launched product surface", "Borrowing limits up to $1 million are reported", "No volumes, fees, or retention disclosed"]
      - ["Crypto.com and Cronos", "Exchange and network partners", "Stablecoin lending markets backed by wrapped Bitcoin and Ethereum", "Preparation / expected deployment", "Partnership and intended market design are reported", "Account describes future deployment and no customer outcome"]
      - ["SG-FORGE / Société Générale", "Regulated financial institution", "Integration of EURCV and USDCV stablecoins into Morpho", "Announced integration", "Institutional access to onchain lending is the stated use", "No usage, contract, or renewal data"]
      - ["Ledger", "Wallet / financial-product interface", "Crypto Loan feature using Morpho infrastructure", "Named integration", "Use as an integrated lending rail is reported", "No date, volume, or commercial terms in the fetched excerpt"]
      - ["Trust Wallet", "Self-custody wallet", "Stablecoin Earn offers access to Morpho vaults", "Live product page", "Morpho is available inside a consumer earning flow", "Morpho-specific users, assets, and economics are not disclosed"]
    enumerationScope:
      coverage: sample
      basis: "Sample of named integrations and customer-facing use cases found in the assigned prefetched sources, through the 2026-10-25 run date."
    notes: "Named references are not equivalent to paid customers or retained production deployments; rows preserve future-plan language where the source uses it."
    claimRefs: [CU004, CU005, CU009, CU015]
figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: Morpho's customer path runs from capital providers and borrowers through curated or partner interfaces into embedded credit products.
    data:
      nodes:
        - id: capital-provider
          label: Capital provider
          detail: Retail or institutional depositor supplies capital through a vault or lending market.
          touchpoints: [MetaMorpho vaults, Morpho Blue markets]
        - id: risk-interface
          label: Curator or risk interface
          detail: Curators allocate deposits across markets and expose a managed user experience.
          touchpoints: [Curated vault, Risk parameters]
        - id: borrower
          label: Borrower
          detail: Crypto-native or institutional borrower seeks collateralized credit.
          touchpoints: [Collateral deposit, Loan market]
        - id: distribution-partner
          label: Distribution partner
          detail: Exchange, wallet, payment platform, or bank places the lending interface in front of end users.
          touchpoints: [Coinbase, Crypto.com, SG-FORGE, Ledger]
        - id: embedded-product
          label: Embedded credit product
          detail: End user receives a partner-branded loan or yield product while Morpho supplies rails.
          touchpoints: [Bitcoin-backed loan, Stablecoin lending, Institutional lending]
        - id: expansion-loop
          label: Expansion loop
          detail: Additional assets, chains, vaults, or partner interfaces can broaden use, but retention and economics are undisclosed.
          touchpoints: [More markets, More front ends]
    claimRefs: [CU001, CU003, CU004, CU005, CU014]
callouts:
  - calloutType: strength
    title: Embedded distribution is the strongest public customer signal
    body: Named exchange, wallet, and financial-institution integrations show Morpho being used as backend credit infrastructure rather than only as a standalone DeFi destination.
    claimRefs: [CU001, CU004, CU005]
  - calloutType: risk
    title: Retention and concentration cannot be underwritten publicly
    body: The assigned evidence does not disclose cohort retention, renewal, revenue concentration, or partner economics, so durability remains a material diligence gap.
    claimRefs: [CU012, CU013, CU014]
