schemaVersion: report-v2
artifact: financials
slug: applyboard
runDate: 2026-10-16
company:
  name: ApplyBoard
chapter:
  number: 4
  title: Financials
  summary: ApplyBoard's public record supports a channel-led tuition-share model layered with ancillary student services, but disclosure still stops short of current revenue, margin, burn, and runway. Official surfaces show scale and workflow depth, while historical coverage and Tracxn establish sizable funding and past growth without providing the private unit economics needed for underwriting.
sections:
  - id: revenue-model
    title: Revenue model and monetization
    body: >-
      ApplyBoard's public materials describe a two-sided distribution model
      rather than a student-paid SaaS subscription. Current official surfaces
      say recruitment partners join for free, gain access to 1,500+
      institutions without negotiating individual contracts, and can sell
      add-on services such as loans, GICs, housing, and language-test vouchers
      through 360 Solutions. Independent reporting adds the most important
      missing mechanic: Crunchbase said ApplyBoard monetizes via
      revenue-sharing agreements with postsecondary institutions based on
      landed students. That combination points to a core institutional
      commission stream plus ancillary service monetization, but realized take
      rates, rebates, and service-level margins are still undisclosed.
    claimRefs: [CI001, CI002, CI003, CI004, CI016]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: traction-proxies
    title: Traction and operating-economics proxies
    body: >-
      Public traction disclosures emphasize throughput and network scale more
      than revenue quality. The October 2026 backgrounder cites 1.5M+ students
      helped, 1,500+ institution partners, 5,000+ recruitment partners, and
      150,000+ programs, while current official sales pages continue to market
      an approximately 95% application-success rate enabled by AI tooling,
      document verification, and direct institution communication. Historical
      press coverage also describes exceptional early growth, including 13x
      revenue growth over roughly ten months before the 2019 Series B and 500%
      year-over-year revenue growth in 2019. Even so, the same workflow detail
      implies meaningful human-service cost alongside software automation, and
      no public source in this pool discloses gross margin, CAC, payback, or
      realized channel commission rates.
    claimRefs: [CI005, CI006, CI007, CI008, CI012, CI013, CI014, CI015]
    tableRefs: [TI003]
  - id: capital-adequacy
    title: Capital adequacy and underwriting blockers
    body: >-
      ApplyBoard has clearly demonstrated access to outside capital, but
      current adequacy is still not publicly underwritable. Tracxn reports
      $496M raised across five rounds, including a $310M Series D in June 2021
      at a $3.2B post-money valuation, and earlier 2019-2020 coverage says
      management planned to use fresh capital for technology, expansion, and
      hiring. Those facts support a long-running strategy of financing growth
      ahead of full public transparency on earnings quality. What remains
      missing is the decision-grade layer: current cash balance, monthly burn,
      debt obligations, corridor-level revenue exposure, and whether
      service-heavy operations can sustain attractive margins if recruiter
      commissions or destination-country policies tighten.
    claimRefs: [CI009, CI010, CI011, CI013, CI015]
callouts:
  - calloutType: risk
    title: Public evidence supports scale, not underwritable economics
    body: >-
      ApplyBoard looks commercially significant, but current public evidence
      does not disclose realized take rates, gross margin, CAC, burn, runway,
      or corridor revenue concentration. That leaves the investment case
      dependent on management data room materials rather than public-market
      style financial evidence.
    claimRefs: [CI006, CI013, CI015]
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current value/status
      - Quality
      - Diligence ask
    rows:
      - - Institution-paid placement commissions
        - Independent reporting says ApplyBoard earns revenue-sharing payments from postsecondary institutions after student placement/enrollment.
        - "% of tuition or contracted revenue share"
        - Active, but public take rate is undisclosed.
        - Medium
        - Request sample institution agreements plus cohort-level realized take rates and clawback terms.
      - - Recruitment-partner monetization
        - Partners join for free, but official partner rewards reference higher commission and priority service tiers.
        - Commission tier / service entitlement
        - Active incentive structure; exact payouts are undisclosed.
        - Low
        - Request partner commission schedule, tier qualification rules, and net revenue after channel payouts.
      - - 360 Solutions ancillary services
        - Official pages market student loans, GIC/proof-of-funds support, housing, language-test vouchers, and related financial services.
        - Per service / referral / markup
        - Active, but revenue mix and gross margin are undisclosed.
        - Low
        - Request revenue and contribution margin by ancillary product line.
      - - Student-facing core application support
        - Public materials position the core platform as free for students and free for recruiters to join.
        - Direct fee
        - Publicly shown as zero or institution-borne rather than student subscription revenue.
        - Medium
        - Confirm whether any direct student fees, application-processing charges, or monetized premium tiers exist.
    notes: Nulls and qualitative labels reflect undisclosed economics; active means the stream is marketed on current public surfaces, not that public revenue is quantified.
    claimRefs: [CI001, CI002, CI003, CI004, CI014, CI016]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Price / unit / contract
      - List vs realized pricing
      - Discounts / unknowns
      - Source
    rows:
      - - Recruitment partner onboarding is free; most accounts are reviewed within 48 hours.
        - List pricing is explicit, but realized economics are irrelevant because onboarding itself is not the paid product.
        - No disclosure of downstream partner-specific commercial terms.
        - SI003
      - - Student core application support is marketed at no cost beyond institution application fees.
        - Publicly explicit on list pricing; realized student net revenue appears zero on core workflow.
        - No disclosure on premium student upsells or service fees retained by ApplyBoard.
        - SI002, SI006
      - - Institution economics are described as revenue share tied to landed students.
        - Mechanism is disclosed, but neither list rates nor realized take rates are public.
        - Unknown by institution, destination, and program mix.
        - SI002
      - - 360 Solutions includes loans, GICs, housing, test vouchers, and other services.
        - Product availability is public, but price points and revenue capture are not.
        - Unknown attach rates, partner commissions, and gross margins.
        - SI003, SI007
    notes: This table separates public list-style disclosures from absent realized pricing; unknown means the current source set does not publish a usable commercial schedule.
    claimRefs: [CI001, CI003, CI004, CI016]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - Application success proxy
        - "~95% chance of application success / offer letter"
        - High
        - Indicates workflow quality and potential conversion leverage, but not revenue or profitability.
        - Verify denominator, period, and whether the metric is applications, offers, or enrollments.
      - - Institution network
        - 1,500+ institutions
        - High
        - Larger supply breadth can support conversion and bargaining power, but it does not reveal monetization per institution.
        - Request active institution count by destination and revenue contribution by top partners.
      - - Recruitment partner network
        - 5,000+ recruitment partners
        - High
        - Signals channel reach, but also implies commission expense and quality-control overhead.
        - Request active vs registered partner split, productivity distribution, and commission expense ratio.
      - - Program inventory
        - 150,000+ global programs
        - High
        - Shows catalog breadth, not conversion, retention, or unit margin.
        - Request application-to-enrollment conversion by destination and program type.
      - - Historical growth proxy
        - 13x revenue growth over ~10 months before Series B; 500% YoY revenue growth in 2019
        - Medium
        - Supports prior velocity, but the figures are old and not a basis for current underwriting.
        - Request audited 2024-2026 revenue bridge and monthly trajectory.
      - - Current headcount proxy
        - "750+ global team members (official backgrounder) vs 1,069 employees (Tracxn)"
        - Low
        - Headcount affects operating leverage and burn assumptions, but the public figures are inconsistent.
        - Reconcile current FTEs, contractors, and geographic/service mix.
      - - Gross margin
        - null
        - Low
        - Margin is central because document review, institution communication, and partner support suggest nontrivial service delivery costs.
        - Request gross margin by revenue stream and labor allocation methodology.
      - - CAC / payback
        - null
        - Low
        - Channel incentives and partner enablement costs cannot be evaluated without acquisition efficiency.
        - Request partner acquisition cost, activation rate, and payback by cohort.
      - - Cash / burn / runway
        - null
        - Low
        - Capital adequacy cannot be judged without current liquidity and spend cadence.
        - Request cash balance, debt, monthly burn, runway, and next-round trigger assumptions.
    notes: Null means not publicly disclosed in the assigned source pool; historical figures are retained as dated proxies, not current operating metrics.
    claimRefs: [CI005, CI006, CI007, CI008, CI012, CI013, CI014, CI015]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: Public evidence supports a channel-led flow from student demand to institution-paid commissions and ancillary service monetization, but not the take rates at each step.
    data:
      nodes:
        - id: student-demand
          label: Student demand
          summary: Students search for study-abroad programs and can use the core workflow at no direct platform fee.
          claimRefs: [CI004, CI016]
        - id: recruiter-channel
          label: Recruiter channel
          summary: Recruitment partners join for free and use ApplyBoard as a consolidated institution-access layer.
          claimRefs: [CI001, CI002]
        - id: matching-workflow
          label: Matching and application prep
          summary: AI-assisted matching, document collection, and standardized application flows sit inside the platform.
          claimRefs: [CI003, CI005]
        - id: quality-screen
          label: Quality and institution handoff
          summary: ApplyBoard reviews documents, resolves missing requirements, and communicates with institutions directly.
          claimRefs: [CI005, CI012]
        - id: enrolled-student
          label: Enrolled student outcome
          summary: ApplyBoard's disclosed core monetization is tied to landed students rather than student subscriptions.
          claimRefs: [CI004, CI016]
        - id: monetization
          label: Revenue outputs
          summary: Public evidence points to institution revenue share plus ancillary-service monetization and partner incentive expense.
          claimRefs: [CI003, CI004, CI014]
      edges:
        - from: student-demand
          to: recruiter-channel
          label: Students are sourced and advised through partner channel
          claimRefs: [CI002, CI016]
        - from: recruiter-channel
          to: matching-workflow
          label: Partner uses centralized search, eligibility, and submission workflow
          claimRefs: [CI002, CI005]
        - from: matching-workflow
          to: quality-screen
          label: ApplyBoard adds QA, document review, and institution communication
          claimRefs: [CI005, CI012]
        - from: quality-screen
          to: enrolled-student
          label: Better application quality is marketed as higher success odds
          claimRefs: [CI005]
        - from: enrolled-student
          to: monetization
          label: Institution revenue share and ancillary products activate after successful placement
          claimRefs: [CI003, CI004]
    approximationNotes: This figure shows the disclosed workflow and monetization logic only; it does not imply public conversion rates, take rates, or gross margins.
    claimRefs: [CI002, CI003, CI004, CI005, CI012, CI014, CI016]
