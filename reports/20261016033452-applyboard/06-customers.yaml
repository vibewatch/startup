schemaVersion: report-v2
artifact: customers
slug: applyboard
runDate: 2026-10-16
company:
  name: ApplyBoard
chapter:
  number: 6
  title: Customers
  summary: >-
    ApplyBoard's public evidence supports a scaled, agency-led recruitment marketplace:
    recent company pages claim 1,500+ institutions and 150,000+ programs, historical
    independent reporting confirms enrolled-student monetization, and named partner
    testimonials show production use. Most adoption metrics remain company-controlled and
    heterogeneous, while retention, renewal, contract duration, and concentration are absent
    from the assigned public evidence.
sections:
  - id: customer-architecture
    title: Customer architecture is a multi-sided network, with institutions paying and agencies driving throughput
    body: |
      ApplyBoard publicly presents itself as a three-sided platform linking students, recruitment partners, and schools, with recruitment partners acting as the most visible daily users and institutions as the monetized supply side. The official surfaces describe partners using a unified workflow for program discovery, multi-school submission, status tracking, document handling, and adjacent services such as loans, language-test vouchers, and accommodation support. Forbes' historical reporting fills in the economic model: students use the platform at no direct platform fee beyond school application fees, while institutions pay ApplyBoard once an enrolled student clears the process. That combination suggests the customer base is best understood as a channel marketplace rather than a pure student-subscription product.
    claimRefs: [CU001, CU003, CU004, CU010]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-proof
    title: Public adoption proof shows network scale and active agency usage, but only limited quantified production evidence
    body: |
      The evidence establishes scale without supporting a clean, current growth series. Forbes reported 120,000 students and 1,200+ schools in 2020, and ApplyBoard reported 200,000 students and 7,500+ recruitment partners in 2021. A March 2026 company guide says the network covers 1,500+ institutions, while the current recruitment-partner page markets 150,000+ programs. An undated World.uz profile claims still larger cumulative counts, but its unknown publication date prevents treating those figures as a 2026 endpoint. Named agency testimonials and World.uz's live service page indicate production use; historical independent reporting adds named universities but no current per-school volume, conversion, or contract depth.
    claimRefs: [CU002, CU006, CU007, CU008, CU009, CU011]
    tableRefs: [TU002, TU003]
  - id: durability-and-concentration
    title: Durability and concentration are the core unresolved customer questions
    body: |
      The chapter has enough evidence to support adoption and workflow claims, but not enough to validate customer durability. None of the retained public materials disclose NRR, GRR, churn, renewal cadence, contract length, or top-customer concentration, so recurring institutional demand remains opaque. ApplyBoard's own market commentary also points to conversion fragility: it projects that Canada issued about 140,000 new international student visas in 2025, 54% fewer than in 2024, and says study-abroad decisions are increasingly governed by affordability and work prospects. The network appears real, but investors still need private cohort, destination-mix, and top-account data before underwriting stickiness or concentration exposure.
    claimRefs: [CU012, CU013, CU014, CU015, CU016]
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Use case
      - Scale / evidence
      - Revenue / strategic value
      - Gap
    rows:
      - - Students
        - Users; no direct platform fee publicly disclosed
        - Discover programs, submit applications, and receive visa / arrival support
        - 120,000 reported in 2020 and 200,000+ company-reported in 2021
        - Provides demand flow that monetizes institutional relationships and adjacent services
        - No public repeat-usage, geography, or conversion-by-student-cohort disclosure
      - - Recruitment partners / agencies
        - Daily users and channel partners; commissions paid after enrolment
        - Search programs, manage documents, submit applications, track status, and upsell 360 services
        - 7,500+ company-reported in 2021; an undated partner profile claims 10,000+
        - Core distribution engine and quality-control layer for student acquisition
        - No public partner retention, take-rate, or partner concentration disclosure
      - - Institutions
        - Supply-side customers and payers
        - Receive screened applications and access ApplyBoard's partner network
        - 1,500+ in a March 2026 guide; historical named universities cited by Forbes
        - Universities pay a tuition-linked fee once students enrol
        - No current top-school mix, contract economics, or renewal data
      - - 360 Solutions / adjacent services
        - Students and partners use embedded add-ons
        - Loans, GICs, test vouchers, and accommodation support inside the partner workflow
        - Official guide describes these as part of the partner dashboard
        - Land-and-expand path beyond core application submission
        - No attach-rate, margin, or cohort-usage disclosure
    notes: Mixed stakeholder rows combine official workflow descriptions with historical media reporting; missing economics and concentration metrics remain unverified.
    claimRefs: [CU001, CU002, CU003, CU004, CU006, CU007, CU010]
  - id: TU002
    title: Customer growth / adoption trajectory table
    columns:
      - Metric
      - Value
      - Date
      - Source
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - - Students assisted
        - 120,000+
        - 2020
        - Forbes
        - Medium
        - Historical proof that the platform had meaningful throughput before the 2021 Series D period
        - No active-user, repeat-usage, or cohort-quality denominator
      - - Students assisted
        - 200,000+
        - 2021
        - ApplyInsights Q&A
        - Medium
        - Company-reported growth inflection in the agency-led channel
        - No split by destination, geography, or paying institution
      - - Partner institutions
        - 1,500+
        - March 2026
        - Recruitment-partner guide
        - Medium
        - Recent company evidence of broad institution coverage
        - No active-school, application-volume, or revenue denominator
      - - Recruitment partners
        - 7,500+
        - 2021
        - ApplyInsights Q&A
        - Medium
        - Shows broad pre-2026 agency footprint
        - No retention or revenue-per-partner data
      - - Partner-profile scale claims
        - 400,000+ students, 10,000+ recruitment partners, and 1,600+ institutions
        - Undated; accessed October 2026
        - World.uz
        - Medium
        - Indicates a larger claimed network, but cannot anchor a dated trajectory
        - Publication date, active-user basis, geography, and productivity are missing
      - - US destination search share
        - Over 25% of all destination-country queries, up from around 10% in 2023
        - Jan-Mar 2025 vs 2023
        - US institutions article
        - Medium
        - Shows measurable demand shift inside the platform toward US programs
        - Search share is not the same as enrolments or revenue
      - - Conversion filter / visa outcome
        - One in two applications passed to institutions; two in three ApplyBoard students approved for F-1 since 2021
        - 2021-2025
        - US institutions article
        - Medium
        - Suggests ApplyBoard screens applications before they reach school customers
        - US-specific outcome does not prove company-wide retention or unit economics
    notes: Rows mix cumulative counts, search-share metrics, and US-specific conversion indicators; they show traction directionally but are not a common cohort or revenue basis.
    claimRefs: [CU002, CU006, CU007, CU012, CU013]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome
      - Limitation
    rows:
      - - D Vivid Consultant (India)
        - Recruitment partner
        - Uses ApplyBoard's AI-enabled portal, WhatsApp integration, and automatic application submission
        - Appears production; quoted as an active user
        - Says the platform increased student reach and school options while ApplyBoard assessed eligibility
        - Official testimonial; no date, volume, or retention metric disclosed
      - - EduTurkiye (Türkiye)
        - Recruitment partner
        - Uses search and application-preparation workflow
        - Appears production; quoted as an active user
        - Says the search feature saves time and improves student-file preparation
        - Official testimonial; no quantified commercial outcome
      - - World.uz
        - Recruitment partner / study-abroad agency
        - Publicly markets program search, document prep, application submission, scholarship help, and visa support tied to ApplyBoard-linked study flows
        - Appears production via a live public service offering
        - Independent evidence that an external agency embeds ApplyBoard in its admissions workflow
        - No disclosed volume, exclusivity, or commercial terms
      - - Named partner universities in Forbes 2020
        - Institutions
        - Historical supply-side relationships including University of Delaware, Arizona State, Johns Hopkins, McGill, and University of Manchester
        - Production as of the 2020 media report
        - Shows ApplyBoard had public institution customers across major English-speaking destinations
        - Stale secondary snapshot with no current volume or renewal detail
    notes: This is a partial public sample of named agency and institution proof, not an exhaustive customer list; most outcome evidence remains testimonial or historical.
    enumerationScope:
      coverage: partial
      basis: Public 2020-2026 English-language sample of named agencies and institutions visible in the assigned source pool, not a full customer roster.
    claimRefs: [CU008, CU009, CU011]
figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: Public evidence shows ApplyBoard operating as an agency-led student acquisition workflow with institutional monetization and adjacent-service expansion.
    data:
      items:
        - label: Student discovery
          actor: Students
          phase: Top of funnel
          touchpoints:
            - Search 150,000+ study programs
            - Compare destinations and affordability
        - label: Recruitment partner intake
          actor: Recruitment partners
          phase: Qualification
          touchpoints:
            - Manage student profiles and documents
            - Use built-in quality checks before submission
        - label: Program matching
          actor: Recruitment partners and students
          phase: Matching
          touchpoints:
            - Explore 1,500+ institutions
            - Filter by destination, field, level, and intake
        - label: Application submission
          actor: ApplyBoard operations
          phase: Fulfilment
          touchpoints:
            - Submit applications directly to institutions
            - Communicate with schools on missing requirements
        - label: Offer and status tracking
          actor: Recruitment partners and institutions
          phase: Conversion
          touchpoints:
            - Monitor progress in real time
            - Screen out weaker files before schools review them
        - label: Expansion and monetization
          actor: Institutions, partners, and students
          phase: Post-offer
          touchpoints:
            - Tuition-linked institutional fee after enrolment
            - 360 services such as loans, vouchers, and accommodation
    approximationNotes: null
    claimRefs: [CU003, CU004, CU005, CU010, CU013]
callouts:
  - calloutType: strength
    title: Scaled channel network is clearly evidenced
    body: Company-controlled sources show broad program and institution coverage, while Forbes confirms that the marketplace model and named institution relationships were already material in 2020.
    claimRefs: [CU002, CU006, CU007, CU010, CU011]
  - calloutType: risk
    title: Retention quality is still the missing diligence variable
    body: Public sources support acquisition and workflow claims, but they do not disclose churn, renewal, NRR/GRR, or top-account concentration, while policy and affordability headwinds can still weaken conversion quality.
    claimRefs: [CU014, CU015, CU016]
