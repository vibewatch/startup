evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cover-metrics
    missingEvidence: Current revenue, ARR, customer count, and current audited headcount by period.
    whyItMatters: >-
      Later judgment and valuation work need current scale metrics, not just historical funding and company-controlled
      volume claims.
    diligencePath: >-
      Request management KPI pack, monthly operating metrics, and the latest board deck or audited annual budget
      package.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: leadership-drift
    missingEvidence: >-
      A current executive org chart and board-approved leadership roster that resolves the Martin-versus-Meti CEO title
      inconsistency.
    whyItMatters: >-
      Governance clarity affects diligence interviews, key-person risk, and whether historical fundraising materials are
      still accurate.
    diligencePath: Request the current board list, executive bios, and an updated cap-table / governance memo from the company.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: current-valuation
    missingEvidence: >-
      A current cap table, any recent secondary pricing, and a normalized total-raised schedule with explicit FX
      treatment.
    whyItMatters: >-
      The assigned pool only supports historical valuation points and mixed USD/CAD funding disclosures, which is
      insufficient for a current valuation stance.
    diligencePath: >-
      Obtain the latest financing documents, cap table, and investor updates that reconcile primary and secondary marks
      into one currency convention.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
      - TO003
  - type: conflicting-data
    severity: material
    topic: scale-metrics
    missingEvidence: A reconciled current metric pack for students served, active partners, institutions, and program inventory.
    whyItMatters: >-
      Public scale numbers conflict across company and third-party surfaces, which weakens any market-share or
      productivity inference.
    diligencePath: >-
      Request a dated board or investor metric sheet that reconciles current and cumulative definitions for each
      published scale metric.
    relatedQuestionRefs:
      - QM006
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: market-size
    missingEvidence: A third-party TAM/SAM/SOM model by corridor, destination, and monetizable workflow spend.
    whyItMatters: The current pool shows category breadth but does not support investment-grade market sizing or share assumptions.
    diligencePath: >-
      Obtain analyst, trade-association, or large public-operator data that segments international-student mobility
      spend by destination and channel.
    relatedQuestionRefs:
      - QM002
      - QM006
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-payer-map
    missingEvidence: Commission-rate disclosures, institution pricing, and take-rate detail for 360 services.
    whyItMatters: >-
      Without payer economics, the buyer map can describe adoption incentives but not actual budget size or unit
      economics.
    diligencePath: >-
      Request current commercial templates or cohort-level revenue by student, agency, institution, and ancillary
      service line.
    relatedQuestionRefs:
      - QM003
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: direct-peer-pricing
    missingEvidence: >-
      Current public pricing, packaging, and funding disclosures for named rival international-student recruitment
      platforms.
    whyItMatters: >-
      Without peer commercial terms, the chapter can compare ApplyBoard against substitute classes but cannot underwrite
      relative take-rate durability versus direct rivals.
    diligencePath: >-
      Collect current rival product, pricing, and funding pages in a broader discovery pass that is not restricted to
      this worker's assigned pool.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: partner-retention
    missingEvidence: Cohort retention, partner concentration, and realized commission or take-rate data by corridor.
    whyItMatters: >-
      These metrics determine whether ApplyBoard's distribution network is sticky or merely convenient enough to be
      multi-homed.
    diligencePath: >-
      Request cohort retention, partner concentration, and monetization data in management materials or customer
      diligence.
  - type: missing-source
    severity: material
    topic: ai-channel-conversion
    missingEvidence: >-
      Measured lead quality, conversion, and institution ROI from the ChatGPT channel relative to existing recruitment
      channels.
    whyItMatters: >-
      The 2026 AI-channel launch is strategically important, but without performance data it is unclear whether it is a
      moat extension or just an experimental acquisition surface.
    diligencePath: >-
      Ask management for launch cohort metrics and institution case studies covering ChatGPT-driven applicant quality
      and conversion.
  - type: private-evidence-only
    severity: material
    topic: revenue-structure
    missingEvidence: >-
      Realized institutional take rates, contract terms, rebates, and revenue mix between placement commissions and 360
      Solutions.
    whyItMatters: >-
      Revenue quality cannot be underwritten without knowing whether monetization is concentrated in a few institutions,
      heavily rebated to channels, or dependent on lower-margin ancillary attach.
    diligencePath: >-
      Request sample institution and partner contracts plus stream-level revenue and gross-margin breakdowns for the
      last twelve months.
    relatedQuestionRefs:
      - QI001
      - QI002
      - QI008
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: blocking
    topic: runway
    missingEvidence: >-
      Current cash balance, debt obligations, monthly burn, runway, next-round trigger, and audited 2025-2026 revenue
      and EBITDA bridge.
    whyItMatters: >-
      Capital adequacy and financing dependency are core to this chapter's verdict, and the public record does not
      support a credible runway or dilution-risk view.
    diligencePath: >-
      Request board materials or lender schedules showing current liquidity, debt, budgeted burn, covenant headroom, and
      financing plan.
    relatedQuestionRefs:
      - QI007
      - QI008
    relatedTableRefs:
      - TI003
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: A reconciled 2026 headcount definition that separates FTEs, contractors, and international support teams.
    whyItMatters: >-
      Operating leverage and service-cost assumptions change materially depending on whether the business supports its
      network with hundreds or more than a thousand staff.
    diligencePath: Obtain a current org chart and monthly headcount trend by function and geography.
    relatedQuestionRefs:
      - QI005
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: corridor-exposure
    missingEvidence: Revenue split by destination country, institution concentration, and source-country corridor.
    whyItMatters: >-
      Corridor mix is needed to size the financial sensitivity to Canada immigration policy, destination demand shocks,
      and recruiter concentration.
