    relatedQuestionRefs:
      - QI007
      - QI008
  - type: missing-source
    severity: material
    topic: public-tech-disclosure
    missingEvidence: >-
      Public API documentation, uptime or incident history, formal security certifications, privacy controls, and
      architecture documentation for document verification and Abbie.
    whyItMatters: >-
      Without these artifacts, technical diligence cannot verify integration depth, resilience, or whether AI and
      document workflows are governed to enterprise expectations.
    diligencePath: >-
