schemaVersion: report-v2
artifact: company-overview
slug: applyboard
runDate: 2026-10-16
company:
  name: ApplyBoard
chapter:
  number: 1
  title: Company Overview
  summary: >-
    ApplyBoard remains a large, private international-student recruitment platform
    centered on students, recruitment partners, and partner institutions, with
    current company disclosures pointing to more than 1.5 million students
    helped, 1,500+ institutions, and 6,500+ recruitment partners. The assigned
    evidence also shows material diligence caveats: funding disclosures are
    mostly historical, current financial metrics are still private, and the
    current CEO title is inconsistent across retained sources.
sections:
  - id: platform-identity-and-scale
    title: Platform identity, model, and disclosed scale
    body: >-
      ApplyBoard positions itself as a full-service study-abroad platform that
      connects students, recruitment partners, and partner institutions in one
      workflow rather than as a single-point lead generator. The current
      official surfaces emphasize partner-side workflow compression: recruiters
      can search 1,500+ institutions, submit standardized applications, track
      status, and layer in financial-services and test-voucher products from the
      same dashboard. The strongest retained current-scale disclosure is also
      company-issued: ApplyBoard says it has helped more than 1.5 million
      students, works with more than 1,500 institutions, and actively works
      with more than 6,500 recruitment partners. That is enough to establish
      genuine category scale, but not enough to underwrite current revenue,
      customer concentration, or normalized headcount because those figures are
      not disclosed in the assigned pool.
    claimRefs: [CO001, CO002, CO003, CO005, CO010, CO011, CO012, CO013, CO014]
    tableRefs: [TO001]
    figureRefs: [FO001]
  - id: founders-leadership-and-governance
    title: Founders, leadership, and governance signals
    body: >-
      The founding narrative is consistent: ApplyBoard traces the company to the
      Basiri brothers' own difficulty navigating the Canadian study-abroad
      process, which supports authentic founder-market fit rather than a purely
      opportunistic software wedge. Present-day leadership visibility is less
      clean. The current Our Story page names Meti Basiri as CEO and co-founder
      and Massi Basiri as president and co-founder, while older external
      materials identify Martin Basiri as co-founder and CEO. That title drift
      does not negate the founding story, but it does make board composition,
      actual executive remit, and succession concentration mandatory diligence
      asks before later chapters lean on management continuity. The assigned
      sources also support a historical footprint of more than 1,000 team
      members, but not a current audited headcount.
    claimRefs: [CO004, CO006, CO007, CO008, CO010, CO011]
    tableRefs: [TO002]
  - id: financing-stakeholders-and-open-gaps
    title: Financing history, stakeholder map, and open gaps
    body: >-
      The retained funding trail is strong enough to establish late-stage
      private-company status but not strong enough to state a current mark or a
      normalized total-raised figure. Historical disclosures move from a 2018
      Series A and 2019 Series B, to a September 2020 Series C extension at a
      $1.4 billion valuation, to a 2021 Series D at a C$4 billion valuation.
      That progression supports the presence of heavyweight backers and a large
      financing base, yet the assigned pool does not surface a current cap
      table, secondary pricing, debt facilities, or a like-for-like USD/CAD
      aggregation of lifetime capital. Operationally, the company-controlled
      partner onboarding guide also documents a friction point: recruiters do
      not get full platform functionality or commissions until business
      registration is approved, which matters because partner activation is part
      of the platform's distribution engine.
    claimRefs: [CO008, CO009, CO012, CO013, CO014, CO015, CO016]
    tableRefs: [TO003]
tables:
  - id: TO001
    title: Snapshot KPI table
    columns:
      - Metric
      - Value / status
      - Date
      - Confidence
      - Gap
    rows:
      - [Founded, "2015", "2015", medium, "Founding location is not explicitly disclosed in the assigned pool."]
      - [Headquarters, "Kitchener, Ontario, Canada", "Undated role repost with 2021 financing context", medium, "Current headquarters disclosure is indirect rather than from a dated corporate filing."]
      - [Institution network, "1,500+ institutions", "Current official surfaces", medium, "Institution count is company-disclosed; no independent current reconciliation in the assigned pool."]
      - [Recruitment partner network, "6,500+ active recruitment partners", "Current official surface", medium, "Definition of active partner and current throughput are not disclosed."]
      - [Students helped, "1.5M+ lifetime on current official page; 1.3M+ by June 2025 milestone", "2025-2026 current official context", medium, "Methodology behind 'helped' is not defined in the assigned pool."]
      - [Latest disclosed financing, "C$375M Series D", "2021", medium, "No later primary financing event appears in the assigned pool."]
      - [Latest disclosed valuation, "C$4B at the 2021 Series D", "2021", medium, "No current valuation or secondary-price evidence appears in the assigned pool."]
      - [Headcount, null, "Current figure not supported", medium, "Only a historical/undated job-post repost cites 1,000+ team members; current headcount remains unsupported."]
    notes: >-
      Mixed-vintage disclosure snapshot; null marks an unsupported current
      metric, and currencies are preserved exactly as stated rather than
      normalized across USD and CAD rounds.
    claimRefs: [CO004, CO005, CO010, CO011, CO012, CO013, CO014]
  - id: TO002
    title: Leadership and founder table
    columns:
      - Person
      - Role in retained evidence
      - Supporting evidence
      - Founder-market fit or functional coverage
      - Key-person dependency / diligence ask
    rows:
      - ["Meti Basiri", "Current official page: CEO & Co-Founder", "ApplyBoard Our Story", "Co-founded after first-hand study-abroad friction; current official surface anchors executive identity.", "Confirm present-day CEO remit, decision rights, and board reporting lines."]
      - ["Massi Basiri", "Current official page: President & Co-Founder", "ApplyBoard Our Story", "Official page says he leads product and innovation teams.", "Clarify operational split versus CEO and the depth of product succession coverage."]
      - ["Martin Basiri", "Historical external sources: Co-Founder & CEO", "Forbes 2020; startup.jobs-posted role description", "Older fundraising and talent materials still frame him as the executive face of the company.", "Resolve whether this is a true title change, stale external collateral, or an incomplete governance disclosure."]
    notes: >-
      Partial founder/leadership enumeration from the assigned pool; board
      composition and independent-director coverage are not disclosed in these
      sources and remain diligence gaps.
    enumerationScope:
      coverage: partial
      basis: >-
        Covers founders and named executives surfaced in the assigned current
        official page plus corroborating historical external materials.
    claimRefs: [CO004, CO006, CO007, CO008]
  - id: TO003
    title: Stakeholder or investor map
    columns:
      - Stakeholder
      - Role
      - Control / economic importance
      - Diligence ask
    rows:
      - ["Meti Basiri", "Current CEO & co-founder", "Current official page makes him the named top executive, implying present operating control.", "Confirm whether he is the sole CEO and how authority is split across founders and board."]
      - ["Massi Basiri", "President & co-founder", "Official page ties him to product and innovation, making him central to platform execution.", "Test succession depth below product leadership and his role in capital allocation."]
      - ["Martin Basiri", "Historical co-founder & CEO in external materials", "Older fundraising and recruiting materials suggest continuing brand and stakeholder relevance.", "Clarify current title, board seat, and external-facing responsibilities."]
      - ["ETS Strategic Capital", "2020 Series C extension investor", "Forbes says ETS joined the extension round, implying strategic interest around international education and testing.", "Request current ownership, governance rights, and any commercial linkage to language-testing products."]
      - ["Anthos Capital / Artiman Ventures", "Series B lead / existing investor set", "BetaKit ties them to the 2019 growth financing base that preceded later mega-rounds.", "Obtain the current cap table, pro-rata rights, and any secondary overhang from early investors."]
    notes: >-
      Partial stakeholder map based on founders and named investors in the
      assigned pool; it is not a full cap table and does not disclose ownership
      percentages, liquidation preferences, or debt claims.
    enumerationScope:
      coverage: partial
      basis: >-
        Limited to founders and investors explicitly named in retained current
        or historical sources allocated to this chapter worker.
    claimRefs: [CO006, CO007, CO008, CO013, CO014]
figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      The assigned pool supports a dated path from founding through major
      financing, product, and expansion milestones into 2025.
    data:
      items:
        - period: April 2015
          label: Founded
          detail: Founded by the Basiri brothers after their own study-abroad application friction.
          tone: positive
          claimRefs: [CO004]
        - period: May 2018
          label: Series A
          detail: BetaKit says ApplyBoard raised a $17M Series A before its later growth financings.
          tone: positive
          claimRefs: [CO014]
        - period: December 2019
          label: Series B
          detail: BetaKit reports a C$55M Series B that took disclosed funding to C$72M at that point.
          tone: positive
          claimRefs: [CO014]
        - date: 2020-09-16
          label: Series C extension
          detail: Forbes reported a $55M Series C extension at a $1.4B valuation.
          tone: positive
          claimRefs: [CO013]
        - period: 2021
          label: Series D
          detail: A startup.jobs-posted role description says ApplyBoard announced a C$375M Series D at a C$4B valuation.
          tone: positive
          claimRefs: [CO012]
        - period: March 2022
          label: TrainHub acquisition
          detail: ApplyBoard's official timeline says it acquired TrainHub.
          tone: positive
          claimRefs: [CO015]
        - period: June 2024
          label: Abbie launch
          detail: Official and independent retained sources align on the launch of Abbie, ApplyBoard's AI advisor.
          tone: positive
          claimRefs: [CO015]
        - period: January 2025
          label: Germany launch
          detail: The official timeline says ApplyBoard launched in Germany.
          tone: positive
          claimRefs: [CO016]
        - period: June 2025
          label: 1.3M students helped
          detail: The official timeline says ApplyBoard had helped more than 1.3 million students by June 2025.
          tone: positive
          claimRefs: [CO016]
    claimRefs: [CO004, CO012, CO013, CO014, CO015, CO016]
callouts:
  - calloutType: insight
    title: Multi-sided workflow breadth is real, but still company-disclosed
    body: >-
      The strongest current identity evidence is consistent across official
      surfaces: ApplyBoard spans students, recruitment partners, institutions,
      and adjacent services in one workflow. What remains missing is independent
      current disclosure on monetization quality, take rates, and corridor mix.
    claimRefs: [CO001, CO002, CO003, CO005]
  - calloutType: risk
    title: Governance clarity and current disclosure quality remain open diligence items
    body: >-
      The assigned pool supports late-stage scale and historical funding, but it
      does not resolve who currently holds the CEO title, what the board looks
      like, or what the current cap table and private-company financials show.
    claimRefs: [CO008, CO010, CO012, CO013]
