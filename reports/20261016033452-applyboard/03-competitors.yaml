      - ["Direct institution contracts", "Incumbent / status quo", "Institution-by-institution relationships; no pooled public scale metric in assigned sources", "Agencies and institutions that can source students directly", "Highest direct control over school relationship and economics", "Requires negotiating and managing many separate contracts and workflows"]
      - ["Manual in-house agency workflow", "Substitute / internal build", "No platform-funding signal; relies on agency staff and process", "Smaller or specialized agencies", "Keeps process control internal and avoids platform dependence", "ApplyBoard explicitly pitches relief from spreadsheets, scattered files, and institution chasing"]
      - ["AI-native discovery channels", "Adjacent / likely entrant", "Rapid student adoption signal; ApplyBoard launched inside ChatGPT in 2026", "Students early in program-discovery funnel; institutions seeking new lead sources", "Can shape student shortlist before an agent or admissions team engages", "Discovery alone does not replace application operations, institution relationships, or service bundle"]
      - ["Point-solution service stack", "Adjacent", "Ancillary services are individually available, but no combined scale metric in assigned pool", "Agencies or students buying financing, testing, or housing support separately", "Lets buyers source only the needed service rather than a full platform", "Does not replicate ApplyBoard's combined distribution plus workflow proposition"]
    notes: "Rows compare evidence-backed alternative classes because the assigned source pool does not provide current public pricing or funding pages for named rival platforms."
