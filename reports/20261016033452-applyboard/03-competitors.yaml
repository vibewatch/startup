  evidenceGaps:
    - type: missing-source
      severity: material
      topic: direct-peer-pricing
      missingEvidence: Current public pricing, packaging, and funding disclosures for named rival international-student recruitment platforms.
      whyItMatters: Without peer commercial terms, the chapter can compare ApplyBoard against substitute classes but cannot underwrite relative take-rate durability versus direct rivals.
      diligencePath: Collect current rival product, pricing, and funding pages in a broader discovery pass that is not restricted to this worker's assigned pool.
      relatedQuestionRefs: [QP008]
      relatedTableRefs: [TP003]
    - type: private-evidence-only
      severity: material
      topic: partner-retention
      missingEvidence: Cohort retention, partner concentration, and realized commission or take-rate data by corridor.
      whyItMatters: These metrics determine whether ApplyBoard's distribution network is sticky or merely convenient enough to be multi-homed.
      diligencePath: Request cohort retention, partner concentration, and monetization data in management materials or customer diligence.
    - type: missing-source
      severity: material
      topic: ai-channel-conversion
      missingEvidence: Measured lead quality, conversion, and institution ROI from the ChatGPT channel relative to existing recruitment channels.
      whyItMatters: The 2026 AI-channel launch is strategically important, but without performance data it is unclear whether it is a moat extension or just an experimental acquisition surface.
      diligencePath: Ask management for launch cohort metrics and institution case studies covering ChatGPT-driven applicant quality and conversion.
