  - id: TP002
    title: Feature and capability matrix
    columns:
      - Buying criterion
      - ApplyBoard
      - Direct contracts / manual workflow
      - AI-native discovery
      - Public-evidence implication
    rows:
      - ["Institution access", "1,500+ negotiated partner institutions and some exclusive programs", "Must source and manage school relationships individually", "Does not itself create institution contracts", "ApplyBoard's strongest edge is pooled distribution access"]
      - ["Application operations", "Unified dashboard, document handling, direct submission, and status tracking", "Handled through local process, email, and institution-by-institution tooling", "Discovery only; no evidence of full admissions operations in assigned pool", "Status quo substitutes can replicate service with more labor"]
      - ["AI assistance", "Abbie, WhatsApp support, and pre-submission quality audits", "Unsupported in assigned sources", "High relevance because students increasingly begin in conversational AI", "AI is both differentiator for ApplyBoard and a displacement vector"]
      - ["Ancillary services", "Loans, GICs, test vouchers, accommodation, and financial services via 360 Solutions", "Typically sourced separately or unsupported", "Unsupported in assigned sources", "Bundled services widen scope beyond admissions routing"]
      - ["Developer openness", "No public API, OpenAPI definition, or SDK in apis.io profile", "Unknown", "Unknown", "Moat looks commercial and workflow-based rather than ecosystem/API-based"]
    notes: "Unsupported cells remain explicitly marked; the allowed source pool describes ApplyBoard in much more detail than unnamed alternatives."
    claimRefs: [CP002, CP003, CP004, CP005, CP008, CP009]
  - id: TP003
    title: Pricing and packaging comparison
    columns:
      - Option
      - Price / contract model
      - Included capabilities
      - Unknowns
      - Implication
    rows:
      - ["ApplyBoard student side", "Students use the service at no cost beyond standard application fees per Forbes' 2020 reporting", "Program search, application workflow, guidance, and additional services", "Current realized economics and monetization by corridor are undisclosed", "Student-free access lowers user-side adoption friction"]
      - ["ApplyBoard institution side", "Forbes reported universities pay a percentage of tuition after enrollment and visa approval", "Lead generation, application flow, partner network, and service layer", "Current take rate, discounts, and partner concentration are not public in assigned URLs", "Economics depend on institutions valuing channel access and conversion quality"]
      - ["Direct institution contracting", "Unknown and institution-specific", "Direct school relationship and internal enrollment workflow", "No public comparable contract terms in assigned pool", "Can preserve economics but raises operating complexity"]
      - ["Manual / internal build", "Internal staffing and process cost rather than explicit platform fee", "Agency-owned search, document, and follow-up process", "No public unit-cost benchmark in assigned pool", "Avoids platform commissions but scales less efficiently in public evidence"]
    notes: "The evidence supports ApplyBoard's monetization model more clearly than direct peer pricing, so unknowns are preserved rather than backfilled."
    claimRefs: [CP002, CP003, CP010, CP013]
figures:
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      Ordinal 1-5 scores place alternative classes by workflow breadth and control of partner or
      student access, using only evidence-backed feature coverage rather than inferred market share.
    data:
      xAxis:
        label: Workflow breadth (ordinal score)
        min: 1
        max: 5
        lowLabel: narrow
        highLabel: broad
        description: Evidence-backed breadth of covered workflow and service steps.
      yAxis:
        label: Control of partner or student access (ordinal score)
        min: 1
        max: 5
        lowLabel: low
        highLabel: high
        description: Evidence-backed control over institutional relationships or early student demand.
      points:
        - label: ApplyBoard
          x: 5
          y: 4
          note: Broadest workflow and service bundle in the assigned evidence.
          claimRefs: [CP001, CP003, CP005]
        - label: Direct institution contracts
          x: 2
          y: 5
          note: High relationship control but far narrower pooled workflow support.
          claimRefs: [CP005, CP013]
        - label: Manual in-house workflow
          x: 2
          y: 2
          note: Avoids platform dependence but sacrifices automation and pooled distribution.
          claimRefs: [CP002, CP013]
        - label: AI-native discovery
          x: 2
          y: 4
          note: Can influence the shortlist early even without full downstream operations.
          claimRefs: [CP008, CP012]
        - label: Point-solution services
          x: 3
          y: 1
          note: Solves discrete jobs but does not replicate the combined platform.
          claimRefs: [CP003, CP009]
        - label: Internal build plus local contracts
          x: 3
          y: 3
          note: Hybrid substitute with moderate control and moderate breadth at higher operating cost.
          claimRefs: [CP002, CP005, CP013]
    approximationNotes: >-
      Coordinates are ordinal synthesis scores from sourced feature coverage and channel control, not
      measured market-share or conversion-rate data.
    claimRefs: [CP001, CP005, CP008, CP013]
callouts:
  - calloutType: strength
    title: Distribution bundle is the clearest moat
    body: >-
      The best-supported competitive edge is not a single algorithm or public API surface; it is the
      combination of negotiated institution access, bundled workflow, and adjacent services that are
      difficult to recreate at once through direct contracting or manual process.
    claimRefs: [CP003, CP005, CP011]
  - calloutType: risk
    title: Multi-homing and AI discovery can still compress advantage
    body: >-
      Free onboarding, ongoing agent enablement requirements, and the rise of AI-native discovery
      imply ApplyBoard must keep earning partner attention; otherwise channel economics can weaken
      even if the platform remains useful operationally.
    claimRefs: [CP007, CP008, CP009, CP012]
