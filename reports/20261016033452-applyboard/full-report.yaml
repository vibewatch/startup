      - number: '1.3'
        title: Financing history, stakeholder map, and open gaps
        blocks:
          - type: paragraph
            body: >-
              The retained funding trail is strong enough to establish late-stage private-company status but not strong
              enough to state a current mark or a normalized total-raised figure. Historical disclosures move from a
              2018 Series A and 2019 Series B, to a September 2020 Series C extension at a $1.4 billion valuation, to a
              2021 Series D at a C$4 billion valuation. That progression supports the presence of heavyweight backers
              and a large financing base, yet the assigned pool does not surface a current cap table, secondary pricing,
              debt facilities, or a like-for-like USD/CAD aggregation of lifetime capital. Operationally, the
              company-controlled partner onboarding guide also documents a friction point: recruiters do not get full
              platform functionality or commissions until business registration is approved, which matters because
              partner activation is part of the platform's distribution engine.
