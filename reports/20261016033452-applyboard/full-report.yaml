              - CM013
      - number: '2.2'
        title: Sizing lenses are useful but internally inconsistent
        blocks:
          - type: paragraph
            body: >-
              The pool contains enough evidence to show that ApplyBoard sits inside a large global student mobility
              category, but not enough to isolate a defensible SAM or SOM. The strongest independent sizing datapoint is
              a 2026 award profile describing more than 6 million students annually in the global international-student
              market. After that, the evidence becomes company-reported and internally inconsistent: public pages
              disagree on whether ApplyBoard serves 140,000+ or 150,000+ programs, 1,500+ or 1,750+ institutions, and
              600,000+ or 1.5M+ students. Those ranges are still useful for orientation, but they should be treated as
              bounded sizing lenses rather than a precise market model.
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM016
