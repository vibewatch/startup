      - number: '5.4'
        title: Trust, compliance, and technical risk
        blocks:
          - type: paragraph
            body: >-
              Public disclosures show some process controls, but they do not yet amount to a full technical trust
              package. ApplyBoard requires recruitment partners to operate a registered business, keep verified contact
              information, and align with immigration-law expectations, which is useful compliance signaling for a
              sensitive cross-border workflow. The company also states that AI may be used in hiring while human
              judgment remains final, indicating internal governance language exists. However, the retained product
              sources in this chapter do not disclose public APIs, uptime history, formal security certifications, or
              detailed privacy and model-governance controls for Abbie and automated verification. That leaves open
              diligence on data protection, failure handling, and how much of the product promise is durable software
