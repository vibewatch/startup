  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              The assigned source pool supports a category-level competitive map more clearly than a peer-by-peer public
              comp sheet. ApplyBoard presents itself as a full-service mobility platform spanning students, recruitment
              partners, and institutions, with distribution breadth across 1,500+ institutions and 150,000+ programs
              rather than a single-point workflow tool. Against that, the status quo alternatives are still credible:
              agencies can manage direct institution relationships themselves, institutions can keep international
              recruitment inside their own enrollment teams, and students can increasingly begin discovery in AI-native
              surfaces before any intermediary touches the lead. That means ApplyBoard is not just competing with named
              platform peers; it is competing with direct contracts, manual process, and self-serve discovery paths that
              solve the same job with different tradeoffs.
