        title: Exhibits
        blocks:
          - type: callout
            title: AI moves ApplyBoard closer to first discovery, not just application processing
            body: >-
              The ChatGPT integration and Abbie launch both push ApplyBoard earlier in the student decision journey,
              which can matter more for market power than simply adding more back-office workflow features.
            calloutType: insight
            claimRefs:
