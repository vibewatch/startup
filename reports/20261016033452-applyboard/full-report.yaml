  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product scope and user workflow
        blocks:
          - type: paragraph
            body: >-
              ApplyBoard is not presented as a single marketplace page or lead source; across its homepage, recruiter
              guide, and student surface, the company describes a multi-sided platform connecting students, recruitment
              partners, and institutions in one workflow. For agencies, the disclosed flow starts with program search
              and eligibility filtering, moves into standardized application submission and real-time status tracking,
              and extends into document handling and direct institution communication. Student-facing pages show the
              same workflow from the other side: program matching, application support, visa-probability guidance,
              payments, and financing tools. The result is a broad operating scope with multiple monetizable service
              layers, but most disclosed performance benefits remain company-authored rather than independently
              benchmarked.
