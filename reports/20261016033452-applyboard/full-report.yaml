  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              The current evidence supports a real business with scaled distribution, active hiring, and a
              partner-facing product that appears to solve a genuine workflow problem for international student
              recruitment. ApplyBoard's current materials market 1,500+ institutions, 150,000+ programs, AI-assisted
              quality checks that it says lead to a roughly 95% application success rate, and adjacent financial-service
              products for agents and students. Those signals matter because they suggest platform breadth, commercial
              relevance, and room for monetization beyond pure application routing. The problem is price discovery: the
              retained pool gives only historical financing markers from 2018 and 2020, while current revenue, gross
              margin, burn, take rate, and fresh secondary or primary valuation evidence remain undisclosed. That gap
              makes the right recommendation track rather than buy. Re-engagement should be conditioned on a refreshed
              financial packet and a current market-clearing price, not on brand strength alone.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV009
              - CV011
              - CV012
              - CV013
