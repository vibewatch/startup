      - number: '1.2'
        title: Founders, leadership, and governance signals
        blocks:
          - type: paragraph
            body: >-
              The founding narrative is consistent: ApplyBoard traces the company to the Basiri brothers' own difficulty
              navigating the Canadian study-abroad process, which supports authentic founder-market fit rather than a
              purely opportunistic software wedge. Present-day leadership visibility is less clean. The current Our
              Story page names Meti Basiri as CEO and co-founder and Massi Basiri as president and co-founder, while
              older external materials identify Martin Basiri as co-founder and CEO. That title drift does not negate
              the founding story, but it does make board composition, actual executive remit, and succession
              concentration mandatory diligence asks before later chapters lean on management continuity. The assigned
              sources also support a historical footprint of more than 1,000 team members, but not a current audited
              headcount.
