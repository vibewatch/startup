  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and participant roles
        blocks:
          - type: paragraph
            body: >-
              ApplyBoard's public materials define the business as a three-sided platform rather than a generic
              education marketplace: it connects international students, recruitment partners, and partner institutions
              inside one application workflow. The included workflow spans program discovery, eligibility matching,
              application submission, document handling, status tracking, and adjacent services such as language-test
              vouchers, loans, accommodation, and visa support. That boundary matters because the company is not trying
              to own tuition delivery or campus operations after enrollment; it is monetizing the pre-enrollment
              mobility workflow where students need guidance, agencies need process efficiency, and institutions need
              qualified inbound applicants.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM005
              - CM013
          - type: table
            tableRef: TM001
            claimRefs:
