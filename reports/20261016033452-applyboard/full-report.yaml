              - CV003
              - CV004
              - CV011
              - CV012
              - CV013
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV015
      - number: '8.2'
        title: Financing context and scenario framing
        blocks:
          - type: paragraph
            body: >-
              The retained financing history shows that ApplyBoard has already experienced multiple valuation steps, but
              all of them are now dated. Velocity reported a C$17 million Series A in 2018. Forbes later reported a $55
              million Series C extension at a $1.4 billion valuation in September 2020, and The PIE News reported that
              ApplyBoard raised C$100 million later in 2020 at a C$2 billion valuation. Those facts demonstrate that
              external investors previously paid high growth-stage prices for the asset, yet they do not establish
              today's fair value because the evidence set offers no current round, no secondary mark, no public
              comparable set, and no fresh operating-metric disclosure to bridge from those old marks to a 2026 entry
              price. The right scenario work is therefore conditional rather than numeric: upside exists if refreshed
              data prove monetization quality and margin durability, but downside is significant if a seller still
              anchors on 2020-2021 peak narratives without current proof.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV011
              - CV012
              - CV014
              - CV015
      - number: '8.3'
        title: Final diligence asks and thesis breakers
        blocks:
          - type: paragraph
            body: >-
              A sponsor should not try to solve the missing data problem with storytelling. The gating asks are
              concrete: audited 2025-2026 revenue, gross margin, burn, runway, and take-rate data; corridor or
              product-mix evidence showing whether growth is broad or concentrated; and current price discovery through
              either a fresh financing, a documented secondary transaction, or a current cap table with preference-stack
              details. Without those items, the thesis can describe why ApplyBoard matters but cannot clear a price. The
              thesis breaks if management asks investors to pay on the basis of historical unicorn marks while still
              withholding the unit economics needed to convert partner scale, application success claims, and 360
              Solutions breadth into durable cash-generation evidence. The investment case improves only if diligence
              proves that current scale is translating into attractive margins and a valuation reset that still offers
              venture-style upside.
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
