        title: Capital adequacy and underwriting blockers
        blocks:
          - type: paragraph
            body: >-
              ApplyBoard has clearly demonstrated access to outside capital, but current adequacy is still not publicly
              underwritable. Tracxn reports $496M raised across five rounds, including a $310M Series D in June 2021 at
