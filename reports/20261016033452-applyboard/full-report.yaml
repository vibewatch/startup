      - number: '2.3'
        title: Adoption drivers, budget ownership, and constraints
        blocks:
          - type: paragraph
            body: >-
              Adoption drivers are increasingly top-of-funnel and workflow-led. ApplyBoard is pushing into AI-native
              discovery with ChatGPT distribution, AI advising through Abbie, and pre-submission quality checks that
              promise a faster path from initial search to qualified application. The buyer map is multi-sided: students
              use the core platform for free, recruitment agencies adopt it for access, quality, and commissions, and
              institutions appear to fund applicant-acquisition value even though public pricing is not disclosed. The
              main constraint is that this market is policy-sensitive: visa caps, destination-rule changes, and
              compliance shifts repeatedly appear in ApplyBoard's own market-education content, implying that
              corridor-level regulation can slow conversion even when product demand is strong.
            claimRefs:
              - CM004
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
