      - number: '3.3'
        title: Durability, multi-homing, and displacement risk
        blocks:
          - type: paragraph
            body: >-
              The moat in this chapter reads as distribution plus workflow, not hard technical lock-in. ApplyBoard's
              official pages stress instant access to negotiated institution relationships, exclusive programs, and
              agent rewards, which can concentrate partner activity on the platform. At the same time, the same
              materials show low-friction onboarding and ongoing agent enablement, which implies partners can still
              multi-home if another channel offers better economics or lead flow. APIs.io reinforces the point from a
              different angle: ApplyBoard's public developer surface is thin, with no public API, OpenAPI definition, or
              SDK, so the platform's durability does not appear to come from ecosystem interoperability. The newer
              competitive threat in the evidence is upstream discovery: ApplyBoard itself is pushing into ChatGPT
              because student intent formation is moving earlier in the funnel, and that same shift can empower
              substitute channels if ApplyBoard fails to stay embedded where students first ask questions.
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
      - number: '3.4'
        title: Demand shift and unresolved gaps
        blocks:
          - type: paragraph
            body: >-
              The most credible adverse signal in the allowed evidence is not a short-seller or regulator; it is
              changing destination demand and buyer behavior. ApplyBoard's own 2024 survey found substantial student
              interest beyond the traditional big-four destination markets and a meaningful cohort reporting lower
              interest in Canada after policy changes, which matters because ApplyBoard's scale and partner density have
              historically been strongest in the legacy destination set. Even so, the chapter remains
              evidence-constrained on several investor-grade questions. The assigned pool does not expose current public
              pricing or funding profiles for named rival platforms, does not quantify partner retention or take rate,
              and does not show measured conversion from the new ChatGPT channel. Those gaps do not negate the
              competitive case, but they limit how confidently a buyer can underwrite moat durability versus faster
              moving substitutes.
            claimRefs:
              - CP010
              - CP011
              - CP012
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Distribution bundle is the clearest moat
            body: >-
              The best-supported competitive edge is not a single algorithm or public API surface; it is the combination
              of negotiated institution access, bundled workflow, and adjacent services that are difficult to recreate
              at once through direct contracting or manual process.
            calloutType: strength
            claimRefs:
              - CP003
              - CP005
              - CP011
          - type: callout
            title: Multi-homing and AI discovery can still compress advantage
            body: >-
              Free onboarding, ongoing agent enablement requirements, and the rise of AI-native discovery imply
              ApplyBoard must keep earning partner attention; otherwise channel economics can weaken even if the
              platform remains useful operationally.
            calloutType: risk
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP012
