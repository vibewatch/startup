  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      Destination-policy exposure is the clearest high-impact risk, while partner supervision, AI/privacy, and financing
      resilience remain material secondary threats.
    data:
      columns:
        - label: Likelihood
        - label: Impact
        - label: Mitigation maturity
      rows:
        - label: Canada policy exposure
          note: Thesis-break risk driven by permit caps and approval-rate pressure.
          values:
            - label: High
              detail: Canada visa issuance is projected down 54% YoY, with capped permit targets through 2028.
            - label: High
              detail: A major destination shock can hit volume, approvals, and partner confidence at once.
            - label: Partial
              detail: Geographic breadth helps, but corridor and revenue-mix disclosure is missing.
        - label: Agent / partner supervision
          note: Compliance risk sits in external counsellor behaviour and monitoring.
          values:
            - label: Medium
              detail: Channel quality depends on external recruiters following destination-country rules.
            - label: High
              detail: Mis-selling or non-compliant recruiting can damage conversion and invite scrutiny.
            - label: Partial
              detail: Onboarding, training, and ethical commitments are visible; audit outcomes are not.
        - label: AI / privacy governance
          note: Sensitive student-data handling and AI support create cross-jurisdiction exposure.
          values:
            - label: Medium
              detail: Abbie and application workflows use sensitive student information and automation.
            - label: High
              detail: Data-use, model-governance, or incident failures would affect trust and compliance.
            - label: Partial
              detail: Marketing controls are described, but no DPA or assurance evidence is in scope.
        - label: Application-quality promise
          note: Marketing a ~95% success rate creates asymmetric reputational downside.
          values:
            - label: Medium
              detail: A marketed ~95% success rate can turn into reputational risk if outcomes deteriorate.
            - label: Medium-high
              detail: Conversion misses or rework would hurt partners and student trust quickly.
            - label: Partial
              detail: Document verification and payment blocks exist, but cohorted outcome data is absent.
        - label: Global operating complexity
          note: A large multinational team raises QA and escalation burden.
          values:
            - label: Medium
              detail: Public sources describe a large, multinational team footprint.
            - label: Medium
              detail: Coordination failures are meaningful but more reversible than policy shocks.
            - label: Partial
              detail: Local hiring and partner managers help, but country-level control ownership is not disclosed.
        - label: Financing resilience / disclosure gap
          note: Historical markdowns and layoffs make current liquidity a live question.
          values:
            - label: Medium
              detail: Historical markdown and restructuring signals exist, but current revenue and runway are undisclosed.
            - label: High
              detail: Weak liquidity would reduce the company’s ability to absorb policy or execution shocks.
            - label: Limited
              detail: The assigned pool does not include current cash, burn, or financing-plan evidence.
    claimRefs:
      - CR004
      - CR005
      - CR007
      - CR008
      - CR009
      - CR011
      - CR014
