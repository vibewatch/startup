      - number: '5.2'
        title: Operating architecture and execution model
        blocks:
          - type: paragraph
            body: >-
              The public evidence implies an operating architecture built around a partner dashboard, student-intake
              surfaces, institution-routing logic, document review, and adjacent service modules rather than a pure
              self-serve SaaS product. ApplyBoard says agencies can work from a unified dashboard while the company
              reviews documents, resolves missing requirements, and communicates with institutions, which suggests a
              hybrid model combining software workflow with managed-service labor. The 2026 Abbie launch extends this
              architecture by adding GPT-based guidance on top of the company knowledge base, while the recruiting
              signal shows growth still depends on onboarding, training, CRM discipline, and coordination across
              commercial and product teams. That mix can be defensible, but it also means scalability depends on both
              software automation and service operations.
