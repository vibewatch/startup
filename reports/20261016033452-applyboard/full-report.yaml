      - number: '3.2'
        title: Capability, packaging, and pricing tradeoffs
        blocks:
          - type: paragraph
            body: >-
              ApplyBoard's clearest differentiation in the evidence is scope. The company does not pitch only
              application routing; it bundles program search, submission workflow, document review, application
              tracking, AI-assisted guidance, and adjacent student services such as loans, GICs, accommodation, and
              language-test vouchers. That breadth matters because direct institution contracting or manual agency
              workflows can replicate parts of the process, but they do not automatically bring the same partner network
              or ancillary services into one interface. Public pricing evidence is thinner than public feature evidence.
              Forbes' 2020 reporting is still the most explicit monetization disclosure in the allowed pool, indicating
              an institution-paid commission model rather than student-paid SaaS, while public rival pricing remains
              largely unavailable in the assigned URLs.
