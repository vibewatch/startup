chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Platform identity, model, and disclosed scale
        blocks:
          - type: paragraph
            body: >-
              ApplyBoard positions itself as a full-service study-abroad platform that connects students, recruitment
              partners, and partner institutions in one workflow rather than as a single-point lead generator. The
              current official surfaces emphasize partner-side workflow compression: recruiters can search 1,500+
              institutions, submit standardized applications, track status, and layer in financial-services and
              test-voucher products from the same dashboard. The strongest retained current-scale disclosure is also
              company-issued: ApplyBoard says it has helped more than 1.5 million students, works with more than 1,500
              institutions, and actively works with more than 6,500 recruitment partners. That is enough to establish
              genuine category scale, but not enough to underwrite current revenue, customer concentration, or
              normalized headcount because those figures are not disclosed in the assigned pool.
            claimRefs:
