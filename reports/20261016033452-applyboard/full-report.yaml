        title: >-
          Public adoption proof shows network scale and active agency usage, but only limited quantified production
          evidence
        blocks:
          - type: paragraph
            body: >
              The evidence establishes scale without supporting a clean, current growth series. Forbes reported 120,000
              students and 1,200+ schools in 2020, and ApplyBoard reported 200,000 students and 7,500+ recruitment
              partners in 2021. A March 2026 company guide says the network covers 1,500+ institutions, while the
              current recruitment-partner page markets 150,000+ programs. An undated World.uz profile claims still
              larger cumulative counts, but its unknown publication date prevents treating those figures as a 2026
              endpoint. Named agency testimonials and World.uz's live service page indicate production use; historical
              independent reporting adds named universities but no current per-school volume, conversion, or contract
              depth.
            claimRefs:
              - CU002
              - CU006
              - CU007
              - CU008
              - CU009
              - CU011
          - type: table
            tableRef: TU002
            claimRefs:
