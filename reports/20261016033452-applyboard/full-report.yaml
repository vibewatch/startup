              - CU008
              - CU009
              - CU011
      - number: '6.3'
        title: Durability and concentration are the core unresolved customer questions
        blocks:
          - type: paragraph
            body: >
              The chapter has enough evidence to support adoption and workflow claims, but not enough to validate
              customer durability. None of the retained public materials disclose NRR, GRR, churn, renewal cadence,
              contract length, or top-customer concentration, so recurring institutional demand remains opaque.
              ApplyBoard's own market commentary also points to conversion fragility: it projects that Canada issued
              about 140,000 new international student visas in 2025, 54% fewer than in 2024, and says study-abroad
              decisions are increasingly governed by affordability and work prospects. The network appears real, but
              investors still need private cohort, destination-mix, and top-account data before underwriting stickiness
              or concentration exposure.
            claimRefs:
              - CU012
              - CU013
              - CU014
              - CU015
              - CU016
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Scaled channel network is clearly evidenced
            body: >-
              Company-controlled sources show broad program and institution coverage, while Forbes confirms that the
              marketplace model and named institution relationships were already material in 2020.
            calloutType: strength
            claimRefs:
              - CU002
              - CU006
              - CU007
              - CU010
              - CU011
          - type: callout
            title: Retention quality is still the missing diligence variable
            body: >-
              Public sources support acquisition and workflow claims, but they do not disclose churn, renewal, NRR/GRR,
              or top-account concentration, while policy and affordability headwinds can still weaken conversion
              quality.
            calloutType: risk
            claimRefs:
