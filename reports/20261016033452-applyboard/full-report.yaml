              - CR008
              - CR009
              - CR011
              - CR014
      - number: '7.2'
        title: Regulatory and policy exposure
        blocks:
          - type: paragraph
            body: >-
              Canada matters disproportionately because it remains one of the company's most visible study destinations,
              and ApplyBoard's own data argues that the market is still digesting post-2024 restrictions. A projected
              54% decline in 2025 new Canadian student visas, followed by capped 2026-2028 permit targets, means
              admissions volume can be constrained even if ApplyBoard executes well operationally. The same pool also
              shows two adjacent legal risks: the platform handles visa-related information and proof-of-funds
              workflows, and a tertiary independent summary says the company has faced criticism over agent supervision
              under Canadian rules. ApplyBoard describes partner screening, ethical-recruitment commitments, and
              application-quality checks, but the assigned evidence does not include regulator correspondence, privacy
              documentation, or audited complaint data, so mitigation maturity is only partially visible.
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR005
              - CR011
      - number: '7.3'
        title: Operating-model and dependency risk
        blocks:
          - type: paragraph
            body: >-
              ApplyBoard's operating model creates scale but also concentrates failure modes. The recruiter-facing
              materials emphasise direct access to 1,500+ institutions, AI-assisted document review, application quality
              audits, and 360 Solutions add-ons ranging from loans to housing and visa support. That increases partner
              stickiness, but it also broadens the set of third parties, data flows, and service promises that need to
              work together. The platform markets a roughly 95% application-success rate, so service degradation can hit
              trust and commissions quickly. Meanwhile, public company pages and hiring posts describe a global
              organisation spread across thousands of employees or team members and dozens of countries or languages,
              which adds coordination and QA complexity exactly where the company depends on fast, compliant application
              handling.
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR007
              - CR008
              - CR013
          - type: table
            tableRef: TR002
            claimRefs:
              - CR004
              - CR007
              - CR008
              - CR010
              - CR013
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR002
              - CR011
              - CR012
              - CR013
      - number: '7.4'
        title: Mitigations, kill criteria, and diligence asks
        blocks:
          - type: paragraph
            body: >-
              The current evidence supports underwriting mitigations as process controls rather than hard structural
              protections. ApplyBoard shows direct institutional partnerships, partner onboarding, training, AI-assisted
              checks, and document verification, but those measures have not yet been stress-tested in the assigned pool
              by regulator records, retention data, or audited partner-quality metrics. That means the most useful
              diligence is numerical and operational: destination and corridor mix, quality-performance cohorts behind
              the 95% success claim, privacy governance for Abbie and WhatsApp-based support, and current liquidity
              after reported layoffs and valuation markdowns. Until those are verified, the investment committee should
              treat further Canada permit tightening, a worsening acceptance or conversion curve, fresh workforce cuts,
              or substantiated agent-compliance findings as thesis-break events rather than routine execution noise.
            claimRefs:
              - CR007
              - CR009
              - CR010
              - CR011
              - CR013
              - CR014
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Primary thesis-breaker: another cycle of destination-policy tightening'
            body: >-
              If Canada or another major destination cuts permits or approvals again before ApplyBoard proves durable
              diversification, the company can lose both volume and partner confidence even if product execution holds.
              That is the cleanest reader-facing kill criterion in the current evidence.
            calloutType: risk
            claimRefs:
              - CR005
              - CR006
              - CR012
              - CR014
          - type: callout
            title: Visible mitigations are process controls, not hard moats
            body: >-
              The pool shows partner onboarding, training, document verification, AI-assisted checks, and direct
              institutional partnerships, but it does not show regulator sign-off, audited QA metrics, or privacy
              assurance artifacts. Investors should underwrite the mitigations as partially proven until those records
              are produced.
            calloutType: assumption
            claimRefs:
