  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk picture
        blocks:
          - type: paragraph
            body: >-
              The top downside is not a single product failure but a stacked dependency chain: ApplyBoard is still
              concentrated on cross-border student mobility, it monetises through partner institutions and recruitment
              partners, and it operates in corridors where government policy can abruptly change the size and quality of
              the applicant pool. The company's own 2026 trends report projects a sharp Canada visa contraction and
              continued permit targets through 2028, while its current product materials still centre on six core study
              destinations and 1,500+ partner institutions. Independent summaries add evidence of valuation compression
              and layoffs, which raises the cost of being wrong on demand, compliance, or execution. The net result is a
              high-risk profile with one clear thesis-breaker—destination-policy pressure—and several medium-high
              second-order risks that become more dangerous if growth or liquidity weakens.
            claimRefs:
              - CR005
              - CR006
              - CR009
              - CR012
              - CR014
          - type: table
            tableRef: TR001
            claimRefs:
              - CR004
              - CR005
