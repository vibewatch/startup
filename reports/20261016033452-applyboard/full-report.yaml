        blocks:
          - type: paragraph
            body: >
              ApplyBoard publicly presents itself as a three-sided platform linking students, recruitment partners, and
              schools, with recruitment partners acting as the most visible daily users and institutions as the
              monetized supply side. The official surfaces describe partners using a unified workflow for program
              discovery, multi-school submission, status tracking, document handling, and adjacent services such as
