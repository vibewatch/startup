schemaVersion: report-v2
artifact: valuation
slug: applyboard
runDate: 2026-10-16
company:
  name: ApplyBoard
chapter:
  number: 8
  title: Valuation
  summary: >-
    ApplyBoard shows real scaled distribution—its October 2026 backgrounder says the company has helped over 1.5 million students,
    works with over 5,000 recruitment partners, and partners with over 1,500 institutions—but the retained public valuation evidence
    is stale and inconsistent, ranging from a September 2020 $1.4 billion Series C extension mark to a later 2020 C$2 billion Series C mark.
    Because the assigned evidence set does not disclose current revenue, margin, burn, runway, or a 2025-2026 financing price,
    the price-sensitive recommendation is to track rather than underwrite a buy call.
sections:
  - id: recommendation-and-price-discipline
    title: Recommendation and price discipline
    body: >-
      The current evidence supports a real business with scaled distribution, active hiring, and a partner-facing product that appears to
      solve a genuine workflow problem for international student recruitment. ApplyBoard's current materials market 1,500+ institutions,
      150,000+ programs, AI-assisted quality checks that it says lead to a roughly 95% application success rate, and adjacent
      financial-service products for agents and students. Those signals matter because they suggest platform breadth, commercial
      relevance, and room for monetization beyond pure application routing. The problem is price discovery: the retained pool gives only
      historical financing markers from 2018 and 2020, while current revenue, gross margin, burn, take rate, and fresh secondary or
      primary valuation evidence remain undisclosed. That gap makes the right recommendation track rather than buy. Re-engagement should
      be conditioned on a refreshed financial packet and a current market-clearing price, not on brand strength alone.
    claimRefs: [CV001, CV002, CV003, CV004, CV009, CV011, CV012, CV013]
    tableRefs: [TV001, TV002]
    figureRefs: [FV001]
  - id: financing-context-and-scenarios
    title: Financing context and scenario framing
    body: >-
      The retained financing history shows that ApplyBoard has already experienced multiple valuation steps, but all of them are now
      dated. Velocity reported a C$17 million Series A in 2018. Forbes later reported a $55 million Series C extension at a $1.4
      billion valuation in September 2020, and The PIE News reported that ApplyBoard raised C$100 million later in 2020 at a C$2
      billion valuation. Those facts demonstrate that external investors previously paid high growth-stage prices for the asset, yet they
      do not establish today's fair value because the evidence set offers no current round, no secondary mark, no public comparable set,
      and no fresh operating-metric disclosure to bridge from those old marks to a 2026 entry price. The right scenario work is therefore
      conditional rather than numeric: upside exists if refreshed data prove monetization quality and margin durability, but downside is
      significant if a seller still anchors on 2020-2021 peak narratives without current proof.
    claimRefs: [CV006, CV007, CV008, CV009, CV010, CV011, CV012, CV014]
    tableRefs: [TV003]
  - id: final-diligence-asks-and-thesis-breakers
    title: Final diligence asks and thesis breakers
    body: >-
      A sponsor should not try to solve the missing data problem with storytelling. The gating asks are concrete: audited 2025-2026
      revenue, gross margin, burn, runway, and take-rate data; corridor or product-mix evidence showing whether growth is broad or
      concentrated; and current price discovery through either a fresh financing, a documented secondary transaction, or a current cap
      table with preference-stack details. Without those items, the thesis can describe why ApplyBoard matters but cannot clear a price.
      The thesis breaks if management asks investors to pay on the basis of historical unicorn marks while still withholding the unit
      economics needed to convert partner scale, application success claims, and 360 Solutions breadth into durable cash-generation
      evidence. The investment case improves only if diligence proves that current scale is translating into attractive margins and a
      valuation reset that still offers venture-style upside.
    claimRefs: [CV003, CV004, CV005, CV011, CV012, CV013, CV014, CV015]
tables:
  - id: TV001
    title: Recommendation summary table
    columns:
      - Dimension
      - Assessment
      - Evidence-backed implication
    rows:
      - ["Recommendation", "track", "Public evidence supports company quality but not a current investable price."]
      - ["Confidence", "medium", "Scale and business-model signals are credible, but price discovery is stale."]
      - ["Risk rating", "high", "Missing current financial disclosure and current valuation marks keep downside hard to size."]
      - ["Valuation stance", "stretched", "Historical unicorn marks are not enough support for a 2026 entry price."]
      - ["Decision implication", "conditional re-engage", "Request fresh financials and current pricing evidence before underwriting."]
    notes: Public-only recommendation summary; stale private marks and missing current economics prevent a price-clearing buy call.
    claimRefs: [CV001, CV003, CV005, CV011, CV012]
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Side
      - Argument
      - What would change the view
    rows:
      - ["Thesis", "ApplyBoard has real distribution scale with 1.5M+ students helped, 5,000+ recruitment partners, and 1,500+ institutions.", "Fresh operating data confirming that scale converts into durable gross profit would strengthen conviction."]
      - ["Thesis", "Current partner-facing materials show product breadth across applications, document workflows, AI quality checks, and 360 Solutions attach products.", "Evidence of attach-rate, retention, and margin contribution from those services would justify a stronger valuation stance."]
      - ["Anti-thesis", "The retained pool contains only stale valuation markers from 2018 and 2020, with no 2025-2026 round, secondary trade, or cap-table evidence.", "A current financing or documented secondary price at disciplined terms would reduce price-discovery risk."]
      - ["Anti-thesis", "Public evidence still does not disclose current revenue, gross margin, burn, runway, or preference-stack details.", "Audited financials and cap-table disclosure could move the call from track to investable."]
    notes: Rows compare the strongest pro and con arguments directly; "change the view" lists the minimum evidence needed to alter the recommendation.
    claimRefs: [CV001, CV003, CV004, CV011, CV012, CV013]
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - ["Bull", "Scale metrics remain current and 360 Solutions meaningfully deepen monetization.", "Only underwrite upside if refreshed financials justify paying above reset edtech/private-market levels.", "Attach-rate and margin evidence may prove weaker than the product story.", "Requires a fresh round or secondary mark plus audited growth and margin data."]
      - ["Base", "The company remains strategically relevant but public disclosure stays limited.", "Track the asset rather than set a hard price until current fundamentals and price discovery are shared.", "The business may be good while still being too hard to price.", "Most consistent with the retained evidence set."]
      - ["Bear", "A seller anchors on historical unicorn narratives without providing current economics or cap-table detail.", "Avoid entry because downside cannot be bounded relative to stale 2020 marks.", "Down-round or multiple-compression risk could dominate any product-quality upside.", "Would become likely if diligence access is restricted or pricing remains opaque."]
    notes: Scenario logic is qualitative by design because the assigned evidence pool lacks current revenue, margin, and market-price inputs.
    claimRefs: [CV006, CV007, CV008, CV011, CV012, CV014, CV015]
