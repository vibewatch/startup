  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: current-financials
      missingEvidence: Audited 2025-2026 revenue, gross margin, burn, runway, take rate, and cohort-retention data.
      whyItMatters: Those metrics determine whether scale translates into durable cash generation and whether historical private marks can still be defended.
      diligencePath: Request the latest board pack or audited financial statements plus a management bridge from application volume to revenue and margin.
      relatedQuestionRefs: [QV008]
    - type: private-evidence-only
      severity: material
      topic: current-price-discovery
      missingEvidence: A fresh financing term sheet, documented secondary transaction, or current cap table with preference-stack detail.
      whyItMatters: Without current price discovery and dilution mechanics, downside cannot be bounded against stale 2020 valuation references.
      diligencePath: Obtain the most recent cap table, preference summary, and any 2025-2026 primary or secondary pricing records.
      relatedQuestionRefs: [QV008]
    - type: missing-source
      severity: minor
      topic: comparables
      missingEvidence: A current public-company or M&A comparable set tailored to agent-led international student recruitment or adjacent marketplace models.
      whyItMatters: Comparable evidence would help translate refreshed operating data into a valuation range instead of a pure judgment call.
      diligencePath: Build a comparable screen after management provides revenue mix and margin structure so the right peer set can be chosen.
      relatedQuestionRefs: [QV008]
