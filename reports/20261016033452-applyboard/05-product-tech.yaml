      - ["Document verification and pre-submission QA", "Checks files before institutions review them", "Internal rules, ops review, and institution-specific requirements", "No public false-positive, false-negative, or escalation data"]
      - ["Institution-routing and communications layer", "Handles direct institution communication and access to partner inventory", "Breadth and quality of direct institutional partnerships", "Concentration or destination-policy shocks could degrade product value"]
