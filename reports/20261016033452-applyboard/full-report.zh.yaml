    title: 产品架构图
    type: stack
    summary: 公开证据指向一套分层运营栈，将界面、工作流软件、托管运营、相邻服务和 AI 辅助组合在一起。
    data:
      layers:
        - label: 学生发现层
          summary: End-user search and matching entry points
          items:
            - label: 项目搜索
              detail: 用于留学匹配的学生问卷和搜索界面
          modules:
            - label: 项目目录
              detail: 合作院校提供的 140,000+ 至 150,000+ 个项目
            - label: 签证计算器
              detail: 用于预测加拿大签证获批概率的机器学习工具
          outputs:
            - label: Shortlist
              detail: Matched programs and next-step guidance
        - label: 合作伙伴工作流层
          summary: Agency operating system for application execution
          items:
            - label: 招生顾问仪表盘
              detail: 统一管理资料、文件和申请提交
          modules:
            - label: 资格筛选器
              detail: 按目的地、层级、入学季和资质匹配
            - label: Journey Tracker
              detail: 实时管理申请状态和行动事项
          outputs:
            - label: Application pipeline
              detail: Standardized submissions across institutions
        - label: 质量与验证层
          summary: Checks and managed-service operations around each file
          items:
            - label: 文件审核
              detail: 处理缺失要求并在提交前检查
          modules:
            - label: 质量审计
              detail: 在院校审核文件前标记潜在错误
            - label: 院校沟通
              detail: ApplyBoard 负责协调合作伙伴与学校的互动
          outputs:
            - label: Cleaner files
              detail: Higher-quality submissions entering institution review
        - label: 360 服务层
          summary: Adjacent products around readiness and payments
          items:
            - label: 学生准备服务
              detail: 围绕核心工作流提供财务和后勤支持
          modules:
            - label: 贷款和 GIC
              detail: 资金证明和融资支持
            - label: 考试和支付
              detail: 语言考试代金券、支付和住宿选项
          outputs:
            - label: Expanded wallet
              detail: More services delivered without leaving the platform
        - label: AI 辅助层
          summary: Conversational and decision-support tooling on top of the workflow
          items:
            - label: Abbie
              detail: 在 Azure OpenAI 支持下提供的 GPT 顾问
          modules:
            - label: WhatsApp 支持
              detail: 通过消息提供学生问答和申请支持
            - label: 知识库支撑
              detail: 使用 ApplyBoard 资源和匿名化学生数据
          outputs:
            - label: Faster guidance
              detail: Seconds-level responses claimed for programme matching support
        - label: 人员赋能层
          summary: Commercial and operational support still matters to scale
          items:
            - label: 合作伙伴管理
              detail: 入驻、培训、关系管理和绩效沟通
          modules:
            - label: CRM 和数据管理
              detail: 公开招聘信息显示这是必需能力
            - label: 跨职能协作
              detail: 销售、市场和产品都参与增长执行
          outputs:
            - label: Partner growth
              detail: Scaled ecosystem expansion rather than pure self-serve adoption
    approximationNotes: 这套架构栈是根据公开工作流描述和上线报道推断的，并非公司披露的工程架构。
    claimRefs:
      - CE003
      - CE004
      - CE005
      - CE006
      - CE013
      - CE014
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 公开证据显示，ApplyBoard 以机构主导的学生获客工作流运营，并从院校变现扩展至相邻服务。
    data:
      items:
        - label: 学生发现
          actor: 学生
          phase: 漏斗顶部
          touchpoints:
            - 搜索 150,000+ 个留学项目
            - 比较目的地和负担能力
        - label: 招生合作伙伴接入
          actor: 招生合作伙伴
          phase: 资格审核
          touchpoints:
            - 管理学生资料和文件
            - 提交前使用内置质量检查
        - label: 项目匹配
          actor: 招生合作伙伴和学生
          phase: 匹配
          touchpoints:
            - 探索 1,500+ 所院校
            - 按目的地、领域、层级和入学季筛选
        - label: 提交申请
          actor: ApplyBoard 运营团队
          phase: 履约
          touchpoints:
            - 直接向院校提交申请
            - 就缺失要求与学校沟通
        - label: 录取与状态跟踪
          actor: 招生合作伙伴和院校
          phase: 转化
          touchpoints:
            - 实时监控进度
            - 在学校审核前筛掉较弱的文件
        - label: 扩张与变现
          actor: 院校、合作伙伴和学生
          phase: 录取后
          touchpoints:
            - 入学后收取与学费挂钩的院校费用
            - 提供贷款、代金券和住宿等 360 服务
    approximationNotes: null
    claimRefs:
      - CU003
      - CU004
      - CU005
      - CU010
      - CU013
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 目的地政策暴露是最明确的高影响风险；合作伙伴监管、AI / 隐私和融资韧性仍是重要的次级威胁。
    data:
      columns:
        - label: 可能性
        - label: 影响
        - label: 缓释成熟度
      rows:
        - label: 加拿大政策暴露
          note: 签证许可上限和获批率压力可能打破投资论点。
          values:
            - label: 高
              detail: 预计加拿大签证签发量同比下降 54%，且许可目标上限将持续至 2028 年。
            - label: 高
              detail: 重大目的地冲击可能同时打击业务量、获批数和合作伙伴信心。
            - label: 部分
              detail: 地域覆盖广度有所帮助，但缺少通道和收入结构披露。
        - label: 顾问 / 合作伙伴监管
          note: 合规风险来自外部顾问的行为和监控。
          values:
            - label: 中
              detail: 渠道质量取决于外部招生顾问是否遵守目的地国家的规则。
            - label: 高
              detail: 错误销售或不合规招生可能损害转化，并招致审查。
            - label: 部分
              detail: 可以看到入驻、培训和道德承诺，但看不到审计结果。
        - label: AI / 隐私治理
          note: 敏感学生数据处理和 AI 支持带来跨司法辖区暴露。
          values:
            - label: 中
              detail: Abbie 和申请工作流使用敏感学生信息和自动化。
            - label: 高
              detail: 数据使用、模型治理或事故处理失败会影响信任和合规。
            - label: 部分
              detail: 公开描述了营销控制，但范围内没有 DPA 或保障证据。
        - label: 申请质量承诺
          note: 营销约 95% 的成功率会带来不对称的声誉下行风险。
          values:
            - label: 中
              detail: 如果结果恶化，营销中的约 95% 成功率可能转化为声誉风险。
            - label: 中高
              detail: 转化落空或返工会迅速损害合作伙伴和学生信任。
            - label: 部分
              detail: 有文件验证和支付拦截，但缺少分组结果数据。
        - label: 全球运营复杂度
          note: 大型跨国团队增加了质量保证和升级处理负担。
          values:
            - label: 中
              detail: 公开来源描述了一支规模庞大的跨国团队。
            - label: 中
              detail: 协作失败影响不小，但比政策冲击更容易逆转。
            - label: 部分
              detail: 本地招聘和合作伙伴经理有所帮助，但没有披露国家层面的控制责任归属。
        - label: 融资韧性 / 披露缺口
          note: 历史减值和裁员使当前流动性成为现实问题。
          values:
            - label: 中
              detail: 有历史减值和重组信号，但当前收入和现金跑道未披露。
            - label: 高
              detail: 流动性疲弱会削弱公司吸收政策或执行冲击的能力。
            - label: 有限
              detail: 指定证据池不包含当前现金、烧钱或融资计划证据。
    claimRefs:
      - CR004
      - CR005
      - CR007
      - CR008
      - CR009
      - CR011
      - CR014
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 规模和产品广度确实存在，但过时的定价证据和未披露的当前经营数据让建议仍停留在“继续跟踪”。
    data:
      nodes:
        - id: scale
          label: 规模证明
          summary: 1.5M+ students helped, 5,000+ recruitment partners, and 1,500+ institutions show real market presence.
          claimRefs:
            - CV001
            - CV002
        - id: utility
          label: 产品效用
          summary: AI quality checks, document handling, and recruiter workflows support the channel proposition.
          claimRefs:
            - CV003
            - CV004
        - id: monetization
          label: 变现信号
          summary: Tuition-linked commissions and 360 Solutions create multiple revenue levers.
          claimRefs:
            - CV009
            - CV013
        - id: validation
          label: 外部验证
          summary: ETS partnership and ongoing hiring imply continuing ecosystem relevance and investment.
          claimRefs:
            - CV005
            - CV010
        - id: pricing-gap
          label: 定价缺口
          summary: Retained explicit valuation markers stop in 2020 and current financial disclosure is missing.
          claimRefs:
            - CV011
            - CV012
            - CV014
        - id: recommendation
          label: 建议
          summary: Track until diligence produces current economics and a market-clearing price.
          claimRefs:
            - CV012
            - CV015
      edges:
        - from: scale
          to: utility
          label: 支持
        - from: utility
          to: monetization
          label: 促成
        - from: monetization
          to: validation
          label: 得到强化
        - from: validation
          to: pricing-gap
          label: 抵消
        - from: pricing-gap
          to: recommendation
          label: 导向
    approximationNotes: null
    claimRefs:
      - CV001
      - CV003
      - CV005
      - CV009
      - CV010
      - CV011
      - CV012
      - CV013
      - CV015
