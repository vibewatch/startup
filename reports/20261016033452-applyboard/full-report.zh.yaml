  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与参与者角色
        blocks:
          - type: paragraph
            body: >-
              ApplyBoard
              的公开材料将业务定义为三边平台，而非泛教育市场：它在一个申请工作流中连接国际学生、招募合作方和合作院校。纳入的流程覆盖项目发现、资格匹配、申请提交、文件处理、状态追踪，以及语言考试券、贷款、住宿和签证支持等相邻服务。这个边界很重要，因为公司并不试图在入学后控制学费支付或校园运营；它变现的是入学前的跨境流动工作流，学生需要指导，机构需要流程效率，院校需要合格的入站申请人。
