        - 只有在更新后的财务数据证明可以高于重置后的教育科技 / 私募市场水平出价时，才将上行空间计入投资判断。
        - 附加率和利润率证据可能弱于产品叙事。
        - 需要新一轮融资或二级市场估值标记，以及经审计的增长和利润率数据。
      - - 基准
        - 公司仍具战略相关性，但公开披露依然有限。
        - 在共享当前基本面和价格发现信息前，先跟踪该资产，不设定硬价格。
        - 业务可能不错，但仍然难以定价。
        - 这与留存证据集最为一致。
      - - 悲观
        - 卖方只锚定历史独角兽叙事，却不提供当前经营数据或股权表细节。
        - 相对过时的 2020 年估值标记，下行空间无法界定，因此应避免入场。
        - 跌价轮或估值倍数压缩的风险，可能盖过产品质量带来的所有上行空间。
        - 如果尽调访问受限或定价仍不透明，这一情景就会变得更可能。
    notes: 由于指定证据池缺少当前收入、利润率和市场价格输入，情景逻辑有意保持定性。
