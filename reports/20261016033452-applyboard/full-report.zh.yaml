  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局与买方替代方案
        blocks:
          - type: paragraph
            body: >-
              指定来源更清楚地支持品类级竞争图谱，而不是逐一对标的公开竞品表。ApplyBoard 将自己呈现为覆盖学生、招募合作方和院校的全服务流动平台，依托 1,500+ 所院校和 150,000+
              个项目实现分销广度，而非单点工作流工具。与之相比，现有替代方案仍有竞争力：机构可以自己维护院校直连关系，院校可以把国际招募留在内部招生团队，学生也越来越可能先在 AI 原生页面开始发现，而不是先接触中介。因此
              ApplyBoard 不只是在和明确命名的平台竞品竞争，也在和直签、人工流程及自助发现路径竞争；它们用不同取舍解决同一任务。
            claimRefs:
              - CP001
              - CP005
              - CP008
              - CP013
