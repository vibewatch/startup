      - number: '3.2'
        title: 能力、组合与定价取舍
        blocks:
          - type: paragraph
            body: >-
              证据中 ApplyBoard 最清晰的差异化在于覆盖范围。公司并非只宣传申请路由，而是把项目搜索、提交工作流、文件审核、申请追踪、AI
              辅助指导，以及贷款、GIC、住宿和语言考试券等相邻学生服务打包在一起。这个广度很重要：院校直签或机构人工流程可以复制部分环节，却不会自动把同样的合作方网络或附加服务带进一个界面。公开定价证据少于公开功能证据。Forbes
              2020 年报道仍是允许材料中最明确的变现披露，指向院校付费佣金模式，而非学生付费 SaaS；指定 URL 中的公开竞品定价则大多无法获得。
            claimRefs:
