      - number: '2.3'
        title: 采用驱动、预算归属与约束
        blocks:
          - type: paragraph
            body: >-
              采用驱动越来越集中在漏斗上游和工作流效率。ApplyBoard 借助 ChatGPT 分发切入 AI 原生发现，通过 Abbie 提供 AI
              咨询，并用提交前质量检查承诺缩短从初次搜索到合格申请的路径。买方是多边的：学生免费使用核心平台，招募机构为获取渠道、质量和佣金而采用，院校看起来则为申请人获取价值买单，尽管公开价格未披露。主要约束在于市场对政策敏感：ApplyBoard
              自己的市场教育内容反复出现签证上限、目的地规则变化和合规变化；即使产品需求强劲，通道级监管也可能拖慢转化。
