      - number: '3.3'
        title: 持久性、多平台使用与替代风险
        blocks:
          - type: paragraph
            body: >-
              本章呈现的护城河是分销加工作流，而不是难以替换的技术锁定。ApplyBoard
              官方页面强调可即时接入谈妥的院校关系、独家项目和代理奖励，这可能把合作方活动集中到平台上。但同一批材料也显示入驻门槛低、持续提供代理支持，意味着只要其他渠道给出更好的经济性或线索流，合作方仍可以多平台经营。APIs.io
              从另一角度印证这一点：ApplyBoard 的公开开发者界面很薄，没有公开 API、OpenAPI 定义或 SDK，因此平台持久性似乎不是来自生态互操作性。证据中更新的竞争威胁来自上游发现：ApplyBoard
              自己正切入 ChatGPT，因为学生意向形成正在漏斗前移；如果 ApplyBoard 无法嵌入学生首次提问的位置，同一变化也会增强替代渠道。
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
      - number: '3.4'
        title: 需求变化与未解问题
        blocks:
          - type: paragraph
            body: >-
              允许材料中最可信的不利信号不是做空者或监管者，而是目的地需求与买方行为变化。ApplyBoard 自己的 2024
              年调查发现，学生对传统四大目的地之外的市场有显著兴趣，且政策变化后有相当一部分群体对加拿大兴趣降低；这很重要，因为 ApplyBoard
              的规模和合作方密度历史上最强的正是传统目的地集合。即便如此，本章在若干投资级问题上仍受证据限制。指定材料没有披露知名竞品平台当前的公开价格或融资情况，没有量化合作方留存或抽成率，也没有展示新 ChatGPT
              渠道的实测转化。这些空白不否定竞争判断，但限制了买方判断护城河持久性相对于更快迭代的替代方案时的信心。
            claimRefs:
              - CP010
              - CP011
              - CP012
      - number: '3.5'
        title: 展示项
        blocks:
          - type: callout
            title: 分销组合是最清晰的护城河
            body: 最有支持的竞争优势不是某个算法或公开 API，而是谈妥的院校接入、打包工作流和相邻服务的组合；通过直签或人工流程，很难一次性复现这三者。
            calloutType: strength
            claimRefs:
              - CP003
              - CP005
              - CP011
          - type: callout
            title: 多平台经营和 AI 发现仍可能压缩优势
            body: 免费入驻、持续代理支持要求以及 AI 原生发现的兴起，都意味着 ApplyBoard 必须持续争取合作方注意力；否则即使平台运营上仍有用，渠道经济性也可能走弱。
            calloutType: risk
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP012
