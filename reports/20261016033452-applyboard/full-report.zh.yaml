            body: >-
              创业叙事前后一致：ApplyBoard 源于 Basiri 兄弟亲历加拿大留学流程的困难，这支持真实的创始人与市场匹配，而非纯粹机会主义的软件切入。但当前管理层信息并不清晰。现任 Our Story 页面称
