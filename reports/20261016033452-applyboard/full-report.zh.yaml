      - 论点
      - 哪些变化会改变判断
    rows:
      - - 投资逻辑
        - ApplyBoard 已具备真实的分销规模：帮助过 1.5M+ 名学生，拥有 5,000+ 家招生合作伙伴和 1,500+ 所院校。
        - 新的运营数据若能确认该规模转化为可持续毛利，将增强投资信心。
      - - 投资逻辑
        - 当前面向合作伙伴的材料显示，产品覆盖申请、文件工作流、AI 质量检查和 360 Solutions 附加产品。
        - 如果这些服务能证明附加率、留存率和利润率贡献，将支持更高的估值判断。
      - - 反向逻辑
        - 留存证据池里只有 2018 年和 2020 年的过时估值标记，没有 2025-2026 年融资轮、二级交易或股权表证据。
        - 若能以审慎条款拿到当前融资或有文件佐证的二级市场价格，价格发现风险会下降。
      - - 反方论点
        - 公开证据仍未披露当前收入、毛利率、烧钱、现金跑道或优先权结构细节。
        - 经审计财务数据和股权表披露，可能让判断从“继续跟踪”转向“可投资”。
    notes: 各行直接比较最有力的正反论点；“改变观点”列出改变建议所需的最低证据。
