              million 名学生。此后证据转为公司口径且彼此不一致：公开页面对 ApplyBoard 服务的项目数究竟是 140,000+ 还是 150,000+、院校数是 1,500+ 还是 1,750+、学生数是
              600,000+ 还是 1.5M+，说法不一。这些区间仍可用于定位，但应视为有边界的规模参考，而不是精确市场模型。
