    title: 公司概览
    sections:
      - number: '1.1'
        title: 平台定位、模式与已披露规模
        blocks:
          - type: paragraph
            body: >-
              ApplyBoard 将自己定位为全服务留学平台，在一个工作流中连接学生、招募合作方和合作院校，而不是单点线索生成器。当前官方页面突出合作方侧的流程压缩：招募方可搜索 1,500+
              所院校、提交标准化申请、追踪状态，并在同一仪表盘中叠加金融服务和考试券产品。现有最有力的规模披露同样来自公司自身：ApplyBoard 称已帮助超过 1.5 million 名学生，与超过 1,500
              所院校合作，并积极服务超过 6,500 个招募合作方。这足以证明其已达到真实的品类规模，但由于指定材料没有披露相关数据，仍不足以判断当前收入、客户集中度或标准化后的员工人数。
