  evidenceGaps:
    - type: enumeration-incomplete
      severity: material
      topic: regulatory-risk-register
      missingEvidence: Direct regulator, court, privacy-authority, and immigration-compliance records on ApplyBoard's agent-supervision, privacy, and licensing posture across destination markets.
      whyItMatters: The legal register currently relies mainly on company materials plus one tertiary adverse summary, so it cannot be treated as exhaustive.
      diligencePath: Pull regulator dockets, provincial or federal compliance filings, privacy notices, DPAs, and outside-counsel memos before investment committee.
      relatedQuestionRefs:
        - QR003
        - QR005
      relatedTableRefs:
        - TR001
    - type: missing-source
      severity: material
      topic: canada-exposure
      missingEvidence: Applications, enrolments, revenue, and gross margin split by destination country and source corridor, especially Canada versus non-Canada markets.
      whyItMatters: Policy shock cannot be translated into revenue or cash-flow sensitivity without corridor mix and contribution margins.
      diligencePath: Request monthly application and enrolment cohorts plus revenue contribution by destination, institution type, and source market.
      relatedQuestionRefs:
        - QR002
        - QR008
    - type: private-evidence-only
      severity: material
      topic: liquidity-resilience
      missingEvidence: Current burn, runway, debt or preference obligations, secondary prices, and the board-approved 2026 operating plan.
      whyItMatters: Historical funding and markdown evidence does not reveal present financing flexibility or down-round risk.
      diligencePath: Review the latest board deck, cap table, monthly cash bridge, and financing pipeline.
      relatedQuestionRefs:
        - QR006
        - QR008
    - type: missing-source
      severity: material
      topic: ai-governance
      missingEvidence: A DPA, subprocessor list, model-governance policy, audit logs, and incident history for Abbie, WhatsApp support, and document automation.
      whyItMatters: Sensitive student-data use and automated application support create privacy, bias, and incident-response exposure that cannot be judged from marketing copy alone.
      diligencePath: Request privacy architecture, retention schedules, SOC or ISO coverage, red-team results, and human-override metrics.
      relatedQuestionRefs:
        - QR004
        - QR005
