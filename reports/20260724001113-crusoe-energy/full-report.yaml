      - number: '4.4'
        title: Financial Gaps, Risks, and Verdict
        blocks:
          - type: paragraph
            body: >
              The most significant financial underwriting gaps for Crusoe are the absence of gross margin, EBITDA, cash
              position, burn rate, net revenue retention, and audited financial statements. As a private company not
              subject to SEC reporting obligations beyond Form D filings, Crusoe has no obligation to disclose these
              metrics. The appointment of MongoDB veteran Michael Gordon as COO/CFO signals improving financial
              governance and IPO preparation, but independent verification of financial performance remains unavailable.

              Four material adverse factors bear close scrutiny. First, GPU spot pricing compression—from approximately
              $8/hour to $2–3/hour for H100s—represents a structural pricing ceiling that constrains upside on on-demand
              cloud revenue. Crusoe's ability to lock customers into reserved capacity agreements at list pricing above
              spot is a critical value driver that is unverified. Second, the clean-energy financial risk: Crusoe's ESG
              brand may command pricing premium from sustainability-focused enterprises, but Heatmap News (March 2025)
              reported continued natural gas use including an Engine No. 1 joint venture for 4.5 GW of new gas capacity.
              If ESG-sensitive customers investigate the actual energy stack, attrition risk and reputational damage
              could compress realized pricing below list pricing. Third, customer concentration in Microsoft and Oracle
              creates revenue dependency risk: a contract modification or hyperscaler infrastructure insourcing decision
              could materially impact revenue. Fourth, the high-capex model with $9.6B project finance creates covenant
              and refinancing risk at JPMorgan's scale. No public covenant terms, LTV ratios, or debt service coverage
              requirements are available for diligence review.

              The company's 17x TCV growth in 2025 and 150% cloud ARR growth are encouraging signals, but the opacity of
              private financials—particularly gross margin trajectory as the company transitions from mining to
              cloud—means that revenue growth without margin visibility is difficult to underwrite. Crusoe's Spark
              manufacturing revenue stream is an interesting financial diversifier but is currently evidenced only by
