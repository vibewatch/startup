      - number: '7.4'
        title: Customer Concentration, Partner Dependency and Competitive Risk
        blocks:
          - type: paragraph
            body: >
              Crusoe's demand concentration is a leading risk indicator. The Abilene Stargate campus — its flagship
              revenue project — has seen Oracle/OpenAI exit the later stages, with Microsoft subsequently taking on that
              capacity. The Wyoming 1.8 GW Project Jade was paused at a single customer's request, with neither the
              customer nor the reason disclosed. A second significant arrangement reportedly involves Meta signing a 1.6
              GW capacity agreement with Crusoe, which, while encouraging for diversification, amplifies the pattern of
              very large, single-customer risk events. By contrast, on the cloud-services side, Crusoe Cloud counts
              Cursor, Decart, Fireworks, Odyssey, and Together AI as named customers — smaller enterprises with lower
              individual concentration risk, though their aggregate ARR is not disclosed. On the competitive side,
              CoreWeave's March 2025 IPO at a $23 billion market cap (enterprise value ~$30 billion) and $1.9 billion in
              2024 revenue (730% YoY growth) establishes a clear benchmark: Crusoe trades at a discount to CoreWeave on
              revenue multiples but lacks the same degree of public comparability. AWS, Google Cloud, and Azure continue
              to ramp AI GPU capacity and have vastly deeper balance sheets. Lambda Labs and other neo-clouds remain
              price-competitive alternatives. For partner dependency, Crusoe's Tallgrass partnership for Wyoming power
              supply is now effectively paused; Blue Owl Capital's $3.4 billion joint venture for the Abilene campus
              creates project-finance interdependency; and NVIDIA's equity stake creates both supply-chain alignment and
              potential conflicts of interest if NVIDIA develops competing cloud services.
