      - number: '8.2'
        title: Financing Context and Current Valuation Mark
        blocks:
          - type: paragraph
            body: >
              Crusoe has raised approximately $3.9 billion in total equity and structured financing. The most recent
              priced equity round was the Series E in October 2025: $1.375 billion at a post-money valuation exceeding
              $10 billion, with Valor Equity Partners and Mubadala Investment Company among the lead investors. This
              followed the Series D in December 2024: $600 million at $2.8 billion post-money, led by Founders Fund,
              with NVIDIA and others participating. The twelve-month step-up from $2.8B to $10B+ (3.6x) is consistent
              with the execution milestones achieved in the intervening period: Abilene coming online, 4.9 GW
              contracted, and the Meta 1.6 GW capacity agreement announced.

              On the debt side, Crusoe secured a $500 million credit facility from Brookfield Asset Management for power
              infrastructure development and a $450 million joint-venture arrangement with Blue Owl Capital for the
              Abilene campus Phase 2. Reuters reported in June 2025 that NVIDIA was involved in a $750 million round,
              which likely refers to a combination of Series D and E tranches plus structured debt rather than a
              separate priced round. Total capital including debt is estimated at approximately $5.5 billion.

              Revenue trajectory provides the fundamental valuation anchor. Sacra Research estimated FY2024 revenue at
              approximately $276 million, implying a $10B EV/revenue multiple of ~36x trailing — substantially above the
              CoreWeave IPO multiple of ~12x. However, Crusoe's growth profile was accelerating sharply: Sacra projected
              FY2025 revenue of ~$998 million, which would reduce the EV/revenue to ~10x on forward revenue — broadly in
              line with CoreWeave at IPO. This forward multiple is achievable only if the contracted 4.9 GW ramps to
              revenue on schedule and the xAI/Meta relationships hold throughout 2025. Observed facts are clearly
              separated from model projections throughout this chapter; any revenue or valuation figure that is a
              third-party estimate is identified as such.
