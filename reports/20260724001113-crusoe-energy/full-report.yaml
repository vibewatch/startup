      - number: '6.5'
        title: Procurement Patterns, Concentration Risk, and Adverse Signals
        blocks:
          - type: paragraph
            body: >-
              Crusoe's hyperscale data-center procurement follows a land-and-expand pattern anchored on phased campus
              commitments. Oracle and OpenAI took Phase 1 (200MW+) at Abilene and served as the construction catalyst;
              Microsoft took Phase 2 (900MW), expanding the campus to 1.2GW total. This phased structure is rational
              from both sides: the customer hedges against construction risk by not committing the full phase upfront;
              Crusoe gets an anchor to begin construction financing before the full campus is subscribed. The risk is
              that subsequent phases require re-commitment from the same tenant or a replacement, and the Wyoming
              project pause shows that Crusoe cannot assume Phase 2 follows Phase 1.

              Cloud procurement follows two paths. Self-service buyers sign up via crusoe.ai/cloud and move to monthly
              or annual GPU reservation contracts after an initial trial. Enterprise buyers engage Crusoe's direct sales
              team for custom cluster configurations, dedicated private networking, and negotiated SLAs. Managed
              Inference users follow an API-key model without cluster reservations, making them the most portable and
              most churn-prone segment. Customer concentration is the most significant risk signal in Crusoe's customer
              profile. The campus tier has three confirmed or reported anchor tenants (Oracle, Microsoft, Meta) each at
              200MW–900MW, plus xAI at 1GW+. If any two of these fail to convert from reported to executed contracts,
              Crusoe's contracted capacity metric would be materially reduced and campus construction financing could be
              at risk.

              The Wyoming project pause — where an unnamed customer requested a halt — is the clearest evidence that
              hyperscale pipeline customers can and do withdraw. Crusoe's public disclosure of customer metrics is
              sparse: no customer count, revenue breakdown, or cohort NRR is publicly available. Worldmetrics aggregates
              statistics suggesting hundreds of cloud customers but cites secondary sources without primary data. The
              Upstream Data patent litigation was resolved in 2025 via a licensing agreement, per Crusoe's newsroom;
              blockspace.media reported a "mixed ruling" where infringement was found but damages were contested. The
              core Crusoe Cloud business is software and infrastructure, not DFM hardware, so residual IP risk from the
              Upstream Data case is limited in scope but represents a precedent for DFM technology IP challenges if the
              legacy segment grows.
