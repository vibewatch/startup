      - number: '2.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Power Is the Market's Defining Moat — Not Capital or GPUs
            body: >
              The neocloud market has undergone a structural shift: securing power access (not GPU hardware or venture
              capital) has become the primary determinant of long-term competitive position. Grid interconnection delays
              of 4–10 years mean that any operator who locked up power in 2023–2024 owns 2026 capacity and beyond.
              Crusoe's energy-first heritage — stranded gas capture, renewable site selection, behind-the-meter
              generation — was originally a climate strategy but has become a durable structural moat precisely when it
              matters most. We The Flywheel (2026) explicitly identifies this as Crusoe's highest-scoring differentiator
              relative to CoreWeave and other peers.
            calloutType: insight
            claimRefs:
              - CM030
              - CM037
              - CM038
              - CM044
          - type: callout
            title: Divergent Market Sizing Estimates and the SAM Ambiguity Problem
            body: >
              The AI infrastructure market is defined differently by every analyst: IDC's $487 billion (2026) and
              Gartner's $37.5 billion (2026, AI-optimized IaaS) measure overlapping but non-identical populations.
              Investors should treat all headline TAM figures as directional orientation, not precision inputs. Crusoe's
              specific SAM — the share of the neocloud and hyperscale factory market it can credibly win — is not
              publicly disclosed and cannot be derived from published data alone. The evidence gap between $487 billion
              (IDC's AI infra total) and $23 billion (neocloud segment) is itself a diligence question that requires
              internal revenue and pipeline data to bridge.
            calloutType: risk
            claimRefs:
              - CM013
              - CM016
          - type: callout
            title: 2–6x Cost Arbitrage Creates Durable TAM Expansion Opportunity
            body: >
              The GPU pricing differential between neoclouds and hyperscalers is large, quantified, and persistent.
              On-demand H100s cost $2.49–$4.25/hr on neoclouds versus $6.88/hr on AWS and $12.29/hr on Azure — a 2–5x
              gap that widens further on B200 hardware ($4.99 on Lambda vs. $14.24 on AWS). This differential makes
              economic cases for AI workload migration off hyperscalers compelling at scale. Every enterprise or lab
              that shifts AI training or inference off AWS/Azure at price is a potential Crusoe Cloud or CoreWeave
              customer. At $50,000–$500,000/month per production team, the cumulative TAM impact of cost-driven
              migration is significant.
            calloutType: insight
            claimRefs:
              - CM031
              - CM032
              - CM036
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: >
              The GPU cloud market that Crusoe occupies spans at least four structural tiers, each presenting a distinct
              competitive challenge. At the tier-1 level, pure-play neocloud GPU cloud operators—CoreWeave, Lambda Labs,
              Nebius AI, and Vast.ai— are Crusoe's most direct revenue competitors for developers, AI labs, and
              enterprise GPU capacity buyers. CoreWeave, which listed on NASDAQ in March 2025, is the largest of these
              operators by estimated ARR (~$5B in early 2025) and holds preferred NVIDIA GPU allocation status, making
              it the benchmark by which neocloud pricing and reliability are judged.

              At the tier-2 level, hyperscalers—AWS, Microsoft Azure, Google Cloud, and Oracle OCI—are the single
              largest aggregate supplier of GPU compute globally. AWS P5 instances deploy H100 in 96-GPU EFA-networked
              clusters; Azure NDv5 VMs provide H100 for distributed training; Google Cloud offers A100/H100 on-demand
              and through committed use discounts; Oracle SuperCluster bundles 400 H100 GPUs in a single bare-metal
              cluster. Hyperscalers are investing heavily in AI infrastructure (Microsoft alone committed $80B+ for
              2025) and represent the "safe default" choice for enterprise procurement teams.

              At the tier-3 level, energy-thesis-adjacent operators like Lancium operate renewable-powered HPC
              infrastructure in Texas, overlapping with Crusoe's original market positioning. Lancium's clean campuses
              are ERCOT-approved for gigawatt-scale grid-connected power, but Lancium does not offer a general-purpose
              GPU cloud product.

              The fourth competitive tier is the status quo: on-premises HPC clusters, colocation at traditional data
              centers (Digital Realty, Equinix), and internal build programs at large enterprises. This tier is the most
              important because it represents the majority of enterprise GPU spend today and the benchmark Crusoe must
              displace. Crusoe's BYO Power approach and Spark modular factory directly address the
              on-premises/colocation tier by offering a faster, more power-dense alternative.

              Adverse context: GPU H100 spot market prices declined from ~$8/hour in 2023 to $2–3/hour by late 2024
              across neocloud providers, compressing the arbitrage opportunity that originally attracted enterprise
              buyers away from hyperscalers. Crusoe experienced a documented connectivity outage affecting compute
              instances in its us-east1-a region, surfacing reliability risk that CoreWeave and hyperscalers will
              highlight in competitive conversations.
