      - number: '6.4'
        title: 'Retention and Durability: SLA Performance, CSAT, and Switching Economics'
        blocks:
          - type: paragraph
            body: >-
              Crusoe Cloud contractually guarantees 99.98% cluster uptime and a sub-90-second VM boot time across its
              IaaS tier. The 99.98% uptime figure translates to approximately 105 minutes of permissible unplanned
              downtime per year per cluster. Windsurf's twelve-month production tenure without a reported SLA breach is
              the strongest independent validation of this guarantee. The SemiAnalysis ClusterMAX review noted
              faster-than-average support response times, and Crusoe reported 100% CSAT over the trailing twelve months
              — though all of these figures are self-reported and are not independently audited or confirmed by named
              customers outside the Windsurf case study.

              Crusoe's status page recorded a load-balancer outage in the ICAT region on June 17, 2026 that rendered
              endpoints unreachable for approximately two hours. This incident is consistent with the SLA headroom (one
              event within 99.98% tolerance) but demonstrates that Crusoe is not immune to the operational issues
              affecting all cloud providers. The Iceland facility also experienced a widespread fiber contamination
              event (volcanic ash debris affecting 20,000 fiber ends) in 2025 requiring physical remediation. Neither
              event appears to have triggered published SLA credits or reported customer churn, consistent with the
              self-reported 100% CSAT figure.

              Net Revenue Retention and Gross Revenue Retention are not publicly disclosed for Crusoe Cloud. Cheddarflow
              estimated NRR in the 110–130% range for pre-2025 cohorts based on qualitative expansion signals. This
              estimate cannot be independently verified. Contract lengths differ significantly by tier: hyperscale
              data-center tenants sign 10-to-20-year power purchase agreements creating extremely durable revenue; cloud
              customers sign monthly or annual GPU reservations, which are more portable but benefit from modest
              switching costs (workload integration, SLA familiarity, networking configuration). The Windsurf expansion
              from GPU IaaS to Managed Inference illustrates the organic upsell pattern that drives Crusoe Cloud's
              estimated high NRR. The absence of a public NPS, independent CSAT audit, or disclosed churn rate is a
              material diligence gap for prospective enterprise buyers evaluating long-term commitments.
