      - number: '7.5'
        title: People, Execution and Financial Risks
        blocks:
          - type: paragraph
            body: >
              Crusoe more than doubled headcount to 1,217 employees in 2025, the second consecutive year of doubling.
              Hyper-growth hiring at this velocity across both technical and construction-management roles creates
              organizational risk: integration and culture strain, key-person dependency on co-founders Chase Lochmiller
              (CEO) and Cully Cavness (COO), and execution quality risk on a portfolio of simultaneous gigawatt-scale
              builds. The company's 2025 debt facilities totalled approximately $975 million, with an additional $750
              million credit facility from Brookfield Asset Management arranged in mid-2025. Total capital raised
              reaches ~$3.9 billion across all rounds. While this capital depth is exceptional for a private company,
              the debt service obligations alongside aggressive capex for GPU procurement and construction create a
              high-burn-rate dynamic: any meaningful delay in customer activation or revenue recognition could pressure
              the balance sheet. The ~$12 billion cost estimate for the full Abilene campus (Blue Owl press reports)
              implies that Crusoe's equity and debt combined cover less than one-third of the committed build-out value
              — the balance will need project financing or additional equity. The recent Wyoming pause illustrates that
              customer-driven scope changes can crystallise stranded-cost risk before revenue is locked. Finally, the
              2025 divestiture of the Bitcoin mining business to NYDIG removes a cash-generative, albeit cyclical,
              revenue leg at a time when the AI-infrastructure side is still ramping to utilization.
            claimRefs:
