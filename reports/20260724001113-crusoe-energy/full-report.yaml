      - number: '4.2'
        title: Unit Economics and Pricing
        blocks:
          - type: paragraph
            body: >
              Crusoe's publicly disclosed pricing is list pricing only; realized revenue per GPU-hour, discount
              structures for reserved capacity, and GPU utilization rates are not disclosed. The H100 SXM is listed at
              $4.29/GPU-hour, positioning Crusoe at the premium end of neocloud spot offerings. CPU compute is listed at
              $0.04/vCPU-hour. The GB200 NVL72 price is undisclosed. Crusoe's managed inference product (MemoryAlloy)
              uses a usage-based pay-as-you-go model billed per 1 million tokens, with cached tokens billed at a lower
              rate; absolute token prices are not published.

              The market context for unit economics is adversarial: H100 spot prices collapsed from approximately
              $8/hour in 2023 to $2–3/hour by late 2024, driven by supply normalization and cluster competition. This
              compression forces Crusoe to compete on infrastructure efficiency, product differentiation, and enterprise
              sticky contracts rather than on spot pricing alone. Crusoe's PUE of 1.2–1.3 (versus the industry average
              of approximately 1.8) implies approximately 30–40% lower power overhead than typical data centers. At an
              estimated blended energy cost of $0.03–0.06/kWh and H100 TDP of approximately 700W, power cost per H100
              per hour is roughly $0.02–0.04—a small fraction of the $4.29 list price. GPU capital depreciation is the
              dominant cost driver: H100 units cost approximately $25,000–30,000 each, and depreciated over 3–5 years at
              80% utilization, the capital charge per GPU-hour is approximately $0.60–1.20, leaving meaningful headroom
              for gross margin at list prices.

              For peer comparison, neocloud companies have disclosed gross margins in the 20–40% range; Crusoe's
              efficiency advantages in energy and cooling suggest it could be at the high end of this range for its
              cloud segment, but no gross margin figure has been publicly disclosed. The actual margin is also affected
              by the GPU procurement cost premium Crusoe pays as a non-hyperscaler buyer (no disclosed NVIDIA discount
              structure) and by ramp costs during the Abilene campus build phase.

              Crusoe reported $276M in 2024 revenue with an estimated $600M–$1B range for 2025. The implied revenue
              multiple at Crusoe's $10B+ Series E valuation (10x–17x on estimated 2025 revenue of $600M–$1B) is
              consistent with premium neocloud multiples but depends heavily on the unverified 2025 revenue base.
