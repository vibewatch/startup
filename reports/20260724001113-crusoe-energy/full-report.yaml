chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and Business Model
        blocks:
          - type: paragraph
            body: >
              Crusoe Energy Systems (doing business as Crusoe) is a vertically integrated AI infrastructure company
              headquartered in Denver, Colorado. Founded in 2018, the company began by deploying modular data centers at
              oil and gas wellheads to capture natural gas that would otherwise be flared and wasted — a proprietary
              approach trademarked as Digital Flare Mitigation® (DFM). DFM converts stranded wellhead gas into
              electricity powering on-site compute, achieving up to 99.89% combustion efficiency compared to roughly 93%
              for standard flares, reducing CO2-equivalent emissions by approximately 63% relative to continued flaring.
              Each DFM deployment eliminates an estimated 8,000 tons of CO2 equivalent annually.

              Initially Crusoe used the captured energy for Bitcoin and cryptocurrency mining, but the business
              fundamentally pivoted in 2023 toward AI cloud infrastructure as demand for GPU compute surged. The company
              borrowed $200 million to purchase NVIDIA H100 GPUs and began offering Crusoe Cloud, a high-performance AI
              and machine learning platform. By the time of its December 2024 Series D, Crusoe described itself as "the
              industry's first vertically integrated AI infrastructure provider," combining proprietary energy strategy
              (stranded gas, renewables), AI-optimized data center construction, and a full-stack cloud platform. The
              company's current mission is to "accelerate the abundance of energy and intelligence."

              Crusoe generates revenue primarily through long-term data center leases (anchored by multi-year contracts
              with hyperscaler-tier customers) and through Crusoe Cloud subscription and consumption fees. The 1.2 GW
              Abilene, Texas campus anchored by a long-term Oracle lease underpins near-term revenue visibility.
              Manufacturing facilities in Denver and Tulsa produce server racks for controlled-environment GPU
              installation before trucking to data center sites.
