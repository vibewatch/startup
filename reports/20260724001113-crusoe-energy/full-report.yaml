      - number: '8.4'
        title: Bull, Base, and Bear Scenarios
        blocks:
          - type: paragraph
            body: >
              The bull scenario assumes Abilene fully ramps to 1.2 GW by mid-2026, Project Jade (Wyoming) resumes and
              delivers initial capacity in H2 2026, xAI and Meta hold multi-year capacity commitments, and Crusoe Spark
              modular deployments accelerate revenue from smaller enterprise customers. On these assumptions, FY2026
              revenue could reach $1.5–2.0 billion, and at a 10–13x forward multiple the implied EV is $15–25 billion.
              Series D investors (at $2.8B) would achieve 5.4–8.9x MOIC; Series E investors (at $10B) would achieve
              1.5–2.5x. This scenario requires no further major customer concentration events, successful ESG
              repositioning, and continued favourable Texas grid policy.

              The base scenario assumes Project Jade returns to active construction but with a 12-month delay, Oracle
              and OpenAI capacity at Abilene is replaced by Microsoft and new enterprise customers at reduced
              utilisation rates, and Crusoe Spark adds 200–300 MW incrementally. FY2026 revenue of approximately $900M
              to $1.2B at 8–12x EV/revenue implies $7–14B enterprise value. Series D investors achieve 2.5–5x MOIC;
              Series E investors see modest 0.7–1.4x returns within a 2–3 year hold.

              The bear scenario assumes at least two additional Wyoming-style pauses at other campuses, xAI or Meta
              reduces contracted commitments by 30–50% due to build-own pivot or competitive alternatives, gross margins
              compress below 40% due to power cost escalation (gas turbines + SB6 curtailment costs), and no IPO window
              opens before 2028. At $400–600M FY2026 revenue and 6–8x EV/revenue, implied EV is $2.4– 4.8 billion —
              below the Series E post-money and resulting in 0.24–0.48x MOIC for Series E investors and 0.86–1.71x for
              Series D.

              Probability weights for the three scenarios based on available evidence as of June 2026: bull 25%, base
              50%, bear 25%. Probability-weighted EV: approximately $9.6–13.5B. This is marginally above the current
              $10B+ mark, suggesting the Series E valuation is broadly efficient with limited downside protection for
              late entrants.
