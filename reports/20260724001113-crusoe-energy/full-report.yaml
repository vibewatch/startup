      - number: '8.5'
        title: Recommendation, Confidence, and Conviction Framework
        blocks:
          - type: paragraph
            body: >
              Stance: Conditional INVEST with significant diligence prerequisites. Confidence: Medium. Risk rating:
              High. This recommendation applies to new capital entering at the $10B+ Series E mark. Earlier investors at
              the $2.8B Series D mark are sitting on a strong mark-up and should model exit timing with care.

              The conviction framework has three gates. Gate 1 (customer contracts): investor must receive redacted
              versions of the top-3 customer contracts confirming minimum take-or-pay amounts, cancellation notice
              periods, and penalty provisions. Oracle/OpenAI's exit from Abilene later phases on short notice — while
              reportedly replaced by Microsoft — underscores that informal commitments carry high execution risk. Gate 2
              (gross margin): investor must confirm gross margin trajectory above 45% on a per-customer, per-campus
              basis. Crusoe's natural gas turbine and SB6 curtailment exposure creates power cost uncertainty that is
              not reflected in top-line revenue projections. Gate 3 (construction controls): investor must receive a
              detailed programme management plan for at least two non-Abilene campuses showing binding customer
              commitments with milestones and penalties tied to construction progress, to avoid a recurrence of the
              Cheyenne pause.

              Kill triggers are those events that would shift the recommendation to PASS regardless of current mark: (1)
              loss of xAI or Meta as customers representing >30% of contracted capacity; (2) a second Wyoming-style
              customer-driven pause within twelve months; (3) debt covenant breach on the Brookfield facility; (4)
              discovery that the DFM divestiture leaves Crusoe with material methane-compliance indemnities.

              From an exit readiness perspective, Crusoe is not yet IPO-ready but is trending toward IPO eligibility in
              2026–2027 if revenue exceeds $1B and EBITDA margins expand. Strategic M&A from hyperscalers (Microsoft,
              Meta, Google) is a viable alternative exit, with precedents in CoreWeave's customer relationship.
              Secondary transaction pricing has not been independently confirmed as of this writing.
