      - number: '4.3'
        title: Capital Structure and Adequacy
        blocks:
          - type: paragraph
            body: >
              Crusoe has assembled an unusually large and layered capital structure for a private company in the AI
              infrastructure sector. The equity financing history spans six rounds totaling approximately $3.4B; the two
              most recent are the Series D ($600M at $2.8B valuation, SEC Form D filed November 21, 2024, exact amount
              $817,744,542 with 70 investors) and the Series E ($1.375B at $10B+ valuation, SEC Form D filed October 23,
              2025, exact amount $1,374,999,988 with 71 investors). Investors in Series D include Founders Fund, NVIDIA,
              Fidelity, Mubadala, Ribbit Capital, and Valor. Series E was co-led by Valor Equity Partners and Mubadala
              Capital.

              Beyond equity, Crusoe secured a $3.4B Blue Owl Capital joint venture for the Abilene data center buildout
              and JPMorgan is arranging approximately $9.6B in project financing for the same campus, bringing total
              committed capital above $15B for the Abilene campus alone. This capital structure reflects the fundamental
              economics of AI hyperscale data center development: each gigawatt of AI-optimized capacity requires
              approximately $10–15M/MW in civil engineering, power infrastructure, and cooling before a single GPU rack
              is installed.

              Capital adequacy for near-term operations appears robust: the $1.375B Series E equity plus project finance
              runway should cover Abilene Phase 1. Michael Gordon's appointment as COO/CFO in December 2025 (former
              MongoDB CFO who led the 2017 IPO at a time when MongoDB's revenue was growing approximately 50x) signals
              active preparation for potential capital markets activity. Key risks include project finance covenant
              exposure, concentration of capex in a single campus (Abilene), and the execution dependency on JPMorgan
              credit facility drawdown timing. No cash position or monthly burn rate has been publicly disclosed.

              The company's capital adequacy depends critically on the Microsoft 900 MW and Oracle Stargate 15-year
              contracted revenue stream to service project financing covenants. If either hyperscaler anchor modified
              its commitment, the project finance structure would face refinancing risk at scale.
