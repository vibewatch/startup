      - number: '2.2'
        title: 'Market Sizing: Multiple Lens Analysis'
        blocks:
          - type: paragraph
            body: >
              Analyst forecasts for the AI infrastructure market vary substantially depending on definitional scope,
              making multi-lens triangulation essential for any SAM/SOM exercise. At the broadest level, S&P Global
              Market Intelligence estimates AI infrastructure spending at $337 billion in 2025, growing to $1.2 trillion
              by 2030 at a 28% CAGR. IDC forecasts global AI infrastructure spending reaching $487 billion in 2026, a
              53% year-over-year increase from 2025. ARK Investment Management projects even higher growth, from $500
              billion in 2025 to approximately $1.5 trillion by 2030. These broad estimates capture hardware, software,
              and services across hyperscalers and specialists alike; Crusoe's direct exposure is a fraction of these
              figures.

              Narrowing the lens, Gartner forecasts AI-optimized infrastructure-as-a-service (AI-optimized IaaS) — the
              closest proxy to the neocloud and Crusoe Cloud segment — at $18.3 billion in 2025, growing 105%
              year-over-year to $37.5 billion in 2026. This is the most relevant single-metric TAM comparison for
              Crusoe's cloud business. S&P Global further identifies AI-as-a-Cloud-Service (ACaaS) as the
              fastest-growing AI infrastructure subsegment, at $20 billion in 2025 growing at 48% CAGR to $145 billion
              by 2030.

              For the neocloud segment specifically, Synergy Research Group estimates revenue around $23 billion in 2025
              with Forrester projecting $20 billion for 2026 (though these may differ in scope). SRG sees the segment
              reaching $180 billion by 2030; IndexBox projects $236 billion by 2031 at a 46% CAGR. Multiple forecasts
              diverge significantly, reflecting definitional inconsistencies (some include hyperscaler dedicated GPU
              services; others exclude them), and this divergence is itself a diligence gap rather than a model flaw.

              For Crusoe's serviceable addressable market, the hyperscale data center development business (AI factory)
              and the GPU cloud (Crusoe Cloud) must be sized separately. The Abilene campus alone is valued at over $10
              billion in construction and infrastructure investment across all phases, anchoring AI factory revenue
              under long-term leases. Crusoe's cloud SAM is more tightly scoped to the Gartner AI-optimized IaaS range.
              Actual revenue figures are not publicly disclosed.
