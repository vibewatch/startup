        title: Exhibits
        blocks:
          - type: callout
            title: Energy-First Moat and Founders Fund Pedigree
            body: >
              Crusoe's strategy of locking up stranded gas, geothermal, and renewable energy ahead of demand is widely
              cited as the core moat in the neocloud market. Analysts note that vendors who secured power in 2023–2024
              own 2026 capacity — a structural advantage Crusoe built from its DFM heritage. Founders Fund's multi-round
              commitment spanning eight years and Peter Thiel's visible endorsement signal conviction at the venture
              level.
            calloutType: strength
            claimRefs:
              - CO003
              - CO014
              - CO015
              - CO026
          - type: callout
            title: Operational Reliability and Concentration Risk
            body: >
              Crusoe has experienced two material outage incidents within 14 months — a 45-hour cloud outage in March
              2025 and a networking incident in May 2026 — drawing explicit customer criticism and industry skepticism.
              The Abilene campus represents both the company's greatest opportunity and a single-tenant concentration
              risk: a long-term Oracle lease is the revenue anchor, but loss or renegotiation of that relationship would
              be existential. Key-person dependency in Lochmiller and Cavness is an additional unmitigated risk.
            calloutType: risk
            claimRefs:
              - CO039
              - CO040
              - CO041
              - CO042
          - type: callout
            title: 'xAI Connection: A Near-Miss That Became a Foundational Contract'
            body: >
              The xAI-to-Oracle-to-Crusoe narrative is strategically important: Elon Musk's xAI was reportedly the first
              potential tenant for the Abilene site but withdrew to build Colossus independently. Musk subsequently
              hinted to Oracle that "another company shows promise" for hosting GB200 chip clusters, and The Information
              identified that company as Crusoe. While there is no formal Crusoe-xAI partnership, the episode
              illustrates how Crusoe's asset-backed, greenfield approach attracted hyperscaler-grade attention even
              before the Series D close.
            calloutType: insight
            claimRefs:
              - CO029
              - CO028
          - type: callout
            title: Verify Headcount, Revenue Trajectory, and Abilene Lease Terms
            body: >
              Three critical diligence gaps remain open: (1) Headcount and organizational scale are undisclosed; request
              directly or use LinkedIn as a proxy. (2) Revenue run-rate is estimated at approaching $1 billion but is
              unconfirmed; obtain audited financials or management accounts. (3) Full terms of the Oracle Abilene lease
              — duration, break clauses, pricing escalators, and step-down provisions if Oracle demand falls — are not
              in the public record and should be requested in any investment process.
            calloutType: recommendation
