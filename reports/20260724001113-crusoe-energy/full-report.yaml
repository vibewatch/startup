            title: Wyoming Campus Pause Is the Canary
            body: >
              Crusoe's pause of the 1.8 GW Wyoming Project Jade "at the request of our customer" — without disclosing
              the customer, the reason, or the timeline — is the most significant risk signal in Crusoe's 2026 public
              disclosures. Combined with Oracle/OpenAI's exit from later Abilene phases, it confirms that hyperscale
              anchor tenants treat large-format AI infrastructure commitments as provisional. Until investors can
              independently verify contracted utilisation rates and customer take-or-pay terms, all announced pipeline
              figures carry a material overstatement risk.
