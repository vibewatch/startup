  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Streams
        blocks:
          - type: paragraph
            body: >
              Crusoe's revenue model has undergone a deliberate structural transformation. In 2024, the company
              generated $276M in total revenue, split approximately 45% AI cloud ($124M, representing 460%
              year-over-year growth) and 55% Bitcoin and digital flare mining ($152M). Following the March 2025 sale of
              its mining operations—425+ modular data centers, 250+ MW, and approximately 135 employees—to NYDIG, Crusoe
              pivoted to a pure AI cloud and data center infrastructure revenue model. Crusoe disclosed 150% cloud ARR
              growth and 17x total contract value (TCV) growth in 2025, though it has not published the absolute
              denominator or base ARR figures. Analyst estimates for full-year 2025 revenue range between $500M and $1B,
              but these are unconfirmed estimates rather than company-disclosed figures.

              Today, Crusoe's revenue operates on three distinct mechanisms. First, Crusoe Cloud delivers GPU compute
              via on-demand hourly billing (H100 SXM at $4.29/GPU-hour) and reserved capacity subscriptions. Second,
              long-term hyperscaler capacity agreements—most notably the 900 MW Microsoft Abilene commitment (March
              2026) and Oracle/Stargate anchor relationships—provide large, contracted revenue tranches with multi-year
              visibility and take-or-pay economics. Third, the Crusoe Spark modular AI factory product creates a
              potential product-sale and managed-service revenue line; the Redwood Materials partnership expanding from
              4 to 24 Spark units demonstrates initial commercial traction but revenue quantum is undisclosed.

              Revenue quality has materially improved post-NYDIG: AI cloud revenue is recurring and subscription-based,
              while the old Bitcoin mining revenue was effectively commodity mining subject to halving cycles and
              hash-rate competition. However, heavy hyperscaler concentration in Microsoft and Oracle creates customer
              dependency risk that limits real-world pricing power even at list-price premium levels. The revenue mix
              between Crusoe Cloud spot/reserved GPU rental and hyperscaler capacity leases is not publicly disclosed,
              preventing precise revenue quality assessment.

              The Redwood Materials partnership (expanding from 4 to 24 Spark units) and a similar Spark deployment
              partnership structure suggest that the modular AI factory revenue line could become material, though the
              economic model—whether product sale, lease, or managed service—is company-claimed rather than
              independently verified.
