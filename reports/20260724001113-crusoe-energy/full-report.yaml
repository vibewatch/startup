  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk Overview and Ranking
        blocks:
          - type: paragraph
            body: >
              Crusoe has emerged from its flare-gas origins as one of the fastest-scaling AI infrastructure developers
              in North America. With that scale comes a qualitatively different risk profile: the company is no longer
              primarily exposed to volatile oil-field access and methane credits, but to the political economy of energy
              permitting, the concentration of demand in a small number of hyperscale customers, and the operational
              execution of a pipeline described by the CEO himself as potentially exceeding what committed parties can
              actually deliver. This chapter ranks seven material risk clusters from highest to lowest residual
              severity, examines each with evidence, and closes with monitorable kill criteria. The risk clusters are:
              (1) power-buildout execution and grid-regulatory risk; (2) customer concentration and hyperscale
              dependency; (3) GPU supply-chain and vendor concentration; (4) methane and environmental regulatory
              uncertainty; (5) reputational and ESG contradiction; (6) IP and legal legacy; and (7) competitive
              displacement. Each risk carries a transmission mechanism to Crusoe's revenue, margins, and financing
              access that investors must monitor.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
      - number: '7.2'
        title: Regulatory, Environmental and ESG Risks
        blocks:
          - type: paragraph
            body: >
              Crusoe's legal and regulatory risk is multi-layered. On the methane side, while Crusoe divested its
              Digital Flare Mitigation business in 2025, the regulatory landscape that originally defined its identity
              continues to shift. EPA's 2023/2024 OOOOb/OOOOc rules ban routine flaring at new oil-and-gas wells after
              May 7, 2026, with the Trump administration simultaneously proposing deregulatory rollbacks and ceasing
              enforcement on existing rules — creating policy whipsaw risk for any company whose competitive positioning
              depends on the flaring economy continuing to exist as a cost-reduction vector. The BLM Waste Prevention
              Rule's enforcement was delayed again in November 2025 for certain flare-measurement and LDAR provisions
              until December 2026, while proposed revisions to the rule published in June 2026 would roll back
              waste-minimization plan requirements. Five states (North Dakota, Texas, Montana, Wyoming, Utah) already
              operate under a preliminary injunction blocking BLM enforcement. For Crusoe specifically, the biggest
              regulatory exposure today is in power-delivery regulation: Texas Senate Bill 6, signed by Governor Abbott
              in June 2025 and immediately effective, requires data centers ≥75 MW to accept curtailment during firm
              load-shed events, mandates remote disconnect capability for new connections after December 31 2025, and
              shifts interconnection upgrade costs to large-load customers. ERCOT projects 138 GW of large loads on its
              grid by 2030 vs. 87 GW as of mid-2025 — the reliability risk is material during maintenance seasons. On
              the ESG side, Heatmap News documented that Crusoe plans 360 MW of on-site natural gas turbines at its
              Abilene Stargate campus (30% of 1.2 GW announced capacity), and acquired 4.5 GW of new natural gas
              capacity via a joint venture with Engine No. 1 and Chevron — moves that sit uneasily with the company's
              climate-tech self-description. EDF reported that ~$4.2 billion in natural gas was wasted in the first year
              after the Trump EPA stopped enforcing methane regulations, underscoring the contested nature of the
              regulatory environment that Crusoe's original model navigated.
