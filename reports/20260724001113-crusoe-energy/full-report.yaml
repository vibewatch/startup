      - number: '7.3'
        title: Operational, Technical and Supply-Chain Risks
        blocks:
          - type: paragraph
            body: >
              Crusoe's operational risk centers on three vectors: GPU availability, construction execution, and
              power-supply reliability. On GPU supply: the company committed $400 million to AMD MI355X accelerators
              (~13,000 units) in June 2025, diversifying away from pure NVIDIA dependence, but AMD's ROCm software stack
              remains less mature than CUDA, creating runtime risk for inference customers. NVIDIA's continued equity
              participation (series D and E investors) provides supply-chain alignment but also means NVIDIA's strategic
              priorities shape Crusoe's hardware roadmap. US semiconductor tariffs averaged 18.2% by mid-2025, directly
              inflating GPU procurement costs and compressing margins. On construction execution: the CEO's own public
              statement — "there have been a lot of commitments made in the space where I can't vouch for the reality
              that they will happen" — signals that the 45 GW+ pipeline carries substantial speculative overhang. The
              Wyoming 1.8 GW campus pause at a customer's request and the Oracle/OpenAI withdrawal from later Abilene
              phases are early evidence of this risk materialising. The company was forced to find replacement tenants
              (Microsoft stepped in at Abilene), which adds timeline and revenue-recognition uncertainty. Crusoe
              achieved 99.98% uptime on Crusoe Cloud and holds ISO 27001 + ISO 42001 certifications (February 2026),
              which mitigates cloud-platform operational risk. However, gigawatt-scale greenfield data centers operating
              on natural gas backup introduce a single point of energy-supply failure that cloud-only players do not
              carry.
            claimRefs:
              - CR016
