        - Pause; verify pipeline utilisation plans
      - - IPO window closure
        - CoreWeave trades <8x revenue for ≥6 months; comparable AI infra IPOs withdrawn
        - CoreWeave EV/revenue <8x sustained
        - Extend hold horizon; re-evaluate secondary exit options
