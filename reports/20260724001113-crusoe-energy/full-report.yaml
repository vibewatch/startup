        title: Comparable Valuation and Peer Set
        blocks:
          - type: paragraph
            body: >
              The most relevant public comparable is CoreWeave, which completed its IPO on March 26 2025 at a $23
              billion enterprise value. CoreWeave's S-1 filed with the SEC disclosed FY2024 revenue of $1.92 billion (up
              737% year-over-year) and $8.7 billion in committed revenue backlog. The IPO implied approximately 12x
              trailing revenue and 4-5x forward revenue. CoreWeave's market capitalisation subsequently fluctuated below
              the IPO level in secondary trading, reflecting market uncertainty about AI infrastructure multiples and
              the high degree of customer concentration (Microsoft ~60% of revenue at filing).

              Private comparables are more opaque. Lambda Labs, a competing inference-optimised cloud provider, was
              reported in analyst coverage at 4–7x ARR in secondary transactions. Scale AI, an adjacent AI
              infrastructure company focused on data annotation and model evaluation, was privately valued at ~$14B in
              early 2025 on approximately $1B ARR — roughly 14x ARR — but its business model differs materially.
              Anthropic, a primary model company with significant infrastructure, operated at a reported ~$18–25B with
              ~$3B ARR, but its vertical integration and moat character make it incomparable.

              For purposes of this analysis, Crusoe's primary peer group is infrastructure-as-a-service GPU cloud
              companies. The representative set includes CoreWeave (public), Lambda Labs (private), Voltage Park
              (private, smaller), and Nebius (formerly Yandex Cloud, public in Amsterdam). The table below presents this
