  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Definition and Boundaries
        blocks:
          - type: paragraph
            body: >
              Crusoe Energy operates at the intersection of three distinct but overlapping market segments. The first is
              neocloud GPU cloud: purpose-built GPU-accelerated infrastructure-as-a-service, offered on-demand, via
              reserved instances, or under long-term contracts, primarily targeting AI training and inference workloads.
              The second is AI factory development: the greenfield acquisition, construction, and long-term leasing of
              gigawatt-scale data center campuses to hyperscaler anchor tenants. The third, increasingly strategic, is
              energy procurement and generation for compute: capturing stranded gas, renewables, and alternative power
              sources to underpin AI data centers, a market evolving rapidly from a cost item into a multi-hundred-
              billion-dollar strategic investment category.

              The AI compute infrastructure market boundary includes GPU-accelerated IaaS, bare-metal HPC, AI factory
              co-location, and managed GPU cloud services. It excludes general-purpose cloud (CPU-only IaaS broadly), AI
              software and application layers (SaaS, MLOps tooling), and physical ASIC design. Adjacent markets include
              energy infrastructure for computing (natural gas, nuclear, solar for data centers) and CPU-only colocation
              which serves as a status-quo substitute for smaller or non-GPU AI workloads. Key substitutes also include
              hyperscaler spot instances, bare-metal HPC at universities, and on-premises GPU clusters, all of which
              carry significant cost, availability, or scalability limitations relative to dedicated neocloud offerings.

              GPU-as-a-Service (GPUaaS) is a distinct and rapidly growing subsegment. Data from Fortune Business
              Insights places the market at $3.23 billion in 2023 with a projected 36% compound annual growth rate,
              reflecting the shift from buying GPUs to renting GPU access. The neocloud category broadly — encompassing
              CoreWeave, Lambda Labs, Nebius, Crusoe, and smaller peers — generated roughly $23 billion in revenue in
              2025 according to Synergy Research Group.
