      - number: '7.6'
        title: Mitigations, Kill Criteria and Diligence Asks
        blocks:
          - type: paragraph
            body: >
              Crusoe has implemented several meaningful risk mitigations. On the regulatory front, its divestiture of
              the Digital Flare Mitigation business removes direct exposure to the BLM and EPA methane enforcement
              cycles, while the 100% renewable energy matching for Crusoe Cloud (via VPPAs, energy attribute
              certificates, and direct supply at Iceland/Norway) partially addresses ESG concerns. The ISO 27001 + 42001
              dual certification (one of the first AI cloud providers to hold both simultaneously) addresses
              information-security and responsible-AI governance risks. On customer concentration, the modular "Crusoe
              Spark" product line announced in March 2026 targets smaller AI operators, creating a barbell strategy
              across large campuses and modular units. GPU vendor diversification via the AMD MI355X commitment provides
              partial hedge against NVIDIA supply-chain events. Nevertheless, several risks remain either unmitigated or
              inadequately monitored. The carbon capture technology planned for Crusoe/Chevron/Engine No. 1 natural gas
              plants has no confirmed design partner, no deployed instance, and a 2027 power-delivery deadline — the
              timeline for resolving this is tight. Customer churn at anchor campuses (Wyoming pause, Abilene phase
              changes) has not been disclosed with sufficient transparency to enable monitoring. The IP landscape for
              oil-field computing has at least 13 additional Upstream Data patents held by its founder that were not
              resolved by the November 2025 settlement. Investors should insist on quarterly reporting of contracted
              utilization vs. commissioned capacity before treating any post-Series-E valuation as supportable.
