  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: 'Buyer Landscape: Startups, Enterprises, and Hyperscale Tenants'
        blocks:
          - type: paragraph
            body: >-
              Crusoe serves two structurally distinct customer segments with different deal sizes, procurement
              mechanisms, and risk profiles. The cloud tier serves AI-native startups and enterprise machine learning
              teams via GPU compute on-demand or through annual reservations, with self-service pricing, sub-90-second
              VM provisioning, and a SOC 2 Type II compliance posture. The data-center campus tier serves hyperscale
              operators through decade-long power purchase agreements and bespoke construction programs. These two
              segments are not simply different sizes of the same product — they require different sales motions, carry
              different churn dynamics, and expose Crusoe to fundamentally different concentration risks.

              Within the cloud segment, the dominant buyer persona is the AI startup with 10–200 engineers that needs
              high-density GPU access without the reservation friction of AWS, Azure, or GCP. Crusoe's competitive
              positioning rests on three pillars for this cohort: published transparent pricing (H100 at $3.90/hr, H200
              at $4.29/hr, AMD MI300X at $3.45/hr), a certified NVIDIA Cloud Partner stamp that signals GPU supply
              reliability, and a sustainability narrative that appeals to ESG-aligned investors and portfolio companies.
              The enterprise AI segment — including Databricks, Sony, and Together AI — accesses Crusoe Cloud through
              direct sales with custom SLAs and dedicated cluster options layered on top of the standard IaaS catalog.
              The launch of Managed Inference in April 2026 opened a new API-first consumption tier that extends
              addressability to token-economy buyers who cannot commit to reserved cluster contracts.

              The data-center campus segment is a real estate and power brokerage play: Crusoe locates sites, secures
              power capacity from grid or alternative sources, constructs campus facilities, and leases colocation
              capacity to hyperscalers that need deterministic multi-gigawatt delivery with compressed timelines.
              Oracle, Microsoft, and Meta represent the three largest disclosed or reported relationships in this tier.
              A fourth unnamed customer (widely reported to be Google) withdrew from the Wyoming campus project
              mid-development, exposing the conversion risk inherent in a pipeline-to-contract gap. xAI represents a
              hybrid customer — using Crusoe as both infrastructure construction partner and GPU cloud provider for Grok
              training and inference.

              Channel for cloud is predominantly direct self-service, supplemented by the NVIDIA NCP partner channel.
              Campus channel is entirely direct enterprise sales with custom negotiations. No reseller or marketplace
              distribution layer exists that would diversify pipeline risk. Geographic concentration is US-primary
              (Texas, Wyoming, Nevada, California) with European capacity in Iceland and Norway serving data-residency
              requirements.
            claimRefs: []
