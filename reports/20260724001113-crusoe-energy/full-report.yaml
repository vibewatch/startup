      - number: '6.2'
        title: 'Named Customer Proof: Production Wins Across Cloud and Campus'
        blocks:
          - type: paragraph
            body: >-
              Crusoe Cloud's most thoroughly documented customer win is Windsurf (formerly Codeium), the AI-powered
              coding assistant platform serving over 800,000 developers. According to Crusoe's published case study,
              Windsurf migrated its full GPU inference workload to Crusoe Cloud and achieved a 50% reduction in
              infrastructure costs compared to AWS and Azure, while sustaining 99.98% cluster uptime over a twelve-month
              production period. Windsurf's migration spanned both training and inference workloads and subsequently
              expanded to include Crusoe's Managed Inference API after that product launched in April 2026. This
              reference constitutes the strongest public evidence Crusoe has: it names the customer, quantifies the
              outcome, specifies the production duration, and comes from an official case study document.

              Decart AI and BosonAI are two additional named cloud customers. Decart runs real-time LLM inference for
              human simulation applications on Crusoe Cloud H100 clusters, citing sub-200ms response latency. BosonAI
              uses Crusoe Cloud for multilingual LLM pre-training runs, citing cost-effectiveness. Both are cited in
              Crusoe marketing materials corroborated by Cheddarflow analysis. Additional named cloud customers include
              Wonderful.ai, Yutori, Oaklet, Sony, Databricks, Together AI, Luma AI, and Codeium (now Windsurf) across
              training and inference.

              At the hyperscale campus tier, Oracle and OpenAI are the Phase 1 anchor tenants for the 1.2GW Abilene,
              Texas campus, which went live in May 2026. Oracle CEO Safra Catz publicly described Crusoe's twelve-month
              ground-break-to-operational timeline as "unmatched execution." Microsoft is the Phase 2 anchor tenant for
              the remaining 900MW, under construction as of June 2026. Meta has reportedly signed a 1.6GW agreement
              spanning Childress, Texas and Warrenton, Missouri, per Data Center Dynamics reporting, though neither
              party has officially confirmed this. xAI's Colossus 2 expansion is associated with Crusoe infrastructure
              through multiple outlets, positioning Crusoe as a construction and GPU-cloud partner for Grok model
              training.

              The SemiAnalysis ClusterMAX Gold rating provides third-party product validation across eight scored
              dimensions including networking, hardware quality, and enterprise support responsiveness. ClusterMAX
              reviewers noted sub-6-minute first support response and above-average GPU availability — consistent with
              Windsurf's reported 99.98% uptime. The same review identified material operational gaps in the
              Slurm-on-Kubernetes offering (missing developer tools, absent default storage class), introducing nuance
              into what is otherwise a strong endorsement.
