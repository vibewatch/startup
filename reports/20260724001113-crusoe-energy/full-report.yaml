      - number: '3.2'
        title: Direct Peer Neocloud Profiles
        blocks:
          - type: paragraph
            body: >
              CoreWeave is the most formidable direct competitor. Founded in 2017 and headquartered in Roseland, NJ,
              CoreWeave holds NVIDIA preferred partner status that grants priority allocation of H100, H200, and
              Blackwell (B200/GB200) GPUs. CoreWeave's March 2025 NASDAQ IPO established public-market comparables for
              the neocloud sector at approximately 5x revenue, and its customer base skews toward frontier AI labs and
              enterprise AI platform companies that directly overlap with Crusoe's top-tier buyer segment. CoreWeave's
              key structural limitation relative to Crusoe is that it does not own power generation or build its own
              campus-scale data centers; it relies on third-party colocation and power contracts, making it more exposed
              to power-availability constraints as the AI infrastructure market tightens.

              Lambda Labs (San Francisco, founded 2012) targets developer and research GPU cloud segments with on-demand
              H100 SXM5 and A100 instances, fast provisioning, no minimums, and developer-friendly tooling. Lambda does
              not vertically integrate into power or data center construction. Its go-to-market is self-serve and
              volume-pricing oriented, which makes it competitive for smaller workloads but limits its relevance for
              hyperscaler-commitment or dedicated campus contracts.

              Nebius AI (Amsterdam; NYSE: NBIS) was spun off from Yandex in June 2024 and provides GPU cloud
              infrastructure targeting AI companies requiring data sovereignty, particularly in EU markets. Nebius
              raised $700M in September 2024 from investors including NVIDIA. Nebius claims a 112% better TCO for
              inference versus AWS. Its primary competitive relevance to Crusoe is in the EU market; US overlap is
              limited. As a publicly listed company, Nebius provides some financial transparency that private neoclouds
              including Crusoe lack.

              Vast.ai operates a spot GPU marketplace model that enables buyers to access distributed GPU capacity from
              independent providers at spot prices, acting more as an aggregator than an infrastructure operator.
              Vast.ai's scalability to 20,000 GPUs on demand makes it a viable substitute for burst workloads but not
              for dedicated reserved capacity contracts.

              The neocloud sector is undergoing consolidation pressure: the wetheflywheel 2026 neocloud guide notes that
              providers differentiated only on GPU rental price are being squeezed, and long-term success depends on
              moving up the stack into software and orchestration layers.
