      - number: '3.3'
        title: Hyperscaler and Cloud Substitute Landscape
        blocks:
          - type: paragraph
            body: >
              The hyperscaler tier—AWS, Azure, GCP, and Oracle OCI—is the incumbent defender in the GPU cloud market and
              represents the default procurement path for enterprise buyers. AWS P5 instances offer 8×H100 SXM
              configurations with 3,200 Gbps EFA networking for distributed training, and P5 is also offered through AWS
              SageMaker HyperPod for managed ML cluster deployments. Azure Machine Learning compute clusters support
              NDv5 GPU VMs backed by H100 for large-scale distributed training. Google Cloud provides H100 and A100 GPU
              instances with committed use discount programs. Oracle OCI SuperCluster delivers 400 H100 GPUs in a single
              bare-metal cluster with RDMA networking.

              The competitive advantage hyperscalers hold is integration: enterprises already running workloads on AWS,
              Azure, or GCP benefit from storage co-location, IAM, networking, managed services, and compliance
              frameworks that a standalone neocloud cannot replicate without significant investment. This integration
              moat is the primary barrier Crusoe must overcome to win enterprise displacement deals.

              However, hyperscalers are capacity-constrained on GPU supply: Crusoe's Microsoft Abilene 900 MW deal and
              Oracle Stargate relationship exist precisely because hyperscalers cannot build infrastructure fast enough
              to meet their own commitments. This supply gap is Crusoe's primary revenue opportunity. Crusoe is
              providing capacity TO hyperscalers, not just competing against them for end-users. This dual
              role—competitor AND capacity partner—is unusual in the neocloud sector and creates a differentiated
              position.

              Oracle OCI's SuperCluster product is specifically relevant because Oracle is one of Crusoe's anchor
              Stargate customers; Crusoe built and operates the Abilene Phase 1 campus under a 15-year capacity
              agreement with Oracle and Microsoft. This means Crusoe competes with Oracle OCI for enterprise GPU buyers
              while simultaneously supplying Oracle with raw capacity.

              Status-quo internal build remains a significant competitive force. Large AI labs (Meta, xAI) and
              well-resourced enterprises are building proprietary GPU clusters either on-premises or at colocation
              facilities, bypassing both hyperscalers and neoclouds. The Bain Capital Ventures essay on Crusoe's
              founding thesis explicitly identified the "colocation at power source" model as the wedge against
              traditional data center builds.
