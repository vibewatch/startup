      - number: '6.3'
        title: 'Adoption Trajectory: ARR Growth, Contract Expansion, and Revenue Ramp'
        blocks:
          - type: paragraph
            body: >-
              Crusoe Cloud's ARR grew 150% year-over-year from 2024 to 2025, while average contract value expanded 17×
              over the same period — a combination that signals both volume expansion and deal-size maturation. The 17×
              contract value growth reflects a shift from small-startup monthly GPU reservations to enterprise-scale
              annual cluster commitments; a single enterprise deal can represent more ARR than dozens of startup
              contracts. New customer growth ran at 70% year-over-year in 2025, indicating that top-line ARR growth is
              not purely from existing customer expansion but has a substantial new-logo component.

              Sacra Research projected Crusoe's total revenue at approximately $2 billion for 2026, compared to $276
              million in 2024. This 7× compound growth is driven almost entirely by the data-center campus segment —
              specifically the Abilene campus Phase 1 and Phase 2 tenant agreements. The cloud platform's standalone ARR
              was estimated in the $150–200 million range as of early 2026 by Cheddarflow analysis. This trajectory is
              notable but must be contextualized: Crusoe's total revenue still includes legacy Digital Flare Mitigation
              (DFM) energy revenue and campus construction fees, with recurring cloud ARR representing a significant but
              minority share.

              The launch of Managed Inference in April 2026 opens a token-economy customer tier: API-first buyers who
              need inference capacity without committing to reserved GPU clusters. This tier addresses a market
              previously served by hyperscaler inference APIs (AWS Bedrock, Azure OpenAI) and inference-specialist
              startups. MemoryAlloy's 9.9× TTFT advantage creates a performance hook for this cohort, assuming
              benchmarks hold under production load diversity. The overall growth picture — 150% cloud ARR growth, 17×
              contract value, 70% new-logo growth — is strong for an infrastructure business and reflects genuine market
              demand. The key diligence question is whether this trajectory is sustainable or front-loaded by two or
              three hyperscale commitments that will not repeat.
