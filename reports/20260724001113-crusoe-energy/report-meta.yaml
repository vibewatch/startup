  topStrengths:
    - Vertical integration across power sourcing, campus construction, and GPU cloud creates a differentiated energy-first moat.
    - Financing depth, NVIDIA alignment, and marquee campus/customer wins give Crusoe credibility beyond a typical neo-cloud startup.
    - Product breadth now spans hyperscale campuses, modular Spark deployments, and cloud/inference services with validated customer proof points.
  topRisks:
    - Revenue concentration in a small number of hyperscale anchor customers creates binary project and refinancing risk.
    - Public financial opacity around gross margin, burn, utilization, and debt covenants makes the $10B+ mark hard to underwrite.
    - ESG positioning is vulnerable to scrutiny because major growth projects still rely materially on natural-gas-backed infrastructure.
  unresolvedGaps:
    - Absolute cloud ARR, gross margin, burn rate, and project-finance covenant terms.
    - Customer concentration by revenue, renewal terms, and cancellation rights for Microsoft, Oracle/OpenAI, Meta, and xAI-linked capacity.
    - Pipeline conversion from announced gigawatt projects into binding contracted and commissioned capacity.
