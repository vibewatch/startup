companyProfile:
  summary: >
    Crusoe Energy Systems, now branded as Crusoe, began as a methane-abatement startup that used modular data centers
    to monetize stranded flare gas and has since pivoted into one of the most ambitious private AI infrastructure builders.
    The company now combines gigawatt-scale campus development, modular Spark AI factories, and Crusoe Cloud GPU services,
    backed by large financing rounds and strategic NVIDIA alignment, but with limited public financial transparency.
  foundedDate: "2018-01-01"
  founders:
    - name: Chase Lochmiller
      role: Co-founder and CEO
      background: MIT math/physics and Stanford computer-science graduate; former quantitative trader and Polychain Capital GP.
      claimRefs: [CO002, CO010, CO011]
    - name: Cully Cavness
      role: Co-founder, President and COO
      background: Geology and Oxford MBA background with oil-and-gas investment-banking experience that shaped Crusoe's energy strategy.
      claimRefs: [CO002, CO012, CO013]
  foundingLocation: Denver, Colorado, USA
  headquarters: Denver, Colorado, USA
  productSummary: >
    Crusoe sells AI infrastructure through three linked surfaces: long-term hyperscale campus capacity, Crusoe Cloud GPU
    compute and managed inference, and Crusoe Spark modular AI factory units for 10–100 MW deployments.
  customerFocus: Hyperscalers, frontier-model labs, AI-native software companies, enterprise AI teams, and sovereign AI programs.
  businessModel: >
    Mix of long-term campus leases or capacity agreements, per-GPU-hour and reserved cloud compute pricing, managed inference usage,
    and potential product/managed-service revenue from Spark deployments.
  stage: Series E private company
  fundingStatus: >
    Raised a $600M Series D at a $2.8B valuation in December 2024 and a $1.375B Series E at a $10B+ valuation in October 2025,
    with additional project-finance and credit facilities supporting data-center expansion.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO003, CO006, CO014, CO018, CO021, CO028, CO034]
summary:
  headline: Crusoe has built a differentiated power-first AI infrastructure platform, but the post-Series-E valuation already assumes successful hyperscale execution that public evidence does not yet fully underwrite.
