  - id: adoption-constraints-and-competitive-risk
    title: Adoption Constraints and Competitive Risk
    body: >
      The structural constraint on supply expansion is power. New data center projects entering
      grid interconnection queues in 2025–2026 face typical waiting times of 4 to 10 years in
      major U.S. markets. Northern Virginia — the largest U.S. data center market — faces such
      severe congestion that utilities have warned of regional power shortages, forcing new projects
      to secondary markets in secondary grid regions. The World Economic Forum (May 2026) identified
      grid connectivity as "the strategic bottleneck for AI," noting that AI campus developers who
      combine phased connections with on-site storage and load controls can begin operations before
      grid reinforcements complete.

      Capital intensity creates a high-barrier competitive moat. Gigawatt-scale AI data centers
      require over $1 billion per campus in construction and infrastructure investment, limiting
      the effective competitive set to well-capitalized players. Behind-the-meter power solutions
      (fuel cells from Bloom Energy, solar-plus-storage, next-generation nuclear microreactors)
      are becoming standard for operators who cannot wait for grid interconnection, but these also
      require substantial upfront capital.

      Customer switching costs are a moderate but real barrier to market entry and churn. Migrating
      production AI workloads between GPU cloud providers involves data migration, application
      refactoring, API changes, and compliance re-certification. This creates lock-in especially
      for enterprise and sovereign buyers who have invested in integration. However, AI-native
      startups are typically more price-sensitive and willing to switch.

      NVIDIA's dominance in AI accelerators creates a concentration risk for all neocloud players.
      NVIDIA commands approximately 95% of the market for AI training accelerators; alternatives
      such as Cerebras (wafer-scale engine), Groq (recently absorbed by NVIDIA in a team acquisition),
      and AMD MI-series chips exist but have limited production adoption for large-scale training.
      Reliability concerns present a structural risk specific to the neocloud category: enterprise
      buyers expect hyperscaler-grade SLA commitments (99.99%+) that early neoclouds have struggled
      to match in practice, as Crusoe's own 45-hour March 2025 outage and May 2026 networking incident
      illustrate.
