callouts:
  - calloutType: insight
    title: Power Is the Market's Defining Moat — Not Capital or GPUs
    body: >
      The neocloud market has undergone a structural shift: securing power access (not GPU hardware
      or venture capital) has become the primary determinant of long-term competitive position.
      Grid interconnection delays of 4–10 years mean that any operator who locked up power in
      2023–2024 owns 2026 capacity and beyond. Crusoe's energy-first heritage — stranded gas
      capture, renewable site selection, behind-the-meter generation — was originally a climate
      strategy but has become a durable structural moat precisely when it matters most. We The
      Flywheel (2026) explicitly identifies this as Crusoe's highest-scoring differentiator
      relative to CoreWeave and other peers.
    claimRefs:
      - CM030
      - CM037
      - CM038
      - CM044

  - calloutType: risk
    title: Divergent Market Sizing Estimates and the SAM Ambiguity Problem
    body: >
      The AI infrastructure market is defined differently by every analyst: IDC's $487 billion (2026)
      and Gartner's $37.5 billion (2026, AI-optimized IaaS) measure overlapping but non-identical
      populations. Investors should treat all headline TAM figures as directional orientation, not
      precision inputs. Crusoe's specific SAM — the share of the neocloud and hyperscale factory
      market it can credibly win — is not publicly disclosed and cannot be derived from published
      data alone. The evidence gap between $487 billion (IDC's AI infra total) and $23 billion
      (neocloud segment) is itself a diligence question that requires internal revenue and pipeline
      data to bridge.
    claimRefs:
      - CM013
      - CM016

  - calloutType: insight
    title: 2–6x Cost Arbitrage Creates Durable TAM Expansion Opportunity
    body: >
      The GPU pricing differential between neoclouds and hyperscalers is large, quantified, and
      persistent. On-demand H100s cost $2.49–$4.25/hr on neoclouds versus $6.88/hr on AWS and
      $12.29/hr on Azure — a 2–5x gap that widens further on B200 hardware ($4.99 on Lambda vs.
      $14.24 on AWS). This differential makes economic cases for AI workload migration off
      hyperscalers compelling at scale. Every enterprise or lab that shifts AI training or
      inference off AWS/Azure at price is a potential Crusoe Cloud or CoreWeave customer. At
      $50,000–$500,000/month per production team, the cumulative TAM impact of cost-driven
      migration is significant.
