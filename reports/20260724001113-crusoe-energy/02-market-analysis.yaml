  - id: growth-drivers
    title: Growth Drivers
    body: >
      The primary demand catalyst is the transition from batch AI model training to continuous
      agentic AI inference. By late 2025, inference workloads surpassed training workloads in
      total GPU compute consumed, reflecting the rollout of AI agents in enterprise software, coding
      assistants, and consumer applications. Agentic AI systems require orders-of-magnitude more
      inference compute per task than single-turn models, creating durable exponential demand.
      NVIDIA CEO Jensen Huang noted in fiscal year 2026 Q4 earnings that "useful AI agents have
      just begun to roll out" and are "token hungry" at scale.

      Enterprise AI adoption reached a structural inflection in 2025–2026, moving from controlled
      pilots to mission-critical production workloads. The cost arbitrage of neoclouds versus
      hyperscalers provides a quantifiable driver: on-demand H100 GPUs cost $2.49 to $4.25 per
      GPU-hour on leading neoclouds (Lambda Labs, CoreWeave) versus $6.88 per GPU-hour on AWS
      and $12.29 per GPU-hour on Azure. Next-generation B200 GPUs show an even wider gap: AWS at
      approximately $14.24 per GPU-hour versus Lambda Labs at $4.99 to $5.29. The 2–6x cost
      differential is quantifiable and documented in Q1 2026 public pricing data.

      Power availability has emerged as the single most consequential driver for competitive
      positioning, effectively displacing GPU hardware availability as the primary constraint in
      2025–2026. Operators who locked up power capacity in 2023–2024 have a structural multi-year
      advantage over new entrants facing 4–10 year grid interconnection queues. NVIDIA validated
      demand fundamentals with $57 billion in Q3 2025 revenue (October 2025), a 62% year-over-year
      increase, corroborated by Amazon's $34.2 billion, Microsoft's $35 billion, and Alphabet's
      $24 billion in Q3 2025 capital expenditures — all primarily for AI infrastructure. Sovereign
      AI policy mandates at the national level are also expanding the total addressable market,
      creating new pockets of demand outside the U.S. market.
