  - id: buyer-segmentation
    title: Buyer Segmentation
    body: >
      The AI cloud buyer landscape segments into five lanes, each with distinct budget ownership,
      procurement dynamics, and SLA expectations. Hyperscaler anchor tenants — Oracle, Microsoft,
      Amazon, and Google — represent the highest-value accounts, signing multi-billion capacity
      commitments with neoclouds, often reserving capacity years in advance. CoreWeave's contracted
      backlog of $66 to $99.4 billion as of mid-2026 exemplifies this dynamic, driven primarily by
      Microsoft and Meta anchor contracts. Crusoe's Oracle-Abilene deal mirrors this pattern: a long-
      term lease anchoring the AI factory business with hyperscaler-quality counterparty credit.

      AI foundation model labs and frontier AI companies (OpenAI, Anthropic, xAI, Mistral) are the
      second tier: companies whose entire value proposition is compute-intensive. These buyers consume
      hundreds of millions to billions of dollars per year in GPU compute for training and inference,
      typically under reserved cluster arrangements. The xAI near-miss at Abilene and Crusoe's indirect
      access to OpenAI demand via the Oracle Stargate deal illustrate Crusoe's proximity to this tier.

      AI-native startups represent volume buyers with smaller spend: $5,000 to $500,000 per month
      per customer, though mid-sized production teams average $50,000 to $500,000 monthly. This
      segment drives Crusoe Cloud utilization and on-demand GPU product revenue. Enterprise IT buyers
      adopting GenAI for business applications are an emerging and strategically important cohort:
      as GenAI moves from pilot to production in 2025–2026, enterprises require compliance certifications
      (SOC 2, HIPAA, FedRAMP) that currently favor hyperscalers. Crusoe's ISO 27001 and ISO 42001
      certifications are steps toward enterprise readiness, but SLA history remains a concern.

      Sovereign AI programs — national governments building domestic AI infrastructure with data
      residency requirements — represent a fast-emerging buyer segment. Nebius's $46 billion in
      European capacity commitments from Microsoft and Meta under GDPR terms illustrates the scale.
      Crusoe's Edge Zones product, launched March 2026, targets exactly this use case with modular,
      factory-built clusters for sovereign and low-latency deployments.
