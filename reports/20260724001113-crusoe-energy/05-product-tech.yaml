  - id: trust-compliance
    title: Trust, Compliance, Reliability, and Known Gaps
    body: >-
      Crusoe Cloud achieved SOC 2 Type I attestation in December 2023 and completed SOC 2 Type II in July 2024,
      with the full report accessible through Crusoe's Trust Center. The platform complies with GDPR, and the
      99.98% cluster uptime SLA is backed by automatic node swapping via AutoClusters. Status page history as
      of June 2026 shows generally strong uptime, with notable exceptions: the ICAT region experienced a
      two-hour load balancer outage on June 17, 2026. SemiAnalysis's ClusterMAX review identified meaningful
      usability gaps in the Slurm-on-Kubernetes offering—login pods lacked vim, nano, git, and sudo; CMK
      clusters did not provide a default ReadWriteMany StorageClass; and NVML driver mismatch errors were
      reproducible under containerized workloads. At Crusoe's Iceland facility, 20,000 fiber ends required
      physical cleaning due to debris (attributed to volcanic ash) that caused widespread link flaps and
      random filesystem unmounts—a geographically specific reliability risk that Crusoe reportedly resolved.
      SemiAnalysis noted Crusoe's Gold rating is at risk from high engineering turnover in the cloud
      division. CCPA compliance status is not publicly confirmed. No external performance benchmarks for
      MemoryAlloy versus AWS Inferentia, Azure AI, or GCP TPU exist in the public record. Power usage
      effectiveness (PUE) is not disclosed for any Crusoe facility.
    claimRefs:
      - CE026
