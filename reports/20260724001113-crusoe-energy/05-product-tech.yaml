company:
  name: Crusoe Energy Systems
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Crusoe has evolved from a flare-gas compute pioneer into a vertically integrated AI infrastructure company
    with three distinct product surfaces: Crusoe Cloud (GPU IaaS plus managed inference), Crusoe Spark
    (prefabricated modular 1 MW AI factories), and hyperscale colocation campuses. The platform's proprietary
    MemoryAlloy inference engine delivers benchmarked 9.9× faster TTFT vs. vLLM, and NVIDIA partnership depth
    spans early hardware adoption of Vera CPU and Rubin GPU roadmap items. Reliability gaps persist—SemiAnalysis
    cited Slurm-on-Kubernetes usability deficits and volcanic-ash fiber contamination at the Iceland facility—
    and single-vendor GPU supply dependency on NVIDIA remains the primary technology risk.

sections:
  - id: cloud-platform
    title: Crusoe Cloud — GPU IaaS and Managed Services
    body: >-
      Crusoe Cloud is a full-stack, NVIDIA-native AI cloud platform that positions itself as an alternative
      to hyperscaler GPU clouds with an energy-first cost structure. The product offers GPU-accelerated virtual
      machines across multiple SKUs—NVIDIA H100 SXM (80 GB) at $3.90/hr on-demand, H200 SXM (141 GB) at
      $4.29/hr, AMD MI300X (192 GB) at $3.45/hr, B200 (180 GB), L40S (48 GB), and A100 (80 GB)—in US and
      European regions. VM configurations scale from single-GPU to 8-GPU nodes with RDMA InfiniBand networking
      at up to 3200 Gbps and topology-aware cluster placement. Above the IaaS layer, Crusoe offers Managed
      Kubernetes (CMK), Managed Slurm, and AutoClusters, an automated fault-tolerant training orchestration
      service that performs proactive node health checks and swaps failed nodes without operator intervention.
      The platform provides VPC networking with logically isolated environments, block, object, and shared
      storage, plus a Crusoe Command Center observability console. Developer surfaces include a REST API at
      api.cloud.crusoe.ai/v1, CLI, Terraform provider, and Go, Python, and TypeScript SDKs. For more than
      twelve consecutive months Crusoe Cloud has sustained a 100% CSAT score, and the platform guarantees
      99.98% cluster uptime backed by 24/7 enterprise support with a mean first reply time under six minutes.
      Reservations at three-to-six month terms offer 30–50% discounts on on-demand rates, enabling enterprise
      budget predictability for sustained training runs.
