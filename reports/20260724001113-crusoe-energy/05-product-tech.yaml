  - id: inference-technology
    title: Crusoe Managed Inference and MemoryAlloy Engine
    body: >-
      Crusoe Managed Inference, launched in early 2026, is the company's highest-differentiation product
      and is powered by a proprietary inference engine built on MemoryAlloy technology. MemoryAlloy is a
      cluster-native memory fabric that implements a cluster-wide key-value (KV) cache enabling any GPU node
      to fetch prefix caches from both local and remote nodes instantly, eliminating duplicate prefill
      computation across concurrent sessions. Crusoe benchmarks MemoryAlloy at 9.9× faster time-to-first-token
      and 5× higher token throughput versus vLLM for Llama 3.3 70B, and the engine supports persistent sessions,
      contextual continuity, and seamless horizontal scaling across an entire cluster. The Crusoe Intelligence
      Foundry is the user-facing hub through which developers access Managed Inference endpoints, generate API
      keys in minutes, and experiment with a curated model library: Llama 3.3 70B Instruct, DeepSeek V3 0324,
      DeepSeek-R1 0528, Qwen3 235B, Kimi-K2, Gemma 3 12B, GPT-OSS-120B, NVIDIA Nemotron 3 Super, and NVIDIA
      Nemotron 3 VoiceChat. Both Nemotron models became available on the Foundry via Crusoe's early-adopter
      relationship with NVIDIA announced at GTC 2026 in March. Crusoe also contributed its high-performance
      Rust BPE tokenizer to the NVIDIA Dynamo open-source inference-serving framework, achieving approximately
      9× speedup over HuggingFace tokenizers and up to 31× on long prompts—a move that deepens Crusoe's
      credibility in the practitioner community even in the absence of traditional OSS project metrics.
      MemoryAlloy's internal architecture and training methodology remain proprietary and are not independently
      peer-reviewed, a gap that limits external validation of the performance claims.
    claimRefs:
      - CE008
