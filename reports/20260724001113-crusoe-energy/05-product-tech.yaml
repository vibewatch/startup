  - id: physical-infrastructure
    title: Physical Infrastructure — Crusoe Spark and Hyperscale Campuses
    body: >-
      Crusoe's physical infrastructure arm spans two product forms: Crusoe Spark, a prefabricated modular
      AI factory unit, and large-scale hyperscale colocation campuses. Crusoe Spark is a turnkey, container-like
      modular data center delivering approximately 1 MW of high-density compute with integrated power
      distribution, liquid or air cooling, fire suppression, and GPU racks built for the latest accelerators.
      Units are sourced from Crusoe's 352,000-square-foot Spark Factory in Brighton, Colorado—a greater-than
      $200 million manufacturing investment capable of producing up to 100 modules annually—with factory-built
      units targeted for first production deliveries in Q3 2026. Crusoe Spark can be energized from diverse
      sources: the first public deployment at Redwood Materials' Tahoe Campus, Nevada used second-life EV
      battery microgrids and solar, demonstrating 99.2% uptime. An Energy Vault partnership enables Spark
      deployment at a 25 MW scale in Snyder, Texas from 2026. On the hyperscale side, the flagship 1.2 GW
      Abilene, Texas campus on Lancium Clean Campus land is the Stargate initiative's primary site; its first
      two buildings (980,000 sq ft, 200 MW+) are live serving Oracle Cloud Infrastructure for OpenAI's compute
      needs. A second 900 MW Abilene campus for Microsoft broke ground in 2026. Crusoe co-develops power and
      construction from the outset, manufacturing long-lead electrical components at facilities in Colorado,
      Oklahoma, and Louisiana—a vertical integration depth that compresses deployment timelines relative to
      conventional sequential development. As of June 2026, Crusoe has contracted 4.9 GW of AI infrastructure
      with a pipeline exceeding 40 GW.
