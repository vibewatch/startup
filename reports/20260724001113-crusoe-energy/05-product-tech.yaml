figures:
  - id: FE001
    title: Crusoe Platform Architecture Stack
    type: stack
    layout: wide
    summary: >-
      Six-layer architecture from physical AI factory through cloud IaaS and managed inference to the
      developer surface, showing Crusoe's vertical integration from energy sourcing to model serving.
    data:
      layers:
        - label: Developer Surface
          detail: >-
            GitHub org (crusoecloud): Terraform provider, CLI, Go/Python/TypeScript SDKs, Slurm configs,
            Helm charts, fastokens Rust BPE tokenizer; six live AI demos; NVIDIA Dynamo tokenizer contribution.
        - label: AI Services
          detail: >-
            Crusoe Intelligence Foundry (managed inference hub); Crusoe Managed Inference powered by
            MemoryAlloy cluster-wide KV cache; 9.9× TTFT vs. vLLM; open-source and exclusive model library
            (Llama, DeepSeek, Qwen3, Kimi, Nemotron 3 Super, Nemotron 3 VoiceChat).
        - label: Platform Services
          detail: >-
            Crusoe Cloud IaaS: GPU VMs (H100/H200/B200/MI300X/A100/L40S), Managed Kubernetes (CMK),
            Managed Slurm, AutoClusters, VPC, RDMA InfiniBand (3200 Gbps), block/object/shared storage,
            Command Center observability; REST API v1, CLI, Terraform.
        - label: Compute and Hardware
          detail: >-
            NVIDIA H100, H200, B200 (current GA); Rubin GPU + Vera CPU (early adopter, late 2026/2027);
            AMD MI300X; GB200 NVL72 racks; InfiniBand fabric; cloud-hypervisor VM layer.
        - label: Physical AI Factory
          detail: >-
            Crusoe Spark modular units (1 MW, turnkey, ≤3 months delivery); Brighton CO factory (352 K sq ft,
            $200 M+, Q3 2026 production); hyperscale campuses: Abilene 1.2 GW (Oracle/OpenAI live),
            Abilene 2 900 MW (Microsoft, in construction), Childress TX, Warrenton MO, 5th Missouri site.
        - label: Energy and Power Infrastructure
          detail: >-
            Flare gas via Digital Flare Mitigation (120+ DFM units); renewable grid tie-in; GE Vernova
            ~1 GW gas turbines; PROENERGY 650 MW; Redwood Materials second-life EV battery microgrids (63 MWh
            at Tahoe site, GWh pipeline); Form Energy 12 GWh iron-air (2027); Energy Vault multi-day storage.
    approximationNotes: >-
      Layer ordering reflects operational dependency (bottom-up). Product maturity varies within layers
      (Spark factory units targeted Q3 2026; Vera/Rubin deployment 2027). Energy mix differs by site.
