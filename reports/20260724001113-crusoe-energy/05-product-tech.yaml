  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: memoryalloy architecture
      missingEvidence: >-
        Technical architecture documentation, white paper, or independent peer-reviewed benchmark for
        MemoryAlloy cluster-wide KV cache, including methodology, hardware configurations, and reproducibility.
      whyItMatters: >-
        All MemoryAlloy performance claims (9.9× TTFT, 5× throughput) are self-reported without external
        replication, making it impossible to validate whether the benchmark is generalizable or cherry-picked.
      diligencePath: >-
        Request a technical deep-dive and independent third-party benchmark (e.g., MLPerf Inference)
        covering MemoryAlloy vs. competitive inference engines at multiple model sizes.
      relatedQuestionRefs:
        - QE005

    - type: missing-source
      severity: material
      topic: pue and energy efficiency
      missingEvidence: >-
        Power Usage Effectiveness (PUE) metrics for Crusoe's hyperscale campuses (Abilene) and Spark
        modular units, compared against hyperscaler industry benchmarks (Google: 1.10, Meta: 1.09).
      whyItMatters: >-
        Crusoe's value proposition is partly environmental; without PUE data, sustainability claims
        about efficiency and cost savings cannot be quantitatively validated.
      diligencePath: >-
        Request PUE data from Crusoe's 2025 Impact Report supplement or directly from engineering team;
        compare to ASHRAE A4/Open19 standards for edge and hyperscale configurations.
      relatedQuestionRefs:
        - QE025

    - type: private-evidence-only
      severity: minor
      topic: crusoe spark factory throughput
      missingEvidence: >-
        Confirmed Q3 2026 factory production schedule, actual units produced per month, and per-unit
        economics for Crusoe Spark modular data centers.
      whyItMatters: >-
        Modular data center scale-up is a new revenue vector; if production ramp is slower than announced,
        Spark's contribution to Crusoe's 40 GW pipeline timeline would shift materially.
      diligencePath: >-
        Ask for factory production rate, backlog of Spark orders, and delivered unit economics from
        the Q3 2026 Brighton factory commissioning milestone.
      relatedQuestionRefs:
        - QE014

    - type: missing-source
      severity: minor
      topic: hyperscaler energy sourcing comparison
      missingEvidence: >-
        Independent PUE and cost-per-MWh comparison between Crusoe's alternative energy model (flare gas,
        renewables, iron-air batteries) and traditional hyperscaler utility-grid power procurement,
        covering Abilene campus and Spark modular unit configurations.
      whyItMatters: >-
        Without a quantified energy-cost and PUE comparison to hyperscalers (Google 1.10, Meta 1.09),
        Crusoe's sustainability and cost-savings narrative rests on unvalidated self-reported framing.
      diligencePath: >-
        Request Crusoe's 2025 Impact Report supplement with campus-level PUE data; cross-reference
        against EPA Green Power Partnership metrics and IEA data center benchmarks for equivalent loads.
      relatedQuestionRefs:
        - QE015

    - type: missing-source
      severity: minor
      topic: compliance certification coverage beyond soc2 gdpr
      missingEvidence: >-
        Documentation or regulatory filings confirming any compliance frameworks Crusoe Cloud has
        achieved or is actively pursuing beyond SOC 2 Type II and GDPR — specifically HIPAA, FedRAMP,
        CCPA, ISO 27001, PCI DSS, and ITAR suitability for defense-adjacent AI workloads.
      whyItMatters: >-
        Enterprise and public-sector buyers increasingly require compliance certifications as procurement
        prerequisites; gaps in HIPAA or FedRAMP readiness may exclude Crusoe from regulated-industry
        revenue and government AI contracts.
      diligencePath: >-
        Request a compliance roadmap from Crusoe's trust team; review trust.crusoe.ai for sub-processor
        list, DPA templates, and any forthcoming FedRAMP or ISO 27001 audit plans.
      relatedQuestionRefs:
        - QE027

