  - id: FE002
    title: Customer Workflow and Cloud Operating Flow
    type: flow
    layout: standard
    summary: >-
      End-to-end path from compute need identification through provisioning, orchestration, workload execution,
      monitoring, and expansion—illustrating how AI teams experience the Crusoe Cloud product surface.
    data:
      nodes:
        - id: need
          label: AI Team Identifies Compute Need
          detail: >-
            Training, fine-tuning, or inference requirement identified; hyperscaler pricing exceeds budget
            or availability; or edge/on-premises compute required for data-locality constraints.
        - id: provision
          label: Provision GPU Resource
          detail: >-
            Customer selects GPU SKU (H100/H200/B200/MI300X) via Crusoe Cloud Console, CLI, or REST API;
            VM or cluster boots in under 90 seconds; on-demand or reserved pricing selected.
        - id: orchestrate
          label: Configure Orchestration Layer
          detail: >-
            Customer deploys Managed Kubernetes (CMK), Managed Slurm, or AutoClusters; configures
            InfiniBand RDMA fabric and VPC networking; sets up block/object storage.
        - id: run
          label: Execute AI Workload
          detail: >-
            Training job runs across multi-node cluster with automatic fault tolerance via AutoClusters;
            inference traffic routed through Managed Inference with MemoryAlloy KV cache for TTFT optimization.
        - id: monitor
          label: Monitor and Optimize
          detail: >-
            Crusoe Command Center provides real-time observability; 24/7 enterprise support with <6-minute
            first reply time; 100% CSAT score maintained for 12+ months.
        - id: scale
          label: Scale or Expand
          detail: >-
            Additional GPUs provisioned; reserved capacity negotiated; for persistent on-prem needs,
            Crusoe Spark unit delivered within three months of order.
    approximationNotes: Flow represents typical cloud customer journey; hyperscale colocation customers follow a separate campus build-to-suit process.
    claimRefs:
      - CE003
      - CE007
      - CE035
      - CE037

