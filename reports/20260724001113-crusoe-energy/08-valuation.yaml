callouts:
  - calloutType: risk
    title: "All Revenue Figures Are Analyst Estimates"
    body: >
      Crusoe has not published audited financial statements. Revenue figures of $276M (FY2024) and $998M
      (FY2025) cited in this chapter are Sacra Research and Cheddar Flow analyst estimates derived from
      public signals, not management guidance or audited accounts. Investors must verify actual revenue in
      due diligence. Valuation multiples and MOIC calculations in this chapter are directional scenarios,
      not forecasts, and may materially differ from actuals.
