  - calloutType: assumption
    title: "Assumption: $10B Series E Mark Is Current and Undiluted"
    body: >
      This chapter treats the October 2025 $10B+ post-money as the current primary-market entry mark for
      new investors. It assumes no material liquidation preferences, participating preferred terms, or
      anti-dilution provisions that would create a step down in effective entry price. If the Series E has
      significant preference overhang (e.g., 2x liquidation preference), the effective entry for common-
      equivalent holders would be lower, improving downside protection but reducing upside at lower exit
      values. Diligence must confirm the capitalization table and preference terms.
    claimRefs: [CV002, CV003, CV037]

