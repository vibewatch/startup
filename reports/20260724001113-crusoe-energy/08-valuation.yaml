  evidenceGaps:
    - id: EGV001
      topic: "Crusoe FY2025 audited or confirmed revenue"
      description: >
        No audited financial statements or management-confirmed revenue for Crusoe's FY2025 have been
        located in public sources. The $276M FY2024 and $998M FY2025 projections are third-party analyst
        estimates from Sacra Research and Cheddar Flow, derived from public signals. Investors cannot
        verify the valuation multiple or scenario models without audited revenue confirmation.
      relatedQuestionRefs: [QV026]

    - id: EGV002
      topic: "Secondary-market pricing for Crusoe equity at current mark"
      description: >
        No observable secondary-market transaction pricing for Crusoe equity was identified in sources
        reviewed. Platforms like Forge Global, EquityZen, or Hiive may carry Crusoe shares but disclosed
        transaction prices are not publicly available. Any published secondary marks would provide a
        market-tested check on the $10B+ primary-market post-money.
      relatedQuestionRefs: [QV027]

    - id: EGV003
      topic: "Empirical base rate for customer-driven construction pauses at AI data center developers"
      description: >
        The rate at which hyperscale customers pause or cancel data center builds at independent providers
        is not systematically documented. The CoreWeave-Microsoft relationship and the Crusoe-unnamed
        customer Wyoming pause are the most prominent public examples, but the population of similar
        events is too small for actuarial probability estimation. The 25% bear-case probability assigned
        to a second Wyoming-style pause is a subjective judgement, not a data-derived estimate.
      relatedQuestionRefs: [QV028]

    - id: EGV004
      topic: "Comparable valuation table — coverage boundary"
      description: >
        Table TV004 covers five publicly discussed AI cloud infrastructure companies, limited to those
        with analyst-estimated or public revenue figures. It does not include unlisted providers
        (Nebius subsidiary operations, Coreweave data center leasing arms), undisclosed private raises,
        or early-stage GPU cloud entrants without traceable ARR. A complete comparable set would require
        access to private market databases (PitchBook, Preqin) not available in public sources.
      relatedQuestionRefs: [QV003, QV027]
      relatedTableRefs: [TV004]

