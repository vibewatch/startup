      - number: '5.6'
        title: 附录
        blocks:
          - type: callout
            title: MemoryAlloy 作为专有推理护城河
            body: >-
              MemoryAlloy 的集群级 KV cache，是 Crusoe 在软件层最清晰的产品差异化。相比 vLLM 运行 Llama 3.3 70B，其 9.9× TTFT 基准差距对实时 AI 应用很重要；对
              NVIDIA Dynamo 的开源 tokenizer 贡献，也为专有引擎补上了社区可信度。 如果能获得独立基准验证，它可能成为推理即服务领域的持久护城河。
            calloutType: strength
            claimRefs:
              - CE009
              - CE010
              - CE011
          - type: callout
            title: NVIDIA 依赖构成单一供应商硬件风险
            body: >-
              Crusoe 与 NVIDIA 深度绑定，从当前 GPU SKU 到 Vera CPU、Rubin GPU 早期采用者承诺，制造了显著的单一供应商供给风险。 NVIDIA
              配额、价格或访问条款出现任何扰动，都可能损害云收入和超大规模园区建设计划。AMD MI300X 提供部分对冲，但与 AMD 的路线图深度明显更浅。
            calloutType: risk
            claimRefs:
              - CE003
              - CE022
          - type: callout
            title: Slurm-on-Kubernetes 可用性缺口
            body: >-
              SemiAnalysis 的 ClusterMAX 评测发现，Crusoe 的 Slurm-on-Kubernetes 产品开箱后无法供生产型研究实验室使用：login pods 缺少标准工具，CMK 没有默认
              ReadWriteMany StorageClass，缺少 RBAC 和 SSO 支持，容器内可复现 NVML driver 不匹配。这些缺口会在云层制造客户流失风险，尤其是那些把 Crusoe 与
              CoreWeave、Lambda 比较的成熟企业 AI 团队。
            calloutType: risk
            claimRefs:
              - CE029
              - CE032
          - type: callout
            title: 垂直整合带来速度优势
            body: >-
              Crusoe 共同开发电力基础设施和建设，包括内部制造长交期电气组件，使 Abilene Phase 1 园区从破土到投运约 12 个月完成；Oracle
              公开称之为「无可匹敌的执行力」。这一周期显著快于传统超大规模数据中心开发；如果 Crusoe 能在 40+ GW 项目管线 中复制，就会形成可重复优势。
            calloutType: insight
            claimRefs:
