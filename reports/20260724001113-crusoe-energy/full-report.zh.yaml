        title: 附录
        blocks:
          - type: callout
            title: 毛利率和单位经济性完全不透明
            body: >
              Crusoe 没有披露任何时期的毛利率、EBITDA、现金余额、烧钱速度或 NRR。公司正从商品化挖矿（利润率结构性偏薄且波动大）转向 AI
              云（利润率潜在更高，但取决于合同组合），投资者无法验证收入增长是否能转化为单位经济性改善。这是最重大的单一尽调缺口，也是投资者难以高置信度承销 Crusoe $10B 估值的主要障碍。
            calloutType: risk
            claimRefs:
              - CI025
              - CI026
              - CI027
              - CI028
          - type: callout
            title: 超大规模客户合同提供异常庞大且可见的收入底盘
            body: >
              15 年期 Microsoft Abilene 容量协议（900 MW）与 Oracle Stargate 多年期合同，构成一个长期、照付不议的收入底盘，几乎没有其他私营新云公司可比。 这些协议是
              JPMorgan $9.6B 项目融资的抵押基础，相比 Lambda Labs、Vast.ai 等依赖现货的新云厂商，带来结构性的收入质量优势。
            calloutType: strength
            claimRefs:
              - CI004
              - CI021
              - CI022
          - type: callout
            title: $9.6B 规模项目融资制造契约集中风险
            body: >
              JPMorgan 正在安排约 $9.6B 项目融资，并以 Abilene 园区资产和超大规模客户合同作为担保；Crusoe 因此暴露在私营公司少见规模的契约合规风险中。 Microsoft 或 Oracle
              的任何承诺修改，或 Abilene 建设延迟，都可能触发契约复核，或限制管理层运营灵活性。契约条款没有公开披露。
            calloutType: risk
            claimRefs:
              - CI020
              - CI021
              - CI022
              - CI031
              - CI032
          - type: callout
            title: 2025 年收入是估算，不是确认值
            body: >
              分析师对 Crusoe 2025 年全年收入的估算区间为 $500M 至 $1B，方法是把 Crusoe 披露的 150% 云 ARR 增长套用到已确认的 2024 年 AI 云收入基数 $124M
              上。这些只是估算；Crusoe 尚未披露 2025 年绝对收入数字。本章所有估值和隐含倍数分析，都取决于尚未验证的 2025 年收入估算。
            calloutType: assumption
            claimRefs:
