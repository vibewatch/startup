  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险概览与排序
        blocks:
          - type: paragraph
            body: >
              Crusoe 已从放空天然气起点，成长为北美扩张最快的 AI 基础设施开发商之一。规模上来后，风险画像也发生质变：公司主要暴露不再是油田准入和甲烷信用
              的波动，而是能源许可的政治经济学、少数超大规模客户的需求集中，以及一条由 CEO 本人形容为可能超过承诺方实际交付能力的项目管线执行风险。
              本章按残余严重性从高到低，对七类重大风险进行排序，用证据逐一审视，并以可监控的终止标准收尾。风险簇包括：（1）电力建设执行与电网监管风险；（2）客户集中与超大规模客户依赖；（3）GPU
              供应链与供应商集中；（4）甲烷与环境监管不确定性；（5）声誉与 ESG 矛盾；（6）IP 与法律遗留；（7）竞争替代。每项风险都有传导机制，会影响 Crusoe 的收入、利润率和融资可得性，投资者必须持续监控。
