  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与来源
        blocks:
          - type: paragraph
            body: >
              Crusoe 的收入模式经历了一次有意推动的结构性转型。2024 年，公司总收入为 $276M，其中约 45% 来自 AI 云（$124M，同比增长 460%），55% 来自 Bitcoin
              和数字火炬挖矿（$152M）。2025 年 3 月，公司把挖矿业务——425+ 个模块化数据中心、250+ MW，以及约 135 名员工——出售给 NYDIG 后，转向纯 AI
              云和数据中心基础设施收入模式。Crusoe 披露 2025 年云 ARR 增长 150%、总合同价值（TCV）增长 17 倍，但没有公布绝对分母或基础 ARR 数字。分析师对 2025 全年收入的估计介于
              $500M 和 $1B 之间，但这些只是未确认估计，并非公司披露数据。

              今天，Crusoe 的收入由三套机制驱动。第一，Crusoe Cloud 通过按需小时计费（H100 SXM 每 GPU 小时 $4.29）和预留容量订阅提供 GPU
              算力。第二，长期超大规模云厂商容量协议——最典型的是 Microsoft Abilene 900 MW 承诺（2026 年 3 月）以及 Oracle/Stargate
              锚定关系——提供大额合同收入分段，具备多年可见度和照付不议经济性。第三，Crusoe Spark 模块化 AI 工厂产品可能形成产品销售和托管服务收入线；Redwood Materials 合作从 4 个
              Spark 单元扩至 24 个，显示初步商业牵引力，但收入规模未披露。

              NYDIG 交易后，收入质量已经实质改善：AI 云收入具备经常性和订阅属性，旧 Bitcoin 挖矿收入实质上是商品挖矿，受减半周期和哈希率 竞争约束。不过，Microsoft 和 Oracle
              两家超大规模云厂商集中度高，带来客户依赖风险，即便标价存在溢价，也会限制真实定价权。Crusoe Cloud 现货 / 预留 GPU
              租赁与超大规模云厂商容量租约之间的收入结构没有公开披露，因此无法精确评估收入质量。

              Redwood Materials 合作（从 4 个 Spark 单元扩至 24 个）以及类似 Spark 部署合作结构显示，模块化 AI
              工厂收入线可能变得重要；但经济模型究竟是产品销售、租赁还是托管服务，目前仍是公司口径，尚未独立验证。
