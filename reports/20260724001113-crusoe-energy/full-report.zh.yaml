      - number: '7.3'
        title: 运营、技术与供应链风险
        blocks:
          - type: paragraph
            body: >
              Crusoe 的运营风险集中在三条线：GPU 可得性、建设执行和供电可靠性。GPU 供给方面，公司在 2025 年 6 月承诺投入 $400 million 购买 AMD MI355X 加速器（约 13,000
              台），降低对 NVIDIA 的纯粹依赖；但 AMD 的 ROCm 软件栈成熟度仍弱于 CUDA，会给推理客户带来运行时风险。NVIDIA 持续参股（Series D 和 E 投资者）带来供应链对齐，但也意味着
              NVIDIA 的战略优先级会塑造 Crusoe 的硬件路线图。到 2025 年中，美国半导体关税平均为 18.2%，直接推高 GPU 采购成本并压缩利润率。 建设执行方面，CEO
              本人公开表示——「这个领域已经许下了很多承诺，但我无法担保它们真的会发生」——说明 45 GW+ 项目管线带有相当大的投机性悬空。Wyoming 1.8 GW 园区因客户要求暂停，以及 Oracle/OpenAI
              退出 Abilene 后续阶段，是这一风险的早期证据。公司被迫寻找替代租户（Microsoft 在 Abilene 接手），增加了时间线和收入确认不确定性。 Crusoe Cloud 达到 99.98%
              可用时间，并持有 ISO 27001 + ISO 42001 认证（2026 年 2 月），这缓解了云平台运营风险。 但以天然气备份运行的 GW 级绿地数据中心，会引入纯云玩家不承担的单点能源供给故障。
