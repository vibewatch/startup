      - number: '8.2'
        title: 融资背景与当前估值标记
        blocks:
          - type: paragraph
            body: >
              Crusoe 迄今通过股权和结构化融资累计募资约 $3.9B。最近一轮定价股权是 2025 年 10 月 Series E：募资 $1.375B，投后估值超过 $10B，Valor Equity Partners
              和 Mubadala Investment Company 等领投。此前是 2024 年 12 月 Series D：募资 $600M，投后估值 $2.8B，由 Founders Fund 领投，NVIDIA
              等参与。12 个月内从 $2.8B 抬到 $10B+（3.6x），与期间完成的执行里程碑一致：Abilene 上线、4.9 GW 签约、Meta 1.6 GW 容量协议宣布。

              债务端，Crusoe 从 Brookfield Asset Management 获得 $500M 信贷额度，用于电力基础设施开发；又与 Blue Owl Capital 建立 $450M 合资安排，用于
              Abilene 园区二期。Reuters 2025 年 6 月报道称 NVIDIA 参与一轮 $750M 融资，这大概率指 Series D 和 E
              分批加结构化债务的组合，而不是另一轮单独定价融资。包含债务后的总资本估计约 $5.5B。

              收入轨迹是基本估值锚。Sacra Research 估计 FY2024 收入约 $276M，对应 $10B 企业价值 / 收入约 36x（过去十二个月口径）——显著高于 CoreWeave IPO 约 12x
              的倍数。不过 Crusoe 的增长曲线正在急速抬升：Sacra 预测 FY2025 收入约 $998M，按未来收入口径 EV / revenue 降至约 10x——大体接近 CoreWeave IPO。只有已签约
              4.9 GW 按期转化为收入，且 xAI / Meta 关系贯穿 2025 年保持稳定，这一未来口径倍数才能实现。本章始终将已观察事实和模型预测分开；任何来自第三方估计的收入或估值数字均会明确标注。
