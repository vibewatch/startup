      - number: '1.5'
        title: 产品组合与运营
        blocks:
          - type: paragraph
            body: >
              Crusoe 横跨三层产品。第一层是实体 AI 工厂基础设施：公司获取土地，设计并建设吉瓦级数据中心园区，再向锚定租户（Oracle，以及潜在其他超大规模云厂商）提供长期租赁安排。Abilene 园区规划 1.2
              GW；Wyoming 一个 1.8 GW 园区正在规划；Canada 的 Alberta 和 Norway 的 Polar 站点也在开发中。第二层是 Crusoe Cloud，一个四区域 AI
              云平台（us-northcentral1-a、us-east1-a、us-southcentral1-a、eu-iceland1-a）。Crusoe Cloud 提供 GPU 实例、Managed
              Kubernetes，以及由专有 MemoryAlloy™ 技术驱动的 Crusoe Managed Inference Service——这是一张集群级 KV
              缓存织网，相比标准推理引擎，time-to-first-token 最多快 9.9 倍。第三层是 Crusoe Intelligence Foundry 和 Edge Zones：Crusoe Edge
              Zones 于 2026 年 3 月推出，是模块化、工厂预制集群，可用于主权 AI、低延迟推理和企业专用部署。

              Series D 公布时，公司在美国 9 个州和 3 个国家运营，过去 12 个月客户数增长超过 7 倍。值得关注的云客户包括 Decart（四天内扩容 5 倍，服务 200
              万用户）、Codeium/Windsurf（700,000+ 开发者，集群正常运行时间 99.98%）等。Crusoe 也已剥离加密挖矿业务，彻底转向 AI 基础设施。根据 ESG 披露，DFM
              技术帮助公司避免了超过 680,000 吨 GHG 排放。分析师认为，能源优先策略——提前多年锁定滞留气、风能、地热和可再生能源站点——就是 neocloud 市场的核心护城河。
