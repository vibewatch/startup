      - number: '2.3'
        title: 买方分层
        blocks:
          - type: paragraph
            body: >
              AI 云买方可分成五条线，每条线的预算归属、采购机制和 SLA 预期都不同。超大规模云厂商锚定租户——Oracle、Microsoft、Amazon 和 Google——代表最高价值账户，会与 neocloud
              签署数十亿美元级容量承诺，常常提前多年预留产能。CoreWeave 截至 2026 年中 $66B 至 $99.4B 的合同积压就是这种机制的例子，主要由 Microsoft 和 Meta
              锚定合同驱动。Crusoe 的 Oracle-Abilene 交易也遵循这一模式：一份长期租约锚定 AI 工厂业务，交易对手信用质量接近超大规模云厂商。

              AI 基础模型实验室和前沿 AI 公司（OpenAI、Anthropic、xAI、Mistral）是第二层：这些公司的完整价值主张都高度依赖算力。这类买方每年在训练和推理 GPU
              算力上消耗数亿到数十亿美元，通常采用预留集群安排。xAI 在 Abilene 的擦肩而过，以及 Crusoe 通过 Oracle Stargate 交易间接触达 OpenAI 需求，都说明 Crusoe
              离这一层很近。

              AI 原生创业公司是数量型买方，单客支出较小：每月 $5,000 到 $500,000，不过中型生产团队平均每月 $50,000 到 $500,000。这一板块推动 Crusoe Cloud 利用率和按需 GPU
              产品收入。采用 GenAI 做业务应用的企业 IT 买方，是一个正在浮现且战略重要的群体：2025–2026 年 GenAI 从试点走向生产后，企业需要合规认证（SOC
              2、HIPAA、FedRAMP），目前这些认证更有利于超大规模云厂商。Crusoe 的 ISO 27001 和 ISO 42001 认证是迈向企业就绪的步骤，但 SLA 历史仍令人担忧。

              主权 AI 项目——由各国政府建设、带有数据驻留要求的本土 AI 基础设施——是快速出现的买方板块。Nebius 从 Microsoft 和 Meta 获得 $46B 欧洲容量承诺，并按 GDPR
              条款执行，显示了该市场的规模。Crusoe 于 2026 年 3 月推出的 Edge Zones 产品正对准这一用例，用模块化、工厂预制集群服务主权和低延迟部署。
