      - number: '8.5'
        title: 建议、置信度与信念框架
        blocks:
          - type: paragraph
            body: >
              立场：有条件 INVEST，且需完成重要尽调前置项。置信度：中。风险评级：高。本建议适用于按 $10B+ Series E 标记进入的新资金。较早按 $2.8B Series D
              标记进入的投资人已有可观账面增值，应谨慎建模退出时点。

              信念框架有三道门。Gate 1（客户合同）：投资人必须拿到前三大客户合同的脱敏版本，确认最低 take-or-pay 金额、取消通知期和罚则。Oracle / OpenAI 短通知退出 Abilene
              后续阶段——据称已由 Microsoft 替代——说明非正式承诺执行风险很高。Gate 2（毛利率）：投资人必须按客户、按园区确认毛利率路径高于 45%。Crusoe 的天然气轮机和 SB6
              限电敞口带来电力成本不确定性，收入端预测未反映这一点。Gate 3（建设控制）：投资人必须拿到至少两个非 Abilene 园区的详细项目管理计划，显示带里程碑和罚则的约束性客户承诺，并将其绑定到建设进度，以避免
              Cheyenne 暂停重演。

              否决触发条件是任何出现即无视当前标记、把建议转为 PASS 的事件：(1) 失去 xAI 或 Meta，且该客户代表 >30% 已签约容量；(2) 十二个月内第二次出现 Wyoming 式客户驱动暂停；(3)
              Brookfield 信贷额度触发债务契约违约；(4) 发现 DFM 剥离让 Crusoe 背负重大甲烷合规赔偿责任。

              从退出准备度看，Crusoe 还没具备 IPO 条件，但如果收入超过 $1B 且 EBITDA 利润率扩张，2026–2027 年有望达到 IPO
              门槛。来自超大规模云厂商（Microsoft、Meta、Google）的战略并购是可行替代退出，CoreWeave 的客户关系提供了先例。截至本文写作时，二级交易定价尚未独立确认。
