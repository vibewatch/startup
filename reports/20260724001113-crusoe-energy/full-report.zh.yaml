      - number: '7.5'
        title: 人员、执行与财务风险
        blocks:
          - type: paragraph
            body: >
              Crusoe 2025 年员工数翻倍以上，达到 1,217 人，这是连续第二年翻倍。技术和建设管理岗位同时以这种速度超高速招聘，会制造组织风险：整合与文化压力、对联合创始人 Chase
              Lochmiller（CEO）和 Cully Cavness（COO）的关键人依赖，以及多个 GW 级项目同步建设下的执行质量风险。公司 2025 年债务融资约 $975 million，另有
              Brookfield Asset Management 于 2025 年中安排的 $750 million 信贷额度。所有轮次合计融资约 $3.9
              billion。这种资本深度对私营公司来说异常强，但债务服务义务叠加 GPU 采购和建设的激进资本开支，会形成高烧钱动态：客户激活或收入确认出现任何有意义延迟，都可能压迫资产负债表。 Abilene
              全园区成本估算约 $12 billion（Blue Owl 新闻报道），意味着 Crusoe 的股权与债务合计覆盖不到已承诺建设价值的三分之一——剩余部分需要项目融资或额外股权。 最近 Wyoming
              暂停说明，客户驱动的范围变化可能在收入锁定前就让沉没成本风险结晶。最后，2025 年把 Bitcoin mining 业务剥离给 NYDIG，移除了一个能产生现金、但周期性的收入支柱，而 AI
              基础设施业务仍处在利用率爬坡期。
