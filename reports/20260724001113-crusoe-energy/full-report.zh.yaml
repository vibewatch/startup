            title: ESG 身份与资本可得性
            body: >
              Crusoe 一直以气候科技公司叙事融资，因此吸引了 Lowercarbon、G2 Venture Partners 等可持续主题资本。但公司现在计划在 Abilene 燃烧天然气发电 360 MW（占 1.2
              GW 容量的 30%）；Chevron / Engine No. 1 天然气资产组合的碳捕集技术尚无确认设计伙伴，却要在 2027 年交付。如果可持续主题投资人把 Crusoe 重新归类为传统 AI
              基础设施，隐含融资成本会上行，气候科技身份带来的估值溢价也会被侵蚀。
