      - number: '6.4'
        title: 留存与耐久性：SLA 表现、CSAT 与切换经济性
        blocks:
          - type: paragraph
            body: >-
              Crusoe Cloud 合同承诺 IaaS 层集群可用时间 99.98%，VM 启动时间低于 90 秒。99.98% 可用时间折算为每个集群每年允许约 105 分钟计划外停机。Windsurf 12
              个月生产使用期内未报告 SLA 违约，是这一承诺最强的独立验证。SemiAnalysis ClusterMAX 评测指出支持响应速度快于平均水平，Crusoe 也报告过去 12 个月 CSAT 为
              100%——但这些数字都来自自报，除 Windsurf 案例研究 外，未由具名客户独立审计或确认。

              Crusoe 状态页记录，ICAT 区域在 2026 年 6 月 17 日发生负载均衡器宕机，使端点约两小时无法访问。该事件仍处在 SLA 余量内（单次事件在 99.98% 容忍度内），但说明 Crusoe
              并不能免疫所有云提供商都会遇到的运营问题。冰岛设施在 2025 年也发生过大范围光纤污染事件（火山灰碎屑影响 20,000 个光纤端面），需要物理修复。两起事件似乎都没有触发公开 SLA
              赔付或报告客户流失，与自报 100% CSAT 数据一致。

              Crusoe Cloud 未公开披露 Net Revenue Retention 和 Gross Revenue Retention。Cheddarflow 根据定性扩张信号，估计 2025 年前客户队列的
              NRR 在 110–130% 区间。该估计无法独立验证。不同层级的合同期限差异很大：超大规模数据中心租户签署 10 到 20 年电力购买协议，收入极其耐久；云客户签署月度或年度 GPU
              预留，迁移性更强，但也受益于适度切换成本（负载集成、SLA 熟悉度、网络配置）。Windsurf 从 GPU IaaS 扩展到 Managed Inference，展示了推动 Crusoe Cloud 估算高
              NRR 的自然追加销售模式。 缺少公开 NPS、独立 CSAT 审计或披露的流失率，是潜在企业买家评估长期承诺时的重大尽调缺口。
