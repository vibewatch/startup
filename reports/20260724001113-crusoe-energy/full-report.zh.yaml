  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资正反论点
        blocks:
          - type: paragraph
            body: >
              Crusoe 的投资论点立在三根结构性支柱上。第一，AI 基础设施需求长期上行：超大规模云厂商和 AI 实验室都缺算力容量，而贴近电网电力、拥有专用 GPU
              集群的独立云提供商最适合填补这一缺口。第二，Crusoe 的电力-算力一体化模型构成差异化——公司把发电（Abilene 的天然气轮机、规划中的可再生能源、储能合作）与 GPU
              集群共址，边际电力成本更低，部署节奏也比传统托管机房到云迁移更快。第三，公司已拿到一线超大规模云厂商（Microsoft、Meta、xAI）的锚定关系和战略股权伙伴（NVIDIA），需求端和供应链接入都被部分去风险。三者共同支撑
              Series E 的 $10B+ 估值。

              反论点同样尖锐。客户集中风险很重：xAI 和 Meta 可能占已承诺容量的大部分。Oracle 和 OpenAI 退出 Abilene 后续阶段说明，即便大客户也可能比 Crusoe
              重新部署资本更快地改计划。CEO Chase Lochmiller 公开承认，销售管线中相当一部分可能不会落地。Cheyenne Wyoming 1.8 GW Project Jade 在 2026 年 6
              月按未具名客户要求暂停——这是集中风险实时变成现实的直接数据点。同时，Abilene 360 MW 天然气轮机建设制造了 ESG 身份矛盾；如果可持续主题 LP 退出，或新增贷款条件收紧，融资成本可能上升。估计约
              $975M 的债务栈已约等于 FY2025 预计收入的 100%，限制自由现金流，也削弱公司承受收入缺口的韧性。

              建议立场是有条件建设性：Series D $2.8B 入场的早期投资人仍然可看多；新资金若按 $10B+ 入场，必须严格核验合同条款、管线中具约束力的承诺和毛利率确认。Crusoe 相对 CoreWeave
              IPO 倍数的估值溢价，只有在 2025 收入假设和 2026 合同化爬坡被验证准确时才站得住。
