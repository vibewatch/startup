      - number: '2.4'
        title: 增长驱动因素
        blocks:
          - type: paragraph
            body: >
              最主要的需求催化剂，是 AI 模型从批量训练转向持续的代理式 AI 推理。到 2025 年末，推理工作负载消耗的 GPU 总算力已经超过训练工作负载，背后是企业软件、代码助手和消费者应用中 AI agents
              的铺开。Agentic AI 系统每个任务所需推理算力比单轮模型高出数量级，创造出持久的指数级需求。NVIDIA CEO Jensen Huang 在 2026 财年第四季度业绩会上指出，「有用的 AI
              agents 才刚开始推出」，且规模化后「极度吃 token」。

              企业 AI 采用在 2025–2026 年进入结构性拐点，从受控试点转向任务关键型生产工作负载。neocloud 相对超大规模云厂商的成本套利提供了可量化驱动因素：领先 neocloud（Lambda
              Labs、CoreWeave）的按需 H100 GPU 价格为每 GPU 小时 $2.49 至 $4.25，而 AWS 为每 GPU 小时 $6.88，Azure 为每 GPU 小时 $12.29。下一代
              B200 GPU 的价差更大：AWS 约每 GPU 小时 $14.24，而 Lambda Labs 为 $4.99 至 $5.29。2–6 倍成本差有量化依据，也已在 2026 年第一季度公开定价数据中记录。

              电力可用性已经成为竞争定位最关键的单一驱动因素，2025–2026 年实际取代 GPU 硬件可用性，成为首要约束。2023–2024 年锁定电力容量的运营商，相比面对 4–10
              年电网并网排队的新进入者，拥有结构性的多年优势。NVIDIA 用 2025 年第三季度（2025 年 10 月）$57B 收入验证了需求基本面，同比增长 62%；Amazon $34.2B、Microsoft
              $35B 和 Alphabet $24B 的 2025 年第三季度资本开支也相互印证，且主要投向 AI 基础设施。国家层面的主权 AI 政策要求也在扩大 TAM，在美国市场之外创造新的需求口袋。
