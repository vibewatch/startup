  - id: FE002
    title: 客户工作流与云运营流程
    type: flow
    layout: standard
    summary: 从识别计算需求，到预置、编排、运行工作负载、监控和扩张的端到端路径，展示 AI 团队如何使用 Crusoe Cloud 的产品界面。
    data:
      nodes:
        - id: need
          label: AI 团队识别计算需求
          detail: 团队确认训练、微调或推理需求；超大规模云厂商的价格超出预算或供给不足；或者受数据本地化约束，需要边缘 / 本地计算。
        - id: provision
          label: 预置 GPU 资源
          detail: 客户通过 Crusoe Cloud Console、CLI 或 REST API 选择 GPU SKU（H100/H200/B200/MI300X）；VM 或集群在 90 秒内启动；选择按需或预留定价。
        - id: orchestrate
          label: 配置编排层
          detail: 客户部署托管 Kubernetes（CMK）、托管 Slurm 或 AutoClusters；配置 InfiniBand RDMA 网络结构和 VPC 网络；设置块 / 对象存储。
        - id: run
          label: 运行 AI 工作负载
          detail: 训练任务跨多节点集群运行，AutoClusters 提供自动容错；推理流量经由 Managed Inference 路由，并用 MemoryAlloy KV cache 优化 TTFT。
        - id: monitor
          label: 监控与优化
          detail: Crusoe Command Center 提供实时可观测性；企业支持 24/7 在线，首次回复时间 <6 分钟；CSAT 连续 12+ 个月保持 100%。
        - id: scale
          label: 扩容或扩张
          detail: 客户继续预置更多 GPU；协商预留容量；若有持续本地部署需求，Crusoe Spark 单元在下单后三个月内交付。
    approximationNotes: 流程代表典型云客户旅程；超大规模托管客户走单独的园区定制建设流程。
