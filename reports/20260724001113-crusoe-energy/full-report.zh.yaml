  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >
              Crusoe 所处的 GPU 云市场至少有四个结构层级，每一层都带来不同竞争挑战。第一层是纯 neocloud GPU 云运营商——CoreWeave、Lambda Labs、Nebius AI 和
              Vast.ai——它们在开发者、AI 实验室和企业 GPU 容量买方上，是 Crusoe 最直接的收入竞争者。CoreWeave 于 2025 年 3 月在 NASDAQ 上市，是这些运营商中按估计
              ARR（2025 年初约 $5B）计算规模最大的一家，并拥有 NVIDIA 优先 GPU 分配资格，因此成为 neocloud 定价和可靠性的比较基准。

              第二层是超大规模云厂商——AWS、Microsoft Azure、Google Cloud 和 Oracle OCI——也是全球 GPU 算力最大的整体供应方。AWS P5 实例在 96-GPU EFA
              网络集群中部署 H100；Azure NDv5 VM 为分布式训练提供 H100；Google Cloud 提供按需 A100/H100 和承诺使用折扣；Oracle SuperCluster
              在单个裸金属集群中打包 400 颗 H100 GPU。超大规模云厂商正重金投入 AI 基础设施（仅 Microsoft 就为 2025 年承诺 $80B+），并代表企业采购团队的「安全默认选项」。

              第三层是 Lancium 这类贴近能源论点的运营商，在 Texas 运营可再生能源供电的 HPC 基础设施，与 Crusoe 最初的市场定位重叠。Lancium 的清洁园区已获 ERCOT
              批准，可接入吉瓦级电网电力，但 Lancium 不提供通用 GPU 云产品。

              第四层是现状替代：本地 HPC 集群、传统数据中心托管（Digital Realty、Equinix）以及大型企业内部建设项目。这一层最重要，因为今天企业 GPU 支出的大部分都在这里，也是 Crusoe
              必须替代的基准。Crusoe 的 BYO Power 路线和 Spark 模块化工厂，正是用更快、功率密度更高的替代方案，打本地部署 / 托管机房这一层。

              反向背景：neocloud 提供商的 GPU H100 现货市场价格从 2023 年约 $8/hour 降至 2024 年末 $2–3/hour，压缩了最初吸引企业买方离开超大规模云厂商的套利空间。Crusoe
              曾发生一次有记录的连接故障，影响 us-east1-a 区域计算实例，暴露出 CoreWeave 和超大规模云厂商会在竞争销售中强调的可靠性风险。
