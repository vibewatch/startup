      - number: '7.7'
        title: 附录
        blocks:
          - type: callout
            title: Wyoming 园区暂停是金丝雀
            body: >
              Crusoe「应客户要求」暂停 1.8 GW Wyoming Project Jade，却未披露客户、原因或时间线；这是 Crusoe 2026 年公开披露中最重大的风险信号。叠加 Oracle/OpenAI
              退出 Abilene 后续阶段，它确认超大规模锚定租户会把大型 AI 基础设施承诺视为临时性安排。在投资者能独立验证签约利用率和客户照付不议条款之前，所有已宣布项目管线数据都存在重大高估风险。
