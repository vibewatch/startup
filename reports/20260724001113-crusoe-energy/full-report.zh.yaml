              - CE015
  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 买方格局：初创公司、企业与超大规模租户
        blocks:
          - type: paragraph
            body: >-
              Crusoe 服务两个结构上不同的客户群，交易规模、采购机制和风险画像都不一样。云层服务 AI 原生初创公司和企业机器学习团队，提供按需 GPU 算力或年度预留，具备自助定价、低于 90 秒的 VM 开通，以及
              SOC 2 Type II 合规姿态。数据中心园区层通过十年以上电力购买协议和定制建设项目服务超大规模运营商。 这两个群体不只是同一产品的不同体量版本——它们需要不同销售动作，流失动态不同，也让 Crusoe
              暴露在本质上不同的集中度风险中。

              在云业务中，主导买方画像是拥有 10–200 名工程师、需要高密度 GPU 访问但不想承受 AWS、Azure 或 GCP 预留摩擦的 AI 初创公司。 Crusoe
              对这一群体的竞争定位靠三根支柱：公开透明定价（H100 $3.90/hr，H200 $4.29/hr，AMD MI300X $3.45/hr）、认证 NVIDIA Cloud Partner 背书以传达 GPU
              供给可靠性，以及吸引 ESG 取向投资者和被投公司的可持续叙事。 企业 AI 群体——包括 Databricks、Sony 和 Together AI——通过直销使用 Crusoe Cloud，在标准 IaaS
              目录 之上叠加定制 SLA 和专用集群选项。2026 年 4 月 Managed Inference 上线，打开了新的 API 优先消费层，把可触达市场延伸到无法承诺预留集群合同的 token 计费经济买方。

              数据中心园区业务本质是地产与电力经纪：Crusoe 寻找场址，从电网或替代来源锁定电力容量，建设园区设施，再把托管容量租给需要确定性、多 GW 交付且时间线压缩的超大规模云厂商。 Oracle、Microsoft
              和 Meta 是这一层已披露或报道的三大关系。第四个未具名客户（普遍报道称为 Google）在开发中途退出 Wyoming 园区项目，暴露了项目管线到合同之间的转化风险。xAI 是混合型客户——既把 Crusoe
              当作基础设施建设伙伴，也把它作为 Grok 训练和推理的 GPU 云提供商。

              云渠道以直接自助为主，辅以 NVIDIA NCP 伙伴渠道。园区渠道完全是直接企业销售和定制谈判。没有经销商或市场平台分销层来分散项目管线
              风险。地域集中以美国为主（Texas、Wyoming、Nevada、California），欧洲容量位于 Iceland 和 Norway，服务数据驻留需求。
            claimRefs: []
