      - number: '2.5'
        title: 采用约束与竞争风险
        blocks:
          - type: paragraph
            body: >
              供给扩张的结构性约束是电力。2025–2026 年进入电网并网队列的新数据中心项目，在美国主要市场通常要等待 4 到 10 年。Northern Virginia
              是美国最大数据中心市场，但拥堵严重到公用事业公司已警告区域电力短缺，迫使新项目转向二级电网区域的二级市场。World Economic Forum（2026 年 5 月）把电网连接称为「AI 的战略瓶颈」，并指出
              AI 园区开发商若能结合分阶段接入、现场储能和负荷控制，就能在电网增强完成前先启动运营。

              资本强度形成高门槛护城河。吉瓦级 AI 数据中心每个园区需要超过 $1B 的建设和基础设施投资，把有效竞争者限制在资本充足的玩家中。表后电力方案（Bloom Energy 燃料电池、太阳能 +
              储能、下一代核微反应堆）正在成为无法等待电网并网的运营商标配，但这些方案同样需要大量前期资本。

              客户切换成本是中等但真实的市场进入和流失壁垒。生产 AI 工作负载在 GPU 云提供商之间迁移，需要数据迁移、应用重构、API 变更和合规重新认证。企业和主权买方已经投入集成，因此锁定效应更强。不过，AI
              原生创业公司通常更价格敏感，也更愿意切换。

              NVIDIA 在 AI 加速器中的主导地位，为所有 neocloud 玩家带来集中度风险。NVIDIA 约占 AI 训练加速器市场的 95%；Cerebras（wafer-scale
              engine）、Groq（最近在团队收购中被 NVIDIA 吸收）和 AMD MI 系列芯片等替代方案存在，但在大规模训练中的生产采用有限。可靠性担忧是 neocloud
              类别特有的结构性风险：企业买方期待超大规模云厂商级 SLA 承诺（99.99%+），但早期 neocloud 在实践中难以达到，Crusoe 自身 2025 年 3 月 45 小时故障和 2026 年 5
              月网络事件就是例证。
