      - number: '8.4'
        title: 乐观、基准与悲观情景
        blocks:
          - type: paragraph
            body: >
              乐观情景假设 Abilene 到 2026 年中完全爬升至 1.2 GW，Project Jade（Wyoming）恢复并在 2026 年 H2 交付初始容量，xAI 和 Meta 维持多年容量承诺，Crusoe
              Spark 模块化部署加速来自中小企业客户的收入。在这些假设下，FY2026 收入可达 $1.5–2.0B，按 10–13x 未来口径倍数 隐含 EV 为 $15–25B。Series D 投资人（$2.8B
              入场）可实现 5.4–8.9x MOIC；Series E 投资人（$10B 入场）可实现 1.5–2.5x。该情景要求不再出现重大客户集中事件，ESG 重新定位成功，且 Texas 电网政策继续有利。

              基准情景假设 Project Jade 恢复在建但延迟 12 个月，Abilene 的 Oracle 和 OpenAI 容量被 Microsoft 及新企业客户替代但利用率降低，Crusoe Spark 增量增加
              200–300 MW。FY2026 收入约 $900M–$1.2B，按 8–12x EV/revenue 隐含 $7–14B 企业价值。Series D 投资人实现 2.5–5x MOIC；Series E
              投资人在 2–3 年持有期内获得温和的 0.7–1.4x 回报。

              悲观情景假设其他园区至少再出现两次 Wyoming 式暂停，xAI 或 Meta 因转向自建或竞争替代方案而将合同承诺削减 30–50%，电力成本上升（天然气轮机 + SB6 限电成本）使毛利率压到 40%
              以下，且 2028 年前没有 IPO 窗口。FY2026 收入 $400–600M、EV/revenue 6–8x 时，隐含 EV 为 $2.4–4.8B——低于 Series E 投后估值，对 Series E
              投资人意味着 0.24–0.48x MOIC，对 Series D 为 0.86–1.71x。

              截至 2026 年 6 月，基于可得证据，三种情景概率权重为：乐观 25%、基准 50%、悲观 25%。概率加权 EV 约 $9.6–13.5B。该区间略高于当前 $10B+ 标记，说明 Series E
              估值大体有效，但晚期入场者下行保护有限。
