      - number: '4.3'
        title: 资本结构与充足性
        blocks:
          - type: paragraph
            body: >
              在 AI 基础设施领域的私营公司中，Crusoe 搭出了异常庞大且分层的资本结构。股权融资横跨六轮，合计约 $3.4B；最近两轮是 Series D（$600M，估值 $2.8B，SEC Form D 于
              2024 年 11 月 21 日提交，精确金额 $817,744,542，70 名投资者）和 Series E（$1.375B，估值 $10B+，SEC Form D 于 2025 年 10 月 23
              日提交，精确金额 $1,374,999,988，71 名投资者）。 Series D 投资者包括 Founders Fund、NVIDIA、Fidelity、Mubadala、Ribbit Capital 和
              Valor。Series E 由 Valor Equity Partners 和 Mubadala Capital 共同领投。

              股权之外，Crusoe 为 Abilene 数据中心建设拿到 Blue Owl Capital 的 $3.4B 合资安排，JPMorgan 正在为同一园区安排约 $9.6B 项目融资，仅 Abilene
              园区承诺资本就超过 $15B。这套资本结构反映了 AI 超大规模数据中心开发的底层经济学：每 1 GW AI 优化容量，在安装第一台 GPU 机柜之前，就需要约 $10–15M/MW
              投入土建、电力基础设施和冷却。

              近期运营的资本充足性看起来较强：$1.375B Series E 股权加项目融资续航，应该覆盖 Abilene Phase 1。Michael Gordon 于 2025 年 12 月出任 COO/CFO（前
              MongoDB CFO，曾在 MongoDB 收入约增长 50x 时主导 2017 年 IPO），说明公司正在积极准备潜在资本市场动作。关键风险包括项目融资契约敞口、资本开支集中在单一园区（Abilene），以及
              JPMorgan 信贷额度提款时点带来的执行依赖。现金余额和月度烧钱速度均未公开披露。

              公司的资本充足性高度依赖 Microsoft 900 MW 与 Oracle Stargate 15 年合约收入流，用来服务项目融资契约。
              如果任一超大规模锚定客户修改承诺，项目融资结构就会在大规模层面暴露再融资风险。
