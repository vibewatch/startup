      - number: '4.2'
        title: 单位经济与定价
        blocks:
          - type: paragraph
            body: >
              Crusoe 公开披露的只是标价；实际每 GPU 小时收入、预留容量折扣结构和 GPU 利用率都未披露。H100 SXM 标价为 $4.29/GPU-hour，使 Crusoe 处在新云现货供给的高端。CPU
              算力标价为 $0.04/vCPU-hour。GB200 NVL72 价格未披露。Crusoe 的托管推理产品 MemoryAlloy 采用按用量付费模式， 按每 100 万 tokens 计费，缓存 tokens
              费率更低；绝对 token 价格未公布。

              单位经济性的市场背景并不友好：H100 现货价格从 2023 年约 $8/hour，跌到 2024 年末的 $2–3/hour，背后是供给正常化和集群竞争。这种压缩迫使 Crusoe
              不能只靠现货价格竞争，而要拼基础设施效率、产品差异化和企业长期合约粘性。 Crusoe 的 PUE 为 1.2–1.3（行业平均约 1.8），意味着相对典型数据中心可降低约 30–40%
              的电力开销。按估算的混合能源成本 $0.03–0.06/kWh、H100 TDP 约 700W 计算，每台 H100 每小时电力成本约 $0.02–0.04，只占 $4.29 标价的一小部分。GPU
              资本折旧才是主成本：H100 单价约 $25,000–30,000，若按 3–5 年折旧、80% 利用率计算，每 GPU 小时资本成本约 $0.60–1.20，按标价仍给毛利留下有意义空间。

              同行对比看，新云公司披露的毛利率多在 20–40% 区间；Crusoe 在能源和冷却上的效率优势，意味着其云业务可能位于该区间高端，但公司没有公开披露任何毛利率数据。 实际利润率还会受 GPU
              采购成本溢价影响：Crusoe 不是超大规模云厂商，采购 NVIDIA 时是否有折扣结构并未披露；Abilene 园区建设期的爬坡成本也会拖累利润率。

              Crusoe 披露 2024 年收入为 $276M，2025 年估算区间为 $600M–$1B。按 Crusoe $10B+ 的 Series E 估值计算，隐含收入倍数为 10x–17x（基于 2025
              年估算收入 $600M–$1B），与高端新云倍数一致，但高度依赖尚未验证的 2025 年收入基数。
