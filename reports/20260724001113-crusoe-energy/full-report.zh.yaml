      - number: '6.5'
        title: 采购模式、集中度风险与负面信号
        blocks:
          - type: paragraph
            body: >-
              Crusoe 的超大规模数据中心采购遵循以分阶段园区承诺为锚的先落地再扩张模式。Oracle 和 OpenAI 拿下 Abilene Phase 1（200MW+），并充当建设催化剂；Microsoft 拿下
              Phase 2（900MW），把园区扩展到总计 1.2GW。 这种分阶段结构对双方都合理：客户不用一开始承诺完整阶段，从而对冲建设风险；Crusoe 则拿到锚定客户，可在完整园区被订满前启动建设融资。
              风险在于，后续阶段需要同一租户重新承诺或找到替代者；Wyoming 项目暂停说明，Crusoe 不能假设 Phase 2 会自然跟随 Phase 1。

              云采购走两条路径。自助买家通过 crusoe.ai/cloud 注册，初始试用后转为月度或年度 GPU 预留合同。企业买家与 Crusoe 直销团队接触，谈定制集群配置、专用私有网络和协商 SLA。Managed
              Inference 用户采用 API-key 模式，没有集群预留，因此是迁移性最强、也最容易流失的群体。客户集中是 Crusoe
              客户画像中最重大的风险信号。园区层有三个已确认或报道的锚定租户（Oracle、Microsoft、Meta），每个规模 200MW–900MW，另有 xAI
              1GW+。如果其中任何两个无法从报道转为已执行合同，Crusoe 的签约容量指标将被重大削减，园区建设融资也可能承压。

              Wyoming 项目暂停——一名未具名客户要求停止——是最清楚的证据：超大规模项目管线客户确实可能退出。Crusoe 对客户指标的公开披露很少：没有客户数量、收入拆分或客户队列 NRR。Worldmetrics
              汇总的统计显示可能有数百个云客户，但引用的是二手来源，没有原始数据。根据 Crusoe 新闻室，Upstream Data 专利诉讼已于 2025 年通过许可协议解决；blockspace.media
              报道称裁决「混合」，认定侵权但损害赔偿存在争议。Crusoe Cloud 核心业务是软件和基础设施，不是 DFM 硬件，因此 Upstream Data 案件的残余 IP
              风险范围有限；但如果历史业务增长，该案仍为 DFM 技术 IP 挑战提供了先例。
