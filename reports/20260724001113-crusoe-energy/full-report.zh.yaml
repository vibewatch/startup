  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: Crusoe Cloud——GPU IaaS 与托管服务
        blocks:
          - type: paragraph
            body: >-
              Crusoe Cloud 是一个全栈、NVIDIA 原生的 AI 云平台，用能源优先的成本结构，把自己定位为超大规模 GPU 云的替代方案。 产品在美国和欧洲区域提供多种 GPU 加速虚拟机 SKU：NVIDIA
              H100 SXM（80 GB）按需价 $3.90/hr，H200 SXM（141 GB）$4.29/hr，AMD MI300X（192 GB）$3.45/hr， 以及 B200（180 GB）、L40S（48
              GB）和 A100（80 GB）。VM 配置从单 GPU 扩展到 8-GPU 节点，配备最高 3200 Gbps 的 RDMA InfiniBand 网络和感知拓扑的集群放置。IaaS 层之上，Crusoe 提供
              Managed Kubernetes（CMK）、Managed Slurm 和 AutoClusters；AutoClusters
              是自动化容错训练编排服务，会主动检查节点健康状态，并在无需操作员介入的情况下替换故障节点。 平台提供 VPC 网络、逻辑隔离环境、块存储、对象存储和共享存储，并配有 Crusoe Command Center
              可观测性控制台。 开发者界面包括 api.cloud.crusoe.ai/v1 上的 REST API、CLI、Terraform provider，以及 Go、Python 和 TypeScript
              SDK。Crusoe Cloud 已连续 12 个多月保持 100% CSAT，平台承诺 99.98% 集群可用时间，并由 24/7 企业支持背书，平均首次响应时间低于 6
              分钟。三到六个月期预留可在按需价格基础上折扣 30–50%，让企业在持续训练任务中获得预算可预期性。
