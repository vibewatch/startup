          - type: callout
            title: 2–6 倍成本套利创造持久 TAM 扩张机会
            body: >
              neocloud 与超大规模云厂商之间的 GPU 价差很大、可量化且持续存在。按需 H100 在 neocloud 上为 $2.49–$4.25/hr，而 AWS 为 $6.88/hr、Azure 为
              $12.29/hr——差距 2–5 倍；到 B200 硬件上进一步扩大（Lambda $4.99，对 AWS $14.24）。这一价差让 AI
              工作负载从超大规模云厂商迁移出来，在规模化时有强经济理由。任何因价格把 AI 训练或推理从 AWS/Azure 迁出的企业或实验室，都可能成为 Crusoe Cloud 或 CoreWeave
              客户。按每个生产团队每月 $50,000–$500,000 计算，成本驱动迁移对累计 TAM 的影响相当可观。
