      - number: '8.6'
        title: 最终尽调清单
        blocks:
          - type: paragraph
            body: >
              以下尽调项目是按 $10B 或更高标记投资的前置条件。项目按重要性排序：高优先级事项围绕客户集中和财务核验；中优先级覆盖法律、技术和运营尽调；低优先级为信息性、确认性事项。所有项目都应在结构化
              资料室流程中审阅，并取得经审计财务、已签署客户合同和购电协议。投资人承诺资本前，应要求提供 xAI 已承诺容量的当前运行水平、按产品线拆分的毛利率，以及 DFM
              油田业务剥离当前状态的证据。本尽调清单只是对本分析识别出的最重大缺口的部分列举；无论二级还是一级市场价格，作出任何投资决策前仍需完成完整商业、法律、技术和财务尽调。
