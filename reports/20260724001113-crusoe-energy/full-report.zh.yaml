              Crusoe 尚未发布经审计财务报表。本章引用的 $276M（FY2024）和 $998M（FY2025）收入来自 Sacra Research 和 Cheddar Flow
              的分析师估计，依据公开信号推导，并非管理层指引或审计账目。投资人必须在尽调中核验实际收入。本章的估值倍数和 MOIC 计算是方向性情景，不是预测，可能与实际结果有重大差异。
