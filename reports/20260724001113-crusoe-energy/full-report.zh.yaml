    summary: 六层架构从实体 AI 工厂延伸到云 IaaS、托管推理和开发者入口，展示 Crusoe 从能源获取到模型服务的垂直整合。
    data:
      layers:
        - label: 开发者入口
          detail: >-
            GitHub 组织（crusoecloud）：Terraform provider、CLI、Go/Python/TypeScript SDK、Slurm 配置、Helm charts、 fastokens Rust
            BPE 分词器；6 个线上 AI 演示；贡献 NVIDIA Dynamo 分词器。
        - label: AI 服务
          detail: >-
            Crusoe Intelligence Foundry（托管推理枢纽）；Crusoe Managed Inference 由 MemoryAlloy 集群级 KV cache 驱动；TTFT 相比 vLLM 提升
            9.9×；开源与独家模型库（Llama、DeepSeek、Qwen3、Kimi、Nemotron 3 Super、Nemotron 3 VoiceChat）。
        - label: 平台服务
          detail: >-
            Crusoe Cloud IaaS：GPU VM（H100/H200/B200/MI300X/A100/L40S）、托管 Kubernetes（CMK）、托管 Slurm、AutoClusters、VPC、RDMA
            InfiniBand（3200 Gbps）、块 / 对象 / 共享存储、Command Center 可观测性；REST API v1、CLI、Terraform。
        - label: 计算与硬件
          detail: >-
            NVIDIA H100、H200、B200（当前 GA）；Rubin GPU + Vera CPU（早期采用者，2026 年末 / 2027 年）；AMD MI300X；GB200 NVL72
            机柜；InfiniBand 网络结构；cloud-hypervisor VM 层。
        - label: 物理 AI 工厂
          detail: >-
            Crusoe Spark 模块化单元（1 MW，交钥匙，≤3 个月交付）；Brighton CO 工厂（352 K sq ft，$200 M+，2026 年 Q3 投产）；超大规模园区：Abilene 1.2
            GW（Oracle/OpenAI 已上线）、Abilene 2 900 MW（Microsoft，在建）、Childress TX、Warrenton MO、第 5 个 Missouri 站点。
        - label: 能源与电力基础设施
          detail: >-
            借助 Digital Flare Mitigation 利用火炬气（120+ 个 DFM 单元）；接入可再生电网；GE Vernova 约 1 GW 燃气轮机；PROENERGY 650 MW；Redwood
            Materials 退役 EV 电池微电网（Tahoe 站点 63 MWh，GWh 管线）；Form Energy 12 GWh 铁空气电池（2027）；Energy Vault 多日储能。
    approximationNotes: 层级顺序反映运营依赖关系（自下而上）。同一层内产品成熟度不同（Spark 工厂单元目标 2026 年 Q3；Vera/Rubin 部署在 2027 年）。能源结构因站点而异。
