      - number: '6.2'
        title: 具名客户证明：云与园区的生产级胜利
        blocks:
          - type: paragraph
            body: >-
              Crusoe Cloud 文档最充分的客户胜利是 Windsurf（前 Codeium），这是一家服务超过 800,000 名开发者的 AI 编程助手平台。 根据 Crusoe 发布的案例研究，Windsurf
              将完整 GPU 推理负载迁移到 Crusoe Cloud，相比 AWS 和 Azure 降低 50% 基础设施成本，并在 12 个月生产期内维持 99.98% 集群可用时间。Windsurf
              的迁移覆盖训练和推理负载，随后在 Managed Inference API 于 2026 年 4 月上线后扩展使用该产品。这一引用构成 Crusoe
              最强的公开证据：客户被点名、结果被量化、生产时长被说明，且来自官方案例研究文档。

              Decart AI 和 BosonAI 是另外两个具名云客户。Decart 在 Crusoe Cloud H100 集群上运行面向人类模拟应用的实时 LLM 推理，并提到低于 200ms
              的响应延迟。BosonAI 使用 Crusoe Cloud 进行多语言 LLM 预训练，并提到成本效率。两家公司都出现在 Crusoe 营销材料中，并由 Cheddarflow 分析佐证。其他具名云客户包括
              Wonderful.ai、Yutori、Oaklet、Sony、Databricks、Together AI、Luma AI 和 Codeium（现 Windsurf），覆盖训练和推理。

              在超大规模园区层，Oracle 和 OpenAI 是德州 Abilene 1.2GW 园区 Phase 1 的锚定租户；该园区已于 2026 年 5 月上线。 Oracle CEO Safra Catz 公开称
              Crusoe 12 个月从破土到投运的周期是「无可匹敌的执行力」。Microsoft 是剩余 900MW 的 Phase 2 锚定租户，截至 2026 年 6 月在建。根据 Data Center
              Dynamics 报道，Meta 据称签署了覆盖德州 Childress 和密苏里 Warrenton 的 1.6GW 协议，但双方均未正式确认。xAI 的 Colossus 2 扩建通过多家媒体与 Crusoe
              基础设施相连，使 Crusoe 成为 Grok 模型训练的建设和 GPU 云伙伴。

              SemiAnalysis 的 ClusterMAX Gold 评级在网络、硬件质量、企业支持响应等八个评分维度上提供了第三方产品验证。 ClusterMAX 评测者指出，首次支持响应低于 6 分钟，GPU
              可用性高于平均水平——与 Windsurf 报告的 99.98% 可用时间一致。 同一评测也指出 Slurm-on-Kubernetes
              产品存在重大运营缺口（缺少开发者工具、缺少默认存储类），为整体强背书加入了必要的细节。
