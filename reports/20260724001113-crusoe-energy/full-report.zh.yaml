            title: 市场规模预测分歧与 SAM 模糊问题
            body: >
              每家分析机构对 AI 基础设施市场的定义都不同：IDC 的 $487B（2026）和 Gartner 的 $37.5B（2026，AI-optimized
              IaaS）衡量的是重叠但不相同的人群。投资者应把所有醒目的 TAM 数字当成方向性坐标，而不是精密输入。Crusoe 的具体 SAM——它在 neocloud
              和超大规模工厂市场中可信可拿下的份额——没有公开披露，也无法仅凭公开数据推导。$487B（IDC AI 基础设施总量）与 $23B（neocloud
              板块）之间的证据缺口，本身就是一个尽调问题，需要内部收入和管线数据来搭桥。
