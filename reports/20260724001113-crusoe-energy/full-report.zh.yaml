      - number: '5.2'
        title: Crusoe Managed Inference 与 MemoryAlloy 引擎
        blocks:
          - type: paragraph
            body: >-
              Crusoe Managed Inference 于 2026 年初推出，是公司差异化程度最高的产品，由基于 MemoryAlloy 技术构建的专有推理引擎驱动。MemoryAlloy
              是一种集群原生内存织物，实现了集群级键值（KV）缓存，让任意 GPU 节点都能即时从本地和远程节点获取 prefix cache，消除并发会话中的重复 prefill 计算。Crusoe 对
              MemoryAlloy 的基准测试显示，相比 vLLM 运行 Llama 3.3 70B，其 time-to-first-token 快 9.9×、token 吞吐高
              5×；该引擎支持持久会话、上下文连续性，并可在整个集群内无缝横向扩展。Crusoe Intelligence Foundry 是面向用户的入口，开发者可通过它访问 Managed Inference
              端点、在几分钟内生成 API 密钥，并试用一套精选模型库：Llama 3.3 70B Instruct、DeepSeek V3 0324、DeepSeek-R1 0528、Qwen3
              235B、Kimi-K2、Gemma 3 12B、GPT-OSS-120B、NVIDIA Nemotron 3 Super 和 NVIDIA Nemotron 3 VoiceChat。两款 Nemotron
              模型都通过 Crusoe 与 NVIDIA 的早期采用者关系登陆 Foundry；该关系于 2026 年 3 月 GTC 公布。Crusoe 还把其高性能 Rust BPE tokenizer 贡献给
              NVIDIA Dynamo 开源推理服务框架，相比 HuggingFace tokenizers 约提速 9×，长 prompt 上最高提速 31×；即便缺少传统 OSS 项目指标，这一动作也加深了 Crusoe
              在工程实践者社区的可信度。MemoryAlloy 的内部架构和训练方法仍为专有，且未经过独立同行评审；这一缺口限制了外部对其性能主张的验证。
            claimRefs:
