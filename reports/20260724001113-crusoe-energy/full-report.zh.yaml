      - number: '8.3'
        title: 可比估值与同业样本
        blocks:
          - type: paragraph
            body: >
              最相关的上市可比公司是 CoreWeave，2025 年 3 月 26 日 IPO 时企业价值 $23B。CoreWeave 向 SEC 提交的 S-1 披露 FY2024 收入 $1.92B（同比增长
              737%），已承诺收入储备为 $8.7B。IPO 隐含约 12x 过去十二个月收入和 4–5x 未来收入。CoreWeave 上市后二级市场市值一度低于 IPO 水平，反映市场对 AI
              基础设施倍数和高客户集中度（申报时 Microsoft 约占收入 60%）的不确定。

              私有可比更不透明。Lambda Labs 是竞争性的推理优化云提供商，分析师报道其二级交易约 4–7x ARR。Scale AI 是相邻 AI 基础设施公司，聚焦数据标注和模型评估，2025 年初在约 $1B
              ARR 上取得约 $14B 私有估值——约 14x ARR——但商业模式明显不同。Anthropic 是有大量基础设施的基础模型公司，据报以约 $3B ARR 支撑 ~$18–25B
              估值，但其垂直整合和护城河属性使其不可比。

              本分析将 Crusoe 的主要同业界定为 IaaS 型 GPU 云公司。代表样本包括 CoreWeave（上市）、Lambda Labs（私有）、Voltage Park（私有、规模更小）和 Nebius（原
              Yandex Cloud，在 Amsterdam 上市）。下表列出这一可比样本。所有私有公司数字均为公开来源中的分析师估计，可能不同于未披露的实际财务；投资人应把它们当作方向性信号，而非精确数字。
