      - number: '6.3'
        title: 采用轨迹：ARR 增长、合同扩张与收入爬坡
        blocks:
          - type: paragraph
            body: >-
              Crusoe Cloud 的 ARR 从 2024 到 2025 年同比增长 150%，同期平均合同价值扩大 17×；这一组合同时显示了量的扩张和交易规模成熟。 17× 合同价值增长反映了从小型初创公司月度
              GPU 预留，转向企业级年度集群承诺；单个企业交易贡献的 ARR 可能超过数十个初创客户合同。 2025 年新客户增长同比 70%，说明顶线 ARR 增长不只是来自存量客户扩张，也包含可观的新客户成分。

              Sacra Research 预计 Crusoe 2026 年总收入约 $2 billion，而 2024 年为 $276 million。这个 7× 复合增长几乎完全由数据中心园区业务驱动，具体是
              Abilene 园区 Phase 1 和 Phase 2 租户协议。Cheddarflow 分析估计，截至 2026 年初，云平台独立 ARR 在 $150–200 million
              区间。这条轨迹值得关注，但必须放在背景中看：Crusoe 总收入仍包含历史 Digital Flare Mitigation（DFM）能源收入和园区建设费用，经常性云 ARR 是重要但少数的一部分。

              Managed Inference 于 2026 年 4 月上线，打开了 token 计费经济客户层：API 优先买方需要推理容量，但不愿承诺预留 GPU 集群。这一层服务的是此前由超大规模推理 API（AWS
              Bedrock、Azure OpenAI）和推理专业初创公司覆盖的市场。若基准在多样化生产负载下仍成立，MemoryAlloy 的 9.9× TTFT 优势会成为吸引这一群体的性能钩子。整体增长图景——云 ARR
              增长 150%、合同价值 17×、新客户增长 70%——对基础设施业务来说很强，反映了真实市场需求。关键尽调问题是，这条轨迹能否持续，还是由两三个不会重复的超大规模承诺前置拉动。
