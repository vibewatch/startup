      - number: '5.5'
        title: 信任、合规、可靠性与已知缺口
        blocks:
          - type: paragraph
            body: >-
              Crusoe Cloud 于 2023 年 12 月获得 SOC 2 Type I 鉴证，并于 2024 年 7 月完成 SOC 2 Type II，完整报告可通过 Crusoe Trust Center
              获取。平台符合 GDPR，99.98% 集群可用时间 SLA 由 AutoClusters 自动节点替换能力支撑。 截至 2026 年 6 月的状态页历史显示，可用性总体较强，但也有明显例外：ICAT 区域在
              2026 年 6 月 17 日发生了两小时负载均衡器宕机。 SemiAnalysis 的 ClusterMAX 评测指出 Slurm-on-Kubernetes 产品存在有意义的可用性缺口——login pods
              缺少 vim、nano、git 和 sudo；CMK 集群没有提供默认 ReadWriteMany StorageClass；容器化负载下可复现 NVML driver mismatch 错误。在 Crusoe
              冰岛设施，20,000 个光纤端面因碎屑（归因于火山灰）需要物理清洁，碎屑导致大范围链路抖动和随机文件系统卸载；据报道 Crusoe 已解决这一具有地域特异性的可靠性风险。SemiAnalysis
              指出，云部门工程师高流动率可能危及 Crusoe 的 Gold 评级。CCPA 合规状态未公开确认。公开记录中没有 MemoryAlloy 相比 AWS Inferentia、Azure AI 或 GCP TPU
              的外部性能基准。Crusoe 任何设施的电力使用效率（PUE）都未披露。
