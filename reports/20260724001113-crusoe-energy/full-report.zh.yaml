      - number: '3.2'
        title: 直接 neocloud 同业画像
        blocks:
          - type: paragraph
            body: >
              CoreWeave 是最强大的直接竞争者。CoreWeave 成立于 2017 年，总部位于 New Jersey 州 Roseland，拥有 NVIDIA 优先合作伙伴资格，可优先获得 H100、H200 和
              Blackwell（B200/GB200）GPU。CoreWeave 2025 年 3 月 NASDAQ IPO 为 neocloud 板块确立了公开市场可比估值，约为 5 倍收入；其客户群偏向前沿 AI
              实验室和企业 AI 平台公司，与 Crusoe 最高端买方高度重叠。相较 Crusoe，CoreWeave 的关键结构性限制在于它不拥有发电资产，也不自建园区级数据中心；它依赖第三方机房托管和电力合同，因此随着
              AI 基础设施市场收紧，更暴露在电力可用性约束下。

              Lambda Labs（San Francisco，2012 年成立）面向开发者和研究 GPU 云板块，提供按需 H100 SXM5 和 A100 实例、快速开通、无最低消费和开发者友好工具。Lambda
              不向电力或数据中心建设做垂直整合。它的销售打法偏自助和批量定价，因此对较小工作负载有竞争力，但对超大规模云厂商承诺或专用园区合同的相关性有限。

              Nebius AI（Amsterdam；NYSE: NBIS）于 2024 年 6 月从 Yandex 拆分，提供 GPU 云基础设施，面向需要数据主权的 AI 公司，尤其是欧盟市场。Nebius 2024 年
              9 月从包括 NVIDIA 在内的投资方募得 $700M。Nebius 声称推理 TCO 比 AWS 优 112%。它对 Crusoe 的主要竞争相关性在欧盟市场；美国重叠有限。作为上市公司，Nebius
              提供了一定财务透明度，而 Crusoe 等私营 neocloud 缺少这一点。

              Vast.ai 运营 GPU 现货市场模式，让买方按现货价格从独立提供商获取分布式 GPU 容量，更像聚合器，而不是基础设施运营商。Vast.ai 可按需扩展到 20,000 颗
              GPU，因此能替代突发型工作负载，但不适合专用预留容量合同。

              neocloud 板块正在承受整合压力：wetheflywheel 2026 neocloud guide 指出，只靠 GPU 租赁价格差异化的供应商正被挤压，长期成功取决于能否向上进入软件和编排层。
