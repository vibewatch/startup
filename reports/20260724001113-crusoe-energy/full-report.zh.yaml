      - number: '1.3'
        title: 融资历史与投资方
        blocks:
          - type: paragraph
            body: >
              Crusoe 的融资路径显示，公司从气候科技种子项目一路演进为大规模 AI 基础设施投资标的。2018 年 12 月，公司完成约 $30M Series A，由 Founders Fund 领投——这家
              Peter Thiel 的风险投资机构在之后每一轮都持续担任主要投资方。2021 年 5 月，公司又从 Bain Capital Ventures 等投资方获得约 $50M Series B，用于扩张 DFM
              业务。

              真正改变公司量级的是 2024 年 12 月的融资：2024 年 12 月 12 日，公司以 $2.8B 估值完成 $600M Series D。Founders Fund
              再次领投，NVIDIA、Fidelity、Long Journey Ventures、Mubadala（Abu Dhabi 主权财富基金）、Ribbit Capital 和 Valor Equity
              Partners 参投。Blue Owl Capital 参与股权轮，并另外帮助从 JPMorgan 安排 $2.3B 项目融资，用于 Abilene 园区第一阶段。发布时 Peter Thiel
              的评论——「AI 最大的风险，是我们做得还不够大。Crusoe 要把我们从野心有限的孤岛上解放出来」——凸显了这轮融资的战略意义。

              2025 年 10 月，Crusoe 完成超额认购的 $1.375B Series E，估值超过 $10B，由 Valor Equity Partners 和 Mubadala Capital 共同领投，超过
              20 家投资方参与，包括 NVIDIA、Fidelity、Founders Fund、T. Rowe Price、Tiger Global Management、Altimeter
              Capital、Franklin Templeton、Salesforce Ventures、Lowercarbon Capital 和 Spark Capital。公司在约 13 轮债务和股权融资中累计融资约
              $3.9B。员工数和私营收入数字没有公开披露；公司尚未公开承诺 IPO 时间表，不过 CEO Lochmiller 曾表示公司最终会上市。
