      - number: '2.2'
        title: 市场规模测算：多视角分析
        blocks:
          - type: paragraph
            body: >
              AI 基础设施市场的分析师预测差异很大，取决于定义边界，因此任何 SAM/SOM 测算都必须多视角交叉校准。最宽口径下，S&P Global Market Intelligence 估计 2025 年 AI
              基础设施支出为 $337B，到 2030 年以 28% CAGR 增至 $1.2T。IDC 预测全球 AI 基础设施支出 2026 年达到 $487B，较 2025 年同比增长 53%。ARK
              Investment Management 的预测更高，认为市场将从 2025 年 $500B 增至 2030 年约 $1.5T。这些宽口径估计同时覆盖超大规模云厂商和专门厂商的硬件、软件与服务；Crusoe
              能直接触达的只是其中一部分。

              缩窄口径后，Gartner 预测 AI-optimized infrastructure-as-a-service（AI-optimized IaaS）——最接近 neocloud 和 Crusoe Cloud
              板块的代理指标——2025 年为 $18.3B，2026 年同比增长 105% 至 $37.5B。这是 Crusoe 云业务最相关的单一 TAM 对标。S&P Global 进一步将
              AI-as-a-Cloud-Service（ACaaS）列为增长最快的 AI 基础设施子板块，2025 年规模 $20B，并以 48% CAGR 增至 2030 年 $145B。

              仅看 neocloud 板块，Synergy Research Group 估计 2025 年收入约 $23B，Forrester 对 2026 年的预测为 $20B（尽管口径可能不同）。SRG 认为该板块到
              2030 年会达到 $180B；IndexBox 预测到 2031 年为 $236B，CAGR 为 46%。多组预测明显分歧，反映定义不一致（有的纳入超大规模云厂商专用 GPU
              服务，有的剔除）；这种分歧本身是尽调缺口，而不是模型错误。

              测算 Crusoe 的可服务市场时，超大规模数据中心开发业务（AI 工厂）和 GPU 云（Crusoe Cloud）必须分开。仅 Abilene 园区全部阶段的建设和基础设施投资就超过 $10B，长期租约锚定
              AI 工厂收入。Crusoe 云 SAM 则更贴近 Gartner 的 AI-optimized IaaS 区间。实际收入数字没有公开披露。
