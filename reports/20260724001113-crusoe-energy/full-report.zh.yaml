      - number: '1.4'
        title: 里程碑与战略演进
        blocks:
          - type: paragraph
            body: >
              Crusoe 的轨迹分为三个清晰阶段：（1）火炬气加密挖矿阶段（2018–2022），（2）转向并建设 AI 云阶段（2023–2024），以及（3）超大规模数据中心开发阶段（2024 年至今）。2020
              年初，COVID-19 封锁压垮石油需求，公司一度接近生死线，被迫转向更贴近可再生能源的站点。这次被迫多元化最终为 AI 转型铺好了位置。

              2024 年第一季度，Crusoe 拿下 Texas Abilene 未来 Stargate AI 数据中心园区的开发合同，成为关键战略节点。Elon Musk 的 xAI
              据称是该场地第一位潜在客户，但后来退出，选择在 Memphis 独立建设「Colossus」超级集群。随后 Oracle 签署长期租约，设施设计目标是经由 Microsoft Azure 向 OpenAI 提供
              100,000+ 颗 NVIDIA GPU。1.2 GW Abilene 园区第一阶段于 2025 年 9 月上线，是有记录以来推进最快的绿地超大规模数据中心建设之一。2025 年 3 月初一场 45
              小时故障引发客户投诉和行业质疑；随后 2026 年 5 月 us-east1-a 区域又发生网络事件，说明运营可靠性仍是最需要跟踪的声誉风险。

              2026 年的产品里程碑包括 Crusoe Edge Zones 上线（2026 年 3 月）、Crusoe Command Center 统一运营平台上线（2026 年 2 月），以及取得 ISO 27001
              / ISO 42001 认证（2026 年 2 月）。2026 年 3 月 NVIDIA GTC 上，Crusoe 宣布加深合作，涵盖成为 NVIDIA Vera CPU 和 Rubin GPU 早期采用者、支持
              NVIDIA Omniverse DSX Blueprint，并向 NVIDIA Dynamo 开源框架贡献专有 Rust BPE tokenizer。
