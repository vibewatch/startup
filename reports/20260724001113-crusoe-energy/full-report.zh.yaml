      - number: '5.3'
        title: 物理基础设施——Crusoe Spark 与超大规模园区
        blocks:
          - type: paragraph
            body: >-
              Crusoe 的物理基础设施业务有两种产品形态：Crusoe Spark，一种预制模块化 AI 工厂单元；以及大型超大规模托管园区。 Crusoe Spark 是交钥匙、类集装箱的模块化数据中心，提供约 1 MW
              高密度算力，集成配电、液冷或风冷、消防，以及为最新加速器构建的 GPU 机柜。单元来自 Crusoe 位于科罗拉多州 Brighton 的 352,000 平方英尺 Spark Factory；该工厂投资超过
              $200 million，年产能最高 100 个模块，工厂制造单元计划在 2026 年 Q3 首次交付。Crusoe Spark 可接入多元电源：在内华达州 Redwood Materials Tahoe
              Campus 的首个公开部署使用二次寿命 EV 电池微电网和太阳能，证明了 99.2% 可用时间。 与 Energy Vault 的合作让 Spark 可从 2026 年起在德州 Snyder 以 25 MW
              规模部署。超大规模侧，德州 Abilene 的旗舰 1.2 GW 园区位于 Lancium Clean Campus 土地上，是 Stargate 计划的主场地；前两栋楼（980,000 sq ft，200
              MW+）已上线，为 Oracle Cloud Infrastructure 服务 OpenAI 的算力需求。为 Microsoft 建设的第二个 900 MW Abilene 园区已于 2026
              年破土。Crusoe 从一开始就共同开发电力和建设，并在科罗拉多、俄克拉荷马和路易斯安那设施中制造长交期电气组件；这种垂直整合深度，相比传统顺序开发压缩了部署周期。 截至 2026 年 6 月，Crusoe
              已签约 4.9 GW AI 基础设施，项目管线超过 40 GW。
