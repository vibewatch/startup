      - number: '7.4'
        title: 客户集中、伙伴依赖与竞争风险
        blocks:
          - type: paragraph
            body: >
              Crusoe 的需求集中是领先风险指标。Abilene Stargate 园区是其旗舰收入项目，后续阶段已出现 Oracle/OpenAI 退出，随后由 Microsoft 承接该容量。Wyoming 1.8
              GW Project Jade 因单一客户要求暂停，客户和原因均未披露。第二项重大安排据称是 Meta 与 Crusoe 签署 1.6 GW
              容量协议；这虽有助于多元化，却也放大了超大型单客户风险事件的模式。相比之下，云服务侧的 Crusoe Cloud 有 Cursor、Decart、Fireworks、Odyssey 和 Together AI
              等具名客户——这些企业规模较小，单个客户集中风险较低，但其合计 ARR 未披露。竞争侧，CoreWeave 2025 年 3 月 IPO 时市值 $23 billion（企业价值约 $30
              billion），2024 年收入 $1.9 billion（同比增长 730%），建立了清晰标杆：Crusoe 按收入倍数相对 CoreWeave 折价，但缺乏同等公开可比性。 AWS、Google Cloud
              和 Azure 继续扩张 AI GPU 容量，资产负债表深度远超 Crusoe。Lambda Labs 和其他新云厂商 仍是价格上有竞争力的替代选项。伙伴依赖方面，Crusoe 与 Tallgrass 的
              Wyoming 电力供应合作现在实际上已暂停；Blue Owl Capital 对 Abilene 园区的 $3.4 billion 合资制造项目融资相互依赖；NVIDIA 股权持股既带来供应链对齐，也可能在
              NVIDIA 开发竞争性云服务时制造潜在利益冲突。
