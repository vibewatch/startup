      - number: '5.4'
        title: NVIDIA 伙伴关系深度与开发者生态
        blocks:
          - type: paragraph
            body: >-
              Crusoe 最深的护城河，是其与 NVIDIA 的垂直整合式对齐。在 GTC 2026，Crusoe 宣布将成为 NVIDIA Vera CPU 早期采用者；Vera CPU 专为 agentic AI
              后训练环境打造，单机柜可支持超过 22,500 个并发 CPU sandbox 环境。 同时，Crusoe 计划在 2026 年末及 2027 年陆续部署 NVIDIA Rubin GPU 和 Vera
              Rubin NLV72 系统。 Crusoe 还采用 NVIDIA Omniverse DSX Blueprint 和 Vera Rubin DSX Reference Design，用于设计下一代 GW 级
              AI 工厂，借助数字孪生做设施可视化，以及 AI 驱动的电力和冷却优化。这让 Crusoe 成为全栈、NVIDIA 原生 基础设施伙伴，而不只是 GPU 容量转售商。开发者侧，Crusoe 维护公开 GitHub
              组织（github.com/crusoecloud），仓库包括 Terraform provider、CLI、Go client library、Slurm 配置、Helm charts、解决方案库，以及
              fastokens Rust BPE tokenizer 仓库（截至 2026 年 6 月仍有活跃提交）。开发者中心托管了六个在线 AI 演示，覆盖在 CMK 上进行多节点 Llama 预训练、在 Slurm
              上进行 PyTorch 分布式训练，以及用 vLLM 和 KubeRay 做 Ray 推理。Crusoe 没有运营一个具备可衡量社区采用指标（stars、contributors、fork
              counts）、可与云原生 OSS 项目相比的重要开源项目；因此，开发者信号证据更多锚定在文档深度、演示质量和 NVIDIA Dynamo 贡献，而不是公开仓库采用度指标。
