      - number: '3.3'
        title: 超大规模云厂商与云替代格局
        blocks:
          - type: paragraph
            body: >
              超大规模云厂商层——AWS、Azure、GCP 和 Oracle OCI——是 GPU 云市场的既有防守方，也是企业买方的默认采购路径。AWS P5 实例提供 8×H100 SXM 配置和 3,200 Gbps
              EFA 网络，用于分布式训练；P5 也通过 AWS SageMaker HyperPod 提供，用于托管 ML 集群部署。Azure Machine Learning 计算集群支持由 H100 支撑的 NDv5
              GPU VM，用于大规模分布式训练。Google Cloud 提供 H100 和 A100 GPU 实例，并配套承诺使用折扣项目。Oracle OCI SuperCluster 在单个裸金属集群中提供 400 颗
              H100 GPU 和 RDMA 网络。

              超大规模云厂商握有的竞争优势是集成：已经在 AWS、Azure 或 GCP 上运行工作负载的企业，可以受益于存储共址、IAM、网络、托管服务和合规框架；独立 neocloud
              不投入大量资源很难复制这套集成护城河。Crusoe 若要赢得企业替代交易，首先必须越过这道集成壁垒。

              不过，超大规模云厂商在 GPU 供给上也受容量约束：Crusoe 的 Microsoft Abilene 900 MW 交易和 Oracle Stargate
              关系之所以存在，正是因为超大规模云厂商建设基础设施的速度赶不上自身承诺。这一供给缺口是 Crusoe 最主要的收入机会。Crusoe 不只是与超大规模云厂商争夺终端用户，也在向它们提供容量。这种「竞争者 +
              容量伙伴」双重角色，在 neocloud 板块并不常见，也形成差异化位置。

              Oracle OCI 的 SuperCluster 产品尤其相关，因为 Oracle 是 Crusoe 的 Stargate 锚定客户之一；Crusoe 根据与 Oracle 和 Microsoft 签署的 15
              年容量协议，建设并运营 Abilene 第一期园区。这意味着 Crusoe 一边与 Oracle OCI 争夺企业 GPU 买方，一边向 Oracle 供应原始容量。

              现状下的内部建设仍是一股重要竞争力量。大型 AI 实验室（Meta、xAI）和资源充足的企业，正在本地或托管设施中建设自有 GPU 集群，绕开超大规模云厂商和 neocloud。Bain Capital
              Ventures 关于 Crusoe 创业论点的文章明确把「在电源地托管」模式视为对传统数据中心建设的切入口。
