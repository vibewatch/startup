      - number: '1.2'
        title: 创始人与领导层
        blocks:
          - type: paragraph
            body: >
              Crusoe 由 Chase Lochmiller（CEO）和 Cully Cavness（总裁兼 COO）共同创立，两人分别带来技术和能源行业能力。Chase Lochmiller 拥有 MIT
              数学、物理学位，以及 Stanford 计算机科学硕士学位，专攻 AI。创立 Crusoe 前，他做过量化交易员，也曾任加密货币投资机构 Polychain Capital
              的普通合伙人，因此深度接触了计算金融，以及后来催生 Crusoe 原始构想的区块链 / 能源交叉地带。

              Cully Cavness 拥有 Middlebury College 地质学学位和 Oxford MBA，并有油气投行背景。他对能源行业和上游油气经济的实操理解，支撑了 Crusoe 最初的 Digital
              Flare Mitigation 业务和监管推进策略，包括直接与 North Dakota 州议会合作，为部署火炬减排系统的公司推动税收减免立法。

              管理层已大幅扩容。关键任命包括 Nadav Eiron 出任云工程 SVP、Erwan Menard 出任 Crusoe Cloud 产品 SVP，以及 Nader Pakfar 出任总法律顾问（房地产），后者于
              2026 年 1 月获任。战略顾问包括 Bill Stein（Digital Realty 前 CEO）、Peter Gross 和 Matt Field。Lochmiller 和 Cavness
              兼具联合创始人与运营角色，公司对二人的关键人依赖度高，接班或离任风险实质存在。
