      - number: '2.6'
        title: 图表与证据
        blocks:
          - type: callout
            title: 电力才是市场决定性护城河——不是资本或 GPU
            body: >
              neocloud 市场已经发生结构性迁移：能否拿到电力接入，而不是 GPU 硬件或风险资本，成了长期竞争位置的首要决定因素。4–10 年电网并网延迟意味着，任何在 2023–2024 年锁定电力的运营商，都拥有
              2026 年及之后的产能。Crusoe 的能源优先基因——滞留气捕获、可再生能源站点筛选、表后发电——最初是气候策略，但在最关键的时间点变成了持久的结构性护城河。We The
              Flywheel（2026）明确把这一点列为 Crusoe 相对 CoreWeave 和其他同业最高分的差异化因素。
            calloutType: insight
            claimRefs:
              - CM030
              - CM037
              - CM038
