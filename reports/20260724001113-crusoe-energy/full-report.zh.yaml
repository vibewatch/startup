    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >
              Crusoe Energy Systems（以 Crusoe 名义运营）是一家总部位于 Colorado 州 Denver 的垂直整合 AI 基础设施公司。公司成立于 2018
              年，起步做法是在油气井口部署模块化数据中心，捕获原本会被燃烧浪费的天然气；这套专有方法注册为 Digital Flare Mitigation®（DFM）。DFM
              把滞留井口气转成电力，给现场计算供能；燃烧效率最高可达 99.89%，标准火炬约为 93%，相较继续放空燃烧可减少约 63% 的 CO2 当量排放。每个 DFM 部署点估计每年消除 8,000 吨 CO2 当量。

              Crusoe 最初把捕获的能源用于 Bitcoin 和加密货币挖矿，但 2023 年 GPU 算力需求激增后，公司根本性转向 AI 云基础设施。Crusoe 借入 $200M 购买 NVIDIA H100
              GPU，并开始提供高性能 AI 和机器学习平台 Crusoe Cloud。到 2024 年 12 月 Series D 时，Crusoe 已把自己定义为「行业第一家垂直整合 AI
              基础设施提供商」，把专有能源策略（滞留气、可再生能源）、面向 AI 优化的数据中心建设和全栈云平台合在一起。公司当前使命是「加速能源和智能的充裕」。

              Crusoe 主要靠长期数据中心租约（由超大规模云厂商级客户的多年合同锚定）以及 Crusoe Cloud 订阅和用量费变现。Texas Abilene 的 1.2 GW 园区由 Oracle
              长期租约锚定，支撑近期收入可见度。Denver 和 Tulsa 的制造设施先在受控环境中安装 GPU 服务器机架，再用卡车运往数据中心场地。
