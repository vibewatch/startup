  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义与边界
        blocks:
          - type: paragraph
            body: >
              Crusoe Energy 处在三个彼此不同但重叠的市场交汇处。第一是 neocloud GPU 云：面向 AI 训练和推理工作负载，按需、预留实例或长期合同提供的专用 GPU 加速 IaaS。第二是 AI
              工厂开发：获取绿地、建设并长期出租吉瓦级数据中心园区，租给超大规模云厂商锚定租户。第三项战略性越来越强，即面向计算的能源采购和发电：捕获滞留气、可再生能源和替代电源，为 AI
              数据中心打底；这个市场正从成本项迅速演化成数千亿美元级战略投资类别。

              AI 计算基础设施的市场边界包括 GPU 加速 IaaS、裸金属 HPC、AI 工厂托管和托管 GPU 云服务。不包括通用云（广义 CPU-only IaaS）、AI 软件和应用层（SaaS、MLOps
              工具）以及实体 ASIC 设计。相邻市场包括面向计算的能源基础设施（数据中心用天然气、核能、太阳能）和 CPU-only 机房托管；后者是较小或非 GPU AI
              工作负载的现状替代方案。关键替代品还包括超大规模云厂商 spot 实例、大学裸金属 HPC 和本地 GPU 集群；相较专用 neocloud 供给，这些方案都存在明显成本、可用性或可扩展性限制。

              GPU-as-a-Service（GPUaaS）是一个独立且快速增长的子领域。Fortune Business Insights 数据显示，该市场 2023 年规模为 $3.23B，预计复合年增长率为
              36%，反映企业正从购买 GPU 转向租用 GPU 访问。广义 neocloud 类别——包括 CoreWeave、Lambda Labs、Nebius、Crusoe 和较小同业——据 Synergy
              Research Group 数据，2025 年收入约 $23B。
