  - id: TE002
    title: Workflow / use-case table
    columns:
      - User job
      - Current workflow problem
      - Uplight solution
      - Measurable benefit
      - Limitation
    rows:
      - - Recruit customers into utility programs
        - Utilities often have fragmented outreach and low enrollment conversion
        - Customer portals, reports, marketplace, and managed engagement integrated with demand programs
        - 268 million annual customer touchpoints indicate scaled outreach surface
        - Public materials do not disclose enrollment conversion benchmarks by product
      - - Forecast flexible DER capacity
        - Grid teams need localized forward-looking visibility on available load flexibility
        - Flex DERMS forecasting across multiple models and concurrent runs
        - 400,000 concurrent forecasts and multi-day capacity forecasts cited publicly
        - No public methodology or error distribution beyond top-line accuracy claim
      - - Dispatch distributed resources during peaks
        - Utilities need reliable year-round flexibility beyond seasonal DR events
        - VPP and demand-management stack dispatches multiple asset classes and program types
        - 8.5 GW flexible capacity and feeder-level dispatch claims support scale thesis
        - Realized event-performance distributions are not publicly disclosed
      - - Measure event impact and optimize programs
        - Utilities need quick M&V and feedback loops to improve events
        - Same-day M&V and optimization workflows built into Flex DERMS and VPP pages
        - Faster operational learning and program tuning if claims are borne out
        - No public audit trail of M&V outputs or savings reconciliation methods
      - - Connect front-office programs to grid operations
        - Customer systems and control-room systems are often siloed
        - Shared data lake, APIs, open protocols, and ADMS or grid-DERMS integrations
        - End-to-end customer-to-control-room architecture is the central differentiation claim
        - Public record stops short of publishing full reference architecture diagrams or deployment case studies
    notes: >-
      Benefit cells mix official scale metrics with workflow inferences; exact ROI varies by utility and is not normalized publicly.
    claimRefs:
      - CE003
      - CE016
      - CE017
      - CE023
      - CE024
      - CE049
  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / component
      - Role
      - Dependency
      - Risk
    rows:
      - - Centralized data lake
        - Standardizes utility, vendor, and application data for analytics and applications
        - Utility data access, internal data governance, and third-party feeds
        - Data-quality issues or tenant-boundary weaknesses could undermine forecasting and personalization
      - - AI and ML forecasting models
        - Generate capacity forecasts, dispatch guidance, and optimization signals
        - Clean historical data, model monitoring, and compute scalability
        - Model drift or opaque accuracy claims could reduce operator trust
      - - Configurable SaaS applications
        - Deliver customer engagement, program management, and operational interfaces
        - Module integration and implementation services
        - Broad surface area can increase release and support complexity
      - - External APIs
        - Connect Uplight workflows into utility systems and partner channels
        - API governance and partner engineering quality
        - Integration failures can delay deployments and customer value capture
      - - Open protocol support
        - Enables connection to third-party devices and grid systems through standards like IEEE 2030.5 and OpenADR
        - OEM certification work and standards-compliant implementations
        - Standards support may still leave edge-case integration friction across device classes
      - - OEM and device ecosystem
        - Brings thermostats, EVs, batteries, and other DER endpoints into programs
        - 40+ OEM relationships and partner maintenance
        - Ecosystem breadth is a strength but creates dependency on partner roadmaps
      - - Upstream grid-systems integration
        - Connects Flex DERMS with grid DERMS, ADMS, and other operations systems
        - Strategic partner cooperation and utility architecture readiness
        - Integration timelines may be long in conservative utility IT environments
    notes: >-
      The public record supports the named layers and dependencies, but not a full engineering decomposition or subsystem-level SLA set.
    claimRefs:
      - CE010
      - CE023
      - CE025
      - CE026
      - CE027
      - CE028
