  evidenceGaps:
    - type: missing-source
      severity: material
      topic: integration-gap
      missingEvidence: Detailed product roadmap or architecture artifact showing what modules are natively unified versus connected post-AutoGrid.
      whyItMatters: Integration depth affects product defensibility, implementation complexity, and margin scalability.
      diligencePath: Request product architecture documentation and release notes that map legacy Uplight modules to AutoGrid-derived orchestration components.
      relatedQuestionRefs: [QE012, QE022]
    - type: missing-source
      severity: material
      topic: reliability-gap
      missingEvidence: Module-level uptime history, incident history, and customer SLA commitments for Flex DERMS, VPP, and related modules.
      whyItMatters: Utility buyers depend on operational reliability and the public record does not prove resilience at production scale.
      diligencePath: Request uptime dashboards, incident postmortems, and contractual SLA language for key modules.
      relatedQuestionRefs: [QE022]
    - type: missing-source
      severity: material
      topic: commercialization-gap
      missingEvidence: SKU-level pricing, module attach rates, and revenue mix between software and managed services.
      whyItMatters: Product breadth is only economically attractive if modules monetize well and do not require excessive services effort.
      diligencePath: Request pricing sheets, module-by-module ARR mix, and implementation gross-margin data.
      relatedQuestionRefs: [QE022]
    - type: conflicting-data
      severity: material
      topic: metric-consistency
      missingEvidence: Reconciled definition for 4.9 GW orchestrated demand versus 8.5 GW flexible capacity worldwide.
      whyItMatters: Investors need consistent KPI definitions to assess scale, growth, and market relevance accurately.
      diligencePath: Ask management to define each metric, its date, geography, and whether one is a subset of the other.
      relatedQuestionRefs: [QE008, QE009]
    - type: missing-source
      severity: minor
      topic: security-gap
      missingEvidence: SOC 2 scope statement, additional certifications, and security-architecture detail beyond summary marketing pages.
      whyItMatters: Trust posture is important in utility procurement and summary claims may omit important control limitations.
      diligencePath: Request the latest SOC 2 Type 2 report, pen-test summaries, and any ISO or privacy-compliance attestations.
      relatedQuestionRefs: [QE015, QE016, QE022]
acknowledgedWarnings:
  - dimension: unverifiedSource
    reason: One cited source was rate-limited during mirrored retrieval, so it is retained only as contextual official evidence and not used for any high-confidence claim.
