      - FO001
  - id: leadership-governance
    title: Leadership and Governance
    body: >-
      Uplight's leadership picture changed materially in 2026 and should be treated as a transition situation rather than
      a settled steady state. Adrian Tuck served as chief executive around the 2019 formation period and remained the key
      public face of the company through much of its post-merger growth. In March 2026, however, Uplight announced that
      CEO Luis D'Acosta would step down, and subsequent coverage and company materials indicated that Hannah Bascom would
      serve as interim general manager from April 2026. That sequence implies a management handoff during the same window
      as the Octopus Energy majority acquisition, raising the likelihood that strategy, reporting lines, and product
      priorities are being re-shaped under new ownership. Public evidence on the board is thinner than evidence on the
      executive transition. Schneider Electric historically held a controlling or major strategic position before the
      Octopus transaction, Rubicon Technology Partners was involved in assembling the platform, and current ownership now
      appears centered on Octopus with Schneider retaining a minority stake. But the public record reviewed here does not
      provide a full, current board roster, committee structure, or minority-protection terms. For diligence purposes,
      the leadership signal is mixed: there is strong evidence of experienced utility-software operators and strategic
      shareholders, but also clear evidence of executive turnover at a pivotal ownership-transition moment. That makes
      governance diligence and post-acquisition operating accountability important follow-up topics.
    claimRefs:
      - CO011
      - CO012
      - CO013
      - CO014
      - CO015
      - CO016
      - CO017
      - CO018
    tableRefs:
      - TO002
  - id: funding-ownership
    title: Funding History and Ownership Structure
    body: >-
      Uplight's funding and ownership history shows a company that was financed as a strategic clean-energy platform more
      than as a conventional venture-backed SaaS startup racing toward IPO. In 2021, Uplight announced a $73 million
      investment led by Schneider Electric and AES, and contemporaneous reporting pegged the company's valuation at about
      $1.5 billion. That financing supported the market narrative that utilities would increasingly pay for customer
      engagement and flexible-load software as the grid decentralized. Earlier backers also included Huck Capital and
      Rubicon Technology Partners, the latter having played a central role in combining Tendril, Simple Energy, and other
      assets. By March 2026 the ownership story had shifted meaningfully: Octopus Energy agreed to acquire a majority
      stake in Uplight, while Schneider Electric said it would remain a strategic minority shareholder. Latitude Media and
      other sector outlets described the transaction as valuing Uplight at roughly $1 billion, implying a valuation reset
      relative to the 2021 private mark even if exact deal terms were not publicly disclosed. That lower estimated value
      can be read in two ways. Positively, it gave Octopus a way to pair Kraken and retail flexibility ambitions with an
      established U.S. utility software footprint. More cautiously, it suggests Uplight did not preserve its peak private
      valuation through the market correction. The company remains privately held and does not publicly disclose a full cap
      table, liquidation preferences, or debt profile.
    claimRefs:
      - CO019
      - CO020
      - CO021
      - CO022
      - CO023
      - CO024
