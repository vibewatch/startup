  - id: product-scope
    title: Product Portfolio and Solution Scope
    body: >-
      Uplight's product portfolio spans several adjacent but operationally linked categories that matter to utility
      customers. Official descriptions consistently position the company across customer engagement, energy efficiency,
      demand response, distributed energy resource management, and virtual power plant enablement. In practice, that means
      Uplight is not only helping utilities communicate with customers or run rebates; it is also helping them shape load,
      enroll devices, forecast flexibility, and dispatch distributed assets in support of reliability and decarbonization
      goals. The company's flexibility management platform is often presented as open and device-agnostic, which is
      important for utilities that operate across fragmented hardware ecosystems. Uplight also links downstream customer
      experience workflows to upstream grid outcomes, allowing utilities to use the same platform family for program
      marketing, enrollment, behavioral efficiency, and operational flexibility. Acquired businesses help explain this
      breadth: FirstFuel deepened analytics and efficiency capabilities, while EnergySavvy and Simple Energy contributed
      customer engagement and marketplace functionality. The result is a utility-facing operating model that mixes software
      subscriptions with managed program delivery and implementation support. For later commercial analysis, the key point
      is that Uplight sells into the utility digitalization and distributed-grid budget rather than into household retail
      software budgets. That narrows customer concentration but increases dependence on utility procurement cycles and
      regulatory program funding.
    claimRefs:
      - CO028
      - CO029
      - CO030
      - CO031
      - CO032
      - CO033
      - CO034
      - CO035
    figureRefs:
      - FO002
  - id: customer-scale
    title: Customer Base, Reach, and Market Footprint
    body: >-
      Public scale markers indicate that Uplight has reached meaningful penetration in the North American utility software
      market even though detailed revenue disclosures remain unavailable. Uplight says it works with more than 85 utility
      clients and reaches over 110 million energy customers through those utility relationships. It also says its platform
      supports approximately 8.5 GW of flexible load, a figure that positions the company as materially relevant in demand
      response and virtual power plant enablement rather than as a niche pilot vendor. These metrics should be interpreted
      as company-claimed operating reach, not as independently audited financial KPIs, but they are still useful for
      calibrating market presence. The customer list is not fully enumerated in a single current public source, yet
      partner announcements and utility case studies show work with large investor-owned and municipal utilities. Uplight's
      emphasis on utility channels means its end-user reach is much larger than its number of direct paying customers.
      This creates leverage if renewals are strong, but it also means a relatively concentrated enterprise customer base
      likely accounts for most revenue. Geography appears centered on the United States, with global employee or customer
      references that imply some broader footprint. For diligence, the right takeaway is that Uplight has scale credibility
      at the market-access level, but not enough public disclosure to infer retention, revenue per utility, or program
      profitability.
    claimRefs:
      - CO036
      - CO037
      - CO038
      - CO039
      - CO040
      - CO041
    tableRefs:
      # removed duplicate TO001
  - id: workforce-culture
    title: Workforce, Culture, and Operating Profile
    body: >-
      Uplight presents itself as a mission-oriented clean-energy employer with a meaningful operating footprint for a
      private utility software company. Third-party people-data sources and company references point to a workforce of
      roughly 700 employees globally, though this should be treated as an approximate current marker rather than a
      precision financial disclosure. The B Corp certification reinforces a public identity around stakeholder governance,
      employee culture, and climate impact, which may help in utility procurement contexts where mission alignment matters.
      At the same time, a business of this size likely carries a material fixed cost base across software engineering,
      implementation, utility program operations, sales, and customer success. Because Uplight sits between enterprise SaaS
      and managed services, headcount intensity may be structurally higher than a pure software company with similar reach.
      Public sources do not provide the detailed breakdown investors would want, such as R&D concentration, international
      distribution, or post-acquisition restructuring plans. Workforce diligence is especially relevant after the Octopus
      transaction because new ownership may look for product integration, cost synergies, or go-to-market consolidation.
      In other words, the employee base is both an asset and a cost center: it embeds utility-domain expertise and program
      delivery capability, but it may also compress margins if growth stalls or managed-service work dominates the mix.
    claimRefs:
      - CO042
      - CO043
      - CO044
      - CO045
      - CO046
  - id: strategic-transactions
    title: Strategic Transactions and Milestones
    body: >-
      Uplight's milestone history is defined more by strategic assembly and ownership change than by a typical sequence of
      named venture rounds. The foundational event was the 2019 merger of Tendril and Simple Energy into the Uplight brand.
      Additional acquisitions or integrations of FirstFuel, EEme, and EnergySavvy expanded the platform's breadth. In 2021,
      Schneider Electric and AES invested $73 million at a reported $1.5 billion valuation, a milestone that publicly
      validated Uplight's category position during the clean-energy software boom. The next major chapter came in March
      2026 when Octopus Energy agreed to buy a majority stake. That event matters not just as a financing outcome but as a
      strategic repositioning: Octopus gains deeper U.S. utility software exposure, while Uplight gains a new parent with
      substantial retail energy and flexibility ambitions. Management change around the same period, including Luis
      D'Acosta's departure and Hannah Bascom's interim operating role, suggests the transaction was accompanied by
      organizational transition. Taken together, these milestones show a company that has repeatedly been valued for its
      strategic fit inside larger energy-platform ecosystems. That may improve long-term strategic durability, but it also
      means independence as a standalone venture-scale outcome appears less likely than it did several years earlier.
