  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 估值历史显示战略相关性，但 2026 年控制权价格更低
        blocks:
          - type: paragraph
            body: >-
              Uplight 最有支撑的财务锚点是估值事件，而不是完整经营报表。2021 年 7 月，Uplight 宣布获得由 Schneider Electric 和 AES 领投的 $73 million
              战略投资；Bloomberg 报道称该融资对公司估值约 $1.5 billion。该轮融资验证了市场当时愿意为与脱碳、客户互动和灵活负荷管理绑定的公用事业软件支付溢价倍数。到 2026 年 3 月，Octopus
              Energy 同意收购 Uplight 多数股权，Schneider Electric 表示将保留少数股权。Latitude Media 基于行业来源称，该交易对 Uplight 的估值约 $1
              billion；即便确切收购价格未公开，这也意味着相对 2021 年私募估值明显下台阶。这并不自动意味着 Uplight 业务缩水三分之一，因为 2021 到 2026 年间更广泛的气候科技和 SaaS
              倍数大幅压缩。即便如此，重定价仍然重要：任何当前投资者都必须基于现时经营表现和战略适配来承销公司，而不是基于周期峰值估值。
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
              - CI006
