chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 企业身份与发展历史
        blocks:
          - type: paragraph
            body: >-
              理解 Uplight 的企业身份，关键是把它看成几家围绕公用事业客户互动、分布式能源管理和能效分析的软件公司被整合后的平台。Uplight 于 2019 年由 Tendril 与 Simple Energy
              合并推出；这两家成熟清洁能源软件厂商背后有 Schneider Electric 等投资方。公开资料和后续投资评论还称，Uplight 的拼装还借助了 FirstFuel、EEme、EnergySavvy
              等收购，使公司的产品底盘比任一前身单独经营时更宽。这轮整合很重要：它解释了为什么 Uplight 今天横跨消费者互动、交易市场与能效项目、需求响应、DER 编排和虚拟电厂赋能，而不是一个单点工具。公司总部在
              Boulder, Colorado，对外定位为一家使命驱动的气候技术公司，主要通过受监管的公用事业公司开展业务，而不是直接面向消费者销售。Uplight 也是认证 B
              Corporation，这释放治理和使命信号，但不能替代财务披露。官方与第三方资料中最一致的描述是：Uplight
              把软件、分析和托管式项目交付结合起来，帮助公用事业公司影响客户负荷、纳入分布式资产，并改善脱碳结果。因此，公司的历史反映了行业融合：2019
              年以来，能效软件、客户体验和电网灵活性编排经过多轮并购被装进一个公用事业平台。
