      - number: '8.8'
        title: 图表
        blocks:
          - type: callout
            title: 战略质量看得见，但价格支撑不完整
            body: Uplight 可以配得上溢价倍数，但报道中的 2026 年估值已经嵌入了大部分溢价；公开 KPI 组合又过于不完整，无法支撑有信心的买入建议。
            calloutType: recommendation
            claimRefs:
              - CV006
              - CV024
              - CV041
              - CV057
          - type: callout
            title: Octopus 买的是市场入口，不只是收入
            body: 最清晰的乐观论点是，Uplight 让 Octopus 直接接入美国公用事业公司、客户参与工作流和灵活性运营；这些能力若靠内部自建，成本高、速度慢。
            calloutType: strength
            claimRefs:
              - CV030
              - CV031
              - CV032
