      - number: '4.6'
        title: 成本结构可能比纯 SaaS 更重，因为公用事业交付依赖人力
        blocks:
          - type: paragraph
            body: >-
              虽然 Uplight 没有公开披露利润率，但其运营模式指向比纯软件供应商更重的成本底座。一家约 700 名员工的公司，服务范围横跨客户互动、能效、需求响应和 DER
              编排，很可能在实施、客户成功、监管项目运营、数据科学、工程，以及设备或集成支持上承担可观成本。长销售周期和公用事业软件常见的定制化要求会进一步放大这些交付负担。因此，即便总留存率（GRR）很强，在平台进一步放大规模或部署标准化之前，贡献利润率也可能落后于更轻量的企业
              SaaS 同行。出售给 Octopus
              这一战略交易也可能说明，公司需要母公司层面的分销、集成或跨市场协同，才能释放更好的经营杠杆。做投资测算时，在拿到详细的队列、毛利率和人力分配数据之前，投资人应假设其利润率结构体面但并非顶尖。
            claimRefs:
              - CI030
              - CI031
              - CI032
              - CI033
          - type: figure
            figureRef: FI003
            claimRefs:
              - CI030
              - CI031
