      - number: '4.2'
        title: 所有权现在以战略投资者为主，Octopus 掌握控制权
        blocks:
          - type: paragraph
            body: >-
              Uplight 的股权结构表看起来由战略和平台投资者主导，而不是由宽泛的后期风险投资财团主导。公开来源将 Schneider Electric、AES、Rubicon Technology Partners 和
              Huck Capital 与公司的融资和组建历史联系起来；Octopus Energy 则在 2026 年 3 月成为多数股东。Schneider 明确表示，Octopus
              交易后它会继续作为少数股东，保留与早期战略所有权结构的一定连续性。Rubicon 的角色在拼装 Tendril、Simple Energy、FirstFuel、EEme 和 EnergySavvy 为后来
              Uplight 的更宽平台时尤其重要，这意味着公司部分价值主张既来自有机产品创造，也来自公司组合。实际财务含义是，Uplight 现在处在战略股东语境里，可能减少独立披露、改变转移定价或商业化
              假设，并提高未来资本配置由母公司优先级驱动的概率。将 Uplight 作为独立资产评估的投资者，应要求当前股权结构表、Schneider 保留的任何股东权利，以及与 Octopus 的任何关联公司安排。
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI010
              - CI011
