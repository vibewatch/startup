      - number: '3.4'
        title: Uplight 最清晰的差异化是统一公用事业客户互动与灵活性
        blocks:
          - type: paragraph
            body: >-
              Uplight 的公开差异化叙事比许多专门厂商更连贯，因为它把客户体验连到运营灵活性。公司自称帮助公用事业公司推动客户获取、项目注册、行为负荷塑造、DER
              参与、调度和计量，而不是停在某一个流程步骤。已有研究中最强的差异点是，Uplight 明确是公用事业
              B2B，而不是为表后资产控制或商户市场价差竞争的纯聚合商。这很重要，因为公用事业公司往往需要监管对齐、白标互动以及接入既有客户项目。第二个差异点是从注册到调度再到 M&V 的全栈工作流宽度。第三个是商业触达：85
              家以上公用事业关系能够带来案例背书、数据访问和采购熟悉度，这是点状方案新进入者缺少的。最后，2024 年收购 AutoGrid 实质增强了 Uplight 将客户互动与 DERMS
              级编排统一起来的主张，缩小了此前相对以电网运营为中心竞争者更明显的缺口。
