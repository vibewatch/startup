        - 涵盖软件、服务和项目价值的广义需求响应市场
        - 中
        - 范围过宽，不能等同 Uplight SAM
      - - VPP 市场层
        - 第三方市场估计 / 2026
        - 全球
        - ~$7.4B (2026)
        - DER 聚合采用带来快速增长
        - 更窄的 VPP 编排层
        - 中
        - 可能低估客户互动和服务
