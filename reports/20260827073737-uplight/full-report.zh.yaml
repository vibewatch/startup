      - number: '6.5'
        title: 合作伙伴生态既是获客层，也是交付层
        blocks:
          - type: paragraph
            body: >-
              Uplight 的生态合作伙伴基础在商业上重要，因为许多客户结果依赖联网设备、安装商、市场平台和相邻软件层。公司材料描述了 65+
              家生态合作伙伴，产品页呈现的是不绑定设备和平台的运营模式，而不是封闭硬件栈。简报中列出的具名合作伙伴包括 ecobee、Google Nest、Honeywell、Tesla、SolarEdge 和
              ChargePoint；保留的公开案例证据直接支持 ecobee 和 Google Nest
              参与客户项目。对公用事业客户来说，这个生态重要，因为软件供应商能接入家庭和企业已经使用的装机基础时，注册和调度经济性会改善。它也意味着 Uplight
              赢下初始互动或市场平台工作流后，可以通过推出新的设备支持项目在账户内扩张。代价是依赖：Uplight
              客户价值主张的一部分依赖合作伙伴可用性、互操作性和渠道配合。从客户分析角度看，合作伙伴层既应被视为增长助推器，也应被视为执行复杂性的来源。
            claimRefs:
              - CU028
              - CU029
              - CU030
              - CU031
              - CU032
              - CU033
