      - number: '5.6'
        title: 部署模式、实施依赖与路线图信号
        blocks:
          - type: paragraph
            body: >-
              Uplight 的部署模式看起来既依赖软件许可，也同样依赖集成广度和托管项目执行。官方产品页反复强调交钥匙服务、与电网 DERMS 和 ADMS
              提供商的战略合作、生态连接，以及支持多种项目类型、设备运行边界和市场机制的能力。这意味着实施能否成功，取决于上游公用事业数据访问、下游设备和 OEM
              配合，以及顺利接入电网运营系统。好处是，对于偏好预集成工作流的公用事业公司，这种架构可以缩短价值实现时间。代价是，它会制造外部依赖风险，并可能拉长实施周期。路线图信号可见，但公开细节不深。2026 年 10
              月官网仍围绕 AI 驱动预测、预测调度、电池和控制室可视化来呈现平台，说明公司继续聚焦分布式负荷编排和电气化。不过，Uplight
              不发布公开变更日志、发布历史、正常运行时间记录或开放产品路线图。因此，投资人有足够证据认为平台已经运营部署且仍在扩张，但仅凭公开记录，还不足以对发布速度、实施周期或可靠性 SLA 做基准判断。
