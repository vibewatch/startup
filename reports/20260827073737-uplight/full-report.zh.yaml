      - number: '1.2'
        title: 领导团队与治理
        blocks:
          - type: paragraph
            body: >-
              Uplight 的领导层在 2026 年发生实质变化，应视为过渡状态，而不是稳定常态。Adrian Tuck 在 2019 年公司组建前后担任
              CEO，并在合并后增长的大部分阶段继续是公司最重要的公开代表。不过，Uplight 在 2026 年 3 月宣布 CEO Luis D'Acosta 将离任，随后媒体报道和公司资料显示 Hannah Bascom
              自 2026 年 4 月起出任临时总经理。这一顺序意味着，管理交接与 Octopus Energy
              多数股权收购处在同一窗口，战略、汇报线和产品优先级很可能在新股东控制下重塑。董事会公开证据比高管更少。Octopus 交易前，Schneider Electric 历史上持有控股或重要战略地位；Rubicon
              Technology Partners 参与拼装平台；当前所有权看起来以 Octopus 为中心，Schneider
              保留少数股权。但本报告审阅的公开记录没有给出完整的当前董事名单、委员会结构或少数股东保护条款。尽调上，领导层信号参半：有充分证据显示公司拥有经验丰富的公用事业软件运营者和战略股东，但也有清楚证据显示，在关键所有权过渡时点出现高管更替。这使治理尽调和收购后经营问责成为重要后续议题。
