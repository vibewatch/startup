      - number: '1.8'
        title: 公开记录限制与关键尽调缺口
        blocks:
          - type: paragraph
            body: >-
              Uplight 公司概况公开记录的主要弱点，不是业务做什么不清楚，而是缺少硬运营和财务披露。没有足够新的公开收入、年经常性收入（ARR）、利润率、流失率或自由现金流图景。约 $1 billion 的 2026
              年交易估值来自独立行业报道，而不是完整披露的购买协议；公司 2021 年前后 $1.5 billion
              估值作为直接定价锚已经过时。治理透明度也不完整，因为本报告审阅的公开记录没有清楚列出当前董事会构成、董事会独立性和收购后股东权利。另一个问题是，虽然 Uplight
              的公用事业覆盖和灵活负荷指标亮眼，但这些数据大多由公司自称，而非独立审计。一个反向信号是 2021 到 2026
              年之间估值似乎下滑，可能反映市场条件、战略重定价或业务表现因素，公开资料无法彻底拆开。另一个谨慎点是，Octopus 的多数股权可能随着时间推移降低 Uplight
              的独立披露，尤其是在公司被更紧密吸收到私有战略母公司之后。正确的尽调做法，是把公司视为具有战略重要性、但在管理层材料和交易文件提供前财务披露不足的资产。
