      - number: '1.6'
        title: 员工、文化与运营画像
        blocks:
          - type: paragraph
            body: >-
              Uplight 对外呈现为使命导向的清洁能源雇主，并且作为私有公用事业软件公司已有不小运营足迹。第三方人员数据来源和公司表述指向全球约 700 名员工，但这应视为当前近似标记，而非精确财务披露。B Corp
              认证强化了围绕利益相关方治理、员工文化和气候影响的公众身份；在强调使命契合的公用事业采购语境中，这可能有帮助。同时，如此体量的企业很可能在软件工程、实施、公用事业项目运营、销售和客户成功上承担不小固定成本。Uplight
              介于企业 SaaS 和托管服务之间，员工强度可能结构性高于触达规模相近的纯软件公司。公开来源没有给出投资者想要的细分，例如研发集中度、国际分布或收购后重组计划。Octopus
              交易后，员工尽调尤其重要，因为新股东可能寻求产品整合、成本协同或商业化整合。换句话说，员工基础既是资产，也是成本中心：它沉淀了公用事业领域专业能力和项目交付能力，但如果增长停滞或托管服务工作占比过高，也可能挤压利润率。
