      - number: '1.7'
        title: 战略交易与里程碑
        blocks:
          - type: paragraph
            body: >-
              Uplight 的里程碑历史更多由战略拼装和所有权变化定义，而不是典型的具名风险轮次序列。基础事件是 2019 年 Tendril 与 Simple Energy 合并为 Uplight
              品牌。FirstFuel、EEme、EnergySavvy 等后续收购或整合拓宽了平台。2021 年，Schneider Electric 和 AES 以据报道 $1.5 billion 估值投资 $73
              million；这在清洁能源软件热潮中公开验证了 Uplight 的品类位置。下一章发生在 2026 年 3 月，Octopus Energy
              同意购买多数股权。这件事不只是融资结果，也是战略重新定位：Octopus 获得更深的美国公用事业软件敞口，Uplight 则获得一个在零售能源和灵活性上有强烈野心的新母公司。同一时期的管理层变动，包括 Luis
              D'Acosta 离任和 Hannah Bascom
              的临时运营角色，表明交易伴随组织过渡。合在一起，这些里程碑说明公司反复因嵌入更大能源平台生态的战略适配而获得估值。长期战略韧性可能因此提高，但也意味着，与几年前相比，作为独立风险投资规模退出的概率更低。
