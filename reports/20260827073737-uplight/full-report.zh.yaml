      - number: '4.4'
        title: 估计 ARR 增长在估值压缩后仍然健康
        blocks:
          - type: paragraph
            body: >-
              如果 2025 年约 $72.7 million、2026 年约 $103.1 million 的年经常性收入（ARR）估算路径大体正确，那么即使估值倍数回归常态，Uplight
              的增速仍会快过许多成熟公用事业软件同行。隐含的 ARR 同比增加约 $30.4 million，约 42%，说明这项资产的商业相关性仍足以吸引 Octopus 作为控股买方入场。按估计 2026 年 ARR
              基数计算，接近 $1 billion 的 2026 年企业价值对应约 9.7x EV/ARR 倍数；而 2021 年 $1.5 billion
              估值对应这一收入规模的倍数会高得多。这个落差符合当时市场环境：缺少公开盈利能力证据时，投资人不再愿意为清洁能源软件支付激进倍数。换句话说，公司增长仍可能体面，但因为市场基准和风险偏好变了，估值可以下跌。本章的关键财务解读因此不是
              Uplight 停止增长，而是其增长大概率已不再享有 2021 年式定价。
