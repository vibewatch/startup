      - number: '6.6'
        title: 留存、重复使用与持久性信号
        blocks:
          - type: paragraph
            body: >-
              留存是 Uplight 公开客户记录中最薄弱的部分，不是因为业务一定缺乏持久性，而是因为证据间接。公用事业软件和项目平台一旦嵌入客户沟通、市场平台、激励和需求侧运营，往往具备粘性；Uplight
              的多工作流定位理论上也应支持续约和交叉销售。具名重复证据也存在，即一些公用事业公司被呈现为从一个客户场景扩展到另一个场景，例如把市场平台、设备、充电和灵活性项目组合起来。但保留的公开来源没有披露
              NRR、GRR、logo
              流失、平均合同期限、续约率、队列存续或满意度指标，也没有提供可量化投资测算的形式。这个缺口重要，因为一家公司可以拥有许多可识别的公用事业客户，却仍然扩张疲弱或经济性不均。因此，证据支持一个基于嵌入式公用事业工作流和项目广度的定性持久性假设，但不支持已经验证的留存结论。尽调中，应要求
              Uplight 提供续约队列、按公用事业细分的总留存率，以及头部账户的模块扩张历史。
            claimRefs:
              - CU034
              - CU035
              - CU036
              - CU037
              - CU038
              - CU039
      - number: '6.7'
        title: 扩张逻辑、集中风险与采购摩擦
        blocks:
          - type: paragraph
            body: >-
              Uplight 的客户模型给出可信的先落地再扩张叙事，但也把商业风险集中到有限的大买家群体。赢下一个公用事业账户，就可能打开客户互动、费率沟通、市场平台、EV 和恒温器优惠、托管充电、DER
              编排以及更广泛灵活性项目等机会。这意味着，如果采用范围随时间扩大，每个客户的钱包份额可能相当可观。案例库和会议议程中的公开证据显示，同一公用事业环境存在多个切入点，支持扩张逻辑。同时，如果客户基础是 85+
              家公用事业公司，而不是数千个小账户，收入集中和续约时点几乎肯定重要。公用事业采购周期慢、受监管且对项目绩效证据敏感，因此一个大客户延迟就可能对增长造成不成比例影响。本章因此认为客户扩张可信且具有战略吸引力，但在管理层数据展示收入分布和续约画像之前，集中度、合同依赖和采购摩擦仍是重大未解风险。
            claimRefs:
              - CU040
              - CU041
              - CU042
              - CU043
              - CU044
              - CU045
      - number: '6.8'
        title: 反向信号与剩余客户尽调问题
        blocks:
          - type: paragraph
            body: >-
              客户记录中的主要反向信号不是公开的大规模流失事件，而是缺少投资人通常需要的证据，无法把广泛市场触达与持久、盈利的客户关系区分开。公开案例研究生态自然会强调成功，聚合页面有助于找到具名部署，但不能替代经审计留存数据或排序客户名单。关于
              VPP 和灵活性采用的行业评论还警示，公用事业公司可能面临注册摩擦、激励依赖和实施复杂性，这会让客户扩张慢于 logo 数所暗示的速度。Uplight 关于 85+ 家公用事业公司、110 million+
              能源客户和 8.5 GW
              灵活负荷的客户主张，方向上可能都是真的，但在本次保留公开记录中，仍主要来自公司自称或营销材料中介。因此，本章明确列出围绕集中度、续约、合同条款以及生产与试点拆分的证据缺口。客户结论对商业相关性为正面，对披露完整性为负面：Uplight
              看起来拥有真实客户基础，但外部仍无法干净量化其质量。
            claimRefs:
              - CU046
              - CU047
              - CU048
              - CU049
              - CU050
              - CU051
