      - number: '1.3'
        title: 融资历史与所有权结构
        blocks:
          - type: paragraph
            body: >-
              Uplight 的融资和所有权历史显示，公司更像是按战略清洁能源平台融资，而不是一家冲刺 IPO 的传统风投支持 SaaS 初创公司。2021 年，Uplight 宣布获得由 Schneider Electric
              和 AES 领投的 $73 million 投资；同期报道把公司估值定在约 $1.5
              billion。该融资支撑了当时的市场叙事：随着电网去中心化，公用事业公司会越来越愿意为客户互动和灵活负荷软件付费。早期支持者还包括 Huck Capital 和 Rubicon Technology
              Partners，后者在合并 Tendril、Simple Energy 及其他资产时起到核心作用。到 2026 年 3 月，所有权故事明显转向：Octopus Energy 同意收购 Uplight
              多数股权，Schneider Electric 表示将继续作为战略少数股东。Latitude Media 和其他行业媒体称，交易对 Uplight 的估值约为 $1
              billion；即便确切条款未公开，这也意味着相对 2021 年私募估值的重定价。这个较低的估计值可以两面看。乐观地说，它让 Octopus 能把 Kraken 和零售灵活性野心，与 Uplight
              既有美国公用事业软件足迹配在一起。谨慎地说，它表明 Uplight 没有在市场调整中守住私募峰值估值。公司仍为私有公司，未公开完整股权结构表、清算优先权或债务状况。
