      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              Uplight
              的商业路径受一个事实塑造：买方、用户和付款方不是同一主体。直接买方通常是公用事业公司或零售能源供应商；付款方可能是公用事业公司的客户项目预算、电网现代化预算，或监管批准的成本回收机制；终端用户则是注册设备或改变用能行为的家庭或商业场所。住宅项目重要，因为恒温器、EV
              和电池是灵活负荷聚合最容易放大的渠道；但商业和工业客户仍然关键，因为单个站点的削减规模更大、ROI 更显性。公开细分数据支持商业建筑占需求响应市场
              27.8%，说明即便住宅注册叙事主导媒体报道，这一细分也大到不能忽视。同时，服务占需求响应市场的 32%，意味着公用事业公司继续购买执行能力，而不只是软件。这一组合与 Uplight
              软件加托管项目模型一致。采用通常从一个公用事业目标开始，例如削峰、容量采购或客户互动，随后进入项目设计、必要时的监管审批、设备伙伴集成、客户注册、调度和计量绩效。嵌入后，这条长路径可以支撑耐久合同，但会拖慢新客户获取速度。
