      - number: '5.4'
        title: 技术架构与互操作层
        blocks:
          - type: paragraph
            body: >-
              Uplight 的公开技术架构围绕集中式数据湖、AI 和机器学习模型、可配置 SaaS 应用，以及灵活外部 API 展开。平台页称，这一共享层每小时摄入 30 billion 个数据点，运行 400,000
              个并发预测，并为自有应用和外部 API 提供动力。DERMS 页面补充了更具体的架构主张：开放 API、支持 IEEE 2030.5、与上游电网 DERMS 和 ADMS
              集成，并在客户触点、OEM、能源市场和公用事业系统之间互操作。VPP 页面还声称支持 40+ 家 OEM 和 10+
              个开放协议。这些信号合起来支持一个判断：互操作性是真实的平台能力，不只是愿景式营销话术。从架构看，最可能的模式是共享数据和预测底座，为项目管理、资产监控、客户通知、调度和测量服务供能。不过，Uplight
              没有公开披露底层云服务商、数据驻留架构、除 IEEE 2030.5 和 OpenADR 之外的具体 API 标准，或 Uplight 自建代码与 AutoGrid
              收购技术之间的确切分工。用于投资测算时，证据支持其具备广泛集成准备度，但细节仍不足以完整评估技术栈复杂度、多租户边界，或各子系统的运营韧性。
            claimRefs:
              - CE023
              - CE024
              - CE025
              - CE026
              - CE027
              - CE028
              - CE029
      - number: '5.5'
        title: AutoGrid 收购与能力扩展
        blocks:
          - type: paragraph
            body: >-
              2024 年 2 月收购 AutoGrid，是理解 Uplight 如何强化产品和技术位置的核心。Uplight
              的收购页面称，交易扩展了合作伙伴、项目、客户互动深度，以及在全球创造和管理灵活容量的能力。页面还描述，合并后平台把 Uplight 的客户互动专长，与 AutoGrid
              覆盖需求响应、DERMS、ADMS、VPP、微电网、电网级储能和能源市场接入的灵活性管理平台结合起来。该页面的快速参考部分援引：交易时管理 8,300+ MW 灵活资源，服务 10 大公用事业公司中的 8
              家，以及 17 个国家里 5 大全球能源公司中的 2 家。这些事实说明，AutoGrid 集成提升了 Uplight 产品的地理深度和技术深度，尤其适合需要预测调度和电网运营级 DER
              编排的公用事业公司。战略上，关键产品含义是 Uplight 可以把公用事业客户互动和招募优势，与更深的编排技术结合起来，让 Flex DERMS
              更可信。剩余尽调问题是集成成熟度：公开材料正面呈现这次组合，但没有披露截至 2026 年还剩多少产品整合、代码库统一或组织整合工作。
            claimRefs:
              - CE030
