  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户群概览
        blocks:
          - type: paragraph
            body: >-
              Uplight
              的客户群最好理解为以公用事业公司为中心的企业客户组合，同时拥有大得多的下游消费者触达。直接客户主要是电力和燃气公用事业公司及相关能源供应商，终端用户则是这些公用事业公司通过能效、需求响应、费率、电气化和分布式能源项目服务的家庭和企业。在公司页面、会议材料和交易报道中，重复最频繁的规模指标是
              85+ 家公用事业客户、触达 110 million+ 能源客户，以及约 8.5 GW 在管灵活负荷。这些指标是公司声称，不是经审计财务披露，但与 Uplight
              作为规模化电网灵活性和客户互动平台，而非小众试点供应商的定位一致。现有客户基础也看起来具有战略价值，因为相对有限的公用事业 logo
              可以打开巨大的下游参与人群。这意味着单看客户数会低估触达范围，但也意味着企业客户集中度可能比表面 logo 总数更重要。因此，公开证据支持 Uplight
              拥有有意义客户基础这一主张，同时仍未回答这些触达有多少深度部署、产生收入，或由多年合同锁定。
