      - number: '4.3'
        title: 收入估计依赖三角测算，而不是公司披露 KPI
        blocks:
          - type: paragraph
            body: >-
              Uplight 未在保留来源集中公开披露经审计收入、ARR 或自由现金流，因此任何经营收入讨论都必须明确标注为估计。最强的公开经营标记，是公司自称服务 85 家以上公用事业客户、触达 110 million
              以上能源客户，并支撑约 8.5 gigawatts 灵活负荷；另有第三方迹象显示员工约 700 人，且公用事业项目服务交付范围较广。对照这些规模信号，一个低于 $100 million 的 ARR
              轮廓，对于收入混合了软件和托管项目的私有公用事业软件平台来说是合理的；而数亿美元 ARR 轮廓则难以与估计的 2026 年控制权估值和更广泛披露缺失相协调。本章工作估计把 2025 ARR 设为约 $72.7
              million，2026 ARR 设为约 $103.1 million，意味着约 42% 年同比增长。这些数值应读作估值和敏感性工作的分析性占位，而不是已确认的公司报告。估计的主要目的，是明确 Uplight
              大约 $1 billion 估计交易价值要与其战略相关性相互解释时，需要怎样的规模。
