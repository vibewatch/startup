      - number: '5.7'
        title: 信任、安全、隐私与合规控制
        blocks:
          - type: paragraph
            body: >-
              Uplight 在安全态势上的公开证据多于其他一些运营细节，但记录仍有缺口。平台页称，专门的安全与合规团队负责端点检测与响应、安全监控、漏洞扫描和渗透测试，认证外部审计员会在 SOC 2
              合规流程中审查控制。链接的安全简报进一步描述了经过独立审计的 SOC 2 Type 2 报告，以及安全、隐私和合规一体化方法。这些说法有用，因为评估 DER
              编排和客户数据平台的公用事业公司，通常需要看到控制成熟度和正式鉴证两方面证据。同时，本次审阅的公开材料没有清楚披露 ISO 27001
              状态、具体隐私框架、详细数据留存控制，或产品级正常运行时间与事件报告。换句话说，Uplight
              看起来具备真实的企业级安全态势，但公开证据仍是选择性的、带有营销口径。尽调结论是，信任控制对初筛构成相对优势，但买方在评估平台风险前，仍应索取实际 SOC 2 报告范围、渗透测试摘要、安全架构文档和任何事件历史。
