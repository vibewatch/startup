      - number: '5.2'
        title: Demand Stack 与模块架构
        blocks:
          - type: paragraph
            body: >-
              在第 5 章里，Demand Stack 是 Uplight 最清晰的产品包装结构，因为它把公司声称能解决的主要公用事业任务整合进一个组合。官网 Demand Stack
              页面和网站导航显示，模块族覆盖能效与电气化、费率互动、需求管理、虚拟电厂和 DER 管理；平台页还增加了共享技术层，包括集中式数据湖、可配置 SaaS 应用、AI 模型和外部
              API。这一架构指向中枢辐射式设计：通用数据、预测和互操作服务，供给专门的用户侧应用和公用事业项目。从客户工作流看，公用事业公司可以先用市场平台、报告和门户等面向客户的产品切入，再把这些互动延伸到灵活负荷项目注册和调度。Uplight
              的公开产品语言反复强调从招募、事件管理到测量与验证的端到端路径，而不是孤立单点功能。这种集成叙事是有意义的差异化主张，但投资人应注意，公司没有公开提供细粒度 SKU 图谱、模块级定价，或旧 Uplight 模块与
              AutoGrid 衍生编排层之间的明确切分。平台显然很宽；剩余尽调问题是，营销外衣下面到底有多原生统一。
