          values:
            - 母公司支持和存量客户基础
            - 临时架构可能不会很快稳定
        - label: 网络安全
          values:
            - 基础法律 / 信任界面存在
            - 详细保障和事故历史证据薄
        - label: 竞争压力
          values:
            - 公用事业客户覆盖，以及互动 + 灵活性的一体化叙事
            - 对手可能在特定工作流更深，或捆绑能力更强
    claimRefs:
      - CR009
      - CR018
      - CR028
      - CR037
      - CR045
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 建议维持跟踪，因为战略强度被已经偏高的价格和不完整 KPI 披露抵消。
    data:
      nodes:
        - id: scale
          label: 85+ 家公用事业公司和 8.5 GW 灵活负荷
        - id: strategy
          label: 契合 Octopus 进入美国市场的战略
        - id: price
          label: 披露估值约 US$1B
        - id: multiple
          label: 按给定 US$103M ARR 隐含约 9.7x ARR
        - id: opacity
          label: 无公开 NRR、利润率或服务组合证据
        - id: rec
          label: 建议 = 跟踪
      edges:
        - from: scale
          to: strategy
        - from: strategy
          to: rec
        - from: price
          to: multiple
        - from: multiple
          to: rec
        - from: opacity
          to: rec
    approximationNotes: null
    claimRefs:
      - CV006
      - CV024
      - CV030
      - CV041
  - id: FV002
    title: 估值敏感性
    type: bar
    summary: Uplight 隐含倍数高于广义软件中位数，但低于高溢价公用事业软件篮子。
    data:
      items:
        - label: Uplight 2026 年隐含值
          value: 9.7
        - label: ScaleXP 2026 年公开平均值
          value: 6.2
        - label: Multiples.vc 横向 SaaS
          value: 2.2
        - label: Multiples.vc BI 与分析
          value: 3.2
        - label: Windsor Drake 规模化 SaaS 中点
          value: 6.5
        - label: Acquiry 成长型 SaaS 中点
          value: 6.5
        - label: Multiples.vc 能源与公用事业软件
          value: 13.2
    approximationNotes: 区间基准使用中点；由于确切交易结构未披露，披露的 Uplight 估值被视为企业价值代理。
    claimRefs:
      - CV021
      - CV022
      - CV023
      - CV024
      - CV025
      - CV026
      - CV027
  - id: FV003
    title: 估值 / 回报区间
    type: range
    summary: 基础价值聚集在披露的交易锚点附近，牛熊情景由 KPI 质量驱动。
    data:
      items:
        - label: 熊市价值区间
          low: 450
          high: 700
        - label: 基准价值区间
          low: 800
          high: 1100
        - label: 牛市价值区间
          low: 1300
          high: 1600
        - label: 2021 年参考标记
          low: 1500
          high: 1500
    approximationNotes: 区间值是以 US$ 百万美元为单位的情景估算，基于披露锚点和基准倍数区间构建，不是引用的交易条款。
    claimRefs:
      - CV013
      - CV046
      - CV047
      - CV048
      - CV049
      - CV050
  - id: FV004
    title: 投资 KPI
    type: kpi
    summary: 战略契合度得分高，证据质量和经济性可见度仍只是中等。
    data:
      items:
        - label: 市场进入能力
          value: 8
        - label: 产品广度
          value: 8
        - label: 战略买方契合度
          value: 9
        - label: 收入质量可见度
          value: 4
        - label: 利润率可见度
          value: 3
        - label: 估值吸引力
          value: 5
        - label: 证据质量
          value: 6
    approximationNotes: KPI 分数是基于有证据支撑的主张作出的分析判断，用于投委会框架，不是公司披露的指标。
    claimRefs:
      - CV031
      - CV041
      - CV056
      - CV060
