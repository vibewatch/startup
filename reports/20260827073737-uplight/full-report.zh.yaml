      - number: '6.4'
        title: 具名客户证据与成果质量
        blocks:
          - type: paragraph
            body: >-
              具名客户证据是 Uplight 较强的公开资产之一，因为多个来源指向可识别的公用事业公司和已描述用例，而不是匿名推荐语。本次保留来源中可见的客户包括 SMUD、Puget Sound
              Energy、Dominion Energy Virginia、Alliant Energy、PSEG Long Island、Commonwealth Edison、Orange and Rockland
              Utilities、Pioneer Community Energy、Consumers Energy 和 Evergy。相关用例覆盖 EV
              充电器采用、费率项目注册、低收入节能、客户奖励、市场平台互动、托管充电、承包商工作流自动化和虚拟电厂战略。这种广度重要，因为它显示 Uplight
              不局限于一个狭窄客户用例。不过，各条证据质量不同。有些来源引用了具体结果或客户方发言人，另一些主要确认了关系或会议露出。因此，本章把有具体结果的近生产部署，与议程参与或目录式客户引用等较软证据区分开。整体看，具名客户证据支持真实商业渗透和多样用例，但不提供按收入排序的完整客户名单，也不能完整展示每个
              logo 的生产成熟度。
