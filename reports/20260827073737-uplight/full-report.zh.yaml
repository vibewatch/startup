      - number: '3.2'
        title: 直接竞争者分为公用事业既有厂商和灵活性专门厂商
        blocks:
          - type: paragraph
            body: >-
              Oracle Utilities、Itron 和 Landis+Gyr 是最可信的宽平台竞争者，因为它们已经销售核心公用事业系统，并能从相邻控制点扩张。Oracle Utilities
              围绕客户关怀、表计数据管理、停电、分析和电网运营定位自己；凡是采购偏好企业套件整合的地方，它都危险。Itron 结合
              AMI、分布式智能、电网边缘软件和需求侧产品，当公用事业公司希望一个供应商覆盖网络层和设备层时尤其相关。Landis+Gyr
              同样把智能计量、电网管理、灵活性和配电自动化叙事组合在一起。相比之下，Voltus、CPower、Leap 和 Enel X
              更像项目型竞争者：当公用事业公司或市场参与者优先考虑需求响应注册、调度、市场准入和结算密度时，它们最强。这些公司并不总是复制 Uplight 的客户互动叙事，但可以在事件执行、C&I 集中度或批发市场变现上击败
              Uplight。结果是一场双线战：Uplight 必须同时守住平台宽度和调度相关性。
