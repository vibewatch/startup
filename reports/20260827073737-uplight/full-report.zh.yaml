      - number: '2.5'
        title: 采用约束与摩擦
        blocks:
          - type: paragraph
            body: >-
              同一市场也有真实采用约束，限制 Uplight 快速触达 TAM 的比例。公用事业采购周期慢，许多项目在预算落实前需要监管审批或成本回收待遇。DER/VPP
              经济性还取决于市场规则、计量与验证框架、并网现实和客户激励设计，因此有利的联邦政策标题不保证快速部署。品类仍面对公用事业系统碎片化、设备互操作性挑战，以及客户在调度事件中让渡控制权的意愿不均。项目成功往往需要服务密集型执行，这提高交付复杂度，也可能压缩相对纯
              SaaS 的利润率。市场报告方法也有噪音：有些统计硬件、激励和项目价值，另一些只拆平台收入，投资者比较变得复杂。Uplight 的另一个约束是集中在公用事业买方，而不是广泛 SMB
              客群；赢下并续约有限数量的大型公用事业账户，比海量销售更重要。这些摩擦不推翻市场逻辑，但意味着如果预算、政策落地或项目运营卡住，收入增长可能落后于灵活容量的宏观需求。
            claimRefs:
              - CM028
              - CM029
              - CM030
              - CM031
              - CM032
              - CM033
              - CM034
      - number: '2.6'
        title: 市场结构为什么影响估值
        blocks:
          - type: paragraph
            body: >-
              市场结构直接影响 Uplight 估值，因为投资者不应把这个品类当普通横向
              SaaS。大型服务成分支撑收入规模，但如果托管项目交付占比很高，可能拉低软件式毛利率和估值倍数。商业楼宇和公用事业企业细分可以支撑更大合同和更强留存，但销售周期和实施负担更重。监管赋能，尤其是 FERC
              Order 2222 和州级灵活性项目的实际推出，可以改善长期市场深度；但采用不均意味着估值要反映时间风险，而不只是终局 TAM。若公用事业公司偏好一体化客户互动与灵活性平台，而不是拼接多个供应商，Uplight
              将受益，因为这会提升钱包份额和切换成本。但过宽的市场口径会遮住一个事实：真正可触达的机会受北美公用事业采购模式约束，也受公司把项目活动转化为可重复软件经济性的能力约束。因此，合理的估值姿态，是按一个增长但实施负担重的公用事业灵活性市场来承销
              Uplight，而不是按不受约束的全球能源转型支出。
            claimRefs:
              - CM035
              - CM036
              - CM037
              - CM038
              - CM039
      - number: '2.7'
        title: 受证据约束的规模测算缺口
        blocks:
          - type: paragraph
            body: >-
              最大剩余不确定性不是市场是否存在，而是 Uplight 作为独立实体现实中能赢下多少。为本章审阅的公开来源支持 TAM 层面的需求响应和 VPP 估计，但没有按地理、公用事业类型或项目组合隔离 Uplight
              按收入加权的
              SAM。它们也没有显示可服务市场中有多少是软件订阅，多少是服务、激励管理或其他低毛利活动。由于估值高度取决于这一组合，投资者仍需要管理层证据，说明管线构成、平均合同价值、实施投入和各产品线贡献利润率。分析师方法之间的矛盾在
              TAM 层面还能处理，但估算 Uplight 最终软件捕获时会变得更重要。因此，本章认为大市场增长有证据支持，同时把 SAM 和 SOM 保留为尽调缺口，而不是假装公开数据能精确解决。
            claimRefs:
              - CM040
              - CM041
              - CM042
