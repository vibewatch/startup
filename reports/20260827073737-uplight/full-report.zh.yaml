      - number: '1.4'
        title: 产品组合与解决方案范围
        blocks:
          - type: paragraph
            body: >-
              Uplight 的产品组合横跨几个相邻但运营上相连的类别，这些类别对公用事业客户很关键。官方描述一贯把公司放在客户互动、能效、需求响应、分布式能源资源管理和虚拟电厂赋能的交汇处。落到实践，Uplight
              不只是帮公用事业公司触达客户或发放返利；它还帮助塑造负荷、纳入设备、预测灵活性，并调度分布式资产，以支撑可靠性和脱碳目标。公司的灵活性管理平台常被描述为开放且设备无关，这对需要跨碎片化硬件生态运行的公用事业公司很重要。Uplight
              还把下游客户体验流程连到上游电网结果，让公用事业公司用同一套平台家族完成项目营销、注册、行为能效和运营灵活性。被收购企业解释了这种宽度：FirstFuel 加深了分析和能效能力，EnergySavvy 与
              Simple Energy 则贡献了客户互动和交易市场功能。结果是一个面向公用事业公司的运营模型，混合了软件订阅、托管式项目交付和实施支持。后续商业分析的关键在于，Uplight
              卖进的是公用事业数字化和分布式电网预算，而不是家庭零售软件预算。这会让客户范围更窄，并提高对公用事业采购周期和监管项目资金的依赖。
