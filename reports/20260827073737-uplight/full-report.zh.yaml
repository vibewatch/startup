      - number: '3.5'
        title: 市场定位在公用事业主导的住宅和大众市场灵活性中最强
        blocks:
          - type: paragraph
            body: >-
              Uplight 看起来最适合这样的场景：买方是服务广泛住宅或混合客户群的公用事业公司，希望一个供应商连起互动、注册和灵活负荷执行。这个定位强于 Voltus 或 CPower 的 C&I 中心叙事，也比
              Oracle Utilities、Itron、Landis+Gyr 的基础设施优先故事更面向客户。它也不同于 EnergyHub 和 Virtual Peaker，后两者往往更直接与设备和 DER
              编排绑定。实际说，Uplight
              的甜点是需要扩大需求灵活性、却不想在客户沟通、项目管理和调度计量之间搭碎片化技术栈的公用事业公司。代价是，在一些账户里，如果买方更偏好更深的电网运营工具、商户需求响应优化，或已经嵌入公用事业架构的表计 / AMI
              供应商，Uplight 会暴露。因此，Uplight 定位有差异化，但并不能免受既有厂商捆绑压力或聚合商专业化压力。
            claimRefs:
              - CP037
              - CP038
              - CP039
              - CP040
              - CP041
              - CP042
              - CP043
      - number: '3.6'
        title: 竞争动态有利于既有厂商捆绑，也有利于聚合商专业化
        blocks:
          - type: paragraph
            body: >-
              当前竞争动态在结构上不利于夹在中间的技术栈供应商，除非它们能证明套件整合价值，或拿出无可匹敌的专业 ROI。Oracle Utilities、Itron 和 Landis+Gyr
              可以利用既有公用事业采购关系和相邻装机基础捆绑新模块。Voltus、CPower、Leap 和 Enel X 等聚合商则可以强调市场参与经验、事件表现和项目变现，而不是宽泛软件覆盖。EnergyHub 和
              Virtual Peaker 等相邻编排供应商在设备生态深度和公用事业灵活性运营上竞争。这意味着 Uplight
              必须用一个明确逻辑取胜：客户互动不与调度和项目执行割裂时，公用事业公司可以拿到更好的采用率和运营结果。AutoGrid
              收购强化了这一逻辑，但收购也会带来整合风险；如果公用事业公司怀疑路线图只是拼接组合，而非原生统一平台，风险就会暴露。竞争上，Uplight 需要证明，互动加 DERMS 的组合相对“客户互动产品 +
              另一个调度引擎”的搭配，能交付可衡量的增量价值。
            claimRefs:
              - CP044
              - CP045
              - CP046
              - CP047
              - CP048
              - CP049
              - CP050
      - number: '3.7'
        title: 护城河更多取决于公用事业关系和工作流嵌入，而不是纯技术新颖性
        blocks:
          - type: paragraph
            body: >-
              Uplight 的护城河，更可信的形态是关系和工作流护城河，而不是不可触碰的技术护城河。公用事业采购周期慢，集成后果重大；一旦供应商嵌入客户项目、事件运营和绩效计量，切换风险就会上升。因此，如果 85
              家以上公用事业关系能转化为续约、模块扩张和案例驱动销售，就会很有分量。从注册到调度的全栈能力也提高切换摩擦，因为替换 Uplight
              可能需要多个点状产品、重新培训和新的集成工作。不过，这些壁垒并非绝对。大型既有厂商资产负债表更厚，也能接入既有系统；专门厂商可以插入技术栈的一段，而不迫使客户彻底替换。Uplight
              护城河最耐久的版本，是有证据显示其一体化客户互动加 DER 编排，比配对式替代方案带来更好的参与率、事件收益或监管结果。没有这类证明，关系和集成护城河仍有意义，但可以被挑战。
            claimRefs:
              - CP051
              - CP052
              - CP053
              - CP054
              - CP055
              - CP056
              - CP057
