  - id: TV001
    title: 建议摘要表
    columns:
      - 维度
      - 评估
      - 证据基础
      - 决策含义
    rows:
      - - 建议
        - 观察
        - 战略资产很强，但据报约 US$1B 的估值下，公开信息看不出明显错价
        - 先跟踪并尽调 KPI 证据，再测算上行空间
      - - 置信度
        - 中
        - 战略逻辑清楚，但核心财务质量指标仍未公开
        - 转为买入前，需取得管理层 KPI 包
      - - 风险评级
        - 高
        - 整合、集中度和经济模型不透明，使下行边界难以框定
        - 采用偏下行的假设
      - - 估值立场
        - 合理至偏高
        - 隐含约 9.7x ARR，高于广泛公开市场中位数，也接近普通私营交易区间高端
        - 若没有更强证据，视当前价格为充分定价
      - - 上行驱动
        - 战略协同
        - Octopus 可把 Uplight 与 Kraken、Schneider 系统和公用事业关系结合
        - 乐观情景取决于协同能否兑现
      - - 下行驱动
        - KPI 不透明
        - 未公开 NRR、EBITDA、毛利率或软件与服务收入占比
        - 指标缺失可能压低可转让倍数
    notes: 建议按据报 2026 年交易背景校准。表中评估词仅用于分析，不替代最终 report-meta 枚举值。
    claimRefs:
      - CV006
      - CV011
      - CV024
      - CV041
      - CV057
  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 证据
      - 什么会改变判断
    rows:
      - - 战略稀缺性支撑溢价定价
        - 85+ 家公用事业客户、8.5 GW 受管负荷，以及客户互动 + 灵活性的整合定位，为美国进入者制造稀缺性
        - 若续约质量偏弱，或模块采用停留在浅层，溢价逻辑会减弱
      - - Octopus 可借 Uplight 更快变现美国市场进入
        - 交易逻辑的核心，是借 Uplight 的公用事业关系切入北美日益增长的电力需求
        - 如果 Octopus 无法把 Uplight 转化为更广的 Kraken 或 BYOC 牵引力，协同价值会下降
      - - AutoGrid 整合扩大了资产包
        - Uplight 和 Latitude 均称，到 2026 年交易时整合工作已完成
        - 若整合在运营上仍然混乱或稀释利润率，支撑溢价的基础会收缩
      - - 反向逻辑：估值已反映战略溢价
        - 据报交易价值约 US$1B，对应提供的约 US$103M ARR，隐含约 9.7x ARR
        - 新资金若要有吸引力的上行空间，需要更低入场价或顶级 KPI 证明
      - - 反向逻辑：估值下调提示预期未兑现
        - 公开回顾显示，估值从 2021 年约 US$1.5B 降至 2026 年约 US$1B
        - 若有证据表明下调纯粹来自宏观环境、而非执行问题，担忧会减轻
      - - 反向逻辑：缺少软件质量证明
        - 采纳资料中没有公开 NRR、毛利率、EBITDA 或服务收入占比披露
        - 若管理层 KPI 包显示收入质量有溢价，判断可能显著上修
    notes: 表格有意把正反观点放在一起，因为章节要求在一处呈现投资逻辑与反向逻辑；多行依赖推导出的估值逻辑，而非已披露的交易备忘录。
    claimRefs:
      - CV030
      - CV033
      - CV038
      - CV041
      - CV042
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 核心假设
      - 估值逻辑
      - 概率信号
      - 下行或风险触发项
    rows:
      - - 乐观
        - AutoGrid 整合站得住，公用事业扩张加速，战略合作伙伴释放新增需求
        - 以约 US$115M-US$125M ARR 计 11x-13x ARR，支撑约 US$1.3B-US$1.6B 价值
        - 需要强 KPI 证明，并看到协同落地
        - 公用事业采用放慢或利润率质量下降，会打破该情景
      - - 基准
        - Uplight 稳步增长，但仍是软件 + 服务混合平台，留存可见度中等
        - 以约 US$100M-US$110M ARR 计 8x-10x ARR，支撑约 US$0.8B-US$1.1B 价值
        - 与据报 2026 年交易区间最一致
        - KPI 包未能证明高溢价软件经济性
      - - 悲观
        - 公用事业预算周期拉长、参与效果不及预期，整合拖累持续
        - 以约 US$90M-US$100M ARR 计 5x-7x ARR，支撑约 US$0.45B-US$0.7B 价值
        - 符合更广泛私营软件和公开可比公司倍数压缩
        - 尽调暴露留存偏弱、服务占比高或客户集中
    notes: 情景区间是分析估算，基于据报估值锚点、用户提供的 ARR 锚点和 2026 年基准来源，而非买方报价。
    claimRefs:
      - CV046
      - CV047
      - CV048
      - CV049
      - CV050
  - id: TV004
    title: 可比估值表
    enumerationScope:
      coverage: partial
      basis: >-
        Public disclosure supports only selected valuation anchors and 2026 benchmark references retained in this
        chapter, not a full like-for-like clean-energy software comp universe.
    columns:
      - 可比项
      - 指标
      - 倍数、估值或状态
      - 相关性
      - 局限
    rows:
      - - Uplight 2021 年战略融资
        - 披露口径的私营估值
        - US$73M 投资后约 US$1.5B
        - 同一公司的历史峰值标记
        - 2021 年估值环境异常火热
      - - Uplight 2026 年 3 月多数股权出售
        - 披露口径的战略估值
        - 据报约或略高于 US$1.0B；具体条款未披露
        - 当前最好的市场出清锚点
        - 没有备案收购价或结构细节
      - - ScaleXP 2026 年公开基准
        - 公开软件收入倍数
        - 平均收入倍数约 6.2x
        - 显示更广泛公开 SaaS 的重估水平
        - 公开市场平均基准，并非公用事业软件专项
      - - Multiples.vc 横向 SaaS
        - 公开市场 NTM 收入倍数
        - 中位数 2.2x
        - 可作为保守的公开可比锚点
        - 品类组合不同于 Uplight
      - - Multiples.vc BI 与分析
        - 公开市场 NTM 收入倍数
        - 3.2x
        - 采纳资料中最接近的分析型公开切片
        - 仍不是直接的公用事业软件可比组
      - - Multiples.vc 能源与公用事业软件
        - 公开市场 NTM 收入倍数
        - 13.2x
        - 显示部分公用事业软件细分领域交易倍数高于通用中位数
        - 品类篮子可能包含与 Uplight 不同的业务
      - - Windsor Drake 规模化私营 SaaS
        - 私营 EV 或 ARR 区间
        - 通常 5.0x-8.0x；溢价可达 10x+
        - 可作为规模化软件卖方的私营市场区间
        - 咨询机构估算，并非直接观察到的 Uplight 可比交易
      - - Acquiry 传统 SaaS >30% 增长
        - 私营 ARR 区间
        - 5x-8x ARR
        - 健康非 AI 成长期 SaaS 的基准
        - 通用软件基准，并非公用事业专业软件专项
    notes: 列举有意保持不完整，因为公开披露不足以支撑口径一致的同业组；所列行是本章估值推理直接使用的锚点。
    claimRefs:
      - CV013
      - CV014
      - CV021
      - CV022
      - CV023
      - CV025
      - CV026
      - CV027
      - CV028
  - id: TV005
    title: 投资逻辑破裂与止损触发项表
    columns:
      - 触发项
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 留存质量不及预期
        - NRR 低于约 105%，或大型公用事业客户出现明显流失
        - 打破高溢价软件逻辑，并削弱战略稀缺性
        - 向基准或悲观区间重估
      - - 毛利率证明服务占比过高
        - 毛利率明显低于软件化水平，或实施占比高的收入结构占主导
        - 压缩可转让 ARR 倍数
        - 财务买方不能把战略价格当作可复现价格
      - - AutoGrid 整合仍未完成
        - 产品、数据或 GTM 整合问题延续到下一规划周期仍未解决
        - 削弱协同和平台宽度逻辑
        - 若不重新定价，下调建议
      - - 客户集中度过高
        - 头部公用事业敞口或续约集中度明显升高
        - 收入韧性弱于客户数量暗示
        - 提高下行情景权重
      - - Octopus 协同落地停滞
        - 看不到 Kraken 协作或公用事业渠道收益出现
        - 战略溢价失去支撑
        - 只按独立经营经济性测算
    notes: 阈值面向尽调，因为公开资料没有披露底层 KPI 数值；阈值也界定了哪些管理层证据会推翻当前判断。
    claimRefs:
      - CV043
      - CV044
      - CV055
      - CV056
      - CV057
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 收入质量
        - 当前 ARR 桥接，以及软件与服务收入占比
        - 决定近 10x 倍数可否转让，还是只属于战略买方
        - CFO 尽调资料包和董事会材料
      - - 留存
        - 按公用事业细分的 NRR、GRR、队列扩张和 logo 流失
        - 采纳的基准资料显示，留存是 2026 年主要倍数驱动因素
        - 管理层指标资料室加队列导出
      - - 利润率
        - AutoGrid 整合后的毛利率、贡献利润率和 EBITDA
        - 利润率质量区分高溢价软件与服务偏重平台
        - 财务尽调；如有，核查审计报表
      - - 交易结构
        - 2026 年 3 月交易的准确对价、滚存条款和少数股东保护
        - 披露估值可能不同于经济价值
        - 法律文件、SPA 或公允性材料
      - - 集中度
        - 头部客户 ARR 和续约时间表敞口
        - 即便触达大量终端用户，公用事业客户集中度也会压缩估值
        - 财务团队收入集中度分析
      - - 协同证据
        - 交割后与 Octopus、Kraken、Schneider 系统的路线图
        - 验证战略溢价能否在运营中兑现
        - 与运营发起方开展产品和 GTM 尽调
    notes: 上述尽调问题直接映射估值可转让性和建议调整中最重要但尚未验证的驱动因素；不是通用尽调套话。
    claimRefs:
      - CV042
      - CV043
      - CV055
      - CV056
      - CV058
      - CV059
