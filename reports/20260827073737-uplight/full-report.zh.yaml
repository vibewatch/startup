      - number: '2.2'
        title: TAM、相邻市场层与规模测算逻辑
        blocks:
          - type: paragraph
            body: >-
              2026 年已有证据支持多视角测算，而不是一个混合 TAM 数字。一个可信视角是全球需求响应市场，2026 年估计为 $39.5 billion，预计到 2036 年达到 $124.9 billion，对应
              12.2% CAGR。第二个相邻视角是虚拟电厂市场，2026 年估计约 $7.4 billion，捕捉的是更窄、与 Uplight
              灵活性平台更直接对齐的编排层。第三个视角来自公用事业灵活性需求，而不是软件收入：仅美国到 2030 年预计就需要约 160 GW
              灵活容量，结构性拉动软件、激励、注册和调度基础设施。这些视角互补，不可互换。需求响应 TAM 很可能高估 Uplight 可触达的软件机会，因为它包含项目价值和服务；VPP 层则可能低估，因为 Uplight
              还通过客户互动和实施变现。最有助于决策的读法是：Uplight 参与的是一个数十亿美元级的北美软件和服务机会，嵌在更大的全球需求响应与灵活性市场之中。由于本报告审阅的来源没有干净拆出 Uplight 真正的
              SAM 或 SOM，本章保留这一受证据约束的估计，而不夸大精度。
