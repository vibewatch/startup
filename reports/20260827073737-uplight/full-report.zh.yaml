companyProfile:
  summary: >-
    Uplight 是一家总部位于 Boulder, Colorado 的清洁能源 SaaS 公司，2019 年由 Tendril、EnergyHub、FirstFuel、 Ecotagious、UtilityAPI 和 Simple
    Energy 整合而成。公司向电力和燃气公用事业公司提供软件与数据分析，支撑电网灵活性、需求响应、 虚拟电厂（VPP）和客户互动。2026 年 3 月，英国 Octopus Energy 收购 Uplight
    多数股权；据报道估值略高于 $1 billion，Schneider Electric 保留少数股权。Uplight 服务 85 家以上公用事业客户，触达 110 million 以上终端客户，并管理约 8.5 GW 灵活负荷容量。
  foundedDate: '2019-01-01'
  founders:
    - name: Adrian Tuck
      role: CEO（经 Tendril 延续的共同创始人）
      background: Tendril 前 CEO；Tendril 是合并组成 Uplight 的前身公司之一
  foundingLocation: Boulder, CO, USA
  headquarters: Boulder, CO, USA
  productSummary: 面向公用事业需求管理的 SaaS 平台，覆盖需求响应、虚拟电厂编排、分布式能源资源管理（DERMS）、能效项目交付、客户互动工具，以及能源产品交易市场解决方案。
  customerFocus: 主要面向北美电力和燃气公用事业公司及能源零售商
  businessModel: 面向公用事业需求管理平台的 SaaS 订阅费与按使用量收费
  stage: Acquired majority by Octopus Energy (March 2026)
  fundingStatus: Octopus Energy 于 2026 年 3 月收购多数股权；此前已从 Schneider Electric、Fifth Wall、National Grid Partners 等募资约 $300M+
