          - type: callout
            title: 较低的 2026 年估值是真实的反向信号
            body: 估值从约 $1.5 billion 降到约 $1 billion，再叠加留存和利润率数据缺失，足以让下行情景成为实质性承销问题，而非假设风险。
            calloutType: risk
            claimRefs:
              - CV013
