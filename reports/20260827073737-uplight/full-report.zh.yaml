      - number: '1.5'
        title: 客户基础、覆盖范围与市场足迹
        blocks:
          - type: paragraph
            body: >-
              公开规模指标显示，Uplight 在北美公用事业软件市场已经有实质渗透，尽管详细收入披露仍缺失。Uplight 称其服务 85 家以上公用事业客户，并通过这些关系触达 110 million
              以上能源客户。公司还称平台支撑约 8.5 GW 的灵活负荷；这个数字使其在需求响应和虚拟电厂赋能上具备实质相关性，而不是一家小众试点供应商。这些指标应解读为公司自称的运营覆盖，而非独立审计的财务
              KPI，但仍有助于校准市场存在感。客户名单没有在单一当前公开来源中完整列出，但合作伙伴公告和公用事业案例研究显示，公司与大型投资者所有制和市政公用事业公司都有合作。Uplight
              强调公用事业渠道，因此终端用户触达远大于直接付费客户数。如果续约强劲，这会形成杠杆；但也意味着相对集中的企业客户群很可能贡献了大部分收入。地域看起来以美国为中心，但员工或客户的全球表述暗示足迹更广。尽调的正确结论是：Uplight
              在市场准入层面具备规模可信度，但公开披露不足以推断留存、单个公用事业客户收入或项目盈利能力。
