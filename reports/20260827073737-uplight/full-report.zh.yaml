        - 索取继任计划、决策权和组织架构变化。
      - - 所有权变更后的高级人才留存
        - 多数股权收购可能触发流失风险或激励重置。
        - 中
        - 高
        - 使命一致和战略背书可能有助于留住团队。
        - 核查留任授予、离职名单和团队层面的流失率。
      - - 过渡期公用事业客户信心
        - 组织调整期间，买方可能质疑产品路线图能否延续。
        - 中
        - 中高
        - 既有客户基础和长期关系可缓冲冲击。
        - 访谈头部客户，并核查续约沟通记录。
      - - 产品范围过宽带来的跨职能复杂度
        - 多个模块和合作伙伴依赖会抬高协同负担。
        - 中高
        - 中高
        - 既有部署基础和行业经验带来一定韧性。
        - 核查产品治理和实施升级处理模式。
    notes: 管理层与所有权在同一时期更替，因此过渡风险尤其关键。
