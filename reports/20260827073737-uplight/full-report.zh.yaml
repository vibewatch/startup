      - number: '6.2'
        title: 买方、用户、付款方与细分结构
        blocks:
          - type: paragraph
            body: >-
              围绕 Uplight
              的客户结构比标准软件供应商账户列表更复杂，因为买方、用户、付款方和受益方往往不是同一方。买方通常是受监管的公用事业公司、市政公用事业公司、社区能源提供商或零售能源机构。付款方可能是公用事业公司的客户项目预算、需求侧管理拨款、电网现代化预算，或监管批准的成本回收机制。用户可能是公用事业项目经理、客户体验团队、分布式能源运营团队、承包商网络，或通过市场平台、设备、报告、费率或激励报价互动的终端客户。这种结构解释了
              Uplight 为什么同时销售客户互动和灵活性工作流：客户获取和行为改变，与负荷转移和分布式能源参与属于同一套经济系统。公开案例材料显示，其分群覆盖低收入用户触达、EV
              托管充电、需求响应、费率项目注册、承包商工作流自动化、市场平台采用，以及更广泛的 DER 灵活性。对尽调而言，重要含义是，Uplight 的价值不只是拿下
              logo，而是把公用事业公司内部多个利益相关方与庞大的下游人群连接起来。
