      - number: '5.3'
        title: Flex DERMS 与虚拟电厂运营模式
        blocks:
          - type: paragraph
            body: >-
              Uplight 技术栈中最关键的部分是 Flex DERMS。公司称这个引擎用预测控制监测、预测并调度 DER。官方 DERMS 和 VPP 材料描述了 AI
              驱动预测、多种调度策略、当天测量与验证，以及跨不同市场和资产类别聚合住宅、商业和工商业（C&I）资源的能力。公开 2026 年材料称 Uplight 在全球管理 500k+ 台设备和 8.5 GW
              灵活容量，而平台页在一个高层视图中列出 4.9 GW 编排需求。这个差异不一定意味着矛盾；更可能是不同页面采用了不同产品口径或时间口径，但它确实形成了 KPI 口径统一的尽调问题。VPP
              页面也清楚表明，Uplight 把其 VPP
              产品定位为不止季节性需求响应：全年可调度容量、面向特定馈线的灵活性、预测、事件管理、测量与验证以及激励处理，都是运营模式的一部分。如果实践中属实，公用事业公司就能用同一家供应商招募参与者、连接设备、预测灵活容量、调度本地事件并核验事件影响。这一运营跨度是公司最强的产品主张之一；AutoGrid
              收购后，这一主张更可信。
