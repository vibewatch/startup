            body: >-
              EnergyHub、Generac、KrakenFlex、Virtual Peaker 及相关 VPP 或 DER 编排供应商，从更窄但战略上重要的切口向 Uplight 施压。EnergyHub
              强调跨恒温器、EV 充电器、电池和其他联网负荷的公用事业规模设备编排与 DER 灵活性。Generac Clean Energy 和与 ecobee
              相关的项目，在公用事业灵活性与自有硬件生态紧密捆绑的场景中重要。KrakenFlex 带来零售商和灵活性市场底色，在公用事业公司、供应商和分布式资产交汇的市场有吸引力。Virtual Peaker 专注
              DERMS、VPP 运营和公用事业项目执行；当买方优化的是电网服务控制室，而不是客户体验层时，它的叙事更干净。这些供应商说明，Uplight
              的技术栈必须在设备集成和调度工具上保持可信，而不只是做好注册和互动。如果公用事业公司认为 Uplight 只在消息触达和注册上最强，相邻玩家就可能剥走最靠近调度和资产控制的运营层。
