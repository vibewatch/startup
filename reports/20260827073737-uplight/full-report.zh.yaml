      - number: '3.8'
        title: 前景取决于公用事业公司偏好统一技术栈还是单项最优组合
        blocks:
          - type: paragraph
            body: >-
              未来几年最重要的竞争问题，是公用事业买方会标准化到更宽平台，还是继续围绕既有系统拼装多个供应商。如果电网灵活性预算与客户互动、电气化项目汇合，Uplight
              有可信机会受益，因为它的叙事正是围绕这种汇合建立。AutoGrid 组合也让它对寻求 DERMS
              相邻能力的公用事业公司有更能防守的答案。尽管如此，竞争压力很可能从两侧加剧：公用事业既有厂商可以继续把分析和灵活性功能延伸到现有套件，聚合商和 VPP
              运营商则可以通过增加面向公用事业的软件和白标服务向上移动。反向证据也重要。如果买方或分析师认为 Uplight 在深度编排上弱于 EnergyHub 或 AutoGrid 时代同业，或在商业灵活性密度上弱于
              Voltus 和 CPower，那么它的一体化故事就有被看成“够宽但不够强”的风险。竞争前景正面但有争夺，执行和收购后整合将决定 Uplight 能否拿到平台地位，还是只是多供应商公用事业技术栈里的一层。
            claimRefs:
              - CP058
              - CP059
              - CP060
              - CP061
              - CP062
              - CP063
              - CP064
              - CP065
      - number: '3.9'
        title: 图表
        blocks:
          - type: callout
            title: 整合逻辑是核心赌注
            body: 竞争逻辑不是 Uplight 主导每个组件类别；而是随着灵活性项目扩大，公用事业公司越来越偏好一个供应商把客户互动、注册、调度和计量连接起来。
