  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与纳入口径
        blocks:
          - type: paragraph
            body: >-
              Uplight 的正确市场边界不是泛泛的气候软件，也不是宽口径公用事业 IT。最相关的市场，是卖给受监管和市政公用事业公司的公用事业客户互动、需求响应项目管理、DER
              编排和虚拟电厂赋能。纳入口径因此包括用于招募客户参与能效和灵活性项目、集成恒温器、EV 充电器、电池和其他
              DER、预测和调度灵活负荷，以及管理绩效、激励和电网事件运营的软件与服务。排除口径包括批发发电资产、输电设备、不带编排软件销售的表后硬件、通用 CRM
              工具，以及不接入公用事业项目的消费者能源应用。这个边界很重要，因为分析师估算会随口径变化：只计算需求响应项目价值、纳入更宽的 DERMS 软件，还是计算完整聚合后的 VPP 收入，结果会不同。Uplight
              的实际市场位于电网软件和外包项目运营的交汇处，这也是服务在品类经济性中仍然重要的原因。买方通常是负责客户项目、需求侧管理、分布式能源或电网现代化的公用事业业务部门，终端用户则是参与项目的住宅或商业客户。这意味着
              Uplight 的市场机会很大，但比醒目的能源转型 TAM 更窄，因为机会取决于公用事业预算、获批项目和运营准备度。
