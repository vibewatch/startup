      - number: '4.5'
        title: 收入质量可能由经常性软件收入和服务较重的公用事业项目共同决定
        blocks:
          - type: paragraph
            body: >-
              Uplight 的商业定位更像混合收入模式，不是纯高毛利 SaaS。公司面向公用事业公司销售客户互动、能效、需求响应、虚拟电厂和 DERMS
              能力，公开表述除了软件，也反复强调托管式项目交付。这大概率意味着，一部分收入来自经常性平台订阅或许可，另一部分来自实施、项目运营、公用事业活动交付、分析，或与绩效挂钩的服务。这种组合能支撑持久的企业客户关系，但相较顶级横向
              SaaS 公司，也可能压低毛利率。客户集中也会更突出，因为少数大型公用事业账户可能贡献 ARR
              和服务收入的相当部分。从尽调角度看，最重要的缺失事实是软件与服务收入占比、公用事业客户平均合同价值、续约和扩张表现，以及 2026 年增长在多大程度上来自内生扩张，而不是所有权过渡效应或交叉销售预期。
            claimRefs:
              - CI025
              - CI026
              - CI027
              - CI028
              - CI029
