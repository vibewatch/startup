  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局横跨既有厂商、聚合商和相邻 DER 软件
        blocks:
          - type: paragraph
            body: >-
              Uplight 的竞争集合很宽，因为公用事业公司可以用几种不同方式采购底层需求。一个端点是 Oracle Utilities、Itron、Landis+Gyr 等公用事业 IT
              和计量既有厂商，它们向长期公用事业账户销售平台层，包括 MDM、分析、AMI 运营、配电自动化以及 DER 相关软件。另一个端点是 Voltus、CPower、Leap、Enel X
              等调度优先的灵活性专门厂商；当买方核心目标是把需求响应或分布式资产变现，而不是运行统一客户与电网互动项目时，它们更容易赢。第三层包括 EnergyHub、Virtual
              Peaker、Generac、KrakenFlex 等相邻软件和设备编排供应商，更接近 DER 聚合、VPP
              赋能、住宅设备控制或与零售商相连的灵活性。实际替代方案不是一个完美一一对应的对手，而是公用事业公司在客户互动、注册、调度、M&V、DERMS 和 AMI
              之间组装多个供应商。因此，只有当公用事业公司更看重统一、面向公用事业的运营层，而不是单点最优专业化时，Uplight 才能赢。
