  - id: TM001
    title: Uplight 的市场定义与边界
    columns:
      - 细分 / 类别
      - 纳入支出
      - 排除支出
      - 买方 / 付款方
      - 重要性
    rows:
      - - 需求响应项目平台
        - 注册、事件管理、激励管理、M&V、调度协调
        - 批发发电容量价值，不由软件供应商捕获
        - 公用事业 DSM / 灵活性预算；监管批准回收成本
        - 核心市场
      - - 虚拟电厂编排
        - DER 聚合、设备集成、调度软件、市场参与工具
        - 独立 DER 硬件销售
        - 公用事业 DER 团队；零售能源供应商；聚合商
        - 核心邻近市场
      - - 公用事业客户互动
        - 消息触达、个性化、市场平台、项目营销、数字自助服务
        - 能源项目之外的通用 CRM 支出
        - 客户体验与能效团队
        - 重要导流类别
      - - DERMS / 电网边缘运营
        - 规划、预测、DER 可见性、运营协调
        - 输配电硬件资本开支
        - 电网现代化预算
        - 选择性重叠
    notes: 边界把面向公用事业公司的软件 / 服务，与更广泛的能源转型支出和纯硬件类别区分开。
