    enumerationScope:
      coverage: partial
      basis: >-
        Covers the principal direct and adjacent competitors evidenced in retained 2026 source pack rather than every
        grid-edge software vendor.
    rows:
      - - Oracle Utilities
        - 公用事业软件老牌厂商
        - Oracle 的公用事业软件业务嵌在大型企业套件内；保留资料中没有单独的公开分部数字
        - 受监管公用事业公司和大型能源零售商
        - 覆盖广泛的公用事业 CIS、MDM、分析、停电和电网运营能力
        - 企业套件更宽，但不如 Uplight 那样明确围绕客户互动与灵活性统一展开
      - - Itron
        - 计量与电网边缘老牌厂商
        - 上市公司，具备全球智能基础设施规模
        - 电力、燃气和水务公用事业公司
        - AMI、分布式智能、DER 与电网边缘运营
        - 装机基础强，但客户互动层不如 Uplight 叙事核心
      - - Landis+Gyr
        - 智能电网老牌厂商
        - 上市公司，拥有先进计量和电网管理布局
        - 电力和燃气公用事业公司
        - 智能计量、灵活性和配电自动化
        - 基础设施绑定强，但在公用事业客户互动上差异化较弱
      - - Voltus
        - DR 聚合商
        - 公司 / 投资者材料释放出公开的需求响应与 DER 聚合规模信号
        - 以工商业（C&I）为主的公用事业公司、市场参与者、企业
        - 面向市场的灵活性变现和调度能力
        - 公用事业客户体验（CX）范围比 Uplight 更窄
      - - CPower
        - DR 聚合商
        - 公司材料显示大型工商业（C&I）资源聚合布局
        - 公用事业公司、ISO/RTO、工商业客户
        - 事件执行和电网服务聚合
        - 统一客户互动能力较弱
      - - EnergyHub
        - DER 编排平台
        - 公司和合作伙伴强调公用事业设备网络规模
        - 公用事业公司和 DER 项目运营方
        - 广泛的住宅 DER 编排和公用事业集成
        - 更偏编排，公用事业营销和注册叙事没有那么宽
      - - Virtual Peaker
        - VPP / DERMS 软件
        - 风险投资支持的专业厂商；公开宣传公用事业客户基础
        - 运营 VPP 和柔性负荷项目的公用事业公司
        - 聚焦公用事业 DERMS 和 VPP 工作流
        - 广度和触达不及 Uplight，但控制室叙事更尖锐
      - - Leap
        - 市场接入 / VPP 软件
        - 风险投资支持的灵活性网络，覆盖公用事业和市场项目
        - DER 运营商、零售商、公用事业公司、企业
        - 市场参与和 API 优先的灵活性接入
        - 公用事业客户体验深度较弱，更偏市场化导向
      - - Enel X
        - 全球 DR 和能源服务竞争者
        - 全球能源服务部署基础庞大
        - 公用事业公司、企业、公共部门
        - 需求响应、能源管理和分布式能源服务
        - 能源服务模式更多元，对公用事业白标聚焦较弱
    notes: 规模栏依赖已保留的公开定位，而不是标准化收入可比项，因为多数同行不披露这个类别可逐项对比的软件指标。
