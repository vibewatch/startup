  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与客户工作流范围
        blocks:
          - type: paragraph
            body: >-
              Uplight
              的产品最好理解为公用事业运营平台，而不是单一应用。公司销售软件和托管式项目能力，帮助能源供应商招募客户加入能源项目、个性化互动、连接设备和分布式能源资源（DER）、预测电网灵活性、调度事件，并测量由此产生的系统影响。2026
              年官网架构把这些产品归入客户互动和灵活性管理两大产品族，并列出市场平台、能源报告、客户门户、费率互动、需求响应、DER
              管理、虚拟电厂和电池等具名解决方案界面。因此，产品既覆盖公用事业前台工作流，也延伸到接近控制室的电网运营。这个跨度具有战略意义，因为公用事业公司越来越需要一层技术，把客户触达、项目管理、设备注册和调度结果串起来。Uplight
              自己把平台描述为连接客户、能源生态与控制室，这一说法与年度客户触点、并发预测和编排能源需求等指标一致。尽调中，核心工作流主张可信：Uplight
              不只是营销或返利工具，而是一个跨职能公用事业平台，旨在同时影响客户行为和 DER 运营。
