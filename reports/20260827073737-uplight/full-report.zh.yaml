      - number: '6.3'
        title: 采用轨迹与部署深度
        blocks:
          - type: paragraph
            body: >-
              公开采用证据显示，Uplight 在若干客户工作流中已经越过孤立概念验证阶段，但证据质量因项目而异。最强部署指标来自具名案例研究和活动议程，这些材料描述了具体客户项目、可测互动或生产结果，而不是泛泛 logo
              陈列。例如 ComEd 报告某市场平台部署带来超过 600,000 名访客和约 $4 million 即时返利，PSEG Long Island 报告能源评估工作流的线上线索增加 500%，Evergy 报告与
              ecobee 合作的韧性项目可调度容量增加 31%，另有涉及 EV
              充电器采用、托管充电、低收入设备优惠和客户奖励的客户案例。这些例子说明，客户基础中至少一部分已经有真实生产活动。不过，公开记录没有给出完整分母，无法判断 85+
              家公用事业客户中有多少已跨多个模块全面部署，多少只在运行更窄的项目。这意味着，从投资测算角度看，采用轨迹方向上强，但证据仍不完整。合理解读是：Uplight 有多个已验证的客户场景，但 logo
              数量与深度变现部署之间的比例仍未被公开证据验证。
