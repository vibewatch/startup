      This extra table substitutes for the planned retention cohort figure because public evidence is insufficient for a true time-series cohort view, so the chapter records the unresolved diligence queue explicitly.
    claimRefs: [CU036, CU037, CU044, CU050]
figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: Uplight connects utility acquisition, enrollment, deployment, and expansion around downstream customer participation.
    data:
      items:
        - label: Enterprise buyer acquisition
          actor: Utility buyer
          detail: Utility teams evaluate customer engagement, rates, EV, and flexibility needs.
        - label: Program launch
          actor: Utility plus Uplight
          detail: Uplight configures marketplace, messaging, device, or reward workflows.
        - label: End-customer enrollment
          actor: Households and businesses
          detail: Customers enroll in thermostat, EV, rebate, rate, or reward experiences.
        - label: Operational use
          actor: Utility operators and customers
          detail: Programs deliver engagement, savings, charging, dispatch, or load-shift outcomes.
        - label: Expansion loop
          actor: Existing utility account
          detail: Successful programs create openings for adjacent modules and partner-backed launches.
    claimRefs: [CU008, CU010, CU012, CU040]
  - id: FU002
    title: Adoption and deployment funnel
    type: funnel
    summary: Public evidence shows a path from enterprise logo acquisition to downstream customer reach and program-specific outcomes.
    data:
      items:
        - label: Utility customer base
          value: 85
        - label: Downstream reachable population
          value: 110
        - label: Flexible-load operating layer
          value: 8.5
        - label: Named measured outcomes
          value: 3
    approximationNotes: >-
      Funnel steps mix scale and outcome markers because public disclosure lacks a clean denominator for conversion rates between logos, active programs, and monetized deployments.
    claimRefs: [CU002, CU003, CU004, CU015, CU017, CU018]
  - id: FU003
    title: Customer proof matrix
    type: matrix
