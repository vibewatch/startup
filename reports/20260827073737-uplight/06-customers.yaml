  evidenceGaps:
    - type: missing-source
      severity: material
      topic: retention-gap
      missingEvidence: Net revenue retention, gross retention, renewal-rate, and cohort data by utility segment.
      whyItMatters: These metrics determine whether customer logos translate into durable recurring revenue.
      diligencePath: Request 2024-2026 renewal and cohort exports from finance and customer-success leadership.
      relatedQuestionRefs: [QU018, QU019, QU020]
      relatedTableRefs: [TU004]
    - type: missing-source
      severity: material
      topic: concentration-risk
      missingEvidence: Top-customer revenue share, top-10 account exposure, and contract value concentration.
      whyItMatters: A business with 85-plus utility logos can still be highly concentrated in revenue and renewal timing.
      diligencePath: Request board or CFO customer concentration schedules and ARR-by-account summaries.
      relatedQuestionRefs: [QU023]
      relatedTableRefs: [TU005]
    - type: enumeration-incomplete
      severity: minor
      topic: named-customers
