        - {label: Pioneer Community Energy, values: [3, 2, 1, 3]}
    claimRefs: [CU021, CU022, CU023, CU024, CU027, CU034]

acknowledgedWarnings:
  - dimension: unverifiedSource
    reason: Some cited public URLs were only reachable through indirect or blocked retrieval paths in this run, so the chapter keeps them with explicit accessStatus and evidence-gap disclosure while stronger browser-capable re-fetching remains pending.
  - dimension: unsectionedExhibits
    reason: TU006 is intentionally housed in the closing exhibits section as a substitute for the unavailable retention-cohort figure, so the artifact is conceptually sectioned even though the validator still flags the fallback pattern.
  - dimension: paywallRisk
    reason: Restricted-access share is elevated because several official Uplight pages returned 403 during this run, but the chapter still stays below the report-level 30 percent ceiling and documents the retrieval gap explicitly for follow-up.
