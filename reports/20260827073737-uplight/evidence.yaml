evidenceGaps:
  - type: enumeration-incomplete
    severity: minor
    topic: leadership
    missingEvidence: Complete leadership roster and board composition
    whyItMatters: Partial leadership view may miss key decision-makers
    diligencePath: Request organizational chart from management
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: investors
    missingEvidence: Complete cap table and investor details
    whyItMatters: Partial investor view may miss control dynamics
    diligencePath: Request cap table from management or legal counsel
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: milestones
    missingEvidence: Complete internal milestone records not publicly available
    whyItMatters: Sample coverage may miss significant internal events
    diligencePath: Request comprehensive corporate timeline from management
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: revenue
    missingEvidence: Detailed ARR, revenue breakdown, gross margin, and cash-flow metrics.
    whyItMatters: Cannot assess economic quality or software-versus-services mix from public sources alone.
    diligencePath: Request management presentation, audited financials, and cohort-level SaaS KPI package.
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Current board roster, committee structure, and shareholder-rights summary after the Octopus transaction.
    whyItMatters: Control, oversight quality, and minority protections are unclear during a post-acquisition transition.
    diligencePath: Request board materials, cap table, and transaction governance summary.
    relatedQuestionRefs:
      - QO011
  - type: missing-source
    severity: material
