      - number: '2.6'
        title: Why Market Structure Matters for Valuation
        blocks:
          - type: paragraph
            body: >-
              Market structure has direct valuation implications for Uplight because investors should not treat this
              category like ordinary horizontal SaaS. The presence of a large services component supports revenue scale
              but may lower software- style gross margin and valuation multiples if managed program delivery is
              material. Commercial-building and utility enterprise segments can support larger contracts and stronger
              retention, but sales cycles and implementation burden are heavier. Regulatory enablement, especially the
              practical rollout of FERC Order 2222 and state flexibility programs, can improve long-term market depth,
              yet uneven adoption means valuation should reflect timing risk rather than only terminal TAM. Uplight
              benefits if utilities prefer integrated customer-engagement and flexibility platforms instead of stitching
              together separate vendors, because that increases share of wallet and switching costs. But a market framed
              too broadly can obscure the fact that the truly accessible opportunity is bounded by North American
              utility buying patterns and by the company's ability to convert program activity into repeatable software
              economics. The right valuation posture is therefore to underwrite Uplight against a growing but
              implementation-heavy utility flexibility market, not against unconstrained global energy-transition spend.
            claimRefs:
              - CM035
              - CM036
              - CM037
              - CM038
              - CM039
      - number: '2.7'
        title: Evidence-Constrained Sizing Gaps
        blocks:
          - type: paragraph
            body: >-
              The largest remaining uncertainty is not whether the market exists, but how much of it Uplight can
              realistically win on a stand-alone basis. Public sources reviewed for this chapter support TAM-scale
              demand response and VPP estimates, but they do not isolate Uplight's revenue-weighted SAM by geography,
              utility type, or program mix. They also do not show how much of the addressable market is software
              subscription versus services, incentives administration, or other lower-margin activity. Because valuation
              depends heavily on this mix, investors still need management evidence on pipeline composition, average
              contract value, implementation effort, and contribution margin by product line. Contradictions across
              analyst methodologies are manageable at the TAM level, but they become more material when trying to
              estimate Uplight's eventual software capture. This chapter therefore treats broad market growth as
              supported while preserving SAM and SOM as diligence gaps rather than pretending that public data can
              resolve them precisely.
