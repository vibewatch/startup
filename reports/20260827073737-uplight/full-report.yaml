      - number: '2.5'
        title: Adoption Constraints and Frictions
        blocks:
          - type: paragraph
            body: >-
              The same market also has real adoption constraints that limit how much of the TAM Uplight can access
              quickly. Utility procurement cycles are slow, and many programs require regulatory approval or
              cost-recovery treatment before budgets can be committed. DER/VPP economics also depend on market rules,
              measurement and verification frameworks, interconnection realities, and customer incentive design, so a
              favorable federal policy headline does not guarantee fast deployment. The category still faces fragmented
              utility systems, device interoperability challenges, and uneven customer willingness to cede control
              during dispatch events. Program success often requires services-heavy execution, which raises delivery
              complexity and can compress margins relative to pure SaaS. There is also methodological noise in market
              reports: some count hardware, incentives, and program value, while others isolate platform revenue,
              complicating investor comparisons. For Uplight, another constraint is concentration in utility buyers
              rather than a broad SMB base; winning and renewing a limited number of large utility accounts matters more
              than mass-volume sales. These frictions do not negate the market thesis, but they mean revenue growth can
              lag macro demand for flexible capacity if budgets, policy implementation, or program operations stall.
            claimRefs:
              - CM028
              - CM029
              - CM030
              - CM031
              - CM032
