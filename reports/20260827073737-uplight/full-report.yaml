      - number: '1.4'
        title: Product Portfolio and Solution Scope
        blocks:
          - type: paragraph
            body: >-
              Uplight's product portfolio spans several adjacent but operationally linked categories that matter to
              utility customers. Official descriptions consistently position the company across customer engagement,
              energy efficiency, demand response, distributed energy resource management, and virtual power plant
              enablement. In practice, that means Uplight is not only helping utilities communicate with customers or
              run rebates; it is also helping them shape load, enroll devices, forecast flexibility, and dispatch
              distributed assets in support of reliability and decarbonization goals. The company's flexibility
              management platform is often presented as open and device-agnostic, which is important for utilities that
              operate across fragmented hardware ecosystems. Uplight also links downstream customer experience workflows
              to upstream grid outcomes, allowing utilities to use the same platform family for program marketing,
              enrollment, behavioral efficiency, and operational flexibility. Acquired businesses help explain this
              breadth: FirstFuel deepened analytics and efficiency capabilities, while EnergySavvy and Simple Energy
              contributed customer engagement and marketplace functionality. The result is a utility-facing operating
              model that mixes software subscriptions with managed program delivery and implementation support. For
              later commercial analysis, the key point is that Uplight sells into the utility digitalization and
              distributed-grid budget rather than into household retail software budgets. That narrows customer
              concentration but increases dependence on utility procurement cycles and regulatory program funding.
            claimRefs:
