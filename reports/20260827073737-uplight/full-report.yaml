      - number: '6.3'
        title: Adoption Trajectory and Deployment Depth
        blocks:
          - type: paragraph
            body: >-
              Public adoption evidence suggests that Uplight has progressed beyond isolated proofs of concept in several
              customer workflows, but the quality of evidence varies by program. The strongest deployment indicators
              come from named case studies and event sessions that describe concrete customer programs, measured
              engagement, or production outcomes rather than generic logo placement. Examples include ComEd reporting
              600,000-plus visitors and about $4 million in instant rebates through a marketplace deployment, PSEG Long
              Island reporting a 500% increase in online leads for an energy-assessment workflow, Evergy reporting a 31%
              increase in dispatchable capacity in a resilience program with ecobee, and customer stories involving EV
              charger adoption, managed charging, low-income device offers, and customer rewards. These examples imply
              real production activity in at least parts of the customer base. However, the public record does not
              provide a full denominator for how many of the 85-plus utility customers are fully deployed across
              multiple modules versus running narrower programs. That means the trajectory is directionally strong but
              still incomplete from an underwriting perspective. The right reading is that Uplight has multiple
              validated customer surfaces, yet the ratio of logo count to deeply monetized deployment remains unverified
              in public evidence.
