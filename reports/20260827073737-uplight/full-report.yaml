      - number: '2.2'
        title: TAM, Adjacent Market Layers, and Sizing Logic
        blocks:
          - type: paragraph
            body: >-
              Available 2026 evidence supports a multi-lens sizing approach rather than one blended TAM number. One
              credible lens is the global demand response market, estimated at $39.5 billion in 2026 and projected to
              reach $124.9 billion by 2036, implying 12.2% CAGR. A second adjacent lens is the virtual power plant
              market, estimated around $7.4 billion in 2026, which captures a narrower orchestration layer more directly
              aligned with Uplight's flexibility platform. A third lens comes from utility flexibility need rather than
              software revenue: the United States alone is projected to require roughly 160 GW of flexible capacity by
              2030, creating a structural need for software, incentives, enrollment, and dispatch infrastructure. These
              lenses are complementary rather than interchangeable. The demand response TAM likely overstates Uplight's
              accessible software opportunity because it includes program value and services; the VPP layer likely
              understates it because Uplight also monetizes customer engagement and implementation. The most
              decision-useful reading is that Uplight participates in a several-billion-dollar North American software
              and services opportunity nested inside a much larger global demand response and flexibility market.
              Because no reviewed source cleanly isolates Uplight's true SAM or SOM, the chapter preserves that as an
              evidence-constrained estimate instead of overstating precision.
