      - number: '3.8'
        title: Outlook hinges on whether utilities prefer unified stacks over best-of-breed combinations
        blocks:
          - type: paragraph
            body: >-
              Over the next few years, the most important competitive question is whether utility buyers standardize on
              broader platforms or continue to assemble multiple vendors around existing systems. Uplight has a credible
              chance to benefit if grid-flexibility budgets converge with customer-engagement and electrification
              programs, because its messaging is built around exactly that convergence. The AutoGrid combination also
              gives it a more defensible answer to utilities seeking DERMS adjacency. Still, competitor pressure will
              likely intensify from both sides: utility incumbents can keep extending analytics and flexibility features
              into existing suites, while aggregators and VPP operators can move up the stack by adding utility-facing
              software and white-label services. Adverse evidence also matters. If buyers or analysts view Uplight as
              weaker than EnergyHub or AutoGrid-era peers on deep orchestration, or weaker than Voltus and CPower on
              commercial flexibility density, then its integrated story risks being seen as broad but not best. The
              competitive outlook is positive but contested, with execution and post-acquisition integration determining
              whether Uplight earns platform status or remains one layer in a multi-vendor utility stack.
