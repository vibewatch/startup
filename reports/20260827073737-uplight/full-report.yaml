      - number: '3.5'
        title: Market positioning is strongest in utility-led residential and mass-market flexibility
        blocks:
          - type: paragraph
            body: >-
              Uplight appears best positioned where the buyer is a utility serving broad residential or mixed customer
              populations and wants one vendor to connect engagement, enrollment, and flexible-load execution. That
              positioning is stronger than the C&I-centric pitches of Voltus or CPower and more customer-facing than the
              infrastructure-first stories from Oracle Utilities, Itron, or Landis+Gyr. It also differs from EnergyHub
              and Virtual Peaker, which are often associated more directly with device and DER orchestration. In
              practical terms, Uplight's sweet spot is the utility that needs to scale demand flexibility without
              building a fragmented stack across customer communication, program management, and dispatch measurement.
              The tradeoff is that this positioning can leave Uplight exposed in accounts where buyers prefer deeper
              grid operations tooling, merchant demand-response optimization, or meter/AMI vendors already embedded in
              the utility's architecture. Uplight's positioning is therefore differentiated, but not immune to bundling
              pressure from incumbents or specialization pressure from aggregators.
