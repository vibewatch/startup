  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Top risk picture
        blocks:
          - type: paragraph
            body: >-
              Uplight should be underwritten as a strategically relevant but operationally dense utility-software
              platform rather than as a simple SaaS company. Its product set spans customer engagement, efficiency,
              demand response, DER orchestration, and VPP enablement, and that breadth was assembled through the merger
              of Tendril and Simple Energy plus later acquisitions including FirstFuel, EEme, and EnergySavvy. The
              result is meaningful market reach but also a real possibility that product integration, codebase cohesion,
              and organizational alignment lag the external platform story. The company's 2026 ownership transition adds
              to that complexity: Octopus Energy acquired a majority stake, Schneider retained a minority stake, and
              leadership shifted after Luis D'Acosta stepped down with Hannah Bascom serving in an interim operating
              role. Public sources still support a credible commercial footprint, yet they do not provide the level of
              financial, retention, or incident disclosure that would fully neutralize execution risk.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
      - number: '7.2'
        title: Platform integration and acquisition-complexity risk
        blocks:
          - type: paragraph
            body: >-
              The most company-specific structural risk is that Uplight is an assembled platform, not a natively built
              single-stack product. Company and investor-facing materials describe the 2019 formation from Tendril and
              Simple Energy and the subsequent addition of FirstFuel, EEme, and EnergySavvy; competitors chapter
              evidence also notes that the 2024 AutoGrid acquisition sharpened orchestration claims. That history can
              create genuine product breadth, but it also raises classic roll-up risks: duplicated modules, inconsistent
              data models, uneven user experience, multi-codebase maintenance, and sales messaging that outruns actual
              technical unification. In a utility environment, integration debt matters because implementations are
              long-lived and customers often require one platform to connect customer communications, device enrollment,
              measurement, and grid operations. If roadmap integration slips, Uplight risks both higher delivery costs
              and competitive vulnerability to point solutions that appear more coherent in one workflow.
            claimRefs:
              - CR002
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR002
