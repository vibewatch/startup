      - number: '4.7'
        title: Capital adequacy cannot be confirmed from public sources alone
        blocks:
          - type: paragraph
            body: >-
              Public sources are not sufficient to judge Uplight's current liquidity, debt burden, or runway. The
              company remains privately held, does not publish a full balance sheet, and has not disclosed cash on hand,
              revolving debt, project liabilities, or free-cash-flow conversion in the retained source set. The 2021 $73
              million round and the March 2026 control transaction both indicate continued access to strategic capital,
              which lowers immediate financing-risk concerns relative to a distressed startup. However, strategic
              ownership can conceal as much as it reveals: without data room access, it is impossible to know whether
              Octopus acquired a healthy, cash-generative platform or stepped in to stabilize an asset that needed a new
              capital sponsor. This uncertainty is especially relevant because utility-facing businesses can experience
              working-capital swings tied to implementation-heavy contracts and long collection cycles. Financial
              diligence therefore needs current cash, debt, deferred-revenue, and burn data before any firm conclusion
              on capital adequacy is warranted.
