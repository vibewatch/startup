      - number: '3.4'
        title: Uplight's clearest differentiation is unified utility engagement plus flexibility
        blocks:
          - type: paragraph
            body: >-
              Uplight's public differentiation story is more coherent than many specialists because it connects customer
              experience to operational flexibility. The company presents itself as helping utilities drive customer
              acquisition, program enrollment, behavioral load shaping, DER participation, dispatch, and measurement
              rather than stopping at one workflow step. The strongest differentiator in the provided research is that
              Uplight is explicitly utility-B2B rather than a pure aggregator competing for behind-the-meter asset
              control or merchant market spread. That matters because utilities often need regulatory alignment,
              white-labeled engagement, and integration into existing customer programs. The second differentiator is
              full-stack workflow breadth from enrollment through dispatch and M&V. The third is commercial reach:
              85-plus utility relationships can create referenceability, data access, and procurement familiarity that
              point-solution entrants lack. Finally, the 2024 acquisition of AutoGrid materially strengthens Uplight's
              claim to unify customer engagement with DERMS-grade orchestration, reducing what had been a more obvious
