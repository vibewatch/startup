  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Included Spend
        blocks:
          - type: paragraph
            body: >-
              The right market boundary for Uplight is not generic climate software or broad utility IT. Uplight's most
              relevant market combines utility customer engagement, demand response program management, DER
              orchestration, and virtual power plant enablement sold to regulated and municipal utilities. Included
              spend therefore covers software and services used to recruit customers into efficiency and flexibility
              programs, integrate thermostats, EV chargers, batteries, and other DERs, forecast and dispatch flexible
              load, and administer performance, incentives, and grid event operations. Excluded spend includes wholesale
              generation assets, transmission equipment, behind-the-meter hardware sold without orchestration software,
              generic CRM tools, and consumer energy apps that do not tie into utility programs. This boundary matters
              because analyst estimates vary depending on whether they count only demand response program value, broader
              DERMS software, or fully aggregated VPP revenues. For Uplight, the operative market sits at the
              intersection of grid software and outsourced program operations, which is why services remain material in
              category economics. The buyer is usually a utility business unit responsible for customer programs,
              demand-side management, distributed energy, or grid modernization, while the end user is the participating
              residential or commercial customer. That means Uplight's market opportunity is large, but more narrow than
              a headline energy transition TAM because it depends on utility budgets, approved programs, and operational
              readiness.
            claimRefs:
              - CM001
              - CM002
              - CM003
