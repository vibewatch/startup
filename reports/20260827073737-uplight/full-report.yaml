      - number: '5.3'
        title: Flex DERMS and virtual power plant operating model
        blocks:
          - type: paragraph
            body: >-
              The most technically consequential part of Uplight's stack is Flex DERMS, the engine the company says
              monitors, forecasts, and dispatches DERs using predictive controls. Official DERMS and VPP materials
              describe AI-powered forecasting, multiple dispatch strategies, same-day measurement and verification, and
              the ability to aggregate residential, business, and C&I resources across different markets and asset
              classes. Public 2026 materials state that Uplight manages 500k+ devices and 8.5 GW of flexible capacity
              worldwide, while the platform page cites 4.9 GW of orchestrated demand on one high-level view. The
              discrepancy does not necessarily imply contradiction; it more likely reflects different product-scope or
              time-scope cuts across pages, but it does create a diligence point on KPI harmonization. The VPP page also
              makes clear that Uplight positions its VPP offer as more than seasonal demand response: dispatchable
              year-round capacity, targeted feeder-level flexibility, forecasting, event management, measurement and
              verification, and incentive processing are all part of the operating model. If accurate in practice, this
              means utilities can use the same vendor to recruit participants, connect devices, forecast flexible
              capacity, dispatch localized events, and verify event impact. That operating breadth is one of the
              company's strongest product claims and one that became more plausible after the AutoGrid acquisition.
