      - number: '6.2'
        title: Buyer, User, Payer, and Segment Structure
        blocks:
          - type: paragraph
            body: >-
              The customer structure around Uplight is more complex than a standard software vendor's account list
              because buyer, user, payer, and beneficiary often differ. The buyer is usually a regulated utility,
              municipal utility, community energy provider, or retail energy organization. The payer may be a utility's
              customer-program budget, demand-side management allocation, grid modernization budget, or
              regulator-approved cost-recovery mechanism. The user can be a utility program manager, customer-experience
              team, distributed-energy operations team, contractor network, or end customer interacting with a
              marketplace, device, report, rate, or incentive offer. This structure helps explain why Uplight sells both
              customer-engagement and flexibility workflows: customer acquisition and behavior change are part of the
              same economic system that produces load shifting and distributed-energy participation. Public case
              material shows segmentation across low-income engagement, EV managed charging, demand response, rate
              program enrollment, contractor workflow automation, marketplace adoption, and broader DER flexibility. For
              diligence, the important implication is that Uplight's value is not just in logo acquisition but in
              linking multiple internal utility stakeholders to large downstream populations.
            claimRefs:
              - CU008
