      - number: '1.5'
        title: Customer Base, Reach, and Market Footprint
        blocks:
          - type: paragraph
            body: >-
              Public scale markers indicate that Uplight has reached meaningful penetration in the North American
              utility software market even though detailed revenue disclosures remain unavailable. Uplight says it works
              with more than 85 utility clients and reaches over 110 million energy customers through those utility
              relationships. It also says its platform supports approximately 8.5 GW of flexible load, a figure that
              positions the company as materially relevant in demand response and virtual power plant enablement rather
              than as a niche pilot vendor. These metrics should be interpreted as company-claimed operating reach, not
              as independently audited financial KPIs, but they are still useful for calibrating market presence. The
              customer list is not fully enumerated in a single current public source, yet partner announcements and
              utility case studies show work with large investor-owned and municipal utilities. Uplight's emphasis on
              utility channels means its end-user reach is much larger than its number of direct paying customers. This
              creates leverage if renewals are strong, but it also means a relatively concentrated enterprise customer
              base likely accounts for most revenue. Geography appears centered on the United States, with global
              employee or customer references that imply some broader footprint. For diligence, the right takeaway is
              that Uplight has scale credibility at the market-access level, but not enough public disclosure to infer
              retention, revenue per utility, or program profitability.
            claimRefs:
              - CO036
              - CO037
              - CO038
              - CO039
              - CO040
              - CO041
      - number: '1.6'
        title: Workforce, Culture, and Operating Profile
        blocks:
          - type: paragraph
            body: >-
              Uplight presents itself as a mission-oriented clean-energy employer with a meaningful operating footprint
              for a private utility software company. Third-party people-data sources and company references point to a
              workforce of roughly 700 employees globally, though this should be treated as an approximate current
              marker rather than a precision financial disclosure. The B Corp certification reinforces a public identity
              around stakeholder governance, employee culture, and climate impact, which may help in utility procurement
              contexts where mission alignment matters. At the same time, a business of this size likely carries a
              material fixed cost base across software engineering, implementation, utility program operations, sales,
              and customer success. Because Uplight sits between enterprise SaaS and managed services, headcount
              intensity may be structurally higher than a pure software company with similar reach. Public sources do
              not provide the detailed breakdown investors would want, such as R&D concentration, international
              distribution, or post-acquisition restructuring plans. Workforce diligence is especially relevant after
              the Octopus transaction because new ownership may look for product integration, cost synergies, or
              go-to-market consolidation. In other words, the employee base is both an asset and a cost center: it
              embeds utility-domain expertise and program delivery capability, but it may also compress margins if
              growth stalls or managed-service work dominates the mix.
