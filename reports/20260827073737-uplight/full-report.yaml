  - id: FR003
    title: Ownership and leadership transition timeline
    type: timeline
    layout: standard
    summary: >-
      Uplight's risk increased as valuation compression, majority acquisition, and leadership change converged across
      2021 to 2026.
    data:
      items:
        - date: '2021-10-01'
          label: 2021 financing reported at about $1.5B valuation
        - date: '2026-03-01'
          label: Octopus Energy announced majority acquisition of Uplight
        - date: '2026-03-01'
          label: Schneider Electric remained a minority shareholder
        - date: '2026-03-01'
