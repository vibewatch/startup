            body: >-
              Uplight's capitalization table appears dominated by strategic and platform investors rather than by a
              broad late-stage venture syndicate. Public sources tie Schneider Electric, AES, Rubicon Technology
              Partners, and Huck Capital to the company's financing and formation history, while Octopus Energy became
              the majority owner in March 2026. Schneider explicitly said it would remain a minority shareholder after
              the Octopus transaction, preserving some continuity with the earlier strategic ownership structure.
              Rubicon's role was especially important in assembling Tendril, Simple Energy, FirstFuel, EEme, and
              EnergySavvy into the broader platform that became Uplight, which means some of the company's value
              proposition was built through corporate combination as much as through organic product creation. The
              practical financial implication is that Uplight now sits inside a strategic-owner context that could
              reduce standalone disclosure, alter transfer-pricing or go-to-market assumptions, and increase the
              likelihood that future capital allocation is driven by parent-level priorities. Investors evaluating
              Uplight as a standalone asset should therefore request the current cap table, any shareholder rights
