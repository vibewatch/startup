      - number: '5.7'
        title: Trust, security, privacy, and compliance controls
        blocks:
          - type: paragraph
            body: >-
              Uplight provides more public evidence on security posture than on some other operating details, but the
              record still has gaps. The platform page says a dedicated security and compliance team runs endpoint
              detection and response, security monitoring, vulnerability scanning, and penetration testing, with
              certified external auditors reviewing controls as part of a SOC 2 compliance process. The linked security
              brief goes further by describing independently audited SOC 2 Type 2 reports and an integrated approach to
              security, privacy, and compliance. These statements are useful because utilities evaluating DER
              orchestration and customer-data platforms typically require evidence of both control maturity and formal
              assurance. At the same time, public materials reviewed here do not clearly disclose ISO 27001 status,
              specific privacy frameworks, detailed data-retention controls, or product-level uptime and incident
              reporting. In other words, Uplight appears to have a legitimate enterprise security posture, but the
              public evidence is still selective and marketing-shaped. The diligence conclusion is that trust controls
              are a relative strength for initial screening, yet a buyer should still request the actual SOC 2 report
              scope, penetration-test summaries, security architecture documentation, and any incident history before
              underwriting platform risk.
