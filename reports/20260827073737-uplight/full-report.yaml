              - CE028
              - CE029
      - number: '5.5'
        title: AutoGrid acquisition and capability expansion
        blocks:
          - type: paragraph
            body: >-
              The February 2024 acquisition of AutoGrid is central to understanding how Uplight strengthened its product
              and technology position. Uplight's acquisition page states that the deal expanded partners, programs,
              customer engagement depth, and the ability to create and manage flexible capacity globally. It also
              describes the combined platform as bringing together Uplight's customer-engagement expertise with
              AutoGrid's flexibility-management platform across demand response, DERMS, ADMS, VPPs, microgrids,
              grid-scale storage, and energy-market access. The page's quick-reference section cited 8,300+ MW of
              flexible resources under management at the time of the deal, serving 8 of the 10 largest utilities and 2
              of the 5 largest global energy companies in 17 countries. Those facts suggest the AutoGrid integration
              increased both the geographic and technical depth of Uplight's offering, especially for utilities wanting
              predictive dispatch and grid-operations-grade DER orchestration. Strategically, the key product
              implication is that Uplight could marry utility customer engagement and recruitment strengths with deeper
              orchestration technology, making Flex DERMS more credible. The remaining diligence issue is integration
              maturity: public materials present the combination positively, but they do not disclose how much product
              consolidation, code- base unification, or organizational integration work remained through 2026.
            claimRefs:
