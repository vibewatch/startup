      - number: '2.3'
        title: Buyer, User, and Payer Segmentation
        blocks:
          - type: paragraph
            body: >-
              Uplight's commercial path is shaped by the fact that buyer, user, and payer are not the same actor. The
              direct buyer is typically a utility or retail energy provider; the payer may be the utility's
              customer-program budget, grid modernization budget, or a regulator-approved cost-recovery mechanism; and
              the end user is the household or commercial site enrolling devices or changing usage behavior. Residential
              programs matter because thermostats, EVs, and batteries are the easiest scale channel for flexible load
              aggregation, but commercial and industrial customers remain important because they offer larger
              single-site curtailment and more explicit ROI. Public segmentation data supports that commercial buildings
              represent 27.8% of the demand response market, showing the segment is too large to ignore even when
              residential enrollment narratives dominate media coverage. At the same time, services account for 32% of
              the demand response market, implying utilities continue to buy execution capability and not just software.
              That mix aligns with Uplight's combined software-plus-managed-program model. Adoption generally begins
              with a utility objective such as peak reduction, capacity procurement, or customer engagement, then moves
              through program design, regulatory approval where needed, device-partner integration, customer enrollment,
              dispatch, and measured performance. This long path can support durable contracts once embedded, but it
              slows new-logo velocity.
