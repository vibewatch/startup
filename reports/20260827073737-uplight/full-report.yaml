  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and customer workflow scope
        blocks:
          - type: paragraph
            body: >-
              Uplight's product is best understood as a utility operating platform rather than a single application. The
              company sells software and managed program capabilities that help energy providers recruit customers into
              energy programs, personalize engagement, connect devices and distributed energy resources, forecast grid
              flexibility, dispatch events, and measure resulting system impact. Official 2026 site architecture groups
              these offerings into customer engagement and flexibility-management families, with named solution surfaces
              for marketplace, energy reports, customer portals, rates engagement, demand response, DER management,
              virtual power plants, and batteries. The product therefore spans both front-office utility workflows and
              control-room-adjacent grid operations. That breadth is strategically important because utilities
              increasingly want one technology layer that can tie customer messaging, program administration, device
              enrollment, and dispatch outcomes together. Uplight's own framing of the platform as connecting customers
              and the energy ecosystem to the control room is consistent with this view and is reinforced by metrics
              around annual customer touchpoints, concurrent forecasting, and energy demand orchestrated. For diligence,
              the core workflow claim is credible: Uplight is not just a marketing or rebate tool but a cross-functional
              utility platform designed to influence both customer behavior and DER operations.
            claimRefs:
