  - id: FR004
    title: Risk-control matrix
    type: matrix
    layout: wide
    summary: >-
      Uplight's major risks map to unevenly disclosed mitigants, with the thinnest public support around integration and
      cybersecurity assurance.
    data:
      columns:
        - Public mitigant signal
        - Residual concern
      rows:
        - label: Platform integration
          values:
            - Broad product scope and strategic backing
            - Public record does not prove deep technical unification
        - label: Leadership transition
          values:
            - Parent-company support and installed customer base
            - Interim structure may not settle quickly
        - label: Cybersecurity
          values:
            - Baseline legal/trust surface exists
            - Detailed assurance and incident-history evidence is thin
        - label: Competitive pressure
          values:
            - Utility footprint and combined engagement-plus-flexibility story
            - Rivals may be deeper in specific workflows or better bundled
    claimRefs:
      - CR009
      - CR018
      - CR028
      - CR037
      - CR045
