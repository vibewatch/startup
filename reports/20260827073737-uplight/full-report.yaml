chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity and History
        blocks:
          - type: paragraph
            body: >-
              Uplight's corporate identity is best understood as the roll-up and integration of several software
              companies built around utility customer engagement, distributed energy management, and energy-efficiency
              analytics. Uplight was launched in 2019 through the merger of Tendril and Simple Energy, two established
              clean-energy software vendors backed by Schneider Electric and other investors. Public materials and later
              investment commentary also describe Uplight as having been assembled with the help of additional
              acquisitions including FirstFuel, EEme, and EnergySavvy, giving the company a broader product base than
              either predecessor had on a standalone basis. That consolidation matters because it explains why the
              company today spans consumer engagement, marketplace and energy efficiency programs, demand response, DER
              orchestration, and virtual power plant enablement rather than looking like a single-point solution. The
              company is headquartered in Boulder, Colorado and has presented itself as a mission-driven climate
              technology business that works through regulated utilities rather than selling primarily direct to
              consumers. Uplight is also a certified B Corporation, which adds a governance and mission signal but does
              not substitute for financial disclosure. The most consistent description across official and third-party
              sources is that Uplight combines software, analytics, and managed program delivery to help utilities
              influence customer load, enroll distributed assets, and improve decarbonization outcomes. The company's
              history therefore reflects sector convergence: energy-efficiency software, customer experience, and
              grid-flexibility orchestration have been combined into one utility platform over several M&A steps since
              2019.
