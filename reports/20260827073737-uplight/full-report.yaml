      - number: '3.6'
        title: Competitive dynamics favor bundling by incumbents and specialization by aggregators
        blocks:
          - type: paragraph
            body: >-
              The current competitive dynamic is structurally unfavorable to middle-of-the-stack vendors that cannot
              prove either suite consolidation value or unmatched specialist ROI. Oracle Utilities, Itron, and
              Landis+Gyr can use existing utility procurement relationships and adjacent installed bases to bundle new
              modules. Aggregators such as Voltus, CPower, Leap, and Enel X can counter by highlighting market
              participation expertise, event performance, and program monetization rather than broad software breadth.
              Adjacent orchestration vendors such as EnergyHub and Virtual Peaker compete on device ecosystem depth and
              utility flexibility operations. This means Uplight must win with a specific thesis: utilities can achieve
              better adoption and operational results when customer engagement is not divorced from dispatch and program
              execution. The AutoGrid acquisition sharpens that thesis, but acquisitions also create integration risk if
              utilities suspect the roadmap is a stitched combination rather than a natively unified platform.
              Competitively, Uplight needs proof that combined engagement-plus-DERMS delivers measurable incremental
              value relative to pairing a customer-engagement product with another dispatch engine.
