      - number: '6.5'
        title: Partner Ecosystem as a Customer Acquisition and Delivery Layer
        blocks:
          - type: paragraph
            body: >-
              Uplight's ecosystem partner base is commercially important because many customer outcomes depend on
              connected devices, installers, marketplaces, and adjacent software layers. Company materials describe more
              than 65 ecosystem partners, and product pages present a device- and platform-agnostic operating model
              rather than a closed hardware stack. Named partners provided in the brief include ecobee, Google Nest,
              Honeywell, Tesla, SolarEdge, and ChargePoint, while retained public case evidence directly supports ecobee
              and Google Nest participation in customer programs. For utility customers, that ecosystem matters because
              enrollment and dispatch economics improve when a software vendor can connect to the installed base that
              households and businesses already use. It also means Uplight can expand inside an account by launching new
              device-backed programs after winning an initial engagement or marketplace workflow. The tradeoff is
              dependency: part of Uplight's customer value proposition relies on partner availability, interoperability,
              and channel cooperation. From a customer analysis perspective, the partner layer should be viewed both as
              a growth enabler and as a source of execution complexity.
