      - number: '5.4'
        title: Technical architecture and interoperability layer
        blocks:
          - type: paragraph
            body: >-
              Uplight's public technical architecture centers on a centralized data lake, AI and machine-learning
              models, configurable SaaS applications, and flexible external APIs. The platform page says this shared
              layer ingests 30 billion data points per hour, runs 400,000 concurrent forecasts, and powers both
              first-party applications and external APIs. The DERMS page adds more specific architecture claims: open
              APIs, support for IEEE 2030.5, upstream integration with grid DERMS and ADMS, and interoperability across
              customer touchpoints, OEMs, energy markets, and utility systems. The VPP page further claims support for
              40+ OEMs and 10+ open protocols. Together these signals support the view that interoperability is a real
              platform capability rather than a purely aspirational marketing point. Architecturally, the most likely
              model is a shared data and forecasting substrate feeding program management, asset monitoring, customer
              notification, dispatch, and measurement services. However, Uplight does not publicly disclose the
              underlying cloud providers, data-residency architecture, specific API standards beyond IEEE 2030.5 and
              OpenADR, or the exact partition between Uplight-built code and AutoGrid-acquired technology. For
              underwriting, the evidence supports broad integration readiness, but not yet enough detail to fully assess
              stack complexity, multi-tenancy boundaries, or operational resilience by subsystem.
            claimRefs:
