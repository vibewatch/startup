            body: >-
              Uplight does not publicly disclose audited revenue, ARR, or free cash flow in the retained source set, so
              any operating-revenue discussion must be framed explicitly as estimation. The strongest public operating
              markers are the company's claims of serving more than 85 utility clients, reaching more than 110 million
              energy customers, and enabling roughly 8.5 gigawatts of flexible load, alongside third-party indications
