      - number: '3.7'
        title: Moats depend more on utility relationships and workflow embedding than on pure technology novelty
        blocks:
          - type: paragraph
            body: >-
              Uplight's moat is most believable as a relationship and workflow moat rather than as an untouchable
              technical moat. Utility procurement cycles are slow, integrations are consequential, and switching risk
              grows once a vendor is embedded across customer programs, event operations, and performance measurement.
              The 85-plus utility relationship base can therefore matter materially if it translates into renewals,
              module expansion, and reference-led selling. Full-stack enrollment-to-dispatch capability also raises
              switching friction because replacing Uplight may require multiple point products, retraining, and fresh
              integration work. However, these barriers are not absolute. Large incumbents have broader balance sheets
              and incumbent systems access, while specialists can slot into one part of the stack without forcing a full
              rip-and-replace. The most durable version of Uplight's moat would be evidence that its integrated customer
              plus DER orchestration produces better participation, event yield, or regulatory outcomes than paired
              alternatives. Without that proof, relationship and integration moats remain meaningful but contestable.
