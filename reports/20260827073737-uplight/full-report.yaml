  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Overview
        blocks:
          - type: paragraph
            body: >-
              Uplight's customer base is best understood as a utility-centered enterprise portfolio with a much larger
              downstream consumer footprint. The direct customers are primarily electric and gas utilities and related
              energy providers, while the end users are the households and businesses those utilities serve through
              efficiency, demand response, rates, electrification, and distributed-energy programs. Across company
              pages, conference materials, and deal coverage, the most repeated scale markers are more than 85 utility
              clients, more than 110 million energy customers reached, and approximately 8.5 gigawatts of flexible load
              under management. Those metrics are company-claimed rather than audited financial disclosures, but they
              are consistent with Uplight's positioning as a scaled grid-flexibility and customer-engagement platform
              rather than a niche pilot vendor. The installed base also appears strategically valuable because a
              relatively limited number of utility logos can unlock very large downstream participation pools. That
              means customer count alone understates reach, but it also means enterprise concentration can matter more
              than the top-line logo total. Public evidence therefore supports the claim that Uplight has meaningful
              customer presence, while leaving open how much of that footprint is deeply deployed, revenue productive,
              or contracted under multi-year terms.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU006
