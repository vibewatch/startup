  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape spans incumbents, aggregators, and adjacent DER software
        blocks:
          - type: paragraph
            body: >-
              Uplight's competitive set is broad because utilities can buy the underlying job to be done in several
              different ways. At one end are utility IT and metering incumbents such as Oracle Utilities, Itron, and
              Landis+Gyr, which sell platform layers including MDM, analytics, AMI operations, distribution automation,
              and DER-related software into long-standing utility accounts. At another end are dispatch-first
              flexibility specialists such as Voltus, CPower, Leap, and Enel X that win when the buyer's core objective
              is monetizing demand response or distributed assets rather than running a unified customer and
              grid-engagement program. A third tier includes adjacent software and device-orchestration vendors such as
              EnergyHub, Virtual Peaker, Generac, and KrakenFlex that sit closer to DER aggregation, VPP enablement,
              residential device control, or retailer-linked flexibility. The practical substitute is not one perfect
              like-for-like rival; it is a utility assembling multiple vendors across customer engagement, enrollment,
              dispatch, M&V, DERMS, and AMI. Uplight therefore wins only when utilities value a unified utility-facing
              operating layer more than best-of-breed specialization.
            claimRefs:
