companyProfile:
  summary: >-
    Uplight is a Boulder, Colorado-based clean energy SaaS company formed in 2019 through the consolidation of Tendril,
    EnergyHub, FirstFuel, Ecotagious, UtilityAPI, and Simple Energy. The company provides software and data analytics to
    electric and gas utilities, enabling grid flexibility, demand response, virtual power plants (VPPs), and customer
    engagement. In March 2026, UK-based Octopus Energy acquired a majority stake in Uplight at a reported valuation of
    just over $1 billion, with Schneider Electric retaining a minority position. Uplight serves over 85 utility clients
    reaching more than 110 million end customers and manages approximately 8.5 GW of flexible load capacity.
  foundedDate: '2019-01-01'
  founders:
    - name: Adrian Tuck
      role: CEO (co-founder via Tendril)
      background: Former CEO of Tendril, one of the predecessor companies that merged to form Uplight
  foundingLocation: Boulder, CO, USA
  headquarters: Boulder, CO, USA
  productSummary: >-
    SaaS platform for utility demand management including demand response, virtual power plant orchestration,
    distributed energy resource management (DERMS), energy efficiency program delivery, customer engagement tools, and
    marketplace solutions for energy products.
  customerFocus: Electric and gas utilities and energy retailers primarily in North America
  businessModel: SaaS subscription and usage-based fees for utility demand management platforms
  stage: Acquired majority by Octopus Energy (March 2026)
  fundingStatus: >-
