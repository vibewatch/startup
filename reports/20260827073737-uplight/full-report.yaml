      - number: '5.2'
        title: Demand Stack and module architecture
        blocks:
          - type: paragraph
            body: >-
              Demand Stack is Uplight's clearest product-packaging construct for chapter 5 because it integrates the
              major utility jobs the company claims to solve in one portfolio. The official Demand Stack page and site
              navigation show a module family that spans energy efficiency and electrification, rates engagement, demand
              management, virtual power plants, and DER management, while the platform page adds shared technical layers
              including a centralized data lake, configurable SaaS applications, AI models, and external APIs. This
              architecture suggests a hub-and-spoke design: common data, forecasting, and interoperability services feed
              specialized user-facing applications and utility programs. In customer workflow terms, utilities can start
              with customer-facing offers such as marketplaces, reports, and portals, then extend those interactions
              into flexible-load program enrollment and dispatch. Uplight's public product language repeatedly
              emphasizes an end-to-end path from recruitment through event management and measurement and verification
              rather than isolated point functions. That integrated framing is a meaningful differentiation claim, but
              investors should note that the company does not publicly provide a granular SKU map, module-level pricing,
              or a definitive separation between legacy Uplight modules and the AutoGrid-derived orchestration layer.
              The platform is visibly broad; the remaining diligence question is how natively unified it is underneath
              the marketing wrapper.
