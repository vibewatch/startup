            body: >-
              Oracle Utilities, Itron, and Landis+Gyr are the most credible broad-platform competitors because they
              already sell core utility systems and can expand from adjacent control points. Oracle Utilities positions
              itself around customer care, meter data management, outage, analytics, and grid operations, making it
              dangerous wherever procurement favors enterprise suite consolidation. Itron combines AMI, distributed
              intelligence, grid-edge software, and demand-side offerings, which makes it especially relevant when
              utilities want one provider spanning network and device layers. Landis+Gyr similarly combines smart
              metering, grid management, flexibility, and distribution-automation messaging. By contrast, Voltus,
              CPower, Leap, and Enel X are more programmatic competitors: they are strongest when a utility or market
              participant prioritizes demand-response enrollment, dispatch, market access, and settlement density. Those
              firms do not always mirror Uplight's customer-engagement pitch, but they can outcompete it in event
              execution, C&I concentration, or wholesale-market monetization. The result is a two-front battle in which
