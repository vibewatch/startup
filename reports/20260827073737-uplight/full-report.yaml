            body: >-
              Although Uplight does not disclose margins publicly, its operating model implies a heavier cost base than
              a pure software vendor. A company of roughly 700 employees serving utilities across customer engagement,
              energy efficiency, demand response, and DER orchestration likely carries substantial costs in
              implementation, customer success, regulatory program operations, data science, engineering, and device or
              integration support. Those delivery demands are amplified by long sales cycles and customization
              requirements common in utility software. As a result, even if gross retention is strong, contribution
              margins could lag those of lighter-weight enterprise SaaS peers until the platform scales further or
              standardizes deployments. The strategic sale to Octopus may also indicate that parent-level distribution,
              integration, or cross-market synergies are needed to unlock better operating leverage. For underwriting,
