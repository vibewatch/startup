      - number: '1.2'
        title: Leadership and Governance
        blocks:
          - type: paragraph
            body: >-
              Uplight's leadership picture changed materially in 2026 and should be treated as a transition situation
              rather than a settled steady state. Adrian Tuck served as chief executive around the 2019 formation period
              and remained the key public face of the company through much of its post-merger growth. In March 2026,
              however, Uplight announced that CEO Luis D'Acosta would step down, and subsequent coverage and company
              materials indicated that Hannah Bascom would serve as interim general manager from April 2026. That
              sequence implies a management handoff during the same window as the Octopus Energy majority acquisition,
              raising the likelihood that strategy, reporting lines, and product priorities are being re-shaped under
              new ownership. Public evidence on the board is thinner than evidence on the executive transition.
              Schneider Electric historically held a controlling or major strategic position before the Octopus
              transaction, Rubicon Technology Partners was involved in assembling the platform, and current ownership
              now appears centered on Octopus with Schneider retaining a minority stake. But the public record reviewed
              here does not provide a full, current board roster, committee structure, or minority-protection terms. For
              diligence purposes, the leadership signal is mixed: there is strong evidence of experienced
              utility-software operators and strategic shareholders, but also clear evidence of executive turnover at a
              pivotal ownership-transition moment. That makes governance diligence and post-acquisition operating
              accountability important follow-up topics.
