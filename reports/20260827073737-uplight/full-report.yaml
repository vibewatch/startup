  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Valuation history shows strategic relevance but a lower 2026 control price
        blocks:
          - type: paragraph
            body: >-
              Uplight's best-supported financial anchors are valuation events rather than full operating statements. In
              July 2021, Uplight announced a $73 million strategic investment led by Schneider Electric and AES, and
              Bloomberg reported that the financing valued the company at about $1.5 billion. That round validated the
              market's willingness at the time to pay premium multiples for utility software tied to decarbonization,
              customer engagement, and flexible-load management. By March 2026, Octopus Energy agreed to acquire a
              majority stake in Uplight, while Schneider Electric said it would remain a minority shareholder. Latitude
              Media described the transaction as valuing Uplight at roughly $1 billion based on industry sources,
              implying a meaningful step-down from the 2021 private mark even if the exact purchase price was not
              publicly disclosed. This does not automatically mean Uplight's business deteriorated by one-third, because
              broader climate-tech and SaaS multiples compressed sharply between 2021 and 2026. Still, the reset
              matters: any current investor must underwrite the company based on present operating performance and
              strategic fit rather than on its peak-cycle valuation.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
