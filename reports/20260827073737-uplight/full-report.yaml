      - number: '6.6'
        title: Retention, Repeat Usage, and Durability Signals
        blocks:
          - type: paragraph
            body: >-
              Retention is the weakest part of Uplight's public customer record, not because the business necessarily
              lacks durability, but because the evidence is indirect. Utility software and program platforms often have
              sticky characteristics once integrated into customer communications, marketplaces, incentives, and
              demand-side operations, and Uplight's multi-workflow positioning should theoretically support renewals and
              cross-sell. Named repeat proof also exists in the sense that some utilities are presented as expanding
              from one customer surface to another, such as combining marketplace, device, charging, and flexibility
              programs. But retained public sources do not disclose NRR, GRR, logo churn, average contract length,
              renewal rates, cohort survival, or satisfaction metrics in a form that can be underwritten quantitatively.
              This gap matters because a company can have many recognizable utility customers while still exhibiting
              weak expansion or uneven economics. The evidence therefore supports a qualitative durability hypothesis
              based on embedded utility workflows and program breadth, but not a verified retention conclusion. For
              diligence, Uplight should be asked to produce renewal cohorts, gross retention by utility segment, and
              module expansion history for top accounts.
            claimRefs:
              - CU034
              - CU035
              - CU036
              - CU037
              - CU038
              - CU039
      - number: '6.7'
        title: Expansion Logic, Concentration Risk, and Procurement Friction
        blocks:
          - type: paragraph
            body: >-
              Uplight's customer model creates a credible land-and-expand narrative, but also concentrates commercial
              risk into a finite set of large buyers. Winning a utility account can create openings across customer
              engagement, rate communication, marketplaces, EV and thermostat offers, managed charging, DER
              orchestration, and broader flexibility programs. That means share of wallet per customer could be
              significant if adoption broadens over time. Public proof from case libraries and conference agendas
              suggests multiple entry points into the same utility environment, supporting the expansion thesis. At the
              same time, if the customer base is 85-plus utilities rather than thousands of smaller accounts, revenue
              concentration and renewal timing almost certainly matter. Utility procurement cycles are slow, regulated,
              and sensitive to program performance evidence, so delays in one major account can affect growth
              disproportionally. The chapter therefore treats customer expansion as plausible and strategically
              attractive, but concentration, contract dependence, and procurement friction remain material unresolved
              risks until management data shows the revenue distribution and renewal profile.
            claimRefs:
              - CU040
              - CU041
              - CU042
              - CU043
              - CU044
              - CU045
      - number: '6.8'
        title: Adverse Signals and Remaining Customer Diligence Questions
        blocks:
          - type: paragraph
            body: >-
              The main adverse signal in the customer record is not a public mass-churn event, but the absence of the
              proof investors would normally want to separate broad market access from durable, profitable customer
              relationships. Public case-study ecosystems naturally emphasize successes, and aggregator pages are
              helpful for finding named deployments but are not a substitute for audited retention data or a ranked
              customer list. Sector commentary on VPP and flexibility adoption also warns that utilities can face
              enrollment friction, incentive dependence, and implementation complexity, which can make customer
              expansion slower than logo counts imply. Uplight's customer claims around 85-plus utilities,
              110-million-plus energy customers, and 8.5 gigawatts of flexible load may all be directionally true, but
              they remain largely company-claimed or marketing-mediated in the retained public record. For that reason,
              the chapter ships with explicit evidence gaps around concentration, renewals, contract terms, and
              production-versus-pilot breakdown. The customer conclusion is positive on commercial relevance and
              negative on disclosure completeness: Uplight appears to have a real customer base, but outsiders still
              cannot cleanly quantify its quality.
            claimRefs:
              - CU046
