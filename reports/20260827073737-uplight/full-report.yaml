      - number: '5.6'
        title: Deployment model, implementation dependencies, and roadmap signals
        blocks:
          - type: paragraph
            body: >-
              Uplight's deployment model appears to depend on integration breadth and managed-program execution as much
              as on software licensing alone. Official product pages repeatedly emphasize turnkey services, strategic
              partnerships with grid DERMS and ADMS providers, ecosystem connectivity, and the ability to support
              multiple program types, device operating envelopes, and market constructs. This implies that
              implementation success depends on upstream utility data access, downstream device and OEM cooperation, and
              smooth connection into grid-operations systems. The upside is that this architecture can shorten
              time-to-value for utilities that prefer pre-integrated workflows. The downside is that it creates external
              dependency risk and potentially long implementation cycles. Roadmap signals are visible but not deeply
              documented. The October 2026 site still frames the platform around AI-driven forecasting, predictive
              dispatch, batteries, and control-room visibility, which implies continued focus on distributed-load
              orchestration and electrification. However, Uplight does not publish a public changelog, release history,
              uptime history, or an open product roadmap. Investors therefore have enough evidence to conclude the
              platform is operationally deployed and still expanding, but not enough to benchmark release velocity,
              implementation duration, or reliability SLAs from the public record alone.
            claimRefs:
