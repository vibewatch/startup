      - number: '6.4'
        title: Named Customer Proof and Outcome Quality
        blocks:
          - type: paragraph
            body: >-
              Named customer proof is one of Uplight's stronger public assets because multiple sources point to
              identifiable utilities and described use cases rather than anonymous testimonials. The customer set
              visible in retained sources includes SMUD, Puget Sound Energy, Dominion Energy Virginia, Alliant Energy,
              PSEG Long Island, Commonwealth Edison, Orange and Rockland Utilities, Pioneer Community Energy, Consumers
              Energy, and Evergy. The associated use cases span EV charger adoption, rate program enrollment, low-income
              energy savings, customer rewards, marketplace engagement, managed charging, contractor workflow
              automation, and virtual power plant strategy. That breadth matters because it shows Uplight is not limited
              to one narrow customer use case. Still, proof quality differs across entries. Some sources cite specific
              outcomes or customer speakers, while others mainly confirm a relationship or conference appearance. The
              chapter therefore distinguishes production-like deployments with concrete outcomes from softer proof such
              as agenda participation or directory-style customer references. Overall, the named-customer evidence
              supports real commercial penetration and varied use cases, but not a complete revenue-ranked customer
              roster or a full view of production maturity for every logo.
