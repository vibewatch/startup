              credible strategic backers, scale claims that exceed pilot-stage relevance, and a recent control
              transaction that demonstrates buyer interest. Yet the public record still lacks audited revenue, margin,
              retention, and cash data, and even the 2026 valuation anchor is an informed estimate from independent
              reporting rather than a disclosed purchase price. Post-acquisition comparability is another issue: once
