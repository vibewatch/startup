  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation, confidence, risk rating, and valuation stance
        blocks:
          - type: paragraph
            body: >-
              Uplight deserves credit for having real strategic scarcity within utility software. The company is not
              just another subscription application: public 2026 coverage and company materials point to more than 85
              utility relationships, more than 8.5 gigawatts of flexible load, and an installed workflow that connects
              customer engagement, demand response, and distributed-energy-resource orchestration. Those qualities make
              it plausible that a strategic buyer would pay above generic software medians. Even so, the price
              discipline conclusion is cautious. Public reporting places the March 2026 Octopus majority-stake
              transaction at roughly or just over $1 billion, while multiple 2026 recaps cite a 2021 valuation near $1.5
              billion. Using the supplied ARR estimate of roughly $103 million implies around 9.7x ARR, which is above
              broad 2026 public-software medians and at or above the upper end of many ordinary private-software ranges.
              Because the public record does not disclose Uplight's NRR, gross margin, EBITDA, customer concentration,
              or software-versus-services mix, the right call at the reported price is track with medium confidence and
              a fair-to- stretched valuation stance rather than buy.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
          - type: table
            tableRef: TV001
            claimRefs:
              - CV006
              - CV011
              - CV024
              - CV041
              - CV057
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV006
              - CV024
              - CV030
              - CV041
      - number: '8.2'
        title: 2021-to-2026 valuation reset establishes the current anchor
        blocks:
          - type: paragraph
            body: >-
              The valuation context is anchored by two public points. First, Schneider Electric and AES announced a $73
              million investment in Uplight in June 2021, and multiple 2026 recap articles describe that financing as
              having valued the company at approximately $1.5 billion. Second, Octopus Energy agreed in March 2026 to
              acquire a majority stake while Schneider remained a significant minority investor. Official and
              independent coverage did not disclose detailed deal consideration, but Latitude Media reported Uplight had
              been seeking a valuation of just over $1 billion, while Kurrant described a formal sale process around a
              valuation of roughly $1 billion. That gap matters. It means Uplight did not preserve its 2021 peak mark
              through the software repricing cycle. At the same time, a billion-dollar anchor is still substantial and
              suggests the market continues to assign material value to the platform despite a reset. Public evidence
              therefore supports framing 2026 as a strategic recapitalization at a lower price, not as a collapse.
            claimRefs:
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
              - CV017
              - CV018
              - CV019
