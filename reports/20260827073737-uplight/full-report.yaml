      - number: '1.7'
        title: Strategic Transactions and Milestones
        blocks:
          - type: paragraph
            body: >-
              Uplight's milestone history is defined more by strategic assembly and ownership change than by a typical
              sequence of named venture rounds. The foundational event was the 2019 merger of Tendril and Simple Energy
              into the Uplight brand. Additional acquisitions or integrations of FirstFuel, EEme, and EnergySavvy
              expanded the platform's breadth. In 2021, Schneider Electric and AES invested $73 million at a reported
              $1.5 billion valuation, a milestone that publicly validated Uplight's category position during the
              clean-energy software boom. The next major chapter came in March 2026 when Octopus Energy agreed to buy a
              majority stake. That event matters not just as a financing outcome but as a strategic repositioning:
              Octopus gains deeper U.S. utility software exposure, while Uplight gains a new parent with substantial
              retail energy and flexibility ambitions. Management change around the same period, including Luis
              D'Acosta's departure and Hannah Bascom's interim operating role, suggests the transaction was accompanied
              by organizational transition. Taken together, these milestones show a company that has repeatedly been
              valued for its strategic fit inside larger energy-platform ecosystems. That may improve long-term
              strategic durability, but it also means independence as a standalone venture-scale outcome appears less
              likely than it did several years earlier.
