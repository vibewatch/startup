    title: Recommendation logic
    type: flow
    summary: >-
      Track recommendation follows from strategic strength being offset by already-demanding price and incomplete KPI
      disclosure.
    data:
      nodes:
        - id: scale
          label: 85+ utilities and 8.5 GW flexible load
        - id: strategy
          label: Strategic fit for Octopus U.S. market entry
        - id: price
          label: Reported valuation around US$1B
        - id: multiple
          label: Implied about 9.7x ARR on supplied US$103M ARR
        - id: opacity
          label: No public NRR, margin, or services-mix proof
        - id: rec
          label: Recommendation = track
      edges:
        - from: scale
          to: strategy
        - from: strategy
          to: rec
        - from: price
          to: multiple
        - from: multiple
          to: rec
        - from: opacity
          to: rec
