      - number: '2.4'
        title: Growth Drivers and Market Expansion Catalysts
        blocks:
          - type: paragraph
            body: >-
              Several structural drivers support category growth in 2026. Power-system volatility, electrification, and
              rising peak loads are increasing the value of flexible demand relative to building new peaking supply.
              FERC Order 2222 is a foundational policy driver because it requires regional grid operators to enable
              distributed energy resources to participate in wholesale markets, improving the economic logic for
              aggregation and virtual power plant platforms even if implementation remains uneven by region. Federal and
              state decarbonization goals also keep utilities focused on demand-side resources that can defer
              infrastructure upgrades and reduce carbon intensity. The spread of connected devices such as smart
              thermostats, EV chargers, heat pumps, and residential batteries increases the addressable pool of
              dispatchable assets. For Uplight specifically, the convergence of customer engagement with grid
              flexibility is a favorable driver because utilities increasingly want one operating layer spanning
              enrollment, communications, incentives, and event execution. Analyst and policy sources also suggest
              reliability concerns following extreme weather and tight reserve margins are making flexible load less
              discretionary and more strategic. The market is therefore expanding not just because utilities like
              digital tools, but because grid economics increasingly reward the orchestration of distributed demand.
            claimRefs:
              - CM021
              - CM022
              - CM023
              - CM024
              - CM025
              - CM026
