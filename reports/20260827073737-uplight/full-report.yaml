        - Useful private-market range for scaled software sellers
        - Advisory estimate, not a direct observed Uplight comp
      - - Acquiry traditional SaaS >30% growth
        - Private ARR range
        - 5x-8x ARR
        - Benchmark for healthy non-AI growth-stage SaaS
        - General software benchmark, not utility-specialist specific
    notes: >-
      Enumeration is intentionally partial because public disclosure does not support a uniform peer set with consistent
      denominators, and the retained rows are the ones directly used in this chapter's valuation reasoning.
    claimRefs:
      - CV013
      - CV014
      - CV021
      - CV022
      - CV023
      - CV025
      - CV026
      - CV027
      - CV028
  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Retention quality disappoints
        - NRR below roughly 105 percent or meaningful churn in large utility accounts
        - Breaks premium-software thesis and narrows strategic scarcity
        - Re-rate toward base or bear range
      - - Gross margin proves services-heavy
        - Gross margin materially below software-like levels or implementation-heavy mix dominates
        - Compresses transferable ARR multiple
        - Treat strategic price as non-repeatable for financial buyers
      - - AutoGrid integration remains incomplete
        - Product, data, or go-to-market integration issues remain unresolved into next planning cycle
        - Weakens synergy and platform-breadth thesis
        - Move recommendation down absent repricing
      - - Customer concentration is too high
        - Top utility exposure or renewal clustering is materially elevated
        - Makes revenue less durable than logo count implies
        - Increase downside probability weighting
      - - Octopus synergy capture stalls
        - No visible Kraken collaboration or utility-channel benefits emerge
        - Strategic premium loses support
        - Underwrite only standalone economics
    notes: >-
      Thresholds are diligence-oriented because public sources do not disclose the underlying KPI values; they define
      what management evidence would invalidate the current view.
    claimRefs:
      - CV043
      - CV044
      - CV055
      - CV056
      - CV057
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - Revenue quality
        - Current ARR bridge and software-versus-services revenue mix
        - Determines whether a near-10x multiple is transferable or only strategic
        - CFO diligence packet and board materials
      - - Retention
        - NRR, GRR, cohort expansion, and logo churn by utility segment
        - Retention is a major 2026 multiple driver in retained benchmark sources
        - Management metrics room plus cohort export
      - - Margins
        - Gross margin, contribution margin, and EBITDA after AutoGrid integration
        - Margin quality differentiates premium software from service-heavy platforms
        - Finance diligence and audited statements if available
      - - Deal structure
        - Exact March 2026 consideration, rollover terms, and minority protections
        - Headline valuation may differ from economic value
        - Legal documents, SPA, or fairness materials
      - - Concentration
        - Top customer ARR and renewal schedule exposure
        - Utility concentration can compress valuation despite large end-user reach
        - Revenue concentration analysis from finance team
      - - Synergy evidence
        - Post-close roadmap with Octopus, Kraken, and Schneider systems
        - Confirms whether strategic premium is realizable in operations
        - Product and GTM diligence with operating sponsors
    notes: >-
      These diligence asks map directly to the biggest unverified drivers of valuation transferability and
      recommendation movement; they are not generic diligence boilerplate.
    claimRefs:
      - CV042
      - CV043
      - CV055
      - CV056
      - CV058
      - CV059
