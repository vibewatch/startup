              Uplight's commercial positioning suggests a hybrid revenue model rather than pure high-margin SaaS. The
              company sells utility-facing customer engagement, energy efficiency, demand response, virtual power plant,
              and DERMS capabilities, and public descriptions repeatedly emphasize managed program delivery in addition
              to software. That likely means a portion of revenue is recurring platform subscription or license revenue,
              while another portion is implementation, program operations, utility campaign delivery, analytics, or
