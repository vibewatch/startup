      - number: '1.3'
        title: Funding History and Ownership Structure
        blocks:
          - type: paragraph
            body: >-
              Uplight's funding and ownership history shows a company that was financed as a strategic clean-energy
              platform more than as a conventional venture-backed SaaS startup racing toward IPO. In 2021, Uplight
              announced a $73 million investment led by Schneider Electric and AES, and contemporaneous reporting pegged
              the company's valuation at about $1.5 billion. That financing supported the market narrative that
              utilities would increasingly pay for customer engagement and flexible-load software as the grid
              decentralized. Earlier backers also included Huck Capital and Rubicon Technology Partners, the latter
              having played a central role in combining Tendril, Simple Energy, and other assets. By March 2026 the
              ownership story had shifted meaningfully: Octopus Energy agreed to acquire a majority stake in Uplight,
              while Schneider Electric said it would remain a strategic minority shareholder. Latitude Media and other
              sector outlets described the transaction as valuing Uplight at roughly $1 billion, implying a valuation
              reset relative to the 2021 private mark even if exact deal terms were not publicly disclosed. That lower
              estimated value can be read in two ways. Positively, it gave Octopus a way to pair Kraken and retail
              flexibility ambitions with an established U.S. utility software footprint. More cautiously, it suggests
              Uplight did not preserve its peak private valuation through the market correction. The company remains
              privately held and does not publicly disclose a full cap table, liquidation preferences, or debt profile.
            claimRefs:
