  - CR011
- calloutType: risk
  title: Ownership change and CEO departure create a transition window
  body: The Octopus majority acquisition, Schneider's minority position, and Luis D'Acosta's departure together create a real possibility of customer, employee, and roadmap uncertainty during 2026.
  claimRefs:
  - CR004
  - CR005
  - CR018
- calloutType: insight
  title: Utility stickiness helps, but sales-cycle friction still constrains growth
  body: Once deployed, utility software can be sticky; the risk is that long buying cycles, regulatory delays, and underperforming program adoption slow new bookings and expansion before stickiness can translate into financial resilience.
  claimRefs:
  - CR013
  - CR015
  - CR039
