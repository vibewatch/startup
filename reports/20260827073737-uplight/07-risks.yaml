- calloutType: risk
  title: Assembled-platform complexity is the most idiosyncratic company risk
  body: Uplight's broad product promise is also its clearest execution hazard because multiple acquisitions and product lines increase the chance of integration debt, duplicated functionality, and delivery complexity.
  claimRefs:
  - CR002
