  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: sizing-gap
    missingEvidence: Segmented ACV, card volume, and product-attach metrics by customer cohort or country.
    whyItMatters: Without monetization detail, public TAM claims cannot be converted into a credible Clara-specific SAM or SOM.
    diligencePath: Request management cohort data split by startup, mid-market, and enterprise customers plus revenue or volume per segment.
    relatedQuestionRefs:
    - QM022
  - type: missing-source
    severity: material
    topic: market-definition
    missingEvidence: A high-quality public Latin America spend-management market study with transparent methodology.
    whyItMatters: Most public TAM figures come from low-transparency syndicated research summaries and should not be treated as underwriting-grade inputs.
    diligencePath: Source a bank, consultant, or payments-network report with explicit methodology for regional corporate-spend software or B2B payments.
    relatedQuestionRefs:
    - QM005
    - QM006
    - QM007
    - QM025
  - type: private-evidence-only
    severity: minor
    topic: buyer-map
    missingEvidence: A customer-segment mix by company size, industry, geography, and use case.
    whyItMatters: Public logos show breadth but do not reveal where the bulk of revenue or gross profit actually comes from.
    diligencePath: Request internal customer segmentation and net revenue mix by country and segment.
    relatedQuestionRefs:
    - QM012
    - QM013
