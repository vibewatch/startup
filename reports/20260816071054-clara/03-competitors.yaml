- id: SP003
  title: Distribution power, switching cost, and multi-homing
  body: |-
    Distribution is one of the most important competitive fault lines in this market. Clara has grown by aligning software with capital and local payment rails, which creates a wedge into finance teams that already feel pain from slow bank onboarding, weak controls, and fragmented reimbursement or AP workflows. Once card issuance, approval rules, ERP sync, and vendor-payment operations live inside the platform, switching becomes operationally expensive even if contract data is not public. Finance teams must re-issue cards, retrain users, reconnect accounting systems, and restate policy workflows. That is real switching cost, but it is not absolute lock-in: multi-homing is still possible, especially where a company uses one provider for cards, another for travel, and a bank for treasury.

    Competitors exploit exactly that opening. Jeeves’ multi-country positioning appeals to companies that want cards across several jurisdictions. Global leaders such as Ramp and Spendesk lean on integration breadth and software depth. Banks retain the default relationship for deposits, core credit, and payroll. Clara’s best defense is to become the operating system that sits closest to day-to-day spend execution in LatAm, even if the bank remains the balance-sheet anchor. The Colombia partnership evidence is instructive: expansion required Mastercard infrastructure and local partnerships rather than a pure copy-paste rollout. That dependence on external rails is a competitive vulnerability, but also a barrier to new entrants because it is slow to assemble country by country.
