evidenceGaps:
  - type: missing-source
    severity: material
    topic: board-governance
    missingEvidence: A current official board roster, committee structure, and investor governance-rights summary.
    whyItMatters: >-
      Without a current governance pack it is difficult to assess board independence, control rights, and
      lender/investor influence at unicorn scale.
    diligencePath: Request the latest board deck or corporate-governance summary from management or recent investors.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: A company-issued headcount disclosure tied to a date and scope definition.
    whyItMatters: >-
      Public sources vary from roughly 350-400 employees to 742 mapped employees, changing efficiency and
      operating-scale interpretation.
    diligencePath: Ask management for current FTE count by country and function plus prior-year comparison.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: A current post-money valuation or internal financing memo for the 2025 package.
    whyItMatters: >-
      The investment case cannot anchor on a 2026 valuation multiple without knowing whether the latest extension
      repriced the business.
    diligencePath: Request the 2025 financing term sheet, cap-table update, or investor letter summarizing the round economics.
    relatedQuestionRefs:
      - QO016
      - QO025
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: minor
    topic: headquarters
    missingEvidence: >-
      A clear corporate-structure statement covering legal domicile, operating headquarters, and decision-center by
      market.
    whyItMatters: HQ ambiguity is not thesis-breaking, but it affects regulatory, tax, and talent-footprint interpretation.
    diligencePath: Confirm legal entities and reporting lines in management diligence or via corporate-registration extracts.
    relatedQuestionRefs:
      - QO024
  - type: private-evidence-only
    severity: material
    topic: sizing-gap
    missingEvidence: Segmented ACV, card volume, and product-attach metrics by customer cohort or country.
    whyItMatters: Without monetization detail, public TAM claims cannot be converted into a credible Clara-specific SAM or SOM.
    diligencePath: >-
      Request management cohort data split by startup, mid-market, and enterprise customers plus revenue or volume per
      segment.
    relatedQuestionRefs:
      - QM022
  - type: missing-source
    severity: material
    topic: market-definition
    missingEvidence: A high-quality public Latin America spend-management market study with transparent methodology.
    whyItMatters: >-
      Most public TAM figures come from low-transparency syndicated research summaries and should not be treated as
      underwriting-grade inputs.
    diligencePath: >-
      Source a bank, consultant, or payments-network report with explicit methodology for regional corporate-spend
      software or B2B payments.
    relatedQuestionRefs:
      - QM005
      - QM006
      - QM007
      - QM025
  - type: private-evidence-only
    severity: minor
    topic: buyer-map
    missingEvidence: A customer-segment mix by company size, industry, geography, and use case.
    whyItMatters: Public logos show breadth but do not reveal where the bulk of revenue or gross profit actually comes from.
    diligencePath: Request internal customer segmentation and net revenue mix by country and segment.
    relatedQuestionRefs:
      - QM012
      - QM013
