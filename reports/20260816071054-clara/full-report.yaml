companyProfile:
  summary: >
    Clara is a Mexico City-headquartered corporate-finance platform founded in 2020 by Gerry Giacomán Colyer and Diego
    Iván García Escobedo after the pair encountered spend-control and reconciliation pain while scaling Grow Mobility /
    Grin. The company launched in Mexico with a combined corporate-card and spend-management workflow, then expanded
    into Brazil, Colombia, and adjacent LATAM markets. By 2026 Clara's public stack covered corporate cards, spend
    controls, reimbursements, bill pay, invoice management, cross-border payments, travel, banking, and analytics.
    Public scale evidence moved from roughly 10,000 customer companies in 2023 to more than 20,000 organizations in 2025
    and more than 30,000 businesses claimed in 2026, while lender and investor support expanded through a 2025 $80M
    equity/growth package, a $70M IFC/BBVA Spark/Covalto debt facility, and a renewed Goldman line taking claimed debt
    capacity above $250M. The underwriting challenge is that this operating progress sits alongside unusually thin
    public disclosure on revenue quality, margin structure, losses, and any post-2021 repricing beyond the last clean
    $1B unicorn mark.
