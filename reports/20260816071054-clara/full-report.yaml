      - number: '4.2'
        title: Traction proxies, unit economics signals, and cost structure hints
        blocks:
          - type: paragraph
            body: >-
              Clara reveals enough public operating data to show traction, but not enough to underwrite unit economics
              cleanly. TechCrunch reported in April 2023 that Clara served 10,000 companies, ran at roughly five million
              annual credit-card transactions, and processed about $1 billion of annualized card volume. By 2025,
              multiple company and media sources shifted the customer base to more than 20,000 organizations across
              Brazil, Mexico, and Colombia, while a 2026 Goldman renewal announcement claimed more than 30,000
              businesses. Mexico Business News added a helpful operational detail: Clara was processing about one
              transaction per second in 2025. These figures support growth and product usage, but they still do not
              expose take rate, revenue per customer, credit losses, servicing cost, or implementation cost.


              The clearest cost-structure clues come from management commentary around headcount, profitability, and
              product investment. FinTech Futures said Clara planned to increase staff from roughly 350 to 400 by the
              end of 2025 while continuing to invest in AI, enterprise sales, and engineering. Mexico Business News
              reported monthly break-even in Brazil and that Mexico was nearing the same milestone. Those statements
              suggest improving contribution margins in core markets, but they also imply ongoing commercial and product
              investment. The product mix itself points to a hybrid cost base: software development and customer support
              on one side, and underwriting, fraud, payment-operations, and funding costs on the other. In other words,
              Clara may scale better than a balance-sheet-heavy lender, but it is still more capital- and
              operations-intensive than pure workflow SaaS.
