  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive set and who Clara actually displaces
        blocks:
          - type: paragraph
            body: >-
              Clara competes on several overlapping fronts. The first is direct spend-management fintechs that combine
              cards, approval workflows, and accounts payable automation. In Latin America, Conta Simples is the
              clearest regional peer on expense management and cards, while Jeeves appears more oriented toward
              multi-country card issuance and multinational operating teams. The second front is global software-centric
              leaders such as Ramp, Brex, and Spendesk. Those companies present finance software suites that cover
              cards, expense management, bill pay, procurement, travel, and AI-assisted controls. They matter because
              they define the product-quality bar and attract multinational customers, even if their strongest operating
              footprint is outside Clara’s core market. The third front is the incumbent banking stack: BBVA, Santander,
              and similar business banks that already control the account, treasury, and underwriting relationship but
              usually offer less integrated workflow software.


              That layered landscape means Clara usually wins not by having the broadest global software catalog, but by
              packaging local payments, cards, liquidity, and compliance into a LatAm-native control system. Citi
              Ventures described the company as the premier spend-management solution in LATAM, and Clara’s own
              2025-2026 messaging shifted decisively toward medium and large enterprises in Brazil, Mexico, and
              Colombia. Competitively, this implies Clara is trying to defend a regional operating moat rather than a
              pure feature moat. Ramp or Brex may look stronger on AI marketing, documentation depth, and mature U.S.
              finance automation, but neither is publicly positioned around SPEI, SAT-driven tax workflow, Colombian
              expansion partnerships, or Brazilian licensing. That distinction is real, though not invulnerable if
              global peers deepen local partnerships.
