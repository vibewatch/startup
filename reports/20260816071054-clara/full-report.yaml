      - number: '7.3'
        title: Partner, capital, and dependency risk
        blocks:
          - type: paragraph
            body: >-
              Clara’s model depends on partners more deeply than pure SaaS does. Card networks, local payment rails,
              banking or issuing partners, ERP ecosystems, and debt providers all influence product reliability and
              growth capacity. The Colombia expansion coverage showed Mastercard partnership and infrastructure as
              foundational to launch. Debt-facility history shows Goldman, Accial, IFC, BBVA Spark, and Covalto as
              strategically important to scaling payment products. These are strengths when relationships are healthy,
              but they also create dependency risk: adverse underwriting changes, facility limits, or operational issues
              at a partner can constrain growth quickly.


              Customer-facing product breadth amplifies this dependency. If Clara wants to support cards, AP, fleet,
              travel, cross-border, and eventually global products, then support, compliance, and liquidity all have to
              stay synchronized. The approved subprocessors list on the Trust Center is another reminder that the
              platform relies on a vendor ecosystem beyond what public pages spell out in detail. Dependency risk should
              therefore be monitored at three levels: infrastructure partners that enable transactions, capital partners
              that enable financing, and technology partners that enable data movement and integrations. None of those
              dependencies is fatal alone, but their combination raises correlated downside if multiple relationships
              tighten at once.
            claimRefs:
              - CR018
              - CR019
              - CR020
              - CR021
