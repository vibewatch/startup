  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              Clara does not compete in a narrow “corporate card only” niche. Across its product pages, investor
              materials, and 2025 growth disclosures, the company defines the relevant workflow as end-to-end corporate
              spend management: card issuance, bill pay, invoice management, reimbursement, approvals, audit trails, ERP
              reconciliation, and increasingly cross-border payments. That means the real substitute set is not just
              another fintech card, but the patchwork of incumbent business-bank products, manual spreadsheet workflows,
              reimbursement processes, and ERP-led back-office controls that Latin American finance teams still use
              today. Citi Ventures makes this explicit, arguing that many businesses in the region still manage expenses
              manually and struggle to access usable corporate cards, especially outside Mexico and Brazil.


              The most useful market boundary therefore has three layers. First is the broad B2B payments rail, where
              all supplier, employee, and travel payments live. Second is the narrower spend-management software layer,
              where approval logic, reconciliation, invoice recovery, and analytics sit. Third is Clara’s practical
              wedge: companies that need locally compliant corporate spending infrastructure in Latin America and value
              integrated cards plus software over general treasury products. BBVA Mexico and Santander Brasil show the
              status quo clearly. Their business portals emphasize liquidity, treasury, payroll, collections, FX, and
              generic payments rather than a finance-operations interface purpose-built for modern spend controls. That
              gap explains why Clara can coexist with banks rather than merely replace them.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
