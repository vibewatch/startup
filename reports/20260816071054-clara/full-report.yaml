      - number: '7.4'
        title: Financial-model and execution risk
        blocks:
          - type: paragraph
            body: >-
              The biggest model risk is that Clara’s economics may be more fragile than a software narrative implies.
              Public evidence points to a hybrid model supported by cards, payments, and debt-backed products, yet
              public disclosures do not include gross margin, CAC, loss rates, reserve policy, churn, or concentration
              by exposure. That opacity matters because customer-count growth and new products can look excellent even
              while credit, fraud, or servicing costs deteriorate underneath. Capital dependence is therefore not just a
              finance issue; it is a risk-rating input. If lenders, investors, or internal underwriting discipline
              tighten, growth in payment products may slow or become less profitable.


              Execution risk is equally material. Clara is expanding product breadth, moving upmarket, and experimenting
              with AI-assisted development at high speed. Each of those moves can strengthen the business, but together
              they create organizational strain. Public sources already show ambiguity around headquarters, headcount,
              and valuation, which suggests the external fact pattern is assembled from many moving parts rather than a
              tightly controlled disclosure pack. That does not prove internal disorder, but it raises the burden of
              proof. The company’s risk profile is therefore that of a fast-scaling regional operator: impressive
              momentum, but meaningful downside if compliance, capital, or execution discipline lags product ambition.
            claimRefs:
              - CR026
              - CR027
              - CR028
              - CR029
              - CR030
              - CR031
              - CR032
              - CR033
