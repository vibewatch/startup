      - number: '2.4'
        title: Growth drivers and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              The strongest growth drivers are digitization, distributed teams, multi-entity complexity, and the need
              for finance teams to prevent misuse before month-end rather than reconcile after the fact. Clara’s own
              product surface aligns tightly with those drivers: automated invoice capture, policy-based approvals, ERP
              integrations, multi-currency logic, WhatsApp receipt submission, and AI-based anomaly detection. Citi
              Ventures also highlights a structural supply gap in the region: legacy issuers are often hard to work
              with, have limited regional presence, and do not reliably approve smaller businesses for corporate cards.
              That combination supports a long runway for software-led displacement.


              The main constraints are equally important. Clara’s local-compliance advantage is necessary because each
              market imposes different card-acceptance, invoicing, tax, fraud, and underwriting realities. TechCrunch’s
              seed coverage stressed local compliance and receipt-management adaptation in Mexico, while later security
              and trust materials emphasize audit readiness, PCI / ISO work, and tax-invoice automation. Those same
              needs create friction: the product must work with local fiscal documentation, cross-border payments, and
              different banking rails; enterprise customers demand reliability and security; and banks still own the
              base liquidity relationship. In other words, Clara benefits from fragmentation, but it must also solve
              that fragmentation at high operational cost. That is why the company keeps raising not just equity but
              debt and structured facilities alongside product capital.
            claimRefs:
