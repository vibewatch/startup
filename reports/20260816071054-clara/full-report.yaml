      - number: '6.3'
        title: Customer durability, expansion, and concentration risk
        blocks:
          - type: paragraph
            body: >-
              Durability is the biggest customer-quality question that public evidence cannot fully answer. Clara’s case
              studies strongly suggest repeat usage and workflow expansion: customers use cards, physical and virtual
              issuance, reimbursements, travel workflows, or vendor-payment controls rather than one isolated feature.
              The product roadmap itself also encourages expansion from one use case into others, which should improve
              retention if execution stays strong. However, Clara does not publicly disclose GRR, NRR, churn, contract
              length, renewal rates, or cohort behavior. Without those, positive testimonial evidence can only be
              treated as directional, not conclusive.


              Expansion appears more legible than retention. The platform now spans cards, AP, Travel Pay, fleet
              products, banking, and AI analytics, all of which create land-and-expand paths once finance teams trust
              the control layer. Concentration risk is harder. Clara highlights recognizable enterprises, but does not
              disclose whether a small set of very large customers drives outsized payment volume or credit exposure.
              Financing partners and named logos help validate enterprise relevance, yet they do not eliminate the
              possibility that customer economics are uneven across segments. Diligence therefore needs two customer
              asks above all others: retention by cohort and concentration by payment volume / exposure, because those
              determine whether Clara’s impressive customer-count story also translates into durable, diversified
              revenue quality.
