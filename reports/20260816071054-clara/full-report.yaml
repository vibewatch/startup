chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, footprint, and business model
        blocks:
          - type: paragraph
            body: >-
              Clara was founded in 2020 to solve a regional corporate-finance problem that its founders had experienced
              first-hand: Latin American companies still handled large portions of card issuance, expense control, and
              bill-pay manually, often through bank products with slow underwriting, limited controls, and weak software
              integration. The company launched publicly in Mexico on March 10, 2021 with a combined corporate-card and
              spend-management platform. Early materials emphasized instant remote onboarding, physical and virtual
              cards, configurable controls, and real-time visibility for finance teams. TechCrunch and Citi Ventures
              both describe the original monetization model as primarily interchange-led, with software and workflow
              automation layered on top as the usage surface deepened.


              By 2026 Clara’s public product scope had widened substantially. Official company, investor, and lender
              materials describe one platform spanning corporate credit cards, invoice recovery, bill pay, cross-border
              payments, travel-focused virtual cards, reimbursement workflows, AI-powered spend controls, and ERP
              integrations. The company’s messaging shifted from startup enablement toward mid-market and enterprise
              operating efficiency, with repeated emphasis on Mexico, Brazil, and Colombia as the three core operating
              markets. Clara’s own 2026 Goldman renewal still frames the company as Latin America’s leading corporate
              spend-management solution, but public sources disagree on whether the practical operating center is still
              Mexico City or now São Paulo. The most defensible reading is that Clara remains Mexico-founded with a
              heavily Mexican footprint while increasingly presenting Brazil as the center of regional scale.
