  customerFocus: >
    Clara targets Latin American SMEs, mid-market firms, and larger regional enterprises that need stronger controls
    over employee spend and vendor payments than local bank products typically provide. Public sources show the company
    serving more than 20,000 organizations in 2025 and claiming more than 30,000 businesses in 2026, with named
    enterprise customers including Hilton, Bolsa Mexicana de Valores, Femsa, Smart Fit, and Movistar.
  businessModel: >
    Clara appears to monetize primarily through corporate-card interchange and credit usage, then layers on workflow
