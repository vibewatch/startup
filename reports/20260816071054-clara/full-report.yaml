      - number: '2.2'
        title: Sizing lenses, penetration, and what is actually measurable
        blocks:
          - type: paragraph
            body: >-
              Public market sizing for Clara’s category is noisy because different sources measure different things.
              Low-confidence research pages such as Straits Research, WorldMetrics, PRSync, and Coherent Market Insights
              point to a very large underlying opportunity: trillions of dollars of Latin American B2B payment flow and
              multibillion-dollar software or corporate-card markets. Those figures are useful only as outer bounds.
              They do not isolate the narrow slice Clara can actually capture, and they often mix payment flow, software
              revenue, and card-issuance value pools. A more disciplined lens comes from public company and country
              proxies. Clara’s own launch materials cite INEGI data that Mexico alone has more than four million SMEs.
              Citi Ventures says client count exceeded 10,000 in early 2023, while 2025-2026 company and lender
              materials put Clara at 20,000 to 30,000+ organizations. Even if those numbers are directionally correct,
              they imply low penetration relative to the total regional business base.


              The right conclusion is not that Clara has a precise trillion-dollar TAM, but that the reachable market is
              large enough to support a scaled platform if the company can keep converting multi-entity, cross-border,
              and enterprise buyers. The constraining factor is not raw market size; it is how much of regional business
              spend can be pulled from banks, manual workflows, and local point solutions into a single controlled
              software layer. Because Clara has not disclosed ACV, card volume per customer, or segment mix, public
              analysts cannot translate broad payment-flow estimates into a clean Clara-specific SAM or SOM. Those gaps
              should be preserved rather than disguised.
            claimRefs:
              - CM010
              - CM011
              - CM012
