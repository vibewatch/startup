      - number: '4.3'
        title: Capital adequacy and financing dependency
        blocks:
          - type: paragraph
            body: >-
              Capital structure is central to Clara’s financial story. Since 2022 the company has repeatedly paired
              equity fundraising with debt or structured facilities to expand payment-product capacity. The pattern is
              visible across the Goldman facility, the Accial line for Colombia, the 2023 equity extension, the
              previously undisclosed 2025 $80 million package, the 2025 IFC/BBVA Spark/Covalto structured debt, and the
              2026 Goldman renewal that pushed total debt capacity above $250 million. This is not incidental financing
              around a software business; it is part of the operating model. Payment and credit products need
              balance-sheet support, concentration limits, and risk controls. Clara therefore needs both investor
              appetite and lender confidence to keep scaling transaction-heavy products.


              The positive interpretation is that multiple high-quality capital partners kept extending support even
              after the 2021 funding boom cooled. The negative interpretation is that growth depends on continuous
              external funding capacity, not just software sales productivity. Public materials also show that some
              facilities are geographically earmarked, such as Colombia-focused debt support or Mexico-and-Colombia
              expansion facilities. That helps local expansion but can also fragment liquidity and operational
              complexity. Diligence should treat capital adequacy, facility covenants, concentration rules, and
              underwriting discipline as first-order financial questions, because these variables directly shape how
              much Clara can grow payments products without stressing margins or balance-sheet risk.
