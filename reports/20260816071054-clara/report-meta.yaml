slug: clara
runDate: '2026-08-16'
company:
  name: Clara
  website: https://clara.com
  sector: Fintech / B2B Corporate Finance
  stage: Series B+ / unicorn
  headquarters: Mexico City, Mexico
  shortDescription: >
    Clara is a Mexico City-based corporate-finance fintech for Latin America,
    combining corporate cards, expense management, accounts payable automation,
    and working-capital rails for 20,000-30,000+ businesses, with the last
    clean public valuation anchor still at the December 2021 $1B unicorn mark.
subtitle: "LATAM corporate-finance infrastructure with real traction, but still an opacity-heavy underwriting case"
coverageNotes: >
  Public evidence is strongest on Clara's product scope, regional expansion,
  named financing rounds, debt facilities, customer-count milestones, and the
  continued support of investors and lenders including Kaszek, General Atlantic,
  Citi Ventures, Goldman Sachs, IFC, BBVA Spark, and Covalto. Public evidence is
  materially weaker on exact ARR, revenue mix, credit losses, cohort retention,
  and current post-2021 pricing. Bloomberg Línea explicitly reported that Clara
  declined to disclose valuation in the 2023 extension round, and later 2025
  funding coverage still did not provide a clean new post-money mark. The right
  read is therefore constructive on company quality but disciplined on valuation.
