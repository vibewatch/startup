companyProfile:
  summary: >
    Clara is a Mexico City-headquartered corporate-finance platform founded in
    2020 by Gerry Giacomán Colyer and Diego Iván García Escobedo after the pair
    encountered spend-control and reconciliation pain while scaling Grow Mobility
    / Grin. The company launched in Mexico with a combined corporate-card and
    spend-management workflow, then expanded into Brazil, Colombia, and adjacent
    LATAM markets. By 2026 Clara's public stack covered corporate cards, spend
    controls, reimbursements, bill pay, invoice management, cross-border
    payments, travel, banking, and analytics. Public scale evidence moved from
    roughly 10,000 customer companies in 2023 to more than 20,000 organizations
    in 2025 and more than 30,000 businesses claimed in 2026, while lender and
    investor support expanded through a 2025 $80M equity/growth package, a $70M
    IFC/BBVA Spark/Covalto debt facility, and a renewed Goldman line taking
    claimed debt capacity above $250M. The underwriting challenge is that this
    operating progress sits alongside unusually thin public disclosure on revenue
    quality, margin structure, losses, and any post-2021 repricing beyond the
    last clean $1B unicorn mark.
  foundedDate: '2020-01-01'
  founders:
    - name: Gerry Giacomán Colyer
      role: CEO and co-founder
      background: >
        Public face of Clara's fundraising and regional expansion. Founder and
        investor materials tie Clara's original insight to his operating
        experience at Grow Mobility / Grin.
      claimRefs: [CO002, CO035]
    - name: Diego Iván García Escobedo
      role: Co-founder and early product / technology leader
      background: >
        Co-founded Clara with Gerry Giacomán after the pair experienced the
        limits of legacy corporate-finance tooling at Grow Mobility / Grin; he
        appeared more visibly in early launch materials than in later financing
        coverage.
      claimRefs: [CO002, CO035]
  foundingLocation: Mexico City, Mexico
  headquarters: Mexico City, Mexico
  productSummary: >
    Clara's platform spans the corporate spend lifecycle: corporate cards,
    employee expense controls, reimbursements, AP and invoice workflows,
    travel-related spend flows, banking/treasury surfaces, analytics, and
    emerging cross-border payment capabilities. The core product thesis is that
    Clara sits at the point of spend and reconciliation rather than only in a
    back-office reporting layer.
  keyProducts:
    - name: Clara Corporate Card
      description: >
        Physical and virtual corporate cards with configurable controls,
        real-time visibility, and policy enforcement for distributed teams.
      claimRefs: [CO005, CE003]
    - name: Clara Expense Management
      description: >
        Spend-management and reimbursement workflows that connect approvals,
        receipt capture, policy controls, and analytics in a single workflow.
      claimRefs: [CE001, CE002]
    - name: Clara Accounts Payable / Bill Pay
      description: >
        Invoice and vendor-payment workflows that extend Clara from employee
        spend into supplier spend and close-process automation.
      claimRefs: [CO010, CE005]
    - name: Clara Cross-border / Banking Stack
      description: >
        Banking, cross-border, and adjacent treasury capabilities that broaden
        the platform beyond a single-country card product.
      claimRefs: [CE002, CE009]
  customerFocus: >
    Clara targets Latin American SMEs, mid-market firms, and larger regional
    enterprises that need stronger controls over employee spend and vendor
    payments than local bank products typically provide. Public sources show the
    company serving more than 20,000 organizations in 2025 and claiming more
    than 30,000 businesses in 2026, with named enterprise customers including
    Hilton, Bolsa Mexicana de Valores, Femsa, Smart Fit, and Movistar.
  businessModel: >
    Clara appears to monetize primarily through corporate-card interchange and
    credit usage, then layers on workflow value from spend management, AP, and
    other software-like modules that can improve retention and expansion.
    However, public disclosures do not cleanly separate interchange, SaaS,
    float, lending spread, or payments revenue, so the quality of the blended
    margin profile remains a central diligence question.
  stage: Series B+ / unicorn
  fundingStatus: >
    Clara's public financing history includes a $30M Series A plus $50M debt
    facility in May 2021, a $70M Series B at a reported $1B valuation in
    December 2021, a $60M 2023 extension round with undisclosed valuation, an
    announced $80M equity/growth package in 2025, a $70M structured debt
    facility from IFC, BBVA Spark, and Covalto in late 2025, and a renewed
    Goldman Sachs line in early 2026 that Clara said brought total debt
    capacity above $250M. Tracxn's public profile still shows roughly $204M of
    total funding and a $1B current valuation, but that should not be mistaken
    for a fresh priced equity round.
  disclosureProfile: private-disclosed
  claimRefs: [CO002, CO003, CO007, CO010, CO013, CO016, CO017, CO018, CO024, CO035, CE001, CE002, CE005, CE009]

summary:
  headline: >
    Clara looks like a credible LATAM corporate-finance platform winner in
    formation, but the absence of clean public unit economics and a fresh priced
    valuation makes this a research-more / price-discipline story, not a blind
    chase.
  overallScore: 6.2
  recommendation: research-more
  confidence: medium
  riskRating: high
  valuationStance: unknown
  keyMetrics:
    valuationUsdM: 1000
    revenueRunRateUsdM: null
    arrUsdM: null
    revenueGrowthYoYPct: null
    grossMarginPct: null
    nrrPct: null
    totalRaisedUsdM: 204
    customerCount: 30000
    headcount: null
  topStrengths:
    - "Clara has built a broad workflow stack across cards, expenses, AP, travel, analytics, and emerging cross-border/banking rails, which is more defensible than a single-product corporate-card story."
    - "Public adoption signals are real: roughly 10,000 customer companies in 2023, 20,000+ organizations in 2025, and 30,000+ businesses claimed in 2026 across Latin America."
    - "The company continues to attract sophisticated capital partners across equity and debt, including Citi Ventures, General Atlantic, Kaszek, Goldman Sachs, IFC, BBVA Spark, and Covalto."
    - "Brazil, Mexico, and Colombia expansion suggests Clara is solving a regional workflow problem that local incumbents have historically served with weaker software and controls."
    - "The last clean public valuation anchor remains $1B rather than an obviously inflated 2025-2026 step-up, which preserves the possibility of a reasonable entry if current performance has compounded materially."
  topRisks:
    - "Public disclosure is still too thin on revenue composition, contribution margins, losses, and cohort retention to underwrite the blended economics confidently."
    - "Clara's model appears meaningfully dependent on lender support, debt-facility capacity, and partner rails, so funding-market or underwriting shocks could hit growth and product breadth at the same time."
    - "A new financing at a much steeper valuation without matching transparency would likely compress upside and expose investors to preference-stack and pricing risk."
    - "Cross-country fintech execution in Latin America creates persistent compliance, fraud, credit, and localization risk, especially as Clara broadens from cards into AP, banking, and cross-border flows."
    - "Customer-count growth is visible publicly, but product-depth, spend concentration, and module-retention data remain under-disclosed, so apparent scale may overstate durable economics."
  unresolvedGaps:
    - "Exact ARR, net revenue, and revenue mix across interchange, software, lending spread, float, and payments remain undisclosed."
    - "Gross margin, contribution margin by product, and loss/charge-off performance are not available in public evidence."
    - "Retention quality is unclear: public sources do not disclose NRR, gross retention, module attach, or cohort behavior by country or customer segment."
    - "Debt-facility terms, covenant structure, pricing, and concentration limits are not public, despite the clear importance of capital availability to the operating model."
    - "No clean post-2021 priced valuation is public, so investors cannot tell whether current private marks are still near $1B or materially above it."
    - "Public headcount evidence is inconsistent, which limits confidence in operating-efficiency benchmarking against global peers."
disclaimer: >
  This report is a research-only diligence note prepared from public sources as of
  August 16, 2026. It is not investment advice, an offer, a solicitation, or a
  recommendation to buy or sell any security. Undisclosed operating metrics,
  valuation marks, and unit economics are explicitly treated as unknown,
  estimated, or conditional where appropriate.
