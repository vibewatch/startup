- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Why it matters
  - Current public status
  - Risk if missing
  - Best diligence ask
  rows:
  - - Revenue / ARR
    - Baseline scale and valuation anchor
    - Not publicly disclosed with precision
    - Hard to benchmark growth quality
    - Provide trailing twelve-month revenue and by-product mix
  - - Gross margin by product
    - Shows software vs payments vs credit economics
    - Not disclosed
    - Model could be lower-margin than implied by software narrative
    - Break out contribution margin by cards, payments, software
  - - CAC / payback
    - Tests enterprise-GTM efficiency
    - Not disclosed
    - Upmarket motion may be more expensive than expected
    - Share segment payback by country and channel
  - - Loss rates / reserve policy
    - Critical for financing products
    - Not disclosed
    - Hidden credit losses could offset growth
    - Provide net loss, vintage, and reserve data
  - - Retention / NRR / GRR
    - Measures durability of installed base
    - Not disclosed
    - Customer count growth may mask churn
    - Provide logo and dollar retention by cohort
  - - Cash burn / runway
    - Capital adequacy beyond announced facilities
    - Not disclosed publicly
    - Next round timing unclear
    - Provide cash balance, burn, runway, and covenant headroom
  notes: These are the core blockers preventing a full underwriting-quality financial assessment from public sources alone.
