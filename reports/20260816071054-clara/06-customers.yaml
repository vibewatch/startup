- id: SU002
  title: Adoption trajectory and evidence of real deployment
  body: |-
    Public adoption evidence is imperfect but directionally strong. TechCrunch reported 10,000 customer companies in 2023, while 2025 financing sources repeatedly cited more than 20,000 organizations across Brazil, Mexico, and Colombia. Clara’s 2026 Goldman renewal pushed that public claim above 30,000 businesses. These figures are not enough to prove depth of usage on their own, but they do show durable expansion over several years. The stronger evidence comes from production-style customer stories that describe specific use cases: replacing prepaid cards with corporate credit, eliminating reimbursements, accelerating invoice processing, enabling travel payments, or simplifying physical and virtual card issuance. Those are operating-workflow testimonials, not abstract endorsements.

    Several sources also point to geographic depth. The 2023 Accial announcement said Clara had more than 1,300 clients in Colombia and delivered its solution across 27 states, which is unusually concrete for a private fintech. The 2025 IFC and Mexico Business News debt releases tied the platform to named regional enterprises and more than 20,000 active client organizations. Still, deployment evidence remains weighted toward company-controlled stories. Public sources do not disclose active-card rates, payment volume by cohort, or detailed module penetration. The right read is that Clara has moved well beyond pilot-stage adoption, but public data still under-describes how usage varies by customer size, market, or workflow.
