chapter:
  number: 6
  title: Customers
  summary: Public evidence supports a real and growing Clara customer base across Mexico, Brazil, and Colombia, with concrete testimonials spanning multiple industries and finance workflows. But because retention, concentration, and cohort data remain undisclosed, the customer story is stronger on adoption breadth and named proof than on underwritten durability.
sections:
- id: SU001
  title: Who pays, uses, and approves Clara
  body: |-
    Clara’s customer base is defined less by one industry and more by a common finance-operations problem: companies with distributed spend, multiple vendors, or cross-entity workflows that want tighter control before accounting close. The clearest economic buyer is still the finance function—CFOs, controllers, finance directors, treasury leads, and AP owners—while day-to-day users include employees, travelers, operations managers, and accountants. Official customer stories repeatedly show finance leaders or operations leads as the internal champions, with Clara stepping in where bank cards, reimbursements, and vendor payments were previously fragmented or manual.

    The customer set also appears broader than the classic startup-only wedge. Public testimonials span fitness, logistics, HR/payroll, real estate, e-commerce, sports, cybersecurity, and consumer internet companies. 2025 debt and financing announcements name enterprises such as Hilton, Bolsa Mexicana de Valores, Femsa, Smart Fit, and Movistar, while older case stories show Clara solving day-to-day expense problems for growth companies. The most defensible segmentation is therefore by workflow intensity and geography rather than by narrow vertical: operationally complex companies in Mexico, Brazil, and Colombia that need cards, approvals, invoice handling, and reporting to work together. That gives Clara expansion room across both high-growth digital companies and more traditional regional operators.
