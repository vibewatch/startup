- id: SU004
  title: Overall customer verdict
  body: |-
    The public customer story for Clara is stronger on breadth of logos and workflow specificity than on contract-quality disclosure. That is still valuable. Many private fintechs can claim customer counts, but Clara’s public materials show concrete operational outcomes across multiple industries and multiple countries, with examples of faster card issuance, reduced reimbursement pain, improved travel controls, or working-capital benefits. The regional enterprise names cited by IFC and Mexico Business News also matter because they suggest Clara is not limited to startup customers.

    At the same time, the chapter’s main caution is straightforward: we cannot prove customer durability from testimonials alone. A large installed base, recognizable logos, and expanding product breadth all point in the right direction, but public evidence still lacks the cohort and concentration data needed to convert customer enthusiasm into underwriting-grade certainty. The best current conclusion is that Clara has real, production customer adoption and a plausible expansion engine, while retention quality and concentration risk remain material diligence gaps.
