- id: SR005
  title: Risk verdict and kill criteria
  body: |-
    Clara’s risk map is serious but not thesis-breaking by default. Most major risks are understandable consequences of building a regional payments-and-spend platform: regulation is complex, partners matter, capital matters, and product quality must stay aligned with local rules. The strongest mitigants visible publicly are high-quality funding partners, explicit compliance language, country-by-country product discipline, and evidence that customers are using the platform in real workflows rather than as shelfware. Those are real strengths.

    The main thesis-break triggers are equally clear. A material regulatory or compliance failure in a core market, a sharp contraction in debt capacity or underwriting flexibility, evidence of hidden credit/fraud losses, or proof that enterprise customers are churning or concentrating too heavily would all damage the case meaningfully. Short of that, the central diligence task is to turn public posture into verified operating evidence. Clara looks like a company whose risks can be managed if the control systems are genuinely strong; it also looks like a company where small failures could compound quickly because software, compliance, and capital are so tightly linked.
  claimRefs:
  - CR034
  - CR035
  - CR036
  - CR037
  - CR038
  - CR039
  - CR040
