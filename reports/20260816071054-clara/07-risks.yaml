- id: SR002
  title: Operational, security, and fraud risk
  body: |-
    Operational risk is high because Clara sits directly in the path of approvals, card authorizations, vendor payments, reimbursements, and financial reporting. The public security page emphasizes granular governance, preventative controls, audit readiness, and fraud blocking before payment execution. The trust-center materials and compliance portal further suggest a formal security program, but they also show that some detail remains private or NDA-gated. That means public diligence can verify posture, not performance. The most important operational question is whether control quality is consistent across every module and market. A company can have strong card controls in one country and still suffer AP, reimbursement, or invoice-recovery problems elsewhere.

    Fraud and document-quality risk are particularly important. Clara Intelligence claims very high extraction accuracy and ties automation to fiscal-compliance outcomes, but public sources do not disclose false-positive rates, fraud losses, authorization decline rates, or outage history. AI-driven speed can improve workflow quality, yet it can also create new failure modes if guardrails lag product velocity. The 2026 AI-built Clara Global release makes roadmap speed look impressive, but also increases pressure on infrastructure, testing, and security practices. This is therefore not a generic software-security risk; it is a compounding risk where product automation, compliance correctness, and money movement must all work together under enterprise-grade expectations.
  claimRefs:
  - CR009
  - CR010
  - CR011
  - CR012
  - CR013
