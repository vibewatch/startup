- id: founders-leadership-governance
  title: Founders, leadership, and governance
  body: |-
    The two publicly documented co-founders are Gerry Giacomán Colyer and Diego Iván García Escobedo. TechCrunch, Clara’s own launch materials, and Citi Ventures all link the founding insight back to the pair’s experience at Grow Mobility / Grin, where fast regional growth exposed the limits of legacy corporate-finance tooling. Gerry has consistently appeared as CEO in public materials. Diego was presented as co-founder and product/technology lead in the 2021 launch and Series A materials, while later investor coverage and press releases position him more implicitly behind the product stack rather than as the visible public executive.

    Leadership expanded materially after the 2023 fundraising cycle. Bloomberg Línea reported that Hans Tung joined the board in connection with the 2023 round, while Raquel Hernández joined from Meta into a senior engineering role and Tina Reich became a risk adviser / board observer. Clara’s own 2025 newsroom announcement confirmed the addition of Reich and Hernández to the global leadership team. In 2026, the company announced Travis Foxhall’s elevation to CFO and Jorge de Lara’s appointment as president of Clara Mexico, signaling a stronger enterprise-and-capital-markets orientation. What remains missing is a clean, current, full board roster. Public sources identify Michael Gilroy of Coatue as the first investor board member in 2021 and add Hans Tung later, but do not disclose the entire current board, committee structure, or formal governance rights attached to recent financing tranches. That opacity is notable for a unicorn-scale company now carrying layered venture and structured debt capital.
  claimRefs:
