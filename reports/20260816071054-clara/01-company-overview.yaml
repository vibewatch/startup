  evidenceGaps:
  - type: missing-source
    severity: material
    topic: board-governance
    missingEvidence: A current official board roster, committee structure, and investor governance-rights summary.
    whyItMatters: Without a current governance pack it is difficult to assess board independence, control rights, and lender/investor influence at unicorn scale.
    diligencePath: Request the latest board deck or corporate-governance summary from management or recent investors.
    relatedQuestionRefs:
    - QO008
    relatedTableRefs:
    - TO002
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: A company-issued headcount disclosure tied to a date and scope definition.
    whyItMatters: Public sources vary from roughly 350-400 employees to 742 mapped employees, changing efficiency and operating-scale interpretation.
    diligencePath: Ask management for current FTE count by country and function plus prior-year comparison.
    relatedQuestionRefs:
    - QO024
    relatedTableRefs:
    - TO004
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: A current post-money valuation or internal financing memo for the 2025 package.
    whyItMatters: The investment case cannot anchor on a 2026 valuation multiple without knowing whether the latest extension repriced the business.
    diligencePath: Request the 2025 financing term sheet, cap-table update, or investor letter summarizing the round economics.
    relatedQuestionRefs:
    - QO016
    - QO025
    relatedTableRefs:
    - TO003
  - type: conflicting-data
    severity: minor
    topic: headquarters
    missingEvidence: A clear corporate-structure statement covering legal domicile, operating headquarters, and decision-center by market.
    whyItMatters: HQ ambiguity is not thesis-breaking, but it affects regulatory, tax, and talent-footprint interpretation.
    diligencePath: Confirm legal entities and reporting lines in management diligence or via corporate-registration extracts.
