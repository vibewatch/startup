- id: funding-valuation-capital-structure
  title: Funding history, valuation, and capital structure
  body: |-
    Clara’s capital history mixes classic venture rounds with progressively larger debt facilities. The company launched with a $3.5 million pre-seed in March 2021, announced a $30 million Series A in May 2021, and reached unicorn status in December 2021 with a $70 million Coatue-led Series B at a reported $1 billion valuation. After that, the capital structure became more hybrid. Official and database sources agree on a Goldman Sachs debt facility beginning in 2022 and a $60 million 2023 financing round led by GGV / Notable, but the 2025 financing story is the key diligence wrinkle. Clara’s own 2025 announcement describes a previously undisclosed $80 million mix of equity and growth funding without an explicit 40/40 split. Independent 2025 coverage from FinTech Futures, LatAm List, and Tracxn decomposes that same package into a $40 million equity extension led by Citi Ventures and Kaszek plus a separate $40 million General Catalyst Customer Value Fund facility.

    By late 2025 the company added a $70 million structured debt facility from IFC, BBVA Spark, and Covalto, and in early 2026 said a renewed Goldman line brought total debt capacity above $250 million. Public data providers such as Tracxn continue to display roughly $204 million of cumulative equity funding and a standing $1 billion valuation, while 2023 Bloomberg coverage explicitly notes that Clara declined to disclose an updated valuation. The correct diligence conclusion is therefore not that Clara is definitively worth more than $1 billion in 2026, but that unicorn status remains the last cleanly corroborated post-money mark while more recent rounds emphasized strategic liquidity and go-to-market capacity rather than a transparent repricing.
