    data:
      items:
        - date: '2020'
          label: 公司成立
          detail: Gerry Giacomán Colyer 和 Diego García 在 Grow Mobility / Grin 看到支出管理痛点后创立 Clara。
          tone: positive
        - date: 2021-03
          label: 墨西哥上线 + $3.5M 种子前轮
          detail: 面向墨西哥企业公开推出，组合公司卡和支出管理软件。
          tone: positive
        - date: 2021-05
          label: Series A — $30M
          detail: DST partners、monashees、Kaszek 等支持区域扩张；Clara 也披露正在推进 $50M 债务额度。
          tone: positive
        - date: 2021-12
          label: 巴西上线 + Series B 独角兽轮
          detail: Coatue 领投 $70M，估值 $1B；Mastercard principal-member 牌照支持其在巴西直接发卡。
          tone: positive
        - date: 2022-05
          label: 墨西哥推出账单支付
          detail: AP / 账单支付与卡共用同一信用额度，扩大与营运资本的关联。
          tone: neutral
        - date: 2022-08
          label: Goldman Sachs 债务额度
          detail: 最高 $150M 债务启动 Clara 大规模结构化资本阶段。
          tone: positive
        - date: 2023-04
          label: Series B-2 轮，估值未披露
          detail: GGV / Notable 领投 $60M，延长现金跑道，但没有提升估值透明度。
          tone: negative
        - date: 2025-04
          label: 披露合计 $80M 融资
          detail: 股权延展加增长资金，专门投向销售扩张和企业客户渗透。
          tone: positive
        - date: 2025-11
          label: IFC / BBVA Spark / Covalto 债务额度
          detail: $70M 结构化债务扩展墨西哥和哥伦比亚支付产品。
          tone: positive
        - date: 2026-03
          label: Goldman 续约，额度 > $250M
          detail: Foxhall 出任 CFO；Clara 强调资本市场深度和 30,000 家企业规模。
          tone: neutral
        - date: 2026-06
          label: Clara Global / AI 构建产品上线
          detail: 在大量 AI 辅助下构建的全球费用管理产品，把路线图从核心本土市场向外延伸。
          tone: positive
