        - label: 资本收紧
          values:
            - 低
            - 高
            - 高
            - 低
        - label: 执行失速
          values:
            - 中
            - 中
            - 高
            - 中
  - id: FR003
    title: 依赖关系图
    type: kpi
    summary: 依赖风险集中在少数关键类别上，这些类别支撑 Clara 的产品和融资模式。
    claimRefs:
      - CR019
      - CR020
      - CR021
      - CR022
      - CR023
      - CR024
    data:
      items:
        - label: 资本合作伙伴
          value: High
          detail: 债务融资能力对支付增长至关重要
        - label: 支付 / 卡网络
          value: High
          detail: 直接决定各国产品如何落地
        - label: 子处理方 / 集成
          value: Medium
          detail: 支撑数据和工作流编排
        - label: 监管 / 税务框架
          value: High
          detail: 本地规则必须拿准，客户才会信任
  - id: FV001
    title: 推荐逻辑
    type: bar
    summary: 市场、产品和客户证据给 Clara 加分；短板在披露，以及风险调整后的估值不够清楚。
    claimRefs:
      - CV001
      - CV003
      - CV005
      - CV006
      - CV026
      - CV032
    data:
      items:
        - label: 市场地位
          value: 8
        - label: 产品深度
          value: 8
        - label: 客户证明
          value: 7
        - label: 财务披露
          value: 4
        - label: 资本韧性
          value: 6
        - label: 价格清晰度
          value: 4
  - id: FV002
    title: 估值敏感性
    type: range
    summary: 估值能否站住脚，最看披露质量、资本灵活性和留存韧性。
    claimRefs:
      - CV010
      - CV013
      - CV018
      - CV023
      - CV034
      - CV040
    data:
      items:
        - label: 如果披露明显改善
          low: 1.1
          mid: 1.4
          high: 1.8
          unit: USD billions
        - label: 如果增长持续但仍不透明
          low: 1
          mid: 1.2
          high: 1.4
          unit: USD billions
        - label: 如果资本 / 亏损风险恶化
          low: 0.6
          mid: 0.8
          high: 1
          unit: USD billions
        - label: 如果定价跑在证据前面
          low: 0.8
          mid: 1
          high: 1.1
          unit: USD billions
  - id: FV003
    title: 估值 / 回报区间
    type: range
    summary: 只有入场价格锚定证据而非叙事时，回报才仍有吸引力。
    claimRefs:
      - CV017
      - CV019
      - CV020
      - CV024
      - CV030
      - CV031
    data:
      items:
        - label: 守纪律入场的回报前景
          low: 2
          mid: 3
          high: 5
          unit: x MOIC potential
        - label: 激进溢价入场的回报前景
          low: 1
          mid: 1.6
          high: 2.5
          unit: x MOIC potential
        - label: 悲观下行情形
          low: 0.4
          mid: 0.7
          high: 1
          unit: x MOIC outcome
  - id: FV004
    title: 投资 KPI
    type: kpi
    summary: 最重要的投后或投前 KPI 集中在收入质量和资本完整性。
    claimRefs:
      - CV027
      - CV033
      - CV035
      - CV036
      - CV037
      - CV039
    data:
      items:
        - label: 建议
          value: Conditional proceed
          detail: 如果条款反映不透明性，可以推进接触
        - label: 置信度
          value: Medium
          detail: 公开证据不错但不完整
        - label: 首要风险
          value: Capital + compliance
          detail: 融资和本地规则决定下行风险
        - label: 首要尽调缺口
          value: Revenue quality
          detail: 需要收入结构、利润率和留存数据
