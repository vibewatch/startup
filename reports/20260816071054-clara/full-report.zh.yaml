      - number: '3.2'
        title: 能力广度、打包方式与定价姿态
        blocks:
          - type: paragraph
            body: >-
              按能力广度看，Clara 已经达到规模化企业买家期待的最低集合：企业卡、账单支付、审批、ERP 集成、差旅支付、安全控制和不断增长的 AI 层。问题不是 Clara
              有没有可信产品面，而是它的打包方式是否比同业更清晰、更模块化。Ramp、Brex、Spendesk 都呈现出更明确的软件主导界面，并围绕自动化、AI 和关账效率做高可见度叙事。Spendesk 首页强调 30
              天内 100% 采用，以及端到端采购到付款工作流。Ramp 走得更远，把自己定位成一体化平台，覆盖卡、应付账款、采购、差旅、资金管理和 AI 智能体。Brex 也呈现出现代财务软件平台，公开定价语言从 0
              起步，再配付费功能层。Clara 公开定价则模糊得多；全球定价页更像线索获取，而不是列价页面。这削弱了自助透明度，但符合企业销售主导模式。


              定价姿态重要，因为它透露市场进入（GTM）走向。透明或接近透明的定价支持 SMB 自助模式；定制打包通常意味着销售主导，尤其是支付、卡和信用承销被捆在一起时。Clara
              的打包更接近第二种模式。这符合公司对中大型企业的既定聚焦，但也抬高了竞争风险：如果全球同业本地化到足够深，同时保持更干净的软件打包，Clara
              可能被迫降价或加大销售投入。相比之下，银行的竞争方式不同。它们捆绑信用、账户、外汇和资金管理，软件人体工学往往不那么显眼。这让它们对保守型企业有黏性，也创造了 Clara
              利用的空档：财务团队希望在支出发生前就有政策逻辑和可见性。
