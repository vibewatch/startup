      - 尽调问题
    rows:
      - - Mastercard / 网络基础设施
        - 支持发卡和市场扩张
        - 高
        - 哥伦比亚上线和巴西牌照报道
        - 按产品和国家绘制合作伙伴依赖
      - - 债务提供方
        - 扩大支付产品和营运资金支持
        - 高
        - Goldman、Accial、IFC、BBVA Spark、Covalto 过往记录
        - 审查契约条款、集中度上限和续约条件
      - - 技术 / 集成供应商
        - 支撑数据流和自动化质量
        - 中
        - 开发者平台、集成、子处理方门户
        - 审查宕机历史和关键第三方
      - - 子处理方 / 云工具
        - 可能形成隐私和服务依赖
        - 中
        - Trust Center 有子处理方清单
        - 审查关键供应商集中度和事件预案
    notes: 依赖风险很重要，因为多类合作伙伴可能同时影响客户。
