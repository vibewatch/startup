      - number: '8.3'
        title: 情景框架与下行触发器
        blocks:
          - type: paragraph
            body: >-
              Clara 的乐观情景需要三件事同时发生：企业客户转化延续，支付产品规模在没有隐藏信用恶化的情况下继续复合增长，产品宽度转化为耐久的多模块采用，而不是碎片化。在那个世界里，Clara
              上一次披露的独角兽估值可能低估了一个区域领先平台的战略价值，尤其是它还在增强 AI
              能力，并获得高质量贷款人支持。基准情景假设公司继续在核心市场增长，但单位经济性仍只做到部分透明；该情景仍可支持正面的投资观点，但回报预期要克制，尽调条件要强。悲观情景则相反：资本约束增强，客户或交易量集中度高于预期，而支付和合规运营持续昂贵，使利润率比投资人希望的更薄。


              因此，情景框架与其说取决于收入增长叙事，不如说取决于收入质量证明。最大的下行触发器不是表面失误，而是会改变模型本身的风险信号：融资额度余量收缩、隐藏损失率证据、留存显著弱于客户故事暗示，或产品复杂度正在跑赢运营控制的证据。Clara
              不需要完美才能成为一笔可行投资，但它需要证明自身在留存和运营杠杆上越来越像软件公司，同时没有丢掉支付业务所需的融资和合规纪律。
