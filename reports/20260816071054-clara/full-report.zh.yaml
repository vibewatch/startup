      - number: '1.4'
        title: 规模、里程碑与反向运营信号
        blocks:
          - type: paragraph
            body: >-
              公开证据里最强的规模信号是客户采用、企业客户标识质量，以及持续吸引大型债务伙伴的能力。到 2023 年初，Citi Ventures 称 Clara 客户超过 10,000；2025
              年公司和媒体来源反复称平台服务巴西、墨西哥、哥伦比亚超过 20,000 个客户或组织；Clara 2026 年 3 月 Goldman 续约稿则称采用数已远超 30,000 家企业。IFC 债务公告还点名
              Hilton、Bolsa Mexicana de Valores、Femsa、Smart Fit、Movistar 等企业客户。客户证言给出更落地的证据点：客户把 Clara
              用于发卡、供应商付款、发票匹配，并更严格控制员工支出。


              但运营规模证据并不干净，而是杂乱。员工数披露差异很大：2025 年独立报道预计员工数到年底从约 350 增至 400，而 Dealroom 2026 年公开资料映射出 742 名员工、人才分布在 20
              个国家。总部表述也不一致，Dealroom 显示 Mexico City，Tracxn 显示 São Paulo，Contxto 则报道 Clara
              在获得支付机构牌照后将总部迁至巴西。这些不一致不会否定牵引力，但很重要：它们意味着 Clara
              对外公司事实由产品营销、投资者关系和数据平台抓取拼接而成，而非来自单一经审计披露包。另一个反向信号是估值不透明。Bloomberg 2023 年报道明确把新资金形容为“有钱就是好钱”的轮次，并突出公司拒绝讨论
              2021 年后下行期估值。这不会打断增长故事，但会降低一个简单标题的可信度——不能把 Clara 2026 年状态看成已经完成干净重估的独角兽。
