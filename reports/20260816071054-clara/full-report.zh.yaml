        - 没有明确公开收缩迹象
        - 高
      - - 隐性欺诈 / 信贷损失暴露
        - 会直接改写利润率和风险假设
        - 公开信息无法确认或否认
        - 高
      - - 客户集中度或流失被证明偏高
        - 会削弱收入质量和估值支撑
        - 公开数据未知
        - 高
      - - 披露未改善而轮次定价跳升
        - 未解决风险不变时，会压缩预期回报
        - 仍有可能
        - 中高
    notes: 否决触发点绑定模型完整性，而不是表面瑕疵。
    claimRefs:
      - CV021
      - CV022
      - CV033
      - CV034
      - CV037
  - id: TV006
    title: 最终尽调要求表
    columns:
      - 要求
      - 重要性
      - 优先级
    rows:
      - - 按卡、支付、软件、融资拆分收入结构和贡献利润率
        - 区分软件式上行和重资产负债表经济性
        - 高
      - - 融资额度契约、集中度限制和续约时间表
