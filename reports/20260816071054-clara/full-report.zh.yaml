      - number: '8.5'
        title: 最终尽调要求与投资逻辑击穿条件
        blocks:
          - type: paragraph
            body: >-
              Clara 的最终尽调包应当格外具体。泛泛要求“财务数据”或“KPI”不够。投资人需要按产品组合拆分的收入、按模块看的贡献利润率、信用 /
              欺诈损失数据、融资额度契约、头部客户敞口、队列留存，以及逐国控制证据。如果 Clara
              能证明企业和多模块客户留存强、贷款人支持仍明显超额认购、软件主导的自动化正在提高运营杠杆，投资逻辑会明显改善。如果这些领域噪声很大、集中度高，或比公开材料暗示的更依赖人工干预，投资逻辑会明显削弱。


              投资逻辑击穿条件应按字面理解。核心市场发生重大合规事件、证据显示经济性依赖低估风险，或在没有更好披露的情况下估值条件明显更激进，都是暂停或放弃的正当理由。Clara
              的公开故事足够强，值得持续关注和细致尽调；但不足以取消定价纪律，也不能替代深度承做。最终建议因此是有条件的信心：这家公司值得认真研究，但不适合懒惰买入。
