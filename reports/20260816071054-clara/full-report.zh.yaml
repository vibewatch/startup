  - id: TR004
    title: 人员 / 执行风险登记表
    columns:
      - 执行风险
      - 重要性
      - 当前信号
      - 严重性
      - 问题
    rows:
      - - 产品快速扩张
        - 更多模块和地域会增加协调负荷
        - AI Global、Fleet Card、企业客户推进
        - 高
        - 团队如何按产品 / 国家组织？
      - - 披露不一致
        - 总部、员工数、估值事实在公开信息中不一致
        - 外部叙事混杂
        - 中
        - 内部唯一真实口径是什么？
      - - 上探大客户销售转型
        - 企业客户销售转型提高实施和支持要求
        - 2025 年融资指定用于企业业务增长
