      - number: '8.4'
        title: 可比公司、回报逻辑与建议
        blocks:
          - type: paragraph
            body: >-
              Clara 的公开可比公司并不完美，因为最接近的同行分布在不同类别。Ramp 和 Brex 是软件主导的支出平台，拥有更成熟、以美国为中心的自动化叙事。Spendesk
              提供以欧洲为中心的支出管理基准。Jeeves 代表更国际化的企业卡取向。Conta Simples 等本地运营商说明，聚焦单一国家可以有价值，但难以直接映射到 Clara 的跨市场野心。Clara
              自身估值背景也把股权和结构化债务混在一起，使纯 SaaS 对比容易误导。正确的可比视角应是混合的：一边看软件式留存和自动化价值，另一边看金融科技式资本强度和承销依赖。


              混合视角支持一个建议：看好公司，但对价格谨慎。Clara
              看起来是正在成形的正统区域平台赢家，不是投机概念。但证据不足以支持不看价格地追。建议立场是继续或启动严肃尽调；如果入场条款仍锚定上一轮硬独角兽估值附近，或以其他方式补偿不透明、资本强度和优先股风险，就可以建设性接触。如果新一轮在没有释放更好透明度的情况下暗示估值大幅上台阶，预期回报相对剩余未知项很可能被压得过低。
