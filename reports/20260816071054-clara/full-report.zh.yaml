      - number: '2.2'
        title: 规模测算视角、渗透率与真正可测量的内容
        blocks:
          - type: paragraph
            body: >-
              Clara 所在类别的公开市场规模测算很嘈杂，因为不同来源量的是不同东西。Straits Research、WorldMetrics、PRSync、Coherent Market Insights
              这类低置信度研究页指向一个很大的底层机会：拉美 B2B 支付流量达数万亿美元，软件或企业卡市场也有数十亿美元。这些数字只适合作为外沿上限。它们没有隔离 Clara
              真正能捕获的窄切片，还经常混合支付流量、软件收入和发卡价值池。更克制的视角来自上市公司和国家代理指标。Clara 自己发布材料引用 INEGI 数据称，仅墨西哥就有超过 400 万家 SME。Citi
              Ventures 称 2023 年初客户数超过 10,000；2025-2026 年公司和贷款方材料则把 Clara 放在 20,000 到 30,000+
              个组织。即便这些数字方向正确，相对区域企业总盘子也意味着渗透率仍低。


              正确结论不是 Clara
              拥有一个精确的万亿美元总可用市场（TAM），而是可触达市场足够大，只要公司能持续转化多实体、跨境和企业级买家，就能支撑一个规模化平台。限制因素不是原始市场大小，而是有多少区域企业支出能从银行、手工流程和本地点状方案中，被拉进一个可控的软件层。Clara
              没有披露 ACV、单客户卡交易量或客群结构，公开分析师无法把宽泛支付流估计转成 Clara 专属的清晰可服务市场（SAM）或可获取市场（SOM）。这些缺口应被保留，而不是粉饰。
