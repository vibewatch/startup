      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >-
              公开材料记录的两位联合创始人是 Gerry Giacomán Colyer 和 Diego Iván García Escobedo。TechCrunch、Clara 自己的发布材料和 Citi Ventures
              都把创立洞察追溯到两人在 Grow Mobility / Grin 的经历：快速区域扩张暴露了既有企业财务工具的局限。Gerry 在公开材料中一直以 CEO 身份出现。Diego 在 2021 年发布和
              Series A 材料中被介绍为联合创始人兼产品 / 技术负责人；后续投资人报道和新闻稿更多把他隐在产品栈背后，而不是作为公开高管呈现。


              2023 融资周期后，领导层明显扩容。Bloomberg Línea 报道，Hans Tung 随 2023 年轮次加入董事会，Raquel Hernández 从 Meta 加入担任高级工程职位，Tina
              Reich 出任风险顾问 / 董事会观察员。Clara 2025 年新闻中心公告确认 Reich 和 Hernández 加入全球领导团队。2026 年，公司宣布 Travis Foxhall 晋升
              CFO、Jorge de Lara 出任 Clara Mexico 总裁，显示企业客户和资本市场导向更强。缺口是干净、最新、完整的董事会名单。公开来源确认 Coatue 的 Michael Gilroy 是
              2021 年首位投资人董事，之后加入 Hans Tung，但没有披露当前完整董事会、委员会结构，或近期融资批次附带的正式治理权利。一家已叠加风险投资和结构化债务资本、规模达到独角兽的公司出现这种不透明，值得注意。
