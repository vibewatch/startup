      - number: '3.3'
        title: 分发能力、切换成本与多栖使用
        blocks:
          - type: paragraph
            body: >-
              分发是这个市场最重要的竞争断层之一。Clara 靠把软件同资本和本地支付轨道对齐来增长，切入那些已经被银行入驻慢、控制弱、报销或 AP 工作流碎片化折磨的财务团队。发卡、审批规则、ERP
              同步和供应商付款一旦落进平台，即便合同数据不公开，切换也会变得运营成本很高。财务团队必须重新发卡、重新培训用户、重连会计系统，并重写政策工作流。这是真实切换成本，但不是绝对锁定：多栖使用仍可能存在，尤其是一家公司用一家供应商发卡、另一家做差旅、银行负责资金管理时。


              竞争对手正是利用这个口子。Jeeves 的多国家定位吸引想在多个司法辖区用卡的公司。Ramp、Spendesk 等全球龙头依靠集成广度和软件深度。银行保留存款、核心信用和薪资的默认关系。Clara
              最好的防守，是成为最贴近拉美日常支出执行的操作系统，即便银行仍是资产负债表锚点。哥伦比亚合作证据很有启发：扩张需要 Mastercard
              基础设施和本地合作，而不是纯复制粘贴式铺开。对外部轨道的依赖是竞争脆弱点，但也是新进入者的门槛，因为它必须一个国家一个国家慢慢拼起来。
