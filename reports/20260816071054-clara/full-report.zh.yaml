companyProfile:
  summary: >
    Clara 是一家总部位于 Mexico City 的企业财务平台，由 Gerry Giacomán Colyer 和 Diego Iván García Escobedo 在扩张 Grow Mobility / Grin
    时亲历支出控制和对账痛点后，于 2020 年创立。公司先在墨西哥推出企业卡与支出管理一体化工作流，随后进入巴西、哥伦比亚和周边拉美市场。 到 2026 年，Clara
    公开产品栈覆盖企业卡、支出控制、报销、账单支付、发票管理、跨境支付、差旅、银行服务和分析。公开规模证据从 2023 年约 10,000 家客户公司，推进到 2025 年超过 20,000 个组织，并在 2026 年宣称超过
    30,000 家企业；贷款方和投资人支持也随 2025 年 $80M 股权 / 增长资金包、IFC / BBVA Spark / Covalto 的 $70M 债务融资，以及续签 Goldman 额度而扩大，宣称债务容量超过
    $250M。承销难点在于，这些运营进展之外，营收质量、毛利结构、亏损情况，以及 2021 年后最后一个清晰 $1B 独角兽估值锚点之外的任何重新定价，公开披露都异常稀薄。
