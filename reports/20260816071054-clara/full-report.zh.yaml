      - number: '7.2'
        title: 运营、安全与欺诈风险
        blocks:
          - type: paragraph
            body: >-
              运营风险很高，因为 Clara 直接卡在审批、卡授权、供应商付款、报销和财务报告路径上。公开安全页面强调细粒度治理、预防性控制、审计准备和付款执行前的欺诈阻断。Trust Center
              材料和合规门户进一步说明公司有正式安全计划，但也显示部分细节仍为私有或受 NDA
              限制。也就是说，公开尽调能验证姿态，不能验证表现。最重要的运营问题是，各模块和市场的控制质量是否一致。公司可以在一个国家拥有强卡控制，却仍在其他地方遭遇 AP、报销或发票追回问题。


              欺诈和文件质量风险尤其重要。Clara Intelligence 声称提取准确率很高，并把自动化与财税合规结果绑定；但公开来源没有披露误报率、欺诈损失、授权拒绝率或宕机历史。AI
              驱动的速度可以改善工作流质量，但如果护栏落后于产品速度，也会制造新的失效模式。2026 年由 AI 构建的 Clara Global
              发布让路线图速度显得亮眼，同时也提高了基础设施、测试和安全实践的压力。因此这不是泛泛的软件安全风险；这是产品自动化、合规正确性和资金流转都必须在企业级预期下协同运转的复合风险。
