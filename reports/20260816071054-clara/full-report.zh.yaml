      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >-
              最强的增长驱动来自数字化、分布式团队、多实体复杂度，以及财务团队想在月底前预防滥用，而不是事后对账。Clara 自己的产品面与这些驱动高度吻合：自动发票抓取、基于政策的审批、ERP
              集成、多币种逻辑、WhatsApp 提交收据，以及基于 AI 的异常检测。Citi Ventures
              还指出区域内存在结构性供给缺口：传统发卡方通常难合作、区域覆盖有限，也不能稳定批准小企业使用企业卡。这组因素支撑了软件主导替代的长跑道。


              主要约束同样重要。Clara 的本地合规优势不可少，因为每个市场的卡受理、开票、税务、欺诈和承销现实都不同。TechCrunch
              种子轮报道强调墨西哥的本地合规和收据管理适配；后来的安全和信任材料则强调审计就绪、PCI / ISO
              工作和税务发票自动化。这些需求也制造摩擦：产品必须处理本地财政文件、跨境支付和不同银行轨道；企业客户要求可靠性和安全性；银行仍掌握基础流动性关系。换句话说，Clara
              受益于碎片化，但也必须以高运营成本解决碎片化。这解释了为什么公司不只融资股权资本，还持续拿债务和结构化融资，与产品资本并行。
