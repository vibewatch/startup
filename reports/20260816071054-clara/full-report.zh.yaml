      - number: '8.2'
        title: 当前估值背景与入场纪律
        blocks:
          - type: paragraph
            body: >-
              最干净的公开估值锚点仍是 December 2021，当时 Clara 以据报道 $1 billion 估值成为独角兽。此后一切都更模糊。Bloomberg Línea 明确指出，Clara 在 2023 年
              $60 million 延伸轮中拒绝披露估值。Tracxn 仍给出 $1 billion 当前估值和约 $204 million 累计融资，同时又把 2025 年融资包拆成 $40 million Series
              B 延伸轮加 $40 million 类债务增长资金。Reuters、Mexico Business News 和 FinTech Futures 显示 Clara
              持续增加产品宽度、推进巴西监管进展并扩充债务容量，但这些都不能给出 2021 年后的确定性重估。


              上述不确定性引出一条简单纪律：除非管理层提供更好的指标披露，否则不要按公司显然已大幅超过上一轮公开独角兽估值的口径付价。凭借动能和伙伴质量，Clara
              足以支撑高于困境水平的倍数；但估值不透明应限制激进度。如果企业客户组合、盈利进展和抽佣率质量很强，公司最终可能值得更高估值；不过当前公开证据支持的是区间，不是点估计。入场纪律应绑定下一轮真正暗示的收入质量、资本需求和优先股结构，而不是只看知名投资人是否在场。
