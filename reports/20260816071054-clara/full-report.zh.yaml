      - number: '7.3'
        title: 合作伙伴、资本与依赖风险
        blocks:
          - type: paragraph
            body: >-
              Clara 的模式比纯 SaaS 更深地依赖合作伙伴。卡组织、本地支付轨道、银行或发卡伙伴、ERP 生态和债务提供方，都会影响产品可靠性和增长容量。哥伦比亚扩张报道显示，Mastercard
              合作和基础设施是上线基础。债务额度历史则显示，Goldman、Accial、IFC、BBVA Spark 和 Covalto
              对支付产品扩张具有战略重要性。关系健康时，这是优势；但它们也带来依赖风险：合作方收紧授信、额度受限或运营出问题，都能很快卡住增长。


              面向客户的产品宽度会放大这种依赖。Clara 如果要同时支持卡、AP、车队、差旅、跨境以及最终全球产品，支持、合规和流动性都必须保持同步。Trust Center
              上批准的分处理方名单也提醒我们，平台依赖的供应商生态比公开页面写出的更广。依赖风险因此要分三层监控：支撑交易的基础设施伙伴、支撑融资的资本伙伴，以及支撑数据流动和集成的技术伙伴。单个依赖都不致命，但如果多条关系同时收紧，组合在一起会抬高联动下行风险。
