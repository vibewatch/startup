      - CV001
      - CV009
      - CV026
      - CV029
      - CV032
  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 轴线
      - 乐观解读
      - 怀疑解读
      - 决策含义
    rows:
      - - 市场位置
        - LATAM 支出管理技术栈的区域领导者
        - 资本更厚或 UX 更干净的同业仍可能超过它
        - 需要证明本地护城河足够持久
      - - 产品宽度
        - 多模块带来钱包份额和留存
        - 宽度也可能掩盖碎片化和支持复杂度
        - 核验附加率和控制能力一致性
      - - 资本支持
        - 高质量伙伴验证模型
        - 依赖债务容量会放大下行敏感性
        - 审查融资额度条款和现金跑道
      - - 客户验证
        - 具名 logo 强、现有客户证言充足
        - 没有公开队列指标或集中度披露
        - 优先尽调留存和敞口
      - - 估值背景
        - 上一轮 $1B 标记可能低估进展
        - 2021 年后没有清晰公开重估
        - 坚持价格纪律
    notes: 即便反向逻辑没有完全拆解，只要入场价格给出足够补偿，公司仍可能值得投。
