  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代品
        blocks:
          - type: paragraph
            body: >-
              Clara 并不在狭窄的“只有企业卡”细分里竞争。根据产品页、投资人材料和 2025 增长披露，公司把这条工作流定义为端到端企业支出管理：发卡、账单支付、发票管理、报销、审批、审计轨迹、ERP
              对账，以及越来越多的跨境支付。因此，真实替代集合不只是另一张金融科技卡，而是拉美财务团队今天仍在使用的一组拼接方案：既有商业银行产品、手工表格流程、报销流程，以及 ERP 主导的后台控制。Citi
              Ventures 明确点出，区域内许多企业仍手工管理费用，并难以拿到可用企业卡，墨西哥和巴西以外尤其如此。


              最有用的市场边界因此有三层。第一层是广义 B2B 支付轨道，供应商、员工和差旅付款都在其中。第二层是更窄的支出管理软件层，承载审批逻辑、对账、发票追回和分析。第三层是 Clara
              的实际楔子：需要拉美本地合规企业支出基础设施，并且更重视“卡 + 软件”一体化而非通用资金管理产品的公司。BBVA Mexico 和 Santander Brasil
              清楚展示了现状。它们的企业门户强调流动性、资金管理、薪资、收款、外汇和通用支付，而不是专为现代支出控制打造的财务运营界面。这个缺口解释了 Clara 为什么能与银行共存，而不只是替代银行。
