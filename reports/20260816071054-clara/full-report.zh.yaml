        title: 牵引力代理指标、单位经济信号与成本结构线索
        blocks:
          - type: paragraph
            body: >-
              Clara 公开了足够多运营数据来证明牵引力，但不足以干净承销单位经济。TechCrunch 2023 年 4 月报道，Clara 服务 10,000 家公司，年信用卡交易约 5 million
              笔，年化卡交易量约 $1 billion。到 2025 年，多家公司和媒体来源把客户基数推到巴西、墨西哥、哥伦比亚超过 20,000 个组织；2026 年 Goldman 续约公告则称超过 30,000
              家企业。Mexico Business News 补充了一个有用运营细节：Clara 2025 年大约每秒处理一笔交易。这些数字支持增长和产品使用，但仍不暴露抽佣率、单客户收入、信贷损失、服务成本或实施成本。


              最清晰的成本结构线索来自管理层关于员工数、盈利和产品投入的表述。FinTech Futures 称 Clara 计划到 2025 年底把员工从约 350 人增至 400 人，同时继续投入
              AI、企业销售和工程。Mexico Business News
              报道，巴西已实现月度盈亏平衡，墨西哥也接近同一里程碑。这些说法指向核心市场贡献利润率改善，但也意味着商业和产品投入仍在继续。产品组合本身指向混合成本底座：一边是软件开发和客户支持，另一边是承销、欺诈、支付运营和资金成本。换句话说，Clara
              可能比重资产贷款机构更容易规模化，但仍比纯工作流 SaaS 更吃资本和运营。
