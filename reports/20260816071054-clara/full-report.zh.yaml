      - number: '6.3'
        title: 客户留存韧性、扩张与集中度风险
        blocks:
          - type: paragraph
            body: >-
              公开证据无法完全回答的最大客户质量问题，是留存韧性。Clara
              案例研究强烈暗示复用和工作流扩张：客户使用卡、实体及虚拟发卡、报销、差旅流程或供应商付款控制，而不是孤立使用一个功能。产品路线图本身也鼓励从一个场景扩到其他场景；只要执行保持强劲，这应能改善留存。不过，Clara
              并未公开披露 GRR、NRR、流失率、合同期限、续约率或队列表现。缺少这些指标，正向客户证言只能算方向性证据，不能作定论。


              相比留存，扩张更容易看清。平台已覆盖卡、应付账款（AP）、Travel Pay、车队产品、银行服务和 AI 分析；财务团队一旦信任控制层，每个模块都能打开先落地再扩张的路径。集中度风险更难判断。Clara
              展示了可识别的企业客户，但没有披露少数超大客户是否贡献了不成比例的支付量或信用敞口。融资伙伴和具名客户 logo
              能证明平台适配企业客户，却不能排除不同客群经济性不均衡的可能。尽调最需要问两个客户问题：按队列看的留存，以及按支付量 / 敞口看的集中度；这决定了 Clara 亮眼的客户数量故事能否变成持久且分散的收入质量。
