      - number: '6.2'
        title: 采用轨迹与真实部署证据
        blocks:
          - type: paragraph
            body: >-
              公开可见的采用证据并不完美，但方向很强。TechCrunch 2023 年报道 Clara 有 10,000 家客户公司；2025 年融资消息源又多次称，Clara 在巴西、墨西哥和哥伦比亚覆盖超过 20,000
              家组织。Clara 2026 年 Goldman 续约把公开口径推到超过 30,000 家企业。这些数字本身不足以证明使用深度，但能说明 Clara
              几年来持续扩张。更强的证据来自生产环境式客户案例：用企业信用卡替代预付卡、取消报销、加快发票处理、支持差旅支付，或简化实体卡和虚拟卡发行。这些是运营工作流层面的证言，不是抽象背书。


              多方资料也指向地域深度。2023 年 Accial 公告称 Clara 在哥伦比亚拥有超过 1,300 家客户，并在 27 个州交付解决方案；作为私营金融科技公司，这样的表述少见地具体。2025 年 IFC 和
              Mexico Business News 的债务融资稿把平台与具名区域企业、超过 20,000
              家活跃客户组织绑定在一起。不过，部署证据仍偏向公司掌控的故事。公开资料没有披露活跃卡率、按队列划分的支付量，也没有披露模块渗透细节。合理解读是：Clara
              已远远越过试点采用阶段，但公开数据仍不足以说明不同客户规模、市场或工作流中的使用差异。
