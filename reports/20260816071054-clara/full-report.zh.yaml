            body: >-
              Clara 的公开客户故事，在客户 logo 广度和工作流具体性上强于合同质量披露；这仍有价值。许多私营金融科技公司都能宣称客户数量，但 Clara
              的公开材料展示了跨多个行业和国家的具体运营结果，例如发卡更快、报销痛点降低、差旅控制改善，或带来营运资本收益。IFC 和 Mexico Business News 引用的区域企业名称也重要，因为这说明 Clara
              并不只服务初创客户。


              与此同时，本章最主要的警示很直接：仅靠客户证言无法证明客户留存韧性。庞大的存量客户群、可识别客户 logo
              和扩大的产品宽度都指向正面方向，但公开证据仍缺少队列和集中度数据，无法把客户热情转成投资承做级确定性。当前最佳结论是，Clara 具备真实的生产级客户采用和可信的扩张引擎；留存质量和集中度风险仍是重要尽调缺口。
            claimRefs:
              - CU028
