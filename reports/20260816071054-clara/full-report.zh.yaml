  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律敞口
        blocks:
          - type: paragraph
            body: >-
              Clara 的监管风险是根本性的，因为产品会自动化资金流转、发卡、税务文件处理，有些情况下还触及类信贷活动。公开材料反复强调本地合规、SAT
              授权、税务发票追回和按国家推进发布。这说明公司理解风险面，是正面信号；同时也凸显产品质量多大程度取决于各国法律和运营执行。巴西的支付和开放金融基础设施、墨西哥 CFDI / SAT
              要求、哥伦比亚本地运营规则，都构成持续移动的合规靶。Clara 帮助中心的可用性页面也强化了一点：公司仍集中在墨西哥、巴西和哥伦比亚；突破这些市场既是机会，也是监管台阶跃迁。


              法律风险在公开层面不如运营风险可见。留存来源中没有出现重大诉讼或执法行动，这是好事；但没有披露纠纷并不等于低风险。更重要的是结构性问题：税务文件、资金流转或卡控制任何一环失效，都可能同时造成客户损害和监管审查。Fleet
              Card 发布就是例子。它把 SAT 授权自动化嵌入一个痛点工作流，战略上有吸引力，但也把合规门槛抬高。Clara 的监管姿态因此显得主动；产品越多，它也越依赖国家层面的精确执行。
