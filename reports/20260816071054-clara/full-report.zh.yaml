    title: 公司里程碑时间线
    type: timeline
    summary: 创立至 2026 年的关键融资、产品和区域扩张里程碑。
    approximationNotes: 日期依据保留下来的新闻稿和贷款方公告；部分事项在精确上线时间未独立披露时使用公告月份。
