      - number: '4.3'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              资本结构是 Clara 财务故事的核心。自 2022 年以来，公司反复把股权融资和债务或结构化融资配对，用来扩张支付产品容量。这个模式贯穿 Goldman 额度、面向哥伦比亚的 Accial 额度、2023
              股权延展、此前未披露的 2025 年 $80 million 资金包、2025 年 IFC / BBVA Spark / Covalto 结构化债务，以及 2026 年把总债务容量推高到 $250 million
              以上的 Goldman 续约。这不是围绕软件业务的附带融资，而是运营模式的一部分。支付和信用产品需要资产负债表支持、集中度限制和风险控制。因此，Clara
              既需要投资人胃口，也需要贷款方信心，才能继续扩张交易密集型产品。


              正面解读是，即便 2021
              融资热降温，多家高质量资本伙伴仍持续加码。负面解读是，增长依赖连续外部融资能力，而不只是软件销售效率。公开材料还显示，部分融资安排有地理用途，例如面向哥伦比亚的债务支持，或墨西哥和哥伦比亚扩张融资。这有助于本地扩张，也可能拆碎流动性并增加运营复杂度。尽调应把资本充足性、融资契约、集中度规则和承销纪律列为一阶财务问题，因为这些变量直接决定
              Clara 能在不挤压利润率或资产负债表风险的情况下，把支付产品做大多少。
