  - id: TR005
    title: 缓释措施与否决标准表
    columns:
      - 风险领域
      - 可见缓释因素
      - 监测指标
      - 否决触发点
      - 投资影响
    rows:
      - - 监管 / 合规
        - 按国家配置的控制措施和明确合规表述
        - 审计例外或客户投诉上升
        - 核心市场出现重大税务 / 支付合规违规
        - 会实质削弱投资逻辑
      - - 资本依赖
        - 多家机构贷款方及持续支持
        - 融资额度余量、续约、定价、契约条款
        - 债务容量大幅收缩，或契约条款开始约束
        - 可能封住增长、压缩经济性
      - - 运营质量
        - 预防性控制、信任中心、客户证明
        - 交易拒绝率、故障事件、欺诈损失
        - 多个模块反复出现工作流事故
        - 会冲击产品信任
      - - 客户留存韧性
        - 多模块产品覆盖面和具名客户 logo
        - 留存、集中度、净留存率（NRR）、支付敞口
        - 隐性流失或交易量集中暴露
        - 会降低对收入质量的信心
    notes: 最优先的否决触发点，是那些把合规、资本和客户信任连在一起的风险。
