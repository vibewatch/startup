      - number: '1.3'
        title: 融资历史、估值与资本结构
        blocks:
          - type: paragraph
            body: >-
              Clara 的资本史把传统风险融资和越来越大的债务额度混在一起。公司 2021 年 3 月以 $3.5 million 种子前轮起步，2021 年 5 月宣布 $30 million Series A
              轮，2021 年 12 月完成 Coatue 领投的 $70 million Series B 轮，并以据报道 $1 billion 估值跻身独角兽。之后，资本结构更混合。官方和数据库来源都指向 2022
              年开始的 Goldman Sachs 债务额度，以及 GGV / Notable 领投的 2023 年 $60 million 融资轮，但 2025 年融资叙事才是尽调关键皱褶。Clara 自己的 2025
              公告称，此前未披露的 $80 million 资金由股权和增长资金混合构成，但没有明确 40/40 分拆。FinTech Futures、LatAm List 和 Tracxn 的 2025
              独立报道则把同一资金包拆成 Citi Ventures 和 Kaszek 领投的 $40 million 股权延展，加上一笔独立的 $40 million General Catalyst Customer
              Value Fund 融资安排。


              到 2025 年底，公司新增一笔来自 IFC、BBVA Spark 和 Covalto 的 $70 million 结构化债务融资；2026 年初又称续签 Goldman 额度后总债务容量超过 $250
              million。Tracxn 等公开数据提供商仍显示累计股权融资约 $204 million、估值停留在 $1 billion；而 Bloomberg 2023 年报道明确写到 Clara
              拒绝披露更新估值。正确的尽调结论不是 Clara 在 2026 年肯定超过 $1 billion，而是独角兽身份仍是最后一个被清晰交叉验证的投后估值锚点；较新的轮次更多强调战略流动性和
              市场进入（GTM）能力，而不是透明重新定价。
