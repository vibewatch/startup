chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、业务版图与商业模式
        blocks:
          - type: paragraph
            body: >-
              Clara 成立于 2020 年，瞄准其创始人亲历的区域性企业财务问题：拉美公司在发卡、费用控制和账单支付等环节仍大量靠手工处理，常用银行产品又存在授信慢、控制有限、软件集成弱等问题。公司于 2021 年 3 月
              10 日在墨西哥公开推出企业卡与支出管理一体化平台。早期材料强调远程即时入驻、实体卡和虚拟卡、可配置控制，以及财务团队实时可见性。TechCrunch 和 Citi Ventures
              都把最初变现模式描述为以交换费为主；随着使用场景加深，公司再叠加软件和工作流自动化。


              到 2026 年，Clara 公开产品边界已经大幅拓宽。公司、投资人和贷款方官方材料描述的是一个平台，覆盖企业信用卡、发票追回、账单支付、跨境支付、面向差旅的虚拟卡、报销工作流、AI 驱动的支出控制和 ERP
              集成。公司叙事也从赋能创业公司转向提升中端市场和企业级运营效率，并反复强调墨西哥、巴西、哥伦比亚是三大核心运营市场。Clara 自己在 2026 年 Goldman
              续约稿中仍称公司是拉美领先的企业支出管理解决方案，但公开来源对实际运营中心仍在 Mexico City 还是已经转到 São Paulo 存在分歧。最稳妥的读法是：Clara
              仍是墨西哥创立、墨西哥业务占比很重的公司，同时越来越把巴西包装成区域规模中心。
