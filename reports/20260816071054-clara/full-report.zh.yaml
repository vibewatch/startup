  - id: TV001
    title: 建议摘要表
    columns:
      - 维度
      - 评估
      - 原因
      - 置信度
    rows:
      - - 公司质量
        - 正面
        - 产品宽度、客户和贷款方支持都真实存在
        - 中高
      - - 建议
        - 在纪律约束下继续尽调 / 选择性接触
        - 公司有吸引力，但估值和指标不透明不能忽视
        - 中
      - - 风险评级
        - 高但可管理
        - 合规、资本和执行风险都是真问题
        - 中
      - - 估值立场
        - 披露改善前，不应为较上一轮明确 $1B 估值的大幅溢价买单
        - 最好的公开锚点仍是 2021 年独角兽估值
        - 中
      - - 回报设定
        - 若入场价格守住纪律且透明度提高，回报可能很强
        - 上行空间存在，但未知数仍然重要
        - 中
    notes: 建议质量更多受披露和资本模型不确定性约束，而不是公司缺少势头。
