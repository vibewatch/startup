      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              最清晰的买方是财务职能：CFO、财务控制负责人、财务总监、会计、AP 经理、资金负责人和办公室经理，他们需要看见分散支出并执行政策。Clara 2021
              年发布、企业页和客户故事反复把问题放在财务团队身上：看不到钱流向哪里、无法快速核对发票，或者要等银行发卡而浪费时间。用户比买方更宽。员工、差旅协调员、采购或运营团队、本地办公室经理会接触卡、报销或发票流；付款方则是公司资金账户或授信额度。实际采用通常从一个痛点开始——发卡、加快报销或集中供应商付款——再扩展到审批、对账、ERP
              同步和支出分析。


              按客群看，Clara 似乎随时间上移。早期定位面向快速增长的墨西哥和拉美企业，尤其是创业公司。到 2025 年，公司明确把销售投入指向巴西、墨西哥和哥伦比亚的中端市场和企业客户。独立和官方来源都突出更大
              客户标识，客户证据横跨健身房、软件、房地产、电商和重差旅团队。这很重要，因为账户规模上升后，采用动作就没那么自助。企业级买家需要跨实体审批、本地税务合规、外汇管理、角色权限和可审计性；小公司主要需要简单控制和拿到卡。Clara
              的市场机会最强之处，是这些需求重叠且既有银行工作流仍笨重的地方。
