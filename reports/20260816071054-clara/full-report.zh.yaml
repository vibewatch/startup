      - CV002
      - CV003
      - CV004
      - CV005
      - CV006
      - CV007
      - CV008
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 核心假设
      - 估值区间
      - 概率信号
      - 下行 / 上行触发点
    rows:
      - - 乐观
        - 企业客户转化强，多模块留存真实，债务支持仍充足，盈利能力改善
        - US$1.5B-2.0B
        - 需要更好披露，并持续执行到位
        - 若收入质量强于担忧，上行空间打开
      - - 基准
        - 核心市场增长、产品扩展、贷款方支持稳住，但单位经济性仍只部分透明
        - US$1.0B-1.4B
        - 与当前公开证据最一致
        - 条款守住纪律时，可合理接触
      - - 悲观
        - 资本收紧、利润率不及预期，或客户 / 敞口集中度比预期更差
        - US$0.6B-0.9B
        - 一旦重大风险暴露，或激进重估落空，就会进入该情景
        - 若不透明掩盖更弱经济性，下行风险打开
    notes: 区间是启发式估计，不应替代管理层提供的财务披露。
    claimRefs:
      - CV017
      - CV018
      - CV019
      - CV020
      - CV021
      - CV022
      - CV023
      - CV024
  - id: TV004
    title: 可比估值表
    columns:
      - 可比视角
      - 公开证据
      - 相关性
      - 局限
    rows:
      - - Ramp / Brex
        - 全球软件驱动的支出平台
        - 设定产品和自动化基准
        - 以美国为中心，并非围绕 LATAM 本地合规搭建
      - - Spendesk
        - 欧洲支出管理平台
        - 可作为支出工作流可比对象
        - 地理市场和资本模型不同
      - - Jeeves
        - 国际公司卡和多国运营视角
        - 与跨境用卡场景相关
        - 不如 Clara 明确以本地支付优先
      - - LATAM 本地同业 / 银行
        - Conta Simples 和传统银行
        - 有助于理解本地替代和市场现实
        - 无法干净映射到 Clara 的混合业务范围
      - - Clara 上一轮明确估值
        - 2021 年 12 月 US$1B
        - 唯一清晰的公开投后估值锚点
        - 已过时，未必代表 2026 年公司质量
    notes: 可比分析应混合软件、金融科技和区域运营视角，而不是硬把 Clara 塞进单一类别。
    enumerationScope:
      coverage: sample
      basis: >-
        Representative comparable lenses chosen to bound Clara’s hybrid profile; not a complete universe of every
        relevant comp.
    claimRefs:
      - CV010
      - CV025
      - CV027
      - CV028
      - CV029
  - id: TV005
    title: 投资逻辑破裂与否决触发点表
    columns:
      - 触发点
      - 为什么会击穿投资逻辑
      - 当前公开状态
      - 严重性
    rows:
      - - 核心市场出现重大合规失败
        - 会同时削弱信任和本地护城河
        - 未发现公开事件
        - 高
      - - 债务容量或融资额度灵活性大幅收缩
