  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 从工作流看 Clara 交付什么
        blocks:
          - type: paragraph
            body: >-
              Clara 产品最好被理解为财务运营控制平面，而不是单一卡产品。当前公开产品面覆盖企业卡、支出管理、应付账款、差旅支付、银行服务、报销、发票追回、政策审批和 AI
              驱动的财务分析。这个广度重要，因为用户问题不只是“发一张卡”，而是“在月底前控制并核对公司支出”。虚拟卡和移动应用页面展示了 Clara
              如何试图进入员工和财务团队的真实工作流：创建为特定用途定制的卡、即时采集收据、申请报销，并在不用等待后台人工审核的情况下执行政策。AI 驱动的 Clara Intelligence
              页面把同一思路推进一步，把原始交易和收据转成实时财务语境。


              这种工作流优先的框架也解释了 Clara 为什么持续扩张产品线。Travel Pay 瞄准高漏损品类，虚拟卡和追踪能减少意外费用。Fleet Card 把 Clara
              延伸到墨西哥另一个支付密集、税务敏感的工作流。应付账款和发票追回让 Clara
              从员工支出上游进入供应商支出。如果这些产品面协同运行，产品会更难替换，因为它同时嵌入审批、对账、付款执行和报表。真正的产品问题因此不是 Clara
              是否有足够模块参与竞争，而是这些模块在多个国家之间共享控制、数据和本地合规逻辑的能力有多强。
