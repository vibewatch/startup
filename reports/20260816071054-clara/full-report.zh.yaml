  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 谁付款、谁使用、谁批准 Clara
        blocks:
          - type: paragraph
            body: >-
              Clara
              客户群不是由单一行业定义，而是由共同的财务运营问题定义：公司存在分散支出、多供应商或跨实体工作流，希望在会计关账前就把控制收紧。最清晰的经济买方仍是财务职能——CFO、财务控制负责人、财务总监、资金负责人和 AP
              负责人；日常用户包括员工、差旅人员、运营经理和会计。官方客户故事反复显示，财务负责人或运营负责人是内部推动者；在过去银行卡、报销和供应商付款碎片化或手工化的地方，Clara 介入解决。


              客户集合也比经典的只切创业公司的楔子更宽。公开证言横跨健身、物流、HR / 薪资、房地产、电商、体育、网络安全和消费互联网公司。2025 年债务和融资公告点名 Hilton、Bolsa Mexicana de
              Valores、Femsa、Smart Fit、Movistar 等企业；更早客户案例则显示 Clara
              为成长型公司解决日常费用问题。因此，最稳妥的细分方式是按工作流强度和地理位置，而不是按狭窄垂直行业：墨西哥、巴西和哥伦比亚那些运营复杂、需要卡、审批、发票处理和报表一起运转的公司。这样一来，Clara
              在高增长数字公司和更传统区域运营商中都有扩张空间。
