- id: SV002
  title: Current valuation context and entry discipline
  body: |-
    The cleanest public valuation anchor remains December 2021, when Clara reached unicorn status at a reported $1 billion valuation. Everything after that is murkier. Bloomberg Línea explicitly noted that Clara declined to disclose valuation in the 2023 $60 million extension round. Tracxn still presents a current valuation of $1 billion and total funding of roughly $204 million, while also breaking the 2025 package into a $40 million Series B extension plus $40 million debt-like growth funding. Reuters, Mexico Business News, and FinTech Futures show that Clara kept adding product breadth, Brazilian regulatory progress, and debt capacity, but none of that provides a definitive post-2021 repricing.

    That uncertainty leads to a simple discipline rule: do not pay as though the company has obviously re-cleared a large premium above its last disclosed unicorn mark unless management provides better metric disclosure. A business with Clara’s momentum and partner quality can justify more than a distressed multiple, but valuation opacity should cap aggression. The company may deserve a higher eventual mark if the enterprise mix, profitability progression, and take-rate quality are strong; however, public evidence today supports a range, not a point estimate. Entry discipline should therefore be tied to what the next round actually implies about revenue quality, capital needs, and preference structure, not to the existence of famous investors alone.
  claimRefs:
