- id: SV005
  title: Final diligence asks and thesis-break conditions
  body: |-
    The final diligence package for Clara should be unusually specific. Generic requests for “financials” or “KPIs” are not enough. Investors need product-mix revenue, contribution margins by module, credit/fraud loss data, facility covenants, top-customer exposure, cohort retention, and country-by-country control evidence. The thesis improves sharply if Clara can show that enterprise and multi-module customers have strong retention, that lender support remains comfortably over-subscribed, and that software-led automation is increasing operating leverage. It weakens sharply if those same areas prove noisy, concentrated, or more dependent on manual intervention than public materials imply.

    The thesis-break conditions should be taken literally. A major compliance incident in a core market, evidence that economics rely on underpriced risk, or a sharply more aggressive valuation without better disclosure would each be legitimate reasons to pause or pass. Clara’s public story is strong enough to earn continued attention and detailed diligence. It is not strong enough to eliminate pricing discipline or to substitute for deep underwriting. The final recommendation is therefore conditional conviction: this is a company to work hard on, but not a company to buy lazily.
