      - CV006
      - CV007
      - CV009
      - CV010
      - CV015
      - CV016
  - id: TV003
    title: 牛市、基准与熊市情景边界
    columns:
      - 情景
      - 明确假设
      - 估值 / 回报逻辑
      - 概率信号与下行触发因素
    rows:
      - - 牛市
        - 经审计的收入和盈利能力验证披露的轨迹；企业业务持续增长；融资条款简单标准。
        - $3.3B-$5.0B 是第三方基于 4x-6x 收入倍数给出的示例区间，不是经独立核验的交易区间。
        - 信号：经审计的利润率持续性，加上当前公平交易价格；触发因素：增长或现金转化未达预期。
      - - 基准
        - 规模保持不变，但当前财务状况、流动性和优先权条款仍不可得。
        - $3.1B 仅作为 2024 年 10 月融资参考值保留；不将任何目标回报计入投资判断。
        - 信号：完成财务和法律尽调；触发因素：结构化条款压低次级股权收益。
      - - 熊市
        - 倍数继续压缩、流动性仍有限，或优先权与债务层级吞噬退出价值。
        - 低于 $3.1B；由于没有保留当前 Forge Price 或可观察交易，公开数据无法提供有依据的底价。
        - 信号：二级市场需求疲弱；触发因素：下行融资轮、契约压力或无法证实盈利能力。
    notes: 情景区间有意限定在保留证据之内；不使用臆造的概率、当前可比倍数或未披露的证券条款。
    claimRefs:
      - CV002
      - CV003
      - CV005
      - CV011
      - CV014
      - CV015
      - CV016
figures:
  - id: FO001
    title: Eruditus 公司与资本化里程碑时间线
    type: timeline
    summary: 覆盖 Eruditus 2010 年成立至 2024 年近期融资的公司、融资、运营和治理关键里程碑。
    data:
      items:
        - label: '2010'
          date: '2010-01-01'
          title: Corporate Inception
          detail: Eruditus 由 Ashwin Damera 和 Chaitanya Kalipatnapu 创立，旨在提供普及型高管项目。
          tone: positive
        - label: '2016'
          date: '2016-01-15'
          title: Series A Financing & Emeritus Brand Launch
          detail: 完成由 Ved Capital 领投的 $1.1M A 轮融资；在 Emeritus 品牌下加速数字化交付。
          tone: positive
        - label: '2017'
          date: '2017-04-03'
          title: Series B Expansion
          detail: 获得由 Bertelsmann India Investments 领投的 $8.07M B 轮融资，以拓展大学伙伴关系。
          tone: positive
        - label: '2018'
          date: '2018-07-05'
          title: Venture Debt Partnership
          detail: 从 Innoven Capital 筹得 $2.33M 风险债务，为运营周转资金提供支持。
          tone: neutral
        - label: '2019'
          date: '2019-01-10'
          title: Series C Round
          detail: 获得 Peak XV Partners（前身为 Sequoia India）领投的 $40M C 轮融资，估值 $410M。
          tone: positive
        - label: '2020'
          date: '2020-08-31'
          title: Series D Acceleration
          detail: 完成由 Leeds Illuminate 和 Prosus Ventures 共同领投的 $113M D 轮融资，估值 $700M。
          tone: positive
        - label: '2021'
          date: '2021-08-11'
          title: Unicorn Status & Series E
          detail: 完成由 Accel 和 SoftBank Vision Fund 2 共同领投的 $430M E 轮融资，投后估值 $3.2B。
          tone: positive
        - label: '2022'
