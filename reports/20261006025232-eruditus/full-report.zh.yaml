  - id: FV001
    title: 建议逻辑：从证据到决策
    type: flow
    summary: 六项投资判断检查点将已披露的运营证据和融资历史连接到“继续研究”的建议。
    data:
      nodes:
        - id: operating-scale
          label: 运营规模
          detail: 公司发布的证据称拥有 80 多个伙伴、700 多个项目和 1m+ 学习者。
        - id: profitability-claim
          label: 盈利信号
          detail: 2024 年发布的信息称全年实现盈利；分析师页面报告 FY24 EBITDA 为 ₹80 crore。
        - id: series-f-anchor
          label: Series F 锚点
          detail: 一轮 $150M 融资据报道对应 $3.1B 投后估值，收入倍数为 6.5x。
        - id: multiple-reset
          label: 倍数重置
          detail: 据报道，收入倍数从 2021 年的 18.4x 降至 2024 年的 6.5x。
        - id: missing-underwriting-inputs
          label: 投资评估所需输入缺失
          detail: 未见公开的优先权分配瀑布、经核对的融资总额或当前二级市场价格。
        - id: decision
          label: 继续研究
          detail: 在审计和法律证据补齐缺口前，暂缓评估价格和回报。
      edges:
        - from: operating-scale
          to: profitability-claim
        - from: profitability-claim
          to: series-f-anchor
        - from: series-f-anchor
          to: multiple-reset
        - from: multiple-reset
          to: missing-underwriting-inputs
        - from: missing-underwriting-inputs
          to: decision
    approximationNotes: 该序列是分析决策路径，不是概率模型，也不代表合同上的优先级。
    claimRefs:
      - CV001
      - CV005
      - CV006
      - CV009
      - CV016
