  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与跨境合规状况
        blocks:
          - type: paragraph
            body: >-
              Eruditus 在 80 多个国家运营，交付与美国、欧洲和亚洲精英大学联合品牌的高等教育证书和高管证书。这一全球运营足迹使公司暴露于管理跨国高等教育、跨境数字数据传输和机构认证的复杂且不断变化的监管环境。在
              Eruditus
              正扩建实体校园基础设施并交付联合学位的印度，高等教育政策、大学拨款委员会（UGC）对外国大学的监管以及在线教育指导方针，都要求严格遵守学术治理、课程交付和费用透明度规定。在美国和欧盟，高等教育法规、知识产权许可框架、消费者保护规则以及
              GDPR 等数据隐私要求带来持续合规义务。由于 Eruditus
              提供技术交付和学生获客层，而大学授予正式证书或学位，任何影响大学合作伙伴的负面监管认定或认证丧失都会直接威胁项目可行性。此外，缺少公开诉讼披露或集团重组正式监管批准记录，因此在任何计划中的流动性事件之前都需要进行针对性法律尽调。
