      - number: '2.3'
        title: 买方细分、学习流程与预算归属
        blocks:
          - type: paragraph
            body: >-
              Eruditus 的商业引擎依赖两个在采购流程、价格敏感度和预算归属上存在差异的买方群体。消费端 B2C 目前约产生总收入的三分之二，服务于寻求晋升、加薪或技能转型的自驱型职业中期专业人士和董事。B2C
              购买通常由个人可支配储蓄或个人企业学费报销额度支付，并通过自助数字结账完成。相比之下，企业对企业（B2B）企业业务约占集团收入的三分之一，由直接企业销售团队负责，对接首席人力资源官、首席学习官和企业业务部门负责人。企业采购采用多年合同周期，配套定制课程设计、专用企业门户和汇总员工进度报告。管理层预计，尽管
              B2B 企业收入以每年 35% 增长，B2C 动能将在未来三至四年保持至少 60-40 的消费端主导收入结构，并由新兴国内市场的监管型校园合作加强。
            claimRefs:
              - CM005
              - CM006
              - CM009
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM004
              - CM005
              - CM006
              - CM010
              - CM011
      - number: '2.4'
        title: 增长驱动、采纳约束与监管现实
        blocks:
          - type: paragraph
            body: >-
              加速 Eruditus 商业采纳的主要催化剂是劳动力对人工智能素养的结构性需求，该需求推动公司 AI 课程数量增加五倍，并使企业 AI 领导力报名量年增
              40%。此外，国家监管发展，尤其是印度大学拨款委员会（UGC）2022 年关于便利外国大学设立分校的指导方针，使 Eruditus
              能够与利物浦大学和布里斯托大学等机构合作，建立本地化运营据点。尽管存在这些强劲顺风，重大采纳约束仍决定着 Eruditus
              的扩张形态。高端项目定价和数千美元不等的学费，在宏观经济低迷期间会给价格敏感的企业买方和零售学习者造成阻力。此外，历史客户获客成本较高，营销支出约占收入的 40%，使公司在此前扩张周期中持续经营亏损和
              EBITDA 负利润率。长期利润率稳定性取决于扩大企业合同续签、降低对付费数字获客渠道的依赖，并从核心高管 cohort 多元化至混合校园管理。
            claimRefs:
              - CM006
              - CM008
              - CM009
              - CM010
              - CM013
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: B2B 企业扩张是主要增长引擎
            body: 尽管 B2C 个人报名约产生 Eruditus 当前收入的三分之二，但高管管理层和战略分析将 B2B 企业业务定位为长期利润率扩张、较低客户获客成本以及成熟西方市场和新兴市场收入多元化的关键驱动因素。
            calloutType: insight
            claimRefs:
              - CM005
              - CM009
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与结构性替代方案
        blocks:
          - type: paragraph
            body: >-
              Eruditus 的竞争格局横跨多种交付模式、定价架构和证书层级。在直接竞争者中，Eruditus（主要通过面向消费者的 Emeritus 品牌运营）与 Coursera、Udemy 和 Udacity
              等规模化数字平台争夺职业中期及高级管理人员学习者。Coursera 和 Udemy 等大众市场大规模开放在线课程（MOOC）高度侧重低价异步学习或订阅目录，而 Eruditus
              则瞄准与精英大学师资直接共同开发的高端 cohort 高管项目。除直接数字同业外，Eruditus
              还面临传统大学内部高管教育部门、企业咨询学院、企业内部培训项目以及英国计算机学会等替代职业机构的竞争。这些替代渠道在证书认可度、价格可及性和运营定制化之间提供不同组合。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
