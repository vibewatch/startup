  summary: >-
    Eruditus 是一家总部位于新加坡的在线高管教育与职业技能提升公司，主要以 Emeritus 品牌运营。公司与 80 多所大学合作，向 80 多个国家的专业人士和雇主销售证书、学位项目及企业学习解决方案；在营收约达到 3,800
    crore 卢比、EBITDA 达到 80 crore 卢比后，公司报告 FY24 实现全年经营盈利。公司已具备显著规模和品牌覆盖，但其合并法定账目、债务契约及 Series F 证券条款仍属私人信息。
