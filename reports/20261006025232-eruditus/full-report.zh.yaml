  - id: FU001
    title: Eruditus 学习者与企业采用生命周期
    type: journey-map
    summary: 概述个人和企业渠道中的客户发现、注册、群组参与、完成和企业扩张。
    data:
      items:
        - label: 发现与评估
          stage: 发现与评估
          persona: Working professional or Enterprise L&D leader
          touchpoints:
            - 高管网络研讨会
            - 大学联合品牌落地页
            - 企业员工技能审计
          painPoints: High tuition costs, fear of program abandonment, unclear career payoff
        - label: 注册与融资
          stage: 注册与融资
          persona: Self-paying professional or Sponsored employee
          touchpoints:
            - 本地化学费计划
            - 零成本 EMI 融资方案
            - 企业采购订单
          painPoints: Credit approval friction, foreign exchange variability, corporate budget signoff
        - label: 群组学习体验
          stage: 群组学习体验
          persona: Enrolled participant
          touchpoints:
            - Emeritus 数字平台
            - 大学教师直播讲座
            - AI 辅导助手
            - 同伴学习小组
          painPoints: Time management alongside full-time work, academic rigour expectations
        - label: 认证与证书授予
          stage: 认证与证书授予
          persona: Course completer (85% cohort benchmark)
          touchpoints:
            - 认证大学颁发证书
            - 注册校友目录
            - 数字徽章核验
          painPoints: Employer recognition variance, credential vs degree prestige gap
        - label: 校友忠诚与企业扩张
          stage: 校友忠诚与企业扩张
          persona: Alumni ambassador or Corporate client
          touchpoints:
            - 高管网络活动
            - 企业多席位续约
            - 后续高管文凭项目
          painPoints: Limited direct course upgrade path, corporate budget re-evaluation
        - label: 实体校园过渡
          stage: 实体校园过渡
          persona: Degree-seeking Indian student
          touchpoints:
            - 孟买、班加罗尔或古尔冈的线下联合校园
            - 全日制学位课程
          painPoints: Higher capital commitment, campus operational startup friction
    approximationNotes: 基于报告的群组运营、企业培训项目和联合校园合作路线图综合绘制的定性生命周期图。
