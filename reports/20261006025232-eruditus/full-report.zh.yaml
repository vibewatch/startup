      - number: '1.2'
        title: 高管领导、治理与董事会代表
        blocks:
          - type: paragraph
            body: >-
              首席执行官 Ashwin Damera 于 2011 年 1 月共同创办 Eruditus；此前他创立 Travelguru（2005 年共同创办，后于 2009 年被 Travelocity 收购），并曾任
              Travelocity 亚太区顾问 [CO006, CO007]。Damera 持有哈佛商学院 MBA，并通过印度特许会计师协会取得特许会计师资格 [CO007]。联合创始人 Chaitanya
              Kalipatnapu 与 Damera 一同构建了初始交付模式 [CO002]。运营高管包括首席运营官 Shaun Dubash 和首席运营官 Bhushan Heda、首席财务官 Pranjal
              Kumar、首席人力资源官 Ganesh S，以及销售负责人 Manoj Thandassery [CO008]。董事会由主要成长型投资者的机构代表参与，包括 Vivian Wu 和 TPG Rise 管理合伙人
              Simit Batra；二人于 2024 年 10 月领投 $150m Series F 融资时加入董事会 [CO003, CO008]。
