        blocks:
          - type: paragraph
            body: >-
              集团在孟买、新德里、上海、新加坡、帕洛阿尔托、墨西哥城、纽约、波士顿、伦敦和迪拜等办公室雇用超过 1,750 人 [CO003, CO011]。商业营收在 FY22 达到 2.5 亿美元，在 FY23 达到 4
              亿美元，公司管理层的目标是实现全年 EBITDA 盈利 [CO003, CO011]。公司在 Series F
              融资前已实现全年经营盈利，但合并审计财务报表、准确现金消耗率和按合作伙伴划分的营收集中度指标仍为私人信息且未披露 [CO003, CO011,
