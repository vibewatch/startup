        title: 大学护城河集中度、资本结构与财务韧性
        blocks:
          - type: paragraph
            body: >-
              Eruditus 的商业基础依赖与 80 多所知名全球大学签订的独家及半独家合作协议，包括 MIT、Columbia、Harvard、Cambridge、INSEAD 和
              Wharton。这些机构关系建立了强大的品牌护城河，使 Eruditus
              免受低端商品化教育科技供应商侵蚀，但同时也引入了关键的交易对手集中风险。如果标志性大学合作伙伴重新谈判收入分成、将数字课程交付收回内部，或终止主服务协议，Eruditus
              的客户获客效率和毛利率将立即受到侵蚀。与此同时，资本结构和资产负债表披露存在重大尽调缺口。Eruditus 在股权轮次之外还获得了大量债务承诺，但详细债务契约、利息偿付负担和还款计划仍未披露。此外，在 TPG 的
              The Rise Fund 领投、估值 31 亿美元的 1.5 亿美元 Series F 融资之后，关键清算优先权结构、高级 ratchet
              条款和反稀释条款仍未公开披露。没有合并审计财务报表，投资者无法独立核实债务偿付覆盖、营运资金周期或真实现金消耗动态。
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR009
              - CR010
