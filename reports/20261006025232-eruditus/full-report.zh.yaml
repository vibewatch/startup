  - id: TV002
    title: 正反论点
    columns:
      - 观察维度
      - 有证据支持的论点
      - 什么会改变判断
    rows:
      - - 规模
        - 公司和投资者发布的信息称，公司拥有 80 多所大学伙伴、700 多个项目，覆盖 80 多个国家的逾 100 万名学习者。
        - 若经审计的分部数据显示伙伴产出偏低、业务过于集中或招生人数下降，该论点会被削弱。
      - - 运营进展
        - 经联合发布的公司披露称全年实现盈利、企业解决方案收入增长 45%；分析师页面报告 FY24 EBITDA 为 ₹80 crore。
        - 经审计的合并报表若确认现金转化能力和稳健利润率，判断会得到强化；若情况反转，判断则会转弱。
      - - 估值重置
        - Tracxn 报告称，估值从 2021 年的 $3.2B、18.4x 收入倍数降至 2024 年的 $3.1B、6.5x。
        - 当前的公平交易融资轮或可观察的二级市场交易，会取代这些过时的标题标记。
      - - 资本结构与流动性
        - 已审阅来源披露了融资轮金额，但没有披露优先权经济条款；Forge 显示活动有限，也没有当前价格。
        - 完全稀释后的股权结构表、债务契约、清算分配瀑布和可执行的市场价格，能够降低核心投资判断风险。
    notes: 归因于 2024 年 10 月发布的信息的运营指标仍属于公司口径；估值历史和市场活动由独立数据平台报告。
