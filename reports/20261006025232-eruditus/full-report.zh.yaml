      - number: '1.3'
        title: 资本化、融资历史与估值演变
        blocks:
          - type: paragraph
            body: >-
              根据机构风险投资追踪，Eruditus 在 8 轮股权及债务融资中筹集约 $742m；此外，CPP Investments 于 2022 年提供的历史债务额度最高合计 $350m [CO009, CO010,
              CO012]。公司于 2021 年 8 月凭借由 Accel 和 SoftBank Vision Fund 2 共同领投的 $430m Series E 达到独角兽地位，投后估值为 $3.2b [CO009,
              CO010]。2024 年 10 月，Eruditus 完成由 TPG 的 The Rise Fund 领投的 $150m Series F，SoftBank Vision Fund 2、Leeds
              Illuminate、Accel、CPP Investments 和 Chan Zuckerberg Initiative 参与，投后估值据称在 $3.1b 至 $3.2b 之间 [CO003, CO009,
              CO010]。更早的资本化里程碑包括 2020 年 8 月由 Prosus 和 Leeds Illuminate 共同领投、估值 $700m 的 $113m Series D，2019 年由 Peak XV
              Partners 领投的 $40m Series C，以及 Innoven Capital 记录的债务融资 [CO009, CO010]。
