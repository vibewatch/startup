    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、使命与运营模式
        blocks:
          - type: paragraph
            body: >-
              Eruditus（Eruditus Education Private Limited）由 Ashwin Damera 和 Chaitanya Kalipatnapu 于 2010 年创立，全球以
              Emeritus 品牌运营，提供高管教育、短期课程、学位项目和高管证书 [CO001, CO002, CO006]。公司与美国、欧洲、拉丁美洲、东南亚、印度和中国的 80 多所知名全球大学合作，让 80
              多个国家能够获得世界级职业培训 [CO001, CO003]。公司总部位于新加坡，并在孟买和帕洛阿尔托设有重要运营中心；Eruditus
              通过收入分成模式与学术机构合作：大学负责课程设计和教师指导，Eruditus 负责课程数字化、学生获客、技术平台和辅导支持 [CO001, CO004]。在运营周期内，公司已向全球超过 100
              万人交付项目，专业学员报告课程完成率为 85% [CO003, CO005]。
