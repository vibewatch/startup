      - number: '3.2'
        title: 同业概况、能力与市场进入经济学
        blocks:
          - type: paragraph
            body: >-
              上市且具备规模的同业在规模画像、客户目标和财务模式上各不相同。Coursera 运营涵盖免费课程、职业证书和完全在线大学学位的广泛学术合作伙伴目录，拥有广泛的消费者品牌知名度。Udemy
              维持由个人讲师驱动的开放市场模式，提供自定进度的低价课程，在零售学习者和企业团队中均产生较大规模。Udacity
              专门聚焦人工智能、云计算和数据科学等领域的技术纳米学位，历史上服务于企业技能提升项目。相比之下，Eruditus 将其 700 多门课程目录定位为高端职业转型教育，与 80
              多所全球大学合作，通过实时师资互动、专属辅导和 cohort 问责实现 85% 的完成率。
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP007
              - CP008
              - CP009
              - CP010
      - number: '3.3'
        title: 定价能力、转换成本与护城河持久性
        blocks:
          - type: paragraph
            body: >-
              高管教育的差异化根本上取决于品牌资产和感知职业投资回报。Eruditus 的单门课程通常定价较高，从数千美元到数万美元不等，而市场型同业依靠低于 $100
              的个人课程或低摩擦月度订阅。然而，这种高端模式伴随显著的市场进入成本和较高销售摩擦，使获客效率至关重要。此外，大学合作伙伴锁定既是机构护城河，也是战略脆弱性。由于学习者的支付意愿与大学声誉密切相关，一流机构若选择直接交付课程或在竞争性分发平台之间多平台运营，可能压缩利润率。与此同时，全球科技和教育科技行业更广泛的劳动力不确定性及企业重组，也会给企业培训预算带来下行压力。
