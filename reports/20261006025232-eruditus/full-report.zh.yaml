  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、品类范围与交付模式
        blocks:
          - type: paragraph
            body: >-
              Eruditus 位于高等教育与职业劳动力技能提升的交界处，重点面向职业中期管理者、高级管理人员和企业组织。虽然更广义的全球教育支出覆盖初等、中等和本科高等教育体系，估计规模达 7 万亿美元，但 Eruditus
              有意将可服务范围限定为非学位高管证书、专业技术大师课和企业领导力学院。Eruditus 并不直接与授予认证学位的大学或 Coursera、Udemy 等低价自定进度视频库竞争，而是作为 80
              多所精英全球大学（包括 MIT、Columbia 和 INSEAD）的运营合作伙伴。公司的交付架构以小型私有在线课程（SPOC）为核心，将异步视频教学与严格的 cohort
              项目、实时辅导和个性化评分结合起来。这种高接触教学结构带来约 85% 的完成率，显著高于开放式 MOOC 平台常见的个位数完成率。从地域看，约三分之二的 Eruditus
              学员居住在美国以外，使印度、拉丁美洲、东南亚和中东的专业人士无需承担传统全日制寄宿学位项目的搬迁和学费成本，就能接触一流全球师资。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM011
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM010
      - number: '2.2'
        title: 市场规模测算视角：TAM、SAM 与收入运行率 SOM
        blocks:
          - type: paragraph
            body: >-
              评估 Eruditus 的市场机会需要采用多个受约束的规模测算视角，而不能依赖单一宽泛的可寻址估计。宏观上，管理层引用 $7t 的全球教育市场，但继续职业教育、非学位技能提升和高管培训的可服务市场在全球约为
              $400b。在这一市场中，Eruditus 面向大学品牌高管教育和定制企业学习解决方案的高端细分市场，该全球市场估计约为 $50b，受精英大学产能和企业培训预算约束。Eruditus
              已展现显著的商业市场获取能力，经营收入从 FY22 的 $250m 增至 FY23 约 $400m，并以 FY24 $560m 运行率收入为目标。凭借包括 2024 年 10 月由 TPG 的 The Rise
              Fund 领投的 $150m Series F 在内的超过 $1b 累计融资，Eruditus
              已具备确保多年期机构合作的规模。然而，按地区拆分可服务市场份额的独立第三方市场数据仍有限；评估长期市场渗透时，估值模型必须计入缺少合并审计法定报表这一事实。
            claimRefs:
              - CM001
              - CM002
              - CM006
              - CM007
              - CM012
              - CM014
