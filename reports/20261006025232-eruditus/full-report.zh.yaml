  - id: TV001
    title: 建议摘要
    columns:
      - 决策维度
      - 评估
      - 投资含义
    rows:
      - - 建议
        - research-more
        - 在核对股权结构表、债务计划、审计结果和股份条款之前，不要将股权回报计入投资判断。
      - - 信心
        - medium
        - 融资金额和标题估值已得到交叉印证，但运营披露大多由公司发布。
      - - 风险评级
        - high
        - 流动性不足、优先权条款缺失以及相互冲突的资本历史数据，可能实质性改变次级股权的结果。
      - - 估值立场
        - 支持不足且对价格敏感
        - 仅将 $3.1B 作为有日期的 Series F 参考值，不将其视为经独立核验的公允价值。
      - - 回报 / 持有 / 退出
        - 公开证据不足以支持
        - 没有当前二级市场价格或已披露的分配瀑布，能够支持目标回报、持有期或退出收益估算。
    notes: 评估采用 2024 年 10 月融资参考值和截至 2026 年 10 月的访问日期证据；没有可用的当前交易价格或证券分配瀑布。
