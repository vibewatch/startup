      - number: '4.2'
        title: 成本结构、毛利率驱动因素与运营效率
        blocks:
          - type: paragraph
            body: >-
              Eruditus 报告称其在 2023-24 财年实现全年经营盈利，营收超过 3,800 crore 卢比，经营 EBITDA 约为 80 crore 卢比 [CI006]。这一表现相较 FY23
              是重大扭转；独立第三方分析师估计 FY23 年收入为 $400m，但因技术和扩张支出较高，净亏损估计为 $200m，经营利润率为负 [CI007]。Eruditus
              交付架构中的毛利率驱动因素在结构上受大学特许权使用费支配，后者通常占总学费的 30% 至 50%，此外还包括云基础设施、专职导师薪酬和学生获客营销 [CI008]。全球员工人数扩张至约 1,750 至 2,000
              人，分布于新加坡、孟买、帕洛阿尔托和伦敦等主要运营中心 [CI009]。第三方劳动力指南和访谈分析审视了运营成本纪律，反映全球教育科技运营商普遍进行员工人数调整和成本控制 [CI010]。
