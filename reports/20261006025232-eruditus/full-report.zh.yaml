            body: >-
              Eruditus 于 2024 年 10 月完成由 TPG 的 The Rise Fund 领投的 $150m Series F 融资，约 $3.0b 投后估值，较 2021 年 8 月 $3.2b
              的峰值估值略有持平至下降 [CI011]。Series F 投资全部被安排为新增资本，用于推进公司重组、履行 iD Tech 等此前收购的递延获利支付义务，并为企业产品扩张提供资金 [CI012]。包括 CPP
              Investments 此前提供的 $350m 债务额度在内，公司股权和债务累计私募资本超过 $1.24b 至 $1.31b [CI013]。私人流动性平台追踪的二级市场交易显示二级流动性有限，且相对 2021
              年峰值定价存在市场折价，反映公开教育科技公司的估值倍数普遍收缩 [CI014]。关于集团新加坡至印度跨境公司迁移、未偿债务额度的利率契约以及缺少公开可得的合并审计财务报表，关键投资判断阻碍仍然存在
              [CI015]。
