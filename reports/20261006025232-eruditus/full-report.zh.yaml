      - number: '7.4'
        title: 展示项
        blocks:
          - type: callout
            title: 对精英大学品牌的不对称合作伙伴依赖
            body: Eruditus 的客户需求几乎完全来自大学合作伙伴的声誉，而非其自有消费者品牌。任何声誉受损、合作伙伴退出或国际大学授权受到监管限制，都可能直接摧毁学生获客效率和课程定价能力。
            calloutType: risk
            claimRefs:
              - CR001
              - CR009
          - type: callout
            title: 不透明的债务契约与 Series F 优先权悬垂
            body: >-
              在未调整的 31 亿美元估值下，除大量风险债务和传统债务外，公司还完成了 1.5 亿美元 Series F；但围绕清算优先权、利息覆盖契约和投资者回报 ratchet
              的披露缺失，为次级及普通股股东造成严重下行风险。
            calloutType: risk
            claimRefs:
              - CR012
              - CR014
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              可投资论点首先来自规模，而非投机性倍数。投资者和公司公告称，Eruditus 与 80 多所大学合作，提供 700 多个项目，并已服务 80 多个国家的超过 1m
              学习者。同一份经联合发布的公告称，公司实现全年盈利，企业解决方案收入在前一年增长 45%；一个声誉较低的独立分析师页面另行报告 FY24 营收为 3,733 crore 卢比（$448m）、EBITDA 为 80
              crore
              卢比。这些信号支持一个可信的运营平台，但无法证明现金生成、留存、合作伙伴集中度或有理据的进入价格。因此，反论点既是证据层面的，也是运营层面的：最新运营声明大多源自一份由投资者联合发布的公司公告，而审阅过的公开记录没有披露优先股经济条款。当清算优先权、反稀释保护、经审计盈利能力和买方所持确切证券未知时，即使是强大的教育特许经营也可能是糟糕的投资。
            claimRefs:
              - CV006
              - CV007
              - CV009
              - CV010
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV005
              - CV006
              - CV007
              - CV009
              - CV010
              - CV015
              - CV016
      - number: '8.2'
        title: 融资背景与进入纪律
        blocks:
          - type: paragraph
            body: >-
              最清晰的价格参考是 2024 年 10 月 18 日 Series F：四个保留来源报告由 TPG 的 The Rise Fund 领投的 $150m 轮次，而 Tracxn 给出的投后估值为 $3.1b
              、收入倍数为 6.5x。Tracxn 自身历史将 2021 年 8 月 Series E 置于 $3.2b 和 18.4x 收入，因此披露的标题估值下降约 3.1%，报告倍数则显著压缩。这是重置的证据，并不能证明
              $3.1b 具有吸引力。资本历史数据也相互冲突：Tracxn 将 Series E 列为 $430m、八轮合计 $742m，而 Netfigo 称 Series E 为 $650m，Inc42 报告总融资超过
              $1.24b。不同的债务和交易计数惯例可能解释部分差距，但公开证据无法对账。因此，进入纪律应将 $3.1b
              视为有日期的融资参考，而非公允价值；任何承诺都应以经核对的股权结构表、债务计划、优先权瀑布和合并审计结果为条件。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV012
              - CV013
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV012
              - CV013
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV009
              - CV016
      - number: '8.3'
        title: 情景、退出准备度与尽调
        blocks:
          - type: paragraph
            body: >-
              公开证据支持情景边界，而非概率加权目标价。乐观参考是第三方分析师使用 4x-6x 收入得出的 $3.3b-$5.0b
              示意区间；由于底层页面既不是审计申报也不是交易，该区间只能作为上行参考。基准情景在等待经核实的财务和条款期间，将 $3.1b Series F 估值作为临时锚点。悲观情景只是低于该锚点：Tracxn 的倍数从
              2021 年 18.4x 压缩至 2024 年 6.5x，加上 Forge 缺少当前价格，说明没有公开数据证据足以支撑可辩护的底价。Forge 将市场活动标记为有限，且不显示当前 Forge
              Price，因此无法根据可观察流动性对退出窗口、持有期和目标回报进行投资判断。建议是继续研究，信心中等、风险高，估值立场证据不足且对价格敏感。只有在经审计收益、当前交易或融资证据及证券条款允许建立完全稀释回报模型后，观点才会改善。
            claimRefs:
              - CV002
              - CV003
              - CV005
              - CV011
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
