              - CV015
              - CV016
      - number: '8.4'
        title: 展示项
        blocks:
          - type: callout
            title: 给证券定价，而不是给标题定价
            body: 31 亿美元投后公告并不能揭示次级股权的经济价格。在设定目标回报前，应要求提供完全稀释资本化、债务与优先权瀑布、合并审计结果以及当前公平交易价格。
            calloutType: recommendation
            claimRefs:
