            body: >-
              Eruditus 主要以 Emeritus 品牌运营，在 80 多个国家提供大学认证的高管教育
              [CE001]。核心产品目录涵盖高级管理人员项目、在线职业证书、行业认证和学位项目，这些项目与北美、欧洲、拉丁美洲、东南亚、印度和中国的 80 多所顶尖全球大学密切合作开发 [CE001,
              CE002]。项目按结构化 cohort 排期交付，把教师设计的异步模块与同步辅导、小组 cohort 课程、实操指导和职业咨询组合在一起 [CE001, CE006]。这种高接触学术流程使专业学习者完成率达到
              85% [CE001]。企业产品线（Emeritus Enterprise）提供团体报名、针对特定企业团队定制的私有 cohort，以及解决组织能力缺口的定制课程 [CE005,
