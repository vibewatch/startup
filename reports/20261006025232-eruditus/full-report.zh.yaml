  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式、定价机制与商业变现
        blocks:
          - type: paragraph
            body: >-
              Eruditus 与 80 多所全球大学合作，运营专业化的高管教育与劳动力技能提升模式。收入来自三个核心渠道：个人职业证书和小型私有在线课程（SPOC）、企业劳动力转型合同，以及大学学费收入分成合作
              [CI001]。在企业 B2B 项目中，企业客户赞助员工 cohort 或许可定制课程轨道；受人工智能技能提升需求推动，这部分 FY24 收入增长 45% [CI002]。职业证书项目学费通常在 1,500
              美元至超过 10,000 美元之间，取决于课程时长、大学品牌声誉和高管辅导强度 [CI003]。平台课程完成率平均约 85%，由 cohort 辅导、师生个人互动和职业发展咨询支持
              [CI004]。然而，尽管合作大学微型网站宣传了标价和项目总学费，实际净收入留存率及合同约定的大学收入分成比例仍属私人信息，需要进行审计级核验以确认合作伙伴集中度和净费用分成 [CI005]。
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
