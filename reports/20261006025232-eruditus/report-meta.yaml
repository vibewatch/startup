companyProfile:
  summary: >-
    Eruditus is a Singapore-headquartered online executive-education and professional upskilling company that operates
    primarily under the Emeritus brand. It partners with 80+ universities to sell certificates, degree programs, and
    enterprise learning solutions to professionals and employers across 80+ countries, and it reported full-year
    operational profitability in FY24 after reaching roughly ₹3,800 crore of revenue and ₹80 crore of EBITDA. The
    business has meaningful scale and brand reach, but its consolidated statutory accounts, debt covenants, and Series F
    security terms remain private.
