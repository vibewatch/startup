callouts:
  - calloutType: insight
    title: Operational Profitability Inflection vs Consolidated Group Opacity
    body: Eruditus achieved a critical milestone by reaching full-year operational profitability in FY24 with over Rs 3,800 crore in revenue and Rs 80 crore in EBITDA. However, underwriting remains severely constrained by the lack of published consolidated audited financial statements for the holding group, unquantified debt covenants, and the complex tax and structural implications of its planned corporate flip from Singapore to India.
    claimRefs:
      - CI006
      - CI011
      - CI012
      - CI015
