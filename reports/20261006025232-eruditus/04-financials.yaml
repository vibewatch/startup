chapter:
  number: 4
  title: Financials
  summary: Eruditus achieved operational profitability in FY24 with reported revenue exceeding Rs 3,800 crore (~$450M-$480M) and Rs 80 crore in EBITDA, but faces ongoing net loss burdens, opaque holding structure financials, and undisclosed debt terms.
