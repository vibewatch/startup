    title: Reported Historical Financial Performance and Operating Metrics
    columns:
      - Fiscal Period
      - Reported / Estimated Revenue
      - EBITDA / Operating Profit
      - Net Income / Loss
      - Workforce Headcount
      - Operational Notes & Data Source
    rows:
      - - FY2023 (Reported / Est.)
        - $400M (reported in third-party filings/estimates)
        - Negative (~-50% margin est.)
        - ($200M) estimated net loss
        - ~2,300 peak employees
        - Rapid post-pandemic expansion and global partner investments (Affluense/Forge)
      - - FY2024 (Reported / Est.)
        - Rs 3,800+ Cr (~$450M-$480M)
        - Rs ~80 Cr EBITDA (positive)
        - Undisclosed consolidated net income
        - ~1,750 - 2,000 employees
        - Achieved full-year operational profitability; enterprise revenue +45% (VCCircle/CEO)
      - - FY2025-2026 (Forward Est.)
        - Unreported consolidated actuals
        - Targeting margin expansion
        - Undisclosed pending India flip
        - ~2,000 employees
        - Corporate restructuring ahead of planned domestic Indian public listing
    notes: Figures reflect a mix of audited statutory disclosures, executive interview statements (VCCircle), and third-party company database estimates (Affluense, Lapaas).
    claimRefs:
      - CI006
      - CI007
      - CI008
      - CI009
      - CI010
  - id: TI003
    title: Key Unit Economics, Margins, and Underwriting Diligence Gaps
    columns:
      - Financial Metric / Component
      - Reported / Benchmark Value
      - Estimation Confidence
      - Strategic dilience Significance
      - Required Diligence Action
    rows:
      - - Gross Margin
        - ~50% - 55% estimated net of university royalties
        - Medium
        - Governs gross contribution before student acquisition and platform overhead
        - Request university royalty schedule and direct faculty delivery cost breakdown
      - - Course Completion Rate
        - 85% across professional programs
        - High
        - Validates learner engagement and brand protection for partner institutions
        - Verify course completion definitions across self-paced versus cohort programs
      - - Enterprise Revenue Growth
        - 45% year-over-year in FY24
        - High
        - Indicates accelerating transition from B2C acquisition to recurring B2B contracts
        - Audit customer acquisition cost (CAC), LTV/CAC ratio, and annual contract value
      - - Blended EBITDA Margin
        - Positive operational EBITDA (~2% on Rs 3,800 Cr)
        - High
        - Marks inflection point from venture cash burn to self-sustaining operations
        - Review consolidated cash flow statement to verify operating cash conversion
      - - Valuation & Entry Multiple
        - $3.0B post-money valuation (~6.3x FY24 revenue)
        - High
        - Reflects valuation compression from $3.2B Series E peak in 2021
        - Examine Series F liquidation preference, ratchet rights, and anti-dilution terms
    notes: Confidence ratings reflect verifiable primary statements by CEO Ashwin Damera and lead investor press releases versus unverified financial estimates.
    claimRefs:
      - CI004
      - CI006
      - CI008
      - CI011
      - CI012
