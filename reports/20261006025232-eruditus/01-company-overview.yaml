chapter:
  number: 1
  title: "Company Overview"
  summary: "Founded in 2010 by Ashwin Damera and Chaitanya Kalipatnapu, Eruditus (operating primarily under the Emeritus brand) delivers executive education and professional upskilling programs in partnership with over 80 leading universities worldwide. The group achieved full-year profitability and secured a $150 million Series F financing in October 2024 at a $3.1 billion to $3.2 billion valuation, though consolidated group filings remain private."
sections:
  - id: "corporate-identity-founding"
    title: "Corporate Identity, Mission, and Operating Model"
    body: "Eruditus (Eruditus Education Private Limited), founded in 2010 by Ashwin Damera and Chaitanya Kalipatnapu, operates globally under the Emeritus brand to deliver executive education, short courses, degree programs, and senior executive certificates [CO001, CO002, CO006]. The enterprise partners with more than 80 prestigious global universities across the United States, Europe, Latin America, Southeast Asia, India, and China to make world-class professional training accessible across 80+ countries [CO001, CO003]. Headquartered out of Singapore with significant operational hubs in Mumbai and Palo Alto, Eruditus collaborates with academic institutions through a revenue-sharing model where universities provide curriculum design and faculty guidance while Eruditus manages course digitization, student acquisition, technology platforms, and coaching support [CO001, CO004]. Across its lifecycle, the company has delivered programs to more than 1 million individuals globally, achieving a reported 85% course completion rate among professional participants [CO003, CO005]."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
      - "CO005"
      - "CO006"
    tableRefs:
      - "TO001"
  - id: "executive-leadership-governance"
    title: "Executive Leadership, Governance, and Board Representation"
    body: "Chief Executive Officer Ashwin Damera co-founded Eruditus in January 2011 after previously establishing Travelguru (co-founded in 2005 and subsequently acquired by Travelocity in 2009) and serving as an advisor at Travelocity Asia-Pacific [CO006, CO007]. Damera holds an MBA from Harvard Business School and qualified as a Chartered Accountant through the Institute of Chartered Accountants of India [CO007]. Co-founder Chaitanya Kalipatnapu structured the initial delivery model alongside Damera [CO002]. Operating executive roles include Chief Operating Officer Shaun Dubash and Chief Operating Officer Bhushan Heda, Chief Financial Officer Pranjal Kumar, Chief Human Resources Officer Ganesh S, and Head of Sales Manoj Thandassery [CO008]. Board governance reflects institutional representation from major growth investors, including Vivian Wu and TPG Rise Managing Partner Simit Batra, who joined the board of directors in October 2024 upon leading the $150 million Series F financing round [CO003, CO008]."
    claimRefs:
      - "CO002"
      - "CO003"
      - "CO006"
      - "CO007"
      - "CO008"
    tableRefs:
      - "TO002"
  - id: "capitalization-financing-history"
    title: "Capitalization, Funding History, and Valuation Progression"
    body: "Eruditus has raised approximately $742 million across eight equity and debt financing rounds according to institutional venture tracking, alongside historical debt facilities totaling up to $350 million from CPP Investments in 2022 [CO009, CO010, CO012]. The company achieved unicorn status in August 2021 with a $430 million Series E round co-led by Accel and SoftBank Vision Fund 2 at a post-money valuation of $3.2 billion [CO009, CO010]. In October 2024, Eruditus closed a $150 million Series F round led by TPG's The Rise Fund with participation from SoftBank Vision Fund 2, Leeds Illuminate, Accel, CPP Investments, and the Chan Zuckerberg Initiative, pegged at a post-money valuation between $3.1 billion and $3.2 billion [CO003, CO009, CO010]. Earlier capitalization milestones include a $113 million Series D in August 2020 co-led by Prosus and Leeds Illuminate at a $700 million valuation, a $40 million Series C in 2019 led by Peak XV Partners, and debt funding recorded through Innoven Capital [CO009, CO010]."
    claimRefs:
      - "CO003"
      - "CO009"
      - "CO010"
      - "CO012"
    tableRefs:
      - "TO003"
    figureRefs:
      - "FO001"
  - id: "operational-scale-headcount"
    title: "Operational Scale, Headcount, and Information Disclosures"
    body: "The group employs more than 1,750 individuals across offices in Mumbai, New Delhi, Shanghai, Singapore, Palo Alto, Mexico City, New York, Boston, London, and Dubai [CO003, CO011]. Commercial revenue achieved $250 million in FY22 and $400 million in FY23, with company leadership targeting full-year EBITDA profitability [CO003, CO011]. While the company reached full-year operational profitability ahead of its Series F financing, consolidated audited financial statements, exact cash burn rates, and partner-specific revenue concentration metrics remain private and undisclosed [CO003, CO011, CO013]. Career intelligence platforms note potential exposure to edtech workforce rationalization, though no material company-wide restructuring was formally confirmed in 2026 [CO014]."
    claimRefs:
      - "CO003"
      - "CO011"
      - "CO013"
      - "CO014"
