chapter:
  number: 8
  title: "Valuation"
  summary: "The latest disclosed round provides a $3.1B post-money reference and a reported 6.5x revenue multiple, but it is not a current market-clearing price. Eruditus shows meaningful scale and company-reported profitability, yet missing security terms, conflicting funding totals, and absent current secondary pricing support a research-more recommendation rather than an investable target return."
sections:
  - id: "thesis-and-anti-thesis"
    title: "Thesis and Anti-Thesis"
    body: >-
      The investable thesis begins with scale rather than a speculative multiple. Investor and
      company releases say Eruditus works with more than 80 university partners, offers over 700
      programs, and has served more than 1 million learners in 80-plus countries. The same
      syndicated release says the company achieved full-year profitability and that enterprise
      solutions revenue grew 45% in the preceding year; an independent but lower-reputation
      analyst page separately reports FY24 revenue of ₹3,733 crore ($448M) and EBITDA of ₹80
      crore. These signals support a credible operating platform, but they do not establish cash
      generation, retention, partner concentration, or a defensible entry price. The anti-thesis
      is therefore evidentiary as well as operational: most recent operating claims originate in
      one company-issued release syndicated by investors, while the reviewed public record does
      not disclose preferred-share economics. A strong education franchise can still be a poor
      investment when liquidation preference, anti-dilution protection, audited profitability,
      and the buyer's exact security are unknown.
    claimRefs:
      - "CV006"
      - "CV007"
      - "CV009"
      - "CV010"
      - "CV016"
    tableRefs:
      - "TV002"
  - id: "financing-context-and-entry-discipline"
    title: "Financing Context and Entry Discipline"
    body: >-
      The clearest price reference is the October 18, 2024 Series F: four retained sources report
      a $150M round led by TPG's The Rise Fund, while Tracxn assigns a $3.1B post-money valuation
      and a 6.5x revenue multiple. Tracxn's own history places the August 2021 Series E at $3.2B
      and 18.4x revenue, so the disclosed headline valuation declined about 3.1% while the
      reported multiple compressed materially. That is evidence of a reset, not proof that
      $3.1B is attractive. Capital-history data also conflict: Tracxn lists $430M for Series E
      and $742M across eight rounds, whereas Netfigo calls Series E $650M and Inc42 reports total
      funding above $1.24B. Different debt and transaction-counting conventions may explain part
      of the gap, but public evidence does not reconcile it. Entry discipline should therefore
      treat $3.1B as a dated financing reference, not fair value, and condition any commitment on
      a reconciled cap table, debt schedule, preference waterfall, and audited consolidated
      results.
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV003"
      - "CV004"
      - "CV005"
      - "CV012"
      - "CV013"
    tableRefs:
      - "TV001"
    figureRefs:
      - "FV001"
  - id: "scenarios-exit-and-diligence"
    title: "Scenarios, Exit Readiness, and Diligence"
    body: >-
      Public evidence supports scenario boundaries, not a probability-weighted price target.
      The bull reference is a third-party analyst's illustrative $3.3B-$5.0B range using 4x-6x
      revenue; because the underlying page is neither an audited filing nor a transaction, that
      range is an upside reference only. The base case holds the $3.1B Series F mark as a
      provisional anchor pending verified financials and terms. The bear case is simply below
      that mark: Tracxn's compression from 18.4x in 2021 to 6.5x in 2024 and Forge's lack of a
      current price show why no public-data floor is defensible. Forge labels market activity
      limited and displays no current Forge Price, so an exit window, hold period, and target
      return cannot be underwritten from observable liquidity. The recommendation is
      research-more with medium confidence, high risk, and an insufficiently supported,
      price-sensitive valuation stance. The view improves only after audited earnings, current
      trading or financing evidence, and security terms permit a fully diluted return model.
    claimRefs:
      - "CV002"
      - "CV003"
      - "CV005"
      - "CV011"
      - "CV014"
      - "CV015"
      - "CV016"
    tableRefs:
      - "TV003"
