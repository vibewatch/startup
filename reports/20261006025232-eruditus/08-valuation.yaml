          detail: "The 2024 release claims full-year profitability; an analyst page reports ₹80 crore FY24 EBITDA."
        - id: "series-f-anchor"
          label: "Series F anchor"
          detail: "$150M round at a reported $3.1B post-money valuation and 6.5x revenue."
        - id: "multiple-reset"
          label: "Multiple reset"
          detail: "Reported revenue multiple fell from 18.4x in 2021 to 6.5x in 2024."
        - id: "missing-underwriting-inputs"
          label: "Missing underwriting inputs"
          detail: "No public preference waterfall, reconciled funding total, or current secondary price."
        - id: "decision"
          label: "Research more"
          detail: "Defer price and return underwriting until audited and legal evidence closes the gaps."
      edges:
        - from: "operating-scale"
          to: "profitability-claim"
        - from: "profitability-claim"
          to: "series-f-anchor"
        - from: "series-f-anchor"
          to: "multiple-reset"
        - from: "multiple-reset"
          to: "missing-underwriting-inputs"
        - from: "missing-underwriting-inputs"
          to: "decision"
    approximationNotes: "The sequence is an analytical decision path, not a probability model or a representation of contractual seniority."
