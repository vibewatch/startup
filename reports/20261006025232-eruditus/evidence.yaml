evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: Series F instrument terms and liquidation preference
    missingEvidence: >-
      Contractual Series F investment agreement detailing liquidation preferences, dividend covenants, and ratchet
      protections.
    whyItMatters: >-
      Without exact share class terms, the downside protection structure and effective post-money dilution for common
      shareholders cannot be determined.
    diligencePath: Request shareholder agreement, term sheet, or capitalization table extracts during formal management diligence.
    relatedQuestionRefs:
      - QO008
      - QO003
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: Consolidated audited statutory filings
    missingEvidence: Audited consolidated group financial statements (balance sheet, cash flow, and P&L) for FY24 and FY25.
    whyItMatters: >-
      Prevents verification of true gross margin, working capital cash burn, debt service coverage, and statutory
      liabilities.
    diligencePath: >-
      Obtain ACRA (Singapore) and MCA (India) statutory annual filings for Singapore parent entity and domestic
      operating subsidiaries.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: tam-sam-som-methodology
    missingEvidence: Third-party audited market sizing reports breaking down executive education spend by geography and sub-discipline.
    whyItMatters: >-
      Without independent analyst datasets isolating executive education SAM from broader tertiary education, sizing
      relies heavily on management statements and top-down estimates.
    diligencePath: >-
      Obtain HolonIQ or Gartner research briefings on post-secondary professional upskilling and request management's
      internal market sizing models.
  - type: private-evidence-only
    severity: material
    topic: b2b-contract-values
    missingEvidence: >-
      Detailed enterprise contract disclosures, annual contract values (ACV), and net revenue retention (NRR) for the
      B2B division.
    whyItMatters: >-
      B2B enterprise is cited as the primary future growth and margin engine, but disaggregated enterprise cohort
      economics remain private.
    diligencePath: >-
      Review enterprise customer pipeline data, cohort retention schedules, and B2B contract terms during confirmatory
      diligence.
  - type: private-evidence-only
    severity: material
    topic: competitor-contract-terms
    missingEvidence: >-
      Confidential revenue-sharing percentages and master services agreement exclusivity terms between top-tier
      universities and platform operators (Eruditus vs Coursera vs 2U/edX).
    whyItMatters: >-
      Without contractual exclusivity data, it is impossible to verify whether marquee universities can launch identical
      programs with lower-cost distribution competitors.
    diligencePath: Review university partnership master services agreements and exclusivity clauses during legal diligence.
    relatedQuestionRefs:
      - QP005
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: material
    topic: enterprise-nrr-and-churn
    missingEvidence: >-
      Audited B2B net retention rates (NRR) and customer acquisition cost (CAC) payback periods for Eruditus compared
      directly against Coursera for Business and Udemy Business.
    whyItMatters: >-
      Enterprise contract durability is essential to validate whether Eruditus's 45% B2B growth represents sustainable
      compounding or high-churn annual replacement.
    diligencePath: Obtain cohort-level B2B churn and customer expansion data from Eruditus management.
    relatedQuestionRefs:
      - QP004
  - type: private-evidence-only
    severity: material
    topic: consolidated-audited-financials
    missingEvidence: >-
      Audited consolidated group financial statements detailing gross revenue, partner university pass-through
      royalties, net revenue retention, and consolidated cash flow.
    whyItMatters: >-
      Reported EBITDA profitability cannot be fully underwritten without statutory verification of cash collection,
      deferred revenue recognition, and capital expenditure amortization.
    diligencePath: >-
      Obtain consolidated group statutory filings for the Singapore parent holding company and Indian operating
      subsidiaries during underwriting access.
    relatedQuestionRefs:
      - QI008
  - type: missing-source
    severity: material
    topic: debt-facility-terms-and-covenants
    missingEvidence: >-
      Complete contractual documentation for outstanding debt instruments, including the $350 million facility from CPP
      Investments, interest margins, and debt service covenants.
    whyItMatters: >-
      Senior debt service obligations and financial maintenance covenants represent potential liquidity constraints if
      macroeconomic headwinds slow tuition collections.
    diligencePath: Review credit agreements and compliance certificates during confidential virtual data room diligence.
    relatedQuestionRefs:
      - QI008
  - type: private-evidence-only
    severity: material
    topic: ai-architecture-and-safety-controls
    missingEvidence: >-
      Detailed system architecture documentation, foundation model provider contracts, prompt caching strategies, and
      evaluation benchmark scores for Eruditus's proprietary AI student tutors.
    whyItMatters: >-
      Verifying whether the AI tutor layer is a defensible proprietary fine-tuned technology moat or a standard
      commercial API wrapper affects valuation multiples and gross margin scalability.
    diligencePath: >-
      Request an engineering architecture review with the CTO or Chief AI Officer, including AI safety protocols,
      context window management, and hallucination containment test suites.
    relatedQuestionRefs:
      - QE007
    relatedTableRefs:
      - TE002
      - TE003
  - id?: null
    type: missing-source
    severity: minor
    topic: security-compliance-certifications
    missingEvidence: >-
      Third-party audited SOC 2 Type II reports, ISO/IEC 27001 certifications, and formal enterprise data privacy
      compliance documentation for the Emeritus Enterprise platform.
    whyItMatters: >-
      Enterprise Fortune 500 procurement teams mandate rigorous infosec compliance before provisioning employee accounts
      and integrating with corporate HRIS systems.
    diligencePath: >-
      Request the latest SOC 2 Type II audit report, bridge letters, and enterprise vendor security questionnaire from
      Emeritus IT and compliance teams.
    relatedQuestionRefs:
      - QE007
    relatedTableRefs:
      - TE002
  - type: private-evidence-only
    severity: material
    topic: customer-retention-and-churn
    missingEvidence: >-
      Audited cohort-based retention curves, net revenue retention (NRR), gross revenue retention (GRR), and annual
      repeat enrollment rates for individual and B2B buyers.
    whyItMatters: >-
      Without retention and churn data, it is impossible to evaluate whether growth requires continuous high CAC
      reinvestment or compounds sustainably.
    diligencePath: >-
      Request confidential historical cohort retention tables, enterprise logo churn rates, and LTV/CAC ratios from
      Eruditus management.
    relatedQuestionRefs:
      - QU004
  - type: private-evidence-only
    severity: material
    topic: partner-concentration
    missingEvidence: >-
      Revenue contribution breakdown by top 5 and top 10 university partners, including specific share of enrollments
      driven by anchor institutions like Wharton or MIT.
    whyItMatters: >-
      High institutional concentration would expose Eruditus to severe revenue drops if an anchor university
      renegotiates commission rates or terminates its master services agreement.
    diligencePath: Inspect top 10 university partner revenue shares and contract expiration/renewal schedules in data room diligence.
    relatedQuestionRefs:
      - QU005
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: regulatory-and-litigation-records
    missingEvidence: >-
      Comprehensive regulatory compliance filings, international accreditation correspondence, and pending litigation or
      arbitration records across operating subsidiaries.
    whyItMatters: >-
      Verifies whether cross-border degree partnerships and joint-venture campuses face active regulatory challenges or
      student refund actions.
    diligencePath: >-
      Request statutory disclosure schedules, court docket searches in India, Singapore, and Delaware, and formal UGC
      approval certifications.
    relatedQuestionRefs:
      - QR006
    relatedTableRefs:
      - TR001
  - type: missing-source
    severity: material
    topic: debt-covenants-and-preference-ratchets
    missingEvidence: >-
      Credit agreement documentation for the CPP Investments debt facility and full Series F shareholder agreement
      detailing liquidation preference and ratchet mechanics.
    whyItMatters: >-
      Determines debt service cash drain, default thresholds, and whether down-round protections impose punitive
      dilution on common and Series E holders.
    diligencePath: >-
      Obtain credit agreements, lender compliance certificates, capitalization table preference waterfall models, and
      audited balance sheets under NDA.
    relatedQuestionRefs:
      - QR008
    relatedTableRefs:
      - TR003
  - type: conflicting-data
    severity: material
    topic: capital-history
    missingEvidence: >-
      A reconciled financing schedule explaining the $430M versus $650M Series E amounts and the $742M versus
      $1.24B-plus total funding figures.
    whyItMatters: Debt, secondary sales, and primary equity may be counted differently, changing dilution and leverage analysis.
    diligencePath: >-
      Obtain the company-prepared cap table and sources-and-uses schedule, then reconcile every round to executed
      financing documents.
    relatedQuestionRefs:
      - QV003
  - type: private-evidence-only
    severity: material
    topic: security-terms
    missingEvidence: >-
      Series F liquidation preference, participation, anti-dilution, ratchet, conversion, and seniority terms, plus the
      complete debt covenant package.
    whyItMatters: Headline post-money valuation does not determine proceeds to a new or junior shareholder under downside exits.
    diligencePath: >-
      Review the executed share purchase, shareholders', charter, debt, and intercreditor documents under NDA and model
      the preference waterfall.
    relatedQuestionRefs:
      - QV006
  - type: missing-source
    severity: material
    topic: audited-financials
    missingEvidence: >-
      Current audited consolidated revenue, EBITDA, cash flow, net debt, deferred revenue, and segment performance with
      accounting definitions.
    whyItMatters: >-
      Company-issued profitability and growth claims cannot establish cash generation or support a return model without
      audited denominators.
    diligencePath: >-
      Obtain FY24-FY26 consolidated audited statements, management accounts, quality-of-earnings work, and a net-debt
      bridge.
  - type: missing-source
    severity: material
    topic: current-price-and-comparables
    missingEvidence: >-
      Current executable secondary bids or an arm's-length financing price and a date-matched public-company comparable
      set.
    whyItMatters: >-
      A dated private-round mark and a low-confidence analyst range do not establish fair value, liquidity, or an exit
      multiple.
    diligencePath: >-
      Request broker indications and recent transfer data, then build a date-matched comparable set from public filings
      and market prices.
