              - CE010
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Pedagogical Orchestration Outweighs Pure Software Moat
            body: >-
              Eruditus's true technological strength is not a standalone proprietary LMS or foundational AI algorithm,
              but the software-enabled orchestration of high-touch educational delivery. Achieving an 85% course
              completion rate across executive demographics requires seamless synchronization between university
              faculty, operational mentors, student cohorts, and conversational AI tutors [CE001, CE007].
            calloutType: insight
            claimRefs:
              - CE001
              - CE007
          - type: callout
            title: Proprietary AI Implementation Risks and Verification Gaps
            body: >-
              While Eruditus has earmarked its $150M Series F capital toward generative AI learning products,
              independent benchmarks regarding tutor accuracy, hallucination containment in rigorous business/technical
              domains, and student retention lift remain unpublished [CE003, CE007, CE010]. Differentiating true
              proprietary pedagogical AI from standard commercial LLM wrappers is a primary technical diligence
              requirement [CE007, CE010].
            calloutType: risk
            claimRefs:
              - CE003
              - CE007
              - CE010
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation and Audience Profile
        blocks:
          - type: paragraph
            body: >-
              Eruditus operates a dual-pronged customer acquisition architecture comprising individual mid-to-senior
              working professionals and B2B enterprise/government accounts. Individual learners represent the primary
              enrollment volume, seeking credentialed executive education from top global universities to advance career
              mobility without leaving employment. The B2B corporate and government training vertical, which expanded
              enterprise revenue by 45% following intensified corporate demand for AI and executive upskilling,
              represents a growing high-durability contract segment. Geographically, Eruditus has historically derived
              75% of revenue from international markets, but domestic Indian demand is projected to contribute over 50%
              of group revenue over the next five years as international university partnerships deploy physical and
              hybrid operations on-shore.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
