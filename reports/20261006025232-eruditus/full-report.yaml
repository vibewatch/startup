      - number: '6.2'
        title: Adoption Trajectory, Volumes, and Learning Outcomes
        blocks:
          - type: paragraph
            body: >-
              Cumulative learner scale has expanded from 300,000 individuals across 80+ countries during early digital
              scaling to more than 1 million individuals globally by late 2024. Course catalog breadth spans over 700
              professional learning programs co-developed with more than 80 global university partners, spanning
              technical, business management, and executive leadership curricula. While broad edtech models suffer from
              single-digit completion rates, Eruditus reports an 85% completion rate across professional cohorts, driven
              by small-group mentoring, live faculty sessions, and continuous pacing support. However, standalone net
              revenue retention (NRR) and detailed cohort churn rates remain undisclosed, clouding repeat-purchase
              economics across individual and corporate buyers.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
