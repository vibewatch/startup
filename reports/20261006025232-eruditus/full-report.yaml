      - number: '6.3'
        title: University Partner Proof, Concentration, and Operational Risks
        blocks:
          - type: paragraph
            body: >-
              Commercial delivery at Eruditus hinges on joint-venture style institutional agreements with premier
              universities, including Illinois Institute of Technology, University of Bristol, University of Liverpool,
              and UNSW Sydney. Under these operating agreements, universities govern academic curriculum frameworks and
              credentialing while Eruditus manages capital investment, student acquisition, digital delivery, and local
              campus infrastructure across Indian metro hubs. Partner concentration presents an ongoing strategic risk:
              because learner willingness-to-pay depends directly on partner prestige, termination or non-renewal by
              marquee anchor universities would immediately degrade conversion velocity and pricing power. Furthermore,
              external workforce risk assessments have flagged potential restructuring and efficiency pressures within
              edtech operations, underscoring cost vulnerability if student intake slows.
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
