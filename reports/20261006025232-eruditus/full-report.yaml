      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: University Moat vs Distributor Disintermediation Risk
            body: >-
              Eruditus's commercial appeal relies completely on university brand equity (MIT, Wharton, Illinois Tech,
              Bristol, Liverpool, etc.). While long-term contracts and complex co-development protect Eruditus, the
              company remains exposed to partner concentration and contract renegotiation risks if prestigious
              universities build internal delivery engines or license directly to competing aggregators.
            calloutType: risk
            claimRefs:
              - CU007
              - CU009
              - CU012
              - CU013
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, Legal, and Cross-Border Compliance Posture
        blocks:
          - type: paragraph
            body: >-
              Eruditus operates across more than 80 countries, delivering higher education credentials and executive
              certificates co-branded with elite American, European, and Asian universities. This global operating
              footprint exposes the company to intricate, shifting regulatory environments governing transnational
              higher education, cross-border digital data transfers, and institutional accreditation. In India, where
              Eruditus is expanding physical campus infrastructure and joint degree delivery, higher education policy,
              foreign university regulations by the University Grants Commission (UGC), and online education guidelines
              require stringent adherence to academic governance, curriculum delivery, and fee transparency. In the
              United States and the European Union, higher education regulations, intellectual property licensing
              frameworks, consumer protection rules, and data privacy mandates such as GDPR create continuous compliance
              obligations. Because Eruditus provides the technological delivery and student acquisition layer while
              universities grant the formal certificate or degree, any adverse regulatory finding or loss of
              accreditation affecting a university partner directly threatens program viability. Furthermore, the
              absence of public litigation disclosures or formal regulatory clearance records for group restructuring
              necessitates targeted legal diligence prior to any planned liquidity event.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
