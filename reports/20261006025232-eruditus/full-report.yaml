chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Mission, and Operating Model
        blocks:
          - type: paragraph
            body: >-
              Eruditus (Eruditus Education Private Limited), founded in 2010 by Ashwin Damera and Chaitanya Kalipatnapu,
              operates globally under the Emeritus brand to deliver executive education, short courses, degree programs,
              and senior executive certificates [CO001, CO002, CO006]. The enterprise partners with more than 80
              prestigious global universities across the United States, Europe, Latin America, Southeast Asia, India,
              and China to make world-class professional training accessible across 80+ countries [CO001, CO003].
              Headquartered out of Singapore with significant operational hubs in Mumbai and Palo Alto, Eruditus
              collaborates with academic institutions through a revenue-sharing model where universities provide
              curriculum design and faculty guidance while Eruditus manages course digitization, student acquisition,
              technology platforms, and coaching support [CO001, CO004]. Across its lifecycle, the company has delivered
              programs to more than 1 million individuals globally, achieving a reported 85% course completion rate
              among professional participants [CO003, CO005].
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO006
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO003
              - CO009
              - CO010
              - CO011
              - CO012
              - CO013
      - number: '1.2'
        title: Executive Leadership, Governance, and Board Representation
        blocks:
          - type: paragraph
            body: >-
              Chief Executive Officer Ashwin Damera co-founded Eruditus in January 2011 after previously establishing
              Travelguru (co-founded in 2005 and subsequently acquired by Travelocity in 2009) and serving as an advisor
              at Travelocity Asia-Pacific [CO006, CO007]. Damera holds an MBA from Harvard Business School and qualified
              as a Chartered Accountant through the Institute of Chartered Accountants of India [CO007]. Co-founder
              Chaitanya Kalipatnapu structured the initial delivery model alongside Damera [CO002]. Operating executive
              roles include Chief Operating Officer Shaun Dubash and Chief Operating Officer Bhushan Heda, Chief
              Financial Officer Pranjal Kumar, Chief Human Resources Officer Ganesh S, and Head of Sales Manoj
              Thandassery [CO008]. Board governance reflects institutional representation from major growth investors,
              including Vivian Wu and TPG Rise Managing Partner Simit Batra, who joined the board of directors in
              October 2024 upon leading the $150 million Series F financing round [CO003, CO008].
            claimRefs:
              - CO002
              - CO003
              - CO006
              - CO007
              - CO008
          - type: table
            tableRef: TO002
            claimRefs:
              - CO002
              - CO003
              - CO006
              - CO007
              - CO008
      - number: '1.3'
        title: Capitalization, Funding History, and Valuation Progression
        blocks:
          - type: paragraph
            body: >-
              Eruditus has raised approximately $742 million across eight equity and debt financing rounds according to
              institutional venture tracking, alongside historical debt facilities totaling up to $350 million from CPP
              Investments in 2022 [CO009, CO010, CO012]. The company achieved unicorn status in August 2021 with a $430
              million Series E round co-led by Accel and SoftBank Vision Fund 2 at a post-money valuation of $3.2
              billion [CO009, CO010]. In October 2024, Eruditus closed a $150 million Series F round led by TPG's The
              Rise Fund with participation from SoftBank Vision Fund 2, Leeds Illuminate, Accel, CPP Investments, and
              the Chan Zuckerberg Initiative, pegged at a post-money valuation between $3.1 billion and $3.2 billion
              [CO003, CO009, CO010]. Earlier capitalization milestones include a $113 million Series D in August 2020
              co-led by Prosus and Leeds Illuminate at a $700 million valuation, a $40 million Series C in 2019 led by
              Peak XV Partners, and debt funding recorded through Innoven Capital [CO009, CO010].
            claimRefs:
              - CO003
