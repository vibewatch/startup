  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Architecture & Program Delivery Workflow
        blocks:
          - type: paragraph
            body: >-
              Eruditus operates primarily under the Emeritus brand to deliver university-accredited executive education
              across more than 80 countries [CE001]. The core product catalog spans senior executive programs, online
              professional certificates, industry certifications, and degree programs developed in close collaboration
              with more than 80 top-tier global universities across North America, Europe, Latin America, Southeast
              Asia, India, and China [CE001, CE002]. Program delivery is built around structured cohort schedules
              combining faculty-designed asynchronous modules with synchronous mentoring, small-group cohort sessions,
              hands-on coaching, and career counseling [CE001, CE006]. This high-touch academic workflow yields an 85%
              completion rate across professional learners [CE001]. The enterprise product line (Emeritus Enterprise)
              provides group enrollments, private cohorts customized for specific enterprise teams, and tailored
              curricula addressing organizational capability gaps [CE005, CE006]. Proprietary AI-powered tutors have
              been deployed alongside course curricula to provide continuous student support and interactive learning
              assistance [CE003, CE007].
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE005
              - CE006
              - CE007
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE004
              - CE005
              - CE007
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE003
              - CE005
              - CE006
              - CE007
      - number: '5.2'
        title: Platform Infrastructure, Enterprise Integrations & AI Layer
        blocks:
          - type: paragraph
            body: >-
              The platform operating model combines academic course authoring with enterprise delivery infrastructure
              and specialized student learning workflows [CE001, CE003, CE006]. Technology infrastructure is
              orchestrated across several functional layers: public discovery and enrollment portals, learning
              management delivery systems, enterprise capability dashboards, and generative AI services [CE003, CE005,
              CE007]. Eruditus has prioritized investments in generative AI technology following its Series F funding
              round, incorporating AI-driven student tutors and tailored enterprise learning pathways designed to
              capture enterprise upskilling demand [CE003, CE004, CE007]. While Eruditus Developers maintains 139 public
              software repositories on GitHub covering developer tooling and automation components, Eruditus does not
              distribute open-source commercial learning software or public developer APIs [CE008, CE009]. Instead,
              external enterprise integrations interface with corporate human resource information systems (HRIS) and
              internal enterprise learning platforms for cohort provisioning and enrollment tracking [CE005, CE006].
