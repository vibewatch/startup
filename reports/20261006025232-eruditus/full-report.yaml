        - >-
          Do not underwrite an equity return until the cap table, debt schedule, audited results, and share terms are
          reconciled.
      - - Confidence
        - medium
        - >-
          The financing amount and headline valuation are corroborated, but operating disclosures are largely
          company-issued.
      - - Risk rating
        - high
        - >-
          Illiquidity, missing preference terms, and conflicting capital-history figures can materially change
          junior-equity outcomes.
      - - Valuation stance
        - insufficiently supported and price-sensitive
        - Use $3.1B only as the dated Series F reference, not as independently verified fair value.
      - - Return / hold / exit
        - not supportable from public evidence
        - >-
          No current secondary price or disclosed waterfall supports a target return, holding period, or exit proceeds
          estimate.
    notes: >-
      Assessments use the October 2024 financing reference and October 2026 access-date evidence; no current transaction
      price or security waterfall was available.
    claimRefs:
      - CV001
      - CV002
      - CV012
      - CV013
      - CV015
      - CV016
  - id: TV002
    title: Thesis and Anti-Thesis
    columns:
      - Lens
      - Evidence-backed argument
      - What would change the view
    rows:
      - - Scale
        - >-
          Company and investor releases cite 80+ university partners, 700+ programs, and more than 1 million learners in
          80+ countries.
        - >-
          Audited segment data showing weak partner productivity, concentration, or declining enrollment would weaken
          the thesis.
      - - Operating progress
        - >-
          Syndicated company disclosures claim full-year profitability and 45% enterprise-solutions revenue growth; an
          analyst page reports ₹80 crore FY24 EBITDA.
        - >-
          Audited consolidated statements confirming cash conversion and durable margins would strengthen the view; a
          reversal would weaken it.
      - - Valuation reset
        - Tracxn reports a move from $3.2B and 18.4x revenue in 2021 to $3.1B and 6.5x in 2024.
        - A current arm's-length round or observable secondary trades would replace the dated headline marks.
      - - Capital structure and liquidity
        - >-
          Reviewed sources disclose round amounts but not preference economics, while Forge shows limited activity and
          no current price.
        - >-
          A fully diluted cap table, debt covenants, liquidation waterfall, and executable market price would reduce the
          principal underwriting risk.
    notes: >-
      Operating metrics attributed to the October 2024 release remain company claims; valuation history and market
      activity are reported by independent data platforms.
    claimRefs:
      - CV003
      - CV005
      - CV006
      - CV007
      - CV009
      - CV010
      - CV015
      - CV016
  - id: TV003
    title: Bull, Base, and Bear Scenario Boundaries
    columns:
      - Scenario
      - Explicit assumptions
      - Valuation / return logic
      - Probability signal and downside trigger
    rows:
      - - Bull
        - >-
          Audited revenue and profitability validate the disclosed trajectory; enterprise growth persists; financing
          terms are plain-vanilla.
        - >-
          $3.3B-$5.0B is a third-party illustrative range based on 4x-6x revenue, not an independently verified
          transaction range.
        - >-
          Signal: audited margin durability plus a current arm's-length price; trigger: growth or cash conversion
          misses.
      - - Base
        - Scale remains intact, but current financials, liquidity, and preference terms remain unavailable.
        - $3.1B is retained only as the October 2024 financing reference; no target return is underwritten.
        - >-
          Signal: completion of financial and legal diligence; trigger: structured terms that reduce junior-equity
          proceeds.
      - - Bear
        - >-
          Multiple compression continues, liquidity remains limited, or the preference and debt stack absorbs exit
          value.
        - >-
          Below $3.1B, with no defensible public-data floor because no current Forge Price or observable transaction was
          retained.
        - >-
          Signal: weak secondary demand; triggers: down round, covenant stress, or failure to substantiate
          profitability.
    notes: >-
      Scenario ranges are deliberately bounded by retained evidence; no invented probabilities, current comparable
      multiples, or undisclosed security terms are used.
    claimRefs:
      - CV002
      - CV003
      - CV005
      - CV011
      - CV014
      - CV015
      - CV016
