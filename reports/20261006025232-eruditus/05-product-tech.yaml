callouts:
  - calloutType: "insight"
    title: "Pedagogical Orchestration Outweighs Pure Software Moat"
    body: "Eruditus's true technological strength is not a standalone proprietary LMS or foundational AI algorithm, but the software-enabled orchestration of high-touch educational delivery. Achieving an 85% course completion rate across executive demographics requires seamless synchronization between university faculty, operational mentors, student cohorts, and conversational AI tutors [CE001, CE007]."
    claimRefs:
      - "CE001"
      - "CE007"
  - calloutType: "risk"
    title: "Proprietary AI Implementation Risks and Verification Gaps"
    body: "While Eruditus has earmarked its $150M Series F capital toward generative AI learning products, independent benchmarks regarding tutor accuracy, hallucination containment in rigorous business/technical domains, and student retention lift remain unpublished [CE003, CE007, CE010]. Differentiating true proprietary pedagogical AI from standard commercial LLM wrappers is a primary technical diligence requirement [CE007, CE010]."
    claimRefs:
      - "CE003"
      - "CE007"
      - "CE010"
