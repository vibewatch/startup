    {
      "id": "architecture-dependencies-and-delivery-model",
      "title": "Architecture, dependencies, and delivery model",
      "body": "The technical architecture described in public sources is a workflow-and-orchestration layer. LibTV’s clearest differentiator is its infinite canvas plus node-based workflow, which turns scriptwriting, shot design, model calls, and editing into a structured production graph instead of a chat interaction. That is a genuine product-architecture choice, and it aligns with the needs of teams producing repeat video output. The same pattern appears elsewhere in the product family: API pages emphasize custom model access and commercial rights, model-upload and pretraining pages emphasize creator supply, and Lovart/Xingliu materials emphasize agent-assisted design delivery. The dependency profile is equally important. Public sources repeatedly suggest that the company integrates multiple upstream models rather than owning every core generation engine itself. That speeds time to market and broadens capability coverage, but it also means the product stack must constantly defend its value above the model layer. From a diligence perspective, this public evidence is directional rather than fully institutional-grade. It shows how the company is positioning itself and where demand is visible, but it still leaves material unanswered questions around conversion quality, retention, governance, unit economics, and the durability of any apparent moat once private diligence data is introduced. The underwriting implication is that each public signal still needs private validation against cohort, margin, and control data.",
