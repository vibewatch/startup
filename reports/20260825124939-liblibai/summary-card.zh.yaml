  topStrengths:
    - 作为一家年轻的 AI 应用公司，商业体量已有公开证据支撑，包括 ARR、用户和融资信号。
    - 图像、视频、设计、社区和 API 多条工作流铺开，多产品宽度带来真实的平台选择权。
    - LibTV 的客户采用证据扎实，加上广泛创作者生态，说明业务不只是新奇流量故事。
  topRisks:
    - 公开披露的留存、毛利率、烧钱速度和客户集中度仍太薄，难以支撑高确信度承销。
    - 如果上游模型厂商和竞品工作流产品缩小质量或价格差距，护城河可能变脆。
    - 中国 AI 标注、内容审核、隐私和版权义务横跨多款产品，带来实质控制和声誉风险。
    - 产品线宽、出货快，相比当前公开治理信号，执行复杂度更高。
  unresolvedGaps:
