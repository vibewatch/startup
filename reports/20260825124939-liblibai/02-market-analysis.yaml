      "id": "sizing-lenses-and-demand-signals",
      "title": "Sizing lenses and demand signals",
      "body": "The broadest third-party lens comes from Research and Markets, which sized generative AI in creative industries at $5.38 billion in 2026 and forecast $14.03 billion by 2030. That is a real category signal, but still too broad to treat as LiblibAI’s practical near-term TAM. More grounded signals come from the sub-markets that already show monetization. Sensor Tower said global short-drama app downloads exceeded 850 million in Q1 2026 with roughly $750 million of IAP revenue, while Business of Apps described a 2025 ecosystem with over 700 monthly active micro-drama app advertisers and creative volume per advertiser up 144.9% year over year. ThinkChina’s Caixin-backed deep dive adds a further enterprise lens: AI video is one of the few generative applications already producing visible revenue across advertising, e-commerce, and entertainment, and Douyin estimated the enterprise AI video application market could reach $36 billion by 2030. For LiblibAI, the most defensible interpretation is that the core commercial wedge is the production side of image, design, and video workflows, where marketing and content budgets already exist. From a diligence perspective, this public evidence is directional rather than fully institutional-grade. It shows how the company is positioning itself and where demand is visible, but it still leaves material unanswered questions around conversion quality, retention, governance, unit economics, and the durability of any apparent moat once private diligence data is introduced. The underwriting implication is that each public signal still needs private validation against cohort, margin, and control data.",
