      "id": "unit-economics-and-delivery-costs",
      "title": "Unit economics, delivery costs, and cost-structure inference",
      "body": "The core economic debate is whether LiblibAI is building software-like margins or simply repackaging expensive upstream model capacity. The adverse 36Kr analysis argues that AI aggregators can be squeezed on price, queue time, and model quality if upstream vendors improve or cut prices. That is the right skepticism to apply. At the same time, the company’s business model is broader than raw generation resale. Community distribution, model libraries, workflow orchestration, and team collaboration can all support software-style value capture if they meaningfully improve throughput or retention. Benchmark filings from Adobe, Autodesk, Duolingo, and C3 AI do not make LiblibAI directly comparable, but they do show what investors reward: durable revenue growth paired with visible gross-margin structure, operating leverage, and enough differentiation that compute or content costs do not consume the business. Public evidence today proves strong demand and monetization, but not yet a verified margin profile. From a diligence perspective, this public evidence is directional rather than fully institutional-grade. It shows how the company is positioning itself and where demand is visible, but it still leaves material unanswered questions around conversion quality, retention, governance, unit economics, and the durability of any apparent moat once private diligence data is introduced. The underwriting implication is that each public signal still needs private validation against cohort, margin, and control data.",
