  "chapter": {
    "number": 4,
    "title": "Financials",
    "summary": "LiblibAI already shows unusually strong public monetization signals for a young AI application company, but the public record still lacks the audited detail needed to underwrite margin durability or cash runway with confidence. The business appears to monetize through memberships, API usage, workflow subscriptions, and enterprise-style video collaboration, while the June 2026 financing implies the company is still prioritizing scale and product breadth over transparent profitability. Financial diligence therefore hinges less on whether revenue exists and more on whether that revenue is repeatable, high-margin, and capital-efficient once subsidies, model costs, and sales incentives are normalized."
  },
  "sections": [
    {
      "id": "revenue-model-and-monetization",
      "title": "Revenue model, monetization surfaces, and pricing logic",
      "body": "The public record is clear that LiblibAI is no longer a pure traffic story. Its official API page shows direct monetization through point-based plans, commercial rights, and custom quotas. The VIP page adds recurring consumer-like subscription logic through memberships and bundled points. LibTV and Xingliu broaden that into workflow spending, where teams are paying not just for generation but for a production environment. Media coverage of the B and B+ rounds reinforces the same point: investors are underwriting a product family that monetizes creators, professional teams, and developers simultaneously. That matters because a multi-surface revenue stack is usually higher quality than one-off consumer novelty revenue. The main open question is mix. Public sources still do not disclose how much of ARR comes from membership, API, video teams, design-agent usage, or large custom deals, so the quality of the top line remains only partially visible. From a diligence perspective, this public evidence is directional rather than fully institutional-grade. It shows how the company is positioning itself and where demand is visible, but it still leaves material unanswered questions around conversion quality, retention, governance, unit economics, and the durability of any apparent moat once private diligence data is introduced. The underwriting implication is that each public signal still needs private validation against cohort, margin, and control data.",
