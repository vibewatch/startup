  topStrengths:
    - Real commercial scale for a young AI application company, including public ARR, user, and fundraising signals.
    - Multi-product workflow breadth across image, video, design, community, and API surfaces creates genuine platform optionality.
    - Strong customer-adoption evidence for LibTV and a broad creator ecosystem suggest the business is more than a novelty traffic story.
  topRisks:
    - Public retention, gross-margin, burn, and customer-concentration disclosure remain too thin for high-conviction underwriting.
    - The moat may be vulnerable if upstream model vendors and rival workflow products narrow the quality or price gap.
    - China AI labeling, moderation, privacy, and copyright obligations create meaningful control and reputational risk across multiple products.
    - Product breadth and rapid shipping increase execution complexity relative to the current public governance signal.
  unresolvedGaps:
    - A full KPI pack is still needed to confirm NRR/GRR, gross margin, contribution margin, burn, and runway.
    - The reviewed public record still does not disclose a reconciled cap table, investor rights package, or current board structure.
    - Customer quality remains underproven without top-account exposure, ACV, seat counts, and logo-level reference calls.
    - Supplier concentration, model-routing logic, and trust-and-safety control maturity need private diligence evidence.
