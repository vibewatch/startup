  "chapter": {
    "number": 1,
    "title": "Company Overview",
    "summary": "LiblibAI is the flagship product inside Beijing-based Evoken, a 2023-founded creative-AI platform builder that has scaled quickly across image, video, and design workflows. Public reporting and company policy documents support real user scale, aggressive fundraising, and a widening product matrix, but governance visibility, audited financial detail, and durability beyond upstream model aggregation remain limited. The company already qualifies as a unicorn, yet the public record still looks more like a fast-moving operating story than a fully disclosed institutional-grade company profile."
  },
  "sections": [
    {
      "id": "identity-and-operating-scope",
      "title": "Identity, product stack, and operating scope",
      "body": "LiblibAI should be understood as a platform company rather than a single image generator. The current public record ties the image community, the LibTV video workspace, and the Xingliu design agent together under the same Beijing operator, Beijing Evoken Technology, through updated user-agreement and privacy-policy language. That matters because it means the company is already trying to unify account, content, and API surfaces across creator, team, and developer workflows rather than running isolated point products. The product evidence is consistent with that framing. LiblibAI markets an image-creation community, a model and LoRA ecosystem, creator points and memberships, and a commercial API. LibTV extends the stack into professional video creation, while Xingliu positions itself as a design agent. The strategic through-line is workflow aggregation: image assets, model training, video production, and design delivery all live inside one ecosystem. This gives later chapters a clean ground truth: Evoken is building creative-AI infrastructure with community distribution at the top and monetized tools beneath it. From a diligence perspective, this public evidence is directional rather than fully institutional-grade. It shows how the company is positioning itself and where demand is visible, but it still leaves material unanswered questions around conversion quality, retention, governance, unit economics, and the durability of any apparent moat once private diligence data is introduced. The underwriting implication is that each public signal still needs private validation against cohort, margin, and control data.",
