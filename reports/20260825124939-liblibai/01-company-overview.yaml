    {
      "id": "milestones-governance-and-frictions",
      "title": "Milestones, governance opacity, and early frictions",
      "body": "The milestone path is unusually compressed. Public sources describe angel financing only months after formation, a 2025 Series B, a 2026 B+ unicorn round, a 2.0 product upgrade, the launch of Xingliu, and the March 2026 launch of LibTV. That speed is a strength, but it also creates diligence asymmetry. The company publishes operational policies and product surfaces, yet the public record still does not reveal a reconciled board roster, verified headcount, detailed ownership structure, or audited financial package. In addition, the risk picture is not hypothetical. China’s AI-labeling rules now apply to image and video platforms, and critical reporting has already highlighted moderation gaps and the possibility that LiblibAI’s aggregation-led model remains structurally vulnerable if upstream models reduce price or offer better native workflows. The company overview therefore supports a balanced conclusion: LiblibAI is real, large, and fast-growing, but still public-data-light relative to the valuation and strategic ambition it now carries. From a diligence perspective, this public evidence is directional rather than fully institutional-grade. It shows how the company is positioning itself and where demand is visible, but it still leaves material unanswered questions around conversion quality, retention, governance, unit economics, and the durability of any apparent moat once private diligence data is introduced. The underwriting implication is that each public signal still needs private validation against cohort, margin, and control data.",
