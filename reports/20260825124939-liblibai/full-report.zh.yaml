  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险排序
        blocks:
          - type: paragraph
            body: >-
              第一类风险是监管和法律风险，因为 LiblibAI 直接经营合成图像和视频分发。中国 AI
              生成内容标识规则，以及更深层的深度合成框架，把标识、出处、审核、隐私和平台治理变成产品层义务。这不是打勾合规：一家大规模分发创意资产和 AI
              视频的公司，一旦标识缺失、内容控制薄弱或版权材料处理不当，就可能遭遇声誉损害、执法风险或客户信任侵蚀。已审阅政策和法律分析来源在方向上都认为，生成方和分发方均有义务。公司公开政策显示 LiblibAI
              意识到平台治理，但意识到不等于控制成熟度已经被证明。因此，法律风险理论上可管理，但前提是运营控制能跟上产品宽度和用量增长。尽调视角下，公开证据只能提供方向，还不到机构级完整材料。它能说明公司如何定位、需求在哪里显现，但转化质量、留存、治理、单位经济，以及引入私有尽调数据后表观护城河能否持久，仍有重大问题未解。投资判断上，每个公开信号都还需要用队列、毛利率和控制数据私下验证。
