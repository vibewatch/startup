          label: 模型供给工具
          description: 模型上传和预训练入口扩展可复用能力。
        - id: orchestration
          label: 工作流编排
          description: LibTV、Xingliu 和核心创作流程把工作结构化。
        - id: api
          label: API 与商业层
          description: 程序化访问和定制配额变现下游使用。
        - id: governance
          label: 政策与合规层
          description: 条款、隐私和标识义务约束使用。
      edges:
        - from: community
          to: orchestration
        - from: supply
          to: orchestration
        - from: orchestration
          to: api
        - from: community
          to: api
        - from: governance
          to: community
        - from: governance
          to: orchestration
    claimRefs:
      - CE001
      - CE002
      - CE009
      - CE010
      - CE013
      - CE019
  - id: FE002
    title: 客户工作流 / 运营流程
    type: flow
    layout: wide
    summary: 产品栈在图像、设计和视频工作流中串起发现、生成、结构化和导出。
    data:
      nodes:
        - id: discover
          label: 发现
          description: 用户通过社区模型、提示词或示例进入。
        - id: generate
          label: 生成
          description: 创建图像、素材或模型输出。
        - id: structure
          label: 结构化工作流
          description: 基于节点或智能体驱动的工具把步骤组织成可重复工作流。
        - id: collaborate
          label: 协作或集成
          description: 团队共享画布，开发者调用 API。
        - id: commercialize
          label: 商业化
          description: 输出转成营销素材、视频或嵌入式产品功能。
      edges:
        - from: discover
          to: generate
        - from: generate
          to: structure
        - from: structure
          to: collaborate
        - from: collaborate
          to: commercialize
    claimRefs:
      - CE003
      - CE004
      - CE005
      - CE007
      - CE008
      - CE011
      - CE012
  - id: FE003
    title: 关键依赖图
    type: dag
    layout: wide
    summary: 产品表现取决于外部模型、创作者供给、合规处理和工作流 UX 是否都能撑住。
    data:
      nodes:
        - id: upstream
          label: 上游模型访问
          description: 能力广度往往来自集成的外部模型。
        - id: creators
          label: 创作者供给
          description: 模型上传、提示词和素材维持社区效用。
        - id: ux
          label: 工作流 UX
          description: 基于节点、智能体和 API 的流程必须保持可用且可靠。
        - id: compliance
          label: 合规控制
          description: 标识、审核和隐私义务决定可部署性。
        - id: retention
          label: 留存结果
          description: 任何一项依赖转弱，用户都可以转向多平台并用。
      edges:
        - from: upstream
          to: ux
        - from: creators
          to: ux
        - from: compliance
          to: ux
        - from: ux
          to: retention
    claimRefs:
      - CE014
      - CE015
      - CE016
      - CE017
      - CE020
      - CE021
      - CE024
  - id: FE004
    title: 产品成熟度 / 能力图
    type: matrix
    layout: wide
    summary: 能力广度在编排和工作流覆盖上最强，在企业保障和自有模型深度上证据较弱。
    data:
      columns:
