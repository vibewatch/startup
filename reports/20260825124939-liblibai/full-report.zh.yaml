        - 设计 / 工程领域的高端工作流软件倍数
        - 有助于判断耐久专业工作流价值
      - - Duolingo
        - 消费者 / 准专业消费者订阅软件
        - 大用户基数转化为盈利性订阅增长
        - 有助于观察规模化转化经济性
      - - C3 AI
        - AI 原生应用软件
        - AI 纯标的，增长 / 利润率争论可见
        - 有助于框定 AI 应用估值
      - - Pinterest
        - 大规模视觉发现平台
        - 展示用户规模叠加变现如何在公开市场定价
        - 有助于理解受众 + 变现的背景
      - - Unity / Shutterstock
        - 创作者或媒体相邻工作流可比公司
        - 显示软件 / 创作者工具在利润率或叙事不同情况下的估值位置
        - 帮助约束下行情景判断
