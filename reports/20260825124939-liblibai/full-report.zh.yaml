      - number: '1.3'
        title: 里程碑、治理不透明与早期摩擦
        blocks:
          - type: paragraph
            body: >-
              里程碑推进异常压缩。公开来源描述公司成立数月后获得天使融资，随后完成 2025 年 Series B、2026 年 B+ 独角兽轮、2.0 产品升级、Xingliu 发布，以及 2026 年 3 月 LibTV
              上线。速度是优势，也制造尽调不对称。公司公布运营政策和产品界面，但公开记录仍没有给出可核对的董事会名单、经验证员工数、详细股权结构或审计财务包。风险也不是假设。中国 AI
              标识规则已经覆盖图像和视频平台，批判性报道也指出内容审核缺口，并提示如果上游模型降价或提供更好的原生工作流，LiblibAI 以聚合为主的模式可能存在结构性脆弱。公司概况因此导向一个平衡结论：LiblibAI
              真实、体量大、增长快，但相对于现在承载的估值和战略野心，公开数据仍偏少。尽调视角下，公开证据只能提供方向，还不到机构级完整材料。它能说明公司如何定位、需求在哪里显现，但转化质量、留存、治理、单位经济，以及引入私有尽调数据后表观护城河能否持久，仍有重大问题未解。投资判断上，每个公开信号都还需要用队列、毛利率和控制数据私下验证。
