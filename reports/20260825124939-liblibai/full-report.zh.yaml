      - number: '8.4'
        title: 图表
        blocks:
          - type: callout
            title: 估值与建议要点
            body: >-
              公开证据支持把 LiblibAI 视为一家真实、高增长的 AI 应用领导者，而不是投机性的收入前故事，但还不能充分证明当前 $2B+ 估值便宜。以公开的 $300M ARR 运行率计算，最新一轮约 6-7x
              ARR
              的估值高于广义公开软件中位数；但如果客户韧性、毛利率和工作流护城河强于公开材料目前能证明的程度，估值仍可辩护。因此，可投资立场是正面但价格要有纪律：若私有尽调确认留存和利润率质量，资产有吸引力；若业务主要只是薄编排层且重度依赖外部模型，吸引力下降。
