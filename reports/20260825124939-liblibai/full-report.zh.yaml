  - id: FR001
    title: 风险热力图
    type: quadrant
    layout: wide
    summary: 最严重的风险集中在监管、依赖和经济不透明，而不是简单需求创造。
    data:
      points:
        - label: 标识 / 合规
          x: 8
          'y': 9
          detail: 如果控制薄弱，发生概率和影响都高
        - label: 上游模型挤压
          x: 7
          'y': 8
          detail: 价格和质量一旦重置，护城河会很快被压缩
        - label: 可靠性 / 工作流宕机
          x: 6
          'y': 7
          detail: 可靠性下滑时，专业工作流会迅速失效
        - label: 客户留存不透明
          x: 7
          'y': 7
          detail: 流量强度可能高估长期价值
        - label: 治理披露缺口
          x: 5
          'y': 7
          detail: 限制信心，但可通过尽调修补
        - label: 产品线摊子过宽
          x: 6
          'y': 8
          detail: 入口太多会稀释焦点
      xAxis: 可能性
      yAxis: 影响
    claimRefs:
      - CR001
      - CR003
      - CR015
      - CR023
      - CR029
      - CR031
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 若干风险会彼此叠加：供应商依赖、内容治理和留存都可能相互作用。
    data:
      nodes:
        - id: supplier
          label: 供应商依赖
          description: 外部模型质量或价格变化。
        - id: quality
          label: 工作流质量
          description: 延迟、输出一致性和生产可用性。
        - id: compliance
          label: 合规负担
          description: 标识、审核、隐私、版权。
        - id: retention
          label: 留存压力
          description: 价值转弱时，用户会多平台并用。
        - id: economics
          label: 经济压力
          description: 成本上升或留存下降时，利润率和烧钱速度都会恶化。
      edges:
        - from: supplier
          to: quality
        - from: compliance
          to: quality
        - from: quality
          to: retention
        - from: supplier
          to: economics
        - from: retention
          to: economics
    claimRefs:
      - CR016
      - CR017
      - CR018
      - CR023
      - CR024
      - CR033
      - CR035
  - id: FR003
    title: 依赖图
    type: dag
    layout: wide
    summary: LiblibAI 需要政策、创作者供给、模型访问和工作流执行持续对齐。
    data:
      nodes:
        - id: policy
          label: 政策环境
          description: 中国 AI 规则塑造可接受的运营边界。
        - id: models
          label: 模型访问
          description: 能力广度部分来自上游引擎。
        - id: community
          label: 创作者社区
          description: 模型、素材和流量支撑生态。
        - id: team
          label: 专业团队用户
          description: 更高价值账户需要可靠工作流。
        - id: capital
          label: 资本基础
          description: 新融资买来时间，但不保证经济模型成立。
      edges:
        - from: policy
          to: team
        - from: models
          to: team
        - from: community
          to: team
        - from: team
          to: capital
        - from: models
          to: capital
    claimRefs:
      - CR025
      - CR026
      - CR027
      - CR030
      - CR036
      - CR037
      - CR039
  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: wide
    summary: 推荐取决于强增长和广覆盖能否转化为持久经济模型和控制能力。
    data:
      nodes:
        - id: scale
          label: 规模真实
          description: 用户、年经常性收入（ARR）和融资规模已经有意义。
        - id: breadth
          label: 工作流广度
          description: 图像、API、设计和视频四条线，给上行空间留出选择权。
        - id: quality
          label: 质量未知
          description: 留存、毛利率和控制成熟度仍披露不足。
        - id: valuation
          label: 估值纪律
          description: 要支撑偏满但可辩护的倍数，必须拿到高质量私有数据。
        - id: decision
          label: 选择性推进
          description: 深入尽调有必要，盲目确信没有依据。
      edges:
        - from: scale
          to: breadth
        - from: breadth
          to: quality
        - from: quality
          to: valuation
        - from: valuation
          to: decision
    claimRefs:
      - CV001
      - CV004
      - CV007
      - CV010
      - CV013
      - CV027
  - id: FV002
    title: 估值敏感性
    type: matrix
    layout: wide
    summary: 私有市场估值结果最受留存质量和毛利率能否守住影响。
    data:
      columns:
        - 低留存
        - 中等留存
        - 高留存
      rows:
        - label: 低毛利率
          values:
