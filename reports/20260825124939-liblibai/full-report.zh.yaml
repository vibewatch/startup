      - number: '2.3'
        title: 采用驱动、切换摩擦与约束
        blocks:
          - type: paragraph
            body: >-
              仅靠市场增长不能保证 LiblibAI 抓住需求。最强采用驱动是创意效率提升、相较传统工作室流程更便宜的迭代，以及把原本割裂的工具压缩进一个工作流。LiblibAI 自身产品界面也强化这一逻辑：点数制 API
              访问、会员、共享账号体系和创作者社区发现。约束同样清晰。中国标识规则和更广泛监管预期，要求每个图像和视频平台持续做审核和元数据工作。版权和安全议题已经塑造行业，AI
              视频尤其如此。竞争压力也高，因为买方可以多栖。Civitai 等社区在模型和发现上竞争；Adobe Firefly、Canva、Runway、Kling
              以及上游模型供应商则在工作流质量、品牌信任或直接生成上竞争。实际市场结论是，LiblibAI
              面前有一个大且扩张的需求池，但近期可触达市场只限于这样一部分：工作流集成、中国创作者密度和性价比强到足以抵消监管负担与低切换门槛。尽调视角下，公开证据只能提供方向，还不到机构级完整材料。它能说明公司如何定位、需求在哪里显现，但转化质量、留存、治理、单位经济，以及引入私有尽调数据后表观护城河能否持久，仍有重大问题未解。投资判断上，每个公开信号都还需要用队列、毛利率和控制数据私下验证。
