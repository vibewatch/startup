  - id: FU004
    title: 留存 / 重复队列
    type: kpi
    layout: standard
    summary: 公开记录证明了广度和增长，但核心留存指标仍未披露。
    data:
      items:
        - label: 用户广度
          value: 30M+
          detail: 漏斗顶部创作者触达面大
          tone: positive
        - label: 服务的专业团队
          value: ~1,000
          detail: 有意义的工作流采用信号
          tone: positive
        - label: 企业客户
          value: 300+
          detail: Team Edition 将部分账户从试用转成更深使用
          tone: positive
        - label: 公开净留存率（NRR）/ 流失披露
