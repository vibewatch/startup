chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品栈与经营范围
        blocks:
          - type: paragraph
            body: >-
              LiblibAI 不能只看作单一图像生成器，而应看作平台公司。最新用户协议和隐私政策把图像社区、LibTV 视频工作台、Xingliu 设计智能体都放在同一个北京运营主体 Beijing Evoken
              Technology 之下。关键在于，公司不是经营彼此割裂的点状产品，而是在创作者、团队和开发者工作流之间统一账号、内容和 API 触点。产品证据也支撑这一判断：LiblibAI 对外销售图像创作社区、模型与
              LoRA 生态、创作者点数和会员，以及商业 API；LibTV 把产品栈延伸到专业视频创作，Xingliu
              则定位为设计智能体。主线是工作流聚合——图像资产、模型训练、视频生产、设计交付都被收进一个生态。后续章节可以据此建立一个清楚事实底座：Evoken 正在搭建创意 AI
              基础设施，上层靠社区分发，下层用工具变现。尽调视角下，公开证据只能提供方向，还不到机构级完整材料。它能说明公司如何定位、需求在哪里显现，但转化质量、留存、治理、单位经济，以及引入私有尽调数据后表观护城河能否持久，仍有重大问题未解。投资判断上，每个公开信号都还需要用队列、毛利率和控制数据私下验证。
