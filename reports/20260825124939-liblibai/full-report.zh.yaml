  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与买方地图
        blocks:
          - type: paragraph
            body: >-
              LiblibAI 最窄且有用的市场定义不是“所有生成式 AI”，而是与视觉内容创作工作流有关、可通过社区、软件或 API 访问变现的支出。它包括创作者图像生成、专业 AI 视频生产、AI
              辅助设计、模型训练或分享，以及团队把创意生成嵌入下游产品时产生的相邻开发者用量。市场口径应排除纯基础模型训练经济，以及大多数横向办公 AI
              支出。需求侧至少有四个可见买方群：个人创作者用图像和模型工具做构思与生产；专业视频团队和短剧工作室用 LibTV 跑高产出工作流；设计师和代理机构使用 Xingliu 或 Lovart
              式设计智能体；开发者和自动化团队以编程方式消耗图像 API 和模型资产。预算归属、留存逻辑和付费意愿在这些群体之间差异很大，因此 LiblibAI
              的市场是多细分、受工作流约束的市场，不是单一创作者软件桶。尽调视角下，公开证据只能提供方向，还不到机构级完整材料。它能说明公司如何定位、需求在哪里显现，但转化质量、留存、治理、单位经济，以及引入私有尽调数据后表观护城河能否持久，仍有重大问题未解。投资判断上，每个公开信号都还需要用队列、毛利率和控制数据私下验证。
