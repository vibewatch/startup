      - number: '2.2'
        title: 规模测算视角与需求信号
        blocks:
          - type: paragraph
            body: >-
              最宽的第三方视角来自 Research and Markets：其估算创意行业生成式 AI 市场 2026 年为 $5.38 billion，2030 年可达 $14.03
              billion。这是明确品类信号，但仍过宽，不能当作 LiblibAI 近期可操作 TAM。更扎实的信号来自已经显示变现的子市场。Sensor Tower 称，2026 年 Q1 全球短剧应用下载超过 850
              million，IAP 收入约 $750 million；Business of Apps 描述的 2025 年生态中，月活微短剧应用广告主超过 700 个，单广告主创意量同比增长
              144.9%。ThinkChina 基于 Caixin 的深度拆解又补充了企业端视角：AI 视频是少数已经在广告、电商和娱乐中产生可见收入的生成式应用之一，Douyin 估计企业 AI 视频应用市场到 2030
              年可达 $36 billion。对 LiblibAI
              而言，最稳妥的解读是，核心商业切口在图像、设计和视频工作流的生产侧，因为营销和内容预算已经存在。尽调视角下，公开证据只能提供方向，还不到机构级完整材料。它能说明公司如何定位、需求在哪里显现，但转化质量、留存、治理、单位经济，以及引入私有尽调数据后表观护城河能否持久，仍有重大问题未解。投资判断上，每个公开信号都还需要用队列、毛利率和控制数据私下验证。
