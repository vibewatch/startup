              视频品牌资产；Civitai 拥有强模型社区身份；中国视频领导者也在强商业化压力下快速推进。因此，LiblibAI
              看起来有差异化，但尚未被保护起来。竞争维度的投资判断应是：公司有走向平台地位的可信路径，但仍处在一个用户会因为价格、质量或排队时间变化而随时换工具的品类。尽调视角下，公开证据只能提供方向，还不到机构级完整材料。它能说明公司如何定位、需求在哪里显现，但转化质量、留存、治理、单位经济，以及引入私有尽调数据后表观护城河能否持久，仍有重大问题未解。投资判断上，每个公开信号都还需要用队列、毛利率和控制数据私下验证。
