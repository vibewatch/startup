        title: 客户分层与采用轨迹
        blocks:
          - type: paragraph
            body: >-
              公开证据显示，LiblibAI 服务的是几层不同客户，而不是单一用户群。最宽的一层是围绕图像生成、prompt / 模型发现和会员的创作者社区。第二层是通过 API
              集成创意生成的开发者。第三层是设计用户，Xingliu 和品牌风格工作流暗示团队或商业用量。现在商业上最重要的一层可能是 LibTV
              的专业买方——短剧工作室、影视团队、广告代理和品牌客户——因为这个群体更接近工作流预算，而不是兴趣实验。对这样年轻的公司来说，公开采用信号异常强：累计用户 30 million、原创模型超过
              500,000、Xingliu 用户超过 10 million、LibTV 上线当天访问超过 100,000、服务近 1,000 个专业团队，以及 Team Edition 企业客户超过 300
              个。这些不是完美客户质量指标，但清楚指向多个队列中的真实需求。尽调视角下，公开证据只能提供方向，还不到机构级完整材料。它能说明公司如何定位、需求在哪里显现，但转化质量、留存、治理、单位经济，以及引入私有尽调数据后表观护城河能否持久，仍有重大问题未解。投资判断上，每个公开信号都还需要用队列、毛利率和控制数据私下验证。
