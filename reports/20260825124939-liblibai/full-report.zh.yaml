      - number: '1.2'
        title: 创始人锚点、投资人基础与公开规模信号
        blocks:
          - type: paragraph
            body: >-
              Chen Mian 是公开记录中最清晰的创始人锚点。多篇独立报道把他与 ByteDance 联系起来，尤其是 Jianying/CapCut 商业化体系，并将 2023 年 5 月呈现为
              LiblibAI/Evoken 的实际成立窗口。这个创始人画像重要，因为对一家成立 2–3 年的应用公司而言，投资人阵容异常强。2025 年 Series B 被称为当年中国 AI 应用领域最大单笔融资；2026
              年 6 月 B+ 轮由 Granite Asia、Tencent、Shunwei 联合领投，把投后估值推到 $2 billion 以上。公开规模说法也足够大：LiblibAI 累计用户超过 30
              million、原创模型超过 500,000、Xingliu 用户超过 10 million、近 1,000 个专业团队使用 LibTV。这些数字大多仍是公司披露，而非经审计运营
              KPI；但合在一起，足以支撑一个判断：LiblibAI
              已从小众工具跨到广泛创作者平台，并具备有意义的商业触达。尽调视角下，公开证据只能提供方向，还不到机构级完整材料。它能说明公司如何定位、需求在哪里显现，但转化质量、留存、治理、单位经济，以及引入私有尽调数据后表观护城河能否持久，仍有重大问题未解。投资判断上，每个公开信号都还需要用队列、毛利率和控制数据私下验证。
