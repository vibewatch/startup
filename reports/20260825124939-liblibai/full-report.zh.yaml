  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 直接对手、存量巨头与相邻竞争者
        blocks:
          - type: paragraph
            body: >-
              LiblibAI 的直接竞争不是从所有前沿模型公司开始，而是从创意社区和创作者工具开始。Civitai 是最清晰的全球社区类比，因为它把模型、图像、视频和创作者组织在同一处。Midjourney
              虽然协作模式不同，但在图像质量和创作者心智上竞争。Adobe Firefly 和 Canva 从反方向切入：先拥有工作流信任、既有设计行为和品牌关系，再把 AI 生成折进去。Runway 和 Kling
              重要，是因为它们设定了 AI 视频速度，LibTV 正试图在这一市场从演示吸引力走向真实生产使用。这个格局重要，因为 LiblibAI
              想同时打赢多个战场：创作者社区、图像工具、视频工作流和设计智能体体验。广度是战略机会，也意味着公司很少面对单一且薄弱或碎片化的对手群。尽调视角下，公开证据只能提供方向，还不到机构级完整材料。它能说明公司如何定位、需求在哪里显现，但转化质量、留存、治理、单位经济，以及引入私有尽调数据后表观护城河能否持久，仍有重大问题未解。投资判断上，每个公开信号都还需要用队列、毛利率和控制数据私下验证。
