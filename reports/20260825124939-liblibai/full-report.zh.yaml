  - id: TV005
    title: 投资逻辑失效和否决触发点表
    columns:
      - 触发点
      - 为什么会打破投资逻辑
      - 监测需要
    rows:
      - - NRR 弱 / 流失率高
        - 流量无法转化为持久价值
        - 队列和续约数据
      - - 毛利率低
        - 意味着薄弱的转手经济性
        - 产品级 COGS 拆解
      - - 供应商集中度冲击
        - 暴露护城河弱点和毛利率风险
        - 模型 / 供应商依赖地图
      - - 监管 / 控制失效
        - 伤害信任，拖慢采用
        - 审核和标识证据
      - - 头部客户集中
        - 让增长变脆弱
        - 客户集中度明细
    notes: 只有这些触发点保持受控，这笔投资才成立。
