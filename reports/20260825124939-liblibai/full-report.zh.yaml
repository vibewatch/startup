            body: >-
              这里的竞争动态由低切换成本塑造。Runway 公布多层创作者定价，并把自己定位为具有广泛创作者和企业触达的 AI 视频品牌。OpenAI
              销售商务席位和企业计划，对能接受横向工具的团队来说，它可能成为预算替代品。Adobe 和 Canva 依靠熟悉工作流、分发和品牌信任守住设计预算。Civitai
              靠社区和发现竞争，而不是企业级精致度。LiblibAI 的优势是能把社区、模型库存和工作流效用混在一个产品家族里；弱点是买方可以在这些工具之间多栖，尤其当上游模型供应商快速改进时。36Kr 的“AI
              中间商”批评抓住了核心风险：如果最好的模型质量和最佳 UX
