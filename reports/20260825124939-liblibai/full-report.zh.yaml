      - CV015
      - CV016
      - CV031
      - CV032
      - CV033
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 以最新融资估值为锚，公开证据只能支持一个较宽但有边界的估值范围。
    data:
      items:
        - label: 悲观
          low: 1
          mid: 1.25
          high: 1.5
          unit: USDbn
        - label: 基准
          low: 1.8
          mid: 2.15
          high: 2.5
          unit: USDbn
        - label: 乐观
          low: 3
          mid: 3.5
          high: 4
          unit: USDbn
        - label: 最新一轮融资锚点
          low: 2
          mid: 2
          high: 2
          unit: USDbn+
    claimRefs:
      - CV017
      - CV018
      - CV019
      - CV020
      - CV021
      - CV022
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 增长、留存和毛利率在私下尽调中都守得住，本轮价格才最容易辩护。
    data:
      items:
        - label: 公开 ARR 锚点
          value: ~$300M
          detail: 公司披露的 2026 年 5 月 ARR
          tone: positive
        - label: 最新一轮估值
          value: '>$2B'
          detail: 2026 年 6 月 B+ 轮锚点
          tone: positive
        - label: 隐含 ARR 倍数
          value: ~6.7x
          detail: 基于公开 ARR 和 $2B 估值下限
          tone: warning
        - label: 公开留存披露
          value: none
          detail: 估值剩余盲点中最大的一项
          tone: warning
    claimRefs:
      - CV023
      - CV024
      - CV025
      - CV026
      - CV034
      - CV035
      - CV040
