  - id: FU001
    title: 客户旅程图
    type: flow
    layout: wide
    summary: LiblibAI 尝试把用户从发现推进到付费、协作或嵌入式工作流。
    data:
      nodes:
        - id: discover
          label: 发现
          description: 用户通过社区模型、提示词或示例到达。
        - id: trial
          label: 试用
          description: 免费创作或探索性使用验证基础产品价值。
        - id: pay
          label: 付费
          description: 会员、API 点数或团队产品把使用转成支出。
        - id: expand
          label: 扩张
          description: 用户进入视频、设计、API 或协作工作流。
        - id: retain
          label: 留存
          description: 重复生产和素材复用决定持久性。
      edges:
