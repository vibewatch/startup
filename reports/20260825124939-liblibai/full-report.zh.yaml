    title: 最终尽调要求表
    columns:
      - 要求
      - 重要性
      - 决策用途
    rows:
      - - 按产品拆分的 NRR / GRR / 流失率
        - 判断客户质量
        - 可确认或推翻乐观 / 基准情景
      - - 毛利率和贡献毛利
        - 判断收入是否像软件
        - 情景区间必须使用
      - - 烧钱速度、现金、现金跑道
        - 判断融资风险
        - 用于评估下行韧性
      - - 供应商和模型依赖地图
        - 检验护城河耐久性
        - 用于评估竞争暴露
      - - 头部客户暴露和 logo 背书
        - 检验集中度和证明质量
        - 用于提高推荐置信度
    notes: 这些要求应能解决推荐结论背后最大的缺口。
