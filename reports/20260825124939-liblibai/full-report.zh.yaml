    rows:
      - - 工作流压缩
        - 驱动
        - LiblibAI 覆盖社区、API、设计和视频工作流
        - 能减少工具切换的平台，可以比单点生成器拿到更大预算。
      - - 短剧商业化
        - 驱动
        - Sensor Tower 和 Business of Apps 显示下载、支出和广告活动已经形成规模
        - LibTV 可以接入一个已经商业化的需求池，而不是等待用户行为形成。
      - - 模型供给充沛
        - 驱动
        - Civitai、Midjourney、Kling 以及上游模型激增，扩大了用户认知
        - 更大的生态会拓宽品类采用和创意实验。
      - - 标识与合规规则
        - 约束
        - CAC 规则要求对生成内容做显式和隐式标识
        - LiblibAI 扩大图像和视频分发后，运营负担上升。
      - - 容易多平台并用
        - 约束
        - 创作者能以低切换成本测试多个图像和视频平台
        - 留存取决于工作流优势，而不只是原始生成质量。
      - - 上游定价权
        - 约束
