        blocks:
          - type: paragraph
            body: >-
              最强护城河候选不是自有模型所有权，而是生态密度。LiblibAI 拥有中国创作者基础、大型模型库、跨产品共享账号结构，并有证据显示它正在延伸到团队和 API
