companyProfile:
  summary: >-
    LiblibAI 是北京 Evoken 旗下旗舰产品，Evoken 是一家围绕创始人 Chen Mian 于 2023 年 5 月成立的创意 AI 平台公司。公司如今覆盖创作者 / 模型社区、VIP 会员、开发者 API、用于 AI
    视频生产的 LibTV，以及面向设计智能体工作流的 Xingliu。公开报道显示，LiblibAI 累计用户超过 30 million，原创模型超过 500,000，截至 2026 年 5 月年经常性收入（ARR）约 $300
    million，2026 年 6 月 B+ 轮融资接近 $300 million，估值超过 $2 billion。它由此成为中国商业可信度较高的 AI 应用公司之一；但公开披露中的毛利率、留存、现金、治理和依赖集中度仍然很薄。
