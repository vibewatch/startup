      - number: '8.3'
        title: 建议、信心与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              正确建议应是有条件看好，而不是不加批判地同意。公开证据支持严肃尽调，并可在当前规模下证明投资兴趣合理，但不能仅靠标题做投资判断。因此，信心应为中，而不是高。相较成熟软件，风险评级应为高，因为监管、依赖和留存问题仍未解决。仅看公开证据，估值立场应描述为合理至略偏高；只有当私有尽调确认强净留存、健康毛利率、克制烧钱，以及
              LibTV 和相邻产品具备真实工作流粘性，才有上行空间。最后的尽调问题也很务实：证明留存，证明毛利，证明控制成熟度，证明最有价值账户并非轻易多平台并用。如果这些测试失败，$2B+
              轮就更像愿景估值，而不是证据充分支撑的估值。从尽调角度看，公开证据只能指方向，还不到完整机构级。它能说明公司如何定位、需求在哪里可见，但引入私有尽调数据后，转化质量、留存、治理、单位经济，以及任何表面护城河能否持久，仍有重大未解问题。投资含义是，每个公开信号仍需用队列、毛利和控制数据做私下验证。
