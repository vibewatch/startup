evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: Current board roster, board seat allocation, and governance committee structure.
    whyItMatters: >-
      A >$2B private company with multiple strategic investors should be underwritten with clearer governance visibility
      than the public record currently provides.
    diligencePath: Request an org chart, board deck summary, and capitalization/governance schedule from management.
    relatedQuestionRefs:
      - QO015
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: headcount-and-cash
    missingEvidence: Verified headcount, cash balance, burn, and runway data.
    whyItMatters: Scale, operating leverage, and financing dependency cannot be underwritten from user and ARR claims alone.
    diligencePath: Request finance KPIs, payroll count by function, and a 12-month cash bridge.
    relatedQuestionRefs:
      - QO030
  - type: conflicting-data
    severity: minor
    topic: growth-rate
    missingEvidence: A reconciled explanation of whether the 2026 revenue-growth figure should be read as >300% or >3000%.
    whyItMatters: >-
      The company’s growth narrative is strong either way, but the public messaging inconsistency weakens confidence in
      exact trajectory statements.
    diligencePath: Ask management to provide monthly revenue bridge and definition for the published growth metric.
    relatedQuestionRefs:
      - QO031
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: tam-sam-som
    missingEvidence: A company-specific disclosed breakdown of creator, team, API, and international revenue by product line.
    whyItMatters: >-
      Without segment revenue, market-fit is inferred from user and usage narratives rather than clean monetization
      cohorts.
    diligencePath: Request product-line revenue, segment ACVs, and geography mix for LiblibAI, LibTV, and Xingliu.
    relatedQuestionRefs:
      - QM016
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: Retention, churn, and cohort data by buyer segment.
    whyItMatters: Fast category growth can hide weak product durability when switching costs are low.
    diligencePath: Request cohort retention, paying-user churn, and usage-frequency data for creator, team, and API cohorts.
    relatedQuestionRefs:
      - QM028
  - type: stale
    severity: minor
    topic: global-sam
    missingEvidence: A fresher independently published China-specific creative-AI market split for image versus design versus video.
    whyItMatters: >-
      The current market picture uses broad global lenses plus short-drama demand proxies rather than a single
      China-native budget map.
    diligencePath: Look for updated China creator-software or AIGC industry surveys before a refresh.
    relatedQuestionRefs:
      - QM012
  - type: missing-source
    severity: material
    topic: win-loss-data
    missingEvidence: Documented win/loss data against Adobe, Canva, Runway, Civitai, and Chinese video competitors.
    whyItMatters: Current positioning uses product-surface inference rather than hard customer switching evidence.
    diligencePath: Ask management for customer migration stories, competitive loss reasons, and NPS by segment.
    relatedQuestionRefs:
      - QP035
  - type: private-evidence-only
    severity: material
    topic: pricing-elasticity
    missingEvidence: Historical price-change and conversion data for LibTV, memberships, and API plans.
    whyItMatters: The moat debate is inseparable from how much demand survives after pricing moves.
    diligencePath: Request price tests, discounting history, queue-time data, and contribution margins by SKU.
    relatedQuestionRefs:
      - QP014
  - type: missing-source
    severity: minor
    topic: jimeng-comparison
    missingEvidence: A reviewed direct source from Jimeng / ByteDance for like-for-like public pricing and capability comparison.
    whyItMatters: >-
      Several reports mention Jimeng as a core video benchmark, but this chapter intentionally avoided quoting
      un-fetched prices.
    diligencePath: Fetch direct Jimeng pricing or plan pages in the next refresh.
    relatedQuestionRefs:
      - QP017
  - type: private-evidence-only
    severity: material
    topic: gross-margin-and-burn
    missingEvidence: Product-level gross margin, compute cost, burn, and runway data.
    whyItMatters: Without core cost and cash metrics, ARR alone cannot prove capital efficiency.
    diligencePath: Request monthly management accounts, COGS bridge, and 12-month cash forecast.
    relatedQuestionRefs:
      - QI015
      - QI028
  - type: missing-source
    severity: material
