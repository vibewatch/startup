      "id": "operational-and-dependency-risk",
      "title": "Operational, quality, and dependency risks",
      "body": "The second risk bucket is operational and dependency risk. LiblibAI’s differentiation depends on community density, orchestration, and workflow quality, yet many underlying capabilities appear to rely on external or fast-evolving model supply. 36Kr’s “AI middleman” critique is important precisely because it frames the business as vulnerable to upstream price cuts, queue-time competition, or native product improvements by model owners. The move into AI video raises the risk further: video workflows are more compute intensive, more safety sensitive, and harder to support reliably than simple image generation. Team features, asset libraries, and collaborative canvases expand customer value but also increase the consequences of poor reliability, weak permissions, or moderation failure. Operational risk is therefore not just outage risk; it is the compound risk that supplier dependence, workflow complexity, and content governance all fail at the same moment. From a diligence perspective, this public evidence is directional rather than fully institutional-grade. It shows how the company is positioning itself and where demand is visible, but it still leaves material unanswered questions around conversion quality, retention, governance, unit economics, and the durability of any apparent moat once private diligence data is introduced. The underwriting implication is that each public signal still needs private validation against cohort, margin, and control data.",
