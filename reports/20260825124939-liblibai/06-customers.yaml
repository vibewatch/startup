    {
      "id": "named-customer-proof-and-usage-quality",
      "title": "Named customer proof and usage quality",
      "body": "Customer proof is strongest around LibTV because that product is attached to professional production outcomes. BaiduWiki and related coverage say LibTV Team Edition quickly signed more than 300 short-drama companies and film studios after launch, while Firecat says the broader platform served nearly 1,000 short-drama teams, film studios, advertising companies, and brand customers. The same body of material describes team features such as shared canvases, asset libraries, permission management, and project handoff—signals more typical of repeat production workflows than casual consumer play. Another important proof point is the AI short drama “The Laid-Off Girl,” which BaiduWiki says was produced entirely using LibTV. That does not equal a broad case-study library, but it does show at least one real production outcome tied to the platform. The rest of the customer picture is more diffuse. Creator and design adoption are supported by user counts, model inventory, and brand-style workflow pages, yet public sources still stop short of naming many large recurring customers or quantifying contract value. From a diligence perspective, this public evidence is directional rather than fully institutional-grade. It shows how the company is positioning itself and where demand is visible, but it still leaves material unanswered questions around conversion quality, retention, governance, unit economics, and the durability of any apparent moat once private diligence data is introduced. The underwriting implication is that each public signal still needs private validation against cohort, margin, and control data.",
