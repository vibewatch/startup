    {
      "id": "durability-expansion-and-concentration",
      "title": "Durability, expansion, and concentration",
      "body": "The central customer-diligence question is durability. Public evidence strongly supports acquisition and breadth, but much less clearly supports retention and net expansion. The community model should help low-end acquisition because creators can discover models and examples before paying. The API and team products create plausible expansion paths from trial usage into embedded or collaborative workflows. LibTV’s rapid addition of Team Edition, asset libraries, and production features suggests management is intentionally moving toward higher-value, repeat-use accounts. Yet none of the reviewed sources disclose GRR, NRR, churn, contract length, or top-customer concentration. That matters because AI creator tools often look strong on traffic while remaining weak on durable paid behavior. Multi-homing is also easy, especially in image generation and early-stage video workflows. The practical customer verdict is therefore that LiblibAI has unusually strong public proof of adoption for its age, but only moderate public proof of retention quality and concentration safety. From a diligence perspective, this public evidence is directional rather than fully institutional-grade. It shows how the company is positioning itself and where demand is visible, but it still leaves material unanswered questions around conversion quality, retention, governance, unit economics, and the durability of any apparent moat once private diligence data is introduced. The underwriting implication is that each public signal still needs private validation against cohort, margin, and control data.",
