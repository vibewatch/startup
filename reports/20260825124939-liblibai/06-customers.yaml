  "chapter": {
    "number": 6,
    "title": "Customers",
    "summary": "The strongest public customer evidence for LiblibAI is breadth, not contract disclosure. The company appears to serve a layered customer base spanning individual creators, design users, developers, short-drama studios, film teams, agencies, and brand clients, with LibTV providing the clearest proof of professional workflow adoption. What remains missing is the institutional-quality retention and concentration data needed to know whether those customers are sticky, expanding, and diversified enough to support the current valuation."
  },
  "sections": [
    {
      "id": "customer-segments-and-adoption",
      "title": "Customer segmentation and adoption trajectory",
      "body": "Public evidence suggests that LiblibAI serves several distinct customer layers rather than one monolithic user base. The broadest layer is the creator community tied to image generation, prompt/model discovery, and memberships. A second layer is developers who integrate creative generation through the API. A third layer is design users, where Xingliu and brand-style workflows imply team or commercial usage. The most commercially important layer may now be LibTV’s professional buyers—short-drama studios, film teams, ad agencies, and brand customers—because that cohort appears closer to workflow budgets than hobby experimentation. Adoption signals are unusually strong in public for such a young company: 30 million cumulative users, 500,000-plus original models, 10 million-plus Xingliu users, more than 100,000 LibTV visits on launch day, nearly 1,000 professional teams served, and more than 300 Team Edition business customers. These are not perfect customer-quality metrics, but they clearly indicate real demand across multiple cohorts. From a diligence perspective, this public evidence is directional rather than fully institutional-grade. It shows how the company is positioning itself and where demand is visible, but it still leaves material unanswered questions around conversion quality, retention, governance, unit economics, and the durability of any apparent moat once private diligence data is introduced. The underwriting implication is that each public signal still needs private validation against cohort, margin, and control data.",
