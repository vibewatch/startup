  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Direct, incumbent, and adjacent rivals
        blocks:
          - type: paragraph
            body: >-
              LiblibAI’s direct rivalry starts with creative communities and creator tools rather than with every
              frontier model company. Civitai is the clearest global community analogue because it organizes models,
              images, videos, and creators in one place. Midjourney competes on image quality and creator mindshare even
              though its collaboration model is different. Adobe Firefly and Canva compete from the opposite direction:
              they begin with workflow trust, installed design behavior, and brand relationships, then fold in AI
              generation. Runway and Kling matter because they set the pace in AI video, where LibTV is trying to move
              from demo appeal into true production use. This landscape matters because LiblibAI is trying to win across
              multiple battlefields at once: creator community, image tools, video workflow, and design-agent
              experience. That breadth is a strategic opportunity, but it also means the company rarely faces one weak
              or fragmented rival set. From a diligence perspective, this public evidence is directional rather than
              fully institutional-grade. It shows how the company is positioning itself and where demand is visible, but
              it still leaves material unanswered questions around conversion quality, retention, governance, unit
              economics, and the durability of any apparent moat once private diligence data is introduced. The
              underwriting implication is that each public signal still needs private validation against cohort, margin,
              and control data.
