      - CU024
      - CU034
      - CU035
  - id: FR001
    title: Risk heatmap
    type: quadrant
    layout: wide
    summary: >-
      The most severe risks cluster around regulation, dependency, and economic opacity rather than around simple demand
      creation.
    data:
      points:
        - label: Labeling/compliance
          x: 8
          'y': 9
          detail: High likelihood and high impact if controls are weak
        - label: Upstream model squeeze
          x: 7
          'y': 8
          detail: Price-quality resets can compress moat quickly
        - label: Reliability / workflow outage
          x: 6
          'y': 7
          detail: Professional workflows fail hard when reliability slips
        - label: Customer retention opacity
          x: 7
          'y': 7
          detail: Traffic strength may overstate durable value
        - label: Governance disclosure gap
          x: 5
          'y': 7
          detail: Limits confidence but is fixable through diligence
        - label: Product-sprawl execution
          x: 6
          'y': 8
          detail: Too many surfaces can dilute focus
      xAxis: likelihood
      yAxis: impact
    claimRefs:
      - CR001
      - CR003
      - CR015
      - CR023
      - CR029
      - CR031
  - id: FR002
    title: Risk transmission map
    type: dag
    layout: wide
    summary: 'Several risks compound one another: supplier dependence, content governance, and retention can all interact.'
    data:
      nodes:
        - id: supplier
          label: Supplier dependence
          description: External model quality or price shifts.
        - id: quality
          label: Workflow quality
          description: Latency, output consistency, and production usability.
        - id: compliance
          label: Compliance burden
          description: Labeling, moderation, privacy, copyright.
        - id: retention
          label: Retention pressure
          description: Users multi-home if value weakens.
        - id: economics
          label: Economics pressure
          description: Margin and burn worsen when costs rise or retention falls.
      edges:
        - from: supplier
          to: quality
        - from: compliance
          to: quality
        - from: quality
          to: retention
        - from: supplier
          to: economics
        - from: retention
          to: economics
    claimRefs:
      - CR016
      - CR017
      - CR018
      - CR023
      - CR024
      - CR033
      - CR035
  - id: FR003
    title: Dependency map
    type: dag
    layout: wide
    summary: LiblibAI depends on policy, creator supply, model access, and workflow execution all remaining aligned.
    data:
      nodes:
        - id: policy
          label: Policy environment
          description: China’s AI rules shape acceptable operations.
        - id: models
          label: Model access
          description: Capability breadth partly comes from upstream engines.
        - id: community
          label: Creator community
          description: Models, assets, and traffic sustain the ecosystem.
        - id: team
          label: Professional team users
          description: Higher-value accounts require reliable workflows.
        - id: capital
          label: Capital base
          description: Fresh funding buys time but not guaranteed economics.
      edges:
        - from: policy
          to: team
        - from: models
          to: team
        - from: community
          to: team
        - from: team
          to: capital
        - from: models
          to: capital
    claimRefs:
      - CR025
      - CR026
      - CR027
      - CR030
      - CR036
      - CR037
      - CR039
  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: The recommendation depends on whether strong growth and breadth convert into durable economics and controls.
    data:
      nodes:
        - id: scale
          label: Scale is real
          description: Users, ARR, and funding are already meaningful.
        - id: breadth
          label: Workflow breadth
          description: Image, API, design, and video create upside optionality.
        - id: quality
          label: Quality unknown
          description: Retention, margin, and control maturity are still underdisclosed.
        - id: valuation
          label: Valuation discipline
          description: A full-but-defendable multiple requires high-quality private data.
        - id: decision
          label: Proceed selectively
          description: Serious diligence is justified, blind conviction is not.
      edges:
        - from: scale
          to: breadth
        - from: breadth
          to: quality
        - from: quality
          to: valuation
        - from: valuation
          to: decision
    claimRefs:
      - CV001
      - CV004
      - CV007
      - CV010
      - CV013
      - CV027
