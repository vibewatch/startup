      - number: '8.2'
        title: Comparable set, scenario framing, and range building
        blocks:
          - type: paragraph
            body: >-
              The best valuation lens is blended. Public creative-software and AI-application comps show that the market
              rewards growth, workflow stickiness, and visible margin structure, but penalizes commoditized or low-trust
              software quickly. Multiples.vc’s August 2026 view is especially useful because it shows design and
              engineering software around 4.2x NTM revenue, AI around 4.0x, productivity around 3.4x, and a much lower
              broad median around 2.2x. Against that backdrop, LiblibAI’s implied valuation of about 6.7x ARR is full
              relative to broad software, yet not outrageous if the company’s growth, retention, and product breadth are
              materially better than median. The scenario framework should therefore ask what kind of company LiblibAI
              is becoming: a durable workflow platform, a fast-growing but lower-margin AI utility, or a hype-rich
              business with weak retention beneath the traffic story. From a diligence perspective, this public evidence
              is directional rather than fully institutional-grade. It shows how the company is positioning itself and
              where demand is visible, but it still leaves material unanswered questions around conversion quality,
              retention, governance, unit economics, and the durability of any apparent moat once private diligence data
              is introduced. The underwriting implication is that each public signal still needs private validation
