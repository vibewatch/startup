      - number: '1.2'
        title: Founder anchor, investor base, and public scale signals
        blocks:
          - type: paragraph
            body: >-
              Chen Mian is the clearest founder anchor in the public record. Multiple independent reports connect him to
              ByteDance, especially the Jianying/CapCut commercialization stack, and present May 2023 as the practical
              founding window for LiblibAI/Evoken. That founder profile matters because the investor roster is unusually
              strong for a two-to-three-year-old application company. The 2025 Series B was framed as the largest single
              AI-application financing in China that year, while the June 2026 B+ round pushed post-money valuation
              above $2 billion with Granite Asia, Tencent, and Shunwei co-leading. Public scale claims are also large
              enough to matter: more than 30 million cumulative LiblibAI users, more than 500,000 original models, more
              than 10 million Xingliu users, and nearly 1,000 professional teams using LibTV. These are still mostly
              company-reported numbers rather than audited operating KPIs, but they collectively support the thesis that
              LiblibAI has already crossed from niche tool into a broad creator platform with meaningful commercial
              reach. From a diligence perspective, this public evidence is directional rather than fully
              institutional-grade. It shows how the company is positioning itself and where demand is visible, but it
              still leaves material unanswered questions around conversion quality, retention, governance, unit
              economics, and the durability of any apparent moat once private diligence data is introduced. The
              underwriting implication is that each public signal still needs private validation against cohort, margin,
              and control data.
