  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis, anti-thesis, and financing context
        blocks:
          - type: paragraph
            body: >-
              The investment thesis starts with reality, not possibility. LiblibAI already appears to have crossed into
              genuine commercial scale through a combination of creator distribution, workflow breadth, and unusually
              rapid monetization. The company has public signals for 30 million users, 500,000 models, roughly $300
              million ARR, and a B+ round at a valuation above $2 billion. That is a much stronger starting point than
              most AI-application businesses. The anti-thesis is equally important: public data still does not prove
              retention quality, gross margin durability, or insulation from upstream model competition. If the company
              is primarily an aggregator with shallow switching costs, a premium private multiple may be hard to defend
              through market cycles. Valuation therefore hinges less on whether LiblibAI is real and more on whether its
              workflow and ecosystem advantages are deep enough to justify paying above broad software medians. From a
              diligence perspective, this public evidence is directional rather than fully institutional-grade. It shows
              how the company is positioning itself and where demand is visible, but it still leaves material unanswered
              questions around conversion quality, retention, governance, unit economics, and the durability of any
              apparent moat once private diligence data is introduced. The underwriting implication is that each public
              signal still needs private validation against cohort, margin, and control data.
            claimRefs:
