  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, included spend, and buyer map
        blocks:
          - type: paragraph
            body: >-
              The narrowest useful market definition for LiblibAI is not “all generative AI” but the spending tied to
              visual-content creation workflows that can be monetized through community, software, or API access. That
              includes creator image generation, professional AI video production, AI-assisted design, model training or
              sharing, and adjacent developer usage where teams embed creative generation into downstream products. The
              market should exclude pure foundation-model training economics and most horizontal office AI spend. On the
              demand side, the company serves at least four visible buyer clusters. Individual creators use image and
              model tools for ideation and production. Professional video teams and short-drama studios use LibTV for
              higher-output workflows. Designers and agencies use Xingliu or Lovart-style design agents. Developers and
              automation teams consume image APIs and model assets programmatically. This matters because budget
              ownership, retention logic, and willingness to pay differ sharply across those groups. LiblibAI’s market
              is therefore multi-segment and workflow-bound, not one uniform creator-software bucket. From a diligence
              perspective, this public evidence is directional rather than fully institutional-grade. It shows how the
              company is positioning itself and where demand is visible, but it still leaves material unanswered
              questions around conversion quality, retention, governance, unit economics, and the durability of any
              apparent moat once private diligence data is introduced. The underwriting implication is that each public
              signal still needs private validation against cohort, margin, and control data.
