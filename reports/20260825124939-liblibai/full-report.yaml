  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model, monetization surfaces, and pricing logic
        blocks:
          - type: paragraph
            body: >-
              The public record is clear that LiblibAI is no longer a pure traffic story. Its official API page shows
              direct monetization through point-based plans, commercial rights, and custom quotas. The VIP page adds
              recurring consumer-like subscription logic through memberships and bundled points. LibTV and Xingliu
              broaden that into workflow spending, where teams are paying not just for generation but for a production
              environment. Media coverage of the B and B+ rounds reinforces the same point: investors are underwriting a
              product family that monetizes creators, professional teams, and developers simultaneously. That matters
              because a multi-surface revenue stack is usually higher quality than one-off consumer novelty revenue. The
              main open question is mix. Public sources still do not disclose how much of ARR comes from membership,
              API, video teams, design-agent usage, or large custom deals, so the quality of the top line remains only
              partially visible. From a diligence perspective, this public evidence is directional rather than fully
