        blocks:
          - type: paragraph
            body: >-
              The June 2026 B+ round reduces immediate financing pressure, but it does not remove the need for hard
              diligence on burn and runway. A company scaling image, video, agent, and API products at once will almost
              certainly carry meaningful compute, model-access, moderation, and go-to-market costs. Public sources say
              ARR exceeded $300 million as of May 2026 and growth surpassed 3000% year over year, which is impressive,
              yet those figures are not accompanied by cash balance, gross margin, operating loss, deferred revenue, or
              capex disclosure. The most defensible financial verdict is therefore balanced. LiblibAI looks commercially
              real and unusually fast-growing for its age; however, the public record is still too thin to determine
              whether the company is compounding efficiently or merely spending aggressively into a hot category. The
              next round should not be viewed as inevitable, but neither can current capital adequacy be underwritten
              from public evidence alone. From a diligence perspective, this public evidence is directional rather than
              fully institutional-grade. It shows how the company is positioning itself and where demand is visible, but
