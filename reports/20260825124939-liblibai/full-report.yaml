companyProfile:
  summary: >-
    LiblibAI is the flagship product inside Beijing-based Evoken, a creative-AI platform company founded in May 2023
    around founder Chen Mian. The company now spans a creator/model community, VIP memberships, developer APIs, LibTV
    for AI video production, and Xingliu for design-agent workflows. Public reporting suggests more than 30 million
    cumulative users, more than 500,000 original models, roughly $300 million of ARR as of May 2026, and a June 2026 B+
    round of nearly $300 million at a valuation above $2 billion. That makes LiblibAI one of the more commercially
    credible AI application businesses in China, but public disclosure on gross margin, retention, cash, governance, and
    dependency concentration remains thin.
