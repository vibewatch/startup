  - id: FU004
    title: Retention / repeat cohort
    type: kpi
    layout: standard
    summary: The public record proves breadth and growth, but leaves core retention metrics undisclosed.
    data:
      items:
        - label: User breadth
          value: 30M+
          detail: Large top-of-funnel creator reach
          tone: positive
        - label: Professional teams served
          value: ~1,000
          detail: Meaningful workflow adoption signal
          tone: positive
        - label: Business customers
          value: 300+
          detail: Team Edition converts some accounts beyond trial
          tone: positive
        - label: Public NRR / churn disclosure
          value: none
          detail: Major durability blind spot
          tone: warning
    claimRefs:
      - CU019
      - CU020
      - CU021
      - CU022
