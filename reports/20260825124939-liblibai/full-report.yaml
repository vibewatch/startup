      - number: '2.3'
        title: Adoption drivers, switching frictions, and constraints
        blocks:
          - type: paragraph
            body: >-
              Market growth alone will not guarantee capture. The strongest adoption drivers are creative-efficiency
              gains, cheaper iteration relative to traditional studio pipelines, and the ability to compress previously
              fragmented tools into one workflow. LiblibAI’s own product surfaces reinforce that thesis with
              points-based API access, memberships, shared account systems, and creator-community discovery. The
              constraints are equally visible. China’s labeling rules and broader regulatory expectations force ongoing
              moderation and metadata work on every image and video platform. Copyright and safety issues are already
              shaping the sector, especially in AI video. Competitive pressure is also high because buyers can
              multi-home. Communities like Civitai compete on models and discovery, while Adobe Firefly, Canva, Runway,
              Kling, and upstream model vendors compete on workflow quality, brand trust, or direct generation. The
              practical market takeaway is that LiblibAI has access to a large and expanding demand pool, but the
              reachable near-term market is the subset where workflow integration, Chinese creator density, and
              price-performance are strong enough to outweigh regulatory load and easy switching. From a diligence
              perspective, this public evidence is directional rather than fully institutional-grade. It shows how the
              company is positioning itself and where demand is visible, but it still leaves material unanswered
              questions around conversion quality, retention, governance, unit economics, and the durability of any
              apparent moat once private diligence data is introduced. The underwriting implication is that each public
              signal still needs private validation against cohort, margin, and control data.
