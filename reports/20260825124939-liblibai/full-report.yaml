      Public adoption markers show a very broad top of funnel and a smaller but still meaningful professional workflow
      base.
    data:
      items:
        - label: Cumulative users
          value: 30000000
        - label: Original models
          value: 500000
        - label: Xingliu users
          value: 10000000
        - label: LibTV first-day visits
          value: 100000
        - label: LibTV teams/institutions served
          value: 1000
        - label: Team Edition business customers
          value: 300
    claimRefs:
      - CU007
      - CU008
      - CU009
      - CU010
      - CU011
      - CU012
  - id: FU003
    title: Customer proof matrix
    type: matrix
    layout: wide
    summary: Proof quality is strongest for LibTV production use cases and weaker for the broader creator and design cohorts.
    data:
      columns:
