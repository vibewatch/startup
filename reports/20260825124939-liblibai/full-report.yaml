  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal risk ranking
        blocks:
          - type: paragraph
            body: >-
              The first risk bucket is regulatory and legal because LiblibAI operates directly in synthetic image and
              video distribution. China’s AI-generated-content labeling rules and the deeper deep-synthesis framework
              make labeling, provenance, moderation, privacy, and platform governance product-level obligations. This is
              not a box-checking exercise: a company distributing creative assets and AI video at scale can face
              reputational damage, enforcement exposure, or customer trust erosion if labels are missing, content
              controls are weak, or copyrighted material is mishandled. The reviewed policy and legal-analysis sources
              are directionally consistent that both generators and distributors have obligations. Public company
              policies show that LiblibAI is aware of platform governance, but awareness is not the same as proven
              control maturity. Legal risk is therefore manageable in theory, but only if operational controls scale
              with product breadth and usage growth. From a diligence perspective, this public evidence is directional
              rather than fully institutional-grade. It shows how the company is positioning itself and where demand is
              visible, but it still leaves material unanswered questions around conversion quality, retention,
              governance, unit economics, and the durability of any apparent moat once private diligence data is
              introduced. The underwriting implication is that each public signal still needs private validation against
              cohort, margin, and control data.
