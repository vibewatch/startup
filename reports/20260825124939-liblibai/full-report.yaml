chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product stack, and operating scope
        blocks:
          - type: paragraph
            body: >-
              LiblibAI should be understood as a platform company rather than a single image generator. The current
              public record ties the image community, the LibTV video workspace, and the Xingliu design agent together
              under the same Beijing operator, Beijing Evoken Technology, through updated user-agreement and
              privacy-policy language. That matters because it means the company is already trying to unify account,
              content, and API surfaces across creator, team, and developer workflows rather than running isolated point
              products. The product evidence is consistent with that framing. LiblibAI markets an image-creation
              community, a model and LoRA ecosystem, creator points and memberships, and a commercial API. LibTV extends
              the stack into professional video creation, while Xingliu positions itself as a design agent. The
              strategic through-line is workflow aggregation: image assets, model training, video production, and design
              delivery all live inside one ecosystem. This gives later chapters a clean ground truth: Evoken is building
              creative-AI infrastructure with community distribution at the top and monetized tools beneath it. From a
              diligence perspective, this public evidence is directional rather than fully institutional-grade. It shows
              how the company is positioning itself and where demand is visible, but it still leaves material unanswered
              questions around conversion quality, retention, governance, unit economics, and the durability of any
              apparent moat once private diligence data is introduced. The underwriting implication is that each public
              signal still needs private validation against cohort, margin, and control data.
