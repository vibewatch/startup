      - number: '3.2'
        title: Pricing, distribution, and switching economics
        blocks:
          - type: paragraph
            body: >-
              Competitive dynamics here are shaped by low switching costs. Runway publishes multi-tier creator pricing
              and positions itself as an AI video brand with broad creator and enterprise reach. OpenAI sells business
              seats and enterprise plans, making it a budget alternative for some teams that can tolerate horizontal
              tools. Adobe and Canva defend design budgets through familiar workflows, distribution, and brand trust.
              Civitai competes on community and discovery rather than enterprise polish. LiblibAI’s advantage is that it
              can blend community, model inventory, and workflow utility inside one product family. Its weakness is that
              buyers can multi-home across many of these tools, especially when upstream model vendors improve quickly.
              36Kr’s “AI middleman” critique captures the key risk: if the best model quality and the best UX converge
              elsewhere, aggregation alone may not remain enough. From a diligence perspective, this public evidence is
              directional rather than fully institutional-grade. It shows how the company is positioning itself and
              where demand is visible, but it still leaves material unanswered questions around conversion quality,
              retention, governance, unit economics, and the durability of any apparent moat once private diligence data
              is introduced. The underwriting implication is that each public signal still needs private validation
              against cohort, margin, and control data.
