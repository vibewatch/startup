      - number: '3.3'
        title: Moat durability and competitive verdict
        blocks:
          - type: paragraph
            body: >-
              The strongest moat candidate is not proprietary model ownership; it is ecosystem density. LiblibAI has a
              Chinese creator base, a large model library, a shared-account structure across products, and evidence that
              it is extending into team and API usage. That combination can create real distribution power if creators,
              agencies, and video studios start treating the platform as a default workspace rather than a cheap
              alternative. But the moat is still conditional. Competitors such as Adobe and Canva own workflow trust;
              Runway owns global AI-video brand equity; Civitai owns a strong model-community identity; and Chinese
              video leaders are moving fast under intense commercialization pressure. LiblibAI therefore looks
              differentiated but not yet insulated. The competitive underwriting stance should be that the company has a
              plausible path to platform status, but it still operates in a category where many users can switch tools
              whenever price, quality, or queue times move against them. From a diligence perspective, this public
              evidence is directional rather than fully institutional-grade. It shows how the company is positioning
              itself and where demand is visible, but it still leaves material unanswered questions around conversion
              quality, retention, governance, unit economics, and the durability of any apparent moat once private
              diligence data is introduced. The underwriting implication is that each public signal still needs private
