      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Risks key takeaway
            body: >-
              LiblibAI’s biggest risks are not generic startup risks; they are the specific hazards of scaling a
              multi-product AI creative platform in China while relying on fast-moving upstream models and still-thin
              public disclosure. The regulatory and content-safety load is real, the economic moat is still conditional,
              and the company’s most attractive growth lanes—AI video, creator ecosystems, and agent workflows—are also
              among the most volatile. The correct risk stance is not “fatal,” but it is materially higher than the
              fundraising narrative alone suggests.
            calloutType: insight
            claimRefs:
              - CR001
              - CR002
          - type: callout
            title: Risks diligence caution
            body: >-
              Public evidence is directionally strong but still incomplete enough that private diligence materials could
              change the underwriting view materially.
