callouts:
  - calloutType: "insight"
    title: "Insurance-Native Credentialing as a Defensible Distribution Moat"
    body: "While DTC competitors like Kindr offer frictionless cash-pay onboarding within 24 hours, Midi's nationwide insurance contracts covering more than 80% of commercial PPO plans create an entrenched barrier to entry. Navigating state-by-state provider credentialing and fee schedule negotiations protects Midi against rapid commoditization by pure consumer telehealth startups."
    claimRefs:
      - "CP001"
      - "CP004"
      - "CP005"
      - "CP008"
  - calloutType: "risk"
    title: "Regulatory Oversight on Clinical Symptom Marketing"
    body: "The February 2026 National Advertising Division inquiry requiring Midi to discontinue claims that 91% of patients find relief within two months illustrates heightened scrutiny on clinical efficacy claims. As competition intensifies, virtual clinics must substantiate marketing messages with peer-reviewed real-world evidence rather than directional patient surveys."
    claimRefs:
      - "CP007"
