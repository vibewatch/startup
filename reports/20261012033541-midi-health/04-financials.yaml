company:
  name: "Midi Health"
chapter:
  number: 4
  title: "Financials"
  summary: "Midi Health has an insurance-led virtual-care model with self-pay and product adjacencies, while third parties report meaningful scale and a $150 million revenue run rate. The retained evidence does not disclose realized reimbursement, gross margin, acquisition efficiency, cash burn, debt, or runway, so revenue quality and capital adequacy remain unverified."
sections:
  - id: "revenue-model"
    title: "Revenue Model and Pricing Evidence"
    body: "Midi's disclosed commercial model centers on reimbursed virtual clinical care: its official pages say it is in-network with most major insurers, while an external review says it bills commercial payers directly. Self-pay is available, but the company warns that deductibles, coinsurance, and copays vary by plan; no retained source provides a current official visit price or realized reimbursement schedule. The official site also markets health products, creating a plausible ancillary sales stream, but neither product revenue nor revenue mix is disclosed. Consequently, list access and payer reach should not be treated as recognized revenue, collections, or margin. Underwriting needs allowed amounts, denial and adjustment rates, payer mix, collection timing, and service-line revenue recognition policies."
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI003"
    tableRefs:
      - "TI001"
      - "TI002"
    figureRefs:
      - "FI001"
  - id: "traction-and-gtm"
    title: "Reported Traction and Sales-Efficiency Signals"
    body: "Public traction is substantial but unevenly defined. Accio reports a $150 million revenue run rate and 20,000 women served monthly, whereas Forbes and HIT Consultant report 25,000 patients seen per week and 45 million covered lives. Those measures have different periods and denominators: covered lives are addressable insurance access, patients per week is service volume, and a revenue run rate is neither ARR nor audited revenue. Forbes also reports that management prioritizes referrals, which may indicate an organic acquisition loop, but no referral rate, CAC, sales cycle, conversion rate, or payback period is published. These signals support commercial momentum, not a complete sales-efficiency or retention model."
    claimRefs:
      - "CI004"
      - "CI005"
      - "CI006"
      - "CI007"
      - "CI010"
  - id: "costs-and-unit-economics"
    title: "Cost Structure and Unit-Economics Gaps"
    body: "The operating model combines licensed-clinician capacity with payer administration and virtual infrastructure. Forbes reports that Midi uses AI for documentation, prior authorization, scheduling, and chart review, indicating that clinician time and reimbursement workflows are material cost and throughput constraints even though no cost amount is disclosed. A separate location guide describes care as primarily virtual rather than a network of physical clinics, but it also highlights state licensing and staffing capacity as delivery constraints. The retained evidence supplies no clinician cost per encounter, gross margin, contribution margin, payer yield, cohort retention, or LTV-to-CAC ratio. The official 95% symptom-improvement claim is based on a company retrospective cohort and is not evidence of retention, reimbursement, or unit profitability."
    claimRefs:
      - "CI011"
      - "CI012"
      - "CI014"
      - "CI015"
    tableRefs:
      - "TI003"
  - id: "capital-and-verdict"
    title: "Capital Adequacy and Financial Verdict"
    body: "Forbes and HIT Consultant report a $100 million Series D in February 2026 at a valuation above $1 billion. That financing is evidence of capital raised, not cash currently available: the retained sources do not disclose balance-sheet cash, monthly burn, debt, working-capital needs, runway, planned fund deployment, or a next-round trigger. Advertising substantiation is also a financial risk because the National Advertising Division says Midi permanently discontinued a challenged two-month symptom-relief claim; NAD did not decide the merits, so the record should not be overstated as an adverse efficacy finding. The financial verdict is therefore mixed: scale and insurer reach are promising, but margin durability, revenue quality, capital intensity, and runway cannot yet be underwritten."
    claimRefs:
      - "CI008"
      - "CI009"
      - "CI013"
      - "CI015"
      - "CI016"
callouts:
  - calloutType: "risk"
    title: "Funding is not runway"
    body: "The reported $100 million Series D does not establish cash on hand or months of runway; cash, burn, debt, working capital, and deployment milestones remain private diligence items."
    claimRefs:
      - "CI008"
      - "CI015"
  - calloutType: "recommendation"
    title: "Rebuild the model from payer collections"
    body: "Request encounter-level billed charges, contractual adjustments, denials, patient responsibility, collections, clinician cost, and acquisition source before relying on the reported revenue run rate."
    claimRefs:
      - "CI001"
      - "CI004"
      - "CI015"
