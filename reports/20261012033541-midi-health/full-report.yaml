  - id: TV002
    title: Thesis / Anti-Thesis Table
    columns:
      - Investment Angle
      - Core Thesis Argument
      - Underwriting Hypothesis
      - What Would Change the View
    rows:
      - - Market Leadership
        - Midi is the category-defining virtual clinic for perimenopause with national insurance in-network reach.
        - First-mover advantage in commercial payer contracts creates a defensible distribution moat.
        - Accelerated payer contracting by multi-specialty competitors (Maven, One Medical) eroding share.
      - - Care Platform Scaling
        - Expanding beyond menopause into metabolic health, longevity, and multi-specialty chronic care.
        - Cross-selling higher-margin longevity and cash-pay wellness lines expands patient lifetime value.
        - Clinical pushback on scope expansion or payer refusal to reimburse adjunctive wellness offerings.
      - - Technology Operating Leverage
        - Proprietary AI triage, chart review, and documentation software drives provider productivity.
        - AI scribing and automated pre-authorizations allow clinicians to handle higher visit volumes profitably.
        - High clinician turnover or administrative overhead outpacing automation-driven productivity gains.
      - - Valuation & Return Profile
        - Unicorn valuation reflects premium scarcity value as the preeminent midlife women's health pure-play.
        - High revenue growth (expanding from $150M run rate) will grow the business into its $1.0B valuation.
        - Public telehealth multiple compression (Teladoc, Hims) forcing down-round or flat extension dynamics.
    notes: Thesis perspectives evaluate operational scalability and competitive defensibility against valuation risks.
    claimRefs:
      - CV001
      - CV002
      - CV005
      - CV006
      - CV007
      - CV012
  - id: TV003
    title: Bull / Base / Bear Scenario Table
    columns:
      - Scenario
      - Operating & Financial Assumptions
      - Valuation & Return Logic
      - Key Downside Risks
      - Probability Signal
    rows:
      - - Bull Case
        - Revenue grows 45%+ annually to $300M+; gross margin expands to 55%; successful multi-specialty cross-sell.
        - EV reaches $2.5B - $3.0B via high-growth healthcare multiple (8x - 10x); 2.5x - 3.0x net MOIC exit.
        - Execution missteps in new service lines or federal telehealth reimbursement tightening.
        - 25% (requires flawless enterprise benefit and Medicare/Medicaid adoption)
      - - Base Case
        - Revenue grows 20-30% annually to $200M - $220M; gross margins plateau at 40-45%; steady visit volume.
        - EV settles at $1.1B - $1.3B (5x - 6x multiple); 1.1x - 1.3x capital return, preserving preferred capital.
        - Payer rate stagnation and clinical labor wage inflation constraining free cash flow.
        - 55% (consistent with established virtual care operational trajectories)
      - - Bear Case
        - Growth slows below 10%; margin compression from NP turnover; adverse regulatory marketing fallout.
        - Valuation reprices downward to $400M - $600M (2x - 3x distressed multiple); substantial equity dilution.
        - Loss of major employer health plan contracts or payer network exclusions.
        - 20% (triggered if unit economics fail to demonstrate operating leverage)
    notes: >-
      Scenarios model potential 3-year performance trajectories based on market expansion rates and exit multiple
      sensitivity.
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV011
      - CV012
