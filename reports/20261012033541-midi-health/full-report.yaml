chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Company Identity and Care Delivery Model
        blocks:
          - type: paragraph
            body: >
              Midi Health, Inc. is an insurance-native virtual healthcare clinic dedicated to midlife women's health,
              specifically targeting perimenopause, menopause, hormonal shifts, and related chronic conditions. Founded
              in 2021 and based in California, the company was established by female founders Joanna Strober and Sharon
              Meers to address structural deficits in adult female healthcare, where an estimated 57 million U.S. women
              aged 40 to 64 experience symptoms and nearly half of U.S. counties lack practicing OB/GYN specialists.


              Midi's core operating model functions as a virtual clinic powered by specialized nurse practitioners and
              overseen by physicians. Rather than operating as an out-of-pocket cash-pay digital health app, Midi
              contracts directly with major commercial health insurance payers—including Aetna, Anthem Blue Cross, and
              UnitedHealthcare—allowing patients to access virtual consultations, diagnostic lab orders, lifestyle
              coaching, and prescription management (including hormonal replacement therapy and non-hormonal
              therapeutics) under standard in-network copays and deductibles. Following its initial rollout in
              California, the clinic reached full 50-state operating capacity in January 2024.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO006
