              - CI002
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI002
              - CI011
              - CI012
              - CI015
      - number: '4.2'
        title: Reported Traction and Sales-Efficiency Signals
        blocks:
          - type: paragraph
            body: >-
              Public traction is substantial but unevenly defined. Accio reports a $150 million revenue run rate and
              20,000 women served monthly, whereas Forbes and HIT Consultant report 25,000 patients seen per week and 45
              million covered lives. Those measures have different periods and denominators: covered lives are
              addressable insurance access, patients per week is service volume, and a revenue run rate is neither ARR
              nor audited revenue. Forbes also reports that management prioritizes referrals, which may indicate an
              organic acquisition loop, but no referral rate, CAC, sales cycle, conversion rate, or payback period is
              published. These signals support commercial momentum, not a complete sales-efficiency or retention model.
            claimRefs:
              - CI004
              - CI005
              - CI006
              - CI007
              - CI010
      - number: '4.3'
        title: Cost Structure and Unit-Economics Gaps
        blocks:
          - type: paragraph
            body: >-
              The operating model combines licensed-clinician capacity with payer administration and virtual
              infrastructure. Forbes reports that Midi uses AI for documentation, prior authorization, scheduling, and
              chart review, indicating that clinician time and reimbursement workflows are material cost and throughput
              constraints even though no cost amount is disclosed. A separate location guide describes care as primarily
              virtual rather than a network of physical clinics, but it also highlights state licensing and staffing
              capacity as delivery constraints. The retained evidence supplies no clinician cost per encounter, gross
              margin, contribution margin, payer yield, cohort retention, or LTV-to-CAC ratio. The official 95%
              symptom-improvement claim is based on a company retrospective cohort and is not evidence of retention,
              reimbursement, or unit profitability.
            claimRefs:
              - CI011
              - CI012
              - CI014
              - CI015
          - type: table
            tableRef: TI003
            claimRefs:
              - CI004
              - CI006
              - CI007
              - CI015
              - CI016
      - number: '4.4'
        title: Capital Adequacy and Financial Verdict
        blocks:
          - type: paragraph
            body: >-
              Forbes and HIT Consultant report a $100 million Series D in February 2026 at a valuation above $1 billion.
              That financing is evidence of capital raised, not cash currently available: the retained sources do not
              disclose balance-sheet cash, monthly burn, debt, working-capital needs, runway, planned fund deployment,
              or a next-round trigger. Advertising substantiation is also a financial risk because the National
              Advertising Division says Midi permanently discontinued a challenged two-month symptom-relief claim; NAD
              did not decide the merits, so the record should not be overstated as an adverse efficacy finding. The
              financial verdict is therefore mixed: scale and insurer reach are promising, but margin durability,
              revenue quality, capital intensity, and runway cannot yet be underwritten.
            claimRefs:
              - CI008
              - CI009
              - CI013
              - CI015
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Funding is not runway
            body: >-
              The reported $100 million Series D does not establish cash on hand or months of runway; cash, burn, debt,
              working capital, and deployment milestones remain private diligence items.
            calloutType: risk
            claimRefs:
              - CI008
              - CI015
          - type: callout
            title: Rebuild the model from payer collections
            body: >-
              Request encounter-level billed charges, contractual adjustments, denials, patient responsibility,
              collections, clinician cost, and acquisition source before relying on the reported revenue run rate.
            calloutType: recommendation
            claimRefs:
              - CI001
              - CI004
              - CI015
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Virtual Care Delivery Model and Clinical Service Lines
        blocks:
          - type: paragraph
            body: >-
              Midi Health delivers clinical midlife healthcare through a specialized telemedicine model focused on
              perimenopause, menopause, and broader hormonal transitions. The platform connects patients with
              board-certified nurse practitioners and supervising physicians via synchronous video appointments and
              asynchronous digital messaging, offering care across all 50 U.S. states. Following an initial diagnostic
              consultation, clinicians establish personalized Care Plans spanning over 30 menopause-related symptoms.
              Treatment modalities encompass prescription hormone replacement therapy (systemic oral and transdermal
              estradiol, micronized progesterone, and vaginal estrogen), non-hormonal prescription medications such as
              SSRIs/SNRIs, targeted botanical supplements, and lifestyle interventions. While conventional
              direct-to-consumer digital clinics rely on out-of-pocket cash subscriptions ranging from $150 to $300
              monthly, Midi's primary commercial differentiation is direct in-network commercial insurance reimbursement
              across major regional and national payers. Furthermore, the company has diversified beyond core vasomotor
              relief into adjacent midlife clinical programs, including metabolic weight management and specialized
              survivorship support for women with cancer histories.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE012
              - CE013
          - type: table
            tableRef: TE001
