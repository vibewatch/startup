  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      End-to-end patient lifecycle from initial symptom awareness and insurance verification to ongoing clinical
      consultations, multidisciplinary referrals, and longitudinal maintenance.
    approximationNotes: >-
      Workflow stages and touchpoints synthesized from published clinical descriptions, patient onboarding
      documentation, and insurance verification workflows.
    claimRefs:
      - CU001
      - CU002
      - CU007
      - CU010
      - CU013
    data:
      items:
        - id: stage-1-awareness
          label: Symptom Onset & Awareness
          description: >-
            Patient experiences perimenopause or menopause symptoms including vasomotor symptoms, brain fog, and sleep
            disruption.
          touchpoints:
            - Digital health search
            - Word-of-mouth referral
            - Employer benefits portal
          painPoints:
            - Symptoms frequently dismissed by traditional primary care clinicians
            - Uncertainty regarding evidence-based hormone therapy options
        - id: stage-2-intake
          label: Digital Intake & Insurance Check
          description: >-
            Patient registers online, completes health history questionnaire, and verifies commercial insurance
            eligibility.
          touchpoints:
            - Online intake portal
            - Automated insurance verification engine
            - Salesforce Verifiable credentialing check
          painPoints:
            - Prior authorization requirements across select commercial formularies
            - Variable copay and deductible transparency
        - id: stage-3-consultation
          label: Virtual Clinical Consultation
          description: >-
            Comprehensive 15-to-30 minute video appointment with a board-certified clinician trained in midlife women's
            health.
          touchpoints:
            - Secure telehealth video visit
            - Comprehensive symptom review
            - Care Plan formulation
          painPoints:
            - Absence of mandatory baseline blood panel or metabolic lab requirements
            - State-by-state provider licensing constraints
        - id: stage-4-treatment
          label: Treatment Initiation & Fulfillment
          description: >-
            Clinician prescribes FDA-approved hormone therapy or non-hormonal options routed to the patient's local
            retail pharmacy.
          touchpoints:
            - Electronic prescription routing
            - Lifestyle coaching recommendations
            - Evidence-based supplement guidance
          painPoints:
            - Pharmacy stockouts of specific transdermal estradiol patches
            - Lack of integrated compounding pharmacy workflows
        - id: stage-5-followup
          label: Two-Month Follow-Up & Adjustment
          description: >-
            Structured follow-up consultations to evaluate symptom relief, adjust hormone dosages, and monitor side
            effects.
          touchpoints:
            - Scheduled telehealth review
            - EHR symptom tracking questionnaire
            - Asynchronous messaging support
          painPoints:
            - Discontinued marketing claims regarding guaranteed symptom elimination
            - Lack of structured cardiovascular risk or blood pressure monitoring recall
        - id: stage-6-maintenance
          label: Longitudinal Maintenance & Referrals
          description: Ongoing midlife health optimization, preventative screening coordination, and annual renewal management.
          touchpoints:
            - Annual clinical check-ins
            - Mammogram and lab referral orders
            - Specialist co-management
          painPoints:
            - Lack of in-platform DEXA bone density screening integration
            - Incomplete public data on multi-year patient cohort retention
