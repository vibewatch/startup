  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Care Scope, and Payer Eligibility
        blocks:
          - type: paragraph
            body: >-
              Midi Health defines its addressable market around midlife women healthcare, establishing an
              insurance-native clinical practice distinct from both conventional episodic gynecology and
              direct-to-consumer cash-pay telemedicine platforms [CM001]. Rather than operating as an asynchronous
              prescribing funnel or a transactional cash-pay marketplace, the company provides structured video
              consultations, longitudinal care plans, and diagnostic management spanning perimenopause, menopause, and
              hormonal health transitions [CM001, CM004]. The platform integrates physician-supervised nurse
              practitioners who prescribe FDA-approved hormone replacement therapy (HRT), evidence-based non-hormonal
              medications such as fezolinetant (Veoza), and metabolic interventions, while ordering diagnostic imaging
              and laboratory testing through national partners including Labcorp [CM002, CM004, CM013]. Crucially, the
              clinical boundary enforces a strict payer-eligibility divide: while commercial PPO plans and select
              Medicare Advantage policies are billed in-network, traditional Medicare, Medicaid, and Medi-Cal are
              categorically excluded from coverage [CM003]. This structural exclusion concentrates Midi Health
              commercial market on commercially insured households and self-pay consumers, isolating its addressable
              population from government-subsidized low-income healthcare programs [CM003, CM010].
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM010
              - CM013
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: Addressable Population Sizing and Valuation Sizing Lenses
        blocks:
          - type: paragraph
            body: >-
              The total addressable demographic foundation for midlife women health in the United States comprises
              approximately 57 million women aged 40 to 64, representing the fastest-growing demographic cohort
              nationally [CM005]. Clinical epidemiology indicates that roughly 84% of these women experience vasomotor,
              sleep, psychological, or metabolic symptoms that diminish quality of life, establishing a symptomatic
              patient population of nearly 48 million individuals [CM005, CM006]. Industry analysts and conference
              presentations frequently cite top-down global opportunity figures as high as $120 billion or estimate
              global clinical menopause spend at $18 billion, but these unconstrained figures conflate macroeconomic
              productivity loss, consumer wellness retail, and pharmaceutical drug spend with captureable digital clinic
              services [CM007, CM008]. A more grounded sizing lens assesses employer economic impact, where unmanaged
              menopause symptoms cause an estimated $1.8 billion in annual workplace productivity loss from absenteeism
              and reduced working hours [CM006, CM008]. At the operational layer, Midi Health has scaled to over 500,000
              cumulative patient consultations and maintains an estimated active base of 230,000 patients across all 50
              states, demonstrating substantial commercial adoption while highlighting that current penetration remains
              a small fraction of the broader symptomatic demographic [CM009, CM011].
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM011
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: figure
            figureRef: FM001
            claimRefs:
