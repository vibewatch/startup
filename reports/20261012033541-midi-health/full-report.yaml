        blocks:
          - type: paragraph
            body: >
              Midi Health is led by Chief Executive Officer and Co-Founder Joanna Strober, a serial entrepreneur and
              investor, alongside Co-Founder and President Sharon Meers, a former financial services executive and
              author. The clinical organization is directed by Kathleen Jordan, MD, who serves as Chief Medical Officer,
              and Mindy Goldman, MD, who serves as Chief Clinical Officer and brings extensive academic and clinical
              expertise in midlife gynecology and cancer-survivor symptom management.


              The broader executive bench includes Chief Financial Officer Jason Wheeler, Chief Technology Officer Jake
              Ramanathan, Chief Marketing Officer Melissa Waters, Chief Commercial Officer Matt Cook, Head of Brand
              Innovation Jill Herzig, and Chief Health Systems Officer Ariana Chehrazi. The executive structure
              concentrates strategic, fundraising, and external representation duties in CEO Joanna Strober, creating
              moderate key-person dependence. While institutional board representatives include Frederique Dame and
              Cathy Friedman from GV (Google Ventures), full board of directors composition and voting control covenants
              remain undisclosed in public filings.
