      - number: '1.3'
        title: Financing History, Investor Syndicate, and Metric Disclosure Gaps
        blocks:
          - type: paragraph
            body: >
              Between 2021 and early 2026, Midi Health completed multiple rounds of venture capital financing, bringing
              cumulative publicly disclosed equity funding to $140M. Following initial seed financing, the company
              raised a $25M Series A round led by GV in September 2023, expanding total capital to $40M. In April 2024,
              Midi closed a $60M Series B financing round led by Emerson Collective, which expanded total funding to
              $100M with participation from Memorial Hermann, SemperVirens, Felicis, Icon Ventures, and prominent
              female-led syndicates. In February 2026, Midi secured $100M in Series D funding led by Goodwater Capital,
              with participation from Foresite Capital, Impact Engine, Serena Ventures, Advance Venture Partners,
              Emerson Collective, GV, and McKesson Ventures.


              Despite sustained investor backing and widespread insurance coverage, significant analytical blind spots
              persist. While secondary market reports and previous diligence rounds suggested an aspirational unicorn
              valuation of $1.0B and an estimated $150M revenue run-rate, primary transaction confirmations for
              valuation, gross margin, cash burn, and profitability timelines have not been publicly filed. Similarly,
              customer satisfaction metrics require balanced scrutiny: while investor communications cite high patient
              satisfaction and clinical symptom relief, regulatory monitoring by the BBB National Advertising Division
              in February 2026 challenged unverified advertising claims regarding the percentage of patients
              experiencing complete symptom relief within two months, leading Midi to voluntarily discontinue the
              promotional statements.
