chapter:
  number: 6
  title: "Customers"
  summary: "Midi Health has expanded access to midlife women's healthcare by securing in-network commercial insurance partnerships spanning 45 million covered lives across all 50 states, reaching over 25,000 visits per week. However, while anchor employer clients like Stanford University and ServiceNow validate enterprise adoption, cohort-based net revenue retention remains undisclosed, and regulatory scrutiny over advertised relief claims underscores the need for independent clinical validation."
sections:
  - id: "customer-segmentation-and-commercial-dynamics"
    title: "Customer Segmentation and Commercial Dynamics"
    body: "Midi Health segments its commercial customer base across three primary operational channels: direct-to-consumer insured patients, employer-sponsored health benefit programs, and health system clinical partnerships [CU001, CU002]. Individual commercially insured women represent the foundation of visit volume, utilizing their existing commercial coverage across national payers to access specialized midlife care without the steep out-of-pocket fees typical of cash-pay telehealth competitors [CU001]. In the B2B2C space, Midi contracts directly with self-insured employers such as Stanford University and ServiceNow, as well as through specialized fertility and family benefits platforms like Progyny, to deliver menopause support as a covered workplace benefit [CU005]. Furthermore, regional health systems including Lifepoint Health collaborate with Midi to establish virtual clinical co-management pathways, providing midlife women with specialized telehealth access while directing physical diagnostic screenings back to regional health facilities [CU006]. While self-pay options exist for uninsured patients, Midi's commercial model is fundamentally insurance-native, capturing demand across commercial plans covering 45 million lives [CU004]."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU004"
      - "CU005"
      - "CU006"
    tableRefs:
      - "TU001"
  - id: "adoption-trajectory-and-covered-lives"
    title: "Adoption Trajectory, Covered Lives, and Volume Scaling"
    body: "Midi Health's adoption trajectory has accelerated substantially following its national expansion to all 50 U.S. states [CU002]. Disclosed operational metrics indicate that Midi conducts approximately 25,000 patient visits per week, reflecting a compounding referral loop driven by high patient demand for menopause specialization [CU003]. Cumulatively, the company reports having served more than 500,000 women nationwide, positioning Midi as the largest dedicated virtual clinic in the midlife women's healthcare category [CU003]. This expansion is supported by commercial payer agreements encompassing 45 million in-network covered lives across major carriers such as Aetna, Blue Cross Blue Shield, and Cigna [CU004]. To support this rapid scaling while meeting stringent state-by-state clinical licensing regulations, Midi automated its provider credentialing infrastructure, reducing physician and nurse practitioner onboarding turnaround times to 1 to 2 days [CU007]. However, external verification of weekly visit velocity remains reliant on executive disclosures, and reported patient volumes do not disaggregate initial diagnostic visits from subsequent refill encounters [CU003, CU014]."
    claimRefs:
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU007"
      - "CU014"
    tableRefs:
      - "TU002"
  - id: "patient-journey-and-care-navigation"
    title: "Patient Journey Architecture and Clinical Delivery"
    body: "The customer journey on Midi Health is designed around accessibility, evidence-informed symptom relief, and continuous clinical navigation [CU001, CU013]. Prospective patients initiate care through an online intake portal that captures comprehensive symptom profiles, medical histories, and commercial insurance details [CU001]. Following automated eligibility verification, patients attend virtual video consultations with licensed nurse practitioners or physicians specializing in midlife hormonal wellness [CU002]. Clinicians formulate individualized care plans combining prescription hormone therapy, non-hormonal medications, lifestyle recommendations, and targeted supplements [CU001]. Patient testimonials frequently highlight substantial relief from debilitating vasomotor symptoms, brain fog, and chronic sleep disruption within two to three months of starting therapy [CU013]. Nonetheless, independent clinical reviews note that Midi's workflow does not mandate baseline blood panels, thyroid tests, or lipid screenings prior to initiating systemic hormone therapy, nor does it integrate in-platform bone density (DEXA) scans, creating potential care coordination gaps between virtual visits and in-person primary healthcare [CU010, CU011]."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU010"
      - "CU011"
      - "CU013"
    figureRefs:
      - "FU001"
  - id: "named-proof-retention-and-regulatory-scrutiny"
    title: "Enterprise Deployment Proof, Retention Durability, and Regulatory Friction"
    body: "Midi's commercial traction is validated by marquee enterprise deployments across diverse employer and health system accounts [CU005, CU006]. Higher education and enterprise technology employers, including Stanford University and ServiceNow, have implemented Midi's platform to enhance employee midlife health benefits and reduce menopause-related workplace absenteeism [CU005]. Similarly, hospital networks such as Lifepoint Health partner with Midi to expand outpatient midlife specialty access [CU006]. In clinical communications, Midi highlights an internal retrospective electronic health record analysis of 58,709 patients demonstrating a 95% symptom improvement rate after completing three visits over at least 60 days [CU008]. However, Midi's commercial marketing faced regulatory headwinds in early 2026 when the National Advertising Division (NAD) challenged claims asserting that 91% of patients find relief within two months, leading Midi to permanently discontinue the marketing campaign [CU009]. Crucially, Midi has not published multi-year cohort retention rates (NRR/GRR) or peer-reviewed clinical outcome studies, leaving long-term patient durability as a critical diligence gap [CU012, CU014]."
    claimRefs:
      - "CU005"
      - "CU006"
      - "CU008"
      - "CU009"
      - "CU012"
      - "CU014"
    tableRefs:
      - "TU003"
