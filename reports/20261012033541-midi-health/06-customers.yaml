    title: "In-Network Insurance Integration Removes Telehealth Cash-Pay Friction"
    body: "Midi's in-network coverage across major commercial insurers covering 45 million lives provides a decisive structural advantage over direct-to-consumer competitors that charge $150 to $300 in monthly out-of-pocket fees."
    claimRefs:
      - "CU001"
      - "CU004"
  - calloutType: "risk"
    title: "Durability Gaps Persist Amid Regulatory Scrutiny Over Efficacy Claims"
    body: "While Midi reports high 60-day satisfaction across three visits, the lack of disclosed longitudinal cohort retention data combined with NAD scrutiny over advertised relief rates leaves long-term commercial durability unverified."
    claimRefs:
      - "CU008"
      - "CU009"
      - "CU014"
