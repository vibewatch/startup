      - number: '1.3'
        title: 融资历程、投资者联盟与指标披露缺口
        blocks:
          - type: paragraph
            body: >
              2021 年至 2026 年初，Midi Health 完成多轮风险投资，累计公开披露股权融资达 $140M。完成种子轮后，公司于 2023 年 9 月完成由 GV 领投的 $25M A 轮， 累计资本增至
              $40M。2024 年 4 月，Midi 完成由 Emerson Collective 领投的 $60M B 轮，累计融资增至 $100M，参与方包括 Memorial Hermann、SemperVirens、
              Felicis、Icon Ventures 及多个女性主导的投资联盟。2026 年 2 月，Midi 获得由 Goodwater Capital 领投的 $100M D 轮融资，参与方包括 Foresite
              Capital、 Impact Engine、Serena Ventures、Advance Venture Partners、Emerson Collective、GV 和 McKesson Ventures。

              尽管投资者持续支持、保险覆盖广泛，分析盲点仍然明显。二级市场报道和此前尽调轮次曾暗示其目标独角兽估值为 $1.0B、预计收入运行率为 $150M，
              但估值、毛利率、现金消耗和盈利时间表均没有公开提交主要交易确认文件。客户满意度也需要平衡审视：投资者沟通材料称患者满意度和临床症状改善率较高， 但 BBB National Advertising
              Division 于 2026 年 2 月对“两个月内症状完全缓解的患者比例”等未经验证的广告主张提出质疑，促使 Midi 自愿停止相关宣传。
