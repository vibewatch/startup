              Midi Health 扩大至全部 50 个美国州后，采用速度明显加快 [CU002]。披露的运营指标显示，Midi 每周约完成 25,000 次患者问诊，反映出由对绝经期专业服务的高需求驱动的复合转介循环
              [CU003]。 公司报告称累计在全国服务超过 500,000 名女性，使 Midi 成为中年女性医疗领域最大的专门虚拟诊所 [CU003]。 这轮扩张得到商业支付方协议支持，覆盖 Aetna、Blue
              Cross Blue Shield 和 Cigna 等主要承运方的 4,500 万名网络内参保人 [CU004]。 为支持快速扩张并满足逐州严格的临床许可规定，Midi
              自动化服务商资质认证基础设施，把医生和执业护士的入职周转时间降至 1 至 2 天 [CU007]。 但每周问诊速度仍主要依赖高管披露，外部尚未独立验证；报告的患者量也没有区分初次诊断问诊和后续续方问诊
