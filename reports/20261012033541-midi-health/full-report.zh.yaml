  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 虚拟医疗交付模式与临床服务线
        blocks:
          - type: paragraph
            body: >-
              Midi Health 通过专门的远程医疗模式提供中年女性临床医疗，重点覆盖围绝经期、绝经期及更广泛的激素变化。 平台让患者通过同步视频预约和异步数字消息，与获委员会认证的执业护士及监督医生连接，在全部 50
              个美国州提供服务。 初次诊断问诊后，临床医生会围绕 30 多种绝经期相关症状制定个性化护理方案。治疗方式包括处方激素替代疗法（全身口服及经皮 estradiol、微粒化 progesterone 和阴道
              estrogen）、 SSRI/SNRI 等非激素处方药、针对性的植物补充剂和生活方式干预。 传统直面消费者的数字诊所依赖每月 $150 至 $300 的自费订阅，而 Midi
              的主要商业差异化在于与主要地区性和全国性支付方建立直接网络内商业保险报销。 此外，公司还从核心血管舒缩症状缓解，扩展到代谢减重管理和面向有癌症病史女性的专业幸存者支持等相邻中年临床项目。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE012
              - CE013
