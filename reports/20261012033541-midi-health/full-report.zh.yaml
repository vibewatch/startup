        - 全国药品制造短缺导致患者流失
    notes: 依据已报告的 B2B 分销渠道、商业健康计划网络和医疗 IT 供应商披露评估。
    claimRefs:
      - CR007
      - CR008
      - CR009
      - CR012
  - id: TV001
    title: 建议摘要表
    columns:
      - 维度
      - 评估 / 评级
      - 支持性证据与基准
      - 对投资决策的含义
    rows:
      - - 核心建议
        - 需要进一步研究
        - 已展现临床规模（收入运行率 $150M、500 名临床人员），但估值溢价较高。
        - 在完成利润率结构的确认性尽调前，暂缓主要资本投入。
      - - 信心水平
        - 中
        - 对收入增长轨迹和融资资历信心较高；对单位盈利能力了解有限。
        - 定价后续轮次前，需要通过私有数据室核实 GAAP 指标。
      - - 风险评级
        - 高
        - 监管广告审查（NAD 停止程序）以及未经验证的纵向依从性。
        - 将提供方人力成本和付款方重新谈判报销带来的利润率压缩风险计入价格。
      - - 估值立场
        - 偏高
        - 隐含的 6.7x EV/运行率倍数已计入多专科品类扩张毫无瑕疵的情景。
        - 严格控制入场估值；争取下行保护性的清算优先权条款。
    notes: 建议和风险评级将公开确认的 Series D 融资指标与保密的私人运营经济数据结合评估。
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV009
      - CV011
  - id: TV002
    title: 正方论点 / 反方论点表
    columns:
      - 投资角度
      - 核心正方论点
      - 投资判断假设
      - 哪些变化会改变判断
    rows:
      - - 市场领导地位
        - Midi 是围绝经期领域定义品类的虚拟诊所，拥有全国保险网络内覆盖。
        - 商业付款方合同的先发优势建立了可守住的分销护城河。
        - 多专科竞争者（Maven、One Medical）加快签约付款方，侵蚀其份额。
      - - 护理平台规模化
        - 从更年期扩展至代谢健康、长寿和多专科慢病护理。
        - 交叉销售利润率更高的长寿和现金支付健康服务，提升患者终身价值。
        - 临床端反对扩大范围，或付款方拒绝报销附加健康服务。
      - - 技术运营杠杆
        - 专有 AI 分诊、病历审阅和文档软件提升提供方生产率。
        - AI 听录和自动事前授权让临床人员能够以盈利方式处理更多就诊量。
        - 临床人员高流失，或行政管理开支增长超过自动化带来的生产率提升。
      - - 估值与回报特征
        - 独角兽估值体现其作为领先中年女性健康纯标的的稀缺性溢价。
        - 高收入增长（从 $150M 运行率扩张）将推动业务成长至 $1.0B 估值。
        - 公开市场远程医疗倍数压缩（Teladoc、Hims）迫使公司下调轮次或平价延长融资。
    notes: 正方与反方观点将运营可规模化程度和竞争防御性与估值风险对照评估。
    claimRefs:
      - CV001
      - CV002
      - CV005
      - CV006
      - CV007
      - CV012
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 运营与财务假设
      - 估值与回报逻辑
      - 主要下行风险
      - 概率信号
    rows:
      - - 乐观情景
        - 收入年增长 45% 以上至 $300M 以上；毛利率扩张至 55%；多专科交叉销售成功。
        - EV 通过高增长医疗倍数（8x - 10x）达到 $2.5B - $3.0B；退出时净 MOIC 为 2.5x - 3.0x。
        - 新服务线执行失误，或联邦远程医疗报销收紧。
        - 25%（要求企业福利和 Medicare/Medicaid 采用均毫无瑕疵）
      - - 基准情景
        - 收入年增长 20-30% 至 $200M - $220M；毛利率停留在 40-45%；就诊量稳定。
        - EV 稳定在 $1.1B - $1.3B（5x - 6x 倍数）；资本回报为 1.1x - 1.3x，保住优先资本。
        - 付款方费率停滞和临床劳动力工资通胀限制自由现金流。
        - 55%（符合成熟虚拟护理业务的运营轨迹）
      - - 悲观情景
        - 增长放缓至 10% 以下；NP 流失导致利润率压缩；监管营销风波带来不利后果。
        - 估值下调至 $400M - $600M（2x - 3x 困境倍数）；股权大幅稀释。
        - 失去主要雇主健康计划合同，或被付款方网络排除。
        - 20%（若单位经济性无法证明运营杠杆，则触发）
    notes: 情景根据市场扩张率和退出倍数敏感性，对未来 3 年可能的业绩轨迹建模。
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV011
      - CV012
