      - number: '1.2'
        title: 管理层、临床顾问与关键人物结构
        blocks:
          - type: paragraph
            body: >
              Midi Health 由 CEO 兼联合创始人 Joanna Strober 领导；联合创始人兼总裁 Sharon Meers 曾任金融服务高管并担任作家。临床组织由 Kathleen Jordan
              医学博士负责， 她担任首席医疗官；Mindy Goldman 医学博士担任首席临床官，长期专注中年妇科及癌症幸存者的症状管理，学术和临床经验深厚。

              其他高管包括 CFO Jason Wheeler、CTO Jake Ramanathan、CMO Melissa Waters、首席商务官 Matt Cook、品牌创新负责人 Jill
              Herzig，以及首席健康系统官 Ariana Chehrazi。 公司把战略、融资和对外代表职责集中在 CEO Joanna Strober 身上，形成中等程度的关键人物依赖。机构董事代表包括
              GV（Google Ventures）的 Frederique Dame 和 Cathy Friedman， 但公开文件未披露完整董事会构成及投票控制约定。
            claimRefs:
