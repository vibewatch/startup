chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司定位与服务交付模式
        blocks:
          - type: paragraph
            body: >
              Midi Health, Inc. 是一家保险原生的虚拟医疗诊所，专注中年女性健康，重点覆盖围绝经期、绝经期、激素变化及相关慢性疾病。 公司成立于 2021 年，总部位于加州，由女性创始人 Joanna
              Strober 和 Sharon Meers 创立，旨在弥补成人女性医疗中的结构性缺口。 据估计，美国有 5,700 万名 40 至 64 岁女性出现相关症状，且近半数美国县没有执业 OB/GYN 专科医生。

              Midi 的核心模式是一家由专科执业护士提供服务、由医生监督的虚拟诊所。它不是要求患者全额自费的数字健康 App，而是直接与主要商业医疗保险支付方签约， 包括 Aetna、Anthem Blue Cross 和
              UnitedHealthcare，让患者按网络内常规共付额和免赔额获得虚拟问诊、诊断化验开单、生活方式辅导和处方管理， 包括激素替代治疗和非激素疗法。诊所最初在加州上线，随后于 2024 年 1 月具备覆盖全部
              50 个州的运营能力。
