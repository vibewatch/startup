      - number: '2.4'
        title: 增长驱动、采用瓶颈与监管约束
        blocks:
          - type: paragraph
            body: >-
              专业化虚拟中年医疗的采用，受到美国传统医疗体系严重的结构性医生短缺推动 [CM015]。近半数（49%）美国县没有执业 OB/GYN，只有 20% 的 OB/GYN 住院医毕业生接受过正式的绝经期医疗培训，
              数百万有症状女性只能在碎片化、甚至轻视患者的本地医疗服务中求医 [CM006, CM015]。由持证执业护士和标准化临床决策支持驱动的虚拟医疗， 直接弥补了全部 50 个州的地理可及性缺口 [CM001,
              CM013]。但扩张也面临明显的采用和监管限制。 营销表述受到严格审查：2026 年 2 月，National Advertising Division（NAD）质疑 Midi Health 关于 91%
              患者在两个月内缓解的主张， 迫使公司永久停止使用这一疗效指标 [CM014]。此外，缺少 Medicare 和 Medicaid 报销限制了面向老年人群的扩张， 而复配 GLP-1
              收入相对于核心绝经期问诊的贡献仍不透明，使企业收入的长期质量存在部分不确定性 [CM003, CM014]。
            claimRefs:
              - CM001
              - CM003
              - CM006
              - CM013
              - CM014
              - CM015
      - number: '2.5'
        title: 展示案例
        blocks:
          - type: callout
            title: 商业保险网络接入构成结构性分销壁垒
            body: >-
              与按月收取 $75 至 $200 订阅费的自费远程医疗竞争者不同，Midi Health 把服务设计成保险计费的临床实践，覆盖超过 4,500 万商业 PPO 参保人， 将患者问诊门槛降至通常 $0 至 $50
              的共付额，并把变现转向网络内报销收入。
            calloutType: insight
            claimRefs:
              - CM002
              - CM011
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与同业分层
        blocks:
          - type: paragraph
            body: >-
              虚拟绝经期和中年医疗行业分为保险原生医疗服务与直面消费者的自费订阅模式。Midi Health 主要作为网络内虚拟诊所运营，在 2026 年 2 月完成 $100M D 轮融资、估值超过 $1B
              后，把临床能力扩展至 500 多名接受过绝经期培训的临床人员，并在 50 个州服务超过 230,000 名患者。 专注中年激素变化的直接远程医疗同业包括 Evernow（融资
              $28.5M，提供数字化激素疗法），以及 Gennev、Elektra Health 和 Stella 等专业虚拟服务商。 同期，Kindr Health 和 Defy Medical
              等自费服务商面向希望无需保险导航、便捷获得激素替代疗法的女性，提供透明的月度现金订阅。 在企业端，Maven Clinic 和 Carrot Fertility
              等综合女性与家庭健康平台已把绝经期支持纳入企业雇主福利，形成企业福利合同的重叠竞争边界。
            claimRefs:
              - CP001
              - CP002
              - CP006
              - CP008
              - CP014
          - type: table
            tableRef: TP001
            claimRefs:
