  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、服务范围与支付方资格
        blocks:
          - type: paragraph
            body: >-
              Midi Health 将目标市场定义为中年女性医疗，建立了保险原生的临床服务，与传统偶发式妇科诊疗和直面消费者的自费远程医疗平台区分开来 [CM001]。
              公司不是异步开方漏斗或交易型自费市场，而是提供结构化视频问诊、纵向护理方案和诊断管理，覆盖围绝经期、绝经期及激素健康转变 [CM001, CM004]。 平台整合由医生监督的执业护士，开具 FDA
              批准的激素替代疗法（HRT）、基于证据的非激素药物（如 fezolinetant（Veoza））和代谢干预， 并通过 Labcorp 等全国合作伙伴安排影像和实验室检测 [CM002, CM004,
              CM013]。关键在于，临床边界严格区分支付方资格： 商业 PPO 计划和部分 Medicare Advantage 保单按网络内计费，但传统 Medicare、Medicaid 和 Medi-Cal
              完全不在覆盖范围内 [CM003]。 这一结构性排除使 Midi Health 的商业市场集中于有商业保险的家庭和自费消费者，并将其可服务人群与政府补贴的低收入医疗项目隔开 [CM003, CM010]。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM010
              - CM013
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: 可服务人群规模与估值测算视角
        blocks:
          - type: paragraph
            body: >-
              美国中年女性健康的可服务人口基础约为 5,700 万名 40 至 64 岁女性，是全国增长最快的人口群体 [CM005]。临床流行病学显示，其中约 84% 会出现血管舒缩、
              睡眠、心理或代谢症状，影响生活质量，对应近 4,800 万名有症状患者 [CM005, CM006]。行业分析师和会议演讲经常引用最高达 $120B 的自上而下全球机会， 或估计全球临床绝经期支出为
              $18B；但这些宽泛数字把宏观生产力损失、消费者健康零售和药品支出，与数字诊所能够获取的服务收入混为一谈 [CM007, CM008]。
              更扎实的测算视角是雇主经济影响：未管理的绝经期症状预计每年因缺勤和工作时长下降造成 $1.8B 的职场生产力损失 [CM006, CM008]。               从运营角度看，Midi Health
              已累计完成超过 500,000 次患者问诊，并在 50 个州维持约 230,000 名活跃患者，说明商业采用度可观， 同时也表明当前渗透率仍只是更广泛有症状人群的一小部分 [CM009, CM011]。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM011
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
