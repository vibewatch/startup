      - number: '4.2'
        title: 已报道的业务 traction 与销售效率信号
        blocks:
          - type: paragraph
            body: >-
              公开商业表现可观，但口径并不统一。Accio 报道收入运行率为 $150M、每月服务 20,000 名女性；Forbes 和 HIT Consultant 则报道每周接诊 25,000 名患者、覆盖 4,500
              万人。 这些指标的期间和分母不同：覆盖人数代表可服务的保险接入，周患者数代表服务量，收入运行率既不是 ARR，也不是经审计收入。 Forbes
              还报道称管理层优先发展转介，这可能意味着有机获客循环，但没有公开转介率、CAC、销售周期、转化率或回本周期。 这些信号支持商业势头，却不足以构成完整的销售效率或留存模型。
            claimRefs:
              - CI004
              - CI005
              - CI006
              - CI007
              - CI010
      - number: '4.3'
        title: 成本结构与单位经济性缺口
        blocks:
          - type: paragraph
            body: >-
              运营模式把持证临床人员产能、支付方管理和虚拟基础设施结合起来。Forbes 报道 Midi 使用 AI 进行文档处理、事先授权、排班和病历审查，
              这些信息说明，即便成本金额未披露，临床人员时间和报销流程仍是重要的成本与吞吐约束。 一份独立地点指南将其描述为主要提供虚拟服务，而非运营实体诊所网络，同时也指出州许可和人员产能是交付限制。
              留存证据没有提供每次就诊的临床人员成本、毛利率、贡献利润率、支付方收益率、队列留存或 LTV/CAC 比率。 官网关于 95% 症状改善的主张来自公司回溯性队列，不能证明留存、报销或单位盈利能力。
