      - number: '3.3'
        title: 定价模式、商业包装与支付方匹配
        blocks:
          - type: paragraph
            body: >-
              商业包装把中年医疗平台分成三种定价模式：保险报销共付额、消费者自费经常性会员，以及按员工每月收费的企业合同。 Midi Health 以商业保险参与为消费者接入基础，与 Aetna、BlueCross
              BlueShield 和 UnitedHealthcare 等主要 PPO 计划签约，使患者通常支付 $0 至 $50 的标准共付额。 在企业雇主渠道，Midi
              销售职场福利方案，不收取按员工每月（PEPM）费用，直接对标那些经常性 PEPM 收费、受到企业采购阻力的数字健康供应商。 相比之下，直面消费者的平台依靠透明的现金会员制；Kindr Health 首月收费
              $79，之后每月 $89，打包提供临床问诊、持续消息沟通和处方送货上门。 现金模式虽然避开支付方计费摩擦，但其可服务市场受消费者自费意愿限制。
            claimRefs:
              - CP001
              - CP005
              - CP008
              - CP012
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP005
              - CP008
              - CP012
              - CP013
      - number: '3.4'
        title: 壁垒持久性、监管风险与替代风险
        blocks:
          - type: paragraph
            body: >-
              Midi Health 的防御力主要来自支付方资质认证和监管合规壁垒，而非专有临床化学。与地区商业保险商签约，并让数百名临床医生取得 50 个州医疗委员会的资质，
              需要大量法律和行政投入，阻碍新进入者快速复制。然而，消费者健康营销受到监管审查，带来实质声誉风险。 2026 年 2 月，BBB National Programs 的 National Advertising
              Division 质疑 Midi Health 在社交媒体上声称 91% 患者在两个月内缓解的表述， 结果 Midi
              永久停止明示和暗示的疗效主张。此外，各州远程医疗许可、受控物质监管和药房配药要求不同，也限制了全国运营的无摩擦扩张。 随着竞争者进入 GLP-1 减重和长寿健康领域，保持严格的临床差异化并管理支付方审计风险，是
              Midi 的关键运营平衡。
            claimRefs:
              - CP004
              - CP007
              - CP011
              - CP015
      - number: '3.5'
        title: 展示案例
        blocks:
          - type: callout
            title: 保险原生资质认证构成可防御的分销壁垒
            body: >-
              Kindr 等 DTC 竞争者可在 24 小时内完成便捷的自费开户，但 Midi 覆盖超过 80% 商业 PPO 计划的全国保险合同构成根深蒂固的进入壁垒。 逐州完成服务商资质认证并谈判收费表，保护 Midi
              免受纯消费者远程医疗初创公司的快速商品化冲击。
            calloutType: insight
            claimRefs:
              - CP001
              - CP004
              - CP005
              - CP008
          - type: callout
            title: 临床症状营销受到监管监督
            body: >-
              2026 年 2 月，National Advertising Division 要求 Midi 停止宣称 91% 患者在两个月内缓解，说明临床疗效主张正受到更严格审查。
              随着竞争加剧，虚拟诊所必须用同行评审的真实世界证据支持营销信息，而不是只依赖方向性的患者调查。
            calloutType: risk
            claimRefs:
              - CP007
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与定价证据
        blocks:
          - type: paragraph
            body: >-
              Midi 披露的商业模式以报销型虚拟临床服务为核心：官网称其与大多数主要保险商建立网络内关系，外部评测则称其直接向商业支付方收费。
              公司提供自费服务，但提醒患者免赔额、共同保险和共付额因计划而异；留存来源没有提供当前官方问诊价格或实际报销表。
              官网还营销健康产品，形成合理的辅助销售收入来源，但产品收入和收入结构均未披露。因此，网络接入和支付方覆盖不应被当作已确认收入、回款或利润率。
              投资判断需要允许金额、拒付和调整率、支付方结构、回款时间及服务线收入确认政策。
            claimRefs:
