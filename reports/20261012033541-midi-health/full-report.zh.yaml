  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 从最初意识到症状并核验保险，到持续临床咨询、多学科转诊和长期维护的患者全生命周期。
    approximationNotes: 工作流阶段和触点综合自已发布的临床描述、患者入组文档和保险核验流程。
    claimRefs:
      - CU001
      - CU002
      - CU007
      - CU010
      - CU013
    data:
      items:
        - id: stage-1-awareness
          label: 症状出现与认知
          description: 患者出现围绝经期或绝经期症状，包括血管舒缩症状、脑雾和睡眠障碍。
          touchpoints:
            - 数字健康搜索
            - 口碑转介
            - 雇主福利门户
          painPoints:
            - Symptoms frequently dismissed by traditional primary care clinicians
            - Uncertainty regarding evidence-based hormone therapy options
        - id: stage-2-intake
          label: 数字化接诊与保险核验
          description: 患者在线注册、填写健康史问卷，并核验商业保险资格。
          touchpoints:
            - 在线接诊门户
            - 自动化保险核验引擎
            - Salesforce 可验证凭证核查
          painPoints:
            - Prior authorization requirements across select commercial formularies
            - Variable copay and deductible transparency
        - id: stage-3-consultation
          label: 远程临床问诊
          description: 与接受过中年女性健康培训的专科认证临床医生进行 15 至 30 分钟的完整视频问诊。
          touchpoints:
            - 安全的远程医疗视频问诊
            - 全面症状评估
            - 制定护理计划
          painPoints:
            - Absence of mandatory baseline blood panel or metabolic lab requirements
            - State-by-state provider licensing constraints
        - id: stage-4-treatment
          label: 启动治疗与配药
          description: 临床医生开具 FDA 批准的激素治疗或非激素方案，并将处方发送至患者当地的零售药房。
          touchpoints:
            - 电子处方发送
            - 生活方式指导建议
            - 循证补充剂指导
          painPoints:
            - Pharmacy stockouts of specific transdermal estradiol patches
            - Lack of integrated compounding pharmacy workflows
        - id: stage-5-followup
          label: 两个月随访与调整
          description: 通过结构化随访评估症状缓解情况、调整激素剂量并监测副作用。
          touchpoints:
            - 预约远程医疗复诊
            - EHR 症状跟踪问卷
            - 异步消息支持
          painPoints:
            - Discontinued marketing claims regarding guaranteed symptom elimination
            - Lack of structured cardiovascular risk or blood pressure monitoring recall
        - id: stage-6-maintenance
          label: 长期维护与转诊
          description: 持续优化中年健康、协调预防性筛查并管理年度续期。
          touchpoints:
            - 年度临床复查
            - 乳腺钼靶检查及实验室检查转诊单
            - 专科医生协同管理
          painPoints:
            - Lack of in-platform DEXA bone density screening integration
            - Incomplete public data on multi-year patient cohort retention
