      - number: '5.2'
        title: 技术架构、环境式 AI 文档与 EHR 集成
        blocks:
          - type: paragraph
            body: >-
              支撑 Midi 临床团队的核心技术架构，把云托管电子健康记录与专门的生成式 AI 文档工具结合起来。 Midi 与 Ambience Healthcare 合作，将环境式临床 AI 操作系统直接嵌入
              Athenahealth EHR 环境。 患者视频问诊时，Ambience AutoScribe 实时聆听并自动生成跨专科的完整问诊记录；AutoCDI 则分析问诊对话和历史病历，核验 ICD-10
              诊断代码、CPT 操作代码及临床依据是否准确匹配。 据报道的运营指标，该环境式书写集成每天为 Midi 临床医生节省超过 3 小时行政文档时间，使新临床人员的入职周期缩短 50%，并让服务商每天接诊更多患者。
              除了转录问诊记录，AI 工具还优化文档，使其满足商业支付方事先授权标准，降低专门激素替代疗法的拒付风险。 为改善诊断分流，Midi 还把 Neurotrack
              的数字认知筛查评估接入工作流，帮助临床医生区分良性的绝经期脑雾与神经退行性认知障碍的早期迹象。
            claimRefs:
              - CE004
