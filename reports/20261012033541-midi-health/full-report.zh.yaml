      - number: '2.3'
        title: 买方分层、商业支付方经济性与定价结构
        blocks:
          - type: paragraph
            body: >-
              Midi Health 的商业模式面向三类买方：有商业保险的患者、企业雇主赞助方和自费消费者 [CM010]。与无论使用多少都收取每月 $75 至 $200 现金订阅费的直接竞争者相比， Midi
              借助网络内商业保险协议，覆盖 Aetna、Blue Cross Blue Shield、Cigna 和 UnitedHealthcare 等主要承运方的约 4,500 万名女性 [CM002, CM011]。
              商业保险把患者自付摩擦压到通常的基层医疗共付额，平均为 $0 至 $50，使收入实现更多依赖商业保险报销 [CM002, CM011]。 对网络外或无保险人群，Midi 按次收费：首次 30 分钟评估
              $250，15 分钟复诊 $150；这对偶尔复诊的患者更划算，却会给高频使用的无保险患者形成价格门槛 [CM012]。 在代谢服务线中，复配 GLP-1 疗法的营销价格为每四周供应起价
              $164，形成自费的经常性收入层，拓宽核心问诊保险收入之外的客户变现 [CM004, CM010]。
            claimRefs:
              - CM002
              - CM004
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
