        blocks:
          - type: paragraph
            body: >-
              Midi Health 的商业客户分为三条主要运营渠道：直面消费者的有保险患者、雇主赞助的健康福利项目和医疗系统临床合作 [CU001, CU002]。
              个人商业保险女性构成问诊量基础，她们利用全国支付方的既有商业保险，以无需承担自费远程医疗竞争者高额费用的方式获得专业中年医疗 [CU001]。 在 B2B2C 领域，Midi 直接与 Stanford
              University、ServiceNow 等自保雇主签约，也通过 Progyny 等专业生育和家庭福利平台，把绝经期支持作为有保险覆盖的职场福利提供 [CU005]。 此外，Lifepoint Health
              等地区医疗系统与 Midi 合作建立虚拟临床共同管理路径，为中年女性提供专业远程医疗，同时把实体诊断筛查转回地区医疗机构 [CU006]。 无保险患者也可以选择自费，但 Midi 的商业模式本质上是保险原生，覆盖
              4,500 万人商业计划中的需求 [CU004]。
