      - number: '5.3'
        title: 临床范围边界、诊断缺口与监管治理
        blocks:
          - type: paragraph
            body: >-
              尽管运营扩张迅速、患者满意度报道较高，独立临床评估仍指出 Midi 虚拟医疗模式存在实质性结构边界。
              首要缺口是没有强制性的治疗前实验室评估：患者开始全身激素治疗前，无需完成基线甲状腺、空腹血糖或血脂检查，可能漏掉亚临床代谢异常或禁忌症。 此外，Midi 的虚拟模式没有整合内部双能 X
              线吸收测量（DEXA）骨密度开单、骨折风险跟踪或结构化心血管血脂复查周期，使长期预防筛查依赖外部基层医疗协调。
              处方仍需通过商业零售药房流转，限制患者获得定制复配生物同质激素，也限制针对女性性欲减退障碍的超说明书睾酮疗法。 从监管和治理角度看，Midi 于 2026 年 2 月因宣传“91% 患者在两个月内症状缓解”受到
              National Advertising Division（NAD）审查；调查期间，Midi 永久停止了相关主张。 此外，Midi
              尚未发布经同行评审的纵向队列研究，验证其患者群体的临床疗效或症状缓解，长期结果仍未获独立医学文献验证。
            claimRefs:
              - CE008
              - CE009
              - CE010
              - CE011
              - CE014
