      - number: '3.2'
        title: 能力差异化与临床定位
        blocks:
          - type: paragraph
            body: >-
              Midi Health 通过覆盖 30 多种绝经期相关症状、以证据为基础的多模式方案来区分自身。Midi 临床医生不仅提供激素替代疗法，还会开具全身和局部 HRT 贴剂与乳膏、
              非激素药物、定制补充剂，安排代谢血液检测并提供生活方式干预。2025 年，Midi 通过 AgeWell 扩大临床边界：
              这是一个由保险覆盖的长寿项目，包含年度预防性血液检查、心血管跟踪和骨健康筛查，旨在让患者关系延续到急性血管舒缩症状之外。 相比之下，直面消费者的替代服务更强调快速履约和辅助代谢疗法。例如 Kindr Health
              将生物同质激素疗法与 semaglutide、tirzepatide GLP-1 减重疗法及 NAD+ 细胞健康方案结合， 承诺 24 小时内医生审查、数日内送货上门。但 DTC
              自费服务缺少深度医疗系统合作和网络内保险接入，传统妇科诊所则往往缺乏中年女性医疗培训。
            claimRefs:
              - CP002
