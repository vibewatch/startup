              这只能证明募集到资本，并不代表当前可用现金：留存来源没有披露资产负债表现金、月度烧钱、债务、营运资金需求、现金跑道、资金使用计划或下一轮触发条件。 广告证据问题也是财务风险，因为 National
              Advertising Division 称 Midi 永久停止了一项受到质疑的“两个月内症状缓解”主张；NAD 没有裁定实质是非，
              因此不能把记录夸大为不利的疗效结论。财务结论因此是混合的：规模和保险商覆盖前景可观，但毛利率持久性、收入质量、资本强度和现金跑道尚不足以纳入投资判断。
