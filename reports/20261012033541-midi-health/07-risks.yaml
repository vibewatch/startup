callouts:
  - calloutType: "risk"
    title: "Regulatory Scrutiny on Efficacy Claims Demands Rigorous Clinical Substantiation"
    body: "The National Advertising Division's challenge and Midi's subsequent withdrawal of its 91% symptom relief marketing claim underscore that consumer-facing telehealth platforms face heightened regulatory expectations. Without peer-reviewed clinical cohort studies, promotional claims remain exposed to regulatory action."
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR006"
  - calloutType: "insight"
    title: "Commercial In-Network Contracting Drives Volume but Constrains Unit Economics"
    body: "While accepting commercial health insurance provides a powerful patient acquisition flywheel compared to out-of-pocket cash pay models, it leaves Midi vulnerable to payer rate cuts and administrative friction. Achieving sustainable operating margins requires robust gross margin disclosure."
