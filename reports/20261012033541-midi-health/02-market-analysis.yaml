        - High-growth adjacent service line expanding midlife longitudinal patient lifetime value
      - - Employer Menopause Benefits
        - Enterprise health navigation, covered employee telehealth visits, care coordination and absenteeism reduction programs
        - Direct enterprise off-the-shelf health plan underwriting, mandatory unbundled employer retainers
        - Enterprise employer HR sponsors, benefits platforms (Cleo)
        - Institutional B2B adoption channel reducing corporate productivity loss from menopause
