        - Selected Medicare Advantage plan visit coverage on an in-network basis
        - Traditional Medicare, Medicaid, and Medi-Cal visit reimbursement or claim filing
        - Self-pay beneficiaries (no reimbursement filing permitted)
        - Major structural TAM boundary excluding low-income and traditional Medicare populations
