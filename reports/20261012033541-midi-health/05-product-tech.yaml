    body: "Deploying Ambience AutoScribe and AutoCDI alongside Athenahealth EHR allows Midi clinicians to save an estimated 3 hours daily on administrative charting, directly expanding provider panel capacity without lowering clinical encounter depth."
    claimRefs:
