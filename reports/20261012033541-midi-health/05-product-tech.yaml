  - calloutType: "risk"
    title: "Clinical Scope Boundaries and Preventative Diagnostic Gaps"
    body: "By omitting mandatory baseline blood panels, in-house DEXA bone density ordering, and structured cardiovascular recall cadences, Midi risks treating acute menopausal symptoms in isolation from broader systemic health risks."
