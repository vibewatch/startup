company:
  name: "Midi Health"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Founded in 2021 by Joanna Strober and Sharon Meers, Midi Health operates an insurance-covered virtual clinic providing clinical care for women navigating perimenopause and menopause across all 50 U.S. states. The company has raised $140M in disclosed institutional equity funding across its Seed, Series A, Series B, and February 2026 Series D rounds led by Goodwater Capital, Emerson Collective, and GV, but key operating metrics including valuation, cash burn, and exact headquarters remain private."
sections:
  - id: identity-and-business-model
    title: "Company Identity and Care Delivery Model"
    body: >
      Midi Health, Inc. is an insurance-native virtual healthcare clinic dedicated to midlife women's health, specifically targeting perimenopause, menopause, hormonal shifts, and related chronic conditions. Founded in 2021 and based in California, the company was established by female founders Joanna Strober and Sharon Meers to address structural deficits in adult female healthcare, where an estimated 57 million U.S. women aged 40 to 64 experience symptoms and nearly half of U.S. counties lack practicing OB/GYN specialists.


      Midi's core operating model functions as a virtual clinic powered by specialized nurse practitioners and overseen by physicians. Rather than operating as an out-of-pocket cash-pay digital health app, Midi contracts directly with major commercial health insurance payers—including Aetna, Anthem Blue Cross, and UnitedHealthcare—allowing patients to access virtual consultations, diagnostic lab orders, lifestyle coaching, and prescription management (including hormonal replacement therapy and non-hormonal therapeutics) under standard in-network copays and deductibles. Following its initial rollout in California, the clinic reached full 50-state operating capacity in January 2024.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
      - CO005
      - CO006
    tableRefs:
      - TO001

  - id: leadership-and-governance
    title: "Executive Leadership, Clinical Advisory, and Key-Person Structure"
    body: >
      Midi Health is led by Chief Executive Officer and Co-Founder Joanna Strober, a serial entrepreneur and investor, alongside Co-Founder and President Sharon Meers, a former financial services executive and author. The clinical organization is directed by Kathleen Jordan, MD, who serves as Chief Medical Officer, and Mindy Goldman, MD, who serves as Chief Clinical Officer and brings extensive academic and clinical expertise in midlife gynecology and cancer-survivor symptom management.


      The broader executive bench includes Chief Financial Officer Jason Wheeler, Chief Technology Officer Jake Ramanathan, Chief Marketing Officer Melissa Waters, Chief Commercial Officer Matt Cook, Head of Brand Innovation Jill Herzig, and Chief Health Systems Officer Ariana Chehrazi. The executive structure concentrates strategic, fundraising, and external representation duties in CEO Joanna Strober, creating moderate key-person dependence. While institutional board representatives include Frederique Dame and Cathy Friedman from GV (Google Ventures), full board of directors composition and voting control covenants remain undisclosed in public filings.
    claimRefs:
      - CO007
      - CO008
      - CO009
    tableRefs:
      - TO002

  - id: capitalization-and-scale
    title: "Financing History, Investor Syndicate, and Metric Disclosure Gaps"
    body: >
      Between 2021 and early 2026, Midi Health completed multiple rounds of venture capital financing, bringing cumulative publicly disclosed equity funding to $140M. Following initial seed financing, the company raised a $25M Series A round led by GV in September 2023, expanding total capital to $40M. In April 2024, Midi closed a $60M Series B financing round led by Emerson Collective, which expanded total funding to $100M with participation from Memorial Hermann, SemperVirens, Felicis, Icon Ventures, and prominent female-led syndicates. In February 2026, Midi secured $100M in Series D funding led by Goodwater Capital, with participation from Foresite Capital, Impact Engine, Serena Ventures, Advance Venture Partners, Emerson Collective, GV, and McKesson Ventures.


      Despite sustained investor backing and widespread insurance coverage, significant analytical blind spots persist. While secondary market reports and previous diligence rounds suggested an aspirational unicorn valuation of $1.0B and an estimated $150M revenue run-rate, primary transaction confirmations for valuation, gross margin, cash burn, and profitability timelines have not been publicly filed. Similarly, customer satisfaction metrics require balanced scrutiny: while investor communications cite high patient satisfaction and clinical symptom relief, regulatory monitoring by the BBB National Advertising Division in February 2026 challenged unverified advertising claims regarding the percentage of patients experiencing complete symptom relief within two months, leading Midi to voluntarily discontinue the promotional statements.
    claimRefs:
      - CO010
      - CO011
      - CO012
      - CO013
      - CO014
      - CO015
    tableRefs:
      - TO003
    figureRefs:
      - FO001

