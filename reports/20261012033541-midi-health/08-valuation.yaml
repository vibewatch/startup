callouts:
  - calloutType: recommendation
    title: 'Underwriting Posture: Disciplined Hold at Current Unicorn Pricing'
    body: While Midi Health has achieved remarkable scale with over 230,000 patients served and 25,000 weekly visits, the $1.0 billion Series D valuation represents a fully priced multiple of approximately 6.7x on estimated $150 million revenue run rate. Investors should maintain a 'research-more' stance until confidential diligence confirms baseline gross margin sustainability, customer acquisition efficiency, and cohort retention dynamics.
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV006
  - calloutType: risk
    title: Regulatory Scrutiny and Clinical Delivery Tradeoffs
    body: The NAD inquiry resulting in the discontinuance of Midi's marketing claims, alongside independent critiques regarding the absence of mandatory pre-treatment laboratory panels, underscores that aggressive commercial growth must be balanced with strict clinical rigor. Expanding into metabolic health and longevity increases regulatory exposure and operational complexity across state medical boards.
    claimRefs:
      - CV009
      - CV010
