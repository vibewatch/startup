evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-performance
    missingEvidence: >-
      Audited financial statements confirming revenue run-rate, net margins, cash burn rate, and official post-money
      equity valuation.
    whyItMatters: >-
      Without verified financial disclosures, valuation multiples and breakeven horizons cannot be rigorously
      underwritten.
    diligencePath: Request confidential disclosure schedule, GAAP revenue statements, and latest 409A valuation report under NDA.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: minor
    topic: governance
    missingEvidence: >-
      Complete board of directors roster, voting covenants, and protective provisions across Series B and D preferred
      share classes.
    whyItMatters: >-
      Assessing board governance and investor control rights requires visibility into voting agreements beyond announced
      lead investor board seats.
    diligencePath: Review amended certificate of incorporation and investor rights agreement filed with state corporate registries.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: som-service-line-segmentation
    missingEvidence: >-
      Audited breakdown of Midi Health net revenue run rate and patient volume between core insurance-reimbursed
      menopause consults versus out-of-pocket compounded GLP-1 weight management subscriptions.
    whyItMatters: >-
      Disclosing the revenue mix is critical to underwrite unit economics, gross margins, and regulatory vulnerability,
      as compounded GLP-1 offerings carry distinct legal and margin profiles compared to insurer-billed menopause care.
    diligencePath: >-
      Request confidential service-line contribution margin reports, payer reimbursement remittances, and active
      prescription cohort splits during management diligence.
    relatedQuestionRefs:
      - QM009
  - type: private-evidence-only
    severity: material
    topic: competitors
    missingEvidence: >-
      Audited contracted reimbursement yield, visit-level commercial allowable rates, and gross margins across
      commercial payer contracts.
    whyItMatters: >-
      Without disclosed payer fee schedules, underwriting the unit economics of Midi's insurance-native model against
      cash-pay DTC competitors remains incomplete.
    diligencePath: >-
      Request payer contract schedules, average realized reimbursement per visit, and cohort contribution margins during
      confidential diligence.
    relatedQuestionRefs:
      - QP009
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: reimbursement-yield
    missingEvidence: >-
      Payer mix, contracted allowed amounts, coding mix, denials, contractual adjustments, patient responsibility,
      collection timing, and service-line recognized revenue.
    whyItMatters: Insurance access and billed activity do not establish realized revenue quality or gross-to-net performance.
    diligencePath: >-
      Reconcile encounter-level claims and patient balances to cash collections and recognized revenue by payer and
      service line.
    relatedQuestionRefs:
      - QI003
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Clinician cost per encounter, support and billing cost, gross margin, contribution margin, cohort retention, CAC
      by channel, referral conversion, LTV, and payback.
    whyItMatters: Without these inputs, reported scale cannot demonstrate profitable growth or durable operating leverage.
    diligencePath: Obtain service-line contribution P&Ls and acquisition and retention cohorts tied to cash collections.
    relatedQuestionRefs:
      - QI003
      - QI004
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Current cash, gross and net burn, debt and covenants, working-capital needs, planned use of Series D proceeds,
      downside runway, and next-round triggers.
    whyItMatters: >-
      Funding raised is not cash available, and no public evidence establishes how long the current capital base can
      support expansion.
    diligencePath: >-
      Review bank statements, debt documents, monthly cash-flow history, board-approved operating plan, and
      scenario-based runway.
    relatedQuestionRefs:
      - QI005
      - QI009
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: clinical-validation
    missingEvidence: >-
      Peer-reviewed longitudinal cohort studies publishing patient-reported outcome measures, symptom reduction
      duration, and safety profiles from Midi's clinical population.
    whyItMatters: >-
      Without peer-reviewed longitudinal outcomes data, clinical efficacy claims rely primarily on internal marketing
      surveys and self-reported satisfaction metrics.
    diligencePath: >-
      Request retrospective cohort analysis of vasomotor symptom scores and treatment persistence across initial 10,000+
      treated patients.
    relatedQuestionRefs:
      - QE009
  - type: private-evidence-only
    severity: minor
    topic: clinical-limitations
    missingEvidence: >-
      Standard operating procedures and clinical protocols governing DEXA bone density screening referrals and routine
      cardiovascular lipid follow-up intervals.
    whyItMatters: >-
      Lack of integrated baseline laboratory and imaging protocols creates care coordination gaps for patients utilizing
      virtual care as their primary midlife health access point.
    diligencePath: Review internal clinical guidelines and electronic health record order sets for preventative screening handoffs.
    relatedQuestionRefs:
      - QE007
  - type: missing-source
    severity: minor
    topic: developer-signal
    missingEvidence: >-
      Public developer platform, code repository, or practitioner API technical metrics for Midi Health's proprietary
      clinical decision support systems.
    whyItMatters: >-
      As a regulated healthcare delivery organization utilizing proprietary internal clinical portals rather than
      developer-facing APIs, Midi exhibits no direct public software engineering telemetry.
    diligencePath: >-
      Assess practitioner engineering presentations, patent disclosures, and integration technical documentation with
      Athenahealth and Ambience.
  - type: missing-source
    severity: material
    topic: retention-and-churn
    missingEvidence: >-
      Audited cohort-based net revenue retention (NRR), gross revenue retention (GRR), and longitudinal patient visit
      churn curves beyond the initial 60-day window.
    whyItMatters: >-
      Without multi-year cohort retention data, patient lifetime value cannot be validated independently of ongoing
      marketing customer acquisition costs.
    diligencePath: >-
      Request anonymized 12-month and 24-month longitudinal retention data segmented by commercial insurance plan vs
      employer-sponsored benefit channels.
    relatedQuestionRefs:
      - QU008
  - type: missing-source
    severity: material
    topic: peer-reviewed-evidence
    missingEvidence: >-
      Independent, peer-reviewed clinical outcome validation studies assessing long-term symptom relief and treatment
      adherence from Midi's patient cohort.
    whyItMatters: >-
      Reported efficacy metrics currently rely exclusively on internal retrospective EHR analyses of self-reported
      surveys from active patients.
    diligencePath: >-
      Review forthcoming publications from the newly established Midi Research Institute and evaluate external registry
      collaborations.
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-proof-table
    missingEvidence: >-
      Complete contract roster and customer concentration metrics across all enterprise employer and health system
      accounts.
    whyItMatters: >-
      Enterprise revenue contribution and customer concentration risks cannot be fully evaluated without comprehensive
      client disclosures.
    diligencePath: >-
      Request customer concentration breakdown and revenue contribution from top 10 enterprise accounts under
      confidentiality agreements.
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: financial-metrics
    missingEvidence: Audited monthly cash burn, gross margin by payer contract, and current cash runway figures.
