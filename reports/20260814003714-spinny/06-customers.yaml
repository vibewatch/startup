  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: Repeat purchase rate, referral conversion cohorts, and segment-level retention curves.
    whyItMatters: Official referral and satisfaction claims are encouraging, but investors need true cohort behavior to underwrite durable customer economics.
    diligencePath: Request buyer and seller cohort retention, repeat-purchase rate, and NPS data by city and segment.
  - type: missing-source
    severity: material
    topic: complaint denominator
    missingEvidence: Complaint incidence per thousand transactions and median resolution time.
    whyItMatters: Complaint anecdotes are meaningful, but without denominators they can either overstate or understate execution risk.
    diligencePath: Request internal complaint-rate dashboard and compare with external review volumes.
  - type: enumeration-incomplete
    severity: minor
    topic: named customer proof table
    missingEvidence: A more representative panel of buyer and seller cases across cities and segments.
    whyItMatters: Current proof is anecdotal and self-selected.
    diligencePath: Add recent, named buyer and seller interviews or public testimonials with transaction details.
    relatedTableRefs:
    - TU003
