chapter:
  number: 6
  title: Customers
  summary: 'Spinny has enough official and independent evidence to support a meaningful consumer franchise: 2 lakh+ claimed customers, strong referral and conversion signals, and abundant review evidence from both buyers and sellers. The same source set also shows that post-sale support, RC transfer, and workflow consistency remain the most important friction points, meaning customer quality is good but not uniformly solved.'
sections:
- id: customer-base-and-segments
  title: Customer base and core segments
  body: 'Spinny is a consumer marketplace, so customer analysis must separate official scale claims from independent proof. The best official customer markers are all concentrated on the company''s about page: more than 2 lakh happy customers, a 4.8/5 review marker, 35% referrals, over 70% first-test-drive conversion, and a 32% women customer quotient. Those data points, combined with IPO reporting that the platform serves buyers across 25 cities and sellers across more than 100 cities, support the view that Spinny has already achieved meaningful consumer breadth. The business is not just buyer-facing either; sellers are clearly part of the customer base because the platform must aggregate supply as well as close demand.


    Segment-wise, the retained evidence points to first-time used-car buyers, value-conscious families, premium / luxury buyers via Spinny Max, and sellers seeking a managed exit route. Public evidence for B2B customers is weak, so the cleanest conclusion is that Spinny remains overwhelmingly B2C. That keeps customer concentration tied more to city execution and service quality than to a handful of enterprise accounts.'
