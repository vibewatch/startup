- id: pain-points-and-adverse-signals
  title: Pain points and adverse signals
  body: 'The strongest recurring adverse pattern across retained review and complaint sources is not that customers cannot find cars; it is that support, paperwork, and RC transfer sometimes break after the transaction should have felt complete. ConsumerComplaints, Consumer Complaints Court, LawRato, and formal case pages all show the same cluster of issues: RC transfer delays, name mismatches, unresolved service problems, payout or hold disputes on the seller side, and frustration with post-sale communication. This does not negate the positive proof in reviews, but it does show that the weakest part of the customer journey is often the long tail of paperwork and issue resolution rather than the initial promise.


    That matters because a service-first consumer brand is judged most harshly when back-office execution fails. If Spinny wants to sustain its referral engine and first-test-drive conversion, it must make the post-sale experience as reliable as the pre-sale pitch.'
  claimRefs:
  - CU015
  - CU016
  - CU017
  - CU018
  - CU019
  - CU020
