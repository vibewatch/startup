chapter:
  number: 2
  title: Market Analysis
  summary: India's used-car market is large and growing quickly, but Spinny's real opportunity sits inside the narrower organized, trust-led, finance-enabled segment rather than the full informal market. Retained sources support a constructive demand outlook—5.6 million used cars sold in FY25, more than 6 million expected in FY26, and organized share still well below a majority—while also showing that local-dealer persistence and capital intensity remain major constraints.
sections:
- id: market-boundary-and-size
  title: Market boundary and headline size
  body: 'Spinny participates in the organized slice of India''s used-car market, not in the full universe of all peer-to-peer or informal vehicle trades. That distinction matters because headline market-size numbers are easy to overstate if they ignore the real constraints on formal retail: inspection capacity, financing access, title transfer, trust, and intercity logistics. The broadest retained estimate comes from Mordor Intelligence, which places the India used-car market at about $36.39 billion in 2025 and $41.74 billion in 2026, with a 14.72% CAGR through 2031. Those numbers are directionally useful, but they cover a market still dominated by fragmented local dealers and unorganized transactions.


    For Spinny, the most relevant market signal is not just total spend but the shift toward organized, certified, and financed transactions. Redseer and Spinny''s own positioning both point to trust-building as the core unlock. That supports a narrower SAM logic: the monetizable pool is the urban, digitally discoverable, higher-trust segment where inspection, financing, and logistics meaningfully change the customer decision. Investors should therefore treat TAM as a boundary condition and organized-share migration as the real underwriting variable.'
