  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: market-size
    missingEvidence: One reconciled independent estimate for India's organized certified used-car subsegment.
    whyItMatters: Spinny competes in a narrower slice than headline used-car TAM, so using one broad market number can inflate underwriting assumptions.
    diligencePath: Triangulate organized-share assumptions using dealer counts, financing attach, and city-level inventory data.
  - type: private-evidence-only
    severity: material
    topic: Spinny SAM
    missingEvidence: Spinny management view on real SAM by city cluster, price band, and financing attach rate.
    whyItMatters: A pre-IPO company can look large on TAM while still being constrained by hub density and credit conversion.
    diligencePath: Request city-level GMV, take-rate, and financed-transaction mix from management.
  - type: stale
    severity: minor
    topic: market range
    missingEvidence: A 2026 or 2027 refreshed benchmark from one publisher using identical methodology across years.
    whyItMatters: Publisher methods vary materially, making trend lines hard to compare.
    diligencePath: Prefer same-publisher time series or create a normalized internal range file.
