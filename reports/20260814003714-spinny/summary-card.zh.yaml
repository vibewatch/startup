  topStrengths:
    - Spinny 经营信任驱动的全栈二手车模式，真正掌控运营，而不是薄薄一层分类信息。
    - FY25 收入约 Rs 4,657 crore，显示品类级需求和显著执行进展。
    - 品牌、检测、质保和流程控制，让它相较印度大量非正规二手车交易有更清晰的质量主张。
    - 若整合成功，GoMechanic 交易可把 Spinny 从交易经济延伸到售后变现。
    - IPO 准备动作和强劲投资人支持，保留了战略可选性。
  topRisks:
    - 私营公司不透明，使利润率、现金流、营运资本强度和正常化单位经济披露不足。
    - GoMechanic 整合在 IPO 前敏感阶段增加执行、治理和分心风险。
    - 客服、RC 转移和售后流程摩擦，如果随规模扩大拉低服务质量，会伤害信任护城河。
    - Cars24、CarDekho、OEM 支持渠道和分类信息导向替代方案的竞争，可能压制增长和定价。
    - 二手车零售仍重资本、重运营，因此公开市场对汽车电商倍数的情绪很重要。
  unresolvedGaps:
    - 毛利率、贡献利润率和经营现金流的经审计可见度仍不可得。
    - GoMechanic 的备考经济性和整合里程碑，公开披露还不够详细。
    - 客户留存、投诉率分母和复购队列仍不透明。
    - 相对于 Cars24、CarDekho、OEM 渠道和本地既有玩家的真实全印度市场份额，目前只被部分衡量。
    - IPO 时间、申报准备度，以及投资人在公开流程中愿意接受的估值仍不确定。
