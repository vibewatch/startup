evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Current board roster, investor ownership, and liquidation preference terms.
    whyItMatters: >-
      IPO readiness and downside recovery depend on who controls the company and how preferences stack ahead of common
      equity.
    diligencePath: Request the current cap table, board observer list, and key shareholder-rights schedule from management.
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: material
    topic: funding
    missingEvidence: One reconciled lifetime capital-raised number across equity and any debt-like facilities.
    whyItMatters: Public profiles disagree on total funding, which clouds dilution and investor support analysis.
    diligencePath: Reconcile official round announcements against a financing ledger from the company or a trusted database.
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: minor
    topic: headcount and TO002 leadership coverage
    missingEvidence: Official headcount disclosure or a more reputable independent staff marker.
    whyItMatters: Late-stage company scale is often overstated in profile sites, making operating leverage harder to judge.
    diligencePath: >-
      Use an official careers or annual disclosure update, or a reputable workforce dataset, before treating headcount
      as exact.
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: material
    topic: market-size
    missingEvidence: One reconciled independent estimate for India's organized certified used-car subsegment.
    whyItMatters: >-
      Spinny competes in a narrower slice than headline used-car TAM, so using one broad market number can inflate
      underwriting assumptions.
    diligencePath: Triangulate organized-share assumptions using dealer counts, financing attach, and city-level inventory data.
  - type: private-evidence-only
    severity: material
    topic: Spinny SAM
    missingEvidence: Spinny management view on real SAM by city cluster, price band, and financing attach rate.
    whyItMatters: A pre-IPO company can look large on TAM while still being constrained by hub density and credit conversion.
    diligencePath: Request city-level GMV, take-rate, and financed-transaction mix from management.
  - type: stale
    severity: minor
    topic: market range
    missingEvidence: A 2026 or 2027 refreshed benchmark from one publisher using identical methodology across years.
    whyItMatters: Publisher methods vary materially, making trend lines hard to compare.
    diligencePath: Prefer same-publisher time series or create a normalized internal range file.
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: Like-for-like public pricing, take-rate, and finance-attach comparisons across Spinny, CARS24, and CarDekho.
    whyItMatters: Feature comparisons do not reveal which model has the best unit economics or willingness to discount.
    diligencePath: Collect mystery-shop price quotes, finance offers, and post-sale bundles in matched cities.
  - type: private-evidence-only
    severity: material
    topic: switching-costs
    missingEvidence: Retention, repeat purchase, and referral data benchmarked against peers.
    whyItMatters: Competitive durability depends on whether trust and ownership services create real customer stickiness.
    diligencePath: Request cohort and referral data from management and triangulate with review sources.
  - type: stale
    severity: minor
    topic: landscape
    missingEvidence: Updated 2026 evidence on peer strategic moves such as CarDekho/CarTrade combinations or Cars24 adjacencies.
    whyItMatters: The market structure is still evolving and could change quickly before IPO windows open.
    diligencePath: Refresh peer strategy scans quarterly during any pre-IPO diligence process.
  - type: private-evidence-only
    severity: blocking
    topic: gross margin
    missingEvidence: Gross margin, contribution margin, and city-level profitability bridge.
    whyItMatters: Without margin disclosure, investors cannot distinguish healthy operating leverage from temporary loss deferral.
    diligencePath: Request audited P&L bridge with gross profit, contribution margin, and city-level unit economics.
  - type: missing-source
    severity: material
    topic: cash flow
    missingEvidence: Cash balance, burn rate, and working-capital cycle metrics.
    whyItMatters: Capital adequacy depends on runway and inventory turns, not just revenue growth.
    diligencePath: Request cash-flow statement, inventory days, and payment-cycle disclosures from management.
  - type: private-evidence-only
    severity: material
    topic: GoMechanic pro forma
    missingEvidence: Post-acquisition pro forma revenue, margin, capex, and synergy model.
    whyItMatters: The main strategic step-up in 2025 cannot be valued properly without integration economics.
    diligencePath: Request deal model, integration milestones, and management incentive plan.
  - type: missing-source
    severity: material
    topic: technical architecture
    missingEvidence: Public reliability, security, and internal-systems documentation beyond consumer help pages.
    whyItMatters: >-
      A pre-IPO digital commerce platform should normally expose more about uptime, incident handling, and software
      operating maturity.
    diligencePath: Request architecture, reliability, and support-SLA materials from engineering and operations leaders.
  - type: private-evidence-only
    severity: material
    topic: quality economics
    missingEvidence: Warranty claim rates, defect rates, return rates, and refurbishment yield metrics.
    whyItMatters: Trust products are only durable if they are economically sustainable at scale.
    diligencePath: Request QA pass/fail statistics, warranty-incidence data, and return-cohort analysis.
  - type: private-evidence-only
    severity: material
    topic: servicing roadmap
    missingEvidence: GoMechanic integration roadmap, service attach targets, and ownership LTV assumptions.
    whyItMatters: The biggest publicly visible product expansion cannot be judged without post-sale economics.
    diligencePath: Request a post-acquisition servicing roadmap and attach-rate model.
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: Repeat purchase rate, referral conversion cohorts, and segment-level retention curves.
    whyItMatters: >-
      Official referral and satisfaction claims are encouraging, but investors need true cohort behavior to underwrite
      durable customer economics.
    diligencePath: Request buyer and seller cohort retention, repeat-purchase rate, and NPS data by city and segment.
  - type: missing-source
    severity: material
    topic: complaint denominator
    missingEvidence: Complaint incidence per thousand transactions and median resolution time.
    whyItMatters: >-
      Complaint anecdotes are meaningful, but without denominators they can either overstate or understate execution
      risk.
    diligencePath: Request internal complaint-rate dashboard and compare with external review volumes.
  - type: enumeration-incomplete
    severity: minor
    topic: named customer proof table
    missingEvidence: A more representative panel of buyer and seller cases across cities and segments.
    whyItMatters: Current proof is anecdotal and self-selected.
    diligencePath: Add recent, named buyer and seller interviews or public testimonials with transaction details.
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: complaint rates
    missingEvidence: Internal complaint incidence, RC transfer backlog, and support resolution SLAs by city.
    whyItMatters: >-
      External complaint anecdotes show real issues, but without denominator data investors cannot measure whether the
      risk is stable or worsening.
    diligencePath: Request internal complaint dashboards, median resolution time, and RC transfer aging data.
  - type: private-evidence-only
    severity: material
    topic: GoMechanic integration controls
    missingEvidence: Audit controls, integration governance, and brand-separation plan for GoMechanic.
    whyItMatters: The biggest strategic expansion also carries the sharpest governance tail risk.
    diligencePath: Request post-close governance memos, audit ownership, and integration milestones.
  - type: missing-source
    severity: minor
    topic: technical / security risk surface
    missingEvidence: Public status, incident history, or security-process disclosures.
    whyItMatters: Outside observers can see customer support and paperwork risks more clearly than technical ones.
    diligencePath: Request incident history, security controls, and uptime / outage reports.
  - type: private-evidence-only
    severity: blocking
    topic: valuation inputs
    missingEvidence: Gross margin, contribution margin, cash flow, and working-capital disclosure.
    whyItMatters: Valuation cannot be underwritten with confidence while the most important drivers remain private.
    diligencePath: Request IPO-grade financial package or banker data room access before any buy decision.
  - type: private-evidence-only
    severity: material
    topic: GoMechanic pro forma
    missingEvidence: Integration model, service attach targets, and downside protections on the deal.
    whyItMatters: The biggest visible source of upside is also the largest new source of execution risk.
    diligencePath: Review transaction model, governance package, and post-close milestones.
  - type: missing-source
    severity: material
    topic: customer quality denominator
    missingEvidence: Complaint incidence, support SLAs, and referral quality by cohort.
    whyItMatters: Trust is the main moat claimed for Spinny, so valuation should move on real quality metrics.
    diligencePath: Request internal service-quality dashboard and cohort behavior by city and segment.
