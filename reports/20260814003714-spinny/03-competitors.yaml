- id: capability-and-model-differences
  title: Capability, pricing, and model differences
  body: 'The sharpest competitive contrast is between Spinny and CARS24. Tribune''s comparison piece describes CARS24 as a hybrid model that combines inspected inventory with verified dealers and individual sellers, while Spinny is framed as a stricter D2C inventory operator with fixed pricing. That gives CARS24 more breadth and potentially more selection, but also makes its operating model more heterogeneous. On capability, CARS24 claims a 300+ point inspection, 7-day return window, and broader warranty applicability, while Spinny leans on a 200-point inspection, 5-day money-back promise, and one-year warranty stack.


    CarWale and CarTrade sit on the other side of the spectrum. Their products are optimized for search, inventory discovery, and traffic monetization rather than trust-controlled retail execution. CarDekho is more mixed: it provides used-car inventory and stores, but sector reporting indicates the group ultimately stepped back from capital-intensive B2C retail because the burn profile was unattractive. Spinny''s position is therefore not simply “better than peers”; it is a deliberate trade-off between higher trust and higher operating intensity.'
