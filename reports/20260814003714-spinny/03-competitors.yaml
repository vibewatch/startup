- id: distribution-power-and-moat
  title: Distribution power, switching costs, and moat durability
  body: 'Distribution power in this market does not belong to one model alone. CarWale and CarTrade have extraordinary traffic advantages, with CarTrade investor materials pointing to 150 million yearly unique visitors across CarWale, BikeWale, and OLX India and CarWale itself claiming 3.5 million monthly used-car buyers. OEM programs such as True Value have dense physical networks, while CARS24 layers a broader ownership-services bundle on top of used-car retail. Spinny''s moat claim is therefore narrower: it depends on customer trust, controlled inventory quality, fixed-price simplicity, and an ownership experience that feels safer than OLX or a local dealer.


    Those are meaningful switching costs, but they are not impregnable. OEM programs can compete on inspection trust, classifieds can compete on breadth and price discovery, and hybrid platforms can offer more optionality to both dealers and retail buyers. Spinny''s moat is strongest where the buyer highly values inspection discipline, financing assistance, and minimal negotiation. It is weakest where assortment, bargain-hunting, or brand-specific OEM trust dominate the purchase decision.'
