chapter:
  number: 1
  title: Company Overview
  summary: Spinny is a Gurugram-based used-car marketplace founded in 2015 that became a unicorn in 2021 and is now preparing for a CY2027 IPO. The retained source pack supports a late-stage, trust-led, full-stack platform narrative anchored by FY25 revenue of about Rs 4,657 crore, narrowing losses, and a strategic move into after-sales services through the proposed GoMechanic acquisition.
sections:
- id: identity-operating-model
  title: Identity, headquarters, and operating model
  body: 'Spinny is a Gurugram-based used-car platform built around the idea that trust, inspection discipline, and transaction convenience can formalize a historically opaque category. The retained source pack is consistent on the basic identity markers: Spinny was founded in 2015, is headquartered in Gurugram, and operates a full-stack pre-owned vehicle marketplace rather than only a listings site. That matters because later chapters depend on Spinny''s ability to control inventory quality, pricing, financing hand-offs, logistics, paperwork, and customer support in ways that classifieds-led competitors do not always fully own.


    The company''s own storytelling emphasizes mistrust in India''s used-car market as the founding problem, while third-party profiles describe an end-to-end model aimed at making certified cars feel safer and more predictable to buy and sell. This trust-led positioning explains why the company has leaned into inspection, warranty, money-back, and assisted transaction features instead of competing only on traffic. For chapter-one purposes, the operating model is clear enough to treat Spinny as a vertically integrated used-car commerce platform with adjacent service ambitions, but still too opaque to publish a fully verified legal-entity stack or governance map.'
