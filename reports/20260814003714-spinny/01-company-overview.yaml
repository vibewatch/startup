- id: capital-raising-and-ipo-track
  title: Capital base, valuation path, and IPO preparation
  body: 'Spinny''s funding history supports a classic late-stage marketplace arc: a strong private-market valuation step-up in 2021, additional capital in 2025, then public-market preparation once revenue scale and loss reduction improved. TechCrunch''s 2021 coverage remains the clearest high-reputation anchor for the company''s unicorn mark, with more than $280 million raised at roughly a $1.75 billion valuation. Subsequent reporting around the 2025 GoMechanic transaction indicates an extended Series F totaling about $170 million and a distinct Series G of about $160 million, raised specifically to finance the acquisition and broader platform investment.


    IPO-preparation reporting is also unusually consistent: both Moneycontrol and Entrackr say Spinny converted into a public company and hired Kotak Mahindra Capital, Morgan Stanley, and Citi as lead bankers for a targeted CY2027 listing. Even so, investors should treat the capital story as only partially transparent. Lower-quality profile sources disagree about lifetime capital raised, and the public record still does not cleanly disclose the current cap table, board rights, or liquidation preference structure. The evidence supports a credible pre-IPO posture, but not a fully underwritable financing stack.'
  claimRefs:
