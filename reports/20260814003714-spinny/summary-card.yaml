summary:
  headline: >
    Spinny has built a credible scaled franchise in India's formalizing used-car market, but incomplete disclosure and
    GoMechanic integration risk make the current valuation hard to underwrite aggressively.
  overallScore: 7.3
  recommendation: track
  confidence: medium
