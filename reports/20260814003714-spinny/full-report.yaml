  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and module map
        blocks:
          - type: paragraph
            body: >-
              Spinny's product is best understood as a service workflow rather than a single consumer app. The company
              acquires or lists used-car inventory, inspects and certifies it, merchandises it through a digital
              browsing interface, enables test drives and paperwork, and then extends the experience through warranty,
              returns, and increasingly after-sales support. The strongest official product markers are the 200-point
              inspection, the one-year warranty and 5-day money-back guarantee, and the company's claim that more than
              10,000 fully inspected cars are available. Those promises show that product design is inseparable from
              operational execution.


              The portfolio also now has a clearer segmentation layer. Spinny Certified and Spinny Assured define the
              core used-car offer, while Spinny Max packages a used-luxury-car experience with additional inspection
              depth, pan-India delivery, and physical experience centres. This makes the platform more modular than a
              generic marketplace, even though public sources still describe the modules through customer-facing
              workflows rather than through engineering documentation. The customer promise therefore depends on
              coordinated operations as much as on consumer-facing software every day.
