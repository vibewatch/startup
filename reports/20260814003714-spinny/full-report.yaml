      - number: '4.2'
        title: Cost base and unit economics
        blocks:
          - type: paragraph
            body: >-
              The strongest positive in Spinny's public financial profile is that operating discipline clearly improved
              in FY25. Procurement cost grew with revenue, but the company still reduced losses materially and improved
              its expense-to-revenue ratio. Entrackr says procurement alone was roughly Rs 4,309 crore, or 83.3% of the
              cost base, underscoring how inventory-led this model is. Employee-benefit expense fell to about Rs 338
              crore and advertising declined to roughly Rs 125 crore, suggesting management pulled several variable and
              semi-fixed levers at the same time. Total cost still reached about Rs 5,170 crore, so the model remains
              heavy, but directionally it is moving toward better unit economics.


              That improvement should be interpreted carefully. The public record still does not provide a clean
              gross-margin bridge, per-city contribution margin, or financing-attach economics. We can say the business
              is getting more disciplined; we cannot yet say exactly where steady-state profitability lands. That is why
              the unit-economics story is encouraging but incomplete.
