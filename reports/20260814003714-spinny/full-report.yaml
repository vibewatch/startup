companyProfile:
  summary: >
    Spinny is a Gurugram-based used-car marketplace founded in 2015 by Niraj Singh, Mohit Gupta, and Ramanshu Mahaur.
    The company operates a trust-led, full-stack model that acquires or curates inventory, inspects and reconditions
    vehicles, supports financing and paperwork, and adds post-sale guarantees and service touchpoints. Spinny became a
    unicorn in 2021, reached roughly Rs 4,657 crore of FY25 revenue with narrowing losses, converted its parent into a
    public company during 2025, and is now positioning itself for a potential IPO while using the GoMechanic acquisition
    to expand into after-sales ownership economics.
