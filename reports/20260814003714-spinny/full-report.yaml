      - number: '2.3'
        title: Growth drivers and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              The demand case for India's used-car market is strong because several drivers reinforce one another.
              New-car inflation pushes many buyers into pre-owned inventory; used-car growth is already reported to be
              outpacing new-car growth; formal financing lowers the effective barrier to ownership; and rising digital
              discovery helps organized players reduce information asymmetry. On the supply side, strong historic
              new-car sales enlarge the future resale pool, while scrappage and replacement policies support fleet
              refresh and vehicle churn. Organized platforms can also compound advantages by adding inspection hubs,
              pricing software, and logistics networks that local dealers cannot easily match at scale.


              But the adoption path is not frictionless. Local dealers still dominate much of the market, especially
              where relationships, low overhead, or cash-based transacting matter more than branded trust. Organized
              players must therefore spend heavily on technology, refurbishment, customer acquisition, and financing
              partnerships before they can win enough share to justify private-market valuations. This is why the
              category can be both structurally attractive and operationally unforgiving: the market is large, yet the
              monetizable formal segment must still be built city by city.
            claimRefs:
              - CM022
              - CM023
              - CM019
              - CM020
              - CM026
              - CM035
              - CM036
              - CM037
