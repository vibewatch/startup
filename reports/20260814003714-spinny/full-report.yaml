      - number: '8.3'
        title: Bull, base, and bear logic
        blocks:
          - type: paragraph
            body: >-
              The bull case is straightforward: Spinny keeps compounding revenue, integrates GoMechanic cleanly, turns
              servicing into a real lifetime-value driver, and reaches the IPO window with meaningfully stronger unit
              economics. In that world, the company deserves to preserve or even modestly expand its current
              private-market mark. The base case is more conservative: revenue grows, the IPO path stays open, but
              public-market investors still require a disclosure discount, leaving valuation largely range-bound around
              the current anchor.


              The bear case combines several risks already visible in the evidence set: public-market multiple
              compression, customer-support friction, and an integration story that proves messier than management
              hoped. In that scenario, the 2021 unicorn anchor becomes a ceiling rather than a floor. These scenarios
              are why the stance is track rather than buy: the upside exists, but the spread of outcomes is still wide.
              The chapter therefore favors valuation discipline over narrative momentum.
