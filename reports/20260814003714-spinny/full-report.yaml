  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation, confidence, and valuation stance
        blocks:
          - type: paragraph
            body: >-
              On public evidence, Spinny looks like a company to track rather than a company to buy blindly. The case
              for interest is real: strong revenue scale, a still-large private valuation, a credible IPO path, and a
              category that is formalizing quickly. The case for restraint is equally real: the company remains private,
              key valuation drivers such as gross margin and cash flow are undisclosed, and the GoMechanic transaction
              increases both opportunity and execution complexity.


              That combination supports a medium-confidence, high-risk, fair-to-stretched valuation stance. There is
              enough franchise value to avoid an outright avoid rating, but not enough public evidence to issue an
              uncomplicated buy. The right posture is price-sensitive and diligence-sensitive. Investors should
              therefore care at least as much about missing evidence as about the headline company story. That
              discipline is especially important before an eventual IPO window hardens public expectations.
