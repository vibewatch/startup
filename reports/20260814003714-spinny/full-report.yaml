            body: >-
              Spinny's founder narrative is unusually stable in the retained sources. Public materials consistently
              identify Niraj Singh, Mohit Gupta, and Ramanshu Mahaur as the founding trio, and the company's own
              origin-story page provides the strongest founder-background detail among retained sources. That page
              frames Niraj and Ramanshu as IIT Delhi alumni, with Mohit bringing e-commerce operating experience from
              Flipkart. The story matters because the company still appears meaningfully founder-shaped: public profiles
              focus more on the founding story and execution narrative than on a broad, newly institutionalized
              leadership bench.


              Scale markers are directionally strong but unevenly sourced. IPO-oriented reporting provides the cleanest
              current operating markers: close to 15,000 cars sold monthly, buyers across 25 cities, sellers from more
              than 100 cities, and an intended expansion of the buyer footprint to roughly 35 cities. Meanwhile,
              low-confidence public profile sources place headcount above 5,700 employees. Those numbers support a
              late-stage scale narrative, but not a full operating map. The chronology is clearer than the org chart:
              founding in 2015, unicorn status in 2021, financial consolidation in FY25, public-company conversion in
              FY26, and the GoMechanic step-up in late 2025 define the milestones later chapters can reuse.
