      - number: '8.2'
        title: Current valuation context and comparable set
        blocks:
          - type: paragraph
            body: >-
              The strongest public valuation anchor for Spinny is still the 2021 unicorn round that valued the company
              at roughly $1.75 billion. Later 2025 reporting adds more capital—about $170 million in Series F and
              another $160 million in Series G—but does not clearly disclose a radically different company-level mark.
              That means the public analyst is effectively triangulating around a sticky private valuation, not a clean
              recent repricing. Against FY25 revenue of about Rs 4,657 crore, that anchor implies a revenue multiple a
              little above 3x; against an FY26 revenue expectation near Rs 6,000 crore, the multiple falls closer to the
              mid-2x range.


              Those multiples are not absurd for a fast-growing platform, but they are also not obviously cheap when
              compared with public used-car and digital auto peers. Carvana, CarMax, AUTO1, and CarTrade Tech all offer
              more disclosure than Spinny. That demands a private-market discount, not a premium, unless Spinny can
              demonstrate superior unit economics. Put differently, the current mark is easier to defend as a private
              carry value than as an unquestioned public clearing price today.
