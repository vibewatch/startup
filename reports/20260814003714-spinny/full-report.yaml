  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-ranked top risks
        blocks:
          - type: paragraph
            body: >-
              Spinny's risk profile is driven by one central tension: the company sells trust in a category where small
              process failures can quickly become visible and reputation-damaging. That makes risks in paperwork,
              quality control, support, and integration more important than they might appear in a generic marketplace.
              The retained evidence shows that the company's strongest recurring issues are not around whether demand
              exists, but around whether every leg of a complicated transaction can be executed consistently at scale.
              In that sense, Spinny's moat and its fragility are the same thing.


              The most material chapter-level risks are: customer-facing paperwork and RC transfer failure, integration
              risk around GoMechanic, capital intensity and loss sensitivity in a crowded category, and the reputational
              amplification that comes from a referral-heavy, service-first promise. Because the company is also eyeing
              public markets, unresolved operational issues carry a higher penalty than they would for a purely private
              growth story. The practical result is that seemingly small back-office misses can become thesis-relevant
              very quickly.
