      - number: '7.2'
        title: Regulatory, legal, and governance risks
        blocks:
          - type: paragraph
            body: >-
              The most directly evidenced legal and regulatory risks come from customer paperwork and title transfer.
              Complaint portals, legal-advice pages, and consumer-court traces all show that RC transfer delays, name
              mismatches, and post-sale documentation problems can leave both buyers and sellers exposed. These are not
              abstract compliance risks; they are tangible workflow failures that can create legal escalation, insurance
              issues, or prior-owner liability. The presence of legal-advice and consumer-court surfaces also matters
              because it shows that at least some customer issues become formal disputes rather than simple support
              tickets.


              Governance risk is broader. Spinny is preparing for an IPO, yet the public record still lacks the kind of
              board, control, and disclosure detail that public investors usually expect. Add in the GoMechanic
              acquisition—a transaction involving an asset with a very public fraud and governance history—and the
              governance burden rises further. In other words, governance risk here is not only about the legacy Spinny
              entity, but about whether the combined platform can absorb complexity without weakening controls.
