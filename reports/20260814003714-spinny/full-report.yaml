      - number: '2.2'
        title: Buyer, user, and payer segmentation
        blocks:
          - type: paragraph
            body: >-
              India's used-car buyer is not a single persona. The retained sources consistently point to first-time
              owners, value-conscious upgraders, households outside the new-car affordability band, and urban buyers
              seeking convenience as distinct subsegments. The Mobility Intelligence Report says roughly 80% to 82% of
              organized used-car buyers are first-time buyers, which reinforces Spinny's importance as an on-ramp into
              formal vehicle ownership rather than merely a replacement channel for enthusiasts. Autopunditz and GMI
              also show why the body-style mix skews practical: hatchbacks dominate because of affordability and
              usability, while automatic transmission demand rises in metros where congestion creates a convenience
              premium.


              Budget ownership is equally important. In many cases the buyer, payer, and end user are the same
              household, but financing availability materially reshapes adoption. Better used-car lending can move
              buyers from local cash-only dealers toward organized platforms that offer more trust and paperwork
              support. Spinny's own reported geography—buyers in 25 cities and sellers in more than 100—also suggests
              that organized platforms win by matching fragmented supply to concentrated demand rather than relying on
              single-city inventory pools.
