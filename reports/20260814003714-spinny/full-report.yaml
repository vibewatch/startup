      - number: '4.3'
        title: Capital needs, M&A, and adequacy
        blocks:
          - type: paragraph
            body: >-
              Spinny remains a capital-intensive business because it must finance inventory, refurbishment, logistics,
              and category-building at the same time. The funding sequence in the retained pack supports that reading.
              After the 2021 unicorn round of more than $280 million at roughly a $1.75 billion valuation, the company
              raised around $170 million in Series F during 2025 and then a separate Series G of roughly $160 million
              tied specifically to GoMechanic. Multiple reports say that latter round was designed to finance the
              acquisition and invest in the combined platform, not simply to cover base operating needs.


              The GoMechanic transaction adds both opportunity and risk. Moneycontrol values the deal at around Rs 450
              crore and says the acquired platform operates workshops in more than 150 cities. Strategically, that can
              deepen post-sale monetization and reduce dependence on third-party service partners. Financially, however,
              it also widens the operating perimeter and adds integration demands to a company that is still loss-making
              at the consolidated level.
