            body: >-
              The mitigations implied by the evidence are clear even if management has not publicly disclosed all of
              them. RC-transfer failure needs explicit operational dashboards and city-level escalation controls.
              Service and warranty issues need measured resolution SLAs. The GoMechanic integration needs strong
              ring-fencing of governance, auditability, and brand separation until the servicing stack proves itself.
              And public-market preparation requires more disclosure, not just more revenue.


