              sense, Spinny is closer to an operating system for trusted used-car transactions than to a classifieds
              portal. The product architecture therefore runs across sourcing, inspection, pricing, listing, finance,
              delivery, and post-sale support.


              This architecture also explains why public technical evidence is sparse. Spinny has a consumer app on
              Google Play, but no retained public API docs, open-source repositories, or engineering handbooks. The
