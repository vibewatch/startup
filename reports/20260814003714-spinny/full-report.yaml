            body: >-
              The strongest recurring adverse pattern across retained review and complaint sources is not that customers
              cannot find cars; it is that support, paperwork, and RC transfer sometimes break after the transaction
              should have felt complete. ConsumerComplaints, Consumer Complaints Court, LawRato, and formal case pages
