  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and archetypes
        blocks:
          - type: paragraph
            body: >-
              Spinny competes in a landscape that is broader than a simple list of other inventory-led startups. The
              retained source pack shows at least four meaningful competitor classes. First are direct online used-car
              retailers such as CARS24, which overlap most closely with Spinny on inspection, financing, delivery, and
              post-purchase promises. Second are discovery-led and lead-generation models such as CarWale and CarTrade,
              which attract traffic at much lower asset intensity. Third are group-level or adjacent platforms such as
              CarDekho, whose used-car activities sit inside a wider media, financing, and insurance ecosystem. Fourth
              are incumbent OEM-certified programs such as Maruti Suzuki True Value, which compete on service network
              and brand trust. OLX remains the most important status-quo substitute because it preserves low-cost
              discovery and peer-to-peer negotiation rather than replacing them.


              This matters because buyers solve the same job in multiple ways: they can buy through a trust-heavy
              inventory platform, browse a huge classifieds inventory, or stay inside an OEM-certified program. Spinny
              therefore wins only when its trust stack and transaction support are valued more than lower prices, wider
              inventory breadth, or the comfort of an OEM badge.
            claimRefs:
