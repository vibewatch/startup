        title: Operational, financial, and dependency risks
        blocks:
          - type: paragraph
            body: >-
              Operationally, Spinny depends on many moving parts: sourcing cars, inspecting them correctly, managing
              hubs and test drives, closing financing and paperwork, and then providing warranty or service support. The
              more that model scales, the more coordination failures can surface. Complaint evidence and community posts
              suggest the weakest links often sit in support, transfer workflows, or seller-side process clarity rather
              than in the initial inventory search. That is a real warning because scaling sales faster than back-office
              quality can erode trust.


              Financially, the category remains vulnerable to capital intensity, competitive discounting, and cyclical
              consumer demand. Public-market comparables in auto and used-car retail show that valuations compress
              quickly when margins or inventory turns disappoint. Long-term technology change, especially EV
              penetration, adds a slower-burn risk by changing residual-value behavior and service complexity. This
              means operational slippage and market-pressure risks can reinforce each other rather than appearing as
