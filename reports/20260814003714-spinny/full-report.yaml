              negate the positive proof in reviews, but it does show that the weakest part of the customer journey is
              often the long tail of paperwork and issue resolution rather than the initial promise.


              That matters because a service-first consumer brand is judged most harshly when back-office execution
              fails. If Spinny wants to sustain its referral engine and first-test-drive conversion, it must make the
