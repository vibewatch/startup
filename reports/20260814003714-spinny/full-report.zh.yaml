      - number: '7.2'
        title: 监管、法律与治理风险
        blocks:
          - type: paragraph
            body: >-
              最直接有证据支持的法律和监管风险，来自客户文书和车辆产权过户。投诉门户、法律咨询页面和消费者法院痕迹都显示，RC
              过户延误、姓名不匹配和售后文档问题会让买卖双方暴露在风险中。这些不是抽象的合规风险；它们是具体工作流失败，可能引发法律升级、保险问题或原车主责任。法律咨询和消费者法院页面的存在也很关键，因为这说明至少一部分客户问题会变成正式争议，而不是普通客服工单。


              治理风险更宽。Spinny 正在准备 IPO，但公开记录仍缺少公开市场投资者通常期待的董事会、控制权和披露细节。再加上 GoMechanic
              收购——这是一笔涉及一个曾有高度公开欺诈和治理历史资产的交易——治理负担进一步上升。换句话说，这里的治理风险不只关乎旧的 Spinny 实体，也关乎合并后平台能否吸收复杂性而不削弱控制。
            claimRefs:
              - CR002
              - CR003
              - CR008
              - CR009
              - CR010
              - CR015
              - CR032
              - CR039
