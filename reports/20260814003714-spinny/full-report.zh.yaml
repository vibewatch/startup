      - number: '6.3'
        title: 痛点与负面信号
        blocks:
          - type: paragraph
            body: >-
              保留评论和投诉信源中最强的反复负面模式，并不是客户找不到车；而是交易本该结束之后，支持、文书和 RC 过户有时会断裂。ConsumerComplaints、Consumer Complaints
              Court、LawRato 以及正式案件页面都显示出同一组问题：RC
              过户延误、姓名不匹配、服务问题未解决、卖家侧付款或扣留争议，以及售后沟通带来的挫败。这并不否定评论中的正面证据，但说明客户旅程里最弱的部分，往往不是最初承诺，而是文书和问题解决的长尾。


              这很重要，因为服务优先的消费者品牌，一旦后台执行失败，会被用户更严厉地评判。如果 Spinny 想维持转介绍引擎和首次试驾转化，就必须让售后体验像售前承诺一样可靠。
            claimRefs:
              - CU015
              - CU016
