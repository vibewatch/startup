      - number: '6.4'
        title: 扩张逻辑与集中度考量
        blocks:
          - type: paragraph
            body: >-
              Spinny 的客户扩张逻辑仍有吸引力，因为市场背景仍然高度偏首次买家，也高度缺信任。Redseer 和 Mobility Intelligence Report
              表明，当买家更需要融资、透明度和信心，而不是最低价格时，正规二手车板块会受益。这对 Spinny
              模式有利。挑战在于，即便没有企业标识，客户集中度仍会以隐藏方式出现：城市覆盖窄、支持质量不一致，或过度依赖创始人品牌信任，都可能让消费者增长比收入需求表面看起来更脆弱。


              因此，证据支持一个平衡的客户判断。Spinny 有有意义的消费者触达，也有足够独立证据显示真实价值创造；但扩张质量取决于公司能否在新城市和售后支持工作流中，持续复制高信任体验，并在规模上稳定落地。
            claimRefs:
              - CU011
              - CU026
              - CU010
              - CU034
              - CU037
              - CU025
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重性排序的主要风险
        blocks:
          - type: paragraph
            body: >-
              Spinny
              的风险画像由一个核心张力驱动：公司在一个小流程失误就会迅速可见、并伤害声誉的品类里出售“信任”。因此，文书、质量控制、支持和整合风险，比它们在普通市场平台里看起来更重要。保留证据显示，公司最强的反复问题不在需求是否存在，而在一笔复杂交易的每一段能否在规模下持续执行。从这个意义上说，Spinny
              的护城河和脆弱性是同一件事。


              章节层面最重大的风险包括：面向客户的文书和 RC 过户失败、GoMechanic
              整合风险、拥挤品类里的资本强度和亏损敏感性，以及转介绍重、服务优先承诺带来的声誉放大。公司还在瞄准公开市场，因此未解决的运营问题会比纯私营增长故事承受更高惩罚。实际结果是，看似很小的后台失误，可能很快变成影响投资论点的问题。
            claimRefs:
              - CR001
              - CR004
              - CR011
              - CR013
              - CR021
              - CR022
              - CR034
              - CR038
