      - number: '1.2'
        title: 创始人、规模指标与里程碑时间线
        blocks:
          - type: paragraph
            body: >-
              Spinny 的创始人叙事在保留信源中罕见稳定。公开材料持续把 Niraj Singh、Mohit Gupta 和 Ramanshu Mahaur
              列为三位创始人；公司自己的起源故事页面在保留信源里提供了最完整的创始人背景。该页面把 Niraj 和 Ramanshu 描述为 IIT Delhi 校友，Mohit 则带来 Flipkart
              的电商运营经验。这个故事重要，因为公司今天看起来仍然深受创始团队塑形：公开画像更常强调创立故事和执行叙事，而不是一支已经广泛制度化的新领导层。


              规模指标方向上强，但信源不均衡。面向 IPO 的报道给出了最清晰的当前运营指标：每月销售接近 15,000 辆车，买家覆盖 25 个城市，卖家来自 100 多个城市，并计划把买家城市扩到约 35
              个。与此同时，低置信度的公开画像把员工数放在 5,700 人以上。这些数字支撑了后期规模叙事，但还不能拼出完整运营地图。时间线比组织图更清楚：2015 年创立、2021 年成为独角兽、FY25 财务整合、FY26
              转为公众公司、2025 年末 GoMechanic 加码，这些里程碑为后续章节提供了可复用的基础。
