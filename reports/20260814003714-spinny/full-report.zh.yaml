        title: 资本需求、M&A 与充足性
        blocks:
          - type: paragraph
            body: >-
              Spinny 仍是资本密集型业务，因为它必须同时为库存、整备、物流和品类建设提供资金。保留信源中的融资序列支撑了这一判断。2021 年独角兽轮以约 $1.75 billion 估值融资超过 $280
              million 之后，公司在 2025 年 Series F 融资约 $170 million，随后又完成一轮约 $160 million 的独立 Series G，专门与 GoMechanic
              绑定。多篇报道称，后者用于为收购和合并后平台投入提供资金，而不只是覆盖基础运营需求。


              GoMechanic 交易同时带来机会和风险。Moneycontrol 将交易估值放在约 Rs 450 crore，并称被收购平台在 150
              多个城市运营维修工坊。战略上，这可以加深售后变现，降低对第三方服务伙伴的依赖。财务上，它也扩大了运营边界，并给一家合并口径仍在亏损的公司增加整合要求。
