  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与模块地图
        blocks:
          - type: paragraph
            body: >-
              理解 Spinny 的产品，最好把它看作一套服务工作流，而不是单一消费者
              App。公司收购或上架二手车库存，检测并认证车辆，通过数字浏览界面商品化展示，支持试驾和文书，然后用质保、退车以及越来越多的售后支持延展体验。最强的官方产品标识，是 200 点检测、一年质保和 5
              天退款保证，以及公司声称有超过 10,000 辆已完成全面检测的车辆可选。这些承诺说明，产品设计离不开运营执行。


              组合现在也有了更清晰的分层。Spinny Certified 和 Spinny Assured 定义核心二手车供给；Spinny Max
              则把二手豪华车体验打包，加入更深检测、印度全国交付和线下体验中心。这样的平台比泛化市场平台更模块化，尽管公开信源仍主要通过面向客户的工作流来描述模块，而不是通过工程文档。客户承诺因此每天都同样依赖协调好的运营和面向消费者的软件。
