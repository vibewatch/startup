      - number: '3.4'
        title: 什么会改变竞争判断
        blocks:
          - type: paragraph
            body: >-
              最重要的竞争开放问题在经济性，而不只是功能。Spinny 可以在信任上看起来更强，但如果获客成本、整备成本或库存周转落后同行，仍可能跑输。同样，CarTrade 或 CarWale
              这样流量更重的平台，运营上看似更简单；但如果买家越来越偏好闭环零售，也可能拿不到足够变现。保留证据因此支持一个平衡判断：Spinny
              是印度二手车市场中最强的信任型全栈品牌之一，但品类仍然足够开放，不能把任何单一运营商视为永久主导者。


              三类变化会最快改写判断。第一，公开披露城市级单位经济性，可以说明库存控制是否正在形成持久经营杠杆。第二，CarDekho / CarTrade 整合或 Cars24
              服务相邻业务的更多清晰度，可能改变分发地图。第三，如果 OEM 认证项目在不牺牲信任的前提下改善数字便利性，Spinny 的感知差异化可能被压缩。目前，Spinny 位置不错，但竞争上并非无人挑战。
            claimRefs:
              - CP025
              - CP010
              - CP036
              - CP031
