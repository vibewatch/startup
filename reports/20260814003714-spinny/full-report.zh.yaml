  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与头部规模
        blocks:
          - type: paragraph
            body: >-
              Spinny
              参与的是印度二手车市场中的正规化部分，而不是所有点对点或非正式车辆交易的全集。这个区分很重要，因为如果忽略正规零售的真实约束——检测能力、融资可得性、产权过户、信任和城际物流——头部市场规模数字很容易被高估。保留信源中最宽的估算来自
              Mordor Intelligence：印度二手车市场 2025 年约 $36.39 billion，2026 年约 $41.74 billion，2031 年前 CAGR 为
              14.72%。这些数字方向上有用，但覆盖的市场仍由碎片化本地车商和非组织化交易主导。


              对 Spinny 来说，最关键的市场信号不只是总支出，而是交易向正规化、认证化和融资化迁移。Redseer 与 Spinny 自身定位都指向同一个核心解锁点：建立信任。这支撑了更窄的 SAM
              逻辑：真正可变现的池子，是城市里可数字化发现、信任要求更高，且检测、融资和物流能实质改变客户决策的部分。因此，投资者应把 TAM 视为边界条件，把正规渠道份额迁移视为真正的承销变量。
