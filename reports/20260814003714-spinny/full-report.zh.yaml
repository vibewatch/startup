      - number: '2.3'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >-
              印度二手车市场的需求逻辑强，因为几个驱动因素相互强化。新车涨价把许多买家推向二手库存；二手车增速据称已经快于新车；正规融资降低实际购车门槛；数字化发现能力提升，帮助正规玩家减少信息不对称。供给侧，历史新车销量强劲，会扩大未来转售池；报废和置换政策也支持车队更新与车辆流转。正规平台还可以叠加检测中心、定价软件和物流网络，把本地车商难以规模复制的能力复利化。


              但采用路径并不顺滑。本地车商仍主导市场的大部分，尤其在关系、低成本结构或现金交易比品牌信任更重要的地方。正规玩家必须先在技术、整备、获客和融资合作上投入重金，才能赢下足够份额来支撑私募估值。这也是为什么这个品类既结构性有吸引力，又在运营上很残酷：市场很大，但可变现的正规部分仍要一城一城建出来。
