      - number: '2.2'
        title: 买家、用户与付款人分层
        blocks:
          - type: paragraph
            body: >-
              印度二手车买家不是单一画像。保留信源持续指向几个不同子群：首次购车者、重视性价比的升级型家庭、买不起新车的家庭，以及追求便利的城市买家。Mobility Intelligence Report
              称，正规二手车买家中约 80% 到 82% 是首次购车者，这强化了 Spinny 的意义：它更像进入正规汽车拥有权的入口，而不只是车迷的换车渠道。Autopunditz 和 GMI
              也解释了为什么车身类型偏实用：两厢车因可负担性和易用性占主导，而在拥堵推高便利溢价的大城市，自动挡需求上升。


              预算型拥有权同样重要。很多情况下，买家、付款人和最终用户都是同一个家庭，但融资可得性会实质改写采用路径。二手车贷款更好之后，买家可能从只收现金的本地车商转向提供更多信任和文书支持的正规平台。Spinny
              自己披露的地域分布——买家在 25 个城市，卖家超过 100 个城市——也说明，正规平台胜出靠的是把碎片化供给匹配到集中的需求，而不是依赖单城库存池。
