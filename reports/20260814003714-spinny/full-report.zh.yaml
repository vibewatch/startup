companyProfile:
  summary: >
    Spinny 是一家总部位于 Gurugram 的二手车交易平台，2015 年由 Niraj Singh、Mohit Gupta 和 Ramanshu Mahaur
    创立。公司采用信任驱动的全栈模式：收购或筛选库存、检测并整备车辆、支持融资和文书流程，并叠加售后保障和服务触点。Spinny 在 2021 年成为独角兽，FY25 收入约 Rs 4,657 crore，亏损收窄；2025
    年母公司转为公众公司，如今正为潜在 IPO 做准备，同时借 GoMechanic 收购切入售后用车经济。
