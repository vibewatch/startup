      - number: '1.3'
        title: 资本基础、估值路径与 IPO 准备
        blocks:
          - type: paragraph
            body: >-
              Spinny 的融资史符合典型后期市场平台轨迹：2021 年私募估值大幅上台阶，2025 年继续融资，随后在收入规模扩大、亏损收窄后准备进入公开市场。TechCrunch 2021
              年的报道仍是公司独角兽节点最清楚、声誉最高的锚点：融资超过 $280 million，估值约 $1.75 billion。围绕 2025 年 GoMechanic 交易的后续报道显示，公司又完成总额约 $170
              million 的延展 Series F，以及单独约 $160 million 的 Series G，后者专门用于支持收购和更广泛的平台投入。


              IPO 准备相关报道也罕见一致：Moneycontrol 和 Entrackr 都称 Spinny 已转为公众公司，并聘请 Kotak Mahindra Capital、Morgan Stanley 和 Citi
              担任主承销商，目标是在 CY2027
              上市。即便如此，投资者仍应把资本故事视为“部分透明”。低质量画像信源对累计融资额说法不一，公开记录也没有清楚披露当前股权结构、董事会权利或清算优先权安排。证据足以支撑一个可信的 Pre-IPO
              姿态，但还不足以支撑一套可完整承销的融资结构。
