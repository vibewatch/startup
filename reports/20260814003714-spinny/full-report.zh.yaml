  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图与类型
        blocks:
          - type: paragraph
            body: >-
              Spinny 所处的竞争版图，比一张“其他库存型创业公司”名单更宽。保留信源显示，至少有四类有意义的竞争者。第一类是 CARS24 这样的直接线上二手车零售商，在检测、融资、交付和购后承诺上与 Spinny
              最重叠。第二类是 CarWale、CarTrade 这样的发现和线索生成模式，以低得多的资产强度吸引流量。第三类是 CarDekho 这样的集团级或相邻平台，其二手车活动嵌在更宽的媒体、融资和保险生态里。第四类是
              Maruti Suzuki True Value 这样的 OEM 认证项目，靠服务网络和品牌信任竞争。OLX 仍是最重要的现状替代品，因为它保留低成本发现和点对点议价，而不是替代这些行为。


              这很关键，因为买家用多种方式解决同一个任务：通过重信任的库存平台购买，浏览海量分类信息库存，或留在 OEM 认证项目里。只有当 Spinny 的信任栈和交易支持，比更低价格、更宽库存或 OEM
              标识带来的安全感更有价值时，Spinny 才会赢。
