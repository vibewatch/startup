  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式、规模与结构
        blocks:
          - type: paragraph
            body: >-
              Spinny 眼下的财务故事，不是一家轻量市场平台主要收取费用；它更像一家大规模二手车零售商，收入几乎完全绑定车辆销售。Entrackr 的 FY25 分析是这里的核心信源：运营收入从上一年的约 Rs 3,730
              crore 增至约 Rs 4,657 crore，增长 25%。约 97.7% 的运营收入直接来自二手车销售，只有少量来自佣金、支持服务和广告。这个结构很关键，因为它意味着 Spinny
              的增长质量主要由库存吞吐、定价、采购纪律和物流驱动，而不是由高毛利、订阅式的经常性收入驱动。


              规模指标强化了同一点。IPO 准备报道称，Spinny 每月销售接近 15,000 辆车，买家覆盖 25 个城市，卖家库存来自 100 多个城市。这已经是很大的运营底盘；Entrackr 还报道称，FY26
              收入可能达到约 Rs 6,000 crore。因此，业务规模已经足够进入公开市场视野，但质量仍应按“带服务相邻业务的零售商”来评估，而不是按资本轻的软件业务来评估。
