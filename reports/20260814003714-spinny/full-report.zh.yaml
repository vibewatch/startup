  - id: TV004
    title: 可比估值表
    columns:
      - 可比公司
      - 上市状态 / 规模
      - 为何可比
      - 局限
      - 对 Spinny 的启示
    enumerationScope:
      coverage: exhaustive
      basis: >-
        Selected set of the most relevant public and Indian digital-auto comparables visible in the retained evidence
        pack.
    rows:
      - - Carvana
        - 美国上市二手车电商龙头
        - 最知名的线上二手车零售可比公司
        - 规模和披露都大得多
        - 上市公司倍数应压住私募估值亢奋
      - - CarMax
        - 美国上市传统二手车零售商
        - 显示较低倍数、偏零售的经济性
        - 线下占比高，结构不同于 Spinny
        - 可作为资本强度现实的底部参照
      - - AUTO1 Group
        - 欧洲上市数字汽车零售商
        - 数字零售模式更接近，且有申报文件
        - 地域和业务组合不同
        - 良好的中间参照
      - - CarTrade Tech
        - 印度上市数字汽车平台
        - 最贴近的印度上市汽车数字化可比公司
        - 线索生成模式比 Spinny 更轻
        - 显示无完整库存风险时流量的价值
      - - Cars24 / CarDekho / 印度同行
        - 私营后期同行
        - 同赛道、同 IPO 叙事
        - 私募估值和披露不够干净
        - 只能作为方向性私募基准
    notes: 可比组混合了上市和私募锚点，但投资判断中上市可比应权重更高。
    claimRefs:
      - CV014
      - CV015
      - CV016
      - CV017
      - CV018
      - CV013
  - id: TV005
    title: 投资假设破裂与否决触发项表
    columns:
      - 触发项
      - 阈值 / 事件
      - 对投资假设的传导
      - 行动含义
    rows:
      - - 投诉和支持恶化
        - 交易量扩大时问题率上升的证据
        - 削弱信任护城河和转介绍循环
        - 下调估值立场
      - - GoMechanic 治理意外
        - 交割后任何可信的控制或审计问题
        - 让服务扩张从上行变成负担
        - 避免新增资金
      - - 公开市场倍数重置
        - 板块可比公司估值下修，而 Spinny 仍不透明
        - 当前私募估值会很难说得通
        - 要求更深入场折价
      - - IPO 文件暴露经济性薄弱
        - 利润率或现金转化远弱于预期
        - 打破多头 / 基准投资测算
        - 从跟踪转为回避
    notes: 这些触发项用于每个更新周期监控。
    claimRefs:
      - CV032
      - CV023
      - CV021
      - CV033
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 路径
    rows:
