chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、总部与运营模式
        blocks:
          - type: paragraph
            body: >-
              Spinny 是一家总部位于 Gurugram 的二手车平台，核心判断是：信任、检测纪律和交易便利，可以把一个长期不透明的品类逐步规范化。保留的信源包在基本身份上相互一致：Spinny 创立于 2015
              年，总部在 Gurugram，运营的是全栈二手车交易平台，而不只是信息发布网站。这个差异很关键，因为后续章节都依赖 Spinny
              能否掌控库存质量、定价、融资衔接、物流、文书和客服；以分类信息为主的竞争者并不总能完整拥有这些环节。


              公司自己的叙事把印度二手车市场的“不信任”视为创始问题；第三方画像则把其模式描述为端到端服务，让认证车辆的买卖更安全、更可预期。这个信任驱动定位解释了为什么公司押注检测、质保、退款和辅助交易功能，而不是只拼流量。放在第一章，运营模式已经足够清楚：Spinny
              是一家垂直整合的二手车电商平台，并有向相邻服务延伸的野心；但法律实体结构和治理图谱仍不透明，无法完全核实并披露。
