        title: 客户基础与核心分层
        blocks:
          - type: paragraph
            body: >-
              Spinny 是消费者市场平台，因此客户分析必须把官方规模说法和独立证据分开。最好的官方客户指标都集中在公司关于页面：超过 2 lakh 名满意客户、4.8/5 评价标识、35% 转介绍、超过 70%
              首次试驾转化，以及 32% 女性客户占比。结合 IPO 报道中平台服务 25 个买家城市、卖家覆盖 100 多个城市的说法，这些数据支持一个判断：Spinny
              已经形成有意义的消费者广度。业务也不只是面向买家；卖家显然也是客户基础的一部分，因为平台必须聚合供给，也必须承接需求。


              分层看，保留证据指向首次二手车买家、重视性价比的家庭、通过 Spinny Max 购买的高端 / 豪华买家，以及希望被托管退出的卖家。B2B 客户公开证据弱，因此最清晰的结论是 Spinny 仍压倒性偏
              B2C。这让客户集中度更多绑定到城市执行和服务质量，而不是少数企业客户。
