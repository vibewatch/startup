      - number: '8.3'
        title: 牛市、基准与熊市逻辑
        blocks:
          - type: paragraph
            body: >-
              牛市情境很直接：Spinny 继续复合增长收入，顺利整合 GoMechanic，把维修服务转化为真正的生命周期价值驱动，并在进入 IPO
              窗口时拿出明显更强的单位经济性。在这个世界里，公司应能维持甚至小幅扩大当前私募估值。基准情境更保守：收入增长，IPO 路径保持打开，但公开市场投资者仍要求披露折价，使估值大体围绕当前锚点区间震荡。


              熊市情境把证据集中已经可见的几项风险叠在一起：公开市场倍数压缩、客户支持摩擦，以及整合故事比管理层期待更混乱。在这种情况下，2021
              年独角兽锚点会变成天花板，而不是地板。这些情境解释了为什么立场是跟踪而不是买入：上行存在，但结果分布仍然很宽。因此，本章更偏向估值纪律，而不是叙事动能。
            claimRefs:
              - CV022
              - CV023
