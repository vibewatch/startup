      - number: '2.4'
        title: 对 Spinny 市场位置的含义
        blocks:
          - type: paragraph
            body: >-
              对 Spinny 具体而言，市场章节给出的实用结论是：成功不只是站在一个大品类里，更取决于赢下这个品类向正规化迁移的过程。章节层面最强支撑来自 Redseer、基于 CRISIL 的报道以及 Spinny
              自己的地域披露。这些信源合在一起，描绘出一个市场：正规零售正在拿份额，需求正在越过大城市扩散，信任和融资仍是最大的转化杠杆。这对 Spinny
              的运营设计有利，因为公司把检测和交易协助，与逐步扩展的用车栈绑在一起。


              同时，现有证据不支持对 Spinny 的真实 SAM
              或近期份额天花板给出伪精确判断。不同出版方估算不一，正规渠道份额仍未占市场多数，大城市以外的采用还取决于融资、物流和买家教育。因此，正确的市场结论应当建设性但克制：这个品类足够大，可以容纳多个规模化玩家；但只有那些能在不推高资本强度的情况下，把信任、供给聚合和融资正规化的公司，才配得上后期风险投资或
              Pre-IPO 溢价。
