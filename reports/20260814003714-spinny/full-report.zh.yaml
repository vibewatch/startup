    title: 推荐逻辑
    type: flow
    layout: standard
    summary: 推荐结论从公司质量一路推到证据质量和价格敏感度。
    data:
      nodes:
        - id: market
          label: 正规化强顺风
          detail: 品类仍有吸引力
          tone: positive
        - id: traction
          label: 真实规模与增长
          detail: FY25 收入和 FY26 展望都有分量
