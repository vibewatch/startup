      - number: '7.3'
        title: 运营、财务与依赖风险
        blocks:
          - type: paragraph
            body: >-
              运营上，Spinny
              依赖许多环节：获取车源、正确检测、管理枢纽和试驾、完成融资和文书，然后提供质保或服务支持。这个模式规模越大，协调失败越容易浮出水面。投诉证据和社区帖子显示，最弱链条往往在支持、过户工作流或卖家侧流程清晰度，而不是最初的库存搜索。这是真实警告，因为销售扩张快于后台质量，会侵蚀信任。


              财务上，这个品类仍容易受到资本强度、竞争性折扣和周期性消费需求的影响。汽车和二手车零售的公开市场可比公司显示，只要利润率或库存周转令人失望，估值就会快速压缩。长期技术变化，尤其是 EV
              渗透，还会通过改变残值行为和服务复杂度，带来慢变量风险。这意味着运营滑坡和市场压力会相互强化，而不是彼此独立。
            claimRefs:
