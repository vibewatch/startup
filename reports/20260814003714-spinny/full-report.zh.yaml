  - id: TV002
    title: 正反投资假设表
    columns:
      - 论点
      - 成立理由
      - 什么会改变判断
    rows:
      - - 多头：正规化赢家
        - 在庞大且增长的有组织二手车板块，Spinny 是由信任驱动的全栈玩家
        - 需要证明增长能转化为可持续经济性
      - - 多头：服务扩张
        - GoMechanic 可能提高生命周期价值，并打开售后变现
        - 需要干净整合和加购经济性的证据
      - - 空头：披露折价
        - 毛利率和现金流的公开证据仍太薄
        - 如果 IPO 级披露更扎实，判断可能改变
      - - 空头：执行拖累
        - 投诉、支持摩擦或整合问题可能压住公开市场胃口
