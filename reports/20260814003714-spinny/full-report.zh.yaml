      - number: '7.4'
        title: 缓释、监测与终止条件
        blocks:
          - type: paragraph
            body: >-
              即便管理层没有公开披露所有措施，证据指向的缓释方向也很清楚。RC 过户失败需要明确的运营看板和城市级升级控制。服务和质保问题需要量化的解决 SLA。GoMechanic
              整合在服务栈证明自己之前，需要强力隔离治理、可审计性和品牌。公开市场准备需要更多披露，而不只是更多收入。


              投资论点被打破，可能来自四类事件之一：GoMechanic
              整合中出现重大治理问题；投诉或法律升级率随交易量增长而上升；竞争折扣导致亏损重新扩大；或公开市场流程迫使公司披露远弱于二手报道暗示的经济性。这些因素足够可量化，可以在刷新周期里持续监测。
            claimRefs:
              - CR011
