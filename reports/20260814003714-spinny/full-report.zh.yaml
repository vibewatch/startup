        - FY26 收入达到 / 超过计划；整合跑通；利润率改善
        - 相对当前估值有溢价；IPO 窗口带来上行
        - 有可能，但证据仍不足
        - 整合或披露失误
      - - 基准
        - 增长仍强；披露逐步改善；市场窗口好坏参半
        - 估值维持在当前区间附近
        - 最符合公开证据
