  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议、置信度与估值立场
        blocks:
          - type: paragraph
            body: >-
              基于公开证据，Spinny 更像一家应继续跟踪的公司，而不是可以盲目买入的公司。值得关注的理由真实存在：收入规模强、私募估值仍大、IPO
              路径可信，且品类正在快速正规化。克制的理由同样真实：公司仍是私营，毛利率和现金流等关键估值驱动因素未披露，GoMechanic 交易同时增加机会和执行复杂度。


              这个组合支持一个中等置信度、高风险、合理到偏紧的估值立场。公司有足够的客户资产价值，不能直接给出回避评级；但公开证据还不足以支持一个毫无保留的买入结论。正确姿态应当对价格敏感、对尽调敏感。因此，投资者至少应像关注头部公司故事一样，关注缺失证据。IPO
              窗口最终把公开预期固化之前，这种纪律尤其重要。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV031
              - CV040
