        - 客户运营尽调
      - - 股权结构表和优先权
        - 没有公开优先权堆栈披露
        - 入场定价取决于瀑布分配风险
        - 法务 / 投资者关系尽调
    notes: 最高价值的下一步尽调都围绕公司本身，而不是泛泛市场问题。
    claimRefs:
      - CV039
      - CV038
      - CV031
