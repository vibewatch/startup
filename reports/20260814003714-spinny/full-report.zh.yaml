            body: >-
              核心客户工作流从数字发现和比较开始，但很快就进入线下。客户可以预约到家或到枢纽试驾，依靠 Spinny 完成融资或文档支持，并接收已经走过检测和整备流程的车辆。从这个意义上说，Spinny
              更像可信二手车交易的操作系统，而不是分类信息门户。产品架构横跨车源、检测、定价、上架、金融、交付和售后支持。


              这个架构也解释了为什么公开技术证据稀疏。Spinny 在 Google Play 上有消费者 App，但保留信源里没有公开 API 文档、开源仓库或工程手册。因此，最接近公开开发者信号的是 App
              本身这类面向从业者的分发证据，以及检测和质保相关运营文档。这让产品从工作流角度可读，但内部软件架构大体仍不透明。
