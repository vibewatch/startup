      - number: '3.3'
        title: 分发能力、转换成本与护城河耐久性
        blocks:
          - type: paragraph
            body: >-
              这个市场的分发能力并不只属于一种模式。CarWale 和 CarTrade 有极强流量优势：CarTrade 投资者材料称，CarWale、BikeWale 和 OLX India 合计年独立访客 150
              million；CarWale 自身声称每月有 3.5 million 二手车买家。True Value 等 OEM 项目有密集线下网络；CARS24 则在二手车零售之上叠加更宽的用车服务包。因此，Spinny
              的护城河主张更窄：它依赖客户信任、受控库存质量、固定价格的简单性，以及一种比 OLX 或本地车商更安全的用车体验。


              这些转换成本有意义，但并非牢不可破。OEM 项目可以拼检测信任，分类信息平台可以拼广度和价格发现，混合平台可以向车商和零售买家提供更多可选路径。Spinny
              的护城河在买家高度看重检测纪律、融资协助和低议价摩擦时最强；在商品丰富度、淘便宜或特定品牌 OEM 信任主导购买决策时最弱。
