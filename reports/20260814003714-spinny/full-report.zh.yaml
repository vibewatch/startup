      - number: '8.2'
        title: 当前估值背景与可比公司组
        blocks:
          - type: paragraph
            body: >-
              Spinny 最强的公开估值锚点，仍是 2021 年独角兽轮，当时公司估值约 $1.75 billion。2025 年后续报道补充了更多资本——Series F 约 $170 million，Series G
              另有约 $160 million——但没有清楚披露一个大幅不同的公司层面估值。这意味着公开分析师实际上是在围绕一个黏性私募估值交叉定位，而不是围绕一次清晰的近期重定价。对照约 Rs 4,657 crore 的
              FY25 收入，这个锚点意味着收入倍数略高于 3x；对照接近 Rs 6,000 crore 的 FY26 收入预期，倍数降至接近 2x 中段。


              对一家快速增长的平台而言，这些倍数并不荒谬；但与公开二手车和数字汽车同行相比，也很难说明显便宜。Carvana、CarMax、AUTO1 和 CarTrade Tech 的披露都多于
              Spinny。这要求私募市场折价，而不是溢价，除非 Spinny 能证明更优单位经济性。换句话说，当前估值更容易作为私募持有价值被维护，而不是作为今天毫无疑问的公开市场出清价。
            claimRefs:
              - CV005
