      - number: '4.2'
        title: 成本基础与单位经济性
        blocks:
          - type: paragraph
            body: >-
              Spinny 公开财务画像中最强的积极信号，是 FY25 运营纪律明显改善。采购成本随收入增长，但公司仍显著压低亏损，并改善费用收入比。Entrackr 称，仅采购成本就约 Rs 4,309
              crore，占成本基础 83.3%，凸显这个模式有多依赖库存。员工福利费用降至约 Rs 338 crore，广告费用降至约 Rs 125 crore，说明管理层同时拉动了多项可变和半固定杠杆。总成本仍达到约 Rs
              5,170 crore，所以模式依旧很重，但方向上正在走向更好的单位经济性。


              这种改善需要谨慎解读。公开记录仍没有给出清晰的毛利率桥、单城贡献利润率或融资附着经济性。可以说业务正在变得更有纪律；但还不能说稳态盈利究竟落在哪里。因此，单位经济性故事令人鼓舞，但仍不完整。
