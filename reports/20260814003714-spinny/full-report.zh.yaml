      - number: '3.2'
        title: 能力、定价与模式差异
        blocks:
          - type: paragraph
            body: >-
              最尖锐的竞争对比在 Spinny 和 CARS24 之间。Tribune 的对比文章把 CARS24 描述为一种混合模式：把已检测库存、认证车商和个人卖家结合起来；Spinny 则被框定为更严格的 D2C
              库存运营商，采用固定定价。这让 CARS24 拥有更大的广度、可能也有更多选择，但运营模型也更异质。能力上，CARS24 声称有 300+ 点检测、7 天退车窗口和更广的质保适用范围；Spinny 则依靠 200
              点检测、5 天退款承诺和一年质保栈。


              CarWale 和 CarTrade 位于光谱另一端。它们的产品围绕搜索、库存发现和流量变现优化，而不是围绕信任可控的零售执行。CarDekho
              更混合：它提供二手车库存和门店，但行业报道显示，该集团最终从资本密集型 B2C 零售后退，因为烧钱曲线并不好看。因此，Spinny
              的位置并不是简单地“比同行更好”；它是在更高信任与更高运营强度之间做出的明确取舍。
