      - number: '8.4'
        title: 退出准备度、终止触发与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              Spinny 转为公众公司并聘请投行，让 IPO 路线具备合理性；但合理性不等于准备充分。公开市场投资者要看的远不止收入增长和市场叙事。他们会要求清楚看到利润率、投诉率、营运资本需求、服务经济性，以及
              GoMechanic 究竟强化还是复杂化了故事。这意味着决定性的尽调问题都与公司和运营本身有关，而不是泛泛的品类问题。


              如果投诉或支持问题随规模恶化，整合引发治理问题，或者公开申报流程揭示的经济性远弱于二手报道所暗示，投资论点就会破裂。反过来，更干净的利润率和整合披露可以实质上调立场。在此之前，投资案例仍然有意思，但尚未完成。对今天的外部投资者来说，这正是观察名单立场比激进进入更站得住脚的设置。
