- id: public-market-readiness-and-gaps
  title: Public-market readiness and unresolved gaps
  body: 'The presence of public used-car and auto-commerce comps means Spinny cannot rely on private-market momentum alone when it approaches the IPO window. Public benchmarks such as Carvana, CarMax, and AUTO1 Group all operate with disclosed filings and are ultimately valued on visible throughput, margins, and balance-sheet risk. That is the central financial implication of Spinny''s public-company conversion and banker appointments: the next step in the company''s journey will require a much more transparent articulation of gross margins, working capital, cash flow, and returns on expansion.


    Today, the biggest unresolved issues are disclosure gaps. The public record does not disclose current burn, runway, contribution margins by city, or the exact profitability impact that GoMechanic should have. Those gaps do not invalidate the progress Spinny has made; they simply limit how precise investors should be when underwriting valuation or IPO timing.'
