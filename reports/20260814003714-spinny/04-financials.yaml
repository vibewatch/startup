chapter:
  number: 4
  title: Financials
  summary: Spinny has reached meaningful revenue scale—about Rs 4,657 crore in FY25—with losses narrowing materially, but the public record still describes a working-capital-heavy retail model rather than a fully transparent, public-market-ready earnings story. The company's 2025 Series F and Series G financing, plus the GoMechanic acquisition, support continued expansion while also raising the burden of proof on gross margins, cash flow, and pro forma returns.
sections:
- id: revenue-and-mix
  title: Revenue model, scale, and mix
  body: 'Spinny''s current financial story is not that of a lightweight marketplace collecting mostly fees; it is the story of a large-volume used-car retailer whose revenue is overwhelmingly tied to vehicle sales. Entrackr''s FY25 analysis is the central source here: revenue from operations rose to about Rs 4,657 crore from roughly Rs 3,730 crore the year before, a 25% increase. About 97.7% of operating income came directly from used-car sales, with only a small remainder from commissions, support services, and advertising. That mix matters because it means Spinny''s growth quality is driven mainly by inventory throughput, pricing, procurement discipline, and logistics rather than by recurring high-margin subscription-style revenue.


    Scale markers reinforce the same point. IPO-preparation reporting says Spinny sells close to 15,000 vehicles a month, serves buyers across 25 cities, and sources seller inventory from more than 100 cities. This is already a very large operating base, and Entrackr further reports FY26 revenue could reach roughly Rs 6,000 crore. The business is therefore large enough to matter in public markets, but its quality must still be assessed like a retailer with service adjacencies, not like a capital-light software business.'
