- id: exit-readiness-and-final-diligence
  title: Exit readiness, kill triggers, and final diligence asks
  body: 'Spinny''s public-company conversion and banker appointments make the IPO route plausible, but plausibility is not readiness. Public investors will want far more than revenue growth and market narrative. They will want clarity on margins, complaint rates, working-capital needs, service economics, and whether GoMechanic strengthens or complicates the story. That means the decisive diligence asks are all company-specific and operating-specific, not generic category questions.


    The thesis would break if complaint or support issues worsened with scale, if integration created a governance problem, or if a public-filing process revealed much weaker economics than secondary reporting implies. Conversely, a cleaner disclosure set on margins and integration could upgrade the stance materially. Until then, the investment case remains interesting but unfinished. That is exactly the kind of setup where a watchlist stance is more defensible than aggressive entry for outside investors today.'
