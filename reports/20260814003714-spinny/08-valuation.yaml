- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold / event
  - Transmission to thesis
  - Action implication
  rows:
  - - Complaint and support deterioration
    - Evidence of rising issue rates as volume scales
    - Undercuts trust moat and referral loop
    - Downgrade valuation stance
  - - GoMechanic governance surprise
    - Any credible control or audit problem post-close
    - Turns services expansion from upside to liability
    - Avoid new capital
  - - Public-market multiple reset
    - Sector comps rerate lower while Spinny stays opaque
    - Current private mark becomes hard to defend
    - Demand steeper entry discount
  - - IPO filing reveals weak economics
    - Margins or cash conversion much weaker than expected
    - Breaks bull/base underwriting
    - Move from track to avoid
  notes: These triggers are designed to be monitored on each refresh cycle.
