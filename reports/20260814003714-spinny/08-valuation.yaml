  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: valuation inputs
    missingEvidence: Gross margin, contribution margin, cash flow, and working-capital disclosure.
    whyItMatters: Valuation cannot be underwritten with confidence while the most important drivers remain private.
    diligencePath: Request IPO-grade financial package or banker data room access before any buy decision.
  - type: private-evidence-only
    severity: material
    topic: GoMechanic pro forma
    missingEvidence: Integration model, service attach targets, and downside protections on the deal.
    whyItMatters: The biggest visible source of upside is also the largest new source of execution risk.
    diligencePath: Review transaction model, governance package, and post-close milestones.
  - type: missing-source
    severity: material
    topic: customer quality denominator
    missingEvidence: Complaint incidence, support SLAs, and referral quality by cohort.
    whyItMatters: Trust is the main moat claimed for Spinny, so valuation should move on real quality metrics.
    diligencePath: Request internal service-quality dashboard and cohort behavior by city and segment.
