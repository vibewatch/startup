chapter:
  number: 8
  title: Valuation
  summary: Spinny looks investable enough to track closely but not transparent enough to underwrite aggressively at face value. Public evidence supports a company-level valuation anchor around the long-standing unicorn mark, but the lack of IPO-grade disclosure on margins, cash flow, and complaint-rate economics keeps the current stance at track with medium confidence and a fair-to-stretched read on valuation.
sections:
- id: recommendation-and-stance
  title: Recommendation, confidence, and valuation stance
  body: 'On public evidence, Spinny looks like a company to track rather than a company to buy blindly. The case for interest is real: strong revenue scale, a still-large private valuation, a credible IPO path, and a category that is formalizing quickly. The case for restraint is equally real: the company remains private, key valuation drivers such as gross margin and cash flow are undisclosed, and the GoMechanic transaction increases both opportunity and execution complexity.


    That combination supports a medium-confidence, high-risk, fair-to-stretched valuation stance. There is enough franchise value to avoid an outright avoid rating, but not enough public evidence to issue an uncomplicated buy. The right posture is price-sensitive and diligence-sensitive. Investors should therefore care at least as much about missing evidence as about the headline company story. That discipline is especially important before an eventual IPO window hardens public expectations.'
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV004
  - CV031
  - CV040
  tableRefs:
  - TV001
  figureRefs:
  - FV001
  - FV004
- id: valuation-context-and-comps
  title: Current valuation context and comparable set
  body: 'The strongest public valuation anchor for Spinny is still the 2021 unicorn round that valued the company at roughly $1.75 billion. Later 2025 reporting adds more capital—about $170 million in Series F and another $160 million in Series G—but does not clearly disclose a radically different company-level mark. That means the public analyst is effectively triangulating around a sticky private valuation, not a clean recent repricing. Against FY25 revenue of about Rs 4,657 crore, that anchor implies a revenue multiple a little above 3x; against an FY26 revenue expectation near Rs 6,000 crore, the multiple falls closer to the mid-2x range.


    Those multiples are not absurd for a fast-growing platform, but they are also not obviously cheap when compared with public used-car and digital auto peers. Carvana, CarMax, AUTO1, and CarTrade Tech all offer more disclosure than Spinny. That demands a private-market discount, not a premium, unless Spinny can demonstrate superior unit economics. Put differently, the current mark is easier to defend as a private carry value than as an unquestioned public clearing price today.'
  claimRefs:
