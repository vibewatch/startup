companyProfile:
  summary: >
    Spinny is a Gurugram-based used-car marketplace founded in 2015 by Niraj Singh, Mohit Gupta,
    and Ramanshu Mahaur. The company operates a trust-led, full-stack model that acquires or curates
    inventory, inspects and reconditions vehicles, supports financing and paperwork, and adds post-sale
    guarantees and service touchpoints. Spinny became a unicorn in 2021, reached roughly Rs 4,657 crore
    of FY25 revenue with narrowing losses, converted its parent into a public company during 2025, and
    is now positioning itself for a potential IPO while using the GoMechanic acquisition to expand into
    after-sales ownership economics.
  founders:
    - name: Niraj Singh
      role: Co-Founder
      background: IIT Delhi alumnus; part of the founding team that positioned Spinny around trust and operational control.
      claimRefs: [CO002, CO029]
    - name: Mohit Gupta
      role: Co-Founder
      background: Previously worked at Flipkart before helping build Spinny's used-car marketplace model.
      claimRefs: [CO002, CO029]
    - name: Ramanshu Mahaur
      role: Co-Founder
      background: IIT Delhi alumnus; co-founded Spinny with a focus on building a scaled, trust-led used-car retail operation.
      claimRefs: [CO002, CO029]
  foundingLocation: NCR / Gurugram, India
  headquarters: Gurugram, Haryana, India
  productSummary: >
    Spinny sells certified used cars through an integrated retail model that combines sourcing, 200-point
    inspection, pricing, merchandising, financing assistance, test drives, paperwork support, warranty,
    returns, and a growing after-sales layer anchored by the GoMechanic transaction.
  customerFocus: Mass-premium Indian used-car buyers and sellers who value trust, certification, financing support, and a managed ownership journey over informal dealer-market transactions.
  businessModel: >
    Revenue is driven primarily by used-car sales turnover, with value creation shaped by inspection-led
    pricing discipline, ancillary financing and transaction support, and a developing after-sales service
    stack intended to raise customer lifetime value.
  stage: Series G / pre-IPO private
  fundingStatus: 2021 unicorn round at about $1.75B valuation; roughly $170M Series F and $160M Series G in 2025, with the latter tied to the GoMechanic acquisition and IPO preparation.
