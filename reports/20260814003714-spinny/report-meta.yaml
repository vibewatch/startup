  topStrengths:
    - Spinny operates a trust-led, full-stack used-car model with real operational control rather than a thin classifieds layer.
    - FY25 revenue of roughly Rs 4,657 crore shows category-scale demand and meaningful execution progress.
    - Brand, inspection, warranty, and process control create a clearer quality proposition than much of India's informal used-car market.
    - The GoMechanic deal can expand Spinny from transaction economics into after-sales monetization if integration succeeds.
    - IPO preparation steps and strong investor backing keep strategic optionality open.
  topRisks:
    - Private-company opacity leaves margins, cash flow, working-capital intensity, and normalized unit economics insufficiently disclosed.
    - GoMechanic integration adds execution, governance, and distraction risk at a sensitive pre-IPO moment.
    - Support, RC-transfer, and post-sale workflow friction can damage the trust moat if service quality slips with scale.
    - Competition from Cars24, CarDekho, OEM-backed channels, and classifieds-led alternatives can pressure growth and pricing.
    - Used-car retail remains capital- and operations-intensive, making public-market sentiment toward auto-commerce multiples important.
  unresolvedGaps:
    - Audited visibility into gross margin, contribution margin, and operating cash flow remains unavailable.
    - Pro forma economics and integration milestones for GoMechanic have not been publicly disclosed in enough detail.
    - Customer retention, complaint-rate denominators, and repeat-purchase cohorts are still opaque.
    - True all-India market share versus Cars24, CarDekho, OEM channels, and local incumbents remains only partially measured.
    - IPO timing, filing readiness, and the valuation investors would accept in a public process are still uncertain.
