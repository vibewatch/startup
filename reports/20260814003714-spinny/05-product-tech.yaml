- id: workflow-and-operating-architecture
  title: Workflow and operating architecture
  body: 'The core customer workflow begins with digital discovery and comparison, but it quickly becomes physical. Customers can book test drives at home or at a hub, rely on Spinny for financing or documentation support, and receive cars that have already been routed through inspection and refurbishment processes. In that sense, Spinny is closer to an operating system for trusted used-car transactions than to a classifieds portal. The product architecture therefore runs across sourcing, inspection, pricing, listing, finance, delivery, and post-sale support.


    This architecture also explains why public technical evidence is sparse. Spinny has a consumer app on Google Play, but no retained public API docs, open-source repositories, or engineering handbooks. The closest public developer signal is therefore practitioner-facing distribution evidence like the app surface itself, plus operational docs on inspection and warranty. That makes the product legible from a workflow perspective while leaving the inner software architecture largely opaque.'
  claimRefs:
  - CE012
  - CE013
  - CE014
  - CE027
