evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: funding-history
    missingEvidence: Exact seed amount, Series A amount, MUFG check size, and current total capital raised.
    whyItMatters: Conflicting headline funding figures make valuation and dilution analysis unreliable.
    diligencePath: Request cap-table summary, financing press materials, and signed round documents from management.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: material
    topic: disclosure-gaps
    missingEvidence: ARR, revenue run-rate, gross margin, burn, and customer count disclosures.
    whyItMatters: Later financial and valuation chapters cannot underwrite the business from product rhetoric alone.
    diligencePath: Obtain management KPI pack or investor update covering revenue quality, retention, and customer concentration.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: governance-bench
    missingEvidence: Current executive roster, board composition, and role definitions beyond the CEO.
    whyItMatters: Governance depth and key-person dependence materially affect execution and diligence readiness.
    diligencePath: Ask for a current org chart, board list, and role biographies.
    relatedQuestionRefs:
      - QO003
      - QO004
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: customer-traction
    missingEvidence: Named customers, contract values, deployment timelines, and renewal behavior.
    whyItMatters: Unnamed Fortune 100 claims are directionally positive but cannot prove breadth, concentration, or stickiness.
    diligencePath: Request customer references, revenue concentration schedule, and cohort renewal data.
    relatedQuestionRefs:
      - QO006
      - QO008
    relatedTableRefs:
      - TO001
      - TO003
  - type: access-blocked
    severity: minor
    topic: investor-transparency
    missingEvidence: A functioning public finance or investor-information page.
    whyItMatters: >-
      The broken /finance surface increases friction for verifying historical fundraising and current disclosure
      posture.
    diligencePath: Ask management for the intended investor-information landing page or archived financing materials.
    relatedQuestionRefs:
      - QO004
      - QO005
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      Customer-count cohorts, pricing ranges or ACV, renewal behavior, and any internal market-sizing memo that links
      target verticals to expected contract volume.
    whyItMatters: >-
      Without a denominator for logos, contract size, or expansion velocity, the market narrative cannot be converted
      into a defensible serviceable-obtainable market or valuation share-capture case.
    diligencePath: >-
      Request price sheets or redacted MSAs, customer-count and ARR cohorts, renewal/expansion metrics, and any board or
      fundraising material that sizes the target verticals with a bottom-up method.
    relatedQuestionRefs:
      - QM008
  - type: missing-source
    severity: material
    topic: public-pricing
    missingEvidence: Public pricing tiers, contract minimums, or marketplace economics for NEXUS.
    whyItMatters: >-
      Without pricing transparency, it is hard to compare win-rate, CAC, margin, or bundling risk against incumbent
      alternatives.
    diligencePath: >-
      Obtain current marketplace screenshots, SKU terms, or customer contract excerpts that show packaging and
      commercial structure.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: independent-benchmarking
    missingEvidence: >-
      Independent benchmark results versus bespoke tabular ML, Databricks workflows, or other enterprise AI
      alternatives.
    whyItMatters: >-
      The moat case is weaker when performance advantages appear only in company-controlled or company-amplified
      evidence.
    diligencePath: >-
      Request customer-approved benchmark decks, third-party evaluations, or deployment readouts that compare NEXUS with
      incumbent alternatives on the same task and dataset.
    relatedQuestionRefs:
      - QP007
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: material
    topic: switching-behavior
    missingEvidence: >-
      Named examples of what incumbent tool or workflow NEXUS displaced, plus renewal or expansion behavior after
      proof-of-value.
    whyItMatters: >-
      Switching evidence is necessary to distinguish a category-defining wedge from a pilot-stage feature adoption
      story.
    diligencePath: >-
      Request customer references or anonymized case studies that identify displaced workflows, time-to-value, contract
      expansion, and operational ownership after deployment.
    relatedQuestionRefs:
      - QP003
      - QP008
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: pricing-disclosure
    missingEvidence: Public or management-shared pricing architecture, contract terms, and realized discounting by customer type.
    whyItMatters: >-
      Pricing architecture determines whether current traction is repeatable software revenue or bespoke project
      economics.
    diligencePath: Request a pricing sheet, sample MSA/order form, and cohort of signed deals with ACV, term, and renewal rights.
    relatedQuestionRefs:
      - QI002
    relatedTableRefs:
      - TI002
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: CAC, sales-cycle length, payback, software gross margin, services gross margin, and support-load metrics.
    whyItMatters: The GTM motion looks consultative enough that margin quality cannot be inferred from product positioning alone.
    diligencePath: >-
      Request board KPI packs or finance dashboards covering CAC, gross margin by revenue type, and implementation
      effort per account.
    relatedQuestionRefs:
      - QI004
    relatedTableRefs:
      - TI003
  - type: conflicting-data
    severity: material
    topic: funding-total
    missingEvidence: >-
      Reconciled capitalization summary showing seed, Series A, and MUFG investment amounts plus post-close cash on
      hand.
    whyItMatters: >-
      The difference between $255 million and $275 million may be trivial or meaningful, but investors cannot tell
      without a reconciled funding bridge.
    diligencePath: Request the cap table summary, closing press materials, and the exact MUFG investment amount.
    relatedQuestionRefs:
      - QI006
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: Cash balance, monthly burn, runway, debt facilities, and the operating plan that sets the next financing trigger.
    whyItMatters: Capital adequacy is a core underwriting question and cannot be answered from funding headlines alone.
    diligencePath: Request the latest board package or monthly finance pack with cash, burn, forecast, and debt covenant detail.
    relatedQuestionRefs:
      - QI006
      - QI008
  - type: private-evidence-only
    severity: material
    topic: trust-controls
    missingEvidence: Public trust center, certification list, security documentation, or status-history evidence for NEXUS deployments.
    whyItMatters: >-
      Security-sensitive deployment is central to the product thesis, so investors need proof that controls exist beyond
      marketing language.
    diligencePath: >-
      Request trust-center materials, SOC or ISO evidence if any, architecture/security review artifacts, and customer
      security questionnaires.
    relatedQuestionRefs:
      - QE006
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: material
    topic: benchmark-proof
    missingEvidence: >-
      Independent benchmark results, model cards, or customer-authored implementation evidence that quantify NEXUS
      performance versus alternatives.
    whyItMatters: >-
      Without neutral technical proof, the company-claimed accuracy and speed advantages remain hard to underwrite at a
      premium valuation.
    diligencePath: >-
      Request third-party benchmarks, customer reference architectures, and detailed proof-of-value readouts against
      baseline models.
    relatedQuestionRefs:
      - QE007
    relatedTableRefs:
      - TE001
      - TE002
  - type: access-blocked
    severity: minor
    topic: public-product-surface
    missingEvidence: Accessible third-party product coverage and complete official vertical pages for NEXUS.
    whyItMatters: >-
      Broken or JS-only public surfaces make it harder to verify positioning depth and reduce confidence in how much
      product proof is externally visible.
    diligencePath: >-
      Refresh the blocked public pages or replace them with accessible product documentation and case-study URLs before
      publication.
  - type: missing-source
    severity: material
    topic: retention-metrics
    missingEvidence: Public NRR, GRR, churn, renewal-rate, or contract-length disclosure for the current customer base.
    whyItMatters: Durability cannot be underwritten from launch momentum alone, especially at an early-stage enterprise valuation.
    diligencePath: >-
      Request cohort-level renewal data, contract durations, and the first post-launch expansion / contraction cohort
      review.
    relatedQuestionRefs:
      - QU008
  - type: missing-source
    severity: material
    topic: customer-denominator
    missingEvidence: Named production customers, customer count, deployment count, and public references with measurable outcomes.
    whyItMatters: >-
      Paid contracts and route-to-market signals do not reveal whether adoption is broad, repeatable, or concentrated in
      a handful of lighthouse accounts.
    diligencePath: Request a customer list by vertical with production status, ACV band, deployment stage, and referenceability.
    relatedQuestionRefs:
      - QU003
      - QU007
  - type: enumeration-incomplete
