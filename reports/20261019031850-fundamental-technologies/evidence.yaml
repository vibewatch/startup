      - QU003
      - QU007
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: concentration-and-channel-mix
    missingEvidence: >-
      Share of bookings routed through AWS, top-customer revenue share, and any diversification across channels or
