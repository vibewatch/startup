company:
  name: Fundamental Technologies
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Fundamental sells NEXUS as a tabular-native prediction foundation model for structured
    enterprise data, with deployment positioned inside the customer's own cloud boundary rather
    than as a shared SaaS service. The public technical story is strongest on deployment posture
    and use-case breadth, but the assigned evidence pool still leaves diligence open on trust
    controls, independent benchmark leadership, and how repeatable the implementation burden is
    outside forward-deployed engagements.
sections:
  - id: product-definition
    title: Product definition and customer workflow
    body: >-
      Public product surfaces describe NEXUS as a Large Tabular Model built for prediction tasks
      over structured enterprise data, not for language generation, and position it as a reusable
      foundation model that can be applied across multiple datasets and business problems instead
      of rebuilding bespoke models use case by use case. The workflow emphasis is enterprise
      decision support: forecasting demand or revenue, flagging churn, scoring risk and fraud,
      underwriting credit, planning maintenance, setting prices, and optimizing supply chains.
      That is a credible customer-workflow framing for a forward-deployed enterprise ML product,
      but the measurable performance uplift remains mostly company-asserted in this pool rather
      than independently benchmarked, and the public evidence still does not show where adoption
      is deepest by vertical or workflow.
    claimRefs: [CE001, CE002, CE003, CE005, CE006]
    tableRefs: [TE001, TE002]
  - id: deployment-architecture
    title: Deployment architecture and delivery model
    body: >-
      The most concrete maturity signal is deployment posture rather than benchmark disclosure.
      Microsoft Marketplace and independent coverage both say NEXUS runs inside the customer's
      own environment, while the October 2026 forward-deployed data-scientist role shows
      implementations still require containerization, APIs, PySpark or Pandas data handling, and
      support for virtual private cloud, on-premises, and air-gapped environments. That implies a
      product that is architected for security-sensitive enterprises but still depends on
      substantial last-mile integration and benchmarking work by customer-facing technical staff
      before value is proven in production.
    claimRefs: [CE004, CE007, CE008, CE009, CE010]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: differentiation-and-risks
    title: Differentiation, technical credibility, and open diligence items
    body: >-
      Fundamental's differentiation story combines a tabular-native modeling thesis, deterministic
      outputs for regulated workflows, and a technically credible founding bench, including Marta
      Garnelo's prior academic work. The gap is that independent public proof still lags the
      ambition of the positioning: an external 2026 practitioner review describes tabular
      foundation models as a field where the state of the art changes quickly and explicitly
      recommends a rival model, while the assigned pool does not surface a trust center,
      certification set, status telemetry, or independent benchmark pack that would let an
      investor verify durability of the launch-page performance claims or separate a strong
      initial launch narrative from repeatable, audited technical advantage.
    claimRefs: [CE006, CE011, CE012, CE013, CE014]
tables:
  - id: TE001
    title: Product module / asset matrix
    columns:
      - Module / asset / product line
      - Buyer / user
      - Status / maturity
      - Differentiation
      - Diligence gap
    rows:
      - - NEXUS core LTM
        - Enterprise data science, risk, and operations teams
        - Publicly launched and marketplace-listed in 2026
        - Tabular-native foundation model positioned for prediction rather than language
        - No independent benchmark pack in the assigned pool verifies relative accuracy leadership
      - - Secure deployment footprint
        - IT, platform, and security teams
        - Public architecture defined; production proof appears services-led
        - Runs inside customer VNet or VPC with customer data kept in-environment
        - Missing public trust-center, certification, and status-page evidence
      - - Forward-deployed benchmarking and implementation
        - Customer data scientists and stakeholder teams
        - Active operating model as of October 2026 hiring
        - Benchmarks against XGBoost and LightGBM while handling data engineering and validation
        - Repeatability without heavy field support is not disclosed
      - - Regulated-industry prediction workflows
        - Financial, industrial, and operations users
        - Positioned publicly; customer names and production outcomes remain limited in this pool
        - Deterministic numerical outputs are marketed as better suited to regulated use cases
        - Public evidence does not quantify deployment count, uptime, or renewal behavior
    notes: >-
      Rows combine official positioning, independent news coverage, and the October 2026 hiring
      signal; missing cells reflect absent public verification in the assigned source pool, not a
      negative finding.
    claimRefs: [CE001, CE003, CE004, CE006, CE008, CE009]
  - id: TE002
    title: Workflow / use-case table
    columns:
      - User job
      - Current workflow
      - Company solution
      - Measurable benefit
      - Limitation
    rows:
      - - Demand or revenue forecasting
        - Bespoke model building and tuning for each dataset
        - Reuse NEXUS across prediction tasks on enterprise tables
        - Company claims faster deployment and less feature engineering
        - No third-party public accuracy delta in the assigned pool
      - - Customer churn prediction
        - Traditional supervised ML projects with hand-crafted features
        - Apply the same pre-trained model to another prediction task
        - Company says the model can generalize across datasets and tasks
        - Customer production outcomes are not disclosed here
      - - Risk, fraud, and credit underwriting
        - Domain-specific statistical models plus compliance review
        - Deterministic numerical scoring inside customer-controlled environments
        - Positioning aligns with regulated workflow requirements
        - No public certification or model-governance package is provided in this pool
      - - Predictive maintenance and supply chain optimization
        - Customized analytics pipelines and validation cycles
        - Tabular foundation-model workflow for industrial data
        - Public use-case breadth suggests cross-vertical applicability
        - Evidence here stops at positioning, not measured deployment depth
    notes: >-
      Benefits are stated exactly at the level supported by the sources: mostly company-claimed,
      with independent corroboration limited to deployment posture and category framing.
    claimRefs: [CE002, CE003, CE004, CE006]
  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / process / component
      - Role
      - Dependency
      - Risk
    rows:
      - - Structured enterprise tables and databases
        - Source data for prediction tasks
        - Customer data quality and access inside enterprise systems
        - Public evidence does not show how much preprocessing remains customer-specific
      - - Pre-trained NEXUS LTM
        - Core prediction engine across multiple use cases
        - Foundational model training and adaptation to each client dataset
        - Performance claims remain mostly self-published in this pool
      - - Secure runtime boundary
        - Keep inference inside customer VNet or VPC with confidential-computing positioning
        - Customer cloud estate or controlled infrastructure
        - Trust controls, certifications, and telemetry are not publicly evidenced here
      - - Forward-deployed integration loop
        - Benchmark against legacy baselines, prevent data leakage, and support production rollout
        - Containerization, APIs, orchestration, and field engineering talent
        - Scalability of a services-heavy model is not quantified publicly
    notes: >-
      This architecture table reflects only what the assigned sources support directly; it should
      not be read as a full technical design document or certification inventory.
    claimRefs: [CE002, CE004, CE007, CE008, CE009, CE014]
