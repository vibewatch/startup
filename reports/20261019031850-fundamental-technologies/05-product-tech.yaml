  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: trust-controls
      missingEvidence: Public trust center, certification list, security documentation, or status-history evidence for NEXUS deployments.
      whyItMatters: Security-sensitive deployment is central to the product thesis, so investors need proof that controls exist beyond marketing language.
      diligencePath: Request trust-center materials, SOC or ISO evidence if any, architecture/security review artifacts, and customer security questionnaires.
      relatedQuestionRefs: [QE006]
      relatedTableRefs: [TE003]
    - type: missing-source
      severity: material
      topic: benchmark-proof
      missingEvidence: Independent benchmark results, model cards, or customer-authored implementation evidence that quantify NEXUS performance versus alternatives.
      whyItMatters: Without neutral technical proof, the company-claimed accuracy and speed advantages remain hard to underwrite at a premium valuation.
      diligencePath: Request third-party benchmarks, customer reference architectures, and detailed proof-of-value readouts against baseline models.
      relatedQuestionRefs: [QE007]
      relatedTableRefs: [TE001, TE002]
    - type: access-blocked
      severity: minor
      topic: public-product-surface
      missingEvidence: Accessible third-party product coverage and complete official vertical pages for NEXUS.
      whyItMatters: Broken or JS-only public surfaces make it harder to verify positioning depth and reduce confidence in how much product proof is externally visible.
      diligencePath: Refresh the blocked public pages or replace them with accessible product documentation and case-study URLs before publication.
