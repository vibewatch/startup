callouts:
  - calloutType: strength
    title: Secure-by-deployment posture is the clearest product proof
    body: >-
      The strongest corroborated part of the product story is not raw benchmark performance but
      the deployment model: NEXUS is consistently described as running inside customer-controlled
      infrastructure and supporting VPC, on-premises, and air-gapped environments.
    claimRefs: [CE004, CE008]
  - calloutType: risk
    title: Public proof still trails the technical ambition
    body: >-
      Investors can see the positioning and services model, but the assigned pool still lacks the
      neutral benchmark, trust, and telemetry evidence needed to verify whether NEXUS scales
      beyond high-touch deployments with durable technical advantage.
    claimRefs: [CE005, CE011, CE012, CE014]
