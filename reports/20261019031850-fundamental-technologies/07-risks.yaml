      - Mitigation
      - Residual exposure
    rows:
      - ["Infrastructure and marketplace route", "Amazon Web Services", "Hosting, deployment, and go-to-market channel", "High", "If AWS economics, technical requirements, or commercial alignment change, deployments and distribution both tighten at once.", "Severe", "Preserve customer-owned environments, document alternative hosting roadmap, and prove direct-sales motion independent of marketplace flow.", "High while public deployment evidence remains AWS-centric."]
      - ["Customer proof and renewals", "A small number of undisclosed Fortune 100 buyers", "Revenue validation and expansion base", "High", "If a few seven-figure pilots or early contracts stall at renewal, the valuation loses its most visible commercial proof points.", "Severe", "Prioritize named references, renewal metrics, and buyer diversification before the next valuation step-up.", "High until named production references and renewal data are visible."]
      - ["Strategic expansion and channel validation", "MUFG Innovation Partners / Japan entry", "Geographic expansion and enterprise introductions", "Medium", "If Japan traction depends on one strategic sponsor rather than repeatable local demand, expansion burns time without durable revenue.", "High", "Convert the MUFG signal into disclosed customers, referenceable use cases, and a repeatable partner playbook.", "Medium to high until customer evidence catches up."]
    notes: "This register focuses on counterparties that currently carry both execution upside and downside; it does not treat the existence of a partner or investor as proof of durable channel performance."
    claimRefs: [CR002, CR003, CR008, CR009, CR013]
