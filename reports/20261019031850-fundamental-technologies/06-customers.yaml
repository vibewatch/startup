schemaVersion: report-v2
artifact: customers
slug: fundamental-technologies
runDate: 2026-10-19
company:
  name: Fundamental Technologies
chapter:
  number: 6
  title: Customers
  summary: >-
    Public evidence supports real early enterprise demand for Fundamental: the company says AWS
    customers can buy and deploy NEXUS through their existing dashboard, it disclosed seven-figure
    Fortune 100 contracts before public launch, and recruiting evidence points to proof-of-value
    and post-implementation work with live enterprise environments. What remains missing is the
    denominator that matters for durability: no source in the assigned pool names production
    customers, discloses customer count, or provides renewal, churn, NRR, or top-account
    concentration metrics.
sections:
  - id: customer-segments
    title: Customer segments are visible, but mostly through use-case narratives rather than named accounts
    body: >-
      Fundamental's public customer narrative is strongest at the segment and workflow level.
      Official launch material repeatedly frames banks, manufacturers, and retailers as the most
      natural buyers because those organizations already run critical decisions through large
      structured datasets. The independent Japan entry article extends that framing into
      manufacturing, retail, and telecommunications, while the recruiting surface adds Houston oil
      and gas as an explicit initial vertical for the forward-deployed team. Put together, the
      evidence points to an enterprise, multi-stakeholder sales motion aimed at regulated or
      operationally complex buyers rather than a broad self-serve analytics product. The gap is
      that almost all of this is segment proof, not named customer proof: even where use cases are
      concrete, public sources still stop short of identifying live production logos or describing
      account scale by vertical.
    claimRefs: [CU003, CU005, CU006, CU007, CU013]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-proof
    title: Adoption proof is commercial and implementation-oriented, but still early and mostly unnamed
    body: >-
      The strongest public adoption signal is Fundamental's February 2026 launch announcement. The
      company says AWS customers can buy and deploy NEXUS inside their AWS environment and that it
      had already signed seven-figure Fortune 100 contracts for demand forecasting, price
      prediction, and customer churn. Independent commentary and the company reposted recruiting
      surface reinforce an implementation-heavy motion: the product is presented as integrating into
      existing stacks with minimal code, while the forward-deployed data scientist role is expected
      to benchmark against incumbent baselines, support proof-of-value work, and carry accounts
      into secure production environments. That mix is consistent with a high-touch enterprise sale
      where commercial proof exists, but it is not yet the same thing as broad, named deployment
      evidence with public outcomes and clear production counts.
    claimRefs: [CU001, CU002, CU004, CU008, CU015]
    tableRefs: [TU002, TU003]
  - id: durability-and-concentration
    title: The underwritten risk is durability, concentration, and channel dependence
    body: >-
      Public retention evidence is materially thinner than the launch narrative. Across the allowed
      source pool, no source discloses customer count, renewal rate, churn, GRR, NRR, contract
      length, or revenue share by top account, so the durability of the early enterprise pipeline
      cannot be tested in public. The assigned official finance URL also returned a 404 page rather
      than a finance customer case study. The same evidence that strengthens the go-to-market story
      creates concentration questions: Simplify's critical summary highlights dependence on AWS for
      distribution, pricing, and customer access, and it flags the risk that seven-figure contracts
      could leave revenue concentrated in a small number of buyers. Investor network and portfolio
      support may help open doors, but those are channel-enablement signals rather than proof of
      repeatable expansion or healthy renewals.
    claimRefs: [CU009, CU010, CU011, CU012, CU014, CU016]
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Public use case
      - Public scale signal
      - Strategic value
      - Diligence gap
    rows:
      - - Financial institutions / banking
        - "Buyer: risk and operations leaders; users: data science and business teams; payer: enterprise IT or business unit"
        - Risk modeling, fraud, institution-stress prediction
        - Official launch and Japan-entry materials describe this category, but no named bank customer is public
        - Large, regulated datasets align tightly with NEXUS positioning
        - No named bank deployment, contract term, or revenue exposure disclosed
      - - Retail / commerce
        - "Buyer: merchandising or operations leadership; users: analytics teams; payer: retail business unit"
        - Demand forecasting, price prediction, inventory shortfall prediction
        - Seven-figure contract and use-case language are public; no logo-level proof
        - High-frequency decisions make fast predictive deployment commercially relevant
        - No public evidence on production depth, seat count, or renewal behavior
      - - Oil & gas / industrials
        - "Buyer: operations or asset owners; users: data science and technical stakeholders; payer: operating business unit"
        - Production use cases with measurable ROI in Houston-based oil and gas accounts
        - Recruiting surface names an initial Houston customer focus and post-implementation support
        - Shows Fundamental is pursuing heavy-asset workflows beyond finance
        - No named account, go-live date, or quantified outcome is public
      - - Manufacturing / telecom / Japan entry
        - "Buyer: enterprise transformation or analytics leaders; users: local operating teams; payer: country or business-line budget"
        - Demand forecasting, risk analysis, optimization
        - MUFG-backed Japan entry targets these sectors, but signed accounts are undisclosed
        - Expands the story beyond U.S. launch demand and into a regulated international market
        - Pipeline evidence is stronger than delivered-customer evidence
    notes: >-
      Compiled from official launch messaging, the assigned Japan-entry article, and the public
      recruiting surface; rows describe visible segment fit and public sales signals, not confirmed
      customer counts or revenue mix.
    claimRefs: [CU003, CU005, CU006, CU007, CU015]
  - id: TU002
    title: Customer growth / adoption trajectory table
    columns:
      - Metric
      - Value
      - Date
      - Source
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - - Pre-launch commercial proof
        - Seven-figure contracts with Fortune 100 enterprises
        - "2026-02-05"
        - Company launch announcement
        - Medium
        - Indicates real paid demand before public launch
        - Number of accounts, production status, and contract duration
      - - Distribution channel
        - AWS customers can buy and deploy NEXUS through the AWS dashboard
        - "2026-02-05"
        - Company launch announcement plus later critical summary
        - High
        - Lowers procurement friction and expands reach to existing AWS buyers
        - Marketplace conversion, pricing power, and share of volume routed through AWS
      - - Implementation capacity
        - Forward-deployed team supports proof-of-value, benchmarking, and post-implementation production operation
        - "2026-10-16"
        - Public recruiting surface
        - Medium
        - Suggests a services-heavy land-and-expand motion with customer success work after sale
        - Team size, deployment throughput, and attach rate across accounts
      - - Geographic / vertical expansion
        - MUFG-backed Japan expansion targets manufacturing, retail, and telecom workflows
        - "2026-07-24"
        - Independent Japan-entry article
        - Medium
        - Shows pipeline broadening beyond the original U.S. launch narrative
        - Signed customer count and conversion from investor/channel relationships
    notes: >-
      This table tracks public adoption signals rather than audited customer metrics. Missing
      denominators are the core diligence issue because none of the assigned sources discloses
      account count, deployment count, or renewal behavior.
    claimRefs: [CU001, CU002, CU004, CU007, CU014, CU015]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer / proxy
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome
      - Limitation
    rows:
      - - Unnamed Fortune 100 enterprises
        - Large-enterprise buyers across forecasting workflows
        - Demand forecasting, price prediction, customer churn
        - Commercial contracts are disclosed; named production logos are not
        - Strongest public proof that buyers are paying
        - Accounts are unnamed, customer count is undisclosed, and production depth is unverified
      - - AWS customer channel
        - Existing AWS enterprise customers
        - Buy and deploy NEXUS inside AWS environment / dashboard
        - Purchase path is explicit; actual customer conversion is not
        - Reduces procurement friction and adds a scaled route to market
        - Channel evidence is not the same as named end-customer proof
      - - Houston oil & gas customers
        - Asset-heavy industrial accounts
        - Proof-of-value, benchmarking, last-mile integration, and post-implementation support
        - "Mixed: evidence implies live delivery work, but named production accounts are absent"
        - Shows a concrete vertical deployment team and ROI-oriented motion
        - Customer names, outcomes, and contract economics remain private
      - - Japan enterprise pipeline via MUFG
        - Manufacturing, retail, and telecom buyers in Japan
        - Demand forecasting, risk analysis, optimization in customer VPC environments
        - Early market-entry signal rather than proven production deployment
        - Suggests expansion into a regulated international market
        - Investor/channel proof, not named customer proof
    notes: >-
      Public evidence is only a partial sample of customer proof. The table separates direct
      commercial signals from proxy/channel signals so readers do not confuse route-to-market
      evidence with named production deployments.
    enumerationScope:
      coverage: partial
      basis: Publicly disclosed customer and channel evidence in the assigned prefetched pool as of 2026-10-19.
    claimRefs: [CU001, CU002, CU004, CU007, CU009, CU015]
figures:
  - id: FU001
    title: Customer acquisition and expansion journey
    type: journey-map
    summary: >-
      The visible motion is enterprise-first: enter through channel or executive relationships,
      prove value on customer data, deploy in a secure environment, and then expand by workflow or
      geography.
    data:
      nodes:
        - label: Channel and sponsor entry
          actor:
            - AWS
            - Investor and executive networks
          touchpoints:
            - AWS marketplace and dashboard access for existing buyers
            - Investor ecosystems in fintech and healthcare
        - label: Technical qualification
          actor:
            - Forward-deployed data scientist
            - Customer analytics and IT teams
          touchpoints:
            - Stakeholder alignment across IT, C-suite, and data science
            - Baseline comparison against incumbent models
        - label: Proof of value
          stage: Pre-production evaluation
          touchpoints:
            - Benchmarking against XGBoost and LightGBM
            - Business-problem framing and validation strategy
        - label: Secure deployment
          channel:
            - AWS environment
            - Customer VPC / on-prem / air-gapped environments
          touchpoints:
            - Dashboard purchase path
            - Last-mile integration into client production environments
        - label: Production use case
          phase: Initial live workflow
          touchpoints:
            - Demand forecasting, price prediction, customer churn
            - Vertical-specific ROI in complex enterprise settings
        - label: Expansion loop
          phase: New workflows and geographies
          touchpoints:
            - Additional industry use cases
            - Japan market entry through MUFG relationship
    claimRefs: [CU001, CU004, CU005, CU007, CU013, CU014, CU015]
