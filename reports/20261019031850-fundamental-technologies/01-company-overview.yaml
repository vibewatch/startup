company:
  name: Fundamental Technologies
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Fundamental Technologies presents itself as a tabular-AI specialist built around NEXUS, a
    large tabular model for enterprise prediction, with its clearest verified public signals
    centered on product positioning, a February 2026 launch, and continued hiring. The available
    October 2026 public pool still leaves material uncertainty around governance depth, customer
    specifics, and even headline financing totals, so this chapter anchors later work on identity
    while carrying explicit gaps forward.
sections:
  - id: identity-and-product-thesis
    title: Identity and product thesis
    body: >-
      The strongest current public identity signals are consistent on what Fundamental is trying to
      sell, even if they are lighter on corporate detail than on product rhetoric. Fundamental's
      own homepage and NEXUS page describe NEXUS as a Large Tabular Model for enterprise prediction
      and emphasize pre-training across billions of rows and columns rather than custom model
      building for each use case. The same official materials also frame deployment flexibility as
      part of the pitch, spanning managed SaaS, customer cloud, and private infrastructure, while
      a July 2026 third-party article adds that the Japan-market pitch centers on in-customer VPC
      deployment with confidential computing. Third-party commercial metadata broadens the picture
      by listing San Francisco headquarters, Series A status, and a 2024 founding date, but those
      descriptors remain lightly corroborated compared with the product claims themselves.
    claimRefs: [CO001, CO002, CO003, CO005, CO006]
    tableRefs: [TO001]
    figureRefs: [FO001]
  - id: leadership-governance-and-disclosure
    title: Leadership, governance, and disclosure surface
    body: >-
      Named leadership evidence in the assigned October 2026 pool is thin. The clearest live
      attribution is Jeremy Fraenkel, identified on the launch material as CEO and co-founder and
      used as the public spokesperson for the core thesis that enterprise prediction is the next
      AI frontier. Beyond that, the pool is noticeably weaker: a preserved Google Scholar profile
      supports that Marta Garnelo has a visible machine-learning research record, but the current
      pool does not independently re-verify her present operating title at Fundamental. The public
      disclosure surface is also incomplete for an unusually well-funded company. The assigned
      /finance URL returned a 404 page on access, and the same broader source set that describes
      the company does not disclose board composition, current executive roster, or a clean
      investor-relations style summary, increasing key-person dependence on the CEO narrative.
    claimRefs: [CO004, CO008, CO012, CO016]
    tableRefs: [TO002]
  - id: funding-scale-and-milestones
    title: Funding, scale, and milestone signals
    body: >-
      External scale signals are directionally strong but numerically messy. AI Market Watch says
      Fundamental received a strategic investment from MUFG Innovation Partners and entered Japan
      in July 2026, while also describing a prior $225 million Series A from Battery Ventures and
      Salesforce Ventures. Simplify, however, lists total funding at $255 million in one metadata
      block and "$275m in funding" in the role-description body, producing an unresolved public
      conflict over headline financing totals. The same Simplify page claims Fortune 100 customer
      traction, sector breadth, low reported headcount growth, and a go-to-market dependency on
      AWS distribution, but it does not name customers, disclose revenue, or quantify concentration
      beyond editorial warnings that seven-figure contracts could leave growth exposed to a small
      number of buyers. Independent sector commentary also suggests the broader tabular-foundation-
      model field is moving quickly enough that product leadership should not be assumed from
      category positioning alone.
    claimRefs: [CO007, CO009, CO010, CO011, CO013, CO014, CO015]
    tableRefs: [TO003]
