      - Founder-market fit / key-person dependency
    rows:
      - ["Jeremy Fraenkel", "CEO & co-founder in official launch material", "Public spokesperson for the thesis that enterprise prediction needs a tabular-native foundation model", "Strong product-story ownership, but the assigned pool makes him the only clearly re-verified operating leader."]
      - ["Marta Garnelo", "Current Fundamental title not re-verified in the assigned 2026 pool", "Google Scholar profile shows multiple highly cited machine-learning publications under M Garnelo", "Suggests technical pedigree in preserved refresh evidence, but current company role still needs direct confirmation."]
    notes: >-
      This enumeration is intentionally narrow: it reflects only named individuals the assigned
      source pool could support without copying stale prior-report leadership claims.
    enumerationScope:
      coverage: partial
      basis: >-
        Limited to named people directly supported by the assigned October 2026 public source pool
        and preserved refresh evidence available to this chapter worker.
    claimRefs: [CO004, CO012, CO016]
  - id: TO003
    title: Stakeholder or investor map
    columns:
      - Stakeholder
      - Role
      - Control or economic importance
      - Diligence ask
    rows:
      - ["MUFG Innovation Partners", "Strategic investor / market-entry catalyst", "Independent article ties MUFG to Japan expansion and banking workflow validation", "Verify amount invested, commercial exclusivity, and whether distribution rights accompany the strategic check."]
      - ["Battery Ventures", "Named Series A investor", "One of the only publicly named financial backers in the assigned pool", "Confirm round size, ownership, and whether Battery remains active in the cap table after MUFG."]
      - ["Salesforce Ventures", "Named Series A investor", "Signals enterprise-software relevance, but the assigned pool does not show product or channel obligations", "Check if Salesforce introduces distribution leverage, co-selling, or data-cloud integration rights."]
      - ["AWS / SageMaker", "Infrastructure and distribution partner per third-party company profile", "Editorial critic summary says AWS may influence pricing, distribution, and customer access", "Confirm how much go-to-market depends on AWS marketplace placement versus direct sales."]
      - ["Fortune 100 customer base (unnamed)", "Demand signal / buyer cohort", "Seven-figure enterprise claims would matter economically, but customer identities and concentration are withheld", "Request named accounts, cohort age, renewal timing, and share of revenue represented by the top five customers."]
    notes: >-
      Rows combine named investors, a strategic distributor, and the highest-signal customer cohort
      visible in the assigned pool; economic importance is indicative, not a verified ownership map.
    enumerationScope:
      coverage: partial
      basis: >-
        Limited to stakeholders explicitly named in the assigned October 2026 public evidence and
        therefore excludes undisclosed board members, angels, and unnamed enterprise customers.
    claimRefs: [CO006, CO009, CO010, CO011, CO013, CO014]
