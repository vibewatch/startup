      - ["Flagship product", "NEXUS large tabular model for enterprise prediction", "Current", "High", null]
      - ["Deployment model", "Managed SaaS, customer cloud, private infrastructure; third-party also cites in-customer VPC", "Current / 2026-07-24", "Medium", "Architecture specifics and commercial packaging remain undisclosed."]
      - ["Total funding", "Conflicting public figures: $225M Series A, $255M total funding, $275M funding claim", "2026-02 to 2026-10", "Low", "Cap-table, round amounts, and post-money valuation need direct verification."]
      - ["Revenue / ARR", null, "Undisclosed", "Low", "No assigned source discloses revenue, ARR, margin, or burn."]
      - ["Customer count / logos", "Fortune 100 customer class claimed; no named customer count", "2026-10-16", "Low", "Customer concentration and renewals cannot be tested from the public pool."]
      - ["Headcount", "51-200 employees; 2% reported growth over 6 months, 1 year, and 2 years", "2026-10-16", "Low", "No official roster or payroll disclosure in assigned evidence."]
    notes: >-
      Snapshot mixes official product facts with third-party company-profile data and conflicting
      funding claims; null means the assigned October 2026 public pool did not support a reliable
      number.
    claimRefs: [CO001, CO003, CO005, CO009, CO010, CO011, CO012, CO013]
