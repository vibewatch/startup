callouts:
  - calloutType: risk
    title: Disclosure conflict outruns public proof
    body: >-
      The assigned October 2026 public pool supports the existence of significant funding and early
      enterprise traction, but not a clean underwriting dataset: funding totals conflict across
      sources, customer logos are unnamed, and no source discloses revenue or board composition.
    claimRefs: [CO009, CO010, CO011, CO012, CO013]
  - calloutType: insight
    title: Enterprise distribution appears real but externally mediated
    body: >-
      Product and hiring evidence consistently point toward regulated, high-value enterprise use
      cases, yet the strongest third-party commercialization clues run through AWS distribution,
      unnamed Fortune 100 customers, and the MUFG/Japan channel rather than through direct public
      proof of recurring financial performance.
    claimRefs: [CO003, CO006, CO013, CO014]
