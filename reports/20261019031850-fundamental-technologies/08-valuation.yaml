  evidenceGaps:
    - type: missing-source
      severity: material
      topic: valuation-proof
      missingEvidence: Public ARR or revenue run-rate, customer count, concentration, gross margin, and early renewal or expansion data.
      whyItMatters: These denominators are required to test whether the February 2026 $1.4 billion mark is stretched or defensible.
      diligencePath: Request management KPI pack covering ARR, deployment-to-recurring mix, top-customer exposure, and first cohort renewal timing.
      relatedQuestionRefs: [QV001, QV007]
      relatedTableRefs: [TV001, TV003]
    - type: private-evidence-only
      severity: material
      topic: round-economics
      missingEvidence: Liquidation preferences, secondary participation, option-pool reset, MUFG ticket size, and any structured or debt-like financing terms.
      whyItMatters: Investor economics can differ materially from the headline post-money valuation even when the round price is known.
      diligencePath: Obtain the financing documents or a board-approved cap table summary before underwriting entry value.
      relatedQuestionRefs: [QV001, QV007]
    - type: access-blocked
      severity: minor
      topic: public-disclosure-gap
      missingEvidence: A usable public finance or pricing explainer on the company site instead of the current broken page.
      whyItMatters: Weak public disclosure lowers confidence in outside valuation work and increases dependence on management-provided materials.
      diligencePath: Ask management for a current financing and pricing overview and confirm whether the website gap is temporary or intentional.
      relatedQuestionRefs: [QV008]
