    columns: [Lens, Thesis, Anti-thesis, What would change the view]
    rows:
      - [Product, NEXUS is presented as a differentiated large tabular model for deterministic enterprise prediction., Product claims remain largely company-authored and are not independently benchmarked in the assigned evidence set., Independent benchmark wins or third-party customer ROI studies.]
      - [Commercial traction, "Company-linked materials point to Fortune 100 use cases and seven-figure contracts.", "Public evidence still omits ARR, renewal behavior, customer count, and concentration.", "Disclosed ARR plus early renewal or expansion cohorts."]
      - [Distribution, "AWS and MUFG can widen enterprise access and category validation.", "AWS control of marketplace distribution and pricing may cap bargaining power while competitive pace stays high.", "Direct sales proof, diversified channels, and partner economics clarity."]
    notes: >-
      Each row pairs upside with the paired underwriting concern so the recommendation stays price-sensitive
      rather than narrative-only.
    claimRefs: [CV005, CV006, CV007, CV008, CV009, CV010, CV011]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Assumptions, Valuation / return logic, Key risk, Probability signal]
    rows:
      - [Bull, Fortune 100 pilots convert into repeat deployments and Japan plus AWS channels broaden distribution., Value can exceed the February 2026 round only after public revenue and retention evidence makes the current mark look like an early platform price., Customer concentration or benchmark slippage breaks the scaling story., Independent customer ROI disclosure plus renewal data.]
      - [Base, "Product stays interesting and strategically validated, but disclosure remains sparse through the next diligence cycle.", "Fair value is best treated as around the last priced round until operating proof fills in missing denominators.", "Time decay erodes returns if fundamentals do not catch up to the round price.", "More partnerships but still no ARR or cohort disclosure."]
      - [Bear, Commercialization lags while open-source and big-tech alternatives close the differentiation gap., Value falls below the last round if investors reprice to execution risk before proof of durable revenue quality., Down-round or structured terms could impair common-equity economics., Missing renewal proof combined with platform dependence and weak public disclosure.]
    notes: >-
      Ranges are directional relative to the last priced round because the assigned evidence set does not
      provide public ARR, margin, retention, or term-sheet detail needed for a precise multiple-based model.
    claimRefs: [CV001, CV006, CV007, CV008, CV009, CV010, CV011, CV012]
