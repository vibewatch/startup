        - from: But valuation proof is still missing
          to: Competition and platform dependence stay material
          label: while downside remains hard to size
        - from: Competition and platform dependence stay material
          to: Recommendation stays at track
          label: so the call remains wait-for-proof
    claimRefs: [CV001, CV003, CV005, CV006, CV007, CV009, CV012]
