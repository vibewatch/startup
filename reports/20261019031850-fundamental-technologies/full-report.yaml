        title: Identity and product thesis
        blocks:
          - type: paragraph
            body: >-
              The strongest current public identity signals are consistent on what Fundamental is trying to sell, even
              if they are lighter on corporate detail than on product rhetoric. Fundamental's own homepage and NEXUS
              page describe NEXUS as a Large Tabular Model for enterprise prediction and emphasize pre-training across
              billions of rows and columns rather than custom model building for each use case. The same official
              materials also frame deployment flexibility as part of the pitch, spanning managed SaaS, customer cloud,
              and private infrastructure, while a July 2026 third-party article adds that the Japan-market pitch centers
