      - number: '6.3'
        title: The underwritten risk is durability, concentration, and channel dependence
        blocks:
          - type: paragraph
            body: >-
              Public retention evidence is materially thinner than the launch narrative. Across the allowed source pool,
              no source discloses customer count, renewal rate, churn, GRR, NRR, contract length, or revenue share by
              top account, so the durability of the early enterprise pipeline cannot be tested in public. The assigned
              official finance URL also returned a 404 page rather than a finance customer case study. The same evidence
              that strengthens the go-to-market story creates concentration questions: Simplify's critical summary
              highlights dependence on AWS for distribution, pricing, and customer access, and it flags the risk that
              seven-figure contracts could leave revenue concentrated in a small number of buyers. Investor network and
              portfolio support may help open doors, but those are channel-enablement signals rather than proof of
              repeatable expansion or healthy renewals.
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
              - CU014
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Disclosure, regulatory, and legal unknowns still outrun the public record
        blocks:
          - type: paragraph
            body: >-
              Fundamental disclosed its financing, valuation, and early customer wins in one burst in February 2026, but
              the public packet available here is still thin for a company already priced at unicorn scale. The core
              legal and regulatory issue is not a confirmed lawsuit or enforcement action in the assigned evidence pool;
              it is that investors still need direct diligence on company-specific controls that matter in regulated
              deployments, including certifications, privacy and DPA posture, incident handling, and any sector-specific
              approvals or restrictions. AWS provides infrastructure-level compliance language and isolation detail, but
              that is not the same thing as proving Fundamental's own governance maturity. The other disclosure risk is
              technical substantiation: independent commentary still treats benchmark quality and architecture
              transparency as open diligence items rather than settled facts.
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR005
              - CR010
              - CR014
          - type: table
            tableRef: TR001
            claimRefs:
              - CR004
              - CR005
              - CR008
              - CR009
              - CR010
              - CR014
      - number: '7.2'
        title: Delivery risk is concentrated in AWS architecture and high-touch implementation
        blocks:
          - type: paragraph
            body: >-
              The strongest operational evidence in the pool points to a deployment model that is credible for large
              enterprises but operationally expensive to scale. AWS says NEXUS runs as a dedicated, single-tenant
              SageMaker endpoint on large GPU infrastructure, while Fundamental's own hiring signals show proof-of-value
              work, benchmarking, and last-mile integrations across VPC, on-prem, and air-gapped environments. That
              combination reduces some data-custody objections, but it also means go-live success depends on heavyweight
              infrastructure, customer-specific integration, and a forward-deployed organization that can translate
              model performance into production outcomes. The kill criterion is straightforward: if early deployments
              cannot move from benchmarking into repeatable production rollouts without bespoke services intensity,
              scaling margins and renewal quality will lag the valuation narrative.
            claimRefs:
              - CR003
              - CR004
              - CR006
              - CR007
              - CR013
          - type: table
            tableRef: TR002
            claimRefs:
              - CR003
              - CR006
              - CR007
              - CR010
              - CR013
      - number: '7.3'
        title: Counterparty, concentration, and underwriting risk remain the main investment threats
        blocks:
          - type: paragraph
            body: >-
              The investment case still relies on a small set of marquee signals: the $255 million financing, the AWS
              route to market, and management's claim of Fortune 100 seven-figure contracts. Those are meaningful
              positives, but they also concentrate downside. The public evidence does not name the customers, disclose
              renewal behavior, or quantify revenue, burn, gross margin, or working-capital needs. At the same time,
              independent sector coverage shows that tabular foundation models are a fast-moving field with both startup
              and big-tech entrants, while incumbent data platforms keep expanding natural-language and AI workflows
              inside existing enterprise stacks. The practical mitigation is to force the next diligence round to answer
              four questions before price support is assumed: named production references, first-renewal evidence,
              company-specific trust controls, and benchmark evidence that survives neutral scrutiny.
            claimRefs:
              - CR001
              - CR002
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
