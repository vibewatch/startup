              Marketplace and independent coverage both say NEXUS runs inside the customer's own environment, while the
              October 2026 forward-deployed data-scientist role shows implementations still require containerization,
              APIs, PySpark or Pandas data handling, and support for virtual private cloud, on-premises, and air-gapped
              environments. That implies a product that is architected for security-sensitive enterprises but still
