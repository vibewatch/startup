  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Priced round evidence is real, but still too thin for underwriting
        blocks:
          - type: paragraph
            body: >-
              Public valuation evidence remains strongest on the existence of a large, well-backed round, not on the
              operating proof required to justify paying into it. Crunchbase reports that Fundamental raised a $225
              million Series A at a $1.4 billion valuation in February 2026, and its methodology explicitly treats
              unicorn marks as post-money funding-round prices rather than internal 409A marks or later investor
              writedowns. Since then, AI Market Watch and Simplify both point to a MUFG-linked strategic investment and
              expanded commercial motion into Japan, which matters as signal that sophisticated partners still want
              exposure to the company after launch. The problem is that none of these sources provide the key
              denominators that would let an outside investor test whether the round is cheap, fair, or stretched: no
              public ARR, revenue growth, gross margin, customer count, retention curve, or contract renewal data are
              disclosed, and there is no public evidence on liquidation preferences, secondary participation, or
              option-pool resets. That leaves the latest priced round as a valid reference point, but not a sufficient
              intrinsic-valuation anchor.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV012
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV012
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV006
              - CV007
              - CV009
              - CV012
      - number: '8.2'
        title: The business is worth following, but the anti-thesis is still valuation-critical
        blocks:
          - type: paragraph
            body: >-
              The case for staying engaged is straightforward: management continues to position NEXUS as a
              differentiated large tabular model, the launch materials emphasize deterministic enterprise prediction use
              cases, and Simplify's company profile claims both Fortune 100 adoption and seven-figure contracts before
              the February 2026 launch. AI Market Watch also frames the MUFG investment and Japan entry as a
              sector-specific expansion into regulated and data-rich industries, which is directionally supportive for a
              category-defining outcome. The anti-thesis is just as important because it is what makes the
              recommendation price-sensitive rather than story-sensitive. Simplify's own critical summary warns that AWS
              controls marketplace distribution, pricing, and customer access, while the same page argues that a small
              number of seven-figure contracts can concentrate revenue risk. Independent category commentary is also not
              gentle: Mindful Modeler describes the tabular-foundation-model field as changing every couple of months or
              weeks, lists numerous startup and big-tech competitors, and ends by recommending TabICL v2 rather than
              Fundamental's product. In other words, the company may have genuine product potential, but public evidence
              still supports a watchlist posture more strongly than an immediate buy.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
      - number: '8.3'
        title: Confidence stays capped until disclosure quality improves
        blocks:
          - type: paragraph
            body: >-
              Confidence in the valuation call is constrained not only by missing financial data, but also by the
              quality of the public evidence surface itself. Fundamental's own /finance page currently resolves to a
              branded 404 page rather than a usable public financing explainer, and the company name is a generic
              English term with standalone Merriam-Webster and Cambridge dictionary entries, which helps explain why
              precise discovery required heavily qualified searches instead of company-name-only lookups. None of that
              disproves the business, but it does lower confidence that public materials alone are enough to price risk,
              dilution, or exit timing correctly. The next step that would move the rating is not a different narrative
              but better denominators: disclosed ARR or annualized deployment revenue, customer count and concentration,
              early renewal or expansion evidence, and round-terms clarity on preferences, secondaries, and any
              structured financing. Until those inputs exist, the practical stance is to track milestones, preserve
              access, and wait for evidence that converts technical promise into repeatable commercialization proof at a
              valuation that can be defended on more than momentum.
            claimRefs:
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Recommendation
            body: >-
              Track Fundamental rather than buying the story today: public evidence still supports strategic interest
              more clearly than it supports a defendable valuation entry.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV006
              - CV007
              - CV012
