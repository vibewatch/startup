        title: GTM appears consultative, which raises delivery-cost questions
        blocks:
          - type: paragraph
            body: >-
              The forward-deployed hiring evidence points to a field-heavy sales and deployment motion. Fundamental says
              customer work spans proof-of-value through post-implementation, includes benchmarking against incumbent
              baselines such as XGBoost and LightGBM, and often runs inside customer VPC, on-prem, or air-gapped
              environments. That is commercially credible for large regulated buyers, but it usually comes with
              materially higher presales and implementation cost than a self-serve software model. Public evidence
              therefore supports a thesis of high ACV and technically defensible deployments, while leaving CAC,
              sales-cycle length, payback, gross margin, and ongoing support burden undisclosed.
