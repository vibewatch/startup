  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Public product surfaces describe NEXUS as a Large Tabular Model built for prediction tasks over structured
              enterprise data, not for language generation, and position it as a reusable foundation model that can be
              applied across multiple datasets and business problems instead of rebuilding bespoke models use case by
              use case. The workflow emphasis is enterprise decision support: forecasting demand or revenue, flagging
              churn, scoring risk and fraud, underwriting credit, planning maintenance, setting prices, and optimizing
              supply chains. That is a credible customer-workflow framing for a forward-deployed enterprise ML product,
              but the measurable performance uplift remains mostly company-asserted in this pool rather than
              independently benchmarked, and the public evidence still does not show where adoption is deepest by
              vertical or workflow.
