      - number: '3.3'
        title: Durability is plausible, but external proof is still thin
        blocks:
          - type: paragraph
            body: >-
              The clearest differentiation in the assigned pool is not price leadership or broad platform breadth; it is
              a focused claim that tabular-native models can outperform legacy pipelines while preserving deterministic
              outputs and customer-controlled deployment. That may resonate in regulated or industrial settings,
              especially as Japan expansion points toward sectors with large proprietary structured datasets. Even so,
              the durability case is not externally closed. Public pricing remains unavailable from the assigned
              official surface, one launch URL preserved only a publisher profile rather than substantive reporting, and
              the retained sources do not provide independent head-to-head benchmark work against major incumbents. The
              result is a competitive story that is directionally strong but still under-documented for underwriting
              moat strength or long-run win rate.
