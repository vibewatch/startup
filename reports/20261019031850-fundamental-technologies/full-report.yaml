              - CR013
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Highest-confidence downside path
            body: >-
              The cleanest downside scenario is not a technical failure; it is a commercial scaling miss in which
              AWS-centric deployments and FDE-heavy implementation keep early deals bespoke, while public proof on
              renewals and concentration stays thin.
            calloutType: risk
            claimRefs:
              - CR002
              - CR003
              - CR006
              - CR013
          - type: callout
            title: Diligence gates before underwriting a higher price
            body: >-
              Require a trust and compliance packet, two named production references, first-renewal evidence, and a
              neutral benchmark pack before treating the current valuation as de-risked rather than sponsor-backed.
            calloutType: recommendation
            claimRefs:
              - CR002
              - CR005
