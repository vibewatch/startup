      - number: '4.4'
        title: Financial verdict
        blocks:
          - type: paragraph
            body: >-
              The available evidence is consistent with a promising, high-ticket enterprise AI company that may
              ultimately support attractive software economics, but the public package is still too thin to validate
              revenue quality or capital efficiency. Demand signals are real, yet they are filtered through
              company-controlled or lightly corroborated sources; the most important underwriting fields remain blank.
              The investment judgment for this chapter is therefore that revenue quality and margin path are plausible
              but unproven, and capital intensity may be meaningfully higher than the company’s software positioning
              implies until management discloses actual revenue mix, renewal behavior, gross margin, and cash runway.
