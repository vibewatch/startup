            body: >-
              Fundamental has clearly attracted substantial outside capital, and the refresh pool adds a new July 2026
              signal: MUFG Innovation Partners completed a strategic investment tied to Japan expansion. Even so, the
              amount of that investment is not disclosed in the retained evidence, and the company’s own public-facing
              hiring copy creates ambiguity around total capital raised. One retained source summarizes the disclosed
              funding history as $30 million of seed financing plus a $225 million Series A, while Simplify states the
              company has $275 million in funding. Without a disclosed MUFG check size, post-raise cash balance, burn
              rate, or planned use of funds, investors can see financing momentum but cannot underwrite runway or
