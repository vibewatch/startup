  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model visibility is directional, not underwritable
        blocks:
          - type: paragraph
            body: >-
              Fundamental clearly positions NEXUS as enterprise prediction software for structured data rather than a
              consumer or pure-services offering, and multiple retained sources tie the product to financial
              forecasting, risk analysis, and other operational use cases. The public problem is not absence of
              commercial intent; it is absence of monetization detail. The company and third-party coverage describe
              enterprise adoption and seven-figure contracts, but none of the retained sources disclose list pricing,
              contract duration, consumption units, discounting, or the split between recurring software revenue and
              implementation-heavy services. That means the market can see demand signals, yet still cannot tell whether
              current contracts are repeatable software subscriptions, high-touch project revenue, or a blended model.
