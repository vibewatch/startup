  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and the real job to be done
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence points to a practical buying decision between keeping prediction work inside
              existing data-science workflows and adopting a new tabular-native model. Fundamental and third-party
              coverage both frame NEXUS as a Large Tabular Model aimed at structured enterprise records, with deployment
              designed for regulated or operational settings rather than consumer-style prompt usage. That makes the
              first competitor set the status quo: internal teams already using XGBoost, LightGBM, and bespoke
              feature-engineering pipelines. It also means the broader field includes enterprise platforms that already
              sit on top of data, workflow, and governance budgets, because those vendors can absorb tabular prediction
              as one capability inside a wider platform instead of asking the buyer to approve a new category.
            claimRefs:
