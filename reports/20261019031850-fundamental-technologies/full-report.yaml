      - number: '3.2'
        title: Distribution, switching cost, and incumbent pressure
        blocks:
          - type: paragraph
            body: >-
              Fundamental has a credible route to market, but the same evidence also shows why incumbents remain
              dangerous. The company benefits from AWS distribution and claims early Fortune 100 traction, yet that
              channel also gives AWS leverage over how customers discover and transact for the product. Against that,
              Databricks represents a scaled platform incumbent with multi-cloud reach, usage pricing, and explicit
              switching costs once customers consolidate pipelines, models, and governance in one stack. Palantir
              matters as a different kind of incumbent: less a tabular-model specialist than a large-budget enterprise
              AI vendor with the scale and credibility to compete for the same executive decisioning projects.
              Fundamental therefore faces platform bundling pressure from both cloud-aligned and application-layer
              incumbents, not just point-model rivals.
