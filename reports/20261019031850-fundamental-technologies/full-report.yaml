        title: Funding, scale, and milestone signals
        blocks:
          - type: paragraph
            body: >-
              External scale signals are directionally strong but numerically messy. AI Market Watch says Fundamental
              received a strategic investment from MUFG Innovation Partners and entered Japan in July 2026, while also
              describing a prior $225 million Series A from Battery Ventures and Salesforce Ventures. Simplify, however,
