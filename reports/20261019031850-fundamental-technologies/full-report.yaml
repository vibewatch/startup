  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Strategic validation keeps Fundamental investable to watch, but missing underwriting denominators keep the call at
      track.
    data:
      nodes:
        - label: Product differentiation is plausible
          detail: Company materials describe NEXUS as a tabular-native model for deterministic enterprise prediction.
          tone: positive
        - label: Early commercial proof exists
          detail: Public materials cite Fortune 100 use cases and seven-figure contracts before launch.
          tone: positive
        - label: Strategic channels add signal
          detail: The February 2026 unicorn round and later MUFG-linked investment suggest continuing partner interest.
          tone: positive
        - label: But valuation proof is still missing
          detail: Public evidence omits ARR, retention, margins, customer count, and preference-stack terms.
          tone: warning
        - label: Competition and platform dependence stay material
          detail: AWS channel control and a fast-moving tabular-model field can compress upside before proof matures.
          tone: warning
        - label: Recommendation stays at track
          detail: Keep access and diligence active, but wait for financial disclosure before underwriting an entry.
          tone: negative
      edges:
        - from: Product differentiation is plausible
          to: Early commercial proof exists
          label: if product story is turning into deployments
        - from: Early commercial proof exists
          to: Strategic channels add signal
          label: and strategic partners keep validating distribution
        - from: Strategic channels add signal
          to: But valuation proof is still missing
          label: yet priced-round evidence still outruns disclosed fundamentals
        - from: But valuation proof is still missing
          to: Competition and platform dependence stay material
          label: while downside remains hard to size
        - from: Competition and platform dependence stay material
          to: Recommendation stays at track
          label: so the call remains wait-for-proof
