  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitute set
        blocks:
          - type: paragraph
            body: >-
              The public record defines Fundamental's market less as generic AI software and more as prediction from
              structured enterprise data. TechCrunch frames the company around an old problem—extracting value from very
              large enterprise tables—while Fundamental's own launch materials repeatedly argue that the most valuable
              business decisions live in rows and columns rather than text or image workflows. That boundary matters
              because it narrows the real comparison set. The company is not asking buyers to swap one chatbot for
              another; it is trying to replace legacy predictive-analytics workflows and win budget that might otherwise
              stay inside incumbent data platforms, bespoke data-science teams, or internal ML stacks. Sacra's
              Databricks research is useful here not as a direct Fundamental comparable, but as proof that large
              governed-data platforms already aggregate adjacent analytics, ML, and AI-agent budgets and therefore
              represent both substitute spend and a high bar for distribution and switching costs.
            claimRefs:
              - CM001
              - CM007
              - CM010
              - CM011
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM007
              - CM010
      - number: '2.2'
        title: Buyer motion and deployment path
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence points to a classic enterprise adoption motion rather than self-serve usage.
              Fundamental and AWS emphasize seven-figure Fortune 100 contracts and AWS-native availability, while the
              Houston forward-deployed data-scientist role spells out the work required to get from proof-of-value to
              secure production deployment. The user is not a single persona: business teams own the forecasting or risk
              workflow, but IT, data-science, and security stakeholders all appear in the approval path. That is
              strategically attractive because successful deployments can expand into multiple predictive use cases, yet
              it also narrows the short-term serviceable market to organizations with enough data maturity to support
              VPC, on-prem, or air-gapped implementations and to compare NEXUS against strong internal baselines such as
              XGBoost or LightGBM.
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM009
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM012
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM005
              - CM010
              - CM011
              - CM013
      - number: '2.3'
        title: Sizing lenses, drivers, and remaining diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The strongest adoption driver in the public evidence is operational leverage: Fundamental claims one model
              can handle many predictive use cases that previously required custom feature engineering, while
              independent practitioner commentary confirms that data preparation and multi-table integration remain the
              real bottleneck in tabular AI. That combination makes the opportunity believable, but not fully
              measurable. The assigned pool contains broad category rhetoric, adjacent platform economics, and early
              customer signals, yet no direct public TAM/SAM/SOM for large-tabular-model spend, no disclosed customer
              count, and no price sheet or renewal data that could anchor a bottom-up SOM. For valuation work, that
              means the market story is directionally compelling but still insufficient to validate how much budget
              Fundamental can capture, how quickly it can expand within accounts, or whether the current wedge is large
              enough to justify a scaled software multiple.
            claimRefs:
              - CM002
              - CM008
              - CM009
              - CM011
              - CM013
          - type: table
            tableRef: TM002
            claimRefs:
              - CM010
              - CM011
              - CM013
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The near-term market is narrower than the headline narrative
            body: >-
              The best-supported wedge is not all enterprise AI; it is large-enterprise structured-data prediction where
              secure deployment, deterministic outputs, and measurable ROI justify a heavyweight sales and
              implementation motion.
            calloutType: insight
            claimRefs:
              - CM001
              - CM005
              - CM009
              - CM012
