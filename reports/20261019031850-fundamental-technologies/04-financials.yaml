      - ["Proof-of-value / implementation work", "Benchmarking, integration, and deployment support around customer environments", "Project / milestone", "Clearly part of GTM motion; revenue recognition not disclosed", "May accelerate wins but can dilute gross margin", "Disclose implementation fee structure and services attach rate"]
      - ["AWS-linked distribution", "AWS dashboard / SageMaker route alongside direct enterprise sales", "Channel-mediated contract", "Route disclosed; economics undisclosed", "Expands reach but may compress pricing power or data ownership", "Disclose marketplace fees, channel rev-share, and lead ownership"]
    notes: "Rows separate visible monetization routes from undisclosed economics; public sources do not quantify contract value, term, or revenue recognition."
    claimRefs: [CI001, CI002, CI004, CI005]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Pricing element
      - Public value / status
      - What the evidence actually shows
      - Implication
      - Source status
    rows:
      - ["List price", null, "No retained source provides public list pricing", "Cannot benchmark ACV against peers or infer self-serve potential", "Unavailable"]
      - ["Realized contract size", "Seven-figure contracts claimed", "Simplify states Fundamental signed seven-figure Fortune 100 contracts before launch", "Suggests high ACV potential, but not frequency or renewal quality", "Company-claimed"]
      - ["Contract term / usage basis", null, "No monthly, annual, seat-, row-, or usage-based contract terms are disclosed", "Revenue durability and expansion logic remain unknown", "Unavailable"]
      - ["Channel economics", null, "AWS route is public, but marketplace fees and ownership economics are not", "Channel leverage could trade off against margin and customer control", "Partially visible"]
    notes: "Null means the field is not publicly disclosed in retained evidence, not that the commercial term does not exist."
    claimRefs: [CI002, CI005, CI006, CI013]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value / proxy
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - ["CAC / sales efficiency", null, "Low", "Enterprise field deployment implies meaningful presales cost, but no CAC or payback is disclosed", "Provide CAC, sales-cycle length, and payback by segment"]
      - ["Gross margin", null, "Low", "Secure customer-specific deployment can support defensibility while still masking costly implementation work", "Disclose software gross margin and services gross margin separately"]
      - ["Implementation intensity", "High-touch proxy", "Medium", "Proof-of-value, benchmarking, and VPC/on-prem deployment imply nontrivial delivery effort", "Quantify average implementation time and staffing per account"]
      - ["Revenue concentration risk", "Potentially high", "Low", "Seven-figure contracts and limited disclosed logos imply few customers may drive early revenue", "Disclose customer count, largest-customer share, and renewal timing"]
      - ["Cash runway", null, "Low", "Fresh capital is visible, but cash balance, burn, and debt obligations are not", "Provide cash on hand, monthly burn, and next financing trigger"]
    notes: "This table distinguishes public proxies from unavailable private metrics; null values mark missing disclosure, not zero."
    claimRefs: [CI003, CI004, CI006, CI009, CI013, CI014, CI015]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: Public evidence implies a consultative enterprise revenue engine whose gross-profit quality depends on how much work sits around each deployment.
    data:
      nodes:
        - id: datasets
          label: Enterprise datasets
          detail: Customer tables from ERP, CRM, risk, and operational systems are the starting input.
          tone: neutral
        - id: pov
          label: Proof of value
          detail: Forward-deployed teams benchmark against customer baselines before broader rollout.
          tone: opportunity
        - id: secure-deploy
          label: Secure deployment
          detail: NEXUS is described as running in customer VPC, on-prem, or air-gapped environments.
          tone: neutral
        - id: predictions
          label: Production predictions
          detail: Forecasting, classification, anomaly detection, and scenario simulation become the measurable output.
          tone: opportunity
        - id: contract
          label: Enterprise contract
          detail: Revenue likely comes from direct enterprise agreements plus an AWS-linked route, but terms are undisclosed.
          tone: neutral
        - id: gross-profit
          label: Gross-profit quality
          detail: Margin quality depends on how much implementation, support, and channel cost surrounds each account.
          tone: warning
      edges:
        - from: datasets
          to: pov
          label: Baseline comparison and ROI framing
        - from: pov
          to: secure-deploy
          label: Security, integration, and stakeholder buy-in
        - from: secure-deploy
          to: predictions
          label: Model outputs in the customer environment
        - from: predictions
          to: contract
          label: Commercial value tied to prediction improvement
        - from: contract
          to: gross-profit
          label: Margin depends on services load and channel take-rate
    approximationNotes: "Flow shows the revenue mechanism implied by retained public evidence; it does not assert undisclosed pricing, revenue recognition, or realized margin."
    claimRefs: [CI001, CI002, CI003, CI004, CI005]
