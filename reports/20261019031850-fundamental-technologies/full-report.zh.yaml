      - number: '4.3'
        title: 新资金可见，但资金充足性仍不透明
        blocks:
          - type: paragraph
            body: >-
              Fundamental 显然吸引了大量外部资本，本次更新还增加了 2026 年 7 月的新信号：MUFG Innovation Partners 完成了
              一项与日本扩张相关的战略投资。即便如此，保留证据没有披露这笔投资金额，公司对外招聘文案还造成总融资额歧义。一份 保留来源将已披露融资历史概括为 $30 million 种子轮加 $225 million A
              轮，而 Simplify 表示公司融资额为 $275 million。 在没有披露 MUFG 支票规模、融资后现金余额、消耗率或资金用途前，投资人能看到融资势头，却无法判断 runway 或下一轮时点。
