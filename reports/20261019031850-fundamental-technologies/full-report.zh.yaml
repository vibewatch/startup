              页面，而不是可用的公开融资说明；公司名又是一个普通英文词，在 Merriam-Webster 和 Cambridge 词典中都有独立
              词条，这也解释了为什么精确检索需要大量限定条件，而不是只搜公司名。这些情况都不能证伪业务，但会降低“仅凭公开材料就足以
