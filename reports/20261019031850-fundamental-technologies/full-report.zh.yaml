      - number: '3.3'
        title: 持久性有可能成立，但外部证明仍薄弱
        blocks:
          - type: paragraph
            body: >-
              指定资料池中最清晰的差异化并非价格领先或平台广度，而是一个聚焦主张：表格原生模型可以超过传统流程，同时在 受监管工作流中保留确定性输出和客户控制的部署。对于受监管或工业场景，这一主张可能有共鸣，尤其是日本扩张指向
              拥有大型专有结构化数据集的行业。即便如此，持久性逻辑仍未被外部证据闭环。指定官方页面没有公开定价，一个发布 URL
              只保留了出版方简介而非实质报道，保留的来源也没有针对主要在位者的独立正面基准测试。因此，竞争故事方向上很强， 但还没有足够文档支撑对护城河强度或长期胜率做投资判断。
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
