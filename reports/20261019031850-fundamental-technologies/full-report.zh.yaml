    sections:
      - number: '4.1'
        title: 收入模型可见方向，但不足以做投资判断
        blocks:
          - type: paragraph
            body: >-
              Fundamental 明确把 NEXUS 定位为面向结构化数据的企业预测软件，而不是消费者产品或纯服务，并且多份保留来源都把
              产品与财务预测、风险分析和其他运营用例联系起来。公开问题不是没有商业意图，而是没有变现细节。公司和第三方报道
              都描述了企业采用及百万美元级合同，但没有保留来源披露标价、合同期限、消费单位、折扣，或经常性软件收入与重实施服务
              收入的拆分。因此，市场能看到需求信号，却无法判断当前合同是可复用的软件订阅、重服务项目收入，还是混合模式。
