        title: 领导层、治理与披露面
        blocks:
          - type: paragraph
            body: >-
              分配到本次 2026 年 10 月资料池的具名领导层证据很薄。最清晰的公开归属是 Jeremy Fraenkel：发布材料称其为 CEO 兼联合创始人，并由他代表公司公开阐述“企业预测是下一个 AI
              前沿”。除此之外，资料池明显更弱：保留的 Google Scholar 页面证明 Marta Garnelo 有可见的机器学习研究记录，但当前资料池没有独立重新核实她在 Fundamental
              的现任职务。对于一家融资规模异常大的公司，公开披露面也不完整。指定的 /finance URL 访问时返回 404
              页面；同一批描述公司情况的来源也没有披露董事会构成、当前高管名单或清晰的投资者关系式摘要，进一步加重了 对 CEO 叙事的关键人物依赖。
