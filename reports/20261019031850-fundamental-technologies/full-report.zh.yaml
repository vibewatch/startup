              页面强调，模型在数十亿行和列的数据上预训练，而不是为每个用例单独定制模型。官方材料还把 部署灵活性作为卖点，覆盖托管 SaaS、客户云和私有基础设施；2026 年 7 月的一篇第三方文章补充称，日本市场
              的卖点集中在客户 VPC 内部署，并结合机密计算。第三方商业元数据则列出旧金山总部、A 轮状态和 2024 年成立时间， 但与产品主张相比，这些描述得到的交叉验证较少。
