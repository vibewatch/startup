            body: >-
              现有证据与一家有潜力、客单价高的企业 AI 公司相符，未来可能支撑有吸引力的软件经济性，但公开材料仍太薄，无法验证
              收入质量或资本效率。需求信号真实存在，但经过公司控制或交叉验证有限的来源过滤；最重要的投资判断字段仍为空。因此，
              本章结论是收入质量和利润率路径看起来可行但尚未证明，且在管理层披露真实收入结构、续约表现、毛利率和现金 runway 前， 资本强度可能明显高于软件定位所暗示的水平。
