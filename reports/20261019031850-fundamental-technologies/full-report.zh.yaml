              强采用和百万美元级合同。AI Market Watch 也将 MUFG 投资与进入日本 描述为面向受监管、数据丰富行业的垂直扩张，这对成为品类定义者是方向性支持。反论同样重要，因为它让建议对价格敏感，而不是
              只对故事敏感。Simplify 的批判性摘要警告 AWS 控制市场分销、定价和客户接入；同一页面还认为少数百万美元级合同可能集中收入风险。 独立品类评论也并不温和：Mindful Modeler
              称表格基础模型领域每隔几个月甚至几周就会变化，列举了许多创业公司和大科技竞争者， 最终推荐 TabICL v2 而不是 Fundamental
              的产品。换句话说，公司可能确有产品潜力，但公开证据更支持列入观察名单，而不是立即买入。
