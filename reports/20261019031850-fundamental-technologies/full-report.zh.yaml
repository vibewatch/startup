              - CM011
              - CM013
      - number: '2.3'
        title: 市场规模视角、驱动因素与剩余尽调缺口
        blocks:
          - type: paragraph
            body: >-
              公开证据中最强的采用驱动因素是运营杠杆：Fundamental 声称一个模型可以覆盖过去需要定制特征工程的多个预测用例， 而独立从业者评论也确认，数据准备和多表整合仍是表格型 AI
              的真正瓶颈。这一组合让机会看起来可信，但还不能完整量化。 指定资料池包含宽泛的品类叙事、相邻平台经济数据和早期客户信号，却没有大型表格模型支出的直接 TAM/SAM/SOM、
              已披露客户数、价格表或续约数据，无法支撑自下而上的 SOM。对估值工作而言，市场故事方向上有吸引力，但仍不足以验证 Fundamental
              能拿到多少预算、能多快在客户内扩张，或当前切入口是否足以支撑规模化软件倍数。
            claimRefs:
              - CM002
              - CM008
              - CM009
              - CM011
              - CM013
          - type: table
            tableRef: TM002
            claimRefs:
              - CM010
              - CM011
              - CM013
      - number: '2.4'
        title: 展示项
        blocks:
          - type: callout
            title: 近期市场比 headline 叙事更窄
            body: 证据最充分的切入口不是所有企业 AI，而是大型企业的结构化数据预测：安全部署、确定性输出和可量化 ROI 足以支撑 重销售、重实施的进入路径。
            calloutType: insight
            claimRefs:
              - CM001
              - CM005
              - CM009
              - CM012
          - type: callout
            title: 估值工作仍受市场规模尽调阻塞
            body: 指定公开证据支持品类逻辑，却没有直接 TAM/SAM/SOM，也缺少价格、客户数和续约数据，投资人无法把叙事转化为 市占率获取的计算。
            calloutType: risk
            claimRefs:
              - CM011
              - CM013
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局与真正待完成的工作
        blocks:
          - type: paragraph
            body: >-
              指定证据指向一个实际购买决策：继续把预测工作留在现有数据科学流程中，还是采用新的表格原生模型。Fundamental 和第三方报道都把 NEXUS 定位为面向结构化企业记录的 Large Tabular
              Model，部署目标是受监管或运营环境，而非 面向消费者的提示词使用。因此，第一组竞争者就是现状：已经使用 XGBoost、LightGBM 和定制特征工程流程的内部团队。
              更广义的竞争场还包括已经占据数据、工作流和治理预算的企业平台，因为这些厂商可以把表格预测作为更宽平台中的一项 能力吸收掉，而不要求买家批准一个全新品类。
