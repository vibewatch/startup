  - id: TV002
    title: 正方 / 反方论点表
    columns:
      - 视角
      - 正方论点
      - 反方论点
      - 哪些信息会改变判断
    rows:
      - - 产品
        - NEXUS 被定位为差异化的大型表格模型，用于确定性企业预测。
        - 产品主张大多来自公司自身，指定证据集中没有独立基准测试。
        - 独立基准测试获胜，或第三方客户 ROI 研究。
      - - 商业进展
        - 与公司相关的材料指向 Fortune 100 用例和七位数合同。
        - 公开证据仍未披露 ARR、续约表现、客户数量和集中度。
        - 披露 ARR，以及早期续约或扩张客户群。
      - - 分销
        - AWS 和 MUFG 可以扩大企业触达并验证品类。
        - AWS 对 Marketplace 分销和定价的控制可能压低议价能力，而竞争节奏仍在加快。
        - 直销验证、多元化渠道和清晰的合作伙伴经济性。
    notes: 每一行都将上行空间与对应的投资判断担忧并列，使建议对价格保持敏感，而不是只看叙事。
