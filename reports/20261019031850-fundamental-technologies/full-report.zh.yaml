      - number: '1.3'
        title: 融资、规模与里程碑信号
        blocks:
          - type: paragraph
            body: >-
              外部规模信号方向上很强，但数字并不整齐。AI Market Watch 称 Fundamental 获得 MUFG Innovation Partners 的 战略投资，并于 2026 年 7
              月进入日本市场；该来源还描述了此前由 Battery Ventures 和 Salesforce Ventures 参与的 $225 million A 轮。可是 Simplify 在一个元数据模块中把总融资列为
              $255 million，在职位描述正文又写成 "$275m in funding"，因此公开融资总额仍存在未解决的冲突。同一页面还声称公司已获得《财富》100 强客户、覆盖多个行业，
              但报告的员工增长有限，并依赖 AWS 分销进入市场；它没有点名客户、披露收入，也没有量化客户集中度，只是警告
              百万美元级合同可能让增长暴露于少数买家。独立行业评论还表明，表格基础模型领域变化很快，不能仅凭品类定位就假定 Fundamental 已经取得产品领导地位。
