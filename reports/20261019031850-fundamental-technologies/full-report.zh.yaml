            title: 除公司控制证据外，护城河持久性仍未得到充分证明
            body: AWS 渠道依赖、价格不透明和独立基准测试稀薄，为 Databricks、Palantir 和云厂商在公开证明赶上之前捆绑或扩大分销 留出了空间。
            calloutType: risk
            claimRefs:
