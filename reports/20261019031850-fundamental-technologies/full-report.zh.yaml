      - CV005
      - CV006
      - CV007
      - CV008
      - CV009
      - CV010
      - CV011
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - Fortune 100 试点转化为重复部署，日本和 AWS 渠道拓宽分销。
        - 只有在公开收入和留存证据让当前估值看起来像早期平台价格之后，价值才可能超过 2026 年 2 月那一轮融资。
        - 客户集中度或基准测试表现下滑会打破规模化故事。
        - 独立客户 ROI 披露及续约数据。
      - - 基准
        - 产品仍有吸引力，也得到战略层面验证，但在下一轮尽调周期内披露仍然稀疏。
        - 在运营证据补足缺失分母前，公允价值最好按上一轮定价融资附近处理。
        - 如果基本面赶不上本轮价格，时间损耗会侵蚀回报。
        - 合作伙伴更多，但仍没有 ARR 或客户群披露。
      - - 悲观
        - 商业化落后，而开源方案和大科技公司替代品缩小差异化差距。
        - 如果投资人在持久收入质量得到证明前按执行风险重新定价，价值会跌破上一轮融资。
        - 下轮降价融资或结构化条款可能损害普通股经济权益。
        - 缺少续约验证，同时平台依赖度高、公开披露薄弱。
    notes: 这些区间相对于上一轮定价融资仅作方向性判断，因为指定证据集没有提供建立精确倍数模型所需的公开 ARR、利润率、留存或条款清单细节。
    claimRefs:
      - CV001
