  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 定价轮证据真实存在，但仍不足以做投资判断
        blocks:
          - type: paragraph
            body: >-
              公开估值证据最能证明的是一轮规模大、支持者强的融资存在，而不是足以支撑继续买入的经营证明。Crunchbase 报告称， Fundamental 在 2026 年 2 月以 $1.4 billion 估值完成
              $225 million A 轮；其方法论明确将独角兽估值视为融资轮的投后价格， 而非内部 409A 估值或后续投资人减记。此后，AI Market Watch 和 Simplify 都指向一项 MUFG
              关联战略投资及进入日本的商业扩张， 这说明成熟合作伙伴在公司发布后仍希望获得其敞口。但这些来源都没有提供外部投资人判断这轮融资便宜、公允还是偏贵所需的关键 分母：没有公开
              ARR、收入增速、毛利率、客户数、留存曲线或合同续约数据，也没有清算优先权、二级参与或期权池重置的公开证据。 因此，最近一轮定价融资可以作为有效参考点，却不足以作为内在估值锚。
