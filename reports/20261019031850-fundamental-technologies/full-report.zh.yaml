        title: 展示项
        blocks:
          - type: callout
            title: Fundamental 攻击的是真实在位者流程，而非虚构品类
            body: 最有证据支持的角度是：NEXUS 替代的是定制表格 ML 工作和传统验证流程，而不是再添加一个聊天机器人界面。
            calloutType: strength
            claimRefs:
              - CP001
