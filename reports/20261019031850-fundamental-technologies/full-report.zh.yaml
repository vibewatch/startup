  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              公开记录界定 Fundamental 的市场时，重点不是泛化 AI 软件，而是基于结构化企业数据做预测。TechCrunch 将公司 放在一个老问题上：如何从超大型企业表格中提取价值；Fundamental
              自己的发布材料也反复强调，最有价值的商业决策 存在于行列中，而不是文本或图像工作流。这个边界很重要，因为它缩小了真正的比较集合。公司不是要求买家把一个
              聊天机器人换成另一个，而是试图替代传统预测分析流程，争取原本可能留在现有数据平台、定制数据科学团队或内部 ML 技术栈中的预算。Sacra 对 Databricks 的研究在这里并不是 Fundamental
              的直接可比对象，但它证明大型治理型 数据平台已经聚合了相邻的分析、ML 和 AI agent 预算，因此既是替代性支出来源，也是分销能力和切换成本的高门槛。
            claimRefs:
              - CM001
              - CM007
              - CM010
              - CM011
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM007
              - CM010
      - number: '2.2'
        title: 买方路径与部署方式
        blocks:
          - type: paragraph
            body: >-
              指定证据指向典型的企业采用路径，而非自助式使用。Fundamental 和 AWS 强调百万美元级《财富》100 强合同以及 AWS
              原生可用性；休斯顿的前线部署数据科学家职位则写明了从价值验证到安全生产部署所需的工作。用户并非单一角色： 业务团队负责预测或风险工作流，但
              IT、数据科学和安全利益相关者都会参与审批。成功部署后可以扩展到多个预测用例， 这在战略上很有吸引力；但短期可服务市场也因此更窄，只包括数据成熟度足以支持 VPC、本地或隔离部署，并能将 NEXUS 与
              XGBoost 或 LightGBM 等强内部基线比较的组织。
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM009
              - CM012
