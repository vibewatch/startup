              客户数和集中度、早期续约或扩张证据，以及关于优先权、二级交易和结构化融资的轮次条款。相关输入出现前，实际策略是跟踪里程碑、 保留接触机会，等待技术承诺转化为可重复商业化证明，并且估值能以动能以外的依据来辩护。
