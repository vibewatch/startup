      - number: '3.2'
        title: 分销、切换成本与在位者压力
        blocks:
          - type: paragraph
            body: >-
              Fundamental 有可信的市场路径，但同一批证据也说明在位者为何危险。公司受益于 AWS 分销，并声称已取得早期《财富》 100 强客户；但这一渠道也让 AWS
              能够影响客户如何发现并购买产品。相比之下，Databricks 是规模化平台在位者，拥有 多云覆盖、按使用量定价，以及客户把流程、模型和治理集中到一个技术栈后产生的明确切换成本。Palantir
              则是另一类在位者： 它不是表格模型专家，却拥有足以争夺同类高管决策项目的规模和可信度。Fundamental 面临的因此是云平台和应用层在位者 的平台捆绑压力，而不只是点模型竞争者。
            claimRefs:
              - CP004
              - CP005
              - CP007
              - CP008
              - CP009
              - CP010
