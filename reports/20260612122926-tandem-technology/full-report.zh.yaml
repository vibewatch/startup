      - number: '2.4'
        title: 增长驱动、约束与监管动态
        blocks:
          - type: paragraph
            body: >
              事先授权自动化市场正在快速扩张，但也存在真实的结构性约束，限制采用速度和市场定义的确定性。


              主要增长驱动——处方药量和专科复杂度。美国处方药支出预计在 2026 年超过 $1 trillion（ASHP），此前 2025 年增长 12.7%。每一个新的专科药批准都会创造新的 PA 工作流；自 2012
              年以来，FDA 批准专科药的速度加快，并且专科药在每年 FDA 批准中占比都超过一半。基因疗法管线（单剂往往 $2+ million）和精准肿瘤药持续扩大高价值、高 PA 摩擦处方集合，Forus
              可以自动化的对象也随之增加。


              监管驱动——CMS 互操作性要求。CMS-0057-F（2024 年 1 月最终确定）要求付款方到 2027 年 1 月为 Medicare Advantage、Medicaid 和 CHIP 支持电子 PA
              API。2026 年 CMS 拟议规则 CMS-0062-P 会把这些要求专门扩展到药品。电子 PA API 降低 Forus 连接付款方的技术摩擦，扩大可触达网络。不过，监管方向也鼓励健康计划 IT 把 PA
              自动化作为自有能力来投资，中期可能降低其对 Forus 这类第三方工具的依赖。


              监管驱动——Medicare Advantage PA 压力。AMA 引用 HHS/OIG 数据称，2022 年 Medicare Advantage 拒绝的 PA 请求中，有 13% 在传统 Medicare
              下本应获批。Improving Seniors' Timely Access to Care Act（H.R. 3514/S. 1816）截至 AMA 2026 年 2 月行动包已有 254 名众议院共同提案人和
              66 名参议院共同提案人，目标是在 Medicare Advantage 中扩大电子 PA。若该法案通过，将使电子 PA 常态化，并扩大 Forus 所处市场。


              监管约束——AI 监督和错误拒付风险。多个州已经颁布或提出法律，要求对 AI 驱动的覆盖决策进行人工监督。Forus 提交 PA 请求，而不做覆盖决策；但更广泛的 AI-in-PA
              监管氛围会带来声誉风险和合规复杂度。Biopharma 合作伙伴在签署涉及患者准入工作流的商业协议时，可能会仔细审查 AI 治理要求。ICER 2025 Launch Price and Access
              Report 还记录了与使用管理（包括 PA）相关的准入不平等正受到越来越多政策审视。


              市场约束——电子 PA 采用滞后。尽管行业努力了十年，事先授权在 2024 年仍只有 40% 电子化（CAQH 2025 Index），高于 2022 年的 31%。60%
              市场仍停留在人工工作流，反映出深层互操作性障碍：付款方系统异质、EHR 碎片化、专科药覆盖复杂，以及 Change Healthcare 2024 年 2 月网络攻击（影响 193 million
              人）把许多服务方推回人工流程。这些障碍既是 Forus 的采用机会，也是快速市场渗透的结构性逆风。


              市场约束——Medicaid 药价改革。HHS 和 CMS 在 2026 年宣布 GENEROUS Medicaid Model，把最惠国药品定价引入 Medicaid。Medicaid 处方药支出在 2024
              年超过 $100 billion（总额）和 $60 billion（扣除返利后）。如果制造商在 Medicaid 市场的收入被压缩，biopharma 用于 hub
              项目和患者准入基础设施的商业预算可能被削减。当前来源无法量化其对 biopharma 商业支出的长期影响。


              市场约束——既有基础设施。由 CVS Specialty、Accredo/Cigna 等主导的专科药房渠道，以及既有 biopharma hub
              供应商，已拥有合同关系、处方集位置和数据权利，形成切换成本。Forus 要扩大 biopharma 商业合作，必须绕开、补充或替代这些关系。Drug Channels Institute 2026
              报告凸显了当前渠道中专科药房和 PBM 经济性的复杂度和市场力量。


              尽调缺口。Biopharma 在患者准入和 hub 基础设施上的商业支出，才是与 Forus 定价最直接相关的市场，但公开层面没有聚合披露。hub 市场历史上曾被估计为 $3–6
              billion，但在已审阅来源中没有找到权威的 2025–2026 年数字。PA 摩擦降低与增量首填收入之间的转化率，是 Forus 面向 biopharma
              的核心价值主张，但尚未公开验证。投资人需要独立验证这一转化率，才能承销规模化 biopharma 收入模式。
