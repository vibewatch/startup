      - number: '3.2'
        title: 竞品画像与能力对比
        blocks:
          - type: paragraph
            body: >
              Humata Health 将其 PAthway 平台定位为「行业最全面的事先授权解决方案」，目标客户是医疗系统收入周期、患者准入和授权管理负责人。其技术栈包括 AI
              驱动的政策匹配（PolicyLink）、自动化临床材料打包、智能证明回答、自动状态跟踪、授权后监控，以及通过 Power BI 提供的分析。已发布的效果宣称包括 96% 首次提交批准率、临床材料打包效率提升
              80%、授权触点减少 45%、改期减少 83%。平台通过原生 EHR 集成连接 250+ 个付款方。Humata 持有 HITRUST CSF v9.5.0 r2 认证，并每年接受 SOC 2 Type II
              审计；这样的安全姿态为医疗系统采购 PA 供应商设定了企业合规基线。Texas Health Resources（收入约 $6 billion，29 家医院）在 2025 年 7 月部署
              Humata，覆盖诊断影像、心血管服务和介入放射，实现范围内工作量 100% 自动化覆盖。UHealth 骨科部署把 68% 需要 PA 的骨科授权转为自动化处理。Humata
              定价未公开披露；它通过企业医疗系统销售合同竞争。关键在于，Humata 由服务方付费，不采用 biopharma 资助、面向服务方免费的模式。


              Infinitus Systems 用语音 AI 智能体自动化付款方电话，处理 PA 状态、福利核验、登记跟进和续方协调。其智能体捕捉肿瘤学、免疫学、风湿病学、神经病学、心脏病学及其他疾病领域的 PA
              要求和更新。Infinitus 已完成 8 million+ 次电话，支持 125,000+ 名服务方，自动化超过 100 million 分钟医疗对话，并声称 Fortune 50 公司中 44%
              已采用。公司由 Andreessen Horowitz 支持，披露估值超过 $600 million。Infinitus 针对 PA
              工作流的提交后阶段；它不在处方开出点集成，不管理处方集路由，也不为患者登记费用援助项目。其无代码 Studio 工具允许医疗团队在合规护栏下构建和部署语音 AI
              智能体。在付款方电话仍不可避免的场景中，Infinitus 模式与电子 PA 平台互补。


              CoverMyMeds（McKesson 全资拥有）主导电子 PA 路由基础设施：其网络声称占美国电子 PA 交易量约 90%，连接美国 94% 的处方量、96% 的药房和 950,000+
              名医疗专业人员。Optum Rx 将 CoverMyMeds 与 Surescripts、PreCheck MyScript、DrFirst、CenterX 和 Allscripts 一起列为主要 e-PA
              提交门户。McKesson 2024 财年报告收入约 $309 billion，让 CoverMyMeds 能借 McKesson 的医院、专科药房和制造商客户关系进行大量交叉销售。CoverMyMeds
              路由和跟踪 PA 请求，但不独立决定批准速度；延迟由付款方系统处理决定。它没有公开描述在处方开出点处理费用援助登记、药品上市 biopharma 互动或药房路由优化。CoverMyMeds
              服务方访问定价未公开披露。


              Change Healthcare 现在以 UnitedHealth Group 旗下 Optum for Business 身份运营，通过合并后的 Optum 能力支持美国 10 家医院中的 8 家和 10
              个健康计划中的 8 个。其 e-PA 门户支持当天 PA 决定，PreCheck Prior Authorization 功能减少批准时间和拒付。2024 年 2 月勒索软件攻击扰乱了约 193 million
              人的理赔处理和 PA 工作流；AMA 调查数据显示，80% 的诊所因此出现未付理赔导致的收入损失，85% 的诊所额外投入员工时间处理收入周期任务。


              Waystar 为 1 million+ 名服务方提供 RCM 软件，覆盖美国 60% 患者人群；截至 2023 年 9 月，其第三方服务方净推荐值超过 74。其 Financial Clearance 套件把
              PA 管理、保险核验、价格透明和拒付预防作为集成组件。PA 集成覆盖 Epic、Cerner 和 MEDITECH。Waystar 的 PA 定位是财务清算和拒付预防；其官方平台材料没有提到 biopharma
              合作、费用援助登记或专科药房路由。定价未公开披露；PA 能力被打包进企业 RCM 合同。
