      - CV022
      - CV024
      - CV025
    data:
      items:
        - label: 4.2x — Waystar 公开市场 EV/Rev
          value: 210
          unit: $M
          detail: 公开市场地板：将 Waystar 当前 EV/Revenue 倍数套用于 $50M。若增长叙事落空，代表完全按公开市场重估的风险。
        - label: 10x — 基准私营增长
          value: 500
          unit: $M
          detail: 适用于医疗 AI 私营成长期公司的保守倍数，前提是利润率画像尚未验证。基准情景下限。
        - label: 15x — 高溢价私营增长
          value: 750
          unit: $M
          detail: 适用于年增长 1.5–2x 且毛利率 60–70% 已确认的情形。基准情景上限。
        - label: 20x — 当前 $1B 标记估值
          value: 1000
          unit: $M
          detail: 由披露的 $1B 估值和 $50M 收入隐含得出。若按基准假设承销，需要牛市情景得到确认才站得住。
        - label: 30x — 相邻 AI 可比
          value: 1500
          unit: $M
          detail: 方向性上限以 Abridge 约 53x ARR 为天花板，并因 Forus 验证公开度较低、收入模型不同、证据质量较弱而下调。只有在 M&A 或牛市情景确认后才可能达到。
  - id: FV004
    title: 投资 KPI 评分卡
    type: kpi
    layout: standard
    summary: 面向 IC 的六项投资维度评分：市场机会、牵引力证明、竞争护城河、财务经济性、风险画像和证据质量。评分反映截至 2026 年 6 月的公开证据；私下尽调可能显著改善经济性和证据质量得分。
    approximationNotes: 评分仅基于公开证据，由分析师判断。「高」= 有强证据支撑；「中」= 方向正面但验证不足；「低」= 公开证据不足，无法给出正面判断。收入和估值数字来自 Forbes 及公开公告。风险评分反映第 07 章分析。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV022
      - CV033
      - CV034
    data:
      items:
        - label: 市场机会
          value: High
          detail: 事先授权和处方获取自动化瞄准每年 $530M+ 的行政浪费；生物制药商业化上市市场中，单药支出为 $50M–$200M；TAM 规模大，且结构性增长。
        - label: 牵引力证明
          value: Medium
          detail: 约 $50M 年化收入和 5 家前 10 大生物制药合作伙伴证明商业验证成立，但留存、满意度和产品深度指标尚未经独立第三方验证。
        - label: 竞争护城河
          value: Medium-High
          detail: 覆盖 80% 美国邮编、生物制药付费且面向服务方免费的模式，以及第一方实时 PA 数据，共同构成网络效应护城河；护城河能否持久，还需要验证 EHR 集成认证，并确认支付方连接广度。
        - label: 财务经济性
          value: Low-to-Medium
          detail: 收入速度异常强劲（6 个月约 5x）；毛利率、NRR、烧钱率和集中度完全未公开；NDA 尽调完成前，承销信心偏低。
        - label: 风险画像
          value: High Risk
          detail: 监管（35+ 项 AI-PA 法案）、集中度（未披露的生物制药合作伙伴）、基础设施（依赖清算所）和隐私（BAA / 去标识化缺口）风险同时存在；单看任何一项，可能都不致命。
        - label: 证据质量
          value: Low-to-Medium
          detail: 公司披露指标（Forbes）是唯一财务锚点；没有独立分析师覆盖（KLAS、G2、Gartner），没有审计财务，也没有具名客户。网络规模指标原则上可独立验证，但尚未经第三方审计。
