      - number: '5.2'
        title: AI 与运营架构
        blocks:
          - type: paragraph
            body: >
              Forus 将其平台描述为「AI 驱动网络」，但未公开披露技术栈、EHR 集成方法、付款方 API 连接细节或模型架构。基于官方产品描述、公司博客和投资者公告，可以用不同置信度勾勒出以下架构层。


              **临床智能层。** 公开披露最详细的是 Forus 内部 Clinical Intelligence 职能，由 Adam Harris, MD 领导（Oscar Health 应用 AI
              副总裁、Bellevue Hospital Center 主治医生、NYU 医学临床助理教授）。团队还包括 Kathleen Alvarez, NP（Yale School of Nursing，曾有风湿科 PA
              经验）。该团队的职责是把付款方规则知识、专科特定 PA 细节和处方集逻辑直接嵌入产品设计与 QA。这个职能落地为一个持续更新的政策 / 规则引擎——它不同于自主 AI 临床决策系统，更像经验丰富的 PA
              协调员的判断镜像，同时不把临床权威委托给算法。


              Harris 医生曾表示：「我们的目标不只是使用 AI。我们的目标是支持临床医生，帮助患者获得所需药物，同时确保我们构建的一切都反映真实临床实践。」这一表述符合混合 human-in-the-loop 模型：AI
              处理模式匹配、表单生成和状态追踪，临床员工则保留对例外和申诉的判断。


              **工作流自动化与规则引擎。** Forus 通过把 EHR 处方数据映射到付款方特定 PA
              标准来自动生成表单。这需要持续维护一套付款方规则库——覆盖美国每个付款方和每种药品的保险公司临床政策与阶梯疗法要求。维护这套规则库是一项显著的持续运营成本，也是新进入者复制的主要壁垒。公司未披露规则数据库规模、更新频率或准确率。


              **EHR 集成模型。**               Forus 被描述为「嵌入医生工作流」并集成进 EHR 系统。具体集成方式未公开披露。标准医疗 IT 集成模式包括 FHIR R4 API、HL7 v2
              ADT/ORM feeds、SMART on FHIR app launch，或 EHR 厂商自有 API（Epic App Orchard、Cerner OpenPlatform）。Waystar
              的开发者门户公开记录 REST API、HL7、X12 EDI、sFTP、web services 和 RPA 等集成选项，可作为现代 RCM 平台对外暴露能力的有用基准。Humata 技术页面确认
              HL7/FHIR 标准集成和自有 API。Forus 未发布开发者门户、API 文档或 EHR 认证名单。


              **AI 推理。** Optum Rx 公开 AI 路线图描述了应用于药房和 PA 工作流的三层架构（预测式、生成式、智能体式）。Infinitus 使用语音 AI 代理处理高风险医疗电话，包括福利验证和 PA
              跟进。Forus 的方法看起来聚焦工作流编排，而不是把语音或生成式 AI 作为主要形态；但公司未披露模型类型、训练数据来源、评估方法、幻觉 / 覆盖治理或性能基准。


              **生物制药数据架构。** 一手处方流数据资产——PA 结果、处方集例外、依从性信号、开方者行为——被描述为核心竞争资产，也是生物制药商业准入收入模型的基础。Forus
              未披露去标识化方法、最小单元格规模抑制实践、数据治理文档，也未披露数据是否同时与多个生物制药客户共享，或是否受独家安排约束。


              未公开内容包括：确切 EHR 系统认证、付款方 API 连接名单、模型评估指标、uptime/SLA 数据、BAA 模板条款、AI 治理框架、训练数据来源，以及覆盖 / 例外升级规则。
            claimRefs:
