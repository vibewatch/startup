      - number: '1.4'
        title: 规模、牵引力与关键指标
        blocks:
          - type: paragraph
            body: >
              截至 2026 年 5 月更名公告，Forus 已被美国 50 个州的数千家医疗机构和医疗系统使用。过去两年，服务方采用量每年同比增长 10x，几乎完全由口碑推动，而非付费营销。Forus 覆盖美国近 80%
              居民邮编区的患者，其中包括服务不足社区；这些患者很多是第一次获得专科疗法。


              客户案例展示了平台在多个专科里的实际效果。Goodman Dermatology（10 个地点、35+ 名服务方）报告称，部分在其他诊所被拒的患者获得批准，通常只需 2-3 天。MedicoCX 是服务 300+
              家独立诊所的团购组织，其团队每天花在给付款方打电话上的时间从 60-70% 降至 15% 以下。Digestive Health Specialists 的生物制剂协调员把 PA 处理量从每天约 5-10
              个完整处理的 PA 提升到 15-30 个。Optima Dermatology 清掉了 500+ 项任务积压，现在所有事先授权都能当天发起。OpenEvidence 每天为美国医生提供超过 1 million
              次临床咨询；该公司在 2026 年 4 月 2 日宣布与 Forus 建立战略合作，把临床决策支持与 Forus 的处方可及性自动化整合起来。


              Forus 已连续完成三次 SOC 2 Type II 审计，Sensiba LLP 均出具无保留意见；最近一次覆盖 2025 年 2 月 1 日至 2026 年 1 月 31
              日，范围包括安全性、可用性、处理完整性、保密性和隐私。公司报告称在纽约市约有 100 名工程师和运营人员。除 Forbes 报道的年化估算外，公司未公开披露收入、利润率和流失数据。
