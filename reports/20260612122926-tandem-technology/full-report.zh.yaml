      - number: '1.5'
        title: 风险图谱与监管环境
        blocks:
          - type: paragraph
            body: >
              Forus 处在 AI 处方自动化的服务方侧：帮助医生生成并提交事先授权请求；它不属于由 AI 系统评估并拒绝理赔的付款方侧。当前监管环境下，这一区分很重要，因为争议焦点是保险公司用 AI
              大规模拒绝治疗且人工复核不足。即便如此，AI 事先授权的大类监管和声誉风险仍会波及整个赛道。


              多个独立来源记录了 AI 辅助事先授权的系统性风险。Stanford 研究者在 2026 年 1 月发表于 Health Affairs 的文章警告，保险公司把 AI
              用于事先授权时，可能放大既有缺陷：保险公司的人类审核员可能缺少时间、专业能力和激励来实质性复核 AI 生成建议，从而导致错误拒付。KFF 研究发现，已有 8-12% 的保险计划使用 AI
              支持事先授权拒付。行业分析师引用的 2024 年 AMA 调查显示，61% 的医生担心不受监管的 AI 被用来增加拒付。National Health Law Program（2026 年 1 月）警告称，联邦
              AI 行政令可能限制各州针对 AI 驱动保险拒付的消费者保护。


              州层面的监管节奏正在加快。Holland and Knight 的 2026 年分析记录了 Alabama（SB 63）、Indiana（HB 1271）、Utah（SB 319）、Washington（SB
              5395）、Maryland（HB 1563）和 Georgia（SB 544）在 2026 年颁布的新医疗 AI 法律；这些法律都要求医生以某种形式复核 AI 辅助的事先授权决策。法律目标是付款方侧
              AI，而不是 Forus 这类服务方工具，但监管趋势反映出审查氛围正在升温，未来可能覆盖 PA 工作流中的所有 AI 参与者。Forus 作为面向服务方、对临床医生免费的工具，能降低但不能消除监管和声誉敞口。
            claimRefs:
              - CO033
