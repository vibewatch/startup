        - 确认是否有 EHR 集成费或认证成本摊销到医疗服务方基础；索取每家诊所的医疗服务方接入成本
      - - 净收入留存率（生物制药）
        - 未知；2026 年 H1 收入增长 5x，暗示 NRR 远高于 100%，若扩展合同占主导，可能达到 150–200%
        - 很低（从增长轨迹推断）
        - NRR 高于 120% 将证实队列扩张并降低集中度风险；NRR 低于 100% 则提示流失
        - 索取生物制药合同的年份队列数据：起始 ARR、当前 ARR、续约、流失客户、按药品数计算的扩张率
      - - 估计年度现金消耗
        - 按约 100 名 NYC FTE、每人全口径 $150–250K 估计，每年约 $18–35M；不含增长招聘或生物制药上市 COGS
        - 很低（结构性估计，未披露）
        - 决定 $160M 融资后的现金跑道；若烧钱速度显著高于估计，可能需要在 2027–2028 年进行 Series C
        - 在 NDA 下索取月度银行流水或管理账，显示实际月度现金消耗和期末现金余额
      - - 单个生物制药合作伙伴收入（平均）
        - 若 5 个合作伙伴且约 $50M 收入运行率平均分配，估计为约 $9–11M；实际很可能高度偏斜
        - 很低（按 Forbes 数据倒推，假设均匀分布）
        - 收入集中度测试：若第一大合作伙伴贡献 > 40% 收入，其退出会造成重大风险
        - 索取前 3 和前 5 大客户占总收入百分比；确认合作伙伴队列的 HHI
