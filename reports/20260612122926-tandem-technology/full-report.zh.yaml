  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型与收入流
        blocks:
          - type: paragraph
            body: >
              Forus 的收入完全来自三边网络（医疗服务提供方、患者、生物制药）中的生物制药侧，这与其让临床医生和患者免费获得处方准入的使命一致。2026 年 5 月的官方公告和同期发布的 Forbes
              画像描述了一个商业模型：制药制造商向 Forus
              付费，换取三类价值：（1）在临床决策发生时优先触达开方者网络；（2）来自真实世界工作流处理的一手数据，覆盖处方启动、事先授权结果、处方集例外模式和患者依从性；（3）药品上市支持服务，加快新获批药物在 Forus
              的医疗服务提供方与药房网络中的首填速度。公告发布时，全球收入排名前 10 的生物制药公司中已有 5 家与 Forus 合作；这个渗透率意味着 Forus 已经跨过与最大制药买方商业合作所需的临床验证和合规门槛。


              对医疗服务提供方免费，本身就是商业机制，不只是市场进入补贴。可比 PA 自动化软件通常每月收费 $2,000–$8,000（基于 Linear Health 行业基准），手工外包授权成本为每次
              $7–$15（同一来源）。Forus
              去掉医疗服务提供方预算摩擦后，形成采用飞轮：医疗服务提供方增长扩大处方流数据资产，反过来提高生物制药制造商对商业准入合作的估值。因此，网络规模既是产品，也是每一次生物制药销售对话中的证明点。公告时，Forus
              覆盖近 80% 的美国住宅邮编，并覆盖全美 50 个州的数千家诊所和医疗系统。


              公开来源支持或可推断出三类收入流，另有两类仍属猜测。证据最扎实的是生物制药商业上市合作费：制造商付费，让其药品上市嵌入 Forus
              的医疗服务提供方触达层，加快新获批或新纳入覆盖疗法的采用。第二类是处方流数据授权，Forus 将匿名化的真实世界数据出售或打包进商业准入合同，数据内容包括 PA
              批准模式、处方集动态和依从性指标。第三类是患者可负担项目促进费——制造商资助免费的患者援助项目（PAP）和共付卡注册；Forus 可能因在临床工作流中简化注册而收取促进费。另两类收入流（药房路由渠道费和未来分析
              SaaS）属于猜测，当前公开证据不支持。


              Forbes 文章是唯一公开披露收入规模的来源：截至 2025 年底，年化收入超过 $10 million；截至 2026 年 5 月，「今年迄今大约翻了五倍」。取中点推算，年化运行率约为 $45–55
              million——驱动因素是生物制药合同扩张，而不是向新医疗服务提供方收费。在企业销售周期明显的 B2B 模型里，这种速度的收入增长，符合 5 家大型生物制药合作伙伴同时从初始试点扩展到多药品商业部署的情形。
