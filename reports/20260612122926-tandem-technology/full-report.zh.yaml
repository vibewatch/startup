      - number: '8.5'
        title: 图表材料
        blocks:
          - type: callout
            title: SaaS 与营销服务：决定倍数的问题
            body: >-
              任何 Forus 投资决策最重要的框架问题是：哪一套可比框架占主导？如果 Forus 是数据平台 SaaS 企业（65–80% 毛利率、高 NRR、持久订阅），20x 收入倍数可以实现，$1B
              进入价也站得住脚。如果 Forus 是生物制药营销服务企业（利润率更低、交易型收入、项目制合作），合适倍数是 5–10x，$1B 标记就明显偏高。解开这个问题需要私有财务尽调，也是整个投资分析中杠杆最高的问题。
            calloutType: insight
            claimRefs:
              - CV030
              - CV036
          - type: callout
            title: 倍数压缩先例：Waystar 信号
            body: >-
              Waystar 从 2025 年到 2026 年市值下降 43.5%，说明即便竞争定位很强，医疗健康工作流平台也无法免疫倍数压缩。任何以 $1B 进入 Forus
              的买方，都应在悲观情景中建模一个上市可比公司重定价场景——不是把它当作大概率结果，而是作为需要写入交易结构定价的风险参数。
            calloutType: insight
            claimRefs:
              - CV007
              - CV023
