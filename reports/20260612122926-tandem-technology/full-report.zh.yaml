  - id: TV005
    title: 投资逻辑破裂与放弃触发项
    columns:
      - 触发事件
      - 可观察阈值
      - 对投资逻辑的传导
      - 建议动作
    rows:
      - - 主要 biopharma 合作伙伴不续约或退出
        - 任一具名前三大 biopharma 合作伙伴公开下调合同金额、终止合作，或公司沟通中可见收入环比下降 >15%
        - 收入直接跳崖；证明集中度风险没有被管住；任何情景下都无法支撑 20x 收入倍数
        - 立即暂停任何新增投资；需要完整重新承销；基准情景估值降至悲观区间（$200–420M）
      - - 监管要求重构产品架构
        - 联邦或州监管机构（FDA、OCR，或依据州 PA 法行动的 DOJ）发布执法行动或同意令，要求 Forus 在 90 天内实质修改 AI-PA 工作流
        - 触发重大产品开发成本；推迟新合作伙伴上线；压缩毛利率；可能限制受影响州的商业模式
        - 重新评估监管敞口深度；测算合规成本对 EBITDA 路径的影响；下调至观察
      - - PHI 数据泄露
        - 任何 OCR 调查、集体诉讼，或公开报道显示 Forus 或其分包商未经授权披露患者 PHI
        - 医疗数据泄露平均成本 $7.42M（IBM/ITECS 基准）；损害 biopharma 合作声誉；BAA 可能连锁终止
        - 解决前立即放弃；泄露范围、遏制速度以及与合作伙伴的 BAA 状态决定投资逻辑能否恢复
      - - 公开市场医疗 AI 倍数压缩
        - Waystar EV/Revenue 跌破 3x（当前 4.2x），或 2026–2027 年可比私募 AI 医疗公司出现 down-round
        - 可比估值框架下移；即便在乐观假设下，$1B 入场也越来越难自圆其说
        - 下修入场区间；争取价格调整，或等待能支撑更高倍数的财务披露
      - - CEO / CTO 层级管理层离职
        - 创始人离职，或 C-suite 出现非计划变动且 60 天内没有明确任命资质足够的继任者
        - 网络和 biopharma 关系可能依赖创始人；公司合作伙伴关系未披露，关键人风险被放大
        - 与董事会立即沟通继任计划；在情况清晰前暂缓部署任何已承诺资本
    notes: 触发项是基于已识别风险登记表（第 07-risks 章）推导出的前瞻观察。阈值为分析师定义的监测标准，不是合同承诺。每个触发项都应纳入主动监测机制，并按季度对照指定的可观察阈值复核。
    claimRefs:
