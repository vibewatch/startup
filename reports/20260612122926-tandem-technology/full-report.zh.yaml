        - 争取合同最低期限承诺；分散到中型生物制药公司；发展非生物制药收入流
      - - AI 模型准确性下降 / 付款方规则漂移
        - PA 批准率较基线下降 >10%，或服务方持续投诉 PA 提交错误
        - 重大事件：系统性模型错误会造成责任暴露并侵蚀服务方信任
        - 披露模型再训练节奏；实施实时批准率监控；建立覆盖升级协议
