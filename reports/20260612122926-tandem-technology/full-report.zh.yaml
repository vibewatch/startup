  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分层
        blocks:
          - type: paragraph
            body: >
              Forus
              运营一个三边市场，买方、用户和付款方角色各不相同。医疗服务提供方——主要是专科诊所及其临床员工——是平台的主要用户。患者是最终受益人，他们获得更快的治疗准入、通过可负担项目注册降低自付成本，并收到主动状态沟通。生物制药制造商是主要付款方：它们为对医疗服务提供方免费的模型买单，换取临床决策时刻的商业准入、处方流数据和药品上市支持服务。这种三方结构意味着「客户」在不同语境下含义不清；本章覆盖三层，但区分付款客户（生物制药）、用户客户（医疗服务提供方）和受益人（患者）。


              在医疗服务提供方中，公开记录的客户基础集中于 PA 负担较高的专科类别：皮肤科（Goodman Dermatology、Optima Dermatology、AQUA
              Dermatology）、过敏与风湿科（Allergy and Rheumatology Specialists of Houston、US Allergy and Asthma），以及胃肠科 / GI
              生物制剂（Digestive Health Specialists）。这些专科共享一类工作流画像：生物制剂开方率高、每种药品对应复杂付款方规则，且频繁 PA 要求消耗不成比例的协调员时间。肿瘤科、神经科和其他高
              PA 专科被描述为可触达，但没有点名案例。


              GPO 和渠道合作伙伴构成第二个分发分层。MedicoCX 是一家全国性 GPO，服务 300+ 家独立诊所，主要集中于过敏科；它从中心层面采用 Forus，并把 Forus 嵌入所有新成员诊所的导入，形成
              B2B2B 分发层。OpenEvidence 每天为美国医生提供超过 100 万次临床咨询，并于 2026 年 4 月 2 日宣布与 Forus 达成战略合作，把临床决策支持与 Forus
              的处方准入自动化集成。这些合作把 Forus 触达范围扩展到逐家诊所直销之外。


              生物制药分层只以汇总形式描述：全球收入前 10 的生物制药公司中有 5
              家是合作伙伴。公司名称、治疗领域或合同结构均未公开披露。医疗系统被描述为医疗服务提供方基础的一部分（「数千家医疗系统」），但公开案例研究或新闻稿没有点名任何系统。
