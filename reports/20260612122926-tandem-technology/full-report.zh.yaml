chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >
              Tandem Technology, Inc. 由 Sahir Jaggi 于 2023 年在纽约市创立，公司在 2026 年 5 月 12 日前一直使用 Tandem 名称；当天公司公开更名为
              Forus，正式公告写作「Forus（formerly Tandem）」。隐私政策列明的法律实体是「Forus, Inc.」。公司的使命是清除医生开出处方到患者开始治疗之间的行政障碍，加快药物可及。


              核心平台是一张直接嵌入医生 EHR 工作流的 AI 网络。临床医生开出处方后，Forus 会自动接住订单并处理所有下游步骤：判断是否需要事先授权、生成并向付款方提交 PA
              表单、必要时为患者登记制造商援助计划、把处方路由到最合适的药房或专科药房，并通过短信向医生团队和患者同步状态。平台覆盖美国所有药品、付款方和药房，并且对服务方和患者完全免费。


              收入模式不依赖医疗服务方或患者付费。Forus 通过与 biopharma 公司的商业合作变现，尤其围绕新药上市支持。Forus
              卡在处方医生决策、付款方规则和药房履约的交汇处，因此能生成关于处方流、批准率和患者依从性的一手数据；生命科学公司愿意为这些数据付费，用来改进商业化策略。到 2026 年 5 月公告时，全球前十大
              biopharma 公司中已有 5 家与 Forus 合作。公司在纽约市设有唯一办公室，约有 100 名工程师和运营人员。更名前公司网站是 withtandem.com；现在运营于 forus.com。
