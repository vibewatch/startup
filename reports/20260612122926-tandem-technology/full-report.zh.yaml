        - 终止标准：若法律要求每次 AI 辅助 PA 判定前都必须由持牌医生签字，完全自动化 PA 在经济上将不可行
        - 每月跟踪 Manatt tracker；聘请政策律师；在触及阈值前构建医生证明模块
