      - number: '6.3'
        title: 买方经济与采用路径
        blocks:
          - type: paragraph
            body: >
              Forus 采用的经济性因客户分层而显著不同。              对医疗服务提供方而言，决策零成本，并由工作流 ROI 驱动：在不花费每月 $2,000–$8,000 购买竞争平台的情况下，消除每周 13
              个员工小时的事先授权导航工作（GC 博客引用 AMA 数据）。对医疗服务提供方免费的设计，把采购决策转化为工作流集成决策，去掉预算周期、IT 审批和 ROI 论证流程。Allergy and
              Rheumatology Specialists of Houston 案例研究展示了低摩擦采用模式：管理员在导入电话后立即提交一张处方，两天后获批，并在同一周内完成全诊所导入，前 7 天发送 30–40
              张处方。


              转介绍和 GPO 渠道把这种低摩擦模型扩展到网络。MedicoCX 采用 Forus 作为 GPO 全网标准，意味着每一家新成员诊所都会在导入期间接触 Forus——Forus 不需要额外销售动作。Goodman
              医生向 AQUA Dermatology 的推荐触发了覆盖整个 AQUA 网络的组织级推出。这些连锁事件带来不成比例的规模：一个企业级医生集团或 GPO 关系，可以同时交付数百家成员诊所。


              Surescripts、MCG 和 HealthEdge 的可比 PA 自动化研究，记录了患者影响，也奠定了医疗服务提供方和生物制药购买 PA 自动化时的预期。Surescripts 与 Fairview
              Health Services 的试点，把因缺失临床信息导致的授权拒绝减少 88%，许多批准在 30 秒内完成。MCG/Regence/MultiCare 合作获得 2023 KLAS Points of
              Light 奖，把一些程序的平均患者等待时间从 15 天降至近实时。Alithya 为一家大型美国健康保险公司实施的项目每月处理 9M+ 页文档，直通处理率 80%，每年节省 $2.5M+。HealthEdge
              案例研究记录，每个自动批准的常规请求节省 40 分钟综合员工时间。这些不是 Forus 结果；它们代表买方评估包括 Forus 在内任何 PA 自动化平台时带入的基准预期。


              大约一半慢性病患者从未按处方服药，每年造成估计 $528 billion 的可避免支出。近 80% 医生报告患者因 PA 相关准入摩擦而放弃治疗。General Catalyst 和 AMA
              引用的这些数字，解释了为什么医疗服务提供方（工作流负担）和生物制药（未填处方造成收入流失）都有动力资助并采用 Forus。
