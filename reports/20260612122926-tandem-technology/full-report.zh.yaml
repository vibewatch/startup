      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: PA 摩擦降低与 Biopharma 收入之间没有经过验证的转化率
            body: >
              Forus 卖给 biopharma 的核心价值主张——首填率改善带来增量药品收入——在任何公开来源中都没有得到独立验证。没有可信的转化率，就无法从药品支出或未履约视角三角定位 Forus
              的实际可服务市场。投资人在接受任何单一 TAM 数字前，应要求独立结果数据或自下而上的 biopharma 定价模型。
            calloutType: risk
            claimRefs:
              - CM019
              - CM020
          - type: callout
            title: Biopharma 预算压缩是与 Forus 收入模式最相关的结构性威胁
            body: >
              Inflation Reduction Act 的药价谈判条款和新的 GENEROUS Medicaid Model（2026）都会压缩 biopharma 制造商在高销量药品上保留的净收入。Forus
              的商业合作资金来自制造商商业预算，而不是医疗系统 IT 预算；因此，制造商收入和商业支出的下降会直接威胁 Forus 的收入轨迹。这项风险不同于事先授权 AI 工具通常被标记的临床或监管风险，值得单独做情景建模。
            calloutType: insight
            claimRefs:
              - CM036
              - CM037
          - type: callout
            title: 面向服务方免费模式创造了结构性更优的采用路径
            body: >
              Forus 向 biopharma 收费，而不是向服务方收费，因此移除了主要用户群——医生诊所和医疗系统——面前的采购障碍。这个结构选择解释了公司报告中几乎完全由口碑推动的服务方采用量同比 10x 增长，也让
              Forus 相比收费 PA 自动化竞品更有利；后者必须经过收入周期财务团队的正式采购周期。风险在于，如果 biopharma 模式被打断（源于预算压缩或对制造商资助工作流的监管审查），Forus
              没有来自服务方的天然后备收入流。
            calloutType: strength
            claimRefs:
              - CM021
              - CM022
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >
              Forus 的竞争格局分成五类，每一类的买方关系、收入模式和能力范围都不同。


              第一类是直接 AI-PA 自动化同业，即核心产品是为服务方组织自动化事先授权生命周期的供应商。Humata Health 是最相关的同业：其 PAthway
              平台覆盖从规则判断、临床材料打包、提交、状态监控到授权后监测的完整 PA 连续流程。它原生集成主要 EHR，报告 96% 首次提交批准率，并持有企业级安全认证（HITRUST CSF、SOC 2 Type
              II）。Develop Health 面向以专科药房为中心的 PA 自动化，采用类似的服务方付费模式。两家竞品都没有公开复制 Forus 的费用支持项目登记、biopharma 付费经济性，或在处方开出点由
              EHR 触发完整准入工作流的能力。


              第二类是语音 AI 邻近平台：当电子路径不可用时，它们自动化 PA 状态查询和福利核验所需的电话互动。Infinitus 是主要玩家，已完成 8 million+ 次付款方电话，服务 125,000+
              名服务方，并声称 Fortune 50 公司中 44% 已采用。Infinitus 在提交后环节启动，处理付款方电话队列；它不是嵌入 EHR 的处方工作流工具，也不处理费用援助登记或药房路由。


              第三类是既有清算所和网络运营商。CoverMyMeds（McKesson）声称占据约 90% 的电子 PA 交易量，连接美国 94% 的处方量、96% 的药房和 950,000+
              名医疗专业人员。这种网络规模是主导型既有玩家的护城河：经 CoverMyMeds 路由已默认嵌入 EHR 工作流、付款方门户和 PBM 系统。Change Healthcare 目前在
              Optum/UnitedHealth Group 旗下运营，经营互补的 e-PA 清算所。2024 年 2 月 Change Healthcare 遭勒索软件攻击，这是美国医疗史上最大数据泄露事件，扰乱了 80%
              受影响诊所的事先授权工作流，也暴露了集中式清算所基础设施的系统性脆弱。


              第四类是 RCM 平台竞品。Waystar 在统一收入周期管理套件中提供 PA 授权管理模块；该套件被超过 1 million 名服务方使用，覆盖美国 60% 患者人群。其 PA 模块集成 Epic、Cerner
              和 MEDITECH，重点是财务清算和拒付预防，而非处方准入或 biopharma 互动。


              第五类，也是最大的一类，是替代池：人工员工操作付款方门户、EHR 原生 PA 模块（Epic 内置 PA 功能、Oracle Health）、传统 biopharma hub
              供应商，以及大型医疗系统或药企的内部自建项目。CAQH 2025 Index 发现，2024 年只有 40% 的事先授权交易以电子方式处理，说明人工替代仍是所有 PA 自动化供应商竞争时面对的多数基线。根据
              AMA 2026 行动包，医生平均每周完成 39 个 PA，约消耗 13 个员工小时。
