      - number: '7.4'
        title: 商业化与执行风险
        blocks:
          - type: paragraph
            body: >
              Forus 的收入模型在结构上集中于生物制药商业合作。截至 2026 年 5 月 $160M 融资公告，全球前十大生物制药公司中已有五家被列为合作伙伴，年化收入运行率超过 $50
              million。但公司没有公开任何伙伴名称、治疗领域、合同期限、续约结构或最低承诺水平。因此，公开证据无法独立评估客户集中度、续约风险和流失暴露。公司向服务方和患者完全免费提供平台，这有利于服务方采用，但如果一个或多个生物制药伙伴削减支出或终止合作，公司没有多元收入缓冲。


              按 CEO 表述，服务方采用已连续两年同比增长 10×，但没有发现 G2、KLAS、HITRUST 或 Capterra 上的独立评价。缺少第三方证明，会给采购带来摩擦，尤其是企业级医疗系统的 IT
              和安全团队通常要求独立证明后才批准供应商。医疗系统还可能要求专门的客户成功资源；按 Forus 约 100 人的员工规模，放大后很难支撑。AMA 2026 年 National Advocacy
              Conference 的事前授权行动工具包记录了医生对 AI 驱动拒付风险的担忧，这会直接影响服务方是否愿意信任 AI 中介，构成间接采用阻力。


              Prosper AI 的市场分析指出，随着付款方网络在内部开发自有 AI 自动化、竞争工具增多，商品化和多归属风险会变得尖锐。CoverMyMeds、Waystar、Humata 和 Infinitus
              都服务于相邻或重叠的 PA 自动化工作流；如果付款方把直接 AI PA 提交集成进自己的门户，Forus
              作为中介的价值可能下降。快速规模化要求覆盖每一种药物、付款方和药房，也要求持续投入维护付款方规则库、解决边缘案例、加入新的处方集数据；即便收入扩大，这些投入仍会压迫员工数和烧钱速度。
