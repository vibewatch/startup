        - 终止标准：若泄露成本超过 $7M+，或出现重大 OCR 同意令，将削弱生物制药合作和服务方信任
        - 加速公开披露 SOC 2 Type II；完成 AI 专项 BAA 审计；获得网络保险
      - - 重大清算所 / 基础设施中断
        - 服务 Forus 的清算所发生多日中断，影响 >20% 的 PA 量
        - 重大事件：持续中断 > 72 小时，会向投资人与合作伙伴暴露单点故障风险
        - 确认多供应商清算所架构；为服务方实施 PA 状态备用仪表盘
