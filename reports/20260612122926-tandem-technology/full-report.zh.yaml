      - CV029
      - CV031
      - CV032
      - CV037
      - CV038
      - CV039
  - id: TV006
    title: 最终尽调要求
    columns:
      - 主题
      - 缺失证据
      - 为什么影响估值
      - 尽调路径
    rows:
      - - 毛利率和 COGS 结构
        - 未公开披露毛利率、COGS 拆分，或按收入流划分的贡献利润率
        - 在 DCF 假设下，毛利率相差 10 个百分点（60% vs 70%）会让可持续倍数变化约 30–50%；若利润率低于 55%，任何基准情景都无法支撑 $1B 标记
        - 在 NDA 下索取过去四个季度的经审计或管理口径 P&L；明确要求 COGS 按 EHR 集成维护、payer API 成本和临床规则更新拆分
      - - 净留存率（NRR）
        - 未公开提供队列留存、NRR 或 biopharma 合同续约率数据
        - NRR 是最关键的 SaaS 质量指标；NRR >115% 可以支撑 $1B 乐观情景入场；NRR <100% 则说明 biopharma 合作伙伴收缩，并把公允价值压到悲观区间
        - 索取按合作年份划分的合作伙伴队列收入表；明确询问已进入首次续约窗口合同的续约率
      - - 合同集中度和合作伙伴身份
        - 五家具名 biopharma 合作伙伴未公开披露；合作伙伴之间的收入分布未知
        - 如果两个合作伙伴贡献 $50M 收入的 >70%，单一不续约就会造成 >$17M 收入断崖——以当前经营规模看已属重大
        - 在 NDA 下索取前五大客户收入集中度表；另行要求每份合作伙伴协议的最低合同期限和通知期
      - - 烧钱速度和现金跑道
        - 年度现金消耗未公开披露；基于纽约员工数基准，估计范围为每年 $18M 至 $35M
        - 现金跑道不确定会影响稀释模型；如果 Forus 在 18 个月内以平轮或 down round 再融资，$1B 入场标记会在任何退出前先受损
        - 在 NDA 下索取最近 12 个月现金流量表和 18 个月现金跑道预测模型
      - - BAA 治理和数据去标识化
        - Forus 的 Business Associate Agreement 模板、去标识化标准（Safe Harbor vs Expert Determination），以及 AI 模型训练排除 PHI 的安排均未公开披露
        - Biopharma 分析收入依赖可合法共享的处方流数据；去标识化缺口或 BAA 瑕疵可能让整个分析收入流面临合同撤销和监管执法
        - 索取与医疗系统客户及 biopharma 分析合作伙伴使用的 BAA 表单；要求提供关于 HIPAA 去标识化方法的法律意见，以及确认 PHI 不进入模型训练
    notes: >-
      这六项尽调要求是从「观察 / 继续研究」推进到有支撑投资决策所需的最低信息集。所有项目都是标准私营公司尽调请求；Forus 这个阶段和规模（>$50M ARR，累计融资 >$160M）的公司应当能提供。若无法或不愿在 NDA
      下提供这些材料，本身就是尽调信号。
    claimRefs:
