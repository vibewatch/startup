  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 类型
      - 规模 / 收入
      - 估值 / 倍数
      - 与 Forus 的相关性
      - 局限
    rows:
      - - Waystar (WAY)
        - 上市：RCM / 医疗支付工作流
        - $1.16B TTM 收入；$3.56B 市值；$4.87B EV
        - EV/Revenue 4.21x；P/S 3.0x；forward P/E 11x；股价较 2025 年下跌 -43.5%
        - 最接近的上市可比：医疗工作流自动化、预授权、RCM；Black Book 2026 年 RCM 智能体 AI 第 1 名
        - 规模不匹配（收入是 Forus 的 23x）；增长阶段和利润率结构不同；公开市场倍数反映成熟增长预期
      - - Abridge（私募）
        - 私募：AI 临床文档 / 环境式 AI 工作流
        - 约 $100M ARR（Sacra 2025 年 5 月）；2024 年底 $60M ARR
        - 2025 年 6 月 Series E 轮估值 $5.3B；约 53x ARR；2026 年 4 月 Series E 延伸轮再融 $316M
        - 相邻 AI 医疗工作流可比；已接入 EHR；KLAS 第 1；通过与 Availity 和 Highmark 的实时 PA 集成触达 biopharma 相邻场景
        - 相邻但不直接：临床文档 vs. 处方准入；公开第三方验证强得多（KLAS、Epic 集成）；收入模式不同（按医生订阅 vs. biopharma 付费）
      - - McKesson (MCK) / CoverMyMeds
        - 上市战略方：药房分销 / 专科处方路由
        - $94.85B 市值；年收入 >$300B；CoverMyMeds：专科处方路由
        - 约 0.3x 收入（纯分销）；CoverMyMeds 未单独披露
        - 锚定战略买方图谱：处方路由网络可以从大型药房渠道玩家手中拿到控制权溢价
        - 不是财务倍数可比对象；分销收入模式与数据 / 工作流 SaaS 根本不同
      - - Surescripts（私营合作社）
        - 私营战略方：电子处方 / 处方福利网络
        - 年处方交易 5.97B 笔；收入未披露；网络成员持有的合作社
        - 无公开市值或收入倍数；不出售
        - 结构性护城河基准：处方网络基础设施可以在合作社所有权下维持数十年根深蒂固、近乎垄断的地位
        - 合作社结构意味着没有并购退出；监管反垄断审查（过往 DOJ 调查）限制了直接类比
      - - Change Healthcare（UNH 收购前）
        - 已收购：清算所 / 处方路由 / RCM
        - UNH 收购时收入约 $3.5B；每年处理 15B 笔交易
        - UnitedHealth 支付约 $13B（2022 年交割）；约 3.7x 收入
        - 并购先例：清算所 / 处方路由基础设施拿到显著战略溢价；UNH 10-K 记录了 2024 年勒索软件攻击后的持续补救成本
        - 产品范围和监管风险结构不同；Change Healthcare 是清算所，不是 AI 工作流层；收购背景早于当前 AI 估值环境
      - - Infinx / Humata Health（私募同行）
        - 私募：AI 预授权自动化（直接竞争对手）
        - 收入未披露；Series A-B 阶段；Infinx 获 Black Book 2026 年服务商侧 PA 自动化第 1 名
        - 尚未产生收入或早期收入；创投阶段倍数不适用
        - 直接竞争基准：证明 Forus 所在细分市场已被验证，且至少还有一家 Black Book 上榜竞争对手
        - 未披露财务指标；无法做估值对比；只能作为市场验证，不是财务可比
    notes: >-
      所有上市公司数据均截至 2026 年 6 月 11–12 日，来源为 CompaniesMarketCap 和 Yahoo Finance。Abridge 私募指标来自 Sacra 分析师估计（2025 年 5
      月）；这些是第三方估计，不是经审计财务数据。Change Healthcare 收购倍数基于公开报道，为近似值。Surescripts 和 Infinx/Humata
      私募指标未公开披露。可比公司用于框定估值区间，不用于给出单一精确倍数。
    enumerationScope:
      coverage: partial
      basis: >-
        Enumeration covers the most relevant public, private, and strategic comparables available from public sources as
        of June 2026. Direct Forus competitors without public financial disclosures are included as market-validation
        benchmarks only, not financial comps.
