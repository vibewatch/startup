            body: >-
              如果代表 Forus 大部分处方量的州（尤其是 Texas、California、Florida 和 New York）颁布类似 Indiana 的法律，要求每次 AI 辅助 PA
              决定前都由持证医生签字，Forus 的全自动端到端模型就需要大幅重构产品。随之而来的合规开销会压缩利润率、拖慢提交吞吐，并部分消除推动服务方采用的零投入价值主张。投资者应按季度跟踪 Manatt Health 的
