  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义与范围
        blocks:
          - type: paragraph
            body: >
              Forus 竞争的位置至少横跨四个彼此不同但紧密耦合的问题空间，其中没有一个通常会被称为「PA 市场」。要做可信的市场测算，必须先界定范围。


              第一层，也是最基础的一层，是事先授权的行政成本。每一张需要 PA 的承保处方或医疗程序，都会在医生、付款方，有时还有药房之间触发一笔多步骤行政交易。AMA 2024 年医生调查发现，医生平均每周完成 39
              个事先授权，40% 的诊所雇用了专门处理 PA 的员工。美国医疗行政交易总支出在 2024 年超过 $81.9 billion；CAQH 2025 Index 估计其中 $18.7 billion
              仍可通过自动化释放，高于两年前的 $16.4 billion。事先授权尤其是最顽固的人工交易类别，2024 年电子化采用率仅 40%，而理赔提交和资格验证分别为 98% 和 96%。CAQH 对直接 PA
              自动化成本节省的较窄测算为每年 $50–60 million，但这个数字低估了 PA 延迟造成的更广泛生产率和临床结果成本。


              第二层是专科药准入摩擦。专科药包括癌症、自身免疫病、罕见病治疗用生物制剂，以及现在的 GLP-1 激动剂；它们占处方量不到 5%，却贡献美国药品支出的约 54%，即 2024 年约 $263 billion，高于
              2019 年的 47%。2000 至 2024 年，FDA 在 897 个创新药批准中批准了 516 个专科药；自 2012 年以来，专科药在每年 FDA 批准中占比都超过
              50%。这些药品承担最高的使用管理负担，包括阶梯疗法要求、事先授权和专科药房路由，因此也是 Forus 主要处理的工作流。


              第三层是 biopharma 枢纽和患者支持基础设施。生命科学制造商历史上会出资建设「hub」项目，即第三方患者准入服务，用来加快疗法启动、管理事先授权，并把患者连接到共付援助项目。Cardinal Health
              2026 Benchmark Report 调研了 200 家 biopharma 制造商，发现 hub 策略、供应商整合和执行预期都在被重新评估。Forus 运行在处方医生-EHR 层，更像一个技术驱动的
              hub 替代品；它原生嵌入工作流，而不是在处方事件之后再外挂。


              第四层是处方未履约和准入摩擦的规模。KFF 2026 年 1 月民调发现，47% 的参保成年人，以及 57% 的慢性病参保者，在过去两年曾遇到保险公司拒绝、延迟或更改处方或医疗服务。34% 的所有参保成年人，以及
              39% 的慢性病参保者，将事先授权列为最大负担。因此，市场机会一部分是患者结果问题，一部分是药品支出捕获问题：被放弃或延迟的治疗，就是 biopharma 制造商流失的收入。


              最重要的范围边界是面向服务方免费、由 biopharma 付费的模式。Forus 不向医生或患者收费；它的经济市场是愿意为网络准入和新药上市支持付费的 biopharma
              制造商。这限制了传统「软件市场」叙事，也把真正的市场问题改写为：制造商愿意花多少钱来提高高价值专科药的首填率、降低放弃率？
