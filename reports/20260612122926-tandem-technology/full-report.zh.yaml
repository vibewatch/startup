  - id: FM004
    title: 处方准入采用漏斗
    type: funnel
    layout: standard
    summary: 从处方事件到治疗履约的各阶段，展示 Forus 介入的位置，以及准入摩擦导致流失的位置。
    data:
      items:
        - label: 开出处方（100%）
          detail: 医生在 EHR 中开出处方；Forus 在这一点截获
          value: 100
        - label: 启动 PA 判定（约 80%）
          detail: 约 80% 专科药需要 PA；Forus 自动生成并提交 PA 表单
          value: 80
        - label: PA 首次提交获批（约 55–65%）
          detail: 行业估计专科药 PA 首次通过率为 55–65%；Forus 目标是提升该指标
          value: 60
        - label: 完成药房路由（约 50–60%）
          detail: PA 获批后，处方必须送达正确的专科药房；Forus 自动化路由
          value: 55
        - label: 确认可负担性（约 40–50%）
          detail: 如有需要，患者加入制造商援助或共付项目；Forus 处理注册
          value: 45
        - label: 开始治疗（首填配发）（约 35–45%）
          detail: 82% 医生称 PA 导致治疗放弃；处方与配药之间的显著缺口，构成 Forus 的核心价值机会
          value: 40
    approximationNotes: 阶段百分比为行业级估计，综合 AMA 调查（PA 放弃）、CAQH 数据（电子化采用）和专科药房文献得出。这些不是 Forus 特定结果指标。Forus 影响的实际转化率为公司口径，未经独立审计。
