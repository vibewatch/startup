    rows:
      - - 开方并发起 PA
        - 临床医生在 EHR 中开方；员工手工判断是否需要 PA；把表格传真给付款方；等待数天回应
        - 临床医生照常在 EHR 中开方；Forus 检测 PA 要求，并用临床数据自动提交表格
