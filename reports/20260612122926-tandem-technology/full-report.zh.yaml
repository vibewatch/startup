      X 轴：工作流宽度（1=提交后或 PA-only；10=完整处方准入，覆盖 PA + 可负担性 + 路由 + 患者沟通）。Y 轴：服务商侧成本消除（1=完全由服务商支付的企业合同；10=对服务商免费、biopharma
      付费）。评分为有证据支撑的序数判断。CoverMyMeds 在 Y 轴得 5 分，因为其收入主要来自网络 / payer 费用，而不是服务商软件合同，但服务商并未免费获得可负担性或路由优化。人工 / 现状在 Y 轴得 6
      分，因为没有供应商费用——只有内部员工成本——但工作流宽度为零。
