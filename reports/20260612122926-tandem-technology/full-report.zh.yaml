  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 工作流与产品范围
        blocks:
          - type: paragraph
            body: >
              Forus 是嵌入现有医生 EHR 工作流的处方准入层。触发点是临床医生在 EHR 中开出处方的瞬间；平台拦截该医嘱，并执行下游每一个行政步骤，临床医生不需要离开原生工作流，也不需要打开单独门户。


              已确认的产品模块覆盖 4 类不同任务：


              **事先授权自动化。** Forus 基于 EHR 处方数据自动生成并向付款方提交 PA 表单，应用付款方特定标准和临床指南，并管理被拒授权的申诉。Forus
              首页称，平台「自动化从处方到批准的每一个事先授权——生成申诉、把处方路由到正确药房」。公司博客中的医疗服务提供方证言描述，诊所团队把电话时间从「我们一天 60 到 70%……现在降到也许 15%」，一名 GI
              生物制剂协调员在采用后把 PA 吞吐量提高了三倍。


              **患者可负担项目注册。** 对可能因成本而放弃的处方，Forus 自动为患者注册制造商患者援助项目（PAP）、共付卡和财务支持项目。该模块完全由生物制药资助。


              **药房路由与履约。** 准入获批后，Forus 将每张处方路由到合适的零售、专科或邮购药房。平台被描述为覆盖全国每一家药房。面向患者的短信提供状态更新，包括确认哪家药房正在配药以及预计取药时间。


              **患者沟通层。** 自动短信工作流在每个交接点告知患者：保险决定、药房路由和可取药状态。这减少了打给诊所员工的来电。


              OpenEvidence 合作（2026 年 4 月 2 日宣布）正式把 Forus 连接到一个 AI 临床决策支持工具；该工具在美国每天用于超过 100 万次临床咨询，因此医生在 OpenEvidence
              中做出的循证开方决策，可以直接交给 Forus 的准入自动化处理。该集成是唯一公开点名的 EHR 或临床工具集成伙伴。


              平台覆盖美国 50 个州，覆盖数千家诊所和医疗系统，每年支持数百万患者。Provider 采用连续两年同比增长 10x。公司尚未公开披露具体哪些 EHR 系统已正式认证或集成、存在多少个不同付款方连接，或提交的
              PA 中有多少比例自动获批、多少需要人工跟进。
