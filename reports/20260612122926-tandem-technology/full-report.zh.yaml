    title: 护城河耐久性 / 竞争风险登记表
    notes: 严重性评级是基于已抓取证据的分析师判断。高 = 近期结构性威胁；中 = 重要但有条件；低 = 仅需跟踪。缓解路径是尽调建议，不代表公司已确认回应。
