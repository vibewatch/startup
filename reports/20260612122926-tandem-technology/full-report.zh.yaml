      - number: '2.2'
        title: 市场规模测算——多重视角
        blocks:
          - type: paragraph
            body: >
              没有一个已发布的市场估算能干净覆盖 Forus 的可触达机会。本节给出四个互补测算视角，并明确保留每个视角中的矛盾和限制。


              视角 1——事先授权行政节省机会。CAQH 2025 Index（2026 年发布，覆盖 600 家服务方组织和医疗计划，代表 63% 参保人群）估计，剩余医疗行政自动化每年可节省 $18.7
              billion。事先授权被明确标记为自动化程度最低的主要交易类别。CAQH 另行估计，直接事先授权自动化可节省 $50–60
              million；这个数字只反映文书交易成本，不包括医生时间、延迟治疗成本或药品放弃成本。Chiefhealthcareexecutive.com 在 2026 年 3 月 ViVE 采访 CAQH CEO
              Sarah Ahmad 时，把所有交易完全电子化后的全部行政自动化机会扩展到 $21 billion。重大限制：这些数字衡量的是行政工作流本身的成本，不是对药品制造商的下游收入影响，而后者才是 Forus
              的实际收入模式。


              视角 2——专科药支出和捕获上行。美国处方药支出在 2025 年达到 $915 billion，较 2024 年增长 12.7%，预计 2026 年超过 $1 trillion（ASHP/AJHP
              2026）。专科药占药品支出约 54%（2024 年为 $263 billion），但处方量不到 5%。仅 GLP-1 激动剂在 2025 年就约为 $132 billion（约占所有处方支出的
              14%）。受专科药和注射药推动，诊所在 2025 年的药品支出增长 19%。Mercer 2026 年药品趋势报告预计，专科药在 2025–2026 年增长 7–11%，在 2026–2027 年增长
              6.5–10.5%。重大限制：Forus 不抽取药品支出分成；biopharma 变现机制是商业合作费，而非收入分成。


              视角 3——患者准入 hub 和支持基础设施市场。Cardinal Health 2026 Hub Evolution Benchmark Report 调研了 200 家 biopharma 制造商的外包
              hub 策略。该报告没有给 hub / 患者服务市场测算规模，但描述了供应商整合和运营重新评估。历史分析师估计曾把专科药患者服务市场锚定在 $3–6
              billion；当前来源集合无法佐证该区间，因此明确标记为证据缺口。ICER 2025 Launch Price and Access Report 指出，专科药准入障碍——包括事先授权和 hub
              摩擦——是不同付款方类型之间准入不平等的有记录来源。重大限制：Forus 的竞争对象不仅是独立 hub 供应商，还包括制造商内部 hub 运营和嵌入专科药房的准入项目。


              视角 4——处方未履约作为市场问题的规模。KFF 2026 年 1 月民调发现，47% 的所有参保成年人和 57% 的慢性病参保者在过去两年有处方或服务被拒绝、延迟或更改。AMA 2024 年调查发现，82%
              的医生表示 PA 要求会导致患者放弃治疗。如果 $263 billion 专科药市场中哪怕 5% 代表因 PA 摩擦而放弃的治疗，那每年就是约 $13 billion 未实现药品收入；这个数字定义了
              biopharma 制造商为解决问题可能集体支付的理论上限。重大限制：放弃治疗的成因是多因素的，公开记录中没有经过验证的换算率，可以把 PA 摩擦降低转化为 biopharma 增量收入。


              跨视角综合。Forus 的收入模式意味着，真正的可服务市场是 biopharma 在新药上市和患者准入基础设施上的商业支出子集，而不是全部行政成本基数或药品支出宇宙。公司 2026 年年化收入据报道超过 $50
              million，说明早期渗透已经有实质规模。CMS 的 Medicaid 处方药支出在 2024 年超过 $100 billion（扣除返利前），而 2026 年宣布的新 GENEROUS Medicaid
              Model 引入最惠国定价，可能重塑制造商返利结构，并间接影响 hub 项目经济性。


              这些视角不能相加；它们衡量的是同一个底层摩擦问题的不同经济层。投资人应当怀疑任何单一 TAM 数字，直到 Forus 披露足够细的 biopharma 定价模型，能自下而上构建 SAM。
