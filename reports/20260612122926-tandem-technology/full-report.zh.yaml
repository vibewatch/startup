      - number: '4.4'
        title: 财务结论与披露缺口
        blocks:
          - type: paragraph
            body: >
              公开证据勾勒出的 Forus 财务图景，对一家成立三年的公司而言异常强劲；但对一家以 $1 billion 估值寻求机构资本的公司而言，也异常不透明。强项是：年化收入在约 6 个月内从 $10 million
              增至约 $50 million，获得全球前 10 大生物制药公司中 5 家验证，且对医疗服务提供方免费的模型去掉了数字健康采用中最常见的障碍。不透明之处是：毛利率、烧钱速度、现金位置、NRR、CAC
              或合同级定价均未公开披露；截至报告日，也没有独立分析师或投资者出版物为公司做出审计或估算 P&L。


              在只能依赖公开来源的范围内，收入质量结论是谨慎正面。生物制药商业准入合同通常是多年承诺（生物制药公司不会在上市周期中频繁更换准入伙伴），这意味着一旦药品进入管线，收入具有粘性。2026 年初 5x
              增长，更像试点转化为商业规模合同（块状、事件驱动的收入确认），而不是平滑的 SaaS 式订阅增长。这对 NRR 分析很重要：如果这次大幅台阶由一两个重大合同扩张驱动，底层队列的 NRR
              可能很高，但集中度风险也可能很高。


              资本充足性结论是有条件地充足：按推断的每年 $18–35 million 烧钱速度，$160 million 意味着多年现金跑道；$1 billion
              估值也给公司后续融资留下强选择权。不过，实际现金余额和实际烧钱速度都未知，这些推断可能出现数倍偏差。如果披露的烧钱速度超过每年 $50 million——激进销售和基础设施建设快速吸收 Series B
              的情况下有可能——估计现金跑道会降至 3 年以下，使 Series C 很可能在 2027 年中前发生。


              反向信号值得注意。AI-PA 的监管压力正在增强：KFF 记录，8–12% 的健康计划使用 AI 支持 PA 拒绝，多州议会也已通过法律，要求拒绝前必须由人类审查。如果 Forus 平台被认为是在促成 AI
              驱动的拒绝，而不是 AI 驱动的批准，声誉风险和立法审视可能提高合规成本，并改变生物制药侧的信任关系。此外，CMS 在 2024 年初发布的电子事先授权互操作性最终规则，要求 2027 年 1 月前通过 API
              实现电子 PA；该强制要求可能使 PA 路由层商品化，削弱 Forus 网络向生物制药买方提供的差异化。


              压倒性的财务尽调结论是：公开证据支持一个真实且快速增长的收入基础，并存在通向显著规模的可信路径；但缺少披露的单位经济、审计财务或任何独立财务覆盖，意味着所有对 Forus 的量化承销都必须在 NDA 下的私人
              data room 完成。TI005 中的 5 项尽调要求，是产出可投资财务模型的最低要求。
