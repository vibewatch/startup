      - number: '5.3'
        title: 安全、合规与监督
        blocks:
          - type: paragraph
            body: >
              Forus 的合规姿态，比多数 Series B 阶段数字健康公司记录得更充分。公司 trust center（security.forus.com，由 SafeBase 提供支持）宣布，Sensiba LLP
              已完成连续两次无保留 SOC 2 Type II 审计：第一次覆盖 2024 年 2 月至 2025 年 1 月（以 Tandem 品牌完成），第三次覆盖 2025 年 2 月至 2026 年 1 月（以
              Forus 品牌完成，未注明例外）。两份报告覆盖 AICPA 信任服务准则：安全性、可用性、处理完整性、保密性和隐私。另有一项截至 2025 年 1 月的已完成审计也被提及。


              Terms of Use（forus.com/tou，最后修改于 2026 年 5 月 12 日）将法律实体识别为「Forus, Inc.」，受管网站为
              withtandem.com（反映正在进行的品牌重塑）。ToU 包含标准 IP 和遵守法律条款，但没有处理医疗特定义务。Privacy Policy（forus.com/pp）是主要的 HIPAA
              相邻公开文件；它覆盖从医疗服务提供方、患者和网站收集的数据类型，但未确认是否存在 Business Associate Agreement 模板、subprocessor 列表或 HITRUST 认证。


              与 Humata Health 相比——后者公开确认 SOC 2 Type II、HIPAA 合规和 HITRUST CSF v9.5.0 r2 认证——Forus 的 HITRUST
              状态无法从公开来源确认。Humata 还列出合规和安全联系人邮箱，而 Forus 的 trust center 是主要公开渠道。


              前文的监管与法律背景仍然重要：


              KFF 调查（2025）和 Stanford AI health-insurance 研究（2026）都提出对 AI 驱动 PA 决策准确性，以及自动拒绝决策中种族 / 社会经济偏差的担忧。Holland &
              Knight 法律分析记录，截至 2026 年 5 月已有 25+ 项州级 AI-in-healthcare 法案。Health Law Program 的联邦 AI
              政策简报（2026）指出，联邦事先授权改革可能压缩 PA 自动化公司运营的行政空间。虽然这些风险适用于整个类别，但 Forus 的具体治理回应——Clinical Intelligence 团队如何监测偏差、申诉
              / 覆盖升级路径是什么，以及是否发布临床决策覆盖率——均未公开披露。


              Change Healthcare 网络攻击（2024 年 2 月，AHA 报道）暴露了集中化医疗 clearinghouse
              架构的系统脆弱性：一次勒索软件事件扰乱了美国医疗市场相当大一部分的理赔处理。Forus 平台位于处方工作流中同样高关键性的位置。其灾难恢复计划、事件响应能力和冗余架构未公开披露。


              已确认的关键合规项：SOC 2 Type II（连续三次审计，无保留意见）。未知的关键合规项：HITRUST 状态；具体 BAA 条款和 subprocessor 列表；uptime SLA 和状态页；覆盖 /
              升级治理；AI 偏差监测；事件响应和灾难恢复文档。
