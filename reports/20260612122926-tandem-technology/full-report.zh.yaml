  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: wide
    summary: 从已确认的证据输入（网络规模、收入锚点、融资），到风险折价因素（集中度、监管、毛利率不透明），再到「观察 / 继续研究」建议以及可将结论推向买入的六个尽调关口。
    approximationNotes: 网络规模和收入锚点由公开来源确认。风险折价因素由分析师依据公开监管和竞争对手证据评估。推荐节点反映基准情景估值分析；若完整 NDA 数据室解决毛利率、NRR 和集中度问题，终端节点可能转为「以 $700M–$1B 买入」。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV022
      - CV030
      - CV033
      - CV034
      - CV040
    data:
      nodes:
        - id: evidence-in
          label: 已确认的证据输入
          detail: 网络：约 80% 美国邮编区域、全部 50 个州；收入：约 $50M 年化（Forbes）；融资：>$160M；合作方：全球前 10 大生物制药中的 5 家。
        - id: strategic-value
          label: 战略价值层（$600M–$1B+）
          detail: 处方路由网络、生物制药商业准入数据资产和对医生免费的护城河，使其成为清算所、付款方或连锁药房现有企业的战略收购目标。
        - id: risk-discounts
          label: 风险折价因素
          detail: 生物制药集中度（未披露）；毛利率不透明；监管重构风险（35+ 项州法案）；Waystar 倍数压缩先例（2026 年 -43.5%）。
        - id: diligence-gate
          label: 六项阻断性尽调事项
          detail: 毛利率、烧钱速度、NRR、合同集中度、BAA / 去标识化治理、清算所冗余——均未公开。
        - id: base-valuation
          label: 基准情景公允价值：$500M–$750M
          detail: 10–15x 过去收入，假设增长 1.5–2x，估算毛利率 55–70%；在基准假设下，$1B 标记估值偏高 30–50%。
        - id: recommendation
          label: 建议：跟踪 / 继续研究
          detail: 以 $1B 进入需要牛市情景得到确认（GM >65%、NRR >105%、合作伙伴更多元）。若二级市场以 $400M–$700M 进入，则有安全边际。NDA 尽调若能解决六个阻断项，结论可能转为买入。
  - id: FV002
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: >-
      截至 2026 年 6 月，Forus 在牛市、基准、熊市三种情景下的估值区间，来自收入锚点（Forbes 披露的年化 $50M）、各情景的增长与倍数假设，以及可比公司区间分析。M&A
      战略退出情景单列为上行期权价值，不纳入独立财务区间。
    approximationNotes: >-
      所有区间均为分析师估算。收入锚点（$50M）为公司经 Forbes 披露，未经审计。倍数来自 Waystar 公开市场 EV/Revenue（4.2x）、私营医疗 AI 成长期区间（10–15x），以及 Abridge
      Series E 的 ARR 倍数（约 53x）。毛利率、NRR 和集中度假设均按情景设定，尚未验证。M&A 溢价估算（DCF 的 2–3x）基于 Change Healthcare 收购先例和 Surescripts
      战略护城河类比，并非具约束力的收购意向。
    claimRefs:
      - CV022
      - CV025
      - CV026
      - CV027
      - CV028
      - CV030
    data:
      items:
        - label: 熊市：独立财务 DCF
          low: 200
          high: 420
          unit: $M
          detail: 收入增长停在 $50M–$70M；采用 4–6x EV/Revenue（参照 Waystar），反映监管压力和集中度风险。较 $1B 标记估值折让 58–80%。
        - label: 基准：私营成长期
          low: 500
          high: 750
          unit: $M
          detail: 基于 $50M 收入采用 10–15x 过去收入；假设年增长 1.5–2x；估算毛利率 55–70%。较 $1B 标记估值折让 25–50%。若二级市场以 $400M–$700M 进入，则增加安全边际。
        - label: 牛市：高增长经济性已确认
          low: 1000
          high: 1500
          unit: $M
          detail: 2027 年前瞻收入 $125M–$150M，采用 8–10x；毛利率 >70% 得到确认；NRR >105% 通过验证；新增 3 家以上生物制药合作伙伴。可支撑以 $1B 或更高估值进入。
        - label: M&A 战略退出（期权价值）
          low: 1500
          high: 2500
          unit: $M
          detail: 战略买家（清算所、支付方、药房连锁）为处方路由网络支付独立 DCF 2–3x 的控制权溢价。该情景不能作为基准承销；它代表战略交易中的非对称上行。
  - id: FV003
    title: 估值敏感性——收入倍数情景
    type: bar
    layout: wide
    summary: >-
      在 Forus 年化收入 $50M 下，五档收入倍数对应的隐含企业价值，倍数从 Waystar 公开市场地板（4.2x）到接近 Abridge 的高增长溢价（30x）。当前披露的 $1B 标记估值对应 20x
      情景。该敏感性展示了投资论点中内嵌的倍数压缩 / 扩张风险。
