      - number: '7.3'
        title: 基础设施与集中度风险
        blocks:
          - type: paragraph
            body: >
              2024 年 2 月 Change Healthcare 勒索软件攻击，是 Forus 最相关的基础设施风险案例。Change Healthcare 每年处理约 15 billion
              笔医疗健康交易，触达三分之一患者记录。ALPHV BlackCat 加密其系统后，连锁反应立刻扩散到全国：74% 的医院报告直接患者护理受到影响，包括医学必要护理的授权延误；94% 报告财务影响；33%
              表示超过一半收入受扰。60% 的机构需要两到三个月才恢复正常运营。AHA 将其称为美国医疗健康史上最重大的网络攻击。


              Forus 的架构暴露在结构上相似。平台依赖付款方清算所 API 和 EHR 集成来路由 PA 提交和处方数据。公开资料没有披露具体清算所关系，因此无法判断 Forus
              使用的是单一供应商清算所路径（集中风险），还是多供应商备用架构（部分缓释）。如果 Forus 路由经过的任何大型清算所遭遇类似 Change Healthcare 的宕机，Forus
              的自动化层就会停止运转——核心服务方价值主张消失，生物制药伙伴也会在上市数据最有价值的时点遭遇处方流数据缺口。


              HIPAA Journal 记录了持续的法律余波，包括 Nebraska Attorney General 针对 Change Healthcare 的诉讼在 2025 年 11
              月驳回动议中存活下来，说明第三方供应商的基础设施失败会产生超出运营中断期的责任。Becker 的报道确认，攻击后部分付款方合同不得不重新谈判。UnitedHealth Group 2025 年 10-K（SEC
              文件）对 Change Healthcare 财务影响给出了最权威披露：数十亿美元补救成本，以及持续监管暴露。映射到
              Forus，就是一次大型清算所故障可能同时损害运营、迫使紧急切换供应商，并触发监管机构审查中断期间的数据处理。
