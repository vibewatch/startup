  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与政策风险
        blocks:
          - type: paragraph
            body: >
              对 Forus 来说，事前授权中的 AI 监管是变化最快的风险维度。Manatt Health 的 2026 年 AI 政策追踪显示，几乎所有州都在积极讨论 AI 立法；超过 25 个州已提出 35
              项以上法案，专门规制付款方在事前授权和理赔审核中使用 AI。已有两部法律通过：Indiana 法（2026 年 7 月 1 日生效）禁止健康险公司在未审阅患者病历的情况下，仅凭 AI 下调理赔编码；要求在不利
              PA 决定中披露 AI 使用；并禁止针对治疗复杂患者的服务方定向下调编码。Utah 法（2027 年 1 月 1 日生效）要求保险公司公开披露是否使用 AI 审核授权申请。


              立法脉络指向同一条监管判断：AI 可以辅助，但不能取代持证人员对不利承保决定的审核。Forus 的核心价值主张是自动化提交
              PA，因此需要叠加一层产品合规：任何触及拒付或下调编码决定的工作流，即便只是数据中介，只要缺少监督记录，都可能被定性为「单独使用 AI」。KFF 证实，截至 2026 年，已有 29 个州在这一议题上实施法律。


              联邦层面的不确定性进一步放大州层面风险。National Health Law Program 警告，Trump 政府的放松监管姿态会威胁事前授权改革势头；Holland and Knight 2026 年 5
              月的评述则确认，州级 AI 监管正加速填补空白。Manatt 还追踪到多个州正在推进 AI 产品责任立法；如果 AI 生成建议导致护理延误，Forus 可能面临民事索赔。FDA 2026 年 1 月修订后的
              CDS 指引带来部分缓释：当临床医生独立审查建议依据时，更多 AI 工具类别不再按医疗器械监管。但安全港被收窄到有记录的医生审核工作流，而 Forus 并未公开描述这一安排。
