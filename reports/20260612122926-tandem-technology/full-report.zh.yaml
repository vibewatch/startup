      - number: '7.5'
        title: 技术与模型风险
        blocks:
          - type: paragraph
            body: >
              Forus 的 AI 模型运行在组合复杂度极高的规则空间里：每一种药物、付款方和药房组合，都可能有不同的事前授权标准、处方集层级、阶梯治疗要求和患者援助项目规则。维护这套规则库，需要由 Dr. Adam
              Harris 和 Kathleen Alvarez, NP 领导的 Clinical Intelligence
              团队持续人工监督；但公开资料没有说明模型多久重训一次、付款方规则在周期中变化时如何发现漂移，或当模型建议与人工审核员判断冲突时有哪些覆盖治理。


              Chambers Healthcare AI 2025 将黑箱问题列为医疗健康 AI 最重大风险之一：模型透明度不足会增加审计难度，使 HIPAA PHI 使用验证变难，并在 AI
              辅助建议导致治疗延误时引发职业责任问题。这并非理论风险：Stanford 2026 年 1 月的一项研究记录，健康保险公司在 PA 审核中使用的 AI 算法错误拒绝了医学必要护理。Foley 律师确认，黑箱 AI
              会显著增加 HIPAA 合规审计难度，因为无法判断哪些 PHI 输入驱动了某个输出。Prosper AI 将模型漂移列为领先技术风险：付款方规则频繁变化，如果不主动重训，基于历史批准数据训练的模型会过时。


              监管技术层面，FDA 2026 年 1 月修订后的 CDS 指引只在临床医生独立审查建议依据时，才为 AI 临床决策支持工具提供安全港；Forus 的全自动 PA
              工作流若缺少额外文档，可能并非所有用例都满足这一条件。KFF 记录了 29 个州已有或待定的 AI PA 监督法律，共同形成碎片化合规义务，放大治理表面积。Humata Health 和 Infinitus AI
              等竞争对手发布的安全与合规文件，比 Forus 信任中心更细；这引出一个问题：Forus 的合规姿态能否满足医疗系统规模下的企业级采购标准。Forus
              的使用条款包含把风险转移给服务方的责任限制条款，这种做法可能在与成熟买方的企业合同谈判中制造摩擦。
