      - number: '6.4'
        title: 留存、耐久性与集中度风险
        blocks:
          - type: paragraph
            body: >
              Forus
              的客户故事存在显著证据缺口，限制了对留存耐久性和集中度风险评估的信心。净留存率（NRR）、总留存率（GRR）、医疗服务提供方流失率、生物制药续约率或任何队列数据均未公开披露。医疗服务提供方采用连续两年同比增长
              10x，与早期快速采用一致，但不能说明早期队列是否留存、扩张或流失。对生物制药而言，2026 年上半年 5x 收入台阶可能来自现有伙伴关系的深度扩张，也可能来自新增伙伴；这一区分会实质影响收入质量评估。


              具名客户标识仍局限于少数专科诊所。尽管公司称覆盖「数千家」诊所和「全美 50 个州的医疗系统」，截至 2026 年 5 月公告，公开点名的参考客户只有 5 家专科诊所和 1 家
              GPO。任何公开文件中都没有点名医院系统、学术医疗中心或大型医疗系统作为参考客户。同样，任何新闻稿、投资者博客或案例研究中都没有出现制药公司名称。这个可参考性缺口对尽调很重要：潜在企业客户、投资者和收购方，如果没有
              Forus 协助，就无法通过与具名账户的参考访谈独立验证采用主张。


              截至报告日，在独立评论平台（G2、Capterra、KLAS Peer Reviews）搜索 Forus 或 Tandem Technology，未发现公开评论或评分。5 个具名客户案例研究均由 Forus
              自行撰写并发布，形成公司来源证据固有的利益冲突：不满意客户不太可能出现在公司撰写的内容中。


              医疗系统和生物制药客户还会施加额外采购摩擦。医疗系统在部署 AI 辅助处方自动化工具前，通常要求 HIPAA 商业伙伴协议（BAA）、IT 安全审查（SOC 2、HITRUST
              或等同认证）、指导委员会批准、EHR 厂商认证审查和临床工作流验证——流程可能耗时 6–18 个月。Forus 连续三次无保留 SOC 2 Type II 审计解决了安全信任门槛，但公司未公开声称 HITRUST
              认证，这可能限制其对合规要求更严的企业级医疗系统的吸引力。


              生物制药合作伙伴面临具体隐私与数据治理担忧。Forus 汇总跨药品、付款方和开方者的处方启动数据，因此每个生物制药伙伴都必须评估，共享网络数据是否会给自身处方表现数据带来披露风险。反垄断审查也相关：如果多个
              top-10 生物制药公司共享 Forus 处方流数据资产的访问权，平台内竞争信息隔离会成为问题。没有公开文件说明 Forus 如何在生物制药伙伴之间构造数据隔离。


              AMA 2024 事先授权医生调查记录，35% 医生报告与 PA 延误有关的严重不良事件，61% 担心未受监管的 AI 被用于增加拒绝——这说明，医疗服务提供方采用任何 AI 辅助 PA
              工具都需要持续建立信任，监管环境也可能提高对 AI 内嵌处方自动化的整体审视，而不只是付款方侧工具。
