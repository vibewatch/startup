    rows:
      - - 医疗服务方免费、由生物制药出资的模式
        - IRA 返利改革和 Medicaid GENEROUS 定价模型压缩生物制药商业预算；药企 hub 支出下降；如果没有医疗服务方收入作为后备，Forus 的资金来源会变弱
        - 高
        - HHS 发布 2026 年 GENEROUS Medicaid Model；IRA Part D 重设计正在推进；Cardinal Health hub 报告显示药企 hub 策略正在重新评估
        - 建模 Forus 收入对生物制药商业预算削减 10–20% 的敏感性；核验 Forus 是否有收入多元化或后备定价；查看 hub 合作伙伴财务数据，寻找早期信号
      - - 端到端工作流范围（授权 + 可负担性 + 路由）
        - EHR 厂商（Epic、Oracle Health）把原生 PA 模块扩展到可负担性和专科药房路由；不需要第三方厂商关系，就会消除 Forus 在工作流范围上的差异
        - 高
        - Epic App Orchard 和 Oracle Health 正在扩展临床工作流工具；Epic 原生 PA 模块已经嵌在医疗体系工作流中；EHR 原生扩展不需要增量采购
        - 审查 Epic 和 Oracle Health 的 PA 路线图；盘点 Epic App Orchard 中竞争性 PA 和可负担性应用；调研医疗体系 CIO 对 EHR 厂商 PA 扩展计划的看法
      - - CoverMyMeds 网络集中度（约 90% e-PA 份额）
        - CoverMyMeds 的网络地位占优，付款方和 PBM 默认走 CoverMyMeds 路由；除非 Forus 能匹配或超过 CoverMyMeds 的付款方连接能力，否则 Forus 只是叠加层，不是替代品
        - 高
        - Optum Rx、Surescripts 和主要 EHR 都把 CoverMyMeds 称为默认路由基础设施；独立市场指南显示其约占 90% e-PA 交易量
        - 判断 Forus 是通过 CoverMyMeds 路由（互补）还是绕开它（替代）；评估付款方连接广度相对 CoverMyMeds 的差距；索取 Forus 付款方覆盖地图和电子 PA 提交率
      - - AI 能力（政策匹配、临床打包）
        - AI 功能正在商品化：已有 10+ 家厂商实现 AI-PA；AI 变成入场配置后，Humata 等公司会削弱 Forus 针对 AI 的差异化主张
        - 中
        - Neon Health 2026 指南列出 10+ 家 AI-PA 厂商；Humata 披露 96% 首次通过审批率，与 Forus 主张可比；Myndshft 等也在切同一工作流
        - 核验 Forus 大规模自有付款方政策和审批数据，是否能在商品化模型能力之外构成持久 AI 护城河；在 NDA 下索取模型架构和训练数据来源
      - - 厂商集中 / 单点故障风险
        - 如果 Forus 基础设施发生网络安全事件，生物制药药品上市工作流和医疗服务方 PA 处理会大规模中断，损害集中度类似 Change Healthcare 停摆
        - 中
        - AMA 调查：Change Healthcare 停摆期间，80% 诊所收入受损；Forus 大规模处理处方可及性数据；HITRUST 认证未获公开确认
        - 核验 Forus 基础设施冗余和灾难恢复状态；确认 HITRUST 认证是否在推进；审查处理 PHI 和生物制药数据流的安全架构
      - - 多平台并用常态化
        - 医疗服务方同时使用多个 PA 工具，会限制 Forus 捕获完整处方流数据的能力，并削弱网络效应护城河
        - 中
        - Neon Health 2026 指南明确把多平台并用常态化，建议不同利益相关方使用不同平台；医疗服务方没有动力集中到单一 PA 厂商
        - 评估 Forus 的 EHR 嵌入排他条款；判断多平台并用是否稀释 Forus 的数据质量或数据量；评估生物制药厂商是否要求排他路由承诺
