        - Forus 在可及性确认后自动把处方路由到最优药房；患者收到短信，包含药房名称和预计可取时间
        - 官网患者短信示例确认有药房路由确认消息
        - 是否存在并披露与特定药房的首选路由安排；路由逻辑透明度
      - - 全流程告知患者进展
