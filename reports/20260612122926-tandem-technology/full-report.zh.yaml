      - number: '6.2'
        title: 具名客户证明与结果
        blocks:
          - type: paragraph
            body: >
              Forus 在其博客发布了 5 个具名医疗服务提供方案例研究，每个案例对应一个不同专科分层，并记录具体运营结果。这些案例研究是现实生产部署的主要公开证据，但全部由 Forus
              撰写，未经过独立佐证或审计。即便如此，它们具名、具体且结果丰富，证据标准高于单纯标识列表。


              Goodman Dermatology（10 个地点，35+ 医疗服务提供方，Georgia）报告称，此前在其他诊所无法获批的患者，通过 Forus 通常在 2–3 天内成功获批。Goodman 医生亲自把
              Forus 推荐给 AQUA Dermatology——Goodman 所属的更大平台——随后整个 AQUA 组织采用 Forus。这一连锁采用，是 Forus 公开记录中最大的客户扩张事件。


              Optima Dermatology 在采用 Forus 后清理了 500+ 个未完成任务积压，现在在处方写下当天即启动所有事先授权。创始医生 Dr. Scott Guenthner
              将推出过程描述为对临床医生透明；Cleveland 皮肤科医生 Dr. Gregory Delost 确认实施「完全顺畅」。


              MedicoCX GPO（300+ 家独立诊所，主要是过敏科）由 Director Briana O'Dwyer 管理，将团队与付款方通话时间从工作日的 60–70% 降至低于 15%，并把 Forus
              嵌入新诊所的标准导入流程。该 GPO 在选择 Forus 前花了 3 年评估替代方案。


              Digestive Health Specialists（20+ 名 GI 开方者）的生物制剂协调员 Ashley Flowers 在采用 Forus 后，将每日 PA 吞吐量从约 5 个完整处理的 PA 提高到
              15–30 个，形成 3–6x 的台阶式改善。


              General Catalyst 的投资博客描述了一个未具名医疗服务提供方集团：PA 周转时间从超过 7 天降至中位数 1.1 天，护理行政工作量减少 70%——这是公开文件中最具体的结果指标，来源于 GC
              尽调，而不是审计研究。


              5 个 Forus 博客案例研究均发表于 2025 年 12 月至 2026 年 3 月之间，并包含具名管理员、医生和协调员的直接引语——这增加了真实性，但不构成独立第三方验证。
