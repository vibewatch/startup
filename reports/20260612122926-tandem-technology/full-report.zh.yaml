  - id: FI001
    title: 收入模式桥
    type: flow
    layout: wide
    summary: 服务商网络活动如何转化为 biopharma 付费收入和估计毛利。
    approximationNotes: >-
      终端节点的收入和毛利估计，是分析师根据公开 Forbes 数据（2025 年底 $10M，2026 年中年化约
      $50M）和可比数字医疗毛利率基准（65–80%）推断得出。没有经审计财务数据。节点标签反映机制，而不是已验证美元数值；明确标注由公开数据支撑的除外。
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI005
    data:
      nodes:
        - id: providers
          label: 服务商网络（免费）
          detail: 数千家诊所和医疗系统；覆盖美国全部 50 个州；约 80% 美国邮编区域。向医生和患者零收费。
        - id: workflow
          label: PA + 可负担性 + 药房路由（自动化）
          detail: 每张处方都会触发 PA 提交、处方集核查、PAP 登记、药房路由和患者短信，全部嵌在 EHR 流程里自动完成。
        - id: data-asset
          label: 第一方处方流数据
          detail: 实时结果数据包括 PA 批准 / 拒绝、处方集例外、依从性信号和处方医生行为。每笔交易都会继续累积。
        - id: biopharma-engagement
          label: 生物制药商业准入合作
          detail: 全球前 10 大生物制药公司中已有 5 家付费，用于加速上市、在决策点触达处方医生网络和获取数据分析。这是主要收入驱动项。
        - id: revenue
          label: 收入（约 $50M 年化，2026 年中）
          detail: 年化收入按 Forbes 口径估算（2025 年末 >$10M；到 2026 年 5 月约增长 5 倍 = 约 $45–55M）。全部来自生物制药侧；医生侧零收入。
        - id: gross-profit
          label: 估计毛利（65–80% 毛利率假设）
          detail: 分析师估计：在 $50M 收入和 65–80% 毛利率下，年化毛利为 $30–44M，参照数字健康数据平台可比公司。未经验证；无公开披露。
  - id: FI002
    title: 单位经济桥
    type: flow
    layout: wide
    summary: 从医生采用（免费、零 CAC）到数据资产累积，再到生物制药合同价值和毛利经济性的逻辑链条。
    approximationNotes: 量化节点均为分析师基于公开基准（CAQH、AMA、Linear Health、hub 市场报告）作出的估计。Forus 未公开具体合同金额、毛利率和 CAC。带问号的节点代表未知的私有指标。
    claimRefs:
      - CI010
      - CI011
      - CI013
      - CI014
      - CI016
    data:
      nodes:
        - id: provider-adoption
          label: 医生采用（CAC 约 $0）
          detail: 对医生免费的模式消除了预算摩擦。AMA 数据：诊所每周在 PA 上耗费 13 个员工小时，每笔价值 $20–35；Forus 以零医生成本捕获这部分 ROI。
        - id: pa-volume
          label: PA 量 + 参与信号
          detail: 每处理一笔 PA，处方流数据资产就增加一份。CAQH 2024：人工 PA 成本 $11.58，电子 PA 成本 $2.17；自动化每次节省 $9.41。数千家诊所汇总后，数据规模形成自有资产。
        - id: data-value
          label: 数据资产价值
          detail: 围绕结果、处方集动态和处方医生模式的匿名化第一方数据。网络覆盖越广，价值越呈非线性上升（覆盖 80% 美国邮编区域）。
        - id: deal-size
          label: 生物制药合同价值（估计 $8–15M / 合作方）
          detail: 按 5 家合作方支撑 $50M 运行率推算。基准：传统 hub 供应商合同为 $500K–$5M / 药品；规模化的一体化准入 + 数据可获得溢价定价。
        - id: gross-economics
          label: 毛利经济性（毛利率未知）
          detail: 主要 COGS：EHR 集成、付款方 API 连通、临床规则维护、企业销售运营。毛利率未知；数据平台 / SaaS 类比基准为 65–80%。
  - id: FI003
    title: 财务估计区间
    type: range
    layout: wide
    summary: 关键财务指标的来源支持区间或基准推导区间。低 / 高边界对应保守与乐观假设；均未经审计财务验证。
    approximationNotes: >-
      收入边界来自 Forbes（2025 年末 $10M 下限，约 6 个月内约增长 5 倍 = 2026 年中约 $45–55M 区间）。毛利率边界来自可比数字健康数据平台。烧钱速度边界来自纽约员工数基准（100 名
      FTE，完全负担成本 $150–250K，加上管理费用）。现金跑道边界按估计现金（假设剩余 $60–140M）除以烧钱区间计算。除累计融资和估值外，所有指标都是分析师估计；Forus 未披露这些数字。
    claimRefs:
      - CI019
      - CI020
      - CI021
      - CI022
      - CI023
      - CI024
    data:
      items:
        - label: 年化收入 — 2025 年末
          low: 8
          high: 12
          unit: $M
          detail: Forbes：年化收入「到年末超过 $10M」。低值取「超过」的保守解读；高值给出温和上行空间。
        - label: 年化收入 — 2026 年中（运行率）
          low: 40
          high: 60
          unit: $M
          detail: Forbes：「今年以来大约增长 5 倍」。中点为 $10M × 5 = $50M；区间反映「大约」的不精确性。
        - label: 累计融资
          low: 160
          high: 165
          unit: $M
          detail: 官方公告称「融资 $160M」。高值考虑可能存在四舍五入或未披露批次。
        - label: 最近一轮估值
          low: 900
          high: 1100
          unit: $M
          detail: Forbes 称「$1 billion 估值」。区间反映精度不确定性（投后与投前；四舍五入）。
        - label: 估计年度现金消耗
          low: 18
          high: 35
          unit: $M/yr
          detail: 100 名纽约 FTE × $150–250K 完全负担成本 = $15–25M + 管理费用。低值对应精简运营模式；高值对应激进增长招聘。
        - label: 估计现金跑道（自公告日起）
          low: 4
          high: 8
          unit: years
          detail: 估计现金（$60–140M）÷ 烧钱速度（$18–35M/yr）。宽区间反映不确定性叠加。不假设盈利性增长抵消烧钱。
  - id: FI004
    title: 资本强度 / 现金流图
    type: flow
    layout: wide
    summary: $160M+ 融资资本如何穿过 Forus 成本结构，转化为生物制药收入和净现金位置。
    approximationNotes: 除标注「公开来源确认」外，节点美元值均为估计。公司没有公开经审计的现金流量表。节点大小为方向性 / 定性判断。
    claimRefs:
      - CI019
      - CI020
      - CI025
      - CI026
      - CI027
    data:
      nodes:
        - id: capital-raised
          label: '>$160M 融资（已确认）'
          detail: >-
            种子轮（约 $7M）+ Series A（约 $30M）+ Series B（约 $100M）+ 其他批次。投资方：Thrive Capital、General Catalyst、Accel、Bain Capital
            Ventures、Redpoint、BoxGroup、Pear VC。
        - id: headcount-opex
          label: 约 100 名纽约 FTE（主要 OpEx）
          detail: 按纽约市场薪酬估算，现金薪酬为 $15–25M/年。单一办公室；没有制造类 COGS。这是最大成本中心。
        - id: infra-integrations
          label: EHR + 付款方基础设施
          detail: EHR 集成中间件、付款方 API 连通（所有付款方、所有药品）、数据处理。估计固定成本随增长的交易量摊薄。
        - id: enterprise-sales
          label: 生物制药企业销售
          detail: 增长支出：企业销售团队瞄准全球前 20 大生物制药公司；按药品上市做临床导入。10–20 人企业销售组织估计每年 $2–5M。
        - id: revenue-inflow
          label: 生物制药合同收入（约 $50M 年化）
          detail: 主要现金流入来自上市费用、数据访问和分析。按 Forbes 口径，从 2025 年末 $10M 增至 2026 年中约 $50M。医生或患者零收费。
        - id: net-position
          label: 净现金位置（未披露）
          detail: 未公开报告。估计年度净现金消耗：$18–35M OpEx 减去约 $50M 收入 = 以当前规模看可能转正，但合同现金回款的毛利率和时点未知。
  - id: FE001
    title: 产品架构图
    type: stack
    layout: wide
    summary: Forus 平台从 EHR 触发到生物制药数据输出的分层架构。各层为分析师基于公开来源的刻画；内部技术栈细节未公开披露。
    approximationNotes: >-
      技术栈层级依据官方产品描述、竞争对手基准（Waystar 开发者门户、Humata 技术页、Optum AI 药房文章）和标准医疗 IT 集成模式推断。Forus
      未发布技术文档。层级标签和组成部分是在公开证据下最站得住脚的刻画；具体供应商选择（例如已认证的 EHR 系统、SMS 服务商、云基础设施）尚未确认。
    claimRefs:
      - CE008
      - CE009
      - CE010
      - CE011
      - CE013
    data:
      layers:
        - id: biopharma-layer
          label: 生物制药触达与数据层
          detail: 顶层：第一方处方流数据供给生物制药商业准入合作。主要收入来源。去标识化方法未披露。
          sublayers:
            - id: data-asset
              label: First-Party Prescription-Flow Data Asset
              detail: >-
                Anonymized PA outcomes, formulary overrides, adherence signals, prescriber behavior. Basis of biopharma
                commercial access revenue. De-identification method not disclosed.
            - id: biopharma-analytics
              label: Biopharma Analytics and Commercial Access Reporting
              detail: >-
                Drug launch optimization, prescriber-network access, commercial analytics sold to biopharma partners.
                Five top-10 biopharma customers as of May 2026.
        - id: intelligence-layer
          label: AI 与临床智能层
          detail: 人在回路的智能层：内部临床团队维护付款方规则库并监督 AI 推理；AI 自动完成模式匹配和表单生成。
          sublayers:
            - id: clinical-intelligence
              label: Clinical Intelligence Team (Adam Harris, MD; Kathleen Alvarez, NP)
              detail: >-
                In-house clinical experts maintaining payer-rule library, specialty PA nuance, and product QA.
                Human-in-the-loop model—not autonomous clinical AI.
            - id: rules-engine
              label: Policy and Rules Engine
              detail: >-
                Continuously updated database of payer step-therapy criteria, formulary rules, and clinical PA
                requirements. Core defensibility asset; update cadence not disclosed.
            - id: ai-inference
              label: AI Inference Engine (type not disclosed)
              detail: >-
                Automates form field population, denial classification, appeal drafting. Model architecture, training
                data, evaluation metrics, and hallucination governance not public.
        - id: workflow-layer
          label: 工作流自动化层
          detail: 核心运营层：自动完成 PA 提交、申诉、可负担性登记、药房路由和患者 SMS，医生侧零成本。
          sublayers:
            - id: pa-submission
              label: PA Form Generation and Submission
              detail: >-
                Extracts clinical data from EHR prescription; maps to payer-specific PA form; submits electronically.
                Covers all payers and drugs per official description.
            - id: appeals
              label: Appeals Automation
              detail: >-
                Classifies denial reason; generates appeal letter from clinical record and payer criteria; tracks
                overturn status.
            - id: affordability
              label: Patient Affordability Enrollment
              detail: >-
                Identifies PAP/co-pay card eligibility; auto-enrolls patient in manufacturer assistance programs at
                point of prescribing.
            - id: pharmacy-routing
              label: Pharmacy Routing
              detail: >-
                Routes prescription to optimal pharmacy post-approval; sends patient confirmation text with pickup
                details.
            - id: patient-sms
              label: Patient Communication (SMS)
              detail: >-
                Proactive text updates at each workflow stage. PHI handling in SMS not documented; carrier/SLA not
                disclosed.
        - id: integration-layer
          label: 集成与连接层
          detail: 底层：把 Forus 连接到 EHR 系统、付款方、药房和临床决策支持合作伙伴。具体集成未公开记录。
          sublayers:
            - id: ehr-connectors
              label: EHR Connectors (specific systems not confirmed)
              detail: >-
                FHIR R4 / HL7 v2 / SMART on FHIR likely; Epic, Cerner, Athena possible—none confirmed publicly. No
                developer portal or API docs published.
            - id: payer-connectivity
              label: Payer Connectivity
              detail: >-
                Direct payer APIs, clearinghouse, X12 EDI/NCPDP routing. Da Vinci CRD/DTR/PAS FHIR IG possible given CMS
                mandate timeline.
            - id: openevidence-api
              label: OpenEvidence API Integration
              detail: >-
                Partnership announced April 2026. Connects clinical decision support (1M+ consultations/day) to Forus
                prescription initiation and access automation.
            - id: pharmacy-network
              label: Pharmacy Network (SureScripts likely)
              detail: e-Prescribing and pharmacy routing. Specific dispensing network partnerships not disclosed.
  - id: FE002
    title: 客户工作流 / 运营流
    type: flow
    layout: wide
    summary: 从临床决策到患者开始治疗的端到端处方准入流程，展示 Forus 自动化在哪些环节替代人工步骤。
    approximationNotes: >-
      流程步骤来自 forus.com 官方产品描述、公司博客中的医生证言、OpenEvidence 合作公告和 BusinessWire
      融资新闻稿。步骤标签代表已确认的产品行为；自动化辅助与人工流程的时间估计基于医生证言，并非独立验证基准。
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
      - CE005
      - CE006
    data:
      nodes:
        - id: clinical-decision
          label: 临床决策（临床医生）
          detail: 临床医生在 EHR 中确定最佳治疗方案。该决策可能参考 OpenEvidence 临床决策支持（美国每日 1M+ 次咨询）。Forus 不影响临床决策。
        - id: ehr-prescription
          label: EHR 处方录入
          detail: 临床医生在原生 EHR 工作流里开具处方。Forus 已嵌入其中，不需要另开门户或工具。
        - id: forus-trigger
          label: Forus 自动识别 PA 要求
          detail: 平台拦截医嘱，对照付款方规则判断 PA 要求，并自动启动准入工作流。检测准确率未披露。
        - id: pa-submission
          label: PA 表单自动生成并提交
          detail: 临床数据映射到付款方特定 PA 标准；表单以电子方式提交。覆盖所有付款方和药品。员工不需要手动填写表单。
        - id: payer-review
          label: 付款方审核
          detail: 付款方评估 PA 请求。决策时限：按 2026 年 1 月生效的 CMS-0057-F2 互操作性规则，紧急 72 小时 / 标准 7 个日历日。
        - id: pa-approved
          label: PA 批准 → 药房路由
          detail: 批准后，Forus 将处方路由到最优药房（零售、专科、邮寄）。患者收到确认短信。
        - id: pa-denied
          label: PA 拒绝 → 自动申诉
          detail: Forus 对拒绝原因分类，根据临床记录自动生成申诉并重新提交。员工不需要手写申诉。
        - id: affordability-check
          label: 可负担性登记（并行）
          detail: 在处理 PA 的同时，Forus 核查 PAP / 共付卡资格；若费用构成障碍，则自动为患者登记药企援助项目。IRA 限制可能影响部分药品。
        - id: patient-text
          label: 患者状态更新（SMS）
          detail: 每个交接点都会主动向患者发短信：保险决定、药房路由、可取药状态。减少诊所来电。SMS 中 PHI 的处理方式未公开记录。
        - id: therapy-start
          label: 患者开始治疗
          detail: 终态：处方已配药、患者已获知、治疗已开始。Forus 跟踪状态，便于诊所掌握进度。官方称每年支持数百万患者。
  - id: FE003
    title: 关键依赖图
    type: dag
    layout: wide
    summary: Forus 平台运行的关键依赖：EHR 厂商、付款方连接、监管框架、临床知识和生物制药商业关系。
    approximationNotes: 依赖关系为分析师依据官方产品描述、竞争对手基准和医疗 IT 常规推断。Forus 未发布技术架构文档。依赖关键性评级基于产品范围和故障模式分析作出的分析师判断。
    claimRefs:
      - CE008
      - CE009
      - CE010
      - CE014
    data:
      nodes:
        - id: forus-platform
          label: Forus 平台
          detail: 中心节点：端到端处方准入自动化需要所有依赖同时成立。
        - id: ehr-vendors
          label: EHR 厂商（Epic、Cerner、Athena 等）
          detail: 必须将 Forus 认证为获批集成。具体 EHR 认证未披露。Epic App Orchard 批准是多数大型医疗系统部署的关口。
        - id: payer-apis
          label: 付款方 API / 清算所
          detail: 电子 PA 提交需要付款方连通。CMS 互操作性规则要求到 2027 年提供 API 访问。当前连接名单未披露。
        - id: clinical-intelligence
          label: 临床智能团队
          detail: Adam Harris, MD + Kathleen Alvarez, NP + 团队。维护付款方规则库。存在关键人依赖；无公开继任文件。
        - id: biopharma-partners
          label: 生物制药商业合作方（前 10 大中的 5 家）
          detail: 可产生收入的关系。集中度风险未知。合同期限和续约结构未公开。
        - id: openevidence
          label: OpenEvidence（临床决策支持）
          detail: 上游集成把循证处方连接到准入自动化。合作于 2026 年 4 月宣布；美国每日 1M+ 次临床咨询。
        - id: pharmacy-network
          label: 药房网络
          detail: 路由需要连接零售、专科和邮寄药房。可能使用 SureScripts 电子处方网络。具体合作未确认。
        - id: cms-regulation
          label: CMS / 监管框架
          detail: CMS-0057-F2 要求付款方到 2027 年 1 月提供 PA API——这是结构性顺风。各州 AI-in-PA 立法（2026 年 5 月 H&K 统计 25+ 项法案）可能要求披露或调整监督。
        - id: cloud-infrastructure
          label: 云基础设施 / 安全
          detail: 已获 SOC 2 Type II 认证（三次干净审计）。云服务商未披露。灾备和冗余架构未公开。
      edges:
        - from: ehr-vendors
          to: forus-platform
          label: 集成前置条件
        - from: payer-apis
          to: forus-platform
          label: PA 提交路径
        - from: clinical-intelligence
          to: forus-platform
          label: 规则库 + QA
        - from: biopharma-partners
          to: forus-platform
          label: 收入 + 数据买方
        - from: openevidence
          to: forus-platform
          label: 上游转介
        - from: pharmacy-network
          to: forus-platform
          label: 履约路由
        - from: cms-regulation
          to: forus-platform
          label: 监管顺风 / 风险
        - from: cloud-infrastructure
          to: forus-platform
          label: 托管 + 安全
  - id: FE004
    title: 产品成熟度 / 能力图
    type: matrix
    layout: wide
    summary: Forus 与主要竞争对手在端到端处方准入自动化五个维度上的能力成熟度对比。评级仅为基于公开证据的分析师评估。
    approximationNotes: >-
      能力评级（高 / 中 / 低 / 未知）是分析师根据公开产品描述、案例研究、开发者门户和信任页面作出的评估。没有独立基准或头对头比较。Forus 相关评级在证据仅限营销文案时取保守口径。竞争对手评级基于 Waystar
      开发者门户、Humata 技术 / 安全页面、Infinitus 资源和 Optum Rx AI 药房文章。
    claimRefs:
      - CE021
      - CE022
      - CE023
      - CE024
      - CE025
    data:
      columns:
        - Forus
        - Waystar
        - Humata
        - Infinitus
        - Optum ePA
      rows:
        - label: PA 自动化覆盖
          values:
            - 高 — 所有药品、付款方、药房；所有专科；美国全部 50 个州；嵌入 EHR，医生零成本
            - 高 — 完整 RCM 平台中的 PA 模块；REST/HL7/EDI API；医生侧付费平台
            - 高 — 首次通过批准率 96%；授权触点减少 45%；HITRUST 认证；付费平台
            - 中 — 通过语音 AI（电话）跟进 PA；福利核验；不是嵌入 EHR 的 PA 提交
            - 中 — 在 Optum Rx 处方集内很强；局限于 Optum 对齐的计划；由保险方控制
        - label: 患者可负担性登记
          values:
            - 高 — 开方时自动完成 PAP 和共付卡登记；由药企出资；模块已确认
            - 低 — 主要是收入周期；公开材料未描述可负担性登记模块
            - 低 — 聚焦 PA 自动化；没有公开的可负担性登记模块
            - 中 — 通过语音智能体监控共付卡状态并跟进患者可负担性
            - 低 — PA 提交工具；未描述独立可负担性登记
        - label: EHR 工作流嵌入度
          values:
            - 高 — 嵌入原生 EHR 工作流；无需单独门户；医生证言已确认；EHR 认证未公开
            - 高 — 开发者门户提供 REST/HL7/EDI；集成模式有公开文档；SMART on FHIR
            - 高 — 技术页确认自有 API 和 HL7/FHIR 标准集成
