      - number: '1.3'
        title: 融资历史与资本形成
        blocks:
          - type: paragraph
            body: >
              Tandem Technology 在 2023 年完成约 $7 million 种子轮，早期投资方包括 Pear VC 和 Thrive Capital；CityBiz 报道称，公司是在 Thrive
              Capital 办公室里创立的。Pear VC 确认其在 2023 年种子轮投资，最初通过 Oscar Health 联合创始人 Mario Schlosser 等关系发现 Jaggi。随后，General
              Catalyst 在 2024 年领投约 $30 million 的 Series A，Accel 和 Thrive 参投。


              2026 年 1 月 26 日，Bloomberg News 报道称 Tandem Technology 正由 Accel 领投融资 $100 million，估值 $1 billion；此前累计融资约 $137
              million。PYMNTS 和其他媒体确认了这条报道；公司当时未回应置评请求，该轮也被描述为尚未公开宣布。2026 年 1 月报道中的数字（$100M 轮次、$137M 累计）与 2026 年 5 月公告（累计
              $160M）存在张力，说明 1 月数字可能只是未完成或中期口径，之后被上调；也可能是该轮交割前又加入了额外资本。


              2026 年 5 月 12 日，Forus 公开宣布累计融资超过 $160 million，投资方包括 Thrive Capital、General Catalyst、Accel（各自领投过不同轮次），以及
              Bain Capital Ventures、Redpoint、BoxGroup 和 Pear VC。公告还确认公司估值达到 $1
              billion，成为独角兽。公司未披露债务融资、老股交易或收入分成融资安排。Forbes 报道称，到 2025 年底公司年化收入已超过 $10 million，2026 年年化口径超过 $50
              million，同比约增长 5x；增长由新的 biopharma 商业化合作和服务方自然增长拉动。
