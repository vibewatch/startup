  - id: FM001
    title: 市场规模分层金字塔——从药品总支出到 Biopharma 商业预算
    type: pyramid
    layout: wide
    summary: 四层嵌套市场，从最宽口径（美国药品总支出）到最具体口径（biopharma hub / 商业支出），展示 Forus 可触达市场如何嵌在更宽市场之内。
    data:
      nodes:
        - id: layer1
          label: 美国处方药总支出
          detail: 2026 年预计 >$1 trillion（ASHP）；2025 年增长 12.7%
        - id: layer2
          label: 专科药支出
          detail: 约 $263B（占处方药总额 54%；处方量 <5%）；FDA 批准自 2012 年以来每年增长约 3%
        - id: layer3
          label: PA 负担专科处方（高 PA 专科药）
          detail: 生物制剂、精准肿瘤、罕见病；按价值看占专科药支出多数
        - id: layer4
          label: 存在放弃 / 未履约风险
          detail: 说明性上限约 $13B（5% 放弃率 × $263B 专科药）；82% 医生称 PA 导致治疗放弃
        - id: layer5
          label: Biopharma Hub / 商业上市预算
          detail: 历史估计 $3–6B（未获 2026 年佐证）；Forus 的直接商业市场；Cardinal Health 2026 称 hub 策略正在主动重估
    approximationNotes: 所有数值均为二手来源近似值（ASHP、CAQH、PMC/Tufts）。Hub 市场估计被标记为低置信度。金字塔为概念框架；没有额外数据时，各层不能按算术关系嵌套。
    claimRefs:
      - CM008
      - CM010
      - CM011
      - CM014
      - CM035
  - id: FM002
    title: 市场估算区间——PA 自动化机会
    type: range
    layout: standard
    summary: 美国预授权自动化节省机会的低 / 基准 / 高估计，展示不同范围定义带来的区间差异。
    data:
      items:
        - label: PA 直接交易成本节省（CAQH 窄口径）
          low: 0.05
          mid: 0.055
          high: 0.06
          unit: $B/year
          detail: CAQH CEO 估计；仅含交易成本；不含医生时间和药品收入影响
        - label: 更宽医疗行政中的 PA 行政节省（CAQH 2025）
          low: 16.4
          mid: 18.7
          high: 21
          unit: $B/year
          detail: 低 = 2023 CAQH 基线；基准 = 2025 CAQH 估计；高 = 全电子化情景（ViVE 2026）
        - label: 存在风险的专科药未履约收入（说明性）
          low: 5
          mid: 13
          high: 26
          unit: $B/year
          detail: 低 = 2% 放弃率 × $263B 专科药；中 = 5% 假设；高 = 10%；均为说明性——没有可验证因果率
    approximationNotes: >-
      PA 直接节省来自 CAQH ViVE 2026 访谈；更宽行政节省来自 CAQH 2025 Index 和 ViVE 访谈。未履约数据由模型推导，未获独立验证；它们代表通过降低 PA 摩擦可为 biopharma
      找回收入的理论上限。
