        - Forus 根据临床记录和付款方标准自动生成申诉；重新提交；在仪表板跟踪状态
        - 申诉自动化被描述为核心模块；Goodman Dermatology 案例研究显示，此前无法获得治疗的患者，其拒付问题得到解决
