      - number: '7.2'
        title: 隐私、HIPAA 与数据权利风险
        blocks:
          - type: paragraph
            body: >
              Forus 处理受保护健康信息（PHI），处在三条高度监管的数据流交汇处：来自 EHR 系统的临床处方数据、付款方资格与承保数据，以及患者人口统计和福利登记数据。Foley and Lardner 2025 年
              5 月的指引明确指出，AI 参与并不会改变 HIPAA 的核心规则：PHI 只能为允许目的被访问、使用和披露；最低必要标准适用于每一个 AI 工具；任何处理 PHI 的 AI 供应商都必须纳入 Business
              Associate Agreement，并加入针对 AI 的条款，覆盖模型训练数据、留存、分包商链条和泄露通知。


              Forus 的公开隐私披露（forus.com/pp）承认 BAA 结构，但没有说明 Forus 与哪些具体受监管实体类别签署 BAA，也没有说明其 AI 模型是否被排除在患者 PHI
              训练之外，或在数据被转用于生物制药分析时采用哪一种去标识化标准。这个缺口很关键：生物制药商业合作依赖可合法共享的数据；去标识化做法不透明，就无法判断 Forus 是否符合 HIPAA 的 Safe Harbor
              或 Expert Determination 标准。


              财务代价很高。IBM Security 的 2025 年《数据泄露成本报告》显示，医疗健康数据泄露平均每起造成 $7.42 million 损失，连续第十四年位居所有行业之首；医疗健康泄露的平均控制时间为 279
              天。OCR 已将 HIPAA Security Rule 最终定稿列入 2026 年监管议程，可能要求年度安全风险评估和 24 小时泄露报告。Gartner 预计，到 2026 年，60%
              的医疗健康机构计划建立正式 AI 治理项目；其余 40% 的风险暴露会继续上升。Forus 的信任中心提到 SOC 2 证明，但没有披露 Type II 日期或审计方。Humata Health 和
              Infinitus AI 等竞争对手发布了更细的合规文件，这可能在企业级医疗系统采购中制造摩擦。
