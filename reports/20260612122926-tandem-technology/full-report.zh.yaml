        - 顺风
        - 持续；专科药物批准量每年增长 3%
        - 每个新获批专科药物都会带来新的 PA 工作流；扩大生物制药合作伙伴基数
        - 跟踪 Forus 专科重点领域的新 FDA 批准；确认生物制药管线覆盖
      - - 处方药支出突破 $1 trillion（ASHP 2026）
        - 顺风
        - 2026 里程碑；预计增长 10–12%
        - 药品市场越大，PA 行政负担越重，制造商商业预算也越大
        - 确认 Forus 在上市支出中的份额是否随市场增长同比放大
      - - CMS 互操作性要求（CMS-0057-F；CMS-0062-P 提案）
        - 顺风（短期）；逆风（中期）
        - 2027 年电子 PA API 合规截止
        - 短期：降低支付方连接难度；中期：支付方可能自建一方 PA 工具，削弱 Forus 杠杆
        - 绘制支付方 API 路线图；评估支付方自有 ePA 会替代还是补足 Forus
      - - Medicare Advantage PA 改革立法（H.R. 3514 / S. 1816）
        - 顺风
        - 等待国会行动；众议院 254 名、参议院 66 名共同提案人（2026 年 2 月）
        - 若通过，将提升 Medicare Advantage 的电子 PA 采用率，让 Forus 工作流常态化
        - 跟踪国会议程；评估 Forus 的 Medicare Advantage 支付方连接
      - - 各州针对 PA 决策的 AI 监管法律
        - 逆风
        - 近期；2025–2026 年多个州活跃推进
        - 生物制药合作伙伴的合规复杂度上升；若 Forus 被误归类为覆盖决策 AI，将产生声誉风险
        - 审查 Forus 的 AI 治理文件；确认法律归类为服务方侧工作流工具
      - - CAQH 电子 PA 采用滞后（2024 年 40% 为电子）
        - 顺风（机会）
        - 持续存在；每年小幅改善
        - 手工 PA 积压是 Forus 的核心 TAM；60% 手工量构成增长跑道
        - 对照 CAQH 电子采用地图，验证 Forus 支付方覆盖
      - - Change Healthcare 网络攻击（2024 年 2 月；影响 193M 人）
        - 混合：短期错位 / 长期信任顾虑
        - 运营上已恢复；信任影响仍在
        - 暴露依赖清算所工作流的脆弱性；让市场更愿意尝试 Forus 这类去中心化工具
        - 评估 Forus 安全姿态（SOC 2 审计已确认）；确认不依赖 Change Healthcare
      - - IRA / GENEROUS Medicaid Model 带来的生物制药预算压力
        - 逆风
        - 2026–2028 分阶段实施
        - 制造商收入被压缩，可能削减患者准入项目和 Forus 费用对应的商业预算
        - 建模 Forus 生物制药收入对商业药物平均折扣变化的敏感度
      - - 医生 AI 采用增长（3 名医生中有 2 名使用医疗 AI；较 2023 年增长 78%）
        - 顺风
        - 当前且加速
        - 降低医生对 AI 驱动 PA 工作流的抵触；让 Forus 成为标准实践的一部分
        - 跟踪 AMA AI 采用指标；确认 Forus EHR 集成 NPS 相对同类工具的表现
      - - 专科药房渠道权力与 hub 既有合同
        - 逆风
        - 结构性 / 持续
        - CVS Specialty、Accredo 和其他专科 PBM 与制造商关系很深；Forus 必须补足或替代它们
        - 绘制 Forus 的专科药房路由关系；确认其增强而非冲突专科药房合同
    notes: 方向以 Forus 视角判断。时间根据 2026 年 Q1–Q2 资料估算。CMS 因素被标为双向：短期 API 标准化利好 Forus，但中期支付方内建能力可能降低对第三方的依赖。
