      - number: '4.2'
        title: 单位经济、定价与基准
        blocks:
          - type: paragraph
            body: >
              Forus
              未公开披露合同定价、交易结构、单个药品上市的平均售价，或每个生物制药合作伙伴的收入。所有单位经济指标——毛利率、生物制药侧获客成本（CAC）、净留存率（NRR）、回本周期和收入成本——仍是私有信息。以下分析用可比市场基准做三角测算，框定其单位经济可能的样子；这些是推断估计，不是已验证数字。


              医疗服务提供方侧创造的价值，构成生物制药合同定价的底线。CAQH 2024 Index 量化了手工事先授权交易成本：每次 $11.58，而全电子处理为 $2.17，降幅 81%。AMA 2024
              医生调查显示，诊所每周约花 13 个员工小时处理 PA；若按全成本计入员工时间（中等市场协调员人工 $20–25/hour），一次手工 PA 成本为 $20–35。使用自动化平台的诊所首轮通过率超过
              95%，而行业平均为 80–85%，显著减少拒绝后的跟进和返工成本。Forus 不向医疗服务提供方收费就交付这项价值，因此全部 ROI
              都归诊所所有——采用决策从采购决策变成工作流集成决策。这正是生物制药合作伙伴付费购买的采用加速机制：为它们商业化药品所需的开方者渠道提供免费采用激励。


              生物制药商业准入市场提供了定价上限和可比集合。Cardinal Health 的 hub 演进研究与 ICER 的 2025 上市定价报告合起来显示，生物制药制造商每次重大药品上市会在商业准入基础设施上花费
              $50–200 million，包括传统 hub 服务、共付援助、专科药房教育和患者支持项目。传统 hub-and-spoke 厂商——如 Inovalon、EVERSANA、AssistRx 和
              Sonexus——通常按入组患者、处理授权次数或年度平台费收费，每个药品收费区间为 $500,000 至 $5 million。Forus 的网络方法通过开方点的 EHR
              内嵌工作流交付，而不是处方后的呼叫中心，是对 hub 模型的结构性升级。合理推断是，Forus 对每次药品上市合作收费 $1–5 million，数据和分析组件带来增购潜力。若 5
              个生物制药合作伙伴各自管理多种药品，且每个伙伴每年在药品组合上承诺 $8–15 million，则 $45–55 million 的运行率是可信的。没有合同披露，这些估计无法验证。


              可比模型的毛利率基准支持 65–80% 毛利率假设。以软件交付为主的数字健康和数据授权平台（无实体商品，除托管和支持外每客户可变成本很低）通常达到这一范围。Forus 的主要收入成本可能是基础设施（EHR
              集成中间件、数据处理、付款方 API 连接）和临床运营（审查边缘案例、更新付款方规则），两者在规模化后大多是固定或近似固定成本。如果这一毛利率假设成立，Forus 在 $50M 运行率下每年可产生约
              $32.5–40M 毛利润。不过，在缺少审计财务的情况下，这仍是下游投资者必须验证的估计。


              公开资料没有披露净留存率、队列流失、生物制药合同续约或 LTV 数据。官方公告中的 5 家生物制药合作伙伴渗透率，以及 5x 收入增长信号，与快速 NRR 扩张（现有伙伴关系中新增药品）相一致，但没有 NRR
              披露无法确认。
