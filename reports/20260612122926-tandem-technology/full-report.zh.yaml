      - number: '2.3'
        title: 买方与用户分层
        blocks:
          - type: paragraph
            body: >
              Forus 市场包含四类不同参与者，经济利益显著分化；这种复杂性塑造了 go-to-market、定价和监管敞口。


              分层 1——Biopharma 制造商（经济买方 / 商业合作伙伴）。Forus 的主要收入来源是 biopharma 公司，尤其是推出专科药的公司；PA 批准率、治疗启动时间和患者依从性会直接影响商业表现。截至
              2026 年 5 月，全球前十大 biopharma 公司中有 5 家是 Forus 合作伙伴。制造商通过商业预算，而非 IT 或医疗技术采购预算，为 Forus
              合作付费；具体来自患者服务、市场准入和现场报销团队。因此，预算所有者是商业或市场准入高管，不是 CIO 或
              CTO。支出触发点包括新药上市、处方集位置变化、竞争分子进入，或付款方政策调整。采用约束在于：biopharma 公司已有 hub 供应商、专科药房合同和患者服务基础设施；Forus
              必须先证明更好的首填率和网络广度，才可能替代既有关系。


              分层 2——专科诊所和医疗系统（用户 / 受益方）。肿瘤科、风湿科、皮肤科、GI、神经科中心以及医疗系统专科部门的医生、诊所管理人员和临床协调员，是 Forus 平台的主要工作流用户。Forus 嵌入
              EHR，并对服务方免费。采用方通常是事先授权协调员或诊所经理，他们会从速度、EHR 集成质量和拒付降低率评估工具。AMA 2024 年调查发现，医生及其员工平均每周在 PA 任务上花费 13 小时；Forus
              直接攻击这项负担。采用触发点包括护理协调痛点、员工倦怠，或同业诊所推荐。


              分层 3——诊所管理者和收入周期负责人（运营者 / 采购把关人）。在较大的医疗系统中，收入周期管理总监、医生服务副总裁，或药房与生物制剂团队负责人，可能正式评估和采购 PA 自动化工具。Humata Health
              买方指南（2026）和 Develop Health 指南（2026）都指出，PA 自动化的买方评估框架聚焦 EHR 集成深度、付款方连接、自动化范围和拒付率改善，而不只是前期成本。由于 Forus
              对服务方免费，采购门槛低于收费竞品；但企业级医疗系统在大规模部署前，仍可能要求数据安全审查、工作流集成评估和临床结果验证。


              分层 4——患者（受益方，不是付款方）。患者是工作流改善的下游接收者。他们不直接为 Forus 付费，也不是商业采用的决策者。不过，患者体验结果——治疗启动速度、共付降低和状态透明度——正是 Forus
              向服务方和 biopharma 营销的价值。KFF 2026 年民调发现，患有慢性病的参保成年人受到 PA 延迟的影响不成比例；这类人群是 Forus 自动化的主要受益者，其结果数据也是 Forus 说服
              biopharma 建立合作的最有力营销证据。


              一个重要结构细节是：在 biopharma 付费模式下，付款方和受益方完全分离，用户（医生 / 协调员）也不是付款方。这种三方分离（付款方 = biopharma，用户 = 服务方团队，受益方 =
              患者）意味着采用、变现和价值交付分别对应不同利益相关者。任何一层受到监管审查——比如州级 AI 监管法律瞄准付款方在 PA 决策中使用 AI——都可能影响 Forus 的运营环境，尽管 Forus
              不是付款方，也不做覆盖决策。
