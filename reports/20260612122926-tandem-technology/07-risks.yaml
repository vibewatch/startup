callouts:
  - calloutType: risk
    title: Thesis-Break Trigger — Human-Review Mandate in High-Volume States
    body: >-
      If states representing a majority of Forus's prescription volume (notably Texas, California,
      Florida, and New York) enact Indiana-style laws requiring licensed physician sign-off before
      each AI-assisted PA determination, Forus's fully automated end-to-end model would require
      material product re-architecture. The resulting compliance overhead would compress margins,
      slow submission throughput, and partially eliminate the zero-effort value proposition that
      drives provider adoption. Investors should monitor Manatt Health's AI Policy Tracker
      quarterly and request Forus's regulatory compliance roadmap as a prerequisite to any new
      capital commitment.
    claimRefs:
      - CR001
      - CR002
      - CR004
      - CR037

  - calloutType: risk
    title: Biopharma Revenue Concentration — Undisclosed, Uninvestable Without Diligence
    body: >-
      With annualized revenue above $50M concentrated in five unnamed biopharma partners and zero
      publicly disclosed contract terms, duration, or renewal structures, investment underwriting
      of commercial risk is not possible from public evidence alone. A single top-partner non-renewal
      or internal hub build could impair near-term path to profitability. Diligence must include
      under-NDA review of top-three partner contracts, revenue concentration by partner, and
      minimum-term commitment schedules.
    claimRefs:
      - CR025
      - CR026
      - CR028
      - CR029

