callouts:
  - calloutType: strength
    title: Organic 10x Growth as Market Validation
    body: |
      Forus achieved 10x year-over-year provider adoption growth for two consecutive years with minimal
      paid marketing. This rare organic trajectory—driven by word of mouth from practice administrators
      and physicians—provides unusually strong evidence of genuine product-market fit and reduces
      customer acquisition cost risk compared to sales-driven healthcare IT peers.
    claimRefs:
      - CO024
      - CO023

  - calloutType: risk
    title: Regulatory Headwinds for AI in Prior Authorization
    body: |
      Six US states enacted new AI-in-healthcare laws in 2026 requiring physician review of AI-assisted
      PA denials. Although these laws target payer-side AI systems, the broader regulatory climate
      creates scrutiny of all AI participants in the prescription workflow. If Forus's role in the
      PA process is ever recharacterized by regulators or plaintiffs as decision-making rather than
      administrative automation, the legal exposure could be material.
    claimRefs:
      - CO035
      - CO036
      - CO037
      - CO038

  - calloutType: insight
    title: Chronology Tension in Funding Disclosures
    body: |
      Bloomberg's January 2026 report cited $137 million in total prior funding before the new $100M
      round, while the May 2026 official announcement states total funding of over $160 million—a
      discrepancy of at least $23 million. This may reflect additional capital added to the round
      between the Bloomberg report and formal close, or differences in what was counted as raised.
      Diligence should reconcile the round-by-round capital table with cap table documentation.
    claimRefs:
      - CO020
      - CO015
      - CO016

  - calloutType: assumption
    title: Revenue Model Opacity
    body: |
      Forus's biopharma partnership revenue model is described at a high level but is not publicly
      detailed. The specific contractual structure (milestone-based, data licensing, SaaS subscription,
      percentage of drug sales), gross margins, and contract duration are unknown. The annualized
      revenue figures ($10M end-2025, $50M+ 2026) are company-disclosed via a single press outlet
      and have not been independently audited.
    claimRefs:
      - CO006
      - CO018
      - CO019

