    - type: missing-source
      severity: material
      topic: headcount
      missingEvidence: "Precise headcount with breakdown between engineering, clinical, operations, and commercial functions, plus hiring pace in 2025-2026."
      whyItMatters: "Headcount structure reveals execution capacity, burn rate range, and scalability of the workforce model relative to revenue growth."
      diligencePath: "Request formal headcount data from company; cross-reference LinkedIn employee count; review job posting volume over time."
      relatedQuestionRefs:
        - QO007

    - type: private-evidence-only
      severity: material
      topic: revenue-model
      missingEvidence: "Detailed biopharma contract structure, whether revenue is milestone-based, subscription, data-licensing, or percentage of drug sales; gross margin; contract duration; churn rate."
      whyItMatters: "Revenue quality and predictability depend heavily on contract structure; without this the $50M-plus ARR figure cannot be benchmarked against comparable healthcare SaaS businesses."
      diligencePath: "Request anonymized contract terms during due diligence; review biopharma partner contracts; request full P&L and cohort revenue data."
