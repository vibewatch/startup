  - id: s3
    title: Funding History and Capital Formation
    body: |
      Tandem Technology raised a seed round of approximately $7 million in 2023, with Pear VC and
      Thrive Capital among the early backers—CityBiz reports the company was founded in the offices
      of Thrive Capital. Pear VC confirmed it invested at seed in 2023 after discovering Jaggi
      through connections including Mario Schlosser, Oscar Health's co-founder. General Catalyst
      subsequently led the Series A round of approximately $30 million in 2024, with Accel and
      Thrive participating.

      On January 26, 2026, Bloomberg News reported that Tandem Technology was raising $100 million
      at a $1 billion valuation with Accel leading, and that total prior funding stood at approximately
      $137 million. This reporting was confirmed by PYMNTS and other outlets; the company did not
      respond to requests for comment at that time, and the round was described as not yet publicly
      announced. The January 2026 reporting ($100M round, $137M total) is in tension with the May
      2026 announcement ($160M total), suggesting the January figure reflected an incomplete or
      interim count that was later revised upward—or that additional capital was added to the round
      before close.

      On May 12, 2026, Forus announced publicly that it had raised over $160 million in total funding
      from Thrive Capital, General Catalyst, Accel (each of which led a distinct round), plus Bain
      Capital Ventures, Redpoint, BoxGroup, and Pear VC. The announcement also confirmed that the
      company had reached a $1 billion valuation, making it a unicorn. No debt facility, secondary
      transactions, or revenue-based financing arrangements have been disclosed. Forbes reported that
      annualized revenue had surpassed $10 million by end of 2025 and was tracking above $50 million
      on an annualized basis in 2026—approximately a 5x increase year-over-year—driven by new
      biopharma commercialization partnerships and organic provider growth.
