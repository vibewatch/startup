  evidenceGaps:
    - type: missing-source
      severity: blocking
      topic: EHR-certification-roster
      missingEvidence: "Forus has not published which specific EHR systems (e.g., Epic, Cerner, Athena) are formally certified or integrated with the platform. No developer portal, API documentation, or EHR-vendor certification list exists in public sources."
      whyItMatters: "EHR certification is the primary procurement prerequisite for large health systems and integrated delivery networks. Without knowing which EHRs are supported, the addressable market for enterprise contracts cannot be assessed and installation friction is unknown."
      diligencePath: "Request certified EHR integration list with Epic App Orchard, Oracle Health (Cerner), Athena, and other major EHRs; confirm whether Forus has Surescripts certification; review any EHR vendor announcement or partnership press release."
      relatedQuestionRefs:
        - QE002
        - QE013

    - type: missing-source
      severity: blocking
      topic: PA-accuracy-performance-metrics
      missingEvidence: "Forus has not published any performance metrics for its PA automation: auto-approval rate, denial rate, appeal overturn rate, or accuracy rate versus manual workflows or competitor platforms."
      whyItMatters: "Without these metrics, the product's clinical and operational quality cannot be assessed. Humata reports a 96% first-pass approval rate; Infinitus documents 50% reduction in verification time. Forus's undisclosed metrics could indicate competitive disadvantage or simply lack of public disclosure."
      diligencePath: "Request PA auto-approval rate, manual review rate, and appeal overturn rate across specialties and payer types; compare to CAQH benchmark of 84% electronic PA resolution rate; request any A/B or controlled comparison versus manual PA process."
      relatedQuestionRefs:
        - QE006
        - QE015

    - type: private-evidence-only
      severity: material
      topic: AI-governance-framework
      missingEvidence: "No public AI governance document, override policy, bias monitoring methodology, or model evaluation criteria has been published by Forus. Optum Rx has published a formal AI governance board process; Humata documents structured, auditable decision processes for CMS-0057 compliance."
      whyItMatters: "State AI-in-PA legislation (25+ bills, H&K May 2026) may require Forus to publish override rates, bias audits, and governance disclosures in multiple jurisdictions. Absence of a published framework is a near-term compliance risk and a procurement barrier with large health systems that require documented AI governance."
      diligencePath: "Request AI model evaluation documentation including training data sources, evaluation metrics, override/escalation rules, and any internal bias audits; confirm whether Clinical Intelligence team has a documented model review process or relies on ad hoc clinical review."
      relatedQuestionRefs:
        - QE012
        - QE022
        - QE029

    - type: missing-source
      severity: material
      topic: HITRUST-BAA-compliance
      missingEvidence: "HITRUST certification status and BAA template terms are not in the public record. Humata Health holds HITRUST CSF v9.5.0 r2 certification; Forus has not confirmed or denied pursuing HITRUST."
      whyItMatters: "HITRUST certification is a procurement requirement for many large health systems, payers, and health plans. Without it, Forus may be excluded from RFPs at IDN, hospital, or payer level that require HITRUST as a baseline. BAA terms govern PHI handling and breach obligations—critical for any provider or payer signing a business relationship."
      diligencePath: "Request current HITRUST status (certified, in-process, not started); obtain BAA template for review including subprocessor list, data retention, breach notification timeline, and data return/deletion terms."
      relatedQuestionRefs:
        - QE019
        - QE020
        - QE028

    - type: private-evidence-only
      severity: material
      topic: payer-connectivity-roster
      missingEvidence: "The specific payer API connections, clearinghouse relationships, and payer rule coverage depth are not publicly disclosed. Forus claims to cover 'every payer' but does not provide a payer directory or connectivity certificate."
      whyItMatters: "Payer rule coverage accuracy and update frequency are the primary operational cost and quality differentiator in PA automation. If coverage is less complete than claimed, denial rates may be higher in practice than in marketing. Annual payer policy changes require continuous maintenance."
      diligencePath: "Request payer connectivity roster showing electronic vs. fax vs. portal connectivity for the 25 largest US payers; confirm update frequency for payer rule library; verify coverage for Medicare Advantage, Medicaid managed care, and commercial plans."
      relatedQuestionRefs:
        - QE002
        - QE016

    - type: missing-source
      severity: minor
      topic: developer-signal
      missingEvidence: "Forus has no public GitHub repository, developer portal, API documentation, or public engineering blog. No Stack Overflow tags, HackerNews discussions, or npm/PyPI packages attributed to Forus are publicly discoverable."
      whyItMatters: "Absence of a developer-facing surface is consistent with an enterprise-sales-led integration model (as opposed to a platform/API-first strategy) but limits the ability to assess engineering team output, code quality, and technology choices via practitioner community signals."
      diligencePath: "Check LinkedIn for Forus engineering job postings as a proxy for technology stack choices; request internal technology stack overview in diligence process; monitor for any future developer portal launch as a platform maturity signal."
      relatedQuestionRefs:
        - QE017
        - QE013

    - type: missing-source
      severity: material
      topic: affordability-program-scope
      missingEvidence: "Forus does not publish a list of biopharma manufacturers, drug brands, or affordability programs it supports for patient enrollment. It is unknown which drugs trigger automatic affordability enrollment, what the enrollment success rate is, or how IRA co-pay coupon restrictions affect availability of this module for Medicare patients on certain drugs."
      whyItMatters: "If affordability enrollment is limited in practice—for instance, not available for Medicare patients or for drugs without active manufacturer programs—the scope of the module is materially narrower than marketing copy implies."
      diligencePath: "Request list of drug categories and payer types for which affordability enrollment is triggered; confirm IRA impact assessment for Medicare patient population; ask for enrollment success rate and program coverage metrics."
      relatedQuestionRefs:
        - QE004

    - type: missing-source
      severity: material
      topic: pharmacy-routing-commercial-arrangements
      missingEvidence: "Forus has not disclosed whether it has preferred-routing or commercial channel agreements with specific pharmacy chains, specialty pharmacies, or pharmacy benefit managers. The company claims to route to 'every pharmacy' but does not disclose routing logic or any preferred-network arrangements."
      whyItMatters: "If Forus receives payment from certain pharmacies for preferential routing, this is a conflict of interest that providers and patients should know about. Preferred-routing arrangements could also affect patient access in markets where only certain pharmacies are in a patient's network."
      diligencePath: "Confirm whether any commercial arrangement (payment, preferred partner, data-sharing) with specific pharmacies or specialty pharmacy networks exists; confirm how patient pharmacy preference is honored; review routing logic disclosure in BAA or provider contract."
      relatedQuestionRefs:
        - QE005

    - type: private-evidence-only
      severity: material
      topic: appeals-overturn-rate
      missingEvidence: "Forus has not disclosed the overturn rate for automated PA appeals, the percentage of denials that result in automatic appeal generation versus staff follow-up, or the time-to-resolution for appeal cases."
      whyItMatters: "Appeal overturn rate is the key quality metric for the automated appeals module. A low overturn rate means patients lose access despite the platform's involvement; a high rate is a strong proof point for clinical quality. Without this data, the value of the appeals module cannot be independently validated."
      diligencePath: "Request appeal overturn rate by specialty and payer type; confirm what percentage of denials trigger automatic appeal vs. staff escalation; compare to industry benchmark of ~35% administrative error overturn rate."
      relatedQuestionRefs:
        - QE008

    - type: private-evidence-only
      severity: material
      topic: network-effects-data-moat
      missingEvidence: "Forus claims that its first-party prescription-flow data asset creates a competitive moat and network effect, but has not disclosed: (1) data volume (prescriptions processed per year); (2) whether data is shared across multiple biopharma customers simultaneously or under exclusivity; (3) how the data moat defends against replication by a better-capitalized competitor."
      whyItMatters: "The biopharma data moat is central to the investment thesis. If data is shared non-exclusively with multiple biopharma buyers simultaneously, it may be replicated by any platform that reaches sufficient scale. The moat claim is only defensible if data exclusivity, enrichment quality, or switching costs are documented."
      diligencePath: "Confirm annual prescription volume processed and data asset size; request data governance policy including multi-customer sharing vs. exclusivity; assess whether network effects compound from clinical-decision integration (OpenEvidence) vs. only from PA volume."
      relatedQuestionRefs:
        - QE026

    - type: private-evidence-only
      severity: minor
      topic: product-roadmap
      missingEvidence: "Forus has not published a formal product roadmap, development stage disclosure, or planned feature release timeline. The only future product signal is the general use-of-funds language in the May 2026 announcement ('expanding product capabilities and building the team') and the OpenEvidence partnership announcement."
      whyItMatters: "Investors and enterprise customers cannot assess product completeness or investment trajectory without a roadmap. Key strategic questions—EHR certification breadth, payer rule expansion, API/developer portal launch, international expansion—are unanswerable from public sources."
      diligencePath: "Request 12-month product roadmap including planned EHR integrations, payer connectivity additions, new specialty coverage, data product enhancements, and any developer platform initiative."
      relatedQuestionRefs:
        - QE027
