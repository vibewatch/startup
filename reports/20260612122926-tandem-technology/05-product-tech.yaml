figures:
  - id: FE001
    title: "Product Architecture Map"
    type: stack
    layout: wide
    summary: "Layered architecture of the Forus platform from EHR trigger to biopharma data output. Layers are analyst characterizations from public sources; internal stack details are not publicly disclosed."
    approximationNotes: >-
      Stack layers are inferred from official product descriptions, competitive benchmarking
      (Waystar developer portal, Humata technology page, Optum AI pharmacy article), and
      standard healthcare IT integration patterns. No technical documentation has been published
      by Forus. Layer labels and components represent the most defensible characterization
      given public evidence; specific vendor choices (e.g., EHR systems certified, SMS provider,
      cloud infrastructure) are not confirmed.
    claimRefs:
      - CE008
      - CE009
      - CE010
      - CE011
      - CE013
    data:
      layers:
        - id: biopharma-layer
          label: "Biopharma Engagement and Data Layer"
          detail: "Top layer: first-party prescription-flow data feeds biopharma commercial access partnerships. Primary revenue source. De-identification methodology not disclosed."
          sublayers:
            - id: data-asset
              label: "First-Party Prescription-Flow Data Asset"
              detail: "Anonymized PA outcomes, formulary overrides, adherence signals, prescriber behavior. Basis of biopharma commercial access revenue. De-identification method not disclosed."
            - id: biopharma-analytics
              label: "Biopharma Analytics and Commercial Access Reporting"
              detail: "Drug launch optimization, prescriber-network access, commercial analytics sold to biopharma partners. Five top-10 biopharma customers as of May 2026."
        - id: intelligence-layer
          label: "AI and Clinical Intelligence Layer"
          detail: "Human-in-the-loop intelligence layer: in-house clinical team maintains payer-rule library and oversees AI inference; AI automates pattern matching and form generation."
          sublayers:
            - id: clinical-intelligence
              label: "Clinical Intelligence Team (Adam Harris, MD; Kathleen Alvarez, NP)"
              detail: "In-house clinical experts maintaining payer-rule library, specialty PA nuance, and product QA. Human-in-the-loop model—not autonomous clinical AI."
            - id: rules-engine
              label: "Policy and Rules Engine"
              detail: "Continuously updated database of payer step-therapy criteria, formulary rules, and clinical PA requirements. Core defensibility asset; update cadence not disclosed."
            - id: ai-inference
              label: "AI Inference Engine (type not disclosed)"
              detail: "Automates form field population, denial classification, appeal drafting. Model architecture, training data, evaluation metrics, and hallucination governance not public."
        - id: workflow-layer
          label: "Workflow Automation Layer"
          detail: "Core operational layer: automates PA submission, appeals, affordability enrollment, pharmacy routing, and patient SMS at zero cost to providers."
          sublayers:
            - id: pa-submission
              label: "PA Form Generation and Submission"
              detail: "Extracts clinical data from EHR prescription; maps to payer-specific PA form; submits electronically. Covers all payers and drugs per official description."
            - id: appeals
              label: "Appeals Automation"
              detail: "Classifies denial reason; generates appeal letter from clinical record and payer criteria; tracks overturn status."
            - id: affordability
              label: "Patient Affordability Enrollment"
              detail: "Identifies PAP/co-pay card eligibility; auto-enrolls patient in manufacturer assistance programs at point of prescribing."
            - id: pharmacy-routing
              label: "Pharmacy Routing"
              detail: "Routes prescription to optimal pharmacy post-approval; sends patient confirmation text with pickup details."
            - id: patient-sms
              label: "Patient Communication (SMS)"
              detail: "Proactive text updates at each workflow stage. PHI handling in SMS not documented; carrier/SLA not disclosed."
        - id: integration-layer
          label: "Integration and Connectivity Layer"
          detail: "Bottom layer: connects Forus to EHR systems, payers, pharmacies, and clinical decision support partners. Specific integrations not publicly documented."
          sublayers:
            - id: ehr-connectors
              label: "EHR Connectors (specific systems not confirmed)"
              detail: "FHIR R4 / HL7 v2 / SMART on FHIR likely; Epic, Cerner, Athena possible—none confirmed publicly. No developer portal or API docs published."
            - id: payer-connectivity
              label: "Payer Connectivity"
              detail: "Direct payer APIs, clearinghouse, X12 EDI/NCPDP routing. Da Vinci CRD/DTR/PAS FHIR IG possible given CMS mandate timeline."
            - id: openevidence-api
              label: "OpenEvidence API Integration"
              detail: "Partnership announced April 2026. Connects clinical decision support (1M+ consultations/day) to Forus prescription initiation and access automation."
            - id: pharmacy-network
              label: "Pharmacy Network (SureScripts likely)"
              detail: "e-Prescribing and pharmacy routing. Specific dispensing network partnerships not disclosed."

  - id: FE002
    title: "Customer Workflow / Operating Flow"
    type: flow
    layout: wide
    summary: "End-to-end prescription access flow from clinical decision to patient therapy start, showing where Forus automation replaces manual steps."
    approximationNotes: >-
      Flow steps derived from official product descriptions on forus.com, provider testimonials
      in company blog posts, the OpenEvidence partnership announcement, and the BusinessWire
      funding press release. Step labels represent confirmed product behavior; timing estimates
      for automation-assisted vs. manual are based on provider testimonials, not independently
      verified benchmarks.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
      - CE005
      - CE006
    data:
      nodes:
        - id: clinical-decision
          label: "Clinical Decision (clinician)"
          detail: "Clinician determines optimal treatment in EHR. May be informed by OpenEvidence clinical decision support (1M+ daily consultations in US). Forus does not influence the clinical decision."
        - id: ehr-prescription
          label: "EHR Prescription Entry"
          detail: "Clinician writes prescription in their native EHR workflow. Forus is embedded—no separate portal or tool launch required."
        - id: forus-trigger
          label: "Forus Auto-Detects PA Requirement"
          detail: "Platform intercepts the order, determines PA requirements against payer rules, and initiates the access workflow automatically. Detection accuracy not disclosed."
        - id: pa-submission
          label: "PA Form Auto-Generated and Submitted"
          detail: "Clinical data mapped to payer-specific PA criteria; form submitted electronically. Covers all payers and drugs. Staff not required to manually complete forms."
        - id: payer-review
          label: "Payer Review"
          detail: "Payer evaluates PA request. Decision timeline: 72 hours (urgent) / 7 calendar days (standard) per CMS-0057-F2 interoperability rule effective January 2026."
        - id: pa-approved
          label: "PA Approved → Pharmacy Routing"
          detail: "On approval, Forus routes prescription to optimal pharmacy (retail, specialty, mail-order). Patient receives confirmation text."
        - id: pa-denied
          label: "PA Denied → Auto-Appeal"
          detail: "Forus classifies denial reason, auto-generates appeal from clinical record, resubmits. Staff not required to draft appeal manually."
        - id: affordability-check
          label: "Affordability Enrollment (parallel)"
          detail: "Simultaneously with PA, Forus checks for PAP/co-pay card eligibility and auto-enrolls patient in manufacturer assistance program if cost is a barrier. IRA restrictions may limit for some drugs."
        - id: patient-text
          label: "Patient Status Updates (SMS)"
          detail: "Patient receives proactive text at each handoff: insurance decision, pharmacy routing, readiness. Reduces practice inbound calls. PHI in SMS handling not publicly documented."
        - id: therapy-start
          label: "Patient Begins Therapy"
          detail: "End state: prescription filled, patient informed, therapy started. Forus tracks status for practice visibility. Millions of patients supported annually per official claims."

  - id: FE003
    title: "Critical Dependency Map"
    type: dag
    layout: wide
    summary: "Key dependencies for Forus platform operation: EHR vendors, payer connectivity, regulatory frameworks, clinical knowledge, and biopharma commercial relationships."
    approximationNotes: >-
      Dependency relationships are analyst inferences from official product descriptions,
      competitive benchmarking, and healthcare IT norms. No technical architecture document
      has been published by Forus. Dependency criticality ratings reflect analyst judgment
      based on product scope and failure-mode analysis.
    claimRefs:
      - CE008
      - CE009
      - CE010
      - CE014
    data:
      nodes:
        - id: forus-platform
          label: "Forus Platform"
          detail: "Central node: all dependencies required for end-to-end prescription access automation."
        - id: ehr-vendors
          label: "EHR Vendors (Epic, Cerner, Athena, others)"
          detail: "Must certify Forus as an approved integration. Specific EHR certifications not disclosed. Epic App Orchard approval is gatekeeper for most large health system deployments."
        - id: payer-apis
          label: "Payer APIs / Clearinghouses"
          detail: "Electronic PA submission requires payer connectivity. CMS interoperability rule mandates API access by 2027. Current connectivity roster not disclosed."
        - id: clinical-intelligence
          label: "Clinical Intelligence Team"
          detail: "Adam Harris, MD + Kathleen Alvarez, NP + team. Maintains payer-rule library. Key-person dependency; no succession documentation public."
        - id: biopharma-partners
          label: "Biopharma Commercial Partners (5 of top 10)"
          detail: "Revenue-generating relationships. Concentration risk unknown. Contract duration and renewal structure not public."
        - id: openevidence
          label: "OpenEvidence (clinical decision support)"
          detail: "Upstream integration connecting evidence-based prescribing to access automation. Partnership announced April 2026; 1M+ daily clinical consultations in US."
        - id: pharmacy-network
          label: "Pharmacy Network"
          detail: "Routing requires connections to retail, specialty, and mail-order pharmacies. SureScripts e-prescribing network likely. Specific partnerships not confirmed."
        - id: cms-regulation
          label: "CMS / Regulatory Framework"
          detail: "CMS-0057-F2 mandates payer PA APIs by January 2027—structural tailwind. AI-in-PA state legislation (25+ bills, H&K May 2026) could require disclosure or oversight changes."
        - id: cloud-infrastructure
          label: "Cloud Infrastructure / Security"
          detail: "SOC 2 Type II certified (three clean audits). Cloud provider not disclosed. Disaster recovery and redundancy architecture not public."
      edges:
        - from: ehr-vendors
          to: forus-platform
          label: "Integration prerequisite"
        - from: payer-apis
          to: forus-platform
          label: "PA submission route"
        - from: clinical-intelligence
          to: forus-platform
          label: "Rules library + QA"
        - from: biopharma-partners
          to: forus-platform
          label: "Revenue + data buyer"
        - from: openevidence
          to: forus-platform
          label: "Upstream referral"
        - from: pharmacy-network
          to: forus-platform
          label: "Fulfillment routing"
        - from: cms-regulation
          to: forus-platform
          label: "Regulatory tailwind / risk"
        - from: cloud-infrastructure
          to: forus-platform
          label: "Hosting + security"

  - id: FE004
    title: "Product Maturity / Capability Map"
    type: matrix
    layout: wide
    summary: "Comparative capability maturity across Forus and key competitors on the five dimensions of end-to-end prescription access automation. Ratings are analyst assessments from public evidence only."
    approximationNotes: >-
      Capability ratings (High / Medium / Low / Unknown) are analyst assessments from publicly
      available product descriptions, case studies, developer portals, and trust pages. No
      independent benchmark or head-to-head comparison exists. Forus-specific ratings are
      conservative where evidence is limited to marketing copy. Competitor ratings are based on
      Waystar developer portal, Humata technology/security pages, Infinitus resources, and
      Optum Rx AI pharmacy article.
    claimRefs:
      - CE021
      - CE022
      - CE023
      - CE024
      - CE025
    data:
      columns:
        - "Forus"
        - "Waystar"
        - "Humata"
        - "Infinitus"
        - "Optum ePA"
      rows:
        - label: "PA Automation Coverage"
          values:
            - "High — All drugs, payers, pharmacies; every specialty; all 50 states; EHR-embedded, zero provider cost"
            - "High — PA module within full RCM platform; REST/HL7/EDI APIs; paid platform for providers"
            - "High — 96% first-pass approval rate; 45% fewer auth touches; HITRUST certified; paid platform"
            - "Medium — PA follow-up via voice AI (phone); benefit verification; not EHR-embedded PA submission"
            - "Medium — Strong within Optum Rx formulary; limited to Optum-aligned plans; insurer-controlled"
        - label: "Patient Affordability Enrollment"
          values:
            - "High — Automated PAP and co-pay card enrollment at point of prescribing; manufacturer-funded; confirmed module"
            - "Low — Primarily revenue cycle; no affordability enrollment module described in public materials"
            - "Low — Focus on PA automation; no public affordability enrollment module"
            - "Medium — Copay card status monitoring and patient affordability follow-up via voice agents"
            - "Low — PA submission tool; no standalone affordability enrollment described"
        - label: "EHR Workflow Embeddedness"
          values:
            - "High — Embedded in native EHR workflow; no separate portal; confirmed by provider testimonials; EHR certifications not public"
            - "High — Developer portal with REST/HL7/EDI; publicly documented integration patterns; SMART on FHIR"
            - "High — Proprietary APIs and HL7/FHIR standard integrations confirmed on tech page"
            - "Low — Voice AI for phone-based workflows; integration via data feeds rather than EHR embedding"
            - "Medium — Provider portal and EHR integration; strength primarily within Optum Rx plan ecosystem"
        - label: "Security / Compliance Maturity"
          values:
            - "Medium — SOC 2 Type II (3 clean audits); HIPAA implied; HITRUST unknown; no public status page; BAA terms not public"
            - "High — Public SOC 2 Type II; HIPAA; enterprise-grade SLA documentation; public status page"
            - "High — SOC 2 Type II; HIPAA; HITRUST CSF v9.5.0 r2 certified; compliance contacts public"
            - "Medium — HIPAA documented in AI trust technical paper; SOC 2 not prominently confirmed on public site"
            - "High — UnitedHealth Group subsidiary; enterprise-grade compliance including formal AI governance board"
        - label: "Biopharma Data / Commercial Access"
          values:
            - "High — Primary revenue model; 5 of top 10 biopharma partners; first-party prescription-flow data asset"
            - "Low — Provider-side RCM platform; no public biopharma commercial access or data-licensing model"
            - "Low — Provider and payer PA automation; no public biopharma data commercial access model"
            - "Medium — Life sciences clients include Novartis, GSK; patient access programs for pharma; revenue model not public"
            - "Medium — UnitedHealth Group pharmacy data assets via Optum Rx; primary orientation is insurer/PBM not biopharma commercial"

