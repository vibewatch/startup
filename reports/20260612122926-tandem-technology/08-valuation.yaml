      - CV037
      - CV038
      - CV039

  - id: TV006
    title: Final Diligence Asks
    columns:
      - Topic
      - Missing Evidence
      - Why It Matters for Valuation
      - Diligence Path
    rows:
      - - "Gross margin and COGS structure"
        - "No gross margin, COGS breakdown, or contribution margin by revenue stream is publicly disclosed"
        - "A 10-percentage-point gross margin variance (60% vs 70%) changes the sustainable multiple by approximately 30–50% under DCF assumptions; margin below 55% would make the $1B mark indefensible under any base scenario"
        - "Request audited or management-accounts P&L for the trailing four quarters under NDA; specifically ask for COGS allocated to EHR integration maintenance, payer API costs, and clinical rule updates"
      - - "Net revenue retention (NRR)"
        - "No cohort retention, NRR, or biopharma contract renewal rate data is publicly available"
        - "NRR is the single most powerful SaaS quality indicator; NRR >115% would justify bull-case entry at $1B; NRR <100% would indicate biopharma partner contraction and reduce fair value to bear range"
        - "Request partner cohort revenue schedule by year of engagement; ask specifically for renewal rate on contracts that have reached their first renewal window"
      - - "Contract concentration and partner identity"
        - "The five named biopharma partners are not publicly disclosed; revenue distribution across partners is unknown"
        - "If two partners represent >70% of $50M revenue, a single non-renewal creates a >$17M revenue cliff—material at current operating scale"
        - "Request top-5 customer revenue concentration schedule under NDA; separately, ask for minimum contract terms and notice period for each partner agreement"
      - - "Burn rate and cash runway"
        - "Annual cash burn is not publicly disclosed; estimates range from $18M to $35M/year based on NYC headcount benchmarks"
        - "Runway uncertainty affects dilution modeling; if Forus raises again within 18 months at a flat or down round, the $1B entry mark is impaired before any exit"
        - "Request most recent 12-month cash flow statement and 18-month projected runway model under NDA"
      - - "BAA governance and data de-identification"
        - "Forus's Business Associate Agreement template, de-identification standard (Safe Harbor vs Expert Determination), and PHI exclusion from AI model training are not publicly disclosed"
        - "Biopharma analytics revenue depends on legally shareable prescription-flow data; a de-identification gap or BAA deficiency could expose the entire analytics revenue stream to contract rescission and regulatory enforcement"
        - "Request form BAA used with health system customers and with biopharma analytics partners; ask for legal opinion on HIPAA de-identification method and PHI model-training exclusion confirmation"
    notes: >-
      These six diligence asks represent the minimum information set required to close from
      'track / research more' to a supported investment decision. All items are standard
      private-company diligence requests that a company of Forus's stage and scale (>$50M ARR,
      >$160M raised) should be able to produce. Inability or unwillingness to provide these
      items under NDA is itself a diligence signal.
    claimRefs:
      - CV033
      - CV036
      - CV037
      - CV038
      - CV039
      - CV040

