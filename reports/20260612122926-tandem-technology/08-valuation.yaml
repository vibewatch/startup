      Revenue base of $50M is company-reported via Forbes (annualized as of May 2026); not
      audited. Each bar represents implied enterprise value = $50M × revenue multiple shown.
      No leverage or preference stack assumed. The 30x 'adjacent AI comp' bar uses Abridge's
