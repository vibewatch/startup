        - label: "Base: Private Growth-Stage"
          low: 500
          high: 750
          unit: "$M"
          detail: "10–15x trailing revenue on $50M; 1.5–2x annual growth assumed; 55–70% gross margin estimated. Represents 25–50% discount to $1B mark. Secondary entry $400–700M adds margin of safety."
        - label: "Bull: Confirmed High-Growth Economics"
