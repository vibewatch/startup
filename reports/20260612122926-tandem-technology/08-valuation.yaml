          detail: "Company-reported metrics (Forbes) are the only financial anchor; no independent analyst coverage (KLAS, G2, Gartner), no audited financials, no named customers. Network scale metrics are independently verifiable in principle but not third-party audited."

callouts:
  - type: insight
    title: "SaaS vs. Marketing Services: The Multiple-Defining Question"
    body: >-
      The most important framing question for any Forus investment decision is: which comparable
      framework dominates? If Forus is a data-platform SaaS business (65–80% gross margin, high
      NRR, durable subscription), the 20x revenue multiple is achievable and the $1B entry is
      defensible. If Forus is a biopharma marketing services business (lower margin, transactional
      revenue, project-based engagement), the appropriate multiple is 5–10x and the $1B mark is
      materially stretched. Resolving this question requires private financial diligence and is
      the single highest-leverage question in the entire investment analysis.
    claimRefs:
      - CV030
      - CV036
  - type: warning
    title: "Multiple Compression Precedent: The Waystar Signal"
    body: >-
      Waystar's 43.5% market cap decline from 2025 to 2026 illustrates that healthcare workflow
      platforms are not immune to multiple compression even with strong competitive positioning.
      Any buyer entering Forus at $1B should model a public-market comparable re-rating scenario
      in their bear case — not as a likely outcome, but as a risk parameter that needs to be
      priced into the deal structure.
    claimRefs:
      - CV007
      - CV023

