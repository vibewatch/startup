  - id: FV004
    title: Investment KPI Scorecard
    type: kpi
    layout: standard
    summary: >-
      IC-ready scoring across six investment dimensions: market opportunity, proof of traction,
      competitive moat, financial economics, risk profile, and evidence quality. Scores reflect
      publicly available evidence as of June 2026; private diligence could improve the economics
      and evidence-quality scores materially.
    approximationNotes: >-
      Scores are analyst assessments based on publicly available evidence only. 'High' = strong
      evidence-based support; 'Medium' = directionally positive but insufficiently verified;
      'Low' = insufficient public evidence to assess positively. Revenue and valuation figures
      are from Forbes and public announcements. Risk scores reflect chapter 07 analysis.
