      through risk-discount factors (concentration, regulatory, margin opacity) to the
      'track / research more' recommendation and the six diligence gates that would move
      the call to buy.
    approximationNotes: >-
      Network scale and revenue anchor are public-source confirmed. Risk-discount factors are
      analyst-assessed from publicly available regulatory and competitor evidence. The
      recommendation node reflects the base-case valuation analysis; a full NDA data room
      resolving gross margin, NRR, and concentration could shift the terminal node to 'buy
      at $700M–$1B'.
    claimRefs:
