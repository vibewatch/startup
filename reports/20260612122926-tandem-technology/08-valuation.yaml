        - "Triggers material product development cost; delays new partner onboarding; compresses gross margin; may restrict commercial model in affected states"
        - "Reassess regulatory exposure depth; model compliance cost impact on EBITDA path; downgrade to track"
      - - "PHI data breach"
        - "Any OCR investigation, class-action lawsuit, or public reporting of unauthorized disclosure of patient PHI by Forus or its subcontractors"
        - "Average healthcare data breach costs $7.42M (IBM/ITECS benchmark); reputational damage to biopharma partnerships; potential BAA termination cascades"
        - "Immediate pass pending resolution; breach scope, containment speed, and BAA standing with partners determine whether thesis can recover"
      - - "Public market healthcare AI multiple compression"
        - "Waystar EV/Revenue falls below 3x (currently 4.2x) or comparable private AI healthcare companies see down-rounds in 2026–2027"
        - "Recalibrates comparable valuation framework downward; $1B entry becomes increasingly difficult to justify even under bull assumptions"
        - "Downward revision of entry range; push for price adjustment or wait for financial disclosures that support a higher multiple"
      - - "Leadership departure at CEO / CTO level"
        - "Founder departure or unplanned C-suite change without a clearly named, credentialed successor within 60 days"
        - "Network and biopharma relationships may be founder-dependent; key-person risk is amplified in a company with undisclosed partner relationships"
        - "Immediate engagement with board on succession plan; hold deployment of any committed capital pending clarity"
    notes: >-
      Triggers are forward-looking observations derived from the identified risk register
      (chapter 07-risks). Thresholds are analyst-defined monitoring criteria, not contractual
      covenants. Each trigger should be tracked in an active monitoring program with quarterly
      check-ins against the specified observable threshold.
    claimRefs:
