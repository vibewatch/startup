        - QV017
        - QV028

    - type: missing-source
      severity: material
      topic: biopharma internal platform builds reducing Forus dependency
      missingEvidence: >-
        No public evidence documents that any of Forus's five undisclosed biopharma partners
        have built or announced an internal alternative to Forus's prescription-access
        automation platform, or that any major biopharma has insourced this workflow as of
        June 2026.
      whyItMatters: >-
        The risk that biopharma partners 'build it themselves' is a standard anti-thesis for
