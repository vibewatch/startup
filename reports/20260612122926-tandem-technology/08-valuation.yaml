    approximationNotes: >-
      All ranges are analyst estimates. Revenue anchor ($50M) is company-reported via Forbes,
      not audited. Multiples are derived from Waystar public EV/Revenue (4.2x), private AI
      healthcare growth-stage range (10–15x), and Abridge Series E ARR multiple (~53x). Gross
      margin, NRR, and concentration assumptions are scenario-specific and unverified.
      M&A premium estimate (2–3x DCF) is based on precedent from Change Healthcare acquisition
      and Surescripts strategic moat analogy, not a binding indication of interest.
