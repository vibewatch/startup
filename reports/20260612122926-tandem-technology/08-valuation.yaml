          detail: "Network: ~80% US zip codes, all 50 states; Revenue: ~$50M annualized (Forbes); Funding: >$160M raised; Partners: 5 of top-10 global biopharma."
        - id: strategic-value
          label: "Strategic Value Layer ($600M–$1B+)"
          detail: "Prescription-routing network, biopharma commercial access data asset, and free-to-provider moat create a strategic acquisition target for clearinghouse, payer, or pharmacy chain incumbents."
        - id: risk-discounts
          label: "Risk-Discount Factors"
          detail: "Biopharma concentration (undisclosed); Gross margin opacity; Regulatory rearchitecture risk (35+ state bills); Waystar multiple compression precedent (-43.5% in 2026)."
        - id: diligence-gate
          label: "Six Blocking Diligence Items"
          detail: "Gross margin, burn rate, NRR, contract concentration, BAA/de-identification governance, clearinghouse redundancy — none publicly available."
        - id: base-valuation
          label: "Base-Case Fair Value: $500M–$750M"
          detail: "10–15x trailing revenue, 1.5-2x growth assumption, 55–70% gross margin estimated; $1B mark is 30–50% stretched under base assumptions."
        - id: recommendation
          label: "Recommendation: Track / Research More"
          detail: "Entry at $1B requires bull-case confirmation (>65% GM, >105% NRR, diversified partners). Secondary market entry at $400M–$700M provides margin of safety. NDA diligence resolving six blocking items could shift call to buy."

  - id: FV002
    title: Valuation / Return Range
    type: range
    layout: wide
    summary: >-
      Bull, base, and bear valuation ranges for Forus as of June 2026, derived from
