  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: gross margin and COGS structure
      missingEvidence: >-
        Audited or management-accounts income statement showing gross margin, COGS composition,
        and segment contribution margin for the biopharma commercial access revenue stream.
      whyItMatters: >-
        Gross margin below 55% would make the $1B valuation indefensible under any base or bear
        scenario; above 70% would support the bull entry. This is the single highest-leverage
        diligence item.
      diligencePath: >-
        Request trailing 12-month P&L under NDA; specifically ask for COGS breakdown by category
        (EHR integration, payer API costs, clinical rule maintenance, enterprise sales support).
      relatedQuestionRefs:
        - QV014
        - QV015

    - type: private-evidence-only
      severity: blocking
      topic: net revenue retention and cohort analysis
      missingEvidence: >-
        Biopharma partner cohort data showing NRR, renewal rates for contracts that have reached
        their first renewal window, and expansion revenue per partner over time.
      whyItMatters: >-
        NRR is the highest-signal indicator of biopharma partner satisfaction and contract
        stickiness; NRR below 100% would fundamentally change the investment thesis from a
        high-quality recurring revenue business to a transactional revenue business.
      diligencePath: >-
        Request cohort revenue schedule by partner engagement year; ask for minimum contract
        terms, notice periods, and renewal pipeline status.
      relatedQuestionRefs:
        - QV015
        - QV023

    - type: private-evidence-only
      severity: blocking
      topic: biopharma contract concentration
      missingEvidence: >-
        Revenue distribution across the five undisclosed biopharma partners, including top-1
        and top-2 concentration percentages and minimum annual commitments.
      whyItMatters: >-
        Single-partner concentration above 40% creates a binary risk event; without this data
        the investment cannot be underwritten at the $1B level with confidence.
      diligencePath: >-
        Request top-5 customer revenue concentration schedule under NDA; separately ask for
        contract term and renewal notice period per partner.
      relatedQuestionRefs:
        - QV015
        - QV020

    - type: missing-source
      severity: material
      topic: independent third-party product validation
      missingEvidence: >-
        No KLAS, G2, Gartner Peer Insights, or independent analyst review of Forus/Tandem
        Technology's product quality, clinical outcomes, or customer satisfaction is publicly
        available as of June 2026.
      whyItMatters: >-
        Enterprise health system procurement typically requires independent quality validation;
        absence of independent reviews limits the ability to verify that provider satisfaction
        metrics match company claims, and reduces comparability to Abridge (KLAS #1) and other
        independently validated competitors.
      diligencePath: >-
        Commission or request KLAS evaluation; gather 3-5 reference calls from non-company-
        selected customers under structured interview protocol.
      relatedQuestionRefs:
        - QV021
        - QV024

    - type: missing-source
      severity: material
      topic: AI healthcare valuation inflation and down-round risk
      missingEvidence: >-
        No public analyst reports, Pitchbook, or Sacra coverage specifically addresses
        down-round risk or valuation inflation concerns for AI prior authorization companies
        as a category, as of June 2026.
