company:
  name: Baseten
chapter:
  number: 8
  title: Valuation
  summary: >-
    Baseten's June 2026 Series F supplied substantial growth capital but used two
    valuation tranches, at $13 billion and $11 billion, after a $5 billion mark
    five months earlier. The operating evidence is promising, yet public
    disclosure does not support a precise return case, so the price-sensitive
    recommendation is track/research more with high risk and a stretched stance.
sections:
  - id: recommendation-and-financing-context
    title: Recommendation and financing context
    body: >-
      The current call is track/research more, not buy. Baseten announced a $1.5
      billion Series F in June 2026 across two tranches priced at $13 billion and
      $11 billion, following a $300 million financing at a $5 billion valuation
      in January. TechCrunch calculated that the upper mark represented a 160%
      increase in less than half a year and reported that split pricing can boost
      the headline mark. That structure makes the headline valuation a poor
      substitute for an investable price or a fully diluted ownership schedule.
      The company also reported approximately 20x year-over-year revenue growth
      and more than one billion daily inference calls, evidence of momentum but
      not proof of durable margins, retention, or cash generation. Entry should
      therefore depend on verified financing terms and unit economics rather
      than the upper tranche alone.
    claimRefs: [CV001, CV002, CV003, CV012, CV013]
    tableRefs: [TV001]
  - id: thesis-and-anti-thesis
    title: Thesis and anti-thesis
    body: >-
      The thesis combines rapid company-reported growth, named production
      customers, and a product positioned around reliability, multi-cloud
      flexibility, security, and self-hosting. Baseten names Abridge, Cursor,
      Lovable, Notion, and OpenEvidence as users of mission-critical production
      workloads, while its enterprise page claims four-nines uptime. The
      anti-thesis is equally material: Baseten itself describes inference as a
      market full of smart, well-resourced competitors and warns that product
      market fit can be lost as the market changes. Enterprise list pricing is
      not published, and the public evidence does not establish gross margin,
      retention, customer concentration, or contractual duration. The financing
      validates investor demand, but it does not resolve whether growth converts
      into defensible, cash-generative economics.
    claimRefs: [CV006, CV007, CV008, CV010, CV011]
    tableRefs: [TV002]
  - id: scenarios-and-entry-discipline
    title: Scenarios and entry discipline
    body: >-
      Scenario underwriting should use the latest $11 billion to $13 billion
      tranche range as a reference, not as an independently verified fair-value
      band. A third-party market-data page reports roughly $600 million of
      annualized revenue for March 2026; pairing that estimate with the two
      tranche marks yields approximately 18.3x to 21.7x headline
      valuation-to-annualized-revenue. That ratio is illustrative rather than an
      enterprise-value multiple because the capital structure, cash balance,
      debt, preferences, and exact revenue definition are not public in the
      retained evidence. The bull case requires durable growth and improving
      economics sufficient to create exit value above the upper tranche. The
      base case requires proof that current scale persists. The bear case is
      multiple compression or a down round if growth normalizes before margins
      and retention are demonstrated.
    claimRefs: [CV001, CV004, CV005, CV014, CV015]
    tableRefs: [TV003]
  - id: exit-readiness-and-diligence
    title: Exit readiness, diligence asks, and thesis breaks
    body: >-
      Baseten has late-stage financing scale, recognizable investors, and
      customer references, but public evidence does not support a numerical IRR,
      hold period, or exit multiple. Before underwriting an entry, investors
      should obtain audited revenue recognition, gross margin by deployment
      model, burn and runway, net revenue retention, cohort expansion, customer
      concentration, committed compute liabilities, and the complete Series F
      cap table and preference stack. An upgrade requires verified economics,
      durable retention, and an entry price that leaves meaningful upside after
      dilution. Thesis breaks include material growth deceleration, failure to
      sustain enterprise reliability, severe margin compression from compute
      costs, customer concentration that makes reported scale fragile, or
      financing terms that subordinate new common ownership. Until those checks
      close, exit readiness remains an open underwriting question rather than an
      assumed consequence of the headline valuation.
    claimRefs: [CV006, CV009, CV013, CV015, CV016]
    figureRefs: [FV001]
