callouts:
  - calloutType: recommendation
    title: Price-sensitive conclusion
    body: >-
      Track Baseten and pursue diligence, but do not treat the $13 billion
      tranche as a single, independently validated fair-value mark.
    claimRefs: [CV001, CV012, CV013]
  - calloutType: risk
    title: No public return model
    body: >-
      The retained evidence does not disclose enough capital-structure,
      retention, margin, or cash-flow detail to support a numerical IRR or exit
      multiple.
    claimRefs: [CV015, CV016]
