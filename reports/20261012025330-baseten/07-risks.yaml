company:
  name: "Baseten"
chapter:
  number: 7
  title: "Risks"
  summary: >-
    Baseten's principal underwritten risks are the gap between company-claimed controls and
    independently verified assurance, the operational complexity of multi-cloud GPU infrastructure,
    and the capital and execution expectations attached to rapid financing. The public evidence
    supports mitigations, but not audited SLA performance, incident history, burn, runway, supplier
    concentration, or customer concentration.
sections:
  - id: "risk-posture"
    title: "Risk posture and underwriting frame"
    body: >-
      Baseten sells infrastructure for mission-critical model workloads, so failure impact is
      structurally higher than for a non-critical developer tool. The company says named AI
      applications depend on its production platform, while its documentation describes a broad
      operating surface spanning model containers, GPU capacity, regions, scaling, and
      observability. That combination makes reliability, security, and capacity management central
      underwriting questions rather than peripheral product details. Public mitigations include
      multi-cloud capacity management, dedicated deployments, regional placement, observability,
      and self-hosting. However, the retained corpus is dominated by company-issued descriptions
      and does not independently test uptime, controls, failover, or customer isolation. The heatmap
      therefore ranks residual diligence exposure, not confirmed incidents or control failures.
    claimRefs:
      - "CR005"
      - "CR006"
      - "CR007"
      - "CR013"
      - "CR015"
    tableRefs:
      - "TR001"
    figureRefs:
      - "FR001"
  - id: "regulatory-data-control"
    title: "Regulatory, privacy, and data-control exposure"
    body: >-
      Baseten states that it is SOC 2 Type II certified and HIPAA compliant across its hosting
      options, supports region-restricted deployment, encrypts model weights and source code, and
      does not store inference request inputs or outputs. Those are relevant mitigations for
      sensitive workloads, but they are claims about the control environment rather than a
      substitute for reviewing the current audit report, BAA, DPA, subprocessor list, deletion
      behavior, and contractual SLA. A secondary analysis also notes that some regulated workloads
      may still require dedicated or on-premises infrastructure. The appropriate conclusion is
      therefore not that a compliance defect exists, but that legal and security exposure cannot be
      fully sized from the assigned public sources. Investment approval should be conditioned on
      contract-level and auditor-level evidence.
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR003"
      - "CR004"
      - "CR015"
  - id: "operations-dependencies"
    title: "Operational and dependency risk"
    body: >-
      The operating model spans multiple clouds, regions, models, GPU types, deployment modes, and
      inference engines. This breadth can improve resilience and customer choice, but it also raises
      the number of scheduler, capacity, release, observability, and vendor interfaces that must
      behave correctly under load. Baseten claims four-nines uptime, cloud-agnostic autoscaling,
      failover options, and round-the-clock engineering support; none of the assigned independent
      sources verifies those performance claims. An investor's June statement that new capital
      would be invested aggressively in capacity, infrastructure, and research reinforces the scale
      of the execution burden. Key monitors are sustained SLA performance, capacity-related
      throttling, gross-margin movement, cloud and GPU-vendor concentration, and the share of support
      obligations requiring bespoke engineering.
    claimRefs:
      - "CR005"
      - "CR006"
      - "CR007"
      - "CR012"
      - "CR014"
      - "CR015"
    tableRefs:
      - "TR002"
  - id: "capital-and-thesis-breaks"
    title: "Capital intensity, competitive pressure, and thesis-break triggers"
    body: >-
      Baseten announced a $300 million financing at a $5 billion valuation in January 2026 and said
      it had raised $585 million in total at that point. Two secondary sources later reported a
      $1.5 billion Series F at a $13 billion valuation, while one of them estimated a $600 million
      annualized revenue run rate as of March. That estimate is revenue run rate, not ARR, cash, or
      audited revenue, and the assigned evidence does not disclose burn, runway, margin, capacity
      commitments, or financing terms. A secondary competitive analysis also identifies both
      specialist inference vendors and hyperscalers as alternatives. Thesis-break triggers should
      therefore include repeated SLA misses, inability to secure economical capacity, materially
      worsening gross margin, customer or supplier concentration above the investment committee's
      limits, or new financing that implies a material down-round or preference overhang.
    claimRefs:
      - "CR008"
      - "CR009"
      - "CR010"
      - "CR011"
      - "CR012"
      - "CR013"
      - "CR014"
    tableRefs:
      - "TR003"
