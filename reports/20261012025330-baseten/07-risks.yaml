  evidenceGaps:
    - type: "private-evidence-only"
      severity: "material"
      topic: "compliance"
      missingEvidence: >-
        Current SOC 2 report and exceptions, BAA, DPA, subprocessor list, penetration-test summary,
        security incidents, SLA language, and historical SLA attainment.
      whyItMatters: >-
        Company claims establish mitigation intent but do not size control effectiveness,
        contractual responsibility, or historical failure rates for regulated workloads.
      diligencePath: >-
        Request the documents under NDA, interview security leadership, sample customer contracts,
        and reconcile incidents and service credits to the status and support records.
      relatedQuestionRefs:
        - "QR002"
        - "QR005"
        - "QR008"
      relatedTableRefs:
        - "TR001"
    - type: "private-evidence-only"
      severity: "material"
      topic: "unit-economics"
      missingEvidence: >-
        Audited revenue, ARR reconciliation, gross margin, burn, cash balance, runway, capacity
        commitments, financing preferences, and revenue concentration.
      whyItMatters: >-
        Funding raised is not cash available, and revenue run rate does not establish recurring
        revenue quality or the economics of capacity expansion.
      diligencePath: >-
        Reconcile audited financials to billing and usage cohorts, inspect the cap table and debt,
        and stress-test contracted capacity against base and downside demand.
      relatedQuestionRefs:
        - "QR004"
        - "QR007"
        - "QR008"
      relatedTableRefs:
        - "TR003"
    - type: "private-evidence-only"
      severity: "material"
      topic: "concentration"
      missingEvidence: >-
        Cloud and GPU supplier shares, top-customer revenue shares, retention, contract duration,
        support effort, and vertical concentration.
      whyItMatters: >-
        Multi-cloud availability and named customers do not quantify switching risk, bargaining
        power, correlated outages, or workload durability.
      diligencePath: >-
        Obtain supplier and customer concentration schedules, renewal and churn cohorts, capacity
        contracts, and support-cost allocation by account.
      relatedQuestionRefs:
        - "QR006"
        - "QR008"
      relatedTableRefs:
        - "TR002"
        - "TR003"
    - type: "enumeration-incomplete"
      severity: "minor"
      topic: "regulatory-risk-register"
      missingEvidence: >-
        Comprehensive court, regulator, privacy authority, patent, sanctions, and contract records
        across every operating jurisdiction.
      whyItMatters: >-
        The public register covers material visible themes but cannot establish the absence of
        litigation, enforcement, IP disputes, or jurisdiction-specific obligations.
      diligencePath: >-
        Run jurisdiction-specific legal, regulatory, patent, and sanctions searches and obtain
        management counsel letters before investment committee approval.
      relatedQuestionRefs:
        - "QR001"
        - "QR002"
        - "QR008"
      relatedTableRefs:
        - "TR001"
