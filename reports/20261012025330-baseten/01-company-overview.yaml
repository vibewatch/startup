callouts:
  - calloutType: strength
    title: NVIDIA Strategic Partnership and Inference Market Leadership
    body: >-
      NVIDIA's $150 million direct investment in Baseten's Series E represents a major endorsement from the dominant AI
      chipmaker. This partnership provides Baseten with privileged access to optimize cutting-edge architectures like
      Blackwell B200 and deepens software integration with TensorRT-LLM, creating technical moats against pure GPU
      resellers.
    claimRefs:
      - CO004
      - CO009
  - calloutType: risk
    title: Capacity Bottlenecks and Severe Capital Commitments
    body: >-
      Baseten operates in a fiercely constrained GPU compute market where utilization across its 90 clusters exceeds
      95%. Compounding this, securing frontier hardware like B200s requires 3-to-5 year commitments with 20% to 30%
      upfront cash prepayments, placing intense working capital demands on the company and leaving it vulnerable to
      hardware supply delays.
    claimRefs:
      - CO013
      - CO014
