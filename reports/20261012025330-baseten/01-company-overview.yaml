company:
  name: Baseten
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Baseten is a San Francisco-based AI inference infrastructure company that enables enterprises and AI-native startups
    to deploy, optimize, and serve machine learning models across managed and multi-cloud environments. Founded in 2019,
    the company has raised over $585 million through its January 2026 Series E at a $5.0 billion valuation (and a
    reported $1.5 billion Series F in June 2026 at up to $13.0 billion), backed by IVP, CapitalG, and NVIDIA. While
    customer adoption spans leading AI applications like Cursor, Abridge, and OpenEvidence, rapid scaling has heightened
    working capital requirements and operational exposure to global compute supply constraints.
sections:
  - id: corporate-identity-and-inference-platform
    title: Corporate Identity and Model Inference Architecture
    body: >-
      Baseten (legal entity BaseTen Labs, Inc.) was founded in 2019 and is headquartered in San Francisco, California,
      operating in the AI inference infrastructure sector. The company provides a high-performance software platform
      designed to solve the critical operational bottleneck between trained machine learning models and real-time
      production serving. Its offering encompasses containerization via the open-source Truss framework, automated
      compilation using engines like TensorRT-LLM and vLLM, custom model runtimes, and cross-cloud GPU scheduling across
      managed and self-hosted environments. Rather than focusing on model training or raw GPU reselling, Baseten
      specializes exclusively in production inference execution, offering enterprise-grade security including SOC-2 Type
      II certification and HIPAA compliance.
    claimRefs:
      - CO001
      - CO002
      - CO006
      - CO007
    tableRefs:
      - TO001
    figureRefs:
      - FO001
  - id: founders-executive-leadership-and-governance
    title: Executive Leadership, Founder Backgrounds, and Governance
    body: >-
      Baseten was co-founded by CEO Tuhin Srivastava, CTO Amir Haghighat, Chief Scientist Philip Howes, and Pankaj
      Gupta. Srivastava and Howes previously co-founded HR analytics startup Shape (acquired by Reflektive in 2018)
      after working as machine learning engineers at Gumroad, where Haghighat served as Head of Engineering. Gupta
      contributed deep distributed systems expertise from his tenure at Uber. The founding team combines technical
      fluency in machine learning workflows with systems-engineering background. Key-person dependency is concentrated
      across the core technical leadership, particularly given the specialized performance engineering required to
      operate low-latency inference runtimes. Comprehensive public disclosure regarding board committee structures,
      independent directors, and founder equity voting control remains unavailable.
    claimRefs:
      - CO002
      - CO003
      - CO008
    tableRefs:
      - TO002
  - id: capitalization-investor-syndicate-and-valuation
    title: Capitalization History, Lead Investors, and Valuation Trajectory
    body: >-
      Baseten's financing trajectory illustrates an extraordinary acceleration in private valuation and institutional
      backing. Following an initial seed investment from Greylock Partners in 2019 and a $12 million Series A in 2022,
      the company completed a $40 million Series B in March 2024. In February 2025, Baseten raised a $75 million Series
      C at an $825 million post-money valuation. Momentum surged further with a $150 million Series D led by BOND in
      September 2025 at $2.15 billion, culminating in a $300 million Series E in January 2026 at a $5.0 billion
      valuation co-led by IVP and CapitalG with a $150 million strategic investment from NVIDIA. Later reporting in June
      2026 indicated an oversubscribed $1.5 billion Series F led by Altimeter Capital at up to a $13.0 billion headline
      valuation, bringing cumulative capital raised to $2.08 billion.
    claimRefs:
      - CO004
      - CO005
      - CO009
      - CO010
    tableRefs:
      - TO003
  - id: operational-scale-and-capacity-crunch-risks
    title: Commercial Scale, Utilization Pressures, and Operational Constraints
    body: >-
      Baseten serves mission-critical workloads for leading AI-native businesses including Cursor, Abridge, Clay,
      OpenEvidence, Lovable, and Notion. Platform usage expanded rapidly through 2025 and 2026, with leadership
      reporting that 95% of processed tokens stem from custom, fine-tuned customer models rather than off-the-shelf
      public weights. However, this explosive demand introduces severe operational and capital headwinds. Fleet GPU
      utilization across 90 clusters and 18 clouds has reached the mid-90s—a level management characterizes as
      uncomfortably high amid global compute scarcity. Acquiring next-generation GPU hardware such as NVIDIA Blackwell
      B200s increasingly demands multi-year supply commitments with 20% to 30% upfront cash prepayments, creating
      substantial working capital requirements. Furthermore, unaudited revenue figures, undocumented net revenue
      retention, and hyperscaler competition from AWS, Google Cloud, and Azure represent major diligence gaps.
    claimRefs:
      - CO011
      - CO012
      - CO013
      - CO014
