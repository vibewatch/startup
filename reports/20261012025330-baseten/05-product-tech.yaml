chapter:
  number: 5
  title: Product & Technology
  summary: Baseten delivers an enterprise-grade AI inference infrastructure platform operating across 87 multi-cloud clusters that process over one billion daily requests using optimized open runtimes and Truss packaging, counterbalanced by continuous replica-hour pricing floors and cold-start latency constraints.
sections:
  - id: architecture-and-operating-model
    title: Operating Model and Multi-Cloud Infrastructure Architecture
    body: Baseten operates as a mission-critical AI inference infrastructure platform designed to deploy, scale, and serve large language models and compound AI systems in production. Rather than acting as a simple GPU reseller or a purely proprietary model provider, the company provides systems software that unifies heterogeneous compute resources into a reliable, enterprise-grade serving layer. As of mid-2026, Baseten operates across 87 globally distributed clusters spanning 18 distinct cloud providers, handling over one billion production inference calls each day. This multi-cloud architectural topology enables Baseten to route customer workloads dynamically based on GPU availability, geographic latency requirements, and cost efficiency, shielding customers from regional capacity shortages and individual provider outages. The platform's foundational architecture bridges low-level hardware characteristics with high-level orchestration, adapting standard Kubernetes primitives to handle the unique scheduling, memory, and networking demands of modern GPU computing.
    claimRefs:
      - CE001
      - CE009
    tableRefs:
      - TE003
    figureRefs:
      - FE001
  - id: product-portfolio-and-packaging
    title: Product Portfolio, Deployment Modalities, and Framework Abstractions
    body: 'The core entry point for engineering teams building on Baseten is Truss, an open-source model packaging framework created and maintained by the company. Truss provides an opinionated Python abstraction centered on load and predict methods, accompanied by a declarative configuration file specifying hardware requirements, system packages, and Python dependencies. Around this packaging foundation, Baseten offers three primary commercial deployment options: fully managed Baseten Cloud, single-tenant dedicated clusters, and self-hosted VPC deployments running directly inside customer cloud infrastructure. The self-hosted model allows security-conscious organizations to keep proprietary model weights and sensitive inference data strictly within their own security boundaries while maintaining an automated failover capability to Baseten Cloud. Through its managed model garden, Baseten also provides turnkey access to leading open-source models, enabling developers to run pre-optimized implementations of frontier open-weight architectures alongside custom fine-tuned checkpoints.'
    claimRefs:
      - CE002
      - CE005
      - CE011
    tableRefs:
      - TE001
  - id: developer-workflow-and-production-serving
    title: Developer Workflow, Runtime Optimization, and Forward-Deployed Engineering
    body: Baseten's serving pipeline is engineered to eliminate the operational complexity of deploying custom machine learning models at scale. Once an engineer packages an artifact using Truss, Baseten automatically builds container images, provisions appropriate GPU hardware, and establishes autoscaling endpoints that can scale up dynamically or down to zero when idle. To achieve competitive latency and throughput, Baseten integrates leading open-source inference engines, including vLLM, SGLang, and NVIDIA TensorRT-LLM, fine-tuning continuous batching, memory allocation, and kernel execution for specific model architectures. Beyond purely software-based automation, Baseten differentiates its go-to-market and operational delivery through forward deployed engineering teams that report directly to engineering leadership. These engineers embed directly with major production customers—including category leaders such as Cursor, Notion, Abridge, and OpenEvidence—to co-engineer custom serving optimizations, diagnose tail latency bottlenecks, and directly inform internal product roadmap priorities.
    claimRefs:
      - CE003
      - CE004
      - CE010
      - CE012
    tableRefs:
      - TE002
  - id: security-compliance-and-technical-tradeoffs
    title: Enterprise Governance, Data Isolation, and Commercial Tradeoffs
    body: To satisfy rigorous procurement requirements across healthcare, legal, and financial services, Baseten embeds comprehensive security and compliance capabilities into its platform architecture. The service is SOC 2 Type II certified, HIPAA compliant, and GDPR compliant by default across all hosting tiers. Critically for enterprise trust, Baseten enforces a strict zero-data-retention policy, guaranteeing that customer inference inputs and outputs are never permanently stored, logged, or utilized for model training. Administrative governance is delivered through role-based access control, single sign-on, team-level workspace partitioning, and audit-ready observability tools encompassing distributed tracing and custom metrics. Alongside these enterprise strengths, independent evaluations highlight several operational and financial tradeoffs. Baseten's replica-hour pricing model requires customers to pay continuously for standing GPU instances regardless of request volume, resulting in substantial cost floors for high-availability multi-replica deployments. Furthermore, serverless cold starts of 30 to 90 seconds for large models force latency-critical applications to maintain expensive warm standby instances.
    claimRefs:
      - CE006
      - CE007
      - CE008
      - CE013
      - CE014
