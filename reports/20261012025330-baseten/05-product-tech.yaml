callouts:
  - calloutType: insight
    title: Inference Engineering as Strategic Category Moat
    body: Baseten's primary differentiation lies in formalizing inference engineering as a systems discipline distinct from model training. By bundling low-level runtime engine optimizations (vLLM, TensorRT-LLM) with multi-cloud cluster orchestration across 18 providers, Baseten shields AI development teams from complex GPU infrastructure maintenance while maintaining production uptime.
    claimRefs:
      - CE001
      - CE003
      - CE004
  - calloutType: risk
    title: Replica-Hour Cost Floor and Cold-Start Tradeoffs
    body: 'The commercial reality of Baseten''s hosting model imposes significant structural tradeoffs: teams operating dedicated replicas face continuous hourly charges regardless of request throughput, while serverless endpoints suffer from 30 to 90-second cold starts when scaling up from zero. Furthermore, reliance on the Truss abstraction creates real switching friction when evaluating alternative bare-metal options.'
    claimRefs:
      - CE007
      - CE008
      - CE011
