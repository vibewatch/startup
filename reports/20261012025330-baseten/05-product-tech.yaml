  - id: TE002
    title: Workflow / use-case table
    columns:
      - User Job
      - Current Baseline Workflow
      - Baseten Solution
      - Measurable Benefit
      - Technical Limitation
    rows:
      - - Deploying custom fine-tuned LLM
        - Manual Dockerization, CUDA configuration, and Kubernetes YAML authoring
        - Truss packaging with automated container build and GPU scheduling
        - Reduces deployment cycle from days to minutes
        - Ties deployment definition to Baseten-specific runtime class conventions
      - - Handling bursty traffic spikes
        - Over-provisioning dedicated GPU clusters at continuous full cost
        - Zero-to-infinity autoscaling across distributed GPU clusters
        - Eliminates idle GPU billing during traffic lulls
        - Cold-start latency penalties of 30-90 seconds on container scale-up
      - - Serving latency-sensitive inference
        - Standard unoptimized HuggingFace model pipelines
        - Optimized runtimes integrating vLLM, SGLang, and TensorRT-LLM
        - Achieves higher token throughput and lower time-to-first-token
        - Lacks published independent head-to-head performance benchmarks
      - - Operating in regulated sectors
        - Complex VPC networking, custom audit logs, and self-managed BAA/DPA
        - Out-of-the-box SOC 2 Type II, HIPAA, and GDPR compliance controls
        - Immediate compliance clearance for enterprise procurement
        - Single-tenant clusters require high commitment and management overhead
    notes: Workflow comparisons are derived from customer technical case studies, Baseten enterprise whitepapers, and competitor benchmarking reports.
    claimRefs:
      - CE002
      - CE003
      - CE006
      - CE008
      - CE010
  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Architecture Layer
      - Primary Technology Component
      - Operational Role
      - Key Dependency
      - Identified Technical Risk
    rows:
      - - Model Packaging
        - Truss (Python packaging library)
        - Defines dependencies, weights loading, and inference prediction logic
        - Python runtime and Docker containerization
        - Abstraction friction and lock-in requiring refactoring if migrating
      - - Runtime Engine
        - vLLM, SGLang, and TensorRT-LLM
        - Executes continuous batching, tensor parallelism, and kernel optimization
        - NVIDIA CUDA ecosystem and open-source engine stability
        - Upstream breaking changes across rapidly evolving inference engines
      - - Compute Orchestration
        - GPU-adapted Kubernetes clusters
        - Manages scheduling, live reloads, and multi-node model execution
        - Cloud provider GPU node availability and provisioning APIs
        - Cold-start delays when pulling large model weights during scale-out
      - - Global Infrastructure
        - Multi-cloud network (87 clusters, 18 clouds)
        - Routes traffic, optimizes latency, and executes cross-cloud failover
        - 18 disparate cloud provider SLAs and interconnects
        - Network egress cost volatility and heterogeneous provider reliability
    notes: Architecture components compiled from technical blogs, Baseten infrastructure engineering presentations, and multi-cloud operational disclosures.
