callouts:
  - calloutType: risk
    title: Hyperscaler Compute Arbitrage and Margin Compression
    body: >-
      Because specialized inference platforms like Baseten rent underlying GPU capacity from hyperscalers and GPU clouds
      rather than owning datacenters or silicon, gross margins remain vulnerable to wholesale price swings. If
      hyperscalers aggressively bundle inference into existing cloud enterprise agreements, independent serving
      providers face severe margin pressure.
    claimRefs:
      - CP008
      - CP010
      - CP011
  - calloutType: insight
    title: Multi-Cloud Portability as Enterprise Insurance
    body: >-
      Baseten capability to orchestrate model serving across 18 clouds and 87 clusters provides enterprise customers
      with an operational hedge against localized GPU shortages and datacenter outages, creating an architectural moat
      that raw compute providers cannot easily replicate.
    claimRefs:
      - CP001
      - CP009
      - CP014
