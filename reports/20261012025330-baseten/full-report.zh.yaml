    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与模型推理架构
        blocks:
          - type: paragraph
            body: >-
              Baseten（法定实体为 BaseTen Labs, Inc.）成立于 2019 年，总部位于加利福尼亚州旧金山，所在领域是 AI
              推理基础设施。公司提供高性能软件平台，解决训练完成的机器学习模型与实时生产服务之间的关键运营瓶颈。产品覆盖基于开源 Truss 框架的容器化、借助 TensorRT-LLM 和 vLLM
              等引擎的自动编译、自定义模型运行时，以及在托管和自托管环境之间调度 GPU。Baseten 不做模型训练或原始 GPU 转售，而是专注于生产推理执行，并提供包括 SOC-2 Type II 认证和 HIPAA
              合规在内的企业级安全能力。
            claimRefs:
