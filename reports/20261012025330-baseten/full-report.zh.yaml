            body: >-
              在 Baseten 上构建的工程团队，核心入口是 Truss——由公司创建并维护的开源模型封装框架。Truss 提供以 load 和 predict 方法为中心的约定式 Python
              抽象，并配有声明式配置文件，用来指定硬件要求、系统包和 Python 依赖。围绕这一封装基础，Baseten 提供三种主要商业部署选项：全托管的 Baseten
              Cloud、单租户专用集群，以及直接运行在客户云基础设施内的自托管 VPC 部署。自托管模式让重视安全的组织把专有模型权重和敏感推理数据严格留在自己的安全边界内，同时保留自动故障切换到 Baseten Cloud
              的能力。通过托管模型园，Baseten 还提供领先开源模型的开箱即用访问，让开发者可以运行前沿开放权重架构的预优化实现以及自定义微调 checkpoint。
