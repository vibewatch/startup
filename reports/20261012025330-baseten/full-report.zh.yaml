            body: >-
              Baseten 财务可行性的核心，在于能否在调配物理和虚拟 GPU 算力的同时，持续提取软件毛利。提供高性能模型服务，需要向底层硬件主机和 neocloud
              支付大量算力转嫁成本，覆盖其多云足迹（CI005、CI009）。Baseten 对原始算力收取溢价：专用托管 H100 实例约为 $6.50 per hour，而超大规模云原始算力基准约为 $3.93 per
              hour；溢价由开箱即用的 kernel 优化、冷启动缩短和多云韧性支撑（CI001、CI005）。公司案例显示，优化后的部署相较未托管的内部集群或闭源商业 API，最高可节省 30% 至 40%
              的成本（CI003、CI005）。但 Baseten
              未公开披露经审计的毛利率、托管销货成本（COGS）或净收入留存（NRR），分析师无法独立验证当前规模带来的是典型基础设施软件毛利率（65%–75%），还是压缩后的 neocloud
              转售毛利率（35%–50%）（CI010、CI011）。此外，爆发式增长的初创企业客户集中度较高；一旦核心客户每个工作负载的月度推理支出超过约 $200,000
