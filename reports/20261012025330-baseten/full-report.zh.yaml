      - number: '5.4'
        title: 企业治理、数据隔离与商业权衡
        blocks:
          - type: paragraph
            body: >-
              为满足医疗、法律和金融服务领域严格的采购要求，Baseten 将全面的安全与合规能力嵌入平台架构。服务在所有托管层级默认具备 SOC 2 Type II 认证、HIPAA 合规和 GDPR
              合规。对企业信任至关重要的是，Baseten
              执行严格的零数据留存政策，保证客户推理输入和输出不会被永久存储、记录或用于模型训练。管理治理通过基于角色的访问控制、单点登录、团队级工作区隔离，以及覆盖分布式追踪和自定义指标的可审计可观测性工具实现。独立评估也指出若干运营和财务权衡。Baseten
