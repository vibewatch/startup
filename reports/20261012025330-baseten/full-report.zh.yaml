  - id: FR001
    title: 剩余风险热力图
    type: matrix
    summary: 基于指定公开证据，对可能性、影响和缓解成熟度进行序数式投资评估；不代表经过测量的事故概率。
    data:
      columns:
        - label: 可能性
          detail: 根据运营模式和证据缺口推断的定性风险敞口
        - label: 影响
          detail: 风险发生时可能造成的投资影响
        - label: 缓解成熟度
          detail: 指定公开语料中缓解措施证据的强度
      rows:
        - label: 安全与合规证明
          note: 控制措施为公司自述；底层保证材料未留存
          values:
            - label: 中
              detail: 存在敏感负载敞口，但尚未认定有违规
            - label: 高
              detail: 控制或合同失败可能阻断受监管的生产使用
            - label: 部分
              detail: 已描述认证和控制措施，但需审查独立材料
        - label: 可靠性与容量执行
          note: 架构覆盖面广，融资正被投向容量
          values:
            - label: 中
              detail: 多云复杂性和快速扩张带来反复出现的执行风险
            - label: 高
              detail: 关键任务负载使长期服务或容量故障后果严重
            - label: 部分
              detail: 已描述自动扩缩容和故障切换；缺少独立 SLA 历史
        - label: 资本密集度与预期风险
          note: 据报道的大额融资抬高了投资逻辑中的运营里程碑要求
          values:
            - label: 中
              detail: 风险取决于未披露的烧钱速度、利润率、容量承诺及融资条款
            - label: 高
              detail: 增长或利润率未达预期可能削弱融资和估值支撑
            - label: 有限
              detail: 融资金额已有报道，但现金可用性和经济性未披露
        - label: 云与 GPU 供应商依赖
          note: 平台跨供应商管理容量，但供应商份额和承诺未披露
          values:
            - label: 中
              detail: 稀缺、重新定价或相关故障仍是合理的基础设施风险
            - label: 高
              detail: 容量损失或投入成本上升可能损害服务和利润率
            - label: 部分
              detail: 多云管理已有文档说明；集中度和合同条款缺失
        - label: 客户集中度与转为自建
          note: 已点名的生产客户公开可见，但账户层面的经济性和留存数据并不公开
          values:
            - label: Unknown
              detail: 指定语料中没有头部客户份额、流失率或合同期限数据
            - label: 高
              detail: 大型工作负载流失或转为内部运行，可能降低利用率并损害收入质量
            - label: 有限
              detail: 多个具名用户证明了产品有人采用，但不足以证明客户已分散
        - label: 竞争性替代
          note: 专业推理服务商和超大规模云厂商被列为替代选项
          values:
            - label: 中等
              detail: 客户可以比较托管型专业服务商、自托管方案和云原生服务
            - label: 中高
              detail: 价格或性能压力可能压低利润率，并削弱工作负载留存
            - label: 部分
              detail: 公司称开发者体验和部署灵活性构成差异化
    approximationNotes: 定性分类是分析师判断，不代表数值概率；融资额不视为可用现金，没有事故记录也不视为未发生事故的证明。
    claimRefs:
      - CR008
      - CR010
      - CR012
      - CR015
  - id: FV001
    title: 从运营验证到入场纪律的建议逻辑
    type: flow
    summary: 这条顺序决策链将公司披露的运营验证、融资价格、缺失的投资判断输入和升级条件分开。
