          - type: paragraph
            body: >-
              公开记录的客户部署，在不同生产工作负载中证实了可见的效率、成本和性能提升。在创作者媒体处理领域，创作者平台 Patreon 将音频转写工作负载迁移到通过 Baseten 部署的 OpenAI Whisper
              模型，据称节省 440 个工程师工时、每年节省 $600,000，GPU 支出总体下降 70%。在医疗文档领域，临床 AI 服务商 Abridge 以 Baseten
              支撑其生产环境中的环境式临床记录模型；其管理层强调，相比交易型供应商关系，Baseten 的正常运行时间、开发者体验和协作工程支持更优。在开发者效率软件领域，邮件平台 Superhuman 迁移到 Baseten
              的专业基础设施后，embedding 推理速度提升 80%，从而实现实时语义消息检索。此外，与 NVIDIA 的技术合作显示，用 TensorRT-LLM 和搭载 A100 GPU 的 AWS P4d 实例优化
              Baseten 的开源 Truss 框架，可将冷启动延迟从最多五分钟降至 5–10 秒，并使生产客户模型的推理吞吐翻倍。
            claimRefs:
              - CU001
              - CU003
              - CU004
              - CU007
              - CU008
          - type: table
            tableRef: TU003
            claimRefs:
              - CU001
              - CU003
              - CU004
              - CU007
              - CU008
      - number: '6.4'
        title: 客户旅程、扩张循环与平台锁定
        blocks:
          - type: paragraph
            body: >-
              Baseten 的“先落地、再扩张”路径从单个开发者入口开始，逐步扩展到组织级基础设施承诺。开发者通常通过开源 Truss 封装库或预优化 Model API
              进入，先完成模型容器化并在本地验证延迟基准，再把原型端点部署到托管的 Baseten Cloud。流量接近生产规模后，客户转向 Baseten 的多云容量管理（MCM）层；该层自动在 18
              家云服务商之间调度副本，绕开单一供应商的 GPU 短缺，并维持低于 200ms 的延迟 SLA。受监管客户和企业客户随后扩展到单租户集群、VPC
              对等连接和混合配置，让推理在客户私有云内执行并自动故障切换。随着内部工程团队部署更多模型形态——文字、音频转写、图像生成和语义 embedding——并使用 Baseten Training 和 Baseten
              Loops 进行后训练对齐及强化学习工作流，扩张速度进一步加快。
            claimRefs:
              - CU001
              - CU002
              - CU007
              - CU009
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU002
              - CU007
              - CU009
      - number: '6.5'
        title: 留存持久性、流失与客户集中度风险
        blocks:
          - type: paragraph
            body: >-
              尽管增长指标亮眼，Baseten 的按用量计费商业模式仍带来结构性的持续性和客户集中度风险。收入直接随计量的 GPU
              时长和推理量增长，而不是来自多年期软件订阅承诺，因此收入规模会立即受到客户流量波动、算法优化收益或宏观支出收缩影响。客户集中度也是重大脆弱点：Cursor 和 Abridge
              等少数高吞吐核心账户，很可能占每日推理总量的过高比例；任何头部客户将工作负载迁回内部或改变架构，都会立即影响收入运行率。此外，AWS Bedrock、Google Cloud Vertex AI 和
              Microsoft Azure 等主要超大规模云，正越来越多地把专有及开放模型服务捆绑进现有企业云协议，借助自有硬件利润和折扣定价，迫使 Baseten 持续靠更好的软件编排和跨云韧性胜出。
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU014
      - number: '6.6'
        title: 展品
        blocks:
          - type: callout
            title: AI 原生生产工作负载中的关键基础设施护城河
            body: Baseten 已从实验性开发者工具转型为 Cursor、Abridge 等领先 AI 初创企业的关键基础设施，展现出实际的成本和性能优势，包括低于 10 秒的冷启动和 70% 的 GPU 支出削减。
            calloutType: strength
            claimRefs:
              - CU001
              - CU003
              - CU004
              - CU007
          - type: callout
            title: 消费波动与超大规模云去中介化暴露
            body: Baseten 是纯按消费计费的算力编排商，且未披露长期承诺 ARR，因此其收入容易受到核心客户预算周期、模型效率提升，以及 AWS、Google Cloud 和 Azure 等底层超大规模云激进捆绑策略的影响。
            calloutType: risk
            claimRefs:
              - CU010
              - CU011
              - CU014
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险态势与投资判断框架
        blocks:
          - type: paragraph
            body: >-
              Baseten 销售的是关键模型工作负载所需的基础设施，因此一旦故障，影响结构性高于非关键开发者工具。公司称多个已点名的 AI 应用依赖其生产平台；其文档则描述了覆盖模型容器、GPU
              容量、区域、扩缩容和可观测性的广泛运营面。可靠性、安全性和容量管理因此成为核心投资判断问题，而不是边缘产品细节。公开披露的缓解措施包括多云容量管理、专用部署、区域放置、可观测性和自托管。不过，现有留存材料主要是公司发布的描述，并未独立测试正常运行时间、控制措施、故障切换或客户隔离。因此，热力图排名的是剩余尽调暴露，而非已确认的事故或控制失效。
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR013
              - CR015
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR015
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR008
              - CR010
              - CR012
              - CR015
      - number: '7.2'
        title: 监管、隐私与数据控制暴露
        blocks:
          - type: paragraph
            body: >-
              Baseten 称其所有托管选项均通过 SOC 2 Type II 认证并符合
              HIPAA，支持区域限定部署，加密模型权重和源代码，且不存储推理请求的输入或输出。这些措施与敏感工作负载相关，但它们只是公司对控制环境的陈述，不能替代对当前审计报告、BAA、DPA、子处理商清单、删除行为和合同
              SLA
              的审查。另一项分析还指出，一些受监管工作负载可能仍需要专用或本地基础设施。因此，合适的结论不是已经存在合规缺陷，而是仅凭指定公开来源无法完全评估法律和安全暴露。投资审批应以合同层面和审计师层面的证据为前提。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR015
      - number: '7.3'
        title: 运营与依赖风险
        blocks:
          - type: paragraph
            body: >-
              运营模式横跨多云、多个区域、模型、GPU 类型、部署方式和推理引擎。这种广度可以提升韧性和客户选择，但也增加了调度器、容量、发布、可观测性和供应商接口的数量；这些接口必须在负载下正确运行。Baseten
              声称具备四个 9 的正常运行时间、云无关自动扩缩容、故障切换选项和全天候工程支持；指定的独立来源均未验证这些性能主张。投资人 6
              月关于将新资本积极投入容量、基础设施和研究的表态，也凸显了执行负担的规模。关键监测项包括持续 SLA 表现、容量相关限流、毛利率变化、云服务商和 GPU 供应商集中度，以及需要定制工程支持的服务义务占比。
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR012
              - CR014
              - CR015
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR012
              - CR013
              - CR014
              - CR015
      - number: '7.4'
        title: 资本密集度、竞争压力与论点失效触发因素
        blocks:
          - type: paragraph
            body: >-
              Baseten 于 2026 年 1 月宣布以 $5b 估值完成 $300m 融资，并表示届时累计融资额已达 $585m。随后，两家二手来源报道了 $13b 估值的 $1.5b F 轮融资，其中一家估算截至 3
              月的收入运行率为 $600m。该估算指的是收入运行率，不是
              ARR、现金或经审计收入；现有证据未披露烧钱速度、现金续航、利润率、产能承诺或融资条款。另一份二手竞争分析还将专业推理厂商和超大规模云厂商都列为替代方案。因此，论点破坏触发条件应包括 SLA
              反复失约、无法锁定经济可行的算力、毛利率明显恶化、客户或供应商集中度超过投资委员会上限，或新融资隐含大幅下轮融资或优先权悬垂。
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
      - number: '7.5'
        title: 展示
        blocks:
          - type: callout
            title: 决策条件
            body: 不要把认证、四个 9 的可用性或多云架构视为已独立验证。要确认进展，必须取得最新鉴证报告，审阅合同和 SLA、事故与产能历史、供应商与客户集中度，以及经审计的单位经济性。
            calloutType: risk
            claimRefs:
              - CR001
              - CR005
              - CR006
              - CR015
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与融资背景
        blocks:
          - type: paragraph
            body: >-
              当前判断是跟踪 / 继续研究，而不是买入。Baseten 于 2026 年 6 月宣布完成 $1.5b F 轮融资，分两批发行，对应估值分别为 $13b 和 $11b；此前公司在 1 月以 $5b 估值完成
              $300m 融资。TechCrunch 计算称，上档估值在不到半年内上涨了 160%，并报道分档定价可能推高 headline 估值。这种结构下，headline
              估值不能替代可投资价格或完整摊薄后的持股表。公司还披露收入同比增长约 20 倍、每日推理调用超过 10
              亿次，这说明势头强劲，但不能证明利润率、留存或现金创造能力具有持续性。因此，入场应取决于已核实的融资条款和单位经济性，而不能只看上档。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV012
              - CV013
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV012
              - CV013
              - CV015
      - number: '8.2'
        title: 投资主线与反方论点
        blocks:
          - type: paragraph
            body: >-
              这条投资主线由公司披露的快速增长、已点名的生产客户，以及围绕可靠性、多云灵活性、安全和自托管定位的产品共同支撑。Baseten 点名 Abridge、Cursor、Lovable、Notion 和
              OpenEvidence 是关键生产工作负载的用户；其企业页面则宣称可用性达到四个 9。反方同样重要：Baseten
              自己形容推理市场挤满了聪明且资源充足的竞争者，并警告产品市场匹配可能随着市场变化而丧失。企业目录价未公开，公开证据也无法证明毛利率、留存、客户集中度或合同期限。融资验证了投资者需求，但没有回答增长能否转化为可防守、能产生现金的经济性。
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV010
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
              - CV006
              - CV007
              - CV010
              - CV011
              - CV012
      - number: '8.3'
        title: 情景与入场纪律
        blocks:
          - type: paragraph
            body: >-
              情景估值应把最新的 $11b 至 $13b 分档区间作为参考，而不是视为已独立验证的公允价值区间。第三方市场数据页面报告称，2026 年 3 月收入运行率约为 $600m；将这一估算与两档估值配对，可得
              headline 估值 / 年化收入约 18.3x 至 21.7x
              。这个比率仅作示意，不是企业价值倍数，因为留存证据未公开资本结构、现金余额、债务、优先权和收入的确切定义。乐观情景要求增长持久、经济性改善，并足以让退出价值高于上档估值；基准情景要求证明当前规模能够延续；悲观情景则是倍数压缩，或在利润率和留存得到证明前增长正常化引发下轮融资。
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV005
              - CV011
              - CV012
              - CV014
              - CV015
      - number: '8.4'
        title: 退出准备度、尽调要求与论点破坏
        blocks:
          - type: paragraph
            body: >-
              Baseten 已具备后期融资规模、知名投资者和客户背书，但公开证据不足以支持数值化
              IRR、持有期或退出倍数。在评估入场前，投资者应取得经审计的收入确认、按部署模式拆分的毛利率、烧钱速度与现金续航、净收入留存率、队列扩张、客户集中度、已承诺的算力负债，以及完整的 Series F
              股权结构表和优先股堆叠。要上调判断，必须验证经济性和持久留存，并确认入场价格在稀释后仍留下有意义的上行空间。论点破坏包括增长明显减速、无法维持企业级可靠性、算力成本导致利润率严重压缩、客户集中度使已报告规模变得脆弱，或融资条款让新普通股持有人处于次位。在这些检查完成前，退出准备度仍是待解的投资判断问题，不能视为
              headline 估值的必然结果。
            claimRefs:
              - CV006
              - CV009
              - CV013
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV003
              - CV006
              - CV012
              - CV013
              - CV016
      - number: '8.5'
        title: 展示
        blocks:
          - type: callout
            title: 价格敏感结论
            body: 跟踪 Baseten 并推进尽调，但不要把 130 亿美元分档视为单一、已独立验证的公允价值。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV012
              - CV013
          - type: callout
            title: 无公开回报模型
            body: 留存证据没有披露足够的资本结构、留存、利润率或现金流细节，无法支持数值化 IRR 或退出倍数。
            calloutType: risk
            claimRefs:
              - CV015
              - CV016
