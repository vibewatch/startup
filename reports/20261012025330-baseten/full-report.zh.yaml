            title: 容量瓶颈与沉重的资本承诺
            body: >-
              Baseten 所处的 GPU 算力市场极度受限，90 个集群的利用率超过 95%。更棘手的是，获取 B200 等前沿硬件需要 3 至 5 年的承诺，并预付 20% 至 30%
