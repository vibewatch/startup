      - number: '1.3'
        title: 资本化历史、领投方与估值轨迹
        blocks:
          - type: paragraph
            body: >-
              Baseten 的融资轨迹体现出私有市场估值和机构支持的惊人加速。公司 2019 年获得 Greylock Partners 的种子投资，2022 年完成 $12 million 的 Series A，随后于
              2024 年 3 月完成 $40 million 的 Series B。2025 年 2 月，Baseten 以 $825 million 投后估值融资 $75 million 的 Series
              C。势头进一步增强：2025 年 9 月由 BOND 领投 $150 million 的 Series D，估值达到 $2.15 billion；2026 年 1 月，IVP 与 CapitalG 联合领投
              $300 million 的 Series E，估值达到 $5.0 billion，NVIDIA 另投 $150 million 战略资金。2026 年 6 月的后续报道显示，Altimeter Capital
              领投的 Series F 超额认购，融资额为 $1.5 billion，名义估值最高达 $13.0 billion，累计融资额达到 $2.08 billion。
            claimRefs:
              - CO004
              - CO005
              - CO009
              - CO010
          - type: table
            tableRef: TO003
            claimRefs:
              - CO004
              - CO005
              - CO009
      - number: '1.4'
        title: 商业规模、利用率压力与运营约束
        blocks:
          - type: paragraph
            body: >-
              Baseten 为 Cursor、Abridge、Clay、OpenEvidence、Lovable 和 Notion 等领先 AI 原生企业承载关键工作负载。平台使用量在 2025 年和 2026
              年快速增长；管理层称，已处理 token 的 95% 来自客户定制、微调后的模型，而非现成的公开权重。不过，这种爆发式需求也带来严重的运营和资本压力。90 个集群、18 朵云上的 GPU
              机群利用率已达到九成多，管理层在全球算力稀缺的背景下将其形容为高得令人不安。采购 NVIDIA Blackwell B200 等新一代 GPU 硬件，日益需要多年期供应承诺，并预付 20% 至 30%
              的现金，形成显著的营运资金需求。此外，未经审计的收入数字、未披露的净收入留存，以及 AWS、Google Cloud 和 Azure 的超大规模云竞争，都是重大尽调缺口。
            claimRefs:
              - CO011
              - CO012
              - CO013
              - CO014
      - number: '1.5'
        title: 展品
        blocks:
          - type: callout
            title: NVIDIA 战略合作与推理市场领导地位
            body: >-
              NVIDIA 直接向 Baseten 的 Series E 投资 $150 million，是这家主导 AI 芯片厂商对 Baseten 的重要背书。合作让 Baseten 得以优先优化 Blackwell
              B200 等前沿架构，并深化与 TensorRT-LLM 的软件集成，从而对纯 GPU 转售商形成技术护城河。
            calloutType: strength
            claimRefs:
