        title: 运营模式与多云基础设施架构
        blocks:
          - type: paragraph
            body: >-
              Baseten 是面向生产环境部署、扩展并提供大型语言模型和复合 AI 系统服务的关键 AI 推理基础设施平台。公司不是简单的 GPU
