  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、工作负载范围与支出分配
        blocks:
          - type: paragraph
            body: >-
              生产级人工智能市场正沿模型训练与模型推理出现结构性分化。企业生成式 AI 投资的第一波主要集中在基础模型预训练上，消耗了多千张 GPU
              集群的大量资本开支；但生产经济性由推理阶段决定。推理是持续执行训练好的模型，以生成预测、处理结构化输出并驱动面向用户的软件应用。训练工作负载间歇性强、以批处理为主；推理则对延迟敏感、持续运行，并随用户参与度同比例扩张。随着企业
              AI 项目走向成熟，模型支出正从广泛探索转向专用模型服务。如今，应用层公司把模型预算的三成至五成专门投向定制及后训练开源架构，而不是完全依赖封闭式前沿模型
              API。工作负载的转移正在重画可寻址市场边界：原始算力租赁日益商品化，而能优化延迟、编排和多云韧性的专业中间件与运行时软件，才能持续获得企业价值。
            claimRefs:
              - CM001
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM004
              - CM006
              - CM012
      - number: '2.2'
        title: 市场规模视角：TAM、SAM 与定制推理机会
        blocks:
          - type: paragraph
            body: >-
              评估专业人工智能推理的市场机会，需要结合多个规模视角，不能只依赖单一自上而下的预测。行业研究共识认为，更广义的人工智能推理基础设施市场 2025 年约为 106.2 billion dollars，预计到
              2030 年扩大至 255.0 billion dollars，复合年增长率为 19.2%。增长动力来自全行业转变：预计到 2030 年，全部人工智能算力周期的六成至七成 将迁移到实时推理。不过，这个名义 TAM
              汇总了商品化 GPU 硬件、超大规模云虚拟实例和专业服务软件。在更大的市场中，可服务市场聚焦于专用模型执行和自定义模型运行时。在规模化企业平台上，定制和后训练模型占已处理 token
              量的九成五，说明标准现成权重只是过渡性的开发阶段。Baseten 直接位于这一高速增长层，正在 18 家云服务商的 87 至 90 个集群中扩张全球足迹，每日处理超过 10 亿次推理请求，并将收入运行率从 6
              亿美元推向 10 亿美元级别。
            claimRefs:
              - CM002
              - CM003
              - CM005
              - CM006
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM006
              - CM007
              - CM008
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM002
              - CM003
              - CM005
              - CM006
              - CM014
      - number: '2.3'
        title: 买方分层、预算归属与企业采用触发因素
        blocks:
          - type: paragraph
            body: >-
              企业采购和专用推理基础设施的架构采用，沿着不同的技术与经济成熟曲线发展。目标买方主要是两类企业中的机器学习负责人、工程副总裁和 CTO：高速增长的 AI 原生软件初创企业，以及正在转型的中型企业到《财富》500
              强企业。早期原型阶段通常先使用托管模型 API 或通用超大规模云；但应用一旦获得经验证的用户信号、流量开始扩张，基础设施成本和延迟开销就会飙升。迁移到专业推理运行时，据报道可较现有方案降低四成至六成半
              的成本，推动商业切换。Cursor 的自动化软件开发、Abridge 的临床文档和 Notion 的协作知识工作等关键应用，需要四个 9 的可用性、低于 200
              毫秒的响应延迟，以及零停机滚动更新模型。在医疗和金融服务等受监管行业，预算审批与严格的安全保证紧密相连，因此要求 SOC-2 Type II 认证、HIPAA 合规、单租户隔离和区域限定的数据驻留。
            claimRefs:
              - CM007
              - CM009
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
      - number: '2.4'
        title: 增长顺风、硬件瓶颈与规模测算尽调缺口
        blocks:
          - type: paragraph
            body: >-
              推理基础设施市场的长期走势受到强劲需求顺风支撑，但也受到硬件和合同约束的制衡。随着运行时软件优化降低运营推理成本，市场呈现 Jevons 悖论：开发者部署更复杂的多步 agent 工作流，每次交互消耗更长的
              token
              序列，并持续把智能嵌入过去依赖人工的企业流程。然而，物理算力供给是强力的准入闸门。云服务商集群利用率仍处于九成多这一令人不安的区间，获取顶级加速器硬件需要签订三至五年的采购合同，并预付两成至三成的现金。这种营运资金动态不利于规模不足的运营商，却奖励能够跨多个云服务商聚合算力的平台。从投资尽调角度看，披露限制仍很大：公开的第三方市场数据经常把原始
              GPU 硬件转售收入与专有软件编排收入混为一谈。此外，客户合同期限、净收入留存客户群和总流失率仍属私有信息，无法审计验证据称扩张了四倍的扩张率和跨云切换的持久性。
            claimRefs:
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: 展品
        blocks:
          - type: callout
            title: 推理成本的 Jevons 悖论与定制工作负载趋同
            body: >-
              在优化后的运行时中，模型推理成本最高下降 65%，企业需求却呈指数扩张：应用每次用户请求运行更多 token，执行多步 agent 工作流，并把模型预算的 30% 至 50%
              转向专有后训练模型，而不是只依赖封闭式前沿 API。
            calloutType: insight
            claimRefs:
              - CM004
              - CM007
              - CM014
          - type: callout
            title: 上游 GPU 合同转变与资本密集度要求
            body: AI 推理基础设施市场日益受到极度算力稀缺和合同模式变化的影响。采购先进 GPU 集群需要多年期承诺，并预付合同价值的 20% 至 30%，这会惩罚资本不足的参与者并抬高营运资金门槛。
            calloutType: risk
            claimRefs:
              - CM013
              - CM015
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局与服务商分类
        blocks:
          - type: paragraph
            body: >-
              人工智能推理基础设施市场包含多类服务商，争夺生产级机器学习工作负载。第一层是 Together AI、Fireworks AI 和 Baseten
              等专用推理云，专注于以低延迟和高硬件利用率运行开源及微调模型。第二层是 Modal 和 Replicate 等面向开发者的无服务器平台，优化开发者体验和灵活的 Python 执行。第三层是 CoreWeave 和
              Lambda 等原始 GPU 基础设施服务商，提供更底层的算力。最后，Amazon Web Services、Microsoft Azure 和 Google Cloud 等主要超大规模云运营 AWS
              SageMaker、Bedrock 和 Vertex AI 等托管平台。尽管创投追踪数据记录了机器学习软件和应用开发领域超过 500
              家活跃实体，但企业生产服务已集中在能为关键应用保证正常运行时间、安全性和低延迟吞吐的平台上。
            claimRefs:
              - CP002
              - CP006
              - CP007
              - CP015
          - type: table
            tableRef: TP001
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
      - number: '3.2'
        title: 架构差异化与平台能力
        blocks:
          - type: paragraph
            body: >-
              Baseten 以开源 Truss 封装框架、专有引擎优化和多云编排为核心，构建企业级推理栈，从而区别于开发者优先工具和通用云平台。Modal 等面向开发者的工具强调 Python
              函数装饰器和快速原型；Baseten 则面向关键企业工作负载，提供专用集群部署、单租户隔离和基于角色的访问控制。其多云容量管理架构横跨 18 个云环境中的 87
              个集群，可自动跨云扩缩容和故障切换，保护客户免受区域算力短缺影响。此外，Baseten 通过收购 Parsed 向上拓展至后训练和强化学习工作流，让企业客户在生产推理的同时持续优化专有模型。与原始 GPU
              托管商不同，Baseten 管理从封装到可观测性的完整模型服务生命周期。
            claimRefs:
              - CP001
              - CP005
              - CP009
              - CP012
              - CP013
              - CP014
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP009
              - CP012
              - CP013
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP003
