              - CP005
              - CP014
              - CP015
      - number: '3.3'
        title: 定价结构与超大规模云成本差异
        blocks:
          - type: paragraph
            body: >-
              推理市场的定价分为原始基础设施预留和全托管执行层。主要超大规模云以激进的入门价出租基础 GPU 硬件：Amazon Web Services 的 H100 实例约为 $3.93 per hour，而
              Baseten 的托管服务标价接近 $6.50 per hour。不过，Baseten 声称其专业模型运行时、算子融合和自动扩缩容冷启动，可通过提高硬件利用率，比自管云方案节省最高 30% 至 40%
              的成本。Together AI 和 Fireworks AI 等专用推理同业，围绕 Llama、DeepSeek 等热门开源模型的每百万 token 价格激烈竞争，频繁引发价格战。Baseten
              的主要收入模式依赖按用量消费和专用算力时长，因此毛利率从根本上取决于客户定价与底层 GPU 采购成本之间的价差。
            claimRefs:
              - CP003
              - CP004
              - CP008
              - CP010
