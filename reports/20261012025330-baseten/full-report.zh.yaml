            body: >-
              Baseten 的服务流水线旨在消除大规模部署自定义机器学习模型的运营复杂度。工程师用 Truss 封装产物后，Baseten 会自动构建容器镜像、配置合适的 GPU
              硬件，并建立可自动扩缩容的端点：流量上升时扩容，空闲时甚至缩至零。为取得有竞争力的延迟和吞吐，Baseten 集成 vLLM、SGLang 和 NVIDIA TensorRT-LLM
              等领先开源推理引擎，并针对具体模型架构调优连续批处理、内存分配和 kernel 执行。除了纯软件自动化，Baseten
              还通过直接向工程管理层汇报的前置部署工程团队，形成差异化的市场和运营交付方式。这些工程师直接驻入主要生产客户团队，包括 Cursor、Notion、Abridge 和 OpenEvidence
              等品类领导者，共同设计服务优化、诊断尾部延迟瓶颈，并直接影响内部产品路线图优先级。
