        - $11B-$13B 分档区间，对比估计约 $600M 的年化收入参考值
        - 将隐含的约 18.3x-21.7x 比率视为示意值，而非公允价值
    notes: 截至 2026-10-12 的决策判断；年化收入是第三方估计值，不是经审计的 ARR，该比率也不是企业价值倍数。
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV012
      - CV013
      - CV015
  - id: TV002
    title: 投资逻辑与反向逻辑
    columns:
      - 立场
      - 论点
      - 当前证据
      - 哪些变化会改变判断
    rows:
      - - 投资逻辑
        - 需求与规模
        - 公司报告收入同比增长约 20 倍、每日推理调用量超过 1B
        - 独立的收入质量与留存证据将强化这一判断
      - - 投资逻辑
        - 生产环境相关性
        - 已点名的 AI 原生客户及公司自述的四个九正常运行时间，支持其关键任务定位
        - 客户引荐和 SLA 记录将验证其持续性
      - - 反向逻辑
        - 价格跑在证据前面
        - 最高估值在不到六个月内上涨 160%，F 轮采用分档定价
        - 折价入场或经审计的经济性数据，可能恢复回报空间
      - - 反向逻辑
        - 竞争与利润率压力
        - Baseten 承认竞争对手资源充足，且产品市场匹配仍在变化
        - 已证实的毛利率扩张和低流失率将降低这一风险
    notes: 客户、正常运行时间、增长及竞争定位证据均由公司或投资人提供，除非另有明确归因。
    claimRefs:
      - CV002
      - CV003
      - CV006
      - CV007
      - CV010
      - CV011
      - CV012
  - id: TV003
    title: 乐观、基准与悲观情景
    columns:
      - 情景
      - 明确假设
      - 估值 / 回报逻辑
      - 关键风险与概率信号
    rows:
      - - 乐观
        - 据报道的增长延续；留存强劲；利用率扩大后利润率改善
        - 稀释后退出价值必须显著高于 $13B，才能带来风险投资式上行空间
        - 这只是有条件的上行空间；没有经审计的队列和利润率数据，就无法支持数值概率
      - - 基准
        - 增长放缓，但客户扩张与可靠性保持韧性
        - 仅将 $11B-$13B 作为最新融资参考，并等待有尽调支撑的入场价格
        - 这是当前最站得住脚的情景，但融资条款与年化收入质量仍未经验证
      - - 悲观
        - 增长减速；计算成本压缩利润率；客户转向多供应商或与更大型平台整合
        - 价值跌破 $11B 的较低分档参考值，或未来一轮融资重置估值
        - 若留存、集中度或利润率尽调未达阈值，则是明确的下行信号
    notes: 情景边界是有条件的投资评估参考，不是预测；没有公开证据支持概率、IRR、持有期或完全稀释回报模型。
    claimRefs:
      - CV001
      - CV005
      - CV011
      - CV012
      - CV014
      - CV015
