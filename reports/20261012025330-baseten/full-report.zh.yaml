        title: 收入模式、定价机制与收入规模
        blocks:
          - type: paragraph
            body: >-
              Baseten 采用纯粹按消费和容量驱动的变现模式，服务企业机器学习基础设施。平台主要通过直接 API 消费或专用 GPU
              容量的计费算力时长收取费用，与传统按席位计费的软件即服务模式不同（CI001、CI002）。客户需求在 2025 年末至 2026 年初大幅加速：据报道，收入运行率从 2025 年 12 月约 $200
              million 飙升至 2026 年 3 月的 $600 million，同比增幅约 1,900%（CI003、CI004）。这一商业速度反映出企业工作负载正从实验性模型训练迁移至持续的生产推理；平台在 87
              个集群、18 个云环境中每日处理超过 10 亿次推理请求（CI003、CI005）。商业客户包括 Cursor、Notion、Abridge 和 OpenEvidence 等高用量 AI 原生创新企业，以及超过
              100 个企业部署（CI003、CI006、CI007）。除按用量计费的托管模型端点外，Baseten 还通过专用多节点任务将训练和微调工作负载变现，并采用积分机制：训练支出的两成可抵扣生产推理成本，
              以鼓励客户留在多产品生命周期中（CI005、CI008）。
