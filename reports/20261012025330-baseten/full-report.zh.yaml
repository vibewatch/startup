      - number: '1.2'
        title: 管理层、创始人背景与治理
        blocks:
          - type: paragraph
            body: >-
              Baseten 由 CEO Tuhin Srivastava、CTO Amir Haghighat、首席科学家 Philip Howes 和 Pankaj Gupta 共同创办。Srivastava 与
              Howes 此前共同创办 HR 分析初创企业 Shape（2018 年被 Reflektive 收购）；两人此前在 Gumroad 任机器学习工程师，Haghighat 则在 Gumroad
              担任工程负责人。Gupta 在 Uber
              任职期间积累了深厚的分布式系统经验。创始团队既熟悉机器学习工作流，也具备系统工程背景。由于低延迟推理运行时需要专门的性能工程，核心技术管理层承担了较高的关键人物依赖。董事会委员会架构、独立董事及创始人股权投票控制权等完整公开信息仍不可得。
            claimRefs:
