          detail: 公司披露收入同比增长约 20 倍，日推理调用量超过 1B。
          tone: positive
        - id: customers
          label: 生产验证
          detail: 具名 AI 原生客户被描述为已运行关键任务工作负载。
          tone: positive
        - id: financing
          label: 融资参考
          detail: $1.5B Series F，分为 $13B 和 $11B 两档。
          tone: neutral
        - id: price-risk
          label: 价格风险
          detail: 最高估值在不到六个月内上升 160%；分档定价削弱了将标题估值视为单一数值的合理性。
          tone: warning
        - id: evidence-gap
          label: 投资判断缺口
          detail: 利润率、留存、客户集中度、现金消耗、优先权条款和完全摊薄后持股比例仍未披露。
          tone: warning
        - id: decision
          label: 决策
          detail: 在经济性和入场条款经核实、足以留出回报空间前，先跟踪 / 继续研究。
          tone: neutral
    approximationNotes: 该流程是定性且按顺序展开的，不赋予概率，也不计算回报。
