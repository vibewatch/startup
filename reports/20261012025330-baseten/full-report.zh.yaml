      - number: '3.4'
        title: 切换成本、多云并用与平台摩擦
        blocks:
          - type: paragraph
            body: >-
              生产级 AI 推理的切换摩擦，随运营层级而明显不同。在 API 集成边界，兼容 OpenAI 的 schema 和标准化 REST 端点，让基础提示词补全工作负载相对容易迁移。但深度接入 Baseten
              的专业生态会带来显著的企业切换成本。采用 Truss 做容器化、接入 Baseten
              的自定义可观测性和追踪流水线，或在自有虚拟私有云中建立混合自托管部署的企业客户，都会积累明显的工程惯性。Cursor、Notion 和 Abridge
              等客户案例显示，生产环境中的延迟调优与高可用保证，会降低客户在未经验证的服务商之间多云并用的意愿。不过，企业客户保有自己的权重和数据流水线，因此切换壁垒仍低于传统核心数据库或 ERP 软件迁移。
            claimRefs:
              - CP001
              - CP002
              - CP012
              - CP014
      - number: '3.5'
        title: 护城河持久性与超大规模云替代风险
        blocks:
          - type: paragraph
            body: >-
              Baseten 的长期护城河面临现有云服务商和专业同业的严重战略阻力。最关键的威胁来自超大规模云捆绑：AWS、Microsoft Azure 和 Google Cloud
              拥有庞大的企业分销渠道及现有承诺支出协议，能够交叉补贴推理服务。此外，获得大量资本支持、并据报道收入运行率达 $1B 的纯推理竞争者 Together
              AI，也拥有充足资源在模型分发和研究合作上竞争。Baseten 还必须从第三方 GPU 供应商购买或租赁算力，使运营利润率暴露于硬件供应约束和价格波动。为了守住估值溢价，Baseten
              必须持续在延迟、开发者效率和跨云可靠性上胜过商品化云服务，同时扩大企业覆盖面。
            claimRefs:
              - CP003
              - CP004
              - CP008
              - CP010
              - CP011
      - number: '3.6'
        title: 展品
        blocks:
          - type: callout
            title: 超大规模云算力套利与利润率压缩
            body: >-
              Baseten 等专业推理平台从超大规模云和 GPU 云租用底层 GPU
              容量，而非拥有数据中心或芯片，因此毛利率容易受到批发价格波动影响。如果超大规模云将推理服务激进地捆绑进既有云企业协议，独立服务商将承受严重的利润率压力。
            calloutType: risk
            claimRefs:
              - CP008
              - CP010
              - CP011
