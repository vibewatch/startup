  - id: FR001
    title: Residual risk heatmap
    type: matrix
    summary: >-
      Ordinal underwriting view of likelihood, impact, and mitigation maturity based on the assigned public evidence; it
      does not represent measured incident probabilities.
    data:
      columns:
        - label: Likelihood
          detail: Qualitative exposure inferred from operating model and evidence gaps
        - label: Impact
          detail: Potential investment impact if the risk materializes
        - label: Mitigation maturity
          detail: Strength of mitigation evidence in the assigned public corpus
      rows:
        - label: Security and compliance proof
          note: Controls are company-claimed; underlying assurance artifacts were not retained
          values:
            - label: Medium
              detail: Sensitive-workload exposure exists, but no violation is established
            - label: High
              detail: A control or contractual failure could block regulated production use
            - label: Partial
              detail: Certifications and controls are described, but independent artifacts require review
        - label: Reliability and capacity execution
          note: Architecture is broad and financing is being directed toward capacity
          values:
            - label: Medium
              detail: Multi-cloud complexity and rapid scaling create recurring execution exposure
            - label: High
              detail: Mission-critical workloads make prolonged service or capacity failure consequential
            - label: Partial
              detail: Autoscaling and failover are described; independent SLA history is missing
        - label: Capital intensity and expectation risk
          note: Large reported financings raise the operating milestones embedded in the investment case
          values:
            - label: Medium
              detail: Risk depends on undisclosed burn, margins, capacity commitments, and financing terms
            - label: High
              detail: A growth or margin miss could impair financing and valuation support
            - label: Limited
              detail: Capital raised is reported, but cash availability and economics are not disclosed
        - label: Cloud and GPU supplier dependency
          note: The platform manages capacity across providers, but supplier shares and commitments are undisclosed
          values:
            - label: Medium
              detail: Scarcity, repricing, or correlated failures remain plausible infrastructure exposures
            - label: High
              detail: Capacity loss or higher input cost could impair service and margin
            - label: Partial
              detail: Multi-cloud management is documented; concentration and contract terms are missing
        - label: Customer concentration and insourcing
          note: Named production customers are public, but account-level economics and retention are not
          values:
            - label: Unknown
              detail: No top-customer shares, churn, or contract-duration data are in the assigned corpus
            - label: High
              detail: Loss or insourcing of a large workload could reduce utilization and revenue quality
            - label: Limited
              detail: Multiple named users provide adoption proof but do not establish diversification
        - label: Competitive substitution
          note: Specialist inference vendors and hyperscalers are identified as alternatives
          values:
            - label: Medium
              detail: Customers can compare managed specialists, self-hosting, and cloud-native services
            - label: Medium-high
              detail: Price or performance pressure could weaken margins and workload retention
            - label: Partial
              detail: Developer experience and deployment flexibility are claimed differentiators
    approximationNotes: >-
      Qualitative categories are analyst judgments, not numerical probabilities; funding raised is not treated as cash
      available, and absence of an incident record is not treated as proof that no incident occurred.
    claimRefs:
      - CR008
      - CR010
      - CR012
      - CR015
