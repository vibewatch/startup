chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity and Model Inference Architecture
        blocks:
          - type: paragraph
            body: >-
              Baseten (legal entity BaseTen Labs, Inc.) was founded in 2019 and is headquartered in San Francisco,
              California, operating in the AI inference infrastructure sector. The company provides a high-performance
              software platform designed to solve the critical operational bottleneck between trained machine learning
              models and real-time production serving. Its offering encompasses containerization via the open-source
              Truss framework, automated compilation using engines like TensorRT-LLM and vLLM, custom model runtimes,
              and cross-cloud GPU scheduling across managed and self-hosted environments. Rather than focusing on model
              training or raw GPU reselling, Baseten specializes exclusively in production inference execution, offering
              enterprise-grade security including SOC-2 Type II certification and HIPAA compliance.
            claimRefs:
              - CO001
              - CO002
              - CO006
              - CO007
