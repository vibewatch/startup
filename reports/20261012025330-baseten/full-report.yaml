    title: Thesis and anti-thesis
    columns:
      - Side
      - Argument
      - Current evidence
      - What would change the view
    rows:
      - - Thesis
        - Demand and scale
        - Company reports ~20x year-over-year revenue growth and >1B daily inference calls
        - Independent revenue-quality and retention evidence would strengthen the case
      - - Thesis
        - Production relevance
        - Named AI-native customers and company-claimed four-nines uptime support mission-critical positioning
        - Customer references and SLA records would confirm durability
      - - Anti-thesis
        - Price outran proof
        - Upper valuation rose 160% in under six months and the Series F used split pricing
