            claimRefs:
              - CR008
              - CR010
              - CR012
              - CR015
      - number: '7.2'
        title: Regulatory, privacy, and data-control exposure
        blocks:
          - type: paragraph
            body: >-
              Baseten states that it is SOC 2 Type II certified and HIPAA compliant across its hosting options, supports
              region-restricted deployment, encrypts model weights and source code, and does not store inference request
              inputs or outputs. Those are relevant mitigations for sensitive workloads, but they are claims about the
              control environment rather than a substitute for reviewing the current audit report, BAA, DPA,
              subprocessor list, deletion behavior, and contractual SLA. A secondary analysis also notes that some
              regulated workloads may still require dedicated or on-premises infrastructure. The appropriate conclusion
              is therefore not that a compliance defect exists, but that legal and security exposure cannot be fully
              sized from the assigned public sources. Investment approval should be conditioned on contract-level and
              auditor-level evidence.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR015
      - number: '7.3'
        title: Operational and dependency risk
        blocks:
          - type: paragraph
            body: >-
              The operating model spans multiple clouds, regions, models, GPU types, deployment modes, and inference
              engines. This breadth can improve resilience and customer choice, but it also raises the number of
              scheduler, capacity, release, observability, and vendor interfaces that must behave correctly under load.
              Baseten claims four-nines uptime, cloud-agnostic autoscaling, failover options, and round-the-clock
              engineering support; none of the assigned independent sources verifies those performance claims. An
              investor's June statement that new capital would be invested aggressively in capacity, infrastructure, and
              research reinforces the scale of the execution burden. Key monitors are sustained SLA performance,
              capacity-related throttling, gross-margin movement, cloud and GPU-vendor concentration, and the share of
              support obligations requiring bespoke engineering.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR012
              - CR014
              - CR015
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR012
              - CR013
              - CR014
              - CR015
      - number: '7.4'
        title: Capital intensity, competitive pressure, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Baseten announced a $300 million financing at a $5 billion valuation in January 2026 and said it had
              raised $585 million in total at that point. Two secondary sources later reported a $1.5 billion Series F
              at a $13 billion valuation, while one of them estimated a $600 million annualized revenue run rate as of
              March. That estimate is revenue run rate, not ARR, cash, or audited revenue, and the assigned evidence
              does not disclose burn, runway, margin, capacity commitments, or financing terms. A secondary competitive
              analysis also identifies both specialist inference vendors and hyperscalers as alternatives. Thesis-break
              triggers should therefore include repeated SLA misses, inability to secure economical capacity, materially
              worsening gross margin, customer or supplier concentration above the investment committee's limits, or new
              financing that implies a material down-round or preference overhang.
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Decision condition
            body: >-
              Do not treat certifications, four-nines uptime, or multi-cloud design as independently verified. Progress
              requires current assurance reports, contract and SLA review, incident and capacity history, supplier and
              customer concentration, and audited unit economics.
            calloutType: risk
            claimRefs:
              - CR001
              - CR005
              - CR006
              - CR015
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and financing context
        blocks:
          - type: paragraph
            body: >-
              The current call is track/research more, not buy. Baseten announced a $1.5 billion Series F in June 2026
              across two tranches priced at $13 billion and $11 billion, following a $300 million financing at a $5
              billion valuation in January. TechCrunch calculated that the upper mark represented a 160% increase in
              less than half a year and reported that split pricing can boost the headline mark. That structure makes
              the headline valuation a poor substitute for an investable price or a fully diluted ownership schedule.
              The company also reported approximately 20x year-over-year revenue growth and more than one billion daily
              inference calls, evidence of momentum but not proof of durable margins, retention, or cash generation.
              Entry should therefore depend on verified financing terms and unit economics rather than the upper tranche
              alone.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV012
              - CV013
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV012
              - CV013
              - CV015
      - number: '8.2'
        title: Thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The thesis combines rapid company-reported growth, named production customers, and a product positioned
              around reliability, multi-cloud flexibility, security, and self-hosting. Baseten names Abridge, Cursor,
              Lovable, Notion, and OpenEvidence as users of mission-critical production workloads, while its enterprise
              page claims four-nines uptime. The anti-thesis is equally material: Baseten itself describes inference as
              a market full of smart, well-resourced competitors and warns that product market fit can be lost as the
              market changes. Enterprise list pricing is not published, and the public evidence does not establish gross
              margin, retention, customer concentration, or contractual duration. The financing validates investor
              demand, but it does not resolve whether growth converts into defensible, cash-generative economics.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV010
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
              - CV006
              - CV007
              - CV010
              - CV011
              - CV012
      - number: '8.3'
        title: Scenarios and entry discipline
        blocks:
          - type: paragraph
            body: >-
              Scenario underwriting should use the latest $11 billion to $13 billion tranche range as a reference, not
              as an independently verified fair-value band. A third-party market-data page reports roughly $600 million
              of annualized revenue for March 2026; pairing that estimate with the two tranche marks yields
              approximately 18.3x to 21.7x headline valuation-to-annualized-revenue. That ratio is illustrative rather
              than an enterprise-value multiple because the capital structure, cash balance, debt, preferences, and
              exact revenue definition are not public in the retained evidence. The bull case requires durable growth
              and improving economics sufficient to create exit value above the upper tranche. The base case requires
              proof that current scale persists. The bear case is multiple compression or a down round if growth
              normalizes before margins and retention are demonstrated.
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV005
              - CV011
              - CV012
              - CV014
              - CV015
      - number: '8.4'
        title: Exit readiness, diligence asks, and thesis breaks
        blocks:
          - type: paragraph
            body: >-
              Baseten has late-stage financing scale, recognizable investors, and customer references, but public
              evidence does not support a numerical IRR, hold period, or exit multiple. Before underwriting an entry,
              investors should obtain audited revenue recognition, gross margin by deployment model, burn and runway,
              net revenue retention, cohort expansion, customer concentration, committed compute liabilities, and the
              complete Series F cap table and preference stack. An upgrade requires verified economics, durable
              retention, and an entry price that leaves meaningful upside after dilution. Thesis breaks include material
              growth deceleration, failure to sustain enterprise reliability, severe margin compression from compute
              costs, customer concentration that makes reported scale fragile, or financing terms that subordinate new
              common ownership. Until those checks close, exit readiness remains an open underwriting question rather
              than an assumed consequence of the headline valuation.
            claimRefs:
              - CV006
              - CV009
              - CV013
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV003
              - CV006
              - CV012
              - CV013
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price-sensitive conclusion
            body: >-
              Track Baseten and pursue diligence, but do not treat the $13 billion tranche as a single, independently
              validated fair-value mark.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV012
              - CV013
          - type: callout
            title: No public return model
            body: >-
              The retained evidence does not disclose enough capital-structure, retention, margin, or cash-flow detail
              to support a numerical IRR or exit multiple.
            calloutType: risk
            claimRefs:
              - CV015
              - CV016
