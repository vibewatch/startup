  - id: TV003
    title: Bull, base, and bear scenarios
    columns:
      - Scenario
      - Explicit assumptions
      - Valuation / return logic
      - Key risks and probability signal
    rows:
      - - Bull
        - Reported growth persists; retention is strong; margins improve as utilization scales
        - Exit value must rise materially above $13B after dilution to create venture-style upside
        - Conditional upside only; no numerical probability is supported without audited cohorts and margins
      - - Base
        - Growth moderates but customer expansion and reliability remain durable
        - Use $11B-$13B only as the latest financing reference and wait for a diligence-backed entry price
        - Most defensible current case, but financing terms and annualized-revenue quality remain unverified
      - - Bear
        - Growth decelerates; compute costs compress margin; customers multi-source or consolidate with larger platforms
        - Value falls below the lower $11B tranche reference or a future round resets the mark
        - Material downside signal if retention, concentration, or margin diligence misses thresholds
    notes: >-
      Scenario boundaries are conditional underwriting references, not forecasts; no public probability, IRR,
      hold-period, or fully diluted return model is supportable.
    claimRefs:
      - CV001
      - CV005
      - CV011
      - CV012
      - CV014
