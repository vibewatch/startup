      - number: '4.3'
        title: Capital Adequacy, Cash Runway, and Diligence Verdict
        blocks:
          - type: paragraph
            body: >-
              Baseten has executed an aggressive financing strategy to support its capital-intensive infrastructure
              buildout, raising more than $2 billion in aggregate equity capital through mid-2026 (CI003, CI004, CI013).
              Following a $300 million Series E round in January 2026 anchored by IVP, CapitalG, and Nvidia at a $5
              billion valuation, Baseten closed a $1.5 billion Series F round in June 2026 at an enterprise valuation of
              up to $13 billion (CI003, CI004, CI014). This massive cash infusion provides deep capital adequacy to
              finance hardware lease commitments, global compute reservations, and planned workforce tripling across
              engineering and go-to-market teams (CI003, CI005). Nevertheless, the rapid cadence of four mega-rounds
              within eighteen months underscores substantial forward capital intensity and operational burn necessary to
              sustain rapid top-line growth (CI003, CI009). From an investment diligence perspective, underwriting
              Baseten requires verifying whether high headline ARR reflects sticky recurring commitments or volatile,
              short-cycle compute consumption subject to sudden churn or price commoditization (CI010, CI011, CI015).
            claimRefs:
              - CI003
              - CI004
              - CI005
              - CI009
              - CI010
