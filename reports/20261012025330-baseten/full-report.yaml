              - CI014
              - CI015
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Vertical Integration Threshold: The $200K/Month Graduation Risk'
            body: >-
              Industry unit economics indicate that when an enterprise customer's managed inference spend on a single
              model workload exceeds roughly $200,000 per month, the economic incentive to bring infrastructure
              management in-house begins to outweigh managed platform convenience. Baseten's revenue density among
              breakout AI application providers makes it uniquely susceptible to workload graduation risk if top
              accounts establish internal ML-ops capabilities.
            calloutType: risk
            claimRefs:
              - CI006
              - CI012
          - type: callout
            title: Capital Buffer vs. Operating Leverage
            body: >-
              With over $2 billion raised and a recent $1.5 billion Series F round, Baseten possesses a massive
              liquidity buffer that insulates it from near-term balance-sheet distress. However, maintaining high growth
              requires continued capital allocation into compute lease commitments and expanding headcount, making
              sustainable gross margin expansion the decisive factor for long-term equity returns.
            calloutType: insight
            claimRefs:
              - CI003
              - CI004
              - CI010
              - CI013
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Operating Model and Multi-Cloud Infrastructure Architecture
        blocks:
          - type: paragraph
            body: >-
              Baseten operates as a mission-critical AI inference infrastructure platform designed to deploy, scale, and
              serve large language models and compound AI systems in production. Rather than acting as a simple GPU
              reseller or a purely proprietary model provider, the company provides systems software that unifies
              heterogeneous compute resources into a reliable, enterprise-grade serving layer. As of mid-2026, Baseten
              operates across 87 globally distributed clusters spanning 18 distinct cloud providers, handling over one
              billion production inference calls each day. This multi-cloud architectural topology enables Baseten to
              route customer workloads dynamically based on GPU availability, geographic latency requirements, and cost
              efficiency, shielding customers from regional capacity shortages and individual provider outages. The
              platform's foundational architecture bridges low-level hardware characteristics with high-level
              orchestration, adapting standard Kubernetes primitives to handle the unique scheduling, memory, and
              networking demands of modern GPU computing.
            claimRefs:
              - CE001
              - CE009
          - type: table
            tableRef: TE003
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE009
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE006
              - CE009
              - CE014
      - number: '5.2'
        title: Product Portfolio, Deployment Modalities, and Framework Abstractions
        blocks:
          - type: paragraph
            body: >-
              The core entry point for engineering teams building on Baseten is Truss, an open-source model packaging
              framework created and maintained by the company. Truss provides an opinionated Python abstraction centered
              on load and predict methods, accompanied by a declarative configuration file specifying hardware
              requirements, system packages, and Python dependencies. Around this packaging foundation, Baseten offers
              three primary commercial deployment options: fully managed Baseten Cloud, single-tenant dedicated
              clusters, and self-hosted VPC deployments running directly inside customer cloud infrastructure. The
              self-hosted model allows security-conscious organizations to keep proprietary model weights and sensitive
              inference data strictly within their own security boundaries while maintaining an automated failover
              capability to Baseten Cloud. Through its managed model garden, Baseten also provides turnkey access to
              leading open-source models, enabling developers to run pre-optimized implementations of frontier
              open-weight architectures alongside custom fine-tuned checkpoints.
            claimRefs:
              - CE002
              - CE005
              - CE011
          - type: table
            tableRef: TE001
            claimRefs:
              - CE002
              - CE005
              - CE011
      - number: '5.3'
        title: Developer Workflow, Runtime Optimization, and Forward-Deployed Engineering
        blocks:
          - type: paragraph
            body: >-
              Baseten's serving pipeline is engineered to eliminate the operational complexity of deploying custom
              machine learning models at scale. Once an engineer packages an artifact using Truss, Baseten automatically
              builds container images, provisions appropriate GPU hardware, and establishes autoscaling endpoints that
              can scale up dynamically or down to zero when idle. To achieve competitive latency and throughput, Baseten
              integrates leading open-source inference engines, including vLLM, SGLang, and NVIDIA TensorRT-LLM,
              fine-tuning continuous batching, memory allocation, and kernel execution for specific model architectures.
              Beyond purely software-based automation, Baseten differentiates its go-to-market and operational delivery
              through forward deployed engineering teams that report directly to engineering leadership. These engineers
              embed directly with major production customers—including category leaders such as Cursor, Notion, Abridge,
              and OpenEvidence—to co-engineer custom serving optimizations, diagnose tail latency bottlenecks, and
              directly inform internal product roadmap priorities.
            claimRefs:
              - CE003
              - CE004
              - CE010
              - CE012
          - type: table
            tableRef: TE002
            claimRefs:
              - CE002
              - CE003
              - CE006
              - CE008
              - CE010
      - number: '5.4'
        title: Enterprise Governance, Data Isolation, and Commercial Tradeoffs
        blocks:
          - type: paragraph
            body: >-
              To satisfy rigorous procurement requirements across healthcare, legal, and financial services, Baseten
              embeds comprehensive security and compliance capabilities into its platform architecture. The service is
              SOC 2 Type II certified, HIPAA compliant, and GDPR compliant by default across all hosting tiers.
              Critically for enterprise trust, Baseten enforces a strict zero-data-retention policy, guaranteeing that
              customer inference inputs and outputs are never permanently stored, logged, or utilized for model
              training. Administrative governance is delivered through role-based access control, single sign-on,
              team-level workspace partitioning, and audit-ready observability tools encompassing distributed tracing
              and custom metrics. Alongside these enterprise strengths, independent evaluations highlight several
              operational and financial tradeoffs. Baseten's replica-hour pricing model requires customers to pay
              continuously for standing GPU instances regardless of request volume, resulting in substantial cost floors
              for high-availability multi-replica deployments. Furthermore, serverless cold starts of 30 to 90 seconds
              for large models force latency-critical applications to maintain expensive warm standby instances.
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE013
              - CE014
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Inference Engineering as Strategic Category Moat
            body: >-
              Baseten's primary differentiation lies in formalizing inference engineering as a systems discipline
              distinct from model training. By bundling low-level runtime engine optimizations (vLLM, TensorRT-LLM) with
              multi-cloud cluster orchestration across 18 providers, Baseten shields AI development teams from complex
              GPU infrastructure maintenance while maintaining production uptime.
            calloutType: insight
            claimRefs:
              - CE001
              - CE003
              - CE004
          - type: callout
            title: Replica-Hour Cost Floor and Cold-Start Tradeoffs
            body: >-
              The commercial reality of Baseten's hosting model imposes significant structural tradeoffs: teams
              operating dedicated replicas face continuous hourly charges regardless of request throughput, while
              serverless endpoints suffer from 30 to 90-second cold starts when scaling up from zero. Furthermore,
              reliance on the Truss abstraction creates real switching friction when evaluating alternative bare-metal
              options.
            calloutType: risk
            claimRefs:
              - CE007
              - CE008
              - CE011
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation & Target Buyers
        blocks:
          - type: paragraph
            body: >-
              Baseten's commercial adoption spans four primary customer cohorts across the artificial intelligence
              ecosystem: high-velocity AI-native startups, regulated enterprise organizations, digital-native media
              platforms, and frontier model labs. The fastest-growing cohort consists of AI-native software applications
              such as Cursor, Lovable, and Clay, where low-latency inference is embedded directly into core product
              interaction loops and engineering teams demand continuous deployment agility. In regulated industries such
              as healthcare, providers including Abridge and OpenEvidence deploy on Baseten to leverage single-tenant
              clusters, dedicated VPC connectivity, and comprehensive SOC-2 Type II and HIPAA compliance guarantees.
              Digital-native platforms like Patreon and Superhuman rely on Baseten to replace costly proprietary APIs or
              unoptimized in-house GPU fleets with standardized open-source serving architectures. More recently,
              Baseten expanded upstream with Baseten for Model Labs, onboarding closed-weight AI developers including
              Poolside and WRITER to distribute and monetize models through its Frontier Gateway API.
            claimRefs:
              - CU001
              - CU002
              - CU009
              - CU013
          - type: table
            tableRef: TU001
            claimRefs:
