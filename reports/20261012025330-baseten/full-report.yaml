      - Diligence path
    rows:
      - - Security and healthcare assurance / US regulated workloads
        - >-
          SOC 2 Type II and HIPAA compliance are company-claimed; underlying reports and terms were not in the assigned
          corpus
        - Medium
        - High
        - Audit certification, workload isolation, access controls, regional deployment
        - Partially evidenced
        - Material until scope, exceptions, and shared responsibility are reviewed
        - Obtain current SOC 2 report, HIPAA control mapping, BAA, penetration-test summary, and remediation log
      - - Privacy and data handling / inference requests
        - Baseten says it does not store request inputs or outputs and protects code and weights with encryption
        - Medium
        - High
        - No input/output storage, encryption, private networking, single-tenant options
        - Company-described
        - Contract, telemetry, backup, deletion, and subprocessor behavior remain unverified
        - >-
          Review DPA, retention and deletion schedules, logging defaults, subprocessors, and customer-configurable
          controls
      - - Residency and cross-border processing / global deployments
        - Regional environments, region selection, self-hosting, and customer-VPC deployment are described publicly
        - Low-medium
        - High
        - Region-restricted placement and self-hosted deployment
        - Product-documented
        - Routing, support access, metadata location, and failover boundaries are not independently verified
        - >-
          Map data flows by product and region; test routing and failover; obtain subprocessor and support-access
          locations
    notes: >-
      Partial public-source register ordered by severity; likelihood and residual exposure are underwriting assessments
      based on company-described controls and explicit evidence gaps, not findings of a breach, enforcement action, or
      legal non-compliance.
    enumerationScope:
