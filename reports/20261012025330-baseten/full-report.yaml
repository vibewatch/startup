      - number: '4.2'
        title: Cost Structure, Gross Margin Dynamics, and Unit Economics
        blocks:
          - type: paragraph
            body: >-
              The core determinant of Baseten's financial viability is its ability to extract durable software gross
              margins while arbitrating physical and virtual GPU compute. Delivering high-performance model serving
              requires substantial compute pass-through costs paid to underlying hardware hosts and neoclouds across its
              multi-cloud footprint (CI005, CI009). Baseten commands a premium over raw compute—pricing dedicated
              managed H100 instances at approximately $6.50 per hour compared to hyperscaler raw compute benchmarks of
              roughly $3.93 per hour—justified by out-of-the-box kernel optimizations, cold-start reduction, and
              multi-cloud resilience (CI001, CI005). Company case studies indicate that optimized deployments deliver up
              to 30% to 40% cost savings relative to unmanaged in-house clusters or closed-source commercial APIs
              (CI003, CI005). However, because Baseten does not publicly disclose audited gross margin percentages,
              hosting cost of goods sold (COGS), or net revenue retention (NRR), analysts cannot independently verify
              whether current scale yields classic infrastructure software gross margins (65%–75%) or compressed
              neocloud resale margins (35%–50%) (CI010, CI011). Furthermore, customer concentration among breakout
              startups creates potential margin vulnerability if anchor clients develop internal infrastructure
              operations once monthly inference expenditure exceeds roughly $200,000 per workload (CI006, CI012).
            claimRefs:
              - CI001
              - CI003
              - CI005
              - CI006
              - CI009
