              - CU003
              - CU004
              - CU009
      - number: '6.2'
        title: Adoption Trajectory & Operational Scale
        blocks:
          - type: paragraph
            body: >-
              Baseten experienced explosive operational and financial expansion between late 2025 and mid-2026, tracking
              the industry-wide transition of enterprise compute budgets from offline model training toward recurring
              production inference. By March 2026, the company's annualized revenue run-rate reached approximately $600
              million, roughly tripling from $200 million in December 2025 and representing approximately 1,900%
              year-over-year revenue growth. This top-line momentum is backed by substantial underlying infrastructure
              utilization, with the platform serving more than one billion inference requests per day across 87 clusters
              spanning more than 18 cloud provider environments. Commercial traction has broadened from tens of
              thousands of individual open-source developers using the Truss packaging library to more than 100 large
              enterprise accounts running mission-critical workloads. Early investor disclosures from 2025 indicated
              near-zero customer churn, reflecting the deep technical stickiness created once an application's
              production routing, autoscaling, and observability become integrated into Baseten's multi-cloud serving
              plane.
            claimRefs:
              - CU005
              - CU006
              - CU010
              - CU012
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU010
              - CU012
      - number: '6.3'
        title: Named Customer Deployments & Measurable Outcomes
        blocks:
          - type: paragraph
            body: >-
              Publicly documented customer deployments confirm tangible efficiency, cost reduction, and performance
              gains across diverse production workloads. In creator media processing, creator platform Patreon
              transitioned its audio transcription workloads to OpenAI's Whisper model deployed via Baseten, reporting
              440 saved engineering hours, $600,000 in annual cost savings, and an overall 70% reduction in GPU
              expenses. In healthcare documentation, clinical AI provider Abridge standardized on Baseten to power its
              ambient clinical note-taking models in production, with executive leadership emphasizing superior uptime,
              developer experience, and collaborative engineering support over transactional vendor relationships. In
              developer productivity software, email platform Superhuman achieved 80% faster embedding inference after
              migrating to Baseten's specialized infrastructure, enabling real-time semantic message retrieval.
              Additionally, technical collaboration with NVIDIA demonstrated that optimizing Baseten's open-source Truss
              framework with TensorRT-LLM and AWS P4d instances powered by A100 GPUs slashed cold-start latency from up
              to five minutes down to 5–10 seconds while doubling inference throughput for production customer models.
            claimRefs:
              - CU001
              - CU003
              - CU004
              - CU007
              - CU008
          - type: table
            tableRef: TU003
            claimRefs:
              - CU001
