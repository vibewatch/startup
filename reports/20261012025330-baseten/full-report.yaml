  - id: TR002
    title: Operational, quality, and security risk register
    columns:
      - Failure mode
      - Likelihood
      - Severity
      - Evidence
      - Claimed mitigation
      - Mitigation maturity
      - Residual exposure / monitor
    rows:
      - - Capacity shortfall or uneconomic GPU supply during demand spikes
        - Medium
        - High
        - Platform manages GPU capacity across clouds and regions; investor says capital will fund capacity
        - Multi-cloud capacity management and autoscaling
        - Product-documented; economics undisclosed
        - Monitor throttling, reserved-capacity commitments, utilization, and gross margin
      - - Availability or failover misses on mission-critical workloads
        - Medium
        - High
        - Company claims four-nines uptime and offers hybrid failover; independent SLA history was not retained
        - Cross-cloud autoscaling, redundancy, regional and self-hosted options
        - Company-claimed
        - Obtain 24-month SLA attainment, severity-one incident history, recovery time, and credits paid
      - - Regression across engines, models, hardware, or deployment modes
        - Medium
        - High
        - Documentation lists several engines and custom-server paths across dedicated infrastructure
        - Staging and production environments, traces, metrics, release lifecycle controls
        - Product-documented
        - Review change-failure rate, rollback time, compatibility tests, and model-specific incident rates
      - - Bespoke support load constrains repeatable scaling
        - Medium
        - Medium-high
        - Company and investor materials emphasize hands-on engineering and frontier-customer support
        - 24/7 engineering support and forward-deployed expertise
        - Operating claim
        - Track support hours per customer, deployment lead time, and support gross margin
    notes: >-
      Likelihood and severity are analyst assessments grounded in the described operating surface; the assigned evidence
      contains no verified outage frequency, incident count, utilization, or support-cost denominator.
    claimRefs:
