      - number: '1.2'
        title: Executive Leadership, Founder Backgrounds, and Governance
        blocks:
          - type: paragraph
            body: >-
              Baseten was co-founded by CEO Tuhin Srivastava, CTO Amir Haghighat, Chief Scientist Philip Howes, and
              Pankaj Gupta. Srivastava and Howes previously co-founded HR analytics startup Shape (acquired by
              Reflektive in 2018) after working as machine learning engineers at Gumroad, where Haghighat served as Head
              of Engineering. Gupta contributed deep distributed systems expertise from his tenure at Uber. The founding
              team combines technical fluency in machine learning workflows with systems-engineering background.
              Key-person dependency is concentrated across the core technical leadership, particularly given the
              specialized performance engineering required to operate low-latency inference runtimes. Comprehensive
              public disclosure regarding board committee structures, independent directors, and founder equity voting
              control remains unavailable.
            claimRefs:
              - CO002
              - CO003
              - CO008
