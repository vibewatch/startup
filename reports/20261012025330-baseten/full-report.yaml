              - CU007
              - CU008
      - number: '6.4'
        title: Customer Journey, Expansion Loops & Platform Lock-In
        blocks:
          - type: paragraph
            body: >-
              Baseten's land-and-expand motion begins at the individual developer surface before expanding into
              organization-wide infrastructure commitments. Developers typically enter through the open-source Truss
              packaging library or pre-optimized Model APIs, containerizing models and validating latency benchmarks
              locally before deploying prototype endpoints on managed Baseten Cloud. As traffic ramps toward production
              scale, customers transition to Baseten's Multi-Cloud Capacity Management (MCM) layer, which automatically
              schedules replicas across 18 cloud providers to circumvent single-vendor GPU shortages and maintain
              sub-200ms latency SLAs. Regulated and enterprise accounts subsequently expand into single-tenant clusters,
              VPC peering, and hybrid configurations where inference executes inside the customer's private cloud with
              automated failover. Expansion velocity compounds as internal engineering teams deploy additional model
              modalities—spanning text, audio transcription, image generation, and semantic embeddings—while leveraging
              Baseten Training and Baseten Loops for post-training alignment and reinforcement learning workflows.
            claimRefs:
              - CU001
              - CU002
              - CU007
              - CU009
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU002
              - CU007
              - CU009
      - number: '6.5'
        title: Retention Durability, Churn & Customer Concentration Risks
        blocks:
          - type: paragraph
            body: >-
              Despite hypergrowth metrics, Baseten faces structural durability and customer concentration risks inherent
              to its usage-based business model. Because revenue scales directly with metered GPU hours and inference
              volume rather than multi-year committed software subscriptions, top-line performance is immediately
              sensitive to customer traffic volatility, algorithmic optimization gains, or macro spend pullbacks.
              Customer concentration represents a significant vulnerability, as a handful of high-throughput anchor
              accounts like Cursor and Abridge likely account for an outsized portion of aggregate daily inference
              volume; any workload repatriation or architectural shift by a top customer would immediately impact
              run-rate. Furthermore, major hyperscalers including AWS Bedrock, Google Cloud Vertex AI, and Microsoft
              Azure increasingly bundle proprietary and open model serving into existing enterprise cloud enterprise
              agreements, leveraging captive hardware margins and discounted pricing that Baseten must consistently
              outperform through superior software orchestration and cross-cloud resiliency.
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU014
      - number: '6.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Critical Infrastructure Moat in AI-Native Production Workloads
            body: >-
              Baseten has transitioned from an experimental developer tool into mission-critical infrastructure for
              leading AI startups like Cursor and Abridge, demonstrating tangible cost and performance advantages
              including sub-10-second cold starts and 70% GPU expense reductions.
            calloutType: strength
            claimRefs:
              - CU001
              - CU003
              - CU004
              - CU007
          - type: callout
            title: Consumption Volatility and Hyperscaler Disintermediation Exposure
            body: >-
              Because Baseten operates as a pure consumption-based compute orchestrator without disclosed long-term
              committed ARR, its revenue remains vulnerable to anchor customer budget cycles, model efficiency gains,
              and aggressive bundling by underlying hyperscalers like AWS, Google Cloud, and Azure.
            calloutType: risk
            claimRefs:
              - CU010
              - CU011
              - CU014
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk posture and underwriting frame
        blocks:
          - type: paragraph
            body: >-
              Baseten sells infrastructure for mission-critical model workloads, so failure impact is structurally
              higher than for a non-critical developer tool. The company says named AI applications depend on its
              production platform, while its documentation describes a broad operating surface spanning model
              containers, GPU capacity, regions, scaling, and observability. That combination makes reliability,
              security, and capacity management central underwriting questions rather than peripheral product details.
              Public mitigations include multi-cloud capacity management, dedicated deployments, regional placement,
              observability, and self-hosting. However, the retained corpus is dominated by company-issued descriptions
              and does not independently test uptime, controls, failover, or customer isolation. The heatmap therefore
              ranks residual diligence exposure, not confirmed incidents or control failures.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR013
              - CR015
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
