            tableRef: TO002
            claimRefs:
              - CO002
              - CO003
      - number: '1.3'
        title: Capitalization History, Lead Investors, and Valuation Trajectory
        blocks:
          - type: paragraph
            body: >-
              Baseten's financing trajectory illustrates an extraordinary acceleration in private valuation and
              institutional backing. Following an initial seed investment from Greylock Partners in 2019 and a $12
              million Series A in 2022, the company completed a $40 million Series B in March 2024. In February 2025,
              Baseten raised a $75 million Series C at an $825 million post-money valuation. Momentum surged further
              with a $150 million Series D led by BOND in September 2025 at $2.15 billion, culminating in a $300 million
              Series E in January 2026 at a $5.0 billion valuation co-led by IVP and CapitalG with a $150 million
              strategic investment from NVIDIA. Later reporting in June 2026 indicated an oversubscribed $1.5 billion
              Series F led by Altimeter Capital at up to a $13.0 billion headline valuation, bringing cumulative capital
              raised to $2.08 billion.
            claimRefs:
              - CO004
              - CO005
              - CO009
              - CO010
          - type: table
            tableRef: TO003
            claimRefs:
              - CO004
              - CO005
              - CO009
      - number: '1.4'
        title: Commercial Scale, Utilization Pressures, and Operational Constraints
        blocks:
          - type: paragraph
            body: >-
              Baseten serves mission-critical workloads for leading AI-native businesses including Cursor, Abridge,
              Clay, OpenEvidence, Lovable, and Notion. Platform usage expanded rapidly through 2025 and 2026, with
              leadership reporting that 95% of processed tokens stem from custom, fine-tuned customer models rather than
              off-the-shelf public weights. However, this explosive demand introduces severe operational and capital
              headwinds. Fleet GPU utilization across 90 clusters and 18 clouds has reached the mid-90s—a level
              management characterizes as uncomfortably high amid global compute scarcity. Acquiring next-generation GPU
              hardware such as NVIDIA Blackwell B200s increasingly demands multi-year supply commitments with 20% to 30%
              upfront cash prepayments, creating substantial working capital requirements. Furthermore, unaudited
              revenue figures, undocumented net revenue retention, and hyperscaler competition from AWS, Google Cloud,
              and Azure represent major diligence gaps.
            claimRefs:
              - CO011
              - CO012
              - CO013
              - CO014
      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: NVIDIA Strategic Partnership and Inference Market Leadership
            body: >-
              NVIDIA's $150 million direct investment in Baseten's Series E represents a major endorsement from the
              dominant AI chipmaker. This partnership provides Baseten with privileged access to optimize cutting-edge
              architectures like Blackwell B200 and deepens software integration with TensorRT-LLM, creating technical
              moats against pure GPU resellers.
            calloutType: strength
            claimRefs:
              - CO004
              - CO009
          - type: callout
            title: Capacity Bottlenecks and Severe Capital Commitments
            body: >-
              Baseten operates in a fiercely constrained GPU compute market where utilization across its 90 clusters
              exceeds 95%. Compounding this, securing frontier hardware like B200s requires 3-to-5 year commitments with
              20% to 30% upfront cash prepayments, placing intense working capital demands on the company and leaving it
              vulnerable to hardware supply delays.
            calloutType: risk
            claimRefs:
              - CO013
              - CO014
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Workload Scope, and Spend Allocation
        blocks:
          - type: paragraph
            body: >-
              The production artificial intelligence market is experiencing a structural bifurcation between model
              training and model inference. While the initial wave of enterprise generative AI investment centered
              heavily on foundation model pre-training—consuming massive capital expenditures on multi-thousand GPU
              clusters—production economics are dictated by the inference phase. Inference represents the ongoing
              execution of trained models to generate predictions, process structured outputs, and power user-facing
              software applications. Unlike training workloads, which are intermittent and batch-oriented, inference
              workloads are latency-critical, persistent, and scale proportionally with user engagement. As
              organizations mature their artificial intelligence initiatives, model spend is actively transitioning from
              broad exploration to dedicated model serving. Industry application-layer companies now allocate thirty to
              fifty percent of their model budgets specifically toward custom and post-trained open-source architectures
              rather than relying exclusively on closed frontier model APIs. This workload shift redefines the
              addressable market boundaries: raw compute leasing is commoditizing, while specialized middleware and
              runtime software that optimize latency, orchestration, and multi-cloud resilience command durable
              enterprise value.
            claimRefs:
              - CM001
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM004
              - CM006
              - CM012
      - number: '2.2'
        title: 'Market Sizing Lenses: TAM, SAM, and the Custom Inference Opportunity'
        blocks:
          - type: paragraph
            body: >-
              Evaluating the market opportunity for specialized artificial intelligence inference requires examining
              multiple sizing lenses rather than relying upon a singular top-down forecast. Industry research consensus
              values the broader artificial intelligence inference infrastructure market at approximately 106.2 billion
              dollars in 2025, projecting expansion to 255.0 billion dollars by 2030 at a compound annual growth rate of
              19.2 percent. This expansion is propelled by an industry-wide transition wherein sixty to seventy percent
              of all artificial intelligence compute cycles are expected to migrate to real-time inference by 2030.
              However, this headline total addressable market aggregates commoditized GPU hardware, hyperscaler virtual
              instances, and specialized serving software. Within this broader universe, the serviceable addressable
              market centers on dedicated model execution and custom model runtimes. Across scaled enterprise platforms,
              custom and post-trained models represent ninety-five percent of processed token volume, demonstrating that
              standard off-the-shelf weights represent a transitional development phase. Baseten operates directly
              within this high-velocity layer, scaling its global footprint across eighty-seven to ninety clusters in
              eighteen cloud providers while processing over one billion inference requests daily and scaling its
              revenue run rate from six hundred million dollars toward a one-billion-dollar trajectory.
            claimRefs:
              - CM002
              - CM003
              - CM005
              - CM006
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM003
