  - id: TR003
    title: Partner and dependency risk register
    columns:
      - Dependency
      - Counterparty / role
      - Public concentration evidence
      - Failure scenario
      - Severity
      - Claimed mitigation
      - Residual exposure / kill criterion
    rows:
      - - Cloud and GPU capacity
        - Undisclosed cloud and hardware suppliers
        - No supplier shares or committed-capacity terms in the assigned corpus
        - Scarcity, price increase, or correlated regional failure impairs service or margin
        - High
        - Multi-cloud and multi-region capacity management
        - Escalate if one provider exceeds committee limits or capacity cost makes target gross margin unattainable
      - - Capital providers and financing expectations
        - Venture and growth investors funding infrastructure expansion
        - Large 2026 financings are reported, but burn, runway, preferences, and commitments are not public
        - Growth or margin misses force repricing, dilution, or constrained capacity investment
        - High
        - Substantial reported financing capacity
        - >-
          Kill if new terms create unacceptable preference overhang or a material down-round without a credible reset
          plan
      - - Mission-critical AI-native customer workloads
        - Named customers include Abridge, Cursor, Lovable, Notion, and OpenEvidence
        - No revenue share, retention, contract-duration, or top-customer data in the assigned corpus
        - Loss or insourcing of a large workload reduces utilization and weakens expansion economics
        - High
        - Multiple named customers and support-intensive deployment model
        - >-
          Escalate if top-customer or vertical exposure exceeds policy, or if net retention falls below the investment
          case
