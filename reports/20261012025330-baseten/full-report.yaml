  - id: TV001
    title: Recommendation summary
    columns:
      - Decision element
      - Current view
      - Evidence basis
      - Investment implication
    rows:
      - - Recommendation
        - Track / research more
        - Strong reported growth, but insufficient public return inputs
        - Do not underwrite a buy from the headline valuation alone
      - - Confidence
        - Medium
        - Financing terms and operating scale are reported; unit economics remain private
        - Require primary diligence before pricing ownership
      - - Risk rating
        - High
        - Rapid valuation step-up, split pricing, and competitive execution risk
        - Demand a margin of safety and downside protections
      - - Valuation stance
        - Stretched
        - $11B-$13B tranche range versus an estimated ~$600M annualized-revenue reference
        - Treat the implied ~18.3x-21.7x ratio as illustrative, not fair value
