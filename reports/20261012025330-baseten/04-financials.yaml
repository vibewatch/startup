callouts:
  - calloutType: "risk"
    title: "Vertical Integration Threshold: The $200K/Month Graduation Risk"
    body: "Industry unit economics indicate that when an enterprise customer's managed inference spend on a single model workload exceeds roughly $200,000 per month, the economic incentive to bring infrastructure management in-house begins to outweigh managed platform convenience. Baseten's revenue density among breakout AI application providers makes it uniquely susceptible to workload graduation risk if top accounts establish internal ML-ops capabilities."
    claimRefs:
      - "CI006"
      - "CI012"
  - calloutType: "insight"
    title: "Capital Buffer vs. Operating Leverage"
    body: "With over $2 billion raised and a recent $1.5 billion Series F round, Baseten possesses a massive liquidity buffer that insulates it from near-term balance-sheet distress. However, maintaining high growth requires continued capital allocation into compute lease commitments and expanding headcount, making sustainable gross margin expansion the decisive factor for long-term equity returns."
    claimRefs:
      - "CI003"
      - "CI004"
      - "CI010"
      - "CI013"
