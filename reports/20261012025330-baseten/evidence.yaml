evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: audited-financial-metrics
    missingEvidence: Audited GAAP financial statements establishing revenue, ARR, gross margins, cash burn, and customer concentration.
    whyItMatters: >-
      Baseten's multi-billion-dollar valuation multiples cannot be evaluated with high confidence without verified
      financial performance metrics.
    diligencePath: >-
      Request audited financial statements, historical GAAP revenue breakdowns, and cohort retention schedules during
      formal diligence.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: board-governance-and-voting-rights
    missingEvidence: Comprehensive board composition, independent director seats, committee charters, and voting equity distribution.
    whyItMatters: >-
      Governance control, investor covenants, and liquidation preference seniorities are critical to understanding
      downside protection across rapid valuation escalations.
    diligencePath: >-
      Review amended Certificate of Incorporation, Voting Agreements, and Investor Rights Agreements from Series E and
      Series F rounds.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: retention-and-churn-evidence
    missingEvidence: >-
      Audited enterprise net revenue retention (NRR), gross customer churn, and average annual contract duration across
      customer cohorts.
    whyItMatters: >-
      Reported 400% net dollar retention cannot be evaluated against cohort expansion durability or customer
      concentration without audited contract data.
    diligencePath: >-
      Request customer cohort retention schedules, billing data by account tier, and churn histories during management
      diligence.
    relatedQuestionRefs:
      - QM009
  - type: conflicting-data
    severity: minor
    topic: tam-definition-divergence
    missingEvidence: >-
      Granular breakdown separating software inference runtime fees from raw GPU server rental in the $106.2B–$255B
      market sizing reports.
    whyItMatters: >-
      Third-party market figures frequently conflate raw GPU cloud infrastructure with specialized inference
      orchestration and model-serving software middleware.
    diligencePath: >-
      Cross-examine analyst model methodologies and reconcile top-down infrastructure sizing against bottom-up
      enterprise inference spend per token.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: competitor-enterprise-pricing-and-margins
    missingEvidence: >-
      Audited gross margins, negotiated enterprise discount schedules, and private multi-year committed contract terms
      across dedicated inference providers including Together AI, Fireworks AI, and Baseten.
    whyItMatters: >-
      Without verified realized pricing and gross margin figures, assessing whether specialized inference clouds can
      sustainably undercut hyperscalers without burning gross margin remains speculative.
    diligencePath: >-
      Request customer contract samples, pricing schedules, and management margin models during customer and commercial
      diligence.
    relatedQuestionRefs:
      - QP005
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: blocking
    topic: audited-financials-and-gross-margin
    missingEvidence: >-
      Audited financial statements confirming GAAP revenue, gross margin breakdown between software and compute COGS,
      and monthly cash burn rate.
    whyItMatters: >-
      Without audited gross margin data, it is impossible to verify whether Baseten operates with defensible software
      economics or thin compute arbitrage margins.
    diligencePath: Request audited 2024–2025 financial statements and quarterly management accounts through direct sponsor diligence.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: retention-and-nrr
    missingEvidence: >-
      Historical cohort retention schedules, Net Revenue Retention (NRR), Gross Revenue Retention (GRR), and logo churn
      rates.
    whyItMatters: >-
      Usage-based revenue models in fast-evolving AI markets carry high volatility; customer graduation or switching
      could rapidly compress run-rate revenue.
    diligencePath: Inspect cohort-level NRR and customer concentration schedules across the top 20 accounts.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: compute-lease-commitments
    missingEvidence: >-
      Schedule of forward minimum GPU compute commitments, off-balance sheet lease obligations, and cloud reservation
      liabilities.
    whyItMatters: >-
      Rigid multi-year compute lease commitments create fixed-cost operating leverage that could strain liquidity during
      workload slowdowns.
    diligencePath: Review vendor agreements, neocloud capacity contracts, and minimum spend commitments.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: unverified-latency-benchmarks
    missingEvidence: >-
      Audited independent head-to-head performance benchmarks measuring time-to-first-token (TTFT), inter-token latency,
      and p99 request duration of Baseten managed serving against vanilla vLLM on identical GPU hardware.
    whyItMatters: >-
      Baseten commands a premium over raw GPU providers on the basis of proprietary runtime optimization, but public
      evidence comparing normalized latency and throughput under production concurrency is absent.
    diligencePath: >-
      Execute a standardized benchmarking suite (such as ShareGPT trace replays on H100 instances) comparing Baseten
      endpoints directly against self-hosted vLLM and SGLang instances under controlled concurrency.
    relatedQuestionRefs:
      - QE008
  - type: private-evidence-only
    severity: minor
    topic: cluster-level-utilization
    missingEvidence: >-
      Cluster-level GPU utilization telemetry, hardware idle ratios, and actual serverless cold-start distributions
      across Baseten's 87 production clusters.
    whyItMatters: >-
      Baseten's unit economics and margin profile depend heavily on aggregate GPU utilization across multi-cloud
      provider pools and managing idle standby costs for customers.
    diligencePath: >-
      Request anonymized infrastructure telemetry from Baseten technical management detailing average GPU duty cycle,
      allocation efficiency, and cold-start latency percentiles by model parameter class.
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: material
    topic: customer-retention-concentration
    missingEvidence: >-
      Audited net revenue retention (NRR), gross revenue retention (GRR), customer churn rates, and revenue
      concentration percentages for Baseten's top 5 and top 10 accounts.
    whyItMatters: >-
      Baseten's usage-based billing model makes revenue durability highly sensitive to workload shifts or model churn
      among large anchor accounts such as Cursor or Abridge.
    diligencePath: >-
      Request customer cohort retention schedules, top-customer concentration disclosures, and gross revenue retention
      figures under NDA as part of financial diligence.
    relatedQuestionRefs:
      - QU008
    relatedTableRefs:
      - TU002
      - TU003
  - type: private-evidence-only
    severity: material
    topic: compliance
    missingEvidence: >-
      Current SOC 2 report and exceptions, BAA, DPA, subprocessor list, penetration-test summary, security incidents,
      SLA language, and historical SLA attainment.
    whyItMatters: >-
      Company claims establish mitigation intent but do not size control effectiveness, contractual responsibility, or
      historical failure rates for regulated workloads.
    diligencePath: >-
      Request the documents under NDA, interview security leadership, sample customer contracts, and reconcile incidents
      and service credits to the status and support records.
    relatedQuestionRefs:
      - QR002
      - QR005
      - QR008
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Audited revenue, ARR reconciliation, gross margin, burn, cash balance, runway, capacity commitments, financing
      preferences, and revenue concentration.
    whyItMatters: >-
      Funding raised is not cash available, and revenue run rate does not establish recurring revenue quality or the
      economics of capacity expansion.
    diligencePath: >-
      Reconcile audited financials to billing and usage cohorts, inspect the cap table and debt, and stress-test
      contracted capacity against base and downside demand.
    relatedQuestionRefs:
      - QR004
      - QR007
      - QR008
    relatedTableRefs:
      - TR003
  - type: private-evidence-only
    severity: material
    topic: concentration
    missingEvidence: >-
      Cloud and GPU supplier shares, top-customer revenue shares, retention, contract duration, support effort, and
      vertical concentration.
    whyItMatters: >-
      Multi-cloud availability and named customers do not quantify switching risk, bargaining power, correlated outages,
      or workload durability.
    diligencePath: >-
      Obtain supplier and customer concentration schedules, renewal and churn cohorts, capacity contracts, and
      support-cost allocation by account.
    relatedQuestionRefs:
      - QR006
      - QR008
    relatedTableRefs:
      - TR002
      - TR003
  - type: enumeration-incomplete
    severity: minor
    topic: regulatory-risk-register
    missingEvidence: >-
      Comprehensive court, regulator, privacy authority, patent, sanctions, and contract records across every operating
      jurisdiction.
    whyItMatters: >-
      The public register covers material visible themes but cannot establish the absence of litigation, enforcement, IP
      disputes, or jurisdiction-specific obligations.
    diligencePath: >-
      Run jurisdiction-specific legal, regulatory, patent, and sanctions searches and obtain management counsel letters
      before investment committee approval.
    relatedQuestionRefs:
      - QR001
      - QR002
      - QR008
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: operating-economics
    missingEvidence: >-
      Audited revenue recognition, gross margin by deployment model, burn, runway, retention, cohort expansion, and
      customer concentration.
    whyItMatters: >-
      These inputs determine whether rapid reported growth creates durable equity value rather than capital-intensive
      scale.
    diligencePath: >-
      Obtain audited financials, monthly cohort schedules, top-customer contracts, compute commitments, and management's
      revenue-quality bridge.
    relatedQuestionRefs:
      - QV004
      - QV005
      - QV009
      - QV010
    relatedTableRefs:
      - TV003
  - type: private-evidence-only
    severity: material
    topic: financing-terms
    missingEvidence: >-
      The complete Series F cap table, tranche allocations, liquidation preferences, anti-dilution provisions, debt, and
      fully diluted ownership.
    whyItMatters: >-
      Headline valuation does not reveal the effective entry price, seniority, dilution, or proceeds available to common
      holders.
    diligencePath: >-
      Review the executed financing documents, cap-table model, side letters, debt schedule, and investor allocation by
      tranche.
    relatedQuestionRefs:
      - QV006
      - QV009
      - QV010
    relatedTableRefs:
      - TV001
      - TV003
