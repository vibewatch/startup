  - id: FU001
    title: Customer journey from initial planning use case to expansion
    type: journey-map
    summary: >-
      Public evidence shows a repeatable path from finance-led planning adoption to cross-functional use cases, while
      retention and expansion economics remain unverified.
    data:
      items:
        - label: Finance-led entry
          title: Finance-led entry
          detail: Budgeting, forecasting, consolidation, and scenario planning anchor the initial enterprise use case.
          touchpoints:
            - CFO/FP&A evaluation
            - Process discovery
            - Data mapping
        - label: Controlled deployment
          title: Controlled deployment
          detail: >-
            Partner-led design, configuration, integration, testing, training, and go-live create the implementation
            path.
          touchpoints:
            - Model configuration
            - User testing
            - Training and go-live
        - label: Cross-functional adoption
          title: Cross-functional adoption
          detail: Sales, workforce, supply-chain, and operations teams use connected planning models.
          touchpoints:
            - Quota and capacity planning
            - Workforce scenarios
            - Demand and inventory planning
        - label: Expansion and durability test
          title: Expansion and durability test
          detail: >-
            Additional modules or departments could expand account value, but public evidence does not disclose renewal,
            NRR, GRR, or concentration.
          touchpoints:
            - Additional planning domains
            - Renewal review
            - Customer concentration diligence
        - label: Customer reference validation
          title: Customer reference validation
          detail: >-
            Named customer proof can support reference quality, but production status and outcome methodology require
            direct confirmation.
          touchpoints:
            - Named operator reference
            - Outcome-method review
        - label: Retention underwriting
          title: Retention underwriting
          detail: >-
            Contract cohorts, active usage, and account-level revenue data are needed to test durability and expansion
            economics.
          touchpoints:
            - Cohort schedule
            - Renewal pipeline
            - ARR concentration
