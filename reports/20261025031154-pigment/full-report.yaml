          details: NeuronFeed lists Blossom Capital as the round lead.
          tone: positive
          claimRefs:
            - CO012
        - date: 2021-09
          label: $73M Series B
          details: NeuronFeed attributes the round to Greenoaks.
          tone: positive
          claimRefs:
            - CO012
        - date: 2022-09
          label: $65M financing
          details: NeuronFeed labels the round Series B and attributes it to IVP.
          tone: positive
          claimRefs:
            - CO012
        - date: 2023-06
          label: $88M Series C
          details: NeuronFeed lists ICONIQ Growth as the round lead.
          tone: positive
          claimRefs:
            - CO012
        - date: 2024-04
          label: $145M Series D
          details: NeuronFeed and CFO Shortlist report ICONIQ Growth led the round at about a $1B valuation.
          tone: positive
          claimRefs:
            - CO012
