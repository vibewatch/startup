        title: Milestones and current trajectory
        blocks:
          - type: paragraph
            body: >-
              Pigment progressed from a 2019 founding through five reported rounds by April 2024, then shifted its 2026
              narrative toward agent-assisted application creation. SiliconANGLE reported the Modeler Agent's March
              introduction and the September launch of Frames, an interface builder linked to governed planning models.
              The October Series E then more than doubled the last reported valuation from about $1 billion to $2.3
              billion. This trajectory shows capital access and product-release velocity, but the newest scale claims
              remain company issued. The assigned pool contains critical product reviews, yet no regulator, court,
              incident, or outage record; that absence cannot be treated as evidence that no adverse event occurred.
