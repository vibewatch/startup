  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              Pigment's relevant market is enterprise performance management and connected business planning, not all
              finance software or artificial intelligence spending. Included workflows are budgeting, forecasting,
              scenario modeling, management reporting, and cross-functional resource planning across finance, sales,
              workforce, and supply chain. General ERP, standalone business-intelligence dashboards, statutory
              consolidation-only tools, and broad AI applications sit outside the core boundary even when they are
              adjacent. The practical status quo is spreadsheet-based planning and disconnected departmental tools.
              Software alternatives range from enterprise planning suites to lighter FP&A products, so Pigment competes
              for an existing planning budget rather than creating an entirely new budget category.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM010
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM010
              - CM015
      - number: '2.2'
        title: Sizing lenses and evidence limits
        blocks:
          - type: paragraph
            body: >-
              MarketsandMarkets projected the global enterprise performance management market to reach USD 8.3 billion
              by 2027 at a 7.0% compound annual growth rate in a report published in June 2022. That is the closest
              numeric category lens in the assigned pool, but it is broader than Pigment's reachable market and is not a
              current company-specific estimate. The same publisher reports much larger AI-in-finance and
              decision-intelligence forecasts; those populations include products and use cases outside planning and
              therefore cannot be added to EPM or presented as Pigment TAM. No retained source isolates eligible spend
              by geography, company size, module, or sales reach. Pigment-specific SAM and SOM consequently remain
              unquantified gaps rather than zero values.
            claimRefs:
              - CM001
              - CM002
              - CM012
              - CM013
              - CM015
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM002
              - CM012
              - CM013
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM012
              - CM015
      - number: '2.3'
        title: Buyers, users, and adoption path
        blocks:
          - type: paragraph
            body: >-
              Finance and FP&A are the most natural budget owners, while sales and revenue operations, HR, supply-chain
              teams, and executives participate as users or co-sponsors when planning expands across functions. The
              buying case is reduced spreadsheet reconciliation, faster forecast and scenario cycles, and a governed
              model shared across teams. Adoption is not self-serve: implementation providers describe discovery,
              process design, data mapping, configuration, testing, training, and controlled go-live. The economic buyer
              therefore must fund both software and organizational change. Account-level payer ownership remains a
              diligence item because the assigned sources describe roles and workflows but do not disclose Pigment's
              actual budget-source mix.
            claimRefs:
              - CM003
              - CM005
              - CM006
              - CM007
              - CM009
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM005
              - CM006
              - CM007
              - CM009
      - number: '2.4'
        title: Adoption constraints and market judgment
        blocks:
          - type: paragraph
            body: >-
              The strongest adoption constraint is readiness, not category awareness. Planning agents depend on trusted
              source data, stable dimensions, governed model logic, permissions, testing, training, and human review.
              Independent review also describes a learning curve, formula complexity, occasional performance issues on
              complex models, fewer native integrations than some rivals, and opaque sales-led pricing. Lokad, a
              competitor, argues that Pigment should be viewed first as a broad planning platform and only second as a
              supply-chain-specific vendor; this is useful adverse framing but not an independent benchmark. The market
              case is therefore credible but evidence-constrained: valuation should depend on segment win rates,
              deployment cost, retention, and expansion, none of which the assigned public evidence quantifies.
            claimRefs:
              - CM006
              - CM008
              - CM009
              - CM011
              - CM014
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Broad category totals are not reachable market
            body: >-
              The EPM forecast is broader than Pigment's reachable spend, while the larger AI-in-finance and
              decision-intelligence forecasts cover different populations. None should be used directly as Pigment TAM,
              SAM, SOM, or a valuation denominator.
            calloutType: risk
            claimRefs:
              - CM001
              - CM002
              - CM012
              - CM013
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and buyer choice
        blocks:
          - type: paragraph
            body: >-
              The buyer is not choosing among like-for-like products. G2's reviewed alternatives include Anaplan,
              Workday Adaptive Planning, Planful, Causal, Mosaic Tech, Board, Vena, Abacum, SAP Analytics Cloud, and
              Workiva, while MarketsandMarkets' 2022 EPM roster also includes large-suite incumbents such as Oracle,
              SAP, IBM, and Infor. OneStream's filing independently demonstrates the scale attainable by a specialist
              platform, reporting 1,423 customers as of March 31, 2024. Spreadsheets and internal builds remain
              status-quo substitutes because they preserve familiar workflows and avoid an immediate platform migration.
              Pigment's claim that 56% of its 2025 new customers migrated from legacy vendors is therefore evidence of
              displacement activity, not proof of category leadership or market share.
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP009
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP009
              - CP010
              - CP013
              - CP014
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP005
              - CP006
              - CP009
              - CP010
              - CP013
              - CP014
              - CP016
      - number: '3.2'
        title: Capability and packaging trade-offs
        blocks:
          - type: paragraph
            body: >-
              Pigment's differentiation centers on shared business context, governed models, and AI embedded inside
              planning workflows. Its current materials describe Modeler, Analyst, and configurable agents spanning
              model creation, conversational analysis, recurring reports, permissions, and auditability. Anaplan now
              advertises deterministic calculations, probabilistic AI, connected data, workflows, and role-based agents,
              while Vena emphasizes Microsoft-native FP&A, Excel continuity, and AI inside familiar tools. Feature
              presence alone is consequently a weak moat test. Gartner reviewers praise Pigment's integrations and
              flexibility, but one critical review reports consultant dependence for minor changes, low non-finance
              adoption, and unexplained discrepancies in complex calculations. Buyers must test accuracy, model
              maintenance, role-specific adoption, and governed write-back rather than compare marketing labels.
            claimRefs:
              - CP005
              - CP006
              - CP013
              - CP014
              - CP015
          - type: table
            tableRef: TP002
            claimRefs:
              - CP005
              - CP006
              - CP010
              - CP013
              - CP014
              - CP015
      - number: '3.3'
        title: Distribution, implementation, and switching costs
        blocks:
          - type: paragraph
            body: >-
              Distribution can outweigh interface quality in enterprise planning. OneStream reported a direct sales
              motion plus more than 250 go-to-market, implementation, and development partners, including major global
              systems integrators. Vena can reduce behavioral switching by retaining Excel, while large-suite vendors
              can bundle planning into established finance or ERP relationships. Pigment can counter with faster model
              evolution and a modern cross-functional experience, but its public pricing remains sales-led and custom.
              OneStream's filing also shows why contract and services structure matter: its access revenue used SaaS and
              license models, most SaaS and term-license contracts had three-year terms, and professional services were
              distinct. Without comparable proposals, implementation statements of work, and renewal data, Pigment's
              claimed speed advantage cannot be translated into normalized total cost or verified lock-in.
            claimRefs:
              - CP007
              - CP010
              - CP011
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP007
              - CP010
              - CP011
              - CP013
              - CP014
      - number: '3.4'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Pigment's strongest potential moat is the accumulated business logic, permissions, integrations, and
              operating routines embedded in a shared planning model. That is workflow lock-in, not a network effect,
              and it becomes durable only when customers expand use cases and renew economically. Lokad, itself an
              adjacent competitor rather than an independent benchmark, judges Pigment to be a credible EPM platform but
              not a supply-chain-native optimization engine and argues that public proof lags the newest agentic claims.
              OneStream's filing likewise describes intense competition from both legacy suites and point products.
              Pigment is therefore exposed on both sides: incumbents can copy agent features and use distribution, while
              lighter tools and spreadsheets can win when teams reject implementation complexity. Durable
              differentiation requires evidence of retention, expansion, lower services intensity, and better decision
              outcomes under comparable workloads.
            claimRefs:
              - CP003
              - CP008
              - CP012
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Evidence-backed wedge
            body: >-
              Pigment combines governed cross-functional models with agents for model creation, analysis, reporting, and
              recurring workflows; that integration is more meaningful than adding a generic chat layer.
            calloutType: strength
            claimRefs:
              - CP015
          - type: callout
            title: Configuration can become lock-in
            body: >-
              The same flexibility that embeds Pigment in workflows can increase dependence on trained modelers or
              consultants, particularly outside finance or in complex models.
            calloutType: risk
            claimRefs:
              - CP006
              - CP016
          - type: callout
            title: Competitive proof required
            body: >-
              Run matched bake-offs and collect comparable proposals, implementation plans, error logs, adoption
              cohorts, and renewals before underwriting lower total cost or durable AI differentiation.
            calloutType: recommendation
            claimRefs:
              - CP003
              - CP006
              - CP007
              - CP008
              - CP016
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization
        blocks:
          - type: paragraph
            body: >-
              Pigment monetizes a cloud enterprise planning platform through a sales-led, custom-quote motion rather
              than self-serve subscriptions. Independent practitioner coverage describes pricing as dependent on user
              types, modules, contract term and implementation support, while a separate review says there is no free
              plan and no published price list. The product surface spans FP&A, sales, workforce and supply-chain
              planning, so revenue quality depends on adoption across governed models rather than on a single narrow
              SKU. Official partner descriptions say the platform connects P&L, balance sheet and cash flow forecasts,
              but those are product capabilities, not evidence of Pigment's own reported revenue mix. The October 2026
              financing announcement claims $100M+ ARR, but it is a company-issued release and does not disclose
              recognition policy, gross retention, NRR, customer concentration or audited revenue. List price, realized
              price, discounting and contract duration must therefore remain diligence asks rather than estimated
              inputs.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI005
              - CI006
              - CI013
          - type: table
            tableRef: TI002
            claimRefs:
              - CI002
              - CI003
              - CI007
              - CI008
      - number: '4.2'
        title: Commercial efficiency and delivery cost
        blocks:
          - type: paragraph
            body: >-
              The public record supports a recurring enterprise-software delivery model, but not a complete
              unit-economics model. Pigment's implementation ecosystem emphasizes discovery, data mapping,
              configuration, testing, training and controlled go-live; RSM similarly frames advisory, implementation,
              optimization and managed services as part of the lifecycle. This implies meaningful implementation and
              customer-success work alongside recurring license revenue, with partner capacity and customer data
              readiness affecting time to value. A practitioner review gives directional implementation fees of
              approximately 0.3–1.0x annual license, but that is an external buying heuristic, not Pigment guidance or a
              verified company-wide average. Public evidence does not establish CAC, payback, sales-cycle length, gross
              margin, services margin, expansion rate or support cost. The financially conservative conclusion is that
              Pigment may have attractive software gross-margin characteristics, but the mix of subscription,
              implementation and managed services is not disclosed sufficiently to model it.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
          - type: table
            tableRef: TI003
            claimRefs:
              - CI004
              - CI010
              - CI011
              - CI012
              - CI016
      - number: '4.3'
        title: Traction, capital adequacy and financing dependency
        blocks:
          - type: paragraph
            body: >-
              Pigment has substantial disclosed venture backing, but financing raised is not the same as cash available.
              Its 2023 company announcement described an $88M Series C and $248M cumulative funding at that time. A
              current October 2026 announcement claims a $250M Series E at a $2.3B valuation and says ARR exceeded $100M
              earlier in the year, with ARR doubling year over year. These figures are company claims carried by a
              syndicated release and should not be treated as independently audited. A separate independent profile
              records approximately $396.9M raised across five rounds through 2026, but its round chronology conflicts
              with the current company announcement's Series E framing and is not a substitute for a cap table. No
              assigned source provides cash on hand, quarterly burn, runway, debt obligations, covenant headroom or the
              next-round trigger. Capital adequacy is consequently unproven even though disclosed fundraising is large
              relative to the reported ARR.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
      - number: '4.4'
        title: Financial underwriting verdict
        blocks:
          - type: paragraph
            body: >-
              The financial case is promising but not underwritable on public evidence alone. The reported ARR scale and
              enterprise adoption narrative support a credible recurring-revenue hypothesis, while custom pricing and
              broad planning scope could support expansion across finance and operating teams. However, the $2.3B
              valuation is a company-stated financing valuation, not a public-market mark, and no assigned source
              supplies the denominator needed to test an ARR multiple against retention, growth quality or gross margin.
              The independent Lokad review is a useful adverse check: it characterizes Pigment as a collaborative
              planning and forecasting platform rather than a specialized optimization engine, and says public evidence
              does not justify treating it as a native operational optimization system. That limitation may constrain
              monetization in highly specialized workflows. The investment posture should remain research-more until a
              data room supplies audited revenue, ARR bridge, gross margin, cohort retention, customer concentration,
              cash and burn, debt terms, and realized pricing by segment.
            claimRefs:
              - CI013
              - CI014
              - CI015
              - CI016
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI005
              - CI010
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Disclosed commercial scale
            body: >-
              The October 2026 announcement claims ARR above $100M and a $250M Series E, indicating meaningful reported
              scale even though the figures are not independently audited.
            calloutType: strength
            claimRefs:
              - CI010
              - CI011
          - type: callout
            title: Underwriting data gap
            body: >-
              No assigned source discloses cash, burn, runway, gross margin, NRR, CAC payback or customer concentration,
              so capital adequacy and valuation cannot be tested rigorously.
            calloutType: risk
            claimRefs:
              - CI012
              - CI016
          - type: callout
            title: Data-room gate
            body: >-
              Require audited revenue and ARR reconciliation, cohort retention, realized pricing, services mix, cash and
              debt schedules before treating the reported valuation as investable.
            calloutType: recommendation
            claimRefs:
              - CI003
              - CI008
              - CI016
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Customer workflow and product perimeter
        blocks:
          - type: paragraph
            body: >-
              Pigment is delivered as a cloud planning application rather than as a spreadsheet add-on or a
              single-purpose supply-chain optimizer. Its core workflow is to connect finance, sales, HR, and
              supply-chain plans to a shared governed model, then let teams change assumptions, run scenarios, and
              propagate the resulting effects across dependent views. Pigment's sales-planning surface describes live
              CRM and HR data, quota and territory planning, capacity, forecasting, and collaboration across sales and
              finance. A partner implementation description adds a practical sequence of discovery, process mapping,
              data integration, testing, training, and controlled go-live. This is a credible enterprise workflow, but
              statutory consolidation may still require a dedicated companion tool according to the same implementation
              source.
            claimRefs:
              - CE001
              - CE002
              - CE003
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE004
              - CE008
              - CE012
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE003
              - CE005
              - CE010
              - CE013
      - number: '5.2'
        title: Architecture, integrations, and maturity
        blocks:
          - type: paragraph
            body: >-
              The strongest public architecture signal is not a diagram of proprietary internals but the consistency of
              the operating model across sources: a shared multidimensional model, driver-based calculations, scenarios,
              workflows, integrations, and governed access. Public third-party descriptions attribute elastic scaling to
              Pigment's Graphite engine and describe connectors to Salesforce, SAP, NetSuite, Sage Intacct, Databricks,
              and BigQuery, while Pigment's own sales planning page describes native connectors, APIs, and scheduled
              imports. The MCP specification confirms that an MCP integration is a protocol bridge between hosts,
              clients, and servers with explicit capability negotiation; that establishes the dependency's mechanism,
              not proof that Pigment's implementation is production-complete. A technical review characterizes Pigment
              as stronger in collaborative planning and forecasting than in publicly inspectable optimization.
            claimRefs:
              - CE004
              - CE005
              - CE006
              - CE007
          - type: table
            tableRef: TE003
            claimRefs:
              - CE004
              - CE006
              - CE007
              - CE009
              - CE011
              - CE014
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE004
              - CE008
              - CE009
              - CE011
              - CE015
      - number: '5.3'
        title: Differentiation, trust, and implementation risk
        blocks:
          - type: paragraph
            body: >-
              Pigment's differentiation is the combination of cross-functional model reuse, scenario iteration, and an
              AI layer that operates inside governed planning data rather than beside it. The sales-planning page says
              the Modeler Agent can build or extend quota, capacity, and forecast models from plain-language requests
              with an approval plan first, while the Analyst Agent handles variance and trend analysis. The MCP
              protocol's own security guidance is a useful control benchmark: user consent, access controls, explicit
              tool authorization, and protection against untrusted tool descriptions are expected implementation
              responsibilities. Pigment's public product material does not disclose enough quantitative benchmark data
              to validate autonomous planning quality, model accuracy, or end-to-end security posture; these are
              diligence items rather than assumptions.
            claimRefs:
              - CE008
              - CE009
              - CE010
              - CE011
      - number: '5.4'
        title: Product verdict and diligence priorities
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a product with a coherent planning substrate and a broad enterprise operating model,
              not merely a dashboard layer. G2 reviewer comparisons place Pigment among established planning
              alternatives, while independent and partner descriptions consistently emphasize shared models, scenario
              analysis, and cross-functional planning. The counterweight is implementation and proof risk: pricing is
              sales-led, integration breadth varies by source, the learning curve can be meaningful, and public material
              does not establish the reliability of agent-generated logic or the performance of the Graphite engine
              under a buyer's workload. An investment-grade technical review should therefore require a sandbox using
              representative data, an integration inventory, agent audit logs, permission tests, service-level
              commitments, and references for production deployments rather than treating roadmap language as delivered
              maturity.
            claimRefs:
              - CE012
              - CE013
              - CE014
              - CE015
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Coherent product center
            body: >-
              Pigment's strongest evidence is architectural coherence: the same governed model supports finance, sales,
              workforce, supply-chain, scenarios, and AI assistance rather than presenting unrelated modules.
            calloutType: strength
            claimRefs:
              - CE001
              - CE004
              - CE012
          - type: callout
            title: Agentic claims need production proof
            body: >-
              Public sources describe Modeler, Analyst, and MCP capabilities, but they do not provide sufficient
              independent evidence on agent accuracy, failure rates, permission boundaries, or autonomous planning
              outcomes.
            calloutType: risk
            claimRefs:
              - CE008
              - CE009
              - CE010
              - CE015
          - type: callout
            title: Make the technical evaluation workload-specific
            body: >-
              Require a representative-data sandbox, integration and permission tests, agent approval logs, and
              production references before underwriting technical maturity or implementation speed.
            calloutType: recommendation
            claimRefs:
              - CE013
              - CE014
              - CE015
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer and use-case segmentation
        blocks:
          - type: paragraph
            body: >-
              Pigment is positioned for finance and FP&A teams, but its customer surface is explicitly cross-functional.
              RSM describes finance, sales, operations, HR, and supply-chain planning in one environment, while its
              implementation process includes process discovery, data mapping, testing, training, and controlled
              go-live. This points to an enterprise buying motion in which finance often anchors the purchase and
              adjacent functions expand the use case. The public evidence also includes technology, retail, logistics,
              education, and public sector examples, but it does not provide a complete customer population or
              revenue-by-segment breakdown. Accordingly, the segmentation below distinguishes observed use cases from
              unsupported scale or value claims.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
      - number: '6.2'
        title: Adoption trajectory and durability
        blocks:
          - type: paragraph
            body: >-
              The strongest adoption signals are named deployments, repeated operational use cases, and reported
              workflow outcomes rather than a disclosed account count. Pigment's case-study index lists customers using
              budgeting, forecasting, sales capacity, workforce, demand, inventory, and reporting workflows; several
              entries attach named job titles or quantified time savings. RSM independently frames success as faster and
              more controlled finance cycles validated during testing, which supports an implementation-and-adoption
              pathway rather than a logo-only signal. However, neither the company-facing material nor the independent
              reviews establish active-user counts, renewal rates, cohort retention, GRR, NRR, contract duration, or
              customer concentration. Reported outcomes are therefore directional proof of use, not proof of durable
              revenue.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
          - type: figure
            figureRef: FU001
            claimRefs: []
      - number: '6.3'
        title: Named customer proof and expansion risk
        blocks:
          - type: paragraph
            body: >-
              Named customer evidence is broad enough to support a platform-expansion thesis: the roster spans
              enterprise finance, revenue operations, workforce planning, supply chain, and public-sector budgeting.
              PYMNTS reports large enterprises including Danone, DirecTV, Siemens, Snowflake, ServiceNow, and Unilever
              using Pigment, while the case-study index adds named operators and use cases for accounts such as Carta,
              Algolia, Figma, and Danone. The distinction between a public case study, a customer-quoted outcome, a
              partner implementation page, and production deployment still matters; the available text does not disclose
              contract size, implementation completion dates, renewal status, or the share of revenue contributed by any
              named account. Expansion is plausible but not quantified, and partner-led delivery creates an additional
              dependency to test.
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
              - CU014
          - type: table
            tableRef: TU003
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
              - CU014
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Enterprise reference breadth is credible
            body: >-
              Named users and case studies span finance, revenue, workforce, supply chain, technology, retail,
              logistics, and public-sector planning, which is stronger evidence than an undifferentiated logo wall.
            calloutType: strength
            claimRefs:
              - CU010
              - CU011
          - type: callout
            title: Durability cannot be inferred from logos or outcomes
            body: >-
              The public record does not disclose customer count, active usage, renewal, NRR, GRR, contract duration, or
              top-account concentration; a data-room review is required before underwriting retention or expansion.
            calloutType: risk
            claimRefs:
              - CU009
              - CU014
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk prioritization and thesis impact
        blocks:
          - type: paragraph
            body: >-
              Pigment is positioned as a connected planning system for finance, sales, workforce, and supply-chain
              teams, so failure modes can propagate across business-critical workflows rather than remaining isolated to
              a single report. Independent and partner descriptions emphasize shared governed data, implementation
              design, testing, training, and ongoing optimization, while user-oriented reviews identify a steep learning
              curve, restricted visualization configuration, and a clunky interface. The highest near-term risk is
              therefore execution: a customer may buy the strategic promise but fail to achieve adoption or reliable
              model ownership. The investment implication is to treat implementation evidence, control documentation,
              and referenceable production outcomes as gating diligence rather than assuming platform capability equals
              realized value.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR002
              - CR004
              - CR006
              - CR012
      - number: '7.2'
        title: Regulatory, privacy, and legal exposure
        blocks:
          - type: paragraph
            body: >-
              Pigment's product uses AI agents, governed business data, APIs, and an MCP server, which creates a
              compliance perimeter spanning privacy, security, transparency, and customer-specific employment or
              financial workflows. The European Commission states that AI Act transparency rules apply from August 2026
              and that providers and deployers must address human oversight, robustness, cybersecurity, accuracy,
              documentation, and monitoring for relevant high-risk uses. CNIL's 2026 activity page shows active French
              enforcement and AI-related privacy work, but the public material reviewed does not identify a Pigment
              enforcement action. This is not evidence of compliance or absence of incidents; the unresolved question is
              whether Pigment's controls, customer responsibilities, model usage, and data-processing arrangements are
              documented for each deployment and jurisdiction.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
      - number: '7.3'
        title: Operational, security, and dependency risk
        blocks:
          - type: paragraph
            body: >-
              The platform's value depends on data integrations, model correctness, access controls, and implementation
              partners. RSM describes discovery, data mapping, testing, finance-user validation, training, controlled
              go-live, governance, and managed services; 3PEAKS also says consolidation is usually paired with a
              dedicated tool. AICPA explains that SOC reports give service users information needed to assess
              outsourcing risk, but no Pigment-specific control report is present in the retained evidence. These
              statements establish diligence and mitigation paths, not proof that every deployment is reliable. The most
              important monitor is the rate of failed integrations, model defects, unresolved access exceptions, and
              planning-cycle delays after go-live, tested by customer segment and deployment age.
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR002
              - CR004
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR009
              - CR010
              - CR011
              - CR012
      - number: '7.4'
        title: Financial, partner, and thesis-break criteria
        blocks:
          - type: paragraph
            body: >-
              Pigment's commercial model is sales-led and custom-priced, with implementation services and user-type mix
              affecting total cost. This creates budget, procurement, and margin compression risk for customers and
              makes external assessment of retention, gross margin, burn, runway, and concentration difficult. The
              October 2026 funding announcement reports more than $100 million ARR and a $2.3 billion valuation, but it
              is a company-issued announcement syndicated through Yahoo Finance and should not be treated as independent
              corroboration. A thesis break would be a pattern of failed production deployments, materially unresolved
              security or privacy findings, inability to evidence recurring retention and expansion, or financing needs
              inconsistent with the disclosed valuation. Until those tests are answered, the risk posture remains
              medium-to-high despite strong capitalization and named enterprise adoption claims.
            claimRefs:
              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Highest-priority diligence
            body: >-
              Obtain customer-level production references, independent control reports, AI/privacy documentation, and
              retention, margin, burn, and concentration data before treating the disclosed valuation as investable.
            calloutType: risk
            claimRefs:
              - CR008
              - CR012
              - CR014
              - CR015
          - type: callout
            title: Evidence boundary
            body: >-
              Publicly available pages reviewed here establish obligations, product limitations, and proposed
              mitigations, but do not establish the absence of security incidents, litigation, or customer churn.
            calloutType: assumption
            claimRefs:
              - CR007
              - CR011
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Financing context and entry discipline
        blocks:
          - type: paragraph
            body: >-
              Pigment's latest financing is the strongest current price signal in the assigned evidence. The company
              announced a $250 million Series E at a $2.3 billion valuation, led by EQT's Scaleup Europe Fund; The SaaS
              News and Yahoo Finance repeat the company-issued release rather than provide independent price discovery.
              Yahoo's copy records Pigment's statement that ARR surpassed $100 million earlier in 2026. Those are
              meaningful scale signals, but the announcement does not disclose preferred-security terms, liquidation
              preferences, any secondary component, ownership dilution, or cash balance. A $2.3 billion headline
              valuation therefore sets an entry reference, not proved common-equity value. Dividing that value by ARR
              above $100 million produces a headline multiple below 23x, not a precise 23x observation. The exact
              multiple remains unavailable because ARR is disclosed only as a floor and the retained text does not
              define whether the valuation is post-money or fully diluted.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV011
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV011
              - CV012
      - number: '8.2'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The positive case is a category-scale enterprise planning platform with fresh capital, visible adoption
              claims, and a product narrative that extends from connected planning into autonomous workflows. The
              official announcement says Graphite can support thousands of agents and people on governed models and
              scale to hundreds of billions of data points, while 85% of new metrics are reportedly created by an Agent.
              The counter-case is that the public record is weighted toward issuer claims and implementation-oriented
              commentary. Makerstack describes custom, sales-led pricing with no free plan and flags a learning curve,
              slower calculations on complex models, and fewer native integrations; 3PEAKS says statutory consolidation
              usually requires a dedicated tool. Competitor Lokad separately argues that Pigment's agentic and
              optimization claims are more ambitious than its publicly inspectable quantitative core. These limitations
              can lengthen sales cycles, raise services burden, or leave the premium dependent on unverified execution.
            claimRefs:
              - CV004
              - CV006
              - CV008
              - CV009
              - CV010
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV004
              - CV006
              - CV008
              - CV009
              - CV010
              - CV014
      - number: '8.3'
        title: Scenarios, comparables, and diligence gates
        blocks:
          - type: paragraph
            body: >-
              A scenario framework is more defensible than a single target price because the retained evidence does not
              provide audited gross margin, net retention, cash burn, or a verified customer concentration profile. The
              bull case requires repeatable ARR growth, durable paid AI adoption, and efficient use of the new capital;
              only then could the $2.3 billion mark become supportable. The base case assumes enterprise demand persists
              but custom pricing, implementation work, and disclosure constraints continue, supporting a watch posture
              and entry below the disclosed mark rather than a buy. The bear case combines multiple compression with
              slower conversion, services-heavy deployments, or another financing before durable cash generation,
              implying a down-round risk with no defensible public floor. G2 identifies product alternatives but
              provides no valuation multiples. SEC results confirm that OneStream primary filings exist, yet the
              retained search page is only a starting point for a dated public-company comparison. Exit readiness is
              likewise unproven in this pool. The next decision should be gated on financing documents, audited KPIs,
              and a dated comparable set.
            claimRefs:
              - CV005
              - CV007
              - CV012
              - CV013
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV011
              - CV012
              - CV013
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Research-more, not buy
            body: >-
              The round validates investor demand and a large headline valuation, but the public evidence does not yet
              establish the cash generation, retention, margin, dilution, or preference profile needed to support a buy
              at $2.3 billion.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV011
              - CV012
          - type: callout
            title: Principal valuation risk
            body: >-
              A headline valuation can remain unsupported if ARR quality, customer concentration, implementation
              economics, or financing preferences differ materially from the public narrative.
            calloutType: risk
            claimRefs:
              - CV006
              - CV008
              - CV012
              - CV013
