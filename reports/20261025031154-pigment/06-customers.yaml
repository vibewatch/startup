company:
  name: Pigment
chapter:
  number: 6
  title: Customers
  summary: Pigment shows credible enterprise adoption across finance, sales, workforce, and supply-chain planning, with a broad named customer roster and implementation-partner evidence. Public material supports deployment and use-case breadth, but does not disclose customer count, retention, net revenue retention, or concentration, so durability and account quality remain diligence gaps.
sections:
  - id: customer-segmentation
    title: Buyer and use-case segmentation
    body: >-
      Pigment is positioned for finance and FP&A teams, but its customer surface is
      explicitly cross-functional. RSM describes finance, sales, operations, HR, and
      supply-chain planning in one environment, while its implementation process
      includes process discovery, data mapping, testing, training, and controlled
      go-live. This points to an enterprise buying motion in which finance often
      anchors the purchase and adjacent functions expand the use case. The public
      evidence also includes technology, retail, logistics, education, and public
      sector examples, but it does not provide a complete customer population or
      revenue-by-segment breakdown. Accordingly, the segmentation below distinguishes
      observed use cases from unsupported scale or value claims.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: adoption-and-durability
    title: Adoption trajectory and durability
    body: >-
      The strongest adoption signals are named deployments, repeated operational
      use cases, and reported workflow outcomes rather than a disclosed account
      count. Pigment's case-study index lists customers using budgeting, forecasting,
      sales capacity, workforce, demand, inventory, and reporting workflows; several
      entries attach named job titles or quantified time savings. RSM independently
      frames success as faster and more controlled finance cycles validated during
      testing, which supports an implementation-and-adoption pathway rather than a
      logo-only signal. However, neither the company-facing material nor the
      independent reviews establish active-user counts, renewal rates, cohort
      retention, GRR, NRR, contract duration, or customer concentration. Reported
      outcomes are therefore directional proof of use, not proof of durable revenue.
    claimRefs: [CU005, CU006, CU007, CU008, CU009]
    tableRefs: [TU002]
    figureRefs: [FU001]
  - id: named-proof-and-expansion
    title: Named customer proof and expansion risk
    body: >-
      Named customer evidence is broad enough to support a platform-expansion thesis:
      the roster spans enterprise finance, revenue operations, workforce planning,
      supply chain, and public-sector budgeting. PYMNTS reports large enterprises
      including Danone, DirecTV, Siemens, Snowflake, ServiceNow, and Unilever using
      Pigment, while the case-study index adds named operators and use cases for
      accounts such as Carta, Algolia, Figma, and Danone. The distinction between a
      public case study, a customer-quoted outcome, a partner implementation page,
      and production deployment still matters; the available text does not disclose
      contract size, implementation completion dates, renewal status, or the share
      of revenue contributed by any named account. Expansion is plausible but not
      quantified, and partner-led delivery creates an additional dependency to test.
    claimRefs: [CU010, CU011, CU012, CU013, CU014]
    tableRefs: [TU003]
