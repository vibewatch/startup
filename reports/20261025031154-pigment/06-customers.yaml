      coverage: partial
      basis: "Named organizations and use cases visible in assigned public customer pages and 2026 reporting; not a complete customer census."
    columns: [Customer, Segment, Deployment/use case, Production vs pilot, Outcome, Limitation]
    rows:
      - ["Unilever", "Enterprise finance and operations", "Enterprise planning and financial/operational planning", "Reported user; production status not independently confirmed", "Named in PYMNTS and award coverage", "No contract or renewal disclosure"]
      - ["Danone", "Enterprise finance and operations", "Business planning and performance management", "Reported user; deployment stage not disclosed", "Named in PYMNTS and case-study index", "No quantified public outcome in assigned text"]
      - ["Carta", "Strategic finance", "Data aggregation and planning", "Named case-study account; production status not disclosed", "Case-study index reports 80% data-aggregation time reduction", "No baseline or retention disclosure"]
      - ["Algolia", "Revenue operations", "Sales planning", "Named case-study account; production status not disclosed", "Case-study index reports 90% sales-planning time reduction", "No methodology or renewal disclosure"]
      - ["Ankorstore", "Finance and operations", "Forecasting and demand forecasting", "Named case-study account; production status not disclosed", "Case-study index describes forecasting improvements", "No quantified denominator in assigned text"]
    notes: "This is a partial enumeration of named proof. Company-facing case-study listings and syndicated reporting establish named use cases, but do not independently prove production deployment, causality, contract value, or retention."
    claimRefs: [CU010, CU011, CU012, CU013, CU014]
figures:
  - id: FU001
    title: Customer journey from initial planning use case to expansion
    type: journey-map
    summary: Public evidence shows a repeatable path from finance-led planning adoption to cross-functional use cases, while retention and expansion economics remain unverified.
    data:
      items:
        - label: Finance-led entry
          title: Finance-led entry
          detail: Budgeting, forecasting, consolidation, and scenario planning anchor the initial enterprise use case.
          touchpoints: [CFO/FP&A evaluation, Process discovery, Data mapping]
        - label: Controlled deployment
          title: Controlled deployment
          detail: Partner-led design, configuration, integration, testing, training, and go-live create the implementation path.
          touchpoints: [Model configuration, User testing, Training and go-live]
        - label: Cross-functional adoption
          title: Cross-functional adoption
          detail: Sales, workforce, supply-chain, and operations teams use connected planning models.
          touchpoints: [Quota and capacity planning, Workforce scenarios, Demand and inventory planning]
        - label: Expansion and durability test
          title: Expansion and durability test
          detail: Additional modules or departments could expand account value, but public evidence does not disclose renewal, NRR, GRR, or concentration.
          touchpoints: [Additional planning domains, Renewal review, Customer concentration diligence]
        - label: Customer reference validation
          title: Customer reference validation
          detail: Named customer proof can support reference quality, but production status and outcome methodology require direct confirmation.
          touchpoints: [Named operator reference, Outcome-method review]
        - label: Retention underwriting
          title: Retention underwriting
          detail: Contract cohorts, active usage, and account-level revenue data are needed to test durability and expansion economics.
          touchpoints: [Cohort schedule, Renewal pipeline, ARR concentration]
callouts:
  - calloutType: strength
    title: Enterprise reference breadth is credible
    body: Named users and case studies span finance, revenue, workforce, supply chain, technology, retail, logistics, and public-sector planning, which is stronger evidence than an undifferentiated logo wall.
    claimRefs: [CU010, CU011]
  - calloutType: risk
    title: Durability cannot be inferred from logos or outcomes
    body: The public record does not disclose customer count, active usage, renewal, NRR, GRR, contract duration, or top-account concentration; a data-room review is required before underwriting retention or expansion.
    claimRefs: [CU009, CU014]
