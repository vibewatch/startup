evidenceGaps:
  - type: missing-source
    severity: material
    topic: customer-scale
    missingEvidence: Current customer count, customer concentration, and a complete geographic office footprint.
    whyItMatters: Scale and concentration cannot be evaluated from selected customer logos or employee coverage.
    diligencePath: Request the current customer roster, ARR concentration schedule, legal-entity list, and office register.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: financing
    missingEvidence: >-
      Audited revenue, ARR reconciliation, gross margin, NRR, burn, cash balance, debt, secondaries, and financing
      preferences.
    whyItMatters: Announced funding and valuation do not establish liquidity, runway, dilution, or operating quality.
    diligencePath: Obtain audited statements, bank balances, debt schedule, cap table, round documents, and ARR cohort bridge.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO001
      - TO003
  - type: enumeration-incomplete
    severity: material
    topic: governance
    missingEvidence: >-
      Complete executive roster, board composition, voting control, founder ownership, departures, and succession
      coverage.
    whyItMatters: Governance rights and key-person resilience cannot be assessed from founder biographies and investor names.
    diligencePath: Request the board pack, governance chart, cap table, employment roster, and executive-change history.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: A dated company payroll or HRIS headcount reconciliation for the 400 versus approximately 656 public figures.
    whyItMatters: The difference materially changes interpretations of operating scale and ARR per employee.
    diligencePath: Obtain monthly ending headcount by function and geography, including contractors and acquisition treatment.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: minor
    topic: adverse-events
    missingEvidence: Regulator, court, outage, security-incident, and employment-action records for the current review window.
    whyItMatters: Critical product reviews do not establish whether legal, regulatory, operational, or workforce events occurred.
    diligencePath: Run jurisdiction-specific court, regulator, status-page, breach, and workforce-record checks.
    relatedQuestionRefs:
      - QO005
  - type: missing-source
    severity: material
    topic: market-size
    missingEvidence: >-
      A current independent market study isolating connected planning or xP&A spend by geography, company size, module,
      and buyer budget.
    whyItMatters: The broad EPM estimate cannot establish Pigment's reachable SAM or support a direct company valuation denominator.
    diligencePath: >-
      Obtain current analyst cuts or commission a segmented market study, then reconcile its definitions with Pigment's
      pipeline.
    relatedQuestionRefs:
      - QM002
      - QM003
