    columns: [User job, Current workflow, Pigment solution, Measurable benefit or signal, Limitation]
    rows:
      - [Build a budget and forecast, Reconcile separate departmental spreadsheets, Shared model with driver-based updates, Reduced version drift is the stated mechanism, Public sources do not quantify close-time reduction]
      - [Run a what-if scenario, Rebuild formulas or duplicate model tabs, Natural-language or driver-based scenario analysis, Downstream effects can propagate across connected plans, Output accuracy and review controls require testing]
      - [Plan quotas and territories, Coordinate sales targets with finance, Sales planning model connected to financial outcomes, Shared numbers and live data are described by Pigment, CRM data quality and refresh SLAs are undisclosed]
      - [Plan workforce capacity, Link hiring plans to cost and revenue capacity, Workforce planning in the same model, Cross-functional dependency visibility is the product rationale, No public retention or forecast-error benchmark]
      - [Coordinate supply and demand, Align operations and finance plans, Supply-chain and S&OP scenarios in the planning environment, Faster iteration is claimed by product and partner sources, Not proven to be a native optimization engine]
      - [Support executive decisions, Assemble dashboards from multiple systems, Governed dashboards and narrative-ready outputs, One model can serve tailored stakeholder views, Board and chart usability concerns appear in independent review material]
    notes: "Rows synthesize distinct user jobs from public product and implementation descriptions; benefit language is qualitative unless a source supplies a measured result."
    claimRefs: [CE001, CE003, CE005, CE010, CE013]
  - id: TE003
    title: Technology and operating architecture
    columns: [Layer or process, Role, Dependency, Risk or diligence question]
    rows:
      - ["Source-system ingestion", "Native connectors, APIs, and scheduled imports", "Keep CRM, ERP, HR, and warehouse data current", "Connector coverage and failure/retry behavior need an inventory"]
      - ["Governed multidimensional model", "Shared planning state for functions and scenarios", "Business logic, permissions, and source data", "Test dimensionality, lineage, and export portability"]
      - ["Calculation and scenario layer", "Recompute drivers and downstream views", "Formula engine and model dependencies", "Benchmark concurrency, recalculation latency, and rollback"]
      - ["Forecasting and prediction", "Generate forecasts or predictive insights", "Historical data and selected model/configuration", "Require accuracy, bias, and model-selection evidence by use case"]
      - ["AI agent layer", "Modeler and Analyst assistance", "Governed live models plus business logic", "Require human approval, prompt/data boundaries, audit logs, and failure controls"]
      - ["MCP integration", "Expose data, models, or agents to external AI tools", "MCP host/client/server protocol and Pigment permissions", "Verify consent, least privilege, tool authorization, and residency"]
      - ["Implementation and support", "Configure, integrate, test, train, and operate the environment", "Pigment or systems-integrator skills", "Validate milestones, ownership, SLA, and change-management effort"]
    notes: "This is an evidence-based operating architecture, not a vendor-confirmed internal deployment diagram; public documentation leaves several runtime and security details open."
    claimRefs: [CE004, CE006, CE007, CE009, CE011, CE014]
