company:
  name: Pigment
chapter:
  number: 5
  title: Product & Technology
  summary: Pigment presents a connected, multidimensional planning environment spanning finance, sales, workforce, and supply chain, with AI agents and an MCP server layered on top. Public evidence supports a coherent planning substrate and real implementation workflow, but the newest autonomous-planning claims remain less technically inspectable than the core modeling and integration surface.
sections:
  - id: product-workflow
    title: Customer workflow and product perimeter
    body: >-
      Pigment is delivered as a cloud planning application rather than as a spreadsheet add-on or a
      single-purpose supply-chain optimizer. Its core workflow is to connect finance, sales, HR, and
      supply-chain plans to a shared governed model, then let teams change assumptions, run scenarios,
      and propagate the resulting effects across dependent views. Pigment's sales-planning surface
      describes live CRM and HR data, quota and territory planning, capacity, forecasting, and
      collaboration across sales and finance. A partner implementation description adds a practical
      sequence of discovery, process mapping, data integration, testing, training, and controlled
      go-live. This is a credible enterprise workflow, but statutory consolidation may still require a
      dedicated companion tool according to the same implementation source.
    claimRefs: [CE001, CE002, CE003]
    tableRefs: [TE001, TE002]
  - id: architecture-and-maturity
    title: Architecture, integrations, and maturity
    body: >-
      The strongest public architecture signal is not a diagram of proprietary internals but the
      consistency of the operating model across sources: a shared multidimensional model, driver-based
      calculations, scenarios, workflows, integrations, and governed access. Public third-party
      descriptions attribute elastic scaling to Pigment's Graphite engine and describe connectors to
      Salesforce, SAP, NetSuite, Sage Intacct, Databricks, and BigQuery, while Pigment's own sales
      planning page describes native connectors, APIs, and scheduled imports. The MCP specification
      confirms that an MCP integration is a protocol bridge between hosts, clients, and servers with
      explicit capability negotiation; that establishes the dependency's mechanism, not proof that
      Pigment's implementation is production-complete. A technical review characterizes Pigment as
      stronger in collaborative planning and forecasting than in publicly inspectable optimization.
    claimRefs: [CE004, CE005, CE006, CE007]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: differentiation-and-controls
    title: Differentiation, trust, and implementation risk
    body: >-
      Pigment's differentiation is the combination of cross-functional model reuse, scenario
      iteration, and an AI layer that operates inside governed planning data rather than beside it.
      The sales-planning page says the Modeler Agent can build or extend quota, capacity, and forecast
      models from plain-language requests with an approval plan first, while the Analyst Agent handles
      variance and trend analysis. The MCP protocol's own security guidance is a useful control
      benchmark: user consent, access controls, explicit tool authorization, and protection against
      untrusted tool descriptions are expected implementation responsibilities. Pigment's public
      product material does not disclose enough quantitative benchmark data to validate autonomous
      planning quality, model accuracy, or end-to-end security posture; these are diligence items
      rather than assumptions.
    claimRefs: [CE008, CE009, CE010, CE011]
  - id: product-verdict
    title: Product verdict and diligence priorities
    body: >-
      The evidence supports a product with a coherent planning substrate and a broad enterprise
      operating model, not merely a dashboard layer. G2 reviewer comparisons place Pigment among
      established planning alternatives, while independent and partner descriptions consistently
      emphasize shared models, scenario analysis, and cross-functional planning. The counterweight is
      implementation and proof risk: pricing is sales-led, integration breadth varies by source, the
      learning curve can be meaningful, and public material does not establish the reliability of
      agent-generated logic or the performance of the Graphite engine under a buyer's workload. An
      investment-grade technical review should therefore require a sandbox using representative data,
      an integration inventory, agent audit logs, permission tests, service-level commitments, and
      references for production deployments rather than treating roadmap language as delivered
      maturity.
    claimRefs: [CE012, CE013, CE014, CE015]
    figureRefs: []
