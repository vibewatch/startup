    claimRefs: [CE004, CE008, CE009, CE011, CE015]
callouts:
  - calloutType: strength
    title: Coherent product center
    body: >-
      Pigment's strongest evidence is architectural coherence: the same governed model supports
      finance, sales, workforce, supply-chain, scenarios, and AI assistance rather than presenting
      unrelated modules.
    claimRefs: [CE001, CE004, CE012]
  - calloutType: risk
    title: Agentic claims need production proof
    body: Public sources describe Modeler, Analyst, and MCP capabilities, but they do not provide sufficient independent evidence on agent accuracy, failure rates, permission boundaries, or autonomous planning outcomes.
    claimRefs: [CE008, CE009, CE010, CE015]
  - calloutType: recommendation
    title: Make the technical evaluation workload-specific
    body: Require a representative-data sandbox, integration and permission tests, agent approval logs, and production references before underwriting technical maturity or implementation speed.
    claimRefs: [CE013, CE014, CE015]
