  evidenceGaps:
    - type: missing-source
      severity: material
      topic: technical-maturity
      missingEvidence: Independent workload benchmarks for Graphite model size, concurrency, recalculation latency, and forecast or agent accuracy.
      whyItMatters: Enterprise planning buyers need to know whether advertised scale and AI assistance remain reliable under their own dimensionality, refresh cadence, and user concurrency.
      diligencePath: Run a representative-data proof of concept with measured latency, forecast error, agent acceptance rate, and failure recovery.
      relatedQuestionRefs: [QE007, QE008]
    - type: private-evidence-only
      severity: material
      topic: security
      missingEvidence: Customer-specific evidence of MCP permission enforcement, consent flows, data residency, prompt handling, and audit logs.
      whyItMatters: External AI access creates a data-exposure and tool-execution boundary that public protocol guidance cannot prove Pigment implements correctly.
      diligencePath: Review security architecture, subprocessors, audit events, access-control tests, and a red-team or penetration-test summary under NDA.
      relatedQuestionRefs: [QE006, QE007]
    - type: missing-source
      severity: minor
      topic: integrations
      missingEvidence: Complete, current connector inventory with sync modes, rate limits, ownership, and failure/retry behavior.
      whyItMatters: Planning quality depends on timely and complete source-system refreshes, while marketing pages do not specify operational limits.
      diligencePath: Obtain the connector matrix and test the buyer's ERP, CRM, HRIS, warehouse, and export requirements during implementation scoping.
      relatedQuestionRefs: [QE003, QE004]
    - type: access-blocked
      severity: minor
      topic: reliability
      missingEvidence: Public service-level, outage, recovery, and support evidence for the production environment.
      whyItMatters: A planning system becomes operationally critical when finance, sales, and workforce decisions depend on one live model.
      diligencePath: Request SLA, status-history, RTO/RPO, incident process, escalation path, and customer references for comparable deployments.
      relatedQuestionRefs: [QE004, QE008]
