          note: "No public list price or free plan"
        - id: services
          label: "Implementation and managed services"
          note: "Partner-led delivery and optimization are described"
        - id: arr
          label: "$100M+ ARR claimed in 2026"
          note: "Company-issued claim; definition and audit support unavailable"
        - id: gross-profit
          label: "Gross profit and cash generation"
          note: "Unavailable from assigned public evidence"
      edges:
        - [activity, adoption]
        - [adoption, license]
        - [adoption, services]
        - [license, arr]
        - [services, gross-profit]
        - [arr, gross-profit]
    claimRefs: [CI001, CI005, CI010, CI016]
callouts:
  - calloutType: strength
    title: Disclosed commercial scale
    body: "The October 2026 announcement claims ARR above $100M and a $250M Series E, indicating meaningful reported scale even though the figures are not independently audited."
    claimRefs: [CI010, CI011]
  - calloutType: risk
    title: Underwriting data gap
    body: "No assigned source discloses cash, burn, runway, gross margin, NRR, CAC payback or customer concentration, so capital adequacy and valuation cannot be tested rigorously."
    claimRefs: [CI012, CI016]
  - calloutType: recommendation
    title: Data-room gate
    body: "Require audited revenue and ARR reconciliation, cohort retention, realized pricing, services mix, cash and debt schedules before treating the reported valuation as investable."
    claimRefs: [CI003, CI008, CI016]
