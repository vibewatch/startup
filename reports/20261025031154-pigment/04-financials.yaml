company:
  name: Pigment
chapter:
  number: 4
  title: Financials
  summary: Pigment presents as a sales-led enterprise planning platform with improving commercial scale, but most financial inputs remain company-disclosed rather than independently audited. The October 2026 company announcement claims $100M+ ARR and a $2.3B valuation, while pricing, margin, burn, cash and retention remain unavailable for underwriting.
sections:
  - id: revenue-model
    title: Revenue model and monetization
    body: >-
      Pigment monetizes a cloud enterprise planning platform through a sales-led,
      custom-quote motion rather than self-serve subscriptions. Independent
      practitioner coverage describes pricing as dependent on user types, modules,
      contract term and implementation support, while a separate review says there
      is no free plan and no published price list. The product surface spans FP&A,
      sales, workforce and supply-chain planning, so revenue quality depends on
      adoption across governed models rather than on a single narrow SKU. Official
      partner descriptions say the platform connects P&L, balance sheet and cash
      flow forecasts, but those are product capabilities, not evidence of Pigment's
      own reported revenue mix. The October 2026 financing announcement claims
      $100M+ ARR, but it is a company-issued release and does not disclose
      recognition policy, gross retention, NRR, customer concentration or audited
      revenue. List price, realized price, discounting and contract duration must
      therefore remain diligence asks rather than estimated inputs.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001, TI002]
  - id: commercial-efficiency
    title: Commercial efficiency and delivery cost
    body: >-
      The public record supports a recurring enterprise-software delivery model,
      but not a complete unit-economics model. Pigment's implementation ecosystem
      emphasizes discovery, data mapping, configuration, testing, training and
      controlled go-live; RSM similarly frames advisory, implementation,
      optimization and managed services as part of the lifecycle. This implies
      meaningful implementation and customer-success work alongside recurring
      license revenue, with partner capacity and customer data readiness affecting
      time to value. A practitioner review gives directional implementation fees of
      approximately 0.3–1.0x annual license, but that is an external buying
      heuristic, not Pigment guidance or a verified company-wide average. Public
      evidence does not establish CAC, payback, sales-cycle length, gross margin,
      services margin, expansion rate or support cost. The financially conservative
      conclusion is that Pigment may have attractive software gross-margin
      characteristics, but the mix of subscription, implementation and managed
      services is not disclosed sufficiently to model it.
    claimRefs: [CI005, CI006, CI007, CI008]
    tableRefs: [TI003]
  - id: traction-capital
    title: Traction, capital adequacy and financing dependency
    body: >-
      Pigment has substantial disclosed venture backing, but financing raised is
      not the same as cash available. Its 2023 company announcement described an
      $88M Series C and $248M cumulative funding at that time. A current October
      2026 announcement claims a $250M Series E at a $2.3B valuation and says ARR
      exceeded $100M earlier in the year, with ARR doubling year over year. These
      figures are company claims carried by a syndicated release and should not be
      treated as independently audited. A separate independent profile records
      approximately $396.9M raised across five rounds through 2026, but its round
      chronology conflicts with the current company announcement's Series E framing
      and is not a substitute for a cap table. No assigned source provides cash on
      hand, quarterly burn, runway, debt obligations, covenant headroom or the
      next-round trigger. Capital adequacy is consequently unproven even though
      disclosed fundraising is large relative to the reported ARR.
    claimRefs: [CI009, CI010, CI011, CI012]
    tableRefs: []
  - id: underwriting-verdict
    title: Financial underwriting verdict
    body: >-
      The financial case is promising but not underwritable on public evidence
      alone. The reported ARR scale and enterprise adoption narrative support a
      credible recurring-revenue hypothesis, while custom pricing and broad
      planning scope could support expansion across finance and operating teams.
      However, the $2.3B valuation is a company-stated financing valuation, not a
      public-market mark, and no assigned source supplies the denominator needed
      to test an ARR multiple against retention, growth quality or gross margin.
      The independent Lokad review is a useful adverse check: it characterizes
      Pigment as a collaborative planning and forecasting platform rather than a
      specialized optimization engine, and says public evidence does not justify
      treating it as a native operational optimization system. That limitation
      may constrain monetization in highly specialized workflows. The investment
      posture should remain research-more until a data room supplies audited
      revenue, ARR bridge, gross margin, cohort retention, customer concentration,
      cash and burn, debt terms, and realized pricing by segment.
    claimRefs: [CI013, CI014, CI015, CI016]
    figureRefs: [FI001]
tables:
  - id: TI001
    title: Revenue streams and evidence quality
    columns: [Stream, Mechanism, Current value/status, Quality, Diligence ask]
    rows:
      - [Core planning subscription, "Sales-led cloud platform with custom deployment pricing", "ARR >$100M claimed for 2026; no audited revenue disclosed", "Company-claimed; syndicated release", "Audited revenue recognition and ARR bridge"]
      - [Implementation and services, "Partner/vendor discovery, configuration, integration, training and go-live", "Implementation support is described; realized mix unavailable", "Third-party delivery descriptions", "Subscription versus services revenue split and services gross margin"]
      - [Expansion modules, "FP&A, sales, workforce and supply-chain planning use cases", "Product scope is public; module attach and expansion rates unavailable", "Product and partner descriptions", "Cohort expansion, NRR and module-level pricing"]
      - [Customer success / managed services, "Optimization and ongoing application support", "Lifecycle support is offered by implementation partners; Pigment economics unavailable", "Partner-described", "Support cost, renewal terms and attach rate"]
    notes: "Sources combine company claims with partner and independent descriptions; null-like unavailable values mean no assigned source disclosed the metric."
    claimRefs: [CI001, CI005, CI006, CI013]
  - id: TI002
    title: Pricing and monetization evidence
    columns: [Pricing dimension, Public evidence, List versus realized, Underwriting implication, Required evidence]
    rows:
      - [License price, "Custom quote; no free plan or self-serve signup", "List price unavailable", "Sales cycle and negotiation are required", "Quote by user type, module and term"]
      - [User mix, "Power users, contributors and viewers are described as pricing levers", "Realized discounting unavailable", "Access policy can change adoption and cost", "Seat counts, role mix and discount schedule"]
      - [Implementation, "External review cites approximately 0.3–1.0x annual license as directional", "Not a Pigment-published realized rate", "First-year cash need can exceed license expense", "Signed SOWs and partner fee schedule"]
      - [Contract structure, "Contract length and modules affect quoted cost", "Renewal and uplift terms unavailable", "Retention and expansion economics cannot be modeled", "Term, renewal, uplift and termination clauses"]
    notes: "Pricing rows are directional evidence, not a quote; external implementation ranges are not verified company averages."
    claimRefs: [CI002, CI003, CI007, CI008]
  - id: TI003
    title: Unit-economics and capital-adequacy availability
    columns: [Metric, Value, Confidence, Why it matters, Diligence ask]
    rows:
      - [ARR, "$100M+ claimed earlier in 2026", "Medium; company-issued", "Anchor for recurring-revenue scale", "ARR definition, bridge and audit support"]
      - [Revenue growth, "ARR reportedly doubled year over year", "Medium; company-issued", "Tests growth durability", "Prior-period ARR and cohort decomposition"]
      - [Gross margin, null, "Unavailable", "Separates software economics from delivery burden", "GAAP gross margin and services allocation"]
      - [NRR / gross retention, null, "Unavailable", "Tests expansion and churn quality", "Cohort retention by segment and module"]
      - [CAC / payback, null, "Unavailable", "Tests sales efficiency and capital needs", "Fully loaded S&M, bookings and cohort payback"]
      - [Cash and burn, null, "Unavailable", "Determines runway and financing dependency", "Latest balance sheet, monthly burn and runway"]
      - [Debt / obligations, null, "Unavailable", "Identifies downside claims and covenants", "Debt schedule, leases and covenants"]
    notes: "Null values indicate no assigned source disclosed the metric; reported ARR and growth remain company claims rather than audited figures."
    claimRefs: [CI004, CI010, CI011, CI012, CI016]
