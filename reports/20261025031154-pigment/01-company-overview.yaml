callouts:
  - calloutType: strength
    title: Late-stage financing remains available
    body: >-
      The announced Series E increased Pigment's stated valuation to $2.3 billion and added a new
      lead investor, giving the company substantial new funding for expansion if the round closed
      on the disclosed terms.
    claimRefs: [CO004, CO005]
  - calloutType: risk
    title: Public scale evidence is not diligence-grade
    body: >-
      ARR is company reported, customer count is absent, headcount conflicts, and funding raised is
      not cash available. Valuation work should wait for audited operating metrics and cap-table evidence.
    claimRefs: [CO006, CO007, CO015, CO016]
