artifact: company-overview
slug: pigment
runDate: 2026-10-25
company:
  name: Pigment
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Pigment is a Paris-founded, founder-led enterprise planning software company that announced
    a $250 million Series E at a $2.3 billion valuation on October 21, 2026. The company says ARR
    exceeded $100 million earlier in 2026, but current customer count, audited financials, cash
    availability, governance detail, and even current headcount remain unavailable or conflicting.
sections:
  - id: identity-and-product
    title: Identity and product scope
    body: >-
      Pigment was founded in Paris in 2019 by Eléonore Crespo and Romain Niccoli, and the latest
      company-issued financing release still presents both founders as the company's leaders.
      The product is a cloud business-planning and performance-management platform: RSM describes
      one environment spanning financial planning, sales, operations, consolidation, and close,
      while 3PEAKS characterizes it as cloud-only integrated planning. The commercial model is
      enterprise SaaS sold through a demo-led, custom-pricing process rather than a public
      self-service plan. Pigment's current positioning has broadened from spreadsheet replacement
      into agent-assisted planning, but partner and competitor assessments indicate that the core
      remains governed planning and modeling rather than a specialist optimization or statutory
      consolidation engine.
    claimRefs: [CO001, CO002, CO003, CO013, CO014]
    tableRefs: [TO001]
  - id: capital-and-scale
    title: Capital position and operating scale
    body: >-
      On October 21, 2026, Pigment announced a $250 million Series E at a $2.3 billion valuation,
      led by the Scaleup Europe Fund managed by EQT. Adding that round to NeuronFeed's $396.9
      million total through the April 2024 Series D implies approximately $646.9 million of
      publicly announced funding; this is a funding-flow estimate, not cash on hand or available
      runway. Pigment also said ARR had surpassed $100 million earlier in 2026 and had again
      doubled year over year, a company-reported metric that SiliconANGLE separately repeated in
      September. No audited revenue, gross margin, NRR, burn, debt, secondary-sale, or cash-balance
      evidence is available in the assigned source pool. Headcount is also unresolved because two
      current profiles report materially different figures.
    claimRefs: [CO004, CO005, CO006, CO007, CO015, CO016]
    tableRefs: [TO003]
  - id: leadership-and-governance
    title: Leadership, governance, and key-person exposure
    body: >-
      Public evidence supports continued founder leadership but not a complete governance map.
      Crespo brings prior Google and Index Ventures experience; Niccoli previously co-founded and
      served as CTO of Criteo. Ben Previeux is identified by SiliconANGLE as head of product and AI
      strategy, supplying visible functional leadership behind the 2026 agent releases. The
      founders remain central to product narrative, financing communications, and strategic
      positioning, creating identifiable key-person dependence. The assigned evidence does not
      disclose board composition, voting control, founder ownership, executive succession,
      departures, or a complete current executive roster. Those omissions prevent an assessment
      of investor control or whether management depth has kept pace with late-stage scale.
    claimRefs: [CO002, CO009]
    tableRefs: [TO002]
  - id: milestones-and-current-trajectory
    title: Milestones and current trajectory
    body: >-
      Pigment progressed from a 2019 founding through five reported rounds by April 2024, then
      shifted its 2026 narrative toward agent-assisted application creation. SiliconANGLE reported
      the Modeler Agent's March introduction and the September launch of Frames, an interface
      builder linked to governed planning models. The October Series E then more than doubled the
      last reported valuation from about $1 billion to $2.3 billion. This trajectory shows capital
      access and product-release velocity, but the newest scale claims remain company issued.
      The assigned pool contains critical product reviews, yet no regulator, court, incident, or
      outage record; that absence cannot be treated as evidence that no adverse event occurred.
    claimRefs: [CO004, CO008, CO009, CO010, CO011, CO012, CO013, CO014]
    figureRefs: [FO001]
