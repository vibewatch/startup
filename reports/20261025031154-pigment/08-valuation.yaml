    title: Recommendation logic
    type: flow
    summary: Current financing supports a serious scale signal, but missing underwriting inputs keep the recommendation at research-more.
    data:
      nodes:
        - id: scale
          label: Scale signal
          detail: "$250M Series E at $2.3B valuation; company-reported ARR above $100M"
        - id: product
          label: Product proof
          detail: "Connected planning and agentic AI claims across enterprise workflows"
        - id: disclosure
          label: Disclosure gap
          detail: "Audited margin, NRR, cash, concentration, and terms are not in the assigned public set"
        - id: downside
          label: Downside checks
          detail: "Custom pricing, implementation burden, agentic proof gap, and multiple compression"
        - id: decision
          label: Decision
          detail: "Research-more pending data-room verification"
        - id: monitor
          label: Monitoring
          detail: "Reassess after audited KPI and financing-term diligence"
    edges:
      - [scale, product]
      - [product, disclosure]
      - [disclosure, downside]
      - [downside, decision]
      - [decision, monitor]
    claimRefs: [CV011, CV012, CV013, CV014]
callouts:
  - calloutType: recommendation
    title: Research-more, not buy
    body: The round validates investor demand and a large headline valuation, but the public evidence does not yet establish the cash generation, retention, margin, dilution, or preference profile needed to support a buy at $2.3 billion.
    claimRefs: [CV001, CV003, CV011, CV012]
  - calloutType: risk
    title: Principal valuation risk
    body: A headline valuation can remain unsupported if ARR quality, customer concentration, implementation economics, or financing preferences differ materially from the public narrative.
    claimRefs: [CV006, CV008, CV012, CV013]
