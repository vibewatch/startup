chapter:
  number: 8
  title: Valuation
  summary: Pigment's October 2026 financing establishes a $2.3 billion valuation and a company-reported ARR milestone above $100 million, but public evidence still leaves key underwriting inputs undisclosed. The appropriate stance is research-more and price-sensitive until audited retention, margin, cash, and deal terms are verified.
sections:
  - id: valuation-context
    title: Financing context and entry discipline
    body: >-
      Pigment's latest financing is the strongest current price signal in the assigned evidence. The company announced a $250 million Series E at a $2.3 billion valuation, led by EQT's Scaleup Europe Fund; The SaaS News and Yahoo Finance repeat the company-issued release rather than provide independent price discovery. Yahoo's copy records Pigment's statement that ARR surpassed $100 million earlier in 2026. Those are meaningful scale signals, but the announcement does not disclose preferred-security terms, liquidation preferences, any secondary component, ownership dilution, or cash balance. A $2.3 billion headline valuation therefore sets an entry reference, not proved common-equity value. Dividing that value by ARR above $100 million produces a headline multiple below 23x, not a precise 23x observation. The exact multiple remains unavailable because ARR is disclosed only as a floor and the retained text does not define whether the valuation is post-money or fully diluted.
    claimRefs: [CV001, CV002, CV003, CV011]
    tableRefs: [TV001]
  - id: thesis-antithesis
    title: Investment thesis and anti-thesis
    body: >-
      The positive case is a category-scale enterprise planning platform with fresh capital, visible adoption claims, and a product narrative that extends from connected planning into autonomous workflows. The official announcement says Graphite can support thousands of agents and people on governed models and scale to hundreds of billions of data points, while 85% of new metrics are reportedly created by an Agent. The counter-case is that the public record is weighted toward issuer claims and implementation-oriented commentary. Makerstack describes custom, sales-led pricing with no free plan and flags a learning curve, slower calculations on complex models, and fewer native integrations; 3PEAKS says statutory consolidation usually requires a dedicated tool. Competitor Lokad separately argues that Pigment's agentic and optimization claims are more ambitious than its publicly inspectable quantitative core. These limitations can lengthen sales cycles, raise services burden, or leave the premium dependent on unverified execution.
    claimRefs: [CV004, CV006, CV008, CV009, CV010, CV014]
    tableRefs: [TV002]
  - id: scenarios-and-diligence
    title: Scenarios, comparables, and diligence gates
    body: >-
      A scenario framework is more defensible than a single target price because the retained evidence does not provide audited gross margin, net retention, cash burn, or a verified customer concentration profile. The bull case requires repeatable ARR growth, durable paid AI adoption, and efficient use of the new capital; only then could the $2.3 billion mark become supportable. The base case assumes enterprise demand persists but custom pricing, implementation work, and disclosure constraints continue, supporting a watch posture and entry below the disclosed mark rather than a buy. The bear case combines multiple compression with slower conversion, services-heavy deployments, or another financing before durable cash generation, implying a down-round risk with no defensible public floor. G2 identifies product alternatives but provides no valuation multiples. SEC results confirm that OneStream primary filings exist, yet the retained search page is only a starting point for a dated public-company comparison. Exit readiness is likewise unproven in this pool. The next decision should be gated on financing documents, audited KPIs, and a dated comparable set.
    claimRefs: [CV005, CV007, CV012, CV013, CV015]
    tableRefs: [TV003]
    figureRefs: [FV001]
tables:
  - id: TV001
    title: Recommendation summary
    columns: [Dimension, Current evidence, Investment implication]
    rows:
      - [Recommendation, research-more, Do not underwrite a buy from the headline round alone]
      - [Confidence, medium, Financing and ARR signals are current but issuer-led]
      - [Risk rating, high valuation and disclosure risk, Operating risk cannot be fully rated from public evidence]
      - [Valuation stance, indeterminate and price-sensitive, Headline value is below 23x the disclosed ARR floor but lacks quality adjustments]
      - [Entry discipline, below the $2.3B headline unless diligence closes the gaps, No target return or hold period is supportable publicly]
    notes: >-
      Current financing and ARR figures come from the October 2026 company-issued announcement; the below-23x bound is directional and not a market-clearing comparable.
    claimRefs: [CV001, CV003, CV011, CV012]
  - id: TV002
    title: Thesis / anti-thesis table
    columns: [Argument, Supporting evidence, What would change the view]
    rows:
      - [Fresh capital and scale, Series E at $2.3B with $250M raised, Audited ARR quality and cash runway]
      - [AI-led product upside, 85% of new metrics reportedly created by an Agent, Cohort retention and paid-agent usage]
      - [Enterprise planning breadth, Finance sales workforce and supply-chain use cases are described, Net expansion and implementation margin]
      - [Commercial friction, Custom pricing and no free plan plus implementation caveats, Standardized pricing and faster deployments]
      - [Consolidation boundary, Partner source says statutory consolidation is usually paired with a dedicated tool, Evidence of attach rate and total cost]
      - [Agentic proof gap, Competitor review says autonomy claims exceed inspectable quantitative proof, Production accuracy and paid workflow adoption]
    notes: >-
      Rows combine company claims with independent, competitor, and partner commentary; they are directional underwriting arguments, not independently audited KPIs.
    claimRefs: [CV003, CV004, CV006, CV008, CV009, CV010, CV014]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Assumptions, Valuation / return logic, Key risks, Probability signal]
    rows:
      - [Bull, ARR growth remains strong and AI agents deepen enterprise expansion, At or above $2.3B only if verified ARR quality lowers the forward multiple, Execution and adoption proof are insufficient, Conditional and not yet evidenced]
      - [Base, Enterprise demand persists but pricing remains bespoke and services remain relevant, Below $2.3B with an unquantified diligence discount, Disclosure and implementation economics, Most supported by the retained evidence]
      - [Bear, Growth slows or capital markets compress software multiples, Below $2.3B with down-round risk and no defensible public floor, Cash burn and customer concentration, Material if growth or financing terms disappoint]
      - ["Diligence gate", "Financing terms and audited KPI package are obtained", "Re-rate only after reconciling ARR, margin, NRR, cash and dilution", "Data-room access and preference overhang", "Required before a buy call"]
    notes: >-
      Scenarios are qualitative because public sources do not supply a complete forecast, comparable valuation set, financing terms, or audited operating KPI package; no probability-weighted price is asserted.
    claimRefs: [CV001, CV003, CV005, CV011, CV012, CV013, CV015]
figures:
