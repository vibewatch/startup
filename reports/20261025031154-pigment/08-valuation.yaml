  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: financing-terms
      missingEvidence: Preferred-security terms, liquidation preferences, ownership dilution, secondary proceeds, and post-money definition for the Series E.
      whyItMatters: The headline valuation may not represent common-equity value or the cash actually available to fund operations.
      diligencePath: Obtain the signed term sheet, cap table, shareholder-rights summary, and a cash reconciliation from management.
      relatedQuestionRefs: [QV003]
    - type: missing-source
      severity: material
      topic: operating-metrics
      missingEvidence: Audited ARR bridge, gross margin, NRR, customer concentration, CAC payback, burn, and runway.
      whyItMatters: These metrics determine whether the below-23x headline ARR bound is economically supportable and whether another financing is needed.
      diligencePath: Request the latest monthly KPI pack, cohort tables, management accounts, bank statements, and forecast model under NDA.
      relatedQuestionRefs: [QV008]
    - type: missing-source
      severity: material
      topic: comparable-valuations
      missingEvidence: Current private-market marks, public software trading set, and relevant M&A transactions with consistent ARR and growth definitions.
      whyItMatters: Product-alternative lists do not establish valuation comparability or a market-clearing multiple.
      diligencePath: Build a dated comparable set using audited or issuer-reconciled revenue, growth, margin, and enterprise-value data.
      relatedQuestionRefs: [QV005, QV007]
