schemaVersion: "report-v2"
artifact: competitors
slug: pigment
runDate: 2026-10-25
company:
  name: Pigment
chapter:
  number: 3
  title: Competitors
  summary: >-
    Pigment competes against broad EPM incumbents, modern connected-planning platforms,
    Excel-native products, lighter FP&A tools, and spreadsheets or internal builds.
    Its current wedge is a governed, cross-functional modeling layer with embedded AI,
    but independent reviews show that configurability, implementation effort, trust in
    complex calculations, opaque pricing, and incumbent distribution can weaken that edge.
sections:
  - id: landscape
    title: Competitive landscape and buyer choice
    body: >-
      The buyer is not choosing among like-for-like products. G2's reviewed alternatives
      include Anaplan, Workday Adaptive Planning, Planful, Causal, Mosaic Tech, Board, Vena,
      Abacum, SAP Analytics Cloud, and Workiva, while MarketsandMarkets' 2022 EPM roster
      also includes large-suite incumbents such as Oracle, SAP, IBM, and Infor. OneStream's
      filing independently demonstrates the scale attainable by a specialist platform,
      reporting 1,423 customers as of March 31, 2024. Spreadsheets and internal builds
      remain status-quo substitutes because they preserve familiar workflows and avoid
      an immediate platform migration. Pigment's claim that 56% of its 2025 new customers
      migrated from legacy vendors is therefore evidence of displacement activity, not
      proof of category leadership or market share.
    claimRefs: [CP001, CP002, CP004, CP009]
    tableRefs: [TP001]
    figureRefs: [FP001]
  - id: capability
    title: Capability and packaging trade-offs
    body: >-
      Pigment's differentiation centers on shared business context, governed models, and
      AI embedded inside planning workflows. Its current materials describe Modeler,
      Analyst, and configurable agents spanning model creation, conversational analysis,
      recurring reports, permissions, and auditability. Anaplan now advertises deterministic
      calculations, probabilistic AI, connected data, workflows, and role-based agents,
      while Vena emphasizes Microsoft-native FP&A, Excel continuity, and AI inside familiar
      tools. Feature presence alone is consequently a weak moat test. Gartner reviewers
      praise Pigment's integrations and flexibility, but one critical review reports
      consultant dependence for minor changes, low non-finance adoption, and unexplained
      discrepancies in complex calculations. Buyers must test accuracy, model maintenance,
      role-specific adoption, and governed write-back rather than compare marketing labels.
    claimRefs: [CP005, CP006, CP013, CP014, CP015]
    tableRefs: [TP002]
  - id: distribution-and-switching
    title: Distribution, implementation, and switching costs
    body: >-
      Distribution can outweigh interface quality in enterprise planning. OneStream
      reported a direct sales motion plus more than 250 go-to-market, implementation, and
      development partners, including major global systems integrators. Vena can reduce
      behavioral switching by retaining Excel, while large-suite vendors can bundle
      planning into established finance or ERP relationships. Pigment can counter with
      faster model evolution and a modern cross-functional experience, but its public
      pricing remains sales-led and custom. OneStream's filing also shows why contract and
      services structure matter: its access revenue used SaaS and license models, most
      SaaS and term-license contracts had three-year terms, and professional services were
      distinct. Without comparable proposals, implementation statements of work, and
      renewal data, Pigment's claimed speed advantage cannot be translated into normalized
      total cost or verified lock-in.
    claimRefs: [CP007, CP010, CP011, CP014]
    tableRefs: [TP003]
  - id: moat-and-displacement
    title: Moat durability and displacement risk
    body: >-
      Pigment's strongest potential moat is the accumulated business logic, permissions,
      integrations, and operating routines embedded in a shared planning model. That is
      workflow lock-in, not a network effect, and it becomes durable only when customers
      expand use cases and renew economically. Lokad, itself an adjacent competitor rather
      than an independent benchmark, judges Pigment to be a credible EPM platform but not
      a supply-chain-native optimization engine and argues that public proof lags the
      newest agentic claims. OneStream's filing likewise describes intense competition
      from both legacy suites and point products. Pigment is therefore exposed on both
      sides: incumbents can copy agent features and use distribution, while lighter tools
      and spreadsheets can win when teams reject implementation complexity. Durable
      differentiation requires evidence of retention, expansion, lower services intensity,
      and better decision outcomes under comparable workloads.
    claimRefs: [CP003, CP008, CP012, CP016]
