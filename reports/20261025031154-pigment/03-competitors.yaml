      - ["Anaplan", "Connected-planning incumbent", "G2 describes finance, marketing, sales, supply-chain, and workforce scope", "Large enterprises with complex cross-functional planning", "Broad planning footprint, probabilistic AI, workflows, and role-based agents", "Current pricing, deployment outcomes, and comparative agent accuracy are not established"]
      - ["OneStream", "CFO platform and EPM specialist", "1,423 customers as of March 31, 2024; filing also reported a large partner ecosystem", "Mid-market, enterprise, and government finance organizations", "Close, consolidation, planning, reporting, application exchange, and partner distribution", "Scale data are historical and OneStream-issued; no like-for-like Pigment benchmark is public"]
      - ["Workday Adaptive Planning", "Enterprise planning incumbent", "G2 includes it among leading reviewed Pigment alternatives", "Workday-oriented and broader enterprise-planning buyers", "Enterprise planning and ecosystem adjacency", "Assigned evidence does not establish current contract terms or agent depth"]
      - ["Vena", "Microsoft-native FP&A", "Vendor says thousands of organizations use the platform", "Finance teams seeking to retain Excel and Microsoft 365 workflows", "Excel continuity, Microsoft distribution, and purpose-built AI", "Outcome metrics are vendor-issued and not normalized against Pigment"]
      - ["Planful and Board", "Finance-led FP&A and CPM alternatives", "Both appear in independent or analyst competitive rosters", "Finance teams emphasizing structured planning, reporting, or CPM", "Established category presence and finance workflows", "Current product depth, pricing, and switching evidence are incomplete"]
      - ["Spreadsheets or internal build", "Status quo substitute", "No externally verified scale denominator is applicable", "Smaller teams or organizations with bespoke low-complexity processes", "Familiarity, local control, and no immediate platform procurement", "Reconciliation, governance, maintainability, and key-person risk require buyer-specific measurement"]
    notes: "This is a representative, not exhaustive, landscape. Scale dates and issuers differ; unavailable funding, pricing, or outcome fields are stated as gaps rather than estimated."
    claimRefs: [CP001, CP002, CP004, CP009, CP010, CP013, CP014]
  - id: TP002
    title: Capability and evidence matrix
    columns: [Buying criterion, Pigment, Anaplan, OneStream, Vena, Evidence qualification]
    rows:
      - ["Cross-functional planning", "Supported across finance, sales, HR, and supply chain", "Broad connected-planning scope reported", "Financial plus operational planning applications reported", "FP&A and connected operational data reported", "Scope is source-reported; comparable depth is untested"]
      - ["AI-assisted model creation", "Modeler Agent explicitly described", "Role-based agents described, exact model-building behavior unknown", "AI and machine learning described, model-building behavior unknown", "Purpose-built agents described, model-building behavior unknown", "Unknown means the assigned evidence did not establish equivalence"]
      - ["AI-assisted analysis", "Analyst Agent, code execution, recurring missions, and explanations described", "Probabilistic AI and agents described at a high level", "Applied AI and machine learning described", "AI insights in Teams and Excel Live described", "Vendor-issued capability evidence; accuracy is not independently benchmarked"]
      - ["Spreadsheet continuity", "Not positioned as Excel-native", "Unknown in assigned evidence", "Data-source integration described; Excel continuity not established", "Explicitly Excel-native", "Workflow preference can reverse the apparent product ranking"]
      - ["Close and consolidation", "Not established in assigned sources", "Unknown in assigned evidence", "Core close and consolidation solution disclosed", "Close capability advertised at a high level", "Unsupported cells remain Unknown rather than inferred"]
      - ["Implementation ecosystem", "Partner involvement is implied but not quantified here", "Unknown in assigned evidence", "More than 250 global partners reported", "Demo-led vendor motion; ecosystem scale unknown", "Services intensity and time-to-value need proposal-level evidence"]
    notes: "Supported denotes explicit source language, not verified parity. Unknown denotes an evidence gap, not absence of the capability."
    claimRefs: [CP005, CP006, CP010, CP013, CP014, CP015]
  - id: TP003
    title: Pricing, packaging, and switching comparison
    columns: [Option, Public price or contract evidence, Implementation signal, Distribution or lock-in mechanism, Buyer implication]
    rows:
      - ["Pigment", "Custom sales-led pricing; no free plan or public list price reported by MakerStack", "Training and model-design effort remain material review concerns", "Shared metrics, permissions, integrations, and cross-functional models", "Require a scoped proposal and proof of value; do not infer realized price"]
      - ["OneStream", "SaaS plus term or perpetual licenses; most SaaS and term-license contracts had three-year terms in the 2024 filing", "Distinct professional services and implementation partners", "Direct sales, more than 250 partners, application ecosystem, and multi-use-case expansion", "Commercial structure can create durable switching costs but is not a current Pigment price benchmark"]
      - ["Anaplan", "No public price in the assigned source; G2 reviewers characterize it as more expensive than Pigment", "G2 reviewers characterize it as slower to reach ROI", "Enterprise scope, installed workflows, and incumbent relationships", "Qualitative reviewer comparisons need normalized proposals and matched deployments"]
      - ["Vena", "No public list price in the assigned source", "Excel continuity can reduce user retraining", "Microsoft-native positioning and familiar Excel workflows", "Can win where adoption friction matters more than replacing the modeling paradigm"]
      - ["Spreadsheets or internal build", "No incremental platform price established; internal labor and control costs are unknown", "Low procurement friction but potentially high reconciliation and key-person burden", "Embedded habits, bespoke formulas, and local ownership", "Most credible for simpler planning; quantify hidden labor and control failures before migration"]
    notes: "No comparable realized contract prices, discounts, implementation fees, or renewal economics were available. Qualitative reviewer statements are not independent price benchmarks."
    claimRefs: [CP007, CP010, CP011, CP013, CP014]
figures:
  - id: FP001
    title: Competitive positioning by workflow breadth and change burden
    type: quadrant
    summary: >-
      Pigment combines broad workflow scope with lower claimed model-change burden, while
      incumbents retain scope or distribution and spreadsheets minimize initial change.
    data:
      xAxis:
        label: Cross-functional planning breadth (ordinal)
        min: 1
        max: 5
      yAxis:
        label: Implementation and change burden (ordinal)
        min: 1
        max: 5
      points:
        - label: Pigment
          x: 5
          y: 3
          detail: "Broad cross-functional scope and agent-assisted model changes, offset by reviewer-reported consultant dependence."
        - label: Anaplan
          x: 5
          y: 4
          detail: "Broad connected-planning scope; G2 reviewers characterize slower ROI than Pigment."
        - label: OneStream
          x: 5
          y: 4
          detail: "Broad CFO and operational applications with multi-phase implementation and a large partner ecosystem."
        - label: Workday Adaptive Planning
          x: 4
          y: 4
          detail: "Enterprise-planning breadth is reported, but matched implementation evidence is unavailable."
        - label: Vena
          x: 3
          y: 2
          detail: "Excel-native workflow can reduce behavioral change, with narrower evidenced cross-functional scope."
        - label: Spreadsheets or internal build
          x: 2
          y: 1
          detail: "Minimal initial migration but unquantified reconciliation, governance, and maintenance burden."
    approximationNotes: "Analyst ordinal scores from 1 to 5 synthesize the cited assigned sources. They are not measured benchmarks, market-share estimates, or value-proportional quantities."
    claimRefs: [CP001, CP005, CP006, CP009, CP010, CP013, CP014, CP016]
callouts:
  - calloutType: strength
    title: Evidence-backed wedge
    body: >-
      Pigment combines governed cross-functional models with agents for model creation,
      analysis, reporting, and recurring workflows; that integration is more meaningful
      than adding a generic chat layer.
    claimRefs: [CP015]
  - calloutType: risk
    title: Configuration can become lock-in
    body: >-
      The same flexibility that embeds Pigment in workflows can increase dependence on
      trained modelers or consultants, particularly outside finance or in complex models.
    claimRefs: [CP006, CP016]
  - calloutType: recommendation
    title: Competitive proof required
    body: >-
      Run matched bake-offs and collect comparable proposals, implementation plans, error
      logs, adoption cohorts, and renewals before underwriting lower total cost or durable
      AI differentiation.
    claimRefs: [CP003, CP006, CP007, CP008, CP016]
