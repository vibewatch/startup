schemaVersion: "report-v2"
artifact: market-analysis
slug: pigment
runDate: 2026-10-25
company:
  name: Pigment
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Pigment addresses enterprise performance management and connected planning,
    with an FP&A-led wedge into sales, workforce, and supply-chain workflows.
    The assigned evidence supports a broad EPM category forecast but not a
    Pigment-specific SAM or SOM, making adoption readiness and segment economics
    more decision-useful than adjacent-market headline totals.
sections:
  - id: market-boundary
    title: Market boundary and substitutes
    body: >-
      Pigment's relevant market is enterprise performance management and
      connected business planning, not all finance software or artificial
      intelligence spending. Included workflows are budgeting, forecasting,
      scenario modeling, management reporting, and cross-functional resource
      planning across finance, sales, workforce, and supply chain. General ERP,
      standalone business-intelligence dashboards, statutory
      consolidation-only tools, and broad AI applications sit outside the core
      boundary even when they are adjacent. The practical status quo is
      spreadsheet-based planning and disconnected departmental tools. Software
      alternatives range from enterprise planning suites to lighter FP&A
      products, so Pigment competes for an existing planning budget rather than
      creating an entirely new budget category.
    claimRefs: [CM001, CM002, CM003, CM004, CM010, CM015]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: Sizing lenses and evidence limits
    body: >-
      MarketsandMarkets projected the global enterprise performance management
      market to reach USD 8.3 billion by 2027 at a 7.0% compound annual growth
      rate in a report published in June 2022. That is the closest numeric
      category lens in the assigned pool, but it is broader than Pigment's
      reachable market and is not a current company-specific estimate. The same
      publisher reports much larger AI-in-finance and decision-intelligence
      forecasts; those populations include products and use cases outside
      planning and therefore cannot be added to EPM or presented as Pigment
      TAM. No retained source isolates eligible spend by geography, company
      size, module, or sales reach. Pigment-specific SAM and SOM consequently
      remain unquantified gaps rather than zero values.
    claimRefs: [CM001, CM002, CM012, CM013, CM015]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyers-and-adoption
    title: Buyers, users, and adoption path
    body: >-
      Finance and FP&A are the most natural budget owners, while sales and
      revenue operations, HR, supply-chain teams, and executives participate as
      users or co-sponsors when planning expands across functions. The buying
      case is reduced spreadsheet reconciliation, faster forecast and scenario
      cycles, and a governed model shared across teams. Adoption is not
      self-serve: implementation providers describe discovery, process design,
      data mapping, configuration, testing, training, and controlled go-live.
      The economic buyer therefore must fund both software and organizational
      change. Account-level payer ownership remains a diligence item because
      the assigned sources describe roles and workflows but do not disclose
      Pigment's actual budget-source mix.
    claimRefs: [CM003, CM005, CM006, CM007, CM009, CM016]
    tableRefs: [TM003]
  - id: constraints-and-judgment
    title: Adoption constraints and market judgment
    body: >-
      The strongest adoption constraint is readiness, not category awareness.
      Planning agents depend on trusted source data, stable dimensions,
      governed model logic, permissions, testing, training, and human review.
      Independent review also describes a learning curve, formula complexity,
      occasional performance issues on complex models, fewer native
      integrations than some rivals, and opaque sales-led pricing. Lokad, a
      competitor, argues that Pigment should be viewed first as a broad
      planning platform and only second as a supply-chain-specific vendor; this
      is useful adverse framing but not an independent benchmark. The market
      case is therefore credible but evidence-constrained: valuation should
      depend on segment win rates, deployment cost, retention, and expansion,
      none of which the assigned public evidence quantifies.
    claimRefs: [CM006, CM008, CM009, CM011, CM014, CM016]
