callouts:
  - calloutType: risk
    title: Broad category totals are not reachable market
    body: >-
      The EPM forecast is broader than Pigment's reachable spend, while the
      larger AI-in-finance and decision-intelligence forecasts cover different
      populations. None should be used directly as Pigment TAM, SAM, SOM, or a
      valuation denominator.
    claimRefs: [CM001, CM002, CM012, CM013]
