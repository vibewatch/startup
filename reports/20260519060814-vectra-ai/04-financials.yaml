  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue-mix-gap
    missingEvidence: Channel-level revenue mix, realized pricing, contract duration, and recognized revenue by SKU.
    whyItMatters: These inputs determine revenue quality, pricing power, and how much of bookings should be treated as durable recurring revenue.
    diligencePath: Request quote-to-cash extracts and monthly revenue-recognition schedules by product, channel, and geography.
    relatedQuestionRefs:
    - QI005
    - QI006
    relatedTableRefs:
    - TI001
    - TI002
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency-gap
    missingEvidence: CAC, payback, median sales cycle, quota attainment, and pipeline conversion metrics.
    whyItMatters: Without these numbers, investors cannot judge whether current GTM hiring and channel strategy are efficient or merely expensive.
    diligencePath: Request board or finance dashboards showing CAC, payback, sales productivity, and direct-versus-channel efficiency.
    relatedQuestionRefs:
    - QI011
    - QI023
    relatedTableRefs:
    - TI003
  - type: private-evidence-only
    severity: blocking
    topic: liquidity-gap
    missingEvidence: Current cash, monthly burn, runway, debt schedule, and next-round trigger.
    whyItMatters: Capital adequacy cannot be underwritten from past fundraising alone when current liquidity and obligations are undisclosed.
    diligencePath: Request current cash and debt schedules, a rolling 18-month runway model, and any financing committee materials.
    relatedQuestionRefs:
    - QI019
    - QI020
    - QI021
    relatedTableRefs:
    - TI004
  - type: missing-source
    severity: material
    topic: netography-acquisition
    missingEvidence: Purchase consideration, earn-out terms, retention packages, and integration budget for Netography.
    whyItMatters: The acquisition may have meaningful cash or dilution implications and affects the true capital intensity of the business.
    diligencePath: Request the acquisition approval memo, purchase agreement summary, and post-close integration budget.
    relatedQuestionRefs:
    - QI018
    relatedTableRefs:
    - TI004
  - type: access-blocked
    severity: material
    topic: litigation
    missingEvidence: Readable complaint, docket summary, and current procedural status for Conexus LLC v. Vectra AI Inc.
    whyItMatters: Potential legal exposure or IP restrictions cannot be evaluated from an unreadable filing artifact.
    diligencePath: Pull the docket from PACER or counsel and review claims, requested relief, and current case posture.
