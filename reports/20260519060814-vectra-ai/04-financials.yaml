- id: traction-unit-economics
  title: Public traction signals and unit economics gaps
  body: |-
    Public traction signals are strong enough to show demand, but not strong enough to underwrite efficiency. Official materials say Vectra serves more than 2,000 hybrid and multi-cloud organizations, operates in 113 countries, works with 468 transacting partners, and retains more than 95 percent of customers. The August 2025 Inc. 5000 announcement reinforces the growth narrative, and Blackstone's 2021 release added a historical signal: management said 2020 CAGR exceeded 100 percent while Cognito Detect for Microsoft Office 365 grew more than 700 percent year over year. These are meaningful momentum indicators even if they are not audited operating metrics.

    Customer stories also give directional unit-economics evidence. Globe Telecom reported a 78 percent improvement in incident-response time, 99 percent less noise, and 96 percent fewer escalations, while Luxgen reported a 92.6 percent reduction in alert noise and a 95.3 percent reduction in escalations with a security team of fewer than five. FICO's Fusion deployment shows another economic signal: API-based deployment reduced the need to stand up sensors, taps, and agents across hybrid environments, which implies lower implementation friction and potentially better services margins for both Vectra and partners. The AI Cybersecurity Platform page also cites IDC-backed outcome metrics such as 52 percent more threats identified in 37 percent less time, more than 50 percent faster detect-and-respond cycles, and 40 percent greater SOC efficiency.

    The underwriting problem is that these are still proxies. GetLatka's $120 million 2025 revenue estimate and TipRanks' 675-employee count are useful scale markers, but they are third-party data points rather than company-filed numbers. No retained source discloses CAC, payback, quota productivity, gross margin, MDR staffing burden, cloud-processing cost, or net revenue retention. The right conclusion is therefore qualitative: Vectra appears to have strong enterprise demand and compelling ROI stories, but public evidence stops short of a defensible unit-economics model.
