- id: financial-verdict
  title: Financial verdict and diligence blockers
  body: |-
    Vectra AI's public financial picture is investable as a commercial story but incomplete as an underwriting model. Revenue quality looks better than a single-product point solution because the company appears to combine direct platform subscriptions, MDR overlays, channel resale, and partner-assisted procurement, while customer-retention and ROI stories suggest the product is not being sold purely on commodity price. Even so, realized pricing, revenue mix, gross margin, and cohort behavior remain private.

    The margin path is plausible but unproven. A software-heavy platform should be less capital intensive than a hardware business, yet MDR staffing, partner economics, and continued AI and R&D spend could materially affect contribution margins. Capital intensity also remains uncertain because the Netography acquisition terms are undisclosed and there is no public cash or burn data. The decisive diligence package is straightforward: management-reported ARR or revenue, SKU and channel mix, quote-to-cash extracts, gross-margin bridge, current cash and burn, debt schedule, and a board-level view of the next financing plan. Until those materials are available, the right verdict is positive commercial momentum with unresolved financial opacity.
