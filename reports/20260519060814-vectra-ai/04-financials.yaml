- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact
  - Exact diligence path
  rows:
  - - ARR / GAAP revenue / recognized revenue by SKU
    - Blocks reliable scale underwriting and revenue-quality analysis
    - Request monthly ARR and GAAP revenue bridge, deferred-revenue roll-forward, and SKU-level mix
  - - Realized pricing, discounting, and contract duration
    - Blocks analysis of pricing power and revenue durability
    - Request quote-to-cash exports showing list, net price, discount, term, and renewal uplift by segment
  - - CAC, payback, cycle length, and quota productivity
    - Blocks GTM-efficiency and hiring-plan underwriting
    - Request sales-efficiency dashboard by direct, channel, and MSSP routes
  - - Gross margin, hosting, and MDR delivery cost
    - Blocks margin-path and operating-leverage analysis
    - Request gross-margin bridge, cloud spend, support load, and MDR staffing ratios
  - - Cash balance, burn, and runway
    - Blocks solvency and financing-dependency analysis
    - Request treasury report, burn model, and downside runway case
  - - Debt schedule, customer concentration, and NRR
    - Blocks downside modeling for covenant and retention risk
    - Request lender agreements, top-customer concentration report, GRR/NRR cohorts, and renewal waterfall
  notes: These are the highest-value management requests needed to turn a positive commercial narrative into an underwriteable model.
