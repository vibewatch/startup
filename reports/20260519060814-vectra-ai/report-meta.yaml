companyProfile:
  summary: >-
    Vectra AI is a San Jose-based cybersecurity company founded in 2011 by Hitesh Sheth. It sells an AI-native
    platform spanning network detection and response, identity threat detection and response, cloud-native
    observability, and automated response workflows for large hybrid and multi-cloud enterprises. Public evidence
    shows Vectra reached unicorn status in April 2021 through a Blackstone-led $130 million Series F, reports
    2,000+ customer organizations and 95%+ retention on its official about page, and expanded its platform in 2025
    through the Netography acquisition. The commercial story is credible, but the company remains financially opaque
    relative to the needs of price-sensitive investment underwriting.
  foundedDate: "2011-01-01"
  founders:
    - name: "Hitesh Sheth"
      role: "Founder, President & CEO"
      background: "Former COO of Aruba Networks and former EVP/GM of switching at Juniper Networks."
      claimRefs: [CO001, CO010]
  foundingLocation: "San Jose, CA, USA"
  headquarters: "San Jose, CA, USA"
  productSummary: >-
    SaaS-first detection and response platform covering NDR, ITDR, cloud-native observability, threat signal
    intelligence, and response automation, with MDR and partner-assisted delivery overlays.
  customerFocus: >-
    Large enterprises, critical infrastructure operators, and security teams running hybrid, multi-cloud, identity,
    and network environments that need high-fidelity detection beyond bundled XDR controls.
  businessModel: >-
    Recurring software subscriptions with optional MDR and response services, sold through direct enterprise sales
    plus a broad ecosystem of channel, MSSP, systems-integrator, hyperscaler, and technology partners.
  stage: "late-stage private"
  fundingStatus: >-
    Last confirmed priced round is the April 2021 Blackstone Growth-led $130 million Series F at a $1.2 billion
    post-money valuation; no later official financing round is publicly confirmed.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO004, CO008, CO009, CO020, CO023, CO025, CO029, CO030, CO031]

