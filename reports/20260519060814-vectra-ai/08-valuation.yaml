  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: "current ARR and financial metrics"
      missingEvidence: >-
        Vectra AI does not publicly disclose ARR, gross margin, net dollar retention, EBITDA, burn rate, or a current quarterly growth profile; the only revenue anchor in the source pack is an external GetLatka estimate of roughly $120 million ARR in 2025.
      whyItMatters: >-
        Without company-verified revenue quality metrics, it is impossible to anchor a reliable multiple, assess whether the stale 2021 mark is defensible, or monitor the business against the base case with confidence.
      diligencePath: >-
        Request FY2024 and FY2025 management accounts, quarterly ARR and NDR bridge, gross-margin detail, and any board-level KPI pack used for fundraising or liquidity planning.
      relatedQuestionRefs: [QV003, QV030, QV032]
    - type: private-evidence-only
      severity: material
      topic: "Netography acquisition cost and integration status"
      missingEvidence: >-
        The October 2025 Netography acquisition price, earn-out structure, retention packages, and integration milestones are not disclosed in the public source pack.
      whyItMatters: >-
        The acquisition is central to the cloud-expansion thesis, but without the price and integration plan investors cannot tell whether it was capital-efficient or whether it is likely to add meaningful ARR.
      diligencePath: >-
        Request the acquisition summary memo, integration scorecard, planned Vectra Fusion milestones, and management's cloud attach-rate assumptions.
      relatedQuestionRefs: [QV012]
    - type: missing-source
      severity: material
      topic: "post-2021 capital structure and comparable valuation coverage"
      missingEvidence: >-
        No public evidence in the source pack confirms whether Vectra raised equity, venture debt, or structured secondary capital after April 2021, and integrated-platform benchmarks such as Cisco and CrowdStrike do not provide standalone NDR economics.
      whyItMatters: >-
        Missing capital-stack data can materially change equity outcomes, and the lack of clean platform benchmark data is why the comparable table must stay partial rather than exhaustive.
      diligencePath: >-
        Request the current cap table, any debt summary, investor-rights schedule, and management's own board comparables used for valuation discussions.
      relatedQuestionRefs: [QV002, QV022, QV023]
      relatedTableRefs: [TV004]
    - type: private-evidence-only
      severity: minor
      topic: "Blackstone Growth exit timeline and terms"
      missingEvidence: >-
        Blackstone Growth's specific liquidation preferences, governance rights, and liquidity expectations are not publicly disclosed.
      whyItMatters: >-
        Investor timing pressure can accelerate a positive exit path or force a suboptimal one, and public sources do not show which outcome is more likely.
      diligencePath: >-
        Request an investor-rights summary, board-governance overview, and counsel explanation of any preference waterfall relevant to a sale or IPO.
      relatedQuestionRefs: [QV023]
