      - number: '5.6'
        title: Trust, security, privacy, and quality
        blocks:
          - type: paragraph
            body: >
              Trust and control evidence is mixed: credible enough for serious enterprise evaluation, but not as
              complete as a buyer would want before underwriting mission-critical deployment. On the positive side,
              Vectra says the platform works from metadata and behavioral analytics rather than full packet capture,
              which reduces privacy and storage burden. Official materials also state compliance with GDPR, UK GDPR,
              CCPA, and CPRA, and support guidance says the platform is not impacted by CVE-2026-35386. Multi-SAML SSO
              reaching GA in March 2026 further improves identity-control posture for enterprises with federated
              authentication needs. The public gap is certification and reliability disclosure.


              In the retained source set, Vectra does not publicly disclose SOC 2 Type II or ISO 27001 certification,
              and no public uptime SLA or availability target is provided. Independent review evidence is also not
              uniformly glowing: customer commentary remains broadly positive on detection quality, but some reviews
              mention pricing complexity, integration effort, and operational overhead. For diligence, that means Vectra
              clears the threshold for privacy-awareness and baseline security messaging, yet still needs
              customer-facing proof on audit artifacts, SLA commitments, and implementation burden.
