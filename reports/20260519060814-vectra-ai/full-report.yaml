            body: >
              Vectra's public stories imply a credible land-and-expand motion. Customers can start with core threat
              detection and then layer in Fusion for cloud-native visibility, Recall for broader investigation context,
              or MXDR for managed operations when in-house security staffing is thin. FICO's Fusion deployment and
              Luxgen's MXDR outcome are especially useful because they show expansion beyond a single-module story.
              Goodwood Estate's Gigamon-linked deployment also suggests Vectra can expand inside an existing security
              architecture through partner relationships, which can reduce procurement friction for customers that do
              not want a disruptive rip-and-replace project.


