  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory / legal risk
        blocks:
          - type: paragraph
            body: >-
              Vectra AI's regulatory and legal surface is unusually broad for a private cybersecurity company because
              its products inspect enterprise network, identity, SaaS, and cloud telemetry that can contain personal
              data such as IP addresses, DNS content, HTTP headers, Active Directory information, URLs, and file names.
              Official privacy and product-datasheet materials show that Vectra has built baseline privacy
              infrastructure, including GDPR lawful-basis language, UK GDPR coverage, CCPA/CPRA positioning, a Data
              Processing Agreement, EU Standard Contractual Clauses, and the UK IDTA. That is a real mitigation, not a
              placeholder. The risk is that the same data richness supporting high-fidelity detections also expands
              exposure to transfer, retention, and automated-decision-making scrutiny as NIS2, FTC AI accountability,
              CISA AI-data protection guidance, and the UK ICO's evolving ADM regime harden. Litigation risk is active
              but bounded rather than catastrophic: Stern v. Vectra AI and Conexus LLC v. Vectra AI both appear to have
              closed by March 2026, yet the public evidence reviewed does not disclose underlying complaint detail,
              dismissal grounds, or settlement terms. Residual exposure therefore sits less in known liability and more
              in hidden-tail risk from private legal outcomes and future privacy enforcement.
            claimRefs:
              - CR001
              - CR002
              - CR003
