  - id: TR005
    title: Mitigation and kill criteria table
    columns:
      - Risk
      - Monitorable trigger
      - Threshold / event
      - Existing mitigation
      - Residual exposure
      - Action implication
    rows:
      - - XDR consolidation displacing stand-alone NDR
        - Renewal / displacement evidence in Microsoft or CrowdStrike-led accounts
        - Two or more material reference accounts consolidate away from Vectra for bundled platform reasons
        - Differentiation on alert fidelity and regulated-use-case relevance
        - Still the top structural market risk
        - Re-cut revenue assumptions and require win/loss data
      - - Privacy / transfer enforcement
        - Regulator inquiry, customer DPA exceptions, or transfer-mechanism change
        - Any disclosed enforcement action or forced contract amendment in EU / UK
        - Published DPA, SCCs, UK IDTA, privacy policy
        - Telemetry remains inherently sensitive
        - Pause investment until control remediation is evidenced
      - - Product-operating friction from release cadence
        - Customer complaints about upgrade burden or unsupported versions
        - Repeated evidence that enterprise customers cannot stay within GA / GA-1 support window
        - Explicit lifecycle policy and ongoing release discipline
        - Support burden can still drive churn or slower expansion
        - Request cohort-level retention by deployment model and version
      - - Partner dependency and workflow capture
        - Sentinel or Falcon integration becomes primary customer value narrative
        - Vectra is treated as a feature rather than an independent control point in key accounts
        - Integrations help land inside incumbent SOC tools
        - Embedded position may reduce pricing power
        - Demand attach / detach economics and partner-attributed pipeline data
      - - Execution slippage from leadership and Netography integration
        - Roadmap slips, leadership churn, or unclear packaging after integration
        - Missed product milestones or departure of founder / Head of Cloud / CRO
        - Experienced incoming executives and founder continuity
        - Onboarding load is still concentrated in 2025-2026
        - Escalate diligence on succession and integration program management
      - - Financial opacity
        - Any financing announcement, covenant-like restriction, or emergency cost action
        - Capital raise on unclear terms, visible austerity actions, or inability to quantify runway
        - None visible in public materials beyond scale and customer base
        - Cannot underwrite downside timing confidently from public evidence
