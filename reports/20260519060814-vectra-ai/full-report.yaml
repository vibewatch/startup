      - number: '1.5'
        title: Adverse events and diligence flags
        blocks:
          - type: paragraph
            body: >
              Vectra AI faces two identified litigation matters as of the May 2026 run date. A California court docket
              in the Northern District referenced in the Justia case index (case 5:2023cv01522) involves a dispute with
              a third party; however, the Justia page returned a JavaScript-only access block (accessStatus: js-only),
              preventing independent verification of case details, parties, or status. A second matter, Conexus LLC v.
              Vectra AI Inc. (PACER), appears in a public filing index captured via PacerMonitor but the document was
              returned as rate-limited binary content at time of fetch, preventing case-fact verification. The company's
              public legal page does not reference either matter. Both items require independent legal due diligence
              before investment.


              On revenue and headcount, a credibility gap exists between sources. The official about page states 580+
              employees; GetLatka (as of November 2025) and TipRanks (as of May 2026) report 640–675 employees. The
              discrepancy may reflect a stale official page versus more recent third-party aggregation, or different
              counting conventions (full-time vs. contractor vs. total headcount). The GetLatka $120 million revenue
              estimate is unaudited and should not be treated as confirmed.


              The Blackstone funding announcement (April 2021) cited a $1.2 billion post-money valuation. No subsequent
              official funding has been announced in the nearly five years since, meaning the implied valuation is
              dated. In a high-interest-rate environment and a market where NDR consolidation has intensified, the 2021
              valuation may not reflect current fair value. The company has provided no guidance on secondary pricing or
              future capital events.


              Key-person concentration is material: Hitesh Sheth is simultaneously the founder, the longest-tenured
              employee, the primary external spokesperson, and the final strategic authority. No succession plan or
              co-CEO structure has been disclosed. The CTO, Oliver Tavakoli, has been at Vectra AI for over a decade and
