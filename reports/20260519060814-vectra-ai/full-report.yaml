      - number: '7.2'
        title: Operational / security risk
        blocks:
          - type: paragraph
            body: >-
              Operational risk for Vectra AI is defined less by a disclosed breach history and more by the breadth and
              pace of the platform it must continuously maintain. Official materials show a support model that covers
              only the current GA release and GA-1, a roughly monthly release cadence, and twice-monthly cloud-component
              updates. That helps Vectra ship fixes quickly, but it also pushes update burden onto enterprise customers
              and raises the probability that lagging deployments, version skew, or integration drift will create
              avoidable support friction. The company confirmed that CVE-2026-35386 in OpenSSH did not affect its
              products, which is a positive signal for issue triage discipline, yet the broader attack surface remains
              large because Vectra spans on-premises networks, multi-cloud, identity, SaaS, and OT/IoT contexts.
              External threat data reinforces the point: IBM's 2026 research shows trusted integrations are increasingly
              exploited in supply-chain incidents, while the WEF and Verizon materials show that AI and large-scale
              cyber telemetry environments continue to expand both attacker opportunity and defender complexity. Even
              without a confirmed 2026 breach, the residual operational risk is meaningful because product breadth,
              frequent releases, and supply-chain exposure can compound during incident response.
