              SIEM, identity, EDR, and ticketing stacks rather than trying to replace them outright. That reduces
              rip-and-replace risk because customers can keep Microsoft Sentinel, Splunk, CrowdStrike, Entra ID, Okta,
              and similar systems in the loop, while Vectra contributes prioritization and higher-fidelity detections.
              The March 2026 release notes are useful evidence that the platform is still shipping meaningful
              operational features: CrowdStrike EDR integration reached GA, Multi-SAML SSO reached GA, Investigate API
              v3.4 was updated, and detection content expanded for Sliver C2 and Hidden Tunnel activity. Those releases
              matter because they touch deployment friction, admin controls, and day-two detection quality instead of
              merely cosmetic UI changes.


              At the same time, public material is thinner on reliability specifics. There is no retained public uptime
              SLA, no detailed status metrics in the source set, and limited customer-visible detail on how Fusion data
              is unified with Respond 360 after the Netography acquisition. The roadmap direction looks active and
              sensible; the remaining diligence work is about proving operational depth, not feature intent.
