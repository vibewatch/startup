      - number: '1.4'
        title: Scale, reach, and operational milestones
        blocks:
          - type: paragraph
            body: >
              Since founding in 2011, Vectra AI has progressed through three identifiable eras: the initial R&D and
              product-market-fit phase (2011–2016), the scale-out and international expansion phase (2017–2020), and the
              platform convergence and market-recognition phase (2021–present). The company opened its first EMEA office
              in 2018 and its first APJ office in 2019, and in July 2025 added a Bangalore, India office to expand APJ
              engineering, data science, and marketing capacity.


              In June 2025, Vectra AI was named the sole Leader in the inaugural Gartner Magic Quadrant for Network
              Detection and Response, positioned highest for Ability to Execute and furthest for Completeness of Vision.
              In the same month, GigaOm named Vectra AI both Leader and Outperformer in its Radar for NDR and its Radar
              for ITDR — making Vectra AI the only vendor in either report earning top recognition across both
              categories. In August 2025, the company debuted on the Inc. 5000 list of America's fastest-growing private
              companies.


              The October 2025 Netography acquisition added cloud-native agentless network observability. Netography
              Fusion was rebranded Vectra Fusion and integrated into the Vectra AI Platform, enabling software-defined
              traffic analysis across AWS, Azure, GCP, SaaS, and on-premises environments without agents or hardware
              taps. Netography's founder Martin Roesch (creator of Snort IDS and founder of Sourcefire) joined Vectra AI
              as Head of Cloud. The acquisition terms were not publicly disclosed.


              Customer and partner reach as reported on the official about page: 2,000+ enterprise customers, 95%+
              customer retention rate, 468 transacting partners, operations in 113 countries. Security analyst reviews
              on G2 and PeerSpot document Vectra AI as a market-recognized NDR vendor with strong detection fidelity
              scores and integration breadth, though some reviews note pricing complexity and integration effort as
              areas requiring improvement.
