  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition
        blocks:
          - type: paragraph
            body: >
              Vectra AI's product is best understood as a continuous threat-detection and prioritization workflow for
              hybrid security teams rather than as a single dashboard. The workflow starts with network metadata,
              identity telemetry, cloud flow logs, and partner signals entering the platform. Detect and Cognito surface
              suspicious behavior across east-west network movement and identity abuse; Fusion extends the same idea
              into cloud-native traffic without asking customers to deploy agents in each workload. Attack Signal
              Intelligence then turns those raw detections into entity-centric urgency scores so analysts can work a
              smaller queue of higher-confidence incidents. Recall preserves the investigative breadcrumb trail, Stream
              forwards data into existing SIEM workflows, and Respond 360 plus MXDR convert high-priority findings into
              manual or automated actions.


              In customer workflow terms, Vectra is selling earlier signal reduction, faster triage, and fewer tool
              handoffs across network, identity, cloud, and response operations. That framing matters because platform
              value depends on whether Attack Signal Intelligence truly compresses analyst decision time better than
              point NDR tools or generic SIEM correlation layers.
