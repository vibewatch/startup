      - number: '5.3'
        title: Architecture
        blocks:
          - type: paragraph
            body: >
              Vectra's public architecture reads as a telemetry-ingestion and analytics stack rather than an
              endpoint-heavy agent platform. At the collection layer, the company emphasizes network metadata, identity
              signals, partner EDR context, and cloud VPC or VNet flow logs. Fusion is especially important because it
              extends visibility into cloud-native environments without agents, using software-defined traffic records
              and observability integrations inherited from Netography. Above collection, Vectra says Detect supplies
              200-plus behavioral models and Fusion contributes 300-plus cloud models, with Attack Signal Intelligence
              acting as the normalization and prioritization layer that ranks entities by urgency across surfaces.
              Investigation and workflow services sit on top of that model layer: Recall stores metadata for
              retrospective hunting, Stream routes events into SIEM systems, and the documented API plus public GitHub
              tooling suggest a real automation surface rather than a closed appliance model.


              The trade-off is dependency concentration. Product quality depends on external identity providers,
              cloud-log availability, partner APIs, and acquired Fusion components all feeding cleanly into ASI. That
              makes integration depth and telemetry fidelity central technical diligence items.
