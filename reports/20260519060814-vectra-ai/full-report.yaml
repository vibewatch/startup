        title: Retention, satisfaction, and durability gaps
        blocks:
          - type: paragraph
            body: >
              Public retention evidence for Vectra is directionally positive but materially incomplete. The company
              claims customer retention above 95%, and G2 shows a 4.3 out of 5 rating from 20 reviews at the time of
              review, which is consistent with a product that is valued by practitioners after deployment. PeerSpot
              comparison pages also show Vectra being actively evaluated alongside Darktrace and ExtraHop, which
              supports the view that Vectra is part of live enterprise buying cycles rather than a marginal niche
              product. These signals are useful, but they are not substitutes for the core retention metrics that
              investors would normally want.


              Specifically, Vectra does not publicly disclose NRR, GRR, churn, contract length, renewal rates, or cohort
              retention by year or segment. The cohort figure in this chapter is therefore an analyst estimate anchored
              to the company's greater-than-95-percent retention claim, not a reported management disclosure. Review
              evidence is also mixed rather than uniformly bullish: independent comparisons imply stronger mindshare for
              Darktrace in parts of the market, which is an adverse signal against the otherwise positive satisfaction
