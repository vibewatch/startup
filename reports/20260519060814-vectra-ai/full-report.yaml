      - number: '5.2'
        title: Module map
        blocks:
          - type: paragraph
            body: >
              Public materials show a portfolio with seven named product surfaces and a coherent cross-sell logic.
              Detect remains the flagship network detection and response module; Cognito handles identity threat
              detection and response; Recall keeps forensic metadata for longer-horizon investigations; Stream exports
              detections and enriched metadata into downstream SIEM or data-lake workflows; Respond 360 covers manual
              and automated response orchestration; Fusion adds cloud-native network observability after the Netography
              acquisition; and MXDR wraps the platform in a managed-service operating model for customers that want
              Vectra analysts in the loop. This is not just a list of SKUs. Each module maps to a distinct operational
              job, but the common selling motion is to make them appear as one analyst workflow stitched together by
              Attack Signal Intelligence and a shared integration layer.


              The module map therefore looks strongest when a buyer already runs hybrid environments and wants one
              system to correlate network, identity, and cloud detections. The key diligence question is packaging
              depth: whether Fusion and Respond 360 are as operationally mature and tightly connected as Detect and
