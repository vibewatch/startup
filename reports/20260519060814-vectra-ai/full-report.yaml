      - number: '8.4'
        title: Scenario analysis and return model
        blocks:
          - type: paragraph
            body: >-
              The scenario model for Vectra should be read as a disciplined range exercise rather than a forecast built
              on verified financial statements. In the bull case, the company uses Gartner and GigaOm validation, ITDR
              market growth, and Netography-enabled cloud expansion to push ARR above roughly $150 million by 2027,
              which could support a strategic premium and a valuation closer to $2.4-3.0 billion. In the base case,
              growth remains positive but more moderate, NDR headwinds partly offset ITDR gains, and the outcome settles
              around $1.5-2.0 billion on a 12-14x exit multiple. In the bear case, platform substitution and pricing
              pressure cap ARR close to today's estimated level and compress the multiple into the 7-9x band, producing
              only $0.7-1.0 billion of value. The weighted lesson is that upside exists, but most of the variance comes
              from a small set of missing variables: actual ARR, net retention, product-mix evolution, and whether cloud
              / identity expansion is strong enough to offset category compression in standalone NDR.
            claimRefs:
              - CV018
