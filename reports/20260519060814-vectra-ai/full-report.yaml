      - number: '7.3'
        title: Partner / dependency risk
        blocks:
          - type: paragraph
            body: >-
              Vectra AI's partner ecosystem is strategically useful but also structurally risky because its most visible
              integrations sit with platform vendors that can simultaneously distribute Vectra and displace it. The
              clearest example is CrowdStrike: Vectra markets a joint solution that unifies network, cloud, identity,
              SaaS, and endpoint context, but CrowdStrike's own Falcon platform positions itself as an agentic security
              platform with unified XDR and SIEM capabilities. Microsoft presents a similar dual role. Vectra's Sentinel
              integration helps customers automate incident creation and forensics, which reduces switching friction
              into Microsoft workflows while also increasing dependence on a vendor that continues to broaden its own
              security platform. Nozomi Networks extends Vectra into OT and IoT environments, but that relationship
              introduces specialized execution and overlap risk because OT buyers may increasingly prefer native or
              single-vendor platforms. The broader dependency problem is not just these named partners; it is the
              maintenance burden created by connectors, public API tooling, and a research community that increases
              integration surface area over time. That makes dependency risk a direct input into renewals,
              product-roadmap prioritization, and competitive pricing pressure.
