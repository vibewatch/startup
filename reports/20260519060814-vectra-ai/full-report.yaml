  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Included Spend
        blocks:
          - type: paragraph
            body: >
              Vectra AI's economically relevant market is not “all cybersecurity” and it is not the full spend pool of
              SIEM, XDR, IAM, or endpoint tooling. The practical boundary starts with network detection and response:
              software and telemetry pipelines that inspect east-west traffic, cloud-network flows, SaaS identity
              activity, and attacker movement after initial compromise. It expands into identity threat detection and
              response because Vectra's platform and competitive messaging are increasingly built around identity-layer
              detections and automated response actions, not just packet or flow analytics. A managed-detection overlay
              is also relevant when buyers or channel partners consume the same telemetry through outsourced monitoring,
              triage, and incident response services rather than fully staffing an internal SOC.

              Excluded spend matters just as much as included spend. Pure-play EDR licenses, generic SIEM storage and
              search, standalone IAM governance, PAM, and broad consulting retain cybersecurity budget but do not map
              cleanly to Vectra's value proposition unless they ingest or enrich network-and-identity detections.
              Status-quo substitutes are manual SOC operations, SIEM-only detection, and bundled XDR platforms from
              larger vendors. Omdia's 2026 NDR analysis shows why that distinction matters: some standalone NDR renewals
              were displaced by platform XDR from 2022 to 2025, yet the same report argues that buyers still preserve
              standalone NDR when they need deeper visibility into unmanaged assets, east-west traffic, SaaS identities,
              and OT/ICS environments that remain weakly covered by EDR-centric platforms. TM001 defines the spend
              boundary, and FM001 shows that Vectra's true opportunity is a constrained slice of a broader AI-augmented
              security-operations market rather than the entire security stack.
