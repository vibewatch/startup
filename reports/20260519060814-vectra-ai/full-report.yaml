      - number: '4.3'
        title: Capital adequacy, Netography acquisition, and financing dependency
        blocks:
          - type: paragraph
            body: >-
              For capital adequacy, the key public anchor remains the April 2021 Series F. The official Vectra and
              Blackstone releases say the round brought in $130 million, increased total funding to more than $350
              million, and valued the company at $1.2 billion post-money. Blackstone also said the capital would fund
              platform innovation, research and development, and expansion into new markets and geographies. That is the
              last clearly disclosed financing event in the retained public record. Company Overview contains the full
              round chronology; this chapter focuses on what those funding facts imply for today's balance-sheet risk
              rather than restating the entire history.


              Two later developments affect the capital story. First, Vectra has not publicly disclosed a new financing
              round after 2021, so investors cannot tell from public materials whether current liquidity is still
              supported primarily by the Series F balance sheet, by internally generated cash flow, or by unannounced
              debt or secondary transactions. Second, the October 2025 Netography acquisition adds a clear but
              unquantified cash-use signal. Official and independent coverage agree the acquisition expanded Vectra into
              cloud-native network observability and strengthened multi-cloud and MSSP use cases, but the consideration
              was not disclosed. That makes it strategically positive yet financially opaque: the transaction likely
              consumed capital, but the magnitude is unknown.


              The largest remaining blind spots are cash on hand, burn, runway, debt, and financing triggers. No
              retained public source discloses monthly burn, debt balances, project-finance obligations, covenant
              constraints, or a next-round threshold. The Conexus filing adds an adverse legal data point because it
              indicates a 2025 commercial or IP dispute, but the retrieved PDF was not readable enough to quantify
              exposure. The public record therefore supports confidence in past fundraising and strategic use of
              capital, but not in present-day liquidity sufficiency.
