            body: >
              Vectra's strongest customer evidence is its set of named production case studies with quantified outcomes.
              Blackstone reports a 90% reduction in security alerts; Globe Telecom reports 99% noise reduction, 96%
              fewer escalations, and 78% faster incident response in one year; Van Gogh Museum reports an 84% true
              positive rate across Azure identity and data-center coverage; and Luxgen reports 95.3% fewer escalations
              through a managed MXDR deployment. FICO's case study is also valuable because it describes a concrete
              hybrid-visibility deployment with Fusion and includes a named executive quote from Shannon Ryan, giving
              the proof more operating detail than a simple logo placement.


              The proof quality is uneven beneath the top tier. Texas A&M University, American University, Nissho
              Electronics, Goodwood Estate, and Maire all appear as named references, but not all of them disclose
              quantified before-versus-after outcomes. That means the chapter can confidently say Vectra has real
              production use in multiple verticals, yet it cannot claim that every published logo demonstrates the same
              level of measurable ROI. Independent review platforms provide some outside corroboration that the product
              is actively used in production, but the dramatic outcome metrics themselves remain mostly
