              - CV037
              - CV041
      - number: '8.3'
        title: Comparable analysis
        blocks:
          - type: paragraph
            body: >-
              Public valuation benchmarking for Vectra is informative but inherently imperfect because the cleanest
              direct peers are private or were acquired. ExtraHop is the clearest NDR transaction precedent: a roughly
              $900 million sale on an estimated $100-130 million ARR base implies about 7-9x ARR. Darktrace's 2024
              take-private by Thoma Bravo implies a similar 8-9x ARR band, but Darktrace is broader than Vectra because
              it spans more modalities and had much more scale. Nozomi Networks provides a useful
              specialized-infrastructure-security reference at roughly 8-9x ARR on estimated numbers, while
              integrated-platform rows such as Cisco and CrowdStrike are best treated as qualitative pressure benchmarks
              rather than standalone comps. Against that set, Vectra looks expensive at the time of its 2021 Series F,
              when analyst estimates implied roughly 15-24x ARR, but more reasonable if the business is truly around
              $120 million ARR today, in which case the stale $1.2 billion mark equates to roughly 10x ARR. The problem
              is that the current price is unknown, so the comparable exercise sets a range, not an investable clearing
              price. Tracxn's public profile adds a cautionary note rather than clarity: it lists conflicting founding
              and round-history details versus official sources, reinforcing that private-company databases are useful
              directional inputs but not canonical valuation records.
            claimRefs:
              - CV006
