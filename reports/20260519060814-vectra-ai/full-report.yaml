  - id: TM001
    title: Market Definition Table
    columns:
      - segment/category
      - included spend
      - excluded spend
      - buyer/payer
      - relevance
    rows:
      - - Network detection and response (NDR)
        - >-
          East-west traffic analytics, packet or flow telemetry, encrypted traffic analysis, threat hunting, and
          response workflows tied to network signals.
        - >-
          Pure-play EDR agent licenses, SIEM log storage, firewall hardware refresh, and generic monitoring spend
          without network-detection logic.
        - 'Buyer: Head of SecOps or detection engineering; payer: CISO or security platform budget owner.'
        - Core Vectra AI category; strongest fit where deep network visibility is required.
      - - Identity threat detection and response (ITDR)
        - >-
          Detection and response across Active Directory, Entra, SaaS identities, session abuse, and identity
          control-plane anomalies.
        - IAM governance suites, PAM, MFA, and identity-lifecycle management without runtime detection and response.
        - 'Buyer: identity security lead or SOC architect; payer: CISO, CIO, or shared identity-security budget.'
        - Strategic adjacency that expands Vectra beyond classic NDR.
      - - MDR overlay
        - Managed monitoring, investigation, and response services powered by NDR, ITDR, and cloud telemetry.
        - >-
          Generic MSSP log monitoring, one-off consulting, or staff augmentation without a differentiated detection
          layer.
        - >-
          Buyer: outsourced SOC leader, MSSP operator, or enterprise CISO; payer: security operations or managed-service
          budget.
        - Channel path that can accelerate adoption when in-house analyst capacity is tight.
      - - AI-SOC overlay
        - >-
          AI-driven alert triage, signal prioritization, and automated response layered on network and identity
          detections.
        - >-
          Generic copilots without proprietary detections, workflow chatbots, or automation tools with no threat
          content.
        - 'Buyer: SOC transformation lead; payer: CISO, security platform owner, or operations efficiency program.'
        - Both a growth vector and a competitive pressure point versus broader XDR suites.
      - - OT/ICS security
        - >-
          Passive monitoring for industrial traffic, unmanaged assets, contractor access, and IT/OT convergence
          workflows.
        - Pure endpoint safety systems, asset inventory alone, or OT consultancies without continuous network telemetry.
        - 'Buyer: OT security manager or plant network owner; payer: CISO, CIO, or industrial-operations budget.'
        - Important niche where standalone NDR retains differentiated value.
    notes: >-
      Boundary definition is intentionally partial because public category labels overlap. Included spend follows the
      telemetry-led detection and response workflows most relevant to Vectra AI and excludes pure SIEM, pure EDR, and
      standalone IAM governance categories that do not rely on network or identity detections.
    enumerationScope:
      coverage: partial
      basis: >-
        Market segment boundaries derived from Verizon DBIR 2026, Omdia NDR 2026, and MarketsandMarkets MDR 2026 analyst
        reports; excludes pure-play endpoint and SIEM categories without network telemetry components.
