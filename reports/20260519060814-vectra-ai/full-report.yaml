      - number: '8.2'
        title: Market sizing and opportunity
        blocks:
          - type: paragraph
            body: >-
              Vectra's addressable opportunity sits at the intersection of NDR, ITDR, and MDR rather than inside a
              single clean category, which is why the market backdrop looks both attractive and structurally messy. On
              the positive side, Research and Markets projects ITDR to grow from $2.97 billion in 2024 to $24.6 billion
              by 2030, while MarketsAndMarkets expects MDR to expand from $4.6 billion in 2026 to $19.0 billion by 2031.
              Microsoft adds urgency by disclosing roughly 600 million identity attacks per day, which validates the
              strategic need for identity-centric detection. The complication is in NDR itself: Omdia's 2026 work says
              the standalone NDR market was pressured by XDR consolidation from Microsoft, CrowdStrike, and Palo Alto,
              even while regulated verticals and zero-trust mandates preserved demand for deep behavioral analytics.
              That means Vectra's opportunity is not simply to ride an NDR wave; it is to use its analyst-ranked NDR
              position to win identity, cloud, and managed workflows where platform bundles still leave gaps.
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
              - CV017
              - CV034
