  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer base segmentation and buyer profile
        blocks:
          - type: paragraph
            body: >
              Vectra AI's public customer footprint looks concentrated in enterprise and upper-midmarket security teams
              rather than in small-business buyers. The recurring buyer appears to be the CISO, VP of Security, or SOC
              leader who is responsible for reducing alert volume across hybrid environments; the daily user is the SOC
              analyst or incident responder operating triage and investigation workflows. Public case studies show
              deployments in financial services (Blackstone, FICO), telecom (Globe Telecom), manufacturing (Luxgen),
              higher education (Texas A&M University and American University), cultural institutions (Van Gogh Museum),
              and industrial or engineering environments (Maire). That breadth matters because it suggests Vectra can
              sell across multiple regulated and mission-critical settings without depending on a single use-case niche.


              Geography is also meaningfully diversified. Named public references span North America, the Philippines,
              Japan, Taiwan, the Netherlands, the United Kingdom, and continental Europe, while the customer-stories
              library implies a broader global base than the named set alone. Goodwood Estate's story with Gigamon
              suggests Vectra can also enter through partner-assisted architectures rather than only direct
              rip-and-replace deals. Official NIS2 and GDPR materials further indicate active messaging to regulated
              European buyers. The main segmentation gap is economic, not categorical: Vectra does not publicly break
              out revenue, ACV, or customer mix by vertical, size band, or region.
