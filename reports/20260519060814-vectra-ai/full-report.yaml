  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Observable signal
      - Transmission to thesis
      - Action implication
    rows:
      - - Verified ARR materially below $100M or NDR below 100%
        - Data room or financing materials reveal weak recurring-revenue quality
        - Stale 2021 valuation would be unsupported even before applying discount
        - Move from track to pass until a new price or turnaround evidence exists
      - - Direct evidence of XDR-driven displacement
        - Lost deals, churn, or pricing concessions tied to Microsoft / CrowdStrike / Palo Alto bundles
        - Confirms the anti-thesis that NDR is being feature-compressed
        - Cut the base-case multiple and assume bear-case probability rises sharply
      - - Netography integration stalls
        - No meaningful cloud attach, delayed product launches, or senior-cloud turnover
        - Removes the clearest platform-expansion catalyst
        - Reduce bull-case probability and treat cloud thesis as unproven
      - - Analyst ranking deterioration
        - Loss of Gartner or dual GigaOm leadership position
        - Weakens the premium-scarcity narrative behind strategic interest
        - Reassess whether Vectra still deserves a premium to ExtraHop-like precedent
      - - Hidden financing pressure
        - Venture debt, down round, or forced secondary emerges after diligence
        - Changes equity waterfall and can convert liquidity pressure into a negative catalyst
        - Rebuild the cap-table model before any capital deployment
      - - No credible liquidity path by 2028
        - Still no new round, IPO filing, or sale process despite elapsed Blackstone hold period
        - Investor pressure shifts from positive catalyst to overhang
        - Assume extended hold and lower exit-multiple confidence
    notes: >-
      These triggers are designed for monitoring rather than forecasting. Each one maps to a direct valuation
      consequence: lower ARR confidence, lower multiple confidence, or a materially worse capital-markets path.
