      - number: '8.5'
        title: Thesis-break and diligence asks
        blocks:
          - type: paragraph
            body: >-
              The practical question for investors is not whether Vectra is interesting, but what would have to be true
              to upgrade the recommendation from track to invest. The answer starts with financial transparency:
              management needs to disclose ARR, growth, retention, gross margin, and the current capital stack well
              enough to anchor a real multiple. Just as important, investors need evidence that the Netography
              acquisition is integrating into sellable cloud coverage rather than becoming an expensive feature addition
              with unclear monetization. The kill triggers are therefore mostly commercial and capital-markets oriented:
              a material slowdown in expansion, evidence of XDR-driven displacement, a hidden financing need, or
              prolonged lack of liquidity progress beyond Blackstone's expected hold period. Until those issues are
              closed, the correct monitoring posture is to watch recurring-revenue quality, ITDR mix, cloud-integration
              milestones, and any sign of a new round, IPO filing, or strategic sale process. Those are the variables
              that decide whether the base case is stabilizing or deteriorating.
            claimRefs:
