  - id: FV003
    title: Valuation / return range
    type: range
    layout: wide
    summary: Bull, base, and bear valuation ranges for Vectra AI based on public-data scenario assumptions.
    data:
      items:
        - label: Bear
          low: 0.7
          mid: 0.85
          high: 1
          detail: Standalone NDR compression and weak retention
        - label: Base
          low: 1.5
          mid: 1.75
          high: 2
          detail: Moderate execution with partial offset from ITDR and cloud
        - label: Bull
          low: 2.4
          mid: 2.7
          high: 3
          detail: Successful cloud / identity expansion plus strategic premium
    approximationNotes: >-
      These ranges represent equity-value outcomes, not guaranteed entry or exit prices. The spread is wide because the
      public record does not disclose ARR, retention, or the capital stack needed to narrow the model.
    claimRefs:
      - CV021
      - CV022
      - CV023
      - CV042
      - CV043
  - id: FV004
    title: Investment KPIs scorecard
    type: kpi
    layout: wide
    summary: High-level scorecard of the investability dimensions that matter most in the current chapter.
    data:
      items:
        - label: Estimated ARR scale
          value: 120
          max: 200
          note: Directional only; based on GetLatka estimate rather than company disclosure
        - label: Customer base
          value: 2000
          max: 2500
          note: Installed-base evidence is strong enough to support strategic relevance
        - label: AI patents
          value: 39
          max: 50
          note: Patent count supports technology-moat narrative but not monetization quality
        - label: Stale-mark multiple
          value: 10
          max: 25
          note: Approximate $1.2B valuation divided by $120M estimated ARR
        - label: Analyst-ranking strength
          value: 5
          max: 5
          note: Gartner leader plus dual GigaOm leader / outperformer
        - label: Financial transparency
          value: 1
          max: 5
          note: Weakest KPI because ARR, retention, and cap-table data are not publicly disclosed
    approximationNotes: >-
      KPI values mix raw counts and judgmental scores, so they are intended for investment-committee prioritization
      rather than time-series reporting. The scorecard is intentionally asymmetric: strategic proof is stronger than
      financial proof.
    claimRefs:
      - CV005
      - CV014
      - CV016
      - CV017
      - CV041
