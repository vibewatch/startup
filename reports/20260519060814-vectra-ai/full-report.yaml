            title: XDR Platform Consolidation Is the Primary Structural Threat to Base-Case Return Assumptions
            body: >-
              If Microsoft, CrowdStrike, or Palo Alto continue to absorb acceptable NDR capability into broader suites,
              Vectra's renewal power and exit multiple can compress at the same time.
            calloutType: risk
