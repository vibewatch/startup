  - id: FV002
    title: Valuation sensitivity chart
    type: bar
    layout: wide
    summary: Selected ARR-multiple benchmarks show where Vectra sits relative to direct and adjacent references.
    data:
      items:
        - label: ExtraHop
          value: 8
          detail: Approximate midpoint of ~7-9x ARR on 2021 sale
        - label: Darktrace
          value: 8.5
          detail: Approximate midpoint of ~8-9x ARR on 2024 take-private
        - label: Nozomi Networks
          value: 8.5
          detail: Approximate specialized-infrastructure-security reference
        - label: Vectra 2021 close
          value: 19
          detail: Approximate midpoint of ~15-24x ARR using analyst-estimated ARR at Series F
        - label: Vectra stale-mark on $120M ARR
          value: 10
          detail: Approximate implied multiple if the last disclosed $1.2B mark is compared with 2025 estimated ARR
    approximationNotes: >-
      Bars use midpoint estimates for comparability and should not be read as precise trading multiples. The Vectra
      values are especially sensitive to ARR assumptions because management has not publicly disclosed current recurring
      revenue.
