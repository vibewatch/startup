        title: Adoption trajectory and public scale signals
        blocks:
          - type: paragraph
            body: >
              The clearest top-line adoption signal is Vectra's own claim that it serves more than 2,000 organizations
              globally, combined with a public customer-stories library that surfaces a double-digit set of named
              deployments. That is enough to establish that Vectra is beyond pilot-stage commercialization, but it is
              still weaker than the level of disclosure investors would get from a public SaaS company because the
              company does not publish active-account trends, seat counts, deployed-sensor counts, or any MAU/DAU
              equivalent. The available customer proof is therefore broad enough to show adoption breadth, but not
              precise enough to model utilization intensity or deployment depth across the full installed base.


              Secondary scale markers provide context rather than direct customer denominators. GetLatka estimates about
              $120 million of 2025 revenue, while Blackstone's 2021 $130 million investment at a $1.2 billion valuation
              marked a major commercialization milestone and validated enterprise interest in the platform. Omdia's May
              2026 market note also reinforces why customer proof matters now: NDR is moving through consolidation and
              platform bundling, so vendors that cannot point to credible production outcomes risk being marginalized in
              enterprise shortlists. Vectra's named references and analyst-recognition cadence suggest continuing market
              relevance, but the missing year-by-year customer-count trajectory remains a real diligence gap.
