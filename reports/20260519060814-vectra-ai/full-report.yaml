  - id: FV001
    title: Recommendation logic flow
    type: flow
    layout: wide
    summary: Logic chain supporting the current Track recommendation for Vectra AI.
    data:
      nodes:
        - id: n1
          label: Analyst leadership
          detail: Gartner NDR leader plus dual GigaOm NDR / ITDR leadership
        - id: n2
          label: Installed base
          detail: 2,000+ customers and 39 AI patents suggest real strategic relevance
        - id: n3
          label: Market tailwind
          detail: ITDR and MDR are growing quickly even as NDR consolidates
        - id: n4
          label: Cloud expansion
          detail: Netography adds cloud-native observability and Martin Roesch credibility
        - id: n5
          label: Financial opacity
          detail: No public ARR, retention, margin, or current valuation disclosure
        - id: n6
          label: Structural risk
          detail: Omdia flags XDR consolidation as the central threat to standalone NDR
        - id: n7
          label: Decision
          detail: Track until current ARR, cap table, and integration proof are verified
    approximationNotes: >-
      This flow is conceptual rather than probabilistic. It shows which evidence blocks are carrying the recommendation
      and which missing facts prevent an invest call.
