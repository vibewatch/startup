  evidenceGaps:
    - id: EGE001
      type: missing-source
      severity: material
      topic: "detection-benchmark"
      missingEvidence: "An independent benchmark comparing Vectra's detection efficacy, alert precision, or analyst time savings against top NDR peers."
      whyItMatters: "Analyst awards and company claims support credibility, but they do not prove superior operational outcomes versus competitors."
      diligencePath: "Request third-party benchmark material or customer telemetry showing before-versus-after alert quality and mean-time-to-triage improvements."
      relatedQuestionRefs: [QE016]
    - id: EGE002
      type: private-evidence-only
      severity: material
      topic: "certification-disclosure"
      missingEvidence: "Current SOC 2 Type II and ISO 27001 attestations or a trust-center artifact confirming certification scope and dates."
      whyItMatters: "Enterprise buyers often require current audit artifacts, and public privacy-policy language is weaker than independent assurance evidence."
      diligencePath: "Ask Vectra for a current trust packet, audit reports, certificate numbers, and the covered product boundaries."
      relatedQuestionRefs: [QE017, QE018]
    - id: EGE003
      type: missing-source
      severity: material
      topic: "fusion-integration"
      missingEvidence: "Technical proof showing how Fusion telemetry is normalized into ASI, investigation workflows, and response actions after the Netography acquisition."
      whyItMatters: "Fusion is a core expansion wedge, but weak post-acquisition integration would limit cross-surface differentiation and workflow value."
      diligencePath: "Request architecture walkthroughs, customer references, or product demos that show Fusion detections flowing end-to-end into Recall, Stream, and Respond 360."
      relatedQuestionRefs: [QE019]
    - id: EGE004
      type: missing-source
      severity: material
      topic: "reliability-sla"
      missingEvidence: "A public or customer-facing uptime SLA, availability commitment, or historical status evidence for the platform."
      whyItMatters: "Product breadth is attractive only if the operational layer is reliable enough for mission-critical SOC workflows."
      diligencePath: "Request SLA language, service-credit terms, historical uptime reports, and customer references on production reliability."
