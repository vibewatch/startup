    calloutType: insight
    title: "Fusion is the expansion wedge"
    body: "Netography-derived Fusion matters because it widens the addressable problem from classic NDR into cloud-native observability, which is where consolidation pressure and platform competition are increasing."
    claimRefs: [CE006, CE011, CE027, CE028, CE038]
  - id: KE003
    calloutType: risk
    title: "Public trust evidence is thinner than product evidence"
