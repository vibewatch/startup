chapter:
  number: 5
  title: "Product & Technology"
  summary: "Vectra AI's product stack combines network, identity, cloud, investigation, export, and response workflows around Attack Signal Intelligence. The platform appears broad and commercially mature, but public diligence still needs stronger evidence on independent detection benchmarks, post-Netography Fusion integration depth, certification disclosure, and uptime commitments."
companyName: "Vectra AI"
chapterKey: product-tech
chapterOrder: 5
letter: E
title: "Product & Technology"
sections:
  - id: section-product-definition
    title: "Product definition"
    body: |
      Vectra AI's product is best understood as a continuous threat-detection and prioritization workflow for hybrid security teams rather than as a single dashboard. The workflow starts with network metadata, identity telemetry, cloud flow logs, and partner signals entering the platform. Detect and Cognito surface suspicious behavior across east-west network movement and identity abuse; Fusion extends the same idea into cloud-native traffic without asking customers to deploy agents in each workload. Attack Signal Intelligence then turns those raw detections into entity-centric urgency scores so analysts can work a smaller queue of higher-confidence incidents. Recall preserves the investigative breadcrumb trail, Stream forwards data into existing SIEM workflows, and Respond 360 plus MXDR convert high-priority findings into manual or automated actions.

      In customer workflow terms, Vectra is selling earlier signal reduction, faster triage, and fewer tool handoffs across network, identity, cloud, and response operations. That framing matters because platform value depends on whether Attack Signal Intelligence truly compresses analyst decision time better than point NDR tools or generic SIEM correlation layers.
    contentRequirements:
      - "Product/service definition in customer workflow terms."
      - "How telemetry becomes prioritized analyst action across the Vectra AI platform."
    claimRefs: [CE001, CE002, CE003, CE004, CE005, CE006, CE007, CE008, CE009, CE029]
    tableRefs: [TE002]
    figureRefs: [FE002]
  - id: section-module-map
    title: "Module map"
    body: |
      Public materials show a portfolio with seven named product surfaces and a coherent cross-sell logic. Detect remains the flagship network detection and response module; Cognito handles identity threat detection and response; Recall keeps forensic metadata for longer-horizon investigations; Stream exports detections and enriched metadata into downstream SIEM or data-lake workflows; Respond 360 covers manual and automated response orchestration; Fusion adds cloud-native network observability after the Netography acquisition; and MXDR wraps the platform in a managed-service operating model for customers that want Vectra analysts in the loop. This is not just a list of SKUs. Each module maps to a distinct operational job, but the common selling motion is to make them appear as one analyst workflow stitched together by Attack Signal Intelligence and a shared integration layer.

      The module map therefore looks strongest when a buyer already runs hybrid environments and wants one system to correlate network, identity, and cloud detections. The key diligence question is packaging depth: whether Fusion and Respond 360 are as operationally mature and tightly connected as Detect and Cognito.
    contentRequirements:
      - "Module, SKU, asset, pipeline, facility, or product-line map."
      - "How the named products fit together commercially and operationally."
    claimRefs: [CE002, CE003, CE004, CE005, CE006, CE007, CE008, CE010, CE011, CE013, CE027, CE028]
    tableRefs: [TE001]
    figureRefs: [FE004]
  - id: section-architecture
    title: "Architecture"
    body: |
      Vectra's public architecture reads as a telemetry-ingestion and analytics stack rather than an endpoint-heavy agent platform. At the collection layer, the company emphasizes network metadata, identity signals, partner EDR context, and cloud VPC or VNet flow logs. Fusion is especially important because it extends visibility into cloud-native environments without agents, using software-defined traffic records and observability integrations inherited from Netography. Above collection, Vectra says Detect supplies 200-plus behavioral models and Fusion contributes 300-plus cloud models, with Attack Signal Intelligence acting as the normalization and prioritization layer that ranks entities by urgency across surfaces. Investigation and workflow services sit on top of that model layer: Recall stores metadata for retrospective hunting, Stream routes events into SIEM systems, and the documented API plus public GitHub tooling suggest a real automation surface rather than a closed appliance model.

      The trade-off is dependency concentration. Product quality depends on external identity providers, cloud-log availability, partner APIs, and acquired Fusion components all feeding cleanly into ASI. That makes integration depth and telemetry fidelity central technical diligence items.
    contentRequirements:
      - "Architecture or operating model — software stack, hardware design, manufacturing, clinical mechanism, logistics, or service workflow."
      - "Critical technical dependencies and data flows."
    claimRefs: [CE009, CE010, CE011, CE022, CE023, CE024, CE025, CE028, CE029, CE043]
    tableRefs: [TE003]
    figureRefs: [FE001, FE003]
  - id: section-deployment
    title: "Deployment, integration, and roadmap"
    body: |
      Deployment appears flexible but integration-heavy. Official materials show Vectra connecting to customer SIEM, identity, EDR, and ticketing stacks rather than trying to replace them outright. That reduces rip-and-replace risk because customers can keep Microsoft Sentinel, Splunk, CrowdStrike, Entra ID, Okta, and similar systems in the loop, while Vectra contributes prioritization and higher-fidelity detections. The March 2026 release notes are useful evidence that the platform is still shipping meaningful operational features: CrowdStrike EDR integration reached GA, Multi-SAML SSO reached GA, Investigate API v3.4 was updated, and detection content expanded for Sliver C2 and Hidden Tunnel activity. Those releases matter because they touch deployment friction, admin controls, and day-two detection quality instead of merely cosmetic UI changes.

      At the same time, public material is thinner on reliability specifics. There is no retained public uptime SLA, no detailed status metrics in the source set, and limited customer-visible detail on how Fusion data is unified with Respond 360 after the Netography acquisition. The roadmap direction looks active and sensible; the remaining diligence work is about proving operational depth, not feature intent.
    contentRequirements:
      - "Deployment, integration, reliability, support, and roadmap."
      - "What is shipped today versus what still requires deeper proof."
    claimRefs: [CE013, CE016, CE017, CE018, CE019, CE020, CE021, CE022, CE027, CE043]
    tableRefs: [TE005]
    figureRefs: []
  - id: section-differentiation
    title: "Differentiation"
    body: |
      Vectra's strongest differentiation claim is not any single sensor or detection rule; it is the combination of cross-surface telemetry, AI-driven prioritization, and market credibility in NDR. The company says it holds 39 AI patents, cites 12 MITRE D3FEND references, monitors 13.3 million IPs daily, and uses 200-plus behavioral models in Detect plus 300-plus cloud models in Fusion. Those are company-claimed metrics, but together they describe a product thesis centered on proprietary model depth and signal compression. External recognition helps that story: Vectra was publicly positioned as a 2025 Gartner Magic Quadrant Leader for NDR, and official recognition pages also cite top placement in GigaOm evaluations. Review sites add another layer of evidence, with solid scores on G2 and PeerSpot suggesting the platform is respected by practitioners.

      The acquisition of Netography also matters strategically because it broadens Vectra's relevance as the NDR market shifts toward cloud-native observability and platform consolidation. The unresolved question is whether those differentiators translate into independently provable outcome advantages versus strong peers.
    contentRequirements:
      - "Differentiation — technology, IP, data, manufacturing know-how, supply access, brand, regulatory approvals, or operations."
      - "How public recognition and technical claims support the moat story."
    claimRefs: [CE010, CE011, CE012, CE014, CE015, CE033, CE034, CE035, CE036, CE038]
    tableRefs: []
    figureRefs: []
  - id: section-trust
    title: "Trust, security, privacy, and quality"
    body: |
      Trust and control evidence is mixed: credible enough for serious enterprise evaluation, but not as complete as a buyer would want before underwriting mission-critical deployment. On the positive side, Vectra says the platform works from metadata and behavioral analytics rather than full packet capture, which reduces privacy and storage burden. Official materials also state compliance with GDPR, UK GDPR, CCPA, and CPRA, and support guidance says the platform is not impacted by CVE-2026-35386. Multi-SAML SSO reaching GA in March 2026 further improves identity-control posture for enterprises with federated authentication needs. The public gap is certification and reliability disclosure.

      In the retained source set, Vectra does not publicly disclose SOC 2 Type II or ISO 27001 certification, and no public uptime SLA or availability target is provided. Independent review evidence is also not uniformly glowing: customer commentary remains broadly positive on detection quality, but some reviews mention pricing complexity, integration effort, and operational overhead. For diligence, that means Vectra clears the threshold for privacy-awareness and baseline security messaging, yet still needs customer-facing proof on audit artifacts, SLA commitments, and implementation burden.
    contentRequirements:
      - "Trust, safety, security, privacy, compliance, and quality controls."
      - "What control claims are public versus what still requires diligence."
    claimRefs: [CE018, CE030, CE031, CE032, CE040, CE041, CE042]
    tableRefs: [TE004]
    figureRefs: []
