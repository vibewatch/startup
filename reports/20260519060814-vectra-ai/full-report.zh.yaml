  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式、定价机制与 GTM 动作
        blocks:
          - type: paragraph
            body: >-
              最适合理解 Vectra AI 变现模式的方式，是把它看作围绕更广威胁检测与响应平台包装的企业安全软件订阅，顶部再叠加可选托管服务。公开平台页面显示，Vectra 是演示驱动、销售辅助的企业采购，而不是自助式
              SaaS 产品：买方被引导去申请介绍或观看平台实操，而不是进入公开结账流程。这很重要，因为它意味着协商定价、企业合同条款，以及可能随环境规模、部署范围和服务需求变化的交易结构，而不是简单的标价 SKU 目录。


              公开材料显示，收入架构至少有四条路径。第一，面向网络、身份和云检测的直接企业平台订阅。第二，MDR 和响应服务，包括 360 Response 与可选高级支持，可以作为平台覆盖层出售。第三，渠道和 MSSP
              转售。Vectra 2026 年 3 月 Channel Chief
              公告明确称，生态覆盖解决方案提供商、系统集成商、战略联盟、MSSP、分销商和超大规模云厂商，管理层也把这个生态定位为长期增长核心。第四，市场或伙伴辅助采购：官方材料和伙伴信息暗示，客户可通过既有云和渠道关系购买，尽管公开的实际成交价格缺失。


              缺失的东西和已有的东西同样重要。保留的公开来源没有披露标价、实际折扣、合同期限、最低金额、模块级收入结构或收入确认政策。财务上，公开记录支持一个拥有多条变现路径的多元企业 GTM 结构，但无法支撑对
              ACV、服务附加率、渠道利润率或直销与伙伴组合的精确建模。
