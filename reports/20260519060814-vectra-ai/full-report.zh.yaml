      - number: '3.2'
        title: 直接 NDR 同业
        blocks:
          - type: paragraph
            body: >
              直接同业集合由 Darktrace、ExtraHop、Cisco Secure Network Analytics，以及相邻 OT 专业厂商 Nozomi Networks 领衔。独立 PeerSpot
              数据给出最干净的 2026 年 5 月快照：Darktrace 在对比组中排名第一，心智份额 14.8%；ExtraHop 排名第四，心智份额
              6.1%；两家厂商都较前期水平明显下滑。同一数据支持一种解释：Vectra 竞争的是正在收缩的份额池，而不只是跑赢或跑输某一个对手。


              Vectra 自己的直接对比页面强化了产品叙事，但必须谨慎处理。这些页面声称，Darktrace 的自学习异常方法会漂移并制造更多告警噪音；还声称相较 Darktrace，告警保真度高出 85%+，相较
              ExtraHop 和 Cisco 高出 80%。因为来源是 Vectra 自身营销，这些说法最好视为公司主张，而不是已验证的比较事实。它们仍有用，因为它们显示 Vectra
              认为自己赢在哪里：更紧的攻击者行为建模、更高的分析师信心，以及更少的告警过载。


              保留证据还有访问限制。抓取时，Darktrace 官方 NDR 页面和 ExtraHop 官方 Reveal(x) 页面都返回 404 错误，因此无法从这些 URL
              独立核查这些厂商当前的直接产品叙事。Nozomi 更容易定位：其自有平台页面显示，它专注工业和关键基础设施环境中的专用 OT 与 IoT 安全，因此是相邻专业同业，而不是 Vectra 在主流企业 IT NDR
              中的完整替代品。面对这个同业集合，Gartner 和 GigaOm 认可强化了 Vectra 的直接类别可信度，但没有消除它抵御捆绑能力更强对手的份额防守需求。
