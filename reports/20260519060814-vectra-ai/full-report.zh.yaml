    data:
      layers:
        - label: 遥测采集
          detail: 网络元数据、身份信号、云 VPC/VNet 流日志和合作伙伴遥测进入平台。
          note: Collection is metadata-first and hybrid by design.
        - label: 检测模型
          detail: 留存公开主张显示，Detect 提供 200+ 个行为模型，Fusion 提供 300+ 个云模型。
          note: Model-count claims are company-stated.
        - label: Attack Signal Intelligence
          detail: 跨攻击面评分为实体和事件排序，供分析师优先处理。
          note: ASI is the workflow glue across modules.
        - label: 调查和导出
          detail: Recall、Stream 和 API 层保留上下文，并把检测结果送入下游系统。
          note: This layer keeps Vectra embedded in existing SOC tooling.
        - label: 响应和服务
          detail: Respond 360、集成剧本和 MXDR 将优先级告警连接到行动。
          note: Response quality depends on partner integrations and operating maturity.
    notes: 该技术栈是面向公开信息的综合，不是内部架构图。
