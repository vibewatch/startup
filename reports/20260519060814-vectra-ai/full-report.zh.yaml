      - number: '7.5'
        title: 缓释因素与否决标准
        blocks:
          - type: paragraph
            body: >-
              Vectra AI 确实有真实缓释：隐私控制已有文档，传输机制已发布，发布和支持政策明确，具体 CVE 分诊可通过支持知识库文章看到，技术集成也证明平台能在更大的 SOC 工作流内部运行，而不是强迫客户撕掉重来。
              这些优势很重要，尤其对需要可信合规基础的欧盟和英国买方。 问题在于，投资逻辑仍取决于公开记录无法完全封口的变量。 最重要的打破投资逻辑信号是商业性的，而非纯技术性的：XDR 加速整合进 Microsoft 和
              CrowdStrike 套件、定价摩擦或 UI 投诉恶化并伤害扩张，或新领导层与 Netography 整合未能足够快地改善产品市场契合。
              财务模型风险仍有一部分不可观察，因为公开材料没有披露现金跑道、杠杆或投资者时间压力。
              因此，正确的尽调姿态是：只有在主动监测续约、竞争替代、事件姿态、高管留任，以及任何会实质改变剩余敞口的融资或法律进展更新时，才把 Vectra 视为可投资。
