  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管 / 法律风险
        blocks:
          - type: paragraph
            body: >-
              对一家私营网络安全公司而言，Vectra AI 的监管和法律暴露面异常宽，因为其产品会检查企业网络、身份、SaaS 和云遥测，其中可能包含 IP 地址、DNS 内容、HTTP 头、Active Directory
              信息、URL 和文件名等个人数据。 官方隐私和产品数据表材料显示，Vectra 已搭建基础隐私设施，包括 GDPR 合法依据表述、UK GDPR 覆盖、CCPA/CPRA 定位、Data Processing
              Agreement、EU Standard Contractual Clauses 和 UK IDTA。 这是实质缓释，不是占位文字。风险在于，支撑高保真检测的同一份数据丰富度，也会在 NIS2、FTC AI
              问责、CISA AI 数据保护指南以及 UK ICO 不断演进的 ADM 制度收紧时，扩大传输、留存和自动化决策审查敞口。 诉讼风险活跃但有边界，并非灾难性：Stern v. Vectra AI 和
              Conexus LLC v. Vectra AI 看起来都已在 2026 年 3 月前结案，但已审阅公开证据没有披露底层起诉细节、驳回理由或和解条款。
              因此，剩余敞口更多不在已知责任，而在私下法律结果和未来隐私执法带来的隐藏尾部风险。
