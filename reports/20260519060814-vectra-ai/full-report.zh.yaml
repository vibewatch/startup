      - number: '8.3'
        title: 可比公司分析
        blocks:
          - type: paragraph
            body: >-
              Vectra 的公开估值基准有参考价值，但天然不完美，因为最干净的直接同行要么仍是私营公司，要么已经被收购。 ExtraHop 是最清晰的 NDR 交易先例：约 $900 million 的出售价格、估计
              $100-130 million 的 ARR 基础，意味着约 7-9x ARR。 Darktrace 2024 年被 Thoma Bravo 私有化，隐含类似的 8-9x ARR 区间；但 Darktrace 比
              Vectra 更宽，因为它覆盖更多模态且规模大得多。 Nozomi Networks 基于估计数据，提供了一个专业基础设施安全方向、约 8-9x ARR 的有用参照；Cisco 和 CrowdStrike
              等集成平台行，则更适合作为定性压力基准，而不是独立可比公司。 对照这组标尺，Vectra 在 2021 年 Series F 时显得昂贵，当时分析师估计隐含约 15-24x ARR；但如果业务今天确实约为
              $120 million ARR，过时的 $1.2 billion 估值对应约 10x ARR，看起来更合理。 问题是当前价格未知，因此可比分析给出的是区间，不是可投资的清算价格。 Tracxn
              的公开档案更多是警示，而非澄清：其列出的创立和融资轮历史与官方来源冲突，进一步说明私营公司数据库可作方向性输入，但不是权威估值记录。
