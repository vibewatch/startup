      - number: '8.4'
        title: 情景分析与回报模型
        blocks:
          - type: paragraph
            body: >-
              Vectra 的情景模型应被视为有纪律的区间练习，而不是建立在已验证财务报表上的预测。 在乐观情景中，公司利用 Gartner 和 GigaOm 背书、ITDR 市场增长以及 Netography
              带来的云扩张，到 2027 年把 ARR 推高到大约 $150 million 以上，从而支撑战略溢价和更接近 $2.4-3.0 billion 的估值。 在基准情景中，增长仍为正但更温和，NDR 逆风部分抵消
              ITDR 收益，结果落在 $1.5-2.0 billion 左右，对应 12-14x 退出倍数。 在悲观情景中，平台替代和定价压力把 ARR 封顶在接近当前估计水平，并把倍数压缩到 7-9x 区间，只产生
              $0.7-1.0 billion 的价值。 加权后的结论是，上行空间存在，但大部分方差来自少数缺失变量：实际 ARR、净留存、产品组合演进，以及云 / 身份扩张是否足够强，能否抵消独立 NDR 的品类压缩。
