      - number: '2.2'
        title: 市场规模：TAM、SAM 和 SOM
        blocks:
          - type: paragraph
            body: >
              公开来源中最干净的已发布规模锚点，是托管检测与响应市场。MarketsandMarkets 将 2026 年市场规模定为 $6.28 billion，并预计到 2031 年增至 $19.01
              billion，CAGR 为 24.8%。这个数字有方向性帮助，因为它捕捉了外包和平台主导检测的更广支出环境，但如果不调整，就不能直接当作 Vectra AI 的 TAM。Vectra 卖的不是通用 MDR
              服务；它卖的是 NDR、ITDR、云网络可见性和 AI 主导分诊的混合体，企业团队可以直接使用，也可以通过伙伴间接消费。Omdia 的 2026 年 NDR 覆盖意味着，可服务市场小于总体
              MDR，但在大型混合云企业中仍有意义，尤其是买方需要比捆绑式 XDR 更深的网络可见性时。

              因此，得到的 SAM 和 SOM 是受证据约束的估算，不是干净的出版商数字。本章把 MDR 作为外层镜头，再收窄到估计 $1.8-$2.5 billion 的可服务细分市场：企业混合云 NDR 加 ITDR
              用例，其中身份蔓延、东西向流量、SaaS 活动和 OT/ICS 遥测都会抬高专用信号层的价值。可访问的 ResearchAndMarkets ITDR 摘要确认 ITDR
              是一个真实且分层的类别，但公开摘要没有披露头部美元规模，无法做更紧的自下而上测算。FM002 用区间而不是虚假的单点估计保留这种不确定性。因此，核心尽调任务不是证明市场足够大，而是验证随着 XDR
              捆绑更激进，独立专业厂商还能争取多少市场。
