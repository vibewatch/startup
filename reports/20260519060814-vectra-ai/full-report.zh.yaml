        - id: d12
          label: 创始人与高管团队
      edges:
        - from: d1
          to: d2
          label: 核心产品价值依赖敏感遥测摄取
        - from: d1
          to: d3
          label: 市场准入依赖隐私与数据传输控制
        - from: d1
          to: d4
          label: 支持能力依赖发布节奏
