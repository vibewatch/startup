  - id: FR003
    title: 依赖关系图
    type: dag
    layout: wide
    summary: Vectra 平台依赖官方隐私控制、合作伙伴工作流、公开开发者工具，以及专门的 OT / 云扩张路径；最敏感的外部节点是 CrowdStrike、Microsoft Sentinel、Nozomi 和更广的连接器生态。
    data:
      nodes:
        - id: d1
          label: Vectra AI 平台
        - id: d2
          label: 客户遥测与身份数据
        - id: d3
