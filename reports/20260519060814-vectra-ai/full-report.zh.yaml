      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >
              支撑 Vectra AI 需求侧的最强论点，是威胁环境正在网络与身份可见性最关键的位置恶化。WEF 称，87% 的受访者认为与 AI 有关的漏洞是 2025 年增长最快的网络风险；主动评估 AI
              工具安全的组织占比一年内几乎翻倍，从 37% 升至 64%。IBM 的 2026 年威胁研究又增加两个增长向量：供应链事件比五年前高出四倍，面向公网应用的利用同比上升
              44%。这些信号合在一起，支持更主动、遥测更丰富的安全架构，也给能够跨云、网络和身份层优先处理高置信度检测的厂商留出空间。FTC、ICO 和 CISA 的监管 AI
              治理进一步强化需求，因为监控和问责正从可选最佳实践变成明确期待。

              约束同样重要，而且更偏公司本身。Omdia 最不利的一点是，XDR 整合已经让 2022 至 2025 年独立 NDR
              续约流失率上升。这很关键，因为大型平台厂商可以把网络可见性变成更大合同续约中的“够用”勾选项，尤其当买方已经因重复的身份和访问工具感到不满。预算压力因此两头作用：它提高了对更好检测结果的需求，也奖励能把多项控制整合进一个平台的厂商。再叠加技能短缺、集成工作，以及既有
              Microsoft 或 CrowdStrike 部署带来的切换成本，市场就呈现出宏观增长强、专业厂商续约风险真实存在的格局。TM004 把这些驱动与约束整理为承销 Vectra 未来市场份额时的关键尽调议程。
