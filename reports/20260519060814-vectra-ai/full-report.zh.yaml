  - id: TM001
    title: 市场定义表
    columns:
      - 细分 / 类别
      - 纳入支出
      - 排除支出
      - 买方 / 付款方
      - 契合度
    rows:
      - - 网络检测与响应（NDR）
        - 东西向流量分析、数据包或流量遥测、加密流量分析、威胁狩猎，以及与网络信号绑定的响应工作流。
        - 纯 EDR 代理授权、SIEM 日志存储、防火墙硬件更新，以及没有网络检测逻辑的通用监控支出。
        - 买方：SecOps 负责人或检测工程负责人；付款方：CISO 或安全平台预算负责人。
        - Vectra AI 核心品类；需要深度网络可见性的场景最契合。
      - - 身份威胁检测与响应（ITDR）
        - 覆盖 Active Directory、Entra、SaaS 身份、会话滥用和身份控制平面异常的检测与响应。
        - 不含运行时检测与响应的 IAM 治理套件、PAM、MFA 和身份生命周期管理。
        - 买方：身份安全负责人或 SOC 架构师；付款方：CISO、CIO 或共享身份安全预算。
        - 战略相邻品类，把 Vectra 从传统 NDR 往外扩。
      - - MDR 叠加层
        - 由 NDR、ITDR 和云遥测驱动的托管监控、调查和响应服务。
        - 通用 MSSP 日志监控、一次性咨询，或没有差异化检测层的人力外包。
        - 买方：外包 SOC 负责人、MSSP 运营方或企业 CISO；付款方：安全运营或托管服务预算。
        - 内部分析师产能吃紧时，渠道路径可加速采用。
      - - AI-SOC 叠加层
        - 叠加在网络和身份检测之上的 AI 驱动告警分诊、信号优先级排序和自动响应。
        - 没有自有检测的通用 copilot、工作流聊天机器人，或没有威胁内容的自动化工具。
        - 买方：SOC 转型负责人；付款方：CISO、安全平台负责人或运营效率项目。
        - 既是增长向量，也是相对更广义 XDR 套件的竞争压力点。
      - - OT / ICS 安全
        - 针对工业流量、未管资产、承包商访问和 IT/OT 融合工作流的被动监控。
        - 纯端点安全系统、只有资产清单，或没有连续网络遥测的 OT 咨询服务。
        - 买方：OT 安全经理或工厂网络负责人；付款方：CISO、CIO 或工业运营预算。
        - 重要利基市场，独立 NDR 在其中仍有差异化价值。
    notes: 边界定义有意保持部分覆盖，因为公开品类标签彼此重叠。纳入支出围绕最贴近 Vectra AI 的、由遥测牵引的检测与响应工作流；排除不依赖网络或身份检测的纯 SIEM、纯 EDR 和独立 IAM 治理类别。
    enumerationScope:
      coverage: partial
      basis: >-
        Market segment boundaries derived from Verizon DBIR 2026, Omdia NDR 2026, and MarketsandMarkets MDR 2026 analyst
        reports; excludes pure-play endpoint and SIEM categories without network telemetry components.
    claimRefs:
