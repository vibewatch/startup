      - number: '3.4'
        title: 护城河韧性、切换成本与衰减风险
        blocks:
          - type: paragraph
            body: >
              保留证据显示，Vectra 最耐久的竞争资产不是简单份额指标，而是让成熟 SOC 愿意继续保留平台的产品和可信度信号：39 项 AI 专利、MITRE D3FEND 引用的 12 项专利、声明中的 2,000+
              家混合与多云组织装机基础，以及一个覆盖网络、云、身份、SaaS 邻近工作流、调查、响应和态势改善的平台足迹。ChannelE2E 的收购报道也重要，因为它把 Netography 描述为云原生网络安全扩张，帮助
              Vectra 论证自己是在替换多项工具，而不是再增加一个点产品。


              这些强项确实形成切换成本。一旦 Vectra 通过与 CrowdStrike 和 Microsoft 的集成接入身份、云、终端和 SIEM
              工作流，买方想彻底替换它，就必须先拆掉嵌入式检测、调查、仪表板和响应动作。但同一架构也抬高了多归属风险。客户可以保留 Vectra 的差异化网络信号，同时把主控制台、采购关系和事件工作流标准化到更广平台上。


              不利证据有分量。PeerSpot 显示，Vectra 自身心智份额从 16.1% 降至 11.2%；评论者称定价可能复杂，常与基于 IP 的许可和附加功能绑定。同一批评论也称 Vectra 可能比
              Darktrace 更便宜，这说明价格不是全部问题。更重要的风险是整合环境下的耐久性：如果 Microsoft、CrowdStrike 或其他平台在网络与身份分析上做到“够用”，Vectra
              的护城河可能从不可或缺的平台收窄为高价值附加项。因此，本章核心尽调问题不是 Vectra 今天是否强，而是它的信号优势是否足够强，能抵住自己变成次级遥测源。
