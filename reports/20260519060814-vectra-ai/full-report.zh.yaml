  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与纳入支出
        blocks:
          - type: paragraph
            body: >
              Vectra AI 具有经济意义的市场不是“全部网络安全”，也不是 SIEM、XDR、IAM 或终端工具的完整支出池。实际边界从网络检测与响应开始：软件和遥测管线检查东西向流量、云网络流、SaaS
              身份活动，以及初始攻陷后的攻击者移动。边界进一步扩展到身份威胁检测与响应，因为 Vectra
              的平台和竞争叙事越来越围绕身份层检测与自动化响应动作搭建，而不只是数据包或流量分析。买方或渠道伙伴用同一套遥测来做外包监控、分诊和事件响应，而不是完整配备内部 SOC 时，托管检测覆盖层也纳入边界。

              排除的支出与纳入支出同样重要。纯 EDR 许可证、通用 SIEM 存储和搜索、独立 IAM 治理、PAM 以及广义咨询会占用网络安全预算，但除非它们摄取或丰富网络与身份检测，否则无法干净映射到 Vectra
              的价值主张。现状替代品包括人工 SOC 运营、仅靠 SIEM 的检测，以及大型厂商的捆绑式 XDR 平台。Omdia 的 2026 年 NDR 分析解释了为什么这种区分重要：2022 至 2025 年，一些独立
              NDR 续约被平台型 XDR 取代；但同一报告也认为，当买方需要更深地看见非托管资产、东西向流量、SaaS 身份和 OT/ICS 环境，而这些区域仍被 EDR 中心平台覆盖薄弱时，他们仍会保留独立
              NDR。TM001 定义支出边界，FM001 则显示 Vectra 的真实机会是更广义 AI 增强安全运营市场中的受限切片，而不是整个安全技术栈。
