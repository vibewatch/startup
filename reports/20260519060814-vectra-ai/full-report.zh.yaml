chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、使命与运营模式
        blocks:
          - type: paragraph
            body: >
              Vectra AI, Inc. 是一家注册于 Delaware 的网络安全公司，总部位于 550 S. Winchester Boulevard, Suite 200, San Jose, California
              95128。Hitesh Sheth 于 2011 年创立公司，核心判断很明确：人工智能和机器学习能够可靠地区分混合网络中的真实攻击者行为与合法活动，从而消除告警洪水；这种告警洪水已经让人工 SOC
              运营难以为继。用一句话概括，产品是一个 AI 原生平台，服务网络检测与响应、身份威胁检测与响应，以及混合 SOC 信号管理。


              当前平台架构整合了五个覆盖支柱：本地与多云网络可观测性（包括 2025 年 10 月收购 Netography Fusion 后改名的 Vectra Fusion）、覆盖 Microsoft Entra /
              Active Directory 与 SaaS 身份的身份威胁检测与响应、借助合作伙伴 EDR 数据流接入的终端集成、AI 驱动的信号优先级排序（品牌名为 Attack Signal
              Intelligence），以及横跨身份、设备和网络流量的 360 度自动化响应。公司称其覆盖超过 90% 的 MITRE ATT&CK 技术，持有 39 项 AI 威胁检测专利，并且在 MITRE D3FEND
              中的厂商引用数量超过任何其他 NDR 厂商。


              Vectra AI 的商业模式是经常性 SaaS 订阅，交付方式可以是云托管服务，也可以是带本地传感器的混合部署。公司还通过专业服务组织运营一层托管检测与响应（MDR）。GTM
              以渠道为主：官网关于页面显示，截至当前有 468 家交易伙伴提供销售分销，并与 CrowdStrike、Microsoft Sentinel、Nozomi Networks 等建立战略技术联盟。截至 2026 年
              5 月，公司称 580+ 名员工在 113 个国家开展业务。
