      - number: '4.3'
        title: 资本充足性、Netography 收购与融资依赖
        blocks:
          - type: paragraph
            body: >-
              判断资本充足性，关键公开锚点仍是 2021 年 4 月 Series F。Vectra 和 Blackstone 官方发布称，该轮带来 $130 million 融资，将累计融资提高到超过 $350
              million，并以投后 $1.2 billion 估值定价公司。Blackstone
              还表示，资金将用于平台创新、研发，以及进入新市场和新地区。这是保留公开记录中最后一个清晰披露的融资事件。公司概览包含完整轮次时间线；本章关注这些融资事实对今天资产负债表风险的含义，而不是复述全部历史。


              两个后续进展影响资本叙事。第一，Vectra 自 2021 年后没有公开披露新融资轮，因此投资人无法从公开材料判断当前流动性主要由 Series F
              资产负债表、内生现金流，还是未宣布的债务或二级交易支撑。第二，2025 年 10 月 Netography 收购带来清晰但未量化的现金使用信号。官方和独立报道都同意，收购把 Vectra
              扩展到云原生网络可观测性，并强化多云与 MSSP 用例，但交易对价没有披露。这让交易在战略上积极、在财务上不透明：它很可能消耗了资本，但规模未知。


              剩余最大盲点是账上现金、现金消耗、跑道、债务和融资触发点。保留公开来源没有披露月度现金消耗、债务余额、项目融资义务、契约约束或下一轮阈值。Conexus 申报增加了一个不利法律数据点，因为它表明 2025
              年存在商业或 IP 争议，但取回的 PDF 不够可读，无法量化风险敞口。因此，公开记录支持对过往融资和资本战略使用的信心，但不能支持对当前流动性充足性的信心。
