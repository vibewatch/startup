      - number: '1.4'
        title: 规模、覆盖与运营里程碑
        blocks:
          - type: paragraph
            body: >
              自 2011 年创立以来，Vectra AI 走过三个可识别阶段：初始研发与产品市场契合阶段（2011–2016）、规模扩张与国际化阶段（2017–2020），以及平台融合与市场认可阶段（2021 至今）。公司
              2018 年开设首个 EMEA 办公室，2019 年开设首个 APJ 办公室，并在 2025 年 7 月新增印度 Bangalore 办公室，扩展 APJ 工程、数据科学和营销能力。


              2025 年 6 月，Vectra AI 在首个 Gartner 网络检测与响应魔力象限中成为唯一领导者，并在执行能力上位置最高、在愿景完整性上走得最远。同月，GigaOm 在其 NDR Radar 和 ITDR
              Radar 中同时将 Vectra AI 评为领导者和表现优于同业者，使 Vectra AI 成为两份报告中唯一在两个类别都获得最高认可的厂商。2025 年 8 月，公司首次进入 Inc. 5000
              美国增长最快私营公司榜单。


              2025 年 10 月收购 Netography 后，Vectra 增加了云原生、无代理网络可观测性。Netography Fusion 改名为 Vectra Fusion，并整合进 Vectra AI
              Platform，使平台能够在 AWS、Azure、GCP、SaaS 和本地环境中进行软件定义流量分析，不需要代理或硬件分流器。Netography 创始人 Martin Roesch（Snort IDS
              创建者、Sourcefire 创始人）加入 Vectra AI，担任云业务负责人。收购条款未公开披露。


              官网关于页面披露的客户与伙伴覆盖：2,000+ 家企业客户、95%+ 客户留存率、468 家交易伙伴、业务遍及 113 个国家。G2 和 PeerSpot 的安全分析师评论将 Vectra AI 记录为市场认可的
              NDR 厂商，检测保真度评分强、集成覆盖广；不过部分评论也指出，定价复杂性和集成工作量仍需改善。
