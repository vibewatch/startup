      - number: '6.2'
        title: 采用轨迹与公开规模信号
        blocks:
          - type: paragraph
            body: >
              最清晰的总体采用信号，是 Vectra 自称全球服务超过 2,000 家组织，再叠加公开客户故事库中十余个具名部署案例。 这足以证明 Vectra 已经越过试点商业化阶段，但披露水平仍弱于公开 SaaS
              公司，因为公司没有发布活跃账户趋势、席位数、已部署传感器数，或任何类似 MAU/DAU 的指标。 因此，现有客户证据足够展示采用广度，却不足以建模整个安装基盘的使用强度或部署深度。


              次级规模指标提供的是背景，不是直接客户分母。GetLatka 估计 2025 年收入约 $120 million；Blackstone 2021 年以 $1.2 billion 估值投资 $130
              million，则标志着一次重要商业化里程碑，并验证了企业对平台的兴趣。 Omdia 2026 年 5 月市场简报也强化了为什么客户证明现在重要：NDR
              正经历整合和平台捆绑，无法指向可信生产结果的厂商，可能在企业候选名单中被边缘化。 Vectra 的具名案例和分析师认可节奏显示其市场相关性仍在，但缺失逐年客户数量轨迹，仍是一个真实尽调缺口。
