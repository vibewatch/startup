      - number: '5.2'
        title: 模块图
        blocks:
          - type: paragraph
            body: >
              公开材料显示，Vectra 的产品组合包含七个具名产品面，并且交叉销售逻辑连贯。 Detect 仍是旗舰网络检测与响应模块；Cognito 负责身份威胁检测与响应；Recall
              延长取证元数据留存，支撑更长周期的调查；Stream 把检测结果和增强元数据导入下游 SIEM 或数据湖工作流；Respond 360 覆盖人工和自动化响应编排；Fusion 在收购 Netography
              后补上云原生网络可观测性；MXDR 则把平台包进托管服务运营模式，服务那些希望 Vectra 分析师参与闭环的客户。 这不是一串 SKU
              清单。每个模块对应一个独立运营任务，但共同销售动作是让客户看到一套分析师工作流，由 Attack Signal Intelligence 和共享集成层串起来。


              因此，买方已经运行混合环境、又希望用一个系统关联网络、身份和云检测时，这张模块图最有说服力。关键尽调问题在于封装深度：Fusion 和 Respond 360 是否已经像 Detect 与 Cognito
              一样运营成熟、连接紧密。
