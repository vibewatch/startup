      - number: '5.3'
        title: 架构
        blocks:
          - type: paragraph
            body: >
              Vectra 的公开架构更像一套遥测摄取与分析栈，而不是偏端点代理的平台。 在采集层，公司强调网络元数据、身份信号、合作伙伴 EDR 上下文，以及云 VPC 或 VNet 流日志。 Fusion
              尤其关键，因为它把可见性延伸到云原生环境，而且不依赖代理；所用的软件定义流量记录和可观测性集成来自 Netography。 在采集之上，Vectra 称 Detect 提供 200 多个行为模型，Fusion
              提供 300 多个云模型，Attack Signal Intelligence 则作为归一化和优先级排序层，跨产品面按紧急程度给实体排序。 调查和工作流服务架在模型层之上：Recall
              存储元数据，支持回溯式威胁狩猎；Stream 将事件路由进 SIEM 系统；已有文档的 API 和公开 GitHub 工具说明，Vectra 的自动化接口是真实存在的，而不是封闭设备模式。


              取舍在于依赖集中。产品质量取决于外部身份提供商、云日志可用性、合作伙伴 API，以及收购而来的 Fusion 组件能否都干净地流入 ASI。因此，集成深度和遥测保真度就是核心技术尽调项。
