  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              Vectra AI 有足够战略证明，仍可纳入可投资观察范围，但财务披露不足，无法支撑高确信度入场决策。 正向投资逻辑很直接：Vectra 仍像是少数在 NDR 和 ITDR
              两个方向都具备真正品类领导力的独立厂商之一，服务超过 2,000 家客户，声称拥有 39 项 AI 专利，并通过收购 Netography 扩大了云可观测性产品面。
              这些事实重要，因为公司不需要证明自己属于这个市场；它需要证明自己能把这个位置转化为持久增长和有吸引力的退出倍数。 反向逻辑同样有力。唯一确认估值是 2021 年 4 月 $1.2 billion
              的投后估值，没有公开 ARR 或留存披露；Omdia 认为，平台主导的 XDR 整合已经压缩独立 NDR 需求。 综合来看，正确建议是观察：Vectra
              具备战略相关性，也可能稀缺，但当前公开记录无法支持在任何具体价格上给出投资判断。
