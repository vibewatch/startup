      - number: '8.2'
        title: 市场规模与机会
        blocks:
          - type: paragraph
            body: >-
              Vectra 的可触达机会位于 NDR、ITDR 和 MDR 的交汇处，而不是单一清晰品类之内，因此市场背景既有吸引力，也结构性混乱。 正面来看，Research and Markets 预计 ITDR 将从
              2024 年 $2.97 billion 增至 2030 年 $24.6 billion；MarketsAndMarkets 预计 MDR 将从 2026 年 $4.6 billion 扩至 2031 年
              $19.0 billion。 Microsoft 披露每天大约 600 million 次身份攻击，进一步增加了紧迫感，也验证了以身份为中心的检测具备战略必要性。 复杂之处在 NDR 本身：Omdia 2026
              年研究称，独立 NDR 市场受到 Microsoft、CrowdStrike 和 Palo Alto 推动的 XDR 整合压力；与此同时，受监管行业和零信任要求仍保留了对深度行为分析的需求。 这意味着
              Vectra 的机会不是简单搭上 NDR 浪潮，而是利用其分析师排名靠前的 NDR 位置，在平台捆绑仍留缺口的身份、云和托管工作流中获胜。
            claimRefs:
