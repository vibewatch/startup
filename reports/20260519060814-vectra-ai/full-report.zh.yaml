      - number: '1.2'
        title: 创始人、管理层与治理
        blocks:
          - type: paragraph
            body: >
              Hitesh Sheth 是 Vectra AI 的创始人、总裁兼 CEO。他曾在 Aruba Networks（COO）、Juniper Networks（交换业务 EVP/GM、服务层技术 / 安全
              SVP）和 Cisco（资深交换业务高管）任职，拥有二十多年企业网络与安全领导经验。Sheth 自 2011 年创立公司以来持续任职，因此既是任期最长的高管，也是最大的关键人依赖。


              当前高管团队（截至 2026 年 5 月）板凳很深。Oliver Tavakoli（CTO，在 Vectra AI 任职 10+ 年）制定技术战略；此前 Juniper 收购 Funk Software
              后，他曾担任 Juniper Networks 安全业务 CTO。Snehal Patel（CPO）来自 Google（GKE 产品负责人）和 Cisco（安全平台 VP）；Don Dixon（CFO）曾任
              DataStax（2025 年被 IBM 收购）、Skyhigh Networks（被 McAfee 收购）和 Apigee（Google IPO 收购）的 CFO。Greg
              Murphy（CBO）是接近联合创始人级别的运营型高管，此前担任 Ordr CEO，并在 Aruba 以 $3 billion 被收购后出任 HPE Aruba 业务运营 VP。Martin
              Roesch（云业务负责人）是 Snort IDS 原作者、Sourcefire 创始人（2013 年以 $2.7 billion 出售给 Cisco），并在 2025 年 10 月通过 Netography
              收购加入 Vectra AI。


              2025 年底和 2026 年初的两项关键 GTM 招聘，显示公司有意扩大分销规模。Derek Phillips 于 2025 年 12 月获任 CRO；他此前担任 Claroty CRO，更早担任
              Kudelski Security 副 CEO 兼 CRO，并在 IBM 担任高级销售领导职务。Chad Reese 于 2026 年 3 月加入，担任 SVP Global Channel Chief，拥有
              25+ 年渠道经验，负责在解决方案提供商、MSSP、系统集成商、超大规模云厂商和分销商之间扩展 468 家伙伴生态。Tommy Jenkins（CMO，来自 Veeam）和 Paul Bradley
              Shinn（CLO，来自 CrowdStrike 与 Gigamon）补齐高级管理层。


              治理：董事会包括 Charlie Giancarlo（Pure Storage CEO；自 2014 年 4 月起担任 Vectra 董事）、Bruce Armstrong（Khosla
              Ventures，投资人代表）、Brian Dunlap（Blackstone Growth，投资人代表）和 Jim Messina（Messina Group；战略传播）。Vectra AI 是
              Delaware 私营公司，没有 SEC 申报文件。董事会构成有一部分可由官方领导页确认；完整独立董事名单没有公开披露。
