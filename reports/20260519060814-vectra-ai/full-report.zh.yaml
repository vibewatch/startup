      - number: '2.3'
        title: 买方、用户与采用路径
        blocks:
          - type: paragraph
            body: >
              Vectra AI 的主要买方，是运行混合环境的企业安全运营组织；这些环境的网络复杂度、云蔓延和身份暴露已经足以让通用日志关联或仅终端工具留下明显缺口。实际画像包括 Global 2000
              企业、金融服务、医疗、政府、国防邻近运营方，以及其他拥有成熟 SOC 和高入侵成本的受监管组织。日常用户通常是 SOC 分析师、威胁猎手、事件响应人员或检测工程师；付款决策人更常是 CISO、CIO 或
              CTO；预算所有者可能落在安全运营、平台工程、身份安全或综合网络风险办公室，取决于部署理由是检测效果、身份风险降低，还是工具整合。

              次级买方同样重要，因为他们改变 GTM 算法。MSSP 和 MDR 提供商可以把 Vectra 当作遥测层或服务加速器购买，尤其在分析师稀缺和告警疲劳让生产率比原始威胁量更能驱动采购时。OT/ICS
              运营方规模较小，但战略意义高，因为非托管资产和东西向流量削弱了终端主导替代方案。Microsoft 在 RSAC 2026 的身份安全研究是采用叙事的核心：32% 的组织称访问管理工具重复，40%
              称身份厂商太多，这意味着市场确实想要更少控制台和更紧的身份控制平面。因此，采用触发点集中在身份蔓延、事件响应疲劳、关键基础设施强制要求、AI 风险治理，以及暴露现有 XDR 或 SIEM
              技术栈盲点的入侵事件。TM003 映射买方、用户和付款方关系，FM003 把关系转化为各细分市场的购买路径，FM004 显示采购摩擦通常在哪里拖慢转化。
