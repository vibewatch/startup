      - number: '7.4'
        title: 人员 / 执行风险
        blocks:
          - type: paragraph
            body: >-
              Vectra AI 的人员和执行风险集中在两处：创始人依赖和同步发生的领导层变化。 Hitesh Sheth 任职十多年后仍是创始人兼
              CEO，这保留了战略连续性，但也把客户信任、品类叙事和内部决策权集中在一个人身上。 与此同时，领导层页面显示，公司有一批较新的高管，包括 CFO Don Dixon、CPO Snehal Patel、CRO
              Derek Phillips、通过 Netography 加入并担任 Head of Cloud 的 Martin Roesch，以及其他近期组建的职能负责人。
              原则上，这种厚度是正面的；但在平台扩张阶段同时磨合多位高级运营者，会在定价、封装、渠道策略、集成排序和路线图沟通上带来协调风险。 Netography
              整合又增加一层执行工作，因为它带来新的云可观测性能力和一位知名技术领导者，同时也制造迁移、架构和团队对齐任务，而外部很难判断这些任务推进得如何。
              公开资料也没有披露烧钱速度、现金跑道或资本结构，因此投资者无法清晰评估，如果集成或 go-to-market 调整耗时长于计划，公司能吸收多少执行缓冲。
