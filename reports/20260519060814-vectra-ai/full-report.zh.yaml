  - id: FV001
    title: 建议逻辑流程
    type: flow
    layout: wide
    summary: 支撑当前对 Vectra AI 给出「观察」建议的逻辑链。
    data:
      nodes:
        - id: n1
          label: 分析师排名领先
          detail: Gartner NDR 领导者，加上 GigaOm 在 NDR / ITDR 双线领导地位
        - id: n2
          label: 装机基础
          detail: 2,000+ 客户和 39 项 AI 专利显示确有战略相关性
        - id: n3
          label: 市场顺风
          detail: 即便 NDR 正在整合，ITDR 和 MDR 仍快速增长
        - id: n4
          label: 云扩张
          detail: Netography 带来云原生可观测性和 Martin Roesch 的可信度
        - id: n5
          label: 财务不透明
          detail: ARR、留存、利润率或当前估值均未公开披露
        - id: n6
          label: 结构性风险
          detail: Omdia 指出 XDR 整合是独立 NDR 的核心威胁
        - id: n7
          label: 决策
          detail: 在当前 ARR、股权结构表和整合证明得到验证前保持观察
    approximationNotes: 该流程是概念性的，不是概率模型。它显示哪些证据块支撑建议，以及哪些缺失事实阻止作出投资判断。
    claimRefs:
      - CV004
      - CV014
      - CV015
      - CV018
      - CV029
      - CV035
  - id: FV002
    title: 估值敏感性图
    type: bar
    layout: wide
    summary: 所选 ARR 倍数基准显示，Vectra 相对直接和相邻参照标的处在什么位置。
    data:
      items:
        - label: ExtraHop
          value: 8
          detail: 2021 年出售时 ~7-9x ARR 的近似中点
        - label: Darktrace
          value: 8.5
          detail: 2024 年私有化交易中 ~8-9x ARR 的近似中点
        - label: Nozomi Networks
          value: 8.5
          detail: 专门基础设施安全参照的近似值
        - label: Vectra 2021 年融资交割
          value: 19
          detail: 使用分析师估计的 Series F 轮 ARR，~15-24x ARR 的近似中点
        - label: Vectra 基于 $120M ARR 的过时估值标记
          value: 10
          detail: 若将最后披露的 $1.2B 估值标记与 2025 年估计 ARR 对比，得到的近似隐含倍数
    approximationNotes: 柱形采用中点估计以便比较，不应视为精确交易倍数。由于管理层未公开披露当前经常性收入，Vectra 数值对 ARR 假设尤其敏感。
    claimRefs:
      - CV006
      - CV007
      - CV008
      - CV021
      - CV022
      - CV023
      - CV033
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 基于公开数据情景假设，对 Vectra AI 给出乐观、基准、悲观估值区间。
    data:
      items:
        - label: 悲观
          low: 0.7
          mid: 0.85
          high: 1
          detail: 独立 NDR 受压缩，留存偏弱
        - label: 基准
          low: 1.5
          mid: 1.75
          high: 2
          detail: 执行中等，ITDR 和云业务提供部分抵消
        - label: 乐观
          low: 2.4
          mid: 2.7
          high: 3
          detail: 云 / 身份扩张成功，并获得战略溢价
    approximationNotes: 这些区间代表股权价值结果，不是有保障的进入或退出价格。公开记录未披露 ARR、留存，也未披露缩窄模型所需的资本结构，因此区间很宽。
    claimRefs:
      - CV021
      - CV022
      - CV023
      - CV042
      - CV043
  - id: FV004
    title: 投资 KPI 记分卡
    type: kpi
    layout: wide
    summary: 当前章节最关键可投资性维度的高层级记分卡。
    data:
      items:
        - label: 估计 ARR 规模
          value: 120
          max: 200
          note: 仅作方向性参考；基于 GetLatka 估计，而非公司披露
        - label: 客户基础
          value: 2000
          max: 2500
          note: 装机基础证据足以支撑战略相关性
        - label: AI 专利
          value: 39
          max: 50
          note: 专利数量支撑技术护城河叙事，但不能证明变现质量
        - label: 过时估值标记倍数
          value: 10
          max: 25
          note: 约 $1.2B 估值除以 $120M 估计 ARR
        - label: 分析师排名强度
          value: 5
          max: 5
          note: Gartner 领导者，加上 GigaOm 双线领导者 / 优于同侪
        - label: 财务透明度
          value: 1
          max: 5
          note: 最弱 KPI，因为 ARR、留存和股权结构表数据均未公开披露
    approximationNotes: KPI 数值混合了原始计数和判断性评分，因此用于投资委员会确定优先级，而不是做时间序列报告。记分卡有意保持不对称：战略证明强于财务证明。
    claimRefs:
      - CV005
      - CV014
      - CV016
      - CV017
      - CV041
