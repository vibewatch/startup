      - number: '6.3'
        title: 具名客户证明与证据质量
        blocks:
          - type: paragraph
            body: >
              Vectra 最强的客户证据，是一组带量化结果的具名生产案例研究。 Blackstone 称安全告警减少 90%；Globe Telecom 称一年内噪声减少 99%、升级减少 96%、事件响应加快
              78%；Van Gogh Museum 称在 Azure 身份和数据中心覆盖范围内真阳性率达到 84%；Luxgen 称通过托管 MXDR 部署将升级减少 95.3%。 FICO
              的案例研究也有价值，因为它描述了结合 Fusion 的具体混合可见性部署，并包含 Shannon Ryan 的具名高管引述，比单纯 logo 陈列更有运营细节。


              顶层之下，证据质量并不均匀。Texas A&M University、American University、Nissho Electronics、Goodwood Estate 和 Maire
              都作为具名案例出现，但并非全部披露了量化的前后对比结果。 因此，本章可以有把握地说 Vectra 在多个行业有真实生产使用，但不能声称每个公开 logo 都证明了同等水平的可衡量 ROI。
              独立评论平台提供了一些外部佐证，说明产品确实在生产中使用，但那些惊人的结果指标本身，大多仍来自供应商，而不是客户在自有域名上独立验证。
