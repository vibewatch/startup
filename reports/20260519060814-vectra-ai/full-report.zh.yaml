  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户群分层与买方画像
        blocks:
          - type: paragraph
            body: >
              从公开客户足迹看，Vectra AI 更集中在企业和中高端市场安全团队，而不是小企业买方。 反复出现的买方是 CISO、安全副总裁或 SOC
              负责人，他们负责在混合环境中压降告警量；日常用户则是运行分诊和调查工作流的 SOC 分析师或事件响应人员。 公开案例研究显示，Vectra 已部署在金融服务（Blackstone、FICO）、电信（Globe
              Telecom）、制造（Luxgen）、高等教育（Texas A&M University 和 American University）、文化机构（Van Gogh
              Museum）以及工业或工程环境（Maire）。 这种广度重要，因为它说明 Vectra 可以卖进多个受监管和关键任务场景，而不是依赖单一用例小众市场。


              地域也明显多元。具名公开案例覆盖北美、菲律宾、日本、台湾、荷兰、英国和欧洲大陆；客户故事库显示，全球基础可能比具名集合本身更广。 Goodwood Estate 与 Gigamon 的故事说明，Vectra
              也能借助合作伙伴架构切入，而不只靠直接撕换交易。 官方 NIS2 和 GDPR 材料进一步表明，公司正在主动面向受监管的欧洲买方发声。 主要分层缺口不是类别，而是经济性：Vectra
              没有公开按行业、规模区间或地区拆分收入、ACV 或客户组合。
