      - number: '1.3'
        title: 融资历史与资本结构
        blocks:
          - type: paragraph
            body: >
              Vectra AI 披露过三轮股权融资，合计超过 $266 million，另有 2021 年 4 月 Series F 融资 $130 million，并重设估值地板。公司官方公告和 Blackstone
              自身新闻稿确认，Series F 由 Blackstone Growth（BXG）管理的基金领投，既有投资者参与，投后估值 $1.2 billion，使 Vectra 跻身独角兽。公告发布时，累计披露融资超过
              $350 million。


              GetLatka 和公开数据库记录显示，此前轮次包括：2018 年 $36 million Series D，以及 2019 年 $100 million Series E。Khosla Ventures
              通过董事 Bruce Armstrong 的公开董事角色，被确认是早期投资者。直到 2026 年 5 月报告生成日，没有可信的后续股权融资公告；TipRanks 和 GetLatka 都显示 Series F
              是最近一次披露融资。2021 年 4 月设定的 $1.2 billion 投后估值没有官方更新，也没有二级市场或 IPO 定价可用。


              GetLatka 在 2025 年 11 月数据更新中，引用公司报告或公司估算指标，估计 2025 年收入约 $120 million。该数字没有独立审计，应视为未经确认的估算；Vectra AI
              不公开披露收入。公开来源没有确认任何债务轮、信贷额度或二级交易。董事会 IPO 前构成（Pure Storage CEO、Blackstone Growth MD）符合后期私营增长公司的特征，但公司尚未宣布
              IPO 时间表。
