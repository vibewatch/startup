      - number: '5.6'
        title: 信任、安全、隐私与质量
        blocks:
          - type: paragraph
            body: >
              信任与控制证据喜忧参半：足以支撑严肃的企业评估，但若要承接关键任务部署，买方希望看到的材料还不完整。 正面来看，Vectra 称平台基于元数据和行为分析工作，而不是完整抓包，这降低了隐私和存储负担。
              官方材料还称其符合 GDPR、UK GDPR、CCPA 和 CPRA；支持指南称平台不受 CVE-2026-35386 影响。 Multi-SAML SSO 于 2026 年 3 月进入
              GA，也进一步改善了需要联邦认证企业的身份控制姿态。 公开缺口在认证和可靠性披露。


              在保留的资料集中，Vectra 没有公开披露 SOC 2 Type II 或 ISO 27001 认证，也没有给出公开的正常运行时间 SLA 或可用性目标。
              独立评论证据也不是一边倒的正面：客户反馈总体认可检测质量，但部分评论提到定价复杂、集成投入和运营开销。 对尽调而言，这意味着 Vectra
              已跨过隐私意识和基础安全叙事的门槛，但仍需要拿出面向客户的审计材料、SLA 承诺和实施负担证明。
