      - number: '4.4'
        title: 财务结论与尽调阻塞项
        blocks:
          - type: paragraph
            body: >-
              Vectra AI 的公开财务图景，作为商业故事可投，但作为承销模型并不完整。收入质量看起来好于单产品点解决方案，因为公司似乎结合了直接平台订阅、MDR 覆盖层、渠道转售和伙伴辅助采购；客户留存和 ROI
              故事也暗示，产品不是纯靠商品化价格卖出。即便如此，实际定价、收入结构、毛利率和 cohort 行为仍是私有信息。


              利润率路径合理，但尚未证明。软件占比高的平台应比硬件业务资本消耗更轻，但 MDR 人员配置、伙伴经济，以及持续 AI 和研发支出都可能实质影响贡献利润率。资本强度也仍不确定，因为 Netography
              收购条款未披露，公开现金或现金消耗数据缺失。决定性尽调包很直接：管理层报告的 ARR 或收入、SKU 与渠道组合、quote-to-cash
              数据摘录、毛利率桥、当前现金与现金消耗、债务时间表，以及董事会层面对下一次融资计划的判断。在这些材料可用之前，正确结论是商业动能积极，但财务不透明仍未解决。
