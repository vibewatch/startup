      - number: '5.4'
        title: 部署、集成与路线图
        blocks:
          - type: paragraph
            body: >
              部署看起来灵活，但集成负担不轻。官方材料显示，Vectra 连接客户既有的 SIEM、身份、EDR 和工单栈，而不是试图直接替换它们。 客户可以继续让 Microsoft
              Sentinel、Splunk、CrowdStrike、Entra ID、Okta 等系统参与闭环，由 Vectra 补上优先级排序和更高保真的检测，因此撕掉重来的风险较低。 2026 年 3
              月发布说明提供了有用证据，说明平台仍在交付有运营意义的功能：CrowdStrike EDR 集成进入 GA，Multi-SAML SSO 进入 GA，Investigate API v3.4 更新，检测内容扩展到
              Sliver C2 和 Hidden Tunnel 活动。 这些发布重要，是因为它们触及部署摩擦、管理员控制和上线后的检测质量，而不只是 UI 外观调整。


              与此同时，公开材料对可靠性的细节更薄。保留的公开资料中没有平台正常运行时间 SLA，没有详细状态指标；Netography 收购后，Fusion 数据如何与 Respond 360 统一，面向客户的细节也有限。
