  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义
        blocks:
          - type: paragraph
            body: >
              Vectra AI 的产品最好理解为面向混合安全团队的连续威胁检测与优先级排序工作流，而不是单一仪表板。工作流从网络元数据、身份遥测、云流日志和伙伴信号进入平台开始。Detect 和 Cognito
              会浮现横跨东西向网络移动和身份滥用的可疑行为；Fusion 把同一思路扩展到云原生流量，不要求客户在每个工作负载中部署代理。Attack Signal Intelligence
              随后把原始检测转化为以实体为中心的紧急度评分，让分析师处理更小、更高置信度的事件队列。Recall 保留调查面包屑，Stream 把数据转发进既有 SIEM 工作流，Respond 360 加 MXDR
              把高优先级发现转化为手动或自动动作。


              放到客户工作流里，Vectra 卖的是更早的信号降噪、更快的分诊，以及在网络、身份、云和响应运营之间更少的工具交接。这个定位很关键，因为平台价值取决于 Attack Signal Intelligence
              是否真的比点状 NDR 工具或通用 SIEM 关联层更能压缩分析师决策时间。
