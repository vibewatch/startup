    title: 投资逻辑破裂与否决触发因素表
    columns:
      - 触发因素
      - 可观察信号
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 经验证 ARR 显著低于 $100M，或净美元留存（NDR）低于 100%
        - 数据室或融资材料显示经常性收入质量偏弱
        - 即使还未打折，过期的 2021 年估值也缺乏支撑
        - 从观察转为放弃，直到出现新价格或扭转证据
      - - XDR 驱动替代的直接证据
        - 因 Microsoft / CrowdStrike / Palo Alto 捆绑造成的丢单、流失或价格让步
        - 证实 NDR 正被压缩成一个功能的反向逻辑
        - 下调基准情景倍数，并假设悲观情景概率大幅上升
      - - Netography 整合停滞
        - 云挂载没有实质进展、产品发布延误，或云业务高管流失
        - 移除最清晰的平台扩张催化剂
        - 下调乐观情景概率，并将云逻辑视为未证实
      - - 分析师排名恶化
        - 失去 Gartner 领导者地位或 GigaOm 双榜领导者地位
        - 削弱战略兴趣背后的溢价稀缺叙事
        - 重新评估 Vectra 是否仍应相对 ExtraHop 类先例享有溢价
      - - 隐性融资压力
        - 尽调后出现风险债、下轮融资或被迫老股交易
        - 改变股权分配瀑布，并可能把流动性压力转成负面催化剂
        - 任何资金部署前重建股权结构模型
      - - 到 2028 年仍无可信流动性路径
        - Blackstone 持有期已经过去，但仍没有新轮融资、IPO 文件或出售流程
        - 投资人压力从正向催化剂变成悬顶风险
        - 假设持有期延长，并下调退出倍数信心
