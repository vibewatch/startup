      - number: '7.2'
        title: 运营 / 安全风险
        blocks:
          - type: paragraph
            body: >-
              Vectra AI 的运营风险，不是由已披露的入侵历史定义，而更多来自它必须持续维护的平台广度和迭代速度。 官方材料显示，支持模型只覆盖当前 GA 版本和 GA-1，发布节奏约为每月一次，云组件每月更新两次。
              这有助于 Vectra 快速交付修复，但也把更新负担推给企业客户，并提高了落后部署、版本偏差或集成漂移制造可避免支持摩擦的概率。 公司确认 OpenSSH 中的 CVE-2026-35386
              未影响其产品，这是问题分诊纪律的正面信号；但更广泛的攻击面仍然很大，因为 Vectra 横跨本地网络、多云、身份、SaaS 以及 OT/IoT 场景。 外部威胁数据强化了这一点：IBM 2026
              年研究显示，可信集成在供应链事件中越来越常被利用；WEF 和 Verizon 材料显示，AI 与大规模网络遥测环境继续同时扩大攻击者机会和防守方复杂度。 即便 2026
              年没有确认入侵，剩余运营风险仍然显著，因为产品广度、频繁发布和供应链暴露会在事件响应时相互叠加。
