      - number: '4.2'
        title: 公开牵引力信号与单位经济缺口
        blocks:
          - type: paragraph
            body: >-
              公开牵引力信号足以证明需求，但不足以承销效率。官方材料称，Vectra 服务 2,000+ 家混合与多云组织，在 113 个国家运营，拥有 468 家交易伙伴，并保留超过 95% 的客户。2025 年 8 月
              Inc. 5000 公告强化了增长叙事，Blackstone 的 2021 年发布也留下历史信号：管理层称 2020 年 CAGR 超过 100%，Cognito Detect for Microsoft
              Office 365 同比增长超过 700%。这些都是有意义的动能指标，即便它们不是经审计的运营指标。


              客户故事也给出方向性的单位经济证据。Globe Telecom 报告称，事件响应时间改善 78%，噪音减少 99%，升级减少 96%；Luxgen 在不到五人的安全团队中，报告告警噪音减少 92.6%，升级减少
              95.3%。FICO 的 Fusion 部署展示了另一个经济信号：基于 API 的部署减少了在混合环境中搭建传感器、分流器和代理的需求，意味着 Vectra 和伙伴的实施摩擦更低、服务利润率可能更好。AI
              Cybersecurity Platform 页面还引用 IDC 背书的结果指标，例如识别威胁增加 52%、用时减少 37%、检测与响应周期加快超过 50%，以及 SOC 效率提高 40%。


              承销问题在于，这些仍只是代理指标。GetLatka 的 $120 million 2025 年收入估算和 TipRanks 的 675
              名员工数字，是有用的规模标记，但它们是第三方数据点，不是公司申报数字。保留来源没有披露 CAC、回本周期、配额生产率、毛利率、MDR 人员负担、云处理成本或净收入留存。因此只能得出定性结论：Vectra
              看起来有强劲企业需求和有说服力的 ROI 故事，但公开证据还不足以建立可防守的单位经济模型。
