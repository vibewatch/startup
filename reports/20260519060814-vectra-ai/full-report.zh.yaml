        title: 留存、满意度与持久性缺口
        blocks:
          - type: paragraph
            body: >
              Vectra 的公开留存证据方向正面，但实质上不完整。 公司声称客户留存率超过 95%；截至评审时，G2 上 20 条评论给出 4.3/5 的评分，这与一个部署后被从业者认可的产品相一致。 PeerSpot
              对比页面还显示，Vectra 正被拿来与 Darktrace 和 ExtraHop 一起评估，支持了 Vectra 参与真实企业采购周期、而非边缘小众产品的判断。
              这些信号有用，但不能替代投资者通常想看的核心留存指标。


              具体而言，Vectra 没有公开披露 NRR、GRR、流失率、合同期限、续约率，或按年份、分部拆分的队列留存。 因此，本章中的队列图是锚定公司“超过 95% 留存”说法的分析师估计，不是管理层报告披露。
              评论证据也只是混合偏正面，而非一边倒看多：独立对比暗示 Darktrace 在部分市场的心智更强，这是对其他正面满意度数据的反向信号。 结果是，持久性叙事可信，但尚未得到证据完全支撑。
