  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局
        blocks:
          - type: paragraph
            body: >
              Vectra AI 所处的网络安全区域，正是独立网络检测与响应、相邻身份与云检测，以及更广义 XDR 或 SIEM 平台越来越重叠的地方。保留证据中最强的正面材料来自公司和分析师：Vectra 称自己是
              Gartner 首个 NDR 魔力象限的领导者，也是 GigaOm NDR 和 ITDR Radar 中唯一同时被评为领导者与表现优于同业者的厂商；Omdia 仍把 Vectra 放在领先 NDR 阵营，与
              Darktrace、ExtraHop、Cisco、Palo Alto Networks、Corelight、Fortinet 和 Stamus 并列。这些信号支持一个判断：Vectra
              仍是严肃的直接同业，不是小众异类。


              不利的宏观背景同样重要。Omdia 称，2022 至 2026 年，新的独立 NDR 许可证收入下降，因为买方越来越围绕统一 XDR 平台整合。这意味着实际竞争集合比传统 NDR 更宽。CrowdStrike 和
              Microsoft 重要，并不是因为它们在原生网络遥测上逐项匹配 Vectra，而是因为它们可以把预算、事件工作流和采购注意力转向更广平台。独立评论数据也显示 Vectra 自身 NDR
              心智份额同比下降，与平台整合论点一致。


              一个关键限制必须说明：Vectra 对 Darktrace、ExtraHop 和 Cisco 的比较页面明确是公司撰写的营销页面。它们有助于理解 Vectra
              如何定义竞争，但不能独立证明相对胜率、保真度或创新能力。关键结论是，NDR 仍由纯玩家厂商和专业厂商竞争；但当前最主要的战略压力来自平台巨头，它们可以把相邻检测、响应和身份工作流捆进更宽的控制平面。
