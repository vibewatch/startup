      - number: '3.3'
        title: 平台型既有厂商与邻近威胁
        blocks:
          - type: paragraph
            body: >
              CrowdStrike 和 Microsoft 是本章最重要的非纯玩家威胁，因为它们都能在安全技术栈中比 Vectra 通常触达的位置更高处接住买方。CrowdStrike 将 Falcon 定位为
              “Agentic Security Platform”，并突出 Charlotte AI、更快响应时间、更低工具成本和经 MITRE 验证的检测结果。Microsoft Sentinel 围绕云原生
              SIEM、统一数据湖、图谱赋能的可见性和 350+ 数据连接器定位，Microsoft Defender XDR 则把同一版图扩展到终端、身份、电子邮件和应用。两家都不是一比一的 NDR
              纯玩家，但都能把检测预算吸收到更广的平台决策中。


              威胁更微妙的地方在于，Vectra 也与两家公司集成。Vectra 和 CrowdStrike 联合营销 SMB 与中端市场方案，Vectra 也发布了 Microsoft Sentinel
              伙伴页面，主打工作簿集成和运营协作。换句话说，帮助 Vectra 进入企业 SOC 的同一批平台，也可能成为控制平面，把 Vectra 降格为众多信号源之一。


              Omdia 的 2026 年市场观点，是这一点上最清晰的不利证据：Microsoft、CrowdStrike、Palo Alto Networks 和 Fortinet
              等平台厂商正拿走更大份额的新检测支出。Microsoft 自己的 2026 年身份安全博客也从预算逻辑上强化这一点：32% 的组织认为访问管理工具重复，40%
              称已经有太多厂商。平台化因此不是抽象的市场评论。它是最可能压缩独立 NDR 份额的具体采购力量，即便 Vectra 在网络和身份信号上仍有技术互补性。
