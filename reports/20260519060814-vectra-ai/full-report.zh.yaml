      - number: '6.5'
        title: 扩张路径与集中风险
        blocks:
          - type: paragraph
            body: >
              Vectra 的公开故事暗示，其落地后扩张动作可信。客户可以先从核心威胁检测开始，随后加上 Fusion 获得云原生可见性，加上 Recall 获得更宽的调查上下文，或在内部安全人手紧张时采用 MXDR
              托管运营。 FICO 的 Fusion 部署和 Luxgen 的 MXDR 成果尤其有用，因为它们展示了超出单模块叙事的扩张。 Goodwood Estate 借助 Gigamon 的部署还说明，Vectra
              可以通过合作伙伴关系在既有安全架构内部扩张；对不想做破坏性撕换项目的客户，这可以降低采购摩擦。


              更大的担忧是集中度和证明独立性。Blackstone 既是旗舰客户，也是 Vectra 2021 年融资轮的领投方，这强化了战略关系，也模糊了这项标杆证明中有多少纯商业成分。 SiliconANGLE 关于
              Netography 收购的报道支持了 Vectra 正在扩大云可观测性楔子的判断，但公开材料仍未披露头部客户集中度、合同期限或按分部拆分的 ACV 组合。 2025 年 Conexus
              专利案又增加一层不确定性，因为公开材料没有清楚说明解决条款或财务敞口；因此，在评估扩张持久性时，法律尾部风险无法完全排除。
