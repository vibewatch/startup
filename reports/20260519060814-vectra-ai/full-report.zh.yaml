      - number: '1.5'
        title: 不利事件与尽调提示
        blocks:
          - type: paragraph
            body: >
              截至 2026 年 5 月报告生成日，Vectra AI 面临两项已识别诉讼事项。Justia 案件索引引用的 California 北区法院案卷（案号 5:2023cv01522）涉及与第三方的争议；但
              Justia 页面返回仅 JavaScript 可访问的阻断（accessStatus: js-only），无法独立核验案件细节、当事方或状态。第二项事项 Conexus LLC v. Vectra AI
              Inc.（PACER）出现在 PacerMonitor 捕获的公开申报索引中，但抓取时文档因限流返回二进制内容，无法核验案件事实。公司公开法律页面未提及任一事项。两项都需要在投资前做独立法律尽调。


              收入和员工数上，来源之间存在可信度缺口。官网关于页面写明 580+ 名员工；GetLatka（截至 2025 年 11 月）和 TipRanks（截至 2026 年 5 月）报告 640–675
              名员工。差异可能来自官网页面滞后于更新的第三方聚合，也可能来自统计口径不同（全职、合同工或总人数）。GetLatka 的 $120 million 收入估算未经审计，不应视为已确认。


              Blackstone 融资公告（2021 年 4 月）引用了 $1.2 billion 投后估值。此后近五年没有官方后续融资公告，意味着隐含估值已经陈旧。利率高企、NDR 整合加剧的市场环境下，2021
              年估值可能无法反映当前公允价值。公司没有给出二级市场定价或未来资本事件的指引。


              关键人集中度很高：Hitesh Sheth 同时是创始人、任期最长员工、主要外部发言人和最终战略权威。公司没有披露继任计划或联席 CEO 结构。CTO Oliver Tavakoli 已在 Vectra AI
              任职十多年，构成第二个关键人依赖。
