  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - ARR、增长与留存
        - FY2024-FY2025 ARR 桥接、净美元留存、总留存和季度增长节奏
        - 这些指标决定基准情景倍数能否站得住
        - 任何投委会建议前，要求提供 CFO 材料包或董事会材料
      - - 股权结构表与投资人权利
        - 当前股权结构表、清算优先权、董事会权利和任何债务工具
        - 隐藏的优先股堆叠或信贷额度，可能彻底改变普通股结果
        - 要求提供律师摘要和股权结构瀑布模型
      - - Netography 经济性
        - 收购价格、留任方案、整合里程碑和云挂载假设
        - 这笔收购是云扩张逻辑的核心，但无法用公开证据承销
        - 要求提供 M&A 备忘录、整合看板和产品发布计划
      - - 产品组合变现
        - NDR、ITDR、云以及服务 / MDR 工作流的收入拆分
        - 估值逻辑取决于 Vectra 是否正在超越纯 NDR 厂商
        - 要求按产品家族提供分部 ARR 和管线组合
      - - 流动性路径
        - 董事会对 IPO 准备度、战略兴趣和 Blackstone 时间预期的看法
        - 退出时间压力既可能制造上行紧迫性，也可能迫使次优结果
        - 要求提供覆盖流动性规划的董事会材料或投资人权利摘要
    notes: 这些要求按对估值承销质量的直接影响排序。没有一项只是形式化尽调；每一项一旦由公司验证数据回答，都会实质改变乐观、基准或悲观区间。
    claimRefs:
      - CV020
      - CV027
      - CV028
      - CV030
      - CV035
      - CV044
