      - number: '7.6'
        title: 图表
        blocks:
          - type: callout
            title: 两起专利和 FCA 诉讼事项已于 2026 年 3 月前解决，但条款未披露
            body: >-
              已审阅证据指向两起涉及 Vectra AI 的独立法律事项——Stern v. Vectra AI 和 Conexus LLC v. Vectra AI——它们看起来已在 2026 年 3
              月前结案。这降低了当前未决案件风险，但投资者仍缺少起诉细节、驳回逻辑和和解条款，无法判断任何一案是否对产品、政府合约或自由实施权产生长期影响。
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: callout
            title: XDR 平台整合是 Vectra AI 核心商业模式的结构性市场风险
            body: >-
              Omdia 2026 年市场观点是本章最重要的商业输入：随着 Microsoft、CrowdStrike 和 Palo Alto 把买方预算整合进更宽的 XDR 平台，独立 NDR
              厂商已经面临新增许可压力。Vectra 仍可能在高保真、身份或受监管用例深度重要的场景获胜，但除非 Vectra 能持续证明独特经济价值，否则市场默认方向就是捆绑和工作流捕获。
            calloutType: risk
            claimRefs:
              - CR017
              - CR034
              - CR044
          - type: callout
            title: 隐私和传输控制构成真实的欧盟与英国市场准入基础
            body: Vectra 并非从零开始做合规。公司公开记录了 GDPR 和 UK GDPR 定位、由 SCC 支撑的欧盟传输、英国传输机制，以及正式 DPA 结构，这显著降低了隐私立即阻碍其进入受监管买方市场的概率。
            calloutType: strength
            claimRefs:
              - CR005
              - CR007
              - CR008
          - type: callout
            title: 多个高级岗位同步引入新领导者，带来协调风险
            body: >-
              创始人连续性是稳定器，但当前领导层配置也意味着 Vectra 同时在整合较新的 CFO、较新的产品和营收负责人，以及来自 Netography
              的云负责人。这使执行质量——而不只是技术质量——成为公司能否穿越平台整合、避免定价、路线图或续约滑坡的核心。
