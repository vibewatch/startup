      - number: '7.3'
        title: 合作伙伴 / 依赖风险
        blocks:
          - type: paragraph
            body: >-
              Vectra AI 的合作伙伴生态在战略上有用，但结构上也有风险，因为最显眼的集成对象是平台型厂商，它们既能分销 Vectra，也能替代 Vectra。 最清晰的例子是 CrowdStrike：Vectra
              营销一套联合解决方案，统一网络、云、身份、SaaS 和端点上下文；但 CrowdStrike 自己的 Falcon 平台也把自己定位为具备统一 XDR 和 SIEM 能力的智能体安全平台。 Microsoft
              扮演类似双重角色。Vectra 的 Sentinel 集成帮助客户自动创建事件并开展取证，这降低了进入 Microsoft 工作流的切换摩擦，同时也提高了对一个持续扩张自身安全平台的厂商的依赖。 Nozomi
              Networks 把 Vectra 延伸到 OT 和 IoT 环境，但这段关系引入了专业执行和重叠风险，因为 OT 买方可能越来越偏好原生或单一厂商平台。 更广泛的依赖问题不只是这些具名合作伙伴，而是连接器、公开
              API 工具和研究社区随着时间推移扩大集成表面积后形成的维护负担。 这使依赖风险直接影响续约、产品路线图优先级和竞争性定价压力。
