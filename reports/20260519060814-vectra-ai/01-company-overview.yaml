company:
  name: Vectra AI
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Vectra AI is a San Jose, California-based cybersecurity company founded in 2011 by Hitesh Sheth,
    delivering an AI-native platform for network detection and response (NDR), identity threat detection
    and response (ITDR), and AI-driven SOC operations. The company reached a $1.2 billion post-money
    valuation following its April 2021 $130 million Series F led by Blackstone Growth, bringing total
    disclosed capital to more than $350 million. As of the 2026 run date, Vectra AI reports 2,000+
    enterprise customers across 113 countries, 95%+ customer retention, 580+ employees, and 468 transacting
    partners; it is the only NDR vendor named a Gartner Magic Quadrant Leader and GigaOm Leader in both
    NDR and ITDR simultaneously. The October 2025 acquisition of Netography extended its cloud-native
    observability perimeter, and a December 2025 CRO appointment plus a March 2026 Channel Chief hire
    signal accelerated go-to-market investment.

sections:
  - id: section-identity
    title: Identity, mission, and operating model
    body: >
      Vectra AI, Inc. is a Delaware-incorporated cybersecurity company headquartered at 550 S. Winchester
      Boulevard, Suite 200, San Jose, California 95128. The company was founded in 2011 by Hitesh Sheth
      with the explicit thesis that artificial intelligence and machine learning could reliably distinguish
      real attacker behavior from legitimate activity across hybrid networks, eliminating the alert flood
      that had made manual SOC operations unsustainable. Its one-line product description is an AI-native
      platform for network detection and response, identity threat detection and response, and hybrid SOC
      signal management.


      The current platform architecture integrates five coverage pillars: on-premises and multi-cloud
      network observability (including the October 2025 Netography Fusion acquisition now branded Vectra
      Fusion), identity threat detection and response spanning Microsoft Entra / Active Directory and SaaS
      identities, endpoint integration via partner EDR feeds, AI-driven signal prioritization (branded
      Attack Signal Intelligence), and 360-degree automated response across identity, device, and network
      traffic. The company claims more than 90% coverage of MITRE ATT&CK techniques and holds 39 AI
      threat detection patents, with more vendor references in MITRE D3FEND than any other NDR vendor.


      Vectra AI's business model is a recurring SaaS subscription delivered either as a cloud-hosted service
      or as a hybrid deployment with on-premises sensors. The company also operates a managed detection and
      response (MDR) overlay through its professional services organization. The go-to-market motion is
      channel-dominant: 468 transacting partners as of the official about page provide sales distribution,
      with strategic technology alliances with CrowdStrike, Microsoft Sentinel, Nozomi Networks, and others.
      As of May 2026, the company reports 580+ employees operating across 113 countries.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
