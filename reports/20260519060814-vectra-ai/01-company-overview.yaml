callouts:
  - calloutType: strength
    title: Sole Gartner NDR MQ Leader with dual NDR/ITDR recognition
    body: >-
      Vectra AI is the only vendor named a Leader and Outperformer in both GigaOm's NDR and ITDR Radar
      Reports in 2025, and is positioned highest in Ability to Execute and furthest in Completeness of
      Vision in the inaugural Gartner Magic Quadrant for NDR. This dual recognition is a meaningful
      differentiation signal in a market where most competitors lead only in one category.
    claimRefs:
      - CO027
      - CO028

  - calloutType: risk
    title: 2021 valuation overhang with no subsequent round
    body: >-
      The $1.2 billion post-money valuation was set in April 2021 during a peak growth-equity environment.
      No subsequent round has been publicly announced in nearly five years. The implied stale valuation,
      combined with unaudited revenue estimates and an unclear path to IPO, creates material diligence
      uncertainty for any investor relying on current fair-value pricing.
    claimRefs:
      - CO020
      - CO024
      - CO025

  - calloutType: risk
    title: Key-person concentration in founder/CEO
    body: >-
      Hitesh Sheth is simultaneously the founder, longest-tenured executive, primary external spokesperson,
      and CEO. No succession plan or co-leadership structure is publicly disclosed. Oliver Tavakoli (CTO,
      10+ years) represents a second technical key-person dependency. This concentration is common in
      founder-led private companies but should be surfaced explicitly in any governance review.
    claimRefs:
      - CO010
      - CO038

  - calloutType: insight
    title: Netography acquisition adds Sourcefire pedigree and cloud-native gap closure
    body: >-
      The October 2025 Netography acquisition brought Martin Roesch — creator of the Snort IDS and founder
      of Sourcefire (sold to Cisco for $2.7 billion) — into the Vectra AI executive team. It also closed
      a critical architectural gap: Vectra Fusion delivers agentless, cloud-native network observability
      across AWS, Azure, GCP, and SaaS environments without hardware sensors, strengthening the platform's
      hybrid coverage story.
    claimRefs:
      - CO031
      - CO014

  - calloutType: assumption
    title: Revenue estimate of ~$120M is unconfirmed and should not be treated as audited
    body: >-
      GetLatka estimated Vectra AI 2025 revenue at approximately $120 million, citing company-reported or
      estimated metrics. Vectra AI does not publicly disclose revenue. This figure is used here for
      directional context only; a formal revenue disclosure or independent audit is required for any
      investment valuation.
    claimRefs:
      - CO024

