  - id: section-funding
    title: Funding history and capital structure
    body: >
      Vectra AI has disclosed three equity rounds totaling more than $266 million, plus the April 2021
      Series F that raised $130 million and reset the valuation floor. The official company announcement
      and Blackstone's own press release confirm the Series F was led by funds managed by Blackstone Growth
      (BXG), with participation from existing investors, at a post-money valuation of $1.2 billion, elevating
      Vectra to unicorn status. The round brought total disclosed funding to more than $350 million at the
      time of the announcement.


      Prior rounds per GetLatka and public database records include: a 2018 Series D of $36 million and a
      2019 Series E of $100 million. Khosla Ventures is confirmed as an earlier investor through board member
      Bruce Armstrong's public board role. No credible later equity round has been announced through the
      May 2026 run date; TipRanks and GetLatka both show the Series F as the most recent disclosed round.
      The $1.2 billion post-money valuation set in April 2021 has not been officially updated, and no
      secondary-market or IPO pricing is available.


      GetLatka estimated 2025 revenue at approximately $120 million, citing company-reported or
      company-estimated metrics in its November 2025 data update. This figure is not independently audited
      and should be treated as an unconfirmed estimate; Vectra AI does not publicly disclose revenue.
      No debt rounds, credit facilities, or secondary transactions have been confirmed in public sources.
      The board's pre-IPO composition (Pure Storage CEO, Blackstone Growth MD) is consistent with a
      company in late-stage private growth mode, though no IPO timeline has been announced.
