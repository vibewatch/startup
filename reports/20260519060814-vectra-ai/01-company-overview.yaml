  - id: section-leadership
    title: Founders, leadership, and governance
    body: >
      Hitesh Sheth is the founder, president, and CEO of Vectra AI. His background at Aruba Networks
      (COO), Juniper Networks (EVP/GM Switching, SVP Service Layer Technologies / Security), and Cisco
      (senior switching executive) spans more than two decades of enterprise network and security leadership.
      Sheth has served continuously since founding the company in 2011, making him both the longest-tenured
      executive and the single largest key-person dependency.


      The current executive team (as of May 2026) is deep-bench. Oliver Tavakoli (CTO, 10+ years at
      Vectra AI) sets technical strategy; he previously served as CTO of Juniper Networks' security business
      following Juniper's acquisition of Funk Software. Snehal Patel (CPO) joined from Google (GKE product
      lead) and Cisco (VP Security Platform); Don Dixon (CFO) brings prior CFO experience at DataStax (IBM
      acquisition 2025), Skyhigh Networks (McAfee acquisition), and Apigee (Google IPO acquisition). Greg
      Murphy (CBO) is a co-founder-equivalent operator, previously CEO of Ordr and VP Business Operations
      at HPE Aruba following the $3 billion Aruba acquisition. Martin Roesch (Head of Cloud) is the original
      author of Snort IDS and founder of Sourcefire (acquired by Cisco for $2.7 billion in 2013), joining
      through the Netography acquisition in October 2025.


      Two key go-to-market hires in late 2025 and early 2026 signal a deliberate push for distribution scale.
      Derek Phillips was appointed CRO in December 2025; he previously served as CRO at Claroty, and earlier
      as Deputy CEO and CRO at Kudelski Security, and in a senior IBM sales leadership role. Chad Reese joined
      as SVP Global Channel Chief in March 2026 with 25+ years of channel experience, responsible for scaling
      the 468-partner ecosystem across solution providers, MSSPs, system integrators, hyperscalers, and
      distributors. Tommy Jenkins (CMO, from Veeam) and Paul Bradley Shinn (CLO, from CrowdStrike and
      Gigamon) round out the senior layer.


      Governance: the board of directors includes Charlie Giancarlo (CEO, Pure Storage; Vectra board member
      since April 2014), Bruce Armstrong (Khosla Ventures, investor representative), Brian Dunlap (Blackstone
      Growth, investor representative), and Jim Messina (Messina Group; strategic comms). Vectra AI is a
      private Delaware corporation; no SEC filings are available. Board composition is partially confirmed
      from the official leadership page; the complete list of independent directors is not publicly disclosed.
