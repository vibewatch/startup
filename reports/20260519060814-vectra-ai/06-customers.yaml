  title: "Customers"
  summary: >-
    Vectra AI's public customer evidence is strongest on named enterprise deployments and weaker on retention, cohort,
    and concentration disclosure. Official case studies span financial services, telecom, higher education,
    manufacturing, cultural institutions, and industrials across North America, EMEA, and APAC, with standout reported
    outcomes at Blackstone, Globe Telecom, Van Gogh Museum, and Luxgen. The company appears to sell primarily to CISO
    and SOC-led enterprise teams and to expand from core detection into Fusion, Recall, and MXDR, but public sources do
    not disclose NRR, GRR, contract length, top-customer concentration, or a year-by-year customer-count trajectory.
