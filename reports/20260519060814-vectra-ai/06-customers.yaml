title: "Customers"
sections:
  - id: section-segmentation
    title: "Customer base segmentation and buyer profile"
    body: |
      Vectra AI's public customer footprint looks concentrated in enterprise and upper-midmarket security teams rather than in small-business buyers. The recurring buyer appears to be the CISO, VP of Security, or SOC leader who is responsible for reducing alert volume across hybrid environments; the daily user is the SOC analyst or incident responder operating triage and investigation workflows. Public case studies show deployments in financial services (Blackstone, FICO), telecom (Globe Telecom), manufacturing (Luxgen), higher education (Texas A&M University and American University), cultural institutions (Van Gogh Museum), and industrial or engineering environments (Maire). That breadth matters because it suggests Vectra can sell across multiple regulated and mission-critical settings without depending on a single use-case niche.

      Geography is also meaningfully diversified. Named public references span North America, the Philippines, Japan, Taiwan, the Netherlands, the United Kingdom, and continental Europe, while the customer-stories library implies a broader global base than the named set alone. Goodwood Estate's story with Gigamon suggests Vectra can also enter through partner-assisted architectures rather than only direct rip-and-replace deals. Official NIS2 and GDPR materials further indicate active messaging to regulated European buyers. The main segmentation gap is economic, not categorical: Vectra does not publicly break out revenue, ACV, or customer mix by vertical, size band, or region.
    claimRefs: [CU001, CU002, CU003, CU004, CU005, CU006, CU013, CU014, CU015, CU016, CU017, CU018, CU019]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: section-adoption
    title: "Adoption trajectory and public scale signals"
    body: |
      The clearest top-line adoption signal is Vectra's own claim that it serves more than 2,000 organizations globally, combined with a public customer-stories library that surfaces a double-digit set of named deployments. That is enough to establish that Vectra is beyond pilot-stage commercialization, but it is still weaker than the level of disclosure investors would get from a public SaaS company because the company does not publish active-account trends, seat counts, deployed-sensor counts, or any MAU/DAU equivalent. The available customer proof is therefore broad enough to show adoption breadth, but not precise enough to model utilization intensity or deployment depth across the full installed base.

      Secondary scale markers provide context rather than direct customer denominators. GetLatka estimates about $120 million of 2025 revenue, while Blackstone's 2021 $130 million investment at a $1.2 billion valuation marked a major commercialization milestone and validated enterprise interest in the platform. Omdia's May 2026 market note also reinforces why customer proof matters now: NDR is moving through consolidation and platform bundling, so vendors that cannot point to credible production outcomes risk being marginalized in enterprise shortlists. Vectra's named references and analyst-recognition cadence suggest continuing market relevance, but the missing year-by-year customer-count trajectory remains a real diligence gap.
    claimRefs: [CU003, CU007, CU008, CU009, CU010, CU011, CU012, CU020, CU021, CU024, CU025, CU026, CU038, CU040]
    tableRefs: [TU002]
    figureRefs: [FU002]
  - id: section-named-proof
    title: "Named customer proof and evidence quality"
    body: |
      Vectra's strongest customer evidence is its set of named production case studies with quantified outcomes. Blackstone reports a 90% reduction in security alerts; Globe Telecom reports 99% noise reduction, 96% fewer escalations, and 78% faster incident response in one year; Van Gogh Museum reports an 84% true positive rate across Azure identity and data-center coverage; and Luxgen reports 95.3% fewer escalations through a managed MXDR deployment. FICO's case study is also valuable because it describes a concrete hybrid-visibility deployment with Fusion and includes a named executive quote from Shannon Ryan, giving the proof more operating detail than a simple logo placement.

      The proof quality is uneven beneath the top tier. Texas A&M University, American University, Nissho Electronics, Goodwood Estate, and Maire all appear as named references, but not all of them disclose quantified before-versus-after outcomes. That means the chapter can confidently say Vectra has real production use in multiple verticals, yet it cannot claim that every published logo demonstrates the same level of measurable ROI. Independent review platforms provide some outside corroboration that the product is actively used in production, but the dramatic outcome metrics themselves remain mostly vendor-originated rather than independently verified by the customers on their own domains.
    claimRefs: [CU013, CU014, CU015, CU016, CU017, CU018, CU019, CU020, CU021, CU022, CU023, CU024, CU025, CU026, CU027, CU028, CU029, CU030, CU031, CU037]
    tableRefs: [TU003]
    figureRefs: [FU003]
  - id: section-retention
    title: "Retention, satisfaction, and durability gaps"
    body: |
      Public retention evidence for Vectra is directionally positive but materially incomplete. The company claims customer retention above 95%, and G2 shows a 4.3 out of 5 rating from 20 reviews at the time of review, which is consistent with a product that is valued by practitioners after deployment. PeerSpot comparison pages also show Vectra being actively evaluated alongside Darktrace and ExtraHop, which supports the view that Vectra is part of live enterprise buying cycles rather than a marginal niche product. These signals are useful, but they are not substitutes for the core retention metrics that investors would normally want.

      Specifically, Vectra does not publicly disclose NRR, GRR, churn, contract length, renewal rates, or cohort retention by year or segment. The cohort figure in this chapter is therefore an analyst estimate anchored to the company's greater-than-95-percent retention claim, not a reported management disclosure. Review evidence is also mixed rather than uniformly bullish: independent comparisons imply stronger mindshare for Darktrace in parts of the market, which is an adverse signal against the otherwise positive satisfaction data. The result is a plausible but not fully underwritten durability story.
    claimRefs: [CU030, CU031, CU032, CU033, CU034, CU035, CU036, CU037]
    tableRefs: [TU004]
    figureRefs: [FU004]
  - id: section-expansion
    title: "Expansion paths and concentration risks"
    body: |
      Vectra's public stories imply a credible land-and-expand motion. Customers can start with core threat detection and then layer in Fusion for cloud-native visibility, Recall for broader investigation context, or MXDR for managed operations when in-house security staffing is thin. FICO's Fusion deployment and Luxgen's MXDR outcome are especially useful because they show expansion beyond a single-module story. Goodwood Estate's Gigamon-linked deployment also suggests Vectra can expand inside an existing security architecture through partner relationships, which can reduce procurement friction for customers that do not want a disruptive rip-and-replace project.

      The bigger concern is concentration and proof independence. Blackstone is both a flagship customer and the lead investor from Vectra's 2021 funding round, which strengthens the strategic relationship but also muddies how much of that marquee proof is purely commercial. SiliconANGLE's reporting on the Netography acquisition supports the idea that Vectra is widening its cloud-observability wedge, yet public materials still do not disclose top-customer concentration, contract length, or ACV mix by segment. The 2025 Conexus patent case adds another layer of uncertainty because public materials do not clearly establish resolution terms or financial exposure, so legal overhang cannot be fully ruled out when thinking about expansion durability.
    claimRefs: [CU028, CU029, CU038, CU039, CU040, CU041, CU042, CU043]
    tableRefs: [TU005]
    figureRefs: []
