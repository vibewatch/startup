callouts:
  - id: KU001
    calloutType: strength
    title: "Named proof is broad for a private NDR vendor"
    body: "Vectra has more public named customer proof than many private security vendors, and several case studies include specific before-versus-after operating metrics rather than only logo placement."
    claimRefs: [CU013, CU020, CU021, CU024, CU025]
  - id: KU002
    calloutType: risk
    title: "Retention story is still under-disclosed"
    body: "The company-claimed >95% retention figure is useful, but the absence of NRR, GRR, churn, contract-length, and cohort disclosures means durability cannot be fully underwritten from public evidence."
    claimRefs: [CU033, CU034, CU035]
  - id: KU003
    calloutType: insight
    title: "Expansion likely works through adjacent workflows"
    body: "Public stories suggest Vectra expands not by adding more seats alone, but by widening scope into Fusion, Recall, MXDR, and partner-linked architectures once a customer trusts the core detection layer."
    claimRefs: [CU026, CU028, CU038, CU039, CU040]
  - id: KU004
    calloutType: recommendation
    title: "Ask for renewal and concentration data"
    body: "A serious diligence process should require top-10 customer concentration, cohort retention, standard contract term, and a clear summary of Conexus-related exposure before treating the customer base as fully underwritten."
    claimRefs: [CU034, CU035, CU042, CU043]
