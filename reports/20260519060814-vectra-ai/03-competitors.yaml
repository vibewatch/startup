callouts:
  - calloutType: strength
    title: Leader signals still matter in a consolidating category
    body: |
      Vectra enters the competitive set with unusually strong category credentials for a private NDR specialist:
      Gartner's first NDR Magic Quadrant leader position, dual GigaOm recognition across NDR and ITDR, and a
      disclosed patent estate tied to MITRE D3FEND references. Those signals do not guarantee share gains, but
      they make Vectra more defensible than an undifferentiated point product.
    claimRefs:
      - CP001
      - CP002
      - CP003

  - calloutType: risk
    title: Platform consolidation is the primary adverse force
    body: |
      The highest-order competitive risk is not a single direct peer beating Vectra on features. It is the
      steady migration of detection budget toward broader Microsoft and CrowdStrike-style platforms that can
      package identity, endpoint, SIEM, and response together. Omdia's 2026 market commentary and PeerSpot's
      mindshare decline data point in the same direction.
    claimRefs:
      - CP007
      - CP021
      - CP024
      - CP028
      - CP031

  - calloutType: insight
    title: Co-opetition cuts both ways
    body: |
      Vectra's integrations with CrowdStrike, Microsoft, and Nozomi are commercially helpful because they raise
      deployment relevance and workflow stickiness. They are also strategically dangerous because they normalize
      a world in which Vectra is one high-value signal source inside someone else's broader security operating
      platform.
    claimRefs:
      - CP023
      - CP026
      - CP040

