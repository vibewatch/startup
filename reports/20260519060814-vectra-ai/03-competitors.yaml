  - id: moat-durability
    title: Moat durability, switching costs, and decay risks
    body: |
      Vectra's most durable competitive assets in the retained evidence are not simple share metrics. They are
      the product and credibility signals that make the platform worth keeping inside a mature SOC: 39 AI
      patents, 12 patents referenced in MITRE D3FEND, a stated installed base of more than 2,000 hybrid and
      multi-cloud organizations, and a platform footprint that spans network, cloud, identity, SaaS-adjacent
      workflows, investigation, response, and posture improvement. ChannelE2E's acquisition coverage also
      matters because it frames Netography as cloud-native network-security expansion that helps Vectra argue it
      is replacing multiple tools rather than adding another point product.

      These strengths do create switching costs. Once Vectra is wired into identity, cloud, endpoint, and SIEM
      workflows through integrations with CrowdStrike and Microsoft, buyers have embedded detections,
      investigations, dashboards, and response actions to unwind before they can fully replace it. But the same
      architecture also raises multi-homing risk. A customer can keep Vectra for differentiated network signal
      while standardizing its primary console, procurement relationship, and incident workflow around a broader
      platform.

      The adverse evidence is meaningful. PeerSpot shows Vectra's own mindshare down to 11.2% from 16.1%, and
      reviewers say pricing can be complex, often tied to IP-based licensing and added features. Those same
      reviews also say Vectra can be cheaper than Darktrace, which suggests price is not the whole story. The
      more important risk is durability under consolidation: if Microsoft, CrowdStrike, or other platforms get
      "good enough" at network and identity analytics, Vectra's moat could narrow from indispensable platform to
      high-value add-on. The chapter's core diligence question is therefore not whether Vectra is strong today,
      but whether its signal advantage remains strong enough to resist becoming a secondary telemetry source.
    claimRefs:
      - CP031
      - CP032
      - CP033
      - CP034
      - CP035
      - CP036
      - CP037
      - CP038
      - CP039
      - CP040
    tableRefs:
      - TP004
    figureRefs:
      - FP003

