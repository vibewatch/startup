  - id: platform-incumbents
    title: Platform incumbents and adjacent threats
    body: |
      CrowdStrike and Microsoft are the most important non-pure-play threats in this chapter because each can
      meet a buyer higher in the security stack than Vectra usually does. CrowdStrike markets Falcon as an
      "Agentic Security Platform" and highlights Charlotte AI, faster response times, lower tool costs, and
      MITRE-validated detection outcomes. Microsoft Sentinel positions around cloud-native SIEM, a unified data
      lake, graph-enabled visibility, and 350+ data connectors, while Microsoft Defender XDR expands the same
      estate across endpoints, identities, email, and applications. Neither vendor is a like-for-like NDR pure
      play, but both can absorb detection budget into broader platform decisions.

      What makes the threat subtler is that Vectra also integrates with both companies. Vectra and CrowdStrike
      jointly market an SMB and midmarket offer, and Vectra publishes a Microsoft Sentinel partner page that
      centers workbook integration and operational collaboration. In other words, the same platforms that help
      Vectra land inside an enterprise SOC can also become the control plane that reduces Vectra to one signal
      source among many.

      Omdia's 2026 market view is the clearest adverse evidence on this point: platform vendors such as
      Microsoft, CrowdStrike, Palo Alto Networks, and Fortinet now capture a greater share of new detection
      spending. Microsoft's own 2026 identity-security blog reinforces the budget logic by reporting that 32% of
      organizations see duplicated access-management tooling and 40% say they already have too many vendors.
      Platformization, then, is not abstract market commentary. It is the concrete procurement force most likely
      to compress standalone NDR share, even when Vectra remains technically complementary in network and
      identity signal.
    claimRefs:
      - CP021
      - CP022
      - CP023
      - CP024
      - CP025
      - CP026
      - CP027
      - CP028
      - CP029
      - CP030
