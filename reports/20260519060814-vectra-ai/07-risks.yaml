  - id: mitigation-and-kill-criteria
    title: "Mitigation and kill criteria"
    body: >-
      Vectra AI does have real mitigations in place: privacy controls are documented, transfer mechanisms are published, release and support policies are explicit, specific CVE triage is visible through support knowledge-base articles, and technology integrations demonstrate that the platform can operate inside larger SOC workflows rather than forcing a rip-and-replace motion. Those strengths matter, especially for EU and UK buyers that require a credible compliance foundation. The problem is that the investment case still hinges on variables the public record cannot fully close. The top thesis-break signals are commercial rather than purely technical: accelerating XDR consolidation into Microsoft and CrowdStrike bundles, worsening pricing friction or UI complaints that hurt expansions, or evidence that new leadership and Netography integration are not improving product-market fit quickly enough. Financial-model risk remains partly unobservable because public materials do not disclose runway, leverage, or investor timing pressure. The right diligence posture is therefore to treat Vectra as investable only with active monitoring of renewals, competitive displacement, incident posture, executive retention, and any financing or legal-development update that would materially change residual exposure.
