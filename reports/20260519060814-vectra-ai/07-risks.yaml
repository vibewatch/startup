callouts:
  - calloutType: risk
    title: "Two patent and FCA litigation matters resolved by March 2026 with undisclosed terms"
    body: >-
      The evidence reviewed points to two separate legal matters involving Vectra AI — Stern v. Vectra AI and Conexus LLC v. Vectra AI — that appear closed by March 2026. That lowers immediate open-case risk, but investors still lack the complaint detail, dismissal rationale, and settlement terms needed to know whether either matter has lasting product, government-contracting, or freedom-to-operate implications.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR004
  - calloutType: risk
    title: "XDR platform consolidation is the structural market risk to Vectra AI's core business model"
    body: >-
      Omdia's 2026 market view is the single most important commercial input in this chapter: stand-alone NDR vendors have already faced new-license pressure as Microsoft, CrowdStrike, and Palo Alto consolidated buyer budgets into broader XDR platforms. Vectra may still win where fidelity, identity, or regulated-use-case depth matter, but the default direction of the market is toward bundling and workflow capture unless Vectra can keep proving distinct economic value.
    claimRefs:
      - CR017
      - CR034
      - CR044
  - calloutType: strength
    title: "Privacy and transfer controls provide a real EU and UK market-access foundation"
    body: >-
      Vectra is not starting from zero on compliance. The company publicly documents GDPR and UK GDPR positioning, SCC-backed EU transfers, UK transfer mechanisms, and a formal DPA structure, which meaningfully reduces the chance that privacy becomes an immediate go-to-market blocker for regulated buyers.
    claimRefs:
      - CR005
      - CR007
      - CR008
  - calloutType: risk
    title: "Simultaneous leadership onboarding across multiple senior roles creates coordination risk"
    body: >-
      Founder continuity is a stabilizer, but the current leadership configuration also means Vectra is integrating a newer CFO, newer product and revenue leadership, and a Netography-derived cloud leader at the same time. That makes execution quality — not just technology quality — central to whether the company can navigate platform consolidation without pricing, roadmap, or renewal slippage.
    claimRefs:
      - CR023
      - CR024
      - CR025
      - CR045
