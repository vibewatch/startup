  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: "burn rate and capital structure"
      missingEvidence: >-
        Vectra AI has not disclosed current burn rate, cash runway, debt obligations, or broader capital structure in the reviewed public materials, and no later financing detail is confirmed in this source set.
      whyItMatters: >-
        Without burn and runway data, investors cannot assess financial-distress risk, the likely timing of a capital call, or how much operating slippage the company can absorb before valuation pressure becomes acute.
      diligencePath: >-
        Request the operating model, current cash balance, debt schedule, monthly burn, and runway forecast; confirm whether additional debt or equity financing is planned within the next 12 to 24 months.
      relatedQuestionRefs: [QR015, QR032]
    - type: private-evidence-only
      severity: material
      topic: "litigation details"
      missingEvidence: >-
        The Justia and PACER-derived litigation records indicate filing and closure timing, but the underlying complaint text, dismissal or settlement terms, and any admission of liability were not available in the fetched evidence.
      whyItMatters: >-
        The specific False Claims Act allegations and patent claims could affect government-contract eligibility, product freedom to operate, or future licensing obligations even though the cases appear closed.
      diligencePath: >-
        Request the Stern dismissal or settlement documents, the Conexus complaint and closure order, and outside-counsel summaries of residual legal exposure.
      relatedQuestionRefs: [QR001, QR002, QR003]
      relatedTableRefs: [TR001]
    - type: private-evidence-only
      severity: minor
      topic: "export control classification"
      missingEvidence: >-
        Vectra AI has not publicly disclosed an ECCN classification letter, export-control compliance program, or deemed-export analysis for its AI-driven cybersecurity platform.
      whyItMatters: >-
        Dual-use cybersecurity and AI analytics can trigger export restrictions, and non-compliance carries civil, criminal, and commercial consequences for international sales and hiring.
      diligencePath: >-
        Request the ECCN classification letter, export-compliance program documents, and any internal legal memo covering international engineering access and restricted-jurisdiction sales.
      relatedQuestionRefs: [QR020]
    - type: missing-source
      severity: minor
      topic: "security certifications"
      missingEvidence: >-
        No public-facing SOC 2 Type II, ISO 27001, FedRAMP, or similar third-party certification documentation was included in this research run's allowed source set.
      whyItMatters: >-
        Certifications are standard procurement checkpoints for regulated and enterprise buyers, and the absence of public attestation leaves uncertainty around Vectra's external assurance posture.
      diligencePath: >-
        Request SOC 2 Type II reporting, ISO 27001 certification status, any FedRAMP roadmap, and a summary of customer-facing security assurance materials.
      relatedQuestionRefs: []
    - type: private-evidence-only
      severity: minor
      topic: "AI patent litigation exposure"
      missingEvidence: >-
        Vectra AI's claimed AI patent portfolio has not been compared against competitor or non-practicing-entity patent positions, and the Conexus matter does not reveal enough public detail to assess overlap risk.
      whyItMatters: >-
        Patent disputes in cybersecurity can create licensing drag, injunction risk, or strategic distraction, especially when a company markets patent-backed AI differentiation.
      diligencePath: >-
        Request a freedom-to-operate analysis, patent-list crosswalk, and counsel view on whether further assertion risk exists against Vectra's detection and response portfolio.
      relatedQuestionRefs: [QR023]
