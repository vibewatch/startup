  - id: people-execution-risk
    title: "People / execution risk"
    body: >-
      People and execution risk at Vectra AI is concentrated in two places: founder dependence and simultaneous leadership change. Hitesh Sheth remains founder and CEO after more than a decade, which preserves strategic continuity but also centralizes customer trust, category narrative, and internal decision authority in one individual. At the same time, the leadership page shows a broad bench of newer senior executives, including Don Dixon as CFO, Snehal Patel as CPO, Derek Phillips as CRO, Martin Roesch as Head of Cloud via Netography, and other recently assembled functional leaders. That depth is positive in principle, yet onboarding several senior operators during a platform-expansion phase raises coordination risk around pricing, packaging, channel strategy, integration sequencing, and roadmap communication. The Netography integration adds a second execution layer because it brings new cloud-observability capabilities and a prominent technical leader, but also creates migration, architecture, and team-alignment work that is hard to judge from outside. Public sources also do not disclose burn rate, cash runway, or capital structure, so investors cannot cleanly assess how much execution slack the company can absorb if integration or go-to-market changes take longer than planned.
    claimRefs:
