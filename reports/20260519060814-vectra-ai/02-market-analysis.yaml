callouts:
  - calloutType: insight
    title: MDR Growth Is Large Enough To Matter Even For A Specialist
    body: >
      MarketsandMarkets' 24.8% CAGR implies roughly $12.7 billion of incremental MDR market expansion between 2026 and
      2031. Even if Vectra AI only defends a narrow specialist position inside that broader pool, the category growth
      tailwind is much larger than the company's currently disclosed scale signals.
    claimRefs:
      - CM010
      - CM011
      - CM015
  - calloutType: risk
    title: XDR Consolidation Is The Structural Risk To Underwrite
    body: >
      Omdia's conclusion that XDR consolidation has already pushed up standalone NDR non-renewals since 2022 is the
      most important adverse market signal in this chapter. Vectra AI's 95%+ retention claim from company materials is
      encouraging but does not answer whether retention stays equally strong in Microsoft- or CrowdStrike-heavy
      accounts.
    claimRefs:
      - CM026
      - CM039
      - CM042
  - calloutType: assumption
    title: Quantitative SAM And SOM Remain Constrained By Missing Public Category Data
    body: >
      No public headline figure for standalone NDR or accessible public top-line figure for ITDR was retrieved in this
      chapter's evidence set. The SAM and illustrative SOM shown here are therefore structured estimates, useful for
      diligence framing but not a substitute for proprietary analyst data or management disclosure.
    claimRefs:
      - CM015
      - CM016
      - CM027
