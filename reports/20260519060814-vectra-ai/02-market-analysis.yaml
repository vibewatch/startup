  - id: section-market-sizing
    title: "Market Sizing: TAM, SAM, and SOM"
    body: >
      The cleanest published sizing anchor available in public sources is the managed detection and response market,
      which MarketsandMarkets sizes at $6.28 billion in 2026 and projects to grow to $19.01 billion by 2031 at a
      24.8% CAGR. That figure is directionally helpful because it captures the broader spend environment for outsourced
      and platform-led detection, but it is too broad to use as Vectra AI's direct TAM without adjustment. Vectra does
      not sell a generic MDR service; it sells a hybrid of NDR, ITDR, cloud-network visibility, and AI-led triage that
      can be consumed directly by enterprise teams or indirectly through partners. Omdia's 2026 NDR coverage implies
      that the serviceable market is narrower than total MDR but still meaningful in large hybrid-cloud enterprises,
      especially where buyers need deeper network visibility than bundled XDR can provide.

      The resulting SAM and SOM are therefore evidence-constrained estimates rather than clean publisher figures.
      This chapter uses MDR as the outer lens, then narrows to an estimated $1.8-$2.5 billion serviceable segment for
      enterprise hybrid-cloud NDR plus ITDR use cases where identity sprawl, east-west traffic, SaaS activity, and
      OT/ICS telemetry all raise the value of a purpose-built signal layer. The accessible ResearchAndMarkets ITDR
      excerpt confirms that ITDR is a real and segmented category, but the public excerpt does not disclose a headline
      dollar figure, which prevents a tighter bottom-up calculation. FM002 preserves that uncertainty by showing a
      range rather than a false point estimate. The core diligence task is therefore not proving that the market is
      large; it is validating how much of that market remains contestable for a standalone specialist as XDR bundles
      become more aggressive.
    claimRefs:
      - CM007
