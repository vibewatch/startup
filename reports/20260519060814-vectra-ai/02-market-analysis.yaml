company:
  name: Vectra AI
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Vectra AI sells into a narrowly defined but expanding detection-and-response segment that sits inside the broader
    MDR market and overlaps with standalone NDR, ITDR, AI-SOC workflow automation, and selected OT/ICS security use
    cases. Public analyst evidence supports a large growth backdrop — MarketsandMarkets sizes MDR at $6.28 billion in
    2026 growing to $19.01 billion by 2031 — but Omdia's adverse read on XDR-driven consolidation means the core
    investment question is not whether the market exists, but whether Vectra can keep winning the hybrid-cloud,
    identity-heavy, deep-visibility accounts where standalone NDR still matters.
sections:
  - id: section-market-boundary
    title: Market Boundary and Included Spend
    body: >
      Vectra AI's economically relevant market is not “all cybersecurity” and it is not the full spend pool of SIEM,
      XDR, IAM, or endpoint tooling. The practical boundary starts with network detection and response: software and
      telemetry pipelines that inspect east-west traffic, cloud-network flows, SaaS identity activity, and attacker
      movement after initial compromise. It expands into identity threat detection and response because Vectra's
      platform and competitive messaging are increasingly built around identity-layer detections and automated response
      actions, not just packet or flow analytics. A managed-detection overlay is also relevant when buyers or channel
      partners consume the same telemetry through outsourced monitoring, triage, and incident response services rather
      than fully staffing an internal SOC.

      Excluded spend matters just as much as included spend. Pure-play EDR licenses, generic SIEM storage and search,
      standalone IAM governance, PAM, and broad consulting retain cybersecurity budget but do not map cleanly to
      Vectra's value proposition unless they ingest or enrich network-and-identity detections. Status-quo substitutes
      are manual SOC operations, SIEM-only detection, and bundled XDR platforms from larger vendors. Omdia's 2026 NDR
      analysis shows why that distinction matters: some standalone NDR renewals were displaced by platform XDR from
      2022 to 2025, yet the same report argues that buyers still preserve standalone NDR when they need deeper
      visibility into unmanaged assets, east-west traffic, SaaS identities, and OT/ICS environments that remain weakly
      covered by EDR-centric platforms. TM001 defines the spend boundary, and FM001 shows that Vectra's true
      opportunity is a constrained slice of a broader AI-augmented security-operations market rather than the entire
      security stack.
    claimRefs:
