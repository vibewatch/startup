  - id: section-drivers-constraints
    title: Growth Drivers and Adoption Constraints
    body: >
      The strongest demand-side argument for Vectra AI is that the threat environment is worsening in exactly the
      places where network-and-identity visibility matters. WEF says 87% of respondents viewed AI-related
      vulnerabilities as the fastest-growing cyber risk in 2025, and the share of organizations actively assessing AI
      tool security nearly doubled from 37% to 64% in one year. IBM's 2026 threat work adds two more growth vectors:
      supply-chain incidents are four times higher than five years earlier, and exploitation of public-facing
      applications rose 44% year over year. Together those signals support more proactive, telemetry-rich security
      architectures and create room for vendors that can prioritize high-confidence detections across cloud, network,
      and identity layers. Regulatory AI governance from the FTC, ICO, and CISA further reinforces demand by making
      monitoring and accountability explicit expectations rather than optional best practice.

      The constraints are equally important and more company-specific. Omdia's most adverse point is that XDR
      consolidation already caused higher standalone NDR non-renewal rates from 2022 through 2025. That matters
      because large-platform vendors can turn network visibility into a “good enough” checkbox inside a broader
      contract renewal, especially when buyers are already frustrated by duplicative identity and access tools. Budget
      pressure therefore cuts both ways: it increases demand for better detection outcomes, but it also rewards vendors
      that can consolidate multiple controls into one platform. Add skills shortages, integration work, and switching
      costs from incumbent Microsoft or CrowdStrike deployments, and the result is a market with strong macro growth
      but real renewal risk for specialists. TM004 captures those drivers and constraints as the key diligence agenda
      for underwriting Vectra's future market share.
