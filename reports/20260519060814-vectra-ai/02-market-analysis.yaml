  - id: TM004
    title: Growth Drivers and Constraints Table
    columns:
      - driver/constraint
      - direction
      - timing
      - implication
      - diligence ask
    rows:
      - - AI-related vulnerabilities and AI-tool security assessments are rising sharply
        - driver
        - 2025-2031
        - Supports demand for higher-fidelity monitoring and proactive detection across hybrid environments.
        - How much of Vectra AI's pipeline is tied to AI-governance or AI-security programs versus traditional SecOps replacement?
      - - Identity sprawl and duplicated access-management tooling
        - driver
        - current
        - Improves the value proposition for ITDR-led consolidation and cross-domain signal correlation.
        - What percentage of wins start from identity-security pain rather than pure network detection pain?
      - - Cloud-delivered MDR growing fastest at 25.2% CAGR
        - driver
        - 2026-2031
        - Favors vendors that can operate across cloud, network, identity, and managed-service channels.
        - How much of Vectra's new ARR comes from cloud-first or managed-service-led deployments post-Netography?
      - - Supply-chain attacks and public-facing application exploitation continue to rise
        - driver
        - current
        - Increases budget priority for lateral-movement detection, cloud visibility, and trusted-path monitoring.
        - Are Vectra wins clustered after incidents or audits that expose east-west visibility gaps?
      - - FTC, ICO, and CISA AI-governance requirements
        - driver
        - 2025-2026
        - Creates compliance-led demand in government, regulated enterprise, and critical infrastructure.
        - What revenue exposure does Vectra have to public sector, defense, and critical-infrastructure accounts?
      - - XDR platform consolidation displacing standalone NDR renewals
        - constraint
        - current
        - Makes renewal defense harder unless detection quality or niche visibility is materially better than bundled alternatives.
        - Request churn and renewal data segmented by incumbent XDR overlap.
      - - Budget pressure and security-tool duplication
        - constraint
        - current
        - Buyers increasingly prefer fewer vendors and broader suites, pressuring specialist expansion seats.
        - Where does Vectra replace existing tools versus add to an already crowded stack?
      - - Skills shortage and deployment complexity
        - constraint
        - 2026 onward
        - Longer pilots, slower procurement, and heavier reliance on partners or MDR overlays.
        - What services attach rate and partner-led deployment model are required to land and expand efficiently?
    notes: >-
      The table mixes macro growth drivers with company-specific constraints. It is designed as a diligence agenda,
      not a scoring grid, and therefore pairs each force with the practical underwriting question it creates.
