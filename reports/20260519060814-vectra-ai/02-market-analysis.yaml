  - id: section-buyer-landscape
    title: Buyers, Users, and Adoption Paths
    body: >
      The primary Vectra AI buyer is the enterprise security-operations organization running a hybrid environment with
      enough network complexity, cloud sprawl, and identity exposure that generic log correlation or endpoint-only
      tools leave visible gaps. In practice that means Global 2000 enterprises, financial services, healthcare,
      government, defense-adjacent operators, and other regulated organizations with mature SOCs and meaningful breach
      costs. The day-to-day user is usually the SOC analyst, threat hunter, incident responder, or detection engineer;
      the payer is more often the CISO, CIO, or CTO; and the budget owner may sit in security operations, platform
      engineering, identity security, or a combined cyber-risk office depending on whether the deployment is justified
      as detection efficacy, identity risk reduction, or tool consolidation.

      Secondary buyers matter because they change the go-to-market math. MSSPs and MDR providers can buy Vectra as a
      telemetry layer or service accelerator, especially when analyst scarcity and alert fatigue make productivity a
      bigger purchasing driver than raw threat volume. OT/ICS operators form a smaller but strategically important
      segment because unmanaged assets and east-west traffic weaken endpoint-led alternatives. Microsoft's RSAC 2026
      identity-security work is central to the adoption story: 32% of organizations say access-management tools are
      duplicative and 40% say they have too many identity vendors, which implies real appetite for fewer consoles and a
      tighter identity-control plane. Adoption triggers therefore cluster around identity sprawl, incident response
      fatigue, critical-infrastructure mandates, AI-risk governance, and breaches that expose blind spots in existing
      XDR or SIEM stacks. TM003 maps buyer-user-payer relationships, FM003 turns that into segment-specific buying
      paths, and FM004 shows where procurement friction tends to slow conversion.
    claimRefs:
      - CM006
