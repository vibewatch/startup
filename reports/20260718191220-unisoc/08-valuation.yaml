- id: section-v-2
  title: Why the valuation should still trade at a discount
  body: The discount versus listed global leaders is easy to justify. Qualcomm, MediaTek and ARM benefit from audited transparency, visible profitability and stronger IP or ecosystem control. Unisoc lacks that public proof today and carries additional governance and sanctions overhang, so a much lower absolute market value and a restrained revenue multiple are both rational. A remaining diligence gap is What valuation range do underwriters and cornerstone investors use once audited filings are available?. The most concrete next step is to Monitor IPO prospectus and pre-marketing commentary.. A remaining diligence gap is How much of the multiple should be attributed to strategic domestic-chip optionality versus current earnings power?. The most concrete next step is to Reassess after audited margins and segment revenue become public.. A remaining diligence gap is What valuation range do underwriters and cornerstone investors use once audited filings are available?. The most concrete next
