- id: section-u-2
  title: Interpreting the long customer list
  body: The official logo list is strategically useful but should be interpreted carefully. It shows wide market acceptance and ecosystem compatibility, yet it does not reveal current share of wallet by brand or whether relationships are active, material and profitable. In diligence terms, logo breadth supports commercial credibility; revenue concentration remains an open question until filings disclose top-customer exposure. A remaining diligence gap is Which OEMs comprise the top five customers by revenue or unit volume?. The most concrete next step is to Review IPO prospectus customer concentration note when available.. A remaining diligence gap is How much revenue now comes from non-smartphone customers?. The most concrete next step is to Look for segment disclosures in IPO materials.. A remaining diligence gap is Which OEMs comprise the top five customers by revenue or unit volume?. The most concrete next step is to Review IPO prospectus customer concentration note when available..
