chapter:
  number: 6
  title: Customers
  summary: 'Customer evidence supports a real multi-brand device footprint, especially in emerging-market Android. Primary and near-primary proof exists for Xiaomi, nubia/ZTE and Transsion-linked devices, while official materials list a wider set of global and regional OEMs. The main unknown is concentration: public sources do not reveal which brands drive most revenue or units.'
sections:
- id: section-u-1
  title: Best direct customer proof
  body: The best customer evidence comes from actual device pages rather than brand lists alone. Xiaomi explicitly discloses a Unisoc T7250 in Redmi A5, and Unisoc's own 2025 launch note names the T8300 and T9100 inside nubia Neo 3 devices. GSMArena adds independent confirmation that Infinix Smart 10 ships with a T7250, reinforcing the strength of Unisoc's position in Transsion-linked channels. A remaining diligence gap is Which OEMs comprise the top five customers by revenue or unit volume?. The most concrete next step is to Review IPO prospectus customer concentration note when available.. A remaining diligence gap is How much revenue now comes from non-smartphone customers?. The most concrete next step is to Look for segment disclosures in IPO materials.. A remaining diligence gap is Which OEMs comprise the top five customers by revenue or unit volume?. The most concrete next step is to Review IPO prospectus customer concentration note when available.. A remaining diligence gap is How
    much revenue now comes from non-smartphone customers?. The most concrete next step is to Look for segment disclosures in IPO materials.. A remaining diligence gap is Which OEMs comprise the top five customers by revenue or unit volume?. The most concrete next step is to Review IPO prospectus customer concentration note when available.. A remaining diligence gap is How much revenue now comes from non-smartphone customers?. The most concrete next step is to Look for segment disclosures in IPO materials..
