- id: section-o-2
  title: Formation and ownership context
  body: 'The company''s modern identity reflects the consolidation of Spreadtrum and RDA assets inside Tsinghua Unigroup and their later operation under the restructured group. C114''s 2025 IPO coverage says the controlling shareholder held 32.22%, with major state-backed semiconductor funds and Intel China also on the cap table. That structure explains why Unisoc is strategically important to China''s domestic chip agenda while still carrying legacy group-governance baggage.


    Because the fetched public English corpus does not provide a strong primary-source management page naming the active operating CEO, leadership precision should wait for a prospectus or updated governance filing. In diligence terms, the absence of easy executive disclosure matters less for product legitimacy than for assessing decision quality, board independence and IPO readiness. A remaining diligence gap is Who is the current day-to-day operating CEO or equivalent named in a primary corporate or filing source?. The most concrete next step is to Recheck prospectus, CSRC filings or refreshed corporate governance pages once public.. A remaining diligence gap is What is the exact current shareholder table after 2025 financing and restructuring steps?. The most concrete next step is to Obtain current shareholding disclosure from IPO guidance materials or pre-prospectus filings..'
