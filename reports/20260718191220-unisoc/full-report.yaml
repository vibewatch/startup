              Official materials show a broad business mix across smartphone application processors, AIoT connectivity,
              automotive cockpit chips and platform technologies; independent coverage adds private-market metrics
              including >RMB14.5B 2024 revenue and roughly 1.6B chips shipped. The operating footprint—19 R&D centers,
              eight sales/support sites, 140+ countries and 270 operators—supports the view that Unisoc already behaves
              like a late-stage platform company awaiting public-market access.


