        title: Why Unisoc matters now
        blocks:
          - type: paragraph
            body: >-
              Unisoc matters because it occupies an increasingly rare position: a scaled non-U.S. mobile SoC supplier
              with meaningful share in cost-sensitive Android markets and a pathway into adjacent automotive and IoT
              silicon. ANI/C114 market-share data place the company near 14% of global smartphone AP share in late 2024,
              while official product launches show current 6nm 5G parts and vehicle silicon rather than only legacy
              feature-phone chips. That combination gives the company strategic optionality even before profitability is
              fully transparent. A remaining diligence gap is Who is the current day-to-day operating CEO or equivalent
