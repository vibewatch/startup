companyProfile:
  summary: >-
    Unisoc (紫光展锐 / UNISOC Technologies) is a Shanghai-headquartered private fabless semiconductor company created from
    the Spreadtrum/RDA mobile-chip lineage and now positioned as a core operating asset within the restructured Tsinghua
    Unigroup ecosystem. The company sells smartphone application processors, feature-phone and tablet chipsets, cellular
    IoT connectivity products, and an emerging automotive cockpit silicon line. Public 2025 reporting indicates more
    than RMB14.5B of 2024 revenue, roughly 1.6B chip shipments, rapid 5G mix growth, and a pre-IPO valuation near
    RMB70B.
  foundedDate: '2018-01-01'
  foundingLocation: Shanghai, China
  headquarters: Shanghai, China
  productSummary: >-
    ARM-based smartphone SoCs (including newer 6nm 5G platforms), feature-phone and tablet chipsets, cellular IoT modems
    from NB-IoT through 5G/RedCap, and smart-cockpit / automotive silicon.
  customerFocus: >-
    Android OEMs and channel-driven device makers in emerging markets, plus IoT device manufacturers, operators, and
    selected automotive customers.
  businessModel: >-
    Fabless semiconductor revenue model based on per-chip sales, reference-platform enablement, and long-tail
    regional/channel support rather than a stand-alone software subscription stream.
  stage: private / pre-IPO
  fundingStatus: >-
    2025 public reporting indicates active STAR Market IPO preparation following shareholding reform and counseling
    registration. Publicly disclosed valuation anchors cluster around RMB70B; complete current cap-table and audited
    financing disclosures remain unavailable.
