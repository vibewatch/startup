      - number: '2.2'
        title: Regional demand drivers
        blocks:
          - type: paragraph
            body: >-
              India remains central because the market is still large by units and already mostly 5G on the demand side,
              so a supplier that can hit affordable BOM targets and operator certifications can scale quickly. Africa
              matters for a different reason: smartphone replacement and first-time mobile internet adoption still lean
              heavily toward low-cost devices, and Canalys/GSMA evidence shows strong growth in the cheapest bands where
              Unisoc has historically competed best. China adds a third driver through industrial policy and sheer
              communications scale, reinforcing the strategic value of a domestic design house even when export-market
              profitability is unclear. A remaining diligence gap is What is the best current external estimate of the
