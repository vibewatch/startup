  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Direct merchant-silicon rivals
        blocks:
          - type: paragraph
            body: >-
              MediaTek is the closest direct analogue because it sells merchant Android platforms across price bands and
              is structurally comfortable competing on both feature depth and cost efficiency. Qualcomm is strategically
              more important than tactically equivalent: it constrains the upper end of Android and defines modem/IP
              standards, but Unisoc more often collides with it when aspiring above entry tiers than in core sub-premium
              share battles. Samsung and HiSilicon matter as intermittent or captive-ecosystem rivals, while Rockchip is
              a better adjacent-IoT comparison than a pure handset benchmark. A remaining diligence gap is What are
