      - number: '2.3'
        title: Why units do not equal profits
        blocks:
          - type: paragraph
            body: >-
              The smartphone SoC market is attractive in volume but asymmetric in profit capture. Apple vertically
              retains premium economics, Qualcomm monetizes top-tier Android and modem IP, and MediaTek converts scale
              into broad platform leverage. Unisoc therefore competes most often where price elasticity is highest,
              which makes execution on cost, time-to-design-win and customer support more decisive than pure benchmark
              leadership. A remaining diligence gap is What is the best current external estimate of the global
