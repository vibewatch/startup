            body: >-
              The company's modern identity reflects the consolidation of Spreadtrum and RDA assets inside Tsinghua
              Unigroup and their later operation under the restructured group. C114's 2025 IPO coverage says the
              controlling shareholder held 32.22%, with major state-backed semiconductor funds and Intel China also on
              the cap table. That structure explains why Unisoc is strategically important to China's domestic chip
              agenda while still carrying legacy group-governance baggage.


