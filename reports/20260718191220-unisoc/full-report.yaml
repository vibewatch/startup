  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Current valuation view
        blocks:
          - type: paragraph
            body: >-
              The cleanest public valuation anchor is the cluster of 2025 IPO-related reports citing about RMB70B for
              Unisoc. Relative to >RMB14.5B 2024 revenue, that implies a high-single-digit strategic quality narrative
              but only a mid-single-digit revenue multiple. For a private fabless company with real market share and
              strategic domestic relevance, that is plausible—especially if investors expect IPO disclosure to de-risk
              the story further. A remaining diligence gap is What valuation range do underwriters and cornerstone
              investors use once audited filings are available?. The most concrete next step is to Monitor IPO
              prospectus and pre-marketing commentary.. A remaining diligence gap is How much of the multiple should be
              attributed to strategic domestic-chip optionality versus current earnings power?. The most concrete next
              step is to Reassess after audited margins and segment revenue become public.. A remaining diligence gap is
