  topStrengths:
    - 真实世界规模可观：公开报道提到收入 >RMB14.5B、2024 年芯片出货约 1.6B 颗、2024 年 Q4 全球智能手机 AP 份额约 14%。
    - 产品和渠道覆盖面广，横跨智能手机、平板、功能机、蜂窝 IoT，并开始切入汽车座舱；公司称分销覆盖 140+ 个国家。
    - 作为中国最大的本土移动芯片设计公司之一，Unisoc 的政策相关性和 IPO 可选性，超过典型入门级手机供应商。
    - 客户证据覆盖品牌 OEM 和新兴市场渠道，包括 Xiaomi、nubia/ZTE、Transsion 相关设备，以及更广的运营商 / 终端分销。
  topRisks:
    - Tsinghua Unigroup 历史遗留问题和 Zhao Weiguo 腐败案件，给治理与声誉留下包袱，可能压低估值和投资者信心。
    - 公开披露仍不完整：抓取语料中未找到经审计盈利、现金、杠杆或详细股权结构信息。
    - Unisoc 身处价格敏感的 Android 档位，MediaTek 和 Qualcomm 都能挤压份额、毛利率和上探速度。
    - 出口管制和供应链依赖仍是实质风险，因为先进无晶圆路线图依赖外部 IP、工具和制造准入。
  unresolvedGaps:
    - 公开语料仍缺少招股书级别的领导层、董事会和当前股权结构披露；这些是干净 IPO 尽调的前提。
    - 经审计毛利率、经营利润率、烧钱速度、现金余额和债务仍不可得。
    - 智能手机、IoT 和汽车收入拆分尚未公开，限制了精确的 TAM 和估值工作。
    - 未来美国相关出口管制收紧的具体敞口仍未量化。
