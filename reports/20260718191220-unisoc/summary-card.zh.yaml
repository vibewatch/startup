summary:
  headline: Unisoc 是有规模的中国私营无晶圆芯片厂商，在价值型智能手机芯片中拥有可观全球份额，也有 IPO 动能；但治理历史、地缘政治风险和财务披露不完整，使结论更适合观察，不是买入。
