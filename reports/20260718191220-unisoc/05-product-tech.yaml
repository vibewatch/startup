- id: section-e-2
  title: Where the technology story is still constrained
  body: The biggest technical limitation in public diligence is not absence of products but lack of deeper disclosure on software ecosystems, long-term support cadence and manufacturing partners. Merchant mobile silicon is inherently dependent on external foundries and common IP stacks; without clearer evidence of proprietary leverage, Unisoc's product thesis remains one of credible fast-following execution rather than category-defining technology leadership. A remaining diligence gap is Which foundries and packaging partners serve each current-generation product family?. The most concrete next step is to Review future prospectus supplier disclosures or conference materials.. A remaining diligence gap is How sticky is the software enablement stack versus MediaTek or Qualcomm?. The most concrete next step is to Seek SDK, BSP and customer-support documentation or OEM interviews.. A remaining diligence gap is Which foundries and packaging partners serve each current-generation product family?.
