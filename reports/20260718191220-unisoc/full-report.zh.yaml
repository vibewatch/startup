      - number: '1.2'
        title: 形成与股权背景
        blocks:
          - type: paragraph
            body: >-
              公司的现代身份来自 Tsinghua Unigroup 体系内对 Spreadtrum 和 RDA 资产的整合，以及此后在重组集团下的运营。 C114 的 2025 年 IPO 报道称，控股股东持股
              32.22%，主要国资背景半导体基金和 Intel China 也在股东表中。 这一结构解释了 Unisoc 为什么对中国国产芯片议程有战略重要性，同时也继续背负旧集团治理遗留包袱。


              已抓取的公开英文语料没有提供强一手管理层页面，无法确认当前经营 CEO 姓名，因此领导层精确性应等招股书或更新后的治理申报。 尽调上，缺少易取得的高管披露，对产品真实性的影响小于对决策质量、董事会独立性和 IPO
              准备度的评估。 剩余尽调缺口：一手公司资料或申报文件中，谁被列为当前负责日常经营的 CEO 或同等角色？最具体下一步： 待招股书、CSRC 文件或更新后的公司治理页面公开后复核。剩余尽调缺口：2025
