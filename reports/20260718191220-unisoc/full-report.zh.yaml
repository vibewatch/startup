  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 当前估值判断
        blocks:
          - type: paragraph
            body: >-
              最干净的公开估值锚，是 2025 年 IPO 相关报道中围绕 Unisoc 约 RMB70B 的一组口径。相对 2024 年收入
              >RMB14.5B，这意味着一个高个位数战略质量叙事，但收入倍数只有中个位数。对一家拥有真实市场份额、 具备国产战略相关性的未上市无晶圆厂公司来说，这个水平说得通——尤其在投资人预期 IPO
              披露会进一步给故事去风险时。 剩余尽调缺口：经审计申报可用后，承销商和基石投资人使用什么估值区间？最具体下一步：跟踪 IPO 招股书和预路演评论。
              剩余尽调缺口：估值倍数中有多少应归因于国产芯片战略期权，而非当前盈利能力？最具体下一步：经审计利润率和分部收入公开后重新评估。
              剩余尽调缺口：经审计申报可用后，承销商和基石投资人使用什么估值区间？最具体下一步：跟踪 IPO 招股书和预路演评论。
