      - number: '6.2'
        title: 如何解读长客户名单
        blocks:
          - type: paragraph
            body: >-
              官方标识名单有战略参考价值，但需要谨慎解读。它显示市场接受度和生态兼容性很宽，却不说明每个品牌当前钱包份额，
