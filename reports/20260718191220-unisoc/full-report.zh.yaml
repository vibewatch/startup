  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 直接外售芯片对手
        blocks:
          - type: paragraph
            body: >-
              MediaTek 是最接近的直接可比公司，因为它跨价格带销售 Android 开放平台，也习惯同时拼功能深度和成本效率。 Qualcomm 的战略重要性高于战术相似性：它约束 Android
              高端市场并定义调制解调器 / IP 标准，但 Unisoc 更多是在向入门级以上爬升时碰到它，而不是在核心次高端份额战中正面相撞。Samsung 和 HiSilicon 是间歇性或封闭生态对手；Rockchip
              更适合作相邻 IoT 可比，而不是纯手机基准。剩余尽调缺口： 在精确的入门级 Android 细分市场，各可比公司的当前毛利率或 ASP 差异是多少？最具体下一步： 使用付费分析师数据或未来 IPO
              文件。剩余尽调缺口：在精确的入门级 Android 细分市场， 各可比公司的当前毛利率或 ASP 差异是多少？最具体下一步：使用付费分析师数据或未来 IPO 文件。 剩余尽调缺口：在精确的入门级 Android
              细分市场，各可比公司的当前毛利率或 ASP 差异是多少？ 最具体下一步：使用付费分析师数据或未来 IPO 文件。剩余尽调缺口：在精确的入门级 Android 细分市场， 各可比公司的当前毛利率或 ASP
