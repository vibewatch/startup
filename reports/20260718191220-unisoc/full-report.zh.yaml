      - number: '3.2'
        title: Unisoc 仍能赢在哪里
        blocks:
          - type: paragraph
            body: >-
              客户把整体平台可负担性、本地化支持和够用但不领先的性能放在第一位时，Unisoc 能赢。这一画像适合 Transsion 式新兴市场品牌、大型 OEM 的入门设备，以及仍奖励高度定制参考平台的运营商或渠道。
