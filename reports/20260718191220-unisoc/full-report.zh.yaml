      - number: '2.2'
        title: 区域需求驱动因素
        blocks:
          - type: paragraph
            body: >-
              印度仍是核心，因为按出货量看市场依然很大，需求端也已大多转向 5G；供应商只要打中可负担 BOM 目标并通过运营商认证，
              就能快速放量。非洲的重要性不同：智能手机替换和首次移动互联网采用仍明显偏向低成本设备，Canalys/GSMA 证据显示， 最便宜价位段增长强劲，而这正是 Unisoc
              历来竞争力最强的区域。中国则通过产业政策和庞大通信规模提供第三个驱动， 即便出口市场盈利能力不清楚，国产设计公司的战略价值仍被强化。剩余尽调缺口：针对 Android 中低端层级， 全球智能手机 AP/SOC
              收入池目前最好的外部估算是多少？最具体下一步：查看付费分析师来源或未来招股书中的 TAM 页面。 剩余尽调缺口：Unisoc 收入中已有多少来自 IoT 和汽车，而非手机？最具体下一步：在 IPO
