  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 主要风险栈
        blocks:
          - type: paragraph
            body: >-
              最重的一层风险来自声誉和治理：即便 Unisoc 不等同于旧 Tsinghua Unigroup，公开市场投资人也必然会把公司与集团此前债务危机、 Zhao Weiguo
              腐败案联系起来。第二层是结构性经营风险——高性价比手机层级竞争激烈，可能依赖外部制造，财务披露也不完整。 第三层是地缘政治：扩大出口管制今天未必直接针对
              Unisoc，但会随时间改变设计工具可得性、客户风险偏好或供应链灵活性。 剩余尽调缺口：有多少收入依赖任何美国关联工具、IP、客户或供应路径？最具体下一步：查看招股书供应商 / 客户依赖披露。
              剩余尽调缺口：在更严管制下，6nm 产品当前制造通道有多稳？最具体下一步：在未来申报中寻找晶圆厂和具体制程节点披露。
              剩余尽调缺口：有多少收入依赖任何美国关联工具、IP、客户或供应路径？最具体下一步：查看招股书供应商 / 客户依赖披露。 剩余尽调缺口：在更严管制下，6nm
