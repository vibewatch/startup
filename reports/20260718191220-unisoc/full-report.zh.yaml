      - number: '2.3'
        title: 为什么出货量不等于利润
        blocks:
          - type: paragraph
            body: >-
              智能手机 SoC 市场出货量诱人，但利润分配并不对称。Apple 通过垂直整合留住高端经济性， Qualcomm 靠高端 Android 和调制解调器 IP 变现，MediaTek 则把规模转成宽平台杠杆。因此
              Unisoc 更常竞争在价格弹性最高的区域，成本、design-win 周期和客户支持执行力，比单纯跑分领先更关键。 剩余尽调缺口：针对 Android 中低端层级，全球智能手机 AP/SOC
              收入池目前最好的外部估算是多少？ 最具体下一步：查看付费分析师来源或未来招股书中的 TAM 页面。剩余尽调缺口：Unisoc 收入中已有多少来自 IoT 和汽车，而非手机？最具体下一步：在 IPO
              营销期间寻找招股书分部披露或投资人材料。剩余尽调缺口： 针对 Android 中低端层级，全球智能手机 AP/SOC 收入池目前最好的外部估算是多少？最具体下一步： 查看付费分析师来源或未来招股书中的 TAM
              页面。剩余尽调缺口：Unisoc 收入中已有多少来自 IoT 和汽车， 而非手机？最具体下一步：在 IPO 营销期间寻找招股书分部披露或投资人材料。
