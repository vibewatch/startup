  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: Unisoc 实际服务哪些市场
        blocks:
          - type: paragraph
            body: >-
              Unisoc 的真实市场不是整个半导体宇宙，而是一组出货量很重的连接类品类：智能手机应用处理器、功能机和平板芯片组、 蜂窝 IoT 调制解调器，以及如今的汽车座舱 /
              车联网芯片。重要之处在于，即使单台设备经济性有限，单位机会仍很大。 官方产品宽度也意味着，市场韧性要靠调制解调器、RF 和平台 IP 在多个细分间复用，而不是靠某一轮旗舰手机周期。 剩余尽调缺口：针对
              Android 中低端层级，全球智能手机 AP/SOC 收入池目前最好的外部估算是多少？最具体下一步： 查看付费分析师来源或未来招股书中的 TAM 页面。剩余尽调缺口：Unisoc 收入中已有多少来自 IoT
              和汽车，而非手机？ 最具体下一步：在 IPO 营销期间寻找招股书分部披露或投资人材料。剩余尽调缺口：针对 Android 中低端层级， 全球智能手机 AP/SOC
