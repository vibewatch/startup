      - number: '8.2'
        title: 估值为什么仍应折价
        blocks:
          - type: paragraph
            body: >-
              相比已上市全球龙头，折价很容易解释。Qualcomm、MediaTek 和 ARM 有经审计透明度、可见盈利能力， 以及更强的 IP 或生态控制。Unisoc
              今天缺少这种公开证明，还背负额外治理和制裁阴影，因此绝对市值低得多、 收入倍数更克制，都是理性的。剩余尽调缺口：经审计申报可用后，承销商和基石投资人使用什么估值区间？ 最具体下一步：跟踪 IPO
