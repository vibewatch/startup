    sections:
      - number: '1.1'
        title: 当前公司快照
        blocks:
          - type: paragraph
            body: >-
              Unisoc 更像一家已有规模的中国无晶圆厂半导体供应商，而不是早期创业公司。官方材料显示， 公司业务覆盖智能手机应用处理器、AIoT 连接、汽车座舱芯片和平台技术；独立报道补充了私募市场指标， 包括 2024
              年收入 >RMB14.5B、芯片出货量约 1.6B 颗。其经营足迹——19 个研发中心、8 个销售 / 支持站点、覆盖 140+ 个国家和 270 家运营商——支撑一个判断：Unisoc
              已经像等待进入公开市场的后期平台公司。


              总部位于上海，官方联系方式明确，并在多座城市设有研发网络。产品组合覆盖智能手机 SoC、AIoT 连接、 车载芯片和底层平台 IP。2025 年报道显示，公司股改后接受科创板辅导，说明 IPO
              工作流已经具体启动。 剩余尽调缺口：一手公司资料或申报文件中，谁被列为当前负责日常经营的 CEO 或同等角色？最具体下一步： 待招股书、CSRC 文件或更新后的公司治理页面公开后复核。剩余尽调缺口：2025
