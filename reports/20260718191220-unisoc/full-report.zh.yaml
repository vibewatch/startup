companyProfile:
  summary: >-
    Unisoc（紫光展锐 / UNISOC Technologies）是一家总部位于上海的未上市无晶圆厂半导体公司， 源自 Spreadtrum/RDA 移动芯片脉络，目前是重组后 Tsinghua Unigroup
    生态中的核心经营资产。 公司销售智能手机应用处理器、功能机和平板芯片组、蜂窝 IoT 连接产品，并开始布局汽车座舱芯片。 2025 年公开报道显示，其 2024 年收入超过 RMB14.5B，芯片出货量约 1.6B 颗，5G
    占比增长很快， IPO 前估值接近 RMB70B。
  foundedDate: '2018-01-01'
  foundingLocation: Shanghai, China
  headquarters: Shanghai, China
  productSummary: 基于 ARM 的智能手机 SoC（包括较新的 6nm 5G 平台）、功能机和平板芯片组、覆盖 NB-IoT 到 5G/RedCap 的蜂窝 IoT 调制解调器，以及智能座舱 / 汽车芯片。
  customerFocus: 新兴市场中的 Android OEM 和渠道驱动型设备厂商，以及 IoT 设备制造商、运营商和部分汽车客户。
  businessModel: 无晶圆厂半导体收入模式，核心是按芯片销售、参考平台使能和长尾区域 / 渠道支持，而非独立软件订阅收入流。
  stage: private / pre-IPO
  fundingStatus: 2025 年公开报道显示，公司完成股改并办理辅导备案后，正在推进科创板 IPO 准备。公开披露的估值锚大多落在 RMB70B 附近；完整的当前股权结构和经审计融资披露仍不可得。
