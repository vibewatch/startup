      - number: '7.2'
        title: 这些风险为何最影响 IPO 时点
        blocks:
          - type: paragraph
            body: >-
              对后期未上市半导体公司来说，风险不必致命，也足以带来经济影响。一家公司可以增长、出货数十亿颗芯片， 但只要投资人质疑治理洁净度、利润率耐久性或制裁韧性，公开市场仍会给折价。Unisoc 的框架大致如此：
              经营规模可信，但估值继续扩张的举证责任落在披露质量和风险控制上。剩余尽调缺口：有多少收入依赖任何美国关联工具、 IP、客户或供应路径？最具体下一步：查看招股书供应商 / 客户依赖披露。剩余尽调缺口：在更严管制下，
