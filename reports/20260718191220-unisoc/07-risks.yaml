chapter:
  number: 7
  title: Risks
  summary: Unisoc's main risks are governance overhang from old Tsinghua Unigroup history, aggressive competition in thin-margin Android tiers, supply-chain and export-control dependence, and weak financial transparency ahead of IPO. None alone clearly breaks the company, but together they likely cap valuation and raise diligence burden for public investors.
sections:
- id: section-r-1
  title: Primary risk stack
  body: 'The heaviest risk layer is reputational and governance-driven: even though Unisoc is not identical to old Tsinghua Unigroup, public investors will inevitably connect the business to the group''s prior debt crisis and Zhao Weiguo corruption case. The second layer is structural business risk—intense competition in value-sensitive handset tiers, probable external manufacturing dependence and incomplete financial disclosure. The third layer is geopolitical: widening export controls may not target Unisoc directly today, but they can alter design-tool access, customer risk appetite or supply-chain flexibility over time. A remaining diligence gap is What portion of revenue depends on any U.S.-linked tools, IP, customers or supply routes?. The most concrete next step is to Review prospectus supplier/customer dependency disclosure.. A remaining diligence gap is How resilient is current manufacturing access for 6nm products under tighter controls?. The most concrete next step is to Seek foundry
    and node-specific disclosure in future filings.. A remaining diligence gap is What portion of revenue depends on any U.S.-linked tools, IP, customers or supply routes?. The most concrete next step is to Review prospectus supplier/customer dependency disclosure.. A remaining diligence gap is How resilient is current manufacturing access for 6nm products under tighter controls?. The most concrete next step is to Seek foundry and node-specific disclosure in future filings.. A remaining diligence gap is What portion of revenue depends on any U.S.-linked tools, IP, customers or supply routes?. The most concrete next step is to Review prospectus supplier/customer dependency disclosure.. A remaining diligence gap is How resilient is current manufacturing access for 6nm products under tighter controls?. The most concrete next step is to Seek foundry and node-specific disclosure in future filings..'
