- id: section-r-2
  title: Why these risks matter most for IPO timing
  body: 'For a late-stage private semiconductor company, risks need not be existential to matter economically. A business can grow, ship billions of chips and still suffer a public-market discount if investors question governance cleanliness, margin durability or sanction resilience. That appears to be the relevant framing for Unisoc: credible operating scale exists, but the burden of proof for valuation expansion sits in disclosure quality and risk containment. A remaining diligence gap is What portion of revenue depends on any U.S.-linked tools, IP, customers or supply routes?. The most concrete next step is to Review prospectus supplier/customer dependency disclosure.. A remaining diligence gap is How resilient is current manufacturing access for 6nm products under tighter controls?. The most concrete next step is to Seek foundry and node-specific disclosure in future filings.. A remaining diligence gap is What portion of revenue depends on any U.S.-linked tools, IP, customers or supply
    routes?. The most concrete next step is to Review prospectus supplier/customer dependency disclosure.. A remaining diligence gap is How resilient is current manufacturing access for 6nm products under tighter controls?. The most concrete next step is to Seek foundry and node-specific disclosure in future filings..'
