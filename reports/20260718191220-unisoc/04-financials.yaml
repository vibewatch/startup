- id: section-i-2
  title: What is still missing
  body: None of the reviewed materials provided audited income statements, cash-flow detail, gross margins, debt levels or capitalized R&D policy. That absence matters because fabless chip businesses can look strategically valuable while remaining earnings-volatile. Until a prospectus lands, Unisoc's financial assessment should focus on scale and momentum rather than presumed profitability. A remaining diligence gap is What were Unisoc's 2024 gross margin, operating margin and net income?. The most concrete next step is to Wait for IPO prospectus or audited filing.. A remaining diligence gap is How much cash and debt sat on the balance sheet after 2024 financings?. The most concrete next step is to Review prospectus risk-factor and capitalization sections when available.. A remaining diligence gap is What were Unisoc's 2024 gross margin, operating margin and net income?. The most concrete next step is to Wait for IPO prospectus or audited filing.. A remaining diligence gap is How much cash
