chapter:
  number: 4
  title: Financials
  summary: 'Public financial evidence is limited but meaningful: 2024 revenue reportedly topped RMB14.5B, shipments reached about 1.6B chips, and 5G sales grew sharply. At a reported ~RMB70B valuation, Unisoc screens near a mid-single-digit revenue multiple. The major caveat is the absence of audited profitability and cash-flow disclosure.'
sections:
- id: section-i-1
  title: Best available scale metrics
  body: 'The fetched public record supports three central financial signals: revenue above RMB14.5B in 2024, chip shipments around 1.6B units, and strong 5G growth. Together these indicate a business with real scale and volume leverage, though not necessarily premium pricing power. Shipment intensity relative to revenue strongly suggests Unisoc still carries a large mix of lower-ASP products even as 5G ramps. A remaining diligence gap is What were Unisoc''s 2024 gross margin, operating margin and net income?. The most concrete next step is to Wait for IPO prospectus or audited filing.. A remaining diligence gap is How much cash and debt sat on the balance sheet after 2024 financings?. The most concrete next step is to Review prospectus risk-factor and capitalization sections when available.. A remaining diligence gap is What were Unisoc''s 2024 gross margin, operating margin and net income?. The most concrete next step is to Wait for IPO prospectus or audited filing.. A remaining diligence
    gap is How much cash and debt sat on the balance sheet after 2024 financings?. The most concrete next step is to Review prospectus risk-factor and capitalization sections when available.. A remaining diligence gap is What were Unisoc''s 2024 gross margin, operating margin and net income?. The most concrete next step is to Wait for IPO prospectus or audited filing.. A remaining diligence gap is How much cash and debt sat on the balance sheet after 2024 financings?. The most concrete next step is to Review prospectus risk-factor and capitalization sections when available..'
