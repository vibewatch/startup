summary:
  headline: >-
    Unisoc is a scaled private Chinese fabless chip vendor with meaningful global share in value-tier smartphone silicon
    and active IPO momentum, but governance history, geopolitical risk, and incomplete financial disclosure support a
    TRACK recommendation rather than a buy call.
