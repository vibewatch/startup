chapter:
  number: 3
  title: Competitors
  summary: MediaTek and Qualcomm define the main competitive frame, with MediaTek the clearest direct share threat in mainstream Android. Samsung, Apple, HiSilicon and Rockchip shape adjacent constraints or comparison points. Unisoc's durable wedge is cost-optimized platform supply for emerging-market and entry-smartphone customers, not premium performance leadership.
sections:
- id: section-p-1
  title: Direct merchant-silicon rivals
  body: 'MediaTek is the closest direct analogue because it sells merchant Android platforms across price bands and is structurally comfortable competing on both feature depth and cost efficiency. Qualcomm is strategically more important than tactically equivalent: it constrains the upper end of Android and defines modem/IP standards, but Unisoc more often collides with it when aspiring above entry tiers than in core sub-premium share battles. Samsung and HiSilicon matter as intermittent or captive-ecosystem rivals, while Rockchip is a better adjacent-IoT comparison than a pure handset benchmark. A remaining diligence gap is What are current gross-margin or ASP differences by peer in the exact entry Android segment?. The most concrete next step is to Use paid analyst data or future IPO docs.. A remaining diligence gap is What are current gross-margin or ASP differences by peer in the exact entry Android segment?. The most concrete next step is to Use paid analyst data or future IPO docs..
