- id: section-p-2
  title: Where Unisoc can still win
  body: Unisoc wins where customers prioritize total platform affordability, localized support and acceptable—not category-leading—performance. That profile fits Transsion-style emerging-market brands, entry devices from major OEMs, and operators or channels that still reward highly tailored reference platforms. The downside is that this wedge produces thinner economics and a constant need to defend share against MediaTek feature-down pricing or customer switching when 5G costs fall. A remaining diligence gap is What are current gross-margin or ASP differences by peer in the exact entry Android segment?. The most concrete next step is to Use paid analyst data or future IPO docs.. A remaining diligence gap is What are current gross-margin or ASP differences by peer in the exact entry Android segment?. The most concrete next step is to Use paid analyst data or future IPO docs.. A remaining diligence gap is What are current gross-margin or ASP differences by peer in the exact entry Android
