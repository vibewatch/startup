- id: section-m-3
  title: Why units do not equal profits
  body: The smartphone SoC market is attractive in volume but asymmetric in profit capture. Apple vertically retains premium economics, Qualcomm monetizes top-tier Android and modem IP, and MediaTek converts scale into broad platform leverage. Unisoc therefore competes most often where price elasticity is highest, which makes execution on cost, time-to-design-win and customer support more decisive than pure benchmark leadership. A remaining diligence gap is What is the best current external estimate of the global smartphone AP/SOC revenue pool specific to Android mid/low tier?. The most concrete next step is to Review paid analyst sources or future prospectus TAM slides.. A remaining diligence gap is How much of Unisoc revenue already comes from IoT and automotive rather than handsets?. The most concrete next step is to Look for prospectus segment disclosures or investor presentations during IPO marketing.. A remaining diligence gap is What is the best current external estimate of the global
    smartphone AP/SOC revenue pool specific to Android mid/low tier?. The most concrete next step is to Review paid analyst sources or future prospectus TAM slides.. A remaining diligence gap is How much of Unisoc revenue already comes from IoT and automotive rather than handsets?. The most concrete next step is to Look for prospectus segment disclosures or investor presentations during IPO marketing..
