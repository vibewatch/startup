- id: section-m-2
  title: Regional demand drivers
  body: 'India remains central because the market is still large by units and already mostly 5G on the demand side, so a supplier that can hit affordable BOM targets and operator certifications can scale quickly. Africa matters for a different reason: smartphone replacement and first-time mobile internet adoption still lean heavily toward low-cost devices, and Canalys/GSMA evidence shows strong growth in the cheapest bands where Unisoc has historically competed best. China adds a third driver through industrial policy and sheer communications scale, reinforcing the strategic value of a domestic design house even when export-market profitability is unclear. A remaining diligence gap is What is the best current external estimate of the global smartphone AP/SOC revenue pool specific to Android mid/low tier?. The most concrete next step is to Review paid analyst sources or future prospectus TAM slides.. A remaining diligence gap is How much of Unisoc revenue already comes from IoT and automotive
    rather than handsets?. The most concrete next step is to Look for prospectus segment disclosures or investor presentations during IPO marketing.. A remaining diligence gap is What is the best current external estimate of the global smartphone AP/SOC revenue pool specific to Android mid/low tier?. The most concrete next step is to Review paid analyst sources or future prospectus TAM slides.. A remaining diligence gap is How much of Unisoc revenue already comes from IoT and automotive rather than handsets?. The most concrete next step is to Look for prospectus segment disclosures or investor presentations during IPO marketing..'
