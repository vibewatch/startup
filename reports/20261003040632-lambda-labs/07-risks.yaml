  evidenceGaps:
    - type: "enumeration-incomplete"
      severity: "material"
      topic: "legal-regulatory-record"
      missingEvidence: "A complete litigation, enforcement, licensing, certification, privacy, safety, and export-control record, including pending matters and regulator correspondence."
      whyItMatters: "Public standard terms describe obligations but do not establish whether material violations, disputes, investigations, or exceptions exist."
      diligencePath: "Run counsel-led federal and state docket, regulator, sanctions, export-license, privacy, and certification reviews; reconcile results to management's legal schedule."
      relatedQuestionRefs:
        - "QR007"
      relatedTableRefs:
        - "TR001"
    - type: "private-evidence-only"
      severity: "material"
      topic: "debt-covenants"
      missingEvidence: "Debt principal, rates, maturities, amortization, collateral marks, covenants, cure periods, waivers, and customer-contract coverage by facility."
      whyItMatters: "Cumulative funding raised does not show cash availability, liquidity, or the ability to service fixed obligations through a utilization downturn."
      diligencePath: "Obtain lender agreements, covenant certificates, treasury schedules, borrowing-base reports, and downside coverage models."
      relatedQuestionRefs:
        - "QR005"
        - "QR006"
    - type: "private-evidence-only"
      severity: "material"
      topic: "customer-concentration"
      missingEvidence: "Top-customer revenue, backlog, utilization, termination rights, renewal history, credit support, and deployment-acceptance schedules."
      whyItMatters: "Large counterparties may support financing but can also create correlated utilization and cash-flow risk."
      diligencePath: "Review the top 20 customer contracts and cohort-level revenue, usage, renewal, churn, credit, and concentration schedules."
      relatedQuestionRefs:
        - "QR004"
        - "QR006"
    - type: "private-evidence-only"
      severity: "material"
      topic: "reliability-security"
      missingEvidence: "Audited uptime, material outage and breach history, incident severity, SOC 2 scope and exceptions, penetration results, backup tests, RTO/RPO, and customer SLA remedies."
      whyItMatters: "Company-described controls and contractual risk allocation do not quantify actual service reliability or incident exposure."
      diligencePath: "Obtain status and incident exports, SOC 2 reports, security assessments, business-continuity tests, cyber-insurance claims, and representative enterprise SLAs."
      relatedQuestionRefs:
        - "QR003"
        - "QR006"
        - "QR007"
    - type: "conflicting-data"
      severity: "material"
      topic: "financial-definitions"
      missingEvidence: "Audited or management-certified revenue, ARR, accounting loss, cash burn, gross margin, unrestricted cash, and consistent period definitions."
      whyItMatters: "The assigned sources mix estimates and promotional metrics; revenue, ARR, accounting loss, cash burn, funding raised, and cash available are not interchangeable."
      diligencePath: "Reconcile audited statements and monthly management accounts to bookings, billings, ARR definitions, cash flow, debt draws, and reported external figures."
      relatedQuestionRefs:
        - "QR005"
        - "QR008"
