chapter:
  number: 6
  title: "Customers"
  summary: >-
    Public evidence points to a broad customer base spanning researchers, AI startups,
    enterprises, government users, and strategic infrastructure buyers, but the disclosed
    counts use different dates and undefined denominators. The strongest named commercial
    proof is a reported Microsoft infrastructure agreement; retention, concentration, and
    cohort economics remain private-evidence gaps.
sections:
  - id: "customer-base-and-buyers"
    title: "Customer Base and Buyer Segments"
    body: >-
      Lambda's public customer evidence supports several buyer and user groups, but not a
      revenue-weighted segmentation. A 2024 company post says the early base was primarily
      academic researchers, while a 2026 StartEngine offering page describes AI researchers,
      startups, enterprises, and the U.S. government within a claimed customer base of tens
      of thousands. Lambda's current site adds two procurement surfaces: on-demand instances
      and reserved clusters, with managed, dedicated infrastructure aimed at larger workloads.
      Its privacy policy separately identifies GPU Cloud subscribers, colocation-plan
      subscribers, and hardware purchasers as clients for whom Lambda may process personal
      information. Together these sources support a progression from individual practitioners
      to institutional infrastructure buyers, but they do not disclose buyer, user, and payer
      roles by segment, geographic mix, vertical mix, segment revenue, or active-spend
      thresholds. The segmentation is therefore operational rather than economic.
    claimRefs:
      - "CU004"
      - "CU005"
      - "CU006"
      - "CU007"
    tableRefs:
      - "TU001"
  - id: "adoption-and-customer-proof"
    title: "Adoption Trajectory and Customer Proof"
    body: >-
      The available trajectory is directionally positive but not cohort-comparable. An
      October 2024 Andra Capital memorandum says Lambda served more than 5,000 customers; a
      later StartEngine page says the hardware and cloud business served tens of thousands.
      Neither defines whether the denominator is active accounts, paying organizations,
      cumulative users, hardware purchasers, or cloud subscribers. StartEngine also reports
      $760 million of 2025 ARR and 79% year-over-year growth, but explicitly says its company
      information is not independently verified. Named proof is narrow: the same page reports
      a multibillion-dollar Microsoft agreement and an Amazon relationship involving Capital
      One and DoorDash, while a Welcome.ai article offers unnamed drug-discovery outcomes and
      even leaves its testimonial attribution as a placeholder. These records show commercial
      reach, not independently verified deployment depth, renewal, utilization, or customer
      satisfaction.
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU009"
      - "CU010"
      - "CU011"
      - "CU012"
    tableRefs:
      - "TU002"
      - "TU003"
  - id: "durability-expansion-and-risk"
    title: "Durability, Expansion, and Concentration Risk"
    body: >-
      Lambda describes a plausible expansion path from on-demand compute to reserved,
      managed, and single-tenant infrastructure, and its 2024 post says some startup customers
      built production-inference businesses from zero to millions of dollars in annual
      revenue. That is company-issued outcome evidence, not a disclosed retention cohort.
      Contract terms also create buyer friction: payment obligations are non-cancelable and
      paid fees are non-refundable unless an agreement states otherwise; Lambda has no default
      obligation to maintain or back up customer property; and termination can permit deletion
      of customer property. These provisions do not establish churn, but they raise switching,
      continuity, and procurement questions. The reported Microsoft agreement makes
      top-customer exposure a priority, yet no source provides Microsoft's revenue share,
      top-five or top-ten concentration, NRR, GRR, logo churn, renewal rates, contract length,
      or customer-level utilization. The chapter therefore cannot quantify durability or
      concentration.
    claimRefs:
      - "CU006"
      - "CU008"
      - "CU010"
      - "CU013"
      - "CU014"
      - "CU015"
      - "CU016"
    figureRefs:
      - "FU001"
