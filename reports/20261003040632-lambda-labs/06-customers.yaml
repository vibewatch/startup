callouts:
  - calloutType: "insight"
    title: "Scale Signals Are Not a Customer Cohort"
    body: >-
      The move from more than 5,000 customers to a later claim of tens of thousands and
      $760 million of ARR suggests adoption, but different dates, undefined customer
      denominators, and an unverified ARR source prevent a defensible growth or retention series.
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU012"
  - calloutType: "risk"
    title: "Contract Protections Do Not Substitute for Retention Evidence"
    body: >-
      Non-cancelable fees, limited default backup obligations, and post-termination deletion
      rights may protect Lambda commercially while increasing customer procurement and
      continuity concerns; no public NRR, GRR, churn, or renewal data shows the resulting durability.
    claimRefs:
      - "CU013"
      - "CU014"
      - "CU015"
