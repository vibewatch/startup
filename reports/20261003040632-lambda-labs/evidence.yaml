evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: audited-financials-and-arr
    missingEvidence: >-
      Audited financial statements for FY2025 detailing GAAP revenue, ARR, gross margin across cloud tiers, and customer
      segment retention.
    whyItMatters: >-
      Reported revenue figures ($500M–$520M reported vs $760M claimed in secondary syndicates) diverge widely, impairing
      precise multiple valuation.
    diligencePath: Request management presentation, audited income statements, and SaaS cohort retention schedules under NDA.
    relatedQuestionRefs:
      - QO004
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: >-
      Contractual duration, minimum take-or-pay commitments, and revenue concentration for top 5 customers including
      Microsoft.
    whyItMatters: >-
      Single-tenant AI factory commitments create severe revenue exposure if key hyperscalers adjust infrastructure
      deployment schedules.
    diligencePath: >-
      Review top customer master services agreements (MSAs) and capacity reservation schedules during confirmatory
      diligence.
    relatedQuestionRefs:
      - QO006
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholder-map-coverage
    missingEvidence: >-
      Full capitalization table breakdown showing percentage ownership, liquidation preferences, and board voting seats
      across Series A through E.
    whyItMatters: >-
      Secondary syndicate shares (Series Lambda Labs 4 / QP 1) lack direct voting rights and possess subordinated
      informational access.
    diligencePath: Inspect latest amended Certificate of Incorporation and investor rights agreements filed in Delaware.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: arr-breakdown
    missingEvidence: >-
      Audited segment breakdown of the reported $760M ARR between on-demand cloud, 1-Click Clusters, and the Microsoft
      private contract.
    whyItMatters: >-
      Determines revenue quality, customer concentration risk, and sustainable gross margins across volatile spot vs
      committed revenue.
    diligencePath: Request confidential disclosure schedules or customer revenue concentration tables in pre-IPO diligence.
    relatedQuestionRefs:
      - QM006
  - type: missing-source
    severity: material
    topic: retention-and-churn
    missingEvidence: Net Revenue Retention (NRR) and logo churn rates for Lambda's non-hyperscaler enterprise customer cohort.
    whyItMatters: Validates whether independent AI startups remain on Lambda as workloads mature or migrate to hyperscalers.
    diligencePath: Review cohort retention analyses across 12-month and 24-month customer maturity curves.
    relatedQuestionRefs:
      - QM006
      - QM008
  - type: private-evidence-only
    severity: material
    topic: competitor-contracted-backlog
    missingEvidence: >-
      Audited multi-year contractual backlog and minimum spend commitments for CoreWeave and Lambda Labs enterprise
      accounts.
    whyItMatters: >-
      Directly determines revenue predictability, forward utilization floors, and debt service coverage as new GPU
      architectures launch.
    diligencePath: >-
      Obtain private master services agreements, customer order schedules, and take-or-pay contract terms during data
      room review.
    relatedQuestionRefs:
      - QP002
  - type: missing-source
    severity: minor
    topic: hyperscaler-private-pricing
    missingEvidence: >-
      Negotiated enterprise discount schedules and customized private pricing for NVIDIA H100 and B200 instances on
      Microsoft Azure and Google Cloud.
    whyItMatters: >-
      Enterprise buyers rarely pay published list rates, obscuring true commercial price differentials against Lambda's
      1-Click Clusters.
    diligencePath: Analyze customer enterprise procurement benchmarks and anonymized cloud contract repository data.
    relatedQuestionRefs:
      - QP004
      - QP005
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency-gap
    missingEvidence: Sales cycle, CAC, payback, channel economics, retention, and customer-cohort performance by segment.
    whyItMatters: >-
      Without these inputs, reported growth cannot be separated from inefficient acquisition, concentration, or
      subsidized pricing.
    diligencePath: >-
      Request CRM cohort exports, bookings by channel, sales and marketing allocation, gross-margin retention, and
      CAC-payback calculations.
    relatedQuestionRefs:
      - QI003
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy-gap
    missingEvidence: >-
      Current cash, restricted cash, operating and capex burn, debt schedule, covenants, collateral, leases, project
      finance, and committed GPU purchases.
    whyItMatters: >-
      Funding raised is not cash available, and these obligations determine runway, refinancing exposure, and the
      next-round trigger.
    diligencePath: >-
      Review the latest balance sheet, cash-flow statement, treasury forecast, debt documents, lease schedule, and
      purchase commitments under NDA.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: blocking
    topic: financial-reporting-gap
    missingEvidence: >-
      Audited accounting revenue, ARR definition and bridge, revenue mix, gross margin, utilization, and working-capital
      schedules.
    whyItMatters: >-
      These records are necessary to distinguish recurring revenue from hardware sales and to test whether scale
      produces sustainable cash economics.
    diligencePath: >-
      Obtain audited statements, monthly management accounts, ARR customer bridge, segment COGS, GPU utilization,
      receivables, inventory, and deferred-revenue schedules.
    relatedQuestionRefs:
      - QI005
      - QI008
      - QI010
    relatedTableRefs:
      - TI001
      - TI002
      - TI003
  - type: private-evidence-only
    severity: material
    topic: customer-retention
    missingEvidence: >-
      Cohort-level NRR, GRR, logo churn, renewal rates, contract length, utilization, and customer satisfaction by
      cloud, colocation, hardware, and strategic-account segment.
    whyItMatters: >-
      Customer counts and ARR do not show whether recurring usage expands or decays after initial training and
      infrastructure commitments.
    diligencePath: >-
      Request monthly cohort tables, renewal schedules, product-level utilization, churn reasons, and reference calls
      for retained and churned customers.
    relatedQuestionRefs:
      - QU004
    relatedTableRefs:
      - TU002
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: >-
      Revenue and committed-capacity concentration for the largest customer and the top five and top ten customers,
      including Microsoft.
    whyItMatters: >-
      A large strategic agreement can validate demand while also creating renewal, repricing, utilization, and
      counterparty exposure.
    diligencePath: >-
      Obtain the customer concentration schedule, contract summaries, revenue-recognition treatment, renewal dates,
      minimum commitments, termination rights, and gross margin by account.
    relatedQuestionRefs:
      - QU006
    relatedTableRefs:
      - TU001
      - TU003
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: >-
      Direct customer confirmations that identify workloads, production status, scale, measured outcomes, deployment
      dates, and renewal history.
    whyItMatters: >-
      Aggregated counts, channel references, and an unattributed testimonial cannot establish the breadth or quality of
      production adoption.
    diligencePath: >-
      Obtain a complete customer reference list and conduct calls with Microsoft, direct enterprise buyers, startup
      customers, government users, and at least one churned account.
    relatedQuestionRefs:
      - QU003
    relatedTableRefs:
      - TU003
  - type: enumeration-incomplete
    severity: material
    topic: legal-regulatory-record
    missingEvidence: >-
      A complete litigation, enforcement, licensing, certification, privacy, safety, and export-control record,
      including pending matters and regulator correspondence.
    whyItMatters: >-
      Public standard terms describe obligations but do not establish whether material violations, disputes,
      investigations, or exceptions exist.
    diligencePath: >-
      Run counsel-led federal and state docket, regulator, sanctions, export-license, privacy, and certification
      reviews; reconcile results to management's legal schedule.
    relatedQuestionRefs:
      - QR007
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: debt-covenants
    missingEvidence: >-
      Debt principal, rates, maturities, amortization, collateral marks, covenants, cure periods, waivers, and
      customer-contract coverage by facility.
    whyItMatters: >-
      Cumulative funding raised does not show cash availability, liquidity, or the ability to service fixed obligations
      through a utilization downturn.
    diligencePath: >-
      Obtain lender agreements, covenant certificates, treasury schedules, borrowing-base reports, and downside coverage
      models.
    relatedQuestionRefs:
      - QR005
      - QR006
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: >-
      Top-customer revenue, backlog, utilization, termination rights, renewal history, credit support, and
      deployment-acceptance schedules.
    whyItMatters: Large counterparties may support financing but can also create correlated utilization and cash-flow risk.
    diligencePath: >-
      Review the top 20 customer contracts and cohort-level revenue, usage, renewal, churn, credit, and concentration
      schedules.
    relatedQuestionRefs:
      - QR004
      - QR006
  - type: private-evidence-only
    severity: material
    topic: reliability-security
    missingEvidence: >-
      Audited uptime, material outage and breach history, incident severity, SOC 2 scope and exceptions, penetration
      results, backup tests, RTO/RPO, and customer SLA remedies.
    whyItMatters: >-
      Company-described controls and contractual risk allocation do not quantify actual service reliability or incident
      exposure.
    diligencePath: >-
      Obtain status and incident exports, SOC 2 reports, security assessments, business-continuity tests,
      cyber-insurance claims, and representative enterprise SLAs.
    relatedQuestionRefs:
      - QR003
      - QR006
      - QR007
  - type: conflicting-data
    severity: material
    topic: financial-definitions
    missingEvidence: >-
      Audited or management-certified revenue, ARR, accounting loss, cash burn, gross margin, unrestricted cash, and
      consistent period definitions.
    whyItMatters: >-
      The assigned sources mix estimates and promotional metrics; revenue, ARR, accounting loss, cash burn, funding
      raised, and cash available are not interchangeable.
    diligencePath: >-
      Reconcile audited statements and monthly management accounts to bookings, billings, ARR definitions, cash flow,
      debt draws, and reported external figures.
    relatedQuestionRefs:
      - QR005
      - QR008
  - type: private-evidence-only
    severity: material
    topic: audited-arr-and-margins
    missingEvidence: >-
      Audited financial statements detailing 2025 GAAP revenue, gross margin breakdown between cloud and hardware, and
      net cash burn.
    whyItMatters: >-
      Without audited gross margin data, evaluating whether Lambda can service its large equipment debt obligations
      remains uncertain.
    diligencePath: Request audited financial statements and board reporting decks in management diligence session.
    relatedQuestionRefs:
      - QV002
      - QV008
    relatedTableRefs:
      - TV001
  - type: missing-source
    severity: material
    topic: debt-covenants
    missingEvidence: >-
      Full credit agreement documentation detailing covenants, interest coverage ratios, and maturity schedules for debt
      facilities.
    whyItMatters: >-
      High debt service requirements could trigger liquidity distress or equity dilution during GPU pricing compression
      cycles.
    diligencePath: Obtain copies of debt credit agreements and lender compliance certificates during financial review.
    relatedQuestionRefs:
      - QV001
      - QV008
    relatedTableRefs:
      - TV003
