            - 多用户组织工作空间与访问权限管理
        - label: 应用与开发者环境
          detail: 支持单行命令安装的预配置 AI 软件栈
          modules:
            - 托管式 PyTorch、TensorFlow、CUDA 与 cuDNN 驱动环境
            - 直接 SSH 访问、容器编排与多节点作业启动
        - label: 数据管理与存储底座
          detail: 由 VAST Data Platform 驱动的高吞吐共享存储
          modules:
            - 消除跨云/托管数据本地性与重力限制的 VAST DataSpace
            - 面向结构化与非结构化训练集的多模态分析工具 VAST DataBase
        - label: 互连与网络拓扑
          detail: 超低延迟无阻塞网络互连
          modules:
            - NVIDIA Quantum-2 InfiniBand RDMA 交换网络
            - 节点内高带宽 NVIDIA NVLink GPU 间互连网络
        - label: 计算硬件层
          detail: 高密度企业级加速系统
          modules:
            - NVIDIA HGX H100、H200（最高 141GB HBM3e）与 Blackwell B200 系统
            - 专用的本地部署 Vector 工作站与机架式企业服务器
        - label: 园区设施、散热与物理安全层
          detail: 具备先进散热与零信任隔离能力的模块化 AI 工厂
          modules:
            - 芯片直接液冷（DTC）与精密风冷（具备 N+1 至 N+N 冗余）
            - 钢笼物理隔离防护、生物识别门禁及 SOC 2 / ISO 合规认证
    approximationNotes: 依据经核实的公开技术披露，展示 Lambda 托管算力基础设施的分层集成架构。
    claimRefs:
      - CE001
      - CE004
      - CE006
      - CE007
      - CE008
      - CE009
      - CE012
  - id: FU001
    title: 客户旅程与业务拓展触点
    type: journey-map
    summary: 从科研算力接入到战略级容量交付的定性路径，并展示各拓展触点上的证据力度与尽调门槛。
    data:
      items:
        - label: 科研探索与试用
          user: Academic researcher or AI developer
          touchpoints:
            - 开发者主导的科研工作负载
            - 早期模型实验
          expansionSignal: Historical base was primarily academic researchers
          unresolvedGate: No current active-researcher count
        - label: 按需云资源使用
          user: Individual developer or startup team
          touchpoints:
            - 按需 GPU 实例
            - GPU Cloud 账户
          expansionSignal: Public site offers launch-on-demand access
          unresolvedGate: No activation or repeat-usage metric
        - label: 生产环境推理
          user: Startup engineering team
          touchpoints:
            - 生产环境推理工作负载
            - 不断扩大的应用需求
          expansionSignal: Lambda cites startups reaching millions in annual revenue
          unresolvedGate: Customer names, Lambda spend, and cohort retention are absent
        - label: 预留集群
          user: Enterprise AI team
          touchpoints:
            - 预留 GPU 集群
            - 长周期算力容量规划
          expansionSignal: Official site offers cluster reservation
          unresolvedGate: No conversion, contract-length, or renewal disclosure
        - label: 托管专用基础设施
          user: Enterprise infrastructure organization
          touchpoints:
            - 托管集群
            - 单租户基础设施
          expansionSignal: Official site markets managed and dedicated architectures
          unresolvedGate: No customer-level utilization or satisfaction evidence
        - label: 战略算力供应协议
          user: Hyperscale infrastructure buyer
          touchpoints:
            - 大规模 GPU 部署
            - 长期算力合作关系
          expansionSignal: StartEngine reports the Microsoft agreement
          unresolvedGate: Revenue concentration and agreement economics are undisclosed
    approximationNotes: 仅为定性演进路径；公开信源未提供同群体转化率、阶段规模或经测算的扩容周期数据。
    claimRefs:
      - CU006
      - CU008
      - CU010
      - CU013
      - CU014
