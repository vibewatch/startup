              页面称硬件与云业务服务了数万家客户。但两者均未明确统计分母是活跃账户、付费企业、累计注册用户、硬件买家还是云订阅用户。StartEngine 还报道了 2025 年 ARR 达到 $760 million
              且同比增长 79%，但同时明确指出其公司信息未经独立核实。具名标杆案例相当有限：同一页面提及与 Microsoft 达成的数十亿美元协议，以及涉及 Capital One 与 DoorDash 的 Amazon
              合作关系；而 Welcome.ai 的一篇文章则仅提及未指名的药物研发成效，甚至将推荐语出处留为占位符。这些记录仅能体现商业触达广度，无法证明经独立核实的部署深度、续约表现、利用率或客户满意度。
