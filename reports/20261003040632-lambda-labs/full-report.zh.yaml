      - number: '3.3'
        title: 定价体系、打包模式与总体拥有成本
        blocks:
          - type: paragraph
            body: >-
              定价与打包机制构成了 Lambda 叫板超大规模云厂商的最锋利商业抓手，但在面对低成本新型云时，也面临精细的毛利平衡难题。Lambda 提供按分钟计费且无须预付承诺的按需 GPU 实例，涵盖从早期加速卡到每小时
              $3.99 的 NVIDIA H100 SXM，以及每小时 $6.69 的 B200 SXM6 节点。面向为期数周的大型计算任务，1-Click 集群需要提前审批并满足按周计费的两周最低承诺期限（H100 折合每
              GPU·小时 $4.62 至 $6.16）。至关重要的是，Lambda 在所有云配置中严格执行免收数据出网费政策。机器学习团队在频繁传输数 TB
              模型权重与分布式数据集检查点时，超大规模云厂商的数据出网费（AWS、Azure 和 GCP 通常为每 GB $0.08 至 $0.12）往往每月产生 $437 至 $5,000+ 的衍生费用，这使得 Lambda
              在基础单价本就极具竞争力的同时，实际综合 TCO 显著更低。然而，Lambda
              的模式也包含刚性的利用率代价：平台不区分实例的活跃与闲置状态，闲置实例仍按全额持续计费；同时官方条款严格规定费用不可退还、预留不可取消，且对逾期账单加收每月 1.5% 的滞纳金。
