            title: 资本密集度与供应集中风险
            body: Lambda 在尖端 GPU 芯片配额上对 NVIDIA 存在结构性依赖，同时在为堪萨斯城 AI 工厂等数亿美元规模的数据中心建设筹资时，面临极高的资金压力。
            calloutType: risk
