  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 核心优先级风险与财务模型敞口
        blocks:
          - type: paragraph
            body: >-
              最大的潜在风险敞口在于「融资-产能利用率」闭环。据 Sacra 报道，Lambda 拥有约 $2.9 billion 的债权融资额度以及约 $2.4 billion
              的已披露股权融资，但该机构同时提示，计算财务杠杆所需的资产负债表细节仍未公开 [CR001]。该来源还指出，NVIDIA 每次推出新一代芯片，作为抵押品的现有 GPU
              资产便面临持续贬值，且客户群体日益集中于少数大型交易对手方 [CR003,
              CR004]。这些信号表明，债务契约缓冲空间、承诺利用率、抵押品折价率（haircuts）及资产迭代假设，比新闻报道中的融资金额对投资决策更为关键。融资金额并非可用现金，Sacra
              报道的会计亏损亦非现金消耗衡量标准。业绩预测的可靠性同样需要密切跟踪：Sacra 称 Lambda 将其 2024 年收入预期从近 $600 million 下调至 $400 million 左右
              [CR002]。一旦项目交付延期、客户重新谈判或 GPU 价格承压，导致偿债覆盖倍数在硬件采购承诺调整之前恶化，悲观情景将彻底打破投资逻辑。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
