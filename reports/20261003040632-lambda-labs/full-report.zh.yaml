              - CV008
              - CV014
      - number: '8.3'
        title: 情景建模、可比公司分析与尽调清单
        blocks:
          - type: paragraph
            body: >-
              评估 Lambda，核心在于拿增长轨迹对冲持续的底层设施运维成本。在乐观情景下，以 DeepSeek-R1 和 Llama
              架构为代表的推理模型驱动爆发式推理需求，带动多年期集群预留加速签约，推高年经常性收入（ARR），并推动公司走向估值理想的首次公开募股（IPO）或被企业级算力财团战略收购。在基准情景下，企业端持续采纳支撑起稳定利润率，但硬件迭代周期与超大规模云厂商算力扩容平抑了增速，使估值倍数落在与云基础设施同业相近的合理水平。在悲观情景下，GPU
              算力快速同质化、去中心化或撮合平台激进压价，加上未能消化的租赁债务，将触发估值剧烈收缩。投资逻辑失效的关键触发点包括：意外发生债务契约违约、专用 GPU
              集群需求转冷，或下一代芯片面世加快旧硬件淘汰并挤压利润率。后续尽调的核心诉求集中于按算力梯队划分的经审计毛利率、偿债时间表以及客户集中度。
