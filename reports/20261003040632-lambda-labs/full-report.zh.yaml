  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、工作负载细分与支出范畴
        blocks:
          - type: paragraph
            body: >-
              专业 GPU 云市场在更广阔的基础设施即服务（IaaS）及加速计算生态中占据独立生态位 [CM001]。Lambda 的业务边界聚焦底层加速算力，提供按「GPU·小时」计费且免收出网费的 NVIDIA GPU
              实例（涵盖 B200、H100 及 A100 架构），并搭配 1-Click 集群与专属私有超级计算机 [CM001,
              CM003]。其可触达的市场边界包括模型训练、微调及大规模批量推理算力的直接支出，同时剔除了托管企业应用软件、通用 CPU 工作负载以及专有 SaaS 编排层 [CM001,
              CM002]。现有替代方案包括本地自建硬件集群（如 Lambda 早期销售的工作站与服务器产品线）、超大规模云厂商租赁（AWS、Azure、GCP），以及新兴的去中心化或社区 GPU 租赁平台 [CM001,
              CM008]。相邻细分领域涵盖 AI 开发框架、模型权重仓库及托管推理网关；不过 Lambda 已主动关停按 token 计费的 Inference API，从而将全部资源集中于高密度底层算力与专属集群
              [CM001, CM002]。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM008
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM008
      - number: '2.2'
        title: 市场规模测算视角与受限的可服务容量
        blocks:
          - type: paragraph
            body: >-
              评估专业 AI 算力基础设施的目标市场，必须将宽泛的 IT 与云计算支出，与 GPU 新型云（neocloud）受资本制约的算力配额现实区分开来 [CM004, CM007]。全球云计算与超大规模 AI
              基础设施虽构成了数千亿美元的需求池，但独立 GPU 云的可服务市场（SAM）却受制于物理电力可用性、液冷配套设施以及 NVIDIA 硬件配额 [CM004, CM006]。Lambda
              的可获取市场（SOM）进一步受到其核心部署区域内签约数据中心容量及远期采购承诺的制约 [CM004, CM007]。第三方独立机构估计，在包括与 Microsoft
              达成的数十亿美元基础设施协议等重大企业客户订单拉动下，Lambda 的营业收入规模迅速扩张，从 2023 年的 $250M 增至 2024 年约 $425M，并在 2025 年逼近 $760M [CM001,
              CM004, CM007]。然而，非公开老股交易市场与分析师报告对其估值及目标市场的预测存在实质性分歧，从基于重资产的保守估值倍数到激进的远期 IPO 前预测不一而足 [CM005, CM007]。
            claimRefs:
              - CM001
              - CM004
              - CM005
              - CM006
              - CM007
