      - number: '1.2'
        title: 创始人团队、管理架构与关键人物风险
        blocks:
          - type: paragraph
            body: >-
              Lambda 的战略发展方向仍高度由创始管理层及早期技术团队主导 [CO007]。联合创始人 Stephen Balaban 担任首席执行官，负责公司战略、资本运作及核心商业合作；联合创始人 Michael
              Balaban 则作为首席技术官主导技术架构 [CO007]。Mitesh Agrawal 等长期核心成员曾任首席运营官兼云业务负责人等高级运营职务，统管数据中心建设与算力集群运营 [CO008]。尽管技术远景与
              NVIDIA 生态深度绑定直接源自创始人，但在标杆大客户谈判、超大规模云厂商算力供应协议及机构融资上，公司对 Stephen Balaban 存在实质性的关键人物依赖
              [CO009]。公司治理与监管由领投多轮成长期股权融资的知名机构投资者提供支撑，其中包括美国创新技术基金（USIT）、B Capital 以及 T. Rowe Price Associates [CO010]。
