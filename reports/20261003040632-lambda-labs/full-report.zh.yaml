            body: >-
              不可取消的收费条款、有限的默认备份义务以及终止后删除资产的权利，或许在商业上保护了 Lambda，但加剧了客户在采购和业务连续性上的担忧；目前尚无公开的
              NRR、GRR、客户流失率或续约率数据能证明其最终客户黏性。
