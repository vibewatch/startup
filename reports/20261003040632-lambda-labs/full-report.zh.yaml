      - number: '8.2'
        title: 融资历程与估值背景
        blocks:
          - type: paragraph
            body: >-
              Lambda 的融资历程展现了风险股权与结构化债权的爆发式扩张。截至 2025 年底，Lambda 通过 7 轮融资累计获得 $1.408 billion
              资金，将成长期股权与债权融资结合以支持高密度数据中心建设。早期里程碑包括 2024 年 2 月由美国创新技术基金（USIT）领投、估值 $1.5 billion 的 $320 million C 轮融资，吸引了
              T. Rowe Price 与 B Capital 等机构注资。2025 年 2 月，Lambda 宣布完成由 Andra Capital 与 SGW 联合领投的 $480 million D 轮融资，引入了
              Andrej Karpathy、ARK Invest 等知名生态投资人以及头部硬件原始设计制造商（ODM）。尽管非公开市场银团与经纪自营商的转让要约传出的估值预期在 $5.9 billion 至 $12.5
              billion 之间，但机构流动性仍受制于老股交易市场的买卖价差。此外，Lambda 的法律协议执行严苛的商业条款，明确规定付款义务不可取消且费用不可退还，反映出其维系长期数据中心租约所需的刚性运营现金流压力。
            claimRefs:
              - CV001
              - CV002
              - CV007
              - CV008
              - CV009
              - CV010
          - type: table
            tableRef: TV001
            claimRefs:
