    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与商业化路径
        blocks:
          - type: paragraph
            body: >-
              Lambda 并非纯粹的软件订阅制公司。其公开资料列出了按需 GPU
              算力、专属单租户基础设施、托管集群、联合工程开发以及物理硬件销售等业务。云服务费用依照订单执行，可按月或按其他约定周期收取；硬件则根据订单约定的付款条款在发货时开票。这形成了多项经济实质各异的收入来源：云算力的使用费或预留费、协商定价的企业级基础设施合同、与托管部署挂钩的服务收入，以及一次性的硬件销售收入。公开服务条款明确了计费规则，但未披露实际成交价、折扣幅度、在手订单转化率或会计确认政策。因此，表列价或合同账面金额不应直接等同于已确认收入；在缺乏分部拆解依据的情况下，也不能将硬件销售假定具备类云业务的经常性与高毛利。
