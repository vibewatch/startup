      - number: '2.3'
        title: 买方画像细分、预算归属与采购路径
        blocks:
          - type: paragraph
            body: >-
              专业 GPU 云算力的采购路径因客户组织规模与技术成熟度而呈现明显分化 [CM001, CM009]。在基础模型实验室与前沿 AI 初创企业中，核心买方是首席技术官与 AI 基础设施负责人，其首要任务是锁定具备
              InfiniBand 互联的连续多节点 GPU 算力，以支持为期数周的分布式训练任务 [CM001, CM006, CM009]。而在加速落地生成式 AI 能力的企业级客户中，工程副总裁与企业 IT 预算决策人将
              Lambda 视为成本更低的超大规模云替代方案，或是在现有供应商算力配额短缺时的弹性补充算力 [CM001, CM009]。学术研究人员与独立开发者则可借助按分钟计费的自助式按需实例，展开无须长期绑定的低门槛实验
              [CM001, CM008, CM009]。合同条款直接决定了预算归属：按需算力通常计入部门信用卡支付的运营支出（OpEx）；而 1-Click
              集群与专属私有云超算则需要走正式采购评审，涉及预付条款与年度承诺支出 [CM001, CM003, CM009]。
            claimRefs:
              - CM001
              - CM003
              - CM006
              - CM008
              - CM009
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM003
              - CM006
              - CM008
              - CM009
      - number: '2.4'
        title: 增长驱动因素、规模化瓶颈与结构性约束
        blocks:
          - type: paragraph
            body: >-
              专业 GPU 基础设施的扩张受多重因素强力驱动：生成式 AI 模型规模激增、token 上下文窗口不断扩大，以及企业级模型微调的全面普及 [CM001, CM006]。Lambda
              的核心价值主张依托透明定价、预装软件环境（包含 CUDA、PyTorch 及 TensorFlow 的 Lambda
              Stack），以及免收数据出网费的政策，相比超大规模云厂商大幅降低了总体拥有成本（TCO）[CM001, CM008]。然而，客户采纳仍受到严苛现实条件的紧密约束 [CM008,
              CM010]。资本密集度极高：部署数万颗高密度 GPU 需要巨额债权与股权融资支持，而数据中心容量则依赖吉瓦级电力并网与先进液冷架构 [CM006,
              CM007]。此外，跨云中立的容器化工作流降低了客户切换成本，催生了多云并用（multi-homing）倾向，买方会根据实时现货可用性与现货价格在不同新型云之间调度工作负载 [CM008,
              CM011]。服务条款同样施加了运营限制：一旦违反合规使用政策，账户将面临单方面暂停或终止；客户还需自行承担商业部署风险，且无服务等级协议（SLA）赔偿保障 [CM003, CM010]。
            claimRefs:
              - CM001
              - CM003
              - CM006
              - CM007
              - CM008
              - CM010
              - CM011
      - number: '2.5'
        title: 核心图表与分析
        blocks:
          - type: callout
            title: 资本密集度与电力制约真实市场弹性
            body: >-
              与目标需求能快速转化为高毛利收入的传统 SaaS 市场不同，专业 GPU 云市场受到物理条件的硬性约束：数据中心供电容量、高密度液冷部署，以及 NVIDIA Blackwell B200 与 Hopper
              H100 等先进芯片的配额供应 [CM006, CM007]。在这一赛道，市场份额在很大程度上取决于融资条款与电力采购协议，而不仅靠软件层面的打磨 [CM001, CM006]。
            calloutType: insight
            claimRefs:
              - CM001
              - CM006
              - CM007
          - type: callout
            title: 客户多云调度倾向与超大规模云厂商竞合脆弱性
            body: >-
              尽管 Lambda 的免出网费与透明的单 GPU 实例小时计费吸引了大量 AI 研究人员，但容器化机器学习框架（PyTorch、Docker、Kubernetes）的标准化降低了切换壁垒，大客户得以在
              CoreWeave、RunPod 及公有云厂商之间多云并用调度 [CM001, CM008]。此外，Microsoft 等标杆大客户既是不可或缺的算力需求方，同时也是拥有自研芯片计划的竞争性超大规模云厂商
              [CM001, CM007]。
            calloutType: risk
            claimRefs:
              - CM001
              - CM007
              - CM008
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局概览与供应商分类体系
        blocks:
          - type: paragraph
            body: >-
              加速计算基础设施市场已分化为两大核心竞争阵营：聚焦高密度 AI 训练与推理的专业 GPU 云服务商（neoclouds），以及运营庞大一体化企业应用生态的传统超大规模云厂商。在专业新型云阵营中，Lambda
              Labs 直接与 CoreWeave、RunPod 及 Vast.ai 竞争。这类专业服务商凭借前沿加速卡的快速供给、预配置的机器学习软件运行时，以及极具进攻性的价格体系形成差异化优势。相比之下，以 Amazon
              Web Services（AWS）、Microsoft Azure 和 Google Cloud Platform（GCP）为代表的综合性超大规模云平台，在提供 GPU
              的同时还附带数百种企业级服务、身份认证体系与复杂的数据治理工具。尽管超大规模云厂商拥有雄厚的资产负债表与广泛的企业客户锁定效应，但其 GPU
              实例面临高昂的总体拥有成本（TCO）劣势、复杂的现货市场管理负担，以及昂贵的数据出网费用。Lambda Labs 自诩为「超级智能云」，借助 1-Click 集群和 Lambda Stack 等工具降低底层
              GPU 算力部署门槛，但本质上依然与竞对一样受制于芯片底层供应链周期。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP006
              - CP007
              - CP008
      - number: '3.2'
        title: 核心竞品画像、体量规模与相对产品边界
        blocks:
          - type: paragraph
            body: >-
              评估 Lambda 的直接与间接竞争对手，可以看出各方在资本规模、基础设施体量、目标客群与架构理念上存在显著分化。CoreWeave
              是资本运作最激进的专业竞品，调动了数百亿美元股权与债权资金，为头部前沿实验室与主权 AI 项目构建与原生 Kubernetes 编排深度集成的超大规模集群。不过，CoreWeave 的 H100
              实例起步价格较高（高达每小时 $4.25），而 Lambda 的 H100 配置单价更具竞争力（每小时 $2.49 至 $3.99）。在主打极致性价比的区间，RunPod 以每小时 $2.69 的 H100
              SXM 实例与每小时 $1.99 的 H100 PCIe 实例，叠加社区云方案，价格同时低于 Lambda 和 CoreWeave；但 RunPod 缺乏 Lambda
              拥有的企业级单租户隔离交付经验与硬件可靠性保障。AWS 等超大规模云厂商虽然拥有无可比拟的多产品矩阵与自研芯片替代选项（Trainium 与 Inferentia），但其 NVIDIA GPU
              实例受出网费和运维复杂度拖累，促使研究团队转向专业云服务商。除外部云厂商外，Lambda 还要与企业本地自建方案竞争——企业机器学习团队经常在直接采购专属 GPU 服务器与长期云租赁之间进行权衡。
