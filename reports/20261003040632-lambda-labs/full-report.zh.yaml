            title: 建议保持谨慎入场纪律
            body: 鉴于 Lambda 承担着大额债务融资与沉重的硬件资本支出承诺，在经审计的财务披露彻底厘清单位经济模型、烧钱速度及债务到期时间表之前，潜在投资者应保持继续研究立场。
            calloutType: recommendation
