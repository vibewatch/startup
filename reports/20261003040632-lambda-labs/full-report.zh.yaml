      - number: '1.4'
        title: 运营规模、基础设施布局与资本执行风险
        blocks:
          - type: paragraph
            body: >-
              相比传统超大规模云厂商，Lambda 的竞争差异化核心在于纯粹聚焦 AI、裸金属性能、免收数据出网费（egress fees）的简化计费模式，以及预配置的 Lambda Stack 软件环境
              [CO015]。然而，作为重资产云基础设施企业，公司也面临显著的固有运营风险与交易对手风险 [CO016]。其中最关键的挑战包括：对 NVIDIA 加速芯片供应配额的高度硬件依赖、大型专属 AI
              工厂部署带来的高度客户集中，以及严苛的电力与散热工程交付要求 [CO016]。例如，专为部署逾 10,000 颗 NVIDIA Blackwell GPU 而设计的堪萨斯城 100
              兆瓦数据中心设施，一旦整体市场算力供需格局发生再平衡，将面临实质性的交付、融资及单一租户产能利用率风险 [CO016]。
            claimRefs:
              - CO015
              - CO016
      - number: '1.5'
        title: 核心图表与分析
        blocks:
          - type: callout
            title: 通过超大规模云厂商数十亿美元储备订单获得商业验证
            body: 与 Microsoft 敲定数十亿美元、为期多年的算力供应协议，确立了 Lambda 作为企业级 AI 基础设施服务商的地位，证明其具备按超大规模标准部署数万颗 GPU 的交付能力。
            calloutType: strength
            claimRefs:
              - CO013
              - CO016
