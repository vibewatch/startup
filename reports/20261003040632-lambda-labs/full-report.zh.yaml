      - number: '6.3'
        title: 客户黏性、客单拓展与集中度风险
        blocks:
          - type: paragraph
            body: >-
              Lambda 描绘了一条从按需算力向预留、托管及单租户基础设施演进的扩张路径；其 2024
              年的一篇博文称，部分初创客户的生产级推理业务年收入从零做到数百万美元。这是公司单方面发布的成果宣传，而非公开披露的留存队列。此外，合同条款也带来了买方摩擦：除非协议另有约定，付款义务不可取消且已付费款项概不退还；Lambda
              默认没有维护或备份客户资产的法定义务；合同终止后还允许删除客户资产。这些条款虽然不能直接证实客户流失，但引发了切换、业务连续性与采购合规方面的疑虑。据报道的 Microsoft
              协议使得大客户集中度风险成为关注重点，但没有任何公开来源披露 Microsoft
              的收入占比、前五或前十大客户集中度、净留存率（NRR）、总留存率（GRR）、客户流失率、续约率、合同期限或单客户利用率。因此，本章无法对客户黏性或集中度进行定量评估。
