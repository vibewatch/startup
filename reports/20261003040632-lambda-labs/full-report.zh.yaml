          - type: callout
            title: 弹性工作负载下的结构性劣势
            body: Lambda 刻意不设竞价（spot）或可抢占定价档位，固然保障了多节点训练的算力确定性，但在具备弹性、容忍中断的推理负载场景下，却容易被撮合平台类服务商抢走份额。
            calloutType: risk
