  - id: TV003
    title: 乐观、基准与悲观情景预测
    columns:
      - 情景
      - 经营与市场假设
      - 估值与估值倍数逻辑
      - 关键风险与下行触发条件
      - 概率信号
    rows:
      - - 乐观情景
        - 企业客户迅速规模化采用 B200/GB300 系统，集群利用率达 80%+，推理工作负载显著扩展
        - 企业估值倍数扩张至 15x-20x 远期云 ARR，IPO 估值超过 $10B
        - 算力容量瓶颈延误客户接入；硬件供应链遭遇交付卡点
        - 中等（25%）
      - - 基准情景
        - 专用 AI 算力需求稳健，保持 20-30% 同比增长，毛利率维持平稳
        - 估值稳定在 8x-12x 远期 ARR，与后期风险投资轮次一致（$4B-$6B 区间）
        - 超大规模云厂商竞争压力加剧，电力与数据中心机房租赁成本上涨
        - 高（55%）
      - - 悲观情景
        - GPU 供给过剩，算力走向同质化，偿债压力加剧，客户流失至竞价云服务
        - 估值倍数压缩至 3x-5x ARR，或在沉重设备债务压力下陷入困境重组
        - 违反债务契约条款，老股二级市场估值急剧缩水，发生降估值融资
        - 低至中等（20%）
    notes: 情景模型考量了波动剧烈的资本市场环境、GPU 硬件生命周期及债务负担。
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV011
      - CV012
      - CV013
figures:
  - id: FO001
    title: Lambda Labs 发展演进与公司里程碑时间线
    type: timeline
    summary: Lambda Labs 从 2012 年创客空间起步，历经硬件系统开发、云服务转型，直至构建超大规模 AI 工厂的发展演进轨迹。
    data:
      items:
        - date: '2012'
          label: 在 Noisebridge 创立公司
          details: 由 Stephen Balaban 与 Michael Balaban 在 San Francisco 创立，最初为一家 AI 与计算机视觉软件公司。
          tone: neutral
        - date: '2017'
          label: 转型深耕深度学习硬件
          details: 在 Transformer 架构取得突破后转向硬件，向 AI 研究人员销售专用 GPU 工作站与服务器。
          tone: positive
        - date: '2020'
          label: 推出 Lambda GPU Cloud
          details: 上线按需及预留云算力集群，开启向基础设施提供商的战略转型。
          tone: positive
        - date: 2024-02
          label: 完成 $320M Series C 融资
          details: 完成由 USIT 领投的 $320M 融资，估值 $1.5B，用于扩建高速 InfiniBand 网络与 GPU 算力集群。
          tone: positive
        - date: 2025-02
          label: 按 $2.5B 估值完成 $480M Series D 融资
          details: 完成 Series D 股权融资，NVIDIA 参投，用于扩建 AI 云基础设施。
          tone: positive
        - date: 2025-07
          label: 逐步收缩本地部署硬件业务
          details: 停售传统工作站与服务器，将资金与工程力量 100% 聚焦于云端 AI 工厂。
          tone: neutral
        - date: 2025-11
          label: 与 Microsoft 达成供应协议并完成 $1.5B Series E 融资
          details: 宣布与 Microsoft 达成数十亿美元算力协议，并募集 $1.5B Series E 融资。
          tone: positive
        - date: 2026-04
          label: 推进 Kansas City AI 工厂建设
          details: 推进 100MW 数据中心园区建设，规划部署超过 10,000 张 NVIDIA Blackwell Ultra GPU。
          tone: positive
    approximationNotes: 日期依据公开新闻稿、公司官方博客文章及监管公告整理。
    claimRefs:
      - CO001
      - CO002
      - CO004
      - CO006
      - CO010
      - CO012
