      - number: '7.2'
        title: 法律、合规与合同风险
        blocks:
          - type: paragraph
            body: >-
              Lambda 公布的条款将较重的运营责任转嫁给客户。其云服务条款允许在客户违约、过度占用算力、疑似未授权访问或收到法律监管指令时暂停服务；同一合同还明确，除非订单另有约定，Lambda
              原则上对维护或备份客户资产不承担任何义务 [CR005, CR006]。出口管制与制裁合规要求在合同中有明确规定，但在指定公开证据中，无法证实 Lambda
              的许可证申请流程、筛查内控、过往执法记录、未决诉讼或监管往来函件 [CR007]。非公开老股投资页面则揭示了另一层法律风险：投资者购买的是 StartEngine 系列载体的权益而非 Lambda
              直接股权，Lambda 未参与其中一项发行，且相关权益被定性为具有投机性、缺乏流动性、转让受限并存在全部损失的可能 [CR012, CR013, CR015]。这些属于投资特殊目的载体（SPV）的风险，并不等同于
              Lambda 本身破产或遭受监管处罚的证据。
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR012
              - CR013
              - CR015
