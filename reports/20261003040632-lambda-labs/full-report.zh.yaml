      - number: '1.3'
        title: 资本化历史、估值走势与商业验证
        blocks:
          - type: paragraph
            body: >-
              Lambda 通过股权及结构化融资筹集了大量成长期非公开资本，用以支持大规模图形处理器采购与高密度数据中心扩建 [CO011]。2024 年 2 月，公司完成 $320M 的 C 轮融资，投后估值达
              $1.5B，由 USIT 领投，B Capital、SK Telecom、T. Rowe Price Associates 及现有种子轮与风险投资机构跟投 [CO010]。2025 年 2 月，Lambda
              再次完成约 $2.5B 估值的 $480M D 轮融资，NVIDIA 参投 [CO012]。2025 年 11 月，在宣布与 Microsoft 达成数十亿美元算力供应协议后，公司完成 $1.5B 的 E
              轮融资，业务扩张显著提速 [CO013]。尽管 E 轮融资后老股交易平台显示的估值区间在 $4.0B 至 $6.0B 之间，但经审计的公司 ARR 及利润率指标仍未披露，核心经营参数仍有待进一步尽调
              [CO014]。
            claimRefs:
              - CO010
              - CO011
              - CO012
              - CO013
