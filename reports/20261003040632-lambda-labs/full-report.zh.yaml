  - id: TV002
    title: 投资逻辑与反向逻辑登记簿
    columns:
      - 类别
      - 核心观点
      - 底层证据
      - 何种变化会改变观点
    rows:
      - - 投资逻辑：硬件与供应链
        - 与 NVIDIA 及顶级 ODM 厂商深度战略绑定，确保优先算力配额
        - NVIDIA、Supermicro、Wistron、Pegatron 与 Wiwynn 在 Series D 轮直接注资
        - 失去优先合作伙伴地位，或 NVIDIA 削减供应链配额
      - - 投资逻辑：持有成本
        - 零数据出网费与优化软件栈带来结构性 TCO 优势
        - 免除出网费用为训练工作负载提供了成本确定性
        - 超大规模云厂商免收数据出网费，或对齐裸金属定价档位
      - - 反向逻辑：定价缺乏弹性
        - 缺乏竞价实例或可抢占实例，限制了可触达的开发者及批处理工作负载市场
        - Runpod 等竞品在按需实例上压低价格，并提供低成本算力市场档位
        - 推出针对闲置 GPU 算力的动态竞价或现货市场
      - - 反向逻辑：合同风险
        - 刚性不可退款支付条款与长期租赁负债构成资产负债表拖累
        - 服务条款规定了不可取消的付款承诺与不可退款费用
        - 转向提供客户取消权的灵活按用量付费承诺
    notes: 投资逻辑与反向逻辑要点源自市场对比研究、公司备案文件及官方条款。
