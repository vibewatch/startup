chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司定位、历史沿革与核心商业模式
        blocks:
          - type: paragraph
            body: >-
              Lambda Labs 法定注册名称为 Lambda, Inc.，是一家专注 AI 基础设施与 GPU 云计算的提供商，由双胞胎兄弟 Stephen Balaban（CEO）和 Michael
              Balaban（CTO）于 2012 年在旧金山创立 [CO001]。公司起初脱胎于旧金山米申区的 Noisebridge 极客空间，最初提供 AI 软件与计算机视觉
              API；随后转型硬件系统，向深度学习研究人员销售 GPU 工作站及服务器，最终全面切入云基础设施 [CO002]。目前公司在加州圣何塞和旧金山设有办公地点 [CO003]，将自身定位为「超级智能云」（The
              Superintelligence Cloud），专门面向机器学习工程、模型训练与分布式推理工作负载 [CO004]。Lambda 的算力商业化主要依托三大途径：按分钟计费的按需 GPU 云实例、1-Click
              多 GPU 预留集群，以及通常按多年算力合同签约的大规模专属私有云协议 [CO005]。为了把全部资源聚焦于可扩展高密度云基础设施与 AI 工厂建设，公司已于 2025 年夏季关停了原有的传统本地硬件销售业务
              [CO006]。
