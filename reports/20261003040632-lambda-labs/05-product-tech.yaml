callouts:
  - calloutType: "insight"
    title: "Bare-Metal Hardware Heritage Provides Structural Efficiency"
    body: "Lambda's historical origins as an AI workstation and server manufacturer grant it a structural engineering advantage over pure-software cloud aggregators. By engineering customized thermal enclosures, validated HGX topologies, and integrated liquid cooling directly, Lambda achieves higher compute density and power usage effectiveness than legacy virtualized cloud providers."
    claimRefs:
      - "CE002"
      - "CE007"
      - "CE008"
  - calloutType: "risk"
    title: "Geographic Concentration Limits International Market Expansion"
    body: "Lambda's entire physical footprint is confined to 15 domestic data centers in the United States. Under the US CLOUD Act, customer data remains subject to extraterritorial US legal warrants, creating a material regulatory impediment for European enterprise customers bound by GDPR and the EU AI Act who require sovereign data residency."
    claimRefs:
      - "CE010"
      - "CE014"
      - "CE015"
