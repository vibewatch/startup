callouts:
  - calloutType: "insight"
    title: "Capital Intensity and Power Constrain True Market Elasticity"
    body: "Unlike traditional SaaS markets where addressable demand translates rapidly into high-margin revenue, the specialized GPU cloud market is hard-bounded by physical constraints: data center electrical capacity, high-density liquid cooling deployment, and sovereign supply allocation of advanced silicon like NVIDIA Blackwell B200 and Hopper H100 GPUs [CM006, CM007]. Market share in this sector is as much a function of financing terms and power contracts as it is software elegance [CM001, CM006]."
    claimRefs:
      - "CM001"
      - "CM006"
      - "CM007"
  - calloutType: "risk"
    title: "Customer Multi-Homing and Hyperscaler Co-opetition Vulnerability"
    body: "While Lambda's zero egress fees and transparent per-GPU-hour pricing attract AI researchers, the standardization of containerized ML frameworks (PyTorch, Docker, Kubernetes) lowers switching barriers, allowing large customers to multi-home across CoreWeave, RunPod, and public cloud providers [CM001, CM008]. Furthermore, major customers like Microsoft function simultaneously as vital demand partners and competitive hyperscalers with internal custom silicon programs [CM001, CM007]."
    claimRefs:
      - "CM001"
      - "CM007"
      - "CM008"
