      - number: '1.3'
        title: Capitalization History, Valuation Trajectory, and Commercial Validation
        blocks:
          - type: paragraph
            body: >-
              Lambda has raised substantial private growth capital across equity and structured financing rounds to fund
              massive graphics processor procurement and high-density data center expansion [CO011]. In February 2024,
              the company closed a $320M Series C financing round at a $1.5B post-money valuation, led by USIT with
              participation from B Capital, SK Telecom, T. Rowe Price Associates, and existing seed and venture backers
              [CO010]. In February 2025, Lambda secured an additional $480M Series D funding round at an approximately
              $2.5B valuation, with participation from NVIDIA [CO012]. Expansion accelerated dramatically in November
              2025 when Lambda closed a $1.5B Series E financing following the announcement of a multibillion-dollar
              compute supply agreement with Microsoft [CO013]. While secondary market platforms have indicated private
              valuations ranging from $4.0B to $6.0B following the Series E, audited corporate ARR and margin metrics
              remain undisclosed, leaving key operational parameters subject to ongoing diligence [CO014].
            claimRefs:
              - CO010
              - CO011
              - CO012
              - CO013
              - CO014
