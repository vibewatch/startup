  - id: FE001
    title: Lambda Full-Stack AI Infrastructure Hierarchy
    type: stack
    summary: >-
      Architectural stack diagram detailing hardware, networking, storage, cooling, orchestration, and compliance layers
      of Lambda's platform.
    data:
      layers:
        - label: Client Access & API Layer
          detail: Interface endpoints for on-demand provisioning and automated cluster orchestration
          modules:
            - Lambda Cloud API and web console for instant instance spinning and SSH key injection
            - Multi-user organization workspaces and access permission management
        - label: Application & Developer Environment
          detail: Pre-configured AI software stack with one-line installation
          modules:
            - Managed PyTorch, TensorFlow, CUDA, and cuDNN driver environments
            - Direct SSH access, container orchestration, and multi-node job launch
        - label: Data Management & Storage Backbone
          detail: High-throughput shared storage powered by VAST Data Platform
          modules:
            - VAST DataSpace eliminating data locality and gravity across cloud/colocation
            - VAST DataBase multi-modal analytics for structured and unstructured training sets
        - label: Interconnect & Fabric Topology
          detail: Ultra-low-latency non-blocking network interconnect
          modules:
            - NVIDIA Quantum-2 InfiniBand RDMA switching fabric
            - Intra-node high-bandwidth NVIDIA NVLink GPU-to-GPU mesh
        - label: Compute Hardware Layer
          detail: High-density enterprise-grade accelerator systems
          modules:
            - NVIDIA HGX H100, H200 (up to 141GB HBM3e), and Blackwell B200 systems
            - Dedicated on-premises Vector workstations and rackmount enterprise servers
        - label: Facility, Thermal & Physical Security Layer
          detail: Modular AI factories with advanced cooling and zero-trust isolation
          modules:
            - Direct-to-chip (DTC) liquid cooling and precision air cooling (N+1 to N+N redundancy)
            - Physical steel cage protection, biometric checkpoints, and SOC 2 / ISO compliance
