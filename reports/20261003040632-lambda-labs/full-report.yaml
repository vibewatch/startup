chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Company Identity, Origins, and Core Business Model
        blocks:
          - type: paragraph
            body: >-
              Lambda Labs, legally organized as Lambda, Inc., is a specialized AI infrastructure and GPU cloud compute
              provider founded in San Francisco in 2012 by twin brothers Stephen Balaban (CEO) and Michael Balaban (CTO)
              [CO001]. Originally established out of the Noisebridge hackerspace in the Mission District as an AI
              software and computer vision API provider, Lambda subsequently pivoted into hardware systems, supplying
              GPU workstations and servers to deep learning researchers before transitioning into cloud infrastructure
              [CO002]. Operating from corporate offices in San Jose and San Francisco, California [CO003], Lambda now
              positions itself as 'The Superintelligence Cloud,' dedicated exclusively to machine learning engineering,
              model training, and distributed inference workloads [CO004]. Lambda monetizes its computational capacity
              primarily through on-demand GPU cloud instances billed by the minute, 1-Click reserved multi-GPU clusters,
              and large-scale dedicated private cloud agreements often structured as multi-year capacity contracts
              [CO005]. To focus entirely on scalable high-density cloud infrastructure and AI factories, the company
              wound down its legacy on-premise hardware sales as of summer 2025 [CO006].
            claimRefs:
              - CO001
              - CO002
              - CO003
