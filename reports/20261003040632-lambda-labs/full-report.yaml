        - High for workloads lacking bespoke SLA, backup, and recovery commitments
        - >-
          Review top-customer MSAs, SLA credits, recovery objectives, backup scope, cyber insurance, and material
          disputes
      - - Secondary-series ownership and transfer restrictions
        - United States, Regulation D offering
        - StartEngine states the buyer receives a series interest rather than direct Lambda shares
        - High for a secondary-series buyer
        - High
        - Accredited-investor eligibility and offering risk disclosures
        - High because liquidity, fees, parity, and transfer remain constrained
        - >-
          Obtain subscription documents, underlying share class rights, SPV fees, cap-table proof, transfer consent, and
          exit waterfall
    notes: >-
