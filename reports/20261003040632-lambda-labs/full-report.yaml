      - number: '1.4'
        title: Operational Scale, Infrastructure Footprint, and Capital Execution Risks
        blocks:
          - type: paragraph
            body: >-
              Lambda's competitive differentiation against incumbent hyperscalers centers on its pure-play AI focus,
              bare-metal performance, simplified billing without data egress fees, and the pre-configured Lambda Stack
              software environment [CO015]. However, the company faces substantial operational and counterparty risks
              inherent to capital-intensive cloud infrastructure businesses [CO016]. Key among these are strict hardware
              dependence on NVIDIA's accelerator supply allocations, intense customer concentration in large dedicated
              AI factory deployments, and heavy power and cooling execution demands [CO016]. Construction milestones
              such as the 100-megawatt Kansas City data center facility designed for over 10,000 NVIDIA Blackwell GPUs
              carry meaningful delivery, financing, and single-tenant utilization risks if broader market compute
              dynamics rebalance [CO016].
            claimRefs:
              - CO015
              - CO016
