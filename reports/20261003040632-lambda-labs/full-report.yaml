      - number: '1.2'
        title: Founders, Leadership Structure, and Key-Person Dependence
        blocks:
          - type: paragraph
            body: >-
              Lambda's organizational direction remains heavily steered by its founding leadership and early technical
              team [CO007]. Co-founder Stephen Balaban serves as Chief Executive Officer, leading corporate strategy,
              capital formation, and major commercial partnerships, while co-founder Michael Balaban leads technical
              architecture as Chief Technical Officer [CO007]. Longtime core team members such as Mitesh Agrawal have
              served in executive operational roles, including Chief Operating Officer and Head of Cloud, managing data
              center buildouts and fleet operations [CO008]. While the technical vision and deep NVIDIA ecosystem
              relationships stem directly from founder leadership, the business faces material key-person dependence on
              Stephen Balaban for marquee customer negotiations, hyperscaler supply deals, and institutional fundraising
              [CO009]. Governance and oversight are anchored by prominent institutional investors who have led
              successive growth equity rounds, including the US Innovative Technology Fund (USIT), B Capital, and T.
              Rowe Price Associates [CO010].
