callouts:
  - calloutType: "insight"
    title: "The Zero-Egress TCO Weapon"
    body: "Lambda's decision to waive all data egress fees represents a vital structural differentiator against AWS, Azure, and GCP. In foundation model training and inference pipelines where model weights and dataset checkpoints exceed hundreds of terabytes, egress fees at hyperscalers can add tens of thousands of dollars to monthly invoices, creating a substantial economic barrier to leaving Lambda once workflows are active."
    claimRefs:
      - "CP003"
      - "CP010"
  - calloutType: "risk"
    title: "Severe Commoditization and Multi-Homing Vulnerability"
    body: "Because Lambda relies entirely on standard NVIDIA hardware architectures and open-source software frameworks like PyTorch and Docker, its switching costs remain inherently low. Enterprise customers routinely maintain multi-cloud accounts and can migrate workloads to CoreWeave, RunPod, or hyperscalers whenever availability or spot pricing shifts, capping Lambda's long-term pricing power."
    claimRefs:
      - "CP013"
      - "CP014"
      - "CP016"
