company:
  name: "80 Acres Farms"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Founded in 2015 in Hamilton, Ohio, 80 Acres Farms grew into a prominent U.S. indoor vertical-farming operator powered by its GroLoop automation platform, completing major expansions including a 2025 multi-farm acquisition from Kalera and a strategic merger with Soli Organic to project $200 million in combined revenue across 17,000 retail locations. However, compounding industry-wide capital constraints, heavy operating costs, and structural debt culminated in an August 2026 Chapter 7 bankruptcy filing in Delaware across twelve affiliated corporate entities, forcing full liquidation."
sections:
  - id: "corporate-identity-and-founding"
    title: "Corporate Identity, Founding, and Platform Evolution"
    body: "80 Acres Farms (legally incorporated in Delaware bankruptcy proceedings as 80 Acres Urban Agriculture, Inc.) was established in 2015 by co-founders Mike Zelkind and Tisha Livingston with headquarters located at 345 High Street in Hamilton, Ohio. The company pioneered indoor vertical farming aimed at producing fresh, pesticide-free culinary produce—predominantly leafy salad greens, microgreens, vine crops, and culinary herbs—in proximity to urban consumers. The core operational differentiator was its proprietary GroLoop automation platform, developed through its Dutch-Israeli-American technology subsidiary Infinite Acres alongside key industrial automation partners including Siemens, Signify, SICK, and TTA-ISO. GroLoop integrated hardware, robotics, environmental sensing, and artificial intelligence to automate seeding, crop spacing, nutrient delivery, and harvesting while maintaining precise microclimate recipes. The company claimed its indoor facilities utilized 100% renewable electricity and reduced water consumption by 95% per pound of produce compared to conventional field agriculture. Despite these technological milestones, the capital-intensive nature of vertical farming ultimately overwhelmed the business model, leading to insolvency in late 2026."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
      - "CO005"
    tableRefs:
      - "TO001"
  - id: "executive-leadership-and-governance"
    title: "Executive Leadership, Governance, and Corporate Architecture"
    body: "80 Acres Farms was led by Chief Executive Officer Mike Zelkind and co-founder Tisha Livingston, who served as Chief Executive Officer of technology subsidiary Infinite Acres. Executive management also featured Noah Zelkind, who initially directed business development before advancing to Chief Operating Officer in February 2025 to oversee operations, engineering, agronomy, and supply chain following major consolidation transactions. Legal and intellectual property governance was headed by General Counsel and Chief Intellectual Property Officer Boris Zelkind, who formally executed the company's Delaware bankruptcy petitions. Following the August 2025 merger with Soli Organic, former Whole Foods Market co-CEO Walter Robb joined the combined governing board as director and co-chairman alongside Soli Organic co-founder Ulf Jonsson. The governance structure oversaw a complex twelve-company legal hierarchy comprising facility operating entities (such as 80 Acres Florence LLC), asset-holding shells (SG Assets LLC and Trellis Loop entities), and acquired operating units (ShenGrow, Inc., Soli Organic, Inc., and Kalera-derived Lactuca LLCs). This corporate fragmentation became fully apparent only when unanimous written consent on August 21, 2026 authorized Chapter 7 liquidation."
    claimRefs:
      - "CO006"
      - "CO007"
      - "CO008"
      - "CO009"
      - "CO010"
    tableRefs:
      - "TO002"
  - id: "capitalization-and-strategic-expansion"
    title: "Capitalization, Strategic M&A, and Liquidation Milestones"
    body: "Throughout its operating history, 80 Acres Farms secured substantial institutional backing across multiple venture and private equity rounds, raising over $40 million in private equity funding from Virgo Investment Group in January 2019 to complete its automated Hamilton indoor facility, followed by institutional investments from Barclays Climate Ventures, Siemens Financial Services, Blue Earth Capital, and Taurus Investment Holdings through early 2025. In March 2025, 80 Acres pursued industry consolidation by acquiring three operating indoor vertical farms in Georgia, Texas, and Colorado from bankrupt peer Kalera. In August 2025, the company announced a landmark merger with indoor organic agriculture leader Soli Organic, uniting 80 Acres' GroLoop technology with Soli's 35-year retail distribution footprint across 17,000 storefronts to target $200 million in annual revenues and 15 to 20 million pounds of produce capacity. However, the capital-intensive cost structure, high electricity and staffing burdens, and failure to secure a rescue acquisition or new financing triggered an operational shutdown on August 3, 2026. On August 25, 2026, 80 Acres Urban Agriculture, Inc. and eleven affiliates filed voluntary Chapter 7 bankruptcy petitions in the U.S. Bankruptcy Court for the District of Delaware (Case No. 26-11324-BLS), reporting liabilities between $100 million and $500 million."
    claimRefs:
      - "CO011"
      - "CO012"
      - "CO013"
      - "CO014"
      - "CO015"
      - "CO016"
