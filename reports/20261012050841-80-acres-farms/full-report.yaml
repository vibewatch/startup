              - CV006
              - CV007
              - CV008
              - CV013
      - number: '8.2'
        title: Investment Thesis vs. Structural Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The core investment thesis behind 80 Acres Farms rested on the premise that combining proprietary GroLoop
              automated growing systems with national retail distribution would unlock unassailable economies of scale.
              The August 2025 merger with Soli Organic was specifically engineered to accelerate this thesis, projecting
              first-year combined revenues approaching $200 million across more than 17,000 retail storefronts and an
              annual capacity of 15 to 20 million pounds of produce. In reality, co-founder and CEO Mike Zelkind
              conceded in early 2026 that while individual automated farm facilities achieved positive site-level
              contribution margins, corporate overhead, software development, and integration expenditures remained
              structurally unsupportable. Producing approximately 10 million servings per facility per year proved
              insufficient to bridge the corporate deficit. The Soli transaction dramatically compounded administrative
              complexity and debt obligations rather than providing operating relief, demonstrating that scaling
              commodity agricultural operations without consolidated unit-economic discipline merely accelerates cash
              depletion.
            claimRefs:
              - CV003
              - CV004
              - CV007
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV007
              - CV009
      - number: '8.3'
        title: Liquidation Scenarios and Capital Recovery Analysis
        blocks:
          - type: paragraph
            body: >-
              Faced with Delaware Chapter 7 bankruptcy proceedings, all valuation analyses must transition from
              going-concern multiples to a distressed asset liquidation waterfall. In October 2025, the company had
              completed a $28.4 million financing round alongside an active $150 million offering, but cash reserves
              evaporated within months amid post-merger operational friction. Unpaid trade suppliers and PACA litigation
              in July 2026 signaled total insolvency weeks before the shutdown. Under our base-case liquidation
              scenario, specialized automated farming equipment, conveyance robotics, and LED infrastructure across
              Ohio, Kentucky, and acquired Kalera sites will be sold at piecemeal auctions by the bankruptcy trustee,
              yielding an estimated recovery of only 10 to 25 cents on the dollar for senior secured equipment lenders.
              General unsecured trade creditors and equipment lessors face near-zero recovery. In all modeled
              scenarios—bull, base, or bear—existing preferred and common equity holders receive zero financial
              distribution, confirming total capital impairment.
            claimRefs:
              - CV008
              - CV010
              - CV011
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV006
              - CV008
              - CV010
              - CV013
      - number: '8.4'
        title: Industry Shakeout, Precedent Failures, and Post-Mortem Diligence
        blocks:
          - type: paragraph
            body: >-
              The collapse of 80 Acres Farms marks the definitive culmination of the first-wave controlled-environment
              agriculture shakeout, echoing the prior bankruptcies, restructurings, and fire sales of peers including
              Plenty, AeroFarms, AppHarvest, and Kalera. Between 2019 and early 2025, 80 Acres raised substantial
              private equity and extension capital from Virgo Investment Group, Barclays, and Siemens, yet never
              publicly filed audited financial statements or GAAP gross margins. Venture capital funding for indoor
              farming plunged from billions at its peak to merely $57 million across five deals by mid-2025, completely
              shutting the refinancing window for cash-burning operators. For prospective institutional investors
              examining surviving agricultural technology assets, key post-mortem diligence requirements include
              verifying audited farm-level EBITDA before centralized allocations, demanding binding customer off-take
              agreements covering at least 50% of harvest volume, and enforcing strict governance triggers that prohibit
              unhedged multi-entity mergers ahead of proven positive consolidated cash flow.
            claimRefs:
              - CV002
              - CV009
              - CV010
              - CV012
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The Advanced Manufacturing vs. Software Capitalization Trap
            body: >-
              80 Acres Farms fell victim to controlled-environment agriculture's foundational capitalization mismatch:
              funding a capital-intensive, low-margin manufacturing enterprise with high-cost venture and growth equity
              expecting software-like scaling economics. While individual automated grow rooms demonstrated positive
              operating contribution margins, the heavy corporate overhead layer, combined with debt service and
              facility carrying costs, proved impossible to absorb through retail commodity produce sales, leading
              directly to Delaware Chapter 7 liquidation.
            calloutType: risk
            claimRefs:
              - CV001
              - CV007
              - CV013
