chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Founding, and Platform Evolution
        blocks:
          - type: paragraph
            body: >-
              80 Acres Farms (legally incorporated in Delaware bankruptcy proceedings as 80 Acres Urban Agriculture,
              Inc.) was established in 2015 by co-founders Mike Zelkind and Tisha Livingston with headquarters located
              at 345 High Street in Hamilton, Ohio. The company pioneered indoor vertical farming aimed at producing
              fresh, pesticide-free culinary produce—predominantly leafy salad greens, microgreens, vine crops, and
              culinary herbs—in proximity to urban consumers. The core operational differentiator was its proprietary
              GroLoop automation platform, developed through its Dutch-Israeli-American technology subsidiary Infinite
              Acres alongside key industrial automation partners including Siemens, Signify, SICK, and TTA-ISO. GroLoop
              integrated hardware, robotics, environmental sensing, and artificial intelligence to automate seeding,
              crop spacing, nutrient delivery, and harvesting while maintaining precise microclimate recipes. The
              company claimed its indoor facilities utilized 100% renewable electricity and reduced water consumption by
              95% per pound of produce compared to conventional field agriculture. Despite these technological
              milestones, the capital-intensive nature of vertical farming ultimately overwhelmed the business model,
              leading to insolvency in late 2026.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
