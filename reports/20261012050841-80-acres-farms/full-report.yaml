figures:
  - id: FO001
    title: 80 Acres Farms Strategic Milestone Evolution (2015-2026)
    type: timeline
    summary: Chronology of key corporate founding, technology platform, financing, acquisition, and bankruptcy milestones.
    data:
      items:
        - label: '2015: Founding in Hamilton'
          date: '2015-01-01'
          detail: >-
            Mike Zelkind and Tisha Livingston establish 80 Acres Farms in Hamilton, Ohio to pioneer automated indoor
            agriculture.
          tone: positive
        - label: 'Jan 2019: $40M PE Round'
          date: '2019-01-17'
          detail: >-
            Virgo Investment Group invests over $40 million in private equity to construct the flagship automated
            Hamilton facility.
          tone: positive
        - label: 'Jun 2019: Infinite Acres JV'
          date: '2019-06-10'
          detail: >-
            Forms Infinite Acres technology joint venture alongside Priva and Ocado to develop proprietary indoor
            automation.
          tone: positive
        - label: 'Nov 2021: Hamilton Scale'
          date: '2021-11-16'
          detail: >-
            Fully operates 70,000 sq ft Hamilton automated farm producing approximately 10 million servings annually for
            retail partners.
          tone: positive
        - label: 'Feb 2025: Extension Funding'
          date: '2025-02-10'
          detail: Closes Series B extension financing supported by Barclays Climate Ventures, Siemens, and Blue Earth Capital.
          tone: neutral
        - label: 'Mar 2025: Kalera Farm Acquisition'
          date: '2025-03-04'
          detail: >-
            Acquires three operational vertical farms in Georgia, Texas, and Colorado out of Kalera's bankruptcy
            restructuring.
          tone: positive
        - label: 'Aug 2025: Soli Organic Merger'
          date: '2025-08-18'
          detail: >-
            Merges with Soli Organic to create national indoor farming network projecting $200 million in combined
            revenue.
          tone: positive
        - label: 'Aug 2026: Shutdown Announcement'
          date: '2026-08-03'
          detail: >-
            Announces operational wind-down following the collapse of a last-minute acquisition and inability to raise
            capital.
          tone: negative
        - label: 'Aug 2026: Chapter 7 Bankruptcy'
          date: '2026-08-25'
          detail: >-
            80 Acres Urban Agriculture, Inc. and 11 affiliates file voluntary Chapter 7 bankruptcy petitions in Delaware
            court.
          tone: negative
    approximationNotes: >-
      Dates correspond to verified company press announcements, trade news reports, and official federal bankruptcy
      court filings.
