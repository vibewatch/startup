      - number: '1.2'
        title: Executive Leadership, Governance, and Corporate Architecture
        blocks:
          - type: paragraph
            body: >-
              80 Acres Farms was led by Chief Executive Officer Mike Zelkind and co-founder Tisha Livingston, who served
              as Chief Executive Officer of technology subsidiary Infinite Acres. Executive management also featured
              Noah Zelkind, who initially directed business development before advancing to Chief Operating Officer in
              February 2025 to oversee operations, engineering, agronomy, and supply chain following major consolidation
              transactions. Legal and intellectual property governance was headed by General Counsel and Chief
              Intellectual Property Officer Boris Zelkind, who formally executed the company's Delaware bankruptcy
              petitions. Following the August 2025 merger with Soli Organic, former Whole Foods Market co-CEO Walter
              Robb joined the combined governing board as director and co-chairman alongside Soli Organic co-founder Ulf
              Jonsson. The governance structure oversaw a complex twelve-company legal hierarchy comprising facility
              operating entities (such as 80 Acres Florence LLC), asset-holding shells (SG Assets LLC and Trellis Loop
              entities), and acquired operating units (ShenGrow, Inc., Soli Organic, Inc., and Kalera-derived Lactuca
              LLCs). This corporate fragmentation became fully apparent only when unanimous written consent on August
              21, 2026 authorized Chapter 7 liquidation.
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO009
              - CO010
