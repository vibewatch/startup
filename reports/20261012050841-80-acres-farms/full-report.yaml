      - number: '1.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Consolidation Masked Critical Structural Fragility
            body: >-
              The rapid succession of the Kalera asset acquisition in March 2025 and the Soli Organic merger in August
              2025 appeared to position 80 Acres Farms as the ultimate survivor in vertical farming, boasting $200
              million in projected revenue and 17,000 retail endpoints. However, rather than resolving vertical
              farming's underlying unit economic challenges—high energy consumption, substantial facility depreciation,
              and commodity price caps—the aggressive M&A expanded the company's fixed overhead across twelve separate
              operating entities, accelerating its liquidity exhaustion when growth capital dried up.
            calloutType: insight
            claimRefs:
              - CO003
              - CO013
              - CO014
              - CO015
              - CO016
          - type: callout
            title: Chapter 7 Liquidation Precludes Corporate Reorganization
            body: >-
              Unlike peers such as Plenty or AppHarvest that utilized Chapter 11 to restructure debt and emerge with
              refined footprints, 80 Acres Farms elected Chapter 7 liquidation under Case No. 26-11324-BLS. This filing
              halts all ongoing litigation (including vendor breach-of-contract and PACA lawsuits) and hands all estate
              assets across twelve corporate affiliates over to a court-appointed trustee, leaving unsecured trade
              creditors and equity investors with minimal to zero recovery.
            calloutType: risk
            claimRefs:
              - CO008
              - CO015
              - CO016
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundaries, Included Spend, and Category Adjacencies
        blocks:
          - type: paragraph
            body: >-
              The commercial scope of 80 Acres Farms spans premium controlled-environment leafy greens, culinary herbs,
              salad kits, and agricultural automation software. In indoor farming, addressable spend is constrained to
              produce categories where artificial environmental control offers superior freshness, consistency, and food
              safety compared to conventional open-field agriculture. Rather than competing as a low-cost bulk commodity
              supplier, the company targeted the high-velocity, pre-packaged salad and culinary herb categories across
              major supermarket chains. The August 2025 merger with Soli Organic significantly broadened this boundary
              by integrating soil-based organic potted and cut herbs with vertical-farmed greens. However, commodity
              crops such as iceberg lettuce, field tomatoes, and bulk brassicas remain firmly excluded from addressable
              indoor spend due to insurmountable energy economics relative to sunlight-grown alternatives.
            claimRefs:
              - CM001
              - CM004
              - CM005
              - CM011
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM004
              - CM005
              - CM011
      - number: '2.2'
        title: 'Sizing Lenses: TAM, Controlled-Environment Capacity, and Production Realities'
        blocks:
          - type: paragraph
            body: >-
              Evaluating the market opportunity for 80 Acres Farms requires separating top-down agricultural macro
              estimates from facility-level operational constraints. While the total United States fresh produce retail
              market exceeds $80 billion annually, the controlled-environment agriculture portion represents a far
              narrower $3 billion to $5 billion addressable slice. At the combined entity level, the merger of 80 Acres
              Farms and Soli Organic established a projected first-year revenue run-rate approaching $200 million,
              backed by a production capacity of 15 to 20 million pounds across seven vertical farms. Across
              approximately one million square feet of growing space across six states, this output was positioned to
              serve over 17,000 retail storefronts nationwide. Nevertheless, capital intensity created sharp friction
              against expansion: venture financing across the entire indoor farming sector contracted to just $57
              million by mid-2025, leaving operators vulnerable to any cash flow delays.
            claimRefs:
              - CM002
              - CM003
              - CM006
              - CM008
              - CM010
