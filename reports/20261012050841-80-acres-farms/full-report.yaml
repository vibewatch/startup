  - id: FE001
    title: Infinite Acres GroLoop Operating Architecture Stack
    type: stack
    summary: Six-tier functional stack of 80 Acres Farms' proprietary GroLoop controlled-environment agriculture platform.
    data:
      layers:
        - label: 'Level 6: Enterprise Distribution & Predictive Logistics'
          description: >-
            Integration layer connecting indoor farm production schedules to cold-chain logistics and grocery retail
            portals.
          modules:
            - Cold-chain route dispatch
            - Retail replenishment EDI integration
            - Shelf-life optimization tracking
        - label: 'Level 5: AI Agronomic Intelligence & Digital Twin'
          description: >-
            Algorithmic layer simulating biological plant growth, forecasting crop yields, and identifying micro-climate
            irregularities.
          modules:
            - Siemens plant growth digital twin simulation
            - Machine learning vision anomaly detection
            - Predictive harvest yield forecasting
        - label: 'Level 4: Facility Automation & Energy Management'
          description: Centralized supervisory control and power distribution monitoring across the entire facility footprint.
          modules:
            - Siemens Smart Infrastructure power monitoring
            - Building automation and fire/life safety interfaces
            - Facility-wide energy telemetry dashboards
        - label: 'Level 3: Edge Control & Production Line Robotics'
          description: Distributed industrial controllers executing physical motion, tray routing, and packaging automation.
          modules:
            - Siemens edge industrial controllers & HMIs
            - Automated tray transport shuttles
            - Robotic harvesting and packaging stations
        - label: 'Level 2: Micro-Climate & Fertigation Subsystems'
          description: Closed-loop environmental control regulating atmospheric parameters and nutrient delivery recipes.
          modules:
            - Priva horticultural environmental control
            - Dynamic spectrum LED lighting arrays
            - Automated closed-loop fertigation and dosing
        - label: 'Level 1: Modular Biosecure Growth Cells'
          description: Physical multi-tier vertical racking arranged into isolated physical compartments to prevent disease spread.
          modules:
            - Sectioned modular cultivation bays
            - HEPA air handling and positive pressure zones
            - Multi-tier vertical racking infrastructure
    approximationNotes: Layer boundaries represent functional subsystems integrated into the Infinite Acres GroLoop platform.
    claimRefs:
      - CE002
      - CE003
      - CE004
      - CE012
  - id: FU001
    title: Customer Journey and Lifecycle Adoption Map
    type: journey-map
    summary: Adoption phases, touchpoints, and structural commercial friction across retail supermarket distribution.
    approximationNotes: >-
      Lifecycle stages and friction points derived from company disclosures, retailer contract dynamics, and bankruptcy
      records.
    claimRefs:
      - CU013
      - CU014
      - CU015
      - CU016
    data:
      items:
        - label: Retail Buyer Procurement & Category Review
          stage: Procurement & Evaluation
          touchpoints: Produce buyer RFP and regional slotting review
          channel: Direct retail headquarters procurement
          objective: Securing shelf-space commitments across grocery chain divisions
          friction: Demands for introductory promotional allowances and price parity with field produce
        - label: Logistics Onboarding & DC Delivery
          stage: Distribution Onboarding
          touchpoints: Cold-chain delivery to grocery distribution centers
          channel: Regional refrigerated logistics network
          objective: Just-in-time cross-dock delivery within 24-48 hours of indoor harvest
          friction: Stringent on-time delivery windows and chargebacks for delayed shipments
        - label: Store-Level Shelf Placement & Merchandising
          stage: Retail Merchandising
          touchpoints: Packaged salad and culinary herb displays in produce aisle
          channel: Refrigerated retail produce shelves
          objective: Consumer product visibility and brand ambassador sampling
          friction: Limited prime eye-level shelf space and competition from legacy greenhouse brands
        - label: Consumer Trial & Initial Purchase
          stage: Point of Sale
          touchpoints: Shopper purchase of pesticide-free salads and fresh herbs
          channel: In-store checkout and online grocery pickup
          objective: Establishing brand recognition and value perception around freshness
          friction: Price sensitivity during inflationary grocery cycles
        - label: Repeat Purchase & Velocity Expansion
          stage: Category Expansion
          touchpoints: Weekly grocery re-orders and multi-pack SKU adoption
          channel: Loyalty program scans and automated store replenishment
          objective: Driving category velocity to protect shelf allocation
          friction: Lack of marketing spend to sustain out-of-region consumer velocity
        - label: Contract Renewal & Terminal Financial Disruption
          stage: Contract Settlement
          touchpoints: Annual grocery vendor review and credit terms
          channel: Vendor accounting and retail accounts payable
          objective: Sustaining long-term supply contracts and cash collection
          friction: Severe working capital squeeze, unpaid vendor claims, and Chapter 7 liquidation
