      - number: '1.3'
        title: Capitalization, Strategic M&A, and Liquidation Milestones
        blocks:
          - type: paragraph
            body: >-
              Throughout its operating history, 80 Acres Farms secured substantial institutional backing across multiple
              venture and private equity rounds, raising over $40 million in private equity funding from Virgo
              Investment Group in January 2019 to complete its automated Hamilton indoor facility, followed by
              institutional investments from Barclays Climate Ventures, Siemens Financial Services, Blue Earth Capital,
              and Taurus Investment Holdings through early 2025. In March 2025, 80 Acres pursued industry consolidation
              by acquiring three operating indoor vertical farms in Georgia, Texas, and Colorado from bankrupt peer
              Kalera. In August 2025, the company announced a landmark merger with indoor organic agriculture leader
              Soli Organic, uniting 80 Acres' GroLoop technology with Soli's 35-year retail distribution footprint
              across 17,000 storefronts to target $200 million in annual revenues and 15 to 20 million pounds of produce
              capacity. However, the capital-intensive cost structure, high electricity and staffing burdens, and
              failure to secure a rescue acquisition or new financing triggered an operational shutdown on August 3,
              2026. On August 25, 2026, 80 Acres Urban Agriculture, Inc. and eleven affiliates filed voluntary Chapter 7
              bankruptcy petitions in the U.S. Bankruptcy Court for the District of Delaware (Case No. 26-11324-BLS),
              reporting liabilities between $100 million and $500 million.
            claimRefs:
