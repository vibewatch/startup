  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Sequential causal chain tracing 80 Acres Farms from operational scale and capital investment to overhead trap,
      liquidity collapse, Chapter 7 bankruptcy, and final avoid recommendation.
    data:
      nodes:
        - id: scale-and-technology
          label: 1. Operational Scale & Technology
          description: Built 7 automated vertical farms powered by GroLoop, raising $350M+ and merging with Soli Organic.
        - id: overhead-trap
          label: 2. The Corporate Overhead Ratio
          description: >-
            Farms generated positive site margins, but corporate SG&A and three acquisitions created unsupportable
            central burn.
        - id: commodity-margins
          label: 3. Commodity Price Compression
          description: Retail pricing on greens and herbs remained constrained by conventional field-grown produce competition.
        - id: working-capital-crisis
          label: 4. Working Capital Exhaustion
          description: CEA venture funding collapsed to $57M; unpaid suppliers, facility closures, and July 2026 PACA lawsuit.
        - id: deal-withdrawal
          label: 5. Acquirer Deal Withdrawal
          description: Prospective acquirer withdrew on August 2, 2026, triggering immediate cessation of operations on August 3.
        - id: chapter-7-filing
          label: 6. Chapter 7 Delaware Liquidation
          description: >-
            Filed Chapter 7 bankruptcy across 12 affiliates with $100M-$500M liabilities, liquidating all physical
            assets.
        - id: final-recommendation
          label: '7. Recommendation: AVOID'
          description: Zero equity value, severe impairment for debt tranches, and complete structural business model failure.
    approximationNotes: >-
      Causal pathway synthesized from company operational disclosures, executive admissions, and Delaware bankruptcy
      court filings.
