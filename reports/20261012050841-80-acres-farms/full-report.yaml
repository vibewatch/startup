  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Commercial Revenue Streams and Pricing Dynamics
        blocks:
          - type: paragraph
            body: >-
              80 Acres Farms operated as one of the largest indoor vertical farming enterprises in the United States,
              generating commercial revenue through the wholesale distribution of fresh, pesticide-free produce to
              retail supermarkets and foodservice operators. Its primary product catalog centered on packaged salad
              blends, salad kits, culinary herbs, microgreens, and vine crops such as tomatoes and cucumbers. At its
              commercial peak following the August 2025 merger with Soli Organic, the combined network served an
              expansive footprint spanning over 17,000 to 18,000 retail storefronts nationwide, including major grocery
              chains such as Walmart, Albertsons, Kroger, and H-E-B. The merger was publicized with aggressive forward
              guidance, projecting combined first-year net revenues approaching $200 million across seven operating
              facilities. However, commercial monetization was heavily constrained by grocery retail dynamics: packaged
              salads faced sharp price sensitivity against conventional outdoor field crops, forcing realized wholesale
              prices into an estimated $1.60 to $2.20 per clamshell band while grocers retained customary 35% to 40%
              retail margins. Because vertical farming produce commanded only a modest retail shelf premium, volume
              growth failed to generate high-margin operating cash flows.
            claimRefs:
              - CI001
              - CI002
              - CI004
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI004
          - type: table
