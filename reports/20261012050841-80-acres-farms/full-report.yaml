              - CU004
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU013
              - CU014
              - CU015
              - CU016
      - number: '6.2'
        title: Adoption Trajectory, Volume Scale, and Geographic Reach
        blocks:
          - type: paragraph
            body: >-
              Commercial adoption of 80 Acres Farms produce progressed from local Midwest pilot deployments into
              commercial-scale wholesale distribution. In 2024, the company reported selling approximately 2 million
              kilograms (2,000 metric tons) of fresh indoor produce, operating across two commercial indoor farms in the
              greater Cincinnati area that supplied over 1,500 retail locations. The August 2025 merger with indoor herb
              producer Soli Organic expanded production capacity to an estimated 15 to 20 million pounds annually across
              seven vertical facilities, while projecting combined first-year revenues approaching $200 million. Through
              Soli Organic's mature distribution network, the combined entity accessed an estimated 70% of the top ten
              grocery retailers in the United States. However, this aggressive expansion of retail doors outpaced actual
              cash generation and market demand. While headline retail distribution reached more than 18,000 store
              locations over the company's operating lifespan, facility-level throughput struggled to cover the heavy
              capital expenditures, facility debt, and elevated operational costs of indoor controlled-environment
              farming.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
      - number: '6.3'
        title: Named Customer Deployments and Commercial Proof
        blocks:
          - type: paragraph
            body: >-
              The company established prominent commercial relationships with several of the nation's largest grocery
              supermarket operators. The Kroger Co. served as an early foundational partner, stocking 80 Acres Farms
              packaged salads and greens across regional supermarkets in the Midwest and collaborating on brand
              visibility. Following the integration with Soli Organic, distribution expanded across national mass-market
              and grocery leaders, including Walmart Inc. and Safeway (Albertsons), which stocked culinary herbs and
              pre-packaged organic greens in produce departments nationwide. In addition to national retail giants,
              independent restaurants and regional hospitality businesses in southwest Ohio sourced fresh greens and
              microgreens directly from local farms. Despite broad deployment across premier retail banners, these
              relationships functioned strictly on standard commercial wholesale terms rather than long-term take-or-pay
              volume guarantees. Retail partners did not provide emergency liquidity, bridge financing, or capital
              relief when 80 Acres Farms encountered severe financial distress in 2026.
            claimRefs:
              - CU006
              - CU009
              - CU010
              - CU011
              - CU012
          - type: table
            tableRef: TU003
            claimRefs:
              - CU006
              - CU009
              - CU010
              - CU011
              - CU012
      - number: '6.4'
        title: Durability, Customer Concentration, and Commercial Breakdown
        blocks:
          - type: paragraph
            body: >-
              Despite widespread storefront availability, 80 Acres Farms suffered from critical customer concentration
              and weak pricing power that undermined its long-term viability. National supermarket chains exerted
              intense margin pressure, treating vertical farm greens as substitutes for outdoor and greenhouse commodity
              produce rather than sustaining a permanent premium. The company never disclosed audited retention rates,
              customer churn, or net revenue retention, leaving the underlying durability of its account relationships
              unverified. Operational cracks surfaced in May 2026 when the company closed the former Soli Organic
              production facility in Harrisonburg, Virginia, laying off 80 workers. Unable to secure required equity
              capital or debt refinancing, 80 Acres Farms announced on August 3, 2026, that it would wind down all
              business operations. On August 25, 2026, the parent company and eleven operating affiliates filed for
              Chapter 7 bankruptcy liquidation in the U.S. Bankruptcy Court for the District of Delaware, listing
              hundreds of millions of dollars in liabilities and confirming the complete termination of commercial
              customer supply.
            claimRefs:
              - CU008
              - CU010
              - CU011
              - CU012
              - CU014
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Severe Customer Concentration and Commodity Retail Pricing Power
            body: >-
              While 80 Acres Farms expanded its distribution footprint across more than 17,000 retail storefronts
              following the Soli Organic merger, its core revenue remained heavily dependent on a handful of national
              supermarket chains including Kroger, Walmart, and Safeway. Supermarket produce buyers possess immense
              bargaining leverage, forcing indoor growers to compete near outdoor commodity price points while bearing
              the high fixed energy and capital costs of controlled-environment facilities.
            calloutType: risk
            claimRefs:
              - CU010
              - CU011
              - CU014
          - type: callout
            title: Door Count Expansion Masked Underlying Facility-Level Losses
            body: >-
              Expanding retail door count from 1,500 regional stores to over 17,000 storefronts created the illusion of
              massive commercial momentum. However, high distribution footprint without corresponding consumer velocity
              or premium pricing resulted in negative cash flow, facility closures like the Harrisonburg site, and
              ultimately a complete operational liquidation under Chapter 7 bankruptcy.
            calloutType: insight
            claimRefs:
              - CU004
              - CU008
              - CU012
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Legal, Regulatory, and Insolvency Proceedings
        blocks:
          - type: paragraph
            body: >-
              On August 25, 2026, 80 Acres Urban Agriculture, Inc. and eleven affiliated corporate entities filed
              voluntary Chapter 7 bankruptcy petitions for liquidation in the U.S. Bankruptcy Court for the District of
              Delaware under Case No. 26-11324-BLS. The court filings report estimated assets and liabilities each
              between $100 million and $500 million, alongside 200 to 999 creditors, and state that no funds are
              expected to remain for general unsecured creditors following administrative expense disbursements. The
              bankruptcy petition triggered an immediate automatic stay under U.S. bankruptcy law, freezing multiple
              pending civil lawsuits, including a federal Perishable Agricultural Commodities Act (PACA) trust action by
              a California produce supplier for more than $230,000 in unpaid produce invoices and a breach of contract
              complaint by a commercial staffing provider seeking over $687,000 in unpaid labor fees. Additionally,
              terminated workers initiated a proposed class action alleging statutory WARN Act violations after roughly
              500 employees were dismissed without the mandatory 60-day notice or severance payments. The filing
              encompasses twelve separate legal structures, including facility property entities (Trellis Loop) and
              entities acquired from Kalera's prior insolvency (Lactuca), confirming that corporate complexity failed to
              insulate the parent enterprise from insolvency.
            claimRefs:
              - CR001
              - CR002
              - CR006
              - CR007
              - CR008
              - CR010
              - CR014
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR006
              - CR007
              - CR014
      - number: '7.2'
        title: Operational Failure Modes and Overhead-to-Revenue Imbalance
        blocks:
          - type: paragraph
            body: >-
              The operational failure of 80 Acres Farms highlights a fundamental structural vulnerability in
              controlled-environment agriculture: the inability of farm-level unit economics to support centralized
              technology and corporate overhead. Prior to liquidation, chief executive Mike Zelkind acknowledged that
              while individual vertical farms achieved positive contribution margins, the consolidated enterprise
              remained deeply unprofitable once centralized SG&A and multi-facility integration expenses were included.
              Rather than operating as an asset-light technology platform, the business carried the intense capital
              expenditure, heavy baseload LED lighting and HVAC dehumidification power requirements, and high
              specialized labor costs typical of advanced manufacturing. Efforts to integrate three distressed Kalera
              facilities alongside the Soli Organic merger drained operational cash reserves. When liquidity tightened,
              80 Acres permanently closed its Virginia Pack facility in Harrisonburg, eliminating 80 jobs, and halted
              operations in Marysville, Washington, before initiating an uncoordinated shutdown of its entire production
              footprint on August 3, 2026, cutting over 800 positions across eight states without severance.
            claimRefs:
              - CR004
              - CR005
              - CR009
              - CR012
              - CR015
          - type: table
            tableRef: TR002
            claimRefs:
              - CR004
              - CR005
              - CR009
              - CR010
              - CR012
              - CR015
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
