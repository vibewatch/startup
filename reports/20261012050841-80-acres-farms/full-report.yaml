      - number: '5.2'
        title: Infinite Acres GroLoop Operating Architecture
        blocks:
          - type: paragraph
            body: >-
              At the technical core of 80 Acres Farms is the GroLoop operating platform, developed and industrialized
              through its dedicated technology subsidiary, Infinite Acres. GroLoop functions as a vertically integrated
              platform uniting industrial automation, environmental controls, robotics, and proprietary algorithmic
              software. The platform coordinates multi-tier environmental conditions, managing LED illumination
              spectrums, carbon dioxide concentration, ambient temperature, relative humidity, and dynamic closed-loop
              fertigation across every cultivation zone. In developing and standardizing GroLoop, Infinite Acres
              collaborated with world-class industrial engineering and technology partners, including European
              horticultural automation provider Priva, robotic logistics specialist Ocado, and lighting manufacturer
              Signify. Furthermore, Siemens serves as a strategic technology partner and investor, supplying advanced
              power distribution infrastructure, building management systems, edge automation controllers, and digital
              twin software. Developed by Siemens Digital Industries Software, the digital twin framework simulates
              plant growth and thermodynamic conditions to optimize harvest yields and operational efficiency.
            claimRefs:
              - CE002
