      - number: '2.3'
        title: Buyer Segmentation, Budget Ownership, and Supermarket Adoption Paths
        blocks:
          - type: paragraph
            body: >-
              Adoption of vertical farm produce is governed by grocery produce category managers and retail procurement
              directors who prioritize supply chain surety, shelf-life extension, and shrink reduction. Traditional
              field agriculture exposes grocers to weather disruptions, contamination recalls, and extended
              transcontinental freight from western growing valleys. 80 Acres Farms structured its commercial adoption
              around direct relationships with tier-one grocery chains, including Kroger and Whole Foods Market. Early
              operations prioritized localized distribution within a two-hour radius of Hamilton, Ohio, before the Soli
              Organic merger and Kalera asset acquisitions expanded distribution nationally to over 17,000 storefronts.
              Retail buyers pay a modest wholesale premium in exchange for guaranteed fill rates, year-round pricing
              stability, and produce that arrives washed and ready to consume with extended consumer shelf life.
            claimRefs:
              - CM001
              - CM004
              - CM005
              - CM009
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM004
              - CM005
              - CM013
      - number: '2.4'
        title: Structural Growth Drivers vs. Capital Intensity and Wind-Down Headwinds
        blocks:
          - type: paragraph
            body: >-
              Long-term demand drivers for indoor agriculture remain compelling: retail grocers demand reliable,
              pesticide-free supply chains insulated from extreme climate shocks and water scarcity. In response, 80
              Acres developed GroLoop through technology subsidiary Infinite Acres, attempting to monetize software
              optimization across farm networks. Yet these operational advantages were overwhelmed by severe capital
              constraints. Vertical farming unit economics require substantial capital expenditure and elevated
              operating expenses, where labor and electricity costs dominate facility operating budgets. After raising
              over $350 million in growth funding, 80 Acres Farms experienced acute post-merger integration challenges,
              culminating in the closure of a Virginia packaging facility and 80 layoffs in May 2026. By August 2026,
              unable to secure additional capital amidst a broader venture funding retreat, 80 Acres Farms announced the
              wind-down of its operations, demonstrating the fragility of indoor farming models under tight capital
              markets.
            claimRefs:
              - CM002
              - CM007
              - CM008
              - CM011
              - CM012
              - CM014
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Severe Contraction in Controlled-Environment Venture Capital
            body: >-
              Venture investment into indoor agriculture collapsed from billions at its peak to just $57 million across
              five deals by mid-2025, stranding capital-intensive operators unable to reach cash breakeven before
              existing reserves were depleted.
            calloutType: risk
            claimRefs:
              - CM006
              - CM007
          - type: callout
            title: Consolidation as an Operational Survival Mechanism
            body: >-
              The strategic merger between 80 Acres Farms and Soli Organic represented an industry-wide push to combine
              indoor automation platforms with existing multi-decade supermarket distribution relationships to offset
              elevated facility overhead.
            calloutType: insight
            claimRefs:
