callouts:
  - calloutType: "risk"
    title: "The Advanced Manufacturing vs. Software Capitalization Trap"
    body: "80 Acres Farms fell victim to controlled-environment agriculture's foundational capitalization mismatch: funding a capital-intensive, low-margin manufacturing enterprise with high-cost venture and growth equity expecting software-like scaling economics. While individual automated grow rooms demonstrated positive operating contribution margins, the heavy corporate overhead layer, combined with debt service and facility carrying costs, proved impossible to absorb through retail commodity produce sales, leading directly to Delaware Chapter 7 liquidation."
    claimRefs:
      - "CV001"
      - "CV007"
      - "CV013"
