figures:
  - id: FE001
    title: Infinite Acres GroLoop Operating Architecture Stack
    type: stack
    summary: Six-tier functional stack of 80 Acres Farms' proprietary GroLoop controlled-environment agriculture platform.
    data:
      layers:
        - label: 'Level 6: Enterprise Distribution & Predictive Logistics'
          description: >-
            Integration layer connecting indoor farm production schedules to cold-chain logistics and grocery retail
            portals.
          modules:
            - Cold-chain route dispatch
            - Retail replenishment EDI integration
            - Shelf-life optimization tracking
        - label: 'Level 5: AI Agronomic Intelligence & Digital Twin'
          description: >-
            Algorithmic layer simulating biological plant growth, forecasting crop yields, and identifying micro-climate
            irregularities.
          modules:
            - Siemens plant growth digital twin simulation
            - Machine learning vision anomaly detection
            - Predictive harvest yield forecasting
        - label: 'Level 4: Facility Automation & Energy Management'
          description: Centralized supervisory control and power distribution monitoring across the entire facility footprint.
          modules:
            - Siemens Smart Infrastructure power monitoring
            - Building automation and fire/life safety interfaces
            - Facility-wide energy telemetry dashboards
        - label: 'Level 3: Edge Control & Production Line Robotics'
          description: Distributed industrial controllers executing physical motion, tray routing, and packaging automation.
          modules:
            - Siemens edge industrial controllers & HMIs
            - Automated tray transport shuttles
            - Robotic harvesting and packaging stations
        - label: 'Level 2: Micro-Climate & Fertigation Subsystems'
          description: Closed-loop environmental control regulating atmospheric parameters and nutrient delivery recipes.
          modules:
            - Priva horticultural environmental control
            - Dynamic spectrum LED lighting arrays
            - Automated closed-loop fertigation and dosing
        - label: 'Level 1: Modular Biosecure Growth Cells'
          description: Physical multi-tier vertical racking arranged into isolated physical compartments to prevent disease spread.
          modules:
            - Sectioned modular cultivation bays
            - HEPA air handling and positive pressure zones
            - Multi-tier vertical racking infrastructure
    approximationNotes: Layer boundaries represent functional subsystems integrated into the Infinite Acres GroLoop platform.
    claimRefs:
      - CE002
      - CE003
      - CE004
      - CE012
