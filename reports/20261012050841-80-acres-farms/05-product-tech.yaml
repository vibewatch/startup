  - id: TE002
    title: Cultivation & Sourcing Workflow Use-Case Matrix
    columns:
      - User Job
      - Current Field / Traditional Workflow
      - 80 Acres CEA Solution
      - Measurable Benefit
      - Technical Limitation
    rows:
      - - Supermarket Produce Sourcing
        - Long-distance transcontinental shipping from California/Arizona fields
        - Regional indoor cultivation within hours of distribution hubs
        - 95% less water per pound and multi-day shelf-life extension
        - High facility power consumption and capital amortization costs
      - - Commercial Culinary Herb Fulfillment
        - Field-grown seasonal harvests vulnerable to drought, unseasonal frost, and transport spoilage
        - Controlled-environment organic cultivation with climate-resilient recipes
        - Year-round surety of supply and consistent leaf quality across seasons
        - Narrow crop envelope limited to high-value leafy items and herbs
      - - Foodservice Kitchen Prep
        - Manual washing, trimming, and high scrap loss from field-dirt and contamination
        - Pesticide-free, clean ready-to-eat produce requiring minimal prep
        - Zero required chemical washing and reduced kitchen labor waste
        - Premium wholesale pricing compared to bulk field commodity greens
      - - Regional Retail Supply Resilience
        - Centralized national cold chain subject to interstate trucking delays and weather disruption
        - Distributed network of 7 regional vertical farms and logistics hubs
        - Predictable harvest schedules and regional supply chain redundancy
        - Site-specific electrical grid capacity and utility rate risk
    notes: >-
      Workflow benefits and operational limitations synthesized from reported CEA performance metrics, company operating
      disclosures, and independent agricultural media.
