company:
  name: "80 Acres Farms"
chapter:
  number: 4
  title: "Financials"
  summary: "80 Acres Farms achieved nationwide grocery distribution across 18,000 retail storefronts and projected $200 million in combined revenue post-merger, but unsustainable facility-level energy and labor costs, capital-intensive robotics maintenance, and a broader agtech venture capital contraction forced an immediate operational shutdown in August 2026. The company and eleven affiliates subsequently filed for Chapter 7 bankruptcy liquidation in Delaware with estimated liabilities between $100 million and $500 million, permanently extinguishing equity value."
sections:
  - id: "revenue-streams-and-pricing-architecture"
    title: "Commercial Revenue Streams and Pricing Dynamics"
    body: "80 Acres Farms operated as one of the largest indoor vertical farming enterprises in the United States, generating commercial revenue through the wholesale distribution of fresh, pesticide-free produce to retail supermarkets and foodservice operators. Its primary product catalog centered on packaged salad blends, salad kits, culinary herbs, microgreens, and vine crops such as tomatoes and cucumbers. At its commercial peak following the August 2025 merger with Soli Organic, the combined network served an expansive footprint spanning over 17,000 to 18,000 retail storefronts nationwide, including major grocery chains such as Walmart, Albertsons, Kroger, and H-E-B. The merger was publicized with aggressive forward guidance, projecting combined first-year net revenues approaching $200 million across seven operating facilities. However, commercial monetization was heavily constrained by grocery retail dynamics: packaged salads faced sharp price sensitivity against conventional outdoor field crops, forcing realized wholesale prices into an estimated $1.60 to $2.20 per clamshell band while grocers retained customary 35% to 40% retail margins. Because vertical farming produce commanded only a modest retail shelf premium, volume growth failed to generate high-margin operating cash flows."
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI004"
    tableRefs:
      - "TI001"
      - "TI002"
    figureRefs:
      - "FI001"
  - id: "cost-structure-and-unit-economics"
    title: "Facility Cost Structure and Unit Economic Realities"
    body: "The operating cost structure of 80 Acres Farms reveals the fundamental economic dilemma of controlled environment agriculture. Production economics in high-density indoor vertical farming are dominated by direct facility operating costs, with labor representing the single largest expenditure and electricity for LED grow lighting and HVAC environmental control running a close second. To counter labor intensity, 80 Acres Farms invested heavily in capital-intensive automation, deploying complex robotic conveyance systems, automated seeding lines, and sensor-driven grow zones. However, industry experts noted that massive 200,000-square-foot facility footprints introduced severe mechanical complexity and ongoing maintenance overhead. When combined with macroeconomic headwinds including rising interest rates, elevated energy utility tariffs, and wage inflation, facility-level contribution margins suffered substantial erosion. Although the company claimed annual production capacity of 15 to 20 million pounds of produce across seven facilities, audited kilowatt-hour power consumption per harvested pound and site-level gross margins were never disclosed to the public, obscuring negative unit margins beneath top-line volume narratives."
    claimRefs:
      - "CI003"
      - "CI005"
      - "CI006"
      - "CI007"
    tableRefs:
      - "TI003"
  - id: "capital-intensity-and-financing-trajectory"
    title: "Capital Intensity, Financing Dependency, and Wind-Down"
    body: "Developing and scaling capital-intensive vertical farms demanded an unsustainable volume of external financing. Prior to its operational collapse, 80 Acres Farms had accumulated more than $350 million in lifetime equity and debt capital across multiple funding rounds. Key historical milestones included a $40 million private equity injection from Virgo Investment Group in 2019 to complete its flagship Hamilton facility, followed by a $160 million Series B round in 2021 and an additional $115 million financing round in February 2025 alongside acquisitions of Plantae Biosciences and Kalera assets. However, the macroeconomic landscape for indoor farming shifted dramatically as venture capital investment in vertical agriculture plummeted from multi-billion-dollar peaks to just $57 million across five total industry deals by mid-2025. When a critical prospective acquisition abruptly fell through on the evening of August 2, 2026, 80 Acres Farms faced an immediate liquidity shortfall. Lacking capital reserves or alternative credit facilities to support its heavy burn rate, the company announced on August 3, 2026, that it would wind down all operations and issue WARN Act notices affecting roughly 300 employees."
    claimRefs:
      - "CI009"
      - "CI010"
      - "CI013"
      - "CI014"
  - id: "insolvency-and-diligence-verdict"
    title: "Chapter 7 Liquidation and Diligence Verdict"
    body: "The sudden operational wind-down culminated on August 25, 2026, when 80 Acres Urban Agriculture, Inc. and eleven affiliated corporate entities filed voluntary petitions for Chapter 7 bankruptcy liquidation in the U.S. Bankruptcy Court for the District of Delaware. Unlike Chapter 11 reorganization, Chapter 7 marks a definitive liquidation of all corporate assets under a court-appointed bankruptcy trustee, extinguishing all operating activity and equity value. Court filings in Case No. 26-11324-BLS revealed estimated liabilities between $100 million and $500 million against estimated assets in the identical $100 million to $500 million range, alongside between 200 and 999 creditors. The bankruptcy filing exposed a fragmented corporate architecture of twelve distinct operating and asset-holding entities, including Soli Organic, Inc., ShenGrow, Inc., and property holding companies. From an investment diligence standpoint, 80 Acres Farms demonstrates that top-line retail door expansion cannot compensate for structural unit-economic deficits and unmanageable capital intensity. With all operations liquidated and assets transitioning to auction realization, underwriting represents a total capital loss scenario for pre-petition equity investors."
    claimRefs:
      - "CI008"
      - "CI011"
      - "CI012"
      - "CI015"
