callouts:
  - calloutType: "risk"
    title: "Severe Customer Concentration and Commodity Retail Pricing Power"
    body: "While 80 Acres Farms expanded its distribution footprint across more than 17,000 retail storefronts following the Soli Organic merger, its core revenue remained heavily dependent on a handful of national supermarket chains including Kroger, Walmart, and Safeway. Supermarket produce buyers possess immense bargaining leverage, forcing indoor growers to compete near outdoor commodity price points while bearing the high fixed energy and capital costs of controlled-environment facilities."
    claimRefs:
      - "CU010"
      - "CU011"
      - "CU014"
  - calloutType: "insight"
    title: "Door Count Expansion Masked Underlying Facility-Level Losses"
    body: "Expanding retail door count from 1,500 regional stores to over 17,000 storefronts created the illusion of massive commercial momentum. However, high distribution footprint without corresponding consumer velocity or premium pricing resulted in negative cash flow, facility closures like the Harrisonburg site, and ultimately a complete operational liquidation under Chapter 7 bankruptcy."
    claimRefs:
      - "CU004"
      - "CU008"
      - "CU012"
      - "CU016"

