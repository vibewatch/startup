company:
  name: "80 Acres Farms"
chapter:
  number: 6
  title: "Customers"
  summary: "80 Acres Farms expanded from two regional indoor farms supplying 1,500 retail doors in the Midwest into a multi-facility network claiming access to over 17,000 retail storefronts following its August 2025 merger with Soli Organic. However, the commercial footprint remained heavily concentrated in major national supermarket chains including Kroger, Walmart, and Safeway, which subjected wholesale produce to standard commodity pricing and procurement friction. Operating overhead, debt from acquired facilities, and inability to secure additional capital precipitated an operational wind-down in August 2026 and Chapter 7 liquidation in Delaware."

sections:
  - id: "customer-base-segmentation"
    title: "Customer Base Segmentation and Channel Structure"
    body: "80 Acres Farms structured its commercial customer base across three primary tiers: national grocery supermarket chains, regional grocery retailers, and commercial foodservice operators. National supermarket retail represented the vast majority of volume, serving as the core commercial channel for packaged salad greens, salad kits, culinary herbs, and microgreens. Following the August 2025 merger with Soli Organic, the combined enterprise claimed access to more than 17,000 retail storefronts across the United States, scaling up dramatically from its legacy Midwest footprint. Regional retail accounts, anchored by long-standing relationships in Ohio and Kentucky, provided steady demand within a one-to-two-hour transit radius from the company's automated Hamilton indoor growing facilities. Meanwhile, commercial foodservice accounts, including local restaurants and institutional hospitality operators, purchased fresh culinary herbs and specialty greens, but contributed a comparatively minor fraction of total revenue. Across all customer segments, produce buyers required strict adherence to scheduled delivery windows, refrigerated shelf-life standards, and competitive retail pricing that mirrored conventional field-grown produce."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
    tableRefs:
      - "TU001"
    figureRefs:
      - "FU001"

  - id: "adoption-trajectory-volume"
    title: "Adoption Trajectory, Volume Scale, and Geographic Reach"
    body: "Commercial adoption of 80 Acres Farms produce progressed from local Midwest pilot deployments into commercial-scale wholesale distribution. In 2024, the company reported selling approximately 2 million kilograms (2,000 metric tons) of fresh indoor produce, operating across two commercial indoor farms in the greater Cincinnati area that supplied over 1,500 retail locations. The August 2025 merger with indoor herb producer Soli Organic expanded production capacity to an estimated 15 to 20 million pounds annually across seven vertical facilities, while projecting combined first-year revenues approaching $200 million. Through Soli Organic's mature distribution network, the combined entity accessed an estimated 70% of the top ten grocery retailers in the United States. However, this aggressive expansion of retail doors outpaced actual cash generation and market demand. While headline retail distribution reached more than 18,000 store locations over the company's operating lifespan, facility-level throughput struggled to cover the heavy capital expenditures, facility debt, and elevated operational costs of indoor controlled-environment farming."
    claimRefs:
      - "CU005"
      - "CU006"
      - "CU007"
      - "CU008"
    tableRefs:
      - "TU002"

  - id: "named-customer-deployments"
    title: "Named Customer Deployments and Commercial Proof"
    body: "The company established prominent commercial relationships with several of the nation's largest grocery supermarket operators. The Kroger Co. served as an early foundational partner, stocking 80 Acres Farms packaged salads and greens across regional supermarkets in the Midwest and collaborating on brand visibility. Following the integration with Soli Organic, distribution expanded across national mass-market and grocery leaders, including Walmart Inc. and Safeway (Albertsons), which stocked culinary herbs and pre-packaged organic greens in produce departments nationwide. In addition to national retail giants, independent restaurants and regional hospitality businesses in southwest Ohio sourced fresh greens and microgreens directly from local farms. Despite broad deployment across premier retail banners, these relationships functioned strictly on standard commercial wholesale terms rather than long-term take-or-pay volume guarantees. Retail partners did not provide emergency liquidity, bridge financing, or capital relief when 80 Acres Farms encountered severe financial distress in 2026."
    claimRefs:
      - "CU006"
      - "CU009"
      - "CU010"
      - "CU011"
      - "CU012"
    tableRefs:
      - "TU003"

  - id: "retention-concentration-liquidation"
    title: "Durability, Customer Concentration, and Commercial Breakdown"
    body: "Despite widespread storefront availability, 80 Acres Farms suffered from critical customer concentration and weak pricing power that undermined its long-term viability. National supermarket chains exerted intense margin pressure, treating vertical farm greens as substitutes for outdoor and greenhouse commodity produce rather than sustaining a permanent premium. The company never disclosed audited retention rates, customer churn, or net revenue retention, leaving the underlying durability of its account relationships unverified. Operational cracks surfaced in May 2026 when the company closed the former Soli Organic production facility in Harrisonburg, Virginia, laying off 80 workers. Unable to secure required equity capital or debt refinancing, 80 Acres Farms announced on August 3, 2026, that it would wind down all business operations. On August 25, 2026, the parent company and eleven operating affiliates filed for Chapter 7 bankruptcy liquidation in the U.S. Bankruptcy Court for the District of Delaware, listing hundreds of millions of dollars in liabilities and confirming the complete termination of commercial customer supply."
    claimRefs:
      - "CU008"
      - "CU010"
      - "CU011"
      - "CU012"
      - "CU014"
      - "CU016"

