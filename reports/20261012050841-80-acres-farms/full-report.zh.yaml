      - number: '2.2'
        title: 规模化视角：TAM、受控环境产能与生产现实
        blocks:
          - type: paragraph
            body: >-
              评估 80 Acres Farms 的市场机会，必须把自上而下的农业宏观估算与设施层面的运营约束分开。美国新鲜农产品零售市场年规模超过 $80 billion，但受控环境农业只占其中更窄的 $3 billion
              to $5 billion 可寻址部分。合并实体层面，80 Acres Farms 与 Soli Organic 的合并带来接近 $200 million 的预计首年收入运行率，背后是七座垂直农场合计 15 to
              20 million pounds 的产能。公司在六个州约一 million square feet 的种植空间上运营，产量定位为服务全国超过 17,000 家零售门店。然而，资本密集性严重阻碍扩张：到 2025
              年中，整个室内农业行业的风险融资已缩减至仅 $57 million，使运营商难以承受任何现金流延迟。
            claimRefs:
              - CM002
              - CM003
              - CM006
              - CM008
              - CM010
