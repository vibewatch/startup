      - number: '7.2'
        title: 运营失效模式与管理费用—收入失衡
        blocks:
          - type: paragraph
            body: >-
              80 Acres Farms 的运营失败凸显了受控环境农业的根本结构性脆弱：农场层面的单位经济无法支撑集中式技术和公司管理费用。清算前，CEO Mike Zelkind
              承认，虽然单个垂直农场实现了正贡献利润，但纳入集中式 SG&A 和多设施整合费用后，合并企业仍严重亏损。公司没有运营轻资产技术平台，而是承担先进制造业典型的高额资本开支、LED 基础负荷照明和 HVAC
              除湿所需的大量电力，以及高成本专业人工。整合三座陷入困境的 Kalera 设施并推进 Soli Organic 合并，耗尽了运营现金储备。流动性收紧后，80 Acres 永久关闭弗吉尼亚州哈里森堡的 Pack
              设施，取消 80 个岗位，并暂停华盛顿州马里斯维尔的运营；随后于 2026 年 8 月 3 日无序关闭全部生产网络，在八个州裁撤超过 800 个岗位且不支付遣散费。
            claimRefs:
              - CR004
              - CR005
              - CR009
              - CR012
              - CR015
