      - number: '7.3'
        title: 交易对手集中、融资冲击与论点破坏触发因素
        blocks:
          - type: paragraph
            body: >-
              80 Acres Farms 倒闭的直接催化剂，是融资和并购战略中的交易对手高度集中。潜在战略收购方于 2026 年 8 月 2
              日突然退出时，公司没有其他融资工具或过桥融资来维持日常运营，立即触发全国性停业收缩。这个急剧的流动性断崖发生在室内农业结构性收缩的大背景下：风险资本部署从周期高峰的数十亿美元降至 2025 年中五笔交易合计仅
              $57 million。2025 年 8 月与 Soli Organic 的合并原本意在构建覆盖 17,000 家门店、预计顶线收入 $200 million
              的韧性全国配送网络，但商业协同尚未落地，交易已加重营运资金压力。Kroger、Walmart、Albertsons 和 Meijer
              的客户采购合同流失，再叠加供应商资不抵债和有担保贷款人止赎，为依赖持续风险资本市场补贴的资本密集型室内农业企业设定了明确的论点破坏标准。
            claimRefs:
              - CR003
              - CR011
              - CR013
