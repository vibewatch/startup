      - number: '3.4'
        title: 既有替代品、资本风险与市场脆弱性
        blocks:
          - type: paragraph
            body: >-
              尽管在垂直农场运营商中建立了领先地位，80 Acres Farms 仍容易受到强大外部替代品和行业结构性逆风影响。传统露地农业仍是压倒性的既有主导者，以垂直农场无法匹敌的价格供应基础农产品。与此同时，Cox
              Farms 等大型商业温室运营商把 BrightFarms 和 Mucci Farms 整合为超过 700 英亩的受控种植面积，以显著更低的人工照明电力成本提供大批量农产品。此外，以阿联酋
              Greeneration 为代表的替代 CEA 模式，转而服务高端酒店和精致餐饮厨房，供应特色微型蔬菜和可食用花卉，完全避开零售价格战。要保住持久股权价值，80 Acres Farms
              必须避免早期过度资本化陷阱，并证明其合并后七设施网络能在激烈的杂货定价约束下实现正自由现金流。
            claimRefs:
              - CP003
              - CP007
              - CP009
              - CP012
              - CP013
              - CP014
      - number: '3.5'
        title: 展示项
        blocks:
          - type: callout
            title: 整合取代投机资本
            body: 80 Acres Farms 与 Soli Organic 的合并表明，受控环境农业的规模化如今靠战略并购和资产优化实现，而不是靠风险资本支持的绿地建设。
            calloutType: insight
            claimRefs:
              - CP001
              - CP004
              - CP012
          - type: callout
            title: 露地与温室生产带来的商品价格上限
            body: 即便拥有更好的新鲜度和无农药营销，垂直农业运营商仍无法逃离工业温室和露地种植商的价格竞争，因此必须严格控制单位人工和能源支出。
            calloutType: risk
            claimRefs:
              - CP007
              - CP013
              - CP014
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 商业收入来源与定价动态
        blocks:
          - type: paragraph
            body: >-
              80 Acres Farms
              曾是美国最大的室内垂直农业企业之一，通过向零售超市和餐饮服务运营商批发配送新鲜、无农药农产品获得商业收入。其主要产品包括包装沙拉混合装、沙拉套装、食用香草、微型蔬菜，以及番茄、黄瓜等藤本作物。2025 年 8
              月与 Soli Organic 合并后，商业高峰期的合并网络覆盖全国超过 17,000 至 18,000 家零售门店，包括 Walmart、Albertsons、Kroger 和 H-E-B
              等大型连锁。合并对外公布了激进的前瞻指引，预计七座运营设施首年合计净收入接近 $200 million。但商业变现受到杂货零售规律的强烈约束：包装沙拉面对露地作物时价格敏感度很高，使实际批发价落在每个贝壳盒约
              $1.60 至 $2.20，杂货商则保留惯常的 35% 至 40% 零售毛利。由于垂直农业产品只能获得适度货架溢价，销量增长未能带来高毛利运营现金流。
            claimRefs:
              - CI001
              - CI002
              - CI004
