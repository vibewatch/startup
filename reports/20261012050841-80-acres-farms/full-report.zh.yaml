      - number: '4.3'
        title: 资本密集性、融资依赖与停业收缩
        blocks:
          - type: paragraph
            body: >-
              开发和扩大资本密集型垂直农场，需要不可持续规模的外部融资。在运营崩溃前，80 Acres Farms 通过多轮融资累计获得超过 $350 million 的生命周期股权和债务资本。关键里程碑包括 2019 年
              Virgo Investment Group 注入 $40 million 私募股权资金，用于完成旗舰汉密尔顿设施；2021 年完成 $160 million Series B；2025 年 2 月在收购
              Plantae Biosciences 和 Kalera 资产的同时又完成 $115 million 融资。然而，室内农业的宏观融资环境急剧转变：到 2025
              年中，垂直农业风险投资从数十亿美元高峰跌至全行业五笔交易合计仅 $57 million。2026 年 8 月 2 日晚，一项关键潜在收购突然告吹，80 Acres Farms
              立即出现流动性缺口。公司没有资本储备或替代信贷额度来支撑高额烧钱，于 2026 年 8 月 3 日宣布停止所有运营，并向约 300 名员工发出 WARN Act 通知。
            claimRefs:
              - CI009
              - CI010
              - CI013
              - CI014
      - number: '4.4'
        title: Chapter 7 清算与尽调结论
        blocks:
          - type: paragraph
            body: >-
              运营突然收缩，最终在 2026 年 8 月 25 日达到终点：80 Acres Urban Agriculture, Inc. 及十一家关联公司向美国特拉华州地区破产法院提交自愿 Chapter 7
              破产清算申请。不同于 Chapter 11 重组，Chapter 7 意味着所有公司资产将在法院指定的破产受托人管理下彻底清算，所有运营活动和股权价值归零。案号 26-11324-BLS
              的法院文件显示，预计负债在 $100 million 至 $500 million 之间，预计资产也处于同一 $100 million 至 $500 million 范围，债权人数在 200 至 999
              之间。申请暴露出由十二个运营和资产持有实体组成的碎片化公司架构，包括 Soli Organic, Inc.、ShenGrow, Inc. 和物业持有公司。从投资尽调角度看，80 Acres Farms
              证明，零售门店数量的顶线扩张无法弥补结构性单位经济赤字和失控的资本密集性。              所有运营均已清算、资产正转入拍卖变现，因而对申请前股权投资者而言，投资判断已落入资本全损情形。
            claimRefs:
              - CI008
              - CI011
              - CI012
              - CI015
      - number: '4.5'
        title: 展示项
        blocks:
          - type: callout
            title: 资本开支与输送系统维护负担
            body: 运营配备复杂输送机器人的 200,000-square-foot 巨型垂直农场，带来了沉重的持续维护和公用事业成本，压垮了毛利率。
            calloutType: risk
            claimRefs:
              - CI006
              - CI007
          - type: callout
            title: 无法在商品农产品上取得溢价定价
            body: 尽管零售地点扩展到 18,000 家，80 Acres Farms 仍受包装绿叶菜消费者价格上限限制，无法把高额固定设施和能源成本转嫁给超市消费者。
            calloutType: insight
            claimRefs:
              - CI001
              - CI004
              - CI005
          - type: callout
            title: Underwriting 结论：清算风险兑现
            body: 在 Chapter 7 清算下负债为 $100M 至 $500M、且单位经济完全没有经审计的可见性的情况下，任何持续企业价值的投资判断都被彻底阻断。
            calloutType: recommendation
            claimRefs:
              - CI011
              - CI012
              - CI015
  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 受控环境农业与产品组合
        blocks:
          - type: paragraph
            body: >-
              80 Acres Farms 运营工业规模的受控环境农业网络，直接向大型超市连锁和餐饮服务运营商供应洁净、无农药的新鲜农产品。公司的主要商业产品包括包装绿叶菜、沙拉套装、微型蔬菜、番茄、黄瓜和食用香草。2025
              年 8 月与 Soli Organic 达成里程碑式战略合并后，合并企业运营七座全国分布的室内农场，合计设计年产能为 15 million to 20 million pounds。该网络服务全美超过
              17,000 家零售地点，包括 Kroger 和 Whole Foods Market 等全国性及区域杂货商。传统露地农业依赖脆弱的季节性户外气候，并依赖从集中种植谷地长途冷藏运输；相比之下，80 Acres
              Farms 把室内设施布置在主要都市消费中心附近，以供应在营养新鲜度最佳时采收的农产品。
            claimRefs:
              - CE001
              - CE007
              - CE013
