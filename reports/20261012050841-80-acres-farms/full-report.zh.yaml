      - number: '4.2'
        title: 设施成本结构与单位经济现实
        blocks:
          - type: paragraph
            body: >-
              80 Acres Farms 的运营成本结构揭示了受控环境农业的根本经济困境。高密度室内垂直农业的生产经济由直接设施运营成本主导，人工是最大支出，LED 生长灯和 HVAC
              环境控制所需电力紧随其后。为降低人工密度，80 Acres Farms 大量投资资本密集型自动化，部署复杂机器人输送系统、自动播种线和传感器驱动的种植区。但行业专家指出，200,000-square-foot
              的超大设施带来了严重机械复杂性和持续维护开销。再叠加利率上升、能源公用事业费率上调和工资通胀等宏观逆风，设施层面的贡献利润大幅缩水。公司虽称七座设施年产能为 15 to 20 million
              pounds，但每磅采收产品的经审计千瓦时耗电量和各站点毛利率从未公开，使负单位利润被营收规模叙事掩盖。
            claimRefs:
              - CI003
              - CI005
              - CI006
              - CI007
          - type: table
            tableRef: TI003
            claimRefs:
              - CI002
              - CI003
              - CI005
