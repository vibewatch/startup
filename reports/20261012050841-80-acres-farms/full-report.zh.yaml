chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、创立与平台演进
        blocks:
          - type: paragraph
            body: >-
              80 Acres Farms（在特拉华州破产程序中法定注册为 80 Acres Urban Agriculture, Inc.）由 Mike Zelkind 和 Tisha Livingston 于 2015
              年创立，总部位于俄亥俄州汉密尔顿 345 High
              Street。公司开创室内垂直农业，目标是在城市消费者附近生产新鲜、无农药的食用农产品，主要包括绿叶沙拉菜、微型蔬菜、藤本作物和食用香草。其核心运营差异化在于专有 GroLoop
              自动化平台；该平台由荷兰—以色列—美国技术子公司 Infinite Acres 与 Siemens、Signify、SICK、TTA-ISO 等工业自动化伙伴共同开发。GroLoop
              将硬件、机器人、环境传感和人工智能结合起来，自动完成播种、作物间距调整、营养液输送和采收，同时维持精确的微气候配方。公司称其室内设施使用 100% 可再生电力，相较传统露地农业，每磅农产品可减少 95%
              的用水量。尽管取得这些技术进展，垂直农业的资本密集属性最终压垮了商业模式，导致公司在 2026 年末资不抵债。
            claimRefs:
              - CO001
              - CO002
