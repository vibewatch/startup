      - number: '1.2'
        title: 高管领导、治理与公司架构
        blocks:
          - type: paragraph
            body: >-
              80 Acres Farms 由 CEO Mike Zelkind 和联合创始人 Tisha Livingston 领导，后者同时担任技术子公司 Infinite Acres 的 CEO。管理层还包括 Noah
              Zelkind：他最初负责业务拓展，随后于 2025 年 2 月升任 COO，在重大整合交易后统筹运营、工程、农艺和供应链。法律及知识产权治理由总法律顾问兼首席知识产权官 Boris Zelkind
              负责，他正式签署了公司的特拉华州破产申请。2025 年 8 月与 Soli Organic 合并后，前 Whole Foods Market 联合 CEO Walter Robb
              加入合并后的治理委员会，担任董事及联席主席，与 Soli Organic 联合创始人 Ulf Jonsson 搭档。该治理结构覆盖复杂的十二家公司法律层级，包括设施运营实体（如 80 Acres Florence
              LLC）、资产持有壳公司（SG Assets LLC 和 Trellis Loop 实体），以及收购来的运营单位（ShenGrow, Inc.、Soli Organic, Inc. 和源自 Kalera 的
              Lactuca LLC）。直到 2026 年 8 月 21 日全体一致书面同意授权 Chapter 7 清算，这种公司碎片化才完全暴露。
            claimRefs:
