      - number: '3.2'
        title: 运营能力与技术整合
        blocks:
          - type: paragraph
            body: >-
              室内农业的差异化，取决于能否驾驭生物产量与工业运营成本之间的取舍。资不抵债的前辈企业曾各自孤立地设计定制自动化系统，而 80 Acres 通过技术子公司 Infinite Acres，与 Siemens
              等成熟工业自动化伙伴合作开发 GroLoop。Siemens 提供设施配电、工业自动化设备和数字孪生模拟环境，用于优化植物生长条件、减少停机。公司与 Soli Organic 的结合还带来了 35
              年商业土壤有机种植方法和专有生物配方。由于人工是室内农场最大的运营支出，能源紧随其后成为第二大成本驱动因素，自动播种、托盘移动和环境配方管理就成为实现可持续单位贡献利润的关键杠杆。
            claimRefs:
              - CP003
              - CP005
              - CP006
              - CP007
              - CP011
