              to 20 million pounds，并预计合并首年收入接近 $200 million。              借助 Soli Organic 成熟的配送网络，合并实体触达了美国前十大杂货零售商中预计
              70% 的客户。但零售门店的激进扩张超过了实际现金创造和市场需求。公司运营期间，零售分销的表面规模达到超过 18,000 家门店，而设施吞吐量难以覆盖室内受控环境农业沉重的资本开支、设施债务和高昂运营成本。
