          - type: paragraph
            body: >-
              公司与美国几家最大杂货超市运营商建立了重要商业关系。Kroger Co. 是早期基础合作伙伴，在中西部区域超市上架 80 Acres Farms 的包装沙拉和绿叶菜，并合作提升品牌可见度。与 Soli
              Organic 整合后，配送扩展到全国性大众市场和杂货龙头，包括 Walmart Inc. 和
              Safeway（Albertsons）；它们在全国农产品部门上架食用香草和预包装有机绿叶菜。除全国零售巨头外，俄亥俄州西南部的独立餐厅和区域酒店企业也直接从本地农场采购新鲜绿叶菜和微型蔬菜。尽管部署覆盖主要零售品牌，这些关系严格遵循标准商业批发条款，而非长期
              take-or-pay 采购量保证。2026 年 80 Acres Farms 陷入严重财务困境时，零售伙伴没有提供紧急流动性、过桥融资或资本纾困。
            claimRefs:
              - CU006
              - CU009
              - CU010
              - CU011
              - CU012
