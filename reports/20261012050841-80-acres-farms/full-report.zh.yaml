      - number: '6.4'
        title: 持久性、客户集中度与商业崩溃
        blocks:
          - type: paragraph
            body: >-
              尽管门店覆盖广泛，80 Acres Farms
              仍受严重客户集中和薄弱定价权困扰，长期生存能力因此受损。全国超市连锁施加巨大利润压力，把垂直农场绿叶菜当作露地和温室商品农产品的替代品，而不是持续支付永久溢价。公司从未披露经审计的留存率、客户流失或净收入留存，客户关系的底层持久性无法验证。2026
              年 5 月，公司关闭位于弗吉尼亚州哈里森堡的前 Soli Organic 生产设施并裁员 80 人，运营裂缝开始显现。由于无法筹得所需股权资本或完成债务再融资，80 Acres Farms 于 2026 年 8
              月 3 日宣布停止所有业务运营。2026 年 8 月 25 日，母公司和十一家运营关联公司向美国特拉华州地区破产法院申请 Chapter 7 破产清算，列出数亿美元负债，确认商业客户供货彻底终止。
            claimRefs:
              - CU008
              - CU010
              - CU011
              - CU012
              - CU014
              - CU016
      - number: '6.5'
        title: 展示项
        blocks:
          - type: callout
            title: 客户高度集中与商品零售定价权
            body: >-
              Soli Organic 合并后，80 Acres Farms 把配送覆盖扩展到超过 17,000 家零售门店，但核心收入仍高度依赖 Kroger、Walmart 和 Safeway
              等少数全国超市连锁。超市农产品买家拥有巨大的议价能力，迫使室内种植商以接近露地商品的价格竞争，同时承担受控环境设施高昂的固定能源和资本成本。
            calloutType: risk
            claimRefs:
              - CU010
              - CU011
              - CU014
          - type: callout
            title: 门店数量扩张掩盖了设施层面的底层亏损
            body: >-
              零售门店从 1,500 家区域门店扩展到超过 17,000 家，制造了商业动能巨大的假象。但配送覆盖扩大却没有相应的消费者周转速度或溢价，最终造成负现金流、哈里森堡等设施关闭，并在 Chapter 7
              破产下彻底清算运营。
            calloutType: insight
            claimRefs:
              - CU004
              - CU008
              - CU012
              - CU016
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 法律、监管与资不抵债程序
        blocks:
          - type: paragraph
            body: >-
              2026 年 8 月 25 日，80 Acres Urban Agriculture, Inc. 及十一家关联公司依据案号 26-11324-BLS，向美国特拉华州地区破产法院提交自愿 Chapter 7
              破产清算申请。法院文件显示，预计资产和负债均在 $100 million 至 $500 million 之间，债权人数为 200 至
              999，并称在支付行政费用后预计不会有资金留给普通无担保债权人。破产申请依据美国破产法触发即时自动中止，冻结多起待决民事诉讼，包括加州农产品供应商就超过 $230,000
              未付农产品发票提起的联邦易腐农产品法（PACA）信托诉讼，以及商业人员服务供应商就超过 $687,000 未付劳务费提出的违约诉讼。此外，被解雇员工发起拟议集体诉讼，指控公司在约 500 名员工被解雇时违反法定
              WARN Act，未提供强制的 60 天通知或遣散费。申请涉及十二个独立法律结构，包括设施物业实体 Trellis Loop，以及从 Kalera 先前资不抵债程序中收购的实体
              Lactuca，证明公司复杂性未能让母公司免受资不抵债影响。
            claimRefs:
              - CR001
              - CR002
              - CR006
              - CR007
              - CR008
              - CR010
              - CR014
