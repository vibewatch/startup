  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、计入支出与相邻品类
        blocks:
          - type: paragraph
            body: >-
              80 Acres Farms
              的商业范围覆盖高端受控环境绿叶菜、食用香草、沙拉套装和农业自动化软件。室内农业的可寻址支出仅限于人工环境控制能较传统露地农业带来更佳新鲜度、一致性和食品安全性的农产品品类。公司没有把自己定位成低成本大宗商品供应商，而是瞄准大型超市连锁中的高周转预包装沙拉和食用香草。2025
              年 8 月与 Soli Organic
              合并后，范围显著扩大，把土壤种植的有机盆栽和切花香草与垂直农场绿叶菜结合起来。但冰山生菜、露地番茄和大宗芸薹类等商品作物，由于相较阳光种植方案的能源经济性无法成立，仍明确排除在室内农业可寻址支出之外。
            claimRefs:
              - CM001
              - CM004
              - CM005
              - CM011
          - type: table
            tableRef: TM001
            claimRefs:
