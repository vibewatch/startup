      - - 基准情景（逐项拍卖）
        - 农场以大幅折价拍卖；GroLoop IP 和自动化设备拆解后仅获残值
        - 有担保贷款方每 1 美元回收 10-25 美分；无担保贸易债务和股权获得 $0
        - 设备过时；专业输送设备难以在垂直农业之外改作他用
        - 70%（高）
