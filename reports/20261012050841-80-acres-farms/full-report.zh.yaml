        title: 展示项
        blocks:
          - type: callout
            title: 终局清算与无担保回收耗尽
            body: >-
              Chapter 7 申请标志着               80 Acres Farms 作为运营企业的正式终结。在 $100 million 至 $500 million
              负债与资产相当或负债更高、且存在大量行政和法定优先债权主张的情况下，普通无担保债权人、供应商和股东在破产管理下几乎确定会遭受全损。
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR014
          - type: callout
            title: 结构性 CEA 陷阱：资本化软件管理费用下的制造业经济
            body: 80 Acres Farms 的崩溃表明，当风险资本再融资周期收缩时，单个农场的正贡献利润无法支撑一个背负集中式技术开发和激进收购债务的多设施垂直农业网络。
            calloutType: insight
            claimRefs:
              - CR012
