    title: 推荐逻辑
    type: flow
    summary: 按顺序梳理 80 Acres Farms 从运营规模和资本投入一路走向管理费用陷阱、流动性崩溃、Chapter 7 破产，最终得出 AVOID 建议的因果链。
    data:
      nodes:
        - id: scale-and-technology
          label: 1. 运营规模与技术
          description: 依托 GroLoop 建成 7 座自动化垂直农场，募资 $350M+，并与 Soli Organic 合并。
        - id: overhead-trap
          label: 2. 企业管理费用率
          description: 农场层面实现了正利润率，但企业 SG&A 和三笔收购造成了总部无法承受的持续烧钱。
        - id: commodity-margins
          label: 3. 大宗商品价格压缩
          description: 绿叶菜和香草的零售定价持续受到传统露天种植农产品竞争的限制。
        - id: working-capital-crisis
          label: 4. 营运资金耗尽
          description: CEA 创业融资骤降至 $57M；供应商欠款、设施关闭，以及 July 2026 的 PACA 诉讼接踵而至。
        - id: deal-withdrawal
          label: 5. 收购交易撤回
          description: 潜在收购方于 August 2, 2026 撤回交易，导致公司在 August 3 立即停止运营。
        - id: chapter-7-filing
          label: 6. Chapter 7 特拉华州清算
          description: 12 家关联公司均申请 Chapter 7 破产，负债为 $100M-$500M，并清算全部实物资产。
        - id: final-recommendation
          label: 7. 建议：AVOID
          description: 股权价值为零，债务分层遭受严重减值，商业模式的结构性失败已全面暴露。
    approximationNotes: 该因果路径综合了公司运营披露、高管承认事项以及特拉华州破产法院文件。
