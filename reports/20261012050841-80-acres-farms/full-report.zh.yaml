  - id: FI001
    title: 收入模型桥接
    type: flow
    summary: 从 CEA 垂直农场收获，经零售杂货变现，再到运营利润率耗损的端到端单位现金转化流程。
    data:
      nodes:
        - id: harvest
          label: 1. 垂直农场收获
          detail: 自动播种、生长区照明和机器人采收，产出包装好的透明蛤壳盒。
          tone: neutral
        - id: wholesale-billing
          label: 2. 批发开票
          detail: 门店直配和经销商发货按批发价开票（$1.60-$2.20 / 单位）。
          tone: neutral
        - id: retail-deductions
          label: 3. 零售毛利与上架费
          detail: 零售杂货商获得 35-40% 毛加价、促销补贴并承担损耗。
          tone: neutral
        - id: cogs-depletion
          label: 4. 设施直接 COGS
          detail: 高昂的 LED 电费和专业农场技术人员人工侵蚀毛利。
          tone: negative
        - id: overheads
          label: 5. 公司与网络管理费用
          detail: 多设施输送设备维护、12 家法人实体的 SG&A 及债务偿付。
          tone: negative
        - id: cash-depletion
          label: 6. 净运营现金消耗
          detail: 场址层面的贡献利润为负，加上股权资本枯竭，最终导致资不抵债。
          tone: critical
