        - 第 7 章受托人将 Hamilton 和 Florence 自动化农场及 GroLoop IP 拍卖给战略买家
        - 有担保设备贷款方每 1 美元回收 30-50 美分；股权获得 $0
        - 专业 CEA 资产缺少合格买家；设施持续产生持有成本
