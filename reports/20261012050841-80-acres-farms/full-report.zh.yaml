figures:
  - id: FO001
    title: 80 Acres Farms 战略里程碑演进（2015-2026）
    type: timeline
    summary: 梳理公司成立、技术平台、融资、收购和破产等关键里程碑。
    data:
      items:
        - label: '2015: 在 Hamilton 成立'
          date: '2015-01-01'
          detail: Mike Zelkind 和 Tisha Livingston 在俄亥俄州 Hamilton 成立 80 Acres Farms，开拓自动化室内农业。
          tone: positive
        - label: 'Jan 2019: $40M PE 轮'
          date: '2019-01-17'
          detail: Virgo Investment Group 投入超过 $40 million 私募股权，用于建设标志性的 Hamilton 自动化设施。
          tone: positive
        - label: 'Jun 2019: Infinite Acres 合资'
          date: '2019-06-10'
          detail: 与 Priva 和 Ocado 共同成立 Infinite Acres 技术合资企业，开发专有室内自动化技术。
          tone: positive
        - label: 'Nov 2021: Hamilton 规模化'
          date: '2021-11-16'
          detail: Hamilton 自动化农场全面运营，面积 70,000 平方英尺，每年为零售合作伙伴生产约 10 million 份产品。
          tone: positive
        - label: 'Feb 2025: 延期融资'
          date: '2025-02-10'
          detail: 在 Barclays Climate Ventures、Siemens 和 Blue Earth Capital 支持下完成 Series B 延期融资。
          tone: neutral
        - label: 'Mar 2025: 收购 Kalera 农场'
          date: '2025-03-04'
          detail: 在 Kalera 破产重组中收购其位于 Georgia、Texas 和 Colorado 的三座运营中垂直农场。
          tone: positive
        - label: 'Aug 2025: 与 Soli Organic 合并'
          date: '2025-08-18'
          detail: 与 Soli Organic 合并，打造全国性室内农业网络，预计合并收入为 $200 million。
          tone: positive
        - label: 'Aug 2026: 宣布停业'
          date: '2026-08-03'
          detail: 最后一刻的收购破裂且无法筹集资本后，宣布逐步停止运营。
          tone: negative
        - label: 'Aug 2026: 第 7 章破产'
          date: '2026-08-25'
          detail: 80 Acres Urban Agriculture, Inc. 及 11 家关联公司向特拉华州法院自愿提交第 7 章破产申请。
          tone: negative
    approximationNotes: 日期对应经核实的公司新闻稿、行业新闻报道及美国联邦破产法院官方文件。
    claimRefs:
      - CO001
      - CO002
      - CO004
      - CO011
      - CO012
      - CO013
      - CO014
      - CO015
      - CO016
