  - id: TV002
    title: 论点 / 反论点表
    columns:
      - 支柱 / 观点
      - 原始投资论点
      - 已实现的反论点（证据）
      - 什么情况会改变观点
    rows:
      - - 整合与规模
        - Soli Organic 合并后，覆盖 17,000 家门店的收入增至约 $200M，以消化固定费用
        - 合并增加了巨大的行政复杂度、债务和现金消耗；12 个月内崩溃
        - 经审计的 SG&A 协同效应及合并公司 EBITDA 为正的证据
      - - 技术与 GroLoop
        - 专有 GroLoop 自动化带来更优单位经济性，并节水 95%
        - 自动化室内农场的场址利润率为正，但无法覆盖高额资本化软件和管理费用
        - 将软件开发与农场运营拆分，做成盈利的 SaaS
      - - 市场与农产品定价
        - 无农药蔬菜和香草的高端零售定位带来韧性毛利率
        - 加州和墨西哥的高效露天种植农产品限制了商品价格
        - 长期固定价格销路合同覆盖 100% 产能
      - - 资本获取与跑道
        - Virgo、Barclays 和 Siemens 持续提供机构支持和流动性
        - 2025 年年中 CEA 风险资本降至 $57M；潜在收购方于 2026 年 8 月退出
        - 具有约束力的股权兜底，或承诺提供至少 24 个月跑道的债务工具
