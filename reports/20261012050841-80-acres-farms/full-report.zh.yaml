  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与运营商分层
        blocks:
          - type: paragraph
            body: >-
              受控环境农业（CEA）行业已从风险资本驱动的设施建设，深度转向困境整合和运营理性化。Plenty、Bowery
              等第一代垂直农业运营商曾凭借软件驱动的超高产量承诺募集数亿美元，却受困于过高资本开支、高耗电和失真的单位经济。相比之下，80 Acres Farms
              采取以食品为先的制造路径，先扩大审慎规划的区域产能，再推动横向整合。通过与 Soli Organic 的里程碑式合并，以及从破产先驱 Kalera 手中机会主义收购三座垂直生产设施和知识产权，80 Acres
              Farms 建成了七座运营农场组成的全国布局，预计首年收入接近 $200
              million。如今行业竞争者分为三类：寻求利基或零售规模的直接垂直农业幸存者、利用较低太阳能投入成本的温室集团，以及瞄准高价值餐饮客户的区域精品种植商。
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP008
              - CP014
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
