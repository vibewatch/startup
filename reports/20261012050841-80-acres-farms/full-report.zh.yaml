  - id: FE001
    title: Infinite Acres GroLoop 运营架构栈
    type: stack
    summary: 80 Acres Farms 专有 GroLoop 受控环境农业平台的六层功能架构。
    data:
      layers:
        - label: 第 6 层：企业分销与预测物流
          description: 将室内农场生产计划连接到冷链物流和杂货零售门户的集成层。
          modules:
            - 冷链路线调度
            - 零售补货 EDI 集成
            - 保质期优化追踪
        - label: 第 5 层：AI 农艺智能与数字孪生
          description: 模拟植物生物生长、预测作物产量并识别微气候异常的算法层。
          modules:
            - Siemens 植物生长数字孪生模拟
            - 机器学习视觉异常检测
            - 预测性收获产量预测
        - label: 第 4 层：设施自动化与能源管理
          description: 覆盖整个设施范围的集中式监控控制和配电监测。
          modules:
            - Siemens Smart Infrastructure 电力监测
            - 楼宇自动化及消防 / 生命安全接口
            - 全设施能源遥测仪表盘
        - label: 第 3 层：边缘控制与生产线机器人
          description: 执行物理运动、托盘路由和包装自动化的分布式工业控制器。
          modules:
            - Siemens 边缘工业控制器与 HMI
            - 自动托盘运输穿梭车
            - 机器人采收与包装工位
        - label: 第 2 层：微气候与施肥灌溉子系统
          description: 调节大气参数和营养液配方的闭环环境控制。
          modules:
            - Priva 园艺环境控制
            - 动态光谱 LED 照明阵列
            - 自动闭环施肥灌溉与配比
        - label: 第 1 层：模块化生物安全生长单元
          description: 由隔离物理分区组成的多层垂直货架，用于防止疾病传播。
          modules:
            - 分区模块化种植舱
            - HEPA 空气处理与正压区域
            - 多层垂直货架基础设施
    approximationNotes: 各层边界代表集成于 Infinite Acres GroLoop 平台的功能子系统。
    claimRefs:
      - CE002
      - CE003
      - CE004
      - CE012
  - id: FU001
    title: 客户旅程与生命周期采用图
    type: journey-map
    summary: 零售超市分销中的采用阶段、触点及结构性商业摩擦。
    approximationNotes: 生命周期阶段和摩擦点来自公司披露、零售商合同动态及破产记录。
    claimRefs:
      - CU013
      - CU014
      - CU015
      - CU016
    data:
      items:
        - label: 零售买家采购与品类评审
          stage: 采购与评估
          touchpoints: Produce buyer RFP and regional slotting review
          channel: 零售总部直接采购
          objective: Securing shelf-space commitments across grocery chain divisions
          friction: Demands for introductory promotional allowances and price parity with field produce
        - label: 物流接入与配送中心交付
          stage: 分销接入
          touchpoints: Cold-chain delivery to grocery distribution centers
          channel: 区域冷藏物流网络
          objective: Just-in-time cross-dock delivery within 24-48 hours of indoor harvest
          friction: Stringent on-time delivery windows and chargebacks for delayed shipments
        - label: 门店货架摆放与商品陈列
          stage: 零售商品运营
          touchpoints: Packaged salad and culinary herb displays in produce aisle
          channel: 冷藏零售农产品货架
          objective: Consumer product visibility and brand ambassador sampling
          friction: Limited prime eye-level shelf space and competition from legacy greenhouse brands
        - label: 消费者试用与首次购买
          stage: 销售点
          touchpoints: Shopper purchase of pesticide-free salads and fresh herbs
          channel: 店内结账及线上杂货自提
          objective: Establishing brand recognition and value perception around freshness
          friction: Price sensitivity during inflationary grocery cycles
        - label: 重复购买与动销扩张
          stage: 品类扩张
          touchpoints: Weekly grocery re-orders and multi-pack SKU adoption
          channel: 会员计划扫码和门店自动补货
          objective: Driving category velocity to protect shelf allocation
          friction: Lack of marketing spend to sustain out-of-region consumer velocity
        - label: 合同续约与终局财务中断
          stage: 合同结算
          touchpoints: Annual grocery vendor review and credit terms
          channel: 供应商会计和零售应付账款
          objective: Sustaining long-term supply contracts and cash collection
          friction: Severe working capital squeeze, unpaid vendor claims, and Chapter 7 liquidation
