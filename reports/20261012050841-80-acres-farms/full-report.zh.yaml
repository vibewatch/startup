      - number: '1.4'
        title: 展示项
        blocks:
          - type: callout
            title: 整合掩盖了关键的结构性脆弱性
            body: >-
              Kalera 资产收购于 2025 年 3 月完成，Soli Organic 合并于 2025 年 8 月完成，两项交易接连发生，表面上让 80 Acres Farms 成为垂直农业的最终幸存者，拥有 $200
              million 预计收入和 17,000
              个零售终端。但这些激进并购没有解决垂直农业的底层单位经济问题——高能耗、设施折旧重和商品价格受限——反而把固定管理费用铺到十二个独立运营实体上；当增长资本枯竭时，流动性消耗进一步加速。
            calloutType: insight
            claimRefs:
              - CO003
              - CO013
              - CO014
              - CO015
              - CO016
          - type: callout
            title: Chapter 7 清算排除了公司重组可能
            body: >-
              Plenty 或 AppHarvest 等同行曾利用 Chapter 11 重组债务并以更精简的布局重新运营，而 80 Acres Farms 选择依据案号 26-11324-BLS 进行 Chapter 7
              清算。申请冻结了所有正在进行的诉讼（包括供应商违约和 PACA 诉讼），并将十二家关联公司的全部破产财产交给法院指定的受托人；无担保贸易债权人和股权投资者的回收额从极少到零不等。
            calloutType: risk
            claimRefs:
