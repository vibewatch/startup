      - number: '1.3'
        title: 资本化、战略并购与清算里程碑
        blocks:
          - type: paragraph
            body: >-
              在运营期间，80 Acres Farms 通过多轮风险投资和私募股权融资获得了大量机构支持。2019 年 1 月，公司从 Virgo Investment Group 获得超过 $40 million
              私募股权资金，用于完成汉密尔顿自动化室内设施；截至 2025 年初，Barclays Climate Ventures、Siemens Financial Services、Blue Earth Capital
              和 Taurus Investment Holdings 又陆续投资。2025 年 3 月，80 Acres 从破产同行 Kalera
              手中收购了位于乔治亚州、得克萨斯州和科罗拉多州的三座运营中的室内垂直农场，推动行业整合。2025 年 8 月，公司宣布与室内有机农业龙头 Soli Organic 达成里程碑式合并，把 80 Acres 的
              GroLoop 技术与 Soli 覆盖 17,000 家门店、拥有 35 年历史的零售配送网络结合起来，目标是实现 $200 million 年收入和 15 to 20 million pounds
              的农产品产能。然而，资本密集型成本结构、高昂的电力和人员负担，以及未能获得救助收购或新融资，触发了 2026 年 8 月 3 日的运营停摆。2026 年 8 月 25 日，80 Acres Urban
              Agriculture, Inc. 及其十一家关联公司向美国特拉华州地区破产法院提交自愿 Chapter 7 破产申请（案号 26-11324-BLS），报告负债在 $100 million 至 $500
              million 之间。
