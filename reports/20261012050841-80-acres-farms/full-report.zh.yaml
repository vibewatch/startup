      - number: '8.2'
        title: 投资论点 vs. 结构性反论
        blocks:
          - type: paragraph
            body: >-
              80 Acres Farms 的核心投资论点是：将专有的 GroLoop 自动化种植系统与全国零售分销结合，就能释放难以撼动的规模经济。August 2025 与 Soli Organic
              的合并正是为加速这一论点而设计，预计合并后第一年收入接近 $200 million，覆盖超过 17,000 家零售门店，年产能达到 15 to 20 million pounds 的农产品。现实却是，联合创始人兼
              CEO Mike Zelkind 在 2026 年初承认，尽管单个自动化农场设施已经实现正的场地层面贡献利润率，公司层面的管理费用、软件开发和整合支出仍然在结构上无法承受。每个设施年产约 10 million
              份产品，仍不足以填补公司赤字。Soli 交易非但没有缓解运营压力，反而大幅增加了行政复杂度和债务负担，说明在缺乏合并后单元经济效益纪律的情况下，扩大大宗农业业务只会加速现金耗尽。
            claimRefs:
              - CV003
              - CV004
              - CV007
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV007
              - CV009
      - number: '8.3'
        title: 清算情景与资本回收分析
        blocks:
          - type: paragraph
            body: >-
              面对特拉华州第 7 章破产程序，所有估值分析都必须从持续经营倍数切换为困境资产清算瀑布。October 2025，公司完成了一轮 $28.4 million 融资，同时有一项规模 $150 million
              的发行正在进行，但合并后的运营摩擦让现金储备在数月内蒸发。July 2026 未支付的贸易供应商款项和 PACA
              诉讼，早在停业前数周就已发出全面资不抵债的信号。在我们的基准清算情景下，俄亥俄州、肯塔基州以及收购来的 Kalera 场址中的专用自动化农业设备、输送机器人和 LED
              基础设施，将由破产受托人通过逐项拍卖出售，高级有担保设备贷款方预计只能收回每一美元中的 10 至 25
              美分。一般无担保贸易债权人和设备出租方几乎无法回收。在所有建模情景——乐观、基准或悲观——下，现有优先股和普通股持有人都不会获得任何财务分配，资本将彻底减值。
            claimRefs:
              - CV008
              - CV010
              - CV011
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV006
              - CV008
              - CV010
              - CV013
      - number: '8.4'
        title: 行业洗牌、先例失败与事后尽调
        blocks:
          - type: paragraph
            body: >-
              80 Acres Farms 的崩溃，为第一轮受控环境农业洗牌画下句号；此前 Plenty、AeroFarms、AppHarvest 和 Kalera 等同行也相继破产、重组或甩卖资产。2019 年至 2025
              年初，80 Acres 从 Virgo Investment Group、Barclays 和 Siemens 获得了大量私募股权和追加资本，却从未公开提交经审计的财务报表或 GAAP 毛利率。到 2025
              年年中，室内农业风险投资已从高峰期的数十亿美元骤降至五笔交易合计仅 $57
              million，现金消耗型运营商的再融资窗口因此彻底关闭。机构投资者若要考察幸存的农业科技资产，事后尽调的关键要求包括：核实经审计的单农场
              EBITDA，且该指标须未计入集中费用分摊；要求具有约束力的客户包销协议覆盖至少 50% 的收成量；并设置严格的治理触发条件——合并后的合并现金流未经证实为正，不得开展无对冲的多实体合并。
            claimRefs:
              - CV002
              - CV009
              - CV010
              - CV012
      - number: '8.5'
        title: 展品
        blocks:
          - type: callout
            title: 先进制造与软件资本化陷阱
            body: >-
              80 Acres Farms
              成为了受控环境农业根本性资本化错配的受害者：用高成本风险资本和成长型股权为资本密集、低利润率的制造业务融资，却期待软件式的规模化经济。尽管单个自动化种植室展现出正的运营贡献利润率，但沉重的公司管理费用层、债务偿付和设施持有成本叠加后，无法靠零售大宗农产品销售消化，最终直接导致特拉华州第
              7 章清算。
            calloutType: risk
            claimRefs:
              - CV001
              - CV007
              - CV013
