      - number: '2.3'
        title: 买方分层、预算归属与超市采用路径
        blocks:
          - type: paragraph
            body: >-
              垂直农场农产品的采用由杂货零售的农产品品类经理和采购总监主导，他们优先考虑供应链确定性、延长货架期和降低损耗。传统露地农业让杂货商暴露于天气扰动、污染召回，以及从西部种植谷地出发的长途跨洲运输风险。80
              Acres Farms 围绕与 Kroger、Whole Foods Market 等一线杂货连锁的直接关系搭建商业采用路径。早期运营优先在俄亥俄州汉密尔顿两小时车程内做本地化配送；之后，Soli Organic
              合并和 Kalera 资产收购把配送范围扩大到全国超过 17,000 家门店。零售买家愿意支付适度批发溢价，换取有保障的供货率、全年价格稳定，以及经过清洗、即买即食且消费者货架期更长的农产品。
            claimRefs:
              - CM001
              - CM004
              - CM005
              - CM009
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM004
              - CM005
              - CM013
      - number: '2.4'
        title: 结构性增长驱动因素与资本密集性、收缩阻力
        blocks:
          - type: paragraph
            body: >-
              室内农业的长期需求驱动仍然有吸引力：零售杂货商需要可靠、无农药且不受极端气候冲击和水资源短缺影响的供应链。为此，80 Acres 通过技术子公司 Infinite Acres 开发
              GroLoop，试图把软件优化能力变现到农场网络中。但这些运营优势被严重的资本约束压过。垂直农业的单位经济需要大量资本开支和高额运营费用，人工与电力占据设施运营预算的大头。在筹得超过 $350 million
              增长资金后，80 Acres Farms 仍遭遇严重的合并后整合困难，最终于 2026 年 5 月关闭弗吉尼亚包装设施并裁员 80 人。到 2026 年 8
              月，在更广泛的风险融资退潮中无法获得额外资本，公司宣布逐步停止运营，暴露出紧缩资本市场下室内农业模式的脆弱性。
            claimRefs:
              - CM002
              - CM007
              - CM008
              - CM011
              - CM012
              - CM014
