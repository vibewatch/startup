  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资建议、评级与立场
        blocks:
          - type: paragraph
            body: >-
              80 Acres Farms 在 August 3, 2026 停止运营，随后旗下十二个法人实体在特拉华州进入第 7
              章清算破产，对股权投资者而言已构成明确的终局性损失。在十一年的运营历程中，公司从知名风险投资和私募股权发起人处募资超过 $350
              million，用于在美国中西部和南部建设自动化垂直农场网络。然而，持续的营运资金赤字、传统露天种植农产品带来的零售价格上限，以及高昂的公司行政开支，最终压垮了商业模式。August 2,
              2026，一家潜在战略收购方退出后期谈判，公司随即出现流动性崩溃。计划负债在 $100 million 至 $500 million 之间，远超清算资产价值，次级债务层和股权权益面临完整的 100%
              损失。因此，投资建议为回避，信心度为高，风险评级为关键，估值判断为昂贵。
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV013
