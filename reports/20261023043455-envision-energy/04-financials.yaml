    title: Revenue streams and observable evidence
    columns: [Stream, Mechanism, Unit or denominator, Current public value/status, Quality, Diligence ask]
    rows:
      - ["Wind turbines", "Equipment supply and project delivery", "MW / turbine unit", "200 EN182|5 MW units in Juniper order; broader 30.6 GW 2024 orders reported", "Third-party and company-reported order evidence; contract value absent", "Obtain signed contract value, milestones, deposits, delivery schedule, and recognized revenue"]
      - ["Battery storage", "BESS supply integrated with power conversion and AIoT management", "MWh / MW", "320 MWh Juniper order; 5 MWh containerized units described", "Customer-order reporting; price and margin absent", "Obtain battery BOM, warranty reserve, realized $/MWh, and commissioning acceptance terms"]
      - ["Lifecycle services", "Operation and maintenance attached to supplied assets", "Service contract / asset", "Comprehensive lifecycle O&M stated for Juniper order", "Company-related commercial reporting; recurring value absent", "Obtain service attachment rate, contract duration, renewal, and gross contribution"]
      - ["Energy software and control", "Smart-turbine control, monitoring, diagnostics, and energy management", "Turbine / project / subscription", "Capabilities described; no standalone software price or revenue disclosed", "Product evidence, not monetization evidence", "Obtain software attach rate, recurring fee, implementation cost, and retention"]
      - ["Integrated industrial systems", "Wind, storage, hydrogen, and industrial-park delivery", "Project / facility", "Ordos flagship and overseas projects described; economic terms undisclosed", "Independent feature coverage and company releases; early-stage projects noted", "Obtain project SPV structure, capex share, financing, offtake, and accounting treatment"]
    notes: "Public sources mix company claims, reported orders, and independent coverage; order capacity and project scope are not recognized revenue. Null economics mean not disclosed, not zero."
    claimRefs: [CI001, CI002, CI003, CI004, CI005]
  - id: TI002
    title: Pricing and monetization evidence
    columns: [Offering, Public list price, Realized price or contract value, Discount or terms, Financial implication, Diligence ask]
    rows:
      - [Wind turbine generator, null, null, null, "Revenue is likely project-specific and exposed to component, logistics, and warranty costs", "Obtain bid sheets, ASP by platform, payment milestones, and change-order history"]
      - [Battery storage system, null, null, null, "320 MWh scope confirms capacity sold but not monetization or margin", "Obtain $/MWh, PCS and cell pass-through terms, warranty reserve, and liquidated damages"]
      - [Lifecycle O&M, null, null, null, "Potential recurring service stream but attachment and renewal economics are unknown", "Obtain annual service fee, duration, renewal rate, uptime obligations, and service labor cost"]
      - [Integrated green-energy park, null, null, null, "High upfront investment and multi-party coordination increase financing and execution risk", "Obtain total project capex, sponsor funding, debt terms, grants, offtake price, and break-even case"]
    notes: "No public price list or realized contract value was found in the assigned successful fetches. These are unavailable fields, not estimates."
    claimRefs: [CI006, CI007, CI008, CI009]
  - id: TI003
    title: Unit economics and underwriting inputs
    columns: [Metric, Value, Confidence, Why it matters, Diligence ask]
    rows:
      - [Revenue, null, "Low", "Cannot distinguish order volume from recognized revenue or backlog conversion", "Provide audited consolidated revenue by segment and reconciliation to backlog"]
      - [Gross margin, null, "Low", "Manufacturing, project execution, warranty, and service mix determine earnings quality", "Provide segment gross margin, warranty reserve, and loss-making project history"]
      - [CAC or sales efficiency, null, "Low", "Large project sales cycles and partner-led bids may consume substantial working capital", "Provide sales-cycle length, bid cost, win rate, channel economics, and payback"]
      - [Cash burn and runway, null, "Low", "Capital adequacy cannot be judged from funding raised or order capacity", "Provide monthly cash flow, unrestricted cash, committed capex, and runway under downside cases"]
      - [Working capital, null, "Low", "Deposits, receivables, inventory, and project milestones can make growth cash-negative", "Provide DSO, DPO, inventory turns, customer advances, and contract-asset balances"]
      - [Debt and project finance, null, "Low", "Conventional debt signals financing use but not leverage, maturity, or covenant risk", "Provide debt schedule, guarantees, covenants, rates, maturities, and SPV recourse"]
    notes: "All unavailable values are shown as null because the assigned evidence does not support precise estimates. The requested diligence items are required before underwriting."
    claimRefs: [CI010, CI011, CI012, CI013, CI014]

