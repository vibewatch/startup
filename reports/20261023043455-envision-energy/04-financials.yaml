callouts:
  - calloutType: strength
    title: Commercial breadth with observable orders
    body: "The evidence shows equipment, storage, controls, and lifecycle-service components in one commercial model, including a 320 MWh storage order and 200 turbine generators for Juniper Green Energy."
    claimRefs: [CI001, CI002, CI003]
  - calloutType: risk
    title: Capital adequacy is unverified
    body: "Funding aggregates and project activity do not establish cash available, burn, runway, debt capacity, or margin. The missing financial statements are the principal underwriting blocker."
    claimRefs: [CI010, CI011, CI012, CI013]
  - calloutType: recommendation
    title: Underwrite through project cash conversion
    body: "Require audited segment results, contract economics, working-capital data, debt terms, and project-finance structures before treating order momentum as investable earnings power."
    claimRefs: [CI009, CI014]

