callouts:
  - calloutType: strength
    title: Named industrial-scale proof
    body: The Casa dos Ventos agreement is stronger than a logo claim because it specifies 630 MW of supply and a 30-year service term, although commissioning and outcomes remain unverified.
    claimRefs: [CU009]
  - calloutType: risk
    title: Retention and concentration remain opaque
    body: Public evidence does not disclose NRR, GRR, churn, renewals, customer-level revenue, or top-customer concentration, so durability cannot be inferred from project announcements.
    claimRefs: [CU008, CU012]
  - calloutType: recommendation
    title: Request contract-level customer evidence
    body: Obtain a dated customer and project schedule separating pilot, contracted, commissioned, and operating assets, with service attachment, renewal, utilization, and top-customer revenue shares.
    claimRefs: [CU008, CU012]
