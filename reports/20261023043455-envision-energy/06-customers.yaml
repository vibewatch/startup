company:
  name: Envision Energy
chapter:
  number: 6
  title: Customers
  summary: Envision's public customer proof is strongest where named project counterparties disclose concrete turbine, storage, or service commitments. The evidence supports a geographically expanding industrial-customer motion, but public retention, customer concentration, utilization, and revenue-denominator data remain unavailable.
sections:
  - id: customer-segments
    title: Customer segments and buying motion
    body: "Envision sells into utility-scale renewable developers, industrial decarbonization programs, and public or quasi-public energy ecosystems rather than a simple software-seat market. Bloomberg describes wind turbines, wind-resource assessment, intelligent storage, and other services sold across Asia, Europe, and the Americas, while MIT Technology Review describes an integrated model linking generation, storage, and fuel production. LeadIQ and Tracxn separately report an August-to-September 2026 workforce of roughly 2,800 to 2,926 people; that supports a global delivery footprint but is not a customer-count proxy. Named counterparties show a buyer/user split: Casa dos Ventos is a renewable developer buying 630 MW of turbines and a 30-year service agreement, while Envision's own news index names REE Energy, Kallista Energy, Neoen, Sasol, and North Macedonia project stakeholders across wind, storage, hydrogen, and industrial infrastructure. The commercial thesis is therefore relationship-led and project-based; public evidence does not establish recurring software revenue, a broad active-account count, or payer-level economics."
    claimRefs: [CU001, CU002, CU003, CU004, CU013, CU014]
    tableRefs: [TU001]
  - id: adoption-trajectory
    title: Adoption trajectory and durability
    body: Public disclosures indicate a growing international deployment footprint, but they mix orders, projects, capacity, and corporate announcements that cannot be converted into a common customer-growth rate. The September 2025 S&P Global release says Envision had delivered more than 30 GWh of storage, secured over 50 GWh of new orders, and deployed 300+ projects worldwide; those are company-issued figures reproduced through PRNewswire and are not a retention cohort. A separate company-issued March 2025 release reported 30.6 GW of 2024 turbine orders and 14.5 GW of 2024 installations, retaining the distinct order and installation denominators. The company news index adds dated 2026 projects in Vietnam, France, Australia, the Philippines, and North Macedonia. MIT Technology Review reports that the Ordos industrial park took years to develop and required government investment, underscoring long sales cycles. No source supplies NRR, GRR, churn, renewal, contract backlog conversion, active utilization, or customer-level revenue concentration.
    claimRefs: [CU005, CU006, CU007, CU008, CU012, CU015, CU016]
    tableRefs: [TU002]
    figureRefs: [FU001]
  - id: named-proof-and-risk
    title: Named proof, expansion, and concentration risk
    body: "Named deployments provide better evidence than logos, but the proof is uneven in reference quality. Casa dos Ventos is the clearest customer-quoted example: a company-issued release identifies a 630 MW supply agreement, a 30-year long-term service agreement, customized 8.x MW turbines, and possible expansion into digital asset management, AI data centers, hydrogen, and ammonia. Power Philippines independently reports a 1,500-square-meter Batangas distribution center intended to bring components and spare parts closer to projects, which supports a service-coverage signal but not customer retention. The Brazil release and official project index suggest land-and-expand opportunities, while the absence of customer-level revenue and renewal data leaves concentration and execution exposure unresolved. A diligence review should request contract-level customer lists, production versus pilot status, outcomes, service attachment, renewal cohorts, and top-ten customer shares."
    claimRefs: [CU009, CU010, CU011, CU012]
    tableRefs: [TU003]
tables:
  - id: TU001
    title: Customer segmentation
    columns: [Segment, Buyer or payer, User or use case, Scale or strategic value, Evidence gap]
    rows:
      - [Utility-scale renewable developer, "Developer / project owner", "Wind generation and long-term service", "Casa dos Ventos: 630 MW supply agreement in Brazil", "Pricing, margin, and service-attachment terms are undisclosed"]
      - [Utility-scale storage developer, "Project owner / grid participant", "Grid storage and renewable integration", "Kallista Energy: 386 MWh project named in Envision's 2026 news index", "Operating status and customer outcome are not disclosed on the index"]
      - [Industrial decarbonization customer, "Industrial partner", "Green hydrogen, ammonia, and integrated clean power", "Sasol collaboration in South Africa and Ordos model", "Pilot versus production economics and repeatability are unverified"]
      - [Regional wind-market customer, "Developer / local energy ecosystem", "International turbine deployment and lifecycle support", "REE Energy in Vietnam and Neoen in Australia are named projects", "Contract value, delivery status, and renewal evidence are missing"]
    notes: "Segments are reconstructed from named counterparties and source descriptions; a named project or collaboration is not treated as proof of active recurring revenue."
    claimRefs: [CU001, CU002, CU003, CU004]
  - id: TU002
    title: Customer growth and adoption trajectory
    columns: [Metric, Value, Date or period, Source posture, Implication, Missing denominator]
    rows:
      - ["Storage capacity delivered", "More than 30 GWh", "Reported September 2025", "Company-issued release via PRNewswire", "Indicates material deployment scale", "No customer, geography, or revenue split"]
      - ["Storage orders secured", "Over 50 GWh", "Reported September 2025", "Company-issued release via PRNewswire", "Shows order pipeline beyond delivered capacity", "No conversion timing or cancellation rate"]
      - ["Storage projects deployed", "300+", "Reported September 2025", "Company-issued release via PRNewswire", "Supports breadth of project footprint", "No active/inactive or repeat-customer count"]
      - ["Brazil wind supply", "630 MW plus 30-year service agreement", "Announced in 2026 source text", "Company-issued announcement quoting the customer", "Strong named-deployment and durability signal", "No contract value, commissioning date, or outcome"]
      - ["Wind-turbine orders", "30.6 GW", "2024", "Company-issued release citing Wood Mackenzie", "Indicates large order intake", "No customer count, cancellation rate, or conversion timing"]
      - ["New wind installations", "14.5 GW", "2024", "Company-issued release citing BloombergNEF", "Indicates deployment scale distinct from orders", "No customer count, revenue contribution, or installed-fleet denominator"]
    notes: "Capacity, orders, project counts, and a single contract are different units and are intentionally not combined into a conversion funnel; reported values are retained with their stated periods."
    claimRefs: [CU005, CU006, CU007, CU009, CU015, CU016]
  - id: TU003
    title: Named customer proof table
    columns: [Customer or counterparty, Segment, Deployment or use case, Production versus pilot, Outcome or commitment, Limitation]
    enumerationScope:
      coverage: partial
      basis: "Publicly named counterparties and projects found in successful prefetched sources for the 2026-10-23 refresh run"
    rows:
      - [Casa dos Ventos, "Brazil renewable developer", "630 MW Galileo AI wind turbines", "Contracted supply; production status not confirmed", "30-year long-term service agreement", "Source is a company-issued announcement quoting the customer and gives no operating outcome"]
      - [REE Energy, "Vietnam renewable developer", "200 MW nearshore wind project", "Project secured; commissioning not shown", "Envision calls it its largest nearshore project", "Official index provides no contract economics"]
      - [Kallista Energy, "France storage developer", "386 MWh energy storage project", "Delivery announced; operating outcome not shown", "Named project in official 2026 news index", "No utilization, warranty, or renewal data"]
      - [Neoen, "Australia wind developer", "179 MW Narrogin wind farm turbines", "Delivery announced; operating status not shown", "Named project in official 2026 news index", "No production performance or service attachment data"]
    notes: "Enumeration is partial because public sources do not provide a complete customer list; entries distinguish named commitments from verified operating outcomes."
    claimRefs: [CU003, CU009, CU010, CU011]
