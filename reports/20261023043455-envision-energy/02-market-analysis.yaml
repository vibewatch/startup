    rows:
      - ["Wind turbines and services", "Utilities, IPPs, developers", "Grid operators and electricity consumers", "Project company, utility capex, financiers", "New capacity, repowering, lower levelized cost", "Permits, interconnection, policy, local content"]
      - ["Grid-scale storage", "Utilities, developers, network operators", "Grid operators and renewable fleets", "Utility or project capex", "Curtailment reduction, balancing, resilience", "Bankability, cell supply, grid rules"]
      - ["Green hydrogen or ammonia", "Industrial operators and offtakers", "Steel, chemicals, shipping and fuel users", "Industrial capex plus project finance or public support", "Hard-to-electrify decarbonization need", "Cost premium and immature transport infrastructure"]
      - ["Net-zero industrial parks", "Governments, industrial developers, anchor tenants", "Co-located factories and communities", "Consortium of public and private capital", "Energy security and integrated low-carbon production", "Large upfront capital and multi-party coordination"]
      - ["AI and data-center power systems", "Hyperscalers and data-center developers", "Computing workloads", "Data-center infrastructure capex and power contracts", "Rapid load growth and need for reliable supply", "Generation, grid, storage, and permitting lead times"]
    notes: >-
      Buyer roles are inferred from independent sector disclosures and company project examples;
      contract ownership, procurement authority, and budget splits remain private-evidence gaps.
    claimRefs: [CM002, CM007, CM012, CM014, CM015]
figures:
  - id: FM001
    title: Addressability ladder from established wind to emerging integrated systems
    type: pyramid
    summary: >-
      Six source-backed operating-scale markers show breadth across wind, storage, industrial
      power, and AI infrastructure without presenting them as an additive market.
    data:
      nodes:
        - label: Global wind installations
          value: 15.4
          unit: GW
          detail: "Envision installations in 2023; company-issued release citing BloombergNEF."
          claimRefs: [CM006]
        - label: Global wind order intake
          value: 22
          unit: GW
          detail: "Envision FY2023 orders; company-issued release citing Wood Mackenzie."
          claimRefs: [CM005]
        - label: Storage delivered
          value: 30
          unit: "GWh+"
          detail: "More than 30 GWh delivered as reported in the 2025 company-issued release."
          claimRefs: [CM008]
        - label: Storage new orders
          value: 50
          unit: "GWh+"
          detail: "More than 50 GWh of new orders as reported in the same company-issued release."
          claimRefs: [CM009]
        - label: Chifeng operating system
          value: 2
          unit: GW
          detail: "Renewable power system at one integrated industrial park."
          claimRefs: [CM010]
        - label: Mission Gobi target
          value: 5
          unit: GW
          detail: "Planned green AI data-center capacity by 2030; not an operating value."
          claimRefs: [CM011]
    approximationNotes: >-
      The ladder is ordered by commercial adjacency, not magnitude. It mixes power (GW) and
      energy (GWh), preserves plus signs for lower-bound company claims, and is neither additive
      nor a conversion funnel; the company-issued figures are not independently verified TAM.
    claimRefs: [CM005, CM006, CM008, CM009, CM010, CM011, CM012]
callouts:
  - calloutType: risk
    title: Do not capitalize broad clean-energy growth as company SOM
    body: >-
      The retained evidence lacks a common revenue denominator, country-level eligible pipeline,
      pricing, win rates, and order-to-revenue conversion. Treat the integrated portfolio as
      strategic option value until those inputs are available.
    claimRefs: [CM013, CM014, CM015, CM016]
