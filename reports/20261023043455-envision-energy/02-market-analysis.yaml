      - ["Newly installed wind capacity", "2023", "Global company installations", "15.4 GW", "Envision release citing BloombergNEF", "Medium", "Different denominator from order intake"]
      - ["Storage delivered", "As reported in 2025 release", "Global cumulative company deployments", "More than 30 GWh", "Envision-issued Tier 1 announcement", "Medium", "No revenue, timing, or regional split"]
      - ["Storage new orders", "As reported in 2025 release", "Global company bookings", "More than 50 GWh", "Envision-issued Tier 1 announcement", "Medium", "Bookings are not delivered capacity or recognized revenue"]
      - ["Chifeng integrated system", "2026 report", "Single operating industrial park", "2 GW renewable power system", "Company-issued report syndicated by PressReach", "Medium", "Project scale, not SAM"]
      - ["Mission Gobi initiative", "Target by 2030", "Desert and arid regions; countries unspecified", "5 GW planned AIDC capacity", "Company-issued report syndicated by PressReach", "Low", "Forward target without disclosed financing or pipeline"]
    notes: >-
      Values preserve source periods, units, and denominators. GW, GWh, installations, orders,
      and planned capacity are not comparable or additive, and none is a revenue TAM/SAM/SOM.
    claimRefs: [CM004, CM005, CM006, CM008, CM009, CM010, CM011]
