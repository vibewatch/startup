callouts:
  - calloutType: insight
    title: Platform economics are not yet demonstrated
    body: The architecture is strategically coherent, but public evidence does not show whether software, storage, and molecule projects earn repeatable returns independent of hardware and project finance.
    claimRefs: [CE003, CE006, CE012]
  - calloutType: assumption
    title: Company claims require independent validation
    body: Product launches, certifications, order statistics, and project descriptions establish what is reported, not a complete independent performance record.
    claimRefs: [CE004, CE009, CE010]
