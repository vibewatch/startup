  evidenceGaps:
    - type: missing-source
      severity: material
      topic: reliability-security
      missingEvidence: Fleet-level availability, component failure, warranty, false-alarm, incident, penetration-test, and software-service-level data for current turbines and control products.
      whyItMatters: Product differentiation depends on reliable operation and software control, but public launch descriptions cannot establish bankable performance or cyber resilience.
      diligencePath: Request model-by-model operating datasets, warranty-claim cohorts, incident logs, independent penetration-test summaries, and customer service-level agreements.
      relatedQuestionRefs: [QE004, QE008]
    - type: missing-source
      severity: material
      topic: integrated-system
      missingEvidence: Independent commissioning, operating-cost, degradation, and safety records for the Chifeng wind-storage-hydrogen-ammonia system.
      whyItMatters: The integrated architecture is central to the product thesis, yet project-level economics and operational stability are not independently demonstrated in the assigned evidence.
      diligencePath: Obtain audited production records, electrolyzer and battery performance curves, safety cases, offtake contracts, and third-party certification files.
      relatedQuestionRefs: [QE003, QE004]
    - type: access-blocked
      severity: material
      topic: regulatory-risk
      missingEvidence: Current case status and company-specific findings, if any, from European foreign-subsidy and market-access reviews.
      whyItMatters: A sector-level inquiry may affect export eligibility, financing, customer procurement, and local-content requirements without proving a company-specific violation.
      diligencePath: Obtain current Commission records, tender eligibility decisions, local-content obligations, and counsel analysis for target countries.
      relatedQuestionRefs: [QE006]
    - type: private-evidence-only
      severity: minor
      topic: developer-signal
      missingEvidence: The assigned prefetched pool contains no public repository activity, package downloads, API documentation, release history, or customer engineering discussion for EnOS and related software.
      whyItMatters: The retained WindEurope trade-body source is a practitioner-community proxy for market-access risk, but it does not evidence software engineering maturity or adoption.
      diligencePath: Request product documentation, deployment counts, release history, integration references, and permitted customer engineering evidence.
      relatedQuestionRefs: [QE002, QE008, QE009]
