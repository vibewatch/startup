            title: Multi-product energy platform
            body: >-
              Independent descriptions support a scope extending from turbines and wind software into storage,
              batteries, hydrogen, and integrated industrial systems.
            calloutType: strength
            claimRefs:
              - CO004
          - type: callout
            title: Capital and governance opacity
            body: >-
              The public record does not resolve board oversight, succession, financing terms, or audited group
              economics, while independent reporting identifies high capital, coordination, and geopolitical barriers.
            calloutType: risk
            claimRefs:
