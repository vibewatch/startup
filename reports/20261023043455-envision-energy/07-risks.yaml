    columns: [Failure mode, Likelihood, Severity, Mitigation maturity, Residual exposure, Unresolved gap]
    rows:
      - ["Supply-chain bottlenecks in rare earths, copper, lithium, transformers, or specialized steel", High, High, Partial, High, "No current supplier concentration or inventory disclosure."]
      - [Wind and solar intermittency affecting industrial loads, Medium, High, Partial, Medium-high, "No independent fleet-level availability or curtailment series."]
      - [Certification not converting into reliable commercial deployment, Medium, High, Partial, Medium-high, "Need delivered-asset, warranty, and failure-rate evidence."]
      - [Integrated-park construction or commissioning delay, Medium, High, Low, High, "Need schedule, contingency, and financing-close data by project."]
    notes: "Risk ratings are bounded by the cited evidence and should not be read as measured probabilities; no fetched source supplied a fleet-wide outage, safety, or warranty denominator."
    claimRefs: [CR001, CR004, CR005, CR008, CR009, CR010]
  - id: TR003
    title: Partner / dependency risk register
    columns: [Dependency, Counterparty or role, Failure scenario, Severity, Mitigation, Residual exposure]
    rows:
      - [Grid operators and utilities, "National and regional grid counterparties", "Grid connection, code approval, or curtailment delays prevent project revenue.", High, "Product certifications and project-specific grid studies.", High]
      - [Governments and local authorities, "Permitting, incentives, and local-content authorities", "Policy change, review, or local sourcing rules delay or reduce project economics.", High, "Local partnerships and jurisdiction-specific certification work.", High]
      - [Lenders and project financiers, "Banks and infrastructure finance providers", "Large upfront capital requirement or delayed financial close constrains rollout.", High, "Project finance structures; Zhanatas used a syndicated financing package.", Medium-high]
      - [Industrial and technology partners, "Industrial customers, developers, and computing partners", "Demand, workload, or offtake coordination fails to support integrated parks.", Medium, "Integrated energy-management systems and announced partnerships.", Medium-high]
    notes: "Counterparty roles are drawn from project and company descriptions; concentration, contract terms, and failure probabilities were not disclosed in the assigned public evidence."
    claimRefs: [CR001, CR003, CR011, CR012]
