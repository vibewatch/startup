callouts:
  - calloutType: risk
    title: The core risk is replication, not concept validation
    body: >-
      Envision has public evidence of technical certifications and selected project
      execution, but the more demanding question is whether its integrated model
      can be financed, permitted, supplied, and operated repeatedly across
      jurisdictions.
    claimRefs: [CR001, CR006, CR008, CR011]
  - calloutType: assumption
    title: Missing denominators limit confidence
    body: >-
      The assigned sources do not establish fleet-wide availability, warranty
      claims, customer concentration, cash burn, margin, or project-level failure
      rates. These are underwriting gaps, not evidence that the metrics are zero.
    claimRefs: [CR009, CR010, CR013, CR014]
