    claimRefs: [CV001, CV003, CV004, CV007, CV008, CV012, CV013, CV016]
callouts:
  - calloutType: recommendation
    title: Track pending price discovery
    body: >-
      Public evidence supports strategic relevance and commercial activity, but not an
      auditable entry price or target return; investing now would require unsupported precision.
    claimRefs: [CV003, CV004, CV016]
  - calloutType: risk
    title: Financing is not valuation
    body: >-
      Vendor financing and syndicated debt may facilitate deployment, but they do not
      establish equity value, unrestricted cash, dilution, or shareholder seniority.
    claimRefs: [CV004, CV005, CV016]
