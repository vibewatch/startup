      - [Anti-thesis, "Capital intensity", "Integrated parks require large upfront investment and long planning cycles", "Show project-level returns and limited parent recourse"]
      - [Anti-thesis, "Geopolitical friction", "Tariffs, local-content rules, and critical-infrastructure reviews can constrain expansion", "Prove bankable localization and regulatory clearance"]
      - [Anti-thesis, "Disclosure quality", "Revenue aggregators materially disagree", "Provide audited consolidated and segment reporting"]
    notes: "The table distinguishes independent reporting, company-issued project signals, and low-reliability aggregator estimates; none establishes equity value."
    claimRefs: [CV001, CV003, CV004, CV005, CV007, CV008, CV012, CV013]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Explicit assumptions, "Supportable valuation / return range", Probability signals, Downside trigger]
    rows:
      - [Bull, "Projects convert to profitable delivery; services attach; financing remains non-dilutive and limited-recourse", "Not estimable publicly; would require audited EBITDA or free cash flow and a verified entry price", "Backlog conversion, positive cash flow, improving margins, and repeat customers", "Delays, margin shortfall, or parent recourse"]
      - [Base, "Commercial activity continues while disclosure remains limited and capital needs stay material", "No price-based return case; TRACK until private evidence is available", "Continued awards and financing without verified segment economics", "Repeated financing without stronger cash conversion"]
      - [Bear, "Localization, tariffs, supply constraints, hydrogen economics, or project complexity impair execution", "Downside cannot be bounded without debt, preferences, and fully diluted ownership", "Project slippage, restricted-market access, covenant pressure, or dilution", "Material impairment, refinancing stress, or lost market access"]
    notes: "Scenario signals are qualitative, not probabilities; precise valuation ranges are recorded as a gap rather than invented from incompatible public estimates."
    claimRefs: [CV002, CV004, CV005, CV012, CV013, CV014, CV015, CV016]
