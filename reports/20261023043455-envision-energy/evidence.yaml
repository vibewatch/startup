evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: financial-disclosure
    missingEvidence: Audited consolidated statements covering revenue, margins, cash flow, debt, and segment performance.
    whyItMatters: >-
      Funding, valuation, orders, and project announcements do not establish profitability, liquidity, or cash
      available.
    diligencePath: >-
      Request audited group accounts, current management accounts, a debt schedule, and segment-level revenue and margin
      bridges.
    relatedQuestionRefs:
      - QO004
      - QO005
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Current board and committee roster, beneficial ownership, investor rights, delegated authorities, and succession
      plan.
    whyItMatters: >-
      Founder-led execution across capital-intensive and regulated markets creates control and continuity risk that
      public biographies cannot resolve.
    diligencePath: >-
      Obtain the cap table, shareholder agreement, board materials, reserved-matters schedule, delegation matrix, and
      succession plan.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: enumeration-incomplete
    severity: material
    topic: leadership-and-stakeholders
    missingEvidence: Complete executive, board, investor, lender, and major-counterparty enumeration with current status.
    whyItMatters: >-
      The partial public lists may omit key decision makers, controlling holders, senior creditors, or concentrated
      commercial dependencies.
    diligencePath: >-
      Reconcile official entity records, the cap table, financing documents, organization chart, and top-customer and
      backlog schedules.
    relatedQuestionRefs:
      - QO003
      - QO004
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: customer-and-revenue-scale
    missingEvidence: Audited consolidated revenue and a consistently defined active-customer count with concentration data.
    whyItMatters: >-
      Workforce, valuation, and order announcements cannot be converted into revenue quality, retention, or customer
      diversification.
    diligencePath: >-
      Obtain audited revenue, segment reporting, a customer master, top-customer concentration, service attachment, and
      backlog conversion schedules.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: geographic-sam-som
    missingEvidence: >-
      Country-level eligible project pipeline, Envision bid coverage, expected win rates, pricing, and order-to-revenue
      conversion by wind, storage, and integrated systems.
    whyItMatters: >-
      Without a geography-specific denominator and capture assumptions, neither SAM nor SOM can be separated from broad
      sector demand.
    diligencePath: >-
      Obtain the confidential regional pipeline and reconcile it to public procurement notices, interconnection queues,
      disclosed awards, and recognized revenue.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: sizing-methodology
    missingEvidence: >-
      A common market-value denominator that reconciles turbine installations, order intake, storage deliveries, storage
      bookings, and planned project capacity without mixing GW, GWh, bookings, and revenue.
    whyItMatters: The available metrics demonstrate scale but cannot be added or converted into a defensible TAM, SAM, or SOM.
    diligencePath: >-
      Commission a bottom-up model using project counts, equipment pricing, service attachment, regional eligibility,
      delivery timing, and independently verified market totals.
    relatedQuestionRefs:
      - QM010
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: >-
      Comparable bid-level turbine, storage, service, warranty, and financing prices across Envision, Vestas, Siemens
      Gamesa, Windey, and SANY.
    whyItMatters: >-
      Without realized commercial terms, integration may appear differentiated while being uneconomic or no better than
      a multi-vendor bid.
    diligencePath: >-
      Obtain anonymized recent bids or customer contracts with identical turbine class, site, service term, storage
      duration, and local-content assumptions.
    relatedQuestionRefs:
      - QP005
      - QP010
    relatedTableRefs:
      - TP003
  - type: enumeration-incomplete
    severity: material
    topic: competitor-performance
    missingEvidence: >-
      Independent reliability, availability, warranty, and lifecycle-cost benchmarks for Envision and named OEM
