      - ["Siemens Gamesa", "Not disclosed", "Onshore, offshore, maintenance, asset optimization, spares and repairs", "Not disclosed", "Comparable scope is not available from fetched page"]
      - ["SANY Renewable Energy", "Not disclosed", "Turbine platforms, farm design, EPC, transport, O&M, financing", "Not disclosed", "Bundling may simplify execution but can reduce bid transparency"]
