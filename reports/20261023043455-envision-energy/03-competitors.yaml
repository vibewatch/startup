callouts:
  - calloutType: strength
    title: Integration is the clearest differentiator
    body: Envision is publicly positioned across turbine hardware, storage, software, and industrial-system orchestration rather than a single turbine product.
    claimRefs: [CP005, CP006, CP010]
  - calloutType: risk
    title: Integration does not remove execution risk
    body: The integrated industrial-park model requires high upfront investment, long planning cycles, and coordination across public and private stakeholders.
    claimRefs: [CP011, CP012]
  - calloutType: assumption
    title: Pricing remains unbenchmarked
    body: No assigned source provides like-for-like realized pricing, warranty economics, or service margins across Envision and its alternatives.
    claimRefs: [CP015, CP016]
