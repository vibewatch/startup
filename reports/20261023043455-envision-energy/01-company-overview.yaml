company:
  name: Envision Energy
chapter:
  number: 1
  title: Company Overview
  summary: Envision Energy is a founder-led, late-stage private company founded in 2007 whose operating scope spans wind turbines, energy storage, software, hydrogen, and integrated industrial systems. Public sources indicate substantial financing and operating scale, but current governance, audited consolidated revenue, customer count, and capitalization terms remain unavailable.
sections:
  - id: identity-and-business-model
    title: Identity, stage, and business model
    body: >-
      Envision Energy was founded in 2007 and is classified by Tracxn as a late-stage company. MIT Technology Review places its headquarters in Shanghai, a location also listed as headquarters by Craft. Bloomberg profiles describe a wind-turbine technology company that supplies turbines, wind-resource assessment, intelligent energy-storage development, smart-wind-farm software, and technical services. MIT Technology Review adds that Envision has expanded into batteries, green hydrogen, and clean-powered industrial parks. Taken together, the evidence supports a capital-intensive equipment, project, and energy-systems platform rather than a narrowly defined software startup. Public descriptions establish the operating perimeter, but not the parent-company legal perimeter or segment economics.
    claimRefs: [CO001, CO002, CO003, CO004]
  - id: leadership-and-governance
    title: Leadership and governance
    body: >-
      Tracxn identifies Lei Zhang and Felix Zhang as founders, while both Tracxn and company-issued 2026 materials identify Lei Zhang as the current chief executive. This establishes visible founder leadership but not a complete governance picture. The assigned evidence does not disclose a current board roster, committee structure, independent-director representation, reserved matters, or a succession plan. That gap matters because Envision's activities span manufacturing, project delivery, software, hydrogen, storage, and international market development, all of which require functional depth beyond a single public-facing leader. Founder-market fit appears strong at the strategic level, but key-person dependence cannot be sized until second-line leadership and formal oversight are documented.
    claimRefs: [CO005, CO006]
    tableRefs: [TO002]
  - id: funding-valuation-and-scale
    title: Funding, valuation, and scale
    body: >-
      Tracxn reports $1 billion of total funding across four rounds, names GIC and Primavera as investors, and shows Primavera and HSG on a 2021 private-equity entry. It also reports a $500 million financing in April 2026 and labels the latest April 10 entry conventional debt; the database presentation does not establish proceeds still available, lender identity, or instrument terms. Tracxn's current profile reports 2,926 employees as of September 30, 2026. Separately, Hurun's Global Unicorn Index 2025 valued Envision at $15 billion using a January 1, 2025 cutoff with significant valuation changes updated through its June 2025 release. These third-party figures are useful scale markers, not substitutes for audited accounts, a current cap table, customer counts, or cash-flow evidence.
    claimRefs: [CO007, CO008, CO009, CO010, CO011, CO012]
    tableRefs: [TO001, TO003]
  - id: milestones-and-execution-risk
    title: Milestones and execution risk
    body: >-
      Company-issued materials report 30.6 GW of turbine orders and 14.5 GW of new installations for 2024, then describe a 5 GW green-AI data-center ambition under Mission Gobi by 2030. Envision's newsroom subsequently listed a 200 MW Vietnam nearshore project and consecutive September 2026 launches of the EN-252/16.7 offshore turbine and Model T EN175/8.0 onshore turbine. These milestones show continued product and geographic expansion, but they do not establish profitability or project-level returns. MIT Technology Review warns that the integrated-industrial-park model requires enormous upfront investment, years of planning, and multi-party coordination, while overseas activity faces local-content rules, security reviews, tariffs, and critical-infrastructure sensitivities.
    claimRefs: [CO013, CO014, CO015, CO016]
    figureRefs: [FO001]
