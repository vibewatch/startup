  topStrengths:
    - Jerry Tworek 的 OpenAI 研究领导经历，加上 Mark Saroufim 深厚的 ML 系统背景，带来极强的创始人-市场匹配。
    - 技术逻辑清晰，聚焦持续学习、后 Transformer 架构和研究工作流自动化，而不是泛泛包一层 AI 应用。
    - >-
      Strong early capital access, with a reported $100M initial raise only months after founding. 创立数月后据报道即完成 $100M
      初始融资，早期融资通道很强。
    - 早期高密度招入 OpenAI、DeepMind 和 Anthropic 人才，让一家如此年轻的公司具备少见的技术可选性。
  topRisks:
    - 公开层面没有可验证客户、试点、定价或产品支持界面，商业需求很大程度上仍是假设。
    - 传闻中的估值上调建立在很薄的公开证据和未确认融资细节上，一旦市场情绪降温，下行风险会被放大。
    - 与企业买家的预期相比，产品成熟度、信任、隐私和合规界面的说明仍不足。
    - 前沿 AI 的算力和薪酬强度很高，在可复制收入模型跑通前，种子资金可能被快速吃掉。
    - 既有平台和开源栈已经覆盖大量工作流、治理和基础设施界面，Core 想占据的空间并不空白。
    - 公开叙事高度围绕少数可见领导者展开，关键人和治理集中度仍然很高。
  unresolvedGaps:
    - 公开信息没有披露收入、毛利率、烧钱速度、现金余额或现金跑道。
    - 是否存在 Form D 或同等融资通知、何时提交以及条款如何，公开记录中仍未解决。
    - 公开层面无法验证任何具名客户、试点、设计伙伴或留存指标。
    - 除少量公开文章和发布报道外，产品架构、部署工作流、信任控制和基准测试证据都很稀疏。
    - 股权结构细节、领投方身份、董事会构成和任何结构化融资条款仍未公开。
