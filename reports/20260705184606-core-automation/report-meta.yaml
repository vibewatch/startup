  topStrengths:
    - Exceptional founder-market fit anchored by Jerry Tworek's OpenAI research leadership and Mark Saroufim's deep ML-systems pedigree.
    - Clear technical thesis around continual learning, post-transformer architectures, and research-workflow automation rather than generic AI application wrapping.
    - Strong early capital access, with a reported $100M initial raise only months after founding.
    - High-density early recruiting from OpenAI, DeepMind, and Anthropic creates unusual technical optionality for a company this young.
  topRisks:
    - No verified public customers, pilots, pricing, or product support surface means commercial demand is still largely hypothetical.
    - Reported valuation step-ups rely on thin public evidence and unconfirmed financing details, increasing downside if market sentiment cools.
    - Product maturity, trust, privacy, and compliance surfaces remain under-documented relative to what enterprise buyers expect.
    - Frontier-AI compute and compensation intensity can consume seed capital quickly before a repeatable revenue model is proven.
    - Incumbent platforms and open-source stacks already cover much of the workflow, governance, and infrastructure surface Core may try to own.
    - Key-person and governance concentration remains high because so much of the public narrative centers on a small number of visible leaders.
  unresolvedGaps:
    - No public revenue, margin, burn, cash-balance, or runway disclosure exists.
    - The existence, timing, and terms of any Form D or equivalent financing notice remain unresolved in public records.
    - No named customers, pilots, design partners, or retention metrics are publicly verifiable.
    - Product architecture, deployment workflow, trust controls, and benchmark evidence remain sparse outside a small set of public essays and launch coverage.
    - Cap-table details, lead investor identity, board composition, and any structured financing terms remain private.
