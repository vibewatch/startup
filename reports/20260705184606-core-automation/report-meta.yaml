companyProfile:
  summary: Core Automation is a San Francisco-based frontier AI research lab founded in March 2026 by former OpenAI VP of Research Jerry Tworek with co-founder Mark Saroufim and an early bench drawn from OpenAI, DeepMind, and Anthropic. The company says it is building the world's most automated AI lab and pursuing a continual-learning product direction, reportedly centered on a model called Ceres that can update in production without catastrophic forgetting. Public evidence supports strong research pedigree and unusually fast capital formation, but not yet a mature commercial product, named customers, or disclosed financial operating metrics.
  foundedDate: '2026-03-01'
  founders:
    - name: Jerry Tworek
      role: CEO & Co-Founder
      background: Former OpenAI VP of Research who led reasoning-model and post-training work before leaving in early 2026 to found Core Automation.
      claimRefs: [CO005, CO006, CO007]
    - name: Mark Saroufim
      role: Co-Founder
      background: PyTorch and GPU MODE systems engineer whose public work centers on ML systems, kernels, and infrastructure optimization.
