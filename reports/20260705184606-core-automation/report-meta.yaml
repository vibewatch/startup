  foundingLocation: San Francisco, California, USA
  headquarters: San Francisco, California, USA
  productSummary: Core Automation is building a lab-first AI system that aims to automate research and systems work, reportedly including a continual-learning model direction called Ceres designed to update in production with less forgetting and less training data than standard large-model workflows.
  customerFocus: Frontier AI labs, enterprise AI-platform teams, and design-partner organizations with technically complex research, engineering, and model-lifecycle workflows.
