callouts:
  - calloutType: risk
    title: "Manus's Ownership Status Is Itself Disputed"
    body: >-
      Manus's own website states "Manus is now part of Meta," yet China's NDRC ordered the acquisition
      unwound in April 2026 and Meta had begun an operational unwind (data firewalls, access revocation,
      internal-use prohibition) by June 2026 while Manus's founders raised roughly $1 billion to buy the
      company back. Diligence on any "enterprise agent" competitor should treat Chinese-origin ownership
      claims as unstable until independently reconfirmed.
    claimRefs: [CP025, CP026, CP027]
  - calloutType: insight
    title: "Two Well-Funded Teams Are Already Testing Core Automation's Exact Thesis"
    body: >-
      Adaption Labs' "gradient-free" continual learning and AMI Labs' JEPA-based world models are both
      independently funded, technically adjacent bets to Core Automation's continual-learning thesis,
      meaning the underlying idea -- not just the execution -- is already being contested by teams with
      disclosed capital and, in AMI Labs' case, a substantially larger round.
    claimRefs: [CP037, CP038, CP005, CP006]
  - calloutType: assumption
    title: "Incumbent Research Automation Is Already in Production, Not Hypothetical"
    body: >-
      Treating "automated AI research" as Core Automation's exclusive differentiator assumes incumbents are
      not already doing it. Google DeepMind's Gemini Deep Think research agent contradicts that assumption:
      it already generates and verifies research-level mathematics and science results with peer-reviewed
      outputs, which should be a due-diligence starting point rather than an afterthought.
    claimRefs: [CP008, CP009, CP010]
