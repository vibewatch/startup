slug: core-automation
runDate: "2026-07-05"
company:
  name: Core Automation
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Core Automation is a San Francisco-based AI research lab founded by
    ex-OpenAI VP of Research Jerry Tworek in early 2026, pursuing
    post-transformer, continual-learning research under a "Ceres" model
    concept while reporting a rapid valuation climb from $1B to a targeted
    $4B in under a quarter. Public disclosure is thin: no product, pricing,
    board, or verified investor list exists, and several financial and
    team-identity details remain uncorroborated by top-tier wire services.
sections:
  - id: company-identity
    title: Identity, Product Thesis & Company Stage
    body: >-
      Core Automation is a private, pre-revenue artificial-intelligence
      research lab headquartered in San Francisco, California. Its official
      website and X account describe the company's mission as building "the
      world's most automated AI lab," with an explicit bet that the next
      step change in AI capability will come from new learning algorithms
      that supersede large-scale pretraining and reinforcement learning,
      plus architectures designed to scale better than transformers, rather
      than from simply training bigger models on more data. The company's
      flagship research direction, reported in press coverage as "Ceres,"
      targets continual learning in production with roughly 100x less
      training data than current frontier models, though this remains an
      unproven, pre-product research bet rather than a shipped capability.
      As of the run date, Core Automation's own site exposes only a
      homepage, a blog, a broken team page, and contact/careers links -- no
      product, pricing, or signup surface -- consistent with third-party
      reporting (Sacra) that the company has no public API, pricing page,
      or commercial product. Public coverage places its founding in March
      2026, though at least one account describes fundraising activity
      beginning "shortly after its founding in late January," an unresolved
      discrepancy discussed further in the milestone chronology below. The
      company's stage is best described as private and pre-revenue; no
      formally named funding-round label (e.g., "Series A") has been
      publicly disclosed.
    claimRefs: [CO001, CO002, CO003, CO004, CO029, CO030, CO032, CO041]
    figureRefs: [FO002]
  - id: leadership-team
    title: Founders, Leadership & Team
    body: >-
      Jerry Tworek, Core Automation's CEO and co-founder, spent nearly seven
      years at OpenAI, joining in 2019 when the company had roughly 30
      employees and rising to vice president of research. He led
      development of the o1 and o3 reasoning models, contributed to GPT-4's
      post-training and the 2025 GPT-5 deployment, and worked on the Codex
      code-generation line and early reinforcement learning for robots. He
      privately told OpenAI colleagues on January 5, 2026 that he intended
      to leave, and his departure became public days later amid a broader
      wave of senior OpenAI exits; he said he was leaving to pursue research
      "hard to do" inside OpenAI. Mark Saroufim, a systems engineer known
      for PyTorch and GPU MODE community work, is publicly identified as a
      co-founder and authored the company's first detailed technical blog
      post. Several additional researchers -- Rohan Anil and Anmol Gulati
      (both ex-Google DeepMind, with Anil also ex-Anthropic), Joanne Jang
      (former OpenAI general manager), Ehsan Amid and Avery Lamp
      (ex-DeepMind), Julia Villagra (former OpenAI head of people), and Sai
      Surya Duvvuri (former Google/Meta research intern) -- are named across
      company and third-party sources as joining the founding team. However,
      several of these individuals' public X handles returned zero posts or
      were private/unavailable when checked, and no board of directors or
      governance structure has been publicly disclosed, leaving material
      key-person and governance questions open.
    claimRefs: [CO005, CO006, CO007, CO008, CO009, CO011, CO012, CO013, CO014, CO015, CO016, CO017, CO019, CO020]
    tableRefs: [TO002]
  - id: funding-investors
    title: Funding, Valuation & Investors
    body: >-
      Core Automation's reported capitalization history compresses an
      unusually rapid valuation climb into a few months. Analyst-data
      provider Sacra reports the company raised $100 million in an initial
      round at approximately a $1 billion valuation, with participation from
      Nvidia, Spark Capital, and Accel and no publicly disclosed lead
      investor. By early May 2026, The Information -- relayed by Techmeme,
      Intellectia, and SiliconReport -- reported Core Automation was seeking
      $300 million to $500 million in new capital at a target valuation of
      roughly $4 billion, a fourfold step-up in well under a quarter. AI
      CERTs' coverage of the same raise explicitly noted that Bloomberg and
      Reuters had not corroborated the reported figures, and Sacra similarly
      could not identify a lead investor for the first round. No secondary
      share sale or debt/credit financing has been reported. For context,
      the reported pace is broadly consistent with (though on the smaller
      end of) other 2025-2026 "neo-lab" megaseeds: Thinking Machines Lab
      closed a $2 billion seed at a $10 billion valuation in mid-2025,
      Humans& announced a $480 million seed at a $4.48 billion valuation in
      January 2026, and Safe Superintelligence raised $1 billion in 2024.
      Because Nvidia is both a reported investor and the dominant GPU
      supplier Core Automation would depend on for compute, its
      participation also raises a related-party question worth separate
      diligence attention.
    claimRefs: [CO021, CO022, CO023, CO024, CO025, CO026, CO027, CO039]
    tableRefs: [TO003]
  - id: milestones-chronology
    title: Milestones & Chronology
    body: >-
      The public chronology begins well before Core Automation existed:
      Tworek's OpenAI tenure from 2019 through his January 2026 departure
      supplies the founder track record the company's fundraising narrative
      leans on. Reporting places Core Automation's formal founding in March
      2026, though BigGo's April 24, 2026 account states the company had
      "shortly after its founding in late January" already begun raising
      capital -- an unresolved conflict in the public record. The company's
      first public moment was an X post on April 21, 2026 declaring it was
      "building the most automated AI lab in the world"; multiple senior
      researchers confirmed joining within a day of that post, in what
      coverage characterized as a coordinated "nerdsniping" of talent from
      Anthropic, Google DeepMind, and OpenAI. Financing milestones followed
      quickly: a $100 million initial round at a $1 billion valuation, then
      a reported May 7-8, 2026 push to raise $300-500 million at a $4
      billion target. The company's first substantive public technical
      disclosure came on May 28, 2026, when co-founder Mark Saroufim
      published a blog post on systems-code automation for AI research --
      the clearest evidence to date of actual research output beyond
      funding and hiring news. As of that point, still no commercial
      product, pricing, or customer had been disclosed.
    claimRefs: [CO003, CO004, CO006, CO008, CO009, CO010, CO012, CO013, CO021, CO022, CO029, CO034]
    tableRefs: [TO004]
    figureRefs: [FO001]
  - id: snapshot-diligence
    title: Snapshot Metrics & Diligence Outlook
    body: >-
      Pulling the identity, team, funding, and milestone evidence together,
      Core Automation presents as a well-pedigreed but very early and
      thinly disclosed research bet. Confirmed facts are narrow: a $100
      million raise at a $1 billion valuation, a San Francisco headquarters,
      roughly a dozen public team members, and zero disclosed customers or
      revenue. Everything else -- the $4 billion target valuation, investor
      identities, exact headcount, board composition, and the
      January-versus-March founding date -- rests on reporting that is
      itself uncorroborated by top-tier wire services or is drawn from a
      single proprietary data source. That combination of high reported
      valuation, minimal public product evidence, and concentrated
      key-person dependence on Jerry Tworek is the central diligence tension
      for this chapter: later chapters on market sizing, competition, and
      financials should treat every cover metric here as provisional and
      confirm it directly with the company or its investors rather than
      through secondary press coverage alone.
    claimRefs: [CO020, CO021, CO022, CO023, CO028, CO029, CO043]
    tableRefs: [TO001]
    figureRefs: [FO003]
