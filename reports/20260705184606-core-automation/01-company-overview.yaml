callouts:
  - calloutType: risk
    title: Reported valuation and investor details are largely uncorroborated
    body: >-
      The reported $1B-to-$4B valuation climb and the initial round's
      investor list (Nvidia, Spark Capital, Accel) rest on a single
      analyst-data source (Sacra) and The Information as relayed by
      secondary outlets; AI CERTs explicitly states Bloomberg and Reuters
      had not corroborated the figures. Treat every financial figure in this
      chapter as provisional pending direct confirmation.
    claimRefs: [CO023, CO024, CO025]
  - calloutType: strength
    title: Founding team carries unusually strong frontier-lab pedigree
    body: >-
      Jerry Tworek's direct authorship of OpenAI's o1/o3 reasoning-model
      program, paired with reported hires from Anthropic and Google
      DeepMind, gives Core Automation a founding-team credibility signal
      that is rare at the pre-product stage and is the primary basis for
      its fundraising narrative.
    claimRefs: [CO006, CO012, CO013, CO014]
  - calloutType: assumption
    title: Team roster should be treated as partial and unverified
    body: >-
      Several reported team members' public X handles returned zero posts
      or were private/unavailable, and the company's own team page
      returned a not-found error; the leadership table should be read as a
      partial, press-sourced roster rather than a company-confirmed
      employee list.
    claimRefs: [CO016, CO017, CO019]
