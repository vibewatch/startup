artifact: financials
slug: core-automation
runDate: '2026-07-05'
company:
  name: Core Automation
chapter:
  number: 4
  title: Financials
  summary: Core Automation discloses almost no financial data beyond press-reported funding headlines -- a $100
    million initial round at a roughly $1 billion valuation and an in-talks $300-500 million follow-on targeting
    roughly $4 billion -- while a California incorporation filing and a zero-result SEC EDGAR search confirm the
    company exists on the public record but has filed no Form D or financial statement. Because the company is
    pre-revenue and pre-product, this chapter benchmarks likely cost drivers (frontier-research talent and compute)
    and capital-intensity norms against comparable neolabs rather than asserting company-specific burn, margin, or
    runway figures that no public source supports.
sections:
- id: confirmed-disclosure
  title: What Is Actually on the Record -- Incorporation and Reported Funding
  body: 'The only independently verifiable government record for Core Automation is a California Secretary of
    State filing showing "Core Automation (de), Inc." as a Delaware-formed stock corporation, officially filed on
    March 24, 2026 under document number B20260125942, with Jerry (Jaroslaw) Tworek listed as registered agent.
    That filing discloses entity type, filing date, and registered-agent address, but no financial figures --
    no authorized share count, no capital raised, no use-of-proceeds statement. A SEC EDGAR full-text search
    restricted to Form D filings between January 1 and July 5, 2026 returned zero results for "Core Automation,"
    meaning no public notice of an exempt securities offering has been filed as of the run date, despite multiple
    outlets reporting a roughly $100 million initial raise at a $1 billion valuation and a subsequent push to raise
    $300-500 million at a target valuation near $4 billion. Reported (but not independently confirmed) investors
    in the initial round include Nvidia, Spark Capital, and Accel. Because Core Automation has not filed for an
    IPO or issued public debt, it is under no obligation to release audited financials, so every dollar figure in
    this chapter traces back to press reporting sourced to unnamed parties via The Information rather than to a
    filed document -- a materially weaker evidentiary basis than a prospectus or 10-K would provide.'
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  - CI005
  - CI006
  - CI007
  tableRefs:
  - TI004
- id: no-revenue-no-product
  title: 'No Revenue, No Product: The Commercial Disclosure Gap'
  body: 'Analyst firm Sacra reports that as of May 2026, Core Automation has no public API, pricing page, signup
    flow, or commercial product, and characterizes the company as "pre-revenue and pre-commercial," with a cost
    structure dominated by frontier AI research talent and compute and no offsetting customer revenue. Sacra
    describes the company''s only current "product" as the automation of its own internal research process --
    the lab is both builder and first customer of its own automation stack, not a vendor selling to outside
    buyers. Core Automation''s own homepage reinforces this: it frames the mission as building "the world''s most
    automated AI lab" without referencing pricing, a product catalog, or revenue anywhere in the fetchable text.
    A technical blog post, "When AI Starts Writing Systems Code," is rendered client-side and returns almost no
    static text on fetch, further limiting independent verification of any business detail beyond the headline.
    The company''s website also returns a 404 for a /careers path, so there is no visible public job-listing
    surface that would signal finance, legal, sales, or operations hiring activity alongside the reported research
    recruiting. Sacra identifies plausible future monetization paths -- B2B model or API access, enterprise
    subscriptions for domain-specific automation, and usage-based pricing tied to autonomous tasks or compute --
    but frames all of them as speculative and unconfirmed by the company itself. No source reviewed identifies a
    named paying customer, signed contract, or disclosed revenue figure of any kind.'
  claimRefs:
  - CI008
  - CI009
  - CI010
  - CI011
  - CI012
  - CI013
  - CI014
  - CI015
  tableRefs:
  - TI001
  - TI002
  figureRefs:
  - FI001
- id: cost-structure-inferred
  title: 'Cost Structure Is Inferred, Not Disclosed: Talent and Compute as the Likely Drivers'
  body: 'Because Core Automation discloses no headcount, payroll, or compute-spend figures, this chapter benchmarks
    likely cost drivers against comparable frontier labs rather than inventing company-specific numbers. Industry
    compensation coverage puts senior frontier AI research-engineer total pay (base, bonus, and equity) at roughly
    $500,000 to $1.5 million per year in 2026, with reported outlier packages for elite researchers reaching as
    high as $300 million over four years and signing bonuses as high as $100 million in a single year at the
    largest labs -- an extreme illustration of how expensive frontier-research talent has become. On the compute
    side, OpenAI reported approximately $3.7 billion in Q1 2026 operating cash burn alongside roughly $32 billion
    in planned 2026 training and compute spend, while Anthropic was reported to have reached about $30 billion in
    annualized run-rate revenue by April 2026 while still spending on the order of $6-10 billion per year on
    compute and burning roughly $80 million per month in cash, over 60% of it on cloud infrastructure. Deloitte
    reports that per-unit AI inference costs fell roughly 280-fold over two years even as total enterprise AI
    spending kept rising, because usage growth has outpaced those efficiency gains industry-wide -- a dynamic that
    would plausibly apply to any compute-intensive research lab, Core Automation included. Given a talent- and
    compute-heavy, pre-revenue operating model similar to these peers, Core Automation''s own burn is plausibly in
    a comparable directional range, though no company-specific figure has been disclosed, and no source reviewed
    states Core Automation''s current headcount or an aggregate payroll run-rate.'
  claimRefs:
  - CI016
  - CI017
  - CI018
  - CI019
  - CI020
  - CI021
  - CI022
  - CI023
  - CI024
  tableRefs:
  - TI003
  figureRefs:
  - FI002
- id: capital-intensity-neolab-comps
  title: Capital Intensity of the Neolab Category and Runway Sensitivity
  body: 'Core Automation''s reported valuation trajectory does not look unusual once placed next to comparable
    2024-2026 "neolab" megaseed rounds. Thinking Machines Lab, founded by former OpenAI CTO Mira Murati, closed a
    $2 billion seed round in July 2025 at a $12 billion valuation before shipping any commercial product. Safe
    Superintelligence, co-founded by former OpenAI chief scientist Ilya Sutskever, raised a $1 billion seed in
    September 2024 at roughly a $5 billion valuation. Humans&, founded in September 2025 by former Anthropic, xAI,
    and Google researchers, raised a $480 million seed at a $4.48 billion valuation in January 2026, three months
    after founding. Global startup funding hit a record roughly $300 billion across about 6,000 startups in Q1
    2026, driven heavily by outsized AI-lab rounds. Against that backdrop, Core Automation''s reported $100
    million-to-$1 billion, then $300-500 million-to-$4 billion progression sits within -- and in absolute dollar
    terms below -- the range its peers have already established, suggesting that billion-dollar-plus pre-product
    valuations are now a category norm rather than a Core-Automation-specific outlier. Sacra frames the company''s
    central business-model risk explicitly in runway terms: whether its internal automation "flywheel" can compound
    fast enough to produce a distributable product before its raised capital runs out. That framing matters for
    diligence because no source discloses Core Automation''s cash on hand, monthly burn, or a runway-in-months
    figure, and no source discloses a use-of-funds breakdown across compute, hiring, and facilities for either the
    confirmed or the targeted round.'
  claimRefs:
  - CI025
  - CI026
  - CI027
  - CI028
  - CI029
  - CI030
  figureRefs:
  - FI003
- id: financing-risk-adverse
  title: 'Financing-Market Risk: Adverse Evidence on AI Funding Exuberance and Compute Scarcity'
  body: 'Several independent, cautionary signals bear directly on whether Core Automation''s capital-raising
    environment stays hospitable. Sequoia Capital partner David Cahn''s AI infrastructure revenue-gap framework
    escalated from an estimated $200 billion in required annual AI revenue in 2023-2024 to roughly $600 billion by
    2026, as hyperscaler AI capital expenditure grew faster than realized AI revenue -- a gap commentators
    increasingly compare to the vendor-financed telecom capacity boom that preceded a sharp correction when real
    demand fell short. Separately, an MIT NANDA project report, "The GenAI Divide: State of AI in Business 2025,"
    based on 300 AI deployments and 150 executive interviews, found that 95% of enterprise generative AI pilots
    fail to deliver measurable financial ROI -- a caution for any research-automation company whose eventual
    commercialization depends on enterprises finding measurable value. On the supply side, GPU rental prices for
    Nvidia''s Blackwell chips reportedly rose to $4.08 per hour in April 2026, up 48% in 60 days, amid a compute
    shortage reported to be causing outages at Anthropic and forcing OpenAI to cancel some product plans, with
    Bank of America projecting demand will outstrip supply through 2029. Nvidia itself -- separately reported as
    a participant in Core Automation''s initial round -- committed more than $40 billion in AI equity investments
    in 2026, including a roughly $30 billion stake in OpenAI, alongside compute-credit and revenue-sharing deals
    that Goldman Sachs analysts flagged as a "circular revenue" risk that can overstate genuine end-user demand.
    None of this is evidence that Core Automation itself is party to a circular financing arrangement, but it is a
    plausible channel through which a shift in Nvidia''s AI equity strategy or in compute pricing could affect the
    company''s capital access or cost base.'
  claimRefs:
  - CI031
  - CI032
  - CI033
  - CI034
  - CI035
  - CI036
  - CI037
  - CI038
  - CI039
  tableRefs:
  - TI005
  figureRefs:
  - FI004
- id: financial-verdict
  title: 'Financial Verdict: What Cannot Be Underwritten From Public Evidence'
  body: 'Pulling the disclosure gaps and benchmark context together, no independently verifiable figure exists for
    Core Automation''s revenue, annual recurring revenue, gross margin, monthly burn, cash on hand, or runway as of
    the run date. The only quantified capital facts on the public record -- a $100 million initial raise and an
    in-talks $300-500 million follow-on -- are press-reported figures traced to The Information via unnamed
    parties, not to a filed document; the absence of any SEC Form D filing for a reported $100 million-plus raise
    is itself informative, implying either that the offering has not yet triggered a public notice filing, used a
    different exemption pathway, or that reported deal terms remain preliminary. Given a capital-intensive,
    revenue-free business model in a category where peers already deploy $1 billion or more before shipping a
    product, an outside investor cannot underwrite Core Automation''s financial profile from public evidence
    alone. Materially improving underwriting confidence would require management-provided data: a signed cap table
    and round term sheet, GPU/cloud compute contracts and committed spend, current headcount and payroll run-rate
    by function, and disclosure of any convertible note, SAFE, or debt instrument outstanding ahead of the reported
    $4 billion round. No source reviewed discloses Core Automation''s cap table, ownership percentages, board
    composition, or debt/convertible instruments, so governance and dilution risk remain as unquantified as the
    burn rate itself.'
  claimRefs:
  - CI040
  - CI041
  - CI042
  - CI043
  - CI044
  - CI045
