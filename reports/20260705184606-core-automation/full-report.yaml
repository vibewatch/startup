            body: >-
              Analyst firm Sacra reports that as of May 2026, Core Automation has no public API, pricing page, signup
              flow, or commercial product, and characterizes the company as "pre-revenue and pre-commercial," with a
              cost structure dominated by frontier AI research talent and compute and no offsetting customer revenue.
              Sacra describes the company's only current "product" as the automation of its own internal research
