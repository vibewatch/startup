      - CV042
      - CV040
      - CV037
      - CV038
  - id: TV004
    title: Comparable valuation table
    columns:
      - Comparable
      - Metric
      - Valuation / status
      - Relevance to Core Automation
      - Limitation
    enumerationScope:
      coverage: partial
      basis: >-
        Non-exhaustive list of 2024-2026 frontier-adjacent AI labs and neolabs with disclosed or credibly reported
        funding and valuation data, drawn from independent press and analyst coverage reviewed through the 2026-07-05
        run date.
    rows:
      - - Core Automation
        - Reported $100M seed; $300-500M follow-on discussions
        - ~$1B seed valuation reported; ~$4B follow-on target reported, neither SEC-confirmed
        - Subject company
        - No independent confirmation of either figure; no revenue or product basis
      - - Safe Superintelligence (SSI)
        - ~$3B total raised
        - $32B (2026), up from $5B seed (2024)
        - 'Closest analog: no public product, valuation driven by founder pedigree and compute partnerships'
        - ~6x markup in under a year with no shipped product; recent co-founder departure
      - - Thinking Machines Lab
        - Seed round
        - $12B (2025 seed)
        - Founder-pedigree neolab comparable; later deepened Google ties
        - Backed by a since-expanded Google strategic deal not yet disclosed for Core Automation
      - - AMI Labs
        - $1.03B raised
        - Not disclosed beyond raise size
        - Direct thesis-adjacent competitor (world models)
        - Valuation multiple not public
      - - World Labs
        - $230M seed (2024) then $1B round (Feb 2026)
        - ~$1B (2024) rising to reported ~$5B target (2026)
        - 'Comparable trajectory: quick multi-billion re-rate within ~18 months'
        - Has a shipped commercial product (Marble) and named strategic investor, unlike Core Automation
      - - Periodic Labs
        - $300M seed (Sept 2025) then $500M talks (May 2026)
        - $1.3B rising to reported $7.5B target
        - Comparable AI-for-science neolab with ~6x markup in 8 months
        - Deal was still in talks, not closed, as of the source date
      - - Mistral AI
        - ~$4B raised to date
        - €11.7B (Sept 2025) rising to reported ~€20B target (2026)
        - Later-stage comparable showing continued re-rating for a lab with shipped products and revenue
        - Has shipped products and revenue; not a clean pre-product comparable
      - - xAI
        - $20B Series E (Jan 2026)
        - ~$230-250B
        - Illustrates how far a frontier lab with disclosed usage (600M MAU) can scale versus a pre-disclosure neolab
