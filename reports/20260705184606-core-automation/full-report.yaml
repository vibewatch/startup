            body: >-
              Pulling the identity, team, funding, and milestone evidence together, Core Automation presents as a
              well-pedigreed but very early and thinly disclosed research bet. Confirmed facts are narrow: a $100
              million raise at a $1 billion valuation, a San Francisco headquarters, roughly a dozen public team
