      - number: '4.5'
        title: 'Financing-Market Risk: Adverse Evidence on AI Funding Exuberance and Compute Scarcity'
        blocks:
          - type: paragraph
            body: >-
              Several independent, cautionary signals bear directly on whether Core Automation's capital-raising
              environment stays hospitable. Sequoia Capital partner David Cahn's AI infrastructure revenue-gap framework
              escalated from an estimated $200 billion in required annual AI revenue in 2023-2024 to roughly $600
              billion by 2026, as hyperscaler AI capital expenditure grew faster than realized AI revenue -- a gap
              commentators increasingly compare to the vendor-financed telecom capacity boom that preceded a sharp
              correction when real demand fell short. Separately, an MIT NANDA project report, "The GenAI Divide: State
              of AI in Business 2025," based on 300 AI deployments and 150 executive interviews, found that 95% of
              enterprise generative AI pilots fail to deliver measurable financial ROI -- a caution for any
              research-automation company whose eventual commercialization depends on enterprises finding measurable
              value. On the supply side, GPU rental prices for Nvidia's Blackwell chips reportedly rose to $4.08 per
              hour in April 2026, up 48% in 60 days, amid a compute shortage reported to be causing outages at Anthropic
              and forcing OpenAI to cancel some product plans, with Bank of America projecting demand will outstrip
              supply through 2029. Nvidia itself -- separately reported as a participant in Core Automation's initial
              round -- committed more than $40 billion in AI equity investments in 2026, including a roughly $30 billion
              stake in OpenAI, alongside compute-credit and revenue-sharing deals that Goldman Sachs analysts flagged as
              a "circular revenue" risk that can overstate genuine end-user demand. None of this is evidence that Core
              Automation itself is party to a circular financing arrangement, but it is a plausible channel through
              which a shift in Nvidia's AI equity strategy or in compute pricing could affect the company's capital
              access or cost base.
