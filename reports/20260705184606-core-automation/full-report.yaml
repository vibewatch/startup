      - number: '2.5'
        title: Why Continual Learning and Post-Transformer Research Could Matter Economically
        blocks:
          - type: paragraph
            body: >-
              Core Automation's technical bet is that continual learning -- keeping a model current without retraining
              from scratch -- and architectures that scale better than Transformers could eventually cut the
              training-data and compute cost of frontier AI, directly offsetting the GPU scarcity documented elsewhere
              in this chapter (CM044). The research direction is real and active, not fringe: Google Research's "Nested
              Learning" paradigm and its "Hope" architecture reframe models as nested, self-modifying optimization
              problems designed to retain long-horizon memory (CM010, CM011), and Mamba-3, a 2026 state-space-model
              architecture accepted as an ICLR oral, claims to match or beat Transformer baselines on perplexity at
              roughly half the inference cost (CM012, CM013). None of this constitutes a validated, frontier-scale
              commercial replacement for Transformer-based models as of mid-2026 (CM014), and no source reviewed
              publishes a dollar-denominated market size for this research category at all (CM009, CM045). Proof that
              automated research itself can work is easier to find than proof that continual learning specifically
              works: Sakana AI's AI Scientist produced a paper published in Nature describing an agent that formulates
              hypotheses, runs experiments, and authors manuscripts (CM015), an earlier version passed genuine peer
              review (CM016), and the code is open-sourced (CM017). Anthropic's Claude Science pursues a similar
              workflow-automation thesis for scientists without shipping a new model (CM018), and Anthropic separately
              reports more than 80% of its own production code is now Claude-authored, an 8x productivity jump versus
              its 2021-2025 baseline (CM019) -- read cautiously, since it is a self-reported, unaudited figure from the
              company itself (CM020). Taken together, the evidence supports "automated research is plausible" far more
              strongly than it supports "Core Automation's specific continual-learning approach is proven."
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
              - CM017
              - CM018
              - CM019
              - CM020
              - CM044
              - CM045
      - number: '2.6'
        title: Adverse Evidence and Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              Enterprise adoption headlines mask a wide adoption-to-impact gap that any market-sizing exercise for Core
              Automation should discount against. Stanford's 2026 AI Index reports 88% organizational AI adoption and
              generative AI usage reaching 53% within three years -- faster diffusion than the PC or the internet
              (CM022) -- yet Deloitte finds only 23% of organizations use agentic AI at even a moderate level and just
              21% have a mature governance model for it (CM023). Axis Intelligence's cross-referenced "Deployment Gap
              Index" quantifies the same pattern differently: 93% of IT leaders intend to deploy autonomous agents
              within two years, but only 23% have scaled deployment in even one function, a 70-percentage-point gap
              between stated intent and production reality (CM024). The most-cited cautionary data point is MIT's 2025
              "GenAI Divide" study of 300-plus enterprise deployments, which found 95% of organizations captured zero
              measurable P&L return from generative AI pilots, with failure attributed to shallow, siloed integration
              rather than model quality or regulation (CM026, CM027) -- a caution that applies with at least as much
              force to a pre-product research bet as it does to shipped generative-AI tools. At the macro level,
              investor Michael Burry has publicly likened the 2025-2026 AI investment cycle to the 1999-2000 dot-com
              bubble, arguing that hyperscaler depreciation accounting understates the true cost of AI infrastructure
              spend (CM034, CM035). None of this proves Core Automation's specific thesis will fail, but it means the
              demand environment it is betting on is simultaneously the most capital-intensive and the most
              evaluation-skeptical the AI industry has produced to date.
            claimRefs:
              - CM022
              - CM023
              - CM024
              - CM026
              - CM027
              - CM034
              - CM035
