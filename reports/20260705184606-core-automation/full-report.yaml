      - number: '8.2'
        title: Recommendation, Confidence, Risk, and Valuation Stance
        blocks:
          - type: paragraph
            body: >-
              This chapter's recommendation is track, not buy. The reasoning chain runs from Core Automation's
              pre-product, pre-revenue status and its unconfirmed financing record, through the concentrated key-person
              and market-timing risk documented across its comparable set, to a valuation stance of stretched to
              expensive (CV001, CV043). Confidence in this call is medium: four independent outlets corroborate the
              reported seed and follow-on figures, but none of that reporting has been confirmed by a regulatory filing,
              and a full-text EDGAR search returned zero Form D results for the company through the run date (CV002,
              CV009). The risk rating is high. Safe Superintelligence, the closest public comparable for a pre-product
              frontier lab, saw its own co-founder depart for a rival lab after reported acquisition interest,
              illustrating that even the most richly valued pre-product AI labs are exposed to key-person risk that a
              small, pedigree-concentrated team like Core Automation's would also carry (CV003, CV028). The valuation
              stance is stretched to expensive because the reported climb from roughly $1 billion to roughly $4 billion
              within weeks has no disclosed product, customer, or revenue anchor, even though a similar pattern of rapid
              re-rating recurs across at least five comparable neolabs (CV004, CV026, CV027). Scored across market,
              proof, moat, economics, risk, valuation, and evidence quality, Core Automation rates strongest on market
              size and team pedigree and weakest on proof and economics disclosure, an imbalance consistent with a track
              rather than buy call (CV047). The practical implication is to withhold new capital until the company
              discloses product, revenue, or filing evidence sufficient to test the reported price (CV005).
