  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market Boundary: What Core Automation Is Actually Selling Into'
        blocks:
          - type: paragraph
            body: >-
              Core Automation is pre-product, so this chapter defines the market it is aiming at rather than a market it
              currently serves. Four categories anchor that target: frontier-AI-lab research-automation tooling (the
              closest analog to the company's own "automate the AI lab" framing), enterprise knowledge-work and
              reporting automation, continual-learning and post-transformer model research, and AI-for-science discovery
              automation. None of the analyst firms reviewed for this chapter track these four categories as a single
              line item; each is measured, if at all, inside a broader "agentic AI," "AI software," or "robotic process
              automation" bucket (Table TM001). Two further categories sit at arm's length rather than inside the
              boundary: traditional rule-based RPA, which automates repetitive tasks rather than open-ended cognitive
              work, and industrial/physical AI automation, which the World Economic Forum and BCG describe as a parallel
              "autonomous work" thesis built on hardware-embodied robotics rather than software-only research tooling
              (CM037, CM038, CM039). Status-quo substitutes for Core Automation's stated bet are therefore not a single
              competitor category but the current combination of human research engineers, existing agentic
              coding/research assistants from incumbents, and conventional RPA -- all of which already capture
              enterprise automation budget today. Because Core Automation discloses no product, pricing, or customer,
              this section treats the four in-boundary categories as directional framing for later chapters, not as a
              confirmed addressable market the company has already validated.
            claimRefs:
              - CM037
              - CM038
              - CM039
          - type: table
            tableRef: TM001
            claimRefs:
              - CM037
              - CM038
              - CM039
      - number: '2.2'
        title: 'Sizing the Adjacent Market: Multiple Lenses, No Single TAM'
        blocks:
          - type: paragraph
            body: >-
              No publisher isolates a dollar figure for frontier-lab research automation or continual-learning tooling
              specifically, so this section stacks the adjacent lenses that do exist rather than asserting one number.
              At the broadest layer, Gartner puts total 2026 worldwide AI spending at $2.59 trillion, up 47% year over
              year (CM002); a narrower slice it labels "agentic AI" capability spend reaches $201.9 billion in 2026
              (CM003) -- about 8% of the total. Narrower still, four analyst firms (Fortune Business Insights,
              Precedence Research, MarketsandMarkets, and Deloitte's TMT Predictions) size the standalone AI-agent
              software market at $7.0-8.5 billion in 2025-2026, but their multi-year forecasts diverge by nearly 30x by
              their respective end years, and Gartner's broad and narrow agentic-AI figures alone differ by roughly 25x
              at the same point in time (CM004, CM048). The same measurement problem shows up one layer over: Grand View
              Research prices the global RPA/knowledge-automation market at $4.68 billion in 2025 growing to $35.84
              billion by 2033, while Precedence Research prices the same nominal category at $28.31 billion in 2025
              growing to $247.34 billion by 2035 -- a roughly six-fold gap in the base year alone (CM006, CM007). IDC's
              alternative framing sidesteps dollar sizing altogether, forecasting that 45% of organizations will
              orchestrate AI agents "at scale" by 2030, an adoption metric rather than a market size (CM008). Gartner's
              own forecast moved by roughly $500 billion in eight months (CM047), underscoring how much these headline
              numbers still move. Figure FM001 stacks these lenses from broadest to narrowest; Figure FM002 shows how
              far the four standalone-market forecasts diverge even while describing what is nominally "the same"
              category.
