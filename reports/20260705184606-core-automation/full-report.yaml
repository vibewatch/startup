        title: Severity-ranked risk overview
        blocks:
          - type: paragraph
            body: >-
              Core Automation's central risk is not a single legal event or technology flaw; it is sequencing. Public
              evidence still describes a lab-first research effort that wants to automate its own work, not a commercial
              platform with customers, trust collateral, and a product surface that outside buyers can test. At the same
              time, third-party coverage already frames the company against frontier-lab-scale financing expectations
              and valuation narratives. That combination makes the absence of product, customer, and disclosure proof
              more consequential than it would be for an ordinary seed startup. The public risk picture therefore
              clusters around three linked questions: can the team turn a research thesis into a buyer-clearing product
              before capital expectations run too far ahead, can it publish enough trust and compliance evidence to
              shorten enterprise diligence, and can it defend a differentiated workflow once incumbents and open source
              already offer agent, coding, and infrastructure surfaces at scale. The summary register ranks product
              non-maturity, missing customer proof, financing dependence, and commoditization as the highest residual
              exposures because each one worsens the next if evidence does not improve quickly.
