chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Product Thesis & Company Stage
        blocks:
          - type: paragraph
            body: >-
              Core Automation is a private, pre-revenue artificial-intelligence research lab headquartered in San
              Francisco, California. Its official website and X account describe the company's mission as building "the
              world's most automated AI lab," with an explicit bet that the next step change in AI capability will come
              from new learning algorithms that supersede large-scale pretraining and reinforcement learning, plus
              architectures designed to scale better than transformers, rather than from simply training bigger models
              on more data. The company's flagship research direction, reported in press coverage as "Ceres," targets
              continual learning in production with roughly 100x less training data than current frontier models, though
              this remains an unproven, pre-product research bet rather than a shipped capability. As of the run date,
              Core Automation's own site exposes only a homepage, a blog, a broken team page, and contact/careers links
              -- no product, pricing, or signup surface -- consistent with third-party reporting (Sacra) that the
              company has no public API, pricing page, or commercial product. Public coverage places its founding in
              March 2026, though at least one account describes fundraising activity beginning "shortly after its
              founding in late January," an unresolved discrepancy discussed further in the milestone chronology below.
              The company's stage is best described as private and pre-revenue; no formally named funding-round label
              (e.g., "Series A") has been publicly disclosed.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO029
              - CO030
              - CO032
              - CO041
