              Because Core Automation discloses no headcount, payroll, or compute-spend figures, this chapter benchmarks
              likely cost drivers against comparable frontier labs rather than inventing company-specific numbers.
              Industry compensation coverage puts senior frontier AI research-engineer total pay (base, bonus, and
              equity) at roughly $500,000 to $1.5 million per year in 2026, with reported outlier packages for elite
              researchers reaching as high as $300 million over four years and signing bonuses as high as $100 million
              in a single year at the largest labs -- an extreme illustration of how expensive frontier-research talent
              has become. On the compute side, OpenAI reported approximately $3.7 billion in Q1 2026 operating cash burn
              alongside roughly $32 billion in planned 2026 training and compute spend, while Anthropic was reported to
              have reached about $30 billion in annualized run-rate revenue by April 2026 while still spending on the
              order of $6-10 billion per year on compute and burning roughly $80 million per month in cash, over 60% of
              it on cloud infrastructure. Deloitte reports that per-unit AI inference costs fell roughly 280-fold over
              two years even as total enterprise AI spending kept rising, because usage growth has outpaced those
              efficiency gains industry-wide -- a dynamic that would plausibly apply to any compute-intensive research
              lab, Core Automation included. Given a talent- and compute-heavy, pre-revenue operating model similar to
              these peers, Core Automation's own burn is plausibly in a comparable directional range, though no
              company-specific figure has been disclosed, and no source reviewed states Core Automation's current
