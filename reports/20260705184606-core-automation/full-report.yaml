      - number: '8.5'
        title: Comparable Valuation Landscape
        blocks:
          - type: paragraph
            body: >-
              The most relevant comparable is Safe Superintelligence, which raised roughly $2 billion in 2025 at a $32
              billion valuation despite having no public-facing product, after an earlier $1 billion raise at a $5
              billion valuation in 2024—a more than six-fold increase in under a year for a team of roughly 20 employees
              (CV012, CV013). Thinking Machines Lab raised its seed at a reported $12 billion valuation and later
              deepened its ties to Google through a new multi-billion-dollar deal, a form of strategic validation Core
              Automation has not disclosed (CV015, CV016). World Labs and Periodic Labs both illustrate how quickly
              pre-product-adjacent labs can re-rate: World Labs moved from a $1 billion seed valuation in 2024 to a
              reported ~$5 billion target by February 2026 after shipping a commercial product, while Periodic Labs
              moved from $1.3 billion to reported $7.5 billion talks in under eight months (CV018, CV019, CV020, CV021).
              Later-stage labs such as Mistral AI and xAI show that re-rating continues even for companies with shipped
              products, disclosed usage, and revenue, which makes them weaker direct comparables for a pre-disclosure
              company like Core Automation (CV022, CV023). Product-layer competitors Hebbia and Glean, by contrast, are
              priced on disclosed profitable revenue or a named enterprise customer base rather than pedigree alone,
              underscoring how much less disclosure Core Automation currently offers (CV024, CV025). Across this set,
              valuations for pre-product frontier-research labs are driven primarily by founder pedigree, compute
              partnerships, and narrative momentum rather than by disclosed metrics, making Core Automation's reported
              markup directionally consistent with its peers without being independently verifiable against them (CV026,
              CV027, CV051, CV049).
            claimRefs:
              - CV012
