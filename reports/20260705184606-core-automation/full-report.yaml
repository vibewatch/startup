      - number: '8.7'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Current call: track, not buy'
            body: >-
              Core Automation is a credible thesis with a strong founding pedigree, but the reported valuation cannot
              yet be tested against any public product, revenue, or regulatory-filing evidence.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV009
              - CV004
          - type: callout
            title: The comparable set already shows key-person risk
            body: >-
              Safe Superintelligence's co-founder departure to a rival lab, only a year after a headline valuation, is a
              documented precedent for the exact key-person risk Core Automation's small, pedigree-driven team carries.
            calloutType: risk
            claimRefs:
              - CV028
