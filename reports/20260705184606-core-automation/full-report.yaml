        title: Milestones & Chronology
        blocks:
          - type: paragraph
            body: >-
              The public chronology begins well before Core Automation existed: Tworek's OpenAI tenure from 2019 through
              his January 2026 departure supplies the founder track record the company's fundraising narrative leans on.
              Reporting places Core Automation's formal founding in March 2026, though BigGo's April 24, 2026 account
              states the company had "shortly after its founding in late January" already begun raising capital -- an
              unresolved conflict in the public record. The company's first public moment was an X post on April 21,
              2026 declaring it was "building the most automated AI lab in the world"; multiple senior researchers
              confirmed joining within a day of that post, in what coverage characterized as a coordinated "nerdsniping"
              of talent from Anthropic, Google DeepMind, and OpenAI. Financing milestones followed quickly: a $100
              million initial round at a $1 billion valuation, then a reported May 7-8, 2026 push to raise $300-500
              million at a $4 billion target. The company's first substantive public technical disclosure came on May
              28, 2026, when co-founder Mark Saroufim published a blog post on systems-code automation for AI research
              -- the clearest evidence to date of actual research output beyond funding and hiring news. As of that
              point, still no commercial product, pricing, or customer had been disclosed.
