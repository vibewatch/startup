      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              Three forces push demand for cognition-heavy automation upward. First, capability is closing the gap with
              human performance fast: agentic systems went from completing about 12% of real-world computer tasks to
              roughly 66% in about 18 months on the OSWorld benchmark, though they still fail roughly one in three
              attempts (CM021). Second, capital is concentrating in exactly this space: AI startups captured 80-81% of
              the roughly $300 billion in global venture funding in the first quarter of 2026 alone (CM028, CM029), and
              Gartner projects 40% of enterprise applications will embed task-specific AI agents by year-end 2026
              (CM025). Third, well-capitalized frontier labs such as Thinking Machines Lab are locking down
              multi-billion-dollar compute deals and gigawatt-scale Nvidia hardware commitments (CM030), signalling that
              serious capital believes some version of Core Automation's automated-research thesis is investable. Three
              forces pull the other way. Trust and governance lag capability: only 21% of organizations report a mature
              governance model for autonomous agents, and Gartner separately expects 40% of agentic AI projects to be
              canceled by the end of 2027 over cost, ROI, and risk-control concerns (CM043). Even where organizations
              experiment, few scale: a November 2025 survey found only 23% scaling agents in one function and under 10%
              scaling across multiple functions (CM036). And compute itself is a bottleneck: H100/H200 lead times of
              36-52 weeks, driven by TSMC packaging and HBM memory constraints, push well-capitalized incumbents toward
              multi-year reserved contracts that a smaller, newer entrant like Core Automation would struggle to match
              (CM032, CM033).
            claimRefs:
              - CM021
              - CM025
              - CM028
              - CM029
              - CM030
              - CM032
              - CM033
              - CM036
              - CM043
