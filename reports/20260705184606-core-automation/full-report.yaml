      - number: '8.3'
        title: Financing Context, Entry Discipline, and Dilution Overhang
        blocks:
          - type: paragraph
            body: >-
              Press reporting describes Core Automation as having raised approximately $100 million in an initial round
              at a valuation near $1 billion within weeks of its 2026 launch, and as being in talks for a $300-500
              million follow-on targeting roughly $4 billion (CV006, CV007). Taken together, these figures imply a
              roughly four-fold markup sought within a matter of weeks, an unusually short interval even by the
              standards of 2026 AI-lab fundraising (CV011). No source discloses a revenue, ARR, or usage basis for
              either figure, so no standard multiple can be computed, and no public model card, benchmark, or paying
              pilot exists to anchor the price to anything beyond team pedigree and narrative (CV008, CV052). Entry
              discipline should therefore be strict: a rapid seed-to-follow-on markup of this kind typically comes with
              heavier liquidation preferences and board protections for new investors, but no cap table, term sheet, or
              preference-stack detail is publicly available to confirm this for Core Automation, leaving the effective
              ownership and downside protection of any new capital unclear (CV054). The most recent financing coverage
              reviewed for this chapter is dated May 2026; no source found during this run reports a closed follow-on, a
              revised valuation, or an abandoned raise as of the July 2026 run date, so the financing narrative should
              be treated as provisional pending a refresh (CV053). Nvidia's own recalibration of a proposed $100 billion
              commitment to OpenAI down to a $30 billion actual stake as OpenAI approached an IPO shows that even the
              largest strategic investors are tightening the scale of AI-lab capital commitments in 2026, a signal that
              could tighten availability for smaller, less-disclosed bets like Core Automation as well (CV039).
            claimRefs:
              - CV006
              - CV007
              - CV011
              - CV008
              - CV052
              - CV054
              - CV053
              - CV039
      - number: '8.4'
        title: Bull, Base, and Bear Scenarios
        blocks:
          - type: paragraph
            body: >-
              In the bull case, Core Automation ships a benchmarked continual-learning or agentic-research capability
              within roughly 12-18 months, closes its reported follow-on near the targeted $4 billion mark, and attracts
              a strategic compute or cloud partner the way World Labs did with Autodesk, re-rating toward the $8-12
              billion tier reached by Thinking Machines Lab and World Labs at a similar stage (CV041, CV018, CV015). In
              the base case, the company continues to raise on team pedigree and narrative without a public product,
              closing the follow-on near or below the reported target under heavier investor protections, consistent
              with the modal pattern across the 2024-2026 neolab set reviewed in this chapter (CV042, CV017). In the
              bear case, the follow-on stalls or prices as a down round as AI-sector venture capital concentrates
              further around the largest labs and investors demand revenue proof; a sector-wide reckoning already
              visible among AI-wrapper startups, with at least 118 tracked collapses and roughly $49.9 billion in
              destroyed capital by mid-2026, is the clearest documented precedent for how quickly hype-priced AI
              companies can lose value, and a dedicated analysis of agentic-AI valuations found pre-seed marks already
              declining and over 40% of agentic AI projects forecast for cancellation by 2027 (CV037, CV038, CV040). The
              plausible valuation range spans roughly $0.5-1 billion in the bear case, $2-4 billion in the base case,
              and $8-12 billion in the bull case, anchored to this scenario logic and the comparable set rather than to
              a disclosed financial model (CV048).
            claimRefs:
              - CV041
              - CV018
              - CV015
              - CV042
              - CV017
              - CV037
              - CV038
              - CV040
              - CV048
