  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: What the Product Appears to Be, and How Mature It Really Is
        blocks:
          - type: paragraph
            body: >-
              Core Automation’s public materials define a mission much more clearly than they define a product. The
              homepage says the company is building “the world’s most automated AI lab” and wants systems that optimize
              and automate work starting with research itself. That framing matters because it places the current
              deliverable closer to an internal research operating system than to a shipped external application.
              Nextomoro’s May 2026 profile reinforces the same interpretation, describing a lab focused on automating
              frontier-AI research workflows and on replacing large-scale pretraining with more adaptive learning
              algorithms. What is missing is just as important: there is no public API docs page, no product pricing, no
