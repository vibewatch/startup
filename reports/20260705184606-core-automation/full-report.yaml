  - id: TV005
    title: Thesis-break and kill triggers
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Confirmed down round or stalled follow-on
        - Follow-on closes below ~$2B or does not close within 6 months of reported talks
        - Signals investor demand is weaker than press reports suggest
        - Downgrade valuation stance to expensive; pause further diligence
      - - Key researcher departure
        - Founder or a top-3 named researcher leaves for a competitor or rival lab
        - Mirrors SSI's co-founder departure and signals team risk
        - Reassess the team-pedigree premium; treat as a red flag
      - - No product or benchmark disclosure within 12 months
        - Zero public model card, benchmark, or paying pilot by mid-2027
        - Confirms the company is not converging on a shippable product
        - Recommend avoid absent new evidence
      - - SEC or regulatory filing reveals materially different terms
        - A Form D or other filing shows valuation, structure, or investor terms inconsistent with press reports
        - Undermines the reliability of all press-sourced valuation claims in this chapter
        - Re-underwrite from filed terms, not press reports
      - - Broader AI-lab funding contraction
        - Two or more comparable neolabs face down rounds or shutdowns
        - Confirms the sector-wide reckoning documented in 2026 sources has reached the neolab tier
        - Treat as a bear-case trigger for Core Automation specifically
    notes: Thresholds are the report author’s judgment calls for monitoring purposes, not company-disclosed covenants.
    claimRefs:
      - CV044
      - CV028
      - CV009
      - CV037
  - id: TV006
    title: Final diligence asks
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Diligence path
    rows:
      - - Regulatory confirmation of financing
        - Form D or definitive round documents for the seed and follow-on
        - Press reports are the only source for the ~$1B and ~$4B figures
        - Request cap table and round documents directly from the company or its counsel
      - - Product or benchmark evidence
        - Any model card, benchmark result, or working demo
        - No public product-tech evidence exists as of the run date
        - Request a technical due-diligence session with a working demo or benchmark
      - - Customer or design-partner evidence
        - Any named pilot, design partner, or letter of intent
        - No customer evidence exists to support a go-to-market thesis
        - Request reference calls with any disclosed design partners
      - - Cap table and preference terms
        - Liquidation preference stack, board composition, anti-dilution terms
        - Determines downside protection and effective ownership for new capital
        - Request the cap table and term sheet for the reported follow-on
      - - Burn rate and compute commitments
        - Disclosed cash burn, runway, and compute contracts
        - Determines whether the reported raise size matches capital-intensity norms for frontier labs
        - Request financial statements or a data room
      - - Talent retention and key-person risk
        - Equity vesting schedules and retention terms for named researchers
        - SSI's co-founder departure shows pedigree-driven valuations are exposed to key-person risk
        - Request retention/vesting terms for the founder and top researchers
    notes: Asks are ranked by what would most change the recommendation or acceptable entry price, not by ease of collection.
    claimRefs:
      - CV045
      - CV052
      - CV054
      - CV028
