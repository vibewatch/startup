              - CV003
          - type: callout
            title: A sector-wide reckoning is already visible in the exact adjacent category
            body: >-
              Documented AI-wrapper failures and an emerging valuation correction specifically in agentic-AI startups
              suggest the downside scenario for Core Automation is not hypothetical.
            calloutType: insight
            claimRefs:
