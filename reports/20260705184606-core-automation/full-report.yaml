    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The recommendation turns on unresolved disclosure gaps and a stretched entry price meeting a high-risk,
      high-uncertainty comparable set.
    data:
      nodes:
        - id: disclosure
          label: Pre-product / pre-revenue, no Form D on file
          tone: negative
        - id: financing
          label: Reported ~$1B seed, ~$4B follow-on target (press-only)
          tone: warning
