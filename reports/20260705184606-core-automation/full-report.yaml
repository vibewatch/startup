      - number: '2.3'
        title: Buyers, Users, and the Path From Pilot to Production
        blocks:
          - type: paragraph
            body: >-
              Buyer, user, and payer split differently across the four in-boundary segments. Inside a frontier lab, the
              research-automation buyer is the lab's own CTO or head of research, funding tooling from the lab's
              compute/opex budget with research engineers as the direct users (Table TM003). Inside an enterprise, the
              more familiar pattern holds: CIOs, COOs, or functional vice-presidents fund pilots out of existing IT or
              operations budgets rather than a dedicated "AI agent" line, with analysts and associates as the day-to-day
              users (CM040). Buyer-side intent is broad: 93% of IT leaders surveyed in the MuleSoft/Deloitte Digital
              Connectivity Benchmark plan to introduce autonomous agents within two years (CM041), and Deloitte
              separately names research and development as one of the top use cases enterprises pick for agentic AI,
              alongside customer support, supply chain, and cybersecurity (CM046). But intent is not the same as a
              validated buyer for Core Automation's specific bet: the nearest proof points for AI-driven research
              automation -- Anthropic's Claude Science and Sakana AI's AI Scientist -- come from already dominant,
              well-capitalized incumbents building on standard Transformer models, not from open white space waiting for
              a new entrant (CM042). Figure FM003 traces the generic adoption path from research thesis to
              enterprise-wide workflow embedding; Figure FM004 narrows from broad agent experimentation down to the
              near-zero base of deployed, continual-learning-specific research-automation products that would validate
              Core Automation's particular thesis.
