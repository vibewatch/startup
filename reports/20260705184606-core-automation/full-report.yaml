              outside buyers. Core Automation's own homepage reinforces this: it frames the mission as building "the
              world's most automated AI lab" without referencing pricing, a product catalog, or revenue anywhere in the
              fetchable text. A technical blog post, "When AI Starts Writing Systems Code," is rendered client-side and
              returns almost no static text on fetch, further limiting independent verification of any business detail
              beyond the headline. The company's website also returns a 404 for a /careers path, so there is no visible
              public job-listing surface that would signal finance, legal, sales, or operations hiring activity
              alongside the reported research recruiting. Sacra identifies plausible future monetization paths -- B2B
              model or API access, enterprise subscriptions for domain-specific automation, and usage-based pricing tied
              to autonomous tasks or compute -- but frames all of them as speculative and unconfirmed by the company
              itself. No source reviewed identifies a named paying customer, signed contract, or disclosed revenue
