  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              Core Automation's bull case rests on a founding team with a credible frontier-research pedigree pursuing a
              continual-learning and agentic-systems-automation thesis that incumbent labs have not yet solved in
              public. That thesis is reinforced by a broader 2024-2026 pattern in which comparable pre-product labs—Safe
              Superintelligence, Thinking Machines Lab, World Labs, and Periodic Labs—have all been able to raise at
              multi-billion-dollar valuations within months of founding, showing that capital is available for this
              exact category even absent a shipped product (CV012, CV015, CV018, CV020, CV026, CV050). Reported interest
              in a $300-500 million follow-on only weeks after the seed round would, if confirmed, reinforce that
              continued investor demand exists (CV007). The anti-thesis is at least as strong. Core Automation has filed
              no SEC Form D, and a California incorporation filing confirms only that the entity exists, not the terms
              of either round (CV009). No product, benchmark, customer, or revenue evidence is public, so the valuation
              cannot be tested against anything but press reports and comparable-company pattern-matching (CV008,
              CV034). At the same time, 2026 AI venture capital has become unusually concentrated in a handful of
              frontier labs and shows documented signs of ARR inflation and bubble dynamics that could compress the
              multiples comparable neolabs currently command (CV029, CV030). At least two well-funded, thesis-adjacent
              rivals are independently pursuing overlapping bets, which weakens the case that Core Automation is a clear
              category winner rather than one of several similarly positioned entrants (CV017).
            claimRefs:
