              energy-based-model labs -- confirming that even sophisticated AI-focused investors treat continual
              learning as one narrow lane among several competing post-transformer bets, not a uniquely defensible
              category. Layered above the neolabs sit frontier incumbents (OpenAI, Anthropic, Google DeepMind) that
