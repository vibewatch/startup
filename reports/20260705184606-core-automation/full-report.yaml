        title: What Is Actually on the Record -- Incorporation and Reported Funding
        blocks:
          - type: paragraph
            body: >-
              The only independently verifiable government record for Core Automation is a California Secretary of State
              filing showing "Core Automation (de), Inc." as a Delaware-formed stock corporation, officially filed on
              March 24, 2026 under document number B20260125942, with Jerry (Jaroslaw) Tworek listed as registered
              agent. That filing discloses entity type, filing date, and registered-agent address, but no financial
              figures -- no authorized share count, no capital raised, no use-of-proceeds statement. A SEC EDGAR
              full-text search restricted to Form D filings between January 1 and July 5, 2026 returned zero results for
              "Core Automation," meaning no public notice of an exempt securities offering has been filed as of the run
              date, despite multiple outlets reporting a roughly $100 million initial raise at a $1 billion valuation
              and a subsequent push to raise $300-500 million at a target valuation near $4 billion. Reported (but not
              independently confirmed) investors in the initial round include Nvidia, Spark Capital, and Accel. Because
              Core Automation has not filed for an IPO or issued public debt, it is under no obligation to release
              audited financials, so every dollar figure in this chapter traces back to press reporting sourced to
              unnamed parties via The Information rather than to a filed document -- a materially weaker evidentiary
              basis than a prospectus or 10-K would provide.
