              Every market-size estimate reviewed covers a broader category (total AI spend, agentic AI capability
              spend, standalone agent software, or RPA), and these broader estimates already diverge by roughly 6x-30x
              depending on publisher. Treat any single-point TAM claim for frontier-lab research-automation tooling
              specifically as unsupported until a narrower, source-backed estimate exists.
            calloutType: risk
            claimRefs:
