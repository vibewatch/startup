      - number: '1.3'
        title: Funding, Valuation & Investors
        blocks:
          - type: paragraph
            body: >-
              Core Automation's reported capitalization history compresses an unusually rapid valuation climb into a few
              months. Analyst-data provider Sacra reports the company raised $100 million in an initial round at
              approximately a $1 billion valuation, with participation from Nvidia, Spark Capital, and Accel and no
              publicly disclosed lead investor. By early May 2026, The Information -- relayed by Techmeme, Intellectia,
              and SiliconReport -- reported Core Automation was seeking $300 million to $500 million in new capital at a
              target valuation of roughly $4 billion, a fourfold step-up in well under a quarter. AI CERTs' coverage of
              the same raise explicitly noted that Bloomberg and Reuters had not corroborated the reported figures, and
              Sacra similarly could not identify a lead investor for the first round. No secondary share sale or
              debt/credit financing has been reported. For context, the reported pace is broadly consistent with (though
              on the smaller end of) other 2025-2026 "neo-lab" megaseeds: Thinking Machines Lab closed a $2 billion seed
              at a $10 billion valuation in mid-2025, Humans& announced a $480 million seed at a $4.48 billion valuation
              in January 2026, and Safe Superintelligence raised $1 billion in 2024. Because Nvidia is both a reported
              investor and the dominant GPU supplier Core Automation would depend on for compute, its participation also
              raises a related-party question worth separate diligence attention.
            claimRefs:
