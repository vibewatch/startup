      - number: '1.2'
        title: Founders, Leadership & Team
        blocks:
          - type: paragraph
            body: >-
              Jerry Tworek, Core Automation's CEO and co-founder, spent nearly seven years at OpenAI, joining in 2019
              when the company had roughly 30 employees and rising to vice president of research. He led development of
              the o1 and o3 reasoning models, contributed to GPT-4's post-training and the 2025 GPT-5 deployment, and
              worked on the Codex code-generation line and early reinforcement learning for robots. He privately told
              OpenAI colleagues on January 5, 2026 that he intended to leave, and his departure became public days later
              amid a broader wave of senior OpenAI exits; he said he was leaving to pursue research "hard to do" inside
              OpenAI. Mark Saroufim, a systems engineer known for PyTorch and GPU MODE community work, is publicly
              identified as a co-founder and authored the company's first detailed technical blog post. Several
              additional researchers -- Rohan Anil and Anmol Gulati (both ex-Google DeepMind, with Anil also
              ex-Anthropic), Joanne Jang (former OpenAI general manager), Ehsan Amid and Avery Lamp (ex-DeepMind), Julia
              Villagra (former OpenAI head of people), and Sai Surya Duvvuri (former Google/Meta research intern) -- are
              named across company and third-party sources as joining the founding team. However, several of these
              individuals' public X handles returned zero posts or were private/unavailable when checked, and no board
              of directors or governance structure has been publicly disclosed, leaving material key-person and
              governance questions open.
