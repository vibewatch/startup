              Core Automation's reported valuation trajectory does not look unusual once placed next to comparable
              2024-2026 "neolab" megaseed rounds. Thinking Machines Lab, founded by former OpenAI CTO Mira Murati,
              closed a $2 billion seed round in July 2025 at a $12 billion valuation before shipping any commercial
