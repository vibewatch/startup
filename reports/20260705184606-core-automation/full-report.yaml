          Low-to-moderate: comparable labs have hit similar marks, but none has yet shipped a commercial product on Core
          Automation’s exact thesis.
      - - Base
        - >-
          Company continues to raise on team pedigree and narrative without public product; follow-on closes near or
          below the reported $4B target with heavier investor protections.
        - >-
          Valuation holds in the $2-4B band with paper markups but no realized liquidity for years pending an eventual
          product or acquisition.
        - Execution slips, key researchers depart (as at SSI), or a hoped-for follow-on is delayed or downsized.
        - 'Moderate: consistent with the modal pattern among 2024-2026 neolabs reviewed in this chapter.'
      - - Bear
        - >-
          Follow-on stalls or prices at a down round as AI-sector VC concentration tightens around the largest labs and
          investors demand revenue proof; talent departs to better-capitalized labs.
        - >-
          Valuation compresses toward or below the ~$1B seed mark; early backers face material markdown, consistent with
          secondary-market discounts documented for sub-frontier AI startups in 2026.
        - >-
          Compute or talent cost structure forces a distressed sale or shutdown, consistent with the 2026 pattern of
          AI-wrapper and neolab failures.
        - Moderate-to-high given the reckoning already visible among agentic-AI and AI-wrapper startups in 2026.
    notes: >-
      Assumptions and logic are the report author’s scenario synthesis anchored to the comparable set and 2026 market
      evidence, not company guidance.
    claimRefs:
