              - CV024
      - number: '8.6'
        title: Exit Readiness, Thesis-Break Triggers, and Final Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              OpenAI and Anthropic's parallel moves toward late-2026 IPOs at valuations approaching $1 trillion each
              show that a frontier-lab exit window is opening, but it is opening first for the largest, most disclosed
              labs; Core Automation has no disclosed near-term exit path of its own (CV046). The most consequential
              thesis-break triggers are a stalled or below-target follow-on, a key-researcher departure of the kind SSI
              experienced, twelve months passing with no product or benchmark disclosure, or a regulatory filing that
              contradicts the press-reported terms (CV044, CV028, CV009). A broader AI-lab funding contraction reaching
              two or more comparable neolabs would be a clear bear-case confirmation specific to Core Automation's tier
              (CV037). Before any capital commitment could be responsibly underwritten, the highest-priority outstanding
              asks are regulatory confirmation of both rounds' terms, any product or benchmark evidence, customer or
              design-partner evidence, cap-table and preference detail, disclosed burn and compute commitments, and
              retention terms for the founder and key researchers, none of which is available in the public record as of
              the run date (CV045, CV052, CV054). No licensed secondary-market or private-share pricing dataset covering
              Core Automation or its closest comparables was accessible during this review, leaving open whether the
              secondary-market discounts documented broadly for sub-frontier AI startups in 2026 would also apply here
              (CV055).
            claimRefs:
              - CV046
              - CV044
              - CV028
              - CV009
              - CV037
              - CV045
              - CV052
              - CV054
              - CV055
