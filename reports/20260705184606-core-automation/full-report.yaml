              - CM006
              - CM007
              - CM048
          - type: callout
            title: Governance and trust lag capability gains
            body: >-
              Agentic AI capability jumped from roughly 12% to 66% task success in about 18 months, but only 21% of
              organizations have mature governance for autonomous agents and Gartner expects 40% of agentic AI projects
              to be canceled by the end of 2027. Buyer readiness, not model capability, looks like the binding
              constraint on near-term demand.
            calloutType: risk
            claimRefs:
              - CM021
              - CM023
              - CM025
