  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: standard
    summary: >-
      Core Automation's implied markup multiple swings widely depending on whether product proof, sector conditions, or
      a stalled raise materializes.
    data:
      items:
        - label: Follow-on closes at reported $4B target
          value: 4
          detail: Implied multiple of the reported ~$1B seed valuation if the follow-on closes as reported.
          tone: warning
        - label: Typical late-stage AI multiple compression (25-40% discount)
          value: 2.6
          detail: Illustrative discount applied to the reported follow-on target.
          tone: negative
        - label: Benchmark/product proof achieved (re-rate toward peer tier)
          value: 10
          detail: Illustrative re-rate toward the $8-12B tier reached by Thinking Machines and World Labs.
          tone: positive
        - label: No product disclosure within 12 months (bear case)
          value: 1
          detail: Flat markup with no re-rate absent any disclosure.
          tone: negative
        - label: Sector-wide AI funding contraction
          value: 0.6
          detail: Illustrative markdown below the reported seed mark if two or more comparable neolabs face down rounds.
          tone: negative
    approximationNotes: >-
      Values are illustrative multiples of the reported ~$1 billion seed valuation under different driver scenarios; not
      derived from a disclosed revenue or DCF model given the absence of financial disclosure.
    claimRefs:
      - CV011
      - CV035
      - CV040
      - CV048
  - id: FV003
    title: Valuation / return range
    type: range
    layout: wide
    summary: >-
      Plausible valuation outcomes for Core Automation span roughly 20x depending on whether disclosure and product
      proof materialize.
    data:
      items:
        - label: Bear case
          low: 0.5
          mid: 0.8
          high: 1
          displayValue: $0.5B-$1.0B
          detail: Follow-on stalls or prices at a down round amid sector-wide AI funding contraction.
          tone: negative
        - label: Base case
          low: 2
          mid: 3
          high: 4
          displayValue: $2B-$4B
          detail: Follow-on closes near or below the reported $4B target with heavier investor protections.
          tone: warning
        - label: Bull case
          low: 8
          mid: 10
          high: 12
          displayValue: $8B-$12B
          detail: >-
            Benchmarked product proof lands within 12-18 months, re-rating toward the Thinking Machines / World Labs
            tier.
          tone: positive
    approximationNotes: >-
      Bands are illustrative, anchored to the bull/base/bear scenario table and comparable-set outcomes; not a formal
      valuation model given absent financial disclosure.
    claimRefs:
      - CV041
      - CV042
      - CV040
      - CV048
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: Core Automation scores well on market size and team pedigree but weakly on proof, economics, and evidence quality.
    data:
      items:
        - label: Market
          score: 7
          detail: >-
            Large adjacent markets (frontier-lab automation, enterprise agentic AI) but no dedicated category sizing
            exists.
          tone: positive
        - label: Proof
          score: 2
          detail: No public benchmark, model card, or working demo as of the run date.
          tone: negative
        - label: Moat
          score: 5
          detail: Team pedigree and continual-learning thesis are credible but unverified against a shipped product.
          tone: warning
        - label: Economics
          score: 2
          detail: No disclosed revenue, burn, or unit economics.
          tone: negative
        - label: Risk
          score: 3
          detail: >-
            High key-person, financing, and market-timing risk per the risks chapter and this chapter’s comparable-set
            precedent.
          tone: negative
        - label: Valuation
          score: 3
          detail: Stretched to expensive given the unverified seed-to-follow-on markup.
          tone: negative
        - label: Evidence quality
          score: 4
          detail: Press-only corroboration with no regulatory filing or company disclosure.
          tone: warning
    approximationNotes: >-
      Scores are 0-10 ordinal judgments synthesized from the public evidence set for IC discussion, not a
      company-disclosed scorecard.
    claimRefs:
      - CV003
      - CV004
      - CV009
      - CV026
      - CV047
