chapter:
  number: 6
  title: Customers
  summary: Core Automation has no public customer, pilot, pricing, or retention evidence, so the customer case must be inferred from the workflows it wants to automate and from adjacent enterprise AI vendors already selling into similar jobs. Comparable proof from Glean, Hebbia, and broader agent-adoption surveys suggests real buyer demand exists, but Core Automation is still at the pre-reference stage and faces meaningful procurement and adoption risk.
sections:
- id: target-segments-and-buyer-shape
  title: 'Likely Target Customers: Research Teams, R&D Buyers, and Knowledge-Work Operators'
  body: 'Core Automation’s public materials do not name a buyer, but they do strongly imply one. The company describes itself as building an automated AI lab and as creating systems that optimize and automate work starting with research itself. That language points away from consumer distribution and toward research-intensive organizations, enterprise R&D groups, frontier labs, and high-value knowledge-work teams that already spend heavily on experimentation, code, and information retrieval. Comparable public proof makes the same point from another angle. Glean’s horizontal enterprise adoption spans IT, support, knowledge management, and business operations, while Hebbia’s proof clusters in finance, legal, and similarly high-stakes document workflows. If Core Automation ever productizes its internal stack, the earliest plausible customers would likely sit at the intersection of those worlds: technical or analytical teams with expensive human workflows, large data estates, and a reason to
    pay for faster iteration. But that segmentation remains inferred because Core Automation has not yet published customer names, verticals, or buyer personas.'
