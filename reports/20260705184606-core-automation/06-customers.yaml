- id: retention-and-customer-verdict
  title: Retention, Expansion, and the Customer Verdict
  body: 'The customer verdict is therefore sharply bifurcated. On the positive side, adjacent markets clearly show that enterprises will buy tools that improve research, retrieval, analysis, and workflow automation, and they increasingly expect agentic systems to handle more of the work. On the negative side, none of the public evidence reviewed for this chapter shows that Core Automation itself has crossed even the first durable customer threshold. There are no disclosed reference accounts, no renewal or retention metrics, no satisfaction scores, and no customer-concentration data. The adverse market evidence matters here too: if a meaningful share of enterprise agent projects will be canceled or slowed by execution risk, then a pre-product vendor with no references starts from a trust deficit rather than a clean slate. The practical implication is simple. Core Automation may have real future customers, but today the customer case is still an underwriting hypothesis. The company needs reference
    accounts, pilot outcomes, and retention signals before adoption can be treated as an asset instead of an expectation.'
