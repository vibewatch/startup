- id: public-proof-and-comparable-adoption
  title: 'Public Proof: Strong Comparable Demand, No Direct Core Automation References Yet'
  body: The customer-proof asymmetry is the defining fact of this chapter. Publicly, Glean and Hebbia already provide named or at least role-specific evidence that organizations use their platforms in production-like settings. Glean’s customer stories page shows public testimonials across multiple enterprise functions and names a company case study, while Hebbia’s homepage offers both a named testimonial and large-scale usage claims such as prompts, pages processed, and AUM exposure. Those signals do not prove Core Automation demand directly, but they do prove there is buyer appetite for workflow automation and research assistance in adjacent categories. By contrast, Core Automation’s public materials still show no customer logos, no pilot announcements, no design-partner testimonials, and no deployment outcomes. That means the named customer proof in the market belongs almost entirely to comparables, not to Core Automation itself. For diligence, that gap matters more than the category heat,
    because customer proof quality is usually the first hard signal that a product can travel from research ambition to repeatable adoption.
