  evidenceGaps:
  - type: missing-source
    severity: blocking
    topic: regulatory confirmation of financing terms
    missingEvidence: Signed round documents, a filed Form D, or a cap table for the reported ~$1B seed and ~$4B follow-on rounds
    whyItMatters: Every valuation figure in this chapter is press-reported, not regulator- or company-confirmed, so the core price the recommendation is judged against could be wrong.
    diligencePath: Request round documents, board consent, and cap table directly from Core Automation or its counsel before committing capital.
    relatedQuestionRefs:
    - QV029
  - type: stale
    severity: minor
    topic: financing narrative currency for Core Automation
    missingEvidence: Any funding, valuation, or round-status update published after the May 2026 sources reviewed in this chapter
    whyItMatters: A stalled, closed, or repriced follow-on after May 2026 would change the valuation stance materially.
    diligencePath: Re-run financing-specific searches at the next refresh and monitor SEC EDGAR for a Form D filing.
    relatedQuestionRefs:
    - QV026
  - type: missing-source
    severity: material
    topic: product and revenue disclosure for valuation basis
    missingEvidence: A public benchmark, model card, working demo, or disclosed revenue/ARR figure
    whyItMatters: Without any of these, no standard revenue- or usage-based valuation method can be applied to Core Automation.
    diligencePath: Request a technical due-diligence session and any internal benchmark or pilot data under NDA.
    relatedQuestionRefs:
    - QV022
    - QV025
  - type: access-blocked
    severity: material
    topic: secondary-market pricing data for comparable neolabs
    missingEvidence: Licensed secondary-transaction or private-share marketplace data (e.g., PitchBook, Caplight) covering Core Automation or its closest pre-product comparables
    whyItMatters: Documented 2026 secondary-market discounts of 20-60% for sub-frontier AI startups may or may not apply to this comparable set; without licensed data this cannot be confirmed.
    diligencePath: Obtain a licensed PitchBook or Caplight data pull covering the named comparable set before finalizing a price view.
    relatedQuestionRefs:
    - QV027
  - type: enumeration-incomplete
    severity: minor
    topic: comparable valuation table coverage
    missingEvidence: Additional 2024-2026 neolab and frontier-lab financing rounds beyond the nine covered in the comparable valuation table
    whyItMatters: A wider comparable set would sharpen where Core Automation sits within the observed valuation-multiple range.
    diligencePath: Expand the comparable set at the next refresh using updated Crunchbase/PitchBook AI funding trackers.
    relatedTableRefs:
    - TV004
  - type: conflicting-data
    severity: minor
    topic: seed valuation base figure consistency
    missingEvidence: A single authoritative figure reconciling whether the pre-seed base was exactly $1 billion or a rounded approximation across outlets
    whyItMatters: Minor figure inconsistencies across press outlets compound when used as the base for the follow-on markup estimate.
    diligencePath: Confirm the exact seed valuation figure once round documents or a filing become available.
