- id: TV002
  title: Thesis and anti-thesis
  columns:
  - Position
  - Argument
  - What would change the view
  rows:
  - - Thesis
    - Founding-team pedigree and continual-learning thesis align with a real frontier-research gap that incumbents have not solved.
    - A verified benchmark or model release demonstrating the thesis works in practice.
  - - Thesis
    - Comparable pre-product labs (SSI, Thinking Machines, World Labs, Periodic Labs) have all raised at multi-billion valuations shortly after founding, showing capital is available for this category.
    - A down round or failed follow-on among comparable neolabs would weaken this comparison.
  - - Thesis
    - Reported $300-500 million follow-on interest, even if unconfirmed, indicates continued investor demand only months after the seed.
    - Confirmation the follow-on stalled or priced materially below the reported $4 billion target.
  - - Anti-thesis
    - The company has filed no SEC Form D and discloses no product, customers, or revenue, making the valuation unverifiable by outside diligence.
    - A confirmed Form D filing or a public product/benchmark disclosure.
  - - Anti-thesis
    - 2026 AI venture capital is unusually concentrated in a handful of frontier labs and shows signs of ARR inflation and bubble dynamics that could compress comparable multiples.
    - Evidence that AI-sector VC concentration and multiples are normalizing rather than a bubble.
  - - Anti-thesis
    - At least two well-funded, thesis-adjacent competitors (Adaption Labs and AMI Labs) are pursuing overlapping bets, raising the risk Core Automation is not a category winner.
    - Evidence of clear technical or commercial differentiation versus these rivals.
