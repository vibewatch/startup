- id: scenario-analysis-bull-base-bear
  title: Bull, Base, and Bear Scenarios
  body: In the bull case, Core Automation ships a benchmarked continual-learning or agentic-research capability within roughly 12-18 months, closes its reported follow-on near the targeted $4 billion mark, and attracts a strategic compute or cloud partner the way World Labs did with Autodesk, re-rating toward the $8-12 billion tier reached by Thinking Machines Lab and World Labs at a similar stage (CV041, CV018, CV015). In the base case, the company continues to raise on team pedigree and narrative without a public product, closing the follow-on near or below the reported target under heavier investor protections, consistent with the modal pattern across the 2024-2026 neolab set reviewed in this chapter (CV042, CV017). In the bear case, the follow-on stalls or prices as a down round as AI-sector venture capital concentrates further around the largest labs and investors demand revenue proof; a sector-wide reckoning already visible among AI-wrapper startups, with at least 118 tracked collapses
    and roughly $49.9 billion in destroyed capital by mid-2026, is the clearest documented precedent for how quickly hype-priced AI companies can lose value, and a dedicated analysis of agentic-AI valuations found pre-seed marks already declining and over 40% of agentic AI projects forecast for cancellation by 2027 (CV037, CV038, CV040). The plausible valuation range spans roughly $0.5-1 billion in the bear case, $2-4 billion in the base case, and $8-12 billion in the bull case, anchored to this scenario logic and the comparable set rather than to a disclosed financial model (CV048).
