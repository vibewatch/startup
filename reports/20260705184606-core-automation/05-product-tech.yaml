chapter:
  number: 5
  title: Product & Technology
  summary: 'Core Automation’s public product story is still a thesis rather than a launched SKU: an automated AI lab built around continual learning, post-transformer architectures, and agentic systems-code automation. The technical direction is credible because the team’s public systems footprint is strong, but no public benchmark, model card, trust center, or live product surface exists yet, so maturity remains internal and largely unverified.'
sections:
- id: product-definition-and-maturity
  title: What the Product Appears to Be, and How Mature It Really Is
  body: 'Core Automation’s public materials define a mission much more clearly than they define a product. The homepage says the company is building “the world’s most automated AI lab” and wants systems that optimize and automate work starting with research itself. That framing matters because it places the current deliverable closer to an internal research operating system than to a shipped external application. Nextomoro’s May 2026 profile reinforces the same interpretation, describing a lab focused on automating frontier-AI research workflows and on replacing large-scale pretraining with more adaptive learning algorithms. What is missing is just as important: there is no public API docs page, no product pricing, no status surface, no model card, and no benchmark sheet for Ceres or any other named model. The result is a product chapter that has to separate conceptual assets from proven ones. Publicly, the real assets are the thesis, the talent profile, and the systems narrative; the external
    product interface still appears internal, pre-release, or undisclosed.'
  claimRefs:
  - CE001
  - CE002
  - CE007
  - CE008
  - CE027
  - CE035
  tableRefs:
