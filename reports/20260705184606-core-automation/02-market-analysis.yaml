- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / Constraint
  - Direction
  - Timing
  - Implication
  - Diligence Ask
  rows:
  - - Agentic capability jump (OSWorld ~12% to ~66% task success)
    - driver
    - already visible (2024-2026)
    - Raises plausibility of automating complex cognitive workflows
    - Benchmark performance vs. real deployed task success, not lab conditions
  - - Enterprise agentic AI spend growth ($10.9-11.8B in 2026 toward $50B+ by ~2030-2034)
    - driver
    - medium-term (2026-2030)
    - Signals an expanding addressable budget for agent-based tooling generally
    - How much of that spend would flow to a research-automation specialist vs. incumbent platforms
  - - Frontier lab capital concentration & compute scarcity
    - constraint
    - immediate
    - GPU/HBM shortage raises training costs and slows non-incumbent labs, including new entrants
    - Core Automation's compute contracts, allocation, and vendor relationships
  - - Governance / trust gap (21% mature agentic governance)
    - constraint
    - near-term
    - Slows autonomous deployment even where capability exists
    - What compliance/evaluation harness, if any, Core Automation offers or plans
  - - Pilot-to-production failure rate (95% of GenAI pilots show no ROI)
    - constraint
    - current
    - Buyers are skeptical; ROI proof is required before budgets scale
    - Any pilot data, references, or case studies once Core Automation has a product
  - - AI-bubble / capex skepticism (Burry and others)
    - constraint
    - macro / uncertain timing
    - Could compress funding availability for pre-product research labs
    - Monitor capital-markets sentiment and Core Automation's cash runway
  - - Continual-learning technical breakthroughs (Nested Learning, Mamba-3)
    - driver
    - research-stage, 1-3 year horizon
    - If commercialized, could materially lower training-data and compute needs, aligning with the company's
      stated thesis
    - Independent benchmarking of any Core Automation model against these published techniques
  - - Scientific-research automation proof points (Sakana AI Scientist, Anthropic Claude Science)
    - driver
    - already live
    - Demonstrates buyer appetite for AI research automation, though from well-capitalized incumbents
    - Core Automation's differentiation versus Anthropic, Google, and Sakana AI
  notes: Direction and timing are this chapter's synthesis of the cited sources, not a single publisher's
    framework; several rows cut both ways depending on how quickly Core Automation can ship a product.
