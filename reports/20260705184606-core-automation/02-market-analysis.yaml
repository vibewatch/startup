- id: adverse-evidence-and-diligence-gaps
  title: Adverse Evidence and Diligence Gaps
  body: 'Enterprise adoption headlines mask a wide adoption-to-impact gap that any market-sizing exercise
    for Core Automation should discount against. Stanford''s 2026 AI Index reports 88% organizational
    AI adoption and generative AI usage reaching 53% within three years -- faster diffusion than the PC
    or the internet (CM022) -- yet Deloitte finds only 23% of organizations use agentic AI at even a moderate
    level and just 21% have a mature governance model for it (CM023). Axis Intelligence''s cross-referenced
    "Deployment Gap Index" quantifies the same pattern differently: 93% of IT leaders intend to deploy
    autonomous agents within two years, but only 23% have scaled deployment in even one function, a 70-percentage-point
    gap between stated intent and production reality (CM024). The most-cited cautionary data point is
    MIT''s 2025 "GenAI Divide" study of 300-plus enterprise deployments, which found 95% of organizations
    captured zero measurable P&L return from generative AI pilots, with failure attributed to shallow,
    siloed integration rather than model quality or regulation (CM026, CM027) -- a caution that applies
    with at least as much force to a pre-product research bet as it does to shipped generative-AI tools.
    At the macro level, investor Michael Burry has publicly likened the 2025-2026 AI investment cycle
    to the 1999-2000 dot-com bubble, arguing that hyperscaler depreciation accounting understates the
    true cost of AI infrastructure spend (CM034, CM035). None of this proves Core Automation''s specific
    thesis will fail, but it means the demand environment it is betting on is simultaneously the most
    capital-intensive and the most evaluation-skeptical the AI industry has produced to date.'
  claimRefs:
  - CM022
  - CM023
  - CM024
  - CM026
  - CM027
  - CM034
