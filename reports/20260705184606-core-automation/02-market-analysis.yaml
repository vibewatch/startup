- id: continual-learning-post-transformer-thesis
  title: Why Continual Learning and Post-Transformer Research Could Matter Economically
  body: 'Core Automation''s technical bet is that continual learning -- keeping a model current without
    retraining from scratch -- and architectures that scale better than Transformers could eventually
    cut the training-data and compute cost of frontier AI, directly offsetting the GPU scarcity documented
    elsewhere in this chapter (CM044). The research direction is real and active, not fringe: Google Research''s
    "Nested Learning" paradigm and its "Hope" architecture reframe models as nested, self-modifying optimization
    problems designed to retain long-horizon memory (CM010, CM011), and Mamba-3, a 2026 state-space-model
    architecture accepted as an ICLR oral, claims to match or beat Transformer baselines on perplexity
    at roughly half the inference cost (CM012, CM013). None of this constitutes a validated, frontier-scale
    commercial replacement for Transformer-based models as of mid-2026 (CM014), and no source reviewed
    publishes a dollar-denominated market size for this research category at all (CM009, CM045). Proof
    that automated research itself can work is easier to find than proof that continual learning specifically
    works: Sakana AI''s AI Scientist produced a paper published in Nature describing an agent that formulates
    hypotheses, runs experiments, and authors manuscripts (CM015), an earlier version passed genuine peer
    review (CM016), and the code is open-sourced (CM017). Anthropic''s Claude Science pursues a similar
    workflow-automation thesis for scientists without shipping a new model (CM018), and Anthropic separately
    reports more than 80% of its own production code is now Claude-authored, an 8x productivity jump versus
    its 2021-2025 baseline (CM019) -- read cautiously, since it is a self-reported, unaudited figure from
    the company itself (CM020). Taken together, the evidence supports "automated research is plausible"
    far more strongly than it supports "Core Automation''s specific continual-learning approach is proven."'
