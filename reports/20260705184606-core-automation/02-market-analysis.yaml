- id: buyer-segmentation-adoption-path
  title: Buyers, Users, and the Path From Pilot to Production
  body: 'Buyer, user, and payer split differently across the four in-boundary segments. Inside a frontier
    lab, the research-automation buyer is the lab''s own CTO or head of research, funding tooling from
    the lab''s compute/opex budget with research engineers as the direct users (Table TM003). Inside an
    enterprise, the more familiar pattern holds: CIOs, COOs, or functional vice-presidents fund pilots
    out of existing IT or operations budgets rather than a dedicated "AI agent" line, with analysts and
    associates as the day-to-day users (CM040). Buyer-side intent is broad: 93% of IT leaders surveyed
    in the MuleSoft/Deloitte Digital Connectivity Benchmark plan to introduce autonomous agents within
    two years (CM041), and Deloitte separately names research and development as one of the top use cases
    enterprises pick for agentic AI, alongside customer support, supply chain, and cybersecurity (CM046).
    But intent is not the same as a validated buyer for Core Automation''s specific bet: the nearest proof
    points for AI-driven research automation -- Anthropic''s Claude Science and Sakana AI''s AI Scientist
    -- come from already dominant, well-capitalized incumbents building on standard Transformer models,
    not from open white space waiting for a new entrant (CM042). Figure FM003 traces the generic adoption
    path from research thesis to enterprise-wide workflow embedding; Figure FM004 narrows from broad agent
    experimentation down to the near-zero base of deployed, continual-learning-specific research-automation
    products that would validate Core Automation''s particular thesis.'
  claimRefs:
  - CM040
  - CM041
  - CM042
  - CM046
  tableRefs:
  - TM003
  figureRefs:
  - FM003
  - FM004
- id: growth-drivers-and-constraints
  title: Growth Drivers and Adoption Constraints
  body: 'Three forces push demand for cognition-heavy automation upward. First, capability is closing
    the gap with human performance fast: agentic systems went from completing about 12% of real-world
    computer tasks to roughly 66% in about 18 months on the OSWorld benchmark, though they still fail
    roughly one in three attempts (CM021). Second, capital is concentrating in exactly this space: AI
    startups captured 80-81% of the roughly $300 billion in global venture funding in the first quarter
    of 2026 alone (CM028, CM029), and Gartner projects 40% of enterprise applications will embed task-specific
    AI agents by year-end 2026 (CM025). Third, well-capitalized frontier labs such as Thinking Machines
    Lab are locking down multi-billion-dollar compute deals and gigawatt-scale Nvidia hardware commitments
    (CM030), signalling that serious capital believes some version of Core Automation''s automated-research
    thesis is investable. Three forces pull the other way. Trust and governance lag capability: only 21%
    of organizations report a mature governance model for autonomous agents, and Gartner separately expects
    40% of agentic AI projects to be canceled by the end of 2027 over cost, ROI, and risk-control concerns
    (CM043). Even where organizations experiment, few scale: a November 2025 survey found only 23% scaling
    agents in one function and under 10% scaling across multiple functions (CM036). And compute itself
    is a bottleneck: H100/H200 lead times of 36-52 weeks, driven by TSMC packaging and HBM memory constraints,
    push well-capitalized incumbents toward multi-year reserved contracts that a smaller, newer entrant
    like Core Automation would struggle to match (CM032, CM033).'
