    - label: Total global AI spending (2026)
      value: 2590
      description: Gartner's top-down estimate spans AI infrastructure, software, and services worldwide
        in 2026.
    - label: Enterprise 'agentic AI' capability spend (2026)
      value: 201.9
      description: Gartner's broader agentic-AI-capability-tagged estimate, embedded across enterprise
        software categories, ~7.8% of total AI spend.
    - label: Standalone AI-agent software market (2026)
      value: 11.35
      description: Midpoint of the 10.9-11.8B consensus of Fortune Business Insights, Precedence Research,
        MarketsandMarkets, and Deloitte TMT bottom-up vendor-revenue estimates.
  approximationNotes: The narrowest layer uses the midpoint of a 10.9-11.8B range for legibility. Core
