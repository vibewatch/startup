callouts:
- calloutType: risk
  title: No dedicated TAM exists for Core Automation's actual niche
  body: Every market-size estimate reviewed covers a broader category (total AI spend, agentic AI capability
    spend, standalone agent software, or RPA), and these broader estimates already diverge by roughly
    6x-30x depending on publisher. Treat any single-point TAM claim for frontier-lab research-automation
    tooling specifically as unsupported until a narrower, source-backed estimate exists.
  claimRefs:
  - CM004
  - CM006
  - CM007
  - CM048
- calloutType: risk
  title: Governance and trust lag capability gains
  body: Agentic AI capability jumped from roughly 12% to 66% task success in about 18 months, but only
    21% of organizations have mature governance for autonomous agents and Gartner expects 40% of agentic
    AI projects to be canceled by the end of 2027. Buyer readiness, not model capability, looks like the
    binding constraint on near-term demand.
  claimRefs:
  - CM021
  - CM023
  - CM025
  - CM043
- calloutType: insight
  title: Incumbents already occupy the closest proof-of-concept ground
  body: Anthropic (Claude Science) and Sakana AI (AI Scientist) are already selling and publishing on
    AI-driven research automation, using standard Transformer-based models rather than a continual-learning
    breakthrough. Core Automation's differentiation has to come from the underlying technical approach
    working, not from being first to the buyer conversation.
  claimRefs:
  - CM015
  - CM018
  - CM042
- calloutType: assumption
  title: The economic case rests on an unproven research bet
  body: Continual learning and post-transformer architectures are active, credible research directions,
    but no source reviewed shows a frontier-scale commercial deployment built on them. Core Automation's
    market thesis is conditional on lab-stage research succeeding at production scale, not a description
    of a market that already exists.
  claimRefs:
  - CM010
  - CM011
  - CM012
  - CM014
  - CM044
