    - 'Research funders: labs, academic grants, corporate research budgets'
    - Core Automation's stated technical thesis; not itself a sized commercial market
  - - Scientific discovery / AI-for-science automation
    - Vendor tools and lab-internal agents for hypothesis generation, experiment design, paper authoring
    - Wet-lab equipment and physical scientific instrumentation
    - University PI budgets, biotech/pharma R&D, corporate science labs
    - Adjacent proof-of-concept category showing buyer appetite for automated research
  - - Traditional robotic process automation (RPA)
    - Software licenses and services for repetitive, rule-based enterprise workflows
    - Judgment-intensive or open-ended cognitive tasks
    - Enterprise IT / operations budget
    - 'Legacy adjacency: shows enterprise appetite for automation on a different technology base'
  - - Industrial / physical AI automation (robotics)
    - Perception-reasoning-action robotic systems on factory floors and in logistics
    - Pure software / cloud AI services
    - Plant operations / COO capex-opex budget
    - Loosely adjacent; a parallel 'autonomous work' thesis outside cognitive/office domains
  - - AI infrastructure & compute (cloud, GPUs, data centers)
    - Hyperscaler and GPU vendor revenue
    - Application-layer software spend
    - Frontier labs and enterprises purchasing compute
    - Upstream cost driver and capacity constraint for every segment above, not itself Core Automation's
      product
