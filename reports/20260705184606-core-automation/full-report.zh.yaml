      - number: '3.3'
        title: 直接命题竞争者：持续学习与后 Transformer Neolab 浪潮
        blocks:
          - type: paragraph
            body: >-
              一批资金充足、由研究人员带队的初创公司，正在追逐与 Core Automation 自身高度重叠的技术赌注。Adaption Labs 由前 Cohere 高管 Sara Hooker 和 Sudip Roy
              创立，2026 年初完成 $50M 种子轮，商业化「无梯度」持续学习，使已部署模型无需完整重训即可适配——这对「冻结模型」经济性的批评，几乎与 Core Automation
              创始人对静态预训练的批评相同。Yann LeCun 的 AMI Labs 在 2026 年 3 月以 $3.5B 投前估值融资 $1.03B，追求基于 Joint Embedding Predictive
              Architecture 的「世界模型」，这是不同但相邻的后 LLM 范式；其 CEO 表示，达到商业应用可能需要数年。Reflection AI 由前 DeepMind 研究人员创立，2025 年末估值达到
              $8B，据报道到 2026 年 3 月正洽谈一轮 $25B 融资，押注开放权重前沿模型而不是持续学习。前 OpenAI CTO Mira Murati 创办的 Thinking Machines Lab 已在
              2025 年 10 月发布商业产品 Tinker，比 Core Automation 披露任何公开内容早了数月。Sakana AI 估值 $2.65B，追求高效、日本本地化模型——这是地理和技术上更窄的赌注。按
              Radical Ventures 统计，2026 年前的三年里，40 多家此类 neolabs 合计融资超过 $40B。
