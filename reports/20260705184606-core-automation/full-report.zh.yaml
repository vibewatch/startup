        blocks:
          - type: paragraph
            body: >-
              公开时间线从 Core Automation 存在之前就开始了：Tworek 2019 年至 2026 年 1 月离开 OpenAI 的经历，构成公司融资叙事所依赖的创始人履历。报道把 Core
              Automation 的正式成立时间放在 2026 年 3 月，但 BigGo 2026 年 4 月 24 日的说法称，公司「1 月底成立后不久」就已开始融资——这是公开记录中的未解冲突。公司第一次公开亮相是
              2026 年 4 月 21 日在 X 上发帖，宣称正在「打造全球最自动化的 AI 实验室」；多名资深研究人员在该帖发布后一天内确认加入，报道把这描述为从 Anthropic、Google DeepMind 和
              OpenAI 协调式「nerdsniping」人才。融资里程碑随后迅速到来：先是 $100M 初始轮、估值 $1B，随后在 2026 年 5 月 7-8 日被报道正推动融资 $300M-$500M，目标估值
              $4B。公司第一次有实质内容的公开技术披露发生在 2026 年 5 月 28 日，当时联合创始人 Mark Saroufim 发布关于 AI
              研究系统代码自动化的博客——这是迄今为止超出融资和招聘新闻之外、最清晰的实际研究产出证据。到那一刻，公司仍未披露任何商业产品、定价或客户。
