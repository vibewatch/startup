      - number: '1.3'
        title: 融资、估值与投资者
        blocks:
          - type: paragraph
            body: >-
              Core Automation 已报道的资本化历史，把异常迅速的估值跃升压缩进了短短几个月。分析数据提供商 Sacra 报道，公司初始轮融资 $100M，估值约 $1B，Nvidia、Spark Capital
              和 Accel 参投，但没有公开披露领投方。到 2026 年 5 月初，The Information——经 Techmeme、Intellectia 和 SiliconReport 转述——报道称 Core
              Automation 正在寻求 $300M 到 $500M 新资本，目标估值约 $4B，不到一个季度就翻了约四倍。AI CERTs 对同一融资的报道明确指出，Bloomberg 和 Reuters
              尚未证实这些数字；Sacra 同样无法确认首轮领投方。尚无二级股票出售或债务 / 信贷融资报道。作为参照，这一节奏大体符合其他 2025-2026
              年「neo-lab」超大种子轮（尽管绝对规模偏小）：Thinking Machines Lab 在 2025 年中以 $10B 估值完成 $2B 种子轮；Humans& 在 2026 年 1 月宣布以
              $4.48B 估值完成 $480M 种子轮；Safe Superintelligence 则在 2024 年融资 $1B。由于 Nvidia 既是据报道的投资者，又是 Core Automation
              算力所依赖的主导 GPU 供应商，它的参与也引出一个需要单独尽调的关联方问题。
