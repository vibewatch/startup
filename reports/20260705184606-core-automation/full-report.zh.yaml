      - number: '5.3'
        title: 依赖、开发者信号与隐含路线图
        blocks:
          - type: paragraph
            body: >-
              本章最强的外部证据来自开发者信号，而不是公司的自有代码库或文档。Mark Saroufim 的公开作品集和 GitHub 足迹，正好展示了 Core Automation 若想把
              kernel、训练工作流和基础设施纳入研究循环自动化，会需要的底层系统经验。GPU MODE 的课程、YouTube 频道和相关材料，围绕这些技能形成了一个异常可见的实践者社区；PyTorch 的
              KernelAgent 文章也显示，相邻领域已经在用多智能体工作流，结合真实硬件反馈优化 GPU kernel。联合创始人兼 CEO Jerry Tworek
              则提供了第二个、可独立交叉验证的可信度信号：行业画像称他曾任 OpenAI 研究副总裁，领导 o1 和 o3 推理模型项目，并参与 Codex 与 GPT-3/GPT-4
              系列，让创始团队在公司声称要超越的推理和后训练研究上，具备直接的前沿实验室经验。换句话说，Core Automation
              公开故事所暗示的系统栈可信，是因为团队过去的公开工作可信。但可信度不等于产品成熟。路线图仍只能推断：先自动化内部研究任务，证明这些智能体能提升生产力，之后也许再对外提供工具、API
              或模型访问。在此期间，关键依赖——算力、评测工具、顶尖系统人才和私有研究反馈回路——大多仍不在公开视野内。
