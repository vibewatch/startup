  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局框架：分层，而不是一张同行名单
        blocks:
          - type: paragraph
            body: >-
              由于 Core Automation 没有披露产品、定价或客户入口，不能把它简化为单一竞争者短名单。Radical Ventures 2026 年「NeoLab」分类明确把 Core Automation
              放进「持续学习」桶，与 Adaption Labs 并列，区别于「世界模型」实验室（AMI Labs、World Labs、Decart）、强化学习实验室（Reflection AI、Ineffable
              Intelligence），以及扩散或能量模型实验室——这证实即便是成熟的 AI 投资者，也把持续学习视为几个相互竞争的后 Transformer 赌注中的一条窄赛道，而不是一个天然可防守的独特类别。neolab
              上层，是 OpenAI、Anthropic、Google DeepMind 等前沿既有玩家，它们已经在生产中运行内部自动化研究智能体，并交付能产生收入的产品；下层，则是
              FutureHouse、Glean、Hebbia、Manus 等产品优先公司，它们已经把自动化研究或知识工作工具卖给付费客户，不需要等待持续学习突破。Radical Ventures
              还把算力获取，而非资本，框定为整个格局的硬约束：战略算力伙伴关系（hyperscaler 承诺、Nvidia 配额协议）已成为股权结构中的标准配置，这意味着 Core Automation 仅有的已报道
              Nvidia 投资人关系，比下文每一层多数同行的算力位置都薄得多。
