      - number: '7.5'
        title: 治理集中与证据质量缺口，让缓释措施大多仍停留在愿景层面
        blocks:
          - type: paragraph
            body: >-
              公开的缓释故事仍很薄，因为投资人通常用来下调风险的证据大多根本不存在。公开来源显示，公司高度围绕 Jerry Tworek
              这样的创始人兼研究者画像集中，但没有披露董事会构成、投资人控制条款、继任规划或运营授权。因此，公司是在要求市场相信，一个异常小且技术精英化的团队，既能把研究论点转化为可重复商业执行，也能搭建企业买方期待的信任和治理外壳。这可能发生，但尚未被证据证明。实际结论
              是，尽调应少看抽象热情，多看证据转化：具名试点、买方参考、安全和隐私材料、外部人员可测试的产品工作流、算力和烧钱披露，以及能够说明公司在规模扩大后不再只是单一创始人叙事的治理材料。在这些材料出现前，缓释方向合理但仍偏愿景，剩余敞口保持高位，因为本报告承销的是未来披露，而不是当前披露。
