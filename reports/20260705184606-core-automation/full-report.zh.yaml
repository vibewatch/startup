      - number: '8.6'
        title: 退出准备度、论点失效触发器与最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              OpenAI 和 Anthropic 同步走向 2026 年末 IPO，估值各自接近 $1 trillion，说明前沿实验室退出窗口正在打开；但这个窗口首先为规模最大、披露最多的实验室打开，Core
              Automation 自身没有披露近期退出路径 (CV046)。最关键的论点失效触发器包括：后续融资停滞或低于目标，出现 SSI
              曾经历的关键研究员离职，十二个月过去仍没有产品或基准披露，或者监管备案与媒体报道条款相矛盾 (CV044, CV028, CV009)。如果更广泛的 AI 实验室融资收缩波及两个或更多可比新型实验室，将成为专属于
              Core Automation 所在层级的明确悲观情景确认
              (CV037)。在任何资本承诺可以被负责任承销前，优先级最高的未满足要求是：两轮融资条款的监管确认、任何产品或基准证据、客户或设计伙伴证据、股权结构表与优先权细节、已披露烧钱和算力承诺，以及创始人和关键研究员的留任条款；截至运行日，这些都不在公开记录中
              (CV045, CV052, CV054)。本次审阅期间无法访问覆盖 Core Automation 或其最接近可比公司的持牌二级市场或私募股权定价数据，因此仍无法判断 2026 年广泛记录的次前沿 AI
              初创公司二级市场折价是否也适用于这里 (CV055)。
