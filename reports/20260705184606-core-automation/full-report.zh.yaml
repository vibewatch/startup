      - number: '3.2'
        title: 前沿既有实验室：OpenAI、Anthropic 与 Google DeepMind
        blocks:
          - type: paragraph
            body: >-
              三大前沿实验室已经达到 Core Automation 尚未接近的规模和产品成熟度。OpenAI 在 2026 年 4 月发布
              GPT-5.5，明确面向智能体编码、电脑使用和「早期科学研究」营销；其官方研究页仍以产品前实验室无法匹配的节奏发布应用成果，例如 2026 年 6 月的基因组学基准 GeneBench-Pro。Anthropic
              在 2026 年 5 月完成 $65B Series H，投后估值 $965B，年化收入超过 $47B，已承诺多云算力覆盖 Amazon、Google/Broadcom TPU 和 SpaceX 的
              Colossus 数据中心，使 Claude 成为首个同时在三大主要云上运行的前沿模型。Google DeepMind 的 Gemini Deep Think
              模式已经运行一个内部自动化数学和科学研究智能体（代号「Aletheia」），可自主生成、验证并修订研究级证明，成果已提交同行评审场所——功能上就是 Core Automation
              所称「自动化研究过程」的同一野心，只是它已经在生产中运行并有公开成果。三者都不像 Core Automation 那样依赖单一已报道投资者来获得算力。
