      - number: '5.2'
        title: 架构论点：持续学习、后 Transformer 设计与系统代码自动化
        blocks:
          - type: paragraph
            body: >-
              对一家整体低调的公司来说，其技术论点异常明确。Core Automation 表示，它不认为 AI 的下一次阶跃来自更大的模型、更多数据和静态部署；它指向新的学习算法、优于 Transformer
              的架构，以及围绕高能力智能体搭建的实验室。这与当前研究前沿一致。2026 年面向 LLM
              的持续学习综述，把该领域定义为让模型适应不断演化的知识，同时限制灾难性遗忘；更广泛的灾难性遗忘文献也说得很清楚：这仍是艰难且未解决的系统问题，不是已经跑通的产品配方。后 Transformer
              综述又加了一层：研究者正积极探索替代路线，因为 Transformer 依然强大但有缺陷。换句话说，Core Automation
              瞄准的是一个真实技术问题，但不是无人竞争的问题。这个领域充满论文、基准和实现，公司最终的差异化必须来自可测能力和运行效率，而不能只靠品类标签。
