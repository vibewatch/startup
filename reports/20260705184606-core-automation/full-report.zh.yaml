      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >-
              三股力量把认知密集型自动化需求往上推。第一，能力正在迅速追近人类表现：在 OSWorld 基准上，智能体系统完成真实世界电脑任务的比例约 18 个月内从约 12% 升至约
              66%，但仍约每三次尝试失败一次（CM021）。第二，资本正集中流入这一领域：仅 2026 年第一季度，AI 初创公司就拿走了全球约 $300B 风险投资中的
              80-81%（CM028、CM029）；Gartner 预计到 2026 年底，40% 的企业应用会嵌入任务专用 AI 智能体（CM025）。第三，Thinking Machines Lab
              等资本充足的前沿实验室正在锁定数十亿美元算力交易和吉瓦级 Nvidia 硬件承诺（CM030），说明严肃资本相信 Core Automation
              自动化研究命题的某个版本具备可投资性。三股力量反向拉扯。信任与治理落后于能力：只有 21% 的组织报告已有成熟的自主智能体治理模型；Gartner 另预计，到 2027 年底，40% 的智能体 AI
              项目会因成本、ROI 和风险控制顾虑被取消（CM043）。即便组织开始实验，真正规模化者也很少：2025 年 11 月的一项调查发现，只有 23% 在单一职能内规模化智能体，跨多个职能规模化的比例低于
              10%（CM036）。算力本身也是瓶颈：受 TSMC 封装和 HBM 内存约束推动，H100/H200 交付周期达 36-52 周，这把资本充足的既有玩家推向多年预留合同，而 Core Automation
              这样规模更小、更新的进入者很难匹配（CM032、CM033）。
