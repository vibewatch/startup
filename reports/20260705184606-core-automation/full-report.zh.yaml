      - 论据
      - 改变判断的证据
    rows:
      - - 正向论点
        - 创始团队履历和持续学习论点，指向在位者尚未解决的真实前沿研究缺口。
        - 经验证的基准测试或模型发布，证明该论点能在实践中跑通。
      - - 正向论点
        - SSI、Thinking Machines、World Labs、Periodic Labs 等尚未有产品的同类实验室，成立不久后都以数十亿美元估值融资，说明该类别仍拿得到资金。
        - 同类新型实验室若出现降价轮或后续融资失败，会削弱这一比较。
      - - 正向论点
        - 即使尚未确认，据报道 $300M-$500M 后续融资兴趣表明，种子轮后仅数月投资人需求仍在。
        - 确认后续轮搁浅，或定价显著低于报道的 $4B 目标。
      - - 反论点
        - 公司没有提交 SEC Form D，也未披露产品、客户或收入，外部尽调无法核验估值。
        - 确认的 Form D 备案，或公开产品 / 基准测试披露。
      - - 反论点
        - 2026 年 AI 风险投资异常集中在少数前沿实验室，并出现 ARR 通胀和泡沫动态迹象，可能压缩可比倍数。
        - 证据显示 AI 领域 VC 集中度和倍数在正常化，而不是泡沫。
      - - 反论点
        - 至少两家资金充足、论点相邻的竞争者（Adaption Labs 和 AMI Labs）在押注重叠方向，提高了 Core Automation 不是品类赢家的风险。
        - 相对这些对手，出现清晰技术或商业差异化证据。
    notes: 论据综合来自本章引用的声明和来源；不是单一一手来源表。
    claimRefs:
      - CV017
      - CV026
      - CV034
      - CV009
      - CV029
      - CV050
  - id: TV003
    title: 牛市、基准与熊市场景
    columns:
      - 场景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 牛市
        - 持续学习论点在 12-18 个月内产出有基准验证的能力；后续轮接近报道的 $4B 目标完成，并由战略算力或云合作伙伴锚定。
        - 估值可能向 Thinking Machines 和 World Labs 在类似阶段达到的 $8-12B 区间重估，为种子投资人带来数倍账面升值。
        - 技术论点无法与在位者内部自动化工具拉开差异；算力成本超过已募资金承受能力。
        - 低至中：同类实验室达到过类似估值，但尚无一家围绕 Core Automation 的精确论点推出商业产品。
      - - 基准
        - 公司继续靠团队履历和叙事融资，没有公开产品；后续轮在报道的 $4B 目标附近或以下完成，同时投资人保护更重。
        - 估值保持在 $2-4B 区间，有账面升值，但在最终推出产品或被收购前多年无法实现流动性。
        - 执行滑坡、关键研究员离职（如 SSI），或预期后续轮推迟或缩水。
        - 中等：与本章审视的 2024-2026 年新型实验室主流模式一致。
      - - 熊市
        - 后续轮搁浅或以降价轮定价；AI 领域 VC 集中度收紧到最大实验室周围，投资人要求收入证明；人才流向资金更充足的实验室。
        - 估值压缩至约 $1B 种子轮估值或更低；早期支持者面临重大减记，符合 2026 年次前沿 AI 初创在二级市场折价的记录。
        - 算力或人才成本结构迫使公司折价出售或关闭，符合 2026 年 AI 封装层和新型实验室失败模式。
        - 考虑到 2026 年智能体式 AI 和 AI 封装层初创公司已出现出清迹象，概率中至高。
    notes: 假设和逻辑是报告作者基于可比样本和 2026 年市场证据形成的场景综合，不是公司指引。
    claimRefs:
      - CV041
      - CV042
      - CV040
      - CV037
      - CV038
  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标
      - 估值 / 状态
      - 与 Core Automation 的相关性
      - 局限
    enumerationScope:
      coverage: partial
      basis: >-
        Non-exhaustive list of 2024-2026 frontier-adjacent AI labs and neolabs with disclosed or credibly reported
        funding and valuation data, drawn from independent press and analyst coverage reviewed through the 2026-07-05
        run date.
    rows:
      - - Core Automation
        - 报道的 $100M 种子轮；$300-500M 后续轮讨论
        - 据报道种子轮估值约 $1B；后续轮目标约 $4B，均未经 SEC 确认
        - 标的公司
        - 两个数字均无独立确认；没有收入或产品基础
      - - Safe Superintelligence (SSI)
        - 累计融资约 $3B
        - $32B（2026），高于 $5B 种子轮（2024）
        - 最接近的类比：没有公开产品，估值由创始人履历和算力合作驱动
        - 不到一年约 6x 升值，且没有已发布产品；近期有联合创始人离职
      - - Thinking Machines Lab
        - 种子轮
        - $12B（2025 年种子轮）
        - 创始人履历驱动的新型实验室可比对象；后来加深与 Google 的关系
        - 背后有后来扩大的 Google 战略交易支撑，而 Core Automation 尚未披露类似安排
      - - AMI Labs
        - 融资 $1.03B
        - 除融资规模外未披露
        - 论点相邻的直接竞争者（世界模型）
        - 估值倍数未公开
      - - World Labs
        - $230M 种子轮（2024），随后 $1B 轮（2026 年 2 月）
        - 约 $1B（2024）升至报道的约 $5B 目标（2026）
        - 可比轨迹：约 18 个月内快速重估至数十亿美元
        - 已有商业产品 Marble 和具名战略投资人，不同于 Core Automation
      - - Periodic Labs
        - $300M 种子轮（2025 年 9 月），随后洽谈 $500M（2026 年 5 月）
        - $1.3B 升至报道的 $7.5B 目标
        - 面向科学 AI 的新型实验室可比对象，8 个月内约 6x 升值
        - 截至来源日期，交易仍在洽谈，尚未完成
      - - Mistral AI
        - 迄今融资约 $4B
        - €11.7B（2025 年 9 月）升至报道约 €20B 目标（2026）
        - 后期可比对象，显示已有产品和收入的实验室仍可继续重估
        - 已有产品和收入；不是干净的无产品阶段可比对象
      - - xAI
        - $20B Series E 轮（2026 年 1 月）
        - ~$230-250B
        - 说明一个披露使用量（600M MAU）的前沿实验室，相对披露前的新型实验室，规模能走多远
        - 规模和披露使用量使其很难直接类比尚未有产品的公司
      - - Hebbia
        - 融资 $130M
        - $13M 盈利性收入支撑 $700M 估值
        - 对照案例：产品层竞争者按已披露收入定价，而非仅靠履历
        - 不同商业模式（企业软件 vs. 研究实验室）
    notes: 估值均为媒体报道，未经审计或监管确认；进行中轮次（Core Automation、Periodic Labs、Mistral）的数字反映报道目标，而非已完成条款。
    claimRefs:
      - CV006
      - CV007
      - CV012
      - CV015
      - CV017
      - CV018
      - CV020
      - CV022
      - CV023
      - CV024
  - id: TV005
    title: 论点破裂与终止触发项
    columns:
      - 触发项
      - 阈值
      - 对论点的传导
      - 行动含义
    rows:
      - - 确认降价轮或后续轮搁浅
        - 后续轮以低于约 $2B 完成，或报道洽谈后 6 个月内未完成
        - 表明投资人需求弱于媒体报道暗示
        - 将估值立场下调为昂贵；暂停进一步尽调
      - - 关键研究员离职
        - 创始人或具名前三研究员转投竞争者或对手实验室
        - 呼应 SSI 联合创始人离职，释放团队风险信号
        - 重新评估团队履历溢价；视为红旗
      - - 12 个月内没有产品或基准测试披露
        - 到 2027 年中仍没有公开模型卡、基准测试或付费试点
        - 确认公司未向可交付产品收敛
        - 如无新证据，建议回避
      - - SEC 或监管备案披露实质不同条款
        - Form D 或其他备案显示估值、结构或投资人条款与媒体报道不一致
        - 削弱本章所有媒体来源估值主张的可靠性
        - 基于备案条款重新承做投资测算，而非媒体报道
      - - 更广泛 AI 实验室融资收缩
        - 两家或更多可比新型实验室遭遇降价轮或关闭
        - 确认 2026 年来源记录的全行业清算已传导至新型实验室层
        - 将其视为 Core Automation 的熊市触发项
    notes: 阈值是报告作者用于监控的判断，不是公司披露的契约条款。
    claimRefs:
      - CV044
      - CV028
      - CV009
      - CV037
  - id: TV006
    title: 最终尽调要求
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 尽调路径
    rows:
      - - 融资监管确认
        - 种子轮和后续轮的 Form D 或最终轮次文件
        - ~$1B 和 ~$4B 数字只来自媒体报道
        - 直接向公司或其律师索取股权结构表和轮次文件
      - - 产品或基准测试证据
        - 任何模型卡、基准测试结果或可运行演示
        - 截至运行日期，没有公开产品技术证据
        - 要求安排技术尽调会议，提供可运行演示或基准测试
      - - 客户或设计伙伴证据
        - 任何具名试点、设计伙伴或意向书
        - 没有客户证据支撑上市路径论点
        - 要求与任何已披露设计伙伴进行推荐访谈
      - - 股权结构表和优先权条款
        - 清算优先权栈、董事会组成、反稀释条款
        - 决定新资金的下行保护和有效所有权
        - 索取报道中后续轮的股权结构表和条款清单
      - - 烧钱速度和算力承诺
        - 披露的现金消耗、跑道和算力合同
        - 判断报道融资规模是否符合前沿实验室资金密集度常模
        - 索取财务报表或数据室
      - - 人才留存和关键人风险
        - 具名研究员的股权归属安排和留存条款
        - SSI 联合创始人离职表明，履历驱动估值暴露于关键人风险
        - 索取创始人和顶尖研究员的留存 / 归属条款
    notes: 尽调要求按最能改变建议或可接受入场价格的因素排序，而非按收集难易度排序。
    claimRefs:
      - CV045
      - CV052
      - CV054
      - CV028
