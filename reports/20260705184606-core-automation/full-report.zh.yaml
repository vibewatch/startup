              Core Automation 的公开材料把使命说得很清楚，却没有同样清楚地定义产品。官网称公司在打造「世界上最自动化的 AI
              实验室」，希望系统能优化并自动化工作，并从研究本身开始。这个表述很关键，因为它把当前交付物更像放在内部研究操作系统的位置，而不是已经对外发布的应用。Nextomoro 2026 年 5
              月的画像强化了同一判断：这是一家聚焦自动化前沿 AI 研究工作流、并试图用更自适应学习算法替代大规模预训练的实验室。同样重要的是缺失项：没有公开 API 文档页、没有产品定价、没有状态页面、没有模型卡，也没有
              Ceres 或任何其他具名模型的基准测试表。因此，本产品章节必须把概念资产和已验证资产拆开。公开层面，真正的资产是论点、人才画像和系统叙事；外部产品界面仍像是内部使用、发布前状态，或尚未披露。
