  - id: TP001
    title: 竞争对手画像表
    columns:
      - 竞争对手
      - 类别
      - 规模 / 融资
      - 目标细分市场
      - 差异化
      - 局限
    rows:
      - - OpenAI
        - 前沿在位者
        - ~$852B 估值（2026 年 3 月轮次）；该轮融资约 $122B
        - 消费者 + 企业 + 开发者 API
        - 分发最广（ChatGPT、API、Codex）；GPT-5.5 瞄准智能体编程和「早期科学研究」
        - 2025 年泄露财务数据显示，收入约 $13B、经营亏损约 $21B；严重依赖 Oracle / Stargate 算力
      - - Anthropic
        - 前沿在位者
        - $965B 投后估值（2026 年 5 月 Series H）；年化收入约 $47B
        - 企业（Claude Code/Cowork）+ 开发者 API
        - 多云算力（AWS/Google/SpaceX）；在前沿实验室中企业收入增长最快
        - 与 OpenAI 一样，面临看空分析师指出的补贴使用和泡沫风险敞口
      - - Google DeepMind
        - 前沿在位者
        - 由 Alphabet 资产负债表供资；未披露独立估值
        - 消费者（Gemini）+ 企业 + 研究
        - Gemini Deep Think 已经自动化研究智能体工作流（「Aletheia」），并产出同行评审成果
        - 研究自动化只是众多产品线之一，不是 Core Automation 那样押注到公司层面的专门赌注
      - - Thinking Machines Lab
        - 新实验室 / 论点相邻
        - $2B 种子轮，估值 $12B（2025）
        - 研究员 / 开发者（开放权重微调）
        - 已发布 Tinker（2025 年 10 月），进入收入轨道；创始人 Mira Murati 曾任 OpenAI CTO
        - 重点是微调基础设施，不是持续学习或自动化内部研究
      - - Safe Superintelligence
        - 新实验室 / 论点相邻
        - 已融资 ~$1B+；报道估值约 $32B
        - 未披露（无产品）
        - 创始人 Ilya Sutskever 的 OpenAI 联合创始人 / 首席科学家履历，让投资人给出超常信任
        - 无公开路线图或产品；单一目标使命不如 Core Automation 所称论点具体
      - - AMI Labs
        - 新实验室 / 论点相邻（世界模型）
        - $1.03B 种子轮，投前估值 $3.5B（2026 年 3 月）
        - 医疗（Nabla）优先，之后机器人 / 科学
        - Yann LeCun 基于 JEPA 的「世界模型」论点，是资金充足且不同于 LLM 扩展和持续学习的另一条路线
        - 未披露收入计划；商业化应用前仍有多年研究窗口
      - - Adaption Labs
        - 新实验室 / 论点相邻（持续学习）
        - $50M 种子轮（2026 年初）
        - 需要即时模型适配的企业
        - Sara Hooker 的「无梯度」持续学习论点几乎与 Core Automation 的核心押注相同，但披露估值低得多
        - 资本基础远小于 Core Automation 报道中的 $1B-$4B 区间；规模化未验证
      - - Reflection AI
        - 新实验室 / 论点相邻（开放前沿模型）
        - $8B 估值（2025 年末）；洽谈 $25B 投前估值融资（2026 年 3 月）
        - 企业 + 政府（主权 AI）
        - Nvidia 支持；明确采用开放权重策略，瞄准「西方替代方案」叙事
        - 截至运行日尚未发布模型；变现计划未验证
      - - Sakana AI
        - 相邻区域 / 效率型玩家
        - $2.65B 估值；累计融资约 $379M（2025 年 11 月）
        - 日本企业（金融、工业、政府）
        - 为语言 / 文化适配的高效小数据模型，而非前沿规模路线
        - 地域和技术范围都比 Core Automation 的全球前沿雄心更窄
      - - FutureHouse
        - 相邻 AI 科研同行
        - 非营利；慈善资金支持
        - 学术界生物 / 科学研究人员
        - 已推出多个研究智能体系统（Robin、DISCO、OXtal），并发布可复现成果
        - 非营利结构，且聚焦范围更窄的生物 / 科学研究；相比之下，Core Automation 的自动化研究雄心更宽
      - - Glean
        - 产品层 / 企业知识工作自动化
        - $7.2B 估值；ARR 约 $300M（2026 年估算）
        - 企业 IT / 知识工作者
        - 100+ 个 SaaS 集成、权限感知搜索、已付费的 Fortune 500 客户群
        - 横向聚合器，不是前沿模型开发商；竞争点在工作流层，不在底层研究
      - - Hebbia
        - 产品层 / 企业知识工作自动化
        - $700M 估值；披露 ARR 约 $13M（2024 年）
        - 金融服务、法律（资产管理公司、银行）
        - 垂直尽调 / 文档分析产品，已被约 30% 资产管理公司使用
        - 垂直范围窄；不是通用自动化研究平台
      - - Manus
        - 产品层 / 智能体工作流自动化
        - Meta 约 $2B 收购存在争议；据报 ARR 约 $125M（2026 年 1 月，第三方估算）
        - 消费者 + 企业（智能体任务自动化）
        - 基于第三方模型（Claude、Qwen）的编排层；消费者 / 企业产品已上线
        - 所有权状态存在争议（中国国家发改委要求 Meta 撤销交易，2026 年 6 月）；自身不开发前沿模型
    notes: >-
      规模 / 融资数字混合了已披露轮次、第三方估值估算以及不同时间点（2024-2026 年）的分析师 ARR 估算；应视为方向性证据，而非审计数据。覆盖范围是截至本轮报告日期，与 Core Automation
      所述论点和产品层最相关的 AI 研究 / 智能体实验室与知识工作自动化厂商代表性样本，不是所有 AI 公司的穷尽清单。
