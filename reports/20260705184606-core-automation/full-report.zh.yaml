  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: Core Automation 的隐含加价倍数会大幅摆动，取决于产品证明能否落地、行业融资环境如何， 以及融资是否卡住。
    data:
      items:
        - label: 后续融资按报道的 $4B 目标完成
          value: 4
          detail: 若后续融资按报道完成，隐含倍数相对于报道的 ~$1B 种子轮估值计算。
          tone: warning
        - label: 典型后期 AI 倍数压缩（25-40% 折价）
          value: 2.6
          detail: 对报道的后续融资目标施加的示意性折价。
          tone: negative
        - label: 基准测试 / 产品证明落地（向同业区间重估）
          value: 10
          detail: 示意性重估至 Thinking Machines 和 World Labs 触及的 $8-12B 区间。
          tone: positive
        - label: 12 个月内无产品披露（悲观情形）
          value: 1
          detail: 若没有任何披露，加价倍数持平，不触发重估。
          tone: negative
        - label: AI 行业融资整体收缩
          value: 0.6
          detail: 若两个或更多可比 AI 新实验室遭遇降价轮，示意性下调至报道种子轮估值以下。
          tone: negative
    approximationNotes: 这些数值是不同驱动情景下、相对于报道的 ~$1 billion 种子轮估值的示意性倍数；由于缺少财务披露， 并非来自已披露收入或 DCF 模型。
    claimRefs:
      - CV011
      - CV035
      - CV040
      - CV048
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: Core Automation 的可行估值结果跨度约 20x，取决于披露和产品证明能否落地。
    data:
      items:
        - label: 悲观情形
          low: 0.5
          mid: 0.8
          high: 1
          displayValue: $0.5B-$1.0B
          detail: AI 行业融资整体收缩时，后续融资卡住，或按降价轮定价。
          tone: negative
        - label: 基准情形
          low: 2
          mid: 3
          high: 4
          displayValue: $2B-$4B
          detail: 后续融资在报道的 $4B 目标附近或以下完成，投资者保护条款更重。
          tone: warning
        - label: 乐观情形
          low: 8
          mid: 10
          high: 12
          displayValue: $8B-$12B
          detail: 12-18 个月内拿出可基准测试的产品证明，估值向 Thinking Machines / World Labs 梯队重估。
          tone: positive
    approximationNotes: 区间为示意性判断，锚定乐观 / 基准 / 悲观情景表和可比样本结果；由于缺少财务披露， 并非正式估值模型。
    claimRefs:
      - CV041
      - CV042
      - CV040
      - CV048
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: Core Automation 在市场规模和团队履历上得分较高，但产品证明、经济性和证据质量偏弱。
    data:
      items:
        - label: 市场
          score: 7
          detail: 相邻市场很大（前沿实验室自动化、企业级智能体 AI），但尚无专属品类规模测算。
          tone: positive
        - label: 证明
          score: 2
          detail: 截至报告生成日，未见公开基准测试、模型卡或可用演示。
          tone: negative
        - label: 护城河
          score: 5
          detail: 团队履历和持续学习论点可信，但尚未通过已发布产品验证。
          tone: warning
        - label: 经济性
          score: 2
          detail: 未披露收入、烧钱速度或单位经济性。
          tone: negative
        - label: 风险
          score: 3
          detail: 风险章节和本章可比样本先例显示，关键人、融资和市场时点风险都高。
          tone: negative
        - label: 估值
          score: 3
          detail: 种子轮到后续融资的加价未经验证，估值偏高至昂贵。
          tone: negative
        - label: 证据质量
          score: 4
          detail: 仅有媒体佐证，未见监管备案或公司披露。
          tone: warning
    approximationNotes: 评分是面向 IC 讨论、基于公开证据集综合形成的 0-10 顺序判断，不是公司披露的评分卡。
    claimRefs:
      - CV003
      - CV004
      - CV009
      - CV026
      - CV047
