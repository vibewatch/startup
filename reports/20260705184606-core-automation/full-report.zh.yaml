      - number: '8.2'
        title: 建议、置信度、风险与估值立场
        blocks:
          - type: paragraph
            body: >-
              本章建议是跟踪，不买入。推理链从 Core Automation 的产品发布前、收入前状态和未经确认的融资记录出发，经过其可比公司集中体现的关键人物和市场时点风险，最后落到「偏高到昂贵」的估值立场 (CV001,
              CV043)。这一判断的置信度为中等：四家独立媒体交叉印证了所报道的种子轮和后续融资数字，但没有任何报道获得监管备案确认，全文 EDGAR 搜索截至运行日也没有返回公司的 Form D 结果 (CV002,
              CV009)。风险评级为高。最接近的公开可比公司 Safe Superintelligence 是一家产品发布前的前沿实验室，其联合创始人在据报道出现收购兴趣后转投竞争实验室，说明即便估值最高的产品发布前 AI
              实验室，也暴露于关键人物风险；Core Automation 这种小而履历集中的团队也会承担同类风险 (CV003, CV028)。估值立场为偏高到昂贵，因为报道中的估值在数周内从约 $1 billion
              爬升到约 $4 billion，却没有披露产品、客户或收入锚点；尽管类似的快速重估模式在至少五家可比新型实验室中反复出现 (CV004, CV026,
              CV027)。按市场、证据、护城河、经济性、风险、估值和证据质量打分，Core Automation 最强的是市场规模和团队履历，最弱的是证据和经济性披露，这种失衡更符合跟踪而不是买入
              (CV047)。实际含义是，在公司披露足以检验报道价格的产品、收入或备案证据之前，暂不投入新资本 (CV005)。
