            body: >-
              Core
              的财务和战略依赖异常交织。公司尚无收入，公开商业模式看起来也更像资本密集型研究机构，而不是软件公司；因此额外融资不是增长加速器，而是证明论点的前提。如果公司在空白市场建设，这会更容易承销。但事实相反，企业 AI
              采购正在收紧，在位厂商和开源已经把相邻界面产品化。Microsoft 公开主张，模型优势会压缩进工作流和数据集成；Google 销售受治理的企业智能体平台；AWS 销售智能体式编码和开发工作流；GitHub
              销售企业政策和审计功能；开源项目现在也在宣传低成本、OpenAI 兼容的大规模服务能力。风险不在于 Core 没有技术洞察，而在于公开差异化故事可能比公司商业化更快收窄。如果买方已经能从在位厂商
              技术栈获得智能体式工作流价值、安全材料和采购舒适度，Core 就需要比「未来自动化实验室优势」更尖锐的证据，来同时支撑采用和估值。
