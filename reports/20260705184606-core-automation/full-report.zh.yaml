  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              Core Automation 的多头逻辑，建立在一个拥有可信前沿研究履历的创始团队上；团队追求持续学习和智能体系统自动化论点，而现有大型实验室尚未在公开层面解决这个问题。更广泛的 2024–2026
              年模式也支撑这一论点：Safe Superintelligence、Thinking Machines Lab、World Labs 和 Periodic Labs
              等可比的产品发布前实验室，都能在创立数月内以数十亿美元估值融资，说明即便没有已发布产品，资本也愿意投向这个精确品类 (CV012, CV015, CV018, CV020, CV026,
              CV050)。如果得到确认，在种子轮后仅数周就有 $300–500 million 后续融资兴趣，将进一步证明投资人需求仍在 (CV007)。反论点至少同样强。Core Automation 没有提交 SEC
              Form D，加州公司注册 文件只确认实体存在，并不能确认任一轮融资条款 (CV009)。没有产品、基准、客户或收入证据公开，因此估值无法接受除媒体报道和可比公司模式匹配之外的检验 (CV008,
              CV034)。同时，2026 年 AI 风险资本异常集中于少数前沿实验室，并出现了有记录的 ARR 膨胀和泡沫动态，可能压缩可比新型实验室目前享有的倍数 (CV029,
              CV030)。至少两家资金充足、论点相邻的竞争对手也在独立追逐重叠赌注，这削弱了 Core Automation 是明确品类赢家、而非多个类似定位进入者之一的判断 (CV017)。
            claimRefs:
