      - number: '4.5'
        title: 融资市场风险：AI 融资狂热与算力稀缺的不利证据
        blocks:
          - type: paragraph
            body: >-
              几个彼此独立的警示信号，直接关系到 Core Automation 未来融资环境是否还能保持友好。Sequoia Capital 合伙人 David Cahn 的 AI 基础设施收入缺口框架，从
              2023–2024 年估算所需年化 AI 收入 $200 billion，上升到 2026 年约 $600 billion；原因是超大规模云厂商的 AI 资本开支增长快过已经兑现的 AI
              收入。评论者越来越常把这个缺口类比为电信产能泡沫：供应商融资推高建设，真实需求不足时迅速回调。另一路证据来自 MIT NANDA 项目报告 "The GenAI Divide: State of AI in
              Business 2025"。该报告基于 300 个 AI 部署和 150 次高管访谈，发现 95% 的企业生成式 AI 试点未能交付可衡量的财务
              ROI；这对任何最终商业化依赖企业看到可量化价值的研究自动化公司都是警示。供给侧，Nvidia Blackwell 芯片的 GPU 租赁价格据称在 2026 年 4 月升至每小时 $4.08，60 天上涨
              48%；同期算力短缺据报道已导致 Anthropic 宕机，并迫使 OpenAI 取消部分产品计划，Bank of America 还预计需求将到 2029 年前持续超过供给。Nvidia
              本身——另有报道显示它参与了 Core Automation 的首轮融资——在 2026 年承诺超过 $40 billion 的 AI 股权投资，其中包括对 OpenAI 约 $30 billion
              的持股；同时还有算力额度和收入分成交易，Goldman Sachs 分析师将其标记为可能夸大真实终端需求的「循环收入」风险。这些都不能证明 Core Automation
              本身参与了循环融资安排，但提供了一条合理传导路径：一旦 Nvidia 的 AI 股权策略或算力价格转向，公司的融资可得性或成本基础可能受到影响。
