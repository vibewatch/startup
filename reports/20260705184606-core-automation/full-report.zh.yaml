      - number: '2.3'
        title: 买方、用户与从试点走向生产的路径
        blocks:
          - type: paragraph
            body: >-
              在四个边界内细分市场里，买方、用户和付款方的拆分方式不同。前沿实验室内部，研究自动化买方是实验室自己的 CTO 或研究负责人，资金来自实验室算力 / 运营费用预算，研究工程师是直接用户（Table
              TM003）。企业内部则延续更熟悉的模式：CIO、COO 或职能副总裁用现有 IT 或运营预算资助试点，而不是专设「AI
              智能体」预算线；分析师和普通员工是日常用户（CM040）。买方意向很广：MuleSoft/Deloitte Digital Connectivity Benchmark 调研中，93% 的 IT
              领导者计划在两年内引入自主智能体（CM041）；Deloitte 也单独把研发列为企业选择智能体 AI 的顶部用例之一，与客户支持、供应链和网络安全并列（CM046）。但意向不等于 Core Automation
              具体赌注的已验证买方：最接近 AI 驱动研究自动化的证明点——Anthropic 的 Claude Science 和 Sakana AI 的 AI
              Scientist——来自已经占优、资本充足的既有玩家，且建立在标准 Transformer 模型上，不是等待新进入者填补的空白市场（CM042）。Figure FM003
              描绘从研究命题到企业级工作流嵌入的通用采用路径；Figure FM004 则从广泛的智能体实验收窄到近乎为零的、已部署且专门验证持续学习研究自动化产品的基数，这一基数才会验证 Core Automation
              的特定命题。
