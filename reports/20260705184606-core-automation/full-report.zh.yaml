      - number: '1.2'
        title: 创始人、领导层与团队
        blocks:
          - type: paragraph
            body: >-
              Jerry Tworek 是 Core Automation 的 CEO 兼联合创始人，在 OpenAI 工作近七年：2019 年加入时公司约有 30 名员工，后来升任研究副总裁。他主导了 o1 和 o3
              推理模型开发，参与 GPT-4 后训练和 2025 年 GPT-5 部署，也做过 Codex 代码生成线和早期机器人强化学习。2026 年 1 月 5 日，他私下告诉 OpenAI
              同事自己打算离开；几天后，离职消息在一波 OpenAI 高管出走中公开。他称离开是为了追求在 OpenAI 内部「很难做」的研究。Mark Saroufim 是以 PyTorch 和 GPU MODE
              社区工作知名的系统工程师，公开身份为联合创始人，并撰写了公司第一篇详细技术博客。公司和第三方来源还提到多名加入创始团队的研究人员：Rohan Anil 与 Anmol Gulati（均曾在 Google
              DeepMind，Anil 还曾在 Anthropic）、Joanne Jang（前 OpenAI 总经理）、Ehsan Amid 与 Avery Lamp（前 DeepMind）、Julia
              Villagra（前 OpenAI 人才负责人），以及 Sai Surya Duvvuri（前 Google/Meta 研究实习生）。但核查时，其中几人的公开 X 账号要么零发帖，要么私密 /
              不可用；公司也没有公开披露董事会或治理结构，关键人物风险和治理问题仍未解决。
