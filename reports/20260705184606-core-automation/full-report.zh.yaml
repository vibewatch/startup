      - number: '8.5'
        title: 可比估值图谱
        blocks:
          - type: paragraph
            body: >-
              最相关的可比公司是 Safe Superintelligence。它在 2025 年以 $32 billion 估值融资约 $2 billion，尽管没有面向公众的产品；此前它在 2024 年以 $5
              billion 估值融资 $1 billion，意味着一支约 20 人团队不到一年估值增长超过六倍 (CV012, CV013)。Thinking Machines Lab 的种子轮估值据报道为 $12
              billion，后来通过一项新的数十亿美元交易加深了与 Google 的联系；Core Automation 还没有披露这种战略验证 (CV015, CV016)。World Labs 和 Periodic
              Labs 都说明产品发布前相邻实验室可以多快重估：World Labs 从 2024 年 $1 billion 种子轮估值，到 2026 年 2 月发布商业产品后瞄准据报道约 $5
              billion；Periodic Labs 则在不到八个月内，从 $1.3 billion 走到据报道 $7.5 billion 的洽谈 (CV018, CV019, CV020, CV021)。Mistral
              AI 和 xAI 等后期实验室显示，即使公司已有发布产品、披露使用量和收入，重估仍会继续；但这也让它们对 Core Automation 这类披露前公司来说，直接可比性更弱 (CV022,
              CV023)。相比之下，产品层竞争对手 Hebbia 和 Glean 的定价基于披露的盈利收入或具名企业客户基础，而不是单靠履历，这凸显出 Core Automation 目前披露少得多 (CV024,
              CV025)。在整个集合里，产品发布前的前沿研究实验室估值主要由创始人履历、算力合作和叙事动能驱动，而不是由披露指标驱动；这让 Core Automation 报道中的加价方向与同类公司一致，却无法独立对照验证
              (CV026, CV027, CV051, CV049)。
