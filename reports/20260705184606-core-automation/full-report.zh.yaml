      - number: '2.5'
        title: 持续学习与后 Transformer 研究为何可能具备经济意义
        blocks:
          - type: paragraph
            body: >-
              Core Automation 的技术赌注是：持续学习——让模型不必从零重训也能保持最新——以及比 Transformer 更易扩展的架构，最终可能降低前沿 AI 的训练数据和算力成本，直接抵消本章其他部分记录的
              GPU 稀缺（CM044）。这个研究方向真实且活跃，并不边缘：Google Research 的「Nested
              Learning」范式及其「Hope」架构，把模型重构为嵌套、自我修改的优化问题，目标是保留长周期记忆（CM010、CM011）；Mamba-3 是 2026 年获 ICLR oral
              接收的状态空间模型架构，声称以约一半推理成本达到或超过 Transformer 基线的困惑度表现（CM012、CM013）。截至 2026 年中，这些都还不构成经过验证、可在前沿规模商业替代
              Transformer 模型的方案（CM014）；本次审阅也没有任何来源发布这一研究类别的美元市场规模（CM009、CM045）。证明自动化研究本身可行，比证明持续学习本身可行更容易：Sakana AI 的 AI
              Scientist 产出了一篇发表于 Nature 的论文，描述一个能够提出假设、运行实验并撰写稿件的智能体（CM015）；更早版本通过了真实同行评审（CM016），代码也已开源（CM017）。Anthropic
              的 Claude Science 为科学家推进类似的工作流自动化命题，但没有交付新模型（CM018）；Anthropic 还单独报告称，其生产代码中超过 80% 现在由 Claude 编写，相比
              2021-2025 年基线提高 8x（CM019）——这一点应谨慎看待，因为它是公司自报、未经审计的数据（CM020）。合起来看，证据更强地支持「自动化研究是可行的」，远不如支持「Core Automation
              的特定持续学习方法已经被证明」。
