  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：Core Automation 实际卖向哪里
        blocks:
          - type: paragraph
            body: >-
              Core Automation 还没有产品，因此本章定义的是它瞄准的市场，而不是它当前服务的市场。四类需求锚定这个目标：前沿 AI 实验室研究自动化工具（最接近公司「自动化 AI
              实验室」的自我表述）、企业知识工作和报告自动化、持续学习与后 Transformer 模型研究，以及 AI for science
              发现自动化。本章审阅的分析机构没有一家把这四类作为单一条目跟踪；即便有测算，也被放进更宽的「智能体 AI」「AI 软件」或「机器人流程自动化」桶里（Table
              TM001）。还有两类与边界保持距离，而不是落在边界内：传统规则型 RPA，它自动化的是重复任务，不是开放式认知工作；以及工业 / 物理 AI 自动化，World Economic Forum 和 BCG
              将其描述为建立在硬件具身机器人上的平行「自主工作」命题，而不是纯软件研究工具（CM037、CM038、CM039）。因此，Core Automation
              所述赌注的现状替代品不是单一竞争者类别，而是人类研究工程师、现有巨头的智能体式代码 / 研究助手，以及传统 RPA 的组合——这些今天已经拿走企业自动化预算。由于 Core Automation
              没有披露产品、定价或客户，本节把四个边界内类别当作后续章节的方向性框架，而不是公司已经验证的可服务市场。
            claimRefs:
