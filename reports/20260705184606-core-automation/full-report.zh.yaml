      - number: '2.6'
        title: 不利证据与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              企业采用的标题数字掩盖了从采用到影响之间的巨大缺口，任何给 Core Automation 做市场规模测算都应对此打折。Stanford 2026 AI Index 报告称，组织 AI 采用率为 88%，生成式
              AI 使用率三年内达到 53%——扩散速度快于 PC 或互联网（CM022）；但 Deloitte 发现，只有 23% 的组织哪怕中等程度使用智能体 AI，且只有 21% 拥有成熟治理模型（CM023）。Axis
              Intelligence 交叉引用的「Deployment Gap Index」用另一种方式量化同一模式：93% 的 IT 领导者打算在两年内部署自主智能体，但只有 23%
              哪怕在单一职能中规模化部署，声明意向与生产现实之间相差 70 个百分点（CM024）。最常被引用的警示数据点是 MIT 2025 年「GenAI Divide」研究，覆盖 300 多个企业部署，发现 95%
              的组织从生成式 AI 试点中没有获得可衡量的 P&L 回报；失败原因归于集成浅、各自为政，而不是模型质量或监管（CM026、CM027）——这一警示至少同样适用于产品前的研究赌注，也适用于已经交付的生成式 AI
              工具。宏观层面，投资者 Michael Burry 公开把 2025-2026 年 AI 投资周期类比为 1999-2000 年互联网泡沫，认为 hyperscaler 的折旧会计低估了 AI
              基础设施支出的真实成本（CM034、CM035）。这些都不能证明 Core Automation 的具体命题会失败，但意味着它押注的需求环境，是 AI 行业迄今最资本密集、也最怀疑评估结果的环境。
            claimRefs:
              - CM022
