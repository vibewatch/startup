chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品命题与公司阶段
        blocks:
          - type: paragraph
            body: >-
              Core Automation 是一家私营、尚未产生收入的人工智能研究实验室，总部位于 California 州 San Francisco。公司官网和 X 账号把使命描述为打造「全球自动化程度最高的 AI
              实验室」，并明确押注：AI 能力的下一次跃迁，不会只是用更多数据训练更大模型，而会来自新的学习算法，取代大规模预训练和强化学习，再加上比 Transformer
              更易扩展的架构。公司旗舰研究方向在媒体报道中被称为「Ceres」，目标是在生产环境中持续学习，用比当前前沿模型少约 100x
              的训练数据完成更新；但这仍是未经验证、产品前的研究赌注，不是已经交付的能力。截至本次运行日期，Core Automation 自己的网站只露出首页、博客、损坏的团队页，以及联系 /
              招聘链接——没有产品、定价或注册入口——这与第三方报道（Sacra）一致：公司没有公开 API、定价页或商业产品。公开报道把公司成立时间放在 2026 年 3 月，但至少有一个说法称融资活动在「1
              月底成立后不久」就开始了；这一公开记录冲突会在下文里程碑时间线进一步讨论。公司的阶段最适合描述为私营且未产生收入；目前没有公开披露正式融资轮次标签（例如「Series A」）。
