  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重程度排序的风险概览
        blocks:
          - type: paragraph
            body: >-
              Core Automation
              的核心风险不是单一法律事件或技术缺陷，而是节奏排序。公开证据仍把它描述为一家实验室优先的研究项目，想先自动化自己的工作；它还不是有客户、有信任材料、有外部买方可测试产品界面的商业平台。与此同时，第三方报道已经把公司放进前沿实验室级融资预期和估值叙事里。两者叠加，让产品、客户和披露证据的缺失，比普通种子期创业公司更关键。因此，公开风险图谱集中在三个相互关联的问题上：团队能否在资本预期跑得太远之前，把研究论点转化为买方愿意接受的产品；能否发布足够的信任和合规证据，缩短企业尽调；以及当在位厂商
              和开源已经大规模提供智能体、编码和基础设施界面时，公司能否守住差异化工作流。摘要风险登记把产品未成熟、客户证据缺失、融资依赖和商品化列为最高剩余敞口，因为如果证据不能快速改善，每一项都会放大下一项。
