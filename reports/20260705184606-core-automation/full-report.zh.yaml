            body: >-
              由于 Core Automation 没有披露员工数、薪酬或算力支出，本章用可比前沿实验室来基准化可能的成本驱动，而不是编造公司特定数字。行业薪酬报道显示，2026 年资深前沿 AI
              研究工程师总薪酬（基本工资、奖金和股权）约为每年 $500,000 到 $1.5M；顶级研究人员的离群套餐据报道最高可达四年 $300M，最大实验室单年签约奖金最高达
              $100M——这是前沿研究人才成本有多昂贵的极端例子。算力方面，OpenAI 报告 2026 年第一季度经营现金消耗约 $3.7B，同时计划 2026 年训练和算力支出约 $32B；据报道，Anthropic 到
              2026 年 4 月年化收入约达 $30B，但每年仍在算力上支出约 $6B-$10B，每月现金消耗约 $80M，其中超过 60% 用于云基础设施。Deloitte 报告称，单位 AI 推理成本两年内约下降 280
              倍，但企业 AI 总支出仍继续上升，因为使用量增长在全行业超过了效率提升——这一动态很可能同样适用于任何算力密集型研究实验室，包括 Core
              Automation。鉴于这种人才和算力密集、未产生收入的运营模式与这些同行相似，Core Automation 自身 burn 方向上可能落在可比区间；但公司没有披露特定数字，本次审阅也没有来源说明 Core
