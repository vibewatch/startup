      - number: '8.3'
        title: 融资背景、入场纪律与稀释悬置
        blocks:
          - type: paragraph
            body: >-
              媒体报道称，Core Automation 在 2026 年启动后数周内，以接近 $1 billion 估值完成约 $100 million 首轮融资，并正洽谈以约 $4 billion 为目标的
              $300–500 million 后续融资 (CV006, CV007)。合在一起，这些数字意味着公司在数周内寻求约四倍加价；即便按 2026 年 AI 实验室融资标准，这个间隔也异常短
              (CV011)。没有来源披露任何一项数字的收入、ARR 或使用量基础，因此无法计算标准倍数；也没有公开模型卡、基准或付费试点，能把价格锚定在团队履历和叙事之外的任何东西上 (CV008,
              CV052)。因此入场纪律应严格：这种从种子轮到后续融资的快速加价，通常会伴随更重的清算优先权和董事会保护给新投资人，但没有 股权结构表、条款书或优先权栈细节公开可用于为 Core Automation
              确认这一点，使任何新资本的有效所有权和下行保护都不清楚 (CV054)。本章审阅的最新融资报道日期为 2026 年 5 月；截至 2026 年 7
              月运行日，本轮没有发现任何来源报道后续融资已关闭、估值已修订或融资已放弃，因此融资叙事应在刷新前视为暂定 (CV053)。Nvidia 自己把对 OpenAI 的拟议 $100 billion 承诺重校准为
              OpenAI 接近 IPO 时的 $30 billion 实际持股，显示即便最大战略投资人也在 2026 年收紧 AI 实验室资本承诺规模；这也可能收紧 Core Automation
              这类规模更小、披露更少赌注的资金可得性 (CV039)。
            claimRefs:
              - CV006
              - CV007
              - CV011
              - CV008
              - CV052
              - CV054
              - CV053
              - CV039
      - number: '8.4'
        title: 乐观、基准与悲观情景
        blocks:
          - type: paragraph
            body: >-
              乐观情景下，Core Automation 在约 12–18 个月内发布经过基准验证的持续学习或智能体研究能力，按目标附近的 $4 billion 完成报道中的后续融资，并像 World Labs 与
              Autodesk 那样吸引一个战略算力或云合作伙伴，估值重估至 Thinking Machines Lab 和 World Labs 在类似阶段达到的 $8–12 billion 区间 (CV041,
              CV018, CV015)。基准情景下，公司继续靠团队履历和叙事融资，而没有公开产品；后续融资在报道目标附近或以下关闭，并附带更重的投资人保护，符合本章审阅的 2024–2026 年新型实验室集合中的主流模式
              (CV042, CV017)。悲观情景下，随着 AI 板块风险资本进一步向最大实验室集中、投资人要求收入证据，后续融资停滞或以下降轮定价；AI 包装层 创业公司中已经可见的全行业清算是最清楚的书面先例，截至
              2026 年中，至少 118 家公司倒闭、约 $49.9 billion 资本被毁，显示被炒作定价的 AI 公司可以多快失去价值；一份专门分析智能体 AI 估值的报告也发现，种子前 估值已经下降，且预计到
              2027 年超过 40% 的智能体 AI 项目会被取消 (CV037, CV038, CV040)。合理估值区间为：悲观情景约 $0.5–1 billion，基准情景 $2–4 billion，乐观情景
              $8–12 billion；这个区间锚定于情景逻辑和可比公司集合，而不是披露的财务模型 (CV048)。
