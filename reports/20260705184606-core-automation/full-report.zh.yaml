      - number: '2.2'
        title: 相邻市场测算：多重视角，没有单一 TAM
        blocks:
          - type: paragraph
            body: >-
              没有发布方专门给前沿实验室研究自动化或持续学习工具拆出美元规模，因此本节叠加现有相邻视角，而不是断言一个数字。最宽的一层，Gartner 预计 2026 年全球 AI 总支出为 $2.59T，同比增长
              47%（CM002）；它标为「智能体 AI」能力支出的较窄切片在 2026 年达到 $201.9B（CM003），约为总额的 8%。再窄一层，四家分析机构（Fortune Business
              Insights、Precedence Research、MarketsandMarkets，以及 Deloitte 的 TMT Predictions）把独立 AI 智能体软件市场在 2025-2026
              年测算为 $7.0B-$8.5B，但到各自预测终年时，多年预测相差近 30x；Gartner 自己宽口径与窄口径的智能体 AI 数字在同一时间点也相差约
              25x（CM004、CM048）。同样的测量问题在相邻一层也出现：Grand View Research 估算全球 RPA / 知识自动化市场 2025 年为 $4.68B，2033 年增长至
              $35.84B；Precedence Research 则把同一名义类别估算为 2025 年 $28.31B、2035 年 $247.34B——仅基准年就相差约六倍（CM006、CM007）。IDC
              的替代框架完全绕开美元规模，预测到 2030 年 45% 的组织会「规模化」编排 AI 智能体，这是采用指标，不是市场规模（CM008）。Gartner 自己的预测在八个月内移动了约
              $500B（CM047），进一步说明这些标题数字仍有很大漂移。Figure FM001 从最宽到最窄堆叠这些视角；Figure FM002 展示四个独立市场预测即便名义上描述「同一」类别，也会相差多远。
