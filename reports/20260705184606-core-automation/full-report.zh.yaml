            body: >-
              多家组织已经在销售或运营 Core Automation 希望打造的自动化研究和知识工作工具，而且不需要等待持续学习突破。FutureHouse 是非营利 AI for science 实验室，2026 年 5
              月发布用于端到端生物发现的多智能体系统「Robin」，此前还发布过 DISCO、OXtal——其慈善资金支持结构与 Core Automation 的风投支持、营利模式根本不同，尽管自动化目标相似。Glean
              估值 $7.2B，2026 年 ARR 估计约 $300M，已经通过 100 多个 SaaS 集成和在线智能体平台服务 Fortune 500 企业客户。Hebbia 披露 ARR 为 $13M、估值
              $700M，约 30% 的资产管理机构用它做财务尽调；其官网还称客户 AUM 约 $30T、日均提示词 200,000 次。Manus 是一个智能体工作流平台，Meta 于 2025 年 12 月宣布以约 $2B
              收购；Manus 自己的网站仍写着「Manus is now part of Meta」，但中国 NDRC 在 2026 年 4 月要求交易撤销，Meta 到 2026 年 6
              月已开始运营层面拆分——数据防火墙、访问撤销、禁止内部使用。Manus 当前所有权仍有未解冲突，本章将其视为开放矛盾，而非既定事实。
