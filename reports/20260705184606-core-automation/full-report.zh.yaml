    title: 市场定义表
    columns:
      - 细分市场 / 类别
      - 计入支出
      - 排除支出
      - 买方 / 付款方
      - 与 Core Automation 的关系
    rows:
      - - 前沿 AI 实验室研究自动化工具
        - 前沿实验室自建或采购的内部算力、研究工程工具、实验编排软件
        - 通用模型训练算力本身；消费级 AI 产品
        - 前沿实验室 CTO / 研究负责人（由实验室资本自行出资）
        - 直接目标：最接近 Core Automation 所称建设方向的类比
      - - 企业级智能体 AI / 知识工作自动化软件
        - 面向研究、报告和分析工作负载的独立智能体平台，以及带智能体能力的 SaaS 功能
        - 多数供应商会单列核心 LLM API 支出；基于规则的 RPA
        - 企业 CIO / COO / 职能 VP
        - 相邻市场：如果 Core Automation 最终销售企业工具，这是最近且有融资、可衡量的市场
      - - 持续学习与后 Transformer 架构研究
        - 学术和产业实验室 R&D 预算、算力资助、公开基准
        - 产品收入（这是商业化前研究，不是已变现市场）
        - 研究出资方：实验室、学术资助、企业研究预算
        - Core Automation 所称技术论点；本身不是已测算规模的商业市场
      - - 科学发现 / AI 科研自动化
        - 用于假设生成、实验设计、论文撰写的供应商工具和实验室内部智能体
        - 湿实验室设备和物理科学仪器
        - 高校 PI 预算、生物技术 / 制药 R&D、企业科学实验室
        - 相邻的概念验证类别，显示买方愿为自动化研究付费
      - - 传统机器人流程自动化（RPA）
        - 面向重复、基于规则的企业流程的软件许可证和服务
        - 高度依赖判断或开放式认知任务
        - 企业 IT / 运营预算
        - 传统相邻市场：显示企业愿在另一套技术底座上为自动化付费
      - - 工业 / 物理 AI 自动化（机器人）
        - 工厂车间和物流场景中的感知—推理—行动机器人系统
        - 纯软件 / 云端 AI 服务
        - 工厂运营 / COO 资本开支与运营开支预算
        - 关联较松；认知 / 办公场景之外的平行「自主工作」论点
      - - AI 基础设施与算力（云、GPU、数据中心）
        - 超大规模云厂商和 GPU 供应商收入
        - 应用层软件支出
        - 采购算力的前沿实验室和企业
        - 上述所有细分市场的上游成本驱动和容量约束，本身不是 Core Automation 的产品
