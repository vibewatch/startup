            body: >-
              放到 2024-2026 年可比「neolab」超大种子轮旁边看，Core Automation 已报道的估值轨迹并不异常。前 OpenAI CTO Mira Murati 创办的 Thinking
              Machines Lab，在交付任何商业产品之前，于 2025 年 7 月以 $12B 估值完成 $2B 种子轮。前 OpenAI 首席科学家 Ilya Sutskever 共同创办的 Safe
              Superintelligence，在 2024 年 9 月以约 $5B 估值完成 $1B 种子轮。Humans& 由前 Anthropic、xAI 和 Google 研究人员在 2025 年 9
              月创立，成立三个月后的 2026 年 1 月以 $4.48B 估值完成 $480M 种子轮。受超大 AI 实验室融资强力推动，2026 年第一季度全球初创公司融资创下约 $300B 的记录，覆盖约 6,000
              家初创公司。在这一背景下，Core Automation 已报道的 $100M 到 $1B、再到 $300M-$500M 和 $4B
              的推进，落在同行已经建立的区间之内，且绝对美元规模低于同行。这说明，产品前公司超过十亿美元估值已经是类别常态，而不是 Core Automation 特有的离群值。Sacra
              明确把公司的核心商业模式风险放在现金跑道上：内部自动化「飞轮」能否在已融资本耗尽前足够快地复利，产出可分发产品。这一框架对尽调很重要，因为没有来源披露 Core Automation 手头现金、月度 burn
