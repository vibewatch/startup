      - number: '3.6'
        title: 护城河耐久性、快速跟进风险与不利证据
        blocks:
          - type: paragraph
            body: >-
              独立证据确实让 Core Automation 任何护城河的耐久性存疑。Radical Ventures 把蒸馏和开放权重商品化标为每个 NeoLab
              的长期风险；其熊市情形——团队还没交付任何东西，人才就为既有玩家 10x 薪酬离开——对 Core Automation 是直接风险，因为其名册本就是从资本更充足的 Anthropic 和 DeepMind
              招来。TechSpot 报道称，全球具备前沿能力的 AI 研究人员约 2,000 人，Meta 开出的签约奖金最高达 $100M，这意味着 Core Automation 刚招来的人仍可被更高报价挖走。关于
              Core Automation 自身发布的独立评论明确持怀疑态度，称行业已经「听过自动化发现这个故事十几次了」，并称自主研究系统可能「过拟合自己的噪声」。另据 Forbes 披露的泄露财务数据，OpenAI
              2025 年营业亏损约 $21B，收入 $13B；Palantir CEO 称 AI token 商业模式「疯狂」；AMI Labs 创始人 Yann LeCun
              警告，如果不削减成本或涨价，前沿实验室可能面临「大泡沫爆炸」——这些不利信号意味着，一旦更广泛的 AI 融资回调，Core Automation
