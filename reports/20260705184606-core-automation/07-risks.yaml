  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: customer proof and deployment status
    missingEvidence: Named design partners, customer references, deployment status, and quantified workflow outcomes.
    whyItMatters: Without external customer proof, product maturity and demand remain largely inferred from company narrative and third-party summaries.
    diligencePath: Request named references, pilot scopes, renewal expectations, and at least one live workflow demo under diligence.
    relatedQuestionRefs:
    - QR003
    - QR020
    - QR025
    relatedTableRefs:
    - TR003
  - type: private-evidence-only
    severity: blocking
    topic: burn, runway, and compute access
    missingEvidence: Current burn, runway, GPU contracts, compute pricing, and capital-commitment terms.
    whyItMatters: Financing dependence is currently the highest residual risk and cannot be sized without burn and infrastructure commitments.
    diligencePath: Request finance pack, compute vendor agreements, scenario runway model, and hiring plan before underwriting the next financing step.
    relatedQuestionRefs:
    - QR004
    - QR015
    - QR022
    - QR027
    relatedTableRefs:
    - TR004
  - type: missing-source
    severity: material
    topic: governance depth and control rights
    missingEvidence: Board composition, voting/control rights, committee structure, and formal succession or delegation materials.
    whyItMatters: The public narrative is concentrated in the founder and small team, so governance depth affects both execution resilience and financing leverage.
    diligencePath: Review cap table, board materials, investor rights, and management-responsibility map under NDA.
    relatedQuestionRefs:
    - QR005
    - QR026
    relatedTableRefs:
    - TR005
  - type: missing-source
    severity: material
    topic: trust and compliance documentation
    missingEvidence: DPA, privacy policy, retention boundaries, security architecture, incident-response process, and customer assurance artifacts.
    whyItMatters: Enterprise procurement increasingly expects public or at least diligence-shareable trust collateral before adopting a new AI vendor.
    diligencePath: Request the customer trust packet and map it against OpenAI, Microsoft, AWS, and Google enterprise trust surfaces.
    relatedQuestionRefs:
    - QR011
    - QR023
    relatedTableRefs:
    - TR002
  - type: conflicting-data
    severity: material
    topic: fundraising size and valuation expectations
    missingEvidence: A reconciled statement of active fundraising target, valuation range, lead-investor status, and round terms.
    whyItMatters: Public coverage disagrees on how much capital Core is seeking and at what valuation, making financing risk harder to size.
    diligencePath: Request current fundraising deck, signed term sheets if any, and management explanation of which press figures remain live.
    relatedQuestionRefs:
    - QR004
    - QR022
    - QR027
  - type: private-evidence-only
    severity: material
    topic: comparative edge versus incumbents
    missingEvidence: Customer win-loss data, benchmark results on real workflows, and evidence that Core clears trust or deployment hurdles faster than incumbent stacks.
    whyItMatters: Without a comparative proof set, the company could still be a strong research team that gets distribution- or trust-blocked by existing platforms.
    diligencePath: Ask for benchmark pack, proof-of-concept conversion data, and explicit competitor replacement stories.
    relatedQuestionRefs:
    - QR029
    - QR030
    relatedTableRefs:
    - TR004
  - type: enumeration-incomplete
    severity: minor
    topic: regulatory / legal risk register
    missingEvidence: A fuller jurisdiction-by-jurisdiction legal review beyond the public EU, FTC, NIST, and copyright signals captured here.
    whyItMatters: The chapter identifies the visible risk categories, but not every sector- or geography-specific obligation the company could face.
    diligencePath: Commission outside counsel to map target-market obligations and product-claim review requirements.
    relatedQuestionRefs:
    - QR012
    - QR014
    relatedTableRefs:
    - TR002
