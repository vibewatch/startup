company:
  name: Core Automation
chapter:
  number: 7
  title: Risks
  summary: 'Core Automation''s biggest risk is sequencing: the public evidence still describes a lab-first, pre-commercial research effort with no public customer proof or trust surface, while outside coverage already assumes frontier-lab-scale financing and valuation. Independent market, regulatory, and competitor sources show that enterprise buyers are harder to convince, compliance expectations are rising, and incumbents plus open source already cover much of the workflow, governance, and infrastructure surface that Core eventually wants to own.'
sections:
- id: risk-overview
  title: Severity-ranked risk overview
  body: 'Core Automation''s central risk is not a single legal event or technology flaw; it is sequencing. Public evidence still describes a lab-first research effort that wants to automate its own work, not a commercial platform with customers, trust collateral, and a product surface that outside buyers can test. At the same time, third-party coverage already frames the company against frontier-lab-scale financing expectations and valuation narratives. That combination makes the absence of product, customer, and disclosure proof more consequential than it would be for an ordinary seed startup. The public risk picture therefore clusters around three linked questions: can the team turn a research thesis into a buyer-clearing product before capital expectations run too far ahead, can it publish enough trust and compliance evidence to shorten enterprise diligence, and can it defend a differentiated workflow once incumbents and open source already offer agent, coding, and infrastructure surfaces
    at scale. The summary register ranks product non-maturity, missing customer proof, financing dependence, and commoditization as the highest residual exposures because each one worsens the next if evidence does not improve quickly.'
  claimRefs:
  - CR005
  - CR011
  - CR015
  - CR031
  - CR045
  - CR046
  - CR047
  tableRefs:
  - TR001
  figureRefs:
  - FR001
- id: regulatory-legal-and-trust
  title: Regulatory, legal, and trust risk is mostly a missing-surface problem today
  body: Core is not currently facing a visible lawsuit or enforcement action, but the public record still leaves meaningful legal and trust risk unmitigated. The compliance timeline for general-purpose AI in Europe has already started, FTC enforcement makes clear that unsupported automation claims can become legal liabilities, and copyright-law uncertainty around training data, outputs, and transparency remains active. None of those issues automatically break the company, but they matter more because the company has not yet published a trust, privacy, or compliance surface that would help a customer understand how Core plans to manage them. In practice, enterprise buyers will compare that absence against vendors that already expose trust portals, audit resources, certification lists, and shared-responsibility language. The regulatory problem is therefore less "Core is already in trouble" and more "Core has not yet given outsiders a basis to believe it can clear the same trust reviews as
    the vendors it hopes to displace." Until the company can show concrete policies, customer-facing legal terms, and model-governance mappings, this stays a high-residual risk rather than a theoretical future chore.
  claimRefs:
  - CR021
  - CR026
  - CR027
  - CR028
  - CR029
  - CR031
  - CR032
  - CR033
  - CR034
  - CR035
