- id: product-customer-and-operational-readiness
  title: Product, customer, and operational readiness risks remain visibly unresolved
  body: 'The most concrete public diligence finding is still absence. The official site and blog make the research thesis easy to understand, but the same surface does not let a buyer evaluate pricing, deployment, onboarding, or product scope. Sacra explicitly says there is no public API, signup flow, or commercial product, and the company is described as using its own stack internally before any public external rollout. That is a legitimate early-stage path, but it also means there is no public customer proof to separate concept strength from market demand. Even the operational wrapper around the company is thin: team, contact, and careers pages all returned 404 errors on the run date, while the homepage still gestures toward hiring. In an enterprise environment where many copilots and agent pilots already struggle to move into scaled production, that missing surface matters. A buyer who cannot find a trust page, a product workflow, or a design-partner reference has to do all of the diligence
    work from scratch. That makes every future customer conversation longer, more reference dependent, and more vulnerable to a skeptical "wait and see" response.'
