- id: governance-mitigations-and-diligence
  title: Governance concentration and evidence-quality gaps keep mitigations mostly aspirational
  body: 'The public mitigation story is still thin because so much of the evidence investors would normally use to downgrade risk is simply absent. Public sources suggest a highly concentrated founder-and-researcher profile led by Jerry Tworek, but they do not disclose board composition, investor control terms, succession planning, or operating delegation. The company therefore asks the market to trust that an unusually small and technically elite team can translate a research thesis into repeatable commercial execution while also building the trust and governance wrapper that enterprise buyers expect. That may happen, but it is not yet evidenced. The practical takeaway is that diligence should focus less on abstract enthusiasm and more on proof conversion: named pilots, buyer references, security and privacy artifacts, product workflows that an outsider can test, compute and burn disclosure, and governance materials that show the company can absorb scale without remaining a single-founder
    narrative. Until that package exists, the mitigations are directionally sensible but still aspirational, and the residual exposure remains high because the report is underwriting future disclosure more than current disclosure.'
