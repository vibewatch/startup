      - Revenue / strategic value
      - Gap
    rows:
      - - Enterprise infrastructure / security teams
        - 'Buyer: CIO, infrastructure, cloud, or security leadership; user: backup and platform admins; payer: central IT'
        - Protect Microsoft 365, Azure, AWS, VMware, NAS, and other business-critical data
        - Nearly 7,500 customers and 75 of the Fortune 500; ACR, Nature''s Path, and Fred Perry fit this pattern
        - Core large-account surface and highest-likelihood ACV pool
        - No disclosed ARR, contract length, or renewal rate by enterprise cohort
      - - Healthcare and life sciences
        - 'Buyer: IT and compliance leadership; user: SaaS and infrastructure admins; payer: central IT or security budgets'
        - Back up regulated collaboration data, cloud workloads, and audit-sensitive records
        - Included Health, American College of Radiology, and the global pharmaceutical case study
        - Strong trust signal for regulated workloads and compliance-led selling
        - No disclosed healthcare retention, ACV, or reference list beyond curated stories
      - - Distributed and operational environments
        - 'Buyer: infrastructure leadership; user: site or platform admins; payer: corporate IT'
        - Replace appliance-heavy backup in remote or bandwidth-constrained environments
        - BW Offshore
        - Shows Druva can operate outside easy headquarters IT environments
        - One named offshore story does not show broader energy concentration or renewal depth
      - - Retail and consumer brands
        - 'Buyer: IT operations leadership; user: workplace and cloud admins; payer: enterprise IT'
        - Protect Microsoft 365, Azure, Entra ID, and ransomware recovery workflows
        - Nature''s Path and Fred Perry
        - Demonstrates repeatability across retail brands with cloud-first operations
        - Public proof does not reveal revenue share or whether retail is a scaled vertical for Druva
      - - SaaS application owners
        - 'Buyer: SaaS, security, or compliance admins; user: app owners and IT; payer: IT or security budgets'
        - Extend backup and recovery into Google Workspace and Salesforce data
        - Included Health, Salesforce AppExchange, and partner SaaS-backup collateral
        - Clear cross-sell path beyond classic infrastructure backup
        - Public production proof outside Microsoft-centric stories is thinner than the product surface suggests
      - - Channel-influenced buyers
        - 'Buyer: customer IT teams with partner influence; user: customer admins; payer: customer IT budget'
        - Buy or deploy through AWS Marketplace, co-sell, or partner-led delivery
        - CDW, Bytes, AWS Marketplace, and Partner+ award surfaces
        - Expands reach without forcing Druva to deliver every deployment motion directly
        - Direct-vs-partner sourced bookings and top-partner concentration are not disclosed
    notes: >-
      Segment rows describe the public proof surface, not disclosed customer-share by revenue. Strategic value reflects likely monetization or proof
      value inferred from public materials rather than management guidance.
