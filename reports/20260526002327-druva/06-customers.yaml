chapter:
  number: 6
  title: Customers
  summary: >-
    Druva shows meaningful public adoption breadth, with a 2026 company claim of nearly 7,500 customers including 75 of the Fortune 500,
    but the highest-fidelity proof comes from a smaller set of quantified enterprise case studies across regulated and operationally
    critical environments. The strongest visible durability signals are 2025 review and recommendation metrics plus large third-party
    review volume, while the biggest remaining underwriting gaps are cohort retention, direct-vs-partner mix, and customer concentration.
sections:
  - id: customer-base-and-segments
    title: Customer base mix skews to cloud-first enterprise IT, with regulated verticals overrepresented in public proof
    body: >-
      Druva’s broadest public customer-scale claim is that it is trusted by nearly 7,500 customers, including 75 of the Fortune 500,
      but the stronger underwriting lens is the shape of the named deployments rather than the topline logo count. The visible buyers are
      central IT, infrastructure, security, cloud, and compliance teams rather than departmental line-of-business users. Public stories and
      partner listings repeatedly center Microsoft 365, Azure, EC2, VMware, Hyper-V, Google Workspace, and Salesforce backup or recovery
      motions, which implies Druva usually lands with administrators responsible for business-critical data and then expands across adjacent
      workload surfaces. The named public references also skew toward regulated or operationally sensitive environments: healthcare,
      pharmaceutical services, offshore operations, medical associations, retail apparel, and food manufacturing. That is a favorable signal
      for enterprise-grade trust, but it also means the public evidence set is curated and may overrepresent customers with unusually clear
      cloud-migration or cyber-resilience stories. Public materials still do not disclose revenue mix by cohort, the relative weight of
      partner-sourced deals, or the share of customers that remain single-workload accounts.
    claimRefs:
      - CU001
      - CU003
      - CU023
      - CU024
      - CU025
      - CU043
      - CU044
      - CU046
    tableRefs:
      - TU001
      - TU002
      - TU006
    figureRefs:
      - FU001
  - id: named-customer-proof
    title: Named customer proof is strongest when Druva publishes quantified workload and restore outcomes
    body: >-
      Druva’s best public customer evidence is not the broad customer-count claim; it is the set of live stories that disclose operational
      metrics. Nature’s Path is one of the strongest references because it pairs consolidation across Microsoft 365, Azure, VMware, and Entra
      ID with a 67% spend reduction and concrete restore metrics. Included Health shows Druva working inside a compliance-sensitive healthcare
      workflow, with 100x faster restores during Google Workspace consolidation. BW Offshore proves the product can operate in bandwidth- and
      operations-constrained environments, cutting backup-management time by 80%. The American College of Radiology provides the clearest AWS
      production-scale proof with 150 TB of EC2 data protected, 25% lower TCO, and support for a 99.5% application migration to AWS. Fred Perry
      adds a modern Microsoft/Azure proof point with 75% time savings and easier restore delegation, while the global pharmaceutical case study
      remains useful because it ties multi-geo Microsoft 365 support to 3,800 protected users and 5x faster email recovery after a ransomware
      wake-up call. The consistent pattern is real production use with measurable operational outcomes, but the evidence remains vendor-curated
      and does not disclose contract value or renewal depth.
    claimRefs:
      - CU005
      - CU006
      - CU007
      - CU009
