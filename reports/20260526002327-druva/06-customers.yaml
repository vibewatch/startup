  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention-metrics
      missingEvidence: Current NRR, GRR, gross churn, logo churn, renewal timing, and contract duration by major cohort.
      whyItMatters: Public review sentiment is encouraging, but it cannot substitute for real retention economics when underwriting durability.
      diligencePath: Request cohort retention tables, renewal calendars, and churn bridges by segment for the last eight quarters.
      relatedQuestionRefs:
        - QU020
        - QU025
    - type: private-evidence-only
      severity: material
      topic: customer-concentration
      missingEvidence: Top-customer ARR, top-10 customer share, Fortune-500 ARR share, and any customer-specific renewal cliffs.
      whyItMatters: A nearly 7,500-customer headline does not reveal whether a small number of large enterprise accounts dominate revenue.
      diligencePath: Request customer concentration schedules and top-account renewal exposure as part of financial diligence.
      relatedQuestionRefs:
        - QU021
        - QU025
      relatedTableRefs:
        - TU005
    - type: private-evidence-only
      severity: material
      topic: partner-vs-direct-mix
      missingEvidence: Direct versus partner-sourced bookings, top-partner concentration, and renewal performance for partner-led accounts.
      whyItMatters: Public sources show partners matter, but they do not reveal whether channel leverage or channel concentration is increasing risk.
      diligencePath: Request bookings, ARR, and renewal mix by route to market plus top-partner dependency metrics.
      relatedQuestionRefs:
        - QU022
        - QU025
      relatedTableRefs:
        - TU001
        - TU005
    - type: enumeration-incomplete
      severity: minor
      topic: named-customer-proof-table-coverage
      missingEvidence: An exported list of production Druva customers by segment, geography, workload, and go-live date.
      whyItMatters: The named-customer table is a representative sample of public proof and may understate or overstate the true customer mix.
      diligencePath: Request a referenceable customer roster with deployment status and permission flags for investor calls.
      relatedQuestionRefs:
        - QU024
      relatedTableRefs:
        - TU003
