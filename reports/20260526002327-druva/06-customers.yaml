  - id: TU005
    title: Expansion and concentration risk table
    columns:
      - Expansion driver
      - Concentration risk
      - Impact
      - Diligence path
    rows:
      - - More workloads per account such as Microsoft 365, Azure, EC2, Entra ID, and Salesforce
        - No public module-attach, wallet-share, or per-account expansion data
        - Land-and-expand logic is plausible but impossible to size from public evidence
        - Ask for attach rates and cross-sell by module and starting workload
      - - Partner-led AWS Marketplace and co-sell motion
        - Partner-sourced bookings mix and top-partner concentration are undisclosed
        - Channel can accelerate reach while increasing dependency on a small set of route-to-market nodes
        - Request direct vs partner bookings, top-10 partner share, and pipeline split
      - - Regulated enterprise reference set
        - Public proof is skewed toward curated logos with strong cyber-resilience narratives
        - Reference quality is high, but broad-market fit may be overstated by the visible sample
        - Request win rates and churn by industry, customer size, and deployment complexity
      - - Restore speed and support reputation
        - Review complaints on complex restores and reporting could slow deeper module adoption
        - Product friction can cap expansion in large or highly regulated estates
        - Run restore drills and admin-UX reference calls with large-data customers
      - - Public sector and MSP partner awards
        - Awards show channel effort, not end-customer economics or renewal quality
        - Pipeline quality may be concentrated in a few partners or vertical programs
        - Request ARR, pipeline, and renewal performance by public sector and MSP channels
      - - Nearly 7,500-customer scale claim
        - Top-customer concentration, ACV by cohort, and Fortune-500 revenue share remain undisclosed
        - Breadth alone does not remove concentration risk
        - Request top-10 customer ARR, renewal dates, and exposure by customer cohort
