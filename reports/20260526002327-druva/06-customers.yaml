  - id: durability-and-satisfaction
    title: Durability signals are positive on review surfaces, but they do not replace renewal data
    body: >-
      Druva’s public durability evidence is good enough to be directionally positive, but not strong enough to substitute for actual retention
      disclosure. The freshest third-party-style signals come from Druva’s 2025 Gartner Peer Insights landing pages, which cite 4.8 out of 5 with
      98% willingness to recommend for Backup as a Service and 4.9 out of 5, 129 reviews, and 97% willingness to recommend for enterprise backup.
      G2 adds independent review volume at 729 reviews, while TrustRadius and SoftwareReviews reinforce that users value flexibility,
      administrative simplicity, and granular restore. Druva’s own support page and Gartner-quoted customer comments also support a thesis that the
      company’s support organization is a real selling point. The caution is that review surfaces are proxies, not renewal math. They say customers
      like the platform and support, but they do not disclose NRR, GRR, churn, or contract length. Adverse commentary also exists: G2 says larger or
      more complex restores can be slower and less intuitive, and historical Capterra reviews complain about GUI visibility, backup overhead, and slow
      restore experiences. Netting those together, public retention evidence is favorable but incomplete.
    claimRefs:
      - CU027
      - CU028
      - CU029
      - CU030
      - CU031
      - CU032
      - CU033
      - CU034
      - CU035
      - CU036
      - CU040
      - CU045
      - CU047
    tableRefs:
      - TU004
    figureRefs: []
  - id: expansion-and-concentration
    title: Expansion logic is clear across workloads and partners, while concentration and channel mix remain opaque
    body: >-
      Druva’s public customer motion looks like a classic land-and-expand pattern built on workload adjacency. Public stories show initial landings in
      Microsoft 365, Google Workspace, Hyper-V, Azure, EC2, or VMware, followed by expansion into adjacent recovery, identity, SaaS backup, or
      ransomware-resilience features. Salesforce AppExchange and partner collateral suggest Druva is also trying to widen share-of-wallet beyond its
      best-known Microsoft and AWS backup motions. The second expansion engine is channel. Druva’s 2026 partner awards, AWS Marketplace presence,
      CDW co-sell write-up, and partner-led Fred Perry story all point to partners being material to customer acquisition and expansion. That is a
      positive reach signal, but it also creates diligence questions. Druva does not disclose how much ARR comes through partners, how concentrated the
      top partners are, or how much of the nearly 7,500-customer base is direct versus channel-led. Public concentration risk is similarly opaque:
      the company does not disclose top-customer ARR, contract value, or renewal exposure, and the visible references are heavily curated toward
      enterprise-friendly success stories. Review complaints around restore complexity and reporting depth are the main public friction points that could
      slow deeper module expansion inside complex accounts.
    claimRefs:
      - CU002
      - CU023
      - CU024
      - CU031
      - CU037
      - CU038
      - CU042
      - CU043
      - CU046
