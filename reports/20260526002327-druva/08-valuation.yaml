  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: current-financial-disclosure
    missingEvidence: Current ARR, NRR, gross margin, operating cash flow, and burn-rate disclosure for fiscal 2024 through fiscal 2026.
    whyItMatters: Without refreshed financial denominators, Druva's 2026 valuation cannot be underwritten beyond directional secondary-market estimates.
    diligencePath: Request CFO data-room access with monthly recurring-revenue bridge, cohort retention, gross-margin bridge, and cash runway analysis.
    relatedQuestionRefs:
    - QV023
    - QV030
  - type: private-evidence-only
    severity: blocking
    topic: cap-table-waterfall
    missingEvidence: Current cap table, share classes, liquidation preferences, option overhang, and any debt or structured preferred terms.
    whyItMatters: An enterprise-value range is not enough for a real equity return case if new investors sit behind a complex waterfall or hidden senior claims.
    diligencePath: Obtain the latest capitalization table, charter documents, and board-approved waterfall model from counsel before any term-sheet decision.
    relatedQuestionRefs:
    - QV024
    - QV025
  - type: conflicting-data
    severity: material
    topic: secondary-price-discrepancy
    missingEvidence: Verified 2026 secondary transaction tape, including share class, trade size, recency, and whether quoted prices were actual clears or indicative marks.
    whyItMatters: Forge, Yahoo Finance, and Notice do not present a single clean valuation view, so price discipline requires transaction-level context.
    diligencePath: Request broker or platform evidence for actual completed secondary trades and reconcile all quotes to a single fully diluted share count.
    relatedQuestionRefs:
    - QV005
    - QV025
  - type: missing-source
    severity: material
    topic: exit-readiness
    missingEvidence: Board-level evidence of IPO preparation, banker engagement, confidential filing status, or an agreed alternative exit path.
    whyItMatters: Exit timing determines whether a premium multiple can actually be realized or whether investors should instead model a longer, illiquid hold.
    diligencePath: Ask management and the board for IPO-readiness milestones, banker materials, and the latest view on primary versus secondary liquidity timing.
    relatedQuestionRefs:
    - QV022
  - type: enumeration-incomplete
    severity: minor
    topic: comparable-valuation-table
    missingEvidence: Verified 2026 valuation data for additional private cloud-backup peers beyond Veeam and Druva's own secondary references.
    whyItMatters: The comparable set is intentionally partial because many private peers lack fresh, audited, or widely corroborated valuation data.
    diligencePath: Expand the comp set only if new secondary clears, filed financials, or closed M&A documents become public for relevant data-protection peers.
    relatedQuestionRefs:
    - QV007
    relatedTableRefs:
    - TV004
  - type: stale
    severity: minor
    topic: operational-resilience-history
    missingEvidence: A full 2024-2026 incident history with SLA impact, root-cause writeups, and customer communication timelines.
    whyItMatters: Operational stability matters for a premium backup and cyber-resilience vendor because restore credibility is part of the product promise.
    diligencePath: Request a customer-reference pack and incident retrospective log covering all major outages, degradations, and notable support escalations.
    relatedQuestionRefs:
    - QV015
