- id: exit-readiness-thesis-breaks-and-final-diligence
  title: Exit Readiness, Thesis-Breaks, and Final Diligence
  body: 'Druva is not obviously broken, but it is not yet an easy exit-ready underwriting either. The public record still reads more like a pre-IPO option value than a filing-backed listing process: TechCrunch covered IPO talk in 2021, Forge keeps a pre-IPO page live, and Yahoo still presents the company as a private market security, yet this run found no filed S-1 or evidence of an active transaction window. That means the diligence burden shifts to fundamentals and structure. The thesis breaks if verified current ARR comes in well below a level needed to support even a discounted 4x-6x band, if the cap-table waterfall materially subordinates new money, or if operational and product-friction signals turn into retention pressure. The upgrade path is equally concrete: disclose current ARR, NRR, and margins; show a clean cap table; reconcile the conflicting secondary prices to actual cleared trades; and demonstrate credible exit planning. Until those pieces exist, the right committee behavior
    is to watch the asset, not force conviction.'
