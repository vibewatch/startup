  - CV059
  - CV061
  - CV062
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Current ARR / NRR
    - Latest ARR, cohort retention, and net-new ARR bridge for 2024-2026
    - Without refreshed denominators, no current multiple can be underwritten
    - CFO data-room request and board deck review
  - - Margins / burn / cash flow
    - Gross margin, operating cash flow, burn, and runway
    - Quality of revenue matters as much as quantity for a premium multiple
    - Finance diligence with audited management accounts
  - - Cap table / preferences
    - Fully diluted cap table, liquidation preferences, debt, and option overhang
    - Return math depends on equity structure, not just enterprise value
    - Legal diligence and updated waterfall model
  - - Secondary transaction tape
    - Actual 2026 cleared trades, share class, block size, and recency
    - Quoted prices are inconsistent and may not reflect true liquidity
    - Broker/platform confirmation and transfer-ledger review
  - - Product retention proof
    - Expansion and churn by workload, customer size, and MSP motion
    - Review-site friction must be reconciled with actual retention
    - Customer cohort analysis and reference calls
  - - Operational-resilience history
    - Incident log, SLA performance, and root-cause writeups for 2024-2026
    - A recovery vendor is only premium if customers trust restore and uptime
    - Support-ops review and customer-reference pack
  notes: These asks are the minimum package needed to move from directional valuation work to an investable equity-return view.
