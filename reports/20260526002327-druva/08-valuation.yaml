- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Dimension
  - Investment thesis
  - Counter-thesis
  - What would change the view
  rows:
  - - Category
    - DPaaS and backup-and-restore DRaaS continue to grow at high-teens to low-twenties CAGR.
    - Market growth alone does not guarantee Druva deserves a premium private multiple.
    - Show that Druva is taking share, not just riding category demand.
  - - Architecture
    - Druva remains one of the cleaner cloud-native SaaS data-protection architectures in the market.
    - Cloud-native architecture is valuable only if it translates into retention, margin, and operational quality.
    - Disclose gross margin, net retention, and large-customer expansion data.
  - - Scale proof
    - '> $200M ARR and >5,000 customers by August 2023 show real scale, not an early-stage experiment.'
    - Public disclosure stops at 2023 and does not prove what Druva looks like in 2026.
    - Provide a 2024-2026 ARR bridge and cohort growth data.
  - - User experience
    - Independent reviewers praise immutability, centralized management, and rapid recovery.
    - Independent reviewers also flag pricing opacity, reporting limits, and UI/restore friction.
    - Show product-led retention and support metrics improving over time.
  - - Security posture
    - UpGuard treats Druva as a continuously monitored security vendor.
    - OpenCVE and outage monitoring show client hardening and operational resilience still deserve diligence.
    - Share incident response, patch cadence, and root-cause records.
  - - Valuation signal
    - A discounted sub-$1B current mark can be rationalized against public comps if Druva sustained its disclosed ARR floor.
    - A >$2B mark now would require premium quality evidence that is not public.
    - Reconcile current trades and show premium-quality growth economics.
  notes: The anti-thesis focuses on valuation quality and disclosure quality rather than on denying Druva's product relevance.
