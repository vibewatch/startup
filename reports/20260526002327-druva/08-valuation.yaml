- id: comparable-benchmarking-and-thesis-balance
  title: Comparable Benchmarking and Thesis Balance
  body: The comparable set spans a wide multiple range. At the premium end, Rubrik trades near 9.4x ARR and Veeam's December 2024 secondary implied about 8.8x ARR. In the middle, SentinelOne trades near 5.7x ARR. At the mature and lower-growth end, Commvault trades near 3.9x ARR and N-able around 1.3x ARR. CrowdStrike sits far above the group, but its 30x-plus ARR multiple is not a fair Druva analog because it reflects a much larger AI-native security platform with broader product breadth and public-market liquidity. Druva's thesis is that category growth is strong, its cloud-native architecture is real, and the company already disclosed meaningful ARR and customer proof in 2023. The anti-thesis is that independent review evidence points to friction in pricing, reporting, and restore experience, while historical client CVEs and third-party outage monitoring mean the execution burden remains real. In other words, Druva can plausibly deserve a mid-band multiple, but the evidence does not yet
    support assuming a Veeam or Rubrik-quality premium without fresh disclosure.
