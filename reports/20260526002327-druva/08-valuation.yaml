tables:
- id: TV001
  title: Recommendation summary table
  columns:
  - Dimension
  - Current read
  - Evidence basis
  - Decision implication
  rows:
  - - Recommendation
    - Track
    - Real scale and market tailwinds exist, but 2026 price discovery is thin and disclosure is incomplete.
    - Do not move from watchlist to active underwriting without a data room.
  - - Confidence
    - Low
    - Last disclosed primary round is from 2021 and current private-market indicators are sparse and conflicting.
    - Treat all valuation work as directional until refreshed metrics are provided.
  - - Risk rating
    - High
    - Private-market illiquidity, product-friction signals, and security/operational diligence items create downside risk.
    - Require downside protection and information rights before committing capital.
  - - Valuation stance
    - Fair near sub-$1B; stretched near >$2B
    - Yahoo/Forge point to a discounted current mark, while the 2021 last round is stale.
    - Do not anchor on the old last-round valuation without refreshed fundamentals.
  - - Entry discipline
    - $0.8B-$1.3B or roughly 4x-6x ARR on verified current ARR
    - That range better matches discounted public-comp math than a premium late-stage narrative.
    - Avoid paying Veeam- or Rubrik-like premiums before disclosure quality improves.
  - - Upgrade trigger
    - Verified ARR >$250M plus strong retention, margins, and clean cap table
    - A bull case needs proof of quality, not just category growth.
    - Upgrade only after diligence converts the directional story into an investable one.
  notes: 'This summary is explicitly price-sensitive: it separates Druva''s business quality from the much weaker quality of current valuation evidence.'
