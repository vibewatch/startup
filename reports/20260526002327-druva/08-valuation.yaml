- id: valuation-anchor-reset-and-current-market-evidence
  title: Valuation Anchor Reset and Current Market Evidence
  body: Druva's 2021 financing still matters because it proves the company once cleared a >$2 billion institutional round with high-quality investors, but it is a stale anchor for a 2026 underwriting decision. The financing took total disclosed capital to roughly $475 million and happened before the company's 2023 ARR milestone became public. Since then, Druva has disclosed meaningful scale—more than $200 million ARR, more than 5,000 customers, and six billion-plus annual backups—but it has not published the current ARR, NRR, gross margin, or burn data that would let investors map today's business to a clean multiple. That information vacuum is why the 2026 secondary indicators matter even if they are imperfect. Forge shows limited market activity and Yahoo Finance publishes a sub-$1 billion estimated valuation, while Notice shows a higher headline stock price without enough supporting context. The practical implication is that Druva now has to be judged on discounted secondary evidence
    plus disclosed operating floor, not on a five-year-old late-stage round alone.
