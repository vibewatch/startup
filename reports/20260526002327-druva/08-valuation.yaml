company:
  name: Druva
chapter:
  number: 8
  title: Valuation
  summary: 'Druva''s last disclosed financing anchor remains its April 2021 Series H at a valuation above $2 billion, but 2026 secondary-market signals are materially lower and thinly traded: Yahoo Finance shows a Forge-derived $772.68 million estimated valuation and Forge itself labels market activity limited. The company still shows real operating proof—more than $200 million ARR by August 2023, more than 5,000 customers, and strong category tailwinds—but public evidence on current ARR, margins, and cap-table terms is too incomplete for a buy call. The recommendation is track: fair near a discounted sub-$1 billion range, stretched near the stale >$2 billion last-round anchor.'
sections:
- id: overall-recommendation-and-price-discipline
  title: Overall Recommendation and Price Discipline
  body: 'The right starting point for Druva is not company quality in the abstract but whether the available 2026 price signal is underwriteable. Public evidence says the business is real: Druva has a cloud-native platform, crossed $200 million of ARR by August 2023, and continues to position itself as a scaled data-resiliency vendor. But the valuation evidence is notably weaker than the operating evidence. The last disclosed primary financing is still the April 2021 Series H above $2 billion, while Yahoo Finance now shows a Forge-derived estimated valuation of $772.68 million and Forge itself labels market activity as limited. Notice shows a higher headline price, which makes the current secondary picture directionally useful but not yet clean enough for conviction. That combination leads to a track call. At a discounted sub-$1 billion entry, Druva looks directionally supportable against public comps. At or near the stale >$2 billion last-round anchor, public evidence does not justify paying
    premium-growth multiples without fresh ARR, retention, margin, and cap-table disclosure.'
