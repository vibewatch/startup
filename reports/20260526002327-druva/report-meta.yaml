companyProfile:
  summary: >-
    Druva is a 2008-founded, Indian-origin data protection company founded in Pune and now
    headquartered in Santa Clara. It remains founder-led under Jaspreet Singh and positions the Data
    Security Cloud as a fully managed SaaS platform spanning backup, cyber response and recovery,
    eDiscovery/compliance, and adjacent identity-resilience workflows. Public scale evidence is real:
    Druva disclosed >$200M ARR in August 2023, company materials later cited nearly 7,500 customers
    including 75 of the Fortune 500, and LATKA says 2024 revenue reached $304.3M. The latest clean
    primary capital anchor is the April 2021 Series H at >$2B valuation, but current 2026 price
    discovery and operating disclosure remain materially thinner.
  foundedDate: '2008-01-01'
  founders:
    - name: Jaspreet Singh
      role: Co-Founder / CEO
      background: Company materials say he bootstrapped Druva after earlier roles at Veritas and Ensim.
      claimRefs: [CO002, CO026]
    - name: Milind Borate
      role: Co-Founder / Chief Development Officer
      background: Official bio highlights Veritas data-protection engineering experience and storage patents.
      claimRefs: [CO002, CO027]
    - name: Ramani Kothandaraman
      role: Co-Founder
      claimRefs: [CO002]
  foundingLocation: Pune, India
  headquarters: Santa Clara, California
  productSummary: >-
    Druva sells a fully managed SaaS-first Data Security Cloud covering enterprise and cloud backup,
    SaaS-app protection, cyber response and recovery, eDiscovery/compliance, identity-resilience
    workflows, Microsoft 365 Backup Express, and newer DruAI investigation capabilities.
  customerFocus: >-
    Large enterprises, regulated organizations, public-sector buyers, and partner-led customers that
    need protection across AWS, Azure, Microsoft 365, Google Workspace, Salesforce, endpoints, and
    hybrid or data-center workloads; MSPs and ecosystem partners are also a meaningful route to market.
  businessModel: >-
    Subscription-plus-usage SaaS business sold through a mix of direct enterprise motion and
    partner/MSP channels, with quote-based contracts and pricing that can be per user, per resource,
    or per terabyte.
  stage: Late Stage Private / Series H
  fundingStatus: >-
    Last disclosed primary financing was Druva's April 2021 $147M Series H at a valuation above $2B;
    reviewed trackers put lifetime disclosed funding around $475M, but no newer public primary round,
    cap-table detail, or reconciled secondary-market clearing history was available.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO003, CO004, CO026, CO027, CO043, CE001, CE002, CE003, CE010, CE027, CI001, CI004, CI007, CI010, CI018, CI019, CI025, CI028, CU001, CU002, CU044, CV001, CV002, CV006, CV011]
summary:
  headline: Druva is a real, scaled cloud-data-protection platform with confirmed historical unicorn status, but stale valuation anchors, thin 2026 disclosure, and AWS/secondary-market concentration keep it in track territory.
  overallScore: 5.8
  recommendation: track
  confidence: low
  riskRating: high
  valuationStance: fair
  keyMetrics:
    valuationUsdM: 772.68
    revenueRunRateUsdM: 304.3
    arrUsdM: 200
    revenueGrowthYoYPct: null
    grossMarginPct: null
    nrrPct: null
    totalRaisedUsdM: 475
    customerCount: 7500
    headcount: null
  topStrengths:
    - Druva still presents one of the cleaner SaaS-native architectures in data protection, with air-gapped and immutable protection across cloud, on-premises, edge, and SaaS workloads.
    - 'Public scale is meaningful: Druva disclosed >$200M ARR in 2023, company materials cite nearly 7,500 customers including 75 of the Fortune 500, and LATKA points to $304.3M of 2024 revenue.'
    - FedRAMP Moderate status, GovCloud expansion, and Microsoft/AWS ecosystem distribution give Druva more trust and route-to-market credibility than a generic backup vendor.
    - Public customer-sentiment signals are mostly strong, including 2025 Gartner Voice of the Customer metrics and a 729-review G2 surface.
  topRisks:
    - Druva still does not publicly disclose audited revenue, current ARR/NRR, gross margin, cash, burn, debt, or the cap-table waterfall needed to underwrite equity value.
    - AWS is a concentrated dependency across infrastructure, storage location, marketplace distribution, and parts of Druva's economic model.
    - Public reviews surface pricing opacity, shallow reporting, and slower large-restore performance in some environments, which cuts against the simplicity narrative.
    - The 2021 >$2B primary mark is stale relative to a 2026 Yahoo/Forge estimate of $772.68M, making current fair value highly sensitive to missing diligence data.
  unresolvedGaps:
    - Verified 2024-2026 ARR and revenue bridge, including GRR/NRR and cohort expansion by workload, segment, and channel.
    - Gross margin, burn, cash, debt schedule, runway, and headcount by function.
    - Fully diluted cap table, liquidation preferences, recent 409A support, and actual 2026 secondary-clearing tape.
    - Direct-versus-partner/MSP revenue mix, top-customer concentration, and AWS economics exposure.
    - 2024-2026 incident history, SLA performance, and root-cause evidence for material service events.
disclaimer: >-
  This report-meta summary is based only on public sources reviewed through May 26, 2026 and is not
  investment, legal, accounting, cybersecurity, or procurement advice. Druva is a private company,
  and key underwriting inputs — including audited revenue, current ARR and retention, gross margin,
  cash, burn, debt, cap-table structure, and recent secondary-clearing data — are not publicly
  disclosed or are only partially supported by trackers and vendor-authored materials. Any
  investment or commercial decision should rely on direct management diligence, customer references,
  contracts, and full data-room materials rather than this public-information summary alone.
