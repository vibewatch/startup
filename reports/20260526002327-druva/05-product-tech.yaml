  - id: TE002
    title: Workflow / use-case table
    columns:
      - User job
      - Current workflow problem
      - Druva solution
      - Measurable benefit / proof
      - Main limitation
    rows:
      - - Protect SaaS collaboration data
        - Microsoft 365 and other SaaS tools create fragmented backup and restore needs
        - Druva protects Microsoft 365, Salesforce, Google Workspace, and Power BI from one SaaS platform
        - Official workload pages show unified coverage across major SaaS suites
        - Public sources do not provide workload-specific restore throughput benchmarks
      - - Restore clean files after ransomware
        - Backup data may include infected or recently changed files
        - Curated snapshots and immutable protection are designed to restore the last clean state
        - Druva explicitly markets curated snapshots, encryption, access control, and immutability as ransomware recovery controls
        - Public materials do not quantify detection precision or false-positive rates
      - - Accelerate forensic or compliance investigations
        - Teams spend days manually correlating logs, backup metadata, and audit evidence
        - Deep Analysis Agents and Agentic Workflows automate long-running investigations and reporting
        - Independent and official sources align on investigation time moving from two or three days to roughly eight to ten minutes
        - Public pages do not clearly mark which agentic features are fully GA versus newly emerging
      - - Integrate backup and response actions into the SOC
        - Backup tools often sit outside the response workflow used by security teams
        - Splunk integration adds two-way API actions such as quarantine, restore, and remote wiping
        - Splunkbase documents automated response actions and recovery initiation from the Druva Cloud Platform
        - Value depends on customers already operating Splunk and related response workflows
      - - Meet public-sector and regulated-environment requirements
        - Agencies need compliance-backed protection without managing infrastructure
        - Druva GovCloud and FedRAMP-backed Data Center Workloads extend the SaaS model into regulated use cases
        - FedRAMP Marketplace and Carahsoft corroborate Moderate certification and public-sector workload expansion
        - Regulatory scope is clearer than the underlying architectural implementation detail
    notes: "Benefit cells mix official claims, partner listings, and independent coverage; quantitative workflow improvements are called out only where public sources state them directly."
