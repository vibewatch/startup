  evidenceGaps:
    - type: missing-source
      severity: material
      topic: architecture-gap
      missingEvidence: A current public reference architecture that explains Druva's tenant isolation, storage tiers, control plane, data plane, and recovery-path sequencing is still missing.
      whyItMatters: Product pages validate the workflow narrative, but not enough low-level engineering detail exists to fully underwrite resilience, scaling behavior, or failure domains.
      diligencePath: Request the current technical architecture deck or solution-architecture briefing covering control-plane, storage, and isolation design for the main SaaS platform.
      relatedQuestionRefs:
        - QE025
      relatedTableRefs:
        - TE003
    - type: private-evidence-only
      severity: material
      topic: ai-maturity-boundary
      missingEvidence: Druva does not publicly separate generally available DruAI features from newer preview-style agentic workflows and memory features with enough precision.
      whyItMatters: Buyers need to know whether current AI workflows are underwritten product capabilities or near-term roadmap items before relying on them in response and compliance processes.
      diligencePath: Request a current feature-availability matrix showing GA, beta, preview, and regional availability for DruAI, Agentic Workflows, Deep Analysis Agents, and Notify Me.
      relatedQuestionRefs:
        - QE019
      relatedTableRefs:
        - TE005
    - type: missing-source
      severity: material
      topic: identity-resilience-detail
      missingEvidence: Public materials headline identity resilience, but they do not provide enough workflow, integration, or architectural depth to assess deployment reality.
      whyItMatters: Identity recovery is strategically important, yet investors cannot tell from public evidence whether Druva's identity offering is mature, narrow, or partner-dependent.
      diligencePath: Request product documentation and customer references specific to Okta, Entra ID, and Active Directory recovery workflows, dependencies, and production deployments.
      relatedQuestionRefs:
        - QE022
      relatedTableRefs:
        - TE001
    - type: private-evidence-only
      severity: minor
      topic: developer-maintenance
      missingEvidence: Public GitHub repos show examples and connectors, but Druva does not publish support boundaries, usage metrics, or maintenance commitments for those assets.
      whyItMatters: Without clearer ownership and maintenance signals, customers cannot reliably judge whether public repos are supported extension points or best-effort samples.
      diligencePath: Request the maintained integration catalog, public-repo ownership model, and support policy for GitHub-hosted tooling and marketplace developer assets.
      relatedQuestionRefs:
        - QE024
      relatedTableRefs:
        - TE005
