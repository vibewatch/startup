chapter:
  number: 5
  title: Product & Technology
  summary: "Druva's public product-tech evidence supports a real multi-surface SaaS data-security platform: official pages cover SaaS apps, endpoints, cloud and data-center workloads, governance, and identity resilience; developer surfaces expose REST APIs and public GitHub repos; and trust sources support FedRAMP, SOC 2, and ISO control claims. The strongest near-term differentiator is the 2026 DruAI expansion into agentic forensic and compliance workflows, but low-level architecture detail, GA-versus-preview boundaries, and fresher public developer-maintenance signals remain incomplete."
sections:
  - id: platform-scope
    title: Platform scope and customer workflow
    body: >
      Druva's public product surface is materially broader than a single backup SKU. The platform overview frames
      the Data Security Cloud as a fully managed SaaS-first service for backup, cyber response and recovery,
      eDiscovery and compliance, and governance across cloud, on-premises, edge, SaaS, and identity environments.
      The official marketplace taxonomy backs that breadth with named workload groupings for AWS, Azure,
      virtualization, databases, unstructured data, SaaS applications, and identity resilience. The productivity
      workload page adds concrete application coverage across Microsoft 365, Salesforce, Google Workspace, and
      Power BI, while also emphasizing curated snapshots and clean-file recovery after ransomware. In workflow
      terms, Druva sells centralized protection from a single console, then layers investigation, response,
      compliance, and recovery actions on top. The core product message is therefore coherent: one SaaS control
      plane for multiple data surfaces, with the main diligence caveat being that public packaging is more specific
      than public low-level architecture.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
      - CE005
      - CE006
      - CE007
      - CE024
      - CE037
      - CE043
    tableRefs:
      - TE001
      - TE002
    figureRefs:
      - FE002
  - id: architecture-and-ecosystem
    title: Architecture, APIs, and ecosystem dependencies
    body: >
      Druva's architecture evidence is strongest at the control-plane and integration layer, not the storage-engine
      layer. The developer portal confirms that Druva exposes REST APIs with JSON payloads and standard HTTP
      semantics, while the reference surface explicitly links APIs, GitHub, marketplace entries, support, and
      sandbox resources. Public GitHub repos show real practitioner tooling for native workloads, data governance,
      and Splunk integrations, but the repo update cadence is noticeably older than Druva's 2026 AI launch tempo.
      External partner surfaces matter operationally: AWS Marketplace positions Druva as AWS-built SaaS backup and
      recovery, Microsoft's marketplace page ties Druva to Microsoft 365 Backup Storage, and Splunkbase documents a
      two-way incident-response integration. That means the operating model depends not just on Druva's own code,
      but also on hyperscaler infrastructure, Microsoft backup primitives, and partner workflow integrations. The
      public evidence supports extensibility, but it also implies meaningful dependency risk outside Druva's direct
      control.
    claimRefs:
      - CE012
      - CE013
      - CE014
      - CE015
      - CE016
      - CE017
      - CE018
      - CE024
      - CE025
      - CE026
      - CE027
      - CE028
      - CE041
      - CE042
      - CE044
    tableRefs:
      - TE003
    figureRefs:
      - FE001
      - FE003
  - id: trust-and-operating-controls
    title: Trust, compliance, and operating controls
    body: >
      Druva's trust evidence is unusually concrete for a private infrastructure software company. Its trust center
      names governance, risk, and compliance ownership, plus incident response, vulnerability management, SIEM,
      application security, CI/CD security reviews, threat modeling, and SAST/DAST. The same surface states that
      Druva has maintained SOC 2 attestation and FedRAMP authorization for more than five years. That is further
      corroborated by the FedRAMP Marketplace listing, which shows Druva Data Resiliency Cloud as FedRAMP
      Certified at Moderate level, and by Carahsoft's 2025 note that Druva expanded FedRAMP Moderate coverage to
      Data Center Workloads in GovCloud. On the AI side, Druva's Business Wire launch language says customer data
      is encrypted, not used to train large language models, and processed through isolated LLMs plus private RAG.
      The trust story is therefore credible, though still stronger on program controls and certifications than on
      public disclosure of tenant isolation or storage architecture internals.
    claimRefs:
      - CE008
      - CE009
      - CE010
      - CE011
      - CE023
      - CE033
      - CE036
      - CE038
    tableRefs:
      - TE004
    figureRefs: []
  - id: roadmap-maturity-and-risk
    title: Roadmap, maturity, and technical risk
    body: >
      Druva's clearest 2026 product signal is the move from backup-assisted analytics toward agentic investigation.
      Official and independent launch coverage aligns on Deep Analysis Agents, Agentic Workflows, and Agentic
      Memory, with reported investigation time dropping from two or three days to roughly eight to ten minutes.
      Druva also publishes adoption metrics for DruAI, which helps distinguish this from a purely aspirational AI
      slide. Still, maturity is uneven. Review surfaces praise immutable backups, centralized management, and fast
      recovery, but also complain about pricing opacity, cost, permissions, and customization. The GitHub sample
      surface exists, yet several repos lag the cadence of current announcements. Public docs and marketing also do
      not cleanly separate generally available AI features from newer preview-style workflows or provide enough
      low-level architecture detail to fully underwrite performance, tenancy, or operational scaling. The product
      story is therefore strong on breadth and narrative momentum, but not yet transparent enough to eliminate
      execution risk, especially for buyers needing audited architecture and support-boundary evidence before large,
      regulated deployments.
    claimRefs:
      - CE019
      - CE020
      - CE021
      - CE022
      - CE029
      - CE030
      - CE031
      - CE032
      - CE034
      - CE035
      - CE039
      - CE040
      - CE041
    tableRefs:
      - TE005
    figureRefs:
      - FE004
