    rows:
      - - Data Security Cloud core platform
        - Central IT, backup, security, and resilience owners
        - Live and mature public surface
        - SaaS-first control plane with air-gapped and immutable protection across cloud, on-premises, and edge environments
        - Public materials do not expose enough low-level storage or tenancy architecture detail
      - - SaaS apps and endpoints
        - Microsoft 365, Salesforce, Google Workspace, Power BI, and endpoint administrators
        - Live and mature
        - One platform promises protection plus curated clean snapshots for ransomware recovery
        - Workload-by-workload restore performance and service limits are not publicly benchmarked
      - - Cloud and data-center workloads
        - Infrastructure teams protecting AWS, Azure, virtualization, databases, and NAS
        - Live, with public-sector extension evidence
        - Official taxonomy spans public cloud, data center, databases, and unstructured data; FedRAMP expansion added Data Center Workloads in GovCloud
        - Detailed control-plane versus data-plane boundaries remain private
      - - eDiscovery and compliance
        - Legal, compliance, and governance teams
        - Live but evidence is more programmatic than deeply technical
        - Platform overview explicitly includes eDiscovery and compliance alongside backup and recovery
        - Public throughput, case-management depth, and review workflow detail are limited
      - - Identity resilience
        - Identity and security teams covering Okta, Entra ID, and Active Directory
        - Positioned publicly but less substantiated than backup modules
        - Druva markets identity-aware insights and orchestrated recovery from the same SaaS platform
        - Public architecture and workflow evidence is thinner than for core backup use cases
      - - DruAI agentic investigations
        - Security, compliance, and operations teams running forensic or audit investigations
        - Emerging 2026 launch area
        - Official and independent sources agree on Deep Analysis Agents, Agentic Memory, and background workflows for faster investigation reporting
        - Druva does not clearly separate generally available versus preview boundaries on public pages
    notes: "Rows reflect the major product and workflow surfaces explicitly named across Druva official pages, marketplaces, and 2026 launch coverage; they are not a full SKU inventory."
