            body: >-
              The best public traction markers are customer scale, historical funding, revenue estimates, and buyer-side
              contract benchmarks, not disclosed unit economics. Official Druva material available during this run says
              the company is trusted by nearly 7,500 customers and 75 of the Fortune 500, while the 2021 financing
              release said multi-product adoption rose 50 percent and data under management grew more than 40 percent
              over the prior year. Third-party trackers then fill in the missing top-line story: Latka reports $304.3
              million of 2024 revenue after $200 million in 2023 and $100 million in 2019, while Tracxn reports $475
              million total funding and 1,369 employees as of April 2026. Buyer-side pricing datasets are the closest
              thing to sales-efficiency proxies. Vendr says contracts commonly span $25,000 to $500,000+ annually,
              Costbench reports a $41.6k median annual contract and 13 percent average discount, and review sources show
              pricing sensitivity in the field. Those data points are enough to infer an enterprise-oriented, negotiated
