              investigation. Official and independent launch coverage aligns on Deep Analysis Agents, Agentic Workflows,
              and Agentic Memory, with reported investigation time dropping from two or three days to roughly eight to
              ten minutes. Druva also publishes adoption metrics for DruAI, which helps distinguish this from a purely
              aspirational AI slide. Still, maturity is uneven. Review surfaces praise immutable backups, centralized
              management, and fast recovery, but also complain about pricing opacity, cost, permissions, and
              customization. The GitHub sample surface exists, yet several repos lag the cadence of current
              announcements. Public docs and marketing also do not cleanly separate generally available AI features from
              newer preview-style workflows or provide enough low-level architecture detail to fully underwrite
              performance, tenancy, or operational scaling. The product story is therefore strong on breadth and
              narrative momentum, but not yet transparent enough to eliminate execution risk, especially for buyers
