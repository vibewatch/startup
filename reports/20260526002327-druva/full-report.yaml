  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, Privacy, and Government-Market Risks
        blocks:
          - type: paragraph
            body: >-
              Druva sells into workloads where backup data often contains regulated customer information, audit records,
              and litigation-relevant content, so the company is exposed to a heavier legal-and-compliance burden than a
              simple storage utility. Public materials say Druva acts as a data controller for its own business purposes
              and as a data processor for customer data, which means buyers still need confidence in subprocessors,
              transfer controls, and evidence handling. The company also actively markets eDiscovery, legal hold, and
              forensically sound search features, raising the bar for defensible preservation and auditability because a
              failure here is not just downtime—it can become discovery, privacy, or governance exposure for customers.
              Government and regulated-sector access is another gating issue. Druva's GovCloud marketplace listing
              references FedRAMP-oriented compliance claims, while FedRAMP itself positions certification and
              marketplace visibility as procurement prerequisites. That is a real mitigant, but it also makes continued
              certification clarity, data-residency fit, and contract mechanics material investment questions rather
              than back-office details.
