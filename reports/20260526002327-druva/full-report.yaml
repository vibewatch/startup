  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model, pricing architecture, and revenue quality
        blocks:
          - type: paragraph
            body: >-
              Druva’s public materials support a recurring SaaS revenue model, but not a simple public rate card.
              Official pages describe a fully managed, cloud-native platform with consumption-based pricing rather than
              hardware sales, and the pricing page breaks the portfolio into enterprise, productivity, identity, CRM,
              and endpoint data-protection categories. That framing matters because it implies a diversified workload
              mix across users, endpoints, cloud resources, and protected data volumes, which is directionally
              consistent with high-quality recurring revenue. Public price discovery, however, is fragmented. Vendr says
              Druva does not publish list pricing and instead sells negotiated, quote-based contracts, while Costbench
              and review sites publish observed entry points such as $7 per resource per month for Phoenix Business, $4
              per Microsoft 365 user, and $8 per endpoint device. The AWS Marketplace review adds that pricing can be
              per user, per resource, or per terabyte, with Enterprise and Elite tiers layered on top. The net read is
              that recurring monetization is real, but realized pricing, discount ladders, and revenue mix remain
              undisclosed.
