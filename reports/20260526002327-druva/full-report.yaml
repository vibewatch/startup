      - number: '3.3'
        title: Distribution power, switching costs, and multi-homing logic
        blocks:
          - type: paragraph
            body: >-
              Route to market is a central reason this category does not collapse into a pure feature shootout. Druva
              has credible ecosystem evidence: its alliance program stresses integrations with leading technology
              providers, its 2026 partner awards span public sector, MSP, Dell, AWS, and regional categories, and its
              Microsoft and AWS integrations let it position itself as an overlay on hyperscaler storage and recovery
              primitives rather than as a disconnected stack. That is strategically useful because it reduces the risk
              that hyperscalers displace Druva outright.


              Even so, reviewed peer surfaces show that Rubrik, Commvault, and Veeam expose broader public reseller,
              MSP, service-delivery, or distributor taxonomies than Druva’s alliance-centered public partner story.
              Native cloud offerings create a second distribution challenge because procurement is already embedded: AWS
              Backup rides AWS accounts, Azure Backup rides Azure, and Microsoft 365 Backup rides the admin center at a
              public $0.15/GB/month price point. Switching costs therefore exist but are uneven. Once a customer has
              recovery workflows, identity protection, and compliance operations centralized in Druva’s console and
              partner-storage integrations, retraining and migration are real frictions. But buyers can still multi-home
              by using native tools for narrow workloads while keeping a broader platform for cyber recovery elsewhere.
