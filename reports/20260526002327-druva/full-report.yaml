              the topline logo count. The visible buyers are central IT, infrastructure, security, cloud, and compliance
              teams rather than departmental line-of-business users. Public stories and partner listings repeatedly
              center Microsoft 365, Azure, EC2, VMware, Hyper-V, Google Workspace, and Salesforce backup or recovery
              motions, which implies Druva usually lands with administrators responsible for business-critical data and
              then expands across adjacent workload surfaces. The named public references also skew toward regulated or
              operationally sensitive environments: healthcare, pharmaceutical services, offshore operations, medical
              associations, retail apparel, and food manufacturing. That is a favorable signal for enterprise-grade
              trust, but it also means the public evidence set is curated and may overrepresent customers with unusually
              clear cloud-migration or cyber-resilience stories. Public materials still do not disclose revenue mix by
              cohort, the relative weight of partner-sourced deals, or the share of customers that remain
              single-workload accounts.
