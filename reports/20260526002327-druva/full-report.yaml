      - number: '2.2'
        title: TAM, SAM, and evidence-constrained sizing lenses
        blocks:
          - type: paragraph
            body: >-
              The most defensible public 2026 lens is pure cloud backup. Mordor Intelligence sizes that market at $7.13B
              in 2026, while Research and Markets places it at $9.41B in the same year. A broader delivery lens appears
              when managed backup services are included: Mordor sizes backup-as-a-service at $10.9B in 2026, which is
              materially larger than the pure cloud-backup range and therefore better reflects the way Druva often
              reaches customers through MSPs and alliance channels. The correct conclusion is not that one publisher is
              right and the others are wrong; it is that Druva's opportunity changes meaningfully with category scope.


              Public sources still do not reveal a clean Druva-specific SAM or SOM. Druva discloses scaled operating
              evidence—thousands of global enterprises on the about page and more than 11 million daily backups in a
              later press release—but that is not revenue and does not segment the installed base between SaaS apps,
              endpoints, cloud workloads, MSP channels, or direct enterprise sales. The sizing table and range figure
              therefore preserve contradictory estimates rather than collapsing them into one generic TAM number.
