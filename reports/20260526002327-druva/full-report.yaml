            body: >
              Druva's trust evidence is unusually concrete for a private infrastructure software company. Its trust
              center names governance, risk, and compliance ownership, plus incident response, vulnerability management,
              SIEM, application security, CI/CD security reviews, threat modeling, and SAST/DAST. The same surface
