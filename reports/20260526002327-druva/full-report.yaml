            body: >-
              Commercially, Druva is carrying several layered dependencies at once. AWS is not only an infrastructure
              supplier; it is also a marketplace route, a government-offer packaging channel, an ecosystem validator,
              and part of Druva's differentiation story. The UK Digital Marketplace listing goes further by stating the
              service only holds backup data in AWS clouds, underscoring how hard it may be to separate delivery, cost,
              and procurement risk from a single hyperscaler relationship. Review evidence adds another commercial
              warning: buyers repeatedly cite pricing opacity, licensing complexity, reporting limits, and occasional
              performance issues. Those themes matter because backup platforms are often sold on simplicity and
              predictability. Public comparison pages also show Druva trailing Rubrik on review-based mindshare and
              recommendation rates, while Veeam markets broad platform coverage around resilience, governance, privacy,
              and cloud storage. None of these public signals alone is thesis-breaking, but together they imply that
