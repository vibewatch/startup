      - number: '7.5'
        title: Mitigants, Monitoring Indicators, and Kill Criteria
        blocks:
          - type: paragraph
            body: >-
              There are real mitigants in the public record. Druva has visible compliance and governance capabilities, a
              GovCloud-oriented offer, AWS ecosystem validation, and a product message centered on immutability,
              air-gapping, and cyber resilience. Those are meaningful strengths in a category where buyers increasingly
              want a managed control plane instead of stitching together storage, scripts, and point tools. But the
              mitigants do not remove the need for crisp investment triggers. This chapter's thesis is that Druva can
              remain investable if the company demonstrates stable service execution, manages AWS concentration
              intelligently, keeps customer friction from becoming a reputation problem, and can support a current
              valuation with fresher evidence than a 2021 round. The corresponding kill criteria should therefore be
              measurable rather than narrative-based: material outage patterns, worsening review sentiment on pricing or
              performance, a weaker-than-expected current financing mark, or any pullback in certification-backed
