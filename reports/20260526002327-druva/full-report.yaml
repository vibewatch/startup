  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, included spend, and substitutes
        blocks:
          - type: paragraph
            body: >-
              Druva should not be framed as a point-solution endpoint backup vendor. The reviewed official pages
              consistently describe a cloud-native, fully managed SaaS platform that protects endpoints, Microsoft 365,
              Google Workspace, and cloud workloads, while the newer company language shifts the category from backup
              toward cyber resilience and data security. That means the practical market boundary includes pure cloud
              backup, SaaS-application backup, cloud-workload protection, and some adjacent resilience spend tied to
              recovery, immutability, and cross-cloud operations. It does not include unrelated storage hardware,
              generic cloud infrastructure consumption, or every security control in the enterprise stack.


              The cleanest bounded substitute set is native cloud backup. AWS Backup, Azure Backup, and Google Cloud
              Backup and DR all cover meaningful portions of the same job, especially for buyers who only need in-cloud
              workload protection. Druva's real relevance increases when buyers want one SaaS control plane across
              productivity suites, endpoints, and cloud workloads, or when they want MSP-delivered and
              alliance-supported operations rather than infrastructure-specific tooling. That boundary logic matters
              because every TAM statement gets larger once service delivery, SaaS-app protection, or cyber-resilience
              adjacencies are included.
