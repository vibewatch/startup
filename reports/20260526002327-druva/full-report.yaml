            body: >-
              Druva’s best public customer evidence is not the broad customer-count claim; it is the set of live stories
              that disclose operational metrics. Nature’s Path is one of the strongest references because it pairs
              consolidation across Microsoft 365, Azure, VMware, and Entra ID with a 67% spend reduction and concrete
              restore metrics. Included Health shows Druva working inside a compliance-sensitive healthcare workflow,
              with 100x faster restores during Google Workspace consolidation. BW Offshore proves the product can
