        - 5.7x ARR / 6.4x revenue
        - Mid-band cloud-security comp that shows what discounted growth can look like
        - Broader endpoint and security platform, not a pure backup peer
      - - Veeam
        - $1.7B ARR
        - $15B secondary valuation
        - 8.8x ARR
        - Best recent private premium benchmark in data resilience
        - Private 2024 secondary mark, not a live public clearing price
