            body: >-
              Because Druva's current ARR and cap table are undisclosed, the scenario work should be read as disciplined
              range-setting rather than a false point estimate. The bear case of roughly $0.6 billion to $0.9 billion
              assumes Druva's ARR has not moved much above the >$200 million 2023 floor, that user-friction issues slow
              expansion, and that secondary buyers apply N-able or discounted Commvault-like multiples. The base case of
              roughly $0.8 billion to $1.3 billion assumes Druva has at least maintained or modestly grown above the
              2023 ARR floor and deserves a 4x-6x band consistent with a discounted public-comp basket. The bull case of
              roughly $1.5 billion to $2.2 billion requires proof that Druva has expanded well above $200 million ARR,
              has strong retention and margin quality, and can command a Veeam-like or Rubrik-adjacent multiple despite
              being private and only thinly traded. The scenario spread is wide because valuation support today is
