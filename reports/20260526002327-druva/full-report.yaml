      - number: '2.5'
        title: Contradictions preserved and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              Public evidence is strong enough to prove that Druva operates in a meaningful and growing market, but it
              is not strong enough to isolate a clean Druva-specific SAM or SOM. The core 2026 cloud-backup estimates
              already vary from $7.13B to $9.41B, and the adjacent BaaS estimate of $10.9B is larger because it includes
              more of the service-delivery layer. Druva's own pages widen the boundary again by including Microsoft 365,
              Google Workspace, endpoints, EC2, Azure, Dynamics 365, and Entra ID. Those are all relevant to valuation,
              but they are not one normalized spend bucket.


              The more important unresolved items are internal mix and monetization. Public sources do not disclose how
              much Druva's revenue comes from MSPs versus direct enterprise sales, how backup volumes split by workload,
              or what apples-to-apples ASP should be used against native cloud substitutes. SelectHub publishes one
              public pricing comparison, but the units differ and are not reliable enough to back into SOM. This chapter
              therefore preserves the contradictory market lenses and carries forward explicit diligence asks instead of
              pretending the open-source record is more precise than it is.
