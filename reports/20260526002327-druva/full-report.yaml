              American College of Radiology provides the clearest AWS production-scale proof with 150 TB of EC2 data
              protected, 25% lower TCO, and support for a 99.5% application migration to AWS. Fred Perry adds a modern
              Microsoft/Azure proof point with 75% time savings and easier restore delegation, while the global
              pharmaceutical case study remains useful because it ties multi-geo Microsoft 365 support to 3,800
              protected users and 5x faster email recovery after a ransomware wake-up call. The consistent pattern is
