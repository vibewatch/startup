      - number: '1.2'
        title: Founders, Leadership Bench, and Governance Signals
        blocks:
          - type: paragraph
            body: >-
              Druva has not made the classic founder-to-professional-manager transition seen at many late-stage
              infrastructure startups. Jaspreet Singh remains founder and CEO, and Milind Borate remains a co-founder in
              a product leadership role, so external stakeholders still encounter a strongly founder-led company. That
              continuity is strategically useful because it reinforces the narrative that Druva invented its
              architecture around cloud-native data protection instead of modernizing an installed base. At the same
              time, the company has been layering in operator depth. The current leadership materials highlight CRO John
              Hultman, whose background includes Cohesity and Dell EMC, and CFO Jagroop Bal, whose appointment in
              February 2025 added VMware-scale finance experience plus earlier HPE, Deloitte, and Accenture experience.


              Governance is broader than the founder story alone. Druva’s board disclosures show Mike Gustafson as
              chairman and independent director, while the same public materials also expose investor-linked board
              participation from Nexus Venture Partners, Sequoia India, and Riverwood Capital. That mix suggests a
              governance model with real sponsor influence rather than a purely founder-controlled board. It is still
              reasonable to flag moderate key-person dependence, however, because the public narrative remains heavily
              concentrated around Jaspreet and a relatively small named executive set. Investors should treat that as
              manageable but important: the bench is broader than one person, yet the company’s external identity,
              financing story, and product vision still run through the founder CEO.
