      - number: '4.3'
        title: Cost structure, gross-margin path, and what remains private
        blocks:
          - type: paragraph
            body: >-
              Druva’s architecture strongly suggests a software-like cost structure, but the company does not publish
              the numbers required to verify that inference. Official pages emphasize a fully managed SaaS delivery
              model, no backup hardware to buy or maintain, and broad coverage across cloud, on-premises, endpoints, and
              SaaS applications. That points away from appliance-heavy cost of goods and toward public-cloud
              infrastructure, storage, retention, support, and recovery operations as the main gross-margin drivers.
              Vendr and SelectHub reinforce the same logic from the pricing side: data volume under management,
              retention duration, and contract term are named as primary cost drivers, so gross margin should move
              materially with storage efficiency, workload mix, and pricing discipline. The problem is disclosure depth.
              None of the reviewed Druva sources publish gross margin, free cash flow, deferred revenue, remaining
              performance obligations, CAC, payback, or NRR. The result is that investors can describe the likely
              economic engine, but cannot yet test whether Druva’s margin path resembles a mature high-gross-margin
              backup SaaS model or a more infrastructure-intensive service profile.
