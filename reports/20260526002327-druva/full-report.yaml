      - number: '4.4'
        title: Capital adequacy, financing dependency, and valuation signals
        blocks:
          - type: paragraph
            body: >-
              Capital adequacy is visible only in outline. The last clearly disclosed primary financing event is Druva’s
              April 2021 $147 million round at a valuation above $2 billion, and management said that capital would fund
              innovation, scale, and route-to-market expansion. Tracxn continues to show total funding of roughly $475
              million, and Yahoo Finance/Forge still lists the latest primary funding date as April 19, 2021. What is
              missing is exactly what an underwriter needs most in 2026: cash on hand, monthly burn, debt, runway, and
              any post-2021 capital planning. The only fresh market signal is secondary and noisy. Yahoo/Forge shows an
              estimated valuation of $772.68 million as of May 22, 2026, far below the 2021 primary mark. That does not
              prove a down round is imminent, but it does indicate unresolved valuation compression risk or model noise
              that management has not publicly reconciled. Taken together, the business may well be adequately funded,
              yet open-source diligence cannot distinguish “comfortably capitalized” from “capital efficient but
              approaching a new financing decision.”
