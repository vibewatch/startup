      - number: '3.4'
        title: Moat durability, commoditization risk, and adverse evidence
        blocks:
          - type: paragraph
            body: >-
              Druva’s moat is real but conditional. The strongest durable claim in reviewed public material is
              operating-model simplicity: official and independent sources consistently position Druva as the pure SaaS
              player in a category where many rivals still carry heavier hybrid or appliance histories. That matters for
              teams that want fast deployment, no infrastructure management, and cleaner cyber-recovery operations. But
              simplicity is not the whole market. Cohesity+Veritas and Commvault pressure Druva where buyers want
              maximum workload breadth and deployment flexibility; Veeam stays credible where portability across mixed
              hypervisors matters; Dell and IBM remain relevant when incumbent estates value vaulting, retention, or
              recovery-testing depth.


              Adverse evidence reinforces the idea that Druva is differentiated but not dominant. PeerSpot’s May 2026
              comparison gives Druva materially lower mindshare and recommendation scores than Rubrik and lower
              mindshare than Veeam, which is a concrete third-party signal that brand and installed-base strength still
              sit with larger peers. At the same time, feature promises are converging across the leader set: cyber
              resilience, immutability, AI, multicloud coverage, and rapid recovery appear across nearly every serious
              competitor. The main risk is therefore commoditization around the same cyber-recovery language plus
              transparent native-cloud pricing below the enterprise-platform tier. Druva can defend that pressure, but
              only if simplicity converts into measurable win rates rather than just cleaner marketing copy.
