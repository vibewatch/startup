      - number: '2.3'
        title: Buyer, user, payer, and route-to-market segmentation
        blocks:
          - type: paragraph
            body: >-
              Druva's buyer map changes by segment. In direct enterprise motions, the buyer is typically an IT,
              infrastructure, or security team looking for cloud-managed protection across Microsoft 365, Google
              Workspace, endpoints, and public-cloud workloads. In the managed-service motion, the intermediate buyer is
              the MSP itself: Druva provides a Managed Services Console, MSP Academy, a formal MSP partner program, and
              even a partner portal with deal registration. That architecture implies a two-step payer model in which
              the MSP procures or bundles the platform and the end customer ultimately funds it through a managed
              service contract.


              Alliances add another adoption path. Druva's Microsoft and AWS alliance pages show that the company is not
              only selling against native tools; it is also trying to ride those ecosystems by protecting Microsoft 365,
              Azure, Dynamics 365, Entra ID, Azure VMs, and Amazon EC2 from one SaaS platform. The result is a mixed
              market structure where the same product can be sold direct, via MSP catalog, or through workload-specific
              alliance motions. That is good for reach, but it also means no single budget owner or procurement path
              defines the whole market.
