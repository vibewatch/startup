  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Current ARR verification misses the needed floor
        - Verified current ARR does not materially exceed the >$200M 2023 disclosure
        - A premium private multiple becomes very difficult to justify
        - Downgrade from track toward avoid unless price resets further
      - - Cap-table waterfall is investor-unfriendly
        - Preferences, debt, or senior claims materially subordinate new money
        - Enterprise value no longer maps cleanly to equity return
        - Stop underwriting until the waterfall is modeled
      - - Secondary clears remain thin and below quoted marks
        - Actual trades cluster below Yahoo/Forge style estimates or come only in tiny blocks
        - Quoted headline prices lose credibility as fair-value references
        - Apply a deeper liquidity discount or stand aside
      - - Product friction shows up in retention
        - Restore, reporting, or pricing complaints turn into churn or stalled expansion
        - Druva loses the right to be valued above mature backup vendors
        - Reset toward a bear-case multiple band
      - - Security or resilience credibility is dented
        - A material security event, persistent outage pattern, or weak incident record emerges
        - The core recovery trust proposition is impaired
        - Re-cut thesis immediately and re-open technical diligence
    notes: These are committee-level kill criteria tied to valuation transmission, not just product talking points.
    claimRefs:
      - CV052
      - CV055
      - CV057
      - CV058
      - CV059
      - CV061
      - CV062
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - Current ARR / NRR
        - Latest ARR, cohort retention, and net-new ARR bridge for 2024-2026
        - Without refreshed denominators, no current multiple can be underwritten
        - CFO data-room request and board deck review
      - - Margins / burn / cash flow
        - Gross margin, operating cash flow, burn, and runway
        - Quality of revenue matters as much as quantity for a premium multiple
        - Finance diligence with audited management accounts
      - - Cap table / preferences
        - Fully diluted cap table, liquidation preferences, debt, and option overhang
        - Return math depends on equity structure, not just enterprise value
        - Legal diligence and updated waterfall model
      - - Secondary transaction tape
        - Actual 2026 cleared trades, share class, block size, and recency
        - Quoted prices are inconsistent and may not reflect true liquidity
        - Broker/platform confirmation and transfer-ledger review
      - - Product retention proof
        - Expansion and churn by workload, customer size, and MSP motion
        - Review-site friction must be reconciled with actual retention
        - Customer cohort analysis and reference calls
      - - Operational-resilience history
        - Incident log, SLA performance, and root-cause writeups for 2024-2026
        - A recovery vendor is only premium if customers trust restore and uptime
        - Support-ops review and customer-reference pack
    notes: >-
      These asks are the minimum package needed to move from directional valuation work to an investable equity-return
      view.
    claimRefs:
      - CV052
      - CV057
      - CV059
      - CV060
      - CV061
      - CV062
