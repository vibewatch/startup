      - number: '2.4'
        title: Growth drivers and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              The demand drivers behind Druva's category are concrete. Mordor explicitly ties cloud-backup growth to
              cyber-extortion, SaaS proliferation, and stricter data-resiliency rules. CISA's #StopRansomware guide says
              organizations should maintain offline encrypted backups and regularly test their availability and
              integrity, which turns backup from low-priority hygiene into a control that is expected to work during an
              actual cyber event. IBM's 2025 breach report adds the budget consequence: the average breach cost remains
              $4.4M globally, and business disruption remains widespread. Those factors support continued spending on
              recovery readiness even in a tighter software budget environment.


              The constraints are equally real. Native AWS, Azure, and Google tools absorb part of the
              infrastructure-backup job, especially when buyers are comfortable with single-cloud scope. Third-party
              review sources also surface non-trivial friction around Druva itself: large-scale restore performance,
              pricing sensitivity, internet dependence, migration complexity, and workflow clarity. Taken together, the
              evidence suggests Druva's adoption is supported by strong secular tailwinds but bounded by substitute
              products and implementation frictions that matter most in simpler or cost-sensitive environments.
