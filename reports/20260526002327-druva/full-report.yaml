companyProfile:
  summary: >-
    Druva is a 2008-founded, Indian-origin data protection company founded in Pune and now headquartered in Santa Clara.
    It remains founder-led under Jaspreet Singh and positions the Data Security Cloud as a fully managed SaaS platform
    spanning backup, cyber response and recovery, eDiscovery/compliance, and adjacent identity-resilience workflows.
    Public scale evidence is real: Druva disclosed >$200M ARR in August 2023, company materials later cited nearly 7,500
    customers including 75 of the Fortune 500, and LATKA says 2024 revenue reached $304.3M. The latest clean primary
    capital anchor is the April 2021 Series H at >$2B valuation, but current 2026 price discovery and operating
    disclosure remain materially thinner.
