chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Origins, and Platform Positioning
        blocks:
          - type: paragraph
            body: >-
              Druva is still best understood as a private, founder-built cloud data protection company that broadened
              into cyber resilience rather than as a legacy backup vendor retrofitting cloud features. Reviewed sources
              consistently place the company’s founding in 2008, with founding roots in Pune, India and current
              headquarters in Santa Clara, California. Sacra and TechTarget both name Jaspreet Singh, Milind Borate, and
              Ramani Kothandaraman as the founding team, while Sacra adds the founder-market-fit point that the trio
              came from Veritas. That combination matters because Druva’s current messaging still leans on “cloud-native
              from day one” rather than on a hardware or appliance legacy.


              The canonical product identity for later chapters should therefore be the Druva Data Security Cloud: a
              fully managed SaaS platform spanning cloud workloads, SaaS applications, endpoints, and now identity
              recovery. Official, partner, and marketplace-facing material repeatedly emphasize air-gapped and immutable
              protection, centralized recovery, and no hardware to manage. AWS positions Druva as a 100% SaaS service
              built on AWS that covers AWS workloads plus major SaaS estates such as Microsoft 365, Salesforce, and
              Google Workspace. Microsoft’s adoption page shows the same expansion on the Microsoft side through
              Microsoft 365 Backup Express for Exchange, SharePoint, OneDrive, and Entra ID. In 2026 Druva also pushed
              protection further into business applications and identity systems through Power BI backup and Identity
              Resilience for Okta, Active Directory, and Entra ID. That product breadth explains why the company’s
              current story is now data security and cyber resilience first, backup second.
