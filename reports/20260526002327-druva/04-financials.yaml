schemaVersion: report-v2
artifact: financials
slug: druva
runDate: '2026-05-26'
company:
  name: Druva
chapter:
  number: 4
  title: Financials
  summary: >-
    Druva presents as a credible recurring-revenue cloud data-protection business,
    but the public financial picture remains a patchwork of official product and
    funding disclosures, third-party revenue trackers, pricing benchmarks, and
    public-comp filings rather than audited company statements. The strongest
    disclosed facts are that Druva last raised $147 million at a valuation above
    $2 billion in 2021, still markets a fully managed cloud-native SaaS platform
    with consumption-based pricing, and is officially described as serving nearly
    7,500 customers. The biggest underwriting blockers are missing cash, burn,
    margin, retention, and realized-pricing disclosure, plus a wide gap between
    the 2021 primary valuation and a much lower 2026 Forge-derived secondary
    valuation signal.
sections:
  - id: revenue-model-and-pricing
    title: Revenue model, pricing architecture, and revenue quality
    body: >-
      Druva’s public materials support a recurring SaaS revenue model, but not a
      simple public rate card. Official pages describe a fully managed,
      cloud-native platform with consumption-based pricing rather than hardware
      sales, and the pricing page breaks the portfolio into enterprise,
      productivity, identity, CRM, and endpoint data-protection categories. That
      framing matters because it implies a diversified workload mix across users,
      endpoints, cloud resources, and protected data volumes, which is directionally
      consistent with high-quality recurring revenue. Public price discovery,
      however, is fragmented. Vendr says Druva does not publish list pricing and
      instead sells negotiated, quote-based contracts, while Costbench and review
      sites publish observed entry points such as $7 per resource per month for
      Phoenix Business, $4 per Microsoft 365 user, and $8 per endpoint device.
      The AWS Marketplace review adds that pricing can be per user, per resource,
      or per terabyte, with Enterprise and Elite tiers layered on top. The net
      read is that recurring monetization is real, but realized pricing, discount
      ladders, and revenue mix remain undisclosed.
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI006, CI007, CI008, CI009, CI010, CI011, CI012, CI013, CI016, CI017, CI056]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: public-traction-and-sales-efficiency-proxies
    title: Public traction metrics and sales-efficiency proxies
    body: >-
      The best public traction markers are customer scale, historical funding,
      revenue estimates, and buyer-side contract benchmarks, not disclosed unit
      economics. Official Druva material available during this run says the company
      is trusted by nearly 7,500 customers and 75 of the Fortune 500, while the
      2021 financing release said multi-product adoption rose 50 percent and data
      under management grew more than 40 percent over the prior year. Third-party
      trackers then fill in the missing top-line story: Latka reports $304.3 million
      of 2024 revenue after $200 million in 2023 and $100 million in 2019, while
      Tracxn reports $475 million total funding and 1,369 employees as of April
      2026. Buyer-side pricing datasets are the closest thing to sales-efficiency
      proxies. Vendr says contracts commonly span $25,000 to $500,000+ annually,
      Costbench reports a $41.6k median annual contract and 13 percent average
      discount, and review sources show pricing sensitivity in the field. Those
      data points are enough to infer an enterprise-oriented, negotiated sales
      motion, but not enough to calculate CAC, payback, or net retention.
    claimRefs: [CI010, CI014, CI015, CI018, CI019, CI021, CI022, CI023, CI024, CI025, CI026, CI027, CI028, CI029, CI031, CI041]
    tableRefs: [TI003]
    figureRefs: [FI002, FI003]
  - id: cost-structure-and-margin-path
    title: Cost structure, gross-margin path, and what remains private
    body: >-
      Druva’s architecture strongly suggests a software-like cost structure, but
      the company does not publish the numbers required to verify that inference.
      Official pages emphasize a fully managed SaaS delivery model, no backup
      hardware to buy or maintain, and broad coverage across cloud, on-premises,
      endpoints, and SaaS applications. That points away from appliance-heavy cost
      of goods and toward public-cloud infrastructure, storage, retention, support,
      and recovery operations as the main gross-margin drivers. Vendr and SelectHub
      reinforce the same logic from the pricing side: data volume under management,
      retention duration, and contract term are named as primary cost drivers, so
      gross margin should move materially with storage efficiency, workload mix,
      and pricing discipline. The problem is disclosure depth. None of the reviewed
      Druva sources publish gross margin, free cash flow, deferred revenue, remaining
      performance obligations, CAC, payback, or NRR. The result is that investors
      can describe the likely economic engine, but cannot yet test whether Druva’s
      margin path resembles a mature high-gross-margin backup SaaS model or a more
      infrastructure-intensive service profile.
    claimRefs: [CI001, CI002, CI004, CI007, CI035, CI036, CI037, CI038, CI039, CI056, CI057]
    tableRefs: [TI004]
    figureRefs: [FI004]
  - id: capital-adequacy-and-valuation-signals
    title: Capital adequacy, financing dependency, and valuation signals
    body: >-
      Capital adequacy is visible only in outline. The last clearly disclosed
      primary financing event is Druva’s April 2021 $147 million round at a
      valuation above $2 billion, and management said that capital would fund
      innovation, scale, and route-to-market expansion. Tracxn continues to show
      total funding of roughly $475 million, and Yahoo Finance/Forge still lists
      the latest primary funding date as April 19, 2021. What is missing is exactly
      what an underwriter needs most in 2026: cash on hand, monthly burn, debt,
      runway, and any post-2021 capital planning. The only fresh market signal is
      secondary and noisy. Yahoo/Forge shows an estimated valuation of $772.68
      million as of May 22, 2026, far below the 2021 primary mark. That does not
      prove a down round is imminent, but it does indicate unresolved valuation
      compression risk or model noise that management has not publicly reconciled.
      Taken together, the business may well be adequately funded, yet open-source
      diligence cannot distinguish “comfortably capitalized” from “capital efficient
      but approaching a new financing decision.”
    claimRefs: [CI018, CI019, CI020, CI028, CI029, CI032, CI033, CI034, CI039, CI040, CI055, CI057, CI058]
    tableRefs: [TI005]
  - id: peer-benchmarks-and-financial-verdict
    title: Peer benchmarks, disclosure gap, and financial verdict
    body: >-
      The most reliable way to frame Druva financially is by contrast with public
      peers that sell related cyber-resilience and backup platforms. Rubrik’s S-1
      and current earnings releases disclose ARR, revenue, retention, gross margin,
      and free cash flow directly. Commvault’s annual report and fiscal 2026 results
      do the same, with explicit revenue, ARR, gross margin, cash, and free-cash-flow
      numbers. Those peers are not perfect economic substitutes for Druva, but they
      set a clear public-company bar for diligence quality. Against that bar, Druva’s
      public record looks directionally positive on recurring-model quality and scale,
      but weak on underwriteability. The company has credible product breadth,
      enterprise-customer evidence, and revenue estimates in the low hundreds of
      millions, yet no audited statements, no public margin bridge, no cash-flow
      disclosure, and no realized-price waterfall. The financial verdict is therefore
      constructive on business model and cautious on underwriting: Druva appears to
      be a real recurring SaaS franchise, but investors still need audited financials,
      retention data, realized pricing, and capital-base visibility before assigning
      a conviction valuation.
    claimRefs: [CI042, CI043, CI044, CI045, CI046, CI047, CI048, CI049, CI050, CI051, CI052, CI053, CI054, CI055, CI056, CI057, CI058]

tables:
  - id: TI001
    title: Revenue streams table
    columns: [Stream, Evidence-backed mechanism, Unit, Current public status, Revenue quality, Diligence ask]
    rows:
      - [Enterprise data protection, "Official pricing page covers enterprise workloads across servers, databases, files, NAS, and cloud workloads", Mixed workload / consumption based, Active official offering, High recurring quality if usage expands and retention holds, Break out ARR and gross margin by enterprise product family]
      - [Productivity data protection, Official pricing page covers Microsoft 365 and Google Workspace backup, Per user and/or workload, Active official offering, High recurring quality with seat-based renewal behavior, Provide paid seats and net retention by SaaS app]
      - [Digital identity protection, Official pricing page covers Entra ID and Active Directory recovery use cases, Per identity object / configuration scope not publicly standardized, Active official offering, Recurring but pricing transparency is low, Provide attach rate and pricing metric for identity modules]
      - [CRM data protection, Official pricing page covers Salesforce and Dynamics 365 backup, Per application or protected data scope, Active official offering, Recurring with cross-sell potential, Provide customer count and ARPU for CRM workloads]
      - [Endpoint backup and restore, Endpoint page confirms endpoint backup as a standalone use case, Per endpoint or per TB depending contract, Active official offering, High recurring quality in distributed-workforce estates, Provide endpoint ARR and renewal profile]
      - [Cloud workload protection, AWS review and official pages indicate protection for AWS and cloud resources, Per resource or per TB, Active official offering, Recurring but usage growth can pressure storage costs, Provide cloud-workload gross margin and overage structure]
    notes: Official pages establish the monetized workload categories, but they do not disclose revenue mix, realized price, or stream-level ARR.
    claimRefs: [CI001, CI003, CI004, CI005, CI006, CI007, CI027, CI056]
  - id: TI002
    title: Pricing / monetization table
    columns: [Offer or signal, Public price signal, Confidence, What it implies, Source-backed caveat]
    rows:
      - [Phoenix Business, '$7 per resource per month', Medium, Entry point exists for smaller server or data-center deployments, Costbench is a third-party benchmark rather than an official Druva rate card]
      - [Microsoft 365 Backup, '$4 per user per month', Medium, Druva can monetize productivity backup on a seat basis, Public benchmark source is third-party rather than official list pricing]
      - [Endpoint Backup, '$8 per device per month', Medium, Endpoint protection can be sold on a device basis, Costbench sample may not reflect enterprise-scale discounts]
      - [Druva inSync reviewer signal, '$35 annually or $3 monthly per user', Low, Endpoint pricing can land in low-dollar per-user territory, PeerSpot is reviewer-reported and not canonical pricing]
      - [Negotiated enterprise contracts, '$25k to $500k+ annually', Medium, Druva appears to sell through negotiated enterprise agreements rather than transparent checkout, Vendr contract data is buyer-side benchmarking not an official quote sheet]
      - [Pricing unit architecture, Per user / per resource / per TB, Medium, Revenue should scale with workload mix and stored data volume, AWS review indicates model complexity and cost sensitivity for large estates]
      - [Discount signal, 13 percent average negotiated discount in sampled deals, Medium, Realized pricing likely differs materially from any public benchmark, Costbench sample is limited and not a company disclosure]
      - [Public pricing transparency, Official list pricing not publicly published, Medium, Pricing diligence requires quotes or contract samples under NDA, Vendr explicitly says Druva does not publish list pricing]
    notes: Table separates observable public benchmarks from negotiated enterprise economics; none of these sources disclose Druva's actual realized price waterfall.
    claimRefs: [CI007, CI008, CI009, CI010, CI011, CI012, CI013, CI014, CI015, CI016, CI017, CI041]
  - id: TI003
    title: Unit economics table
    columns: [Metric, Value or status, Confidence, Why it matters, Diligence ask]
    rows:
      - ['2024 revenue estimate', '$304.3M', Medium, Best specific third-party top-line datapoint found in this run, Reconcile to audited FY2024 revenue and deferred-revenue movement]
      - ['2025 revenue band', '$100M to $500M statistical range', Low, Shows how wide public estimate uncertainty still is, Provide audited 2025 revenue and segment mix]
      - ['Customer count', 'Nearly 7,500 customers; 75 Fortune 500', Medium, Indicates meaningful scale and enterprise penetration, Provide current paid-customer count and cohort concentration]
      - ['Headcount range', '1,001 to 1,369 employees across public trackers', Low, Useful for rough opex intensity but not precise planning, Provide actual FTE count by function and geography]
      - ['Median annual contract value', '$41,634 per year sample median', Medium, Gives a rough ACV proxy for sales-efficiency thinking, Provide ACV by segment and partner vs direct mix]
      - ['Observed enterprise contract range', '$25k to $500k+ annually', Medium, 'Suggests enterprise, negotiated sales motion', 'Provide median new-logo ACV and renewal ACV']
      - ['Average discount', '13 percent sample average', Medium, 'Realized pricing likely differs from any public benchmark', 'Provide average discount, floor price, and approval thresholds']
      - ['CAC / payback', Undisclosed, Medium, Core underwriting variable for growth efficiency, Provide CAC by segment and fully loaded payback period]
      - ['NRR / GRR', Undisclosed, Medium, Retention quality determines revenue durability, Provide gross and net revenue retention by cohort]
      - ['Gross margin', Undisclosed, Medium, Needed to underwrite unit economics and margin path, Provide GAAP and non-GAAP gross margin with cloud-infrastructure bridge]
      - ['Free cash flow', Undisclosed, Medium, Required to judge self-funding ability and runway, Provide operating cash flow and free cash flow by year]
      - ['Data under management growth', '>40 percent year-over-year in the 2021 release', Medium, Shows platform usage can expand after landing, Provide current 2026 growth rate and attach by product]
    notes: The public unit-economics picture is mostly proxies and market-data estimates; every critical efficiency metric still requires management disclosure.
    claimRefs: [CI014, CI015, CI021, CI022, CI023, CI025, CI029, CI031, CI034, CI035, CI038, CI039]
  - id: TI004
    title: Capital adequacy table
    columns: [Capital item, Public value or status, Why it matters, Current read, Diligence ask]
    rows:
      - ['Latest primary funding round', '$147M Series H on 2021-04-19', Establishes last clearly disclosed primary capital event, Publicly verified and well corroborated, Provide post-2021 financing history and board-approved capital plan]
      - ['Last disclosed primary valuation', '> $2B post-money in 2021', Anchors the last clean private mark, Historical reference point only, Provide current 409A / board valuation and any secondary tender history]
      - ['Total capital raised', '~$475M per trackers', Frames accumulated external financing, Consistent across Tracxn and Sacra / Latka family sources, Provide official lifetime capital table]
      - ['Cash on hand', Undisclosed, Needed for runway and solvency judgment, No public open-source figure located, Provide quarter-end unrestricted cash and revolver availability]
      - ['Monthly burn', Undisclosed, Needed to judge financing dependency, No public open-source figure located, Provide net burn and burn bridge by quarter]
      - ['Runway months', Undisclosed, Converts cash and burn into financing timing, Cannot be estimated responsibly from public data, Provide base-case and downside runway]
      - ['Debt obligations', Undisclosed, Debt service can materially alter equity value, 'No public debt disclosure located in reviewed sources', 'Provide debt schedule, covenants, and maturity ladder']
      - ['Use of 2021 proceeds', 'Innovation, scale, and route-to-market expansion', 'Explains why capital was raised', 'Official use-of-funds description is strategic rather than balance-sheet specific', 'Provide actual deployment of 2021 proceeds by category']
      - ['2026 secondary valuation signal', '$772.68M Forge-derived estimate', Freshest public market signal after the 2021 round, Potential compression or model noise rather than a management-guided value, Explain any internal reconciliation of secondary marks versus operating performance]
      - ['Operating-stress signal', 2026 layoff discussion on Teamblind, Adverse anecdotal evidence can foreshadow tighter spending discipline, Directional only and low confidence, Clarify whether any 2025-2026 workforce reduction occurred and why]
    notes: The table highlights that historical financing is public, but present-day liquidity and leverage are not.
    claimRefs: [CI018, CI019, CI020, CI028, CI029, CI034, CI039, CI040, CI058]
  - id: TI005
    title: Public financial gaps table
    columns: [Missing private metric or dataset, Impact on underwriting, Exact diligence path]
    rows:
      - ['Audited income statement and cash-flow statement', 'Without audited revenue, margin, opex, and cash-flow lines, every valuation bridge stays directional', 'Request last three audited annual statements and YTD management accounts under NDA']
      - ['Cash balance, debt, and runway', 'Capital adequacy cannot be judged from open data', 'Request quarter-end cash, debt schedule, covenant summary, and 12-month runway model']
      - ['Gross margin bridge', 'Cloud-infrastructure efficiency and storage economics remain opaque', 'Request GAAP gross margin plus cost-of-revenue decomposition by infrastructure, support, and services']
      - ['CAC, payback, and efficiency cohorts', 'Sales efficiency cannot be underwritten', 'Request CAC by segment, payback by channel, and quota-carrying-rep productivity']
      - ['GRR / NRR by cohort', 'Revenue quality and expansion durability remain unproven', 'Request retention by product, customer size, and renewal vintage']
      - ['Realized pricing waterfalls', 'Public benchmarks do not reveal actual monetization or discounting discipline', 'Request quote-to-close waterfall, average discount, floor price, and approval thresholds']
      - ['Revenue mix by workload and product family', 'The business may be more or less concentrated than public materials imply', 'Request ARR and revenue split across endpoints, SaaS apps, cloud, and enterprise workloads']
      - ['Deferred revenue / RPO', 'Working-capital advantages cannot be quantified', 'Request deferred revenue trend, billings, and remaining performance obligations']
      - ['Headcount by function', 'Opex intensity and hiring discipline cannot be tested with tracker estimates alone', 'Request FTE counts by R&D, S&M, support, and G&A']
      - ['Current valuation support', 'The 2021 primary mark and 2026 Forge estimate diverge sharply', 'Request latest 409A, board materials, and any recent secondary-clearing prices']
    notes: These are the minimum data requests needed to move from directional pattern recognition to real underwriting.
    claimRefs: [CI009, CI010, CI038, CI039, CI054, CI055, CI057, CI058]

figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    layout: wide
    summary: Publicly observable path from protected workloads to recurring Druva revenue.
    approximationNotes: The bridge is conceptual because Druva does not disclose stream-level ARR, billings, or gross-profit conversion.
    data:
      nodes:
        - { id: workloads, label: 'Protected workloads across cloud, on-prem, SaaS, and endpoints', type: input }
        - { id: pricing_units, label: 'Pricing units: user, resource, terabyte', type: process }
        - { id: quoted_contract, label: 'Negotiated annual or multi-year contract', type: process }
        - { id: recurring_revenue, label: 'Recurring subscription / consumption revenue', type: output }
        - { id: storage_growth, label: 'Data growth and retention drive upsell', type: process }
        - { id: gross_profit, label: 'Gross profit after cloud-storage and support costs', type: output }
      edges:
        - { from: workloads, to: pricing_units }
        - { from: pricing_units, to: quoted_contract }
        - { from: quoted_contract, to: recurring_revenue }
        - { from: workloads, to: storage_growth }
        - { from: storage_growth, to: recurring_revenue }
        - { from: recurring_revenue, to: gross_profit }
    claimRefs: [CI001, CI003, CI004, CI007, CI009, CI010, CI036, CI037, CI056]
  - id: FI002
    title: Unit economics bridge
    type: flow
    layout: standard
    summary: Public proxies that exist today versus the private metrics still required for underwriting.
    approximationNotes: Nodes reflect public proxies and missing disclosures, not a solved Druva unit-economics model.
    data:
      nodes:
        - { id: customers, label: 'Nearly 7.5k customer signal', type: input }
        - { id: contracts, label: '$25k to $500k+ annual contract proxy', type: process }
        - { id: discounts, label: '13 percent sample discount signal', type: process }
        - { id: revenue_estimate, label: '$304.3M 2024 revenue estimate', type: output }
        - { id: missing_retention, label: 'Missing NRR / GRR disclosure', type: output }
        - { id: missing_efficiency, label: 'Missing CAC / payback disclosure', type: output }
      edges:
        - { from: customers, to: contracts }
        - { from: contracts, to: discounts }
        - { from: discounts, to: revenue_estimate }
        - { from: contracts, to: missing_retention }
        - { from: contracts, to: missing_efficiency }
    claimRefs: [CI014, CI015, CI023, CI025, CI038, CI039, CI055]
  - id: FI003
    title: Financial estimate range
    type: range
    layout: standard
    summary: Publicly visible ranges for revenue, customer count, headcount, contract size, and valuation.
    approximationNotes: Bounds blend official statements, tracker estimates, and buyer-side benchmarks; they are not management guidance.
    data:
      items:
        - { label: 'Public revenue visibility band', low: 100, high: 500, unit: '$M' }
        - { label: 'Customer-count signals', low: 6000, high: 7500, unit: 'customers' }
        - { label: 'Employee-count signals', low: 1001, high: 1369, unit: 'employees' }
        - { label: 'Observed annual contract range', low: 25, high: 500, unit: '$K' }
        - { label: 'Valuation signals (2021 primary vs. 2026 Forge-derived)', low: 772.68, high: 2000, unit: '$M' }
    claimRefs: [CI010, CI018, CI019, CI023, CI025, CI030, CI031, CI034, CI035, CI058]
  - id: FI004
    title: Capital intensity / cash-flow map
    type: flow
    layout: wide
    summary: How disclosed capital inputs and undisclosed liquidity outputs shape the underwriting problem.
    approximationNotes: The map reflects public evidence only; actual cash, debt, and burn are undisclosed.
    data:
      nodes:
        - { id: round2021, label: '2021 $147M primary round', type: input }
        - { id: use_of_funds, label: 'Innovation, scale, route-to-market expansion', type: process }
        - { id: saas_model, label: 'Recurring SaaS revenue base', type: process }
        - { id: cloud_costs, label: 'Cloud storage, retention, and support cost load', type: process }
        - { id: no_cash_data, label: 'No public cash, burn, debt, or runway', type: output }
        - { id: secondary_signal, label: '2026 Forge-derived valuation compression signal', type: output }
        - { id: underwriting_risk, label: 'Financing and valuation uncertainty', type: output }
      edges:
        - { from: round2021, to: use_of_funds }
        - { from: use_of_funds, to: saas_model }
        - { from: saas_model, to: cloud_costs }
        - { from: round2021, to: no_cash_data }
        - { from: no_cash_data, to: underwriting_risk }
        - { from: secondary_signal, to: underwriting_risk }
        - { from: cloud_costs, to: underwriting_risk }
    claimRefs: [CI018, CI019, CI020, CI036, CI037, CI039, CI040, CI058]

callouts:
  - calloutType: strength
    title: Recurring model quality looks real
    body: Druva’s official materials, buyer-side pricing datasets, and reviewer evidence all point to a real SaaS and consumption-based backup platform rather than a one-time appliance business.
    claimRefs: [CI001, CI004, CI010, CI056]
  - calloutType: risk
    title: Capital adequacy is still opaque in open data
    body: The last clearly disclosed primary capital event is the 2021 Series H, but public sources still do not show cash, burn, debt, or runway.
    claimRefs: [CI018, CI019, CI039, CI057]
  - calloutType: insight
    title: Peer filings show the missing work
    body: Rubrik and Commvault disclose the ARR, retention, margin, and free-cash-flow metrics that Druva still withholds, so the main diligence issue is disclosure depth, not lack of category benchmarks.
    claimRefs: [CI042, CI043, CI047, CI049, CI050, CI051, CI054]

