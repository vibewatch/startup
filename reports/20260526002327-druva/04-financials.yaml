  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: audited-financials
      missingEvidence: Audited income statement, balance sheet, and cash-flow statement for the last three fiscal years plus YTD management accounts.
      whyItMatters: Without audited statements, Druva's revenue quality, gross margin, opex discipline, and cash generation cannot be underwritten with conviction.
      diligencePath: Request audited financials, monthly management reporting, and KPI bridges under NDA from finance leadership.
      relatedQuestionRefs: [QI008, QI018, QI019, QI025, QI026]
      relatedTableRefs: [TI003, TI004, TI005]
    - type: private-evidence-only
      severity: material
      topic: realized-pricing
      missingEvidence: Contract-level pricing waterfalls showing list, discount, overage, renewal uplift, and multi-product bundle behavior.
      whyItMatters: Public pricing benchmarks show only fragments of list or sample deal values and do not reveal actual monetization quality.
      diligencePath: Request anonymized price books, recent quotes, renewal cohorts, and approval matrices by segment.
      relatedQuestionRefs: [QI004, QI006, QI007, QI025]
      relatedTableRefs: [TI002, TI005]
    - type: private-evidence-only
      severity: material
      topic: retention-and-efficiency
      missingEvidence: Gross retention, net revenue retention, CAC, payback, and quota-carrying productivity by segment.
      whyItMatters: These are the core variables needed to judge revenue durability and capital efficiency in a SaaS underwriting model.
      diligencePath: Request cohort retention schedules, CAC methodology, payback calculation, and rep productivity dashboard.
      relatedQuestionRefs: [QI008, QI015, QI025, QI026]
      relatedTableRefs: [TI003, TI005]
    - type: conflicting-data
      severity: material
      topic: valuation-signals
      missingEvidence: A management or board explanation reconciling the 2021 primary valuation with the much lower 2026 Forge-derived estimate.
      whyItMatters: The size of the gap changes how investors think about dilution risk, growth quality, and next-round expectations.
      diligencePath: Request latest 409A, board valuation materials, and any recent secondary-market clearing data.
      relatedQuestionRefs: [QI011, QI012, QI026]
      relatedTableRefs: [TI004, TI005]
    - type: missing-source
      severity: material
      topic: capital-adequacy
      missingEvidence: Public or company-provided cash balance, debt, burn, and runway information current to 2026.
      whyItMatters: Capital adequacy cannot be judged responsibly from historical funding alone.
      diligencePath: Request cash waterfall, debt schedule, covenant package, and base / downside runway model.
      relatedQuestionRefs: [QI018, QI019, QI025, QI026]
      relatedTableRefs: [TI004, TI005]
