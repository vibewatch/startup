callouts:
  - calloutType: insight
    title: Druva's opportunity expands only when the category expands
    body: >-
      The pure cloud-backup market is meaningful on its own, but Druva's valuation case gets stronger only
      when buyers pay for cross-workload resilience, SaaS-app backup, and MSP-delivered service layers in
      addition to basic cloud backup.
    claimRefs: [CM023, CM024, CM025, CM026, CM036, CM039, CM041]
  - calloutType: strength
    title: Workload breadth and channel design fit heterogeneous environments
    body: >-
      Official product, alliance, and MSP pages show Druva reaching the market through multiple paths:
      direct enterprise, partner-led managed services, and workload-specific alliances with hyperscaler
      ecosystems.
    claimRefs: [CM009, CM010, CM012, CM013, CM014, CM015, CM019, CM037, CM038]
  - calloutType: risk
    title: Native tools and operational friction cap convertibility
    body: >-
      The same cloud-native design that lowers infrastructure overhead also leaves Druva exposed to native
      cloud substitutes and to buyer concern about pricing normalization, restore performance, and migration
      friction.
    claimRefs: [CM020, CM021, CM022, CM032, CM033, CM034, CM035, CM046, CM047]

