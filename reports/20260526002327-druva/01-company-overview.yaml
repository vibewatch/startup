    {
      "id": "milestones-partnerships-and-open-risks",
      "title": "Milestones, Ecosystem Expansion, and Open Risks",
      "body": "The milestone record shows a company that kept extending outward from endpoint backup into a much broader resiliency control plane. The early arc runs from 2008 founding through a 2013 shift into cloud-native SaaS, then through the 2018 CloudRanger and 2020 SfApex acquisitions that deepened AWS and Salesforce relevance. The 2021 financing round gave Druva fresh capital just as cloud adoption accelerated, and the 2023 ARR milestone confirmed that the business had become materially scaled. The newer milestones are more strategic than purely financial: a February 2025 CFO hire, a March 2025 Microsoft relationship with Azure integration, a March 2026 Identity Resilience launch, and a May 2026 Dell PowerProtect/Data Domain integration all indicate a company trying to sit closer to security operations and enterprise recovery workflows rather than to standalone backup.\n\nThe open-risk side is subtler. Reviewed sources did not surface a well-corroborated public lawsuit or formal regulatory action against Druva, which is positive. The adverse evidence that did surface is weaker but still worth noting: Blind hosts a Druva layoffs discussion thread and shows a 3.6/5 company snapshot, which is enough to flag employee-sentiment risk but not enough to conclude there was a broad restructuring event. Combined with the unresolved cap-table, revenue, and headcount questions, that means the main diligence ask is not existential risk but disclosure quality. Druva looks like a scaled, strategically relevant private company; the remaining question is how much of the 2023-2026 operating story can be converted from company narrative into independently verified numbers.",
