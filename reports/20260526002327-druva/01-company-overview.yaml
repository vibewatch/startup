    {
      "id": "capital-base-and-scale-signals",
      "title": "Capital Base, Valuation Benchmarks, and Public Scale Signals",
      "body": "Druva’s financing history is public enough to anchor a company-overview chapter, but not public enough to support a current mark without management help. The last clean financing benchmark is the April 2021 round: Druva announced a $147 million investment led by CDPQ with significant participation from Neuberger Berman, while TechCrunch and The Economic Times both reported the round at a valuation above $2 billion. TechCrunch also preserves the earlier path to that point, describing a $130 million 2019 round at roughly a $1 billion valuation and referencing earlier 2016 and 2017 financings. Sacra, ZoomInfo, Economic Times, and Tracxn all converge on roughly $475 million of disclosed lifetime funding.\n\nOperating-scale disclosure is more uneven. Druva’s August 2023 ARR release is still the cleanest quantitative operating milestone in public: more than $200 million in SaaS ARR, more than 5,000 customers, 300% year-over-year MSP customer growth, and more than six billion backups annually. By February-March 2025 company-linked materials were using a nearly 7,500-customer figure, which appears directionally plausible but remains company-issued rather than independently audited. Revenue and staffing are fuzzier. IncFact’s broad $100-500 million revenue estimate is too imprecise to replace the 2023 ARR milestone, and headcount sources conflict sharply: Unify estimated 976 employees in April 2026, Tracxn reported 1,369, and Crunchbase continued to show only a 1001-5000 employee band. The right takeaway is not that Druva lacks scale; it is that current private-company disclosure is insufficient for a precise 2026 revenue or headcount KPI without direct diligence.",
