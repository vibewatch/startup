  - id: peer-profiles-and-pricing
    title: Direct peer profiles, capability breadth, and pricing visibility
    body: |-
      The direct peer set splits cleanly by operating model. Druva’s own materials and partner pages stress a fully managed SaaS control plane with immutable recovery, orchestration, and cloud-native integrations. Rubrik offers a similarly cloud-forward narrative but adds a stronger public security-and-identity framing plus a large explicit partner ecosystem. Commvault is the breadth-driven contrast case: its packaging page exposes three recovery plan families and a notably wide hybrid-enterprise scope, which is why it remains a consolidation threat when buyers care about deployment flexibility. Veeam’s 2026 story is roadmap-led, centered on broader hypervisor portability and cross-platform recovery rather than pure SaaS simplicity. Cohesity+Veritas, meanwhile, frames the merger as a new number-one AI-powered data-security platform, reinforcing breadth pressure on Druva in larger enterprise programs.

      Pricing visibility also divides the field. Druva at least exposes package names and a consumption-based model, while AWS Backup, Azure Backup, and Microsoft 365 Backup publish or calculate usage-based anchors that buyers can benchmark immediately. By contrast, reviewed public pages for Rubrik, Commvault, Cohesity, and Veeam still push the buyer toward a conversation, demo, or packaging explainer rather than an apples-to-apples enterprise list card. That opacity means raw feature comparison is only part of the story; procurement leverage and discount behavior remain important competitive variables.
