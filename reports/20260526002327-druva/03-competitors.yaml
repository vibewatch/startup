  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: realized-enterprise-pricing
      missingEvidence: Actual contracted per-terabyte or per-workload pricing and discount bands for Druva, Rubrik, Commvault, Veeam, and Cohesity.
      whyItMatters: Public package names and usage anchors do not reveal whether Druva’s SaaS simplicity converts into a procurement advantage at enterprise scale.
      diligencePath: Collect recent customer quotes, reseller discount schedules, and renewal pricing from at least three enterprise deals per direct peer.
      relatedQuestionRefs:
        - QP008
      relatedTableRefs:
        - TP003
    - type: private-evidence-only
      severity: material
      topic: competitive-win-loss
      missingEvidence: Segment-level head-to-head win and loss rates for Druva versus Rubrik, Commvault, Cohesity, and Veeam in enterprise consolidation deals.
      whyItMatters: Public positioning sources show relative narrative strength, but they do not prove whether Druva’s SaaS simplicity is winning or losing large heterogeneous estate replacements.
      diligencePath: Request trailing-twelve-month competitive win-loss data by workload mix, deployment model, and buyer segment from Druva sales leadership.
      relatedQuestionRefs:
        - QP025
      relatedTableRefs:
        - TP004
