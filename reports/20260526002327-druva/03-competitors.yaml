callouts:
  - calloutType: strength
    title: SaaS simplicity is a real differentiator
    body: Druva is still the clearest fully managed SaaS option inside the reviewed leader set, which matters for buyers who want cyber resilience without customer-managed backup infrastructure.
    claimRefs:
      - CP002
      - CP004
      - CP038
  - calloutType: risk
    title: Native-cloud pricing creates a public price floor
    body: Microsoft 365 Backup and AWS Backup publish simple usage pricing, which can pull narrower workloads away from higher-touch platform decisions before Druva even reaches a full-platform comparison.
    claimRefs:
      - CP034
      - CP041
  - calloutType: insight
    title: Distribution depth is nearly as important as product breadth
    body: Public partner evidence suggests Rubrik, Commvault, and Veeam disclose deeper channel taxonomies than Druva, so ecosystem leverage may matter as much as feature checklists in competitive outcomes.
    claimRefs:
      - CP033
      - CP042
      - CP046
