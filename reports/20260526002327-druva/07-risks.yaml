callouts:
- calloutType: risk
  title: AWS concentration is the core transmission risk
  body: Druva is not merely integrated with AWS; public company and marketplace materials portray AWS as infrastructure base, marketplace route, and government-offer wrapper. That makes AWS a three-way dependency touching service delivery, unit economics, and go-to-market.
  claimRefs:
  - CR003
  - CR004
  - CR006
  - CR042
- calloutType: risk
  title: Customer friction is visible in public reviews
  body: TrustRadius and PeerSpot do not show catastrophic rejection, but they do surface a pattern of complaints around pricing transparency, reporting flexibility, UI friction, and performance on heavier backup workloads. That pattern matters because Druva sells operational simplicity.
  claimRefs:
  - CR021
  - CR022
  - CR023
  - CR024
  - CR025
  - CR043
- calloutType: risk
  title: Incident quality is still under-documented publicly
  body: Independent monitors track outage history and even note prominent incidents, but public evidence is still too thin on root causes and remediation quality to conclude that Druva’s SRE and customer-communication practices are comfortably ahead of risk.
  claimRefs:
  - CR017
  - CR018
  - CR019
  - CR044
- calloutType: risk
  title: Valuation opacity is real against a changing peer set
  body: Druva’s last widely cited public mark is still the 2021 round at more than $2 billion, while the 2025-2026 peer context now includes a publicly traded Rubrik and CNBC reporting of Cohesity targeting Rubrik-like valuation. Entry price therefore cannot be inferred safely from old marks.
  claimRefs:
  - CR031
  - CR032
  - CR045
- calloutType: insight
  title: Compliance features and certifications are genuine mitigants
  body: 'Druva is not starting from zero: public materials show legal-hold functionality, governance workflows, and certification claims spanning SOC 2, HIPAA, FIPS 140-2, and a GovCloud/FedRAMP-oriented offer. The question is execution depth, not feature absence.'
  claimRefs:
  - CR010
  - CR011
  - CR012
  - CR014
