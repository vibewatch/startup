company:
  name: Druva
chapter:
  number: 7
  title: Risks
  summary: 'Druva''s risk profile is defined less by product absence than by concentration and opacity: the platform is deeply tied to AWS infrastructure and marketplace routes, yet public evidence on current margin structure, customer mix, and incident quality is thin. Independent review and status-monitor evidence adds operational friction—pricing opacity, reporting limits, performance complaints, and tracked outage history—while public peers such as Rubrik and Commvault disclose more through formal filing channels. Certifications, GovCloud packaging, and strong compliance features mitigate some of that exposure, but residual risk remains high until diligence closes the gaps on AWS economics, government-pipeline dependence, and current operating metrics.'
sections:
- id: regulatory-privacy-and-market-access
  title: Regulatory, Privacy, and Government-Market Risks
  body: Druva sells into workloads where backup data often contains regulated customer information, audit records, and litigation-relevant content, so the company is exposed to a heavier legal-and-compliance burden than a simple storage utility. Public materials say Druva acts as a data controller for its own business purposes and as a data processor for customer data, which means buyers still need confidence in subprocessors, transfer controls, and evidence handling. The company also actively markets eDiscovery, legal hold, and forensically sound search features, raising the bar for defensible preservation and auditability because a failure here is not just downtime—it can become discovery, privacy, or governance exposure for customers. Government and regulated-sector access is another gating issue. Druva's GovCloud marketplace listing references FedRAMP-oriented compliance claims, while FedRAMP itself positions certification and marketplace visibility as procurement prerequisites. That
    is a real mitigant, but it also makes continued certification clarity, data-residency fit, and contract mechanics material investment questions rather than back-office details.
  claimRefs:
