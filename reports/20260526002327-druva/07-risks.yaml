- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Why it matters
  - Action implication
  rows:
  - - AWS concentration
    - Material AWS price, architecture, or availability shock
    - Meaningful storage-cost reset or Sev1 outage that visibly disrupts Druva recovery commitments
    - Would pressure both unit economics and product credibility at the same time
    - Pause or reprice until AWS dependency economics are evidenced
  - - Public-sector access
    - GovCloud / certification narrative weakens
    - Loss of clear FedRAMP-backed positioning or inability to produce authorization detail
    - Would call into question regulated-buyer expansion assumptions
    - Treat as thesis break for public-sector upside
  - - Product friction
    - Review and support signals worsen
    - Two consecutive quarters of worsening public complaints on pricing, reporting, or restore performance
    - Suggests operating issues are reaching market reputation faster than roadmap repair
    - Shift from growth-underwrite to churn-defense case
  - - Valuation opacity
    - Current mark disappoints versus historical and peer context
    - Flat/down round, weak 409A, or secondary clearing well below expected step-up
    - Would confirm stale-public-mark risk and compress return potential
    - Re-anchor entry price or defer investment
  - - Leadership concentration
    - Key executive departure without clear succession
    - Founder CEO or co-founder technical leader exits or reduces role abruptly
    - Execution and customer trust could wobble while disclosure is already thin
    - Require board-level succession plan before proceeding
  - - Incident discipline
    - Incident communication lacks depth
    - Repeated outages without published RCA quality, remediation evidence, or stable MTTR
    - Would show resilience claims are stronger than operating controls
    - Escalate to avoid / research-more if not remediated quickly
  notes: Kill criteria are intentionally measurable. They convert residual risk into clear decision rules for diligence and post-investment monitoring.
