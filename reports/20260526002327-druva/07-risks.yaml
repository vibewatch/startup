  evidenceGaps:
  - type: missing-source
    severity: material
    topic: incident-root-cause-history
    missingEvidence: Official incident postmortems with timestamps, root causes, MTTR, and prevention actions for Druva service disruptions.
    whyItMatters: Independent monitors show that incidents are tracked publicly, but they do not provide enough depth to judge whether operating discipline is improving or eroding.
    diligencePath: Request a 24-month incident log with severity, customer impact, RCA summaries, and remediation completion dates.
    relatedQuestionRefs:
    - QR012
    relatedTableRefs:
    - TR002
  - type: private-evidence-only
    severity: material
    topic: team-scale-and-operating-maturity
    missingEvidence: Current headcount, attrition, support staffing, and module-level operating metrics.
    whyItMatters: Public materials show leadership and brand scale, but not the operating detail needed to underwrite execution capacity across Druva's broad product surface.
    diligencePath: Request current org chart, headcount by function, attrition trends, and support / R&D staffing ratios.
    relatedQuestionRefs:
    - QR026
    relatedTableRefs:
    - TR004
  - type: private-evidence-only
    severity: material
    topic: aws-cost-concentration
    missingEvidence: Current AWS spend share, storage-efficiency assumptions, reserved-commit profile, and gross margin by product or workload.
    whyItMatters: AWS concentration is a central risk, but public evidence does not quantify how hyperscaler pricing or usage growth flows through to Druva's margins.
    diligencePath: Request cloud-vendor concentration schedules, unit-economics bridge, and gross margin by major workload.
    relatedQuestionRefs:
    - QR027
    relatedTableRefs:
    - TR003
  - type: private-evidence-only
    severity: material
    topic: regulated-buyer-revenue-mix
    missingEvidence: Revenue, ARR, and customer concentration by government, regulated industry, and commercial segment.
    whyItMatters: Without segment concentration data, it is impossible to judge how much certification-heavy procurement or compliance burden matters to topline durability.
    diligencePath: Request ARR and pipeline by industry, geography, public-sector exposure, and route to market.
    relatedQuestionRefs:
    - QR028
    relatedTableRefs:
    - TR003
  - type: private-evidence-only
    severity: material
    topic: fedramp-authorization-detail
    missingEvidence: The exact current authorization package, certification class, and authorizing agency behind Druva's government offer.
    whyItMatters: Public marketing references FedRAMP-oriented positioning, but investors need the underlying package to judge durability and scope of government access.
    diligencePath: Request the current ATO or certification materials, sponsoring agency details, and any renewal or scope-change history.
    relatedQuestionRefs:
    - QR029
    relatedTableRefs:
    - TR001
  - type: stale
    severity: material
    topic: current-valuation-and-cap-table
    missingEvidence: Post-2021 financing history, secondary marks, current preference stack, and 409A support.
    whyItMatters: The 2021 >$2B mark is historical and cannot safely anchor a new investment decision against a 2025-2026 peer set.
    diligencePath: Request the latest cap table, current share classes, recent secondary transactions, and the newest board-approved valuation materials.
    relatedQuestionRefs:
    - QR022
    - QR023
    relatedTableRefs:
    - TR004
