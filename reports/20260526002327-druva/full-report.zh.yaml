  - id: TE002
    title: 工作流 / 使用场景表
    columns:
      - 用户任务
      - 当前工作流痛点
      - Druva 方案
      - 可量化收益 / 证据
      - 主要限制
    rows:
      - - 保护 SaaS 协作数据
        - Microsoft 365 等 SaaS 工具让备份和恢复需求碎片化
        - Druva 用一个 SaaS 平台保护 Microsoft 365、Salesforce、Google Workspace 和 Power BI
        - 官方工作负载页面显示其覆盖多个主要 SaaS 套件
        - 公开来源未提供按工作负载拆分的恢复吞吐基准
      - - 勒索软件攻击后恢复干净文件
        - 备份数据可能包含已感染或近期变更的文件
        - 精选快照和不可变保护用于恢复到最后一个干净状态
        - Druva 明确把精选快照、加密、访问控制和不可变性作为勒索软件恢复控制来宣传
        - 公开材料没有量化检测精度或误报率
      - - 加快取证或合规调查
        - 团队要花数天手工关联日志、备份元数据和审计证据
        - Deep Analysis Agents 和 Agentic Workflows 自动化长时间调查与报告产出
        - 独立和官方来源一致称，调查时间从两三天降至大约八到十分钟
        - 公开页面没有清楚标注哪些智能体功能已完全正式可用，哪些仍属新兴功能
      - - 把备份和响应动作接入 SOC
        - 备份工具往往不在安全团队使用的响应工作流里
        - Splunk 集成加入隔离、恢复、远程擦除等双向 API 动作
        - Splunkbase 记录了从 Druva Cloud Platform 发起的自动化响应动作和恢复启动
        - 价值取决于客户是否已经运行 Splunk 及相关响应工作流
      - - 满足公共部门和受监管环境要求
        - 机构需要有合规背书的保护，同时不想管理基础设施
