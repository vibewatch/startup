  - id: TV001
    title: 建议摘要表
    columns:
      - 维度
      - 当前判断
      - 证据基础
      - 决策含义
    rows:
      - - 建议
        - 观察
        - 真实规模和市场顺风都存在，但 2026 年价格发现很薄，披露也不完整。
        - 没有数据室前，不要把项目从观察名单推进到主动承销。
      - - 置信度
        - 低
        - 上一次披露的新股融资在 2021 年，当前私有市场指标稀疏且彼此冲突。
        - 指标刷新前，所有估值工作只能作方向性参考。
      - - 风险评级
        - 高
        - 私有市场流动性不足、产品摩擦信号，以及安全 / 运营尽调事项共同制造下行风险。
        - 投入资本前，要求下行保护和信息权。
      - - 估值判断
        - 低于 $1B 附近算合理；接近 >$2B 则偏高
        - Yahoo / Forge 指向带折价的当前估值，而 2021 年最后一轮估值已经过时。
        - 没有刷新后的基本面，不要锚定旧的最后一轮估值。
      - - 入场纪律
        - 基于验证后当前 ARR 的 $0.8B-$1.3B，或约 4x-6x ARR
        - 相比溢价后期叙事，该区间更贴近折价公开可比公司的测算。
        - 披露质量改善前，避免支付 Veeam 或 Rubrik 式溢价。
      - - 上调触发条件
        - 验证后 ARR >$250M，且留存、利润率和股权结构表都强
        - 乐观情景需要质量证据，而不只是品类增长。
        - 只有尽调把方向性故事转成可投资案例后，才上调。
    notes: 这份摘要明确对价格敏感：Druva 的业务质量和当前估值证据质量不是一回事，后者明显更弱。
    claimRefs:
      - CV006
      - CV010
      - CV011
      - CV051
      - CV054
      - CV056
      - CV060
      - CV061
  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 维度
      - 投资逻辑
      - 反向逻辑
      - 什么会改变判断
    rows:
      - - 品类
        - DPaaS 和备份恢复型 DRaaS 仍在以高十位数到低二十位数 CAGR 增长。
        - 仅靠市场增长，无法保证 Druva 配得上私有市场溢价倍数。
        - 证明 Druva 在抢份额，而不是只搭着品类需求上行。
      - - 架构
        - Druva 仍是市场上云原生 SaaS 数据保护架构更干净的玩家之一。
        - 云原生架构只有转化为留存、利润率和运营质量，才有价值。
        - 披露毛利率、净留存和大客户扩张数据。
      - - 规模证明
        - '> $200M ARR 和 >5,000 家客户（截至 2023 年 8 月）证明已有真实规模，不是早期实验。'
        - 公开披露停在 2023 年，无法证明 2026 年的 Druva 长什么样。
        - 提供 2024-2026 年 ARR 桥接和队列增长数据。
      - - 用户体验
        - 独立评测者认可不可变性、集中管理和快速恢复。
        - 独立评测者也指出定价不透明、报表受限，以及 UI / 恢复摩擦。
        - 证明产品驱动留存和支持指标在持续改善。
      - - 安全态势
        - UpGuard 把 Druva 视为持续监控的安全供应商。
        - OpenCVE 和宕机监控显示，客户端加固和运营韧性仍需尽调。
        - 分享事故响应、补丁节奏和根因记录。
      - - 估值信号
        - 如果 Druva 维持住已披露的 ARR 底线，当前低于 $1B 且带折价的估值，可以用公开可比公司解释。
