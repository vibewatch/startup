            body: >
              作为一家私有基础设施软件公司，Druva 的信任证据异常具体。其信任中心列明了治理、风险和合规责任，也列明事件响应、漏洞管理、SIEM、应用安全、CI/CD 安全审查、威胁建模以及 SAST/DAST。同一页面称
              Druva 已维持 SOC 2 认证和 FedRAMP 授权超过五年。FedRAMP Marketplace 列表进一步交叉印证，显示 Druva Data Resiliency Cloud 为 Moderate
              等级的 FedRAMP Certified；Carahsoft 2025 年说明也称 Druva 把 FedRAMP Moderate 覆盖扩展到 GovCloud 中的数据中心工作负载。AI 侧，Druva 的
              Business Wire 发布语言称，客户数据会被加密，不用于训练大语言模型，并通过隔离 LLM 加私有 RAG
              处理。因此，信任故事可信；但公开证据在项目控制和认证上更强，在租户隔离或存储架构内部披露上仍较弱。
