            body: >-
              资本充足性只能看见轮廓。最后一次清晰披露的新股融资事件是 Druva 2021 年 4 月 $147M 轮次，估值高于 $2B；管理层称这笔资金将用于创新、规模化和销售通路扩张。Tracxn 仍显示累计融资约
              $475M，Yahoo Finance/Forge 仍把最近一次新股融资日期列为 2021 年 4 月 19 日。缺失的正是 2026 年承销方最需要的信息：手头现金、月度烧钱速度、债务、现金跑道，以及 2021
              年后的任何资本规划。唯一新鲜市场信号来自老股交易，而且噪声很大。Yahoo/Forge 显示，截至 2026 年 5 月 22 日，估计估值为 $772.68M，远低于 2021
              年新股估值。这并不能证明下轮融资会下调，但确实指向未解决的估值压缩风险或模型噪声，而管理层尚未公开调和。合在一起，业务可能资金充足，但开源尽调无法区分「资本很宽裕」和「资本效率不错、但正接近新的融资决策」。
