      - number: '8.2'
        title: 估值锚点重置与当前市场证据
        blocks:
          - type: paragraph
            body: >-
              Druva 的 2021 年融资仍有意义，因为它证明公司曾获得高质量机构投资人认可，并以 >$2 billion 估值完成机构轮融资；但对 2026 年承销判断来说，锚点已经过时。该轮融资把披露融资总额推到大约
              $475 million，发生在公司 2023 年 ARR 里程碑公开之前。此后 Druva 披露了有意义的规模——ARR 超过 $200 million、客户超过 5,000 家、年备份超过 6 billion
              次——但没有发布当前 ARR、NRR、毛利率或烧钱数据，投资人无法把今天的业务映射到干净倍数。信息真空让 2026 年二级市场指标变得重要，即便它们并不完美。Forge 显示市场活动有限，Yahoo
              Finance 发布低于 $1 billion 的估算估值；Notice 则给出更高的挂牌股价，但缺少足够背景。实际含义是，今天判断 Druva
              要靠折价二级市场证据加已披露的经营底线，而不能只靠五年前的后期融资轮。
