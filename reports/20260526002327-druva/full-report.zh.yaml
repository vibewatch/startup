      - number: '2.2'
        title: TAM、SAM 与受证据约束的规模测算视角
        blocks:
          - type: paragraph
            body: >-
              2026 年最可辩护的公开视角是纯云备份。Mordor Intelligence 把该市场规模定为 $7.13B，Research and Markets 则把同年规模放在
              $9.41B。纳入托管备份服务后，会出现更宽的交付视角：Mordor 估计 2026 年备份即服务规模为 $10.9B，明显大于纯云备份区间，也更能反映 Druva 经常借 MSP
              和联盟渠道触达客户的方式。正确结论不是某一家发布方正确、其他发布方错误；而是 Druva 的机会会随品类范围明显变化。


              公开来源仍没有给出干净的 Druva 专属 SAM 或 SOM。Druva 披露了有规模的运营证据——关于页面上的数千家全球企业，以及较晚新闻稿中超过 1,100 万次每日备份——但这不是收入，也没有把装机基础按
              SaaS 应用、终端、云工作负载、MSP 渠道或企业直销拆分。因此，规模测算表和区间图保留了相互矛盾的估计，而不是把它们压成一个泛化的 TAM 数字。
