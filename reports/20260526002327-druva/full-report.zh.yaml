      - number: '7.4'
        title: 领导层、资本与披露风险
        blocks:
          - type: paragraph
            body: >-
              公开证据里最难定价的风险，不是 Druva 有没有市场，而是它还有多少当前执行空间。Rubrik、Commvault 等公开同业有正式 SEC 文件渠道，Druva 仍是私人公司，最后一次广泛公开的估值标记仍是
              2021 年融资轮，当时估值超过 $2 billion。历史标记如今要放到完全不同的 2025-2026 年同业背景下比较，其中 CNBC 报道 Cohesity 正寻求接近上市公司 Rubrik
              的估值。私人公司不透明很重要，因为投资人无法从公开文件看到当前毛利率、AWS 成本集中度、公共部门敞口或续约质量。领导层集中度也值得关注：Druva 公司页面仍突出创始人兼 CEO Jaspreet
              Singh，以及担任首席开发官的联合创始人，说明技术方向和市场信誉仍与创始团队紧密绑定。创始人持续掌舵可以是优势；但在披露本就有限、产品范围又持续扩到云、SaaS、端点、治理和恢复工作流时，它也会变成关键人风险。
