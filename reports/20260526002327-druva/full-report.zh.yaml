chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、起源与平台定位
        blocks:
          - type: paragraph
            body: >-
              Druva 仍应被理解为一家由创始人搭建的私有云数据保护公司，后来扩展到网络韧性；它不是给云功能打补丁的传统备份厂商。审阅来源一致显示，公司成立于 2008 年，创始根基在印度 Pune，目前总部位于
              California 的 Santa Clara。Sacra 和 TechTarget 都把 Jaspreet Singh、Milind Borate、Ramani Kothandaraman
              列为创始团队，Sacra 还补充了创始人与市场匹配的一点：三人都来自 Veritas。这个组合很重要，因为 Druva 现在的叙事仍靠「第一天就是云原生」撑着，而不是硬件或设备遗产。


              因此，后续章节应把 Druva Data Security Cloud 作为规范产品身份：一个全托管 SaaS 平台，横跨云工作负载、SaaS
              应用、终端，现在还包括身份恢复。官方、合作伙伴和面向市场的材料反复强调隔离和不可变保护、集中恢复，以及无需管理硬件。AWS 把 Druva 定位为构建在 AWS 上的 100% SaaS 服务，覆盖 AWS
              工作负载，也覆盖 Microsoft 365、Salesforce、Google Workspace 等主要 SaaS 资产。Microsoft 的采用页面显示，Microsoft 侧也通过 Microsoft
              365 Backup Express 扩展到 Exchange、SharePoint、OneDrive 和 Entra ID。2026 年，Druva 又通过 Power BI 备份和面向 Okta、Active
              Directory、Entra ID 的 Identity Resilience，把保护进一步推入业务应用和身份系统。产品宽度解释了为什么公司现在先讲数据安全和网络韧性，备份退到第二层。
