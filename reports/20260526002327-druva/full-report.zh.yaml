        title: 同行基准、披露缺口与财务结论
        blocks:
          - type: paragraph
            body: >-
              从财务角度框定 Druva，最可靠的方法是对比销售相近网络韧性和备份平台的上市同行。Rubrik 的 S-1 和当前业绩发布直接披露 ARR、收入、留存、毛利率和自由现金流。Commvault 的年度报告和
              2026 财年业绩也披露明确的收入、ARR、毛利率、现金和自由现金流。这些同行并不是 Druva 的完美经济替代品，但它们为尽调质量设定了清晰的上市公司门槛。对照这条门槛，Druva
              的公开记录在经常性模式质量和规模上方向积极，但承销可用性较弱。公司有可信的产品宽度、企业客户证据和数亿美元低位的收入估计，却没有经审计财务、公开利润率桥、现金流披露或实际成交价瀑布。财务结论因此是：商业模式上建设性，承销上谨慎。Druva
              看起来是一项真实的经常性 SaaS 业务，但投资人仍需要经审计财务、留存数据、实际定价和资本基础可见度，才能给出有信心的估值。
