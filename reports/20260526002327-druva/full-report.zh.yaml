      - number: '2.5'
        title: 保留的矛盾与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              公开证据足以证明 Druva 处在一个有意义且增长中的市场，但还不足以隔离出干净的 Druva 专属 SAM 或 SOM。2026 年核心云备份估计已经从 $7.13B 到 $9.41B 不等；邻近 BaaS
              估计为 $10.9B，更大是因为纳入了更多服务交付层。Druva 自己的页面又把边界扩到 Microsoft 365、Google Workspace、终端、EC2、Azure、Dynamics 365 和
              Entra ID。这些都与估值有关，但并不是一个经过标准化的支出池。


              更重要的未解项是内部组合和货币化。公开来源没有披露 Druva 收入中有多少来自 MSP、多少来自企业直销，也没有披露备份量如何按工作负载拆分，或对比原生云替代品时应使用什么同口径 ASP。SelectHub
              发布了一份公开价格对比，但计量单位不同，不足以可靠倒推 SOM。因此，本章保留相互矛盾的市场视角，并把明确尽调问题带到后续，而不是假装公开记录比实际更精确。
