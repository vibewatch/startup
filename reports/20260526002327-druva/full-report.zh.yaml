      - number: '1.2'
        title: 创始人、领导层厚度与治理信号
        blocks:
          - type: paragraph
            body: >-
              许多后期基础设施创业公司会从创始人转向职业经理人，Druva 没有走这条典型路径。Jaspreet Singh 仍是创始人兼 CEO，Milind Borate
              仍以联合创始人身份承担产品领导角色，外部利益相关方看到的仍是一家创始人色彩很强的公司。这种连续性有战略价值，因为它强化了 Druva
              围绕云原生数据保护重构架构、而不是改造存量装机基础的叙事。同时，公司也在补运营层厚度。当前领导层材料突出 CRO John Hultman，他曾在 Cohesity 和 Dell EMC 任职；CFO
              Jagroop Bal 于 2025 年 2 月加入，带来 VMware 规模的财务经验，以及 HPE、Deloitte、Accenture 经验。


              治理不只是一条创始人故事。Druva 的董事会披露显示 Mike Gustafson 担任董事长兼独立董事；同一组公开材料也显示 Nexus Venture Partners、Sequoia
              India、Riverwood Capital 等投资方参与董事会。这个组合说明治理模式里赞助方影响力真实存在，而不是纯粹由创始人控制。不过，适度关键人物依赖仍应标出，因为公开叙事仍高度集中在 Jaspreet
              和少数有姓名的高管身上。投资人应把这一点视为可管理但重要：领导层不止一个人，但公司的外部身份、融资故事和产品愿景仍围绕创始人 CEO 运转。
