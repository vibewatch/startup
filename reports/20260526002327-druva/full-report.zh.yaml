      - number: '1.4'
        title: 里程碑、生态扩张与开放风险
        blocks:
          - type: paragraph
            body: >-
              里程碑记录显示，公司不断从终端备份向更宽的韧性控制平面外扩。早期轨迹从 2008 年成立开始，到 2013 年转向云原生 SaaS，再到 2018 年收购 CloudRanger、2020 年收购
              SfApex，加深 AWS 和 Salesforce 关联度。2021 年融资给 Druva 带来新资本，正好赶上云采用加速；2023 年 ARR
              里程碑确认业务已经形成实质规模。更新的里程碑更多是战略性，而非单纯财务性：2025 年 2 月聘任 CFO、2025 年 3 月与 Microsoft 建立关系并集成 Azure、2026 年 3 月推出
              Identity Resilience、2026 年 5 月集成 Dell PowerProtect/Data Domain，都说明公司正努力贴近安全运营和企业恢复工作流，而不是停留在独立备份。


              开放风险更微妙。审阅来源没有发现针对 Druva 且被充分交叉验证的公开诉讼或正式监管行动，这是正面信号。浮现出的反向证据较弱，但仍值得记录：Blind 有 Druva 裁员讨论串，并显示 3.6/5
              的公司快照，足以提示员工情绪风险，但不足以推断发生过大范围重组。再叠加股权结构表、收入和员工数问题未解，主要尽调诉求不是生存风险，而是披露质量。Druva
              看起来是一家有规模、具战略相关性的私营公司；剩下的问题是，2023-2026 年经营故事里有多少能从公司叙事转化为独立验证数字。
