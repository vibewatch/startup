      - number: '8.4'
        title: 情景区间与回报逻辑
        blocks:
          - type: paragraph
            body: >-
              由于 Druva 当前 ARR 和股权结构未披露，情景分析应被视为有纪律的区间设定，而不是虚假的点估值。悲观情景约为 $0.6 billion 至 $0.9 billion，假设 Druva 的 ARR
              没有大幅高于 2023 年 >$200 million 的底线，用户摩擦拖慢扩张，二级市场买方采用 N-able 或折价 Commvault 式倍数。基准情景约为 $0.8 billion 至 $1.3
              billion，假设 Druva 至少守住或温和超过 2023 年 ARR 底线，并配得上与折价公开可比公司组合一致的 4x-6x 区间。乐观情景约为 $1.5 billion 至 $2.2
              billion，需要证明 Druva 已经显著高于 $200 million ARR，留存和利润率质量强，并且即使仍是私人公司、交易也较稀薄，仍能拿到类似 Veeam 或接近 Rubrik
              的倍数。情景跨度很宽，因为今天的估值支撑更多受缺失分母驱动，而不是产品投资逻辑已经破裂。
            claimRefs:
              - CV023
              - CV024
              - CV047
              - CV048
