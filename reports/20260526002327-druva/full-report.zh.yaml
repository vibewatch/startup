  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 总体建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              判断 Druva 的正确起点，不是抽象地评估公司质量，而是 2026 年可见价格信号是否足以承销。公开证据说明业务是真实的：Druva 有云原生平台，2023 年 8 月 ARR 已跨过 $200
              million，并继续把自己定位成规模化数据韧性厂商。但估值证据明显弱于经营证据。最后一次披露的新股融资仍是 2021 年 4 月估值高于 $2 billion 的 Series H；Yahoo Finance
              现在给出来自 Forge 的估算估值，为 $772.68 million，Forge 自身也把市场活动标为有限。Notice
              显示的挂牌价更高，使当前二级市场图景在方向上有用，却还不够干净，难以下结论。组合起来，结论应是观察。在折价、低于 $1 billion 的入场价格下，Druva 相对公开可比公司大致说得通。如果价格接近过时的
              >$2 billion 上轮锚点，公开证据不足以支撑在没有更新 ARR、留存、利润率和股权结构披露的情况下支付高增长溢价倍数。
