      - number: '7.3'
        title: 商业、渠道与依赖风险
        blocks:
          - type: paragraph
            body: >-
              从商业上看，Druva 同时背着几层依赖。AWS 不只是基础设施供应商，还是市场平台路径、政府产品打包渠道、生态背书者，也是 Druva 差异化叙事的一部分。英国 Digital Marketplace
              列表进一步说明，服务只把备份数据保存在 AWS
              云中，凸显交付、成本和采购风险很难从单一超大规模云厂商关系中拆开。评论证据又给出另一层商业警讯：买方反复提到定价不透明、许可复杂、报告能力受限，以及偶发性能问题。定价与体验问题很关键，因为备份平台通常卖的就是简单和可预测。公开对比页还显示，按评论心智和推荐率看，Druva
              落后于 Rubrik；Veeam 则围绕韧性、治理、隐私和云存储营销更宽的平台覆盖。单看任何一个公开信号都不足以推翻投资逻辑，但合在一起说明，Druva 所处市场里，产品宽度和商业清晰度都越来越接近入场门槛。
