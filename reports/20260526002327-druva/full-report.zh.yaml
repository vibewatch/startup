      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >-
              Druva 所在品类的需求驱动因素很具体。Mordor 明确把云备份增长与网络勒索、SaaS 扩散、更严格的数据韧性规则绑定。CISA 的 #StopRansomware
              指南要求机构保留离线加密备份，并定期测试可用性和完整性，这让备份从低优先级卫生项变成实际网络事件中必须可用的控制。IBM 2025 年数据泄露报告补上预算后果：全球平均泄露成本仍为
              $4.4M，业务中断仍很普遍。即便软件预算更紧，这些因素也支撑对恢复准备度的持续支出。


              约束同样真实。AWS、Azure 和 Google 原生工具吸收了部分基础设施备份工作，尤其在买家接受单云范围时。第三方评论来源也浮现出 Druva
              自身不小的摩擦：大规模恢复性能、价格敏感度、互联网依赖、迁移复杂度和工作流清晰度。合在一起，证据说明 Druva 的采用有强劲长期顺风支撑，但也受替代产品和实施摩擦限制；这些限制在更简单或成本敏感的环境里最明显。
