              Druva 的公开耐久性证据足以给出方向性正面判断，但不足以替代真实留存披露。最新的第三方风格信号来自 Druva 2025 年 Gartner Peer Insights 落地页：Backup as a
              Service 得分 4.8/5，98% 愿意推荐；enterprise backup 得分 4.9/5、129 条评论、97% 愿意推荐。G2 增加了 729 条独立评论量，TrustRadius 和
              SoftwareReviews 也强化了用户看重灵活性、管理简单性和细粒度恢复这一点。Druva 自有支持页面和 Gartner
              引用的客户评论也支持一个判断：公司的支持组织是真实卖点。谨慎点在于，评论表面只是代理，不是续约数学。它们说明客户喜欢平台和支持，但不披露 NRR、GRR、流失率或合同期限。反向评论也存在：G2
              称较大或更复杂的恢复可能更慢且不够直观；历史 Capterra 评论抱怨 GUI 可见度、备份开销和慢恢复体验。合并来看，公开留存证据有利但不完整。
