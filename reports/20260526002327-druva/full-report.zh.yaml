      - number: '8.5'
        title: 退出成熟度、投资逻辑破裂点与最终尽调
        blocks:
          - type: paragraph
            body: >-
              Druva 并没有明显坏掉，但也还不是一个容易承销的退出就绪资产。公开记录读起来更像 pre-IPO 期权价值，而不是由监管文件支撑的上市流程：TechCrunch 在 2021 年报道过 IPO
              讨论，Forge 仍保留 pre-IPO 页面，Yahoo 也仍把公司作为私人市场证券呈现；但本次研究没有找到已提交的 S-1，也没有看到活跃交易窗口的证据。尽调负担因此转向基本面和结构。如果经验证的当前 ARR
              远低于支撑折价 4x-6x 区间所需的水平，如果股权结构瀑布显著压低新资金位置，或者运营与产品摩擦信号演变成留存压力，投资逻辑就会破裂。上调路径同样具体：披露当前 ARR、NRR
              和利润率；给出干净股权结构表；把冲突的二级市场价格与真实成交对齐；并展示可信的退出规划。在 ARR、股权结构、二级成交和退出规划清晰之前，投资委员会更合适的动作是继续观察资产，而不是强行建立信念。
