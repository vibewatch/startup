      - number: '3.3'
        title: 分销力量、切换成本与多平台并用逻辑
        blocks:
          - type: paragraph
            body: >-
              触达市场是这个品类没有退化成纯功能比拼的核心原因。Druva 有可信的生态证据：其联盟计划强调与领先技术提供商集成；2026 年合作伙伴奖项覆盖公共部门、MSP、Dell、AWS 和区域类别；Microsoft
              与 AWS 集成让它能把自己定位为超大规模云存储和恢复原语上的覆盖层，而不是一套断开的堆栈。这在战略上有用，因为它降低了超大规模云厂商直接取代 Druva 的风险。


              即便如此，审阅过的同行表面显示，Rubrik、Commvault 和 Veeam 公开披露的经销商、MSP、服务交付或分销商分类比 Druva
              以联盟为中心的公开合作伙伴故事更宽。原生云产品带来第二个分销挑战，因为采购已经嵌入既有账户：AWS Backup 搭载 AWS 账户，Azure Backup 搭载 Azure，Microsoft 365
              Backup 则以公开 $0.15/GB/month 价格点进入管理中心。切换成本因此存在但不均匀。一旦客户把恢复工作流、身份保护和合规运营集中到 Druva
              控制台及合作伙伴存储集成里，重新培训和迁移就是实实在在的摩擦。但买家仍可多平台并用：窄工作负载用原生工具，其他地方保留更宽的网络恢复平台。
