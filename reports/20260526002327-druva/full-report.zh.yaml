        title: 直接同行画像、能力宽度与定价可见度
        blocks:
          - type: paragraph
            body: >-
              直接同行集合可以按运营模式清晰拆开。Druva 自有材料和合作伙伴页面强调全托管 SaaS 控制平面，配套不可变恢复、编排和云原生集成。Rubrik
              叙事同样偏云，但增加了更强的公开安全和身份框架，以及庞大且明确的合作伙伴生态。Commvault
              是以宽度驱动的对照样本：其包装页面展示三类恢复计划，并呈现明显更宽的混合企业范围，所以当买家看重部署灵活性时，它仍是整合威胁。Veeam 的 2026 年故事由路线图驱动，重心在更宽的 hypervisor
              可移植性和跨平台恢复，而不是纯 SaaS 简单性。Cohesity+Veritas 则把合并定位为新的第一大 AI 驱动数据安全平台，强化了大型企业项目中 Druva 面临的宽度压力。


              定价可见度也把竞争场切开。Druva 至少公开了套餐名称和基于消耗的模型；AWS Backup、Azure Backup、Microsoft 365 Backup
              则发布或计算了基于使用量的锚点，买家可以立即对标。相比之下，审阅过的 Rubrik、Commvault、Cohesity 和 Veeam
              公开页面仍把买家推向销售对话、演示或套餐解释，而不是同口径企业清单价卡。这种不透明意味着，原始功能对比只是故事的一部分；采购杠杆和折扣行为仍是重要竞争变量。
