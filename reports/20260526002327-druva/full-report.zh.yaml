  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、隐私与政府市场风险
        blocks:
          - type: paragraph
            body: >-
              Druva 面向的工作负载里，备份数据常常包含受监管的客户信息、审计记录和涉诉内容，因此公司承受的法律与合规负担重于简单存储工具。公开材料称，Druva
              为自身业务目的充当数据控制者，为客户数据充当数据处理者；买方仍需要相信其分处理方、传输控制和证据处理能力。公司也主动营销
              eDiscovery、法律保全和具备取证可靠性的搜索功能，可抗辩的数据保全与可审计性门槛随之抬高：这里一旦失手，不只是宕机，还会变成客户的取证、隐私或治理敞口。政府和受监管行业准入则是另一道门槛。Druva 的
              GovCloud 市场列表引用面向 FedRAMP 的合规主张，而 FedRAMP 本身把认证和市场可见度定位为采购前提。FedRAMP
              是真实缓释项，但也让认证延续是否清晰、数据驻留是否匹配、合同机制是否扎实，变成重要投资问题，而不是后台细节。
