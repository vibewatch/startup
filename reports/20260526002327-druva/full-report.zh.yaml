      - number: '1.3'
        title: 资本基础、估值基准与公开规模信号
        blocks:
          - type: paragraph
            body: >-
              Druva 的融资历史足够公开，可以支撑公司概况章节；但公开程度还不够，无法在没有管理层帮助的情况下给出当前估值锚点。最后一个干净的融资基准是 2021 年 4 月轮次：Druva 宣布由 CDPQ 领投
              $147M，Neuberger Berman 也大额参与；TechCrunch 和 The Economic Times 均报道称该轮估值超过 $2B。TechCrunch 还保留了此前路径：2019 年
              $130M 轮次估值约 $1B，并提到更早的 2016 和 2017 年融资。Sacra、ZoomInfo、Economic Times 和 Tracxn 都收敛到约 $475M 的已披露累计融资。


              经营规模披露更不均衡。Druva 2023 年 8 月 ARR 发布仍是公开记录中最干净的量化经营里程碑：SaaS ARR 超过 $200M，客户超过 5,000 家，MSP 客户同比增长 300%，每年备份超过
              60 亿次。到 2025 年 2-3 月，公司关联材料开始使用接近 7,500 家客户的数字，这个方向上看似合理，但仍是公司发布而非独立审计。收入和员工数更模糊。IncFact 给出的 $100-500M
              收入估计太宽，无法替代 2023 年 ARR 里程碑；员工数来源冲突明显：Unify 估计 2026 年 4 月为 976 人，Tracxn 报告 1,369 人，Crunchbase 仍只显示
              1001-5000 人区间。正确结论不是 Druva 没有规模，而是当前私营公司披露不足以在没有直接尽调的情况下精确给出 2026 年收入或员工 KPI。
