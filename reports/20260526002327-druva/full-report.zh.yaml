            body: >
              Druva 的架构证据在控制平面和集成层最强，而不是存储引擎层。开发者门户确认 Druva 暴露 REST API，使用 JSON payload 和标准 HTTP 语义；参考页面明确链接
              API、GitHub、marketplace 条目、支持和 sandbox 资源。公开 GitHub 仓库显示，原生工作负载、数据治理和 Splunk 集成上确实有实践者工具，但仓库更新节奏明显落后于 Druva
              2026 年 AI 发布速度。外部合作伙伴表面对运营很重要：AWS Marketplace 把 Druva 定位为构建在 AWS 上的 SaaS 备份与恢复；Microsoft marketplace 页面把
              Druva 连接到 Microsoft 365 Backup Storage；Splunkbase 记录了双向事件响应集成。这意味着运营模型不只依赖 Druva
              自己的代码，也依赖超大规模云基础设施、Microsoft 备份原语和合作伙伴工作流集成。公开证据支持可扩展性，但也意味着 Druva 直接控制之外存在有意义的依赖风险。
