        title: 买家、用户、付款方与销售通路分层
        blocks:
          - type: paragraph
            body: >-
              Druva 的买家地图随细分市场而变。企业直销中，买家通常是 IT、基础设施或安全团队，想要对 Microsoft 365、Google
              Workspace、终端和公有云工作负载做云端托管保护。托管服务路径中，中间买家是 MSP 本身：Druva 提供 Managed Services Console、MSP Academy、正式 MSP
              合作伙伴计划，甚至提供带交易登记的合作伙伴门户。这套架构意味着两步付款方模型：MSP 采购或打包平台，终端客户最终通过托管服务合同为其付费。


              联盟增加了另一条采用路径。Druva 的 Microsoft 和 AWS 联盟页面显示，公司不只是在对抗原生工具；它也试图借助这些生态，从一个 SaaS 平台保护 Microsoft
              365、Azure、Dynamics 365、Entra ID、Azure VM 和 Amazon EC2。结果是混合市场结构：同一产品可以直销、进入 MSP
              目录，也可以通过工作负载专属联盟动作销售。触达面因此更广，但也意味着没有单一预算负责人或采购路径能定义整个市场。
