  - id: TV005
    title: 投资逻辑破裂与否决触发表
    columns:
      - 触发因素
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 当前 ARR 验证达不到所需底线
        - 验证后的当前 ARR 没有显著超过 2023 年披露的 >$200M
        - 私有市场溢价倍数将很难自洽
        - 除非价格进一步重置，否则从观察下调至接近回避
      - - 股权结构表清算瀑布对投资者不友好
        - 优先权、债务或高级偿付权让新钱明显后置
        - 企业价值不再能清晰映射到股权回报
        - 清算瀑布模型跑通前，停止承销
      - - 老股成交仍薄且低于报价
        - 实际成交集中低于 Yahoo / Forge 式估算，或只出现在小额区块
        - 报价标价作为公允价值参考的可信度下降
        - 加深流动性折价，或暂不参与
      - - 产品摩擦反映到留存
        - 恢复、报表或定价投诉转化为流失或扩张停滞
        - Druva 失去高于成熟备份供应商估值的资格
        - 重置到悲观情景倍数区间
      - - 安全或韧性可信度受损
        - 出现实质安全事件、持续宕机模式，或薄弱事故记录
        - 核心恢复信任主张受损
        - 立即重切投资逻辑，并重启技术尽调
    notes: 这些是委员会层面的否决标准，绑定估值传导，而不只是产品话术。
    claimRefs:
      - CV052
      - CV055
      - CV057
      - CV058
      - CV059
      - CV061
      - CV062
  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 当前 ARR / NRR
        - 2024-2026 年最新 ARR、队列留存和新增 ARR 桥接
        - 没有刷新后的分母，就无法承销当前倍数
        - CFO 数据室请求和董事会材料审阅
      - - 利润率 / 烧钱 / 现金流
        - 毛利率、经营现金流、烧钱速度和现金跑道
        - 溢价倍数看收入质量，也看收入规模
        - 基于经审计管理账的财务尽调
      - - 股权结构表 / 优先权
        - 完全稀释股权结构表、清算优先权、债务和期权摊薄
        - 回报测算取决于股权结构，不只是企业价值
        - 法务尽调和更新后的清算瀑布模型
      - - 老股交易记录
        - 2026 年实际成交、股份类别、区块规模和新近程度
        - 报价彼此不一致，可能不能反映真实流动性
        - 经纪商 / 平台确认和转让登记簿审阅
      - - 产品留存证明
        - 按工作负载、客户规模和 MSP 动作拆分的扩张与流失
        - 评测网站上的摩擦必须和实际留存对齐
        - 客户队列分析和推荐客户访谈
      - - 运营韧性历史
        - 2024-2026 年事故日志、SLA 表现和根因分析
        - 恢复供应商只有在客户信任恢复和正常运行时间时，才配得上溢价
        - 支持运营审阅和客户推荐包
    notes: 这些要求是最低资料包；拿到之后，才能从方向性估值工作推进到可投资的股权回报判断。
    claimRefs:
      - CV052
      - CV057
      - CV059
      - CV060
      - CV061
      - CV062
