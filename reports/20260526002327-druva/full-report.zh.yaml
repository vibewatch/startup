  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与替代品
        blocks:
          - type: paragraph
            body: >-
              不应把 Druva 定义成单点终端备份厂商。审阅过的官方页面一致描述了一个云原生、全托管 SaaS 平台：它保护终端、Microsoft 365、Google Workspace
              和云工作负载；更新的公司语言也把品类从备份推向网络韧性和数据安全。因此，实际市场边界包括纯云备份、SaaS
              应用备份、云工作负载保护，以及与恢复、不可变性和跨云运营绑定的一部分邻近韧性支出。它不包括无关的存储硬件、通用云基础设施消耗，或企业堆栈里的每一种安全控制。


              最干净、边界明确的替代品集合是原生云备份。AWS Backup、Azure Backup、Google Cloud Backup and DR
              都覆盖了同一工作的有意义部分，尤其适合只需要云内工作负载保护的买家。买家想要一个 SaaS 控制平面横跨生产力套件、终端和云工作负载，或者想要由 MSP 交付、联盟支持的运营而不是特定基础设施工具时，Druva
              的相关性才会提升。这套边界逻辑很重要，因为一旦把服务交付、SaaS 应用保护或网络韧性邻近项纳入，每个 TAM 表述都会变大。
