companyProfile:
  summary: >-
    Druva 是一家 2008 年成立、源自印度的数据保护公司，创办于 Pune，目前总部位于 Santa Clara。公司仍由创始人 Jaspreet Singh 掌舵，并把 Data Security Cloud 定位成全托管
    SaaS 平台，覆盖备份、网络响应与恢复、电子取证 / 合规，以及邻近的身份韧性工作流。公开规模证据是真实的：Druva 2023 年 8 月披露 ARR 超过 $200M，后续公司材料称客户接近 7,500 家、其中包括 75 家
    Fortune 500，LATKA 则称 2024 年收入达到 $304.3M。最新且干净的新股融资锚点仍是 2021 年 4 月估值超过 $2B 的 H 轮，但 2026 年当前价格发现和经营披露明显更薄。
