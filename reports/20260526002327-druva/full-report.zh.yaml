            body: >-
              最好的公开牵引力标记是客户规模、历史融资、收入估计和买方侧合同基准，而不是已披露单位经济。此次审阅期间可获得的 Druva 官方材料称，公司受到接近 7,500 家客户和 75 家 Fortune 500
              信任；2021 年融资稿则称多产品采用率较上一年上升 50%，管理数据增长超过 40%。第三方追踪器再补上缺失的收入故事：Latka 报告 2024 年收入 $304.3M，高于 2023 年 $200M 和
              2019 年 $100M；Tracxn 报告截至 2026 年 4 月累计融资 $475M、员工 1,369 人。买方侧定价数据集是最接近销售效率代理的材料。Vendr 称合同通常为每年 $25,000 到
              $500,000+；Costbench 报告年度合同中位数为 $41.6k，平均折扣 13%；评论来源显示一线存在价格敏感度。这些数据点足以推断出面向企业、经谈判的销售动作，但不足以计算
              CAC、回本周期或净留存率（NRR）。
