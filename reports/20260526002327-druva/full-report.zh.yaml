      - number: '6.4'
        title: 跨工作负载和合作伙伴的扩张逻辑清楚，但集中度和渠道结构仍不透明
        blocks:
          - type: paragraph
            body: >-
              Druva 的公开客户拓展路径很像典型的「先落地、再扩张」，核心靠相邻工作负载不断外延。公开案例显示，客户往往先在 Microsoft 365、Google Workspace、Hyper-V、Azure、EC2
              或 VMware 等工作负载上落地，随后扩到相邻的恢复、身份、SaaS 备份或勒索软件韧性功能。Salesforce AppExchange 和合作伙伴材料也表明，Druva 正试图把钱包份额从最知名的
              Microsoft 与 AWS 备份场景继续拉宽。第二个扩张引擎是渠道。Druva 的 2026 年合作伙伴奖项、AWS Marketplace 曝光、CDW 联合销售材料，以及由合作伙伴主导的 Fred
              Perry 案例，都说明合作伙伴对获客和扩张有实质贡献。渠道触达是正面信号，但也带来尽调问题。Druva 没有披露多少 ARR 来自合作伙伴、头部合作伙伴有多集中，也没有说明近 7,500
              家客户中直营与渠道主导各占多少。公开客户集中度同样不透明：公司不披露头部客户
              ARR、合同金额或续约敞口，可见案例也高度筛选，偏向企业友好的成功故事。公开评论中，恢复复杂度和报告深度是主要摩擦点，可能拖慢复杂账户里的深度模块扩张。
