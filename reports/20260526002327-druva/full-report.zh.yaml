      - number: '8.6'
        title: 图表与证据
        blocks:
          - type: callout
            title: 价格比叙事更重要
            body: Druva 可以是一家好公司；但如果投资人锚定过时的 2021 年融资轮，而不是折价后的 2026 年证据，入场仍可能很差。
            calloutType: recommendation
