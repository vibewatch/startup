      - number: '7.2'
        title: 平台可用性与安全执行风险
        blocks:
          - type: paragraph
            body: >-
              Druva 的运营模式把技术执行风险压到一个承诺上：它要提供一个全托管、具备网络韧性的 SaaS 平台，比自建备份栈更简单、更安全。支撑这一主张的同一组证据，也会在执行滑坡时放大下行。Druva 自有材料和
              AWS 合作伙伴页面强调，其服务 100% 基于 AWS 的 SaaS，带有自动化灾难恢复、隔离备份和零信任定位。与此同时，独立监测方持续记录 Druva
              宕机历史，也提示投资人应更细查事故时间线；但公开来源没有给出足够完整的根因和修复细节，难以判断 SRE 成熟度。CISA 的勒索软件指南提醒市场：云备份与恢复系统已经是事件响应的一部分，不只是 IT
              卫生，备份失败会直接打到运营和声誉。在可用性之外，公开评论还反复提到报告、仪表盘、易用性和大规模备份性能的摩擦。上述客户反馈不能否定平台，但说明运营质量和客户体验需要用当前客户访谈检验，不能只接受营销叙事。
