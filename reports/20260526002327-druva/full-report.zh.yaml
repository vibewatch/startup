      - number: '4.3'
        title: 成本结构、毛利率路径与仍属私有的信息
        blocks:
          - type: paragraph
            body: >-
              Druva 的架构强烈指向软件式成本结构，但公司没有发布验证这一推断所需的数字。官方页面强调全托管 SaaS 交付模式、无需购买或维护备份硬件，并覆盖云、本地部署、终端和 SaaS
              应用。这意味着成本重心不像重设备的销售成本，更可能落在公有云基础设施、存储、保留、支持和恢复运营上。Vendr 和 SelectHub
              从定价侧强化了同一逻辑：管理数据量、保留时长和合同期限被列为主要成本驱动因素，因此毛利率应会随存储效率、工作负载组合和定价纪律明显变化。问题在于披露深度。审阅过的 Druva
              来源没有一家发布毛利率、自由现金流、递延收入、剩余履约义务、CAC、回本周期或 NRR。因此，投资人可以描述其可能的经济引擎，但还不能测试 Druva 的利润率路径更像成熟的高毛利备份 SaaS
              模型，还是更偏基础设施密集型服务。
