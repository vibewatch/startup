              Memory；据报道，调查时间从两三天降到约八到十分钟。Druva 还发布了 DruAI 采用指标，有助于把它和纯愿景式 AI
              幻灯片区分开。不过，成熟度并不均匀。评论页面赞赏不可变备份、集中管理和快速恢复，但也抱怨定价不透明、成本、权限和定制。GitHub
