  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式、定价架构与收入质量
        blocks:
          - type: paragraph
            body: >-
              Druva 的公开材料支持经常性 SaaS 收入模式，但不支持一张简单的公开价目表。官方页面描述的是一个全托管、云原生平台，采用基于消耗的定价，而不是硬件销售；定价页面则把产品组合拆成企业、生产力、身份、CRM
              和终端数据保护类别。这个框架很重要，因为它暗示了跨用户、终端、云资源和受保护数据量的多元工作负载组合，方向上符合高质量经常性收入。公开价格发现仍很碎片化。Vendr 称 Druva
              不发布标价，而是销售经谈判、按报价形成的合同；Costbench 和评论网站则发布观察到的入门点，例如 Phoenix Business 每资源每月 $7、Microsoft 365 每用户 $4、每终端设备
              $8。AWS Marketplace 评论补充说，定价可按用户、资源或 TB 计费，上面再叠加 Enterprise 和 Elite 层。净判断是，经常性货币化真实存在，但实际成交价、折扣梯度和收入组合仍未披露。
