              优先、全托管的服务，服务于备份、网络响应与恢复、电子取证和合规，以及跨云、本地部署、边缘、SaaS 和身份环境的治理。官方 marketplace 分类用
              AWS、Azure、虚拟化、数据库、非结构化数据、SaaS 应用和身份韧性等具名工作负载分组支撑了这份宽度。生产力工作负载页面进一步给出 Microsoft 365、Salesforce、Google
              Workspace 和 Power BI 的具体应用覆盖，同时强调 ransomware 之后的精选快照和干净文件恢复。从工作流看，Druva
              先从单一控制台销售集中保护，再在上面叠加调查、响应、合规和恢复动作。因此，核心产品信息是连贯的：一个 SaaS 控制平面覆盖多个数据表面；主要尽调提醒是，公开包装比公开底层架构更具体。
