            body: >-
              可比公司倍数区间很宽。高端一侧，Rubrik 交易在约 9.4x ARR，Veeam 2024 年 12 月二级交易隐含约 8.8x ARR。中段里，SentinelOne 约 5.7x
              ARR。成熟且低增长一侧，Commvault 约 3.9x ARR，N-able 约 1.3x ARR。CrowdStrike 远高于同业组，但其 30x 以上 ARR 倍数不能作为 Druva
              的公平参照，因为它反映的是更大、更宽、具有公开市场流动性的 AI 原生 安全平台。Druva 的投资逻辑是：品类增长强劲，云原生架构真实，公司在 2023 年已经披露了有意义的 ARR
              和客户证据。反向逻辑是：独立评论证据指向定价、报告和恢复体验中的摩擦，历史客户端 CVE 与第三方宕机监测也意味着执行负担仍然真实。换句话说，Druva
              有可能配得上中段倍数，但若没有新的披露，证据还不足以假设它能拿到 Veeam 或 Rubrik 质量的溢价。
