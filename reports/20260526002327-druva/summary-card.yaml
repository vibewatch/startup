  topStrengths:
    - >-
      Druva still presents one of the cleaner SaaS-native architectures in data protection, with air-gapped and
      immutable protection across cloud, on-premises, edge, and SaaS workloads.
    - >-
      Public scale is meaningful: Druva disclosed >$200M ARR in 2023, company materials cite nearly 7,500 customers
      including 75 of the Fortune 500, and LATKA points to $304.3M of 2024 revenue.
    - >-
      FedRAMP Moderate status, GovCloud expansion, and Microsoft/AWS ecosystem distribution give Druva more trust and
      route-to-market credibility than a generic backup vendor.
    - >-
      Public customer-sentiment signals are mostly strong, including 2025 Gartner Voice of the Customer metrics and a
      729-review G2 surface.
  topRisks:
    - >-
      Druva still does not publicly disclose audited revenue, current ARR/NRR, gross margin, cash, burn, debt, or the
      cap-table waterfall needed to underwrite equity value.
    - >-
      AWS is a concentrated dependency across infrastructure, storage location, marketplace distribution, and parts of
      Druva's economic model.
    - >-
      Public reviews surface pricing opacity, shallow reporting, and slower large-restore performance in some
      environments, which cuts against the simplicity narrative.
    - >-
      The 2021 >$2B primary mark is stale relative to a 2026 Yahoo/Forge estimate of $772.68M, making current fair value
      highly sensitive to missing diligence data.
  unresolvedGaps:
    - >-
      Verified 2024-2026 ARR and revenue bridge, including GRR/NRR and cohort expansion by workload, segment, and
      channel.
    - Gross margin, burn, cash, debt schedule, runway, and headcount by function.
    - Fully diluted cap table, liquidation preferences, recent 409A support, and actual 2026 secondary-clearing tape.
    - Direct-versus-partner/MSP revenue mix, top-customer concentration, and AWS economics exposure.
    - 2024-2026 incident history, SLA performance, and root-cause evidence for material service events.
