summary:
  headline: >-
    Druva is a real, scaled cloud-data-protection platform with confirmed historical unicorn status, but stale valuation
    anchors, thin 2026 disclosure, and AWS/secondary-market concentration keep it in track territory.
  overallScore: 5.8
  recommendation: track
