    {
      "id": "durability-expansion-and-customer-risk",
      "title": "Durability, expansion proxies, and customer-quality risks",
      "body": "Public evidence supports meaningful land-and-expand motion, but not enough to underwrite retention or concentration with confidence. Expansion shows up in several forms: Duolingo planned to add email after chat success; Rippling added AI email deflection and kept improving deflection after launch; ClassPass moved from limited chat hours to 24/7 chat, chat-plus-email coverage, and large-scale Agent Assist usage; Chime selected Decagon across both chat and voice; Hertz is already a proactive outbound reference; and Deutsche Telekom's pilot is explicitly tracking resolution time, CSAT/NPS, and recontacts as it iterates. Those are encouraging proxies for account expansion and operational durability. The missing pieces are just as important. No public source reviewed disclosed exact active customer count, NRR, GRR, churn, renewal rate, contract duration, or top-customer revenue concentration. That omission matters because most measurable outcomes come from Decagon-authored customer stories and funding posts, not independent customer procurement records or customer-authored case studies. The broader category also warrants caution: Gartner says half of companies that cut customer-service staff because of AI will rehire people by 2027, The Register cites research saying many AI customer-communications agents are rolled back after deployment, and Klarna's public retreat from AI-only service quality claims shows how quickly marquee examples can reverse. For Decagon, that means the customer chapter supports real adoption and multi-channel enterprise use, but not a clean conclusion that the entire portfolio is sticky, diversified, or immune to case-study selection bias.",
