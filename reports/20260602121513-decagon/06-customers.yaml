    "number": 6,
    "title": "Customers",
    "summary": "Decagon's public customer proof is real and unusually specific for a private AI-support vendor: the company now cites 100+ new enterprise customers in 2025, named production references across fintech, travel, software, education, marketplace, and telecom, and multi-channel outcomes at accounts such as Chime, Duolingo, Rippling, Notion, ClassPass, and Mercado Libre. The evidence still has clear limits: the strongest metrics come from company-curated case studies, Chime is the only major deployment independently corroborated in a primary filing, and public sources do not disclose exact active customer count, NRR/GRR, contract length, or concentration."
