- id: TP005
  title: Moat durability and competitive risk register
  columns:
  - Moat claim or risk area
  - Threat
  - Severity
  - Evidence
  - Mitigation / diligence ask
  rows:
  - - Workflow encoding via AOPs
    - Competitors and internal builders can access the same frontier models, reducing any model-layer edge
    - High
    - CAIO commoditization framework plus official peer tooling breadth
    - Test whether Decagon's encoded business logic improves resolution quality faster than peers in a live POC
  - - Integrated testing and supervision
    - Sierra, Salesforce, and Observe.AI now market testing, supervision, or evaluation features too
    - Medium
    - Decagon, Sierra, Salesforce, and Observe.AI product pages
    - Request side-by-side proof on regression testing, audit trails, and rollback workflows
  - - Incumbent distribution
    - Intercom, Zendesk, and Salesforce already own the helpdesk or CRM workflow and can cross-sell AI into installed bases
    - High
    - Official incumbent product pages plus Forbes competition framing
    - Review win-loss data segmented by incumbent displacement versus greenfield deployments
  - - Pricing opacity
    - Opaque enterprise pricing makes procurement harder against list-priced incumbents and low-cost substitutes
    - Medium
    - Sacra, eesel estimate, Intercom/Salesforce/AWS public pricing
    - Obtain sample pricing sheets, reference invoices, and multi-year TCO models
  - - Multi-homing flexibility
    - If buyers can phase adoption, Decagon can land faster but may stay a layer rather than become the system of record
    - Medium
    - Intercom-any-helpdesk claim and Decagon replacement evidence
    - Clarify whether Decagon expands account control over time or stays a specialized overlay
  - - Internal-build substitute pressure
    - AWS, Google, OpenAI, and Anthropic lower the barrier to experimenting with custom support agents
    - High
    - Official substitute-stack sources plus commoditization analysis
    - Ask which customers chose build over buy, why they lost, and what product gaps drove those outcomes
  notes: Severity reflects underwriting relevance, not certainty. The register mixes direct evidence with clearly labeled inference about how procurement and competition are likely to work in practice.
