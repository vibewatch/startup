- id: pricing-switching-and-substitutes
  title: Pricing, switching cost, and substitute pressure
  body: 'Public pricing evidence remains asymmetric. Intercom and Salesforce expose list pricing and usage structure, Zendesk discloses the seat-plus-add-on mechanics even when enterprise quotes remain negotiated, and AWS Q Business publishes a very low starting price for internal experimentation. Decagon, Sierra, Observe.AI, Cognigy, and Kore.ai remain more opaque in retrieved public materials, which shifts diligence from list price toward total cost of deployment and operating change. That operating change is what creates most switching cost. Buyers have to migrate workflows, knowledge, guardrails, and escalation logic, even when the vendor can plug into an existing helpdesk or CRM. The good news for Decagon is that this also makes phased adoption possible: Intercom explicitly works with any helpdesk, and Decagon''s own positioning plus third-party coverage imply that many wins come from replacing specific legacy flows before a company rewires its entire service stack. Internal-build substitutes
    remain credible mostly for organizations that already have strong cloud, data, and engineering capabilities, because low-cost model access does not remove the need to assemble governance, QA, telemetry, and support operations.'
