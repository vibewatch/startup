- id: TP001
  title: Competitor profile table
  columns:
  - Competitor
  - Category
  - Scale / funding signal
  - Target segment
  - Differentiation
  - Limitation
  rows:
  - - Decagon
    - Direct AI-native platform
    - $250M Series D at $4.5B valuation; 100+ new enterprise customers in 2025
    - Large enterprises modernizing support across channels
    - AOP-based workflow logic plus integrated testing, supervision, and omnichannel support
    - Public pricing remains opaque and deployment still requires integration work
  - - Intercom / Fin
    - Incumbent helpdesk with embedded AI agent
    - Established helpdesk vendor; 350+ integrations; 60+ AI team members cited on Fin page
    - Teams already using Intercom or wanting AI atop an existing helpdesk
    - Natively integrated AI agent, same customer record, fast setup, and strong multichannel surface
    - Seat-plus-outcome pricing can stack, and trust detail retrieved was lighter than Zendesk's
  - - Zendesk
    - Incumbent support suite
    - Established CX vendor with enterprise security certifications and installed base
    - Mid-market and enterprise support teams already centered on ticketing workflows
    - AI agents for multi-step workflows plus explicit trust and governance detail
    - Advanced features still layer through add-ons and usage-based components
  - - Salesforce Service Cloud / Agentforce
    - Incumbent CRM and service platform
    - Large enterprise CRM distribution plus Slack and Data 360 adjacency
    - Enterprises already standardized on Salesforce for customer data and service ops
    - Strong distribution, built-in AI, workflow orchestration, and cross-sell leverage
    - Highest list-price complexity in the retrieved set and heavier platform footprint
  - - Sierra
    - Direct AI-native peer
    - Well-known startup peer; product pages emphasize enterprise deployments but not public pricing
    - Enterprise brands seeking highly customized customer-experience agents
    - Plain-English build flow, multichannel scope, multivariate testing, and strong observability story
    - Specific trust artifacts and pricing were not exposed in retrieved materials
  - - Observe.AI
    - Adjacent direct peer in contact centers
    - Purpose-built CX platform; claims one-to-two-month deployments
    - Contact centers wanting customer, frontline, and operations agents on one platform
    - End-to-end execution across voice and chat with policy-enforced workflows
    - Public pricing is unknown and certification detail was indirect in reviewed pages
  - - Cognigy
    - Adjacent direct peer in enterprise contact centers
    - 1,250+ brands, 100+ languages, 25K+ concurrent interactions, 110+ integrations
    - Large enterprise contact centers and CCaaS-heavy environments
    - Strong contact-center specialization and high integration breadth
    - Pricing is not public and trust details were not visible beyond the trust-center surface
  - - Kore.ai
    - Adjacent platform and suite competitor
    - Hundreds of enterprises and 100s of prebuilt agents/templates
    - Enterprises spanning customer service and employee workflows, especially regulated domains
    - Broad agent platform with regulation-oriented applications and HIPAA messaging
    - Less support-specific pricing and CX proof was exposed in retrieved materials
  - - Internal build on AWS/Google/OpenAI/Anthropic
    - Status quo / substitute
    - Lower-cost building blocks from hyperscalers and foundation-model vendors
    - Enterprises with strong cloud, data, and engineering capabilities
    - More control and lower entry pricing for teams that can assemble their own stack
    - Requires the buyer to build workflow logic, governance, testing, and operations themselves
  notes: Profile rows combine official marketing pages with independent coverage. Scale entries mix disclosed pricing, funding, or publicly claimed deployment scale; missing public detail is marked explicitly.
