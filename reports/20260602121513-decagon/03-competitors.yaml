callouts:
- calloutType: strength
  title: Decagon's clearest edge is workflow depth, not base-model access
  body: The strongest supportable Decagon differentiation is the combination of AOP-based workflow encoding, integrated regression-style testing, and runtime supervision. That is a more durable story than claiming privileged access to frontier models.
  claimRefs:
  - CP002
  - CP003
  - CP004
  - CP036
  - CP048
- calloutType: risk
  title: Installed-base distribution is the main strategic threat
  body: Intercom, Zendesk, and Salesforce can all sell AI into environments where they already own the agent workflow or customer record. That distribution power can outweigh feature deltas unless Decagon proves materially faster ROI or deeper automation.
  claimRefs:
  - CP007
  - CP009
  - CP017
  - CP043
  - CP049
- calloutType: assumption
  title: Build-vs-buy is becoming a real competitive branch
  body: Low-cost substitute stacks from AWS, Google, Anthropic, and OpenAI do not remove implementation work, but they do lower the threshold for technically capable buyers to test internal-build paths before committing to a full CX platform.
  claimRefs:
