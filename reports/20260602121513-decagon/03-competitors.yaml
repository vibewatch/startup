chapter:
  number: 3
  title: Competitors
  summary: Decagon has a real AI-native product edge in workflow encoding, testing, and omnichannel execution, but its moat is only moderate because incumbents still own distribution and model-layer substitutes keep getting cheaper. The competitive battle is less about who has access to the best model and more about who can encode business logic, prove reliability, and win inside existing service workflows.
sections:
- id: landscape-and-shortlist
  title: Landscape and shortlist dynamics
  body: 'Decagon competes in a crowded but clearly defined buyer shortlist: AI-native automation vendors, incumbent support suites, and internal-build substitutes. The company has credible momentum heading into 2026, with public reporting pointing to more than 100 new enterprise customers in 2025 and a $4.5B valuation, but the same reporting also frames the real benchmark set as Salesforce, Intercom, and Zendesk rather than smaller startup peers alone. That matters because the buyer is rarely choosing a model vendor in isolation; the real choice is whether to keep support inside an existing helpdesk or CRM, buy an AI-native workflow layer, or assemble one on top of cloud and foundation-model infrastructure. PitchBook''s outlook reinforces that AI customer service is a large, near-term commercialization category, which explains why incumbents, AI-native challengers, and hyperscaler substitutes are all active at once. Decagon''s public win evidence suggests it can replace legacy systems and
    even beat some internal-build paths, but it does not eliminate the structural advantage of platforms that already own customer data, routing, and the operator workflow.'
