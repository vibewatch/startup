- id: TP003
  title: Pricing and packaging comparison
  columns:
  - Vendor
  - Public pricing / packaging evidence
  - What is supportable now
  - Unknowns or discount caveats
  - Implication
  rows:
  - - Decagon
    - No public list price on official pages; Sacra says per-conversation or per-resolution; competitor review estimates ~$50K platform fee + usage
    - Custom enterprise pricing with outcome- or conversation-based packaging appears likely
    - Real realized pricing, discounts, SLA bundles, and professional services scope remain private
    - Value case must be sold on ROI and workflow depth, not transparent sticker price
  - - Intercom
    - Seat-based plans plus Fin from $0.99 per outcome
    - 'Public structure is clear: $29 / $85 / $132 per seat annually plus outcome billing'
    - Enterprise discounts, add-ons, and true blended cost depend on volume and modules
    - Easy to benchmark against Decagon and internal build because both seat and usage components are visible
  - - Zendesk
    - Seat-based per agent per month with add-ons and usage-based Voice/App Builder/Action Builder overages
    - Pricing model is transparent even when enterprise quote details are not
    - Exact enterprise tier economics and AI add-on cost were not fully exposed in retrieved text
    - Zendesk can look cheaper at entry but total cost grows with add-ons and usage
  - - Salesforce
    - Enterprise $175, Unlimited $350, Agentforce 1 Service $550
    - List pricing is public and clearly ladders with bundled AI and data
    - Negotiated discounts, conversation-credit economics, and services are still quote-dependent
    - Salesforce signals premium all-in pricing but can justify it when CRM consolidation matters
  - - AWS Q Business
    - Starts as low as $3 per user per month
    - Lowest explicit public entry price in the retrieved set
    - Total spend rises with integration, governance, and custom application work
    - Internal build looks cheap at the component layer but expensive in organizational effort
  - - Google Conversational AI / Agent Platform
    - No comparable list price retrieved; new customers receive up to $300 in credits
    - Early experimentation support is visible, but enterprise packaging detail is limited
    - Production pricing, agent-runtime charges, and support tiers were not captured in this run
    - Useful substitute for technical teams, but not easy to benchmark as turnkey support software
  - - Anthropic Enterprise
    - Enterprise plan exists but retrieved page did not expose list price
    - Commercial motion is clearly enterprise and integration-heavy
    - Production pricing is quote-based from retrieved materials
    - Best treated as a model-and-agent building block rather than a like-for-like CX suite
  - - OpenAI Business / Enterprise
    - Business and Enterprise plans exist, but retrieved pages did not expose list price
    - Strong security posture and workspace-agent story are public
    - True customer-service TCO depends on integration, usage, and support architecture
    - OpenAI is a substitute input into internal build, not a direct packaged support deployment
  notes: Pricing entries mix official list pricing, official packaging descriptions, and clearly labeled third-party estimates. Unknown means no supportable public figure was retrieved in this run.
