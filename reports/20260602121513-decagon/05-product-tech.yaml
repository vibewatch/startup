    {
      "id": "implementation-model-dependencies-and-reliability",
      "title": "Implementation model, external dependencies, and reliability posture",
      "body": "Decagon's onboarding story is intentionally framed as faster and less code-heavy than legacy bot builds, but public evidence suggests enterprise deployments are still guided rather than purely self-serve. Marketing pages promise production agents in weeks and even core infrastructure in days, while Simulations explicitly points existing customers to an Agent Product Manager for guided tours and recommended test cases. That fits what Rippling describes: custom API workflows, 75-plus routing tags, and close collaboration with Decagon engineers. The product is therefore configurable by business teams, but not obviously trivial to stand up without cross-functional work on data access, policies, escalation design, and testing. The stack is also dependent on a real external ecosystem. OpenAI, Claude, Azure-hosted models, Google Cloud services, telephony and SIP infrastructure, identity providers, and DLP tooling all appear in public materials, creating resilience through provider diversity but also concentration risk if model economics, service quality, permissions, or procurement constraints change. Decagon's security page advertises redundancy, failover, and uptime controls, yet public materials still stop short of giving a conservative buyer the full SLA, incident-history, or model-routing detail they would likely ask for in diligence.",
