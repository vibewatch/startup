  "chapter": {
    "number": 5,
    "title": "Product & Technology",
    "summary": "Decagon's public product surface looks more like an operations layer for enterprise AI agents than a basic chatbot tool: AOPs turn natural-language workflows into executable logic, while testing, experiments, observability, analytics, and omnichannel voice/memory features sit in the same control plane. Named customer proof and partner write-ups support real deployment depth, but the stack remains dependent on third-party models, cloud services, telephony, and identity/data systems, and public documentation is still lighter on hard implementation and SLA detail than a conservative enterprise buyer would want."
  },
  "sections": [
    {
      "id": "aop-first-agent-platform",
      "title": "AOP-first platform architecture and product surface",
      "body": "Decagon is not marketing a thin FAQ bot. Its public product narrative centers on Agent Operating Procedures, or AOPs: natural-language instructions that compile into structured logic, so CX teams can shape workflow behavior without waiting on an engineering sprint while technical teams still govern integrations, guardrails, and rollouts. That is a materially different operating model from older decision-tree or SDK-first chatbot products, and Rippling's case study makes the contrast concrete by describing the limits of its prior decision-tree platform on vague questions, routing, and product-specific workflows. Around that control layer, Decagon now exposes a broad surface: integrations and MCP connectivity for data and actions, Testing & QA, Experiments, Insights and Duet, Watchtower, voice, proactive outreach, and memory. In practical workflow terms, the product is trying to own the full cycle from authoring logic, to connecting systems, to validating behavior, to monitoring and improving live traffic across channels. That breadth is the core reason Decagon reads as a deep-integration agent platform rather than a basic conversational shell.",
      "claimRefs": [
        "CE001",
