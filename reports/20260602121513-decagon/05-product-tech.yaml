    {
      "id": "voice-memory-and-proactive-agents",
      "title": "Voice, memory, and proactive engagement",
      "body": "Decagon's public roadmap is also pushing beyond reactive chat and email. Voice now includes real-time response handling, customizable voice profiles, human escalation with summary handoff, outbound campaigns, and profile updates that honor preferences such as do-not-contact requests. The March 2026 proactive launch packaged user memory, outbound voice, and Agent Workbench together, arguing that customer relationships should not reset to zero on every interaction. User memory is described as built into the agent engine, carrying history, preferences, and signals across sessions and channels with governance controls on what context is stored and used. This is more ambitious than a channel-specific support bot because it implies the same system should manage inbound resolution, outbound follow-up, and cross-channel continuity. The strongest public proof is still customer specific rather than portfolio wide: Chime cites nearly 70% voice resolution at more than one million calls per month, while Hertz and Away are cited for proactive outreach and continuity use cases. Those are useful deployment signals, but they should be interpreted as named-account examples, not company-wide benchmarks for every Decagon deployment.",
