      "id": "founders-leadership-and-governance",
      "title": "Founders, leadership, and governance visibility",
      "body": "Leadership is founder-centric and publicly legible, but governance is not. Retained official materials consistently show Jesse Zhang as co-founder and CEO, while the current about page presents Ashwin Sreenivas as co-founder and President. That title is itself informative: Decagon's June 2024 Series A materials described Sreenivas as CTO, so the external role progression suggests a broadening mandate as the company moved from founding buildout into enterprise scale. Founder-market fit is also easier to see than at many private AI startups. Zhang previously built Lowkey before its acquisition by Niantic, and third-party profiles say Sreenivas previously founded Helia before its acquisition by Scale AI. Those backgrounds support the reading that Decagon's founders combine consumer-product instincts, technical depth, and prior startup execution. What remains conspicuously thin is the broader executive and governance picture. The clearest retained board disclosure is historical: Series A materials said Accel partner Ivan Zhou joined the board. Beyond that, the public record in retained sources does not provide a full current board roster, ownership percentages, or a clean cap-table view. For diligence purposes, the practical takeaway is key-person concentration: the founders are still the main public faces for strategy, product philosophy, fundraising, and category narrative, while the broader institutional governance structure remains mostly private.",
