    {
      "id": "milestones-and-cautionary-signals",
      "title": "Milestones, expansion path, and cautionary signals",
      "body": "The milestone record shows a startup moving unusually fast from stealth launch to global-enterprise positioning, but it also surfaces the cautionary angles that should carry forward into later diligence. The chronology is straightforward on the positive side: 2023 founding, June 2024 launch and initial institutional financing, October 2024 Series B, June 2025 Series C, a November 2025 Deutsche Telekom pilot with strategic investment from T.Capital, January 2026 Series D, and March 2026 employee tender. Distribution milestones then broadened the picture further, with office expansion in New York, London, and Toronto, Google Cloud Marketplace availability, and a CNBC Disruptor 50 appearance in May 2026. Yet public evidence still leaves important blind spots. TechCrunch says the company has not disclosed revenue since late 2024's eight-figure ARR signal, while Sacra provides only an external estimate for October 2025 revenue. More importantly, Sacra's risks section makes explicit two issues the official narrative naturally downplays: dependency on third-party model providers and the challenge of maintaining low hallucination rates as enterprise deployments scale across more workflows. Forbes adds a second caution by noting that Decagon is still competing against far larger incumbents such as Salesforce, Intercom, and Zendesk. The right interpretation is not that Decagon's momentum is fake; it is that the valuation ramp and employee-liquidity event are easier to verify than durable economics, exact staffing scale, or long-run defensibility.",
