    "number": 1,
    "title": "Company Overview",
    "summary": "Decagon is a 2023-founded private conversational-AI company focused on enterprise customer experience, with founders Jesse Zhang and Ashwin Sreenivas still anchoring the public narrative. Official and independent coverage support a funding ladder from seed and Series A through a January 2026 $250M Series D at a $4.5B valuation, but public disclosure remains materially thinner on board structure, audited financials, exact headcount, and long-run AI-model dependency risk."
  },
