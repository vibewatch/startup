  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Funding history and valuation step-up
        blocks:
          - type: paragraph
            body: >
              Decagon's financing history is unusually compressed even by AI-infrastructure standards. The company
              disclosed a $5 million seed and $30 million Series A when it emerged from stealth in June 2024, then added
              a $65 million Series B in October 2024, a $131 million Series C at a $1.5 billion valuation in June 2025,
              and a $250 million Series D at a $4.5 billion valuation in January 2026. Arithmetic on the named primary
              rounds yields about $481 million of operating capital raised. That arithmetic matters, because later
              coverage sometimes rounds the total to "over $500 million," while the employee tender in March 2026 should
              be treated as secondary liquidity for staff rather than fresh cash for the company. The key underwriting
              takeaway is not lack of access to capital; it is that valuation step-ups from the implied ~$650 million
              Series B level to $1.5 billion and then $4.5 billion happened faster than the company expanded public
              financial disclosure, leaving investors dependent on private growth data.
