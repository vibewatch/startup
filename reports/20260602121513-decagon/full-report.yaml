        title: Customer mix and deployment breadth
        blocks:
          - type: paragraph
            body: >-
              Decagon's public customer base looks broader than a handful of SaaS logos, but it is still best understood
              as a set of enterprise brands serving large end-customer populations rather than a disclosed roster of
              paying accounts. Official Decagon surfaces now anchor the mix with Avis Budget Group, Chime, Oura Health,
              1-800-FLOWERS.COM, Hunter Douglas, and later funding posts add Block and Deutsche Telekom, while customer
              stories go deeper on Duolingo English Test, Notion, Rippling, ClassPass, Chime, and Mercado Libre. That
              creates visible coverage across travel and mobility, fintech, education and testing, productivity SaaS,
              HR/IT/finance software, wellness and fitness, marketplace commerce, telecom, and gifting. The buyer
              pattern is also consistent: the enterprise brand appears to be the payer, CX or support/product-ops teams
              are the operators, and the direct beneficiaries are the brand's own end customers or members. Public proof
              also spans multiple channels and regions. Chime shows live chat and voice, ClassPass shows chat plus email
              plus agent-assist, Mercado Libre extends proof into Portuguese-language voice in Latin America, and
              Deutsche Telekom adds a European telco pilot. The strongest current growth proxy is not a disclosed total
              customer count but Decagon's January 2026 statement that more than 100 new global enterprise customers
              joined in 2025, alongside third-party reporting that the company more than quadrupled its customer base
              and now serves tens of millions of end users through deployed accounts.
