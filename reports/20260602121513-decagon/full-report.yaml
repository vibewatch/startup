  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Current valuation anchor and disclosure gap
        blocks:
          - type: paragraph
            body: >-
              Decagon now has a much clearer price anchor than operating denominator. The valuation side is unusually
              well corroborated for a private company: the company’s January 2026 Series D announcement, the
              company-distributed Business Wire release, and multiple independent writeups all pin the latest financing
              at $250 million and a $4.5 billion valuation, while the March 2026 tender offer cleared at the same mark
              and gave more than 300 employees liquidity. The harder part is the denominator. Sacra estimates Decagon
              reached $35 million of annualized revenue in October 2025 after being at $10 million at the end of 2024,
              but Forbes described the company as doing roughly $12 million of 2025 revenue. Those anchors are
              directionally useful, not cleanly reconcilable, and neither source supplies current 2026 gross margin,
              retention, or concentration data. Public evidence therefore supports a strong conclusion about the
              headline price and a weak conclusion about the underlying unit economics. That combination matters because
              a company can be both real and fast-growing while still being too expensive for new money at the last
              round mark.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV010
              - CV011
              - CV029
              - CV030
              - CV047
      - number: '8.2'
        title: Private AI-CX peers and public-market cross-checks
        blocks:
          - type: paragraph
            body: >-
              The peer set shows why Decagon cannot be dismissed with a simple 'private AI bubble' headline, but it also
              shows why the current mark needs real diligence. Sierra’s May 2026 financing put it at $15.8 billion after
              the company said ARR topped $150 million; Sacra’s May 2026 estimate pushes Sierra to roughly $200 million
              ARR, implying something like ~79x to <105x ARR depending which anchor one uses. Parloa’s January 2026
              Series D at $3 billion and roughly $50 million to $52 million ARR implies about ~58x to ~60x ARR, while
              PolyAI’s December 2025 round was framed by Forbes at roughly a 25x multiple. Against that private set,
              Decagon’s ~$4.5 billion mark on Sacra’s late-2025 $35 million annualized revenue anchor implies about
              ~129x — richer than every retained peer anchor here. The public check is harsher still. Yahoo’s June 2026
              snapshots put Salesforce at 4.56x sales, NICE at 2.06x, and Five9 at 1.95x, while Multiples.vc’s May 2026
              public software basket keeps most software sectors in roughly 2x to 4x revenue territory. These are not
              apples-to-apples with private ARR marks, but they do show how much of Decagon’s price rests on scarcity
              and future execution rather than disclosed current fundamentals.
