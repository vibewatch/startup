  - id: FR001
    title: Risk heatmap
    type: matrix
    layout: wide
    summary: >-
      Decagon's highest residual risks cluster around incumbent bundle competition, quality and compliance failures in
      high-stakes support, and external supplier dependence rather than a lack of product ambition.
    data:
      columns:
        - Likelihood
        - Impact
        - Mitigation maturity
        - Residual severity
      rows:
        - label: Incumbent bundle / pricing pressure
          values:
            - label: high
              tone: negative
              detail: Large suites already sell AI inside existing service budgets.
            - label: high
              tone: negative
              detail: Can hit win rate, discounting, and expansion quality.
            - label: medium
              tone: warning
              detail: Decagon differentiates on control, testing, and workflow depth.
            - label: high
              tone: negative
              detail: Residual exposure stays high until Decagon proves durable commercial advantage.
        - label: High-stakes quality / compliance failure
          values:
            - label: medium-high
              tone: warning
              detail: Controls are real, but public benchmark evidence is thin.
            - label: critical
              tone: negative
              detail: A single wrong policy or authentication decision can create direct liability.
            - label: medium-high
              tone: warning
              detail: Testing, guardrails, Watchtower, and escalation improve maturity.
            - label: high
              tone: negative
              detail: Residual risk stays elevated in refunds, account access, and regulated workflows.
        - label: Model-vendor dependence
          values:
            - label: medium
              tone: warning
              detail: Multi-model routing reduces single-supplier concentration.
            - label: high
              tone: negative
              detail: Availability, pricing, and roadmap changes can hit quality and margin together.
            - label: medium
              tone: warning
              detail: Partnership diversity helps, but contracts are not public.
            - label: high
              tone: negative
              detail: A repricing or outage shock would transmit quickly into service economics.
        - label: Cloud and integration dependence
          values:
            - label: medium
              tone: warning
              detail: Regional incidents and integration changes are not daily events, but they happen.
            - label: high
              tone: warning
              detail: Broken action systems or cloud incidents can stall customer trust and go-lives.
            - label: medium
              tone: warning
              detail: Multi-region design and testing help, but public incident metrics are sparse.
            - label: medium-high
              tone: warning
              detail: Residual exposure remains above a normal software baseline.
        - label: Implementation and services intensity
          values:
            - label: high
              tone: negative
              detail: Product depth implies real deployment and change-management work.
            - label: medium-high
              tone: warning
              detail: Slow go-lives can lower growth quality and sales efficiency.
            - label: medium
              tone: warning
              detail: AOPs and reuse should reduce some manual burden.
            - label: medium-high
              tone: warning
              detail: Residual risk stays material because implementation metrics are not public.
        - label: Concentration and valuation overhang
          values:
            - label: medium
              tone: warning
              detail: Public logo set is finite and growth expectations are high.
            - label: high
              tone: negative
              detail: A visible customer loss or slower growth could compress the current valuation quickly.
            - label: low-medium
              tone: warning
              detail: Strong funding reduces immediate balance-sheet stress.
            - label: medium-high
              tone: warning
              detail: Residual exposure remains material until concentration and margin data are disclosed.
    approximationNotes: >-
      The heatmap uses ordinal, source-backed ranking rather than fabricated probabilities; the point is to rank
      residual exposure, not imply false precision.
    claimRefs:
      - CR001
      - CR004
      - CR012
      - CR016
      - CR018
      - CR025
      - CR029
      - CR033
      - CR037
      - CR044
      - CR048
      - CR049
      - CR051
  - id: FR002
    title: Risk transmission map
    type: dag
    layout: wide
    summary: >-
      Decagon's main risk channels propagate through a small set of outcome variables: trust, growth quality, margin,
      financing flexibility, and valuation support.
    data:
      nodes:
        - id: bundle
          label: Incumbent bundle pressure
          detail: Suite vendors reduce switching and pricing friction.
          tone: warning
        - id: quality
          label: Quality / compliance incident
          detail: Automated misinformation or weak authentication creates liability.
          tone: warning
        - id: vendor
          label: Vendor outage or repricing
          detail: Model or cloud changes hit performance and costs.
          tone: warning
        - id: implementation
          label: Slow implementation
          detail: Complex deployments reduce growth quality.
          tone: warning
        - id: trust
          label: Customer trust
          detail: Buyers deepen usage only if quality and control hold.
          tone: warning
        - id: growth
          label: Growth durability
          detail: Slower go-lives or lower win rates reduce durable expansion.
          tone: warning
        - id: margin
          label: Margin pressure
          detail: Discounting and vendor costs compress economics.
          tone: negative
        - id: financing
          label: Financing flexibility
          detail: Weaker margins or growth increase dependence on external capital.
          tone: negative
        - id: valuation
          label: Valuation support
          detail: Premium pricing needs strong durability to hold.
          tone: negative
      edges:
        - from: bundle
          to: growth
          label: lower win rate / slower expansion
        - from: bundle
          to: margin
          label: discounting
        - from: quality
          to: trust
          label: customer confidence falls
        - from: quality
          to: margin
          label: credits, remediation, or fraud loss
        - from: vendor
          to: margin
          label: higher input costs
        - from: vendor
          to: trust
          label: availability or quality degradation
        - from: implementation
          to: growth
          label: go-lives slip
        - from: trust
          to: growth
          label: expansion slows
        - from: growth
          to: valuation
          label: multiple support weakens
        - from: margin
          to: financing
          label: less self-funded scale
        - from: financing
          to: valuation
          label: down-round or dilution risk
    approximationNotes: >-
      The map is qualitative and source-backed: it shows plausible causal direction, not numerical edge weights or
      forecast probabilities.
    claimRefs:
      - CR004
      - CR012
      - CR016
      - CR029
      - CR033
      - CR034
      - CR045
      - CR048
      - CR049
      - CR051
