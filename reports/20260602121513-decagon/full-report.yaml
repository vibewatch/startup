      - number: '7.2'
        title: AI quality, security, and compliance risk rises sharply in high-stakes support workflows
        blocks:
          - type: paragraph
            body: >-
              Decagon does have real public control scaffolding. The security page discloses RBAC, SSO, short-lived JWT
              tokens, audit logs, model redundancy, and multi-region infrastructure; the guardrails and testing
              materials describe escalation logic, unit and integration tests, and workflow-specific evaluation before
              and after launch; and Watchtower is explicitly positioned as always-on QA because manual spot checks do
              not scale. Those are meaningful mitigations and they should prevent casual comparisons with barebones
              chatbot wrappers.


              But the company also publishes evidence for why residual risk remains material. Decagon's own
              speech-to-speech post argues that current speech-native models are not yet enterprise ready because they
              struggle with reliability, factual accuracy, and cost efficiency, and because adding guardrails without
              hurting latency is hard. Its voice-authentication post warns that caller ID can be spoofed and that
              verification steps create abandonment if they become too cumbersome. In consumer and enterprise support,
              those are not abstract issues: incorrect refunds, mistaken eligibility decisions, or weak identity checks
              can become chargebacks, fraud loss, or compliance incidents. The Air Canada tribunal precedent is useful
              precisely because it is narrow and concrete: the company, not the bot, absorbed the liability when
              automated guidance was wrong. Regulatory pressure compounds the issue. The European Commission says
              high-risk AI systems need logging, human oversight, robustness, cybersecurity, and accuracy controls, and
              that the AI Act becomes broadly applicable on 2 August 2026. Even if Decagon itself is not always the
              regulated party, these obligations can lengthen procurement, raise diligence burdens, and make any quality
              failure more expensive.
