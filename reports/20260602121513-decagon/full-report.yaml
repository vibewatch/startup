  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary: what spend is in scope and what is not'
        blocks:
          - type: paragraph
            body: >-
              Decagon should not be placed inside a generic “AI chatbot” bucket. The company’s own product, integration,
              testing, and industry pages describe a broader operating layer for enterprise service: omnichannel
              resolution across voice, chat, and email; workflow orchestration through Agent Operating Procedures;
              real-time actions into CRM, helpdesk, telephony, and knowledge systems; and ongoing testing,
              observability, and analytics. That means the in-scope spend is the software budget for service automation
              and orchestration, not the full cost of customer support and not the entire contact-center software stack.
              Fortune’s contact-center-software category includes legacy modules such as IVR, call recording, CTI,
              workforce optimization, and services, which makes it a useful outer boundary but not a precise fit for
              Decagon. At the same time, the real substitutes are broad and practical: incumbent CCaaS or CRM vendors
              adding agentic features, internal build efforts, and outsourced or retained human labor. The category
              boundary therefore has to be defined by the job to be done—automated, trusted, enterprise-grade customer
              resolution—not by the broadest published TAM headline.
            claimRefs:
