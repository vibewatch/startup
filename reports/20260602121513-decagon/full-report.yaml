      - number: '4.4'
        title: Disclosure gaps and financial verdict
        blocks:
          - type: paragraph
            body: >
              The central financial issue is not whether Decagon can raise money; it is whether outside investors can
              independently judge the quality of that growth. The company has shown enough adoption and ROI to earn a
              premium financing market, but the premium now rests on sparse public numbers. Official disclosures stop at
              8-figure ARR language and operating-improvement anecdotes, while third parties publish non-comparable
              revenue estimates ranging from roughly $12 million of 2025 revenue to $35 million of annualized revenue by
              October 2025. Without public gross margin, cash burn, pricing realization, or retention data, the latest
              $4.5 billion valuation depends on management continuing to convert logo momentum and automation metrics
              into durable revenue faster than competition from incumbents and well-funded startups compresses pricing.
