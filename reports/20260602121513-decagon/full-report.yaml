      - - Gross margin and inference economics disappoint
        - Gross margin is structurally weak or inference / support costs erode operating leverage
        - The company stops looking like a premium software multiple candidate
        - Re-cut valuation on lower multiples and slower cash-generation expectations
      - - Customer concentration is high
        - A small number of logos or one sector drive a disproportionate share of ARR
        - The scarcity premium becomes less durable and renewal risk matters more
        - Lower the base-case multiple and widen downside
      - - Private AI funding cools or public software derates again
        - Private AI-CX rounds reprice lower or public software multiples compress further from the current 2x-5x zone
        - The external multiple bridge narrows even if Decagon executes operationally
        - Demand better terms or postpone entry
      - - Preference stack is investor-unfriendly
        - Liquidation rights, ratchets, or tender / secondary economics distort the real entry economics
        - Headline valuation stops representing investable value
        - Pause unless structure or price improves
    notes: >-
      These are valuation kill triggers, not generic operating risks; each one directly changes what a new investor
      should be willing to pay.
    claimRefs:
      - CV029
      - CV030
      - CV035
      - CV036
      - CV037
      - CV038
      - CV045
      - CV046
  - id: TV006
    title: Final diligence asks table
    columns:
      - topic
      - missing evidence
      - why it matters
      - owner or diligence path
    rows:
      - - Current ARR / revenue bridge
        - Board-approved current ARR, recognized revenue, and cohort bridge from late 2025 into 2026
        - >-
          Almost every valuation conclusion changes if the current denominator is meaningfully above or below the stale
          public anchor
        - CFO data room, board deck, and audit support
      - - Gross margin and inference-cost load
        - Gross margin by product / channel and the actual inference + support cost waterfall
        - Premium AI multiples only hold if software economics survive model and service costs
        - Finance diligence plus infrastructure review
      - - NRR and expansion quality
        - Net retention, logo retention, and usage expansion by customer cohort
        - The premium case assumes durable enterprise expansion, not one-time pilots
        - Revenue operations and cohort analysis
      - - Customer concentration
        - Top-customer, top-vertical, and geographic concentration schedules
        - The current public logo list proves breadth of names, not diversification of dollars
        - Sales ops schedule and customer concentration memo
      - - Cap table and preference terms
        - Liquidation preferences, ratchets, MFN clauses, and economics of the tender / secondary program
        - Headline valuation can mislead if downside protection or secondary mechanics are unusually investor-unfriendly
        - Counsel review of financing documents and equity summary
    notes: >-
      These asks are intentionally underwriting-specific; they target the missing evidence that would move the
      recommendation fastest.
    claimRefs:
      - CV006
      - CV029
      - CV030
      - CV045
