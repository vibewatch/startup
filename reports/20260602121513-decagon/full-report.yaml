      - number: '3.4'
        title: Moat durability and adverse view
        blocks:
          - type: paragraph
            body: >-
              The adverse case against Decagon is straightforward: model access is commoditizing quickly, incumbents are
              shipping agent products now, and buyers can increasingly mix and match helpdesk, CRM, cloud, and
              foundation-model layers instead of accepting a single full-stack vendor. The CAIO commoditization
              framework makes that explicit by arguing that model access has zero defensibility and that durable
              advantage sits in encoded expertise, workflow redesign, and outcome instrumentation. That framework is
              actually helpful for Decagon because its most concrete public differentiation maps into those higher
              layers through AOPs, testing, and supervision. Still, the company is not insulated from distribution
              disadvantage. Intercom, Zendesk, and Salesforce can sell AI into installed bases that already trust them
              with routing, data, and operator workflows, while hyperscalers and foundation-model vendors lower the
              build-vs-buy threshold for sophisticated engineering teams. The underwriting conclusion is therefore
              balanced: Decagon appears competitively credible and often faster to value for complex support workflows,
              but its moat should be treated as moderate and execution-dependent rather than untouchable.
