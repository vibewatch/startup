      - number: '1.3'
        title: Funding history, stakeholder map, and footprint
        blocks:
          - type: paragraph
            body: >-
              Decagon's capital formation is the strongest hard-evidence block in this chapter, and it supports treating
              January 2026 as the current stage anchor. The public financing ladder starts with the June 2024 launch
              disclosure of a $5M seed plus a $30M Series A, moves to a $65M Series B led by Bain Capital Ventures in
              October 2024, then to a $131M Series C at a $1.5B valuation in June 2025, and finally to a $250M Series D
              led by Coatue and Index at a $4.5B valuation in January 2026. Using only disclosed primary rounds, the
              math lands at roughly $481M of capital. That is the cleanest reusable number, even though some secondary
              coverage rounds it upward. The same evidence trail also shows how the stakeholder map evolved: Accel and
              a16z are repeat conviction investors from the earliest institutional financing, Bain is the key Series B
              validator, Coatue and Index anchor the latest valuation step-up, and T.Capital adds a more strategic
              enterprise-distribution signal through Deutsche Telekom. Geographic footprint expanded alongside the
              capital base, with San Francisco remaining the core hub while New York, London, and Toronto appear as
              explicit hiring and customer-proximity nodes. The one important restraint is that financing visibility
              should not be mistaken for full-company transparency. Public sources remain much weaker on exact
              headcount, board rights, customer concentration, and unit economics than they are on round size and
              investor names.
