  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The recommendation stays cautious because Decagon has real scale proof and peer support, but the current mark
      still outruns disclosed economics.
    data:
      nodes:
        - id: scale
          label: 'Scale proof: $4.5B round, same-price tender, 100+ new enterprise customers'
          type: input
        - id: peer
          label: 'Peer premium: Sierra, Parloa, and PolyAI show private AI-CX premiums can persist'
          type: input
        - id: public
          label: 'Public ceiling: Salesforce, NICE, Five9, and software baskets still trade ~2x-5x sales'
          type: input
        - id: opacity
          label: 'Opacity: current ARR, margins, NRR, and concentration remain thin or stale publicly'
          type: input
        - id: froth
          label: 'Adverse lens: private AI valuations can run ahead of fundamentals and later reprice'
          type: input
        - id: decision
          label: 'Decision: research-more, medium confidence, high risk, expensive'
          type: output
        - id: upgrade
          label: Upgrade only if diligence proves materially higher ARR and strong unit economics
          type: output
      edges:
        - from: scale
          to: decision
        - from: peer
          to: decision
        - from: public
          to: decision
        - from: opacity
          to: decision
        - from: froth
          to: decision
        - from: decision
          to: upgrade
    approximationNotes: This flow expresses investment logic, not a deterministic valuation model.
    claimRefs:
      - CV007
      - CV010
      - CV021
      - CV028
      - CV035
      - CV043
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: standard
    summary: >-
      The $4.5B mark only becomes easier to defend if Decagon’s current ARR is already well above the best public
      late-2025 anchor.
    data:
      items:
        - label: Public late-2025 ARR anchor
          value: 35
          note: Sacra late-2025 annualized revenue estimate
        - label: ARR needed at 120x
          value: 37.5
          note: Still an extreme private multiple
        - label: ARR needed at 90x
          value: 50
          note: Closer to a hot-growth peer premium
        - label: Parloa ARR anchor
          value: 52
          note: Sacra 2025 ARR estimate for Parloa
        - label: ARR needed at 60x
          value: 75
          note: Premium but more disciplined private multiple
        - label: Sierra ARR floor
          value: 150
          note: Company-reported ARR threshold exceeded by May 2026
    approximationNotes: Thresholds are simple valuation / ARR bridges anchored to the $4.5B mark, not a DCF or management forecast.
    claimRefs:
      - CV011
      - CV015
      - CV018
      - CV020
      - CV037
      - CV038
  - id: FV003
    title: Valuation / return range
    type: range
    layout: wide
    summary: Even with strong execution, the current mark sits near the high end of what public evidence can defend today.
    data:
      items:
        - label: Bear case
          low: 1200
          mid: 1900
          high: 2700
          displayValue: $1.2B-$2.7B
          detail: $35M-$45M ARR at 35x-60x if multiples compress and economics stay opaque
          tone: negative
        - label: Base case
          low: 3500
          mid: 4400
          high: 5400
          displayValue: $3.5B-$5.4B
          detail: $50M-$60M ARR at 70x-90x if Decagon has outgrown the public anchor but still needs diligence
          tone: warning
        - label: Bull case
          low: 5600
          mid: 7000
          high: 9000
          displayValue: $5.6B-$9.0B
          detail: $70M-$90M ARR at 80x-100x with strong margins, retention, and concentration profile
          tone: positive
    approximationNotes: >-
      Ranges are scenario-based ARR-multiple outputs built for investment-committee discipline under public-data
      uncertainty.
    claimRefs:
      - CV039
      - CV040
      - CV041
      - CV042
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: Decagon scores strongly on market pull and customer proof, but weakly on evidence sufficiency and price support.
    data:
      items:
        - label: Market demand
          value: 4.5
          note: Large enterprises are clearly buying AI-native CX platforms
        - label: Customer proof
          value: 4
          note: 100+ new enterprise customers and multiple marquee logos are meaningful
        - label: Capital cushion
          value: 4
          note: The Series D and tender show real investor appetite and near-term financing access
        - label: Comparable support
          value: 2
          note: Private peers help, but Decagon still screens rich against retained peer anchors
        - label: Margin visibility
          value: 1.5
          note: No retained public gross margin, operating margin, or NRR disclosure
        - label: Valuation support
          value: 1.5
          note: Current price outruns public late-2025 ARR and public SaaS / CX multiples
        - label: Evidence quality
          value: 2
          note: Headline valuation is clear; underwriting evidence on economics is not
    approximationNotes: Scores are directional 0-5 IC judgments anchored to retained public evidence, not a company-provided scorecard.
    claimRefs:
      - CV007
      - CV021
      - CV029
      - CV035
      - CV043
