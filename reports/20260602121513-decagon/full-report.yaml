      - number: '4.2'
        title: Revenue model, pricing logic, and traction proxies
        blocks:
          - type: paragraph
            body: >
              The public monetization story is coherent even though realized pricing is opaque. Decagon says AI agents
              are priced against work performed rather than seats, and its pricing essay describes two models:
              per-conversation pricing and a higher-priced per-resolution model that only bills when the AI fully
              resolves the issue. The same post says most customers gravitate to per-conversation pricing, which likely
              makes budgeting easier and produces steadier recurring revenue so long as conversation volume holds.
              Public traction signals are strong enough to support demand but not strong enough to fully value the
              company. Official materials cite 10 million-plus end users served, average deflection around 80%, major
              cost savings, and more than 100 new enterprise customers in 2025. Customer examples such as Bilt, Hunter
              Douglas, Duolingo, Oura, and ClassPass suggest the product can save money and occasionally drive revenue,
              but Decagon still does not publish list pricing, discount bands, contract minimums, or a clean
              GAAP-revenue-to-ARR bridge.
