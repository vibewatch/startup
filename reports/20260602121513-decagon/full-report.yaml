  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and shortlist dynamics
        blocks:
          - type: paragraph
            body: >-
              Decagon competes in a crowded but clearly defined buyer shortlist: AI-native automation vendors, incumbent
              support suites, and internal-build substitutes. The company has credible momentum heading into 2026, with
              public reporting pointing to more than 100 new enterprise customers in 2025 and a $4.5B valuation, but the
              same reporting also frames the real benchmark set as Salesforce, Intercom, and Zendesk rather than smaller
              startup peers alone. That matters because the buyer is rarely choosing a model vendor in isolation; the
              real choice is whether to keep support inside an existing helpdesk or CRM, buy an AI-native workflow
              layer, or assemble one on top of cloud and foundation-model infrastructure. PitchBook's outlook reinforces
              that AI customer service is a large, near-term commercialization category, which explains why incumbents,
              AI-native challengers, and hyperscaler substitutes are all active at once. Decagon's public win evidence
              suggests it can replace legacy systems and even beat some internal-build paths, but it does not eliminate
              the structural advantage of platforms that already own customer data, routing, and the operator workflow.
            claimRefs:
              - CP001
