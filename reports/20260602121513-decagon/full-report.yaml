chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product model, and visible scale
        blocks:
          - type: paragraph
            body: >-
              Decagon's public identity is already clear enough that later chapters should not have to re-guess it. The
              company presents itself as a private San Francisco AI company focused on customer experience rather than a
              general-purpose foundation-model lab. Its current positioning is the "AI concierge" for every customer:
              software that helps enterprises deploy agents across voice, chat, email, SMS, and adjacent channels, then
              refine those agents with Agent Operating Procedures that compile natural-language instructions into code.
              That product framing appears consistently across the homepage, product pages, and funding posts, and it
              matters because Decagon is selling workflow automation plus operating control, not just a flashy bot
              layer. Public scale evidence is real but uneven. Official pages claim 10M+ customers served, 80% average
              deflection, 65% lower support-operations costs, and a 93% agent-quality score, while customer-proof pages
              add examples such as Chime's 70% chat-and-voice resolution and Rippling's 32% deflection lift. Those
              figures are useful as deployment signals, but they are still company-selected metrics rather than audited
              company-level economics. The right reuse rule for later chapters is therefore: trust the identity and
              product description, use the customer logos and operating metrics directionally, and avoid turning public
              deployment outcomes into unsupported claims about Decagon's own revenue quality.
