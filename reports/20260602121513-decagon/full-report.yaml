companyProfile:
  summary: >-
    Decagon is a 2023-founded private enterprise software company led by Jesse Zhang and Ashwin Sreenivas. The company
    sells AI-native customer experience agents that handle complex support workflows across chat, email, voice, SMS, and
    proactive outreach while integrating into ticketing, CRM, identity, payments, and other backend systems. Public
    evidence shows a funding path from seed and Series A through a January 2026 Series D at a $4.5 billion valuation,
    plus a March 2026 tender at the same mark, but the public record remains much thinner on current ARR, margins,
    retention, and concentration than on customer logos or financing momentum.
