            body: >-
              The best reason to treat Decagon's customer traction as more than logo collection is that several
              references include concrete operational metrics, named operators, and evidence of post-launch expansion.
              Duolingo English Test moved from a prior vendor that only deflected about 30% of email tickets and still
              had not launched live chat after a year to a Decagon deployment that went live within one month and
              reported 80% chat deflection; the case study also quotes Senior Operations Manager Ian Riggins by name and
              notes planned expansion into email. Rippling offers similarly strong reference quality: named
              support-operations leaders describe moving from 38% chat self-service to over 50%, enabling AI email
              deflection, and building 75-plus routing tags across 12-plus products with an immediate 7% routing
              improvement. Notion is a strong executive-sponsor reference, with Global Head of Customer Experience Emma
              Auscher framing Decagon as a strategic CX platform and reporting up to 34% faster ticket resolution plus
              only a 3.4% ask-for-human rate. Chime is the single strongest corroborated deployment because its Decagon
              case study is later reinforced by Chime's own S-1, which independently reports large-scale automation,
              lower support cost, and better support satisfaction. ClassPass and Mercado Libre broaden the proof set
              further: ClassPass shows RFP-based competitive selection and multi-channel expansion, while Mercado Libre
              shows real-world iteration, Portuguese QA tuning, and regulated-environment guardrails. The weaker edge of
              the evidence is that some marquee names such as Avis Budget Group, Hertz, and Deutsche Telekom still have
