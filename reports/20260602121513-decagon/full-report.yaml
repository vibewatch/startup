      - number: '2.4'
        title: Growth drivers are strong, but execution constraints are equally real
        blocks:
          - type: paragraph
            body: >-
              Several forces are clearly pushing the market forward. Labor pressure remains high, customer expectations
              for fast and accurate service keep rising, and multimodal AI now reaches well beyond simple chat into live
              voice and proactive outreach. Intercom and Verint both show that budgets and expectations are moving
              quickly: most teams are investing, customers want immediate resolution, and service quality is becoming
              more strategic. But the category is still early enough that execution risk matters as much as demand.
              Intercom says only 10% of teams are at mature deployment, Deloitte says governance for autonomous agents
              is mature at only one in five companies, and CX Today’s CMP summary says leaders now prioritize analytics
              and self-service discipline because bad automation creates more live contacts instead of fewer. Buyers
              also face privacy and compliance review, integration complexity, and large installed bases from incumbents
              such as Salesforce, Five9, NiCE, and Zendesk. For Decagon, that means growth can be fast without being
              frictionless: a large market exists, but it opens selectively where trust, integration, and operational
              proof clear the bar.
