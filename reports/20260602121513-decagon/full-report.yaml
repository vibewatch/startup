      - number: '8.4'
        title: Diligence, exit readiness, and thesis-breaks
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports continued diligence, not blind acceptance of the headline mark. The first ask is
              a current ARR and recognized-revenue bridge, because almost every valuation conclusion changes if Decagon
              is already materially above the late-2025 public anchor. The second is economics quality: gross margin,
              inference and support-cost load, and whether retention or usage expansion is strong enough to make the
              growth durable. The third is exposure hidden by logo slides — concentration by customer, sector, and
              geography — because premium private multiples assume breadth, not a handful of oversized accounts. The
              fourth is cap-table reality: preferences, liquidation rights, and any secondary or tender-related
              economics that make the headline valuation less investable than it looks. Those diligence asks also shape
              exit readiness. From public evidence alone, another private round, structured secondary, or strategic
              option is easier to support than a near-term IPO because the record is still announcement-heavy rather
              than filing-grade. The thesis should break quickly if current ARR is still near the public anchor, if unit
              economics are weaker than peer marks imply, or if concentration and preference terms reveal downside that
              the headline valuation obscures.
