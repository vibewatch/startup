companyProfile:
  summary: >-
    Decagon is a 2023-founded private enterprise software company led by Jesse Zhang and
    Ashwin Sreenivas. The company sells AI-native customer experience agents that handle
    complex support workflows across chat, email, voice, SMS, and proactive outreach while
    integrating into ticketing, CRM, identity, payments, and other backend systems. Public
    evidence shows a funding path from seed and Series A through a January 2026 Series D at
    a $4.5 billion valuation, plus a March 2026 tender at the same mark, but the public
    record remains much thinner on current ARR, margins, retention, and concentration than
    on customer logos or financing momentum.
  founders:
    - name: Jesse Zhang
      role: Co-founder and CEO
      background: Former Lowkey founder; Lowkey was acquired by Niantic in 2021.
      claimRefs: [CO003, CO044]
    - name: Ashwin Sreenivas
      role: Co-founder and President
      background: Previously founded Helia, later acquired by Scale AI.
      claimRefs: [CO004, CO045]
  headquarters: San Francisco, California, United States
  productSummary: >-
    Decagon’s platform combines Agent Operating Procedures, integrations, testing,
    simulations, observability, and guardrails so enterprises can deploy and continuously
    improve AI agents that resolve support issues end-to-end rather than just answer FAQs.
  customerFocus: >-
    Large enterprises and scaled digital brands in fintech, travel, telecom, software,
    education, retail, and adjacent sectors with high-volume customer operations.
  businessModel: >-
    Enterprise software sold through negotiated deployments with usage-based pricing,
    primarily per conversation and in some cases per successful resolution.
  stage: Series D private company
  fundingStatus: >-
    Raised a $250 million Series D in January 2026 at a $4.5 billion valuation after a
    $131 million Series C in June 2025 at $1.5 billion; disclosed primary capital totals
    roughly $481 million.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CI007, CI008, CI009, CU003, CV002]
summary:
  headline: >-
    Decagon pairs real enterprise AI-CX traction and strong product depth with a valuation
    that has moved faster than the public denominator, leaving the current $4.5 billion mark
    hard to underwrite without private diligence.
  overallScore: 6.5
