  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 当前证据
      - 什么会改变观点
    rows:
      - - 投资逻辑：企业需求真实存在
        - Decagon 在 2025 年新增 100+ 企业客户，并列举 Avis、Deutsche Telekom、Oura、Block/Chime、1-800-Flowers 等品牌。
        - 如果数据室证明客户群集中在少数客户标识，或续约 / 扩张偏弱，则下调判断。
      - - 投资逻辑：AI 原生 CX 领导者可以维持私募溢价
        - Sierra、Parloa 和 PolyAI 在 2025-2026 年都保住了高溢价的私募估值锚点。
        - 只有当 Decagon 当前 ARR 和利润率更接近 Sierra 级别，而不是过时的公开锚点时，观点才会改善。
      - - 投资逻辑：当前 ARR 可能已经高于 2025 年末公开锚点
        - 公司在 Series D 和 3 月要约中都维持 $4.5B 估值，说明投资人仍看到经营动能向上。
        - 如果管理层能证明当前 ARR 明显高于约 $50M-$75M，且队列质量强，则上调。
      - - 反向逻辑：倍数支撑极端
        - 按 Sacra 的 2025 年末 $35M 年化收入锚点，Decagon 约为 128.6x，高于保留下来的 Sierra、Parloa 和 PolyAI 框架。
        - 只有当当前 ARR 已经远超 2025 年末公开锚点时，这个风险才会缓解。
      - - 反向逻辑：公开经济性不透明
        - 没有保留下来的公开来源披露 Decagon 的毛利率、经营利润率、NRR 或客户集中度。
        - 如果数据室显示软件式利润率和可持续净扩张，观点会明显改善。
      - - 反向逻辑：公开可比公司给出的容错很低
        - Salesforce、NICE、Five9 以及更广泛的公开软件篮子仍大致处在 2x-5x 销售额区间。
        - 如果 Decagon 同时证明增长快得多，且 AI 原生 CX 业务的单位经济异常强，这个差距才不那么关键。
    notes: 反向逻辑主要是分母和可持续性风险：公司可以质量很高，但按当前估值给新钱入场仍然太贵。
