        - 自主解决、集成、可观测性、测试、主动工作流、全渠道编排
        - 仅按席位收费的服务台、仅转录工具、没有工作流执行的通用 copilot
        - 横跨 CX、运营、产品和 IT 的跨职能发起人组合
        - 最直接贴合 Decagon，但没有干净的独立公开 TAM
      - - 现状替代方案
        - 内部自建、在位厂商附加模块、保留人工坐席、外包商、碎片化点工具
