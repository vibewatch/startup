      - number: '7.2'
        title: AI 质量、安全与合规风险在高风险支持工作流中急剧上升
        blocks:
          - type: paragraph
            body: >-
              Decagon 确实有公开可见的控制脚手架。安全页面披露了 RBAC、SSO、短期 JWT
              令牌、审计日志、模型冗余和多区域基础设施；护栏和测试材料说明了升级逻辑、单元测试和集成测试，以及上线前后的工作流专项评估；Watchtower 也被明确定位为常开
              QA，因为人工抽查无法规模化。这些缓释措施有实质意义，也应避免外界把它和简陋的聊天机器人封装草率类比。


              但公司也给出了残余风险仍然重要的证据。Decagon 自己的 speech-to-speech
              文章认为，当前语音原生模型还没准备好进入企业级场景，因为可靠性、事实准确性和成本效率仍有短板，而且在不伤害延迟的情况下加护栏很难。其语音认证文章警告，来电显示可以被伪造；验证步骤一旦太繁琐，就会带来流失。在消费者和企业支持里，这些不是抽象问题：错误退款、资格误判或薄弱身份核验，可能变成拒付、欺诈损失或合规事件。Air
              Canada 仲裁先例之所以有用，恰恰因为它窄而具体：自动化指引出错后，承担责任的是公司，不是机器人。监管压力会放大这个问题。European Commission 称，高风险 AI
              系统需要日志、人类监督、稳健性、网络安全和准确性控制，AI Act 将在 2026-08-02 广泛适用。即便 Decagon
              本身并不总是受监管主体，这些义务也可能拉长采购周期、抬高尽调负担，并让任何质量故障的代价更高。
