      - number: '2.3'
        title: 买家、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              企业 CX 智能体软件的采购路径是跨职能的。Decagon 的买家指南瞄准 CX、运营、产品和 AI 负责人，
              这与产品材料和第三方调查中可见的实际部署要求一致。支持和联络中心负责人通常掌握运营痛点——工单量高、解决质量低、人员压力和渠道碎片化。
              产品和数字运营团队关心工作流、知识流和旅程设计。CIO、AI、安全和企业架构相关方常常成为闸门，
              因为集成、治理和数据处理决定智能体能否在生产系统中安全动作。公开垂直行业证据显示，最适合早期落地的是高量或高后果环境， 例如金融服务、电信和旅行；这些场景中，24/7
              支持、账单或行程复杂度、受监管或对忠诚度敏感的工作流，让自动化有价值。 采用通常从窄工作流试点开始，只有在集成、测试、人工升级和衡量跑通后才扩张。这一模式影响 Decagon 的可服务市场：
              预算真实存在，但释放方式靠一个工作流一个工作流证明运营可信度，而不是简单按座席扩张。
