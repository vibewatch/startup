      - number: '1.3'
        title: 融资历史、利益相关方地图与地域足迹
        blocks:
          - type: paragraph
            body: >-
              Decagon 的资本形成是本章最强的硬证据块，也支持把 2026 年 1 月视为当前阶段锚点。公开融资阶梯从 2024 年 6 月发布时披露的 $5M 种子轮加 $30M Series A 开始， 2024 年
              10 月进入 Bain Capital Ventures 领投的 $65M Series B，2025 年 6 月完成 $131M Series C、估值 $1.5B， 最后在 2026 年 1 月完成
              Coatue 和 Index 领投的 $250M Series D、估值 $4.5B。只按已披露新股轮计算，融资额约 $481M。
              这是最干净、可复用的数字，尽管部分二级报道会上调取整。同一证据链也显示利益相关方地图如何演化：Accel 和 a16z 是最早机构融资以来反复下注的投资人， Bain 是关键的 Series B
              验证者，Coatue 和 Index 锚定最新估值跃升，T.Capital 则通过 Deutsche Telekom 带来更具战略意味的企业分销信号。 地域足迹随资本基础一起扩大，San Francisco
              仍是核心枢纽，New York、London 和 Toronto 则成为明确的招聘与客户近场节点。重要约束是：
              融资可见度不能等同于公司整体透明。公开来源对精确员工数、董事会权利、客户集中度和单位经济性的披露，远弱于轮次规模和投资人姓名。
