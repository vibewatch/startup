  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: AOP 优先的平台架构与产品表面
        blocks:
          - type: paragraph
            body: >-
              Decagon 营销的不是轻薄 FAQ 机器人。其公开产品叙事围绕 Agent Operating Procedures，简称 AOP： 把自然语言指令编译成结构化逻辑，让 CX
              团队不用等工程冲刺也能塑造工作流行为，同时技术团队仍能治理集成、护栏和发布。 这与更旧的决策树或 SDK 优先聊天机器人产品相比，是实质不同的运营模式；Rippling
              案例研究通过描述其先前决策树平台在模糊问题、路由和特定产品工作流上的局限， 把这种差异讲得很具体。围绕这层控制，Decagon 现在暴露出广泛产品表面：面向数据和动作的集成与 MCP 连接，Testing &
              QA、Experiments、Insights 和 Duet、 Watchtower、语音、主动触达和记忆。从实际工作流看，产品试图拥有完整循环：编写逻辑、连接系统、验证行为、监控并改进跨渠道实时流量。
              这种宽度是 Decagon 更像深集成智能体平台、而不是基础对话外壳的核心原因。
