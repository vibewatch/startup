      - number: '2.4'
        title: 增长驱动很强，但执行约束同样真实
        blocks:
          - type: paragraph
            body: >-
              几股力量正在明确推动市场向前。劳动力压力仍高，客户对快速、准确服务的期待继续上升，多模态 AI 也已经远超简单聊天，进入实时语音和主动触达。 Intercom 和 Verint
              都显示预算和预期正在快速移动：多数团队在投资，客户想要即时解决，服务质量也变得更具战略性。 但品类仍足够早，执行风险与需求同样重要。Intercom 称只有 10% 的团队达到成熟部署，Deloitte
              称只有五分之一公司具备成熟的自主智能体治理， CX Today 的 CMP 摘要称领导者现在优先重视分析和自助服务纪律，因为糟糕自动化会制造更多人工联系，而不是减少联系。
              买家还要面对隐私和合规审查、集成复杂度，以及 Salesforce、Five9、NiCE、Zendesk 等既有厂商的大型装机基础。 对 Decagon
              而言，这意味着增长可以很快，但不会无摩擦：大市场存在，但只会在信任、集成和运营证明过线的地方选择性打开。
