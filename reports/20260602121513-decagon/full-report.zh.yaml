          values:
            - 3
            - 3
            - 2
            - 1
            - 2
    approximationNotes: 分数是作者基于检索到的公开材料做出的综合判断；它们反映每个客户引用的具体性、可归因性和外部佐证程度，而不是 Decagon 发布的评级。
    claimRefs:
      - CU045
      - CU046
      - CU047
      - CU051
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: Decagon 最高的剩余风险集中在既有厂商捆绑竞争、高风险支持场景中的质量与合规失误，以及外部供应商依赖，而不是产品野心不足。
    data:
      columns:
        - 发生概率
        - 影响
        - 缓解成熟度
        - 剩余严重性
      rows:
        - label: 既有厂商捆绑 / 价格压力
          values:
            - label: 高
              tone: negative
              detail: 大型套件已经把 AI 放进现有服务预算中销售。
            - label: 高
              tone: negative
              detail: 可能打击赢单率、折扣水平和扩张质量。
            - label: 中
              tone: warning
              detail: Decagon 靠控制、测试和工作流深度做差异化。
            - label: 高
              tone: negative
              detail: 在 Decagon 证明持久商业优势前，剩余敞口仍高。
        - label: 高风险质量 / 合规失误
          values:
            - label: 中高
              tone: warning
              detail: 控制措施真实存在，但公开基准证据偏薄。
            - label: 严重
              tone: negative
              detail: 一次错误政策或认证决定就可能造成直接责任。
            - label: 中高
              tone: warning
              detail: 测试、护栏、Watchtower 和升级机制提高成熟度。
            - label: 高
              tone: negative
              detail: 在退款、账户访问和受监管工作流中，剩余风险仍然偏高。
        - label: 模型供应商依赖
          values:
            - label: 中
              tone: warning
              detail: 多模型路由降低单一供应商集中度。
            - label: 高
              tone: negative
              detail: 可用性、定价和路线图一变，质量与利润率会一起受冲击。
            - label: 中
              tone: warning
              detail: 合作伙伴更多元有帮助，但合同并未公开。
            - label: 高
              tone: negative
              detail: 重新定价或宕机冲击会很快传导到服务经济性。
        - label: 云与集成依赖
          values:
            - label: 中
              tone: warning
              detail: 区域故障和集成变更不是每天发生，但确实会发生。
            - label: 高
              tone: warning
              detail: 操作系统失效或云故障会卡住客户信任和上线。
            - label: 中
              tone: warning
              detail: 多区域设计和测试能缓冲一部分风险，但公开事故指标很少。
            - label: 中高
              tone: warning
              detail: 剩余敞口仍高于普通软件基线。
        - label: 实施与服务强度
          values:
            - label: 高
              tone: negative
              detail: 产品越深，真实部署和变更管理工作就越重。
            - label: 中高
              tone: warning
              detail: 上线慢会拉低增长质量和销售效率。
            - label: 中
              tone: warning
              detail: AOPs 和复用应能减轻一部分手工负担。
            - label: 中高
              tone: warning
              detail: 实施指标未公开，剩余风险仍然重要。
        - label: 集中度与估值压力
          values:
            - label: 中
              tone: warning
              detail: 公开客户标识数量有限，增长预期却很高。
            - label: 高
              tone: negative
              detail: 一旦出现可见客户流失或增长放缓，当前估值可能很快被压缩。
            - label: 中低
              tone: warning
              detail: 融资实力强，降低了短期资产负债表压力。
            - label: 中高
              tone: warning
              detail: 集中度和利润率数据披露前，剩余敞口仍然重要。
    approximationNotes: 这张热力图采用有来源支撑的顺序排名，而不是编造概率；目的在于排列剩余敞口，而不是暗示并不存在的精确度。
    claimRefs:
      - CR001
      - CR004
      - CR012
      - CR016
      - CR018
      - CR025
      - CR029
      - CR033
      - CR037
      - CR044
      - CR048
      - CR049
      - CR051
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: Decagon 的主要风险通道会沿着少数结果变量传导：信任、增长质量、利润率、融资灵活性和估值支撑。
    data:
      nodes:
        - id: bundle
          label: 既有套件压力
          detail: 套件厂商降低切换和定价阻力。
          tone: warning
        - id: quality
          label: 质量 / 合规事故
          detail: 自动化误导信息或弱认证会带来责任。
          tone: warning
        - id: vendor
          label: 供应商宕机或重定价
          detail: 模型或云端变化会冲击性能和成本。
          tone: warning
        - id: implementation
          label: 实施缓慢
          detail: 复杂部署会削弱增长质量。
          tone: warning
        - id: trust
          label: 客户信任
          detail: 只有质量和控制守得住，买方才会加深使用。
          tone: warning
        - id: growth
          label: 增长耐久性
          detail: 上线变慢或赢单率下降，会削弱可持续扩张。
          tone: warning
        - id: margin
          label: 利润率压力
          detail: 折扣和供应商成本会压缩经济性。
          tone: negative
        - id: financing
          label: 融资灵活性
          detail: 利润率或增长转弱，会提高对外部资本的依赖。
          tone: negative
        - id: valuation
          label: 估值支撑
          detail: 高价估值需要强耐久性才能守住。
          tone: negative
      edges:
        - from: bundle
          to: growth
          label: 赢单率下降 / 扩张放缓
        - from: bundle
          to: margin
          label: 折扣
        - from: quality
          to: trust
          label: 客户信心下降
        - from: quality
          to: margin
          label: 退款、补救或欺诈损失
        - from: vendor
          to: margin
          label: 投入成本上升
        - from: vendor
          to: trust
          label: 可用性或质量下降
        - from: implementation
          to: growth
          label: 上线延迟
        - from: trust
          to: growth
          label: 扩张放缓
        - from: growth
          to: valuation
          label: 倍数支撑减弱
        - from: margin
          to: financing
          label: 自我造血扩张减少
        - from: financing
          to: valuation
          label: 下轮降价或稀释风险
    approximationNotes: 这张图是定性的，并有来源支撑：它展示可能的因果方向，不给出数值化边权或预测概率。
    claimRefs:
      - CR004
      - CR012
      - CR016
      - CR029
      - CR033
      - CR034
      - CR045
      - CR048
      - CR049
      - CR051
  - id: FR003
    title: 依赖图
    type: dag
    layout: wide
    summary: Decagon 最重要的外部节点落在模型、云、买方工作流和竞争分发层，而不是某个内部技术组件。
    data:
      nodes:
        - id: decagon
          label: Decagon 核心平台
          detail: 工作流、QA 和编排层。
        - id: openai
          label: OpenAI
          detail: 明确点名的模型提供商和合作伙伴。
        - id: anthropic
          label: Anthropic / Claude
          detail: 明确点名的模型提供商和合作伙伴。
        - id: gcp
          label: Google Cloud
          detail: 基础设施和安全态势依赖。
        - id: integrations
          label: 客户记录系统
          detail: 帮助台、CRM 和操作入口。
        - id: buyers
          label: 企业买方
          detail: 采购、安全和合规把关人。
        - id: regulators
          label: EU / 隐私监管机构
          detail: AI Act 和数据治理义务。
        - id: incumbents
          label: 既有套件厂商
          detail: Salesforce、Zendesk、Intercom 等类似平台。
        - id: trustops
          label: QA / 信任运营
          detail: 人工审核和发布纪律。
        - id: customers
          label: 已点名生产客户标识
          detail: 公开的标杆客户引用集合有限。
      edges:
        - from: openai
          to: decagon
        - from: anthropic
          to: decagon
        - from: gcp
          to: decagon
        - from: integrations
          to: decagon
        - from: trustops
          to: decagon
        - from: regulators
          to: buyers
        - from: buyers
          to: customers
        - from: incumbents
          to: buyers
        - from: decagon
          to: customers
        - from: incumbents
          to: decagon
          label: 定价和分发压力
        - from: regulators
          to: decagon
          label: 证据和控制负担
    approximationNotes: 这张图展示结构，而不是数量；它强调外部杠杆在哪里，而不是每个节点控制多少 ARR。
    claimRefs:
      - CR009
      - CR031
      - CR032
      - CR036
      - CR038
      - CR039
      - CR045
      - CR047
      - CR049
      - CR050
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 建议仍然谨慎：Decagon 确有规模证明和同业支撑，但当前估值仍跑在已披露经济性前面。
    data:
      nodes:
        - id: scale
          label: 规模证明：$4.5B 融资、同价要约交易、100+ 新增企业客户
          type: input
        - id: peer
          label: 同业溢价：Sierra、Parloa 和 PolyAI 表明，私有 AI-CX 溢价可以延续
          type: input
        - id: public
          label: 公开市场上限：Salesforce、NICE、Five9 和软件篮子仍约以 2x-5x 销售额交易
          type: input
        - id: opacity
          label: 不透明：当前 ARR、利润率、NRR 和集中度的公开信息仍很薄或已过时
          type: input
        - id: froth
          label: 反向视角：私有 AI 估值可能跑在基本面前面，之后重新定价
          type: input
        - id: decision
          label: 决策：继续研究，中等信心，高风险，估值昂贵
          type: output
        - id: upgrade
          label: 只有尽调证明 ARR 显著更高且单位经济性强，才上调评级
          type: output
      edges:
        - from: scale
          to: decision
        - from: peer
          to: decision
        - from: public
          to: decision
        - from: opacity
          to: decision
        - from: froth
          to: decision
        - from: decision
          to: upgrade
    approximationNotes: 这条流程表达投资逻辑，不是确定性的估值模型。
    claimRefs:
      - CV007
      - CV010
      - CV021
      - CV028
      - CV035
      - CV043
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 只有 Decagon 当前 ARR 已经明显高于 2025 年末最佳公开锚点，$4.5B 估值才更容易站住。
    data:
      items:
        - label: 2025 年末公开 ARR 锚点
          value: 35
          note: Sacra 对 2025 年末年化收入的估计
        - label: 120x 下所需 ARR
          value: 37.5
          note: 仍是极端的私有市场倍数
        - label: 90x 下所需 ARR
          value: 50
          note: 更接近高增长同业溢价
        - label: Parloa ARR 锚点
          value: 52
          note: Sacra 对 Parloa 2025 年 ARR 的估计
        - label: 60x 下所需 ARR
          value: 75
          note: 有溢价，但更克制的私有市场倍数
        - label: Sierra ARR 下限
          value: 150
          note: 公司披露到 2026 年 5 月已超过的 ARR 门槛
    approximationNotes: 门槛只是以 $4.5B 估值为锚的简单估值 / ARR 桥接，不是 DCF 或管理层预测。
    claimRefs:
      - CV011
      - CV015
      - CV018
      - CV020
      - CV037
      - CV038
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 即便执行很强，当前估值也接近今天公开证据所能支撑的上沿。
    data:
      items:
        - label: 悲观情景
          low: 1200
          mid: 1900
          high: 2700
          displayValue: $1.2B-$2.7B
          detail: 若倍数压缩且经济性仍不透明，ARR 为 $35M-$45M，对应 35x-60x
          tone: negative
        - label: 基准情景
          low: 3500
          mid: 4400
          high: 5400
          displayValue: $3.5B-$5.4B
          detail: 若 Decagon 已超过公开锚点但仍需尽调，ARR 为 $50M-$60M，对应 70x-90x
          tone: warning
        - label: 乐观情景
          low: 5600
          mid: 7000
          high: 9000
          displayValue: $5.6B-$9.0B
          detail: 在利润率、留存和集中度结构都强的情况下，ARR 为 $70M-$90M，对应 80x-100x
          tone: positive
    approximationNotes: 区间是基于情景的 ARR 倍数输出，用来在公开数据不确定时约束投委会判断。
    claimRefs:
      - CV039
      - CV040
      - CV041
      - CV042
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: Decagon 在市场拉力和客户证明上得分很强，但证据充分性和价格支撑偏弱。
    data:
      items:
        - label: 市场需求
          value: 4.5
          note: 大型企业显然在购买 AI 原生 CX 平台
        - label: 客户证明
          value: 4
          note: 100+ 新增企业客户和多个标杆客户标识有实际分量
        - label: 资本缓冲
          value: 4
          note: Series D 和要约交易显示投资人需求真实，短期融资通道仍在
        - label: 可比公司支撑
          value: 2
          note: 私有同业有帮助，但按保留同业锚点看，Decagon 仍显得偏贵
        - label: 利润率可见度
          value: 1.5
          note: 未保留公开的毛利率、营业利润率或 NRR 披露
        - label: 估值支撑
          value: 1.5
          note: 当前价格跑在 2025 年末公开 ARR 以及公开 SaaS / CX 倍数前面
        - label: 证据质量
          value: 2
          note: 头部估值很清楚；经济性的承销证据并不清楚
    approximationNotes: 分数是投委会基于保留公开证据作出的方向性 0-5 判断，不是公司提供的评分卡。
    claimRefs:
      - CV007
      - CV021
      - CV029
      - CV035
      - CV043
