        - 联络中心运营、数字运营、支持领导层
        - 更接近 Decagon，但仍包括许多点状能力和增强工具
      - - 客服 AI
        - 跨文本和语音的 AI 智能体、工作流自动化、推荐或知识系统、内容生成、服务质量管理
        - 与服务工作流无关的销售或营销 AI
        - CX、产品、服务运营、AI 负责人
        - 最接近 Decagon 品类的已发布第三方市场代理指标
