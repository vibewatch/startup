      - number: '2.2'
        title: 规模测算视角：市场很大，但没有单一精确 TAM
        blocks:
          - type: paragraph
            body: >-
              证据支持一个庞大且增长中的市场，但不能给 Decagon 得出单一精确 TAM。最宽的外层视角来自 Fortune 的联络中心软件市场， 该市场 2026 年达到 USD 77.82 billion，包含许多
              Decagon 并不直接销售的模块。更窄的自动化视角来自 Fortune 对 call-center-AI 的估计， 2026 年为 USD 2.98 billion。MarketsandMarkets
              又给出另一个仍偏宽的视角：客户服务 AI 市场 2024 年为 USD 12.06 billion， 2030 年达到 USD 47.82 billion；若按其披露的 CAGR 插值，2026 年约为 USD
              19.1 billion。这些数字之所以方向上有用， 正是因为它们在边界上并不一致。另一个自下而上的视角解释了买家为什么在意：仅美国仍有约 2.8 million 个客服岗位， 年工资成本约 USD 120.5
              billion，且不含福利。这个劳动力池不是软件 TAM，但它是一个可信的经济问题，让 ROI 变得可读。 正确结论是，Decagon 位于一个有意义的数十亿美元楔形市场中，但任何把单一干净全球 TAM
              当成精确值的做法都会夸大精度。
