  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 融资历史与估值跃升
        blocks:
          - type: paragraph
            body: >
              即使按 AI 基础设施标准，Decagon 的融资历史也异常压缩。公司 2024 年 6 月走出隐身时披露 $5 million 种子轮和 $30 million Series A， 随后在 2024 年 10
              月增加 $65 million Series B，2025 年 6 月以 $1.5 billion 估值完成 $131 million Series C， 2026 年 1 月以 $4.5 billion
              估值完成 $250 million Series D。按已命名的新股轮计算，累计运营资本约 $481 million。 这项计算重要，因为后续报道有时把总额取整为「over $500 million」，而
              2026 年 3 月员工要约收购应视为员工二级流动性，不是公司的新增现金。 关键承销结论不是 Decagon 缺乏资本渠道；而是从隐含约 $650 million 的 Series B 水平升至 $1.5
              billion、再升至 $4.5 billion 的估值台阶， 发生得比公司扩大公开财务披露更快，让投资人依赖私下增长数据。
