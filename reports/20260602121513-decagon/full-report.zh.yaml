  - id: TP003
    title: 定价和打包对比
    columns:
      - 厂商
      - 公开定价 / 打包证据
      - 当前可支持的判断
      - 未知项或折扣注意事项
      - 含义
    rows:
      - - Decagon
        - 官方页面没有公开标价；Sacra 称按对话或按解决结果计费；竞争对手评论估计约 $50K 平台费 + 用量
        - 定制企业定价，可能采用按结果或按对话的打包方式
        - 实际成交价、折扣、SLA 包和专业服务范围仍未公开
        - 价值论证必须靠 ROI 和工作流深度，而不是透明标价
      - - Intercom
        - 席位制套餐，加 Fin 每个结果 $0.99 起
        - 公开结构清楚：年付每席 $29 / $85 / $132，另加结果计费
        - 企业折扣、附加模块和真实混合成本取决于量和模块
        - 席位和用量组件都可见，因此容易与 Decagon 和自建做基准比较
      - - Zendesk
        - 按坐席每月计费，另有附加模块和 Voice/App Builder/Action Builder 的用量超额费
        - 即使企业报价细节不可见，定价模型也透明
        - 具体企业层级经济性和 AI 附加成本未在检索文本中完全披露
        - Zendesk 入门看起来更便宜，但总成本会随附加模块和用量增长
      - - Salesforce
        - 标价：Enterprise $175，Unlimited $350，Agentforce 1 Service $550
        - 标价公开，并随捆绑 AI 和数据清晰上台阶
        - 谈判折扣、对话积分经济性和服务仍取决于报价
        - Salesforce 释放的是高端一体化定价信号；当 CRM 整合重要时可以自洽
      - - AWS Q Business
        - 低至每用户每月 $3 起
        - 检索样本中最低的明确公开入门价
        - 总支出会随集成、治理和定制应用工作上升
        - 自建在组件层看起来便宜，但组织投入很贵
      - - Google Conversational AI / Agent Platform（智能体平台）
        - 未检索到可比标价；新客户最高可获 $300 额度
        - 早期实验支持可见，但企业打包细节有限
        - 本轮未捕捉到生产定价、智能体运行时费用和支持层级
        - 对技术团队是有用替代品，但不易作为交钥匙支持软件来对标
      - - Anthropic Enterprise（企业版）
        - Enterprise 计划存在，但检索页面未披露标价
        - 商业动作明显偏企业和重集成
        - 检索材料显示，生产定价基于报价
        - 更适合作为模型和智能体构件，而不是同类 CX 套件
      - - OpenAI Business / Enterprise（商业 / 企业版）
        - Business 和 Enterprise 计划存在，但检索页面未披露标价
        - 强安全姿态和工作区智能体叙事已公开
        - 真实客服 TCO 取决于集成、用量和支持架构
        - OpenAI 是自建的替代输入，不是直接打包好的支持部署
    notes: 定价条目混合官方标价、官方打包说明和明确标注的第三方估计。未知表示本轮未检索到可支撑的公开数字。
