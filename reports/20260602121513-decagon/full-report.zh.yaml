      - number: '1.2'
        title: 创始人、领导层与治理可见度
        blocks:
          - type: paragraph
            body: >-
              领导层以创始人为中心，外界也看得清，但治理并不透明。留存的官方材料始终显示 Jesse Zhang 为联合创始人兼 CEO， 当前关于页面则称 Ashwin Sreenivas 为联合创始人兼
              President。这个头衔本身有信息量：Decagon 2024 年 6 月 Series A 材料称 Sreenivas 为 CTO，
              因此外部角色变化说明公司从创始期搭建走向企业级扩张后，他的职责边界变宽了。相比许多私有 AI 初创公司，Decagon 的创始人-市场匹配也更容易看见。 Zhang 曾打造 Lowkey，后被 Niantic
              收购；第三方资料称 Sreenivas 曾创办 Helia，后被 Scale AI 收购。这些背景支持一个判断： Decagon
              的创始人组合兼具消费级产品直觉、技术深度和既往创业执行力。明显薄弱的是更广泛的高管和治理图景。最清楚的留存董事会披露是历史信息： Series A 材料称 Accel 合伙人 Ivan Zhou
              加入董事会。除此之外，留存来源的公开记录没有给出完整的现任董事名单、持股比例或干净的股权结构表。
              对尽调而言，实际结论是关键人物集中：创始人仍是战略、产品哲学、融资和品类叙事的主要公开面孔，更广泛的机构治理结构大多仍在私下。
