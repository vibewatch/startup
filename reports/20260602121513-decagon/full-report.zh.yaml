      - number: '7.3'
        title: 外部模型和云依赖压缩了 Decagon 对正常运行时间、经济性和产品方向的控制
        blocks:
          - type: paragraph
            body: >-
              公开证据清楚显示，Decagon 在模型层并没有纵向一体化。OpenAI 自己的案例研究称，Decagon 会把支持流程的不同环节路由给多个 OpenAI 模型；Decagon 维护了明确的 OpenAI 和
              Anthropic 合作伙伴页面；Sacra 称其技术栈混合了 OpenAI、Anthropic、Cohere
              和自研微调。多模型路由是一种缓释，因为它降低了单一供应商依赖，但这不是独立。同一批供应商仍然控制可用性、弃用节奏、定价、路线图优先级，在某些情况下还会亲自切入客服应用。


              这种依赖的运营侧，在官方状态页面里看得见。OpenAI 和 Claude 都公布正常运行时间和事故历史，Google Cloud 也单独公布服务健康和安全事故界面。Decagon
              的公开材料提到冗余和多区域设计，但没有披露承诺支出、终止权、替换所需时间，或流量从首选模型切走后质量会下降多少。这一点重要，因为模型和云风险不会只停留在基础设施里。上游供应商一旦降级、提价或更直接竞争，损害可能同时流入服务质量、毛利率、部署信心和客户信任。对一家销售任务关键型客户支持的年轻公司来说，这是结构性依赖风险，不是短暂的采购问题。
