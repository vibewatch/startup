      - number: '8.2'
        title: 私营 AI-CX 同业与公开市场交叉校验
        blocks:
          - type: paragraph
            body: >-
              同业组说明，不能用一句「私营 AI 泡沫」就否定 Decagon，但也说明当前估值需要真正尽调。Sierra 2026 年 5 月融资后估值 $15.8 billion，公司称 ARR 超过 $150
              million；Sacra 2026 年 5 月估计把 Sierra 推到大约 $200 million ARR，按使用哪个锚点不同，隐含大约 ~79x 到 <105x ARR。Parloa 2026 年 1 月
              Series D 估值 $3 billion、ARR 大约 $50 million 至 $52 million，隐含约 ~58x 至 ~60x ARR；PolyAI 2025 年 12 月一轮则被 Forbes
              描述为约 25x 倍数。放在这组私营公司里，Decagon 以 Sacra 的 2025 年末 $35 million 年化收入锚点计算，~$4.5 billion 估值隐含约
              ~129x——高于这里保留的每一个同业锚点。公开市场校验更严苛。Yahoo 2026 年 6 月快照显示，Salesforce 为 4.56x 销售额、NICE 为 2.06x、Five9 为
              1.95x；Multiples.vc 2026 年 5 月公开软件篮子里，大多数软件板块大致在 2x 至 4x 收入区间。这些不能和私营 ARR 估值完全类比，但足以说明，Decagon
              的价格有很大一部分压在稀缺性和未来执行上，而不是已披露的当前基本面上。
