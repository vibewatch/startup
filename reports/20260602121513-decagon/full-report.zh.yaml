  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户组合与部署宽度
        blocks:
          - type: paragraph
            body: >-
              Decagon 的公开客户基础看起来不只是少数 SaaS logo，但最好仍把它理解为一组服务大规模终端客户群的企业品牌，而不是一份已披露的付费账户名单。 Decagon 官方页面现在用 Avis Budget
              Group、Chime、Oura Health、1-800-FLOWERS.COM、Hunter Douglas 锚定组合， 后续融资公告又加入 Block 和 Deutsche
              Telekom；客户故事则更深入展示 Duolingo English Test、Notion、Rippling、ClassPass、Chime 和 Mercado Libre。
              这形成了覆盖旅行与出行、金融科技、教育与测试、生产力 SaaS、HR/IT/财务软件、健康与健身、市场型电商、电信和礼品的可见版图。 买家模式也一致：企业品牌似乎是付款方，CX 或支持 /
              产品运营团队是操作者，直接受益者是品牌自己的终端客户或会员。 公开证明还跨越多个渠道和地区。Chime 展示在线聊天和语音，ClassPass 展示聊天加邮件加坐席辅助，Mercado Libre 把证明扩展到
              Latin America 的葡萄牙语语音， Deutsche Telekom 则增加了一个欧洲电信试点。当前最强增长代理不是已披露总客户数，而是 Decagon 2026 年 1 月声明： 2025 年新增超过
              100 家全球企业客户；第三方报道也称公司客户基础增长超过四倍，并通过已部署账户服务数千万终端用户。
