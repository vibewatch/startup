  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 当前估值锚点与披露缺口
        blocks:
          - type: paragraph
            body: >-
              相比运营分母，Decagon 现在有了清晰得多的价格锚点。对一家私营公司来说，估值侧的佐证异常充分：公司 2026 年 1 月的 Series D 公告、公司分发的 Business Wire
              新闻稿，以及多篇独立报道，都把最新融资定在 $250 million、估值 $4.5 billion；2026 年 3 月的要约收购也按同一估值成交，并让 300 多名员工获得流动性。更难的是分母。Sacra
              估计，Decagon 在 2024 年底为 $10 million，之后到 2025 年 10 月达到 $35 million 年化收入；但 Forbes 称公司 2025 年收入大约 $12
              million。这些锚点方向上有用，但无法干净对齐，而且两家来源都没有给出当前 2026
              年毛利率、留存或集中度数据。因此，公开证据支持一个强结论：标题估值很清楚；也支持一个弱结论：底层单位经济性仍不清楚。这个组合重要，因为一家公司可以既真实、增长又快，同时对新钱来说仍然比上一轮价格太贵。
