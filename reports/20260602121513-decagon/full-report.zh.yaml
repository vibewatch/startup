  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 既有厂商捆绑、定价压力和实施拖累，是主要商业风险组合
        blocks:
          - type: paragraph
            body: >-
              Decagon 销售进入的品类中，最强对手并不需要只靠原始模型质量取胜。Salesforce 正在把 Agentforce Service 包装为一个工作空间里的 AI、渠道和 CRM， Zendesk 和
              Intercom 也同样把 AI 智能体直接推入许多买家已经使用的 helpdesk 和服务工作流。这点重要，因为买家的替代方案往往不是「Decagon 对没有自动化」； 而是「Decagon
              对在现有套件续约中激活更多自动化」。公开定价页面强化了这个危险。Intercom 已经在宣传基于结果的定价， Salesforce 可以把服务包进更广的 CRM 捆绑，Zendesk
              仍给采购一个熟悉的座席定价框架。这些结构创造了激进折扣空间， 同时无需客户重建服务技术栈。


              该品类还带有大型软件既有厂商在自身文件中披露的同类企业摩擦。Salesforce 2026 10-K 明确警告， 更大的企业销售可能涉及漫长且昂贵的周期、定价压力、实施和配置挑战。Decagon
              自己的产品和测试页面也从另一个角度支持同样结论： 产品不是轻量宏工具，而是横跨集成、决策逻辑、全渠道表面和持续 QA 的工作流与评估层。这种深度可以成为护城河，
              但也意味着部署是运营项目，不是简单功能开关。公开记录支持牵引力和可识别 logo，但不支持头部客户占比、续约时间或净留存。 在 $4.5 billion 价格下，缺失的集中度细节让商业风险仍然明显偏高。
