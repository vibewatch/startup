  headquarters: San Francisco, California, United States
  productSummary: Decagon 的平台把 Agent Operating Procedures、集成、测试、模拟、可观测性和护栏组合起来，让企业部署并持续改进 AI 智能体， 端到端解决支持问题，而不只是回答 FAQ。
  customerFocus: 客户运营量大的大型企业和规模化数字品牌，覆盖金融科技、旅行、电信、软件、教育、零售及相邻行业。
  businessModel: 通过协商式部署销售企业软件，采用基于用量的定价，主要按对话计费，部分场景按成功解决计费。
