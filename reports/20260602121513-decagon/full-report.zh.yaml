  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：哪些支出算入范围，哪些不算
        blocks:
          - type: paragraph
            body: >-
              不应把 Decagon 放进泛化的「AI chatbot」桶里。公司自己的产品、集成、测试和行业页面描述的是更广的企业服务运营层： 跨语音、聊天和邮件的全渠道解决；通过 Agent Operating
              Procedures 做工作流编排；向 CRM、helpdesk、电话和知识系统实时发起动作；
              以及持续测试、可观测性和分析。这意味着，纳入范围的支出是服务自动化与编排的软件预算，不是客户支持总成本，也不是整个联络中心软件栈。 Fortune 的联络中心软件类别包含
              IVR、通话录音、CTI、劳动力优化和服务等传统模块，适合作为外边界，但并不精确贴合 Decagon。 同时，真正的替代品宽泛且务实：既有 CCaaS 或 CRM
              厂商加入智能体功能，企业内部自建，以及外包或保留人工劳动。 因此，品类边界必须由待完成的任务来定义——自动化、可信、企业级客户问题解决——而不是由最宽泛的公开 TAM 标题来定义。
