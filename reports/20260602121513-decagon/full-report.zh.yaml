      - number: '5.4'
        title: 实施模式、外部依赖与可靠性姿态
        blocks:
          - type: paragraph
            body: >-
              Decagon 有意把上手故事包装得比传统机器人搭建更快、代码更少，但公开证据显示，企业部署仍是引导式，而非纯自助。 营销页面承诺数周内上线生产智能体，甚至数天内完成核心基础设施；Simulations
              则明确引导现有客户联系 Agent Product Manager， 获取导览和推荐测试用例。这与 Rippling 的描述吻合：定制 API 工作流、75-plus 路由标签，以及与 Decagon
              工程师紧密协作。 因此，业务团队可以配置产品，但若没有跨职能完成数据访问、政策、升级设计和测试，部署显然并不轻松。技术栈也依赖真实外部生态。 OpenAI、Claude、Azure 托管模型、Google
              Cloud 服务、电话和 SIP 基础设施、身份提供商和 DLP 工具都出现在公开材料中； 多提供商带来韧性，也在模型经济性、服务质量、权限或采购约束变化时制造集中风险。Decagon
              安全页面宣传冗余、故障切换和正常运行时间控制， 但公开材料仍未给出保守买家在尽调中很可能追问的完整 SLA、事故历史或模型路由细节。
