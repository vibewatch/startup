  - id: TR005
    title: 缓释与放弃标准表
    columns:
      - 风险
      - 可监控触发信号
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 现有厂商打包与价格压力
        - 相对套件厂商的赢单率恶化或折扣加深
        - 连续两个季度被迫给出高于既往水平的折扣，或反复在重点大客户上输给打包替代方案
        - 重新评估护城河、CAC 效率和终局利润率假设。
      - - 质量或合规事件
        - 自动化客服引发、经核实的客户责任、欺诈或监管相关事件
        - 单一重大事件，只要造成抵扣、拒付、监管通知或公众信任受损
        - 暂停增长承销，直到根因、遏制措施和政策控制经过独立复核。
