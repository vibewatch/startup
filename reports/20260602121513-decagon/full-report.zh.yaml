        - 说明市场份额竞争既是预算份额竞争，也是品类创造
    notes: 边界行有意把广义软件类别与更窄的 AI 原生切入口分开；列出排除支出，是为了避免把人工、服务和无关 CRM 模块当成 Decagon 的收入机会。
