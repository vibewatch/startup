  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图与入围名单动态
        blocks:
          - type: paragraph
            body: >-
              Decagon 所处市场拥挤，但买家的入围名单边界清楚：AI 原生自动化厂商、既有支持套件和内部自建替代方案。 公司进入 2026 年时势头可信，公开报道指向 2025 年新增超过 100 家企业客户和
              $4.5B 估值； 但同一报道也把真正的基准集合定义为 Salesforce、Intercom 和 Zendesk，而不只是更小的初创同行。这点重要， 因为买家很少孤立地选择一个模型厂商；真正选择是把支持留在现有
              helpdesk 或 CRM 里，购买 AI 原生工作流层， 还是基于云和基础模型基础设施拼一个方案。PitchBook 的展望强化了这一点：AI 客户服务是大型、近期可商业化的品类，
              这解释了为什么既有厂商、AI 原生挑战者和超大规模云厂商替代方案会同时活跃。Decagon 的公开赢单证据显示，
              它能替换传统系统，甚至打赢部分内部自建路径，但这并未消除那些已经掌握客户数据、路由和操作员工作流的平台的结构性优势。
