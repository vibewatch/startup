      - number: '5.2'
        title: 评估、可观测性与控制系统
        blocks:
          - type: paragraph
            body: >-
              Decagon 公开技术栈中最差异化的部分，是围绕智能体行为包裹的大量控制平面工具。Testing & QA 覆盖单元测试、集成检查、评估理由、定时运行和大规模模拟； Simulations
              又在此基础上，从历史失败生成模拟人物，并用口音、打断和情绪语气等语音条件做压力测试。变更上线后， Experiments 加入带控制组、p 值阈值和回滚控制的真实生产 A/B 测试；Watchtower
              把自然语言 QA 标准应用到每一段对话， 让团队不用手工抽样转录文本，也能标记合规问题、情绪问题或产品信号。Agent Workbench 随后闭环，把日志、推理轨迹、延迟事件和工具错误转成白话调试指引。
              合起来看，Decagon 销售的不只是智能体部署，也是一套随时间测试、追踪、评分和改进智能体的结构化方法。公开材料对这些工作流主张很强， 但相比功能可用性，对精确基准方法披露仍较轻。
