  - id: TV005
    title: 投资逻辑破裂与否决触发因素表
    columns:
      - 触发因素
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 当前 ARR 仍接近公开锚点
        - 数据室显示 ARR 仍大致围绕 2025 年末约 $35M 的公开锚点
        - 当前估值即便按 120x ARR 框架也偏高，下行区间会迅速打开
        - 不按当前名义估值投资
      - - 毛利率和推理经济性令人失望
        - 毛利率结构性偏弱，或推理 / 支持成本侵蚀经营杠杆
        - 公司不再像高溢价软件倍数候选
        - 用更低倍数和更慢现金生成预期重算估值
      - - 客户集中度高
        - 少数客户标识或单一行业贡献了过高比例的 ARR
        - 稀缺性溢价更难持续，续约风险更重要
        - 下调基准情景倍数，并扩大下行区间
      - - 私人 AI 融资降温，或公开软件再次降估值
        - 私人 AI-CX 轮次降价，或公开软件倍数从当前 2x-5x 区间继续压缩
        - 即使 Decagon 经营执行到位，外部倍数桥也会收窄
        - 要求更好条款，或推迟入场
      - - 优先股堆叠对投资人不友好
        - 清算权、ratchet，或要约 / 老股交易经济性扭曲真实入场经济性
        - 名义估值不再代表可投资价值
        - 除非结构或价格改善，否则暂停
    notes: 这些是估值否决触发因素，不是泛泛的经营风险；每一项都会直接改变新投资人愿意支付的价格。
    claimRefs:
      - CV029
      - CV030
      - CV035
      - CV036
      - CV037
      - CV038
      - CV045
      - CV046
  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 当前 ARR / 收入桥
        - 经董事会批准的当前 ARR、确认收入，以及从 2025 年末到 2026 年的队列桥
        - 如果当前分母明显高于或低于过时的公开锚点，几乎所有估值结论都会改变
        - CFO 数据室、董事会材料和审计支持
      - - 毛利率和推理成本负荷
        - 按产品 / 渠道拆分的毛利率，以及实际推理 + 支持成本瀑布
        - 只有软件经济性能顶住模型和服务成本时，高溢价 AI 倍数才成立
        - 财务尽调加基础设施审查
      - - NRR 和扩张质量
        - 按客户队列拆分的净留存、客户标识留存和使用量扩张
        - 高溢价情景假设企业扩张可持续，而不是一次性试点
        - 收入运营和队列分析
      - - 客户集中度
        - 头部客户、头部垂直行业和地域集中度明细
        - 当前公开客户标识清单证明的是名字广度，不是收入多元化
        - 销售运营明细和客户集中度备忘录
      - - 股权结构表和优先条款
        - 清算优先权、ratchet、MFN 条款，以及要约 / 老股项目经济性
        - 如果下行保护或老股机制对投资人异常不友好，名义估值可能误导
        - 法律顾问审阅融资文件和股权摘要
    notes: 这些要求刻意聚焦承销，瞄准最能快速改变建议的缺失证据。
    claimRefs:
      - CV006
      - CV029
      - CV030
      - CV045
