chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品模式与可见规模
        blocks:
          - type: paragraph
            body: >-
              Decagon 的公开身份已经足够清楚，后续章节不必重新猜测。公司把自己定位为一家位于 San Francisco 的私有 AI 公司， 专注客户体验，而不是通用基础模型实验室。当前定位是面向每位客户的「AI
              concierge」：软件帮助企业在语音、聊天、邮件、短信及相邻渠道部署智能体， 再用 Agent Operating Procedures
              把自然语言指令编译成代码，持续打磨这些智能体。主页、产品页和融资公告都反复使用这套产品叙事； 这点重要，因为 Decagon
              卖的是工作流自动化加运营控制，不只是炫目的机器人外壳。公开规模证据真实但不均衡。官方页面称服务了 10M+ 客户、 平均转人工规避率 80%、支持运营成本降低 65%、智能体质量分 93%；客户证明页面还给出
              Chime 聊天和语音解决率 70%、 Rippling 转人工规避提升 32% 等例子。这些数字可以作为部署信号，但仍是公司筛选后的指标，不是经过审计的公司级经济性。
              因此，后续章节的复用规则应是：信任身份和产品描述，方向性使用客户 logo 和运营指标，避免把公开部署结果推导成缺乏支撑的 Decagon 自身收入质量结论。
