      - number: '6.2'
        title: 具名客户证明、生产信号与买家背书质量
        blocks:
          - type: paragraph
            body: >-
              把 Decagon 的客户牵引力视为超过 logo 收集，最好的理由是多个背书包含具体运营指标、具名操作者和上线后扩张证据。 Duolingo English Test
              从一家先前供应商迁移而来；该供应商只能拦截约 30% 邮件工单，一年后仍未上线在线聊天， 而 Decagon 部署一个月内上线，并报告 80% 聊天转人工规避。该案例研究还具名引用 Senior
              Operations Manager Ian Riggins， 并提到计划扩展到邮件。Rippling 的背书质量同样强：具名支持运营负责人描述，聊天自助率从 38% 提升到超过 50%，启用 AI
              邮件转人工规避， 并在 12-plus 产品中构建 75-plus 路由标签，带来即时 7% 路由改善。Notion 是强执行赞助人背书， Global Head of Customer Experience
              Emma Auscher 把 Decagon 定位为战略 CX 平台，并报告工单解决速度最高提升 34%，请求人工比例仅 3.4%。 Chime 是单个最强、经交叉印证的部署，因为其 Decagon
              案例研究后来又被 Chime 自己的 S-1 强化，后者独立报告大规模自动化、支持成本降低和支持满意度提升。 ClassPass 和 Mercado Libre 进一步扩展证明集：ClassPass 展示基于
              RFP 的竞争性选择和多渠道扩张，Mercado Libre 展示真实世界迭代、葡萄牙语 QA 调优和受监管环境护栏。 证据较弱的一端是，Avis Budget Group、Hertz 和 Deutsche
              Telekom 等部分头部名称的公开范围披露仍薄于六个旗舰案例研究， 因此它们更支持宽度，而不是精确收入归因或组合权重结论。
