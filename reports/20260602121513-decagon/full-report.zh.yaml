      - number: '8.4'
        title: 尽调、退出准备度与投资逻辑破裂点
        blocks:
          - type: paragraph
            body: >-
              公开证据支持继续尽调，而不是盲目接受标题估值。第一项要求是当前 ARR 与确认收入的桥接，因为如果 Decagon 已经显著高于 2025
              年末公开锚点，几乎所有估值结论都会改变。第二项是经济性质量：毛利率、推理与支持成本负担，以及留存或用量扩张是否足够强，能让增长更持久。第三项是 logo
              幻灯片掩盖的暴露：按客户、行业和地域划分的集中度，因为高端私营倍数假设的是广度，而不是少数超大账户。第四项是股权结构现实：优先权、清算权，以及任何二级交易或要约相关经济条款，是否让标题估值看起来比实际更可投。这些尽调要求也决定退出准备度。仅凭公开证据，另一轮私募、结构化二级交易或战略选择，比短期
              IPO 更容易支撑，因为记录仍偏公告密集，而不是申报级。若当前 ARR 仍接近公开锚点、单位经济性弱于同业估值暗示，或集中度和优先权条款暴露出标题估值掩盖的下行，投资逻辑应迅速破裂。
