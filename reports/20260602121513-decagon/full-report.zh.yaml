        title: 定价、切换成本与替代压力
        blocks:
          - type: paragraph
            body: >-
              公开定价证据仍不对称。Intercom 和 Salesforce 展示了标价和用量结构，Zendesk 即便企业报价仍需协商，也披露了座席加附加项机制， AWS Q Business
              则为内部实验发布了很低的起步价。Decagon、Sierra、Observe.AI、Cognigy 和 Kore.ai 在检索到的公开材料中仍更不透明，
              这使尽调从标价转向部署总成本和运营变更成本。大多数切换成本正是由这种运营变更产生的。买家必须迁移工作流、知识、护栏和升级逻辑， 即便供应商能接入现有 helpdesk 或 CRM。对 Decagon
              有利的是，这也让分阶段采用成为可能：Intercom 明确可与任何 helpdesk 配合， Decagon
              自身定位和第三方报道也暗示，许多赢单先替换特定传统流程，然后企业才重接整个服务栈。内部自建替代方案主要对已经具备强云、数据和工程能力的组织可信， 因为低成本模型访问并不会消除组装治理、QA、遥测和支持运营的需求。
