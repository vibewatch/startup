    title: 可比估值表
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 相关性
      - 局限
    rows:
      - - Decagon
        - 2026 年 1 月 Series D + 2026 年 3 月要约，对比 Sacra 的 2025 年末 $35M 年化收入锚点
        - 按 $4.5B 估值和 $35M 年化收入计算，约 128.6x
        - 直接标的和当前价格锚点
        - 收入锚点来自 2025 年末，未经审计，且当前利润率 / NRR 不公开
      - - Sierra
        - 2026 年 5 月 Series E 估值，对比 >$150M ARR / 约 $200M ARR 估计
        - 按 $15.8B 估值计算，约 79x 至 <105x ARR
        - 最接近的大规模 AI 原生 CX 同行，具备最新 2026 年融资和 ARR 证据
        - ARR 仍是私营公司披露加分析师估计，不是经审计 GAAP 收入
      - - Parloa
        - 2026 年 1 月 Series D 估值，对比 >$50M ARR / $52M ARR 估计
        - 按 $3B 估值计算，约 58x-60x ARR
        - 相关的 AI-native CX 同行，披露了 ARR 和 NRR 信号
        - 规模较小，企业客户组合也不同于 Decagon
      - - PolyAI
        - 2025 年 12 月 Series D 估值和 Forbes 框架
        - Forbes 称，按新的 $750M 估值约为 25x 倍数
        - 有用的语音优先同行下限，说明高溢价倍数不必全部高于 50x
        - 公司更老，语音优先组合不同，保留下来的规模也更低
      - - Salesforce
        - 2026 年 4 月 Yahoo 市销率；FY26 官方收入
        - 4.56x 销售额；$171.66B 市值；FY26 收入 $41.5B
        - 经审计的高端 CRM / 智能体软件基准，利润率披露强
        - 规模大得多、业务更多元，且是成熟上市公司
      - - NICE
        - 2026 年 3 月 Yahoo 市销率和市值
        - 2.06x 销售额；$5.79B 市值
        - 与联络中心自动化相关的公开 CX 软件基准
        - 本章保留下来的当前收入和利润率细节，少于 Salesforce 或 Five9
      - - Five9
        - 2026 年 3 月 Yahoo 市销率；FY2025 官方收入
        - 1.95x 销售额；$2.01B 市值；2025 年收入 $1.149B
        - 公开 CCaaS 基准，披露利润率和 AI 转型风险
        - 增长更慢，上市公司属性降低直接可比性
    notes: 私募公司行使用 ARR 式框架，上市公司行使用销售额倍数，因此这张表是方向性的估值桥，不是严格的同口径排名。
