      - number: '5.3'
        title: 语音、记忆与主动互动
        blocks:
          - type: paragraph
            body: >-
              Decagon 的公开路线图也在越过被动聊天和邮件。语音现在包括实时响应处理、可定制语音画像、带摘要交接的人工升级、外呼活动， 以及尊重勿扰请求等偏好的资料更新。2026 年 3
              月的主动功能发布把用户记忆、外呼语音和 Agent Workbench 打包在一起，
              主张客户关系不应在每次互动后归零。用户记忆被描述为内置于智能体引擎，带着历史、偏好和信号跨会话、跨渠道延续，并通过治理控制决定哪些上下文被存储和使用。
              这比特定渠道支持机器人更有野心，因为它意味着同一系统应管理入站解决、出站跟进和跨渠道连续性。最强公开证明仍是特定客户，而不是整个组合： Chime 称每月超过一百万通电话中语音解决率接近 70%，Hertz 和
              Away 则被引用为主动触达和连续性用例。 这些是有用的部署信号，但应解读为具名账户例子，不是每个 Decagon 部署的公司级基准。
