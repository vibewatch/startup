      - number: '1.4'
        title: 里程碑、扩张路径与警示信号
        blocks:
          - type: paragraph
            body: >-
              里程碑记录显示，这家初创公司从隐身发布走向全球企业定位的速度异常快，但也暴露了后续尽调必须带着走的警示角度。正面时间线很清楚： 2023 年成立，2024 年 6 月发布并完成首批机构融资，2024 年 10 月
              Series B，2025 年 6 月 Series C， 2025 年 11 月与 Deutsche Telekom 试点并获得 T.Capital 战略投资，2026 年 1 月 Series D，2026
              年 3 月员工要约收购。 分销里程碑随后进一步扩展图景，包括 New York、London 和 Toronto 办公室扩张、上线 Google Cloud Marketplace， 以及 2026 年 5
              月入选 CNBC Disruptor 50。但公开证据仍留下重要盲区。TechCrunch 称，公司自 2024 年底披露八位数 ARR 信号后就未再披露收入； Sacra 只给出 2025 年 10
              月收入的外部估计。更重要的是，Sacra 的风险部分明确写出官方叙事自然会弱化的两个问题： 对第三方模型提供商的依赖，以及企业部署扩展到更多工作流后维持低幻觉率的挑战。Forbes 又补充第二个警示：
              Decagon 仍在与 Salesforce、Intercom、Zendesk 等规模大得多的既有厂商竞争。正确解读不是 Decagon 的势头虚假；
              而是相比持久经济性、精确人员规模或长期防御性，估值爬升和员工流动性事件更容易验证。
