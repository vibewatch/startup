        - 中位上线时间明显延长，或实施投入增长快于新增客户带来的 ARR
        - 将报告增长视为质量较低，并重新评估服务产能需求。
      - - 集中度与估值
        - 经济性尚未证明前，重点客户流失或增长减速
        - 可见的锚定客户流失，或增长放缓，打破最新估值中隐含的高速增长假设
        - 将立场转向估值倍数压缩和融资风险情景。
