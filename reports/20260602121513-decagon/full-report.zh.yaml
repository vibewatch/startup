      - number: '8.3'
        title: 情景区间与当前判断
        blocks:
          - type: paragraph
            body: >-
              情景分析应保持克制，因为最大摆动变量仍是当前 ARR。悲观情景下，Decagon 仍是合法的领先者，但 ARR 仍更接近公开的 2025 年末锚点；随着投资人要求证明毛利率和客户耐久性，私营 AI-CX
              倍数压缩，估值区间约为 $1.2 billion 至 $2.7 billion。基准情景假设 Decagon 已经进入大约 $50 million 至 $60 million
              ARR，并且因为企业需求真实、同业融资热度仍强，仍能拿到 70x 至 90x 倍数；这对应约 $3.5 billion 至 $5.4 billion，使当前估值只能勉强站住。乐观情景还需要更强条件：ARR 接近
              $70 million 至 $90 million，尽管有推理成本仍具备一流毛利率，并且集中度韧性足以让投资人继续支付 80x 至 100x。对应区间约 $5.6 billion 至 $9.0
              billion。因此，基于公开数据的结论是继续研究，置信度中等、风险高、估值立场昂贵。问题不在于 Decagon 是否在做重要的东西，而在于公开记录是否证明了足够的当前规模和经济性，让人在没有数据室的情况下承保
