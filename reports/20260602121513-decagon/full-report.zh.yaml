    rows:
      - - Decagon
        - 直接 AI 原生平台
        - $250M Series D，估值 $4.5B；2025 年新增 100+ 企业客户
        - 正在跨渠道升级支持体系的大型企业
        - 基于 AOP 的工作流逻辑，叠合集成测试、监督和全渠道支持
        - 公开定价仍不透明，部署仍需要集成工作
      - - Intercom / Fin
        - 嵌入 AI 智能体的既有客服台
        - 成熟客服台厂商；350+ 集成；Fin 页面提到 60+ AI 团队成员
        - 已使用 Intercom，或希望在现有客服台上叠 AI 的团队
        - 原生集成 AI 智能体、同一客户记录、快速配置和强多渠道界面
        - 席位加结果定价可能叠高，检索到的信任细节比 Zendesk 更少
      - - Zendesk
        - 既有支持套件
        - 成熟 CX 厂商，拥有企业安全认证和装机基础
        - 已围绕工单工作流运转的中型市场和企业支持团队
        - 面向多步工作流的 AI 智能体，且明示信任和治理细节
        - 高级功能仍要通过附加模块和用量组件叠加
      - - Salesforce Service Cloud / Agentforce
        - 既有 CRM 和服务平台
        - 大企业 CRM 分发，叠加 Slack 和 Data 360 邻接能力
        - 客户数据和服务运营已标准化在 Salesforce 上的企业
        - 分发强、内置 AI、工作流编排和交叉销售杠杆
        - 检索样本中标价复杂度最高，平台占用更重
      - - Sierra
        - 直接 AI 原生同业
        - 知名创业同业；产品页面强调企业部署，但不公开定价
        - 寻求高度定制客户体验智能体的企业品牌
        - 用自然语言搭建、多渠道范围、多变量测试和强可观测性叙事
        - 检索材料未披露具体信任工件和定价
      - - Observe.AI
        - 联络中心相邻直接同业
        - 专为 CX 打造的平台；声称一到两个月部署
        - 希望在一个平台上部署客户、前线和运营智能体的联络中心
        - 语音和聊天端到端执行，工作流受政策约束
        - 公开定价未知，审查页面中的认证细节是间接得出的
      - - Cognigy
        - 企业联络中心相邻直接同业
        - 1,250+ 品牌、100+ 语言、25K+ 并发交互、110+ 集成
        - 大型企业联络中心和重 CCaaS 环境
        - 联络中心专精度高，集成广度强
        - 定价不公开，信任细节除信任中心表层外不可见
      - - Kore.ai
        - 相邻平台和套件竞争者
        - 数百家企业和数百个预置智能体 / 模板
        - 覆盖客服和员工工作流的企业，尤其是受监管领域
        - 广泛智能体平台，带监管导向应用和 HIPAA 话术
        - 检索材料披露的支持专用定价和 CX 证明较少
      - - 基于 AWS/Google/OpenAI/Anthropic 自建
        - 现状 / 替代方案
        - 来自超大规模云厂商和基础模型厂商的低成本构件
        - 云、数据和工程能力强的企业
        - 能自己拼技术栈的团队拥有更多控制权和更低入门价格
        - 买方必须自己搭工作流逻辑、治理、测试和运营
    notes: 画像行把官方营销页面和独立报道合在一起。规模条目混合披露定价、融资或公开声称的部署规模；缺失的公开细节已明确标注。
