        blocks:
          - type: paragraph
            body: >-
              Decagon 的反向逻辑很直接：模型访问正在快速商品化，既有厂商已经在推出智能体产品，买家也越来越能混搭 helpdesk、CRM、云和基础模型层， 不必接受单一全栈供应商。CAIO
              的商品化框架把这点说得很明白：模型访问没有防御性，持久优势来自编码后的专业知识、工作流重构和结果仪表化。 这个框架实际上对 Decagon 有帮助，因为它最具体的公开差异化，正是通过
              AOP、测试和监督映射到这些更高层。尽管如此，公司并未摆脱分销劣势。 Intercom、Zendesk 和 Salesforce 可以把 AI 卖进已经信任它们处理路由、数据和操作员工作流的装机基础，
              而超大规模云厂商和基础模型厂商会降低成熟工程团队自建与购买之间的门槛。因此，承销结论应保持平衡： Decagon
