companyProfile:
  summary: >-
    Decagon 是一家 2023 年成立的私有企业软件公司，由 Jesse Zhang 和 Ashwin Sreenivas 领导。公司销售 AI 原生客户体验智能体，
    能处理聊天、邮件、语音、短信和主动触达中的复杂支持工作流，并接入工单、CRM、身份、支付等后端系统。公开证据显示， Decagon 从种子轮和 Series A 一路融资到 2026 年 1 月以 $4.5 billion 估值完成
    Series D， 又在 2026 年 3 月以同一估值做了要约收购；但相比客户 logo 和融资势头，公开记录对当前 ARR、利润率、留存和集中度的披露薄得多。
  founders:
    - name: Jesse Zhang
      role: 联合创始人兼 CEO
      background: 曾创办 Lowkey；Lowkey 于 2021 年被 Niantic 收购。
      claimRefs:
        - CO003
        - CO044
    - name: Ashwin Sreenivas
      role: 联合创始人兼 President
      background: 曾创办 Helia，后被 Scale AI 收购。
