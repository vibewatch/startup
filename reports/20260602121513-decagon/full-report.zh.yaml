        - 供应商中断导致客户 SLA 重大下降超过 24 小时，或重新定价压缩利润率且公司没有抵消性的定价权
        - 要求证明备用路由、供应商替换和商业重谈筹码。
      - - 监管负担
        - EU 或受监管客户采购因证据缺口而停滞
        - Decagon 因无法提供所需日志、监督证据或隐私 / 合规文档而反复延期
        - 下调 EU 和受监管垂直行业扩张预期，并重新审视销售效率假设。
