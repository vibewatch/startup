      - number: '6.3'
        title: 耐久性、扩张代理与客户质量风险
        blocks:
          - type: paragraph
            body: >-
              公开证据支持有意义的落地后扩张动作，但还不足以有信心承销留存或集中度。扩张以几种形式出现： Duolingo 计划在聊天成功后加入邮件；Rippling 增加 AI
              邮件转人工规避，并在上线后继续改善转人工规避；ClassPass 从有限聊天时段扩展到 24/7 聊天、 聊天加邮件覆盖和大规模 Agent Assist 使用；Chime 在聊天和语音两端都选择
              Decagon；Hertz 已经是主动外呼背书； Deutsche Telekom 的试点明确跟踪解决时间、CSAT/NPS 和重复联系，并持续迭代。这些都是账户扩张和运营耐久性的正面代理。
              同样重要的是缺失项。所审阅的公开来源没有披露精确活跃客户数、NRR、GRR、流失、续约率、合同期限或头部客户收入集中度。 这个遗漏很关键，因为大多数可衡量结果来自 Decagon
              撰写的客户故事和融资公告，而不是独立客户采购记录或客户自写案例研究。 更广泛品类也需要谨慎：Gartner 称，到 2027 年，一半因 AI 削减客服人员的公司会重新招聘；The Register 引用研究称，
              许多 AI 客户沟通智能体在部署后被回滚；Klarna 公开后撤 AI-only 服务质量主张，也显示头部案例可以多快反转。 对 Decagon
              而言，客户章节支持真实采用和多渠道企业使用，但还不能得出整个组合已经黏性强、分散、或免疫于案例研究选择偏差的干净结论。
