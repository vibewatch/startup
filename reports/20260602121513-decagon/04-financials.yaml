    - type: private-evidence-only
      severity: material
      topic: cash-runway-gap
      missingEvidence: Current cash balance, monthly burn, and runway assumptions after the Series D close.
      whyItMatters: These numbers determine whether the $250M round is precautionary growth capital or a necessary bridge to the next financing event.
      diligencePath: Request the latest board-approved operating plan, monthly cash report, and 12-month cash burn schedule.
      relatedQuestionRefs: [QI019]
      relatedTableRefs: [TI004, TI005]
    - type: private-evidence-only
      severity: material
      topic: unit-economics-gap
      missingEvidence: Gross margin by channel, model-provider spend, CAC or payback, and NRR by customer cohort.
      whyItMatters: Without these inputs, Decagon's software quality and valuation multiple cannot be underwritten precisely.
      diligencePath: Request customer-cohort retention, margin bridge by channel, and sales-efficiency dashboard from management.
      relatedQuestionRefs: [QI020, QI021, QI022]
      relatedTableRefs: [TI003, TI005]
    - type: missing-source
      severity: material
      topic: pricing-gap
      missingEvidence: List pricing, discount bands, contract minimums, and realized net revenue per conversation or resolution.
      whyItMatters: Public ROI anecdotes do not reveal the actual take rate or whether price competition could compress unit economics.
      diligencePath: Review sample order forms, pricing approval matrices, and renewal contracts across large customers.
      relatedQuestionRefs: [QI010, QI011]
      relatedTableRefs: [TI001, TI002, TI005]
    - type: missing-source
      severity: minor
      topic: debt-gap
      missingEvidence: Any venture debt, revolving credit, cloud commitments, or vendor-financing liabilities that sit outside headline equity rounds.
      whyItMatters: Hidden obligations could reduce Decagon's effective liquidity even if equity capital appears abundant.
      diligencePath: Request debt schedule, cloud-spend commitments, and major vendor side letters from finance counsel.
      relatedQuestionRefs: [QI018]
      relatedTableRefs: [TI004, TI005]
    - type: access-blocked
      severity: minor
      topic: filing-gap
      missingEvidence: Filing-level company record or securities-notice corroboration for Decagon's corporate structure and any registered financing documents.
      whyItMatters: Filing checks are a useful backstop when private-company operating disclosures are sparse.
