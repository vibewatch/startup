chapter:
  number: 4
  title: Financials
  summary: >
    Decagon has disclosed an arithmetic $481 million of primary capital across Seed through Series D,
    followed by a $4.5 billion employee tender that improved liquidity but did not add operating cash.
    Public financial transparency still stops at 8-figure ARR language plus divergent third-party revenue
    estimates, so the company looks heavily financed and operationally expanding but still difficult to
    underwrite on margin, burn, or implied revenue multiple.
sections:
  - id: funding-history-and-valuation
    title: Funding history and valuation step-up
    body: >
      Decagon's financing history is unusually compressed even by AI-infrastructure standards. The company
      disclosed a $5 million seed and $30 million Series A when it emerged from stealth in June 2024, then
      added a $65 million Series B in October 2024, a $131 million Series C at a $1.5 billion valuation in
      June 2025, and a $250 million Series D at a $4.5 billion valuation in January 2026. Arithmetic on the
      named primary rounds yields about $481 million of operating capital raised. That arithmetic matters,
      because later coverage sometimes rounds the total to "over $500 million," while the employee tender in
      March 2026 should be treated as secondary liquidity for staff rather than fresh cash for the company.
      The key underwriting takeaway is not lack of access to capital; it is that valuation step-ups from the
      implied ~$650 million Series B level to $1.5 billion and then $4.5 billion happened faster than the
      company expanded public financial disclosure, leaving investors dependent on private growth data.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI005
      - CI006
      - CI007
      - CI008
      - CI009
      - CI010
      - CI011
      - CI039
      - CI040
    figureRefs:
      - FI003
  - id: revenue-model-and-traction
    title: Revenue model, pricing logic, and traction proxies
    body: >
      The public monetization story is coherent even though realized pricing is opaque. Decagon says AI
      agents are priced against work performed rather than seats, and its pricing essay describes two models:
      per-conversation pricing and a higher-priced per-resolution model that only bills when the AI fully
      resolves the issue. The same post says most customers gravitate to per-conversation pricing, which likely
      makes budgeting easier and produces steadier recurring revenue so long as conversation volume holds.
      Public traction signals are strong enough to support demand but not strong enough to fully value the
      company. Official materials cite 10 million-plus end users served, average deflection around 80%, major
      cost savings, and more than 100 new enterprise customers in 2025. Customer examples such as Bilt,
      Hunter Douglas, Duolingo, Oura, and ClassPass suggest the product can save money and occasionally drive
      revenue, but Decagon still does not publish list pricing, discount bands, contract minimums, or a clean
      GAAP-revenue-to-ARR bridge.
    claimRefs:
      - CI012
      - CI013
      - CI014
      - CI015
      - CI016
