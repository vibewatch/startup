  - id: cost-proxies-and-capital-adequacy
    title: Cost proxies, unit economics, and capital adequacy
    body: >
      Decagon likely remains asset-light relative to hardware or regulated infrastructure businesses, but that
      does not make it cheap to scale. By early 2026 the company had offices in San Francisco, New York City,
      and London, had expanded its headquarters footprint in San Francisco, and had a public workforce profile
      that skewed toward technical and go-to-market roles. Tender coverage implying more than 300 eligible
      employees suggests the true labor base is materially larger than public directory snapshots. At the same
      time, product expansion into voice, SMS, proactive outreach, and large-enterprise deployments should lift
      model-inference, implementation, support, and compliance costs. The result is a company with ample equity
      capital but unclear cash efficiency. Public sources describe how round proceeds will fund growth, yet none
      disclose cash on hand, monthly burn, runway, gross margin, CAC, NRR, or any debt obligations. That makes
      the latest raise look more like growth optionality and competitive positioning than proof that Decagon is
      close to self-funding.
    claimRefs:
      - CI028
      - CI029
      - CI030
      - CI031
      - CI032
      - CI033
      - CI034
      - CI035
      - CI036
      - CI037
      - CI038
      - CI044
      - CI045
