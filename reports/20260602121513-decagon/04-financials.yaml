callouts:
  - calloutType: strength
    title: Decagon has ample equity support for near-term expansion
    body: >
      Even excluding the tender, disclosed primary rounds total about $481 million. That gives Decagon a far
      larger capital buffer than most private application-software peers and should let it keep investing in
      product, GTM, and international footprint while the market is still forming.
    claimRefs:
      - CI009
      - CI032
      - CI044
  - calloutType: risk
    title: Valuation acceleration outruns public financial transparency
    body: >
      The move from an implied ~$650 million Series B level to $4.5 billion in roughly fifteen months would be
      easier to underwrite if Decagon published current revenue, margins, and burn. Instead, outside readers are
      left with ROI anecdotes and non-comparable third-party estimates.
    claimRefs:
      - CI017
      - CI039
      - CI040
      - CI044
  - calloutType: insight
    title: Treat the March 2026 tender as liquidity, not fresh cash
    body: >
      The employee tender matters strategically because it supports retention in a tight AI talent market, but
      it should not be added to the company's primary financing total when assessing runway.
    claimRefs:
      - CI010
      - CI011
