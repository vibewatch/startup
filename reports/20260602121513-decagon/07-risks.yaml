    {
      "id": "mitigations-kill-criteria",
      "title": "Mitigations are real, but the investment case still needs explicit kill criteria and private diligence",
      "body": "The right risk posture on Decagon is conditional rather than dismissive. The company is not ignoring trust and reliability: it has invested early in testing, guardrails, Watchtower-style monitoring, and enterprise security controls, and the public product surface suggests deeper workflow encoding than many AI support peers. Those factors are why the key residual risks are not generic 'AI might hallucinate' concerns; they are more specific questions about whether Decagon can preserve quality while scaling into larger, more regulated, and more price-sensitive accounts faster than bundled incumbents.\n\nThat makes trigger-based underwriting more useful than a single spreadsheet forecast. A thesis-break scenario would include persistent discounting against suite vendors, slower go-lives or rising implementation effort, a material customer-liability or fraud event caused by automated support, or a vendor outage or repricing shock that visibly degrades service economics. EU compliance friction should also be monitored as a commercial variable, not just a legal footnote, because missing documentation or incident evidence can slow enterprise buying even before any regulator acts. Public sources are strong enough to frame those triggers, but not to close them. Before underwriting downside with confidence, an investor should demand contract packs, vendor terms, independent quality metrics, and customer-level concentration data. Until then, Decagon looks investable only with a clear view of what would cause fast de-risking or fast disqualification.",
