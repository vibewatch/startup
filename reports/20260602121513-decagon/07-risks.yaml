    "number": 7,
    "title": "Risks",
    "summary": "Decagon's highest residual risks are commercial compression from incumbent bundles, quality and compliance failures in high-stakes support workflows, and structural dependence on external model and cloud vendors. Public mitigations are materially stronger than those of many young AI companies, but disclosure remains thin on customer concentration, implementation intensity, contract allocation, and vendor economics, so downside should be underwritten with trigger-based kill criteria rather than point estimates."
  },
  "sections": [
    {
      "id": "commercial-pressure",
      "title": "Incumbent bundling, pricing pressure, and implementation drag are the main commercial risk stack",
      "body": "Decagon is selling into a category where the strongest rivals do not need to win on raw model quality alone. Salesforce is pitching Agentforce Service as AI, channels, and CRM in one workspace, while Zendesk and Intercom are likewise pushing AI agents directly inside the helpdesk and service workflows many buyers already use. That matters because the buyer's alternative is often not 'Decagon versus no automation'; it is 'Decagon versus activating more automation inside an existing suite renewal.' Public pricing pages reinforce the danger. Intercom is already advertising outcome-based pricing, Salesforce can wrap service into a broader CRM bundle, and Zendesk still gives procurement a familiar seat-based frame. Those structures create room for aggressive discounting without asking customers to re-platform their service stack.\n\nThe category also carries the same enterprise-friction dynamics that large software incumbents disclose in their own filings. Salesforce's 2026 10-K explicitly warns that larger enterprise sales can involve long and expensive cycles, pricing pressure, and implementation and configuration challenges. Decagon's own product and testing pages support the same conclusion from a different angle: the product is not a lightweight macro tool, but a workflow and evaluation layer spanning integrations, decision logic, omnichannel surfaces, and continuous QA. That depth can be a moat, but it also means deployments are operational projects, not simple feature toggles. The public record supports traction and recognizable logos, but not top-customer share, renewal timing, or net retention. At a $4.5 billion price, that missing concentration detail keeps commercial risk meaningfully elevated.",
