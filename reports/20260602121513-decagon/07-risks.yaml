    {
      "id": "external-dependencies",
      "title": "External model and cloud dependence compresses control over uptime, economics, and product direction",
      "body": "Public evidence makes clear that Decagon is not vertically integrated at the model layer. OpenAI's own case study says Decagon routes different parts of the support pipeline to several OpenAI models, Decagon maintains explicit OpenAI and Anthropic partnership pages, and Sacra says the stack blends OpenAI, Anthropic, Cohere, and proprietary fine-tuning. Multi-model routing is a mitigation because it reduces single-provider dependency, but it is not independence. The same suppliers still control availability, deprecations, pricing, roadmap priorities, and in some cases their own moves into customer-support applications.\n\nThe operational side of that dependence is visible in official status pages. OpenAI and Claude both publish uptime and incident histories, while Google Cloud separately publishes service-health and security incident surfaces. Decagon's public materials point to redundancy and multi-region design, but they do not disclose committed spend, termination rights, substitution timing, or how much quality drops when traffic is re-routed off a preferred model. That matters because model and cloud risk does not stay isolated in infrastructure. If an upstream vendor degrades, reprices, or competes more directly, the damage can flow into service quality, gross margin, deployment confidence, and customer trust at the same time. For a young company selling mission-critical customer support, that is a structural dependency risk, not a transient procurement issue.",
