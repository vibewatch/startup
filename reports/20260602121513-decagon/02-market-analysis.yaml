      "id": "sizing-lenses-and-limitations",
      "title": "Sizing lenses: large market, but no single precise TAM",
      "body": "The evidence supports a large and growing market, but not a single precise TAM for Decagon. The broadest outer lens comes from Fortune’s contact-center-software market, which reaches USD 77.82 billion in 2026 and includes many modules that Decagon does not sell directly. A narrower automation lens comes from Fortune’s call-center-AI estimate of USD 2.98 billion in 2026. MarketsandMarkets adds a different but still broader lens: AI for customer service at USD 12.06 billion in 2024 and USD 47.82 billion by 2030, which implies roughly USD 19.1 billion in 2026 if the stated CAGR is interpolated. Those figures are directionally useful precisely because they disagree on boundary. A separate bottom-up view shows why buyers care: the U.S. alone still supports about 2.8 million customer-service roles at roughly USD 120.5 billion of annual wage cost before benefits. That labor pool is not software TAM, but it is a credible economic problem that makes ROI legible. The right conclusion is that Decagon sits inside a meaningful multi-billion-dollar wedge, yet any attempt to present one clean global TAM as exact would overstate precision.",
