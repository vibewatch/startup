    "number": 2,
    "title": "Market Analysis",
    "summary": "Decagon is operating in a real and fast-growing enterprise-service software market, but the exact TAM depends on where the boundary is drawn: broad contact-center software is about USD 77.82 billion in 2026, a narrower AI-for-customer-service lens is roughly USD 19.1 billion on a CAGR-implied basis, and call-center AI is about USD 2.98 billion. Buyers span CX, support operations, product, and IT leadership; labor pressure, 24/7 expectations, multimodal quality, and agentic workflows drive demand, while trust, privacy, switching costs, and long enterprise cycles keep the obtainable market narrower than any one headline number suggests."
  },
  "sections": [
    {
      "id": "market-boundary-and-scope",
      "title": "Market boundary: what spend is in scope and what is not",
      "body": "Decagon should not be placed inside a generic “AI chatbot” bucket. The company’s own product, integration, testing, and industry pages describe a broader operating layer for enterprise service: omnichannel resolution across voice, chat, and email; workflow orchestration through Agent Operating Procedures; real-time actions into CRM, helpdesk, telephony, and knowledge systems; and ongoing testing, observability, and analytics. That means the in-scope spend is the software budget for service automation and orchestration, not the full cost of customer support and not the entire contact-center software stack. Fortune’s contact-center-software category includes legacy modules such as IVR, call recording, CTI, workforce optimization, and services, which makes it a useful outer boundary but not a precise fit for Decagon. At the same time, the real substitutes are broad and practical: incumbent CCaaS or CRM vendors adding agentic features, internal build efforts, and outsourced or retained human labor. The category boundary therefore has to be defined by the job to be done—automated, trusted, enterprise-grade customer resolution—not by the broadest published TAM headline.",
