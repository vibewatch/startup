  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: current-revenue-denominator
    missingEvidence: A board-approved bridge from late-2025 ARR or annualized revenue to current 2026 ARR and recognized revenue.
    whyItMatters: The retained public denominator spans from a Forbes estimate of roughly $12M of 2025 revenue to Sacra’s $35M late-2025 annualized revenue estimate, which changes the implied multiple dramatically.
    diligencePath: Request CFO data-room materials, board decks, and the latest revenue-recognition bridge.
    relatedQuestionRefs:
    - QV005
    relatedTableRefs:
    - TV004
    - TV006
  - type: private-evidence-only
    severity: material
    topic: concentration
    missingEvidence: Top-customer, top-sector, and geographic concentration schedules plus renewal behavior for the largest accounts.
    whyItMatters: Premium private AI-CX multiples assume durable breadth of demand; a narrow revenue base would widen downside quickly.
    diligencePath: Review customer concentration schedules, cohort tables, and sales-operations reporting.
    relatedQuestionRefs:
    - QV008
    - QV031
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Gross margin, inference cost load, support burden, and net retention by cohort.
    whyItMatters: Without margin and retention data, the chapter cannot complete a rule-of-40-style quality test or defend premium software-like multiples.
    diligencePath: Obtain product-level P&Ls, infrastructure-cost analysis, and cohort-retention reporting.
    relatedQuestionRefs:
    - QV009
    - QV010
    - QV031
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: cap-table-preferences
    missingEvidence: Preference stack, liquidation rights, ratchets, and economics of the March 2026 tender or other secondary activity.
    whyItMatters: Headline valuation can overstate investable economics if downside protection or secondary mechanics are unusually favorable to earlier holders.
    diligencePath: Have counsel review financing documents, the cap table, and tender terms before underwriting the round.
    relatedQuestionRefs:
    - QV027
    - QV031
    relatedTableRefs:
    - TV006
