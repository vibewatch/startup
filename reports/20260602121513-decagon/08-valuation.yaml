- id: scenario-range-and-current-call
  title: Scenario range and current call
  body: 'The scenario work should stay humble because the biggest swing variable is still current ARR. In the bear case, Decagon is still a legitimate leader, but ARR remains closer to the public late-2025 anchor and private AI-CX multiples compress as investors demand proof on margins and customer durability; that produces a roughly $1.2 billion to $2.7 billion range. The base case assumes Decagon has already moved into roughly $50 million to $60 million of ARR and can still command a 70x to 90x multiple because enterprise demand is real and peer appetite remains strong; that yields about $3.5 billion to $5.4 billion, which makes the current mark only barely supportable. The bull case needs something stronger still: ARR closer to $70 million to $90 million, best-in-class gross margins despite inference costs, and enough concentration resilience that investors keep paying 80x to 100x. That produces roughly $5.6 billion to $9.0 billion. The public-data call is therefore research-more with
    medium confidence, high risk, and an expensive valuation stance. The issue is not whether Decagon is building something important. It is whether the public record proves enough current scale and economics to underwrite $4.5 billion without a data room.'
