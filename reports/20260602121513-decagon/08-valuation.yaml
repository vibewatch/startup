  - CV030
  - CV035
  - CV036
  - CV037
  - CV038
  - CV045
  - CV046
- id: TV006
  title: Final diligence asks table
  columns:
  - topic
  - missing evidence
  - why it matters
  - owner or diligence path
  rows:
  - - Current ARR / revenue bridge
    - Board-approved current ARR, recognized revenue, and cohort bridge from late 2025 into 2026
    - Almost every valuation conclusion changes if the current denominator is meaningfully above or below the stale public anchor
    - CFO data room, board deck, and audit support
  - - Gross margin and inference-cost load
    - Gross margin by product / channel and the actual inference + support cost waterfall
    - Premium AI multiples only hold if software economics survive model and service costs
    - Finance diligence plus infrastructure review
  - - NRR and expansion quality
    - Net retention, logo retention, and usage expansion by customer cohort
    - The premium case assumes durable enterprise expansion, not one-time pilots
    - Revenue operations and cohort analysis
  - - Customer concentration
    - Top-customer, top-vertical, and geographic concentration schedules
    - The current public logo list proves breadth of names, not diversification of dollars
    - Sales ops schedule and customer concentration memo
  - - Cap table and preference terms
    - Liquidation preferences, ratchets, MFN clauses, and economics of the tender / secondary program
    - Headline valuation can mislead if downside protection or secondary mechanics are unusually investor-unfriendly
    - Counsel review of financing documents and equity summary
  notes: These asks are intentionally underwriting-specific; they target the missing evidence that would move the recommendation fastest.
  claimRefs:
