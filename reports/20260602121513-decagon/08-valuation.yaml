- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - argument
  - evidence today
  - what would change the view
  rows:
  - - 'THESIS: Enterprise demand is real'
    - Decagon added 100+ enterprise customers in 2025 and cites brands such as Avis, Deutsche Telekom, Oura, Block/Chime, and 1-800-Flowers.
    - Downgrade if the customer base proves concentrated in a few logos or if renewals / expansion are weak in the data room.
  - - 'THESIS: AI-native CX leaders can sustain private premiums'
    - Sierra, Parloa, and PolyAI all retained premium private valuation anchors through 2025-2026.
    - Improve only if Decagon’s current ARR and margins look closer to Sierra-class than to the stale public anchor.
  - - 'THESIS: Current ARR may already be above the public late-2025 anchor'
    - The company kept the $4.5B mark through both the Series D and the March tender, implying investors still saw upward operating momentum.
    - Upgrade if management can show current ARR materially above ~$50M-$75M with strong cohort quality.
  - - 'ANTI-THESIS: Multiple support is extreme'
    - Using Sacra’s $35M late-2025 annualized revenue anchor, Decagon screens at ~128.6x—above retained Sierra, Parloa, and PolyAI framing.
    - This risk eases only if current ARR has already moved well beyond the late-2025 public anchor.
  - - 'ANTI-THESIS: Public economics are opaque'
    - No retained public source discloses Decagon’s gross margin, operating margin, NRR, or customer concentration.
    - The view improves sharply if a data room shows software-like margins and durable net expansion.
  - - 'ANTI-THESIS: Public comparables are unforgiving'
    - Salesforce, NICE, Five9, and broader public software baskets still live in roughly 2x-5x sales territory.
    - The gap matters less if Decagon proves both much faster growth and unusually strong unit economics for an AI-native CX business.
  notes: 'The anti-thesis is mostly denominator and durability risk: the company can be high quality and still be too expensive for new money at the current mark.'
