- id: TV001
  title: Recommendation summary table
  columns:
  - dimension
  - assessment
  - rationale
  rows:
  - - Recommendation
    - research-more
    - Public evidence is strong on Decagon’s headline valuation but too thin on current ARR, margins, and concentration to underwrite the $4.5B mark cleanly.
  - - Confidence
    - medium
    - The valuation anchor is well corroborated, but the revenue denominator and economics quality are still materially under-disclosed.
  - - Risk rating
    - high
    - A premium private multiple is resting on stale or inconsistent public revenue anchors and no public margin stack.
  - - Valuation stance
    - expensive
    - Decagon screens above Sierra, Parloa, and PolyAI on retained private ARR anchors and far above public CX / CRM sales multiples.
  - - Decision implication
    - Stay engaged only through data-room diligence or materially better entry terms
    - The gating items are current ARR, gross margin, concentration, NRR, and preference terms—not another product testimonial.
  notes: 'This call is explicitly price-sensitive: stronger private evidence or a lower entry price would move the view more than incremental narrative momentum.'
