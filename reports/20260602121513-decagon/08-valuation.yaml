- id: TV004
  title: Comparable valuation table
  columns:
  - comparable
  - metric
  - multiple / valuation / status
  - relevance
  - limitation
  rows:
  - - Decagon
    - Jan 2026 Series D + Mar 2026 tender vs Sacra late-2025 $35M annualized revenue anchor
    - ~128.6x on $4.5B valuation and $35M annualized revenue
    - Direct subject and current price anchor
    - Revenue anchor is late-2025, not audited, and current margins / NRR are not public
  - - Sierra
    - May 2026 Series E valuation vs >$150M ARR / ~$200M ARR estimate
    - ~79x to <105x ARR on $15.8B valuation
    - Closest large-scale AI-native CX peer with fresh 2026 funding and ARR evidence
    - ARR is still private-company disclosure plus analyst estimate, not audited GAAP revenue
  - - Parloa
    - Jan 2026 Series D valuation vs >$50M ARR / $52M ARR estimate
    - ~58x-60x ARR on $3B valuation
    - Relevant AI-native CX peer with disclosed ARR and NRR signal
    - Smaller scale and enterprise mix differ from Decagon
  - - PolyAI
    - Dec 2025 Series D valuation and Forbes framing
    - ~25x multiple per Forbes on the new $750M mark
    - Useful lower-bound voice-first peer showing premium multiples need not all sit above 50x
    - Older company with a different voice-first mix and lower retained scale
  - - Salesforce
    - Apr 2026 Yahoo price/sales; FY26 official revenue
    - 4.56x sales; $171.66B market cap; FY26 revenue $41.5B
    - Audited upper-end CRM / agentic software benchmark with strong margin disclosure
    - Much larger, diversified, and public-company mature
  - - NICE
    - Mar 2026 Yahoo price/sales and market cap
    - 2.06x sales; $5.79B market cap
    - Public CX software benchmark relevant to contact-center automation
    - Retained current revenue and margin detail is thinner in this chapter than for Salesforce or Five9
  - - Five9
    - Mar 2026 Yahoo price/sales; FY2025 official revenue
    - 1.95x sales; $2.01B market cap; 2025 revenue $1.149B
    - Public CCaaS benchmark with disclosed margins and AI-transition risk
    - Slower growth and public-company profile reduce direct comparability
  notes: Private rows use ARR-style framing while public rows use sales multiples, so the table is a directional valuation bridge rather than a strict apples-to-apples ranking.
