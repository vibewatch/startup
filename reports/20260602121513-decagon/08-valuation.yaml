- id: peer-multiples-and-public-cross-checks
  title: Private AI-CX peers and public-market cross-checks
  body: The peer set shows why Decagon cannot be dismissed with a simple 'private AI bubble' headline, but it also shows why the current mark needs real diligence. Sierra’s May 2026 financing put it at $15.8 billion after the company said ARR topped $150 million; Sacra’s May 2026 estimate pushes Sierra to roughly $200 million ARR, implying something like ~79x to <105x ARR depending which anchor one uses. Parloa’s January 2026 Series D at $3 billion and roughly $50 million to $52 million ARR implies about ~58x to ~60x ARR, while PolyAI’s December 2025 round was framed by Forbes at roughly a 25x multiple. Against that private set, Decagon’s ~$4.5 billion mark on Sacra’s late-2025 $35 million annualized revenue anchor implies about ~129x — richer than every retained peer anchor here. The public check is harsher still. Yahoo’s June 2026 snapshots put Salesforce at 4.56x sales, NICE at 2.06x, and Five9 at 1.95x, while Multiples.vc’s May 2026 public software basket keeps most software sectors
    in roughly 2x to 4x revenue territory. These are not apples-to-apples with private ARR marks, but they do show how much of Decagon’s price rests on scarcity and future execution rather than disclosed current fundamentals.
