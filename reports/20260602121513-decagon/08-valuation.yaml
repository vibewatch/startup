- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - trigger
  - threshold
  - transmission to thesis
  - action implication
  rows:
  - - Current ARR is still near the public anchor
    - Data room shows ARR still roughly around the late-2025 ~$35M public anchor
    - The current mark remains above even a 120x ARR framing and the downside range opens quickly
    - Do not invest at the current headline valuation
  - - Gross margin and inference economics disappoint
    - Gross margin is structurally weak or inference / support costs erode operating leverage
    - The company stops looking like a premium software multiple candidate
    - Re-cut valuation on lower multiples and slower cash-generation expectations
  - - Customer concentration is high
    - A small number of logos or one sector drive a disproportionate share of ARR
    - The scarcity premium becomes less durable and renewal risk matters more
    - Lower the base-case multiple and widen downside
  - - Private AI funding cools or public software derates again
    - Private AI-CX rounds reprice lower or public software multiples compress further from the current 2x-5x zone
    - The external multiple bridge narrows even if Decagon executes operationally
    - Demand better terms or postpone entry
  - - Preference stack is investor-unfriendly
    - Liquidation rights, ratchets, or tender / secondary economics distort the real entry economics
    - Headline valuation stops representing investable value
    - Pause unless structure or price improves
  notes: These are valuation kill triggers, not generic operating risks; each one directly changes what a new investor should be willing to pay.
  claimRefs:
