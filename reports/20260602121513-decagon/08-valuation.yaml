company:
  name: Decagon
chapter:
  number: 8
  title: Valuation
  summary: Decagon’s January 2026 Series D and March 2026 tender fix the current valuation at $4.5 billion, but the best public revenue anchors remain late-2025 and inconsistent, leaving the company screening at roughly 129x ARR on Sacra’s $35 million annualized revenue estimate and even richer on Forbes’ lower revenue frame. AI-native customer-experience peers show that private investors will pay up—Sierra, Parloa, and PolyAI all retain real premium multiples—but Decagon still screens richer than the retained peer set and vastly above public CRM / CX software comparables. The public-data recommendation is therefore research-more with medium confidence, high risk, and an expensive valuation stance unless private diligence proves materially higher current ARR plus unusually strong margins and retention.
sections:
- id: current-valuation-anchor-and-disclosure-gap
  title: Current valuation anchor and disclosure gap
  body: 'Decagon now has a much clearer price anchor than operating denominator. The valuation side is unusually well corroborated for a private company: the company’s January 2026 Series D announcement, the company-distributed Business Wire release, and multiple independent writeups all pin the latest financing at $250 million and a $4.5 billion valuation, while the March 2026 tender offer cleared at the same mark and gave more than 300 employees liquidity. The harder part is the denominator. Sacra estimates Decagon reached $35 million of annualized revenue in October 2025 after being at $10 million at the end of 2024, but Forbes described the company as doing roughly $12 million of 2025 revenue. Those anchors are directionally useful, not cleanly reconcilable, and neither source supplies current 2026 gross margin, retention, or concentration data. Public evidence therefore supports a strong conclusion about the headline price and a weak conclusion about the underlying unit economics. That
    combination matters because a company can be both real and fast-growing while still being too expensive for new money at the last round mark.'
