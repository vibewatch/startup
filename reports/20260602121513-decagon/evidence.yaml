    relatedQuestionRefs:
      - QU021
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-proof
    missingEvidence: >-
      An exhaustive named-customer roster or more independent customer-authored references beyond Decagon's own
      case-study set.
    whyItMatters: >-
      The current enumeration is enough to show breadth, but not enough to prove that the public reference set is
      representative of the full customer book.
    diligencePath: >-
