    relatedQuestionRefs:
      - QU008
      - QU022
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: customer-concentration
    missingEvidence: Customer-by-customer revenue share, renewal timing, GRR/NRR, and any top-10 concentration schedule.
