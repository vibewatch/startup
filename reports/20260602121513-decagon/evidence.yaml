    diligencePath: >-
      Request blinded QA scorecards, customer incident logs, and any third-party assurance studies for financial,
      healthcare, or account-access workflows.
    relatedQuestionRefs:
      - QR010
      - QR026
  - type: private-evidence-only
    severity: minor
    topic: implementation-gap
    missingEvidence: >-
      Median deployment time, required solution-engineering hours, services attachment, and QA staffing ratios by
      customer segment.
    whyItMatters: >-
      These variables determine whether rapid top-line growth is high quality or purchased through labor-intensive
      implementation effort.
    diligencePath: Obtain an implementation funnel by segment with time-to-live, services hours, and post-launch support burden.
