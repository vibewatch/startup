    relatedQuestionRefs:
      - QR024
  - type: missing-source
    severity: material
    topic: quality-benchmark-gap
    missingEvidence: >-
      Independent benchmark data on error rates, policy violations, escalation rates, and false-authentication outcomes
      in regulated or high-stakes support flows.
    whyItMatters: >-
      Control descriptions are not the same as demonstrated reliability, especially where one wrong answer can trigger
