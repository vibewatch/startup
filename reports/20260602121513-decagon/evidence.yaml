evidenceGaps:
  - type: missing-source
    severity: material
    topic: TO002 broader executive roster and governance
    missingEvidence: A current board list, executive roster below the founders, committee structure, and any founder-control summary.
    whyItMatters: >-
      Without it, diligence cannot cleanly judge succession depth, governance maturity, or whether key decisions are
      concentrated in a very small group.
    diligencePath: Request the current board deck, leadership org chart, and most recent governance matrix from management.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: TO003 cap table and tender mechanics
    missingEvidence: >-
      Exact ownership percentages, liquidation preferences, tender participation rate, and any strategic rights granted
      in the latest rounds.
    whyItMatters: >-
      Public funding visibility is strong, but economic control and downside protection can materially alter how
      investors and employees experience the same headline valuation.
    diligencePath: Request the post-Series-D cap table, term sheets, and tender allocation summary under NDA.
    relatedQuestionRefs:
      - QO010
      - QO016
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: TO001 current headcount and operating economics
    missingEvidence: >-
      A current headcount by function and geography, plus audited or board-reported revenue, margin, burn, retention,
      and customer concentration metrics.
    whyItMatters: >-
      The market can verify valuation and customer logos more easily than durable economics, which is dangerous if later
      valuation work overreads growth optics as unit-economics proof.
    diligencePath: Request the latest board operating pack or audited management financials with customer and org breakouts.
    relatedQuestionRefs:
      - QO020
      - QO021
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: TO004 public milestone chronology
    missingEvidence: >-
      An internal chronology of product launches, incidents, governance changes, and major customer rollouts that did
      not make the public blog or press trail.
    whyItMatters: >-
      The public timeline is good enough for identity and capital milestones, but it may miss internal events that
      materially change how execution quality or operational risk should be interpreted.
    diligencePath: >-
      Ask management for a dated operating timeline covering launches, outages, strategic partnerships, leadership
      changes, and major customer go-lives from founding onward.
    relatedQuestionRefs:
      - QO023
      - QO024
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: ai-native-sam
    missingEvidence: >-
      A standalone third-party market dataset for AI-native enterprise CX-agent platforms that excludes broad
      contact-center modules and includes current-year revenue or spend.
    whyItMatters: >-
      Without that boundary-specific dataset, the chapter can only bound Decagon's market with adjacent lenses rather
      than publish a precise TAM or SAM.
    diligencePath: >-
      Ask management or a paid analyst source for current category segmentation and compare it against customer mix by
      workflow and vertical.
    relatedQuestionRefs:
      - QM006
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: som-and-conversion
    missingEvidence: Decagon's current win rate, pilot-to-production conversion, ACV distribution, and sales-cycle duration by segment.
    whyItMatters: >-
      Those metrics determine obtainable market and valuation relevance, but they are not available in public sources
      and cannot be inferred cleanly from market size alone.
    diligencePath: >-
      Request pipeline cohort data, customer logos by stage, and security-review or procurement conversion metrics
      during management diligence.
    relatedQuestionRefs:
      - QM024
  - type: conflicting-data
    severity: material
    topic: market-boundary-ambiguity
    missingEvidence: >-
      A publisher-neutral mapping between contact-center software, call-center AI, and AI-for-customer-service
      categories using the same year and inclusion criteria.
    whyItMatters: >-
      The headline numbers differ by category design, so overconfident comparisons would exaggerate precision and could
      distort valuation assumptions.
    diligencePath: >-
      Normalize market reports to a common module list and year, then reconcile with management's actual workflow mix
      and customer verticals.
    relatedQuestionRefs:
      - QM025
    relatedTableRefs:
      - TM001
      - TM002
  - type: missing-source
    severity: material
    topic: pricing-transparency
    missingEvidence: >-
      Realized Decagon, Sierra, Observe.AI, Cognigy, and Kore.ai contract ranges with platform fees, usage fees, and
      services scope.
    whyItMatters: Competitive win rates and TCO depend more on blended contract cost than on public list-price snippets.
    diligencePath: Request sample order forms, anonymized customer invoices, and procurement references segmented by ticket volume.
    relatedQuestionRefs:
      - QP010
      - QP021
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: compliance-detail
    missingEvidence: Current certification artifacts and trust-center exports for Sierra, Observe.AI, Cognigy, and Kore.ai.
    whyItMatters: >-
      Enterprise buyers in regulated support flows may weigh auditability and certification proof as heavily as feature
      breadth.
    diligencePath: >-
      Request SOC, ISO, HIPAA/BAA, and regional compliance documentation directly from vendor trust portals or sales
      engineers.
    relatedQuestionRefs:
      - QP011
      - QP012
    relatedTableRefs:
      - TP004
  - type: private-evidence-only
    severity: material
    topic: competitive-retention
    missingEvidence: >-
      Win-loss logs, multi-year renewal data, and evidence of whether Decagon expands from overlay use into
      system-of-record control.
    whyItMatters: >-
      Moat durability depends on whether Decagon can keep expanding after initial land-and-expand deployments against
      incumbent suites.
    diligencePath: >-
      Ask management for cohort retention, displacement-by-competitor, and post-launch expansion metrics by account
      segment.
    relatedQuestionRefs:
      - QP025
    relatedTableRefs:
      - TP005
  - type: private-evidence-only
    severity: material
    topic: cash-runway-gap
    missingEvidence: Current cash balance, monthly burn, and runway assumptions after the Series D close.
    whyItMatters: >-
      These numbers determine whether the $250M round is precautionary growth capital or a necessary bridge to the next
      financing event.
    diligencePath: Request the latest board-approved operating plan, monthly cash report, and 12-month cash burn schedule.
    relatedQuestionRefs:
      - QI019
    relatedTableRefs:
      - TI004
      - TI005
  - type: private-evidence-only
    severity: material
    topic: unit-economics-gap
    missingEvidence: Gross margin by channel, model-provider spend, CAC or payback, and NRR by customer cohort.
    whyItMatters: Without these inputs, Decagon's software quality and valuation multiple cannot be underwritten precisely.
    diligencePath: Request customer-cohort retention, margin bridge by channel, and sales-efficiency dashboard from management.
    relatedQuestionRefs:
      - QI020
      - QI021
      - QI022
    relatedTableRefs:
      - TI003
      - TI005
  - type: missing-source
    severity: material
    topic: pricing-gap
    missingEvidence: List pricing, discount bands, contract minimums, and realized net revenue per conversation or resolution.
    whyItMatters: >-
      Public ROI anecdotes do not reveal the actual take rate or whether price competition could compress unit
      economics.
    diligencePath: Review sample order forms, pricing approval matrices, and renewal contracts across large customers.
    relatedQuestionRefs:
      - QI010
      - QI011
    relatedTableRefs:
      - TI001
      - TI002
      - TI005
  - type: missing-source
    severity: minor
    topic: debt-gap
    missingEvidence: >-
      Any venture debt, revolving credit, cloud commitments, or vendor-financing liabilities that sit outside headline
      equity rounds.
    whyItMatters: Hidden obligations could reduce Decagon's effective liquidity even if equity capital appears abundant.
    diligencePath: Request debt schedule, cloud-spend commitments, and major vendor side letters from finance counsel.
    relatedQuestionRefs:
      - QI018
    relatedTableRefs:
      - TI004
      - TI005
  - type: access-blocked
    severity: minor
    topic: filing-gap
    missingEvidence: >-
      Filing-level company record or securities-notice corroboration for Decagon's corporate structure and any
      registered financing documents.
    whyItMatters: Filing checks are a useful backstop when private-company operating disclosures are sparse.
    diligencePath: >-
      Re-run filing verification with a permitted corporate-registry source or management-provided entity documents
      instead of the blocked OpenCorporates page.
    relatedQuestionRefs:
      - QI025
    relatedTableRefs:
      - TI004
      - TI005
  - type: private-evidence-only
    severity: material
    topic: implementation-docs
    missingEvidence: >-
      Detailed public implementation guides for auth, connector setup, environment separation, and operational
      responsibilities.
    whyItMatters: >-
      Without these materials, it is hard to distinguish low-code configuration from substantial forward-deployed
      engineering effort in a real enterprise rollout.
    diligencePath: >-
      Request deployment runbooks, sample implementation plans, and role/responsibility matrices from a live enterprise
      onboarding.
    relatedQuestionRefs:
      - QE025
  - type: missing-source
    severity: material
    topic: sla-and-incidents
    missingEvidence: >-
      Contractual SLA schedule, historical incident summary, and subprocessor / data-boundary detail beyond marketing
      claims.
    whyItMatters: >-
      Reliability and compliance posture are central to underwriting an enterprise AI support platform, especially in
      regulated customer-service environments.
    diligencePath: Obtain security packet, uptime SLA exhibit, incident postmortems, and subprocessor list under NDA.
    relatedQuestionRefs:
      - QE015
    relatedTableRefs:
      - TE004
  - type: private-evidence-only
    severity: material
    topic: model-routing-governance
    missingEvidence: >-
      A provider-by-provider routing matrix showing when OpenAI, Claude, fine-tuned models, or cloud-hosted variants are
      used, plus fallback and cost-governance rules.
    whyItMatters: >-
      Model selection affects accuracy, latency, resilience, compliance, and gross margin, and public sources only
      reveal fragments of that orchestration logic.
    diligencePath: >-
      Request architecture review covering routing policies, fallback behavior, provider isolation, and model-cost
      monitoring.
    relatedQuestionRefs:
      - QE019
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: customer-count-opacity
    missingEvidence: Exact live customer count, number of production accounts, and split between pilots and scaled deployments.
    whyItMatters: >-
      Without a total active-account denominator, public logo breadth cannot be translated into portfolio depth, average
      deal size, or churn resilience.
    diligencePath: >-
      Request a dated customer-count bridge showing starting accounts, additions, churned logos, pilots, and production
      accounts by quarter.
    relatedQuestionRefs:
      - QU020
  - type: private-evidence-only
    severity: material
    topic: retention-opacity
    missingEvidence: Customer cohorts, NRR, GRR, renewal rates, and expansion revenue by vintage or segment.
    whyItMatters: >-
      The current public record proves adoption but not whether Decagon's enterprise relationships are durable or
      whether expansions outweigh churn.
    diligencePath: >-
      Request cohort tables by customer vintage plus logo retention, gross retention, and expansion contribution for the
      last four quarters.
    relatedQuestionRefs:
      - QU018
      - QU019
  - type: private-evidence-only
    severity: material
    topic: concentration-risk
    missingEvidence: Top-customer ARR share, average contract term, largest-account exposure, and concentration by industry.
    whyItMatters: >-
      A few marquee accounts could dominate revenue even if public proof spans many sectors, changing how defensible the
      customer story really is.
    diligencePath: >-
      Request top-10 ARR concentration, top-customer logo list, average ACV, and standard contract-length disclosure
