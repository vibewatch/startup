  - id: TV003
    title: 牛市 / 基准 / 熊市情景分析
    columns:
      - 情景
      - 关键假设
      - 收入路径（2026–2030）
      - 退出时隐含估值
      - 概率信号
      - 关键下行触发因素
    rows:
      - - 牛市
        - >-
          DoW 框架到 FY2027 Q1 转化为有约束力合同；Project Ranger 按期推进；到 2028 年年产 1,000+ 枚导弹，到 2030 年年产 3,000+ 枚；Army 和 Navy
          行使全部期权量；第二产品线开始贡献。
        - $221M（2027）→ $884M（2028）→ $2.2B+（2030），按 $442K/枚、5,000 枚 / 年计算
        - IPO 时 $15–37B（10–15× 远期收入）；相对 $2.8B Series B 入场估值回报 5–13×
        - DoW 框架条款、MACE 采购批量和国会 FY2027 拨款都释放可达成信号 — 但目前都还没有落成合同。
        - 到 FY2027 Q2 仍未将 DoW 框架转为有约束力采购订单。
      - - 基准
        - DoW 框架在 FY2027 转化，但爬坡更慢；Project Ranger 到 2027 年只有部分产能；2027–2028 年年产 500–1,000 枚导弹；需要 Series C 完成工厂并支持营运资本爬坡。
        - $110–221M（2027）→ $250–500M（2028）→ $500–700M（2030），按 $350–442K/枚计算
        - Series C 入场或战略退出时 $5–8B；5–7 年内相对 $2.8B 入场估值回报 1.5–2.5×
        - 政府需求已确认；制造风险是主要不确定性。
        - Project Ranger 延误，或营运资本挤压导致以更低估值做过桥轮。
      - - 熊市
        - 实弹测试失败或项目预算重新分配；DoW 框架未在 FY2027 转化；Project Ranger 延后到 2026 年之后；2027 年没有生产收入。
        - 低于 $100M（2027）；没有生产合同则停滞；现金需要紧急过桥
        - $1.5–2.0B（估值下调轮）；相对 $2.8B Series B 入场估值资本损失 30–46%
        - 截至 2026 年 5 月未确认测试失败；在位项目复苏（ARRW FY2026 $387M）增加预算竞争风险。
        - MACE 实弹项目中任何确认测试失败，或 FY2027 MACE 预算撤销。
    notes: 所有估值估计均为情景模型，不是公司提供；收入估计假设单价为 $300K–$442K/AUR，与 MACE 项目文件和 DoW 框架意图一致。
