      - number: '6.4'
        title: 战争部生产框架与采购视野
        blocks:
          - type: paragraph
            body: >-
              Castelion 历史上最关键的客户信号出现在 2026 年 5 月 13 日：美国战争部宣布，在 Low-Cost Containerized Missiles 项目下，与 Castelion
              及四家巡航导弹公司签署生产框架协议。DoW 表示，一旦 Castelion 完成测试和验证，部门将授予一份两年期多年采购合同，每年至少采购 500 枚 Blackbeard
              导弹，并带有最长可延展至五年的选项。此外，DoW 宣称正“积极寻求必要授权和拨款，以在五年内采购超过 12,000 枚 Blackbeard
              导弹”。这是美国政府首次公开承诺如此规模的高超音速生产，但条件性很强：尚未下达有约束力的生产订单，尚未执行采购订单，整个框架都取决于正在进行的集成、测试和验证进度能否成功完成。即便如此，该框架确实为 2027 至
              2029 年的生产批次确立了固定材料单价，在正式拨款前提供价格可预见性。空军最初的 SBIR 课题 AF231-D026 继续作为三军通用的法律合同载体，在 SBIR Phase III
              下支持无需竞争性重新征集的单一来源授标。DoW 的叙事明确具有战略色彩：它把该安排描述为 Trump 总统和 Hegseth 部长“Arsenal of Freedom”授权的一部分，并将 Castelion
              定位为区别于传统主承包商的新工业基础伙伴。评估留存风险时，这一点很重要：对一个仍在原型测试阶段的项目而言，Blackbeard
              采购背后的政治和机构动能异常强；但国会、政府更替或测试失败，都可能逆转项目和预算承诺。
