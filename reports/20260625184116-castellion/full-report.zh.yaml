      - number: '8.3'
        title: 牛市 / 基准 / 熊市情景
        blocks:
          - type: paragraph
            body: >-
              Castelion 的三条情景路径取决于两个二元结果：（1）2026 年 5 月 DoW 生产框架能否在 FY2027 初转化为有约束力的多年采购合同；（2）Project Ranger 能否按已宣布的 2026
              年时间表达到额定产能。牛市情景下，两项条件均达成，FY2027 MACE 采购批次（353 枚导弹、$156 million）之后立即放量，DoW 框架在五年内行使 12,000+ 枚导弹的全部选项，每枚价格
              $350–$442K。按这一生产节奏，2029 年年收入可能达到 $1.5–2.5 billion，IPO 或战略退出按 10–15× 远期收入定价，估值区间为 $15–37 billion，相当于相对 $2.8
              billion Series B 价格的 5× 到 13× 回报。基准情景下，生产框架完成转化，但爬坡慢于计划：2027 年每年 500–1,000 枚，2029–2030 年每年 1,500–2,500
              枚。收入达到 $250–700 million，且需要以 $5–8 billion 估值完成 Series C，为 Project Ranger 完工提供资金，这意味着公开退出前会被稀释
              15–25%。在这一情景下，Series B 价格对应的回报较温和：五到七年内 1.5–2.5×，符合中位国防科技结果。熊市情景下，测试失败、项目延误或预算重新分配阻碍框架及时转化。生产收入推迟到
              FY2028–2029，Series B 价格相对低于 $100 million 的收入基数显得昂贵，估值 $1.5–2.0 billion 的降价轮变得可能。基于当前证据，基准情景是众数结果；随着 DoW
              框架和 2026 年 4 月 MACE 集成合同确认政府意图，牛市概率正在上升，但工厂投产和实弹测试带来的执行风险仍然重大。
