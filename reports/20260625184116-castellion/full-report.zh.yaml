      - number: '7.2'
        title: 监管、法律与环境风险
        blocks:
          - type: paragraph
            body: >-
              Project Ranger 是 Castelion 位于 New Mexico 州 Sandoval County、占地 1,000
              英亩的固体火箭发动机生产设施，是近期最复杂的风险簇。该设施将使用高氯酸铵（AP）、铝粉和高能添加剂制造并测试固体火箭发动机；这些物质在可比美国国防场址留下过有充分记录的地下水污染遗产。West Mesa 下方的
              Santa Fe Group 含水层为 Albuquerque Basin 约 100 万人供应饮用水；一旦被 AP 污染，修复成本将高到难以承受，且可能在实践中无法完成，Naval Surface
              Warfare Center Indian Head, Maryland 持续数十年的污染事件就是例证。社区倡议组织 Common Ground Rising 已向 New Mexico New Mexico
              州司法部和 GAO 投诉，称 Sandoval County 在未依法举行必要公开听证、且环境审查不足的情况下批准了 Project Ranger LEDA 补贴。截至 2025 年 12 月，与 Sandia
              National Laboratories 合作的环境羽流研究仍未完成。取消危险建筑内部喷淋和消防栓的消防规范豁免，也引发额外审查。Castelion 对所有 Blackbeard 技术数据承担持续 ITAR
              合规义务；FY2026 NDAA 和 Outbound Investment Security Program 也明确把高超音速系统列为 CFIUS
              审查下的敏感技术类别，使每一轮未来融资都需要额外投资人尽调。截至报告日，公开记录中尚未确认有针对 Castelion 的诉讼，但 NM DOJ 投诉为施工禁令或许可撤销打开路径，可能实质性推迟 Project
              Ranger 2026 年目标投产时间表。
