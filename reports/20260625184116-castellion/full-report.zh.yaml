        title: 缓释措施、否决标准与打破投资逻辑的触发器
        blocks:
          - type: paragraph
            body: >-
              尽管存在上述风险，Castelion 仍有几项结构性缓释：已签署的 DoW 生产框架协议，为每年 500+ 枚导弹提供条件性收入可见性；陆军和海军多军种集成分散项目集中度；Project Ranger
              的纵向整合减少外部 SRM 依赖；SpaceX 背景团队已展示高速执行记录；$464M 融资提供跑道缓冲。打破该投资逻辑的事件，是 Blackbeard 在 2026 年陆军或海军资格测试活动中出现无法在 12
              个月内恢复的明确失败，或国会在两个预算周期内未能为 DoW 生产订单拨款。New Mexico 法院若对 Project Ranger 发出施工禁令，也会把生产时间表延长 12–24
              个月，并对投资逻辑产生实质影响。投资人应监测：Blackbeard 2026 年资格测试结果、Project Ranger 环境许可状态、DoW 生产合同转化日期和国会拨款、AMPAC 对 Castelion 的
              AP 供给分配，以及任何创始人离职公告。下方否决标准表列出具体触发器；一旦触发，需要在 30 天内重新评估投资逻辑。
