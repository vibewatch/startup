    title: 工作流 / 使用场景表
    columns:
      - 用户任务
      - 当前 / 替代工作流
      - Castelion 方案
      - 可量化收益
      - 限制
    rows:
      - - 海军航母航空兵：针对机动海上或沿岸目标的反介入 / 区域拒止打击
        - AGM-158C LRASM（亚音速，>$2M/枚）、AGM-84D Harpoon（亚音速，射程有限），或没有高超音速选项
        - F/A-18E/F 搭载 Blackbeard；Mach 5+ 速度；$300K–$442K 目标 AUR；EOC FY2027
        - 高超音速大幅压缩敌方点防御反应时间；单次交战成本比 LRASM 低 5–7x
        - 弹头（75 lb）小于 LRASM（约 1,000 lb JASSM 等效）；以载荷换速度
      - - 陆军 HIMARS 旅：在 500–1,000 km 射程打击时间敏感机动目标
        - PrSM Inc 1（射程约 500 km，$1.6M/AUR）或 ATACMS（亚音速，射程有限）；没有可负担的高超音速选项
        - HIMARS 发射箱发射 Blackbeard GL；约 80% 的 PrSM Inc 4 射程；Mach 5+ 末段；估计 <$7M/AUR（原型），规模化目标 <$300K
        - 在 HIMARS 后勤足迹内交付高超音速速度；一架 C-17 可搭载 4 辆满载 HIMARS，而 LRHW 拖车受限
        - Blackbeard GL 当前原型阶段单位成本显著高于 $300K；陆军列装不会早于 FY2028
      - - 海军 F-35C：以内置挂载的隐身高超音速打击攻击设防目标
        - 美国库存中没有适用于 F-35C 内置挂载的高超音速选项
        - Blackbeard 设计为可在 F-35C/A 内部弹舱挂载 4 枚 AUR；保持低可探测外形
        - F-35C 首个内置挂载高超音速武器；可对高价值目标实施隐身打击
        - 截至 2026 年 5 月，F-35C 内置挂载是设计要求，不是已演示或已签约能力
      - - 联合部队：打击地空防御雷达、C2 节点和机动发射车 TEL
        - 常规巡航导弹（JASSM-ER、Tomahawk）为亚音速；对机动 / 设防目标能力有限
        - Blackbeard（两种变体）；多模 EO 导引头带末端制导，可打击移动目标；Mach 5+ 接近
        - 速度大幅压缩敌方反应时间；可打击 TEL 和舰船等移动目标
