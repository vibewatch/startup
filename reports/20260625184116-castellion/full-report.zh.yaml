  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险框架与投资概览
        blocks:
          - type: paragraph
            body: >-
              Castelion 的风险画像由四股相互咬合的力量塑造：作为高能材料制造新进入者所面对的技术和监管复杂度；对单一政府客户的近乎完全依赖；创始团队规模小且未披露接班规划带来的执行风险；以及 $2.8B
              估值所隐含的前提——非约束性 DoW 生产框架能够转化为已拨款的多年合同。公司在种子轮、Series A 和 Series B 中合计融资约
              $464M，资本储备较厚，但仍处于生产收入前阶段，必须跨过多个资格关口，才能获得生产规模合同付款。本章按已知缓释措施后的残余严重性排序风险：Project Ranger
              监管和环境风险因社区反对活跃、环境审查未完成，拥有最高的近期不确定性；高氯酸铵供应链集中是整个 SRM
              行业共同的结构性脆弱点；关键人物和执行风险中等，但若有适当接班规划仍可管理；财务和竞争风险偏高，不过生产框架协议和强投资人背书提供了部分对冲。最终章节列出 否决标准和监测指标。
