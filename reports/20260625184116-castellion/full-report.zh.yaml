        - id: market
          label: 市场机会
          detail: 2026 年全球高超音速武器市场 $8.6B，CAGR >10%；美国 DoD FY2026 高超音速预算 $3.9B；DoD 计划五年采购 12,000+ 枚 Blackbeard 导弹。结论：强。
          tone: positive
        - id: product
          label: 产品验证
          detail: 不到 3 年完成 25+ 次飞行测试；仅 2025 年就有 20+ 次，验证了 SRM、导引头、CAS、飞控计算机、TPS 和任务软件。公开来源尚未独立确认高超音速标签。结论：推进中，但风险尚未完全出清。
          tone: neutral
        - id: customers
          label: 客户证明
          detail: 已执行海军合同 $155M+；陆军指定拨款 $25M；DoW 生产框架（最低 500+ 枚/年）；没有商业客户（100% 集中于 DoD）。结论：强，但单一客户。
          tone: positive
        - id: financials
          label: 财务图景
          detail: 估算收入约 $51.5M；累计融资 $504M；2025 年 12 月 Series B 融资 $350M；毛利率、烧钱速度和单位经济全未披露。结论：未披露——重大尽调缺口。
          tone: negative
        - id: risk
          label: 风险画像
          detail: 高：单一客户（DoD）、生产框架尚无约束力、$220M capex 承诺、Project Ranger 遭社区反对、关键人物集中、ARRW 竞争项目重启。结论：高风险。
          tone: negative
        - id: valuation
          label: 估值评估
          detail: $2.8B / 约 $51.5M = 约 54× 往绩收入；Anduril 在更大基数上为 27.7×，Shield AI 为 23.5×；Kratos 上市可比公司为 9–12×。结论：偏贵。
          tone: negative
        - id: recommendation
          label: 建议——跟踪
          detail: 买入条件：生产合同转化，或披露毛利率 ≥20%，或入场价格回落到 <35× 往绩收入。持续监控终止触发条件。
          tone: neutral
      edges:
        - from: market
          to: product
        - from: product
          to: customers
        - from: customers
          to: financials
        - from: financials
          to: risk
        - from: risk
          to: valuation
        - from: valuation
          to: recommendation
