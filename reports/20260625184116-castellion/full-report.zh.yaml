              Air Force 在 FY2026 以 $387M 复活 ARRW 项目，并计划到 2030 年投入 $1.7B，说明即使项目取消后，制度惯性和既有关系仍能支撑一个更高成本项目。如果 ARRW
              Increment 2 借助 Lockheed 制造规模实现有意义的单位成本下降，且 Air Force 能把影响力转向海军采购，Castelion 的空射窗口会收窄。考虑到 ARRW
              的失败历史和不同平台（B-52 vs. 舰载 F/A-18），近期概率较低，但仍值得跟踪。
