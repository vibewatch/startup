      - number: '6.5'
        title: 集中度风险、负面证据与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              Castelion 的客户画像带有极端集中度风险：单一买方（美国战争部）贡献 100% 收入。在这个单一客户内部，美国海军是主导合同买方（已执行
              $154.9M），陆军和空军为次级买方。对早期国防初创公司而言，这并不罕见，但尽调含义很重。第一，DoD 高超音速项目优先级、国会拨款或采购政策的任何不利变化，都可能在一次项目审查周期内消除或大幅削减
              Castelion 的收入基础。第二，没有 NRR、GRR、churn rate、客户满意度分数或商业留存指标可用；国防合同模式用合同修改和后续授标替代这些指标。截至报告日，Castelion
              的“留存”记录完全正向：所有已接触军种都扩大了关系，从 2023 年空军 $1.77M SBIR 到 2026 年海军 $154.9M。负面社区证据与客户集中度完全正交：New Mexico 州 Sandoval
              County 的 Project Ranger 场址，因高氯酸盐污染、噪声和地下水风险引发居民有组织反对。数百人参加了 2025 年 10 月和 12 月的社区会议。militarypoisons.org
              的环境活动文章将该设施描述为潜在公共卫生危机。虽然这不会直接威胁既有客户合同——客户是 DoD，不是社区——但会形成监管、许可和声誉风险，可能拖慢制造爬坡，进而影响生产合同履约。截至 2026 年 5
              月，公开记录中没有合同抗议、GAO 投标挑战或竞争性采购争议证据。


              独立分析师覆盖（IPO Club）把 AUKUS 伙伴——Australia 和 United Kingdom——视为可能通过 Foreign Military Sales
              产生的未来出口客户，从而把收入基础延伸到当前唯一买方之外。传统 DoD 项目长期依赖过时工程实践，项目经理寻求商业级效率时，Castelion 具备结构性需求优势。不过，New Mexico 州 Project
              Ranger 设施遭遇社区反对，反对理由包括有毒化学品和 PFAS 污染风险；若监管障碍落地，这将成为不可忽视的供应链风险，可能限制产能爬坡。
