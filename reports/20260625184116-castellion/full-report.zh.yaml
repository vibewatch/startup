        - label: 热防护系统
          values:
            - score: medium
              note: 已在 Mach 5+ 条件下通过飞行测试验证；无公开烧蚀数据
            - score: low
              note: 成品率约 70%，目标 >90%；这是近期最重要的规模化风险
            - score: high
              note: 已获准用于所有测试构型的当前测试弹
            - score: medium
              note: TPS 制造不需要特定监管认证；Project Ranger 需要 EHS/VOC 管控
        - label: 嵌入式飞行软件
          values:
            - score: high
              note: 全栈已在 25+ 次飞行测试中验证；HIL 仿真已用于生产
            - score: medium
              note: 软件生产流程未被独立评估；DO-178C 状态未知
            - score: medium
