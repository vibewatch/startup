  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资建议与确信度
        blocks:
          - type: paragraph
            body: >-
              以 2025 年 12 月 Series B 约 $2.8 billion 的入场价看，Castelion
              的建议为跟踪。我们的确信度来自四根支柱，且证据较充分：代际级、结构性获资助的高超音速武器市场；在可负担价格带，目前没有空射同类产品的先发位置；具备 SpaceX
              级执行基因的运营型团队；以及同类初创公司在如此早期尚未拿到的政府需求信号——2026 年 5 月 DoW 生产框架。不过，约为过去估算收入 54×
              的入场倍数，相比任何阶段的国防科技上市公司基准都偏激进。最接近的私营可比公司——Anduril Industries 以 2025 年 $2.2 billion 收入对应 $61 billion
              估值（27.7×），Shield AI 以预计 2026 年约 $540 million 收入对应 $12.7 billion
              估值（23.5×）——倍数都明显更低，尽管它们收入基数大得多、平台更多元、量产历史也更长。风险评级为高：DoW
              框架转化为有约束力的多年合同、首个全速率生产批次按期交付、规模化毛利率得到确认，三项条件必须同时兑现，投资者才可以有把握地把 $2.8 billion
              入场价定为公允价值。估值立场为偏高。若要上调至买入，至少需要出现以下之一：签署有约束力的生产合同；披露毛利率数据且 ≥20%；或入场价格回落至过去收入
              <35×。具备长期持有周期、且能进入运营数据室的国防科技投资者，应把这三项尽调触发条件作为闸门。
