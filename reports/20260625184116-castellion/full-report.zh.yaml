      - number: '3.4'
        title: 能力与定价比较
        blocks:
          - type: paragraph
            body: >
              对 Castelion 最关键的竞争维度，是单位成本与产量潜力的组合。Blackbeard 每枚约 $384,000 的设计目标——已在海军采购的 Pentagon 预算文件中确认——比
              ARRW（$15–18M）便宜 40 倍以上，比 CPS/C-HGB（约 $41M）便宜 100
              倍以上，并从根本上重塑了谁能够批量购买高超音速武器。这一成本差距不是边际优势；它会改变库存规模、任务多样性以及消耗武器时的风险计算。


              从能力看，Blackbeard 达到 Mach 5+，并在末段机动，比弹道轨迹更难跟踪和拦截。ARRW 是助推-滑翔飞行器，空气动力外形不同；HACM 是吸气式
              scramjet，推进物理不同，射程更长但开发更慢。CPS/Dark Eagle 是舰射或地射战略滑翔体，不像 Blackbeard
              那样平台无关。在战术空射角色中——从航母出动打击设防目标——Blackbeard 是当前处于主动采购中的唯一武器，同时结合高超音速、空射能力和量产经济性。


              相比传统厂商，关键能力缺口是射程：Blackbeard 公开报道的射程没有精确披露，而 CPS
              等更远程高超音速滑翔飞行器能够在洲际防区外距离实施打击。不过，对海军舰载航空任务而言，战术射程加高容量弹药库深度是一笔海军已经明确选择的交易；海军已把 MACE 项目导向
              Blackbeard，作为首个武器候选。LCCM 替代品提供数量但牺牲速度；传统厂商提供射程和涉密能力，但牺牲可负担性和产速。
