  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型与政府合同结构
        blocks:
          - type: paragraph
            body: >-
              Castelion 是一家纯美国政府国防承包商，没有商业收入。每一美元收入都来自 DoD 按 firm-fixed-price 条款授予的合同，主要通过 Small Business Innovation
              Research（SBIR）Phase III 合同工具签约；该工具允许非传统国防供应商以单一来源方式签约。公司披露的收入曲线很陡：2023 年 5 月第一份 $5M 合同，到 2025 年 12
              月已升级为累计军方合同基础超过 $100M，到 2026 年 4 月执行的海军合同价值接近 $155M。2026 年 2 月合同授予（N6833526F1022）总额为 $49,998,005，用于 Navy
              Multi-mission Affordable Capacity Effector（MACE）项目下的全尺寸 Blackbeard 原型、飞行测试和早期作战能力。2026 年 4 月，同一合同执行了
              $104,998,566 期权修改，用于最终集成、Indo-Pacific Command 区域实弹测试和早期作战能力需求。第三方收入聚合商估算，截至 2025 年 9 月，Castelion 年收入约为
              $51.5M，与正在放大的原型收入轮廓一致。2026 年 5 月 Department of War 量产框架——在测试和验证完成后，保证每年至少 500 枚 Blackbeard 导弹，并可选择五年采购超过
              12,000 枚——代表收入模型从开发转向量产合同的第一个事件。该框架尚未转化为有约束力的多年采购合同；能否转化，取决于正在进行的测试和集成排期能否完成。
