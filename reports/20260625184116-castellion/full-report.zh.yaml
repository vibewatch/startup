      - number: '4.4'
        title: 财务结论与关键尽调缺口
        blocks:
          - type: paragraph
            body: >-
              以公开承销可用信息衡量，Castelion 的收入质量较高：固定总价政府合同具备较强回款确定性，SBIR Phase III 机制为近期授标提供竞争隔离，2026 年 5 月 DoW
              生产框架也给出可信的前瞻需求信号。关键未决问题在于，该框架能否转化为有约束力的多年采购合同；截至 2025 年 12 月，Castelion 尚未赢得生产合同。FY2026 联邦预算中支持 MACE 及
              Blackbeard 相关开发的总拨款约 $379M，涵盖基础拨款、国会追加和预算调和资金，显示政府承诺，但尚未给生产收入带来合同确定性。客户集中度为 100%：美国 DoD
              是唯一买方，任何项目取消、测试失败或预算重分配，都会在没有商业收入对冲的情况下重创收入。$2.8B 估值意味着，公司在尚未完全兑现的合同基础上承担了激进收入倍数，并高度押注生产框架转化。New Mexico 州
              Sandoval County 社区反对 Project Ranger，焦点包括高氯酸盐污染风险、潜在 PFAS
              暴露和静态点火测试噪声，这给制造扩产增加了投资人不应忽视的环境许可和政治风险。按当前估值承销之前，必须补齐的关键尽调动作包括：量产规模下的毛利率、实际 资金消耗率和现金跑道、有约束力的生产合同条款，以及
              Project Ranger 环境许可状态。
