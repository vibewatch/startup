      - number: '1.2'
        title: 领导层与治理
        blocks:
          - type: paragraph
            body: >-
              Castelion 由三名前 SpaceX 成员共同创立，三人的能力互补。CEO 兼联合创始人 Bryon Hargis 曾任 SpaceX Government Sales
              Director，负责国家安全卫星项目，并搭建了数十亿美元级国防项目管线。他拥有 Johns Hopkins University 应用物理硕士学位和 Georgia Tech 机械工程学士学位。COO
              兼联合创始人 Sean Pitt 曾负责 SpaceX 在欧洲的商业发射和载人航天销售，执行过超过 $1.25B 的出口交易，对复杂国际国防销售和运营有深厚经验。CFO 兼联合创始人 Andrew Kreitz
              曾在 SpaceX 负责发射预测和政府成本提案，此前任 Goldman Sachs 副总裁，聚焦航空航天与国防并购，为公司带来少见的财务纪律和国防项目经验组合。三人均于 2022 年 11 月离开
              SpaceX，共同创立 Castelion。此后，领导团队吸纳了来自 SpaceX Falcon 9 和 Dragon capsule 项目的资深工程师和运营人员，也包括 Lockheed
              Martin、Raytheon 等传统承包商的老兵。董事会结构未公开披露。Castelion 的投资方——包括 Altimeter Capital、Lightspeed Venture Partners 和
              Andreessen Horowitz——很可能按其投资份额持有董事观察员或董事席位，但公开来源尚未证实。鉴于创始团队在政府关系管理中的核心作用，以及公司仍处早期运营成熟度阶段，关键人依赖偏高。
