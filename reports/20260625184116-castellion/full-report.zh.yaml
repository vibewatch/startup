      - number: '3.5'
        title: 护城河、转换成本与差异化耐久性
        blocks:
          - type: paragraph
            body: >
              Castelion 的护城河建立在四个相互强化的机制上：垂直整合、平台集成转换成本、生产规模投资，以及通过多年框架协议形成的早期采购锁定。


              推进（固体火箭发动机）、航电、热防护和制导系统的垂直整合——在 Castelion 位于新墨西哥州 Sandoval County、占地 1,000 英亩、包含 21 栋建筑的 Project Ranger
              固体火箭发动机园区建设——让 Castelion 能控制成本、交付周期和质量，而无需依赖传统一级供应商。该设施预计 2026 年底投运，并创造约 300
              个长期岗位。这是资本密集型基础设施投资，竞争者很难快速复制。


              平台集成会叠加形成转换成本。把一款武器集成并认证到军用平台（Castelion 的案例是 F/A-18）需要数千小时工程、资格测试、布线变更、软件更新和飞行员训练。一旦海军在 Super Hornet 上认证
              Blackbeard，同一平台上重新认证竞争武器就需要等量投入，从而产生有利于先发者的制度惯性。陆军 Blackbeard GL 项目（从 HIMARS 地面发射）创造第二条平台集成路径，让 Castelion
              的转换成本足迹翻倍。


              DoD 从传统成本加成转向固定价格、确定数量的框架协议，结构性利好能够承诺批量单位成本确定性的供应商。Castelion 已签署此类框架；DoD 正积极寻求五年 12,000 多枚 Blackbeard
              的授权和拨款。这个信号对资本市场可见（支撑 Altimeter 和 Lightspeed 领投的 $350M Series B），也为 Castelion 的设施投资提供清晰需求背书。


              耐久性风险包括：（1）ARRW 复活——Lockheed 保留制度关系，并可能推出更便宜的 ARRW Increment 2 型号；（2）Raytheon HACM 到 2027 年实现 IOC，可能为 Air
              Force 创造一个竞争性空射高超音速选项，并影响 Navy Air Force 协同；（3）新进入者——Anduril 已表达高超音速野心，且国防科技制度地位上升，可能在 2028–2030
              年窗口推出竞争武器；（4）DoD 单一买方风险——如果国会削减高超音速预算或重定向资金，Castelion 12,000 枚需求信号可能减弱。
