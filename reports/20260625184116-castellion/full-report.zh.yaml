    title: 缓释与终止标准表
    columns:
      - 风险
      - 可监测触发因素
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 项目取消 / 生产递延
        - DoW 生产订单转化和国会拨款
        - 2 个预算周期内（FY2027–FY2028）未拿到已拨款生产合同
        - 降低仓位；要求管理层解释恢复路径
      - - 环境诉讼禁令
        - NM DOJ 投诉状态；针对 Project Ranger 的法院文件
        - 法院禁令或许可撤销导致施工或运营停止
        - 重新评估时间表；12–24 个月延误会实质削弱投资论点
      - - 资格测试失败
        - 2026 年 Army HX3 和 Navy MACE 资格测试结果
        - 连续三次或更多测试失败，且没有可信技术恢复路径
        - 降低确信度；下次检查前要求恢复计划和更新时间表
      - - AP 供应中断
        - AMPAC 交付排期与 Project Ranger 生产爬坡
        - AP 交付延误超过 30 天并影响生产计划
        - 要求管理层在 30 天内给出第二来源计划
      - - 创始人离职
        - SEC 或新闻公告；投资人更新；LinkedIn 变动
        - 任一联合创始人（Hargis、Pitt 或 Kreitz）离职
        - 立即重新评估；30 天内向董事会询问继任计划
      - - 资金续航期耗尽
        - 合同里程碑时间与披露的现金消耗
        - 在没有已签署约束性生产合同的情况下，资金续航期降至 12 个月以下
        - 要求更新融资计划；视为重大负面信号
    notes: 触发阈值由作者基于公开项目和融资数据估算；实际管理层看板和财务披露会让这些阈值更精确。除创始人离职（需要投资人更新权限）和资金续航期（需要管理层披露）外，所有触发因素都可通过公开来源监测。
