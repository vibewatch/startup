            body: >-
              $2.8B Series B 估值只能靠约 54× 过去估算收入倍数来解释——超过 Anduril 和 Shield AI 23–28× 区间的一倍以上，也接近 Kratos 公开市场 9–12×
              倍数的六倍。这一溢价押注的是量产级收入，但它取决于一份非约束性框架能否转化为生产合同、$220M 工厂建设能否按期完成，以及毛利率能否在一个从未被量产验证过的价格点上跑通。The War Zone
              和陆军预算文件分别指出 Blackbeard 的高超音速属性仍存在不确定性，而这一属性正是其预算科目的核心支撑。按当前价格入场的投资者，将承担这三项执行风险，且可比公司组不给任何安全边际。
            calloutType: risk
            claimRefs:
              - CV005
              - CV010
              - CV023
              - CV024
              - CV026
              - CV027
              - CV028
          - type: callout
            title: 跟踪——三项条件可上调至买入
            body: >-
              跟踪建议反映了我们对团队、市场和政府支持的高确信度，同时被偏高的入场倍数和重大未解决风险抵消。若以下至少一项得到确认，建议可上调至买入：（1）DoW
              生产框架转化为有约束力、带承诺资金的多年采购合同，（2）披露并确认量产规模毛利率达到 20% 或以上，（3）后续融资轮或二级市场交易中入场估值回落至过去收入 35×
              以下。若拥有数据室访问权限的投资者能同时确认有利毛利率和生产合同转化，今天做出买入决策的基础会明显更强。
            calloutType: recommendation
            claimRefs:
              - CV034
              - CV035
              - CV036
          - type: callout
            title: 国防科技倍数膨胀带来全行业压缩风险
            body: >-
              2025–2026 年国防科技风投周期推高了整个板块的倍数：2025 年投资额 $29B，接近 2020 年的三倍，推动 Anduril 在十二个月内从 $14B 升至 $61B，也推动 Shield AI
              同期从 $5.3B 升至 $12.7B。Castelion 的 54× 倍数就是这一环境的产物。如果采购改革停滞、国防预算增长放缓，或头部国防初创公司之一错过收入里程碑，全行业倍数压缩将影响包括
              Castelion 在内的所有私营持仓。PwC 和 S&P Global 都把这点标记为同一批公司的结构性风险：随着量产阶段公司成熟、公开市场投资者施加 EBITDA 纪律，国防科技倍数会向 Kratos
              式水平压缩。
            calloutType: insight
            claimRefs:
              - CV014
              - CV015
              - CV016
              - CV044
