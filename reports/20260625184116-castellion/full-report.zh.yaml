      - number: '3.2'
        title: 传统高超音速项目
        blocks:
          - type: paragraph
            body: >
              Lockheed Martin 牵头 ARRW（AGM-183A）Air-launched Rapid Response Weapon，这是一款由 B-52 / B-1B 携带的高超音速滑翔飞行器。该项目在
              2021 至 2023 年间至少经历三次飞行测试失败，导致空军取消项目。FY2026 国防预算以 $387M 将其复活，并计划到 2030 年投入 $1.7B。单位成本估算为
              $15–18M（Congressional Budget Office 对 100–300 枚量产批次的分析），是 Castelion Blackbeard 目标价格的 40 倍以上。USAF 目前计划将其集成到
              B-52，并可能集成到 F-15E。Lockheed 还与 Northrop Grumman 一同在海军 Conventional Prompt Strike（CPS）和陆军 LRHW（Dark
              Eagle）项目中担任主承包角色，陆军于 2026 年 4 月授予 $2.7B CPS/LRHW 合同。CPS 是舰射滑翔体系统，目前部署在 Zumwalt 级驱逐舰上，单位成本约 $41M。


              Raytheon Technologies（RTX）牵头 Hypersonic Attack Cruise Missile（HACM），这是美国开发管线中唯一的吸气式 scramjet 高超音速导弹。HACM
              设计用于 F-15E（随后 F/A-18）挂载，并在 2022–2023 年从开发合同中获得约 $1.4B 资金。Air Force 经 GAO 审查的排期显示，受设计延迟影响，首飞测试从 FY2025 推迟至
              FY2026。FY2027 预算申请 $404M 量产资金，IOC 目标为 2027 年。总采购计划超过 $3B。Northrop Grumman 贡献助推器、scramjet 设施投资，以及另行授予的
              Glide Phase Interceptor（GPI）高超音速防御项目（2026 年 5 月 $475M 合同修改），另有用于高超音速遥测的 RangeHawk 无人机合同。


              三家传统厂商都按成本加成合同模型运作，采购周期跨多年，组织结构也不是为 Castelion 目标的每年数千枚产量而设计。它们的制度优势包括数十年的 DoD
              关系、涉密项目通道和庞大工程队伍；但其成本结构和官僚化采购周期，正是 Castelion 模型要绕开的对象。
