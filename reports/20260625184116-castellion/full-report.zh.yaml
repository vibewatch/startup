      - number: '2.4'
        title: 增长驱动与采纳约束
        blocks:
          - type: paragraph
            body: >-
              最强增长驱动来自地缘政治：中国和俄罗斯已经列装实战高超音速系统（中国的 DF-17/DF-ZF，俄罗斯的 Kinzhal、Avangard 和
              Zircon），而多数美国项目仍停留在开发或测试阶段。这个「战略缺口」已经成为两党政治优先事项，压缩了典型 DoD 采购周期，并释放了 Other Transaction Authority
              机制，让签约更快。「Arsenal of Freedom」理念明确把规模和可负担性定义为威慑支柱，直接利好 Castelion 以制造为先的路径。

              次级增长驱动包括：近期高强度行动（包括 Pentagon 文件提到的伊朗冲突）消耗了美国导弹库存，迫使大规模补库更紧迫；DoD 表示，计划从 2027 年起的三到五年内采购超过 10,000 枚低成本巡航导弹和
              12,000 枚高超音速导弹；国会对国防现代化的支持上升，推动开支从传统平台转向先进弹药。

              采纳约束很强，不应低估。材料可得性是近期瓶颈：高超音速热防护系统和先进复合材料需要专门供应链，而全球供应链受限。测试基础设施稀缺——高超音速试验场排期紧，飞行测试节奏直接决定认证速度。ITAR
              制度限制供应链多元化。舰载机集成认证是高门槛监管关口：海军适航认证流程旨在消除航母作业中的灾难性故障，测试中任何异常都可能让采购延迟 12–24 个月。12,000
              枚导弹多年采购的国会授权尚未锁定，构成政策风险。最后，军控倡议者和部分战略研究学者警告，快速高超音速扩散可能带来升级误判风险；这一担忧未来可能在预算周期中形成政治逆风。
