      - number: '5.6'
        title: 信任、安全、质量与合规
        blocks:
          - type: paragraph
            body: >-
              Castelion 的合规义务主要由弹药安全认证、出口管制和环境许可决定。走海军舰载航空路径，主要关口是 NAVAIR NOSSA（Naval Ordnance Safety and Security
              Activity）审查和 WSESRB（Weapon Systems Explosives Safety Review Board）认证；Blackbeard
              获准在航母上储存、装载和飞行前，这些步骤必须完成。FY2026 reconciliation bill 文本明确拨出 $89M，用于“完成 vendor
              development、政府集成成本、NOSSA/WSESRB 认证以及支持最低 EOC 配置的靶场 / 飞行”，确认截至 2026 年 5 月这些审查尚未完成。陆军 HIMARS 集成方面，Flight
              Termination System（FTS）必须先设计、制造并取得资格，靶场安全才允许实弹测试；该系统正在开发中。Castelion 在 Torrance（总部）和 Rio Rancho（Project
              Ranger）运营环境、健康与安全（EHS）项目，覆盖高氯酸铵（AP）处理、铝粉燃料、复合纤维制造，以及高能材料消防规程（AP/铝火灾不能用水扑灭）。在 Project Ranger，Castelion
              已承认固体火箭发动机氧化剂高氯酸铵需要严格的高氯酸盐围堵和地下水监测，以保护供应 Rio Rancho 饮用水的 Santa Fe Group 含水层。数百名居民在 2025 年 10 月和 12
              月社区会议上正式表达担忧，涉及高氯酸盐污染、静态点火测试噪声、消防泡沫中的 PFAS 风险以及施工径流。截至 2026 年 5 月，Castelion 尚未取得 Project Ranger
              全部环境许可。量产硬件的 MIL-SPEC 资格尚未公开确认；项目仍处于原型和 EOC 前状态。未见 DoD 或独立第三方网络安全审计公开报告。公开信息中没有安全事故、造成人员受伤的测试失败或产品召回。
