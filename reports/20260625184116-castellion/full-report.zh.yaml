      - number: '7.5'
        title: 人员、执行与财务风险
        blocks:
          - type: paragraph
            body: >-
              Castelion 的管理层集中在三位联合创始人身上——CEO Bryon Hargis、COO Sean Pitt、CFO Andrew
              Kreitz——构成有意义的关键人物风险。每位创始人都带来独特且难以替代的能力组合：Hargis 管理政府关系管线和合同策略；Pitt 负责运营和大规模制造执行；Kreitz
              掌握资本结构、融资和财务建模。公司未披露公开接班计划、关键人物保险或具名副手。IPO Club 的二级市场分析指出，Castelion 的投资人信心和政府可信度，在很大程度上绑定于这支特定创始团队的 SpaceX
              背景和既有 DoD 关系。工程人才获取风险偏高：固体火箭发动机和高超音速系统工程师需要安全许可、专门材料科学能力和实践经验，更广泛的科技人才市场难以轻易供给。2025–2026
              年国防科技招聘升温，多家资金充足的初创公司争抢同一批持有安全许可的工程人才。财务侧，Castelion 未披露年化收入口径、毛利率、资金消耗率或运营跑道。公司仍处于生产收入前阶段，资金来自合同里程碑付款，以及自
              2022 年以来筹集的 $464M 股权和债务。$30M SVB 风险债部分带有标准约束条款风险，可能需要再融资。来自 Anduril Industries（2026 年 5 月以 $61B 估值融资
              $5B）以及在相邻低成本弹药项目上的既有主承包商竞争，增加了资源和人才竞争压力。DoD 的 LCCM 项目于 2026 年 5 月与 Anduril、Leidos 等签署框架协议，说明低成本弹药竞争正在加剧。
