  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >
              Castelion 面对三层不同竞争：（1）传统主承包商高超音速项目（Lockheed Martin ARRW、Raytheon HACM、Northrop Grumman 参与的 Conventional
              Prompt Strike / Dark Eagle）；（2）在 Pentagon Low-Cost Containerized
              Missile（LCCM）项目下运行的新进入巡航导弹初创公司（Anduril、Leidos、CoAspire、Zone 5 Technologies）；（3）现状替代品——JASSM-ER 和 Tomahawk
              等常规防区外弹药，仍为亚音速，但已经大规模列装。


              没有传统厂商处在 Castelion 的特定利基：一款可负担、空射、Mach 5+ 战术高超音速导弹，从第一天起就按高产能设计。Lockheed 的 ARRW 达到高超音速，但单价 $15–18M，在
              FY2026 预算以 $387M 复活前曾被取消。Raytheon 的 HACM 是处于原型阶段的吸气式 scramjet 巡航导弹，首飞测试推迟到 FY2026，IOC 目标为 2027
              年，单位成本未披露但为数百万美元级。Northrop / Lockheed 的 Conventional Prompt Strike（CPS）和陆军 Long-Range Hypersonic
              Weapon（LRHW/Dark Eagle）是舰射和地射滑翔体系统，瞄准战略远程打击，而非 Blackbeard 面向的空射战术架次。Castelion 的 LCCM 邻近框架协议——DoD
              寻求在两年采购协议中每年至少采购 500 枚 Blackbeard，并积极寻求五年 12,000 多枚导弹的授权——截至 2026 年 5 月，在同业中没有直接可比对象。


              舰载航空打击的现状替代品是 AGM-154 JSOW 或 AGM-158 JASSM-ER（亚音速，约 $1.4M /
              枚），缺少高超音速速度，也缺少穿透现代一体化防空系统的生存性。由国家实验室（Sandia、DARPA 项目）和 Dynetics（C-HGB 设计方）开展的 DoD 内部建设，是一条非商业平行路径，但并非
              Castelion 的商业竞争对手。
