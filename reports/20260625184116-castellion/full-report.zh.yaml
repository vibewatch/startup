            title: 单位价格结构性优势是主要护城河
            body: >
              Castelion 对 Blackbeard 导弹约 $384,000 的目标价格，比 Lockheed Martin ARRW 便宜 40 倍以上，比海军 Conventional Prompt Strike
              滑翔体便宜 100 倍以上。这不是边际成本优势——它从根本上改变了一个航母舰载机联队能携带多少导弹、一次交战能消耗多少导弹，以及 DoD 预算如何分配到高超音速威慑。如果 Castelion
              按这一价格点实现量产，当前没有竞争者能在不根本重做采购和制造模型的情况下匹配。
