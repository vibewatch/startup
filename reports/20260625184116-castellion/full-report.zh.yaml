  - id: TU005
    title: 扩张驱动因素和集中度风险
    columns:
      - 因素
      - 类型
      - 描述
      - 影响
      - 尽调路径
    rows:
      - - F-35A/C 内埋挂载（目标要求）
        - 扩张驱动因素
        - MACE 目标要求明确 F-35A/C 内埋挂载 4 枚 All Up Rounds，从而增加 USAF 和更多 USN 平台客户
        - 高 —— 从 1 类平台扩到 3 类（F/A-18E/F、F-35A、F-35C）
        - 索取 NAVAIR / USAF F-35 JPO 对内埋挂载的技术可行性审查
      - - HIMARS → CAML 发射车切换
        - 扩张驱动因素
        - CAML M 型被设想为 Blackbeard 的主要 Army 发射车，把需求从现有 HIMARS 车队扩到新的自主发射车
        - 中 —— 扩大 Army 弹药深度；取决于 CAML 开发时间线
        - 跟踪 CAML 项目里程碑时间表；发射车进度滑坡可能拖慢 Army 需求
      - - FMS / 盟国销售
        - 扩张驱动因素
        - 20+ 个 U.S. 盟友使用 HIMARS；Blackbeard 与 HIMARS 兼容，自然形成 FMS 路径；但尚未确认 FMS
        - 中高（未来）—— 需要 ITAR 许可和政府间协议
        - 索取 State Dept. 和 DSCA 的 FMS 资格审查时间线
      - - Castelion 第二条产品线
        - 扩张驱动因素
        - Series B（2025 年 12 月）资助「第二条高超音速产品线并行成熟」；可能带来新的客户关系
        - 低（近期）—— 第二款产品尚无公开客户合同
        - 跟踪 Castelion 新闻稿，观察第二产品客户公告
      - - 单一买方集中（DoD = 100% 收入）
        - 集中度风险
        - Castelion 没有商业或盟国客户；100% 收入来自 U.S. DoD；任何项目重组、预算撤销或测试失败都会切断收入
        - 严重 —— 没有收入多元化缓冲
        - 要求详细拆分合同 backlog、修改权限和未支用余额
      - - DoD 内 Navy 主导
        - 集中度风险
        - Navy 合同 $154.9M 对比 Army HX3 FY26 的 $25M；Navy 约占已执行合同价值的 86%
        - 高 —— 单一买方政府内部仍高度集中于单一军种
        - 跟踪 Army Phase II 资金批准和 CAML 项目，观察是否能改善平衡
      - - 有条件生产框架
        - 集中度风险
        - DoW 每年 500 枚最低量框架依赖测试里程碑；如果验证延迟，生产收入不会流入
        - 高 —— 原型合同和生产承诺之间存在收入断崖
        - 要求提供包含具体测试事件和 EOC 标准的里程碑时间表
      - - SBIR Phase III 资格
        - 集中度风险
        - 所有合同都通过 SBIR Phase III（AF231-D026）流转；只要 GAO 对 Phase III 资格发起一次挑战，就可能迫使所有军种重新竞争性招标
        - 中 —— 法律 / 签约结构风险；未发现现行抗议
        - 核实 GAO 关于 Castelion 是否符合 SBIR Phase III 单一来源资格的裁定
    notes: 影响评级是分析师基于合同金额和项目文件作出的判断。FMS 扩张仍属推测（尚无确认协议）；第二产品信息仅来自 Series B 新闻稿。
