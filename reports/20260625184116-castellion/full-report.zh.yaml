      - number: '8.5'
        title: 退出准备度、论点破裂触发器与尽调要求
        blocks:
          - type: paragraph
            body: >-
              Castelion 的自然退出路径包括：被寻求垂直高超音速能力的国防主承包商或二线承包商战略收购；在生产合同产生可审计收入后直接上市或 IPO；或在后续风险轮中开展结构化二级交易。PwC 2026
              年航空航天与国防 M&A 展望将弹药和国防科技列为主承包商补强收购和战略少数股权投资的主要目标，与 Castelion 的画像一致。IPO 前二级交易需要可审计的生产级收入和正
              EBITDA，目前这些条件尚未具备。战略收购风险双向存在：若 Castelion 证明 Project Ranger 吞吐能力，主承包商可能以高于 $2.8 billion
              的控制权溢价报价；若测试受挫，则可能出现低于市场的报价。投资者应持续监控的论点破裂触发器包括：（1）实弹 MACE 项目出现任何确认的测试失败，（2）DoW 生产框架未能在 FY2027 Q2
              前转化为有约束力的采购合同，（3）Project Ranger 施工延误超过 2026 年底投产目标，（4）两名或更多联合创始人离职，（5）国会撤销 MACE
              或相关高超音速项目资金。在当前价格投入资本前，优先级最高的六项尽调包括：（1）每枚 All Up Round 在量产规模下的毛利率，（2）Series B 后实际烧钱速度和现金 runway，（3）Project
              Ranger 资本支出提款计划和剩余义务，（4）股权表与优先股结构，（5）完整飞行测试结果记录，包括任何部分失败，（6）DoW 框架转化为生产合同的时间表。这些问题都无法从公开来源解决，均需要数据室访问。
