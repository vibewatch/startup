      - number: '7.3'
        title: 运营、制造与安全风险
        blocks:
          - type: paragraph
            body: >-
              固体火箭发动机制造天然危险。2025 年 4 月，Northrop Grumman 位于 Utah 州 Promontory 的推进剂原料设施发生爆炸，摧毁一栋建筑但未造成人员死亡；即便在美国最有经验的 SRM
              制造商运营的设施中，这起事件仍凸显了 AP 基推进剂生产的易变化学风险。Castelion 正在建设可比设施，却没有可比机构安全历史。公司纵向整合路径——内部生产 SRM
              推进剂、壳体、导引头和控制系统——加速降本，但也集中运营风险。设施消防在架构上很难，因为 AP 火灾不能用水扑灭；应急规程要求人员撤离并允许受控燃烧，限制了损害缓解选项。Rio Rancho Fire Chief
              James Wenzel 对该设施的高危分类及其对消防部门资源的要求表示担忧。静态点火测试会产生包括氯化氢在内的酸性气体和细铝氧化物颗粒；若不能完全捕集，污染物可能随风飘向下风向，影响居民空气质量。GAO
              2024 年对美国高超音速项目的评估发现，大多数项目未使用现代数字工程工具，抬高全行业成本和进度风险；Castelion
              的快速迭代模式部分缓释了这一点，但其扩产有效性尚未经过独立验证。资格测试失败仍是实质性风险：Blackbeard 必须在 2026 年通过陆军集成和海军 F/A-18
              平台测试，条件性生产框架才能转化为已拨款合同。
