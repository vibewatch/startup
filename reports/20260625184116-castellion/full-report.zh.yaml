      - number: '1.3'
        title: 融资历史与估值
        blocks:
          - type: paragraph
            body: >-
              自创立以来，Castelion 已通过多轮融资筹集约 $464M。公司首笔外部资金来自 Alex Poulin 的 Lavrock Ventures；2023 年 4 月，Lavrock
              在见证创始团队早期在洛杉矶地区仓库和机加工车间艰难自举后投资 $2M。首笔投资后的一个月内，Castelion 首次提交方案就赢得一份 $5M 政府合同，这也是公司的第一份合同。2023 年 10 月，公司宣布
              $14.2M 的正式 Seed 轮，由 Andreessen Horowitz（a16z）和 Lavrock Ventures 共同领投，First In、BlueYard Capital、Champion
              Hill Ventures 参投。2025 年 1 月，Castelion 宣布完成 $100M 融资，包括由 Lightspeed Venture Partners 领投、a16z、Lavrock
              Ventures、Cantos、First In、BlueYard Capital 和 Interlagos 参投的 $70M Series A 股权融资，以及来自 Silicon Valley Bank 的
              $30M 风险债务（2025 年 2 月最终交割）。2025 年 12 月 5 日，Castelion 宣布完成 $350M Series B，由 Altimeter Capital 和 Lightspeed
              Venture Partners 领投，Lavrock Ventures、Andreessen Horowitz、General Catalyst、First In、Space
              VC、Cantos、BlueYard、Avenir、Champion Hill 和 Interlagos 参投。Series B 将 Castelion 估值定在约 $2.8B。累计融资约
              $464M（股权加债务）。从 2023 年 4 月获得第一笔外部资金，到 32 个月后估值达到
              $2.8B，这条快速估值曲线反映了强劲的政府合同动能、多轮成功飞行测试，以及机构投资者对公司技术和制造路径的广泛信心。
