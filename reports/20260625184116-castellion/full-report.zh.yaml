      - number: '3.3'
        title: 新进入者与邻近竞争者
        blocks:
          - type: paragraph
            body: >
              Pentagon 2026 年 5 月的 Low-Cost Containerized Missile（LCCM）项目，催生了一个新的巡航导弹初创竞争集群——Anduril、Leidos、CoAspire 和
              Zone 5 Technologies——目标是在三年内交付至少 10,000 枚低成本亚音速巡航导弹。这些公司并非 Castelion
              的直接高超音速竞争对手；其武器以亚音速或低超音速飞行，面向可消耗低成本饱和打击，而非以到达速度和对现代防空系统的穿透为核心。不过，它们会争夺 DoD 预算、项目办公室注意力和工业基础产能。


              Anduril 的 Barracuda-500M 是为 LCCM 项目设计的地面发射巡航导弹，Anduril 计划扩产到年产 1,000 枚，并在 2027 年初交付首批。Anduril
              披露过将技术延伸到高超音速飞行领域的野心，并截至 2026 年发布了相关 R&D 招聘，但尚无高超音速武器进入已确认项目。Leidos 正在扩大其 Black Arrow（AGM-190A）LCCM
              型号产量，承诺生产 3,000 枚。CoAspire 提供 GHOST 巡航导弹（RAACM-ER 型号）。Zone 5 Technologies 也参与其中，但尚未公开披露其 LCCM 武器。


              Castelion 本身出现在 DoD 更广义、与 LCCM 邻近的公告中：Department 正在寻求授权和拨款，以在五年内按单独框架协议采购 12,000 多枚 Blackbeard 高超音速导弹。DoD
              明确表示，Castelion 项目与 LCCM 参与者属于不同类别（高超音速 vs. 巡航）。Hermeus 和 Stratolaunch
              代表高超音速试验台和可复用飞行器项目，而非进攻性打击武器；它们是高超音速技术生态的供应方，不是竞争者。Kratos Defense 拿到过高超音速子系统合同，但截至 2026 年 5 月并未列装与
              Castelion 竞争的高超音速打击武器。
