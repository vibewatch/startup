  - id: FV002
    title: 收入倍数下的估值敏感性
    type: bar
    layout: standard
    summary: 以 $51.5M 往绩收入估算值为基数，套用不同收入倍数，推导 Castelion 的隐含企业价值；区间从 Kratos 水平（9.4×）到当前 Series B 隐含倍数（约 54×）。这显示当前入场价比同业基准高出多少。
    data:
      items:
        - label: 9.4×（Kratos/KTOS 上市公司）
          value: 484
        - label: 15×（保守防务科技）
          value: 773
        - label: 23.5×（Shield AI Series G）
          value: 1210
        - label: 27.7×（Anduril Series H）
          value: 1426
        - label: 35×（中档偏高）
          value: 1803
        - label: 54×（当前 Series B 隐含）
          value: 2781
    approximationNotes: >-
      所有数值均为百万美元；以 CompWorth、Growjo 和 GetLatka 等聚合平台给出的 $51.5M 往绩收入估算为基数，套用上述倍数得出。收入估算来自第三方，Castelion 未验证。同业倍数基于截至 2026
      年 5 月的最新融资轮或市值数据。
    claimRefs:
      - CV004
      - CV005
      - CV007
      - CV008
      - CV010
      - CV027
  - id: FV003
    title: 估值与回报区间：牛市 / 基准 / 熊市
    type: range
    layout: wide
    summary: 三条情景路径下的退出估值区间，以及以 $2.8B Series B 入场价计算的隐含回报；退出窗口设在 2029–2030 年，收入倍数假设与可比公司组保持一致。
    data:
      items:
        - label: 熊市情景退出估值（百万美元）
          low: 1000
          high: 2000
          mid: 1500
          detail: 测试失败或生产延误；到 2027 年仍没有生产合同收入；下轮融资隐含估值降至 $1–2B。按 $2.8B 入场价计算，回报为 (0.64×) 至 (0.36×)，即本金亏损 36–64%。
        - label: 基准情景退出估值（百万美元）
          low: 5000
          high: 8000
          mid: 6500
          detail: >-
            DoW 框架转化；到 2027 年爬坡至 500–1,000 枚/年；需要 Series C；2029–2031 年 IPO 或战略退出。按 $2.8B 入场价计算，回报为 1.8× 至 2.9×（5–6 年隐含
            IRR 约 13–22%）。
        - label: 牛市情景退出估值（百万美元）
          low: 15000
          high: 37000
          mid: 22000
          detail: >-
            DoW 框架完全转化；到 2030 年达到 3,000+ 枚/年；以 $1.5–2.5B 前瞻收入、10–15× 倍数 IPO。按 $2.8B 入场价计算，回报为 5.4× 至 13.2×（4–6 年隐含 IRR 约
            35–55%）。
    approximationNotes: >-
      所有估值均为情景模型估算，不是公司指引或分析师目标价。退出倍数基于截至 2026 年 5 月的 Anduril/Shield AI/Kratos 可比公司组。Series C （基准情景）带来的稀释估计为
      15–25%，未计入上方隐含回报；实际回报会因稀释而降低。
    claimRefs:
      - CV019
      - CV031
      - CV032
      - CV035
  - id: FV004
    title: 投资 KPI 评分卡
    type: kpi
    layout: compact
    summary: 面向 IC 的八个投资维度评分（1–10 分），权衡市场证明、执行证据和风险调整后估值。评分只是基于公开证据的定性综合；若能取得私有数据，财务健康和生产经济性分数很可能上调或下调。
    data:
      items:
        - label: 市场规模与资金
          value: 9/10
          description: DoD FY2026 高超音速预算 $3.9B；全球市场 $8.6B，CAGR >10%；DoD 计划 5 年采购 12,000+ 枚导弹。需求强、有预算、持续性高。
        - label: 管理层质量
          value: 8/10
          description: 三位 SpaceX 老兵，履历覆盖政府销售、国际交易和航天 M&A。不到 3 年完成 25+ 次飞行测试，对防务制造创业公司而言极少见。
        - label: 客户证明
          value: 7/10
          description: 已执行海军合同 $155M+，另有 DoW 框架；陆军指定拨款 $25M；单一客户集中度（100% DoD）是原始合同金额无法体现的风险。
        - label: 竞争护城河
          value: 7/10
          description: 在低成本空射高超音速制造上先发；Project Ranger 建起持久产能壁垒；SBIR Phase III 奖项带来竞争隔离。ARRW 重启削弱独占性。
        - label: 产品成熟度
          value: 6/10
          description: 已完成 25+ 次开发飞行测试；拿到 MACE 集成合同；印太战区实弹测试待完成。高超音速标签尚未独立确认；生产代表性设计尚未定型。
        - label: 商业模式韧性
          value: 5/10
          description: 生产站稳后，政府收入叠加固定总价合同质量较高；但客户 100% 集中、生产利润率未经验证，都是重大风险。
        - label: 财务健康
          value: 4/10
          description: 未披露毛利率、烧钱速度或 P&L。累计融资 $504M、估算收入 $51.5M，意味着近期自我造血能力有限。Project Ranger 除运营消耗外，还需要约 $220M capex。
        - label: 估值合理性
          value: 3/10
          description: 约 54× 往绩收入，而 Anduril 和 Shield AI 为 23–28×；这要求公司零失误执行一份无约束力的生产框架。可比公司组里入场倍数最高。
    approximationNotes: 评分为定性判断（1–10 分），基于截至 2026 年 5 月的公开证据；不是精算结果，也未经公司验证。不同报告或公司之间不可横向比较。若能取得私有财务数据，财务健康和商业模式韧性分数大概率会显著变化。
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV007
      - CV010
      - CV023
      - CV026
      - CV040
      - CV041
