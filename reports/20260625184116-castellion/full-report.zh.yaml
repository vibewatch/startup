            - score: medium
              note: Project Ranger 在建；TPS 鼻锥成品率约 70%；SRM 成品率未披露
            - score: medium
              note: 已集成到测试发射载具；HIMARS 发射箱兼容性推进中
            - score: low
              note: Project Ranger 环境许可未完成；HIMARS FTS 待定
        - label: GNC / EO 导引头
