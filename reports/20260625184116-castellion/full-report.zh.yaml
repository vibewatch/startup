      - number: '8.4'
        title: 可比估值分析
        blocks:
          - type: paragraph
            body: >-
              按过去收入计算，Castelion 的收入倍数在同业组中最高，反映市场在押注尚未出现在已报告数字里的量产级收入。最有参考价值的可比对象，是近期在相同资本环境中融资的私营国防科技初创公司。Anduril
              Industries 于 2026 年 5 月以 $61 billion 估值完成 $5 billion Series H，约为 2025 年 $2.2 billion 过去收入的
              27.7×；此前公司收入同比翻倍以上，并拿到一份 $20 billion 陆军企业合同。Shield AI 于 2026 年 3 月以 $12.7 billion 估值完成 $1.5 billion Series
              G，约为预计 2026 年 $540 million+ 收入的 23.5×。直接高超音速技术同业 Hermeus 于 2026 年 4 月完成 $350 million Series C 后估值达到 $1
              billion；Hermeus 没有生产收入，因此其每次飞行测试隐含价值，比收入倍数更适合作为 Castelion 量产前溢价的参照。上市公司中，最接近的公开可比公司 Kratos
              Defense（KTOS）是一家正在扩展无人系统和高超音速子系统的中型国防硬件公司，2025 年收入 $1.347 billion，对应约 9–12× EV/revenue。大型国防主承包商（Lockheed
              Martin 为 1.8×、RTX 为 3.0×、Northrop Grumman 为 2.3×）是成熟期结构性下限可比对象，不适合作为量产前初创公司的目标。核心估值问题不是 Castelion
              的收入倍数是否高于 Anduril 或 Kratos——确实更高——而是远期生产合同管线能否支撑当前溢价。如果 DoW 框架完成转化，且按规划爬坡到规模化生产，则隐含的 $2.8 billion 入场价在
              Series B 阶段可能显得有吸引力。若未兑现，倍数会相对任何可实现的近期收入基数严重压缩。
