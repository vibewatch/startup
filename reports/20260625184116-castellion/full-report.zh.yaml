      - number: '5.4'
        title: 平台集成、飞行测试与开发成熟度
        blocks:
          - type: paragraph
            body: >-
              Castelion 技术成熟度最有力的证据，是飞行测试记录：截至 2025 年 12 月，公司已完成 25 次以上开发飞行测试；2026 年 5 月陆军在参议院 Armed Services Committee
              的证词确认，公司过去一年执行了 25 次自有测试活动。没有其他美国高超音速初创公司达到这样的测试频率。首次飞行测试于 2024 年 3 月在 Mojave Desert 进行，距公司成立仅 16
              个月；对复杂高超音速硬件而言，这一速度前所未有。后续测试地点包括 Black Rock Desert（Nevada）、Point Mugu Sea Range（California）、Spaceport New
              Mexico、White Sands Missile Range，并通过一辆 Oshkosh MKR18 LVSR（10×10）机动发射卡车实施；公司已将该车辆改造成可部署地面发射平台。2024 年 10
              月，Castelion 获得陆军和海军集成合同，开始改造 Blackbeard，使其可在作战平台上进行实弹演示。2026 年 2 月海军合同（N6833526F1022，$49,998,005
              FFP）覆盖全尺寸原型、飞行测试和早期作战能力。2026 年 4 月选项修改（P00001，$104,998,566）资助最终 EOC 要求、F/A-18 硬件和软件集成，以及在 Indo-Pacific
              Command 责任区内的实弹测试，预计 2028 年 1 月完成。Boeing 预计将在 FY2027 Q2 获得合同修改，用于扩大完整 F/A-18E/F 飞行包线的飞机集成活动；IOC
              合同授标通过预算调和资金从 FY2028 提前到 FY2027。陆军方面，HX3 项下 $25M FY2026 预算承诺资助 Phase 1（使用既有 HIMARS 兼容 pod 的概念验证演示，原定 2026
              年 Q1）和 Phase 2（10 次来自 HIMARS 的 MVP 原型飞行）。FY2027 海军预算提出首个采购批次：353 枚 Blackbeard 导弹，金额 $156M（约
              $442K/AUR）；这一起点预计会在规模化后向 $300K 目标下降。当前开发成熟度处于 EOC 前原型阶段：公司已通过飞行测试验证全部关键子系统，但尚未完成舰载部署所需的 NAVAIR
              舰载航空安全和适航认证。
