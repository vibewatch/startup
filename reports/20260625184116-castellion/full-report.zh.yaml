      - number: '5.5'
        title: 技术差异化与专有地位
        blocks:
          - type: paragraph
            body: >-
              Castelion 的竞争差异化不在新物理原理，而在制造 know-how、供应链架构和开发方法的组合。没有单一子系统在技术上前所未有；真正的差异在于集成方式和生产经济性。源自 SpaceX 的“build
              fast, test
              often”方法，把设计到发射的周期从数年压缩到数月，形成学习曲线优势；传统主承包商一年或两年一次的测试节奏，短期内难以复制。对固体火箭发动机、导引头、CAS、飞控计算机和热防护系统的纵向整合，让
              Castelion 直接控制成本驱动因素；多数国防企业已把这些环节交给按国防溢价供应链定价的专业分包商。使用车规级商业部件（电机、计算机、壳体），并由全球 R&D 投资背书，使 Castelion
              相较航天级等价件获得更优成本和交付周期。SBIR Phase III 单一来源合同授权在当前原型阶段提供竞争隔离，政府买方无需重新竞争即可追加选项。不过，截至 2026 年 5 月，公开专利数据库中未发现
              Castelion 已授权专利；IP 地位似乎依赖商业秘密制造 know-how，尤其是固体火箭发动机工艺配方、热防护铺层流程和 GNC 软件参数。制导栈受 ITAR Category IV
              管制，带来出口约束，也说明制导系统使用受控美国国防技术，任何 FMS 销售都需要出口许可。The War Zone 提出技术问题：Blackbeard 的飞行剖面可能是峰值超过 Mach 5
              的准弹道轨迹，而非持续高超音速助推—滑翔，因此是否严格符合“高超音速”技术定义仍有疑问；Castelion 澄清，社交媒体上的测试车辆图像并不代表量产武器。
