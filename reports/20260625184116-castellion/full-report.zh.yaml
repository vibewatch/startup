  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与作战流程
        blocks:
          - type: paragraph
            body: >-
              Castelion 的主产品是 Blackbeard，一种远程高超音速打击武器，设计用于攻击时敏、机动或加固目标，速度超过 Mach 5。从客户工作流看，Blackbeard
              可嵌入美国军方既有打击链，作为更便宜、更高频的替代方案，同时替代单价数千万美元的战略高超音速滑翔飞行器，以及速度和弹道不可预测性不足、难以突破现代一体化防空系统的传统亚音速防区外弹药。该武器正在以两种平台变体列装，二者共享底层子系统基础设施。空射海军变体隶属海军
              Multi-mission Affordable Capacity Effector（MACE）项目，由 F/A-18E/F Super Hornet 携带，并要求未来可在 F-35A/C 武器舱内挂载四枚
              AUR。海军 MACE 要求包括：射程与 AGM-158C LRASM 互补（至少 370+ km）、75 lb 战斗部（政府集成）、最低年产 500 枚 AUR 时单价低于 $300,000，并在 FY2027
              达到 Early Operational Capability。地射陆军变体为 HX3/Project CAML 项目下的 Blackbeard GL，目标是以显著更低成本实现约 80% 的 PrSM
              Increment 4 射程（估计 500–1,000+ km），兼容既有 HIMARS MFOM pod 架构，并与自主 Common Autonomous Multi-Domain
              Launcher（CAML-M）并行开发。同时，Castelion 披露了第二条高超音速产品线，仍处于早期开发阶段，与 Blackbeard
              共享低成本子系统基础设施，但合同、项目名称或时间表均未公开。两个变体的买方都是美国战争部；没有商业客户。
