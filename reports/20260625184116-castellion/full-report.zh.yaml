  - id: TV002
    title: 投资论点与反论点
    columns:
      - 类型
      - 论点
      - 支持证据
      - 哪些因素会改变观点
    rows:
      - - 投资论点
        - 结构性且已有资金支持的需求：DoD 库存里没有可负担、可量产的高超音速打击武器，留下一个任务关键缺口；Castelion 正好独特切入。
        - DoW 生产框架（2026 年 5 月）、MACE 授标、FY2026 对 Blackbeard 项目的 $379M 预算承诺。
        - FY2027 NDAA 取消所有 MACE 及相关高超音速预算线。
      - - 投资论点
        - SpaceX DNA 的执行力：三名前 SpaceX 高管在不到三年里完成 25+ 次飞行测试 — 对初创国防制造商来说，这个速度没有行业先例。
        - Altimeter 合伙人引述确认 25+ 次飞行测试；Series B 新闻稿称仅 2025 年就有 20+ 次开发测试。
        - 两名或更多联合创始人离职，或出现系统性测试失败。
      - - 投资论点
        - 先发制造护城河：Project Ranger 建出 1,000 英亩固体火箭发动机产能；同类初创公司尚未开工建设可比的专用制造基地。
        - Project Ranger 于 2026 年初破土动工；私人投资 $220M；计划建设 21 栋建筑，并在 2026 年底前全面投产。
        - 另一家供应商以可比成本拿到可负担高超音速产品的竞争性生产合同。
      - - 反论点
        - 约 54× 收入倍数要求执行近乎无瑕：当前估计收入约 $51.5M，只有生产框架快速转化并把年收入拉到数亿美元，才能支撑 $2.8B 估值。
        - 第三方收入估计（CompWorth、Growjo）；可比私营同业交易倍数为 23–28×。
        - 生产框架转化且收入爬升至 ≥$150M，把倍数压到可辩护区间。
      - - 反论点
        - DoW 生产框架不具约束力：2026 年 5 月框架是需求信号，不是采购订单；转化前还要完成实弹测试和 EOC 声明。
        - DoW 新闻稿措辞（“framework agreement”）；财务章节对合同转化条件的分析。
        - 与 DoD 签署有约束力的多年期生产合同。
      - - 反论点
        - “高超音速”标签含混带来项目风险：The War Zone 公开质疑 Blackbeard 的飞行剖面是否符合严格的 Mach 5+ 持续高超音速定义，而这正是其 DoD 预算线的门槛。
        - The War Zone 对 Army 预算文件的报道（2025 年 6 月）指出：“Exactly how Blackbeard is expected to be hypersonic is unclear”。
        - Castelion 发布经验证的飞行性能数据，确认作战测试弹实现持续 Mach 5+ 弹道。
    notes: 投资论点和反论点各行仅基于公开证据。私人技术、财务和合同数据可能实质改变任一行。
