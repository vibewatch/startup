      - number: '6.2'
        title: 美国海军：MACE 项目与航母舰载机联队采用
        blocks:
          - type: paragraph
            body: >-
              美国海军是 Castelion 的主导客户，也是近期合同收入的主要驱动。Naval Air Systems Command（NAVAIR）最早通过 2024 年 2 月 Multi-mission
              Affordable Capacity Effector（MACE）项目信息征询释放需求，寻求一种面向 F/A-18E/F Super Hornet 的低成本空射防区外高超音速武器，并以 F-35A/C
              内置挂载为目标。2026 年 4 月，Castelion 的 Blackbeard 被确认为 MACE 项目选定的首型武器。采购节奏异常快：首份 $49,998,005 合同（基于 BOA
              N6833526G0006 的订单 N6833526F1022）于 2026 年 2 月 25 日授出，在 SBIR Phase III 条款下资助全尺寸 Blackbeard
              原型、飞行测试和早期作战能力。不到两个月后，2026 年 4 月 24 日，$104,998,566 合同修改（P00001）执行，用于最终集成要求、系统安全和适航认证，以及 Indo-Pacific
              Command 责任区内的实弹测试活动，确认海军作战战区优先级和持续承诺。截至 2026 年 4 月，已执行海军合同累计达到 $154.9M。2026 年 4 月发布的 Pentagon
              预算文件显示，海军计划未来五年为 F/A-18E/F 机队采购 4,500 枚 Blackbeard 导弹，平均单价约 $384,000。FY2027 采购规划明确为首个量产批次 353 枚导弹安排
              $156M。后续批次显著放量：FY2028 目标 691 枚 AUR，FY2029 目标 976 枚 AUR，FY2030 目标 1,115 枚 AUR，FY2031 目标 1,375 枚
              AUR；这意味着海军预期 Blackbeard 将成为其舰载机联队库存中数量最多的高超音速打击弹药。MACE 项目不同于传统高超音速采购：它依托 Other Transaction Authority，并结合
              SBIR Phase III 固定价格合同，以加速时间表、压缩行政开销。
