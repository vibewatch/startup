chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与创立
        blocks:
          - type: paragraph
            body: >-
              Castelion 是一家私营国防科技公司，总部位于加州 Torrance，并在 Los Angeles County（加州）、Midland（得州）、Allen（得州）以及 Washington D.C.
              政策办公室开展工程、制造和测试业务。公司还在新墨西哥州 Sandoval County 的 Rio Rancho 运营一个新的 1,000 英亩固体火箭发动机制造园区，名为 Project
              Ranger。Castelion 于 2022 年 11 月由三名前 SpaceX 高管创立；他们一同离开
              SpaceX，试图填补他们所说的美国常规威慑关键缺口：缺少可负担、可量产的高超音速远程打击武器。公司使命是，在中国和俄罗斯这两个对手已经先于美国部署实战高超音速系统的背景下，重建美国的高超音速制造能力。Castelion
              是一家重硬件、垂直整合制造商，把 SpaceX「快速制造、频繁测试」的理念搬到国防领域。公司的首款也是核心产品是 Blackbeard
              高超音速打击武器，从立项开始就按工业化产出和商业化单位成本来设计。Castelion 的公开目标是，Project Ranger 全面投运后年产超过 1,000 枚 Blackbeard
              导弹，并最终扩至每年数千枚，为美国及其盟友提供有意义的弹药库深度。
