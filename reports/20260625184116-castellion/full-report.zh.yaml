      - number: '6.3'
        title: 美国陆军：HX3 地面发射项目与 HIMARS 集成
        blocks:
          - type: paragraph
            body: >-
              美国陆军是 Castelion 的第二个活跃客户，推动地射 Blackbeard 变体（Blackbeard GL 或 HX3）。2025 年 5 月，陆军高层批准 Blackbeard GL 的紧急需求，指示
              Rapid Capabilities and Critical Technologies Office 在新的 Common Autonomous Multi-Domain
              Launcher（CAML）工作框架下推进该项目。陆军为 Blackbeard GL 开发安排 FY2026 预算 $25M，并将项目设计为两阶段 Middle Tier Acquisition
              快速原型工作，采用固定价格 Other Transaction Authority。Phase I 要求使用政府提供的 MFOM pod 交付概念验证飞行，目标在 2026 年 1 月至 3
              月之间演示。Phase II 要求交付十枚生产代表性弹体，用于 HIMARS 发射飞行测试，目标在 FY2026 结束前完成。陆军公开目标是以显著更低成本实现未来 Precision Strike Missile
              Increment 4 约 80% 的能力匹配，填补陆军高低搭配远程火力组合中的“低端”层级。陆军预算文件预计 FY2027–2029 还将为 HX3 追加 $120M 支出；若 Phase II
              测试成功，陆军预计 2028 年初开始接收 Blackbeard 导弹用于列装。Blackbeard GL 设计为兼容 HIMARS 的过渡方案，远期则以 CAML 为主要发射器。陆军承诺也体现在 Lt.
              Gen. Frank Lozano（Portfolio Acquisition Executive Fires）于 2026 年 1 月出席 Project Ranger
              破土仪式；这释放了高层客户参与的信号，超出合同文件本身。Defense Aerospace 估算 Blackbeard GL 低率初始生产成本低于每枚 $7M，而 Long Range Hypersonic
              Weapon 超过 $40M；6–8x 成本下降，是陆军提升弹药库存深度逻辑的核心。
