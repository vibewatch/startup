  - id: FU001
    title: Castelion 客户旅程图
    type: journey-map
    layout: wide
    summary: Castelion 面向美国军方买家的客户获取与采用旅程，从 SBIR 初始技术播种到生产框架，横跨三个军种。
    data:
      items:
        - id: sbir-seed
          label: 第 1 阶段：SBIR 技术播种（FY2023）
          actor: 美国空军（AFWERX）
          touchpoint: SBIR Phase II contract FA2385-23-C-B007 ($1.77M, Sep 2023)
          outcome: Established SBIR Ph.III contracting vehicle for multi-service sole-source
        - id: tri-service-active
          label: 第 2 阶段：三军种活跃合同（FY2024-2025）
          actor: 美国海军、陆军、空军
          touchpoint: Series A (Jan 2025) discloses active contracts with all three services
          outcome: Multi-service validation; no dollar breakdown disclosed
        - id: integration-contracts
          label: 第 3 阶段：平台集成合同（2025 年 10 月）
          actor: 美国陆军与美国海军
          touchpoint: 'October 24, 2025: Army+Navy integration awards for HIMARS and naval platforms'
          outcome: Live-fire demonstrations planned; HIMARS GL and carrier air wing integration confirmed
        - id: prototype-testing
          label: 第 4 阶段：原型与飞行测试（FY2025-2026）
          actor: 美国海军（NAVAIR）
          touchpoint: 25+ developmental flight tests by Dec 2025; Mojave Oct 2025, Dugway Nov 2025
          outcome: Subsystem validation; propulsion, seekers, thermal protection all demonstrated
        - id: navy-mace-award
          label: 第 5 阶段：海军 MACE 生产合同（2026 年 2–4 月）
          actor: 美国海军（Naval Air Warfare Center Aircraft Div.）
          touchpoint: 'Feb 2026: $49.9M contract; Apr 2026: $105M modification (total $154.9M)'
          outcome: MACE program commitment; F/A-18 integration and Indo-Pacific live-fire funded
        - id: dow-framework
          label: 第 6 阶段：DoW 生产框架（2026 年 5 月）
          actor: Department of War（联合）
          touchpoint: 'May 13, 2026: Production framework; min 500/yr; pathway to 12,000+ over 5 yrs'
          outcome: Pre-negotiated unit prices FY2027-2029; demand signal locked; awaits appropriations
        - id: eoc-production
          label: 第 7 阶段：EOC 与生产（目标 FY2027）
          actor: 美国海军 / 美国陆军
          touchpoint: 'Target: Navy EOC FY2027; Army first unit equipped Q1 FY2028'
          outcome: Operational deployment; production ramp at Project Ranger
    approximationNotes: 阶段时间基于公开宣布的合同日期和预算文件。第 7 阶段基于既定目标；实际 EOC / 部署可能因测试完成情况而延后。
