      - number: '2.3'
        title: 买方与平台分层
        blocks:
          - type: paragraph
            body: >-
              美国国防采购体系形成了分层买方结构：政策负责人（Secretary of War、Under Secretary for Research and Engineering）、项目发起方（NAVAIR、Army
              Program Executive Office for Missiles and Space），以及最终提出需求的作战群体。Castelion
              当前直接付款方是通过项目合同付款的美国政府；现阶段没有商业客户、国际买方或中间分销商。国会授权和拨款，是项目意图转化为有资金合同之间的闸门。

              海军是最直接的买方细分。MACE 项目正式选择 Blackbeard 作为海军主要空射高超音速打击弹药，以 F/A-18E/F Super Hornet 为主要发射平台，F-35C
              为具备隐身能力的次级载机（内置携带四枚）。采纳触发点是完成适航认证和实弹集成测试，目标是在 2027 年达到 Early Operational Capability。预算权掌握在 Assistant
              Secretary of the Navy for Research, Development and Acquisition 手中。

              陆军通过 HX3/HIMARS Blackbeard Ground Launch 项目，构成一个更小的平行买方渠道。FY2026 为 HIMARS 和 M270 发射器的概念验证与集成测试拨出
              $25M。陆军的理由是，用成本有效的方式补充 Long Range Hypersonic Weapon（LRHW/Dark Eagle），以远低于 LRHW
              单位成本的价格实现更广泛部署。这里的采纳触发点，是成功完成固定翼飞行测试和 HIMARS 发射演示。

              Department of War 作为「Arsenal of Freedom」框架下的企业级买方，是上限最高但不确定性也最大的渠道。该框架协议承诺每年至少 500 枚导弹，并寻求五年总计 12,000
              枚的授权；但国会必须拨款，而且本分析审阅的公开 FY2027 预算文件中，尚未出现覆盖完整 12,000 枚规模的单列拨款。
