  - id: TV005
    title: 论点破坏与止损触发条件
    columns:
      - 触发条件
      - 阈值或事件
      - 对投资论点的传导
      - 行动含义
    rows:
      - - 实弹测试失败（MACE 项目）
        - 在 Navy MACE 或 Army HX3 项目中，Blackbeard 飞行测试出现任何经公开确认的失败， 且原因归于武器设计（而非靶场条件）。
        - 动摇牛市情景的三项假设；触发对量产框架的重新评估；项目可能取消。
        - 立即复盘持仓；在下一轮融资价格发现前减仓或退出。
      - - DoW 框架未转化
        - 生产框架到 2027 财年二季度（2027 年 6 月）仍未转化为有约束力的多年采购合同。
        - 基准收入路径坍塌；$2.8B 估值失去支撑；下轮降价成为最可能情景。
        - 除非有具体证据说明只是合同延迟而非取消，并给出修订时间表，否则按论点破坏处理。
      - - Project Ranger 建设延误
        - Project Ranger 首栋生产楼到 2027 年一季度仍未投用（原计划 2026 年底）。
        - 收入爬坡推后；营运资本和资本开支压力加大；Series C 更早到来，谈判位置也更弱。
        - 提高监控频率；评估过桥融资是否已落实。
      - - 共同创始人离职
        - 三名共同创始人（Hargis、Pitt、Kreitz）中有两名或更多因任何原因离职。
        - 政府关系管理、技术执行和融资能力都集中在共同创始人身上；公司已有 100 多名员工且仍处早期， 接班风险很高。
        - 需立即了解留任计划、董事会构成和领导层替补安排。
      - - 2027 财年 MACE 预算被撤销
        - 国会在 2027 财年 NDAA 或拨款法中撤销 MACE 采购资金，或 DoD 发出正式项目取消通知。
        - 收入拐点消失；生产合同不再可能按宣布规模转化。
        - 全部退出持仓；没有 MACE 项目，熊市情景下也很难找到高于 $500M–$1B 的可行底部。
      - - Project Ranger 环境许可受阻
        - New Mexico Environment Department 或 EPA 发布停工令或同意协议，使 Project Ranger 设施建设延误超过 90 天。
        - 制造产能推迟；MACE 交付承诺受威胁；投资人信心受损。
        - 提高法律和监管监控；评估备用厂址是否可行。
    notes: 止损触发条件用于按阈值监控；它们不构成具体价格目标或退出指令。 投资人应自行设定单个持仓上限。
    claimRefs:
