            - score: medium
              note: 生产型导引头供应链和成品率未披露
            - score: medium
              note: 已集成到海军和陆军测试弹；航母接口等待 NAVAIR 认证
            - score: low
              note: ITAR Cat IV；NAVAIR NOSSA/WSESRB 未完成；FMS 许可待定
        - label: FPGA 航电
          values:
