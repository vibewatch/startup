      - number: '2.2'
        title: 市场规模：TAM、SAM 与 SOM
        blocks:
          - type: paragraph
            body: >-
              多个分析视角都指向一个结论：全球高超音速武器市场 2025 年约为 $7.82B，2026 年增至 $8.64B，复合年增长率 10.5%，并预计到 2030 年达到 $12.76B（The Business
              Research Company）。Mordor Intelligence 将超音速和高超音速细分合并后给出更宽口径估算，认为 2026 年合计市场为
              $22.77B；该数字方法不同，会高估纯高超音速机会。Fortune Business Insights 估算，高超音速导弹子细分（不含滑翔飞行器）2026 年为 $6.56B，并在 2030 年代初前以
              13.3% CAGR 增长。

              美国是最大的单一国家市场。Market Research Future 估算，美国高超音速武器细分在 2025 年约为 $2.8B，到 2035 年增至约 $8.5B，CAGR 约
              11.7%。北美整体约占全球高超音速采购的 50–60%，几乎完全由 DoD 支出锚定。FY2026 DoD 预算为陆军、海军和空军高超音速项目专门拨出约 $3.9B，确认了美国作为买方的主导地位，也验证了
              TAM 区间。

              Castelion 的可服务可获得市场（SAM）是 Blackbeard 在技术和项目上有资格参与的 DoD 采购项目集合。近期最清晰的锚点是海军 MACE 项目：FY2027–2031 采购 4,500
              枚空射高超音速导弹，平均单位成本约 $384,000，隐含采购块约 $1.6B。再叠加 Department of War 框架协议（五年 12,000 枚 Blackbeard，年最低 500
              枚，价格尚未公开确认，但隐含接近 $350,000–$384,000 / 枚），如果所有采购选项都执行，SAM 约为 $5.5–6.1B。陆军集成支出（FY2026 预算 $25M，用于 HX3/HIMARS
              工作）是更小、也更早期的渠道。Castelion 在 2026–2028 年的 SOM 受自身制造爬坡约束：Project Ranger（新墨西哥州 Sandoval County）目标到 2027
              年底年产数千枚导弹；如果 FY2027 MACE 首批 353 枚（$156M）执行且 DoW 框架启动，则 2027 年 SOM 大致为 $300–500M。这些是公司隐含数字，无法用公开数据独立确认。
