  - id: TV004
    title: 可比估值表
    columns:
      - 公司
      - 阶段 / 描述
      - 收入 / 指标
      - 估值 / EV
      - 收入倍数
      - 与 Castelion 的相关性
      - 局限
    enumerationScope:
      coverage: partial
      basis: >-
        Defense tech private and public comparables identified in May 2026 sources with known revenue and valuation;
        excludes undisclosed private rounds and non-hypersonic defense startups.
    rows:
      - - Anduril Industries
        - 后期私营（Series H，2026 年 5 月）；多域自主防务平台
        - 2025 年追踪收入 $2.2B；同比增长约 110%
        - $61B（Series H）
        - ~27.7×
        - 最强的私营可比公司：创始人与 SpaceX 有渊源，硅谷 VC（a16z）共同领投，合同规模快速放大； 对 Castelion 的投资人画像而言，这是最可比的估值基准。
        - Anduril 有软件平台杠杆（Lattice）、多条产品线和 $20B 陆军企业合同——收入基数显著更大， 当前护城河也比 Castelion 更宽。
      - - Shield AI
        - 后期私营（Series G，2026 年 3 月）；面向军用飞机和无人机的 AI 自主能力
        - 2026 年预计收入 $540M+；同比增长 80%+
        - $12.7B（Series G）
        - 预计收入约 23.5×
        - VC 投资人画像可比（Advent、JPMorgan）；最近一轮同样体现防务科技溢价； 说明投资人愿意给偏硬件的防务公司显著倍数。
        - Shield AI 的收入基数是 Castelion 当前估计的 10 倍，客户覆盖多个平台， 还有软件护城河（Hivemind AI pilot）；它不是单一武器制造商。
      - - Hermeus
        - 早期成长（Series C，2026 年 4 月）；高超音速飞机初创公司，量产前收入
        - 量产前；$350M Series C；2026 年 3 月首次试飞
        - $1B（Series C）
        - N/A（尚无收入）
        - >-
          最直接的技术类比：高超音速飞行，SpaceX / 防务科技投资人基础（Khosla、Founders Fund、 RTX Ventures），同处量产前阶段。Hermeus 估值 $1B，说明高超音速原型存在溢价；
          Castelion 较 Hermeus 高出 3 倍，则反映其政府合同管线。
        - 终端产品不同（可重复使用飞机 vs. 一次性导弹）；Hermeus 没有生产合同； 估值并非基于收入。
      - - Kratos Defense & Security Solutions（KTOS，上市防务公司）
        - 公开市场中型防务公司；无人系统、火箭推进、高超音速子系统；硬件制造画像可比
        - 2025 财年收入 $1.347B；有机增长 16.6%；2026 财年指引 $1.595–1.675B
        - EV 约 $12.6B（2026）
        - ~9.4×
        - 最适合作为规模路径的公开市场类比：同样是按政府方向扩张硬件制造的非传统防务承包商； 9–12× EV / 收入为 Castelion 量产爬坡后若上市交易提供上限参照。
        - >-
          Kratos 已盈利（2025 财年调整后 EBITDA $119.9M），产品线多元，制造基地也已完全投用。 Castelion 目前还没有这些条件；用 Kratos 倍数可能高估 Castelion
          当前公开市场价值。
      - - Lockheed Martin (LMT)
        - 公开市场防务主承包商；高超音速武器既有厂商（ARRW、CPS、LRHW 项目）
        - 年收入 $75–77B；市值约 $75B
        - EV $137–141B（2026）
        - ~1.8×
        - 底部可比：展示 Castelion 若最终成长为成熟、盈利、规模化防务制造商，市场会如何定价； 当前阶段不适用。
        - 业务成熟、增长稳定，政府关系历经数十年搭建；ARRW 复活（2026 财年 $387M） 让 LMT 成为直接竞争威胁，而不只是可比公司。
      - - Raytheon Technologies (RTX)
        - 公开市场防务主承包商；HACM 高超音速巡航导弹开发方；Pratt & Whitney 航空发动机
        - 年收入指引 $86.5–87B（2025）
        - EV 约 $261B（2026）
        - ~3.0×
        - 大型防务主承包商的底部可比；HACM 项目是直接竞争的高超音速项目。
        - 业务集团包含民用航空航天，并非纯防务科技初创公司的可比对象；HACM 延误说明传统厂商也有执行风险， 但 Castelion 还没进入这种风险阶段。
      - - Northrop Grumman (NOC)
        - 公开市场防务主承包商；Conventional Prompt Strike（CPS / Dark Eagle）项目；B-21 轰炸机
        - 年收入约 $42B（2025）
        - EV 约 $96B（2026）
        - ~2.3×
        - 底部可比；CPS / Dark Eagle 单价 $41M，是 Castelion 试图压低成本的战略替代方案。
        - CPS / Dark Eagle 是独立的战略射程项目，不是战术打击替代品；Northrop 的倍数不能套用到早期量产公司。
    notes: 私营公司的收入倍数基于新闻和分析师来源披露或预测的数字；私营估值数据不包括优先权积压或稀释后股权结构细节。 公开市场公司倍数按 2026 年 5 月的企业价值与追踪或前瞻收入计算。
