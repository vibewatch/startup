      - number: '1.5'
        title: 风险、负面信号与证据缺口
        blocks:
          - type: paragraph
            body: >-
              Castelion 面临多项重大风险，覆盖社区反对、监管暴露、业务集中和规模化执行。Project Ranger 制造园区已经引发 Rio Rancho 和 Sandoval County
              非建制地区居民的显著本地反对；居民关注静态火箭发动机点火测试噪声、高氯酸铵氧化剂和铝推进剂粉末带来的环境污染、地下水和 arroyo 径流影响、部落咨询义务，以及火灾和事故响应能力。2025 年 12 月 9
              日举行的社区会议吸引数十名居民，现场追问 Castelion CFO Andrew Kreitz 的安全和环境规程；Sandoval County 已批准该项目 $125M 工业收益债。Rio Rancho
              消防局长 James Wenzel 另行提出担忧，认为该设施的高危分类会影响市政消防服务资源。与 Sandia National Laboratories 合作的环境羽流研究，截至 2025 年 12
              月社区会议时仍在进行。从业务角度看，Castelion 是单客户公司：美国联邦政府是其唯一收入来源，且公司尚未获得量产合同（截至 2025 年 12
              月仍处于演示阶段）。公司尚未生产数千枚导弹，必须完成从原型到量产的转换——这一阶段历来成本高、耗时长。收入、烧钱速度和毛利率未公开披露。三位联合创始人带来中等程度的关键人集中。董事会结构和主要投资者治理权利未公开。国防采购项目经常遭遇延迟、范围变更和预算削减，可能对
              Castelion 的合同管线造成实质影响。
            claimRefs:
              - CO035
