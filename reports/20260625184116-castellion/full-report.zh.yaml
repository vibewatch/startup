  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础与军种分层
        blocks:
          - type: paragraph
            body: >-
              Castelion 是美国政府专属国防承包商；截至报告日，每一美元收入都来自 DoD
              合同，没有商业、盟国或民用客户。因此，公司客户基础本质上是买方垄断：美国战争部（原国防部）是唯一付款方，美国海军、美国陆军和美国空军则作为采购买方和作战使用方。海军是主要生产客户，已在 Naval Air
              Warfare Center Aircraft Division（Lakehurst, New Jersey）管理的单一 Basic Ordering Agreement（N6833526G0006）下执行
              $154.9M 固定总价合同。陆军通过 HX3/Blackbeard GL 项目成为次级客户，FY2026 预算拨款 $25M。空军是早期客户，通过 2023 年 SBIR Phase II
              合同（$1.77M，FA2385-23-C-B007）在 AF231-D026 课题下孵化 Blackbeard 项目。2025 年 1 月 Series A 公告确认，公司拥有“由 US Navy、US Air
              Force 和 US Army 资助的活跃合同”，说明在海军主导地位成型前，三军已参与。地域上，全部工作均在美国国内执行（主要在 California 州 Torrance），实弹测试则在
              Mojave、Dugway Proving Ground 等政府靶场进行。截至 2026 年 5 月，尚无对外军售或盟国采购公开确认；不过 Blackbeard 设计目标兼容
              HIMARS，而该平台由许多美国盟友使用，暗示未来可能具备 FMS 资格。现阶段客户集中度极高且有意为之：公司整个战略都把 DoD 高超音速市场作为可服务收入基础。
