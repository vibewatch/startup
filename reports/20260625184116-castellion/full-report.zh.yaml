      - number: '8.2'
        title: 估值背景与融资结构
        blocks:
          - type: paragraph
            body: >-
              Castelion 于 2025 年 12 月 5 日完成 $350 million Series B 融资，由 Altimeter Capital 和 Lightspeed Venture Partners
              共同领投，Andreessen Horowitz、General Catalyst、Lavrock Ventures、First In、Space
              VC、Cantos、BlueYard、Avenir、Champion Hill 和 Interlagos 参投。本轮对应投后估值约 $2.8 billion。各轮累计融资约 $504 million，包括
              Lavrock Ventures 的初始 $2 million 种子轮（2023 年 4 月）、$100 million Series A（2025 年 1 月；$70 million 股权加 SVB 的 $30
              million 风险债），以及 $350 million Series B。基于现有证据，Series B 是截至当日美国高超音速武器初创公司拿到的最大单轮融资。第三方收入聚合平台
              CompWorth、Growjo 和 GetLatka 对 2025 年 9 月年收入的估计集中在约 $51.5 million，与公司不断扩大的政府合同基础一致。按 100 多名员工估算，人均收入约
              $515,000。$2.8 billion 估值意味着过去收入倍数约 54×，而同期 Anduril 和 Shield AI 的区间为
              23–28×。优先股结构、清算瀑布和股权表结构均未公开披露，因此投资者无法相对于普通股独立评估有效入场价格。截至报告日期，公开来源未发现二级市场或要约收购交易为 Castelion 估值提供第三方标记。
