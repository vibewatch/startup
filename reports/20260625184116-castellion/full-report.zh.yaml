      - number: '5.3'
        title: 制造技术与 Project Ranger
        blocks:
          - type: paragraph
            body: >-
              Castelion 的制造路径，把关键子系统纵向整合与商业航空航天借来的先进生产方法结合起来。公司内部加工发动机壳体、缠绕复合材料整流罩、组装导引头电路板，并用多激光粉床增材制造（3D
              打印）制作飞控翼面和航电线束支撑托盘，使每一代部件的传统供应交付周期缩短约 10 周。金属壳体和橡胶部件来自汽车行业供应商，而非传统国防供应商，以降低材料成本。企业资源规划运行在 NetSuite
              上，生产追踪使用 Manufacturo MES（或可比 Manufacturing Execution System）。据行业来源，热防护系统（硅化碳—碳鼻锥铺层）制造良率约 70%，而量产目标为
              90%+。Castelion 已部署额外铺层管，在政府合同资金之外推进良率改进。公司在 2025 日历年生产了 50 多枚导弹试制件，在 Project Ranger 投产前验证了高频硬件策略。Project
              Ranger 是位于 New Mexico 州 Sandoval County（Rio Rancho）的 1,000 英亩高超音速制造园区，私人资本投资 $220M（Reuters 为
              $250M）。该设施面向固体火箭发动机（SRM）制造、SRM 静态测试和最终武器总装。计划中的全部 21 栋建筑目标在 2026 年底完工，首栋建筑预计 2026 年夏季交付。满产后，Project Ranger
              设计年产数千枚 Blackbeard 导弹，远高于海军 MACE 合同要求的 500 AUR/年最低门槛。公司还在 Torrance, CA（总部）、Allen, TX（FPGA 工程）和 Midland,
              TX（推进与环境测试）运营额外制造和工程设施。
