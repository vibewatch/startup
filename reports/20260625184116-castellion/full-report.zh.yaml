        - 在动力和滑翔飞行阶段提供气动控制；驱动控制面
        - 内部设计；电机和作动器来自商业 / 国防供应链
        - 具体供应商和交付周期数据未公开披露；故障模式未确认
      - - 多模 EO 末端导引头
        - 为移动和静止目标提供末端制导；支持中途重定向
        - 内部集成；EO 探测器来自国防 / 商业供应链；ITAR Category IV
        - 导引头分辨率、捕获距离和抗反制能力未确认；受出口管制
      - - FPGA 航电（Vitis HLS）
        - 高速信号处理、传感器融合和实时控制执行；可重构硬件
        - AMD/Xilinx FPGA 芯片；Vitis HLS HLS 工作流（公司招聘信息）；Allen, TX 工程中心
        - 商业 FPGA 未经抗辐射加固；高空 EMP/EMI 脆弱性未公开评估
      - - GNC 嵌入式软件
        - 惯性 + 天文中段导航；GNC 算法执行；用于验证的 HIL 仿真
        - 内部开发；实时嵌入式 OS；从固件到应用层的全栈
        - DO-178C（或 MIL 同等）软件资质未确认；未披露 GNC 模型保真度缺口
      - - 热防护系统（TPS）
        - 保护鼻锥免受 2,400°C 以上气动热载荷；防止烧蚀导致制导漂移
        - 内部制造硅化碳-碳；高压釜来自火箭喷管工装能力
        - 当前良率约 70%；Project Ranger 产率爬坡未验证；特种材料供应存在风险
      - - 飞行终止系统（FTS）
        - 车辆偏离计划轨迹时终止飞行；HIMARS 测试的靶场安全要求
        - 开发中；必须满足美国国防部靶场安全要求，才能集成 HIMARS
        - FTS 资质是陆军 HIMARS 实弹测试的关键路径依赖
      - - 火控接口（开放架构）
        - 接收来自陆军 AFATDS、Marine MAGTF AFATDS 和 Joint Fires Network 的数字火力呼叫
        - 开放接口为兼容性设计；据报告，通过了与 Joint Fires Network 的台架测试（基础 CFF 脚本）
        - 任何实弹环境下的端到端集成和作战适用性测试均未确认
      - - 制造执行系统（MES）
        - 从子装配到最终集成，跟踪生产流程、工艺路线和库存
        - NetSuite 库存管理；Manufacturo MES（或类似系统）；据招聘信息
        - Project Ranger 产量下的 MES 到生产规模成熟度未验证；ERP/MES 集成存在风险
    notes: >-
      架构条目来自公开公司材料、政府预算文件和 Castelion 招聘信息，后者作为开发信号代理。关键组件（推进剂、EO 探测器、FPGA 型号）的具体供应商名称未公开披露。截至 2026 年 5 月，所有架构元素均处于 EOC
      前原型阶段。
