  - id: FE002
    title: 客户工作流——高超声速打击任务执行
    type: flow
    layout: wide
    summary: 从威胁识别到 Blackbeard 投送，映射作战工作流，展示 Castelion 武器在各阶段的作用，以及与现有军事系统的集成触点。
    data:
      nodes:
        - id: threat-detect
          label: 威胁探测 / 目标指示
          detail: 情报、监视与侦察（ISR）系统——卫星、UAV、JTARS——识别时敏移动目标或加固固定目标。目标坐标传给火控。
          tone: neutral
        - id: fire-control
          label: 火控授权
          detail: >-
            陆军 AFATDS、海军陆战队 MAGTF AFATDS 或 Joint Fires Network 接收带目标坐标的数字呼火请求。Blackbeard 的开放火控接口接受标准 CFF
            脚本，无需定制中间件。海军型通过航母打击群 LINK-16 协同。
          tone: neutral
        - id: weapon-load
          label: 武器装载 / 平台准备
          detail: >-
            海军：Blackbeard 挂载在 F/A-18E/F 翼下挂点（或未来 F-35C 内置弹舱）。航母甲板作业需要 NAVAIR NOSSA/WSESRB 认证（尚未完成）。陆军：Blackbeard GL 装入
            HIMARS MFOM 发射箱；设计目标是换装时间等同标准 GMLRS 发射箱更换（目标 <8 分钟）。
          tone: neutral
        - id: launch
          label: 发射（空射或陆射）
          detail: 海军 F/A-18：从航母或陆上基地空射。陆军 HIMARS：每个发射箱可齐射 2 发、每车 4 发；一个 8 台发射车的连可齐射 32 发高超声速弹。CAML-M（未来）：乘员撤离；在卫星中继控制下自主发射。
          tone: positive
        - id: boost-glide
          label: 助推 / 高超声速滑翔阶段
          detail: >-
            固体火箭发动机燃烧约 12 秒，将飞行器推至 Mach 5 以上。级间分离后，气动壳脱落，楔形滑翔体沿低伸弹道飞行，低于传统弹道弧线。中段采用惯性 +
            天文导航。速度和弹道轮廓把对手从探测到反应的周期从数分钟压到数十秒。
          tone: positive
        - id: terminal
          label: 末制导与打击
          detail: >-
            多模 EO 末端导引头在末段捕获并跟踪目标。飞行中重定向支持时敏移动目标（TEL、舰船、C2 车辆）。宣称在 600 km 距离 CEP <2 m（defense-aerospace.com
            给出的设计目标；未独立验证）。打击战斗部：75 lb（海军）或 220 lb 单体 / 侵彻型（陆军 GL 设计目标）。
          tone: positive
        - id: battle-damage
          label: 战斗毁伤评估
          detail: 打击后 BDA 通过 ISR 完成。没有 Castelion 专属 BDA 技术；依赖现有联合 ISR 架构。弹药补充取决于 Project Ranger 产能（目标数千枚 / 年）以及来自 NM 的物流链。
          tone: neutral
    approximationNotes: null
    claimRefs:
      - CE003
      - CE009
      - CE010
      - CE024
      - CE025
