      - number: '4.2'
        title: 单位经济性与成本架构
        blocks:
          - type: paragraph
            body: >-
              Castelion 的商业假设，压在一个核心主张上：相较能力相近的传统高超音速武器，成本可降 10x。美国陆军 PrSM Increment 1 单枚约 $1.6M，带双模导引头的 Increment 2 约
              $5.35M。海军 MACE 项目要求把 All Up Round 单价压到 $300,000 以下，且最低年产 500 枚 AUR；若达标，Blackbeard
              将成为美国库存中迄今最便宜的远程高超音速打击武器。海军 FY2027 早期采购规划为 353 枚导弹安排 $156M，隐含首批量产单价约 $442K；这是学习曲线把成本继续推向 $300K
              目标之前的起点。支撑这套成本结构的，是 Castelion
              对固体火箭发动机、控制作动系统、导引头、飞控计算机、热防护系统的纵向整合，以及用商业汽车行业供应商提供金属壳体和橡胶部件，绕开国防供应链通常附加的溢价。按第三方数据估算，公司人均收入约
              $515K；对资本密集型硬件制造商而言偏高，但这更多反映早期合同结构，而不是成熟毛利信号。毛利率、运营费用，以及量产后的真实单位经济性均未披露。没有可用的一手财务报表；收入完全来自政府，也缺少可公开比较的私营国防初创公司利润率基准。The
              War Zone 报道称，Blackbeard 的飞行剖面是否符合高超音速的严格定义仍有不确定性；这会影响成本对标，因为“高超音速”标签决定了项目预算科目和单枚采购上限。
