      - number: '4.3'
        title: 资本充足性与资金跑道
        blocks:
          - type: paragraph
            body: >-
              Castelion 自 2022 年 11 月成立以来，五轮融资合计约 $504M。2025 年 1 月完成的 Series A 约 $100M，其中 $70M 为股权融资，由 Lightspeed
              Venture Partners 领投，Andreessen Horowitz、Lavrock Ventures、Cantos、First In、BlueYard Capital、Interlagos 参投；另有
              Silicon Valley Bank 提供的 $30M 风险债。2025 年 12 月完成的 $350M Series B 由 Altimeter Capital 和 Lightspeed Venture
              Partners 领投，Andreessen Horowitz、General Catalyst、Lavrock Ventures、First In、Space
              VC、Cantos、BlueYard、Avenir、Champion Hill、Interlagos 参投。Series B 后估值约 $2.8B。已披露的最大资本开支，是 Project Ranger：公司在
              New Mexico 州 Rio Rancho（Sandoval County）建设一座 1,000 英亩固体火箭发动机制造园区，私人投资 $220M。Project Ranger 于 2026
              年初破土，首栋建筑计划 2026 年夏季交付，全部 21 栋建筑预计 2026 年底完工并具备投产条件。园区将创造 300 个高薪岗位，并预计十年内带来 $650M 经济产出。月度资金消耗率、Series B
              之外的现金余额、剩余项目融资需求均未公开，构成实质性承销缺口。考虑到 $350M Series B 距 2026 年 5 月报告日仅六个月，同时海军和陆军合同带来收入爬坡，资本充足性看起来足以支撑至少 12–18
              个月运营；但导弹制造和工厂投产极其耗资本，下一轮融资事件或生产合同里程碑，将决定长期跑道。
