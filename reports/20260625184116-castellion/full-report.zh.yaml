      - number: '7.4'
        title: 伙伴、供应链与依赖风险
        blocks:
          - type: paragraph
            body: >-
              Castelion 供应链存在结构性单点故障：American Pacific Corporation（AMPAC）是美国国内唯一大规模航空航天级高氯酸铵供应商。截至 2026 年 5
              月，美国没有第二家具备规模的 AP 供应商。多项导弹项目同步拉动需求——HIMARS 补库、THAAD、Tomahawk、PAC-3，以及新的 DoW Arsenal of Freedom 计划——已使 AP
              供给承压。美国战争部 2026 年 1 月以 $1B 直接股权投资 L3Harris Missile Solutions（原 Aerojet
              Rocketdyne）来扩大固体火箭发动机产能，承认了这一脆弱点；但这笔投资解决的是 SRM 总装产能，而非上游 AP 瓶颈。Castelion 纵向整合的 Project Ranger 旨在减少外部 SRM
              采购，但 AP 原料仍依赖 AMPAC。客户侧，Castelion 收入近 100%
              集中于美国政府合同，未披露商业或盟国多元化。公司与美国战争部的条件性生产框架协议，在下达生产订单前需要单独国会拨款；预算封存、CR 持续决议或 DoW 优先级变化，都可能推迟或削减订单量。DoD
              飞行测试靶场也是另一个排期依赖，靶场可用性可能推迟里程碑达成和合同转化时间。
