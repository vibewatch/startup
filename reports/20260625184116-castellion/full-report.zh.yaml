      - number: '2.5'
        title: 竞争格局与替代品
        blocks:
          - type: paragraph
            body: >-
              高超音速武器市场有两个不同竞争层级。传统主承包商层级——Lockheed Martin、Raytheon/RTX 和 Northrop Grumman——掌握了历史上多数 DoD
              高超音速合同金额。Lockheed 以 ARRW 和 LRHW 项目领先；Raytheon 是 Hypersonic Attack Cruise Missile（HACM）的主承包商；Northrop
              为多个项目提供关键子系统。这些既有厂商的竞争优势在于长期项目关系、集成经验和涉密项目通道。

              Castelion 所处的新进入者层级，由速度和成本定义。在 MACE 项目中，Castelion 的 Blackbeard 已经胜出，替代了包括已取消 HALO/OASuW Increment 2
              在内的传统项目。在 LCCM 巡航导弹项目中，另外四家新进入者（Anduril、CoAspire、Leidos、Zone 5 Technologies）持有平行 DoW 框架协议；如果高超音速 /
              巡航导弹边界变模糊，或国会把类似 MACE 的项目扩大到巡航导弹替代品，它们可能成为未来竞争者。尤其是 Anduril，拥有深厚 VC 支持和广泛国防产品组合，可能支撑竞争性交叉销售。

              对 Castelion 最有利的结构性竞争动态，是海军明确否定既有路径：已取消的 HALO 项目和 MACE 项目约 $384K /
              枚的成本上限，实际上让传统高超音速主承包商难以在同等规模上竞争，因为它们的按成本设计传统从根上不同。这并不排除传统主承包商通过调整或并购切入低成本高超音速细分；这一点仍是未解决的尽调问题。
