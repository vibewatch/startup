        title: 图表材料
        blocks:
          - type: callout
            title: 美国国防科技初创公司获得的最大高超音速生产框架
            body: >-
              2026 年 5 月，美国战争部围绕 Blackbeard 给出生产框架：年产至少 500 枚导弹，并提供五年 12,000+
              枚的选项，合计潜在价值达数十亿美元。这是低成本高超音速武器首次获得此类生产导向协议。再加上截至 2026 年 4 月已执行的 $155M+ 海军合同，以及分配给 MACE 和 Blackbeard 相关项目的
              FY2026 联邦资金总额约 $379M，截至 2026 年 5 月报告日，这是任何非传统高超音速进入者可见的最强政府需求信号。
            calloutType: strength
