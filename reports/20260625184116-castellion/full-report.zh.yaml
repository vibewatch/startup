      - CV026
      - CV028
      - CV033
  - id: TV006
    title: 最终尽调问题清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 量产规模下的毛利率
        - 每枚 All Up Round 在年产 500、1,000 和 5,000 枚时的毛利率；按子系统拆分的当前及预测物料清单。
        - 没有毛利率数据，就无法压力测试 $2.8B 估值；如果在 $300K/AUR 单价下毛利率接近零， 论点就完全依赖规模和政府连续性，而不是产品经济性。
        - 数据室：索取生产成本模型（2025 财年实际 + 2026 财年估计 + 稳态预测）。负责人： CFO（Kreitz）。
      - - Series B 后的烧钱速度和现金跑道
        - 2026 年一季度月度现金消耗；Series B 完成交割后的现金余额；2026 财年现金流预测。
        - 判断 $350M Series B 是否足以撑到 Project Ranger 投用和生产合同里程碑， 还是收入拐点前的年中就需要过桥融资。
        - 数据室：索取 2026 年 1–4 月月度管理账和 24 个月现金流模型。负责人： CFO。
      - - Project Ranger 资本开支进度和剩余义务
        - 已投入 Project Ranger 的资本 vs. 仍需支出的资本；与里程碑挂钩的提款计划。
        - 如果 $350M Series B 款项中仍有全部 $220M 要投向 Project Ranger，运营可用资金只有约 $130M—— 在生产合同签署前可能不够。
        - 数据室：索取 Project Ranger 建设进度、已承诺采购订单和完工所需资本估算。负责人： COO（Pitt）。
      - - 股权结构和优先权栈
        - 完全稀释股权结构，包括全部期权池、认股权证、SAFEs 和可转债；各轮清算优先权条款。
        - 在 $2.8B 名义估值下，大量优先权积压可能意味着，只要退出价格低于 2–3 倍跃升， 普通股和期权持有人实际拿到的远低于名义估值。
        - 数据室：索取最新 capitalization table、投资人权利协议和公司注册证书。负责人：总法律顾问。
      - - 完整飞行测试记录
        - 完整 Blackbeard 测试活动结果，包括任何未达到飞行目标的测试弹；证明持续高超音速的飞行性能数据。
        - The War Zone 和陆军预算文件都提到，Blackbeard 是否能持续达到 Mach 5+ 仍不确定； 未确认的测试失败可能推翻 MACE 项目预算项和 DoW 框架。
        - 向 Navy 和 Army 项目办公室索取涉密和非涉密测试报告；或索取 Castelion 内部测试摘要及飞行测试数据。 负责人：CEO（Hargis）和相关项目执行办公室。
      - - 生产合同转化时间表
        - DoW 生产框架转化为有约束力的多年采购合同时，所需的具体合同条件、里程碑和日期。
        - 框架的非约束性是估值风险的最大单一来源；在以 $2.8B 估值投入资本前， 必须弄清转化关口，以及是否仍有技术或政治条件未满足。
        - 通过数据室索取完整 DoW 生产框架协议，包括全部先决条件。负责人：CEO（Hargis）； 相关 DoD 对口：负责采办的国防部副部长办公室。
      - - 国际销售和盟友采购潜力
        - 与任何盟国政府（Australia、Japan、UK、ROK）围绕 Blackbeard 采购的沟通状态； 影响国际销售的任何出口管制限制。
        - 盟友采购会在美国 DoD SAM 之外带来实质收入倍数，并可能显著改善牛市情景回报路径。
        - 索取任何 ITAR/EAR 出口许可申请，以及国际政府讨论记录。负责人： COO（Pitt）。
    notes: 截至 2026 年 5 月报告日期，本清单所有事项都无法通过公开来源解决；每一项都需要在适当 NDA 下进入安全数据室。
    claimRefs:
      - CV023
      - CV024
      - CV026
      - CV035
