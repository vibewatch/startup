      - number: '5.2'
        title: 武器系统架构与子系统
        blocks:
          - type: paragraph
            body: >-
              Blackbeard 的武器系统架构，由 Castelion
              自研自制的六个核心子系统纵向整合而成：固体火箭发动机推进、控制作动系统（CAS）、飞控计算机、多模导引头、热防护材料和任务软件。这一路径切断了对传统国防主承包商—分包商供应链的依赖，也是 Castelion
              相较既有厂商压缩交付周期、降低单枚成本的主要机制。推进系统采用固体燃料火箭；地射变体使用两级构型，发射发动机燃烧约 12 秒，将滑翔体推至 Mach 5
              以上，随后气动外壳分离，楔形滑翔体沿压低弹道飞行，使雷达跟踪更困难，也压缩点防御系统反应时间。制导、导航与控制（GNC）在中段使用带天文更新的惯性导航，末段切换至多模电光（EO）末制导导引头，用于最终打击机动和加固目标。导引头支持飞行中更新，可重新瞄准时敏机动目标。航电围绕现场可编程门阵列（FPGA）处理构建，采用
              AMD/Xilinx 的 Vitis HLS（High-Level Synthesis）工作流，为传感器融合、作动器控制和 GNC 算法执行提供高性能、可重构计算。嵌入式飞行软件覆盖从微控制器低层固件到应用层
              GNC 算法的全栈，并通过硬件在环（HIL）仿真验证。鼻锥热防护采用硅化碳—碳铺层材料，可承受 2,400°C 以上温度，并在一台由火箭发动机喷管制造工具改造的小型热压罐中固化。所有 HIMARS 靶场作业都需要
              Flight Termination System（FTS）；该系统正在开发中，以便武器获得陆军 HIMARS 火控系统资格。可行处，公司以车规级部件替代传统航天级硬件；COO Sean Pitt
              称，这把部件交付周期从 52 周（航天级）压缩到数周，可靠性则由每年数百亿美元商业验证投资背书，达到可比水平。
