  - id: product-and-milestones
    title: Product, Contracts, and Milestones
    body: >-
      Castelion's flagship product, Blackbeard, is a seeker-guided precision hypersonic strike weapon engineered from
      inception for mass production, low cost, and rapid fielding. The weapon is designed for integration with existing
      platforms including the M142 HIMARS and MLRS family of munitions launchers (Blackbeard GL, ground launch variant)
      as well as naval and air-launched configurations. An air-launched variant for the F/A-18 Super Hornet has an
      estimated range of approximately 497 miles (800 km) and achieves speeds exceeding Mach 5. The weapon is designed
      to deliver approximately 80% of the capability of the Precision Strike Missile (PrSM) Increment 4 at a
      significantly reduced cost per unit, with the Army targeting single-digit millions of dollars per round versus the
      $40 million or more for legacy hypersonic weapons. Castelion conducted more than 20 development flight tests in
      2025, validating internally manufactured solid rocket motors, control actuation systems, flight computers, seekers,
      thermal protection materials, and mission software. The company produced more than 50 test missiles in 2025.
      Key government relationships include active contracts with the U.S. Navy, U.S. Air Force, and U.S. Army. In
      October 2025, the Army and Navy awarded integration contracts for Blackbeard with operational platforms. In
      February 2026, the Navy awarded a $49.9 million contract for F/A-18 integration and prototype development, with
      work expected through November 2027. On April 24, 2026, the U.S. Navy awarded a $105 million contract to
      integrate Blackbeard on the F/A-18 Super Hornet and transition to Early Operational Capability in 2027. The U.S.
      Army's FY2026 budget request allocates $25 million for the Blackbeard GL program (designated HX3), with plans for
      a prototype proof-of-concept demonstration in early FY2026, followed by delivery of 10 minimum viable product
      prototypes for HIMARS flight testing. If successful, the Army could begin receiving production Blackbeard missiles
      as early as FY2028. Total government contracts as of December 2025 exceeded $100 million. Project Ranger, the
      company's 1,000-acre solid rocket motor manufacturing and final assembly campus in Rio Rancho, New Mexico, broke
      ground on January 21, 2026, representing more than $220 million in private investment with 300+ high-paying jobs
      projected and an estimated $650 million in economic impact for New Mexico over ten years. The first building is
      expected to be completed in summer 2026, with all 21 campus buildings operational by end of 2026.
