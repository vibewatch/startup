callouts:
  - calloutType: strength
    title: SpaceX-Lineage Founding Team with Defense-Specific Government Access
    body: >-
      All three co-founders—Hargis, Pitt, and Kreitz—held senior roles at SpaceX specifically in government sales,
      defense program management, and finance, giving Castelion an unusually direct path to U.S. DoD relationships
      and a first-principles manufacturing philosophy proven in the commercial space sector.
    claimRefs:
      - CO008
      - CO009
      - CO010
      - CO011

  - calloutType: strength
    title: Fastest Prototype-to-Integration Trajectory in Modern Hypersonics
    body: >-
      From first investment in April 2023 to Army and Navy integration contract awards in October 2025 is approximately
      30 months. In 2025 alone, Castelion conducted 20+ flight tests and produced 50+ test missiles—a pace that
      exceeds legacy prime contractors who average 2-4 flight tests per year on similar programs.
    claimRefs:
      - CO022
      - CO023
      - CO026

  - calloutType: risk
    title: No Production Contract and Single-Customer Revenue Concentration
    body: >-
      As of May 2026, Castelion has not yet secured a production contract; all revenue derives from demonstration,
      integration, and development contracts with the U.S. government. The company is entirely dependent on continued
      government program funding—any budget cut, program restructure, or political shift could materially impair its
      trajectory. Revenue, burn rate, and margin are not disclosed.
    claimRefs:
      - CO035
      - CO036
      - CO037

  - calloutType: risk
    title: Project Ranger Environmental and Community Opposition Risk
    body: >-
      Castelion's 1,000-acre New Mexico solid rocket motor campus has generated significant community opposition over
      noise, ammonium perchlorate contamination risks, groundwater hazards, and fire response capacity. A Sandia
      National Laboratories environmental plume study was still underway in December 2025. Regulatory delays or
      environmental remediation requirements could push out the facility timeline and increase capital requirements.
    claimRefs:
      - CO035
      - CO039
      - CO040

  - calloutType: insight
    title: Project Ranger Economics Depend on Production Contract Timing
    body: >-
      Castelion's $220M+ Project Ranger investment and scale-up to 1,000+ missiles per year requires a production
      contract before the investment delivers positive return. The Army has signaled potential FY28 production
      procurement, but the timeline is contingent on successful prototype demonstrations in FY26 and FY27 integration
      milestones on the F/A-18.
    claimRefs:
      - CO028
      - CO029
      - CO033
      - CO034

