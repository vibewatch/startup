company:
  name: Castelion
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Castelion is a Torrance, California-based defense technology company founded in November 2022 by three former SpaceX
    executives—Bryon Hargis (CEO), Sean Pitt (COO), and Andrew Kreitz (CFO)—to develop and mass-produce affordable
    hypersonic strike weapons for the U.S. military. The company has raised approximately $464 million across seed,
    Series A, and Series B rounds (latest valuation $2.8 billion, December 2025), secured over $100 million in
    government contracts with the Army and Navy, and is building Project Ranger, a 1,000-acre manufacturing campus in
    Rio Rancho, New Mexico, targeting production of thousands of Blackbeard hypersonic missiles per year.
sections:
  - id: identity-and-founding
    title: Identity and Founding
    body: >-
      Castelion is a privately held defense technology company headquartered in Torrance, California, with additional
      engineering, manufacturing, and test operations in Los Angeles County (California), Midland (Texas), Allen
      (Texas), and a Washington D.C. policy office. The company also operates a new 1,000-acre solid rocket motor
      manufacturing campus in Rio Rancho, Sandoval County, New Mexico, known as Project Ranger. Castelion was founded
      in November 2022 by three former SpaceX executives who left the company together to address what they describe as
      a critical gap in U.S. conventional deterrence: the absence of affordable, mass-producible hypersonic long-range
      strike weapons. The company's mission is to restore America's hypersonic manufacturing capacity against adversaries
      China and Russia, which have deployed operational hypersonic systems ahead of the United States. Castelion
      operates as a hardware-intensive, vertically integrated manufacturer, applying the SpaceX "build fast, test often"
      philosophy to the defense sector. The company's first and primary product is the Blackbeard hypersonic strike
      weapon, engineered from inception for industrial-rate output and commercial unit cost. Castelion's stated goal is
      to achieve production of more than 1,000 Blackbeard missiles per year once Project Ranger is fully operational,
      and eventually scale to thousands per year to provide the U.S. and its allies with meaningful magazine depth.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
      - CO005
      - CO006
      - CO007
    figureRefs:
      - FO002

  - id: leadership-and-governance
    title: Leadership and Governance
    body: >-
      Castelion was co-founded by three former SpaceX alumni, each bringing complementary expertise to the company.
      Bryon Hargis, CEO and co-founder, previously served as Government Sales Director at SpaceX, managing national
      security satellite programs and building a multi-billion-dollar defense pipeline. He holds an M.S. in Applied
      Physics from Johns Hopkins University and a B.S. in Mechanical Engineering from Georgia Tech. Sean Pitt, COO and
      co-founder, led SpaceX's European commercial launch and human spaceflight sales, executing over $1.25 billion in
      export deals, bringing deep knowledge of complex international defense sales and operations. Andrew Kreitz, CFO
      and co-founder, led launch forecasting and government cost proposals at SpaceX and was previously a Vice President
      at Goldman Sachs focusing on aerospace and defense mergers and acquisitions, giving the company an unusual
      combination of financial rigor and defense program expertise. All three departed SpaceX in November 2022 to
      co-found Castelion. The leadership team has since grown to include experienced engineers and operators from
      SpaceX's Falcon 9 and Dragon capsule programs as well as veterans from legacy contractors including Lockheed
      Martin and Raytheon. The board structure is not publicly disclosed. Castelion's investors—including Altimeter
      Capital, Lightspeed Venture Partners, and Andreessen Horowitz—likely hold board observer or director seats
      commensurate with their investment positions, but this has not been confirmed in public sources. Key-person
      dependence is elevated given the founding team's centrality to government relationship management and the
      company's early-stage operational maturity.
    claimRefs:
      - CO008
      - CO009
      - CO010
      - CO011
      - CO012
      - CO013
    tableRefs:
      - TO002

  - id: funding-and-valuation
    title: Funding History and Valuation
    body: >-
      Castelion has raised approximately $464 million across multiple rounds since its founding. The company's first
      external capital came from Alex Poulin's Lavrock Ventures, which invested $2 million in April 2023 after
      witnessing the founders' persistence through early bootstrap operations in Los Angeles-area warehouses and machine
      shops. Within one month of that first investment, Castelion won a $5 million government contract—its first—on its
      initial submission. A formal Seed round of $14.2 million was announced in October 2023, co-led by Andreessen
      Horowitz (a16z) and Lavrock Ventures, with participation from First In, BlueYard Capital, and Champion Hill
      Ventures. In January 2025, Castelion announced a $100 million financing comprising $70 million in Series A equity
      led by Lightspeed Venture Partners with participation from a16z, Lavrock Ventures, Cantos, First In, BlueYard
      Capital, and Interlagos, plus $30 million in venture debt from Silicon Valley Bank (final close February 2025).
      On December 5, 2025, Castelion announced its Series B round of $350 million, led by Altimeter Capital and
      Lightspeed Venture Partners with participation from Lavrock Ventures, Andreessen Horowitz, General Catalyst,
      First In, Space VC, Cantos, BlueYard, Avenir, Champion Hill, and Interlagos. The Series B valued Castelion at
      approximately $2.8 billion. Total capital raised stands at approximately $464 million (equity plus debt). The
      rapid valuation trajectory—from first external capital in April 2023 to a $2.8 billion valuation 32 months later—
      reflects strong government contract momentum, multiple successful flight test campaigns, and broad institutional
      investor confidence in the company's technical and manufacturing approach.
    claimRefs:
