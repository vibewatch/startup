companyProfile:
  summary: >-
    Castelion is a Torrance, California-based defense startup founded in November 2022 by former SpaceX executives Bryon Hargis,
    Sean Pitt, and Andrew Kreitz. The company is developing the Blackbeard family of air- and ground-launched hypersonic strike
    weapons and a vertically integrated production system intended to bring hypersonic cost and cycle times down to something the
    U.S. military can procure in volume. By May 2026, Castelion had raised approximately $464M, announced a December 2025 Series B
    at an implied $2.8B valuation, and secured meaningful Navy, Army, and Air Force contract activity — but it still had no public
    proof of scaled production revenue, disclosed margins, or binding multi-year production orders.
  foundedDate: '2022-11-01'
  founders:
    - name: Bryon Hargis
      role: CEO
      background: Former SpaceX Government Sales Director who managed national-security launch programs; applied physics and mechanical engineering background.
      claimRefs: [CO008]
    - name: Sean Pitt
      role: COO
      background: Former SpaceX commercial-launch and human-spaceflight sales leader who previously executed more than $1.25B in export deals.
      claimRefs: [CO009]
    - name: Andrew Kreitz
      role: CFO
      background: Former SpaceX launch-forecasting and government-cost-proposal lead; previously a Goldman Sachs aerospace and defense M&A banker.
      claimRefs: [CO010]
  foundingLocation: Torrance, CA, USA
  headquarters: Torrance, CA, USA
  productSummary: >-
    Castelion's flagship product is Blackbeard, a low-cost hypersonic strike weapon family spanning an F/A-18-integrated air-launched variant
    and a HIMARS-compatible ground-launched variant. The company pairs the weapon program with Project Ranger, a New Mexico manufacturing campus
    intended to support vertically integrated solid-rocket-motor production, final assembly, and high-cadence testing.
  customerFocus: >-
    U.S. Department of War / Department of Defense customers, especially the U.S. Navy, U.S. Army, and U.S. Air Force programs seeking affordable,
    rapidly manufacturable long-range strike capacity.
  businessModel: >-
    Revenue comes from government development, integration, test, and prototype contracts today, with the forward business case centered on converting
    those efforts into multi-year production contracts for Blackbeard missiles and related manufacturing capacity.
  stage: Series B
  fundingStatus: >-
    Raised approximately $464M to date, including a $350M Series B announced in December 2025 at an implied $2.8B valuation; management also disclosed
    a $30M venture-debt facility from SVB.
  disclosureProfile: private-undisclosed
  claimRefs: [CO003, CO006, CO019, CO020, CO021, CO028, CI001, CI003, CI009, CI012]
summary:
  headline: >-
    Castelion combines rare DoD demand pull, credible founder-market fit, and a manufacturing-first thesis that could matter if the Pentagon truly shifts
    hypersonics from boutique programs to mass procurement, but the current ~$2.8B valuation already prices in substantial execution and production success.
