summary:
  headline: >-
    Castelion 同时具备罕见的 DoD 需求牵引、可信的创始人-市场匹配，以及制造优先的投资逻辑；如果 Pentagon 真的把高超音速武器从精品项目转向规模采购，这套逻辑会变得重要。但当前约 $2.8B
    估值已经计入了相当多执行和量产成功。
