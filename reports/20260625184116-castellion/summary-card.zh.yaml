  topStrengths:
    - 真实客户需求已经出现：Navy、Army 和 Air Force 项目都已为 Blackbeard 提供资金；截至 2026 年 4 月，仅 Navy 就已执行约 $154.9M 合同金额。
    - 对制造密集型防务创业公司来说，创始人-市场匹配异常强；三位联合创始人都来自 SpaceX，职责覆盖政府销售、运营、预测和成本纪律。
    - Project Ranger 和公司低成本生产叙事，贴合 Pentagon 真实优先级变化：从只追求精密高超音速系统，转向可负担的弹药纵深。
  topRisks:
    - 公司几乎完全依赖单一买方生态：美国政府。预算转向、测试失败或采办政策逆转，都可能迅速重置收入预期。
    - 相比已披露证据，估值已经激进；Castelion 尚未拿出通常足以支撑 $2.8B 定价的审计收入、生产利润率或已执行多年制造订单。
    - 技术和工业执行风险仍高：Blackbeard 必须通过集成、安全和实弹里程碑，同时 Project Ranger 还要爬坡新的导弹制造园区。
    - Project Ranger 周边的社区和环保反对，可能在公司最需要建立制造可信度时拖慢许可、设施建设或政治支持。
  unresolvedGaps:
    - 没有公开的审计收入、烧钱速度、现金余额或毛利率数据；资本充足性承销仍依赖间接信号，而不是硬财务报表。
    - Department of War 框架公告不等于有约束力的生产合同；时间表、单位经济和实际 take-or-pay 承诺仍未被证明。
    - 公开来源里，Blackbeard 的持续性能包线和确切高超音速分类仍部分不透明；需求信号有多少依赖未来测试成功，仍有残余不确定性。
    - 员工数、客户数和收入数据部分依赖第三方估计或分类推断，不是管理层认证披露。
    - 可出口性、ITAR 姿态以及未来盟友市场路径仍不清楚；长期市场可能比当前只围绕 Pentagon 的叙事更窄。
