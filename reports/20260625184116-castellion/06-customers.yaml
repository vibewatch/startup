- id: navy-mace-carrier-integration
  title: 'U.S. Navy: MACE Program and Carrier Air Wing Adoption'
  body: 'The U.S. Navy is Castelion''s dominant customer and the primary driver of near-term contract revenue. The Naval Air
    Systems Command (NAVAIR) first signaled demand through a February 2024 Request for Information for the Multi-mission Affordable
    Capacity Effector (MACE) program, seeking an affordable air-launched stand-off hypersonic weapon for the F/A-18E/F Super
    Hornet and, as an objective, internal carriage on the F-35A/C. Castelion''s Blackbeard was confirmed in April 2026 as
    the first weapon selected under the MACE program. The procurement timeline has been exceptionally fast: the initial $49,998,005
    contract (order N6833526F1022 against BOA N6833526G0006) was awarded on February 25, 2026, funding full-scale Blackbeard
    prototypes, flight testing, and early operational capability under SBIR Phase III terms. Less than two months later, on
    April 24, 2026, a $104,998,566 contract modification (P00001) was executed, funding final integration requirements, system
    safety and airworthiness certification, and live-fire test events in the Indo-Pacific Command area of responsibility—confirming
    the Navy''s operational theater priority and sustained commitment. The cumulative executed Navy contract value reached
    $154.9M through April 2026. Pentagon budget documentation released in April 2026 reveals the Navy plans to procure 4,500
    Blackbeard missiles for the F/A-18E/F fleet over the next five years, at an average unit cost of approximately $384,000.
    FY2027 procurement planning specifically allocates $156M for 353 missiles in the first production lot. Subsequent lots
    escalate significantly: FY2028 targets 691 AURs, FY2029 targets 976 AURs, FY2030 targets 1,115 AURs, and FY2031 targets
    1,375 AURs—implying the Navy expects Blackbeard to become the most numerous hypersonic strike munition in its carrier
    air wing inventory. The MACE program represents a departure from legacy hypersonic procurement: it relies on Other Transaction
    Authority combined with SBIR Phase III fixed-price contracting to accelerate timelines and compress administrative overhead.'
