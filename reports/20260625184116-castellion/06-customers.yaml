- id: army-hx3-ground-launch
  title: 'U.S. Army: HX3 Ground-Launch Program and HIMARS Integration'
  body: The U.S. Army is Castelion's secondary active customer and the driver of the ground-launched Blackbeard variant (designated
    Blackbeard GL or HX3). Army senior leaders approved an urgent requirement for Blackbeard GL in May 2025, directing the
    Rapid Capabilities and Critical Technologies Office to advance the program under the umbrella of a new Common Autonomous
    Multi-Domain Launcher (CAML) effort. The Army allocated $25M in FY2026 budget for Blackbeard GL development and structured
    the program as a two-phase Middle Tier Acquisition rapid prototype effort under a fixed-price Other Transaction Authority.
    Phase I required delivery of a proof-of-concept flight using a government-furnished MFOM pod, targeting demonstration
    between January and March 2026. Phase II calls for ten production-representative rounds for HIMARS-launched flight tests,
    targeting completion by the end of FY2026. The Army's stated objective is an 80% capability match to the future Precision
    Strike Missile Increment 4 at significantly reduced cost, filling a "low" tier in the Army's high-low long-range fires
    mix. Army budget documents project $120M in additional HX3 spending across FY2027-2029, and the service expects to begin
    receiving Blackbeard missiles for fielding in early FY2028 if Phase II testing is successful. Blackbeard GL is designed
    for HIMARS compatibility as an interim solution, with CAML as the primary launcher in the out-years. The Army's commitment
    is evidenced by Lt. Gen. Frank Lozano (Portfolio Acquisition Executive Fires) attending the Project Ranger groundbreaking
    in January 2026—a signal of senior customer engagement beyond contract paperwork. Defense Aerospace estimated Blackbeard
    GL's low-rate initial production cost at under $7M per round, versus more than $40M for the Long Range Hypersonic Weapon—a
    6-8x cost reduction that is central to the Army's magazine-depth rationale.
