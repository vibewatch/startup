callouts:
- calloutType: strength
  title: Multi-Service Contract Breadth with Rapid Escalation
  body: All three U.S. military services have funded Blackbeard at some point, and the Navy has escalated from a $49.9M contract
    to a $154.9M cumulative commitment in under 60 days. The DoW production framework projecting 12,000+ missiles over five
    years is the most explicit long-range demand signal any commercial hypersonic startup has received from a major military.
  claimRefs:
  - CU001
  - CU003
  - CU011
  - CU012
- calloutType: risk
  title: Extreme Single-Customer Concentration with Conditional Production
  body: 100% of Castelion's revenue derives from a single customer (the U.S. government) with no binding production contract
    in place as of May 2026. The DoW framework's "minimum 500/year" production commitment is explicitly contingent on completing
    testing and validation; any test failure, program restructure, or budget rescission would leave Castelion's Project Ranger
    manufacturing investment ($220-250M private capital) without committed offtake.
  claimRefs:
  - CU029
  - CU034
  - CU040
- calloutType: risk
  title: Community and Environmental Friction at Project Ranger
  body: The Project Ranger manufacturing campus faces organized community opposition in Sandoval County over perchlorate contamination,
    noise, groundwater risk, and chemical handling. While the DoD as customer is unaffected, permit delays, environmental
    remediation requirements, or community lawsuits could delay manufacturing ramp, jeopardizing the production contract fulfillment
    timeline that the DoW framework depends on.
  claimRefs:
  - CU025
  - CU026
- calloutType: insight
  title: SBIR Phase III as Strategic Contracting Vehicle
  body: The SBIR Phase III mechanism originated from a 2023 Air Force SBIR topic, yet has been used to sole- source both Navy
    ($154.9M executed) and Army ($25M+ planned) contracts without competitive re-solicitation. This legal pathway is a significant
    structural advantage, insulating Castelion from competitive protests while compressing acquisition timelines—but it also
    means a single GAO challenge to Phase III eligibility could disrupt the entire multi-service contracting approach.
  claimRefs:
  - CU002
  - CU015
