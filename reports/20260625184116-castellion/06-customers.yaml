  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: navy-procurement-binding
    missingEvidence: A binding multi-year production contract (as opposed to the conditional framework agreement) has not
      been awarded as of May 2026. The actual production volumes, unit prices, and delivery schedules under any future MYP
      contract are entirely private or non-existent.
    whyItMatters: The difference between a framework agreement and a binding production contract is the difference between
      an aspiration and committed revenue. No production revenue flows until the framework converts to an executed contract.
    diligencePath: Request DoD contract award notifications via SAM.gov for any MYP contract awarded to Castelion after testing
      and validation milestones are declared complete; monitor DoD contract awards database.
    relatedQuestionRefs:
    - QU006
    - QU022
  - type: missing-source
    severity: material
    topic: contract-protests
    missingEvidence: No evidence found of GAO bid protests, Inspector General referrals, or competitive procurement challenges
      against any of Castelion's SBIR Phase III contracts. The absence of evidence is not conclusive proof of absence.
    whyItMatters: A successful GAO challenge to SBIR Phase III sole-source eligibility could force competitive re-solicitation
      of all Navy and Army contracts, disrupting the contracting structure and potentially delaying production.
    diligencePath: Search GAO Bid Protest Decisions database at gao.gov/legal for "Castelion" or "N6833526"; request DoD IG
      status on any open investigations into SBIR Phase III multi-service contracting practices.
    relatedQuestionRefs:
    - QU013
  - type: missing-source
    severity: material
    topic: test-campaign-failures
    missingEvidence: No public disclosure of failed, aborted, or anomalous flight tests in Castelion's 25+ test campaign exists.
      Company communications describe only successes.
    whyItMatters: The DoW production framework is explicitly contingent on completing testing and validation. Any undisclosed
      test anomalies affecting propulsion, guidance, or thermal protection could delay or prevent validation milestone achievement.
    diligencePath: Request full flight test log from Castelion data room; review any DoD range safety reports filed at White
      Sands, Dugway, or Mojave for Castelion test events; obtain RCTA technical evaluation reports.
    relatedQuestionRefs:
    - QU017
    - QU009
  - type: enumeration-incomplete
    severity: minor
    topic: fms-eligible-nations
    missingEvidence: No public list of which U.S. allies have received security assistance briefings on Blackbeard or been
      notified of potential FMS eligibility is available.
    whyItMatters: Allied FMS sales could significantly expand the customer base and production volumes beyond current DoD-only
      projections; absence of data prevents assessment of this upside.
    diligencePath: Request DSCA (Defense Security Cooperation Agency) case status; inquire with State Department's Office
      of Regional Security and Arms Transfers about Blackbeard MTCR classification and export eligibility.
    relatedQuestionRefs:
    - QU015
  - type: private-evidence-only
    severity: material
    topic: retention-nrr-metrics
    missingEvidence: No NRR, GRR, contract renewal percentage, or other commercial retention metric is disclosed or applicable
      to Castelion's government-only revenue model. Proxy indicators (contract expansions) are positive but incomplete.
    whyItMatters: Without standard retention metrics, evaluating customer durability requires entirely forward-looking judgment
      about whether DoD program priorities and appropriations will be sustained, which is inherently less quantifiable than
      commercial retention.
    diligencePath: Obtain program office risk registers, budget justification documents for FY2027-2029, and Congressional
      markup history for any Blackbeard-related program lines.
    relatedQuestionRefs:
    - QU019
