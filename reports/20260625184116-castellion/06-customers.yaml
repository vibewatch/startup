- id: TU005
  title: Expansion Drivers and Concentration Risk
  columns:
  - Factor
  - Type
  - Description
  - Impact
  - Diligence Path
  rows:
  - - F-35A/C internal carriage (objective requirement)
    - Expansion driver
    - MACE objective requirement specifies F-35A/C internal carriage of 4 All Up Rounds, adding USAF and additional USN platform
      customers
    - High — expands from 1 platform type to 3 (F/A-18E/F, F-35A, F-35C)
    - Request NAVAIR / USAF F-35 JPO technical feasibility review for internal carriage
  - - HIMARS → CAML launcher transition
    - Expansion driver
    - CAML M variant is envisioned as Blackbeard's primary Army launcher, expanding from existing HIMARS fleet to new autonomous
      launcher
    - Medium — expands Army magazine depth; dependent on CAML development timeline
    - Track CAML program milestone schedule; risk of launcher schedule slip delaying Army demand
  - - FMS / allied-nation sales
    - Expansion driver
    - HIMARS operated by 20+ U.S. allies; Blackbeard HIMARS compatibility creates natural FMS pathway; no FMS confirmed yet
    - Medium-high (future) — requires ITAR licensing, government-to-government agreements
    - Request State Dept. and DSCA FMS eligibility review timeline
  - - Second Castelion product line
    - Expansion driver
    - Series B (Dec 2025) funds 'parallel maturation of a second hypersonic product line'; could add new customer relationships
    - Low (near-term) — no public customer contract for second product
    - Monitor Castelion press releases for second-product customer announcements
  - - Single-buyer concentration (DoD = 100% revenue)
    - Concentration risk
    - Castelion has no commercial or allied customers; 100% revenue from U.S. DoD; any program restructure, budget rescission,
      or test failure eliminates revenue
    - Critical — no revenue diversification buffer exists
    - Require detailed breakout of contract backlog, modification authority, and unobligated balances
  - - Navy dominance within DoD
    - Concentration risk
    - $154.9M Navy contracts vs. $25M Army HX3 FY26; Navy represents ~86% of executed contract value
    - High — single-service concentration within single-buyer government
    - Monitor Army Phase II funding approval and CAML program for balance
  - - Conditional production framework
    - Concentration risk
    - DoW framework for 500/yr minimum depends on testing milestones; if validation is delayed, no production revenue flows
    - High — revenue cliff between prototype contracts and production commitment
    - Require milestone schedule with specific test events and EOC criteria
  - - SBIR Phase III eligibility
    - Concentration risk
    - All contracts flow through SBIR Phase III (AF231-D026); single GAO challenge to Phase III eligibility could force competitive
      re-solicitation across all services
    - Medium — legal/contracting structure risk; no active protests found
    - Verify GAO decisions on SBIR Phase III sole-source eligibility for Castelion
  notes: Impact ratings are analyst judgments based on contract values and program documents. FMS expansion is speculative
    (no confirmed agreements); second-product information from Series B press release only.
