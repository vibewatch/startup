- id: concentration-adverse-and-gaps
  title: Concentration Risk, Adverse Evidence, and Diligence Gaps
  body: 'Castelion''s customer profile carries extreme concentration risk: a single buyer (the U.S. Department of War) accounts
    for 100% of revenue. Within that single customer, the U.S. Navy represents the dominant contracted buyer ($154.9M executed)
    and the Army and Air Force are secondary. This is not unusual for an early-stage defense startup, but the implications
    for diligence are significant. First, any adverse change in DoD hypersonic program priorities, Congressional appropriations,
    or acquisition policy could eliminate or dramatically reduce Castelion''s revenue base in a single program review cycle.
    Second, there is no NRR, GRR, churn rate, customer satisfaction score, or commercial retention metric available—the defense
    contract model substitutes contract modifications and follow-on awards for these metrics. Castelion''s "retention" record
    is entirely positive as of the run date: every service that engaged has expanded its relationship, from the Air Force''s
    $1.77M SBIR in 2023 through the Navy''s $154.9M in 2026. The adverse community evidence is entirely orthogonal to customer
    concentration: the Project Ranger site in Sandoval County, New Mexico has generated organized opposition from residents
    concerned about perchlorate contamination, noise, and groundwater risks. Hundreds attended community meetings in October
    and December 2025. The environmental activist article from militarypoisons.org describes the facility as a potential public
    health crisis. While this does not directly threaten existing customer contracts—the DoD is the customer, not the community—it
    creates regulatory, permitting, and reputational risk that could delay manufacturing ramp and therefore production contract
    fulfillment. No evidence of contract protests, GAO bid challenges, or competitive procurement disputes exists in public
    records as of May 2026.


    Independent analyst coverage (IPO Club) identifies AUKUS partners—Australia and the United Kingdom—as potential future
    export customers via Foreign Military Sales, extending the revenue base beyond the sole current buyer. Legacy DoD programs
    have historically relied on outdated engineering practices, providing Castelion a structural demand advantage as program
    managers seek commercial-grade efficiency. However, community opposition to the Project Ranger facility in New Mexico—citing
    toxic chemical and PFAS contamination risks—represents a non-trivial supply-chain risk that could constrain production
    scale-up if regulatory hurdles materialize.'
