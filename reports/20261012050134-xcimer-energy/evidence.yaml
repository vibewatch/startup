    relatedQuestionRefs:
      - QV009
    relatedTableRefs:
      - TV001
  - type: missing-source
    severity: material
    topic: financials
    missingEvidence: >-
      Audited financial statements, current cash balance, monthly burn rate, and capital expenditure budget through
