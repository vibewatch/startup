    relatedQuestionRefs:
      - QR003
      - QR009
    relatedTableRefs:
      - TR001
  - type: missing-source
    severity: material
    topic: integrated-reliability
    missingEvidence: >-
      Independent shot-to-shot data connecting target injection, two-beam coupling, chamber clearing, component
      lifetime, beam quality, and hot-salt operation.
    whyItMatters: Separate subsystem demonstrations cannot establish availability or economics for a repetitive power plant.
    diligencePath: >-
      Define Anvil acceptance criteria before financing and require raw test data, failure logs, uncertainty ranges, and
