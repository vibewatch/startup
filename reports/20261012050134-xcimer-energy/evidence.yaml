evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation-and-burn-rate
    missingEvidence: >-
      Disclosed Series A post-money valuation, capitalization table, cash balance, monthly cash burn, and runway through
      the Anvil milestone.
    whyItMatters: >-
      Without valuation and cash burn disclosures, investors cannot assess dilution risk, capital adequacy, or financing
      runway required to complete prototype milestones.
    diligencePath: >-
      Request unaudited financial statements, cap table summaries, and milestone-linked budget models directly from
      management under NDA.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: governance-and-stakeholder-map
    missingEvidence: Complete listing of independent board directors, advisory board members, and minor syndicate seed investors.
    whyItMatters: Full governance and ownership distribution cannot be verified from public announcements alone.
    diligencePath: >-
      Review corporate charter documents, board resolutions, and investor rights agreements during confirmatory legal
      diligence.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: commercial-traction
    missingEvidence: >-
      Public verification of utility customer discussions, letters of intent, power purchase agreements, or site hosting
      evaluations for the Athena pilot plant.
    whyItMatters: >-
      Without customer or site host commitments, commercial market sizing remains entirely theoretical and cannot
      substantiate near-term revenue projections or utility adoption schedules.
    diligencePath: >-
      Review future DOE Milestone Program phase deliverables, state utility commission dockets in target regions, and
      formal commercial partnership announcements.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
      - TM003
  - type: conflicting-data
    severity: material
    topic: laser-capital-costs
    missingEvidence: >-
      Third-party audited capital cost validation comparing excimer-NLO laser driver manufacturing at volume against
      mature semiconductor lithography and DPSSL supply chains.
    whyItMatters: >-
      Xcimer projected $100-120/J FOAK and $60-80/J NOAK costs represent an order-of-magnitude reduction vs.
      $700-1,000/J DPSSLs, but remain vendor-modeled estimates that have not been validated on full-scale
      multi-megajoule hardware.
    diligencePath: >-
      Track Anvil facility construction costs and component procurement pricing for the 160 kJ Argos amplifier module
      through 2027-2028.
    relatedQuestionRefs:
      - QM003
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: utility-offtake-commitments
    missingEvidence: >-
      Public disclosure of binding off-take agreements, power purchase agreements (PPAs), or utility host letters of
      intent for commercial fusion power.
    whyItMatters: >-
      Without contractual off-take or grid interconnect agreements, commercial adoption timelines and revenue models for
      fusion remain unverified relative to advanced fission and geothermal alternatives.
    diligencePath: >-
      Review future utility interconnection queue filings, DOE Milestone-based Fusion Development Program phase
      disclosures, and regional utility integrated resource plans.
    relatedQuestionRefs:
      - QP009
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: pricing-and-revenue-quality
    missingEvidence: >-
      Executed defense or energy contracts, funded backlog, list and realized pricing, discounts, revenue recognition,
      customer concentration, and gross margin by stream.
    whyItMatters: Without commercial terms, prospective channels cannot be converted into a revenue-quality or margin assessment.
    diligencePath: >-
      Review executed contracts, pipeline, invoices, accounting policies, and stream-level gross-profit schedules under
      NDA.
    relatedQuestionRefs:
      - QI002
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Full-plant capex, target cost, uptime, utilization, service-delivery cost, working capital, CAC, payback,
      electricity price, and gross margin.
    whyItMatters: Cost per joule for one subsystem cannot establish plant economics, customer economics, or investment returns.
    diligencePath: >-
      Obtain the integrated techno-economic model, independent cost review, vendor quotes, operating assumptions, and
      sensitivity cases.
    relatedQuestionRefs:
      - QI004
    relatedTableRefs:
      - TI002
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Current cash, restricted cash, monthly burn, runway, debt, committed obligations, milestone budgets, uses of the
      Series A, and next-round timing and size.
    whyItMatters: Funding raised cannot be translated into cash available or milestone coverage without these inputs.
    diligencePath: >-
      Request audited financials, monthly cash statements, cap table, debt schedule, board-approved budget, and a
      milestone-by-milestone financing plan.
  - type: missing-source
    severity: material
    topic: repetition-rate-and-target-injection
    missingEvidence: >-
      Published experimental data demonstrating continuous multi-Hz pulse repetition, fast vacuum shutter survivability,
      and in-flight cryogenic target engagement under realistic power plant conditions.
    whyItMatters: >-
      While single-pulse operation and long-pulse kinetics have been demonstrated in Phoenix, commercial power
      generation requires reliable repetition at 0.25 to 1 Hz without acoustic or thermal disruption of subsequent
      shots.
    diligencePath: >-
      Review Anvil facility sub-scale repetition rate test stand data, vacuum shutter mechanical cycle testing logs, and
      target injection tracking demonstrations with partner institutions.
    relatedQuestionRefs:
      - QE009
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: minor
    topic: developer-signal-proxy
    missingEvidence: >-
      Public code repository statistics, package registry downloads, and developer discussion forums typical of software
      startups do not exist for deep-tech hardware fusion developers.
    whyItMatters: >-
      Evaluation of technical adoption must rely on peer-reviewed literature, joint national laboratory collaborations
      (LLE, LANL, LLNL), and DOE milestone reviews rather than open-source community velocity.
    diligencePath: >-
      Monitor joint academic publications, SPIE optical conference proceedings, and U.S. Patent and Trademark Office
      filings for independent engineering validation.
  - type: missing-source
    severity: material
    topic: Commercial utility offtake agreements and power purchase commitments
    missingEvidence: >-
      Publicly verifiable documentation of utility letters of intent, power purchase agreements, interconnection queue
      requests, or designated host site agreements for the Athena commercial pilot plant.
    whyItMatters: >-
      Without formal commercial customer traction or binding utility interest, revenue projections remain speculative
      and dependent entirely on dilutive venture equity and federal grants.
    diligencePath: >-
      Engage regional transmission organizations, public utility commissions, and municipal utilities to review
      potential pilot host partnerships and interconnection feasibility studies.
    relatedQuestionRefs:
      - QU005
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: minor
    topic: RTX defense integration contract terms and unit economics
    missingEvidence: >-
      Commercial contract details, revenue sharing terms, and targeted procurement timelines for the containerized
      pulsed-laser air defense systems developed with RTX.
    whyItMatters: >-
      Determines whether defense directed-energy applications can generate near-term non-dilutive commercial revenue
      prior to fusion energy commercialization in 2035.
    diligencePath: >-
      Request management disclosure of defense development milestones, anticipated military procurement schedules, and
      RTX joint-venture intellectual property allocations.
  - type: private-evidence-only
    severity: material
    topic: capital-runway
    missingEvidence: Current unrestricted cash, monthly burn, committed non-dilutive funding, milestone budgets, and downside runway.
    whyItMatters: >-
      Funding raised does not establish cash available to complete Anvil or preserve bargaining power before the next
      financing.
    diligencePath: >-
      Review bank balances, board-approved budgets, monthly burn by program, financing restrictions, and runway
      sensitivities through the Anvil evidence gate.
    relatedQuestionRefs:
      - QR004
  - type: enumeration-incomplete
    severity: material
    topic: regulatory-legal-risk-register
    missingEvidence: >-
      A complete project-specific licensing, environmental, occupational, export-control, litigation, enforcement, and
      incident register.
    whyItMatters: >-
      The national framework does not determine the critical path or redesign risk for Xcimer's specific facilities and
      dual-use activities.
    diligencePath: >-
      Obtain counsel's jurisdictional matrix, regulator correspondence, permit schedule, technology-control plan, and
