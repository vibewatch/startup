        - id: physics-gap
          label: Target Physics Uncertainty
          detail: Two-beam direct-drive symmetry and high gain remain unproven experimentally; historical ICF exhibits simulation optimism.
          tone: warning
        - id: capital-scale
          label: Multi-Stage Capital Intensity
          detail: $100M Series A funds Phoenix; reaching 200 kJ Anvil and 4-12 MJ Vulcan requires massive follow-on funding rounds.
          tone: warning
        - id: valuation-opacity
          label: Valuation & Cap Table Opacity
          detail: Series A valuation, share count, liquidation preferences, and current burn rate remain completely undisclosed.
          tone: negative
        - id: market-comps
          label: Market Benchmark Signals
          detail: Peer General Fusion implies ~$1.0B pro-forma equity value via SPAC filing, highlighting high-capital milestone dependence.
          tone: neutral
        - id: final-recommendation
          label: 'Recommendation: Research-More'
          detail: Maintain research-more stance; defer equity investment until Phoenix data and valuation terms are made available.
          tone: neutral
