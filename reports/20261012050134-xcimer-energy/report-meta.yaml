companyProfile:
  summary: >-
    Xcimer Energy is a Denver-based inertial fusion developer commercializing KrF excimer lasers, nonlinear optical
    pulse compression, and a flowing molten-salt chamber architecture. The company has reached Phoenix prototype
    operations and secured a $100 million Series A plus public-sector milestone support, but it has not disclosed a
    post-money valuation or current burn.
