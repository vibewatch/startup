      - - CFS (ARC Commercial Tokamak)
        - Utility-scale nuclear island vendor / owner-operator (~400 MWe)
        - Anticipated long-term utility PPA (none executed)
        - High-temperature superconducting magnet fabrication and cryogenic systems
        - Early 2030s (ARC power plant planned in Virginia)
      - - General Fusion (MTF Commercial Plant)
        - Power plant technology licensor and turnkey developer
        - Utility PPA or municipal off-take model (none executed)
        - Mechanical piston arrays, plasma injectors, and liquid metal systems
        - Early-to-mid 2030s post-LM26 demonstration
      - - Advanced Fission SMR Developers
        - Standardized nuclear power island supplier (50-300 MWe)
        - Long-term utility PPAs, government off-take, and industrial heat contracts
        - Regulatory certification, nuclear-grade containment, and fuel fabrication
        - Late 2020s to early 2030s (commercial deployment ongoing)
