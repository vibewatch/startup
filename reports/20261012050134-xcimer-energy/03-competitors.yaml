  - id: TP002
    title: Feature / capability matrix
    columns:
      - Evaluation Dimension
      - Xcimer Energy (KrF Laser IFE)
      - Commonwealth Fusion Systems (Tokamak MFE)
      - General Fusion (MTF)
      - Diode-Pumped Solid-State Laser IFE
    rows:
      - - Driver / Confinement Physics
        - Deep-UV KrF excimer laser at 248 nm with SBS pulse compression
        - High-field tokamak utilizing HTS superconducting magnets
        - Magnetized plasma compressed by mechanical liquid metal liner
        - Frequency-tripled infrared solid-state laser at 351 nm
      - - Target / First Wall Protection
        - Thick flowing liquid salt (FLiBe) protects chamber walls; no solid first wall replacement
        - Solid first wall exposed to 14 MeV neutrons; estimated 1-2 year replacement cycle
        - Liquid lead-lithium vortex wall protects structural vessel
        - Solid dry-wall chamber or sacrificial optic requiring periodic refurbishment
      - - Driver Capital Cost at Scale
        - Projected <$100 per joule on target by company
        - Capital-intensive HTS magnet fabrication and cryogenic cooling
        - Moderate mechanical driver cost; specialized piston arrays
        - Projected floor of $700-$1,000 per joule on target ($7B-$10B for 10 MJ)
      - - Tritium Breeding Strategy
        - Tritium breeding ratio ~1.2 using natural lithium in FLiBe without enrichment
        - External breeding blanket required around tokamak chamber; requires enriched Li-6
        - Tritium bred directly in rotating liquid lead-lithium blanket
        - External breeding blanket required around reaction chamber
    notes: Technical capability attributes reflect disclosed architectural baselines in company white papers, public filings, and independent engineering reports.
