    title: Company Milestone Timeline
    type: timeline
    summary: Chronology of Xcimer Energy's corporate founding, technical platform completions, federal approvals, and planned commercial power milestones.
    data:
      items:
        - label: Company Founding
          date: 2021-12
          detail: Conner Galloway and Alexander Valys found Xcimer Energy in late 2021 to pursue KrF excimer lasers for inertial fusion.
          tone: positive
        - label: DOE Milestone Program Award
          date: 2023-05
          detail: DOE selects Xcimer for a $9 million award under the Milestone-Based Fusion Development Program.
          tone: positive
        - label: Denver Laser Facility Construction
          date: 2024-01
          detail: Construction begins on Xcimer's 74,000-square-foot laser research and development facility in Denver, Colorado.
          tone: neutral
        - label: LPK Laser Platform Operation
          date: 2025-05
          detail: Xcimer operates the Long Pulse Kinetics system, achieving a record 3-microsecond pulse length for KrF lasers.
          tone: positive
        - label: $100M Series A Equity Close
          date: 2026-05
          detail: Hedosophia leads a $100M Series A round joined by Lowercarbon Capital and Breakthrough Energy Ventures.
          tone: positive
        - label: Phoenix Laser Prototype Operational
          date: 2026-06
          detail: Xcimer starts operations of Phoenix, integrating excimer amplification with a 38-meter SBS pulse compression gas optic.
          tone: positive
        - label: DOE Athena Preconceptual Approval
          date: 2026-06
          detail: U.S. Department of Energy formally accepts Xcimer's preconceptual design and technology roadmap for Athena.
          tone: positive
        - label: RTX Strategic Partnership & Investment
          date: 2026-09
          detail: RTX Ventures makes a minority investment and enters a defense teaming agreement for containerized pulsed-laser systems.
          tone: positive
        - label: Anvil Beamline Demonstrator Planned
          date: 2028-12
          detail: Targeted completion of Anvil, a two-sided 200 kJ IFE excimer beamline demonstrator in Denver using Argos laser modules.
          tone: neutral
        - label: Athena Commercial Pilot Target
          date: 2035-12
