company:
  name: Xcimer Energy
chapter:
  number: 1
  title: Company Overview
  summary: Xcimer Energy is a Denver-based inertial fusion developer pursuing krypton-fluoride excimer lasers, gas optics, and a flowing lithium-salt chamber to achieve commercial fusion power. Backed by nearly $200 million in private funding from Hedosophia, Breakthrough Energy Ventures, and RTX Ventures alongside DOE milestone awards, the company has demonstrated prototype KrF laser scaling with Phoenix while leaving valuation and long-term burn rate undisclosed.
sections:
  - id: identity-and-business-model
    title: Corporate Identity and Laser-Inertial Fusion Model
    body: Xcimer Energy Corporation was founded in late 2021 by MIT alumni Conner Galloway and Alexander Valys to commercialize inertial confinement fusion through an alternative laser architecture. Headquartered in Denver, Colorado, the company operates an inertial fusion technology business centered on electron-beam-pumped krypton-fluoride (KrF) excimer gas lasers, nonlinear optical gas media for pulse compression, and a flowing lithium-salt chamber designed to protect structural walls. Unlike legacy solid-state glass laser approaches that rely on thousands of optical elements and complex diode arrays, Xcimer's two-beamline design aims to produce up to 10 megajoules on target at substantially reduced capital cost. The company remains in a pre-commercial development stage with zero reported commercial revenue, focusing its 150-person multidisciplinary engineering workforce on prototype laser construction and component validation ahead of commercial power plant deployment.
    claimRefs:
      - CO001
      - CO002
      - CO008
    tableRefs:
      - TO001
  - id: founders-and-leadership
    title: Founders, Leadership Team, and Technical Expertise
    body: Xcimer's executive leadership brings concentrated technical and entrepreneurial experience across laser physics, radiation hydrodynamics, and early-stage company building. Co-founder Conner Galloway serves as Chief Executive Officer and Chief Science Officer, drawing upon more than fifteen years of inertial confinement fusion research initiated at Los Alamos National Laboratory. Co-founder Alexander Valys serves as President and Chief Technology Officer, having founded and scaled technology startups across fusion, healthcare, and machine learning since 2002. Together, Galloway and Valys lead a team of more than 150 engineers, physicists, pulsed-power specialists, and technicians drawn from national laboratories, aerospace contractors, and semiconductor lithography manufacturers. Despite their deep domain expertise, Xcimer maintains high key-person dependence on both co-founders to drive its scientific roadmap and physical prototype integration, while independent board composition and minority governance structures remain undisclosed.
    claimRefs:
      - CO001
      - CO003
      - CO004
      - CO008
      - CO014
    tableRefs:
      - TO002
  - id: capitalization-and-stakeholders
    title: Capitalization Structure, Investors, and Defense Expansion
    body: To finance its multi-stage hardware roadmap, Xcimer has raised nearly $200 million in cumulative private equity capital across seed, Series A, and strategic defense financing rounds. In May 2026, the company closed a $100 million Series A equity round led by Hedosophia, with participation from premier climate and deep-tech venture funds including Breakthrough Energy Ventures and Lowercarbon Capital. Public sector support includes a $9 million grant awarded under the U.S. Department of Energy's Milestone-Based Fusion Development Program to advance early KrF laser milestones. In September 2026, RTX Ventures completed a strategic minority investment paired with a commercial teaming agreement to explore containerized pulsed-laser systems for defense and air defense applications. While these capital injections provide near-term development runway, Xcimer has kept its post-money valuation, ownership distribution, and monthly cash burn rate undisclosed, presenting an unverified financing profile.
    claimRefs:
      - CO005
      - CO006
      - CO007
      - CO012
      - CO014
    tableRefs:
      - TO003
  - id: technical-milestones-and-diligence-outlook
    title: Execution Milestones, Technical Scaling, and Diligence Risks
    body: Xcimer has progressed rapidly through its staged technical development roadmap, transitioning from theoretical design to multi-machine hardware demonstration. In June 2025, the company completed its Long Pulse Kinetics platform, achieving a record 3-microsecond pulse length as the first private-sector electron-beam KrF laser in over two decades. In June 2026, Xcimer initiated operations of Phoenix in its 74,000-square-foot Denver facility, integrating a multi-kilojoule light source with a 38-meter Stimulated Brillouin Scattering gas optic for pulse compression. Concurrently, the U.S. Department of Energy approved Xcimer's preconceptual design and technology roadmap for Athena, a planned 400 MW commercial fusion power plant. Nevertheless, peer-reviewed nuclear fusion research emphasizes that laboratory ignition has historically required higher driver energies than initial models predicted, underscoring substantial physical, repetitively pulsed, and target-fabrication risks ahead of the 200 kJ Anvil demonstrator in 2028 and commercial operations in the 2030s.
    claimRefs:
      - CO009
      - CO010
      - CO011
      - CO013
      - CO014
    figureRefs:
      - FO001
