callouts:
  - calloutType: risk
    title: Absence of Commercial Customers and Utility Offtake Commitments
    body: Xcimer Energy currently generates zero commercial revenue and holds no binding power purchase agreements, letters of intent, or pilot commitments with electric utilities. While the company models an attractive $40/MWh levelized cost of electricity and $3B capital expenditure for initial 400 MWe Athena plants, the lack of utility commercial traction exposes the company to severe adoption timing and procurement risks.
    claimRefs:
      - CU003
      - CU005
      - CU009
      - CU014
  - calloutType: insight
    title: Defense Integration as an Intermediate Commercial Bridge
    body: The September 2026 strategic partnership and investment with RTX provides Xcimer Energy with an essential intermediate application for its pulsed excimer laser platform. By containerizing pulsed lasers for military directed-energy air defense, Xcimer can validate hardware reliability in operational environments and generate non-dilutive defense capital years before grid-scale commercial fusion power is achieved in 2035.
    claimRefs:
      - CU001
      - CU002
      - CU011
      - CU012
