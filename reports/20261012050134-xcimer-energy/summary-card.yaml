  topStrengths:
    - Differentiated KrF excimer and SBS-based fusion architecture with meaningful prototype progress.
    - Strong financing and institutional support, including a $100 million Series A and DOE milestone backing.
    - Deep technical team and industrial capability concentrated in Denver prototype operations.
  topRisks:
    - No public valuation, cap-table, or burn disclosure, making dilution and runway hard to underwrite.
    - Commercial fusion scale-up remains unproven, especially at multi-megajoule and repetitive-operation scale.
    - No public customer/offtake proof yet, so revenue quality and commercialization timing remain opaque.
  unresolvedGaps:
    - >-
      Series A post-money valuation, ownership sold, liquidation preferences, option pool, and board-control terms
      remain undisclosed.
    - Current cash, monthly burn, runway, and budget by milestone from Phoenix through Athena are not public.
    - >-
      No public evidence shows customer discussions, MOUs, deposits, contracted megawatts, or a named site host and
      utility counterparty.
    - >-
      Public data does not yet show integrated target-shooting results, repetitive-operations performance,
      target-factory throughput, or per-target economics.
