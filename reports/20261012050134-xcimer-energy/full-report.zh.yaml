      - number: '5.3'
        title: HYLIFE-III 厚液层腔体与氚燃料循环
        blocks:
          - type: paragraph
            body: >-
              商业惯性聚变能源的主要瓶颈之一，是腔体在高能 14 MeV 聚变中子持续轰击下的存活能力。传统干壁腔体会出现严重结构活化、材料脆化和墙体侵蚀，需要频繁且资本密集的第一壁更换。Xcimer 采用 LLNL 首创的
              HYLIFE 厚液壁架构，解决材料退化问题。在该设计中，熔融锂铍氟盐（FLiBe）持续喷淋并流过腔体内部，形成厚保护层，在高能 X 射线、靶碎片和几乎全部 14 MeV
              中子通量抵达结构钢边界前将其吸收。流动液盐可减速中子，把反应热带走以驱动标准蒸汽轮机辅助系统循环，并以估计 1.2 的增殖比产生氚燃料。由于 Xcimer
              的激光架构将光学能量集中到仅两条从小型无窗孔进入的对置光束线，厚液体瀑布可在燃料靶丸周围维持近乎完整的立体角覆盖，让结构钢部件使用数十年，并将全电站氚库存控制在 150 克以下。
            claimRefs:
              - CE008
              - CE009
              - CE010
              - CE011
          - type: table
            tableRef: TE002
            claimRefs:
              - CE006
              - CE008
              - CE012
              - CE014
      - number: '5.4'
        title: 经济差异化、靶物理与执行依赖
        blocks:
          - type: paragraph
            body: >-
              Xcimer 方案的经济可行性依赖于把激光驱动器能量扩展与半导体二极管供应链约束分离。与工业激光制造商 TRUMPF 共同署名的详细成本模型估算，首台套（FOAK）准分子-NLO 激光硬件可按靶上每焦耳 $100
              至 $120 交付，批量电站降至每焦耳 $60 至 $80。相比之下，二极管泵浦固态激光器因原始二极管封装、晶体制造和特种光学涂层，成本底线为每焦耳 $700 至 $1,000。此外，更高的驱动能量（10 至
              12 MJ）可使用更大、更坚固的混合直接驱动燃料靶丸，增益超过 200，使重复频率要求放宽至 0.25 至 1 Hz。但技术和工程风险仍很大：高重复频率运行需要开发耐用的快速循环真空快门，管理脉冲间束路中的
              FLiBe 液滴雾清除，证明双光束内爆均匀且不发生非对称流体动力学破碎，并验证电子束阴极箔在持续热、电应力下的长寿命。
