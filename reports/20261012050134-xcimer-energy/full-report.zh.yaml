      - number: '1.3'
        title: 资本结构、投资者与国防拓展
        blocks:
          - type: paragraph
            body: >-
              为支撑多阶段硬件路线图，Xcimer 已通过种子轮、A 轮和战略国防融资累计筹集接近 2 亿美元私人股权资本。2026 年 5 月，公司完成由 Hedosophia 领投的 1 亿美元 A
              轮融资，Breakthrough Energy Ventures 和 Lowercarbon Capital 等顶级气候与深科技基金参与。公共部门支持包括美国能源部 Milestone-Based Fusion
              Development Program 提供的 900 万美元拨款，用于推进早期 KrF 激光里程碑。2026 年 9 月，RTX Ventures
              完成战略性少数股权投资，并配套商业合作协议，探索用于国防和防空的集装箱化脉冲激光系统。              这些资金可支撑近期开发周期，但 Xcimer
              尚未披露投后估值、持股分配和月度现金消耗，融资情况仍未经验证。
