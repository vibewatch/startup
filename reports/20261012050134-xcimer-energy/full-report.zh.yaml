chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: 公司身份与激光惯性聚变模式
        blocks:
          - type: paragraph
            body: >-
              Xcimer Energy Corporation 由 MIT 校友 Conner Galloway 和 Alexander Valys 于 2021
              年末创立，目标是用替代性激光架构实现惯性约束聚变商业化。公司总部位于科罗拉多州丹佛，核心业务是电子束泵浦氟化氪（KrF）准分子气体激光器、用于脉冲压缩的非线性光学气体介质，以及保护结构墙体的流动锂盐腔体。传统固态玻璃激光方案依赖数千个光学元件和复杂的二极管阵列，而
              Xcimer 的双光束线设计目标是在靶上产生最高 10 兆焦耳能量，同时大幅降低资本成本。公司仍处于商业化前开发阶段，尚无已报告的商业收入；150
              人的多学科工程团队正专注于建造原型激光器、验证组件，为商业电站部署做准备。
            claimRefs:
