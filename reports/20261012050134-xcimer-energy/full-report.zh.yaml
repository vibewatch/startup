            body: >-
              Xcimer 正快速推进分阶段技术路线图，从理论设计转向多机硬件演示。2025 年 6 月，公司完成 Long Pulse Kinetics 平台，实现创纪录的 3 微秒脉冲长度，成为二十多年来首个私营部门电子束
              KrF 激光器。2026 年 6 月，Xcimer 在丹佛 74,000 平方英尺设施中启动 Phoenix 运行，将多千焦耳光源与 38 米 Stimulated Brillouin Scattering
