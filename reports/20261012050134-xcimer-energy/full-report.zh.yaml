  - id: FE001
    title: 产品架构图
    type: stack
    summary: Xcimer KrF 准分子激光惯性聚变能源系统从脉冲功率输入到发电的端到端技术架构。
    data:
      layers:
        - label: 脉冲功率与 Marx 储能
          detail: 高压电容储能和 Marx 发电机组输出微秒级脉冲
        - label: Argos KrF 准分子激光放大器
          detail: 电子束泵浦的稀有气体激光腔，产生 248 nm 深紫外光
        - label: 非线性光学气体镜（Raman 与 SBS）
          detail: 在气相中合束，并分两级将时间脉冲从微秒级压缩至纳秒级
        - label: 无窗口光束输送与真空快门
          detail: 双光束相向输送，绕过固体终端光学元件及光学损伤阈值
        - label: HYLIFE-III 厚液层熔盐腔体
          detail: 流动的 FLiBe 瀑布吸收 14 MeV 中子，无需更换固体第一壁
        - label: 热转换与氚回收循环
          detail: 中间熔盐换热器、蒸汽轮机发电机和连续氚提取
    approximationNotes: 架构表示基于 Xcimer 技术白皮书、DOE 里程碑披露和学术出版物整理。
    claimRefs:
      - CE001
      - CE002
      - CE004
      - CE009
      - CE010
      - CE011
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 覆盖联邦验证、国防演示、公用事业试点开发和商业电网部署的采用及商业化生命周期。
    approximationNotes: 里程碑阶段和目标运行日期反映公司路线图预测及 DOE 里程碑计划安排；2035 年部署商业电站仍取决于激光成功扩展和监管许可。
    data:
      items:
        - label: 阶段 1：联邦审查与拨款里程碑
          stage: Federal R&D
          summary: Participation in DOE Milestone-Based Fusion Development Program and ARPA-E awards.
          detail: 围绕从 Phoenix 到 Athena 预概念设计的技术风险消除，配置非稀释性资金。
        - label: 阶段 2：激光原型运行
          stage: Hardware Proof
          summary: Operational demonstration of the 74,000 sq ft Phoenix prototype in Denver.
          detail: 演示从微秒级到纳秒级的 SBS 脉冲压缩和 Marx 脉冲功率架构。
        - label: 阶段 3：战略国防集装箱化部署
          stage: Defense Collaboration
          summary: Partnership with RTX to adapt pulsed excimer lasers for directed-energy air defense.
          detail: 在商业能源部署前提供近期运行验证和战略资本。
        - label: 阶段 4：能源盈亏平衡演示
          stage: Wall-Plug Breakeven
          summary: Construction of the Vulcan high-yield facility targeting net energy gain by 2031.
          detail: 组合多个 Argos 模块，将 4 MJ 能量送达靶点，证明电力输入输出达到盈亏平衡。
        - label: 阶段 5：公用事业试点承接方与并网
          stage: Commercial Demonstration
          summary: Securing utility site hosts, environmental licensing, and interconnection agreements for Athena.
          detail: 这是关键过渡点，需要首批商业公用事业谅解备忘录、试点资本开支联合融资和 PPA 设计。
        - label: 阶段 6：电网基荷电力部署
          stage: Commercial Scale
          summary: Commercial operation of the 400 MWe Athena laser fusion power plant targeting mid-2030s.
          detail: 向电力公用事业提供全天候清洁稳定电力，目标平准化成本为 $40/MWh。
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU006
      - CU007
      - CU008
      - CU014
  - id: FR001
    title: 剩余风险热力图
    type: matrix
    summary: 定性评估已披露缓释措施实施后的可能性、影响、缓释成熟度和剩余严重性。
    data:
      columns:
        - label: 可能性
          detail: 分析师根据已披露成熟度和剩余工作作出的评估。
        - label: 影响
          detail: 对聚变商业化论点的潜在影响。
        - label: 缓释成熟度
          detail: 已披露缓释措施的状态，不代表独立认证。
        - label: 剩余严重性
          detail: 已披露缓释措施之后仍然存在的暴露。
      rows:
        - label: 激光扩展
          note: Phoenix 属于千焦耳级；后续关口将提升至数百千焦耳，再到兆焦耳级。
          values:
            - label: 高
              tone: risk
            - label: 严重
              tone: risk
            - label: 原型
              tone: neutral
            - label: 严重
              tone: risk
        - label: 靶件与腔体集成
          note: 靶件输送、液壁回收和重复打靶尚未在同一套系统中共同演示。
          values:
            - label: 高
              tone: risk
            - label: 严重
              tone: risk
            - label: 概念 / 计划测试
              tone: neutral
            - label: 严重
              tone: risk
        - label: FLiBe 运行
          note: 泵、喷嘴和腐蚀控制的开发明确尚未完成。
          values:
            - label: 高
              tone: risk
            - label: 高
              tone: risk
            - label: 分析 / 既有技术
              tone: neutral
            - label: 高
              tone: risk
        - label: 资本与资金续航
          note: 已披露募资金额，但当前现金、消耗速度和里程碑预算未披露。
          values:
            - label: 高
              tone: risk
            - label: 严重
              tone: risk
            - label: 融资完成
              tone: neutral
            - label: 高
              tone: risk
        - label: 专业人才与供应链
          note: 公司称这项能力几乎已经丧失，目前正在重建。
          values:
            - label: 中
              tone: neutral
            - label: 高
              tone: risk
            - label: 积极招聘 / 垂直整合
              tone: neutral
            - label: 中高
              tone: risk
        - label: 项目许可与选址
          note: 国家层面框架有利，但项目具体审批和场址尚未验证。
          values:
            - label: 中
              tone: neutral
            - label: 高
              tone: risk
            - label: 仅有框架
              tone: neutral
            - label: 中高
              tone: risk
    approximationNotes: 所有评级均为分析师的定性判断，不是概率估计，也不代表发生过已记录的事故。
    claimRefs:
      - CR001
      - CR003
      - CR005
      - CR006
      - CR010
      - CR014
      - CR016
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 基于技术验证、资本需求和估值披露缺口，推导出“继续研究”建议的决策路径。
    data:
      nodes:
        - id: tech-validation
          label: 激光技术验证
          detail: Denver 的 Phoenix 原型在 1-2 kJ 规模演示了 KrF 准分子放大和 SBS 脉冲压缩。
          tone: positive
        - id: physics-gap
          label: 靶物理不确定性
          detail: 双光束直接驱动的对称性和高增益尚未得到证明；历史 ICF 案例暴露出模拟偏于乐观。
          tone: warning
        - id: capital-scale
          label: 多阶段资本密集型投入
          detail: $100M Series A 资助 Phoenix；达到 200 kJ 的 Anvil 和 4-12 MJ 的 Vulcan 需要大规模后续融资。
          tone: warning
        - id: valuation-opacity
          label: 估值与股权结构表不透明
          detail: Series A 估值、股份数量、清算优先权和当前消耗速度仍完全未披露。
          tone: negative
        - id: market-comps
          label: 市场基准信号
          detail: 同业 General Fusion 的 SPAC 文件披露约 $1.0B 的备考股权价值，凸显其对高资本里程碑的依赖。
          tone: neutral
        - id: final-recommendation
          label: 建议：继续研究
          detail: 维持“继续研究”立场；在 Phoenix 数据和估值条款可得之前，暂缓股权投资。
          tone: neutral
      edges:
        - from: tech-validation
          to: physics-gap
          label: 面临
        - from: physics-gap
          to: capital-scale
          label: 加剧
        - from: capital-scale
          to: valuation-opacity
          label: 遮蔽
        - from: valuation-opacity
          to: market-comps
          label: 提供背景
        - from: market-comps
          to: final-recommendation
          label: 导向
    approximationNotes: 展示按顺序评估证据并设置投资闸门的逻辑决策流程。
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV007
      - CV011
      - CV014
