  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 市场边界、可触达支出与细分定义
        blocks:
          - type: paragraph
            body: >-
              Xcimer Energy 将其总可寻址市场边界定义为公用事业级清洁发电、高温工业供热和军用定向能防御应用。通过推进激光惯性约束聚变（ICF）架构，Xcimer
              直接切入全球对稳定、可调度、无碳基荷电力的需求，以替代即将退役的煤电、燃气和传统核电资产。风电和光伏具有间歇性，需要大规模储能或输电扩建；聚变电站则可作为同步热发电直接接入现有输电网。除批发公用事业发电外，Xcimer
              的脉冲准分子激光技术还面向军民两用防务应用。2026 年 9 月，RTX Ventures 完成少数股权投资并签署合作协议，将 Xcimer 脉冲准分子激光器集成到军用定向能系统中。不过，输电基础设施、零售配电和
              IT 算力系统相关支出被严格排除在 Xcimer 核心可寻址电力市场之外。
            claimRefs:
