      - number: '2.2'
        title: 市场规模视角：电网基荷、定向能与工业热
        blocks:
          - type: paragraph
            body: >-
              评估激光聚变的长期商业机会，需要从多个不同需求视角出发，而不是依赖单一自上而下的总可寻址市场预测。宏观上，全球清洁稳定基荷电力市场每年支出达数万亿美元，对应数十太瓦时需求。美国能源部 2026 年 6 月发布的
              Fusion Science and Technology Roadmap 提出，到 2040 年实现 50 至 100 GW 并网聚变容量。Xcimer 于 2026 年 6 月获 DOE 正式批准的
              Athena 概念前试验电站设计，规划 400 MW 电力输出，重复频率最高 1 Hz（每天 86,400 次点火）。Xcimer 估算首台套（FOAK）激光硬件成本为靶上每焦耳 $100 至
              $120，批量系统（NOAK）降至每焦耳 $60 至 $80，相比估算为每焦耳 $700 至 $1,000 的二极管泵浦固态激光器，成本降低一个数量级。
