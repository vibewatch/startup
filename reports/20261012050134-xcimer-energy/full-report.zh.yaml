        - 准分子 KrF 激光器和 NLO 气体镜将激光成本降低约 10x，FOAK 约为 $100-$120/J
        - Xcimer 白皮书模型显示 FOAK 成本为 $109/J，内部生产电容器的成本低于 $1/J
        - 对 Denver Phoenix 激光成本和光学传输效率进行独立审计。
      - - 正方（腔体寿命）
        - HYLIFE-II 熔盐液壁保护腔体结构免受中子损伤，目标寿命 30 年
        - 数十年的 LLNL HYLIFE 研究及 2024-2026 年显示 FLiBe 低蒸发率的 CFD 模拟
        - 在运行脉冲频率下重复清除液体射流的实验演示。
      - - 反方（科学先例）
        - 惯性聚变历史显示，过去 50 年里人们屡次因模拟过度乐观而低估物理挑战
        - Thomas Mehlhorn 博士在 Physics of Plasmas 的观点指出历史上模拟过度乐观
        - 在双光束 KrF 驱动器平台上实现实证的高增益热点点火。
      - - 反方（资本密集度）
        - 在 2030 年代中期建成 Athena 商业试点电站，需要数十亿美元的稀释性融资，且近期没有收入
        - $100M Series A 只能资助 Phoenix 原型和初步规划；商业规模需要 100 个模块组成的阵列
        - 签署战略企业承购协议，或取得非稀释性的国防 / 公用事业共同资助。
    notes: 该表根据已发表的物理学文献和公司技术披露，评估正反两方的投资论点。
    claimRefs:
      - CV005
      - CV006
      - CV007
      - CV008
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 核心假设
      - 估值 / 回报逻辑
      - 主要下行风险
      - 概率信号
    rows:
      - - 乐观情景
        - Phoenix 在 2026 年成功；Anvil 在 2028 年演示 200 kJ；Vulcan 在 2031 年实现盈亏平衡；Athena 400 MWe 电站于 2035 年建成
        - 踏上吉瓦级公用事业部署道路，并以 $3B-$5B+ 的估值对标头部聚变公司
        - 脉冲功率扩展成本超支，以及多千焦耳 SBS 光束合束延误
        - 中低（20%）：取决于前所未有的 KrF 脉冲压缩扩展
      - - 基准情景
        - Phoenix 验证 SBS 压缩，但集成延误将 Anvil 推迟至 2029-2030 年；需要多轮大额稀释融资
        - 估值在 Series B/C 轮温和升至 $300M-$600M；早期股东将面临显著稀释
        - 脉冲功率电容器故障率、稀有气体供应链瓶颈、FLiBe 泵腐蚀
        - 中高（55%）：与历史上的聚变硬件演示时间线一致
      - - 悲观情景
        - 双光束直接驱动无法达到所需内爆对称性；SBS 气体池发生光学击穿或丝化
        - 大幅下轮融资或清算；剩余价值仅限于 IP 变现和定向能国防应用
        - 若 KrF 激光架构无法达到目标耦合效率或重复频率，股权价值将全部损失
        - 中（25%）：新型高能激光架构固有的技术风险很高
    notes: 情景参数将技术里程碑达成情况与资本需求及可比聚变市场估值进行对照建模。
    claimRefs:
      - CV009
      - CV010
      - CV011
      - CV012
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: Xcimer Energy 公司成立、技术平台完成、联邦审批及规划中的商业电力里程碑时间顺序。
    data:
      items:
        - label: 公司成立
          date: 2021-12
          detail: Conner Galloway 和 Alexander Valys 于 2021 年底创立 Xcimer Energy，专注于用 KrF 准分子激光器实现惯性聚变。
          tone: positive
        - label: DOE 里程碑计划授奖
          date: 2023-05
          detail: DOE 将 Xcimer 纳入基于里程碑的聚变开发计划，授予其 $9 million。
          tone: positive
        - label: Denver 激光设施开工
          date: 2024-01
          detail: Xcimer 在 Colorado 州 Denver 建设占地 74,000 平方英尺的激光研发设施。
          tone: neutral
        - label: LPK 激光平台运行
          date: 2025-05
          detail: Xcimer 运行 Long Pulse Kinetics 系统，将 KrF 激光器脉冲长度推至创纪录的 3 微秒。
          tone: positive
        - label: $100M Series A 股权融资完成
          date: 2026-05
          detail: Hedosophia 领投 $100M Series A，Lowercarbon Capital 和 Breakthrough Energy Ventures 跟投。
          tone: positive
        - label: Phoenix 激光原型投入运行
          date: 2026-06
          detail: Xcimer 启动 Phoenix，将准分子放大与 38 米 SBS 脉冲压缩气体光学元件集成。
          tone: positive
        - label: DOE 批准 Athena 预概念设计
          date: 2026-06
          detail: 美国能源部正式接受 Xcimer 为 Athena 制定的预概念设计和技术路线图。
          tone: positive
        - label: RTX 战略合作与投资
          date: 2026-09
          detail: RTX Ventures 进行少数股权投资，并就集装箱式脉冲激光系统签署国防协作协议。
          tone: positive
        - label: Anvil 光束线演示器计划
          date: 2028-12
          detail: 目标是在 Denver 完成 Anvil——一套采用 Argos 激光模块、双侧 200 kJ 的 IFE 准分子光束线演示器。
          tone: neutral
        - label: Athena 商业试点目标
          date: 2035-12
          detail: 长期目标是部署 Athena——首座商业化 400 MW 激光聚变电站，向电网供电。
          tone: neutral
    approximationNotes: null
    claimRefs:
      - CO001
      - CO007
      - CO009
      - CO010
      - CO011
      - CO012
      - CO013
  - id: FM001
    title: 市场规模视角
    type: pyramid
    summary: 从全球电力需求到 Xcimer Athena 试点部署容量的分层市场规模。
    data:
      items:
        - label: 全球电力需求（TAM）
          value: Multi-trillion USD
          detail: 全球所有燃料来源的年发电量合计超过 29,000 TWh。
          claimRefs:
            - CM007
        - label: 全球清洁稳定基荷电力
          value: '>10,000 TWh/yr'
          detail: 用于替代化石燃料热电资产的非间歇、无碳基荷电力可服务市场。
          claimRefs:
            - CM007
            - CM008
        - label: 美国聚变市场机会（SAM）
          value: 50-100 GWe
          detail: DOE《聚变科学与技术路线图》提出美国到 2040 年的长期电网容量目标。
          claimRefs:
            - CM009
        - label: 国防定向能细分市场
          value: Multi-billion USD
          detail: 依托与 RTX 的合作，服务美国军方的定向能和空中威胁防御系统。
          claimRefs:
            - CM006
        - label: Athena FOAK 试点部署（SOM）
          value: 400 MWe
          detail: 初始商业试点电站容量，可全天候生产基荷电力。
          claimRefs:
            - CM002
            - CM003
        - label: 近期原型演示器
          value: 1-200 kJ
          detail: Phoenix 原型运行功率超过 1 kJ，Denver 计划建设 200 kJ 的 Anvil 测试光束线。
          claimRefs:
            - CM012
            - CM015
    approximationNotes: 市场规模分层反映的是基于 DOE 路线图预测和 Xcimer 技术文件的理论功率与容量上限，而非合同收入。
