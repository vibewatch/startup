      - number: '2.3'
        title: 买方画像、采购动态与预算归属
        blocks:
          - type: paragraph
            body: >-
              商业化需要面对受监管电力公用事业、国防主承包商和超大规模科技运营商等高度保守的机构买家。受监管公用事业遵循州公用事业委员会监督的严格综合资源规划（IRP）流程，签署购电协议前必须证明电站可运行数千小时、平准化度电成本低且运营风险可预测。RTX
              等国防主承包商提供更快的商业化出口，按国防拨款和技术成熟度等级评估脉冲激光技术，而不是按电网批发电力经济性评估。第三类新兴买家是超大规模云运营商，它们因输电排队严重延误，             
              寻求为高耗能人工智能数据中心配置表后清洁电源。所有商业类别的决策权都在管理层委员会手中，委员会要求经过验证的工程基准，而不是理论点火增益。
