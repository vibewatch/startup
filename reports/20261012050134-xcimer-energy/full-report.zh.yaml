  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 商业聚变格局与替代路径
        blocks:
          - type: paragraph
            body: >-
              私营聚变能源领域呈现磁约束聚变（MCF）与惯性约束聚变（IFE）两条路线的鲜明分化。Commonwealth Fusion Systems 已筹集数十亿美元建设 SPARC，这是一台依靠高温超导磁体、目标在
              2027 年实现净能量的紧凑型托卡马克。与此同时，General Fusion 正通过一项估值约 10 亿美元的 SPAC 交易推进磁化靶聚变。相比之下，Xcimer Energy 选择惯性约束聚变，建立在
              National Ignition Facility 以 2 MJ 激光输入取得 8.6 MJ 聚变产出的历史里程碑之上。不同于传统固态研究设施，Xcimer 计划将氟化氪准分子激光器工业化，并于 2026
              年投运首台私营部门电子束 KrF 原型机。该格局使 Xcimer 需要与资本充足的磁约束龙头和固态 IFE 公司竞争，必须保持很高的资本效率才能实现商业可行性。
            claimRefs:
              - CP001
              - CP004
              - CP005
              - CP009
              - CP010
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
