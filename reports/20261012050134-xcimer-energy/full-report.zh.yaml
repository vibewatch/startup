      - number: '5.2'
        title: Argos 模块化放大器与四阶段设施演示路线图
        blocks:
          - type: paragraph
            body: >-
              Xcimer 商业驱动器的工业化基本单元是 Argos 激光放大器模块。每个模块化 Argos 单元设计为在高压 Marx 发电机加速的相对论电子束泵浦下，产生远超 100 kJ 的 248 nm
              紫外光。为把国家实验室的历史研究衔接到商业制造，Xcimer 围绕四套系统建立了分阶段设施路线图。在丹佛，Phoenix 原型激光系统目前在 74,000 平方英尺设施中运行，已在 38
              米气体光学池中成功演示准分子放大和 SBS 脉冲压缩的端到端集成，脉冲能量超过 1 kJ。2028 年，Anvil 演示机将集成首批全尺寸 Argos 模块，通过双侧对置光束线输出 200
              kJ，以验证靶耦合。2030 年代初，Vulcan 设施将约 40 个 Argos 放大器组合成 4 至 12 MJ 驱动器，目标是实现工程级墙插效率盈亏平衡，并支持国家安全测试任务。最后，Xcimer 计划在
              2030 年代中期建设 Athena 商业试验电站，为电网提供 400 MW 净电力。
