      - number: '2.4'
        title: 采用驱动因素、结构性瓶颈与规模测算尽调缺口
        blocks:
          - type: paragraph
            body: >-
              宏观脱碳政策、工业电气化和算力集群带来的电力需求激增，带来前所未有的顺风，但 Xcimer
              仍面临结构性采用约束和尽调缺口。历史上，惯性约束聚变实验只有在耗用远超早期计算模型预测的驱动能量后，才能在预期热力学条件下实现点火。商业可行性要求同时解决大批量精密靶制造、激光重复频率耐久性和腔体保护。Xcimer
              源自 HYLIFE 的流动液盐墙可缓解中子损伤、避免周期性更换结构第一壁，但这一集成系统从未实现规模化运行。关键是，公开文件显示 Athena
              试验电站尚无已签署购电协议、客户意向书、公用事业保证金或指定场址业主。尽调应持续跟踪 DOE Milestone Program 后续阶段交付物和 Anvil 设施建设，以验证商业成本模型。
            claimRefs:
              - CM001
              - CM008
              - CM010
              - CM011
              - CM013
              - CM014
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 军民两用商业化与 RTX 合作
            body: >-
              2026 年 9 月与 RTX Ventures 达成的少数股权投资和合作协议，为 Xcimer
              提供了关键的军民两用商业路径。定向能防御系统面临相同的脉冲激光工程难题——每焦耳成本低、重复频率高且达到工业级可靠性——因此 Xcimer 可用国防资本降低准分子驱动器风险，同时继续开拓更长期的电网基荷市场。
            calloutType: insight
            claimRefs:
              - CM006
          - type: callout
            title: 商业化时点与买方采用现实
            body: >-
              尽管 DOE 已批准 724 页的 Athena 预概念技术设计，Xcimer
              仍是商业化前公司，没有已签约兆瓦、客户购电协议或指定公用事业场址业主。商业公用事业买家在投入资本前，需要数千小时可靠性数据、经过验证的液盐腔体寿命和有竞争力的 LCOE 基准，因此实质性商业收入要到 2030
              年代中期以后才可能出现。
            calloutType: risk
            claimRefs:
