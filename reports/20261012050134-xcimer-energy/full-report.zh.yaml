  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: 准分子激光驱动器与非线性光学脉冲压缩架构
        blocks:
          - type: paragraph
            body: >-
              Xcimer Energy 正在开发一套惯性约束聚变（ICF）电站架构，与传统固态玻璃激光系统有根本差异。Lawrence Livermore National Laboratory 的 National
              Ignition Facility（NIF）使用数百条三倍频玻璃激光光束线，而 Xcimer 方案以高能电子束泵浦的氟化氪（KrF）准分子气体激光器为核心，原生发射深紫外（248
              nm）波长。准分子气体介质不会产生永久性光学损伤，因此可省去昂贵的激光玻璃更换和频率转换晶体。不过，准分子放大器天然产生微秒级长脉冲，而惯性聚变燃料靶丸需要纳秒级压缩才能驱动流体动力学内爆。为解决这一时间错配，Xcimer
              采用一串非线性光学（NLO）气体反射镜。前向 Raman 光束合成器先将数百束长脉冲准分子光束的能量重新导向并在空间上集中到单一高通量通道，随后两个连续的稀有气体 Stimulated Brillouin
              Scattering（SBS）反射镜反射并将脉冲压缩数个数量级，降至数纳秒。最终高通量脉冲通过快速无窗真空快门进入反应腔体，完全绕开固态终端光学器件及其光学损伤阈值。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
