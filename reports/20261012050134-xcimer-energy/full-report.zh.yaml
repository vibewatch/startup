      - number: '3.2'
        title: 架构差异：气体准分子激光对比 DPSSL 与托卡马克
        blocks:
          - type: paragraph
            body: >-
              Xcimer 的核心技术差异建立在两根支柱上：KrF 气体准分子激光驱动器和 HYLIFE-III
              液盐反应腔体。竞争性的激光聚变方案依赖二极管泵浦固态激光器（DPSSL），由于昂贵的激光二极管阵列和特种玻璃增益介质，其长期资本成本底线估计为靶上每焦耳 $700 至 $1,000（10 MJ 系统为 $7B 至
              $10B）。Xcimer 预计借助可扩展 KrF 气体光学器件，将驱动器成本降到每焦耳 $100 以下。与此同时，SPARC 等磁约束托卡马克面临严重材料科学瓶颈：14 MeV 聚变中子每年造成固体第一壁每原子
              10 至 20 次位移，因此每一至两年就必须整体更换墙体。Xcimer 用流动熔融氟化锂铍盐（FLiBe）吸收中子损伤并自然增殖氚，从而绕开这一弱点，消除固体第一壁更换周期。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP007
              - CP008
      - number: '3.3'
        title: 商业化模式、资本密集度与电力承购
        blocks:
          - type: paragraph
            body: >-
              要把技术差异转化为经济竞争力，必须有可行的电站封装方案和公用事业承购协议。CFS 设想建设 400 MWe 的 ARC 电站，General Fusion
              则推进公用事业许可；但当前所有私营聚变开发商都有共同弱点：完全没有具有约束力的商业购电协议或客户保证金。Xcimer 路线图预计在丹佛 Phoenix 原型机以及 Anvil、Vulcan 中间演示机之后，于
              2030 年代中期建设 300 至 500 MWe 的 Athena 商业电站。凭借 2026 年 5 月完成的 1 亿美元 A
              轮，公司有足够资金完成早期激光物理里程碑；但长期资本充足性仍取决于在资本支出升级至商业电站建设前，能否取得公用事业场址承诺或项目融资银团。
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP013
          - type: table
            tableRef: TP003
