              商业聚变电站制定的概念前设计和技术路线图。然而，同行评议的核聚变研究强调，实验室点火历来需要高于初始模型预测的驱动能量；在 2028 年 200 kJ Anvil 演示机及 2030
              年代商业运行之前，公司仍面临重大的物理、重复脉冲和靶制造风险。
