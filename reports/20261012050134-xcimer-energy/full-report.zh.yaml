      - number: '1.2'
        title: 创始人、管理团队与技术专长
        blocks:
          - type: paragraph
            body: >-
              Xcimer 管理层汇聚了激光物理、辐射流体力学和早期创业领域的技术与创业经验。联合创始人 Conner Galloway 担任 CEO 和首席科学官，其惯性约束聚变研究始于 Los Alamos
              National Laboratory，累计超过 15 年。联合创始人 Alexander Valys 担任总裁兼 CTO，自 2002 年起创办并扩大聚变、医疗和机器学习领域的科技初创公司。两人共同带领一支超过
              150 人的团队，成员来自国家实验室、航空航天承包商和半导体光刻设备制造商，包括工程师、物理学家、脉冲功率专家和技术人员。尽管领域经验深厚，Xcimer
              仍高度依赖两位联合创始人推动科学路线图和实体原型集成；独立董事会构成及少数股东治理安排尚未披露。
