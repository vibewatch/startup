      - number: '6.3'
        title: Named Counterparty Proof, Pilots & Federal Partnerships
        blocks:
          - type: paragraph
            body: >-
              Xcimer Energy customer and development ecosystem is anchored by public sector scientific agencies,
              aerospace defense contractors, and specialized industrial manufacturing suppliers. Its primary formal
              development counterparty is the U.S. Department of Energy, which conducts formal technical stage-gate
              reviews before releasing milestone tranches. On the defense front, RTX serves as the sole announced
              corporate integration partner, actively evaluating pulsed excimer lasers for military air defense
              integration. On the industrial supply side, TRUMPF Laser SE collaborates on optical engineering and
              high-power gas laser manufacturing systems, providing specialized manufacturing competence for Xcimer
              two-beamline architecture. In addition, Xcimer maintains research collaborations across leading
              institutions including Lawrence Livermore National Laboratory, Los Alamos National Laboratory, and Oak
              Ridge National Laboratory. Crucially, none of these counterparties represent commercial power offtakers,
              signed power purchase agreements, or industrial heat customers, leaving customer proof entirely
              pre-commercial.
            claimRefs:
              - CU001
              - CU002
