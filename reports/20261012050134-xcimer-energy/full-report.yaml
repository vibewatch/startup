  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Addressable Spend, and Segment Definition
        blocks:
          - type: paragraph
            body: >-
              Xcimer Energy defines its total addressable market boundary around utility-scale clean electricity
              generation, high-temperature industrial heat delivery, and military directed-energy defense applications.
              By pursuing a laser inertial confinement fusion (ICF) architecture, Xcimer directly addresses the global
              imperative for firm, dispatchable, carbon-free baseload power capable of replacing retiring coal, gas, and
              legacy nuclear generation assets. Unlike intermittent wind and solar resources that require massive energy
              storage or transmission buildouts, fusion power plants interface directly with the existing electrical
              transmission grid as synchronous thermal generation. In addition to wholesale utility generation, Xcimer
              pulsed excimer laser technology addresses dual-use defense applications. In September 2026, RTX Ventures
              completed a minority investment and teaming agreement to integrate Xcimer pulsed excimer lasers into
              military directed-energy systems. However, spend associated with transmission infrastructure, retail
              distribution, and IT compute systems remains strictly excluded from Xcimer core addressable power market.
            claimRefs:
              - CM001
              - CM002
              - CM006
              - CM007
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM006
              - CM007
      - number: '2.2'
        title: 'Market Sizing Lenses: Grid Baseload, Directed Energy, and Industrial Heat'
        blocks:
          - type: paragraph
            body: >-
              Sizing the long-term commercial opportunity for laser fusion requires evaluating multiple distinct demand
              lenses rather than relying on a single top-down total addressable market projection. At the macro layer,
              the global clean firm baseload electricity market represents a multi-trillion-dollar annual expenditure
              across dozens of terawatt-hours of demand. Under the U.S. Department of Energy Fusion Science and
              Technology Roadmap published in June 2026, federal strategy targets 50 to 100 gigawatts of grid fusion
              capacity by 2040. Xcimer preconceptual Athena pilot plant design, formally approved by the DOE in June
              2026, is sized for 400 megawatts of electric output operating at a repetition rate of up to 1 Hz (86,400
              ignitions per day). Xcimer models its first-of-a-kind (FOAK) laser hardware costs at $100 to $120 per
              joule on target, with nth-of-a-kind (NOAK) systems declining to $60 to $80 per joule. This represents an
              order-of-magnitude reduction compared to diode-pumped solid-state laser costs estimated at $700 to $1,000
              per joule.
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM005
              - CM009
              - CM014
