        title: Founders, Leadership Team, and Technical Expertise
        blocks:
          - type: paragraph
            body: >-
              Xcimer's executive leadership brings concentrated technical and entrepreneurial experience across laser
              physics, radiation hydrodynamics, and early-stage company building. Co-founder Conner Galloway serves as
              Chief Executive Officer and Chief Science Officer, drawing upon more than fifteen years of inertial
              confinement fusion research initiated at Los Alamos National Laboratory. Co-founder Alexander Valys serves
              as President and Chief Technology Officer, having founded and scaled technology startups across fusion,
              healthcare, and machine learning since 2002. Together, Galloway and Valys lead a team of more than 150
              engineers, physicists, pulsed-power specialists, and technicians drawn from national laboratories,
              aerospace contractors, and semiconductor lithography manufacturers. Despite their deep domain expertise,
              Xcimer maintains high key-person dependence on both co-founders to drive its scientific roadmap and
              physical prototype integration, while independent board composition and minority governance structures
              remain undisclosed.
            claimRefs:
              - CO001
              - CO003
              - CO004
              - CO008
