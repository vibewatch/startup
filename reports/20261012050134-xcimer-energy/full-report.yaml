      - number: '5.3'
        title: HYLIFE-III Thick-Liquid-Wall Chamber and Tritium Fuel Cycle
        blocks:
          - type: paragraph
            body: >-
              A primary bottleneck for commercial inertial fusion energy has been chamber survivability under sustained
              bombardment by energetic 14 MeV fusion neutrons. Conventional dry-wall chambers suffer severe structural
              activation, material embrittlement, and wall erosion that require frequent, highly capital-intensive
              first-wall replacements. Xcimer resolves this material degradation problem by adopting the HYLIFE
              thick-liquid-wall architecture originally pioneered by LLNL. In this design, a continuous shower of molten
              lithium-beryllium fluoride salt (FLiBe) cascades through the chamber interior, creating a thick protective
              barrier that absorbs virtually all 14 MeV neutron flux, target debris, and high-energy x-rays before they
              reach structural steel boundaries. The flowing liquid salt moderates neutrons, carries away reaction
              thermal energy to drive standard steam turbine balance-of-plant cycles, and breeds tritium fuel with an
              estimated breeding ratio of 1.2. Because Xcimer's laser architecture concentrates optical energy into just
              two opposed beamlines entering through small windowless apertures, the thick-liquid waterfall can maintain
              almost complete solid-angle coverage around the fuel capsule, preserving structural steel components for
              decades and limiting total plant tritium inventory to under 150 grams.
            claimRefs:
              - CE008
              - CE009
              - CE010
              - CE011
          - type: table
            tableRef: TE002
            claimRefs:
              - CE006
              - CE008
              - CE012
              - CE014
      - number: '5.4'
        title: Economic Differentiation, Target Physics, and Execution Dependencies
        blocks:
          - type: paragraph
            body: >-
              The economic viability of Xcimer's approach rests on decoupling laser driver energy scaling from
              semiconductor diode supply chain constraints. Detailed comparative cost models co-authored with industrial
              laser manufacturer TRUMPF estimate that first-of-a-kind (FOAK) excimer-NLO laser hardware can be delivered
              at $100 to $120 per joule on target, declining to $60 to $80 per joule in nth-of-a-kind plants. In
              contrast, diode-pumped solid-state lasers face an asymptotic cost floor of $700 to $1,000 per joule due to
              raw diode packaging, crystal fabrication, and specialized optical coatings. Furthermore, delivering higher
              driver energy (10 to 12 MJ) enables the use of larger, more robust hybrid direct-drive fuel capsules with
              gains exceeding 200, relaxing repetition rate requirements to between 0.25 and 1 Hz. Significant technical
              and engineering risks remain, however. High-repetition-rate operation requires developing durable,
              fast-cycling vacuum shutters, managing FLiBe droplet mist clearance in the beam path between shots,
              demonstrating uniform two-beam implosions without asymmetric hydrodynamic breakup, and qualifying
              long-life electron-beam cathode foils under continuous thermal and electrical stress.
            claimRefs:
              - CE007
              - CE010
              - CE012
              - CE013
              - CE014
          - type: table
            tableRef: TE003
            claimRefs:
              - CE001
              - CE002
              - CE009
              - CE010
              - CE011
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Cost and Structural Durability Advantages of Gas Lasers and Thick-Liquid Walls
            body: >-
              By substituting solid laser glass with e-beam pumped KrF gas and replacing solid first walls with a
              flowing FLiBe molten salt blanket, Xcimer addresses both the $1,000/J optical cost barrier and the severe
              14 MeV neutron material damage that impede solid-state ICF.
            calloutType: strength
            claimRefs:
              - CE001
              - CE009
              - CE010
              - CE012
          - type: callout
            title: Repetition Rate, Optics Protection, and Two-Beam Implosion Symmetry Risks
            body: >-
              Scaling from single-shot demonstration in Phoenix to continuous 0.25–1 Hz grid power requires validating
              fast mechanical vacuum shutters, clearing liquid salt vapor droplets between pulses, and proving that
              two-sided equatorial beam profiling drives adequate spherical compression without hydrodynamic breakup.
            calloutType: risk
            claimRefs:
              - CE002
              - CE007
              - CE009
              - CE013
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation & Target Offtakers
        blocks:
          - type: paragraph
            body: >-
              Xcimer Energy is pursuing a multi-market commercialization strategy spanning wholesale electric power,
              high-temperature industrial heat, and national security directed-energy applications. In the primary power
              generation market, target customers comprise regulated electric utilities, independent power producers,
              and transmission grid operators seeking zero-carbon baseload electricity to replace retiring coal and
              natural gas capacity. The company has sized its commercial flagship pilot, Athena, at 400 megawatts
              electric to align with standard utility substation blocks and regional grid interconnection limits. Beyond
              electric utilities, Xcimer targets heavy industrial processors and synthetic fuel producers requiring
              continuous high-temperature heat. In parallel, Xcimer has opened an intermediate defense customer channel
              by partnering with RTX to adapt its high-energy pulsed laser architecture for containerized military air
              defense. However, because Xcimer remains at the laboratory prototype stage, it currently possesses zero
              commercial revenue, no signed power purchase agreements, and no active customer accounts across any
              civilian commercial vertical.
            claimRefs:
              - CU001
              - CU003
              - CU004
              - CU005
              - CU012
              - CU013
          - type: table
            tableRef: TU001
