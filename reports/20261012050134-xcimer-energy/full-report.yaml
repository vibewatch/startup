  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Commercial Fusion Landscape and Alternative Approaches
        blocks:
          - type: paragraph
            body: >-
              The landscape of private fusion energy is characterized by a stark dichotomy between magnetic confinement
              fusion (MCF) and inertial confinement fusion (IFE). Commonwealth Fusion Systems has secured several
              billion dollars to construct SPARC, a compact tokamak relying on high-temperature superconducting magnets
              targeting net energy in 2027. Meanwhile, General Fusion is advancing magnetized target fusion via a SPAC
              transaction valued at approximately $1 billion. In contrast, Xcimer Energy pursues inertial confinement
              fusion, building upon the National Ignition Facility's historic milestone of 8.6 MJ fusion yield from 2 MJ
              laser input. Unlike legacy solid-state research facilities, Xcimer aims to industrialize krypton-fluoride
              excimer lasers, commissioning its first private-sector e-beam KrF prototype in 2026. This landscape pits
              Xcimer against well-capitalized magnetic incumbents and solid-state IFE ventures, requiring substantial
              capital efficiency to reach commercial viability.
            claimRefs:
              - CP001
              - CP004
              - CP005
              - CP009
              - CP010
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
      - number: '3.2'
        title: 'Architectural Differentiation: Gas Excimer vs. DPSSL and Tokamaks'
        blocks:
          - type: paragraph
            body: >-
              Xcimer's fundamental technological differentiation rests on two architectural pillars: KrF gas excimer
              laser drivers and HYLIFE-III liquid-salt reaction chambers. Competing laser fusion efforts depend on
              diode-pumped solid-state lasers (DPSSLs), which face an estimated long-term capital cost floor of $700 to
              $1,000 per joule on target ($7B to $10B for a 10 MJ system) due to expensive laser diode arrays and
              specialized glass gain media. Xcimer projects driver costs below $100 per joule using scalable KrF gas
              optics. Concurrently, magnetic confinement tokamaks like SPARC face acute material science bottlenecks, as
              14 MeV fusion neutrons degrade solid first walls by 10 to 20 displacements per atom annually,
              necessitating full wall replacements every one to two years. Xcimer circumvents this vulnerability by
              utilizing flowing molten lithium fluoride salt (FLiBe) to absorb neutron damage and breed tritium
              naturally, eliminating solid first-wall replacement cycles.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP007
              - CP008
      - number: '3.3'
        title: Commercialization Models, Capital Intensity, and Power Off-Take
        blocks:
          - type: paragraph
            body: >-
              Translating technological differentiation into economic competitiveness requires viable power plant
              packaging and utility off-take agreements. While CFS envisions a 400 MWe ARC power plant and General
              Fusion pursues utility licensing, all private fusion developers currently share a common vulnerability:
              the total absence of binding commercial power purchase agreements or customer deposits. Xcimer's roadmap
              projects a 300 to 500 MWe Athena commercial power plant in the mid-2030s following its Denver Phoenix
              prototype and intermediate Anvil and Vulcan laser demonstrators. Supported by a $100 million Series A
              round closed in May 2026, Xcimer has sufficient funding to retire early laser physics milestones. However,
              long-term capital adequacy remains contingent on securing utility host commitments or project-finance
              syndications before capital expenditures escalate toward commercial plant construction.
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
