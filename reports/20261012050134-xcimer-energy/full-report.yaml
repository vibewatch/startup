      - number: '6.2'
        title: Commercial Traction, Federal Milestones & Defense Applications
        blocks:
          - type: paragraph
            body: >-
              Without revenue-generating commercial accounts, Xcimer Energy measures adoption progress through
              competitive non-dilutive government awards, strategic defense integration agreements, and progressive
              hardware commissioning milestones. Under the U.S. Department of Energy Milestone-Based Fusion Development
              Program, the company has secured $39.5 million in total available milestone funding, complemented by an
              earlier $4 million ARPA-E award, bringing cumulative federal commitments to $43.5 million. The DOE
              recently advanced Xcimer into its second budget period after formally approving the preconceptual design
              and technical roadmap for Athena. In the hardware domain, Xcimer commissioned its 74,000-square-foot
              Phoenix laser demonstration facility in Denver in June 2026, successfully operating integrated excimer
              amplifiers and a 38-meter Stimulated Brillouin Scattering pulse compression gas optic. In the defense
              vertical, defense contractor RTX announced a strategic partnership and direct equity investment in
              September 2026 to containerize Xcimer pulsed lasers into mobile air defense packages for defeating
              airborne threats. These achievements provide technical validation and intermediate non-dilutive capital,
              though commercial grid delivery remains targeted for the mid-2030s.
            claimRefs:
              - CU001
              - CU002
              - CU006
              - CU007
              - CU008
              - CU010
              - CU014
