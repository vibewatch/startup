      - number: '1.3'
        title: Capitalization Structure, Investors, and Defense Expansion
        blocks:
          - type: paragraph
            body: >-
              To finance its multi-stage hardware roadmap, Xcimer has raised nearly $200 million in cumulative private
              equity capital across seed, Series A, and strategic defense financing rounds. In May 2026, the company
              closed a $100 million Series A equity round led by Hedosophia, with participation from premier climate and
              deep-tech venture funds including Breakthrough Energy Ventures and Lowercarbon Capital. Public sector
              support includes a $9 million grant awarded under the U.S. Department of Energy's Milestone-Based Fusion
              Development Program to advance early KrF laser milestones. In September 2026, RTX Ventures completed a
              strategic minority investment paired with a commercial teaming agreement to explore containerized
              pulsed-laser systems for defense and air defense applications. While these capital injections provide
              near-term development runway, Xcimer has kept its post-money valuation, ownership distribution, and
              monthly cash burn rate undisclosed, presenting an unverified financing profile.
