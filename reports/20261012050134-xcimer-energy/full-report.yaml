  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Adoption and commercialization lifecycle across federal validation, defense demonstration, utility pilot
      development, and commercial grid deployment.
    approximationNotes: >-
      Milestone phases and target operational dates reflect company roadmap projections and DOE Milestone program
      schedules; commercial power plant deployment in 2035 is subject to successful laser scaling and regulatory
      licensing.
    data:
      items:
        - label: 'Phase 1: Federal Vetting & Grant Milestones'
          stage: Federal R&D
          summary: Participation in DOE Milestone-Based Fusion Development Program and ARPA-E awards.
          detail: >-
            Non-dilutive funding structured around technical risk retirement from Phoenix to Athena preconceptual
            design.
        - label: 'Phase 2: Prototype Laser Operations'
          stage: Hardware Proof
          summary: Operational demonstration of the 74,000 sq ft Phoenix prototype in Denver.
          detail: Demonstrates microsecond-to-nanosecond SBS pulse compression and Marx pulsed power architecture.
        - label: 'Phase 3: Strategic Defense Containerization'
          stage: Defense Collaboration
          summary: Partnership with RTX to adapt pulsed excimer lasers for directed-energy air defense.
          detail: Provides near-term operational validation and strategic capital ahead of commercial energy deployment.
        - label: 'Phase 4: Breakeven Energy Demonstration'
          stage: Wall-Plug Breakeven
          summary: Construction of the Vulcan high-yield facility targeting net energy gain by 2031.
          detail: Combines multiple Argos modules to deliver 4 MJ on target, proving electrical breakeven.
        - label: 'Phase 5: Utility Pilot Host & Interconnection'
          stage: Commercial Demonstration
          summary: Securing utility site hosts, environmental licensing, and interconnection agreements for Athena.
          detail: >-
            Crucial transition point requiring first commercial utility MOUs, pilot capital expenditure syndication, and
            PPA structuring.
        - label: 'Phase 6: Grid Baseload Electricity Deployment'
          stage: Commercial Scale
          summary: Commercial operation of the 400 MWe Athena laser fusion power plant targeting mid-2030s.
          detail: Delivers round-the-clock clean firm power targeting $40/MWh levelized cost to electric utilities.
