              - CM013
              - CM014
      - number: '2.4'
        title: Adoption Drivers, Structural Bottlenecks, and Sizing Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              While macro decarbonization mandates and surging electricity demand from industrial electrification and
              compute clusters provide unprecedented tailwinds, Xcimer faces significant structural adoption constraints
              and diligence gaps. Historically, inertial confinement fusion experiments achieved ignition at predicted
              thermodynamic conditions only by requiring far more driver energy than early computational models
              projected. Commercial viability demands simultaneously solving high-volume precision target manufacturing,
              repetitive-rate laser durability, and chamber protection. While Xcimer HYLIFE-derived flowing liquid-salt
              wall addresses neutron damage and avoids periodic structural first-wall replacement, the integrated system
              has never been operated at scale. Crucially, public filings reveal zero signed power purchase agreements,
              customer letters of intent, utility deposits, or designated site hosts for the Athena pilot plant.
              Diligence requires monitoring future DOE Milestone Program phase deliverables and Anvil facility
              construction to verify commercial cost models.
            claimRefs:
              - CM001
              - CM008
              - CM010
              - CM011
              - CM013
              - CM014
