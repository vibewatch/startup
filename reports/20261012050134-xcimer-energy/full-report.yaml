      - number: '1.4'
        title: Execution Milestones, Technical Scaling, and Diligence Risks
        blocks:
          - type: paragraph
            body: >-
              Xcimer has progressed rapidly through its staged technical development roadmap, transitioning from
              theoretical design to multi-machine hardware demonstration. In June 2025, the company completed its Long
              Pulse Kinetics platform, achieving a record 3-microsecond pulse length as the first private-sector
              electron-beam KrF laser in over two decades. In June 2026, Xcimer initiated operations of Phoenix in its
              74,000-square-foot Denver facility, integrating a multi-kilojoule light source with a 38-meter Stimulated
              Brillouin Scattering gas optic for pulse compression. Concurrently, the U.S. Department of Energy approved
              Xcimer's preconceptual design and technology roadmap for Athena, a planned 400 MW commercial fusion power
              plant. Nevertheless, peer-reviewed nuclear fusion research emphasizes that laboratory ignition has
              historically required higher driver energies than initial models predicted, underscoring substantial
              physical, repetitively pulsed, and target-fabrication risks ahead of the 200 kJ Anvil demonstrator in 2028
              and commercial operations in the 2030s.
