              - CR011
      - number: '7.3'
        title: Capital, Talent, and Counterparty Dependencies
        blocks:
          - type: paragraph
            body: >-
              Capital adequacy is opaque. Independent reporting says Xcimer closed a $100 million Series A, while the
              company later described nearly $200 million raised across seed and Series A rounds; neither figure is cash
              available, and neither discloses burn, runway, restricted funds, or milestone budgets. The white paper
              conditions Athena timing on sufficient funding for parallel industrial development. Execution also depends
              on rebuilding specialized excimer laser supply chains and transferring scarce expertise, even as Xcimer
              plans to double its team and lists 56 openings. Management proposes defense revenue as an earlier funding
              bridge, but the assigned evidence gives no contract value, backlog, margin, or timing. Vulcan and Athena
              sites remain TBD, leaving host, utility, interconnection, and local permitting counterparties unresolved.
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
