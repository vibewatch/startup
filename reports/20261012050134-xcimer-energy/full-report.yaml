  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Technical Scale-Up and Integrated Operations
        blocks:
          - type: paragraph
            body: >-
              Independent review evidence supports the scientific foundation but not commercial readiness:
              inertial-confinement ignition has produced significant energy gain, while the energy needed to reach
              ignition exceeded earlier projections. Xcimer reports that Phoenix integrated excimer amplification and
              SBS compression above 1 kJ, but its roadmap then advances to a 200 kJ two-sided Anvil beamline and a 4–12
              MJ Vulcan system. That is a sequence of distinct engineering gates, not a single proven scale-up curve.
              The company's own white paper identifies two-beam implosion symmetry, phase-preserving nonlinear optics,
              target injection, repetitive operation, FLiBe hydraulics, and corrosion control as remaining work. The
              residual exposure is therefore critical until one system demonstrates target delivery, chamber clearing,
              component life, and repeatable shots together rather than as separate tests.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR015
