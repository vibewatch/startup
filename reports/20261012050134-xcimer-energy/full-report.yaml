  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Perspective
      - Core Argument
      - Supporting Evidence
      - What Would Change View
    rows:
      - - Thesis (Cost Architecture)
        - Excimer KrF lasers and NLO gas mirrors lower laser costs by ~10x vs DPSSLs to ~$100-$120/J FOAK
        - Xcimer white paper model shows $109/J FOAK and in-house capacitor production below $1/J
        - Independent audit of Denver Phoenix laser cost and optical transmission efficiency.
      - - Thesis (Chamber Longevity)
        - HYLIFE-II molten salt liquid wall shields chamber structures from neutron damage for 30-year life
        - Decades of LLNL HYLIFE research and 2024-2026 CFD simulations showing low FLiBe vaporization
        - Experimental demonstration of repetitive liquid jet clearing at operational pulse frequencies.
      - - Anti-Thesis (Scientific Precedent)
        - Inertial fusion history shows a 50-year pattern of underestimating physics challenges via simulation optimism
        - Dr. Thomas Mehlhorn perspective in Physics of Plasmas notes historical simulation over-optimism
        - Empirical high-gain hotspot ignition achieved on a two-beam KrF driver platform.
      - - Anti-Thesis (Capital Intensity)
        - >-
          Reaching commercial Athena pilot plant in mid-2030s requires billions in dilutive funding without near-term
          revenue
        - $100M Series A only funds Phoenix prototype and initial planning; commercial scale requires 100-module arrays
        - Execution of strategic corporate offtake agreements or non-dilutive defense/utility co-funding.
    notes: >-
      Evaluates positive and negative investment theses against published physics literature and company technical
      disclosures.
    claimRefs:
      - CV005
      - CV006
      - CV007
      - CV008
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Core Assumptions
      - Valuation / Return Logic
      - Key Downside Risks
      - Probability Signal
    rows:
      - - Bull Case
        - >-
          Phoenix succeeds in 2026; Anvil demonstrates 200 kJ in 2028; Vulcan hits breakeven by 2031; Athena 400 MWe
          plant built by 2035
        - >-
          Unlocks multi-billion-dollar valuation parity with top fusion leaders ($3B-$5B+) on path to gigawatt utility
          deployment
        - Cost overruns on pulsed power scaling and delays in multi-kilojoule SBS beam combination
        - 'Medium-Low (20%): contingent on unprecedented KrF pulse-compression scaling'
      - - Base Case
        - >-
          Phoenix validates SBS compression but integration delays push Anvil to 2029-2030; requires multiple large
          dilutive rounds
        - >-
          Valuation steps up modestly to $300M-$600M range across Series B/C; significant dilution for early equity
          holders
        - Pulsed-power capacitor failure rates, supply-chain bottlenecks for noble gases, FLiBe pump corrosion
        - 'Medium-High (55%): aligns with historical fusion hardware demonstration timelines'
      - - Bear Case
        - >-
          Two-beam direct drive fails to achieve required implosion symmetry; optical breakdown or filamentation in SBS
          gas cell
        - >-
          Severe down-round or liquidation; residual value limited to IP salvage and directed-energy defense
          applications
        - Total loss of equity value if KrF laser architecture cannot achieve target coupling or repetition rate
        - 'Medium (25%): high technical risk inherent to novel high-energy laser architectures'
    notes: >-
      Scenario parameters model technological milestone achievement against capital requirements and comparable fusion
      market valuations.
    claimRefs:
      - CV009
      - CV010
      - CV011
      - CV012
