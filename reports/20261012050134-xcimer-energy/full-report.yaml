      - number: '6.4'
        title: Offtake Durability, Expansion Pathway & Counterparty Concentration
        blocks:
          - type: paragraph
            body: >-
              Xcimer Energy commercial durability faces severe long-term execution hurdles and extreme near-term
              counterparty concentration. Because the company generates zero recurring revenue, standard retention
              metrics such as net revenue retention, gross revenue retention, and customer churn are inapplicable at
              this development stage. Near-term survival depends entirely on maintaining milestone eligibility under DOE
              federal grant schedules and sustaining development momentum with its single defense partner, RTX. Looking
              ahead to mid-2030s commercialization, power generation adoption confronts massive procurement friction:
              electric utilities require multi-year integrated resource planning filings, stringent state public utility
              commission reviews, and comprehensive environmental impact statements before committing capital to novel
              generation assets. Furthermore, macro projections from the U.S. Energy Information Administration
              anticipate flat nuclear and emerging advanced power capacity across baseline cases, highlighting that
              utility offtakers will only contract for laser fusion if plants achieve competitive construction capital
              expenditures and deliver reliable firm baseload power at or below $40 per megawatt-hour.
            claimRefs:
              - CU004
              - CU005
              - CU009
              - CU010
              - CU011
              - CU014
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Absence of Commercial Customers and Utility Offtake Commitments
            body: >-
              Xcimer Energy currently generates zero commercial revenue and holds no binding power purchase agreements,
              letters of intent, or pilot commitments with electric utilities. While the company models an attractive
              $40/MWh levelized cost of electricity and $3B capital expenditure for initial 400 MWe Athena plants, the
              lack of utility commercial traction exposes the company to severe adoption timing and procurement risks.
            calloutType: risk
            claimRefs:
              - CU003
              - CU005
              - CU009
              - CU014
          - type: callout
            title: Defense Integration as an Intermediate Commercial Bridge
            body: >-
              The September 2026 strategic partnership and investment with RTX provides Xcimer Energy with an essential
              intermediate application for its pulsed excimer laser platform. By containerizing pulsed lasers for
              military directed-energy air defense, Xcimer can validate hardware reliability in operational environments
              and generate non-dilutive defense capital years before grid-scale commercial fusion power is achieved in
              2035.
            calloutType: insight
            claimRefs:
              - CU001
