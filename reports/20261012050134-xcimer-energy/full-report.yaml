chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity and Laser-Inertial Fusion Model
        blocks:
          - type: paragraph
            body: >-
              Xcimer Energy Corporation was founded in late 2021 by MIT alumni Conner Galloway and Alexander Valys to
              commercialize inertial confinement fusion through an alternative laser architecture. Headquartered in
              Denver, Colorado, the company operates an inertial fusion technology business centered on
              electron-beam-pumped krypton-fluoride (KrF) excimer gas lasers, nonlinear optical gas media for pulse
              compression, and a flowing lithium-salt chamber designed to protect structural walls. Unlike legacy
              solid-state glass laser approaches that rely on thousands of optical elements and complex diode arrays,
              Xcimer's two-beamline design aims to produce up to 10 megajoules on target at substantially reduced
              capital cost. The company remains in a pre-commercial development stage with zero reported commercial
              revenue, focusing its 150-person multidisciplinary engineering workforce on prototype laser construction
              and component validation ahead of commercial power plant deployment.
            claimRefs:
              - CO001
              - CO002
              - CO008
