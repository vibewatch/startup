      - number: '2.3'
        title: Buyer Personas, Procurement Dynamics, and Budget Ownership
        blocks:
          - type: paragraph
            body: >-
              Commercialization requires navigating highly conservative institutional buyers across regulated electric
              utilities, defense prime contractors, and hyperscale technology operators. Regulated utilities operate
              under rigorous integrated resource planning (IRP) processes overseen by state utility commissions,
              requiring demonstrated multi-thousand-hour plant availability, low levelized cost of electricity, and
              predictable operational risk before entering power purchase agreements. Defense prime contractors like RTX
              represent an accelerated commercial off-ramp, evaluating pulsed laser technology through defense
              appropriations and technology readiness levels rather than grid wholesale power economics. A third
              emerging buyer segment comprises hyperscale cloud operators seeking dedicated behind-the-meter clean
              generation for energy-intensive artificial intelligence data centers, driven by severe transmission queue
              delays. Across all commercial categories, decision authority rests with executive committees demanding
              verified engineering benchmarks rather than theoretical ignition gains.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM008
              - CM013
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
