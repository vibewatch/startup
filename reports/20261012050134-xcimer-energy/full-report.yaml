      - number: '7.2'
        title: Regulatory, Legal, and Safety Exposure
        blocks:
          - type: paragraph
            body: >-
              The U.S. baseline is favorable relative to fission: the ADVANCE Act codified treatment of near-term fusion
              systems under the NRC's byproduct-material framework rather than the more extensive fission framework.
              That policy reduces one category of licensing uncertainty, but it is not a project approval for Xcimer.
              The assigned evidence does not establish site-specific NRC or state requirements, environmental permits,
              tritium-accounting controls, occupational safeguards for FLiBe or beryllium, or export classifications for
              the company's dual-use laser work. Xcimer also acknowledges remaining FLiBe pump, nozzle, and
              corrosion-control development. These issues should be treated as unresolved compliance and design
              interfaces, not as evidence of a violation or a recorded safety incident.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR016
          - type: table
            tableRef: TR001
