        title: Exhibits
        blocks:
          - type: callout
            title: Capital Cost Disruption via Deep-UV Gas Excimer Architecture
            body: >-
              Xcimer's KrF excimer gas laser platform fundamentally bypasses the multi-billion-dollar cost floor of
              diode-pumped solid-state lasers by utilizing abundant noble gas gain media and nonlinear optical pulse
              compression. If validated at megajoule scale, this architecture offers a plausible path toward driver
              capital expenditure under $100 per joule, providing a ten-fold driver cost advantage over solid-state IFE
              competitors.
            calloutType: strength
            claimRefs:
              - CP001
              - CP002
              - CP003
          - type: callout
            title: Commercial Traction and Utility Off-Take Execution Vacuum
            body: >-
              Despite substantial technological ambition and $100 million in Series A funding, Xcimer operates in an
              unproven commercial category without binding power purchase agreements, customer deposits, or designated
              utility plant host partnerships. Furthermore, mature low-carbon alternatives—including fission SMRs and
              renewable-plus-storage installations—threaten to capture clean baseload utility demand long before fusion
              achieves commercial grid delivery.
            calloutType: risk
            claimRefs:
