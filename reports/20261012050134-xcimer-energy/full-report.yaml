              - CP005
              - CP007
              - CP013
      - number: '3.4'
        title: Moat Durability, Defense Optionality, and Substitute Competition
        blocks:
          - type: paragraph
            body: >-
              Xcimer's intellectual property around e-beam pumped excimer lasers and Stimulated Brillouin Scattering
              pulse compression provides meaningful barriers against direct laser fusion imitators. Moreover, Xcimer has
              established unique strategic optionality through an investment and teaming agreement with RTX Ventures to
              explore containerized pulsed-laser systems for defense and directed-energy missions. This dual-use pathway
              provides potential non-dilutive defense revenue unavailable to pure-play magnetic fusion developers.
              Nonetheless, Xcimer's ultimate moat depends on outcompeting non-fusion baseload generation. Advanced
              fission small modular reactors (SMRs) and ultra-low-cost renewables paired with grid-scale battery storage
              represent formidable status-quo substitutes that possess established regulatory pathways, mature supply
              chains, and immediate commercial availability.
            claimRefs:
