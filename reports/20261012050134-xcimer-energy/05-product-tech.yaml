  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / Process Component
      - System Role
      - Key Dependency
      - Primary Technical Risk
    rows:
      - - Marx Generator & Pulsed Power
        - Charges capacitive storage and delivers microsecond pulse to e-beam cathode
        - Proprietary high-voltage capacitors manufactured in Tucson, AZ
        - Switch reliability and capacitor degradation over millions of continuous shots
      - - Argos KrF Laser Cavity
        - Pumps krypton-fluoride gas mixture to generate 248 nm UV laser light
        - Relativistic e-beam cathode emitter and thin hibachi foil anode
        - Foil fatigue, gas circulation heat removal, and halogen chemistry maintenance
      - - Nonlinear Optical Gas Mirrors
        - Combines hundreds of beams (Raman) and compresses pulse (SBS) to nanoseconds
        - Pure pressurized noble gas cells and phase-preserving seed lasers
        - Acoustic turbulence, beam filamentation, and breakdown thresholds at high fluence
      - - Windowless Vacuum Transition
        - Directs high-fluence beam from atmospheric gas into target chamber vacuum
        - Fast-acting mechanical vacuum shutter synchronized with laser firing
        - Shutter seal durability, vacuum leakage into optics cell, and debris ingestion
    notes: Operating architecture specifications synthesized from technical publications with TRUMPF, LLE, LANL, and DOE milestone project reports.
