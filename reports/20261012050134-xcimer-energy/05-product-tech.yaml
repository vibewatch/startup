chapter:
  number: 5
  title: Product & Technology
  summary: Xcimer Energy is developing an inertial confinement fusion power system based on electron-beam-pumped KrF excimer lasers, nonlinear optical pulse compression in gas media, and a HYLIFE-III thick-liquid molten salt chamber. Operating prototype Phoenix in Denver demonstrates core excimer-SBS compression, but commercial viability depends on validating multi-Hz repetition, two-beam direct-drive implosion symmetry, and full-scale Argos amplifier manufacturing.
sections:
  - id: laser-architecture-overview
    title: Excimer Laser Driver and Nonlinear Optical Pulse Compression Architecture
    body: Xcimer Energy is developing an inertial confinement fusion (ICF) power plant architecture that fundamentally diverges from legacy solid-state glass laser systems. Rather than utilizing hundreds of frequency-tripled glass laser beamlines like Lawrence Livermore National Laboratory's National Ignition Facility (NIF), Xcimer's approach centers on high-energy electron-beam-pumped krypton-fluoride (KrF) excimer gas lasers emitting natively at deep-ultraviolet (248 nm) wavelengths. Excimer gas media cannot suffer permanent optical damage, eliminating expensive laser glass replacements and frequency conversion crystals. However, excimer amplifiers naturally produce long microsecond-scale pulses, whereas inertial fusion fuel capsules require nanosecond-scale compression to drive hydrodynamic implosions. To resolve this temporal mismatch, Xcimer employs an innovative chain of nonlinear optical (NLO) gas mirrors. A forward Raman beam combiner first redirects and spatially concentrates energy from hundreds of long-pulse excimer beams into a single high-fluence channel. Subsequently, two successive noble-gas Stimulated Brillouin Scattering (SBS) mirrors reflect and temporally compress the pulse by orders of magnitude down to several nanoseconds. The final high-fluence pulse is delivered into the reaction chamber through a fast-acting windowless vacuum shutter, completely bypassing solid final optics and optical damage thresholds.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
    tableRefs: []
    figureRefs:
      - FE001
  - id: modular-laser-and-facility-roadmap
    title: Argos Modular Amplifiers and Four-Phase Facility Demonstration Roadmap
    body: The industrial building block of Xcimer's commercial driver is the Argos laser amplifier module. Each modular Argos unit is designed to produce well over 100 kJ of 248 nm ultraviolet light pumped by relativistic electron beams energized by high-voltage Marx generators. To bridge historical national laboratory research with commercial manufacturing, Xcimer has established a staged facility roadmap across four systems. In Denver, the Phoenix prototype laser system is currently operating in a 74,000-square-foot facility, successfully demonstrating end-to-end integration of excimer amplification and SBS pulse compression across a 38-meter gas optic cell at pulse energies exceeding 1 kJ. In 2028, the Anvil demonstrator will integrate the first full-scale Argos modules to deliver 200 kJ across a two-sided opposed beamline to validate target coupling. In the early 2030s, the Vulcan facility will combine approximately 40 Argos amplifiers into a 4 to 12 MJ driver aimed at achieving engineering wall-plug breakeven and supporting national security testing missions. Finally, by the mid-2030s, Xcimer plans to construct Athena, a commercial pilot power plant designed to produce 400 MW of net electricity for the electrical grid.
    claimRefs:
      - CE003
