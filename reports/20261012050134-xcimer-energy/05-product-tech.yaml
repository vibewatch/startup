  - id: FE001
    title: Product architecture map
    type: stack
    summary: End-to-end technical architecture of Xcimer's KrF excimer laser inertial fusion energy system from pulsed power input to electric power generation.
    data:
      layers:
        - label: Pulsed Power & Marx Energy Storage
          detail: High-voltage capacitive energy storage and Marx generator banks delivering microsecond pulses
        - label: Argos KrF Excimer Laser Amplifiers
          detail: Electron-beam pumped noble gas laser cavities generating 248 nm deep-UV light
        - label: Nonlinear Optical Gas Mirrors (Raman & SBS)
          detail: Gas-phase beam combination and two-stage temporal compression from microseconds to nanoseconds
        - label: Windowless Beam Delivery & Vacuum Shutter
          detail: Two-beam opposed delivery bypassing solid final optics and optical damage thresholds
        - label: HYLIFE-III Thick-Liquid Molten Salt Chamber
          detail: Flowing FLiBe waterfall absorbing 14 MeV neutrons and eliminating solid first-wall replacement
        - label: Thermal Conversion & Tritium Recovery Cycle
          detail: Intermediate molten salt heat exchangers, steam turbine generators, and continuous tritium extraction
