callouts:
  - calloutType: strength
    title: Cost and Structural Durability Advantages of Gas Lasers and Thick-Liquid Walls
    body: By substituting solid laser glass with e-beam pumped KrF gas and replacing solid first walls with a flowing FLiBe molten salt blanket, Xcimer addresses both the $1,000/J optical cost barrier and the severe 14 MeV neutron material damage that impede solid-state ICF.
    claimRefs:
      - CE001
      - CE009
      - CE010
      - CE012
  - calloutType: risk
    title: Repetition Rate, Optics Protection, and Two-Beam Implosion Symmetry Risks
    body: Scaling from single-shot demonstration in Phoenix to continuous 0.25–1 Hz grid power requires validating fast mechanical vacuum shutters, clearing liquid salt vapor droplets between pulses, and proving that two-sided equatorial beam profiling drives adequate spherical compression without hydrodynamic breakup.
    claimRefs:
      - CE002
      - CE007
      - CE009
      - CE013
