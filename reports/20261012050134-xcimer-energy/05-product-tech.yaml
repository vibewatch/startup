  - id: chamber-design-and-molten-salt-wall
    title: HYLIFE-III Thick-Liquid-Wall Chamber and Tritium Fuel Cycle
    body: A primary bottleneck for commercial inertial fusion energy has been chamber survivability under sustained bombardment by energetic 14 MeV fusion neutrons. Conventional dry-wall chambers suffer severe structural activation, material embrittlement, and wall erosion that require frequent, highly capital-intensive first-wall replacements. Xcimer resolves this material degradation problem by adopting the HYLIFE thick-liquid-wall architecture originally pioneered by LLNL. In this design, a continuous shower of molten lithium-beryllium fluoride salt (FLiBe) cascades through the chamber interior, creating a thick protective barrier that absorbs virtually all 14 MeV neutron flux, target debris, and high-energy x-rays before they reach structural steel boundaries. The flowing liquid salt moderates neutrons, carries away reaction thermal energy to drive standard steam turbine balance-of-plant cycles, and breeds tritium fuel with an estimated breeding ratio of 1.2. Because Xcimer's laser architecture concentrates optical energy into just two opposed beamlines entering through small windowless apertures, the thick-liquid waterfall can maintain almost complete solid-angle coverage around the fuel capsule, preserving structural steel components for decades and limiting total plant tritium inventory to under 150 grams.
    claimRefs:
      - CE008
      - CE009
      - CE010
      - CE011
    tableRefs:
      - TE002
    figureRefs: []
  - id: operational-differentiation-and-engineering-risks
    title: Economic Differentiation, Target Physics, and Execution Dependencies
    body: The economic viability of Xcimer's approach rests on decoupling laser driver energy scaling from semiconductor diode supply chain constraints. Detailed comparative cost models co-authored with industrial laser manufacturer TRUMPF estimate that first-of-a-kind (FOAK) excimer-NLO laser hardware can be delivered at $100 to $120 per joule on target, declining to $60 to $80 per joule in nth-of-a-kind plants. In contrast, diode-pumped solid-state lasers face an asymptotic cost floor of $700 to $1,000 per joule due to raw diode packaging, crystal fabrication, and specialized optical coatings. Furthermore, delivering higher driver energy (10 to 12 MJ) enables the use of larger, more robust hybrid direct-drive fuel capsules with gains exceeding 200, relaxing repetition rate requirements to between 0.25 and 1 Hz. Significant technical and engineering risks remain, however. High-repetition-rate operation requires developing durable, fast-cycling vacuum shutters, managing FLiBe droplet mist clearance in the beam path between shots, demonstrating uniform two-beam implosions without asymmetric hydrodynamic breakup, and qualifying long-life electron-beam cathode foils under continuous thermal and electrical stress.
    claimRefs:
      - CE007
      - CE010
      - CE012
      - CE013
