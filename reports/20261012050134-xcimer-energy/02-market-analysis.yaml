callouts:
  - calloutType: insight
    title: Dual-Use Commercialization and the RTX Partnership
    body: >-
      The September 2026 minority investment and teaming agreement with RTX Ventures provides Xcimer with a critical
      dual-use commercial pathway. Directed energy defense systems face identical pulsed-laser engineering
      hurdles—requiring low cost per joule, high repetition rates, and industrial reliability—which allows Xcimer to
      de-risk its excimer driver hardware with defense capital while pursuing the longer-horizon grid baseload market.
    claimRefs:
      - CM006
  - calloutType: risk
    title: Commercialization Timing and Buyer Adoption Reality
    body: >-
      Despite receiving DOE approval for the 724-page Athena preconceptual technical design, Xcimer remains a
      pre-commercial venture with zero contracted megawatts, signed customer PPAs, or designated utility site hosts.
      Commercial utility buyers require multi-thousand-hour reliability data, demonstrated liquid-salt chamber
      lifespans, and competitive LCOE benchmarks before committing capital, placing meaningful commercial revenue beyond
      the mid-2030s.
    claimRefs:
      - CM001
      - CM008
      - CM014
