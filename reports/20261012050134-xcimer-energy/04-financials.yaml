  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: pricing-and-revenue-quality
      missingEvidence: >-
        Executed defense or energy contracts, funded backlog, list and realized
        pricing, discounts, revenue recognition, customer concentration, and
        gross margin by stream.
      whyItMatters: >-
        Without commercial terms, prospective channels cannot be converted into
        a revenue-quality or margin assessment.
      diligencePath: >-
        Review executed contracts, pipeline, invoices, accounting policies, and
        stream-level gross-profit schedules under NDA.
      relatedQuestionRefs:
        - QI002
    - type: private-evidence-only
      severity: material
      topic: unit-economics
      missingEvidence: >-
        Full-plant capex, target cost, uptime, utilization, service-delivery
        cost, working capital, CAC, payback, electricity price, and gross margin.
      whyItMatters: >-
        Cost per joule for one subsystem cannot establish plant economics,
        customer economics, or investment returns.
      diligencePath: >-
        Obtain the integrated techno-economic model, independent cost review,
        vendor quotes, operating assumptions, and sensitivity cases.
      relatedQuestionRefs:
        - QI004
      relatedTableRefs:
        - TI002
        - TI003
    - type: private-evidence-only
      severity: material
      topic: capital-adequacy
      missingEvidence: >-
        Current cash, restricted cash, monthly burn, runway, debt, committed
        obligations, milestone budgets, uses of the Series A, and next-round
        timing and size.
      whyItMatters: >-
        Funding raised cannot be translated into cash available or milestone
        coverage without these inputs.
      diligencePath: >-
        Request audited financials, monthly cash statements, cap table, debt
        schedule, board-approved budget, and a milestone-by-milestone financing
        plan.
