      - number: '4.4'
        title: 反向信号、财务不透明与尽调阻塞点
        blocks:
          - type: paragraph
            body: >-
              OneTrust 的财务图景存在多项反向或不透明因素，实质限制承销信心。第一，2023 年估值下调融资明确不利：估值较峰值压缩约 $800M，且发生在公司史上最大单次裁员之后（2022 年 6 月，约 950
              名员工）。所谓公司「最早对市场变化作出反应」的叙事，是对低利率环境中过度扩张所引发事件的正面包装，不是战略远见。第二，2026 年 3 月第二轮裁员（约 110 名员工、每年节省约
              $15M）说明成本理顺尚未完成，或收入增长还不足以吸收成本底座。


              第三，也是结构上最重要的一点，OneTrust 不披露 GAAP P&L、毛利率、NRR、流失率、CAC、烧钱速度或准确现金头寸。本章引用的每项财务指标，要么是公司声称的
              ARR，要么是第三方估计，都应按此口径处理。约 $190K 的隐含 ARR / FTE 低于同等 ARR 规模一流企业级 SaaS 展示的效率门槛；NRR 未披露，也意味着无法评估 ARR
              底座质量，即扩张收入与替换性流失之间的比例。第四，正在推进的 PE 出售流程带来执行风险：如果交易无法完成，公司会承受投资人压力，需要证明另一条流动性路径；延迟本身也说明，短期内顺利 IPO 并不可行。第五，剥离
              Convercent 道德与合规单元会收窄平台宽度、移除一个交叉销售抓手，可能影响多模块附加率和长期 NRR。
