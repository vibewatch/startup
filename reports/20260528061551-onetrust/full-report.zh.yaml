      - number: '8.2'
        title: 当前估值背景与融资历史
        blocks:
          - type: paragraph
            body: >-
              OneTrust 自 2016 年创立以来，7 轮累计融资 $1.13 billion；估值在 2021 年 4 月冲到 $5.3 billion 峰值，2023 年下轮融资降至 $4.5
              billion。股权结构里压着明显的优先权负担：Insight Partners（Series A 领投方）、Coatue、TCV、SoftBank Vision Fund 和 Generation
              Investment Management 均持有带清算优先权的优先股，非溢价退出场景下会吃掉普通股价值。公司未正式披露二级市场价格，但私募二级平台（Notice.co）曾引用过与 $4.5 billion
              标记相符的隐含估值。

              截至 2026 年 5 月，公司尚未宣布新的新股融资，并在积极探索 PE 收购方案。据报道，正在洽谈的潜在买方包括 KKR、Blackstone、Vista Equity Partners、Thoma
              Bravo、Silver Lake、Hellman & Friedman 和 Marlin Equity。传闻交易估值超过 $10 billion，约为 2025 年 $550 million ARR 的 18
              倍；这一价格高于软件行业常规水平，但符合 PE 为品类龙头、现金流为正的 GRC 平台给出的战略性定价。2024 年 12 月，公司在 Goldman Sachs 协助下，将 Ethics &
              Compliance 事业部（含 Convercent）剥离给 EQS Group（Thoma Bravo 被投企业），也显示管理层在更大交易前主动调整资产负债表。公司未提交 IPO 文件（S-1）；截至
              2026 年 5 月，IPO 跟踪来源也确认未发现已知保密递表。

              以上一轮 $4.5 billion 标记计算，并采用 2025 年 $550M ARR，当前隐含 ARR 倍数为 8.2x。若 PE 收购价达到 $10 billion，隐含倍数将升至 18.2x
              ARR，远高于上市 GRC / 隐私 SaaS 4–7x 的中位区间；只有买方愿意按 ARR 持续增长 20%+、并在交割后靠经营杠杆显著拉升 EBITDA 来定价，这一价格才说得通。按官方最后披露的 $4.5
              billion 标记看，估值相较 Varonis（EV / revenue 4–5x，约 13% 增长）和 BigID（二级隐含 3.5x，32% 增长）偏高；但若资产是有战略定价权的关键 SaaS，仍落在高溢价
              PE 私有化交易的支付区间内。
