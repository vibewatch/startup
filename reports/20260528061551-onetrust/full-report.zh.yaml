  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与公开财务进展
        blocks:
          - type: paragraph
            body: >-
              OneTrust 通过年度 SaaS 订阅模式变现，定价完全模块化且定制报价。客户购买单个或打包产品线的访问权——Consent & Preferences、Privacy
              Automation、Third-Party Risk Management、GRC、Data Governance、AI Governance、Tech Risk &
              Compliance——合同价值由模块数量、席位或管理员用户数、覆盖域名和数据主体数量驱动。专业服务、实施和入门培训通常单独计费，在复杂部署中可占客户总支出的重要部分。


              在私营公司语境下，公开牵引力证据已经是最强可得证据。OneTrust 2024 年 5 月 TrustWeek 公告确认，ARR 预计 2024 年超过 $500M，而 FY2023 为 $464M，意味着
              ARR 层面同比增长约 7.8%。在这一基础中，1,200+ 客户 ARR 各自超过 $100K，数家超过 $1M，说明企业层客户群健康，单客户收入贡献突出。客户基础达到 14,000+ 组织，Fortune
              100 中超过 75% 覆盖。OneTrust 已提出 $1B ARR 的长期目标。对于 2025 和 2026 年，外部估计（Latka、Compworth）认为 ARR 在 $525M–$575M
              区间，但这些是第三方外推，并非公司披露。


              企业粘性支撑收入质量——隐私、GRC 和同意管理都深嵌运营、对合规至关重要，且难以拆出——但公司未披露任何流失率、净收入留存率或队列 层面扩张数据，削弱了这一判断。IDC 将 OneTrust 评为截至 2025
              年连续多年全球数据隐私软件市场份额第一，Forbes 也在 2025 年连续第七年将其列入 Cloud 100，确认其商业规模和市场地位。这些信号积极，但无法替代只有公司才能提供的收入质量指标。
