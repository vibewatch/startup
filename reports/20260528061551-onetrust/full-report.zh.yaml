      - number: '1.2'
        title: 领导层、创始人与董事会治理
        blocks:
          - type: paragraph
            body: >-
              OneTrust 由单一创始人 Kabir Barday 创立，他从 2016 年到 2026 年 2 月一直担任唯一 CEO。2026 年 2 月 9 日，在截至 2026 年 1 月 31
              日的强劲财年之后，公司宣布 Barday 转任董事会成员和战略顾问，并任命 John Heyman 为新任 CEO。Heyman 是经验丰富的 B2B 技术高管，曾任 Radiant Systems
              CEO；Radiant Systems 是一家位于 Alpharetta 的酒店和零售技术提供商，2011 年以约 $1.2B 被 NCR Corporation 收购。他也曾任 Snap One
              CEO；Snap One 是一家位于 Charlotte 的智能生活产品和软件公司，2024 年以约 $1.4B 被 Resideo Technologies
              收购。两家公司都在他领导下完成首次公开募股，因此他具备推动 OneTrust 潜在流动性事件的相关经验。Barday 仍以董事身份积极参与，重点关注长期战略。


              董事会成员包括 Barday（创始人）、Heyman（CEO）和 Thomas Laffont。Laffont 是 Coatue Management 共同创始人，也是长期董事，并曾公开评论 Heyman
              的任命。Datadog CFO、前 Goldman Sachs 和 JPMorgan 投资银行家 David Obstler 于 2024 年 5
              月获任公司首位独立董事兼审计委员会主席。公司宣布计划招募四名独立董事，使七人董事会达到独立董事占多数，但 2026 年 2 月之后的完整董事名单尚未公开确认。


              运营管理层方面，Digvijay（DV）Lamba 于 2025 年加入，任首席产品与技术官（此前在 Alteryx）；Michael Schanker 于 2025 年加入，任首席营销官（此前为 Coupa
              Software CMO）；Blake Brannon 任首席创新官；Kim Rivera 任首席法务与业务事务官；Guido Torrini 任 CFO；Jim Monroe 任首席客户官。Lamba 和
              Schanker 的快速加入，显示公司在 IPO 前或交易前强化组织。Barday 作为公司文化和品牌架构师构成关键人依赖；CEO 交接是 OneTrust 历史上最重要的治理事件，也会成为尽调重点。
