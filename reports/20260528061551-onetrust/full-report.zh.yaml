      - number: '2.2'
        title: 市场规模测算——多重口径与相互矛盾的估计
        blocks:
          - type: paragraph
            body: >-
              需要多种规模测算口径，因为分析机构在范围、地域和细分纳入规则上差异很大，导致 2026 年估计若不审计每份报告定义就无法调和。隐私管理软件细分市场中，Mordor Intelligence（$6.24B，到
              2031 年 CAGR 23.08%）、Fortune Business Insights（$5.37B，到 2034 年 CAGR 35.5%）和 Coherent Market
              Insights（$5.08B，到 2035 年 CAGR 29.38%）形成一个自洽集群，将市场视为面向 GDPR、CCPA 及相邻法律的云交付合规自动化。差异主要来自是否纳入 AI 治理和 TPRM
              模块。同意管理平台细分市场又加入第二个、部分重叠的测算层：Business Research Insights 将 2026 年 CMP 市场估为 $2.43B（CAGR 10.2%），Research and
              Markets 估为 $1.13B（到 2032 年 CAGR 24.8%）——2.2 倍差距反映 CMP 被定义为独立 cookie 同意工具，还是隐私平台内完整同意编排层。AI 治理市场 2026 年规模为
              $492M–$610M（Gartner / Research and Markets / MarketsandMarkets），CAGR 超过 44%，由 EU AI Act 合规需求驱动。TPRM
              市场（$8–12B，CAGR 17–18.6%）是 OneTrust 参与竞争的最大子细分市场，但 OneTrust 不是主导供应商；是否纳入 TAM 计算，取决于 OneTrust 在独立 TPRM
              竞争中的胜率，存在争议。OneTrust 截至 TrustWeek 2024 报告的 $500M+ ARR 意味着其在 $5–6B 隐私管理市场中约有 8–10%
              渗透率——对品类领导者而言，这是一个可信的中后期增长阶段轨迹。AInvest 和分析师评论提及长期 $30B 隐私软件机会，但它聚合了隐私、安全、身份和相邻类别，超出 OneTrust
              当前产品范围。相互矛盾的估计应作为证据缺口保留，等待各研究机构披露方法论。
