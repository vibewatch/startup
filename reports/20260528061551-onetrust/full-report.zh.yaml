      - number: '2.3'
        title: 买方分层与预算动态
        blocks:
          - type: paragraph
            body: >-
              企业隐私软件采购通常由三方共同决定：首席隐私官或数据保护官负责平台选择，CISO 负责安全集成和数据发现模块，总法律顾问 负责监管风险和合同管理。在大型组织（1,000+ 员工）中，CPO 或 DPO
              主导平台选择并持有跨职能隐私预算；CISO 控制数据安全相关模块，总法律顾问推动同意和诉讼响应能力。预算所有权正转向共享治理模式——跨职能隐私指导委员会处理每年 $250K 以上的大型合同续约。OneTrust
              企业细分（ARR 超过 $100K 的客户）超过 1,200 个账户，是主要收入引擎；这一点由公司自身公告和 PRNewswire 新闻稿独立佐证。每年在 GDPR 合规上花费 €80K–200K
              的中端市场公司（200–1,000 名员工），构成有争夺的增长层，Captain Compliance 和 Didomi 等轻量替代方案正凭易用性和见效速度获得牵引。SMB 细分（200
              人以下）主要由自助式或低接触 CMP 方案（Cookiebot、Osano）服务，并不是 OneTrust 有意义的直接企业销售目标。付款方方面，企业隐私平台预算来自合规、法务或 IT
              安全成本中心，取决于组织结构；在金融服务和医疗健康中，监管事务团队往往直接掌握预算。云端（SaaS）部署占据 65% 以上市场份额，契合 OneTrust 的 GTM 模式和企业采购偏好。前五大 CMP
              厂商——OneTrust、TrustArc、BigID、Cookiebot 和 Didomi——合计控制约 80% 同意管理市场；根据 6sense 截至 2026 年跟踪，OneTrust 在更广义 GRC
              软件类别中估计占 42.7% 份额。
