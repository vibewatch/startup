      - number: '3.2'
        title: 竞争对手画像与关键差异
        blocks:
          - type: paragraph
            body: >-
              BigID 是 OneTrust 在 2026 年最可信的直接对手。BigID 以深度数据发现和分类起家，逐步演化为模块化数据安全平台，覆盖 DSPM、隐私、AI 治理和数据生命周期管理。截至 2026 年 2
              月，BigID 约有 682–700 名员工，10 轮融资合计 $308M（最近一轮：2024 年 2 月 $61.4M Series D），估值估计在 $1B 至 $1.25B 之间。BigID 在
              Forrester Wave Q4 2025 for Privacy Management Software 中被评为领导者，并在 19 项标准中获得最高分，包括个人数据发现、AI 风险评估和软件广度。2026
              年 1 月，Gartner 将 BigID 评为 Magic Quadrant for Data and Analytics Governance Platforms 的挑战者，显示其覆盖范围不同于
              OneTrust 的 TPRM 定位。BigID 相对 OneTrust 的公开优势，是更高的数据发现准确率、由 ML / NLP 驱动且覆盖 100+ 语言的分类能力，以及包括影子 AI 检测、AI
              模型自动发现和行业首个 Vendor AI Assessment tool 的 AI 治理套件。其独立同意管理产品（BigID CMP Express，2025 年 11 月推出并提供自助定价）表明它正直接竞争
              OneTrust 的同意模块。


              Securiti AI 创立于 2019 年，2022 年完成 $75M Series C；Veeam 于 2025 年 10 月宣布以 $1.725B 收购，并在 2025 年 12 月完成。Securiti
              的 600 名员工加入 Veeam，CEO Rehan Jalil 出任 Veeam 安全与 AI 总裁。合并后实体以“行业首个 Trusted Data Platform”进行营销，将 Securiti 的
              DSPM、隐私自动化、零信任控制和 AI 信任能力，与 Veeam 面向 550,000 个客户（包括 Fortune 500 中 82%）的数据韧性基础设施合并。这让 Veeam / Securiti
              有机会成为安全—隐私—治理买方相对 OneTrust 的融合替代方案，并凭 Veeam 既有企业安装基础获得分发优势。


              TrustArc 通过 TRUSTe 传承拥有近 30 年隐私管理经验，声称全球验证客户超过 28,900 家，包括 Amazon、Apple、IBM、Cargill 和 Marriott。其 Arc
              Intelligence 平台提供 176+ 集成、深度监管情报和端到端隐私编排。TrustArc 委托开展的 2026 年 1,800+ 名专业人士调查发现，隐私项目成熟的组织在 Global Privacy
              Index 上得分 70–76%，约高于平均水平 20 分，验证了项目管理价值。TrustArc 客户数高于 OneTrust 声称的 14,000+，但 OneTrust
              更偏大型企业账户，合同价值更高。Collibra 和 Informatica 从数据治理切入：Collibra 在企业治理从业者中约有 9.2% 心智份额，是 Global 2000
              金融服务、医疗健康和保险组织的偏好平台。Collibra 与 OneTrust 已正式建立集成合作，而非纯竞争——OneTrust 的数据发现输出会丰富 Collibra 企业目录。ServiceNow GRC
              和 RSA Archer 代表横向企业风险。大型 ServiceNow 客户更偏好 ServiceNow GRC，以延展既有 ITSM 和 SecOps 投资；RSA Archer（截至 2026 年
              Gartner Peer Insights 170 条评价、4.2 星）则因高度可配置、适合复杂多域风险项目而受青睐，但其界面老旧、维护成本高，使 OneTrust 在新部署中有可乘之机。
