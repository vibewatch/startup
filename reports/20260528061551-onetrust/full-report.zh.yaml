            body: >-
              OneTrust 的公开案例库、第三方客户数据库和合作伙伴发布的案例研究合在一起，确认了不止于展示 logo 的幻灯片的具名企业生产部署。全球最大制药公司之一 Boehringer Ingelheim 使用
              OneTrust，在企业范围内支撑全球数据保护问责与透明度。意大利大型保险公司 Sara Assicurazioni 部署 OneTrust，以达到并维持 EU DORA 和 NIS2
              框架合规——这是最早有文档记录、将 OneTrust 用于 DORA 专项准备的案例之一。MillerKnoll 用该平台搭建以客户为中心的隐私项目，把合规定位为竞争差异化。酒店 SaaS 公司 Mews 依赖
              OneTrust 做第三方风险管理和监管合规。在 APAC，Samsung、DHL 和 Yum! Brands 均为已确认客户，部署同意管理、数据隐私和治理方案。CVS Health 与 McKesson
