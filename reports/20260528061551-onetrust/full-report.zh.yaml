  - id: TI005
    title: 公开财务缺口与尽调阻塞项
    columns:
      - 缺失指标
      - 对投资判断的影响
      - 尽调路径
    rows:
      - - GAAP 收入和损益表
        - 无法验证 ARR 质量或盈利能力；自由现金流说法未经审计
        - 索取过去 3 个财年的经审计 GAAP 财务报表
      - - 按产品线拆分的毛利率
        - 无法评估云托管成本效率或专业服务拖累
        - 索取按 SaaS 与服务拆分收入和 COGS 的损益表
      - - 净收入留存率（NRR）
        - 无法评估流失与扩张平衡；ARR 质量不透明
        - 索取按客户队列和合同规模拆分的过去 12 个月 NRR
      - - 总收入流失率
        - 无法建模替补 ARR 压力或客户标识流失
        - 索取按月度、年度和队列拆分的总流失与净流失
      - - 获客成本和回本周期
        - 无法评估销售与营销效率或所需增长资本
        - 索取按分段拆分的综合 CAC 和回本周期
      - - 烧钱速度和账面现金
        - 没有下一轮融资时，无法确认现金跑道或资本充足性
        - 索取过去 12 个月现金消耗和当前银行余额
      - - 模块级 ARR 结构
        - 无法识别平台集中风险或扩张路径
        - 索取按产品模块拆分的 ARR 和交叉销售挂载率
      - - 按客户拆分的收入集中度
        - Fortune 100 渗透是正面信号，但前 10 大客户 ARR 未知
        - 索取前 10 大客户 ARR 及相关流失风险
      - - 股权激励费用（SBC）影响
        - FCF 为正可能掩盖大量 SBC；GAAP 净利润才是真测试
        - 索取 SBC 占收入比例，以及 FCF 定义中是否剔除 SBC
      - - 债务 / 授信安排义务
        - 任何债务契约或留置权都会影响 PE 收购结构
        - 索取完整债务明细和任何授信安排条款
    notes: 所有缺口对财务投资判断都很关键。公开来源无法补足 OneTrust 的任何这些指标。 私营公司不透明并不意外，但会限制本章所有财务估计的置信度评级。
