      - number: '5.3'
        title: 集成生态、安全态势与反向因素
        blocks:
          - type: paragraph
            body: >
              OneTrust 的集成生态提供 200 多个预构建连接器，覆盖 ServiceNow、Jira、Microsoft Purview、Sentinel、AWS、Azure、Google
              Cloud、Salesforce、Workday、Snowflake 和 Databricks，并提供完整 REST API 与 SDK 供自定义集成。公司称这是「行业最广、最深的集成组合」；原生云连接器与 AI
              平台钩子（Bedrock、Azure Foundry、Databricks Unity Catalog、Google Vertex）的组合，对运行混合 AI 工作负载的企业确实是技术强项。平台持有 ISO
              27001、ISO 27701、SOC 2 Type II 和 PCI DSS 认证，并支持 50 多个框架下的合规，包括 GDPR、CCPA/CPRA、LGPD、APPI、PIPEDA、HIPAA、SOC 2
              和 PCI DSS。监管覆盖由 DataGuidance 支撑，后者跟踪 300 多个司法辖区的法律变化。平台的同意管理模块是 Google 认证 CMP 金牌合作伙伴，支持 IAB TCF 2.3。

              尽管有这些优势，产品与技术层面的反向态势仍在多处显现。第一，集成复杂度：PeerSpot 上的企业评论者持续把 DSAR 系统集成列为主要痛点，单个集成有时需要数月才能完成。第二，模块瘦身：2024 年 12
              月，OneTrust 将服务 1,000 多家客户的 Convercent 道德与合规业务出售给 EQS Group，说明其 2019–2021 年并购扩张期（DataGuidance、Integris
              Software、Docuvision、Tugboat Logic、Convercent、Planetly）之后开始有意收缩范围。EQS 承诺到 2025 年仅为 Convercent
              提供必要安全更新，所有新开发都转向 EQS 平台，给 Convercent 客户带来迁移负担。第三，AI 治理成熟度缺口：Modulos AG 的竞品分析指出，OneTrust 的 AI Governance
              是更广义信任平台中的一个模块，不是 AI 原生记录系统，这让 AI 专属工作流的集中编排方式出现架构差异。Modulos、Credo AI 等垂直平台使用 AI 原生治理图谱，把框架、控制、证据和 AI
              资产连接成对象；OneTrust 的 AI 治理则与隐私和供应商风险模块共享基础设施。第四，价格不透明和实施负担：平台没有公开定价页；Vendr 来自 325 笔交易的数据把年度合同中位数放在约
              $10,514，中端市场客户每年支付 $40,000-$120,000，企业合同更高。实施通常以数周到数月计算，且经常需要付费专业服务。Software Advice、PeerSpot 和 Capterra
              的用户评论数据持续指出学习曲线陡峭、模块一致性不足，支持质量也随账户规模变化。
