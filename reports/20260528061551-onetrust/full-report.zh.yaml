      - number: '8.4'
        title: 投资建议与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              综合建议：观察。OneTrust 是结构性增长市场中的真正品类龙头，已经证明了资本效率，也具备能让 PE 和战略买方支付溢价的战略资产特征。但以上一轮 $4.5 billion
              标记看，大多数新增资本暂时不应出手，除非先拿到三项确认：（1）NRR 确认高于 110%；（2）披露 EBITDA 或 FCF 利润率，支撑盈利说法；（3）PE
              流程时间表和结构清晰。风险评级为中：监管顺风真实且持久，但财务画像未披露、优先权负担、CEO 交接，以及压缩窗口内对 PE 流动性事件的依赖，使它更适合跟踪，而不是立即行动。

              估值立场：若 2023–2024 年 ARR 增速只有 8%，上一轮 $4.5 billion 标记（8.2x ARR）偏高；但若 PE 收购价高于 $10 billion，且二级市场能以低于 $4
              billion 的估值入场，可能具备吸引力。置信度：中，主要因为关键财务指标未披露。

              任何资本承诺前，优先尽调问题包括：（1）过去四个季度 NRR 和总收入留存率，用于验证增长来自扩张还是依赖新客户获取；（2）按分部拆分的毛利率（软件与专业服务），确认是否具备 SaaS
              级单位经济；（3）EBITDA 或 FCF 利润率区间，独立验证「自由现金流为正」的说法；（4）股权结构表和瀑布分析，量化不同退出价格下优先权负担的影响；（5）PE
              流程更新——机构名称、时间表、指示性估值和交易结构（全额收购与少数股成长投资）；（6）按队列拆分的 ARR 桥表，区分新净增与扩张；（7）客户集中度——是否有单一客户贡献超过 ARR 的 5%。
