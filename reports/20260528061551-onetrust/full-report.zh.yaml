  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 战略、并购与治理风险
        blocks:
          - type: paragraph
            body: >-
              OneTrust 2026 年风险画像的核心，是两个领导层断点同时出现：2026 年 2 月 John Heyman 出任 CEO（接替创始人 Kabir
              Barday，后者转任战略顾问委员会角色），以及正在推进的私募股权收购流程；如果交易完成，新所有权层会带来自己的回报要求。Heyman 曾在 Radiant Systems 和 Snap One 担任
              CEO——这两家公司分别在消费电子和技术服务领域——但他此前没有担任企业隐私软件公司 CEO 的经历，因此存在领域知识连续性风险，也可能重新排序 OneTrust 复杂、监管内容密集的路线图。Barday
              的顾问委员会角色无法复制日常运营中的领域深度；CEO 交接的时间点又与活跃 PE 出售流程、EU AI Act 执法爬坡和 2026 年 3 月裁员重叠，进一步放大执行风险。


              PE 收购流程至少自 2025 年 11 月以来已在推进，涉及 Vista Equity Partners、Thoma Bravo、Blackstone、KKR、Silver Lake 和 Marlin
              Equity Partners；无论结果如何，它都会引入结构性风险。若交易按传闻 $10B+ 价格完成（超过 2023 年 7 月 $4.5B Series D
              估值的两倍），将需要显著财务杠杆；历史上，这往往伴随 R&D 理顺、支持层级缩减，以及价格敏感客户在收购后流失。若交易失败，员工和客户会面对交易拉锯后的不确定性。OneTrust 2024 年 12 月将
              Ethics & Compliance 业务（Convercent）剥离给 EQS Group，是新所有权下进一步组合瘦身的前兆。下方依赖风险图和图表说明，PE 所有权和监管合法性构成两个最关键的结构性依赖。
