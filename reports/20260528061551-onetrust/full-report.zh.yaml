  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >-
              OneTrust 在五个重叠市场类别中竞争——隐私管理软件、GRC 平台、数据治理、第三方风险管理（TPRM）和 AI 治理。没有单一供应商能在五类中都具备同等深度，因此市场由品类领导者、相邻平台和横向 GRC
              套件组成，共同争夺企业钱包份额。直接竞争者是专用隐私与治理平台：BigID（以数据为中心、AI 原生）、Securiti（2025 年 12 月收购完成后成为 Veeam / Securiti）和
              TrustArc（专注合规工作流，拥有近 30 年市场历史）。相邻竞争者来自数据治理（Collibra、Informatica）或横向 GRC（ServiceNow GRC、RSA Archer、IBM
              OpenPages、MetricStream）。点解决方案替代品——Osano、Enzuzo、CookieYes、Cookiebot——以 OneTrust 价格的一小部分覆盖狭窄同意管理需求。


              2026 年有两个结构性变化正在重塑竞争格局。第一，随着企业面对 EU AI Act 义务，AI
              治理已成为强制采购标准，打开一个新战场：纯隐私工具和数据安全态势管理（DSPM）平台在这里同台竞争。第二，整合正在加速：Veeam 以 $1.725B 收购 Securiti AI（2025 年 12
              月完成），将数据韧性基础设施与隐私和 AI 信任能力合并，形成一个融合平台。Veeam 既有数据备份关系覆盖 550,000 个客户，包括 Fortune 500 中 82%，因此可能借此瞄准 OneTrust
              客户。内部自建和维持现状的惯性仍是有意义的替代选择，尤其是在拥有成熟法务团队的大型企业。切换成本在两端都高——从 OneTrust 切到替代方案，以及从手工流程转向
              OneTrust——形成双边粘性动态，影响竞争交易节奏。
            claimRefs:
              - CP004
              - CP005
              - CP007
              - CP024
              - CP034
