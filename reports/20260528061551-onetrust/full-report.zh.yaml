  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分层：OneTrust 服务受监管垂直行业的全球企业，Fortune 500 是锚定客群
        blocks:
          - type: paragraph
            body: >-
              OneTrust 客户覆盖 100 多个国家、14,000 多家组织，Fortune 500 是最显眼的锚定客群——超过半数 Fortune 500
              是其客户。主力购买群体是大型企业，它们承担复杂、跨司法辖区的隐私和合规义务：全球科技公司，处理 DORA 和 CCPA 的金融服务公司，管理 HIPAA 和临床数据同意的医疗与制药公司，需要接近 FedRAMP
              态势的政府机构，以及在欧洲子公司承担 GDPR 义务的跨国制造商。在这些垂直行业中，买方画像从负责平台选择的 Chief Privacy Officer 和 Chief Information Security
              Officer，到把数据主体请求落地的法务与合规团队，再到把 OneTrust API 与企业数据平台集成的 IT 和 DevOps 团队。地域组合偏向美国，美国是单一国家中客户最集中的市场；其次是
              EMEA，GDPR 执法强度让价值主张更有说服力。按原始客户数量看，制造业、商业服务和零售是头部行业之一。中端市场和 SMB 买家也存在，主要通过 CookiePro 同意管理模块进入，但高 ARR
              集中度（1,200+ 个客户 ARR 各自超过 $100,000）确认企业账户才定义收入故事。OneTrust 总客户数从 2021 年的几千家增长到 2024 年底的
