chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司身份、总部与商业模式
        blocks:
          - type: paragraph
            body: >-
              OneTrust, LLC 是一家美国私有软件公司，在 Georgia 注册，总部位于 Georgia 州 Atlanta。公司在 Atlanta Beltline 沿线一座 74,000
              平方英尺园区办公；该园区于 2025 年 5 月启用，整合了 Atlanta 地区 400 多名员工。公司另有 12 个区域办公室，覆盖
              London、Bangalore、Madrid、Paris、Munich、Singapore、Melbourne、Chicago、San Francisco 和 Toronto，合计 13 个办公室。公司网站是
              www.onetrust.com。


              OneTrust 由 Kabir Barday 于 2016 年创立。Barday 在 AirWatch 工作时看到隐私专业人士很难应对新出现的监管义务，由此形成创业想法。公司在 2018 年欧盟 GDPR
              执法日前推出，定位为专用合规工具；随后 CCPA 以及美国各州和全球隐私法律接连出台，需求持续扩大，公司也迅速拓宽范围。


              公司的核心价值主张是一套统一 SaaS 平台，帮助组织治理、管理并证明其符合隐私、数据、安全和 AI 相关监管要求。产品组合覆盖同意与偏好管理、数据映射与分类、第三方和供应商风险管理、AI
              治理，以及监管研究（DataGuidance）。OneTrust 将当前定位称为「AI-Ready Governance Platform」，这是 2026 年 3
              月推出的注册商标。商业模式是经常性订阅，主要面向有多法域合规义务的企业和中端市场组织。公司持有 300
              多项专利，每周在客户安装基础上处理数十亿次同意与偏好交易，显示其平台在企业日常运营中已经具备类似基础设施的深度。
