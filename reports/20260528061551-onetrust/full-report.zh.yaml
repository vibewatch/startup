          - type: callout
            title: 未解决的退出路径放大投资人与领导层不确定性
            body: >-
              OneTrust 2019 年成为独角兽、2021 年达到 $5.3B 峰值估值后，至今仍未上市。2023 年 7 月估值下调融资、2026 年 2 月 CEO 交接，以及 PE 出售讨论（传闻
              $10B+）共同形成复杂的多方谈判环境。截至 2026 年 5 月本报告运行日，尚无交易完成。新 CEO 曾带领 Radiant Systems 和 Snap One 完成 IPO
              与收购，这意味着其任期内很可能出现交易，但时间表仍不确定。
