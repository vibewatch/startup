      - number: '6.4'
        title: 渠道伙伴、国际版图与集中度风险：三层伙伴计划和 12 个办公室的全球网络支撑扩张，但收入集中和 SMB 流失仍未解决
        blocks:
          - type: paragraph
            body: >-
              OneTrust 的市场拓展分销不止直销企业客户，还通过结构化三层伙伴计划——Authorized、Certified、Trusted——服务增值经销商、系统集成商、托管服务提供商、技术伙伴和 ISV。具名 SI
              和咨询伙伴包括 Deloitte、Accenture、Capco 和 Crowe LLP，它们推动复杂、多模块的企业部署。Carahsoft 是指定政府渠道伙伴，使 OneTrust
              能通过美国联邦和州级采购工具进入市场，并在 Department of Homeland Security 和市级公共部门组织等机构落地。国际版图截至 2025 年 1 月覆盖 12+
              个全球办公室——Atlanta（总部）、London、Paris、Munich、Amsterdam、Madrid（2024 年 11 月开设）、Singapore（2025 年 1
              月开设）、Melbourne、Bengaluru、Toronto、Chicago、New York 和 San Francisco。APAC 扩张是明确优先事项，APAC 团队预计 2025 年在
              Singapore、Bengaluru 和 Melbourne 增至 500+ 名员工，服务 Samsung、DHL、Yum! Brands 等客户。从集中度风险看，公开披露的 1,200+ 个 ARR 各自超过
              $100,000 的账户，代表总收入中不成比例的大份额，且来自相对较少的客户数——这种模式在企业级 SaaS
              中常见，但如果一批大客户削减支出或切换供应商，就会产生暴露。单一客户收入集中度数据未公开。渠道伙伴组合，以及来自伙伴与直销的 ARR 占比也未披露。OneTrust
              的模块化架构支撑先落地后扩张：客户可从同意管理或 cookie 合规模块起步，再随着项目成熟扩展到隐私自动化、TPRM、AI 治理、道德合规和 ESG——每个扩张阶段都会进一步加深集成和切换成本。
