  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与范围
        blocks:
          - type: paragraph
            body: >-
              OneTrust 的可服务市场横跨五个互联软件类别，它们共享同一类买方（企业隐私与合规团队）和同一监管驱动因素（数据保护与 AI
              法规不断增加）。最窄边界是纯隐私管理软件，覆盖同意收集、数据主体请求自动化、数据映射、隐私影响评估和事件响应模块。采用这一定义的分析机构（Mordor Intelligence、Coherent Market
              Insights、Fortune Business Insights）将 2026 年市场规模估为 $5.08–6.24B。第二层定义加入同意管理平台（CMP），重点是 cookie
              同意、偏好管理和第三方标签治理；分析机构单独估算该细分市场，2026 年为 $1.05–2.43B，差距很大，反映各方对 CMP 是隐私管理软件子集还是相邻市场存在分歧。第三层是 AI
              治理平台，是增长最快的细分市场，CAGR 超过 44%，但绝对收入最小（2026 年 $492–610M）；需求直接绑定 EU AI Act 于 2026 年 8 月全面适用、ISO 42001 和 NIST
              AI Risk Management Framework。第四层是第三方风险管理（TPRM）软件（2026 年 $8–12B），OneTrust 在其中以供应商尽调和持续监控能力竞争。再放大到最广义的 GRC
              平台市场（2026 年 $65.9B），其中大部分由金融服务审计、SOX 合规和 IT 风险工具驱动，并非 OneTrust 直接覆盖；把这一外延纳入会把 TAM 膨胀到超过 OneTrust
              真正有胜率的区域。用于投资分析的最可防守 TAM，是隐私与信任软件栈（2026 年 $6–10B，包括重叠的同意和 AI 治理支出），而不是完整 GRC
              外壳。现状替代方案包括用电子表格跟踪合规、由律所主导隐私项目、以及定制内部工具——这些代表的是可被替代的机会，而不是软件意义上的竞争威胁。
