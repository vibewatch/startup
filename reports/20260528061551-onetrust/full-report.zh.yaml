  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              OneTrust 的乐观情景建立在三个相互咬合的支柱上。第一，它在 GRC / 隐私软件类别中拥有估计 42.7% 份额（6sense，2026），并服务 75% 的 Fortune
              100；这种网络效应护城河让点状解决方案竞品极难撬动。第二，监管顺风在结构上持久：全球 300+ 个隐私司法辖区要求企业持续投入合规，AI 治理要求又在现有隐私和 GRC
              工作流之上叠加一条额外需求曲线。第三，OneTrust 在扩张到 $550 million ARR 的同时实现正自由现金流——这在后期 SaaS 公司中并不多见——说明 2022 年员工重组达到了预期运营纪律。

              反向逻辑集中在估值不确定性和执行风险。上一轮 $4.5 billion 估值标记（2023 年 7 月）本身就较 2021 年 $5.3 billion 峰值下调 15%，此后未确认新的新股融资。传闻 $10
              billion PE 收购目标较上一轮标记提升 2.2×，而公开 GRC 可比公司（Varonis：4–5x EV/revenue）的交易倍数明显低于这一隐含倍数。收入增长在 2023–2024 年放缓至约 8%
              YoY（ARR 从 $464M 到 $500M），但 2025 年动能改善并接近 $550M。NRR、毛利率和 EBITDA 未公开披露，外部无法独立确认质量。2026 年 2 月 John Heyman 的
              CEO 交接虽然带来经验，但也给本已复杂的 PE 探索流程注入短期领导连续性风险。最后，2024 年 12 月将 Ethics & Compliance 业务剥离给 EQS
              Group，收窄了平台范围，也可能减少了可触达的交叉销售路径。
