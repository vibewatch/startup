          - type: callout
            title: 模块瘦身模式与 AI 治理架构缺口
            body: >
              OneTrust 2024 年 12 月剥离 Convercent，是一个持续风险的最具体信号：公司曾在 2019–2021 年通过 7 笔收购扩张模块，随后又战略性收缩范围。基于 Convercent
              搭建项目的客户需要迁移到 EQS，且 OneTrust 不再开发新功能。另一边，Modulos AG 的竞品分析识别出一个架构缺口：OneTrust 的 AI 治理与隐私和供应商风险模块共享基础设施，而不是在专用
              AI 治理图谱中，把 AI 资产、控制和证据视为相连的一等对象。对主要用例是 AI 治理、而不是隐私加 AI 打包项目的买家来说，这一点最关键。
