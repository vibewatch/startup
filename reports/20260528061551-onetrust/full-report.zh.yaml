  - id: FV004
    title: 投资 KPI——OneTrust 评分卡
    type: kpi
    layout: standard
    summary: 面向 IC 的关键尽调维度评分；1–5 分制（5 = 最强）。
    data:
      items:
        - label: 市场规模与 TAM
          value: 5
          note: 隐私软件 TAM 2026 年为 $7.5B，CAGR 28%+；OneTrust 覆盖 GRC、AI 治理、同意管理
        - label: 竞争护城河
          value: 4
          note: ~43% GRC 份额、75% Fortune 100 渗透率、300+ 项专利；护城河真实存在，但 Microsoft/ServiceNow 构成威胁
        - label: 收入规模与增长
          value: 3
          note: 已确认 $550M ARR；但 2024–25 年 YoY 增长约 10%，低于 SaaS 中位数；需要重新加速
        - label: 单位经济
          value: 2
          note: 声称 FCF 为正，但 NRR、毛利率和 EBITDA 未公开披露；无法确认质量
        - label: 退出准备度
          value: 3
          note: PE 流程活跃且有具名竞购方；未提交 IPO 文件；时间线不确定
        - label: 估值纪律
          value: 2
          note: 上轮标记 8.2x ARR，相对上市 GRC 可比公司偏高；传闻 $10B+ 目标为 18x ARR
        - label: 证据质量
          value: 2
          note: 关键财务指标（NRR、利润率）未披露；ARR 依赖二手新闻报道
        - label: 领导力与执行
          value: 3
          note: 新 CEO Heyman 具备 IPO 路径经验；创始人 Barday 留任董事会；交接风险真实存在
