            body: >
              OneTrust 不公布标价。Vendr 来自 325 笔交易的数据把年度合同价值中位数放在约 $10,514；中端市场客户通常每年支付
              $40,000-$120,000，企业合同更高。仅同意管理模块就约从每个域名 $827/month 起。实施通常以数周到数月计算，往往需要付费专业服务；Software Advice、PeerSpot 和
