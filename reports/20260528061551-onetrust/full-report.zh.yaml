      - number: '1.4'
        title: 规模、关键指标与市场地位
        blocks:
          - type: paragraph
            body: >-
              OneTrust 可公开取得的规模数据并不完整，因为它仍是私营公司；但这些数据指向一家成熟的企业软件公司，在大型企业和受监管行业渗透较深。2024 年 5 月，公司宣布预计年底前年经常性收入（ARR）将超过
              $500M，同时保持正自由现金流，并确认长期目标是扩张到 $1B ARR。公司未公布 2025 或 2026 财年的最新 ARR 数字，因此当前收入可见度仍依赖 2024 年公告。


              截至 2025 年，OneTrust 报告全球客户超过 14,000 家，Fortune 100 中 75% 使用其平台。公司还称 73,000 多个组织以某种形式使用 OneTrust 技术，说明除
              14,000 个直接企业客户外，还存在更广泛的免费层或轻量用户生态。企业客户集中度明显：公司披露，截至 2024 年 5 月，ARR 超过 $100,000 的客户超过 1,200 家，另有一小组客户 ARR
              超过 $1M，显示中端市场和企业席位深度较强。


              二级来源对员工数估计差异很大。LATKA 和 Unify GTM 均认为 2026 年初约为 2,600 人，而 Forbes 列示 5,000 人——很可能反映的是重组前的早期数据点。公司重组行动（2022 年
              6 月裁员 950 人、2022 年 11 月关闭 Planetly 并裁撤 200 人、2026 年 3 月裁员 110 人）已将员工数从 2022 年初估计 3,800+
              的峰值显著压低。公司未公开经审计员工数。


              市场地位方面，IDC 2020 年数据将 OneTrust 的数据隐私合规软件市场份额列为 40.2%，超过最接近竞争对手的三倍。截至 2025 年，OneTrust 仍在 IDC MarketScape
              Worldwide GRC Software Vendor Assessment 中保有领导者称号，首次进入 Fortune Future 50，并连续第七年入选 Forbes Cloud 100。竞争动态包括
              TrustArc（被 Main Capital Partners 收购）、Securiti（被 Veeam / WestCap 以 $1.7B+ 收购）、BigID，以及不断向合规工具扩张的 Microsoft
              和 ServiceNow。
