      - number: '1.5'
        title: 里程碑、负面事件与公司轨迹
        blocks:
          - type: paragraph
            body: >-
              OneTrust 的公司历史可分为四个阶段：激进早期增长期（2016–2021）、回调和重组期（2022–2023）、稳定与战略再定位期（2024–2025），以及从 2026
              年初开始的领导层和所有权过渡期。创立催化剂是 2018 年 GDPR 即将执法，这立即催生企业对隐私合规工具的需求，而当时此类工具尚未大规模存在。


              2019–2021 年的收购策略颇为激进：2019 年 3 月收购 DataGuidance（监管情报），2020 年 6 月收购 Integris Software（数据发现），随后在 2021 年 4
              月同时完成四笔收购——Docuvision（AI 涂黑）、Tugboat Logic（安全合规自动化）、Convercent（伦理与举报）和 Planetly（碳追踪）。这些交易把平台从隐私扩展到更广泛的 GRC
              和 ESG 命题。Planetly 和 Convercent 影响最大：Planetly 在收购仅 18 个月后于 2022 年 11 月关闭，约 200 名员工全部离职；Convercent 最终在 2024
              年底剥离给 EQS Group，Goldman Sachs 担任 OneTrust 顾问。


              2022 年 6 月裁员 950 人，即员工总数 25%，是 2026 年前公司历史上最重大的负面事件。CEO Barday
              称资本市场情绪已从不惜代价增长转向盈利能力；但公告发生在收入和客户需求创纪录的背景下，引发尖锐公开批评。2026 年 3 月裁员约 110 人，被公司表述为面向 AI
              驱动自动化的重组，主要影响客户支持、销售开发和行政职能，工程团队基本保持完整。


              2025 年，OneTrust 大幅转向 AI 治理。公司推出了基于 Microsoft Security Copilot 构建的 Privacy Breach Response Agent，深化 Azure
              OpenAI 集成以自动化 AI 生命周期治理，并发布可将合规评估从数周压缩到数分钟的隐私与风险智能体。2026 年 3 月，公司正式以「AI-Ready Governance
              Platform」重塑品牌。这些产品动作与新任 CEO Heyman 对 AI 治理的定位一致：一代人一次的基础设施机会。
