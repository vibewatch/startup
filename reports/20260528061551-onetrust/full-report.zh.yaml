      - number: '8.5'
        title: 附录
        blocks:
          - type: callout
            title: 下轮估值压力与优先股堆叠
            body: >-
              OneTrust 累计融资 $1.13 billion，覆盖从 $1.3B 到 $5.3B 的多个估值标记。按 2021 年 $5.3B 标记入场的投资人，在上一轮 $4.5B
              标记下已经账面亏损；任何压力情景若低于 $4.5B，还会面临进一步稀释风险。若退出价格低于 $6B，优先股清算堆叠会显著压低普通股剩余价值；任何二级购买前都必须单独建模。
            calloutType: risk
            claimRefs:
              - CV010
              - CV011
              - CV015
          - type: callout
            title: PE 收购可能重定品类定价
            body: >-
              若 PE 收购以 $10 billion 或更高价格完成，它将为品类领先的隐私与 GRC SaaS 设定新的定价标杆，验证主导型、现金流为正的平台可拿到 15–18x ARR
              倍数。BigID、TrustArc、LogicGate 等可比资产将被重新定价，并可能触发合规软件领域新一波 PE 跟进交易。
            calloutType: insight
            claimRefs:
              - CV013
              - CV014
              - CV022
          - type: callout
            title: 继续跟踪；财务未确认前不要行动
            body: >-
              在从审计或管理层确认来源验证 NRR、毛利率和 EBITDA 利润率之前，新增资本不应投向 OneTrust 二级份额或共同投资。战略资产质量很高，但财务未披露、优先权负担、领导层交接和 PE
              退出二元依赖叠加后，风险调整后的入场点尚未确立。
            calloutType: recommendation
            claimRefs:
              - CV024
