            title: FCF 转正和 $1.1B 融资提供短期财务缓冲
            body: >-
              公司称 2024 年已实现正自由现金流，加上累计融资超过 $1.1B 且未公开披露债务义务，说明 OneTrust 短期内没有流动性压力。若 PE 交易以超过 $10B 完成，将较 2023
              年估值下调融资给投资人带来显著加价，也会验证收入质量叙事。
