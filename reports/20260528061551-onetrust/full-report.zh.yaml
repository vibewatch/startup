      - number: '1.3'
        title: 融资历史、估值与投资人基础
        blocks:
          - type: paragraph
            body: >-
              2019 年 7 月至 2023 年 7 月，OneTrust 七个独立融资轮合计融资约 $1.13B。融资历史最突出的特征，是估值快速上行后又回调。2019 年 7 月，由 Insight Partners
              领投的 $200M Series A，使公司在成立三年内以 $1.3B 估值成为独角兽。2020 年 2 月，由 Coatue Management 领投的 $210M Series B，将估值推至
              $2.7B。2020 年 12 月，由 TCV 领投的 $300M Series C 是最大单轮融资，公司估值 $5.1B。2021 年 4 月，由 SoftBank Vision Fund 2 领投的
              $210M Series D 延伸轮将估值推高至 $5.3B，成为峰值。2023 年 3 月，公司又完成一笔较小的 $50M 私募。


              2023 年 7 月融资是转折点：OneTrust 融资 $150M，由美国前副总统 Al Gore 共同创立的 Generation Investment Management 领投，Sands Capital
              共同投资，投后估值 $4.5B。相较 2021 年峰值，这一估值折让约 $800M，符合更广泛的风险投资估值回调；同时距离公司 2022 年 6 月裁员大约 13 个月。CEO Barday
              当时指出，自上一轮以来，公司已将 ARR 翻倍至 $400M，并达到自由现金流里程碑，把这轮融资定义为战略合作，而非困境融资。


              截至 2025 年 11 月，The Information 报道 OneTrust 正就潜在私募股权出售进行讨论，传闻估值超过 $10B；Thoma Bravo、Vista Equity Partners
              和其他大型 PE 机构据报道正在评估机会。截至 2026 年 5 月本报告运行日，尚无交易确认。出售前景同时反映了 OneTrust 粘性 ARR 基础的吸引力，以及当前市场中 IPO
              退出路径的持续不确定性。融资历史中的关键投资人包括 Insight Partners、Coatue Management、TCV、SoftBank Vision Fund 2、Generation
              Investment Management、Sands Capital、Franklin Templeton 和 Speedinvest。
