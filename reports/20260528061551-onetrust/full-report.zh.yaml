      - number: '8.3'
        title: 乐观、基准与悲观情景
        blocks:
          - type: paragraph
            body: >-
              乐观情景假设 OneTrust 在 12–18 个月内以约 $10–12 billion 完成 PE 收购；支撑点是 ARR 增长 20–25% 至 $660–700M、NRR 高于 115%，以及 CEO
              Heyman 讲出并兑现 AI 治理平台叙事。若估值达到 $12 billion，按 $4.5 billion 标记持有优先股的 Series D 投资人可实现 2.7x
              资金倍数，股权结构中的普通股和期权也会明显受益。基准情景假设近期没有流动性事件：PE 流程停滞，或以 $7–8 billion（14–15x ARR）成交；ARR 增长 12–15%，到 2026 年底达到
              $615–630M；公司保持盈利运营，等待 2027–2028 年更有利的 IPO 窗口。若估值 $7.5 billion，相当于较上一轮新股标记回报 1.7x；对持有期较长的后期投资人尚可接受，但低于 2021
              年按 $5.3 billion 估值入场投资人的目标。悲观情景则是监管复杂度见顶、AI 治理市场碎片化，或 PE 流程失败，推动二级估值持平或下行至 $3.5–4.0 billion。在该情景下，2023
              年下轮投资人经优先股瀑布分配后只能打平或小幅亏损，早期普通股投资人面临实质稀释。

              估值最敏感的驱动因素有四个：（1）ARR 增速，每加快 5 个百分点，隐含倍数大约移动 1x ARR；（2）NRR，它决定增长来自自然扩张，还是需要昂贵的新客户获取；（3）PE
              流程结果，本质上是二元事件（2026 年成交或不成交）；（4）宏观利率，因为 $10B+ 价格下的 PE LBO 模型需要可控的偿债成本，而偿债成本对利率水平很敏感。

              能击穿乐观逻辑的下行触发点包括：ARR 增速降至 10% 以下、PE 流程崩掉且无交易落地、监管执法针对 OneTrust 自身数据实践、失去一个或多个 Fortune 100 锚定客户，或被
              ServiceNow、Microsoft Purview、资金充足的垂直新进入者明显替代。Planetly 收购失败，以及 2022 年裁员 25%，说明公司并非不会犯战略误判。
