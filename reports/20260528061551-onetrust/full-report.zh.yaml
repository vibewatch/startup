      - number: '4.2'
        title: 定价、单位经济与成本结构
        blocks:
          - type: paragraph
            body: >-
              OneTrust
              的标价按模块拆分、定制报价，没有公开价格表；所有层级都要直接接洽并拿到定制方案。评测与采购情报来源（Vendr、SmartSuite、Enzuzo、Sprinto、AuditXYZ）口径一致：价格跨度很大，企业核心用例的绝对下限约为
              $10,000/year 单模块，典型企业部署约从 $50,000/year 起，全球多模块全面部署每年为 $150,000 至 $500,000+。Vendr
              基于交易数据的基准显示，全体买家的观测支出中位数约为 $11,500/year，但小型组织把该数值明显拉低；真正贡献实质年经常性收入（ARR）的是企业和大型企业层级，对应 1,200+ 个 $100K+
              客户。多年合同通常能拿到折扣；实施费和专业服务另计。


              单位经济模型无法直接核验：OneTrust 不披露获客成本（CAC）、回本周期、客户终身价值（LTV）、毛利率或净收入留存率（NRR）。同类企业级 SaaS 平台如果 ARR 超过
              $500M、软件嵌入合规流程，通常会报告 70–80% 毛利率。按已披露约 2,650 名员工和估计 $500M ARR 计算，隐含 ARR / FTE 在 $185,000–$195,000
              区间——低于同等规模高效率企业级 SaaS 应达到的 $300,000+ 水平，反映 OneTrust 多轮重组后成本底座仍偏高。SaaS Capital 对同阶段公司的基准显示，R&D 约占 ARR 的
              22%，销售和营销合计约占 ARR 的 20–25%，但 OneTrust 实际数据不可得。


              2022 年重组（950 名员工，约 25% 员工）和 2026 年重组（110 名员工，约 5% 员工）都明确把效率和 AI 驱动自动化列为理由。2026 年裁减预计每年节省约
              $15M。上述动作符合一种公司画像：2019–2021 年增长期过度招人，如今为了 PE 退出或公开上市而压实成本。
