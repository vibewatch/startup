      - number: '5.2'
        title: AI Governance、Data Use Governance 与开发者平台
        blocks:
          - type: paragraph
            body: >
              2026 年 3 月，OneTrust 的 AI Governance 云完成最重要扩展，公司在 AI 智能体、模型和数据集上增加实时监测与护栏执行能力。扩展引入三层相互配合的能力。第一，AI Agent
              Detection & Inventory 在企业环境中持续发现并盘点每个 AI 智能体、模型和数据集，自动捕捉所有权、用途、集成、数据访问、血缘和生命周期变化，形成单一且始终最新的系统记录。第二，AI
              Policy Manager 让治理团队可以从对齐 NIST AI RMF、EU AI Act 和 ISO 42001 的预置政策模板起步，也可以定义自有政策，并对所有已注册模型和智能体持续监测合规。第三，AI
              Guardrail Enforcement 持续检查 GenAI、传统 ML 模型和 AI 智能体，验证护栏配置并实时检测违规——例如在事件发生前阻断或限制个人数据暴露。这些 AI 治理能力的原生集成覆盖
              Amazon Bedrock、Amazon SageMaker、Azure Foundry、Azure OpenAI、Databricks Unity Catalog 和 Google Vertex。

              在 TrustWeek 2025，OneTrust 又发布两个 AI 智能体：Third-Party Risk Agent 可在几分钟而不是几周内自动处理供应商接入、风险标记和响应指引；Privacy Agent
              通过分析项目文档并转成结构化评估回复，自动准备 PIA。与 Microsoft Security Copilot 合作构建的 Privacy Breach Response
              Agent，则自动完成事件评估和泄露通知映射。

              2025 年 5 月推出的 Data Use Governance 方案引入 Data Policy Enforcement：它用 AI 驱动分类覆盖数据库、云 bucket、blob
              存储和文件共享中的结构化与非结构化数据，并用四个元数据维度（业务、监管、同意和数据级标签）给资产打上机器可读标签。政策随后被编译为程序化数据控制，并在查询层执行——治理由人工证明转向自动执行。Privacy
              Automation Discovery 能力会在云基础设施中自动发现和监测个人数据，弥合业务侧与技术侧对数据地图理解的差距。

              开发者平台方面，OneTrust 在 developer.onetrust.com 运营完整开发者门户，提供 API 参考文档、OpenAPI/Swagger 端点定义、快速入门指南和代码示例。SDK 覆盖
              iOS、Android、OTT/CTV、React Native、Unity 和 Cordova 平台，支持同意横幅配置、偏好中心管理和事件监听器集成。OneTrust 还在 GitHub 发布开源 AI
              Guard SDK（onetrust-oss/ai-guard-sdk），为生成式 AI 应用提供基于 Python 的实时 PII 检测和脱敏，包含可通过 pip 安装的包和 API 密钥认证。2026 年 3
              月 AI 治理品牌重新定位后，公司以季度发布节奏交付框架更新、工作流增强和新集成。
