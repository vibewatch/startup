      - number: '4.3'
        title: 资本结构、资金充足性与战略走向
        blocks:
          - type: paragraph
            body: >-
              2019 年以来，OneTrust 已在多轮融资中累计募集超过 $1.1B 新股资本。融资路径从 $200M Series A（2019 年 7 月，Insight Partners，估值 $1.3B）开始，到
              $210M Series B（2020 年 2 月，Coatue 和 Insight，$2.7B）、$300M Series C（2020 年 12 月，TCV，$5.1B）、$210M Series C
              延伸轮（2021 年 4 月，SoftBank Vision Fund 2 和 Franklin Templeton，$5.3B），最近一轮是 $150M Series D（2023 年 7
              月，Generation Investment Management 和 Sands Capital，$4.5B）。Series D 被公开描述为估值下调融资——$4.5B 投后估值较 2021 年 $5.3B
              峰值压缩约 15%，反映更广泛的 SaaS 倍数收缩。2023 年 7 月之后，公司未再募集新股资本。


              公司称 2024 年已实现正自由现金流；按 CEO Kabir Barday 2023 年 3 月公开说法，2022 年重组后公司正朝 FCF 转正推进——据称增速
              40%+，财年末季度创历史最强。这些自报指标未经审计，具体在手现金、月度烧钱速度和现金跑道都未公开。考虑到累计融资超过 $1.1B 且公司称 FCF
              已转正，短期流动性紧张风险看起来较低——但要确认仍需要经审计财务报表。


              战略层面，董事会治理在 2023 年 3 月重组，三名创始人与老董事离任，并计划招聘四名独立董事。当时公司正为 Kabir Barday 所称的「作为私人公司的最后阶段」做准备。到 2025
              年底，OneTrust 已与多家大型 PE 机构讨论潜在出售或多数股权投资——据报道包括 Vista Equity Partners、Thoma Bravo、Blackstone、KKR 和 Silver
              Lake——传闻交易价值超过 $10B。另一路径上，OneTrust 将 Ethics & Compliance 业务单元（原 Convercent）出售给 EQS Group，该交易由 Thoma Bravo
              宣布，符合主要退出前组合瘦身的逻辑。据报道，2026 年二级市场交易价格远高于 2023 年估值下调融资，显示投资者对 PE 交易结果较乐观。IPO 窗口仍受限；PE 交易是目前最主要的预期退出路径。
