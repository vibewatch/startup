            title: 同意管理分析师估计差距超过 2 倍——TAM 叙事存在定义风险
            body: >-
              2026 年同意管理平台市场估计从 $1.13B（Research and Markets）到 $2.43B（Business Research Insights）不等，同一年差距达 2.2
              倍。这不是数据质量失败，而是基本定义分歧：CMP 是独立 cookie 同意工具，还是隐私平台内完整同意编排层。OneTrust 融资材料中任何单一估计的 TAM
