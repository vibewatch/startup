      - 主要威胁
      - 严重性
      - 缓释措施 / 尽调请求
    rows:
      - - 监管情报深度（300+ 法域）
        - 竞争对手授权 DataGuidance，或自建情报网络
        - 低 — 自有资产有规模优势
        - 核查 DataGuidance 独家条款，以及相对 TrustArc 的实时更新节奏
      - - 14,000+ 已部署客户（>50% Fortune 500）
        - BigID 和 Veeam/Securiti 正拿下 Fortune 500 客户；TrustArc 客户数达 28,900
        - 中 — 客户数领先可信，但 BigID 在增长
        - 跟踪竞争对手在 Fortune 500 和金融服务垂直领域的新客户赢单
      - - 多模块配置锁定效应
        - 评价提到“续约定价不透明”，支持质量随合同规模波动
        - 中 — 锁定效应真实存在，但客户满意度风险会打开流失窗口
        - 审计续约定价做法、按账户规模拆分的 NPS，以及按模块队列拆分的流失率
      - - AI 治理模块广度
        - BigID 以数据发现为原生底座的 AI 治理，对安全部门主导的买方可能更可信
        - 高 — Forrester 在 AI 第三方风险评估中给 BigID 最高分
        - 委托独立技术 AI 治理对比；调研企业 AI 买家偏好的方案路径
      - - Veeam/Securiti 渠道汇合
        - Veeam 的 550K 客户（82% Fortune 500）可能把 Securiti 能力交叉销售进 OneTrust 领地
        - 高 — 分销优势真实存在；整合路线图是不可知变量
        - 每季度跟踪 Veeam/Securiti 整合里程碑和上市公告
      - - EU CLOUD Act 数据主权风险
        - EU 监管机构依据 NIS2/DORA 审查美国 GRC 平台，可能形成采购逆风
        - 中 — 监管风向对 EU 场景下美国托管的合规记录不利
        - 评估 OneTrust 的 EU 数据驻留选项；调研 EU 客户对主权风险的感知
      - - 同意管理模块商品化
        - 点式方案（Osano、Enzuzo）以 OneTrust 一小部分价格提供相近的同意管理能力
        - 中 — 对中端市场影响明显；Fortune 500 多法域部署风险较低
        - 确定同意管理模块流失率，以及竞争交易中相对点式方案的赢率
    notes: 严重性评级是基于已审阅证据的定性判断，不是量化市场份额预测。 “高”表示威胁可信、证据充分，并可能在近期产生影响；“中”表示风险真实存在但推进较慢； “低”表示结构性优势短期脆弱性很低。
