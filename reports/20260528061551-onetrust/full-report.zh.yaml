          - type: callout
            title: 投资决策前必须索取完整经审计 GAAP 财务和 NRR
            body: >-
              本章最关键的尽调阻塞点，是经审计 GAAP P&L、NRR、流失率、CAC 和烧钱数据完全缺失。本章所有正面财务主张都来自公司自述或第三方估计；所有反向信号（估值下调融资、裁员、低 ARR /
              FTE）则已得到确认。经审计财务、正式 NRR 披露和烧钱速度确认，是承销前不可谈判的前置条件。
            calloutType: recommendation
            claimRefs:
              - CI032
              - CI027
              - CI035
  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 平台架构与产品云战略
        blocks:
          - type: paragraph
            body: >
              OneTrust 将自身产品描述为构建在共享数据模型上的「AI 就绪治理平台」，可以在不重复录入数据的情况下，完成跨模块数据共享、监管情报和工作流自动化。平台呈现五个功能型产品云。Privacy
              Automation 云覆盖数据发现与分类、隐私影响评估（PIA 和 DPIA）、数据主体请求（DSR/DSAR）履行，以及 DataGuidance 监管情报服务；后者由 40 多名内部研究员和覆盖 300
              个司法辖区的 500 多名律师网络提供当日法律更新。Consent & Preferences 云处理 cookie 同意横幅、统一同意和偏好管理、第一方数据收集以及 DSR 门户交付。Tech Risk &
              Compliance 云覆盖 IT 风险管理、SOX、SOC 2、ISO 27001、HIPAA、PCI DSS 等合规自动化，以及内审工作流。Third-Party Management 套件包括
              Third-Party Risk Exchange（对数千家供应商做预评分分析）、用自定义或开箱即用框架完成全生命周期第三方风险评估，以及 Third-Party Due Diligence。2025 年 5
              月发布的 Data Use Governance 云，把隐私和同意政策转成机器可执行代码，并在数据查询层执行，而不是依赖人工证明。AI Governance 是迭代最快的云，详见第 2 节。

              底层平台在三层基础设施上形成差异化：专门构建的共享数据模型提升跨团队效率；无代码工作流配置引擎不用后端工程即可做跨系统自动化；Unified Trust Center 为利益相关方提供面向外部的网页界面。截至
              2025 年，全球 14,000 多家客户依赖该平台，其中包括超过半数 Fortune 500。Forrester Consulting 2024 年 Total Economic Impact
              研究显示，客户三年 ROI 达 227%，7 个月回本。OneTrust 被 IDC MarketScape 2025 Worldwide GRC Software 报告评为领导者，印证其市场定位。公司持有
              300 多项专利，覆盖隐私、数据保护、合规自动化和 AI 治理技术；在 352 件美国申请中，USPTO 授权率约为 95%。
