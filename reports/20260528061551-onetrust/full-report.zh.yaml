      - number: '7.2'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              OneTrust 的整个商业前提，是帮助企业遵守隐私监管；吊诡之处在于，执法趋严会形成一种依赖风险：客户不合规时，OneTrust 自身技术也会被卷入。CNIL 在 2025 年开出 €486,839,500
              罚款——包括因 cookie 同意违规对 Google 罚款 €325M、对 Shein 罚款 €150M——说明数据保护机构如今要求企业达到技术执行标准，而不只是做政策承诺。EDPB Guidelines
              2/2023（2024 年 10 月定稿）把 ePrivacy Article 5(3) 义务扩展到像素、URL 追踪和指纹识别；这意味着，任何由 OneTrust
              支撑的同意管理平台，如果未在同意前从技术上阻断非必要追踪器，就会给客户造成直接合规责任，也可能给 OneTrust 带来声誉和法律风险。


              这种风险已不再停留在理论层面。2026 年 3 月，加州联邦集体诉讼指称，Ashley Furniture 使用 OneTrust 的 cookie 横幅，在用户点击「全部拒绝」之后仍继续向
              Google、Pinterest 和 Bing 传输浏览数据，涉嫌窃听、侵犯隐私和欺骗性商业行为。虽然 OneTrust 不是直接被告，但案件将其技术列为所谓追踪机制，开创了 CMP
              供应商可能面临间接产品责任的先例。2025 年 2 月，ePrivacy Regulation 正式撤回，使 cookie 合规在 28 个 EU 成员国国内转化法之间继续碎片化，要求 OneTrust
              维护特定司法辖区配置指引，并造成持续产品更新负担。EU AI Act 对高风险 AI 系统的完整执法将于 2026 年 8 月开始，届时会检验 OneTrust 的 AI Governance
              模块能否支持高风险系统运营方必须维护的合格评定、技术文档和持续风险管理日志。Bird & Bird 和 O'Melveny 的法律分析确认，这一执法窗口已经生效且可执行，不会再延迟。
