              截至 2020 年，OneTrust 约占数据隐私合规软件市场 40%（IDC），超过最接近竞争对手的三倍；根据 IDC MarketScape、Forbes Cloud 100 和 Fortune Future
              50 认可，到 2025 年公司仍保持品类领导地位。Fortune 100 中 75% 是其客户，切换成本护城河显著。
