      - - EBITDA 与 FCF 利润率
        - 2024 和 2025 年实际 EBITDA 利润率 % 与自由现金流规模
        - 验证「正自由现金流」说法；决定 PE LBO 模型中的债务承载能力
        - 数据室中的审计财务报表或管理层确认摘要
      - - 股权结构表与分配瀑布分析
        - 完整股权结构表，列明优先股类别、清算倍数、参与权
        - 量化不同退出价格下普通股剩余价值；对老股买家至关重要
        - 法律数据室；重组律师复核
      - - PE 进程状态
        - 已确认竞标方、时间表、指示性估值、交易结构（全资收购 / 少数股权）
        - 直接决定近期流动性；$10B 与 $4.5B 退出下，股权价值相差 3x
        - 投行顾问（Goldman Sachs 已确认担任 Ethics 剥离的财务顾问）
      - - 按队列拆分 ARR 桥
        - 2024–2025 年新客户 ARR、扩张 ARR、收缩 ARR 和流失 ARR
        - 区分高质量「先落地再扩张」和被流失掩盖的收入稳定
        - 管理层数据室；与客户成功岗位员工数交叉核对
      - - 客户集中度
        - 前 10 大客户占 ARR 比例；是否有单一客户 >5% 总 ARR
        - 集中度风险；一个 Fortune 100 锚定客户流失，就可能让单季 ARR 波动 2–5%
        - 数据室；参考客户访谈
    notes: 尽调问题按估值影响排序。第 1–3 项会阻断任何高于 $4.0B 老股底价的资本投入。
    claimRefs:
      - CV025
      - CV026
      - CV027
      - CV028
      - CV029
      - CV030
