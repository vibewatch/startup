          - type: callout
            title: 反复裁员显示结构性成本管理挑战
            body: >-
              自 2022 年 6 月以来，OneTrust 已发生三次独立的员工缩减：2022 年 6 月裁员 950 人（员工总数 25%）、2022 年 11 月 Planetly 关闭约 200 个岗位、2026 年
              3 月裁员约 110 人（约 5%）。这一模式与 2022 年裁员时创纪录收入和客户需求并置，引发大量员工与公众批评，也显示增长投入和盈利要求之间仍有张力。
