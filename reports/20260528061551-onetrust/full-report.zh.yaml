              2023 年估值下调融资（$4.5B 对比 $5.3B 峰值）、2022 年 6 月约 950 人裁员（约 25% 员工）和 2026 年 3 月约 110 人裁员共同说明，OneTrust 在
              2019–2021 年增长期过度招人，目前仍在压缩规模。ARR 在 $500M 水平的同比增长约 7.8%，慢于同等规模一流 SaaS。PE 退出流程拿掉了 IPO 选择权，并引入交易执行风险。
