companyProfile:
  summary: >-
    OneTrust, LLC is an American privately held enterprise software company founded in 2016 by Kabir Barday
    in Atlanta, Georgia. It operates from a 74,000-square-foot Atlanta headquarters and has an estimated
    workforce of roughly 2,600 employees across a 13-office global footprint. OneTrust provides a Trust
    Intelligence Platform spanning five product clouds — Consent & Preferences, Privacy Automation, Data Use
    Governance, AI Governance, and Tech Risk & Third-Party Management — plus DataGuidance regulatory
    intelligence covering 300+ jurisdictions. It raised approximately $1.13 billion across seven rounds
    (2019–2023), including a $300M Series C at a $5.1B valuation in 2021, with a marked-down $150M round at
    a $4.5B valuation in July 2023. In February 2026, founder/CEO Kabir Barday was succeeded by John Heyman;
    a PE acquisition process at $10B+ was reportedly active as of late 2025. OneTrust divested its
    Ethics & Compliance/Convercent business to EQS Group in late 2024.
  foundedDate: '2016-01-01'
  founders:
    - name: Kabir Barday
      role: Founder; CEO 2016–February 2026
      background: >-
        Former associate at PricewaterhouseCoopers and leader in data privacy compliance; founded
        OneTrust as a bootstrapped GDPR consent management tool before GDPR came into force in 2018,
        driving early hypergrowth. Transitioned to a board and strategic advisor role in February 2026
        following the leadership change.
      claimRefs: [CO002, CO003, CO007, CO008]
  foundingLocation: Atlanta, Georgia
  headquarters: Atlanta, Georgia
  productSummary: >-
    OneTrust sells a modular enterprise Trust Intelligence Platform: (1) Consent & Preferences Cloud
    for cookie consent, universal preference centers, and DSAR portals; (2) Privacy Automation Cloud
    for data discovery, classification, PIA/DPIA, and breach response; (3) Data Use Governance Cloud
    for AI-driven policy centralization and query-level enforcement (private preview); (4) AI Governance
    Cloud for AI agent detection, policy management (NIST/EU AI Act/ISO 42001), guardrail enforcement,
    and MCP audit logs; (5) Tech Risk & Third-Party Management Cloud for GRC, TPRM, and the
    Third-Party Risk Exchange (70,000+ pre-scored vendors). DataGuidance provides regulatory
    intelligence across 300+ jurisdictions.
  customerFocus: >-
    Large-cap and regulated enterprises, particularly F500 companies; 75% of the Fortune 100 are
    customers. Heaviest concentration in financial services, healthcare, technology, and retail.
    Primarily targets Chief Privacy Officers, Chief Information Security Officers, Chief Compliance
    Officers, and Legal/GRC leads.
  businessModel: >-
    Annual recurring revenue (ARR) from module-based SaaS licensing priced per module, customer
    headcount, or data volume. Typical enterprise contract spans multiple product clouds. DataGuidance
    and professional services add recurring and project-based revenue streams. No usage-based pricing
    disclosed.
  stage: Late-stage private unicorn
  fundingStatus: >-
    Total raised approximately $1.13 billion. Key rounds: $200M Series A (July 2019), $210M Series B
    (October 2020, $2.7B valuation), $300M Series C (November 2021, $5.1B valuation), $150M bridge
    (July 2023, $4.5B valuation, down-round from 2021 peak), plus additional funding rounds totaling
    ~$270M. Investors include General Atlantic, Insight Partners, TCV, and Salesforce Ventures.
    Active PE acquisition process reported at $10B+ as of November 2025.
  disclosureProfile: private-undisclosed
  claimRefs: [CO002, CO007, CO019, CO020, CO023, CO025, CO026, CO027, CO035, CO042, CE001, CE003]
