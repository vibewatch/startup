evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue
    missingEvidence: >-
      OneTrust's audited or management-reported ARR for fiscal year 2025 or 2026 has not been publicly disclosed. The
      last disclosed figure is a May 2024 company projection of >$500M ARR by year-end 2024.
    whyItMatters: >-
      Without a current ARR figure, revenue trajectory and growth rate cannot be independently assessed, creating
      uncertainty for valuation and PE sale analysis.
    diligencePath: >-
      Request audited financial statements or management accounts directly from OneTrust; alternatively, triangulate
      from customer count growth, average contract value disclosures, and press releases.
    relatedQuestionRefs:
      - QO007
      - QO018
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: headcount
    missingEvidence: >-
      No audited employee headcount is publicly available. Secondary estimates range from ~2,600 (LATKA, Unify GTM) to
      5,000 (Forbes, likely stale), with the true post-March-2026-layoff count unknown.
    whyItMatters: >-
      Headcount matters for burn rate estimation, team capacity analysis, and benchmarking productivity per employee
      against comparables.
    diligencePath: >-
      Request a current organizational chart and headcount by function from OneTrust management; cross-check against
      LinkedIn headcount data.
    relatedQuestionRefs:
      - QO009
      - QO021
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: private-equity
    missingEvidence: >-
      As of May 2026, no definitive announcement has been made regarding the reported private equity sale of OneTrust.
      The rumored $10B+ valuation and buyer identity remain unconfirmed.
    whyItMatters: >-
      An ownership change to Thoma Bravo, Vista Equity Partners, or a similar PE firm would materially alter the
      strategic trajectory, customer guarantees, employee retention, and product investment.
    diligencePath: >-
      Monitor The Information, Bloomberg, and WSJ for deal announcements; obtain direct confirmation from OneTrust
      investor relations regarding transaction status.
    relatedQuestionRefs:
      - QO016
    relatedTableRefs:
