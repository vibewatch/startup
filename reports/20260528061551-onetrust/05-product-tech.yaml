  - id: ai-governance-data-use-governance-and-developer-platform
    title: AI Governance, Data Use Governance, and Developer Platform
    body: >
      OneTrust's AI Governance cloud underwent its most significant expansion in March 2026, when the
      company added real-time monitoring and guardrail enforcement capabilities across AI agents, models,
      and datasets. The expansion introduced three coordinated capability layers. First, AI Agent Detection
      & Inventory continuously discovers and inventories every AI agent, model, and dataset across an
      enterprise environment, automatically capturing ownership, purpose, integrations, data access,
      lineage, and lifecycle changes to create a single always-current system of record. Second, the AI
      Policy Manager allows governance teams to start with prebuilt, standards-aligned policy templates
      for NIST AI RMF, EU AI Act, and ISO 42001, or define custom policies, then monitor compliance
      continuously across all registered models and agents. Third, AI Guardrail Enforcement continuously
      inspects GenAI, traditional ML models, and AI agents to validate guardrail configurations and detect
      violations in real time — for example, blocking or limiting personal data exposure before incidents
      occur. Native integrations for these AI governance capabilities span Amazon Bedrock, Amazon
      SageMaker, Azure Foundry, Azure OpenAI, Databricks Unity Catalog, and Google Vertex.

      At TrustWeek 2025, OneTrust announced two additional AI agents: the Third-Party Risk Agent, which
      automates vendor intake, risk flagging, and response guidance in minutes instead of weeks; and the
      Privacy Agent, which automates PIA preparation by analyzing project documents and converting them
      into structured assessment responses. A Privacy Breach Response Agent, built in partnership with
      Microsoft Security Copilot, automates incident evaluation and breach notification mapping.

      The Data Use Governance solution launched in May 2025 introduces Data Policy Enforcement, which
      uses AI-driven classification of structured and unstructured data across databases, cloud buckets,
      blob storage, and file shares, tagging assets with four metadata dimensions (business, regulatory,
      consent, and data-level labels) stored as machine-readable labels. Policies are then compiled into
      programmatic data controls enforced at the query level — shifting governance from manual attestation
      to automated enforcement. The Privacy Automation Discovery capability automatically discovers and
      monitors personal data across cloud infrastructure to close the gap between business and technical
      data-map understanding.

      On the developer platform side, OneTrust operates a full developer portal at developer.onetrust.com
      with API reference documentation, OpenAPI/Swagger endpoint definitions, quickstart guides, and
      code recipes. SDKs are available for iOS, Android, OTT/CTV, React Native, Unity, and Cordova
      platforms, covering consent banner configuration, preference center management, and event-listener
      integration. OneTrust also published an open-source AI Guard SDK on GitHub (onetrust-oss/ai-guard-sdk)
      providing Python-based real-time PII detection and redaction for generative AI applications, with
      pip-installable packages and API-key authentication. The March 2026 AI governance brand
      repositioning was accompanied by quarterly seasonal releases delivering framework updates, workflow
      enhancements, and new integrations.
