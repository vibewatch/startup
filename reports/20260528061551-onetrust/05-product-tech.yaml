  - id: TE003
    title: Technology and Operating Architecture
    columns:
      - Layer / Component
      - Role
      - Key Dependency
      - Risk
    rows:
      - - Shared Data Model
        - Cross-module data sharing; eliminates re-entry; enables holistic risk views
        - Platform-wide; requires correct module configuration to activate cross-module benefits
        - Tight coupling means module failures or data-model changes can propagate across clouds
      - - DataGuidance Regulatory Intelligence
        - Real-time law tracking across 300+ jurisdictions; feeds Privacy Automation and compliance workflows
        - 40+ in-house researchers; network of 500+ lawyers; acquired by OneTrust in 2019
        - Jurisdiction coverage depth varies; some regions underrepresented
      - - No-Code Workflow Engine
        - Configuration of cross-system automations without backend engineers
        - Integration connectors; REST API; pre-built application catalog (200+ integrations)
        - Complex enterprise environments still require significant technical effort despite no-code tooling
      - - AI Governance Control Plane
        - Real-time AI agent/model discovery, policy enforcement, guardrail validation
        - Amazon Bedrock, SageMaker, Azure Foundry, Azure OpenAI, Databricks Unity Catalog, Google Vertex
        - Limited to platforms with native OneTrust integrations; unsupported AI stacks require custom work
      - - REST API and SDK Layer
        - Programmatic integration; consent collection on mobile/OTT/CTV; AI Guard SDK for GenAI PII redaction
        - OAuth2 / API key auth; open-source Python SDK (onetrust-oss/ai-guard-sdk on GitHub)
        - SDK maturity varies by platform; React Native/Unity support less mature than iOS/Android
      - - Unified Trust Center
        - Outward-facing web interface; stakeholder data control; dynamic display of trust posture
        - OneTrust instance; real-time sync with module data
        - Requires ongoing configuration to keep current; not a standalone product
    notes: "Architecture layers derived from official OneTrust platform documentation, developer portal, and press releases. Dependency data from company-claimed integrations; risk assessments are analyst inferences."
    claimRefs:
      - CE003
      - CE007
      - CE017
      - CE018
      - CE019
