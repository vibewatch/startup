  - id: TE002
    title: Key Customer Workflow and Use-Case Coverage
    columns:
      - User Job
      - Current Workflow Without OneTrust
      - OneTrust Solution
      - Measurable Benefit Cited
      - Known Limitation
    rows:
      - - GDPR/CCPA consumer consent capture
        - Manual cookie banner configuration; separate vendor per regulation
        - Consent & Preferences cloud with geolocation triggers; IAB TCF 2.3 support
        - 250+ language support; automated regulatory switching per jurisdiction
        - "$827/month minimum for single-domain CMP; cost escalates with domain count"
      - - Privacy Impact Assessment (PIA/DPIA)
        - Hours gathering documents, interviewing stakeholders, filling questionnaires
        - Privacy Agent automates document analysis; converts to structured assessment in minutes
        - Scalable knowledge of past assessments for consistency and speed
        - Agent accuracy not independently benchmarked; human review still required
      - - Third-party vendor risk assessment
        - Manual intake, weeks-long project management; siloed risk scoring
        - Third-Party Risk Agent + Risk Exchange pre-scores 70,000+ vendors
        - Risk flagging in minutes vs months for new vendor onboarding
        - Complex integrations (e.g., DSAR systems) can still take months to connect
      - - AI project governance under EU AI Act
        - Separate risk intake tools; manual classification vs Act risk tiers
        - Centralized AI intake, automated risk tiering aligned to EU AI Act and NIST RMF
        - "Kuehne + Nagel: enterprise-wide AI governance across procurement/development/production"
        - OneTrust AI governance is module-based, not AI-native system of record
      - - Data policy enforcement for AI pipelines
        - Manual data approval cycles; periodic audits; re-keying policy rules per dataset
        - Data Use Governance with Data Policy Enforcement at query level in data platforms
        - Continuous compliance without slowing AI and analytics workflows
        - Private preview; production-scale customer references not yet public
    notes: "Benefits sourced from OneTrust company-claimed case studies and press releases; limitations sourced from user reviews and competitor analysis as of May 2026."
    claimRefs:
