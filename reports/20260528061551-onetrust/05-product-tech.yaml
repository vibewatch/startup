  evidenceGaps:
    - type: missing-source
      severity: material
      topic: competitive-ai-governance
      missingEvidence: "Independent third-party analyst benchmark directly comparing OneTrust AI Governance functional maturity, accuracy of guardrail enforcement, and system-of-record completeness against pure-play AI governance platforms (Modulos, Credo AI, Fairly AI)."
      whyItMatters: "Without an independent benchmark, the architectural gap identified by Modulos cannot be quantified; buyers choosing between OneTrust as a bundled platform and a dedicated AI governance tool lack objective comparison data."
      diligencePath: "Commission or locate a Gartner Peer Insights or Forrester Wave report specifically covering AI governance platforms; request independent red-team assessment of guardrail enforcement effectiveness."
      relatedQuestionRefs:
        - QE012
        - QE024

    - type: private-evidence-only
      severity: material
      topic: pricing
      missingEvidence: "OneTrust's full contract pricing structure, renewal escalators, multi-module discount schedules, and professional services cost ranges are not publicly disclosed. Vendr median data is based on transaction aggregates, not published terms."
      whyItMatters: "Without published pricing, buyers cannot model TCO across modules; renewal escalators and professional services dependency are primary drivers of unbudgeted cost overruns reported by reviewers."
      diligencePath: "Obtain redacted enterprise contract samples via reference calls; request Vendr detailed percentile data for comparable-sized companies; ask OneTrust directly for renewal cap commitments in writing."
      relatedQuestionRefs:
        - QE023

    - type: missing-source
      severity: minor
      topic: data-use-governance
      missingEvidence: "No public production-scale customer reference for Data Policy Enforcement, which remains in private preview as of its May 2025 announcement and has not disclosed GA timeline."
      whyItMatters: "The enforcement capability is the most technically differentiated element of the Data Use Governance cloud; without production references, buyers cannot validate that query-level enforcement performs at AI pipeline speed and scale."
      diligencePath: "Request reference customers who have progressed beyond private preview; ask OneTrust for a timeline to GA and published performance benchmarks for Data Policy Enforcement in Snowflake and Databricks environments."

