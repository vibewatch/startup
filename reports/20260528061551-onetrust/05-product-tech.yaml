callouts:
  - calloutType: strength
    title: 300-Plus Patents and Continuous AI Governance Control Plane
    body: >
      OneTrust's patent portfolio of 300-plus active patents with a ~95% USPTO grant rate represents a
      meaningful IP moat in privacy automation and data governance. The March 2026 real-time AI
      governance expansion — covering AI agent detection, AI policy management, and guardrail enforcement
      integrated with Bedrock, Azure, and Databricks — positions the company as one of the few platforms
      offering a continuous (as opposed to point-in-time) AI governance control plane. Blackbaud and
      Kuehne + Nagel are named reference customers for AI governance at scale.
    claimRefs:
      - CE006
      - CE007
      - CE010
      - CE014

  - calloutType: risk
    title: Module Rationalization Pattern and AI Governance Architecture Gap
    body: >
      OneTrust's December 2024 Convercent divestiture is the most concrete signal of a persistent
      risk: a history of acquisitive module expansion (7 acquisitions in 2019-2021) followed by
      strategic scope reduction. Customers who built programs on Convercent face EQS migration with
      no new feature development from OneTrust. Separately, competitor analysis from Modulos AG
      identifies an architectural gap: OneTrust's AI governance shares infrastructure with its
      privacy and vendor risk modules rather than treating AI assets, controls, and evidence as
      connected first-class objects in a dedicated AI governance graph. This matters most for buyers
      whose primary use case is AI governance rather than a bundled privacy-plus-AI program.
    claimRefs:
      - CE026
      - CE027
      - CE030

  - calloutType: risk
    title: Pricing Opacity and Implementation Burden Limit Mid-Market Fit
    body: >
      OneTrust publishes no list pricing. Vendr data from 325 transactions places median annual
      contract value at approximately $10,514, with mid-market customers typically paying
      $40,000-$120,000 per year and enterprise contracts higher. The consent management module alone
      starts at approximately $827/month per domain. Implementation is typically measured in weeks to
      months, often requiring paid professional services, and user review data from Software Advice,
      PeerSpot, and Capterra consistently reports steep learning curves and inconsistent support
      quality for smaller accounts. These dynamics effectively limit the addressable market to
      mid-to-large enterprises with dedicated GRC teams.
    claimRefs:
      - CE025
      - CE029
      - CE037

