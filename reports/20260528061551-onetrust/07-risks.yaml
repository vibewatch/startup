  - id: operational-cybersecurity-people-risks
    title: Operational, Cybersecurity, and People Risks
    body: >-
      OneTrust's operational risk profile is shaped by two layoff cycles and a security posture
      that, while above average, carries structural exposure from the sensitive nature of its data.
      The March 2026 reduction of 110 employees (~5% of workforce) primarily affected customer
      support, sales development, and administrative functions—the functions most directly
      responsible for customer success and onboarding outcomes. Combined with the June 2022
      reduction of approximately 950 employees (~25%), these two cycles represent persistent
      cost-structure volatility and create institutional memory loss in customer-facing roles at a
      time when complex AI governance implementations require deep consultant engagement. Employee
      sentiment is poor: Blind reviews give OneTrust a 2.5/5 culture score and a 2.2/5 management
      score, with reviewers describing recurring layoffs, micro-management, and poor strategic
      communication under new leadership.


      From a cybersecurity standpoint, UpGuard's continuous monitoring identified minor Content
      Security Policy configuration weaknesses in OneTrust's public web presence as of May 28,
      2026. No major confirmed data breach has been publicly disclosed. However, OneTrust's platform
      stores and processes privacy mapping records, vendor risk assessments, consent logs, and
      compliance configurations for thousands of large enterprises across 100+ countries—making it a
      singularly high-value target for adversarial actors. A successful breach of OneTrust's core
      platform would expose compliance infrastructure of potentially hundreds of Fortune 500
      companies simultaneously, creating a systemic risk event rather than a single-company
      incident. Third-party vendor risk for cloud sub-processors remains an undisclosed gap, as
      OneTrust does not publish its sub-processor list with associated security audit results.
