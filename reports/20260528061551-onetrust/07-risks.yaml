callouts:
  - calloutType: risk
    title: PE Acquisition Is a Thesis-Altering Event
    body: >-
      A PE acquisition at $10B+ with 4x+ leverage would materially alter OneTrust's R&D investment
      profile and support quality. Historical PE ownership of mission-critical SaaS companies has
      produced both excellent stewardship and aggressive rationalization depending on ARR growth
      trajectory. Investors must treat the PE deal close as a thesis-altering event requiring
      re-underwriting, not a routine liquidity event.
    claimRefs:
      - CR006
      - CR007
      - CR008
