      cadence and AI governance roadmap specificity, (2) enterprise customer retention announcements
      or departures, and (3) organizational changes in engineering and customer success leadership.
      A CEO with no prior privacy-software domain experience leading a company through an active PE
      sale process, EU AI Act enforcement ramp, and layoff recovery simultaneously represents a
      concentration of execution risk that warrants close monitoring.
