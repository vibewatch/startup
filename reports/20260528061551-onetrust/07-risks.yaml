chapter:
  number: 7
  title: Risks
  summary: >-
    OneTrust faces a convergence of high-severity risks in 2026: an unresolved PE acquisition
    process that could alter product strategy and customer support; a CEO transition from founder
    Kabir Barday to external hire John Heyman carrying cultural and strategic continuity risk; and
    intensifying EU regulatory enforcement of cookie consent—exemplified by €486M in CNIL fines in
    2025—that implicates OneTrust's CMP technology in a March 2026 class action. The EU AI Act
    high-risk enforcement beginning August 2026 tests product maturity gaps, while AI-native
    competitors and pricing complexity accelerate churn among non-enterprise buyers. Operational
    stability is weakened by two layoff cycles (2022 and 2026) and Blind culture scores of 2.5/5.

sections:
  - id: strategic-ma-governance-risks
    title: Strategic, M&A, and Governance Risks
    body: >-
      OneTrust's 2026 risk profile is anchored by two simultaneous leadership discontinuities: the
      February 2026 appointment of John Heyman as CEO (replacing founder Kabir Barday, who moves to
      a strategic advisory board role) and an active private equity acquisition process that, if
      consummated, would impose a new ownership layer with its own return requirements. Heyman brings
      prior CEO experience from Radiant Systems and Snap One—consumer electronics and technology
      service businesses—but has no prior tenure as CEO of an enterprise privacy-software company,
      creating domain-knowledge continuity risk and potential re-prioritization of OneTrust's complex,
      regulatory-content-heavy roadmap. Barday's advisory board role does not replicate daily
      operational domain depth, and the timing of the CEO handover—coinciding with an active PE sale
      process, the EU AI Act enforcement ramp, and the March 2026 layoff—compounds execution risk.


      The PE acquisition process, active since at least November 2025 and involving Vista Equity
      Partners, Thoma Bravo, Blackstone, KKR, Silver Lake, and Marlin Equity Partners, introduces
      structural risk regardless of outcome. A closed deal at the rumored $10B+ price (more than
      double the $4.5B July 2023 Series D valuation) would require significant financial leverage,
      historically associated with R&D rationalization, support tier reductions, and post-acquisition
      churn among price-sensitive customers. A failed deal would create buyer-fatigue uncertainty for
      employees and customers. OneTrust's December 2024 divestiture of its Ethics & Compliance
      business (Convercent) to EQS Group is a harbinger of further portfolio rationalization under
      new ownership. The dependency risk map and figure below illustrate how PE ownership and
      regulatory legitimacy constitute the two most structurally critical dependencies.
