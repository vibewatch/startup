  - id: TP004
    title: Moat Durability and Competitive Risk Register
    columns:
      - Moat Claim
      - Primary Threat
      - Severity
      - Mitigation / Diligence Ask
    rows:
      - - Regulatory intelligence depth (300+ jurisdictions)
        - Competitors licensing DataGuidance or building own intelligence networks
        - Low – proprietary asset with scale advantage
        - Verify DataGuidance exclusivity terms and real-time update cadence vs. TrustArc
      - - 14,000+ customer installed base (>50% Fortune 500)
        - BigID and Veeam/Securiti adding Fortune 500 logos; TrustArc at 28,900 customers
        - Medium – logo count leadership credible but BigID growing
        - Track new logo wins by competitor in Fortune 500 and financial services verticals
      - - Multi-module configuration lock-in
        - Reviews cite "opaque renewal pricing" and support quality varies by contract size
        - Medium – lock-in is real but customer satisfaction risks create churn windows
        - Audit renewal pricing practices, NPS by account size, and churn by module cohort
      - - AI governance module breadth
        - BigID's data-discovery-native AI governance may be more credible for security-led buyers
        - High – Forrester gave BigID highest score in AI Third-Party Risk Assessment
        - Commission independent technical AI governance comparison; survey enterprise AI buyers on approach preference
      - - Veeam/Securiti distribution convergence
        - Veeam's 550K customers (82% Fortune 500) could cross-sell Securiti capabilities into OneTrust territory
        - High – distribution advantage is real; integration roadmap is the unknowable variable
        - Monitor Veeam/Securiti integration milestones and go-to-market announcements quarterly
      - - EU CLOUD Act data sovereignty risk
        - EU regulatory scrutiny of US-based GRC platforms under NIS2/DORA may create procurement headwinds
        - Medium – regulatory direction trending adverse for US-hosted compliance records in EU
        - Assess OneTrust EU data residency options; survey EU-based customers on sovereignty risk perception
      - - Consent module commoditization
        - Point solutions (Osano, Enzuzo) offer comparable consent at a fraction of OneTrust's price
        - Medium – meaningful for mid-market; lower risk for Fortune 500 multi-jurisdiction deployments
        - Determine consent module churn rate and win rate against point solutions in competitive deals
    notes: >-
      Severity ratings are qualitative assessments based on evidence reviewed; they are not quantified market-share
      projections. "High" denotes a credible, well-evidenced threat with near-term impact potential; "Medium"
      denotes a real but slower-moving risk; "Low" denotes a structural advantage with minimal short-term vulnerability.
