callouts:
  - calloutType: strength
    title: Regulatory intelligence depth and installed base are uniquely durable moats
    body: >-
      OneTrust's DataGuidance regulatory intelligence—covering 300+ jurisdictions and 50+ frameworks with
      real-time updates—is not easily replicated and directly addresses the multinational compliance need that
      drives enterprise buying decisions. Combined with a 14,000+ customer installed base (over half of Fortune
      500) and 200+ pre-built integrations, these form a reinforcing flywheel that BigID, TrustArc, or even
      the Veeam/Securiti platform cannot replicate overnight.
    claimRefs:
      - CP024
      - CP025
      - CP026
      - CP028

  - calloutType: risk
    title: AI governance displacement and Veeam/Securiti convergence are the two highest-severity threats
    body: >-
      BigID's data-discovery-native AI governance suite received the highest Forrester score in AI Third-Party
      Risk Assessment, and its shadow AI detection and Vendor AI Assessment tool directly challenge OneTrust's
      policy-workflow-first approach for security-led buyers. Simultaneously, Veeam's 550,000-customer install
      base—acquired alongside Securiti's unified privacy-DSPM-AI trust platform—creates a distribution
      advantage that could bring competitive pressure through non-traditional (data backup) channels.
    claimRefs:
      - CP030
      - CP031
      - CP007

  - calloutType: insight
    title: Collibra and OneTrust are integration partners, not pure competitors
    body: >-
      Unlike the adversarial framing common in competitor analysis, Collibra and OneTrust have formalized a
      technical integration where OneTrust discovery and classification output enriches the Collibra enterprise
      data catalog. This means large enterprises often deploy both platforms rather than choosing between them,
      reducing head-to-head displacement risk in the data governance segment. For diligence purposes,
      Collibra is best treated as a complement rather than a rival in Global 2000 accounts.
    claimRefs:
      - CP017
      - CP036

