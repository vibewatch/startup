  - id: competitor-profiles
    title: Competitor Profiles and Key Differentiation
    body: >-
      BigID is OneTrust's most credible direct rival in 2026. Founded around deep data discovery and
      classification, BigID evolved into a modular data security platform covering DSPM, privacy, AI governance,
      and data lifecycle management. As of February 2026, BigID employs approximately 682–700 people with $308
      million total funding raised across 10 rounds (most recent: a $61.4 million Series D in February 2024)
      and a valuation estimated between $1 billion and $1.25 billion. BigID was named a Leader in the Forrester
      Wave Q4 2025 for Privacy Management Software, receiving highest possible scores in 19 criteria including
      personal data discovery, AI risk assessment, and breadth of software. In January 2026, Gartner named
      BigID a Challenger in the Magic Quadrant for Data and Analytics Governance Platforms, distinguishing its
      footprint from OneTrust's TPRM positioning. BigID's stated edge over OneTrust is superior data discovery
      accuracy, ML/NLP-driven classification in 100+ languages, and an AI governance suite including shadow AI
      detection, AI model autodiscovery, and an industry-first Vendor AI Assessment tool. Its standalone consent
      management product (BigID CMP Express, launched November 2025 with self-service pricing) signals direct
      competition with OneTrust's consent module.


      Securiti AI, founded in 2019, raised a $75 million Series C in 2022 before Veeam announced its $1.725
      billion acquisition in October 2025, closed in December 2025. Securiti's 600 employees joined Veeam,
      and CEO Rehan Jalil became Veeam's President of Security and AI. The combined entity—marketed as the
      "industry's first Trusted Data Platform"—merges Securiti's DSPM, privacy automation, zero-trust controls,
      and AI trust capabilities with Veeam's data resilience infrastructure serving 550,000 customers including
      82% of the Fortune 500. This positions Veeam/Securiti as a potential converged alternative to OneTrust for
      security-privacy-governance buyers, with a distribution advantage from Veeam's pre-existing enterprise
      install base.


      TrustArc, with nearly 30 years of privacy management experience through its TRUSTe heritage, claims over
      28,900 verified customers globally including Amazon, Apple, IBM, Cargill, and Marriott. Its Arc Intelligence
      platform offers 176+ integrations, deep regulatory intelligence, and end-to-end privacy orchestration. A
      2026 TrustArc-commissioned survey of 1,800+ professionals found organizations with mature privacy programs
      scored 70–76% on the Global Privacy Index, roughly 20 points above average, validating program-management
      value. TrustArc's customer count exceeds OneTrust's stated 14,000+ claim, though OneTrust skews toward
      larger enterprise accounts with higher contract values. Collibra and Informatica approach from data
      governance: Collibra holds approximately 9.2% mindshare among enterprise governance practitioners and is
      the preferred platform for Global 2000 financial services, healthcare, and insurance organizations.
      Collibra and OneTrust have formalized an integration partnership rather than pure competition—OneTrust's
      data discovery output enriches the Collibra enterprise catalog. ServiceNow GRC and RSA Archer represent
      horizontal enterprise risk. ServiceNow GRC is preferred by large ServiceNow shops extending existing ITSM
      and SecOps investments, while RSA Archer (4.2 stars, 170 Gartner Peer Insights reviews as of 2026) is
      favored for highly configurable, complex multi-domain risk programs, though its dated interface and high
      maintenance cost create vulnerability to OneTrust in new deployments.
