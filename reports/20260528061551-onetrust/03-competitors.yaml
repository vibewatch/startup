    topic: OneTrust-revenue
    missingEvidence: >-
      OneTrust ARR, gross revenue, net revenue retention, and gross margin are not publicly disclosed.
      No public filing or credible third-party estimate is available for the current run date.
    whyItMatters: >-
      Financial scale and growth rate directly affect valuation comparison with BigID and the Veeam/Securiti
      platform; without revenue data the competitive cost structure cannot be fully assessed.
    diligencePath: >-
      Request audited financials, ARR by module, NRR cohorts, and gross margin by product line in diligence.
    relatedQuestionRefs: []
  - type: private-evidence-only
    severity: material
    topic: BigID-revenue-and-customers
    missingEvidence: >-
      BigID's ARR, named customer count, and gross margin are not publicly disclosed; only headcount and
      total funding are available from public sources.
    whyItMatters: >-
      Without revenue comparatives it is not possible to assess whether BigID is scaling faster than OneTrust
      or whether its data-discovery advantage is translating into durable enterprise revenue.
    diligencePath: >-
      Obtain BigID's investor presentation or audited financials; supplement with reference checks at
      Fortune 500 accounts using both platforms.
    relatedQuestionRefs:
      - QP003
  - type: missing-source
    severity: material
    topic: data-sovereignty-risk
    missingEvidence: >-
      No specific enforcement actions against OneTrust or other US-based GRC platforms under NIS2 or DORA
      have been identified. The CLOUD Act risk is structural and analytically identified, but no documented
      EU supervisory authority investigation or customer procurement decision citing this risk was found.
    whyItMatters: >-
      The severity of EU data sovereignty risk for OneTrust's European revenue depends on whether regulators
      and procurement teams treat it as a compliance barrier or merely an acceptable risk.
    diligencePath: >-
      Survey OneTrust's top 20 EU-headquartered customers on CLOUD Act risk perception; review any Data
      Protection Authority correspondence; assess whether OneTrust offers EU-sovereign data residency.
    relatedQuestionRefs:
      - QP018
