  - id: section-unit-economics
    title: "Pricing, unit economics, and cost structure"
    body: >-
      OneTrust's list pricing is modular and custom-quoted with no public price card; the company requires
      direct engagement and a custom proposal for all tiers. Review and procurement intelligence sources
      (Vendr, SmartSuite, Enzuzo, Sprinto, AuditXYZ) consistently report a wide range: the absolute minimum
      for core enterprise use is approximately $10,000/year for a single module, a typical enterprise
      deployment starts around $50,000/year, and comprehensive multi-module global deployments range from
      $150,000 to $500,000+ annually. Vendr's transaction-data-backed benchmark reports a median observed
      spend of approximately $11,500/year across all buyers, which is skewed heavily downward by smaller
      organizations; the enterprise and large-enterprise tier drives the material ARR per the 1,200+ customers
      at $100K+. Multi-year contracts typically attract discounts; implementation and professional services
      are additive.


      Unit economics cannot be directly verified: OneTrust does not disclose customer acquisition cost,
      payback period, LTV, gross margin, or net revenue retention. Industry-comparable enterprise SaaS
      platforms at $500M+ ARR running embedded compliance software generally report gross margins of
      70–80%. Based on disclosed headcount of approximately 2,650 employees and estimated ARR of $500M,
      implied ARR per FTE is in the $185,000–$195,000 range — below the $300,000+ figure expected of
      highly efficient enterprise SaaS at similar scale, reflecting OneTrust's still-elevated cost base
      following repeated restructuring. SaaS Capital benchmarks for similarly staged companies suggest
      R&D at approximately 22% of ARR and combined sales and marketing at 20–25% of ARR, though
      OneTrust's actuals are unavailable.


      The 2022 restructuring (950 employees, ~25% of workforce) and the 2026 restructuring (110 employees,
      ~5% of workforce) both explicitly cited efficiency and AI-driven automation as rationales. The
      2026 reduction is projected to save approximately $15M annually. These actions are consistent with
      a company that over-hired during the 2019–2021 growth phase and is now rationalizing costs in
      preparation for a PE exit or public offering.
    claimRefs:
