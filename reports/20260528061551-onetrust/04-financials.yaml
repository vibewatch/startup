  - id: section-capital-structure
    title: "Capital structure, adequacy, and strategic trajectory"
    body: >-
      OneTrust has raised over $1.1B in total primary capital across multiple rounds since 2019. The
      funding trajectory ran from a $200M Series A (July 2019, Insight Partners, $1.3B valuation) to
      a $210M Series B (February 2020, Coatue and Insight, $2.7B), a $300M Series C (December 2020,
      TCV, $5.1B), a $210M Series C extension (April 2021, SoftBank Vision Fund 2 and Franklin Templeton,
      $5.3B), and most recently a $150M Series D (July 2023, Generation Investment Management and Sands
      Capital, $4.5B). The Series D was publicly described as a down round — the $4.5B post-money
      valuation represented approximately 15% compression from the $5.3B 2021 peak, reflecting broader
      SaaS multiple contraction. No additional primary capital has been raised since July 2023.


      The company reports positive free cash flow as of 2024 and, per CEO Kabir Barday's March 2023 public
      statement, was on trajectory to reach FCF positivity after the 2022 restructuring — reportedly growing
      at 40%+ rate with its strongest quarter on record at fiscal year-end. These self-reported metrics are
      not audited and exact cash-on-hand, monthly burn, and runway figures are not publicly available.
      Given over $1.1B raised and claimed FCF positivity, the risk of near-term liquidity distress appears
      low — but confirmation would require audited financials.


      Strategically, board governance was restructured in March 2023, with three founders and legacy board
      members departing and four independent directors to be recruited, as the company prepared for what
      Kabir Barday called the "last phase as a private company." By late 2025, OneTrust had entered
      discussions with multiple large PE firms — reportedly including Vista Equity Partners, Thoma Bravo,
      Blackstone, KKR, and Silver Lake — about a potential sale or majority investment at a rumored
      transaction value exceeding $10B. Separately, OneTrust divested its Ethics & Compliance business
      unit (formerly Convercent) to EQS Group in a transaction announced by Thoma Bravo, consistent
      with portfolio rationalization ahead of a primary exit. Secondary market activity in 2026 reportedly
      reflects prices well above the 2023 down-round valuation, suggesting investor optimism about the
      PE deal outcome. The IPO window remains constrained; a PE transaction is the primary anticipated
      exit path.
