  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: GAAP financials
      missingEvidence: >-
        Audited GAAP P&L statements including revenue, COGS, gross margin, operating expenses
        broken out by R&D, S&M, and G&A, GAAP net income, and cash flow statement for FY2023 and FY2024.
      whyItMatters: >-
        All positive financial claims (ARR, FCF positivity, growth rate) are company-asserted and
        unaudited. Without GAAP financials, revenue quality, profitability, and capital adequacy
        cannot be independently verified.
      diligencePath: >-
        Request audited GAAP financial statements from OneTrust as part of formal due diligence;
        no public-source equivalent exists for a private company.
      relatedQuestionRefs:
        - QI001
      relatedTableRefs:
        - TI005

    - type: private-evidence-only
      severity: blocking
      topic: NRR and churn
      missingEvidence: >-
        Net revenue retention rate, gross revenue churn rate, and logo churn rate broken out by
        customer segment (enterprise vs. SMB) and cohort vintage.
      whyItMatters: >-
        ARR quality cannot be assessed without churn data; a 7.8% ARR growth rate could reflect
        high expansion masking high churn, or healthy land-and-expand — these have opposite
        investment implications.
      diligencePath: >-
        Request trailing-12M NRR and churn schedules segmented by customer tier and contract vintage
        in formal data room.
      relatedQuestionRefs:
        - QI003
      relatedTableRefs:
        - TI003

    - type: private-evidence-only
      severity: material
      topic: burn rate and cash position
      missingEvidence: >-
        Current cash and cash equivalents, monthly cash burn rate, and the exact definition of
        free cash flow used in the company's public claims (e.g., whether stock-based compensation
        is excluded).
      whyItMatters: >-
        Without cash and burn data, runway and capital adequacy cannot be confirmed; positive FCF
        as defined by the company may differ materially from GAAP operating cash flow or net income.
      diligencePath: >-
        Request bank statements, monthly cash burn data, and reconciliation of FCF definition
        to GAAP operating cash flow in formal due diligence.
      relatedQuestionRefs:
        - QI020
        - QI026
      relatedTableRefs:
        - TI004

    - type: private-evidence-only
      severity: material
      topic: unit economics
      missingEvidence: >-
        Customer acquisition cost, payback period, lifetime value, and net revenue retention by
        cohort — the core unit economics needed to evaluate capital efficiency.
      whyItMatters: >-
        ARR per FTE is below best-in-class benchmarks; without CAC and NRR, it is impossible to
        determine whether the sales efficiency and expansion engine justify the current cost structure.
      diligencePath: >-
        Request CAC by channel and segment, LTV:CAC, and payback period from company investor materials
        or formal data room.
      relatedQuestionRefs:
        - QI023
      relatedTableRefs:
        - TI003

    - type: missing-source
      severity: minor
      topic: debt obligations
      missingEvidence: >-
        Any outstanding debt, credit facilities, or project-finance obligations that could affect
        the PE transaction structure or reduce effective equity value.
      whyItMatters: >-
        PE buyouts are sensitive to existing debt covenants; undisclosed debt would affect deal
        structure and investor return expectations.
      diligencePath: >-
        Request full debt schedule and credit agreement disclosures in formal due diligence.
      relatedQuestionRefs:
        - QI026
      relatedTableRefs:
        - TI005

