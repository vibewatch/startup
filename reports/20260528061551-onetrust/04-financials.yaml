  - id: TI005
    title: Public financial gaps and diligence blockers
    columns:
      - Missing Metric
      - Impact on Underwriting
      - Diligence Path
    rows:
      - - GAAP revenue and P&L
        - "Cannot verify ARR quality or profitability; free cash flow claim is unaudited"
        - Request audited GAAP financial statements for last 3 fiscal years
      - - Gross margin by product line
        - "Cannot assess cloud hosting cost efficiency or professional services drag"
        - Request P&L with revenue and COGS split by SaaS vs. services
      - - Net revenue retention (NRR)
        - "Cannot assess churn vs. expansion balance; ARR quality is opaque"
        - Request trailing-12M NRR by customer cohort and contract size
      - - Gross revenue churn rate
        - "Cannot model replacement ARR burden or logo attrition"
        - Request monthly and annual gross and net churn by cohort
      - - Customer acquisition cost and payback
        - "Cannot evaluate S&M efficiency or required growth capital"
        - Request blended CAC and payback period by segment
      - - Burn rate and cash on hand
        - "Cannot confirm runway or capital adequacy without next raise"
        - Request trailing-12M cash burn and current bank balance
      - - Module-level ARR mix
        - "Cannot identify platform concentration risk or expansion vectors"
        - Request ARR by product module and cross-sell attach rates
      - - Revenue concentration by customer
        - "Fortune 100 penetration is positive but top-10 customer ARR is unknown"
        - Request ARR by top-10 customer and associated churn risk
      - - Stock-based compensation (SBC) impact
        - "FCF positivity may mask large SBC; GAAP net is the real test"
        - Request SBC as percentage of revenue and its exclusion from FCF definition
      - - Debt / credit facility obligations
        - "Any debt covenants or liens would affect PE buyout structure"
        - Request full debt schedule and any credit facility terms
    notes: >-
      All gaps are material to financial underwriting. No publicly available source resolves any of
      these metrics for OneTrust. Private-company opacity is expected but limits confidence rating on
      all financial estimates in this chapter.
    claimRefs:
      - CI032

