  - id: section-adverse-gaps
    title: "Adverse signals, financial opacity, and diligence blockers"
    body: >-
      OneTrust's financial picture carries several adverse or opaque dimensions that materially limit
      underwriting confidence. First, the 2023 down round was unambiguously adverse: valuation contracted
      by roughly $800M from peak and occurred in the context of the largest single-event workforce reduction
      in company history (June 2022, ~950 employees). The narrative that the company was "one of the first
      to react to market shifts" is positive spin on an episode driven by over-scaling during the low-rate
      environment, not strategic foresight. Second, a second layoff wave in March 2026 (~110 employees,
      ~$15M annual savings) suggests the cost rationalization program is not yet complete, or that revenue
      growth has not accelerated enough to absorb the cost base.


      Third, and most structurally significant, OneTrust discloses no GAAP P&L, no gross margin, no NRR,
      no churn, no CAC, no burn rate, and no exact cash position. Every financial metric cited in this
      chapter is either company-claimed ARR or third-party estimate, and all should be treated accordingly.
      The implied ARR per FTE of ~$190K is below the efficiency thresholds that best-in-class enterprise
      SaaS companies of similar ARR demonstrate, and the absence of disclosed NRR means the quality of
      the ARR base (degree of expansion vs. replacement churn) cannot be assessed. Fourth, the active PE
      sale process introduces execution risk: if no transaction closes, the company faces investor
      pressure to demonstrate an alternative liquidity path, and the delay itself signals that a straightforward
      IPO is not achievable on near-term terms. Fifth, the divestiture of the Convercent ethics &
      compliance unit narrows the platform breadth and removes a cross-sell lever, potentially affecting
      multi-module attach rates and long-term NRR.
    claimRefs:
      - CI014
      - CI025
      - CI026
      - CI032
      - CI037
      - CI038
      - CI039
      - CI040
      - CI041
    tableRefs:
      - TI005

