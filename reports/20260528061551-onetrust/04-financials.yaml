company:
  name: OneTrust
chapter:
  number: 4
  title: Financials
  summary: >-
    OneTrust is a late-stage, venture-backed SaaS company with over $500M in ARR, $1.1B raised, and positive
    free cash flow as of 2024 — but it remains entirely private and opaque on GAAP P&L, churn, NRR, burn rate,
    and margin detail. A 2023 down round at $4.5B (from a $5.3B peak), two significant workforce reductions
    (2022 and 2026), and active PE sale discussions signal that the growth-at-all-costs phase has ended and
    that capital efficiency and exit are the dominant financial priorities heading into 2026.

sections:
  - id: section-revenue-model
    title: "Revenue model and public financial traction"
    body: >-
      OneTrust monetizes through an annual SaaS subscription model with fully modular, custom-quoted pricing.
      Customers purchase access to individual or bundled product lines — Consent & Preferences, Privacy
      Automation, Third-Party Risk Management, GRC, Data Governance, AI Governance, and Tech Risk &
      Compliance — with contract value driven by the number of modules, seats or admin users, covered domains,
      and data-subject volumes. Professional services, implementation, and onboarding are typically billed
      separately and can represent a meaningful share of total customer spend on complex deployments.


      Public traction evidence is the strongest available in a private-company context. OneTrust's May 2024
      TrustWeek announcement confirmed ARR on track to surpass $500M in 2024 versus $464M for FY2023,
      implying roughly 7.8% year-over-year growth at the ARR level. Within that base, 1,200+ customers
      each exceed $100K in ARR and several cross $1M, indicating a healthy enterprise-tier cohort generating
      outsized revenue per logo. The customer base reached 14,000+ organizations, with more than 75% of the
      Fortune 100 represented. OneTrust has articulated a long-term ambition of $1B ARR. For 2025 and 2026,
      external estimates (Latka, Compworth) suggest ARR in the $525M–$575M range, but these are third-party
      extrapolations, not company disclosures.


      Revenue quality is supported by enterprise stickiness — privacy, GRC, and consent management are
      operationally embedded, compliance-critical, and difficult to rip out — but weakened by the absence
      of any disclosed churn rate, net revenue retention, or cohort-level expansion data. IDC named OneTrust
      #1 in worldwide market share in data privacy software for multiple consecutive years through 2025,
      and Forbes named it to the Cloud 100 for the seventh consecutive year in 2025, affirming commercial
      scale and market position. These signals are encouraging but do not substitute for revenue-quality
      metrics that only the company can supply.
    claimRefs:
