callouts:
  - calloutType: risk
    title: "Down round and two layoff cycles signal growth-efficiency tension"
    body: >-
      The 2023 down round ($4.5B vs. $5.3B peak), the June 2022 ~950-person layoff (~25% of workforce),
      and the March 2026 ~110-person layoff collectively demonstrate that OneTrust over-hired during the
      2019–2021 growth phase and is still rightsizing. ARR growth of ~7.8% YoY at the $500M level is
      slower than best-in-class SaaS at equivalent scale. The PE exit process removes the IPO optionality
      and introduces transaction execution risk.
    claimRefs:
      - CI014
      - CI025
      - CI026
      - CI037
      - CI038

  - calloutType: insight
    title: "FCF positivity and $1.1B raised provide near-term financial buffer"
    body: >-
      Company-claimed positive free cash flow as of 2024, combined with over $1.1B raised and no
      publicly disclosed debt obligations, suggests OneTrust is not in near-term liquidity stress. The
      PE deal, if closed above $10B, would represent a substantial markup on the 2023 down-round
      valuation for investors and validate the revenue quality narrative.
    claimRefs:
      - CI013
      - CI015
      - CI020
      - CI021
      - CI029

  - calloutType: recommendation
    title: "Request full audited GAAP financials and NRR before any investment decision"
    body: >-
      The chapter's most material diligence blocker is the complete absence of audited GAAP P&L, NRR,
      churn, CAC, and burn data. Every positive financial claim in this chapter is company-asserted or
      third-party estimated, and every adverse signal (down round, layoffs, low ARR per FTE) is confirmed.
      Audited financials, a formal NRR disclosure, and burn rate confirmation are non-negotiable preconditions
      for underwriting.
    claimRefs:
      - CI032
      - CI027
      - CI035

