chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, headquarters, and business model
        blocks:
          - type: paragraph
            body: >-
              OneTrust, LLC is an American privately-held software company incorporated in Georgia and headquartered in
              Atlanta, Georgia. The company operates from a 74,000-square-foot campus along the Atlanta Beltline that
              opened in May 2025, consolidating more than 400 Atlanta-area employees, and maintains twelve additional
              regional offices spanning London, Bangalore, Madrid, Paris, Munich, Singapore, Melbourne, Chicago, San
              Francisco, and Toronto—thirteen offices in total. Its website is www.onetrust.com.


              OneTrust was founded in 2016 by Kabir Barday, who developed the idea while working at AirWatch, where he
              observed the difficulty privacy professionals faced in meeting emerging regulatory obligations. The
              company launched as a purpose-built compliance tool ahead of the European Union's General Data Protection
              Regulation (GDPR) enforcement date in 2018 and quickly extended its scope as the California Consumer
              Privacy Act (CCPA) and a cascade of state and global privacy laws created broadening demand.


              The company's core value proposition is a unified SaaS platform enabling organizations to govern, manage,
              and demonstrate compliance with privacy, data, security, and AI-related regulations. Its product portfolio
              spans consent and preference management, data mapping and classification, third-party and vendor risk
              management, AI governance, and regulatory research (DataGuidance). OneTrust describes its current
              positioning as the 'AI-Ready Governance Platform,' a registered trademark introduced in March 2026. The
              business model is a recurring subscription, primarily targeting enterprise and mid-market organizations
              that face multi-jurisdictional compliance obligations. The company holds more than 300 patents and
              processes billions of consent and preference transactions per week across its installed base, underscoring
              the infrastructure-like depth of its platform in daily enterprise operations.
