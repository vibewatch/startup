      - number: '1.3'
        title: Funding history, valuation, and investor base
        blocks:
          - type: paragraph
            body: >-
              OneTrust has raised approximately $1.13 billion in equity capital across seven discrete funding rounds
              between July 2019 and July 2023. The funding history is notable for its rapid escalation and subsequent
              correction. The Series A of $200 million in July 2019, led by Insight Partners, made the company a unicorn
              within three years of founding at a $1.3 billion valuation. The Series B of $210 million in February 2020,
              led by Coatue Management, brought the valuation to $2.7 billion. The Series C of $300 million in December
              2020—the largest single round—was led by TCV and valued the company at $5.1 billion. A $210 million Series
              D extension in April 2021, led by SoftBank Vision Fund 2, pushed the valuation to $5.3 billion, the peak.
              A smaller $50 million private placement followed in March 2023.


              The July 2023 financing marks the inflection point: OneTrust raised $150 million led by Generation
              Investment Management—co-founded by former U.S. Vice President Al Gore—with Sands Capital as co-investor,
              at a $4.5 billion post-money valuation. This represented a haircut of approximately $800 million from the
              2021 peak, consistent with broader venture valuation corrections and coming roughly 13 months after the
              company's June 2022 layoffs. CEO Barday noted at the time that the company had doubled its ARR to $400
              million and reached free cash flow milestones since the prior round, framing the financing as a strategic
              partnership rather than distress.


              As of November 2025, The Information reported that OneTrust was in discussions for a potential private
              equity sale at a rumored valuation exceeding $10 billion, with Thoma Bravo, Vista Equity Partners, and
              other major PE firms reportedly evaluating the opportunity. No transaction has been confirmed as of the
              May 2026 run date. The prospect reflects both the attractiveness of OneTrust's sticky ARR base and the
              persistent uncertainty over the IPO exit path in the current market. Key investors across the funding
              history include Insight Partners, Coatue Management, TCV, SoftBank Vision Fund 2, Generation Investment
              Management, Sands Capital, Franklin Templeton, and Speedinvest.
