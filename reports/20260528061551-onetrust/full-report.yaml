      - number: '8.4'
        title: Recommendation and Final Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Overall recommendation: Track. OneTrust is a genuine category leader in a structurally growing market, has
              demonstrated capital efficiency, and possesses the strategic asset profile that commands PE and strategic
              premium pricing. However, the investment is not actionable for most new capital at the $4.5 billion last
              mark without (1) confirmed NRR above 110%, (2) disclosed EBITDA or FCF margin confirming the profitability
              claim, and (3) clarity on PE process timing and structure. The risk rating is medium—the regulatory
              tailwind is real and durable, but the undisclosed financial profile, preference overhang, CEO transition,
              and reliance on a PE liquidity event within a compressed window make this a monitor-rather-than-act
              situation.

              Valuation stance: Stretched at the $4.5 billion last mark (8.2x ARR) given 8% ARR growth in 2023–2024, but
              potentially attractive if the PE buyout occurs above $10 billion and secondary entry is available below $4
              billion. Confidence: medium, driven by the undisclosed nature of key financial metrics.

              Priority diligence asks before any capital commitment: (1) NRR and gross revenue retention for the past
              four quarters to validate expansion versus new-logo dependency; (2) gross margin by segment (software vs.
              professional services) to confirm SaaS-grade unit economics; (3) EBITDA or FCF margin range to
              independently verify the "positive free cash flow" claim; (4) cap-table and waterfall analysis to quantify
              preference overhang impact at different exit prices; (5) PE process update—firm names, timeline,
              indicative valuations, and deal structure (full buyout vs. minority growth investment); (6) ARR bridge by
              cohort to distinguish net new from expansion; and (7) customer concentration—whether any single customer
              represents over 5% of ARR.
