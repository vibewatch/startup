      - number: '2.2'
        title: Market Sizing — Multiple Lenses and Contradictory Estimates
        blocks:
          - type: paragraph
            body: >-
              Multiple sizing lenses are required because analyst methodologies diverge sharply on scope, geography, and
              segment inclusion rules, producing 2026 estimates that cannot be reconciled without auditing each report's
              definition. For the privacy management software segment, Mordor Intelligence ($6.24B, 23.08% CAGR to
              2031), Fortune Business Insights ($5.37B, 35.5% CAGR to 2034), and Coherent Market Insights ($5.08B,
              29.38% CAGR to 2035) form a self-consistent cluster that treats the market as cloud-delivered compliance
              automation for GDPR, CCPA, and adjacent laws. Differences stem mainly from whether AI governance and TPRM
              modules are included. The consent management platform segment adds a second, partially overlapping sizing
              layer: Business Research Insights puts the 2026 CMP market at $2.43B (10.2% CAGR) while Research and
              Markets estimates $1.13B (24.8% CAGR to 2032)—a 2.2× spread that reflects whether CMP is defined as
              standalone cookie-consent tools or as the full consent orchestration layer within a privacy platform. The
              AI governance market is sized at $492M–$610M for 2026 (Gartner / Research and Markets / MarketsandMarkets)
              with a 44%+ CAGR, driven by EU AI Act compliance demand. The TPRM market ($8–12B, 17–18.6% CAGR) is the
              largest sub-segment where OneTrust competes but is not the dominant vendor; its inclusion in TAM
              calculations is debated depending on OneTrust's win-rate in standalone TPRM competitions. OneTrust's
              reported $500M+ ARR as of TrustWeek 2024 implies roughly 8–10% penetration of the $5–6B privacy management
              market—a plausible mid-to-late growth phase trajectory for a category leader. AInvest and analyst
              commentary reference a $30B privacy software opportunity on a long horizon, but this aggregates privacy,
              security, identity, and adjacent categories beyond OneTrust's current product scope. Contradictory
              estimates are preserved as evidence gaps pending methodology disclosure from each research firm.
