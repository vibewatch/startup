  - id: FR001
    title: Risk Heatmap — OneTrust 2026 Risk Landscape by Likelihood and Impact
    type: matrix
    layout: wide
    summary: >-
      Maps key OneTrust risks across likelihood (rows) and impact (columns); risks in the High-Likelihood /
      Critical-Impact cell represent the highest residual exposure.
    data:
      columns:
        - Low Impact
        - Medium Impact
        - High Impact
        - Critical Impact
      rows:
        - label: High Likelihood
          values:
            - Macro budget tailwind reversal
            - CMP mis-configuration by customers; US state patchwork burden
            - Competitive displacement; EU AI Act product gap
            - CNIL-type cookie enforcement against OneTrust customers
        - label: Medium Likelihood
          values:
            - EQS divestiture customer confusion
            - PE acquisition leverage risk; CEO transition cultural disruption
            - AI-native competitor displacement in AI governance; data breach propagation
            - Cookie class action precedent extending to vendor liability
        - label: Low Likelihood
          values:
            - Antitrust review of PE deal
            - Sales pipeline disruption post-CEO change
            - Platform outage at regulatory deadline
            - EU DPA formal investigation of OneTrust platform design
    approximationNotes: >-
      Likelihood and impact ratings are analyst estimates based on public enforcement precedents, competitive
      intelligence, and employee sentiment data as of May 2026. No internal OneTrust risk register was available for
      cross-reference.
    claimRefs:
      - CR010
      - CR011
      - CR013
      - CR022
      - CR030
      - CR037
      - CR042
