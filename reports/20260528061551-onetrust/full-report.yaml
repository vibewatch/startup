      - number: '2.3'
        title: Buyer Segmentation and Budget Dynamics
        blocks:
          - type: paragraph
            body: >-
              Enterprise privacy software buying decisions are typically made by a triad of the Chief Privacy Officer or
              Data Protection Officer (platform selection), the CISO (security integration and data discovery modules),
              and General Counsel (regulatory risk and contract management). In large organizations (1,000+ employees)
              the CPO or DPO leads platform selection and owns cross-functional privacy budget, while the CISO controls
              data-security-related modules and the General Counsel drives consent and litigation-response capabilities.
              Budget ownership is increasingly a shared governance model—cross- functional privacy steering committees
              handle large contract renewals above $250K annually. OneTrust's enterprise segment (customers spending
              over $100K ARR) numbers more than 1,200 accounts and is the primary revenue engine, corroborated
              independently by the company's own announcement and PRNewswire release. Mid-market companies (200–1,000
              employees) spending €80K–200K annually on GDPR compliance represent a contested growth tier where
              lighter-weight alternatives like Captain Compliance and Didomi are gaining traction on usability and
              speed-to-value arguments. The SMB segment (under 200 employees) is largely served by self-service or
              low-touch CMP solutions (Cookiebot, Osano) and is not a meaningful direct enterprise sales target for
              OneTrust. On the payer side, the budget for enterprise privacy platforms is drawn from the compliance,
              legal, or IT security cost centers depending on organizational structure; in financial services and
              healthcare, regulatory affairs teams often hold direct budget authority. Cloud-based (SaaS) deployment
              dominates with over 65% market share, aligning with OneTrust's go-to-market model and enterprise
              procurement preferences. The top five CMP vendors—OneTrust, TrustArc, BigID, Cookiebot, and
              Didomi—collectively control approximately 80% of the consent management market, and OneTrust holds an
              estimated 42.7% share within the broader GRC software category per 6sense tracking as of 2026.
