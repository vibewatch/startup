      - number: '8.3'
        title: Bull, Base, and Bear Scenarios
        blocks:
          - type: paragraph
            body: >-
              The bull case assumes OneTrust closes a PE buyout at approximately $10–12 billion within 12–18 months,
              driven by 20–25% ARR growth to $660–700M, NRR above 115%, and a winning AI-governance platform narrative
              under CEO Heyman. At $12 billion, Series D investors holding preferred at the $4.5 billion mark realize a
              2.7x money multiple, while common equity and options in the cap table benefit materially. The base case
              assumes no near-term liquidity event: the PE process stalls or closes at $7–8 billion (14–15x ARR), ARR
              grows 12–15% to reach $615–630M by end-2026, and the company operates profitably while awaiting a more
              favorable IPO window in 2027–2028. At $7.5 billion, that is a 1.7x return from the last primary
              mark—acceptable for late-stage investors with long hold periods but below target for 2021-era investors
              who paid into the $5.3 billion round. The bear case envisions regulatory complexity plateau, AI-
              governance market fragmentation, or a failed PE process driving a flat or down secondary valuation of
              $3.5–4.0 billion. In this scenario, 2023 down-round investors break even or realize a modest loss after
              preferred waterfall distributions, and earlier-round investors in common equity face material dilution.

              The most sensitive valuation drivers are (1) ARR growth rate, as every 5-percentage- point acceleration
              shifts the implied multiple by approximately 1x ARR; (2) NRR, which determines whether growth is organic
              or requires expensive new logo acquisition; (3) the PE process outcome, which is binary in nature (deal
              vs. no deal in 2026); and (4) macro interest rates, as PE LBO modeling at a $10B+ price requires
              manageable debt service costs that are sensitive to rate levels.

              Downside triggers that would break the bull thesis include: ARR growth decelerating below 10%, PE
              processes collapsing without a deal, a regulatory enforcement action targeting OneTrust's own data
              practices, loss of one or more Fortune 100 anchor customers, or a significant competitive displacement by
              ServiceNow, Microsoft Purview, or a well-funded vertical entrant. The failed Planetly acquisition and 25%
              workforce cut in 2022 demonstrate that the company is not immune to strategic miscalculations.
            claimRefs:
