  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Scope
        blocks:
          - type: paragraph
            body: >-
              OneTrust's addressable market spans five interconnected software categories that share a common buyer
              (enterprise privacy and compliance teams) and a common regulatory driver (proliferating data protection
              and AI laws). The narrowest boundary—pure-play privacy management software—encompasses consent collection,
              data subject request automation, data mapping, privacy impact assessments, and incident response modules.
              Analyst firms that use this definition (Mordor Intelligence, Coherent Market Insights, Fortune Business
              Insights) size the 2026 market at $5.08–6.24 billion. A second definitional layer adds consent management
              platforms (CMPs) focused on cookie consent, preference management, and third-party tag governance;
              analysts size this segment separately at $1.05–2.43 billion for 2026, with wide spreads reflecting
              disagreement on whether CMPs are a sub-set of or adjacent to privacy management software. The third
              layer—AI governance platforms—is the fastest-growing segment at a 44%+ CAGR but smallest in absolute
              revenue ($492–610M in 2026); demand is directly tied to the EU AI Act's full applicability in August 2026,
              ISO 42001, and the NIST AI Risk Management Framework. The fourth layer is third-party risk management
              (TPRM) software ($8–12B in 2026), where OneTrust competes on vendor due-diligence and continuous
              monitoring capabilities. Zooming out to the broadest GRC platform market ($65.9B in 2026), most of that
              total is driven by financial-services audit, SOX compliance, and IT risk tools that OneTrust does not
              directly address; including this envelope inflates TAM beyond OneTrust's genuine win-rate territory. The
              most defensible TAM for investment analysis is the privacy-and-trust software stack ($6–10B in 2026,
              including overlapping consent and AI governance spend) rather than the full GRC envelope. Status-quo
              substitutes include spreadsheet-based compliance tracking, law-firm-driven privacy programs, and bespoke
              in-house tooling—all of which represent displacement opportunities rather than competitive threats in the
              software sense.
