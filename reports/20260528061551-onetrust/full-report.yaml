  - id: TV006
    title: Thesis-Break and Kill-Trigger Table
    columns:
      - Trigger
      - Threshold / Event
      - Transmission to Thesis
      - Action Implication
    rows:
      - - ARR growth deceleration
        - ARR growth falls below 8% for two consecutive quarters
        - Implies NRR <100% and net new logo slowdown; compresses multiple toward 4–5x; threatens PE pricing assumptions
        - Reduce conviction; do not participate in new primary round; reassess secondary entry floor
      - - PE process failure
        - No LOI or signed term sheet by Q4 2026
        - Liquidity path becomes uncertain; investors face 3–5 year hold extension; employee equity underwater
        - Exit any secondary position; downgrade to avoid
      - - NRR below 100%
        - Published or management-attested NRR below 100%
        - Signals net churn exceeding expansion; undermines compounding revenue model
        - Downgrade to avoid immediately
      - - Regulatory action targeting OneTrust
        - GDPR, FTC, or state AG enforcement action naming OneTrust as a data handler
        - Brand damage in trust-focused market; customer churn; delayed regulatory approvals for AI products
        - Pause; assess scope and remediation timeline before any new commitment
      - - CEO transition execution risk
        - Heyman fails to retain leadership team or accelerate AI product roadmap within 6 months
        - Sales cycle elongation; R&D morale risk; potential enterprise renewal pressure
        - Monitor hiring announcements and G2/Gartner satisfaction scores; set 6-month review
      - - Competitive displacement
        - Microsoft Purview or ServiceNow wins >10% share in OneTrust's core consent or DSAR workflows
        - CAC increases, win-rates fall; ARR growth slows; multiple compresses
        - Monitor competitive win/loss data; track Gartner MQ positioning shifts
    notes: Author-defined triggers based on OneTrust business model analysis and GRC SaaS industry precedents.
    claimRefs:
      - CV006
      - CV021
      - CV022
      - CV023
      - CV028
      - CV029
  - id: TV007
    title: Final Diligence Asks
    columns:
      - Topic
      - Missing Evidence
      - Why It Matters
      - Owner / Diligence Path
    rows:
      - - NRR and gross revenue retention
        - Quarterly NRR and GRR for the past 4–6 quarters, segmented by cohort
        - Determines whether growth is expansion-led (high quality) or new-logo dependent (fragile); drives multiple
        - Request from management data room; cross-reference against G2 reviews for churn signals
      - - Gross margin by segment
        - Software subscription gross margin vs. professional services gross margin
        - SaaS-grade gross margin (>75%) is required to justify 8x+ ARR multiple; services dilution is a known risk
        - Audited P&L or management presentation; compare against Varonis benchmark (~80%)
      - - EBITDA and FCF margin
        - Actual EBITDA margin % and free cash flow quantum for 2024 and 2025
        - Validates the 'positive free cash flow' claim; determines debt capacity for PE LBO modeling
        - Audited financials or management-attested summary in data room
      - - Cap-table and waterfall analysis
        - Full capitalization table showing preference class, liquidation multiple, participation rights
        - Quantifies residual common equity value at various exit prices; critical for secondary buyers
        - Legal data room; restructuring counsel review
      - - PE process status
        - Confirmed bidders, timeline, indicative valuations, deal structure (full buyout vs. minority)
        - Binary impact on near-term liquidity; $10B vs. $4.5B exit is a 3x difference in equity value
        - Investment bank advisor (Goldman Sachs confirmed as financial advisor for the Ethics carve-out)
      - - ARR bridge by cohort
        - New logo ARR, expansion ARR, contraction ARR, and churn ARR for 2024–2025
        - Distinguishes high-quality land-and-expand from churn-masked revenue stability
        - Management data room; cross-check against headcount in customer success roles
      - - Customer concentration
        - Share of ARR from top 10 customers; any customer >5% of total ARR
        - Concentration risk; failure of one Fortune 100 anchor could move ARR by 2–5% in a quarter
        - Data room; reference customer conversations
    notes: >-
      Diligence asks prioritized by valuation impact. Items 1–3 are blocking for any capital commitment above $4.0B
      secondary floor.
    claimRefs:
      - CV025
      - CV026
      - CV027
      - CV028
      - CV029
