  - id: FV004
    title: Investment KPIs — OneTrust Scorecard
    type: kpi
    layout: standard
    summary: IC-ready scoring across key diligence dimensions; 1–5 scale (5 = strongest).
    data:
      items:
        - label: Market size and TAM
          value: 5
          note: Privacy software TAM $7.5B in 2026 growing 28%+ CAGR; OneTrust addresses GRC, AI governance, consent
        - label: Competitive moat
          value: 4
          note: ~43% GRC share, 75% Fortune 100 penetration, 300+ patents; moat is real but Microsoft/ServiceNow threaten
        - label: Revenue scale and growth
          value: 3
          note: $550M ARR confirmed; but YoY growth ~10% in 2024–25 is below SaaS median; acceleration needed
        - label: Unit economics
          value: 2
          note: Positive FCF claimed but NRR, gross margin, and EBITDA not publicly disclosed; cannot confirm quality
        - label: Exit readiness
          value: 3
          note: PE process active with named suitors; no IPO filing; timeline uncertain
        - label: Valuation discipline
          value: 2
          note: 8.2x ARR at last mark is stretched vs. public GRC comps; rumored $10B+ target is 18x ARR
        - label: Evidence quality
          value: 2
          note: Key financials (NRR, margin) undisclosed; reliance on secondary press reports for ARR
        - label: Leadership and execution
          value: 3
          note: New CEO Heyman brings IPO-track experience; founder Barday remains on board; transition risk is real
    claimRefs:
      - CV001
      - CV003
      - CV007
      - CV024
      - CV025
