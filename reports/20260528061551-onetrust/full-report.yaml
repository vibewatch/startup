          - type: callout
            title: PE Buyout Could Reset Category Pricing
            body: >-
              If a PE buyout closes at or above $10 billion, it would set a new pricing benchmark for category-leading
              privacy and GRC SaaS, validating 15–18x ARR multiples for dominant, cash-flow-positive platforms. This
              would reprice comparable assets including BigID, TrustArc, and LogicGate and potentially trigger a wave of
              follow-on PE activity in the compliance software sector.
            calloutType: insight
            claimRefs:
              - CV013
              - CV014
              - CV022
          - type: callout
            title: Track; Do Not Act Without Confirmed Financials
            body: >-
              New capital should not be deployed into OneTrust secondary or a co-invest without first validating NRR,
              gross margin, and EBITDA margin from audited or management- attested sources. The strategic asset quality
              is high, but the combination of undisclosed financials, preference overhang, leadership transition, and
              binary PE exit dependency means the risk-adjusted entry point has not been established.
            calloutType: recommendation
