              - CO036
              - CO037
          - type: callout
            title: Unresolved exit path creates investor and leadership uncertainty
            body: >-
              OneTrust has not gone public despite reaching unicorn status in 2019 and a $5.3B peak valuation in 2021.
              The July 2023 down round, CEO transition in February 2026, and PE sale discussions (rumored $10B+) create
              a complex, multi-party negotiation environment. No transaction has closed as of the May 2026 run date. The
              new CEO's prior experience leading Radiant Systems and Snap One through IPOs and acquisitions suggests a
              transaction is likely within his tenure, but the timeline is uncertain.
            calloutType: risk
            claimRefs:
              - CO007
              - CO018
              - CO019
              - CO040
          - type: callout
            title: Repeated workforce reductions signal structural cost management challenges
            body: >-
              OneTrust has conducted three separate headcount reduction events since June 2022: 950 layoffs (25% of
              workforce) in June 2022, ~200 Planetly closures in November 2022, and ~110 layoffs (~5%) in March 2026.
              The pattern—juxtaposed against record revenues and customer demand at the time of the 2022 cuts—generated
              significant employee and public criticism and signals ongoing tension between growth investment and
              profitability requirements.
            calloutType: risk
            claimRefs:
              - CO029
              - CO030
