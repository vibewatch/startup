      - number: '1.2'
        title: Leadership, founders, and board governance
        blocks:
          - type: paragraph
            body: >-
              OneTrust was founded by a single founder, Kabir Barday, who served as its sole CEO from 2016 through
              February 2026. On February 9, 2026—following a strong fiscal year ending January 31, 2026—the company
              announced Barday's transition to a board member and strategic advisor role, and the appointment of John
              Heyman as the new Chief Executive Officer. Heyman is an experienced B2B technology executive who
              previously served as CEO of Radiant Systems, an Alpharetta-based hospitality and retail technology
              provider that was acquired by NCR Corporation in 2011 for approximately $1.2 billion, and as CEO of Snap
              One, a Charlotte-based smart-living products and software company acquired by Resideo Technologies in 2024
              for approximately $1.4 billion. Both companies went through initial public offerings under his leadership,
              giving him relevant experience for a potential OneTrust liquidity event. Barday remains actively engaged
              as a board director focused on long-term strategy.


              The board of directors includes Barday (founder), Heyman (CEO), and Thomas Laffont, co-founder of Coatue
              Management and a long-standing board member who commented publicly on Heyman's appointment. David Obstler,
              CFO of Datadog and a former Goldman Sachs and JPMorgan investment banker, was appointed as the company's
              first independent board member and Audit Committee Chair as of May 2024. The company announced plans to
              recruit four independent directors to reach a majority-independent seven-member board, but the full
              post-February 2026 board roster has not been publicly confirmed.


              On the operating leadership bench, Digvijay (DV) Lamba joined in 2025 as Chief Product and Technology
              Officer (formerly at Alteryx), Michael Schanker joined in 2025 as Chief Marketing Officer (formerly CMO of
              Coupa Software), Blake Brannon serves as Chief Innovation Officer, Kim Rivera as Chief Legal and Business
              Affairs Officer, Guido Torrini as CFO, and Jim Monroe as Chief Customer Officer. The rapid addition of
              Lamba and Schanker signals pre-IPO or pre-transaction organizational strengthening. A key-person
              dependency exists in Barday as the cultural and brand architect of the company; the CEO transition is the
              highest-profile governance event in OneTrust's history and will be a focus for diligence.
