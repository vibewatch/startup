  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: >-
              OneTrust competes across five overlapping market categories—privacy management software, GRC platforms,
              data governance, third-party risk management (TPRM), and AI governance. No single vendor spans all five
              with equal depth, creating a landscape of category leaders, adjacent platforms, and horizontal GRC suites
              vying for enterprise wallet share. The direct competitors are purpose-built privacy and governance
              platforms: BigID (data-centric, AI-native), Securiti (now Veeam/Securiti following the December 2025
              acquisition), and TrustArc (compliance-workflow-focused, nearly 30 years of market history). Adjacent
              competitors approach from data governance (Collibra, Informatica) or horizontal GRC (ServiceNow GRC, RSA
              Archer, IBM OpenPages, MetricStream). Point-solution substitutes—Osano, Enzuzo, CookieYes,
              Cookiebot—address narrow consent management needs at a fraction of OneTrust's price.


              Two structural shifts are reshaping the landscape in 2026. First, AI governance is now a mandatory buying
              criterion as enterprises face EU AI Act obligations, opening a new battleground where pure-play privacy
              tools and data-security posture management (DSPM) platforms compete on equal footing. Second,
              consolidation is accelerating: Veeam's $1.725 billion acquisition of Securiti AI (closed December 2025)
              combines data resilience infrastructure with privacy and AI trust capabilities, creating a converged
              platform that could target OneTrust customers via Veeam's existing data-backup relationships with 550,000
              customers including 82% of the Fortune 500. Internal build and status-quo inertia remain meaningful
              alternatives, especially in large enterprises with mature legal teams. Switching costs run high on both
              sides—from OneTrust to alternatives, and from manual processes toward OneTrust—creating a two-sided
              stickiness dynamic that shapes competitive deal timing.
