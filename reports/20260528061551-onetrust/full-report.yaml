companyProfile:
  summary: >-
    OneTrust, LLC is an American privately held enterprise software company founded in 2016 by Kabir Barday in Atlanta,
    Georgia. It operates from a 74,000-square-foot Atlanta headquarters and has an estimated workforce of roughly 2,600
    employees across a 13-office global footprint. OneTrust provides a Trust Intelligence Platform spanning five product
    clouds — Consent & Preferences, Privacy Automation, Data Use Governance, AI Governance, and Tech Risk & Third-Party
    Management — plus DataGuidance regulatory intelligence covering 300+ jurisdictions. It raised approximately $1.13
    billion across seven rounds (2019–2023), including a $300M Series C at a $5.1B valuation in 2021, with a marked-down
    $150M round at a $4.5B valuation in July 2023. In February 2026, founder/CEO Kabir Barday was succeeded by John
    Heyman; a PE acquisition process at $10B+ was reportedly active as of late 2025. OneTrust divested its Ethics &
    Compliance/Convercent business to EQS Group in late 2024.
