      - number: '1.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Category-defining market share in enterprise privacy and GRC software
            body: >-
              OneTrust held approximately 40% of the data privacy compliance software market as of 2020 (IDC), more than
              three times its nearest competitor, and has maintained category leadership through 2025 per IDC
              MarketScape, Forbes Cloud 100, and Fortune Future 50 recognition. With 75% of the Fortune 100 as
              customers, the switching cost moat is significant.
            calloutType: strength
            claimRefs:
