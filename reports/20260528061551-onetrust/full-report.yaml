        title: >-
          Retention, switching costs, and satisfaction: high stickiness among enterprise accounts offset by adverse
          review signals among smaller customers
        blocks:
          - type: paragraph
            body: >-
              OneTrust's enterprise customer retention story is anchored by high structural switching costs rather than
              disclosed financial metrics. The platform requires deep technical integration with enterprise stacks —
              HRIS, CRM, DLP, marketing automation, cloud platforms, and data warehouses — through 200+ pre-built
              connectors spanning ServiceNow, Salesforce, Microsoft Purview, Jira, AWS, Azure, Google Cloud, Snowflake,
              and Databricks. Once a compliance workflow (data subject request automation, privacy impact assessments,
              vendor risk assessments, AI governance inventories) is live on OneTrust, migration to an alternative
              requires rewriting those workflows, retraining staff, rebuilding policy templates, and accepting a
              regulatory risk window during transition. Implementation timelines of several months to over a year
              further entrench customers operationally. Enterprise satisfaction at the top of the market is reflected in
              G2's 4.3–4.4 out of 5 star rating across 283+ verified reviews and Capterra's similarly positive ratings.
              These scores consistently cite OneTrust's broad regulatory coverage, privacy automation depth, and
              integration ecosystem as core strengths. However, Trustpilot shows a starkly contrasting 1.5 out of 5
              stars from 30 reviewers, with complaints about auto-renewal tactics, loss of platform access following
              domain changes, cookie banner failures, and poor support responsiveness. This divergence aligns with
              analyst commentary noting higher churn risk among smaller, resource-constrained customers who lack
              dedicated compliance teams to manage implementation complexity. NRR and GRR are not publicly disclosed;
              analyst estimates put historical NRR at or above 110%, consistent with the enterprise segment's
              stickiness. Enterprise accounts at the $100,000+ ARR tier face sales cycles of 6–18 months, adding a
              procurement friction layer that front-loads customer acquisition cost but also increases lifetime value
              predictability for won accounts.
