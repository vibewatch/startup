  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              OneTrust's bull case rests on three interlocking pillars. First, it commands an estimated 42.7% share of
              the GRC/privacy software category (6sense, 2026) and serves 75% of the Fortune 100, a network-effect moat
              that is exceptionally difficult for point-solution competitors to dislodge. Second, the regulatory
              tailwind is structurally durable: 300+ global privacy jurisdictions mandate ongoing compliance spend, and
              AI governance requirements are layering an additional demand curve on top of existing privacy and GRC
              workflows. Third, OneTrust reached positive free cash flow while scaling to $550 million ARR—a rarity
              among late-stage SaaS companies—signaling that the 2022 workforce restructuring achieved the intended
              operating discipline.

              The anti-thesis centres on valuation uncertainty and execution risk. The $4.5 billion last-round mark
              (July 2023) was itself a 15% down round from the $5.3 billion 2021 peak, and no new primary round has been
              confirmed since. The rumored $10 billion PE buyout target represents a 2.2× uplift from the last mark at a
              time when public GRC comps (Varonis: 4–5x EV/revenue) trade at a meaningful discount to that implied
              multiple. Revenue growth decelerated to approximately 8% YoY in 2023–2024 (from $464M to $500M ARR),
              though 2025 momentum improved toward $550M. NRR, gross margin, and EBITDA are not publicly disclosed,
              making independent corroboration of quality impossible. The February 2026 CEO transition to John
              Heyman—while experienced—injects short-term leadership continuity risk into an already complex PE
              exploration process. Finally, the carve-out of the Ethics & Compliance business to EQS Group in December
              2024 narrows the platform scope and may have reduced addressable cross-sell paths.
            claimRefs:
