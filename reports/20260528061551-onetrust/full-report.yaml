            body: >
              OneTrust's patent portfolio of 300-plus active patents with a ~95% USPTO grant rate represents a
              meaningful IP moat in privacy automation and data governance. The March 2026 real-time AI governance
              expansion — covering AI agent detection, AI policy management, and guardrail enforcement integrated with
