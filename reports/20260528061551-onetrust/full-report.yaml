      - number: '7.5'
        title: Financial, Valuation, and Macro Risks
        blocks:
          - type: paragraph
            body: >-
              OneTrust's financial risk profile reflects a company that survived a meaningful valuation down round
              ($5.3B peak in 2021 → $4.5B Series D in July 2023) and is now pursuing an exit at a rumored $10B+
              price—more than twice its last disclosed valuation—through a PE process rather than an IPO. The company
              reports approximately $550M ARR and positive free cash flow, but specific margins, EBITDA, and churn rates
              are not publicly disclosed, making independent profitability verification impossible. If PE leverage is
              applied at the rumored acquisition price, a deal/EBITDA ratio of 4x+ would create significant debt service
              obligations that constrain R&D investment and increase operational fragility in any scenario of ARR growth
              deceleration.


              The macro risk that deserves attention is OneTrust's deep dependency on regulatory complexity as a growth
              driver. Enterprise governance budgets are rising 24% per year on average (per OneTrust's own 2025 survey),
              but this trend is regulatory-cycle-dependent. Any significant simplification of GDPR, CCPA, or US state
              law obligations—or a political rollback of AI governance requirements—would deflate a portion of
              OneTrust's addressable market and customer urgency. Similarly, a broad enterprise IT spending contraction
              driven by macro conditions would compress procurement cycles, particularly for OneTrust's new AI
              governance and data-use governance modules, which are early-stage and not yet embedded in core customer
              workflows. OneTrust's fund-raising history of $925M+ in VC creates founder and early-investor liquidity
              pressure that the PE exit is designed to satisfy, but the $10B+ implied valuation requires sustained
              growth and margin expansion that remains unverified by public evidence.
            claimRefs:
