            title: Pricing Opacity and Implementation Burden Limit Mid-Market Fit
            body: >
              OneTrust publishes no list pricing. Vendr data from 325 transactions places median annual contract value
              at approximately $10,514, with mid-market customers typically paying $40,000-$120,000 per year and
              enterprise contracts higher. The consent management module alone starts at approximately $827/month per
              domain. Implementation is typically measured in weeks to months, often requiring paid professional
              services, and user review data from Software Advice, PeerSpot, and Capterra consistently reports steep
              learning curves and inconsistent support quality for smaller accounts. These dynamics effectively limit
              the addressable market to mid-to-large enterprises with dedicated GRC teams.
