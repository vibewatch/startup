          - type: callout
            title: Module Rationalization Pattern and AI Governance Architecture Gap
            body: >
              OneTrust's December 2024 Convercent divestiture is the most concrete signal of a persistent risk: a
              history of acquisitive module expansion (7 acquisitions in 2019-2021) followed by strategic scope
              reduction. Customers who built programs on Convercent face EQS migration with no new feature development
              from OneTrust. Separately, competitor analysis from Modulos AG identifies an architectural gap: OneTrust's
              AI governance shares infrastructure with its privacy and vendor risk modules rather than treating AI
              assets, controls, and evidence as connected first-class objects in a dedicated AI governance graph. This
              matters most for buyers whose primary use case is AI governance rather than a bundled privacy-plus-AI
              program.
            calloutType: risk
