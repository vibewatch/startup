      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Down-Round Overhang and Preference Stack
            body: >-
              OneTrust's $1.13 billion cumulative raise spans multiple valuation marks from $1.3B to $5.3B. Investors
              entering at the $5.3B 2021 mark are currently underwater at the $4.5B last mark and face further dilution
              risk below $4.5B in any stressed scenario. Preference liquidation stacks reduce residual common equity
              value materially in sub- $6B exit scenarios, which must be modeled explicitly before any secondary
              purchase.
            calloutType: risk
            claimRefs:
              - CV010
              - CV011
