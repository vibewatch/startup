      - number: '1.4'
        title: Scale, key metrics, and market position
        blocks:
          - type: paragraph
            body: >-
              OneTrust's publicly available scale data, while incomplete due to private company status, points to a
              mature enterprise software business with deep penetration in large-cap and regulated industries. In May
              2024, the company announced it was on track to surpass $500 million in Annual Recurring Revenue by
              year-end while maintaining positive free cash flow, and affirmed its aspirational target of scaling to $1
              billion in ARR. The company has not published an updated ARR figure for fiscal year 2025 or 2026, leaving
              current revenue visibility dependent on the 2024 announcement.


              As of 2025, OneTrust reports over 14,000 customers globally, with 75 percent of the Fortune 100 on the
              platform. The company also cites more than 73,000 organizations using OneTrust technology in some
              capacity, suggesting a broader ecosystem of free-tier or lightweight users beyond the 14,000 direct
              enterprise customer count. Enterprise concentration is notable: the company disclosed more than 1,200
              customers with ARR exceeding $100,000 each as of May 2024, and a smaller cohort with ARR above $1 million,
              indicating strong mid-market and enterprise seat depth.


              Headcount estimates range widely across secondary sources. LATKA and Unify GTM both place the figure
              around 2,600 employees as of early 2026, while Forbes lists 5,000—likely reflecting an earlier
              pre-restructuring data point. The company's restructuring actions (950 layoffs in June 2022, 200 Planetly
              closures in November 2022, 110 layoffs in March 2026) have materially reduced its workforce from what was
              an estimated 3,800+ peak in early 2022. No audited headcount is publicly available.


              On market position, IDC data from 2020 placed OneTrust with 40.2 percent of the data privacy compliance
              software market, more than three times its nearest competitor. As of 2025, OneTrust retained the leader
              designation in the IDC MarketScape Worldwide GRC Software Vendor Assessment, debuted on the Fortune Future
              50, and achieved its seventh consecutive placement on the Forbes Cloud 100. Competitor dynamics include
              TrustArc (acquired by Main Capital Partners), Securiti (acquired by Veeam/WestCap at $1.7B+), BigID, and
              increasingly Microsoft and ServiceNow expanding into compliance tooling.
            claimRefs:
              - CO022
              - CO023
              - CO024
              - CO025
              - CO036
              - CO037
