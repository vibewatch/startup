            title: Cookie Enforcement Creates Indirect Product Liability Exposure
            body: >-
              The Ashley Furniture class action (March 2026) implicating OneTrust's CMP technology in alleged privacy
              violations is the first major case to name OneTrust's platform as the mechanism of harm. While OneTrust is
              not a named defendant, the litigation trajectory could establish precedent for CMP vendor liability if
              courts find that a compliant-by-default configuration obligation exists. This risk is asymmetric: if
              precedent is set, it applies to every major CMP deployment.
