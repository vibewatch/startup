      - number: '5.3'
        title: Integration Ecosystem, Security Posture, and Adverse Considerations
        blocks:
          - type: paragraph
            body: >
              OneTrust's integration ecosystem offers more than 200 pre-built connectors spanning ServiceNow, Jira,
              Microsoft Purview, Sentinel, AWS, Azure, Google Cloud, Salesforce, Workday, Snowflake, and Databricks,
              plus a full REST API and SDKs for custom integration. The company positions this as "the industry's
              broadest and deepest set of integrations," and the combination of native cloud connectors and AI-platform
              hooks (Bedrock, Azure Foundry, Databricks Unity Catalog, Google Vertex) is a genuine technical strength
              for enterprises running hybrid AI workloads. The platform holds ISO 27001, ISO 27701, SOC 2 Type II, and
              PCI DSS certifications, and supports compliance across 50-plus frameworks including GDPR, CCPA/CPRA, LGPD,
              APPI, PIPEDA, HIPAA, SOC 2, and PCI DSS. Regulatory coverage is backed by DataGuidance, which tracks legal
              change across 300-plus jurisdictions. The platform's consent management module is a Google-certified CMP
              Gold partner supporting IAB TCF 2.3.

              Despite these strengths, the adverse posture on product and technology is notable on several dimensions.
              First, integration complexity: enterprise reviewers on PeerSpot consistently cite DSAR system integration
              as a major pain point, with individual integrations sometimes requiring months to complete. Second, module
              rationalization: the December 2024 divestiture of the Convercent ethics-and-compliance business to EQS
              Group — which serviced over 1,000 customers — illustrates that OneTrust's acquisitive 2019-2021 period
              (DataGuidance, Integris Software, Docuvision, Tugboat Logic, Convercent, Planetly) has been followed by
              deliberate scope reduction. EQS committed to only essential security updates for Convercent through 2025,
              with all new development shifting to the EQS platform, creating a transition burden for Convercent
              customers. Third, AI governance maturity gap: competitor analysis from Modulos AG notes that OneTrust's AI
              Governance is a module within a broader trust platform rather than an AI-native system of record, which
              creates an architectural difference in how AI-specific workflows are centrally wired. Pure-play platforms
              like Modulos and Credo AI use an AI-native governance graph where frameworks, controls, evidence, and AI
              assets are connected objects, whereas OneTrust's AI governance shares infrastructure with privacy and
              vendor risk modules. Fourth, pricing opacity and implementation burden: the platform has no public pricing
              page; Vendr's data from 325 transactions places the median annual contract at approximately $10,514, with
              mid-market customers paying $40,000-$120,000 per year and enterprise contracts exceeding that.
              Implementation is typically measured in weeks to months and frequently requires paid professional
              services. User review data from Software Advice, PeerSpot, and Capterra consistently flags a steep
              learning curve, module inconsistency, and support quality that varies by account size.
            claimRefs:
