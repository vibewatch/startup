      - number: '7.2'
        title: Regulatory and Legal Risks
        blocks:
          - type: paragraph
            body: >-
              OneTrust's entire commercial premise rests on helping enterprises comply with privacy regulations;
              paradoxically, this creates a dependency risk where worsening enforcement implicates OneTrust's own
              technology in customer non-compliance. The CNIL levied €486,839,500 in fines in 2025—including €325M
              against Google and €150M against Shein for cookie consent violations—establishing that data protection
              authorities now hold firms to technical enforcement standards, not just policy commitments. The EDPB's
              Guidelines 2/2023 (finalized October 2024) expanded ePrivacy Article 5(3) obligations to pixels, URL
              tracking, and fingerprinting, meaning any OneTrust-powered consent management platform that fails to
              technically block non-essential trackers before consent is a direct compliance liability for the
              customer—and potentially a reputational and legal risk for OneTrust.


              This risk is no longer theoretical. In March 2026, a California federal class action alleged that Ashley
              Furniture's OneTrust-powered cookie banner continued transmitting browsing data to Google, Pinterest, and
              Bing after users clicked "reject all," alleging wiretapping, invasion of privacy, and deceptive business
              practices. While OneTrust is not a direct defendant, the case names its technology as the mechanism for
              alleged tracking, setting a precedent that CMP vendors may face indirect product liability. The February
              2025 formal withdrawal of the ePrivacy Regulation leaves cookie compliance fragmented across 28 EU member
              states' national transpositions, requiring OneTrust to maintain jurisdiction-specific configuration
              guidance and creating ongoing product update burdens. The EU AI Act's full high-risk AI system enforcement
              begins August 2026, testing whether OneTrust's AI Governance module can support the required conformity
              assessments, technical documentation, and ongoing risk management logs that high-risk system operators
              must maintain. Bird & Bird and O'Melveny legal analyses confirm that this enforcement window is live and
              enforceable without further delay.
            claimRefs:
              - CR010
              - CR011
