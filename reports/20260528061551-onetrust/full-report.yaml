  - id: FU001
    title: Customer Journey Map
    type: journey-map
    layout: wide
    summary: >-
      OneTrust's customer journey typically begins with a regulatory compliance trigger, passes through procurement and
      technical integration, and deepens over time through module expansion and partner-enabled growth.
    data:
      items:
        - label: Regulatory Trigger
          actor: CPO / Legal Counsel / CISO
          touchpoints:
            - GDPR, CCPA, DORA, EU AI Act, or state privacy law enforcement notice
            - Board or executive directive to build a formal privacy program
            - Data breach incident triggering remediation need
          painpoint: >-
            Organization is exposed to regulatory fines, litigation, or operational disruption without a systematic
            privacy and compliance platform.
          opportunity: Urgency-driven buying creates large, committed deal sizes and strong ROI justification from day one.
        - label: Vendor Evaluation
          actor: CPO, IT, Procurement
          touchpoints:
            - RFP process comparing OneTrust, Securiti, TrustArc, BigID, and point solutions
            - G2 and Gartner Peer Insights research; Forrester Wave evaluation
            - Proof of concept with cookie consent or data mapping module
          painpoint: >-
            Implementation complexity, opaque modular pricing, and 6–18 month enterprise sales cycles create evaluation
            friction.
          opportunity: >-
            Forrester Wave 2025 and Gartner recognition validate OneTrust as category leader, reducing competitive risk
            in procurement.
        - label: Initial Deployment
          actor: Compliance Team / IT
          touchpoints:
            - Cookie consent and preference management module go-live
            - Data mapping and DSAR automation integration with CRM/HRIS/DLP
            - Training and onboarding with OneTrust professional services or SI partner
          painpoint: >-
            Implementation timelines of several months to over one year; requires significant internal change management
            and technical resource investment.
          opportunity: SI partners (Deloitte, Accenture, Carahsoft) accelerate complex deployments in regulated verticals.
        - label: Production Operations
          actor: Privacy / Compliance / Risk Teams
          touchpoints:
            - Ongoing GDPR/CCPA compliance automation
            - Data subject request fulfilment, vendor risk assessments, and incident reporting
            - Regulatory intelligence updates and policy template management
          painpoint: >-
            Platform complexity can overwhelm smaller compliance teams; support responsiveness complaints logged on
            Trustpilot and Capterra for non-enterprise customers.
          opportunity: Deep workflow integration creates high switching costs and strong renewal dynamics for enterprise accounts.
        - label: Module Expansion
          actor: CPO, CISO, AI Governance Team
          touchpoints:
            - Expansion from consent management to privacy automation, TPRM, AI governance, ESG
            - Upsell conversation triggered by EU AI Act readiness, third-party vendor incident, or ESG reporting need
            - Cross-module analytics and unified risk dashboard adoption
          painpoint: Cross-module integration within OneTrust is not always seamless; some users flag friction.
          opportunity: Each expansion module deepens integration, increases ARR per account, and further raises switching costs.
        - label: Strategic Partnership
          actor: Procurement / IT / Legal
          touchpoints:
            - Government procurement via Carahsoft; marketplace procurement via Accenture or Deloitte
            - OneTrust Trust Intelligence Platform integration with Microsoft Security Copilot, Azure OpenAI
            - Global rollout to subsidiaries using local language support and regional compliance modules
          painpoint: >-
            Channel mix and partner revenue attribution are undisclosed; enterprise buyers may prefer direct OneTrust
            relationship for SLA accountability.
          opportunity: Partner-channel reach broadens OneTrust's addressable market and lowers direct sales CAC in new geographies.
        - label: Renewal and Churn Decision
          actor: CPO / Procurement / CFO
          touchpoints:
            - Annual or multi-year contract renewal evaluation
            - Competitive review of alternatives; ROI justification to CFO
            - Potential module rationalization if budget pressure increases
          painpoint: >-
            Smaller customers at risk of churn due to poor support experience; auto-renewal friction documented in
            adverse Trustpilot reviews.
          opportunity: >-
            Enterprise accounts ($100K+ ARR) face high operational switching costs, supporting strong gross retention
            even when competitive alternatives exist.
    approximationNotes: >-
      This journey abstracts several observed buying motions into one qualitative path; actual customer flows differ by
      segment, channel, and module entry point.
    claimRefs:
      - CU034
      - CU035
      - CU037
      - CU038
      - CU039
      - CU041
      - CU047
