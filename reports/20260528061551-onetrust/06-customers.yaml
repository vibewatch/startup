  - id: section-named-proof
    title: >-
      Named customer proof and adoption trajectory: production deployments across pharma, insurance, fintech, and APAC
      multinationals confirm real enterprise uptake
    body: >-
      OneTrust's public case study library, third-party customer databases, and partner-published case studies together
      confirm named enterprise production deployments beyond mere logo slides. Boehringer Ingelheim, one of the world's
      largest pharma companies, uses OneTrust for global data protection accountability and transparency across its
      enterprise. Sara Assicurazioni, a major Italian insurer, deployed OneTrust to achieve and maintain compliance with
      the EU's DORA and NIS2 frameworks — among the earliest documented uses of OneTrust for DORA-specific readiness.
      MillerKnoll uses the platform to build a customer-centric privacy program, positioning compliance as a competitive
      differentiator. Mews, a hospitality SaaS company, relies on OneTrust for third-party risk management and
      regulatory compliance. In APAC, Samsung, DHL, and Yum! Brands are confirmed customers deploying consent
      management, data privacy, and governance solutions. CVS Health and McKesson represent healthcare and pharmaceutical
      supply use cases in North America, while UnitedHealth Group and financial services firms including Citigroup round
      out the regulated-enterprise footprint. The most specific published outcome data comes from Indegene's
      partner-delivered engagement for a global biotech company: over 17,000 records loaded at launch through an
      OneTrust consent management deployment integrated with Salesforce, Veeva CRM, and AWS data lakes — a credible
      production-scale metric. The Forrester Wave 2025 recognition as the top-ranked leader in Privacy Management
      Software Current Offering and Strategy, and the 2025 Gartner report recognition for AI governance spanning EU AI
      Act, NIST RMF, and ISO/IEC 42001 compliance, further validate enterprise acceptance. Customer count momentum
      (14,000+ by 2024, on a path toward $1 billion ARR) corroborates broad market acceptance of the platform.
