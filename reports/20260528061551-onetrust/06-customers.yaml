      - Confidence
      - Diligence Ask
    rows:
      - - G2 rating
        - 4.3–4.4 / 5 from 283+ reviews
        - Enterprise and mid-market across all modules
        - High
        - Request G2 breakdown by module, company size, and recent cohort to identify satisfaction decay patterns
      - - Capterra rating
        - 4.0+ / 5 (verified reviews)
        - Cross-segment; skews toward compliance and privacy teams
        - Medium
        - Request breakdown by implementation complexity rating; compare pre-vs-post support change
      - - Trustpilot rating
        - 1.5 / 5 from 30 reviewers
        - Likely skewed toward SMB or self-serve customers with negative experiences
        - Low (small sample, adverse-skewed)
        - Request OneTrust's own CSAT and NPS metrics for enterprise tier; cross-reference support ticket resolution
      - - NRR (net revenue retention)
        - Not publicly disclosed; estimated ≥110% historically by analysts
        - Enterprise accounts ($100K+ ARR)
        - Low (estimated only)
        - Require NRR, GRR, and logo churn disclosure in due diligence; segment by module and cohort vintage
      - - GRR (gross revenue retention)
        - Not disclosed
        - All segments
        - Low (not available)
        - Require GRR by segment; cross-reference with Trustpilot adverse signals for SMB-tier churn
      - - Implementation timeline
        - Several months to over one year for full enterprise deployment
        - Enterprise (multi-module)
        - Medium
        - Confirm median time-to-value and time-to-expand-module in customer success data; flag if >18 months typical
      - - Enterprise sales cycle
        - 6–18 months from initial evaluation to go-live
        - Large enterprise ($100K+ ACV)
        - Medium
        - Verify with win rate, deal velocity data; longer cycles correlate with higher CAC but stronger LTV
    notes: >-
      NRR and GRR are not publicly disclosed by OneTrust; estimates are derived from analyst commentary and SaaS
      enterprise benchmarks for GRC-category companies. Trustpilot sample (30 reviews) is small and likely biased
      toward dissatisfied customers; G2 (283+ reviews) is more representative of the enterprise and mid-market base.
