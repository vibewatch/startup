  - id: section-channel-concentration
    title: >-
      Channel partners, international footprint, and concentration risk: a three-tier partner program and 12-office
      global network support expansion, but revenue concentration and SMB churn are unresolved
    body: >-
      OneTrust's go-to-market distribution extends beyond direct enterprise sales through a structured three-tier
      partner program — Authorized, Certified, and Trusted — serving value-added resellers, system integrators,
      managed service providers, technology partners, and ISVs. Named SI and consulting partners include Deloitte,
      Accenture, Capco, and Crowe LLP, which drive complex, multi-module enterprise deployments. Carahsoft is the
      designated government channel partner, making OneTrust accessible through US federal and state procurement
      vehicles and enabling deployments in agencies such as the Department of Homeland Security and city-level public
      sector organizations. The international footprint spans 12+ global offices as of January 2025 — Atlanta (HQ),
      London, Paris, Munich, Amsterdam, Madrid (opened November 2024), Singapore (opened January 2025), Melbourne,
      Bengaluru, Toronto, Chicago, New York, and San Francisco. APAC expansion is a stated priority, with the APAC
      team expected to grow to 500+ employees in 2025 across Singapore, Bengaluru, and Melbourne, serving customers
      like Samsung, DHL, and Yum! Brands. From a concentration risk standpoint, the publicly disclosed 1,200+ accounts
      each exceeding $100,000 in ARR represent a disproportionately large share of total revenue from a relatively
      small customer count — a pattern that is typical for enterprise SaaS but creates exposure if a cohort of large
      customers were to reduce spend or switch. No single-customer revenue concentration data is public. The channel
      partner mix and the percentage of ARR sourced through partners versus direct sales are also undisclosed. The
      land-and-expand motion is supported by OneTrust's modular architecture, which allows customers to start with
      a consent management or cookie compliance module and then expand into privacy automation, TPRM, AI governance,
      ethics, and ESG as their programs mature — each expansion phase deepening integration and switching costs further.
