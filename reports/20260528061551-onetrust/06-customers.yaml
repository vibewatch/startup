          detail: >-
            Subset with active compliance initiative, budget allocated, and vendor evaluation in progress;
            includes OneTrust competitors (Securiti, TrustArc, BigID, OneTrust). Estimated.
        - label: OneTrust total active customers
          value: 14000
          unit: customers
          detail: >-
            14,000+ as stated in OneTrust official press releases and product marketing as of late 2024 / early 2025.
            Company-claimed; not independently audited.
        - label: OneTrust enterprise customers ($100K+ ARR)
          value: 1200
          unit: customers
          detail: >-
            1,200+ customers each contributing $100,000+ in annual recurring revenue; disclosed via third-party
            financial intelligence sources and corroborated by press release references.
        - label: OneTrust Fortune 500 customers
          value: 250
          unit: estimated customers
          detail: >-
            >50% of Fortune 500 = approximately 250+ Fortune 500 companies; exact count not disclosed. Company-claimed.
        - label: OneTrust multi-module expansion customers
          value: 600
          unit: estimated customers
          detail: >-
            Estimated half of $100K+ ARR customers deploy multiple modules (privacy + TPRM or AI governance);
            no public data; estimate based on platform architecture and land-and-expand pattern described in press
            releases.
