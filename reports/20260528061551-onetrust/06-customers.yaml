  - id: TU005
    title: Expansion and Concentration Risk Table
    columns:
      - Expansion Driver
      - Concentration Risk
      - Impact
      - Diligence Path
    rows:
      - - Modular cross-sell (consent → privacy → TPRM → AI governance → GRC)
        - Fortune 500 ARR concentration in top 100–200 accounts
        - Positive expansion economics; each new module deepens switching cost and increases ARR per account
        - Require top-10 and top-25 customer ARR concentration as a share of total; request cohort expansion rates
      - - Partner-channel leverage (Deloitte, Accenture, Carahsoft, SIs)
        - Channel dependency risk if key SIs reduce commitment or shift to competitors
        - Partners drive complex, high-ACV deployments and implementation credibility in regulated verticals
        - Require partner-sourced vs. direct ARR split; assess SI exclusivity and competitive relationship
      - - Geographic expansion (APAC, EMEA Madrid, emerging markets)
        - US revenue concentration; APAC and EMEA may face longer sales cycles and local-language compliance gaps
        - APAC team to 500+ employees; Singapore as APAC hub; Madrid for southern Europe
        - Require APAC and EMEA ARR share; track Singapore office ramp; assess local-language support maturity
      - - Land-and-expand via regulatory tailwinds (GDPR, DORA, EU AI Act, US state laws)
        - Risk of regulatory consolidation or commoditization reducing per-module pricing power
        - Each new regulation creates a new entry point for OneTrust; EU AI Act and DORA are current growth drivers
        - Monitor competitive pricing responses; assess whether new modules command premium or are bundled at discount
      - - SMB / mid-market (CookiePro, self-serve consent module)
        - Higher churn risk; SMB segment generates adverse reviews and support load disproportionate to revenue
        - Broadens customer count and top-of-funnel; enables upsell to full platform over time
        - Require SMB segment NRR and logo churn separately from enterprise tier; assess self-serve profitability
    notes: >-
      Concentration risk estimates are based on the disclosed 1,200+ accounts at $100K+ ARR out of 14,000+ total
      customers; actual top-account revenue concentration is unknown. Channel partner ARR mix is not publicly disclosed.
