chapter:
  number: 6
  title: Customers
  summary: >-
    OneTrust serves more than 14,000 customers in over 100 countries, including more than half of the Fortune 500, with
    ARR surpassing $500 million in 2024. The enterprise customer base is deeply embedded in regulated verticals —
    financial services, healthcare, pharmaceuticals, government, and technology — and anchored by high switching costs
    driven by multi-module integration, process entrenchment, and compliance workflow dependencies. Named case studies
    (Boehringer Ingelheim, Sara Assicurazioni, MillerKnoll, Mews, Samsung, DHL) show production deployments across
    privacy, third-party risk, and AI governance. However, key retention metrics (NRR, GRR, churn by cohort) are
    undisclosed, Trustpilot reviews surface adverse renewal and support experiences among smaller customers, and
    channel partner revenue mix is opaque.
sections:
  - id: section-segmentation
    title: >-
      Customer segments: OneTrust serves global enterprises across regulated verticals with the Fortune 500 as its
      anchor cohort
    body: >-
      OneTrust's customer base spans more than 14,000 organizations in over 100 countries, with the Fortune 500 serving
      as its most visible anchor cohort — over half of the Fortune 500 are customers. The dominant buying segments are
      large enterprises with complex, multi-jurisdictional privacy and compliance obligations: global technology
      companies, financial services firms navigating DORA and CCPA, healthcare and pharmaceutical companies managing
      HIPAA and clinical data consent, government agencies requiring FedRAMP-adjacent posture, and multinational
      manufacturers with GDPR obligations across European subsidiaries. Within these verticals, buyer personas range
      from Chief Privacy Officers and Chief Information Security Officers who own platform selection, to legal and
      compliance teams who operationalize data subject requests, to IT and DevOps teams who integrate OneTrust APIs
      with enterprise data platforms. The geographic mix skews toward the United States, which has the highest customer
      concentration of any single country, followed by EMEA where GDPR enforcement intensity makes the value
      proposition compelling. Manufacturing, business services, and retail are among the top sectors in terms of raw
      customer count. Mid-market and SMB buyers also exist, primarily via the CookiePro consent-management module, but
      the high ARR concentration (1,200+ customers each exceeding $100,000 in ARR) confirms that enterprise accounts
      define the revenue story. OneTrust's overall customer count trajectory — growing from a few thousand in 2021 to
      14,000+ by late 2024 — reflects strong top-of-funnel pull from regulatory tailwinds and expanding use-case
      breadth from privacy automation into AI governance and ESG reporting.
