callouts:
  - calloutType: strength
    title: Fortune 500 anchor and regulatory tailwind create durable demand
    body: >-
      OneTrust's penetration of more than half the Fortune 500 and its 14,000+ global customer base give it
      significant reference-selling power. Each new privacy regulation (DORA, EU AI Act, US state laws) expands
      the addressable buyer universe and creates urgency-driven demand from existing and prospective customers.
      The modular architecture supports ongoing upsell from consent management into TPRM, AI governance, and ESG
      without requiring a re-buy decision.
    claimRefs:
      - CU001
      - CU002
      - CU018
      - CU038
  - calloutType: risk
    title: Trustpilot adverse reviews and undisclosed retention metrics are diligence blockers
    body: >-
      The 1.5/5 Trustpilot rating, while small-sample and likely SMB-skewed, reflects documented auto-renewal
      disputes, support access failures, and cookie banner technical issues. Combined with OneTrust's refusal to
      disclose NRR, GRR, or churn by segment, diligence cannot confirm whether enterprise gross retention supports
      the platform's premium valuation. SMB churn risk, if it spreads into the mid-market, could materially erode
      customer count growth even as ARR per enterprise account grows.
    claimRefs:
      - CU023
      - CU036
      - CU041
      - CU043
  - calloutType: insight
    title: High switching costs and partner-channel depth create compounding retention moats
    body: >-
      OneTrust's 200+ pre-built integrations and multi-module compliance workflow entrenchment mean that switching
      costs grow non-linearly with deployment depth. An enterprise customer running consent management, DSAR
      automation, vendor risk assessments, and AI governance across a global HRIS and CRM integration faces not
      just a software replacement but a regulatory-risk window and full re-implementation. The three-tier partner
      program (Authorized, Certified, Trusted) deepens this moat by adding SI partner relationships that further
      increase switching friction.
    claimRefs:
      - CU034
      - CU035
      - CU038
      - CU040
      - CU026
