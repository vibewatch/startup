  "chapter": {
    "number": 1,
    "title": "Company Overview",
    "summary": "OneTrust is an Atlanta-based private SaaS company that has established dominant market share in enterprise privacy, governance, risk, and compliance (GRC) software. Founded in 2016 by Kabir Barday in direct response to the GDPR regulatory wave, it raised approximately $1.13 billion across seven funding rounds and reached a $5.3 billion peak valuation in April 2021 before accepting a $4.5 billion down round in mid-2023. As of May 2026, the company has completed a CEO transition (Barday replaced by John Heyman in February 2026), executed a second workforce reduction (~110 employees), and is repositioning as an AI-Ready Governance Platform with $500M+ ARR and over 14,000 enterprise customers, while unresolved private equity sale discussions add exit-path uncertainty."
  },
