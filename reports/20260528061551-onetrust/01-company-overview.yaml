    {
      "id": "milestones-and-adverse-events",
      "title": "Milestones, adverse events, and corporate trajectory",
      "body": "OneTrust's corporate history spans four distinct phases: an aggressive early-growth phase (2016–2021), a correction and restructuring phase (2022–2023), a stabilization and strategic repositioning phase (2024–2025), and a leadership and ownership transition phase beginning in early 2026. The founding catalyst was the imminent enforcement of GDPR in 2018, which created immediate enterprise demand for privacy compliance tools that did not yet exist at scale.\n\nThe acquisition strategy in 2019–2021 was ambitious: DataGuidance (regulatory intelligence) in March 2019, Integris Software (data discovery) in June 2020, and then four simultaneous acquisitions in April 2021—Docuvision (AI redaction), Tugboat Logic (security compliance automation), Convercent (ethics and whistleblowing), and Planetly (carbon tracking). These expanded the platform from privacy into a broader GRC and ESG proposition. Planetly and Convercent proved to be the most consequential: Planetly was closed in November 2022 with all ~200 employees let go just eighteen months after acquisition, while Convercent was eventually divested to EQS Group in late 2024 with Goldman Sachs advising OneTrust.\n\nThe June 2022 layoff of 950 employees—25 percent of the workforce—was the most significant adverse event in company history prior to 2026. CEO Barday described capital markets sentiment as having shifted away from growth-at-all-costs toward profitability, and the announcement came against a backdrop of record-high revenues and customer demand, causing sharp public criticism. The March 2026 layoff of approximately 110 employees was framed as a restructuring toward AI-powered automation, targeting customer support, sales development, and administrative functions, with engineering largely intact.\n\nIn 2025, OneTrust pivoted heavily toward AI governance. It launched the Privacy Breach Response Agent built with Microsoft Security Copilot, deepened its Azure OpenAI integration for automated AI lifecycle governance, and unveiled privacy and risk agents that automate compliance assessments from weeks to minutes. March 2026 brought a formal 'AI-Ready Governance Platform' brand repositioning. These product moves are consistent with the incoming CEO Heyman's stated focus on AI governance as a once-in-a-generation infrastructure opportunity.",
