  evidenceGaps:
    - type: stale
      severity: material
      topic: OneTrust ARR 2026
      missingEvidence: >-
        OneTrust's current ARR, revenue growth rate, and customer count as of 2026 from an independent
        source (not company press release); the most recent disclosed ARR data point is from TrustWeek 2024.
      whyItMatters: >-
        Without a 2026 ARR data point, market penetration calculations and SAM/SOM estimates are based on
        two-year-old data, potentially overstating or understating OneTrust's current position.
      diligencePath: >-
        Request audited revenue figures or management accounts from OneTrust; cross-check with PitchBook,
        CB Insights, or GetLatka estimates updated for 2026; request customer count from IAPP member survey.
      relatedQuestionRefs: [QM016]

    - type: missing-source
      severity: material
      topic: CMP market sizing methodology
      missingEvidence: >-
        Full methodology disclosure from Business Research Insights and Research and Markets explaining why
        their 2026 CMP estimates differ by a factor of 2.15× ($2.43B vs. $1.13B), including segment definitions,
        survey frame, and vendor revenue coverage.
      whyItMatters: >-
        The spread renders TAM comparisons between any two investor decks that cite different analyst sources
        unreliable; definitional clarity is required for defensible SAM modeling.
      diligencePath: >-
        Obtain full report methodology sections from both analysts; or commission a custom sizing study
        with explicit boundary definitions aligned to OneTrust's actual product portfolio.
      relatedQuestionRefs: [QM021]

    - type: private-evidence-only
      severity: material
      topic: OneTrust win rate and churn data
      missingEvidence: >-
        OneTrust's net revenue retention rate, gross revenue retention, and new logo win rate against
        named competitors by deal size band; none of these metrics are publicly disclosed.
      whyItMatters: >-
        NRR and churn are the most direct indicators of whether compliance fatigue and platform complexity
        are materially impacting revenue quality; absence makes valuation stress-testing impossible.
      diligencePath: >-
        Request management accounts including NRR by cohort, churn analysis by product breadth, and
        win/loss analysis against BigID, TrustArc, and Didomi from OneTrust investor relations.
      relatedQuestionRefs: [QM012, QM013]

    - type: enumeration-incomplete
      severity: minor
      topic: APAC regulatory revenue contribution
      missingEvidence: >-
        OneTrust's disclosed revenue breakdown by geography, specifically what percentage of ARR comes
        from Asia-Pacific where India DPDP Act and China PIPL are driving new demand.
      whyItMatters: >-
        APAC is projected to be the fastest-growing sub-region (27.2% CAGR) but OneTrust's exposure
        to this growth cannot be confirmed without geographic revenue data.
      diligencePath: >-
        Track APAC office hiring velocity and enterprise customer press releases in India, Singapore,
        and ANZ; request geographic ARR breakdown from management.
      relatedTableRefs: [TM003]
