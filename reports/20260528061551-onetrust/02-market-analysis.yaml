callouts:
  - calloutType: insight
    title: Analyst Estimate Spread Exceeds 2× for Consent Management — Definitional Risk for TAM Claims
    body: >-
      The 2026 consent management platform market estimate ranges from $1.13B (Research and Markets) to
      $2.43B (Business Research Insights)—a 2.2× spread for the same year. This disagreement is not a
      data quality failure; it reflects fundamental definitional divergence on whether the CMP is a
      standalone cookie-consent tool or the full consent orchestration layer within a privacy platform.
      Any single-estimate TAM citation for OneTrust's pitch materials should be treated as advocacy, not
      analysis. Investors should weight the methodology-disclosed, narrower estimate and apply a haircut
      for definitional inflation.
    claimRefs:
      - CM005
      - CM026

  - calloutType: risk
    title: EU AI Act August 2026 Deadline Creates Both Demand Spike and Execution Risk
    body: >-
      The EU AI Act's full applicability in August 2026 is simultaneously the most significant near-term
      demand catalyst for OneTrust's AI governance product and a source of execution risk: organizations
      rushing to comply may adopt minimal solutions that satisfy the immediate regulatory checkpoint without
      committing to a multi-year platform contract. Demand spikes tied to regulatory deadlines historically
      produce elevated churn in the 12–18 months following compliance-date closures as buyers rationalize
      emergency purchases.
    claimRefs:
      - CM015
      - CM028
      - CM040

  - calloutType: risk
    title: Compliance Fatigue and Platform Complexity Constrain Expansion Revenue
    body: >-
      Mid-market customers and some enterprise accounts report compliance fatigue from overlapping multi-
      jurisdiction mandates and "integration tax" from OneTrust's acquisition-heavy module stack. This is
      the primary structural constraint on NRR expansion in existing accounts and the main driver of
      competitive displacement by lighter-weight specialists in deals under $50K ACV.
    claimRefs:
      - CM022
      - CM024
      - CM025

