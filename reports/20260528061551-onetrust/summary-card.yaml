  topStrengths:
    - >-
      Category-defining trust platform with 14,000+ enterprise customers including 75% of Fortune 100 across 200+
      countries.
    - Regulatory tailwind from GDPR, CCPA, EU AI Act, and proliferating data privacy laws provides durable demand.
    - >-
      Expanding AI Governance Cloud (March 2026 real-time enforcement expansion) positions OneTrust ahead of the EU AI
      Act compliance deadline in August 2026.
    - >-
      $1.13B raised with demonstrated capital efficiency — reported 10–20% QoQ ARR growth and recent profitability
      indicators through late 2024.
    - >-
      300+ active patents and 70,000+ pre-scored vendors in Third-Party Risk Exchange create meaningful switching costs
      and data network effects.
  topRisks:
    - >-
      PE acquisition at $10B+ with significant leverage could materially constrain R&D investment and support quality,
      creating thesis-altering ownership risk.
    - >-
      CEO transition (Barday → Heyman in February 2026) introduces cultural and strategic execution risk at a critical
      growth inflection.
    - >-
      Undisclosed financial profile (no audited ARR, NRR, gross margin, or EBITDA) prevents verification of
      profitability and growth claims.
    - >-
      EU AI Act product gaps in automated bias auditing and Annex III conformity assessment create competitive exposure
      to pure-play AI governance platforms.
    - >-
      Cookie class-action precedent (e.g., Fricker v. Ashley Furniture, March 2026) extending to vendor liability could
      create oneTrust customer-facing legal risk.
  unresolvedGaps:
    - >-
      Audited financial statements covering FY2023–FY2025 ARR, revenue growth rate, gross margin, EBITDA, and operating
      cash flow.
    - Net Revenue Retention (NRR) — confirmation of ≥110% threshold for a strong-buy case.
    - PE acquisition process timeline, structure, leverage ratio, and acquirer identity.
    - Cap table post-July 2023 down-round with preference stack waterfall in below-$4B exit scenarios.
    - >-
      Production-scale customer references for Data Use Governance (query-level enforcement, currently in private
      preview).
