chapter:
  number: 8
  title: Valuation
  summary: >-
    OneTrust carries a last-marked valuation of $4.5 billion (July 2023 down round) against
    confirmed ARR of $550 million and positive free cash flow as of 2025, implying an 8.2x
    ARR multiple at last mark—stretched versus the 4–7x public GRC/privacy SaaS median but
    defensible if the company sustains 15–25% ARR growth and achieves a PE buyout at the
    rumored $10 billion figure. Multiple compression from peak $5.3 billion (2021) and
    leadership transition to John Heyman (February 2026) introduce near-term uncertainty.
    The overall investment stance is track: the thesis is attractive at the right price but
    the current mark is not independently verified, exit optionality is PE-dependent, and
    key financial metrics (NRR, gross margin, EBITDA) remain undisclosed.

sections:
  - id: investment-thesis
    title: Investment Thesis and Anti-Thesis
    body: >-
      OneTrust's bull case rests on three interlocking pillars. First, it commands an
      estimated 42.7% share of the GRC/privacy software category (6sense, 2026) and serves
      75% of the Fortune 100, a network-effect moat that is exceptionally difficult for
      point-solution competitors to dislodge. Second, the regulatory tailwind is
      structurally durable: 300+ global privacy jurisdictions mandate ongoing compliance
      spend, and AI governance requirements are layering an additional demand curve on top
      of existing privacy and GRC workflows. Third, OneTrust reached positive free cash flow
      while scaling to $550 million ARR—a rarity among late-stage SaaS companies—signaling
      that the 2022 workforce restructuring achieved the intended operating discipline.

      The anti-thesis centres on valuation uncertainty and execution risk. The $4.5 billion
      last-round mark (July 2023) was itself a 15% down round from the $5.3 billion 2021
      peak, and no new primary round has been confirmed since. The rumored $10 billion PE
      buyout target represents a 2.2× uplift from the last mark at a time when public GRC
      comps (Varonis: 4–5x EV/revenue) trade at a meaningful discount to that implied
      multiple. Revenue growth decelerated to approximately 8% YoY in 2023–2024 (from $464M
      to $500M ARR), though 2025 momentum improved toward $550M. NRR, gross margin, and
      EBITDA are not publicly disclosed, making independent corroboration of quality
      impossible. The February 2026 CEO transition to John Heyman—while experienced—injects
      short-term leadership continuity risk into an already complex PE exploration process.
      Finally, the carve-out of the Ethics & Compliance business to EQS Group in December
      2024 narrows the platform scope and may have reduced addressable cross-sell paths.
    claimRefs:
      - CV001
      - CV002
      - CV003
