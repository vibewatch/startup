      - TV007

callouts:
  - calloutType: risk
    title: Down-Round Overhang and Preference Stack
    body: >-
      OneTrust's $1.13 billion cumulative raise spans multiple valuation marks from $1.3B
      to $5.3B. Investors entering at the $5.3B 2021 mark are currently underwater at the
      $4.5B last mark and face further dilution risk below $4.5B in any stressed scenario.
      Preference liquidation stacks reduce residual common equity value materially in sub-
      $6B exit scenarios, which must be modeled explicitly before any secondary purchase.
    claimRefs:
      - CV010
      - CV011
      - CV015

  - calloutType: insight
    title: PE Buyout Could Reset Category Pricing
    body: >-
      If a PE buyout closes at or above $10 billion, it would set a new pricing benchmark
      for category-leading privacy and GRC SaaS, validating 15–18x ARR multiples for
      dominant, cash-flow-positive platforms. This would reprice comparable assets including
      BigID, TrustArc, and LogicGate and potentially trigger a wave of follow-on PE activity
      in the compliance software sector.
    claimRefs:
      - CV013
      - CV014
      - CV022

  - calloutType: recommendation
    title: Track; Do Not Act Without Confirmed Financials
    body: >-
      New capital should not be deployed into OneTrust secondary or a co-invest without
      first validating NRR, gross margin, and EBITDA margin from audited or management-
      attested sources. The strategic asset quality is high, but the combination of
      undisclosed financials, preference overhang, leadership transition, and binary PE
      exit dependency means the risk-adjusted entry point has not been established.
    claimRefs:
      - CV024
      - CV025
      - CV027

