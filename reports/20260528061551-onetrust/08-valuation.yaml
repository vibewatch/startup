  - id: valuation-context
    title: Current Valuation Context and Financing History
    body: >-
      OneTrust has raised $1.13 billion across seven rounds since its 2016 founding, reaching
      a $5.3 billion peak valuation in April 2021 before the 2023 down round to $4.5 billion.
      The capital structure carries significant preference overhang: Insight Partners (Series
      A lead), Coatue, TCV, SoftBank Vision Fund, and Generation Investment Management all
      hold preferred shares with liquidation preferences that reduce common equity value in
      sub-premium exit scenarios. No secondary market price has been disclosed officially,
      though private secondary platforms (Notice.co) have cited implied values consistent with
      the $4.5 billion mark.

      As of May 2026, no new primary round has been announced, and the company is actively
      exploring PE buyout options. Suitors reportedly in discussions include KKR, Blackstone,
      Vista Equity Partners, Thoma Bravo, Silver Lake, Hellman & Friedman, and Marlin
      Equity. Rumored deal valuations exceed $10 billion—roughly 18x the $550 million 2025
      ARR—which would represent a premium to software sector norms but is consistent with
      strategic PE pricing for category-leading, cash-flow-positive GRC platforms. The
      December 2024 carve-out of the Ethics & Compliance division (including Convercent) to
      EQS Group (Thoma Bravo portfolio) was facilitated by Goldman Sachs and signaled
      active balance-sheet management ahead of a broader transaction. No IPO filing (S-1)
      has been submitted, and IPO tracking sources as of May 2026 confirm no confidential
      filing is known.

      The current implied ARR multiple at the $4.5 billion last mark is 8.2x (using $550M
      2025 ARR). If a PE buyout occurs at $10 billion, the implied multiple rises to 18.2x
      ARR—far above the 4–7x public GRC/privacy SaaS median, justified only if the buyer
      underwrites sustained 20%+ ARR growth and material EBITDA expansion via operational
      leverage post-close. At the last official $4.5 billion mark, the valuation looks
      stretched relative to Varonis (4–5x EV/revenue, ~13% growth) and BigID (3.5x implied
      secondary, 32% growth) but within the range paid in premium PE-take-private
      transactions for mission-critical SaaS with strategic pricing power.
