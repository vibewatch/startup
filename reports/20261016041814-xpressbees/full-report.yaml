chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating scope
        blocks:
          - type: paragraph
            body: >-
              Retained public sources consistently place XpressBees in Pune and date the company to 2015, with the
              business framed as a privately held logistics provider that emerged from serving FirstCry and then
              broadened into a standalone, multi-product platform. The company-controlled surfaces reviewed here all
              market the same core operating stack: express parcel delivery, reverse logistics, B2B movement,
              warehousing or fulfilment, and cross-border services. The more important diligence caveat is not whether
              XpressBees has scale, but that current company pages describe that scale using different counters and
              scopes, so the chapter treats network breadth as directionally strong while leaving some cover metrics
              unresolved instead of normalizing them into a false precision.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
