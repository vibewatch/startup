      - number: '1.2'
        title: Leadership and governance visibility
        blocks:
          - type: paragraph
            body: >-
              Leadership visibility is strongest on company-owned pages rather than on independent governance
              disclosures. Amitava Saha remains the central operator and the about-us page still presents his FirstCry
              and BrainVisa background as the founder-market-fit anchor. The same retained evidence also shows a fresher
              operating leadership layer, including Mohit Sardana as CEO for the B2C business and named leaders across
              HR, B2B, 3PL, cross-border, engineering, and line-haul functions. What is visible, however, is
              management-heavy rather than board-heavy: the retained public pages enumerate executives but do not
              provide a board roster, committee structure, or other governance detail that a late-stage investor would
              want before treating leadership oversight as fully diligenced.
