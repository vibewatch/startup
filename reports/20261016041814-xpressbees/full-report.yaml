      - number: '4.2'
        title: Public traction and unit economics
        blocks:
          - type: paragraph
            body: >-
              Public traction signals are real but uneven. Inc42 lists FY25 revenue above INR 2,348 crore, while
              Multiples ties the last priced round to roughly $271 million of revenue and a 5.2x revenue multiple in
              November 2023. Official pages also emphasize network breadth, same-day and next-day coverage, fulfilment
              infrastructure, and millions of daily shipments, which all support scale. Even so, these are topline and
              operations snapshots, not decision-grade unit economics. No retained source discloses CAC, payback,
              contribution margin per shipment, customer concentration, reverse-logistics loss rates, or segment-level
              gross margin. The chapter can therefore frame scale and monetization mechanics, but it cannot validate
              whether growth is creating durable operating leverage.
