              - CU014
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Breadth is better evidenced than depth
            body: >-
              The assigned pool supports broad service-line and network coverage, but most fresh adoption evidence is
              company-issued rather than independently verified named customer proof.
            calloutType: insight
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU012
              - CU014
          - type: callout
            title: Durability and concentration remain open
            body: >-
              No retained source discloses renewal rates, churn, contract length, or top-customer share, so customer
              durability and concentration should be treated as unresolved diligence items rather than assumed
              strengths.
            calloutType: risk
            claimRefs:
