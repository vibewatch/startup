      - number: '4.3'
        title: Capital needs and profitability
        blocks:
          - type: paragraph
            body: >-
              Capital adequacy remains the core underwriting gap. Independent sources still anchor the latest clearly
              disclosed private valuation around $1.4 billion and the latest completed funding around the November 2023
              Series G. That means current liquidity has to be inferred from operating results and network-expansion
              posture rather than a newly documented raise. The adverse signal is that one recent independent article
              reports FY24 net loss of INR 199.9 crore on operating revenue of INR 2,831.3 crore and explicitly
              attributes the shortfall to expansion, operating costs, and competitive pressure. Combined with
              management’s own emphasis on national coverage, fulfilment density, and capital efficiency, the most
              plausible picture is a business still investing heavily in scale without publicly proving self-funded
              growth.
            claimRefs:
              - CI008
              - CI009
              - CI011
              - CI012
              - CI013
              - CI014
      - number: '4.4'
        title: Financial verdict
        blocks:
          - type: paragraph
            body: >-
              Financially, XpressBees looks like a scaled logistics network with credible demand-side relevance but
              incomplete underwriting visibility. The evidence supports a broad service mix and meaningful operating
              footprint, yet the public record still leans on valuation snapshots, company capability claims, and
              selective loss disclosures instead of current cash, debt, or segment-margin transparency. That makes the
              business analyzable at the revenue-model level but not fully diligenced on margin path or runway. For
              investment work, the next gating materials are straightforward: audited FY25/FY26 statements, current cash
              and debt, revenue concentration by customer and service line, and true per-shipment economics after
              returns, COD, and support costs.
            claimRefs:
              - CI015
              - CI016
