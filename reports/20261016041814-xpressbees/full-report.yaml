  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization
        blocks:
          - type: paragraph
            body: >-
              The retained evidence points to XpressBees as a multi-line logistics operator rather than a single-product
              software business. Third-party and company materials consistently describe B2C delivery, B2B logistics,
              cross-border shipping, reverse logistics, 3PL, warehousing, and fulfilment as the commercial building
              blocks. That supports a revenue base tied to shipment volume, fulfilment throughput, and service
              complexity. What remains missing is the pricing layer: the public pages describe capabilities, COD
              handling, tracking, and integrations, but they do not disclose list rate cards, enterprise contract
              structure, discounting, or revenue-recognition nuances by service line. Revenue quality is therefore
              directionally understandable, but realized pricing power is not externally underwritten.
