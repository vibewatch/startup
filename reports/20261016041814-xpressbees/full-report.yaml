        title: Exhibits
        blocks:
          - type: callout
            title: Breadth, not disclosed price leadership, is the visible moat
            body: >-
              The retained public evidence consistently supports XpressBees as a broad, multimodal logistics bundle, but
              it does not support a transparent claim that the company wins on lowest public price.
            calloutType: insight
            claimRefs:
              - CP001
              - CP009
              - CP011
              - CP015
          - type: callout
            title: Direct peers can still compress margins
            body: >-
              Independent sources show direct rivals raising rates, raising capital, and expanding adjacencies, which is
