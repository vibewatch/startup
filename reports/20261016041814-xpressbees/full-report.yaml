      - number: '3.4'
        title: Durability is constrained by active peer funding and in-house logistics risk
        blocks:
          - type: paragraph
            body: >-
              The moat case is therefore real but conditional. XpressBees has evidence-backed coverage, modality, and

              integration breadth, yet the same sources also show that the market remains contested and vulnerable to

              commoditization. ET says Shadowfax was preparing for an IPO after fresh funding and that Ecom Express
              planned a

              rights issue and quick-commerce expansion, while Netfigo says platform consolidation, Amazon's in-house
              network,

              and rate pressure hurt the same economics that pressured Ecom Express. In other words, XpressBees appears
              better

              hedged than an e-commerce-only carrier, but the assigned pool does not support a claim that it has escaped
              price

              competition or platform dependency.
            claimRefs:
              - CP012
              - CP013
              - CP015
