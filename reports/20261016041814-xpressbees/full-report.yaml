      - number: '3.3'
        title: Pricing pressure is visible, but transparent rival rate cards are not
        blocks:
          - type: paragraph
            body: >-
              Public pricing evidence is thin and mostly indirect. Netfigo says XpressBees charges per-shipment fees,
              while ET

              reports that Delhivery, Ecom Express, and Xpressbees simultaneously raised shipment prices for aggregators
              by

              35-40%, indicating active channel conflict and some sector price discipline. Official XpressBees pages
              repeatedly

              market the company as cost-effective, but they do not publish list prices or realized economics. That
              leaves a

              practical diligence gap: the retained evidence supports bundle breadth and service quality claims more
              clearly than

              it supports a price-led moat or a fully comparable pricing matrix across direct peers.
