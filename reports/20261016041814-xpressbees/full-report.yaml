              - CU008
              - CU012
              - CU013
      - number: '6.3'
        title: Durability, expansion, and concentration risk
        blocks:
          - type: paragraph
            body: >-
              Durability is the weakest part of the current customer evidence set. OrangeOwl's profile is useful because
              it preserves the historical arc from FirstCry-internal logistics to third-party sales, and it explicitly
              says the company had to earn trust beyond that founding customer because prospective clients questioned
              why they should choose XpressBees over larger incumbents. The same article argues that relationship-
              driven selling and tailored logistics packages helped build repeat business, but it does not disclose
              renewal rates, contract terms, or segment-level churn. Across the retained pool, FirstCry is the only
              clearly named historical customer proof; newer official materials broaden the service map but do not name
              live production customers or quantify top-customer exposure. That leaves customer concentration,
              retention, and true land-and-expand durability as material open diligence items rather than verified
              strengths.
            claimRefs:
              - CU001
              - CU010
              - CU011
              - CU014
          - type: table
