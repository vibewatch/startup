      - number: '1.3'
        title: Capital history and stakeholder map
        blocks:
          - type: paragraph
            body: >-
              The cleanest external financing anchor in the retained pool is still November 2023, when Multiples and
              Economic Times both tie XpressBees to an $80 million Series G associated with Teachers’ Venture Growth at
              a $1.4 billion valuation. Earlier external markers show the company reaching unicorn status in February
              2022 and then supporting a Khazanah-led secondary in April 2023 before the later Series G. Public investor
              naming is broad enough to establish a deep institutional cap table, but not precise enough to establish
              current ownership, governance rights, or dilution by holder. That uncertainty matters because even the
              cumulative funding total is not reconciled across retained sources, so capital history is directionally
              strong but still needs management-grade confirmation for a cover metric.
            claimRefs:
              - CO006
