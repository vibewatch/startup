companyProfile:
  summary: >-
    XpressBees is a Pune-based logistics platform founded in 2015 that now spans express parcel delivery, reverse
    logistics, B2B logistics, warehousing, fulfilment, and cross-border shipping. Public sources show a business with
    meaningful network scale and revenue traction, but the company still leaves current cash, debt, runway, and
    reconciled lifetime capital opaque enough that late-stage underwriting depends on stale valuation markers and
    partial operating disclosures.
