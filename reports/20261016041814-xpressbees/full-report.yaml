              - CM004
              - CM005
              - CM006
      - number: '2.2'
        title: Sizing lenses and adoption drivers
        blocks:
          - type: paragraph
            body: >-
              The public evidence supports only a layered sizing view, not a clean top-down TAM/SAM/SOM. StartupTalky
              cites a roughly $250 billion Indian logistics market in 2021 with another $380 billion of growth potential
              by 2025, while XpressBees' own blogs frame demand through online-shopper growth, same-day expectations,
              and the operational pain of festive surges, returns, and inventory complexity. Multiples adds bottom-up
              operating lenses by describing more than 60,000 clients, over 2,000 cities and towns, and more than 2.5
              million daily orders. Together these sources are enough to say the addressable need is large and
              expanding, and that buyers adopt third-party logistics to improve speed, coverage, and working-capital
              efficiency. They are not enough to isolate XpressBees' current serviceable spend on a common denominator,
              so any market-size number used in valuation should be treated as directional unless backed by filings or a
              dated company KPI deck.
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM002
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
              - CM016
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM011
              - CM016
      - number: '2.3'
        title: Adoption constraints and model risk
        blocks:
          - type: paragraph
            body: >-
              The disconfirming evidence matters as much as the growth narrative. Tracxn and Economic Times place
              XpressBees in a crowded field that still includes Delhivery, Ecom Express, and Shadowfax, while the CEOs
              of Bharat article frames the business as capital-intensive and margin-pressured even while revenue grows.
              Those constraints matter because buyers care about reliability, coverage, and returns handling, but
              investors need proof that those service levels can be delivered without permanently subsidized economics.
              The biggest remaining gap is not whether demand exists; it is whether public evidence can separate broad
              Indian logistics growth from the narrower serviceable market XpressBees can profitably own by segment,
              geography, and service line. Until that is disclosed, the market story is credible but still
              under-specified for underwriting.
            claimRefs:
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Merchant operations own the buying decision
            body: >-
              The assigned sources consistently describe merchant-side workflows such as pickup, warehousing, COD
              handling, reverse logistics, and reconciliation, which implies the commercial decision sits with
              operations and supply- chain owners rather than end-consumers.
            calloutType: insight
            claimRefs:
              - CM003
              - CM004
              - CM005
          - type: callout
            title: Public demand evidence is stronger than public market-definition evidence
            body: >-
              The sources support a large and growing logistics need, but they do not reconcile spend, geography,
              service line, and profitability into a valuation-grade SAM/SOM; that missing bridge is the main
              market-analysis risk for underwriting.
            calloutType: risk
            claimRefs:
              - CM009
