      - number: '1.4'
        title: Milestones and current diligence flags
        blocks:
          - type: paragraph
            body: >-
              The retained milestone evidence shows a business that moved quickly from a 2015 spin-out into scaled
              logistics infrastructure, then layered financing, a 2023 acquisition, and a 2025 B2C leadership
              appointment on top of that foundation. That trajectory is useful context for later chapters, but it does
              not remove current diligence friction. Public operating metrics remain inconsistently defined across
              company pages, current headcount is not cleanly corroborated, and no retained source proves a post-2023
              funding event or updated valuation. The one clearly adverse signal in this pool is a 2026 media reference
              about repeated delivery failure, which is not enough to prove systemic breakdown but is enough to keep
              execution risk in scope.
