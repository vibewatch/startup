  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Served market boundary and buying workflow
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence supports defining XpressBees' market as outsourced commerce logistics rather than
              generic transportation. Company-controlled pages consistently place the business across first-mile pickup,
              sorting, line-haul, last-mile delivery, reverse logistics, warehousing, reconciliation, B2B freight, and
              cross-border shipping, which means the relevant spend pool includes logistics operations budgets that move
              inventory from merchant or enterprise origin points to retail or end customers. The buying center
              therefore sits with sellers, marketplace operators, retail supply-chain teams, and enterprise distribution
              owners, not with end-consumers. The same evidence also shows XpressBees serving multiple workflows at
              once: high-volume e-commerce fulfillment, D2C shipping, B2B bulk freight, and post-sale returns. That
              breadth matters for valuation because the company is competing for recurring workflow spend across a stack
              of services, but it also makes clean market delineation harder than a single-category courier or
              warehousing business.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM005
          - type: table
            tableRef: TM003
            claimRefs:
