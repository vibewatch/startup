              with 4,500+ fulfilment centres and more than 20,000 last-mile delivery partners. Two company blogs add
              specific operating surfaces: warehouses in 40+ cities, 10+ automated sorters, reverse logistics across
              18,000+ pin codes, same-day delivery in 50+ cities and 1,700+ pin codes, plus reach into 19,000+ B2C and
              11,000+ B2B networks. A LinkedIn post adds a fresher commercial proxy by stating that B2B Surface Xpress
              reached record monthly revenue in September 2026 and record quarterly revenue in Q2 FY27. The caveat is
              that independent quantified adoption evidence lags badly: Craft's visible metrics stop at 2020, so it
              helps corroborate breadth but not current customer momentum.
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU007
              - CU008
              - CU012
              - CU013
          - type: table
            tableRef: TU002
