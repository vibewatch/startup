  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      Residual risk clusters around capital efficiency, network execution, and evidence gaps on compliance and
      dependency concentration.
    data:
      columns:
        - Severe impact
        - High impact
        - Moderate impact
      rows:
        - label: Already visible
          values:
            - label: Operating leverage not yet proven
              detail: Loss growth is already visible in FY24 reporting.
            - label: Fraud / impersonation signal
              detail: The official partner-warning banner indicates an active trust-control issue.
            - label: Service-line sprawl
              detail: Breadth across B2B, B2C, reverse, cross-border, and warehousing complicates execution.
        - label: High likelihood
          values:
            - label: Cash burn / profitability
              detail: FY24 loss widened while expansion continued.
            - label: Last-mile / returns execution
              detail: Service complexity is acknowledged even in company materials.
            - label: Partner fraud / trust leakage
              detail: Official fraud warning suggests recurring vigilance is needed.
        - label: Elevated likelihood
          values:
            - label: Cost inflation from scale
              detail: Network growth can outpace route and facility efficiency gains.
            - label: Delivery-partner inconsistency
              detail: A very large field network is hard to standardize without KPI evidence.
            - label: Automation payback lag
              detail: Mitigations are described, but realized outcome metrics are not shown.
        - label: Medium likelihood
          values:
            - label: Financing visibility gap
              detail: Latest named funding signal in pool is still from 2023.
            - label: Integration / service-line sprawl
              detail: Trackon integration plus multi-line logistics increases coordination load.
            - label: Customer / partner concentration unknown
              detail: Public concentration data is not disclosed in assigned evidence.
        - label: Monitoring
          values:
            - label: Leadership bandwidth
              detail: Broad growth and integration require sustained operating cadence from the management bench.
            - label: Proof-of-mitigation lag
              detail: Public materials describe mitigations faster than they disclose outcome KPIs.
            - label: Disclosure discipline
              detail: Thin public evidence on compliance, liquidity, and concentration keeps risk-monitoring burden high.
        - label: Lower likelihood but high consequence
          values:
            - label: Regulatory / litigation surprise
              detail: No primary compliance pack is present in assigned sources.
            - label: Security / privacy disclosure gap
              detail: No privacy-security certification evidence is present in the pool.
            - label: Automation under-delivers
              detail: Mitigations are described, but outcome metrics are not independently shown.
    approximationNotes: >-
      Ordinal matrix based on sourced likelihood and impact signals; it is a prioritization aid, not a quantified
      probability model.
    claimRefs:
      - CR003
      - CR004
      - CR007
      - CR009
      - CR011
      - CR013
      - CR014
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      The recommendation moves from demonstrated operating scale through stale pricing and unresolved economics to a
      conditional research-more decision.
    data:
      nodes:
        - id: scale
          label: Operating scale
          detail: Company sources describe a broad national, multi-service logistics network.
        - id: signal
          label: 2026 operating signal
          detail: Record B2B monthly and quarterly revenue was claimed without values or margins.
        - id: stale-mark
          label: Stale priced mark
          detail: The latest evidenced priced round is the November 2023 Series G.
        - id: comp-gap
          label: Comparable gap
          detail: The historical 5.2x revenue multiple exceeds retained public-company references.
        - id: missing-inputs
          label: Missing underwriting inputs
          detail: Current audited economics, net debt, concentration, and preference terms are unavailable.
        - id: decision
          label: Research more
          detail: Set entry discipline only after the current denominator and security terms are verified.
      edges:
        - from: scale
          to: signal
        - from: signal
          to: stale-mark
        - from: stale-mark
          to: comp-gap
        - from: comp-gap
          to: missing-inputs
        - from: missing-inputs
          to: decision
    approximationNotes: The flow is qualitative and does not assign probabilities, conversion rates, or an absolute valuation.
    claimRefs:
      - CV001
      - CV003
      - CV005
      - CV009
      - CV010
      - CV012
      - CV013
      - CV015
      - CV016
