  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      Ordinal 1-5 scoring from retained assigned-pool evidence places XpressBees highest on documented service breadth,
      with Delhivery and Ecom Express as the clearest direct peers and Blue Dart / Shadowfax as adjacent pressure
      points.
    data:
      xAxis:
        label: Service breadth / multimodality
        min: 1
        max: 5
        lowLabel: Narrow / single-lane
        highLabel: Broad / multimodal
      yAxis:
        label: Public competitive signal strength in assigned pool
        min: 1
        max: 5
        lowLabel: Thin evidence
        highLabel: Strong evidence
      points:
        - label: XpressBees
          x: 5
          'y': 5
          detail: >-
            Broad B2C, B2B, 3PL, reverse-logistics, cross-border, warehousing, and integration coverage is documented in
            multiple retained sources.
        - label: Delhivery
          x: 4
          'y': 4
          detail: >-
            Named direct rival in ET rate coverage and in Netfigo's B2B expansion comparison, but with thinner retained
            service detail than XpressBees.
        - label: Ecom Express
          x: 3
          'y': 4
          detail: >-
            Clear direct peer in ET and Netfigo coverage, with active fundraising and quick-commerce expansion signals
            but less retained breadth detail.
        - label: Blue Dart
          x: 4
          'y': 2
          detail: >-
            Premium incumbent and broader-customer rival signal is present, but current retained evidence is thin and
            partly historical.
        - label: Shadowfax
          x: 3
          'y': 3
          detail: Similar logistics-page signal plus IPO/funding evidence supports an adjacent high-growth peer role.
        - label: Local / legacy substitutes
          x: 1
          'y': 2
          detail: >-
            India Post and informal local partners appear as low-structure or low-reliability alternatives rather than
            full multimodal peers.
    approximationNotes: >-
      X and Y are evidence-bounded ordinal scores, not market-share or NPS measures; they reflect only retained sources
      in the assigned pool and mark thinly documented rivals lower on evidence strength rather than weaker in the
      market.
    claimRefs:
      - CP005
      - CP006
      - CP007
      - CP012
      - CP014
      - CP015
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence supports a service workflow that turns merchant order volume into shipment, fulfilment, and
      returns revenue, while gross profit remains sensitive to network density and support costs.
    data:
      nodes:
        - id: n1
          label: Merchant demand
          detail: Order volume from ecommerce sellers and enterprise clients
          displayValue: B2C, B2B, cross-border, 3PL
        - id: n2
          label: Pickup and warehousing
          detail: Collection, storage, and fulfilment activity before linehaul
          displayValue: 4,500+ fulfilment centers
        - id: n3
          label: Network movement
          detail: Sorting, hubs, route optimization, and linehaul across national coverage
          displayValue: 19,000+ pin codes
        - id: n4
          label: Last-mile delivery
          detail: Doorstep delivery, OTP handoff, and same-day / next-day promise
          displayValue: 50+ cities same-day
        - id: n5
          label: Returns and RTO
          detail: Reverse logistics, return pickups, and post-sale issue handling
          displayValue: COD and reverse logistics supported
        - id: n6
          label: Recognized revenue and gross profit
          detail: Service revenue is visible publicly; margin capture is not
          displayValue: Revenue disclosed; per-shipment margin undisclosed
      edges:
        - from: n1
          to: n2
          label: orders create pickup / storage demand
        - from: n2
          to: n3
          label: fulfilment feeds linehaul and sorting
        - from: n3
          to: n4
          label: network execution creates delivery events
        - from: n4
          to: n5
          label: successful delivery or reverse flow
        - from: n5
          to: n6
          label: service events turn into billable revenue, net of cost to serve
    approximationNotes: >-
      Node values are literal operating descriptors from retained public sources, not a quantified bridge from GMV to
      revenue or from revenue to gross profit.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI005
      - CI010
  - id: FE001
    title: Publicly disclosed product architecture map
    type: stack
    summary: >-
      Public evidence shows a layered model in which merchant integrations feed orchestration software, which then
      routes volume through a distributed physical network with reverse-logistics and reconciliation loops.
    data:
      layers:
        - label: Merchant interfaces
          detail: Order intake starts from marketplaces, storefronts, and merchant systems.
          modules:
            - label: Supported integrations
              detail: Amazon India, Flipkart, WooCommerce, Shopify, Shiprocket, Nimbus Post
            - label: Payment modes
              detail: Prepaid and COD orders are accepted in the documented workflow
        - label: Orchestration and visibility
          detail: Public materials emphasize software-enabled control rather than a hardware-only network.
          modules:
            - label: Routing and tracking
              detail: Route optimization algorithms and AI-powered tracking systems
            - label: Reporting loop
              detail: Reconciliation and reporting after delivery and return events
        - label: Physical execution network
          detail: Volume is processed through distributed facilities and transport stages.
          modules:
            - label: Sortation and fulfillment
              detail: 10+ automated sorters and 4,500+ fulfillment centers across 40+ cities
        - label: Partner execution layer
          detail: Public sources indicate scale is extended through an asset-light partner model.
          modules:
            - label: Transport stages
              detail: Pickup, first mile, line haul, and local last-mile partner execution
            - label: Courier partner dependency
              detail: Multiples describes an asset-light model with 27 courier partners
        - label: Payments and post-sale loop
          detail: The operating flow includes settlement-sensitive and exception-heavy processes after dispatch.
          outputs:
            - label: COD and prepaid handling
              detail: Secure payment-mode handling is part of the documented workflow
            - label: Reverse logistics
              detail: Returns and RTO management
            - label: Reporting
              detail: Reconciliation and reporting close the shipment loop
        - label: Specialized verticals
          detail: The stack extends beyond standard parcel delivery into sector-specific service lines.
          outputs:
            - label: B2B express
              detail: Time-definite movement for bulk and high-value shipments
            - label: Healthcare / pharma
              detail: Cold-chain and compliance-sensitive transport claims
    claimRefs:
