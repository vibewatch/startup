          - type: callout
            title: Runway is still a diligence blocker
            body: >-
              Because the retained evidence does not disclose current cash, debt, or monthly burn, profitability
              pressure has to be interpreted from loss signals instead of directly underwritten.
            calloutType: risk
            claimRefs:
