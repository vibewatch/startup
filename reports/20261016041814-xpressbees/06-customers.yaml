  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention-metrics
      missingEvidence: Current NRR, GRR, churn, renewal rate, contract length, and cohort retention by major customer segment.
      whyItMatters: Without retention data, customer durability cannot be separated from network-scale marketing claims.
      diligencePath: Request board or lender reporting with cohort retention, renewal, and contract-tenure data by segment.
      relatedQuestionRefs: [QU004]
    - type: missing-source
      severity: material
      topic: customer-concentration
      missingEvidence: Top-customer revenue share, top-10 customer mix, and any disclosure on dependence on large marketplaces or anchor accounts.
      whyItMatters: Concentration could dominate downside if volume is tied to one or a few large shippers.
      diligencePath: Request audited customer concentration schedule or management disclosure of the top five accounts and their contract terms.
      relatedQuestionRefs: [QU008]
    - type: enumeration-incomplete
      severity: material
      topic: named-customer-proof
      missingEvidence: Current named production customers with deployment scope, launch dates, outcomes, and referenceable customer quotes.
      whyItMatters: The retained pool proves broad logistics surfaces but does not prove current depth of live enterprise adoption.
      diligencePath: Ask for at least five referenceable live accounts spanning ecommerce, B2B, warehousing, and reverse logistics.
      relatedQuestionRefs: [QU003]
      relatedTableRefs: [TU003]
