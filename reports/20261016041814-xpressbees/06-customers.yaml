      - [Returns and reverse-logistics users, "Buyer/payer: merchants; user: returns and customer-service workflows", Reverse logistics, "18,000+ pin-code reverse-logistics coverage", "Supports retention pitch for ecommerce sellers", "No return-rate, renewal, or satisfaction metric disclosed"]
      - [SMEs and smaller online sellers, "Buyer/payer: small businesses; user: owner-operators and fulfilment teams", Outsourced logistics and warehousing, "LinkedIn says XpressBees serves 'e-commerce giants to small businesses'", "Broadens TAM beyond marquee marketplaces", "Named customer examples are absent in retained sources"]
    notes: >-
      Mixes company positioning with limited third-party corroboration; rows describe
      customer surfaces and explicit evidence, not audited revenue segmentation.
    claimRefs: [CU002, CU003, CU004, CU007, CU008, CU009, CU012]
  - id: TU002
    title: Customer growth / adoption trajectory table
    columns:
      - Metric
      - Value
      - Date
      - Source
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - [Businesses served, 30, 2020-01, Craft, medium, "Independent but stale proof that XpressBees had multi-customer usage by 2020", "No current businesses-served count"]
      - [Cities served, "2,000", 2020-11, Craft, medium, "Independent historical breadth proxy", "No current city count in retained independent sources"]
      - [Daily shipments, "2 million", 2020-11, Craft, medium, "Independent historical throughput proxy", "No current independently verified shipment count"]
      - [Pin-code reach, "19,000+", 2026, XpressBees about-us, medium, "Current company-claimed nationwide coverage", "No active-account denominator"]
      - [Fulfilment centres, "4,500+", 2026, XpressBees about-us, medium, "Large operational footprint for merchant onboarding", "No utilization or occupancy metric"]
      - [Same-day delivery coverage, "50+ cities / 1,700+ pin codes", 2026, XpressBees supply-chain blog, medium, "Shows premium service expansion lever", "No order-share or repeat-usage metric"]
      - [B2B Surface Xpress revenue milestone, "Highest-ever month in Sep 2026; highest-ever quarter in Q2 FY27", 2026, LinkedIn post, low, "Fresh commercial traction signal for B2B lane", "No customer count, margin, or retention disclosure"]
    notes: >-
      Table combines stale independent metrics with fresher company-reported operating
      proxies; values are not directly comparable as a single funnel and several lack
      customer-count denominators.
    claimRefs: [CU004, CU005, CU006, CU007, CU008, CU012, CU013]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome
      - Limitation
    rows:
      - [FirstCry, Founding ecommerce customer, "XpressBees began as the logistics provider supporting FirstCry deliveries before the 2015 spin-out", Production, "Strong historical proof that the business started with real shipment volume", "Historical only; retained sources do not confirm current contract scope"]
      - ["Third-party ecommerce platforms (unnamed)", Ecommerce brands and marketplaces, "OrangeOwl says XpressBees had to convince third-party ecommerce platforms to trust it beyond FirstCry", Production, "Shows successful expansion beyond captive demand", "No customer names, launch dates, or SLA outcomes disclosed"]
      - ["Large retailers, marketplaces, and D2C brands (unnamed)", Mid-market and enterprise shippers, "OrangeOwl describes credibility with large retailers, marketplaces, and D2C brands through relationship-driven selling", Production, "Indicates broader commercial relevance outside a single anchor account", "Evidence is descriptive rather than a named case study or customer quote"]
    notes: >-
      Partial sample only. The retained pool contains one clearly named historical customer
      and two directly described but unnamed customer groups; this is the best available
      public proof from the assigned evidence, not an exhaustive live customer list.
    enumerationScope:
      coverage: partial
      basis: >-
        Limited to customer proofs explicitly named or directly described in the retained
        assigned-source corpus for this chapter as of the 2026-10-16 run.
    claimRefs: [CU001, CU010, CU011, CU014]
figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Available evidence points to a merchant-led adoption loop that starts with ecommerce
      demand, expands through fulfilment and last-mile coverage, and tries to deepen via
      reverse logistics and B2B lanes.
    data:
      items:
        - label: Founding captive demand
          actor: FirstCry
          stage: Incubation
          tone: neutral
          touchpoints:
            - In-house logistics support for FirstCry deliveries
            - Historical proof of real production shipments before spin-out
        - label: Third-party trust building
          actor: Ecommerce platforms
          stage: Early sales
          tone: risk
          touchpoints:
            - Prospective clients questioned why they should choose XpressBees over bigger brands
            - Expansion beyond FirstCry required trust-building
        - label: Broad merchant acquisition
          actor: Retailers, marketplaces, and D2C brands
          stage: Acquisition
          tone: positive
          touchpoints:
            - Relationship-driven selling
            - Custom logistics packages for different merchant needs
        - label: Fulfilment and warehousing
          actor: Merchant operations teams
          stage: Deployment
          tone: positive
          touchpoints:
            - 4,500+ fulfilment centres
            - Warehouses in 40+ cities
        - label: Last-mile and premium delivery
          actor: End customers and merchant CX teams
          stage: Daily use
          tone: positive
          touchpoints:
            - Millions of shipments daily across 19,000+ pin codes
            - Same-day delivery in 50+ cities and 1,700+ pin codes
        - label: Expansion and stickiness loop
          actor: Reverse-logistics and B2B shippers
          stage: Expansion
          tone: neutral
          touchpoints:
            - Reverse logistics across 18,000+ pin codes
            - B2B Surface Xpress record revenue in Sep 2026 and Q2 FY27
    approximationNotes: >-
      Conceptual journey assembled from official service descriptions plus one independent
      historical narrative; it shows adoption surfaces and expansion loops, not verified
      conversion rates or segment weights.
    claimRefs: [CU001, CU004, CU005, CU007, CU010, CU012]
callouts:
  - calloutType: insight
    title: Breadth is better evidenced than depth
    body: >-
      The assigned pool supports broad service-line and network coverage, but most fresh
      adoption evidence is company-issued rather than independently verified named customer
      proof.
    claimRefs: [CU003, CU004, CU005, CU012, CU014]
  - calloutType: risk
    title: Durability and concentration remain open
    body: >-
      No retained source discloses renewal rates, churn, contract length, or top-customer
      share, so customer durability and concentration should be treated as unresolved
      diligence items rather than assumed strengths.
    claimRefs: [CU010, CU011, CU014]
