            - label: "Delivery-partner inconsistency"
              detail: "A very large field network is hard to standardize without KPI evidence."
            - label: "Automation payback lag"
              detail: "Mitigations are described, but realized outcome metrics are not shown."
        - label: "Medium likelihood"
          values:
            - label: "Financing visibility gap"
              detail: "Latest named funding signal in pool is still from 2023."
            - label: "Integration / service-line sprawl"
              detail: "Trackon integration plus multi-line logistics increases coordination load."
            - label: "Customer / partner concentration unknown"
              detail: "Public concentration data is not disclosed in assigned evidence."
        - label: "Monitoring"
          values:
            - label: "Leadership bandwidth"
              detail: "Broad growth and integration require sustained operating cadence from the management bench."
            - label: "Proof-of-mitigation lag"
              detail: "Public materials describe mitigations faster than they disclose outcome KPIs."
            - label: "Disclosure discipline"
              detail: "Thin public evidence on compliance, liquidity, and concentration keeps risk-monitoring burden high."
        - label: "Lower likelihood but high consequence"
          values:
            - label: "Regulatory / litigation surprise"
              detail: "No primary compliance pack is present in assigned sources."
            - label: "Security / privacy disclosure gap"
              detail: "No privacy-security certification evidence is present in the pool."
            - label: "Automation under-delivers"
              detail: "Mitigations are described, but outcome metrics are not independently shown."
    approximationNotes: "Ordinal matrix based on sourced likelihood and impact signals; it is a prioritization aid, not a quantified probability model."
