callouts:
  - calloutType: "risk"
    title: "Top residual risk"
    body: >-
      The biggest downside driver is not a single legal or operational event but the interaction between a costly nationwide network, still-negative profitability, and incomplete visibility on current financing, concentration, and compliance proof.
    claimRefs:
      - CR001
      - CR004
      - CR007
      - CR011
  - calloutType: "recommendation"
    title: "Kill criteria"
    body: >-
      Thesis-break triggers are another year of widening losses without disclosed margin improvement, continued absence of fresh financing or liquidity proof, or evidence that partner fraud, returns, or SLA failures are recurring rather than isolated.
