  rows:
  - - B2C logistics
    - Parcel delivery and doorstep fulfilment for ecommerce merchants
    - Per shipment / contract
    - Core line named across official and third-party sources
    - Commercially proven, but realized pricing undisclosed
    - Provide average realized revenue and gross margin per B2C shipment by cohort
  - - B2B logistics
    - Surface and business-delivery movement for merchants and enterprise buyers
    - Per shipment / contract
    - Explicitly listed in company service mix and partner testimonials
    - Demand signal exists, but customer concentration unknown
    - Disclose top B2B customers, contract tenure, and loss-making lanes
  - - Cross-border logistics
    - International shipping and customs-linked fulfilment services
    - Per shipment / corridor
    - Consistently listed in revenue mix and service catalogue
    - Strategic adjacency, but no public revenue split
    - Break out cross-border revenue, margin, and working-capital intensity
  - - Warehousing / fulfilment / reverse logistics
    - Storage, sorting, returns, and RTO handling tied to merchant operations
    - Per order / storage / service bundle
    - Official pages present it as an integrated capability set rather than a priced standalone card
    - Likely sticky, but cost-to-serve is opaque
    - Share utilisation, storage pricing, and reverse-logistics recovery economics
  notes: Public evidence identifies service lines and fulfillment mechanics, but not list rate cards, discount ladders, or GAAP/Ind-AS revenue-recognition detail by stream.
