- id: TI002
  title: Pricing / monetization table
  columns:
  - Offer / motion
  - Price / unit / contract
  - List vs realized pricing
  - Discounts / unknowns
  - Source
  rows:
  - - Same-day / next-day ecommerce delivery
    - null
