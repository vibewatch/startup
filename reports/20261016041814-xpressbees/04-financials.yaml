- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Value / status
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - FY25 revenue snapshot
    - ₹2,348.0 Cr+ (Inc42 listing)
    - Medium
    - Shows recent topline traction, but not audited profitability or cash conversion
    - Obtain audited FY25 P&L and segment revenue bridge
  - - Last priced-round revenue proxy
    - $271M at Nov 2023 Series G
    - Medium
    - Useful for valuation context and rough scale normalization
    - Confirm whether figure is LTM revenue or run-rate revenue at signing
  - - Private-market valuation multiple
    - 5.2x revenue multiple at $1.4B valuation
    - Medium
    - Frames what late-stage investors were willing to pay for the topline
    - Refresh with current-mark transaction data or board-mark methodology
  - - FY24 profitability signal
    - Net loss INR 199.9 Cr on operating revenue INR 2,831.3 Cr
    - Low-to-medium
    - Indicates growth has not yet produced public profitability
    - Reconcile with audited statutory filing and management EBITDA definition
  - - Current cash / runway / debt
    - null
    - Low
    - Core capital-adequacy variable for underwriting
    - Request cash balance, burn, debt covenants, and base/bear runway
  - - Per-shipment contribution margin
    - null
    - Low
    - Needed to know whether density improves profitability or just scales losses
    - Provide net revenue, direct delivery cost, and return-adjusted margin by service line
  notes: This table mixes corroborated public datapoints with explicit nulls where open sources do not support underwriting-grade metrics; null does not mean zero.
