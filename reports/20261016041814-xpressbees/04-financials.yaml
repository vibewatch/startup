figures:
- id: FI001
  title: Revenue model bridge
  type: flow
  summary: Public evidence supports a service workflow that turns merchant order volume into shipment, fulfilment, and returns revenue, while gross profit remains sensitive to network density and support costs.
  data:
    nodes:
    - id: n1
      label: Merchant demand
      detail: Order volume from ecommerce sellers and enterprise clients
      displayValue: B2C, B2B, cross-border, 3PL
    - id: n2
      label: Pickup and warehousing
      detail: Collection, storage, and fulfilment activity before linehaul
      displayValue: 4,500+ fulfilment centers
    - id: n3
      label: Network movement
      detail: Sorting, hubs, route optimization, and linehaul across national coverage
      displayValue: 19,000+ pin codes
    - id: n4
      label: Last-mile delivery
      detail: Doorstep delivery, OTP handoff, and same-day / next-day promise
      displayValue: 50+ cities same-day
    - id: n5
      label: Returns and RTO
      detail: Reverse logistics, return pickups, and post-sale issue handling
      displayValue: COD and reverse logistics supported
    - id: n6
      label: Recognized revenue and gross profit
      detail: Service revenue is visible publicly; margin capture is not
      displayValue: Revenue disclosed; per-shipment margin undisclosed
    edges:
    - from: n1
      to: n2
      label: orders create pickup / storage demand
    - from: n2
      to: n3
      label: fulfilment feeds linehaul and sorting
    - from: n3
      to: n4
      label: network execution creates delivery events
    - from: n4
      to: n5
      label: successful delivery or reverse flow
    - from: n5
      to: n6
      label: service events turn into billable revenue, net of cost to serve
  approximationNotes: Node values are literal operating descriptors from retained public sources, not a quantified bridge from GMV to revenue or from revenue to gross profit.
