evidenceGaps:
  - type: missing-source
    severity: material
    topic: post-2023 financing status
    missingEvidence: Any retained source proving a post-Nov-2023 equity raise, bridge, DRHP filing, or updated valuation.
    whyItMatters: >-
      A newer financing marker would materially change the baseline valuation and liquidity read for the rest of the
      report.
    diligencePath: >-
      Request management financing chronology, cap table changes since Series G, and any DRHP or board materials
      covering FY26 capital planning.
    relatedQuestionRefs:
      - QO008
  - type: conflicting-data
    severity: material
    topic: total-raised
    missingEvidence: A reconciled company or investor schedule showing lifetime primary capital and secondaries separately.
    whyItMatters: >-
      Using an unreconciled cumulative funding number would distort dilution, liquidity, and valuation framing in the
      report summary.
    diligencePath: >-
      Obtain a cap table bridge or management-confirmed financing schedule that separates primary proceeds from
      secondary liquidity.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: current customer and operating KPIs
    missingEvidence: A current active-customer count plus harmonized shipment, hub, centre, and pin-code definitions for FY26.
    whyItMatters: >-
      Scale is central to both operating leverage and valuation comps, but the retained public surfaces use inconsistent
      definitions and vintages.
    diligencePath: >-
      Request the latest board deck, DRHP draft, or audited investor presentation with one KPI glossary and one
      reporting date.
    relatedQuestionRefs:
      - QO004
      - QO008
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: leadership and founder table coverage
    missingEvidence: Board composition, committee structure, and a complete executive roster rather than management page excerpts.
    whyItMatters: >-
      Late-stage governance quality matters for capital allocation, succession planning, and IPO readiness, and it is
      not visible in the retained public evidence.
    diligencePath: >-
      Request the latest board list, observer rights, and an organization chart covering founders, business-unit
      leaders, and control functions.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      A public source that converts Indian e-commerce logistics demand into a dated TAM, SAM, and SOM for XpressBees on
      one denominator.
    whyItMatters: >-
      Without a consistent denominator the market chapter can show demand direction but cannot support valuation-grade
      market-share math.
    diligencePath: >-
      Obtain a recent investor deck, board KPI pack, or DRHP-style market slide that ties segment revenue pools to the
      company's actual service lines and geographies.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Per-shipment revenue, direct delivery cost, gross margin, and customer concentration by service line or segment.
    whyItMatters: >-
      Merchant adoption is meaningful only if service-level expectations can be met with durable margins rather than
      subsidized growth.
    diligencePath: >-
      Request segment-level operating metrics from management and reconcile them against audited statutory filings or
      prospective offering documents.
  - type: conflicting-data
    severity: minor
    topic: contradictory-estimates
    missingEvidence: >-
      A dated company KPI sheet reconciling pin-code reach, fulfillment-center count, and daily order throughput across
      official and database sources.
    whyItMatters: >-
      The market story remains directionally positive, but contradictory operating snapshots reduce confidence in
      precision claims.
    diligencePath: >-
      Ask management for the latest operating dashboard and definitions for pin-code reach, hubs, fulfillment centers,
      and order counts.
    relatedQuestionRefs:
      - QM006
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: rival-public-pricing
    missingEvidence: >-
      Current public rate cards, contract models, or discount structures for Delhivery, Ecom Express, Shadowfax, Blue
      Dart, DTDC, and Ekart.
    whyItMatters: >-
      Without retained rival pricing evidence, the chapter cannot test whether XpressBees competes on list price,
      discounting, or service bundle economics.
    diligencePath: >-
      Retain competitor official pricing, aggregator commerce pages, or customer procurement documents for the named
      peers.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: feature-parity
    missingEvidence: >-
      Competitor primary-source service pages covering same-day delivery, reverse logistics, warehousing, cross-border,
      and integrations.
    whyItMatters: >-
      The current matrix proves XpressBees breadth but cannot prove whether peers match, exceed, or lag on the same
      capabilities.
    diligencePath: >-
      Add retained official product pages and independent benchmarks for Delhivery, Ecom Express, Shadowfax, Blue Dart,
      Ekart, and DTDC.
    relatedQuestionRefs:
      - QP003
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: material
    topic: switching-costs
    missingEvidence: >-
      Contract terms, wallet-share data, customer multi-homing behavior, and retention evidence for major XpressBees
      shippers.
    whyItMatters: >-
      Integrations and bundled services may create lock-in, but the current public record does not show whether
      customers actually single-home or switch easily.
    diligencePath: >-
      Request enterprise contracts, procurement records, or customer interviews covering migration cost and
      multi-carrier behavior.
    relatedQuestionRefs:
      - QP005
  - type: missing-source
    severity: minor
    topic: internal-build-threat
    missingEvidence: Fresh primary evidence on in-house logistics buildouts and likely new entrants in XpressBees' target segments.
    whyItMatters: >-
      Netfigo points to Amazon's in-house network, but the chapter cannot size how much internal build risk exists
      across the broader customer base.
    diligencePath: >-
      Retain marketplace, merchant, and large-brand logistics disclosures describing outsourced versus in-house
      fulfillment choices.
    relatedQuestionRefs:
      - QP007
      - QP008
  - type: private-evidence-only
    severity: material
    topic: liquidity-runway
    missingEvidence: Current cash balance, monthly burn, debt facilities, covenant package, and management runway case.
    whyItMatters: >-
      Without current liquidity disclosure, the latest valuation and historical raise data do not show whether
      XpressBees can self-fund expansion or needs another round soon.
    diligencePath: Request the latest board pack or monthly MIS with cash, debt, and runway scenarios.
    relatedQuestionRefs:
      - QI006
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Per-shipment net revenue, direct delivery cost, reverse-logistics cost, and gross margin by B2C, B2B,
      cross-border, and warehousing lines.
    whyItMatters: >-
      Shipment growth is not enough for underwriting if network density does not translate into positive contribution
      margin or improving gross profit.
    diligencePath: Obtain route-level or service-line unit-economics cohorts and reconcile them to audited revenue.
    relatedQuestionRefs:
      - QI007
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: pricing-realization
    missingEvidence: >-
      Rate cards, realized ASP by lane, discount schedules, minimum commitments, and customer concentration for the top
      accounts.
    whyItMatters: >-
      Public capability pages show what XpressBees can sell, but not whether pricing power or customer mix supports
      durable margins.
    diligencePath: Review sample customer contracts and management pricing waterfalls by service line.
    relatedQuestionRefs:
      - QI002
    relatedTableRefs:
      - TI002
  - type: stale
    severity: material
    topic: current-financials
    missingEvidence: Audited FY25 statements and FY26 year-to-date actuals for revenue, EBITDA, PAT, and working capital.
    whyItMatters: >-
      Open-web financial snapshots mix funding-round context, directory estimates, and one recent narrative article,
      which is insufficient for underwriting trend quality.
    diligencePath: Request statutory filings, auditor-reviewed management accounts, and monthly actual-versus-plan reporting.
    relatedQuestionRefs:
      - QI003
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: security-controls
    missingEvidence: >-
      Independent evidence of security certifications, privacy controls, incident response practices, and uptime or
      status history.
    whyItMatters: >-
      Public product pages make trust-sensitive claims, but investors cannot underwrite platform resilience or
      data-handling risk from company copy alone.
    diligencePath: >-
      Request current security certifications, privacy governance documents, incident logs, and any customer-facing
      status or postmortem records.
    relatedQuestionRefs:
      - QE007
      - QE008
  - type: missing-source
    severity: material
    topic: developer-signal
    missingEvidence: >-
      Public developer or practitioner evidence showing API adoption, release cadence, documentation maturity, or
      integration depth.
    whyItMatters: >-
      Without an external developer signal, it is difficult to judge implementation burden or whether integrations are a
      repeatable moat versus a sales claim.
    diligencePath: >-
      Request API documentation, partner onboarding materials, integration usage metrics, public changelog evidence, and
      sample merchant implementation timelines.
    relatedQuestionRefs:
      - QE005
      - QE006
  - type: private-evidence-only
    severity: material
    topic: service-reliability
    missingEvidence: >-
      Cohort-level on-time delivery, failed-delivery, return-cycle, and reconciliation-accuracy metrics by product line
      and geography.
    whyItMatters: >-
      Network scale only matters if execution quality is durable across regions, customer segments, and
      reverse-logistics flows.
    diligencePath: >-
      Review monthly operating dashboards, top-customer SLA scorecards, and exception-rate trends for B2C, B2B, and
      returns operations.
    relatedQuestionRefs:
      - QE001
      - QE004
      - QE007
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: Current NRR, GRR, churn, renewal rate, contract length, and cohort retention by major customer segment.
    whyItMatters: Without retention data, customer durability cannot be separated from network-scale marketing claims.
    diligencePath: Request board or lender reporting with cohort retention, renewal, and contract-tenure data by segment.
    relatedQuestionRefs:
      - QU004
  - type: missing-source
    severity: material
    topic: customer-concentration
    missingEvidence: >-
      Top-customer revenue share, top-10 customer mix, and any disclosure on dependence on large marketplaces or anchor
      accounts.
    whyItMatters: Concentration could dominate downside if volume is tied to one or a few large shippers.
    diligencePath: >-
      Request audited customer concentration schedule or management disclosure of the top five accounts and their
      contract terms.
    relatedQuestionRefs:
      - QU008
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: >-
      Current named production customers with deployment scope, launch dates, outcomes, and referenceable customer
      quotes.
    whyItMatters: The retained pool proves broad logistics surfaces but does not prove current depth of live enterprise adoption.
    diligencePath: Ask for at least five referenceable live accounts spanning ecommerce, B2B, warehousing, and reverse logistics.
    relatedQuestionRefs:
      - QU003
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: compliance-gap
    missingEvidence: >-
      Primary litigation schedule, operating-license inventory, privacy/security certification pack, and regulator
      correspondence.
    whyItMatters: Without primary compliance evidence, diligence cannot distinguish a genuinely clean posture from a disclosure gap.
    diligencePath: >-
      Request counsel-certified litigation memo, license register, DPA templates, ISO/SOC evidence, and any regulator
      notices or show-cause letters.
    relatedQuestionRefs:
      - QR007
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: liquidity-gap
    missingEvidence: Current cash balance, debt and lease maturities, monthly burn, and per-shipment gross margin by service line.
    whyItMatters: >-
      Loss-making logistics growth is only financeable if liquidity and unit economics can absorb execution shocks
      without a rushed capital raise.
    diligencePath: >-
      Obtain FY25/FY26 management accounts, debt schedule, covenant summary, and service-line contribution-margin
      bridge.
  - type: private-evidence-only
    severity: material
    topic: network-dependency-gap
    missingEvidence: >-
      Top-customer concentration, delivery-partner churn, SLA miss rates, returns ratios, hub uptime, and fraud incident
      counts.
    whyItMatters: >-
      Partner or customer concentration can turn network scale into fragility if a few nodes, counterparties, or
      customers dominate service quality or volume.
    diligencePath: >-
      Request top-10 customer revenue share, partner concentration, monthly SLA dashboards, fraud-loss register, and
      network uptime reports.
    relatedQuestionRefs:
      - QR005
      - QR008
    relatedTableRefs:
      - TR002
      - TR003
  - type: private-evidence-only
    severity: material
    topic: current-valuation-gap
    missingEvidence: >-
      Audited FY26 and current FY27 revenue, EBITDA, operating cash flow, cash, debt, organic growth, and the fully
      diluted preference stack.
    whyItMatters: >-
      These inputs determine the current revenue denominator, liquidity risk, dilution, and the value attributable to a
      new security.
    diligencePath: >-
      Obtain audited financial statements, monthly management accounts, bank and debt schedules, the fully diluted cap
      table, and all financing documents directly from the company and lead investors.
    relatedQuestionRefs:
      - QV008
  - type: missing-source
    severity: material
    topic: exit-readiness
    missingEvidence: >-
      A current primary filing, approved listing timetable, adviser mandate, governance-readiness assessment, and
      exit-window evidence.
    whyItMatters: >-
      Exit timing drives holding-period returns and determines whether a private-market premium has a credible
      realization path.
    diligencePath: >-
      Request board-approved IPO materials and adviser engagement letters, then verify any filing directly with the
      relevant securities regulator.
    relatedQuestionRefs:
      - QV010
  - type: private-evidence-only
    severity: material
    topic: unit-economics-and-concentration
    missingEvidence: >-
      Segment and per-shipment contribution margins, customer concentration, retention, service-level penalties, and
      organic growth excluding acquisitions.
    whyItMatters: >-
      Network scale and revenue records do not establish profitable, diversified growth without these operating
      denominators.
    diligencePath: >-
      Review customer-level cohorts, top-20 revenue and margin concentration, shipment economics by segment, churn, and
      acquisition-adjusted monthly performance.
    relatedQuestionRefs:
      - QV007
