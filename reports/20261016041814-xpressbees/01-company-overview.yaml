schemaVersion: report-v2
artifact: company-overview
slug: xpressbees
runDate: 2026-10-16
company:
  name: XpressBees
chapter:
  number: 1
  title: Company Overview
  summary: >-
    XpressBees is a Pune-based, privately held logistics platform founded in 2015 that still
    anchors its public narrative on a broad India-wide parcel, warehousing, and cross-border
    footprint. The last clean external financing marker retained for this refresh remains the
    $80 million Series G at a $1.4 billion valuation in November 2023, while fresher 2026
    disclosures remain uneven: current headcount and cumulative funding totals conflict across
    public surfaces, and no retained source confirms a newer round.
sections:
  - id: identity-and-scope
    title: Identity and operating scope
    body: >-
      Retained public sources consistently place XpressBees in Pune and date the company to
      2015, with the business framed as a privately held logistics provider that emerged from
      serving FirstCry and then broadened into a standalone, multi-product platform. The
      company-controlled surfaces reviewed here all market the same core operating stack:
      express parcel delivery, reverse logistics, B2B movement, warehousing or fulfilment, and
      cross-border services. The more important diligence caveat is not whether XpressBees has
      scale, but that current company pages describe that scale using different counters and
      scopes, so the chapter treats network breadth as directionally strong while leaving some
      cover metrics unresolved instead of normalizing them into a false precision.
    claimRefs: [CO001, CO002, CO003, CO004, CO005]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership and governance visibility
    body: >-
      Leadership visibility is strongest on company-owned pages rather than on independent
      governance disclosures. Amitava Saha remains the central operator and the about-us page
      still presents his FirstCry and BrainVisa background as the founder-market-fit anchor.
      The same retained evidence also shows a fresher operating leadership layer, including
      Mohit Sardana as CEO for the B2C business and named leaders across HR, B2B, 3PL,
      cross-border, engineering, and line-haul functions. What is visible, however, is
      management-heavy rather than board-heavy: the retained public pages enumerate executives
      but do not provide a board roster, committee structure, or other governance detail that a
      late-stage investor would want before treating leadership oversight as fully diligenced.
    claimRefs: [CO012, CO013, CO014]
    tableRefs: [TO002]
  - id: capital-history-and-stakeholders
    title: Capital history and stakeholder map
    body: >-
      The cleanest external financing anchor in the retained pool is still November 2023, when
      Multiples and Economic Times both tie XpressBees to an $80 million Series G associated
      with Teachers’ Venture Growth at a $1.4 billion valuation. Earlier external markers show
      the company reaching unicorn status in February 2022 and then supporting a Khazanah-led
      secondary in April 2023 before the later Series G. Public investor naming is broad enough
      to establish a deep institutional cap table, but not precise enough to establish current
      ownership, governance rights, or dilution by holder. That uncertainty matters because even
      the cumulative funding total is not reconciled across retained sources, so capital history
      is directionally strong but still needs management-grade confirmation for a cover metric.
    claimRefs: [CO006, CO007, CO008, CO009, CO010]
    tableRefs: [TO003]
  - id: milestones-and-current-flags
    title: Milestones and current diligence flags
    body: >-
      The retained milestone evidence shows a business that moved quickly from a 2015 spin-out
      into scaled logistics infrastructure, then layered financing, a 2023 acquisition, and a
      2025 B2C leadership appointment on top of that foundation. That trajectory is useful
      context for later chapters, but it does not remove current diligence friction. Public
      operating metrics remain inconsistently defined across company pages, current headcount is
      not cleanly corroborated, and no retained source proves a post-2023 funding event or
      updated valuation. The one clearly adverse signal in this pool is a 2026 media reference
      about repeated delivery failure, which is not enough to prove systemic breakdown but is
      enough to keep execution risk in scope.
    claimRefs: [CO004, CO005, CO011, CO012, CO015, CO016]
    figureRefs: [FO001]
tables:
  - id: TO001
    title: Snapshot KPI table
    columns:
      - Metric
      - Value / status
      - As of
      - Confidence
      - Gap / diligence note
    rows:
      - ["Founded", "2015", "Current public profiles", "High", "Corroborated across LinkedIn and the about-us page."]
      - ["Headquarters", "Pune, Maharashtra, India", "Current public profiles", "High", "Location is consistent across retained company-issued profiles."]
      - ["Corporate status", "Privately held", "Current public profiles", "High", "No retained filing or listing evidence suggests a public listing yet."]
      - ["Business model", "Express parcel, reverse logistics, B2B logistics, warehousing / fulfilment, and cross-border services", "Current public pages", "High", "Service breadth is clear even if underlying operating counters vary by page."]
      - ["Latest confirmed valuation", "$1.4B", "Nov 2023", "High", "Backed by Multiples and an Economic Times funding headline; no newer retained valuation marker."]
      - ["Latest confirmed primary round", "$80M Series G led by Teachers’ Venture Growth", "Nov 2023", "High", "No retained 2026 source confirms a subsequent equity round or bridge."]
      - ["Total capital raised", "Conflicting public totals: $553M vs $622M", "Nov 2023 to Aug 2026 public surfaces", "Medium", "Requires management reconciliation before using one cumulative cover number."]
      - ["Revenue / run-rate", "$271M recorded alongside the Nov 2023 Series G", "Nov 2023", "Medium", "Useful historical financing marker, but not a confirmed FY26 revenue figure."]
      - ["Customer count", "Publicly under-disclosed", "Current public pages", "Low", "Company cites businesses served since inception, not a clean current active-customer count."]
      - ["Headcount", "Publicly inconsistent: 10,001+ LinkedIn band vs ~8.6K LeadIQ estimate", "Aug to Oct 2026 public surfaces", "Low", "Good enough to infer scale, not good enough for a precise cover metric."]
    notes: >-
      Mixes current company-issued operating disclosures with older external financing markers;
      conflicting or unsupported current figures are carried as gaps rather than normalized.
    claimRefs: [CO001, CO003, CO004, CO005, CO006, CO010, CO015]
  - id: TO002
    title: Leadership and founder table
    columns:
      - Person
      - Current role
      - Public background / remit
      - Coverage signal
      - Key-person / governance note
    rows:
      - ["Amitava Saha", "Managing Director & CEO", "Founder; about-us page says he previously served as COO at FirstCry.com and earlier worked at BrainVisa Technologies.", "Founder and chief executive are clearly identified on company pages.", "High key-person dependence because the public narrative still centers on his operating history."]
      - ["Mohit Sardana", "Chief Executive Officer – B2C", "Homepage news item dated 9 Sep 2025 and the current leadership page both place him over the B2C business.", "Freshest retained leadership change in the pool.", "Role suggests functional specialization as XpressBees scales B2C separately from broader group leadership."]
      - ["Uday R. Sharma", "Chief Business Officer, B2B, 3PL and Cross Border", "Leadership page ties one executive to three growth vectors outside core B2C parcel delivery.", "Shows explicit ownership for enterprise and international lines.", "Concentration of multiple growth levers under one leader warrants diligence on span and succession."]
      - ["Ajoy Salve", "Chief HR and Administration Officer", "Named on the current leadership page and also visible through recent LinkedIn updates.", "Signals a formal people and admin leadership layer.", "Useful for scale-readiness, but not a substitute for disclosed board oversight."]
      - ["Ankush Chugh", "Chief Operating Officer-B2C", "Leadership page presents a dedicated B2C operating counterpart beneath the broader founder-led structure.", "Suggests operating depth beneath the founder and CEO-B2C roles.", "Retained sources show operating titles, but not reporting lines, board seats, or committee accountability."]
    notes: >-
      Restricted to founder and selected named operators on retained public surfaces; board
      composition and a complete executive roster remain undisclosed in this evidence set.
    enumerationScope:
      coverage: partial
      basis: >-
        Restricted to founder and named C-suite operators visible on XpressBees about-us and
        LinkedIn surfaces; the retained sources do not disclose a full board or complete
        executive register.
    claimRefs: [CO001, CO012, CO013, CO014]
  - id: TO003
    title: Stakeholder or investor map
    columns:
      - Stakeholder
      - Role in cap table / relationship
      - Public importance signal
      - Latest retained marker
      - Diligence ask
    rows:
      - ["Teachers’ Venture Growth", "Series G lead investor", "Led the latest confirmed primary round at the current retained $1.4B valuation marker.", "Nov 2023 Series G", "Confirm current ownership, board rights, and remaining follow-on appetite."]
      - ["Khazanah Nasional", "Secondary buyer", "Associated with a $40M secondary that repriced the company ahead of the Series G.", "Apr 2023 secondary", "Confirm whether the position remains strategic or purely financial."]
      - ["Blackstone Growth", "Series F lead investor", "Part of the round that put XpressBees into unicorn territory.", "Feb 2022 Series F", "Confirm ownership percentage and any preference stack terms."]
      - ["TPG Growth", "Series F lead investor", "Named alongside Blackstone and ChrysCapital in the unicorn round.", "Feb 2022 Series F", "Clarify whether board rights or veto rights still attach."]
      - ["ChrysCapital", "Series F lead investor", "Named as one of the key growth investors in the 2022 round.", "Feb 2022 Series F", "Confirm present stake after secondary activity and later fundraising."]
      - ["Investcorp", "Prior institutional backer", "Named by both the company and Multiples among major backers.", "2020 to 2022 retained references", "Confirm current holding and any liquidity taken in later transactions."]
      - ["Norwest Venture Partners", "Prior institutional backer", "Appears across the company and Multiples investor lists.", "2020 to 2022 retained references", "Verify whether the fund still holds or has partially exited."]
      - ["Gaja Capital", "Early growth backer", "Led the Nov 2020 Series E that preceded the unicorn round.", "Nov 2020 Series E", "Reconstruct dilution path from Series E to the latest cap table."]
      - ["Alibaba", "Early strategic / financial backer", "Still cited on the company’s public investor list.", "Current about-us page", "Confirm legal holder and whether any prior secondary sales reduced the position."]
      - ["SAIF / Peak XV lineage", "Early investor", "Company still cites SAIF among marquee investors.", "Current about-us page", "Clarify current holder naming and whether legacy entities still own shares."]
      - ["CDH Investments", "Early investor", "Listed on the company page among strategic capital providers.", "Current about-us page", "Confirm current ownership and information rights."]
      - ["Valiant", "Early investor", "Listed on the company page among early backers.", "Current about-us page", "Confirm if the stake is still current or was recycled in later secondaries."]
    notes: >-
      Exhaustive only for investor names explicitly visible in the retained public sources; it
      does not establish exact present-day ownership percentages, governance rights, or dilution.
    enumerationScope:
      coverage: exhaustive
      basis: >-
        Compiled exhaustively from investor names explicitly listed on the XpressBees about-us
        page and in the retained Multiples and Economic Times funding summaries.
    claimRefs: [CO006, CO007, CO008, CO009]
