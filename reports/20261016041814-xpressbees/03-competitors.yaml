  - id: TP002
    title: Feature / capability matrix
    columns:
      - Buying criterion
      - XpressBees evidence
      - Alternatives in assigned pool
      - Implication
    rows:
      - ["Nationwide e-commerce reach", "19,000+ pin codes, same-day in 50+ cities, next-day across 8,500+ pin codes", "Direct-peer parity not proved in assigned pool", "XpressBees has the clearest public reach disclosure in this pool"]
      - ["Reverse logistics", "End-to-end return and RTO management; ~18,000 pincodes on blog coverage", "Rivals named, but equivalent retained evidence absent", "Reverse logistics is clearly a buyer criterion, not a proven XpressBees exclusive"]
      - ["Warehousing / 3PL", "4,500+ fulfillment centers across 40+ cities; 3PL called out in company/about sources", "Direct-peer comparison unresolved", "Coverage breadth is evidence-backed only for XpressBees in this pool"]
      - ["B2B express / cross-border", "Leadership split and third-party profile both show B2B and cross-border expansion", "Blue Dart and Delhivery overlap is signaled, not fully profiled", "Supports breadth-led positioning instead of a pure last-mile niche"]
      - ["Platform integrations / payments", "Amazon India, Flipkart, WooCommerce, Shopify, Shiprocket, Nimbus Post; COD and prepaid", "Competitor integrations not retained", "Integrations can raise switching friction, but peer parity is unproven here"]
      - ["Tracking / automation", "AI-powered tracking, route optimization, automated sorters", "Peer technology parity unresolved", "Tracking and automation appear to be table stakes in competitive buying decisions"]
    notes: >-
      Unsupported competitor cells are marked as unresolved rather than inferred; the retained evidence is deep on
      XpressBees capabilities but thin on equivalent public disclosures from rivals.
    claimRefs: [CP003, CP004, CP009, CP010, CP011]
  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - Pricing lens
      - Evidence-backed signal
      - What is still unknown
      - Implication
    rows:
      - ["XpressBees base commercial model", "Netfigo says XpressBees charges per-shipment fees for last-mile delivery, express cargo, and cross-border logistics", "No public rate card retained", "Packaging appears shipment-based across multiple service lines"]
      - ["Aggregator channel rates", "ET says Delhivery, Ecom Express and Xpressbees raised shipment prices by 35-40% for aggregators", "Historical event, not a current list price", "Direct peers can coordinate or at least match rate moves when channels are under pressure"]
      - ["Official XpressBees price posture", "Company pages describe the service as cost-effective and capital-efficient", "No realized pricing, discounting, or margin disclosure", "Public messaging competes on value but does not prove price leadership"]
      - ["Status-quo substitute benchmark", "Netfigo's origin story calls Blue Dart expensive and India Post unreliable", "Historical anecdote rather than current market quote", "XpressBees originally positioned against both premium and low-reliability substitutes"]
    notes: >-
      Exact peer-by-peer public pricing remains a material gap because the assigned pool did not retain current rival
      price cards, contract models, or discount structures.
    claimRefs: [CP002, CP008, CP014, CP015]
figures:
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      Ordinal 1-5 scoring from retained assigned-pool evidence places XpressBees highest on documented service breadth,
      with Delhivery and Ecom Express as the clearest direct peers and Blue Dart / Shadowfax as adjacent pressure points.
    data:
      xAxis:
        label: Service breadth / multimodality
        min: 1
        max: 5
        lowLabel: Narrow / single-lane
        highLabel: Broad / multimodal
      yAxis:
        label: Public competitive signal strength in assigned pool
        min: 1
        max: 5
        lowLabel: Thin evidence
        highLabel: Strong evidence
      points:
        - label: XpressBees
          x: 5
          y: 5
          detail: Broad B2C, B2B, 3PL, reverse-logistics, cross-border, warehousing, and integration coverage is documented in multiple retained sources.
        - label: Delhivery
          x: 4
          y: 4
          detail: Named direct rival in ET rate coverage and in Netfigo's B2B expansion comparison, but with thinner retained service detail than XpressBees.
        - label: Ecom Express
          x: 3
          y: 4
          detail: Clear direct peer in ET and Netfigo coverage, with active fundraising and quick-commerce expansion signals but less retained breadth detail.
        - label: Blue Dart
          x: 4
          y: 2
          detail: Premium incumbent and broader-customer rival signal is present, but current retained evidence is thin and partly historical.
        - label: Shadowfax
          x: 3
          y: 3
          detail: Similar logistics-page signal plus IPO/funding evidence supports an adjacent high-growth peer role.
        - label: Local / legacy substitutes
          x: 1
          y: 2
          detail: India Post and informal local partners appear as low-structure or low-reliability alternatives rather than full multimodal peers.
    approximationNotes: >-
      X and Y are evidence-bounded ordinal scores, not market-share or NPS measures; they reflect only retained sources
      in the assigned pool and mark thinly documented rivals lower on evidence strength rather than weaker in the market.
    claimRefs: [CP005, CP006, CP007, CP012, CP014, CP015]
