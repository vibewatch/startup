  evidenceGaps:
    - type: missing-source
      severity: material
      topic: security-controls
      missingEvidence: Independent evidence of security certifications, privacy controls, incident response practices, and uptime or status history.
      whyItMatters: Public product pages make trust-sensitive claims, but investors cannot underwrite platform resilience or data-handling risk from company copy alone.
      diligencePath: Request current security certifications, privacy governance documents, incident logs, and any customer-facing status or postmortem records.
      relatedQuestionRefs: [QE007, QE008]
    - type: missing-source
      severity: material
      topic: developer-signal
      missingEvidence: Public developer or practitioner evidence showing API adoption, release cadence, documentation maturity, or integration depth.
      whyItMatters: Without an external developer signal, it is difficult to judge implementation burden or whether integrations are a repeatable moat versus a sales claim.
      diligencePath: Request API documentation, partner onboarding materials, integration usage metrics, public changelog evidence, and sample merchant implementation timelines.
      relatedQuestionRefs: [QE005, QE006]
    - type: private-evidence-only
      severity: material
      topic: service-reliability
      missingEvidence: Cohort-level on-time delivery, failed-delivery, return-cycle, and reconciliation-accuracy metrics by product line and geography.
      whyItMatters: Network scale only matters if execution quality is durable across regions, customer segments, and reverse-logistics flows.
      diligencePath: Review monthly operating dashboards, top-customer SLA scorecards, and exception-rate trends for B2C, B2B, and returns operations.
      relatedQuestionRefs: [QE001, QE004, QE007]
