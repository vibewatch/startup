      - number: '2.3'
        title: 采用约束与模型风险
        blocks:
          - type: paragraph
            body: >-
              反证和增长叙事同样重要。Tracxn 和 Economic Times 将 XpressBees 放在拥挤的竞争环境中，竞争者仍包括 Delhivery、Ecom Express 和
              Shadowfax；与此同时，CEOs of Bharat
              的文章将公司描述为资本密集、利润率承压，但收入仍在增长。这些约束很关键：买家在意可靠性、覆盖范围和退货处理，而投资者需要证明这些服务水平不靠长期补贴也能交付。最大的剩余缺口不是需求是否存在，而是公开证据能否按细分市场、地域和服务线，把广义印度物流增长与
              XpressBees 能够盈利占有的窄市场区分开来。在这点披露之前，市场故事可信，但对投资判断而言仍不够具体。
            claimRefs:
              - CM013
              - CM014
              - CM015
              - CM016
