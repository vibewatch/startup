      edges:
        - from: n1
          to: n2
          label: 订单产生揽收 / 仓储需求
        - from: n2
          to: n3
          label: 履约进入干线运输和分拣
        - from: n3
          to: n4
          label: 网络执行产生配送事件
        - from: n4
          to: n5
          label: 成功配送或逆向流转
        - from: n5
          to: n6
          label: 服务事件转化为可计费收入，扣除服务成本
    approximationNotes: 节点内容是留存公开来源中的经营描述，不是从 GMV 到收入、或从收入到毛利的量化桥接。
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI005
      - CI010
  - id: FE001
    title: 公开披露的产品架构图
    type: stack
    summary: 公开证据显示，这是一套分层架构：商户集成接入编排软件，软件再把订单量导入分布式实体网络；配送、退货与对账由同一条流程串联。
    data:
      layers:
        - label: 商户接口
          detail: 订单从电商平台、店铺和商户系统进入。
          modules:
            - label: 支持的集成
              detail: Amazon India、Flipkart、WooCommerce、Shopify、Shiprocket、Nimbus Post
            - label: 支付方式
              detail: 记录的流程接受预付和 COD 订单
        - label: 编排与可视化
          detail: 公开材料强调软件驱动的控制，而不是纯硬件网络。
          modules:
            - label: 路由与追踪
              detail: 路线优化算法和 AI 驱动的追踪系统
            - label: 报告闭环
              detail: 配送和退货事件之后进行对账和报告
        - label: 实体执行网络
          detail: 订单量经过分布式设施和运输环节处理。
          modules:
            - label: 分拣与履约
              detail: 10+ 台自动分拣机，以及覆盖 40+ 个城市的 4,500+ 个履约中心
        - label: 合作伙伴执行层
          detail: 公开来源显示，公司通过轻资产合作伙伴模式扩展规模。
          modules:
            - label: 运输环节
              detail: 揽收、首公里、干线运输和本地末端配送均由合作伙伴执行
            - label: 对快递合作伙伴的依赖
              detail: Multiples 将其描述为拥有 27 家快递合作伙伴的轻资产模式
        - label: 支付与售后闭环
          detail: 发货后，运营流程包含对结算敏感且异常较多的环节。
          outputs:
            - label: COD and prepaid handling
              detail: Secure payment-mode handling is part of the documented workflow
            - label: Reverse logistics
              detail: Returns and RTO management
            - label: Reporting
              detail: Reconciliation and reporting close the shipment loop
        - label: 专业化垂直领域
          detail: 这套架构超出标准包裹配送，延伸到特定行业的服务线。
          outputs:
            - label: B2B express
              detail: Time-definite movement for bulk and high-value shipments
            - label: Healthcare / pharma
              detail: Cold-chain and compliance-sensitive transport claims
    claimRefs:
      - CE005
      - CE006
      - CE007
      - CE008
      - CE009
      - CE010
      - CE012
      - CE013
      - CE016
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 现有证据指向一条由商户主导的采用闭环：从电商需求出发，通过履约和末端覆盖扩张，再借助逆向物流和 B2B 线路深化。
    data:
      items:
        - label: 创始阶段的内部需求
          actor: FirstCry
          stage: 孵化
          tone: neutral
          touchpoints:
            - 为 FirstCry 配送提供内部物流支持
            - 剥离前已有真实生产发货的历史证明
        - label: 第三方信任建设
          actor: 电商平台
          stage: 早期销售
          tone: risk
          touchpoints:
            - 潜在客户曾质疑为何应选择 XpressBees，而不是更大的品牌
            - 超越 FirstCry 扩张需要建立信任
        - label: 广泛获取商户
          actor: 零售商、电商平台和 D2C 品牌
          stage: 获客
          tone: positive
          touchpoints:
            - 依靠关系驱动销售
            - 针对不同商户需求定制物流方案
        - label: 履约和仓储
          actor: 商户运营团队
          stage: 部署
          tone: positive
          touchpoints:
            - 4,500+ 个履约中心
            - 覆盖 40+ 个城市的仓库
        - label: 末端和高端配送
          actor: 终端客户和商户 CX 团队
          stage: 日常使用
          tone: positive
          touchpoints:
            - 每天在 19,000+ 个邮编区域配送数百万件货物
            - 覆盖 50+ 个城市和 1,700+ 个邮编区域的当日达服务
        - label: 扩张与黏性闭环
          actor: 逆向物流和 B2B 发货方
          stage: 扩张
          tone: neutral
          touchpoints:
            - 覆盖 18,000+ 个邮编区域的逆向物流
            - B2B Surface Xpress 在 2026 年 9 月和 FY27 Q2 创下纪录收入
    approximationNotes: 这是一条根据官方服务描述和一份独立历史叙述拼出的概念旅程；它展示采用触点和扩张闭环，不代表经验证的转化率或分部权重。
    claimRefs:
      - CU001
      - CU004
      - CU005
      - CU007
      - CU010
      - CU012
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 剩余风险集中于资本效率、网络执行，以及合规和依赖集中度的证据缺口。
    data:
      columns:
        - 严重影响
        - 高影响
        - 中等影响
      rows:
        - label: 已经可见
          values:
            - label: 经营杠杆尚未验证
              detail: FY24 报告中已经能看到亏损扩大。
            - label: 欺诈 / 冒充信号
              detail: 官方合作伙伴警示横幅表明信任控制存在现实问题。
            - label: 服务线过度扩张
              detail: 覆盖 B2B、B2C、逆向物流、跨境和仓储，增加了执行难度。
        - label: 高可能性
          values:
            - label: 现金消耗 / 盈利能力
              detail: FY24 亏损扩大，而扩张仍在继续。
            - label: 末端 / 退货执行
              detail: 公司材料甚至承认服务复杂度。
            - label: 合作伙伴欺诈 / 信任流失
              detail: 官方欺诈警示说明需要持续警惕。
        - label: 可能性偏高
          values:
            - label: 规模带来的成本上升
              detail: 网络增长可能快于路线和设施效率的提升。
            - label: 配送伙伴执行不一致
              detail: 没有 KPI 证据时，很难统一标准化庞大的现场网络。
            - label: 自动化回本滞后
              detail: 材料描述了缓解措施，但没有展示已实现的结果指标。
        - label: 中等可能性
          values:
            - label: 融资可见性缺口
              detail: 材料中最近一次具名融资信号仍来自 2023 年。
            - label: 集成 / 服务线过度扩张
              detail: Trackon 集成加上多条物流服务线，增加了协调负担。
            - label: 客户 / 合作伙伴集中度未知
              detail: 指定证据没有披露公开集中度数据。
        - label: 监测项
          values:
            - label: 管理层带宽
              detail: 广泛增长和整合需要管理团队持续保持运营节奏。
            - label: 缓解措施成效证明滞后
              detail: 公开材料描述缓解措施的速度，快于披露结果 KPI 的速度。
            - label: 披露纪律
              detail: 合规、流动性和集中度方面的公开证据稀薄，使风险监测负担居高不下。
        - label: 可能性较低但后果严重
          values:
            - label: 监管 / 诉讼意外
              detail: 指定来源中没有主要合规材料包。
            - label: 安全 / 隐私披露缺口
              detail: 材料中没有隐私安全认证证据。
            - label: 自动化交付不达预期
              detail: 材料描述了缓解措施，但没有独立展示结果指标。
    approximationNotes: 该序数矩阵基于来源中的可能性和影响信号，是排序辅助工具，不是量化概率模型。
    claimRefs:
      - CR003
      - CR004
      - CR007
      - CR009
      - CR011
      - CR013
      - CR014
  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 推荐逻辑从已展示的经营规模出发，经过过时的定价和未解决的经济性问题，最终得出有条件的继续研究结论。
    data:
      nodes:
        - id: scale
          label: 经营规模
          detail: 公司来源描述了覆盖全国、提供多种服务的物流网络。
        - id: signal
          label: 2026 年经营信号
          detail: 公司称 B2B 月度和季度收入创纪录，但没有给出数值或利润率。
        - id: stale-mark
          label: 过时的定价估值
          detail: 最近一次有证据支持的定价融资轮是 2023 年 11 月的 Series G。
        - id: comp-gap
          label: 可比缺口
          detail: 历史收入倍数 5.2x 高于留存的上市公司参考值。
        - id: missing-inputs
          label: 缺少投资判断输入
          detail: 当前经审计的经济数据、净债务、集中度和优先权条款均不可得。
        - id: decision
          label: 继续研究
          detail: 只有在当前分母和证券条款得到验证后，才能设定入场纪律。
      edges:
        - from: scale
          to: signal
        - from: signal
          to: stale-mark
        - from: stale-mark
          to: comp-gap
        - from: comp-gap
          to: missing-inputs
        - from: missing-inputs
          to: decision
    approximationNotes: 该流程是定性的，不分配概率、转化率或绝对估值。
    claimRefs:
      - CV001
      - CV003
      - CV005
      - CV009
      - CV010
      - CV012
      - CV013
      - CV015
      - CV016
