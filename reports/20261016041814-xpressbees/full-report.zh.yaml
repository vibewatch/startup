              - CI008
              - CI009
              - CI011
              - CI012
              - CI013
              - CI014
      - number: '4.4'
        title: 财务结论
        blocks:
          - type: paragraph
            body: >-
              从财务角度看，XpressBees
              是一家需求侧相关性可信、但投资判断透明度不完整的规模化物流网络。证据支持其服务组合广、运营足迹可观，但公开记录仍主要依赖估值快照、公司能力主张和选择性亏损披露，而不是当前现金、债务或分部利润率透明度。因此，可以从收入模型看这家公司，却还不能充分判断利润路径或资金支撑期限。投资工作下一步需要的材料很明确：经审计的
              FY25/FY26 报表、当前现金和债务、按客户及服务线拆分的收入集中度，以及扣除退货、货到付款和支持成本后的真实单票经济性。
