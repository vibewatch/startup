      - number: '3.3'
        title: 价格压力可见，但竞争对手透明价目表缺失
        blocks:
          - type: paragraph
            body: >-
              公开定价证据很少，而且大多是间接信息。Netfigo 称 XpressBees 按票收费；ET 报道 Delhivery、Ecom Express 和 XpressBees 同时将向聚合商收取的运费提高了
              35-40%，说明渠道冲突活跃，行业也存在一定价格纪律。XpressBees
              官方页面反复将公司宣传为高性价比，但没有公布价目表或实际经济数据。因此，尽调存在一个实际缺口：保留证据更清楚地支持其服务组合广度和服务质量主张，而不是支持由价格驱动的护城河，或支持直接同业之间完全可比的定价矩阵。
