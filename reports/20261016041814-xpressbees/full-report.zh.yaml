            body: >-
              保留来源中最清晰的外部融资锚点仍是 2023 年 11 月：Multiples 和 Economic Times 都将 XpressBees 与 Teachers’ Venture Growth 参与的 $80
              million Series G 联系起来，对应估值 $1.4 billion。更早的外部节点显示，公司在 2022 年 2 月达到独角兽地位，并在 2023 年 4 月支持了一笔由 Khazanah
