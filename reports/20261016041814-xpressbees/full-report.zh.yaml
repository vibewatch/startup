        blocks:
          - type: paragraph
            body: >-
              相比独立治理披露，领导层信息在公司自有页面上更充分。Amitava Saha 仍是核心经营者，公司关于我们页面继续将其 FirstCry 和 BrainVisa
              经历作为创始人与市场匹配度的核心依据。保留证据还显示，运营领导层已有更新，包括负责 B2C 业务的 CEO Mohit Sardana，以及
              HR、B2B、3PL、跨境、工程和干线运输等职能的负责人。不过，现有信息更偏管理层而非董事会：公开页面列出了高管，却没有提供董事会名单、委员会架构或其他治理细节，后期投资者在把领导层监督视为充分尽调前仍会需要这些信息。
