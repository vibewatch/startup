        title: 图表
        blocks:
          - type: callout
            title: 商家运营团队掌握采购决策
            body: 指定来源始终描述揽收、仓储、货到付款处理、逆向物流和对账等商家侧流程，说明商业决策在运营和供应链负责人手中，而不是终端消费者手中。
