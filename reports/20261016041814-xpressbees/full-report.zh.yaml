              倍数，并要求有最新经审计收入及可信的盈利路径；乐观区间只有在增长、利润率和多元化得到验证后才允许溢价。由于当前收入分母、净债务、现金余额和优先股堆叠均不可得，因此不计算美元估值。这样可以避免把过时的 2023
              年收入数字伪装成 2026 年 run rate。
            claimRefs:
              - CV002
              - CV003
              - CV005
              - CV008
              - CV009
              - CV016
