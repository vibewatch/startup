  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 服务市场边界与采购流程
        blocks:
          - type: paragraph
            body: >-
              现有证据支持将 XpressBees 的市场定义为外包商业物流，而不是泛运输。公司自有页面始终将业务覆盖到首公里揽收、分拣、干线运输、末端配送、逆向物流、仓储、对账、B2B
              货运和跨境运输。因此，相关支出池包括物流运营预算，用于把库存从商家或企业起点运到零售端或终端客户。采购决策因此掌握在卖家、平台运营方、零售供应链团队和企业分销负责人手中，而不是终端消费者手中。同一批证据还显示，XpressBees
              同时服务多种流程：高订单量电商履约、D2C 发货、B2B 大宗货运和售后退货。这种广度有利于估值，因为公司争夺的是一整套服务中可重复的流程支出；但相比单一品类的快递或仓储企业，也更难干净地划定市场。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM005
