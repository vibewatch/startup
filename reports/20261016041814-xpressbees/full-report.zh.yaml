              - CM005
              - CM006
      - number: '2.2'
        title: 规模测算视角与采用驱动因素
        blocks:
          - type: paragraph
            body: >-
              公开证据只支持分层测算，而不是干净的自上而下 TAM/SAM/SOM。StartupTalky 引用 2021 年约 $250 billion 的印度物流市场，并称到 2025 年还有 $380 billion
              的增长潜力；XpressBees 自有博客则从网购者增长、当日达预期，以及节日高峰、退货和库存复杂度带来的运营痛点来解释需求。Multiples 又提供了自下而上的运营视角：超过 60,000 个客户、覆盖
              2,000 多个城市和城镇、每日订单超过 2.5 million。合并来看，这些来源足以说明可服务需求庞大且仍在扩张，买家采用第三方物流是为了提升速度、覆盖范围和营运资本效率。但它们不足以用统一口径隔离
              XpressBees 当前可服务的支出，因此估值中使用的任何市场规模数字，除非有申报文件或注明日期的公司 KPI 演示支持，都只能视为方向性判断。
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
