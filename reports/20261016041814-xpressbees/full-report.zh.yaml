      - number: '3.4'
        title: 同业融资活跃且自建物流带来风险，限制了持续性
        blocks:
          - type: paragraph
            body: >-
              因此，护城河是真实存在但有条件的。XpressBees 有证据支持的覆盖范围、运输模式和集成广度，但同一批来源也显示，市场仍在竞争，并且容易商品化。ET 称 Shadowfax 在获得新融资后准备
              IPO，Ecom Express 计划进行配股并拓展即时零售；Netfigo 则称平台整合、Amazon 的自建网络和价格压力，损害了与 Ecom Express 承压相同的经济性。换句话说，XpressBees
              似乎比纯电商承运商有更好的对冲，但指定来源不足以支持它已经摆脱价格竞争或平台依赖的判断。
            claimRefs:
              - CP012
              - CP013
              - CP015
