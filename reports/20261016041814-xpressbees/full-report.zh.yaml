    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与运营范围
        blocks:
          - type: paragraph
            body: >-
              保留的公开来源始终将 XpressBees 定位在 Pune，并将公司成立时间指向 2015 年。公司最初服务
              FirstCry，随后发展为独立的多产品平台，定位是一家非上市物流服务商。本文审阅的公司自有页面反复宣传同一套核心运营能力：快递包裹配送、逆向物流、B2B 运输、仓储或履约，以及跨境服务。更重要的尽调提醒不是
              XpressBees 是否具备规模，而是当前公司页面使用不同口径和范围来描述规模。因此，本章认为其网络广度总体方向明确，但对部分封面指标保留未决状态，不将它们强行统一成虚假的精确值。
