          - type: paragraph
            body: >-
              资本充足性仍是投资判断的核心缺口。独立来源仍将最近明确披露的非上市估值锚定在约 $1.4 billion，并将最近完成的融资锚定在 2023 年 11 月的 Series
              G。所以，当前流动性只能从经营结果和网络扩张姿态中推断，而不是由一笔最新、已记录的融资来确认。不利信号是，近期一篇独立文章称 FY24 经营收入为 INR 2,831.3 crore、净亏损 INR 199.9
              crore，并明确将短缺归因于扩张、运营成本和竞争压力。结合管理层反复强调全国覆盖、履约密度和资本效率，最合理的图景是：公司仍在大力投资扩张，但尚未公开证明增长能够靠自身资金支撑。
