  - id: TV003
    title: 乐观、基准与悲观入场框架
    columns:
      - 情景
      - 示例性入场筛选
      - 必要假设
      - 概率信号
      - 下行触发条件
    rows:
      - - 乐观
        - 经验证的当前收入的 2.5x-3.5x
        - 增长优于公开可比公司、现金流为正、客户多元化、优先权条款干净
        - 经审计的指标和可信的上市路径
        - 没有经验证的利润率优势，溢价仍然存在
      - - 基准
        - 经验证的当前收入的 2.0x-2.5x
        - 温和增长、清晰的盈利路径、债务和优先权条款可控
        - 当前审计能对增长和亏损相互核对
        - 现金消耗或集中度仍然偏高
      - - 悲观
        - 经验证的当前收入的 1.3x-2.0x，或不投资
        - 增长疲弱、持续亏损、融资悬顶，或退出延迟
        - 盈利前需要下轮融资或融资支持
        - 流动性承压，或优先股堆叠不利
    notes: 这些区间是分析师用来约束入场纪律的框架，边界来自引用的公开参考倍数，并非对 XpressBees 当前价值的估计；没有当前收入、现金、债务和股权结构表数据，就无法支持绝对估值。
