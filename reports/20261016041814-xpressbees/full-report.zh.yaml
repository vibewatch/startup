            body: >-
              保留证据无法证明退出准备度：指定来源池中没有当前申报文件、获批上市时间表、经审计的 FY26 账目或证券条款。眼下的尽调材料包应包括经审计的 FY26 和 FY27
              年初至今收入、EBITDA、经营现金流、现金和债务；剔除收购后的自然增长；客户集中度；分部及单票单位经济性；以及包含清算优先权的完全摊薄股权结构表。投资论点破裂的触发因素包括：在经济性没有改善时仍按接近过时标记进行下一轮定价融资；尽管收入创纪录却持续亏损；或证据显示网络规模没有转化为现金生成。单纯降低入场价格，无法弥补运营证据缺失。
