      description: Faster leverage growth creates liquidation, conduct, and customer-loss events in down markets
    - id: r5
      label: Higher complaint load
      description: Support queues and grievance handling come under pressure during volatile markets and forced exits
    - id: r6
      label: PAT and margin pressure
      description: FY26 already showed profit decline despite higher NOI as concentration and costs collided
