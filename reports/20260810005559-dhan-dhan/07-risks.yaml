- id: dependency-cyber-and-reputation-exposure
  title: Dependency, Cyber, and Reputation Exposure
  body: 'The third risk block is external dependency and its reputational spillover. Dhan depends on SEBI policy, NSE/BSE/MCX trading venues, CDSL and NSDL depository plumbing, BSE StarMF execution rails, banks and payment systems, and mobile-app distribution channels that it does not control. Market studies flag this category directly: Mordor highlights exchange-infrastructure concentration and cyber-resilience gaps as structural broker risks, while SEBI’s own public surfaces show cybersecurity and cloud-resilience requirements are still evolving for regulated entities. Public reputation evidence is also mixed rather than clean. CNBC says Dhan kept gaining active-client share in a shrinking FY26 market, which is positive, but external complaint tracking exists on Chittorgarh and the cached Apple rating sample is too thin to dismiss customer-friction risk. Importantly, the cached official materials disclose a lot about customer alerts, pledge OTPs, and liquidation mechanics, but much less
    about external cyber assurance, incident history, or complaint-resolution ratios.'
