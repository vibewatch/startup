- id: execution-mitigants-and-thesis-breakers
  title: Execution Mitigants and Thesis-Breakers
  body: 'The mitigating case is real but incomplete. Dhan still appears liquid, profitable, and rated, and it has public grievance paths, investor-charter SLAs, and explicit risk disclosures that many younger brokers do not surface as clearly. But those mitigants do not remove the main investment question: whether Raise can diversify quickly enough while carrying higher marketing spend, team expansion, and a still-trader-centric product posture. The best public watchpoints are therefore not generic. They are the F&O revenue share, MTF growth versus diversified fee growth, active-client share in a slower market, and actual adherence to grievance and service timelines. The key missing evidence is also concrete: public sources still do not disclose complaint ratios, forced-square-off incidence, MTF delinquency, current board structure, or named external cyber certifications. Until those appear, the risk chapter should be read as manageable but clearly not de-risked.'
