- id: leverage-margin-and-loss-transmission
  title: Leverage, Margin, and Loss Transmission
  body: 'The second major risk cluster comes from how Dhan monetizes active traders and manages leverage. Official pages show no margin for plain delivery trades, but they also market MTF up to Rs 1 crore, instant pledge margin on 1450+ stocks, and 5X exposure cues across app-store copy. Dhan’s own RMS documents are detailed and unusually tough: timer-based intraday square-offs start before the close, positions can be reduced when MTM crosses 80%, and coverage below 20% can trigger liquidation, including MTF holdings. Those controls mitigate broker credit risk, but they also raise customer-outcome and complaint risk if markets gap, liquidity disappears, or inexperienced traders use the leverage tooling too aggressively. The MTF book reaching Rs 505 crore by March 2026 matters for the same reason. It is still small versus the industry total, but it is growing faster than the public evidence for non-broking fee diversification, so leverage can become both a volume support and a downside amplifier.'
