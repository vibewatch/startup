chapter:
  number: 7
  title: Risks
  summary: 'The core risk is concentration: public FY26 coverage says Raise Securities still derived about 70% of net operating income from retail futures and options just as SEBI-driven derivative reforms were compressing activity across the industry. The same file also shows a fast-growing Rs 505 crore MTF book and unusually explicit RMS liquidation powers, which help preserve broker discipline but increase conduct, complaint, and customer-outcome risk during volatility. Near-term liquidity and ratings remain supportive, yet the weakest disclosed areas are complaint ratios, cyber assurance, governance depth, and hard proof that non-broking revenue is diversifying quickly enough to offset the next regulatory hit.'
sections:
- id: regulatory-overhang-and-earnings-concentration
  title: Regulatory Overhang and Earnings Concentration
  body: 'Raise / Dhan is not dealing with a generic brokerage risk stack; it is dealing with a very specific concentration problem. The public FY26 record says around 70% of net operating income still came from retail F&O and about 79% from securities broking overall, so the exact segment facing the sharpest policy tightening remains the main earnings engine. That concentration already showed up in FY26 results: net operating income grew to roughly Rs 905 crore, but PAT still fell about 20% to roughly Rs 326 crore as SEBI’s derivatives clampdown and heavier expansion spending hit profitability. ICRA’s industry read-through is also explicitly adverse for discount brokers with high index-options exposure, with possible FY2026 industry NOI decline of 5-10% and margin compression of up to 500 bps. The regulatory perimeter itself is clear and currently compliant, but the risk is not licensing survival today; it is the speed at which revenue diversification can outrun the next round of derivative-volume
    pressure.'
