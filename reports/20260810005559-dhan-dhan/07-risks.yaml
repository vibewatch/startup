- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - F&O concentration
    - Share of NOI from retail F&O and securities broking
    - F&O share stays near 70% or rises, or broking share stays near 79% after another full year of diversification efforts
    - Re-rate the business as structurally exposed to derivative policy rather than temporarily concentrated
  - - MTF-led leverage build
    - MTF book growth versus diversified fee growth
    - MTF book keeps compounding faster than non-broking revenue without public delinquency disclosure
    - Demand leverage-book quality data before assigning premium to growth
  - - Active-client momentum
    - NSE active-client share and rank
    - Share stalls below mid-single digits or rank remains stuck near ninth while industry growth normalizes
    - Treat acquisition spend as less efficient and lower confidence in scale thesis
  - - Complaint and SLA performance
    - Grievance aging, SCORES cases, and support backlogs
    - Any evidence that 15-day or 21-day public commitments are routinely missed
    - Escalate regulatory and churn risk rating immediately
  - - Cyber assurance
    - Named external certification or incident disclosure
    - No external assurance surfaces while SEBI cyber expectations tighten further
    - Keep cyber risk high and require formal diligence before underwriting premium multiple
  - - Liquidity and ratings
    - Cash buffers, unused lines, and ICRA profile
    - Meaningful deterioration in cash buffer, downgrade, or short-term paper stress signal
    - Shift thesis from cyclical pressure to funding-risk review
  notes: Thresholds are analyst-defined monitors derived from the public evidence set rather than company commitments. Each trigger is intended to be binary enough to support an investment committee refresh.
