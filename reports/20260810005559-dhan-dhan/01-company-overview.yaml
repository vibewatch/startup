- id: founders-mission-and-ecosystem
  title: Founders, Mission, and Ecosystem Expansion
  body: 'The company’s founding narrative is more recent than the legal shell. Media coverage around the unicorn round attributes Raise Financial Services to a 2021 founding team led by former Paytm Money executive Pravin Jadhav, alongside Alok Pandey, Jay Prakash Gupta, and Raunak Rathi. Official copy on Dhan’s about page then frames the mission in product terms: build a technology-led platform for super traders and long-term investors rather than another generic brokerage app. What is notable in 2026 is that Raise is no longer only a single-broker story. Avendus and the group’s own ecosystem surfaces point to adjacent brands including Millions for investing, ScanX for research, Fuzz for AI-native financial answers, Filter Coffee for consumer media, and Upsurge for education. That broadening supports a financial-ecosystem thesis, but it also introduces a caveat: public governance disclosure has not kept pace with ecosystem complexity, so the strategic map is clearer than the formal control
    map.'
