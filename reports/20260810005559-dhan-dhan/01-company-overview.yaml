  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: board-governance
    missingEvidence: A current board roster, observer rights, and post-Series-B governance terms for Raise Financial Services.
    whyItMatters: Board control and investor protections determine key-person dependence and the real balance of power after the unicorn round.
    diligencePath: Request the latest cap-table summary, board list, and shareholder rights schedule from management or lead investors.
    relatedQuestionRefs:
    - QO009
    - QO025
    relatedTableRefs:
    - TO002
    - TO003
  - type: conflicting-data
    severity: material
    topic: cumulative-capital-raised
    missingEvidence: A clean, company-confirmed cumulative capital raised figure that reconciles the 2022 round, the 2025 Series B, and any secondary component.
    whyItMatters: Total capital raised is a cover metric and also frames dilution, capital efficiency, and room for future financing.
    diligencePath: Request a financing chronology with round dates, primary versus secondary split, and cumulative proceeds.
    relatedQuestionRefs:
    - QO024
    relatedTableRefs:
    - TO004
  - type: stale
    severity: minor
    topic: headcount-scope
    missingEvidence: A dated employee count split between Raise-wide workforce and Dhan-specific operating staff.
    whyItMatters: A group-level 550+ headcount figure is directionally useful but not enough to benchmark Dhan’s operating leverage.
    diligencePath: Ask management for current group headcount, Dhan-only headcount, and location split by function.
    relatedQuestionRefs:
    - QO008
    - QO023
    relatedTableRefs: []
