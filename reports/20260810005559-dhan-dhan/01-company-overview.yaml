- id: capital-base-and-unicorn-step-up
  title: Capital Base and Unicorn Step-Up
  body: The most important capital-markets fact in the public record is the October 2025 Series B. Avendus, The Economic Times, and Entrepreneur India align on a $120 million round that brought in Hornbill Capital, MUFG, BEENEXT, and a set of public-market investors. The same coverage anchors post-money valuation at roughly $1.2 billion or Rs 10,000 crore, making Raise a unicorn. Earlier reporting also points back to a 2022 institutional round of roughly $22 million at about a $150 million valuation, implying a sharp step-up over three years. The funding story is credible, but not perfectly complete. Public sources do not fully reconcile cumulative proceeds, secondary components, or post-round governance rights. That means the headline valuation is well supported, while the precise capital-stack mechanics remain under-disclosed. For later chapters, the safest canonical facts are round size, lead investors, valuation range, and stated use of proceeds toward ecosystem expansion rather than
    an exact total-raised number.
  claimRefs:
  - CO021
  - CO022
  - CO023
  - CO024
  - CO025
  tableRefs:
  - TO004
  figureRefs:
  - FO001
- id: scale-technology-and-open-gaps
  title: Scale, Technology, and Open Gaps
  body: 'Public scale and technology signals are directionally strong but still need careful labeling. Avendus says Dhan reached nearly one million active users within less than four years of launch, while the Google Play copy says the product is trusted by more than one million users and Dhan’s own pricing page claims more than one crore app downloads. Those are useful adoption indicators, but they are not interchangeable metrics. The technology evidence is also strong enough for overview use. Avendus and AWS both support the existence of the proprietary DEXT engine, with claims around sub-20 millisecond execution and AWS recognition for materially faster performance than industry benchmarks. DhanHQ’s documentation broadens the picture further by showing free trading APIs and a first-party MCP server. The open questions are more organizational than technical: exact board composition, clean cumulative total capital raised, and a dated Dhan-only workforce count remain unavailable in the public
    file.'
