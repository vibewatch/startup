tables:
- id: TV001
  title: Recommendation summary table
  columns:
  - Dimension
  - Assessment
  - Why this is the current view
  - What would change the view
  rows:
  - - Recommendation
    - track
    - The business is real and profitable, but current public evidence is not strong enough to underwrite a fresh buy at any price.
    - More disclosure on segment economics and round terms, or a clearly cheaper entry point.
  - - Confidence
    - medium
    - Public evidence covers funding, FY26 income, market share, and regulation, but not cap-table mechanics or full segment reporting.
    - Audited segment splits, complaint trends, and clearer governance disclosure.
  - - Risk rating
    - high
    - F&O concentration and regulatory volatility can change earnings power faster than the current round narrative implies.
    - Visible diversification away from F&O and another year of stable profitability.
  - - Valuation stance
    - fair
    - The Rs 10,000 crore round is supportable as a midpoint because FY26 profitability and share gains are real, but it is not an obvious bargain.
    - A lower entry price or new evidence that adjacent businesses are already material.
  - - Decision implication
    - Do not stretch above the last round on current evidence
    - Public data supports patience more than urgency.
    - Upgrade only if evidence improves faster than price.
  notes: 'Assessment is explicitly price-sensitive: this is not a company-quality score divorced from the October 2025 private mark.'
