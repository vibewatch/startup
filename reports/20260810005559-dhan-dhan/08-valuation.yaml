company:
  name: Dhan
chapter:
  number: 8
  title: Valuation
  summary: Public evidence supports Dhan as a genuinely profitable, still-growing discount broker whose October 2025 round priced Raise at about $1.2 billion or Rs 10,000 crore. FY26 income, client-share gains, and new-adjacent products argue that the last round is not fantasy pricing, but 70% F&O concentration, cyclical regulation, thin cap-table disclosure, and only partial peer comparability keep the chapter call at track with medium confidence and a fair valuation stance rather than a fresh buy recommendation.
sections:
- id: observable-anchor-and-call
  title: Observable anchor price and current recommendation
  body: 'The cleanest valuation anchor in the public file remains the October 2025 Series B rather than any hypothetical IPO narrative. Economic Times and Moneycontrol align on a $120 million financing led by Hornbill Capital that put Raise around $1.2 billion or Rs 10,000 crore post-money, while the same coverage points back to a much smaller 2022 round at roughly $150 million valuation. That step-up is large, but it is not unsupported by operating evidence: Raise Securities reported FY26 net operating income of Rs 904.9 crore and PAT of Rs 325.8 crore, leaving Dhan among the profitable new-age discount brokers even after a tougher derivatives regime. At the last round mark, the company traded at about 11.1x FY26 operating income and about 30.7x FY26 PAT. Those ratios are not obviously cheap, yet they are also not absurd for a still-growing, high-margin private broker. The real constraint is disclosure quality, because public sources still do not fully reconcile cumulative capital raised,
    liquidation preference overhang, or the precise segment mix behind the group story. That combination supports a price-sensitive track call with a fair stance, not a generic quality upgrade.'
