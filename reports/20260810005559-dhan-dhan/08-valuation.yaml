- id: why-the-call-does-not-upgrade
  title: Why the call does not upgrade to buy
  body: 'The anti-thesis is mostly about concentration and disclosure rather than about business existence. Public reporting says about 79% of FY26 income still came from broking and about 70% from retail F&O alone, while Pravin Jadhav acknowledged that regulatory changes hit close to 40% of trading-volume or revenue lines linked to derivatives. ICRA then adds the sector backdrop: a possible 5-10% industry NOI decline and up to 500 basis points of margin contraction in FY2026 as the post-crackdown reset works through the system. Outlook Business sharpens the adverse angle by citing SEBI data that 88% of retail F&O traders lose money on average, which makes further policy tightening an always-live risk. The other blocker is underwriting transparency. Dhan is still private, so investors do not get Robinhood-style filing cadence, named IR infrastructure, or listed-peer depth on board governance, segment disclosures, and financing terms. Even the complaint surface is only partly visible in this
    pack: Chittorgarh clearly shows that exchange-reported grievance tracking exists for Raise Securities, but this crawl does not provide a fully usable complaint-count series. That makes the company investable to watch, not yet investable to chase at any price.'
