- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable / reference point
  - Observable metric
  - Why it is relevant for Dhan
  - What it suggests
  - Main limitation
  rows:
  - - Dhan last round
    - Rs 10,000 crore equity value; about 11.1x FY26 NOI and 30.7x FY26 PAT
    - The cleanest observable price anchor for the company itself
    - The last round already embeds a meaningful growth-and-quality premium.
    - Private mark with limited term-sheet disclosure.
  - - Robinhood
    - $88.87 billion market cap in June 2026 plus a public filing surface
    - Shows the upper-end public-market ceiling for scaled retail brokerage platforms
    - Public markets will pay large multiples for scaled retail platforms with constant disclosure.
    - Global, much larger, and not a direct India retail-broker comp.
  - - Zerodha Capital
    - FY25 revenue Rs 3,571.81 crore; PAT Rs 1,220.75 crore; 35.79% CRAR
    - Useful for thinking about lending-adjacent economics around securities-backed credit
    - Financing optionality can deepen monetization beyond plain brokerage.
    - NBFC subsidiary, not a pure listed broker or direct Dhan equivalent.
  - - Groww
    - Rs 20 or 0.1% pricing; named investor-relations lead; 47% share in new SIP registrations and 17% in active SIP accounts
    - Represents the strongest retail-super-app style rival in adjacent investing flows
    - Winning the broader wallet, not just pricing, matters for long-term compounding.
    - This source pack does not provide Groww financials or a clean current valuation anchor.
  - - 5paisa
    - Flat-fee discount-broker pricing and public IR / annual-report surfaces
    - Another India discount-broker reference with public-market style disclosures
    - Discount-broker pricing is commoditized and not where Dhan’s premium should come from.
    - The captured IR page has weak current-year financial visibility.
  - - Angel One
    - Public annual-report and compliance surfaces plus market-standard retail charges
    - Benchmarks listed-peer disclosure depth and pricing parity
    - Listed Indian peers disclose far more than Dhan while still competing on similar retail pricing.
    - This source pack does not surface current Angel One financial lines.
  notes: The comp set is a practical sample of observable reference points available in the cached pack, not a full universe or a tight apples-to-apples screen.
