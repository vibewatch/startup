  evidenceGaps:
  - type: missing-source
    severity: material
    topic: series-b-terms
    missingEvidence: A cap-table or term-sheet summary for the 2025 Series B, including liquidation preferences, ratchets, and primary versus secondary split.
    whyItMatters: The last round is the observable price anchor, so hidden investor rights can change effective entry economics.
    diligencePath: Request a financing summary from management or lead investors before underwriting above the last round.
    relatedQuestionRefs:
    - QV028
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: segment-economics
    missingEvidence: FY26 and FY27 YTD segment revenue and contribution margin for broking, MTF, Millions, insurance, and algorithms.
    whyItMatters: The core debate is whether diversification is economically real or still mostly product-surface narrative.
    diligencePath: Ask for a board-style operating pack or audited segment bridge.
    relatedQuestionRefs:
    - QV029
    relatedTableRefs:
    - TV006
  - type: access-blocked
    severity: minor
    topic: complaint-trend
    missingEvidence: A usable year-by-year complaint and resolution series for Raise Securities / Dhan.
    whyItMatters: The current crawl proves that a grievance registry exists but does not clear the service-quality question strongly enough for a buy call.
    diligencePath: Pull exchange complaint dashboards directly or request internal monthly grievance reports.
    relatedQuestionRefs:
