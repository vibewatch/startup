- id: scenario-ranges-and-diligence
  title: Scenario ranges, exit readiness, and diligence asks
  body: 'The practical output is a range, not false precision. Using FY26 operating income as the clearest public denominator, the last round already sits near 11.1x revenue-equivalent operating income. An 8x multiple lands near Rs 7,239 crore, 10x near Rs 9,049 crore, 12x near Rs 10,859 crore, and 15x near Rs 13,574 crore. That makes a base case around Rs 10,000-12,000 crore the most defensible public-evidence band today: it respects the last private mark, the still-healthy FY26 margin, and the fact that Dhan kept taking share in a tougher market. The bull case at Rs 12,000-14,000 crore needs more than hope. It requires adjacent products to become visible in reported economics, further share gains, and signs that FY26 expense inflation was temporary rather than structural. The bear case at Rs 8,000-9,500 crore is what the committee should hold in mind if F&O regulation tightens again, margins keep compressing, or disclosure reveals that diversification has not yet become economically material.
    Relative to public or IPO-oriented peers, exit readiness still looks incomplete because the market lacks segment revenue splits, round-term detail, and a thicker governance narrative. Those are the diligence items most likely to move the recommendation, not small tweaks in headline pricing.'
