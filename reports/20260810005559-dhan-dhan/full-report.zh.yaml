      - number: '8.3'
        title: 为什么不升级为买入
        blocks:
          - type: paragraph
            body: >-
              反论点主要关乎集中度和披露，而不是业务是否存在。公开报道称，FY26 约 79% 收入仍来自经纪业务，约 70% 仅来自零售 F&O；Pravin Jadhav 也承认，监管变化冲击了接近 40%
              与衍生品相关的交易量或收入线。ICRA 接着给出行业背景：随着打击后的重置传导到系统内，FY2026 行业 NOI 可能下降 5-10%，利润率最多压缩 500 bps。Outlook Business 引用
              SEBI 数据进一步强化负面角度：88% 零售 F&O 交易者平均亏钱，使进一步政策收紧始终是现实风险。另一个阻碍是承保透明度。Dhan 仍是私营公司，投资者拿不到 Robinhood 式申报节奏、具名 IR
              基础设施，也拿不到上市同业在董事会治理、分部披露和融资条款上的深度。即便投诉界面，在这份资料包里也只部分可见：Chittorgarh 清楚显示 Raise Securities
              存在交易所报告的申诉跟踪，但本次抓取没有提供完全可用的投诉数量序列。因此，公司值得投资者跟踪，但还不值得不计价格地追逐。
