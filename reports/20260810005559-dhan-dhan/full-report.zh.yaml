        - 零售 F&O 和证券经纪占 NOI 的比例
        - 经过又一整年多元化努力后，F&O 占比仍接近 70% 或上升，或经纪占比仍接近 79%
        - 将公司重估为结构性暴露于衍生品政策，而非暂时集中
      - - MTF 带动的杠杆扩张
        - MTF 账簿增长相对于多元化费用增长
        - 未公开逾期披露的情况下，MTF 账簿持续快于非经纪收入复利增长
        - 在给增长溢价前，要求提供杠杆账簿质量数据
