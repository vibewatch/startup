  - number: 4
    title: 财务表现
    sections:
      - number: '4.1'
        title: 收入模式与定价
        blocks:
          - type: paragraph
            body: >-
              公开资料支持的是券商优先、与活动挂钩的收入模式，而不是订阅或投顾模式。官方费率表写得很明确：股票交割免费，平台费用为零，核心变现来自已执行交易活动、期权订单、借记相关费用和保证金融资。第三方报道进一步说明这些定价如何变成实际经济性：证券经纪约占
              FY26 NOI 的 79%，仅零售 F&O 就约占 NOI 的 70%。这组组合很重要，因为 Dhan
              的挂牌定价看起来是行业标准，而不是溢价，所以业务依赖留住活跃交易者并维持订单流，而不是从每笔交易中抽取异常高的佣金。公开资料中最强的增量变现杠杆是 MTF，Dhan
              在这里宣传分层利率和更大的融资持仓额度。资料同样有助于排除一些可能性。Dhan 称自己不做自营交易，也不是共同基金分销商或代理，因此公开证据更支持经纪、融资收入和附属运营费用，而不是隐藏的自营账簿收益或 MF
              尾随佣金。增长故事因此可信，但收入质量对交易强度和产品组合高度敏感。
