        title: 多界面产品栈与工作流覆盖
        blocks:
          - type: paragraph
            body: >-
              Dhan 应被看作一个产品家族，而不是单一券商 App。官方界面现在覆盖核心 Dhan 移动 App、用于大屏交易的 Dhan Web、面向重度 F&O 工作流的 Options Trader App
              和网页端、基于 TradingView 的图表执行、DEXT T3 桌面终端，以及用于可编程交易和数据访问的 DhanHQ。这个栈不是装饰：当前 App Store
              文案和期权页面反复呈现一个账户，可以在自选列表、订单、组合、交易簿、图表和资金之间流转，无需切换券商或创建产品专属身份。工作流也超出简单执行。MTF 和 Margin Pledge Benefit
              不是附带优惠，而是嵌入式资本产品，让用户在同一生态中放大头寸、为期权活动提供资金，并在持仓、抵押品和下单之间移动。结果是一条宽阔的客户工作流：从发现或看图开始，进入执行，再延伸到资本管理和交易后监控；这比许多印度零售券商仍强调的低成本经纪框架更宽。
