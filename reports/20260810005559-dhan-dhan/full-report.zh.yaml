        - 向管理层或领投方索取 term sheet 摘要。
      - - 分部收入结构
        - 按收入和贡献利润拆分经纪、MTF / 融资、Millions / SIP、保险和算法产品
        - 核心争议是多元化是否已经有真实经济性，还是仍主要停留在叙事。
        - 索取 FY26 和 FY27 YTD 分部资料包。
      - - 客户质量与投诉
        - 按 cohort 拆分投诉数量、解决时长、流失率和活跃客户留存
        - 要给买入判断，需要比注册介绍页更干净的服务质量证据。
        - 索取交易所投诉 dashboard 导出，以及内部 cohort 留存数据。
      - - MTF 资产质量
        - 融资成本、逾期或强平历史，以及 Rs 505 crore 账面规模的损失经验
        - 只有风险守住，类信贷可选性才会增厚价值。
        - 索取 MTF 风险评审和贷款授信安排细节。
      - - 退出准备度
        - 董事会构成、治理节奏、审计颗粒度和融资时间线
        - 同业披露深度仍是判断只能停留在跟踪的关键原因。
        - 索取董事会材料、治理备忘录和融资路线图。
    notes: 这些证据项最可能改变判断；没有一个只是走形式。
    claimRefs:
      - CV004
      - CV035
      - CV038
      - CV039
      - CV044
      - CV056
      - CV058
