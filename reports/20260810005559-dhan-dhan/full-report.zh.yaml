        blocks:
          - type: paragraph
            body: >-
              第二个主要风险簇，来自 Dhan 如何变现活跃交易者并管理杠杆。官方页面显示普通交割交易没有保证金，但也宣传最高 Rs 1 crore 的 MTF、覆盖 1450+ 只股票的即时质押保证金，以及 App
              Store 文案中的 5X 敞口提示。Dhan 自己的 RMS 文件详细且异常强硬：基于计时器的日内强平在收盘前启动，MTM 超过 80% 时头寸可被削减，覆盖率低于 20% 可触发清算，包括 MTF
              持仓。这些控制降低券商信用风险，但如果市场跳空、流动性消失，或经验不足的交易者过度使用杠杆工具，也会抬高客户结果和投诉风险。到 2026 年 3 月，MTF 账簿达到 Rs 505
              crore，重要性也在这里。相对行业总量仍小，但它的增长快于公开证据中非经纪费用多元化的增长，因此杠杆既可能支撑成交量，也可能放大下行。
