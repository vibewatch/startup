      - number: '2.4'
        title: 增长驱动、约束与估值关联
        blocks:
          - type: paragraph
            body: >-
              印度零售市场扩张显然是结构性的：demat 账户远高于疫情前水平，国内持股加深，监管方和市场基础设施机构也让参与变得更容易、更透明。但这并不保证经纪变现。ICRA 预计 FY2026 行业 NOI 下降
              5-10%，利润率最多压缩 500 bps，因为监管正在有意降温周度期权热。CNBC 已显示 FY26 活跃客户池收缩，Outlook 则点出更深的行为风险：88% 零售 F&O
              交易者平均亏钱，这会给最可变现的人群带来流失、审查和产品适配问题。价格压缩进一步加重压力，因为替代品已经把免费开户和低固定经纪费变成常态。因此，Dhan 的可投资性问题比宏观 TAM
              故事更窄：活跃交易者工具、融资工作流和合规信任，能否在不过度依赖单一波动细分的情况下支撑份额提升。公开来源仍没有充分披露分部收入结构或客群质量，无法高精度承保这一结论。
