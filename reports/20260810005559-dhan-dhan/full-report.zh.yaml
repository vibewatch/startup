      - number: '1.3'
        title: 资本基础与独角兽跃升
        blocks:
          - type: paragraph
            body: >-
              公开记录里最重要的资本市场事实，是 2025 年 10 月的 Series B。Avendus、The Economic Times 和 Entrepreneur India 对一轮 $120 million
              融资口径一致，投资方包括 Hornbill Capital、MUFG、BEENEXT 和一批公开市场投资人。上述报道还把投后估值锚定在约 $1.2 billion 或 Rs 10,000 crore，使
              Raise 跻身独角兽。更早的报道则指向 2022 年一轮约 $22 million 的机构融资，当时估值约 $150
              million，意味着三年内估值大幅跃升。融资故事可信，但并不完全闭合。公开来源没有完整对齐累计募资额、老股成分或本轮后治理权利。因此，头部估值有扎实支撑，但精确资本结构机制仍披露不足。后文章节最稳妥的基准事实，是轮次规模、领投投资人、估值区间，以及募资用途指向生态扩张，而不是精确累计融资总额。
