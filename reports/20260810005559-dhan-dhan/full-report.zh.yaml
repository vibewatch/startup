      - number: '6.4'
        title: 扩张循环与集中风险
        blocks:
          - type: paragraph
            body: >-
              从单个账户层面看，客户集中风险较低，因为 Dhan 是大众零售券商；但分部集中风险仍重要。Moneycontrol 称约 70% 收入来自 F&O，因此即便管理层向共同基金、SIP、保险分销、AI
              工具和线下触点扩张，当前经济性仍与活跃交易强度绑定。官方产品页和社区帖子显示，进入 API、期权工具、MTF
              和质押产品的交叉销售路径可信，可以加深既有用户的钱包份额。战略上行在于，印度零售市场仍有很长增长通道，尤其是在一、二、三线市场。保留意见是，公开来源仍不披露附加采用率、按细分的 CAC
              或按平台留存，所以宽度故事清楚，但扩张耐久度只被部分证明。另一个细微风险是服务模式匹配：Dhan
              自己的定价披露称其是完全数字化服务商，线下或实体请求可能耗时更长、成本更高。这对数字原生交易者没问题，但会放慢那些需要网点陪跑、客户经理覆盖或重纸质流程服务的客群采用。
