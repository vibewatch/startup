  - id: TI006
    title: 公开财务缺口表
    columns:
      - 缺失指标或文件
      - 重要性
      - 公开材料仅显示
      - 精确尽调路径
      - 严重程度
    rows:
      - - 分部收入拆分
        - 需要拆开经纪、融资和相邻业务质量
        - 只有高层 NOI 和利润标题
        - 要求按经纪、利息、分销和其他费用提供 FY26 收入桥
        - 重大
      - - CAC 和回本
        - 需要评估市场降温后增长是否仍高效
        - 只有快速开户和客户增长表述
        - 要求获客渠道组合、按渠道 CAC 和按客群回本
        - 重大
      - - MTF 资金成本
        - 需要承销净利息经济性和风险调整回报
        - 有公开 MTF 利率和账面规模，但没有资金组合或利差
        - 要求贷款方名单、平均借款成本、期限和 NIM
        - 重大
      - - 现金流量表 / 烧钱视角
        - 需要判断资金续航和下一轮依赖
        - 只有流动性快照和资产负债表标题
        - 要求经审计 FY26 现金流量表、月度现金消耗和 FY27 预测
        - 重大
      - - 保险收购经济性
        - 需要评估多元化 ROIC
        - 只有收购结构、团队规模和计划投资
        - 要求收购价格、整合预算、目标保费和回本时间线
        - 重大
      - - 相邻业务收入贡献
        - 需要检验多元化是否已具备财务意义
        - Millions、AI 和保险扩张叙事
        - 要求按相邻业务拆分 FY26 和 FY27 收入贡献
        - 重大
      - - Dhan 单体人数和运营费用拆分
        - 需要对标经纪业务本身的经营杠杆
        - 只有集团和公司关于团队扩张的评论
        - 要求 Dhan 单体人数、薪酬账单和支持成本拆分
        - 次要
      - - 客户分群变现
        - 需要看活跃交易者、投资者和 MTF 用户变现是否不同
        - 只有客户数和活跃客户标题
        - 要求按客户类型提供分群收入和盈利能力
        - 重大
    notes: 这些缺口是本章能更有信心评估当前盈利能力和战略方向，而非前瞻单位经济性的主要原因。
    claimRefs:
