  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局与份额结构
        blocks:
          - type: paragraph
            body: >-
              Dhan 的竞争场在印度折扣券商集群里，但市场边界不止五个 App 图标。直接同业是几家主打数字化开户、多资产投资和 App 驱动交易的大型低成本零售券商：Zerodha、Groww、Upstox、Angel
              One 和 5paisa。存量或现状替代方案仍是综合型或银行关联券商关系；这一点仍有意义，因为 CNBC 的 FY26 摘要显示，即使整体活跃客户池收缩，ICICI Securities 和 SBI
              Securities 等传统券商仍在拿份额。规模差距是承保核心。CNBC 报告 FY26 市场份额中，Groww 为 28.31%，Zerodha 为 15.08%，Angel One 为
              14.79%，Upstox 为 4.35%，Dhan 仅为 2.27%；ETBFSI 则显示，截至 2024 年 6 月，前五大折扣券商已控制 64.4% 活跃客户。这意味着 Dhan
              面对的不是碎片化长尾市场，而是一个集中度高、头部对手已拥有分发和品牌记忆的类别。
