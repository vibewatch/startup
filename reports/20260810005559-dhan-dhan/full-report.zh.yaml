    title: 正反论点表
    columns:
      - 主题
      - 正论点
      - 反论点
      - 什么会改变判断
    rows:
      - - 私募市场锚点
        - 上一轮规模大、时间近，并由可信投资人领投，估值约 $1.2 billion。
        - 私募轮可能滞后于公开市场的风险重定价，也不披露清算优先权。
        - Series B 条款，以及任何老股交易或优先权压力。
      - - 经营验证
        - FY26 仍交出 Rs 904.9 crore NOI、Rs 325.8 crore PAT 和 36% 利润率。
        - 收入增长下 PAT 仍已下滑 20%，这可能意味着正常化盈利能力低于融资头条叙事。
        - 一次性投入和监管重置之后，FY27 利润率轨迹如何。
      - - 市场份额
        - 大盘降温时，Dhan 仍在提升 NSE 活跃客户份额。
        - 如果更大的同行吃下大部分零售资金流，或产品扩张卡住，小份额券商仍可能撞上天花板。
        - 再连续两个季度提升份额，同时变现更健康。
      - - 多元化
        - Millions、保险、Stratzy、MTF 和 API 显示出更大生态野心。
        - 公开来源尚未量化这些相邻业务贡献了多少非经纪收入或利润。
        - 经纪、融资、SIP 和保险经济性的分部级披露。
      - - 披露质量
        - 已公开信息足以让人认真持续跟踪公司。
        - 公开信息还不足以让人为市场其实还没拿到的确定性支付溢价。
        - 董事会、治理、投诉和 cap table 披露更接近公开同行标准。
    notes: 反论点由披露和监管驱动，并不是否认 Dhan 已有真实规模。
