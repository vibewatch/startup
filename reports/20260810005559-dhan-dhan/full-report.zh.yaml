      - number: '4.2'
        title: 资产负债表强度与资本强度
        blocks:
          - type: paragraph
            body: >-
              FY26 证据显示，Raise Securities 的资产负债表比「零佣金」营销口号暗示的更强。公司年末净值为 ₹916.1 crore，总资产为 ₹3,374.8
              crore，可见流动性包括未受限现金、流动投资和未使用额度，合计约 ₹218 crore。这个状态看起来健康，但同一份资料也显示资本纪律为何重要。MTF 账簿再次翻倍至 ₹505 crore，行业 MTF
              余额在降温后仍超过 ₹80,000 crore，Dhan
              自身风险政策也保留在保证金恶化时强平、质押或清算客户头寸的广泛权利。换句话说，这家券商不只是低成本订单路由器；它还在运营一个不断增长、由资产负债表支撑的融资产品，带来营运资本和风险管理义务。所给资料包中最接近的公开类比是
              Zerodha Capital 年报。该报告展示了印度资本市场栈中的放贷子公司如何明确管理 CRAR、储备转拨，甚至由董事提供借款额度。这并不意味着 Dhan
              的经济性完全相同，但它提醒我们：融资驱动的变现需要真实资本缓冲和融资管线。正面解读是，Raise 进入 FY26 时处于强势位置。保留意见是，公开来源仍没有显示 MTF 驱动模型的资金成本、借款组合或现金流转化。
