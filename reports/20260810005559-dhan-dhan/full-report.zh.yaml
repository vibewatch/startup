        - 零佣金获客和留存产品
        - 官方定价称交割佣金为 ₹0
        - 有助获客，但不是核心变现
        - 直接变现低，价值在交叉销售和参与度
        - 展示交割向 MTF 或衍生品的转化率
      - - MTF 利息收入
        - 对融资持仓收取利息
        - 官方 MTF 页面列出 12.49% 至 15.49% 利率，FY26 MTF 账簿达到 ₹505 crore
        - 快速增长
        - 可能有吸引力，但对资产负债表和资金成本敏感
        - 披露资金成本、NIM、分年份亏损和贷款方 / 授信组合
      - - 附属运营费用
        - 自动平仓、电话交易、借方利息、CUSPA 及配套处理费
        - 官方费率和风险政策披露这些收费与控制
        - 增量
        - 可支撑变现，但大概率不是投资论点核心
        - 量化附属运营费用的收入占比
      - - 直接共同基金 / Millions
        - 订单归集和低成本投资界面，可能是留存和钱包份额工具
        - 监管页面称 Dhan 不是 MF 分销商或代理，定价页称 MF 投资免费
        - 战略性，尚未看到明确变现
        - 有利于参与度，但当前收入质量未证实
