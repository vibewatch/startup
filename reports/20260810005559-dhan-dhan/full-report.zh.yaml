      - number: '8.4'
        title: 情景区间、退出准备度与尽调追问
        blocks:
          - type: paragraph
            body: >-
              实际结论应该是一段区间，而不是假装精确。以 FY26 营业利润这个最清晰的公开分母看，上一轮价格已经接近 11.1x 营业利润。8x 对应约 Rs 7,239 crore，10x 约 Rs 9,049
              crore，12x 约 Rs 10,859 crore，15x 约 Rs 13,574 crore。因此，Rs 10,000-12,000 crore
              左右的基准情形，是今天最站得住脚的公开证据区间：它承认上一轮私人市场定价，也尊重 FY26 利润率仍然健康，以及 Dhan 在更难的市场里继续拿份额的事实。Rs 12,000-14,000 crore
              的牛市情形不能只靠希望，它要求相邻产品在报告经济性里变得可见，Dhan 继续扩大份额，并且出现证据表明 FY26 费用膨胀只是暂时现象，而不是结构性问题。Rs 8,000-9,500 crore
              的熊市情形，是委员会在 F&O 监管再次收紧、利润率继续压缩，或披露显示多元化尚未产生实质经济贡献时需要记住的下沿。相较公开市场或准备 IPO 的同业，Dhan
              的退出准备仍不完整：市场缺少分部收入拆分、轮次条款细节，以及更厚的治理叙事。最可能改变建议的，是这些尽调事项，而不是标题价格的小幅微调。
