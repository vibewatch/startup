            body: >-
              Dhan 主要卖给印度自主型零售市场参与者，但公开记录显示，其客户基础比一个「交易者 App」标签更宽。独立 FY26 报道锚定了最清晰的规模事实：截至 2026 年 3 月 31 日，Raise
              Securities 约有 17 lakh 活跃客户，约占 NSE 活跃客户的 2.3%，市场排名第 9。围绕这个锚点，还有几个重要但不应混同的指标。Moneycontrol 报道约 10.5 lakh
              活跃投资者，JFM26 社区回顾称近 100 万活跃用户，App Store 称 1 Mn+ 用户，Dhan 自己的定价页称 1 Cr+
              下载。这些数字合在一起支撑了有意义的零售采用，但每个数字描述的是漏斗中不同位置，而不是同一个分母。
