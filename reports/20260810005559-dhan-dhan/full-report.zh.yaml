  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Dhan 应被界定为自主型零售证券经纪产品，而不是完整 Raise 生态，也不是泛金融服务。官方 App、网页端、TradingView、DEXT、MTF
              和质押页面都指向同一个纳入的支出池：覆盖现金股票、ETF、共同基金和衍生品的零售执行，加上面向高频交易者的经纪相邻融资和资本效率功能。这个边界重要，因为替代品密度极高。Zerodha、Upstox、Groww 和
              5paisa 都用免费开户、低或封顶经纪费、广泛移动端分发来争夺同一个投资者钱包。Dhan
              自己的文案强调行业标准定价，而不是全品类最低价，这意味着它必须靠工作流深度取胜，而不只是靠佣金观感。因此，做市场规模测算时，正确基准是印度折扣券商和活跃交易类别；保险、机构经纪和非交易型内容相邻业务，应留在本章核心市场定义之外。
