            body: >-
              硬经营证据已经足够让上一轮估值留在公允区间内。Raise Securities 在 FY26 仍实现 36% 利润率，净值升至约 Rs 916 crore，总资产达到约 Rs 3,375
              crore。客户证据方向上也偏正面：Indian Startup News 引述约 1.2 crore 客户和截至 2026 年 3 月约 17 lakh 活跃客户，CNBC-TV18
              则显示，即便更广泛活跃客户基础走弱，Dhan 的 NSE 活跃客户份额仍从 1.98% 升至
              2.27%。这一点重要，因为私营券商如果能在更难的市场环境中拿份额，而不是只在轻松牛市中增长，就应得到更多信用。市场结构仍有帮助。Mordor
              的行业解读指向一个数字优先市场：零售投资者已占主导，线上渠道占据多数份额，超过 95% 新账户来自移动 App。Dhan 自身定价也不依赖溢价收费：它给出零交割经纪费，以及 Rs 20 或 0.03%
              的执行定价，大体匹配同业折扣券商结构。这意味着故事中的乐观部分必须来自执行、产品速度，以及 MTF、Millions、保险和 Stratzy 等相邻变现，而不是隐藏的定价护城河。
