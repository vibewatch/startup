        - 官方定价显示期权佣金 ₹20；FY26 报道称散户 F&O 约占 NOI 的 70%
        - 主导
        - 成交量高，但周期性强、对监管敏感
        - 提供每笔期权订单的实际抽成率，以及按分部划分的头部客户集中度
