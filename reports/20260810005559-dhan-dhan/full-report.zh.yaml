  - id: TE003
    title: 技术 / 运营架构表
    columns:
      - 层 / 组件
      - 角色
      - 依赖
      - 风险
    rows:
      - - 客户界面
        - App、web、期权界面、TradingView、DEXT T3 和 API 入口收集意图并展示状态
        - 依赖 OS 平台、浏览器行为、应用商店分发和一致的会话状态
        - 即使核心券商引擎健康，各界面的可靠性也可能分化
      - - 执行核心
        - 定制 OMS 和 EMS 执行订单，并维护券商工作流状态
        - 依赖交易所连接，以及 Dhan 在 AWS 上的自有路由逻辑
        - 执行正确性比 UI 打磨更重要；公开内部信息大多仍来自合作伙伴文档
      - - 数据和开发者层
        - 交易 API、数据 API、期权链、全深度 feed、MCP 工具和 SDK 抽象层提供可编程访问
        - 取决于速率限制、schema 稳定性，以及 SDK 或文档是否持续维护
        - 功能扩张太快，开发者可能遇到版本漂移或破坏性变更
      - - 资金与保证金服务
        - MTF、质押保证金、抵押品和订单联动风控，支持更大规模或跨产品仓位
        - 取决于托管机构通道、RMS 逻辑和抵押品估值政策
        - 杠杆和强平规则会放大客户亏损与支持风险
      - - 基础设施与韧性层
        - Direct Connect、Aurora、Auto Scaling、Lambda 和双活灾备支撑平台速度与可用性
        - 取决于 AWS 容量规划和交易所连接
        - 合作伙伴案例有参考价值，但替代不了公开状态页或 SLA 历史
      - - 可观测性与合规层
        - CloudWatch、Systems Manager、Security Hub、合规工作流和 150+ 项风险检查监控整套技术栈
        - 取决于告警阈值、响应流程和政策维护是否到位
