      - number: '4.3'
        title: 多元化、利润率压力与披露缺口
        blocks:
          - type: paragraph
            body: >-
              FY26 最重要的张力在于，Raise 已经盈利且资本充足，但把多元化转化为可披露收入质量仍处早期。管理层和第三方报道指向更重的营销投入、团队扩张、AI
              与生态建设、保险经纪扩张，以及全渠道分发；成本增长看起来正是 PAT 在 NOI 上升时仍下滑的直接原因。GreenLife 收购强化了战略故事，因为它带来一个受监管保险平台、一支 25 人团队、50
              多个城市的覆盖，以及一项披露的 $15 million
              后续投资计划。这确实把未来变现扩展到交易之外，但公开资料尚未量化相邻收入贡献多少、整合成本如何、保险建设多快能回本。同业披露在这里形成最鲜明对比。5paisa 的公开 IR 界面让季度材料和年报易于获取，而
              Raise / Dhan 的公开记录仍以精选新闻摘要、定价页面和运营政策披露为中心。因此，可以给出财务判断，但边界清楚：Dhan
              已证明规模，当前盈利健康，资本市场相邻业务在增长；然而，承保案例仍被缺失的分部抽佣率、CAC 和回本、资金成本以及资金续航计算所约束。这使得故事值得投资者跟踪，但披露还不足以支撑干净的单位经济性承保结论。
