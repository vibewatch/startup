      - number: '3.2'
        title: 产品与能力定位
        blocks:
          - type: paragraph
            body: >-
              Dhan 真正显得不同的地方，在于它试图把多少活跃交易者工作流留在同一个账户里。本章审阅的官方界面显示，它覆盖移动 App、完整网页平台、专门面向重度 F&O 工作流的期权 App
              和网页产品、TradingView 直连执行、DEXT T3 桌面终端、MTF 与质押保证金工具，以及带免费 API 和第一方 MCP server 的 DhanHQ 开发者文档。在留存的公开证据中，这个界面栈比
              Groww 的大众市场投资姿态，或 Upstox 更偏定价和合规的呈现都更密集。5paisa 是本组资料里最接近的功能型对手，因为其首页同样强调 FnO 360、实时 Greeks、策略图和免费
              API。因此，交易者不选 Dhan 时，实际替代品不是某一个完美竞品；要么是更大的综合低成本券商，要么是拼接式工作流——图表、策略和执行分散在多个界面，而不是一个纵向整合的交易者账户。
