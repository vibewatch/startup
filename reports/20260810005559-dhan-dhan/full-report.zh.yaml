      - - Zerodha Capital
        - FY25 收入 Rs 3,571.81 crore；PAT Rs 1,220.75 crore；35.79% CRAR
        - 有助于理解证券抵押信贷周边的借贷经济性
        - 融资可选性可以把普通经纪之外的变现做深。
