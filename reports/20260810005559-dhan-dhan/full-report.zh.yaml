        title: 创始人、使命与生态扩张
        blocks:
          - type: paragraph
            body: >-
              公司的创业叙事比法律壳新得多。围绕独角兽融资轮的媒体报道，把 Raise Financial Services 归于 2021 年由 Paytm Money 前高管 Pravin Jadhav
              领衔的创始团队，成员还包括 Alok Pandey、Jay Prakash Gupta 和 Raunak Rathi。Dhan
              关于页面的官方文案则从产品角度界定使命：为超级交易者和长期投资者打造技术驱动的平台，而不是再做一个泛化券商 App。到 2026 年，值得注意的是 Raise 已不再只是单一券商故事。Avendus
              和集团自有生态露出显示，相邻品牌包括投资平台 Millions、研究工具 ScanX、AI 原生金融问答 Fuzz、消费者媒体 Filter Coffee，以及教育品牌
              Upsurge。这种外延支撑金融生态论点，但也带来保留意见：公开治理披露没有跟上生态复杂度，所以战略版图比正式控制图更清楚。
