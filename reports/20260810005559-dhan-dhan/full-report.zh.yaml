  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管压力与盈利集中
        blocks:
          - type: paragraph
            body: >-
              Raise / Dhan 面对的不是泛化券商风险栈，而是一个非常具体的集中问题。公开 FY26 记录称，约 70% 净营业收入仍来自零售 F&O，约 79%
              来自整体证券经纪，因此政策收紧最尖锐的细分，仍是主要盈利引擎。这种集中已经反映在 FY26 业绩中：净营业收入增至约 Rs 905 crore，但随着 SEBI 衍生品管制和更重扩张开支冲击盈利，PAT 仍下降约
              20% 至约 Rs 326 crore。ICRA 的行业传导也明确不利于指数期权敞口高的折扣券商，FY2026 行业 NOI 可能下降 5-10%，利润率最多压缩 500
              bps。监管边界本身清楚，当前也合规，但风险不是今天能否保住牌照，而是收入多元化能否跑赢下一轮衍生品成交压力。
