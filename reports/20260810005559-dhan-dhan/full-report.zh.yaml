    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与监管底座
        blocks:
          - type: paragraph
            body: >-
              理解 Raise Financial Services，应该先看真正对接客户的受监管实体。Dhan 自己的监管和联系方式披露写得很清楚：面向消费者的 Dhan 品牌隶属于 Raise Securities
              Private Limited，SEBI、交易所和存管登记都挂在这家公司名下，而不是一个独立的「Dhan」法律壳。NSE 会员详情也印证了这条法律主线：注册办公室同在 Mumbai 的 Goregaon
              West，交易会员代码相同，客户权限也同样覆盖自营、机构和零售。这一点重要，因为后文分析财务、投诉和产品义务时，应回到 Raise Securities，除非资料明确指向更广义的 Raise
              集团。公开资料还显示，该法律实体早于 Dhan 上线多年存在，因此 2012 年注册成立、2015 年取得 SEBI 登记、2021 年产品上线可以同时成立，并不矛盾。
