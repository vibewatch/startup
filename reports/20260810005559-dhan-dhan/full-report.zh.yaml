      - number: '2.3'
        title: 买方分层与采用路径
        blocks:
          - type: paragraph
            body: >-
              Dhan 的获客动作本质上是自助式。同一个人通常就是买方、用户和付款方，官方开户也呈现一个简单漏斗：验证手机号和邮箱、上传 KYC
              材料、电子签名，然后入金并开始交易。这种简单不是表面细节，而是市场驱动因素的一部分。第三方报道把印度 2020 年后的零售浪潮同零佣金优惠、移动优先 UX 和更快 KYC 连接起来；Dhan
              自己的页面也说明，它为什么要越过新手投资者，瞄准参与度更高的人群。App
              和网页页面同时欢迎交易者和投资者，但更密集的产品价值落在活跃用户身上：他们需要图表联动执行、期权工作流、质押支持的资本效率、保证金融资和终端式桌面定制。长期投资者仍可用平台做交割、ETF
              和共同基金，但公开证据显示，Dhan 最强的产品匹配和可能最高的变现，来自期权、日内、波段和多界面重度用户，而不是被动持有账户。
