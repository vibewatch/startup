      - number: '2.2'
        title: TAM、SAM 与参与规模需要多镜头校准
        blocks:
          - type: paragraph
            body: >-
              市场毫无疑问很大，但公开数据集描述的是不同对象，不能压成一个头部 TAM。Mordor 给出最宽的收入视角：2025 年 USD 4.25 billion，到 2030 年升至 USD 6.21
              billion，线上分发已占类别活动的 51.3%，零售用户占组合的 63.4%。这些收入数字有助于理解行业，但会高估 Dhan 近期可直接触达的市场，因为 demat
              账户增长、活跃客户参与度和衍生品强度会一层层收窄池子。ETBFSI 显示，截至 2024 年 6 月 demat 账户达 162 million；HDFC Sky 和 Outlook 则把 2025-2026
              年的漏斗顶端放在 19 crore 以上。但 ICRA 称 2024 年末 NSE 活跃客户只有约 4.8 crore，CNBC 称到 2026 年 3 月又降至 4.57 crore。活跃客户这一层，是更实用的
              SAM 代理。在其中，最高价值人群更窄：ICRA 估算活跃衍生品交易者仅约 96 lakh，CNBC 的 FY26 份额数据也暗示 Dhan 目前自身可能约有 100 万活跃客户。
