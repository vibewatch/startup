        - 各分部已执行的日内类交易收取 ₹20 或 0.03%
        - 官方费率表列出固定折扣定价
        - 重要但次于 F&O
        - 比 F&O 更干净，但仍与交易活跃度挂钩
        - 披露按分部计算的实际佣金收益率，以及按活跃队列计算的流失率
