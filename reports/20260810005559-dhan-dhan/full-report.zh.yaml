      - number: '3.4'
        title: 护城河耐久度与竞争风险
        blocks:
          - type: paragraph
            body: >-
              核心竞争问题是：Dhan 的功能密度会变成持久护城河，还是只是一份暂时差异化的宣传册。乐观版本很清楚：Dhan 持续推出面向交易者的产品，比最大的综合券商更积极地打包专业期权和 TradingView
              工作流，并且即便 FY26 市场收缩，份额仍从 1.98% 升至 2.27%。悲观版本同样清楚。定价可以复制，很多工具可被资金充足的对手模仿，而 Dhan 在活跃客户规模上仍远小于 Groww、Zerodha 和
              Angel One。它的差异化还偏向活跃 F&O 和高参与度交易行为，而这恰恰是监管和流失已经收紧类别增长的地方。信任基准也没有完全闭合：Dhan
              有投诉监控界面，但本次留存抓取没有保留用于同业比较的计数。因此，承保时应把 Dhan 的护城河视为由产品节奏驱动、真实存在，但取决于持续执行，而不是结构性成本或分发锁定。
