        title: 规模、技术与未解缺口
        blocks:
          - type: paragraph
            body: >-
              公开规模和技术信号方向上很强，但仍要仔细标注口径。Avendus 称 Dhan 在上线不到四年内达到近 100 万活跃用户，Google Play 文案称产品获得超过 100 万用户信任，Dhan
              自己的定价页则称 App 下载量超过 1 crore。这些都是有用的采用指标，但不能彼此替代。技术证据也足够支撑概览使用。Avendus 和 AWS 都支持 Dhan 拥有自研 DEXT 引擎，并给出低于 20
              毫秒执行、性能显著快于行业基准且获得 AWS 认可等说法。DhanHQ 文档进一步扩展了画面，展示免费交易 API 和第一方 MCP
              server。未解问题更多是组织层面，而非技术层面：准确董事会构成、干净的累计募资总额，以及有日期锚点的 Dhan 单独员工数，在公开资料中仍不可得。
