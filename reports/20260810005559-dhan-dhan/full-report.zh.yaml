  summary: >-
    Dhan 是 Raise Financial Services 运营、总部在 Mumbai 的零售股票经纪和投资平台，面向印度活跃交易者和自主投资者。产品把免交割经纪费、快速执行、衍生品工具、API
    接入和相邻投资工作流放在一起；公开证据显示公司已经真正盈利，但作为私营公司，相比上市同业，披露仍有限。
