              公开发布证据指向一个快速推进的产品组织。DhanHQ 社区帖子显示 2025 年 API 明显扩展，包括完整市场深度和带 Greeks 的期权链。JFM'26 回顾进一步扩展了画面，涵盖 DEXT T3、条件触发
              API、自选列表升级、ScanX 公司页面变化，以及 ETF parking 和 Super IPO 等相邻投资功能。iOS 列表还记录了近期版本引入美国股票和
              ETF，提供另一个当前产品信号。与此同时，各界面成熟度并不均衡。DEXT T3 已上线且功能丰富，但公开 beta
              线程仍有意义，因为它显示上线先经过有限客群、积极收集待办队列，并明确请求拖拽式订单处理、更多设置、更好的自选列表配置等功能。官方 DEXT
              页面本身也强化了这种未完成状态：自定义提醒、终端自动化和第三方集成今天尚不可用。因此，发布节奏很强，但公开记录描述的仍是一个快速发货、向成熟收敛的栈，而不是每个界面都已完全稳定。
