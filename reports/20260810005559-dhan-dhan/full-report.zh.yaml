      - number: '3.3'
        title: 定价、打包与切换力量
        blocks:
          - type: paragraph
            body: >-
              Dhan 的公开定价有竞争力，但并不独一无二。最强的平价来自 Zerodha：双方都宣传 ₹0 股票交割经纪费，以及 ₹20 或 0.03% 的日内定价锚，这限制了 Dhan
              宣称纯费用优势的空间。Upstox、Groww 和 5paisa 在留存的公开费率中更直接地变现零售订单，但头部订单费仍足够接近，防止 Dhan 打开很宽的价格伞。Dhan 转而试图靠打包抵消这种平价：一个免费
              demat 账户、多界面接入、MTF、质押收益、TradingView 联动流程和 DhanHQ。这些功能确实能降低活跃交易者的切换摩擦，因为他们希望在一个登录下拿到图表、期权和
              API。即便如此，价格加工具只有在目标客群更看重工作流密度、而不是纯粹装机基础信任时才有意义。Groww 和 Zerodha 仍能带来巨大的漏斗顶端触达；Upstox 和 5paisa
              也靠简单价格锚和足够交易实用性保持可信，让 Dhan 无法独占低成本叙事。
