    title: 建议摘要表
    columns:
      - 维度
      - 判断
      - 当前判断依据
      - 什么会改变判断
    rows:
      - - 建议
        - 跟踪
        - 业务真实且盈利，但现有公开证据还不足以支持不计价格地新买入。
        - 分部经济性和融资条款披露更多，或入口价格明显更便宜。
      - - 置信度
        - 中
        - 公开证据覆盖融资、FY26 收入、市场份额和监管，但没有覆盖 cap table 机制或完整分部报告。
        - 经审计的分部拆分、投诉趋势，以及更清晰的治理披露。
      - - 风险评级
        - 高
        - F&O 集中度和监管波动改变盈利能力的速度，可能快于当前融资叙事所暗示的节奏。
        - F&O 之外的多元化清晰可见，并再维持一年稳定盈利。
      - - 估值立场
        - 合理
        - Rs 10,000 crore 融资作为中枢可以支撑，因为 FY26 盈利和份额提升真实存在，但它不是明显便宜货。
        - 更低的进入价格，或新证据显示相邻业务已经形成实质贡献。
      - - 决策含义
        - 按现有证据，不要追高超过上一轮
        - 公开数据更支持耐心，而非紧迫买入。
        - 只有证据改善快过价格上行，才上调判断。
    notes: 判断明确对价格敏感：这不是脱离 2025 年 10 月私募估值的公司质量打分。
