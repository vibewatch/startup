  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 可观察锚定价格与当前建议
        blocks:
          - type: paragraph
            body: >-
              公开资料中最干净的估值锚，仍是 2025 年 10 月的 Series B，而不是任何假设 IPO 叙事。Economic Times 和 Moneycontrol 均指向 Hornbill Capital
              领投的一轮 $120 million 融资，将 Raise 投后估值放在约 $1.2 billion 或 Rs 10,000 crore；同一组报道还回溯到 2022 年一轮规模小得多、估值约 $150
              million 的融资。这次跃升很大，但并非缺少经营证据支撑：Raise Securities 报告 FY26 净营业收入 Rs 904.9 crore、PAT Rs 325.8 crore，让 Dhan
              即便在更艰难的衍生品制度下，仍处于盈利的新一代折扣券商之列。按上一轮估值，公司约为 FY26 营业收入的 11.1x、FY26 PAT 的
              30.7x。这些倍数谈不上明显便宜，但对一家仍在增长、高利润率的私营券商来说，也不荒唐。真正的约束是披露质量，因为公开来源仍没有完全对齐累计募资额、清算优先权负担，或集团故事背后的精确分部组合。这组组合支持价格敏感的跟踪判断和合理立场，而不是泛泛上调为优质资产。
