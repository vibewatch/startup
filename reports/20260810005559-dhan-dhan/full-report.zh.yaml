      - number: '5.2'
        title: 执行、数据与架构层
        blocks:
          - type: paragraph
            body: >-
              对一家私营零售券商来说，Dhan 的架构故事异常具体，因为它同时拥有公开 AWS 案例研究和公开开发者界面。AWS 称 Dhan 在 EC2 上运行定制 OMS 和 EMS，通过 Direct Connect
              把云足迹连接到交易所，并维持 active-active 灾备。同一案例研究还给出具体运营细节：Aurora 替换早期数据库模式，Auto Scaling 应对峰值窗口，Lambda
              负责告警和合规任务，监控栈基于 CloudWatch、Systems Manager 和 Security Hub，并且每笔订单有超过 150
              项风险检查。在执行核心之上，还有第二层清晰区分的开发者层。DhanHQ 文档和公开 Python client 展示免费交易 API、付费数据 API、期权链和市场深度端点、第一方 MCP
              server，以及用于定时或事件驱动策略的云运行时。关键架构解读是，Dhan 把零售界面设计和可编程工具拆开。DEXT T3 有意在终端本身阻断交易自动化和第三方集成，而 DhanHQ
