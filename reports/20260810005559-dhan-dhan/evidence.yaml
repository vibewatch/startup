evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: board-governance
    missingEvidence: A current board roster, observer rights, and post-Series-B governance terms for Raise Financial Services.
    whyItMatters: >-
      Board control and investor protections determine key-person dependence and the real balance of power after the
      unicorn round.
    diligencePath: >-
      Request the latest cap-table summary, board list, and shareholder rights schedule from management or lead
      investors.
    relatedQuestionRefs:
      - QO009
      - QO025
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: cumulative-capital-raised
    missingEvidence: >-
      A clean, company-confirmed cumulative capital raised figure that reconciles the 2022 round, the 2025 Series B, and
      any secondary component.
    whyItMatters: >-
      Total capital raised is a cover metric and also frames dilution, capital efficiency, and room for future
      financing.
    diligencePath: Request a financing chronology with round dates, primary versus secondary split, and cumulative proceeds.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO004
  - type: stale
    severity: minor
    topic: headcount-scope
    missingEvidence: A dated employee count split between Raise-wide workforce and Dhan-specific operating staff.
    whyItMatters: A group-level 550+ headcount figure is directionally useful but not enough to benchmark Dhan’s operating leverage.
    diligencePath: Ask management for current group headcount, Dhan-only headcount, and location split by function.
    relatedQuestionRefs:
      - QO008
      - QO023
    relatedTableRefs: []
  - type: private-evidence-only
    severity: material
    topic: dhan-sam-som-precision
    missingEvidence: Dhan segment revenue mix, funded-account counts, active-user cohorts, and realized take rates by asset class.
    whyItMatters: >-
      Without segment economics, the chapter can only proxy Dhan's SAM from active-client market data rather than
      underwrite a true Dhan-specific SOM.
    diligencePath: >-
      Request management or lender-grade cohort reporting that bridges active clients to funded accounts, revenue by
      asset class, and retention by segment.
    relatedQuestionRefs:
      - QM023
      - QM024
    relatedTableRefs:
      - TM002
      - TM003
  - type: missing-source
    severity: material
    topic: derivatives-revenue-exposure
    missingEvidence: >-
      Dhan-specific revenue exposure to options brokerage, MTF interest, and other activity that could be hit by FY26
      derivatives moderation.
    whyItMatters: >-
      ICRA gives an industry warning, but the chapter cannot quantify how hard that scenario would land on Dhan without
      company-specific mix data.
    diligencePath: >-
      Request FY26 product revenue mix, options share of volumes, and post-November-2024 product usage changes from
      management or rating materials.
    relatedQuestionRefs:
      - QM019
      - QM020
    relatedTableRefs:
      - TM004
  - type: missing-source
    severity: minor
    topic: activation-and-retention-quality
    missingEvidence: >-
      City-tier mix, monthly active retention, funded-account activation, and long-term behavior by investor versus
      trader cohorts.
    whyItMatters: >-
      Headline account and user claims can materially overstate the quality of the engaged base that ultimately drives
      revenue and valuation.
    diligencePath: >-
      Request internal cohort dashboards or exchange-active account disclosures that separate registered, funded, and
      monthly active users.
    relatedQuestionRefs:
      - QM006
      - QM007
      - QM024
    relatedTableRefs:
      - TM002
      - TM003
  - type: access-blocked
    severity: material
    topic: angel-one-detail
    missingEvidence: A retained Angel One pricing or product capture that exposes comparable consumer feature and tariff detail.
    whyItMatters: >-
