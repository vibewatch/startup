  topStrengths:
  - Demonstrated FY26 profitability at meaningful scale for a still-young broker
  - Product depth for active traders, including derivatives tooling and APIs
  - Share gains and strong funding support around the 2025 unicorn round
  topRisks:
  - Revenue remains heavily concentrated in broking and retail F&O activity
  - Private-company disclosure is far thinner than listed peer investor-relations standards
  - Regulatory tightening can materially affect trading volumes and margins
