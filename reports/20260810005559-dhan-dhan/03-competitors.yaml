- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Platform
  - Price / unit / contract model
  - Included capabilities
  - Discount / unknowns
  - Competitive implication
  rows:
  - - Dhan
    - ₹0 equity delivery; ₹20 or 0.03% intraday / MTF; flat-fee retail brokerage elsewhere
    - Mobile, web, options app+web, TradingView routing, DEXT T3, DhanHQ, MTF, pledge margin
    - Female-discount detail appears in review coverage rather than the retained official pricing page
    - Price parity is strong enough to remove sticker shock for active traders, but not unique enough to create a standalone moat
  - - Zerodha
    - ₹0 equity delivery; 0.03% or ₹20 intraday; flat ₹20 options; Kite Connect ₹500/month
    - Low-cost brokerage plus ecosystem breadth
    - Realized enterprise or partner economics are unknown from retained retail pages
    - Closest list-price anchor to Dhan in cash markets; API monetization is less generous than DhanHQ
  - - Upstox
    - ₹20 delivery; ₹20 or 0.1% intraday; ₹20 or 0.05% futures; flat ₹20 options
    - Broad retail trading with explicit MTF and compliance posture
    - Delivery is not free; actual realized cost depends on user behavior and segment mix
    - Credible price rival, but delivery pricing weakens parity with Dhan and Zerodha
  - - Groww
    - ₹20 or 0.1% per equity order with ₹5 minimum; MTF 14.95% p.a.
    - Simple investing app with broad retail access
    - Retained official pages do not show the same active-trader surface density as Dhan
    - Scale can offset thinner tooling, but public pricing is less trader-friendly than Dhan's cash-equity anchor
  - - 5paisa
    - Flat ₹20 brokerage; ₹0 account opening; zero MF commission; ₹25 monthly AMC
    - Strong derivatives messaging with FnO 360, greeks, and APIs
    - Delivery is not free, and total cost still includes AMC and government levies
    - Closer to Dhan on active-trader ambition than on pure price leadership
  - - Angel One
    - Unknown from retained official capture
    - Official presence and listed-broker context are visible
    - Comparable retail tariff detail was not preserved in the reviewed fetch
    - Treat as a must-watch scale rival, but not a precise pricing benchmark in this retained chapter evidence
  notes: This table compares retained public list pricing and packaging, not realized net brokerage or lifetime economics by cohort.
