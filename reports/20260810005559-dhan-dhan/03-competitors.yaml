  evidenceGaps:
  - type: access-blocked
    severity: material
    topic: angel-one-detail
    missingEvidence: A retained Angel One pricing or product capture that exposes comparable consumer feature and tariff detail.
    whyItMatters: Without a better official capture, Angel One can be placed on scale but not benchmarked precisely on surface-level product breadth or pricing.
    diligencePath: Re-fetch Angel One pricing, derivatives, and app pages with a rendering path that preserves consumer-visible content, then rebuild the feature and pricing comparisons.
    relatedQuestionRefs:
    - QP018
  - type: missing-source
    severity: material
    topic: complaint-benchmarking
    missingEvidence: Numeric complaint counts and resolution rates for Dhan versus peers from exchange or broker-monitor pages.
    whyItMatters: Trust and service quality matter in brokerage retention, especially when product and pricing are increasingly similar across discount brokers.
    diligencePath: Capture the complaint-monitor tables or exchange complaint disclosures for Dhan, Zerodha, Upstox, Groww, 5paisa, and Angel One, then update the risk register with comparable counts.
    relatedQuestionRefs:
    - QP024
    relatedTableRefs:
    - TP004
  - type: private-evidence-only
    severity: material
    topic: retention-and-monetization
    missingEvidence: Cohort-level retention, trader frequency, win-loss, and realized revenue or margin by active-client segment.
    whyItMatters: The underwriting question is not just whether Dhan ships features, but whether those features create better monetization or lower churn than larger peers.
    diligencePath: Request management KPI packs covering active-trader retention, ARPU, F&O share, win-loss by broker, and pilot-to-steady-state monetization for DhanHQ and DEXT T3 users.
    relatedQuestionRefs:
    - QP023
  - type: missing-source
    severity: minor
    topic: listed-peer-disclosure-comparison
    missingEvidence: A like-for-like investor-disclosure package for Dhan or Raise comparable to listed peers' investor-relations surfaces.
    whyItMatters: Disclosure asymmetry can overstate or understate governance quality when public peers provide richer metadata by default than a private company does.
    diligencePath: Ask Raise for a consolidated governance and operating-facts deck or board-and-metric appendix that mirrors the minimum public disclosure available from listed competitors.
    relatedQuestionRefs:
    - QP025
