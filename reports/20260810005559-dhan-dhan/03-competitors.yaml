- id: durability-and-competitive-risk
  title: Moat durability and competitive risk
  body: 'The core competitive question is whether Dhan''s feature density becomes a durable moat or merely a temporarily differentiated brochure. The bullish version is clear: Dhan keeps shipping trader-facing products, bundles specialized options and TradingView workflows more aggressively than the biggest generalist brokers, and has gained share from 1.98% to 2.27% even during a contracting FY26 market. The bearish version is just as clear. Pricing is copyable, much of the tooling can be imitated by funded rivals, and Dhan remains far smaller than Groww, Zerodha, and Angel One on active-client scale. Its differentiation is also tilted toward active F&O and high-engagement trading behavior, which is exactly where regulation and churn have already tightened category growth. Trust benchmarking is not fully closed either: a complaint-monitor surface exists for Dhan, but the retained fetch did not preserve the counts needed for peer comparison. Underwriting should therefore treat Dhan''s moat
    as product-cadence driven and real, but conditional on sustained execution rather than on structural cost or distribution lock-in.'
