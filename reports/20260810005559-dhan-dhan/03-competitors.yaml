- id: product-and-capability-positioning
  title: Product and capability positioning
  body: Where Dhan does look unusual is in how much of the active-trader workflow it tries to keep inside one account. The official surfaces reviewed for this chapter show a mobile app, a full web platform, dedicated options app and web products, direct TradingView-linked execution, the DEXT T3 desktop terminal, MTF and pledge-margin tooling, and DhanHQ developer documentation with free APIs and a first-party MCP server. In retained public evidence, that is a denser surface stack than Groww's mass-market investing posture or Upstox's more pricing-and-compliance-heavy presentation. 5paisa is the closest feature rival in this retained set because its home page also leans into FnO 360, real-time greeks, strategy charts, and free APIs. The practical substitute for a trader who does not choose Dhan is therefore not one perfect competitor. It is either a bigger generalist low-cost broker, or a stitched workflow where charting, strategy, and execution live across separate surfaces rather than one
    vertically integrated trader account.
  claimRefs:
