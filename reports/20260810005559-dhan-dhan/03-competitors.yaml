- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Mitigation / diligence ask
  rows:
  - - Specialized active-trader surface stack
    - Peers can copy standalone options surfaces, desktop tools, or richer chart workflows
    - High
    - Request win-loss data showing whether DEXT T3, Options Trader, and DhanHQ materially improve conversion or retention
  - - Low-friction list pricing
    - Zerodha already matches Dhan on the most visible cash-market price anchors
    - High
    - Ask management where Dhan still wins on realized cost-to-trade after API, margin, and segment mix are included
  - - Share gains from a small base
    - Large rivals retain much stronger installed-base and brand reach
    - High
    - Benchmark acquisition efficiency, funded accounts, and active-client retention against Groww, Zerodha, Upstox, and Angel One
  - - Integrated stack can reduce tool switching
    - That benefit matters only if active traders actually consolidate workflows inside Dhan
    - Medium
    - Review cohort data for users who adopt multiple Dhan products versus single-surface app users
  - - F&O and leverage-heavy positioning
    - Regulatory tightening or lower speculative participation can hit Dhan's core cohort faster than mass-investor peers
    - High
    - Stress-test revenue sensitivity to F&O volumes, margin usage, and trader inactivity
  - - Trust can reinforce retention
    - Complaint and grievance benchmarking remains unresolved in retained evidence
    - Medium
    - Collect exchange complaint tables and third-party broker-monitor data before treating trust as a confirmed strength
  notes: The risk register emphasizes whether Dhan's feature-led edge can survive pricing parity, scale disadvantage, and regulation-driven changes in trader behavior.
