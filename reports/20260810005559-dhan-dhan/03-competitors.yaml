  rows:
  - - Dhan
    - Reference company
    - Private broker; Chittorgarh page lists 9.79 lakh clients; FY26 active-client share 2.27%
    - Active traders plus long-term investors who value specialized tooling
    - Dedicated options app+web, TradingView-linked execution, DEXT T3, DhanHQ, MTF and pledge margin
    - Far smaller distribution base than top four brokers; limited public investor-style disclosure
  - - Zerodha
    - Direct incumbent
    - 1.6+ crore customers; ~₹6 lakh crore equity investments; 15% of daily retail volume
    - Mass retail and active traders seeking low-cost execution and ecosystem breadth
    - Free delivery, very similar cash-market pricing to Dhan, strong brand trust, broader fintech ecosystem
    - Retained evidence shows less first-party specialization than Dhan around options-only and desktop-trader surfaces
  - - Groww
    - Direct scale rival
    - 2 Cr+ active investors; June 2024 share 24.7%; FY26 share 28.31%
    - Mass-market investors and simple app-led users
    - Very large distribution reach and simple consumer positioning
    - Retained official evidence is stronger on scale than on active-trader specialization
  - - Upstox
    - Direct price-and-compliance rival
    - June 2024 share 6.0%; FY26 share 4.35%; complete official compliance surface retained
    - Price-sensitive traders wanting simple digital broking and margin tools
    - Transparent tariffs, regulatory posture, margin utilities, and broad segment access
    - Charges delivery orders and shows less visible surface specialization than Dhan in retained evidence
  - - Angel One
    - Scale competitor with thin retained detail
    - June 2024 share 15.2%; FY26 share 14.79%; public listed broker context, but weak retained page detail
    - Mass retail and broad brokerage users
    - Scale and established broker presence
    - Retained official captures did not preserve usable consumer pricing or feature depth for full benchmarking
  - - 5paisa
    - Feature-adjacent discount rival
    - 50 lakh+ customers; 22.7M+ app installs; listed-broker governance surfaces retained
    - Retail traders, derivatives users, and cost-conscious investors
    - FnO 360, greeks, strategy charts, free APIs, flat ₹20 pricing
    - Public scale still smaller than Groww and Zerodha; delivery is not zero-priced like Dhan or Zerodha
  - - Bank / full-service brokers
    - Status quo / incumbent alternative
    - CNBC shows ICICI Securities at 4.57% FY26 share and SBI Securities at 2.55%
    - Existing banking customers or users prioritizing familiar institutions
    - Procurement trust, relationship inertia, and cross-sell from larger financial institutions
    - Typically weaker specialization for power-trader workflows than Dhan's retained official stack
  notes: The table combines public scale signals with retained official product evidence; private-company rows avoid invented revenue or funding figures.
