  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              Dhan should be bounded as a self-directed retail securities-brokerage product, not as the full Raise
              ecosystem or as generic financial services. Its official app, web, TradingView, DEXT, MTF, and pledge
              surfaces all point to the same included spend pool: retail execution across cash equities, ETFs, mutual
              funds, and derivatives, plus brokerage-adjacent financing and capital-efficiency features for frequent
              traders. That boundary matters because the substitute set is brutally dense. Zerodha, Upstox, Groww, and
              5paisa all compete for the same investor wallet with free account opening, low or capped brokerage, and
              broad mobile distribution. Dhan's own copy emphasizes industry-standard pricing rather than category-low
              pricing, which implies that it has to win on workflow depth, not just on commission optics. For market
              sizing purposes, that means the right benchmark is the Indian discount-brokerage and active-trading
              category, while insurance, institutional broking, and non-transactional content adjacencies should stay
              outside the core market definition used in this chapter.
