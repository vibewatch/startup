      - number: '5.4'
        title: Trust controls, safety posture, and product-tech risks
        blocks:
          - type: paragraph
            body: >-
              Dhan's public trust posture is compliance-led rather than trust-center-led. The company publishes
              grievance routes, pushes users toward SCORES and depository alerts, requires OTP-based pledge creation,
              warns against sharing credentials, disclaims stock tips, and is explicit that mutual-fund execution has
              separate risk and non-distributor boundaries. The privacy policy also shows that this is a heavily
              connected financial workflow: transaction-related data can flow to exchanges, depositories, clearing
              corporations, processing banks, KRAs, CERSAI, and other regulated counterparties. The developer surface
              adds real guardrails—order confirmation, LIMIT-by-default behavior, and lot-size validation—while AWS
              evidence suggests serious observability and risk tooling behind the scenes. The main risks are what the
              public file still cannot close. Margin products can force liquidation below a 20 percent coverage
              threshold. The strongest latency and glitch claims are still company- or partner-relayed rather than
              independently audited. Complaint-disclosure surfaces exist but are not normalized well enough for a clean
              quality KPI. And no public security-certification pack or status page was surfaced for the run, leaving a
              trust-disclosure gap even though the control posture appears serious.
