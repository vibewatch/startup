      - Main limitation
    rows:
      - - Dhan last round
        - Rs 10,000 crore equity value; about 11.1x FY26 NOI and 30.7x FY26 PAT
        - The cleanest observable price anchor for the company itself
        - The last round already embeds a meaningful growth-and-quality premium.
