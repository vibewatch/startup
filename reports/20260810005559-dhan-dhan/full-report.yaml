      - number: '1.4'
        title: Scale, Technology, and Open Gaps
        blocks:
          - type: paragraph
            body: >-
              Public scale and technology signals are directionally strong but still need careful labeling. Avendus says
              Dhan reached nearly one million active users within less than four years of launch, while the Google Play
              copy says the product is trusted by more than one million users and Dhan’s own pricing page claims more
              than one crore app downloads. Those are useful adoption indicators, but they are not interchangeable
              metrics. The technology evidence is also strong enough for overview use. Avendus and AWS both support the
              existence of the proprietary DEXT engine, with claims around sub-20 millisecond execution and AWS
              recognition for materially faster performance than industry benchmarks. DhanHQ’s documentation broadens
              the picture further by showing free trading APIs and a first-party MCP server. The open questions are more
              organizational than technical: exact board composition, clean cumulative total capital raised, and a dated
              Dhan-only workforce count remain unavailable in the public file.
