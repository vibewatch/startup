  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and share structure
        blocks:
          - type: paragraph
            body: >-
              Dhan competes inside India's discount-broker cluster, but the market boundary is wider than five app
              logos. The direct peer set is the major low-cost retail brokers that market digital onboarding,
              multi-asset investing, and app-led trading: Zerodha, Groww, Upstox, Angel One, and 5paisa. The incumbent
              or status-quo alternative is still the generalist or bank-linked broker relationship, which remains
              relevant because CNBC's FY26 summary shows traditional brokers such as ICICI Securities and SBI Securities
              gaining share even as the overall active-client pool shrank. The scale gap is central to underwriting.
              CNBC reports FY26 market share of 28.31% for Groww, 15.08% for Zerodha, 14.79% for Angel One, 4.35% for
              Upstox, and only 2.27% for Dhan, while ETBFSI shows the top five discount brokers already controlled 64.4%
              of active clients by June 2024. That means Dhan is not competing in a fragmented long tail. It is
              competing in a concentrated category where larger rivals already own distribution and brand memory.
