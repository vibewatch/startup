  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Topic
      - Thesis
      - Anti-thesis
      - What would change the view
    rows:
      - - Private-market anchor
        - The last round was large, recent, and led by credible investors at about $1.2 billion.
        - Private rounds can lag public-market risk repricing and do not reveal liquidation preferences.
        - Series B terms and any secondary or preference overhang.
      - - Operating proof
        - FY26 still showed Rs 904.9 crore NOI, Rs 325.8 crore PAT, and a 36% margin.
        - >-
          PAT already fell 20% despite revenue growth, which may signal normalized earnings power is below the headline
          round narrative.
        - FY27 margin trajectory after one-off spend and regulatory reset.
      - - Market share
        - Dhan kept gaining NSE active-client share while the wider market cooled.
        - >-
          A small-share broker can still hit a ceiling if larger peers capture most retail flows or product expansion
          stalls.
        - Two more quarters of share gains with healthier monetization.
      - - Diversification
        - Millions, insurance, Stratzy, MTF, and APIs show a broader ecosystem ambition.
        - Public sources do not yet quantify how much non-broking revenue or profit these adjacencies contribute.
        - Segment-level disclosure on broking, financing, SIP, and insurance economics.
      - - Disclosure quality
        - Enough is public to keep watching the company seriously.
        - Enough is not public to pay a premium for certainty the market has not actually been given.
        - Board, governance, complaint, and cap-table disclosure closer to public-peer standards.
    notes: The anti-thesis is disclosure-led and regulation-led rather than a denial that Dhan has real scale.
