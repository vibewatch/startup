    summary: >-
      Causal map showing how regulatory, client-activity, and leverage shocks can flow through Dhan into weaker
      profitability, heavier complaints, and harder financing conditions.
    data:
      nodes:
        - id: r1
          label: SEBI derivative tightening
          description: Higher STT, contract changes, and anti-hyperactivity measures depress the most important revenue pool
        - id: r2
          label: High F&O revenue mix
          description: Around 70% of NOI still tied to retail futures and options according to FY26 coverage
        - id: r3
          label: Lower trading activity
          description: Fewer active contracts and weaker client activity compress brokerage income
        - id: r4
          label: MTF / leverage stress
          description: Faster leverage growth creates liquidation, conduct, and customer-loss events in down markets
        - id: r5
          label: Higher complaint load
          description: Support queues and grievance handling come under pressure during volatile markets and forced exits
        - id: r6
          label: PAT and margin pressure
          description: FY26 already showed profit decline despite higher NOI as concentration and costs collided
        - id: r7
          label: Weaker financing narrative
          description: If diversification lags and profitability weakens, later capital may price less favorably
