    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and Regulatory Base
        blocks:
          - type: paragraph
            body: >-
              Raise Financial Services should be understood through the regulated entity that actually interfaces with
              customers. Dhan’s own regulatory and contact disclosures are explicit that the consumer-facing Dhan brand
              sits inside Raise Securities Private Limited, with SEBI, exchange, and depository registrations all tied
              to that company rather than to a standalone “Dhan” legal shell. NSE member-detail data corroborates the
              legal backbone by showing the same registered office in Goregaon West, Mumbai, the same trading-member
              code, and the same mix of proprietary, institutional, and retail client permissions. This matters because
              later chapter analysis on financials, complaints, and product obligations should map back to Raise
              Securities unless a source clearly references the broader Raise group. The public file also shows that the
              legal entity predates the Dhan launch by years, which helps explain why 2012 incorporation, 2015 SEBI
              registration, and 2021 product launch can all be true at the same time without being contradictory.
