        title: Multi-surface product stack and workflow coverage
        blocks:
          - type: paragraph
            body: >-
              Dhan should be read as a product family rather than a single brokerage app. The official surfaces now span
              the core Dhan mobile app, Dhan Web for big-screen trading, Options Trader on app and web for F&O-heavy
              workflows, TradingView-based chart execution, the DEXT T3 desktop terminal, and DhanHQ for programmable
              trading and data access. That stack is not cosmetic: the current app-store copy and the options pages
              repeatedly present one account that can move across watchlists, orders, portfolio, tradebook, charts, and
              funds without switching brokers or creating product-specific identities. The workflow also extends past
              simple execution. MTF and Margin Pledge Benefit are not side offers; they are embedded capital products
              that let users enlarge positions, fund options activity, and move between holdings, collateral, and trade
              placement inside the same ecosystem. The result is a broad customer workflow that starts with discovery or
              charting, moves through execution, and continues into capital management and post-trade monitoring, which
              is more expansive than the low-cost brokerage framing many Indian retail brokers still emphasize.
