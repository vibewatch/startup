  - id: FE001
    title: Product architecture map
    type: stack
    layout: wide
    summary: >-
      Dhan's public stack layers customer surfaces on top of margin services, execution systems, developer tools, and
      AWS-backed controls.
    data:
      layers:
        - label: Customer entry surfaces
          description: Dhan App, Dhan Web, Options Trader, TradingView, DEXT T3
          detail: Users can approach the same account from mobile, browser, chart, or desktop-terminal contexts.
        - label: Workflow and state layer
          description: Watchlists, orders, portfolio, tradebook, funds, charts, and strategy state
          detail: The product promise depends on shared account objects across app, web, and options surfaces.
        - label: Capital and risk layer
          description: MTF, pledge margin, RMS checks, collateral and margin services
          detail: Leverage and collateral tools sit inside the workflow rather than as separate offline services.
        - label: Execution and developer layer
          description: Custom OMS/EMS, Trading API, data API, MCP server, SDK, cloud runtime
          detail: Retail and programmable flows terminate in the same broker execution stack but expose different controls.
        - label: Infrastructure and compliance layer
          description: AWS Direct Connect, Aurora, Auto Scaling, Lambda, CloudWatch, Systems Manager, Security Hub
          detail: Availability, observability, and compliance automation are concentrated in the AWS-backed foundation.
