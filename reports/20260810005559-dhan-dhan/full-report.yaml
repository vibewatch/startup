  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Further derivatives tightening
        - Another regulatory step that materially reduces retail F&O activity or incentives
        - Hits the roughly 70% F&O-linked NOI concentration directly.
        - Move to the bear range and re-underwrite earnings.
      - - Share-gain reversal
        - NSE active-client share stops rising or falls back below roughly FY25 levels
        - Weakens the clearest live proof that Dhan can win through a tougher market.
        - Re-rate growth assumptions downward.
      - - Structural margin erosion
        - PAT margin stays meaningfully below FY26 levels even after expansion spending normalizes
        - Suggests the last round overestimated normalized earnings power.
        - Shift from fair toward stretched or expensive.
      - - Diversification remains opaque
        - No segment-level disclosure on MTF, Millions, insurance, or algorithms by the next financing checkpoint
        - Keeps the ecosystem narrative unproven in economics, not just product count.
        - Do not upgrade on adjacency story alone.
      - - Complaint or governance surprise
        - Material unresolved grievance trend or adverse financing terms surface in diligence
        - Undermines both exit readiness and willingness to pay a premium.
        - Pause or avoid until resolved.
    notes: >-
      Triggers are intentionally monitorable and map to the specific facts most likely to move valuation, not to generic
      startup risk language.
