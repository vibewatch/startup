      - number: '5.2'
        title: Execution, data, and architecture layers
        blocks:
          - type: paragraph
            body: >-
              The architecture story is unusually concrete for a private retail broker because Dhan has both a public
              AWS case study and a public developer surface. AWS says Dhan runs a custom OMS and EMS on EC2, connects
              its cloud footprint to exchanges through Direct Connect, and maintains active-active disaster recovery.
              The same case study adds concrete operating details: Aurora replacing earlier database patterns, Auto
              Scaling for peak windows, Lambda for alerts and compliance tasks, and a monitoring stack built on
              CloudWatch, Systems Manager, and Security Hub with more than 150 risk checks per order. On top of that
              execution core sits a second, clearly distinct developer layer. DhanHQ documentation and the public Python
              client show free trading APIs, paid data APIs, option-chain and market-depth endpoints, a first-party MCP
              server, and a cloud runtime for scheduled or event-driven strategies. The important architectural reading
              is that Dhan separates retail surface design from programmable tooling. DEXT T3 intentionally blocks trade
              automation and third-party integration inside the terminal itself, while DhanHQ exposes the automation,
              data, and agent hooks for users who want machine-driven workflows.
