        title: Capital Base and Unicorn Step-Up
        blocks:
          - type: paragraph
            body: >-
              The most important capital-markets fact in the public record is the October 2025 Series B. Avendus, The
              Economic Times, and Entrepreneur India align on a $120 million round that brought in Hornbill Capital,
              MUFG, BEENEXT, and a set of public-market investors. The same coverage anchors post-money valuation at
              roughly $1.2 billion or Rs 10,000 crore, making Raise a unicorn. Earlier reporting also points back to a
