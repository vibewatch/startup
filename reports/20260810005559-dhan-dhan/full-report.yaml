      - number: '3.3'
        title: Pricing, packaging, and switching power
        blocks:
          - type: paragraph
            body: >-
              Dhan's public pricing is competitive, but it is not singular. The strongest parity is with Zerodha: both
              advertise ₹0 equity-delivery brokerage and a ₹20-or-0.03% intraday anchor, which limits Dhan's ability to
              claim a pure fee advantage. Upstox, Groww, and 5paisa monetize retail orders more directly on retained
              public tariffs, but they still keep headline order fees close enough to prevent Dhan from opening a wide
              price umbrella. Dhan instead tries to offset that parity through packaging: one free demat account,
              multi-surface access, MTF, pledge benefits, TradingView-linked flows, and DhanHQ. Those features do reduce
              switching friction for active traders who want charting, options, and APIs under one login. Even so,
              price-plus-tools only matters if the target cohort cares more about workflow density than about sheer
              installed-base trust. Groww and Zerodha can still bring massive top-of-funnel reach, while Upstox and
              5paisa remain credible on simple price anchors plus enough trading utility to keep Dhan from owning the
              low-cost conversation outright.
