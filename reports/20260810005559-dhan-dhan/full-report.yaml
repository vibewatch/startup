      - number: '8.2'
        title: What still supports the fair case
        blocks:
          - type: paragraph
            body: >-
              There is enough hard operating proof to keep the last round inside a fair range. Raise Securities still
              produced a 36% profit margin in FY26, net worth rose to about Rs 916 crore, and total assets reached about
              Rs 3,375 crore. Client evidence is also directionally positive: Indian Startup News cited about 1.2 crore
              clients with around 17 lakh active clients as of March 2026, while CNBC-TV18 showed Dhan’s NSE
              active-client share rising to 2.27% from 1.98% even as the broader active-client base softened. That
              matters because a private broker deserves more credit when it can gain share through a tougher tape rather
              than only in easy bull-market conditions. Market structure still helps too. Mordor’s industry read points
              to a digital-first market where retail investors already dominate, online channels hold a majority share,
              and over 95% of new account origination comes from mobile apps. Dhan’s own pricing also does not rely on
              charging a premium: it sits at zero delivery brokerage and Rs 20 or 0.03% execution pricing, which broadly
              matches peer discount-broker constructs. That means the bull portion of the story has to come from
              execution, product velocity, and adjacent monetization such as MTF, Millions, insurance, and Stratzy, not
              from a hidden pricing moat.
