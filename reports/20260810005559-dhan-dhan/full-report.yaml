              step-up over three years. The funding story is credible, but not perfectly complete. Public sources do not
              fully reconcile cumulative proceeds, secondary components, or post-round governance rights. That means the
              headline valuation is well supported, while the precise capital-stack mechanics remain under-disclosed.
