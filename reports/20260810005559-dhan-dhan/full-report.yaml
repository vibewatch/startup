  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Series B terms
        - Cap table, liquidation preferences, any ratchets, and secondary versus primary split
        - The last round is the anchor price, so hidden terms can materially change effective entry economics.
        - Ask management or lead investors for the term-sheet summary.
      - - Segment revenue mix
        - Broking, MTF / funding, Millions / SIP, insurance, and algorithmic products by revenue and contribution margin
        - The core debate is whether diversification is economically real or still mostly narrative.
        - Request FY26 and FY27 YTD segment pack.
      - - Client quality and complaints
        - Complaint counts, resolution times, churn, and active-client retention by cohort
        - A buy call needs cleaner service-quality evidence than a registry introduction page.
        - Request exchange complaint dashboard export plus internal retention cohort data.
      - - MTF credit quality
        - Funding costs, delinquency or forced-sell history, and loss experience of the Rs 505 crore book
        - Lending-like optionality is only accretive if risk remains controlled.
        - Request MTF risk review and lender-facility details.
      - - Exit readiness
        - Board composition, governance cadence, audit granularity, and financing timeline
        - Peer disclosure depth remains a key reason the call stays at track.
        - Request board deck, governance memo, and financing roadmap.
    notes: These are the evidence items most likely to move the call; none are cosmetic asks.
