schemaVersion: "report-v2"
artifact: financials
slug: cockroach-labs
runDate: 2026-10-25
company:
  name: Cockroach Labs
chapter:
  number: 4
  title: Financials
  summary: Cockroach Labs has a credible multi-product database monetization model and evidence of enterprise adoption, but current public evidence does not disclose a current revenue base, margins, cash balance, burn, or runway. The underwriting case therefore depends on validating conversion from cloud adoption and ARR growth into durable, cash-generative revenue.
sections:
  - id: monetization-model
    title: Monetization model and revenue quality
    body: >-
      Cockroach Labs monetizes a distributed SQL database through managed cloud
      offerings and self-hosted enterprise software rather than through a single
      disclosed revenue stream. A 2026 company release says ARR growth was driven
      by enterprise customer growth and deeper adoption among existing customers,
      but it does not publish the ARR amount, growth rate, renewal rate, or mix.
      Historical independent coverage describes Dedicated as a managed cluster,
      Serverless as consumption-based, and Self-Hosted as a customer-managed
      deployment. That mix can support expansion from usage into enterprise
      contracts, but it also makes list pricing, recognized revenue, and gross
      margin difficult to infer without contracts and a current finance pack.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001]
  - id: pricing-and-sales-efficiency
    title: Pricing, GTM, and sales-efficiency proxies
    body: >-
      Public pricing evidence is directional rather than a realized-price
      dataset. The independent technical-company profile says Dedicated pricing
      is based on cluster resources and Serverless charges for storage and
      Request Units; a current cost review reports three tiers, a free Basic
      tier, and custom pricing, while warning that contract terms and negotiated
      discounts affect the outcome. The 2026 company release identifies IBM as an
      OEM partner and describes deeper enterprise adoption, which supports a
      partner-assisted motion. However, no public source supplies CAC, payback,
      sales-cycle duration, quota attainment, implementation fees, or channel
      margin. These are material underwriting gaps, not values to estimate from
      list prices.
    claimRefs: [CI005, CI006, CI007, CI008]
    tableRefs: [TI002]
  - id: cost-structure-and-capital
    title: Cost structure and capital adequacy
    body: >-
      The product architecture implies a meaningful service-delivery cost base:
      distributed replication, multi-region operation, support, migration, and
      cross-region data transfer all sit alongside ordinary cloud infrastructure
      costs. An independent cost review specifically identifies migration,
      professional services, and cross-region transfer as costs beyond a license
      fee. Historical funding coverage reports $633 million of cumulative funding
      and a $5 billion valuation in the 2021 Series F, while current third-party
      profile data reports $579.6 million across four rounds and labels revenue
      and headcount estimates explicitly. These figures are not a current cash
      balance or runway. No assigned source discloses cash, burn, debt, capex,
      liquidity preference, or a next-round trigger, so capital adequacy remains
      unresolved.
    claimRefs: [CI009, CI010, CI011, CI012, CI013]
    tableRefs: [TI003]
  - id: financial-verdict
    title: Financial underwriting verdict
    body: >-
      The financial case is strongest on revenue-mechanism plausibility and
      weakest on observability. Cloud adoption, enterprise expansion, and partner
      distribution are consistent with a scalable recurring model, but the
      available evidence does not distinguish ARR from recognized revenue or
      establish gross margin, retention, customer concentration, cash burn, or
      runway. The 2023 revenue estimate of $128.3 million is explicitly marked as
      an estimate by a third-party profile and should not be treated as company
      disclosure; the 2021 valuation is historical and not a current mark. A
      financing decision should therefore be gated on a current income statement,
      ARR bridge, cohort retention, cloud unit-cost schedule, cash forecast, and
      debt and preferred-equity terms.
    claimRefs: [CI011, CI012, CI013, CI014, CI015]
    figureRefs: [FI001]
callouts:
  - calloutType: strength
    title: Monetization has multiple paths
    body: Managed cloud, consumption-based service, and self-hosted enterprise licensing create several routes to monetize the same distributed-SQL platform.
    claimRefs: [CI001, CI003]
  - calloutType: risk
    title: Public financial visibility is insufficient
    body: Current revenue, margin, cash, burn, runway, retention, and customer concentration are not disclosed by the retained evidence, so operating leverage cannot be underwritten.
    claimRefs: [CI011, CI013, CI015]
  - calloutType: recommendation
    title: Require a finance-room data pack
    body: Treat the company as financially promising but not financeable on public evidence alone until management supplies a current ARR-to-revenue bridge, cash forecast, and unit-cost detail.
    claimRefs: [CI014, CI015]
tables:
  - id: TI001
    title: Revenue streams and evidence quality
    columns: [Stream, Mechanism, Unit or driver, Current value/status, Quality, Diligence ask]
    rows:
      - [Managed cloud - Dedicated, "Fully managed single-tenant database service", "Cluster resources", "Mechanism described; current revenue not disclosed", "Third-party description; no realized-price data", "ARR and recognized revenue by Dedicated cohort"]
      - [Managed cloud - Serverless, "Multi-tenant consumption-based database service", "Storage and Request Units", "Mechanism described; current revenue not disclosed", "Third-party description; no usage mix", "Usage, overage, and gross-margin bridge by cohort"]
      - [Self-hosted enterprise, "Enterprise license for customer-managed deployments", "License and support contract", "Offering described; mix not disclosed", "Third-party description; no contract sample", "Bookings, renewal, support attach, and revenue recognition policy"]
      - [Partner/OEM motion, "Distribution through strategic partners including IBM", "Partner-sourced enterprise workload", "IBM OEM relationship reported in 2026", "Company-issued release", "Partner-sourced ARR, referral economics, and concentration"]
    notes: "Mechanisms are supported by retained sources, but current revenue, mix, and realized pricing are unavailable; list or model descriptions are not revenue recognition evidence."
    claimRefs: [CI001, CI002, CI003, CI007]
  - id: TI002
    title: Pricing and monetization evidence
    columns: [Offer or term, Price/unit/contract model, List versus realized pricing, Evidence status, Implication, Diligence ask]
    rows:
      - [Basic tier, "Free tier reported by current cost review", "List/free entry point; no realized conversion", "Third-party current pricing summary", "Supports land motion but may carry support and conversion costs", "Free-to-paid conversion and support cost per free account"]
      - [Standard tier, "Tiered plan; price varies by usage and terms", "List pricing not independently verified", "Third-party current pricing summary", "Potential usage expansion; realized discount unknown", "Price book, discount bands, and usage distribution"]
      - [Advanced/custom, "Custom pricing on request", "Negotiated price; no public median", "Third-party current pricing summary", "Enterprise mix may improve ACV but obscures comparability", "Contracted ACV, implementation fees, and renewal uplift"]
      - [Serverless consumption, "Storage plus Request Units", "Metered list model; realized rate unknown", "Independent technical-company profile", "Aligns revenue with workload growth but exposes cost-to-serve", "RU gross margin, throttling, and overage realization"]
    notes: "The table separates public pricing mechanics from realized pricing; no retained source provides a representative contract, discount schedule, or customer-level monetization cohort."
    claimRefs: [CI005, CI006]
  - id: TI003
    title: Unit economics and capital adequacy
    columns: [Metric, Value, Confidence, Why it matters, Diligence ask]
    rows:
      - [ARR, null, low, "2026 release says ARR grew but gives no amount or rate", "Current ARR bridge by product and cohort"]
      - [Revenue, "$128.3M estimated for Dec 2023", medium, "Provides a dated scale proxy but is not company disclosure", "Audited or management revenue by year and recognition policy"]
      - [Gross margin, null, low, "Distributed infrastructure and support costs may materially affect leverage", "Cloud COGS, support labor, hosting, and pass-through costs"]
      - [CAC/payback, null, low, "No public sales-efficiency measure supports growth quality", "Fully loaded CAC, payback, sales cycle, and channel economics"]
      - [Cash/burn/runway, null, low, "Funding raised is not cash available and cannot establish runway", "Latest cash balance, monthly burn, debt, covenants, and financing plan"]
    notes: "Null means unavailable in the assigned public evidence, not zero. The revenue figure is explicitly an estimate; funding and valuation figures are historical financing context rather than cash-on-hand measures."
    claimRefs: [CI009, CI011, CI012, CI013, CI015]
figures:
