    title: Revenue model bridge
    type: flow
    summary: Customer workload and deployment choice feed distinct Cockroach Labs monetization mechanisms, while gross-profit conversion remains an evidence gap.
    data:
      nodes:
        - id: workload
          label: Customer workload
          detail: "Transactional workload growth is the commercial demand input."
        - id: dedicated
          label: CockroachDB Dedicated
          detail: "Managed single-tenant service priced around cluster resources."
        - id: serverless
          label: CockroachDB Serverless
          detail: "Consumption model described using storage and Request Units."
        - id: self-hosted
          label: Self-hosted enterprise
          detail: "Customer-managed deployment monetized through enterprise licensing."
        - id: revenue
          label: Recurring revenue
          detail: "ARR growth is reported, but current amount and recognized revenue are undisclosed."
        - id: gross-profit
          label: Gross profit
          detail: "Cloud COGS, support, migration, and transfer costs are not publicly disclosed."
      edges:
        - from: workload
          to: dedicated
        - from: workload
          to: serverless
        - from: workload
          to: self-hosted
        - from: dedicated
          to: revenue
        - from: serverless
          to: revenue
        - from: self-hosted
          to: revenue
        - from: revenue
          to: gross-profit
    claimRefs: [CI001, CI003, CI005, CI009, CI015]
