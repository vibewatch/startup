      - ["Automatic sharding or rebalancing", "Automatic range distribution and rebalancing", "Manual partitioning or extensions", "Managed storage replication; write sharding not established", "Read pools and autoscaling; write sharding not established", "Built-in sharding and live resharding"]
      - ["Strong transactional consistency", "Serializable and Raft-based quorum writes", "ACID and serializable isolation", "Data replication with local reads; consistency tradeoff requires workload review", "PostgreSQL-compatible transactional engine", "MySQL scaling layer; distributed transaction semantics not established"]
