      - [Google Cloud Spanner, "Iowa regional list rates reported at $0.72, $0.984, and $1.368 per node-hour for Standard, Enterprise, and Enterprise Plus", "Managed compute, storage, backup, and regional or multi-region configurations", "Storage, replication, egress, topology, and negotiated discounts prevent a simple all-in comparison", "Hyperscaler integration is powerful, but higher-resilience topologies raise baseline spend"]
      - [EDB, "Reported cloud software rates range from $0.0856 to $0.2568 per vCPU-hour before distributed-HA and infrastructure charges", "Managed and self-managed PostgreSQL editions, including Oracle-compatible options", "Self-managed subscriptions, discounts, services, infrastructure, and replica multipliers are not fully public", "PostgreSQL and Oracle-migration economics create an incumbent alternative to CockroachDB"]
      - [PostgreSQL, "No license fee; infrastructure, DBA labor, and third-party HA/monitoring are cost drivers", "Core relational database and extensive ecosystem", "Managed-service and labor costs vary by deployment", "Low software-license barrier and large skills pool pressure paid alternatives"]
      - [Amazon Aurora Global Database, "Managed AWS consumption pricing; exact comparable figure not retained", "Cross-region replication, local reads, and regional promotion", "AWS-specific network and service costs require workload model", "Strong distribution for AWS-standardized buyers, but not documented as native multi-active writes"]
      - [Google AlloyDB, "Starting at $0.06608/vCPU-hour, $0.0112/GB-hour memory, and $0.0004109/GB-hour regional storage", "Managed PostgreSQL compatibility, read pools, AI features, and 99.99% uptime SLA", "Committed-use discounts and network charges apply; price is not a CockroachDB quote", "Hyperscaler bundle can undercut bespoke platform economics for Google Cloud buyers"]
      - [Vitess, "Open-source/CNCF project; commercial operating cost not disclosed in assigned evidence", "MySQL sharding, resharding, query rewriting, and failure repair", "Labor and operating model remain workload-specific", "Can preserve MySQL investment where CockroachDB's PostgreSQL compatibility is not decisive"]
    notes: "All figures are public list-price signals reported by the cited pages; they are not normalized to a common workload, topology, region, support plan, discount, or contract term, and realized pricing remains an evidence gap."
    claimRefs: [CP009, CP010, CP011, CP012]
figures:
  - id: FP001
    title: Competitive positioning by distribution and operational integration
    type: quadrant
    summary: "Ordinal positioning based on documented deployment and operating capabilities, not a measured market ranking."
    data:
      points:
        - {label: CockroachDB, x: 9, y: 9, detail: "Multi-region active writes, serializable consistency, automatic rebalancing, and integrated repair are documented in assigned sources."}
        - {label: PostgreSQL, x: 3, y: 5, detail: "Broad ecosystem and strong relational capabilities; distributed scale and failover usually require additional tooling."}
        - {label: Amazon Aurora Global Database, x: 6, y: 7, detail: "Managed global database with local reads and regional promotion, but active-active writes are not documented in the assigned source."}
        - {label: Google AlloyDB, x: 6, y: 8, detail: "Managed PostgreSQL compatibility, read pools, cross-region replicas, and automated operations are documented."}
        - {label: Vitess, x: 7, y: 6, detail: "Transparent sharding and resharding are documented, but the source is MySQL-oriented and does not establish CockroachDB-equivalent transaction semantics."}
        - {label: Single-region managed PostgreSQL, x: 4, y: 6, detail: "High operational simplicity for local workloads, with no assigned evidence of native multi-region active-active behavior."}
      xAxis: {label: "Distributed / multi-region capability", min: 0, max: 10}
      yAxis: {label: "Operational integration", min: 0, max: 10}
    approximationNotes: "Scores are analyst ordinal mappings from the cited capability evidence; they are not vendor benchmarks, market shares, or measured total-cost scores."
    claimRefs: [CP005, CP006, CP007, CP008, CP014, CP015]
callouts:
  - calloutType: strength
    title: Durable wedge
    body: CockroachDB has a defensible wedge when globally distributed writes and strong consistency are simultaneous buying requirements, because the alternatives documented here generally require passive replicas, manual sharding, external coordination, or cloud concentration.
    claimRefs: [CP005, CP006, CP007, CP015]
  - calloutType: risk
    title: Ecosystem and cloud-platform pressure
    body: PostgreSQL's broad developer adoption and hyperscaler distribution can make a narrower, simpler managed service the default choice unless CockroachDB proves lower total operational risk for the target workload.
    claimRefs: [CP012, CP013, CP014, CP016]
  - calloutType: recommendation
    title: Competitive judgment
    body: Cockroach Labs should be underwritten as a focused platform for high-consequence, globally distributed transactional workloads rather than as a generic PostgreSQL replacement. The commercial case is strongest when multi-region writes, locality, and resilience are hard requirements; it is weaker when a buyer can accept single-region PostgreSQL, passive replicas, or a hyperscaler-managed service.
    claimRefs: [CP001, CP005, CP009, CP013, CP015]
