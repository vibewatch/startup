      - [Vitess, "Adjacent sharding layer", "CNCF graduated project", "Large MySQL deployments needing horizontal scale", "Application-transparent sharding, resharding, query rewriting, and automated primary failure repair", "MySQL-oriented rather than a PostgreSQL-compatible distributed SQL system"]
