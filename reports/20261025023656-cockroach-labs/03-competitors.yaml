      - [Google Cloud Spanner, "Direct hyperscaler distributed SQL", "Google Cloud service; product financials are not separately disclosed in assigned evidence", "Globally distributed transactional workloads standardized on Google Cloud", "Managed global consistency and multi-region availability", "Google Cloud concentration and topology-dependent pricing reduce portability and price comparability"]
