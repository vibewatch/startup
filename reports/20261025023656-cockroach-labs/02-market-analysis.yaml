    notes: "Values are retained as reported and are not additive. Different publishers define distributed SQL, distributed database, cloud database, and adjacent AI infrastructure differently; no SAM or SOM is estimated without company win-rate, segment, and budget data."
    claimRefs: [CM005, CM006, CM007, CM008]
  - id: TM003
    title: Segment / buyer map
    columns: [Segment, Buyer, User, Payer, Workflow, Budget owner, Adoption trigger]
    rows:
      - [Global digital products, Platform or database engineering, Application and SRE teams, Product and technology budget, Always-on transactional services across regions, CTO or platform VP, Single-primary scale or availability bottleneck]
      - [Financial services and payments, "Architecture, risk, and application leadership", Payments and ledger engineers, Business-unit technology and risk budget, Strongly consistent cross-region transactions, "CIO and risk leadership", Payment correctness and resilience requirements]
      - [Regulated multinational, Data governance and security, Regional application teams, Enterprise infrastructure budget, Locality and compliance-aware data placement, "CIO, CISO, and compliance", Residency or operational-resilience mandate]
      - [Cloud and hybrid modernization, Enterprise architecture, Database and migration teams, Transformation program budget, Replatforming legacy relational workloads, CIO or modernization office, "Cloud migration, Kubernetes, or partner-led modernization"]
    notes: "Buyer roles are an evidence-constrained operating model inferred from the assigned product, partner, customer, pricing, and market sources; account-level budget ownership and conversion rates remain unverified."
    claimRefs: [CM010, CM011, CM012, CM013, CM014]

