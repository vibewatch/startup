        - {label: Financial durability, values: [null, "High residual", null]}
        - {label: Competitive pressure, values: [null, null, "Medium-high exposure"]}
        - {label: Partner and cloud dependency, values: [null, "Medium-high exposure", null]}
    claimRefs: [CR003, CR008, CR011, CR013, CR016]
