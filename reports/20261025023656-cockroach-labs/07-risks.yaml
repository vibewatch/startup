schemaVersion: "report-v2"
artifact: risks
slug: cockroach-labs
runDate: 2026-10-25
company:
  name: Cockroach Labs
chapter:
  number: 7
  title: Risks
  summary: "Cockroach Labs' principal risks are execution and economic rather than a documented regulatory failure: the product must deliver distributed resilience while facing strong PostgreSQL, hyperscaler, and incumbent alternatives. Public evidence also leaves current financial durability, concentration, incident history, and contractual exposure insufficiently verified."
sections:
  - id: risk-posture
    title: Risk posture and thesis-break conditions
    body: "Cockroach Labs is positioned around workloads where availability, consistency, geographic locality, and regulatory controls matter, but the same positioning creates a demanding operating burden. Its own materials describe multi-region resilience, compliance controls, and continuous product expansion; those are product claims, not independent proof of realized service performance. A January 2026 company release reports throughput improvements and enterprise adoption, while independent profiles rely partly on estimates and historical data. The investment risk is therefore asymmetric: a few large reliability, migration, or pricing failures could damage trust faster than broad market growth can repair it. The thesis breaks if production incidents materially impair customer workloads, if migrations require materially more services than buyers will fund, or if current cash, retention, and concentration data fail diligence."
    claimRefs: [CR001, CR002, CR003, CR004]
    figureRefs: [FR001]
  - id: regulatory-legal
    title: Regulatory, legal, and data-governance exposure
    body: The public record reviewed here does not establish a current enforcement action, material lawsuit, license dispute, or privacy incident involving Cockroach Labs. That absence is not evidence that no such matter exists. The product is marketed for regulated and geographically distributed workloads, and the company lists GDPR, PDPA, CCPA, and DORA as relevant regulatory drivers. Geographic placement and compliance features can reduce customer exposure, but they also make configuration, data-residency controls, access governance, and evidence of certification commercially important. PostgreSQL remains a widely adopted open-source alternative with its own security and replication model, so Cockroach Labs must prove that its source-available licensing, controls, and support commitments satisfy each customer's jurisdiction and procurement standard. Legal diligence should test certifications, DPAs, subprocessors, BSL obligations, open-source notices, export controls, and unresolved claims rather than infer clearance from marketing pages.
    claimRefs: [CR005, CR006, CR007, CR008]
    tableRefs: [TR002]
  - id: operational-quality-security
    title: Operational, quality, and security risk
    body: CockroachDB's architecture is intended to survive node, disk, rack, and region failures, and the company says it introduced a benchmark that evaluates partitions, disk stalls, restarts, and zonal outages. These are useful test dimensions, but the cited comparison is company-issued and does not establish production incident frequency, customer-impact duration, or independently reproducible results. Distributed consensus, online schema changes, multi-cloud networking, vector search, and migration tooling expand the surface area that must be operated correctly. CostBench identifies migration, professional services, and cross-region transfer as costs beyond licensing; that supports a practical implementation-risk hypothesis, not a complete cost model. Diligence should obtain incident history, SLO attainment, support escalations, rollback evidence, security attestations, penetration-test summaries, and customer references for the largest deployments.
    claimRefs: [CR009, CR010, CR011, CR012]
    tableRefs: [TR003]
  - id: dependency-financial
    title: Partner, dependency, and financial-model risk
    body: "Route-to-market and platform dependencies are material because Cockroach Labs sells into an ecosystem dominated by AWS, Google Cloud, Microsoft Azure, PostgreSQL, and large database vendors. The company reports an IBM OEM relationship and marketplace or hybrid-cloud reach, but partner announcements do not quantify sourced pipeline, renewal economics, or dependency concentration. Independent public profiles estimate revenue and report historical funding and headcount, while explicitly noting that the company has not published revenue; those figures cannot establish ARR quality, cash runway, burn, gross margin, or customer concentration. Pricing sensitivity is also plausible: the product's value depends on reducing downtime and operational burden, yet cross-region transfer, migration, support, and implementation costs can change total cost of ownership. The decisive diligence asks are current cash and burn, renewal and expansion by cohort, top-account exposure, cloud and partner terms, and downside financing capacity."
    claimRefs: [CR002, CR006, CR007, CR010, CR012, CR013, CR014, CR015, CR016]
    tableRefs: [TR001]
callouts:
  - calloutType: risk
    title: Highest-conviction risk
    body: The largest unresolved risk is not a proven incident but the gap between a resilience-led product promise and independently verified production, financial, and customer-retention evidence.
    claimRefs: [CR001, CR003, CR011, CR016]
  - calloutType: assumption
    title: Diligence boundary
    body: Public evidence does not support a precise probability of litigation, outage, breach, or insolvency; those items remain diligence questions rather than quantified loss forecasts.
    claimRefs: [CR004, CR008, CR012, CR015]
tables:
  - id: TR001
    title: Partner / dependency risk register
    columns: [Dependency, Counterparty or role, Concentration evidence, Failure scenario, Severity, Mitigation, Residual exposure]
    rows:
      - [Cloud infrastructure and marketplaces, "AWS, Google Cloud, and Microsoft Azure / hosting and distribution", "Not quantified", "Pricing, egress, regional disruption, or platform terms impair economics or availability", "High", "Multi-cloud, hybrid, and self-hosted deployment options", "Portability and recovery still require workload-level proof"]
      - [OEM distribution, "IBM / enterprise modernization channel", "Relationship announced; revenue contribution undisclosed", "OEM demand, terms, or prioritization weakens", "Medium", "Broader direct and partner routes", "Partner-sourced pipeline and renewal economics are unavailable"]
      - [PostgreSQL ecosystem, "Drivers, tools, skills, and customer alternatives", "Broad ecosystem is independently documented", "Feature divergence delays migration or mature PostgreSQL displaces CockroachDB", "High", "PostgreSQL compatibility and migration tooling", "Release-specific validation remains necessary"]
      - [Implementation capacity, "Cockroach Labs and services partners", "Professional-services reliance not quantified", "Complex deployments require scarce specialist support or exceed budget", "Medium-high", "Managed service, documentation, and enterprise support", "Support intensity and delivery margin are undisclosed"]
      - [Large enterprise accounts, "Mission-critical customers / revenue base", "Top-customer share and retention are not public", "Loss or delayed expansion of a major account weakens growth and runway", "Critical", "Deeper adoption is company-reported", "High until cohort and concentration schedules are reviewed"]
    notes: "Public evidence does not quantify partner- or customer-revenue concentration; unknown fields are paired with diligence paths rather than treated as zero exposure."
    claimRefs: [CR002, CR006, CR007, CR010, CR012, CR013, CR014, CR015, CR016]
  - id: TR002
    title: Regulatory / legal risk register
    columns: [Rule, jurisdiction or scope, Public status, Severity, Mitigation, Residual exposure, Diligence path]
    rows:
      - [Data residency and privacy obligations, "EU / US / other regulated markets", "Relevant requirements identified; company incident or enforcement status not established", "High", "Regional controls and compliance positioning are marketed", "Medium-high", "Review DPA, subprocessors, residency controls, audit evidence, and open matters"]
      - [Operational resilience regulation, "DORA and regulated financial workloads", "Named as a market driver; customer-specific compliance not verified", "Medium-high", "Resilience and locality features are described", "Medium", "Map product controls to each customer's regulated-entity obligations"]
      - [Source-available licensing and open-source obligations, "Global software distribution", "Business Source License described in third-party analysis", "Medium", "Product licensing and support model", "Medium", "Obtain current license notices, use restrictions, and counsel review"]
      - ["Litigation, enforcement, or IP claims", "Global", "No current matter established in reviewed public sources", "Unknown", "None evidenced by this pool", "Unknown", "Run counsel-led docket, patent, sanctions, and enforcement searches"]
    notes: "A missing public incident or case is recorded as an unresolved diligence state, not as proof of absence."
    claimRefs: [CR005, CR006, CR007, CR008]
    enumerationScope:
      coverage: partial
      basis: "Public regulatory drivers, licensing references, and explicitly unresolved legal-status checks in the assigned evidence pool."
  - id: TR003
    title: Operational / quality / security risk register
    columns: [Failure mode, Likelihood, Severity, Mitigation maturity, Residual exposure, Unresolved gap]
    rows:
      - [Region or zone outage, "Medium", "High", "Company describes consensus and adversity testing", "Medium-high", "Independent production recovery evidence and incident distribution"]
      - [Distributed migration complexity, "Medium", "High", "MOLT and migration support are described", "Medium-high", "Time, staffing, rollback, and data-validation evidence by workload"]
      - [Cross-region transfer and support cost escalation, "Medium", "Medium-high", "Pricing and cost guidance exists but is incomplete", "Medium", "Customer-level TCO and negotiated terms"]
      - [Security or compliance misconfiguration, "Medium", "High", "Controls and certifications are marketed", "Medium-high", "Current attestations, penetration results, and customer audit findings"]
    notes: "The table separates product capabilities from evidence of operating outcomes; residual exposure remains elevated where no independent denominator is public."
    claimRefs: [CR009, CR010, CR011, CR012]
figures:
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: Residual exposure is highest where operational or financial outcomes lack independent denominators.
    data:
