      - [Cockroach Continuum, Enterprise platform teams managing many databases and AI-era demand, 2026 launch narrative; auto-scaling compute marked coming soon, Estate-level pooling and agent-assisted operations, General availability controls product scope and operating-risk assessment]
    notes: "Rows synthesize the assigned official, partner, technical, and comparison sources; the Continuum row separates a 2026 launch claim from the source's explicit roadmap status."
    claimRefs: [CE001, CE004, CE005, CE006]
  - id: TE002
    title: Workflow and use-case table
    columns: [User job, Current workflow, Cockroach Labs solution, Measurable benefit or signal, Limitation or diligence ask]
    rows:
      - [Keep mission-critical transactions correct across regions, Single-node or manually replicated database topology, Distributed SQL with strong consistency and geo-distribution, Official materials emphasize ACID consistency and global data placement, Validate application topology and recovery objectives in production]
      - [Scale application reads and writes without manual sharding, Pre-plan shards and operate rebalancing tooling, Automatic range splitting merging and rebalancing, Comparison material describes online automatic handling, Measure workload-specific scaling and operator effort]
      - [Migrate an existing PostgreSQL application, Rework drivers syntax or operational assumptions, PostgreSQL wire protocol drivers and ORMs with documented exceptions, Compatibility can reduce application-code changes, Run an incompatibility inventory because unsupported behavior remains]
      - [Operate a growing database estate for AI workloads, Provision separate systems around peak demand, Continuum proposes pooled capacity and automated operations, Company release describes estate-level management and consumption economics, Auto-scaling compute is marked coming soon and needs availability evidence]
    notes: "Benefits are kept distinct from unsupported universal performance claims; no customer-specific outcome or denominator was available in the retained evidence."
    claimRefs: [CE002, CE008, CE009, CE012]
  - id: TE003
    title: Technology and operating architecture
    columns: [Layer or process, Role, Dependency, Risk]
    rows:
      - [SQL and PostgreSQL compatibility, Application access and migration surface, PostgreSQL drivers tools and ORM behavior, Syntax and semantic exceptions require testing]
      - [Distributed transactional key-value layer, Strongly consistent storage and ACID transactions, Replication and consensus across nodes, Distributed failures and contention require operational expertise]
      - [Range management and geo-partitioning, Horizontal scale and data locality, Cluster topology region configuration and workload placement, Wrong topology can increase latency and cost]
      - [Changefeeds and integrations, Stream changes to downstream systems, Kafka cloud storage webhooks or connectors, Downstream correctness and egress economics need validation]
      - [Managed cloud and estate operations, Provisioning backup recovery and operational control, Cloud plan terms support model and deployment choice, Availability and support vary by plan and contract]
    notes: "Architecture rows combine official documentation with the assigned comparison source; dependency and risk fields are analytical qualifications rather than claims of a universal deployment design."
    claimRefs: [CE008, CE009, CE010, CE011]
