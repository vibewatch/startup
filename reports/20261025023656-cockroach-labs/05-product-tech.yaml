chapter:
  number: 5
  title: Product & Technology
  summary: CockroachDB is a distributed SQL system built around strong consistency, PostgreSQL compatibility, and automatic horizontal scale. The evidence supports a technically differentiated transactional platform, while portability gaps, distributed-system expertise requirements, cost at resilient multi-region scale, and roadmap-status claims remain material diligence constraints.
sections:
  - id: product-and-customer-workflow
    title: Product and customer workflow
    body: >-
      CockroachDB is positioned as a cloud-native distributed SQL database for
      modern, data-intensive applications. In customer workflow terms, an
      application connects through PostgreSQL-compatible drivers and tools,
      writes transactional data to a logical cluster, and can place or replicate
      data across regions while retaining a SQL interface. The product therefore
      targets systems of record where correctness, availability, and geographic
      distribution matter more than a single-node database's simplest operating
      model. The official FAQ describes transactional and strongly consistent
      storage, horizontal scale, automatic replication and recovery, while the
      Red Hat partner brief describes rolling node updates and a single logical
      database across regions. These are product capabilities, not proof that
      every workload migrates without code or topology changes.
    claimRefs: [CE001, CE002, CE003]
    tableRefs: [TE001]
  - id: modules-and-maturity
    title: Product lines and maturity
    body: >-
      The current product surface has a core database engine, managed cloud
      deployment options, self-hosted or customer-cloud deployment, and newer
      estate-level capabilities. The core engine and PostgreSQL-compatible
      access are documented capabilities; managed Basic, Standard, and Advanced
      plans are described in the assigned comparison material; and Cockroach
      Continuum is presented in a 2026 company release as a new database-estate
      operating model. The distinction matters: a stable database primitive is
      not equivalent to a generally available AI operations layer or autoscaling
      roadmap item. The Continuum release explicitly labels auto-scaling compute
      “Coming soon,” so product maturity should be evaluated by SKU, deployment
      mode, and availability status rather than by the broad platform narrative.
    claimRefs: [CE004, CE005, CE006, CE007]
    tableRefs: [TE002]
  - id: architecture-and-operating-model
    title: Architecture and operating model
    body: >-
      The architecture combines a transactional key-value substrate with SQL,
      distributed consensus, replication, and online rebalancing. Official
      documentation says the system scales horizontally, survives failures with
      minimal latency disruption and no manual intervention, and supports
      strongly consistent ACID transactions. The PostgreSQL-compatibility
      documentation narrows that promise: most PostgreSQL syntax, drivers, and
      ORMs are supported, but some features behave differently because they are
      difficult to implement in a distributed system. The assigned comparison
      material describes automatic range splitting, merging, rebalancing,
      geo-partitioning, and changefeeds; these features create a powerful
      operating model but also a larger configuration and cost surface than a
      single-node deployment. Architecture is therefore a differentiation and
      an implementation dependency at the same time.
    claimRefs: [CE008, CE009, CE010, CE011]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: differentiation-trust-and-risks
    title: Differentiation, trust, and technical risks
    body: >-
      Cockroach Labs differentiates on distributed transactional correctness,
      survivability, data locality, and PostgreSQL ergonomics. The 2026 release
      reports CockroachDB 25.2 throughput improvements of up to 50 percent,
      leader leases, buffered writes, WAL failover, and PostgreSQL-compatible
      vector indexing through C-SPANN; these are company-issued product claims
      and should not be treated as independent benchmark results. Independent
      comparison text reports positive feedback on resilience and compatibility,
      but also a learning curve for distributed performance tuning, specialist
      help for complex designs, and gaps in analytics, documentation, or
      administrative workflows. The status history is only an incident-history
      surface, not evidence that incidents did or did not occur. Key diligence
      items are production-specific reliability data, security and compliance
      attestations by deployment, migration exceptions, realized multi-region
      cost, and whether newer AI-oriented capabilities are generally available.
    claimRefs: [CE012, CE013, CE014]
    tableRefs: []
    figureRefs: []
