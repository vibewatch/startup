    title: CockroachDB product architecture map
    type: stack
    summary: The product layers a PostgreSQL-compatible application surface over distributed transactional storage and operational deployment controls.
    data:
      layers:
        - label: Application and migration surface
          detail: PostgreSQL-compatible application access and migration layer
          items:
            - name: PostgreSQL wire protocol
              detail: Drivers, ORMs, SQL tools, and application connections
              status: documented
            - name: SQL API
              detail: Structuring, manipulating, and querying transactional data
              status: documented
        - label: Distributed data platform
          detail: Strongly consistent storage, replication, and automatic range management
          items:
            - name: Transactional key-value store
              detail: Strong consistency and ACID transaction substrate
              status: documented
            - name: Replication and consensus
              detail: Failure handling, rebalancing, and geographic placement
              status: documented
            - name: Range management
              detail: Online splitting, merging, and rebalancing described in comparison material
              status: documented in assigned source
        - label: Deployment and operations
          detail: Managed, self-hosted, and estate-level operating surfaces
          items:
            - name: CockroachDB Cloud
              detail: Managed Basic, Standard preview, and Advanced plan descriptions
              status: plan-dependent
            - name: Self-hosted and customer cloud
              detail: Deployment options outside managed plan cards
              status: available option
            - name: Cockroach Continuum
              detail: Estate-level pooling and agent-assisted operations; auto-scaling compute marked coming soon
              status: launch and roadmap claims
        - label: Transaction and consistency controls
          detail: Transaction semantics and correctness controls
          items:
            - name: Strong consistency
              detail: ACID transaction semantics described in official documentation
              status: documented
        - label: Data movement and integration
          detail: Change propagation to downstream systems
          items:
            - name: Changefeeds
              detail: Streaming changes to Kafka, cloud storage, and webhooks described in comparison material
              status: documented in assigned source
        - label: Trust and service assurance
          detail: Deployment-specific security, reliability, and compliance evidence
          items:
            - name: Security and reliability evidence
              detail: Requires deployment-specific attestations, SLA performance, and incident evidence
              status: diligence gap
    claimRefs: [CE001, CE008, CE009, CE010, CE012]
callouts:
  - calloutType: strength
    title: Technical wedge
    body: CockroachDB's strongest product case is the combination of PostgreSQL ergonomics with distributed, strongly consistent transactions and automatic placement or recovery capabilities.
    claimRefs: [CE001, CE002, CE008]
  - calloutType: risk
    title: Implementation and cost complexity
    body: Distributed performance tuning, unsupported PostgreSQL behavior, topology choices, and multi-region cost can move the product from a migration accelerator to a specialist-led infrastructure program.
    claimRefs: [CE009, CE013, CE014]
  - calloutType: assumption
    title: Roadmap separation
    body: Continuum capabilities should be underwritten by deployment-specific availability and customer evidence because the assigned release labels auto-scaling compute as coming soon.
    claimRefs: [CE006, CE012]
