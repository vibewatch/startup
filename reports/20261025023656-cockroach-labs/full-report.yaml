        - Track until a price and financial denominator permit a peer or revenue-multiple bridge
        - Financing terms, dilution, opaque economics
        - Medium; consistent with available evidence
      - - Bear
        - Growth slows or cloud economics deteriorate; private-market multiples reset
        - Down-round or materially lower clearing price remains plausible
        - Multiple compression, cost overruns, customer concentration
        - Medium; downside is not quantified
      - - Decision gate
        - Require current price, ARR/revenue, growth, retention, margin, burn, and preference terms
        - No commitment if the gate is not met
        - Incomplete diligence can mask permanent dilution or overpayment
        - High confidence in the process, not in an outcome
    notes: >-
      Scenarios are qualitative because no assigned source provides a current Cockroach Labs price, audited revenue, or
      reliable probability distribution; no precise valuation range is invented.
    claimRefs:
      - CV003
      - CV006
      - CV009
      - CV014
      - CV015
