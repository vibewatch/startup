            body: >-
              The founding team is reported as Spencer Kimball, Peter Mattis, and Benjamin Darnell, all former Google
              engineers. A September 2026 company release names Kimball as co-founder and CEO, while Tracxn lists Nathan
              Rodriguez as Co-CEO and Darnell as co-founder and Chief Architect. These records show founder continuity
              across executive and technical leadership, but they do not explain the practical division of authority
              implied by the CEO and Co-CEO titles. Nor do they establish current duties for co-founder Peter Mattis. No
              retained source provides the current board roster, voting rights, investor protective provisions,
              succession plan, or a complete executive roster, so governance and key-person dependence remain diligence
              items rather than settled facts.
