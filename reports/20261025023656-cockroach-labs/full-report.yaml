      - number: '3.3'
        title: Pricing, packaging, and distribution power
        blocks:
          - type: paragraph
            body: >-
              Public evidence does not establish Cockroach Labs' realized contract pricing, discounting, or gross
              margin, so the comparison must separate public list prices from economic proof. RFP Wiki reports
              CockroachDB Cloud tiers spanning request-unit and provisioned-vCPU models, while PostgreSQL has no license
              fee but shifts cost into infrastructure, DBA labor, and separately assembled high-availability tooling.
              Spanner, Aurora, and AlloyDB monetize managed operations and hyperscaler distribution; AlloyDB publishes
              starting compute, memory, storage, and network rates, but those figures are not directly comparable to an
              enterprise CockroachDB contract. The value case is strongest where avoided operational complexity and
              outage exposure justify higher multi-region baseline spend and migration cost.
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
      - number: '3.4'
        title: Moat durability and displacement risks
        blocks:
          - type: paragraph
            body: >-
              The moat is strongest in workloads that require multi-region writes, serializable consistency, locality
              controls, and failure survival without assembling a distributed-systems toolchain. The assigned
              comparisons are not independent benchmarks, but they do report recurring buyer concerns about multi-region
              cost and distributed-system tuning. PostgreSQL's adoption remains a material distribution advantage, with
              Stack Overflow reporting PostgreSQL as the most-used database in its 2024 survey. DataIntelo places
              Cockroach Labs alongside Google and AWS in the leading competitive set, underscoring that hyperscaler
              services can bundle managed operations, AI features, replicas, and migration tooling. Likely displacement
              therefore comes from narrower fit, price pressure, or buyers accepting active-passive recovery instead of
              paying for multi-active semantics.
            claimRefs:
              - CP012
              - CP013
              - CP014
              - CP015
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Durable wedge
            body: >-
              CockroachDB has a defensible wedge when globally distributed writes and strong consistency are
              simultaneous buying requirements, because the alternatives documented here generally require passive
              replicas, manual sharding, external coordination, or cloud concentration.
            calloutType: strength
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP015
          - type: callout
            title: Ecosystem and cloud-platform pressure
            body: >-
              PostgreSQL's broad developer adoption and hyperscaler distribution can make a narrower, simpler managed
              service the default choice unless CockroachDB proves lower total operational risk for the target workload.
            calloutType: risk
            claimRefs:
              - CP012
              - CP013
              - CP014
              - CP016
          - type: callout
            title: Competitive judgment
            body: >-
              Cockroach Labs should be underwritten as a focused platform for high-consequence, globally distributed
              transactional workloads rather than as a generic PostgreSQL replacement. The commercial case is strongest
              when multi-region writes, locality, and resilience are hard requirements; it is weaker when a buyer can
              accept single-region PostgreSQL, passive replicas, or a hyperscaler-managed service.
            calloutType: recommendation
            claimRefs:
              - CP001
              - CP005
              - CP009
              - CP013
              - CP015
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Monetization model and revenue quality
        blocks:
          - type: paragraph
            body: >-
              Cockroach Labs monetizes a distributed SQL database through managed cloud offerings and self-hosted
              enterprise software rather than through a single disclosed revenue stream. A 2026 company release says ARR
              growth was driven by enterprise customer growth and deeper adoption among existing customers, but it does
              not publish the ARR amount, growth rate, renewal rate, or mix. Historical independent coverage describes
              Dedicated as a managed cluster, Serverless as consumption-based, and Self-Hosted as a customer-managed
              deployment. That mix can support expansion from usage into enterprise contracts, but it also makes list
              pricing, recognized revenue, and gross margin difficult to infer without contracts and a current finance
              pack.
            claimRefs:
