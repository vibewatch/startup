      - number: '3.2'
        title: Capability, trust, and switching comparison
        blocks:
          - type: paragraph
            body: >-
              CockroachDB's core capability edge is architectural rather than a single feature: its official
              architecture documentation describes symmetric nodes, range replication, quorum writes, and Raft-based
              consensus, while the comparison material contrasts automatic distribution and geo-partitioning with
              PostgreSQL's manual sharding and routing burden. PostgreSQL counters with nearly four decades of
              development, broad extensions, standards conformance, and a large community. The buyer therefore trades
              operational control and ecosystem breadth for integrated multi-region behavior. Compatibility lowers
              migration friction, but it does not eliminate testing, operational retraining, or the risk that extensions
              and workload assumptions differ.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
