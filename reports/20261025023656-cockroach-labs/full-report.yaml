      - number: '1.3'
        title: Capital history and observable scale
        blocks:
          - type: paragraph
            body: >-
              The strongest financing anchor is the December 2021 Series F: Cockroach Labs announced $278 million of new
              funding at a $5 billion valuation and said the round brought lifetime funding to $633 million. Tracxn
              reports the same lifetime total across seven rounds, while Latka totals $579.6 million across only four
              rounds beginning in 2019; the different period and round denominator explains why the latter is not a
              substitute for lifetime funding. Scale evidence is weaker. Tracxn reports 706 employees in September 2026,
              versus Latka's 715 for November 2025. Latka labels $128.3 million as a December 2023 revenue estimate
              sourced to Growjo and explicitly says the company has not published revenue. The company's January 2026
              release says ARR grew year over year but supplies no amount, and the last retained quantified customer
              disclosure is more than 200 customers in December 2021. None of these figures establishes current ARR,
              audited revenue, cash, profitability, or runway.
            claimRefs:
