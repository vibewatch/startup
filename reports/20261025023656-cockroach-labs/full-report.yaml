  - id: FP001
    title: Competitive positioning by distribution and operational integration
    type: quadrant
    summary: Ordinal positioning based on documented deployment and operating capabilities, not a measured market ranking.
    data:
      points:
        - label: CockroachDB
          x: 9
          'y': 9
          detail: >-
            Multi-region active writes, serializable consistency, automatic rebalancing, and integrated repair are
            documented in assigned sources.
        - label: PostgreSQL
          x: 3
          'y': 5
          detail: >-
            Broad ecosystem and strong relational capabilities; distributed scale and failover usually require
            additional tooling.
        - label: Amazon Aurora Global Database
          x: 6
          'y': 7
          detail: >-
            Managed global database with local reads and regional promotion, but active-active writes are not documented
            in the assigned source.
        - label: Google AlloyDB
          x: 6
          'y': 8
          detail: >-
            Managed PostgreSQL compatibility, read pools, cross-region replicas, and automated operations are
            documented.
        - label: Vitess
          x: 7
          'y': 6
          detail: >-
            Transparent sharding and resharding are documented, but the source is MySQL-oriented and does not establish
            CockroachDB-equivalent transaction semantics.
        - label: Single-region managed PostgreSQL
          x: 4
          'y': 6
          detail: >-
            High operational simplicity for local workloads, with no assigned evidence of native multi-region
            active-active behavior.
      xAxis:
        label: Distributed / multi-region capability
        min: 0
        max: 10
      yAxis:
        label: Operational integration
        min: 0
        max: 10
    approximationNotes: >-
      Scores are analyst ordinal mappings from the cited capability evidence; they are not vendor benchmarks, market
      shares, or measured total-cost scores.
