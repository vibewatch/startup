        title: Cost structure and capital adequacy
        blocks:
          - type: paragraph
            body: >-
              The product architecture implies a meaningful service-delivery cost base: distributed replication,
              multi-region operation, support, migration, and cross-region data transfer all sit alongside ordinary
              cloud infrastructure costs. An independent cost review specifically identifies migration, professional
              services, and cross-region transfer as costs beyond a license fee. Historical funding coverage reports
              $633 million of cumulative funding and a $5 billion valuation in the 2021 Series F, while current
              third-party profile data reports $579.6 million across four rounds and labels revenue and headcount
