chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              Cockroach Labs was founded in 2015, is headquartered in New York City, and remains described in the
              retained company directory as a Series F company. Its core product, CockroachDB, is an operational
              database built on a transactional, strongly consistent key-value store and exposed through a familiar SQL
              interface. The commercial proposition is resilient, horizontally scalable transaction processing with
              PostgreSQL compatibility, offered across managed and self-hosted deployment patterns. In September 2026
              the company extended that proposition with Cockroach Continuum, an agentic database-cloud layer intended
              to pool capacity and coordinate operations across a database estate. PostgreSQL's position as the
              most-used database in Stack Overflow's 2024 developer survey supports the familiarity of the interface,
              but does not establish CockroachDB adoption. The product statements remain company-issued positioning, not
              independently measured performance or customer economics.
            claimRefs:
              - CO001
              - CO002
              - CO006
              - CO015
