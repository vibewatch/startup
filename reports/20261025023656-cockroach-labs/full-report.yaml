  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              Cockroach Labs competes in the distributed SQL portion of the broader cloud database market: relational
              systems that preserve SQL and transactional consistency while distributing storage, compute, and replicas
              across nodes or regions. The relevant spend includes database software or managed-service consumption,
              support, implementation, migration, and operating infrastructure for mission-critical transactional
              workloads. It excludes general analytics warehouses, standalone vector databases, and ordinary
              single-region relational deployments unless they are being evaluated as substitutes. The practical status
              quo remains PostgreSQL or another incumbent relational database, often extended with replicas, sharding,
              failover tooling, and application-layer routing. That boundary matters because broad cloud-database
              forecasts overstate Cockroach Labs' immediately addressable opportunity, while distributed-SQL estimates
              include hyperscaler products and larger vendors that compete for the same modernization budget.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: Sizing through multiple lenses
        blocks:
          - type: paragraph
            body: >-
              Public estimates point to a large but definition-sensitive opportunity. DataIntelo estimates the global
              distributed SQL database market at $7.2 billion in 2025 and $24.8 billion in 2034, while Coherent Market
              Insights estimates the broader cloud database market at $26.00 billion in 2026 and $73.03 billion in 2033.
              Business Research Insights gives a narrower distributed-database estimate of $7.74 billion by 2033 at a
              10.5% CAGR. These values should not be added or treated as interchangeable: they use different product
              boundaries, base years, geographies, and forecast methods. The evidence therefore supports a
              distributed-SQL beachhead inside a larger cloud-database spend pool, but it does not support a
              company-specific SAM or SOM. Cockroach Labs' market capture depends on converting workloads where global
              consistency, availability, data locality, and operational simplicity justify migration cost.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM006
              - CM009
      - number: '2.3'
        title: Buyers, adoption drivers, and constraints
        blocks:
          - type: paragraph
            body: >-
              The primary economic buyer is usually an enterprise platform, database, or application-infrastructure
              owner with a mandate to reduce outage exposure and support growth across regions. Developers and
              application teams are users; security, compliance, and data-governance teams influence the purchase where
              residency or regulated workloads matter; finance and procurement own the recurring cloud or enterprise
              commitment. Adoption is triggered by a new globally distributed application, a legacy single-primary
              bottleneck, a cloud or hybrid-cloud migration, an AI workload, or a regulatory requirement for locality
              and resilience. The counterweight is switching cost: schema and feature compatibility testing, topology
              redesign, workload modeling, replication and egress charges, and the need for distributed-database
              expertise. Customer examples show that migration can be staged, but public evidence does not establish a
              universal payback period or buyer-level willingness to pay.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.4'
        title: Market diligence implications
        blocks:
          - type: paragraph
            body: >-
              The market case is strongest when the workload cannot be served economically by a simpler single-region
              relational database and when downtime, inconsistency, or data-residency failures have material business
              cost. Cockroach Labs can use PostgreSQL compatibility, managed deployment, multi-region operation, and
              partner distribution to lower adoption friction, but these advantages do not remove the need to prove
              total cost of ownership. Independent market pages forecast double-digit growth, yet they do not disclose
              Cockroach Labs' obtainable share, win rate, retention by segment, or the share of database budgets that
              can move from incumbent platforms. The next diligence step is a workload-level model comparing compute,
              replication, egress, migration labor, support, and avoided outage cost, segmented by regulated enterprise,
              high-scale digital product, and ordinary transactional application.
            claimRefs:
              - CM015
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              The relevant competitive set is broader than other distributed-SQL vendors. PostgreSQL is the default
              status quo and internal-build substrate, while Amazon Aurora Global Database and Google AlloyDB offer
              managed PostgreSQL-compatible paths inside hyperscaler estates. Vitess adds application-transparent
              sharding and near-zero-downtime resharding for MySQL workloads. CockroachDB competes most directly when a
              buyer needs one logical relational system across regions, writes in multiple locations, and strong
              transactional semantics. That positioning is attractive for payments, retail, gaming, and other always-on
              workloads, but it is not a universal replacement for a single-region PostgreSQL deployment or a read-heavy
              managed service.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
