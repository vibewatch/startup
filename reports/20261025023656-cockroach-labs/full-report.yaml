        title: Milestones and diligence implications
        blocks:
          - type: paragraph
            body: >-
              The public chronology shows a decade-long progression from founding and venture financing into enterprise
              product expansion: four disclosed rounds from 2019 through 2021, a licensing change in 2024,
              company-reported commercial momentum entering 2026, and the Continuum launch in September 2026. The
              chronology also exposes the principal underwriting limitation. The capital valuation is almost five years
              old at the run date, while the current operating picture relies on company assertions and third-party
              directory estimates. The 2024 licensing change reportedly prompted open-source community resistance,
              adding a concrete adoption and ecosystem risk. Investment diligence should therefore prioritize current
              financial statements, cohort metrics, capitalization and control documents, and customer evidence before
              treating product momentum as enterprise-value support.
