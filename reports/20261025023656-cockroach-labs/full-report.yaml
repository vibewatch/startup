  - id: FU001
    title: Customer journey from workload pain to expansion
    type: journey-map
    summary: >-
      Public evidence traces a path from distributed-workload pain through migration and production use, while retention
      and expansion metrics remain unobserved.
    data:
      items:
        - id: workload-pressure
          label: Workload pressure
          title: Workload pressure
          description: >-
            Global traffic, high availability, data locality, or consistency requirements expose limits in legacy
            single-primary setups.
          touchpoints:
            - 'Mux: multi-cloud and multi-region needs'
            - 'Stake: traffic surge and global trading'
        - id: evaluation
          label: Evaluation
          title: Evaluation
          description: >-
            Platform teams compare PostgreSQL compatibility, distributed resilience, regional placement, and
            implementation effort.
          touchpoints:
            - PostgreSQL-compatible migration path
            - Review evidence flags cost and learning curve
        - id: migration
          label: Migration
          title: Migration
          description: >-
            Customers move a defined workload, with the Stake reference describing about a 5% rewrite and about four
            hours.
          touchpoints:
            - Stake production move
            - DoorDash staged migration
        - id: production
          label: Production use
          title: Production use
          description: Named deployments support streaming, trading, authentication, ledgers, and transactional storage.
          touchpoints:
            - Mux Video backbone
            - Stake authentication and financial ledger
            - DoorDash transactional services
        - id: expansion
          label: Expansion
          title: Expansion
          description: >-
            The company describes deeper adoption among existing customers, but no public retention or expansion
            denominator is provided.
          touchpoints:
            - Company-reported deeper adoption
            - Additional services or regions
        - id: diligence
          label: Durability diligence
          title: Durability diligence
          description: >-
            Verify renewal, NRR, GRR, churn, customer concentration, and account-level economics before underwriting
            durable expansion.
          touchpoints:
            - Retention metrics not disclosed
            - Top-customer revenue share not disclosed
    approximationNotes: This is an evidence-based sequence, not a measured funnel; no conversion rates or stage populations are available.
    claimRefs:
      - CU002
      - CU006
      - CU007
      - CU012
      - CU014
