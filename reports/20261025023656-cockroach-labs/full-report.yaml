    title: Recommendation logic
    type: flow
    summary: >-
      Product differentiation and adoption are positive signals, but missing price and financial denominators constrain
      the investment call.
    data:
      nodes:
        - id: scale-proof
          label: Distributed SQL differentiation
          detail: PostgreSQL compatibility, horizontal scale, resilience
        - id: adoption-proof
          label: Enterprise adoption signals
          detail: Company-reported enterprise growth and deeper adoption
        - id: economics-gap
          label: Economics gap
          detail: ARR dollars, retention, margins, burn, and cash are not disclosed
        - id: price-gap
