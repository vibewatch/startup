  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product and customer workflow
        blocks:
          - type: paragraph
            body: >-
              CockroachDB is positioned as a cloud-native distributed SQL database for modern, data-intensive
              applications. In customer workflow terms, an application connects through PostgreSQL-compatible drivers
              and tools, writes transactional data to a logical cluster, and can place or replicate data across regions
              while retaining a SQL interface. The product therefore targets systems of record where correctness,
              availability, and geographic distribution matter more than a single-node database's simplest operating
              model. The official FAQ describes transactional and strongly consistent storage, horizontal scale,
              automatic replication and recovery, while the Red Hat partner brief describes rolling node updates and a
              single logical database across regions. These are product capabilities, not proof that every workload
              migrates without code or topology changes.
            claimRefs:
              - CE001
              - CE002
              - CE003
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE004
              - CE005
              - CE006
      - number: '5.2'
        title: Product lines and maturity
        blocks:
          - type: paragraph
            body: >-
              The current product surface has a core database engine, managed cloud deployment options, self-hosted or
              customer-cloud deployment, and newer estate-level capabilities. The core engine and PostgreSQL-compatible
              access are documented capabilities; managed Basic, Standard, and Advanced plans are described in the
              assigned comparison material; and Cockroach Continuum is presented in a 2026 company release as a new
              database-estate operating model. The distinction matters: a stable database primitive is not equivalent to
              a generally available AI operations layer or autoscaling roadmap item. The Continuum release explicitly
              labels auto-scaling compute “Coming soon,” so product maturity should be evaluated by SKU, deployment
              mode, and availability status rather than by the broad platform narrative.
            claimRefs:
              - CE004
              - CE005
              - CE006
              - CE007
          - type: table
            tableRef: TE002
            claimRefs:
              - CE002
              - CE008
              - CE009
              - CE012
      - number: '5.3'
        title: Architecture and operating model
        blocks:
          - type: paragraph
            body: >-
              The architecture combines a transactional key-value substrate with SQL, distributed consensus,
              replication, and online rebalancing. Official documentation says the system scales horizontally, survives
              failures with minimal latency disruption and no manual intervention, and supports strongly consistent ACID
              transactions. The PostgreSQL-compatibility documentation narrows that promise: most PostgreSQL syntax,
              drivers, and ORMs are supported, but some features behave differently because they are difficult to
              implement in a distributed system. The assigned comparison material describes automatic range splitting,
              merging, rebalancing, geo-partitioning, and changefeeds; these features create a powerful operating model
              but also a larger configuration and cost surface than a single-node deployment. Architecture is therefore
              a differentiation and an implementation dependency at the same time.
            claimRefs:
              - CE008
              - CE009
              - CE010
              - CE011
          - type: table
            tableRef: TE003
            claimRefs:
              - CE008
              - CE009
              - CE010
              - CE011
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE008
              - CE009
              - CE010
              - CE012
      - number: '5.4'
        title: Differentiation, trust, and technical risks
        blocks:
          - type: paragraph
            body: >-
              Cockroach Labs differentiates on distributed transactional correctness, survivability, data locality, and
              PostgreSQL ergonomics. The 2026 release reports CockroachDB 25.2 throughput improvements of up to 50
              percent, leader leases, buffered writes, WAL failover, and PostgreSQL-compatible vector indexing through
              C-SPANN; these are company-issued product claims and should not be treated as independent benchmark
              results. Independent comparison text reports positive feedback on resilience and compatibility, but also a
              learning curve for distributed performance tuning, specialist help for complex designs, and gaps in
              analytics, documentation, or administrative workflows. The status history is only an incident-history
              surface, not evidence that incidents did or did not occur. Key diligence items are production-specific
              reliability data, security and compliance attestations by deployment, migration exceptions, realized
              multi-region cost, and whether newer AI-oriented capabilities are generally available.
            claimRefs:
              - CE012
              - CE013
              - CE014
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Technical wedge
            body: >-
              CockroachDB's strongest product case is the combination of PostgreSQL ergonomics with distributed,
              strongly consistent transactions and automatic placement or recovery capabilities.
            calloutType: strength
            claimRefs:
              - CE001
              - CE002
              - CE008
          - type: callout
            title: Implementation and cost complexity
            body: >-
              Distributed performance tuning, unsupported PostgreSQL behavior, topology choices, and multi-region cost
              can move the product from a migration accelerator to a specialist-led infrastructure program.
            calloutType: risk
            claimRefs:
              - CE009
              - CE013
              - CE014
          - type: callout
            title: Roadmap separation
            body: >-
              Continuum capabilities should be underwritten by deployment-specific availability and customer evidence
              because the assigned release labels auto-scaling compute as coming soon.
            calloutType: assumption
            claimRefs:
              - CE006
              - CE012
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and buying jobs
        blocks:
          - type: paragraph
            body: >-
              CockroachDB is positioned for organizations whose customer-facing or internal systems need transactional
              consistency across regions, cloud portability, and resilience. The official modernization page describes
              buyers moving from monoliths to microservices, from VMs to Kubernetes, and toward continuous delivery,
              while also highlighting regulated data-locality requirements and hybrid or multicloud adoption. The
              resulting buyer is typically a platform, infrastructure, or application engineering team; the end user is
              the business application or service relying on always-on transactions. Apps Run The World identifies
              DoorDash, Shipt, and Salto Systems as users in its public customer database, spanning delivery, logistics,
              and identity/access-management contexts. These examples support vertical breadth, but the database is an
              aggregation and does not establish current contract status, spend, or retention.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU006
              - CU009
      - number: '6.2'
        title: Adoption proof and trajectory
        blocks:
          - type: paragraph
            body: >-
              The strongest public adoption evidence is deployment-specific rather than a disclosed customer-count
              series. The Mux case describes CockroachDB as the backbone for Mux Video after a move from PostgreSQL,
              with multi-region support, geo-partitioning, and traffic routing used for performance, data residency, and
              downtime-risk objectives. The Stake case is more operationally specific: the customer reportedly moved
              production in about four hours with about a 5% rewrite and uses the database for authentication and a
              financial ledger across three regions. Cockroach Labs' January 2026 company release says growth came from
              enterprise customer growth and deeper adoption among existing customers, but it gives no denominator,
              retention rate, bookings, or customer count. These signals indicate real production adoption and expansion
              narratives, not a measurable cohort curve.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU002
              - CU006
              - CU007
              - CU012
              - CU014
      - number: '6.3'
        title: Named customer proof and durability
        blocks:
          - type: paragraph
            body: >-
              Named references are strongest when they identify a production workload and an operational outcome. Mux is
              described as serving video streaming and analytics, while Stake is described as running authentication and
              a financial ledger; both are more probative than an unqualified logo. Apps Run The World adds a public
              customer-list view with DoorDash, Shipt, and Salto Systems, and gives a detailed DoorDash migration
              narrative involving distributed replication, staged cutovers, and high-throughput transactional services.
              Independent review aggregation is directionally positive on horizontal scalability, strong consistency,
              and managed-service reliability, but also flags learning curves, cost sensitivity, and the need for
              specialist help in complex designs. No assigned source supplies Cockroach Labs' GRR, NRR, churn, renewal
              rate, contract length, or cohort retention, so durability remains an evidence gap.
            claimRefs:
              - CU009
              - CU011
              - CU012
          - type: table
            tableRef: TU003
            claimRefs:
              - CU005
              - CU006
              - CU009
              - CU011
      - number: '6.4'
        title: Expansion, procurement friction, and concentration
        blocks:
          - type: paragraph
            body: >-
              The public evidence supports a plausible land-and-expand motion because the company says existing
              customers adopted more deeply. However, that is a company-issued description rather than independently
              audited expansion data. Third-party review text describes pricing and cluster sizing as non-trivial, with
              cost sensitivity for multi-region deployments and specialist support sometimes needed for complex
              distributed or hybrid designs. That friction can lengthen procurement and implementation, even when the
              technical use case is strong. The assigned sources do not disclose the top-customer revenue share,
              partner-sourced revenue, average contract value, implementation conversion, or the number of active
              production accounts. Concentration and expansion should therefore be treated as unresolved diligence items
              rather than inferred from named logos or positive adoption claims.
            claimRefs:
              - CU007
              - CU014
              - CU015
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Production references are specific
            body: >-
              Mux and Stake references identify production workloads, migration context, and operational outcomes rather
              than only displaying logos.
            calloutType: strength
            claimRefs:
              - CU005
              - CU006
              - CU009
          - type: callout
            title: Durability and concentration are unreported
            body: >-
              Public assigned evidence does not provide NRR, GRR, churn, renewal, customer count, or top-account revenue
              share.
            calloutType: risk
            claimRefs:
              - CU012
              - CU015
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk posture and thesis-break conditions
        blocks:
          - type: paragraph
            body: >-
              Cockroach Labs is positioned around workloads where availability, consistency, geographic locality, and
              regulatory controls matter, but the same positioning creates a demanding operating burden. Its own
              materials describe multi-region resilience, compliance controls, and continuous product expansion; those
              are product claims, not independent proof of realized service performance. A January 2026 company release
              reports throughput improvements and enterprise adoption, while independent profiles rely partly on
              estimates and historical data. The investment risk is therefore asymmetric: a few large reliability,
              migration, or pricing failures could damage trust faster than broad market growth can repair it. The
              thesis breaks if production incidents materially impair customer workloads, if migrations require
              materially more services than buyers will fund, or if current cash, retention, and concentration data fail
              diligence.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR003
              - CR008
              - CR011
              - CR013
              - CR016
      - number: '7.2'
        title: Regulatory, legal, and data-governance exposure
        blocks:
          - type: paragraph
            body: >-
              The public record reviewed here does not establish a current enforcement action, material lawsuit, license
              dispute, or privacy incident involving Cockroach Labs. That absence is not evidence that no such matter
              exists. The product is marketed for regulated and geographically distributed workloads, and the company
              lists GDPR, PDPA, CCPA, and DORA as relevant regulatory drivers. Geographic placement and compliance
              features can reduce customer exposure, but they also make configuration, data-residency controls, access
              governance, and evidence of certification commercially important. PostgreSQL remains a widely adopted
              open-source alternative with its own security and replication model, so Cockroach Labs must prove that its
              source-available licensing, controls, and support commitments satisfy each customer's jurisdiction and
              procurement standard. Legal diligence should test certifications, DPAs, subprocessors, BSL obligations,
              open-source notices, export controls, and unresolved claims rather than infer clearance from marketing
              pages.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
      - number: '7.3'
        title: Operational, quality, and security risk
        blocks:
          - type: paragraph
            body: >-
              CockroachDB's architecture is intended to survive node, disk, rack, and region failures, and the company
              says it introduced a benchmark that evaluates partitions, disk stalls, restarts, and zonal outages. These
              are useful test dimensions, but the cited comparison is company-issued and does not establish production
              incident frequency, customer-impact duration, or independently reproducible results. Distributed
              consensus, online schema changes, multi-cloud networking, vector search, and migration tooling expand the
              surface area that must be operated correctly. CostBench identifies migration, professional services, and
              cross-region transfer as costs beyond licensing; that supports a practical implementation-risk hypothesis,
              not a complete cost model. Diligence should obtain incident history, SLO attainment, support escalations,
              rollback evidence, security attestations, penetration-test summaries, and customer references for the
              largest deployments.
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
      - number: '7.4'
        title: Partner, dependency, and financial-model risk
        blocks:
          - type: paragraph
            body: >-
              Route-to-market and platform dependencies are material because Cockroach Labs sells into an ecosystem
              dominated by AWS, Google Cloud, Microsoft Azure, PostgreSQL, and large database vendors. The company
              reports an IBM OEM relationship and marketplace or hybrid-cloud reach, but partner announcements do not
              quantify sourced pipeline, renewal economics, or dependency concentration. Independent public profiles
              estimate revenue and report historical funding and headcount, while explicitly noting that the company has
              not published revenue; those figures cannot establish ARR quality, cash runway, burn, gross margin, or
              customer concentration. Pricing sensitivity is also plausible: the product's value depends on reducing
              downtime and operational burden, yet cross-region transfer, migration, support, and implementation costs
              can change total cost of ownership. The decisive diligence asks are current cash and burn, renewal and
              expansion by cohort, top-account exposure, cloud and partner terms, and downside financing capacity.
            claimRefs:
              - CR002
              - CR006
              - CR007
              - CR010
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
          - type: table
            tableRef: TR001
            claimRefs:
              - CR002
              - CR006
              - CR007
              - CR010
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Highest-conviction risk
            body: >-
              The largest unresolved risk is not a proven incident but the gap between a resilience-led product promise
              and independently verified production, financial, and customer-retention evidence.
            calloutType: risk
            claimRefs:
              - CR001
              - CR003
              - CR011
              - CR016
          - type: callout
            title: Diligence boundary
            body: >-
              Public evidence does not support a precise probability of litigation, outage, breach, or insolvency; those
              items remain diligence questions rather than quantified loss forecasts.
            calloutType: assumption
            claimRefs:
              - CR004
              - CR008
              - CR012
              - CR015
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              Cockroach Labs has a credible infrastructure thesis: CockroachDB combines PostgreSQL compatibility, ACID
              transactions, horizontal scale, multi-region resilience, and managed or self-managed deployment options.
              Its 2026 company release says ARR grew year over year, enterprise customers expanded, and existing
              customers adopted more deeply, while the product pages emphasize uptime, data locality, security controls,
              and deployment across AWS, Google Cloud, and Azure. These are relevant value drivers for mission-critical
              workloads because migration costs and reliability requirements can make a successful deployment sticky.
              The product thesis is therefore stronger than a generic database software pitch, but the cited growth
              statements are company-issued and do not disclose ARR dollars, retention, gross margin, or profitability.

              The anti-thesis is valuation opacity and competition. An independent IPO overview reports that the company
              remains private, has no public S-1, ticker, or price range, and was last reported at roughly $5 billion in
              a 2021 financing; a separate company-data page reports a $5 billion Series F valuation and a $128.3
              million 2023 revenue estimate, while explicitly saying the company has not published its revenue. Those
              figures are not a current audited basis for entry. Independent comparison material also flags cost
              sensitivity, complexity, and the need for workload-specific total-cost modeling. Without a current price
              and financial denominator, a buy recommendation would imply precision the evidence cannot support.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV006
              - CV009
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV011
              - CV012
              - CV013
      - number: '8.2'
        title: Financing context, entry discipline, and comparable signals
        blocks:
          - type: paragraph
            body: >-
              The financing record is useful as a historical reference, not a mark-to-market valuation. GetLatka reports
              $579.6 million raised across four rounds, including a $278 million Series F in December 2021 at a $5
              billion valuation, and labels the revenue figure an estimate. The independent IPO overview instead reports
              approximately $630 million or more of total funding and describes the $5 billion figure as a 2021 private
              mark. The difference is a provenance and scope discrepancy, so the chapter retains both as reported rather
              than selecting a false single total. No assigned source establishes current preference stacks, liquidation
              preferences, secondary clearing prices, debt, cash, or dilution.

              Public comparables can frame diligence but cannot substitute for Cockroach Labs financials. A market-cap
              source places MongoDB at $29.89 billion on October 24, 2026, after a 15.73% decline in its reported 2026
              market cap, while the IPO overview identifies MongoDB as the closest modern database comparable and names
              Oracle, Snowflake, Amazon, Microsoft, and Google Spanner as broader peers. Those market caps are not
              revenue multiples for Cockroach Labs. Entry discipline should therefore require a current financing or
              secondary price, audited or diligence-grade revenue and ARR, growth, gross margin, retention, cash burn,
              and the terms that determine investor downside.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
      - number: '8.3'
        title: Scenarios, recommendation, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The scenario range is deliberately evidence-limited. The bull case requires CockroachDB Cloud and the
              newly introduced Cockroach Continuum model to convert technical differentiation into durable, expanding,
              high-margin recurring revenue. The company says Continuum pools capacity, prices work rather than peak
              capacity, and adds database virtualization, elastic storage, agent-assisted operations, and consumption
              billing; these are product assertions, not proof of unit economics. The base case is continued adoption
              with meaningful infrastructure and migration costs, but unclear profitability and a valuation that must be
              underwritten from new private-market evidence. The bear case is multiple compression or a down-round if
              cloud costs, multi-region replication, migration complexity, incumbent bundling, or weak conversion from
              adoption to paid expansion outweigh the product moat.

              The recommendation is track, with research-more confidence, high risk, and an unknown valuation stance.
              The stance is not a judgment that the product lacks value; it is a judgment that the public record does
              not support calling the current entry price attractive, fair, stretched, or expensive. A thesis break
              would be evidence of materially slowing ARR growth, weak net retention, margin dilution from
              managed-service costs, a price below the prior private mark without compensating operating improvement, or
              customer losses caused by cost and complexity. A positive re-rating would require a current price,
              reliable financial statements, retention and margin evidence, and terms showing acceptable dilution and
              downside protection.
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV006
              - CV009
              - CV014
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV009
              - CV014
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Decision
            body: >-
              Track and request a refreshed underwriting package; do not treat the historical $5 billion private mark as
              a current valuation.
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV006
              - CV009
              - CV015
          - type: callout
            title: Primary valuation risk
            body: >-
              The largest risk is not merely competitive pressure; it is paying for an unverified growth and margin
              profile without current price, cap-table, or preference evidence.
            calloutType: risk
            claimRefs:
              - CV005
              - CV009
              - CV014
          - type: callout
            title: Required diligence
            body: >-
              Obtain current ARR and revenue, growth, retention, gross margin, cash and burn, customer concentration,
              financing terms, and a comparable-company valuation bridge before setting an entry price.
            calloutType: assumption
            claimRefs:
              - CV009
              - CV014
              - CV015
