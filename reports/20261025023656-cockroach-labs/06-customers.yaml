company:
  name: Cockroach Labs
chapter:
  number: 6
  title: Customers
  summary: CockroachDB has credible named production-use evidence in globally distributed and regulated workflows, including Mux and Stake, while third-party evidence identifies additional large-company deployments. The public record does not disclose customer count, retention, or revenue concentration, so adoption breadth is more supportable than durability or account economics.
sections:
  - id: customer-segmentation
    title: Customer segments and buying jobs
    body: >-
      CockroachDB is positioned for organizations whose customer-facing or internal systems need transactional consistency across regions, cloud portability, and resilience. The official modernization page describes buyers moving from monoliths to microservices, from VMs to Kubernetes, and toward continuous delivery, while also highlighting regulated data-locality requirements and hybrid or multicloud adoption. The resulting buyer is typically a platform, infrastructure, or application engineering team; the end user is the business application or service relying on always-on transactions. Apps Run The World identifies DoorDash, Shipt, and Salto Systems as users in its public customer database, spanning delivery, logistics, and identity/access-management contexts. These examples support vertical breadth, but the database is an aggregation and does not establish current contract status, spend, or retention.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: adoption-trajectory
    title: Adoption proof and trajectory
    body: >-
      The strongest public adoption evidence is deployment-specific rather than a disclosed customer-count series. The Mux case describes CockroachDB as the backbone for Mux Video after a move from PostgreSQL, with multi-region support, geo-partitioning, and traffic routing used for performance, data residency, and downtime-risk objectives. The Stake case is more operationally specific: the customer reportedly moved production in about four hours with about a 5% rewrite and uses the database for authentication and a financial ledger across three regions. Cockroach Labs' January 2026 company release says growth came from enterprise customer growth and deeper adoption among existing customers, but it gives no denominator, retention rate, bookings, or customer count. These signals indicate real production adoption and expansion narratives, not a measurable cohort curve.
    claimRefs: [CU005, CU006, CU007, CU008]
    tableRefs: [TU002]
    figureRefs: [FU001]
  - id: named-proof-and-durability
    title: Named customer proof and durability
    body: >-
      Named references are strongest when they identify a production workload and an operational outcome. Mux is described as serving video streaming and analytics, while Stake is described as running authentication and a financial ledger; both are more probative than an unqualified logo. Apps Run The World adds a public customer-list view with DoorDash, Shipt, and Salto Systems, and gives a detailed DoorDash migration narrative involving distributed replication, staged cutovers, and high-throughput transactional services. Independent review aggregation is directionally positive on horizontal scalability, strong consistency, and managed-service reliability, but also flags learning curves, cost sensitivity, and the need for specialist help in complex designs. No assigned source supplies Cockroach Labs' GRR, NRR, churn, renewal rate, contract length, or cohort retention, so durability remains an evidence gap.
    claimRefs: [CU009, CU011, CU012]
    tableRefs: [TU003]
  - id: expansion-and-concentration
    title: Expansion, procurement friction, and concentration
    body: >-
      The public evidence supports a plausible land-and-expand motion because the company says existing customers adopted more deeply. However, that is a company-issued description rather than independently audited expansion data. Third-party review text describes pricing and cluster sizing as non-trivial, with cost sensitivity for multi-region deployments and specialist support sometimes needed for complex distributed or hybrid designs. That friction can lengthen procurement and implementation, even when the technical use case is strong. The assigned sources do not disclose the top-customer revenue share, partner-sourced revenue, average contract value, implementation conversion, or the number of active production accounts. Concentration and expansion should therefore be treated as unresolved diligence items rather than inferred from named logos or positive adoption claims.
    claimRefs: [CU007, CU014, CU015, CU016]
    tableRefs: []
callouts:
  - calloutType: strength
    title: Production references are specific
    body: Mux and Stake references identify production workloads, migration context, and operational outcomes rather than only displaying logos.
    claimRefs: [CU005, CU006, CU009]
  - calloutType: risk
    title: Durability and concentration are unreported
    body: Public assigned evidence does not provide NRR, GRR, churn, renewal, customer count, or top-account revenue share.
    claimRefs: [CU012, CU015, CU016]
