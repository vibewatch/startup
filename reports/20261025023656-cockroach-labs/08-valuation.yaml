schemaVersion: "report-v2"
artifact: valuation
slug: cockroach-labs
runDate: 2026-10-25
company:
  name: Cockroach Labs
chapter:
  number: 8
  title: Valuation
  summary: Public evidence supports a differentiated distributed-database product and continuing enterprise adoption, but it does not establish a current private valuation, audited revenue, margins, or cash position. The appropriate stance is track/research-more rather than a price-insensitive buy call.
sections:
  - id: investment-thesis
    title: Investment thesis and anti-thesis
    body: >-
      Cockroach Labs has a credible infrastructure thesis: CockroachDB combines PostgreSQL compatibility,
      ACID transactions, horizontal scale, multi-region resilience, and managed or self-managed deployment
      options. Its 2026 company release says ARR grew year over year, enterprise customers expanded, and
      existing customers adopted more deeply, while the product pages emphasize uptime, data locality,
      security controls, and deployment across AWS, Google Cloud, and Azure. These are relevant value
      drivers for mission-critical workloads because migration costs and reliability requirements can make
      a successful deployment sticky. The product thesis is therefore stronger than a generic database
      software pitch, but the cited growth statements are company-issued and do not disclose ARR dollars,
      retention, gross margin, or profitability.

      The anti-thesis is valuation opacity and competition. An independent IPO overview reports that the
      company remains private, has no public S-1, ticker, or price range, and was last reported at roughly
      $5 billion in a 2021 financing; a separate company-data page reports a $5 billion Series F valuation
      and a $128.3 million 2023 revenue estimate, while explicitly saying the company has not published
      its revenue. Those figures are not a current audited basis for entry. Independent comparison
      material also flags cost sensitivity, complexity, and the need for workload-specific total-cost
      modeling. Without a current price and financial denominator, a buy recommendation would imply
      precision the evidence cannot support.
    claimRefs: [CV001, CV002, CV003, CV004, CV005]
    tableRefs: [TV001, TV002]
  - id: financing-and-comparables
    title: Financing context, entry discipline, and comparable signals
    body: >-
      The financing record is useful as a historical reference, not a mark-to-market valuation. GetLatka
      reports $579.6 million raised across four rounds, including a $278 million Series F in December
      2021 at a $5 billion valuation, and labels the revenue figure an estimate. The independent IPO
      overview instead reports approximately $630 million or more of total funding and describes the
      $5 billion figure as a 2021 private mark. The difference is a provenance and scope discrepancy,
      so the chapter retains both as reported rather than selecting a false single total. No assigned
      source establishes current preference stacks, liquidation preferences, secondary clearing prices,
      debt, cash, or dilution.

      Public comparables can frame diligence but cannot substitute for Cockroach Labs financials. A
      market-cap source places MongoDB at $29.89 billion on October 24, 2026, after a 15.73% decline
      in its reported 2026 market cap, while the IPO overview identifies MongoDB as the closest modern
      database comparable and names Oracle, Snowflake, Amazon, Microsoft, and Google Spanner as broader
      peers. Those market caps are not revenue multiples for Cockroach Labs. Entry discipline should
      therefore require a current financing or secondary price, audited or diligence-grade revenue and
      ARR, growth, gross margin, retention, cash burn, and the terms that determine investor downside.
    claimRefs: [CV006, CV007, CV008, CV009, CV010]
    tableRefs: []
  - id: scenarios-and-diligence
    title: Scenarios, recommendation, and thesis-break triggers
    body: >-
      The scenario range is deliberately evidence-limited. The bull case requires CockroachDB Cloud and
      the newly introduced Cockroach Continuum model to convert technical differentiation into durable,
      expanding, high-margin recurring revenue. The company says Continuum pools capacity, prices work
      rather than peak capacity, and adds database virtualization, elastic storage, agent-assisted
      operations, and consumption billing; these are product assertions, not proof of unit economics.
      The base case is continued adoption with meaningful infrastructure and migration costs, but unclear
      profitability and a valuation that must be underwritten from new private-market evidence. The bear
      case is multiple compression or a down-round if cloud costs, multi-region replication, migration
      complexity, incumbent bundling, or weak conversion from adoption to paid expansion outweigh the
      product moat.

      The recommendation is track, with research-more confidence, high risk, and an unknown valuation
      stance. The stance is not a judgment that the product lacks value; it is a judgment that the public
      record does not support calling the current entry price attractive, fair, stretched, or expensive.
      A thesis break would be evidence of materially slowing ARR growth, weak net retention, margin
      dilution from managed-service costs, a price below the prior private mark without compensating
      operating improvement, or customer losses caused by cost and complexity. A positive re-rating would
      require a current price, reliable financial statements, retention and margin evidence, and terms
      showing acceptable dilution and downside protection.
    claimRefs: [CV011, CV012, CV013, CV014, CV015]
    tableRefs: [TV003]
    figureRefs: [FV001]
tables:
  - id: TV001
    title: Recommendation summary
    columns: [Decision dimension, Evidence, Current implication, What would change the view]
    rows:
      - [Recommendation, "Private company; no S-1, ticker, or price range reported", "Track rather than buy", "A priced transaction with current financial disclosure"]
      - [Confidence, "Product and adoption evidence is available, but core financial denominators are not", "Research-more confidence", "Audited or diligence-grade ARR, growth, margin, and retention"]
      - [Risk rating, "Competition, cost sensitivity, deployment complexity, and financing opacity", "High", "Evidence of durable expansion and controlled cloud economics"]
      - [Valuation stance, "Historical $5B mark lacks a current comparable denominator", "Unknown", "Current price, cap table, preferences, and peer-multiple bridge"]
    notes: "Evidence mixes company-issued product/adoption statements with independent market and comparison sources; missing current financial terms are intentionally not imputed."
    claimRefs: [CV001, CV003, CV005, CV006, CV009]
  - id: TV002
    title: Thesis / anti-thesis
    columns: [Argument, Supporting evidence, Counter-risk, What would change the view]
    rows:
      - [Distributed SQL differentiation, "PostgreSQL compatibility, ACID transactions, horizontal scale, and resilience are described in official product material", "Feature differentiation may not translate into paid expansion", "Cohort retention and workload-level win/loss evidence"]
      - [Enterprise adoption, "Company reports enterprise customer growth and deeper adoption in 2025", "Statement is company-issued and lacks ARR or customer counts", "Third-party customer references and audited cohort metrics"]
      - [Cloud monetization, "Cloud plans use consumption pricing; Continuum claims pooled capacity and utility economics", "Replication, support, egress, and migration costs can raise TCO", "Gross-margin bridge and customer-level cloud contribution margins"]
      - [Market opportunity, "AI-scale, resilience, compliance, and multi-cloud are cited demand drivers", "Hyperscalers and incumbent databases can bundle substitutes", "Win rates, competitive displacement, and durable pricing power"]
    notes: "The rows are analytical lenses, not independent measurements; company claims remain labeled as such in the evidence ledger."
    claimRefs: [CV001, CV002, CV011, CV012, CV013]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Explicit assumptions, Valuation / return logic, Key risks, Probability signal]
    rows:
      - [Bull, "Cloud and Continuum adoption expands; retention and margins are strong; differentiation survives incumbent competition", "Potential premium to historical mark, but no range is supportable without current revenue", "Execution, cloud cost, competitive bundling", "Low-to-medium; required inputs are unverified"]
      - [Base, "Enterprise adoption continues, but revenue, margin, and cash conversion remain opaque", "Track until a price and financial denominator permit a peer or revenue-multiple bridge", "Financing terms, dilution, opaque economics", "Medium; consistent with available evidence"]
      - [Bear, "Growth slows or cloud economics deteriorate; private-market multiples reset", "Down-round or materially lower clearing price remains plausible", "Multiple compression, cost overruns, customer concentration", "Medium; downside is not quantified"]
      - [Decision gate, "Require current price, ARR/revenue, growth, retention, margin, burn, and preference terms", "No commitment if the gate is not met", "Incomplete diligence can mask permanent dilution or overpayment", "High confidence in the process, not in an outcome"]
    notes: "Scenarios are qualitative because no assigned source provides a current Cockroach Labs price, audited revenue, or reliable probability distribution; no precise valuation range is invented."
    claimRefs: [CV003, CV006, CV009, CV014, CV015]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: Product differentiation and adoption are positive signals, but missing price and financial denominators constrain the investment call.
    data:
      nodes:
        - id: scale-proof
          label: Distributed SQL differentiation
          detail: "PostgreSQL compatibility, horizontal scale, resilience"
        - id: adoption-proof
          label: Enterprise adoption signals
          detail: "Company-reported enterprise growth and deeper adoption"
        - id: economics-gap
          label: Economics gap
          detail: "ARR dollars, retention, margins, burn, and cash are not disclosed"
        - id: price-gap
          label: Price and terms gap
          detail: "No current public price, S-1, preference stack, or secondary mark"
        - id: risk-screen
          label: Downside screen
          detail: "Competition, cloud costs, complexity, dilution, multiple reset"
        - id: recommendation
          label: Track / research more
          detail: "Re-underwrite when current price and financial evidence are available"
      edges:
        - [scale-proof, adoption-proof]
        - [adoption-proof, economics-gap]
        - [economics-gap, price-gap]
        - [price-gap, risk-screen]
        - [risk-screen, recommendation]
    approximationNotes: "Ordered decision logic, not a quantitative score or probability model."
    claimRefs: [CV001, CV003, CV005, CV009, CV014]
callouts:
  - calloutType: recommendation
    title: Decision
    body: "Track and request a refreshed underwriting package; do not treat the historical $5 billion private mark as a current valuation."
    claimRefs: [CV003, CV006, CV009, CV015]
  - calloutType: risk
    title: Primary valuation risk
    body: "The largest risk is not merely competitive pressure; it is paying for an unverified growth and margin profile without current price, cap-table, or preference evidence."
    claimRefs: [CV005, CV009, CV014]
  - calloutType: assumption
    title: Required diligence
    body: "Obtain current ARR and revenue, growth, retention, gross margin, cash and burn, customer concentration, financing terms, and a comparable-company valuation bridge before setting an entry price."
    claimRefs: [CV009, CV014, CV015]
