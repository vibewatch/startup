evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-scale
    missingEvidence: Current audited revenue, ARR, growth, gross margin, retention, cash, operating burn, debt, and runway.
    whyItMatters: Product momentum and a 2021 valuation cannot establish present operating scale, efficiency, or financing need.
    diligencePath: >-
      Obtain audited statements, monthly management accounts, ARR waterfalls, retention cohorts, cash statements, debt
      schedules, and the current board plan.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: >-
      Current board roster, executive authority map, voting control, investor protective provisions, and succession
      plan.
    whyItMatters: >-
      Public CEO and Co-CEO titles do not establish decision rights, while founder concentration may create succession
      exposure.
    diligencePath: >-
      Review the charter, bylaws, voting agreements, board minutes, delegation matrix, and current leadership
      organization chart.
    relatedQuestionRefs:
      - QO003
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: minor
    topic: headcount
    missingEvidence: A company-confirmed headcount by function and geography reconciled to the 706 and 715 directory observations.
    whyItMatters: Directory estimates with different vintages cannot establish current staffing capacity or recent hiring direction.
    diligencePath: Obtain a dated HRIS export and reconcile employees, contractors, departures, functions, and locations.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
  - type: stale
    severity: material
    topic: financing-and-customers
    missingEvidence: >-
      Current primary valuation, cap table, secondary pricing, customer count, customer concentration, and material
      contracts.
    whyItMatters: >-
      The last disclosed valuation and quantified customer count are from 2021 and cannot support a current underwriting
      case.
    diligencePath: >-
      Obtain the fully diluted cap table, recent 409A and secondary records, customer ledger, top-account contracts, and
      concentration schedule.
    relatedQuestionRefs:
      - QO004
      - QO005
      - QO008
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: material
    topic: buyer-economics
    missingEvidence: >-
      Segmented buyer budgets, procurement conversion, win rates, retention, and willingness-to-pay for CockroachDB
      versus incumbent relational alternatives.
    whyItMatters: >-
      Market size does not establish obtainable revenue or valuation relevance without evidence of budget capture and
      durable adoption.
    diligencePath: >-
      Request cohort-level bookings, pipeline conversion, ACV, win-loss, renewal, expansion, and workload-segment data
      under confidentiality.
    relatedQuestionRefs:
      - QM004
      - QM008
  - type: conflicting-data
    severity: material
    topic: market-size
    missingEvidence: >-
      A reconciled market taxonomy mapping distributed SQL, distributed database, and cloud database forecasts to the
      same geography and period.
    whyItMatters: Published estimates differ by several multiples and cannot support a single TAM without boundary normalization.
    diligencePath: >-
      Commission a bottom-up market model by workload, deployment mode, geography, buyer segment, and vendor budget
      using a consistent 2026 base.
    relatedQuestionRefs:
      - QM002
      - QM007
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: adoption-constraints
    missingEvidence: >-
      Customer-level total cost, migration duration, payback, and operating labor comparisons against PostgreSQL,
      Spanner, and other substitutes.
    whyItMatters: Distributed SQL can carry replication, egress, topology, and skills costs that determine whether demand converts.
    diligencePath: >-
      Collect anonymized implementation plans, cloud bills, migration timelines, support utilization, and post-migration
      ROI from representative cohorts.
    relatedQuestionRefs:
      - QM006
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: >-
      Comparable CockroachDB, Aurora, AlloyDB, and PostgreSQL total-cost and realized contract pricing for matched
      workloads.
    whyItMatters: >-
      Pricing and operating cost determine whether the documented capability premium converts into durable win rates and
      acceptable customer ROI.
    diligencePath: >-
      Request anonymized quotes, discount bands, support terms, migration costs, and a matched workload TCO model from
      management and prospective customers.
    relatedQuestionRefs:
      - QP004
  - type: missing-source
    severity: material
    topic: displacement
    missingEvidence: >-
      Independent benchmark and win/loss evidence comparing CockroachDB with PostgreSQL, Aurora, AlloyDB, Vitess, and
