callouts:
  - calloutType: risk
    title: Current scale is not publicly underwritten
    body: >-
      The assigned evidence does not support current ARR, audited revenue,
      customer count, cash balance, burn, runway, or a refreshed primary valuation.
      The 2023 revenue estimate and directory headcount figures should be treated
      as diligence leads, not definitive cover metrics.
    claimRefs: [CO010, CO011, CO012, CO013, CO014]
