artifact: company-overview
slug: cockroach-labs
runDate: 2026-10-25
company:
  name: Cockroach Labs
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Cockroach Labs is a New York-based, Series F database company founded in 2015
    around CockroachDB, a PostgreSQL-compatible distributed SQL system. Its last
    disclosed primary financing was a $278 million Series F at a $5 billion
    valuation in December 2021; current revenue, ARR, customer count, ownership
    rights, and cash position remain undisclosed or supported only by estimates.
sections:
  - id: identity-and-business
    title: Identity and business model
    body: >-
      Cockroach Labs was founded in 2015, is headquartered in New York City, and
      remains described in the retained company directory as a Series F company.
      Its core product, CockroachDB, is an operational database built on a
      transactional, strongly consistent key-value store and exposed through a
      familiar SQL interface. The commercial proposition is resilient,
      horizontally scalable transaction processing with PostgreSQL compatibility,
      offered across managed and self-hosted deployment patterns. In September
      2026 the company extended that proposition with Cockroach Continuum, an
      agentic database-cloud layer intended to pool capacity and coordinate
      operations across a database estate. PostgreSQL's position as the most-used
      database in Stack Overflow's 2024 developer survey supports the familiarity
      of the interface, but does not establish CockroachDB adoption. The product
      statements remain company-issued positioning, not independently measured
      performance or customer economics.
    claimRefs: [CO001, CO002, CO006, CO015]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership, founders, and governance visibility
    body: >-
      The founding team is reported as Spencer Kimball, Peter Mattis, and Benjamin
      Darnell, all former Google engineers. A September 2026 company release names
      Kimball as co-founder and CEO, while Tracxn lists Nathan Rodriguez as Co-CEO
      and Darnell as co-founder and Chief Architect. These records show founder
      continuity across executive and technical leadership, but they do not
      explain the practical division of authority implied by the CEO and Co-CEO
      titles. Nor do they establish current duties for co-founder Peter Mattis.
      No retained source provides the current board roster, voting rights,
      investor protective provisions, succession plan, or a complete executive
      roster, so governance and key-person dependence remain diligence items
      rather than settled facts.
    claimRefs: [CO003, CO004, CO005]
    tableRefs: [TO002]
  - id: capital-and-scale
    title: Capital history and observable scale
    body: >-
      The strongest financing anchor is the December 2021 Series F: Cockroach Labs
      announced $278 million of new funding at a $5 billion valuation and said the
      round brought lifetime funding to $633 million. Tracxn reports the same
      lifetime total across seven rounds, while Latka totals $579.6 million across
      only four rounds beginning in 2019; the different period and round
      denominator explains why the latter is not a substitute for lifetime
      funding. Scale evidence is weaker. Tracxn reports 706 employees in September
      2026, versus Latka's 715 for November 2025. Latka labels $128.3 million as a
      December 2023 revenue estimate sourced to Growjo and explicitly says the
      company has not published revenue. The company's January 2026 release says
      ARR grew year over year but supplies no amount, and the last retained
      quantified customer disclosure is more than 200 customers in December 2021.
      None of these figures establishes current ARR, audited revenue, cash,
      profitability, or runway.
    claimRefs: [CO007, CO008, CO009, CO010, CO011, CO012, CO013, CO014]
    tableRefs: [TO003]
  - id: milestones-and-diligence-implications
    title: Milestones and diligence implications
    body: >-
      The public chronology shows a decade-long progression from founding and
      venture financing into enterprise product expansion: four disclosed rounds
      from 2019 through 2021, a licensing change in 2024, company-reported
      commercial momentum entering 2026, and the Continuum launch in September
      2026. The chronology also exposes the
      principal underwriting limitation. The capital valuation is almost five
      years old at the run date, while the current operating picture relies on
      company assertions and third-party directory estimates. The 2024 licensing
      change reportedly prompted open-source community resistance, adding a
      concrete adoption and ecosystem risk. Investment diligence should therefore
      prioritize current financial statements, cohort metrics, capitalization and
      control documents, and customer evidence before treating product momentum as
      enterprise-value support.
    claimRefs: [CO007, CO008, CO013, CO015, CO016]
    figureRefs: [FO001]
