    {
      "id": "kill-triggers-and-final-diligence",
      "title": "What would change the call",
      "body": "The positive path for Verkor is straightforward: start commercial deliveries in 2026, show that yields and working-capital needs are under control, add at least one customer beyond Renault, and demonstrate that later capital will not crush common equity through seniority or emergency terms. If those things happen, the recommendation can improve because the company would move from “well financed ambition” to “proven industrial platform.” The negative path is equally clear. Another timing slip, a financing that adds more senior capital before customer diversification, or a scope reset similar to what Europe has already seen at ACC or PowerCo would push the valuation case down rapidly. That is why diligence should focus on the exact parts of the story that public sources cannot close: cap table, covenants, subsidies, scrap, utilization, working capital, and second-customer pipeline. Until those gaps close, the right posture is disciplined tracking rather than conviction underwriting.",
