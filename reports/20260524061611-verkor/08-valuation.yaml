    "number": 8,
    "title": "Valuation",
    "summary": "Verkor’s public record supports a serious industrial asset with customer-backed demand and an unusually deep financing stack, but it still does not disclose the current common-equity price, cap-table seniority, or economics needed for a clean buy call. The right framing is therefore not “financing package equals valuation,” but milestone-adjusted equity optionality constrained by debt, subsidies, customer concentration, and the brutal recent record of European battery peers. Recommendation: track / research-more with medium confidence, high risk, and a stretched valuation stance unless private diligence proves cleaner ramp economics and a clearer equity stack."
  },
  "sections": [
    {
      "id": "recommendation-and-valuation-framing",
      "title": "Recommendation and valuation framing",
      "body": "Verkor is easier to respect than to price. The company has done real work: it assembled one of the larger public financing stacks in European batteries, secured Renault as both strategic shareholder and anchor offtake partner, and opened a Dunkirk gigafactory that is now supposed to commercialise first batteries in 2026. Those are not paper milestones. They justify staying engaged. But they do not answer the question that matters most for a new investor: what is the current common-equity price after debt, subsidies, guarantees, and later project-finance layers are considered? Public sources disclose commitments and construction support, not a current post-money or the cap-table mechanics that determine downside recovery. That distinction is why the recommendation is track / research-more rather than buy. The industrial story may be good, but the equity instrument remains partially opaque, and Europe’s recent battery history shows how quickly generous financing headlines can give way to capital destruction when ramp assumptions prove too optimistic.",
