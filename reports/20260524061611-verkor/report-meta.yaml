  productSummary: >-
    Verkor develops and manufactures lithium-ion battery cells and modules for electric vehicles and,
    selectively, stationary-storage applications. Its operating model links R&D, pilot production,
    process validation, and customer qualification work in Grenoble to serial cell production at the
    Dunkirk gigafactory, with first commercial batteries targeted for Alpine from 2026.
  customerFocus: >-
    European EV OEMs led by Renault and Alpine, plus longer-term mobility and stationary-storage
    customers where Verkor can qualify cells through long industrial programs rather than spot sales.
  businessModel: >-
    B2B battery-cell and module supply under long qualification cycles and multi-year industrial
    agreements, supported by pilot-line development in Grenoble and project-financed scale-up in Dunkirk.
  stage: growth-stage private
  fundingStatus: >-
