  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance-gap
    missingEvidence: Current shareholder agreement, reserved matters schedule, committee structure, and minority-protection terms.
    whyItMatters: Board names alone do not show who can block financing, plant expansion, customer concentration, or future fundraising decisions.
    diligencePath: Request the current cap table, board charters, reserved-matters matrix, and any side-letter governance rights from management and lead investors.
    relatedQuestionRefs:
    - QO021
    relatedTableRefs:
    - TO002
    - TO003
  - type: private-evidence-only
    severity: material
    topic: valuation-disclosure
    missingEvidence: Post-2024 valuation, share classes, and most recent priced-round economics.
    whyItMatters: Overview-level recommendation, dilution analysis, and downside framing are weak without a current market or negotiated equity value.
    diligencePath: Obtain the latest financing deck, board materials, and cap-table export showing ownership percentages and valuation terms after the May 2024 debt close and October 2024 equity additions.
    relatedQuestionRefs:
    - QO022
    relatedTableRefs:
    - TO001
  - type: private-evidence-only
    severity: material
    topic: revenue-disclosure
    missingEvidence: Current revenue, ARR, margin profile, customer-pricing structure, and plant ramp assumptions behind the business plan.
    whyItMatters: Capital intensity is visible, but unit economics and near-term self-funding capacity cannot be judged from public materials alone.
    diligencePath: Request the current business plan, lender base case, customer pricing schedule, and monthly operating dashboard for Grenoble and Dunkirk.
    relatedQuestionRefs:
    - QO023
    relatedTableRefs:
    - TO001
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Signed customer backlog beyond Renault and Alpine, including product mix, minimum-volume commitments, and timing of second-customer ramps.
    whyItMatters: The public story is strong on Renault but thin on multi-customer diversification, which is important if ramp or program timing shifts.
    diligencePath: Request the contracted order book, top-customer concentration schedule, LOIs, and current commercial pipeline segmented by EV versus stationary-storage applications.
    relatedQuestionRefs:
    - QO024
    relatedTableRefs:
    - TO003
