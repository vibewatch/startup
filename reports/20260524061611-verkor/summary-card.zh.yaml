summary:
  headline: >-
    Verkor 是欧洲剩余电池平台中更可信的一家：Dunkirk 资产已经投运，Renault 需求托底，承诺资本超过 €3B；但 Northvolt 已经证明电池规模化乐观预期可以快速反转，Verkor
    的股权故事仍太不透明、太依赖执行，尚不足以给出买入结论。
