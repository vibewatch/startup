- id: TI005
  title: Capital adequacy table
  columns:
  - Capital item
  - Public figure / status
  - What it says
  - Confidence
  - Diligence ask
  rows:
  - - EIB facility for Dunkirk
    - €600m total facility; €334.5m signed by 28 Nov 2024
    - Large multiyear public-bank anchor remains central to phase-one financing
    - medium
    - Request remaining availability, draw conditions and final disbursement timing.
  - - InvestEU-backed EIB direct tranche
    - €270m direct loan plus €130m intermediated EIB-backed loans
    - Public institutions helped crowd commercial lenders into the structure
    - high
    - Request final lender allocation and pricing by tranche.
  - - Commercial-bank senior loans
    - €961m according to Verkor; €1.2bn senior debt according to Natixis
    - The capital stack is large but public descriptions use different inclusion conventions
    - medium
    - Reconcile the definitive sources-and-uses table and legal debt perimeter.
  - - French government guarantee
    - €353m of senior debt guaranteed under GPS / Bpifrance Assurance Export
    - State credit enhancement materially de-risks commercial-bank exposure
    - medium
    - Request covered obligations, fees, tenor and trigger mechanics.
  - - CDC / Banque des Territoires junior support
    - €130m bridge loan + €150m subordinated loan
    - Public institutions are absorbing part of the mezzanine and timing risk
    - medium
    - Request maturity, ranking, amortization and any conversion or refinance triggers.
  - - Phase-one plant capex
    - €1.6bn to €1.941bn public project-cost range for 16 GWh
    - Phase-one capex intensity is high even before a broader 50+ GWh buildout
    - medium
    - Request final EPC, equipment and utilities capex by category.
  - - 50+ GWh expansion path
    - Publicly signaled, including a reported €2bn adjacent project
    - Expansion still looks financing-dependent rather than self-funded from public operating cash flow
    - medium
    - Request approved 50+ GWh capex, demand gates and intended equity/debt/grant mix.
  notes: The table focuses on today’s capital adequacy rather than repeating every historical round. Where public sources disagree, the disagreement itself is decision-useful because it highlights unresolved debt-structure detail.
