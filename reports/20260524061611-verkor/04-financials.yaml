- id: TI001
  title: Funding stack and chronology
  columns:
  - Date / window
  - Instrument
  - Public amount
  - Counterparties
  - Primary use
  - Financial read-through
  rows:
  - - Jul 2021
    - Strategic equity round
    - €100m
    - EQT Ventures, Renault, EIT InnoEnergy, Groupe IDEC, Schneider Electric, Capgemini, Arkema, Tokai COBEX, FMET plus public support
    - Build the Verkor Innovation Centre and pilot line
    - Early cap table already mixed industrial, financial and public-policy capital rather than pure VC.
  - - Late 2022
    - Additional VIC financing
    - '>€250m'
    - EIB, Bpifrance Assurance Export, Demeter FMET, SPI/Bpifrance, Plastic Omnium, Sibanye, Groupe IDEC, Schneider Electric and others
    - Complete the Grenoble innovation centre and associated site acquisition
    - Shows the company needed loans, guarantees and convertibles before the first full gigafactory raise.
  - - Sep 2023
    - Series C plus public/debt package
    - '>€2bn total; min €850m equity + €600m EIB support + ~€650m subsidies pending approval'
    - Macquarie, Meridiam, Renault, EQT, EIT InnoEnergy, Sibanye, SPI/Bpifrance, Crédit Agricole, FSP, PULSE, Airbridge, EIB and French-state support
    - Launch Dunkirk 16 GWh gigafactory and continue technology development
    - This is the inflection from startup financing into large-scale industrial project finance.
  - - Oct 2023
    - French state-aid approval
    - €659m direct grant
    - European Commission / French state
    - R&D, digitisation, recycling, materials recovery and pilot-line work through end-2026
    - Reduces private capital burden, but the grant is tied to conditions and claw-back logic.
  - - May 2024
    - Green-loan debt package
    - '>€1.3bn'
    - 19 banks, EIB, Bpifrance Assurance Export, Banque des Territoires / CDC
    - Construction and financing of the first Dunkirk gigafactory
    - Debt layered over public guarantees confirms the project is capital-intensive and policy-supported.
  - - Dec 2025 onward
    - Operating-phase capital base
    - '>€3bn secured since 2020'
    - Mixed ecosystem of investors, banks and public institutions
    - Commissioning 16 GWh phase and first Alpine batteries in 2026
    - Phase one is funded and operating, but the 50+ GWh ambition still points to more capital ahead.
  notes: Amounts combine equity, loans, guarantees and grants. Public descriptions of the 2023-2024 packages use slightly different inclusion conventions, so the table separates chronology from definitive legal close mechanics.
