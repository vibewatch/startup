- id: TI003
  title: Pricing / monetization table
  columns:
  - Surface
  - Public unit / contract basis
  - What is known
  - List vs realized
  - Source-backed caveat
  - Implication
  rows:
  - - Renault supply agreement
    - Annual GWh commitment
    - Volume commitment is public, but no €/kWh or contract formula is public
    - Realized pricing unknown
    - Neither Renault nor Verkor publishes the commercial formula
    - Revenue cannot be derived cleanly from volume alone
  - - Majority-of-output support for lenders
    - Project-finance offtake assumption
    - Natixis and BPCE say Renault covers the majority or most of production
    - Economic realization still unknown
    - Volume support helps debt underwriteability but does not disclose unit price or margin
    - Customer concentration can support debt while still obscuring equity economics
  - - Pilot / D-sample sales
    - Sample-cell shipments
    - Independent reporting hints at revenue, without amount or pricing
    - Realized pricing unknown
    - Sample shipments validate customer acceptance but not plant-scale economics
    - Do not model scaled ASPs from sample evidence
  - - Green-financing label
    - Debt framework rather than sales price
    - S&P “Dark Green” rating and taxonomy-style framing are public
    - Not a revenue price point
    - A green label can lower funding friction but does not prove selling-price power
    - Financing quality should not be confused with gross-margin quality
  - - Battery-regulation compliance
    - Label, QR and due-diligence obligations
    - Regulatory information requirements begin from 2026-2027
    - No public pass-through pricing mechanism
    - Compliance costs may emerge before market pricing power is visible
    - Margins may absorb part of regulation cost if OEM contracts do not fully pass it through
  notes: This table is intentionally explicit about what public sources do not disclose. A missing price field means unavailable, not zero or economically irrelevant.
