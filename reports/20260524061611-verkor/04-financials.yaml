callouts:
- calloutType: risk
  title: The 2024 debt stack is real, but public debt definitions still conflict
  body: Verkor, Natixis and partner banks all support the existence of a large green-loan closing in May 2024, yet they do not describe the senior tranche identically. That makes covenant, ranking and debt-service analysis weaker than the headline financing number suggests.
  claimRefs:
  - CI019
  - CI020
  - CI021
  - CI022
- calloutType: risk
  title: Renault is both the best proof point and the largest concentration risk
  body: Renault underpins the financing case as customer and shareholder, and bank commentary says it covers the majority or most of production. That reduces go-to-market uncertainty while increasing exposure to one OEM relationship.
  claimRefs:
  - CI007
  - CI008
  - CI024
  - CI025
- calloutType: insight
  title: Public support improves bankability but does not solve disclosure opacity
  body: Verkor’s stack includes grants, guarantees, EIB debt and CDC junior capital. That is exactly why the company could fund a first factory early, but none of those supports substitutes for public revenue, margin or runway disclosure.
  claimRefs:
  - CI012
  - CI017
  - CI018
  - CI030
- calloutType: assumption
  title: The 50+ GWh ambition should be underwritten as a further financing event, not as a funded extension
  body: Phase one is visible and operating. Expansion is not. Public cost anchors, reported adjacent-site plans and the lack of disclosed free cash flow all imply that the 50+ GWh path still depends on new capital and supportive demand conditions.
  claimRefs:
  - CI032
  - CI033
  - CI034
  - CI035
