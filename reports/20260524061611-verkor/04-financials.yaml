    - GWh per year
    - 12 GWh/year publicly disclosed; first Alpine A390 batteries planned for 2026
    - Best-supported commercialization anchor, but still concentrated and price-undisclosed
    - Request realized pricing, payment timing, take-or-pay terms and annual volume ramp
  - - Earlier Renault volume path
    - Publicly cited planning volumes for the Verkor relationship
    - GWh per year
    - 10 GWh by 2026 and 20 GWh by 2030 were cited in prior disclosures, but no update was published at factory opening
    - Useful volume context but stale until refreshed against current demand
    - Request the latest signed offtake schedule and any revised minimum-purchase obligations
  - - Pilot / D-sample revenue
    - Engineering samples and pre-series cells delivered ahead of full ramp
    - Sample shipments / pilot revenue
    - Sifted reported D-sample deliveries and some revenue generation; no public amount
    - Low-confidence revenue signal, not enough for recognized-revenue underwriting
    - Request 2025-2026 sample revenue, customer list and gross-margin treatment
  - - Stationary storage and other mobility
    - Potential non-automotive module sales
    - Contract value / GWh
    - Public ambition exists, but reviewed sources disclose no named contracts or economics
    - Strategic adjacency only in this pack
    - Request disclosed customers, pipeline, revenue split and margin by end market
  - - Public grants and project debt
    - Financing inflows to build capacity
    - €
    - '>€3bn of secured financing since 2020'
    - Important for solvency, but not revenue and should not be mixed into sales quality
    - Keep funds-flow disclosures separate from revenue reporting and customer monetization
