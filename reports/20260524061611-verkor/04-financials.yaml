- id: revenue-model-and-disclosure-quality
  title: Revenue Model and Disclosure Quality
  body: The commercialization story is credible, but the revenue-quality story is still thin. Renault’s long-term offtake and the Alpine A390 launch plan show that Verkor is not building an unfocused speculative plant; there is a named customer, a binding battery-supply relationship and a first vehicle program. Lender and bank sources go further, saying Renault covers the majority or most of the initial output. That is useful for debt underwriting because it improves volume visibility. It is less useful for equity-style revenue analysis because public sources still omit realized pricing, take-or-pay logic, payment timing, warranty obligations and working-capital terms. The only independent hint that any revenue already exists is Sifted’s report that D-samples were delivered to Renault and that revenue had started, but that is not a published financial bridge. As of the 2026 run date, the pack still supports commercialization without supporting transparent revenue, margin or cash-generation
    disclosure.
