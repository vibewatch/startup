  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: revenue-quality
    missingEvidence: Management or audited disclosure of 2025-2026 revenue, gross margin and working-capital metrics.
    whyItMatters: The chapter can point to contracts and first deliveries, but it cannot convert GWh commitments into recognized revenue quality or gross profit without actual financial statements.
    diligencePath: Request monthly revenue, gross-margin and cash-collection bridges by customer from 2025 through the latest available month.
    relatedQuestionRefs:
    - QI018
    - QI021
    relatedTableRefs:
    - TI004
    - TI006
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: Executed pricing formulae, take-or-pay terms, escalation clauses and penalties under the Renault offtake and any other customer contracts.
    whyItMatters: Without realized pricing or contract structure, the strongest commercialization evidence still cannot be translated into revenue or contribution margin.
    diligencePath: Request the Renault supply agreement economics, top-customer pricing logic and any public/private comparable contract excerpts.
    relatedQuestionRefs:
    - QI019
    - QI020
    relatedTableRefs:
    - TI002
    - TI003
  - type: conflicting-data
    severity: material
    topic: green-loan-structure
    missingEvidence: Definitive debt closing memorandum reconciling the €961 million commercial-bank senior figure with Natixis’s €1.2 billion senior-debt framing, plus covenants and amortization.
    whyItMatters: Debt service, guarantee coverage and refinancing risk cannot be underwritten confidently while key public sources use different inclusion conventions.
    diligencePath: Obtain the final sources-and-uses table, term sheet, guarantee schedule, DSRA requirements and intercreditor summary from management or lenders.
    relatedQuestionRefs:
    - QI014
    - QI015
    - QI030
    relatedTableRefs:
    - TI005
  - type: private-evidence-only
    severity: material
    topic: runway
    missingEvidence: Current cash-on-hand, restricted-cash balances, monthly burn and debt-service schedule.
    whyItMatters: Verkor’s financing stack is visible, but solvency timing is not. Underwriting still depends on knowing whether available liquidity comfortably spans ramp delays and yield learning.
    diligencePath: Request the latest board liquidity dashboard, covenant headroom, debt-service calendar and downside-case runway model.
    relatedQuestionRefs:
    - QI021
    - QI030
    relatedTableRefs:
    - TI004
    - TI005
    - TI006
  - type: missing-source
    severity: material
    topic: 50-gwh-expansion
    missingEvidence: Board-approved capex, phasing and financing plan for the adjacent expansion that would push capacity beyond the initial 16 GWh site.
    whyItMatters: The market can see phase-one financing and a reported €2 billion next-step concept, but not the final decision package for the 50+ GWh path.
    diligencePath: Request the filed expansion dossier, final approved capex, permitting status, intended debt/equity/grant mix and customer-backed demand thresholds.
    relatedQuestionRefs:
    - QI023
    relatedTableRefs:
    - TI001
    - TI005
    - TI006
  - type: missing-source
    severity: minor
    topic: battery-regulation
    missingEvidence: A company-specific compliance plan covering battery passport data systems, supply-chain due diligence and carbon-footprint reporting.
    whyItMatters: Battery regulation will affect cost and operational readiness from 2026 onward, but public sources do not yet show Verkor’s implementation budget or timeline.
    diligencePath: Request the internal compliance roadmap, digital-product-passport architecture, supplier-audit plan and expected opex/capex burden.
    relatedQuestionRefs:
    - QI028
    - QI029
    relatedTableRefs:
    - TI003
    - TI006
