chapter:
  number: 4
  title: Financials
  summary: Verkor’s public record supports a heavily subsidised, project-financed battery buildout rather than a conventional venture-funded software-style growth story. The funding stack is unusually visible—€100 million in 2021, more than €250 million for the innovation centre in 2022, a September 2023 package above €2 billion, and a May 2024 green-loan package above €1.3 billion—yet revenue, margin, cash and runway remain undisclosed. The plant opened at 16 GWh with first commercial batteries planned for 2026, but the route to 50+ GWh still appears financing-dependent and exposed to EV-demand, yield, compliance and debt-structure risk.
sections:
- id: funding-stack-and-counterparties
  title: Funding Stack and Counterparty Profile
  body: 'Verkor’s financing chronology is unusually rich for a private industrial startup, and the pattern matters more than any single round. The business moved from a €100 million strategic round in 2021, to a 2022 innovation-centre package above €250 million, to a September 2023 package above €2 billion, and then to more than €1.3 billion of project-oriented green debt in May 2024. The investor mix is also not typical venture software capital: early equity and industrial sponsors included Renault, EQT Ventures, EIT InnoEnergy, Schneider Electric, Capgemini, Arkema and Tokai COBEX, while later rounds added Macquarie, Meridiam, Crédit Agricole Assurances and FSP alongside public institutions and export guarantees. Renault is both customer and shareholder, and the latest lender commentary makes clear that this dual role is central to the financing case. That improves bankability, but it also concentrates commercial exposure around one anchor OEM and one factory ramp.'
