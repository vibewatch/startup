- id: TI006
  title: Public financial gaps table
  columns:
  - Missing private metric / document
  - Why it matters
  - Current public state
  - Exact diligence path
  - Underwriting consequence
  rows:
  - - Revenue and margin reporting
    - Needed to turn offtake and first deliveries into an earnings view
    - No reviewed official or filing source gives revenue or gross margin
    - Request monthly revenue bridge, gross margin by product and customer concentration detail
    - Revenue quality remains unproven.
  - - Cash, burn and debt service
    - Needed to judge runway and covenant stress if ramp slips
    - Capital raised is public, liquidity and repayment schedule are not
    - Request treasury dashboard, debt-service timetable and downside-case liquidity model
    - Capital adequacy remains inferential.
  - - Contract pricing and take-or-pay terms
    - Needed to translate GWh commitments into revenue and gross profit
    - Only volumes or qualitative offtake support are public
    - Request customer contracts or management-certified economics summary
    - Unit economics cannot be underwritten.
  - - 50+ GWh expansion approval pack
    - Needed to size future dilution or debt dependency
    - Only a reported €2bn next-step concept is public
    - Request approved expansion dossier, sources and uses, and demand thresholds
    - Expansion financing risk remains material.
  - - Battery-regulation implementation plan
    - Needed to quantify compliance cost and execution burden from 2026 onward
    - Regulatory obligations are public, company implementation budget is not
    - Request battery-passport, due-diligence and carbon-footprint compliance roadmap
    - Margin path may be overstated if compliance cost is omitted.
  notes: These are the missing items that matter most to an underwriting decision. The issue is not a lack of publicity around financing; it is the absence of the operating and covenant data that convert financing into a credible return path.
  enumerationScope:
    coverage: partial
    basis: The table enumerates the minimum private disclosures required to move from a financing chronology to a true revenue-quality and capital-adequacy underwriting view.
