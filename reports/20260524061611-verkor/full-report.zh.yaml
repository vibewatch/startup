        title: 缓释因素、监测指标和打破投资逻辑的触发点
        blocks:
          - type: paragraph
            body: >-
              Verkor 确实有实质缓释因素。公司已经拿到大型融资包、Renault 的锚定需求，以及法国政府、EIB
              和商业贷款方的明确支持。它还位于法国战略偏好的电池走廊，政治上被放弃的概率更低。但这些缓释因素解决的是生存问题，并不能证明投资逻辑已经去风险。真正的问题是，公共支持和客户背书能否把公司带过最后、也最难的制造关口：以所需成本证明可重复的汽车级产出。因此，投资人应把监测纪律放在承销核心。最重要的信号不是关于主权或融资的宽泛标题，而是稳定量产的证明、Alpine
              或 Renault 量的任何滑坡迹象，以及贷款方或监管方加强审查的任何证据。如果 Verkor 披露更广泛客户基础或更强良率证据之前，其中一个信号朝错误方向破裂，投资逻辑就应重新承销，而不是凭信念继续持有。
