      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >-
              公开领导层信息在创始人和运营班底层面最扎实，控制权信息则较弱。Benoit Lemaignan 仍是 Verkor 的核心高管和公众面孔；当前团队页面显示 Christophe Mille
              担任执行技术顾问，而非早期 CTO 头衔，说明公司从设计走向工业爬坡后，领导职责已有实质调整。同一公开页面还显示，运营、财务、销售、采购、可持续和制造等职能的高管班底正在成熟；Verkor
              是资本密集型规模化公司，不能只靠创始人魅力支撑，所以上述变化很重要。2026 年 3 月，Dunkirk 投产后 Verkor 任命 Jacques Esculier
              出任监事会主席，治理也更正式。公司董事会页面和治理公告显示，监事会成员包括 Macquarie、Meridiam、ISALT/FSP、Crédit Agricole Assurances 或
              Predica、Renault Group、InnoEnergy 的投资人和伙伴代表，以及 Verkor
              管理层。这为后续控制权分析提供了有用的事实底座。公开记录同样缺少重要内容：已抓取材料没有披露董事会委员会、保留事项、少数股东保护或完整股东名册，所以不能因为董事会名单可见，就把治理尽调视为完成。
