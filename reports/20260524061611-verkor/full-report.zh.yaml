      - number: '8.4'
        title: 什么会改变判断
        blocks:
          - type: paragraph
            body: >-
              Verkor 的正向路径很直接：2026 年启动商业交付，证明良率和营运资本需求受控，新增至少一个 Renault
              之外的客户，并展示后续资本不会通过优先级或紧急条款压垮普通股。如果这些事情发生，建议可以上调，因为公司会从「融资充足的野心」变成「已验证的工业平台」。负向路径同样清晰。又一次时间滑坡、在客户多元化之前加入更多高级资本的融资，或出现类似欧洲已在
              ACC、PowerCo
              看到的范围重置，都会快速压低估值案例。因此，尽调应聚焦公开来源无法闭合的故事细部：股权结构表、贷款契约、补贴、报废率、产能利用率、营运资本和第二客户管线。在这些缺口闭合前，正确姿态是有纪律地跟踪，而不是带着确信承销。
