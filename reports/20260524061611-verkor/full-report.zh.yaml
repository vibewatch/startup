        - 销往欧盟乘用车和厢式车项目的合格锂离子电芯
        - 整车、销往欧洲以外的电池包，以及充电硬件
        - OEM 平台采购和经财务批准的寻源团队
        - 核心市场，因为欧盟车队规则和 OEM 本地化会塑造需求
      - - 高端或性能 OEM 本地化项目
        - 低碳、本地或韧性供应具备战略价值时销售的电芯
        - 没有本地化溢价的通用商品电池交易
        - OEM 寻源、工程和合规职能
        - Verkor 瞄准更高规格本地供应，而不是最低成本全球供给池，因此纳入边界
      - - 固定式储能电芯
        - 面向欧洲公用事业级、工商业及部分表后储能系统的电芯
        - 电力市场软件、纯 EPC 服务和非电池储能技术
        - 公用事业公司、开发商、集成商和 EPC 主导买家
        - 汽车周期之外可吸收电芯的第二需求支柱
      - - 政策加权的公共或受支持采购
        - 受韧性、可持续性或战略自主标准影响的项目
        - 没有采购或支持筛选因素的纯商业进口
        - 公共买家、计划管理方和项目发起方
        - 重要，因为 NZIA 式标准可能偏向本地或多元化供应
      - - 电池产业相邻机会
        - 部分价值来自认证支持、本地生态形成和集群效应
        - 上游采矿经济性和下游整车收入
        - 横跨价值链的混合买家群
        - 有用的相邻机会，但不同于 Verkor 可直接销售的电芯市场
    notes: 这样划定边界，是为了把本章聚焦在可变现的欧洲电芯需求，同时明确排除上游原材料和整车收入池。
