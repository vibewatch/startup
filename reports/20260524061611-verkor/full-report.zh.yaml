            body: >-
              一期经济性看起来是工业型且重资本，而不是轻资产。公开锚点因口径和时间而不同——InnoEnergy 曾称初始投资 €1.6B，EIB 项目表现在列出 16 GWh 工厂项目成本
              €1.941B——但两者都指向首座工厂极高的资本强度。2024 年债务包的结构进一步强化了这个判断：EIB
              直接和中介贷款、出口式担保、商业优先贷款、过桥贷款，以及次级公共债。这是典型的风险共担，用来在长期运营历史出现前把战略项目推过融资线。即便如此，公开披露也有冲突：Verkor 单独列出 €961M
              商业银行优先债，而 Natixis 把同一次交割表述为 €1.2B 优先无追索债。最稳妥的解读不是某一方错了，而是公开来源采用了不同纳入口径。对 50+ GWh
              路径而言，公开证据仍指向未来还要再融资，而不是靠自身资金扩张。
