      - number: '5.3'
        title: 低碳制造、安全工作与循环性姿态
        blocks:
          - type: paragraph
            body: >-
              Verkor 的低碳逻辑作为工业选址策略可信，尽管产品级性能数据仍稀疏。Dunkirk 给公司带来进口材料港口接入、法国北部密集的汽车和电池生态，以及来自法国电网的低碳电力。Verkor 为期 12 年的 EDF
              合同尤其重要，2028 年起达到 33 MW；它把泛泛的「法国电网优势」营销，变成一个具体的长期电力配置工具，意在稳定碳强度和成本。Journal Auto
              还补充了第二个工厂级优势：接入与附近重工业相连的本地余热网络。这些因素合在一起，让气候故事不只是泛泛 ESG 外衣，而是运营模式的一部分。


              在质量、安全和循环性上，公开证明更偏工艺，而不是产品基准。INERRANT 播客帖把 Verkor 放进一个面向电动出行的电池安全和性能测试工作包。EC
              援助决定确认了自动化、电池化成数字化、回收和材料回收方面的工作。AGATHE 还披露目标，要在现场处理超过 95% 的生产报废；Natixis 则描述了在符合 EU Taxonomy
              的融资框架下，从组件到回收的生命周期承诺。专利申请进一步说明，Verkor 可见的自有 know-how 正在工艺和质量控制上形成：EP4537420 覆盖一种电芯及其制造方法，US12531287
              覆盖一种在压力下测量电芯温度的检测装置。公开材料包尚未提供的内容同样重要：没有披露上市电芯的循环寿命曲线、能量密度、充电倍率认证或现场可靠性数据集。因此，投资人应把 Verkor
              的质量和安全姿态理解为一个证据真实、严肃的工业项目，而不是一份已充分公开对标的产品性能档案。
