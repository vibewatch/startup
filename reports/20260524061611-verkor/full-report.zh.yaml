chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、布局与商业模式
        blocks:
          - type: paragraph
            body: >-
              Verkor 应被视为工业电池制造商，而不是软件中介或狭义工程承包商。官方材料始终把它描述为一家创立于 Grenoble 的法国公司，专注于面向电动汽车和固定式储能的低碳锂离子电芯；运营采用两地模式，起点在
              Grenoble，规模化落在 Dunkirk。Grenoble 的 Verkor Innovation Centre 既是总部，也是连接研发、试点制造和员工培训的技术桥梁。这一点重要，因为公司的商业模式离不开工艺
              know-how 的工业化能力：VIC 开发电芯、验证制造方法并培训人员；Dunkirk 超级工厂则必须把这些工艺规模化产出为车规级电芯。公开足迹已经足够具体，不再只是愿景。Verkor 官方页面列出一座
              15,000 m² 的 Grenoble 中心、一条 100 至 150 MWh 试点线、一座 16 GWh 的 Dunkirk 超级工厂、2030 年 50 GWh 目标，以及一期满产约 1,200
              个直接岗位。截至 2026 年 3 月，Verkor 自述已进入连续生产前的最终验证阶段；这比单纯建设故事更进一步，但离成熟稳态制造企业仍有距离。
