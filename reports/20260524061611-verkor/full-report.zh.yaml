  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与估值框架
        blocks:
          - type: paragraph
            body: >-
              Verkor 容易让人尊重，却不容易定价。公司确实做了实事：搭起欧洲电池领域较大的公开融资结构之一，让 Renault 同时成为战略股东和锚定承购方，并开出一座 Dunkirk 超级工厂，计划在 2026
              年把首批电池商业化。这些不是纸面里程碑，足以支持继续跟踪。但它们没有回答新投资人最关心的问题：把债务、补贴、担保和后续项目融资层级都算进去之后，当前普通股价格是多少？公开来源披露了承诺和建设支持，却没有披露当前投后估值，也没有披露决定下行回收的股权结构机制。正因如此，建议是观察
              / 继续研究，而不是买入。工业故事可能不错，但股权工具仍有部分不透明；欧洲近期电池史也说明，一旦爬坡假设过于乐观，慷慨融资标题会很快变成资本毁损。
