  - id: TV002
    title: 投资论点 / 反论点表
    columns:
      - 视角
      - 正方论点
      - 反方论点
      - 什么会改变判断
    rows:
      - - 产业证明
        - Verkor 已开出 16 GWh 工厂，从设计阶段走到大规模生产基础设施。
        - 工厂开业不等于良率、利用率或营运资本纪律已经跑通。
        - 2026 年商业交付稳定，并披露爬坡 KPI。
      - - 客户锚点
        - Renault 给了 Verkor 真实的战略客户和承购基础。
        - 公开需求证据仍高度集中在 Renault 和 Alpine 周围。
        - 第二家 OEM 或大型储能客户给出有约束力的量。
      - - 融资支持
        - 公司为新电池工厂拼出了欧洲最深的融资栈之一。
        - 其中很大一部分是债务、补贴或担保支持，而不是普通股权支持。
        - NDA 下的当前股权结构表、债务契约和优先权结构。
      - - 相对估值
        - 已投产工厂可以相对纯研发型电池公司获得溢价。
        - 同业失败说明，爬坡或市场判断出错时，工业资产仍可能让股权归零。
        - 证明 Verkor 能在不反复重置高级资本的情况下扩张。
      - - 退出可选性
        - 如果 2026 年交付跑通，Verkor 可能成为欧洲少数具备规模的独立电池平台之一。
        - 公开证据尚未显示足够的经济性或多元化，不能支撑干净的 IPO 级故事。
        - 客户多元化、利润率披露以及更清晰的资产负债表能见度。
      - - 项目融资逻辑
        - 贷款人和政策支持降低停摆风险。
        - 但这些支持也会让企业价值更难拆分，因为资本结构中部分资金被排到更优先位置。
        - 清楚映射贷款人追索权、补贴条件和股权分配瀑布。
    notes: 反论点刻意聚焦经济性，而不是修辞：问题不在 Verkor 是否真实存在，而在普通股权能否仅凭公开证据被清晰承销。
    claimRefs:
      - CV013
      - CV015
      - CV017
      - CV018
      - CV019
      - CV037
      - CV038
      - CV047
      - CV051
  - id: TV003
    title: 牛 / 基准 / 熊情景表
    columns:
      - 情景
      - 核心假设
      - 示意股权价值
      - 概率信号
      - 关键风险
    rows:
      - - 熊
        - 商业化再次延后，Renault 仍是唯一可见锚定客户，并且需要新的高级资本。
        - €0.8-1.8B
        - 中
        - 下轮降价融资、契约压力和被稀释后的普通股权回收。
      - - 基准
        - 2026 年开始交付，16 GWh 爬坡进展不均但没有战略性重置，融资仍然可得。
        - €2.0-3.5B
        - 中到高
        - 执行风险仍在，但平台还能融资。
      - - 牛
        - Alpine 交付按时爬坡，第二客户证据出现，50 GWh 扩产可信度提高。
        - €4.0-6.0B
        - 低到中
        - 需要经营证据和更清晰股权能见度同时成立。
      - - 区间为什么很宽
        - 当前价格未披露，因此情景价值是从里程碑和同业结果倒推，而不是来自管理层指引。
        - 不是事实估值
        - 高置信度
        - 最该避免的建模错误是虚假精确。
      - - 下行传导
        - 爬坡失误或额外高级债比软件公司更快打到价值，因为资本强度和营运资本更重。
        - 估值压缩可能很突然
        - 高置信度
        - 如果资本条款恶化，工厂资产保护不了普通股。
    notes: 所有价值均为分析师以欧元计的情景估算，不是公司披露估值。本表明确拆分里程碑风险与股权支持不确定性。
    claimRefs:
      - CV039
      - CV040
      - CV041
      - CV042
      - CV043
      - CV044
  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 说明什么
      - 价值或状态信号
      - 与 Verkor 的关联
      - 局限
    rows:
      - - Verkor（公开支持栈）
        - 至少 €850M C 轮，最高 €600M EIB 支持，约 €650M 补贴，随后约 €1.2-1.3B 绿色贷款，到 2025 年底累计资本 >€3B。
        - 未披露当前股权标记；支持栈真实存在，但性质混杂。
        - 衡量项目支持和资产建成的最佳直接锚点。
        - 债务、补贴和担保不等于普通股权价值。
      - - Northvolt
        - 欧洲最大胆的电池规模化案例，变成最清楚的「融资不是估值」警示。
        - 2024 年 1 月完成 $5B 无追索融资；2024 年底进入 Chapter 11。
        - 说明爬坡和市场假设落空时，规模叙事反转有多快。
        - Northvolt 规模更大、全球布局更分散，因此不是完全匹配。
      - - ACC
        - 有 JV 背书的欧洲电池扩产，在经济性和执行转弱时也会被搁置。
        - 德国和意大利超级工厂长期延误后于 2026 年放弃。
        - 有助于从需求、客户集中度和可行性角度框定下行。
        - ACC 是 JV，治理结构和化学路线决策不同。
      - - PowerCo
        - 即使是 Volkswagen 自有电池平台，也会重置产能和资金预期。
        - 预算从 €15B 削到低于 €10B；工厂目标从六座降到三座。
        - 有助于理解 EV 爬坡放慢时，即便战略车企也得重置资本计划。
        - PowerCo 在 VW 体系内，战略动机超出独立估值。
      - - QuantumScape
        - 上沿公开电池技术估值参照。
        - 2026 年 5 月市值 $5.04B。
        - 可作为投机性电池股权的公开上限校验。
        - 偏研发的固态电池故事，不是直接制造同业。
      - - Solid Power
        - 下沿上市固态电池参照。
        - 2026 年 5 月市值 $0.68B。
        - 显示头部公司之外，公开电池技术估值压缩有多快。
        - 技术阶段可比，不是工厂爬坡可比。
      - - SES AI
        - 另一个公开早期电池平台锚点。
        - 2026 年 5 月市值 $0.45B。
        - 有助于判断公开市场接受度下沿。
        - 不是直接的欧洲制造可比。
      - - Enovix
        - 电池硬件价值链可比，物理生产暴露更多。
        - 2026 年 5 月市值 $1.45B。
        - 介于纯研发可选性与工业硬件之间的有用中点。
        - 偏消费电子，限制其与 EV 电芯的直接可比性。
    notes: 样本具代表性但不穷尽。公开股权价值采用 CompaniesMarketCap 当前美元市值；Verkor 和欧洲风险投资公司行是项目或融资状态锚点，不是直接观察到的股权标记。
    enumerationScope:
      coverage: partial
      basis: >-
        Rows cover the most decision-relevant public and private battery references retained for this chapter, chosen to
        bracket Verkor between project-finance-backed European cell builds, failed or reset battery ventures, and listed
        battery-tech equities rather than to enumerate every battery company globally.
