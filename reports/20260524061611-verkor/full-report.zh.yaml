  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >-
              到 2026 年中，Verkor 参与的欧洲电池市场已分成四类。第一类是地理位置和工业雄心都真正接近 Verkor 的欧洲电芯制造商和初创主导项目：Northvolt、ACC、Envision
              AESC、Morrow，以及较弱的老案例 FREYR、Italvolt 和 Britishvolt。第二类是 OEM 支持的电池部门，例如 Volkswagen 的
              PowerCo；它们在所有权结构上不是初创同行，但会争夺同一批车企资本开支、工程注意力和主权支持预算。第三类是已经在欧洲制造或能够规模化供应欧洲的亚洲既有玩家：CATL、LG Energy
              Solution、Samsung SDI、SK On 和 BYD。第四类是现状本身：买方已经知道如何认证、融资和集成的成熟 NMC/LFP 供应链。


              对 Verkor 而言，核心比较并不只是「欧洲初创 vs 中国巨头」。问题是，一个法国低碳、政策支持、Renault 绑定的电芯项目，能否跨过击败 Northvolt 的同一道执行门槛，绕开 ACC
              模式的收缩，还能在爬坡更快的亚洲和 OEM 支持平台面前保持相关性。Verkor 在欧洲特定属性重要的场景最强——碳强度、工业主权、Renault
              毗邻性和靠近法国汽车物流；在成本和多客户规模主导的场景最弱。因此，本章重点不是标题技术，而是融资耐久性、工厂状态、客户获取，以及 Northvolt 崩塌重置市场信任门槛后，爬坡证据是否可信。
