            body: >-
              Verkor 并没有把自己包装成单一汽车用途公司。公司官网、InnoEnergy 资料和融资材料反复提到，它面向电动出行、更广义的出行，以及固定式储能。最清晰的 Renault 之外具名信号是
              EnerSys。Verkor 披露，EnerSys 既成为投资方，也成为原型客户；Verkor 为其生产 ENS1 锂离子电芯，并在 Grenoble 开发新规格。这一点重要，因为它证明产品和市场能走出
              Renault 乘用 EV 路线图。但这还不等于第二份已披露的量产承购合同。留存的公开来源没有进一步点名第二家汽车 OEM、已签约的固定式储能买家，或能分配一期剩余产能的多客户积压订单。换句话说，Verkor
              已证明自己能打到 Renault 之外的市场，但多数证据仍停留在生态或原型层面，还不是一批能贡献收入的客户名单。因此，本章必须清楚区分具名商业承诺、原型验证和战略市场野心。
