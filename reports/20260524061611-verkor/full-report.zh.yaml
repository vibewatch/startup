        title: 欧洲同行失败和公开可比公司让估值区间保持很宽
        blocks:
          - type: paragraph
            body: >-
              可比分析不支持轻易乐观。Northvolt 是最尖锐的警告，因为它说明，巨额项目融资和强承购合同并不能让股权免疫于执行失败；事实上，公司在同一个大周期里，从 $5 billion 无追索权融资和超过 $13
              billion 已锁定资本，走到 Chapter 11 保护。ACC 和 PowerCo 从另一个角度强化了这一点：当 EV
              需求不及预期或良率仍然混乱，即便背后支持很强的欧洲电芯项目，也会削减站点、放弃项目，或回到市场再拿外部资本。在这样的同行背景下，上市电池技术可比公司有用，不是因为它们完全匹配，而是因为它们揭示了今天市场对投机型电池股权的胃口。QuantumScape
              仍有数十亿美元公开市值，但 Solid Power、SES AI 和 Enovix 要低得多。Verkor 可以合理主张相对纯实验室阶段同行享有溢价，因为它拥有真实工业资产和 Renault
              需求；但这个同行集仍暗示，任何高于约 €4-5 billion 的未规模化 Verkor 股权价值，已经偏向可想象公开股权区间的顶部。也就是说，当前估值讨论仍落在情景判断里，而不是事实判断里。
