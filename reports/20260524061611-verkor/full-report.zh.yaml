      - number: '2.2'
        title: 规模测算视角与 Verkor 相关情景
        blocks:
          - type: paragraph
            body: >-
              公开证据支持几种有用的规模测算视角，而不是一个英雄式 TAM 数字。ACEA 2025 年注册数据发布显示，BEV 在 2025 年上半年占比 15.6%，截至 11 月为 16.9%；EAFO 2026
              年初信号则指向主要市场恢复增长。Commission 电池页面称，到 2030 年全球电池需求可能增长十四倍，EU 占其中 17%；储能来源显示电芯需求还有第二股拉力：欧洲 2025 年新增 27.1 GWh
              电池储能，已装机规模达到 77.3 GWh，到 2026 年底公用事业级容量可能约 43 GW。这些数字仍远小于拟建中的电芯制造供给管线。European Battery Tracker 显示 2030
              年被跟踪的超级工厂产能约 1.5 TWh；MDPI 风险模型则把已宣布铭牌产能放在 2.2 TWh 以上，并明确警示并非所有项目都会落地。在这个背景下，Verkor 16 GWh
              一期对单一新进入者有意义，但在欧洲已宣布供给雄心中仍只是低个位数份额；所以承购质量比管线标题规模更重要。
