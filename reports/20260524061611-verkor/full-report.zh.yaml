        - 估值区间要放宽；形成价格确信前，必须做私下尽调。
      - - 风险评级
        - 高
        - 电芯爬坡仍然吃资本、受良率牵动，也容易再触发融资需求。
        - 敞口按下行不对称性来配，不要按叙事动能来配。
      - - 估值立场
        - 偏高
        - 公开材料能支撑这是有价值的工业资产，但不能支撑股权显然便宜。
        - 不要为不透明支付溢价。
      - - 继续跟踪的支撑
        - Renault 承购、已投产的超级工厂、EIB/公共资金支持以及无追索项目融资。
        - 这些因素让平台仍然可信。
        - 应该盯执行，而不是直接否定公司。
      - - 什么会改善判断
        - 2026 年交付顺利、客户更分散、资本结构更透明。
        - 这些证据才能把项目层面的支持转成股权层面的支持。
        - 只有经营证据和融资证据同步改善时，才上调判断。
    notes: 本表将截至 2026-05-24 保留的公开证据转化为股权视角；它不能替代股权结构表、债务契约或工厂良率尽调。
    claimRefs:
