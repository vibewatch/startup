      - number: '5.4'
        title: 成熟度判断与技术差异化边界
        blocks:
          - type: paragraph
            body: >-
              最重要的尽调判断是成熟度，而不是雄心。Verkor 的公开记录支持的状态，是后期调试、连续量产爬坡前，而不是已经证明多客户大规模量产。Dunkirk 工厂在 2025 年 12 月开张，此前已用 Grenoble
              电芯组装模组；到 2026 年 3 月，产线稳定运行并处于最终验证，预计数月内进入连续生产。Alpine 提供了最清晰的伙伴级集成证据，因为它点名 A390 供应链中的 Verkor 电芯和模组。但在
              Renault 和 Alpine 之外，已审阅材料包没有浮现其他具名 2026 年生产客户、已发布认证矩阵或量化商业 KPI。这种集中度让 Renault-Alpine 关系既是资产，也是风险。


              关键来源让「可信工业化计划」和「持久技术护城河」之间的区别更尖锐。Sifted 认为，Verkor 聚焦一座工厂、一个主客户的策略比 Northvolt
              的摊大饼更理性，但也强调欧洲电池新进入者面对残酷的良率学习曲线。同一来源引用 UBS 称 LFP 份额快速上升；ecomotorsnews 则指出能源成本压力、原材料竞争、EV
              需求不确定和亚洲价格竞争。这些批评重要，因为 Verkor
              最强的公开差异化是工业层面的：本地低碳生产、数字可追溯、试点到超级工厂转移，以及报废循环。公开材料包没有显示一种明确披露的化学优势，足以在工业执行滑坡时独立支撑持久溢价。官方材料称未来化学体系和平台正在开发，Sifted
              称公司正在研究 LFP，但两者都未建立起 NMC 导向上市项目之外的当前商业路线图。简言之，Verkor 在制造系统设计和工业编排上看起来更自有，而不是在公开记录中的电芯化学护城河上更自有。
