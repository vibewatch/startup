  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与需求底部
        blocks:
          - type: paragraph
            body: >-
              不应拿每一欧元电气化支出来测算
              Verkor。可投资市场更窄：欧洲锂离子电芯需求，且这些电芯要通过汽车和固定式储能认证；当买方重视本地供应、战略自主、韧性标准和低碳制造时，额外价值才会出现。这排除了大部分上游采矿和精炼经济、整车、充电硬件，以及非欧洲终端需求。需求侧最重要的事实是，欧洲
              EV 电池消费仍有政策塑造的底部。Commission 保留了 2025–2029 年 CO2 目标，即相对 2021 年基线车队平均减排 15%，即便允许 2025–2027 年均值平滑；独立分析也仍把
              2035 年零 CO2 终点视为投资预期的关键锚。因此，需求不会直线走向确定销量，但比没有约束性车队规则的欧洲更清晰。这对 Verkor 重要，因为一家本地电芯工厂并不需要所有欧洲 EV
              需求转向本地；它只需要足够多 OEM 项目，让认证管线和签约承购保持运转。
