      - number: '8.2'
        title: 融资结构支持完工，不等于给普通股一个干净估值锚
        blocks:
          - type: paragraph
            body: >-
              Verkor 的估值纪律首先要把项目完工支持和普通股价值支持分开。公开资本结构很可观：至少 €850 million 的 C 轮、最高 €600 million 的 EIB 支持、大约 €650 million
              的法国和地区补贴，以及后续约 €1.2-1.3 billion 的无追索权绿色贷款。到 2025 年底，Verkor 称已锁定累计超过 €3 billion
              的资本。这很有意义，也降低了短期项目被放弃的概率。但这套结构中很大一部分是高级、带条件或限定用途的资本。债务提供方承销的是资产完工和合同现金流；公共机构承销的是产业政策和脱碳；Renault
              承销的是供应安全。这些层级都不能干净回答：如果爬坡不及预期，新的普通股投资人到底拥有什么。因此，估值底部更适合表述为「资金足以尝试建设」，而不是「股权值已经投入的资本」。这是支持因素，但不等同于任何未披露入场价格都公平。
