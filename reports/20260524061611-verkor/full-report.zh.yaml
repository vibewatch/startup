      - number: '3.2'
        title: 欧洲同行与 Northvolt 读数
        blocks:
          - type: paragraph
            body: >-
              Northvolt 仍是最重要的同行基准，尽管它在通常商业意义上已不再是活跃直接竞争者。2024 年 11 月，它在美国申请 Chapter 11，以获得约 $245M 紧急融资；2025 年 3
              月，在未能获得可行融资方案后，它在瑞典申请破产。对 Verkor 的重要性不在法律步骤本身，而在 Northvolt
              路径证明了什么。一家公司可以融到巨额资金、吸引蓝筹客户，但只要爬坡复杂度、资本强度和运营纪律同时滑坡，仍会失败。这个教训如今影响每一场关于欧洲新增电池产能的贷款方、客户和公共政策讨论。


              ACC 和 Envision AESC 展示了欧洲内部更相关的两条存活路径。ACC 股东阵容很重，也有一座在运营的法国工厂，但到 2026
              年，它已确定搁置德国和意大利项目，并仍在处理落后于亚洲对手的成本和报废率。Envision AESC 比许多名义上的「欧洲」同行更可信，因为其工厂绑定了具名汽车锚点——Sunderland 的 Nissan，以及
              Douai 围绕 Renault 的工业政策——且公共支持伴随工厂执行而来，而不是取代执行。Morrow 在首批交付仅数周后于 2026 年 5 月破产，再次说明容错空间多薄。FREYR 转向 T1
              Energy、Britishvolt 死在 Northumberland 的工地，以及 Italvolt 转去 UAE，都在强化同一个模式：没有持久资本、客户锁定和运营证明，已宣布产能撑不过欧洲电池融资周期。
