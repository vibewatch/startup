      - number: '3.4'
        title: Verkor 差异化、切换成本与融资可信度
        blocks:
          - type: paragraph
            body: >-
              Verkor 的差异化真实存在，但比泛泛的「欧洲电池冠军」标签更窄。公司有可识别的汽车锚点 Renault 和 Alpine、明确的法国和 EU 支持、EIB 支持的项目融资、带港口接入的 Dunkirk
              工厂，以及位于全球最清洁大型电网之一的法国制造基地。这些要素重要，因为它们直接回应了 Northvolt 之后被放大的两类买方焦虑：融资可信度和供应链主权。Verkor 有理由向 Renault
              邻近客户和对欧洲敏感的客户说明，其电芯碳更低、政治上更一致，也物理上更靠近法国整车组装。


              代价是集中度。第一个具名商业化参照仍是 Alpine A390，这意味着 Verkor 看起来仍更像高质量锚定爬坡，而不是广泛多客户平台。Northvolt 崩塌意味着，投资人和客户不会只因为 Verkor
              宣布未来产能就买单；他们会看连续产出、良率稳定、报废控制，以及把客户基础扩展到单一锚定生态之外的能力。从这个意义上说，Verkor 的竞争对象既是其他公司，也是怀疑。如果 Dunkirk
              证明了稳定连续生产，Renault 锚定和法国国家支持就会成为可信度证据。如果爬坡指标继续不透明，同样的特征会被重新解读为集中度和补贴依赖。竞争结论是：Verkor
              的位置好于欧洲那些已经失败的独立追梦者，但远未与 PowerCo 和亚洲既有玩家施加的执行和成本压力隔绝。
