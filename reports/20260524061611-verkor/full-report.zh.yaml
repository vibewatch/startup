  - id: TV005
    title: 论点破裂与止损触发表
    columns:
      - 触发项
      - 阈值或事件
      - 重要性
      - 行动含义
    rows:
      - - 商业化再次延后
        - 明显晚于当前 2026 年交付计划。
        - 证实可见时间表仍在右移。
        - 将基准情景重置到更接近熊情景的假设。
      - - 多元化之前先引入高级资本
        - 第二客户出现之前，新融资先增加债务或优先权。
        - 客户集中仍高，普通股权下行变得更差。
        - 把融资新闻视作稀释风险，而不是验证。
      - - 客户组合仍只有 Renault
        - 下一轮爬坡阶段仍没有公开第二客户或储能承购。
        - 工厂会过度依赖单一 OEM 生态。
        - 维持较高折现率，避免抬价。
      - - 范围被重切
        - 产能或工厂目标被正式下调，类似 PowerCo 或 ACC 的重置。
        - 表明需求或经济性低于此前预期。
        - 直接转入熊情景框架。
      - - 爬坡经济性不及预期
        - 报废、良率或营运资本需求意味着现金需求远高于预期。
        - 工业证明无法继续转化为股权价值。
        - 要求重新尽调，并从头承销。
    notes: 这些触发项可直接指导组合动作，并刻意绑定可观察的经营或融资事件，而不是泛泛情绪。
    claimRefs:
      - CV012
      - CV026
      - CV028
      - CV043
      - CV044
      - CV049
  - id: TV006
    title: 最终尽调清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 尽调路径
    rows:
      - - 股权结构表和清算瀑布
        - 当前普通股与优先股持有情况、反稀释、投资人权利以及任何高级索偿。
        - 决定新投资人在下行情景中实际拥有什么。
        - 索取最新股权结构表、股东协议和瀑布模型。
      - - 债务包细节
        - 契约条款、抵押/担保包、提款条件，以及任何交叉违约或再融资触发项。
        - 项目融资可以保护贷款人，同时削弱后续股权。
        - 审阅已签署债务文件和契约模型。
      - - 补贴条件
        - 里程碑、追回机制、合规要求以及受赠方义务。
        - 只有公司守得住公共支持，它才有助于估值。
        - 获取 France 2030 和地区补助协议。
      - - 工厂良率与报废
        - 爬坡期良率曲线、报废率、开工率和营运资本假设。
        - 这些变量主导电池爬坡经济性。
        - 审阅工厂仪表盘、质量报告和月度运营包。
      - - 客户多元化
        - 第二家 OEM 或储能管线、合同形式和时间表。
        - 降低 Renault 集中度，并支撑终值。
        - 审阅已签署 LOI、承购合同和销售漏斗。
      - - 单位经济性
        - 电芯层面的毛利率、转换成本和规模化后每 GWh capex。
        - 要把工业证明转成估值框架，必须有这些数据。
        - 索取管理层模型和独立技术尽调。
    notes: 这些是最低要求，才能把本章从基于公开证据的估值框架，推进成可投资的承销备忘录。
    claimRefs:
      - CV019
      - CV043
      - CV044
      - CV050
      - CV051
