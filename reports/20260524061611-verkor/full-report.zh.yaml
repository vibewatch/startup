      - number: '2.3'
        title: 买方、本地化与采用路径
        blocks:
          - type: paragraph
            body: >-
              买方结构重要，因为 Verkor 不是在卖给一个抽象的「欧洲 EV
              市场」。在汽车领域，实际客户是一套车辆平台、采购和合规体系，必须基于成本、化学体系、可靠性和供应安全来认证电芯。在储能领域，买方更多是公用事业、开发商、集成商或
              EPC，关心项目可融资性、时长经济性，以及本地含量或韧性评分。欧洲政策越来越在这些决策点奖励本地化。Net-Zero Industry Act 在依赖进口组件较高的地方加入韧性标准，Batteries
              Regulation 则把该行业界定为关乎自主和循环性的战略部门。这不意味着欧洲工厂会自动赢。它意味着，当采购被政策、电力系统韧性或客户对低碳供应的需求塑造时，本地生产商会有分量。Verkor 在 Dunkirk
              的选址逻辑——电力接入、物流和靠近客户——符合这一逻辑。对一家新电芯工厂而言，采用路径因此是一串顺序：监管托住需求，承购获得提名，电芯通过认证，工厂爬坡，之后买方才会把这种供应视为可规模化融资。
