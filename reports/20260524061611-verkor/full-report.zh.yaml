  - id: TM005
    title: 增长驱动与约束表
    columns:
      - 驱动因素 / 约束
      - 方向
      - 时间
      - 含义
      - 尽调问题
    rows:
      - - 2025–2029 年欧盟 CO2 目标未变
        - 正向
        - 当前
        - 即便存在临时平均计算灵活性，仍守住 EV 需求底线
        - 核查哪些 OEM 平台仍需要欧洲本地电芯，而不是进口电池包
      - - 2035 年零 CO2 路径的可信度
        - 若维持则正向 / 若削弱则负向
        - 当前至中期
        - 塑造董事会层面对电池和 EV 制造投资的信心
        - 压力测试：若 2035 信号转弱，客户是否仍愿意承诺采购量
      - - 固定式储能市场增长
        - 正向
        - 当前至中期
        - 在乘用 EV 之外，为电芯创造第二市场
        - 厘清欧洲储能建设有多少会采购欧洲电芯，而不是进口电芯
      - - NZIA 韧性和支持计划标准
        - 正向
        - 当前
        - 在受筛选采购中，可改善本地化供应的商业理由
        - 识别哪些目标客户会真正受到韧性标准影响
      - - 关键原材料依赖
        - 负向
        - 结构性
        - 限制欧洲电池供应链真正能有多自主
        - 按化学体系梳理 Verkor 的材料采购和精炼风险敞口
      - - 欧洲各地电价差异
        - 混合
        - 当前
        - 电力成本差异仍大，选址依然重要
        - 将 Dunkirk 电力条款与波兰、匈牙利和北欧对标
      - - 亚洲在位厂商运营规模
        - 负向
        - 当前
        - LGES、SK 相关产能、Samsung SDI、CATL 和 BYD 加大价格与执行压力
        - 识别哪些对手已在 Verkor 目标 OEM 处拿到认证产量
      - - 中国电池价格优势
        - 负向
        - 当前
        - 即便欧洲希望本地供应，低成本进口仍会压缩利润率
        - 估算买家愿为本地、低碳供应支付的溢价
      - - 针对中国制造 BEV 的关税
        - 混合
        - 当前
        - 关税可减缓整车进口压力，但补不上欧洲电芯成本差距
        - 评估 OEM 本地化决策是否真的因关税而改变
      - - 已宣布电池超级工厂的产能过剩和项目承压
        - 负向
        - 当前至 2030 年
        - 铭牌产能管线可能跑赢需求，挤压资本回报
        - 用现实可落地的产能情景校验 Verkor 爬坡计划，而不是对照新闻标题
      - - 混动车韧性和 EV 渐进转型
        - 负向
        - 当前
        - 汽车需求在改善，但速度还不足以从容吸收所有已宣布项目
        - 建模 EV 份额增长慢于政策制定者预期的下行情景
    notes: 本表同时列出需求驱动和逆风，因为 Verkor 的市场结果取决于两件事：政策支持，以及欧洲能否把支持转化为具备成本竞争力、真正落地的本地供应。
