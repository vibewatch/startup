      - number: '1.4'
        title: 里程碑、工业执行与风险语境
        blocks:
          - type: paragraph
            body: >-
              里程碑记录足以证明真实交付，但也说明 Verkor 仍是一个执行故事。公司 2020 年成立，2021 年与 Renault 绑定，2022 年初选址 Dunkirk，2023 年中开设 Grenoble
              Innovation Centre，2023 年底为 Dunkirk 奠基，2024 年完成绿色债务，2025 年底为超级工厂揭幕，2026 年 3
              月进入最终验证。对一家欧洲电池初创公司而言，这是有分量的进展。与此同时，独立和公共融资来源都明确强调，超级工厂规模化很脆弱。EIB 材料描述 Verkor 这类项目面临技术、市场和建设风险，尤其当 EV
              需求和原材料价格波动时。Reuters 关于 Northvolt 危机的报道把警示放大：生产问题、EV 需求放缓和中国竞争压力，已经削弱欧洲电池雄心。因此，工厂开张并不代表 Verkor
              已经去风险。它仍要把一个融资充足的建设和调试故事，转化为能为 Renault 和后续客户重复交付的连续产出。公开记录在资本、工厂完工和治理成熟上令人鼓舞，但概览结论应保持克制：Verkor
              如今看起来是一家真实工业公司，但其估值和下行仍取决于下一阶段的大规模制造执行。
