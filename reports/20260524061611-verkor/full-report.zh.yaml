      - number: '7.4'
        title: 补贴依赖、政策条件和融资契约风险
        blocks:
          - type: paragraph
            body: >-
              Verkor 的融资结构支持力度异常强，但也带着那类可能放大下行的政策依赖。European Commission 批准了一笔 €659 million 的法国补助，期限到 2026 年底，并附带追回和
              know-how 共享条件。另一个层面，2024 年绿色融资包被设计成无追索权债务，并围绕 EU Taxonomy 对齐和「Dark
              Green」外部评审来营销。这些事实重要，因为项目并非单纯靠股权融资；它被国家援助逻辑、贷款方尽调和绿色贷款纪律包裹。公开材料没有披露实际贷款契约阈值、完工测试或提款机制，所以投资人无法判断 Dunkirk
              在融资灵活性收紧前能承受多少表现不及预期。这种不透明应被当作真实风险，而不是文件细节的麻烦。Verkor 也是 France 2030 / IPCEI
              在公正转型地区的展示项目，因此补贴或政策变化会同时带来政治和财务后果。支持降低了立即失败的概率，但也让公司暴露在可独立于电芯质量或 Renault 需求而变化的政策条件之下。
