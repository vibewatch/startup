      - 具体尽调路径
      - 投资判断影响
    rows:
      - - 收入和毛利率披露
        - 需要这些数据，才能把承购和首批交付转成盈利视角
        - 已审阅的官方或监管文件来源均未披露收入或毛利率
        - 索取月度收入桥、按产品拆分的毛利率，以及客户集中度明细
        - 收入质量仍未得到证明。
      - - 现金、烧钱速度和债务偿付
        - 需要这些数据，才能判断爬坡延误时的现金跑道和契约压力
        - 已融资金额公开，但流动性和还款时间表未公开
        - 索取资金看板、债务偿付时间表和下行情景流动性模型
        - 资本充足性仍只能推断。
      - - 合同定价和照付不议条款
        - 需要这些条款，才能把 GWh 承诺转成收入和毛利
        - 公开信息只有量级或定性的承购支持
        - 索取客户合同或管理层认证的经济性摘要
        - 单位经济性还无法尽调定案。
      - - 50+ GWh 扩建审批包
        - 需要审批包，才能衡量未来稀释或债务依赖
        - 公开信息只有据报道的 €2bn 下一步概念
        - 索取已批准的扩建材料、资金来源与用途，以及需求门槛
        - 扩建融资风险仍然重大。
      - - 电池监管落地计划
        - 需要该计划，才能量化 2026 年之后的合规成本和执行负担
        - 监管义务公开，但公司落地预算未公开
        - 索取电池护照、尽职调查和碳足迹合规路线图
        - 若漏算合规成本，利润率路径可能被高估。
    notes: 这些缺口最影响投资判断。问题不在融资曝光不足，而在缺少经营和契约数据；没有这些数据，就无法把融资转成可信的回报路径。
