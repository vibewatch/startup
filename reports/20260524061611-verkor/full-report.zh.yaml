      - number: '7.3'
        title: Renault 集中度与 EV 需求周期
        blocks:
          - type: paragraph
            body: >-
              公开披露的需求能见度几乎全部系在 Renault 上。这份长期协议覆盖每年 12 GWh、面向 Renault 高端车型，第一批高曝光项目仍是 Alpine。Renault 还出现在 Verkor
              的融资故事里：它既是早期股东，也是管理层用来向其他资金方证明投资逻辑的锚定合同。因此，Renault 集中度是本章最清晰的商业依赖。欧洲 EV 周期又放大了问题。EAFO 的电池价格摘要提到，部分地区 EV
              需求放缓，法国和德国补贴削减早于预期；与此同时，电池价格整体崩落，意味着一旦上市延误，OEM 有更大筹码重新谈价或双源采购。Verkor
              最终或许能多元化，但已审阅的公开记录没有披露另一份同等规模的承购关系。因此，任何 Alpine 延误、认证问题，或高端 EV 需求弱于预期，都会在 Dunkirk 仍需要证明稳定产出的时候打击产能利用率。
