        title: 供给压力、经济性与反向背景
        blocks:
          - type: paragraph
            body: >-
              欧洲本地化推动是真实的，但供给侧已经拥挤，经济性仍很苛刻。ACEA 称 EU 仍只占全球电池产量 7%，多数上游产能和精炼仍集中在欧洲之外。Bruegel 说明，在新的法国产能到来之前，竞争格局已经很激烈：LG
              Energy Solution、SK 相关产能和 Samsung SDI 已主导欧洲运营中的电芯产出，仅 LG 的 Wrocław 工厂就很大，CATL 的 Debrecen
              项目可能成为区域最大工厂。政策回应部分是防御性的。EU 已对中国制造 BEV 加征关税，但这些关税针对的是整车，而不是完整电池链。与此同时，更便宜的中国电池价格、低成本 LFP
              化学体系扩散、欧洲电价不均，以及大量项目仍仅停留在规划或已陷入困境的管线，都在压低利润率。Verkor 受益于 Dunkirk
              的物流和电力位置，但其扩张逻辑仍取决于它能否在欧洲已宣布产能开始为同一需求池过度竞争之前，把本地化优势转化为持久的成本和认证优势。
