  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 融资结构与交易对手画像
        blocks:
          - type: paragraph
            body: >-
              对一家私有工业初创公司而言，Verkor 的融资时间线异常丰富，而且模式比任何单轮融资更重要。公司从 2021 年 €100M 战略轮，走到 2022 年超过 €250M 的创新中心融资包，再到 2023 年 9
              月超过 €2B 的一揽子融资，随后在 2024 年 5 月完成超过 €1.3B、以项目为导向的绿色债务。投资人组合也不是典型风险软件资本：早期股权和工业支持方包括 Renault、EQT Ventures、EIT
              InnoEnergy、Schneider Electric、Capgemini、Arkema 和 Tokai COBEX；后续轮次加入 Macquarie、Meridiam、Crédit Agricole
              Assurances 和 FSP，同时伴随公共机构和出口担保。Renault 既是客户又是股东，最新贷款方评论清楚表明，这种双重角色是融资逻辑的核心。它改善可融资性，但也把商业敞口集中到一个锚定 OEM
              和一次工厂爬坡上。
