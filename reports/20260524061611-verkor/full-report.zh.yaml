      - number: '5.2'
        title: 制造栈、数字控制与工厂运营模式
        blocks:
          - type: paragraph
            body: >-
              Verkor 披露的运营模式是一条两地工业化管线。Grenoble 承载 VIC，集合研发、一条 100–150 MWh 试点线和员工培训；Dunkirk 则是 16 GWh 工业基地。官方和 EIB
              材料显示，试点线不是实验室陈列品：它 24/7 运行，已生产数万颗电芯，并在 Dunkirk
              开始生产自有电芯前，为模组组装提供初始产量。这很重要，因为它把公司的制造叙事锚在真实试点生产和工艺转移上，而不是未来超级工厂的纯效果图。2026 年 3 月更新随后把 Dunkirk
              放在最终验证阶段：调试和产线平衡已完成，并已实现连续线运行，但仍没有声称成熟连续生产已经完全建立。


              最强的公开差异化在制造控制栈，而不是已披露的化学突破。Verkor 描述了一套自研数字架构，管理产品、工艺和材料数据，以支撑可追溯性和工业表现。AGATHE 项目增加了更具体的一层：AI
              驱动的工艺优化、预测性维护，以及面向生产报废的现场预回收循环。European Commission 的国家援助决定独立确认，Verkor
              的研发计划覆盖电极自动化、数字化化成、材料回收和试点线设计。从业者信号也说明这是真实工厂工作，而不只是品牌包装。当前招聘覆盖电极工业化、化成、模组工艺工程、计算机视觉、数据科学、维护方法，以及一个高级自动化岗位，要求
              PLC/HMI、机器人、OPC UA、MES 接口和工业网络。一个注意点是，BIMS® 和 DROPS®
              等品牌系统主要出现在二级行业报道中，因此这些名称和内部架构应被视为公司描述，而不是有深度公开文档支撑的技术模块。
