  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义、化学平台与用例范围
        blocks:
          - type: paragraph
            body: >-
              Verkor 的公开产品故事在品类层面清楚，在规格层面克制。官方页面、融资材料和 Dunkirk 揭幕资料包都一致把公司描述为低碳锂离子电芯供应商，由 Grenoble Verkor Innovation
              Centre（VIC）开发电芯和模组，再由 Dunkirk 超级工厂工业化。第一个明确商业路径是汽车：Renault 承诺为高端车型承购，Alpine 表示 A390 使用 Dunkirk 生产的 Verkor
              电芯和模组，并在 Douai 组装成电池包。这是电芯和模组供应的具体证据，但不能证明 Verkor 自己拥有完整电池包或系统业务。


              精确化学体系更不透明。官方材料没有发布正极配方、镍比例、商业数据表或上市电芯物料清单。独立来源仍大体指向 NMC 类解读，因为 Verkor 定位于更高能量的高端 EV 应用；但已审阅材料包并不能独立证明具体是
              NMC811。公开第三方描述在形态和化学细节上也分歧，一处指向软包和圆柱 NMC 电芯，另一处则用面向高端 EV 的高密度 LFP-NMC 表述。尽调安全的结论是，Verkor 当前商业项目最适合理解为面向高端
              EV 的高性能、NMC 导向锂离子电芯平台；确切商业化学体系变体和形态仍未公开披露。更广的固定式储能和非公路应用出现在定位材料中，但没有成为具名的 2026 年商业部署。
