      - number: '3.3'
        title: 亚洲既有玩家与 OEM 支持的规模竞争者
        blocks:
          - type: paragraph
            body: >-
              Verkor 真正的经济上限由亚洲玩家和 OEM 支持平台设定，而不是最弱的欧洲初创项目。2025 年，CATL 和 BYD 合计占全球 EV 电芯产量超过一半；2026 年 Q1，CATL
              单独在中国国内产量份额超过 50%。CATL 的 Debrecen 项目、LG Energy Solution 的 Wroclaw 基地、Samsung SDI 的 Göd 布局，以及 SK On
              在匈牙利的多工厂存在，都说明规模竞争者已经嵌入欧洲工业地理。BYD 作为欧洲电芯工厂直接同行的意义较小，但作为一个证明点很重要：无钴 LFP 产品和电池 + 整车一体化经济性继续压缩行业利润率。


              PowerCo 是最相关的「欧洲」规模基准，因为它把 Volkswagen 的内部需求，与 NMC、LFP 以及最终固态的化学体系灵活性结合起来。一旦 Salzgitter 投产，PowerCo
              就不再是计划，而是任何想争取 OEM 钱包份额的欧洲电芯制造商都要面对的活基准。LG Energy Solution 和 Samsung SDI 也在调整，推动 LFP
              项目以缩小与中国的成本差距，同时守住西方车企关系。对 Verkor 的实际含义很刺眼：拼价格和成熟大批量制造，它打不过 CATL/BYD；拼内部绑定需求，它打不过
              Volkswagen/PowerCo；拼多客户既有关系，它起步落后于 LGES 和 Samsung。Verkor
              因此必须靠更窄的一组要素取胜——法国位置、低碳制造、主权支持，以及足够执行证明，让市场愿意为一个欧洲替代方案付溢价。
