  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重程度排序的风险概览与 Northvolt 可比案例
        blocks:
          - type: paragraph
            body: >-
              Verkor 的核心风险不是缺资本或缺政治支持，而是能否在 Renault 的 Alpine 项目需要电芯之前，把一个高度补贴、重融资的法国电池项目变成稳定量产。公司已通过股权、补贴、EIB
              支持债务和绿色项目融资累计获得超过 €3 billion，但这些资金增加了执行压力，而不是消除了压力，因为这套资本结构现在必须由商业产出来证明。Northvolt 2024 年 11 月的 Chapter 11
              申请是最强的反向可比案例：它说明，一家欧洲电池冠军即使拿到蓝筹 OEM、公共支持和紧急 DIP 融资，只要产能爬坡滞后、客户信心崩掉，仍会失败。Verkor 比当时的 Northvolt
              更早期，但可比性重要，因为同一条失败链在这里以更温和的形式可见：客户基础窄、调试窗口紧、政策支持重、实际产线良率公开证据有限。因此，风险热力图把工业爬坡、Renault 集中度和价格压缩排在剩余法律风险之前。
