  foundingLocation: Grenoble, France
  headquarters: Grenoble, France
  productSummary: >-
    Verkor 为电动汽车开发和制造锂离子电芯与模组，并有选择地覆盖固定式储能应用。其运营模式把 Grenoble 的研发、试点生产、工艺验证和客户认证，与 Dunkirk 超级工厂的连续电芯生产连接起来；首批商业电池目标是 2026
    年供应 Alpine。
  customerFocus: 以 Renault 和 Alpine 为代表的欧洲 EV OEM，以及更长期的出行和固定式储能客户；Verkor 需要通过长期工业项目认证电芯，而不是靠现货销售拿单。
