      - number: '7.5'
        title: 竞争性定价、原材料、许可和劳动力风险
        blocks:
          - type: paragraph
            body: >-
              外部市场背景对任何仍在自证的欧洲电芯项目都很不友好。欧盟贸易主管机关认定中国补贴威胁伤害欧盟生产商，但反补贴税没有消除核心问题：中国仍在为整个市场设定成本方向。EAFO 对 BloombergNEF
              数据的摘要称，2024 年电池包价格下跌 20%，至 $115/kWh；中国电芯产量足以覆盖全球需求的 92%，同时 EV 需求放缓，法国和德国又提前削减补贴。CNBC 关于 CATL
              的报道还显示，欧洲本身就是中国扩张的下一个目标；MarketsandMarkets 仍把 CATL、BYD 和 LG Energy Solution 列为塑造该地区的主要玩家。Verkor
              必须迅速把原材料和本地化叙事转化成真实成本保护。但已审阅的公开材料没有披露长期锂、镍、石墨或前驱体合同；本地扩张也已通过 ZGI3 把许可和公共讨论问题推到台前。再加上需要在一个争夺专业人才的电池谷招聘约
              1,200 名直接员工，即使第一座工厂达到量产，剩余敞口仍然很高。
