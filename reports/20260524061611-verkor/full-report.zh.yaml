companyProfile:
  summary: >-
    Verkor 是一家法国电芯制造商，2020 年 7 月创立于 Grenoble，如今正从 Grenoble 的试点和创新活动，扩到 Dunkirk
    超级工厂的工业化生产。公司定位是欧洲低碳电池冠军，服务电动汽车和固定式储能；Renault 既是锚定客户，也是战略股东，背后还有 Macquarie、Meridiam、EIT InnoEnergy 以及法国公共支持工具等出资方。到
    2026 年 5 月，公司已有一座 16 GWh 工厂投产，股权、补贴和项目融资合计锁定超过 €3B，长期扩产目标为 50 GWh；但它仍处在关键的连续量产爬坡期，良率、客户集中度和资本结构不透明仍主导投资判断。
  foundedDate: '2020-07-01'
  founders:
    - name: Benoit Lemaignan
      role: 联合创始人兼 CEO / 总裁
      background: 融资、工业战略和伙伴管理的发起者与公众面孔。
      claimRefs:
        - CO011
    - name: Christophe Mille
      role: 联合创始人兼执行技术顾问
      background: 早期 CTO；随着 Verkor 走向工业化，如今更像承担技术顾问角色。
      claimRefs:
