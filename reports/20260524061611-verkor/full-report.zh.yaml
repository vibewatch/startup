      - number: '7.2'
        title: 建设、调试、良率爬坡和技术成熟度
        blocks:
          - type: paragraph
            body: >-
              Verkor 的官方叙事令人鼓舞，但仍是公司自报。公司 2025 年 12 月为 Dunkirk 揭幕，称 Alpine 的首批电池计划在 2026 年交付，并在 2026 年 3 月 30
              日称，量产前数月，产线已完全优化、稳定并连续运行。这些进展重要，但没有回答关键投资问题：这些里程碑背后的良率、报废率和客户认证指标到底是多少？已审阅的公开来源没有独立汽车认证数据、没有缺陷率披露，也没有外部验证的生产良率。这一缺口本身不等于技术失败，却意味着投资人仍主要靠公司和贷款方沟通来承销制造学习曲线。由于同一批公开材料还把商业化系在
              2026 年 Alpine 上市上，可见的进度缓冲有限。现实上，Verkor 必须同时完成量产爬坡、把质量稳定住，并避免 Northvolt
              式的设备就绪与经济可接受产出之间的落差。风险传导图显示，良率失手会直接传导到贷款契约、产能利用率和估值压力。
