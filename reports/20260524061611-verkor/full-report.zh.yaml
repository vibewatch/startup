      - 商业模式
      - 成本 / 定价姿态
      - 战略支持
      - Verkor 读数
    rows:
      - - Verkor
        - 面向 Renault / 欧洲 OEM 的外部供应商
        - 电芯价格未公开；定位是低碳欧洲溢价，而不是最低成本
        - Renault 锚定，法国 / EU 支持，EIB 债务
        - 若 OEM 足够看重主权低碳供应、愿意支付高于亚洲成本底线的价格，Verkor 才能赢
      - - ACC
        - 面向股东和车企客户的 JV 供应商
        - 据报道，法国成本高出 CATL/BYD 20-25%，报废率 15-20%
        - Stellantis / Mercedes / TotalEnergies
        - 即便有规模伙伴，欧洲工厂要缩小成本差距也很难
      - - Envision AESC
        - 具名车企供应模式
        - 融资和工厂建设绑定 Nissan 项目；公开价格未披露
        - 英国支持债务 + 法国国家援助
        - 绑定客户的融资比投机性商用产能更容易获得银行支持
      - - PowerCo
        - 自用内部电池部门
        - 通过 VW 内部需求和标准化电芯优化经济性
        - Volkswagen 资产负债表 + 平台控制
        - PowerCo 不像 Verkor 一样需要获取第三方客户
      - - CATL / BYD
        - 全球商用 + 一体化 OEM 供应
        - 行业成本底线；CATL/BYD 规模让欧洲承受严峻价格压力
        - 大规模、垂直整合、中国政策支持
        - Verkor 无法在原始 $/kWh 上赢过这个队列
      - - LGES / Samsung SDI
        - 既有 OEM 供应商关系
        - 韩国 LFP 项目目标是把与中国产品的价格差压到 10% 以下
        - 成熟西方 OEM 信任和本地制造
        - 这些既有厂商用可接受——不是最低——的成本加已验证交付来防守欧洲
      - - SK On
        - 绑定 OEM 的既有供应
        - 本章没有公开欧洲价格数据；经济性取决于匈牙利制造规模
        - 匈牙利工厂网络和 SK Group 支持
        - 增加本地既有产能，但没有给 Verkor 明确差异化角度
