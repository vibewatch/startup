  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: Renault 是已披露锚定客户，公开证据指向一期高度集中
        blocks:
          - type: paragraph
            body: >-
              Renault Group 是 Verkor 公开客户故事的中心。这段关系强于普通初创公司与 OEM 的试点，因为它结合了股权、技术认证和大规模已宣布供应范围。Verkor 和 Renault
              都把合作描述为长期关系，也都表示 Renault 验证了从 Grenoble 创新中心到 Dunkirk 超级工厂的产品、经济性和工业化路径。披露的年度承购量为 12 GWh，用于 Renault Group
              高端车型；Verkor 首座工厂起步为 16 GWh。这意味着在 Verkor 公开点名更广商业客户名单之前，一期产能约四分之三已经由一个客户家族预定。第一个披露的上市项目，已经从早期 Alpine
              电动跨界车计划，演进到 2026 年 Alpine A390 商业化里程碑；Alpine 现在描述的电池，其电芯和模组来自 Dunkirk，并在 Douai
              组装。这对年轻电池制造商而言是异常具体的证明，但也意味着客户章节的起点是集中，而不是多元化。
