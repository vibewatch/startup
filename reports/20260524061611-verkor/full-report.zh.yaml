            body: >-
              这些来源显示，Verkor 的商业模式更像航天式认证，而不是大宗商品现货销售。公司必须先在 Grenoble 设计并验证电芯，再把工艺 know-how 转移到 Dunkirk，稳定制造，最后赶上 Renault
              和 Alpine 车型项目的上市窗口。公开证据显示进展是真实的：VIC 试点线已连续运行，产出数万颗电芯，并向客户提供了初始批量；Dunkirk 站点在自制电芯前已先组装模组；到 2026 年 3
              月，Verkor 称调试和产线平衡已经完成，产线稳定，工厂进入最终验证。外部报道还补充说，D-sample 已交付 Renault，随着站点爬坡，成品预计会开始流向 Renault
              工厂。这是实打实的客户验证，因为产品已经挂到具名 OEM 项目上；但它也解释了收入时点为什么脆弱。电池初创公司即使签下客户，只要认证延误、产线平衡拖长，或整车平台上市推迟，经济性仍可能落空。
