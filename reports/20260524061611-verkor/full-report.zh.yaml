      - number: '6.4'
        title: 耐久性仍是最大未解问题，因为客户集中、化学路线多元化和规模风险都已显现
        blocks:
          - type: paragraph
            body: >-
              反向情景并不是 Renault 现在缺乏承诺，而是 Verkor 的公开客户基础太窄，投资人若没有私下尽调，无法承销其耐久性。Sifted
              把这套策略概括为一座工厂、一个主客户、一款主产品、一个地点。Macquarie、Automotive World 等融资方明确把第一座超级工厂的可融资性系在 Renault
              合同上；这有利于短期融资，却也强化了对单一 OEM 集团的依赖。外部竞争和 Renault 自身的多元化路径又放大了风险。Sifted 称 Renault 从 2026 年起会增加 LG Energy
              Solution 和 CATL 的 LFP 供应；Ampere 也公开探索与 Stratus、Basquevolt 合作的无钴和锂金属下一代电池。France 24 和 Journal Auto
              给出第二个警示：欧洲新建超级工厂的爬坡仍依赖海外 know-how，运营上可能很乱。公开来源没有披露续约指标、多客户积压订单，也没有精确的照付不议经济条款。因此，正确结论不是 Verkor
              没有客户，而是可投资问题在于：它能否在 Renault 集中度和亚洲既有供应商压力主导结果之前完成多元化。
