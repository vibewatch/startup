          - type: paragraph
            body: >-
              即便 Verkor 执行好工厂爬坡，经营环境仍然严苛。欧洲电池制造仍面对低于预期的 EV 需求增长、激烈中国竞争、技术学习风险，以及 Northvolt
              在规模、成本和需求问题混合压力下崩塌的新鲜记忆。Verkor 的答案——先一个客户、一个产品、一座工厂，再扩张——比 Northvolt 多线并进更克制，但没有消除核心工业挑战：在一条重资本 NMC
              产线上把良率推高到足以赚取利润率。监管又加一层压力。EU 电池制度从 2026
              年起带来尽职调查、碳足迹和电池护照式义务，也就是说，在行业经济性完全成熟之前，合规数据系统和可追溯成本就会到来。本章结论因此偏谨慎：Verkor
              已为一家欧洲电池初创公司拼出较强的公开融资结构，但扩张仍看起来依赖融资；决定债务支持规模能否转化为持久回报的关键指标，仍不透明。
