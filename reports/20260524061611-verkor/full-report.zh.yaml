      - number: '1.3'
        title: 资本形成、锚定关系与公共支持
        blocks:
          - type: paragraph
            body: >-
              作为一家私有工业初创公司，Verkor 的资本形成异常可见，也是后续章节能复用本概览作为事实底座的最强理由之一。2021 年 Renault 合作不只是验证技术；它让 Renault 成为持股超过 20%
              的股东，并把电池需求绑定到 Renault 和 Alpine 项目。这个早期锚定关系之后，公司在 2021 年 7 月完成 €100M 轮融资，2022 年为 VIC 获得超过 €250M 的追加融资，2023
              年围绕 Dunkirk 启动获得超过 €2B 的一揽子融资，并在 2024 年 5 月再获得超过 €1.3B
              的绿色融资。公开和伙伴披露始终呈现出混合支持结构：战略工业支持方、基础设施和能源转型基金、商业银行、公共贷款方以及直接国家援助。Macquarie 领投 2023 年 Series C，Meridiam
              取得重要股权，EIB 支持扩大为 €400M 方案，Bpifrance 支持的担保托住债务结构，European Commission 还单独批准 €659M 法国国家援助，支持 Verkor 的研发计划至
              2026 年底。伙伴生态在概览层面也重要：InnoEnergy、Schneider Electric、Plastic Omnium、EDF，后来还有 EnerSys 和 ING，说明 Verkor
              拼出的不只是客户故事，而是一套工业联盟。缺口也清楚存在：公开材料仍不披露估值、收入或完整当前股权结构表。
