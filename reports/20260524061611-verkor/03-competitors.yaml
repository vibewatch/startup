- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Verkor moat claim
  - Threat vector
  - Evidence
  - Severity
  - Mitigation / diligence ask
  rows:
  - - Renault anchor proves demand
    - Anchor becomes concentration risk if broader customer set stays undisclosed
    - First named 2026 commercialization is Alpine A390
    - High
    - Track whether Dunkirk wins non-Renault offtake before full-capacity financing needs return
  - - French / EU state backing improves survivability
    - Support can be reframed as subsidy dependence if ramp metrics stay opaque
    - State aid, EIB support, and France 2030 backing are clear; serial yield data is not
    - High
    - Request lender-style ramp KPIs, yield trend, scrap rate, and qualification milestones
  - - Low-carbon France base is differentiated
    - Carbon advantage does not solve the cost gap versus CATL/BYD
    - France is ~95% low-carbon power in 2025, but Asian incumbents still dominate cost and scale
    - Medium
    - Sell premium on sovereignty/carbon to OEMs that cannot or will not source from China
  - - Dunkirk port site supports logistics
    - PowerCo/AESC/ACC also have proximity and OEM integration advantages
    - EIB notes imports/exports to Renault factories; AESC and PowerCo have even tighter captive demand loops
    - Medium
    - Convert logistics advantage into explicit service-level commitments and lead-time proofs
  - - Europe now wants another local champion after Northvolt
    - Northvolt collapse raised—not lowered—the proof burden on every new project
    - Northvolt moved from Chapter 11 to Swedish bankruptcy within months
    - Critical
    - Treat every financing and customer discussion as a manufacturing-execution audit
  - - European startup scarcity creates whitespace
    - Legacy failures prove whitespace does not equal viable economics
    - Britishvolt, Italvolt, FREYR, and Morrow all failed or pivoted before durable scale
    - High
    - Preserve capex discipline and widen customer mix before expanding beyond validated lines
  notes: Risk register is analytical rather than purely factual. Severity reflects competitive durability for Verkor, not legal or accounting materiality.
