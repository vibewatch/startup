- id: asian-incumbents-and-oem-scale
  title: Asian Incumbents and OEM-backed Scale Competitors
  body: |-
    The real economic ceiling on Verkor is set by the Asian and OEM-backed players, not by the weakest European startup projects. CATL and BYD together accounted for more than half of global EV cell production in 2025, while CATL alone crossed 50% domestic Chinese production share in Q1 2026. CATL's Debrecen project, LG Energy Solution's Wroclaw base, Samsung SDI's Göd footprint, and SK On's multi-plant Hungarian presence show that scale competitors are already embedded in Europe's industrial geography. BYD matters less as a direct European cell-factory peer than as a proof point that cobalt-free LFP products and integrated battery-plus-vehicle economics continue to compress industry margins.

    PowerCo is the most relevant 'European' scale benchmark because it combines captive Volkswagen demand with chemistry flexibility across NMC, LFP, and eventually solid state. Once Salzgitter entered production, PowerCo ceased to be a plan and became a live benchmark for any European cell maker seeking OEM wallet share. LG Energy Solution and Samsung SDI are also adapting, pushing LFP programs to narrow the cost gap with China while keeping Western automaker relationships. The practical implication for Verkor is stark: on price and mature-volume manufacturing it cannot beat CATL/BYD; on captive internal demand it cannot beat Volkswagen/PowerCo; and on multi-customer incumbent relationships it starts behind LGES and Samsung. Verkor therefore has to win on a narrower bundle—French location, low-carbon manufacturing, sovereign backing, and enough execution proof to justify a premium European alternative.
