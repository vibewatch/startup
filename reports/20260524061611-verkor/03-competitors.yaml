  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: verkor-ramp-metrics
    missingEvidence: Public disclosure of Dunkirk serial-production yield, scrap rate, OEE, and customer qualification metrics.
    whyItMatters: Northvolt shifted the market from capacity-story underwriting to ramp-metric underwriting; without those datapoints Verkor's financing credibility remains only partially evidenced.
    diligencePath: Request lender, customer, or management materials covering line yield, scrap trend, validation milestones, and audited production cadence.
    relatedQuestionRefs:
    - QP023
    - QP024
    relatedTableRefs:
    - TP004
  - type: missing-source
    severity: material
    topic: verkor-customer-diversification
    missingEvidence: Named offtake agreements or committed volumes for customers beyond Alpine / Renault.
    whyItMatters: A single-anchor ramp can still be commercially fragile if expansion financing depends on a broader order book than the public record currently shows.
    diligencePath: Seek customer references, procurement disclosures, or financing materials that identify non-Renault contracted volumes and timing.
    relatedQuestionRefs:
    - QP022
    relatedTableRefs:
    - TP003
  - type: missing-source
    severity: minor
    topic: aesc-douai-phase-two
    missingEvidence: Current phase-two timing and broader customer disclosure for Envision AESC's Douai site.
    whyItMatters: Without phase-two timing, the comparison between Verkor and AESC on French scale remains directionally useful but incomplete.
    diligencePath: Look for 2026 Envision AESC France releases, customer sourcing announcements, or French regional filings on Douai capacity expansions.
    relatedQuestionRefs:
    - QP025
    relatedTableRefs:
    - TP002
  - type: stale
    severity: minor
    topic: italvolt-current-status
    missingEvidence: A 2025-2026 primary or top-tier source confirming Italvolt's current legal and operating status in Europe.
    whyItMatters: Italvolt is legacy context rather than a core live competitor, but fresher evidence would tighten the chapter's view of residual European aspirants.
    diligencePath: Search Italian court filings, local business registries, or company statements to confirm whether the Europe vehicle remains active beyond the 2024 crisis coverage.
    relatedQuestionRefs:
    - QP017
    relatedTableRefs:
    - TP002
