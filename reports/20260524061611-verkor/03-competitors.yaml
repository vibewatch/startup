- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Company / cohort
  - Commercial model
  - Cost / pricing posture
  - Strategic support
  - Implication for Verkor
  rows:
  - - Verkor
    - External supplier to Renault/European OEMs
    - No public cell pricing; positioned around low-carbon European premium rather than lowest cost
    - Renault anchor, French/EU support, EIB debt
    - Can win if OEMs value sovereign low-carbon supply enough to pay above Asian cost floor
  - - ACC
    - JV supplier to shareholders and auto customers
    - French costs reportedly 20-25% above CATL/BYD with 15-20% scrap rates
    - Stellantis / Mercedes / TotalEnergies
    - Shows how hard it is for European plants to close the cost gap even with scale partners
  - - Envision AESC
    - Named automaker supply model
    - Funding and plant build tied to Nissan programs; public price not disclosed
    - UK-backed debt + French state aid
    - Customer-linked financing is more bankable than speculative merchant capacity
  - - PowerCo
    - Captive internal battery arm
    - Economics optimized through VW internal demand and standardized cells
    - Volkswagen balance sheet + platform control
    - PowerCo does not need third-party customer acquisition the way Verkor does
  - - CATL / BYD
    - Global merchant + integrated OEM supply
    - Industry cost floor; CATL/BYD scale keeps Europe under severe price pressure
    - Mass scale, vertical integration, policy support in China
    - Verkor cannot win on raw $/kWh against this cohort
  - - LGES / Samsung SDI
    - Incumbent OEM supplier relationships
    - Korean LFP programs aim to keep the price gap with Chinese products under 10%
    - Established Western OEM trust and local manufacturing
    - These incumbents defend Europe with acceptable—not lowest—cost plus proven delivery
  - - SK On
    - OEM-linked incumbent supply
    - No public European price data in this chapter; economics ride Hungary manufacturing scale
    - Hungarian plant network and SK Group backing
    - Adds local incumbent capacity without giving Verkor a clear differentiation angle
