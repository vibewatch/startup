- id: mitigation-and-kill-criteria
  title: Mitigations, Monitoring Indicators, and Thesis-Break Triggers
  body: >-
    Verkor does have meaningful mitigants. The company has already secured a large financing package, anchor demand from Renault, and explicit support from the French state, EIB, and commercial lenders. It is also in a strategically favored French battery corridor, which lowers the odds of being abandoned politically. But these are mitigants for survival, not proof that the investment case is already de-risked. The operative question is whether public support and customer backing can carry the business over the last and hardest manufacturing hurdle: proving repeatable automotive output at the required cost. Investors should therefore treat monitoring discipline as central to underwriting. The most important signals are not broad headlines about sovereignty or financing; they are proof of stable serial production, any sign of Alpine or Renault volume slip, and any evidence that lenders or regulators are escalating scrutiny. If one of those signals breaks the wrong way before Verkor discloses
    a broader customer base or stronger yield evidence, the thesis should be re-underwritten rather than simply held on faith.
  claimRefs:
  - CR006
  - CR017
  - CR019
  - CR024
  - CR038
  - CR043
  - CR044
  - CR045
