  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financing-covenants
    missingEvidence: >-
      Detailed drawdown conditions, debt-service tests, completion tests, reporting covenants, and default triggers for the 2024 green project financing.
    whyItMatters: >-
      A missed covenant or delayed drawdown could force an equity bridge at the same moment the plant still needs ramp capital, magnifying dilution and liquidity risk.
    diligencePath: >-
      Request the common terms agreement, model audit assumptions, and lender technical adviser materials under NDA before underwriting downside cases.
    relatedQuestionRefs:
    - QR011
    - QR031
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: blocking
    topic: yield-and-qualification
    missingEvidence: Independent yield, scrap, first-pass quality, and OEM qualification data for Dunkirk serial production.
    whyItMatters: >-
      Without these metrics investors cannot distinguish between a fast commercialization ramp and a Northvolt-style qualification bottleneck disguised by milestone press releases.
    diligencePath: >-
      Obtain the latest ramp dashboard, OEM PPAP or equivalent qualification status, and third-party technical diligence on the Dunkirk lines.
    relatedQuestionRefs:
    - QR031
    relatedTableRefs:
    - TR002
  - type: missing-source
    severity: material
    topic: raw-material-contracts
    missingEvidence: >-
      Long-term lithium, nickel, graphite, precursor, and recycling-feed contracts plus any price-pass-through or hedging terms.
    whyItMatters: >-
      Raw-material opacity makes it impossible to judge whether Verkor can preserve margin when Asian competitors continue to set lower market-clearing prices.
    diligencePath: >-
      Request the raw-material contract stack, supplier concentration table, and commodity passthrough terms for Renault and any other OEMs.
    relatedQuestionRefs:
    - QR021
    - QR022
    - QR031
    relatedTableRefs:
    - TR002
    - TR003
  - type: access-blocked
    severity: material
    topic: administrative-compliance-notice
    missingEvidence: >-
      Readable full text, legal basis, and remediation status of the prefectural mise en demeure hosted on Georisques for Giga Verkor Immo.
    whyItMatters: >-
      The existence of a formal notice is adverse in itself, but investors need the underlying facts to judge whether it reflects a routine filing gap or a deeper permitting or safety issue.
    diligencePath: >-
      Pull the original prefectural order from local administrative files or request the remediation letter and closure status from management and local counsel.
    relatedQuestionRefs:
    - QR026
    relatedTableRefs:
    - TR001
