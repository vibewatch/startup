callouts:
- calloutType: risk
  title: Northvolt is the cautionary comparable, not a distant anecdote
  body: >-
    Northvolt's November 2024 Chapter 11 shows how quickly a European battery champion can run out of room once ramp delays, customer disappointment, and capital intensity start to interact. Verkor is not in the same distress state, but it is exposed to the same underlying physics of cell manufacturing.
  claimRefs:
  - CR013
  - CR016
  - CR017
- calloutType: recommendation
  title: Treat Renault concentration and covenant opacity as first-day diligence items
  body: >-
    Investors do not need another sovereignty narrative; they need proof that Dunkirk can produce qualified cells on time and clarity on what happens if it cannot. The first NDA request should therefore cover customer concentration, lender tests, and independent yield evidence.
  claimRefs:
  - CR009
  - CR037
  - CR038
  - CR045
