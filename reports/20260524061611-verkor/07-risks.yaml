  title: Regulatory / legal risk register
  type: enumeration
  enumerationScope:
    coverage: partial
    basis: >-
      Covers the highest-severity public policy, permitting, and financing-condition risks visible from reviewed French, EU, and lender materials as of 24 May 2026.
    rationale: >-
      Project-finance covenants and the full text of the prefectural notice remain private or inaccessible, so the register emphasizes the most decision-relevant public exposures rather than a fully exhaustive legal inventory.
  columns:
  - Rule / condition / process
  - Jurisdiction / owner
  - Current status
  - Likelihood
  - Severity
  - Mitigation
  - Residual exposure
  - Diligence path
  rows:
  - - French / EU state-aid grant conditions
    - European Commission / France
    - Approved; runs through end-2026 with claw-back and know-how obligations
    - Medium
    - High
    - Large public backing plus political sponsorship
    - Medium-High — subsidy conditions can tighten flexibility if milestones or returns diverge
    - Review the SA.106361 decision package and subsidy agreement schedules
  - - Green loan / project-finance completion tests
    - 19-bank lender group
    - Debt closed in 2024; public covenant thresholds undisclosed
    - Medium
    - Critical
    - Large diversified lender pool and non-recourse structure
    - High — undisclosed tests could constrain drawdowns during ramp
    - Request common terms agreement, drawdown schedule, and technical adviser reports
  - - Environmental authorization / ICPE regime
    - French state / local authorities
    - Operating and expansion compliance sits under the environmental authorization framework
    - Medium
    - High
    - France has a consolidated authorization process for major industrial sites
    - Medium — future expansion still depends on multi-track environmental approvals
    - Obtain the site’s current authorization set and pending amendments
  - - Administrative compliance notice (mise en demeure)
    - Préfecture du Nord / Georisques
    - Official notice published for Giga Verkor Immo; underlying facts not yet clear from public extraction
    - Low-Medium
    - Medium-High
    - Issue may still be routine if already remediated
    - Medium — unresolved notice details prevent calibration of recurrence risk
    - Pull the full prefectural order and remediation response from local files
  - - ZGI3 public consultation / expansion process
    - Grand Port Maritime de Dunkerque / public consultation
    - Active public debate covers two additional Verkor gigafactories and associated risks
    - Medium
    - High
    - Strong industrial-policy support and territorial framing
    - Medium-High — phase-2 permitting and public acceptance remain open questions
    - Monitor consultation outcomes and any formal follow-on permitting calendar
