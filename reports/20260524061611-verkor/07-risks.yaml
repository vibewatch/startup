- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Serial-production slip
    - Verkor updates, OEM qualification milestones, lender technical reviews
    - Serial production is still not visibly stable by late 2026 or qualification gates move right
    - Re-underwrite volume ramp, request factory access, and haircut near-term utilization assumptions
  - - Renault concentration worsens
    - Alpine launch timing, Renault EV demand data, new offtake announcements
    - No meaningful second customer appears while Renault or Alpine demand softens materially
    - Assume higher customer concentration discount and tighter downside volume case
  - - Project-finance stress
    - Debt drawdown cadence, green-loan compliance language, covenant disclosures
    - Any announced waiver, delayed draw, or covenant amendment during ramp
    - Treat as a balance-sheet warning and test equity-bridge scenarios
  - - Chinese / Asian price pressure intensifies
    - Battery price surveys, CATL/BYD Europe expansion, OEM sourcing moves
    - Battery prices break below expected 2026 path while incumbents add European capacity
    - Tighten long-term margin assumptions and require evidence of defensible cost position
  - - Permitting / administrative risk escalates
    - New prefectural actions, consultation outcomes, expansion filings
    - Further formal notices or contested expansion steps emerge before phase-1 is proven
    - Delay any phase-2 underwriting and increase legal / environmental diligence depth
