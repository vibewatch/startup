  evidenceGaps:
  - type: missing-source
    severity: material
    topic: commercial-cell-spec
    missingEvidence: A released commercial cell datasheet covering cathode ratio, anode chemistry, form factor, capacity, and thermal envelope for the first Alpine-bound program.
    whyItMatters: Without a disclosed datasheet, diligence cannot verify whether the shipped product is conventional NMC, high-nickel NMC811, or another blend, nor how far Verkor’s design differs from incumbent suppliers.
    diligencePath: Request the latest customer-approved cell specification sheet, bill-of-material summary, and sample release package for the first serial product.
    relatedQuestionRefs:
    - QE005
    - QE006
  - type: missing-source
    severity: blocking
    topic: public-performance-and-certification
    missingEvidence: Public or diligence-room evidence for energy density, power capability, fast-charge profile, cycle life, abuse-test results, and product certifications for the commercial cell.
    whyItMatters: Product maturity cannot be underwritten on process language alone; buyers and investors need quantitative performance and certification proof to judge competitiveness and launch readiness.
    diligencePath: Obtain the latest validation report, customer qualification matrix, and any UN38.3, IEC, UL, or OEM abuse-test results tied to the launch cell.
    relatedQuestionRefs:
    - QE018
  - type: missing-source
    severity: material
    topic: stationary-storage-commercialisation
    missingEvidence: Named non-automotive customers, product SKUs, or revenue evidence for stationary-storage or off-highway deployments.
    whyItMatters: Stationary storage appears in positioning materials, but absent named deployments it should not be underwritten as a proven second revenue pillar.
    diligencePath: Ask management for the current non-automotive pipeline, sample status by customer, and any signed offtake or pilot contracts outside Renault/Alpine.
    relatedQuestionRefs:
    - QE007
  - type: missing-source
    severity: material
    topic: end-of-life-and-second-life
    missingEvidence: Operational details for any Veolia or other recycling arrangement, including scope, start date, feedstock type, and whether second-life repurposing is planned or excluded.
    whyItMatters: Scrap recycling at the plant is not the same as an end-of-life battery strategy, and the difference materially affects circularity claims and residual-value assumptions.
    diligencePath: Request the signed recycling memorandum or contract, process map for manufacturing scrap versus end-of-life packs, and any second-life business case documentation.
    relatedQuestionRefs:
    - QE014
