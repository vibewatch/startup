company:
  name: Verkor
chapter:
  number: 5
  title: Product & Technology
  summary: 'Verkor’s strongest product evidence is an industrialization system rather than a fully public chemistry datasheet: Grenoble’s VIC pilot line feeds a digitally controlled Dunkirk gigafactory aimed at low-carbon lithium-ion cells for Renault and Alpine, with scrap pre-recycling, traceability, and French-grid carbon advantages central to the thesis. Public sources consistently point to an NMC-oriented premium-EV launch program, but exact cathode ratio, form factor, performance metrics, and certification detail remain only partially disclosed. As of 2026-05-24 the site appears to be in final validation and pre-serial ramp, so the key diligence question is execution quality, not whether the plant exists.'
sections:
- id: platform-and-product-definition
  title: Product definition, chemistry platform, and use-case scope
  body: 'Verkor’s public product story is clear at the category level and cautious at the specification level. Official pages, financing materials, and the Dunkirk inauguration pack consistently describe the company as a supplier of low-carbon lithium-ion battery cells, with the Grenoble Verkor Innovation Centre (VIC) developing cells and modules and the Dunkirk gigafactory industrializing them. The first explicit commercial path is automotive: Renault committed to offtake for upper-segment vehicles, and Alpine says the A390 uses Verkor cells and modules produced in Dunkirk and assembled into packs in Douai. That is concrete evidence of cell-and-module supply, but not of a full pack or system business owned by Verkor itself.


    Exact chemistry is less transparent. Official materials do not publish a cathode recipe, nickel ratio, commercial datasheet, or a launch-cell bill of materials. Independent sources nevertheless converge on an NMC-class interpretation because Verkor is positioned for higher-energy premium EV applications; yet the reviewed pack does not independently prove NMC811 specifically. Public third-party descriptions also diverge on format and chemistry details, with one source pointing to pouch and cylindrical NMC cells and another to high-density LFP-NMC language for premium EVs. The diligence-safe conclusion is therefore that Verkor’s current commercial program is best understood as a high-performance, NMC-oriented lithium-ion cell platform for premium EV use, while the exact commercial chemistry variant and form factor remain not publicly disclosed. Broader stationary-storage and off-highway exposure appears in positioning materials, but not as named 2026 commercial deployments.'
