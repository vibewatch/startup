summary:
  headline: >-
    Verkor is one of the more credible remaining European battery platforms because it has a live Dunkirk asset,
    Renault-backed demand, and €3B+ of committed capital, but the equity case is still too opaque and
    execution-sensitive for a buy call after Northvolt showed how fast battery-scale optimism can unwind.
