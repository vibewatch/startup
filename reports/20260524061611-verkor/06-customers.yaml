  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: additional-automotive-customers
    missingEvidence: A signed second automotive customer contract or named SOP-bound platform outside Renault / Alpine.
    whyItMatters: Without a second named OEM customer, concentration risk remains the dominant commercial fact and the remaining phase-one capacity cannot be underwritten confidently.
    diligencePath: Request current customer pipeline by stage, signed MOUs or contracts, and any reserved capacity outside Renault.
    relatedQuestionRefs:
    - QU012
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: retention-and-renewal
    missingEvidence: Renewal, repeat-order, defect, and satisfaction metrics by customer program.
    whyItMatters: Battery programs can be strategically important but economically weak; without retention-style metrics, durability cannot be tested publicly.
    diligencePath: Ask for OEM scorecards, repeat-order history, launch-quality metrics, and any post-SOP expansion data.
    relatedQuestionRefs:
    - QU013
    relatedTableRefs:
    - TU004
  - type: missing-source
    severity: material
    topic: multi-customer-backlog
    missingEvidence: A public or private capacity-allocation bridge showing how much of the initial 16 GWh is contracted beyond Renault.
    whyItMatters: Investors need to know whether the non-Renault share is real contracted backlog or only strategic ambition.
    diligencePath: Request customer allocation by GWh, contract stage, and expected ramp year for each named account.
    relatedQuestionRefs:
    - QU018
    relatedTableRefs:
    - TU005
  - type: private-evidence-only
    severity: material
    topic: renault-contract-economics
    missingEvidence: Exact contract tenor, pricing formula, take-or-pay terms, penalties, and indexation for Renault supply.
    whyItMatters: The anchor customer can secure utilization while still leaving Verkor with weak margins or one-sided downside if the economics are unfavorable.
    diligencePath: Review the master supply agreement and customer-specific commercial schedules under NDA.
    relatedQuestionRefs:
    - QU024
    relatedTableRefs:
    - TU004
  - type: missing-source
    severity: material
    topic: stationary-storage-commercialization
    missingEvidence: A named signed stationary-storage customer, pilot, or LOI that moves beyond generic market ambition.
    whyItMatters: Stationary storage is a key diversification narrative, but public evidence currently shows strategy and prototype relevance more than booked demand.
    diligencePath: Request signed pilot agreements, customer references, or a sector split between mobility and storage backlog.
    relatedQuestionRefs:
    - QU025
    relatedTableRefs:
    - TU001
    - TU005
