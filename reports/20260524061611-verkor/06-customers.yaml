- id: durability-switching-risk-and-adverse-context
  title: Durability remains the biggest open question because concentration, chemistry diversification, and scale risk are all visible
  body: 'The adverse case is not that Renault lacks commitment today; it is that Verkor’s public customer base is too narrow for investors to underwrite durability without private diligence. Sifted summarized the strategy as one factory, one main customer, one main product, and one location. Financiers such as Macquarie and Automotive World explicitly tied the bankability of the first gigafactory to Renault’s contract, which is positive for near-term funding but reinforces dependence on a single OEM group. The risk is amplified by external competition and by Renault’s own diversification path. Sifted says Renault is adding LFP supply from LG Energy Solution and CATL from 2026, while Ampere is publicly exploring cobalt-free and lithium-metal next-generation batteries with Stratus and Basquevolt. France 24 and Journal Auto add a second warning: ramping a new European gigafactory still depends on foreign know-how and can be operationally messy. Public sources disclose no renewal metrics, no
    multi-customer backlog, and no exact take-or-pay economics, so the right conclusion is not that Verkor lacks customers, but that the investable question is whether it can diversify before Renault concentration and Asian-incumbent pressure dominate the outcome.'
