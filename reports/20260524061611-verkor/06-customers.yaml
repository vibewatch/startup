tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - segment
  - buyer / user / payer
  - use case
  - scale / disclosure
  - revenue / strategic value
  - gap
  rows:
  - - Renault Group upper-segment EV supply
    - Buyer and payer are Renault Group procurement, Ampere, and brand teams; users are Renault and Alpine vehicle platforms plus end drivers.
    - Long-term low-carbon cell supply for upper-segment EVs.
    - 12 GWh/year publicly disclosed; anchor commercial relationship.
    - Underwrites plant financing and gives Verkor a reference OEM customer.
    - Exact term, pricing, and take-or-pay structure are not publicly disclosed.
  - - Alpine A390 launch program
    - Buyer is Alpine / Renault; user is the A390 platform and its end customers; payer remains Renault Group.
    - First named commercialized vehicle program using Verkor batteries.
    - Commercial batteries planned for 2026; Alpine says cells/modules come from Dunkirk and are assembled in Douai.
    - Turns the Renault partnership into a named production vehicle proof point.
    - Model volumes, mix, and unit economics are undisclosed.
  - - Broader Renault / Ampere future platforms
    - Buyer remains Renault Group entities; users are future upper-segment Renault and Alpine EV platforms.
    - Expansion path from first program to more Renault-family launches.
    - Official sources describe upper-segment vehicles broadly but do not allocate exact model mix.
    - Main land-and-expand opportunity without winning a brand-new OEM.
    - Future platform timing and volume allocation beyond A390 are not public.
  - - EnerSys industrial applications
    - Buyer and payer are EnerSys; users are its industrial-energy customers across multiple end markets.
    - Prototype production of ENS1 lithium-ion cells and a new battery format.
    - Named prototype agreement plus equity investment; no serial offtake disclosed.
    - Best public proof that Verkor can diversify outside Renault passenger EVs.
    - Still prototype-stage rather than a disclosed recurring production contract.
  - - Stationary storage market ambition
    - Potential buyers are utilities, industrial operators, and storage integrators; actual named payers are not disclosed.
    - Strategic market positioning for stationary storage alongside mobility.
    - Repeatedly described in official materials, but with no named signed offtake customer.
    - Important diversification narrative for future plant utilization.
    - Backlog quality and customer names remain opaque.
  notes: The segmentation table separates disclosed signed automotive demand, named prototype diversification, and broader target-market ambition so the chapter does not overstate customer breadth.
