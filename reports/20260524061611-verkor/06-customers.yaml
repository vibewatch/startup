- id: diversification-signals-beyond-renault
  title: There are real diversification signals, but public evidence beyond Renault is still narrow and early-stage
  body: Verkor is not marketed as a single-use automotive business. Its own homepage, InnoEnergy profile, and financing materials repeatedly say the company targets electric mobility, mobility more broadly, and stationary storage. The cleanest named non-Renault signal is EnerSys. Verkor disclosed that EnerSys became both an investor and a prototype customer, with Verkor producing ENS1 lithium-ion cells and developing a new format in Grenoble. That matters because it is evidence of product and market diversification outside Renault’s passenger-EV roadmap. But it does not yet equal a second disclosed serial offtake contract. The retained public sources stop short of naming a second automotive OEM, a signed stationary-storage buyer, or a multi-customer backlog that allocates the remainder of phase-one capacity. In other words, Verkor has proof of relevance beyond Renault, yet most of that proof is ecosystem or prototype evidence rather than a broad roster of revenue-bearing customers. The chapter
    therefore has to distinguish clearly between named commercial commitments, prototype validation, and strategic market ambition.
