- id: qualification-cycle-and-launch-dependence
  title: Verkor’s commercial model depends on qualification cycles, plant validation, and OEM launch timing
  body: 'The sources describe a business model closer to aerospace-style qualification than commodity spot selling. Verkor has to design and validate cells in Grenoble, transfer process know-how into Dunkirk, stabilize manufacturing, and then hit the launch windows of Renault and Alpine vehicle programs. Public evidence shows real progress: the VIC pilot line has been running continuously, produced tens of thousands of cells, and supplied initial customer volumes; the Dunkirk site was assembling modules before it began making its own cells; and by March 2026 Verkor said commissioning and line balancing were complete, with the production lines stabilized and the factory in final validation. External reporting adds that D-samples had already been delivered to Renault and that finished products were expected to start flowing to Renault factories as the site ramps. This is genuine customer proof because it links the product to a named OEM program, but it also shows why revenue timing is fragile.
    A battery startup can have a signed customer and still miss economics if qualification slips, line balancing drags, or the platform launch moves.'
