- id: TU005
  title: Expansion and concentration risk table
  columns:
  - expansion driver
  - concentration risk
  - impact
  - diligence path
  rows:
  - - Expand inside Renault / Alpine upper-segment platforms
    - Renault already dominates disclosed phase-one demand, so expansion can deepen single-customer dependence.
    - Higher utilization if launches succeed; sharper revenue shock if Renault programs slip.
    - Request platform-by-platform volume plan from A390 onward and the share of capacity reserved per model family.
  - - Convert EnerSys prototype into recurring industrial business
    - Prototype may never convert to serial offtake or may remain niche.
    - Would prove non-auto diversification if it scales.
    - Request prototype milestones, target applications, and expected commercialization timing.
  - - Turn stationary-storage ambition into signed backlog
    - No named signed stationary-storage customer is public.
    - Leaves a diversification narrative without contracted volume support.
    - Request list of signed LOIs, pilot customers, and sector split between mobility and stationary storage.
  - - Complete industrial ramp on schedule
    - Qualification and line-balancing delays would push revenue recognition and damage OEM trust.
    - Launch timing, working capital, and unit economics all depend on smooth ramp.
    - Request current yield, scrap, customer acceptance status, and SOP readiness by line.
  - - Defend share against alternative chemistries and Asian incumbents
    - Renault is adding LFP supply from CATL / LGES and exploring cobalt-free and lithium-metal paths.
    - Could pressure Verkor on cost, scope, or future program wins even if current launches proceed.
    - Request Renault sourcing roadmap by chemistry, price corridor, and expected role of Verkor beyond current NMC-style programs.
  notes: The risk table separates healthy land-and-expand paths from the downside that the same expansion story is still highly concentrated inside one OEM group and one new plant.
