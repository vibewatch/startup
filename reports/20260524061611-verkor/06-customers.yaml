company:
  name: Verkor
chapter:
  number: 6
  title: Customers
  summary: 'Renault Group is Verkor’s disclosed anchor customer and shareholder, with a 12 GWh/year supply agreement that appears to absorb most of the first Dunkirk plant’s capacity and now points to Alpine A390 commercialization in 2026. Customer proof beyond Renault is real but thin: EnerSys provides a named industrial prototype signal, and Verkor consistently pitches mobility plus stationary storage, yet public evidence still stops short of a broad multi-customer backlog. The key commercial diligence questions are concentration, launch-timing dependence, and whether Verkor can diversify before Asian incumbents and Renault’s alternative chemistry paths weaken its bargaining position.'
sections:
- id: anchor-customer-and-scope
  title: Renault is the disclosed anchor customer, and the public evidence points to heavy phase-one concentration
  body: Renault Group is the center of Verkor’s public customer story. The relationship is stronger than a normal startup–OEM pilot because it combines equity, technical qualification, and a large announced supply scope. Verkor and Renault each describe the partnership as long-term, and both say Renault validated the product, economics, and industrialization path from the Grenoble innovation centre to the Dunkirk gigafactory. The disclosed annual offtake is 12 GWh for Renault Group’s upper-segment vehicles, while Verkor’s first plant starts at 16 GWh. That implies roughly three quarters of phase-one capacity is already spoken for by one customer family before Verkor has publicly named a broader commercial roster. The first disclosed launch has evolved from the earlier Alpine electric crossover plan to the Alpine A390 commercialization milestone in 2026, with Alpine now describing batteries whose cells and modules come from Dunkirk and are assembled in Douai. This is unusually concrete proof
    for a young battery manufacturer, but it also means the customer chapter starts from concentration, not diversification.
