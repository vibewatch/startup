  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-Ranked Risk Overview and the Northvolt Comparable
        blocks:
          - type: paragraph
            body: >-
              Verkor's central risk is not a lack of capital or political support; it is whether the company can turn a
              highly subsidized and heavily financed French battery project into stable serial production before
              Renault's Alpine programmes need cells. The company has raised more than €3 billion across equity,
              subsidies, EIB-backed debt, and green project financing, but those funds increase rather than remove
              execution pressure because the capital stack now has to be justified by commercial output. Northvolt's
              November 2024 Chapter 11 filing is the strongest adverse comparable: it shows that a European battery
              champion can still fail after attracting blue-chip OEMs, public backing, and emergency DIP financing once
              the production ramp lags and customer confidence breaks. Verkor is earlier in its maturity curve than
              Northvolt was, but the comparable matters because the same failure chain is visible here in softer form: a
              narrow customer base, a tight commissioning window, heavy policy support, and limited public evidence on
              actual line yield. The risk heatmap therefore ranks industrial ramp, Renault concentration, and pricing
              compression ahead of residual legal risk.
            claimRefs:
              - CR001
              - CR012
