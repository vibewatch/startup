companyProfile:
  summary: >-
    Verkor is a French battery-cell manufacturer founded in Grenoble in July 2020 and now scaling from pilot and
    innovation activities in Grenoble to industrial production at its Dunkirk gigafactory. The company is positioned as
    a European low-carbon battery champion for electric vehicles and stationary storage, with Renault as both anchor
    customer and strategic shareholder, alongside a sponsor base that includes Macquarie, Meridiam, EIT InnoEnergy, and
    French public-support vehicles. By May 2026 the company has a live 16 GWh plant, more than €3 billion of secured
    financing across equity, subsidies, and project finance, and a 50 GWh long-term expansion ambition, but it remains
    in the critical serial-ramp phase where yield, customer concentration, and capital-structure opacity still dominate
    the investment case.
  foundedDate: '2020-07-01'
  founders:
    - name: Benoit Lemaignan
      role: Co-founder and CEO / President
      background: Founder and public face of capital raising, industrial strategy, and partner management.
      claimRefs:
        - CO011
    - name: Christophe Mille
      role: Co-founder and Executive Technology Advisor
      background: Earlier CTO who now appears in a more advisory technology role as Verkor industrialises.
      claimRefs:
        - CO012
  foundingLocation: Grenoble, France
  headquarters: Grenoble, France
  productSummary: >-
    Verkor develops and manufactures lithium-ion battery cells and modules for electric vehicles and, selectively,
    stationary-storage applications. Its operating model links R&D, pilot production, process validation, and customer
    qualification work in Grenoble to serial cell production at the Dunkirk gigafactory, with first commercial batteries
    targeted for Alpine from 2026.
  customerFocus: >-
    European EV OEMs led by Renault and Alpine, plus longer-term mobility and stationary-storage customers where Verkor
    can qualify cells through long industrial programs rather than spot sales.
  businessModel: >-
    B2B battery-cell and module supply under long qualification cycles and multi-year industrial agreements, supported
    by pilot-line development in Grenoble and project-financed scale-up in Dunkirk.
  stage: growth-stage private
