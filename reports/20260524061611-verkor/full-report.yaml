              too narrow for investors to underwrite durability without private diligence. Sifted summarized the
              strategy as one factory, one main customer, one main product, and one location. Financiers such as
              Macquarie and Automotive World explicitly tied the bankability of the first gigafactory to Renault’s
              contract, which is positive for near-term funding but reinforces dependence on a single OEM group. The
              risk is amplified by external competition and by Renault’s own diversification path. Sifted says Renault
              is adding LFP supply from LG Energy Solution and CATL from 2026, while Ampere is publicly exploring
