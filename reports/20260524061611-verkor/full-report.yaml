      - number: '3.2'
        title: European Peers and the Northvolt Read-through
        blocks:
          - type: paragraph
            body: >-
              Northvolt remains the most important peer benchmark even though it is no longer a live direct competitor
              in the normal commercial sense. In November 2024 it filed for Chapter 11 in the US to access roughly $245
              million of emergency financing, and in March 2025 it filed for bankruptcy in Sweden after failing to
              secure a viable financing package. The importance for Verkor is not the legal sequence itself; it is what
              Northvolt's path proved. A company can raise very large sums, attract blue-chip customers, and still fail
              if ramp complexity, capital intensity, and operational discipline slip at the same time. That lesson now
              colors every lender, customer, and public-policy discussion about new European battery capacity.


              ACC and Envision AESC show the two more relevant surviving paths inside Europe. ACC has heavyweight
              shareholders and a live French plant, but by 2026 it had definitively shelved its German and Italian
              projects and was still wrestling with costs and scrap rates that lag Asian rivals. Envision AESC is more
              credible than many nominal 'European' peers because its plants are tied to named automotive anchors—Nissan
              in Sunderland and Renault-adjacent industrial policy in Douai—and because public support arrived alongside
              plant execution, not instead of it. Morrow's May 2026 bankruptcy, after first deliveries only weeks
              earlier, reinforces how thin the margin for error remains. FREYR's pivot into T1 Energy, Britishvolt's
              dead Northumberland site, and Italvolt's UAE detour all reinforce the same pattern: announced capacity
              without durable capital, customer lock-in, and operational proof does not survive Europe's battery
              financing cycle.
