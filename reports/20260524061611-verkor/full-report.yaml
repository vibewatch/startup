      - number: '8.2'
        title: The financing stack supports completion, not a clean equity mark
        blocks:
          - type: paragraph
            body: >-
              The most important valuation discipline for Verkor is to separate support for project completion from
              support for common-equity value. The public stack is substantial: a minimum €850 million Series C, up to
              €600 million of EIB support, roughly €650 million of French and regional subsidies, and later an
              approximately €1.2-1.3 billion non-recourse green loan. By late 2025 Verkor was describing cumulative
              capital secured above €3 billion. That is meaningful and it lowers the probability of near-term project
              abandonment. But much of that stack is senior, conditional, or purpose-bound. Debt providers are
              underwriting asset completion and contracted cash flows; public bodies are underwriting industrial policy
              and decarbonisation; Renault is underwriting supply security. None of those layers cleanly answers what a
              new common-equity investor owns if the ramp disappoints. The valuation floor is therefore better framed as
              “there is enough capital to attempt the build” rather than “the equity is worth the capital committed.”
              That is supportive, but it is not the same thing as fairness at any undisclosed entry price.
