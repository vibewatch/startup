  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Core assumptions
      - Illustrative equity value
      - Probability signal
      - Key risks
    rows:
      - - Bear
        - >-
          Commercialisation slips again, Renault remains the only visible anchor customer, and new senior capital is
          needed.
        - €0.8-1.8B
        - Medium
        - Down-round dynamics, covenant pressure, and diluted common-equity recovery.
      - - Base
        - >-
          2026 deliveries start, 16 GWh ramp progresses unevenly but without a strategic reset, and financing remains
          available.
        - €2.0-3.5B
        - Medium-to-high
        - Execution risk persists, but the platform stays financeable.
      - - Bull
        - Alpine deliveries ramp on time, second-customer proof appears, and 50 GWh expansion credibility improves.
        - €4.0-6.0B
        - Low-to-medium
        - Requires both operating proof and cleaner equity visibility.
      - - Why the range is wide
        - >-
          Current price is undisclosed, so scenario values are back-solved from milestones and peer outcomes rather than
          from management guidance.
        - Not a factual mark
        - High confidence
        - False precision is the main modeling mistake to avoid.
      - - Downside transmission
        - >-
          Ramp miss or extra senior debt hits value faster than it would in software because capital intensity and
          working capital are heavier.
        - Compression can be abrupt
        - High confidence
        - Factory assets do not protect common equity if capital terms worsen.
    notes: >-
      All values are analyst scenario estimates in euros, not disclosed company valuations. The table explicitly
      separates milestone risk from equity-support ambiguity.
