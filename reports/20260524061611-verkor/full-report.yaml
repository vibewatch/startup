      - number: '1.2'
        title: Founders, Leadership, and Governance
        blocks:
          - type: paragraph
            body: >-
              The public leadership picture is strongest at the founder and operating-bench level and weaker on control
              rights. Benoit Lemaignan remains the central executive and public face of Verkor, while the current team
              page shows Christophe Mille in an executive-technology-advisor role rather than the earlier CTO title,
              suggesting a meaningful evolution in leadership responsibilities as the company moved from design into
              industrial ramp-up. The same public page shows a maturing executive bench spanning operations, finance,
              sales, procurement, sustainability, and manufacturing, which is important because this is a
              capital-intensive scale-up that cannot depend only on founder charisma. Governance also became more formal
              in March 2026, when Verkor appointed Jacques Esculier to chair its supervisory board after the Dunkirk
              inauguration. The company’s board page and governance release show a supervisory board populated by
              investor and partner representatives from Macquarie, Meridiam, ISALT/FSP, Crédit Agricole Assurances or
              Predica, Renault Group, and InnoEnergy alongside Verkor management. That is useful ground truth for later
              control analysis. What is still missing from the public record is equally material: the fetched pack does
              not disclose board committees, reserved matters, minority protections, or a full shareholder register, so
              governance diligence should not be considered complete just because the board roster is now visible.
