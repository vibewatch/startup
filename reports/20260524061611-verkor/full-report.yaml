  - id: TV004
    title: Comparable valuation table
    columns:
      - Comparable
      - What it shows
      - Value or status signal
      - Relevance to Verkor
      - Limitation
    rows:
      - - Verkor (public support stack)
        - >-
          Minimum €850M Series C, up to €600M EIB support, ~€650M subsidies, later ~€1.2-1.3B green loan, and >€3B
          cumulative capital by late 2025.
        - No disclosed current equity mark; support stack is real but mixed.
        - Best direct anchor for project support and asset completion.
        - Debt, subsidies, and guarantees do not equal common-equity value.
      - - Northvolt
        - Europe’s boldest battery-scale case turned into the clearest financing-is-not-valuation warning.
        - $5B non-recourse financing in Jan 2024; Chapter 11 by late 2024.
        - Shows how quickly scale narratives can reverse when ramp and market assumptions fail.
        - Not a perfect match because Northvolt was larger and more globally spread.
      - - ACC
        - JV-backed European battery expansion can still be shelved when economics and execution weaken.
        - German and Italian gigafactories abandoned in 2026 after long delays.
        - Useful for downside framing around demand, customer concentration, and viability.
        - ACC is a JV with different governance and chemistry decisions.
      - - PowerCo
        - Even Volkswagen’s in-house battery platform reset capacity and funding expectations.
        - Budget cut from €15B to below €10B; plant ambition reduced from six to three.
        - Useful for how slower EV ramps can force capital-plan resets even for strategic incumbents.
        - PowerCo sits inside VW and has strategic motives beyond standalone valuation.
      - - QuantumScape
        - Upper-end public battery-tech valuation reference.
        - $5.04B market cap in May 2026.
        - Reasonable public ceiling check for speculative battery equity.
        - R&D-heavy solid-state story is not a direct manufacturing peer.
      - - Solid Power
        - Low-end listed solid-state reference.
        - $0.68B market cap in May 2026.
        - Shows how quickly public battery-tech valuations compress outside the top name.
        - Technology-stage comp, not a factory-ramp comp.
      - - SES AI
        - Another public early-stage battery platform anchor.
        - $0.45B market cap in May 2026.
        - Useful for the lower end of public appetite.
        - Not a direct European manufacturing comparable.
      - - Enovix
        - Battery hardware value-chain comp with more physical production exposure.
        - $1.45B market cap in May 2026.
        - Useful midpoint between pure R&D optionality and industrial hardware.
        - Consumer-electronics orientation limits direct EV-cell comparability.
    notes: >-
      Representative rather than exhaustive set. Public-equity values are current USD market caps from
      CompaniesMarketCap; Verkor and European venture rows are project or financing-status anchors, not directly
      observed equity marks.
    enumerationScope:
