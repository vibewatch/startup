        title: Funding Stack and Counterparty Profile
        blocks:
          - type: paragraph
            body: >-
              Verkor’s financing chronology is unusually rich for a private industrial startup, and the pattern matters
              more than any single round. The business moved from a €100 million strategic round in 2021, to a 2022
              innovation-centre package above €250 million, to a September 2023 package above €2 billion, and then to
              more than €1.3 billion of project-oriented green debt in May 2024. The investor mix is also not typical
              venture software capital: early equity and industrial sponsors included Renault, EQT Ventures, EIT
              InnoEnergy, Schneider Electric, Capgemini, Arkema and Tokai COBEX, while later rounds added Macquarie,
              Meridiam, Crédit Agricole Assurances and FSP alongside public institutions and export guarantees. Renault
              is both customer and shareholder, and the latest lender commentary makes clear that this dual role is
              central to the financing case. That improves bankability, but it also concentrates commercial exposure
              around one anchor OEM and one factory ramp.
