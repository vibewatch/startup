      - number: '1.4'
        title: Milestones, Industrial Execution, and Risk Context
        blocks:
          - type: paragraph
            body: >-
              The milestone record is strong enough to show real delivery, but it also makes clear that Verkor remains
              an execution story. The company moved from founding in 2020 to the Renault tie-up in 2021, selected
              Dunkirk in early 2022, opened the Grenoble Innovation Centre in mid-2023, laid the Dunkirk foundation
              stone in late 2023, closed green debt in 2024, inaugurated the gigafactory in late 2025, and entered final
              validation in March 2026. That is meaningful progress for a European battery startup. At the same time,
              independent and public-finance sources explicitly underline that gigafactory scale-up is fragile. EIB
              materials describe technology, market, and construction risk around projects like Verkor, especially when
              EV demand and raw-material prices are volatile. Reuters’ reporting on Northvolt’s crisis broadens the
              warning: European battery ambitions have already been dented by production problems, slower EV demand, and
              Chinese competitive pressure. Verkor is therefore not yet de-risked just because the site opened. It still
              has to convert a well-funded construction and commissioning story into repeatable serial output for
              Renault and later customers. The public record is encouraging on capital, site completion, and governance
              maturation, but the overview conclusion should stay disciplined: Verkor now looks like a real industrial
              company, yet one whose valuation and downside still hinge on large-scale manufacturing execution over the
              next phase.
