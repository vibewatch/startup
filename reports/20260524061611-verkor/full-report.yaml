      - number: '8.3'
        title: European peer failures and public comps keep the range wide
        blocks:
          - type: paragraph
            body: >-
              The comparable work cuts against easy optimism. Northvolt is the sharpest warning because it shows that
              enormous project financing and strong offtake contracts do not immunise equity from execution failure; in
              fact, the company moved from a $5 billion non-recourse financing and more than $13 billion of capital
              secured to Chapter 11 protection within the same broad cycle. ACC and PowerCo reinforce the message from a
              different angle: when EV demand disappoints or yields remain messy, even well-backed European cell
              programmes cut sites, abandon projects, or go back to the market for more outside capital. Against that
              peer backdrop, listed battery-tech comps are useful not because they are perfect matches, but because they
              reveal today’s market appetite for speculative battery equity. QuantumScape still carries a
              multibillion-dollar public value, but Solid Power, SES AI, and Enovix sit much lower. Verkor can
              reasonably argue for a premium to pure lab-stage peers because it has real industrial assets and Renault
              demand, yet the peer set still suggests that any pre-scale Verkor equity value above roughly €4-5 billion
              would already be leaning toward the top of the plausible public-equity range. That leaves the current
              valuation debate squarely in scenario territory rather than in fact territory.
