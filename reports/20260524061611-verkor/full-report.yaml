      - number: '5.2'
        title: Manufacturing stack, digital control, and plant operating model
        blocks:
          - type: paragraph
            body: >-
              Verkor’s disclosed operating model is a two-site industrialization pipeline. Grenoble hosts the VIC, which
              combines R&D, a 100–150 MWh pilot line, and workforce training, while Dunkirk is the 16 GWh industrial
              site. Official and EIB materials show that the pilot line is not a lab curiosity: it runs 24/7, has
              produced tens of thousands of cells, and supplied initial volumes for module assembly before Dunkirk began
              producing its own cells. That matters because it anchors the company’s manufacturing narrative in actual
              pilot production and process transfer rather than pure renderings of a future gigafactory. The March 2026
              update then places Dunkirk in final validation, with commissioning and line balancing complete and
              continuous line operation achieved, but still short of a claim that mature serial production is already
              fully established.


              The strongest public differentiation sits in the manufacturing control stack rather than in a disclosed
              chemistry breakthrough. Verkor describes a proprietary digital architecture managing product, process, and
              material data for traceability and industrial performance. The AGATHE project adds a more concrete layer:
              AI-driven process optimization, predictive maintenance, and an on-site pre-recycling loop for production
              scrap. The European Commission’s state-aid decision independently confirms that Verkor’s R&D program
              covers electrode automation, digitized formation, materials recovery, and pilot-line design. Practitioner
              signals reinforce that this is real plant work rather than branding alone. Current hiring spans electrode
              industrialization, formation, module process engineering, computer vision, data science, maintenance
              methods, and a senior automation role calling for PLC/HMI, robotics, OPC UA, MES interfaces, and
              industrial networking. One caution is that branded systems such as BIMS® and DROPS® are discussed mainly
              in secondary trade coverage, so the names and internal architecture should be treated as company-described
              rather than deeply documented public technology modules.
