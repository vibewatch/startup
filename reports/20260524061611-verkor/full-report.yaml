      - number: '1.3'
        title: Capital Formation, Anchor Relationships, and Public Support
        blocks:
          - type: paragraph
            body: >-
              Verkor’s capital formation is unusually visible for a private industrial startup and is one of the
              strongest reasons later chapters can reuse this overview as ground truth. The 2021 Renault partnership did
              more than validate technology; it made Renault an equity holder with a stake above 20% and tied battery
              demand to Renault and Alpine programs. That early anchor relationship was followed by a €100 million round
              in July 2021, more than €250 million of additional VIC financing in 2022, a 2023 package exceeding €2
              billion around the Dunkirk launch, and a further green financing package above €1.3 billion in May 2024.
              Public and partner disclosures consistently show a hybrid support stack: strategic industrial backers,
              infrastructure and energy-transition funds, commercial banks, public lenders, and direct state aid.
              Macquarie led the 2023 Series C, Meridiam took a significant stake, EIB support grew into a €400 million
              package, Bpifrance-backed guarantees supported the debt stack, and the European Commission separately
              approved €659 million of French state aid for Verkor’s R&D program through end-2026. The partner ecosystem
              matters at overview level too: InnoEnergy, Schneider Electric, Plastic Omnium, EDF, and later EnerSys and
              ING all show that Verkor has assembled more than a customer story; it has assembled an industrial
              coalition. The missing pieces are present but clear: public materials still do not disclose valuation,
              revenue, or the full current cap table.
