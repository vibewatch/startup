  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold or event
      - Why it matters
      - Action implication
    rows:
      - - Commercialisation slips again
        - Meaningful push-out beyond the current 2026 delivery plan.
        - Confirms that the visible schedule is still moving right.
        - Reset the base case toward bear assumptions.
      - - Senior capital arrives before diversification
        - A new financing adds debt or preferences before a second customer is visible.
        - Common-equity downside worsens while concentration stays high.
        - Treat headline financing as dilution risk, not validation.
      - - Customer mix stays Renault-only
        - No public second customer or storage offtake emerges through the next ramp phase.
        - The plant becomes too dependent on one OEM ecosystem.
        - Keep discount rate elevated and avoid paying up.
      - - Scope is re-cut
        - Capacity or plant ambitions are formally reduced, similar to PowerCo or ACC resets.
        - Signals demand or economics are below prior expectations.
        - Move directly to bear-case framing.
      - - Ramp economics disappoint
        - Scrap, yield, or working-capital requirements imply a much heavier cash need than expected.
        - Industrial proof stops translating into equity value.
        - Require new diligence and re-underwrite from scratch.
    notes: >-
      These triggers are portfolio-actionable and deliberately tied to observable operating or financing events rather
      than to generic sentiment.
    claimRefs:
      - CV012
      - CV026
      - CV028
      - CV043
      - CV044
      - CV049
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Diligence path
    rows:
      - - Cap table and liquidation waterfall
        - Current common vs preferred ownership, anti-dilution, investor rights, and any senior claims.
        - Determines what a new investor actually owns in downside cases.
        - Request the latest cap table, shareholder agreements, and waterfall model.
      - - Debt package details
        - Covenants, security package, draw conditions, and any cross-default or refinancing triggers.
        - Project finance can protect lenders while weakening later equity.
        - Review executed debt documents and covenant model.
      - - Subsidy conditions
        - Milestones, clawbacks, compliance requirements, and grant-recipient obligations.
        - Public support helps value only if the company can keep it.
        - Obtain France 2030 and regional grant agreements.
      - - Plant yield and scrap
        - Yield curves, scrap rates, uptime, and working-capital assumptions during ramp.
        - These variables dominate battery-ramp economics.
        - Review plant dashboard, quality reports, and monthly ops pack.
      - - Customer diversification
        - Second OEM or storage pipeline, contract form, and timing.
        - Reduces Renault concentration and helps support terminal value.
        - Review signed LOIs, offtake contracts, and sales funnel.
      - - Unit economics
        - Cell-level gross margin, conversion cost, and capex per GWh at scale.
        - Needed to translate industrial proof into a valuation framework.
        - Request management model and independent technical diligence.
    notes: >-
      These are the minimum asks required to turn this chapter from a public-evidence valuation frame into an investable
      underwriting memo.
    claimRefs:
      - CV019
      - CV043
      - CV044
      - CV050
      - CV051
