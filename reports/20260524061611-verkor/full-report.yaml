      - number: '4.4'
        title: Regulation, Market Pressure, and Financial Verdict
        blocks:
          - type: paragraph
            body: >-
              Even if Verkor executes its plant ramp, the operating environment remains demanding. European battery
              manufacturing still faces weaker-than-hoped EV demand growth, aggressive Chinese competition,
              technology-learning risk and the fresh memory of Northvolt’s collapse under a mix of scale, cost and
              demand problems. Verkor’s answer—one customer, one product, one factory before expanding—looks more
              disciplined than Northvolt’s multi-front expansion, but it does not remove the core industrial challenge
              of pushing yields high enough to earn margins on a capital-heavy NMC line. Regulation adds another layer.
              The EU battery regime brings due-diligence, carbon-footprint and battery-passport style obligations from
              2026 onward, which means compliance data systems and traceability costs arrive before the sector’s
              economics are fully mature. The chapter’s verdict is therefore cautious: Verkor has assembled one of
              Europe’s stronger public financing stacks for a battery startup, but it still looks financing-dependent
              for expansion and opaque on the metrics that decide whether debt-supported scale converts into durable
              returns.
