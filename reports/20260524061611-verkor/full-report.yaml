      - number: '2.4'
        title: Supply Pressure, Economics, and Adverse Context
        blocks:
          - type: paragraph
            body: >-
              Europe’s localization push is real, but the supply side is already crowded and economics remain
              unforgiving. ACEA says the EU still represents only 7% of global battery production and that most upstream
              capacity and refining remain concentrated outside Europe. Bruegel shows why the competitive field is
              intense even before new French capacity arrives: LG Energy Solution, SK-linked capacity, and Samsung SDI
              already dominate operational European cell output, LG’s Wrocław plant alone is huge, and CATL’s Debrecen
              project could become the region’s largest facility. The policy response is partly defensive. The EU has
              imposed duties on China-made BEVs, but those duties target finished vehicles rather than the full battery
              chain. Meanwhile, cheaper Chinese battery prices, the spread of low-cost LFP chemistry, uneven European
              electricity prices, and a pipeline where many projects are still only planned or already distressed all
              pressure margins. Verkor benefits from Dunkirk’s logistics and power position, but its expansion case
              still depends on whether it can turn localization advantages into durable cost and qualification
              advantages before Europe’s announced capacity starts competing too aggressively for the same demand pools.
