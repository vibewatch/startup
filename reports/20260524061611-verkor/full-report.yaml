      - number: '7.3'
        title: Renault Concentration and EV Demand Cyclicality
        blocks:
          - type: paragraph
            body: >-
              Publicly disclosed demand visibility is overwhelmingly tied to Renault. The long-term agreement covers 12
              GWh per year for upper-segment Renault vehicles, and the first high-profile programme remains Alpine.
              Renault also appears in Verkor's funding story as an early shareholder and as an anchor contract
              specifically cited by management to justify the investment case to other funders. That makes Renault
              concentration the clearest commercial dependency in the chapter. The problem is amplified by European EV
              cyclicality. EAFO's battery-price summary notes slowing EV demand in some regions and
              earlier-than-expected subsidy cuts in France and Germany, while the broader price collapse in batteries
              means OEMs have more leverage to renegotiate or dual-source if launches slip. Verkor may ultimately
              diversify, but the reviewed public record does not disclose another offtake relationship of similar scale.
              As a result, any Alpine delay, qualification issue, or softer-than-expected upper-segment EV demand would
              hit utilization at the moment Dunkirk still needs proof of stable output.
