      - number: '2.2'
        title: Sizing Lenses and Verkor-Relevant Scenarios
        blocks:
          - type: paragraph
            body: >-
              The public evidence supports several useful sizing lenses, not one heroic TAM number. ACEA’s 2025
              registration releases show BEV share at 15.6% in H1 2025 and 16.9% through November, while EAFO’s
              early-2026 signal points to renewed growth in major markets. The Commission’s battery page says global
              battery demand could rise fourteen-fold by 2030 with the EU representing 17% of that demand, while storage
              sources show a second pull on cell demand: Europe added 27.1 GWh of battery storage in 2025, reached a
              77.3 GWh installed fleet, and could have roughly 43 GW of utility-scale capacity by end-2026. Those
              numbers are still much smaller than the cell-manufacturing supply pipeline being proposed. European
              Battery Tracker shows about 1.5 TWh of tracked 2030 gigafactory capacity, while the MDPI risk model puts
              announced nameplate above 2.2 TWh and explicitly warns that not all projects will be realized. Against
              that backdrop, Verkor’s 16 GWh phase is meaningful for a single entrant but still a small single-digit
              share of Europe’s announced supply ambitions, which is why offtake quality matters more than headline
              pipeline size.
