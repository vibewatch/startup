      - number: '7.4'
        title: Subsidy Dependence, Policy Conditions, and Financing-Covenant Risk
        blocks:
          - type: paragraph
            body: >-
              Verkor's financing stack is unusually supportive, but it comes with the exact kind of policy dependency
              that can become a downside amplifier. The European Commission approved a €659 million French grant running
              through end-2026 and attached claw-back and know-how-sharing conditions. Separately, the 2024 green
              financing package was structured as non-recourse debt and marketed around EU Taxonomy alignment and a
              “Dark Green” external review. Those facts matter because the project is not merely equity-funded; it is
              wrapped in state-aid logic, lender diligence, and green-loan discipline. Public materials do not disclose
              the actual covenant thresholds, completion tests, or drawdown mechanics, so investors cannot tell how much
              underperformance Dunkirk can absorb before financing flexibility tightens. This opacity should be treated
              as a real risk, not a documentation nuisance. Verkor is also a France 2030 / IPCEI showpiece in a Just
              Transition territory, so subsidy or policy changes would have both political and financial consequences.
              Support lowers the probability of immediate failure, but it also means the company is exposed to policy
              conditions that can move independently of cell quality or Renault demand.
