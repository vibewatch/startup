  - id: TI004
    title: Unit economics table
    columns:
      - Metric
      - Public value / status
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - Revenue
        - null
        - low
        - Actual revenue is the bridge from plant ramp to equity value and debt service.
        - Request monthly and annual revenue by customer and product line for 2025-2026.
      - - Gross margin
        - null
        - low
        - Battery manufacturing economics depend on yield, scrap, energy and depreciation, not just on contract volume.
        - Request plant-level gross margin, scrap rates, warranty assumptions and depreciation policy.
      - - Cash on hand
        - null
        - low
        - Cash balance anchors runway and covenant headroom during ramp.
        - Request latest unrestricted and restricted cash balances plus debt-service reserves.
      - - Monthly burn
        - null
        - low
        - Burn determines whether the current financing stack is enough if yield or demand slip.
        - Request trailing-12-month cash burn split between opex, capex and working capital.
      - - Realized selling price
        - null
        - low
        - Without realized price, public GWh commitments cannot be converted into revenue.
        - Request contract price formulae, escalation clauses and customer rebates.
      - - Yield / scrap curve
        - null
        - low
        - Battery profitability depends heavily on process yield during early industrialisation.
        - Request line-yield history, scrap rates, ramp assumptions and quality losses.
      - - Working capital profile
        - null
        - low
        - Raw-material inventory and payment terms determine cash conversion as much as margin does.
        - Request inventory days, customer payment terms and supplier prepayment needs.
    notes: >-
      Null means the metric is not publicly disclosed in the reviewed pack, not that the metric is zero or irrelevant.
      This is a core underwriting blocker rather than a cosmetic data gap.
    enumerationScope:
      coverage: partial
      basis: >-
        The table lists the minimum unit-economics fields needed to underwrite a battery plant ramp and marks whether
        each is publicly disclosed in this run.
    claimRefs:
