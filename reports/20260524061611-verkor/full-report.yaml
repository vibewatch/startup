      - number: '7.5'
        title: Competitive Pricing, Raw Materials, Permitting, and Labor Risk
        blocks:
          - type: paragraph
            body: >-
              The external market backdrop is hostile to any European cell project still proving itself. EU trade
              authorities concluded that Chinese subsidies threaten injury to EU producers, yet anti-subsidy duties have
              not removed the core problem: China is still setting cost direction for the entire market. EAFO's summary
              of BloombergNEF data says pack prices fell 20% in 2024 to $115/kWh, with China producing enough cells to
              cover 92% of global demand, and points to slowing EV demand plus early subsidy cuts in France and Germany.
              CNBC's reporting on CATL adds that Europe itself is the next target for Chinese expansion, while
              MarketsandMarkets still lists CATL, BYD, and LG Energy Solution among the main players shaping the region.
              For Verkor this means raw-material and localization rhetoric must translate into real cost protection
              quickly. Yet the reviewed public materials do not disclose long-term lithium, nickel, graphite, or
              precursor contracts, and local expansion is already pulling permitting and public-debate issues into view
              via ZGI3. Add the need to recruit roughly 1,200 direct workers into a battery valley competing for
              specialized talent, and the residual exposure remains high even if the first plant reaches serial
              production.
