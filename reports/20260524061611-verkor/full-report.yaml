chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Footprint, and Business Model
        blocks:
          - type: paragraph
            body: >-
              Verkor should be treated as an industrial battery manufacturer, not as a software intermediary or a narrow
              engineering contractor. Official materials consistently describe a Grenoble-founded French company focused
              on low-carbon lithium-ion battery cells for electric vehicles and stationary storage, with a two-site
              model that starts in Grenoble and scales in Dunkirk. The Verkor Innovation Centre in Grenoble functions as
              headquarters and as the technical bridge between research, pilot manufacturing, and workforce training.
              That matters because the company’s business model is inseparable from its ability to industrialise process
              know-how: the VIC develops cells, validates manufacturing methods, and trains staff; the Dunkirk
              gigafactory is where those processes must produce automotive-grade cells at scale. The public footprint is
              now large enough to be concrete rather than aspirational. Verkor’s official pages cite a 15,000 m²
              Grenoble centre, a 100 to 150 MWh pilot line, a 16 GWh Dunkirk gigafactory with a 50 GWh 2030 ambition,
              and roughly 1,200 direct jobs at full first-phase scale. As of March 2026, Verkor’s own description places
              the company in the final validation phase before serial production, which is more advanced than a
              construction story but still short of a mature steady-state manufacturing business.
