      - number: '4.3'
        title: Capital Intensity, Project Finance, and the 50 GWh Path
        blocks:
          - type: paragraph
            body: >-
              Phase-one economics look industrial and capital hungry, not asset light. Public anchors vary by scope and
              vintage—InnoEnergy once cited €1.6 billion of initial investment, while the EIB project sheet now carries
              a €1.941 billion project cost for the 16 GWh plant—but both point to very high capital intensity for a
              first factory. The structure of the 2024 debt package reinforces that reading: EIB direct and
              intermediated loans, export-style guarantees, commercial senior loans, a bridge loan and subordinated
              public debt. That is classic risk-sharing to get a strategic project over the line before a long operating
              history exists. Even here, public disclosures conflict: Verkor isolates €961 million of commercial-bank
              senior debt while Natixis frames the same closing as €1.2 billion of senior non-recourse debt. The safest
              interpretation is not that one side is wrong, but that public sources use different inclusion conventions.
              For the 50+ GWh path, public evidence still points to more financing ahead rather than self-funded
              expansion.
