      - number: '5.3'
        title: Low-carbon manufacturing, safety work, and circularity posture
        blocks:
          - type: paragraph
            body: >-
              Verkor’s low-carbon thesis is credible as an industrial-location strategy even though its product-level
              performance data remain sparse. Dunkirk gives the company port access for imported materials, a dense
              northern-France automotive and battery ecosystem, and low-carbon electricity from the French grid.
              Verkor’s 12-year EDF contract, reaching 33 MW from 2028, is especially important because it turns generic
              “French grid advantage” marketing into a specific long-term power-allocation instrument intended to
              stabilize both carbon intensity and cost. Journal Auto adds a second site-level advantage, reporting
              connection to a local waste-heat network linked to nearby heavy industry. Together those factors make the
              climate story more than a generic ESG overlay; they are part of the operating model.


              On quality, safety, and circularity, public proof is process-oriented rather than
              product-benchmark-oriented. The INERRANT podcast post places Verkor inside a battery-safety and
              performance-testing work package for electromobility. The EC aid decision confirms work on automation,
              battery formation digitization, recycling, and materials recovery. AGATHE adds a disclosed target to
              process more than 95% of production scrap on site, and Natixis describes lifecycle commitments from
              components to recycling under an EU Taxonomy-aligned financing framework. Patent filings reinforce that
              process and quality control are where Verkor is visibly building proprietary know-how: EP4537420 covers a
              battery cell and its manufacturing method, while US12531287 covers an inspection apparatus that measures
              cell temperature under pressure. What the public pack does not yet provide is equally important: no
              disclosed cycle-life curve, energy density, charge-rate certification, or field reliability set for the
              launch cell. Investors should therefore read Verkor’s quality and safety posture as a serious industrial
              program with real evidence, but not as a fully benchmarked public product-performance dossier.
