  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and valuation framing
        blocks:
          - type: paragraph
            body: >-
              Verkor is easier to respect than to price. The company has done real work: it assembled one of the larger
              public financing stacks in European batteries, secured Renault as both strategic shareholder and anchor
              offtake partner, and opened a Dunkirk gigafactory that is now supposed to commercialise first batteries in
              2026. Those are not paper milestones. They justify staying engaged. But they do not answer the question
              that matters most for a new investor: what is the current common-equity price after debt, subsidies,
              guarantees, and later project-finance layers are considered? Public sources disclose commitments and
              construction support, not a current post-money or the cap-table mechanics that determine downside
              recovery. That distinction is why the recommendation is track / research-more rather than buy. The
              industrial story may be good, but the equity instrument remains partially opaque, and Europe’s recent
              battery history shows how quickly generous financing headlines can give way to capital destruction when
              ramp assumptions prove too optimistic.
