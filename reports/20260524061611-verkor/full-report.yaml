      - number: '3.4'
        title: Verkor Differentiation, Switching Costs, and Financing Credibility
        blocks:
          - type: paragraph
            body: >-
              Verkor's differentiators are real, but they are narrower than the generic 'European battery champion'
              label suggests. The company has an identifiable automotive anchor in Renault and Alpine, explicit French
              and EU support, EIB-backed project finance, a Dunkirk site with port access, and a manufacturing base in
              one of the world's cleanest large-grid power systems. Those ingredients matter because they directly
              address the two categories of buyer anxiety that intensified after Northvolt: financing credibility and
              supply-chain sovereignty. Verkor can plausibly tell Renault-adjacent and Europe-sensitive customers that
              its cells are lower-carbon, politically aligned, and physically close to French vehicle assembly.


              The trade-off is concentration. The first named commercialization reference remains the Alpine A390, which
              means Verkor still looks more like a high-quality anchored ramp than a broad multi-customer platform.
              Northvolt's collapse implies that investors and customers will not reward Verkor for announced future
              capacity alone; they will reward serial output, yield stability, scrap control, and the ability to widen
              the customer base beyond one anchor ecosystem. In that sense, Verkor's competition is as much with doubt
              as with other companies. If it proves stable serial production from Dunkirk, its Renault anchor and French
              state support become evidence of credibility. If ramp metrics remain opaque, those same features can be
              reframed as concentration and subsidy dependence. The competitive verdict is that Verkor is better
              positioned than Europe's failed independent aspirants, but still far from insulated from the execution and
              cost pressures imposed by PowerCo and the Asian incumbents.
