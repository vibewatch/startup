  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Lens
      - Thesis
      - Anti-thesis
      - What would change the view
    rows:
      - - Industrial proof
        - Verkor has opened a 16 GWh plant and moved from design to large-scale production infrastructure.
        - Opening a factory is not the same as proving yield, utilization, or working-capital discipline.
        - Stable 2026 commercial deliveries and disclosed ramp KPIs.
      - - Customer anchor
        - Renault gives Verkor a real strategic customer and offtake base.
        - Public demand evidence is still highly concentrated around Renault and Alpine.
        - A second OEM or large storage customer with binding volume.
      - - Financing support
        - The company has assembled one of Europe’s deepest financing stacks for a new battery plant.
        - Much of that stack is debt, subsidy, or guarantee support rather than common-equity support.
        - Current cap table, debt covenants, and preference stack under NDA.
      - - Relative valuation
        - A live plant can deserve a premium to pure R&D battery names.
        - Peer failures show that industrial assets can still wipe out equity if the ramp or market is wrong.
        - Proof that Verkor can scale without repeated senior-capital resets.
      - - Exit optionality
        - If 2026 deliveries work, Verkor could become one of Europe’s few scaled independent battery platforms.
        - Public evidence does not yet show the economics or diversification needed for a clean IPO-grade story.
        - Customer diversification, margin disclosure, and cleaner balance-sheet visibility.
      - - Project-finance logic
        - Lender and policy support reduce shutdown risk.
        - They also create enterprise-value ambiguity because they seniorize parts of the capital stack.
        - Clear mapping of lender recourse, subsidy conditions, and equity waterfall.
    notes: >-
      The anti-thesis is intentionally economic, not rhetorical: the problem is not whether Verkor is real, but whether
      the equity can be underwritten cleanly from public evidence.
