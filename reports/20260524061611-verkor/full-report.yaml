      - number: '7.2'
        title: Construction, Commissioning, Yield Ramp, and Technology Maturity
        blocks:
          - type: paragraph
            body: >-
              Verkor's official narrative is encouraging but still self-reported. The company inaugurated Dunkirk in
              December 2025, said first batteries for Alpine are planned in 2026, and on 30 March 2026 described the
              lines as fully optimized, stabilized, and running continuously ahead of serial production within a few
              months. That progress matters, but it does not answer the key investment question: what yield, scrap, and
              customer-qualification metrics sit underneath those milestones? The reviewed public sources contain no
              independent automotive qualification data, no defect-rate disclosure, and no externally verified
              production yield. That absence is not a technical failure by itself, yet it means investors are still
              underwriting a manufacturing-learning curve largely on company and lender communications. Because the same
              public materials also tie commercialization to 2026 Alpine launches, the visible schedule slack appears
              limited. In practical terms, Verkor must simultaneously finish serial ramp, achieve stable quality, and
              avoid a Northvolt-style gap between equipment readiness and economically acceptable output. The risk
              transmission map shows how a yield miss would move directly into covenant, utilization, and valuation
              pressure.
