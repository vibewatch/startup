  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Demand Floor
        blocks:
          - type: paragraph
            body: >-
              Verkor should not be sized against every euro of electrification spend. The investable market is narrower:
              European lithium-ion cell demand that clears automotive and stationary-storage qualification, with extra
              value where buyers care about local supply, strategic autonomy, resilience criteria, and low-carbon
              manufacturing. That excludes most upstream mining and refining economics, finished vehicles, charging
              hardware, and non-European end demand. On the demand side, the most important fact is that Europe still
              has a policy-shaped floor under EV battery consumption. The Commission kept the 2025-2029 CO2 target at a
              15% fleet-average reduction versus the 2021 baseline even while allowing 2025-2027 averaging, and
              independent analysis still treats the 2035 zero-CO2 endpoint as a crucial anchor for investment
              expectations. The result is not a straight line to guaranteed volume, but it is a clearer demand signal
              than Europe would have without binding fleet rules. That matters for Verkor because a local cell plant
              does not need all European EV demand to move to work; it needs enough OEM programs to keep qualification
              pipelines and contracted offtake alive.
            claimRefs:
              - CM001
              - CM002
