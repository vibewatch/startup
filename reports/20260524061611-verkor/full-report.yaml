  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: >-
              Verkor competes in a European battery market that has sorted into four distinct buckets by mid-2026. First
              are European cell makers and startup-led projects that are genuinely close to Verkor on geography and
              industrial ambition: Northvolt, ACC, Envision AESC, Morrow, and the weaker legacy cases of FREYR,
              Italvolt, and Britishvolt. Second are OEM-backed battery arms such as Volkswagen's PowerCo, which are not
              startup peers in ownership structure but matter because they compete for the same automaker capex,
              engineering attention, and sovereign-support budgets. Third are Asian incumbents that either manufacture
              in Europe or can supply it at scale: CATL, LG Energy Solution, Samsung SDI, SK On, and BYD. Fourth is the
              status quo itself: proven NMC/LFP supply chains that buyers already know how to qualify, finance, and
              integrate.


              For Verkor, the core comparison is not simply 'European startup vs Chinese incumbent.' It is whether a
              French low-carbon, policy-backed, Renault-linked cell program can clear the same execution bar that
              defeated Northvolt, outmaneuver the retrenching ACC model, and still remain relevant against Asian and
              OEM-backed platforms that are ramping faster. Verkor's position is strongest where Europe-specific
              attributes matter—carbon intensity, industrial sovereignty, Renault adjacency, and proximity to French
              automotive logistics—but weakest where cost and multi-customer scale dominate. That makes the chapter less
              about headline technology and more about financing durability, plant status, customer capture, and the
              credibility of ramp evidence after Northvolt's collapse reset the market's trust threshold.
            claimRefs:
