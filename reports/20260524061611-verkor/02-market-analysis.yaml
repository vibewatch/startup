  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance
  rows:
  - - European passenger-EV battery cells
    - Qualified lithium-ion cells sold into EU passenger-car and van programs
    - Finished vehicles, packs sold outside Europe, and charging hardware
    - OEM platform procurement and treasury-approved sourcing teams
    - Core market because EU fleet rules and OEM localization shape demand
  - - Premium or performance OEM localization programs
    - Cells sold where low-carbon, local, or resilient supply carries strategic value
    - Generic commodity battery trade with no localization premium
    - OEM sourcing, engineering, and compliance functions
    - Relevant because Verkor is positioning into higher-spec local supply rather than the lowest-cost global pool
  - - Stationary storage cells
    - Cells for utility-scale, C&I, and selected behind-the-meter storage systems in Europe
    - Power-market software, EPC-only services, and non-battery storage technologies
    - Utilities, developers, integrators, and EPC-led buyers
    - Second demand pillar that can absorb cells outside auto cycles
  - - Policy-weighted public or supported procurement
    - Projects influenced by resilience, sustainability, or strategic-autonomy criteria
    - Pure merchant imports with no procurement or support-screening angle
    - Public buyers, scheme administrators, and project sponsors
    - Important because NZIA-style criteria can favour local or diversified supply
  - - Battery-industry adjacency
    - Some value from qualification support, local ecosystem formation, and cluster effects
    - Upstream mining economics and downstream finished-vehicle revenue
    - Mixed buyer set across the value chain
    - Useful adjacency but not the same as Verkor’s direct sellable cell market
  notes: This boundary keeps the chapter on monetizable European cell demand while explicitly excluding upstream raw materials and finished-vehicle revenue pools.
