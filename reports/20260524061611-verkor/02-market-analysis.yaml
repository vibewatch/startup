  title: Verkor’s size matters only with secure offtake
  body: Sixteen gigawatt-hours is meaningful for one entrant, but still only a small slice of Europe’s announced pipeline. The 50 GWh ambition becomes valuable only if Dunkirk converts localization advantages into durable qualification and cost wins.
