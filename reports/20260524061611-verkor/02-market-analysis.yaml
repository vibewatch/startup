  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: verkor-offtake-coverage
    missingEvidence: Signed offtake volumes by customer, platform, and timing for the 16 GWh phase and the path to 50 GWh.
    whyItMatters: Without customer-level offtake, public pipeline math cannot be turned into a credible Verkor SOM or utilization case.
    diligencePath: Obtain binding customer nominations, contracted ramp schedules, and any take-or-pay terms from management.
    relatedQuestionRefs:
    - QM024
    - QM025
    - QM026
    relatedTableRefs:
    - TM003
  - type: conflicting-data
    severity: material
    topic: realized-versus-announced-capacity
    missingEvidence: Project-level COD, utilization, and realized output data across the European gigafactory pipeline.
    whyItMatters: Public nameplate announcements likely overstate real supply, but the gap is central to judging whether Europe is actually overbuilt or merely over-announced.
    diligencePath: Reconcile tracker entries with plant disclosures, permitting, construction milestones, and utilization data from operators or local authorities.
    relatedQuestionRefs:
    - QM018
    - QM021
    - QM025
    relatedTableRefs:
    - TM002
    - TM003
  - type: missing-source
    severity: material
    topic: storage-cell-sourcing
    missingEvidence: Open-source evidence on how much European stationary-storage deployment is sourcing locally made versus imported cells.
    whyItMatters: Storage can look like a large second market on paper but may not benefit Verkor if import-heavy procurement remains the norm.
    diligencePath: Collect EPC and integrator procurement disclosures, customer references, or tender documents showing cell origin for recent European BESS projects.
    relatedQuestionRefs:
    - QM014
    - QM025
    relatedTableRefs:
    - TM004
  - type: private-evidence-only
    severity: material
    topic: dunkirk-cost-position
    missingEvidence: Contracted Dunkirk power terms, carbon-intensity assumptions, logistics costs, and delivered-cost benchmarks versus Polish, Hungarian, and Asian competitors.
    whyItMatters: Plant economics can determine competitiveness more than policy rhetoric, especially when Chinese prices are materially lower and Europe’s power prices vary widely.
    diligencePath: Request Verkor’s energy contracts, logistics assumptions, and delivered-cost bridge against target competitors.
    relatedQuestionRefs:
    - QM012
    - QM026
    relatedTableRefs:
    - TM005
