- id: TM005
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Unchanged 2025-2029 EU CO2 target
    - positive
    - current
    - Preserves an EV demand floor even with temporary averaging flexibility
    - Check which OEM platforms still need local European cells versus imported packs
  - - Credibility of the 2035 zero-CO2 pathway
    - positive if preserved / negative if weakened
    - current to medium-term
    - Shapes board-level confidence for battery and EV manufacturing investment
    - Pressure-test customer willingness to commit volumes if the 2035 signal weakens
  - - Stationary-storage market growth
    - positive
    - current to medium-term
    - Creates a second market for cells beyond passenger EVs
    - Clarify how much of Europe’s storage build will source European cells rather than imports
  - - NZIA resilience and support-scheme criteria
    - positive
    - current
    - Can improve the commercial case for localized supply in screened procurements
    - Identify which target customers are actually touched by resilience criteria
  - - Critical-raw-material dependence
    - negative
    - structural
    - Limits how autonomous Europe’s battery supply chain really is
    - Map Verkor’s material sourcing and refining exposure by chemistry
  - - Electricity-price dispersion across Europe
    - mixed
    - current
    - Location still matters because power cost dispersion remains wide
    - Benchmark Dunkirk power terms versus Poland, Hungary, and Nordics
  - - Asian incumbent operational scale
    - negative
    - current
    - LGES, SK-linked capacity, Samsung SDI, CATL, and BYD increase pressure on price and execution
    - Identify which rivals already hold qualified volumes with Verkor’s target OEMs
  - - Chinese battery price advantage
    - negative
    - current
    - Low-cost imports can compress margins even when Europe wants local supply
    - Estimate the premium buyers will pay for local and low-carbon supply
  - - Tariffs on China-made BEVs
    - mixed
    - current
    - They can slow finished-vehicle import pressure but do not fix Europe’s cell-cost gap
    - Assess whether OEM localization decisions actually change because of tariffs
  - - Announced gigafactory overcapacity and project distress
    - negative
    - current to 2030
    - Nameplate pipeline can outrun demand and crowd capital returns
    - Reconcile Verkor’s ramp plan against realistic realized-capacity scenarios, not headlines
  - - Hybrid resilience and gradual EV transition
    - negative
    - current
    - Auto demand is improving but not yet moving fast enough to absorb every announced project comfortably
    - Model downside cases where EV share rises slower than policy makers hope
  notes: This table mixes demand drivers with headwinds because Verkor’s market outcome depends on both policy support and whether Europe can translate that support into cost-competitive, realized local supply.
