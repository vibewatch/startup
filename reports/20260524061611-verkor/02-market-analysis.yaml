  title: The supply pipeline is already crowded
  body: Public trackers and the MDPI risk model both show a pipeline far larger than any easy demand narrative. Overcapacity, project failure, and delayed ramps are already visible.
  claimRefs:
  - CM029
  - CM035
  - CM036
  - CM037
