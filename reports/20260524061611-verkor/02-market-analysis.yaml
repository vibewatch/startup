chapter:
  number: 2
  title: Market Analysis
  summary: Verkor is entering a real but strategically contested European battery market. EU vehicle rules, a still-rising BEV mix, and fast-growing stationary storage create durable demand, but Europe’s supply response is already crowded, Asian-backed manufacturers still dominate operational capacity, and cheaper Chinese batteries plus uneven European power economics compress the room for error. Verkor’s 16 GWh first phase is meaningful for a single entrant yet still only a small slice of Europe’s announced pipeline, so the 50 GWh ambition depends more on secured offtake and cost position than on market-growth slogans.
sections:
- id: market-boundary-and-demand-floor
  title: Market Boundary and Demand Floor
  body: 'Verkor should not be sized against every euro of electrification spend. The investable market is narrower: European lithium-ion cell demand that clears automotive and stationary-storage qualification, with extra value where buyers care about local supply, strategic autonomy, resilience criteria, and low-carbon manufacturing. That excludes most upstream mining and refining economics, finished vehicles, charging hardware, and non-European end demand. On the demand side, the most important fact is that Europe still has a policy-shaped floor under EV battery consumption. The Commission kept the 2025-2029 CO2 target at a 15% fleet-average reduction versus the 2021 baseline even while allowing 2025-2027 averaging, and independent analysis still treats the 2035 zero-CO2 endpoint as a crucial anchor for investment expectations. The result is not a straight line to guaranteed volume, but it is a clearer demand signal than Europe would have without binding fleet rules. That matters for Verkor
    because a local cell plant does not need all European EV demand to move to work; it needs enough OEM programs to keep qualification pipelines and contracted offtake alive.'
  claimRefs:
