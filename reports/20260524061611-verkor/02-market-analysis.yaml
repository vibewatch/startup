- id: buyers-localisation-and-adoption-path
  title: Buyers, Localisation, and Adoption Path
  body: 'Buyer structure matters because Verkor is not selling to an abstract “European EV market.” In automotive, the practical customer is a vehicle platform, procurement, and compliance stack that must qualify cells on cost, chemistry, reliability, and supply-security grounds. In storage, the buyer is more often a utility, developer, integrator, or EPC that cares about project bankability, duration economics, and local-content or resilience scoring. European policy increasingly rewards localization at those decision points. The Net-Zero Industry Act adds resilience criteria where dependence on imported components is high, while the Batteries Regulation frames the sector as strategic to autonomy and circularity. That does not mean European plants automatically win. It means local producers can matter where procurement is shaped by policy, power-system resilience, or customer demand for lower-carbon supply. Verkor’s own siting rationale in Dunkirk—power access, logistics, and proximity
    to customers—fits that logic. For a new cell plant, adoption is therefore a sequence: regulation sustains demand, offtake is nominated, cells are qualified, the plant ramps, and only then do buyers treat the supply as bankable at scale.'
