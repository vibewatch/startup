    relatedQuestionRefs:
      - QE018
  - type: missing-source
    severity: material
    topic: stationary-storage-commercialisation
    missingEvidence: >-
      Named non-automotive customers, product SKUs, or revenue evidence for stationary-storage or off-highway
      deployments.
    whyItMatters: >-
      Stationary storage appears in positioning materials, but absent named deployments it should not be underwritten as
      a proven second revenue pillar.
    diligencePath: >-
      Ask management for the current non-automotive pipeline, sample status by customer, and any signed offtake or pilot
      contracts outside Renault/Alpine.
    relatedQuestionRefs:
      - QE007
  - type: missing-source
    severity: material
    topic: end-of-life-and-second-life
    missingEvidence: >-
      Operational details for any Veolia or other recycling arrangement, including scope, start date, feedstock type,
      and whether second-life repurposing is planned or excluded.
    whyItMatters: >-
      Scrap recycling at the plant is not the same as an end-of-life battery strategy, and the difference materially
      affects circularity claims and residual-value assumptions.
    diligencePath: >-
      Request the signed recycling memorandum or contract, process map for manufacturing scrap versus end-of-life packs,
      and any second-life business case documentation.
    relatedQuestionRefs:
      - QE014
  - type: private-evidence-only
