      - QE006
  - type: missing-source
    severity: blocking
    topic: public-performance-and-certification
    missingEvidence: >-
      Public or diligence-room evidence for energy density, power capability, fast-charge profile, cycle life,
      abuse-test results, and product certifications for the commercial cell.
    whyItMatters: >-
      Product maturity cannot be underwritten on process language alone; buyers and investors need quantitative
      performance and certification proof to judge competitiveness and launch readiness.
    diligencePath: >-
      Obtain the latest validation report, customer qualification matrix, and any UN38.3, IEC, UL, or OEM abuse-test
