evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance-gap
    missingEvidence: Current shareholder agreement, reserved matters schedule, committee structure, and minority-protection terms.
    whyItMatters: >-
      Board names alone do not show who can block financing, plant expansion, customer concentration, or future
      fundraising decisions.
    diligencePath: >-
      Request the current cap table, board charters, reserved-matters matrix, and any side-letter governance rights from
      management and lead investors.
    relatedQuestionRefs:
      - QO021
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: valuation-disclosure
    missingEvidence: Post-2024 valuation, share classes, and most recent priced-round economics.
    whyItMatters: >-
      Overview-level recommendation, dilution analysis, and downside framing are weak without a current market or
      negotiated equity value.
    diligencePath: >-
      Obtain the latest financing deck, board materials, and cap-table export showing ownership percentages and
      valuation terms after the May 2024 debt close and October 2024 equity additions.
    relatedQuestionRefs:
      - QO022
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: revenue-disclosure
    missingEvidence: >-
      Current revenue, ARR, margin profile, customer-pricing structure, and plant ramp assumptions behind the business
      plan.
    whyItMatters: >-
      Capital intensity is visible, but unit economics and near-term self-funding capacity cannot be judged from public
      materials alone.
    diligencePath: >-
      Request the current business plan, lender base case, customer pricing schedule, and monthly operating dashboard
      for Grenoble and Dunkirk.
    relatedQuestionRefs:
      - QO023
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: >-
      Signed customer backlog beyond Renault and Alpine, including product mix, minimum-volume commitments, and timing
      of second-customer ramps.
    whyItMatters: >-
      The public story is strong on Renault but thin on multi-customer diversification, which is important if ramp or
      program timing shifts.
    diligencePath: >-
      Request the contracted order book, top-customer concentration schedule, LOIs, and current commercial pipeline
      segmented by EV versus stationary-storage applications.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: verkor-offtake-coverage
    missingEvidence: Signed offtake volumes by customer, platform, and timing for the 16 GWh phase and the path to 50 GWh.
    whyItMatters: >-
      Without customer-level offtake, public pipeline math cannot be turned into a credible Verkor SOM or utilization
      case.
    diligencePath: Obtain binding customer nominations, contracted ramp schedules, and any take-or-pay terms from management.
    relatedQuestionRefs:
      - QM024
      - QM025
      - QM026
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: material
    topic: realized-versus-announced-capacity
    missingEvidence: Project-level COD, utilization, and realized output data across the European gigafactory pipeline.
    whyItMatters: >-
      Public nameplate announcements likely overstate real supply, but the gap is central to judging whether Europe is
      actually overbuilt or merely over-announced.
    diligencePath: >-
      Reconcile tracker entries with plant disclosures, permitting, construction milestones, and utilization data from
      operators or local authorities.
    relatedQuestionRefs:
      - QM018
      - QM021
      - QM025
    relatedTableRefs:
      - TM002
      - TM003
  - type: missing-source
    severity: material
    topic: storage-cell-sourcing
    missingEvidence: >-
      Open-source evidence on how much European stationary-storage deployment is sourcing locally made versus imported
      cells.
    whyItMatters: >-
      Storage can look like a large second market on paper but may not benefit Verkor if import-heavy procurement
      remains the norm.
    diligencePath: >-
      Collect EPC and integrator procurement disclosures, customer references, or tender documents showing cell origin
      for recent European BESS projects.
    relatedQuestionRefs:
      - QM014
      - QM025
    relatedTableRefs:
      - TM004
  - type: private-evidence-only
    severity: material
    topic: dunkirk-cost-position
    missingEvidence: >-
      Contracted Dunkirk power terms, carbon-intensity assumptions, logistics costs, and delivered-cost benchmarks
      versus Polish, Hungarian, and Asian competitors.
    whyItMatters: >-
      Plant economics can determine competitiveness more than policy rhetoric, especially when Chinese prices are
      materially lower and Europe’s power prices vary widely.
    diligencePath: Request Verkor’s energy contracts, logistics assumptions, and delivered-cost bridge against target competitors.
    relatedQuestionRefs:
      - QM012
      - QM026
    relatedTableRefs:
      - TM005
  - type: private-evidence-only
    severity: material
    topic: verkor-ramp-metrics
    missingEvidence: Public disclosure of Dunkirk serial-production yield, scrap rate, OEE, and customer qualification metrics.
    whyItMatters: >-
      Northvolt shifted the market from capacity-story underwriting to ramp-metric underwriting; without those
      datapoints Verkor's financing credibility remains only partially evidenced.
    diligencePath: >-
      Request lender, customer, or management materials covering line yield, scrap trend, validation milestones, and
      audited production cadence.
    relatedQuestionRefs:
      - QP023
      - QP024
    relatedTableRefs:
      - TP004
  - type: missing-source
    severity: material
    topic: verkor-customer-diversification
    missingEvidence: Named offtake agreements or committed volumes for customers beyond Alpine / Renault.
    whyItMatters: >-
      A single-anchor ramp can still be commercially fragile if expansion financing depends on a broader order book than
      the public record currently shows.
    diligencePath: >-
      Seek customer references, procurement disclosures, or financing materials that identify non-Renault contracted
      volumes and timing.
    relatedQuestionRefs:
      - QP022
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: minor
    topic: aesc-douai-phase-two
    missingEvidence: Current phase-two timing and broader customer disclosure for Envision AESC's Douai site.
    whyItMatters: >-
      Without phase-two timing, the comparison between Verkor and AESC on French scale remains directionally useful but
      incomplete.
    diligencePath: >-
      Look for 2026 Envision AESC France releases, customer sourcing announcements, or French regional filings on Douai
      capacity expansions.
    relatedQuestionRefs:
      - QP025
    relatedTableRefs:
      - TP002
  - type: stale
    severity: minor
    topic: italvolt-current-status
    missingEvidence: A 2025-2026 primary or top-tier source confirming Italvolt's current legal and operating status in Europe.
    whyItMatters: >-
      Italvolt is legacy context rather than a core live competitor, but fresher evidence would tighten the chapter's
      view of residual European aspirants.
    diligencePath: >-
      Search Italian court filings, local business registries, or company statements to confirm whether the Europe
      vehicle remains active beyond the 2024 crisis coverage.
    relatedQuestionRefs:
      - QP017
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: blocking
    topic: revenue-quality
    missingEvidence: Management or audited disclosure of 2025-2026 revenue, gross margin and working-capital metrics.
    whyItMatters: >-
      The chapter can point to contracts and first deliveries, but it cannot convert GWh commitments into recognized
      revenue quality or gross profit without actual financial statements.
    diligencePath: >-
      Request monthly revenue, gross-margin and cash-collection bridges by customer from 2025 through the latest
      available month.
    relatedQuestionRefs:
      - QI018
      - QI021
    relatedTableRefs:
      - TI004
      - TI006
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: >-
      Executed pricing formulae, take-or-pay terms, escalation clauses and penalties under the Renault offtake and any
      other customer contracts.
    whyItMatters: >-
      Without realized pricing or contract structure, the strongest commercialization evidence still cannot be
      translated into revenue or contribution margin.
    diligencePath: >-
      Request the Renault supply agreement economics, top-customer pricing logic and any public/private comparable
      contract excerpts.
    relatedQuestionRefs:
      - QI019
      - QI020
    relatedTableRefs:
      - TI002
      - TI003
  - type: conflicting-data
    severity: material
    topic: green-loan-structure
    missingEvidence: >-
      Definitive debt closing memorandum reconciling the €961 million commercial-bank senior figure with Natixis’s €1.2
      billion senior-debt framing, plus covenants and amortization.
