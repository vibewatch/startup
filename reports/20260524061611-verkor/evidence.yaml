    whyItMatters: >-
      Without a second named OEM customer, concentration risk remains the dominant commercial fact and the remaining
      phase-one capacity cannot be underwritten confidently.
    diligencePath: Request current customer pipeline by stage, signed MOUs or contracts, and any reserved capacity outside Renault.
