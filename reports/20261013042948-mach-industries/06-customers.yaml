callouts:
  - calloutType: "risk"
    title: "The Valley of Death in Defense Procurement"
    body: "While Mach Industries has demonstrated rapid engineering velocity taking Viper from contract to autonomous flight in under six months, the U.S. defense acquisition framework poses a steep transition hurdle. Prototype awards from the Army Applications Laboratory and Defense Innovation Unit are non-recurring development grants that do not guarantee transition into high-volume Programs of Record. With private venture capital underwriting manufacturing expansion at Forge 1, failure to secure formal production line items within the standard two-year appropriation cycle would leave significant factory throughput unmonetized."
    claimRefs:
      - "CU001"
      - "CU007"
      - "CU010"
      - "CU015"
  - calloutType: "insight"
    title: "Allied NATO Demonstration Signals Export Pathway"
    body: "By showcasing Viper at MILEX VANGUARD 2026 to Lithuanian and Estonian armed forces, Mach Industries is actively testing an allied export pathway that complements domestic procurement. The platform's 290 km strike range and 10 kg warhead are deliberately calibrated below Missile Technology Control Regime Category I thresholds, lowering foreign military sales regulatory hurdles. Allied endorsements on NATO's eastern frontier provide meaningful operational credibility, though formal bilateral procurement contracts remain unexecuted."
    claimRefs:
      - "CU003"
      - "CU011"
