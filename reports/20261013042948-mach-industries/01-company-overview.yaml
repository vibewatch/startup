callouts:
  - calloutType: "insight"
    title: "Rapid Valuation Escalation Outpaces Disclosure Transparency"
    body: "Mach Industries' valuation expanded from $470 million in June 2025 to $1.8 billion in June 2026, and then doubled again to $3.7 billion in September 2026 following a $600 million extension. While this trajectory reflects immense investor conviction in sovereign defense autonomy, it outpaces public verification of operating fundamentals, as revenue, customer contract backlog, and unit margins remain entirely undisclosed."
    claimRefs:
      - "CO003"
      - "CO004"
      - "CO015"
  - calloutType: "risk"
    title: "International Regulatory Headwinds for Autonomous Weapons Systems"
    body: "As Mach Industries expands demonstrations of autonomous strike systems like Viper with NATO allies, international human rights organizations and the United Nations are actively pushing for legally binding restrictions on lethal autonomous weapons systems that lack meaningful human control. Future export controls and multilateral treaties represent material regulatory hurdles for long-term international expansion."
    claimRefs:
      - "CO010"
      - "CO012"
      - "CO013"
