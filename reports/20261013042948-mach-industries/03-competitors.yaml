callouts:
  - calloutType: insight
    title: The Cost-Exchange Dilemma in Counter-UAS Warfare
    body: Defending military assets against massed drone swarms requires fundamentally resetting air-defense economics. Expending multi-million-dollar traditional surface-to-air missile interceptors against attritable Group 1 through 3 attack drones rapidly exhausts magazine depth and defense budgets during high-salvo saturation engagements.
    claimRefs:
      - CP003
      - CP005
  - calloutType: risk
    title: Incumbent Supply-Chain Retaliation and SRM Allocation Risk
    body: While Mach acquired Exquadrum and launched Mach Propulsion to mitigate solid rocket motor and microturbine bottlenecks, legacy defense primes with entrenched DoD relationships maintain substantial leverage over broader component supply chains and high-volume defense procurement programs.
    claimRefs:
      - CP009
      - CP010
      - CP014
