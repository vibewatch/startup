      - Legacy Primes
    rows:
      - - C-UAS Interception
        - Dart kinetic interceptor with FMCW radar
        - Roadrunner-M turbojet VTOL interceptor
        - Non-kinetic optical tracking & sensing
        - Patriot / NASAMS / Stinger missile batteries
      - - Vertical Takeoff & Landing
        - Viper and Strategic Strike (290 km VTO)
        - Roadrunner-M recoverable vertical landing
        - Micro-UAS tactical vertical takeoff
        - Predominantly fixed-wing or runway dependent
      - - Propulsion Integration
        - Internal Mach Propulsion & Exquadrum SRMs
        - Internal turbojet design & assembly
        - Commercial electric multi-rotor motors
        - Aerojet / Northrop solid rocket motor duopoly
      - - Autonomy & Software Stack
        - Edge RF & computer vision strike targeting
        - Lattice command-and-control mesh network
        - Autonomous 360-degree obstacle avoidance AI
        - Custom government-owned legacy mission software
      - - Unit Cost & Scalability
        - Low-to-mid five-figure expendable targets
        - Premium recoverable airframe investment
        - Commercial enterprise tier hardware pricing
        - High six-figure to multi-million dollar munitions
    notes: Comparative criteria based on public contract awards, specifications, and company disclosures; software benchmarks lack public independent scoring.
