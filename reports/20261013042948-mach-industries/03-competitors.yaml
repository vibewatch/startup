  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - Platform / Vendor
      - Contract / Cost Model
      - Estimated Unit Cost
      - Included Capabilities
      - Cost Implication / Uncertainty
    rows:
      - - Dart (Mach Industries)
        - Expendable kinetic interceptor procurement
        - Low-to-mid $10,000s (estimated)
        - FMCW ground radar and interceptor stack
        - Optimized for swarm saturation; production unit costs unverified
      - - Roadrunner-M (Anduril)
        - Fixed-price development ($250M for 500 units)
        - ~$500,000 blended lot average
        - VTOL turbojet interceptor with recoverable landing
        - Lower net cost per false alarm; capital-intensive upfront buy
      - - Traditional SAMs (Primes)
        - Cost-plus weapon system sustainment contracts
        - $400,000 to $4,000,000+ per missile
        - High-altitude radar, missile, launcher integration
        - Economically unsustainable against cheap Group 1-3 attack swarms
      - - Skydio X10 / Defense UAS
        - Hardware purchase plus enterprise autonomy license
        - $20,000 to $50,000 per tactical kit
        - NDAA-compliant autonomous reconnaissance UAS
        - Low airframe cost but requires separate kinetic weapon integration
    notes: Pricing reflects public DoD contract values and industry analyst estimates; precise unit flyaway costs remain classified or undisclosed.
