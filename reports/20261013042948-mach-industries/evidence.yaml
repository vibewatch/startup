evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-transparency
    missingEvidence: >-
      Audited financial statements confirming Mach Industries' annual revenue, gross margins, cash burn rate, cash
      balance, and defense contract backlog.
    whyItMatters: >-
      Without verified revenue or margin data, underwriting the $3.7 billion Series C valuation relies purely on
      headline venture multiples rather than operating performance.
    diligencePath: >-
      Request confidential management financial pack, revenue quality breakdown by program, and audited income
      statements under non-disclosure agreement.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: minor
    topic: governance-transparency
    missingEvidence: >-
