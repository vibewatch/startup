schemaVersion: report-v2
artifact: financials
slug: mach-industries
runDate: '2026-10-13'
company:
  name: Mach Industries
chapter:
  number: 4
  title: Financials
  summary: >-
    Mach Industries has mobilized over $1.08 billion in total equity capital—punctuated by a $600 million Series C
    extension in September 2026 valuing the defense hardware manufacturer at $3.7 billion—to finance high-rate
    manufacturing infrastructure across its Forge network. However, public disclosure of recognized revenue, ARR, gross
    margin, backlog, and cash burn remains entirely absent, leaving institutional underwriting dependent on milestone
    proxies from prototype defense contracts such as the U.S. Army Strategic Strike cruise missile program.
sections:
  - id: revenue-architecture-and-gtm
    title: Revenue Architecture and GTM Motion
    body: >-
      Mach Industries operates an emerging defense-hardware business model structured around two complementary
      monetization tiers: proprietary autonomous strike platforms and merchant subsystem component sales. The company
      has secured non-dilutive developmental capital from defense research authorities, notably winning a contract in Q3
      2024 from the Army Applications Laboratory to develop Strategic Strike, a vertical-takeoff (VTO) cruise missile
      designed for maneuver units. In addition to primary airframes such as the Viper vertical-takeoff attack drone and
      Dart counter-UAS interceptor, Mach monetizes critical propulsion subcomponents through its Mach Propulsion and
      Mach Energetics divisions, selling jet engines and solid rocket motors to third-party defense manufacturers.
      Go-to-market execution relies on rapid operational experimentation, demonstrated by live flight exercises at MILEX
      VANGUARD 2026 for Lithuanian and Estonian armed forces, followed by diplomatic and military procurement showcases
      hosted with the U.S. Embassy in Vilnius.
    claimRefs:
      - CI001
      - CI003
      - CI004
      - CI005
      - CI011
    tableRefs:
      - TI001
  - id: pricing-monetization-and-unit-economics
    title: Monetization Models and Unit Economics Benchmarks
    body: >-
      Pricing and realized unit economics across Mach Industries' product portfolio remain strictly confidential,
      reflecting the opaque procurement dynamics of venture-backed defense hardware. Official company communications
      emphasize an attritable, hardware-first design philosophy intended to deliver cruise missile ranges and precision
      strike effects at substantially lower price points than legacy prime contractors. To achieve structural cost
      advantages, Mach acquired solid rocket motor specialist Exquadrum for $50 million in May 2026 and launched
      in-house microturbine manufacturing via Mach Propulsion, aiming to bypass high subcontractor markups and 7-to-10
      month lead times from legacy propulsion suppliers. However, because Mach discloses no audited invoice rates,
      bill-of-materials costs, gross margins, or volume discounts, institutional investors cannot yet verify whether
      realized unit production costs achieve positive gross margins under fixed-price defense procurement agreements.
    claimRefs:
      - CI003
      - CI007
      - CI008
      - CI012
      - CI013
    tableRefs:
      - TI002
      - TI003
  - id: capital-adequacy-and-financing-dependency
    title: Capital Adequacy, Valuation Trajectory, and Burn Profile
    body: >-
      Mach Industries has experienced an extraordinary capitalization trajectory over the trailing twelve months,
      transitioning from an early-stage hardware startup to one of the most heavily capitalized private defense
      companies in the United States. Following a $100 million Series B at a $470 million valuation in June 2025 and a
      $300 million Series C at a $1.8 billion valuation in June 2026, the company closed a $600 million Series C
      extension in September 2026 that doubled its valuation to $3.7 billion. Backed by top-tier venture investors
      including Sequoia Capital, Ribbit Capital, Infinite Capital, and Bedrock Capital, this substantial cash cushion
      funds aggressive capital expenditures. Significant outlays include operating the 115,000-square-foot Forge 1
      facility in Huntington Beach, constructing a dedicated jet engine plant with 12,000-unit annual capacity, and
      funding the $50 million Exquadrum acquisition, creating a substantial monthly cash burn rate that necessitates
      eventual multi-year production contract transitions.
    claimRefs:
      - CI001
      - CI002
      - CI006
      - CI009
      - CI010
    figureRefs:
      - FI001
  - id: financial-verdict-and-diligence-blockers
    title: Financial Verdict and Underwriting Blockers
    body: >-
      From an institutional underwriting perspective, Mach Industries presents a bifurcated profile characterized by
      peer-leading capitalization paired with acute disclosure boundaries. While the company has demonstrated impressive
      engineering velocity—locking Strategic Strike design in 14 weeks and flying prototype aircraft rapidly—the
      commercial reality is that zero recognized revenue, ARR, or firm-fixed-price backlog figures are publicly
      verifiable. Independent defense analysis underscores that a $3.7 billion valuation demands a revenue trajectory
      achievable only through major programs of record, not prototype demonstrations or non-recurring engineering
      awards. Consequently, underwriting Mach Industries requires deep diligence access into confidential contract line
      item values, facility capital expenditure schedules, and detailed customer pipeline conversion rates.
    claimRefs:
      - CI001
      - CI002
      - CI010
      - CI014
      - CI015
callouts:
  - calloutType: risk
    title: Valuation Disconnect and Manufacturing Scale Hurdle
    body: >-
      The rapid doubling of Mach Industries' valuation to $3.7 billion in September 2026 creates an aggressive
      commercial revenue expectation. Independent aerospace analysis notes that this valuation level demands multi-year
      Department of Defense programs of record rather than prototype demonstrations, creating severe multiple
      compression risk if manufacturing scale-up falters.
    claimRefs:
      - CI001
      - CI002
      - CI010
  - calloutType: insight
    title: Vertical Integration as Gross Margin Defense
    body: >-
      By acquiring solid rocket motor manufacturer Exquadrum for $50 million and building a 12,000-engine annual
      capacity plant through Mach Propulsion, Mach Industries aims to internalize propulsion margins and eliminate
      component supply bottlenecks that typically depress hardware gross margins.
    claimRefs:
      - CI003
      - CI007
      - CI008
      - CI009
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Revenue Stream
      - Commercial Mechanism
      - Billing / Delivery Unit
      - Current Status & Traction
      - Revenue Quality
      - Diligence Requirement
    rows:
      - - DoD Prototype & Development Contracts
        - Cost-plus / fixed-price R&D (Army Applications Lab)
        - Milestone deliverables & flight demonstrations
        - Active (Strategic Strike VTO cruise missile awarded Q3 2024)
        - Moderate (non-recurring engineering, capped margins)
        - Contract value, milestone schedule, and IP rights
      - - Attritable Weapon Systems (Viper / Dart / Pike)
        - Firm-fixed-price production / OTA procurement
        - Per-unit airframe & munition delivery
        - Demonstration phase (Viper live flight at MILEX VANGUARD 2026)
        - High (scalable volume, program-of-record potential)
        - Lot pricing, procurement pipeline, and unit bill of materials
      - - Mach Propulsion (Microturbine & Jet Engines)
        - Component OEM sales & internal consumption
        - Per-engine delivery (planned 12,000/yr capacity)
        - Under construction (announced March 2025)
        - High (critical dual-use supply bottleneck)
        - Capex to commercial readiness, initial customer commitments
      - - Mach Energetics (Solid Rocket Motors & Energetics)
        - Propulsion subsystem supply & defense contracts
        - Per-motor delivery & test integration
        - Commercial operating unit (formed via $50M Exquadrum acquisition)
        - High (incumbent duopoly bypass, external customer sales)
        - Merchant order book, facility throughput, and backlog
      - - Forge Manufacturing Network Services
        - Contract manufacturing & partner production
        - Facility utilization & co-developed platform delivery
        - Active partnership with HevenDrones (Forge Huntington)
        - Moderate (lower margin manufacturing pass-through)
        - Revenue-share agreements and factory capacity utilization
    notes: >-
      Categorization reflects publicly disclosed business lines and press announcements; contract values and exact
      revenue contribution by stream remain undisclosed private metrics.
    claimRefs:
      - CI003
      - CI004
      - CI005
      - CI007
      - CI008
      - CI011
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Platform / Component
      - Contract Model
      - List Pricing
      - Realized Pricing Status
      - Unknowns & Discounts
      - Evidence Basis
    rows:
      - - Strategic Strike VTO Cruise Missile
        - Army Development Contract (AAL)
        - Undisclosed private rate
        - Milestone development funding (unrealized production)
        - Firm-fixed-price lot targets unknown
        - Army Applications Laboratory contract announcement (Q3 2024)
      - - Viper VTOL Attack Platform
        - Allied military sales & DoD procurement
        - Undisclosed (targeted low-cost strike)
        - Demonstration flights; zero confirmed production sales
        - Volume discounts and allied export pricing unknown
        - Live flight demonstrations at MILEX VANGUARD 2026
      - - Dart Counter-UAS Interceptor
        - Defense procurement (counter-swarm)
        - Undisclosed (targeted low-cost intercept)
        - Announced product line; sales status undisclosed
        - Cost-per-shot vs intercept target ratio unknown
        - Mach Industries company product release (Jan 2026)
      - - Solid Rocket Motors (Mach Energetics)
        - Subsystem supply contracts
        - Custom engineering & unit pricing
        - Operational revenue from acquired Exquadrum contracts
        - Merchant customer pricing versus internal transfer pricing unknown
        - TechCrunch reporting and Exquadrum acquisition coverage
      - - Micro-Jet Engines (Mach Propulsion)
        - Subsystem OEM supply
        - Undisclosed unit price
        - Pre-production (facility under development)
        - Break-even unit cost vs JetCat benchmark unknown
        - Mach Propulsion division launch announcement (March 2025)
    notes: >-
      List and realized pricing metrics for private defense hardware remain confidential; figures represent contract
      mechanisms rather than audited invoice rates.
    claimRefs:
      - CI004
      - CI005
      - CI007
      - CI008
      - CI011
      - CI012
  - id: TI003
    title: Unit economics table
    columns:
      - Unit Economics Metric
      - Reported Value
      - Confidence
      - Underwriting Relevance
      - Diligence Requirement
    rows:
      - - Annual Recurring Revenue (ARR)
        - null
        - low
        - Indicates recurring maintenance and software-enabled subscriptions
        - Audited GAAP income statement or revenue bridge
      - - Recognized Annual Revenue
        - null
        - low
        - Establishes baseline commercial scale and revenue velocity
        - FY2024-FY2025 revenue breakdown by contract type
      - - Gross Margin Percentage
        - null
        - low
        - Reflects vertical integration efficiency vs subcontracting costs
        - Cost of goods sold (COGS) schedule for hardware platforms
      - - Monthly Net Burn Rate
        - null
        - low
        - Determines cash consumption and forward runway dependency
        - Trailing 12-month operating cash flow and burn analysis
      - - Airframe Unit Production Cost
        - null
        - low
        - Proves attritable defense cost-advantage vs prime contractors
        - Bill of materials (BOM) cost per delivered platform
    notes: >-
      All unit economics fields are private and undisclosed as of October 2026; null values reflect reporting boundaries
      of private venture-backed defense startups.
    claimRefs:
      - CI012
      - CI013
      - CI014
      - CI015
