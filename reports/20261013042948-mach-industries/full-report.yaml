      - number: '4.2'
        title: Monetization Models and Unit Economics Benchmarks
        blocks:
          - type: paragraph
            body: >-
              Pricing and realized unit economics across Mach Industries' product portfolio remain strictly
              confidential, reflecting the opaque procurement dynamics of venture-backed defense hardware. Official
              company communications emphasize an attritable, hardware-first design philosophy intended to deliver
              cruise missile ranges and precision strike effects at substantially lower price points than legacy prime
              contractors. To achieve structural cost advantages, Mach acquired solid rocket motor specialist Exquadrum
              for $50 million in May 2026 and launched in-house microturbine manufacturing via Mach Propulsion, aiming
              to bypass high subcontractor markups and 7-to-10 month lead times from legacy propulsion suppliers.
              However, because Mach discloses no audited invoice rates, bill-of-materials costs, gross margins, or
              volume discounts, institutional investors cannot yet verify whether realized unit production costs achieve
              positive gross margins under fixed-price defense procurement agreements.
            claimRefs:
