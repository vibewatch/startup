chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Founding, and Core Mission
        blocks:
          - type: paragraph
            body: >-
              Mach Industries represents an ambitious entrant in the modern defense industrial base, organized around
              the premise that future sovereign conflicts will be decided by low-cost, mass-manufactured autonomous
              systems rather than scarce, exquisite military hardware. Established in 2023 by Ethan Thornton, the
              company maintains its primary corporate headquarters and primary manufacturing campus in Huntington Beach,
              California. Mach's stated strategic objective is to develop and manufacture asymmetric aerospace and
              defense systems and components by the millions to deter war and advance prosperity. Operating across
              autonomous strike, counter-UAS, high-altitude surveillance, and propulsion subsystems, Mach combines
              in-house hardware engineering with vertically integrated production lines designed to bypass brittle
              commercial supply chains and accelerate defense fielding schedules.
            claimRefs:
              - CO001
              - CO002
              - CO007
              - CO014
          - type: table
            tableRef: TO001
            claimRefs:
