      - number: '6.2'
        title: Adoption Trajectory & Contract Mechanics
        blocks:
          - type: paragraph
            body: >-
              The adoption trajectory of Mach Industries is defined by exceptional prototyping speed contrasted against
              the structurally protracted nature of Department of Defense procurement cycles. The company moved from
              contract award to flight demonstration in under six months, locking design specifications within weeks and
              executing autonomous wingborne cruise flights under military observation in January 2025. While this
              hardware iteration velocity has earned praise from defense innovation sponsors, the commercial nature of
              these engagements remains strictly developmental. As of 2026, Mach's federal engagements consist of Other
              Transaction Authority (OTA) prototype agreements, Small Business Innovation Research (SBIR) awards, and
              fast-track experimental challenges rather than procurement contracts tied to funded Major Defense
              Acquisition Programs. The U.S. Army's Strategic Strike agreement with AAL represents an evaluation
              initiative that puts experimental hardware in the hands of warfighters to refine operational concepts,
              rather than a production purchase order. To bridge this classic acquisition valley of death, Mach has
              raised $485 million in venture capital through Series C, using private balance sheet equity to build its
              115,000-square-foot Forge 1 facility and target a monthly capacity of 1,000 Viper systems ahead of formal
              procurement decisions.
            claimRefs:
              - CU001
              - CU002
              - CU007
              - CU010
              - CU015
