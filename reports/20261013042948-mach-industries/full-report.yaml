      - number: '7.3'
        title: Supply Chain Chokepoints and Military Customer Concentration
        blocks:
          - type: paragraph
            body: >-
              A critical vulnerability in Mach Industries near-term execution is its reliance on single-source suppliers
              and concentrated military development programs. For its flagship U.S. Army Strategic Strike contract, Mach
              partnered with German manufacturer JetCat to supply micro-jet turbine engines. While Mach has launched a
              specialized propulsion division aimed at building a domestic factory with an ambitious 12,000 annual
              engine capacity, constructing and qualifying microturbine manufacturing requires specialized metallurgical
              tooling, precision balancing, and experienced engineering talent that remains unproven at scale. On the
              demand side, Mach relies heavily on research and prototyping awards from the Army Applications Laboratory
              and Defense Innovation Unit. Until these experimental development efforts transition into multi-year
              Programs of Record with dedicated congressional appropriations, revenue visibility remains fragile and
              susceptible to shifting Pentagon modernization priorities.
            claimRefs:
