  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Defense Autonomy Sizing, and Segment Decomposition
        blocks:
          - type: paragraph
            body: >-
              The market for defense autonomy is undergoing a fundamental structural transition, driven by modern
              battlefield lessons in Ukraine and the Middle East that have proven the effectiveness of low-cost,
              decentralized unmanned systems against traditional capital-intensive defense assets. Mach Industries
              defines its addressable boundary across four interrelated hardware domains: attritable vertical-takeoff
              strike unmanned aerial systems (UAS), low-cost kinetic counter-UAS interceptors, high-altitude
              pseudo-satellites for communications and sensing, and critical defense propulsion subcomponents including
              jet engines and solid rocket motors. Rather than competing directly against prime contractors for
              exquisite multi-million dollar piloted combat aircraft, Mach targets the low-cost attritable tier where
              volume, cost-per-shot, and launch independence determine operational utility. This boundary deliberately
              includes external propulsion and energetics supply to other defense manufacturers, turning industry-wide
              supply chain shortages into a secondary commercial revenue engine.
            claimRefs:
              - CM001
              - CM002
              - CM007
              - CM008
              - CM012
              - CM013
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM007
              - CM008
              - CM012
              - CM013
              - CM014
      - number: '2.2'
        title: 'Constrained Market Sizing Lenses: DAWG, Replicator, and Munitions Replenishment'
        blocks:
          - type: paragraph
            body: >-
              Evaluating Mach Industries addressable market requires sizing through distinct budgetary and volume lenses
              rather than relying on a single top-down defense aerospace figure. At the macro level, the U.S. Department
              of Defense fiscal year 2027 budget request seeks $1.5 trillion in total funding, proposing an
              unprecedented surge of over $70 billion allocated to military drones and counter-drone systems, including
              $53.6 billion for autonomy, drone platforms, and contested logistics. Within this envelope, the Defense
              Autonomous Warfare Group (DAWG)—the high-level successor to the Pentagon Replicator initiative—represents
              the primary demand funnel, requesting $54.6 billion in research and development funding to acquire and
              deploy thousands of attritable autonomous systems. This budgetary expansion aligns with Pentagon volume
              targets calling for more than 300,000 small autonomous systems across the armed services. Sizing this
              demand against Mach announced manufacturing capacity of 12,000 jet engines annually indicates substantial
              headroom, provided the company can convert early prototype wins into sustained production share.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM006
              - CM010
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM006
              - CM014
          - type: figure
            figureRef: FM001
            claimRefs:
