  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Portfolio and Mission Architecture
        blocks:
          - type: paragraph
            body: >-
              Mach Industries develops a diversified family of attritable autonomous unmanned platforms engineered to
              fulfill multi-domain defense mission requirements at scale. The company's flagship system is the Viper
              vertical takeoff and landing strike unmanned aerial system, complemented by the Dart low-cost kinetic
              counter-UAS interceptor designed for defeating adversarial drone swarms. For long-range theater
              operations, Mach is advancing the Stratos stratospheric pseudo-satellite for extended communications and
              surveillance relay, the Glide precision munition, and the Pike mass-deployable standoff munition platform.
              The company also secured an experimental contract from the Defense Innovation Unit for a
              runway-independent maritime strike aircraft. Unlike software-only defense entrants, Mach combines airframe
              development with hardware-first vertical integration across energetics and propulsion subcomponents,
              seeking to establish a resilient industrial base.
