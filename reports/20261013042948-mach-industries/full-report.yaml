      - number: '5.4'
        title: Autonomy, Guidance, and Regulatory Compliance
        blocks:
          - type: paragraph
            body: >-
              Operating in contested electronic warfare and GPS-denied environments requires sophisticated onboard
              guidance and targeting autonomy. Mach Industries is integrating artificial intelligence visual navigation
              and RF sensing capabilities into its Strategic Strike platform to ensure terminal guidance without
              continuous satellite navigation or vulnerable communication links. However, the deployment of lethal
              autonomous weapons capable of terminal engagement raises profound ethical, legal, and regulatory scrutiny.
              International non-governmental organizations such as Human Rights Watch have cautioned that autonomous
              algorithms struggle to reliably distinguish between combatants and non-combatants in dynamic combat
              environments. Furthermore, while Mach reports rapid prototype iteration and flight demonstrations,
              critical technical parameters—including mass-production component yields, hardware reliability metrics,
              and cost-per-shot curves—remain undisclosed private data, posing substantial underwriting risks.
            claimRefs:
              - CE012
              - CE013
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Vertical Integration as Supply-Chain Moat in Autonomous Defense
            body: >-
              Mach Industries' aggressive moves into solid rocket motors through its $50 million Exquadrum acquisition
              and microturbine engines via Mach Propulsion directly target the two most severe industrial bottlenecks in
              modern tactical munitions. By producing critical propulsion components in-house rather than relying on
              consolidated legacy defense suppliers with multi-month lead times, Mach seeks to achieve unprecedented
              production velocity and unit cost advantages.
            calloutType: insight
            claimRefs:
              - CE004
              - CE005
              - CE008
          - type: callout
            title: Autonomous Engagement Policies and Sensor Verification Gaps
            body: >-
              While Mach Industries is engineering optical and RF sensing to operate in GPS- and communications-denied
              operational environments, fielding fully autonomous terminal engagement capabilities faces acute
              regulatory, humanitarian, and operational scrutiny. The lack of public data regarding target
              discrimination error rates and failsafe mechanisms represents a critical technical diligence gap for
              institutional underwriters.
            calloutType: risk
            claimRefs:
