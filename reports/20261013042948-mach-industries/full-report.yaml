      - number: '6.3'
        title: Named Operational Engagements & Allied Live Proof
        blocks:
          - type: paragraph
            body: >-
              Public evidence of customer adoption centers on three primary defense organizations: the U.S. Army
              Applications Laboratory, the Defense Innovation Unit, and NATO Baltic partner militaries. Mach's flagship
              proof point is the AAL Strategic Strike contract awarded in Q3 2024, under which Mach demonstrated full
              vertical takeoff, transition to wingborne flight, and simulated terminal engagement for company- through
              brigade-level elements. In June 2026, the Defense Innovation Unit awarded Mach an additional prototype
              contract for a Runway Independent Maritime Expeditionary Strike Capability under its Atlas platform,
              signaling expanding interest from expeditionary maritime operators. Beyond domestic defense agencies, Mach
              has actively demonstrated systems to allied armed forces. In July 2026, Mach participated in the MILEX
              VANGUARD 2026 military exercise at Lithuania's Rūdininkai training area, conducting live demonstration
              flights of the Viper platform for defense leadership from Lithuania and Estonia. Lithuanian Minister of
              National Defence Robert Kaunas publicly commended the technology for addressing Baltic airspace protection
              needs, while U.S. diplomatic representatives highlighted the demonstration as a model for allied
              industrial cooperation. However, these allied demonstrations remain exploratory evaluations, with no
              signed Foreign Military Sales letters of offer and acceptance or bilateral purchase contracts confirmed to
              date.
            claimRefs:
