  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Defense Customer Base & Mission Segmentation
        blocks:
          - type: paragraph
            body: >-
              Mach Industries focuses its customer development entirely on military and defense end-users, dividing its
              target market across three principal mission profiles: tactical ground combat units, theater installation
              defenders, and allied sovereign forces. In tactical ground warfare, the company's anchor engagement is
              with U.S. Army maneuver units seeking organic, deep-strike capabilities. Historically, forward tactical
              units relied on air support or artillery batteries to prosecute high-payoff targets beyond the visual line
              of troops. Through the Army Applications Laboratory (AAL), Mach is prototyping Viper to deliver an
              autonomous vertical-takeoff munition that provides brigade combat teams with long-range strike precision
              without dedicated runway infrastructure or launcher vehicles. Concurrently, the proliferation of
              attritable one-way drone attacks across global combat theaters has created urgent demand for base-defense
              solutions. Mach addresses this requirement through Dart, a kinetic counter-UAS interceptor designed to
              protect high-value airfields, depots, and forward operational locations from saturation drone raids.
              Finally, Mach pursues component-level customer relationships through Mach Propulsion, supplying
              microturbine engines and energetic subsystems to partner defense manufacturers such as HevenDrones.
            claimRefs:
              - CU001
              - CU004
              - CU006
