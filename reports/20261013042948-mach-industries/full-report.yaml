      - number: '4.4'
        title: Financial Verdict and Underwriting Blockers
        blocks:
          - type: paragraph
            body: >-
              From an institutional underwriting perspective, Mach Industries presents a bifurcated profile
              characterized by peer-leading capitalization paired with acute disclosure boundaries. While the company
              has demonstrated impressive engineering velocity—locking Strategic Strike design in 14 weeks and flying
              prototype aircraft rapidly—the commercial reality is that zero recognized revenue, ARR, or
              firm-fixed-price backlog figures are publicly verifiable. Independent defense analysis underscores that a
              $3.7 billion valuation demands a revenue trajectory achievable only through major programs of record, not
              prototype demonstrations or non-recurring engineering awards. Consequently, underwriting Mach Industries
              requires deep diligence access into confidential contract line item values, facility capital expenditure
              schedules, and detailed customer pipeline conversion rates.
            claimRefs:
              - CI001
              - CI002
              - CI010
              - CI014
              - CI015
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Valuation Disconnect and Manufacturing Scale Hurdle
            body: >-
              The rapid doubling of Mach Industries' valuation to $3.7 billion in September 2026 creates an aggressive
              commercial revenue expectation. Independent aerospace analysis notes that this valuation level demands
              multi-year Department of Defense programs of record rather than prototype demonstrations, creating severe
              multiple compression risk if manufacturing scale-up falters.
            calloutType: risk
            claimRefs:
              - CI001
              - CI002
              - CI010
          - type: callout
            title: Vertical Integration as Gross Margin Defense
            body: >-
              By acquiring solid rocket motor manufacturer Exquadrum for $50 million and building a 12,000-engine annual
