      - number: '5.2'
        title: Operational Workflows and Tactical Use Cases
        blocks:
          - type: paragraph
            body: >-
              Mach Industries tailors its product architecture to solve critical operational bottlenecks faced by modern
              tactical combat formations. In conventional combat workflows, brigade and company maneuver elements
              identify high-payoff tactical targets beyond the forward line of troops but must coordinate across
              multiple echelons and services to execute artillery or missile strikes, resulting in significant delays
              and coordination friction. Mach addresses this challenge through the Viper and Strategic Strike cruise
              missile platforms, giving maneuver units organic vertical-takeoff strike capability reaching 290
              kilometers with Hellfire-class terminal precision. In July 2026, Mach demonstrated the Viper's autonomous
              flight and strike characteristics during the MILEX VANGUARD 2026 exercise in Lithuania before military
              operators from Lithuania, Estonia, and NATO allies. Complementing strike operations, the Dart kinetic
              interceptor counters saturation drone swarms at dramatically lower cost than legacy interceptor missiles.
            claimRefs:
