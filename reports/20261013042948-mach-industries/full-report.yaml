      - number: '7.4'
        title: Capital Intensity, Valuation Stretch, and Thesis-Break Kill Criteria
        blocks:
          - type: paragraph
            body: >-
              The financial profile of Mach Industries reflects immense investor optimism accompanied by elevated
              valuation risk. By securing a $600 million Series C continuation that doubled its valuation to $3.7
              billion in September 2026, the company established a benchmark that demands rapid hardware
              commercialization. Hardware defense manufacturing is notoriously capital intensive, demanding heavy
              upfront capital expenditures for engine test cells, energetics blending facilities, and automated
              machining infrastructure. Crucially, Mach maintains total opacity regarding unit economics, bill of
              materials costs, and production scrap rates, preventing independent verification of margin viability. For
              prospective investors, definitive thesis-break triggers include: (1) international or congressional
              restrictions barring fully autonomous terminal strike engagement, (2) failure of the internal Mach
              Propulsion factory to achieve microturbine production qualification, forcing continued reliance on foreign
              suppliers, or (3) failure of the Army to transition Strategic Strike beyond prototype awards into a funded
              production program.
            claimRefs:
              - CR004
