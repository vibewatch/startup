      - number: '8.3'
        title: Financing Trajectory, Capital Structure & Multiple Reality
        blocks:
          - type: paragraph
            body: >-
              Mach Industries has raised approximately $1 billion in total equity capital across its seed through Series
              C extension rounds, demonstrating unprecedented fundraising velocity for an unmanned systems startup
              founded in 2023. The company closed its $100 million Series B at a $470 million valuation in June 2025,
              stepped up to $1.8 billion upon securing $300 million in June 2026, and doubled again to $3.7 billion just
              three months later. This trajectory places Mach Industries at an estimated enterprise value multiple
              exceeding 12x to 15x forward defense procurement expectations, far above incumbent defense prime multiples
              of 1.5x to 2.5x revenue and matching top-tier defense autonomy software premiums. Because the
              capitalization table includes multiple tranches of senior preferred stock, late-stage growth investors
              face substantial liquidation preference overhang if production scaling stumbles or Department of Defense
              budgetary allocations experience cyclical delays.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV008
              - CV012
      - number: '8.4'
        title: Scenario Analysis, Catalysts & Diligence Kill Criteria
        blocks:
          - type: paragraph
            body: >-
              To evaluate the risk-adjusted return profile of Mach Industries, we model three operational scenarios
              across a 2026 to 2028 horizon. Under the bull case (20% probability), Mach successfully transitions the
              Viper VTOL and Pike systems into high-volume Department of Defense programs of record, operationalizes its
              12,000-engine plant, and achieves $550 million in revenue by 2028, justifying a $7.7 billion valuation at
              a 14x multiple. In the base case (55% probability), Mach secures steady tactical procurement but
              encounters typical military contracting friction, generating $280 million in 2028 revenue supporting a
              $3.08 billion valuation at 11x. The bear case (25% probability) models hardware delays, engine
              manufacturing yield deficits, and regulatory barriers restricting autonomous strike deployment, driving
              revenue to $110 million and collapsing the valuation to $660 million. Critical diligence kill criteria
              include testing failures, inability to secure production reorders, or senior leadership turnover.
            claimRefs:
              - CV002
              - CV006
              - CV010
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV006
              - CV010
              - CV014
              - CV015
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Investment Stance: TRACK at $3.7B Post-Money Valuation'
            body: >-
              While Mach Industries demonstrates formidable engineering agility and Tier-1 venture support, the
              September 2026 valuation doubling to $3.7 billion prices in flawless manufacturing execution and massive
              DoD contract scaling before public revenue conversion is verified. Investors should track progress rather
              than commit fresh capital at current levels.
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV012
              - CV013
          - type: callout
            title: Capital Intensity and Defense Procurement Cycles
            body: >-
              Constructing dedicated vertical facilities, including a 12,000-engine jet propulsion plant and solid
              rocket motor operations, entails massive ongoing cash burn. If military adoption cycles lag venture
              expectations or autonomous targeting faces international regulatory constraints, Mach faces severe
              down-round or recapitalization risk.
            calloutType: risk
            claimRefs:
