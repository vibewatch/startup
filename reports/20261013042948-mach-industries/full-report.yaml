      - number: '4.3'
        title: Capital Adequacy, Valuation Trajectory, and Burn Profile
        blocks:
          - type: paragraph
            body: >-
              Mach Industries has experienced an extraordinary capitalization trajectory over the trailing twelve
              months, transitioning from an early-stage hardware startup to one of the most heavily capitalized private
              defense companies in the United States. Following a $100 million Series B at a $470 million valuation in
              June 2025 and a $300 million Series C at a $1.8 billion valuation in June 2026, the company closed a $600
              million Series C extension in September 2026 that doubled its valuation to $3.7 billion. Backed by
              top-tier venture investors including Sequoia Capital, Ribbit Capital, Infinite Capital, and Bedrock
              Capital, this substantial cash cushion funds aggressive capital expenditures. Significant outlays include
              operating the 115,000-square-foot Forge 1 facility in Huntington Beach, constructing a dedicated jet
              engine plant with 12,000-unit annual capacity, and funding the $50 million Exquadrum acquisition, creating
              a substantial monthly cash burn rate that necessitates eventual multi-year production contract
              transitions.
            claimRefs:
              - CI001
              - CI002
              - CI006
              - CI009
              - CI010
          - type: figure
            figureRef: FI001
