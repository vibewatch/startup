      - number: '6.4'
        title: Durability, Customer Concentration & Autonomy Safeguards
        blocks:
          - type: paragraph
            body: >-
              Evaluating customer durability and revenue quality for Mach Industries requires examining severe
              structural risks related to customer concentration, procurement friction, and emerging regulatory
              headwinds. The company exhibits near-total customer concentration in military and government defense
              accounts, where contract award decisions are vulnerable to shifts in service leadership, Congressional
              budget appropriations, and shifting defense priorities. Because Mach's early contracts are fixed-price
              development awards with finite deliverables, they do not exhibit the recurring software-like net revenue
              retention or multi-year backlog characteristics typical of mature industrial primes. Furthermore, the
              company faces growing policy complexity regarding the ethical governance of autonomous strike platforms.
              While the Pentagon has accelerated autonomous technology adoption, international human rights
              organizations and legal observers have voiced intense opposition to fully autonomous weapons systems that
              lack meaningful human-in-the-loop oversight. Should export controls tighten or DoD policy reinstate
              restrictive human intervention directives, Mach could face procurement delays or restricted overseas
              addressable markets. Until Mach translates its prototype demonstrations into multi-year defense program
              line items, its commercial standing remains that of an ambitious venture-backed supplier rather than an
              established defense contractor.
            claimRefs:
              - CU005
              - CU010
              - CU012
              - CU013
              - CU015
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The Valley of Death in Defense Procurement
            body: >-
              While Mach Industries has demonstrated rapid engineering velocity taking Viper from contract to autonomous
              flight in under six months, the U.S. defense acquisition framework poses a steep transition hurdle.
              Prototype awards from the Army Applications Laboratory and Defense Innovation Unit are non-recurring
              development grants that do not guarantee transition into high-volume Programs of Record. With private
              venture capital underwriting manufacturing expansion at Forge 1, failure to secure formal production line
              items within the standard two-year appropriation cycle would leave significant factory throughput
              unmonetized.
            calloutType: risk
            claimRefs:
              - CU001
              - CU007
              - CU010
              - CU015
          - type: callout
            title: Allied NATO Demonstration Signals Export Pathway
            body: >-
              By showcasing Viper at MILEX VANGUARD 2026 to Lithuanian and Estonian armed forces, Mach Industries is
              actively testing an allied export pathway that complements domestic procurement. The platform's 290 km
              strike range and 10 kg warhead are deliberately calibrated below Missile Technology Control Regime
              Category I thresholds, lowering foreign military sales regulatory hurdles. Allied endorsements on NATO's
              eastern frontier provide meaningful operational credibility, though formal bilateral procurement contracts
              remain unexecuted.
            calloutType: insight
            claimRefs:
              - CU003
              - CU011
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, International Treaty, and Autonomy Governance Risks
        blocks:
          - type: paragraph
            body: >-
              The fundamental thesis underpinning Mach Industries—delivering low-cost, mass-manufactured autonomous
              strike aircraft to maneuver units—faces substantial regulatory and policy headwinds. Chief among these is
              the escalating international push to establish binding legal constraints on lethal autonomous weapons
              systems. At the United Nations, Member States participating in the Convention on Certain Conventional
              Weapons are negotiating a two-tiered framework to prohibit weapons that select and engage targets without
              human intervention, with UN leadership urging comprehensive bans. Concurrently, while the Pentagon has
              accelerated AI adoption by loosening restrictive ethical language, domestic DoD Directive 3000.09 mandates
              rigorous senior-level reviews and failsafe controls before fielding autonomous lethal capabilities.
              Furthermore, international sales demonstrated in Eastern Europe require stringent State Department ITAR
              approvals and Commerce Department export authorizations that could severely delay or block foreign
              commercialization.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR007
