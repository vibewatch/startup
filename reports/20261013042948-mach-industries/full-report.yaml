      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The Dual Threat of Autonomy Treaties and Foreign Propulsion Single-Sourcing
            body: >-
              Mach Industries operates in a high-stakes convergence zone where international regulatory headwinds
              against lethal autonomous systems meet physical supply chain bottlenecks. The company's initial Strategic
              Strike cruise missile relies on German microturbine supplier JetCat, exposing the firm to foreign export
              controls and production caps while international bodies at the United Nations advance draft frameworks to
              prohibit fully autonomous targeting.
            calloutType: risk
            claimRefs:
              - CR001
              - CR003
              - CR004
          - type: callout
            title: Valuation Multiples Outpace Production Verification
            body: >-
              The dramatic doubling of Mach Industries valuation to $3.7 billion within a three-month window in mid-2026
              reflects intense venture appetite for defense hardware, yet it elevates execution risk to critical levels.
              With no public production yield metrics, undisclosed unit costs, and prototype flight timelines compressed
              into 14 weeks, any manufacturing bottleneck at Forge Huntington could trigger severe multiple contraction.
            calloutType: insight
            claimRefs:
              - CR005
              - CR011
