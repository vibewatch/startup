      - number: '5.3'
        title: Propulsion, Energetics, and Forge Manufacturing
        blocks:
          - type: paragraph
            body: >-
              The technological cornerstone of Mach Industries' defense platform is its vertically integrated
              manufacturing and propulsion architecture. Facing seven to ten month supplier lead times caused by
              duopolistic consolidation in the domestic defense supply base, Mach acquired solid rocket motor
              manufacturer Exquadrum for $50 million in May 2026. This acquisition formed the Mach Energetics division,
              securing an operational 70,000-square-foot propulsion facility in Adelanto, California. Simultaneously,
              the company launched Mach Propulsion, which is constructing a dedicated facility with a planned capacity
              of 12,000 microturbine jet engines annually while partnering with German supplier JetCat for near-term
              engine deliveries. Airframe integration and mass assembly are coordinated through Forge, Mach's
              decentralized manufacturing network anchored by its 115,000-square-foot flagship facility in Huntington
              Beach. Mach also leverages Forge Huntington to manufacture hydrogen-powered utility drones in partnership
              with HevenDrones.
