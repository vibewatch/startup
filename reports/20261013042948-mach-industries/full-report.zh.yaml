      - number: '2.3'
        title: 买方架构、付款方细分与采购机制
        blocks:
          - type: paragraph
            body: >-
              军用硬件的客户采用过程，会把战术终端用户与合同主管部门、机构预算所有者区分开来。战术机动单元——例如美国陆军连级至旅级战斗队——需要不依赖跑道的打击能力，在不依赖战区级联合火力协调的情况下，攻击部队前沿线之外的高价值火炮和雷达目标。为满足这一需求，陆军应用实验室（AAL）和国防自主作战组（DAWG）等先导采购组织充当灵活买家，通过快速原型合同把传统多年航空航天开发周期压缩到数月。与此同时，立陶宛、爱沙尼亚等一线
              NATO 国家中的盟国国防部，因欧洲东翼迫切的空域防护需求，构成正在加速的第二类客户。最后，面临固体火箭发动机和涡喷发动机严重短缺的现有国防主承包商，则是 Mach Energetics 和 Mach
              Propulsion 子系统的商业 B2B 买方。
            claimRefs:
              - CM005
              - CM007
              - CM008
              - CM009
              - CM011
              - CM012
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
