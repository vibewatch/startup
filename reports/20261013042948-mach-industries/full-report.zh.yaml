        - label: 分布式制造平台
          detail: Forge 去中心化制造网络（旗舰 Forge Huntington 115k sq ft 工厂）
        - label: 盟友互操作性与集成
          detail: 与盟友国防力量进行多域国防任务集成，并接入 NATO 标准指挥链路
