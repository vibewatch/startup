      - number: '6.2'
        title: 采用轨迹与合同机制
        blocks:
          - type: paragraph
            body: >-
              Mach Industries 的采用轨迹，一边是异常快的原型速度，另一边是国防部采购周期的结构性漫长。公司从合同授予到飞行演示不到 6 个月，在数周内锁定设计规格，并于 2025 年 1
              月在军方观察下完成自主翼载巡航飞行。虽然这种硬件迭代速度赢得了国防创新资助方的赞誉，但这些合作的商业性质仍严格属于开发阶段。截至 2026 年，Mach
              的联邦合作包括其他交易授权（OTA）原型协议、小企业创新研究（SBIR）奖项和快速实验挑战，而不是与已获资金的重大国防采办项目挂钩的采购合同。美国陆军与 AAL 的 Strategic Strike
              协议，是把实验硬件交给作战人员以完善作战概念的评估计划，而不是生产采购订单。为跨过这一经典采办“死亡之谷”，Mach 已通过 C 轮融资筹得 $485 million 风投，用私人资产负债表股权建设
              115,000 平方英尺的 Forge 1 工厂，并在正式采购决定前把目标设为每月生产 1,000 套 Viper。
            claimRefs:
              - CU001
              - CU002
              - CU007
              - CU010
              - CU015
          - type: table
            tableRef: TU002
            claimRefs:
              - CU002
              - CU005
              - CU006
              - CU007
      - number: '6.3'
        title: 已命名作战合作与盟国实证
        blocks:
          - type: paragraph
            body: >-
              客户采用的公开证据集中在三个主要国防组织：美国陆军应用实验室、国防创新部门和 NATO 波罗的海伙伴军队。Mach 的旗舰证明点是 2024 年第三季度授予的 AAL Strategic Strike
              合同；在该合同下，Mach 为连级至旅级部队演示了完整垂直起飞、转换为翼载飞行和模拟末端交战。2026 年 6 月，国防创新部门在 Atlas 平台下又授予 Mach
              一份“独立跑道海上远征打击能力”原型合同，显示远征海上作战方的兴趣正在扩大。除国内国防机构外，Mach 还积极向盟国武装力量演示系统。2026 年 7 月，Mach 参加了立陶宛 Rūdininkai
              训练区举行的 MILEX VANGUARD 2026 军事演习，为立陶宛和爱沙尼亚国防领导层进行 Viper 实飞演示。立陶宛国防部长 Robert Kaunas
              公开称赞该技术有助于解决波罗的海空域防护需求，美国外交代表则将演示称为盟国工业合作的样板。然而，这些盟国演示仍属探索性评估，截至目前尚未确认签署《外国军售要约与接受书》或双边采购合同。
