chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、创立与核心使命
        blocks:
          - type: paragraph
            body: >-
              Mach Industries 是现代国防工业基础中的一位野心勃勃的新进入者，其核心判断是：未来的主权冲突将由低成本、大规模制造的自主系统决定，而不是由稀缺且昂贵的尖端军用硬件决定。公司由 Ethan
              Thornton 于 2023 年创办，总部和主要制造园区均位于加利福尼亚州 Huntington Beach。Mach
              的战略目标是以百万计开发和制造非对称航空航天及国防系统与零部件，以遏制战争、推动繁荣。公司覆盖自主打击、反无人机、高空监视和推进子系统，把内部硬件工程能力接入垂直整合的生产线，绕开脆弱的商业供应链，加快国防装备列装。
            claimRefs:
              - CO001
              - CO002
              - CO007
              - CO014
          - type: table
            tableRef: TO001
            claimRefs:
              - CO003
              - CO004
              - CO005
              - CO007
              - CO011
              - CO015
      - number: '1.2'
        title: 领导层结构与治理动态
        blocks:
          - type: paragraph
            body: >-
              Mach Industries 的战略走向和组织动能仍与创始人兼首席执行官 Ethan Thornton 紧密相连；他 19 岁时离开麻省理工学院，创办了这家公司。Thornton
              的快速原型理念和激进垂直整合论吸引了知名风投的早期重磅支持，使 Mach 成为硅谷国防科技复兴中的旗舰投资标的。为在保持创始人驱动速度的同时补足国防采购经验，Mach
              引入了资深国防和运营管理者，包括曾任军用科技高管、后来担任总裁兼首席战略官的 Nathan Diller。治理仍集中在 Thornton
              和主要风投出资人手中，但正式的董事会委员会分工、表决门槛和保护性契约仍未公开。
            claimRefs:
              - CO001
              - CO002
              - CO006
              - CO008
