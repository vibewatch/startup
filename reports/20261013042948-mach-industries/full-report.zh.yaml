      - number: '2.2'
        title: 受约束的市场规模视角：DAWG、Replicator 与弹药补充
        blocks:
          - type: paragraph
            body: >-
              评估 Mach Industries 的可服务市场，必须从不同的预算和数量视角测算，而不能只依赖单一的自上而下国防航空航天数字。宏观上，美国国防部 2027 财年预算请求寻求 $1.5 trillion
              的总资金，并提出向军用无人机和反无人机系统投入超过 $70 billion 的前所未有增量，其中包括用于自主系统、无人机平台和受争夺后勤的 $53.6
              billion。在这一预算框架内，国防自主作战组（DAWG）是五角大楼 Replicator 计划的高层继任者，也是主要需求漏斗；它请求 $54.6 billion
              的研发资金，以采购和部署数千套可消耗型自主系统。这一预算扩张与五角大楼要求全军部署超过 300,000 套小型自主系统的数量目标一致。按 Mach 已公布的年产 12,000
              台喷气发动机产能衡量，需求仍有很大余量，前提是公司能把早期原型订单转化为持续的生产份额。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM006
              - CM010
              - CM014
