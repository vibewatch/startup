  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 国防客户基础与任务细分
        blocks:
          - type: paragraph
            body: >-
              Mach Industries
              的客户开发完全面向军方和国防终端用户，将目标市场划分为三类主要任务：战术地面作战部队、战区设施防御者和盟国主权力量。在战术地面作战中，公司重点服务寻求有机纵深打击能力的美国陆军机动部队。过去，前沿战术部队依靠空中支援或炮兵连攻击部队可视线之外的高价值目标。通过陆军应用实验室（AAL），Mach
              正在为 Viper 制作原型，提供不依赖专用跑道或发射车、能为旅级战斗队带来远程精确打击的自主垂直起飞弹药。同时，全球战区可消耗型单向无人机攻击扩散，催生了对基地防御方案的迫切需求。Mach 通过 Dart
              动能反无人机拦截器满足这一需求，保护高价值机场、仓库和前沿作战地点免受饱和式无人机袭击。最后，Mach 还通过 Mach Propulsion 建立零部件层面的客户关系，为 HevenDrones
              等合作国防制造商供应微型涡轮发动机和能量子系统。
            claimRefs:
              - CU001
              - CU004
              - CU006
              - CU009
