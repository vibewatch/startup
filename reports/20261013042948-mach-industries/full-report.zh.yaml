      - number: '1.4'
        title: 制造版图、产品里程碑与监管环境
        blocks:
          - type: paragraph
            body: >-
              实体制造能力是 Mach Industries 借助 Forge 拉开市场差异化的核心。Forge 是一个去中心化的灵活工厂网络，旨在批量生产自主航空航天系统。公司在 Huntington Beach
              总部运营一座 11.5 万平方英尺的制造设施，并在加州设有多个专业化基地。2026 年 5 月，Mach 以五千万美元收购固体火箭发动机制造商 Exquadrum，成立 Mach
              Energetics，以保障关键的国内导弹推进供应链。与此同时，Mach Propulsion 正与德国供应商 JetCat 合作建设专用喷气发动机工厂。Viper 平台等飞行演示已向波罗的海战区的 NATO
              盟友展示作战能力，但随着国际机构和联合国寻求对自主瞄准系统施加法律限制，Mach 也面临日益显现的全球监管阻力。
