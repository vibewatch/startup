      - number: '6.4'
        title: 客户韧性、客户集中度与自主系统保障
        blocks:
          - type: paragraph
            body: >-
              评估 Mach Industries
              的客户韧性和收入质量，需要审视客户集中、采购摩擦和新兴监管阻力带来的严重结构性风险。公司客户几乎全部集中于军方和政府国防账户，合同授予决策容易受到军种领导层变化、国会预算拨款和国防重点转移影响。由于 Mach
              早期合同是有固定交付内容的固定价格开发奖项，并不具备成熟工业主承包商常见的经常性软件式净收入留存或多年订单积压特征。此外，公司在自主打击平台的伦理治理上面临日益复杂的政策环境。五角大楼虽已加快自主技术采用，但国际人权组织和法律观察人士强烈反对缺乏有意义人在回路监督的完全自主武器系统。若出口管制收紧，或
              DoD 政策恢复严格的人为干预要求，Mach 可能面临采购延误或海外可服务市场受限。在 Mach 将原型演示转化为多年度国防项目条目之前，其商业地位仍是有野心的风投支持供应商，而非成熟国防承包商。
            claimRefs:
              - CU005
              - CU010
              - CU012
              - CU013
              - CU015
      - number: '6.5'
        title: 图表
        blocks:
          - type: callout
            title: 国防采购中的死亡之谷
            body: >-
              Mach Industries 已展现出快速工程速度，在不到 6 个月内把 Viper
              从合同推进到自主飞行，但美国国防采办框架仍构成陡峭的转换门槛。陆军应用实验室和国防创新部门授予的原型奖项属于一次性开发资助，并不保证转入高产量正式生产项目。在私人风投为 Forge 1
              制造扩张提供投资判断支持的情况下，若无法在标准两年拨款周期内拿到正式生产线项目，大量工厂产能将无法变现。
            calloutType: risk
            claimRefs:
              - CU001
              - CU007
              - CU010
              - CU015
          - type: callout
            title: 盟国 NATO 演示释放出口路径信号
            body: >-
              Mach Industries 向立陶宛和爱沙尼亚武装力量展示 MILEX VANGUARD 2026 中的 Viper，正在积极测试一条补充国内采购的盟国出口路径。该平台 290 km 的打击射程和 10 kg
              弹头经过刻意校准，低于《导弹技术控制制度》第一类门槛，从而降低外国军售监管障碍。NATO 东部边疆的盟国背书带来有意义的作战可信度，但正式双边采购合同仍未签署。
            calloutType: insight
            claimRefs:
              - CU003
              - CU011
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、国际条约与自主系统治理风险
        blocks:
          - type: paragraph
            body: >-
              支撑 Mach Industries
              的核心论点——向机动部队提供低成本、大规模制造的自主打击飞机——面临重大的监管和政策阻力。其中最主要的是国际社会日益推动对致命自主武器系统建立具有约束力的法律限制。在联合国，参加《特定常规武器公约》的成员国正在谈判两层框架，禁止在没有人类干预的情况下选择并攻击目标的武器；联合国领导层则呼吁全面禁令。与此同时，五角大楼通过放松限制性伦理措辞加速
              AI 采用，但美国国内 DoD 指令 3000.09 仍要求在部署自主致命能力前进行严格的高级别审查和故障安全控制。此外，在东欧进行的国际销售还需要严格的国务院 ITAR
              审批和商务部出口授权，可能严重延迟或阻断海外商业化。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR007
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
      - number: '7.2'
        title: 运营执行、能量系统与硬件质量风险
        blocks:
          - type: paragraph
            body: >-
              Mach Industries 以激进的硬件优先开发周期为傲，在初始设计启动后 14 周内就完成 Strategic Strike 飞行测试。然而，当航空航天开发周期被压缩、产品从手工原型扩展到
              Huntington Beach 115,000 平方英尺设施的大规模制造时，运营风险会显著上升。通过 Forge 平台扩张分布式生产，需要在数千架可消耗型机体上保持航空航天级公差、热耗散完整性和高 G
              结构生存能力，同时在各设施雇用约 100 至 125 名员工。公司通过 $50 million 收购
              Exquadrum，将能量系统和固体火箭发动机纳入内部，也由此引入严重的设施安全、危险材料合规和爆炸物储存责任。此外，在受争夺的战场部署打击飞机，要求未经证明的 AI 视觉和射频导航算法在强电子战和 GPS
              拒止环境中运行，且不能出现制导漂移或目标误识别。
            claimRefs:
              - CR006
              - CR008
              - CR011
              - CR012
              - CR013
              - CR014
          - type: table
            tableRef: TR002
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR013
              - CR014
      - number: '7.3'
        title: 供应链瓶颈与军方客户集中度
        blocks:
          - type: paragraph
            body: >-
              Mach Industries 近期执行中的关键脆弱点，是依赖单一来源供应商和高度集中的军方开发项目。对于旗舰美国陆军 Strategic Strike 合同，Mach 与德国制造商 JetCat
              合作供应微型喷气涡轮发动机。Mach 虽已推出专用推进部门，计划建设年产 12,000
              台发动机的国内工厂，但微型涡轮机制造的建设和认证需要专业冶金工装、精密平衡能力及有经验的工程人才；这些能力能否规模化，仍未经证明。在需求端，Mach
              高度依赖陆军应用实验室和国防创新部门的研发与原型奖项。在这些实验性开发工作转入拥有国会专门拨款的多年度正式生产项目之前，收入可见性仍很脆弱，容易受到五角大楼现代化重点变化影响。
            claimRefs:
              - CR004
              - CR006
              - CR009
              - CR010
          - type: table
            tableRef: TR003
            claimRefs:
              - CR004
              - CR006
              - CR007
              - CR009
              - CR010
      - number: '7.4'
        title: 资本密集度、估值拉伸与论点失效杀手标准
        blocks:
          - type: paragraph
            body: >-
              Mach Industries 的财务画像显示投资者情绪极度乐观，也伴随更高的估值风险。公司在 2026 年 9 月获得 $600 million 的 C 轮续融资，将估值翻倍至 $3.7 billion，
              因而建立了一个要求硬件快速商业化的基准。国防硬件制造以资本密集著称，需要为发动机测试台、能量混合设施和自动化加工基础设施投入大量前期资本开支。关键在于，Mach
              对单位经济性、物料清单成本和生产报废率完全不透明，无法独立验证利润率可行性。对潜在投资者而言，明确的论点失效触发条件包括：（1）国际或国会限制禁止完全自主的末端打击交战；（2）Mach Propulsion
              内部工厂未能完成微型涡轮机生产认证，被迫继续依赖外国供应商；或（3）陆军未能把 Strategic Strike 从原型奖项转入有资金支持的生产项目。
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR009
              - CR015
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR004
              - CR005
              - CR008
              - CR015
      - number: '7.5'
        title: 图表
        blocks:
          - type: callout
            title: 自主条约与外国推进单一来源的双重威胁
            body: >-
              Mach Industries 处在一个高风险交汇区：致命自主系统面临国际监管阻力，同时又遭遇实体供应链瓶颈。公司的首款 Strategic Strike 巡航导弹依赖德国微型涡轮供应商
              JetCat，使其暴露于外国出口管制和产能上限之下；与此同时，联合国等国际机构正在推进禁止完全自主瞄准的框架草案。
            calloutType: risk
            claimRefs:
              - CR001
              - CR003
              - CR004
          - type: callout
            title: 估值倍数超过生产验证
            body: >-
              2026 年中，Mach Industries 的估值在三个月内翻倍至 $3.7
              billion，体现出创投市场对国防硬件的强烈胃口，但也把执行风险推到临界水平。公开渠道没有生产良率指标，单位成本未披露，原型机试飞周期又被压缩到 14 周；Forge Huntington
              任何制造瓶颈都可能引发估值倍数大幅收缩。
            calloutType: insight
            claimRefs:
              - CR005
              - CR011
              - CR014
              - CR015
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资建议与决策立场
        blocks:
          - type: paragraph
            body: >-
              Mach Industries 把快速工程迭代与顶级国防创投支持结合起来，组合颇具吸引力，但估值上涨速度已经明显跑在可验证商业表现之前。2026 年 9 月完成 $600 million 的 C
              轮扩展融资后，公司投后估值达到 $3.7 billion，较 2026 年 6 月 C 轮交割翻了两倍，也达到 2025 年中 B 轮估值的八倍。Sequoia
              Capital、Bedrock、Khosla、Infinite 和 Ribbit 的支持说明头部创投信心充足；但在生产收入和多年期正式项目合同均未披露的情况下，机构仍应保持审慎的投资判断。我们的结论是：Mach
              Industries 应维持 TRACK 立场，信心中等、风险高，估值偏紧。投资者应先盯住试飞里程碑、单位经济性和盟友合同转化，再投入新资金。
            claimRefs:
              - CV001
              - CV002
              - CV008
              - CV012
              - CV013
