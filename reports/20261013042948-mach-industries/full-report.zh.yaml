              - CO002
              - CO008
              - CO009
      - number: '1.3'
        title: 融资轨迹、资本化与估值扩张
        blocks:
          - type: paragraph
            body: >-
              Mach Industries 的募资节奏异常激进，整个运营历史累计获得超过十亿美元的风险融资。2026 年 6 月，公司完成由 Infinite Capital 和 Ribbit Capital
              共同领投的三亿美元 C 轮融资，投后估值为十八亿美元，Bedrock Capital、Sequoia Capital 和 Khosla Ventures 跟投。随着项目进展和机构需求增强，Mach 于 2026
              年 9 月追加六亿美元的 C 轮融资，估值翻倍至三十七亿美元。尽管一个运营季度内估值已扩张至数十亿美元，Mach
              的财务披露仍然封闭：收入运行率、毛利率、现金消耗率和合同订单积压均未公开，给外部投资判断留下重大尽调缺口。
