  summary: >-
    Mach Industries 是一家成立于 2023 年的私营国防自主系统制造商，由 Ethan Thornton 创办，总部位于加利福尼亚州 Huntington
    Beach。公司生产可消耗型打击、反无人机、高空、推进和能量系统，包括 Viper、Dart、Strategic Strike、Mach Propulsion 与 Mach Energetics，并试图借助 Forge
    制造网络，把早期原型牵引力转化为规模化生产。
