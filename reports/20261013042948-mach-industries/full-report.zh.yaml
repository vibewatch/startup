      - number: '5.4'
        title: 自主性、制导与监管合规
        blocks:
          - type: paragraph
            body: >-
              在受争夺的电子战和 GPS 拒止环境中作战，需要先进的机载制导和目标自主能力。Mach Industries 正把人工智能视觉导航和射频感知能力整合进 Strategic
              Strike，以便在没有持续卫星导航或脆弱通信链路的情况下实现末端制导。然而，能够进行末端交战的致命自主武器部署，也会引发深刻的伦理、法律和监管审查。Human Rights Watch
              等国际非政府组织警告，自主算法在动态战场环境中难以可靠区分战斗人员与非战斗人员。此外，尽管 Mach
              报称原型迭代和飞行演示速度很快，但量产零部件良率、硬件可靠性指标和单次射击成本曲线等关键技术参数仍是未披露的私有数据，给投资判断带来重大风险。
            claimRefs:
              - CE012
              - CE013
