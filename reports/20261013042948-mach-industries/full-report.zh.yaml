  - id: FV001
    title: 投资立场决策逻辑
    type: flow
    summary: 按顺序评估 Mach Industries 的分析框架，从技术证明、估值纪律一路走到最终“跟踪”建议。
    approximationNotes: 代表一系列尽调门槛和回报阈值的定性评估路径。
