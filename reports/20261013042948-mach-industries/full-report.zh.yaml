      - number: '8.2'
        title: 核心投资论点与反论点平衡
        blocks:
          - type: paragraph
            body: >-
              Mach Industries 的核心投资论点，是靠激进策略打造现代化、去中心化国防工业基础，依托 Forge 网络和专用零部件事业部。公司以 $50 million 收购固体火箭发动机制造商
              Exquadrum，组建 Mach Energetics，并启动 Mach Propulsion 年产 12,000 台发动机设施建设，直接攻坚传统主承包商长期难以解决的关键弹药与推进瓶颈。此外，Viper
              VTOL 平台在立陶宛多国 Vanguard 2026 演习中的实飞演示，验证了东欧 NATO
              盟友对可消耗型打击能力的实际兴趣。反论点则指出严重的执行与监管阻力：在推进和能量系统工厂之外维持五条不同载具产品线，会造成资本高度分散；国际人道主义审视及联合国反对致命自主武器的倡议，也会带来长期出口合规风险。
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV010
              - CV011
      - number: '8.3'
        title: 融资轨迹、资本结构与倍数现实
        blocks:
          - type: paragraph
            body: >-
              Mach Industries 从种子轮到 C 轮扩展融资累计筹得约 $1 billion 股权资本；对于一家 2023 年成立的无人系统初创公司，这样的募资速度前所未有。公司于 2025 年 6 月以 $470
              million 估值完成 $100 million B 轮，2026 年 6 月拿到 $300 million 后估值升至 $1.8 billion，三个月后又翻倍至 $3.7
              billion。这条轨迹意味着，Mach Industries 的预期企业价值倍数估计超过未来国防采购预期的 12x–15x，远高于传统国防主承包商 1.5x–2.5x
              的收入倍数，也达到头部国防自主软件的溢价水平。由于资本表包含多批次高级优先股，一旦产能爬坡失速或国防部预算拨款出现周期性延迟，后期成长投资者将面临显著的清算优先权压力。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV008
              - CV012
      - number: '8.4'
        title: 情景分析、催化剂与尽调否决条件
        blocks:
          - type: paragraph
            body: >-
              为了评估 Mach Industries 的风险调整后回报，我们对 2026–2028 年期间建模三种运营情景。乐观情景（概率 20%）下，Mach 成功把 Viper VTOL 和 Pike
              系统导入大批量国防部正式项目，启用年产 12,000 台发动机的工厂，到 2028 年实现 $550 million 收入，以 14x 倍数支撑 $7.7 billion 估值。基准情景（概率
              55%）下，Mach 获得稳定的战术采购，但遭遇军方合同的常见摩擦，2028 年收入达到 $280 million，以 11x 倍数支撑 $3.08 billion 估值。悲观情景（概率
              25%）下，硬件延期、发动机制造良率不足以及限制自主打击部署的监管壁垒，把收入压到 $110 million，估值跌至 $660
              million。关键尽调否决条件包括测试失败、无法拿到生产复购订单，或高级管理层更替。
            claimRefs:
              - CV002
              - CV006
              - CV010
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV006
              - CV010
              - CV014
              - CV015
      - number: '8.5'
        title: 图表
        blocks:
          - type: callout
            title: 投资立场：$3.7B 投后估值下维持 TRACK
            body: >-
              Mach Industries 展现出强大的工程敏捷性并获得 Tier-1 创投支持，但 2026 年 9 月估值翻倍至 $3.7 billion，已经把无瑕疵的制造执行和 DoD
              合同大规模放量计入价格，而公开收入转化尚未得到验证。投资者应跟踪进展，不应在当前水平投入新资金。
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV012
              - CV013
          - type: callout
            title: 资本密集度与国防采购周期
            body: >-
              建设专用垂直一体化设施，包括年产 12,000 台发动机的喷气推进工厂和固体火箭发动机业务，会持续消耗大量现金。若军方采用周期落后于创投预期，或自主瞄准面临国际监管约束，Mach
              将面临严重的下轮融资或资本重组风险。
            calloutType: risk
            claimRefs:
              - CV006
              - CV010
              - CV014
