  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、国防自主规模测算与细分拆解
        blocks:
          - type: paragraph
            body: >-
              国防自主市场正经历根本性的结构转型。乌克兰和中东的现代战场经验已证明，低成本、去中心化的无人系统能够对抗传统的高资本密集型国防资产。Mach Industries
              将可服务边界定义为四个相互关联的硬件领域：可消耗型垂直起飞打击无人机系统（UAS）、低成本动能反无人机拦截器、用于通信和感知的高空伪卫星，以及包括喷气发动机和固体火箭发动机在内的关键国防推进子部件。Mach
              不与主承包商正面争夺数百万美元的尖端有人战斗机订单，而是瞄准低成本可消耗层级，在那里，规模、单次射击成本和发射独立性决定作战效用。这一边界还刻意纳入向其他国防制造商提供推进和能量供应，把全行业供应链短缺转化为第二增长引擎。
            claimRefs:
              - CM001
              - CM002
              - CM007
              - CM008
              - CM012
              - CM013
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
