    title: 客户旅程图
    type: journey-map
    summary: 国防客户从快速原型项目授予走向现场演示，在规模化 Programs-of-record 生产前面对“死亡之谷”。
    data:
      nodes:
        - label: 能力侦察与快速授予
          actor: Army Applications Lab & DIU
          action: Sponsoring OTA prototype contracts for novel vertical-takeoff and counter-UAS requirements
          outcome: Awarded Strategic Strike development contract (Q3 2024) and DIU maritime contract (2026)
        - label: 快速原型与飞行验证
          actor: Mach Engineering & Military Observers
          action: Compressing design-to-flight testing cycle within 14 weeks at California facilities
          outcome: Achieved full-performance wingborne flight in Jan 2025 matching 290 km HIMARS-range requirements
        - label: 多国现场演示
          actor: Allied Operators (Lithuania, Estonia)
          action: Deploying Viper in realistic tactical conditions at MILEX VANGUARD 2026
          outcome: Endorsed by Lithuanian defense leadership for Eastern flank deterrence without immediate contract
        - label: 生产生态准备度
          actor: Forge 1 & Component Subcontractors
          action: Standing up 115k sq ft manufacturing base and microturbine engine supply with JetCat
          outcome: Factory configured for 1,000 Viper units/month ahead of volume military purchase orders
        - label: 国防采购死亡之谷
          actor: DoD Program Executive Offices (PEOs)
          action: Bridging prototype demonstration to formal Program of Record budget line item
          outcome: 'Current critical bottleneck: navigating multi-year FYDP appropriation cycles on venture capital'
        - label: 全速生产与全球部署
          actor: Joint Forces & Allied Coalition
          action: Transitioning to multi-thousand unit recurring procurement contracts across services
          outcome: 'Unrealized objective: converting pilot interest into durable, multi-year recurring defense revenue'
    approximationNotes: 该进程综合国防部采购生命周期标准和公开报道的 Mach Industries 里程碑。
