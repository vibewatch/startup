            body: >-
              Mach Industries 的估值从 2025 年 6 月的 $470 million 增至 2026 年 6 月的 $1.8 billion，随后在 2026 年 9 月因 $600 million
              的追加融资再次翻倍至 $3.7 billion。这一轨迹反映出投资者对主权国防自主能力的强烈信心，但估值上涨也跑在运营基本面的公开验证之前：收入、客户合同积压和单位利润率仍完全未披露。
