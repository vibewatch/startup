              减少了对脆弱商业供应线及主承包商供应商配额的依赖，而后者通常带着多年交付积压。尽管如此，传统国防集团仍拥有巨大的游说能力、成熟的项目分销渠道和深度嵌入的作战测试基础设施，为军方买家带来很高的切换壁垒。此外，Anduril
