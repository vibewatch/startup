      - CV012
      - CV013
  - id: TV002
    title: 正反论点平衡
    columns:
      - 正方论点
      - 证据基础
      - 反方论点
      - 哪些变化会改变判断
    rows:
      - - 纵向制造自主性打破国防主承包商的成本结构
        - 以 $50M 收购 Exquadrum，并计划建设年产 12,000 台发动机的 Mach Propulsion 工厂
        - 资本密集型硬件规模化可能导致利润率严重压缩和执行延误
        - 已交付量产机体和发动机产品线证明单位毛利率为正
      - - 强大的 Tier-1 风投支持加快政府采购层面的可信度积累
        - Infinite 和 Ribbit 联合领投，Sequoia、Khosla 和 Bedrock 参与
        - 金融科技和消费领域风投联合投资方可能低估联邦采购周期长达多年的特点
        - 从实验性原型合同转为国防部多年期 Program of Record
      - - 五个活跃载具项目响应迫切的可消耗无人机需求
        - Viper VTOL、Glide 打击滑翔机、Stratos、Dart 和 Pike 弹药均在积极开发
        - 广泛的产品阵容使运营资源分散于不同推进和传感器需求
        - 集中资源，让 1-2 个核心载具平台实现大规模实战部署
      - - 盟友国防合作验证国际市场潜力
        - 在 Vanguard 2026 向立陶宛和爱沙尼亚武装部队现场演示 Viper 平台
        - 全球监管机构对致命性自主武器的审查可能限制欧洲出口审批
        - 与 NATO 伙伴国防部签署 Foreign Military Sales 或直接商业销售合同
    notes: 对核心正方驱动因素与结构性运营、财务和监管风险的定性评估。
    claimRefs:
      - CV004
      - CV005
      - CV006
      - CV007
      - CV008
      - CV010
      - CV011
  - id: TV003
    title: 估值情景（2026–2028 年展望）
    columns:
