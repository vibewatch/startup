      - CV002
      - CV004
      - CV007
      - CV010
      - CV012
      - CV013
      - CV014
    data:
      nodes:
        - id: step-1
          label: 自主打击证明
          detail: Viper 和盟友 Vanguard 演示证明飞行能力
        - id: step-2
          label: 制造布局
