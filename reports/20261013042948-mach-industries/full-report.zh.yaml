figures:
  - id: FO001
    title: Mach Industries 公司与平台发展里程碑
    type: timeline
    summary: 2023 年至 2026 年末的重要公司成立、融资轮次、平台演示和战略收购。
    approximationNotes: 日期代表公开宣布的交易交割、合同授予或平台公开亮相所在的日历月份。
    data:
      items:
        - label: 公司成立
          date: 2023-01
          detail: Ethan Thornton 在加利福尼亚州亨廷顿海滩创立 Mach Industries，专注于去中心化国防制造。
          tone: positive
          claimRefs:
            - CO001
            - CO002
        - label: Series A 融资
          date: 2023-06
          detail: 获得早期机构风投支持，包括 Sequoia Capital 首笔国防科技投资。
          tone: positive
          claimRefs:
            - CO006
        - label: 战略打击项目授予
          date: 2024-03
          detail: 获 Army Applications Laboratory 选中，开发垂直起飞巡航导弹打击平台。
          tone: positive
          claimRefs:
            - CO010
        - label: Series B 融资
          date: 2025-06
          detail: 以 $470 million 估值融资 $100 million，推进美国国防制造基础设施建设。
          tone: positive
          claimRefs:
            - CO003
        - label: Exquadrum 收购
          date: 2026-05
          detail: 以 $50M 现金和股权收购固体火箭发动机制造商 Exquadrum，成立 Mach Energetics。
          tone: positive
          claimRefs:
            - CO008
        - label: Series C 融资
          date: 2026-06
          detail: 完成 $300 million Series C，估值 $1.8 billion，由 Infinite Capital 和 Ribbit Capital 联合领投。
          tone: positive
          claimRefs:
            - CO003
            - CO006
        - label: Dart c-UAS 发布
          date: 2026-06
          detail: 发布 Dart 反无人机系统，集成 FMCW 地面雷达和拦截器，用于防御无人机蜂群。
          tone: positive
          claimRefs:
            - CO011
        - label: VANGUARD 2026 演示
          date: 2026-07
          detail: 在 NATO 演习中为立陶宛和爱沙尼亚武装部队进行 Viper 自主打击平台飞行演示。
          tone: positive
          claimRefs:
            - CO010
        - label: Series C 扩展轮
          date: 2026-09
          detail: 额外融资 $600 million，估值翻倍至 $3.7 billion，总融资额超过 $1 billion。
          tone: positive
          claimRefs:
            - CO004
            - CO005
    claimRefs:
