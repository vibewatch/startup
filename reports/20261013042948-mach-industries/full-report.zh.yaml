              - CM014
      - number: '2.4'
        title: 增长催化剂、采用瓶颈与规模测算缺口
        blocks:
          - type: paragraph
            body: >-
              地缘政治需求和 DoD 预算重点带来强劲的结构性顺风，但 Mach Industries 仍面临决定市场采用和估值持久性的重大摩擦点。首要增长催化剂是国内固体火箭发动机和喷气发动机制造的严重瓶颈，Mach
              已通过以 $50 million 收购 Exquadrum 并推出 Mach Propulsion 来应对。但财政和监管约束压制了近期可服务支出。具体而言，DAWG 预算请求中的 $53.6 billion（总额
              $54.6 billion）属于国会协调程序，而非基线拨款，因此极易受立法预算谈判和选举更替影响。此外，DAWG
              资金属于法定研发经费，能支持快速原型迭代，却限制大批量连续采购。在国际市场，严格的《国际武器贸易条例》（ITAR）限制自主武器系统的对外销售，压低近期盟友采用空间。最后，公开报道看不清有约束力的生产订单积压和项目正式列装的转换里程碑，构成尚未解决的尽调缺口。
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM010
              - CM012
              - CM013
              - CM014
              - CM015
      - number: '2.5'
        title: 图表
        blocks:
          - type: callout
            title: DoD 预算向可消耗型规模力量的结构性重配
            body: >-
              国防部 FY2027 预算请求向无人机和反无人机系统拨款超过 $70 billion，同时为国防自主作战组（DAWG）申请 $54.6
              billion，代表着从数十年周期的尖端航空航天平台转向低成本、可消耗型自主规模力量的前所未有的作战理念转变。对 Mach Industries
              而言，这一预算变化验证了其覆盖打击、反无人机和平流层传感器的多项目组合。
            calloutType: insight
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM006
          - type: callout
            title: 预算协调敞口与研发合同脆弱性
            body: >-
              Mach Industries 可服务市场的一个关键结构性风险是财政脆弱性：DAWG 请求的 $53.6 billion（总额 $54.6
              billion）被放入立法协调程序，而非基线国防拨款，因此资金高度容易受到国会政治周期影响。此外，DAWG 资金依据研发授权设立，用于快速探路，其内在优先级是迭代原型，而不是长期、多年度的连续生产承诺。
            calloutType: risk
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM015
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与直接同业画像
        blocks:
          - type: paragraph
            body: >-
              国防自主行业已形成两个层级：寻求快速扩张、由风投支持的高知名度国防科技挑战者，以及守住数十年项目垄断地位的根深蒂固的主承包商。Mach Industries 已与 Anduril
              Industries、Skydio 等一线同业并列；公司先在 2026 年 6 月完成 $300 million C 轮融资，随后迅速追加 $600 million，使私募估值升至 $3.7
              billion。Skydio 凭借企业机器人和自然增长收入，估值达到 $4.4 billion；Anduril 则凭借包括五角大楼采购 500 架可回收 Roadrunner 拦截器、金额 $250
              million 的重大主承包合同，主导风投支持的防空领域。不同于纯软件公司或组装集成商，Mach 依靠去中心化 Forge 生产基础设施和专用打击飞行器，包括获得陆军支持的 Strategic Strike
              垂直起飞巡航导弹，争夺国防部高优先级采购账户。
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP007
              - CP012
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP007
              - CP012
      - number: '3.2'
        title: 能力差异化与推进系统垂直整合
        blocks:
          - type: paragraph
            body: >-
              无人战争的差异化越来越取决于推进自主性、动能杀伤力和抵御电子战反制的韧性。传统电子战架构高度依赖射频干扰，但敌方打击无人机中自主、拒止 GPS
              导航的快速普及，已令软杀伤干扰不足，推动五角大楼转向动能末端拦截器。Mach 以 Dart 一体化“传感器到交战”拦截系统应对这一变化，并推出 Viper 等进攻型打击平台；Viper
              最近在波罗的海多国演习中向立陶宛和爱沙尼亚武装力量进行实飞演示。更关键的是，Mach 以 $50 million 收购固体火箭发动机生产商 Exquadrum，并成立 Mach Propulsion，计划年产最多
              12,000 台喷气发动机，直接挑战 Aerojet Rocketdyne 和 Northrop Grumman 长期形成的推进双寡头格局。
            claimRefs:
              - CP003
              - CP006
              - CP008
              - CP009
              - CP011
              - CP013
          - type: table
            tableRef: TP002
            claimRefs:
              - CP003
              - CP006
              - CP008
              - CP009
              - CP011
              - CP013
      - number: '3.3'
        title: 定价结构与可消耗型成本交换经济学
        blocks:
          - type: paragraph
            body: >-
              当 Patriot 或标准地空导弹等数百万美元级传统拦截器，被用于拦截每架仅数千美元的成群可消耗型攻击无人机时，防空经济学会严重失真。Anduril 通过作战可回收性应对这一交换难题：Roadrunner-M
              配备垂直起飞涡喷发动机，若目标被中和或任务取消，可返回基地并重新加油，但其溢价单价尚未披露。Mach 则以 Dart
              采用另一种范式，目标是把每枚动能拦截器的飞离成本控制在估计的五位数低段至中段，以实现有利的齐射对齐射交换，不耗尽防御弹匣容量。然而，DoD
              公开定价仍仅限于合同上限，而非逐批次列明的飞离成本，因此长期成本优势仍是首要投资判断尽调缺口。
