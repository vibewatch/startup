companyProfile:
  summary: >-
    Mach Industries is a private defense-autonomy manufacturer founded in 2023 by Ethan Thornton and headquartered in
    Huntington Beach, California. The company builds attritable strike, counter-UAS, high-altitude, propulsion, and
    energetics systems, including Viper, Dart, Strategic Strike, Mach Propulsion, and Mach Energetics, and it is trying
    to turn early prototype traction into scaled production through its Forge manufacturing network.
