  topStrengths:
    - Verified Army and allied prototype activity suggests real defense-market traction.
    - Vertical integration through Exquadrum, Mach Energetics, and Mach Propulsion reduces supplier dependence.
    - Tier-1 venture backing provides substantial capital for factory scale-up.
  topRisks:
    - No public revenue, ARR, gross margin, or backlog disclosure.
    - Autonomous weapons and export-control scrutiny could slow international adoption.
    - Single-source propulsion dependencies and manufacturing scale-up risk could delay delivery.
    - Valuation has moved faster than the company can publicly verify commercial economics.
  unresolvedGaps:
    - No public audited revenue, ARR, gross margin, cash-burn, or backlog disclosure.
    - No public cap-table detail, liquidation preferences, or board governance visibility for the latest round.
    - No public unit-level yield, cost-per-shot, or facility-utilization metrics for the core systems.
    - No public program-of-record conversion or repeat-order visibility for allied or U.S. customers.
    - No public specificity on autonomy safeguards or export classification outcomes sufficient for underwriting.
