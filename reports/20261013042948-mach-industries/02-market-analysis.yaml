callouts:
  - calloutType: insight
    title: Structural DoD Budget Realignment Toward Attritable Mass
    body: The Department of Defense FY2027 request allocating over $70 billion to drones and counter-UAS, paired with a $54.6 billion ask for the Defense Autonomous Warfare Group (DAWG), represents an unprecedented doctrinal transition from exquisite multi-decade aerospace platforms to low-cost, expendable autonomous mass. For Mach Industries, this budget shift validates its multi-program portfolio across strike, counter-UAS, and stratospheric sensors.
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM006
  - calloutType: risk
    title: Reconciliation Exposure and R&D Contracting Vulnerabilities
    body: 'A critical structural risk in Mach Industries addressable market is fiscal vulnerability: $53.6 billion of the $54.6 billion DAWG request is placed in legislative reconciliation rather than baseline defense appropriations, making funding highly susceptible to congressional political cycles. Furthermore, DAWG funding is structured under research and development authorities for rapid pathfinding, which inherently prioritizes iterative prototyping over long-term, multi-year serial production commitments.'
    claimRefs:
      - CM003
      - CM004
      - CM005
      - CM015
