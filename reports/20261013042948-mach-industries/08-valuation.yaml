callouts:
- calloutType: recommendation
  title: 'Investment Stance: TRACK at $3.7B Post-Money Valuation'
  body: While Mach Industries demonstrates formidable engineering agility and Tier-1 venture support, the September 2026 valuation
    doubling to $3.7 billion prices in flawless manufacturing execution and massive DoD contract scaling before public revenue
    conversion is verified. Investors should track progress rather than commit fresh capital at current levels.
  claimRefs:
  - CV002
  - CV012
  - CV013
- calloutType: risk
  title: Capital Intensity and Defense Procurement Cycles
  body: Constructing dedicated vertical facilities, including a 12,000-engine jet propulsion plant and solid rocket motor
    operations, entails massive ongoing cash burn. If military adoption cycles lag venture expectations or autonomous targeting
    faces international regulatory constraints, Mach faces severe down-round or recapitalization risk.
  claimRefs:
  - CV006
  - CV010
  - CV014
