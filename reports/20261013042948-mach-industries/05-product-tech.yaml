callouts:
  - calloutType: "insight"
    title: "Vertical Integration as Supply-Chain Moat in Autonomous Defense"
    body: "Mach Industries' aggressive moves into solid rocket motors through its $50 million Exquadrum acquisition and microturbine engines via Mach Propulsion directly target the two most severe industrial bottlenecks in modern tactical munitions. By producing critical propulsion components in-house rather than relying on consolidated legacy defense suppliers with multi-month lead times, Mach seeks to achieve unprecedented production velocity and unit cost advantages."
    claimRefs:
      - "CE004"
      - "CE005"
      - "CE008"
  - calloutType: "risk"
    title: "Autonomous Engagement Policies and Sensor Verification Gaps"
    body: "While Mach Industries is engineering optical and RF sensing to operate in GPS- and communications-denied operational environments, fielding fully autonomous terminal engagement capabilities faces acute regulatory, humanitarian, and operational scrutiny. The lack of public data regarding target discrimination error rates and failsafe mechanisms represents a critical technical diligence gap for institutional underwriters."
    claimRefs:
      - "CE012"
      - "CE013"
