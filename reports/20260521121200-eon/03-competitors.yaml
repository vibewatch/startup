  evidenceGaps:
    - type: enumeration-incomplete
      severity: minor
      topic: customer switching cases
      missingEvidence: "Public case studies of enterprises switching from Rubrik, Veeam, or Cohesity to Eon or Druva, with named customer, previous vendor, reason, and outcome."
      whyItMatters: "Enterprise procurement committees require reference customers in the same industry and size bracket before committing to backup infrastructure changes. Absence of public Eon-vs-incumbent migration stories limits the chapter's ability to validate displacement claims."
      diligencePath: "Request Eon's reference customer list and ask for permission to publish two-to-three migration case studies from named enterprise accounts. Review G2, Gartner Peer Insights, and PeerSpot for emerging Eon case studies."
      relatedQuestionRefs:
        - QP005
      relatedTableRefs:
        - TP001

    - type: private-evidence-only
      severity: material
      topic: Eon cost savings validation
      missingEvidence: "Independent third-party benchmark or audit validating Eon's claimed 30-50% storage cost reduction, with methodology, customer segment, workload type, and comparison baseline specified."
      whyItMatters: "Eon's self-funding ROI claim is the primary commercial justification for enterprise buyers who must justify CBPM budget. Without independent validation, the claim is marketing copy and is vulnerable to incumbent rebuttal in procurement evaluations."
      diligencePath: "Commission or obtain a customer-authorized cost audit from a neutral third party such as Gartner or IDC; alternatively, secure a large named customer to publicly disclose cost impact data with methodology."
      relatedQuestionRefs:
        - QP011

    - type: missing-source
      severity: minor
      topic: CBPM analyst category recognition
      missingEvidence: "A Gartner Magic Quadrant, Gartner Market Guide, IDC MarketScape, or Forrester Wave that formally names Cloud Backup Posture Management as a distinct market segment and positions Eon within it."
      whyItMatters: "Category recognition from a major analyst firm triggers enterprise procurement shortlisting and validates Eon's first-mover narrative. Without it, CBPM remains self-defined and incumbents can rebrand existing features to neutralize the label."
      diligencePath: "Monitor Gartner and IDC market segment announcements; engage directly with Gartner analyst covering backup and recovery for CBPM briefing; target coverage in the next Gartner Market Guide for Backup and Recovery Software."
      relatedQuestionRefs:
        - QP015

    - type: missing-source
      severity: minor
      topic: Eon Apache Iceberg technical architecture
      missingEvidence: "Technical documentation or independent architectural analysis describing how Eon's backup storage engine segments and indexes data into Apache Iceberg format, what proprietary metadata structures are created, and how query performance compares to native Iceberg tables."
      whyItMatters: "The data lake activation capability is Eon's most durable moat claim. Understanding the technical architecture is required to assess whether incumbents or hyperscalers can replicate it within 12-24 months, and whether Databricks or Snowflake could build native adapters that bypass the need for Eon's conversion layer."
      diligencePath: "Request technical architecture review from Eon CTO Ron Kimchi; review Eon's filed patents for Iceberg/Parquet backup indexing methods; seek independent validation from Databricks or Snowflake integration team."
      relatedQuestionRefs:
        - QP026

