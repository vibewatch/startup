  - id: status-quo-substitutes
    title: Status-Quo Substitutes and Hyperscaler Alternatives
    body: >
      The most common enterprise status-quo substitute is a combination of native hyperscaler snapshots and
      manual operational governance. AWS Backup centralizes backup across EC2, RDS, EBS, S3, DynamoDB, EFS,
      and other AWS services with pay-per-use billing and automated scheduling. Azure Backup covers Azure VMs,
      SQL Server in Azure, SAP HANA, and Azure Files with similarly consumption-based pricing. GCP Backup and
      DR extends native protection across Google Compute Engine workloads. These tools are embedded, cheap,
      and fast—but share three structural weaknesses that Eon targets.

      First, native hyperscaler snapshots are not cross-cloud: an AWS snapshot cannot protect or restore Azure
      workloads, forcing multi-cloud enterprises to manage siloed backup operations per provider. Second,
      native tools are typically crash-consistent rather than application-consistent, meaning database-level
      integrity requires additional quiescing logic. Third—and most materially for Eon's threat model—native
      snapshots share the same IAM permission boundary as production workloads: a compromised cloud credential
      can delete or encrypt backup data. Eon's immutable isolated vaults and ransomware detection directly
      address this gap. Fourth, native tools produce siloed, non-searchable snapshot stores with no analytics
      capability, whereas Eon converts the same data into a live queryable data lake.

      Internal build is a meaningful substitute at large cloud engineering organizations that staff dedicated
      platform engineering teams. These teams use AWS CloudFormation, Terraform, or custom scripts to automate
      snapshot scheduling, retention enforcement, and cross-region replication. Internal build avoids vendor
      cost and lock-in but lacks cross-account anomaly detection, compliance reporting, drift monitoring, and
      data activation capability. For organizations with 500+ cloud resources, the engineering maintenance
      burden grows super-linearly, which is Eon's primary winning argument against internal build.

      Hyperscaler vendors are not static substitutes. AWS continues expanding AWS Backup capabilities; Azure
      Backup added vaulted backups with enhanced soft-delete in recent years; GCP Backup and DR added
      application-consistent backup for SAP HANA and databases. As hyperscalers add features, the gap between
      native tools and Eon narrows on protection completeness—though the data activation gap remains largely
      unaddressed by native tools. This is a medium-term commoditization risk that Eon must anticipate by
      deepening the analytics and AI differentiation layer.
