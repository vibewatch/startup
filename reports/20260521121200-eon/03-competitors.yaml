  - id: pricing-distribution-switching
    title: Pricing, Distribution, and Switching Cost
    body: >
      Pricing across the incumbent field is opaque: Rubrik, Cohesity, Commvault, and Veeam all operate
      contact-for-pricing enterprise sales models, with custom deal structures based on workload count,
      retention period, feature tier, and volume discounts. Published benchmarks and practitioner accounts
      suggest broad ranges: Commvault is widely regarded as the most expensive, followed by Rubrik (with an
      operational simplicity premium), Cohesity, Veeam, and Druva at the lower end. AWS Backup and Azure Backup
      provide consumption-based pricing with no upfront commitment, making them the lowest-cost entry point for
      companies already inside a single cloud; however, adding cross-cloud support, long-term retention, and
      advanced security features requires third-party vendors or significant operational overhead.

      Eon's pricing is available on the eon.io website and follows per-resource, cloud-consumption-aligned
      patterns. The company's self-described ROI model claims the platform saves more than it costs through
      30–50% storage cost reduction via forever-incremental deduplication. This claim has not been independently
      validated at scale, but SoFi's public testimonial of 90%+ data preparation time reduction provides one
      corroborating customer reference.

      Switching costs are highly asymmetric across the competitor set. Commvault has the highest switching cost
      due to its deep platform integration, multi-year contracts, skills investment, and module dependencies
      across backup, compliance, and identity resilience. Rubrik creates strong lock-in through its proprietary
      SLA-policy engine and immutable cloud archive format. Veeam has the lowest architectural lock-in among
      incumbents because its backup format is standard and its software-defined architecture is hardware-agnostic,
      which also makes Veeam customers the most accessible migration target for Eon. Druva's SaaS model has
      moderate switching costs tied primarily to agent deployments and policy configuration.

      Eon itself is building switching costs through its proprietary Apache Iceberg catalog indexes, custom CBPM
      policy frameworks, and deep IAM role integration—all of which would require data migration and
      reconfiguration to replace. As the installed base grows, Eon's lock-in depth will increase, but at its
      current scale of a "few tens" of enterprise customers it has not yet achieved a self-reinforcing customer
      retention dynamic. Distribution power for incumbent vendors is substantial: Veeam's 550,000-customer
      base and global VAR network, Commvault's managed service provider ecosystem, and Cohesity's IBM OEM
      channel all give incumbents a sales-velocity advantage that Eon's direct enterprise motion cannot match
      at present scale.
