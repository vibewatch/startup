      - - Cohesity-Veritas merger scale consolidation
        - Single $1.5B ARR entity covers both legacy and modern workloads
        - High
        - Ongoing
        - Merger pre-empts Eon's expansion into hybrid enterprise accounts; Veritas installed base now on same platform
        - Focus Eon GTM on greenfield cloud-native organizations and net-new enterprise divisions, not legacy migrators
      - - Customer reference deficit at early stage
        - Enterprise buyers require reference customers in same industry/size before large procurement
        - High
        - 18–36 months to build critical mass
        - Only "few tens" of enterprise customers; SoFi is primary public reference
        - Prioritize public case study production; accelerate reference customer program
      - - Startup vendor risk perception
        - Enterprise IT procurement risk committees flag vendor longevity for mission-critical backup
        - Medium-High
        - Ongoing (reduces as ARR grows and investor roster is known)
        - PeerSpot user reviews flag startup stability concern explicitly
        - Sequoia/Elad Gil backing provides credibility; Series D runway addresses near-term concern
      - - Hyperscaler native backup expansion
        - AWS/Azure/GCP expanding native backup to close feature gaps Eon exploits
        - Medium
        - 2–3 years for material feature convergence
        - AWS Backup, Azure Backup both expanded capability in 2024–2025
        - Maintain differentiation on multi-cloud + analytics layer where hyperscalers cannot self-compete
    notes: "Severity and durability horizon are analytical assessments based on competitive intelligence gathered as of May 2026; they are not independently rated by third-party analysts. 'Permanent' horizon indicates structural barriers, not eliminations."

