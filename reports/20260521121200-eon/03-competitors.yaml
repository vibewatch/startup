callouts:
  - calloutType: strength
    title: Uncontested Data Lake Activation Moat
    body: >
      Eon's zero-ETL conversion of cloud backup data into Apache Iceberg format—queryable by Snowflake,
      Databricks, BigQuery, Athena, Spark, and Trino without a restore step—is architecturally unique
      among all named competitors as of May 2026. This capability transforms backup from a cost center into
      a live data asset, resonating with CFOs and data platform owners beyond the traditional IT backup buyer.
      No incumbent backup vendor offers equivalent functionality, and replicating it requires deep changes
      to backup storage architecture that cannot be bolted on quickly.
    claimRefs:
      - CP040
      - CP043
      - CP050

  - calloutType: risk
    title: Incumbency and Channel Power Create Structural Sales Disadvantage
    body: >
      Veeam's 550,000 enterprise customers and global VAR network, Commvault's managed service provider
      ecosystem, and Cohesity's post-merger IBM OEM channel give incumbents distribution leverage that Eon
      cannot replicate through direct enterprise sales alone at current scale. Enterprise procurement committees
      default to established vendors with a "few tens" of Eon reference accounts providing insufficient
      social proof for large-budget backup infrastructure decisions. Eon's lack of a formal channel partner
      network is a material go-to-market risk that must be addressed before the $4 billion valuation can be
      validated by revenue growth.
    claimRefs:
      - CP017
      - CP022
      - CP044
      - CP046

  - calloutType: risk
    title: Adverse Evidence — Startup Limitations Flagged by Independent Reviewers
    body: >
      PeerSpot independent user reviews and market share data (approximately 0.7% cloud backup market share
      as of May 2026) surface concerns including: startup vendor continuity risk for mission-critical
      infrastructure, steeper learning curve than legacy tools for non-cloud-native IT teams, integration
      limitations with non-mainstream cloud workloads, and questions about full-dataset restore performance
      at scale. These are consistent with an early-stage enterprise vendor and are not structural failures,
      but they will be weaponized by incumbent sales teams in competitive evaluations until Eon has a
      substantially deeper public customer reference base.
    claimRefs:
      - CP042
      - CP043
      - CP047
      - CP048

  - calloutType: insight
    title: Cohesity-Veritas Merger Is Eon's Most Structurally Important Competitive Event
    body: >
      The December 2024 completion of the Cohesity-Veritas merger created a single entity with $1.5 billion
      ARR, 12,000+ customers covering 96% of the Fortune 100, IBM OEM channel, and NVIDIA AI investment.
      This entity now occupies both the modern cloud backup and legacy-replacement positions simultaneously.
      For Eon, this means the "customers migrating away from legacy backup" (formerly a Cohesity target too)
      is now partially captured by the merged entity's migration offers, compressing Eon's natural greenfield
      expansion into hybrid enterprise accounts.
    claimRefs:
      - CP009
      - CP010
      - CP011
      - CP014
      - CP045

