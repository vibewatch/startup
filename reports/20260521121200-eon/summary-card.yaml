  topStrengths:
    - >-
      Repeat-exit founding team: Ehrlich, Stein, and Kimchi built and sold CloudEndure to AWS for ~$200M and bring four
      years of AWS insider architecture depth
    - >-
      Tier-1 investor syndicate (Sequoia, Lightspeed, Greenoaks, BOND, Elad Gil) with all major prior investors
      returning to the Series D
    - >-
      Novel CBPM category: agentless multi-cloud backup plus zero-ETL AI data lake in a single platform — no direct
      competitor offers both layers
    - Revenue more than tripled in 2025; SoFi reference validates enterprise ROI (>90% faster data preparation)
    - >-
      Large and growing TAM: $22B+ cloud backup market by 2031 with ransomware-protection overlay broadening the
      addressable opportunity
  topRisks:
    - >-
      $4B valuation stretched against entirely undisclosed financials — no ARR, NRR, gross margin, or burn; implied
      revenue multiple of 13–44x exceeds public comps (Rubrik 8–9x)
    - >-
      Hyperscaler competitive threat: AWS, Azure, and GCP are primary distribution partners and existential competitive
      threats; any API policy change could impair the agentless architecture
    - >-
      Customer concentration: ~$497M raised on 'a few tens' of large enterprise logos implies elevated CAC and high
      single-account revenue risk
    - >-
      Geopolitical and regulatory exposure: Israeli R&D base creates IP-transfer, talent, and compliance friction (DORA,
      NIS2, FedRAMP absence) that limits regulated-sector TAM
    - >-
      Key-person dependence on three co-founders; governance and cap-table structure after five rapid rounds remain
      opaque
  unresolvedGaps:
    - >-
      ARR, NRR, gross margin, and operating burn rate not publicly disclosed — valuation cannot be underwritten against
      any public comparable without these
    - >-
      Cap-table structure (liquidation preferences, anti-dilution provisions, participation rights) from five rapid
      rounds is opaque — sub-$4B exit scenarios could yield zero common-equity returns
    - >-
      FedRAMP authorization status unconfirmed as of May 2026 — effectively excludes US federal agency and regulated
      financial-sector TAM
    - >-
      SentinelOne strategic equity stake (from RSAC March 2026 partnership) creates undisclosed governance and
      conflict-of-interest questions requiring clarification
    - >-
      No SOC 2 Type 2 attestation specific to Eon's AI Agent feature released — creates security-assurance gap for
      highly regulated customers
