      - number: '6.2'
        title: 采用轨迹与部署证据
        blocks:
          - type: paragraph
            body: >
              Eon 展现出从 POC 到生产的快速采用节奏，结构上快于传统既有厂商，也验证了无代理部署架构确实能加速销售。AWS 原生客户的典型部署路径，从初次沟通到完整生产上线约两周。SoFi 在约两周内完成五个 AWS
              区域的完整多区域上线。AlphaSense 虽然管理 PB 级 AWS S3 数据，初始备份 3 天完成，25 天进入完整生产。Sigdo Koppers 在进行基础设施迁移时把 Eon 部署在 Google
              Cloud 上，且没有拖慢迁移本身。

              采用由四个主要用例驱动：用统一态势管理层替代碎片化原生云快照；集中管理 AWS、Azure 和 Google Cloud 上的多云备份；降低云备份存储成本（案例研究中通常报告 35–40%
              节省）；以及在备份和归档数据上启用分析或 AI。Eon 的 2025 State of Cloud Backup Report 调研了 150 多位企业 IT 领导者，发现 79% 正在投资或评估备份升级，68%
              有兴趣把备份数据用于 AI 或商业智能，81% 认为可查询、分析就绪的备份有价值，51% 仍依赖手工或半自动流程——这些数据直接验证了可替换机会的规模。

              管理层在 Series D 新闻稿（December 2, 2025）中把 2025 年客户牵引力称为「explosive」，并称当年收入增长超过三倍。总客户基础仍被描述为「数十家左右大型企业客户」，这符合一家在
              Series D 时商业化运营刚满约 18 个月的公司。所有已发布案例研究呈现出一致模式：部署快、首年内 ROI 可量化、扩张计划得到确认；这说明 Eon 在大型企业云基础设施细分市场里已出现强初始产品市场匹配。
