  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与客户工作流
        blocks:
          - type: paragraph
            body: >-
              Eon 服务在 AWS、Azure 或 Google Cloud 上运行工作负载的企业，解决备份、勒索软件防护和合规态势管理，同时省掉代理、设备和手工策略治理的负担。两项核心商业模块——Eon Data
              Protection 和 Eon Data Lake Infrastructure——以统一 SaaS 交付，不要求客户改动现有云环境。接入只需授予只读 IAM 角色；Eon 的引擎会发现每一项云资产（EC2
              实例、RDS 数据库、S3 bucket、Azure Virtual Machines、GCS bucket 等），套用备份和分类策略，并持续监控覆盖漂移，全程不部署代理。所有捕获的备份数据都会写入 Apache
              Iceberg 表，把备份库变成可查询的数据湖：BigQuery、Snowflake、Databricks 等分析引擎可直接查询实时备份数据，不触发恢复操作。截至 May 2026，Eon AI Agent
              又向前推进一步：它借助 Google Gemini 把自然语言查询转成 SQL，在备份目录上执行；按 Eon 自己发布的说法，数据准备时间从数月缩到数分钟。Eon 的核心买方角色是依赖云的企业中的 SRE 和
              DevOps 工程师、安全与合规团队，以及数据工程团队。
