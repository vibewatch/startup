        - 高——五个点名账户构成 Eon 早期 ARR 阶段已披露客户基座的全部
        - SoFi（金融服务，最知名客户）因定价、中断或监管担忧流失
        - 高
        - 多年合同条款；按使用量计费形成切换成本；企业销售周期提供早期预警
        - 中高——SoFi 自身受 CFPB 和 Fed 监管审查；其备份策略变化不受 Eon 控制
      - - 核心工程人才池
        - 以色列（Tel Aviv-Azrieli Sharona 研发中心）
        - 平台开发、数据基础设施和 AI 研究的主要工程团队
        - 高——基于双总部结构估计，多数工程人员集中在 Tel Aviv
        - 地缘政治升级（Iran-Israel 冲突）迫使研发暂停、撤离或紧急迁移员工
        - 高
        - 双总部模式；New York 办公室提供第二运营基地；针对以色列中断的 BCP 计划未公开披露
        - 中——以色列科技行业在过往冲突中展现韧性；以色列初创公司常把研发集中在单一城市，但尾部风险真实存在
    notes: 集中度评级反映截至 May 2026 的公开架构和合作披露。AWS、SentinelOne 和 AI 提供商的实际合同条款、服务等级协议未公开披露，可能实质影响剩余敞口。行按严重性（严重 → 高）排序。
