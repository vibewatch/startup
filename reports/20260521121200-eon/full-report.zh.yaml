      rows:
        - label: 云存储 / 计算转嫁
          values:
            - 公开材料强调去重、压缩和低成本层
            - COGS 可能随受保护数据和查询量增长
            - 只有基础设施效率真实存在，毛利率才可能改善
        - label: 销售和合作伙伴扩张
