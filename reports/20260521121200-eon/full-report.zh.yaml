      - number: '4.3'
        title: 成本结构、利润率路径与资本充足性
        blocks:
          - type: paragraph
            body: >-
              相比卖设备的既有厂商，Eon 看起来结构上更轻资产。公司不卖硬件，以无代理 SaaS
              运行，价值主张锚定在自动发现、成本分摊报告、细粒度恢复和存储优化等软件功能上。公开的成本节省叙事依赖压缩、去重、增量捕获和更便宜的云存储层；如果执行到位，这些机制应有利于利润率。问题是公开证据看不出执行效率。Eon
              没披露毛利率、净留存、流失、现金余额、烧钱速度或产品级收入组合，所以从强客户 ROI 走到有吸引力的公司级利润率，目前仍主要是一个论点。资本充足性方向上比精确数字更容易判断。Eon 在 December 2025
              完成 $300 million Series D，总融资约 $500 million，估值 $4 billion。管理层称资金将用于研发、招聘、美国扩张、更深的云集成，以及潜在收购。Reuters
              还补充说，这轮融资应能覆盖至少 18 个月，之后才需要新融资。这是有用的现金跑道信号，但没有现金和烧钱披露，无法独立验证。
