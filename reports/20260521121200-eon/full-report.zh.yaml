  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              Eon 面临多层监管风险，横跨三大司法辖区：欧盟、美国和以色列。作为云备份处理方，Eon 服务的企业客户持有个人和金融数据，因此直接受欧盟《通用数据保护条例》（GDPR）约束；GDPR
              对处理欧盟居民数据的任何实体施加有约束力的数据保护义务，不论实体地理位置。GDPR 执法明显更激进：DLA Piper 年度调查显示，截至 early 2026，欧盟累计罚款达到 €7.1 billion，仅
              2025 年就罚了 €1.2 billion；云处理方如今已成为执法目标中的重要一类。

              两个主要欧盟框架为 Eon 客户制造平行合规门槛，并间接限制 Eon 的采购资格。NIS2 指令要求成员国在 October 17, 2024
              前完成转置，现在对关键行业覆盖实体施加强制事件报告、安全治理和供应链风险管理要求。任何被 NIS2 覆盖的欧盟企业客户使用 Eon，都必须让本国监管机构相信 Eon
              满足适用安全和合同标准。《数字运营韧性法案》（DORA）于 January 17, 2025 生效，对欧盟金融实体要求更高：它强制要求 ICT
              第三方供应商合同中写入明确权利、强制退出计划和集中度风险管理要求，Eon 作为服务银行、保险公司和投资机构的云备份供应商会被直接触达。

              在美国，Eon 最直接限制收入的监管缺口是 FedRAMP 授权。Rubrik 在 2023 年获得 FedRAMP 授权，使其可以竞争美国联邦机构备份合同。Eon 没有披露 FedRAMP
              路线图，实际上被排除在估计每年基础设施支出超过 $5 billion 的美国政府云市场之外。截至 May 2026，公开记录没有 Eon 的执法行动、SEC 调查或专利诉讼；但考虑到
              Rubrik、Cohesity 和 Commvault 集中的专利组合覆盖备份去重、增量快照和索引方法，既有厂商发起 IP 主张的风险不低。以色列特定法律风险集中在 Innovation
              Authority（IIA）资助契约；如果 Eon 曾接受 IIA 资助研发，这些条款可能限制 IP 转让、制造和跨境许可。
