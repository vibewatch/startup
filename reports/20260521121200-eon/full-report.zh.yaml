  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式、定价与变现路径
        blocks:
          - type: paragraph
            body: >-
              Eon 公开披露的商业模式，在标价层面清楚，其他地方几乎全不透明。公司按每 GB 每月计费，把合同包装成随预期备份增长调整的灵活支出承诺，而不是设备采购或席位许可。这和产品形态一致：完全托管的
              SaaS，没有客户自建备份基础设施、代理或设备。财务上，这很关键，因为 Eon 更像经常性的云服务，而不是部署成本偏硬件的传统备份厂商。公开材料也显示变现不止一条路。核心经常性账单来自备份存储消耗，但 Eon
              也在卖备份态势管理控制平面，以及让备份数据可在 BigQuery 等工具中查询的分析层。分销也更依赖渠道：管理层称客户希望走云市场采购；Google Cloud
              合作正式落地云市场支持；转售商返佣可接近交易额四分之一，经济激励足够慷慨。缺口在实际成交价格。公开材料没有披露折扣、最低承诺、ACV，或核心备份与分析扩张各自贡献多少收入。
