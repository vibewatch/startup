  - id: TV002
    title: 投资逻辑 vs. 反向逻辑
    columns:
      - 立场
      - 论点
      - 支持证据
      - 什么会改变判断
    rows:
      - - 投资逻辑
        - 创始团队已被验证：二次创业、深耕同一领域，并有 CloudEndure→AWS 退出
        - 三位创始人均曾任职 AWS；CloudEndure 于 2019 年以 ~$200M 出售
        - 新管理团队不具备同等领域深度
      - - 投资逻辑
        - 在 $22B+ 增长市场中定义品类的平台，并有勒索软件顺风
        - Mordor 云备份 CAGR 24.8%；勒索软件防护到 2026 年达 $30B
        - 超大规模云厂商原生备份在 18 个月内达到功能等价
      - - 投资逻辑
        - AI 数据激活楔子把备份从成本项变成资产
        - Series D 投资逻辑：备份仓库是 AI 就绪的数据存储
        - 竞品或超大规模云厂商免费复制可查询备份层
      - - 反向逻辑
        - 估值是隐含 ARR 的 13–44x；没有 ARR 披露，结构上无法自洽
        - 未公开 ARR；上市可比公司交易在 ARR 的 6–9x；May 2026 SaaS 中位数为 6–7x
        - Eon 披露 ARR ≥ $350M，确认倍数低于 12x
      - - 反向逻辑
        - AWS API 依赖：如果 EBS 快照访问被撤销，架构失效
        - 整个无代理架构依赖 AWS IAM 和 EBS API
        - 达成多云等价后，单一超大规模云厂商无法卡住访问
      - - 反向逻辑
        - 客户集中：大型企业只有 “few tens” 家；CAC 不透明
        - Reuters 引用了较小企业客户数；流失率和 CAC 数据未公开
        - 客户基数扩至 200+ 个点名账户，并披露 NRR > 120%
    notes: |
      证据层级：投资逻辑行使用已确认的监管文件和新闻来源；反向逻辑行使用已观察到的缺口和第三方分析师对 SaaS 倍数的估计。
