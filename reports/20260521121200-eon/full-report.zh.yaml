      - number: '1.3'
        title: 融资历史、投资方与估值
        blocks:
          - type: paragraph
            body: >-
              Eon 不到两年完成五轮融资，多家来源称这是云基础设施史上最快的融资节奏之一。2024 年 1 月、公司正式发布前，Seed 轮融资 $20M，由 Sequoia Capital（合伙人 Shaun
              Maguire）领投，Vine Ventures、Meron Capital 和 Eight Roads Ventures 跟投。2024 年 9 月完成 $30M A 轮，由 Lightspeed
              Venture Partners 领投，Sheva 和 Omri Casspi（通过 Swish Ventures）参投，Eon 估值约 $215M。2024 年 10 月完成 $77M B 轮，由
              Greenoaks 领投、Quiet Ventures 参投，投后估值 $750M；值得注意的是，当时产品尚未公开发布，员工只有 36 人。2024 年 11 月完成 $70M C 轮，由 BOND
              领投，Sequoia、Greenoaks 和 Lightspeed 继续跟投，成立不到一年即达到 $1.4B 估值并成为独角兽。2025 年 12 月 2 日完成 $300M D 轮，由 Gil Capital
              的 Elad Gil 领投，估值增至 $4B，是上一轮的三倍；Sequoia、Lightspeed、Greenoaks、BOND、Affinity、Omri Casspi、Vine Ventures 和
              Georgian 参投。Tracxn 报告称，五轮累计融资 $497M。

              从 $215M（2024 年 1–9 月）到 $750M（2024 年 10 月），再到 $1.4B（2024 年 11 月）和 $4B（2025 年 12
              月），估值曲线因速度受到关注。投资方表态高度一致地乐观：Elad Gil 说，“数据是每家公司资产负债表上最有价值、但看不见的资产”；BOND 的 Jay Simons 称 Eon
              “为公司运营方式树立了大胆的新标杆”。Sequoia 的 Shaun Maguire 称团队是“云先驱”，在解决下一代备份管理问题。四家机构领投方都在后续轮次继续回投，是内部信心的信号。

              估值也伴随负面信号：Globes 在 2025 年 11 月指出，Eon 年收入估计在“数百万美元到略高于 $10M”之间，对应收入倍数远高于 100x，即便放在 2025 年 AI
              周期也极高。Calcalist 在 C 轮时独立指出，“尚不清楚 Eon 是否已开始产生可观收入”，并与 Wiz 作了不利对比；Wiz 在达到类似估值前，很快证明了显著销售增长。CEO 承认这种张力，2025 年
              3 月表示未来会有挑战，“我们会在路上失去客户”。
