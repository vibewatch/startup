        - CSP 对象存储定价变化；Iceberg 格式迁移风险（目前较低）
      - - WORM / Object Lock 层
        - 一次写入、不可变记录，在存储层阻挡勒索软件
        - CSP 对象锁原语（S3 Object Lock、Azure Blob 不可变性、GCS holds）
        - 未确认跨 CSP 复制；每个租户一个单云保险库
      - - AI / LLM 层（Vertex AI、Gemini、Claude）
        - 向量嵌入、自然语言到 SQL 转换、智能体式查询工作流
