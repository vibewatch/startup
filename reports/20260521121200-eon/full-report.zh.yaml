      - number: '8.2'
        title: 估值背景、融资结构与可比公司
        blocks:
          - type: paragraph
            body: >
              Eon 进入 Series D 时的投后估值为 $4 billion，Gil Capital 的 Elad Gil 领投，主要老股东全数回投：Sequoia Capital、Lightspeed Venture
              Partners、Greenoaks 和 BOND。该轮估值较不到 12 个月前 Series C 的 $1.4 billion 翻了近三倍，累计融资增至约 $497 million。Elad Gil
              是知名天使和种子轮投资人，投资组合包括 Airbnb、Stripe 和 GitHub，为该轮增添信用信号。从 $215 million（种子轮）快速升至 $4 billion（Series
              D）不到两年，反映出顶级分位的风险投资动能。

              三个公开可比对象锚定估值框架。Rubrik（NYSE: RBRK）是结构上最直接的参照，披露 FY2026 订阅 ARR 为 $1.46 billion（同比增长 34%）、FY2026 收入 $1.32
              billion；按 2026 年 5 月约 $12–13 billion 的市值计算，隐含 EV/ARR 为 8–9x。Veeam 仍为私有公司，2024 年 12 月老股交易按 $15 billion
              估值、ARR 为 $1.7 billion，隐含约 8.8x ARR。Commvault（Nasdaq: CVLT）是更成熟的数据保护平台，披露 FY2026 ARR 为 $1.12 billion，市值约
              $4.5–5 billion，隐含约 4–4.5x ARR。Multiples.vc 数据显示，截至 2026 年 5 月，各行业上市 SaaS 的 EV/ARR 中位数为 6–7x，云安全龙头为
              8–12x，AI 原生 SaaS 只在少数情况下享有溢价。战略并购更慷慨：Google 2026 年初以 $32 billion 收购 Wiz，隐含约 32x 预测
              ARR，为平台关键型云原生收购设定了极端上限。按 Eon $4 billion 估值，公司至少需要在 10–13x 倍数下维持 $300–400 million
              ARR，才算定价公允；收入翻三倍的轨迹使这一数字有可能达到，但目前仍未披露、不可核验。
