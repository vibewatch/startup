      - number: '5.2'
        title: 平台架构与运营模型
        blocks:
          - type: paragraph
            body: >-
              Eon 架构由六个逻辑层组成：SaaS 控制平面（控制台、REST API、Terraform provider、Go SDK、RBAC 和 SAML SSO）、云服务商连接器（AWS IAM 和 S3
              API、Azure Resource Manager、GCP 服务 API）、Cloud Backup Posture Management
              引擎（无代理发现、数据分类、自动策略执行、实时漂移检测和合规报告）、保护与韧性层（永久增量快照、跨数据集去重、勒索软件异常检测、不可变 WORM vault 和细粒度恢复）、支持零 ETL 分析的 Apache
              Iceberg 数据湖层，以及 AI 和智能体层（Eon AI Agent、MCP server、由 Google Gemini、Vertex AI 和 Anthropic Claude 驱动的 A2A
              connectors）。每个客户都运行在专属单租户云账户和 VPC 中，以逻辑隔离替代共享计算池。底层 CSP 对象存储的 WORM/Object Lock 原语（S3 Object Lock、Azure
              Blob immutability、GCS object holds）在存储层强制不可变；即便 Eon
              控制平面被攻破，备份也具备篡改可见性。勒索软件检测合并四类信号：熵扫描、文件扩展名模式分析、勒索信识别和行为元数据异常；针对结构化数据源，Eon
              还加入逻辑数据库内容分析，并将其定位为相对签名扫描工具的差异点。cloud.google.com/customers/eon 确认，AI 层使用 Gemini Flash 做向量嵌入，BigQuery
              external query 提供分析访问，Google Cloud Storage 作为备份数据存储。
