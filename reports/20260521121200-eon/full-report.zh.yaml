      - number: '7.3'
        title: 合作伙伴、依赖与集中度风险
        blocks:
          - type: paragraph
            body: >-
              Eon 的依赖图包括三层集中度风险：基础设施提供商、战略合作伙伴和关键客户。AWS 主导基础设施层，是 Eon 的主要云服务商。Azure 和 GCP 支持工作负载保护，但 Eon
              的控制平面和管理功能看起来托管在 AWS；October 2025 AWS 故障展示了控制平面未多元化的云原生供应商会有多大爆炸半径。

              SentinelOne 合作在 March 24, 2026 宣布，战略意义重要，但也带来双边依赖风险。SentinelOne 的 S Ventures 部门投资了
              Eon，股权绑定能缓解——但不能消除——合作终止风险。如果 SentinelOne 终止集成，Eon 将失去为勒索软件检测信号提供动力的特权 XDR 遥测数据，削弱一项关键差异化主张。受 DORA
              约束的欧盟金融实体客户自身也面对云集中度风险：DORA 的 ICT 集中度条款不鼓励依赖单一云服务商，这可能促使合规意识强的客户要求 Eon 提供多云控制平面冗余。

              客户集中度又增加一层风险：5 个具名企业客户（SoFi、AlphaSense、Sigdo Koppers、NETGEAR、StructuredWeb）构成公开参考基础。在当前成长阶段，具名账户早期流失会实质削弱
              Eon 的社会证明和销售速度。Apache Iceberg 获得 AWS、Google、Microsoft 和 Snowflake 的强生态支持，降低了开源治理风险，是依赖图中的相对亮点。
