        - 数据可移植层，让备份数据无需完整恢复即可查询；支撑数据湖激活用例
        - 中——社区项目，但 AWS、Google、Microsoft、Snowflake 和 Databricks 提供商业支持
        - Apache Iceberg 治理碎片化或商业分叉削弱企业采用，进而削弱 Eon 差异化
        - 低
        - Iceberg 获主要云厂商和 ASF 支持；生态强；治理失败风险低
        - 低——所有主要云厂商和数据平台都有广泛商业支持，分叉或废弃情景不太可能
