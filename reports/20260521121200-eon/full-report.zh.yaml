chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品与运营模式
        blocks:
          - type: paragraph
            body: >-
              Eon 于 2024 年 1 月 2 日以 EON IO, INC. 注册，是一家 VC 支持的未上市科技公司，总部位于 245 Fifth Avenue, New York, NY
              10016，主要研发中心设在以色列 Tel Aviv-Jaffa 的 Azrieli Sharona complex（121 Menachem Begin
              Road）。公司把使命定义为：让企业云备份数据即时可用，并把此前沉睡的存储转成活跃、AI 就绪的基础设施。

              核心产品是 Eon 声称首创的云备份态势管理（CBPM）平台。它提供两个主模块：Eon Data Protection，为 AWS、Microsoft Azure 和 Google Cloud
              提供无代理、云原生备份与韧性；Eon Data Lake Infrastructure，把备份、归档和历史数据转成开放表格式（Apache Iceberg 和
              Parquet），Snowflake、Databricks、BigQuery、Athena、Spark 和 Trino 等分析引擎可直接查询，无需 ETL 管道或手工恢复。平台设计上就是无代理：客户授予一个只读
              IAM 角色，Eon 便自主映射、分类并保护跨账户、跨区域的云资源。

              其他技术差异点包括：永久增量备份叠加云原生去重，可降低 30–50% 存储成本；内置勒索软件检测和不可变隔离保险库；细粒度恢复可下钻到单条数据库行；集成日志归档和即时搜索；以及通过 MCP 和 A2A
              连接器跨数据集执行 AI 自然语言搜索。围绕这些云存储和数据管理创新，Eon 已申请数十项专利。公司自称是“能够立即带来 ROI 和节省的自我回本平台”，把产品定位成节省的成本高于平台本身费用。

              运营模式是纯 B2B 企业 SaaS，并支持多云。Eon 官网披露了定价，模式看起来按资源和云消耗计费，但具体价格层级并未完整公开。收入依赖大型企业合同；截至 2025 年 12
              月，公司已积累“大型企业客户几十家”，包括公开具名的标杆客户 SoFi。
