        - 告警路由、事件流、ITSM 工单创建
        - 第三方 API 合约（Slack、PagerDuty、ServiceNow、Azure Service Bus）
        - 第三方 API 废弃或破坏性变更可能打断告警流水线
      - - Terraform Provider / Go SDK
        - 由 IaC 驱动的管理与程序化 API 访问
        - HashiCorp Terraform 生态；OpenAPI 规范
        - 社区采用度低（GitHub 4 星）；文档需客户登录后访问
