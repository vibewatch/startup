  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >
              Eon 的投资逻辑有四根互相强化的支柱。第一，创始团队已经证明自己能做云基础设施：2019 年把 CloudEndure 做成并以约 $200 million 卖给 AWS
              的三人组，现在用完整平台而非单点产品，切入更大、更耐久的企业云备份问题。第二，市场结构顺风：Mordor Intelligence 估计，云备份正以约 25% 年增速迈向 2031 年超过 $22 billion
              的总可用市场（TAM），勒索软件防护又叠加一个 $30 billion 空间。第三，Eon 的云备份态势管理（CBPM）架构短期很难复制：AWS、Azure 和 Google Cloud
              原生提供对象存储，但没有一家提供 Eon 这层自动化合规、成本效率和可查询备份能力。第四，AI 数据激活正在成为切入点：在多数企业里，备份库正在成为最干净、最完整的纵向数据存储；Eon 能让这些数据立即供 RAG
              和分析查询，形成现有厂商和超大规模云厂商都尚未优先投入的变现面。

              反向逻辑同样清晰。估值风险是最大问题：Series D 后估值 $4 billion，ARR 未披露，公司必须证明 13–44x 的隐含收入倍数合理，远高于上市数据保护龙头 6–9x 的交易区间。公司不到 24
              个月已融资 $497 million，客户仍只有「几十家」大企业，意味着 CAC 偏高；企业销售周期一旦放慢，烧钱速度会被放大。超大规模云厂商既是主要分销渠道，也是主要竞争威胁：AWS Backup、Azure
              Backup 和 Google 原生快照工具都在进步；若政策变化撤销第三方 EBS 快照 API 访问权限——尽管概率不高——Eon 的架构会受到实质冲击。最后，Eon 以以色列为研发基地，带来地缘政治、人才和
              IP 转移约束；公司在欧洲按 DORA 和 NIS2 扩张时，监管摩擦会增加。
