      - number: '2.3'
        title: 买方与细分市场格局
        blocks:
          - type: paragraph
            body: >-
              企业云备份采购由 IT 领导层（CIO、CISO）负责；在受监管行业，预算权通常在 CFO 层面，在科技公司则在 CTO 或工程副总裁手中。采购委员会正在扩大：IDC 的 2026
              年研究显示，采购、财务和收入运营团队如今与技术用户共同拥有决策权，供应商必须拿出量化 ROI 场景，而不是功能清单。Eon 把自己定位成降本（备份存储减少
              30–50%）和合规自动化平台，正好对准这个扩大的委员会。


              按垂直行业看，BFSI（银行、金融服务、保险）是最大的云备份需求板块，占 2025 年市场份额 26.06%，驱动因素是监管要求，以及欧洲金融机构同时承担 NIS2 / DORA
              合规负担。医疗健康是增长最快的垂直行业，CAGR 为 26.71%，由 HIPAA 和远程医疗数据量扩张推动。科技公司最能代表 Eon 当前客户基础（第 1 章中唯一具名参考客户是
              SoFi）：它们云支出强度高，也熟悉购买云原生工具。政府和公共部门买方也在增长，但数据主权要求会约束多云架构。


              按组织规模看，大型企业（1,000+ 员工）贡献 57.22% 的云备份收入。MSP（托管服务提供商）是主导渠道，占市场份额 41.04%，这意味着 Eon 的直销企业 GTM 一旦规模化，会遇到由 MSP
              中介的竞争动态。SMB 按数量增长最快，但单笔交易价值不是最高，这与 Eon 声称聚焦大型企业一致。各细分市场的采用触发点相当一致：差点发生或已经发生的勒索软件事件、合规截止日期，或暴露备份态势缺口的云迁移。
