      - number: '3.2'
        title: 既有厂商画像：规模、战略与方向
        blocks:
          - type: paragraph
            body: >
              Rubrik（NYSE: RBRK）是最直接可比 Eon 目标市场的公司，也是投资人预期的标尺。FY2026 Q4（截至 2026 年 1 月），Rubrik 披露订阅 ARR 为 $1.46B（同比增长
              34%），云 ARR 为 $1.29B（占订阅 ARR 的 88%），订阅 ARR 超过 $100K 的客户 2,805 家（增长 25%），non-GAAP 毛利率 84%，净收入留存率超过
              120%。FY2026 自由现金流 $238M，改善幅度达 10×；Rubrik 账上现金 $1.7B。Rubrik 的战略方向非常清晰：网络韧性和零信任数据安全。身份韧性贡献 33%+ 净新增 ARR，AI
              驱动威胁分析则是平台核心差异化。风险在于，2026 年初股价较 52 周高点低约 50%；分析师提示，随着安装基盘成熟、CrowdStrike 等新进入者切入同一数据安全领域，增长可能放缓。

              Cohesity 原本是横向扩展备份设备厂商；2024 年 12 月完成 $3B 收购 Veritas 数据保护业务（NetBackup 和 Alta）后，转身成为全球最大的企业数据保护玩家。合并后 ARR 为
              $1.5B，客户基础超过 12,000 家组织，Fortune 100 覆盖率达到 96%。Cohesity 的 $8B 估值（2025 年 4 月，此前 H 轮以 $7B 估值融资
              $1.1B）反映了战略投资人的信心：IBM 将 Cohesity 独家集成进 IBM Storage Defender，NVIDIA 则支持其 Gaia AI 平台。Cohesity 目标在 2026 年
              IPO，并瞄准 Rubrik 的市值，但面临尖锐的整合挑战：如何把遗留 NetBackup 客户大规模迁移到 DataProtect。其核心竞争话术是广度——本地、云和 SaaS 数据由一个平台管理——这与
              Eon 纯云原生态势正好相反。

              截至 2024 年末，Veeam Software 披露 ARR 为 $1.7B（同比增长 18%），服务超过 550,000 家组织，包括 Fortune 500 中的 77%。Insight Partners
              在 2020 年以 $5B 收购后持有多数股权；2024 年 12 月一笔 $2B 二级市场交易将 Veeam 估值推至 $15B。Veeam 获得 Gartner Peer Insights 2026
              Customers' Choice 认可，评分 4.8/5，推荐意愿 98%。2026 年 5 月 VeeamON 2026 上，Veeam 发布 DataAI Command
              Platform，把自己定位成“数据与 AI 信任公司”，拥有 300+ 连接器、AI 原生治理，以及跨备份数据的自然语言查询；这与 Eon 的数据激活主题直接重叠。Veeam Data Platform
              v13.1（目标 2026 年 Q3）加入后量子密码和 OpenShift Virtualization 支持。Veeam 的护城河是无可匹敌的安装基盘和渠道深度；相对 Eon
              的弱点，是软件定义的混合架构仍要求客户提供基础设施并完成配置。

              Commvault（NYSE: CVLT）披露 FY2026（截至 2026 年 3 月）总收入 $1.18B（同比增长 19%）、总 ARR $1.12B（增长 21%）、SaaS ARR $400M（增长
              42%）。Commvault Cloud Unity 平台统一混合、多云和本地环境中的数据安全、网络恢复和身份韧性。交叉销售动能强劲——48% 的托管 SaaS 客户使用多项产品——但一个渠道伙伴贡献了约 32%
              总收入，构成集中度风险。毛利率约 81–82%，non-GAAP EBIT 约 20%。Commvault 向 SaaS
              的战略转型在推进，但在既有厂商中最慢；它也是所有厂商中切换成本最高的一个（复杂多年合同和深平台集成），这一点对 Eon 有利也有弊：Commvault 账户很难撬动，但也很难在 Commvault
              已掌握的备份边界之外继续扩张。

              Druva 是架构上最像 Eon 的竞争者：全托管、100% SaaS、无硬件平台，聚焦云原生工作负载保护。不过，Druva 产品范围面向端点、Microsoft 365 和传统服务器工作负载，而不是云基础设施
              CBPM。其 2026 年 ARR 估计为 $259–273M，企业客户约 4,000+ 家，其中包括 65+ 家 Fortune 500；累计融资 $475M、估值 $2B，使其定位为中端市场 SaaS
              专家。Druva 不提供数据湖激活或零 ETL 分析能力，也缺少云基础设施态势管理，因此是部分替代品，而非直接竞争者。
