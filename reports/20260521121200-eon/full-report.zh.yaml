      - number: '8.3'
        title: 退出准备度与情景分析
        blocks:
          - type: paragraph
            body: >
              Eon 的退出准备度受到公开财务披露缺失的实质限制。可信 IPO 路径至少需要：经审计 GAAP 财务、披露 ARR 及 NRR、毛利率、经营现金流，以及一套 S-1 招股说明书叙事，证明 CBPM
              类别与更宽泛的云原生备份不同。截至 2026 年 5 月，这些要素均未披露。EY 的 2026 年 Q1 Global IPO Trends 报告称，2026 年 Q1 全球 IPO 共 307 起，较
              2023–2024 年低点恢复，科技和数字板块占比最高；但投资人对后期科技 IPO 的单位经济和盈利路径审查仍很严格。短期内，战略出售仍更可能发生：AWS、Microsoft 和 Palo Alto
              Networks 都在云数据保护和安全相邻领域积极收购。按当前 $4 billion 标记，战略买家在乐观情景下会支付 $4.5–8 billion，对本轮仅产生 1.1–2.0x
              回报，低于典型风险投资回报门槛；而且大概率只有 ARR 明显高于 $400 million 时才达成。

              推翻投资逻辑的条件很具体。若 AWS 调整 API 政策、撤销无代理 EBS 快照访问，Eon 的主要架构差异化会消失，买方尽调应立即暂停。收入增速若连续两个季度降至 50%
              同比以下，说明高端企业销售周期正在收紧。Rubrik 或 Cohesity 若发布覆盖 CBPM 等价态势管理的竞争功能，Eon 定价权会被压缩。若监管机构对以色列数据处理商执法，或欧盟 DPA 要求 Eon
              仅靠 AWS 无法满足的数据驻留义务，欧洲收入扩张会受到威胁。下列最终尽调要求是任何高于当前轮价格入场的硬门槛。
