      - number: '5.6'
        title: 产品与证据缺口
        blocks:
          - type: paragraph
            body: >-
              三个实质证据缺口限制了尽调信心。第一，所有合规资质都是自我声明，公开研究没有找到外部审计报告；这会在受监管行业造成采购摩擦，也是后期成长轮企业备份供应商最常被追问的风险因素。第二，Eon 的 SaaS
              平台没有公开状态页、可用性 SLA 或事故历史；关键备份基础设施供应商没有这些公开材料并不常见，也会让评估供应商运营成熟度的企业 SRE 团队警惕。第三，docs.eon.io 的开发者文档需要登录，外部无法评估
              API 质量、错误处理或 SDK 完整性。GitHub 开发者信号仍处早期：Terraform provider（eon-io/terraform-provider-eon）有 4 个 GitHub 星标和 1
              个 fork，Go SDK（eon-io/eon-sdk-go）有 2 个 GitHub 星标；两者都更像产品处在开发者初期采用阶段，而非成熟开放生态。Eon AI Agent 在 May 2026
              推出，天然带有 LLM 系统风险，包括幻觉、提示注入暴露，以及在备份 schema 上生成 SQL 的准确率不稳定；没有公开准确率基准或错误率数据。投资人应跟踪审计报告缺口（SOC 2 Type
              II）是否关闭、公开 SLA 文件是否发布，以及开发者生态增长信号，把这些作为下一轮尽调前企业就绪度的领先指标。
