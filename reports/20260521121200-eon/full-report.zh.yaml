      - number: '6.3'
        title: 具名客户证明
        blocks:
          - type: paragraph
            body: >
              截至 May 2026，Eon 发布了 5 个完整案例研究，覆盖 5 个不同企业垂直行业，另有第 6 个具名客户证言（Innago）。所有确认部署都是生产级，不是试点或
              POC；结果也有量化运营指标，而不只是方向性背书。

              SoFi（NASDAQ: SOFI）是云原生金融机构，员工超过 5,000 人，也是 Eon 最重点展示的参考客户。SoFi 在约两周内把 Eon 部署到 5 个 AWS 区域，首年 ROI 超过
              100%。恢复时间从一整天降到分钟级；数据准备时间改善超过 90%。具名背书人是 CJ Keefe，公司基础设施、DevOps 与 SRE 总监，他在 AWS re:Invent 2025 上被引用。

              AlphaSense 是 AI 驱动的市场情报平台，服务超过 6,500 家企业客户，包括大多数 S&P 100 公司；它选择 Eon 保护 PB 级专有和客户上传 AWS 数据。部署 3 天完成初始备份，25
              天进入完整生产，并对齐 SOC 级和受监管行业合规预期。

              全球网络设备制造商 NETGEAR 在一个 10TB 关键任务 SQL Server 数据库上，把备份存储成本降低 35%，恢复时间加快 88%，从 24 小时缩短到不到 3 小时。具名背书人是 Satish
              Nair，IT 高级经理。

              智利工业集团 Sigdo Koppers 拥有 10,000+ 员工，在主动基础设施迁移期间把 Eon 部署到 Google Cloud。相较原生 GCP snapshots，该部署预计备份成本降低约
              38%，并把关键财务系统恢复时间从约 2 天降到数小时。具名背书人是 Alejandro Zuniga，SK Converge IT 与安全架构师。

              StructuredWeb 将备份恢复取回时间缩短 98%，IT 手工分类工作量减少 20%，30 天内实现合规，并估计每年存储和恢复成本节省 40%。CEO Daniel Nissan
              提供了具名引用。Innago 是运行在 AWS EKS 上的物业管理 SaaS 平台，备份成本节省 40%，恢复时间降至 10–15 分钟。

              证据新鲜度高：SoFi 的背书在 December 2025 的 AWS re:Invent 2025 上展示，AlphaSense、NETGEAR 和 Innago 的案例研究发布于 2025–2026
              时间段。Google Cloud 也独立把 Eon 发布为客户成功案例，记录 GCP 部署中数据恢复时间改善 90%、成本下降 30–50%。反向信号：截至 May 2026，Eon 的 AWS
              Marketplace 上架页面客户评论为零；PeerSpot mindshare 为 0.7%（同比从 0.9% 下降），显示相对品类领导者，社区层面的独立验证仍有限。
