      - number: '8.4'
        title: 最终尽调要求与未解证据缺口
        blocks:
          - type: paragraph
            body: >
              六个证据缺口挡住了高确信度推荐。第一，Eon 未披露 ARR、NRR、CAC、LTV、毛利率或经营烧钱速度；没有这些指标，$4 billion
              估值无法在任何可比组下结构性核验。第二，五轮快速融资后的股权结构不透明——清算优先权堆叠、反稀释条款、投资人参与权均未知；若出售价格低于 $4
              billion，普通股回报可能被显著改写。第三，SentinelOne 在 2026 年 3 月 RSAC 合作公告中同步进行战略股权投资，引出未披露的利益冲突和治理问题，需要澄清。第四，FedRAMP
              授权状态未确认；若 Eon 到 2027 年仍没有可信 FedRAMP 路线图，美国联邦和受监管金融行业 TAM 基本关闭。第五，若存在 Israel Innovation Authority
              资助，会带来影响并购定价的 IP 转移限制。第六，Eon 尚未发布针对 AI Agent 的第三方渗透测试报告或 SOC 2 Type 2
              认证，高度受监管客户仍有安全保证缺口。当前估值或更高价格入场前，所有事项都应通过正式数据室审查解决。
