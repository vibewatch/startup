      - number: '2.5'
        title: 尽调缺口与规模不确定性
        blocks:
          - type: paragraph
            body: >-
              三个结构性尽调缺口限制了规模分析。第一，CBPM 作为具名分析师品类尚不存在。截至 2026 年 5 月，没有 Gartner 或 IDC 报告按“云备份态势管理”切分市场；Eon
              正在主张一个尚未被独立分析师研究验证的品类边界。这意味着 CBPM 本身的 TAM 来自组成市场推导，而不是直接测量。缺少分析师分类也意味着，Eon
              的竞争对手——云原生快照、Veeam、Rubrik、Cohesity——被放在重叠但不相同的市场篮子里，无法干净相加。


              第二，四家分析师来源对 2026 年云备份市场规模的估算最多相差 32%（Mordor $7.13B、BRC $9.41B、Fortune BI $8.73B，以及隐含的 $6.99–8.73B
              区间）。企业备份系统 TAM 估算相差 44%（Fortune BI 仅软件口径 $13.06B，对比 GlobalGrowthInsights 更宽系统口径
              $18.8B）。这些矛盾无法漂亮地消解，应理解为：市场边界本身仍有争议。


              第三，若不知道以下信息，就无法独立估算 Eon 的 SAM 和 SOM：（a）有多少企业拥有 500+ AWS / Azure / GCP 资源但缺少自动化 CBPM；（b）云备份支出中，有多少落在 Eon
              销售的具体功能集，而不是大规模快照存储；（c）数据湖分析能力是否拥有独立预算线，还是被捆绑进备份合同。除非 Eon 或分析师发布 CBPM 子板块的自下而上 TAM，否则任何 SOM 预测都带有高度不确定性。
            claimRefs:
              - CM038
              - CM039
              - CM040
