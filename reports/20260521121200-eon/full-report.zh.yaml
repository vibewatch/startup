        - 高——双提供商 AI 依赖支撑 AI Agent 的主要新产品差异化
        - 模型 API 废弃、大幅涨价，或针对 LLM 数据流的 GDPR 执法行动
        - 中
        - 双提供商策略（Gemini + Claude）降低单模型依赖；未披露开放权重模型后备方案
        - 中——Google 和 Anthropic 都在 Eon 的 VC 生态中（Google Ventures、Sequoia）；存在利益一致，但没有合同绑定
      - - 开放表格式和数据湖可移植性
