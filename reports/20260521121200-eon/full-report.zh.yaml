      - number: '6.4'
        title: 留存、耐久性与满意度
        blocks:
          - type: paragraph
            body: >
              截至 May 2026，Eon
              没有公开披露净收入留存率（NRR）、总收入留存率（GRR）、年度流失率、队列留存数据或客户满意度分数。这符合公司的早期阶段和私营披露姿态，但评估客户耐久性的投资人会看到一个显著缺口。

              间接留存证据方向上正面，但样本很窄。Sigdo Koppers 明确计划继续用 Eon 作为标准保护模型，把更多工作负载迁到 Google Cloud，说明它在主动扩张而不是流失。SoFi 计划随着 AWS
              足迹增长继续扩大 Eon 备份覆盖。AlphaSense 正在探索初始备份用例之外的更广平台能力。三个有纵向记录的账户都呈现扩张轨迹，而不是收缩；公开记录中没有流失事件，说明成功的初始部署会带来更多工作负载覆盖。

              Eon 的按用量定价模型（每 GB 每月）为自然收入扩张创造了结构性机制：客户云数据量增长时，Eon 从每个账户获得的收入会按比例增长，不需要新的销售周期。这个结构有利于 NRR 超过 100%，在数据基础设施
              SaaS 中也常见，但 Eon 没有公开确认实际 NRR。

              第三方满意度信号稀少。PeerSpot 报告 Eon 在 Cloud Backup 品类中的 mindshare 截至 May 2026 为 0.7%，低于前一年的
              0.9%；相对市场机会和竞争集合，这说明社区层面采用增长有限。SourceForge 上 Eon 评论量很少，AWS Marketplace 截至 May 2026
              没有独立客户评论。这些空白很可能反映公司处在商业化早期，且商业化路径面向企业；相比中端市场或 SMB 供应商，这类公司更少产生匿名公开评论。但这些空白也让留存和满意度主张缺少重要的独立佐证。
