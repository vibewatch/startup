      - number: '2.2'
        title: 市场规模 — TAM、SAM 与矛盾估算
        blocks:
          - type: paragraph
            body: >-
              分析师对云备份市场的覆盖给出了很宽的估算区间，必须把它们当作模糊代理，而不是精确数字。2026 年，Mordor Intelligence 估算云备份市场为 $7.13B；Business Research
              Company 估算为 $9.41B；Fortune Business Insights 估算为 $8.73B，差距达 32%。三者对 2030–2031 年前的 CAGR 判断大致收敛在
              24–26%。分歧来自口径不同：Mordor 聚焦云交付备份服务，BRC 则把硬件厂商销售的云备份存储产品也纳入。这个矛盾会实质影响 Eon 机会空间的测算，应保留，而不是任意抹平。


              可服务市场（SAM）应收窄到企业多云环境，且 CBPM 自动化相对替代方案能交付更高 ROI。Eon 自身发布材料称，企业估计其总云账单的 10–30% 用于备份存储和管理。这意味着 SAM
              与云基础设施支出相关，而不是由一个固定市场研究数字决定。若全球云基础设施到 2034 年达到 $838B（Eon 发布新闻稿引用的数字），10–30% 的备份支出占比意味着 2034 年潜在 SAM 为
              $84B–$251B，远大于狭义云备份市场；但这一推算必须接受 Eon 对企业支出行为的自有估计。


              企业备份与恢复软件市场（Fortune BI 估算 2026 年 $13.06B）以及更宽的企业备份与恢复系统市场（GlobalGrowthInsights 估算 2026 年 $18.8B）构成更大的相邻
              TAM，但 CAGR 较慢，约 8–11%。勒索软件保护市场（Mordor 估算 2026 年 $30.04B）和更宽的数据保护市场（Fortune BI 估算 2026 年
              $199.32B）大得多，但备份层产品只能覆盖其中一部分。2026–2029 年期间，Eon 合理可获得市场（SOM）或许为 $3B–$8B，对应拥有 500+ 云资源、并主动采用 CBPM
              的企业云原生细分市场；但这个数字是推导结果，并非分析师确认值。
