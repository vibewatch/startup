  - id: TV005
    title: 投资逻辑破裂触发项与否决标准
    columns:
      - 触发项
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - AWS 撤销第三方 EBS/RDS 快照 API 访问
        - AWS 政策变化，或服务条款修订，限制 ISV 只读 IAM 快照访问
        - Eon 整个无代理架构都依赖这条 API 路径；一旦丢失，公司要么花多年重构，要么退出
        - 立即暂停：冻结全部尽调，等待架构重新评估
      - - 收入增速连续两个季度放缓至 YoY 50% 以下
        - ARR 增长连续两个报告期确认 <50% YoY
        - 增速低于 50% 后，对照 6–9x 的上市可比公司，很难支撑 10x+ ARR 倍数
        - 下调至回避；估值已经明显偏高，退出端看不到溢价路径
      - - 确认发生大规模勒索软件攻击，影响 Eon 平台存储的备份数据
        - 安全事件触发 NIS2/DORA/CCPA 报告窗口下的客户通知义务
        - 核心产品承诺（可靠、干净的恢复副本）失效；流失风险和品牌受损上升
        - 立即回避；跟踪客户流失和监管执法行动
      - - 具名前三大客户流失，或公开合同取消
        - 公司任何公开披露的企业级锚定客户（例如 SoFi）离开
        - 大型企业客户只有“几十家”，单一大客户流失就是重大收入事件
        - 列入观察；启动独立客户访谈计划
      - - 竞争性功能追平：Rubrik 或 Cohesity 发布 CBPM 等价产品
        - 成熟竞争对手 GA 发布自动化云备份态势管理产品，价格相当或更低
        - Eon 差异化坍塌；竞争护城河收窄到团队和市场进入速度
        - 下调至继续研究；评估客户切换成本和 Eon 产品路线图领先度
    notes: |
      除明示数字外，阈值均为定性标准。截至 2026-05-21 runDate，所有否决触发项均未启动。
    claimRefs:
      - CV007
      - CV025
      - CV037
      - CV041
      - CV042
  - id: TV006
    title: 最终尽调问题清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - ARR 与 NRR
        - 当前 ARR、季度新增 ARR、按队列拆分的净收入留存
        - 没有 ARR，$4B 估值无法承销；NRR 决定增长来自自然扩张还是只靠新签落地
        - 数据室请求；经审计的管理账或董事会级报告包
      - - 股权结构表与优先股堆叠
        - 完整股权结构表，列出各投资人的清算优先权、参与权、反稀释条款和按比例跟投权
        - 若退出估值低于 $4B，投资人优先权可能吃掉普通股回报；24 个月 5 轮融资叠出的投资人保护结构大概率复杂
        - 数据室请求；法律顾问提供股权结构模型
      - - 烧钱速度与现金跑道
        - 月度总烧钱额和净烧钱额、截至 2026 年 Q1 的现金余额、按当前消耗速度推算的现金跑道
        - 已累计融资 $497M，$4B 估值意味着资金投放规模不小；烧钱曲线决定公司还能不融资跑多久
        - 数据室请求；CFO 访谈；银行流水确认
      - - AWS 依赖的合同条款
        - 书面 API 访问协议、MSA 修订或 AWS Marketplace 合同条款，约束快照 API 连续性
        - '政策风险是 #1 架构否决标准；书面协议或 SLA 承诺可部分缓释'
        - 审阅 AWS ISV 协议；直接确认 AWS BD 关系
      - - FedRAMP 与欧盟监管路线图
        - FedRAMP 授权状态或时间表；GDPR DPA 协议；面向欧盟金融业客户的 DORA 第 30 条合规路线图
        - 没有 FedRAMP 会关上美国联邦 TAM；不符合 DORA 会在欧盟金融业客户中制造企业流失风险
        - 合规团队访谈；监管路线图文件；SOC 2 Type 2 报告
      - - 客户背调计划
        - 至少 5 家具名企业客户愿意讨论部署范围、NRR 和竞争评估流程
        - 客户只有“几十家”，背调质量就是判断客户质量和留存的主要代理变量；每个背调都是重要数据点
        - 通过介绍人安排客户背调电话；独立审计 Gartner Peer Insights / G2 评价
    notes: |
      尽调问题按其对投资决策的重要性排序。第 1–3 项为阻断项；第 4–6 项高度重要，但可与条款谈判并行推进。
    claimRefs:
      - CV037
      - CV046
      - CV047
      - CV048
      - CV049
