      - number: '7.4'
        title: 财务、执行与人员风险
        blocks:
          - type: paragraph
            body: >-
              Eon 的财务风险有两个重大未知数：现金消耗和 ARR 轨迹。公司累计融资 $497 million，估值 $4 billion，员工规模足以支撑 New York 和 Tel Aviv
              双办公室，年度现金消耗可能接近或超过 $100 million。公司没有公开披露 ARR。若投资人依赖 $4 billion 估值，就必须接受收入倍数和距离 Series E 或盈利还有多久存在大量估计不确定性。

              人员风险偏高，因为三位联合创始人——CEO Ofir Ehrlich、President Gonen Stein 和 CTO Ron Kimchi——共同掌握着把 Eon 产品架构与 CloudEndure
              收购联系起来的机构记忆，也就是团队获得 AWS 内部人优势的来源。三人中任何一人在没有成文继任计划的情况下离开，都会构成重大负面信号。以色列研发集中度进一步放大风险：Tel Aviv–Azrieli
              Sharona 是核心工程中心，而以色列-伊朗轴线持续紧张（美国国务院 Travel Advisory 自 October 2023 起为 Level 3），带来不可忽视的业务连续性暴露。以色列创投生态在
              2025 年融资 $15.6 billion，显示韧性，但升级情景下的尾部风险仍需监控。

              既有厂商 IP 诉讼风险不低。Rubrik、Cohesity 和 Commvault 合计持有大量专利组合，覆盖备份去重、增量快照、对象级索引和编排工作流。随着 Eon 市场份额增长，并且其技术借 RSAC
              2026 新闻曝光变得更可见，专利主张索赔的概率会显著上升。
