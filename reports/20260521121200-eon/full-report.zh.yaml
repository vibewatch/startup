            body: >
              Cohesity-Veritas 合并在 December 2024 完成，形成一家拥有 $1.5 billion ARR、12,000+ 客户、覆盖 96% Fortune 100、掌握 IBM OEM
              渠道并获得 NVIDIA AI 投资的单一实体。该实体如今同时占住现代云备份和传统替换两个位置。结果是，「从传统备份迁移出来的客户」（过去也是 Cohesity 的目标）现在会被合并实体的迁移方案部分截流，Eon
