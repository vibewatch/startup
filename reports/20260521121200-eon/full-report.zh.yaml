      - number: '3.3'
        title: 定价、分销与切换成本
        blocks:
          - type: paragraph
            body: >
              既有厂商定价普遍不透明：Rubrik、Cohesity、Commvault 和 Veeam
              都采用企业销售询价制，根据工作负载数量、留存周期、功能层级和量折折扣定制交易结构。公开基准和从业者反馈显示区间很宽：Commvault 普遍被认为最贵，其次是
              Rubrik（带有运营简单性的溢价）、Cohesity、Veeam，Druva 位于较低端。AWS Backup 和 Azure Backup
              采用按消耗计价、无需前置承诺，因此对已经在单一云内的公司来说是最低成本入口；但若要加入跨云支持、长期留存和高级安全功能，就需要第三方厂商或显著运营开销。

              Eon 定价可在 eon.io 网站看到，并遵循按资源、与云消耗对齐的模式。公司自述的 ROI 模型称，平台通过永久增量去重降低 30–50% 存储成本，节省额高于平台费用。该主张尚未在规模上被独立验证，但
              SoFi 公开证言显示数据准备时间减少 90%+，提供了一个佐证客户案例。

              竞争者之间的切换成本高度不对称。Commvault 切换成本最高，原因是平台集成很深、多年合同、技能投入，以及备份、合规和身份韧性模块之间的依赖。Rubrik 通过专有 SLA
              策略引擎和不可变云归档格式制造强锁定。Veeam 在既有厂商中架构锁定最低，因为其备份格式标准、软件定义架构不绑定硬件；这也使 Veeam 客户成为 Eon 最容易迁移的目标。Druva 的 SaaS
              模式切换成本中等，主要绑定在代理部署和策略配置上。

              Eon 自身也在通过专有 Apache Iceberg 目录索引、定制 CBPM 策略框架和深度 IAM 角色集成来建立切换成本；若要替换，必须迁移数据并重新配置。随着安装基盘增长，Eon
              的锁定深度会增加；但以当前“大型企业客户几十家”的规模，还没有形成自我强化的客户留存动态。既有厂商分销能力很强：Veeam 的 550,000 客户基础和全球 VAR 网络、Commvault
              的托管服务提供商生态、Cohesity 的 IBM OEM 渠道，都赋予既有厂商销售速度优势，Eon 当前规模下的直销企业动作还无法匹配。
