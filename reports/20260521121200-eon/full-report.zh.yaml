  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户基础与分层
        blocks:
          - type: paragraph
            body: >
              Eon 的主要买方是大型云原生企业，重点覆盖多云基础设施足迹显著、需要满足监管合规，并希望把沉睡备份数据用于 AI 和分析的组织。截至 May 2026，所有公开具名 Eon 客户都是运行在 AWS 或
              Google Cloud 上的大型企业，没有公开确认的本地部署或 SMB 部署。

              从已发布案例研究和第三方评论平台数据看，Eon 客户至少横跨六个垂直行业：金融科技（SoFi，NASDAQ 上市，5,000+ 员工）、市场情报与企业 AI（AlphaSense，服务超过 6,500
              家企业客户）、工业服务（Sigdo Koppers，10,000+ 员工，智利跨国公司）、网络设备（NETGEAR，全球企业）、企业 SaaS（StructuredWeb）和物业管理
              SaaS（Innago）。PeerSpot analytics 截至 May 2026 显示，金融服务（14%）和保险（34%）合计贡献了接近一半的 Eon 评论平台互动流量，确认受监管行业主导买方结构。

              买方角色通常是受监管企业里的 IT 基础设施负责人、DevOps 总监或云架构师，负责备份合规、灾难恢复 SLA，并越来越多承担为 AI 项目释放数据的任务。付款方是企业 IT 预算负责人，有时需要 CFO
              级别签字，Sigdo Koppers 的采购流程就是证据。使用者覆盖 IT 运维、安全团队和数据分析师，他们会使用搜索、恢复和分析能力。地理分布是全球化但以美国为中心：美国客户包括
              SoFi、AlphaSense、NETGEAR 和 StructuredWeb，国际客户包括 Sigdo Koppers（Chile，Google Cloud）。
