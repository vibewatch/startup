      - number: '1.2'
        title: 创始人、管理层与关键人物依赖
        blocks:
          - type: paragraph
            body: >-
              Eon 由三名高管创办。他们此前的公司 CloudEndure 在 2019 年被 Amazon Web Services 收购，随后三人在 AWS 共事四年。Ofir Ehrlich 任 CEO
              兼联合创始人；他是连续创业者，Eon 是第四家公司，此前已有两次退出，其中 CloudEndure 以约 $200M 卖给 AWS，是最能支撑投资人信心的履历。Ehrlich 的人脉延伸到以色列国防军 8200
              部队创新网络，Eon 因此接入了孕育 Wiz、Fireblocks、Lightricks 和 Snyk 的同一生态。Gonen Stein 任总裁兼联合创始人，2013 年与 Ehrlich 联合创办
              CloudEndure 并主导业务运营；据 Calcalist 报道，Stein 在纽约负责美国商业运营，Ehrlich 和 Kimchi 则负责以色列研发中心。Ron Kimchi 任 CTO
              兼联合创始人；他曾在 AWS 以色列担任灾难恢复和云迁移总经理，负责基于 CloudEndure 技术的项目，带来深厚的 AWS 基础设施和产品架构经验。

              除三名创始人外，Eon 的 D 轮公告还明确提到 Avi Biton 担任 CFO、Moshe Milman 担任 CSO（首席战略官）。CEO、总裁、CTO、CFO、CSO 五人高管班子，符合一家 D
              轮后准备规模化的公司的领导结构，尽管未上市公司的治理文件有限。截至 2026 年 3 月，公司约有 192 名员工；而 2024 年 10 月 B 轮时，公司在纽约和特拉维夫合计只有 36
              人，团队扩张速度与融资速度同步拉高。

              关键人物依赖较高：Ehrlich 是主要公众面孔和融资锚点，Calcalist
              报道称他会先亲自设计每轮条款，再接触投资人。紧密的创始团队，以及同一组投资方（Sequoia、Lightspeed、Greenoaks、BOND）反复共同投资，带来治理连续性，也带来集中度。截至
              runDate，尚无公开报道显示出现重大负面管理层事件，包括离职、争议或治理重组。
