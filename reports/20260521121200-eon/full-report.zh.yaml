      - number: '4.2'
        title: 公开牵引力与销售效率代理指标
        blocks:
          - type: paragraph
            body: >-
              Eon 最好的公开财务证据是间接的：客户结果、部署速度和管理层表述。Reuters 报道称收入增长超过三倍，Eon 服务数十家左右大型企业客户，其中包括
              SoFi，但绝对收入仍未披露。客户参考的质量明显强于原始数量。Eon 反复声称可节省 30% 到 50% 存储成本；客户页面突出一个首年 ROI 超过 100% 的案例；NETGEAR 报告 10TB SQL
              Server 数据库成本下降 35%、恢复速度提升 88%；Google Cloud 引用 90% 更快恢复和 30% 到 50% 基础设施成本下降；SoFi 称数据准备时间改善超过
              90%。这些指标不是经审计的单位经济，但说明买方足够快看到了可量化价值，足以支撑扩张和续约。公开接入信号也偏正面。一个客户从启动会到生产上线用了 25 天，初始备份 3 天完成；NETGEAR
              称部署不到一周，几乎无需重新培训。用于投资判断时，这些是正面的销售效率代理指标；它们不能替代 ACV、CAC 回本周期或 NRR，而这些仍未披露。
