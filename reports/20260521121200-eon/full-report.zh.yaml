      - number: '7.5'
        title: 缓释措施、监控指标与投资逻辑破裂触发器
        blocks:
          - type: paragraph
            body: >-
              Eon 已搭建实质性的安全与合规基线：SOC 2 Type 2 和 ISO 27001 认证表明，其安全控制成熟度足以进入企业采购流程。100% 无代理架构配合只读 IAM
              访问，从结构上降低备份平台被攻破后的爆炸半径；这正是对最常见备份定向勒索软件的架构回应。SentinelOne 合作把基于 XDR 的实时威胁检测加入备份工作流，把 Eon
              的检测能力扩展到独立备份供应商通常达不到的范围。不可变、只追加的快照存储满足企业客户对勒索软件韧性的核心要求。

              投资人应跟踪五个主要监控指标：（1）AWS 依赖多元化——出现 Azure 或 GCP 控制平面支持证据，会实质降低集中度风险；（2）FedRAMP 授权进展——提交 Authority to Operate
              申请将打开联邦市场，并释放合规成熟度信号；（3）NIS2 和 DORA 客户合规认证——面向欧盟客户签发的认证可确认 Eon 已通过第三方风险审查；（4）SentinelOne
              合作深度——从检测信号扩展到联合商业化，将证明合作耐久性；（5）领导层连续性——三位创始人在未来 18 个月都留在主动运营角色，是执行风险管理的最强信号。

              需要投资人立即复核的投资逻辑破裂触发器包括：AWS 发布政策变化，撤销或实质限制第三方访问 EC2、EBS 或 RDS snapshot API；确认发生影响 Eon
              客户数据的大规模数据泄露；六个月内超过一位联合创始人离任；发现重大 IIA 资助 IP 转让限制，制约 M&A 或技术许可；或超大规模云厂商宣布以显著更低价格实现原生 CBPM
              功能对等。上述触发器若同时出现两个或以上，就会构成对投资逻辑的根本挑战。
