          - type: callout
            title: 可比锚点：Rubrik FY2026 10-K 提供公开基准
            body: >
              Rubrik 2026 年 3 月向 SEC 提交的 10-K，是云数据保护平台估值最可信的公开锚点。Rubrik 的订阅 ARR 为 $1.46 billion、同比增长 34%、非 GAAP 毛利率
              83%、NRR 超过 120%，这些都是 Eon 规模化后必须匹配或超过的标准，才有资格获得相当或更高倍数。按 Rubrik 8–9x ARR 倍数，Eon 需要 $445–500 million ARR
              才能与当前估值持平；这个门槛意味着 Eon 已大幅超出已披露增长轨迹。
            calloutType: insight
