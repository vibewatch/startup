      - number: '6.5'
        title: 扩张、集中度与采购摩擦
        blocks:
          - type: paragraph
            body: >
              Eon 的先落地再扩张机制嵌在按用量定价架构里。云数据量增长时，Eon 上的备份支出会按比例增长。除自然数据量扩张外，平台还提供自然足迹扩张：从 AWS 起步的客户可以加入 Azure 和 Google
              Cloud 工作负载；最初为备份合规购买的客户，也可扩到数据湖激活用例，用于 AI 和分析。Eon AI Agent 于 May 2026
              推出，为现有客户增加了新的扩张面，让他们不用新增基础设施，就能用自然语言查询备份和归档数据。

              鉴于报告中的客户基础只有「数十家左右」大型企业，客户集中度是实质风险。不了解各账户收入分布时，任何单一大客户流失都可能造成不成比例的财务影响。Eon 只发布了 5
              个详细案例研究，说明其证明语料相对拥有数千个记录部署的品类既有厂商仍有限。

              在 Eon 目标企业细分市场里，采购摩擦中高。Sigdo Koppers 案例研究记录了 CFO 主导的决策流程，需要每月跨公司 IT 领导层会议；即使最终被 ROI 说服，企业销售周期也可能持续数月。Eon
              借助云市场可用性缓解了部分采购摩擦：产品作为 SaaS 在 AWS Marketplace 上架，可用于 AWS Private Pricing Agreement（PPA）承诺，让企业把 Eon
              支出计入已承诺的 AWS 预算。Azure Marketplace 和 Google Cloud Marketplace 上架进一步降低了云承诺买方的采购摩擦。AWS Marketplace 还为合格美国买方提供
              PNC Vendor Finance 信用额度选项。截至 May 2026，公开证据没有确认规模化转售商、VAR 或 MSP 渠道计划，这可能限制 Eon 触达非超大云绑定或中端企业账户的能力。
