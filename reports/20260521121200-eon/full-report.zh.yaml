        title: 财务结论与剩余投资判断障碍
        blocks:
          - type: paragraph
            body: >-
              Eon 的公开财务画像，形态有吸引力，披露深度却偏弱。有吸引力的一面很清楚：经常性的用量定价、明确的企业 ROI
              主张、快速部署证明，以及足够新鲜的资本，让公司不必立刻承受融资压力。薄弱的一面同样清楚：即便估值已达 $4
              billion，公司仍未披露绝对收入、ARR、ACV、CAC、毛利率、烧钱速度、现金余额或有意义的股权结构细节。Globes 在 March 2025
              已经提示估值膨胀速度和投资人推动下一轮融资的压力，Reuters 到 December 2025 仍只报道方向性增长指标。这不能证明 Eon
              被高估，但意味着公共信息投资人无法检验公司究竟拥有一流基础设施经济性，还是只有一流叙事。本章结论因此偏谨慎。收入质量看起来高于年轻私营基础设施厂商平均水平，资本强度低于设备类同业，客户价值也像是真实存在。但在管理层拿出完整收入桥、队列表、毛利率拆解和现金
