            title: 建议：观察，低置信度
            body: >
              Eon 的评级应为观察，而不是买入，因为相对每一个已披露可比对象，估值都偏高；公司也没有披露支撑 $4 billion
              入场定价所需的财务数据。创始人战绩、市场规模、收入轨迹和投资人组合都很有吸引力；但仅靠这些信号，无法证明一个需要 $300–400 million 以上未披露 ARR
              才算公允的溢价合理。若要上调评级，必须先守住入场纪律，并拿到强制性数据室包（ARR、NRR、股权结构表、烧钱速度）。
