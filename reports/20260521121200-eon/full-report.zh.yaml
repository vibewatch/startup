          - type: callout
            title: 既有厂商和渠道权力让 Eon 在销售上结构性吃亏
            body: >
              Veeam 拥有 550,000 家企业客户和全球 VAR 网络，Commvault 掌握托管服务商生态，Cohesity 在合并后又拿到 IBM OEM 渠道；这些既有厂商的分销杠杆，Eon
              目前靠直销还复制不了。企业采购委员会默认选择成熟厂商，而 Eon 只有「数十家左右」参考客户，不足以为大预算备份基础设施决策提供足够社会证明。Eon
              尚未建立正式渠道伙伴网络，这是实质性的商业化执行风险；在收入增长能支撑 $4 billion 估值之前，这个问题必须解决。
