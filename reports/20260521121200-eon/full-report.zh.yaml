      - number: '3.6'
        title: 证据要点
        blocks:
          - type: callout
            title: 未被挑战的数据湖激活护城河
            body: >
              截至 May 2026，Eon 能把云备份数据零 ETL 转成 Apache Iceberg 格式，让 Snowflake、Databricks、BigQuery、Athena、Spark 和 Trino
              不经恢复步骤就能直接查询；在所有点名竞争对手中，这套架构独一份。备份因此不再只是成本中心，而是可实时调用的数据资产，也能打动 CFO 和数据平台负责人，不只面向传统 IT
              备份买家。现有备份厂商没有同等能力；要复制这件事，必须深改备份存储架构，无法靠短期外挂补上。
            calloutType: strength
            claimRefs:
              - CP040
              - CP043
