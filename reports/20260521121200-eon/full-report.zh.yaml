      - number: '7.2'
        title: 运营与安全风险
        blocks:
          - type: paragraph
            body: >-
              Eon 的运营风险主要由两个相互连接的威胁向量主导：专门瞄准云原生备份库的勒索软件，以及 Eon 与 AWS 基础设施深度耦合带来的单云集中度风险。Google Cloud Threat Horizons
              Report for H1 2026 确认，2025 年云定向攻击增加 37%，云数据泄露事件中 44% 涉及勒索软件。Eon
              的云勒索软件指南承认，熟悉云环境的攻击者如今会先枚举并删除备份快照，再加密主工作负载——这套战术就是为了让传统恢复工作流失效。Eon 的核心反制措施是不可变、只追加的快照版本控制，再叠加只读 IAM
              访问，防止攻击者通过备份平台横向移动。

              AWS 集中度风险在 October 2025 US-EAST-1 故障中有了具体体现：那次故障同时扰乱了数百个云原生应用。Eon 的无代理架构通过云 API 连接，这意味着 AWS
              一旦故障或有意调整策略——例如弃用 EC2 或 EBS snapshot API——Eon 客户可能在没有预警的情况下受影响。Apache Iceberg 的开放表格式提供理论上的数据可移植性，但 Eon
              的计算编排、IAM 集成和控制平面操作仍深度 AWS 原生。Viking Cloud 的 2026 勒索软件统计报告确认，备份平台和云存储 bucket 现在已位列勒索软件攻击目标前五类。

              Eon AI Agent 在 April 2026 引入，整合 Google Gemini 和 Anthropic
              Claude，也带来新的运营风险面：作为自然语言查询管线的一部分，客户备份元数据和查询模式会传给第三方 AI 模型。取决于数据范围，这可能触发额外 GDPR 控制者义务，或违反企业客户的数据主权要求。Eon
              没有公开说明底层 AI 供应商是否会记录、缓存客户数据，或将其用于模型微调。
