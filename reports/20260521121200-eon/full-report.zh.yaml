            title: 关键优势：一线投资人组合与连续创业者可信度
            body: >
              Sequoia Capital、Lightspeed Venture Partners、Greenoaks 和 BOND Capital 全部在 Series D 回投，并由新领投方 Elad Gil
              加入。完整投资人组合参投，说明掌握最多信息的投资人（在前几轮看过财务数据的内部人）仍看好公司轨迹。Elad Gil 曾早期投资 Airbnb、Stripe、Coinbase 和
              GitHub，进一步提高信号质量。创始团队把 CloudEndure 做到出售给 AWS，这一退出经历为其云备份创业提供了少见的领域可信度。
