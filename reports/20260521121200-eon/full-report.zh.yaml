      - number: '5.5'
        title: 信任、安全与合规
        blocks:
          - type: paragraph
            body: >-
              Eon 的合规定位声称对齐 GDPR Article 32 数据保护要求、HIPAA 行政和技术保障条款、PCI-DSS 备份完整性控制、ISO 27001 信息安全管理体系要求、SOC 2 Trust
              Services Criteria，以及 NIST CSF 五大支柱（Identify、Protect、Detect、Respond、Recover）。公开来源确认的技术控制包括：由 WORM/Object
              Lock 在云存储层强制的不可变性、借助不可变 vault 实现的逻辑 air-gap、可用 Terraform 管理角色层级的 RBAC、SAML 和 SSO federation（Terraform
              provider 确认支持 Okta），以及每个客户单租户账户和 VPC 隔离。但外部研究没有找到公开 SOC 2 Type II 审计报告、PCI Attestation of Compliance、ISO
              27001 证书或 HIPAA Business Associate Agreement 模板。本章所有合规主张都只来自 Eon
              自己的博客和营销页面，属于供应商自我陈述，而不是独立第三方保证。这是实质证据缺口；在 Eon 的 Series D 价格点上，企业采购尽调一定会提出这个标准问题，尤其来自金融服务和医疗健康等受监管行业的买方。
