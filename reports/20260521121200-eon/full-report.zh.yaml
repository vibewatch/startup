          - type: callout
            title: 结构性风险：未披露财务数据，估值偏高
            body: >
              Series D 后估值 $4 billion 且未披露 ARR，Eon 的隐含收入倍数会随 ARR 假设落在 13x 到 44x。2026 年 5 月上市 SaaS EV/ARR 中位数为
              6–7x；即便质量最高的云数据安全公司（Rubrik、Veeam），交易倍数也只有 8–9x。Eon 不到 24 个月从 $215 million 升至 $4 billion 的估值跃迁非常罕见，像 2021 年
              SaaS 倍数扩张，随后发生急剧修正。若 IPO 或并购退出发生在倍数正常化环境下，按当前轮价格进入的投资人承担倍数压缩风险。
            calloutType: risk
