      - number: '1.4'
        title: 里程碑、风险背景与覆盖缺口
        blocks:
          - type: paragraph
            body: >-
              Eon 的公开记录覆盖 2013–2026 年的创办、融资、产品发布和规模化里程碑。最早的里程碑是 Ehrlich 和 Stein 于 2013 年创办 CloudEndure；这家公司是 Eon 的前身，融资
              $18M，年收入达到 $20M，并在 2019 年 1 月以约 $200M 卖给 AWS。随后 Ehrlich 和 Kimchi 领导 AWS 灾难恢复和迁移服务约四年，再离开创办 Eon。Eon 于 2024
              年 1 月 2 日正式注册，并在没有公开产品的情况下立即完成 Seed 轮。2024 年，公司一直处于隐身状态，一边申请数十项专利，一边完成 A 轮和 B 轮融资。2024 年 10 月 1
              日，公司走出隐身模式，同时宣布累计融资 $127M、估值 $750M。2024 年 11 月 C 轮让公司成为独角兽。CTO Ron Kimchi 在 Las Vegas 的 AWS re:Invent 2024
              发表演讲，是 Eon 与 AWS 深度集成的早期合作信号。2025 年 12 月 D 轮为全球扩张、研发提速，以及深化 AWS、Azure 和 GCP 集成提供资金。

              截至 runDate，规模指标包括：约 192 名员工（2026 年 3 月估计）、大型企业客户“几十家”，以及 2025 年增长超过 3 倍的收入，但具体 ARR 未披露。SoFi
              企业基础设施总监公开证实，数据准备时间减少超过 90%，加快了 Eon 商业可信度的建立。Eon 美国团队包括来自 Amazon、Google 和 Salesforce
              的前合作伙伴业务高管，公司客户中还包括美国最大银行之一。

              重要尽调缺口包括：具体收入和 ARR
              仍为非公开信息；客户数只是近似值；没有公开股权结构或优先权栈；专利组合细节尚未发布；未发现监管或法律负面程序，但年轻未上市公司缺少公开记录本属预期，并不能构成确认性证据。高估值收入倍数是独立媒体标记的风险，并非已证实的结构性缺陷；后续每次融资或客户披露都应重新检验这一点。
