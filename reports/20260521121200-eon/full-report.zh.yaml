  - id: TV003
    title: 乐观 / 基准 / 悲观情景分析
    columns:
      - 情景
      - ARR 假设（2026E）
      - 关键假设
      - 估值区间（隐含）
      - 概率信号
      - 下行情景触发因素
    rows:
      - - 乐观
        - $350–500M
        - 收入继续三倍增长；AI 切入口实现变现；以 12–15x ARR 完成战略收购
        - $4.2–7.5B
        - 投资者信心高；一线投资团继续加注
        - AWS 政策变化，或竞争对手功能追平
      - - 基准
        - $150–300M
        - 收入增速放缓至 80–120% YoY；按当前倍数扩张；2027 年启动 IPO 准备
        - 按 10x 计为 $1.5–3.6B
        - 符合从 ~$75–100M 基数“增长超过三倍”的轨迹
        - 宏观走弱、企业预算收紧、NRR 低于 115%
      - - 悲观
        - $60–130M
        - 增速降至 50% 以下；CAC 上升；Rubrik/Cohesity 施压；存在降估值融资风险
        - 按 6–8x 计为 $0.4–1.0B
        - 客户数停滞；没有新增具名客户；AWS 合作出现摩擦
        - ARR 增长连续两个季度 <40%，或前三大客户流失
    notes: |
      所有 ARR 数字均为估计值，根据 Reuters“收入增长超过三倍”的信号和 $4B 投后估值锚点推算。概率信号为定性判断；公司未披露财务数据，无法支撑 Monte Carlo 或 DCF。
