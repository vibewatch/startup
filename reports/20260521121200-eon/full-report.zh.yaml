  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >
              2026 年企业云备份和数据韧性市场可分为三个结构层。第一层是成熟企业平台厂商——Rubrik、Cohesity（并入 Veritas 后）、Veeam 和 Commvault——每家 ARR 都超过
              $1B，并拥有 5–15 年沉淀下来的深度企业关系。第二层是云原生 SaaS 专家，包括 Druva（聚焦端点和 Microsoft 365）以及
              Eon（聚焦云基础设施态势管理）。第三层是现状替代方案：超大云厂商 原生备份工具（AWS Backup、Azure Backup、GCP Backup and DR）、基于 IAC
              的手工快照自动化，以及大型云工程团队内部自建项目。

              Eon 切入这个市场时，价值主张根本不同：云备份态势管理（CBPM）平台不仅以无代理方式保护云资源，还把沉睡备份数据转成零 ETL、可查询的数据湖，格式为 Apache Iceberg 和
              Parquet。截至运行日期，没有既有厂商复制这一双重功能。不过，Eon 约 0.7% 的云备份市场份额、“几十家”企业客户，以及未进入 Gartner 数据中心备份与恢复解决方案 Magic
              Quadrant，都说明它仍是一个创新者。它必须先证明自己有替换可信度，否则既有厂商会用功能补齐或收购来缩小差距。Cohesity–Veritas 合并，以及 Veeam 在 VeeamON 2026 发布
              DataAI Command Platform，说明整合和 AI 功能竞争已经在压缩 Eon 的差异化窗口。

              潜在新进入者包括大型网络安全平台（CrowdStrike、Palo Alto Networks），它们正从检测侧自然延展到数据韧性；也包括可能加深原生备份完整性、降低第三方依赖的超大云厂商。这些玩家都不构成对
              Eon CBPM 品类的即时直接威胁，但会共同增加 Eon 目标企业账户中的竞争噪音。
