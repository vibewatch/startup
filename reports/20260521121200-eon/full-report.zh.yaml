companyProfile:
  summary: >
    Eon（注册主体为 EON IO, INC.）是一家企业云基础设施公司，总部横跨纽约和特拉维夫。三名 AWS 老兵在 2024 年 1 月创办了公司；他们此前打造 CloudEndure，并以约 $200M 卖给
    Amazon。Eon 的云备份态势管理（CBPM）平台为 AWS、Azure 和 GCP 提供无代理、多云备份保护，同时把备份数据转成 Apache Iceberg / Parquet 等开放格式，生成零 ETL 数据湖，供分析和
    AI 引擎直接查询。不到两年里，Eon 完成五轮融资，累计融到 $497M，并在 2025 年 12 月达到 $4B 估值。据报道，2025 年营收增长超过 3 倍，但这家未上市公司仍未披露具体数字。
