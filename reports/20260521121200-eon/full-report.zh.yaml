      - number: '3.4'
        title: 现状替代方案与超大云厂商选项
        blocks:
          - type: paragraph
            body: >
              企业最常见的现状替代方案，是超大云厂商原生快照加手工运营治理。AWS Backup 集中管理 EC2、RDS、EBS、S3、DynamoDB、EFS 以及其他 AWS
              服务的备份，按使用量计费，并支持自动调度。Azure Backup 覆盖 Azure VM、Azure 上的 SQL Server、SAP HANA 和 Azure Files，同样按消耗计价。GCP
              Backup and DR 将原生保护扩展到 Google Compute Engine 工作负载。这些工具内嵌、便宜、快速，但共享 Eon 瞄准的三个结构性弱点。

              第一，超大云厂商原生快照不跨云：AWS 快照不能保护或恢复 Azure
              工作负载，迫使多云企业按供应商分别管理孤岛式备份运营。第二，原生工具通常是崩溃一致，而不是应用一致；数据库级完整性还需要额外静默逻辑。第三，也是对 Eon 威胁模型最关键的一点：原生快照与生产工作负载共享同一
              IAM 权限边界，一组被攻破的云凭证就能删除或加密备份数据。Eon 的不可变隔离保险库和勒索软件检测直接补这个缺口。第四，原生工具生成的是孤岛式、不可搜索、没有分析能力的快照存储；Eon
              则把同一批数据转成可实时查询的数据湖。

              在拥有专职平台工程团队的大型云工程组织中，内部自建是有意义的替代方案。这些团队用 AWS CloudFormation、Terraform
              或自定义脚本自动化快照调度、留存执行和跨区域复制。内部自建避开供应商成本和锁定，但缺少跨账户异常检测、合规报告、漂移监控和数据激活能力。对拥有 500+ 云资源的组织，工程维护负担会超线性增长；这是 Eon
              对抗内部自建时最核心的赢单论点。

              超大云厂商不是静止的替代品。AWS 持续扩展 AWS Backup 能力；Azure Backup 近年加入带强化软删除的保险库式备份；GCP Backup and DR 为 SAP HANA
              和数据库加入应用一致备份。随着超大云厂商增加功能，原生工具与 Eon 在保护完整性上的差距会收窄；不过，原生工具基本还未处理数据激活缺口。这是中期商品化风险，Eon 必须通过加深分析和 AI 差异化层来提前应对。
            claimRefs:
              - CP033
              - CP034
