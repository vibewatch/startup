      - number: '5.3'
        title: 集成、部署与产品路线图
        blocks:
          - type: paragraph
            body: >-
              Eon 公开列出的集成目录覆盖 6 大类、33 个具名工具。分析集成包括 BigQuery、Snowflake、Databricks、Apache Spark、Amazon EMR、Amazon
              Redshift、Lake Formation、AWS Glue、Microsoft Fabric 和 Presto/Trino——10 个平台覆盖主要云厂商和独立分析引擎。AI 和 LLM 集成包括
              Vertex AI、Amazon Bedrock 和 OpenAI。安全与 SIEM 集成包括 AWS Security Hub、Splunk、AWS CloudTrail、Microsoft Sentinel
              和事件流 API。DevOps 集成包括 Terraform provider、Go SDK、CLI、Amazon SNS、Amazon SQS 和 Azure Service Bus。ITSM 与通知平台包括
              Slack、Microsoft Teams、ServiceNow、PagerDuty、Opsgenie 和 Jira。威胁检测集成包括 Amazon GuardDuty、Microsoft Azure
              Defender 和 SentinelOne。部署完全是 SaaS：客户授予只读 IAM 角色，并可选配置 SAML SSO。Terraform
              provider（github.com/eon-io/terraform-provider-eon）支持以 IaC 管理源账户、恢复账户、备份策略、RBAC 角色，以及 Okta 和 SAML provider
              的 IDP group 映射；截至 May 2026，它有 4 个 GitHub 星标和 1 个 fork。Go SDK（github.com/eon-io/eon-sdk-go）由 OpenAPI
              规范自动生成。公司没有发布跨多个季度的公开产品路线图；可见路线图只能从公告历史和 Eon 新闻页推断。Eon AI Agent 与 MCP/A2A connectors 都在 May 2026
              推出，是最近的平台增量。Eon 定价页没有公开单价或分层定价，说明销售仍以企业销售主导。
