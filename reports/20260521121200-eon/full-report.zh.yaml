      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              云备份和网络韧性支出的首要增长驱动，是勒索软件升级。攻击如今每年让企业损失 $57B，全球每两秒发生一次；若计入恢复、法律和声誉成本，单次事件平均成本为 $5.13M。关键在于，96%
              的勒索软件攻击专门瞄准备份库，且 76% 成功攻破；备份层因此不再是被动归档，而是网络韧性的前线。备份被攻破的组织，恢复成本是备份完好组织的 8×。这一脆弱性画像直接验证了 Eon
              的不可变保险库、细粒度恢复和勒索软件检测价值主张。


              监管强制要求是第二个结构性驱动。NIS2（欧盟）和 DORA（金融业）都要求企业制定并测试备份策略，保存可供审计的证据，采用加密且符合司法辖区要求的存储，并在 72
              小时窗口内报告事件；这实际上要求自动化备份验证。GDPR、HIPAA 和 CCPA 又叠加了行业特定的留存和可携带要求。这些强制要求为备份现代化创造了不可自由裁量的预算线；能证明合规覆盖的供应商，销售周期会缩短。


              Gartner 在 2025 年 6 月把其 Magic Quadrant 更名为“备份与数据保护平台”，释放出市场结构性扩张信号：备份不再只是恢复工具，而是由 AI
              增强、具备网络韧性的数据资产体系。Gartner 2025 MQ Predictions 预计，到 2029 年，30% 的企业会把备份副本整合为分析和推理的数据源，而 2025 年这一比例不到 5%；这正是
              Eon 的数据湖论点走向主流。


              采用约束也很实质。第一，Fortune BI 引用的 2024 年 Cybersecurity Ventures 调查显示，43%
              的公司仍因数据泄露担忧，不愿把备份完全迁到云上。第二，切换成本高：把现有备份数据从 AWS S3 或 Azure Blob 迁出，在 PB 规模下会产生可观数据出口费，IT
              团队还必须重新学习新的备份策略和恢复流程。第三，遗留系统集成复杂度影响 28% 的企业（GlobalGrowthInsights）。第四，只有约 25% 的组织会定期测试或记录 DR
              计划，说明即便已经部署技术，备份态势在运营层面仍投入不足。第五，人才缺口——熟练的多云备份工程师供给不足——同时拖慢部署和持续管理。
