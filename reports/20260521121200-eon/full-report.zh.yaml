      - - 无代理备份引擎
        - 通过只读 IAM 对云资产做快照、编目录并分类
        - 客户为每个云账户授予的只读 IAM 角色
        - IAM 配置错误或权限撤销会让数据采集中断，且可能没有告警
      - - Apache Iceberg / Parquet 存储层
        - 不可变备份存储与零 ETL 分析查询界面
