company:
  name: Eon
chapter:
  number: 2
  title: Market Analysis
  summary: Eon targets the intersection of cloud backup ($7.13–9.41B in 2026, ~25% CAGR),
    enterprise backup and recovery software ($13.06–18.8B in 2026), ransomware protection
    ($30.04B in 2026, 16% CAGR), and cloud data-lake analytics ($14.79B in 2026),
    making Cloud Backup Posture Management a cross-market thesis rather than a single-segment
    play. Growth is driven by ransomware escalation, NIS2/DORA regulatory mandates,
    AI-data convergence, and cloud migration at scale, while adoption is slowed by
    switching costs, skills gaps, and the lack of independent analyst recognition for
    the CBPM sub-category Eon coined.
sections:
- id: market-boundary
  title: Market Boundary and Category Definition
  body: "Eon's target market straddles four overlapping spend categories that analysts\
    \ measure separately, creating definitional ambiguity but also compounding upside.\
    \ The narrowest view is the pure-play cloud backup market—cloud-delivered solutions\
    \ for enterprise data backup, snapshotting, and point-in-time restore. This excludes\
    \ on-premises backup appliances, tape-based archiving, and standalone endpoint\
    \ backup tools for consumers or small businesses. A broader view adds enterprise\
    \ backup and recovery software (on-premises and cloud-hybrid), disaster recovery\
    \ as a service (DRaaS), and the ransomware protection segment. Eon's additional\
    \ data-lake functionality positions it at the edge of the data lake analytics\
    \ market ($14.79B in 2026) where backup data becomes a live analytical asset—a\
    \ positioning with no direct precedent among backup vendors.\n\nEon coined the\
    \ term Cloud Backup Posture Management (CBPM) to describe a continuous four-phase\
    \ cycle: discover and classify cloud resources, define and apply backup policies,\
    \ monitor for drift, and track costs. The company's PR materials define CBPM as\
    \ the first backup autopilot for cloud infrastructure, and the official product\
    \ guide articulates CBPM as fixing the 'backup responsibility gaps' that arise\
    \ as cloud environments grow. No independent analyst firm had formally categorised\
    \ CBPM as a named market segment as of the run date, which is both a risk (Eon\
    \ educates the category) and a first-mover opportunity (no incumbent owns the\
    \ label).\n\nStatus-quo substitutes include: (1) native cloud provider snapshots\
    \ (AWS EBS snapshots, Azure Backup, GCP Persistent Disk snapshots)—cheap but\
    \ non-searchable and operationally fragmented; (2) legacy enterprise backup platforms\
    \ (Veeam, Cohesity, Commvault) extended to cloud; (3) hyperscaler-native DRaaS;\
    \ and (4) manual scripts and IAC tooling. Each substitute addresses a subset of\
    \ what Eon claims to unify."
  claimRefs:
