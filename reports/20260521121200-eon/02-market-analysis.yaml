  - Diligence Ask
  rows:
  - - Ransomware escalation (96% attack backup repositories)
    - Driver
    - Immediate
    - High
    - Validates immutable vault and ransomware-detection positioning
    - Validate that Eon's isolation architecture passes insurance-compliance audits
  - - NIS2 and DORA regulatory mandates
    - Driver
    - Short term (1–2 yr)
    - High (EMEA)
    - Creates non-discretionary backup modernisation budget in EU
    - Confirm Eon's compliance reporting is accepted by NIS2 auditors
  - - GDPR, HIPAA, CCPA data retention requirements
    - Driver
    - Ongoing
    - Medium
    - Lengthens retention and auditability requirements — suits Eon's data lake
    - Verify Eon meets cross-regulation retention policy enforcement
  - - "Gartner market shift: backup → data protection platforms"
    - Driver
    - Medium term (2–4 yr)
    - Medium
    - Expands Eon's TAM framing; validates multi-function platform pitch
    - Track whether Gartner includes CBPM as a named category by 2027
  - - AI-data convergence (backup data as analytics asset)
    - Driver
    - Medium term (2–4 yr)
    - High (long run)
    - Eon's zero-ETL data lake module directly addresses this; by 2029, 30% of enterprises plan to integrate backup for analytics
    - Validate that Databricks / Snowflake / BigQuery integrations are production-ready
  - - Switching costs (egress fees, retraining, workflow redesign)
    - Constraint
    - Immediate
    - High
    - Increases sales cycle length and pilot-to-production friction for Eon
    - Quantify median migration time and upfront cost for a 1,000-resource enterprise
  - - 43% enterprise hesitancy over cloud data breach concerns
    - Constraint
    - Ongoing
    - Medium
    - Slows new-logo acquisition; Eon's agentless model (read-only IAM) may partially mitigate
    - Obtain third-party security attestation or SOC 2 Type II for all cloud regions
  - - Only 25% of orgs regularly test DR plans
    - Constraint
    - Ongoing
    - Medium
    - Creates inertia vs. incumbent tools even when backup posture is poor
    - Build automated DR test scheduling into product to reduce customer effort
  - - Skill gap in multi-cloud backup engineering
    - Constraint
    - Ongoing
    - Medium
    - Supports Eon's managed/agentless approach but limits enterprise self-service
    - Assess whether Eon's onboarding is genuinely tool-free or requires skilled CSM
  - - Legacy system integration complexity (28% of enterprises affected)
    - Constraint
    - Short term (1–2 yr)
    - Medium
    - Slows adoption in hybrid environments; Eon must support legacy on-prem data sources
    - Confirm Eon's hybrid backup roadmap for VMware vSphere and bare-metal workloads
