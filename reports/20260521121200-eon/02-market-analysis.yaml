- id: buyer-segmentation
  title: Buyer and Segment Landscape
  body: "Enterprise cloud backup purchases are owned by IT leadership (CIO, CISO)\
    \ with budget authority sitting at the CFO level in regulated industries and at\
    \ the CTO or engineering VP in technology companies. The buying committee is expanding:\
    \ IDC research for 2026 documents that procurement, finance, and revenue-operations\
    \ teams now co-own decisions alongside technical users, requiring vendors to present\
    \ quantified ROI scenarios rather than feature lists. Eon's positioning as a cost-saving\
    \ (30–50% backup storage reduction) and compliance-automation platform speaks\
    \ directly to this expanded committee.\n\nBy vertical, BFSI (banking, financial\
    \ services, insurance) is the largest cloud backup demand segment at 26.06% of\
    \ 2025 market share, driven by regulatory demands and the dual NIS2/DORA compliance\
    \ burden on European financial entities. Healthcare is the fastest-growing vertical\
    \ at a 26.71% CAGR, driven by HIPAA and expanding telehealth data volumes. Technology\
    \ companies, the segment best represented in Eon's current customer base (SoFi\
    \ is the sole named reference customer from chapter 1), have high cloud-spend intensity\
    \ and are familiar buyers of cloud-native tooling. Government and public sector\
    \ buyers are growing but add data-sovereignty requirements that constrain multi-cloud\
    \ architectures.\n\nBy organisation size, large enterprises (1,000+ employees)\
    \ represent 57.22% of cloud backup revenue. MSPs (managed service providers)\
    \ are the dominant channel at 41.04% of market share, which suggests Eon's direct-enterprise\
    \ GTM will face an MSP-mediated competitive dynamic at scale. SMBs are the fastest-growing\
    \ segment by count but not the highest-value individual deals, aligning with Eon's\
    \ stated focus on large enterprises. The adoption trigger across segments is consistently\
    \ a near-miss or actual ransomware event, a compliance deadline, or a cloud migration\
    \ that exposes backup posture gaps."
