callouts:
- calloutType: insight
  title: CBPM is a category thesis, not yet a measured market
  body: Eon coined Cloud Backup Posture Management and no independent analyst has
    formally categorised it as of May 2026. This creates a first-mover category advantage
    but also means Eon must educate the market; TAM is inferred from adjacent measured
    segments rather than directly reported. Investors should monitor whether Gartner
    or IDC adopt the CBPM label in a 2027 Magic Quadrant update.
  claimRefs:
  - CM001
  - CM002
- calloutType: risk
  title: Contradictory TAM estimates reduce sizing confidence
  body: Cloud backup TAM estimates for 2026 range from $7.13B (Mordor) to $9.41B
    (BRC)—a 32% gap. Enterprise backup system estimates range from $13.06B to $18.8B—a
    44% gap. These divergences are not noise; they reflect genuine scope disagreement
    among researchers and prevent reliable bottom-up SOM triangulation for Eon's specific
    product.
  claimRefs:
  - CM039
  - CM040
- calloutType: strength
  title: Ransomware economics make backup modernisation non-discretionary
  body: With 96% of ransomware attacks targeting backup repositories and 76% succeeding,
    enterprises that do not modernise backup architectures face 8× higher recovery
    costs. NIS2 and DORA compliance deadlines create non-discretionary spend. Eon's
    immutable vault and granular recovery capabilities directly address the highest-severity
    pain point driving 2026 enterprise spending.
  claimRefs:
  - CM029
  - CM030
  - CM023
- calloutType: assumption
  title: SAM inferred from Eon's own cloud-bill fraction estimate
  body: The SAM figure of $10–30% of cloud infrastructure spend is sourced from Eon's
    own launch press release, not an independent analyst study. It implies an SAM
    growing proportionally with cloud infrastructure spend, which would reach $84B–$251B
    by 2034 at $838B infrastructure. This assumption should be stress-tested with
    independent cloud cost audit data.
  claimRefs:
  - CM015
