- id: growth-drivers-constraints
  title: Growth Drivers and Adoption Constraints
  body: "The primary growth driver for cloud backup and cyber resilience spending is\
    \ ransomware escalation. Attacks now cost enterprises $57B annually and occur\
    \ every two seconds globally; the average per-incident cost is $5.13M when including\
    \ recovery, legal, and reputational costs. Critically, 96% of ransomware attacks\
    \ target backup repositories specifically, and 76% successfully compromise them—making\
    \ the backup layer the frontline of cyber resilience rather than a passive archive.\
    \ Organisations with compromised backups face 8× higher recovery costs than those\
    \ with intact ones. This vulnerability profile directly validates Eon's immutable-vault,\
    \ granular-recovery, and ransomware-detection value propositions.\n\nRegulatory\
    \ mandates are the second structural driver. NIS2 (EU) and DORA (financial sector)\
    \ both require documented, tested backup strategies with evidence preserved for\
    \ audit, encrypted and jurisdictionally compliant storage, and 72-hour incident-reporting\
    \ windows that effectively mandate automated backup verification. GDPR, HIPAA,\
    \ and CCPA add sector-specific retention and portability requirements. These mandates\
    \ create non-discretionary budget lines for backup modernisation, reducing the\
    \ sales cycle length for vendors who can demonstrate compliance coverage.\n\n\
    Gartner's June 2025 renaming of its Magic Quadrant to 'Backup and Data Protection\
    \ Platforms' signals the market's structural expansion: backup is no longer a\
    \ pure recovery tool but an AI-augmented, cyber-resilient data estate. Gartner's\
    \ 2025 MQ Predictions project that by 2029, 30% of enterprises will integrate\
    \ backup copies as a data source for analytics and inference—up from fewer than\
    \ 5% in 2025—which is precisely Eon's data-lake thesis extended to the mainstream.\n\
    \nAdoption constraints are material. First, 43% of firms remain hesitant to shift\
    \ backups fully to cloud due to data breach concerns, per a 2024 Cybersecurity\
    \ Ventures poll cited by Fortune BI. Second, switching costs are high: data egress\
    \ fees for moving existing backup data out of AWS S3 or Azure Blob are significant\
    \ at petabyte scale, and IT teams must be retrained on new backup policies and\
    \ recovery workflows. Third, legacy system integration complexity affects 28% of\
    \ enterprises (GlobalGrowthInsights). Fourth, only about 25% of organisations\
    \ test or document their DR plans regularly, indicating that backup posture is\
    \ underinvested operationally even where technology is deployed. Fifth, the talent\
    \ gap—skilled multi-cloud backup engineers are in short supply—creates friction\
    \ for both deployment and ongoing management."
