- id: sizing-gaps-diligence
  title: Diligence Gaps and Sizing Uncertainty
  body: "Three structural diligence gaps constrain the sizing analysis. First, CBPM\
    \ as a named analyst category does not yet exist. No Gartner or IDC report segments\
    \ the market by 'cloud backup posture management' as of May 2026; Eon is asserting\
    \ a category boundary that has not been validated by independent analyst research.\
    \ This means the TAM for CBPM specifically is inferred from component markets\
    \ rather than measured directly. The lack of analyst categorisation also means\
    \ that Eon's competitors—native cloud snapshots, Veeam, Rubrik, Cohesity—are\
    \ measured in overlapping, non-identical market buckets that cannot be cleanly\
    \ summed.\n\nSecond, the cloud backup market size estimates from the four analyst\
    \ sources differ by up to 32% for 2026 ($7.13B Mordor vs $9.41B BRC vs $8.73B\
    \ Fortune BI vs the implied $6.99–8.73B range). The enterprise backup system TAM\
    \ estimates diverge by 44% ($13.06B Fortune BI software-only vs $18.8B GlobalGrowthInsights\
    \ broader system). These contradictions do not resolve neatly and should be read\
    \ as a reminder that the market boundary itself is contested.\n\nThird, Eon's\
    \ SAM and SOM are not independently estimable without knowing: (a) how many enterprises\
    \ have 500+ AWS/Azure/GCP resources and lack automated CBPM; (b) what fraction\
    \ of cloud backup spend is in the specific feature set Eon sells rather than bulk\
    \ snapshot storage; and (c) whether the data-lake analytics capability commands\
    \ a distinct budget line or is bundled into backup contracts. Until Eon or an\
    \ analyst publishes a bottom-up TAM for the CBPM sub-segment, any SOM projection\
    \ carries high uncertainty."
  claimRefs:
  - CM038
  - CM039
  - CM040
