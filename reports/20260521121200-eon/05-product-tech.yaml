  - id: architecture
    title: Platform Architecture and Operating Model
    body: >-
      Eon's architecture comprises six logical layers: a SaaS control plane (console, REST API,
      Terraform provider, Go SDK, RBAC and SAML SSO), cloud provider connectors (AWS IAM and S3
      APIs, Azure Resource Manager, GCP service APIs), a Cloud Backup Posture Management engine
      (agentless discovery, data classification, automated policy enforcement, real-time drift
      detection, and compliance reporting), a protection and resilience layer (forever-incremental
      snapshots, cross-dataset deduplication, ransomware anomaly detection, immutable WORM vaults,
      and granular recovery), an Apache Iceberg data lake tier enabling zero-ETL analytics, and an
      AI and agent layer (Eon AI Agent, MCP server, A2A connectors powered by Google Gemini, Vertex
      AI, and Anthropic Claude). Each customer runs in a dedicated single-tenant cloud account and
      VPC, providing logical isolation with no shared compute pool. WORM/Object Lock primitives from
      the underlying CSP object store (S3 Object Lock, Azure Blob immutability, GCS object holds)
      enforce immutability at the storage layer, making backups tamper-evident even if the Eon control
      plane were compromised. Ransomware detection combines four signals: entropy scanning, file
      extension pattern analysis, ransom-note identification, and behavioral metadata anomalies —
      plus logical database content analysis for structured data sources, which Eon positions as a
      differentiator relative to signature-based scanning tools. The AI layer is confirmed by
      cloud.google.com/customers/eon to use Gemini Flash for vector embeddings, BigQuery external
      query for analytics access, and Google Cloud Storage as the backup data store.
    claimRefs:
      - CE005
      - CE006
