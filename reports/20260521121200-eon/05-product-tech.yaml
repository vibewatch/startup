  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: SOC 2 and third-party compliance audit reports
      missingEvidence: >-
        Public SOC 2 Type II audit report, PCI Attestation of Compliance, ISO 27001 certificate,
        and HIPAA BAA template for Eon's SaaS platform.
      whyItMatters: >-
        Enterprise procurement in regulated industries (financial services, healthcare, government)
        requires independent audit evidence before committing backup infrastructure to a vendor.
        Absence of public audit reports creates friction in sales cycles and increases diligence
        burden on prospective buyers, which may extend sales cycles and limit addressable market.
      diligencePath: >-
        Request SOC 2 Type II report, PCI AOC, ISO 27001 certificate, and DPA addendum directly
        from Eon under NDA. Verify the certification body and audit scope against the production
        environment. Track the next audit cycle date to assess recency.
      relatedQuestionRefs:
        - QE013
        - QE018
      relatedTableRefs:
        - TE004

    - type: missing-source
      severity: material
      topic: Public SLA and operational status transparency
      missingEvidence: >-
        A public status page, uptime SLA, incident history, and RTO/RPO commitment document
        for Eon's SaaS platform.
      whyItMatters: >-
        Mission-critical backup infrastructure vendors are expected to publish uptime commitments
        and historical incident data. Absence of a public status page is unusual at Eon's price
        point and valuation, and will be flagged by enterprise SRE teams during procurement.
        It also limits investor ability to assess operational reliability independently.
      diligencePath: >-
        Request a copy of Eon's internal SLA documentation, the last 12 months of incident reports,
        and P1/P0 incident count and resolution times. Verify whether a private status page or
        dashboard is provided to enterprise customers.
      relatedQuestionRefs:
        - QE014
        - QE016
        - QE024
      relatedTableRefs:
        - TE005

    - type: access-blocked
      severity: minor
      topic: Developer documentation at docs.eon.io
      missingEvidence: >-
        Full API reference documentation, error-handling guides, SDK usage examples, and
        integration tutorials available at docs.eon.io, which requires customer login to access.
      whyItMatters: >-
        Public developer documentation is a standard signal of platform maturity and a key
        driver of developer adoption. Login-gating docs limits viral developer discovery and
        makes it impossible for prospects or analysts to independently assess API quality,
        versioning discipline, or SDK completeness before purchasing.
      diligencePath: >-
        Request a temporary access credential to docs.eon.io for diligence review. Evaluate
        API reference completeness, error-code documentation, and changelog discipline.
        Compare SDK coverage against the Terraform provider's documented feature list.
      relatedQuestionRefs:
        - QE005

