company:
  name: Eon

chapter:
  number: 5
  letter: E
  title: Product & Technology
  summary: >-
    Eon delivers cloud-native data protection and analytics as two integrated SaaS modules (Eon Data
    Protection and Eon Data Lake Infrastructure), operating agentlessly via read-only IAM across AWS,
    Azure, and Google Cloud. Its CBPM engine executes an autonomous five-step posture loop while
    Apache Iceberg storage enables zero-ETL analytics directly from backup data. The Eon AI Agent,
    launched May 2026, adds natural-language querying of backup catalogs powered by Gemini and Claude.
    Compliance claims span GDPR, HIPAA, PCI-DSS, and SOC 2 but are entirely self-asserted; no public
    audit report, SLA documentation, or login-free developer docs have been located through external research.

sections:
  - id: product-definition
    title: Product Definition and Customer Workflow
    body: >-
      Eon serves enterprises running workloads on AWS, Azure, or Google Cloud who need backup,
      ransomware protection, and compliance posture management without the overhead of agents,
      appliances, or manual policy governance. Its two core commercial modules — Eon Data Protection
      and Eon Data Lake Infrastructure — are delivered as a unified SaaS offering requiring no
      changes to the customer's existing cloud environment. Onboarding requires only a read-only IAM
      role grant; Eon's engine discovers every cloud asset (EC2 instances, RDS databases, S3 buckets,
      Azure Virtual Machines, GCS buckets, and more), applies backup and classification policies, and
      monitors for coverage drift continuously without any agent deployment. All captured backup data
      is written to Apache Iceberg tables, converting the backup store into a queryable data lake:
      analytics engines such as BigQuery, Snowflake, and Databricks can query live backup data
      directly without triggering a restore operation. As of May 2026, the Eon AI Agent extends this
      further by enabling natural-language queries — translated to SQL via Google Gemini — over the
      backup catalog, reducing data preparation time from months to minutes according to Eon's own
      published communications. Eon targets SRE and DevOps engineers, security and compliance teams,
      and data engineering teams as its primary buyer personas across cloud-dependent enterprises.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE007
      - CE025
      - CE026
      - CE041
