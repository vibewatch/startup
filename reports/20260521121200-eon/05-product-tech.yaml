  - id: trust-security-compliance
    title: Trust, Security, and Compliance
    body: >-
      Eon's compliance positioning claims alignment with GDPR Article 32 data protection requirements,
      HIPAA administrative and technical safeguard provisions, PCI-DSS backup integrity controls, ISO
      27001 information security management system requirements, SOC 2 Trust Services Criteria, and
      all five NIST CSF pillars (Identify, Protect, Detect, Respond, Recover). Technical controls
      confirmed through public sources include WORM/Object Lock-enforced immutability at the cloud
      storage layer, logical air-gapping via immutable vaults, RBAC with role hierarchies manageable
      via Terraform, SAML and SSO federation (Okta confirmed in the Terraform provider), and single-
      tenant account and VPC isolation per customer. However, no public SOC 2 Type II audit report,
      PCI Attestation of Compliance, ISO 27001 certificate, or HIPAA Business Associate Agreement
      template has been located through external research. Every compliance claim in this chapter is
      sourced exclusively from Eon's own blog posts and marketing pages, constituting vendor self-
      assertion rather than independent third-party assurance. This is a material evidence gap that
      will surface as a standard ask in enterprise procurement due diligence at Eon's Series D price
      point, particularly from buyers in regulated verticals such as financial services and healthcare.
    claimRefs:
      - CE019
      - CE030
      - CE031
      - CE039
      - CE044
    tableRefs:
      - TE004
    figureRefs: []

  - id: product-gaps
    title: Product and Evidence Gaps
    body: >-
      Three material evidence gaps limit diligence confidence. First, all compliance credentials are
      self-asserted with no external audit reports discoverable through public research; this creates
      procurement friction in regulated verticals and is the most frequently cited risk factor for
      enterprise backup vendors at late-stage growth rounds. Second, no public status page, uptime
      SLA, or incident history exists for Eon's SaaS platform — unusual for a mission-critical backup
      infrastructure vendor and a flag for enterprise SRE teams evaluating vendor operational maturity.
      Third, the developer documentation at docs.eon.io is login-gated, preventing external evaluation
      of API quality, error handling, or SDK completeness. Developer signal from GitHub is early-stage:
      the Terraform provider (eon-io/terraform-provider-eon) has four GitHub stars and one fork, and
      the Go SDK (eon-io/eon-sdk-go) has two stars — both consistent with a product in initial developer
      adoption rather than a mature open ecosystem. The Eon AI Agent launched in May 2026 carries
      inherent LLM-system risks including hallucination, prompt injection exposure, and inconsistent
      SQL generation accuracy over backup schemas; no published accuracy benchmarks or error-rate data
      exist. Investors should monitor closure of the audit-report gap (SOC 2 Type II), publication of
      a public SLA document, and developer ecosystem growth signals as leading indicators of enterprise
      readiness before next-round diligence.
    claimRefs:
      - CE017
      - CE031
      - CE037
      - CE040
      - CE044
