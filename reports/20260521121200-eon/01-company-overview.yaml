- calloutType: risk
  title: Very high valuation-to-revenue multiple with limited financial transparency
  body: Globes estimated Eon's 2025 annual revenue at "millions up to something over $10 million" against a $4B valuation—implying
    a revenue multiple above 100x. Calcalist separately noted at Series C that it was unclear whether Eon had begun generating
    substantial revenue. While the company reported revenue more than tripling in 2025, absolute figures are not disclosed.
    This opacity, combined with a relatively small customer count, makes the current valuation difficult to underwrite on
    financial fundamentals alone.
  claimRefs:
  - CO018
  - CO019
  - CO032
  - CO033
- calloutType: risk
  title: Intense competition from established cloud backup and data protection incumbents
  body: Eon competes against Rubrik (publicly listed), Druva, Veeam, Cohesity, and CommVault—all of which have substantially
    larger customer bases, deeper integrations, and longer enterprise relationships. Tracxn identifies 891 active competitors
    in the cloud backup space, including 64 funded startups. Eon must displace or complement entrenched vendors in accounts
    where switching costs are high and procurement cycles are long.
  claimRefs:
  - CO031
- calloutType: insight
  title: AI data activation is the strategic growth wedge beyond traditional backup
  body: Eon's differentiation is not purely backup protection but the conversion of dormant backups into AI-ready data lakes
    via zero-ETL Iceberg/Parquet formats. This positions Eon to capture budget from both data engineering and IT operations,
    potentially broadening its total addressable market beyond the traditional backup segment.
  claimRefs:
  - CO022
  - CO034
  - CO036
