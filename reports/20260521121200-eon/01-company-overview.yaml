- id: section-milestones-risks
  title: Milestones, risk context, and coverage gaps
  body: 'Eon''s public record covers founding, financing, product launch, and scale milestones across 2013–2026. The earliest
    milestone is the founding of CloudEndure by Ehrlich and Stein in 2013—a precursor company that raised $18M, achieved $20M
    in annual revenue, and was sold to AWS for approximately $200M in January 2019. Ehrlich and Kimchi then led AWS Disaster
    Recovery and Migration services for roughly four years before departing to found Eon. Eon was formally incorporated on
    January 2, 2024, and completed its Seed round immediately without a public product. The company operated in stealth through
    2024, filing dozens of patents while securing Series A and B financing. It emerged from stealth on October 1, 2024, simultaneously
    announcing $127M in cumulative funding and a $750M valuation. The Series C in November 2024 conferred unicorn status.
    CTO Ron Kimchi presented at AWS re:Invent 2024 in Las Vegas, an early partnership signal toward deeper AWS integration.
    The Series D in December 2025 funded global expansion, R&D acceleration, and deepened integrations with AWS, Azure, and
    GCP.

    Scale metrics as of the runDate: approximately 192 employees (March 2026 estimate), "a few tens" of large enterprise customers,
    and revenue that more than tripled in 2025, though exact ARR is not disclosed. SoFi''s director of corporate infrastructure
    publicly testified to 90%-plus reduction in data preparation time, accelerating Eon''s commercial credibility. Eon''s
    US team includes former Amazon, Google, and Salesforce partnership executives, and the company counts one of the largest
    US banks among its customers.

    Material diligence gaps: exact revenue and ARR are private; customer count is approximate; no cap table or preference-stack
    is public; patent portfolio detail has not been published; no regulatory or legal adverse proceedings have been identified,
    but absence of public records for a young private company is expected rather than confirmatory. The high valuation-to-revenue
    multiple is a flagged risk by independent press, not a confirmed structural flaw, but should be revisited with each subsequent
    financing or customer disclosure event.'
