  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue
    missingEvidence: Exact annual recurring revenue (ARR), gross margin percentage, and net revenue retention rate for Eon
      as of the runDate. CEO has only disclosed directional growth (>3x YoY) without absolute figures.
    whyItMatters: Without exact revenue, the $4B valuation cannot be underwritten on financial fundamentals; the implied 100x+
      multiple may or may not be appropriate depending on actual ARR level and growth quality.
    diligencePath: Request audited or management-reviewed financials directly from Eon in a diligence data room; cross-reference
      against SaaS benchmarks for comparable cloud infrastructure companies at Series D stage.
    relatedQuestionRefs:
    - QO005
    - QO011
    - QO020
  - type: private-evidence-only
    severity: material
    topic: customers
    missingEvidence: Exact customer count, customer name list, revenue concentration by customer, and net revenue retention
      rate. CEO stated "a few tens" without specificity; only SoFi is named publicly.
    whyItMatters: Revenue concentration risk cannot be assessed without knowing whether a small number of customers account
      for the majority of revenue, which is a key underwriting variable for enterprise SaaS companies.
    diligencePath: Request customer list, revenue breakdown, and NRR data from Eon in a formal diligence process; contact
      referenced customers directly for independent verification.
    relatedQuestionRefs:
    - QO013
  - type: missing-source
    severity: minor
    topic: governance
    missingEvidence: Board composition, investor governance rights, preference stack, and control provisions for a private
      company not subject to SEC disclosure obligations. No formal cap table has been published.
    whyItMatters: Governance structure, preference rights, and anti-dilution provisions affect economic and control terms
      for any future investment or acquisition, making this a standard but currently unresolved diligence item.
    diligencePath: Obtain investor rights agreement, cap table, and charter from Eon's legal counsel in a formal data room.
      Confirm board seat vs. observer right for each major investor from Seed through Series D.
    relatedQuestionRefs:
    - QO022
    relatedTableRefs:
    - TO002
    - TO003
  - type: missing-source
    severity: minor
    topic: intellectual property
    missingEvidence: Specific patent numbers, filing dates, and technical scope for the "dozens" of patents Eon has claimed
      to have filed. No patent publication list has been made available publicly.
    whyItMatters: Patent portfolio depth and freedom-to-operate are relevant to competitive moat assessment and potential
      IP litigation risk from incumbents such as Rubrik, Veeam, or NetApp.
    diligencePath: Search USPTO and EPO patent databases for "EON IO" or named inventors (Ehrlich, Kimchi, Stein) and cross-reference
      with the company's own claims about the scope and volume of filings.
    relatedQuestionRefs:
    - QO017
    - QO018
  - type: missing-source
    severity: minor
    topic: adverse events
    missingEvidence: No independent evidence of customer churn, contract cancellations, product outages, regulatory actions,
      or litigation involving Eon has been found, but absence of public records for a young private company is expected and
      does not constitute confirmation of a clean record.
    whyItMatters: A company that has grown to $4B valuation in 24 months without disclosed adverse events could have unexposed
      operational or commercial risks that would only emerge in a formal due diligence process.
    diligencePath: Conduct standard adverse-media search, legal entity search in Israel and US court records, and direct customer
      reference calls with a minimum of 5 named enterprise references beyond SoFi.
    relatedQuestionRefs:
    - QO008
    - QO013
    relatedTableRefs:
    - TO004
