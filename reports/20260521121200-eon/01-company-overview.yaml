- id: section-capital-investors
  title: Capital history, investors, and valuation
  body: 'Eon raised five rounds in under two years, a pace that multiple sources describe as among the fastest in cloud infrastructure
    history. The Seed round of $20M was led by Sequoia Capital (Shaun Maguire as partner) in January 2024—before the company
    formally launched—with co-investors Vine Ventures, Meron Capital, and Eight Roads Ventures. The Series A of $30M followed
    in September 2024, led by Lightspeed Venture Partners with participation from Sheva and Omri Casspi (via Swish Ventures),
    valuing Eon at approximately $215M. The Series B of $77M closed in October 2024, led by Greenoaks with Quiet Ventures
    participating, at a $750M post-money valuation—notably achieved before a publicly launched product, with only 36 employees.
    The Series C of $70M closed in November 2024, led by BOND with Sequoia, Greenoaks, and Lightspeed returning, reaching
    a $1.4B valuation and unicorn status in under a year from founding. The Series D of $300M closed December 2, 2025, led
    by Elad Gil of Gil Capital, tripling the valuation to $4B with participation from Sequoia, Lightspeed, Greenoaks, BOND,
    Affinity, Omri Casspi, Vine Ventures, and Georgian. Tracxn reports total funding of $497M across the five rounds.

    The valuation trajectory—from $215M (Jan-Sep 2024) to $750M (Oct 2024) to $1.4B (Nov 2024) to $4B (Dec 2025)— has attracted
    attention for its speed. Investor commentary is uniformly bullish: Elad Gil said "data is the most valuable, invisible
    asset on every company''s balance sheet," and Jay Simons of BOND described Eon as "setting a bold new benchmark for how
    companies operate." Sequoia''s Shaun Maguire called the team "cloud pioneers" solving backup management for the next generation.
    Each of the four institutional leads returned in subsequent rounds, a signal of insider confidence.

    Adverse signals around valuation have also been reported: Globes noted in November 2025 that Eon''s annual revenue was
    estimated at "millions up to something over $10 million," implying a revenue multiple well above 100x— extremely high
    even by 2025 AI-era standards. Calcalist independently noted at Series C that "it is unclear whether Eon has begun generating
    substantial revenue," drawing an unfavorable comparison to Wiz, which quickly demonstrated significant sales growth before
    reaching a comparable valuation. The CEO acknowledged this tension, saying in March 2025 that there would be challenges
    and that "we will lose customers along the way."'
