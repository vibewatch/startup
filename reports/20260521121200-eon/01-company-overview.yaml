- id: section-founders-leadership
  title: Founders, leadership, and key-person dependence
  body: 'Eon was founded by three executives who spent four years together at Amazon Web Services following the 2019 acquisition
    of their prior company, CloudEndure. Ofir Ehrlich serves as CEO and co-founder; he is a serial entrepreneur on his fourth
    venture with two prior exits, and the sale of CloudEndure to AWS for approximately $200M is the most material credential
    shaping investor confidence. Ehrlich''s network spans the IDF Unit 8200 innovation hub, connecting Eon to the same ecosystem
    that produced Wiz, Fireblocks, Lightricks, and Snyk. Gonen Stein serves as President and co-founder, having co-founded
    CloudEndure with Ehrlich in 2013 and led business operations; per Calcalist reporting, Stein handles US commercial operations
    from New York while Ehrlich and Kimchi oversee the Israel development center. Ron Kimchi is CTO and co-founder; he joined
    AWS as General Manager of Disaster Recovery and Cloud Migration in Israel, overseeing projects built on CloudEndure technology,
    and brings deep AWS infrastructure and product architecture expertise.

    Beyond the founding trio, Eon''s Series D announcement explicitly names Avi Biton as CFO and Moshe Milman as CSO (Chief
    Strategy Officer). This five-executive team—CEO, President, CTO, CFO, CSO—reflects a leadership structure typical of a
    late-Series D company preparing for scale, although governance documentation for a private company is limited. The company
    had approximately 192 employees as of March 2026, and at the time of its Series B (October 2024) it had only 36 employees
    split between New York and Tel Aviv, demonstrating rapid team expansion coinciding with its fundraising velocity.

    Key-person dependence is high: Ehrlich is the primary public face and fundraising anchor, personally acknowledged by Calcalist
    as structuring each round''s terms before engaging investors. The tight-knit founding team and repeated co-investment
    by the same investor syndicate (Sequoia, Lightspeed, Greenoaks, BOND) add governance continuity but also concentration.
    No material adverse leadership events—departures, disputes, or governance restructuring—have been publicly reported as
    of the runDate.'
