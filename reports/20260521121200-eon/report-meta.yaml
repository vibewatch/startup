companyProfile:
  summary: >
    Eon (incorporated as EON IO, INC.) is a New York- and Tel Aviv-based enterprise cloud infrastructure company
    founded in January 2024 by three AWS veterans who previously built and sold CloudEndure to Amazon for approximately
    $200 million. Its Cloud Backup Posture Management (CBPM) platform provides agentless, multi-cloud backup protection
    across AWS, Azure, and GCP while simultaneously converting backup data into open-format (Apache Iceberg/Parquet)
    zero-ETL data lakes queryable by analytics and AI engines. In under two years Eon raised $497 million across five
    rounds, reaching a $4 billion valuation in December 2025. Revenue reportedly more than tripled in 2025, though
    exact figures remain undisclosed for this private company.
  foundedDate: "2024-01-02"
  founders:
    - name: Ofir Ehrlich
      role: CEO & Co-Founder
      background: >
        Serial entrepreneur on his fourth venture; co-founded and sold CloudEndure to AWS for ~$200M in 2019;
        served at AWS post-acquisition; Unit 8200 network.
      claimRefs: [CO002, CO003]
    - name: Gonen Stein
      role: President & Co-Founder
      background: >
        Co-founded CloudEndure with Ehrlich in 2013; led business operations through AWS acquisition and integration;
        oversees US commercial operations from New York.
      claimRefs: [CO002, CO003]
    - name: Ron Kimchi
      role: CTO & Co-Founder
      background: >
        Joined AWS as General Manager of Disaster Recovery and Cloud Migration after the CloudEndure acquisition;
        brings deep AWS infrastructure and product architecture expertise.
      claimRefs: [CO004]
  foundingLocation: "New York, NY, USA"
  headquarters: "245 Fifth Avenue, New York, NY 10016, USA (R&D: Tel Aviv-Jaffa, Israel)"
  productSummary: >
    The Eon platform delivers two integrated modules: Eon Data Protection (agentless cloud-native backup and
    ransomware resilience across AWS, Azure, and GCP) and Eon Data Lake Infrastructure (zero-ETL conversion of
    backups and archives into Apache Iceberg/Parquet tables queryable by Snowflake, Databricks, BigQuery, Athena,
    Spark, and Trino). The platform is agentless — customers grant a single IAM role — and includes AI-powered
    natural language search via MCP/A2A connectors, immutable isolated vaults, granular row-level recovery, and
    30–50% storage cost reduction through cloud-native deduplication.
  customerFocus: >
    Large enterprises with multi-cloud environments seeking to consolidate cloud backup, achieve compliance and
    ransomware resilience, and unlock AI and analytics value from historical data — particularly in financial
    services, technology, and regulated industries.
  businessModel: >
    Usage-based enterprise SaaS priced per GB per month of protected cloud data; sold direct with AWS, Azure,
    and Google Cloud Marketplace distribution; generous channel economics (resellers earn ~25% of deal value).
  stage: "Series D"
  fundingStatus: >
    $300M Series D closed December 2, 2025, led by Elad Gil (Gil Capital) with Sequoia Capital, Lightspeed Venture
    Partners, Greenoaks, BOND, Affinity, Vine Ventures, Georgian, and Omri Casspi (Swish Ventures) returning.
    Total capital raised: ~$497M across five rounds in under 24 months. Post-money valuation: $4 billion.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO003, CO004, CO005, CO013, CO014, CO015, CO018, CO019, CO026]

