  - id: exit-readiness-and-scenarios
    title: Exit Readiness and Scenario Analysis
    body: >
      Exit readiness for Eon is materially constrained by the absence of public financial disclosures. A credible IPO path requires at minimum: audited GAAP financials, disclosed ARR with NRR, gross margin, operating cash flow, and a S-1 narrative that defends the CBPM category as distinct from cloud-native backup more broadly. None of these elements have been disclosed as of May 2026. EY's Q1 2026 Global IPO Trends report noted 307 global IPOs in Q1 2026, a recovery from 2023–2024 lows, with technology and digital sectors representing the largest share; however, investor scrutiny for late-stage tech IPOs remains high on unit economics and path to profitability. A strategic sale remains more likely in the near term: AWS, Microsoft, and Palo Alto Networks are all active acquirers in cloud data protection and security adjacencies. At the $4 billion current mark, a strategic buyer would pay $4.5–8 billion in an upside scenario, yielding 1.1–2.0x on the current round—below typical venture return thresholds and likely achievable only at ARR meaningfully above $400 million.

      The thesis-break conditions are concrete. An AWS API policy change revoking agentless EBS snapshot access would eliminate Eon's primary architectural differentiator and trigger an immediate buy-side diligence hold. Revenue growth decelerating below 50% YoY for two consecutive quarters would signal that the premium enterprise sales cycle is tightening. A competitive feature parity announcement from Rubrik or Cohesity covering CBPM-equivalent posture management would compress Eon's pricing power. Regulatory enforcement against a data processor in Israel or an EU DPA requirement mandating data residency that Eon cannot satisfy on AWS alone would threaten European revenue expansion. The final diligence asks below are non-negotiable for any entry above the current round price.
    claimRefs:
