callouts:
  - calloutType: recommendation
    title: "Recommendation: TRACK with LOW Confidence"
    body: >
      Eon earns a TRACK, not BUY, because the valuation is stretched against every disclosed comparable and the company has not disclosed the financial data required to underwrite entry at $4 billion. The founder track record, market size, revenue trajectory, and investor syndicate are all compelling signals; however, compelling signals alone do not justify a premium that requires $300–400 million or more in undisclosed ARR to be fair. Entry discipline and a mandatory data-room package (ARR, NRR, cap-table, burn) are pre-conditions for upgrading this recommendation.
    claimRefs:
      - CV001
      - CV007
      - CV025
      - CV037

  - calloutType: risk
    title: "Structural Risk: Valuation Stretched Without Financial Disclosure"
    body: >
      At $4 billion post-Series D with no disclosed ARR, Eon's implied revenue multiple ranges from 13x to 44x depending on the ARR assumption. The median public SaaS EV/ARR multiple in May 2026 is 6–7x; even the highest-quality cloud data-security companies (Rubrik, Veeam) trade at 8–9x. Eon's rapid valuation escalation from $215 million to $4 billion in under 24 months is extraordinary and mirrors the 2021 SaaS multiple expansion that subsequently corrected sharply. Investors entering at the current round price carry multiple-compression risk if the IPO or M&A exit occurs in a normalized multiple environment.
    claimRefs:
      - CV014
      - CV024
      - CV025
      - CV026

  - calloutType: strength
    title: "Key Strength: Tier-1 Syndicate and Repeat-Founder Credibility"
    body: >
      Sequoia Capital, Lightspeed Venture Partners, Greenoaks, and BOND Capital all returned for the Series D alongside new lead investor Elad Gil. The full syndicate participation signals that the investors with the most information (insiders who have seen financial data through prior rounds) remain constructive on the trajectory. Elad Gil's track record—early backer of Airbnb, Stripe, Coinbase, and GitHub—lends additional signal quality. The founding team's CloudEndure-to-AWS exit provides domain credibility that is rare among cloud backup startups.
    claimRefs:
      - CV018
      - CV044
      - CV045

  - calloutType: insight
    title: "Comparable Anchor: Rubrik FY2026 10-K Provides Public Baseline"
    body: >
      Rubrik's March 2026 10-K filing with the SEC provides the most credible public anchor for valuing cloud data-protection platforms. Rubrik's $1.46 billion subscription ARR, 34% YoY growth, 83% non-GAAP gross margin, and NRR above 120% are the standards Eon must match or exceed at scale to justify a comparable or superior multiple. At Rubrik's 8–9x ARR multiple, Eon would need $445–500 million in ARR to trade at current valuation parity—a threshold that implies Eon has grown substantially beyond its disclosed trajectory.
    claimRefs:
      - CV004
      - CV005
      - CV007
      - CV031
      - CV040

