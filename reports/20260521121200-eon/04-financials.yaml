company:
  name: Eon
chapter:
  number: 4
  title: Financials
  summary: Eon monetizes as a usage-based enterprise SaaS platform priced per GB per month, and public customer proofs show meaningful ROI, fast deployments, and strong storage-cost savings. But despite a $300M Series D at a $4B valuation, the company still does not disclose ARR, ACV, CAC, gross margin, cash, or burn, so public evidence supports revenue quality directionally rather than enough to underwrite fair value with confidence.
sections:
- id: revenue-model-pricing
  title: Revenue model, pricing, and monetization routes
  body: 'Eon''s public commercial model is clear at the list-price level and opaque almost everywhere else. The company prices its service on a per-GB-per-month basis and frames contracts as flexible spending commitments sized to expected backup growth rather than as appliance purchases or seat licenses. That lines up with what the product actually is: a fully managed SaaS service with no customer-run backup infrastructure, no agents, and no appliances. Financially, that matters because it makes Eon look more like a recurring cloud service than a traditional backup vendor with hardware-heavy deployment costs. Public materials also point to more than one monetization path. The core recurring bill is backup storage consumption, but Eon is also selling a control plane for backup posture management and an analytics layer that makes backup data queryable in BigQuery and other tools. Distribution is increasingly channel-enabled as well: management says customers want marketplace procurement, the
    Google Cloud partnership formalized marketplace support, and partner economics are generous enough that resellers can earn roughly a quarter of deal value back. The missing piece is realized pricing. Public materials do not disclose discounting, minimum commitments, ACV, or how much revenue comes from core backup versus analytics expansion.'
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  - CI005
  - CI006
