  - Implication
  rows:
  - - List pricing basis
    - Per-GB/month for backed-up storage
    - Public list mechanism
    - No public discount bands or floor commitments
    - Revenue should scale with protected footprint rather than seats
  - - Commitment structure
    - Flexible spending commitments sized to expected growth
    - Public concept only
    - No sample contract, minimum term, or expansion clauses public
    - Can support enterprise growth without appliance refreshes
  - - Customer-side infrastructure
    - No agents, appliances, or customer-run backup infra
    - Publicly stated
    - Migration-service fees and premium support terms undisclosed
    - Reduces adoption friction and customer capex
  - - Channel economics
    - ~25% of deal value back to partners
    - Partial disclosure via interview
    - Exact marketplace take rates and reseller schedules undisclosed
    - Channel expansion may trade margin for distribution
  - - Activity fees
    - No hidden costs / no restore-fee or API-charge narrative
    - Company-described
    - Actual pass-through exceptions undisclosed
    - Simpler billing supports chargeback and buyer clarity
  notes: Only list-pricing mechanics are public. Realized pricing, ACV, discounting, and standard enterprise terms remain undisclosed.
