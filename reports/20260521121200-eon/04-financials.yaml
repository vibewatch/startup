- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Value or public status
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Customer cost reduction
    - 30%–50% claimed recurring savings
    - medium
    - Supports value proposition and renewal logic
    - Get cohort-level savings data by segment and cloud
  - - First-year ROI
    - '>100% in one public example'
    - medium
    - Suggests fast payback if representative
    - Request median payback and win/loss data
  - - Deployment speed
    - 3-day initial backup / 25-day kickoff-to-production in one proof; under a week in another
    - medium
    - Fast time-to-value can reduce CAC payback friction
    - Request median time-to-value across all enterprise cohorts
  - - Channel margin share
    - ~25% of deal for partners, per management
    - medium
    - Indicates partner economics and possible gross-to-net leakage
    - Request marketplace and reseller commission schedules
  - - ACV / realized deal size
    - null
    - low
    - Contract size determines sales efficiency and valuation support
    - Request ACV distribution, expansion revenue, and top-10 account concentration
  - - CAC / LTV / payback
    - null
    - low
    - Critical to underwrite GTM efficiency and durability
    - Request CAC, LTV, CAC payback, sales efficiency, and magic number by quarter
  notes: Public unit-economics evidence is strongest on customer savings and weakest on company-level sales efficiency. Null rows mark metrics not publicly disclosed.
