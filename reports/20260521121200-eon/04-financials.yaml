callouts:
- calloutType: strength
  title: Recurring pricing and customer ROI are real; unit economics are not public
  body: 'Eon has enough public evidence to show real customer value: recurring usage-based pricing, 30%–50% cost savings, and isolated >100% first-year ROI. That is stronger than a narrative-only startup. What remains missing are company-level ACV, CAC, and margin metrics.'
  claimRefs:
  - CI001
  - CI019
  - CI020
  - CI044
  - CI046
- calloutType: risk
  title: Valuation still runs ahead of disclosure depth
  body: By December 2025 Eon was worth $4B, yet Reuters still reported only that revenue had more than tripled and that the customer base was “a few tens.” Globes had already flagged the speed of valuation inflation in March 2025. The risk is not proven overvaluation; it is insufficient public data to test valuation discipline.
  claimRefs:
  - CI014
  - CI016
  - CI017
  - CI041
  - CI042
- calloutType: recommendation
  title: Require a data-room bridge before underwriting fair value
  body: A serious diligence process should request a full revenue bridge, ACV and retention cohorts, gross-margin build, burn schedule, and financing documents. Public sources are enough to support a promising business model, but not enough to support a confident valuation opinion.
  claimRefs:
  - CI033
  - CI038
  - CI040
  - CI043
  - CI044
  - CI045
  - CI046
