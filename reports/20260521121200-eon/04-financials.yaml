tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Unit
  - Current public status
  - Revenue quality
  - Diligence ask
  rows:
  - - Core backup subscription
    - Recurring charge for protected backup storage
    - Per-GB/month
    - List-price mechanism public; realized revenue undisclosed
    - Recurring usage revenue tied to protected data footprint
    - Request cohort revenue by protected TB and customer
  - - CBPM control plane
    - Policy automation, discovery, posture monitoring, and recovery workflow
    - Bundled with subscription
    - Visible in product language; no separate SKU pricing public
    - Likely sticky if embedded in operations
    - Request SKU-level revenue split and attach rates
  - - Data-lake / analytics activation
    - Direct query access to backup data via Iceberg and partner analytics tools
    - Bundled / upsell potential
    - Monetization path visible; standalone pricing undisclosed
    - Could expand ARPA if analytics use is material
    - Request analytics attach rate, upsell rate, and gross-margin delta
  - - Marketplace / channel sales
    - Hyperscaler marketplace and reseller-assisted procurement
    - Rev-share / reseller margin
    - Distribution route disclosed; economics only partially public
    - Broadens reach but may reduce net take rate
    - Request marketplace mix and partner fee schedule
  notes: Public sources show recurring storage billing and partner distribution routes, but they do not disclose revenue mix, attach rates, or realized pricing by stream.
