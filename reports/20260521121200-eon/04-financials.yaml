- id: traction-sales-efficiency
  title: Public traction and sales-efficiency proxies
  body: 'The best public financial evidence for Eon is indirect: customer outcomes, deployment speed, and management commentary. Reuters reported that revenue more than tripled and that Eon serves a few tens of large enterprise customers, including SoFi, but absolute revenue is still undisclosed. Customer references are materially stronger than the raw count suggests. Eon repeatedly claims 30% to 50% storage-cost savings, the customers page highlights a more-than-100% first-year ROI example, NETGEAR reports a 35% cost reduction plus 88% faster recovery on a 10TB SQL Server database, Google Cloud cites 90% faster recovery and 30% to 50% infrastructure-cost reduction, and SoFi says data-preparation time improved by more than 90%. Those metrics are not audited unit economics, but they do indicate that buyers are seeing measurable value quickly enough to support expansions and renewals. Public onboarding signals are also constructive. One example customer moved from kickoff to production in
    25 days, with initial backup completed in three days, while NETGEAR says it deployed in under a week with virtually no retraining. For underwriting, these are positive sales-efficiency proxies; they are not substitutes for ACV, CAC payback, or NRR, which remain undisclosed.'
