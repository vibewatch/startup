- id: FI003
  title: Public financial signal ranges and proxies
  type: range
  layout: wide
  summary: The public record offers useful boundary conditions on savings, partner economics, customer scale, and runway, but not audited company financials.
  data:
    items:
    - label: Customer cost reduction (%)
      low: 30
      high: 50
      note: Repeated company and partner claim across official, Google Cloud, and funding materials
    - label: First-year ROI example (%)
      low: 100
      high: 100
      note: Customers page cites a >100% first-year ROI example; 100 is a floor, not a ceiling
    - label: Partner margin share (% of deal)
      low: 20
      high: 25
      note: Channel Insider quotes management saying partners can get almost a quarter of the deal back
    - label: Enterprise customer proxy (accounts)
      low: 20
      high: 40
      note: Estimated from Reuters' phrase “a few tens”; not a company-disclosed count
    - label: Runway signal (months)
      low: 18
      high: 18
      note: Management comment to Reuters after the Series D round
  approximationNotes: Units differ by row. The customer-count row is an estimate anchored on Reuters' wording, and the ROI row uses 100 as a conservative floor for a >100% claim.
  claimRefs:
  - CI017
  - CI019
  - CI020
  - CI009
  - CI037
- id: FI004
  title: Capital intensity / cash-flow map
  type: matrix
  layout: wide
  summary: Eon's public cost base looks software-led, but several important cash-flow inputs remain undisclosed.
  data:
    columns:
    - Public signal
    - Cash-flow implication
    - Underwriting read
    rows:
    - label: Cloud storage / compute pass-through
      values:
      - Deduplication, compression, and low-cost tiers highlighted publicly
      - COGS likely scales with protected data and query volume
      - Margin can improve, but only if infrastructure efficiency is real
    - label: Sales and partner expansion
      values:
      - R&D, hiring, U.S. expansion, and marketplace growth are explicit
      - Opex should stay elevated while Eon scales distribution
      - Growth plan is not yet self-proving from public metrics
    - label: Customer success / onboarding
      values:
      - Fast deployments and chargeback features are publicly emphasized
      - Could lower service burden per customer over time
      - Helpful, but not enough to infer CAC payback
    - label: Acquisitions optionality
      values:
      - Reuters says new capital provides flexibility for acquisitions
      - Could accelerate spend or add integration risk
      - Optionality is positive strategically but complicates burn forecasting
    - label: Debt / project finance
      values:
      - No public obligations surfaced in reviewed filing tools
      - No visible debt service drag in public evidence
      - Treat as a disclosure gap rather than proven zero debt
  approximationNotes: This is a qualitative financial map derived from public disclosures and gaps; it is not a management cash-flow statement.
