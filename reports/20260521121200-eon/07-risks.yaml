callouts:
- calloutType: risk
  title: AWS concentration is Eon’s highest-severity systemic exposure
  body: While ransomware, regulatory enforcement, and people risks are all material, the single-cloud AWS dependency is Eon’s
    most severe systemic risk because it cannot be mitigated through compliance programmes or partnerships alone. A change
    in AWS policy, pricing, or API availability would affect all Eon customers simultaneously and require months of engineering
    work to address. Investors should require a board-level multi-cloud contingency plan as a condition of further capital
    deployment.
  claimRefs:
  - CR010
  - CR013
  - CR032
- calloutType: insight
  title: 'Israel: world-class engineering talent with a monitored geopolitical tail risk'
  body: Eon’s Tel Aviv R&D centre is both a competitive asset—Israel’s tech sector raised $15.6 billion in 2025 and produced
    the CloudEndure team that AWS paid approximately $200 million to acquire—and a concentration risk. Post-October 2023,
    the Israel-Iran conflict dynamic has elevated the plausible tail scenario of R&D disruption from theoretical to monitored.
    Investors should request Eon’s business continuity plan for a 30-day Tel Aviv operational suspension scenario.
  claimRefs:
  - CR017
  - CR039
  - CR041
