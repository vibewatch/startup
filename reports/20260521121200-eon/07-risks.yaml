    - High
    - Critical
    - Strong – immutable append-only snapshots, read-only IAM access, SentinelOne XDR real-time detection
    - Low-Medium – architectural controls reduce but do not eliminate advanced threat actor risk; zero-day exploits remain
      possible
    - No public post-incident playbook or customer notification SLA published; independent penetration test results not disclosed
  - - AWS hyperscaler API deprecation or native backup competition displacing Eon
    - Low-Medium
    - Critical
    - Weak – Apache Iceberg data portability exists but control plane is fully AWS-native; no alternative control plane documented
    - High – full platform outage or forced migration if AWS revokes or deprecates core APIs; catastrophic revenue impact
    - No multi-cloud control-plane redundancy plan or AWS commercial agreement terms publicly disclosed; no contingency engineering
      roadmap visible
  - - Major Eon platform data breach or exfiltration affecting customer backup data
    - Low
    - Critical
    - Moderate – SOC 2 Type 2, ISO 27001, agentless read-only architecture reduce attack surface vs. agent-based competitors
    - Medium – breach of backup data exposes all protected customer workloads; reputational and regulatory (GDPR) impact severe
    - Cyber liability insurance coverage, incident response retainer, and customer breach notification SLA timeline not publicly
      disclosed
  - - Eon AI Agent (Gemini + Claude) exposing customer backup metadata to third-party LLM providers
    - Medium
    - High
    - Weak – no public AI data governance framework, LLM data retention policy, or GDPR AI-processor addendum disclosed
    - Medium-High – EU enterprise customers may face GDPR obligations when backup metadata is processed by third-party AI
      models
    - Customer opt-out mechanism, LLM data minimisation architecture, and AI processor agreements with Google and Anthropic
      not publicly documented
  - - Eon service outage due to single-cloud (AWS) dependency (repeat of October 2025 US-EAST-1 event)
    - Medium
    - High
    - Moderate – multi-AZ architecture standard; control-plane failover configuration not publicly documented
    - Medium – during an AWS outage, customers lose both primary workloads and backup access simultaneously; recovery impossible
      until AWS restores
    - Multi-region control-plane failover plan, SLA uptime commitments, and customer-facing RTO/RPO guarantees not publicly
      disclosed
  - - Cloud vendor lock-in reducing customer portability and increasing AWS pricing leverage over Eon
    - Medium
    - Moderate
    - Moderate – Apache Iceberg and standard object storage reduce data-layer lock-in; compute and control-plane remain AWS-native
    - Medium – enterprise migration from Eon platform estimated at $1M–$10M switching cost; customers are partially captive
    - No customer portability study, multi-cloud migration guide, or competitive migration tooling publicly disclosed; Apache
      Iceberg compatibility with Azure/GCP not documented end-to-end
  notes: Likelihood and severity are qualitative assessments based on public threat intelligence, industry benchmarks, and
