- id: partner-dependency-concentration-risks
  title: Partner, Dependency, and Concentration Risks
  body: 'Eon’s dependency map includes three tiers of concentration risk: infrastructure providers, strategic partners, and
    key customers. AWS dominates the infrastructure tier as Eon’s primary cloud provider. Azure and GCP are supported for
    workload protection, but Eon’s control plane and administrative functions appear AWS-hosted; the October 2025 AWS outage
    demonstrated the blast radius for cloud-native vendors with undiversified control planes.


    The SentinelOne partnership, announced March 24, 2026, is strategically important but creates bilateral dependency risk.
    SentinelOne’s S Ventures arm invested in Eon, creating equity alignment that mitigates—but does not eliminate—partnership
    dissolution risk. If SentinelOne terminates the integration, Eon loses privileged XDR telemetry that powers its ransomware
    detection signal, degrading a key differentiation claim. EU financial entity customers operating under DORA face cloud
    concentration risk themselves: DORA’s ICT concentration provisions discourage reliance on any single cloud provider, which
    may cause compliance-conscious customers to require multi-cloud control-plane redundancy from Eon.


    Customer concentration adds a further dimension: with five named enterprise customers (SoFi, AlphaSense, Sigdo Koppers,
    NETGEAR, StructuredWeb) comprising the public reference base, early churn among the named accounts would materially impair
    Eon’s social proof and sales velocity at this stage of growth. Apache Iceberg’s strong ecosystem support from AWS, Google,
    Microsoft, and Snowflake reduces open-source governance risk and is a relative bright spot in the dependency map.'
