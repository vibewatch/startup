- id: operational-security-risks
  title: Operational and Security Risks
  body: 'Eon’s operational risk profile is dominated by two interconnected threat vectors: ransomware specifically targeting
    cloud-native backup repositories, and single-cloud concentration risk from Eon’s deep coupling to AWS infrastructure.
    The Google Cloud Threat Horizons Report for H1 2026 confirmed a 37 percent increase in cloud-targeting attacks in 2025,
    with ransomware featuring in 44 percent of cloud data breach events. Eon’s cloud ransomware guide acknowledges that cloud-conscious
    threat actors now specifically enumerate and delete backup snapshots before encrypting primary workloads—a tactic designed
    to render traditional recovery workflows ineffective. Eon’s core countermeasure is immutable, append-only snapshot versioning
    combined with read-only IAM access that prevents lateral movement through the backup platform itself.


    The AWS concentration risk materialised tangibly during the October 2025 US-EAST-1 outage that disrupted hundreds of cloud-native
    applications simultaneously. Eon’s agentless architecture connects via cloud APIs, meaning a failure or intentional policy
    change by AWS—such as deprecating EC2 or EBS snapshot APIs—could affect Eon customers without warning. While Apache Iceberg’s
    open table format provides theoretical data portability, Eon’s compute orchestration, IAM integration, and control-plane
    operations remain deeply AWS-native. Viking Cloud’s 2026 ransomware statistics report confirms that backup platforms and
    cloud storage buckets now rank in the top-five categories of ransomware target.


    The April 2026 introduction of the Eon AI Agent—integrating Google Gemini and Anthropic Claude—introduces a new operational
    risk surface: customer backup metadata and query patterns are transmitted to third-party AI models as part of the natural-language
    query pipeline. Depending on data scope, this may trigger additional GDPR controller obligations or violate enterprise
    customers’ data sovereignty requirements. Eon has not publicly documented whether customer data is logged, cached, or
    used for model fine-tuning by the underlying AI providers.'
