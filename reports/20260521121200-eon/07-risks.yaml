- id: mitigations-monitoring-thesis-break
  title: Mitigations, Monitoring, and Thesis-Break Triggers
  body: 'Eon has implemented a substantive security and compliance baseline: SOC 2 Type 2 and ISO 27001 certifications demonstrate
    security control maturity appropriate for enterprise procurement. The 100-percent-agentless architecture with read-only
    IAM access structurally reduces the blast radius of a backup-platform breach—a direct architectural response to the most
    prevalent class of backup-targeting ransomware. The SentinelOne partnership adds real-time XDR-based threat detection
    to the backup workflow, extending Eon’s detection capabilities beyond what a standalone backup vendor typically offers.
    Immutable append-only snapshot storage satisfies the core ransomware-resilience requirement for enterprise customers.


    Investors should track five principal monitoring indicators: (1) AWS dependency diversification—evidence of Azure or GCP
    control-plane support would materially reduce concentration risk; (2) FedRAMP authorisation progress—an Authority to Operate
    submission would open the federal market and signal compliance maturity; (3) NIS2 and DORA customer compliance certification—certifications
    issued to EU customers confirm Eon has cleared third-party risk reviews; (4) SentinelOne partnership depth—expansion beyond
    detection signalling into joint go-to-market would demonstrate partnership durability; (5) leadership continuity—all three
    founders remaining in active operational roles through the next 18 months is the strongest signal of execution risk management.


    Thesis-break triggers that warrant immediate investor review include: AWS issuing a policy change that revokes or materially
    limits third-party access to EC2, EBS, or RDS snapshot APIs; a confirmed data breach affecting Eon customer data at scale;
    departure of more than one co-founder within a six-month window; discovery of material IIA grant IP transfer restrictions
    constraining M&A or technology licensing; or a hyperscaler announcing native CBPM feature parity at substantially lower
    price points. Any combination of two or more of these triggers simultaneously would constitute a fundamental challenge
    to the investment thesis.'
