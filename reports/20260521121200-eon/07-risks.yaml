  rows:
  - - GDPR data processing and processor liability
    - EU (all 27 member states)
    - Active – Eon processes EU residents’ backup data as a processor; data processing agreements (DPAs) required for all
      EU customers
    - High
    - Critical
    - Partial – GDPR-compliant DPAs confirmed in Feb 2026 privacy policy; SOC 2 Type 2 + ISO 27001 as evidence of technical
      controls
    - Medium – processor enforcement active; average fine €1.02M in 2025; €7.1B cumulative
    - Verify all EU customer contracts include GDPR-compliant DPAs; engage EU external counsel to audit data transfer mechanisms
      (SCCs or adequacy)
  - - NIS2 Directive third-party supplier compliance
    - EU (27 member states, transposed from Oct 17 2024)
    - Active – covered EU customers must validate Eon as a qualified ICT supplier; NIS2 Article 21 security requirements apply
    - High
    - High
    - Partial – SOC 2 Type 2 partially satisfies NIS2 Article 21; no NIS2-specific certification or authority attestation
      disclosed
    - Medium – NIS2 penalties for covered EU customers may reduce Eon procurement eligibility if third-party requirements
      are unmet
    - Request NIS2 compliance roadmap from Eon; verify EU customer procurement questionnaires are completed and supplier assessments
      on file
  - - DORA ICT third-party risk obligations (EU financial entities)
    - EU financial sector (effective Jan 17 2025)
    - Active – EU-regulated financial entities must hold DORA Article 30-compliant contracts with Eon; exit plans and ICT
      concentration disclosures required
    - High
    - High
    - Partial – Eon DPAs address baseline DORA contractual requirements; exit plan and ICT concentration provisions not publicly
      disclosed
    - Medium-High – EU financial customers may block renewal until DORA compliance is confirmed; fines up to 2% of global
      annual turnover for covered entity
    - Request DORA contractual addendum, exit plan documentation, and ICT concentration risk assessment; confirm sub-contractor
      disclosure obligations met
  - - FedRAMP authorisation gap (US federal market exclusion)
    - United States
    - Gap – Eon is not FedRAMP authorised; US federal agencies cannot procure Eon backup services; Rubrik is authorised since
      2023
    - Definite (current market exclusion)
    - High
    - None – no FedRAMP authorisation roadmap disclosed; risk is binary market exclusion not managed risk
    - High – entire US federal backup market (>$5B annual cloud spend) excluded until ATO received; gap widens as Rubrik entrenches
    - Request Eon’s FedRAMP roadmap; assess feasibility of Moderate or Low ATO within 24 months; evaluate whether federal
      segment is in near-term GTM plan
  - - IP / patent litigation risk from backup incumbents
    - United States (primarily)
    - Latent – no active litigation disclosed; risk increases with Eon’s market visibility; incumbents hold large backup and
      deduplication patent portfolios
    - Medium
    - High
    - Partial – Eon claims proprietary CBPM methods; patent clearance study and freedom-to-operate opinion not publicly disclosed
    - Medium – litigation could delay features or require costly licensing for backup deduplication, snapshot orchestration,
      or AI-driven indexing methods
    - Request patent landscape analysis and freedom-to-operate opinion from IP counsel; review Eon’s own patent portfolio
      and defensive publication strategy
  - - Israel Innovation Authority (IIA) IP transfer restrictions
    - Israel
    - Uncertain – undisclosed whether Eon received IIA grants; if so, IP transfer, manufacturing, and licensing restrictions
      apply under R&D Law
    - Medium
    - High
    - None disclosed – no IIA grant disclosure found; risk scope is undetermined without legal due diligence
    - High – undisclosed IIA covenants could block IP transfer in M&A or require royalty payments to Israeli state; acquirer
      faces compliance obligations
    - Request full IIA grant disclosure from founding period; engage Israeli IP counsel to review technology transfer covenants
      and royalty obligations pre-close
  notes: Status and likelihood assessments reflect publicly available regulatory developments as of May 2026. Eon’s internal
    compliance correspondence, regulatory submissions, legal proceedings, and IIA grant agreements are not publicly disclosed
