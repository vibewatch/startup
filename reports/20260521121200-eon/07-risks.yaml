- id: TR003
  title: Partner / dependency risk register
  columns:
  - Dependency
  - Counterparty
  - Role
  - Concentration
  - Failure Scenario
  - Severity
  - Mitigation
  - Residual Exposure
  rows:
  - - Primary cloud infrastructure and control plane
    - AWS (Amazon Web Services)
    - Sole confirmed control-plane, compute, and storage provider for Eon CBPM operations
    - Critical – all platform operations depend on AWS APIs; no multi-cloud control plane documented
    - AWS deprecates snapshot APIs, raises platform fees above Eon margin thresholds, or launches native CBPM competitor
    - Critical
    - Apache Iceberg data portability; multi-cloud data protection strategy for workloads; no control-plane alternative documented
    - High – control-plane migration would require multi-quarter engineering effort and significant customer disruption
  - - XDR ransomware detection telemetry
    - SentinelOne
    - Strategic partner and investor providing endpoint/XDR telemetry powering Eon AI Agent ransomware detection
    - High – only disclosed source of real-time XDR threat signals integrated into Eon platform
    - Partnership dissolution removes real-time XDR-based threat detection; Eon AI Agent ransomware signal degrades
    - High
    - SentinelOne equity stake via S Ventures creates alignment; partnership depth and contractual minimum term not disclosed
    - Medium – equity alignment reduces dissolution probability but does not guarantee feature depth or long-term exclusivity
  - - AI model inference for Eon AI Agent
    - Google (Gemini) / Anthropic (Claude)
    - LLM providers for natural-language query generation and backup insight synthesis within Eon AI Agent
    - High – dual-provider AI dependency underpins the primary new product differentiation of the AI Agent
    - Model API deprecation, significant pricing increase, or GDPR enforcement action against LLM data flows
    - Medium
    - Dual-provider strategy (Gemini + Claude) reduces single-model dependency; open-weight model fallback not disclosed
    - Medium – Google and Anthropic both operate in Eon’s VC ecosystem (Google Ventures, Sequoia); alignment present but not
      contractually binding
  - - Open table format and data lake portability
    - Apache Iceberg (open-source, Apache Software Foundation)
    - Data portability layer enabling backup data to be queried without full restore; powers data lake activation use case
    - Medium – community project with commercial support from AWS, Google, Microsoft, Snowflake, and Databricks
    - Apache Iceberg governance fragmentation or commercial fork reduces enterprise adoption and Eon’s differentiator
    - Low
    - Iceberg backed by major cloud vendors and ASF; strong ecosystem; low governance failure risk
    - Low – broad commercial backing from all major cloud vendors and data platforms makes fork or abandonment scenario unlikely
  - - Enterprise customer reference base
    - SoFi, AlphaSense, Sigdo Koppers, NETGEAR, StructuredWeb
    - Named public customer references providing social proof for enterprise sales and compliance due diligence
    - High – five named accounts represent the entirety of Eon’s disclosed customer base at early ARR stage
    - SoFi (financial services, highest-profile customer) churns due to pricing, outage, or regulatory concern
    - High
    - Multi-year contract terms; usage-based billing creates switching cost; enterprise sales cycle provides early warning
    - Medium-High – SoFi is itself subject to CFPB and Fed regulatory scrutiny; changes to its backup strategy are beyond
      Eon’s control
  - - Core engineering talent pool
    - Israel (Tel Aviv-Azrieli Sharona R&D centre)
    - Primary engineering workforce for platform development, data infrastructure, and AI research
    - High – majority of engineering headcount estimated to be concentrated in Tel Aviv based on dual-HQ structure
    - Geopolitical escalation (Iran-Israel conflict) forces R&D suspension, evacuation, or emergency workforce relocation
    - High
    - Dual-HQ model; New York office provides secondary operational base; BCP plan for Israel disruption not publicly disclosed
    - Medium – Israeli tech sector demonstrated resilience through prior conflicts; concentrated single-city R&D standard
      for Israeli startups but tail risk is real
  notes: Concentration ratings reflect publicly available architecture and partnership disclosures as of May 2026. Actual
    contractual terms, service-level agreements with AWS, SentinelOne, and AI providers are not publicly disclosed and may
    materially affect residual exposure. Rows ordered by severity (Critical → High).
