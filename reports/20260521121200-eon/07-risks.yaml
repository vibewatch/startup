- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable Trigger
  - Threshold / Event
  - Action Implication
  rows:
  - - GDPR / NIS2 / DORA regulatory enforcement
    - EU DPA investigation notice, DORA supervisory finding, or NIS2 penalty notice involving Eon or citing Eon as a non-compliant
      ICT supplier
    - Any EU DPA opens formal investigation into Eon’s data processing, OR any EU financial regulator cites Eon as a non-compliant
      DORA ICT provider in a supervisory report
    - Conduct emergency compliance audit with EU counsel; halt new EU contract signings pending remediation; notify board
      within 72 hours; reassess EU expansion timeline
  - - AWS hyperscaler concentration failure
    - AWS deprecates EC2/EBS/RDS snapshot APIs used by Eon; AWS Backup adds CBPM-parity features; or AWS US-EAST-1 outage
      exceeds 6 hours with Eon customer impact
    - AWS backup product reaches feature parity with Eon’s top-5 CBPM capabilities at <50% of Eon’s list pricing, OR API deprecation
      notice issued with <12-month transition
    - Initiate multi-cloud control-plane diversification programme; convene board to evaluate strategic options including
      acquisition, technology pivot, or controlled wind-down
  - - SentinelOne partnership dissolution
    - SentinelOne announces withdrawal from Eon integration or acquires a competing backup or data-protection vendor
    - SentinelOne publicly announces termination of Eon integration, OR completes acquisition of a backup or cyber-recovery
      platform competitor to Eon
    - Identify alternative XDR telemetry providers (CrowdStrike, Palo Alto Cortex); accelerate in-house threat detection model;
      notify enterprise customers of detection signal change within 30 days
  - - Key founder departure
    - Any of Ofir Ehrlich (CEO), Gonen Stein (President), or Ron Kimchi (CTO) announces departure from operational role
    - Any one co-founder leaves active operational role within 18 months of Series D close (December 2025)
    - Board convenes emergency succession review; pause new enterprise commitments pending leadership stability confirmation;
      request 90-day transition plan; consider hold rating pending outcome
  - - Hyperscaler native backup displacement
    - AWS Backup, Azure Backup, or Google Cloud Backup and DR announces feature set matching Eon’s CBPM platform capabilities
    - Any hyperscaler launches a native backup posture management feature covering ≥80% of Eon’s documented CBPM use cases
      at <60% of Eon’s list price
    - Commission independent feature gap analysis; evaluate whether Eon’s data-lake activation and AI Agent differentiation
      remains defensible; model residual competitive moat and adjust valuation thesis accordingly
  notes: Thresholds are investor-framework guidelines, not contractual terms. Actual trigger assessment requires real-time
    monitoring of AWS product announcements, EU regulatory publications, and Eon leadership disclosures. Action implications
    are directional; legal and fiduciary obligations may vary by investor type and jurisdiction.
