  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: >
              The enterprise cloud backup and data resilience market in 2026 divides into three structural tiers. The
              first tier comprises established enterprise platform vendors—Rubrik, Cohesity (post-Veritas), Veeam, and
              Commvault—each with annual recurring revenue exceeding $1 billion and deeply entrenched enterprise
              relationships built over five to fifteen years. The second tier is populated by cloud-native SaaS
              specialists including Druva (focused on endpoint and Microsoft 365) and Eon (focused on cloud
              infrastructure posture management). The third tier is the status-quo substitutes: native hyperscaler
              backup tools (AWS Backup, Azure Backup, GCP Backup and DR), manual IAC-based snapshot automation, and
              internal build programs at large cloud engineering teams.

              Eon enters this landscape with a fundamentally different value proposition: the Cloud Backup Posture
              Management (CBPM) platform not only protects cloud resources agentlessly but converts dormant backup data
              into zero-ETL, query-ready data lakes in Apache Iceberg and Parquet formats. No incumbent replicates this
              dual function as of the run date. However, Eon's ~0.7% cloud backup market share, "few tens" of enterprise
              customers, and absence from Gartner's Magic Quadrant for Data Center Backup and Recovery Solutions
              position it as an innovator that must earn displacement credibility before incumbents respond with
              features or acquisitions that close the gap. The Cohesity-Veritas merger and Veeam's VeeamON 2026 DataAI
              Command Platform launch signal that consolidation and AI-feature competition are already compressing Eon's
              differentiation window.

              Likely new entrants include large cybersecurity platforms (CrowdStrike, Palo Alto Networks) that are
              organically expanding toward data resilience from the detection side, and hyperscalers that may deepen
              native backup completeness to reduce third-party dependency. None of these represent an immediate direct
              threat to Eon's CBPM category but they collectively increase the competitive noise in Eon's target
              enterprise accounts.
