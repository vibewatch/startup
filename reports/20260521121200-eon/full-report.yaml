  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product, and operating model
        blocks:
          - type: paragraph
            body: >-
              Eon, incorporated as EON IO, INC. on January 2, 2024, operates as a private venture-backed technology
              company headquartered at 245 Fifth Avenue, New York, NY 10016, with a primary R&D center at the Azrieli
              Sharona complex on 121 Menachem Begin Road, Tel Aviv-Jaffa, Israel. The company defines its mission as
              providing instant access to enterprise cloud backup data and turning previously dormant storage into
              active, AI-ready infrastructure.

              The core product is the Cloud Backup Posture Management (CBPM) platform, which Eon claims is the first of
              its kind. It offers two principal modules: Eon Data Protection, which provides agentless, cloud-native
              backup and resilience across AWS, Microsoft Azure, and Google Cloud; and Eon Data Lake Infrastructure,
              which converts backups, archives, and historical data into open table formats (Apache Iceberg and Parquet)
              queryable directly by analytics engines such as Snowflake, Databricks, BigQuery, Athena, Spark, and
              Trino—without ETL pipelines or manual restores. The platform is agentless by design: customers grant a
              single read-only IAM role and Eon autonomously maps, classifies, and protects cloud resources across
              accounts and regions.

              Additional technical differentiators include forever-incremental backups with cloud-native deduplication
              that reduces storage costs by 30–50 percent, built-in ransomware detection with immutable isolated vaults,
              granular recovery down to a single database row, integrated log archiving with instant search, and
              AI-powered natural language search across datasets via MCP and A2A connectors. Eon filed dozens of patents
              covering these cloud storage and data management innovations. The company's self-description is that it is
              "a self-funding platform delivering immediate ROI and savings," positioning the product's cost savings as
              exceeding the platform cost itself.

              The operating model is pure B2B enterprise SaaS with multi-cloud support. Pricing is available on the Eon
              website and appears to follow per-resource cloud consumption patterns, though exact pricing tiers are not
              publicly disclosed in detail. Revenue generation relies on large enterprise contracts; the company had
              accumulated "a few tens" of large enterprise customers as of December 2025, including publicly named
              reference customer SoFi.
