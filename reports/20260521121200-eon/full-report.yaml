            title: 'Key Strength: Tier-1 Syndicate and Repeat-Founder Credibility'
            body: >
              Sequoia Capital, Lightspeed Venture Partners, Greenoaks, and BOND Capital all returned for the Series D
              alongside new lead investor Elad Gil. The full syndicate participation signals that the investors with the
              most information (insiders who have seen financial data through prior rounds) remain constructive on the
              trajectory. Elad Gil's track record—early backer of Airbnb, Stripe, Coinbase, and GitHub—lends additional
              signal quality. The founding team's CloudEndure-to-AWS exit provides domain credibility that is rare among
              cloud backup startups.
            calloutType: strength
            claimRefs:
              - CV018
              - CV044
              - CV045
          - type: callout
            title: 'Comparable Anchor: Rubrik FY2026 10-K Provides Public Baseline'
            body: >
              Rubrik's March 2026 10-K filing with the SEC provides the most credible public anchor for valuing cloud
              data-protection platforms. Rubrik's $1.46 billion subscription ARR, 34% YoY growth, 83% non-GAAP gross
              margin, and NRR above 120% are the standards Eon must match or exceed at scale to justify a comparable or
              superior multiple. At Rubrik's 8–9x ARR multiple, Eon would need $445–500 million in ARR to trade at
              current valuation parity—a threshold that implies Eon has grown substantially beyond its disclosed
              trajectory.
            calloutType: insight
            claimRefs:
              - CV004
              - CV005
              - CV007
              - CV031
              - CV040
