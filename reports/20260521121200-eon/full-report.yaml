      - number: '4.4'
        title: Financial verdict and remaining underwriting blockers
        blocks:
          - type: paragraph
            body: >-
              Eon's public financial profile is attractive in shape but weak in disclosure depth. The attractive side is
              easy to see: recurring consumption pricing, clear enterprise ROI claims, fast deployment proofs, and
              enough fresh capital to keep building without immediate financing pressure. The weak side is equally
              clear: even at a $4 billion valuation, the company has not disclosed absolute revenue, ARR, ACV, CAC,
              gross margin, burn, cash balance, or meaningful cap-table detail. Globes was already highlighting the
              speed of valuation inflation and investor pressure for another round in March 2025, and Reuters still
              reported only directional growth metrics in December 2025. That does not prove Eon is overvalued, but it
              does mean a public-source investor cannot test whether the company has best-in-class infrastructure
              economics or merely a best-in-class narrative. The chapter verdict is therefore cautious. Revenue quality
              looks better than average for a young private infrastructure vendor, capital intensity looks lower than
              appliance peers, and customer value appears real. Fair-value confidence, however, should remain low until
              management provides a full revenue bridge, cohort table, gross-margin build, and a cash-and-burn plan.
