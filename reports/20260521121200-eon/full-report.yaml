  - id: TV005
    title: Thesis-Break Triggers and Kill Criteria
    columns:
      - Trigger
      - Threshold
      - Transmission to Investment Thesis
      - Action Implication
    rows:
      - - AWS revokes third-party EBS/RDS snapshot API access
        - AWS policy change or Terms of Service amendment restricting read-only IAM snapshot access for ISVs
        - >-
          Eon's entire agentless architecture relies on this API vector; loss would require multi-year re-architecture
          or exit
        - 'Immediate hold: full diligence freeze pending architectural re-assessment'
      - - Revenue growth decelerates below 50% YoY for two consecutive quarters
        - ARR growth < 50% YoY confirmed in two consecutive reporting periods
        - At sub-50% growth a 10x+ ARR multiple becomes very difficult to support against public comps at 6–9x
        - Downgrade to AVOID; valuation now clearly stretched with no premium path to exit
      - - Confirmed at-scale ransomware breach affecting backup data stored in Eon platform
        - Security incident requiring customer notification under NIS2/DORA/CCPA reporting windows
        - Core product promise (reliable, clean recovery copy) is invalidated; churn risk and brand impairment
        - Immediate AVOID; monitor for customer churn and regulatory enforcement actions
      - - Named top-3 customer churn or public contract cancellation
        - Departure of any of the company's publicly named enterprise anchor accounts (e.g., SoFi)
        - With 'few tens' of large enterprise customers, a single large departure is a material revenue event
        - Place on WATCH; trigger independent customer interview program
      - - 'Competitive feature parity: Rubrik or Cohesity release CBPM-equivalent product'
        - >-
          GA announcement of automated cloud backup posture management by a scaled competitor at comparable or lower
          price point
        - Eon's differentiation collapses; competitive moat narrows to team and go-to-market speed
        - Downgrade to RESEARCH-MORE; assess customer switching costs and Eon's product roadmap lead
    notes: >
      Thresholds are qualitative except where numerical values are stated. None of the kill triggers has been activated
      as of the 2026-05-21 runDate.
    claimRefs:
      - CV007
      - CV025
      - CV037
      - CV041
      - CV042
  - id: TV006
    title: Final Diligence Asks
    columns:
      - Topic
      - Missing Evidence
      - Why It Matters
      - Owner / Diligence Path
    rows:
      - - ARR and NRR
        - Current ARR figure, quarterly net-new ARR, and net revenue retention by cohort
        - Without ARR the $4B valuation is ununderwritable; NRR determines whether growth is organic or land-only
        - Data-room request; audited management accounts or board-level reporting package
      - - Cap-table and preference stack
        - >-
          Full cap-table showing liquidation preferences, participation rights, anti-dilution provisions, and pro-rata
          rights by investor
        - >-
          In a sub-$4B exit scenario investor preferences could eliminate common equity returns; investor protection
          stack from 5 rounds in 24 months is likely complex
        - Data-room request; cap-table model from legal counsel
      - - Burn rate and runway
        - Monthly gross and net burn, cash balance as of Q1 2026, and implied runway at current rate
        - >-
          At $497M total raised, a $4B valuation implies significant cash deployment; burn profile determines how long
          the company operates without another round
        - Data-room request; CFO interview; bank statement confirmation
      - - AWS dependency contractual terms
        - >-
          Written API access agreements, MSA amendments, or AWS Marketplace contract terms governing snapshot API
          continuity
        - >-
          Policy risk is the #1 architectural kill criterion; written agreements or SLA commitments would partially
          mitigate
        - Legal review of AWS ISV agreement; direct AWS BD relationship confirmation
      - - FedRAMP and EU regulatory roadmap
        - >-
          FedRAMP authorization status or timeline; GDPR DPA agreements; DORA Article 30 compliance roadmap for EU
          financial-sector customers
        - >-
          FedRAMP absence closes US federal TAM; DORA non-compliance creates enterprise churn risk in EU financial
          sector
        - Compliance team interview; regulatory roadmap documentation; SOC 2 Type 2 report
      - - Customer reference program
        - >-
          Minimum 5 named enterprise customer references willing to discuss deployment scope, NRR, and competitive
          evaluation process
        - >-
          With a 'few tens' of customers, reference quality is the primary proxy for customer quality and retention;
          each reference is a material data point
        - Customer reference calls via introducer; independent Gartner Peer Insights / G2 review audit
    notes: >
      Diligence asks are ordered by materiality to the investment decision. Items 1–3 are blocking; items 4–6 are highly
      material but could proceed in parallel with negotiation of terms.
    claimRefs:
      - CV037
      - CV046
      - CV047
      - CV048
      - CV049
