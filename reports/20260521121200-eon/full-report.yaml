              - CE044
      - number: '5.6'
        title: Product and Evidence Gaps
        blocks:
          - type: paragraph
            body: >-
              Three material evidence gaps limit diligence confidence. First, all compliance credentials are
              self-asserted with no external audit reports discoverable through public research; this creates
              procurement friction in regulated verticals and is the most frequently cited risk factor for enterprise
              backup vendors at late-stage growth rounds. Second, no public status page, uptime SLA, or incident history
              exists for Eon's SaaS platform — unusual for a mission-critical backup infrastructure vendor and a flag
              for enterprise SRE teams evaluating vendor operational maturity. Third, the developer documentation at
              docs.eon.io is login-gated, preventing external evaluation of API quality, error handling, or SDK
              completeness. Developer signal from GitHub is early-stage: the Terraform provider
              (eon-io/terraform-provider-eon) has four GitHub stars and one fork, and the Go SDK (eon-io/eon-sdk-go) has
              two stars — both consistent with a product in initial developer adoption rather than a mature open
              ecosystem. The Eon AI Agent launched in May 2026 carries inherent LLM-system risks including
              hallucination, prompt injection exposure, and inconsistent SQL generation accuracy over backup schemas; no
              published accuracy benchmarks or error-rate data exist. Investors should monitor closure of the
              audit-report gap (SOC 2 Type II), publication of a public SLA document, and developer ecosystem growth
              signals as leading indicators of enterprise readiness before next-round diligence.
            claimRefs:
              - CE017
              - CE031
              - CE037
              - CE040
              - CE044
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base and Segmentation
        blocks:
          - type: paragraph
            body: >
              Eon targets large, cloud-native enterprises as its primary buyer, focusing on organizations with
              significant multi-cloud infrastructure footprints, regulatory compliance requirements, and the desire to
              activate dormant backup data for AI and analytics. As of May 2026, all publicly named Eon customers are
              large enterprises operating on AWS or Google Cloud, with no on-premises or SMB deployments publicly
              identified.

              The vertical composition of Eon's customer base, as evidenced by published case studies and third-party
              review platform data, spans at least six distinct sectors: financial technology (SoFi, NASDAQ-listed,
              5,000+ employees), market intelligence and enterprise AI (AlphaSense, serving more than 6,500 enterprise
              clients), industrial services (Sigdo Koppers, 10,000+ employees, Chilean multinational), networking
              equipment (NETGEAR, global enterprise), enterprise SaaS (StructuredWeb), and property management SaaS
              (Innago). PeerSpot analytics as of May 2026 show that financial services (14%) and insurance (34%)
              together account for nearly half of Eon's review-platform engagement traffic, confirming that regulated
              verticals dominate the buyer mix.

              The buyer persona is typically an IT infrastructure leader, DevOps director, or cloud architect at a
              regulated enterprise, responsible for backup compliance, disaster recovery SLAs, and increasingly for
              unlocking data for AI initiatives. The payer is the enterprise IT budget owner, sometimes requiring
              CFO-level sign-off as evidenced by the Sigdo Koppers procurement process. Users span IT operations,
              security teams, and data analysts who interact with search, restore, and analytics capabilities.
              Geographic distribution is global but U.S.-centric, with U.S. customers including SoFi, AlphaSense,
              NETGEAR, and StructuredWeb, and international customers including Sigdo Koppers (Chile, Google Cloud).
