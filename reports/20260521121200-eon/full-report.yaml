  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Risks
        blocks:
          - type: paragraph
            body: "Eon operates under a multi-layered regulatory risk profile spanning three jurisdictions: the European Union, the United States, and Israel. As a cloud backup processor for enterprise customers holding personal and financial data, Eon is directly subject to the EU General Data Protection Regulation (GDPR), which imposes binding data protection obligations on any entity processing EU residents’ data regardless of the entity’s geographic location. GDPR enforcement has become materially more aggressive: cumulative fines across the EU reached €7.1 billion by early 2026, with €1.2 billion imposed in 2025 alone according to DLA Piper’s annual survey, and cloud processors now represent a significant fraction of enforcement targets.\n\nTwo major EU frameworks create parallel compliance barriers for Eon’s customers and indirectly constrain Eon’s procurement eligibility. The NIS2 Directive, which required transposition by member states by October\_17, 2024, now imposes mandatory incident reporting, security governance, and supply-chain risk management on covered entities in critical sectors. Any EU enterprise customer in scope for NIS2 that uses Eon must satisfy its national supervisory body that Eon meets the applicable security and contractual standards. The Digital Operational Resilience Act (DORA), effective January\_17, 2025, goes further for EU financial entities: it mandates explicit contractual rights over ICT third-party providers, mandatory exit plans, and concentration risk management requirements that directly reach Eon as a cloud backup vendor serving banks, insurers, and investment firms.\n\nIn the United States, Eon’s most immediately revenue-limiting regulatory gap is FedRAMP authorisation. Rubrik achieved FedRAMP authorisation in 2023, enabling it to compete for US federal agency backup contracts. Eon has not disclosed a FedRAMP roadmap, effectively excluding it from a US government cloud market estimated at over $5\_billion in annual infrastructure spend. No enforcement actions, SEC investigations, or patent litigation against Eon are publicly documented as of May 2026; however, IP risk from incumbents asserting patents on backup deduplication, incremental snapshot, or indexing methods is non-trivial given the concentrated patent portfolios of Rubrik, Cohesity, and Commvault. Israel-specific legal risk centres on Innovation Authority (IIA) grant covenants that may restrict IP transfer, manufacturing, and cross-border licensing if Eon received IIA-funded R&D support."
