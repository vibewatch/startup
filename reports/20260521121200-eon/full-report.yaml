      - number: '8.4'
        title: Final Diligence Asks and Open Evidence Gaps
        blocks:
          - type: paragraph
            body: >
              Six evidence gaps block a conviction recommendation. First, Eon has not disclosed ARR, NRR, CAC, LTV,
              gross margin, or operating burn rate; without these, the $4 billion valuation is structurally unverifiable
              against any comp set. Second, the cap-table structure from five rapid rounds is opaque—liquidation
              preference stack, anti-dilution provisions, and investor participation rights are all unknown and could
              significantly alter common-equity returns in a sale scenario below $4 billion. Third, the SentinelOne
              strategic equity investment made in conjunction with the RSAC March 2026 partnership announcement raises
              undisclosed conflict-of-interest and governance questions that require clarification. Fourth, FedRAMP
              authorization status is unconfirmed; if Eon lacks a credible FedRAMP roadmap by 2027, US federal and
              regulated financial-sector TAM is effectively closed. Fifth, Israel Innovation Authority grant exposure
              (if any) would impose IP-transfer restrictions that affect M&A pricing. Sixth, no third-party penetration
              test report or SOC 2 Type 2 attestation specific to the AI Agent has been released, leaving a
              security-assurance gap for highly regulated customers. Each of these items should be resolved through a
              formal data-room review before any entry at or above the current round valuation.
