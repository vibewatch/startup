      - number: '4.1'
        title: Revenue model, pricing, and monetization routes
        blocks:
          - type: paragraph
            body: >-
              Eon's public commercial model is clear at the list-price level and opaque almost everywhere else. The
              company prices its service on a per-GB-per-month basis and frames contracts as flexible spending
              commitments sized to expected backup growth rather than as appliance purchases or seat licenses. That
              lines up with what the product actually is: a fully managed SaaS service with no customer-run backup
              infrastructure, no agents, and no appliances. Financially, that matters because it makes Eon look more
              like a recurring cloud service than a traditional backup vendor with hardware-heavy deployment costs.
              Public materials also point to more than one monetization path. The core recurring bill is backup storage
              consumption, but Eon is also selling a control plane for backup posture management and an analytics layer
              that makes backup data queryable in BigQuery and other tools. Distribution is increasingly channel-enabled
              as well: management says customers want marketplace procurement, the Google Cloud partnership formalized
              marketplace support, and partner economics are generous enough that resellers can earn roughly a quarter
              of deal value back. The missing piece is realized pricing. Public materials do not disclose discounting,
              minimum commitments, ACV, or how much revenue comes from core backup versus analytics expansion.
