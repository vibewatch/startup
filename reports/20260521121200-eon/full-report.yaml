      - number: '5.5'
        title: Trust, Security, and Compliance
        blocks:
          - type: paragraph
            body: >-
              Eon's compliance positioning claims alignment with GDPR Article 32 data protection requirements, HIPAA
              administrative and technical safeguard provisions, PCI-DSS backup integrity controls, ISO 27001
              information security management system requirements, SOC 2 Trust Services Criteria, and all five NIST CSF
              pillars (Identify, Protect, Detect, Respond, Recover). Technical controls confirmed through public sources
              include WORM/Object Lock-enforced immutability at the cloud storage layer, logical air-gapping via
              immutable vaults, RBAC with role hierarchies manageable via Terraform, SAML and SSO federation (Okta
              confirmed in the Terraform provider), and single- tenant account and VPC isolation per customer. However,
              no public SOC 2 Type II audit report, PCI Attestation of Compliance, ISO 27001 certificate, or HIPAA
              Business Associate Agreement template has been located through external research. Every compliance claim
              in this chapter is sourced exclusively from Eon's own blog posts and marketing pages, constituting vendor
              self- assertion rather than independent third-party assurance. This is a material evidence gap that will
              surface as a standard ask in enterprise procurement due diligence at Eon's Series D price point,
              particularly from buyers in regulated verticals such as financial services and healthcare.
            claimRefs:
              - CE019
              - CE030
              - CE031
              - CE039
              - CE044
          - type: table
            tableRef: TE004
            claimRefs:
              - CE030
