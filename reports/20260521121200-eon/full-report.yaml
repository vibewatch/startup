      - number: '8.2'
        title: Valuation Context, Financing Structure, and Comparable Set
        blocks:
          - type: paragraph
            body: >
              Eon entered the Series D at a $4 billion post-money valuation with Elad Gil of Gil Capital leading and all
              major prior investors returning: Sequoia Capital, Lightspeed Venture Partners, Greenoaks, and BOND. The
              round tripled valuation from the $1.4 billion Series C mark reached less than twelve months earlier, and
              brought total capital raised to approximately $497 million. Elad Gil is a noted angel and seed-stage
              investor with portfolio companies including Airbnb, Stripe, and GitHub, lending a credibility signal. The
              rapid escalation from $215 million (Seed) to $4 billion (Series D) in under two years reflects top-decile
              venture momentum.

              Three public comparables anchor the valuation framework. Rubrik (NYSE: RBRK), the most direct structural
              analog, reported fiscal 2026 subscription ARR of $1.46 billion (34% YoY growth) and FY2026 revenue of
              $1.32 billion; at a May 2026 market capitalization of approximately $12–13 billion its implied EV/ARR
              multiple is 8–9x. Veeam, still private, was marked at $15 billion in a December 2024 secondary sale on
              $1.7 billion ARR, implying ~8.8x ARR. Commvault (Nasdaq: CVLT), a more mature data-protection platform,
              reported FY2026 ARR of $1.12 billion at a market capitalization of approximately $4.5–5 billion, implying
              ~4–4.5x ARR. The median public SaaS EV/ARR multiple across all sectors is 6–7x as of May 2026 per
              Multiples.vc, with cloud-security leaders at 8–12x and AI-native SaaS commanding select premiums.
              Strategic M&A has been more generous: Google's $32 billion acquisition of Wiz in early 2026 implied
              approximately 32x projected ARR, setting an extreme upper bound for platform-critical, cloud-native
              acquisitions. At Eon's $4 billion valuation, the company must sustain ARR of at least $300–400 million at
              a 10–13x multiple to be considered fairly priced—a figure that is plausible given the revenue-tripling
              trajectory but remains undisclosed and unverifiable.
