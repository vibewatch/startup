      - number: '6.2'
        title: Adoption Trajectory and Deployment Evidence
        blocks:
          - type: paragraph
            body: >
              Eon demonstrates rapid POC-to-production adoption timelines that are structurally faster than legacy
              incumbents, validating the agentless deployment architecture as a genuine sales accelerant. The typical
              deployment trajectory for AWS-native customers moves from initial conversation to full production in
              approximately two weeks. SoFi completed its full multi-region rollout across five AWS regions in roughly
              two weeks. AlphaSense, despite managing petabytes of AWS S3 data, completed its initial backup in three
              days and reached full production in 25 days. Sigdo Koppers deployed Eon on Google Cloud during an active
              infrastructure migration without slowing the migration itself.

              Adoption is driven by four primary use cases: replacing fragmented native cloud snapshots with a unified
              posture management layer; centralizing multi-cloud backup management across AWS, Azure, and Google Cloud;
              reducing cloud backup storage costs (typically 35–40% savings reported across case studies); and enabling
              analytics or AI on backup and archive data. Eon's 2025 State of Cloud Backup Report, surveying more than
              150 enterprise IT leaders, found that 79% were actively investing in or evaluating backup upgrades, 68%
              were interested in using backup data for AI or business intelligence, 81% saw value in queryable
              analytics-ready backups, and 51% still relied on manual or semi-automated processes—directly validating
              the addressable replacement opportunity.

              Management described 2025 customer traction as "explosive" in the Series D press release (December 2,
              2025), accompanied by the claim that revenue more than tripled during the year. The total customer base
              remains described as "a few tens of large enterprise customers," consistent with a company that had been
              commercially operating for barely 18 months at the time of the Series D. The consistent pattern across all
              published case studies—rapid deployment, measurable ROI within the first year, and confirmed expansion
              plans—suggests strong initial product-market fit in the large-enterprise cloud infrastructure segment.
