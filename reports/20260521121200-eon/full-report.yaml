        title: Public traction and sales-efficiency proxies
        blocks:
          - type: paragraph
            body: >-
              The best public financial evidence for Eon is indirect: customer outcomes, deployment speed, and
              management commentary. Reuters reported that revenue more than tripled and that Eon serves a few tens of
              large enterprise customers, including SoFi, but absolute revenue is still undisclosed. Customer references
              are materially stronger than the raw count suggests. Eon repeatedly claims 30% to 50% storage-cost
              savings, the customers page highlights a more-than-100% first-year ROI example, NETGEAR reports a 35% cost
              reduction plus 88% faster recovery on a 10TB SQL Server database, Google Cloud cites 90% faster recovery
