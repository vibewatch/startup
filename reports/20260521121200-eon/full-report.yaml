      - number: '6.5'
        title: Expansion, Concentration, and Procurement Friction
        blocks:
          - type: paragraph
            body: >
              Eon's land-and-expand motion is structurally embedded in its consumption pricing architecture. As cloud
              data volumes grow, backup spend on Eon grows proportionally. Beyond organic volume expansion, the platform
              offers natural footprint expansion through multi-cloud coverage (a customer starting on AWS can add Azure
              and Google Cloud workloads) and the data lake activation use case (customers that initially buy for backup
              compliance often expand into AI and analytics workloads). The Eon AI Agent, launched May 2026, adds a new
              expansion surface for existing customers by enabling natural-language querying of backup and archive data
              without additional infrastructure.

              Customer concentration is a material risk given the reported base of "a few tens" of large enterprises.
              Without knowing the revenue distribution across accounts, the loss of any single large account could have
              a disproportionate financial impact. Eon has published only five detailed case studies, suggesting the
              proof corpus remains limited relative to category incumbents with thousands of documented deployments.

              Procurement friction is moderate to high in Eon's target enterprise segment. The Sigdo Koppers case study
              documents a CFO-led decision process requiring monthly cross-company IT leadership meetings, suggesting
              enterprise sales cycles spanning several months even for accounts ultimately convinced of the ROI case.
              Eon has mitigated some procurement friction through cloud marketplace availability: the product is listed
              on AWS Marketplace as a SaaS product eligible for AWS Private Pricing Agreement (PPA) commitments,
              enabling enterprises to count Eon spending toward their pre-committed AWS budget. Azure Marketplace and
              Google Cloud Marketplace listings further reduce procurement friction for cloud-committed buyers. AWS
              Marketplace also offers PNC Vendor Finance line-of-credit options for eligible U.S. purchasers. No
              confirmed reseller, VAR, or MSP channel program at scale is documented in public evidence as of May 2026,
              which could limit reach into non-hyperscaler-aligned or mid-market enterprise accounts.
