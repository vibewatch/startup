      - number: '6.3'
        title: Named Customer Proof
        blocks:
          - type: paragraph
            body: >
              Eon has published five fully detailed case studies as of May 2026, covering production deployments across
              five distinct enterprise verticals plus a sixth named testimonial (Innago). All confirmed deployments are
              production-grade rather than pilot or POC, with quantified operational outcomes rather than directional
              testimonials alone.

              SoFi (NASDAQ: SOFI), the cloud-native financial institution with more than 5,000 employees, is Eon's most
              prominently featured reference customer. SoFi deployed Eon across five AWS regions in approximately two
              weeks, achieving greater than 100% ROI in the first year. Recovery time dropped from a full day to
              minutes; data preparation time improved by more than 90%. The named reference is CJ Keefe, Director of
              Corporate Infrastructure, DevOps, and SRE, who was quoted at AWS re:Invent 2025.

              AlphaSense, an AI-powered market intelligence platform serving more than 6,500 enterprise customers
              including most of the S&P 100, chose Eon to protect petabytes of proprietary and customer-uploaded AWS
              data. The deployment completed initial backup in three days and reached full production in 25 days, with
              alignment to SOC-grade and regulated-industry compliance expectations.

              NETGEAR, the global networking equipment manufacturer, achieved a 35% reduction in backup storage costs
              and an 88% acceleration in recovery time for a 10TB mission-critical SQL Server database, reducing
              recovery from 24 hours to under three hours. The named reference is Satish Nair, Sr. Manager IT.

              Sigdo Koppers, a Chilean industrial conglomerate with more than 10,000 employees, deployed Eon on Google
              Cloud during an active infrastructure migration. The deployment achieved approximately 38% lower projected
              backup cost versus native GCP snapshots and reduced restore time for a critical financial system from
              approximately two days to a few hours. The named reference is Alejandro Zuniga, IT and Security Architect,
              SK Converge.

              StructuredWeb reduced backup restore retrieval time by 98%, cut IT manual classification effort by 20%,
              achieved compliance within 30 days, and estimated 40% annual savings in storage and restoration costs. CEO
              Daniel Nissan provided a named quote. Innago, a property management SaaS platform on AWS EKS, saved 40% on
              backup costs and reduced restore times to 10–15 minutes.

              Evidence freshness is high: SoFi's reference was featured at AWS re:Invent 2025 in December 2025, and case
              studies for AlphaSense, NETGEAR, and Innago were published in the 2025–2026 timeframe. Google Cloud
              independently published Eon as a customer success story, documenting 90% improvement in data recovery time
              and 30–50% cost reduction in GCP deployments. Adverse signals: Eon's AWS Marketplace listing had zero
              customer reviews as of May 2026, and PeerSpot mindshare at 0.7% (down from 0.9% year-over-year) indicates
