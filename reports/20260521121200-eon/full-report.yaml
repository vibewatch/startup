      - number: '3.2'
        title: 'Incumbent Profiles: Scale, Strategy, and Direction'
        blocks:
          - type: paragraph
            body: >
              Rubrik (NYSE: RBRK) is the most direct comparable to Eon's target market and the benchmark for investor
              expectations. In Q4 FY2026 (ending January 2026), Rubrik reported subscription ARR of $1.46 billion (34%
              year-over-year growth), cloud ARR of $1.29 billion (88% of subscription ARR), 2,805 customers with $100K+
              subscription ARR (up 25%), non-GAAP gross margin of 84%, and net revenue retention above 120%. Free cash
              flow of $238 million for FY2026 represents a 10x improvement, and Rubrik holds $1.7 billion in cash.
              Rubrik's strategic direction is unmistakably toward cyber resilience and zero-trust data security, with
              identity resilience comprising 33%+ of net new ARR and AI-driven threat analytics as the core platform
              differentiation. Its concern is a stock trading approximately 50% below its 52-week high in early 2026,
              with analysts flagging deceleration risk as the installed base matures and new entrants like CrowdStrike
              push into the same data security territory.

              Cohesity transformed from a scale-out backup appliance vendor into the largest enterprise data protection
              player globally after completing its $3 billion acquisition of Veritas's data protection business
              (NetBackup and Alta) in December 2024. Combined ARR is $1.5 billion, the customer base exceeds 12,000
              organizations, and Fortune 100 coverage reaches 96%. Cohesity's $8 billion valuation (April 2025, post
              Series H at $7 billion with $1.1 billion raised) reflects strategic investor confidence from IBM (which
              integrated Cohesity exclusively into IBM Storage Defender) and NVIDIA (which backs its Gaia AI platform).
              Cohesity targets an IPO in 2026 aiming for Rubrik's market cap, but faces the acute integration challenge
              of migrating legacy NetBackup customers to DataProtect at scale. Its primary competitive message is
              breadth—on-premises, cloud, and SaaS data managed from one platform—which is the antithesis of Eon's pure
              cloud-native posture.

              Veeam Software reported $1.7 billion in ARR (18% year-over-year growth) as of late 2024, serving over
              550,000 organizations including 77% of the Fortune 500. Insight Partners holds a majority stake after its
              2020 $5 billion acquisition; a December 2024 $2 billion secondary sale valued Veeam at $15 billion. Veeam
              earned Gartner Peer Insights 2026 Customers' Choice recognition with a 4.8/5 rating and 98% willingness to
              recommend. At VeeamON 2026 in May, Veeam launched the DataAI Command Platform, positioning itself as a
              "data and AI trust company" with 300+ connectors, AI-native governance, and natural language query across
              backup data—a direct overlap with Eon's data activation theme. Veeam Data Platform v13.1 (targeted Q3
              2026) adds post-quantum cryptography and OpenShift Virtualization support. Veeam's moat is its
              unparalleled installed base and channel depth; its weakness relative to Eon is a software-defined hybrid
              architecture that requires customer infrastructure and configuration.

              Commvault (NYSE: CVLT) reported FY2026 (ending March 2026) total revenue of $1.18 billion (19%
              year-over-year), total ARR of $1.12 billion (21% growth), and SaaS ARR of $400 million (42% growth). Its
              Commvault Cloud Unity platform unifies data security, cyber recovery, and identity resilience across
              hybrid, multi-cloud, and on-premises environments. Cross-sell momentum is strong—48% of managed SaaS
              customers use multiple offerings—but one channel partner accounts for approximately 32% of total revenue,
              representing a concentration risk. Gross margin is approximately 81-82% with non-GAAP EBIT of ~20%.
              Commvault's strategic pivot to SaaS is progressing but is the slowest among the incumbents; its highest
              switching cost among all vendors (complex multi-year contracts and deep platform integration) works both
              for and against Eon: Commvault accounts are hard to dislodge but also hard to expand beyond the backup
              perimeter Commvault already owns.

              Druva is the most architecturally similar competitor to Eon: a fully managed, 100% SaaS, no-hardware
              platform focused on cloud-native workload protection. However, Druva's product scope targets endpoints,
              Microsoft 365, and traditional server workloads rather than cloud infrastructure CBPM. Its estimated 2026
              ARR of $259–273 million, approximately 4,000+ enterprise customers including 65+ Fortune 500 accounts,
              $475 million total raised, and $2 billion valuation position it as a mid-market SaaS specialist. Druva
              does not offer data lake activation or zero-ETL analytics capability, and its lack of cloud infrastructure
              posture management makes it a partial substitute rather than a direct competitor.
