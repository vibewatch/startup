companyProfile:
  summary: >
    Eon (incorporated as EON IO, INC.) is a New York- and Tel Aviv-based enterprise cloud infrastructure company founded
    in January 2024 by three AWS veterans who previously built and sold CloudEndure to Amazon for approximately $200
    million. Its Cloud Backup Posture Management (CBPM) platform provides agentless, multi-cloud backup protection
