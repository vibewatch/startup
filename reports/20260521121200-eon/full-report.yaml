      - number: '5.3'
        title: Integrations, Deployment, and Product Roadmap
        blocks:
          - type: paragraph
            body: >-
              Eon's publicly listed integration catalog spans 33 named tools across six categories. Analytics
              integrations include BigQuery, Snowflake, Databricks, Apache Spark, Amazon EMR, Amazon Redshift, Lake
              Formation, AWS Glue, Microsoft Fabric, and Presto/Trino — ten platforms covering all major cloud and
              independent analytics engines. AI and LLM integrations include Vertex AI, Amazon Bedrock, and OpenAI.
              Security and SIEM integrations include AWS Security Hub, Splunk, AWS CloudTrail, Microsoft Sentinel, and
              an event streaming API. DevOps integrations include a Terraform provider, Go SDK, CLI, Amazon SNS, Amazon
              SQS, and Azure Service Bus. ITSM and notification platforms include Slack, Microsoft Teams, ServiceNow,
              PagerDuty, Opsgenie, and Jira. Threat-detection integrations include Amazon GuardDuty, Microsoft Azure
              Defender, and SentinelOne. Deployment is fully SaaS: customers grant a read-only IAM role and optionally
              configure SAML SSO. The Terraform provider (github.com/eon-io/terraform-provider-eon) supports IaC
              management of source accounts, restore accounts, backup policies, RBAC roles, and IDP group mappings for
              Okta and SAML providers; it has four GitHub stars and one fork as of May 2026. The Go SDK
              (github.com/eon-io/eon-sdk-go) is auto-generated from an OpenAPI specification. No multi- quarter public
              product roadmap has been published; the visible roadmap is inferred from announcement history and the Eon
              news page. The Eon AI Agent and MCP/A2A connectors, both launched in May 2026, represent the most recent
              platform additions. Eon's pricing page does not publish per-unit or tiered pricing, indicating a sales-led
              enterprise motion.
