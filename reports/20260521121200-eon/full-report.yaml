      - number: '2.2'
        title: Market Sizing — TAM, SAM, and Contradictory Estimates
        blocks:
          - type: paragraph
            body: >-
              Analyst coverage of the cloud backup market yields wide estimate ranges that must be treated as fuzzy
              proxies rather than precise figures. In 2026, Mordor Intelligence places the cloud backup market at
              $7.13B; the Business Research Company estimates $9.41B; Fortune Business Insights estimates $8.73B—a 32%
              spread. All three converge on roughly 24–26% CAGR through 2030–2031. The divergence reflects different
              scope definitions: Mordor focuses on cloud-delivered backup services, while BRC includes cloud backup
              storage products sold by hardware vendors. This contradiction is material for sizing Eon's opportunity and
              should be preserved rather than resolved arbitrarily.


              The serviceable addressable market (SAM) narrows to enterprise multi-cloud environments where CBPM
              automation delivers ROI above substitutes. Eon's own launch materials cite that enterprises estimate
              10–30% of their total cloud bill goes to backup storage and management, implying an SAM correlated with
              cloud infrastructure spend rather than with a fixed market-research figure. If global cloud infrastructure
              reaches $838B by 2034 (as cited in Eon's launch PR), a 10–30% backup spend fraction implies a potential
              SAM of $84B–$251B by 2034—dwarfing the narrow cloud backup market but requiring acceptance of Eon's own
              estimate of enterprise spend behaviour.


              The enterprise backup and recovery software market ($13.06B in 2026, Fortune BI) and the broader
              enterprise backup and recovery system market ($18.8B in 2026, GlobalGrowthInsights) represent a larger
              adjacent TAM at a slower 8–11% CAGR. The ransomware protection market ($30.04B in 2026, Mordor) and the
              broader data protection market ($199.32B in 2026, Fortune BI) are substantially larger but only partially
              addressable by a backup-layer product. A serviceable obtainable market (SOM) for Eon in the 2026–2029
              timeframe is plausibly $3B–$8B, representing the enterprise cloud-native segment with 500+ cloud resources
              and active CBPM adoption—but this figure is inferred, not analyst-confirmed.
