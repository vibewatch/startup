  - id: retention-durability
    title: "Retention, Durability, and Satisfaction"
    body: >
      Eon does not publicly disclose net revenue retention (NRR), gross revenue retention (GRR),
      annual churn rates, cohort retention data, or customer satisfaction scores as of May 2026.
      This is consistent with the company's early stage and private disclosure posture, but it
      represents a significant gap for investors assessing customer durability.

      Indirect retention evidence is directionally positive but narrow. Sigdo Koppers explicitly
      plans to migrate additional workloads to Google Cloud using Eon as the standard protection
      model, indicating active expansion rather than churn. SoFi plans to continue expanding
      Eon's backup coverage as its AWS footprint grows. AlphaSense is actively exploring
      leveraging broader platform capabilities beyond the initial backup use case. All three
      longitudinally documented accounts show expansion trajectories rather than contraction,
      suggesting that successful initial deployments lead to additional workload coverage without
      evidence of churn events in the public record.

      Eon's consumption-based pricing model (per-GB per-month) creates a structural mechanic
      for natural revenue expansion: as customer cloud data volumes grow, Eon's revenue from
      each account grows proportionally without requiring a new sales cycle. This is a favorable
      structure for NRR above 100%, common for data-infrastructure SaaS, but Eon provides no
      public confirmation of what its actual NRR is.

      Third-party satisfaction signals are sparse. PeerSpot reports Eon's mindshare in the Cloud
      Backup category at 0.7% as of May 2026, down from 0.9% the prior year, a signal of
      limited community-level adoption growth relative to the market opportunity and competitive
      set. SourceForge lists Eon with minimal review volume, and AWS Marketplace shows zero
      independent customer reviews as of May 2026. These absences likely reflect the company's
      early commercial stage and enterprise-focused go-to-market, which tends to generate fewer
      anonymous public reviews than mid-market or SMB vendors, but they leave significant
      independent corroboration gaps for retention and satisfaction claims.
