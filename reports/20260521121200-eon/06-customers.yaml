    title: "Consumption pricing embeds land-and-expand mechanics in every contract"
    body: "Per-GB-per-month pricing automatically expands revenue as enterprise data volumes grow without requiring a new sales cycle. Three of five longitudinally documented accounts (SoFi, Sigdo Koppers, AlphaSense) have confirmed plans to expand usage, suggesting the consumption model produces net-expansion dynamics across the customer base."
