chapter:
  number: 6
  title: "Customers"
  summary: "Eon's commercial customer base spans at least six enterprise verticals—financial technology, market intelligence, industrial services, networking equipment, enterprise SaaS, and property management—with all publicly named accounts being cloud-native large enterprises deploying on AWS or Google Cloud. Five fully documented case studies (SoFi, AlphaSense, Sigdo Koppers, NETGEAR, StructuredWeb) confirm production deployments with quantified outcomes including >100% ROI, 35–40% cost savings, and recovery time improvements of 88–98%. The total customer base is described as 'a few tens' of large enterprises, creating material customer concentration risk; no NRR, GRR, or cohort retention data is publicly available."

sections:
  - id: customer-base-segmentation
    title: "Customer Base and Segmentation"
    body: >
      Eon targets large, cloud-native enterprises as its primary buyer, focusing on organizations
      with significant multi-cloud infrastructure footprints, regulatory compliance requirements,
      and the desire to activate dormant backup data for AI and analytics. As of May 2026, all
      publicly named Eon customers are large enterprises operating on AWS or Google Cloud, with
      no on-premises or SMB deployments publicly identified.

      The vertical composition of Eon's customer base, as evidenced by published case studies
      and third-party review platform data, spans at least six distinct sectors: financial
      technology (SoFi, NASDAQ-listed, 5,000+ employees), market intelligence and enterprise AI
      (AlphaSense, serving more than 6,500 enterprise clients), industrial services (Sigdo
      Koppers, 10,000+ employees, Chilean multinational), networking equipment (NETGEAR, global
      enterprise), enterprise SaaS (StructuredWeb), and property management SaaS (Innago).
      PeerSpot analytics as of May 2026 show that financial services (14%) and insurance (34%)
      together account for nearly half of Eon's review-platform engagement traffic, confirming
      that regulated verticals dominate the buyer mix.

      The buyer persona is typically an IT infrastructure leader, DevOps director, or cloud
      architect at a regulated enterprise, responsible for backup compliance, disaster recovery
      SLAs, and increasingly for unlocking data for AI initiatives. The payer is the enterprise
      IT budget owner, sometimes requiring CFO-level sign-off as evidenced by the Sigdo Koppers
      procurement process. Users span IT operations, security teams, and data analysts who
      interact with search, restore, and analytics capabilities. Geographic distribution is
      global but U.S.-centric, with U.S. customers including SoFi, AlphaSense, NETGEAR, and
      StructuredWeb, and international customers including Sigdo Koppers (Chile, Google Cloud).
