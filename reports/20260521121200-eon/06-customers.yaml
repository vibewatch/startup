    title: "Customer concentration risk and absent retention metrics"
    body: "With a total customer base of 'a few tens' of large enterprises and no public NRR, GRR, or churn data, Eon's customer durability is unverifiable from public sources. A small account base creates outsized concentration risk; any single churn event is potentially material. PeerSpot mindshare at 0.7% (declining) and zero AWS Marketplace reviews indicate limited independent market validation at scale."
    claimRefs:
