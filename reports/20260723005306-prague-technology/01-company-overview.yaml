callouts:
  - calloutType: "strength"
    title: "Elite Founder Pedigree at Record Valuation"
    body: "Lin Junyang's track record building Alibaba Qwen into a 1-billion-download open-source LLM family represents arguably the strongest founder-market fit in China's embodied AI sector. His combination of linguistics, NLP, multimodal, and agentic AI expertise directly maps to the world-model and embodied-brain thesis. The $2B valuation before any product reflects institutional consensus on this asymmetric bet."
    claimRefs: [CO012, CO015, CO017]

  - calloutType: "risk"
    title: "No Product, Revenue, or Disclosed Roadmap — Stealth Pre-Product Stage"
    body: "As of July 2026, Prague Technology has no product, no customers, no revenue, no public website, and no disclosed technical roadmap. The company's entire investment case rests on founder credibility and an unverified technical thesis. The 18-month window to demonstrate meaningful progress is cited by investors as critical to sustaining valuation."
    claimRefs: [CO024, CO025, CO031]

  - calloutType: "risk"
    title: "Sole Founder Dependency and Small Initial Team"
    body: "Lin Junyang holds 99% of shares in the primary entity and is the only publicly named executive. The founding team is described as 1–10 people. This level of key-person concentration—without disclosed co-founders, board members, or named senior hires—represents an abnormal governance risk for a $2 billion company."
    claimRefs: [CO008, CO023]

  - calloutType: "insight"
    title: "Naming as Strategic Signal: Pragmatics as Tech Philosophy"
    body: "Both company names—卜拉格 (Bulage, phonetic for 'Pragmatics') and 语用 (Yuyong, semantic translation of 'Pragmatics')—derive from the linguistic field of pragmatics: the study of how context shapes meaning. That Lin named both entities after this concept suggests an intentional brand thesis—AI that understands not just language structure but real-world context and intent, the precise requirement for embodied systems."
    claimRefs: [CO004, CO005, CO006]

