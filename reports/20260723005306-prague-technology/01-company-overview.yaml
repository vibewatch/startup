company:
  name: "Prague Technology"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Prague Technology (Shanghai Bulage Technology Co., Ltd.) is a Chinese AI startup founded in May–June 2026 by Lin Junyang, former technical head of Alibaba's Qwen LLM series and the youngest P10 executive in Alibaba history. The company raised ~$220 million at a $2 billion post-money valuation in its angel round from Gaorong Ventures, HongShan Capital, and Tencent, making it one of China's most highly valued pre-revenue AI startups. Its focus is on world models and embodied intelligence—AI capable of perceiving, reasoning, and acting in the physical world."

sections:
  - id: "identity-and-founding"
    title: "Identity and Founding"
    body: "Prague Technology is the English trade name for the AI lab founded by Lin Junyang in mid-2026 in Shanghai, China. The company operates under multiple legal entities: 上海卜拉格科技有限公司 (Shanghai Bulage Technology Co., Ltd.), registered on May 27, 2026, in which Lin holds 99% of shares and serves as executive director, general manager, and financial officer; and 语用（上海）科技有限公司 (Yuyong Shanghai Technology Co., Ltd.), registered May 13, 2026, in which Lin holds 100% of shares. A third entity, Shanghai Gewuzhiyong Management Consulting Partnership, is controlled through Bulage Technology. The names are deliberate linguistic wordplay: 卜拉格 (Bulage) is a phonetic transliteration of 'Pragmatics', while 语用 (Yuyong) is the semantic Chinese translation of 'Pragmatics'—both referencing the field of linguistic pragmatics that underpins Lin's academic background. The company is headquartered in Xuhui District, Shanghai. As of the report date (July 2026), the company has no official public website, no disclosed product, and no reported revenue. It has publicly disclosed its focus areas as world models and the 'embodied brain' for physical AI systems. Lin Junyang left Alibaba on March 3–4, 2026, following an internal restructuring meeting, posting 'me stepping down. bye my beloved qwen' on social media. He formed his startup entities in May–June 2026 after a brief period of reflection and strategic planning."
    claimRefs: [CO001, CO002, CO003, CO004, CO005, CO006, CO007]
    tableRefs: [TO001]
    figureRefs: [FO001]

  - id: "founder-and-leadership"
    title: "Founder and Leadership"
    body: "Lin Junyang (Justin Lin) is the sole publicly known founder and leader of Prague Technology. Born in 1993, he earned a bachelor's degree in English from the University of International Relations and a master's degree in linguistics and natural language processing from Peking University's School of Foreign Languages. In 2019 he joined Alibaba's DAMO Academy as a fresh graduate, initially working on NLP in search and recommendation scenarios and early multimodal projects including M6. At the end of 2022, Alibaba restructured its AI teams into the Tongyi Lab system, and Lin was appointed technical head of the Tongyi Qianwen (Qwen) series of large language models. Under his leadership, Qwen evolved from an internal project to one of the world's most-downloaded open-source LLM families, with over 1 billion downloads globally and more than 200,000 derivative models by early 2026. He became the youngest P10-level technical executive in Alibaba's history—a designation that marks the highest individual technical contributor rank. On March 3, 2026, he was informed of a proposed restructuring that would split the Qwen team into separate pre-training, post-training, text, image, and voice teams, removing its organizational independence. The following morning he announced his departure. In his subsequent essay 'From Reasoning Thinking to Agentic Thinking' he articulated his thesis that the next AI paradigm would center on agentic systems—AI that acts, not merely thinks. In October 2025, while still at Alibaba, he had begun forming a small internal team focused on robotics and embodied intelligence, anticipating this direction. The founding team beyond Lin is small—initially 1 to 10 people drawn from ByteDance, Tencent, and international backgrounds. No other named executives or board members have been publicly disclosed."
    claimRefs: [CO008, CO009, CO010, CO011, CO012, CO013, CO014, CO015]
    tableRefs: [TO002]
    figureRefs: [FO002]

  - id: "funding-and-investors"
    title: "Funding History and Investor Syndicate"
    body: "Prague Technology completed its first external financing round in June 2026, raising approximately $220 million at a post-money valuation of approximately $2 billion (RMB 13.5 billion). This is a record-level angel or seed-stage valuation for a Chinese AI startup in absolute dollar terms. The round was reported initially by The Information and confirmed by multiple Chinese and international sources. Lead investors were Gaorong Ventures (高榕创投) and HongShan Capital (红杉中国, formerly Sequoia China), each investing $100 million. Tencent joined as a strategic co-investor with $20 million. Immediately after completing this round, the company was reportedly seeking to initiate a new follow-on financing, according to two people familiar with the transactions. The funding trajectory reflects intense competition among top-tier Chinese VCs to secure early stakes in elite AI founders before formal product milestones exist. Gaorong Ventures is a major Shanghai-based VC managing over RMB 30 billion across 300+ companies, with strong AI and robotics focus including prior investments in Moonshot AI, XYZ Robotics, and autonomous driving companies. HongShan (formerly Sequoia China) manages $55 billion AUM across 1,500+ portfolio companies and has backed DeepSeek, Pony AI, X Square Robot, and global AI leaders including OpenAI and Anthropic. Tencent has invested in virtually every top Chinese AI startup circle including DeepSeek, MiniMax, and Zhipu. The syndicate signals institutional consensus that Lin Junyang's founder-market fit in world models and embodied intelligence justifies a multi-hundred-million-dollar bet before any product exists."
    claimRefs: [CO016, CO017, CO018, CO019, CO020, CO021, CO022, CO023, CO024]
    tableRefs: [TO003]
    figureRefs: [FO003]

  - id: "milestones-and-current-state"
    title: "Key Milestones and Current State"
    body: "Prague Technology's milestones are compressed into a short founding period. Lin Junyang departed Alibaba on March 3–4, 2026, after leading the Qwen team through Qwen 3.5 (a 397-billion-parameter MoE architecture). He published his strategic essay 'From Reasoning Thinking to Agentic Thinking' on March 26, 2026. In May 2026, The Information first reported he was fundraising at a $2 billion valuation. From May 13 to June 2026, he registered his corporate entities. By mid-June 2026 the angel round had closed. As of the report date of July 23, 2026, the company has disclosed no product, roadmap, website, or commercial partnership. It has no reported customers or revenue. The team is described as still in early formation and recruitment. The company has not staged any public demonstration, filed any patents under its new entity names, or published any technical research under the Prague Technology or Bulage brand. The company's maturity profile is that of an AI research lab at the pre-product stage: a founding team with elite credentials, committed capital, and a stated technical thesis, but no verified technical output under the new brand. The absence of a public website or press release suggests intentional stealth positioning consistent with a research-first strategy. Lin Junyang's March 2026 social media post advocating that 'multimodal foundation models are transforming into foundation agents, using tools and memory for long-term sequential reasoning through reinforcement learning' provides the clearest public statement of technical direction."
    claimRefs: [CO025, CO026, CO027, CO028, CO029, CO030, CO031, CO032]
    tableRefs: [TO004]

