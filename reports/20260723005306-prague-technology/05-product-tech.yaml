callouts:
  - calloutType: "strength"
    title: "Lin Junyang's Qwen Architecture Is Directly Applicable to World Model Development"
    body: "The Qwen3.5 MoE architecture with hybrid thinking modes, multimodal encoders, and large-scale distributed training is precisely the technical stack needed for world model development. This is not an analogous skill transfer; it is near-direct architectural translation. Prague has arguably the strongest technical founder background for this specific application in China."
    claimRefs: [CE006, CE007, CE008, CE009]

  - calloutType: "risk"
    title: "Technical Opacity Is a Complete Due Diligence Blocker"
    body: "Prague Technology has released zero technical artifacts in its first three months: no architecture paper, no blog post, no benchmark, no model card. While premature disclosure is a legitimate strategic choice, it means that the technical thesis cannot be independently validated. Any follow-on investment decision must obtain a technical memo or architecture brief from the company before committing capital."
    claimRefs: [CE029, CE030]

  - calloutType: "risk"
    title: "OEM Training Data Partnership Is the Hardest Technical Problem"
    body: "World models for embodied AI require diverse, large-scale real-robot interaction data to bridge the sim-to-real gap. Prague Technology has no disclosed data partnerships with any OEM. Without this data, the world model will overfit simulation and perform poorly on real robots — the same failure mode that plagued earlier robotics AI approaches. Securing 3-5 OEM data partners before the first training run is the most critical near-term technical milestone."
    claimRefs: [CE018, CE020, CE021]

