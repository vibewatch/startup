company:
  name: "Prague Technology"
chapter:
  number: 5
  title: "Product & Technology"
  summary: "Prague Technology is developing a world model for embodied AI — a foundational AI layer enabling physical robots to predict and reason about physical environments. As of July 2026 the company has no released product, no published model, and no technical papers, making this assessment a forward-looking analysis of the technical thesis, Lin Junyang's architectural expertise via Qwen, and the competitive technical context defined by Physical Intelligence, DeepMind Genie 2, and TARS AI's AWE 3.0."

sections:
  - id: "product-vision-and-definition"
    title: "Product Vision and Architecture"
    body: "Prague Technology's product vision is a world model for embodied AI — an AI brain layer that enables humanoid robots and physical systems to perceive, model, and predict the physical world with sufficient fidelity to execute dexterous, multi-step tasks autonomously. Unlike vision-language-action (VLA) models that map sensory inputs directly to motor actions via imitation learning, Prague's intended world model approach operates at a higher cognitive layer: it learns an internal representation of how the physical world behaves, allowing robots to plan actions by mentally simulating future states before executing. This is the same cognitive approach that LeCun proposed for autonomous driving and AMI Labs is pursuing for general embodied AI. Prague's differentiation is the specific focus on China's OEM robotics industry and the founder's deep expertise in multimodal, large-scale model architectures from Qwen. Lin Junyang led development of Qwen's multimodal architecture — enabling video understanding, image reasoning, and cross-modal retrieval — which are all foundational capabilities for world model development. The product definition in customer workflow terms is: an OEM (robot manufacturer) integrates Prague's world model as the cognitive layer in their robot's compute stack, replacing or augmenting proprietary perception-planning modules with a general-purpose AI brain that works across diverse manipulation tasks without task-specific re-training. The value proposition is reduced integration cost per new task, improved generalization across environments, and access to a continuously improving foundation model trained on multi-OEM data. No product demo, whitepaper, architecture blog post, or benchmark result has been publicly released by Prague Technology as of July 2026."
    claimRefs: [CE001, CE002, CE003, CE004, CE005]
    tableRefs: [TE001, TE002]
    figureRefs: [FE001]

  - id: "technical-stack-and-architecture"
    title: "Technical Stack and AI Architecture"
    body: "Prague Technology's technical architecture can only be inferred from Lin Junyang's prior work on Qwen and from the broader world model research landscape. Lin Junyang led the Qwen 2.5 and Qwen 3.5 model families, which introduced several architectural innovations relevant to embodied AI world models: (1) Mixture-of-Experts (MoE) architecture allowing conditional computation across specialized subnetworks, which reduces inference cost for complex multi-modal reasoning; (2) hybrid thinking modes combining fast reactive responses with slow deliberate reasoning (analogous to System 1/System 2 cognition) — directly applicable to robot control where some responses must be sub-100ms reactive while others require multi-step planning; (3) multimodal encoders for visual and spatial understanding; (4) large-scale distributed training infrastructure capable of training 397-billion-parameter models. These capabilities directly map onto the core technical requirements for a world model: a multimodal encoder (visual + proprioceptive + language inputs), an internal state model (physical world dynamics), a planning module (goal-conditioned trajectory generation), and a robot control interface (action outputs). Physical Intelligence's π0 demonstrated that a 3-billion parameter VLA model trained on diverse robot data can achieve one-shot generalization across 68+ tasks — but it still relies on short-horizon action prediction rather than physical world simulation. DeepMind's Genie 2 showed that a 10-billion parameter world model trained on video can generate consistent 3D interactive environments from a single image, demonstrating the viability of world model approaches for physical simulation. Prague's technical approach likely builds on both precedents but targets a model specifically optimized for Chinese OEM robot data, manufacturing environments, and dexterous manipulation tasks. The key technical risks are: (a) world models require substantially more training data diversity than VLAs — requiring OEM data partnerships that do not yet exist; (b) real-time inference for robot control (30-100Hz) at world model scale is computationally demanding and may not be feasible with current hardware; (c) safety and reliability for physical systems introduces new technical requirements beyond software AI benchmarks."
    claimRefs: [CE006, CE007, CE008, CE009, CE010, CE011, CE012, CE013, CE014, CE015]
    tableRefs: [TE003]
    figureRefs: [FE002, FE003]

  - id: "critical-dependencies-and-differentiation"
    title: "Critical Dependencies, Differentiation, and IP"
    body: "Prague Technology's critical technical dependencies create both strategic advantages and material vulnerabilities. On the advantage side, Lin Junyang's architectural expertise, team talent network from Alibaba/Qwen, and deep relationships with China's OEM robotics ecosystem provide differentiated access to the human capital and data partnerships needed to execute the world model strategy. On the vulnerability side, Prague faces three critical technical dependencies: (1) GPU compute access constrained by US export controls on NVIDIA H100/H200 chips — Prague must rely on Huawei Ascend NPUs or domestic alternatives with inferior FLOPs/dollar performance; (2) real-world embodied AI training data partnerships with robot OEMs (AgiBot, Unitree, UBTECH, etc.) — without access to diverse robot-environment interaction data, a world model will overfit simulation and fail to transfer to real environments; (3) simulation infrastructure for generating synthetic training data at scale — building or licensing a high-fidelity physical simulation environment comparable to NVIDIA Isaac Sim or Genesis is a major technical project in itself. Regarding IP, Prague Technology holds no known patents or published technical papers as of July 2026. The primary IP moat, if any, will come from: (a) architectural innovations in MoE-based multimodal world models, (b) proprietary embodied training data accumulated from OEM partnerships, and (c) the data flywheel effect that emerges when multiple OEMs contribute training data in exchange for an improving model. The Anthropic safety framework and OpenAI's Sora system card both document safety considerations for large-scale generative models deployed in physical or consequential domains — Prague will face analogous safety and alignment requirements as it moves from research to deployment. Trust, safety, and compliance for physical AI systems require robustness testing, safety certifications (ISO 10218 for industrial robots, IEC 62443 for embedded systems), and compliance with China's generative AI regulations (MIIT Interim Measures for Generative AI Services, effective August 2023, and subsequent updates)."
    claimRefs: [CE016, CE017, CE018, CE019, CE020, CE021, CE022, CE023, CE024]
    tableRefs: [TE004]
    figureRefs: [FE004]

  - id: "roadmap-and-development-stage"
    title: "Roadmap, Development Stage, and Diligence Gaps"
    body: "Prague Technology has published no formal product roadmap, development timeline, or milestone targets as of July 2026. The company was incorporated in May 2026, making it under three months old at the time of this report. Based on comparable world model development timelines — DeepMind's Genie 2 took approximately 2 years from concept to publication; Physical Intelligence's π0 took approximately 18 months; AMI Labs is targeting a first product in 2027-2028 — Prague's earliest credible milestone would be a proof-of-concept model demonstration in mid-2027, with a first OEM trial integration by late 2027 or early 2028, and commercial availability by 2028-2029 under an optimistic scenario. Lin Junyang is the only publicly identified team member; the team composition, key hires from Alibaba/academic institutions, and organizational structure are all undisclosed. The absence of any technical blog, preprint paper, or benchmark result is typical for a company at this stage, but it also means there is literally zero technical evidence to evaluate Prague's architectural approach, training methodology, or ability to solve the key technical challenges. Comparing this to the benchmark: Physical Intelligence had published the π0 paper within 6 months of launch; Google DeepMind published Genie 2 shortly after creation; AMI Labs has published preliminary model cards and blog posts. Prague's technical opacity creates a complete due-diligence gap. The critical technical diligence asks are: (1) architecture white paper or technical memo demonstrating the team's world model approach; (2) evidence of sim-to-real transfer research or data — showing the team understands the domain gap; (3) existing or planned OEM data partnership agreements; (4) compute strategy — is Prague using NVIDIA vs. domestic chips, and what is the efficiency gap."
    claimRefs: [CE025, CE026, CE027, CE028, CE029, CE030]
    tableRefs: [TE005]

