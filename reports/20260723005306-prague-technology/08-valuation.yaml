callouts:
  - calloutType: "strength"
    title: "Founder Quality Is Best-in-Class for China AI"
    body: "Lin Junyang's direct leadership of the Qwen LLM series — China's leading open-source model family covering language, vision, audio, and code — gives Prague Technology a credibility anchor that is extremely rare at this stage. In a market where pre-revenue AI labs are valued on team signal alone, this is the strongest possible foundation."
    claimRefs: [CV003, CV004]

  - calloutType: "risk"
    title: "Valuation Demands Extraordinary Execution With Zero Margin for Delay"
    body: "At $2 billion post-money with no product and a founding date of May 2026, Prague Technology must deliver a demonstrable world model or embodied AI capability within 18 months to maintain its valuation. The Financial Times and Wall Street Journal have both flagged concerns about inflated valuations in the China AI startup ecosystem in mid-2026, with write-down risk emerging at analogous companies that failed to ship product."
    claimRefs: [CV005, CV006, CV022, CV023]

  - calloutType: "recommendation"
    title: "Neutral with 12-Month Catalyst Window"
    body: "The neutral recommendation reflects balanced risks. A demonstrable embodied AI model, a strategic partnership with a Chinese robotics OEM, or the first peer-reviewed research publication would each represent positive catalyst events in the next 12 months. Investors willing to take concentrated risk at this stage should negotiate strong information rights and pro-rata participation to benefit from the upside while preserving optionality."
    claimRefs: [CV025, CV026, CV027]

  - calloutType: "insight"
    title: "China Risk Discount Creates Relative Value vs. Global World Model Comps"
    body: "Adjusting for the China risk premium — incorporating GPU export controls, geopolitical uncertainty, and regulatory risk — Prague Technology's $2B valuation is arguably in line with its adjusted expected value. If US-China tensions de-escalate or if domestic compute supply (Huawei Ascend, Cambricon) achieves parity with NVIDIA within 2 years, the risk discount would compress and Prague's valuation would appear cheap relative to AMI Labs and World Labs."
    claimRefs: [CV011, CV012, CV013, CV014]

