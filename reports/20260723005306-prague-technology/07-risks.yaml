callouts:
  - calloutType: "risk"
    title: "GPU Export Controls Are the Most Immediate and Quantifiable Risk"
    body: "US restrictions on NVIDIA H100/H200/H20 access for China are already in effect and worsening. Prague Technology's world model training is compute-bound; using domestic alternatives extends the timeline by 12-18 months and increases cost by 40-60%. This is not a future risk — it is a present constraint affecting every training run Prague will execute."
    claimRefs: [CR007, CR009, CR010]

  - calloutType: "risk"
    title: "Key-Person Risk Is Existential and Cannot Be Mitigated in the Short Term"
    body: "Prague Technology depends entirely on Lin Junyang — for technical vision, investor relationships, team hiring, and company credibility. The company has no other named employees or leadership team. This is the highest severity single-point-of-failure in Prague's risk profile and is not mitigatable until at least one co-founder or senior technical leader is hired and publicly identified."
    claimRefs: [CR025, CR026]

  - calloutType: "recommendation"
    title: "Require Completion of Risk Tripwire Framework Before Follow-On Investment"
    body: "Any investment in Prague Technology should be conditional on three tripwires: (1) monthly burn rate confirmation at closing, (2) at least one OEM data partner agreement signed by Q2 2027, and (3) a second named technical leadership hire within 90 days of closing. These are observable, binary milestones that directly address the three most critical investment thesis risks."
    claimRefs: [CR028, CR029]

