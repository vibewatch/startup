      - ["China AI regulatory escalation", "Quarterly: MIIT and CAC new rules affecting embodied AI or generative AI model providers", "If China AI regulation imposes product liability on AI brain failures in physical systems without an insurance market, deployment timelines extend indefinitely", "Quarterly"]
    notes: "Kill criteria are the monitoring thresholds that, if crossed, should trigger either immediate divestment or materially revised thesis."
    claimRefs: [CR001, CR028, CR029, CR030]

