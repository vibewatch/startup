company:
  name: "Prague Technology"
chapter:
  number: 7
  title: "Risks"
  summary: "Prague Technology faces severe near-term risks across all dimensions — GPU compute access constrained by US export controls, a $2B valuation with zero product, existential key-person dependency on Lin Junyang, competitor market lock-in risk from TARS AI, and a 2-4 year pre-revenue window that requires at least one follow-on capital raise at favorable conditions. The risk profile is extreme for the pre-product stage, partially offset by the exceptional founder pedigree and Gaorong/HongShan investor quality."

sections:
  - id: "risk-overview-and-severity-ranking"
    title: "Risk Overview and Severity Ranking"
    body: "Prague Technology's risk profile is shaped by five structural characteristics: (1) zero product as of July 2026, making all commercial and operational risks prospective; (2) extreme valuation premium ($2B for a 3-month-old company with one named employee) that creates a high bar for follow-on financing; (3) geopolitical exposure as a Chinese AI company developing frontier technology in a US-China tech decoupling environment; (4) single-founder dependence on Lin Junyang's architectural expertise and network; and (5) a 2-4 year pre-revenue development timeline during which the company must survive on $220M without commercial validation. The most severe risk is the combination of GPU export controls (NVIDIA H100/H200/H20 restrictions) with the compute intensity of world model training — this could force reliance on domestic Chinese GPU alternatives with 50-70% inferior price-performance ratios, extending the development timeline and increasing capital requirements. The second most severe risk is competitive market lock-in by TARS AI: with a 2-3 year head start, production deployments, and accumulating OEM training data, TARS AI may secure China's top 5-10 OEM customers before Prague launches — a winner-takes-most dynamic that is difficult to reverse. Third is key-person risk: Prague Technology appears to have only one named employee (Lin Junyang), creating catastrophic dependency on a single individual. Technical risk (world model development failure), financial risk (burn exceeding plan), and regulatory risk (China AI rule changes) round out the top six risks. Every risk listed in this chapter has the potential to be a thesis-break trigger — the standard investment condition monitoring framework must include tripwires for each of these dimensions."
    claimRefs: [CR001, CR002, CR003, CR004, CR005, CR006]
    tableRefs: [TR001]
    figureRefs: [FR001]

  - id: "regulatory-legal-geopolitical-risks"
    title: "Regulatory, Legal, and Geopolitical Risks"
    body: "Prague Technology faces a complex and evolving regulatory landscape across multiple jurisdictions. In China, the Interim Measures for Generative AI Services (MIIT/CAC, effective August 2023) requires AI model providers to register with regulators, conduct safety assessments, and comply with content generation restrictions. Subsequent guidance from the Cyberspace Administration of China (CAC) and MIIT has expanded these requirements. For an embodied AI world model deployed in physical robots, the regulatory surface is even broader: industrial robot safety (GB/T standards, ISO 10218 equivalents under Chinese standards), machine safety certifications, and potentially cybersecurity review under the Cybersecurity Law for critical infrastructure adjacent applications. The US export control risk is severe: the US Department of Commerce has progressively restricted NVIDIA AI chip exports to China through the BIS Entity List, Foreign Direct Product Rule, and chip-specific export licensing requirements. The H100, A100, and H20 chips are all restricted or controlled for export to China. The 2025-2026 escalation of US-China tech tensions has further tightened restrictions, with additional tariffs of approximately 25% on remaining NVIDIA GPU chips bound for China. This forces Prague Technology to rely on Huawei Ascend 910B/920 chips or domestic equivalents that have 40-60% fewer FLOPs per dollar than NVIDIA H100 — materially increasing training costs and extending timelines. Legal risks include: (1) IP risk — Prague has no patents and its core technology (world model architecture) is largely in the public domain through academic publications; competitors can replicate Prague's approach without IP barriers; (2) labor law risk — China's restrictive non-compete rules for AI researchers may create talent acquisition conflicts with Alibaba; (3) data law risk — China's Personal Information Protection Law (PIPL) and Data Security Law create obligations when processing robot sensor data containing personal information. Geopolitical risk extends to investment risk: if US sanctions target Chinese AI companies specifically, HongShan's US LP base and Tencent's cross-border activities could create secondary sanctions risk for investors."
    claimRefs: [CR007, CR008, CR009, CR010, CR011, CR012, CR013, CR014]
    tableRefs: [TR002]
    figureRefs: [FR002]

  - id: "operational-technical-dependency-risks"
    title: "Operational, Technical, and Dependency Risks"
    body: "Prague Technology's operational and technical risks flow directly from its product development stage. The core technical risk is world model development failure: world models for embodied AI remain an unsolved research problem as of July 2026 — DeepMind's Genie 2 demonstrated world model viability for game environments but physical robot control at commercial reliability remains unachieved by any company globally. If the technical approach fails or requires substantially longer development than projected, Prague's $220M capital base will be depleted before achieving commercial validation. The sim-to-real transfer gap is the most concrete operational risk: synthetic training data from physics simulations fails to capture real-world sensor noise, surface properties, and environmental variation — requiring extensive real-world data collection from OEM robot partners. Without OEM data partners (Prague has zero as of July 2026), the world model may not generalize beyond simulation. Inference latency is a critical operational constraint: robot control requires responses at 30-100Hz for reactive motions, but world model inference at commercial scale typically operates at 2-10Hz — a 10-30x gap that must be closed through model distillation, hardware optimization, or hybrid architectures before any OEM deployment is possible. Dependency risks center on three critical external parties: (1) Tencent — provides compute access and potential customer channel; dependency risk if the relationship sours or Tencent's regulatory situation changes; (2) Chinese domestic GPU manufacturers (Huawei, Biren, Cambricon) — Prague is forced to rely on inferior domestic chips due to export controls; if domestic GPU supply is disrupted (geopolitical, production failure), Prague's training schedule is disrupted; (3) OEM robot data partners — Prague needs 3-5 OEM companies to commit training data before the world model will generalize; any refusal creates a data gap that cannot be filled with simulation alone. Partner/dependency risk from Gaorong and HongShan is low — both are established top-tier China VCs with strong LP bases and long-term investment horizons. The risk with investors is not abandonment but the potential for pressure to pivot or cut costs if 2027 milestones slip."
    claimRefs: [CR015, CR016, CR017, CR018, CR019, CR020, CR021, CR022, CR023]
    tableRefs: [TR003, TR004]
    figureRefs: [FR003]

  - id: "financial-execution-people-risks"
    title: "Financial, Execution, and People Risks"
    body: "Financial risk is dominated by burn rate uncertainty and the capital intensity of frontier AI development. If monthly burn reaches $10-15M (possible with 100+ researchers plus heavy compute spending), the $220M angel round provides only 14-22 months of runway — requiring a Series A or strategic round by end of 2027. A follow-on round at 2027 market conditions carries substantial risk: if AI enthusiasm has cooled, valuation expectations have normalized, or Prague has not reached a meaningful technical milestone, the follow-on round may be a flat or down round. A down round at $2B→$1B would be seriously dilutive and reputationally damaging. Key-person risk is existential: Prague Technology currently appears to have only one publicly named employee (Lin Junyang). If Lin becomes unavailable (health, legal restriction, acquisition by a strategic, or defection to a competing project), Prague Technology effectively ceases to exist in its current form. The concentration of both technical vision and investor relationships in a single founder creates single-point-of-failure dependency at the company level. Execution risk is high across all dimensions: building a world model research team while simultaneously managing investor relations, OEM business development, regulatory compliance, and compute infrastructure — all at once — is a complex organizational challenge that even experienced serial founders struggle with. Lin Junyang's background is technical (model architecture, training infrastructure) rather than operational (team building, enterprise sales, regulatory navigation). The absence of any disclosed co-founders or C-suite team (CFO, COO, VP Engineering, VP Sales) as of July 2026 is an operational execution red flag. Competition for AI talent from better-resourced incumbents (Alibaba, ByteDance, Tencent, BAIDU) — all of whom pay top-tier salaries and offer more stability than a pre-product startup — will create ongoing talent acquisition and retention challenges. The combined financial, execution, and people risks make Prague Technology a high-risk investment even by Chinese early-stage AI startup standards."
    claimRefs: [CR024, CR025, CR026, CR027, CR028, CR029, CR030]
    tableRefs: [TR005]

