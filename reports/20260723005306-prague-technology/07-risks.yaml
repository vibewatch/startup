      - ["Burn rate vs. runway", "Monthly: confirmed burn rate vs. $5M/mo baseline; cash balance; next round timing", "If burn exceeds $10M/mo without product milestone, runway falls below 18 months — trigger follow-on round immediately", "Monthly"]
