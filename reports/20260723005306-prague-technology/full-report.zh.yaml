      - number: '6.3'
        title: 客户验证与采用轨迹
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年 7 月，Prague Technology
              没有客户验证。没有生产部署、没有试点项目、没有标杆客户、没有客户证言，也没有已签署的意向书。客户验证缺口是完全的。不过，第三方需求信号显示，市场确实对用于具身 AI 的世界模型方案感兴趣：AgiBot 的
              World Challenge（2026 年 6 月，ICRA Vienna）吸引了来自 38 个国家的 526 支团队，说明 OEM 客户需要 AI 研究者开发操作方案。Unitree 的 IPO
              审核获通过以及 2026 年 H1 的 ¥500M 收入，证明中国 OEM 市场真实存在并在增长。TARS AI 在客户验证上走得最远：据称 TARS 的 AWE 3.0 世界模型已集成进 Foxconn
              产线，并在中国吸引 20+ 个企业客户试用——这为 Prague Technology 树立了必须复刻的蓝图。反方视角很尖锐：即便 TARS AI 已融资 $697M
              且拥有生产系统，也只拿到试用，而不是长期生产合同。Prague 还没有产品，即使按乐观时间表，也很可能离首笔收入还有 2-3 年。curionic.net 竞争分析指出，中国机器人 OEM 客户评估 AI
              大脑时看四项指标：（1）操作成功率（生产要求 >95%），（2）延迟（工业任务要求 <200ms），（3）跨 SKU 泛化，（4）与现有硬件的集成成本——Prague 目前都无法证明。Physical
              Intelligence 的 π0 很有参考意义：尽管展示了 68+ 项任务泛化能力，截至 2026 年中，其 OEM 客户管线仍处于“早期试用”，说明世界模型 AI 大脑的商业采用周期按年计算，而不是按月。
