      - number: '6.1'
        title: 客户基础：零客户与市场机会
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年 7 月，Prague Technology 没有客户、没有已签署的 LOI、没有试点协议，也没有披露任何客户对话。因此，本章分析的是潜在客户需求和商业牵引缺失，而不是已经实现的客户指标。对一家
              2026 年 5 月成立、产品尚未存在的公司来说，这并不意外。但客户尽调缺口不只是时间问题，而是根本商业不确定性：Prague 必须把 OEM 机器人制造商变成客户，而这类买方在生产硬件中采用未经验证的 AI
              组件时出了名保守。潜在客户机会很大：中国人形机器人行业在 2026 年 H1 获得 ¥46 billion（$6.4B）投资，更广泛的具身 AI 生态中有 10,000+
              家公司，AgiBot、Unitree、UBTECH、ESTUN、SIASUN 等主要 OEM 品牌都在主动开发或采购 AI 大脑能力。全球范围内，Physical Intelligence 的 π0
              已证明，只要能力被可信展示，OEM 制造商会试用 AI 大脑集成。International Federation of Robotics 预计全球服务机器人市场到 2030 年将达到 $68
              billion，其中 AI 驱动的认知组件预计会占据重要份额。反面观点是，Prague 面临结构性的启动难题：OEM 客户在承诺数据合作前要求看到可用产品演示，但世界模型的构建又需要 OEM
              数据——这形成了一个必须在拿下首个客户前解决的鸡生蛋问题。多位中国 AI 观察者指出，向 OEM 销售世界模型组件，必须证明任务周期时间、错误率下降或替代工人的可量化 ROI；没有产品，Prague
              无法给出这些指标。
