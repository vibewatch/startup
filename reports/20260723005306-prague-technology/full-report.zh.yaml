            body: >-
              截至 2026 年 7 月，Prague Technology 没有发布正式产品路线图、开发时间表或里程碑目标。公司成立于 2026 年 5
              月，本报告撰写时还不到三个月。参照可比世界模型的开发周期——DeepMind 的 Genie 2 从概念到发布约用了 2 年；Physical Intelligence 的 π0 约用了 18 个月；AMI
              Labs 目标是在 2027-2028 年推出首个产品——Prague 最早可信的里程碑，是 2027 年中展示概念验证模型，2027 年底或 2028 年初完成首次 OEM 试点集成，并在乐观情景下于
              2028-2029 年实现商业可用。公开可识别的团队成员只有 Lin Junyang；团队构成、来自 Alibaba
              或学术机构的关键招聘、组织结构均未披露。这个阶段没有技术博客、预印本论文或基准结果并不异常，但也意味着外部几乎没有任何技术证据可用来评估 Prague
              的架构路线、训练方法，或攻克关键技术难题的能力。对比基准公司：Physical Intelligence 在成立 6 个月内发布了 π0 论文；Google DeepMind 创建后不久发布 Genie
              2；AMI Labs 已发布初步模型卡和博客。Prague
