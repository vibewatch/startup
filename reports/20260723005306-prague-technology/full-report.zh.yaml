  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义与范围
        blocks:
          - type: paragraph
            body: >-
              与 Prague Technology 相关的市场是具身智能——AI 系统借助人形机器人、工业机械臂、自动驾驶车辆、服务机器人等硬件载体，在物理环境中感知、推理并行动。它不同于纯软件
              AI（部署在云端的大语言模型），也不同于按固定规则运行的传统预编程工业机器人。相关支出边界包括：（1）面向具身智能体的 AI
              基础模型和世界模型软件；（2）完整人形机器人和移动操作机器人系统；（3）上游零部件（伺服电机、传感器、电池、执行器）；（4）系统集成和部署服务；（5）用于模型训练的数据采集与仿真基础设施。Prague
              Technology 及其可触达客户需要替代的现状方案包括固定程序工业机器人、制造业人工劳动力，以及早于世界模型出现的
              VLA（vision-language-action）模型。相邻市场包括自动驾驶汽车和无人机智能，两者存在技术交集，但监管制度和买方不同。中国具身 AI 行业由硬件公司主导，约 85% 的公司为民营，国资参与约
              4% 的实体。软件 / AI 大脑层——Prague Technology 的目标位置——是公认瓶颈：全球只有约 100 家公司在积极开发具身大模型，而上游硬件供应商超过 8,000
              家。中国国内市场区域集中度很高，广东、浙江、江苏、上海和北京合计占全部公司三分之二以上；2026 年 1–5 月，仅广东就贡献了行业总销售收入的 78.7%。
