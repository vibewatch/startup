      - number: '8.4'
        title: 建议、尽调事项与论点击穿点
        blocks:
          - type: paragraph
            body: >-
              对 Prague Technology 的总体投资结论是中性——更适合有条件持有或放入观察名单，而不是直接投资或直接放弃。创始人质量和市场时点确实出色；Lin Junyang 亲手搭建
              Qwen、把它做成中国领先开源 LLM，这一资历是全球具身 AI 创始人中很少有人能匹配的。相较可比公司，$2 billion 入场估值并不过分。然而，公司极其年轻（2026 年 5
              月成立）、产品牵引为零、暴露于中国监管和地缘政治风险，融资结构又由中国风险资本主导、未披露西方 crossover 或战略投资者，这些都让当下很难有信心定价风险。中性立场反映的是：机会真实存在，但未来 6-12
              个月会出现更好的证据节点——专有世界模型架构演示、与主要机器人 OEM 的战略合作、首次披露研究出版物，或显示 Lin
              正在招募世界级研究者的团队扩张。任何一项都可能把立场推向投资。会把立场推向放弃的论点击穿触发器包括：确认产品延迟到 2027 年 Q4 之后，Lin Junyang 或两名及以上关键联合创始人离开，低于 $1.5
              billion 的 down round，失去 HongShan 或 Gaorong 支持，或地缘政治事件限制跨境 AI
              研究合作。最终尽调事项包括完整股权结构表披露、技术架构文件、算力资源获取计划，以及带里程碑的研究路线图。
            claimRefs:
