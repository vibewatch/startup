              保守口径（$23B）与激进口径（$1.5T）的 2030 年全球市场估算相差 65 倍，反映的是定义混乱，而不是分析分歧。Prague Technology 的投资人实质上押注的是定性市场架构——AI
              大脑会成为一个软件层——而不是任何可量化的近期可触达市场。
