      - number: '4.4'
        title: 财务结论与关键尽调阻碍
        blocks:
          - type: paragraph
            body: >-
              Prague Technology 的财务画像是高估值下的极端前收入投机——一家零收入、零产品、只有一名公开员工（林俊阳）的公司，估值 $2 billion。这在 2025-2026 年 AI
              市场并非没有先例：AMI Labs（$3.5B）和 World Labs（$5B 目标）在商业进展同样有限的情况下估值更高。不过，9x 的 P/Capital
              比率在世界模型初创公司中处于最高区间之一，本质上是对林俊阳架构能力和具身 AI 时点的纯押注。财务命题只有在以下条件同时成立时才成立：（a）Prague 在 2027-2028
              年成功训练并发布世界模型；（b）模型性能超过开源替代和 TARS AWE 3.0；（c）多个 OEM
              客户以商业可行的授权费采用该模型。任何一项失败，估值都会坍缩到人才收购（acqui-hire）或归零结果。Forbes 曾记录 AI 初创公司正在基于氛围和叙事而非经验证指标「放大估值」；Prague
              正好符合这一原型：投资命题完全建立在创始人声誉，以及世界模型会成为下一代 AI 范式的结构性论点上。承销 Prague 财务风险时，最关键未知数是月度现金消耗率：如果公司因激进算力支出，烧钱已经超过
              $8-10M/month，就可能需要在 2027
              年底前融资，而届时市场条件未必更有利。正式投资决策前必须解决的财务尽调阻碍包括：（1）交割时经验证的现金余额和月度烧钱；（2）资本分配计划（算力、人才及其他）；（3）与 Tencent Cloud
              的任何数据共享或收入分成安排；（4）是否存在与 OEM 客户签署的任何 LOI 或合作 MOU。
