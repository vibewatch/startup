      - number: '5.2'
        title: 技术栈与 AI 架构
        blocks:
          - type: paragraph
            body: >-
              Prague Technology 的技术架构目前只能从 Lin Junyang 过往负责 Qwen 的经历，以及更广泛的世界模型研究版图中推断。Lin Junyang 曾主导 Qwen 2.5 和 Qwen
              3.5 模型家族，其中有几项与具身 AI
              世界模型直接相关的架构创新：（1）Mixture-of-Experts（MoE）架构，让计算在专门子网络之间按需分配，降低复杂多模态推理的推理成本；（2）混合思考模式，把快速反应和慢速深思结合起来（类似
              System 1/System 2 认知）——这直接适用于机器人控制：有些响应必须低于 100ms，有些则需要多步规划；（3）用于视觉和空间理解的多模态编码器；（4）可训练 3970
              亿参数模型的大规模分布式训练基础设施。这些能力正好对应世界模型的核心技术要求：多模态编码器（视觉 + 本体感知 +
              语言输入）、内部状态模型（物理世界动力学）、规划模块（目标条件轨迹生成）和机器人控制接口（动作输出）。Physical Intelligence 的 π0 证明，30 亿参数 VLA
              模型只要用多样化机器人数据训练，就能在 68+ 项任务上做到一次样本泛化——但它仍依赖短时域动作预测，而不是物理世界模拟。DeepMind 的 Genie 2 显示，100
              亿参数世界模型用视频训练后，可以从单张图像生成一致的 3D 交互环境，证明世界模型路线可用于物理模拟。Prague 的技术路线很可能同时借鉴这两个先例，但目标是专门面向中国 OEM
              机器人数据、制造场景和灵巧操作任务优化的模型。关键技术风险包括：（a）世界模型需要比 VLA 大得多的训练数据多样性——这要求尚未建立的 OEM 数据合作；（b）机器人控制要求 30-100Hz
              的实时推理，放在世界模型规模上计算压力很高，现有硬件可能撑不住；（c）物理系统的安全与可靠性带来超出软件 AI 基准的新技术要求。
