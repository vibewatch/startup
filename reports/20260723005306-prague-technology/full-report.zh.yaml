            body: >-
              Prague Technology 的单位经济无法评估，因为公司没有披露收入或成本。不过，世界模型开发公司的结构性成本驱动因素，从行业可比公司已经很清楚。最主要成本是 AI
              算力：训练前沿世界模型所需算力预算，可比甚至超过前沿 LLM 训练，每轮训练从数千万美元到数亿美元不等。达到 Qwen3.5 的 397B 参数 MoE 模型规模时，单次训练成本以数千万美元计。由于具身 AI
              训练需要多模态物理仿真，世界模型可能需要更多算力。人才获取和留存是第二大成本驱动因素——头部实验室的前沿 AI 研究员年薪包在 $500K 到 $3M 之间，组建一支 50–100
              人的竞争性研究团队，按市场价格每年需要 $50-150M 薪酬。基础设施和云算力费用（或 Prague 如果采购硬件，则为自有 GPU 集群）构成重大资本开支。正向成本结构论点是，Prague 没有硬件
              COGS、没有制造开销、没有库存、没有实体分销；如果产品是纯软件授权，规模化收入下毛利率可能超过 80%。反向成本论点是，算力成本受 GPU 出口管制影响，中国公司获取 NVIDIA H100/H200
              受限，被迫依赖国产替代（Huawei Ascend、国产 GPU），而后者价格性能比可能更差。美国已对输往中国的 NVIDIA H200 AI 芯片加征约 25% 关税，显著推高所有中国 AI
              模型开发者的训练成本通胀。
