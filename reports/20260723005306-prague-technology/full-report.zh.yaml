      - number: '3.3'
        title: OEM 平台竞争者与在位 AI 巨头
        blocks:
          - type: paragraph
            body: >-
              AgiBot 和 Unitree 是中国按出货量计最大的两家人形机器人 OEM，构成 Prague Technology 必须面对的关键「自建还是外购」动态。AgiBot 由 BYD 支持，2025
              年人形机器人出货 5,168 台、全球第一，正在积极开发内部 VLA 和世界模型能力；AgiBot World Challenge 2026 吸引了来自 27 个国家的 526
              支团队，展示了这一进展。AgiBot 的数据护城河直接来自其在 BYD 和 SAIC 的制造部署，提供 Prague 需要依靠合作才能获得的具身交互数据。Unitree 已开源其
              vision-language-action 模型 UnifoLM-VLA-0，释放出另一种策略信号：把 AI 大脑层商品化，推动硬件采用和开发者生态。如果 Unitree 跑通这一策略，所有独立 AI
              大脑供应商都会承受定价压力。ByteDance 在 2026 年宣布世界模型为最高 AI 优先级，并配套 ¥200 billion（$29.4
              billion）资本预算，这代表压倒性的在位者资源优势。ByteDance 的 Doubao 平台拥有 2 亿多日活用户，让其可以获取规模上任何初创公司都无法匹敌的多模态用户交互数据。虽然 ByteDance
              尚未聚焦机器人专用世界模型，但其算力和分发能力意味着它随时可能入场。Alibaba 的 Qwen 团队——林俊阳的前雇主——仍在活跃：Qwen3.5 于 2026 年 3 月发布，Alibaba 也披露了对具身
              AI 的持续研发投入。关键风险在于，Alibaba 可能基于开源 Qwen 基础，利用林俊阳离职后留下的架构创新，开发直接与 Prague 竞争的机器人专用世界模型。Google DeepMind 的
              RT-X（Open X-Embodiment）联盟和 Gemini Robotics 提供了所有具身 AI 初创公司都必须超越的开源基线，才能证明授权费合理。企业买方评估 AI
              大脑软件「买还是自建」时，开源替代方案（OpenVLA、RT-X）就是关键替代威胁。
