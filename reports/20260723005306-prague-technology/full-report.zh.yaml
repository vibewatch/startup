      - number: '7.3'
        title: 运营、技术与依赖风险
        blocks:
          - type: paragraph
            body: >-
              Prague Technology 的运营和技术风险直接来自产品开发阶段。核心技术风险是世界模型开发失败：截至 2026 年 7 月，具身 AI 世界模型仍是未解的研究问题——DeepMind 的 Genie 2
              证明了世界模型可用于游戏环境，但商业可靠性水平的实体机器人控制，全球还没有任何公司做到。如果技术路线失败，或开发时间远长于预期，Prague 的 $220M
              资金会在实现商业验证前耗尽。仿真到现实迁移鸿沟是最具体的运营风险：物理仿真生成的合成训练数据无法捕捉真实世界传感器噪声、表面属性和环境变化，因此需要从 OEM 机器人伙伴处大规模采集真实世界数据。没有 OEM
              数据伙伴（截至 2026 年 7 月 Prague 为零），世界模型可能无法从仿真泛化出去。推理延迟是关键运营约束：机器人控制要求反应动作达到 30-100Hz，但商业规模的世界模型推理通常只有
              2-10Hz——存在 10-30x 差距，必须在任何 OEM 部署前通过模型蒸馏、硬件优化或混合架构补上。依赖风险集中在三类关键外部方：（1）Tencent——提供算力入口和潜在客户渠道；如果关系恶化或
              Tencent 监管处境变化，就会产生依赖风险；（2）中国国产 GPU 制造商（Huawei、Biren、Cambricon）——出口管制迫使 Prague 依赖性能更弱的国产芯片；如果国产 GPU
              供应中断（地缘政治、生产失败），Prague 的训练排期会被打乱；（3）OEM 机器人数据伙伴——Prague 需要 3-5 家 OEM
              公司承诺训练数据，世界模型才可能泛化；任何拒绝都会留下单靠仿真无法填补的数据缺口。来自 Gaorong 和 HongShan 的伙伴 / 依赖风险较低——两者都是中国一线顶级 VC，LP
              基础扎实，投资周期较长。投资者风险不是被放弃，而是如果 2027 年里程碑延误，可能施压公司转向或削减成本。
