      - number: '8.5'
        title: 图表
        blocks:
          - type: callout
            title: 创始人质量在中国 AI 中属于顶级
            body: >-
              Lin Junyang 直接领导 Qwen LLM 系列——覆盖语言、视觉、音频和代码的中国领先开源模型家族——给 Prague Technology 提供了这个阶段极其罕见的可信度锚点。在收入前 AI
              实验室只靠团队信号定价的市场里，这是最强基础。
            calloutType: strength
            claimRefs:
              - CV003
              - CV004
          - type: callout
            title: 估值要求超常执行，且没有延误余地
            body: >-
              在 $2 billion 投后估值、没有产品、成立日期为 2026 年 5 月的情况下，Prague Technology 必须在 18 个月内交付可展示的世界模型或具身 AI
              能力，才能维持估值。Financial Times 和 Wall Street Journal 都在 2026 年中提示过中国 AI 初创生态估值膨胀的担忧；未能交付产品的类似公司已出现减值风险。
            calloutType: risk
            claimRefs:
              - CV005
              - CV006
              - CV022
              - CV023
          - type: callout
            title: 中性判断，未来 12 个月是催化窗口
            body: >-
              中性建议反映风险相对均衡。可展示的具身 AI 模型、与中国机器人 OEM 的战略合作，或首篇同行评审研究出版物，都会成为未来 12 个月的正向催化事件。愿意在这一阶段承受集中风险的投资者，应谈判强信息权和
              pro-rata 参与权，以在保留选择权的同时分享上行。
            calloutType: recommendation
            claimRefs:
              - CV025
              - CV026
              - CV027
          - type: callout
            title: 中国风险折价带来相对全球世界模型可比公司的价值
            body: >-
              经中国风险溢价调整后——纳入 GPU 出口管制、地缘政治不确定性和监管风险——Prague Technology 的 $2B 估值可以说与调整后的预期价值一致。如果中美紧张降温，或国产算力供应（Huawei
              Ascend、Cambricon）在 2 年内追平 NVIDIA，风险折价会收窄，Prague 相对 AMI Labs 和 World Labs 的估值会显得便宜。
            calloutType: insight
            claimRefs:
