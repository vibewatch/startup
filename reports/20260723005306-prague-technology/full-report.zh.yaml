      - number: '8.2'
        title: 可比估值分析
        blocks:
          - type: paragraph
            body: >-
              对 Prague Technology 最有参考价值的可比公司，是那些收入前、仅凭团队质量和市场潜力获得估值的世界模型与具身 AI 实验室。AMI Labs 是图灵奖得主 Yann LeCun 在 2025
              年底离开 Meta 后创办的世界模型初创公司，2026 年 3 月以 $3.5 billion 投前估值融资 $1.03 billion——这让 Prague 的 $2 billion 投后估值看起来保守了
              40-75%。Fei-Fei Li 创办的 3D 世界模型公司 World Labs，在 2026 年初进行目标估值 $5 billion 的融资，其中一部分为 $1 billion，也再次显著高于
              Prague。Physical Intelligence（Pi）是美国机器人基础模型公司，由 Jeff Bezos、Tiger Global 和 Sequoia 支持，已融资超过 $400
              million，估值估计在 $2 billion+ 以上。在中国，据称 TARS Group（人形 AI）估值高于 $2 billion；Zhiyuan Robotics 和 Unitree Robotics
              各约 $1.5 billion。这些比较把 Prague 放在全球世界模型同业的低端，尽管 Lin Junyang 在其领域内的资历可以说强于部分可比创始人。折价可能反映中国特定风险：中美地缘政治紧张、GPU
              出口限制和监管不确定性，都会让西方投资者保守定价。Sequoia Capital 在 2026 年 5 月的 AI Ascent IV 评论中说，“AI
              是一场计算革命——不是更快的马，而是汽车，而且汽车已经来了”，验证了宏观机会；但他们也强调，创始人必须“从客户出发构建护城河”，这一点 Prague 还没有证明。
