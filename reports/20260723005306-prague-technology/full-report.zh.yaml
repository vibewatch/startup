      - number: '7.5'
        title: 图表
        blocks:
          - type: callout
            title: GPU 出口管制是最直接且可量化的风险
            body: >-
              美国对中国获取 NVIDIA H100/H200/H20 的限制已经生效，而且还在加剧。Prague Technology 的世界模型训练受算力约束；使用国产替代方案会把时间表拉长 12-18 个月，并让成本增加
              40-60%。这不是未来风险，而是当前约束，会影响 Prague 执行的每一次训练运行。
            calloutType: risk
            claimRefs:
              - CR007
              - CR009
              - CR010
          - type: callout
            title: 关键人物风险是生死级的，短期无法缓释
            body: >-
              Prague Technology 完全依赖 Lin Junyang——技术愿景、投资人关系、团队招聘和公司可信度都靠他。公司没有其他具名员工或领导团队。这是 Prague
              风险画像中严重性最高的单点失效，至少要等一名联合创始人或资深技术负责人加入并公开披露后，才可能缓释。
            calloutType: risk
            claimRefs:
              - CR025
              - CR026
          - type: callout
            title: 后续投资前必须完成风险触发框架
            body: >-
              对 Prague Technology 的任何投资都应以三项触发条件为前提：（1）交割时确认月度烧钱速度，（2）到 2027 年 Q2 至少签署一份 OEM 数据伙伴协议，（3）交割后 90
              天内新增一名公开具名的技术领导者。这些都是可观察、二元的里程碑，直接对应三项最关键的投资论点风险。
            calloutType: recommendation
            claimRefs:
              - CR028
              - CR029
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与估值背景
        blocks:
          - type: paragraph
            body: >-
              Prague Technology 的投资论点建立在三根支柱上：顶级创始人、极热市场，以及可能在竞争整合前成形的可防守技术护城河。Lin Junyang 曾带领 Alibaba 的 Qwen
              大语言模型系列成为中国能力最强的开源 LLM，证明了技术深度，也证明了大规模组织执行能力。他在 2026 年初离开 Alibaba，转向具身智能和世界模型研究，路径类似 Yann LeCun（AMI
              Labs）、Fei-Fei Li（World Labs）和 Pieter Abbeel（Covariant/Physical Intelligence）——这些人都仅凭创始人声誉就拿到溢价估值。全球具身 AI
              和世界模型市场正在快速增长；CB Insights 的 State of Venture Q2 2026 报告指出，AI 大额融资现在占所有已部署风险资本的 81%，连续第二个季度融资超过 $200
              billion。在中国，6 个月内诞生了 15 家具身 AI 独角兽，说明该领域资本充裕。Prague 以 $220M 融资对应 $2B 投后估值，意味着投资人持股约
              11%，对这种规模的首笔支票来说稀释偏轻。反面论点同样有力：Prague 没有产品、没有收入、没有客户，成立日期是 2026 年 5 月，可能是史上最年轻的独角兽之一。估值几乎 100%
              建立在对未来交付的信任上。执行风险很尖锐。
