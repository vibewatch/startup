            title: AI 大脑层既是瓶颈，也是下注点
            body: >-
              全球只有约 100 家公司活跃于具身大模型，而硬件供应商超过 8,000 家；Prague Technology 瞄准的是具身 AI 价值链中最稀缺、杠杆最高的单一节点。如果世界模型像基础模型之于软件 AI
              一样，成为物理机器人的标准「操作系统」，模型提供商有机会捕获长期行业经济中不成比例的一份。
