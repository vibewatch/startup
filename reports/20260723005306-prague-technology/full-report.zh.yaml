      - number: '7.2'
        title: 监管、法律与地缘政治风险
        blocks:
          - type: paragraph
            body: >-
              Prague Technology 面临跨多法域、复杂且不断变化的监管环境。在中国，2023 年 8 月生效的《生成式 AI 服务暂行办法》（MIIT/CAC）要求 AI
              模型提供商向监管部门备案、开展安全评估，并遵守内容生成限制。Cyberspace Administration of China（CAC）和 MIIT 随后的指引进一步扩大了这些要求。对部署在实体机器人中的具身
              AI 世界模型来说，监管面更宽：工业机器人安全（GB/T 标准、中国标准下的 ISO 10218 等同要求）、机器安全认证，以及在接近关键基础设施的应用中可能触发 Cybersecurity Law
              下的网络安全审查。美国出口管制风险很重：US Department of Commerce 通过 BIS Entity List、Foreign Direct Product Rule
              和针对芯片的出口许可要求，逐步限制 NVIDIA AI 芯片出口到中国。H100、A100、H20 芯片出口中国均受限制或管制。2025-2026 年中美科技紧张升级进一步收紧限制，对仍可流向中国的 NVIDIA
              GPU 芯片还叠加了约 25% 的额外关税。这迫使 Prague Technology 依赖 Huawei Ascend 910B/920 芯片或国产同类方案，而这些方案每美元 FLOPs 比 NVIDIA
              H100 少 40-60%，会实质性抬高训练成本并拉长时间表。法律风险包括：（1）知识产权风险——Prague
              没有专利，其核心技术（世界模型架构）很大程度上通过学术出版物处于公共领域；竞争对手可以在没有知识产权壁垒的情况下复制 Prague 路线；（2）劳动法风险——中国对 AI 研究人员竞业限制的严格规则，可能让从
              Alibaba 挖人产生人才获取冲突；（3）数据法风险——处理包含个人信息的机器人传感器数据时，中国《个人信息保护法》（PIPL）和《数据安全法》会带来义务。地缘政治风险还延伸到投资层面：如果美国制裁专门指向中国
              AI 公司，HongShan 的美国 LP 基础和 Tencent 的跨境活动可能给投资者带来二级制裁风险。
