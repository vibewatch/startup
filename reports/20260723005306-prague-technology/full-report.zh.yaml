        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >-
              Prague Technology 面临三个重叠战场：（1）中国全栈具身 AI 公司，同时开发硬件和 AI 大脑；（2）全球纯软件世界模型初创公司；（3）内部建设具身 AI 能力的大型科技公司。围绕 Prague
              的世界模型 / AI 大脑定位，直接竞品范围更小，但资金极其充足：TARS AI 已在两轮融资中筹集 $697 million，Spirit AI 融资 $435 million、估值 $1.5
              billion，AMI Labs（Yann LeCun）融资 $1.03 billion、估值 $3.5 billion，World Labs（Fei-Fei Li）融资超过 $1 billion，目标估值据报为
              $5 billion。Prague Technology 融资 $220 million、估值 $2
              billion，在这组同业中按融资额居中，但按隐含收入倍数处在高端——这是风险评估的重要差别。ByteDance 的在位者威胁可能是 Prague 面临的最大结构性竞争风险：ByteDance
              已将世界模型列为最高 AI 优先级，并配套 ¥200 billion 资本开支预算，算力、数据和分发能力都比 Prague 高出几个数量级。Prague
              必须替代的替代品和现状方案包括：（a）为机器人控制改造的微调 LLM（目前足以胜任窄任务）；（b）OpenVLA、RT-X 等开源项目的 VLA（vision-language-action）模型；（c）硬件
              OEM 自研 AI——AgiBot 和 Unitree 都在投入自有 AI 模型，降低对外部大脑供应商的依赖。潜在进入者包括任何将算力预算转向具身 AI
              的中国主要互联网公司（Baidu、NetEase、Xiaomi），以及任何延伸到物理 AI 的全球 AI 实验室（Anthropic、xAI）。
