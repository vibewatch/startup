      - number: '6.2'
        title: 潜在客户细分与买方分析
        blocks:
          - type: paragraph
            body: >-
              Prague Technology 的目标客户细分，可以从公司的世界模型论点和中国人形机器人 OEM 市场结构中推断。首要目标细分是中国 OEM
              人形机器人制造商，特别是面向制造、物流和工业应用造机器人的公司，它们需要用通用世界模型替换自有 AI 规划模块。该细分包括：AgiBot（行业领军者，2026 年 AgiBot World Challenge
              吸引 526+ 支全球团队，已在汽车制造中商业部署）、Unitree Robotics（2026 年 IPO 审核获通过，H1 收入约 ¥500M，正在扩展企业自动化）、UBTECH
              Robotics（面向制造和酒店业的企业人形机器人），以及数十个较小品牌。次要目标细分是正在采用具身 AI 的中国制造业：电子制造商（PCB
              组装、元件放置）、汽车制造商（点焊、装配线协作）和家电制造商（质检、总装）。第三层细分是全球市场：中国以外的 OEM 制造商，包括 Boston Dynamics（Hyundai）、Agility
              Robotics（Amazon）和 Apptronik（Samsung），代表更长期机会，但需要解决跨语言和监管障碍。付款方是 OEM 公司；买方（技术决策者）是 VP Engineering 或 Chief
              Robotics Officer；用户则是机器人本身（在端侧运行 Prague 世界模型）。这种 B2B 企业销售周期从首次接触到签约通常需要 6-18 个月，相对 Prague 的资金续航期偏长。Prague
              Technology 没有披露目标客户名单或销售策略，也没有宣布与任何 OEM 客户建立关系。
