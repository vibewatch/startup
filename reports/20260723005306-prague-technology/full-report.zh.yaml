            title: 鸡生蛋问题：产品需要 OEM 数据，OEM 数据又要先看到产品
            body: >-
              Prague Technology 需要 OEM 机器人数据来训练世界模型，但 OEM
              客户在签署数据合作前要求看到可运行的世界模型演示。这个启动难题是最核心的商业挑战；在任何付费客户关系出现前，公司必须靠非商业研究合作、合成数据生成，或学术 / 政府实验室合作先把它解开。
