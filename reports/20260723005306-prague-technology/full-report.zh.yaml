      - number: '4.3'
        title: 资本充足性与融资
        blocks:
          - type: paragraph
            body: >-
              Prague Technology 在约 2026 年 6 月交割的天使轮中融资约 $220 million：高榕创投 $100 million，HongShan（Sequoia China）$100
              million，Tencent $20 million。投后估值约 $2 billion。按保守月烧钱 $5 million（覆盖约 50 人团队和有限算力）计算，$220 million 可提供约 44
              个月（3.7 年）跑道；如果开发按计划推进，足以在 2029 年前达到概念验证。按激进月烧钱 $12 million（建设 200+ 人团队并投入高强度算力）计算，跑道压缩到约 18 个月，需要在 2027
              年底前完成后续融资。多家信源称，Prague Technology 在天使轮刚交割后就已寻求后续融资——这说明公司预期目标开发时间线需要的资本超过 $220 million。Tencent
              的战略投资可能带来现金以外的价值：Tencent Cloud 的 GPU 集群、Tencent 企业生态分发，以及通过 Tencent 平台业务形成的潜在数据合作，都可能降低 Prague
              的有效算力成本和上市时间。$2 billion 投后估值意味着价格 / 资本比约 9x（$2B / $220M），高于 AMI Labs（3.4x），也符合 2025-2026 年市场对顶级 AI
              创始人的溢价。只有当 Prague 产品按期落地并被 OEM 强势采用时，这一溢价才站得住。反向财务风险场景是，世界模型开发时间线拖过 2029 年，Prague
              在达到商业验证前触发降估值融资或被迫战略转向。S&P Global 和 Morgan Stanley 都曾提示，AI 行业投资风险来自资本集中投向开发周期长的前收入公司。
