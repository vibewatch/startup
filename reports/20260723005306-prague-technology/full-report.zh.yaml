      - number: '6.4'
        title: 留存、集中度与扩张风险
        blocks:
          - type: paragraph
            body: >-
              Prague Technology
              的留存、集中度风险和扩张路径分析完全是前瞻性的——没有可留存的客户，没有客户集中度，也没有扩张指标。不过，世界模型授权业务的结构特征会带来可预判的未来动态，现在就可以分析。留存方面，一旦 OEM 机器人制造商把
              Prague 的世界模型集成为 AI 大脑层，切换成本会很高——模型会用 OEM 专属数据微调，集成 SDK
              会嵌入机器人固件，迁移到竞争对手平台还需要大量工程资源重新训练。这会自然形成有粘性的经常性收入模式，有利于留存。集中度方面，最初 3-5 个 OEM 客户按结构就会贡献 100% 收入；这种极端集中，是 B2B
              企业 AI 初创公司商业化前 12-24 个月的常态。缓释办法不是押注单一垂直行业，而是在汽车、电子和物流等垂直领域拿到多元化 OEM 客户。扩张方面，世界模型授权的“先落地再扩张”路径会从（1）单一工厂中
              1-2 款机器人型号的初始 API 试用，推进到（2）在某个 OEM 机器人全产品线全面部署，再到（3）扩展至新的 OEM 制造工厂，最后到（4）签署数据共享协议，推动跨 OEM
              模型改进。结构性挑战在于，扩张模式需要积累多样化训练数据，而这又需要更多 OEM 伙伴，形成奖励早期市场领导者的自我强化动态（中国的 TARS AI、美国的 Physical Intelligence）。如果
              TARS AI 在 Prague 上线前成功成为中国 OEM 的主导世界模型标准，Prague 面对的就是已被竞争对手生态锁定的市场——这是本章的负面情景。
