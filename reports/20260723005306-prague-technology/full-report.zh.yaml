      - number: '7.4'
        title: 财务、执行与人员风险
        blocks:
          - type: paragraph
            body: >-
              财务风险主要来自烧钱速度不确定，以及前沿 AI 开发的资本强度。如果月度烧钱达到 $10-15M（100+ 名研究员加重算力支出完全可能），$220M 天使轮只能支撑 14-22 个月，公司需要在 2027
              年底前完成 Series A 或战略轮。按 2027 年市场条件再融资风险很大：如果 AI 热情降温、估值预期正常化，或 Prague 没有达到有意义的技术里程碑，后续融资可能变成平轮或 down
              round。估值从 $2B→$1B 的 down round 会造成严重稀释，并损害声誉。关键人物风险是生死级的：Prague Technology 目前似乎只有一名公开具名员工（Lin Junyang）。如果
              Lin 无法继续履职（健康、法律限制、被战略方收购，或转投竞争项目），Prague Technology
              事实上会以当前形态停止存在。技术愿景和投资人关系都集中在单一创始人身上，造成公司层面的单点失效。各维度执行风险都很高：公司必须一边搭建世界模型研究团队，一边管理投资人关系、OEM
              商务拓展、监管合规和算力基础设施——全部同时推进——这对经验丰富的连续创业者也很难。Lin Junyang 的背景偏技术（模型架构、训练基础设施），而不是运营（团队搭建、企业销售、监管导航）。截至 2026 年
              7 月，公司没有披露任何联合创始人或 C-suite 团队（CFO、COO、VP Engineering、VP
              Sales），这是运营执行红旗。来自资源更充足的既有巨头（Alibaba、ByteDance、Tencent、BAIDU）的 AI
              人才竞争会持续带来招聘和留才挑战——这些公司都支付顶级薪酬，也比一家产品前初创公司更稳定。财务、执行和人员风险叠加后，即使按中国早期 AI 初创公司标准，Prague Technology 也是高风险投资。
            claimRefs:
              - CR024
              - CR025
              - CR026
