        - 月度：确认后的烧钱速度相对 $5M/月基准；现金余额；下一轮时点
        - 如果烧钱超过 $10M/月且没有产品里程碑，资金续航降至 18 个月以下——立即触发后续融资
        - 月度
      - - OEM 数据伙伴推进
        - 季度：OEM 数据伙伴沟通数量、已签协议
        - 如果到 2027 年 Q2 仍未签下 OEM 数据伙伴，世界模型泛化时间线会滑到 2029+——投资逻辑明显转弱
        - 季度
      - - 关键人可用性
        - 月度：确认 Lin Junyang 仍实际履职 CEO，且无法律 / 个人限制
        - 如果 Lin Junyang 无法履职且没有替代技术负责人，投资逻辑完全破裂
        - 月度
      - - 中国 AI 监管升级
        - 季度：MIIT 和 CAC 涉及具身智能或生成式 AI 模型提供商的新规
        - 如果中国 AI 监管要求 AI 大脑在物理系统中失效时承担产品责任，且没有保险市场承接，部署时间线将无限拉长
        - 季度
