      - number: '2.2'
        title: 市场规模：TAM、SAM 与 SOM
        blocks:
          - type: paragraph
            body: >-
              全球和中国具身 AI 市场有多套测算口径，结论差距很大——这反映的是定义分歧，而不是预测错误。最保守的自下而上估算基于当前人形与具身机器人部署，认为 2025 年全球具身 AI 市场规模为 $4.44
              billion，并以 39% CAGR 增长，到 2030 年达到约 $23 billion。最宽口径来自 IDC：其将全球具身 AI 市场广义定义为包括自动驾驶汽车、工业自动化软件、智能制造等所有物理 AI
              相邻类别，并预测 2030 年将达到 $1.5 trillion。中国国务院发展研究中心预测，仅中国国内具身 AI 市场到 2035 年就将超过 ¥1 trillion（$140
              billion）。这些估算无法直接比较：IDC 数字包含 EV 软件、制造业 IT 等多数从业者不会归为具身 AI 的支出类别。投资活动是市场动能最及时的指标；仅 2026 年第一季度，中国机器人与具身 AI
              风投融资就达到 $3.3 billion，覆盖 126 笔交易，创下单季度历史新高。2026 年上半年，中国具身 AI 与机器人融资总额超过 ¥46 billion（$6.4 billion），覆盖 288
              起事件、226 家公司。全球范围内，2025 年机器人风投总额为 $13.8 billion；人形机器人专项投资在四年内增长约 143 倍。Prague Technology 的可服务可触达市场，是 AI
              大脑和世界模型软件层。该层目前几乎没有披露的独立收入，但头部分析师将其描述为新兴栈中的主要瓶颈和价值最高节点。类比软件 AI 的基础模型——模型 API 提供商可捕获下游应用价值的 10–15%——到 2030
              年，中国世界模型授权的非常粗略 SOM 估算为 $4–8 billion；但这个数字带有推测性，缺乏信源支持的确认。
