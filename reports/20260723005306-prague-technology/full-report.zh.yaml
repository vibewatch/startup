      - number: '1.3'
        title: 融资历史与投资方联盟
        blocks:
          - type: paragraph
            body: >-
              Prague Technology 于 2026 年 6 月完成首轮外部融资，融资约 $220 million，投后估值约 $2 billion（人民币 135 亿元）。按绝对美元金额计算，这是中国 AI
              初创公司天使或种子阶段的纪录级估值。The Information 最先报道该轮融资，多家中国和国际信源随后确认。领投方为高榕创投和 HongShan Capital（红杉中国，原 Sequoia
              China），各投资 $100 million。Tencent 作为战略联合投资方出资 $20 million。据两名熟悉交易的人士称，公司刚完成该轮融资后，已在寻求启动新一轮后续融资。融资轨迹反映出顶级中国
              VC 之间的激烈竞争：在正式产品里程碑出现前，先锁定顶尖 AI 创始人的早期股权。高榕创投是总部位于上海的主要 VC，管理资金超过人民币 300 亿元，覆盖 300 多家公司，重点投向 AI
              和机器人，过往案例包括 Moonshot AI、XYZ Robotics 和自动驾驶公司。HongShan（原 Sequoia China）管理资产 $55 billion，覆盖 1,500 多家被投公司，曾投资
              DeepSeek、Pony AI、X Square Robot，以及 OpenAI、Anthropic 等全球 AI 龙头。Tencent 几乎投遍中国头部 AI 初创圈，包括 DeepSeek、MiniMax
              和 Zhipu。该投资联盟传递的信号是，机构已形成共识：林俊阳在世界模型和具身智能上的创始人-市场匹配度，足以支撑一个尚未有产品公司的数亿美元下注。
