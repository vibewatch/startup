      - number: '1.2'
        title: 创始人与领导层
        blocks:
          - type: paragraph
            body: >-
              林俊阳（Justin Lin）是 Prague Technology 唯一公开可知的创始人和负责人。他出生于 1993
              年，本科毕业于国际关系学院英语专业，硕士毕业于北京大学外国语学院语言学与自然语言处理方向。2019 年，他以应届毕业生身份加入 Alibaba DAMO Academy，最初负责搜索和推荐场景中的
              NLP，以及包括 M6 在内的早期多模态项目。2022 年底，Alibaba 将 AI 团队重组为通义实验室体系，林俊阳出任通义千问（Qwen）大语言模型系列技术负责人。在他带领下，Qwen
              从内部项目成长为全球下载量最高的开源 LLM 家族之一：到 2026 年初，全球下载量超过 10 亿次，衍生模型超过 200,000 个。他也成为 Alibaba 史上最年轻的 P10 级技术高管；P10
              代表个人技术贡献者的最高等级。2026 年 3 月 3 日，他得知拟议重组将把 Qwen 团队拆分为预训练、后训练、文本、图像和语音等独立团队，团队组织独立性将被取消。次日上午，他宣布离职。在后续文章《From
              Reasoning Thinking to Agentic Thinking》中，他提出下一代 AI 范式将围绕 agentic systems 展开——AI 不只是思考，还要行动。仍在 Alibaba
              任职时，林俊阳已于 2025 年 10 月组建一个小型内部团队，聚焦机器人和具身智能，提前押注这一方向。除林俊阳外，创始团队规模很小，最初约 1 至 10 人，成员来自 ByteDance、Tencent
              和国际背景。公司尚未公开披露其他具名高管或董事会成员。
