  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险概览与严重性排序
        blocks:
          - type: paragraph
            body: >-
              Prague Technology 的风险画像由五个结构性特征塑造：（1）截至 2026 年 7 月仍无产品，所有商业和运营风险都只是前瞻性的；（2）估值溢价极端，成立 3 个月、只有 1 名具名员工却估值
              $2B，这为后续融资设置了很高门槛；（3）作为一家在中美科技脱钩环境中开发前沿技术的中国 AI 公司，地缘政治暴露很高；（4）公司高度依赖单一创始人 Lin Junyang
              的架构能力和人脉；（5）收入前开发周期长达 2-4 年，公司必须在没有商业验证的情况下靠 $220M 活下来。最严重的风险，是 GPU 出口管制（NVIDIA H100/H200/H20
              限制）与世界模型训练算力强度叠加——这可能迫使公司依赖中国国产 GPU 替代方案，而其性价比低 50-70%，从而拉长开发周期并提高资金需求。第二大风险是 TARS AI 的竞争性市场锁定：它领先 2-3
              年，已有生产部署，还在积累 OEM 训练数据，可能在 Prague 上线前拿下中国前 5-10 家 OEM 客户，形成很难逆转的赢家拿走大部分格局。第三是关键人物风险：Prague Technology
              似乎只有一名具名员工（Lin Junyang），公司对单一个体的依赖是灾难级的。技术风险（世界模型开发失败）、财务风险（烧钱超过计划）和监管风险（中国 AI
              规则变化）构成前六大风险的其余部分。本章列出的每项风险都可能击穿投资论点；标准投资条件监控框架必须为每个维度设置预警触发器。
