  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: Prague Technology 潜在 OEM 人形机器人客户的旅程图，展示从认知到生产采用的各阶段。「认知」之后均为预测；Prague 尚无客户走过第一阶段。
    data:
      items:
        - label: 1. 认知
          touchpoints: Industry conference demo, research papers, Lin Junyang reputation, peer OEM reference
          customerEmotion: Curious — learning about world model approach vs. VLA alternatives
          pragueAction: Public demonstrations, whitepaper publication, conference presentations
          status: Current stage for Prague Technology (no product, no demos yet)
        - label: 2. 评估
          touchpoints: Technical meeting with Prague team, review architecture whitepaper, benchmark comparison vs. TARS AWE 3.0
          customerEmotion: Skeptical — concerned about technology maturity, integration cost, and data privacy
          pragueAction: Share model architecture, run controlled benchmark tests, propose data partnership terms
          status: Not yet — requires proof-of-concept model (est. H1 2027)
        - label: 3. 试点
          touchpoints: Signed data partnership agreement, lab integration of Prague API, limited task testing
          customerEmotion: Cautious optimism — testing in controlled environment before production risk
          pragueAction: Dedicated integration engineering support, rapid bug fixes, joint data collection
          status: Not yet — requires production-quality model (est. H2 2027)
        - label: 4. 初始部署
          touchpoints: Production deployment in 1-2 factory lines, SLA negotiation, license fee agreement
          customerEmotion: Committed — financial and engineering resources now invested in Prague stack
          pragueAction: 24/7 support, model updates with OEM data improvements, account management
          status: Not yet — est. H2 2028 at earliest
        - label: 5. 扩展
          touchpoints: Multi-plant rollout, fleet licensing, new task deployment, joint marketing
          customerEmotion: Partner — high switching cost, strong flywheel incentive
          pragueAction: Enterprise account expansion, annual data-for-model-improvement exchange
          status: Not yet — est. 2029-2030
    approximationNotes: 第 2 阶段及以后均为预测。截至 2026 年 7 月，Prague 尚无任何阶段的 OEM 客户。
