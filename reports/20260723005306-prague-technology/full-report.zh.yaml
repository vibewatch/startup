      - number: '3.2'
        title: 直接竞品画像：世界模型与 AI 大脑层
        blocks:
          - type: paragraph
            body: >-
              TARS AI（它石智航）由前 Huawei 自动驾驶 CTO 陈亦伦和前 Baidu Apollo 总裁李震宇于 2025 年 2 月创立，是 Prague Technology 最直接的中国竞争对手。TARS
              采用全栈策略：自研硬件（A 系列轮式工业机器人和 T 系列双足人形机器人）与 AWE 3.0 通用具身大模型结合。TARS 两次刷新中国具身 AI 融资纪录——先是在 2025 年第二季度完成 $242
              million 天使轮，随后在 2026 年 4 月完成由 Hillhouse 和 Sequoia China 领投的 $455 million Pre-A
              轮。其投资人覆盖战略股东（Meituan）、财务资本（Hillhouse、HongShan）、产业资本（TCL）和国资基金（北京机器人基金、上海国资）。相较 Prague 的纯软件定位，TARS
              的全栈路线是关键差异点——TARS 靠硬件部署采集自有具身训练数据，形成数据飞轮；Prague 必须靠 OEM 合作复制这一机制。AMI Labs（Advanced Machine Intelligence
              Labs）由图灵奖得主 Yann LeCun 于 2025 年末创立，并在 2026 年 3 月以 $3.5 billion 估值融资 $1.03 billion，创下欧洲史上最大种子轮。AMI 基于 LeCun
              的 JEPA（Joint Embedding Predictive Architecture）框架构建世界模型，并明确将自己定位为商业化前、研究优先的实体。AMI 的近期应用是医疗健康（通过 Nabla
              合作），不是机器人；不过其投资方包括 NVIDIA、Samsung 和 Toyota Ventures，说明工业应用已有规划。AMI 目前不直接竞争中国市场。World Labs（Fei-Fei Li）融资超过
              $1 billion，其中包括 Autodesk $200 million 战略投资，目标估值据报为 $5 billion。其首款产品 Marble 聚焦面向娱乐和设计的 3D
              环境生成，不是工业机器人。在全球世界模型领导者中，World Labs 与 Prague 目标场景的直接竞争性最低。Spirit AI（精灵智能）已从 Chaos Ventures 和 YF Capital 融资
              $435 million，估值 $1.5 billion，明确瞄准通用机器人大脑市场，而 Prague 也在中国追逐同一市场——因此它是直接国内竞争对手，且领先 12 个月、拥有更深的中国本土投资人关系。
