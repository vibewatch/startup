      - number: '3.4'
        title: 护城河评估与竞争风险
        blocks:
          - type: paragraph
            body: >-
              Prague Technology 设想中的护城河——来自 Qwen 的 LLM 架构经验、具身 AI 世界模型先发优势、顶尖创始人可信度——每一项都有被侵蚀的风险。架构经验护城河在 18–24
              个月窗口内最耐久，但随着行业转向开放架构和基准，竞争会加剧。林俊阳在 transformer 扩展和 MoE（mixture-of-experts）架构上的专长确实稀缺，Qwen3.5 的 397B 参数 MoE
              模型已经证明这一点，并可能在早期世界模型训练中带来数据效率或算力效率优势。不过，TARS AI 的创始团队（Huawei 自动驾驶 + Baidu Apollo）同样履历强，且拥有运营级 AI 部署经验；相较学术
              LLM 扩展，这种经验或许更贴近真实机器人落地。数据飞轮是任何具身 AI 模型提供商最关键的长期护城河：谁能收集最多样、最高质量的具身交互数据，谁就能训练出更好的模型。截至 2026 年 7 月，Prague
              Technology 没有已部署机器人，因此没有数据采集优势。TARS、AgiBot 和 Unitree 都有活跃硬件部署，正在生成自有数据。相对全栈同业，这就是 Prague
              最显著的结构性竞争劣势。分发和商业化路径是 OEM 集成型竞争者的中期护城河：AgiBot 的 BYD 分发能力和 Unitree 的开发者生态，为下游 OEM 客户制造转换成本，Prague
              必须靠更强模型性能来克服。商品化风险真实存在：如果到 2027–2028 年，Google DeepMind 的开放 RT-X 生态，或 OpenVLA、Pi0 等开源 VLA
              框架，对多数工厂任务已经「足够好」，授权 AI 大脑模型的市场就会压缩到专业应用。Prague Technology 的价值主张依赖一个假设：面对复杂多步骤任务，世界模型显著优于 VLA
              模型。这个假设在技术上有前景，但尚未在商业规模上得到经验证实。
