      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >-
              中国具身 AI 市场由政策指令、软件成熟度和供应链能力三者强力汇合驱动。中国「十五五」规划（2026–2030）将具身 AI
              列为量子技术、生物制造等六大未来产业之一，既给出明确政策背书，也带来资金优先级。2026 年 MIIT-SASAC 联合行动计划目标是在年底前部署 10,000 多台机器人。北京、上海、深圳的产业基金规模达到
              ¥100 billion（$14.5 billion）量级。软件前提——大语言模型成熟——已经由中国本土实验室满足：Alibaba Qwen3.5、DeepSeek V4 和 ByteDance Seed 1.6
              展现出世界级推理能力，可被改造成机器人控制逻辑。中国制造供应链覆盖全球工业机器人零部件约 70%。ByteDance 已将世界模型列为 2026 年最高 AI 优先级，并配套 ¥200 billion（$29.4
              billion）资本开支预算。约束侧，sim-to-real 迁移鸿沟——把仿真中训练的 AI
              转化为物理机器人行为的难度——仍是活跃研究问题，但正通过域随机化、数字孪生流水线和神经辐射场收窄。具身模型训练的数据稀缺是根本瓶颈：不同于用互联网文本训练的 LLM，具身 AI
              模型需要大规模物理交互数据，采集成本高、速度慢。美国对先进 AI 芯片（NVIDIA H100/H200）的出口管制，给所有中国 AI 开发者带来持续硬件采购风险，Prague Technology
              也不例外。资本强度极高——大规模训练世界模型所需算力预算，即便资金充足的初创公司也难以长期维持。独立分析师给出的基准情形是，可靠通用人形自主能力的现实商业部署窗口在 2028–2030
              年；这意味着即便按乐观假设，Prague Technology 的商业收入时间线至少也要延后 2–3 年。
