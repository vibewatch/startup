      - number: '2.3'
        title: 买方与细分格局
        blocks:
          - type: paragraph
            body: >-
              中国具身 AI 买方生态按产品类型和部署场景切分。工业机器人仍是收入最大细分，约占中国市场 45%，主要付费方是汽车 OEM（BYD、NIO、SAIC）和电子制造商。服务机器人约占
              25%，面向零售、酒店和养老场景，预算权通常在设施运营或 IT 层级。人形机器人目前收入占比最小，约 5%，但增速最高，也吸引最具投机性的资本。Prague Technology 最相关的买方，是需要授权或集成
              AI 大脑模型的人形机器人 OEM——因为 Prague Technology 没有直接面向消费者或企业的产品，必须依靠 OEM 合作触达终端用户。长三角——上海、江苏、浙江——占中国具身 AI 公司和融资的
              50% 以上，是自然的地理重心。已经在该领域运营的关键人形 OEM，包括 AgiBot（BYD 支持，按 2025 年人形机器人出货量全球第一）、Unitree Robotics（2025 年出货 5,500
              多台，2026 年 6 月 IPO 获批）和 UBTECH（香港上市，2025 年人形机器人收入 ¥821M）；如果 Prague Technology
              成功商业化世界模型，这些公司会是自然的首批可触达客户。仓储和物流运营商（JD.com、SF Express、Amazon China）是第二层买方，劳动力成本 ROI 更具体，采购周期也快于工业自动化。AI
              大脑模型采购的预算所有者位于 OEM 的 CTO 或研发负责人职能内，采购决策主要由模型性能基准和集成可行性驱动，而不是单价。
