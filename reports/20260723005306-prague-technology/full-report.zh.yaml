      - number: '1.4'
        title: 关键里程碑与当前状态
        blocks:
          - type: paragraph
            body: >-
              Prague Technology 的里程碑集中在很短的创立窗口。林俊阳带领 Qwen 团队完成 Qwen 3.5（3970 亿参数 MoE 架构）后，于 2026 年 3 月 3–4 日离开
              Alibaba。2026 年 3 月 26 日，他发布战略文章《From Reasoning Thinking to Agentic Thinking》。2026 年 5 月，The Information
              首次报道他正以 $2 billion 估值融资。2026 年 5 月 13 日至 6 月，他注册了公司实体。到 2026 年 6 月中旬，天使轮已经交割。截至 2026 年 7 月 23
              日报告日期，公司没有披露产品、路线图、网站或商业合作。公司没有报告客户或收入。团队仍处于早期组建和招聘阶段。公司没有公开演示，也没有以 Prague Technology
              或卜拉格品牌申请任何专利或发布任何技术研究。公司的成熟度画像是前产品阶段的 AI
              研究实验室：创始团队履历顶尖，资本已经到位，技术命题也已提出，但新品牌之下还没有经过验证的技术产出。没有公开网站或新闻稿，说明公司可能刻意保持隐身，符合研究优先的策略。林俊阳 2026 年 3
              月在社交媒体称「多模态基础模型正在转向基础智能体，借助工具和记忆，通过强化学习做长期序列推理」，这是其技术方向最清晰的公开表述。
