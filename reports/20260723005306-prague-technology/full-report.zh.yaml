  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品愿景与架构
        blocks:
          - type: paragraph
            body: >-
              Prague Technology 的产品愿景，是面向具身 AI 的世界模型——一个 AI
              大脑层，让人形机器人和物理系统能够以足够高的保真度感知、建模并预测物理世界，从而自主执行灵巧、多步骤任务。不同于通过模仿学习把感知输入直接映射为运动动作的
              VLA（vision-language-action）模型，Prague 设想的世界模型路线处在更高认知层：它学习物理世界如何运转的内部表征，让机器人在执行前先通过心理仿真规划未来状态。这正是 LeCun
              为自动驾驶提出、AMI Labs 为通用具身 AI 追逐的同一种认知路径。Prague 的差异化在于专注中国 OEM 机器人产业，以及创始人从 Qwen 积累的多模态、大规模模型架构深度经验。林俊阳曾带领
              Qwen 多模态架构开发，使其具备视频理解、图像推理和跨模态检索能力；这些都是世界模型开发的基础能力。用客户工作流来定义产品：OEM（机器人制造商）把 Prague
              的世界模型作为认知层集成进机器人计算栈，用一个可跨多种操作任务工作的通用 AI
              大脑，替代或增强自有感知-规划模块，而不需要针对每个任务重新训练。价值主张是降低每个新任务的集成成本，提高跨环境泛化能力，并接入一个由多家 OEM 数据训练、持续改进的基础模型。截至 2026 年 7
              月，Prague Technology 尚未公开发布产品演示、白皮书、架构博客或基准结果。
