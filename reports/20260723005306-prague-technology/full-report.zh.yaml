    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与创立
        blocks:
          - type: paragraph
            body: >-
              Prague Technology 是林俊阳 2026 年中在中国上海创立的 AI 实验室英文商号。公司通过多个法律实体运营：上海卜拉格科技有限公司（Shanghai Bulage Technology Co.,
              Ltd.）于 2026 年 5 月 27 日注册，林俊阳持股 99%，并担任执行董事、总经理和财务负责人；语用（上海）科技有限公司（Yuyong Shanghai Technology Co., Ltd.）于
              2026 年 5 月 13 日注册，林俊阳持股 100%。第三个实体上海格物致用管理咨询合伙企业由卜拉格科技控制。命名是有意的语言双关：卜拉格（Bulage）是 “Pragmatics”
              的音译，语用（Yuyong）是 “Pragmatics” 的中文意译——两者都指向语用学，也呼应林俊阳的学术背景。公司总部位于上海徐汇区。截至报告日期（2026 年 7
              月），公司没有官方网站、没有披露产品，也没有报告收入。公司公开披露的重点方向是世界模型，以及面向物理 AI 系统的「具身大脑」。林俊阳在 2026 年 3 月 3–4 日因内部重组会议离开
              Alibaba，并在社交媒体发布 “me stepping down. bye my beloved qwen”。经过短暂复盘和战略规划后，他在 2026 年 5–6 月成立创业实体。
