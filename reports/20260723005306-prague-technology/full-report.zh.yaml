companyProfile:
  summary: >-
    Prague Technology（上海卜拉格科技有限公司）是一家中国 AI 初创公司，聚焦具身智能、世界模型，以及面向物理系统和机器人的多模态基础模型。公司由林俊阳于 2026 年 5 月创立；他曾带领 Alibaba 的
    Qwen 大语言模型系列成为中国最强开源 LLM。公司从高榕创投、HongShan Capital（Sequoia China）和 Tencent 融资约 $220 million，投后估值 $2
    billion，跻身中国估值最高的早期 AI 公司之一。截至 2026 年 7 月，公司没有商业产品、没有收入，也没有披露客户。
