      - number: '8.3'
        title: 情景分析与回报画像
        blocks:
          - type: paragraph
            body: >-
              在 Prague Technology $2 billion 估值上做假设投资，可以用三个情景框定结果区间。乐观情景（25% 概率）下，Lin Junyang 在 18 个月内交付可用的具身 AI 基础模型，到
              2027 年底前拿下两个或更多标杆工业或机器人合作伙伴，并乘着具身 AI 市场增长在 2029 年达到 $15-20 billion 估值，对当前入场价产生 7-10x 回报，并可能通过部分二级交易或
              pre-IPO tender 退出一部分。基准情景（45% 概率）下，Prague 完成模型开发，但受市场碎片化、数据获取限制和中国机器人 OEM 不愿分享专有数据集影响，商业化推进困难；2030 年估值达到
              $5-7 billion，意味着入场回报 2.5-3.5x——对风险投资来说合理，但考虑风险溢价并不突出。悲观情景（30% 概率）下，产品时间表延误超过 24
              个月，美国出口管制限制关键算力硬件，某个竞争性中国基础模型率先获得商业牵引，或关键团队成员离职削弱投资论点；在这种情景中，公司以 down round 融资，或以 $500 million-$1 billion
              被收购，按 $2 billion 入场会造成重大损失。按概率加权的预期回报约为 3 倍毛回报，未扣费用和 carry；对一家没有收入、没有产品、成立于 2026 年 5
              月的公司来说，这个回报相对风险画像偏弱。持有 10% 股权的投资者，只有在乐观情景下才能获得有意义的绝对回报；悲观情景中，$220M
              支票会严重减值。在这一估值水平上，入场纪律至关重要：必须谈判更强的信息权、pro-rata 和反稀释条款。
