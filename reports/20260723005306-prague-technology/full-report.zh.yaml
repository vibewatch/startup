      - number: '5.3'
        title: 关键依赖、差异化与知识产权
        blocks:
          - type: paragraph
            body: >-
              Prague Technology 的关键技术依赖既带来战略优势，也埋下实质脆弱性。优势在于，Lin Junyang 的架构能力、来自 Alibaba/Qwen 的团队人才网络，以及他与中国 OEM
              机器人生态的深度关系，让公司更容易拿到执行世界模型战略所需的人才和数据合作。脆弱性则集中在三项关键技术依赖：（1）GPU 算力受美国对 NVIDIA H100/H200 芯片出口管制限制——Prague 必须依赖
              Huawei Ascend NPU 或国产替代方案，而这些方案的每美元 FLOPs 表现更差；（2）与机器人 OEM（AgiBot、Unitree、UBTECH 等）建立真实世界具身 AI
              训练数据合作——没有多样化机器人-环境交互数据，世界模型会过拟合仿真，迁移到真实环境时失效；（3）大规模生成合成训练数据的仿真基础设施——自建或授权一个可比 NVIDIA Isaac Sim 或 Genesis
              的高保真物理仿真环境，本身就是一项重大技术工程。知识产权方面，截至 2026 年 7 月，Prague Technology 没有已知专利，也没有公开技术论文。如果有知识产权护城河，主要会来自：（a）基于 MoE
              的多模态世界模型架构创新，（b）从 OEM 合作中积累的专有具身训练数据，（c）多个 OEM 用训练数据换取持续改进模型后形成的数据飞轮。Anthropic 安全框架和 OpenAI 的 Sora
              系统卡都记录了大型生成模型进入物理或高后果领域后的安全考量；Prague 从研究走向部署时，也会面对类似的安全与对齐要求。物理 AI 系统的信任、安全和合规，需要鲁棒性测试、安全认证（工业机器人 ISO
              10218、嵌入式系统 IEC 62443），并遵守中国生成式 AI 监管（2023 年 8 月生效的 MIIT《生成式 AI 服务暂行办法》及后续更新）。
