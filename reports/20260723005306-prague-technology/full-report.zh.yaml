            body: >-
              截至 2026 年 7 月，Prague Technology 没有当前收入、没有商业产品，也没有披露客户，明确处于商业化前的研究阶段。结合林俊阳公开表述和公司披露方向推断，其目标收入模式是 B2B AI
              模型授权和 API 访问业务：人形机器人 OEM 授权 Prague 的世界模型，为自己的 AI 大脑层提供动力，并支付经常性 API 费用或按模型运行次数计费。次级收入流可能包括面向 OEM
              特定硬件配置的定制模型训练或微调服务，也可能包括数据标注或仿真基础设施服务。Prague 的纯软件策略（不做硬件制造）一旦产生收入，理论上可形成高毛利商业模式，类似规模化后达到 70-85% 毛利率的基础模型
              API 提供商。但这一理论毛利率假设有大量 OEM 客户在生产环境部署 Prague 模型。最接近且已验证的可比公司显示，商业化时间线需要数年：AMI Labs 的 CEO 明确承认，世界模型商业应用需要
              “years, not months or quarters”；Physical Intelligence 的 π0 已展示多任务操作，但没有披露大规模商业收入。Prague
              的产品路线图、开发时间线、定价结构和商业化路径完全未披露，因此无法做出除最粗略定性边界以外的任何财务建模。截至 2026 年 7
              月，公司没有任何技术白皮书、模型基准或公开原型，这意味着收入建模的基础——产品会有效的证据——也无法独立验证。
