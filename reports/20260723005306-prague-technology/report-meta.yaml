companyProfile:
  summary: "Prague Technology (上海卜拉格科技有限公司) is a Chinese AI startup focused on embodied intelligence, world models, and multimodal foundation models for physical systems and robotics. Founded in May 2026 by Lin Junyang — who previously led Alibaba's Qwen large language model series to become China's top open-source LLM — the company raised approximately $220 million at a $2 billion post-money valuation from Gaorong Ventures, HongShan Capital (Sequoia China), and Tencent, making it one of China's most valuable early-stage AI companies. As of July 2026 the company has no commercial product, no revenue, and no disclosed customers."
  foundedDate: "2026-05-27"
  founders:
    - name: "Lin Junyang (林俊旸)"
      role: "Founder and CEO"
      background: "Former chief architect of Alibaba's Qwen large language model series; left Alibaba in early 2026 after the Qwen 3.5 release."
      claimRefs: [CO001, CO003]
  foundingLocation: "Shanghai, China"
  headquarters: "Xuhui District, Shanghai, China"
  productSummary: "No commercial product as of July 2026; company is developing world model and embodied AI foundation model technology intended for robotics and physical AI applications."
