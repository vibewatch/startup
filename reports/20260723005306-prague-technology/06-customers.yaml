callouts:
  - calloutType: "risk"
    title: "Chicken-and-Egg Problem: OEM Data Required Before Product, Product Required Before OEM Data"
    body: "Prague Technology needs OEM robot data to train its world model, but OEM customers require a working world model demonstration before signing a data partnership. This bootstrapping problem is the defining commercial challenge and must be solved through non-commercial research partnerships, synthetic data generation, or academic/government lab partnerships before any paying customer relationship is possible."
    claimRefs: [CU004, CU020]

  - calloutType: "risk"
    title: "TARS AI's 2-Year Head Start Creates OEM Market Lock-In Risk"
    body: "TARS AI's AWE 3.0 is already in production with Foxconn and accumulating OEM-specific training data while Prague Technology is still in research. By the time Prague launches in 2028, TARS may have locked in China's top 5-10 OEM customers — leaving Prague to compete for second-tier OEMs or international markets."
    claimRefs: [CU016, CU026]

  - calloutType: "risk"
    title: "B2B Enterprise AI Adoption in Robotics Is Slower Than Consumer AI"
    body: "Multiple industry observers note that enterprise robotics procurement cycles are 6-18 months minimum, with safety validation adding another 6-12 months before production deployment. Even well-funded AI startups like Physical Intelligence (backed by Jeff Bezos and a16z) are still in 'early trials' with OEM customers after 18+ months. Prague's commercial timeline must account for these structural delays."
    claimRefs: [CU019, CU021]

