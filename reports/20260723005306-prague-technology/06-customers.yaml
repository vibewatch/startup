chapter:
  number: 6
  title: "Customers"
  summary: "Prague Technology has zero customers, zero revenue, and no signed customer agreements as of July 2026. The customer thesis is entirely prospective: OEM humanoid robot manufacturers in China are identified as the primary target segment, but demand validation, customer proof, and adoption trajectory are all evidence gaps that represent the most critical near-term commercial risk."

sections:
  - id: "zero-customers-and-market-opportunity"
    title: "Customer Base: Zero Customers and Market Opportunity"
    body: "Prague Technology has no customers, no signed LOIs, no pilot agreements, and no disclosed customer conversations as of July 2026, making this chapter an analysis of prospective customer demand and the absence of commercial traction rather than realized customer metrics. This is expected for a company founded in May 2026 whose product does not yet exist. However, the customer diligence gap is not merely temporal — it represents a fundamental commercial uncertainty: Prague must attract OEM robot manufacturers as customers, a buyer class that is notoriously conservative about adopting unproven AI components in production hardware. The prospective customer opportunity is large: China's humanoid robot industry saw ¥46 billion ($6.4B) in H1 2026 investment, with 10,000+ companies in the broader embodied AI ecosystem, and major OEM brands including AgiBot, Unitree, UBTECH, ESTUN, and SIASUN all actively developing or sourcing AI brain capabilities. Globally, Physical Intelligence's π0 has demonstrated that OEM manufacturers will trial AI brain integrations when the capability is credibly demonstrated. The International Federation of Robotics projects the global service robot market at $68 billion by 2030, of which AI-enabled cognitive components are expected to represent a significant share. The adverse perspective: Prague faces a structural bootstrapping problem where OEM customers require working product demos before committing to data partnerships, but building the world model requires OEM data — creating a chicken-and-egg problem that must be solved before Prague can acquire its first customer. Multiple China AI observers have noted that selling world model components to OEMs requires demonstrating measurable ROI on task cycle time, error rate reduction, or worker displacement — metrics Prague cannot provide without a product."
    claimRefs: [CU001, CU002, CU003, CU004, CU005, CU006]
    tableRefs: [TU001]
    figureRefs: [FU001, FU002]

  - id: "prospective-customer-segments"
    title: "Prospective Customer Segments and Buyer Analysis"
    body: "Prague Technology's intended customer segments can be inferred from the company's world model thesis and the structure of the Chinese humanoid robotics OEM market. The primary target segment is China OEM humanoid robot manufacturers — specifically companies building robots for manufacturing, logistics, and industrial applications who need to replace their proprietary AI planning modules with a general-purpose world model. This segment includes: AgiBot (industry leader, AgiBot World Challenge with 526+ global teams in 2026, commercially deployed in automotive manufacturing), Unitree Robotics (cleared IPO review in 2026, H1 revenue of approximately ¥500M, expanding into enterprise automation), UBTECH Robotics (enterprise humanoids for manufacturing and hospitality), and dozens of smaller brands. The secondary target segment is China's manufacturing sector adopting embodied AI: electronics manufacturers (PCB assembly, component placement), automotive manufacturers (spot welding, assembly line collaboration), and appliance manufacturers (quality inspection, final assembly). A tertiary segment is the global market: non-China OEM manufacturers including Boston Dynamics (Hyundai), Agility Robotics (Amazon), and Apptronik (Samsung) represent a longer-term opportunity but require solving cross-language and regulatory barriers. The payer is the OEM company; the buyer (technical decision-maker) is the VP Engineering or Chief Robotics Officer; the user is the robot itself (running the Prague world model on-device). This B2B enterprise sales cycle is typically 6-18 months from first contact to contract signature — long relative to Prague's capital runway. Prague Technology has not disclosed a target customer list or sales strategy, and has no announced relationships with any OEM customer."
    claimRefs: [CU007, CU008, CU009, CU010, CU011, CU012, CU013]
    tableRefs: [TU002, TU003]
    figureRefs: [FU003]

  - id: "customer-proof-and-adoption-trajectory"
    title: "Customer Proof and Adoption Trajectory"
    body: "Prague Technology has no customer proof as of July 2026. There are no production deployments, no pilot programs, no reference customers, no testimonials, and no signed letters of intent. The customer proof gap is total. However, third-party demand signals indicate genuine customer interest in world model solutions for embodied AI: AgiBot's World Challenge (ICRA Vienna, June 2026) attracted 526 teams from 38 countries, demonstrating OEM customer demand for AI researchers to develop manipulation solutions. Unitree's IPO clearance and ¥500M H1 2026 revenue demonstrates that the China OEM market is commercially real and growing. TARS AI has progressed furthest on customer proof: TARS' AWE 3.0 world model is reportedly integrated into Foxconn manufacturing lines and has attracted 20+ enterprise customer trials in China — establishing the blueprint that Prague Technology must replicate. The adversarial view is stark: even TARS AI, with $697M raised and a production system, has only secured trials rather than long-term production contracts. Prague, with no product, faces a customer acquisition challenge that is likely 2-3 years from first revenue at the optimistic timeline. The curionic.net competitive analysis notes that Chinese robot OEM customers evaluate AI brains on: (1) manipulation success rate (>95% required for production), (2) latency (<200ms required for industrial tasks), (3) generalization across SKUs, and (4) integration cost with existing hardware — all criteria that Prague cannot currently demonstrate. Physical Intelligence's π0 experience is instructive: despite demonstrating 68+ task generalization, their OEM customer pipeline is in 'early trials' as of mid-2026, suggesting that commercial adoption timelines for world model AI brains are measured in years, not months."
    claimRefs: [CU014, CU015, CU016, CU017, CU018, CU019, CU020, CU021]
    tableRefs: [TU004]

  - id: "retention-concentration-expansion-risk"
    title: "Retention, Concentration, and Expansion Risk"
    body: "Retention, concentration risk, and expansion pathway analysis for Prague Technology are entirely prospective — there is nothing to retain, no customer concentration, and no expansion metric. However, the structural characteristics of the world model licensing business create predictable future dynamics that can be analyzed now. On retention: once an OEM robot manufacturer integrates Prague's world model as the AI brain layer, switching costs will be high — the model will be fine-tuned on OEM-specific data, the integration SDK will be embedded in the robot's firmware, and retraining on a competitor's platform requires significant engineering resources. This creates a natural sticky, recurring revenue model that is favorable for retention. On concentration: the first 3-5 OEM customers will represent 100% of revenue by construction; this extreme concentration is the normal state for B2B enterprise AI startups in their first 12-24 months of commercial operation. The mitigation is securing a diverse set of OEM customers across automotive, electronics, and logistics verticals rather than concentrating in a single vertical. On expansion: the land-and-expand model for world model licensing would progress from (1) initial API trial for 1-2 robot models in a single factory, to (2) full deployment across an OEM's robot fleet, to (3) expansion to new OEM manufacturing plants, to (4) data-sharing agreements enabling cross-OEM model improvement. The structural challenge is that the expansion model requires accumulating diverse training data — which requires more OEM partners — creating a self-reinforcing dynamic that rewards early market leaders (TARS AI in China, Physical Intelligence in the US). If TARS AI successfully establishes the dominant world model standard for China OEMs before Prague launches, Prague faces a market locked into a competitor's ecosystem — the adverse scenario for this chapter."
    claimRefs: [CU022, CU023, CU024, CU025, CU026, CU027, CU028]
    tableRefs: [TU005]
    figureRefs: [FU004]

