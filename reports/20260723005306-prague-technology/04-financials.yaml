company:
  name: "Prague Technology"
chapter:
  number: 4
  title: "Financials"
  summary: "Prague Technology has zero revenue, zero disclosed unit economics, and no commercial product as of July 2026. Its $220 million angel round at a $2 billion post-money valuation provides an estimated 2–4 year runway depending on burn rate, but the financial thesis rests entirely on the future commercialization of a world model product that does not yet exist."

sections:
  - id: "revenue-model-business-strategy"
    title: "Revenue Model and Business Strategy"
    body: "Prague Technology has no current revenue, no commercial product, and no disclosed customers as of July 2026 — placing it firmly in the pre-commercial research phase. The intended revenue model, inferred from Lin Junyang's public statements and the company's stated focus, is a B2B AI model licensing and API-access business: humanoid robot OEMs would license Prague's world model to power their AI brain layer, paying recurring API fees or per-model-run charges. Secondary revenue streams would likely include custom model training or fine-tuning services for OEM-specific hardware configurations, and potentially data labeling or simulation infrastructure services. Prague's pure-software strategy (no hardware manufacturing) creates a theoretically high-margin business model once revenue begins — analogous to foundation model API providers that achieve 70-85% gross margins at scale. However, this theoretical margin assumes substantial volumes that require many OEM customers deploying Prague's model in production. The closest validated comparables suggest commercial timelines of multiple years: AMI Labs' CEO explicitly acknowledged 'years, not months or quarters' for world model commercial applications; Physical Intelligence's π0 has demonstrated multi-task manipulation but has not disclosed commercial revenue at scale. Prague's product roadmap, development timeline, pricing structure, and go-to-market approach are entirely undisclosed, preventing any financial modeling beyond the roughest qualitative bounds. The absence of any technical whitepaper, model benchmark, or public prototype as of July 2026 means that even the foundation for revenue modeling — evidence that the product will work — cannot be independently verified."
    claimRefs: [CI001, CI002, CI003, CI009, CI010, CI011, CI012, CI013, CI014, CI015, CI016]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]

  - id: "unit-economics-cost-structure"
    title: "Unit Economics and Cost Structure"
    body: "Prague Technology's unit economics cannot be assessed because neither revenue nor costs are disclosed. However, the structural cost drivers for a world model development company are well-understood from industry comparables. The primary cost component is AI compute: training a frontier world model requires compute budgets comparable to or exceeding frontier LLM training runs, which range from tens of millions to hundreds of millions of dollars per training iteration. At the scale of Qwen3.5's 397B-parameter MoE model, training costs are measured in the tens of millions per run. World models may require even more compute due to the multi-modal physical simulation requirements of embodied AI training. Talent acquisition and retention is the second largest cost driver — frontier AI researchers command compensation packages of $500K to $3M per year at leading labs, and building a competitive team of 50-100 researchers would require $50-150M in annual compensation at market rates. Infrastructure and cloud compute fees (or owned GPU clusters if Prague acquires hardware) represent a significant capital expenditure. The positive cost structure argument is that Prague has no hardware COGS, no manufacturing overhead, no inventory, and no physical distribution — meaning gross margins could exceed 80% at revenue scale if the product is purely software licensing. The adverse cost argument is that compute costs are subject to GPU export controls that restrict NVIDIA H100/H200 access for Chinese companies, forcing reliance on domestic alternatives (Huawei Ascend, domestic GPUs) that may have inferior price-performance ratios. The US has imposed tariffs of approximately 25% on NVIDIA H200 AI chips bound for China, materially increasing training cost inflation for all Chinese AI model developers."
    claimRefs: [CI017, CI018, CI019, CI020, CI021, CI022, CI023, CI029]
    tableRefs: [TI003]
    figureRefs: [FI002]

  - id: "capital-adequacy-financing"
    title: "Capital Adequacy and Financing"
    body: "Prague Technology raised approximately $220 million in an angel round that closed approximately June 2026: $100 million from Gaorong Ventures, $100 million from HongShan (Sequoia China), and $20 million from Tencent. The post-money valuation was approximately $2 billion. At a conservative monthly burn of $5 million per month (covering team of ~50 and limited compute), the $220 million provides approximately 44 months (3.7 years) of runway — sufficient to reach proof-of-concept by 2029 if development proceeds on track. At an aggressive burn rate of $12 million per month (building a team of 200+ plus intensive compute spend), runway compresses to approximately 18 months, requiring a follow-on round by end of 2027. Multiple sources reported that Prague Technology was already seeking follow-on financing immediately after the angel round closed — suggesting the company anticipated needing more capital than $220 million for its intended development timeline. Tencent's strategic investment may provide non-monetary value beyond cash: Tencent Cloud's GPU clusters, distribution through Tencent's enterprise ecosystem, and potential data partnerships through Tencent's platform businesses could reduce Prague's effective compute cost and time-to-market. The $2 billion post-money valuation implies a price-to-capital ratio of approximately 9x ($2B / $220M) — higher than AMI Labs (3.4x) and consistent with top-tier AI founder premiums in the 2025-2026 market. This premium is justified only if Prague's product materializes on schedule with strong OEM adoption. The adverse financial risk scenario is that the world model development timeline slips past 2029, triggering a down-round or forced strategic pivot before Prague reaches commercial validation. S&P Global and Morgan Stanley have both flagged AI sector investment risks related to concentration of capital in pre-revenue companies with long development timelines."
    claimRefs: [CI004, CI005, CI006, CI007, CI024, CI025, CI026, CI027, CI028, CI030, CI031, CI032, CI033, CI034, CI037, CI038]
    tableRefs: [TI004]
    figureRefs: [FI003]

  - id: "financial-verdict"
    title: "Financial Verdict and Key Diligence Blockers"
    body: "Prague Technology's financial profile is extreme pre-revenue speculation at high valuation — $2 billion for a company with zero revenue, zero product, and one public-facing employee (Lin Junyang). This is not unprecedented in the 2025-2026 AI market: AMI Labs ($3.5B) and World Labs ($5B target) command higher absolute valuations with equally limited commercial progress. However, the P/Capital ratio of 9x is among the highest for any world model startup and reflects a pure bet on Lin Junyang's architectural expertise and embodied AI timing. The financial thesis holds only if: (a) Prague successfully trains and ships a world model by 2027-2028, (b) the model achieves superior performance over open-source alternatives and TARS AWE 3.0, and (c) multiple OEM customers adopt the model at commercially viable license fees. If any of these conditions fails, the valuation collapses toward a talent-acquisition outcome (acqui-hire) or zero. Forbes has documented that AI startups are 'supersizing valuations' based on vibe and narrative rather than verified metrics — Prague fits this archetype precisely: the investment thesis rests entirely on the founder's reputation and the structural argument about world models as the next AI paradigm. The single most important unknown for underwriting Prague's financial risk is its monthly cash burn rate: if burn is already exceeding $8-10M/month due to aggressive compute spending, a follow-on round may be necessary by end of 2027 at market conditions that may be less favorable. The financial diligence blockers that must be resolved before any formal investment decision are: (1) verified cash balance and monthly burn as of closing, (2) capital allocation plan (compute vs. talent vs. other), (3) any data sharing or revenue-sharing arrangements with Tencent Cloud, and (4) existence of any signed LOIs or partnership MOUs with OEM customers."
    claimRefs: [CI035, CI036, CI039, CI040]
    tableRefs: [TI005]
    figureRefs: [FI004]

