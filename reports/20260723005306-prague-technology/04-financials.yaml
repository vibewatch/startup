callouts:
  - calloutType: "risk"
    title: "Valuation Rests Entirely on Narrative, Not Metrics"
    body: "Prague Technology's $2 billion valuation cannot be supported by any financial metric because there are no metrics: zero revenue, zero customers, zero benchmarks, zero products. Forbes has documented that AI startups are using founder reputation and market narratives to 'supersize valuations' — this chapter's analysis suggests Prague is a textbook example of this phenomenon."
    claimRefs: [CI024, CI027, CI040]

  - calloutType: "risk"
    title: "Monthly Burn Rate Is the Critical Unknown"
    body: "The difference between an 18-month runway (burn $12M/mo) and a 44-month runway (burn $5M/mo) determines whether Prague needs to raise again by mid-2027 or has runway through 2029. At 2027 market conditions for AI funding, a down-round is possible if the world model remains unshipped. This is the single most important financial diligence item."
    claimRefs: [CI028, CI036]

  - calloutType: "strength"
    title: "Tencent Investment May Provide Compute Subsidy Worth More Than Its Face Value"
    body: "Tencent's $20M investment likely came with a strategic relationship involving Tencent Cloud compute access. If Prague accesses GPU capacity at cost rather than market rates through Tencent, the effective value of Tencent's involvement could be $50-100M in avoided compute costs — partially offsetting the export control compute constraint."
    claimRefs: [CI038]

  - calloutType: "assumption"
    title: "Gross Margin Analogy to LLM APIs Is Structurally Valid but Untested"
    body: "This chapter assumes Prague's long-run gross margin target is 70-85% based on the analogy to frontier LLM API providers (OpenAI, Anthropic). However, embodied AI world models may require substantially higher inference costs per API call due to multi-modal physical simulation requirements, potentially compressing margins to 40-60%."
    claimRefs: [CI020, CI021, CI039]

