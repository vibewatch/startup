  topStrengths:
    - Lin Junyang 是中国最可信的 AI 模型构建者之一，曾主导 Qwen LLM 系列架构
    - 相比可比的收入前 world model 实验室 AMI Labs（$3.5B）和 World Labs（$5B），$2B 估值偏保守
    - 顶级中国 VC 注入 $220M 资本，可支撑 24+ 个月深度研究现金跑道
    - 2026 年全球 AI 投资中，具身 AI 和 world model 是增长最快的方向之一
    - 国内市场足够大：中国工业机器人赛道天然适合率先采用具身 AI
  topRisks:
    - 产品前、收入前，2026 年 5 月成立——估值几乎全靠创始人信号支撑，没有产品验证
    - 美国出口管制限制 GPU 获取，迫使公司依赖性能较弱的国产芯片，训练能力面临急性风险
    - 投资人全部是中国 VC，限制美国 / 欧盟 IPO 或战略并购选择权
    - 中国生成式 AI 监管（MIIT Interim Measures）带来合规负担，也可能形成内容审查约束
    - 资金充足的同行持续施压：TARS、Zhiyuan、AMI Labs、Physical Intelligence 和 World Labs
    - Lin Junyang 之外的核心团队构成未披露；关键具身 AI 硬件人才招聘尚未验证
  unresolvedGaps:
    - 股权结构表和清算优先权未公开披露——隐含约 11% 稀释只是估算
    - 技术架构规格及其与 Qwen 模型的差异化未公开
    - 美国出口管制下的 GPU 算力获取方案未披露
    - Lin Junyang 之外的团队构成未披露——关键人才风险突出
    - Physical Intelligence 和 TARS Group 的准确估值为分析师估算，尚未确认
