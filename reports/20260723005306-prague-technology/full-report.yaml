      - number: '1.3'
        title: Funding History and Investor Syndicate
        blocks:
          - type: paragraph
            body: >-
              Prague Technology completed its first external financing round in June 2026, raising approximately $220
              million at a post-money valuation of approximately $2 billion (RMB 13.5 billion). This is a record-level
              angel or seed-stage valuation for a Chinese AI startup in absolute dollar terms. The round was reported
              initially by The Information and confirmed by multiple Chinese and international sources. Lead investors
              were Gaorong Ventures (高榕创投) and HongShan Capital (红杉中国, formerly Sequoia China), each investing $100
              million. Tencent joined as a strategic co-investor with $20 million. Immediately after completing this
              round, the company was reportedly seeking to initiate a new follow-on financing, according to two people
              familiar with the transactions. The funding trajectory reflects intense competition among top-tier Chinese
              VCs to secure early stakes in elite AI founders before formal product milestones exist. Gaorong Ventures
              is a major Shanghai-based VC managing over RMB 30 billion across 300+ companies, with strong AI and
              robotics focus including prior investments in Moonshot AI, XYZ Robotics, and autonomous driving companies.
              HongShan (formerly Sequoia China) manages $55 billion AUM across 1,500+ portfolio companies and has backed
              DeepSeek, Pony AI, X Square Robot, and global AI leaders including OpenAI and Anthropic. Tencent has
              invested in virtually every top Chinese AI startup circle including DeepSeek, MiniMax, and Zhipu. The
              syndicate signals institutional consensus that Lin Junyang's founder-market fit in world models and
              embodied intelligence justifies a multi-hundred-million-dollar bet before any product exists.
