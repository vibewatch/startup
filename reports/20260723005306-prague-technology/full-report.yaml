      - number: '7.2'
        title: Regulatory, Legal, and Geopolitical Risks
        blocks:
          - type: paragraph
            body: >-
              Prague Technology faces a complex and evolving regulatory landscape across multiple jurisdictions. In
              China, the Interim Measures for Generative AI Services (MIIT/CAC, effective August 2023) requires AI model
              providers to register with regulators, conduct safety assessments, and comply with content generation
              restrictions. Subsequent guidance from the Cyberspace Administration of China (CAC) and MIIT has expanded
              these requirements. For an embodied AI world model deployed in physical robots, the regulatory surface is
              even broader: industrial robot safety (GB/T standards, ISO 10218 equivalents under Chinese standards),
              machine safety certifications, and potentially cybersecurity review under the Cybersecurity Law for
              critical infrastructure adjacent applications. The US export control risk is severe: the US Department of
              Commerce has progressively restricted NVIDIA AI chip exports to China through the BIS Entity List, Foreign
              Direct Product Rule, and chip-specific export licensing requirements. The H100, A100, and H20 chips are
              all restricted or controlled for export to China. The 2025-2026 escalation of US-China tech tensions has
              further tightened restrictions, with additional tariffs of approximately 25% on remaining NVIDIA GPU chips
              bound for China. This forces Prague Technology to rely on Huawei Ascend 910B/920 chips or domestic
              equivalents that have 40-60% fewer FLOPs per dollar than NVIDIA H100 — materially increasing training
              costs and extending timelines. Legal risks include: (1) IP risk — Prague has no patents and its core
              technology (world model architecture) is largely in the public domain through academic publications;
              competitors can replicate Prague's approach without IP barriers; (2) labor law risk — China's restrictive
              non-compete rules for AI researchers may create talent acquisition conflicts with Alibaba; (3) data law
              risk — China's Personal Information Protection Law (PIPL) and Data Security Law create obligations when
              processing robot sensor data containing personal information. Geopolitical risk extends to investment
              risk: if US sanctions target Chinese AI companies specifically, HongShan's US LP base and Tencent's
              cross-border activities could create secondary sanctions risk for investors.
