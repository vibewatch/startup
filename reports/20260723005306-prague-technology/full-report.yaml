      - number: '1.2'
        title: Founder and Leadership
        blocks:
          - type: paragraph
            body: >-
              Lin Junyang (Justin Lin) is the sole publicly known founder and leader of Prague Technology. Born in 1993,
              he earned a bachelor's degree in English from the University of International Relations and a master's
              degree in linguistics and natural language processing from Peking University's School of Foreign
              Languages. In 2019 he joined Alibaba's DAMO Academy as a fresh graduate, initially working on NLP in
              search and recommendation scenarios and early multimodal projects including M6. At the end of 2022,
              Alibaba restructured its AI teams into the Tongyi Lab system, and Lin was appointed technical head of the
              Tongyi Qianwen (Qwen) series of large language models. Under his leadership, Qwen evolved from an internal
              project to one of the world's most-downloaded open-source LLM families, with over 1 billion downloads
              globally and more than 200,000 derivative models by early 2026. He became the youngest P10-level technical
              executive in Alibaba's history—a designation that marks the highest individual technical contributor rank.
              On March 3, 2026, he was informed of a proposed restructuring that would split the Qwen team into separate
              pre-training, post-training, text, image, and voice teams, removing its organizational independence. The
              following morning he announced his departure. In his subsequent essay 'From Reasoning Thinking to Agentic
              Thinking' he articulated his thesis that the next AI paradigm would center on agentic systems—AI that
              acts, not merely thinks. In October 2025, while still at Alibaba, he had begun forming a small internal
              team focused on robotics and embodied intelligence, anticipating this direction. The founding team beyond
              Lin is small—initially 1 to 10 people drawn from ByteDance, Tencent, and international backgrounds. No
              other named executives or board members have been publicly disclosed.
