      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The AI Brain Layer Is the Bottleneck — and the Bet
            body: >-
              With only ~100 companies globally active in embodied large models versus 8,000+ hardware suppliers, Prague
              Technology is targeting the single most under-represented and highest-leverage node in the embodied AI
              value chain. If world models become the standard 'operating system' for physical robots — as foundation
              models became the standard for software AI — the model provider could capture a disproportionate share of
              long-run industry economics.
            calloutType: insight
            claimRefs:
              - CM026
              - CM034
          - type: callout
            title: Market Sizing Estimates Are Unreliable for Decision-Making
            body: >-
              The 65x range between conservative ($23B) and aggressive ($1.5T) 2030 global market estimates reflects
              definitional chaos rather than analytic disagreement. Prague Technology's investors are effectively
              betting on qualitative market architecture — that AI brains will become a software layer — not on any
              quantifiable near-term addressable market.
            calloutType: risk
            claimRefs:
              - CM037
              - CM009
          - type: callout
            title: Commercial Revenue Timeline Is 2028 at the Earliest
            body: >-
              Independent analyst base-case for reliable unattended humanoid autonomy is 2028–2030. Prague Technology,
              as a pre-product company founded in mid-2026, faces a minimum 2-year development phase before any OEM
              customer can integrate its model — pushing first meaningful revenue to 2028+ under optimistic assumptions.
            calloutType: risk
            claimRefs:
              - CM039
              - CM038
          - type: callout
            title: China Domestic Demand Will Absorb World Model Output Despite Export Controls
            body: >-
              This chapter assumes that China's large domestic embodied AI deployment ecosystem — 16+ companies valued
              over ¥10B, BYD/NIO/SAIC automotive deployments — provides sufficient demand for Prague Technology without
              needing to export its models. If US-aligned export controls restrict Chinese world model adoption by
              foreign OEMs, the accessible market is domestic only.
            calloutType: assumption
            claimRefs:
              - CM033
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitor Landscape Overview
        blocks:
          - type: paragraph
            body: >-
              Prague Technology competes in three overlapping arenas: (1) Chinese full-stack embodied AI companies that
              combine hardware and AI brain development; (2) global pure-software world model startups; and (3) large
              technology companies building embodied AI capabilities internally. The direct competitor set for Prague's
              world model/AI brain focus is smaller but exceptionally well-funded: TARS AI has raised $697 million
              across two rounds, Spirit AI has raised $435 million at a $1.5 billion valuation, AMI Labs (Yann LeCun)
              has raised $1.03 billion at $3.5 billion, and World Labs (Fei-Fei Li) has raised more than $1 billion at a
              reported $5 billion valuation target. Prague Technology at $220 million raised and $2 billion valuation
              sits in the middle of this peer set by funding but at the high end by implied revenue multiple — an
              important distinction for risk assessment. The incumbent threat from ByteDance — which has declared world
              models its top AI priority with a ¥200 billion capital expenditure budget — is possibly the most
              significant structural competitive risk Prague faces, as ByteDance possesses orders of magnitude more
              compute, data, and distribution. Substitutes and status-quo alternatives that Prague must displace
              include: (a) fine-tuned LLMs repurposed for robot control (adequate for narrow tasks today); (b)
              vision-language-action (VLA) models from open-source projects like OpenVLA and RT-X; and (c) hardware OEM
              in-house AI development — AgiBot and Unitree are both investing in proprietary AI models, reducing their
              dependence on external brain providers. Likely entrants include any major Chinese internet company (Baidu,
              NetEase, Xiaomi) that pivots compute budgets toward embodied AI, and any global AI lab (Anthropic, xAI)
              that extends into physical AI.
