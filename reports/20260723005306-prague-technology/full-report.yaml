      - number: '8.3'
        title: Scenario Analysis and Return Profiles
        blocks:
          - type: paragraph
            body: >-
              Three scenarios frame the range of outcomes for a hypothetical investment at Prague Technology's $2
              billion valuation. In the bull case (25% probability), Lin Junyang ships a viable embodied AI foundation
              model within 18 months, secures two or more marquee industrial or robotics partners by end-2027, and rides
              the embodied AI market to a $15-20 billion valuation by 2029, yielding 7-10x on current entry, with
              potential for a partial secondary or pre-IPO tender. In the base case (45% probability), Prague executes
              on model development but struggles to commercialize due to market fragmentation, data access constraints,
              and Chinese robotics OEM reluctance to share proprietary datasets; valuation reaches $5-7 billion by 2030,
              implying a 2.5-3.5x return on entry — reasonable for venture but not exceptional given the risk premium.
              In the bear case (30% probability), product timelines slip beyond 24 months, US export controls restrict
              key compute hardware, a competing Chinese foundation model achieves commercial traction first, or key team
              departures erode the thesis; in this scenario the company raises a down round or is acquired for $500
              million-$1 billion, implying substantial loss at a $2 billion entry. The probability-weighted expected
              return — approximately 3x gross, before fees and carry — is positive but underpowered for the risk profile
              of a company with no revenue, no product, and a founding date of May 2026. An investor capturing a 10%
              stake would achieve a meaningful absolute return only in the bull case; in the bear scenario a $220
              million check is substantially impaired. Entry discipline (negotiating enhanced information rights,
              pro-rata, and anti-dilution provisions) is essential at this valuation level.
            claimRefs:
              - CV016
              - CV017
              - CV018
              - CV019
              - CV020
