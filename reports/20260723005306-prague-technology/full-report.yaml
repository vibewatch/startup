        - Translate world model output into low-level motor commands for OEM robot actuators
        - Per-OEM hardware SDK integration; proprioceptive feedback loop
        - Requires OEM-specific integration work; not a general-purpose layer without standardization effort
      - - Training data infrastructure
        - Generate, label, and manage synthetic + real-world embodied interaction data at billion-example scale
