  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Definition and Scope
        blocks:
          - type: paragraph
            body: >-
              The market relevant to Prague Technology is embodied intelligence — AI systems that perceive, reason, and
              act in physical environments through hardware carriers such as humanoid robots, industrial arms,
              autonomous vehicles, and service robots. This market is distinct from pure software AI (large language
              models deployed in the cloud) or traditional pre-programmed industrial robots that operate with fixed,
              rule-based logic. The relevant spend boundary includes: (1) AI foundation model and world model software
              for embodied agents; (2) complete humanoid robot and mobile manipulation systems; (3) upstream components
              (servo motors, sensors, batteries, actuators); (4) system integration and deployment services; and (5)
              data collection and simulation infrastructure for model training. Status-quo substitutes that Prague
              Technology and its addressable customers must displace include fixed-program industrial robots, human
              labor in manufacturing, and VLA (vision-language-action) models that preceded world models. Adjacent
              markets include autonomous vehicles and drone intelligence, which share technical overlaps but have
              distinct regulatory regimes and buyers. China's embodied AI sector is dominated by hardware companies with
              ~85% of companies privately held and state capital participating in approximately 4% of entities. The
              software/AI-brain layer — Prague Technology's intended space — constitutes a recognized bottleneck: only
              approximately 100 companies globally are actively developing embodied large models, contrasted with 8,000+
              upstream hardware suppliers. China's domestic market shows strong regional concentration, with Guangdong,
              Zhejiang, Jiangsu, Shanghai, and Beijing collectively accounting for over two-thirds of all companies, and
              Guangdong alone generating 78.7% of total sector sales revenue in January–May 2026.
            claimRefs:
              - CM001
