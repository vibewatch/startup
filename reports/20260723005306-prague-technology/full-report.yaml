      - number: '2.2'
        title: 'Market Sizing: TAM, SAM, and SOM'
        blocks:
          - type: paragraph
            body: >-
              Multiple sizing lenses exist for the global and China embodied AI markets, and they diverge widely —
              reflecting definitional disagreements rather than forecasting errors. The most conservative bottom-up
              estimate, based on current humanoid and embodied robot deployments, places the global embodied AI market
              at $4.44 billion in 2025, growing at 39% CAGR to reach approximately $23 billion by 2030. The most
              expansive estimate comes from IDC, which projects the global embodied AI market — defined broadly to
              include all physical AI-adjacent categories including autonomous vehicles, industrial automation software,
              and smart manufacturing — will reach $1.5 trillion by 2030. China's State Council Development Research
              Center projects China's domestic embodied AI market alone will exceed ¥1 trillion ($140 billion) by 2035.
              These estimates are not directly comparable: the IDC figure includes spend categories such as EV software
              and manufacturing IT that most practitioners would not classify as embodied AI. For investment activity,
              which is the most contemporaneous indicator of market momentum, China attracted $3.3 billion in robotics
              and embodied AI venture capital in Q1 2026 alone across 126 deals — the largest single quarter ever
              recorded. H1 2026 total China embodied AI and robotics financing exceeded ¥46 billion ($6.4 billion)
              across 288 events involving 226 companies. Globally, total robotics venture funding in 2025 was $13.8
              billion, with humanoid-specific investment having grown approximately 143x over four years. Prague
              Technology's serviceable addressable market is the AI brain and world model software layer, which
              currently has minimal disclosed standalone revenue but is described by leading analysts as the primary
              bottleneck and highest-value node in the emerging stack. Based on the analogy with foundation models in
              software AI — where model API providers capture 10–15% of downstream application value — a very rough SOM
              estimate for world model licensing in China by 2030 is $4–8 billion, though this figure is speculative and
              lacks source-backed confirmation.
