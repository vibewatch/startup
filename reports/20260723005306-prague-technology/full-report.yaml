            body: >-
              Prague Technology's unit economics cannot be assessed because neither revenue nor costs are disclosed.
              However, the structural cost drivers for a world model development company are well-understood from
              industry comparables. The primary cost component is AI compute: training a frontier world model requires
              compute budgets comparable to or exceeding frontier LLM training runs, which range from tens of millions
              to hundreds of millions of dollars per training iteration. At the scale of Qwen3.5's 397B-parameter MoE
              model, training costs are measured in the tens of millions per run. World models may require even more
              compute due to the multi-modal physical simulation requirements of embodied AI training. Talent
              acquisition and retention is the second largest cost driver — frontier AI researchers command compensation
              packages of $500K to $3M per year at leading labs, and building a competitive team of 50-100 researchers
              would require $50-150M in annual compensation at market rates. Infrastructure and cloud compute fees (or
              owned GPU clusters if Prague acquires hardware) represent a significant capital expenditure. The positive
              cost structure argument is that Prague has no hardware COGS, no manufacturing overhead, no inventory, and
              no physical distribution — meaning gross margins could exceed 80% at revenue scale if the product is
              purely software licensing. The adverse cost argument is that compute costs are subject to GPU export
              controls that restrict NVIDIA H100/H200 access for Chinese companies, forcing reliance on domestic
              alternatives (Huawei Ascend, domestic GPUs) that may have inferior price-performance ratios. The US has
              imposed tariffs of approximately 25% on NVIDIA H200 AI chips bound for China, materially increasing
              training cost inflation for all Chinese AI model developers.
