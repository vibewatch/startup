    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and Founding
        blocks:
          - type: paragraph
            body: >-
              Prague Technology is the English trade name for the AI lab founded by Lin Junyang in mid-2026 in Shanghai,
              China. The company operates under multiple legal entities: 上海卜拉格科技有限公司 (Shanghai Bulage Technology Co.,
              Ltd.), registered on May 27, 2026, in which Lin holds 99% of shares and serves as executive director,
              general manager, and financial officer; and 语用（上海）科技有限公司 (Yuyong Shanghai Technology Co., Ltd.),
              registered May 13, 2026, in which Lin holds 100% of shares. A third entity, Shanghai Gewuzhiyong
              Management Consulting Partnership, is controlled through Bulage Technology. The names are deliberate
              linguistic wordplay: 卜拉格 (Bulage) is a phonetic transliteration of 'Pragmatics', while 语用 (Yuyong) is the
              semantic Chinese translation of 'Pragmatics'—both referencing the field of linguistic pragmatics that
              underpins Lin's academic background. The company is headquartered in Xuhui District, Shanghai. As of the
              report date (July 2026), the company has no official public website, no disclosed product, and no reported
              revenue. It has publicly disclosed its focus areas as world models and the 'embodied brain' for physical
              AI systems. Lin Junyang left Alibaba on March 3–4, 2026, following an internal restructuring meeting,
              posting 'me stepping down. bye my beloved qwen' on social media. He formed his startup entities in
              May–June 2026 after a brief period of reflection and strategic planning.
