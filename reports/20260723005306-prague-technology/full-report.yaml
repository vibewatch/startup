      - number: '7.3'
        title: Operational, Technical, and Dependency Risks
        blocks:
          - type: paragraph
            body: >-
              Prague Technology's operational and technical risks flow directly from its product development stage. The
              core technical risk is world model development failure: world models for embodied AI remain an unsolved
              research problem as of July 2026 — DeepMind's Genie 2 demonstrated world model viability for game
              environments but physical robot control at commercial reliability remains unachieved by any company
              globally. If the technical approach fails or requires substantially longer development than projected,
              Prague's $220M capital base will be depleted before achieving commercial validation. The sim-to-real
              transfer gap is the most concrete operational risk: synthetic training data from physics simulations fails
              to capture real-world sensor noise, surface properties, and environmental variation — requiring extensive
              real-world data collection from OEM robot partners. Without OEM data partners (Prague has zero as of July
              2026), the world model may not generalize beyond simulation. Inference latency is a critical operational
              constraint: robot control requires responses at 30-100Hz for reactive motions, but world model inference
              at commercial scale typically operates at 2-10Hz — a 10-30x gap that must be closed through model
              distillation, hardware optimization, or hybrid architectures before any OEM deployment is possible.
              Dependency risks center on three critical external parties: (1) Tencent — provides compute access and
              potential customer channel; dependency risk if the relationship sours or Tencent's regulatory situation
              changes; (2) Chinese domestic GPU manufacturers (Huawei, Biren, Cambricon) — Prague is forced to rely on
              inferior domestic chips due to export controls; if domestic GPU supply is disrupted (geopolitical,
              production failure), Prague's training schedule is disrupted; (3) OEM robot data partners — Prague needs
              3-5 OEM companies to commit training data before the world model will generalize; any refusal creates a
              data gap that cannot be filled with simulation alone. Partner/dependency risk from Gaorong and HongShan is
              low — both are established top-tier China VCs with strong LP bases and long-term investment horizons. The
              risk with investors is not abandonment but the potential for pressure to pivot or cut costs if 2027
              milestones slip.
