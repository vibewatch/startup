            body: >-
              Prague Technology's critical technical dependencies create both strategic advantages and material
              vulnerabilities. On the advantage side, Lin Junyang's architectural expertise, team talent network from
              Alibaba/Qwen, and deep relationships with China's OEM robotics ecosystem provide differentiated access to
              the human capital and data partnerships needed to execute the world model strategy. On the vulnerability
              side, Prague faces three critical technical dependencies: (1) GPU compute access constrained by US export
