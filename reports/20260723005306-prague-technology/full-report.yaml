      - number: '8.4'
        title: Recommendation, Diligence Asks, and Thesis Breaks
        blocks:
          - type: paragraph
            body: >-
              The overall investment verdict for Prague Technology is neutral — a conditional hold or watch-list
              position rather than an outright invest or pass. The founder quality and market timing are genuinely
              exceptional; Lin Junyang's hands-on construction of Qwen, China's leading open-source LLM, is a credential
              that few embodied AI founders globally can match. The $2 billion entry valuation is not egregious relative
              to comparables. However, the company's extreme youth (founded May 2026), zero product traction, China
              regulatory and geopolitical exposure, and a funding structure dominated by Chinese venture capital without
              disclosed Western crossover or strategic investors create risk that is difficult to price with confidence
              at this stage. A neutral stance reflects the view that the opportunity is real but that better evidence
              points exist in the next 6-12 months: a demo of proprietary world model architecture, a strategic
              partnership with a major robotics OEM, first disclosed research publications, or a team expansion that
              signals Lin is recruiting world-class researchers. Any of these would shift the stance toward invest.
              Thesis-break triggers that would move the stance to pass include: a confirmed product delay beyond Q4
              2027, departure of Lin Junyang or two or more key co-founders, a down round at below $1.5 billion, loss of
              HongShan or Gaorong support, or a geopolitical event restricting cross-border AI research collaboration.
              Final diligence asks include full capitalization table disclosure, technical architecture documentation,
              compute resource access plan, and research roadmap with milestones.
            claimRefs:
              - CV025
              - CV026
              - CV027
              - CV028
              - CV029
              - CV030
