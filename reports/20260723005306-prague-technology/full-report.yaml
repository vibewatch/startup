      - number: '5.2'
        title: Technical Stack and AI Architecture
        blocks:
          - type: paragraph
            body: >-
              Prague Technology's technical architecture can only be inferred from Lin Junyang's prior work on Qwen and
              from the broader world model research landscape. Lin Junyang led the Qwen 2.5 and Qwen 3.5 model families,
              which introduced several architectural innovations relevant to embodied AI world models: (1)
              Mixture-of-Experts (MoE) architecture allowing conditional computation across specialized subnetworks,
              which reduces inference cost for complex multi-modal reasoning; (2) hybrid thinking modes combining fast
              reactive responses with slow deliberate reasoning (analogous to System 1/System 2 cognition) — directly
              applicable to robot control where some responses must be sub-100ms reactive while others require
              multi-step planning; (3) multimodal encoders for visual and spatial understanding; (4) large-scale
              distributed training infrastructure capable of training 397-billion-parameter models. These capabilities
              directly map onto the core technical requirements for a world model: a multimodal encoder (visual +
              proprioceptive + language inputs), an internal state model (physical world dynamics), a planning module
              (goal-conditioned trajectory generation), and a robot control interface (action outputs). Physical
              Intelligence's π0 demonstrated that a 3-billion parameter VLA model trained on diverse robot data can
              achieve one-shot generalization across 68+ tasks — but it still relies on short-horizon action prediction
              rather than physical world simulation. DeepMind's Genie 2 showed that a 10-billion parameter world model
              trained on video can generate consistent 3D interactive environments from a single image, demonstrating
              the viability of world model approaches for physical simulation. Prague's technical approach likely builds
              on both precedents but targets a model specifically optimized for Chinese OEM robot data, manufacturing
              environments, and dexterous manipulation tasks. The key technical risks are: (a) world models require
              substantially more training data diversity than VLAs — requiring OEM data partnerships that do not yet
              exist; (b) real-time inference for robot control (30-100Hz) at world model scale is computationally
              demanding and may not be feasible with current hardware; (c) safety and reliability for physical systems
              introduces new technical requirements beyond software AI benchmarks.
