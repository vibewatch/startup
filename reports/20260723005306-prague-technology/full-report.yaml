  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Vision and Architecture
        blocks:
          - type: paragraph
            body: >-
              Prague Technology's product vision is a world model for embodied AI — an AI brain layer that enables
              humanoid robots and physical systems to perceive, model, and predict the physical world with sufficient
              fidelity to execute dexterous, multi-step tasks autonomously. Unlike vision-language-action (VLA) models
              that map sensory inputs directly to motor actions via imitation learning, Prague's intended world model
              approach operates at a higher cognitive layer: it learns an internal representation of how the physical
              world behaves, allowing robots to plan actions by mentally simulating future states before executing. This
              is the same cognitive approach that LeCun proposed for autonomous driving and AMI Labs is pursuing for
              general embodied AI. Prague's differentiation is the specific focus on China's OEM robotics industry and
              the founder's deep expertise in multimodal, large-scale model architectures from Qwen. Lin Junyang led
              development of Qwen's multimodal architecture — enabling video understanding, image reasoning, and
              cross-modal retrieval — which are all foundational capabilities for world model development. The product
              definition in customer workflow terms is: an OEM (robot manufacturer) integrates Prague's world model as
              the cognitive layer in their robot's compute stack, replacing or augmenting proprietary
              perception-planning modules with a general-purpose AI brain that works across diverse manipulation tasks
              without task-specific re-training. The value proposition is reduced integration cost per new task,
              improved generalization across environments, and access to a continuously improving foundation model
              trained on multi-OEM data. No product demo, whitepaper, architecture blog post, or benchmark result has
              been publicly released by Prague Technology as of July 2026.
