              (AgiBot, Unitree, UBTECH, etc.) — without access to diverse robot-environment interaction data, a world
              model will overfit simulation and fail to transfer to real environments; (3) simulation infrastructure for
              generating synthetic training data at scale — building or licensing a high-fidelity physical simulation
              environment comparable to NVIDIA Isaac Sim or Genesis is a major technical project in itself. Regarding
              IP, Prague Technology holds no known patents or published technical papers as of July 2026. The primary IP
              moat, if any, will come from: (a) architectural innovations in MoE-based multimodal world models, (b)
              proprietary embodied training data accumulated from OEM partnerships, and (c) the data flywheel effect
              that emerges when multiple OEMs contribute training data in exchange for an improving model. The Anthropic
              safety framework and OpenAI's Sora system card both document safety considerations for large-scale
              generative models deployed in physical or consequential domains — Prague will face analogous safety and
              alignment requirements as it moves from research to deployment. Trust, safety, and compliance for physical
              AI systems require robustness testing, safety certifications (ISO 10218 for industrial robots, IEC 62443
              for embedded systems), and compliance with China's generative AI regulations (MIIT Interim Measures for
