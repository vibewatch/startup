        title: Retention, Concentration, and Expansion Risk
        blocks:
          - type: paragraph
            body: >-
              Retention, concentration risk, and expansion pathway analysis for Prague Technology are entirely
              prospective — there is nothing to retain, no customer concentration, and no expansion metric. However, the
              structural characteristics of the world model licensing business create predictable future dynamics that
              can be analyzed now. On retention: once an OEM robot manufacturer integrates Prague's world model as the
              AI brain layer, switching costs will be high — the model will be fine-tuned on OEM-specific data, the
              integration SDK will be embedded in the robot's firmware, and retraining on a competitor's platform
              requires significant engineering resources. This creates a natural sticky, recurring revenue model that is
              favorable for retention. On concentration: the first 3-5 OEM customers will represent 100% of revenue by
              construction; this extreme concentration is the normal state for B2B enterprise AI startups in their first
              12-24 months of commercial operation. The mitigation is securing a diverse set of OEM customers across
              automotive, electronics, and logistics verticals rather than concentrating in a single vertical. On
              expansion: the land-and-expand model for world model licensing would progress from (1) initial API trial
              for 1-2 robot models in a single factory, to (2) full deployment across an OEM's robot fleet, to (3)
              expansion to new OEM manufacturing plants, to (4) data-sharing agreements enabling cross-OEM model
              improvement. The structural challenge is that the expansion model requires accumulating diverse training
              data — which requires more OEM partners — creating a self-reinforcing dynamic that rewards early market
              leaders (TARS AI in China, Physical Intelligence in the US). If TARS AI successfully establishes the
              dominant world model standard for China OEMs before Prague launches, Prague faces a market locked into a
              competitor's ecosystem — the adverse scenario for this chapter.
