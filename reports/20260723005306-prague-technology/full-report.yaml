      - number: '3.2'
        title: 'Direct Competitor Profiles: World Model and AI Brain Layer'
        blocks:
          - type: paragraph
            body: >-
              TARS AI (它石智航), founded February 2025 by former Huawei CTO of autonomous driving Chen Yilun and ex-Baidu
              Apollo president Li Zhenyu, is Prague Technology's most direct Chinese competitor. TARS pursues a
              full-stack strategy combining its own hardware (A-series wheeled industrial robots and T-series bipedal
              humanoids) with the AWE 3.0 general embodied large model. TARS set the China embodied AI financing record
              twice — first with a $242 million angel round in Q2 2025, then with a $455 million Pre-A in April 2026 led
              by Hillhouse and Sequoia China. Its investors span strategic backers (Meituan), financial capital
