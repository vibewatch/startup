      - number: '2.3'
        title: Buyer and Segment Landscape
        blocks:
          - type: paragraph
            body: >-
              China's embodied AI buyer ecosystem is segmented by product type and deployment context. Industrial robots
              remain the largest segment by revenue at approximately 45% of China's market, with automotive OEMs (BYD,
              NIO, SAIC) and electronics manufacturers as the primary payers. Service robots account for roughly 25% and
              address retail, hospitality, and elder-care use cases, with budget authority typically at the facility
              operations or IT level. Humanoid robots are currently the smallest segment at approximately 5% of revenue
              but carry the highest growth rate and attract the most speculative capital. For Prague Technology
              specifically, the most relevant buyer segment is humanoid robot original equipment manufacturers (OEMs)
              who need to license or integrate AI brain models — because Prague Technology has no direct consumer or
              enterprise product and will depend on OEM partnerships to reach end-users. The Yangtze River Delta —
              Shanghai, Jiangsu, Zhejiang — accounts for over 50% of China's embodied AI companies and financing, making
              it the natural geographic focus. Key humanoid OEMs already operating in this space — AgiBot (BYD-backed,
              #1 globally by 2025 humanoid units), Unitree Robotics (5,500+ units shipped in 2025, IPO approved June
              2026), and UBTECH (Hong Kong listed, ¥821M humanoid revenue in 2025) — would be the natural first
              addressable customers if Prague Technology successfully commercializes a world model. Warehouse and
              logistics operators (JD.com, SF Express, Amazon China) are a secondary buyer segment with concrete
              labor-cost ROI and faster procurement cycles than industrial automation. The budget owner for AI brain
              model procurement sits within the CTO or R&D head function at OEMs, with procurement decisions driven by
              model performance benchmarks and integration feasibility rather than price-per-unit.
