      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              China's embodied AI market is driven by a uniquely powerful convergence of policy mandate, software
              maturity, and supply-chain capability. China's 15th Five-Year Plan (2026–2030) designates embodied AI as
              one of six major future industries alongside quantum technology and biomanufacturing — providing both
              explicit policy endorsement and funding priority. The 2026 joint MIIT-SASAC action plan targets 10,000+
              robot deployments by year-end. Industrial funds in Beijing, Shanghai, and Shenzhen are operating at the
              ¥100 billion ($14.5 billion) level. The software prerequisite — large language model maturity — has been
              met by China's own labs: Alibaba Qwen3.5, DeepSeek V4, and ByteDance Seed 1.6 demonstrate world-class
              reasoning that can be repurposed as robot control logic. China's manufacturing supply chain covers
              approximately 70% of global industrial robot components. ByteDance has declared world models its top AI
              priority for 2026, with a ¥200 billion ($29.4 billion) capital expenditure budget. On the constraint side,
              the sim-to-real transfer gap — the difficulty of translating AI trained in simulation to physical robot
              behavior — remains an active research problem, though it is closing through domain randomization, digital
              twin pipelines, and neural radiance fields. Data scarcity for training embodied models is a fundamental
              bottleneck: unlike LLMs trained on internet text, embodied AI models require large-scale physical
              interaction data that is expensive and slow to collect. US export controls on advanced AI chips (NVIDIA
              H100/H200) create sustained hardware procurement risk for all Chinese AI developers, including Prague
              Technology. Capital intensity is extremely high — training world models at scale requires compute budgets
              that even well-funded startups struggle to maintain. The realistic commercial deployment window for
              reliable general-purpose humanoid autonomy is estimated at 2028–2030 in the base case by independent
              analysts, suggesting Prague Technology's commercial revenue timeline extends at least 2–3 years even under
              optimistic assumptions.
