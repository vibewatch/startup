callouts:
  - calloutType: "risk"
    title: "TARS AI is the Most Dangerous Direct Competitor"
    body: "TARS AI has raised $697M (vs Prague's $220M), shipped a world model (AWE 3.0), deployed hardware at manufacturing customers, and built a state capital + tier-1 VC investor coalition that includes the same investors (HongShan) as Prague. Its full-stack hardware+brain strategy collects proprietary training data that Prague cannot replicate through partnerships alone."
    claimRefs: [CP007, CP009, CP010, CP011, CP012]

  - calloutType: "risk"
    title: "Open-Source Substitutes Are an Underappreciated Risk"
    body: "Unitree's open-sourcing of UnifoLM-VLA-0 and Google DeepMind's Open X-Embodiment (RT-X) create a zero-cost baseline that Prague's world model must demonstrably outperform to justify licensing fees. If open-source models reach 'good enough' performance for 80% of factory tasks by 2027, Prague's SOM shrinks to high-complexity specialist applications."
    claimRefs: [CP028, CP031, CP038]

  - calloutType: "strength"
    title: "AMI Labs Sets a Favorable Precedent for Long-Horizon World Model Investment"
    body: "AMI Labs' ability to raise $1.03B at $3.5B pre-money valuation with no product and an explicit multi-year research timeline validates the investor thesis that world model companies deserve patient capital. This precedent reduces fundraising risk for Prague's follow-on rounds."
    claimRefs: [CP015, CP016, CP017]

  - calloutType: "insight"
    title: "ByteDance Is the Undisclosed Competitor Most Likely to Disrupt"
    body: "ByteDance's ¥200B capex, 200M daily users, and world model priority declaration make it the single most dangerous undisclosed market entrant. Unlike VC-backed startups, ByteDance can absorb years of losses and will likely open-source any world model it develops to commoditize the layer and protect its distribution moat — exactly the scenario that would make Prague's AI brain product unsellable."
    claimRefs: [CP029, CP030]

