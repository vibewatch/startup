company:
  name: "Prague Technology"
chapter:
  number: 2
  title: "Market Analysis"
  summary: "China's embodied AI sector is the world's fastest-growing physical AI market, drawing $3.3B in Q1 2026 venture capital alone and projected to surpass ¥1 trillion domestically by 2035. Prague Technology positions itself in the AI brain/world-model software layer, the recognized supply-chain bottleneck, but faces a multi-year path before any commercial traction is plausible."

sections:
  - id: "market-definition-scope"
    title: "Market Definition and Scope"
    body: "The market relevant to Prague Technology is embodied intelligence — AI systems that perceive, reason, and act in physical environments through hardware carriers such as humanoid robots, industrial arms, autonomous vehicles, and service robots. This market is distinct from pure software AI (large language models deployed in the cloud) or traditional pre-programmed industrial robots that operate with fixed, rule-based logic. The relevant spend boundary includes: (1) AI foundation model and world model software for embodied agents; (2) complete humanoid robot and mobile manipulation systems; (3) upstream components (servo motors, sensors, batteries, actuators); (4) system integration and deployment services; and (5) data collection and simulation infrastructure for model training. Status-quo substitutes that Prague Technology and its addressable customers must displace include fixed-program industrial robots, human labor in manufacturing, and VLA (vision-language-action) models that preceded world models. Adjacent markets include autonomous vehicles and drone intelligence, which share technical overlaps but have distinct regulatory regimes and buyers. China's embodied AI sector is dominated by hardware companies with ~85% of companies privately held and state capital participating in approximately 4% of entities. The software/AI-brain layer — Prague Technology's intended space — constitutes a recognized bottleneck: only approximately 100 companies globally are actively developing embodied large models, contrasted with 8,000+ upstream hardware suppliers. China's domestic market shows strong regional concentration, with Guangdong, Zhejiang, Jiangsu, Shanghai, and Beijing collectively accounting for over two-thirds of all companies, and Guangdong alone generating 78.7% of total sector sales revenue in January–May 2026."
    claimRefs: [CM001, CM002, CM003, CM004, CM005, CM006, CM007]
    tableRefs: [TM001]
    figureRefs: [FM001]

  - id: "market-sizing-tam-sam-som"
    title: "Market Sizing: TAM, SAM, and SOM"
    body: "Multiple sizing lenses exist for the global and China embodied AI markets, and they diverge widely — reflecting definitional disagreements rather than forecasting errors. The most conservative bottom-up estimate, based on current humanoid and embodied robot deployments, places the global embodied AI market at $4.44 billion in 2025, growing at 39% CAGR to reach approximately $23 billion by 2030. The most expansive estimate comes from IDC, which projects the global embodied AI market — defined broadly to include all physical AI-adjacent categories including autonomous vehicles, industrial automation software, and smart manufacturing — will reach $1.5 trillion by 2030. China's State Council Development Research Center projects China's domestic embodied AI market alone will exceed ¥1 trillion ($140 billion) by 2035. These estimates are not directly comparable: the IDC figure includes spend categories such as EV software and manufacturing IT that most practitioners would not classify as embodied AI. For investment activity, which is the most contemporaneous indicator of market momentum, China attracted $3.3 billion in robotics and embodied AI venture capital in Q1 2026 alone across 126 deals — the largest single quarter ever recorded. H1 2026 total China embodied AI and robotics financing exceeded ¥46 billion ($6.4 billion) across 288 events involving 226 companies. Globally, total robotics venture funding in 2025 was $13.8 billion, with humanoid-specific investment having grown approximately 143x over four years. Prague Technology's serviceable addressable market is the AI brain and world model software layer, which currently has minimal disclosed standalone revenue but is described by leading analysts as the primary bottleneck and highest-value node in the emerging stack. Based on the analogy with foundation models in software AI — where model API providers capture 10–15% of downstream application value — a very rough SOM estimate for world model licensing in China by 2030 is $4–8 billion, though this figure is speculative and lacks source-backed confirmation."
    claimRefs: [CM008, CM009, CM010, CM011, CM012, CM013, CM014, CM015, CM016, CM017, CM018, CM037]
    tableRefs: [TM002]
    figureRefs: [FM002]

  - id: "buyer-segment-landscape"
    title: "Buyer and Segment Landscape"
    body: "China's embodied AI buyer ecosystem is segmented by product type and deployment context. Industrial robots remain the largest segment by revenue at approximately 45% of China's market, with automotive OEMs (BYD, NIO, SAIC) and electronics manufacturers as the primary payers. Service robots account for roughly 25% and address retail, hospitality, and elder-care use cases, with budget authority typically at the facility operations or IT level. Humanoid robots are currently the smallest segment at approximately 5% of revenue but carry the highest growth rate and attract the most speculative capital. For Prague Technology specifically, the most relevant buyer segment is humanoid robot original equipment manufacturers (OEMs) who need to license or integrate AI brain models — because Prague Technology has no direct consumer or enterprise product and will depend on OEM partnerships to reach end-users. The Yangtze River Delta — Shanghai, Jiangsu, Zhejiang — accounts for over 50% of China's embodied AI companies and financing, making it the natural geographic focus. Key humanoid OEMs already operating in this space — AgiBot (BYD-backed, #1 globally by 2025 humanoid units), Unitree Robotics (5,500+ units shipped in 2025, IPO approved June 2026), and UBTECH (Hong Kong listed, ¥821M humanoid revenue in 2025) — would be the natural first addressable customers if Prague Technology successfully commercializes a world model. Warehouse and logistics operators (JD.com, SF Express, Amazon China) are a secondary buyer segment with concrete labor-cost ROI and faster procurement cycles than industrial automation. The budget owner for AI brain model procurement sits within the CTO or R&D head function at OEMs, with procurement decisions driven by model performance benchmarks and integration feasibility rather than price-per-unit."
    claimRefs: [CM019, CM020, CM021, CM022, CM023, CM024, CM025, CM026, CM027]
    tableRefs: [TM003]
    figureRefs: [FM003]

  - id: "growth-drivers-adoption-constraints"
    title: "Growth Drivers and Adoption Constraints"
    body: "China's embodied AI market is driven by a uniquely powerful convergence of policy mandate, software maturity, and supply-chain capability. China's 15th Five-Year Plan (2026–2030) designates embodied AI as one of six major future industries alongside quantum technology and biomanufacturing — providing both explicit policy endorsement and funding priority. The 2026 joint MIIT-SASAC action plan targets 10,000+ robot deployments by year-end. Industrial funds in Beijing, Shanghai, and Shenzhen are operating at the ¥100 billion ($14.5 billion) level. The software prerequisite — large language model maturity — has been met by China's own labs: Alibaba Qwen3.5, DeepSeek V4, and ByteDance Seed 1.6 demonstrate world-class reasoning that can be repurposed as robot control logic. China's manufacturing supply chain covers approximately 70% of global industrial robot components. ByteDance has declared world models its top AI priority for 2026, with a ¥200 billion ($29.4 billion) capital expenditure budget. On the constraint side, the sim-to-real transfer gap — the difficulty of translating AI trained in simulation to physical robot behavior — remains an active research problem, though it is closing through domain randomization, digital twin pipelines, and neural radiance fields. Data scarcity for training embodied models is a fundamental bottleneck: unlike LLMs trained on internet text, embodied AI models require large-scale physical interaction data that is expensive and slow to collect. US export controls on advanced AI chips (NVIDIA H100/H200) create sustained hardware procurement risk for all Chinese AI developers, including Prague Technology. Capital intensity is extremely high — training world models at scale requires compute budgets that even well-funded startups struggle to maintain. The realistic commercial deployment window for reliable general-purpose humanoid autonomy is estimated at 2028–2030 in the base case by independent analysts, suggesting Prague Technology's commercial revenue timeline extends at least 2–3 years even under optimistic assumptions."
    claimRefs: [CM028, CM029, CM030, CM031, CM032, CM033, CM034, CM035, CM036, CM038, CM039, CM040]
    tableRefs: [TM004]
    figureRefs: [FM004]

