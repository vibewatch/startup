callouts:
  - calloutType: "insight"
    title: "The AI Brain Layer Is the Bottleneck — and the Bet"
    body: "With only ~100 companies globally active in embodied large models versus 8,000+ hardware suppliers, Prague Technology is targeting the single most under-represented and highest-leverage node in the embodied AI value chain. If world models become the standard 'operating system' for physical robots — as foundation models became the standard for software AI — the model provider could capture a disproportionate share of long-run industry economics."
    claimRefs: [CM026, CM034]

  - calloutType: "risk"
    title: "Market Sizing Estimates Are Unreliable for Decision-Making"
    body: "The 65x range between conservative ($23B) and aggressive ($1.5T) 2030 global market estimates reflects definitional chaos rather than analytic disagreement. Prague Technology's investors are effectively betting on qualitative market architecture — that AI brains will become a software layer — not on any quantifiable near-term addressable market."
    claimRefs: [CM037, CM009]

  - calloutType: "risk"
    title: "Commercial Revenue Timeline Is 2028 at the Earliest"
    body: "Independent analyst base-case for reliable unattended humanoid autonomy is 2028–2030. Prague Technology, as a pre-product company founded in mid-2026, faces a minimum 2-year development phase before any OEM customer can integrate its model — pushing first meaningful revenue to 2028+ under optimistic assumptions."
    claimRefs: [CM039, CM038]

  - calloutType: "assumption"
    title: "China Domestic Demand Will Absorb World Model Output Despite Export Controls"
    body: "This chapter assumes that China's large domestic embodied AI deployment ecosystem — 16+ companies valued over ¥10B, BYD/NIO/SAIC automotive deployments — provides sufficient demand for Prague Technology without needing to export its models. If US-aligned export controls restrict Chinese world model adoption by foreign OEMs, the accessible market is domestic only."
    claimRefs: [CM033, CM016]

