  - id: life-sciences-simulation
    title: Life-Sciences and Materials Simulation Competitors
    body: >-
      In life-sciences and materials simulation—where SandboxAQ competes with AI/quantum-powered
      molecular modeling—the most commercially developed incumbents are publicly traded. Schrödinger
      is the market-defining reference in computational drug discovery software, reporting $255.9M
      in total revenue in FY2025 (up 23% year-over-year from $207.5M in FY2024) against a net
      loss of $103.3M. All top-20 pharmaceutical companies (by 2024 revenue) licensed Schrödinger's
      solutions in 2025, and software was used by 1,750+ academic institutions. Schrödinger's
      drug discovery revenue contributed $56.4M in FY2025. Its average ACV per commercial customer
      (ACV ≥$1M) grew to $3.9M in FY2025 from $3.3M in FY2024, demonstrating expanding wallet
      share within its top customer cohort.

      Recursion Pharmaceuticals operates one of the world's largest proprietary biological and
      chemical datasets (~36 PB) and can process up to 2.2 million experimental samples per week
      through its Recursion OS platform. Its TechBio approach integrates biology, chemistry, and
      clinical development into a unified AI-driven intelligence system, with a clinical-stage
      pipeline across oncology, rare disease, and neuroscience. As a public company, Recursion
      provides a scale reference that SandboxAQ's AQAffinity and molecular simulation products
      will eventually need to match in commercialization depth.

      Insilico Medicine, backed by Warburg Pincus and Qiming Venture Partners, offers AI drug
      discovery through its Pharma.ai platform and has collaborated with 10 of the top 20 global
      pharmaceutical companies (by 2021 sales). Its clinical-stage programs and global presence
      in the US, Greater China, and the Middle East make it a directly comparable AI drug
      discovery platform competing for the same pharma and biotech customers as SandboxAQ's
      molecular simulation suite.

      The fundamental competitive challenge for SandboxAQ in this segment: Schrödinger and
      Recursion have years-long pharma relationships, dedicated enterprise sales teams, and
      validated workflows for drug discovery. SandboxAQ's quantum-accelerated simulation
      arguments must translate into measurable outcomes before pharma buyers will displace
      proven computational platforms.
