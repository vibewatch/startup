callouts:
  - calloutType: risk
    title: Incumbent Bundling Is the Primary Competitive Risk in AI-SPM and PQC
    body: >-
      Across both the AI-SPM and PQC segments, the single largest competitive risk to SandboxAQ
      is not a peer startup but an incumbent with distribution power: Palo Alto Networks in AI-SPM
      (Prisma Cloud AI-SPM bundled into existing CISO relationships), IBM in PQC crypto management
      (Guardium + quantum-safe transformation services embedded in existing enterprise contracts),
      and now Google Cloud in AI-SPM via the Wiz acquisition. In all three cases, the buyer
      default is the incumbent's existing relationship. SandboxAQ must win a competitive POC
      against a pre-approved vendor in an enterprise budget already committed to a platform.
    claimRefs:
      - CP007
      - CP009
      - CP011
      - CP028
      - CP031
      - CP047

  - calloutType: strength
    title: Multi-Segment Presence Creates Cross-Sell Option Value Unavailable to Focused Rivals
    body: >-
      While focused rivals (PQShield in PQC hardware IP, Protect AI in model security, Schrödinger
      in drug discovery) have deeper product depth in single segments, none can offer an enterprise
      buyer a single platform spanning PQC migration, AI runtime security, molecular simulation,
      and navigation hardening. For government agencies or large defense contractors requiring
      capability across multiple of these domains, SandboxAQ's platform breadth is a genuine
      cross-sell and sole-source advantage not available from any peer competitor.
    claimRefs:
      - CP032
      - CP033
      - CP037
      - CP043

