      severity: material
      topic: customer-metrics
      missingEvidence: "Total customer count, top-10 customer revenue concentration, average contract value (ACV), net revenue retention (NRR), and customer acquisition cost (CAC)."
      whyItMatters: "Without these metrics, revenue concentration risk, expansion dynamics, and sales efficiency are all opaque."
      diligencePath: "Request anonymized customer list with ACV bands; concentration analysis with top-10 share of total ARR; NRR by vintage cohort."
      relatedQuestionRefs:
        - QI003

