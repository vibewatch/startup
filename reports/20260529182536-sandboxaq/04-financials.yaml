        - Estimated 12–24+ months depending on burn and revenue offset
        - Low-confidence estimate; assumes mid-range burn with modest revenue growth
        - Cannot underwrite without verified burn and revenue data
      - - Debt / project finance obligations
        - None publicly disclosed
        - No public information on debt facilities
        - Absence of evidence is not evidence of absence; request confirmed debt-free status
    notes: >
      Capital adequacy fields relying on estimates are clearly labeled. The $95M secondary offering
      (July 2025) provided employee liquidity and did not constitute primary operational funding.
      Runway and burn-rate estimates are approximate and carry low confidence. Company Overview chapter
      contains the full funding chronology; this table focuses on adequacy, not history.
    claimRefs:
      - CI017
      - CI018
      - CI025
      - CI031
      - CI032

  - id: TI008
    title: Public Financial Disclosure Gaps
    columns:
      - Missing Metric
      - Why It Matters
      - Impact on Analysis
      - Diligence Path
    rows:
      - - Audited revenue by product line / segment
        - Determines actual vs. estimated ARR; segment-level growth rates
        - Without this, valuation underwriting is speculative
        - Request management accounts or investor-letter revenue disclosures
      - - Gross margin (by segment and blended)
        - Determines long-run business model scalability and pricing power
        - Cannot assess software-vs-services mix or margin trajectory
        - "Request COGS breakdown: R&D vs. delivery vs. hardware; gross margin by vertical"
      - - Monthly burn rate and runway
        - Determines capital adequacy and urgency of next raise
        - Cannot assess dilution risk or going-concern risk
        - Request CFO-prepared cash-flow model with 18-month runway projection
      - - Customer count and concentration (top-10 revenue)
        - Determines concentration risk and market validation breadth
        - No public data on account count; DoW CIO and Accenture could be 50%+ of revenue
        - Request anonymized top-customer revenue list; concentration limits
      - - Net revenue retention (NRR)
        - Key indicator of product-market fit and expansion dynamics
        - Cannot assess whether core AQtive Guard cohorts expand or churn
        - Request NRR by product vintage and customer segment
      - - Government contract values (DoW CIO, USAF)
        - Largest disclosed commercial signals; value determines revenue quality
        - Without TCV or ACV, government revenue base is unquantifiable
        - FOIA request or management disclosure; include in data room
      - - Headcount and compensation cost breakdown
        - Determines burn composition and scientific-talent retention risk
        - Cannot model operational leverage without compensation structure
        - Request role-level headcount, vesting schedule, and equity overhang
    notes: >
      All gaps reflect standard private-company information asymmetry. No adversarial inference is
      implied about the company's health; these gaps are standard due-diligence requests for any
      deep-tech growth-stage company with this capital structure.
    claimRefs:
      - CI029
      - CI030
      - CI033

