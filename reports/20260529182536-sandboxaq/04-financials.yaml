  - id: cost-structure
    title: Cost Structure and Capital Intensity
    body: >
      SandboxAQ's cost structure is driven by research and development expenditure, scientific talent
      acquisition, high-performance computing infrastructure, and growing go-to-market investment.
      The company has publicly disclosed a workforce of more than 87 PhDs and 110 engineers as of
      mid-2025, with overall headcount estimated at approximately 200–350 (various sources cite
      different snapshots). Scientific talent at this density carries compensation costs comparable
      to deep-tech research organizations, with total cost-per-employee significantly above software
      industry median. No gross margin, EBITDA, or operating cost breakdown has been disclosed.

      Capital intensity is further elevated by bespoke quantum sensing hardware for AQNav and CardiAQ,
      computational chemistry simulation workloads requiring HPC infrastructure (GPU/TPU clusters),
      and the cost of multiple long-running clinical and government research programs. A collaboration
      with NVIDIA integrated CUDA-accelerated DMRG algorithms, which implies continued compute costs
      on GPU infrastructure. The $95M July 2025 secondary offering was structured solely for employee
      liquidity, not operational funding, which limits inference about near-term burn coverage.

      The cadence of primary rounds ($500M in Feb 2023, >$300M in Dec 2024, +$150M in Apr 2025)
      implies aggregate net cash deployment of approximately $950M over 3 years, or ~$315M annually—
      a rough but conservative proxy for cumulative burn plus investment before any revenue offset.
      If 2024 revenue was ~$17.8M (LATKA estimate), the revenue-funded fraction of operations would
      be modest relative to total capital consumed. Specific quarterly burn, gross margin, capex, and
      runway are unavailable from any public source.
    claimRefs:
      - CI020
      - CI021
      - CI022
      - CI023
      - CI024
      - CI025
