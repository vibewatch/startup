  name: SandboxAQ

chapter:
  number: 4
  title: Financials
  summary: >
    SandboxAQ is a private, venture-backed B2B enterprise AI company with over $950 million raised
    across five rounds through April 2025 (plus a $95M secondary in July 2025), at a $5.75B
    post-money valuation. Third-party data-aggregator LATKA estimates 2024 ARR at $17.8M, up from
    $10.6M in 2023, implying a ~315× revenue multiple at last formal valuation—a gap that reflects
    the company's early-commercialization stage and heavy pre-revenue R&D investment. Operating
    financials (burn, gross margin, runway, ARR by segment) are entirely undisclosed; revenue quality,
    margin trajectory, and capital adequacy cannot be underwritten from public data alone.

sections:
  - id: revenue-model
    title: Revenue Model and Commercialization Architecture
    body: >
      SandboxAQ operates as a B2B enterprise SaaS company delivering AI and quantum-technique
      solutions across four primary verticals: cybersecurity (AQtive Guard), biopharma simulation
      (AQBioSim), materials and chemistry (AQChemSim), and GPS-independent navigation (AQNav).
      An emerging fifth vertical, cardiac diagnostics (CardiAQ), remains in clinical investigation.
      The monetization mechanism for software platforms appears to be software subscription licensing,
      professional services, and government research contracts, though SandboxAQ has not published
      list pricing or contract structures for any product line. The company has confirmed enterprise
      and government deployments but has not disclosed customer count, average contract value,
      renewal rates, or revenue by segment.

      Commercially disclosed customer relationships include Accenture (expanded deployment partner for
      AQtive Guard across financial services and life sciences), AstraZeneca and Sanofi (AQBioSim
      biopharma agreements), NOVONIX (battery data for AQChemSim), and the U.S. Department of War CIO
      (five-year AQtive Guard cryptographic-discovery agreement signed December 2025). The U.S. Air
      Force awarded a SBIR Phase 2B TACFI contract extension in August 2024 for AQNav magnetic
      navigation development. Boeing and Airbus subsidiary Acubed are also publicly referenced as
      AQNav test partners. Mount Sinai Health System, UCSF Medical Center, and Mayo Clinic are
      confirmed research collaborators for CardiAQ. These customer-proof engagements corroborate
      commercial traction but do not disclose contract values or revenue contribution.

      Third-party data aggregator LATKA reported SandboxAQ hit $17.8M in revenue in 2024 (up from
      $10.6M in 2023 and $196K in 2022), categorizing the company as an enterprise SaaS business.
      LATKA's methodology relies on company or investor disclosure rather than audited financials,
      and these figures should be treated as informed estimates rather than verified operating results.
      No independent corroboration of these specific figures has been identified.
