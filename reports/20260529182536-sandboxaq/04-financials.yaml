  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: revenue-ARR
      missingEvidence: "Audited or management-confirmed segment-level annual recurring revenue by product division (AQtive Guard, AQBioSim, AQChemSim, AQNav, CardiAQ) and total blended ARR for 2024 and 2025."
      whyItMatters: "Without verified revenue, valuation multiples are unanchored and DCF modelling is impossible. Current data relies on a single third-party aggregator (LATKA) with unverifiable methodology."
      diligencePath: "Request audited financial statements or management-prepared income statement with revenue recognition policy; cross-check with investor relations disclosures."
      relatedQuestionRefs:
        - QI006
        - QI019
        - QI022

    - type: private-evidence-only
      severity: blocking
      topic: burn-rate-runway
      missingEvidence: "Actual monthly cash burn, current cash balance, and runway schedule from the most recent CFO-prepared financial model."
      whyItMatters: "Capital adequacy and next-round timing cannot be assessed without verified burn and cash data. Estimates based on funding cadence carry low confidence."
      diligencePath: "Request quarterly cash-flow statement and CFO-prepared runway projection for 18 months from April 2025 primary close."
      relatedQuestionRefs:
        - QI020

    - type: private-evidence-only
      severity: material
      topic: gross-margin
      missingEvidence: "Gross margin by product segment (software subscription vs. research services vs. hardware/sensor delivery) and blended gross margin."
      whyItMatters: "Gross margin determines revenue model scalability. A services-heavy mix could suppress gross margin to 30–50%; a pure-SaaS mix could be 70–80%+. The actual mix is unknown."
      diligencePath: "Request COGS breakdown by product division; include compensation for delivery teams vs. software amortization vs. hardware costs."
      relatedQuestionRefs:
