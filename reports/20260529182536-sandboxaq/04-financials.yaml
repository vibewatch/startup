  - id: financial-verdict
    title: Financial Verdict and Diligence Priorities
    body: >
      SandboxAQ presents an early-commercialization financial profile typical of deep-tech platform
      companies: multi-hundred-million-dollar capitalizations supporting pre-peak-revenue operations,
      with a widening but not yet self-sustaining revenue base. The $17.8M LATKA-estimated 2024 ARR
      against a $5.6–5.75B valuation (315× revenue multiple) is a diligence red flag in isolation,
      but is contextualized by (1) disclosed government and marquee enterprise customer wins, (2) a
      rapidly growing revenue trajectory from $196K (2022) to $17.8M (2024), (3) 35+ year potential
      in PQC migration, drug discovery, and navigation markets, and (4) high-quality backers including
      T. Rowe Price, NVIDIA, Google, and Ray Dalio.

      The most critical diligence gaps are: (a) verified ARR/revenue by product line and customer
      segment; (b) gross margin by vertical (software licensing vs. research services vs. hardware);
      (c) confirmed cash on hand, monthly burn, and runway duration; (d) contract renewal rates and
      net revenue retention data; and (e) headcount and compensation cost breakdown. Without these,
      no investor can underwrite a fair-value estimate with confidence better than low. The company
      is not a diligence blocker per se—the commercialization trajectory and investor roster are
      credible—but financial opacity is the primary risk to positioning this as anything above a
      medium-confidence investment.
    claimRefs:
      - CI034
      - CI035
      - CI036

callouts:
  - calloutType: risk
    title: Extreme Revenue-to-Valuation Disconnect
    body: >
      LATKA-estimated 2024 ARR of $17.8M against a $5.6B Series E valuation implies a ~315× ARR
      multiple, far above late-stage SaaS norms (10–25×). While option-value pricing is common for
      deep-tech platforms, a downshift in investor sentiment or a funding environment tightening
      could trigger a significant step-down in valuation at the next primary round.
    claimRefs:
      - CI027
      - CI028
      - CI036

  - calloutType: insight
    title: Government as Commercialization Anchor
    body: >
      The December 2025 DoW CIO five-year agreement and the USAF TACFI contract extension represent
      SandboxAQ's highest-quality revenue signals. Government contracts are typically multi-year, low-
      churn, and credit-worthy, and the DoW CIO deal creates a pathway for department-wide AQtive Guard
      deployment beyond the CIO's office. These two programs likely represent the core of SandboxAQ's
      current government revenue base.
    claimRefs:
      - CI007
      - CI008

  - calloutType: risk
    title: Private-Company Opacity Creates Underwriting Constraint
    body: >
      SandboxAQ discloses no GAAP financials, verified ARR, burn rate, runway, or segment-level
      economics. Investors relying on company communications and third-party aggregator data
      (LATKA, Tracxn, Clay) face a materially higher information asymmetry than for comparable
      late-stage public-company investments. This opacity is standard for private companies but
      is specifically flagged by secondary-market analysts as a key risk for SandboxAQ.
    claimRefs:
      - CI029
      - CI030
      - CI033

