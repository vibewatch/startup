  - id: FM004
    title: PQC migration adoption flow — from regulatory trigger to deployment
    type: flow
    layout: standard
    summary: >-
      Illustrates the enterprise journey from regulatory trigger to active PQC deployment,
      showing where crypto-asset inventory, posture management, and migration orchestration
      create commercial opportunity for SandboxAQ.
    data:
      nodes:
        - id: trigger
          label: "Regulatory / risk trigger"
          detail: >-
            NIST FIPS publication (Aug 2024), NSA CNSA 2.0 mandate, CISA guidance, or
            board-level HNDL risk decision initiates the migration program.
          tone: neutral
        - id: inventory
          label: "Cryptographic asset inventory"
          detail: >-
            Enterprise discovers all certificates, keys, algorithms, and protocols across
            hybrid environments. Most enterprises find 2–5x more assets than expected.
            This is the prerequisite for all downstream steps.
          tone: neutral
        - id: assessment
          label: "Quantum-vulnerability risk assessment"
          detail: >-
            Inventory is analyzed for quantum-vulnerable algorithms (RSA, ECC/ECDH, ECDSA)
            and prioritized by data longevity, system criticality, and compliance exposure.
          tone: positive
        - id: planning
          label: "Migration roadmap and governance"
          detail: >-
            Phased migration plan developed: classical → hybrid → full PQC. IBM Consulting
            and Entrust describe this as a multi-year transformation journey requiring
            dedicated program governance.
          tone: positive
        - id: deployment
          label: "PQC algorithm deployment"
          detail: >-
            NIST FIPS 203/204/205 algorithms deployed in priority systems; ongoing monitoring
            and crypto-agility maintained for subsequent phases.
          tone: positive
        - id: monitoring
          label: "Continuous posture management"
          detail: >-
            Ongoing cryptographic posture monitoring, certificate lifecycle automation,
            and compliance reporting. This is the recurring revenue phase for tooling vendors.
          tone: positive
      edges:
        - from: trigger
          to: inventory
          label: "Initiates"
        - from: inventory
          to: assessment
          label: "Feeds"
        - from: assessment
          to: planning
          label: "Informs"
        - from: planning
          to: deployment
          label: "Guides"
        - from: deployment
          to: monitoring
          label: "Transitions to"
    claimRefs:
      - CM001
      - CM002
      - CM009
      - CM027
      - CM028
      - CM035

callouts:
  - calloutType: risk
    title: Slow enterprise crypto-asset inventory adoption constrains near-term SAM
    body: >-
      Despite regulatory mandates, Entrust's 2024 survey found that 54% of organizations lack
      clear ownership for PQC transition and 51% describe managing cryptographic assets as
      extremely difficult. Encryption Consulting data shows most enterprises have 2–5x more
      cryptographic assets than believed. This means the prerequisite step — inventory — is
      still incomplete at most target buyers, compressing the near-term SAM and extending the
      average deal cycle.
    claimRefs:
      - CM013
      - CM027
      - CM028
      - CM038

  - calloutType: insight
    title: CNSA 2.0 creates a hard commercial trigger for the defense-industrial base
    body: >-
      NSA CNSA 2.0 requires all new National Security System acquisitions to use quantum-resistant
      algorithms by January 1, 2027 — a hard compliance deadline that creates a procurement
      forcing function for defense contractors and federal agencies, independent of enterprise
      readiness debates. SandboxAQ's existing DoW CIO agreement positions it to convert this
      regulatory demand into near-term pipeline.
    claimRefs:
      - CM002
      - CM003
      - CM037

  - calloutType: assumption
    title: Life-science and navigation SOM are long-dated, not near-term revenue sources
    body: >-
      This analysis treats life-science simulation and GPS-denied navigation as strategic
      adjacencies with multi-year commercialization paths rather than near-term revenue pools.
      Evidence for SandboxAQ's SOM in these segments is insufficient to size with confidence.
    claimRefs:
      - CM023
      - CM025

