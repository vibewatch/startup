chapter:
  number: 2
  title: Market Analysis
  summary: >-
    SandboxAQ competes across four distinct spend pools — cryptographic posture management /
    post-quantum migration, AI/agentic security (NHI and shadow-AI), life-science AI simulation,
    and defense navigation/sensing — each with its own buyer, budget owner, and maturity curve.
    The PQC software market is small but fast-growing ($0.78–$0.88B in 2026, 30–39% CAGR) and is
    the clearest near-term commercial segment, accelerated by NIST FIPS 203/204/205 finalization
    and NSA CNSA 2.0 mandates. AI drug discovery ($3.25B, 26% CAGR) and NHI security ($12.2B, 12% CAGR)
    are larger but more fragmented; defense navigation/sensing is still emerging as a separate spend
    category. Adoption constraints — long migration cycles, incumbent dominance, budget fragmentation,
    and buyer education — temper the near-term serviceable market.

sections:
  - id: market-scope-and-boundary
    title: Market scope and boundary
    body: >-
      SandboxAQ operates across four partially overlapping but structurally distinct spend pools.
      Defining the boundary precisely is essential because combining them into a single "quantum-AI"
      TAM overstates accessible spend while masking the very different competitive dynamics in each
      segment.

      The first and most commercially mature segment is cryptographic posture management (CPM) and
      post-quantum cryptography (PQC) migration. Included spend covers: cryptographic-asset discovery
      and inventory tooling, certificate and key lifecycle management, post-quantum migration
      orchestration, and compliance/audit reporting tied to NIST and NSA mandates. Excluded spend
      includes: broader PKI hardware (HSMs), classical certificate authorities as a category, and
      network security appliances where PQC is an incremental firmware feature rather than the primary
      purchase driver. The status-quo substitutes are incumbent machine-identity platforms (Venafi,
      Keyfactor) and PKI/HSM vendors (Entrust, Thales, IBM) that are adding PQC modules to existing
      product lines.

      The second segment is AI security posture management, focused on non-human identities (NHIs),
      agentic AI workloads, and shadow AI. This includes: AI-agent identity governance, machine
      credential lifecycle management, and runtime guardrails for agentic AI. Excluded spend includes:
      classical identity and access management (IAM) for human users, endpoint detection, and unrelated
      zero-trust networking. Status-quo substitutes are legacy IAM/PAM platforms (CyberArk, Okta) that
      were not designed for high-velocity autonomous identities.

      The third segment is life-science AI simulation: physics-based molecular dynamics, protein
      structure prediction and affinity scoring, and AI-accelerated drug-candidate screening. Excluded:
      laboratory automation hardware, clinical data management, and general-purpose data analytics
      for pharma that lacks a physics simulation component. Substitutes include Schrödinger, Recursion
      Pharmaceuticals simulation platforms, and internal computational chemistry teams.

      The fourth segment is GPS-denied navigation and quantum sensing for defense platforms including
      UAVs, autonomous ground vehicles, and submarines. Excluded: classical GPS receivers, satellite
      communications, and commercial navigation for aviation. Substitutes include conventional INS
      from Collins Aerospace, Honeywell, and Safran.
