  - id: growth-drivers-and-adoption-constraints
    title: Growth drivers and adoption constraints
    body: >-
      The two strongest demand drivers across SandboxAQ's core PQC segment are regulatory mandates
      and the "harvest now, decrypt later" threat. NIST finalized FIPS 203, 204, and 205 in August
      2024 — the first government-standard post-quantum algorithms — ending an eight-year evaluation
      process and providing the legal and compliance foundation for enterprise migration. CISA's
      Post-Quantum Cryptography Initiative provides interagency coordination and critical infrastructure
      guidance. NSA's CNSA 2.0 creates a hard compliance deadline for the defense industrial base:
      all new National Security System acquisitions must use quantum-resistant algorithms by 2027.

      Despite the regulatory tailwind, actual enterprise migration is constrained by several durable
      factors. Entrust's 2024 global survey found that PQC awareness is high but widespread action
      lags: 51% of organizations describe managing cryptographic assets as extremely or very difficult,
      and 54% cite a lack of clear ownership as a top challenge. Encryption Consulting notes that most
      enterprises have 2–5x more certificates than they think, creating crypto-debt that makes
      baseline inventory — the prerequisite for any migration — itself a multi-year effort. CyberArk
      and other vendors note that long integration cycles, larger PQC key sizes, and ecosystem gaps
      (HSMs, browsers, IoT) mean broad adoption will remain uneven through 2026.

      For the NHI and AI security segment, the primary growth driver is the explosive growth of
      agentic AI deployments. NHIs now outnumber human users by 50:1 to 100:1 ratios in large
      organizations, and the Cloud Security Alliance 2026 survey confirms that fewer than one quarter
      of organizations have documented policies for creating or removing AI identities. This governance
      gap creates urgency but also a sales education challenge: most organizations still manage AI
      identities using legacy IAM tools never designed for autonomous high-velocity systems.

      Budget fragmentation is a cross-cutting constraint. SandboxAQ spans cybersecurity, life sciences,
      and defense — three budget owners that rarely share a procurement conversation. This structural
      reality limits deal sizes and requires separate go-to-market motions for each segment. It also
      means SandboxAQ's total addressable market, while large in aggregate, cannot be pursued as a
      single coherent funnel.
