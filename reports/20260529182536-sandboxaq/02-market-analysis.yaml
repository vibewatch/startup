  - id: segment-sizing-and-estimates
    title: Segment sizing and estimates
    body: >-
      No single analyst covers all four of SandboxAQ's segments under one TAM umbrella, and estimates
      within each segment vary significantly by methodology and included scope. Preserving
      contradictory estimates is more informative than forcing a single number.

      For PQC cryptographic software and services, Research and Markets sizes the market at $0.78B
      in 2026 growing at 30.1% CAGR to $2.23B by 2030. Mordor Intelligence estimates $0.88B in 2026
      growing at roughly 39% CAGR to $4.6B by 2030. Grand View Research applies a broader scope and
      estimates $1.58B in 2025 at 37.8% CAGR through 2033. Some industry commentary projects migration
      services spending reaching $15B by 2030 when including full-stack enterprise migration consulting,
      but this is an extrapolation that bundles hardware replacement and consultancy fees beyond
      pure-software tooling. These estimates are not directly comparable because they differ on whether
      QKD hardware, HSMs, and consulting engagements are included.

      For NHI and AI security posture management, MarketsandMarkets estimates the NHI access
      management market at $12.2B in 2026, growing at 12.2% CAGR to $38.8B by 2036. This is a broader
      market that encompasses classical machine-identity tools; the AI-agent / shadow-AI security
      sub-segment within it does not yet have an independently published TAM. SandboxAQ's AQtive Guard
      targets this sub-segment specifically, which implies a narrower SAM within the NHI total.

      For AI-driven drug discovery and life-science simulation, Mordor Intelligence estimates $3.25B
      in 2026 growing at 25.9% CAGR to $10.29B by 2031. Global Market Insights estimates AI in drug
      discovery exceeded $3.1B in 2025, growing at 30.5% CAGR through 2035. These estimates capture
      software and platform revenue, not the underlying global pharma R&D spend of roughly $194B
      annually that simulation seeks to accelerate.

      For GPS-denied navigation (defense drones and autonomous platforms), FutureMarketInsights sizes
      the GPS-denied drone alternative navigation market at $178.3M in 2026, growing at 9.4% CAGR to
      $438M by 2036. This is specifically the navigation-subsystem market; the broader inertial
      navigation systems (INS) market (including aviation, aerospace, marine) is estimated by
      MarketsandMarkets at $9.42B in 2026 growing to $11.92B by 2030. SandboxAQ's quantum-sensing
      approach targets a niche within this INS market where classical inertial sensors are insufficient.
