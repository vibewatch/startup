  - id: evidence-gaps-and-diligence
    title: Sizing gaps and diligence asks
    body: >-
      Several material sizing gaps limit precision in this analysis. First, no public analyst report
      isolates CPM/PQC pure-software tooling revenue from hardware, consulting, and QKD hardware at
      a level granular enough to derive SandboxAQ's SAM directly. ABI Research published a dedicated
      CPM market trends report in 2026, but detailed forecasts are behind paywall. The estimates
      cited above range from $0.78B to over $1.58B for the PQC software category in 2026 depending
      on scope, suggesting the true SAM for automated cryptographic posture management platforms is
      closer to a few hundred million dollars.

      Second, SandboxAQ's SOM in life-science simulation and GPS-denied navigation is difficult to
      isolate. For life sciences, the company faces deeply entrenched Schrödinger and in-house
      computational chemistry teams; its AQAffinity and OpenFold3 collaborations are still at the
      proof-of-concept/partnership stage without disclosed revenue. The $3.25B AI drug discovery
      market estimate from Mordor covers a wide range of platforms; SandboxAQ's physics-based
      simulation niche is a fraction of this.

      Third, IBM's Guardium Cryptography Manager, Microsoft's CPM guidance published in April 2026,
      and the Entrust/IBM collaboration launched the same month indicate that well-capitalized
      incumbents are mobilizing in the CPM segment. These entities can leverage existing enterprise
      relationships to bundle PQC capabilities into broader security contracts, raising the SandboxAQ
      customer acquisition cost and shortening the window of first-mover advantage.

      Fourth, for GPS-denied navigation, SandboxAQ's quantum-sensing technology must achieve
      hardware maturity and survive defense procurement timelines measured in years, not quarters.
      This segment represents long-term optionality rather than near-term revenue.
