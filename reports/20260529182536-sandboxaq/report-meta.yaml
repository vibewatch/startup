companyProfile:
  summary: >-
    SandboxAQ is a Palo Alto-based private B2B enterprise company that spun out of Alphabet in
    March 2022. It develops and deploys Large Quantitative Model (LQM) technology — physics-informed
    AI trained on numerical and scientific data — across four commercial verticals: post-quantum
    cryptography (AQtive Guard), life-sciences simulation (AQBioSim/AQChemSim), GPS-denied navigation
    (AQNav), and medical sensing (AQMed/CardiAQ). The company is led by CEO Jack Hidary and Board
    Chairman Eric Schmidt and has raised over $950 million since its spinout at an April 2025
    post-money valuation of $5.75 billion.
  foundedDate: "2022-03-22"
  founders:
    - name: Jack Hidary
      role: CEO and Founding Executive
      background: >-
        Previously founded EarthWeb (NASDAQ: DHX) and co-founded Vista Research (sold to S&P/McGraw-Hill);
        authored the O'Reilly textbook on quantum computing; held senior AI roles at Alphabet before leading
        the SandboxAQ spinout.
      claimRefs: [CO010, CO011, CO012]
    - name: Eric Schmidt
      role: Board Chairman
      background: >-
        Former CEO and Executive Chairman of Google/Alphabet; became Chairman of SandboxAQ's Board
        at the March 2022 spinout and is a personal investor in the company.
      claimRefs: [CO013]
  foundingLocation: Palo Alto, California
  headquarters: Palo Alto, California
  productSummary: >-
    AQtive Guard (AI-SPM for post-quantum cryptographic risk management), AQBioSim/AQChemSim
    (physics-informed molecular and chemical simulation for drug discovery and battery design),
    AQNav (GPS-free magnetic-field navigation for defense and aviation), and AQMed/CardiAQ
    (magnetocardiography and clinical AI sensing).
  customerFocus: >-
    Enterprise CISOs and government security offices (PQC); pharmaceutical and materials-science R&D labs
    (simulation); defense/aviation prime contractors and DoD agencies (navigation); health systems and
    medical device developers (sensing).
  businessModel: >-
    B2B SaaS subscription licensing, professional services and implementation, and government research
    contracts (SBIR/TACFI). Accenture, Deloitte, and Ernst & Young act as implementation channel partners.
  stage: Late-stage private (Series E)
  fundingStatus: >-
    Over $950 million raised across five-plus tranches since the March 2022 spinout; most recent primary
    close was the April 2025 Series E at a $5.75 billion post-money valuation. A $95 million secondary
    offering for employee liquidity was completed in July 2025.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO004, CO019, CO020, CO021, CO022, CO029, CI011, CI012, CI013, CI015, CI017]

summary:
  headline: >-
    SandboxAQ is a technically credible Alphabet spinout with real government traction and elite
    investor backing, but a $5.75 B valuation at ~315× unverified ARR demands revenue confirmation
    before a buy case can be supported.
  overallScore: 5.8
  recommendation: track
  confidence: medium
  riskRating: high
  valuationStance: stretched
  keyMetrics:
    valuationUsdM: 5750
    revenueRunRateUsdM: null
    arrUsdM: null
    revenueGrowthYoYPct: null
    grossMarginPct: null
    nrrPct: null
    totalRaisedUsdM: 950
    customerCount: null
    headcount: 250
  topStrengths:
    - >-
      Marquee Alphabet-heritage spinout with Eric Schmidt as Chairman and a board and investor roster
      (Google, NVIDIA, BNP Paribas, T. Rowe Price, Ray Dalio) that signals deep institutional conviction
      in the LQM platform thesis.
    - >-
      Largest confirmed revenue anchor is a five-year U.S. Department of War CIO agreement for AQtive
      Guard cryptographic discovery and migration — the highest-credibility government customer in the
      PQC space, with a pathway to broader DoD adoption.
    - >-
      Technical differentiation via the Large Quantitative Model framework: 80× CUDA-accelerated DMRG
      speedup verified with NVIDIA, production deployment of AQtive Guard at SoftBank, and AQNav
      accumulating 200+ flight hours and 40+ sorties across four aircraft types provide real-world
      validation across verticals.
    - >-
      Multi-vertical optionality hedges single-market concentration risk: PQC, drug discovery, defense
      navigation, and medical sensing address four distinct TAMs, with named enterprise and government
      customers in each.
    - >-
      Regulatory tailwinds are durable: NIST PQC standards finalized in August 2024, CNSA 2.0 mandates
      driving DoD migration timelines, and OMB directives requiring federal agencies to adopt PQC by
      2030-35 create a structural demand catalyst independent of market cycles.
  topRisks:
    - >-
      No publicly verified revenue: LATKA's ~$17.8 M 2024 ARR estimate is the sole available figure and
      is unaudited; without confirmed ARR, the $5.75 B valuation rests entirely on option value, making
      the investment case highly speculative at current pricing.
    - >-
      Extreme EV/ARR multiple (~315× on LATKA estimate) is among the highest in private markets; even
      reaching $100 M ARR would imply a ~58× multiple — well above public-market cybersecurity comps of
      12–31× — leaving very limited downside cushion if growth disappoints.
    - >-
      Multi-product capital intensity across four simultaneous verticals, combined with no disclosed burn
      rate, creates runway uncertainty; rough proxy estimates ($20–35 M/month) suggest cash consumption
      pace that may require additional primary raises before commercial scale is reached.
    - >-
      Competitive exposure on multiple flanks: IBM Quantum Safe and Thales CipherTrust hold incumbent
      distribution in PQC; Isomorphic Labs (Google DeepMind) and Schrödinger are better-funded in AI
      drug discovery; Honeywell and Northrop Grumman have deeper DoD relationships in navigation.
    - >-
      Key-person concentration: public narrative, government partnerships, and investor relationships are
      heavily tied to CEO Jack Hidary, creating execution and continuity risk if leadership changes.
  unresolvedGaps:
    - >-
      Verified segment-level ARR, gross margin by product line, operating loss, and cash position —
      the core financial diligence inputs — remain entirely undisclosed for a $5.75 B private company.
    - >-
      Customer count and net revenue retention (NRR) are unknown; without these the durability of
      existing commercial traction and expansion dynamics within the installed base cannot be assessed.
    - >-
      Burn rate and runway: no public source discloses SandboxAQ's monthly cash consumption or the size
      of its unrestricted cash balance post-Series E, preventing an independent assessment of time to
      self-sufficiency or next capital need.
    - >-
      Headcount remains contested (Yahoo Finance: 101; Tracxn: 348; Cyber Defense Magazine: ~250),
      making R&D capacity and cost structure estimates unreliable.

