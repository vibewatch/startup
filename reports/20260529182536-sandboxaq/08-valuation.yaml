  - id: FV004
    title: Recommendation Logic — SandboxAQ Valuation Chapter
    type: flow
    layout: standard
    summary: >
      Decision chain from evidence pillars through valuation stance to final recommendation.
      Adverse nodes (revenue gap, stretched valuation) outweigh positive nodes under current
      evidence conditions.
    data:
      nodes:
        - id: n1
          label: "Large Multi-Vertical TAM"
          detail: >-
            PQC software, AI drug discovery, quantum navigation each exceed $10B at maturity;
            combined TAM plausibly $30B+. Structural tailwind from NIST mandates and pharma R&D
            investment.
          tone: positive
        - id: n2
          label: "Verified Revenue Gap"
          detail: >-
            No disclosed ARR; LATKA third-party estimate ~$18M (2024). Implied EV/ARR at $5.75B
            entry is ~323×, an extreme outlier versus all public comparables.
          tone: negative
        - id: n3
          label: "Strong Technical Moat and Investor Validation"
          detail: >-
            Alphabet lineage, NVIDIA and Google Series E participation, PQC standard alignment (NIST
            FIPS 203/204/205), and government contract visibility partially support premium.
          tone: positive
        - id: n4
          label: "Valuation Stretched"
          detail: >-
            At $5.75B, even the base case (ARR $150–250M at 15–20×) barely reaches entry price.
            Bear case implies 85–94% downside. Finro Q4 2025 data: applied AI cybersecurity pricing
            toward 8–15× SaaS norms, not frontier-model premiums.
          tone: negative
        - id: n5
          label: "Recommendation: Research More"
          detail: >-
            Wait for ARR disclosure, NRR data, and preference-stack clarity before committing capital.
            Confidence: medium. Valuation stance: stretched. Risk rating: high.
          tone: neutral
      edges:
        - from: n1
          to: n2
          label: "Large TAM meets low current revenue → platform pre-revenue bet"
        - from: n2
          to: n4
          label: "Revenue gap drives 300× implied multiple → stretched valuation"
        - from: n3
          to: n4
          label: "Moat partially offsets but does not resolve the valuation premium"
        - from: n4
          to: n5
          label: "Stretched valuation without revenue validation → Research More"
    claimRefs:
      - CV035
      - CV036
      - CV039

callouts:
  - calloutType: strength
    title: Marquee Investor Conviction Across Financial and Technology Ecosystems
    body: >
      The April 2025 Series E brings together Ray Dalio, Google, NVIDIA, BNP Paribas, T. Rowe Price,
      and Eric Schmidt — a coalition spanning institutional asset management, AI chip infrastructure,
      global banking, and government-adjacent investment. Google and NVIDIA's participation is
      particularly significant, as both have deep technical diligence capabilities and a direct stake
      in SandboxAQ's Large Quantitative Models succeeding as AI-ecosystem complements. The breadth
      and quality of this investor base represents a strong, if not conclusive, signal of platform
      optionality and near-term commercial viability.
    claimRefs:
      - CV001
      - CV002
      - CV028
      - CV029

  - calloutType: risk
    title: Extreme Implied Multiple Requires Rapid Multi-Vertical Revenue Scaling
    body: >
      At the $5.75 billion April 2025 valuation and LATKA's estimated $17.8 million 2024 ARR,
      the implied EV/ARR multiple of approximately 323× exceeds any publicly traded peer in
      cybersecurity, quantum, or AI drug discovery. Even at a generous $100 million estimated ARR
      for 2026, the implied multiple remains 57.5×, above CrowdStrike's current 31× LTM benchmark.
      For the valuation to rationalize within five years at conventional exit multiples (15–30×),
      SandboxAQ must achieve $190–380 million in ARR by 2028–2030 — requiring simultaneous
      commercial traction across PQC software, drug discovery, and navigation without precedent
      in the company's disclosed history. Finro's Q4 2025 analysis confirms that applied AI
      cybersecurity multiples are normalizing toward 8–15×, adding downside convexity.
    claimRefs:
      - CV007
      - CV008
      - CV020
      - CV025
      - CV036
      - CV040

  - calloutType: recommendation
    title: Research More — Stretched Valuation; Await Revenue Validation
    body: >
      Recommendation: Research More. Confidence: medium. Valuation stance: stretched.
      Risk rating: high. Entry at $5.75 billion is not warranted without verified ARR exceeding
      $100 million, NRR data, and a clear cap-table picture. Monitor ARR disclosure events,
      biopharma milestone payments, and government contract awards as leading indicators.
      A thesis-break trigger would include a revenue run-rate below $50 million by end-2026
      or loss of a marquee biopharma partnership. Secondary market bid/ask spreads (Forge/
      EquityZen) provide a real-time valuation check independent of company disclosure.
    claimRefs:
      - CV035
      - CV036
      - CV037
      - CV039

