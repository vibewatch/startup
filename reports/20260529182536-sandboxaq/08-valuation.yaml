  - id: recommendation
    title: Recommendation, Exit Readiness, and Diligence Asks
    body: >
      Recommendation: Research More. The $5.75 billion April 2025 valuation is stretched relative
      to any verifiable revenue metric. Entry at current pricing is not warranted without a
      confirmed revenue run-rate, customer retention data, and a clear picture of preference-stack
      overhang. Confidence is medium, constrained primarily by the absence of disclosed financials
      — a limitation that the evidence clearly establishes rather than obscures. Risk rating is
      high: the company operates in capital-intensive, long-cycle markets with significant execution
      risk across multiple simultaneous verticals, and the implied multiple to any plausible
      current-period ARR estimate is historically extreme. Exit pathways most plausible before
      2032 include a strategic acquisition by a defense prime (e.g., a large government-IT or
      defense-prime vendor seeking cryptography and sensing capabilities), a large-cap cybersecurity
      vendor acquiring the PQC platform, a major pharma acquiring the drug-discovery AI platform,
      secondary-market sales to institutional investors on Forge-style platforms, and eventually
      an IPO once revenues are sufficiently scaled and predictable. The Launchbay Capital data
      placing SandboxAQ among H1 2025's most active secondary market names implies insider and
      employee liquidity demand consistent with a company three-plus years from its 2022 raise —
      a signal of secondary supply, not a secondary demand floor. Critical diligence asks include:
      verified ARR and NRR from enterprise PQC software customers; milestone payment schedules and
      deal probabilities from AstraZeneca, Sanofi, and MapLight partnerships; government contract
      value, award probability, and competitive dynamics for AQNav DoD programs; full cap table
      with preference stack, liquidation preferences, and anti-dilution provisions; headcount and
      burn rate for cash-efficiency triangulation; and a current secondary-market bid/ask spread
      as a real-time valuation check. Thesis-break events include a disclosed revenue run-rate
      significantly below $50 million by end-2026, loss of a marquee biopharma partnership, or
      a public-market cybersecurity SaaS multiple compression below 10×.
