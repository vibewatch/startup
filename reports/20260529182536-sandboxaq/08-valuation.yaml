  - id: comparable-analysis
    title: Comparable Company Analysis
    body: >
      No single public peer is perfectly analogous to SandboxAQ given its multi-vertical structure.
      Four reference clusters provide partial calibration anchors. First, public cybersecurity
      software — CrowdStrike, Palo Alto Networks, and Fortinet — trades at 12–31× LTM revenue as
      of May 2026, per multiples.vc data. CrowdStrike, the premium-priced platform at 31.0× LTM
      revenue, has $5 billion in annual revenue growing at 22% with confirmed enterprise ARR; Palo
      Alto trades at 18.1× on $11 billion LTM revenue; Fortinet trades at 12.6×. These multiples
      set a ceiling for what a mature post-quantum cryptography software business could command in
      the public market. Second, Palantir — a government-and-enterprise AI platform company —
      is the closest behavioral analog for SandboxAQ's multi-sector ambition and pre-profitability
      scale-up. Palantir reported Q1 2026 revenue of $1.63 billion (85% year-over-year growth, the
      fastest since its 2020 IPO) and guided to $7.65–7.66 billion in 2026 revenue; its enterprise
      value stood at approximately $367 billion as of late May 2026, implying an EV/2026E revenue
      multiple near 48×. This is a rich multiple even for Palantir's growth rate — and Palantir has
      confirmed $6+ billion annual revenues, which SandboxAQ does not. Third, quantum-adjacent
      platforms (IonQ, Schrödinger) provide early-stage reference points: IonQ reported $130
      million in 2025 GAAP revenue, up 202% year-over-year, becoming the first publicly traded
      quantum company to surpass $100 million in GAAP revenue; Schrödinger reported $256 million
      in 2025 total revenue with 74% software gross margin and 23% growth. Both trade at meaningful
      premiums to traditional SaaS on growth expectations alone. Fourth, Finro's Q4 2025 analysis
      of 565 AI companies found that applied AI cybersecurity companies are "priced closer to
      established SaaS norms" rather than frontier-model premiums — 8–15× revenue, not 25–40× —
      adding an adverse signal for SandboxAQ's cybersecurity-segment anchoring at the current
      valuation.
