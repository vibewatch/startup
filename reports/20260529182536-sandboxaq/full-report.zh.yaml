        - 2026 年才会广泛可用；截至 2026 年 5 月，公开客户背书有限
      - - 非人类身份（NHI）治理
        - 服务账号和临时密钥零散管理；大多数企业没有统一 NHI 清单
        - 映射每个 NHI 和加密资产；按任务范围授予临时访问权限
        - 减少凭证蔓延；支撑 AI 智能体环境的机器 IAM
