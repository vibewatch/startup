              作为一家私营公司，SandboxAQ 不发布经审计财务数据、GAAP 收入数字或季度披露，在公司与潜在投资者或合作伙伴之间造成重大信息不对称。 2025年4月 $5.75B 的 E
              轮估值，相对于可从公开确认合同推断出的早期商业收入基础，意味着相当高的收入倍数， 使投资者尽调高度依赖资料室访问和第三方审计确认。Premier Alts 的二级市场数据暗示，2026年5月市值约为
              $5.2B，较上一轮有小幅折价，但私募二级定价仅具指示性，并带有较宽的买卖价差。截至 2026年5月， 尚未宣布 IPO 时间表、SPAC 交易或其他计划中的公开流动性事件。SandboxAQ
              已确认的收入锚点包括一个美国 DoD 五年期 PQC 迁移合同、一个用于 AQNav 的 USAF SBIR Phase 2B TACFI 合同，以及 DIU 量子传感项目。商业企业
              ARR、政府合同收入和早期制药里程碑收入的组合未公开披露， 使广泛商业产品市场契合度无法从公开来源验证。因此，投资者正在承销此阶段无法独立确认的重大商业扩张假设。首席执行官 Jack Hidary 和董事长
              Eric Schmidt 的领导层集中是一个叠加因素。两者对融资叙事、政府关系和公共定位都至关重要；任何一方离任都会造成投资者信心和运营扰动风险。
