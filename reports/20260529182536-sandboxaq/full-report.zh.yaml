  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 执行与市场时机风险
        blocks:
          - type: paragraph
            body: >-
              SandboxAQ 的主要收入驱动因素——后量子密码（PQC）迁移——所处市场正在快速形成但转化缓慢。大规模密码重平台化的企业销售周期通常端到端需要 10-15 年；SandboxAQ
              自己的渠道负责人承认，金融服务等行业需要这么长时间才能完全重新设计和重构 IT 平台。即使存在紧迫性， CNSA 2.0 要求新 NSS 系统到 2027年1月合规，商业企业市场则面临延伸至 2030-2035
              年的更软期限，这会推迟支撑 SandboxAQ 增长模型的商业需求浪潮。大多数企业买方在任何迁移销售之前都缺乏完整的密码资产清单，使销售周期因估计 6-18 个月的发现工作而延长。ML-KEM 等 PQC
              算法相较传统 RSA/ECC 因更大的密钥大小和更高计算要求而存在性能开销，减缓成本受限 IT 组织的预算批准。Entrust 调查确认，2024-2025 年 PQC
              认知度较高，但可行动投资明显落后于认知，表明市场仍以教育为主、 转化缓慢。SandboxAQ 的渠道伙伴计划在超越直销企业销售之前，需要大量赋能投入，这为本已复杂的市场进入动作增加了执行风险。
