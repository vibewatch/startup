  - id: FE001
    title: SandboxAQ 产品架构（栈）
    type: stack
    layout: wide
    summary: 四层架构，展示 SandboxAQ 的 LQM 基础设施如何支撑网络安全、生命科学、导航和传感等不同产品线。
    claimRefs:
      - CE027
      - CE028
