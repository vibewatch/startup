      - number: '4.3'
        title: 成本结构与资本强度
        blocks:
          - type: paragraph
            body: >
              SandboxAQ 的成本结构由研发支出、科研人才获取、高性能计算基础设施以及不断增加的市场进入投入驱动。公司公开披露，截至 2025年中拥有超过 87 名博士和 110 名工程师，总人数估计约为 200–350
              人（不同来源引用了不同时间点的快照）。 这种密度的科研人才带来的薪酬成本可与深科技研究机构相当，单员工总成本显著高于软件行业中位数。公司未披露毛利率、EBITDA 或运营成本拆分。

              AQNav 和 CardiAQ 的定制量子传感硬件、需要 HPC 基础设施（GPU/TPU 集群）的计算化学模拟工作负载，以及多个长期临床和政府研究项目的成本， 进一步提高了资本强度。与 NVIDIA
              的合作集成了 CUDA 加速的 DMRG 算法，这意味着 GPU 基础设施上的持续计算成本。 2025年7月的 $95M 二级发行仅为员工流动性而设计，并非运营资金，这限制了对近期现金消耗覆盖的推断。

              一级融资节奏（2023年2月 $500M，2024年12月 >$300M，2025年4月 +$150M）意味着 3 年内累计净现金部署约 $950M，或每年约
              $315M——这是在任何收入抵消之前，对累计现金消耗加投资的粗略但保守代理。如果 2024年收入为 ~$17.8M（LATKA
              估计），则由收入资助的运营比例相对于所消耗的总资本将很有限。任何公开来源都没有提供具体季度现金消耗、 毛利率、资本开支和资金可支撑时间。
