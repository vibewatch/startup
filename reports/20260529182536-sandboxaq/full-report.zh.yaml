  - id: TM004
    title: 增长驱动因素与采用约束
    columns:
      - 因素
      - 方向
      - 受影响细分
      - 时间
      - 对 SandboxAQ 的影响
      - 尽调问题
    rows:
      - - NIST FIPS 203/204/205 定稿（2024 年 8 月）
        - 驱动
        - CPM / PQC
        - 立即 — 已生效
        - 为企业采购建立法律标准依据；消除标准不确定性障碍
        - 梳理哪些企业客户已启动 NIST 合规项目，并正在评估工具
      - - NSA CNSA 2.0 强制要求（2027 年新 NSS 截止，2030/2035 全面迁移）
        - 驱动
        - CPM / PQC、防务
        - 新 NSS 在 2027 年遇到硬性合规截止；2030 年为迁移截止
        - 国防工业基础和联邦机构面临强制采购；为 AQtive Guard 带来直接管线
        - 确认联邦 / 防务交易管线，以及 NSS 周边采购中的中标率
      - - CISA PQC 计划与关键基础设施指南
        - 驱动
        - CPM / PQC
        - 已启动 — 2026
        - 将需求从 NSS 扩展到关键基础设施运营商（能源、金融、电信）
        - 跟踪 CISA 指南更新，并映射到已具名客户细分
      - - 智能体 AI 部署激增，推高 NHI 蔓延
        - 驱动
        - AI / NHI 安全
        - 已启动 — 2025–2027 年加速
        - 大型企业的 NHI 数量是人类身份的 50–100 倍；传统 IAM 管不住 AI 智能体
        - 量化 AQtive Guard 的 AI 智能体客户管线；对照 NHI 市场增速验证
      - - 先收集、后解密（HNDL）威胁
        - 驱动
        - CPM / PQC
        - 当前已存在
        - 国家级对手正在收集加密流量，等待未来用量子能力解密；数据保存周期越长，紧迫性越高
        - 跟踪确认活跃收集行为的威胁情报报告，并用于买方教育内容
      - - 企业加密资产盘点采用缓慢
        - 约束
        - CPM / PQC
        - 2024–2028 中期
        - 多数企业不先完成盘点就无法启动 PQC 迁移；可触达支出因此延后
        - 调研企业准备度：目标买方中，已完成加密资产盘点与仍处于发现阶段的占比分别是多少？
      - - 既有厂商动员（IBM、Entrust、Microsoft、Venafi）
        - 约束
        - CPM / PQC、NHI
        - 已启动 — 2026 年升级
        - IBM / Entrust CPM 联合方案（2026 年 4 月）和 Microsoft CPM 指南（2026 年 4 月）表明，既有厂商正把 PQC 打包进现有合同
        - 评估相对 IBM 和 Entrust 的胜负率；判断 SandboxAQ 靠深度还是价格取胜
      - - 集成复杂度与 PQC 性能开销
        - 约束
        - CPM / PQC
        - 2025–2030
        - 即便企业有迁移紧迫感，PQC 密钥尺寸大、协议要改、HSM 支持有缺口，都会拖慢迁移
        - 跟踪 SandboxAQ 的密码敏捷性主张，以及相对既有厂商的性能基准
      - - 医药和防务采购周期长
        - 约束
        - 生命科学模拟、GPS 拒止导航
        - 结构性 — 3–7 年周期
        - 药物发现和防务采购都要经历多年 PoC、合同和验证阶段
        - 确认基于里程碑的收入确认模式；评估已有资金支持的 PoC 管线
      - - 网络安全、医药和防务预算分散
        - 约束
        - 全部细分
        - 结构性
        - 预算负责人不同，需要分开设计销售打法；限制交叉销售和成交效率
        - 评估 SandboxAQ 的多细分策略会提高还是压低 LTV/CAC 比率
    notes: 时间和影响判断基于监管日历、分析师研究和已披露市场事件作出的编辑推断，并非收入预测。
