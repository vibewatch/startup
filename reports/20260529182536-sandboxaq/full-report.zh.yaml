      - number: '7.5'
        title: 监管、出口管制与政府集中风险
        blocks:
          - type: paragraph
            body: >-
              SandboxAQ 的收入明显集中在美国政府项目：五年期 DoD PQC 迁移合同、Air Force SBIR Phase 2B TACFI 的 AQNav 合同，以及 Defense Innovation
              Unit 量子传感项目。这些项目合计代表可观的已承诺收入，但任何合同若被终止、缩减范围，或受到国会拨款不确定性影响，风险都偏二元。政府合同有独特风险：便利终止条款、年度拨款敞口，以及 CMMC 2.0
              持续合规义务（2025 年 11 月起强制），包括第三方评估和处理受控非密信息的 DoD 承包商年度证明。CMMC 不合规会带来失去合同资格的风险。BIS 于 2024 年 9
              月生效的出口管制，对量子计算技术、相关软件和技术知识施加全球许可要求。SandboxAQ
              国际扩张时，合规复杂度因此上升：向多数外国人转移量子技术前必须取得许可证或许可例外，包括在美国境内向外籍人士发生的视同出口。DFARS 252.225-7048
              条款把出口管制合规义务下传给所有分包商和合作伙伴。这些管制压缩 SandboxAQ 的可服务国际市场，也带来监管敞口。如果 AQNav 量子传感器被重新归类为国防物项，SandboxAQ 还必须处理潜在 ITAR
              敞口。
