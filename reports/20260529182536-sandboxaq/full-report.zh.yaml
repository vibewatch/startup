      - number: '7.3'
        title: 竞争与战略风险
        blocks:
          - type: paragraph
            body: >-
              SandboxAQ 同时在多个技术要求很高的产品线竞争：PQC 迁移管理、AI 药物发现、量子导航和 AI 安全，在每个细分中都面对资源充足的现有企业和专门挑战者。 在 PQC 密码管理领域，SandboxAQ
              面临 IBM Quantum Safe、与 IBM Consulting 通过 Quantum-Safe 360 合作的 Thales CipherTrust、DigiCert Trust Lifecycle
              Manager 和 Entrust；这些竞争者都拥有成熟的企业分销、专业服务组织以及在金融服务和政府中的品牌关系。 IBM 和 Thales 正合作提供交钥匙 PQC 迁移服务，直接竞争 SandboxAQ 的
              AQtive Guard 加专业服务模式。在 AI 药物发现领域， Isomorphic Labs 和 Chai Discovery 等资金充足的竞争者面向相同的制药买方，大型制药公司也在建立内部计算 AI
              团队。 AQNav 面对 Honeywell、Northrop Grumman 和 Collins Aerospace 等导航现有企业，以及新兴 GPS 替代初创公司。 在约 350
              名员工且未发布收入规模的情况下，同时运营全部四个细分，会产生资源过于分散的风险，可能在资本更充足的竞争者整合各自市场之前，
              无法在任何一个细分取得市场领导地位。多产品战略在执行紧密时是优势，但如果资本受限或人才被平行押注稀释，则会成为战略负担。
