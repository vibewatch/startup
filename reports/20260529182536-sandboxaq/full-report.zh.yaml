      - number: '5.4'
        title: 导航与传感：AQNav 和 AQMed
        blocks:
          - type: paragraph
            body: >-
              AQNav 是 SandboxAQ 面向 GPS 拒止环境的磁导航（MagNav）产品。它使用量子磁力计采样地壳磁场——这些磁场呈现地理上独特的模式—— 并应用专有 LQMs
              将传感器数据与已知磁图进行比较，从而实时确定位置。关键运行特征包括：系统不需要 GPS 或卫星信号，不发射电子信号（被动），
              在室温且无需屏蔽条件下运行，适用于空、陆、海领域，具备全天候和昼夜能力，并具有小型外形，可兼容从单引擎飞机到大型军用运输机和 UAVs 的平台。


              2024年8月，USAF 授予 SandboxAQ 一项 SBIR Phase 2B Tactical Funding Increase（TACFI），延长了 2023年1月开始的先前
              Direct-to-Phase-II SBIR 合同。到该日期，AQNav 已在四类飞机、多个地区累计超过 200 飞行小时和 40+ 架次，并在两次 USAF 演习中测试——Exercise Golden
              Phoenix 和 Exercise Mobility Guardian，后者是当时 Air Force Mobility Command 最大规模的演习。TACFI 合同资助吊舱式配置，以部署到包括 UAVs
              在内的更广泛飞机。Executive Biz 于 2025年12月报道称， Defense Innovation Unit（DIU）也与 SandboxAQ 签约，推动 AQNav 作为其面向 GPS
              拒止环境自主系统的 Transition of Quantum Sensing 项目的一部分。航空航天伙伴 Boeing 和 Acubed（Airbus）正参与军民两用商业开发。


              AQMed 将量子磁强计应用于心磁图（MCG），通过检测心脏发出的微弱磁场来无接触电极监测心脏健康。Mount Sinai Health System 在 SandboxAQ
              2022年发布时被列为早期客户。AQMed 尚未公开披露临床结果、CE-mark、FDA clearance 或商业部署数据， 使其临床成熟度无法从公开来源验证。这仍是一个重大证据缺口。
