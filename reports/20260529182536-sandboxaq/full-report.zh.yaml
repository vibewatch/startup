  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与商业化架构
        blocks:
          - type: paragraph
            body: >
              SandboxAQ 是一家 B2B 企业 SaaS 公司，面向四个主要垂直领域提供 AI 和量子技术方案： 网络安全（AQtive
              Guard）、生物制药模拟（AQBioSim）、材料与化学（AQChemSim），以及 不依赖 GPS 的导航（AQNav）。正在形成的第五个垂直领域——心脏诊断（CardiAQ）仍处于临床研究阶段。
              软件平台的变现机制似乎包括软件订阅许可、专业服务和政府研究合同，不过 SandboxAQ 尚未公布任何产品线的标价或合同结构。
              公司已确认企业和政府部署，但尚未披露客户数量、平均合同价值、续约率或按细分市场划分的收入。

              已公开披露的商业客户关系包括 Accenture（AQtive Guard 在金融服务和生命科学领域的扩展部署伙伴）、 AstraZeneca 和 Sanofi（AQBioSim
              生物制药协议）、NOVONIX（AQChemSim 的电池数据），以及 U.S. Department of War CIO（2025年12月签署的五年期 AQtive Guard 密码发现协议）。美国空军在
              2024年8月授予 SBIR Phase 2B TACFI 合同延期，用于 AQNav 磁导航开发。Boeing 和 Airbus 子公司 Acubed 也被公开提及为 AQNav 测试伙伴。Mount
              Sinai Health System、UCSF Medical Center 和 Mayo Clinic 是 CardiAQ 的已确认研究合作方。这些客户验证型合作证明了商业牵引力，但未披露合同金额或收入贡献。

              第三方数据聚合商 LATKA 报告称，SandboxAQ 在 2024年收入达到 $17.8M（高于 2023年的 $10.6M 和 2022年的 $196K），并将该公司归类为企业 SaaS 业务。LATKA
              的方法依赖公司或投资者披露，而非经审计财务数据； 因此这些数字应被视为有依据的估计，而不是经过验证的经营结果。尚未发现对这些具体数字的独立佐证。
