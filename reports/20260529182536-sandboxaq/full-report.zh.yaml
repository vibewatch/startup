      - number: '4.5'
        title: 财务结论与尽调优先事项
        blocks:
          - type: paragraph
            body: >
              SandboxAQ 呈现出深科技平台公司典型的早期商业化财务画像：数亿美元级资本化支持尚未达到峰值收入的运营，收入基础正在扩大但尚未自我维持。 $17.8M 的 LATKA 估计 2024 ARR 对应
              $5.6–5.75B 估值（315× 收入倍数），孤立来看是尽调红旗， 但可由以下因素部分解释：(1) 已披露的政府和头部企业客户获胜，(2) 收入从 $196K（2022年）到
              $17.8M（2024年）的快速增长轨迹， (3) PQC 迁移、药物发现和导航市场中 35+ 年的潜在空间，以及 (4) 包括 T. Rowe Price、NVIDIA、Google 和 Ray Dalio
              在内的高质量支持者。

              最关键的尽调缺口是：(a) 按产品线和客户细分验证的 ARR/收入；(b) 按垂直领域划分的毛利率（软件许可、研究服务和硬件）； (c) 已确认的账上现金、月度现金消耗和资金可支撑时长；(d)
              合同续约率和净收入留存数据；以及 (e) 人员数量和薪酬成本拆分。 缺少这些信息，任何投资者都无法以高于低置信度的水平承销公允价值估计。该公司本身并非尽调阻断项——其商业化轨迹和投资者名册具有可信度——
              但财务不透明是将其定位为高于中等置信度投资时的主要风险。
            claimRefs:
              - CI034
              - CI035
              - CI036
