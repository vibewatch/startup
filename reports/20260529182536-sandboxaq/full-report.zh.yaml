      - number: '5.3'
        title: 生命科学：药物发现与分子模拟
        blocks:
          - type: paragraph
            body: >-
              SandboxAQ 的 AQBioSim 部门于 2023年6月正式发布，将基于物理的模拟用于加速生物制药研发。核心技术是 AQ-FEP （Absolute Free Energy
              Perturbation），这是一套专有软件包，结合量子力学方程和 AI 来预测分子结合亲和力。根据 2023年6月发布新闻稿，AQ-FEP 每天可在计算机模拟环境中分析超过 20,000 个配体，且
              SandboxAQ 保持着使用大规模线性代数和 TPUs 在经典硬件上完成最大 N^3 DFT（密度泛函理论）模拟的记录。该方法面向“不可成药靶点”以及实验结构数据不完整的蛋白-配体相互作用。


              AQAffinity 于 2026年1月20日发布，将其扩展为基于 OpenFold3（OpenFold Consortium 的开源生物分子共折叠模型）的无结构结合亲和力预测。 AQAffinity
              消除了对实验测定结构的依赖，使研究人员能够在产生湿实验室成本之前筛选候选物，并在低概率路径上“快速失败”。 它以 Apache License 2.0 在 HuggingFace 上提供，并与 OpenFold
              Consortium 在 Columbia University 的首席研究员 Professor Mohammed AlQuraishi 共同开发。该模型自 2025年12月起面向 OpenFold
              Consortium 成员提供测试版，并于 2026年1月开放发布。


              AQBioSim 的具名客户包括 AstraZeneca、Sanofi、UCSF's Institute for Neurodegenerative Diseases、Riboscience 和 Columbia
              University Medical Center。Sanofi CEO Paul Hudson 称该技术为“跨越式”，有潜力“显著影响临床前和临床开发”。 Riboscience 指出使用 AQ-FEP
              每天筛选超过 20,000 个配体。FierceBiotech 在 2023年独立报道了 AstraZeneca 和 Sanofi 合作，作为公司商业验证场。AQChemSim
              将同一模拟栈应用于材料科学和先进制造， 不过截至报告日期，该子产品尚未公开披露具名商业客户。用于心脏传感的 AQMed 曾在公司材料中与 Mount Sinai Health System
              一起被提及为早期客户，但临床部署状态和结果尚未公开报告。
