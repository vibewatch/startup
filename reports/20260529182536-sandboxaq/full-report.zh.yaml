      - number: '8.2'
        title: 可比公司分析
        blocks:
          - type: paragraph
            body: >
              SandboxAQ 是多垂直结构，没有任何单一上市公司能完全对应。四组参考公司只能提供部分校准锚。第一，上市网络安全软件公司——CrowdStrike、Palo Alto Networks 和
              Fortinet——按 multiples.vc 数据，截至 2026 年 5 月交易在 12–31× LTM 收入。CrowdStrike 是溢价最高的平台，31.0× LTM 收入，年收入 $5
              billion、增速 22%，且企业 ARR 已确认；Palo Alto 以 $11 billion LTM 收入交易在 18.1×；Fortinet 为
              12.6×。这些倍数为成熟后量子密码软件业务在公开市场可能获得的估值设定了上限。第二，Palantir 这类政府与企业 AI 平台公司，是 SandboxAQ
              多行业野心和亏损前扩张最接近的行为类比。Palantir 报告 2026 年 Q1 收入 $1.63 billion（同比增长 85%，为 2020 年 IPO 以来最快），并指引 2026 年收入
              $7.65–7.66 billion；截至 2026 年 5 月下旬，其企业价值约 $367 billion，意味着 EV/2026E 收入倍数接近 48×。即便按 Palantir
              的增速看，这个倍数也很高——而 Palantir 已确认年收入超过 $6 billion，SandboxAQ 没有。第三，量子相邻平台（IonQ、Schrödinger）提供早期参考点：IonQ 2025 年
              GAAP 收入 $130 million，同比增长 202%，成为首家 GAAP 收入超过 $100 million 的上市量子公司；Schrödinger 2025 年总收入 $256
              million，软件毛利率 74%，增长 23%。两者都仅凭增长预期，相比传统 SaaS 享有显著溢价。第四，Finro 对 565 家 AI 公司的 2025 年 Q4 分析发现，应用型 AI
              网络安全公司的定价“更接近成熟 SaaS 常态”，而非前沿模型溢价——收入倍数是 8–15×，不是 25–40×——这对 SandboxAQ 以网络安全板块支撑当前估值构成负向信号。
