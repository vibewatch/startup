    data:
      layers:
        - label: 面向客户的产品
          detail: 四条产品线交付商业产出——网络安全（AQtive Guard）、药物发现（AQBioSim/AQAffinity）、无 GPS 导航（AQNav）和心脏传感（AQMed）。
          items:
            - AQtive Guard（CPM + AI-SPM）
            - AQBioSim / AQAffinity（药物发现）
            - AQNav（磁导航）
            - AQMed（心脏传感）
        - label: 大型定量模型（LQM）
          detail: 面向特定领域的 AI 模型，训练数据来自定量物理和信号，而非语言语料。它不同于 LLM，为四条产品线的推理提供动力。
          items:
            - 密码风险评分模型
            - 分子模拟 / 结合亲和力模型（AQ-FEP）
            - 磁信号处理模型（MagNav）
            - 心磁图信号模型
        - label: 数据与传感器
          detail: 原始数据和传感器输入进入 LQM 训练与推理，覆盖企业 IT 环境、分子结构数据库、地壳磁场图和量子磁力仪。
          items:
            - 企业加密资产数据（代码 / 运行时 / 网络）
            - 分子结构数据 / 模拟输出
            - 地壳磁场数据库
            - 心脏磁场信号（量子磁力仪）
        - label: 经典计算基础设施
          detail: 所有 LQM 推理和 AQ-FEP 模拟都跑在经典云硬件（Google TPU、GPU、CPU）上。任何现有生产流程都不需要量子计算硬件。
          items:
            - TPU 集群（DFT / AQ-FEP 模拟）
            - GPU/CPU 推理（LQM 评分）
            - 云环境（AQtive Guard 扫描代理）
