      - number: '2.5'
        title: 规模测算缺口与尽调问题
        blocks:
          - type: paragraph
            body: >-
              几个实质性规模测算缺口限制了本分析的精度。第一，没有公开分析师报告能以足够颗粒度把 CPM/PQC 纯软件工具收入从硬件、咨询和 QKD 硬件中剥离出来，从而直接推导 SandboxAQ 的 SAM。 ABI
              Research 在 2026 年发布了专门的 CPM 市场趋势报告，但详细预测在付费墙后。上述估计中， 2026 年 PQC 软件品类从 $0.78B 到超过 $1.58B
              不等，取决于口径；这意味着自动化密码态势管理 平台的真实 SAM 更可能接近数亿美元级别。

              第二，SandboxAQ 在生命科学仿真和无 GPS 导航中的 SOM 很难隔离。生命科学方面，公司面对深度 嵌入的 Schrödinger 和内部计算化学团队；AQAffinity 与 OpenFold3
              合作仍处于概念验证 / 合作 阶段，未披露收入。Mordor 的 $3.25B AI 药物发现市场估计覆盖大量平台；SandboxAQ 的基于物理 仿真利基只是其中一小部分。

              第三，IBM 的 Guardium Cryptography Manager、Microsoft 2026 年 4 月发布的 CPM 指引，以及 Entrust/IBM 同月启动的合作表明，资金充足的既有厂商正在
              CPM 细分动员起来。这些实体可以借 既有企业关系，把 PQC 能力打包进更广泛的安全合同，从而推高 SandboxAQ 获客成本，并缩短其 先发优势窗口。

              第四，在无 GPS 导航上，SandboxAQ 的量子传感技术必须达到硬件成熟度，并熬过以年而非季度 衡量的防务采购周期。该细分代表长期可选性，而不是近期收入。
