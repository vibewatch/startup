            body: >-
              SandboxAQ 的 AQtive Guard AI-SPM 产品，所处市场是快速整合的云原生应用安全市场。主要竞争信号 是 Palo Alto Networks（Prisma Cloud AI-SPM，拥有宽
              CNAPP 平台的既有厂商）、Protect AI （聚焦 AI 安全的创业公司）以及已归属 Google 的 Wiz 平台。

              Wiz 是首个提供原生 AI 安全能力的 CNAPP，推出 AI-BOM（AI 物料清单）、AI 配置错误 检查，以及横跨 AI 管线的攻击路径分析。Google 以全现金 $32B 收购 Wiz 的交易于
              2026 年 3 月 完成，实际上把 Wiz 的 AI-SPM 能力纳入 Google Cloud 安全组合。这同时带来威胁（Google 会 积极将 AI-SPM 打包进 GCP 安全产品）和证明点（收购验证了
              AI-SPM 市场细分）。

              Palo Alto Networks Prisma Cloud 每 24 小时分析 1 trillion 个事件，并每天检测 1.5 million 次新攻击。其 AI-SPM
              能力包括模型风险评分、跨模型资源的数据安全，以及 AI 应用生态保护—— 这些功能与 AQtive Guard 的定位高度重叠。Palo Alto 市值超过 $90B，拥有深厚 CISO 关系和 既有
              Prisma Cloud 部署，是对独立 AI-SPM 供应商最危险的既有厂商打包风险。

              Protect AI 走专家路线，产品包括 Guardian（模型安全）、Recon（AI 红队）和 Layer（运行时 控制），并放在统一平台上。其 2025 年 4 月宣布与 Leidos
              合作，保护美国政府系统中的 AI， 说明它在 SandboxAQ 借 DoD CIO 关系瞄准的政府 / 防务渠道中，与 AQtive Guard 直接竞争。 Protect AI 已扫描超过 4.84
              million 个 AI 模型版本，并提交 2,520 条 CVE 记录；相比 SandboxAQ 更宽泛的态势管理叙事，Protect AI 在模型安全上更专精。
