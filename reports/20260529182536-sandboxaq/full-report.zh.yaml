      - number: '5.2'
        title: AQtive Guard：密码态势管理和 AI-SPM
        blocks:
          - type: paragraph
            body: >-
              SandboxAQ 的旗舰网络安全平台 AQtive Guard 执行三类工作流功能：在代码、运行时和网络层发现密码资产（密钥、证书、算法、库）；
              使用业务影响映射和爆炸半径分析进行上下文风险排序；以及编排式修复，包括证书轮换、算法替换和 PQC 迁移。公司在独立域名 aqtiveguard.com 运营的官方 AQtive Guard
              产品页称，该平台可跨代码、运行时和网络关联数据——这使其区别于只能看到自身主动管理对象的传统 PKI 工具。团队声称其密码学家参与了 NIST PQC 标准开发，包括 FIPS 205；这一点可通过 NIST
              FIPS 205（SLH-DSA）发布记录验证。


              AQtive Guard 的 AI-SPM 模块于 2025年12月有限开放，并在 2026年广泛可用，将同样的深度检查方法扩展到 AI 资产—— 在云到代码环境中发现模型、代理和 Model Context
              Protocol（MCP）服务器，评估提示注入和数据泄露等可利用弱点， 并执行 AI 治理政策。到 2026年3月，SandboxAQ 已增加针对入站提示和出站 AI 响应的护栏、通过自主安全代理进行 MCP
              风险分析、与 EU AI Act 对齐的态势报告，以及对影子 AI 的云扫描。Cyber Defense Magazine 将该架构描述为 “把 Google 的内部安全实践带入企业。”


              产品相关性锚定在具体监管压力上。NIST 于 2024年8月最终确定 FIPS 203（ML-KEM）、FIPS 204（ML-DSA）和 FIPS 205 （SLH-DSA）。NSA 的 CNSA 2.0
              指南要求所有 NSS 软件到 2030年采用 PQC，并到 2033年完成旧体系替换。DoW CIO 于 2025年12月签署五年期 AQtive Guard
              协议，覆盖自动化密码发现与清单管理，为同一合规时间线提供了政府参考。SandboxAQ 的内部调查发现，79% 的组织在生产中运行 AI，但只有 6% 拥有全面的 AI 原生安全策略——这一数据被用于支撑 CPM
              和 AI-SPM 两个模块。公司生成 CBOMs（密码材料清单）作为合规交付物。独立加密咨询分析发现，企业实际活跃证书数量通常是官方清单的二至五倍—— 这正是 AQtive Guard 发现模块直接针对的问题。
