      - number: '3.4'
        title: 生命科学与材料仿真竞争者
        blocks:
          - type: paragraph
            body: >-
              在生命科学和材料仿真中，SandboxAQ 以 AI/量子驱动分子建模参与竞争；商业化最成熟的既有 厂商是上市公司。Schrödinger 是计算药物发现软件的市场定义参照，FY2025 总收入 $255.9M
              （较 FY2024 的 $207.5M 同比增长 23%），净亏损 $103.3M。按 2024 年收入排名的前 20 大制药 公司全部在 2025 年授权使用 Schrödinger 解决方案，其软件被
              1,750+ 学术机构使用。Schrödinger 的药物发现收入在 FY2025 贡献 $56.4M。其商业客户平均 ACV（ACV ≥$1M）从 FY2024 的 $3.3M 增至 FY2025 的
              $3.9M，说明头部客户群中的钱包份额正在扩大。

              Recursion Pharmaceuticals 运营着全球最大之一的自有生物和化学数据集（约 36 PB），并可通过 Recursion OS 平台每周处理最高 2.2 million 个实验样本。其
              TechBio 路线把生物学、化学和 临床开发整合进统一的 AI 驱动智能系统，临床阶段管线覆盖肿瘤、罕见病和神经科学。作为上市 公司，Recursion 提供了一个规模参照；SandboxAQ 的
              AQAffinity 和分子仿真产品最终必须在商业化 深度上追上这一参照。

              Insilico Medicine 由 Warburg Pincus 和 Qiming Venture Partners 支持，通过 Pharma.ai 平台 提供 AI 药物发现，并已与全球前 20
              大制药公司中的 10 家（按 2021 年销售额）合作。其临床 阶段项目，以及在美国、大中华区和中东的全球布局，使它成为直接可比的 AI 药物发现平台，与 SandboxAQ
              的分子仿真套件争夺同一批制药和生物技术客户。

              SandboxAQ 在这一细分的根本竞争挑战是：Schrödinger 和 Recursion 拥有多年制药关系、专门的 企业销售团队和已验证的药物发现工作流。SandboxAQ
              的量子加速仿真论点必须转化为可衡量结果， 制药买方才会替换已经证明可行的计算平台。
