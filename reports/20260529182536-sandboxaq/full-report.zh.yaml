      - number: '3.2'
        title: PQC 和密码态势管理竞争者
        blocks:
          - type: paragraph
            body: >-
              PQC 和密码态势管理细分，是 SandboxAQ 最直接对上大型安全既有厂商的地方。竞争动态取决于 买方层级：在企业 PKI / 证书生命周期层，DigiCert 和 Entrust 已深度嵌入；在量子安全转型
              服务层，IBM 拥有广泛企业触达；在硬件 PQC IP 层，PQShield 以芯片嵌入式实现领先；在量子 随机性层，Quantinuum 的 Quantum Origin 以可验证熵形成差异化。

              Entrust 提供面向企业的 PQC 就绪证书颁发机构解决方案，并与 IBM Consulting 合作，加速 企业迁移到量子安全密码学。其后量子解决方案需企业接洽且没有公开标价，显示出服务主导、 关系驱动的
              GTM；这让 Entrust 在既有客户群中拥有显著护城河。IBM 则依托其在开发 NIST PQC 标准底层格基算法（Dilithium、Kyber）中的角色，提供量子安全转型服务和用于密码资产清单的
              Guardium Cryptography Manager。

              PQShield 是最可比的聚焦型 PQC 创业公司。公司累计融资超过 $63M，并已在四个安全等级（Cloud、 Edge、Lab、Government）交付通过 FIPS 140-3 CMVP
              认证的库；PQShield 瞄准半导体供应商和 政府机构，提供嵌入式 PQC IP——这是硬件优先路径，不同于 SandboxAQ 软件优先的 AQtive Guard
              态势产品。Quantinuum（Honeywell 拆分公司）提供 Quantum Origin，这是一款量子随机数生成器， 已与 Honeywell、Thales 和 Fornetix
              等企业系统集成。Quantinuum 作为包括硬件在内的全栈量子 公司竞争，而 SandboxAQ 不是。

              DigiCert 的 Trust Lifecycle Manager 是面向企业的 PKI 证书生命周期管理产品，目标客户是需要 集中治理和加密敏捷性的企业。它与 AQtive Guard 中的
              SandboxAQ 密码清单能力竞争，尤其因为 SandboxAQ 的核心 PQC 用例围绕发现和迁移密码资产。根本张力在于：DigiCert 的 CLM 已深度嵌入 企业 PKI 基础设施；而
              SandboxAQ 路线需要在既有密码基础设施之上，从零部署一层 AI 增强发现层。
