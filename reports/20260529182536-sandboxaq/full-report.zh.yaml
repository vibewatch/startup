      - number: '4.4'
        title: 公开指标、披露缺口与资本充足性
        blocks:
          - type: paragraph
            body: >
              SandboxAQ 的私营公司身份意味着投资者、交易对手和尽调分析师只能获得自愿披露的指标。公司尚未发布经审计财务报表、GAAP 收入、按产品线划分的
              ARR、毛利率、运营亏损、现金状况或剩余资金可支撑时间。LATKA 平台报告 2024年收入为 $17.8M、 估值为 $5.6B，意味着约 315× 的收入倍数——远高于 10–25× 的后期 SaaS
              中位倍数。该倍数与基于未来期权价值而非当前收入的估值逻辑一致， 但也凸显了在不利融资环境中发生重大稀释或降价融资的风险。

              五年期 DoW CIO 协议（2025年12月）和美国空军 TACFI 延期（2024年8月）是最强的政府合同商业化信号，但两者均未披露合同金额或年化收入贡献。 同样，Accenture
              扩展合作（2024年7月）以及与 AstraZeneca 和 Sanofi 的 AQBioSim 协议（2023年）代表已确认的管线， 但财务条款仍为保密。一个单独披露的类赠款信号是 Michael J. Fox
              Foundation 在 2024年10月发起的 $25M LRRK2 研究项目，SandboxAQ 参与其中；这属于研究阶段奖励，并非商业收入。

              资本充足性无法验证。最近一次一级资本事件是 2025年4月 E 轮 $150M 分期资金。如果月度现金消耗处于融资节奏所暗示的范围 （估计 $20–30M/月），且收入正在增长至或超过 $20M
              ARR，则在没有异常加速支出的前提下，公司很可能自 2025年4月资金起拥有 18+ 个月资金可支撑时间。这只是估计；实际现金、现金消耗和资金可支撑时间均为私有信息。Parkway 和 HII 共同投资 SPV
              的 Form D 文件确认了活跃的二级市场，但未提供一级运营数据。
