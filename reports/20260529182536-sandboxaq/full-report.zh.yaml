  - id: FM004
    title: PQC 迁移采用流程——从监管触发到部署
    type: flow
    layout: standard
    summary: 展示企业从监管触发到主动部署 PQC 的旅程，说明密码资产盘点、态势管理和迁移编排在哪些环节为 SandboxAQ 创造商业机会。
    data:
      nodes:
        - id: trigger
          label: 监管 / 风险触发
          detail: NIST FIPS 发布（2024 年 8 月）、NSA CNSA 2.0 强制要求、CISA 指引，或董事会层面的 HNDL 风险决策，启动迁移项目。
          tone: neutral
        - id: inventory
          label: 密码资产盘点
          detail: 企业在混合环境中发现所有证书、密钥、算法和协议。多数企业发现的资产比预期多 2–5x。这是后续所有步骤的前提。
          tone: neutral
        - id: assessment
          label: 量子脆弱性风险评估
          detail: 对盘点结果中的量子脆弱算法（RSA、ECC/ECDH、ECDSA）做分析，并按数据寿命、系统关键性和合规暴露排序。
          tone: positive
        - id: planning
          label: 迁移路线图与治理
          detail: 制定分阶段迁移计划：经典 → 混合 → 全量 PQC。IBM Consulting 和 Entrust 将其描述为需要专门项目治理的多年转型。
          tone: positive
        - id: deployment
          label: PQC 算法部署
          detail: 在优先级系统中部署 NIST FIPS 203/204/205 算法；后续阶段持续监控并保持密码敏捷性。
          tone: positive
        - id: monitoring
          label: 持续态势管理
          detail: 持续监控密码态势，自动化证书生命周期，并输出合规报告。该阶段也是工具供应商的经常性收入阶段。
          tone: positive
      edges:
