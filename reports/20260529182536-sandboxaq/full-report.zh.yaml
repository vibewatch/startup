      - number: '8.7'
        title: 附录材料
        blocks:
          - type: callout
            title: 金融与技术生态中的标杆投资者共识
            body: >
              2025 年 4 月 Series E 汇集了 Ray Dalio、Google、NVIDIA、BNP Paribas、T. Rowe Price 和 Eric Schmidt——这组联盟横跨机构资管、AI
              芯片基础设施、全球银行和政府相邻投资。Google 和 NVIDIA 的参与尤其重要，因为两者技术尽调能力都很深，也都直接受益于 SandboxAQ 的大型定量模型成为 AI
              生态补充。投资者基础的广度和质量，是平台可选性与近端商业可行性的强信号，尽管还不是定论。
            calloutType: strength
            claimRefs:
              - CV001
              - CV002
              - CV028
              - CV029
          - type: callout
            title: 极端隐含倍数要求多垂直收入快速放大
            body: >
              按 2025 年 4 月 $5.75 billion 估值和 LATKA 估计的 2024 ARR $17.8 million 计算，隐含 EV/ARR 约 323×，高于网络安全、量子或 AI
              药物发现中任何上市可比公司。即便慷慨假设 2026 年 ARR 为 $100 million，隐含倍数仍是 57.5×，高于 CrowdStrike 当前 31× LTM
              基准。若要让估值在五年内按常规退出倍数（15–30×）合理化，SandboxAQ 必须到 2028–2030 年实现 $190–380 million ARR——这要求 PQC
              软件、药物发现和导航同时取得商业牵引，而公司披露历史中没有先例。Finro 2025 年 Q4 分析确认，应用型 AI 网络安全倍数正向 8–15× 常态化，增加了下行凸性。
            calloutType: risk
            claimRefs:
              - CV007
              - CV008
              - CV020
              - CV025
              - CV036
              - CV040
          - type: callout
            title: 继续研究——估值偏高；等待收入验证
            body: >
              建议：继续研究。置信度：中。估值立场：偏高。风险评级：高。若没有经验证 ARR 超过 $100 million、NRR 数据和清晰的股权结构图景，就不应以 $5.75 billion 入场。跟踪 ARR
              披露事件、生物医药里程碑付款和政府合同授予，把它们作为领先指标。若到 2026 年底年化收入低于 $50 million，或失去标杆生物医药合作伙伴，论点将被打破。二级市场买卖价差（Forge /
              EquityZen）可提供独立于公司披露的实时估值核验。
            calloutType: recommendation
            claimRefs:
              - CV035
              - CV036
              - CV037
              - CV039
