  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 关键假设（2027–2028）
      - 估计混合 ARR
      - 隐含终局价值（倍数）
      - 相对 $5.75B 入场估值的回报
      - 概率信号
    rows:
      - - 悲观
        - PQC 市场发展慢于 NIST 强制要求；药物发现到 2028 年仍未产生收入；AQNav 仅停留在 DoD 试点；网络安全 SaaS 出现 Finro 式倍数压缩，降至 8–12×
        - 到 2028 年 $40–60M
        - $320M–$720M（8–12×）
        - 较入场估值下行 ~88–94%
        - 若到 2026 年 Q4 仍未披露 ARR，概率抬升；Finro 反向数据提供支撑
      - - 基准
        - PQC 软件借合规要求放量；药物发现产生里程碑费用；AQNav 拿下首个政府合同；退出倍数 15–20×
        - 到 2027–28 年 $150–250M
        - $2.25B–$5.0B（15–20×）
        - 上行 ~13% 至下行 ~61%
        - 中枢情景；与 LATKA 2024 估计值起算的 ARR 10× 增长一致
      - - 乐观
        - 三个垂直方向都形成商业牵引；3–5 个药企合作；多年期 DoD AQNav 合同；PQC 强制要求加速需求；退出倍数 20–30×
        - 到 2028–30 年 $400–600M
        - $8B–$18B（20–30×）
        - 1.4×–3.1× 回报
        - 需要多个垂直方向同步执行；Google/NVIDIA 背书支撑平台逻辑
    notes: >
      所有 ARR 和终局价值数字都由情景假设与公开可比倍数推算，不代表公司指引或已披露预测。终局倍数取自 multiples.vc 网络安全可比公司和 Finro 2025 年 Q4 AI 估值数据。回报假设以 $5.75B
      投后估值入场，且不考虑稀释、优先股积压和资金时间价值。
  - id: TV004
    title: $5.75B 估值下的隐含 EV/ARR 倍数框架
    columns:
      - 假设 ARR
      - 隐含年份（估计）
      - $5.75B 下的 EV/ARR
      - 相近倍数的最接近公开可比公司
      - ARR 达到该水平的必要条件
    rows:
      - - $18M（LATKA 2024 估计）
        - '2024'
        - 319×
        - 无公开可比公司 — 极端离群值
        - 当前状态；意味着基准情景到 2027 年需要 >10× 增长
      - - $50M（宽松 2025 估计）
        - ~2025
        - 115×
        - 规模化早期的 Palantir（2018 年前可比）
        - 2–3 个垂直方向产生初始合同收入；PQC 早期部署
      - - $100M（可能的 2026 里程碑）
        - ~2026
        - 57.5×
        - Palantir 早期增长阶段；IonQ 2025 收入同量级
        - PQC 企业合同形成规模；收到首批药物发现里程碑付款
      - - $185M（CrowdStrike 31× 阈值）
        - ~2027
        - 31.1×（以 CRWD 倍数看，入场估值可解释）
        - CrowdStrike 当前基准
        - 需要 ARR 在 3 年内较 2024 年约增长 10×
      - - $200M（可能的 2027 目标）
        - ~2027
        - 28.75×
        - 高增长 SaaS 先例；IonQ 2026 指引层级
        - 乐观情景执行；所有垂直方向贡献经常性收入
      - - $400M（乐观情景 2028–30）
        - ~2028–30
        - 14.4×
        - Fortinet / 成熟网络安全可比区间
        - PQC、药物发现和导航全面达到商业规模
    notes: >
      所有 ARR 数字都是估计或假设情景；SandboxAQ 尚未披露 ARR。2024 年 $18M 数字是 LATKA（第三方）估计。CrowdStrike 截至 2026 年 5 月来自 multiples.vc 的 31×
      EV/LTM 收入倍数作为基准参考。EV/ARR 等价假设 ARR 等于 LTM 收入，这对里程碑 / 软件混合模式很可能高估 ARR。数字仅用于示例性分析。
  - id: TV005
    title: 投资逻辑 vs. 反向逻辑
    columns:
      - 维度
      - 乐观逻辑
      - 反向逻辑
      - 可能改变判断的因素
    rows:
      - - 市场与技术
        - Quantum-AI 在科学计算上具备结构性优势；NIST 标准和 NSA CNSA 2.0 强制要求给 PQC 带来持久顺风；LQMs 与 LLMs 互补，而非冗余
        - IBM、PQShield、Cloudflare 等资金充足的既有厂商，用多种量子启发式和后量子方案在同一市场竞争；PQC 迁移时间线可能拖到 2030 年之后
        - 披露赢得多年期企业 PQC 合同，且 NRR > 110%；CISA 或 NIST 发布 PQC 迁移管线并显示部署量
      - - 收入证据
        - 成熟投资者在竞争性融资流程中以不断抬升的估值投入 $950M+，释放底层价值信号；生物制药和 DoD 客户落地是强早期指标
        - 没有经验证 ARR；LATKA $18M 估计意味着 319× EV/ARR，远超任何可持续公开市场基准；试点 ≠ 合同
        - 经审计 ARR ≥$100M，且至少两个参考账户确认高净收入留存；合作伙伴在财报电话会上披露药物发现里程碑付款
      - - 战略定位
        - Google、NVIDIA、BNP Paribas 参与，释放对平台层的信念和分发杠杆信号；Alphabet 校友网络提供人才竞争优势
        - 战略投资者买的可能是接入权和期权，而非押注独立价值；退出价格仍需覆盖 $950M+ 的优先股积压
        - 公开披露与 NVIDIA 或 Google 签订长期商业协议，将 SandboxAQ LQMs 嵌入其平台
      - - 估值纪律
        - 历史上，最终跑出规模的公司可凭收入前平台可选性获得大额溢价（Palantir 先例）；五年视角需要耐心
        - 按 Finro 2025 年 Q4，应用 AI 网络安全倍数正在回归 8–15×；药物发现周期长；已融资 $950M+，普通股只有在 $2B+ 退出时才价内
        - 在常规退出倍数下足以解释当前倍数的收入规模（ARR ≥$200M，15–30×）
    notes: >
      乐观逻辑来自官方新闻稿和公司公告中的投资者表态。反向逻辑引用 Finro 2025 年 Q4 AI 估值分析、Launchbay Capital 2025 年 H1 老股市场数据，以及 Forge Global 2025
      年私营市场数据。所有前瞻性陈述都是分析判断，不是公司指引。
  - id: TV006
    title: 上行与下行价值驱动因素
    columns:
      - 驱动因素
      - 方向
      - 幅度
      - 时间线
      - 证据质量
      - 来源
    rows:
      - - NIST FIPS 203/204/205 和 NSA CNSA 2.0 截止期限，推动大规模 PQC 迁移
        - 上行
        - 高 — 全面采用后 PQC 市场达 $15B+
        - 2026–2030
        - 高 — NIST 2024 年 8 月和 NSA 已确认监管强制要求
        - NIST 官方标准；DoD 新闻稿
      - - Google / NVIDIA 参与 Series E，释放平台集成潜力信号
        - 上行
        - 中 — 分发杠杆和生态可信度
        - 2025–2028
        - 中 — Series E 参与已确认；集成尚未披露
        - SandboxAQ Series E 新闻稿（2025 年 4 月）
      - - 主要药企授权里程碑（AstraZeneca、Sanofi、MapLight）进入 Phase II 或更后期
        - 上行
        - 中 — 里程碑付款和估值重估催化剂
        - 2026–2028
        - 中 — 合作已确认；Phase I/II 状态未披露
        - FierceBiotech；SandboxAQ 新闻稿
      - - 应用 AI 网络安全倍数向 SaaS 常态（8–15×）压缩
        - 下行
        - 中-高 — 相对当前私营市场估值标记，退出倍数可能下降 30–50%
        - 2025–2027
        - 高 — Finro 2025 年 Q4 对 565 家 AI 公司的分析
        - Finro 2025 年 Q4 AI 估值倍数报告
      - - 未披露 ARR 带来老股市场折价风险和买卖价差扩大
        - 下行
        - 中 — 老股投资者要求收入可见性；非顶级标的折价扩大
        - 持续
        - 高 — Launchbay Capital 2025 年 H1 老股市场数据
        - Launchbay Capital 2025 年 H1 VC 老股市场状况
      - - 所有合作中的药物发现项目在 Phase III 前失败风险
        - 下行
        - 高 — 药物发现结果二元；SandboxAQ 的生物制药工作尚无任何已披露 Phase III 入组项目
        - 2026–2030
        - 中 — 未见证据 ≠ 证据不存在；周期很长
        - SandboxAQ 新闻稿；FierceBiotech；Biopharma Trend
      - - 已融资 $950M+ 形成优先股堆叠，普通股需要大额退出才有价值
        - 下行
        - 中 — 未披露的清算优先权可能让回报集中到优先股
        - 退出时
        - 低 — 股权结构表不公开；幅度为估计值
        - Tracxn 融资数据；SandboxAQ 新闻稿
    notes: |
      幅度和证据质量均为分析师判断。所有前瞻性幅度估计代表基于情景的分析，不是公司指引。时间线仅作指示，受市场、监管和科学不确定性影响。
  - id: TV007
    title: 投资逻辑破裂与止损触发条件
    columns:
      - 触发因素
      - 阈值 / 事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 到 2026 年底，收入运行率显著低于规模化预期
        - 若披露，截至 2026 年 Q4 的 ARR <$50M
        - PQC 软件规模化失败或严重延迟；基准情景向悲观情景坍塌
        - 下调至回避；如可能，退出老股头寸
      - - 失去一家标杆生物医药合作伙伴（AstraZeneca、Sanofi 或 MapLight）
        - 合作伙伴公开宣布终止或不续约
        - 药物发现投资逻辑失效；乐观情景终值下调约 30–50%
        - 下修乐观情景终值；考虑降低敞口
      - - 网络安全 SaaS 中位数估值倍数压到低于 10× LTM 收入
        - CrowdStrike 或 Palo Alto 的 NTM EV/Revenue 低于 10×；板块中位数低于 8×
        - 退出倍数较当前 12–31× 可比区间压缩 30–50%；终值下滑
        - 下修情景倍数；重估基准情景回报
      - - 下一轮融资降价或平轮
        - 下一轮新股融资投后估值 ≤$5.75B
        - 收入轨迹或市场恶化引发投资人担忧的强信号
        - 升级尽调；暂缓新增老股敞口；重估所有情景
      - - Google 或 NVIDIA 公开披露终止与 SandboxAQ 的关系
        - 新闻或财报电话会披露合作伙伴退出
        - 平台信心信号消失；战略溢价收缩
        - 立即重审投资逻辑；采取回避立场
    notes: |
      上述触发项是分析判断，用作持续投资监测指标。它们不是机械规则，应结合当时市场环境和公司具体情况评估。
  - id: TV008
    title: 最终尽调待取证事项
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 尽调路径
    rows:
      - - 经验证的 ARR 与净留存率（NRR）
        - 没有 GAAP 口径或公司披露 ARR；LATKA 估算未经验证
        - 核心估值锚；决定按 $5.75B 估值标记看，收入倍数是否还在合理区间
        - 要求开放数据室；索取 2022 年至今 ARR 桥接，并按队列提供 NRR
      - - 股权结构表、优先股堆叠与反稀释条款
        - 股权结构表未公开；清算优先权未披露
        - 决定不同退出情景下普通股价值；已融资 $950M+，若退出低于 $2B，优先股可能吃掉全部回报
        - 向管理层索取创始文件、条款清单和股权结构表；条件允许时请公司法律顾问复核
      - - 政府合同管线与竞标授标条款
        - AQNav 和 PQC 合同规模、LPTA 与 best-value 条款、管线成功概率均未披露
        - 导航与国防板块可能是重要收入驱动；合同可见度决定基准情景时间线
        - 查阅 DIU、USAF 和 DARPA 授标数据库；向 BD 团队索取详细管线摘要和历史中标率
      - - 生物医药里程碑付款节奏与交易兑现概率
        - AstraZeneca、Sanofi、MapLight 交易条款未公开；里程碑触发条件未披露
        - 药物发现收入可能不平滑、二元性强且周期长；要准确建模基准和乐观情景收入时间线，必须拿到该信息
        - 索取合作协议摘要；交叉核对合作伙伴财报电话会中的里程碑表述
      - - 员工数与烧钱速度
        - 员工数和总运营费用未公开披露
        - 用来交叉估算现金效率——现金跑道和资金需求决定 $950M+ 融资能否撑到盈利
        - 向管理层索取按职能拆分的员工数和月度总烧钱；用 LinkedIn 与招聘信息交叉验证
    notes: |
      上述尽调路径是外部投资人在缺少合同性数据室权限时可采用的尽力而为做法。每条路径只具指示性；多数事项需要管理层配合。Forge Global 或 EquityZen 等平台上的老股买卖报价差，可作为不依赖管理层披露的实时估值校验。
