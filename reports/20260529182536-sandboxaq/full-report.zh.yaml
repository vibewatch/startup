    rows:
      - - PQC 算法失败，或针对 HQC / ML-KEM 的密码分析突破
        - 低
        - 灾难性 — 若 NIST 标准化算法被攻破，SandboxAQ 核心产品价值主张会被削弱
        - 中 — HQC 是备用机制；NIST 标准化了两种 KEM 以提高算法多样性
        - 低-中 — 算法多样性可部分缓释；客户重新迁移成本会很高
        - 没有发现针对 HQC 或 ML-KEM 的公开后量子密码分析证据；仍需持续跟踪 NIST
      - - 多条产品线同时推进导致交付延期
        - 中
        - 高 — AQNav、LQM 和 AQtive Guard 增强会争夺同一批工程人才
        - 低 — 未观察到公开产品路线图时间表或 SLA 承诺
        - 重大 — 产品延期会危及收入里程碑、政府合同交付物和合作伙伴承诺
        - 无公开产品路线图；没有内部访问权就无法量化交付风险
      - - 数据安全泄露或 AQtive Guard 漏洞披露
        - 低-中
        - 高 — AQtive Guard 处理客户密码资产清单；一旦泄露会伤害声誉
        - 中 — SandboxAQ 声称具备企业级安全；未发现公开事故记录
        - 中 — 网络安全公司自身安全态势若被攻破，就是可信度风险
        - 未公开确认 SOC 2 审计报告或第三方安全认证
      - - AQNav 传感器硬件在作业条件下可靠性失效
        - 中
        - 中 — AQNav 量子传感器可能在振动、极端温度或 EMI 下性能退化
        - 低 — 未公开确认正式 MIL-SPEC 环境测试
        - 重大 — 若传感器失效引发导航事故，可能失去军事客户或触发事故调查
        - 没有公开的独立环境资质数据
    notes: 可能性和严重性是基于公开信息的定性评估。公开研究未找到 SandboxAQ 产品的运营事故记录、SOC 2 报告或 MIL-SPEC 资质数据；这些都是仍待解决的尽调问题。
