      - number: '8.5'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >
              乐观论点立在三根支柱上。第一，SandboxAQ 正在构建一个专有定量 AI 平台，结构上不同于大语言模型；其护城河来自物理信息模拟、量子原生算法和专用硬件集成，并由 Google 与 NVIDIA 参与
              Series E 验证。第二，公司已经从核心垂直中的标杆客户和政府机构拿到早期证明——药物发现有 Sanofi、AstraZeneca、MapLight Therapeutics；导航和密码有 USAF 与
              DoD；PQC 有 SoftBank、Vodafone 和 Accenture——说明商业牵引是可行的，不只是愿景。第三，2025 年 4 月 $5.75 billion
              估值来自全球最成熟的一批机构参与者之间的竞争性融资流程，且每方都有独立技术尽调能力。反论点集中在三项相反观察：完全缺乏经验证
              ARR，使投资者无法区分公司究竟是变革性平台，还是资金充裕的收入前创业公司；已披露客户胜利集中在试点和概念验证，而非大型多年期企业合同；量子 AI 估值历史上经不起商业收入爬坡检验——几家纯量子软件公司到
              2025 年仍规模不足，尽管已经融入大量资本。Finro 2025 年 Q4 数据的对抗式解读，是近期最可操作的风险：即便 PQC 软件业务成功做到 $100–200 million
              ARR，在标准化公开市场也只会按 8–20× 倍数估值 $1–4 billion，相比 $5.75 billion 私募标记有实质下行。2025 年 4 月轮次投资者隐含定价，是一个或多个垂直到五年内做到
              $250+ million ARR；这一目标需要多垂直同时执行，而公司披露历史中没有先例。
            claimRefs:
              - CV030
              - CV031
              - CV035
              - CV036
              - CV037
              - CV038
          - type: table
            tableRef: TV007
            claimRefs: []
      - number: '8.6'
        title: 建议、退出准备度与尽调问题
        blocks:
          - type: paragraph
            body: >
              建议：继续研究。2025 年 4 月 $5.75 billion
              估值相对任何可验证收入指标都偏高。如果没有确认的年化收入、客户留存数据，以及优先权栈悬垂的清晰图景，就不应按当前价格入场。置信度为中，主要受制于公司未披露财务——证据清楚地证明了这一限制，而不是掩盖它。风险评级为高：公司所处市场资本密集、周期长，同时跨多个垂直承担显著执行风险；相对于任何合理的当期
              ARR 估计，隐含倍数都处在历史极端。2032 年前较可能的退出路径包括：被国防主承包商战略收购（例如寻求密码和传感能力的大型政府 IT 或国防主承包商供应商）；大型网络安全厂商收购 PQC
              平台；大型药企收购药物发现 AI 平台；通过 Forge 类平台向机构投资者进行二级销售；以及收入规模足够大且可预测后最终 IPO。Launchbay Capital 数据把 SandboxAQ 列为 H1
              2025 最活跃二级市场标的之一，意味着内部人士和员工存在流动性需求，这与公司距离 2022 年融资已三年多相符——这是二级供给信号，不是二级需求底线。关键尽调问题包括：企业 PQC 软件客户经验证的 ARR 和
              NRR；AstraZeneca、Sanofi 与 MapLight 合作的里程碑付款计划和交易概率；AQNav DoD
              项目的政府合同价值、获奖概率和竞争动态；完整股权结构，包括优先权栈、清算优先权和反稀释条款；用于现金效率三角验证的员工人数和烧钱率；以及实时估值核验所需的当前二级市场买卖价差。打破论点的事件包括：到 2026
              年底披露的年化收入显著低于 $50 million、失去标杆生物医药合作伙伴，或公开市场网络安全 SaaS 倍数压缩到 10× 以下。
            claimRefs:
              - CV035
              - CV036
              - CV037
              - CV038
              - CV039
              - CV040
          - type: table
            tableRef: TV008
            claimRefs: []
