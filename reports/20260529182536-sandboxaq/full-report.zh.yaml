      - number: '1.2'
        title: 领导层、董事会与关键人物依赖
        blocks:
          - type: paragraph
            body: >
              Jack Hidary 是 SandboxAQ 的 CEO，也是公司最突出的公开代表。他的背景横跨连续创业、学术 神经科学和应用 AI。他创办了 EarthWeb（后来的 Dice，NYSE: DHX），联合创办
              Vista Research （被 Standard & Poor's / McGraw-Hill 收购），在 Columbia University 学习神经科学，并在 National Institutes
              of Health 拿到 Stanley Fellowship in Clinical Neuroscience，期间将 早期神经网络用于功能性脑成像。他还撰写了《Quantum Computing: An
              Applied Approach》，该书 目前已出第二版。从生命科学研究，到连续创业，再到量子 AI 公司领导者，他的个人轨迹与 SandboxAQ 的多领域战略相吻合。他在 CEO Magazine
              采访中称，SandboxAQ 的使命源自他亲眼 看到基础科学转化为临床应用有多难。

              Eric Schmidt 是 Google 前 CEO、Alphabet 前执行董事长，他在 2022 年 3 月公司发布时加入 并担任董事会主席。Schmidt 也是 SandboxAQ
              多轮融资中的个人投资人。他带来网络资源和声誉 背书，并在 2024 年 12 月新闻稿中公开称 Hidary 是“一位世界级、高诚信的 CEO”。Hidary 作为 运营领导者、Schmidt
              作为治理锚点，这一组合在高管层和董事会层面都形成关键人物集中。

              除 Hidary 和 Schmidt 之外，Yahoo Finance 和 CB Insights 将 Andrew McLaughlin 列为 COO。 The Org 识别出 8
              人领导团队，但公开页面没有列出全部姓名。网络安全业务部门由总经理 Marc Manzano 管理；AI 仿真部门由总经理 Nadia Harhen 管理。除 Schmidt 之外的董事会构成
              没有在公开来源中充分披露，这对任何尽调投资人都是实质性治理缺口。
