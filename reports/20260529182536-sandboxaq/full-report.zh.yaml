      - number: '3.6'
        title: 护城河评估与替代风险
        blocks:
          - type: paragraph
            body: >-
              SandboxAQ 的竞争护城河因细分而差异很大。在 PQC 中，护城河最弱：大型既有厂商（IBM、Entrust） 与同一批企业和政府买方已有 PKI 和密码管理关系，PQShield
              也已经交付通过硅级认证的产品。AQtive Guard 的差异化论点建立在 AI 增强密码发现上，声称能超越静态 CLM 工具；但既有厂商凭现有平台投资 可以复制这一优势。

              在 AI-SPM 中，竞争窗口很窄。Google 收购 Wiz 后，一个关键独立可比对象消失，并引入 Google Cloud 打包风险。Palo Alto 的 Prisma Cloud 已经占据企业 CISO
              注意力。SandboxAQ 必须在市场 商品化前，证明自己相比既有厂商打包的 AI-SPM 功能有可衡量优势。

              在生命科学中，切换成本和护城河问题取决于工作流集成深度。Schrödinger 在制药发现工作流中 嵌入了 30+ 年研发。SandboxAQ 的量子优势论点（分子性质预测的速度和准确性）必须克服前 20
              大制药账号中的深度工作流锁定。SandboxAQ 仿真产品没有公开披露制药客户数量，这是关键尽调 缺口。

              在导航和传感中，防务认证和资质管线为既有厂商创造天然护城河。不过，GPS 弹性 PNT 系统的 市场需求正在加速——驱动力来自电子战和对抗环境要求——如果 SandboxAQ 能在 Advanced
              Navigation 和 Q-CTRL 之前或同时取得军用认证，量子传感导航就确实存在窗口。

              跨所有细分，多产品战略带来横向风险：如果 SandboxAQ 在任何单一细分都没有主导市场地位， 它可能在每个领域都被聚焦竞争者执行超越，同时工程和 GTM 资源被摊得过薄，难以取得品类领导权。
