      - number: '8.3'
        title: 情景分析与倍数框架
        blocks:
          - type: paragraph
            body: >
              公司未披露收入，因此估值必须采用情景框架，并把所有假设摊开。三个情景用到 2027–2028 年的实质不同收入轨迹作为分析锚；考虑投资者构成和 2022
              年剥离时间，这也是流动性事件最可能出现的窗口。悲观情形下，后量子密码市场发展慢于 NIST 2024–2025 年标准本应催化的速度；药物发现和导航部门到 2028 年仍处于收入前阶段；混合 ARR 仅达到
              $40–60 million。按 8–15× SaaS 倍数（与 Finro 2025 年 Q4 标准化应用型 AI 网络安全可比公司一致），隐含终值为 $320 million 至 $900 million，较
              2025 年 4 月入场估值约折价 85–94%。基准情形下，PQC 软件随企业合规要求扩张，药物发现从既有医药合作伙伴处产生里程碑式许可费，AQNav 获得首个商业性政府合同；到 2027–28 年混合 ARR
              达到 $150–250 million，按 15–20× 倍数隐含终值 $2.25–5.0 billion，低于或小幅高于 $5.75 billion
              轮次价格。乐观情形下，三大主要垂直都取得商业牵引：AQBioSim 到 2028 年产生三到五个带里程碑收入的医药合作；AQNav 拿下规模可观的多年期 DoD 合同；PQC 迁移需求在 NIST 期限逼近
              2030 年时加速；混合 ARR 达到 $400–600 million，按 20–30× 倍数隐含 $8–18 billion 终值，即相对 2025 年 4 月轮次价格回报 1.4–3.1×。若要用
              CrowdStrike 当前 31× LTM 收入倍数支撑 $5.75 billion 估值，SandboxAQ 需要约 $185 million LTM 收入，意味着三年内较 LATKA 2024 年估计增长
              10×。连续收入里程碑下的隐含 EV/ARR 清楚显示，当前估值已经远超近端收入视野：ARR 为 $50 million 时倍数是 115×；$100 million 时是 57.5×；只有达到 $200
              million 时才接近 28.75×——进入高增长 SaaS 先例区间，但前提是多垂直执行显著兑现。Finro 2025 年 Q4 分析确认，应用垂直中的后期 AI
              公司面临倍数压缩，这增加了悲观情形的下行凸性。Launchbay Capital H1 2025 二级市场报告发现，低于顶级“流动”门槛（二级市场交易估值超过 $10 billion）的公司面临买卖价差扩大；这与
              SandboxAQ 当前规模和有限收入可见度下的半流动二级市场画像一致。
