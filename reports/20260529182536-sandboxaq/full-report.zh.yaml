    summary: 依赖图追踪 SandboxAQ 在基础设施、标准、政府项目和生态上的关键外部依赖，并将每个依赖映射到其支撑的产品。
    data:
      nodes:
        - id: d1
          label: Alphabet 与 Google Cloud
          detail: 云基础设施、市场进入渠道、历史 IP、战略投资者
        - id: d2
          label: NIST PQC 标准（FIPS 203、204、205）
          detail: AQtive Guard 的监管锚点；SandboxAQ 参与编写 HQC 和 SPHINCS+
        - id: d3
          label: US DoD 与 DoW CIO
          detail: 五年期 PQC 迁移锚定合同；主要政府收入来源
        - id: d4
          label: USAF、AFWERX 与 DIU
          detail: AQNav 的 SBIR Phase 2B TACFI；DIU 量子传感项目验证
        - id: d5
          label: Acubed（Airbus Silicon Valley）
          detail: AQNav 共同开发、飞行测试基础设施、适航验证伙伴
        - id: d6
          label: Anthropic Claude API
          detail: 药物发现 LQM 的 LLM 接口；2026 年 5 月上线
        - id: d7
          label: Deloitte 与 Accenture GSI
          detail: AQtive Guard 与 LQM 的企业分销、咨询交付和实施
