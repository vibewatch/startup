  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场范围与边界
        blocks:
          - type: paragraph
            body: >-
              SandboxAQ 覆盖四个部分重叠但结构差异很大的支出池。必须精确定义边界，因为把它们合并成 一个“量子 AI” TAM，会高估可触达支出，也会掩盖各细分市场完全不同的竞争动态。

              第一个、也是商业化最成熟的细分，是密码态势管理（CPM）和后量子密码学（PQC）迁移。纳入 范围的支出包括：密码资产发现和清单工具、证书与密钥生命周期管理、后量子迁移编排，以及与 NIST 和 NSA
              要求绑定的合规 / 审计报告。排除范围包括：更广义的 PKI 硬件（HSM）、作为品类 的传统证书颁发机构，以及 PQC 只是增量固件功能、并非主要采购驱动的网络安全设备。现状替代
              方案是既有机器身份平台（Venafi、Keyfactor）和正在把 PQC 模块加入现有产品线的 PKI/HSM 供应商（Entrust、Thales、IBM）。

              第二个细分是 AI 安全态势管理，聚焦非人类身份（NHI）、智能体 AI 工作负载和影子 AI。它包括： AI 智能体身份治理、机器凭证生命周期管理，以及智能体 AI 的运行时护栏。排除范围包括：面向
              人类用户的传统身份与访问管理（IAM）、端点检测，以及无关的零信任网络。现状替代方案是传统 IAM/PAM 平台（CyberArk、Okta），这些平台并非为高速自主身份设计。

              第三个细分是生命科学 AI 仿真：基于物理的分子动力学、蛋白结构预测和亲和力评分，以及 AI 加速药物候选物筛选。排除：实验室自动化硬件、临床数据管理，以及没有物理仿真组件的通用 制药数据分析。替代方案包括
              Schrödinger、Recursion Pharmaceuticals 的仿真平台，以及内部 计算化学团队。

              第四个细分是面向防务平台的无 GPS 导航和量子传感，平台包括 UAV、自主地面车辆和潜艇。排除： 传统 GPS 接收器、卫星通信和商用航空导航。替代方案包括 Collins
              Aerospace、Honeywell 和 Safran 的传统 INS。
