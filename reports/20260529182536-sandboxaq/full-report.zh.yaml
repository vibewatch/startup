      IR（2026 年 2 月）；此处未引用它们的 EV/收入倍数，需要访问当前市场数据。所有数值均为近似值，仅供指示性比较。
    enumerationScope:
      coverage: partial
      basis: >-
        Six publicly traded companies selected as best available analogs across cybersecurity SaaS, government AI,
        quantum computing, and AI drug discovery; excludes private comps and M&A transactions for which deal terms are
        not publicly disclosed.
