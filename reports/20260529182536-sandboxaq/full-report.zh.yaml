  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品组合与运营模式
        blocks:
          - type: paragraph
            body: >-
              SandboxAQ 将其 B2B 产品组合组织为三个商业部门和一个研究性垂直领域。以 AQtive Guard 为核心的网络安全部门， 解决密码态势管理和 AI 安全态势管理（AI-SPM）。生命科学部门以
              AQBioSim 运营，并包含 AQChemSim 和 AQAffinity 等子产品，向 AstraZeneca 和 Sanofi 等生物制药客户提供基于物理的分子模拟和药物亲和力预测。导航和传感部门生产
              AQNav，这是一套处于 USAF 合同执行中的磁导航（MagNav）系统；同时还有 AQMed，这是一项量子心磁图传感工作，被列为早期应用， 但未披露商业部署。公司
              2026年2月发布的官方概览识别了全部四个领域，并明确将其核心技术标记为 Large Quantitative Models （LQMs）——在定量、物理基础数据上训练的 AI 系统，而不是在语言语料上训练。


              运营模式在四个垂直领域均为企业 B2B。AQtive Guard 直接销售给企业安全团队，并通过 Accenture 和 Deloitte 等渠道伙伴销售。 生命科学产品销售给生物制药研究机构。AQNav
              在美国空军 SBIR 合同下开发，并通过 Boeing 和 Acubed（Airbus）等航空航天伙伴走向军民两用商业采用。 AQMed 面向医院和研究机构客户，用于心磁图传感。公司在 TIME 100
              中的介绍将这一产品组合描述为赋予研究人员“超能力”的工具—— 这种定位适合高端企业关系，但限制了买方通常需要的 SLA 和定价清晰度。


              最尖锐的尽调缺口是缺乏按产品线划分的公开商业收入数据。SandboxAQ 未披露 ARR、合同金额或产品级客户数量。与同等年龄的大多数早期公司相比， 其产品组合更宽，这引发了关于聚焦度的问题；2025年4月完成的
              $450M E 轮似乎正是为了通过为多个部门同步扩张提供资金来回应这一问题。
