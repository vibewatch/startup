    rows:
      - - 私营公司估值高且公开财务披露稀少
        - 美国（投资者保护）
        - 持续 — 未披露审计财务、未发布 GAAP 收入；投资者依赖公司自报数据
        - 中
        - 中 — 无法核验收入或成本结构，使 $5.75B 估值下的尽调存在盲区
        - 数据室访问；第三方审计；客户合同证据验证商业牵引力
        - 重大 — 仅靠公开信息无法证实或证伪商业 PMF
        - 在数据室索取审计财务、按客户拆分的 ARR，以及投资者董事会材料
      - - CNSA 2.0 与 NIST PQC 合规要求（FIPS 203、204、205）
        - 美国联邦（NSS 系统）
        - 生效 — NIST 于 Aug 2024 定稿；新 NSS 系统必须在 Jan 2027 前合规
        - 高
        - 中 — 不合规 AQtive Guard 实施可能失去 NSS 合同资格
        - 向 NIST 标准贡献 HQC 和 SPHINCS+；AQtive Guard 映射 CNSA 2.0
        - 低 — SandboxAQ 与标准对齐，但必须跟上未来 NIST 更新
        - 确认 AQtive Guard 路线图覆盖每个 FIPS 标准版本
      - - BIS 对量子技术的出口管制（EAR Part 742，Sept 2024 生效）
        - 美国（全球适用）
        - 生效 — 量子计算物项和技术在全球范围内需要许可证
        - 高
        - 高 — 违反 EAR 可能触发罚款、合同禁入和刑事风险
        - 内部出口合规计划；对非 IEC 国家转让申请 BIS 许可证
        - 重大 — 国际扩张受限；雇用外籍员工需要视同出口审查
        - 获取 BIS 出口法律意见；核验目标市场许可证例外资格
      - - CMMC 2.0 DoD 网络安全合规（Nov 2025 强制）
        - 美国 DoD
        - 生效 — 自 Nov 2025 纳入 DoD 合同；需年度证明
        - 中
        - 中 — CMMC 合规中断可能危及 DoD 合同资格
        - 内部网络安全态势管理；聘请第三方评估机构
        - 持续 — 合规按年执行；分包商下传义务增加复杂度
        - 确认 C3PAO 评估时间表；核验所有分包商达到 CMMC Level 2
      - - ITAR 与 USML 对 AQNav 量子传感器的潜在分类
        - 美国（全球）
        - 不确定 — 若用于军事系统，AQNav 传感器可能被归类为 ITAR 防务物项
        - 低-中
        - 高 — ITAR 误分类会触发严厉执法；可能被追溯分类
        - 向 DDTC 提交商品管辖（CJ）请求，确认 EAR 与 ITAR 分类
        - 重大 — 若受 ITAR 管制，国际 AQNav 商业销售需要美国国务院授权
        - 向 DDTC 提交 CJ 请求；启动国际 AQNav 销售前聘请 ITAR 律师
    notes: >-
      披露和估值不透明的判断基于公开信息可得性，适用于所有后期私营公司；并未提出具体财务不当行为指控。CMMC 2.0 和 CNSA 2.0 时间表来自已发布的 DoD 与 NIST 指引。ITAR 可能性为分析师估计；未发现针对
      SandboxAQ 的公开 ITAR 执法行动。
    enumerationScope:
      coverage: partial
      basis: >-
        Covers five highest-severity regulatory and legal risk categories for SandboxAQ as of May 2026, based on public
        information, published regulatory standards, and DoD contracting requirements. Does not include potential EU or
        UK quantum regulation, sector-specific data-privacy obligations (GDPR, HIPAA), or healthcare regulatory pathways
        (FDA or CE), which are addressed separately.
