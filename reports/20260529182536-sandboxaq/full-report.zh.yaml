      - number: '8.4'
        title: 战略可选性、上行空间与下行风险
        blocks:
          - type: paragraph
            body: >
              SandboxAQ 的估值有结构性可选性支撑，单纯收入倍数现阶段无法完全捕捉。公司同时竞争至少四个市场——后量子密码软件、AI
              驱动药物发现、量子传感导航和心磁图医疗设备——每个市场一旦商业规模跑出来，都有独立支撑数十亿美元企业价值的潜力。Google 和 NVIDIA 进入 Series E
              尤其强：两家公司技术尽调能力很深，也都有战略兴趣让 SandboxAQ 的大型定量模型成为各自 AI 生态的补充。BNP Paribas 入局，是为了探索金融服务中的 AI
              和量子技术，带来一个具备部署能力的大型机构伙伴。按 Ray Dalio 在新闻稿中的公开表态，他的参与反映了对 SandboxAQ 团队定量 AI 方法的信念。政府合同可见度——包括多年期 USAF AQNav
              延展和 DoD 密码合作——提供了部分经常性收入锚，且不受标准企业销售周期约束。Alphabet 血统带来深厚技术人才，也增强了公司面对受监管企业和政府买家的可信度。下行方面，Finro 2025 年 Q4
              分析提供了负向锚：应用型 AI 网络安全公司的定价越来越接近成熟 SaaS 常态（8–15× 收入），不是前沿模型溢价（25–40×）。Forge Global 2025 年私募市场数据显示，AI
              融资集中在少数精英标的，非精英 AI 公司的二级折价扩大。药物发现仍是高风险、长周期垂直：SandboxAQ 的生物医药合作（AstraZeneca、Sanofi、MapLight）尚无任何公开披露的 Phase
              III 临床试验入组候选物，里程碑付款天然不均衡。超过 $950 million 的融资对应的优先权栈未公开；按典型清算优先权结构，普通股可能需要 $2+ billion 退出才有实质价内价值。
            claimRefs:
