      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              在 SandboxAQ 的核心 PQC 细分中，最强的两项需求驱动是监管要求和“现在收集、日后解密”威胁。 NIST 于 2024 年 8 月最终确定 FIPS 203、204 和
              205——首批政府标准后量子算法——结束了八年 评估过程，并为企业迁移提供法律和合规基础。CISA 的后量子密码倡议提供跨机构协调和关键 基础设施指引。NSA 的 CNSA 2.0
              则为国防工业基础设置硬性合规期限： 所有新的国家安全系统（NSS）采购必须在 2027 年前使用抗量子算法。

              尽管有监管顺风，企业实际迁移仍受几项长期因素约束。Entrust 2024 年全球调查发现，PQC 认知 度很高，但广泛行动滞后：51% 的组织认为管理密码资产极其困难或非常困难，54% 将缺乏明确
              归属列为首要挑战。Encryption Consulting 指出，多数企业实际证书数量比自认为的多 2–5x， 形成密码债务，使任何迁移的前置条件——基础清单——本身就成了多年工程。CyberArk
              和其他供应商 指出，漫长集成周期、更大的 PQC 密钥尺寸，以及生态缺口（HSM、浏览器、IoT）意味着广泛采用 到 2026 年仍会不均衡。

              对 NHI 和 AI 安全细分，主要增长驱动是智能体 AI 部署的爆发式增长。在大型组织中，NHI 数量 已经以 50:1 到 100:1 的比例超过人类用户；Cloud Security Alliance
              2026 调查确认，不到四分 之一的组织有创建或移除 AI 身份的成文政策。这个治理缺口带来紧迫性，也带来销售教育难题： 多数组织仍用传统 IAM 工具管理 AI 身份，而这些工具从未为自主、高速系统设计。

              预算碎片化是横跨各细分的约束。SandboxAQ 横跨网络安全、生命科学和防务——三个预算所有者 很少出现在同一场采购讨论里。这个结构性现实限制单笔交易规模，也要求每个细分采用独立 GTM 动作。它还意味着
              SandboxAQ 的总可用市场虽然合计很大，却不能作为一个连贯漏斗去追逐。
