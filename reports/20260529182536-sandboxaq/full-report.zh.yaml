      - number: '2.2'
        title: 细分规模与估计
        blocks:
          - type: paragraph
            body: >-
              没有单一分析师把 SandboxAQ 的四个细分全部纳入同一个 TAM 伞下；各细分内部的估计也因方法和 纳入范围而差异很大。保留相互矛盾的估计，比强行给出单一数字更有信息量。

              对 PQC 密码软件和服务，Research and Markets 估计 2026 年市场规模为 $0.78B，并以 30.1% CAGR 增长，到 2030 年达到 $2.23B。Mordor
              Intelligence 估计 2026 年为 $0.88B，并以约 39% CAGR 增长，到 2030 年达到 $4.6B。Grand View Research 使用更宽口径，估计 2025 年市场为
              $1.58B，并在 2033 年前以 37.8% CAGR 增长。一些行业评论预测，若纳入全栈企业迁移咨询， 迁移服务支出到 2030 年可达 $15B；但这是把硬件替换和咨询费用打包到纯软件工具之外的外推。
              这些估计并不能直接比较，因为它们在是否纳入 QKD 硬件、HSM 和咨询项目上口径不同。

              对 NHI 和 AI 安全态势管理，MarketsandMarkets 估计 NHI 访问管理市场 2026 年为 $12.2B， 并以 12.2% CAGR 增长，到 2036 年达到
              $38.8B。这是更宽的市场，包含传统机器身份工具； 其中的 AI 智能体 / 影子 AI 安全子细分尚无独立发布的 TAM。SandboxAQ 的 AQtive Guard 专门瞄准这一子细分，这意味着其
              SAM 小于 NHI 总量。

              对 AI 驱动的药物发现和生命科学仿真，Mordor Intelligence 估计 2026 年为 $3.25B，并以 25.9% CAGR 增长，到 2031 年达到 $10.29B。Global
              Market Insights 估计 2025 年 AI 药物 发现已超过 $3.1B，并在 2035 年前以 30.5% CAGR 增长。这些估计捕捉的是软件和平台收入，
              不是仿真试图加速的全球制药研发底层支出；后者每年约 $194B。

              对无 GPS 导航（防务无人机和自主平台），FutureMarketInsights 估计无 GPS 无人机替代导航 市场 2026 年为 $178.3M，并以 9.4% CAGR 增长，到 2036 年达到
              $438M。这具体是导航子系统 市场；更广义的惯性导航系统（INS）市场（含航空、航天、海事）由 MarketsandMarkets 估计为 2026 年 $9.42B，2030 年增长至
              $11.92B。SandboxAQ 的量子传感路线瞄准这个 INS 市场中传统 惯性传感器不够用的利基。
