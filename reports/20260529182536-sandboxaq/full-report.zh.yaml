      - number: '3.5'
        title: 无 GPS 导航与量子传感竞争者
        blocks:
          - type: paragraph
            body: >-
              在无 GPS 导航和量子传感中，SandboxAQ 通过不依赖 GPS 的磁导航系统参与竞争，并拥有包括 美国空军在内的防务合同。竞争集合横跨传统惯性导航既有厂商、量子原生传感创业公司和防务 主承包集成商。

              Advanced Navigation 是一家澳大利亚公司，2026 年 3 月完成 $110M Series C，由 Airtree Ventures 领投，In-Q-Tel 和 Australian
              National Reconstruction Fund 战略参投。公司已在全球 部署超过 100,000 套惯性导航系统，80%+ 收入来自美国和欧洲，并正在美国和欧洲市场建立 PNT 卓越中心。客户包括
              Anduril、NOAA、Hanwha、BHP、Rheinmetall 和 Intuitive Machines。其 CEO 称依赖单一 GPS 来源的时代已经结束，这一信息与 SandboxAQ 的磁导航定位
              直接一致。Advanced Navigation 的软件融合引擎（AdNav Intelligence）用非量子惯性 + AI 融合 竞争，而 SandboxAQ 以量子磁传感形成差异化。

              Q-CTRL 是一家澳大利亚量子控制基础设施软件公司，推出了 Ironstone Opal——适用于无人机、 自动驾驶汽车和商业客机的紧凑型量子导航系统。TIME 将 Ironstone Opal 评为 2025
              年「最佳发明」 之一，说明其在 SandboxAQ 目标无 GPS 导航市场中释放了商业就绪信号。Q-CTRL 的 Fire Opal 产品也解决量子计算性能问题，意味着 Q-CTRL
              在导航传感和量子算法优化两方面都与 SandboxAQ 竞争。

              Honeywell Aerospace 和其他防务主承包集成商代表现状既有厂商威胁——它们深度嵌入防务和商用 航空导航供应链，并拥有认证历史，新进入者必须复制这些历史。军用导航系统的切换成本 （DO-178C
              软件认证、硬件资质、集成测试）是显著壁垒；它既保护既有厂商，也拖慢量子原生 替代方案的采用。
