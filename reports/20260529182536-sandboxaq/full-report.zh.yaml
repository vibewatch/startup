      - number: '7.4'
        title: 技术与商业不确定性
        blocks:
          - type: paragraph
            body: >-
              AQNav 磁导航在受控测试中表现很强：航路飞行时间 100% 满足 RNP 2 标准，但大规模商业部署仍有明显障碍。AQNav
              的定位精度取决于地壳磁异常图的质量和密度；许多地区磁数据稀疏，应用范围因此受限于制图充分的地理区域。AQNav 尚未取得精密进近导航适航认证（RNP 低于 0.3），商业用途只能停留在航路阶段。从 DIU
              项目经费走向大规模 DoD 采购，还要经过多轮竞争性采购和技术成熟度等级（TRL）验证，带来多年不确定性。量子传感器在受控测试之外的实际运行环境中，也还面临环境可靠性问题。药物发现这条线，SandboxAQ
              的大型定量模型（LQM）承诺加速计算机模拟发现，但现实是药物候选物临床试验失败率超过 90%。即使分子模拟准确，也无法保证临床成功，因此 LQM 收入取决于里程碑式合作经济，而不是可预测的订阅收入。2026 年
              5 月 LQM 接入 Anthropic 的 Claude
              扩大了可触达用户，但也引入平台依赖风险。医药买方采购周期长，从既有计算化学供应商迁移可能很慢。基于量子的临床诊断医疗传感市场尚未在商业上跑通，收入放大前还需要验证监管路径。
