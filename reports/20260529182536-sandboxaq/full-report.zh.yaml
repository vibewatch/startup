  - id: FV001
    title: 按情景划分的估值与终值区间
    type: range
    layout: standard
    summary: |
      基于情景 ARR 假设和可比收入倍数，展示熊市、基准和牛市情景下的示意估值区间。所有数值单位为十亿美元；入场价为 $5.75B（2025 年 4 月 Series E 投后）。
    data:
      items:
        - label: 熊市情景终值（2028E，$B）
          low: 0.32
          high: 0.9
          unit: $B
        - label: 基准情景终值（2027–28E，$B）
          low: 2.25
          high: 5
          unit: $B
        - label: 牛市情景终值（2028–30E，$B）
          low: 8
          high: 18
          unit: $B
    approximationNotes: >
      所有情景区间都是基于情景 ARR 假设（熊市 $40–60M、基准 $150–250M、牛市 $400–600M）和可比倍数（熊市 8–12×、基准 15–20×、牛市 20–30×）的分析估计。$5.75B
      入场标记仅供参考。不计稀释、优先权负担和资金时间价值。
    claimRefs:
      - CV017
      - CV018
      - CV019
  - id: FV002
    title: 以 $5.75B 估值隐含的 EV/ARR 倍数——对收入规模的敏感性
    type: bar
    layout: standard
    summary: |
      每根柱显示在 $5.75B Series E 投后估值下，给定 ARR 情景对应的隐含 EV/ARR 倍数。参考线给出 CrowdStrike（31×）和 Palantir 2026E 基准（48×）作为上下文。
    data:
      items:
        - label: ARR $18M（LATKA 2024 估算）
          value: 319
        - label: ARR $50M（2025 估算）
          value: 115
        - label: ARR $100M（2026 估算）
          value: 57.5
        - label: ARR $185M（支撑 CrowdStrike 31× 的收入）
          value: 31
        - label: ARR $200M（2027 估算）
          value: 28.75
        - label: ARR $400M（牛市 2028–30）
          value: 14.4
        - label: CrowdStrike EV/LTM 收入（2026 年 5 月）
          value: 31
        - label: Palantir EV/2026E 收入（2026 年 5 月）
          value: 48
    approximationNotes: >
      ARR 数值（LATKA 2024 年估计值除外）是情景假设，并非公司披露数据。CrowdStrike 31× 和 Palantir 48× 来自截至 2026 年 5 月的 multiples.vc 和
      StockAnalysis.com。EV/ARR 等同口径假设 ARR 等于 LTM 收入；对混合业务模式而言，这很可能高估 ARR。
    claimRefs:
      - CV007
      - CV008
      - CV025
      - CV026
      - CV027
      - CV040
  - id: FV003
    title: 投资评分卡 — SandboxAQ（2026 年 5 月）
    type: kpi
    layout: compact
    summary: |
      供 IC 审议的六项投资维度评分。评分来自分析师判断（1–10 分）；财务透明度和收入证据得分较低， 反映公司未披露 ARR 和股权结构表数据。
    data:
      items:
        - id: k1
          label: 市场机会
          value: 8/10
          subtext: 'Multiple $10B+ TAMs: PQC software, AI drug discovery, quantum navigation, financial AI'
        - id: k2
          label: 收入证据
          value: 2/10
          subtext: No disclosed ARR; LATKA estimate ~$18M (2024); implied EV/ARR ~323×
        - id: k3
          label: 竞争护城河
          value: 6/10
          subtext: Physics-informed AI differentiation; Alphabet lineage; Google/NVIDIA backing; PQC patent portfolio
        - id: k4
          label: 财务透明度
          value: 1/10
          subtext: Fully private; no GAAP disclosure; cap table and burn rate undisclosed
        - id: k5
          label: 团队与执行
          value: 7/10
          subtext: Deep technical team; Jack Hidary's track record; Alphabet alumni network; strong CEO
        - id: k6
          label: 估值风险（10=风险最低）
          value: 2/10
          subtext: Stretched at $5.75B; extreme implied multiple; $950M+ preference overhang unquantified
    claimRefs:
      - CV007
      - CV008
      - CV028
      - CV030
      - CV031
      - CV036
  - id: FV004
    title: 推荐逻辑 — SandboxAQ 估值章节
    type: flow
    layout: standard
    summary: |
      从证据支柱到估值立场，再到最终建议的决策链。按当前证据，反向节点（收入缺口、 估值偏高）压过正向节点。
    data:
      nodes:
        - id: n1
          label: 多垂直大 TAM
          detail: PQC 软件、AI 药物发现、量子导航成熟后各自都超过 $10B；合计 TAM 可能超过 $30B+。NIST 强制要求和制药研发投入提供结构性顺风。
          tone: positive
        - id: n2
          label: 已验证收入缺口
          detail: 公司未披露 ARR；LATKA 第三方估计约 $18M（2024 年）。若以 $5.75B 入场，隐含 EV/ARR 约 323×，相对所有上市可比公司都是极端离群点。
          tone: negative
        - id: n3
          label: 强技术护城河与投资人背书
          detail: Alphabet 背景、NVIDIA 和 Google 参与 Series E 轮、PQC 标准对齐（NIST FIPS 203/204/205）， 以及政府合同可见度，部分支撑溢价。
          tone: positive
        - id: n4
          label: 估值偏高
          detail: >-
            估值 $5.75B 时，即便基准情景（ARR $150–250M、15–20×）也勉强够到入场价格。悲观情景意味着 85–94% 下行。Finro 2025 年 Q4 数据显示，应用 AI 网络安全定价偏向
            8–15× 的 SaaS 常态，而不是前沿模型溢价。
          tone: negative
        - id: n5
          label: 建议：继续研究
          detail: 投入资金前，先等 ARR 披露、NRR 数据和优先股堆叠结构清晰。置信度： 中。估值立场：偏高。风险评级：高。
          tone: neutral
      edges:
        - from: n1
          to: n2
          label: 大 TAM + 当前收入低 → 收入兑现前的平台押注
        - from: n2
          to: n4
          label: 收入缺口推高 300× 隐含倍数 → 估值偏高
        - from: n3
          to: n4
          label: 护城河能部分抵消，但解决不了估值溢价
        - from: n4
          to: n5
          label: 估值偏高且收入未验证 → 继续研究
    claimRefs:
      - CV035
      - CV036
      - CV039
