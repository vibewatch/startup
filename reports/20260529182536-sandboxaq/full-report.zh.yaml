  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与分析框架
        blocks:
          - type: paragraph
            body: >-
              SandboxAQ 不是单一市场竞争者。其产品组合覆盖四个工作负载细分——后量子密码学（PQC）/ 密码态势管理、AI 安全态势管理（AI-SPM）、生命科学和材料仿真，以及无 GPS 导航——每个细分
              都有不同买方画像、采购周期和竞争集合。这种结构性宽度既是战略差异点，也是脆弱点：它让 SandboxAQ 可以向企业关系中交叉销售，但也意味着公司必须同时在四个技术要求很高的领域，对
              专业既有厂商证明产品市场匹配。本章竞争分析按工作负载细分组织，而不是按单一整体市场组织。

              平台层面，SandboxAQ 面对两类对手：（1）大型既有安全供应商（IBM、Entrust、Palo Alto Networks），它们正把量子和 AI 安全功能嵌入现有企业足迹；（2）聚焦型创业公司和纯玩家
              专家（PQShield、Protect AI、Q-CTRL），能力更窄但更深。尽调问题不只是 SandboxAQ 是否在 每个细分都有产品，而是它是否拥有差异化的产品市场匹配，足以在各领域替代根深蒂固的替代
              方案或内部自建选项。

              Dark Reading 2026 年对更广 AI 网络安全投资市场的分析指出，“差异化很难”，许多 AI 原生 安全创业公司正面对扩大的“死亡之谷”，因为资本集中到更少、更大的押注上。截至 2026 年，
              网络安全独角兽已超过 75 家，且重大整合正在推进——Google 以 $32B 收购 Wiz 的交易于 2026 年 3 月完成——这使多产品平台在多个细分争取企业牵引时，竞争环境变得更激烈。
