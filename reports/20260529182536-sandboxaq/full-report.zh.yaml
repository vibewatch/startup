  - id: FO002
    title: 公司快照逻辑
    type: flow
    layout: standard
    summary: SandboxAQ 的 LQM 平台连接三类商业应用，底层来自 Alphabet 研发传承，资金来自战略和财务投资人。
    data:
      nodes:
        - id: lqm
          label: 大型量化模型（LQMs）
          detail: 核心自研 AI 框架；训练数据不是语言，而是量化 / 物理数据；定位为补充 LLM，用于 B2B 科学和企业场景。
          tone: positive
        - id: security
          label: 密码学与 AI 安全
          detail: AQtive Guard（AI-SPM、PQC 迁移）；DoW CIO 五年合同；符合 NIST FIPS 203/204/205；目标客户是企业和政府。
          tone: positive
        - id: lifesci
          label: 生命科学与材料
