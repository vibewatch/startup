      - number: '1.3'
        title: 融资历史、估值与投资人图谱
        blocks:
          - type: paragraph
            body: >
              自 2022 年 3 月拆分以来，SandboxAQ 已完成五次融资事件。发布时公司完成了一轮九位数美元 融资（具体金额未披露）；投资人包括 Breyer Capital、Eric Schmidt、T. Rowe
              Price、 Guggenheim Investments、TIME Ventures（Marc Benioff）、Thomas Tull、First Light Capital Group、Section 32
              和 Parkway Venture Capital。2023 年 2 月，Reuters 和 TechCrunch 确认 公司完成 $500 million 融资，PitchBook 估计投后估值约 $4
              billion。

              2024 年 12 月，SandboxAQ 宣布一轮超过 $300 million 的融资。官方 PRNewswire 新闻稿称， 该轮融资按投前口径给公司的估值为 $5.3
              billion。不过，Reuters（经 SRN News）和 JustAINews 都引用 $5.6 billion；Quantum Insider 也引用 $5.6 billion 投前估值。最可能的
              解释是，官方 $5.3 billion 是投前估值，而媒体流传的 $5.6 billion 是 $300M+ 融资完成后的 投后估值——但 SandboxAQ 没有确认这一点。这一估值冲突是具体证据缺口。2024
              年 12 月投资人 包括 Fred Alger Management、T. Rowe Price、Mumtalakat、Breyer Capital、Rizvi Traverse、 S32、US
              Innovative Technology Fund、Ava Investments、Eric Schmidt、Marc Benioff、David Siegel 和 Yann LeCun（Meta 首席 AI
              科学家）。

              2025 年 4 月，Series E 完成交割，累计融资超过 $450 million，并新增 Ray Dalio（Bridgewater Associates）、Horizon Kinetics、BNP
              Paribas、Google 和 NVIDIA 进入投资人名单。公司官方 新闻稿确认，自 2022 年拆分以来累计融资超过 $950 million。TIME100 和 Tracxn 均称，2025 年 4
              月融资后公司投后估值约 $5.75 billion。TechCrunch 曾在 2024 年 10 月报道，SandboxAQ 正在 以约 $5 billion 估值寻求下一轮融资；报道认为，考虑到公司 2023
              年已融得 $500 million， 这次融资接触本身值得关注。
