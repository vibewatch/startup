  - id: FU001
    title: 企业网络安全客户旅程图
    type: journey-map
    layout: wide
    summary: 展示 SandboxAQ 的 AQtive Guard 客户从监管触发到产品扩张的五阶段旅程，并列出各阶段的具名客户案例。
    data:
      nodes:
        - id: awareness
          label: 认知与监管触发
          detail: >-
            NIST FIPS 203/204/205 发布（2024 年 8 月）、NSA CNSA 2.0 要求、DoD 关于量子易受攻击加密的行政令，或董事会层面的 HNDL 风险简报，都会促使 CISO
            行动。SandboxAQ 通过 Accenture 渠道、思想领导内容和 RSAC 露出触达买方。
        - id: evaluation
          label: 评估与密码资产盘点
          detail: >-
            AQtive Guard 执行密码资产清单盘点——扫描网络、文件系统和云，查找脆弱证书、弱算法和未加密流量。Vodafone 和 SoftBank 都通过 PoC 扫描进入。Accenture
            联合加密风险评估服务是渠道入口。
        - id: pilot
          label: 试点部署
          detail: 分阶段在一个业务单元或网络段铺开。SoftBank 扫描了一个地方政府网络作为验证阶段。Mount Sinai 将 PQC 协议接入其健康网络的一个子集。典型周期为 6-12 个月，直到生产验证。
        - id: production
          label: 生产规模化与合同
          detail: >-
            企业全量部署，并配有 SLA 支持。SoftBank Advanced Research Group 于 2024 年 3 月进入生产。DoW CIO
            五年协议是已确认最深的生产承诺。SSO、审计日志、横向扩展等企业功能支撑大规模铺开。
        - id: expand
          label: 扩张与多产品
          detail: 继续加入其他 SandboxAQ 产品：用于影子 AI 检测的 AI-SPM、PQC 迁移编排，或面向国防客户的 AQNav。多年续约由监管合规期限驱动（NSA CNSA 2.0 时间表、NIST 迁移计划）。
    approximationNotes: 阶段时间估算基于独立 SWOT 分析和 Model B 市场进入评估，并非 SandboxAQ 披露。具名客户旅程时间线根据连续新闻稿重建。
    claimRefs:
      - CU005
      - CU009
      - CU022
      - CU026
      - CU028
