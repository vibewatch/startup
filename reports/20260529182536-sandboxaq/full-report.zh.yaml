      - number: '4.2'
        title: 资本形成与投资者名册
        blocks:
          - type: paragraph
            body: >
              自 2022年3月从 Alphabet 剥离以来，SandboxAQ 已完成五次不同的融资事件，并在 2025年7月完成一次二级发行。 2022年3月剥离时的首轮融资金额未披露，但为九位数，由 T. Rowe
              Price、Breyer Capital、Eric Schmidt、 Guggenheim Partners、Marc Benioff（TIME Ventures）、Thomas Tull、Parkway
              Venture Capital、IQT 等支持。2023年2月，公司从基本相同的投资者群体完成 $500M 成长资本融资，用于扩展后量子密码和量子模拟产品线。 2024年12月一轮融资以 $5.3B
              投前估值（按官方新闻稿）或 $5.6B 投后估值（按 Reuters）筹集超过 $300M， 新投资者包括 Fred Alger Management、Mumtalakat、Rizvi Traverse、S32
              和 Yann LeCun。

              2025年4月，E 轮又从 Ray Dalio、Horizon Kinetics、BNP Paribas、Google 和 NVIDIA 获得一笔 $150M 分期资金，使 E 轮总额约达
              $450M，自成立以来总融资超过 $950M。SandboxAQ 官方公告引用了 $5.75B 投后估值。Reuters 另行报道公司价值为 $5.6B。多个二级市场 SPV——包括 Parkway
              Co-Investment 11 (SandboxAQ) LP（Form D 于 2024-05-30 提交）和 HII SandboxAQ Series I（Form D 于 2026-01-09
              提交）——已提交 SEC 豁免发行通知，确认二级市场对 SandboxAQ 股权的需求。

              2025年7月，公司完成一笔 $95M 的超额认购二级发行，由 Rizvi Traverse、Forge Global 和 Ava Family Office 牵头，明确用于为员工提供流动性。这使总融资额达到约
              $1.045B。这些交易确认了机构投资者持续的兴趣， 但并不意味着 2025年4月一级融资结束后还有任何额外的一级运营资金。
