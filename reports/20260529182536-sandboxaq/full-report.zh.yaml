chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、起源与商业模式
        blocks:
          - type: paragraph
            body: >
              SandboxAQ 是一家独立企业 AI 公司，总部位于 California 州 Palo Alto。公司自 2016 年起 作为 Alphabet 内部团队运作，并于 2022 年 3 月 22 日正式从
              Alphabet Inc. 拆分独立。 公司与 Alphabet 不再存在子公司或母公司关系；Google 是 Series E 的投资方之一，但没有 治理控制权。SandboxAQ
              是一家有风投支持的私营公司，未在任何公开证券交易所上市。

              公司自称是企业定量 AI 的全球领导者。其核心自研框架是大型定量模型（LQM）—— 这类 AI 系统用定量、物理感知数据（数值方程、分子结构、传感器读数）训练，而不是语言 token。管理层明确把 LQM
              定位为大语言模型（LLM）的补充，但并非同类技术： CEO Jack Hidary 曾说，“经济的大部分其实并不基于语言——而是基于定量关系”，Reuters 在 2024 年 12
              月报道中也沿用这一表述。这个定位很关键，因为它解释了 SandboxAQ 为什么切入 密码学、药物发现和导航等问题——这些场景里，基于物理的计算才是差异点。

              商业模式是 B2B 企业 SaaS 和解决方案。SandboxAQ 将目标垂直定义为生物医药、化学、材料 科学、网络安全、金融服务、防务和导航。收入未公开披露。公司拆分后立即启动商业化，并在 2022 年 3
              月发布公告时将 Vodafone Business、SoftBank Mobile、Mt. Sinai Health System 和 Wix 列为早期客户。公司官方 FAQ
              明确表示，不会向公众分享收入数字，任何第三方估计都 应视为推测。
