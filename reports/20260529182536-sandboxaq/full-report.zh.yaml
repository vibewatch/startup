      - number: '2.3'
        title: 买方分层与采用路径
        blocks:
          - type: paragraph
            body: >-
              SandboxAQ 四个细分各自有不同的买方画像、预算权限和采购触发因素。把它们混成单一买方原型， 会误读真实的 GTM 动态。

              在 PQC 和密码态势管理细分，主要买方是大型企业（金融服务、电信、防务承包商、联邦机构）的 CISO 或首席安全官，并由 IT 合规团队支持。NSA CNSA 2.0 要求——到 2027 年 1 月，新
              NSS 采购必须使用抗量子算法——是防务承包商和联邦机构最强的采购触发因素。非 NSS 企业 买方受审计要求、“现在收集、日后解密”威胁带来的数据寿命担忧，以及董事会层面的风险要求 驱动。IBM 与
              Entrust 在 2026 年 4 月推出联合 CPM 产品，说明企业市场已经吸引拥有既有客户 关系的大型既有厂商入场。

              在 NHI 和智能体 AI 安全细分，买方转向身份与访问管理（IAM）团队、平台安全工程师，以及拥有 大型 AI 工作负载公司的 DevSecOps 负责人。采用触发因素是智能体 AI 部署——组织部署越多带有
              API 凭证和服务账号的 LLM 智能体，NHI 攻击面越大。Cloud Security Alliance 2026 调查发现， 只有 12% 的组织高度确信自己有能力阻止基于 NHI 的攻击，超过 16%
              根本不跟踪新 AI 身份创建， 说明专用工具仍有大量空白。

              在生命科学仿真中，付款方是制药或生物技术公司的计算生物学或 AI 研究团队，预算通常由研发 负责人或 CTO 职能掌握。采用触发因素是管线生产率——降低识别可行药物候选物的时间和成本。
              这是更长的销售周期，并需要概念验证。替代方案（Schrödinger、内部团队）已经深度嵌入。

              在面向防务的无 GPS 导航中，买方是防务部门或主承包商内部的项目办公室，负责评估特定平台 （UAV、潜艇）的传感器载荷。采购路径要经过防务采办周期，从技术成熟度等级（TRL）评估到
              生产合同可能需要多年。这是四个细分中近期收入路径最不成熟的一条。
