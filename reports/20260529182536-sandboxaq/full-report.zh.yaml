      - number: '5.6'
        title: 部署要求、缺口与技术风险
        blocks:
          - type: paragraph
            body: >-
              AQtive Guard 的部署模式基于代理/扫描器，跨代码仓库、云环境和网络层运行，无需替换基础设施。Accenture-SandboxAQ Encryption Risk Assessment 将
              AQtiveGuard 集成进 Accenture 的咨询交付，通过渠道触达企业客户。DoW CIO 协议作为五年期承诺尤其值得注意， 并为其他 DoW 机构访问该平台铺路。AQtive Guard
              尚未公开确认定价或 SOC 2 / FedRAMP 认证状态，不过通过 DoW CIO 的联邦部署意味着某种程度的政府安全审查。


              关键技术风险集中在两个领域。首先，AQtive Guard 的完整性取决于其在高度异构企业环境中进行密码映射的质量——老旧大型机系统、嵌入式设备和
              物理隔离网络更难扫描，构成产品主张未完全解决的覆盖缺口。加密咨询行业独立验证了这是核心挑战：大多数企业实际活跃证书数量是记录清单的二至五倍。 第二，PQC
              迁移本身是一个多年技术项目。即使清单准确，在大型企业中替换密码依赖也需要代码变更、硬件升级和测试周期，AQtive Guard 可以跟踪但无法端到端自动化。


              对 AQNav 而言，挑战在于从 SBIR 概念验证测试过渡到获得生产认证的航空电子设备。军事演习和 200+ 飞行小时是有意义的证据，
              但商业航空认证（FAA/EASA）涉及多年资格测试，目前尚未公开进行。磁图准确性要求——AQNav 依赖已知地壳磁场图——带来了对磁测数据稀疏地区地图质量和覆盖的依赖。 Dark Reading 对 2026年
              AI 网络安全市场的分析指出，随着 AI 原生公司吸引资本和关注，非 AI 原生网络安全初创公司的“死亡之谷”已经扩大—— 如果更大平台吸收 PQC 管理功能，这会成为 AQtive Guard
              定位的结构性风险。
            claimRefs:
              - CE031
              - CE032
              - CE037
              - CE038
