  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资历史与估值背景
        blocks:
          - type: paragraph
            body: >
              SandboxAQ 自 2022 年 2 月从 Alphabet 剥离以来，截至 2025 年 7 月已通过至少五笔融资筹集超过 $950 million。节奏是快速抬升：2022 年 $500 million
              首轮融资奠定基础；TechCrunch 2024 年 10 月报道称，公司正在推进一轮融资，目标估值约 $5 billion；2024 年 12 月完成逾 $300 million 融资，公司投前估值 $5.3
              billion（据 Reuters / Yahoo Finance / Economic Times，投后 $5.6 billion）；2025 年 4 月完整 Series E 收官，融资额扩大到 $450
              million，投后估值 $5.75 billion。The Quantum Insider 2025 年 7 月报道称，另有 $95 million 补充融资。投资者阵容异常宽、规格高：T. Rowe
              Price、Breyer Capital、Alger、Eric Schmidt、Marc Benioff、Yann LeCun 和 Paladin Capital 是早期支持者；2024 年 12 月批次加入
              Fred Alger Management、Mumtalakat、Parkway Venture Capital、Rizvi Traverse、S32、IQT 和 US Innovative Technology
              Fund；2025 年 4 月批次加入 Ray Dalio、Horizon Kinetics、BNP Paribas、Google 和 NVIDIA。这种广度——横跨机构资管、主权基金和 AI
              芯片平台龙头——说明市场给了战略稀缺性溢价，也说明独立尽调结果很强，而不只是动量定价。公司未公开任何收入。第三方数据聚合商 LATKA 估计 2024 ARR 约 $17.8 million；按 2025 年 4
              月 $5.75 billion 估值计算，EV/ARR 约 323×。Launchbay Capital H1 2025 二级市场报告把 SandboxAQ
              列为二级交易最活跃标的之一，落在“流动”到“半流动”层级（有活跃买卖报价，过去六个月二级成交量 >$1 million 的公司），与机构在接近一级轮定价的水平上寻求流动性的需求一致。J.P. Morgan 担任
              2024 年 12 月融资轮顾问。
