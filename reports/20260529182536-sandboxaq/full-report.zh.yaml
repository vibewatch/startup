      - number: '1.4'
        title: 产品、里程碑与规模信号
        blocks:
          - type: paragraph
            body: >
              SandboxAQ 的产品组合横跨四个不同领域。在网络安全和密码学中，AQtive Guard 是旗舰产品—— 这是一款 AI 安全态势管理（AI-SPM）平台，于 2025 年 12 月 3 日发布，用于
              发现密码资产、检测非人类身份风险、管理后量子迁移，并执行 NIST FIPS 203/204/205 合规要求。 2026 年 3 月，AQtive Guard 在 RSAC 2026 上获得更新，新增
              MCP（Model Context Protocol） 风险分析、运行时 AI 护栏和影子 AI 云扫描。在生命科学和材料科学中，AQBioSim 与 AQChemSim
              将基于物理的仿真用于药物发现和化学；Quantum Insider 称，AQBioSim 将药物设计速度提升 15×，AQChemSim 将锂离子电池寿命预测速度提升 95%。AQAffinity 于 2026
              年 1 月 20 日作为 OpenFold Consortium 的 OpenFold3 一部分推出，在结合亲和力预测中不再需要既有 3D 蛋白结构， 使早期药物研究能够“快速失败”。在导航中，AQNav
              是一个无 GPS 系统，用于解码地球磁场中的 量子信号；TIME100 2025 报道称，美国空军正在积极测试该系统。在医疗传感中，AQMed 和 CardiAQ 聚焦心磁图和临床诊断。

              DoW CIO 协议——与美国 Department of War 首席信息官签署的五年合同——是 企业级政府采用中最强的公开证明。AQtive Guard 将在 DoW 环境内自动化密码发现和清单管理，
              支撑该部门受管理的后量子密码迁移。此前，公司已通过 QRC PKI 项目与 DISA 的 Emerging Technology 组织完成演示。

              员工数信号存在重大歧义。公司发布时（2022 年 3 月）拥有 55 名工程师、科学家和技术人员。 Yahoo Finance 列示 101 名全职员工；Tracxn 公司档案页显示 348 人；Cyber
              Defense Magazine 估计 2025 年约 250 名员工，其中约 70 人在网络安全方向。不存在权威公开员工数。收入未披露。 SandboxAQ 入选 TIME100 Most
              Influential Companies 2025，该名单引用 $5.75 billion 估值。
