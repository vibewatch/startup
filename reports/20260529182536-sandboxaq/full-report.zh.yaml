      - number: '5.5'
        title: 技术栈：Large Quantitative Models
        blocks:
          - type: paragraph
            body: >-
              SandboxAQ 的技术架构统一围绕公司所谓的 Large Quantitative Models（LQMs）——在定量、物理基础数据上训练的 AI 系统， 而不是人类语言。公司明确将 LQMs 与 LLMs
              区分开来：语言模型从文本语料中学习，而 LQMs 从信号数据、分子模拟、磁场测量和其他物理测量中学习。 这一叙事支撑所有四条产品线：在 AQtive Guard 中，LQMs 分析密码信号数据和风险模式；在
              AQBioSim 中，LQMs 生成并评估分子预测； 在 AQNav 中，LQMs 从磁噪声中提取导航信号；在 AQMed 中，LQMs 处理来自心脏的心磁图信号。


              公司 LQM 解决方案页面将底层基础设施描述为经典计算栈——当前生产工作负载不依赖量子硬件。当前产品中的量子成分主要是量子传感器硬件 （AQNav/AQMed 的磁力计）以及 AQBioSim
              模拟中使用的量子力学方程，两者都在经典 CPUs/TPUs/GPUs 上执行。公司保持着使用 TPUs 和大规模并行经典硬件完成最大 N^3 DFT 模拟的记录，这是一个可验证的差异化主张。截至
              2026年5月，SandboxAQ 的 HuggingFace 开发者资料显示有 123 名成员，且 AQAffinity 可通过 pip 安装，表明即便规模较小，也存在运转中的开源开发者社区。


              据 Cyber Defense Magazine 报道，AQtive Guard 与现有企业平台集成——CrowdStrike、Palo Alto Networks 和 ServiceNow——
              而不是要求替换基础设施。SandboxAQ 的 OpenCryptography.com 倡议（2025年10月宣布）创建了一个公开数据库，揭示开源软件中的密码风险， 代表一种面向开发者的信号工作。IBM
              Quantum Safe 技术栈（Guardium Quantum Safe）和 IBM 的量子安全转型 服务代表另一种同样执行密码清单管理的竞争技术路径，说明该市场正在吸引资源充足的竞争者。
