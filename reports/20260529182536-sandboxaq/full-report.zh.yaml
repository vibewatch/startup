            - PQC 被 IBM 或 Thales 竞品替代
            - BIS 出口管制合规执法
            - 企业 PQC 从销售到首笔收入超过 18 个月
    approximationNotes: 位置为基于公开信息的分析师定性判断；没有可用的精算概率估计。缓释后的剩余风险未单独绘制。
    claimRefs:
      - CR007
      - CR013
      - CR017
      - CR023
      - CR025
      - CR029
      - CR035
      - CR039
      - CR045
  - id: FR002
    title: 风险传导图——关键风险如何流向业务结果
    type: dag
    layout: wide
    summary: 有向无环图，追踪五个根因风险节点如何通过传导路径影响 SandboxAQ 的收入、投资者、人才和国际扩张结果。
    data:
      nodes:
        - id: r1
          label: 商业收入规模未披露
          detail: 政府、药企里程碑和企业商业渠道之间的收入结构未公开披露；独立 ARR 无法验证
        - id: r2
          label: 高私募估值但披露稀疏
          detail: $5.75B Series E，且无经审计财务；投资者依赖未经验证的商业规模假设
        - id: r3
          label: BIS 出口管制扩张
          detail: 2024 年 9 月生效的量子技术全球许可要求；AQNav 传感器可能受 ITAR 约束
        - id: r4
          label: 政府合同集中
          detail: DoD PQC 合同、USAF SBIR 和 DIU 构成主要收入锚
        - id: r5
          label: 企业 PQC 销售周期长
          detail: 10-15 年架构周期；迁移前还需要 6-18 个月发现阶段
        - id: o1
          label: 收入低于投资者预期
          detail: 商业规模无法验证，带来投资者不确定性；增长假设可能无法兑现
        - id: o2
          label: 投资者信心削弱
          detail: 披露不透明，且缺少清晰收入证据支撑估值溢价，削弱机构信任
        - id: o3
          label: 国际市场受限
          detail: BIS 许可限制非美国量子技术销售；ITAR 阻断部分 AQNav 出口
        - id: o4
          label: 现金消耗加速
          detail: 收入不及预期或政府合同受扰，会迫使公司更早回到资本市场
        - id: o5
          label: 人才与高管流失
          detail: 多产品高压环境叠加公开继任规划有限
      edges:
        - from: r1
          to: o1
          label: 商业不达预期带来不确定性
        - from: r1
          to: o2
          label: 收入不透明向投资者释放 PMF 偏弱信号
        - from: r2
          to: o2
          label: 估值溢价缺少证据，侵蚀信任
        - from: r2
          to: o5
          label: 业绩压力加大人才留存难度
        - from: r3
          to: o3
          label: 许可要求阻碍国际交易
        - from: r4
          to: o1
          label: 合同终止会移除锚定收入
        - from: r5
          to: o1
          label: 转化延迟压低近期订单
        - from: o1
          to: o4
          label: 收入落空加速烧钱
        - from: o4
          to: o2
          label: 资本压力向投资者释放担忧信号
    claimRefs:
      - CR007
      - CR008
      - CR001
      - CR003
      - CR017
      - CR023
      - CR025
      - CR027
      - CR029
  - id: FR003
