figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    layout: wide
    summary: >-
      SandboxAQ's public chronology runs from internal Alphabet R&D in 2016 through five financing events, multiple
      product launches, and a DoW CIO anchor contract by May 2026.
    data:
      items:
        - date: '2016'
          label: Alphabet internal team formed
          detail: >-
            Jack Hidary and team begin R&D within Alphabet focused on quantum physics and AI applications that would
            later become SandboxAQ's core LQM framework.
          tone: neutral
        - date: '2022-03-22'
          label: Spinout and launch; nine-figure seed
          detail: >-
            SandboxAQ officially becomes independent with 55 employees; Eric Schmidt named chairman; Breyer Capital, T.
            Rowe Price, Guggenheim, TIME Ventures and others invest.
          tone: positive
        - date: 2023-02
          label: $500M round (~$4B implied)
          detail: >-
            Largest single round to date; T. Rowe Price, Breyer Capital, and Marc Benioff participate; PitchBook
            estimates $4B post-money valuation.
          tone: positive
        - date: '2024-10-18'
          label: TechCrunch reports $5B valuation target
          detail: >-
            Independent media reports SandboxAQ seeking new capital at ~$5B; editorial describes "alphabet soup of
            buzzwords" and broad, unproven product assortment.
          tone: warning
        - date: '2024-12-18'
          label: $300M+ round at $5.3B pre-money
          detail: >-
            Official PRNewswire says $5.3B pre-money; Reuters and JustAINews cite $5.6B; Yann LeCun, Mumtalakat, Alger
            among new investors.
          tone: positive
        - date: '2025-04-04'
          label: Series E closes; $450M+; $950M+ total
          detail: >-
            Ray Dalio, BNP Paribas, Google, NVIDIA join; ~$5.75B post-money per Tracxn and TIME100; company now has
            strategic compute and financial-services investors.
          tone: positive
        - date: '2025-12-03'
          label: AQtive Guard AI-SPM launched
          detail: >-
            AI Security Posture Management product addresses shadow AI, NHI risks, and post-quantum cryptography
            migration; first major standalone product announcement.
          tone: positive
        - date: 2025-12
