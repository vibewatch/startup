        title: Public Metrics, Disclosure Gaps, and Capital Adequacy
        blocks:
          - type: paragraph
            body: >
              SandboxAQ's private-company status means investors, counterparties, and diligence analysts have access
              only to voluntarily disclosed metrics. The company has not published audited financial statements, GAAP
              revenue, ARR by product line, gross margin, operating loss, cash position, or remaining runway. The LATKA
              platform reports $17.8M 2024 revenue and $5.6B valuation, implying a price-to-revenue multiple of
              approximately 315×—well above median late-stage SaaS multiples of 10–25×. The multiple is consistent with
              a company valued on future option value rather than current revenue, but it underscores the risk of
              significant dilution or down-round in an adverse funding environment.

              The five-year DoW CIO agreement (December 2025) and the U.S. Air Force TACFI extension (August 2024) are
              the strongest government-contract commercialization signals, but neither contract value nor annualized
              revenue contribution is disclosed. Similarly, the Accenture expanded partnership (July 2024) and AQBioSim
              agreements with AstraZeneca and Sanofi (2023) represent confirmed pipeline, but financial terms remain
              confidential. A single disclosed grant-equivalent signal is the Michael J. Fox Foundation's $25M
              initiative for LRRK2 research (October 2024), in which SandboxAQ participates; this is a research-stage
              award and not commercial revenue.

              Capital adequacy is unverifiable. The most recent primary capital event was the Series E $150M tranche in
              April 2025. If monthly burn is in the range implied by the funding cadence ($20–30M/month estimated), and
              if revenue is growing toward or beyond $20M ARR, the company likely has 18+ months of runway from April
              2025 capital, provided no extraordinary acceleration in spend. This is an estimate only; actual cash,
              burn, and runway are private. The Form D filings for Parkway and HII co-investment SPVs confirm active
              secondary market but provide no primary operational data.
