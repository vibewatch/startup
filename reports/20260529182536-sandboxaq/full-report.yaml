          - type: callout
            title: DoW CIO contract provides the strongest available commercial anchor
            body: >-
              Of all SandboxAQ's disclosed commercial relationships, the five-year Department of War CIO agreement is
              the most verifiable and the most material to near-term revenue. It followed a successful DISA Emerging
              Technology demonstration (QRC PKI program), indicating the deal was preceded by a technical validation
              cycle rather than a cold commercial sale. Government contracts of this type are typically reportable in
              federal procurement databases, which provides a potential independent verification path that does not
              exist for private enterprise customer revenue.
