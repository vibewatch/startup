    title: Regulatory / Legal Risk Register
    columns:
      - Risk or Rule or Case
      - Jurisdiction
      - Status
      - Likelihood
      - Severity
      - Key Mitigation
      - Residual Exposure
      - Diligence Path
    rows:
      - - Private company high valuation with sparse public financial disclosure
