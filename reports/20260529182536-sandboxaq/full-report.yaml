  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Financing History and Valuation Context
        blocks:
          - type: paragraph
            body: >
              SandboxAQ has raised more than $950 million since spinning out of Alphabet in February 2022 across at
              least five tranches through July 2025. The trajectory is one of rapid escalation: a $500 million initial
              raise in 2022 set the stage; a TechCrunch report in October 2024 indicated the company was targeting a
              valuation of approximately $5 billion in an ongoing round; a $300 million-plus close in December 2024
              valued the company at $5.3 billion pre-money ($5.6 billion post-money, per Reuters / Yahoo Finance /
              Economic Times reporting); and the full Series E close in April 2025 expanded proceeds to $450 million and
              set a post-money valuation of $5.75 billion. An additional $95 million supplemental raise was reported in
              July 2025 by The Quantum Insider. The investor base is unusually broad and prestigious: T. Rowe Price,
              Breyer Capital, Alger, Eric Schmidt, Marc Benioff, Yann LeCun, and Paladin Capital were early backers; the
              December 2024 tranche added Fred Alger Management, Mumtalakat, Parkway Venture Capital, Rizvi Traverse,
              S32, IQT, and the US Innovative Technology Fund; the April 2025 tranche added Ray Dalio, Horizon Kinetics,
              BNP Paribas, Google, and NVIDIA. This breadth — spanning institutional asset managers, sovereign funds,
              and AI-chip platform leaders — signals a strategic scarcity premium and strong independent diligence
              outcomes rather than merely momentum-driven pricing. No revenue has been publicly disclosed. Third-party
              data aggregator LATKA estimated 2024 ARR at approximately $17.8 million; at the $5.75 billion April 2025
              valuation, this implies an EV/ARR multiple of roughly 323×. Launchbay Capital's H1 2025 secondary market
              report identified SandboxAQ as among the most active names in secondary trading, placed within the
              "liquid" to "semi-liquid" tier (companies with active bids and asks and >$1 million in trailing six-month
              secondary volume), consistent with institutional demand for liquidity at or near primary-round pricing.
              J.P. Morgan advised on the December 2024 financing round.
