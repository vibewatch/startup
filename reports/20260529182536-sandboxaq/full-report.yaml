              - CE035
          - type: callout
            title: PQC Migration is a Multi-Year Technical Commitment, Not Just Scanning
            body: >-
              AQtive Guard addresses discovery and inventory, which is the foundational step of PQC migration. However,
              the actual remediation — replacing quantum-vulnerable algorithms enterprise-wide — involves years of
              engineering work and hardware changes beyond what any scanning tool can automate. Buyers may underestimate
              implementation complexity when evaluating AQtive Guard's value proposition.
            calloutType: risk
            claimRefs:
              - CE032
