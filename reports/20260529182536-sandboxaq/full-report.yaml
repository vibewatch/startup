      - number: '3.3'
        title: AI Security Posture Management Competitors
        blocks:
          - type: paragraph
            body: >-
              SandboxAQ's AQtive Guard AI-SPM product competes in a rapidly consolidating cloud-native application
              security market. The primary competitive signals are Palo Alto Networks (Prisma Cloud AI-SPM, incumbent
              with broad CNAPP platform), Protect AI (focused AI security startup), and the now-Google-owned Wiz
              platform.

              Wiz was the first CNAPP to provide native AI security capabilities, introducing AI-BOM (AI bill of
              materials), AI misconfiguration checks, and attack path analysis across the AI pipeline. Google's $32B
              all-cash acquisition of Wiz, finalized in March 2026, effectively brought Wiz's AI-SPM capabilities inside
              Google Cloud's security portfolio. This creates both a threat (Google will aggressively bundle AI-SPM into
              GCP security offerings) and a proof point (the acquisition validates the AI-SPM market segment).

              Palo Alto Networks Prisma Cloud analyzes 1 trillion events per 24 hours and detects 1.5 million new
              attacks per day. Its AI-SPM capabilities include model risk scoring, data security across model resources,
              and protection of the AI application ecosystem—features that overlap substantially with AQtive Guard's
              positioning. As a $90B+ market cap company with deep CISO relationships and existing Prisma Cloud
              deployments, Palo Alto represents the incumbent bundling risk most dangerous to standalone AI-SPM vendors.

              Protect AI takes a specialist approach, with products Guardian (model security), Recon (AI red teaming),
              and Layer (runtime controls) on a unified platform. Its announced collaboration with Leidos in April 2025
              to secure AI across US government systems illustrates direct competition with SandboxAQ's AQtive Guard in
              the government/defense channel that SandboxAQ is targeting via its DoD CIO relationship. Protect AI has
              scanned over 4.84 million AI model versions and submitted 2,520 CVE records, demonstrating deeper model
              security specialization than SandboxAQ's broader posture management framing.
