        title: Cost Structure and Capital Intensity
        blocks:
          - type: paragraph
            body: >
              SandboxAQ's cost structure is driven by research and development expenditure, scientific talent
              acquisition, high-performance computing infrastructure, and growing go-to-market investment. The company
              has publicly disclosed a workforce of more than 87 PhDs and 110 engineers as of mid-2025, with overall
              headcount estimated at approximately 200–350 (various sources cite different snapshots). Scientific talent
              at this density carries compensation costs comparable to deep-tech research organizations, with total
              cost-per-employee significantly above software industry median. No gross margin, EBITDA, or operating cost
              breakdown has been disclosed.

              Capital intensity is further elevated by bespoke quantum sensing hardware for AQNav and CardiAQ,
              computational chemistry simulation workloads requiring HPC infrastructure (GPU/TPU clusters), and the cost
              of multiple long-running clinical and government research programs. A collaboration with NVIDIA integrated
              CUDA-accelerated DMRG algorithms, which implies continued compute costs on GPU infrastructure. The $95M
              July 2025 secondary offering was structured solely for employee liquidity, not operational funding, which
              limits inference about near-term burn coverage.

