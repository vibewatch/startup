  - id: FV004
    title: Recommendation Logic — SandboxAQ Valuation Chapter
    type: flow
    layout: standard
    summary: >
      Decision chain from evidence pillars through valuation stance to final recommendation. Adverse nodes (revenue gap,
      stretched valuation) outweigh positive nodes under current evidence conditions.
    data:
      nodes:
        - id: n1
          label: Large Multi-Vertical TAM
          detail: >-
            PQC software, AI drug discovery, quantum navigation each exceed $10B at maturity; combined TAM plausibly
            $30B+. Structural tailwind from NIST mandates and pharma R&D investment.
          tone: positive
        - id: n2
          label: Verified Revenue Gap
          detail: >-
            No disclosed ARR; LATKA third-party estimate ~$18M (2024). Implied EV/ARR at $5.75B entry is ~323×, an
            extreme outlier versus all public comparables.
          tone: negative
        - id: n3
          label: Strong Technical Moat and Investor Validation
          detail: >-
            Alphabet lineage, NVIDIA and Google Series E participation, PQC standard alignment (NIST FIPS 203/204/205),
            and government contract visibility partially support premium.
          tone: positive
        - id: n4
          label: Valuation Stretched
          detail: >-
            At $5.75B, even the base case (ARR $150–250M at 15–20×) barely reaches entry price. Bear case implies 85–94%
            downside. Finro Q4 2025 data: applied AI cybersecurity pricing toward 8–15× SaaS norms, not frontier-model
            premiums.
          tone: negative
        - id: n5
          label: 'Recommendation: Research More'
          detail: >-
            Wait for ARR disclosure, NRR data, and preference-stack clarity before committing capital. Confidence:
            medium. Valuation stance: stretched. Risk rating: high.
          tone: neutral
      edges:
        - from: n1
          to: n2
          label: Large TAM meets low current revenue → platform pre-revenue bet
        - from: n2
          to: n4
          label: Revenue gap drives 300× implied multiple → stretched valuation
        - from: n3
          to: n4
          label: Moat partially offsets but does not resolve the valuation premium
        - from: n4
          to: n5
          label: Stretched valuation without revenue validation → Research More
