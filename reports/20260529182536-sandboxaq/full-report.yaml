              Despite regulatory mandates, Entrust's 2024 survey found that 54% of organizations lack clear ownership
              for PQC transition and 51% describe managing cryptographic assets as extremely difficult. Encryption
              Consulting data shows most enterprises have 2–5x more cryptographic assets than believed. This means the
              prerequisite step — inventory — is still incomplete at most target buyers, compressing the near-term SAM
