      - number: '1.3'
        title: Funding history, valuation, and investor map
        blocks:
          - type: paragraph
            body: >
              SandboxAQ has completed five financing events since its March 2022 spinout. At launch it closed a
              nine-figure round (exact amount never disclosed); investors included Breyer Capital, Eric Schmidt, T. Rowe
              Price, Guggenheim Investments, TIME Ventures (Marc Benioff), Thomas Tull, First Light Capital Group,
              Section 32, and Parkway Venture Capital. In February 2023, Reuters and TechCrunch confirmed a $500 million
              round, with PitchBook estimating the post-money valuation at approximately $4 billion.

              In December 2024, SandboxAQ announced a round of more than $300 million. The official PRNewswire press
              release stated the round valued the company at $5.3 billion on a pre-money basis. However, Reuters
              reporting (via SRN News) and JustAINews both cited $5.6 billion; the Quantum Insider also cited $5.6
              billion pre-money. The most likely resolution is that the official $5.3 billion is the pre-money figure
              and the $5.6 billion figure circulating in the press is the post-money valuation after the $300M+ close —
              but this has not been confirmed by SandboxAQ. This valuation conflict is a concrete evidence gap. December
              2024 investors included Fred Alger Management, T. Rowe Price, Mumtalakat, Breyer Capital, Rizvi Traverse,
              S32, US Innovative Technology Fund, Ava Investments, Eric Schmidt, Marc Benioff, David Siegel, and Yann
              LeCun (Meta Chief AI Scientist).

              In April 2025 the Series E closed with over $450 million raised in total, adding Ray Dalio (Bridgewater
              Associates), Horizon Kinetics, BNP Paribas, Google, and NVIDIA to the investor base. The company's
              official press release confirms total funding since the 2022 spinout exceeded $950 million. TIME100 and
              Tracxn both cite a post-money valuation of approximately $5.75 billion after the April 2025 close.
              TechCrunch had reported in October 2024 that SandboxAQ was seeking the next round at around a $5 billion
              valuation, framing the outreach as notable given that it had already raised $500 million in 2023.
