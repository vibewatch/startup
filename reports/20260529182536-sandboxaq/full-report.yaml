      - number: '3.6'
        title: Moat Assessment and Displacement Risks
        blocks:
          - type: paragraph
            body: >-
              SandboxAQ's competitive moats vary materially by segment. In PQC, the moat is weakest: large incumbents
              (IBM, Entrust) have existing PKI and cryptographic management relationships with the same enterprise and
              government buyers, and PQShield is already shipping silicon- certified products. The differentiation
              argument for AQtive Guard rests on AI-augmented cryptographic discovery beyond what static CLM tools
              provide, but this advantage is replicable by incumbents with existing platform investments.

              In AI-SPM, the competitive window is narrow. Google's acquisition of Wiz removed a key independent
              comparator and inserted Google Cloud bundling risk. Palo Alto's Prisma Cloud already captures the
              attention of enterprise CISOs. SandboxAQ must demonstrate measurable advantage over incumbents' bundled
              AI-SPM features before the market commoditizes.

              In life sciences, the switching cost and moat question is about workflow integration depth. Schrödinger
              has 30+ years of R&D embedded in pharma discovery workflows. SandboxAQ's quantum advantage argument (speed
              and accuracy of molecular property prediction) must overcome deep workflow lock-in at top-20 pharma
              accounts. The lack of publicly disclosed pharma customer counts for SandboxAQ's simulation products is a
              key diligence gap.

              In navigation and sensing, the defense certification and qualification pipeline creates natural moats for
              incumbents. However, the accelerating market need for GPS-resilient PNT systems— driven by electronic
              warfare and contested environment requirements—creates a genuine window for quantum-sensing-based
              navigation if SandboxAQ can achieve military certification ahead of or alongside Advanced Navigation and
              Q-CTRL.

              Across all segments, the multi-product strategy creates a cross-cutting risk: without a dominant market
              position in any single segment, SandboxAQ faces the risk of being out-executed by focused competitors in
              each domain while spreading its engineering and GTM resources too thin to achieve category leadership.
            claimRefs:
