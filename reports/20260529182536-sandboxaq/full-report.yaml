            body: >-
              As a private company, SandboxAQ does not publish audited financials, GAAP revenue figures, or quarterly
              disclosures, creating material information asymmetry between the company and prospective investors or
              partners. The $5.75 billion April 2025 Series E valuation implies a substantial revenue multiple against
              the early-stage commercial revenue base that can be inferred from publicly confirmed contracts, making
              investor diligence highly dependent on data room access and third-party audit confirmation. Secondary
              market data from Premier Alts implies a May 2026 market cap of approximately $5.2 billion, a modest
              discount from the last round, but private secondary pricing is indicative only and carries wide bid-ask
              spreads. No IPO timeline, SPAC transaction, or other planned public liquidity event has been announced as
              of May 2026. SandboxAQ's confirmed revenue anchors include a US DoD five-year PQC migration contract, a
              USAF SBIR Phase 2B TACFI contract for AQNav, and the DIU quantum sensing program. The mix of commercial
              enterprise ARR versus government contract revenue versus early pharma-milestone revenue is not publicly
              disclosed, making the degree of broad commercial product-market fit unverifiable from public sources.
              Investors are therefore underwriting significant commercial scale-up assumptions that cannot be
              independently confirmed at this stage. Leadership concentration in CEO Jack Hidary and Chairman Eric
              Schmidt is a compounding factor. Both are central to the fundraising narrative, government relationships,
