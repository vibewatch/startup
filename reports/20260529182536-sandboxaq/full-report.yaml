  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Execution and Market-Timing Risk
        blocks:
          - type: paragraph
            body: >-
              SandboxAQ's primary revenue driver post-quantum cryptography (PQC) migration operates in a market that is
              forming rapidly but converting slowly. Enterprise sales cycles for large-scale cryptographic
              re-platforming are typically 10-15 years end-to-end; SandboxAQ's own channel chief acknowledged that
              industries such as financial services take that long to fully redesign and re-architect IT platforms. Even
              where urgency exists, CNSA 2.0 mandates compliance for new NSS systems by January 2027, the commercial
              enterprise market faces softer deadlines extending to 2030-2035, delaying the commercial demand wave that
              underpins SandboxAQ's growth model. Most enterprise buyers lack complete cryptographic asset inventories
              before any migration sale, extending the sales cycle by an estimated 6-18 months of discovery work. PQC
              algorithms such as ML-KEM carry performance overhead versus legacy RSA/ECC due to larger key sizes and
              higher compute requirements, slowing budget approvals among cost-constrained IT organizations. Entrust
              surveys confirm that PQC awareness is high in 2024-2025 but actionable investment significantly lags
              awareness, indicating the market remains education-heavy and conversion-slow. SandboxAQ's channel partner
              program requires significant enablement investment before it can scale beyond direct enterprise sales,
              adding execution risk to an already complex go-to-market motion.
