  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Portfolio and Operating Model
        blocks:
          - type: paragraph
            body: >-
              SandboxAQ organises its B2B portfolio into three commercial divisions and one investigational vertical.
              The cybersecurity division, anchored by AQtive Guard, addresses cryptographic posture management and AI
              security posture management (AI-SPM). The life sciences division, operating as AQBioSim with sub-products
              AQChemSim and AQAffinity, delivers physics-informed molecular simulation and drug affinity prediction to
              biopharma customers including AstraZeneca and Sanofi. The navigation and sensing division produces AQNav,
              a magnetic navigation (MagNav) system in active USAF contract, and AQMed, a quantum magnetocardiography
              sensing effort listed among early applications but without disclosed commercial deployments. The company's
              official overview published in February 2026 identifies all four areas and explicitly labels its core
              technology as Large Quantitative Models (LQMs) — AI systems trained on quantitative, physics-grounded data
              rather than language corpora.


              The operating model is enterprise B2B across all four verticals. AQtive Guard is sold direct to enterprise
              security teams and via channel partners such as Accenture and Deloitte. Life sciences products are sold to
              biopharma research organisations. AQNav is developed under US Air Force SBIR contracts with a path to
              dual-use commercial adoption via aerospace partners Boeing and Acubed (Airbus). AQMed targets hospital and
              research institution customers for magnetocardiography sensing. The company's TIME 100 profile described
              this portfolio as tools that give researchers "a superpower" — a positioning that works for premium
              enterprise relationships but limits the clarity buyers typically require around SLA and pricing.


              The most acute diligence gap is the absence of public commercial revenue data per product line. SandboxAQ
              does not disclose ARR, contract values, or product-level customer counts. The product portfolio is wider
              than most early-stage companies of comparable age, which raises a question about focus that the $450M
              Series E (closed April 2025) appears designed to address by funding simultaneous scaling across divisions.
            claimRefs:
