  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Framing
        blocks:
          - type: paragraph
            body: >-
              SandboxAQ is not a single-market competitor. Its product portfolio spans four workload
              segments—post-quantum cryptography (PQC) / cryptographic posture management, AI security posture
              management (AI-SPM), life-sciences and materials simulation, and GPS-denied navigation—each with distinct
              buyer personas, procurement cycles, and competitive sets. This structural breadth is both a strategic
              differentiator and a vulnerability: it allows SandboxAQ to cross-sell into enterprise relationships, but
              it means the company must demonstrate product-market fit against specialized incumbents simultaneously
              across four technically demanding domains. The competitor analysis in this chapter is organized by
              workload segment rather than by a single monolithic market.

              At the platform level, SandboxAQ competes against two classes of rivals: (1) large incumbent security
              vendors (IBM, Entrust, Palo Alto Networks) that are building quantum and AI security features into
              existing enterprise footprints, and (2) focused startups and pure-play specialists (PQShield, Protect AI,
              Q-CTRL) with narrower but deeper capabilities. The diligence question is not simply whether SandboxAQ has
              a product in each segment, but whether it has differentiated product-market fit that justifies
              displacement of entrenched alternatives or internal build options in each domain.

              A 2026 Dark Reading analysis of the broader AI cybersecurity investment market noted that "differentiation
              is hard" and that many AI-native security startups face a widening "valley of death" as capital
              concentrates in fewer, larger bets. With 75+ cybersecurity unicorns as of 2026 and major consolidation
              underway—Google's acquisition of Wiz for $32B finalized in March 2026—the competitive environment is
              intensifying for multi-product platforms seeking enterprise traction across multiple segments.
            claimRefs:
              - CP001
              - CP028
              - CP029
              - CP030
              - CP031
