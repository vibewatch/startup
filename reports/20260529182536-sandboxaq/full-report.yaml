      - number: '1.2'
        title: Leadership, board, and key-person dependence
        blocks:
          - type: paragraph
            body: >
              Jack Hidary is the CEO and most prominent public face of SandboxAQ. His background combines serial
              entrepreneurship, academic neuroscience, and applied AI. He founded EarthWeb (later Dice, NYSE: DHX),
              co-founded Vista Research (acquired by Standard & Poor's / McGraw-Hill), studied neuroscience at Columbia
              University, and held the Stanley Fellowship in Clinical Neuroscience at the National Institutes of Health,
              where he applied early neural networks to functional brain imaging. He is also the author of "Quantum
              Computing: An Applied Approach," now in its second edition. His personal trajectory — from bioscience
              research to serial entrepreneurship to quantum-AI company leadership — aligns with SandboxAQ's
              multi-domain strategy. His CEO Magazine interview describes SandboxAQ's mission as originating in his
              direct observation of how difficult it is to translate basic science into clinical application.

              Eric Schmidt, former Google CEO and Alphabet Executive Chairman, joined as Board Chairman at the March
              2022 launch. Schmidt is also a personal investor in multiple SandboxAQ rounds. His presence contributes
              network access and reputational credibility, and he quoted publicly in the Dec 2024 press release calling
              Hidary "a world-class, high-integrity CEO." The combination of Hidary as operational leader and Schmidt as
              governance anchor creates a key-person concentration at both executive and board levels.

              Beyond Hidary and Schmidt, Yahoo Finance and CB Insights list Andrew McLaughlin as COO. The Org identifies
              eight people on the leadership team but does not name all of them in its public view. The cybersecurity
              business unit is managed by General Manager Marc Manzano; the AI simulation division by General Manager
              Nadia Harhen. The board composition beyond Schmidt is not fully disclosed in public sources, which is a
              material governance gap for any investor conducting due diligence.
