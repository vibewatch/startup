companyProfile:
  summary: >-
    SandboxAQ is a Palo Alto-based private B2B enterprise company that spun out of Alphabet in March 2022. It develops
    and deploys Large Quantitative Model (LQM) technology — physics-informed AI trained on numerical and scientific data
    — across four commercial verticals: post-quantum cryptography (AQtive Guard), life-sciences simulation
    (AQBioSim/AQChemSim), GPS-denied navigation (AQNav), and medical sensing (AQMed/CardiAQ). The company is led by CEO
    Jack Hidary and Board Chairman Eric Schmidt and has raised over $950 million since its spinout at an April 2025
    post-money valuation of $5.75 billion.
