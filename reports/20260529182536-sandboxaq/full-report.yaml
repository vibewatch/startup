            body: >-
              SandboxAQ's life-sciences customer base is anchored by named pharmaceutical and biotech collaborations,
              though the commercial structure of most relationships is disclosure-limited. AstraZeneca and Sanofi were
              named as initial customers of the AQBioSim molecular simulation division at its June 2023 launch. Sanofi
              CEO Paul Hudson publicly stated that SandboxAQ's "leapfrog technology could significantly impact both
              preclinical and clinical development." In October 2024, Sanofi selected SandboxAQ to identify biomarkers
              during clinical development using Large Quantitative Models (LQMs) that apply causal filtration to
              knowledge graphs — a repeat engagement extending the original AQBioSim relationship into downstream
              clinical phases. The UCSF Institute for Neurodegenerative Diseases collaborated with SandboxAQ to expand
              chemical space from 250,000 to 5.6 million molecules using AQBioSim, achieving a 30-fold increase in hit
              rate for Alzheimer's and Parkinson's disease drug candidates. Google Cloud confirmed advanced
              collaborations with UCSF, Riboscience, Sanofi, and the Michael J. Fox Foundation as active drug discovery
