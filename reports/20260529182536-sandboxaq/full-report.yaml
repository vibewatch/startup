            body: >-
              The most mature customer evidence in SandboxAQ's portfolio comes from the enterprise cybersecurity
              segment. SoftBank Corp.'s Advanced Research Group in Tokyo completed production deployment of AQtive Guard
              in March 2024, following two years of joint PQC testing begun at launch in 2022. The deployment enabled
              SoftBank to scan a local government network and identify non-recommended encryption methods, unencrypted
              traffic, and vulnerable certificates — validating AQtive Guard's cryptographic posture management
              capability in a live enterprise environment. SoftBank's trajectory from the 2022 joint PQC VPN
              verification, through the February 2023 hybrid-mode PQC proof-of-concept, to 2024 Advanced Research Group
              production represents the most detailed public customer journey in SandboxAQ's portfolio. Vodafone
              Business conducted a quantum-safe VPN proof-of-concept in 2023, using modified smartphones and NIST PQC
              algorithms to assess performance across web browsing, streaming, and enterprise VPN scenarios. Vodafone
              established its first quantum-safe VPN using customized SandboxAQ software, and Vodafone's Cyber Security
              Director Emma Smith publicly confirmed the company's commitment to PQC migration alongside SandboxAQ.
              Mount Sinai Health System, a launch customer since March 2022, announced integration of SandboxAQ's
              NIST-standard PQC protocols into its health network to protect patient data, with CIO Kristin Myers
              publicly endorsing the deployment. Accenture expanded its channel partnership with SandboxAQ in July 2024,
              creating a joint Encryption Risk Assessment service powered by AQtive Guard and targeting Accenture's
              Global 1000 enterprise client base. The DoW CIO's five-year agreement for cryptographic discovery and
              inventory represents the highest-commitment government contract publicly disclosed to date. The AI
              Security Benchmark Report released in July 2025 found that only 6% of surveyed enterprises had deployed
              AI-native security strategies, underscoring the market readiness gap SandboxAQ must bridge to scale its
