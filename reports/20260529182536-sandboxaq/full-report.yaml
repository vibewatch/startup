      - number: '5.4'
        title: 'Navigation and Sensing: AQNav and AQMed'
        blocks:
          - type: paragraph
            body: >-
              AQNav is SandboxAQ's magnetic navigation (MagNav) product for GPS-denied environments. It uses a quantum
              magnetometer to sample Earth's crustal magnetic field — which exhibits geographically unique patterns —
              and applies proprietary LQMs to compare the sensor data against known magnetic maps to determine position
              in real time. Key operating characteristics: the system requires no GPS or satellite signals, emits no
              electronic signals (passive), operates at room temperature without shielding, functions across air, land,
              and sea domains, is all-weather and day/night capable, and has a small form factor compatible with
              platforms ranging from single-engine aircraft to large military transports and UAVs.


              The USAF awarded SandboxAQ a SBIR Phase 2B Tactical Funding Increase (TACFI) in August 2024, extending a
              prior Direct-to-Phase-II SBIR contract from January 2023. By that date AQNav had logged over 200 flight
              hours and 40+ sorties on four aircraft types across multiple regions, and had been tested in two USAF
              exercises — Exercise Golden Phoenix and Exercise Mobility Guardian, which was the Air Force Mobility
              Command's largest exercise at the time. The TACFI contract funds pod-based configurations for deployment
              on a wider range of aircraft including UAVs. Executive Biz reported in December 2025 that the Defense
              Innovation Unit (DIU) also contracted SandboxAQ to advance AQNav as part of its Transition of Quantum
              Sensing program for autonomous systems in GPS-denied environments. Aerospace partners Boeing and Acubed
              (Airbus) are engaged for dual-use commercial development.


              AQMed applies quantum magnetometry to magnetocardiography (MCG), detecting the weak magnetic field emitted
              by the heart to monitor cardiac health without contact electrodes. Mount Sinai Health System was listed as
              an early customer at SandboxAQ's 2022 launch. No public clinical outcomes, CE-mark, FDA clearance, or
              commercial deployment data have been disclosed for AQMed, leaving clinical maturity unverified from public
              sources. This remains a material evidence gap.
