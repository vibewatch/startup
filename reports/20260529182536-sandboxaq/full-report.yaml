              aggregate net cash deployment of approximately $950M over 3 years, or ~$315M annually— a rough but
              conservative proxy for cumulative burn plus investment before any revenue offset. If 2024 revenue was
              ~$17.8M (LATKA estimate), the revenue-funded fraction of operations would be modest relative to total
              capital consumed. Specific quarterly burn, gross margin, capex, and runway are unavailable from any public
