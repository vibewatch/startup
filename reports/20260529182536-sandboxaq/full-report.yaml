      - number: '5.2'
        title: 'AQtive Guard: Cryptographic Posture Management and AI-SPM'
        blocks:
          - type: paragraph
            body: >-
              AQtive Guard, SandboxAQ's flagship cybersecurity platform, performs three workflow functions: discovery of
              cryptographic assets (keys, certificates, algorithms, libraries) across code, runtime, and network layers;
              contextual risk prioritisation using business-impact mapping and blast-radius analysis; and orchestrated
              remediation including certificate rotation, algorithm replacement, and PQC migration. The official AQtive
              Guard product page, which the company operates on the separate domain aqtiveguard.com, states the platform
              correlates data across code, runtime, and the network — distinguishing it from legacy PKI tools that only
              see what they actively manage. The team claims its cryptographers contributed to NIST PQC standards
              development including FIPS 205, which is verifiable through NIST FIPS 205 (SLH-DSA) publication records.


              AQtive Guard's AI-SPM module, launched in limited access December 2025 and broadly available in 2026,
              extends the same deep-inspection approach to AI assets — discovering models, agents, and Model Context
              Protocol (MCP) servers across cloud-to-code environments, assessing exploitable weaknesses such as prompt
              injection and data leakage, and enforcing AI governance policies. By March 2026, SandboxAQ had added
              guardrails for inbound prompts and outbound AI responses, MCP risk analysis via an autonomous security
              agent, posture reporting aligned to the EU AI Act, and cloud scanning for shadow AI. Cyber Defense
              Magazine described the architecture as "Google's internal security practices brought to the enterprise."


              The product's relevance is anchored to concrete regulatory pressure. NIST finalised FIPS 203 (ML-KEM),
              FIPS 204 (ML-DSA), and FIPS 205 (SLH-DSA) in August 2024. NSA's CNSA 2.0 advisory mandates PQC for all NSS
              software by 2030 and full legacy replacement by 2033. The DoW CIO signed a five-year AQtive Guard
              agreement in December 2025 covering automated cryptographic discovery and inventory, which provides a
              government reference anchored to the same compliance timeline. SandboxAQ's internal survey found 79% of
              organisations run AI in production but only 6% have a comprehensive AI-native security strategy — data
              used to justify both the CPM and AI-SPM modules. The company generates CBOMs (Cryptography Bills of
              Materials) as a compliance deliverable. Independent encryption-consulting analysis found enterprises
              routinely have two to five times more live certificates than their official inventories show — a problem
              AQtive Guard's discovery module directly targets.
