          - type: callout
            title: Private-Company Opacity Creates Underwriting Constraint
            body: >
              SandboxAQ discloses no GAAP financials, verified ARR, burn rate, runway, or segment-level economics.
              Investors relying on company communications and third-party aggregator data (LATKA, Tracxn, Clay) face a
              materially higher information asymmetry than for comparable late-stage public-company investments. This
              opacity is standard for private companies but is specifically flagged by secondary-market analysts as a
              key risk for SandboxAQ.
