            body: >
              SandboxAQ has executed five distinct fundraising events since its March 2022 spin-off from Alphabet, plus
              a secondary offering in July 2025. The March 2022 spin-off carried an undisclosed nine-figure initial
              round supported by T. Rowe Price, Breyer Capital, Eric Schmidt, Guggenheim Partners, Marc Benioff (TIME
              Ventures), Thomas Tull, Parkway Venture Capital, IQT, and others. In February 2023, the company closed a
              $500M growth capital round from substantially the same investor group, using the capital to scale
              post-quantum cryptography and quantum simulation product lines. The December 2024 round raised more than
              $300M at a $5.3B pre-money valuation (per the official press release) or $5.6B post-money (per Reuters),
              with new investors including Fred Alger Management, Mumtalakat, Rizvi Traverse, S32, and Yann LeCun.

              In April 2025, the Series E closed an additional $150M tranche from Ray Dalio, Horizon Kinetics, BNP
              Paribas, Google, and NVIDIA, bringing total Series E proceeds to approximately $450M and total raised
              since inception to over $950M. SandboxAQ's official announcement cited a $5.75B post-money valuation.
              Reuters separately reported the company's value at $5.6B. Multiple secondary-market SPVs—including Parkway
              Co-Investment 11 (SandboxAQ) LP (Form D filed 2024-05-30) and HII SandboxAQ Series I (Form D filed
              2026-01-09)—have filed SEC notices of exempt offerings, confirming secondary market demand for SandboxAQ
              equity.

              In July 2025, the company completed a $95M oversubscribed secondary offering led by Rizvi Traverse, Forge
