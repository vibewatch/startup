      - number: '8.3'
        title: Scenario Analysis and Multiple Framework
        blocks:
          - type: paragraph
            body: >
              The absence of disclosed revenue necessitates a scenario-based valuation framework that makes all
              assumptions explicit. Three scenarios anchor the analysis on materially different revenue trajectories to
              2027–2028, the most plausible window for a liquidity event given investor composition and the 2022 spinout
              date. In the bear case, the post-quantum cryptography market develops more slowly than NIST's 2024–2025
              standards should catalyze; drug discovery and navigation divisions remain pre-revenue through 2028;
              blended ARR reaches only $40–60 million. At 8–15× SaaS multiples (consistent with normalized applied-AI
              cybersecurity comps per Finro Q4 2025), the implied terminal value is $320 million to $900 million — an
              approximately 85–94% discount to the April 2025 entry mark. In the base case, PQC software scales on
              enterprise compliance mandates, drug discovery generates milestone-based license fees from existing pharma
              partners, and AQNav achieves its first commercial government contract; blended ARR reaches $150–250
              million by 2027–28, implying a terminal value of $2.25–5.0 billion at 15–20× multiples — below to modestly
              above the $5.75 billion round price. In the bull case, all three major verticals achieve commercial
              traction: AQBioSim generates three to five pharma partnerships with milestone revenue by 2028; AQNav
              secures multiyear DoD contracts at significant scale; PQC migration demand accelerates as NIST deadlines
              approach 2030; blended ARR reaches $400–600 million, implying $8–18 billion terminal value at 20–30×
              multiples — a 1.4–3.1× return on the April 2025 round price. To justify the $5.75 billion valuation at
              CrowdStrike's current 31× LTM revenue multiple, SandboxAQ would need roughly $185 million in LTM revenue,
              implying 10× growth from LATKA's 2024 estimate within three years. The implied EV/ARR at successive
              revenue milestones shows clearly that the valuation is currently pricing well beyond the near-term revenue
              horizon: at $50 million ARR the multiple is 115×; at $100 million it is 57.5×; only at $200 million does
              it approach 28.75× — within range of high-growth SaaS precedents, but requiring significant multi-vertical
              execution. Finro's Q4 2025 analysis confirmed that late-stage AI companies in applied verticals face
              compressing multiples, adding downside convexity to the bear case. The Launchbay Capital H1 2025 secondary
              market report found that companies below the top-tier "liquid" threshold (valued above $10 billion in
              secondary market trading) face widening bid-ask spreads, consistent with a semi-liquid secondary profile
              for SandboxAQ at its current scale and limited revenue visibility.
