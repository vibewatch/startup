      - number: '2.3'
        title: Buyer segmentation and adoption paths
        blocks:
          - type: paragraph
            body: >-
              Each of SandboxAQ's four segments has a distinct buyer profile, budget authority, and procurement trigger.
              Conflating them into a single buyer archetype would misrepresent actual go-to-market dynamics.

              In the PQC and cryptographic posture management segment, the primary buyer is the CISO or Chief Security
              Officer at large enterprises (financial services, telco, defense contractors, federal agencies), supported
              by IT compliance teams. The NSA CNSA 2.0 mandate — requiring new NSS acquisitions to use quantum-resistant
              algorithms by January 2027 — is the single most powerful procurement trigger for defense contractors and
              federal agencies. Non-NSS enterprise buyers are driven by audit requirements, data-longevity concerns from
              "harvest now, decrypt later" threats, and board-level risk mandates. IBM and Entrust's April 2026 joint
              CPM offering illustrates that the enterprise market is already attracting major incumbents with existing
              customer relationships.

              In the NHI and agentic AI security segment, the buyer shifts toward identity and access management (IAM)
              teams, platform security engineers, and DevSecOps leads at companies with large AI workloads. The adoption
              trigger is agentic AI deployment — as organizations deploy more LLM-based agents with API credentials and
              service accounts, the NHI attack surface grows. The Cloud Security Alliance 2026 survey found that only
              12% of organizations are highly confident in their ability to prevent NHI-based attacks, and more than 16%
              do not track new AI identity creation at all, indicating substantial whitespace for dedicated tooling.

              In life-science simulation, the payer is the computational biology or AI research group within a pharma or
              biotech company, with budget typically owned by the head of R&D or CTO function. The adoption trigger is
              pipeline productivity — reducing the time and cost to identify viable drug candidates. This is a longer
              sales cycle with proof-of-concept requirements. Substitutes (Schrödinger, in-house teams) are deeply
              entrenched.

              In GPS-denied navigation for defense, the buyer is a program office within a defense department or prime
              contractor evaluating sensor payloads for specific platforms (UAVs, submarines). The procurement path goes
              through defense acquisition cycles, which can take multiple years from technology readiness level (TRL)
              assessment to production contract. This is the least mature near-term revenue path among the four
              segments.
