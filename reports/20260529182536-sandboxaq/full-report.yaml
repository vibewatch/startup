          - type: callout
            title: Product breadth and headcount ambiguity warrant diligence depth
            body: >-
              TechCrunch (October 2024) described SandboxAQ's mission as a "veritable alphabet soup of buzzwords" and
              its product set as "a large and somewhat wild assortment," reflecting analyst skepticism about whether a
              private company of SandboxAQ's disclosed scale can execute simultaneously across cryptography, drug
              discovery, navigation, and medical sensing. The headcount conflict (101 per Yahoo Finance, 348 per Tracxn,
              ~250 per Cyber Defense Magazine) means the capacity to staff four distinct R&D domains is unverifiable
              from public data. The undisclosed revenue figure means the business model's commercial validity cannot be
              independently confirmed. These three gaps — product focus, headcount, and revenue — compound each other
              and are the primary due diligence asks before any downstream valuation or competitive-positioning
              analysis.
            calloutType: risk
            claimRefs:
              - CO007
