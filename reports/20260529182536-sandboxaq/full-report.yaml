      - number: '3.2'
        title: PQC and Cryptographic Posture Management Competitors
        blocks:
          - type: paragraph
            body: >-
              The PQC and cryptographic posture management segment is where SandboxAQ most directly competes against
              large security incumbents. The competitive dynamic differs depending on the buyer layer: at the enterprise
              PKI / certificate lifecycle layer, DigiCert and Entrust are deeply embedded; at the quantum-safe
              transformation services layer, IBM commands broad enterprise engagement; at the hardware PQC IP layer,
              PQShield leads with chip-embedded implementations; and at the quantum randomness layer, Quantinuum's
              Quantum Origin differentiates on verifiable entropy.

              Entrust offers enterprise PQC-ready certificate authority solutions and collaborates with IBM Consulting
              to accelerate enterprise migration to quantum-safe cryptography. Its post- quantum solutions are
              enterprise-gated with no publicly listed pricing, indicating a services-led, relationship-driven GTM that
              gives it significant moat in its existing customer base. IBM builds on its role in developing the
              lattice-based algorithms (Dilithium, Kyber) underlying NIST's PQC standards, offering quantum-safe
              transformation services and Guardium Cryptography Manager for cryptographic asset inventory.

              PQShield is the most comparable focused PQC startup. Having raised over $63M and shipping FIPS 140-3 CMVP
              certified libraries across four security grades (Cloud, Edge, Lab, Government), PQShield targets
              semiconductor vendors and government agencies with embedded PQC IP—a hardware-first approach that differs
              from SandboxAQ's software-first AQtive Guard posture. Quantinuum (Honeywell spin-out) offers Quantum
              Origin, a quantum random number generator with enterprise integrations across Honeywell, Thales, and
              Fornetix. Quantinuum competes as a full-stack quantum company including hardware, which SandboxAQ does
              not.

              DigiCert's Trust Lifecycle Manager is a PKI certificate lifecycle management product targeting enterprises
              who need centralized governance and crypto-agility. It competes with SandboxAQ's cryptographic inventory
              capabilities within AQtive Guard, particularly as SandboxAQ's core PQC use case centers on discovering and
              migrating cryptographic assets. The fundamental tension: DigiCert's CLM is already deeply embedded in
              enterprise PKI infrastructure, while SandboxAQ's approach requires greenfield deployment of an
              AI-augmented discovery layer on top of existing cryptographic infrastructure.
