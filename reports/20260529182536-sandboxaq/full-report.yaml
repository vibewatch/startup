      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Strategic-investor convergence signals commercial seriousness
            body: >-
              The addition of Google, NVIDIA, BNP Paribas, and Ray Dalio to the Series E cap table is a qualitative
              signal distinct from financial investor participation. Google is the former parent organization with
              direct knowledge of the technology's origins; NVIDIA is the primary hardware provider for LQM training
              runs; BNP Paribas is a potential enterprise customer in financial services. Multiple strategic investors
              simultaneously entering the same late-stage round suggests independent commercial due diligence, not
              momentum investing. Diligence should confirm whether any of these investments are accompanied by binding
              customer or supply commitments.
            calloutType: strength
            claimRefs:
              - CO023
