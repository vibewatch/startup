          - type: callout
            title: Government as Commercialization Anchor
            body: >
              The December 2025 DoW CIO five-year agreement and the USAF TACFI contract extension represent SandboxAQ's
              highest-quality revenue signals. Government contracts are typically multi-year, low- churn, and
              credit-worthy, and the DoW CIO deal creates a pathway for department-wide AQtive Guard deployment beyond
              the CIO's office. These two programs likely represent the core of SandboxAQ's current government revenue
              base.
            calloutType: insight
