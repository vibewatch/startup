      - number: '5.6'
        title: Deployment Requirements, Gaps, and Technical Risks
        blocks:
          - type: paragraph
            body: >-
              AQtive Guard's deployment model is agent/scanner-based, operating across code repositories, cloud
              environments, and network layers without requiring infrastructure replacement. The Accenture-SandboxAQ
              Encryption Risk Assessment integrates AQtiveGuard into Accenture's consulting delivery, reaching
              enterprise clients through channel. The DoW CIO agreement is notable as a five-year commitment and paves
              the way for other DoW agencies to access the platform. No public pricing or SOC 2 / FedRAMP certification
              status has been confirmed for AQtive Guard, though federal deployment through the DoW CIO implies some
              level of government security review.


              The key technical risks cluster in two areas. First, AQtive Guard's completeness depends on the quality of
              its cryptographic mapping across highly heterogeneous enterprise environments — older mainframe systems,
              embedded devices, and airgapped networks are harder to scan and represent a coverage gap that the
              product's claims do not fully address. The encryption consulting industry independently validates this as
              the core challenge: most enterprises have two to five times more live certificates than recorded
              inventory. Second, PQC migration itself is a multi-year technical project. Even with accurate inventory,
              replacing cryptographic dependencies across large enterprises requires code changes, hardware upgrades,
              and testing cycles that AQtive Guard can track but cannot automate end-to-end.


              For AQNav, the challenge is transitioning from SBIR proof-of-concept testing to production-certified
              avionics. Military exercises and 200+ flight hours are meaningful evidence, but commercial aviation
              certification (FAA/EASA) involves years of qualification testing that is not publicly underway. The
              magnetic-map accuracy requirement — AQNav relies on known crustal magnetic field maps — creates a
              dependency on map quality and coverage in regions with sparse magnetic survey data. Dark Reading's
              analysis of the AI cybersecurity market in 2026 flagged that the "valley of death" for non-AI-native
              cybersecurity startups has widened as AI-native companies attract capital and attention — a structural
              risk for AQtive Guard's positioning if larger platforms absorb PQC management features.
            claimRefs:
              - CE031
              - CE032
              - CE037
              - CE038
