        - Medium
        - Medium — inability to verify revenue or cost structure creates diligence blind spots at $5.75B valuation
        - Data room access; third-party audit; customer contract evidence of commercial traction
        - Material — commercial PMF cannot be confirmed or refuted from public information alone
        - Request audited financials, customer-by-customer ARR, and investor board presentations in data room
      - - CNSA 2.0 and NIST PQC compliance mandate (FIPS 203, 204, 205)
        - US federal (NSS systems)
        - Active — NIST finalized Aug 2024; new NSS systems must comply by Jan 2027
        - High
        - Medium — non-compliant AQtive Guard implementations could lose NSS contract eligibility
        - HQC and SPHINCS+ contributions to NIST standards; AQtive Guard maps to CNSA 2.0
        - Low — SandboxAQ is standards-aligned but must keep pace with future NIST updates
        - Confirm AQtive Guard roadmap against each FIPS standard version
      - - BIS Export Controls on Quantum Technologies (EAR Part 742, effective Sept 2024)
        - US (global applicability)
        - Active — worldwide license requirement for quantum computing items and technology
        - High
        - High — non-compliance with EAR can trigger fines, contract debarment, and criminal exposure
        - Internal export compliance program; BIS license applications for non-IEC country transfers
        - Material — international expansion constrained; hiring of foreign nationals requires deemed-export review
        - Obtain BIS export counsel opinion; verify license exception eligibility for target markets
      - - CMMC 2.0 DoD cybersecurity compliance (mandatory Nov 2025)
        - US DoD
        - Active — baked into DoD contracts as of Nov 2025; annual attestation required
        - Medium
        - Medium — lapse in CMMC compliance could jeopardize DoD contract eligibility
        - Internal cybersecurity posture management; third-party assessor engagement
        - Ongoing — compliance is annual; subcontractor flowdown obligations add complexity
        - Confirm C3PAO assessment schedule; verify all subcontractors meet CMMC Level 2
      - - ITAR and USML potential classification of AQNav quantum sensors
        - US (global)
        - Uncertain — AQNav sensors may be classified as ITAR defense articles if used in military systems
        - Low-Medium
        - High — ITAR misclassification triggers severe enforcement; retroactive classification possible
        - Commodity jurisdiction (CJ) request from DDTC to confirm EAR vs. ITAR classification
        - Material — if ITAR-controlled, international AQNav commercial sale requires State Dept authorization
        - File CJ request with DDTC; engage ITAR counsel before commencing international AQNav sales
    notes: >-
      Disclosure and valuation opacity are based on public information availability and are applicable to all late-stage
      private companies; no specific financial misconduct allegation is asserted. CMMC 2.0 and CNSA 2.0 timelines are
      from published DoD and NIST guidance. ITAR likelihood is analyst-estimated; no public ITAR enforcement action
      against SandboxAQ has been identified.
